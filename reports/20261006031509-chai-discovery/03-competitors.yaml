    rows:
      - [Chai Discovery, "Direct model platform", "Pharma and life-sciences R&D", "Open Chai-1 structure model plus gated later-generation design models", "No public list price; no in-house wet-lab or named research-system connectors"]
      - [Isomorphic Labs / AlphaFold, "Direct and adjacent model platform", "Large pharma and computational researchers", "Operator analysis characterizes major research-platform partnerships; review source presents AlphaFold as broad structure prediction", "This source set does not establish current commercial pricing or a like-for-like antibody-design benchmark"]
      - [Absci, "Wet-lab-integrated direct alternative", "Biopharma antibody programs", "Review source characterizes generative AI combined with in-house wet-lab validation", "No independently normalized outcome or pricing comparison is available in the assigned evidence"]
      - [BigHat Bio, "Wet-lab-integrated direct alternative", "Enterprise antibody programs", "Review source characterizes a tight AI and automated testing loop", "No independently normalized outcome or pricing comparison is available in the assigned evidence"]
      - ["Internal build using open models", "Internal-build substitute", "Well-resourced pharma, biotech, and academic teams", "Control over infrastructure, proprietary data, and validation workflow", "Requires scarce ML, compute, integration, governance, and wet-lab capacity"]
      - ["Traditional high-throughput screening", "Status-quo substitute", "Biopharma discovery organizations", "Established experimental workflow without dependence on a model vendor", "Review evidence describes it as slower and lower-yield, but this source set does not provide a normalized cost benchmark"]
    notes: >-
      Representative landscape, not an exhaustive census. Peer descriptions come from the assigned
      review and operator-analysis sources; unknown pricing and performance cells are not inferred.
    claimRefs: [CP002, CP003, CP011, CP014, CP015]
  - id: TP002
    title: Feature and capability matrix
    columns:
      - Buying criterion
      - Chai Discovery
      - Wet-lab-integrated AI rival
      - Internal build or status quo
      - Evidence limitation
    rows:
      - ["Model access", "Chai-1 self-operated; later design models application-gated", "Negotiated enterprise access in the reviewed comparison", "Open/self-operated models or owned process", "Commercial model terms are not public"]
      - ["Experimental execution", "Buyer makes and tests generated candidates", "Review sources describe in-house or automated wet-lab loops for named rivals", "Buyer directly owns laboratory workflow", "No normalized cycle-time comparison is available"]
      - ["Research-system integration", "No named ELN, LIMS, registry, or data-lake connector found by AI Health Index", "Unknown in assigned evidence", "Custom to buyer environment", "Absence of public documentation is not proof that integrations do not exist"]
      - ["Hosted-data and IP controls", "Retention, residency, reuse, and custom-model end-state terms not publicly specified", "Unknown in assigned evidence", "Potentially direct control, subject to internal governance", "Contract language is required for a decision"]
      - ["Independent outcome evidence", "Company-run results are described; independent replication is not established by this source set", "No comparable benchmark retained", "Buyer can validate against its own historical assays", "No common population, protocol, or denominator supports a league table"]
    notes: >-
      Cells summarize only the retained public evidence. "Unknown" means the assigned source set does
      not support a conclusion; it is not a negative product finding.
    claimRefs: [CP003, CP007, CP014, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Offer or path
      - Public price
      - Commercial model
      - Included scope
      - Buyer implication
    rows:
      - ["Chai-1", "No license fee stated in reviewed sources; buyer supplies compute", "Community/open-weight distribution described by third parties", "Structure prediction", "Compute, deployment, and support remain buyer costs"]
      - ["Chai-2 / Chai-3 access", "Not published", "Application-gated model license or annual agreement", "Generative molecular design access", "Budget and start date require qualification and negotiation"]
      - ["Custom partner model", "Not published", "Negotiated collaboration trained on proprietary partner data", "Partner-specific model and workflow scope", "Data rights, reuse, integration, and exit terms become central switching-cost drivers"]
      - ["Internal build / traditional workflow", "Not comparable from assigned evidence", "Owned capability and operating expense", "Models, people, compute, assays, and governance", "Higher internal burden may buy control and reduce vendor dependence"]
    notes: >-
      Public list prices, discount bands, royalty structures, implementation fees, and partner
      financial terms were not available in the retained sources; no price estimate is substituted.
    claimRefs: [CP004, CP013, CP014, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of public access openness (horizontal) and buyer versus vendor workflow ownership
      (vertical), intended for directional comparison rather than performance ranking.
    data:
      points:
        - label: Chai-1
          x: 5
          y: 1
          detail: "Self-operated open-weight structure model; experimental execution remains with the user."
        - label: Chai-2 / Chai-3
          x: 1
          y: 1
          detail: "Application-gated design access; public evidence describes Chai as model-only rather than wet-lab integrated."
        - label: Isomorphic / AlphaFold path
          x: 3
          y: 1
          detail: "Accessible non-commercial structure-prediction path plus negotiated commercial relationships, as characterized by review sources."
        - label: Absci
          x: 1
          y: 5
          detail: "Enterprise partnership alternative characterized by the review source as pairing AI with in-house wet-lab validation."
        - label: BigHat Bio
          x: 1
          y: 5
          detail: "Enterprise partnership alternative characterized by the review source as pairing AI with automated wet-lab testing."
        - label: Internal build
          x: 4
          y: 4
          detail: "Buyer controls more of the model, data, integration, and assay workflow but bears the operating burden."
        - label: Traditional screening
          x: 3
          y: 5
          detail: "Buyer-owned experimental status quo with no model-vendor dependency."
    approximationNotes: >-
      Analyst-authored ordinal positions: x=1 is selective negotiated access and x=5 is open or
      self-operated; y=1 is model-only and y=5 is laboratory-integrated or buyer-owned. Positions
      are categorical, not measured performance, price, quality, or market share.
    claimRefs: [CP003, CP011, CP014, CP015]
callouts:
  - calloutType: strength
    title: Differentiated two-tier access
    body: >-
      Chai can seed technical adoption through a self-operated structure model while reserving
      frontier design capability for enterprise relationships.
    claimRefs: [CP003, CP004]
  - calloutType: risk
    title: Contract structure may determine moat quality
    body: >-
      Public sources do not disclose whether partner-specific data and custom-model learning can
      compound across customers; data rights and bespoke engineering load require contract review.
    claimRefs: [CP011, CP016]
