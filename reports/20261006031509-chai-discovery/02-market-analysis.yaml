callouts:
  - calloutType: insight
    title: Venture Inflows vs Software Revenue Divergence
    body: A critical analytical challenge in sizing the AI drug discovery market is distinguishing venture capital financing volume ($3.8B to $11.4B invested in 2025) from actual commercial software licensing and collaboration spend ($2.35B total market size in 2025). High private valuations are driven by multi-year partnership headline figures that include speculative downstream clinical milestones, whereas current software ARR per customer remains tightly bounded.
    claimRefs:
      - CM005
      - CM006
      - CM008
  - calloutType: risk
    title: Clinical Attrition Risk Gating Software Value Capture
    body: 'While AI computational platforms like Chai-3 dramatically accelerate preclinical molecular design, they do not alleviate the dominant source of drug development risk: approximately 85% to 90% of therapeutic candidates fail during clinical trials. Until AI-designed molecules consistently demonstrate superior clinical phase transition rates, biopharma buyers will treat software fees as operational efficiency investments rather than paying massive unvalidated valuation premiums.'
    claimRefs:
      - CM014
      - CM015
