figures:
  - id: "FU001"
    title: "Enterprise Customer Journey and Platform Expansion Loops"
    type: "journey-map"
    summary: "Structural workflow illustrating the stages through which biopharmaceutical customers evaluate, deploy, customize, and renew Chai Discovery's AI platform."
    data:
      items:
        - label: "Stage 1: Scientific Validation"
          title: "Pre-Evaluation & Scientific Validation"
          description: "Pharma computational teams benchmark open-source Chai-1 structure prediction on public and internal datasets to verify biophysical modeling fidelity."
          touchpoints:
            - "Open-source Chai-1 repository access"
            - "BioRxiv preprint benchmark comparisons"
            - "Scientific conference symposiums and workshops"
        - label: "Stage 2: Enterprise Contracting"
          title: "Enterprise Platform Contracting"
          description: "Customer signs an enterprise software licensing agreement providing secure multi-user access to closed-source generative design models (Chai-2/Chai-3)."
          touchpoints:
            - "Executive sponsorship and R&D leadership review"
            - "Software licensing and IP-clean agreement execution"
            - "Secure cloud or on-premises environment setup"
        - label: "Stage 3: Custom Modeling"
          title: "Proprietary Data Integration & Custom Modeling"
          description: "Chai fine-tunes custom model weights exclusively for the customer using internal proprietary binding assays, chemical screens, and structural data."
          touchpoints:
            - "Customer proprietary dataset ingestion"
            - "Custom neural architecture fine-tuning"
            - "Workflow integration into customer LIMS and ELN"
        - label: "Stage 4: In Silico Lead Generation"
          title: "In Silico De Novo Antibody Generation"
          description: "Biologics discovery teams specify intractable target antigens and epitopes, generating full-length de novo antibody sequences within weeks."
          touchpoints:
            - "Target epitope and structural constraint specification"
            - "Automated candidate generation and developability scoring"
            - "Low-volume candidate selection for wet-lab synthesis"
        - label: "Stage 5: Wet-Lab Validation"
          title: "In Vitro Validation & Program Progression"
          description: "Customer synthesizes and evaluates predicted antibodies in wet-lab binding assays, comparing experimental hit rates against traditional screening baselines."
          touchpoints:
            - "High-throughput surface plasmon resonance (SPR) / cryo-EM"
            - "Developability, solubility, and immunogenicity filtering"
            - "Internal pipeline candidate selection"
        - label: "Stage 6: Renewal & Expansion"
          title: "Contract Renewal & Expansion Loop"
          description: "Customer expands model seats across additional therapeutic units or renews annual platform access as custom model accuracy increases with cumulative data."
          touchpoints:
            - "Annual software access license renewal"
            - "Additional therapeutic target allocations"
            - "Platform upgrade to next-generation foundation models"
    approximationNotes: "Conceptual enterprise customer journey map synthesized from corporate partnership disclosures and computational biology workflow conventions."
