chapter:
  number: 6
  title: "Customers"
  summary: "Chai Discovery has secured multi-target enterprise partnerships with four global pharmaceutical leaders—Eli Lilly, Pfizer, Novartis, and Bristol Myers Squibb—positioning its generative AI models as upstream computer-aided design infrastructure. However, the commercial model relies on software licensing and access fees rather than downstream drug asset ownership, while revenue terms, renewal durability, and real-world clinical translation remain unverified."
sections:
  - id: "enterprise-customer-segmentation"
    title: "Enterprise Customer Segmentation and Platform Economics"
    body: "Chai Discovery commercializes its biological foundation models primarily by targeting top-tier global pharmaceutical companies and commercial biotechs seeking to accelerate therapeutic biologics discovery. The company operates as a pure-play software and platform provider, offering access to its closed-source generative antibody design models alongside custom model variants fine-tuned on customer proprietary data. Rather than pursuing the traditional biotech co-development model that couples discovery milestones with downstream net-sales royalties, Chai intentionally monetizes through platform access and software licensing fees. This approach allows enterprise partners to retain full intellectual property ownership over resulting drug candidates and custom model weights, but it shifts the economic burden onto recurring contract renewals and limits Chai's ability to capture long-tail asset upside. Academic and early-stage computational researchers form a secondary adoption segment that utilizes the free, open-weights Chai-1 structure prediction model, functioning primarily as a top-of-funnel validation mechanism rather than a direct monetization driver."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-partner-proof-and-deployments"
    title: "Named Customer Proof, Commercial Traction, and Deployment Depth"
    body: "Between January and August 2026, Chai Discovery expanded its disclosed pharmaceutical customer roster from a single partner to four tier-one drugmakers: Eli Lilly, Pfizer, Novartis, and Bristol Myers Squibb. Commercial traction began with Eli Lilly in January 2026, structured around deploying Chai's platform across multiple biologic targets and building a custom AI model trained on Lilly's proprietary biochemical datasets. Pfizer followed in June 2026 with a license for Chai-3 that includes retraining on Pfizer's internal discovery data, while Novartis was disclosed as an active customer in July 2026 alongside Chai's $400 million Series C financing. In August 2026, Bristol Myers Squibb announced a multi-target collaboration integrating Chai's molecular folding and de novo design models into its discovery workflows. Despite these premier logos, every customer engagement remains preclinical; no Chai-designed therapeutic candidate has entered formal IND-enabling studies or human clinical trials, and deal values—such as a reported mid-eight-figure annual access fee for Lilly—remain unconfirmed third-party estimates."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention, Account Concentration, and Non-Exclusive Procurement Dynamics"
    body: "Chai Discovery faces severe customer concentration, with its commercial enterprise revenue base currently resting upon four disclosed pharmaceutical accounts. Although reporting indicates that the company is in discussions with fifteen or more additional prospective partners, contract terms, duration, and net revenue retention metrics remain strictly confidential. Crucially, none of Chai's pharma partners work with the startup on an exclusive basis: Eli Lilly operates parallel discovery pacts with Insilico Medicine, NVIDIA, and Schrödinger, alongside its proprietary TuneLab initiative. Furthermore, because Chai captures software fees rather than equity or milestone stakes in drug assets, its commercial success depends entirely on customer renewals and expanding model seats. If Chai's generative designs suffer from developability liabilities, off-target toxicity, or failure to translate beyond benchmark targets in customer wet labs, enterprise buyers face minimal friction in decommissioning access or shifting internal workloads to competing models such as Isomorphic Labs, Xaira Therapeutics, or EvolutionaryScale."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU002"
