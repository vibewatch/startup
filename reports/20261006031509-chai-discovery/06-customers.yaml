callouts:
  - calloutType: "risk"
    title: "High Account Concentration and Asymmetric Value Capture"
    body: "Chai Discovery's enterprise commercial strategy is subject to acute customer concentration risk: all confirmed commercial deployments are concentrated across just four pharmaceutical accounts (Lilly, Pfizer, Novartis, and BMS). By structuring contracts as software access and model licensing agreements without downstream milestone or royalty participation, Chai limits its revenue capture to annual fees regardless of whether customer molecules reach multi-billion-dollar commercial sales."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU012"
      - "CU014"
  - calloutType: "insight"
    title: "Custom Fine-Tuning as the True Enterprise Moat"
    body: "While public model architectures risk rapid commoditization as foundation models evolve across the industry, Chai's deployment model builds switching barriers by retraining custom model weights on each pharmaceutical customer's proprietary data. These private models become deeply embedded in partner discovery pipelines, creating high operational and technical friction against switching to rival AI platforms."
    claimRefs:
      - "CU002"
      - "CU007"
      - "CU014"
