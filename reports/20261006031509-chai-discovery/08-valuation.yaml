      - "Assumptions"
      - "Valuation / Return Logic"
      - "Probability Signal"
      - "Downside Trigger"
    rows:
      - ["Bull", "Repeat pharma deployments convert into disclosed recurring and milestone revenue; independent results validate technical performance.", "Upside to the $3.8B mark may become supportable, but no numeric range is defensible from current public inputs.", "Positive only after audited economics and repeat partner expansion.", "Partner programs fail to progress or economics remain immaterial."]
      - ["Base", "Partnership activity continues, but economics, margins, and program outcomes remain private.", "The headline mark remains ununderwritten; track rather than invest at that price.", "Current public evidence most closely supports this state.", "A financing requires equal or senior terms without operating disclosure."]
      - ["Bear", "Partner demand weakens, competitors close the technical gap, or independent validation disappoints.", "Material multiple compression or a down round is plausible; the equity floor is unknowable without preferences.", "Negative signals include partner disengagement or adverse technical readouts.", "A major partner exits, validation underperforms, or a new round prices below the latest mark."]
    notes: "Qualitative scenarios only. No probability weights or valuation ranges are estimated because public evidence lacks revenue, margins, contract economics, ownership, and preference terms."
