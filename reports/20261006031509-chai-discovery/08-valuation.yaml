chapter:
  number: 8
  title: "Valuation"
  summary: "Chai Discovery's latest public financing mark is $3.8B after a $400M Series C, but the reviewed sources do not disclose revenue, margins, contract economics, ownership, or preferences. The appropriate stance is research-more, with high risk and an expensive, presently ununderwritable entry price despite meaningful pharma adoption signals."
sections:
  - id: "decision-and-financing-context"
    title: "Decision and Financing Context"
    body: |
      Public evidence supports a $400M Series C in July 2026 and a $3.8B valuation, roughly triple the $1.3B mark reported for December 2025. It does not support a single precise cumulative-funding total: FundedIQ records $530M across two rounds, while Tracxn records $630M across four. That discrepancy matters because funding raised is neither revenue nor cash available, and it signals that even basic capitalization history requires management reconciliation. More importantly, the reviewed public record does not expose revenue, cash flow, margins, contract values, or the preference stack. The decision is therefore research-more rather than buy: commercial signals are credible enough to continue diligence, but the latest private price cannot be underwritten from public economics.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: |
      The thesis is that Chai is selling a molecular-design platform into large pharmaceutical workflows rather than relying only on a proprietary clinical pipeline. Its website describes a computer-aided design suite for molecules, and reviewed sources name relationships with Eli Lilly, Pfizer, Novartis, and Bristol Myers Squibb. Those relationships are evidence of enterprise interest, not proof of durable recurring revenue, attractive margins, or successful clinical translation. The anti-thesis is consequently financial and executional: a rapid valuation re-rating has preceded public disclosure of customer economics, while competitors named in the reviewed analysis are also well capitalized. A breach catalog showed no public Chai incident, but that absence is only catalog coverage and must not be treated as proof that security or confidentiality risk is absent.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-entry-discipline"
    title: "Scenarios and Entry Discipline"
    body: |
      A numeric bull/base/bear valuation range would create false precision because the public source set lacks the operating inputs needed for a revenue multiple, discounted cash-flow model, or ownership-adjusted return model. The scenarios should instead be treated as decision conditions around the latest $3.8B mark. The bull case requires disclosed recurring or milestone revenue from repeat pharma use, independently credible technical performance, and evidence that the platform can support more programs without margin erosion. The base case is continued partner activity with economics still opaque, which does not justify paying the headline mark. The bear case is multiple compression, partner retrenchment, or adverse technical results; without cap-table and preference data, even the downside equity floor is unknowable.
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV007"
      - "CV009"
      - "CV011"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Final Diligence"
    body: |
      The financing syndicate and pharma relationships create potential strategic-sale or eventual public-market paths, but the reviewed evidence does not establish exit readiness, a timing window, or a target return. Before setting an entry price, investors should obtain audited revenue and cash data, contract-level payment mechanics, renewal and concentration metrics, compute costs, the fully diluted cap table, and every liquidation preference. Technical diligence should connect model outputs to independently reviewed wet-lab results and partner program progression. Commercial diligence should confirm which relationships are paid, recurring, expanded, or merely exploratory. The thesis breaks if repeat deployments fail to convert into disclosed economics, a major partner disengages, independent validation materially underperforms company claims, or a new round requires structurally senior terms at or below the latest mark.
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV015"
      - "CV016"
