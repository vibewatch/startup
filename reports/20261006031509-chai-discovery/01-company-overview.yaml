callouts:
  - calloutType: "insight"
    title: "Software Licensing vs. Therapeutic Asset Co-Development"
    body: "Unlike traditional biotech discovery firms that pursue milestone- and royalty-heavy drug pipelines, Chai Discovery commercializes as an upstream computational design suite. By charging enterprise licensing and compute access fees, Chai generates near-term software revenue while insulating its balance sheet from binary clinical trial failure. However, this structure cedes downstream asset equity to pharma partners, capping long-term economic upside to contract renewals."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO014"
  - calloutType: "risk"
    title: "Severe Valuation Disconnect From Public Operating Metrics"
    body: "Chai Discovery's rapid valuation surge to $3.8 billion reflects intense venture competition for biological foundation models, yet the company discloses no annual recurring revenue, customer retention rates, or contract economics. Prospective investors face significant downside risk if commercial revenue growth fails to scale into the valuation multiple or if partner programs encounter wet-lab translation delays."
    claimRefs:
      - "CO010"
      - "CO013"
      - "CO016"
