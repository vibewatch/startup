callouts:
  - calloutType: insight
    title: Strategic Deconstruction in AI Tooling M&A
    body: The Windsurf transaction represents a landmark departure from conventional tech acquisitions, wherein foundational talent and technology licensing were separated from the commercial IDE distribution vehicle. While Google absorbed the core technical architects into Google DeepMind to enhance Gemini's coding capabilities, Cognition AI acquired an active $82M ARR enterprise customer base and IDE surface area.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
  - calloutType: risk
    title: Corporate Entity and Residual Governance Ambiguity
    body: Because the founding executive team departed to Google DeepMind while operating assets and ongoing customer support migrated to Cognition AI, standalone corporate diligence cannot analyze Windsurf as an independent equity investment. Ongoing governance and product development are now inextricably bound to Cognition AI's Devin roadmap.
    claimRefs:
      - CO008
      - CO011
      - CO013
