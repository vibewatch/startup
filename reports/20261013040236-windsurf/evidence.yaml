evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Comprehensive post-transaction cap table, governance charter, and board composition following the split asset
      purchase between Google and Cognition.
    whyItMatters: Obscures remaining minority rights, liquidation preferences, and current legal entity ownership structure.
    diligencePath: Request unredacted Delaware corporate merger filings and Cognition AI strategic purchase agreement disclosures.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited standalone financial statements, GAAP revenue, gross margin, and cash burn rate for Windsurf.
    whyItMatters: >-
      Reported $82M ARR and 36x transaction multiples cannot be audited against GAAP revenue or gross margins without
      certified financials.
    diligencePath: Review historical Exafunction Inc. audit workpapers and Cognition consolidated financial disclosures.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-unit-economics
    missingEvidence: >-
      Audited gross margins, cloud hosting expenses, and model inference API costs for Windsurf / Devin Desktop under
      Cognition AI.
    whyItMatters: >-
      Agentic IDEs incur heavy multi-turn LLM inference costs that directly determine gross margin durability and
      long-term pricing sustainability.
    diligencePath: Request private financial disclosures from Cognition AI regarding compute expenditure per active user tier.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: enterprise-seat-retention
    missingEvidence: >-
      Net revenue retention (NRR) and logo churn rates among the 350+ enterprise customers following the Google carve-up
      and Cognition rebranding.
    whyItMatters: >-
      Rapid succession of ownership changes and rebranding to Devin Desktop may introduce customer churn risks among
      conservative enterprise accounts.
    diligencePath: Conduct reference calls with enterprise IT leaders using Windsurf / Devin Desktop to measure renewal intentions.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: corporate-restructuring
    missingEvidence: >-
      Detailed audited financial terms, retention packages, and IP revenue-sharing agreements between Google, Cognition,
      and Windsurf shareholders across the 2025 split transactions.
    whyItMatters: >-
      Obscures the exact long-term economic claims on Windsurf product revenue and the degree of ongoing talent
      commitment to the desktop IDE.
    diligencePath: >-
      Request definitive transaction agreements and cap table capitalization records from Cognition management during
      formal underwriting.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Audited gross margin and inference compute cost data per developer seat for Windsurf's Cascade multi-file agent
      compared to Cursor's model routing.
    whyItMatters: >-
      High inference cost on multi-file agent workflows can create negative gross margins at fixed $15 to $30 monthly
      seat prices without strict usage rate-limiting.
    diligencePath: Review vendor LLM token consumption logs, cloud hosting invoices, and per-seat contribution margin data.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-underwriting-gaps
    missingEvidence: >-
      Audited financial statements, gross margin percentages, compute inference expenses, and customer cohort retention
      schedules for standalone Windsurf.
    whyItMatters: >-
      Without audited gross margin and net revenue retention data, standalone unit economics and ongoing cash burn
      cannot be validated for investment underwriting.
    diligencePath: >-
      Request historical management accounts, cloud compute billing ledgers, and audited financial statements directly
      from Cognition AI and predecessor entities.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: runtime-benchmarks
    missingEvidence: >-
      Audited multi-file execution latency benchmarks, peak memory footprint under large mono-repos, and daily Cascade
      quota depletion rates across production enterprise engineering teams.
    whyItMatters: >-
      Without independent runtime telemetry, evaluating real-world developer productivity gains versus quota
      interruption frequency remains dependent on vendor claims and anecdotal user reports.
    diligencePath: >-
      Request production telemetry logs from Cognition enterprise deployments showing median Cascade task execution
      latency, agent retry rates, and quota exhaustion distributions across developer cohorts.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: ip-licensing-split
    missingEvidence: >-
      Confidential terms of the cross-licensing agreement between Google DeepMind and Cognition regarding proprietary
      Cascade patents, Fast Context algorithms, and SWE-1 model weights.
    whyItMatters: >-
      The exact boundary between Google DeepMind's non-exclusive license and Cognition's retained IP governs whether
      Google can replicate Cascade's core indexing mechanisms inside Antigravity or Gemini.
    diligencePath: >-
      Review intellectual property schedules and non-compete/licensing carve-out documents in Cognition's acquisition
      ledger during confirmatory legal diligence.
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, customer churn, renewal rate, contract length, seat expansion, and post-transaction cohort retention.
    whyItMatters: Without cohort evidence, customer-count and ARR reports cannot establish durable retention or expansion.
    diligencePath: >-
      Request customer-level cohort schedules, renewal history, and contract-duration data from Cognition management and
      reconcile them to billing records.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named enterprise customers with attributable production scope, deployment date, measured outcome, and current
      reference status.
    whyItMatters: >-
      An aggregate customer count cannot distinguish paid pilots, active production deployments, or retained reference
      accounts.
    diligencePath: Obtain a current customer list and contact a representative sample of enterprise buyers for reference calls.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-one, top-five, and top-ten customer revenue concentration plus channel or platform dependence.
    whyItMatters: Reported ARR and customer count do not reveal whether revenue is concentrated in a small number of contracts.
    diligencePath: Review the customer revenue ledger, channel agreements, and renewal calendar under confidentiality.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Definitive contractual terms, indemnities, and ongoing IP license scope between Google, Cognition AI, and legacy
      Exafunction Inc.
    whyItMatters: >-
      Without the underlying transaction contracts, subsequent investors and enterprise buyers cannot verify residual
      legal exposure, liability boundaries, or potential future IP claims.
    diligencePath: >-
      Review the July 2025 Google licensing agreement, Cognition asset purchase agreement, and Exafunction corporate
      dissolution records in diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: transaction-rights
    missingEvidence: >-
      Executed Google license and talent agreements plus Cognition acquisition schedules defining transferred and
      retained intellectual-property rights.
    whyItMatters: >-
      The documents determine whether Cognition owns the rights needed to preserve product differentiation and economic
      value.
    diligencePath: >-
      Obtain executed agreements, IP schedules, employee assignment records, and counsel's ownership opinion from
      Cognition.
    relatedQuestionRefs:
      - QV002
      - QV007
  - type: missing-source
    severity: material
    topic: post-acquisition-financials
    missingEvidence: >-
      Audited or board-grade post-acquisition revenue, ARR definition, net retention, gross margin, customer
      concentration, burn, and cash data.
    whyItMatters: >-
      Without current operating economics, neither a standalone range nor a contribution value inside Cognition can be
      underwritten.
    diligencePath: >-
      Request Cognition's post-acquisition monthly financial package and reconcile customer cohorts to executed
      contracts and cash receipts.
    relatedQuestionRefs:
      - QV003
      - QV004
      - QV006
      - QV008
  - type: private-evidence-only
    severity: material
    topic: capitalization-rights
    missingEvidence: >-
      Current capitalization, preference stack, investor rights, employee-option treatment, and any security through
      which Windsurf-linked exposure could be purchased.
    whyItMatters: >-
      Instrument rights, dilution, and liquidation preferences determine entry value and whether a direct investment
      case exists.
    diligencePath: >-
      Review the current capitalization table, charter, investor-rights agreements, option treatment, and proposed
      purchase instrument with counsel.
    relatedQuestionRefs:
      - QV007
      - QV008
