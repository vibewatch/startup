chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创始根基与领导层分拆
        blocks:
          - type: paragraph
            body: >-
              Windsurf 于 2021 年在加州 Mountain View 以 Exafunction, Inc. 开始运营，由 MIT 校友 Varun Mohan 和 Douglas Chen
              创立。公司最初定位为系统优化企业，为机器学习负载开发最大化 GPU 利用率的基础设施；2022 年转向推出 Codeium。Codeium 提供免费 AI 代码补全扩展，正面挑战 GitHub
              Copilot。2024 年末，公司围绕 Windsurf Editor 重塑品牌，将其定位为建立在 Visual Studio Code 基础上的 AI 原生集成开发环境。核心技术差异化来自
              Cascade：这一智能体式编程助手能够自主执行多文件重构、检查终端输出并修复编译错误。2025 年 7 月，OpenAI 的拟议收购告吹后，Google DeepMind 通过许可安排吸纳 Varun
              Mohan、Douglas Chen 及核心工程团队；Cognition AI 则收购运营产品资产和客户合同。
