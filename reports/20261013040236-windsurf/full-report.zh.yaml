  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              AI 原生代码编辑器的市场边界处于开发者体验工具、集成开发环境（IDE）和自主软件工程智能体的交叉处。历史上，开发者工具支出主要用于 JetBrains 等 IDE 的软件许可、代码托管与 CI/CD
              平台，以及静态分析 lint 工具。生成式 AI 兴起后，AI 代码生成与辅助成为新的支出类别。第一代工具如 GitHub Copilot 是提供行内单行自动补全的轻量编辑器扩展；第二代平台如
              Windsurf（原 Codeium）则把产品扩展为完整的 AI 原生 IDE。这些环境集成了自主智能体系统，尤其是 Windsurf 的
              Cascade，可进行多文件推理、全仓索引、终端命令执行和架构重构。本市场边界严格排除通用原始算力托管（如 GPU 云基础设施）、企业 ERP
              应用和传统项目管理软件，聚焦开发者席位生产力。现状替代方案包括未配备智能体的标准 IDE（原生 VS
              Code、IntelliJ）、工程师需手动复制粘贴代码的网页聊天机器人（ChatGPT、Claude、Gemini），以及内部定制脚本生成器。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 约束
        blocks:
          - type: paragraph
            body: >-
              估算 AI 编程工具的可触达总市场，需要多个分析视角，而不是一个一体化预测。自上而下看，市场情报跟踪机构的行业基准显示，全球 AI 编程工具市场 2026 年约为 $6.0B–$9.5B，复合年增长率为
              22%。这一市场位于全球 $45B 开发者工具和 IT 开发基础设施支出之内，而后者又以估计 $500B 的全球软件工程工资池为参照。从自下而上的开发者人口看，JetBrains 开发者调研显示，2026 年
              84% 的软件工程师主动使用 AI 编程工具，较 2024 年的 41% 大幅提升。但商业变现受企业支付意愿约束：仅 18% 的开发者表示雇主为其 AI 编程工具买单，31% 用个人信用卡自费，35%
              完全依赖免费层。因此 SAM 受限于企业赞助的工程席位和高意向专业订阅者，估计为 $2.5B。在这一细分市场内，独立智能体 IDE 的 SOM 约为 $650M；Windsurf 在 2025 年 7 月被
              Cognition AI 战略收购前，捕获了 $82M ARR。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
