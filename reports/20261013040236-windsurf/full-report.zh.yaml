              - CP008
      - number: '3.4'
        title: 护城河耐久性、平台脆弱性与结构性风险
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的公司历史和平台依赖带来显著战略逆风，也引发护城河耐久性疑问。OpenAI 于 2025 年夏季放弃拟议的 $3B 收购后，Windsurf 被三方拆分：Google 以 $2.4B
              签下人才与许可协议，将原始创始团队招入 Google DeepMind。Cognition AI 以 $250M 收购剩余 Windsurf IDE
