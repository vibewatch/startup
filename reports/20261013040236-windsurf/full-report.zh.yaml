      - number: '5.3'
        title: 核心技术栈、Fast Context 与模型路由
        blocks:
          - type: paragraph
            body: >-
              Windsurf 底层采用多层技术架构，覆盖客户端呈现、本地索引、智能体编排和混合模型路由。代码库理解由 Fast Context
              引擎支撑：这一专有后台索引服务构建项目符号和跨模块引用的抽象语法图，无需工程师手动标记文件或维护僵化上下文标记。与 Fast Context 配套的是自适应 Memories 系统，它被动观察开发者约 48
              小时的编码习惯、命名模式和项目约定，用于个性化后续代码生成。模型推理采用动态多模型路由，把轻量补全发送给内部 SWE-1 模型，把复杂多步推理留给 Anthropic Claude Sonnet 4.6 和
              OpenAI GPT-4o 等外部前沿模型。工具集成标准化采用 Anthropic 开放的 Model Context Protocol，使 Cascade 能在严格的零数据保留和 SOC 2 Type II
              合规控制下，安全连接外部服务、HashiCorp Terraform 等基础设施即代码注册表，以及 Vault 和 1Password 等密钥管理器。
