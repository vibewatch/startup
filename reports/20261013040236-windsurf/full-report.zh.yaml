      - number: '3.2'
        title: 架构、智能体能力与开发者体验
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的主要技术差异化来自 Cascade 智能体架构和 Flows 运营框架。传统开发者助手只提供被动行内建议，而 Cascade 保持完整代码库上下文和持久化工作区
              Memories，可自主编辑多文件、执行终端命令和解决单元测试。Windsurf 的 Flows 模型把实时结对编程自动补全与自主智能体操作顺畅衔接，降低工程师在认知模式间切换的摩擦。由于 Windsurf
              直接建立在开源 Visual Studio Code 分支上，开发者可以一键迁移配置、自定义键绑定和市场扩展。但这种架构相似性也降低了切换成本，开发者会根据具体模型偏好、配额上限和感知延迟，在 Windsurf
              与 Cursor 之间频繁多栖使用。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
