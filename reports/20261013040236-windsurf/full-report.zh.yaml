  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 有序决策链将历史战略价值与当前可作投资判断的独立标的区分开来。
    data:
      nodes:
        - id: historical-financing
          label: 历史融资
          detail: 总融资 $243M；各来源对 2024 年轮次估值的记载不同
        - id: failed-bid
          label: 全公司提案未成
          detail: OpenAI 约 $3B 的收购未完成
        - id: executed-split
          label: 已执行拆分
          detail: Google 许可与人才交易；Cognition 收购剩余业务
        - id: operating-proof
          label: 运营证据
          detail: 产品延续性清晰可见，但 ARR 截面尚未对账
        - id: valuation-gap
          label: 估值缺口
          detail: 没有当前独立工具或收购后经审计的财务包
        - id: decision
          label: 决策
          detail: 避免直接投资独立标的；只有在权利与经济条件明确后才重新评估
    approximationNotes: 数值是历史二手来源参考；该流程不表示交易结构或指标可直接比较。
