      layers:
        - label: 客户端呈现与 IDE 层
          detail: 基于 Electron 的 Visual Studio Code 桌面分叉，支持 macOS、Windows 与 Linux，具备原生快捷键并兼容 Open VSX 插件市场。
        - label: 上下文索引与记忆层
          detail: 专有 Fast Context 引擎无需手动标记即可构建全项目依赖图，并配合自适应 Memories 在 48 小时内学习开发者习惯。
        - label: Cascade 代理编排层
          detail: 多步推理引擎支持 Write、Chat 与 Plan 模式、并行多代理会话、Git worktree 隔离及集成终端执行。
        - label: 推理与模型路由网关
          detail: 混合模型路由将代码请求分发至专有 SWE-1 模型、Anthropic Claude Sonnet 4.6、OpenAI GPT-4o 与 Google Gemini。
        - label: 工具调用与 MCP 协议网关
          detail: Model Context Protocol 服务器集成，将 Cascade 连接至 HashiCorp Terraform 注册表、Vault、1Password 与外部企业数据库。
        - label: 企业安全与治理层
          detail: 符合 SOC 2 Type II 的环境，默认零数据留存，具备 FedRAMP High 可用性与隔离的企业隐私模式。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 以证据为边界的旅程：从免费试用，到企业采用、产品扩张，再到所有权转移后的重新评估。
    data:
      items:
        - label: 免费试用
          detail: 个人用户先测试自动补全和受限代理工作流，再决定付费。
          touchpoints:
            - 免费计划
            - 开发者工作流
        - label: 个人付费使用
          detail: 实践者采用 Pro，用于活跃代码库的重构、实现与调试。
          touchpoints:
            - Pro 订阅
            - Cascade
        - label: 团队评估
          detail: 工程经理评估共享管理与多席位使用。
          touchpoints:
            - Teams 计划
            - 团队工作流
        - label: 企业采购
          detail: 工程、安全、IT 与采购团队评估组织级部署。
          touchpoints:
            - 企业合同
            - 安全评审
        - label: Devin 扩张闭环
          detail: 拟议的组合工作流从 Windsurf 规划转向 Devin 委派与拉取请求评审。
          touchpoints:
            - Windsurf 编辑器
            - Devin
            - 拉取请求
        - label: 延续性重新评估
          detail: 所有权转移后，客户重新评估路线图、支持、集成与续约风险。
          touchpoints:
            - Cognition 路线图
            - 供应商评审
    approximationNotes: 这是一条根据报道中的计划分层与工作流描述整理的定性旅程；没有推断转化率或各阶段人数。
