        title: 战略里程碑与 2025 年并购拆解
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的战略轨迹既体现产品创新速度，也暴露现代 AI 交易的复杂结构约束。公司 2021 年成立后，经历 2022 年 Codeium 发布、2024 年风险融资以及 2024 年 11 月
              Windsurf Editor 首发。2025 年初，OpenAI 试图以 $3B 收购 Windsurf，以建立可与 Microsoft GitHub Copilot 抗衡的原生 IDE 阵地。但
