  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 交易边界与历史估值标记
        blocks:
          - type: paragraph
            body: >
              Windsurf 的历史融资证明了战略需求，却不能确定当前进入价格。Tracxn、FreeMalta 和 Netfigo 报告总融资额 $243M；关于 2024 年 8 月 Series C 的资料则把
              $150M 轮次的投后估值置于 $1.0B–$1.3B。Tracxn 另将 2025 年 5 月的最近已知估值标为 $3B，多份来源则把约 $3B 描述为 OpenAI
              失败收购提案的价格。这些数字对应不同日期和交易概念，把它们当作连续的股权估值序列会制造虚假精确度。

              已执行的交易改变了可投资边界。资料将 Google 的 $2.4B 交易描述为非独家技术许可加人才转移，而非股权购买或控制权转移。另有资料称 Cognition
              随后收购了剩余产品、品牌、知识产权、客户基础和运营。因此，保留下来的证据支持分析 Cognition 内部被收购的产品，而不是承销一项明确发售的独立 Windsurf 证券。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: 运营证据与估值限制
        blocks:
          - type: paragraph
            body: >
              公开运营证据显示交易前势头可观，但一致性不足，无法计算精确倍数。M&A Equilibrium 和 AgentMarketCap 报告 2025 年分拆前后 ARR 约 $82M、企业客户超过 350
              家；FreeMalta 则报告 2025 年 4 月 ARR 约
              $100M。期间、方法和来源链尚未对账，指定来源均未提供审计收入、毛利率、留存、烧钱、现金或收购后的分部桥接。用这些时点快照计算的收入倍数只能作为说明，而非可用于决策的估值。

              产品连续性比财务连续性更清晰。两份 2026 年评测来源将 Windsurf 描述为活跃的智能体编程工具，WeavAI 列出 Cognition
              所有权下的订阅层级。这些证据支持产品论点，却不能证明可分离的企业价值。正面论点是 IDE 持续分发且客户基础已装机；反面论点是，所有权、领导层、IP 权利和财务报告已经脱离了筹集 2024 年融资轮的独立公司。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.3'
        title: 情景框架与可比参考
        blocks:
          - type: paragraph
            body: >
              合适的模型可比集合必须区分私募融资估值标记、未完成的整公司竞价、许可与人才交易，以及剩余资产收购。2024 年融资区间、OpenAI 失败提案、Google 已执行的许可与人才付款，以及据报道 Cognition
              的对价，都是战略参考点，而非可直接比较的股权倍数。当前无法支持独立估值区间，因为保留证据没有识别出已发售的 Windsurf 工具、收购后审计财务报表或任何证券附带的权利。

              因此，乐观情景是有条件的而非数值化的：如果当前留存和变现得到验证，保留的客户和活跃产品分发可在 Cognition 内部创造价值。基准情景是产品继续运营，但没有可分离的 Windsurf
              价值。悲观情景是客户流失、领导层分离、IP 边界不清或定价压力造成减值。这些情景刻意不纳入没有依据的回报率和估值端点。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 建议、重启条件与尽调要求
        blocks:
          - type: paragraph
            body: >
              建议避免直接投资独立的 Windsurf，并将其独立估值立场归类为未知。之所以对这一建议只有中等置信度，是因为多方来源一致认为，在 Google 单独完成交易后，Cognition
              收购了剩余业务；但由于留存证据中缺少当前财务数据、交易文件、资本结构、优先股堆叠和可投资证券，对任何数值估值的置信度都很低。这是一个对价格敏感的判断：历史估值不能替代当前工具条款。


              尽调团队只有通过明确的 Cognition 关联工具或其他有法律文件支持的工具，才应重新审视此案。最低限度的证据包括已签署的收购和 IP 许可文件、按 cohort 划分的当前 ARR
              与净留存率、扣除模型和推理成本后的毛利率、客户集中度与流失率、现金与消耗、资本结构与优先股堆叠，以及员工和投资者权利的处理方式。触发论点失效的因素包括企业客户流失、无法确立清晰的 IP
              所有权，或入场价格隐含了没有证据支持的独立增长。
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
