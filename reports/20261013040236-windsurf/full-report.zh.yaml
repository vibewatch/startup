  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与主要参与者
        blocks:
          - type: paragraph
            body: >-
              2026 年 AI 辅助软件工程的竞争格局，正快速分化为既有开发者工具套件和 AI 原生智能体环境。GitHub Copilot 背靠 Microsoft 的分发能力和对 Visual Studio Code
              的深度掌控，在全球软件企业中占据最大规模份额。同时，Anysphere 开发的 Cursor 已成为领先的独立 AI 原生代码编辑器，凭借快速的多行预测补全和后台智能体工作流实现异常收入增长。Windsurf
              曾以 Cascade 智能体率先实现深度代码库推理，随后于 2025 年末被 Cognition AI 收购，在生态中占据关键战略位置。与桌面 IDE 互补的终端原生智能体，如 Anthropic 的
              Claude Code，则在重视命令行自主性而非图形界面扩展的高级开发者中拥有较高心智份额。
            claimRefs:
