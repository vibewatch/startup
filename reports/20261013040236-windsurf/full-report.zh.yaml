  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Windsurf 从 GPU 虚拟化发展到代理式 IDE，再到多方公司拆分的时间顺序。
    data:
      items:
        - label: Exafunction 成立
          date: '2021'
          details: Varun Mohan 与 Douglas Chen 创立 Exafunction，旨在优化机器学习工作负载的 GPU 利用率。
          tone: neutral
        - label: Codeium 转型与发布
          date: '2022'
          details: 转向 AI 编程领域，推出免费自动补全插件，直接与 GitHub Copilot 竞争。
          tone: positive
        - label: B 轮融资
          date: 2024-01
          details: 获得由 Kleiner Perkins 领投的 $65M B 轮融资，投后估值 $500M。
          tone: positive
        - label: C 轮融资
          date: 2024-08
          details: 获得由 General Catalyst 领投的 $150M C 轮融资，估值 $1.25B，成为独角兽。
          tone: positive
        - label: Windsurf IDE 与 Cascade 发布
          date: 2024-11
          details: 公司更名为 Windsurf，并推出搭载 Cascade 代理的独立 AI IDE。
          tone: positive
        - label: OpenAI $3B 收购告吹
          date: 2025-07
          details: OpenAI 提议的 $3B 收购因 Microsoft IP 合同约束范围及排他期届满而告吹。
          tone: negative
        - label: 三方拆分（Google 与 Cognition）
          date: 2025-07
          details: Google 执行 $2.4B 反向收购与许可交易；Cognition 以约 $250M 收购 IDE 产品、品牌与合同。
          tone: warning
        - label: Cognition 整合与市场进展
          date: 2026-04
          details: Windsurf 在开发者工具排名中位列第 1，在 Cognition 旗下借助 Devin 平台协同效应将 ARR 做到 $82M。
          tone: positive
    approximationNotes: 里程碑日期来自公开融资公告、产品发布通知及经核实的并购调查报道。
