      - number: '3.3'
        title: 定价、产品打包与企业变现
        blocks:
          - type: paragraph
            body: >-
              AI 编程工具的商业打包迅速趋向分层订阅，原因是多文件代码库推理需要高昂的推理算力。Windsurf 采用四层结构：免费社区层、$15/席位/月的个人 Pro 层、$30/席位/月的协作 Teams 层，以及
              $60/席位/月的 Enterprise 层。2026 年 3 月，Windsurf 用可预测的分层订阅配额替代复杂的可变积分核算，直接改善用户留存。其 Pro 层比 Cursor 的 $20/月订阅便宜
              $5，并借助免费层和入门层自然吸引开发者。但所有厂商都面临维持有利毛利率的挑战：复杂智能体重构消耗大量 LLM token，若不严格限流，可能超过固定费率订阅收入。
            claimRefs:
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
