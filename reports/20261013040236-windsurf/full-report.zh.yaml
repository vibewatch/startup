      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 公司结构拆解与资本结构悬置
            body: >-
              2025 年 7 月的三方拆分把 Windsurf 拆成转给 Google 的 $2.4B 人才 / 许可交易，以及卖给 Cognition 的约 $250M 资产交易。这一结构实际上抹去了 Windsurf
              独立公司的清晰股权故事，使老股东和后续投资者暴露于 Cognition 的内部整合优先级。
