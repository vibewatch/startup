              在 2025 年公司分拆前，Windsurf 通过机构融资轮累计筹得约 $243M。2024 年 1 月，公司完成由 Kleiner Perkins 领投的 $65M Series B，投后估值
              $500M，General Catalyst 和 Greenoaks Capital 参与。2024 年 8 月，General Catalyst 领投 $150M Series C，按 $1.25B
