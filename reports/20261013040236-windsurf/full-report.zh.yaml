      - number: '7.4'
        title: 财务模型可持续性、稀释与终止标准
        blocks:
          - type: paragraph
            body: >-
              公司重组前，Windsurf 在超过 350 个企业账户中实现 $82M ARR，证明了真实的产品市场势头。但三方分拆实质拆除了独立股权叙事：$1.2B 许可收益分给老股东，另 $1.2B
              分给离任人员，Cognition 则以大幅资产折价吸收剩余运营。评估合并实体的投资者面临显著资本结构悬置、估值重置和未经验证的商业协议。明确的论点破坏触发因素包括模型推理单位成本上升、遗留公司结构尚未解决的 IP
              赔偿主张，以及开发者转向 Cursor 等模型无关替代品。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
