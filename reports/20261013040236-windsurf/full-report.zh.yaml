      - number: '7.3'
        title: 平台依赖、模型供应商变化与锁定
        blocks:
          - type: paragraph
            body: >-
              Windsurf 对基础模型供应商和开发平台生态存在多重对手方依赖。作为 AI 原生 IDE，平台高度依赖 OpenAI、Anthropic 和 Google 等供应商的前沿大语言模型来驱动多文件 Cascade
              智能体。供应商突然调价、弃用模型或设置速率限制，可能直接挤压运营利润率或损害延迟表现。同时，Windsurf 对开源 VS Code 架构的基础依赖，也使产品暴露于平台风险：Microsoft
              可能调整上游许可、改变扩展市场政策，或给予 GitHub Copilot 原生优待。
            claimRefs:
