      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              AI 原生代码编辑器的采购呈现双向销售漏斗：自下而上的开发者产品驱动增长（PLG）和自上而下的企业软件采购。             
              个人工程师和承包商先通过提供不限量自动补全的免费增值层采用软件，再用个人支出卡升级每月 $20 的 Pro 方案。需要团队协作时，预算归属转移至工程经理和工程总监，他们采购 $40/用户/月的 Team
              方案，以获得集中式管理计费、共享团队 Memories
              和统一索引策略。在企业规模，采购决策上移至工程副总裁、首席信息官（CIO）和首席信息安全官（CISO）。企业买方不只看生产力指标，还会按严格安全标准评估软件。Windsurf Enterprise 通过
              Privacy Mode（保证客户专有代码不用于 LLM 模型训练）、SOC 2 合规、SAML/SSO 认证和自托管本地部署来满足这些门槛。2026 年 3
              月，定价从用量积分调整为配额分层；这一结构化转变表明变现框架正走向成熟，以从重度用户中提取最大价值。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 采用驱动、切换壁垒与企业约束
        blocks:
          - type: paragraph
            body: >-
              智能体 IDE 的加速采用由明确的工程 ROI 推动：Cascade 等多文件推理引擎，以及 SWE-1.5 等专用模型架构，大幅缩短开发者完成任务和浏览代码库所需的时间，降低认知负担。Model Context
              Protocol（MCP）的原生集成还让编辑器可以把代码库直接接入外部 issue 跟踪器、拉取请求流程和可观测性基础设施。不过，企业扩张仍受结构性约束。尽管 Windsurf 提供完整的 VS Code
              扩展市场兼容性以降低迁移摩擦，开发者对既有 IDE 快捷键和专用插件生态的肌肉记忆仍构成显著切换成本。更关键的是，企业采用受模型延迟、复杂重构中的幻觉和 IP 治理问题拖累。OpenAI 于 2025 年 7
              月放弃以 $3B 收购 Windsurf 的计划，部分原因是 Microsoft IP 纠葛；随后 Google 以 $2.4B 完成许可与人才交易，Cognition AI 以 $250M
              收购资产，进一步凸显编码 IP 的战略敏感性。Cognition 于 2026 年 6 月将 Windsurf 更名为 Devin Desktop，意味着交互式编辑器正继续与完全自主的后台软件工程智能体整合。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 智能体 IDE 分化：补全与自主任务
            body: 开发者工具市场正分化为两种定价层：每用户每月 $10–$19、由规模驱动的补全插件（以 GitHub Copilot 为例），以及按可衡量的工程任务速度计费、每月 $20–$200 的自主多文件智能体环境。
            calloutType: insight
            claimRefs:
              - CM005
