  - id: TE002
    title: Workflow / use-case table
    columns:
      - Developer Job
      - Traditional Workflow
      - Windsurf Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Cross-file API refactoring
        - Manual grep, file-by-file search-and-replace, manual compilation checking
        - Cascade multi-file dependency graph traversal and automated atomic replacement
        - Drastic reduction in manual boilerplate edits across dozens of files
        - Risk of hallucinated signatures in unindexed dynamic languages
      - - Onboarding to unfamiliar repos
        - Reading static READMEs, manual architecture walkthroughs, trial-and-error debugging
        - Fast Context indexing combined with conversational architecture exploration in Chat Mode
        - Immediate contextual awareness without manual file tagging
        - Initial indexing delay on massive enterprise repositories
      - - Enforcing style and conventions
        - Rigid external linter rules, manual code review nitpicks
        - Adaptive Memories capturing repository idioms and naming patterns over 48 hours
        - Progressively tailored suggestions that match team code style
        - Memories decay or inconsistency across multi-repo developer contexts
      - - Executing terminal commands
        - Switching between terminal and editor, manual command drafting and checking
        - Cascade integrated terminal with configurable auto-execution approval levels
        - Closed-loop command execution and error recovery in one interface
        - Potential execution of unintended commands under Turbo mode
    notes: Workflow analysis synthesized from technical evaluations and developer reviews; performance varies with codebase size and language server support.
    claimRefs:
