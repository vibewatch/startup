chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Leadership Split
        blocks:
          - type: paragraph
            body: >-
              Windsurf began operations in 2021 as Exafunction, Inc., founded in Mountain View, California, by MIT
              alumni Varun Mohan and Douglas Chen. Initially conceived as a systems optimization company developing
              infrastructure to maximize GPU utilization for machine learning workloads, the business pivoted in 2022 to
              launch Codeium. Codeium offered a free AI-powered code-completion extension aimed squarely at challenging
              GitHub Copilot. In late 2024, the enterprise rebranded around Windsurf Editor, an AI-native integrated
              development environment built on a Visual Studio Code foundation. The core technological differentiator
              was Cascade, an agentic programming assistant architected to execute multi-file refactoring, inspect
              terminal output, and fix compilation errors autonomously. In July 2025, after a planned acquisition by
              OpenAI fell apart, Google DeepMind recruited Varun Mohan and Douglas Chen alongside key engineering staff
              under a licensing arrangement, while Cognition AI acquired the operational product assets and customer
              contracts.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO011
              - CO013
