  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and IP Exclusivity Exposure
        blocks:
          - type: paragraph
            body: >-
              The aborted $3 billion acquisition by OpenAI highlighted the severe legal and intellectual property
              constraints governing Windsurf's technology assets. Negotiations collapsed primarily due to pre-existing
              contractual covenants between OpenAI and Microsoft that grant Microsoft sweeping access rights to any
              intellectual property acquired by OpenAI through 2030. Because Windsurf demanded strict exclusion of its
              proprietary IDE technology from Microsoft's competitive reach, the acquisition stalled and ultimately
              failed. In response, Google executed a $2.4 billion reverse acquihire and licensing transaction that
              secured non-exclusive technology access and poached executive leadership without formally acquiring the
              underlying corporate entity, leaving residual IP liabilities and contractual indemnities divided across
              successor organizations.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
