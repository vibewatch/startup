      - number: '4.3'
        title: Unit Economics, Inference Cost Structure, and Gross Margin Bridge
        blocks:
          - type: paragraph
            body: >-
              The underlying unit economics of agentic software development differ fundamentally from conventional
              software-as-a-service businesses due to heavy operational dependency on third-party foundation model
              inference and high-performance GPU infrastructure. For Windsurf, delivering complex Cascade multi-file
              reasoning, continuous workspace indexing, and automated terminal debugging incurs variable compute cost of
              goods sold with every user query. When developers utilize frontier models such as Claude Sonnet or OpenAI
              GPT variants, token consumption scales with repository size and reasoning complexity, creating severe
              margin compression risks for fixed-price unlimited tiers. This architectural cost dynamic drove Windsurf's
              early 2026 pricing adjustments, which established a high-end Max tier at two hundred dollars monthly to
              offset heavy token consumption and capped lower-tier credits. In the absence of audited management
              accounts, the blended gross profit margin delivered on Windsurf's eighty-two million dollar ARR base
              remains unverified. Public investors cannot determine whether standalone gross margins conformed to
              typical software benchmarks of seventy to eighty percent or compressed toward infrastructure-heavy ranges
              below fifty percent, representing a primary diligence blocker for underwriting the platform's independent
              cash economics.
            claimRefs:
