      - number: '7.3'
        title: Platform Dependencies, Model Provider Shifts, and Lock-In
        blocks:
          - type: paragraph
            body: >-
              Windsurf faces multi-faceted counterparty dependencies across foundation model providers and development
              platform ecosystems. Operating as an AI-native IDE, the platform relies heavily on frontier large language
              models from providers such as OpenAI, Anthropic, and Google to power its multi-file Cascade agent. Sudden
              price adjustments, model deprecations, or rate limits from these providers could directly compress
              operating margins or impair latency. Simultaneously, Windsurf's foundational dependency on the open-source
              VS Code architecture exposes the product to platform risks should Microsoft adjust upstream licensing,
              alter extension marketplace policies, or grant preferential native advantages to GitHub Copilot.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
