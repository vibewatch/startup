      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Corporate Dissection and Capital Structure Overhang
            body: >-
              The July 2025 tri-party carve-up unbundled Windsurf into a $2.4B talent/licensing transfer to Google and a
              ~$250M asset sale to Cognition. This structure effectively wiped out a clean equity story for standalone
              Windsurf, leaving legacy equity holders and subsequent investors exposed to Cognition's internal
              integration priorities.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Transaction Perimeter and Historical Marks
        blocks:
          - type: paragraph
            body: >
              Windsurf's historical financing establishes strategic demand, but it does not establish a current entry
              price. Tracxn, FreeMalta, and Netfigo report $243 million of total funding, while accounts of the August
              2024 Series C place the $150 million round at post-money values ranging from $1.0 billion to $1.3 billion.
              Tracxn separately labels $3 billion as the last known valuation in May 2025, and several sources describe
              roughly $3 billion as the price of OpenAI's failed acquisition proposal. Those figures refer to different
              dates and transaction concepts, so treating them as one continuous equity valuation series would create
              false precision.


              The executed structure changed the investable perimeter. Accounts describe Google's $2.4 billion
              transaction as a non-exclusive technology license plus a talent move, not an equity purchase or control
              transfer. Separate accounts say Cognition then acquired the remaining product, brand, intellectual
              property, customer base, and operations. The retained evidence therefore supports analysis of an acquired
              product inside Cognition, not underwriting of a clearly offered standalone Windsurf security.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: Operating Evidence and Valuation Limits
        blocks:
          - type: paragraph
            body: >
              Public operating evidence indicates meaningful pre-transaction traction but is not sufficiently consistent
              for a precise multiple. M&A Equilibrium and AgentMarketCap report approximately $82 million of annual
              recurring revenue and more than 350 enterprise customers around the 2025 split. FreeMalta instead reports
              approximately $100 million of ARR by April 2025. The periods, methods, and source chains are not
              reconciled, and none of the assigned sources supplies audited revenue, gross margin, retention, burn,
              cash, or a post-acquisition segment bridge. Revenue multiples calculated from these snapshots would
              therefore be illustrative rather than decision-grade.


              Product continuity is more visible than financial continuity. Two 2026 review sources describe Windsurf as
              an active agentic coding tool, and WeavAI lists subscription tiers under Cognition ownership. That
              evidence supports a product thesis, but not a separable enterprise value. The thesis is continued IDE
              distribution and an installed customer base; the anti-thesis is that ownership, leadership, IP rights, and
              financial reporting have moved beyond the standalone company that raised the 2024 rounds.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario Framework and Comparable References
        blocks:
          - type: paragraph
            body: >
              A model-appropriate comparable set must distinguish a private financing mark, an unconsummated
              full-company bid, a license-and-talent transaction, and a residual asset acquisition. The 2024 round
              range, OpenAI's failed proposal, Google's executed license-and-talent payment, and the reported Cognition
              consideration are strategic reference points, not directly comparable equity multiples. No current
              standalone valuation range is supportable because the retained evidence does not identify an offered
              Windsurf instrument, audited post-acquisition financials, or the rights attached to any security.


              The bull case is therefore conditional rather than numerical: retained customers and active product
              distribution create value inside Cognition if current retention and monetization are verified. The base
              case is continued product operation without a separable Windsurf value. The bear case is impairment
              through customer attrition, leadership separation, unclear IP boundaries, or pricing pressure. These cases
              deliberately omit unsupported return percentages and valuation endpoints.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, Reopening Conditions, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The recommendation is avoid direct standalone Windsurf investment and classify the standalone valuation
              stance as unknown. Confidence is medium on that recommendation because multiple sources agree that
              Cognition acquired the remaining business after Google's separate transaction, but confidence is low on
              any numerical valuation because current financials, transaction documents, capitalization, preferences,
              and an investable security are absent from the retained evidence. This is a price-sensitive judgment:
              historical marks cannot substitute for current instrument terms.


              A diligence team should reopen the case only through a defined Cognition-linked or other legally
              documented instrument. Minimum evidence is the executed acquisition and IP-license documents, current ARR
              and net retention by cohort, gross margin after model and inference costs, customer concentration and
              churn, cash and burn, capitalization and preference stack, and treatment of employee and investor rights.
              Thesis-break triggers are loss of enterprise customers, inability to establish clean IP ownership, or an
              entry price that assumes unsupported standalone growth.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline
            body: >-
              Do not translate the 2024 private-round marks, OpenAI's failed proposal, Google's license-and-talent
              payment, or the reported Cognition asset consideration into a current standalone Windsurf equity value.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
          - type: callout
            title: Reopening threshold
            body: >-
              A defined investment instrument, executed ownership and IP documents, current customer retention, gross
              margin, burn, cash, and preference terms are prerequisites to revisiting the recommendation.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV016
