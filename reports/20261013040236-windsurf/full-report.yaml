      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement of AI-native code editors is characterized by a dual-motion sales funnel: bottom-up developer
              product-led growth (PLG) and top-down enterprise software procurement. Individual engineers and
              contractors initially adopt the software via freemium tiers offering unlimited autocomplete, before
              upgrading to individual Pro plans ($20 per month) via personal expense cards. When team collaboration is
              required, budget ownership shifts to Engineering Managers and Directors of Engineering, who procure Team
              plans ($40 per user per month) to access centralized administrative billing, shared team Memories, and
              unified index policies. At the enterprise scale, procurement transitions to Vice Presidents of
              Engineering, Chief Information Officers (CIOs), and Chief Information Security Officers (CISOs). These
              enterprise buyers evaluate software against rigorous security criteria rather than productivity metrics
              alone. Windsurf's Enterprise tier addresses these procurement gates by providing Privacy Mode
              (guaranteeing that customer proprietary code is never utilized for LLM model training), SOC 2 compliance,
              SAML/SSO authentication, and self-hosted on-premises deployments. This structured pricing
              transition—adjusted in March 2026 from usage credits to quota-based tiers—reflects a maturing monetization
              framework designed to extract maximum value from power users.
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: Adoption Drivers, Switching Barriers, and Enterprise Constraints
        blocks:
          - type: paragraph
            body: >-
              The accelerated adoption of agentic IDEs is propelled by compelling engineering ROI: multi-file reasoning
              engines such as Cascade and specialized model architectures like SWE-1.5 dramatically reduce developer
              task completion times and cognitive overhead during codebase navigation. Furthermore, native integration
              with the Model Context Protocol (MCP) enables editors to bridge codebases directly with external issue
              trackers, pull request workflows, and observability infrastructure. Nevertheless, substantial structural
              constraints temper enterprise expansion. Switching costs remain notable: although Windsurf provides
              complete VS Code extension marketplace compatibility to minimize migration friction, developers exhibit
              deep muscle memory for established IDE keyboard shortcuts and specialized plugin ecosystems. More
              critically, enterprise adoption faces model latency bottlenecks, hallucinations in complex refactoring
              tasks, and IP governance concerns. The collapse of OpenAI's planned $3 billion acquisition of Windsurf in
              July 2025—driven partly by Microsoft IP entanglement—and the subsequent split between Google ($2.4 billion
              licensing and talent deal) and Cognition AI ($250 million asset acquisition) underscored the strategic
              sensitivity of coding IP. Cognition's June 2026 rebranding of Windsurf to Devin Desktop signifies the
              ongoing consolidation of interactive editors with fully autonomous background software engineering agents.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Agentic IDE Bifurcation: Completion vs Autonomous Tasks'
            body: >-
              The developer tools market is splitting into two distinct pricing tiers: volume-driven completion plugins
              priced at $10 to $19 per user per month (exemplified by GitHub Copilot) and autonomous multi-file agentic
              environments commanding $20 to $200 per month based on measurable engineering task velocity.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
          - type: callout
            title: Concentrated Enterprise Willingness to Pay
            body: >-
              While 84% of developers actively use AI coding assistants in 2026, only 18% have employer-sponsored
              licenses. This leaves 31% paying out-of-pocket and 35% on free tiers, creating a high-volume top of funnel
              that faces conversion resistance at corporate enterprise procurement desks.
            calloutType: risk
            claimRefs:
              - CM004
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Major Contenders
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for AI-assisted software engineering in 2026 is defined by rapid bifurcation
              between incumbent developer tool suites and AI-native agentic environments. GitHub Copilot, backed by
              Microsoft's distribution power and deep Visual Studio Code ownership, commands the largest volume share
              across global software enterprises. Concurrently, Cursor (developed by Anysphere) has emerged as the
              premier independent AI-native code editor, demonstrating unprecedented revenue growth on the strength of
              its fast multi-line speculative completions and background agent workflows. Windsurf occupies a critical
              strategic position within this ecosystem, having pioneered deep codebase reasoning through its Cascade
              agent before being acquired by Cognition AI in late 2025. Complementing these desktop IDEs,
              terminal-native agents like Anthropic's Claude Code capture significant mindshare among power developers
              who prioritize command-line autonomy over graphical interface extensions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
