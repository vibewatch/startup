      - number: '1.3'
        title: Commercial Scale, Enterprise Adoption, and Operating Metrics
        blocks:
          - type: paragraph
            body: >-
              Windsurf achieved commercial traction by leveraging a bottom-up developer adoption funnel. The company
              provided an unmetered free tier for individual programmers, amassing over one million registered
              developers across more than seventy programming languages. This developer adoption supported an enterprise
              sales motion targeted at large engineering organizations requiring private deployment, administrative
              controls, and SOC2 compliance. By mid-2025, Windsurf had scaled to approximately $82 million in annual
              recurring revenue across more than 350 enterprise customers, including prominent technology organizations
              such as Zillow and Anduril. Subscription pricing transitioned from early credits to tiered commercial
              plans, including a $20 per user monthly Pro tier and customized enterprise licensing. Standalone gross
              margins and unit economics were not publicly disclosed prior to the Cognition asset acquisition.
            claimRefs:
