        blocks:
          - type: paragraph
            body: >
              The clearest practitioner evidence comes from OpenAI Tools Hub, whose reviewer paid for Windsurf Pro and
              tested it for three weeks across three active codebases in February and March 2026. This is useful
              production-workflow evidence, but it is a single reviewer rather than a named enterprise reference.
              Commercial traction is reported separately: M&A Equilibrium and AgentMarketCap cite more than 350
              enterprise customers and approximately $82 million of ARR during the 2025 deal sequence. AgentMarketCap
              additionally reports enterprise ARR doubling quarter over quarter at acquisition and combined ARR growing
              more than 30% in the following months; both growth claims remain single-publisher reports with unspecified
              measurement windows and should not be treated as audited revenue.
