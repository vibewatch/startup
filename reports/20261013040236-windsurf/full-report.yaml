      - number: '7.4'
        title: Financial Model Sustainability, Dilution, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Prior to its corporate restructuring, Windsurf achieved $82 million in annual recurring revenue across
              more than 350 enterprise accounts, demonstrating genuine product-market traction. However, the tripartite
              split effectively dismantled the standalone equity narrative, distributing $1.2 billion in licensing
              proceeds to legacy investors and $1.2 billion to departing personnel while Cognition absorbed remaining
              operations at a steep asset discount. Investors evaluating the combined entity face significant capital
              structure overhang, valuation resets, and unverified commercial agreements. Definitive thesis-break
              triggers include escalating model inference unit costs, unresolved IP indemnity claims from legacy
              corporate structures, and developer churn toward model-agnostic alternatives such as Cursor.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
