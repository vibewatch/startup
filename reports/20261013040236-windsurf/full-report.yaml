  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and buying centers
        blocks:
          - type: paragraph
            body: >
              Windsurf reaches users through a developer-led model that begins with free evaluation and extends to
              individual, team, and enterprise purchasing. A paid independent review lists Free, Pro, Teams, and
              Enterprise plans, while a competitor-issued review describes personal learning, primary-engineer use, and
              small-team collaboration as distinct use cases. The public material therefore supports segmentation by
              buyer and workflow, but not by geography, vertical, company size, or revenue band. Around the 2025
              transaction period, two analyst-style sources reported more than 350 enterprise customers, establishing an
              enterprise sales surface without revealing account names, seat counts, average contract value, or the
              share of revenue attributable to large accounts.
