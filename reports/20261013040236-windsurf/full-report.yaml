      - number: '1.2'
        title: Venture Financing Trajectory and Valuation Multiples
        blocks:
          - type: paragraph
            body: >-
              Prior to its 2025 corporate bifurcation, Windsurf raised approximately $243 million in total venture
              capital across institutional financing rounds. The company closed a $65 million Series B round in January
              2024 led by Kleiner Perkins at a post-money valuation of $500 million, with participation from General
              Catalyst and Greenoaks Capital. In August 2024, General Catalyst led a $150 million Series C financing
              round that valued the startup at $1.25 billion, formalizing unicorn status. In early 2025, Windsurf
              reached a preliminary agreement with OpenAI for a proposed $3 billion all-stock acquisition. When that
              transaction unraveled, Alphabet finalized a $2.4 billion transaction structured as a non-exclusive
              technology license and talent acquisition, reportedly allocating $1.2 billion to venture backers and $1.2
              billion toward employee retention packages. Cognition AI subsequently purchased the remaining operating
              company, brand, and enterprise contracts for approximately $250 million.
