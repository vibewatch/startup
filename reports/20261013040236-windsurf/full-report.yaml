      - number: '3.2'
        title: Architecture, Agentic Capabilities, and Developer Experience
        blocks:
          - type: paragraph
            body: >-
              Windsurf's primary technical differentiation centers on its Cascade agent architecture and the Flows
              operational framework. Unlike traditional developer assistants that offer passive inline suggestions,
              Cascade maintains holistic codebase context and persistent workspace Memories, enabling autonomous
              multi-file edits, terminal command executions, and automated unit test resolution. Windsurf's Flows model
              fluidly bridges real-time pair programming autocompletions with autonomous agent actions, reducing
              cognitive switching friction for practicing engineers. Because Windsurf is built directly on an
              open-source Visual Studio Code fork, developers benefit from one-click migration of configurations, custom
              keybindings, and marketplace extensions. However, this architectural similarity also creates low switching
              costs, leading to frequent developer multi-homing between Windsurf and Cursor depending on specific model
              preferences, quota limits, and perceived latency.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
