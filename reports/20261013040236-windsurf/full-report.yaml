      - number: '6.3'
        title: Durability, expansion, and continuity
        blocks:
          - type: paragraph
            body: >
              No assigned source discloses NRR, GRR, churn, renewal rates, contract length, customer concentration, or
              cohort behavior. A 4.5/5 G2 rating based on 187 Codeium reviews is a point-in-time satisfaction proxy, not
              retention evidence. Expansion could come from the reported plan ladder and Cognition's proposed workflow
              linking Windsurf planning, Devin task delegation, and pull-request review, but public evidence does not
              quantify cross-sell or seat expansion. Customer durability is also exposed to transition risk: Thai Times
              reported that most staff remained to support enterprise product development after leaders moved to Google,
              while i10x described roadmap uncertainty under Cognition. Independent testing also found scope overreach,
              extension gaps, and an intermittent Windows terminal issue that can impede broader deployment.
            claimRefs:
