  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Tiered Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Windsurf structured its commercial model around a classic developer-led freemium funnel that expanded into
              multi-tier organizational subscriptions and high-value strategic technology licensing agreements. At the
              entry point, the platform offered free individual access featuring unlimited tab autocomplete and
              twenty-five monthly Cascade agent credits to maximize developer distribution across VS Code, JetBrains,
              and other popular editor environments. Individual monetization began with the Pro tier, priced between
              fifteen and twenty dollars per monthly billing cycle, which unlocked unconstrained agentic actions,
              priority compute response speeds, and persistent project memories. For collaborative engineering groups,
              Windsurf established a Teams tier priced between thirty and forty dollars per user per month that
              introduced centralized administrative consoles, consolidated billing management, and cross-team memory
              sharing. At the enterprise tier, list pricing reached sixty dollars per user monthly or converted into
              customized multi-year enterprise license agreements featuring single sign-on, dedicated VPC isolation, and
              privacy guarantees against model training. The revenue architecture also benefited from non-recurring
              strategic transactions, most notably Google's July 2025 non-exclusive technology licensing agreement
              valued at approximately two point four billion dollars, which provided substantial liquidity while leaving
              underlying commercial operations intact.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
