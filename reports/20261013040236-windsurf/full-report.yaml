  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-layer architectural hierarchy of Windsurf IDE spanning client presentation, context indexing, agentic
      orchestration, model routing, tool execution, and enterprise security.
    approximationNotes: >-
      Architectural abstraction synthesized from Windsurf technical documentation, Grokipedia architecture breakdown,
      and developer reviews.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE008
    data:
      layers:
        - label: Client Presentation & IDE Layer
          detail: >-
            Visual Studio Code desktop fork on Electron supporting macOS, Windows, and Linux with native keybindings and
            Open VSX plugin marketplace compatibility.
        - label: Context Indexing & Memory Layer
          detail: >-
            Proprietary Fast Context engine building project-wide dependency graphs without manual tagging, paired with
            adaptive Memories learning developer conventions over 48 hours.
        - label: Cascade Agentic Orchestration Layer
          detail: >-
            Multi-step reasoning engine supporting Write, Chat, and Plan modes, parallel multi-agent sessions, Git
            worktree isolation, and integrated terminal execution.
        - label: Inference & Model Routing Gateway
          detail: >-
            Hybrid model routing dispatching code requests across proprietary SWE-1 models, Anthropic Claude Sonnet 4.6,
            OpenAI GPT-4o, and Google Gemini.
        - label: Tool Calling & MCP Protocol Gateway
          detail: >-
            Model Context Protocol server integration connecting Cascade to HashiCorp Terraform registry, Vault,
            1Password, and external enterprise databases.
        - label: Enterprise Security & Governance Layer
          detail: >-
            SOC 2 Type II compliant environment with zero data retention default, FedRAMP High availability, and
            isolated enterprise privacy mode.
