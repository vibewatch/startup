  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary for AI-native code editors sits at the intersection of developer experience tooling,
              integrated development environments (IDEs), and autonomous software engineering agents. Historically,
              developer tooling expenditure was confined to software licenses for IDEs such as JetBrains, code hosting
              and CI/CD platforms, and static analysis linters. The emergence of generative AI created a new spending
              category: AI code generation and assistance. While first-generation tools such as GitHub Copilot operated
              as lightweight editor extensions providing inline single-line autocomplete, second-generation platforms
              like Windsurf (formerly Codeium) redefined the product footprint into full, AI-native IDEs. These
              environments incorporate autonomous agentic systems—specifically Windsurf's Cascade—capable of multi-file
              reasoning, repository-wide indexing, terminal command execution, and architectural refactoring. This
              boundary strictly excludes generic raw compute hosting (such as GPU cloud infrastructure), enterprise ERP
              applications, and traditional project management software, focusing directly on developer seat
              productivity. The status-quo substitutes in this landscape include standard unassisted IDEs (stock VS
              Code, IntelliJ), web-based chatbot interfaces (ChatGPT, Claude, Gemini) where engineers copy and paste
              code manually, and internal bespoke script generators.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and SOM Constraints'
        blocks:
          - type: paragraph
            body: >-
              Estimating the total addressable market for AI coding tools requires multiple analytical lenses rather
              than a single monolithic projection. On a top-down basis, industry benchmarks from market intelligence
              trackers indicate that the global AI coding tools market stands at approximately $6.0 billion to $9.5
              billion in 2026, expanding at a 22% compound annual growth rate. This market sits within the broader $45
              billion worldwide developer tools and IT development infrastructure spend, which is itself anchored
              against an estimated $500 billion global software engineering payroll. From a bottom-up developer
              population perspective, JetBrains developer surveys indicate that 84% of software engineers actively
              utilize AI coding tools in 2026, representing a massive expansion from 41% in 2024. However, commercial
              monetization is bounded by corporate willingness to pay: only 18% of developers report that their
              employers fund their AI coding tools, whereas 31% pay out-of-pocket on individual credit cards and 35%
              rely exclusively on free tiers. The Serviceable Addressable Market (SAM) is therefore constrained to
              corporate-sponsored engineering seats and high-intent professional subscribers, estimated at $2.5 billion.
              Within this segment, the Serviceable Obtainable Market (SOM) for standalone agentic IDEs stands at roughly
              $650 million, where Windsurf captured $82 million in annualized recurring revenue prior to its July 2025
              strategic acquisition by Cognition AI.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
