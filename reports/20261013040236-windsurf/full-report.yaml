      - number: '4.2'
        title: Commercial GTM Execution and List versus Realized Pricing
        blocks:
          - type: paragraph
            body: >-
              The commercial velocity of Windsurf accelerated sharply following the November 2024 launch of its native
              agentic IDE, driving annual recurring revenue from twelve million dollars in late 2024 to approximately
              eighty-two million dollars by July 2025. This expansion validated a bottom-up go-to-market motion where
              individual developer enthusiasm within corporate engineering teams created natural procurement demand for
              organization-wide Teams and Enterprise commitments. By the close of the second quarter of 2025, Windsurf
              had secured more than three hundred and fifty active enterprise customer accounts, demonstrating
              legitimate penetration among enterprise technology organizations despite aggressive competition from
              Microsoft's GitHub Copilot and Cursor. However, substantial variance existed between published list
              pricing and realized contract values across the enterprise cohort. While self-serve Pro and small-scale
              Teams subscriptions typically realized standard list prices via automated credit card billing,
              enterprise-scale deployments frequently negotiated volume discounting, multi-year prepayments, and
              customized service-level commitments. Because standalone financial ledgers remain confidential following
              the Cognition transaction, the blended average realized price per enterprise seat and true contract
              discount rates cannot be confirmed through independent public filings.
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
