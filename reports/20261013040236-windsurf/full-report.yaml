            title: Retention and concentration remain unmeasured
            body: >-
              Public customer-count and ARR reports do not disclose NRR, GRR, churn, renewal, contract length,
              top-account concentration, or post-transaction customer retention. These are diligence gaps, not evidence
              of durability.
