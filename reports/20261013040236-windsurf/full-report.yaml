  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Cognition retains enterprise customers, expands paid usage, and converts product continuity into improving
          unit economics
        - >-
          Potential value exists inside Cognition, but no standalone range is supportable without an instrument and
          current financials
        - IP overlap, inference costs, and competitive pricing
        - Supported only if current retention, margin, and expansion evidence is produced
      - - Base
        - Windsurf continues as an active Cognition-owned product without separately reported economics
        - Treat Windsurf as an operating asset rather than a separable equity valuation
        - Limited disclosure and inability to attribute value
        - Most consistent with the assigned evidence of product continuity and acquisition status
      - - Bear
        - Customer attrition, leadership separation, or unclear technology rights reduce the asset's contribution
        - >-
          Downside is impairment of the acquired asset; a percentage loss cannot be calculated without purchase
          accounting or entry terms
        - Enterprise churn, rights disputes, and commoditization
        - Triggered by contract losses, weak retention, or failure to document clean IP ownership
    notes: >-
      Scenarios are conditional and qualitative because the assigned evidence lacks a current standalone security,
      audited post-acquisition financials, and purchase-accounting detail.
    claimRefs:
      - CV010
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronological progression of Windsurf from GPU virtualization to agentic IDE and multi-party corporate division.
    data:
      items:
        - label: Exafunction Incorporation
          date: '2021'
          details: Varun Mohan and Douglas Chen found Exafunction to optimize GPU utilization for machine learning workloads.
          tone: neutral
        - label: Codeium Pivot & Launch
          date: '2022'
          details: Pivot to AI coding space with free autocomplete plugin competing directly with GitHub Copilot.
          tone: positive
        - label: Series B Financing
          date: 2024-01
          details: Secures $65M Series B led by Kleiner Perkins at a $500M post-money valuation.
          tone: positive
        - label: Series C Financing
          date: 2024-08
          details: Raises $150M Series C led by General Catalyst at a $1.25B valuation, achieving unicorn status.
          tone: positive
        - label: Windsurf IDE & Cascade Launch
          date: 2024-11
          details: Rebrands company to Windsurf and launches standalone AI IDE featuring the Cascade agent.
          tone: positive
        - label: OpenAI $3B Acquisition Collapse
          date: 2025-07
          details: Proposed $3B acquisition by OpenAI falls apart due to Microsoft IP contractual reach and exclusivity expiry.
          tone: negative
        - label: Tripartite Split (Google & Cognition)
          date: 2025-07
          details: >-
            Google executes $2.4B reverse acquihire and license; Cognition acquires IDE product, brand, and contracts
            for ~$250M.
          tone: warning
        - label: Cognition Integration & Market Traction
          date: 2026-04
          details: 'Windsurf ranks #1 in developer tool rankings, scaling $82M ARR under Cognition with Devin platform synergy.'
          tone: positive
