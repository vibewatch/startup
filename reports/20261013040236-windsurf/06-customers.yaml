company:
  name: "Windsurf"
chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence supports a broad developer-to-enterprise customer model and reports more than 350 enterprise customers around the 2025 transaction period, but it does not disclose named enterprise deployments or retention cohorts. The strongest direct usage evidence is one paid, multi-codebase reviewer, while ownership changes create a material continuity and procurement risk."
sections:
  - id: "segments-and-buying-centers"
    title: "Segments and buying centers"
    body: |
      Windsurf reaches users through a developer-led model that begins with free evaluation and extends to individual, team, and enterprise purchasing. A paid independent review lists Free, Pro, Teams, and Enterprise plans, while a competitor-issued review describes personal learning, primary-engineer use, and small-team collaboration as distinct use cases. The public material therefore supports segmentation by buyer and workflow, but not by geography, vertical, company size, or revenue band. Around the 2025 transaction period, two analyst-style sources reported more than 350 enterprise customers, establishing an enterprise sales surface without revealing account names, seat counts, average contract value, or the share of revenue attributable to large accounts.
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-customer-proof"
    title: "Adoption and customer proof"
    body: |
      The clearest practitioner evidence comes from OpenAI Tools Hub, whose reviewer paid for Windsurf Pro and tested it for three weeks across three active codebases in February and March 2026. This is useful production-workflow evidence, but it is a single reviewer rather than a named enterprise reference. Commercial traction is reported separately: M&A Equilibrium and AgentMarketCap cite more than 350 enterprise customers and approximately $82 million of ARR during the 2025 deal sequence. AgentMarketCap additionally reports enterprise ARR doubling quarter over quarter at acquisition and combined ARR growing more than 30% in the following months; both growth claims remain single-publisher reports with unspecified measurement windows and should not be treated as audited revenue.
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU013"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs: []
  - id: "durability-expansion-and-continuity"
    title: "Durability, expansion, and continuity"
    body: |
      No assigned source discloses NRR, GRR, churn, renewal rates, contract length, customer concentration, or cohort behavior. A 4.5/5 G2 rating based on 187 Codeium reviews is a point-in-time satisfaction proxy, not retention evidence. Expansion could come from the reported plan ladder and Cognition's proposed workflow linking Windsurf planning, Devin task delegation, and pull-request review, but public evidence does not quantify cross-sell or seat expansion. Customer durability is also exposed to transition risk: Thai Times reported that most staff remained to support enterprise product development after leaders moved to Google, while i10x described roadmap uncertainty under Cognition. Independent testing also found scope overreach, extension gaps, and an intermittent Windows terminal issue that can impede broader deployment.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs: []
    figureRefs: []
