chapter:
  number: 8
  title: "Valuation"
  summary: "The retained evidence supports an avoid-direct-investment stance for standalone Windsurf: the business was split across a Google license-and-talent transaction and Cognition's acquisition, while no current standalone instrument or audited post-acquisition financial package is public in the assigned evidence. Historical financing marks and transaction values are useful context but are not interchangeable valuation benchmarks."
sections:
  - id: "transaction-perimeter"
    title: "Transaction Perimeter and Historical Marks"
    body: |
      Windsurf's historical financing establishes strategic demand, but it does not establish a current entry price. Tracxn, FreeMalta, and Netfigo report $243 million of total funding, while accounts of the August 2024 Series C place the $150 million round at post-money values ranging from $1.0 billion to $1.3 billion. Tracxn separately labels $3 billion as the last known valuation in May 2025, and several sources describe roughly $3 billion as the price of OpenAI's failed acquisition proposal. Those figures refer to different dates and transaction concepts, so treating them as one continuous equity valuation series would create false precision.

      The executed structure changed the investable perimeter. Accounts describe Google's $2.4 billion transaction as a non-exclusive technology license plus a talent move, not an equity purchase or control transfer. Separate accounts say Cognition then acquired the remaining product, brand, intellectual property, customer base, and operations. The retained evidence therefore supports analysis of an acquired product inside Cognition, not underwriting of a clearly offered standalone Windsurf security.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
    tableRefs: []
    figureRefs: []
  - id: "operating-evidence"
    title: "Operating Evidence and Valuation Limits"
    body: |
      Public operating evidence indicates meaningful pre-transaction traction but is not sufficiently consistent for a precise multiple. M&A Equilibrium and AgentMarketCap report approximately $82 million of annual recurring revenue and more than 350 enterprise customers around the 2025 split. FreeMalta instead reports approximately $100 million of ARR by April 2025. The periods, methods, and source chains are not reconciled, and none of the assigned sources supplies audited revenue, gross margin, retention, burn, cash, or a post-acquisition segment bridge. Revenue multiples calculated from these snapshots would therefore be illustrative rather than decision-grade.

      Product continuity is more visible than financial continuity. Two 2026 review sources describe Windsurf as an active agentic coding tool, and WeavAI lists subscription tiers under Cognition ownership. That evidence supports a product thesis, but not a separable enterprise value. The thesis is continued IDE distribution and an installed customer base; the anti-thesis is that ownership, leadership, IP rights, and financial reporting have moved beyond the standalone company that raised the 2024 rounds.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "scenario-framework"
    title: "Scenario Framework and Comparable References"
    body: |
      A model-appropriate comparable set must distinguish a private financing mark, an unconsummated full-company bid, a license-and-talent transaction, and a residual asset acquisition. The 2024 round range, OpenAI's failed proposal, Google's executed license-and-talent payment, and the reported Cognition consideration are strategic reference points, not directly comparable equity multiples. No current standalone valuation range is supportable because the retained evidence does not identify an offered Windsurf instrument, audited post-acquisition financials, or the rights attached to any security.

      The bull case is therefore conditional rather than numerical: retained customers and active product distribution create value inside Cognition if current retention and monetization are verified. The base case is continued product operation without a separable Windsurf value. The bear case is impairment through customer attrition, leadership separation, unclear IP boundaries, or pricing pressure. These cases deliberately omit unsupported return percentages and valuation endpoints.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs: []
  - id: "recommendation"
    title: "Recommendation, Reopening Conditions, and Diligence Asks"
    body: |
      The recommendation is avoid direct standalone Windsurf investment and classify the standalone valuation stance as unknown. Confidence is medium on that recommendation because multiple sources agree that Cognition acquired the remaining business after Google's separate transaction, but confidence is low on any numerical valuation because current financials, transaction documents, capitalization, preferences, and an investable security are absent from the retained evidence. This is a price-sensitive judgment: historical marks cannot substitute for current instrument terms.

      A diligence team should reopen the case only through a defined Cognition-linked or other legally documented instrument. Minimum evidence is the executed acquisition and IP-license documents, current ARR and net retention by cohort, gross margin after model and inference costs, customer concentration and churn, cash and burn, capitalization and preference stack, and treatment of employee and investor rights. Thesis-break triggers are loss of enterprise customers, inability to establish clean IP ownership, or an entry price that assumes unsupported standalone growth.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
