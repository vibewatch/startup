evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-metrics-and-governance
    missingEvidence: >-
      Post-money valuation, price per share, cap table, liquidation preferences, cash balance, burn, runway, board
      rights, and asset-level economics.
    whyItMatters: >-
      Financing raised does not establish cash available, dilution, governance control, retained asset value, or the
      solvency horizon.
    diligencePath: >-
      Obtain the cap table, charter, investor-rights agreements, asset licenses, board materials, cash ledger, and
      operating plan under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete founder, executive, board, committee, and succession roster with current roles and tenure.
    whyItMatters: >-
      Two publicly named operating leaders are insufficient to assess oversight, functional coverage, independence, and
      key-person dependence.
    diligencePath: >-
      Request the organization chart, board and committee roster, executive biographies, retention terms, and succession
      plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: employees
    missingEvidence: A dated company-confirmed count distinguishing employees, contractors, and open positions.
    whyItMatters: The 11–50 band and 69-person point estimate imply different operating scale and hiring intensity.
    diligencePath: Reconcile payroll headcount, contractors, and open roles at the latest month-end.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent court, regulatory, clinical-hold, safety, sanctions, and material adverse-event records beyond the
      assigned pool.
    whyItMatters: The pool's lack of a recorded incident is not evidence that no incident exists.
    diligencePath: >-
      Review court dockets, FDA records, sanctions databases, trial registries, safety disclosures, and company legal
      representations.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      Beeline's indication-level pricing, launch geographies, payer access assumptions, and probability-adjusted
      eligible patient counts.
    whyItMatters: >-
      Without these inputs, prevalence and competitor sales cannot be converted into a defensible Beeline SAM, SOM, or
      revenue scenario.
    diligencePath: >-
      Obtain the commercial plan, indication-level market model, pricing research, payer advisory outputs, and clinical
      probability assumptions from management or data-room materials.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: buyer-adoption
    missingEvidence: Beeline's intended prescriber, specialty-pharmacy, hub-service, and reimbursement workflow.
    whyItMatters: >-
      The buyer and budget-owner map is necessarily a market-system hypothesis until Beeline discloses its access and
      commercialization design.
    diligencePath: >-
      Request the launch sequence, target prescriber segmentation, payer evidence plan, gross-to-net assumptions, and
      channel-partner strategy.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: adoption
    missingEvidence: Independent evidence on the regulatory and access path for a new oral lupus therapy.
    whyItMatters: >-
      Clinical convenience and epidemiology do not establish approval, formulary access, or conversion from existing
      immunomodulators.
    diligencePath: >-
      Obtain current regulatory milestones, pivotal-trial design, payer research, and specialist interview evidence for
      the intended lupus label.
    relatedQuestionRefs:
      - QM007
  - type: stale
    severity: material
    topic: prevalence
    missingEvidence: Current indication-specific epidemiology and treatment-eligible populations for each pipeline asset.
    whyItMatters: >-
      Several retained prevalence estimates are historical or undated and should not be treated as current
      treated-patient counts.
    diligencePath: >-
      Refresh with current peer-reviewed epidemiology, claims data, registry data, and disease-severity segmentation for
      each intended indication.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list and realized pricing, payer access, discounting, and contract evidence for Beeline and competing
      lupus or immunology therapies.
    whyItMatters: >-
      Without price and access data, the buyer trade-off and commercial displacement analysis cannot distinguish
      clinical differentiation from a viable product advantage.
    diligencePath: >-
      Obtain indication-level launch plans, payer research, net-price assumptions, and comparable product contracts from
      management or specialist market-access diligence.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Head-to-head or cross-trial efficacy, safety, persistence, manufacturing cost, and switching evidence across the
      principal lupus and immunology alternatives.
    whyItMatters: >-
      These inputs determine whether Beeline's mechanism and dosing claims can create durable share against approved
      products and large incumbents.
    diligencePath: >-
      Request the clinical-development comparability package, CMC plan, payer evidence, and physician adoption research
      for afimetoran and each priority indication.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
      A complete indication-by-indication census of oral, biologic, off-label, and emerging lupus and autoimmune
      competitors.
    whyItMatters: >-
      The assigned pool supports a partial landscape, so unobserved mechanisms or entrants could change the relative
      positioning.
    diligencePath: >-
      Refresh against trial registries, regulatory labels, specialist analyst datasets, and indication-specific
      physician surveys before underwriting.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Latest cash balance, restricted cash, monthly burn, and runway by clinical program.
    whyItMatters: Funding raised does not equal cash available, and trial timing can materially change the financing need.
    diligencePath: Obtain management accounts, cash waterfall, board-approved budget, and a milestone-linked 24-month runway model.
    relatedQuestionRefs:
      - QI003
      - QI010
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Any current revenue, licensing receipts, royalty obligations, or product-sales forecast.
    whyItMatters: Revenue quality and future monetization cannot be underwritten from financing announcements.
    diligencePath: >-
      Request revenue-recognition policy, licensing schedules, program-level forecasts, and commercial launch
      assumptions.
