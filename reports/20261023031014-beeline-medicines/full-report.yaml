      - number: '4.3'
        title: Underwriting verdict and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The financing provides meaningful strategic flexibility, but it does not remove financing dependency. The
              company expects a Phase 2 systemic-lupus readout in the second half of 2026 and plans to move afimetoran
              toward pivotal development if the result is positive; it also expects additional clinical starts across
              the portfolio over the following 12 months. Those milestones can increase spending before any product
              revenue is possible. The retained evidence does not disclose post-money valuation, cap-table terms,
              liquidation preferences, cash balance, burn by function, debt, project-finance obligations, or the date at
              which another round would be required. Accordingly, the financial verdict is research-more: capital access
              is a strength, while revenue quality, margin path, and runway remain underwriting blockers.
            claimRefs:
