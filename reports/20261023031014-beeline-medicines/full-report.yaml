        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Beeline Medicines is a private, clinical-stage biotechnology company developing precision therapies for
              autoimmune and inflammatory diseases. The company says it was formed in July 2025, and its lead program is
              afimetoran, a once-daily oral TLR7/8 inhibitor being prepared for pivotal lupus development. Independent
              reporting describes the business as built around drugs licensed from Bristol Myers Squibb, so the current
              operating model is portfolio development rather than demonstrated commercial product sales. Public
              databases do not present a single headquarters designation: Tracxn places the company in Stamford, while
              FundedIQ and Multiples list Boston. The June financing announcement is datelined from both cities, leaving
              the legal headquarters and exact operating footprint as diligence items.
