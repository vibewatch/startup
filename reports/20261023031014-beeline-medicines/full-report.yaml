      - number: '4.2'
        title: Cost drivers and operating efficiency
        blocks:
          - type: paragraph
            body: >-
              The observable cost base is clinical development and the organization needed to execute it. The official
              announcement says the new capital will support several clinical studies, including planned pivotal
              development, while BioXconomy ties the financing decision to clarified development and hiring plans. Built
              In also displayed recently posted jobs and a hybrid workspace, a limited company-issued signal of
              continued organizational build rather than a quantified headcount or payroll measure. This makes trial
              enrollment, site and CRO spend, manufacturing and supply for clinical material, regulatory work, and
              hiring the central margin and cash-consumption drivers. There is no retained source that discloses gross
              margin, CAC, payback, sales cycle, utilization, service-delivery cost, operating expense, or cash burn.
              Public-company benchmarks are not valid proxies for Beeline's pre-revenue economics. The right efficiency
              conclusion is therefore a diligence request, not an estimate.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI016
          - type: table
            tableRef: TI003
