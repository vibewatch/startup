  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer and user segments
        blocks:
          - type: paragraph
            body: >-
              Beeline is a private, clinical-stage biotechnology company, so its current users are trial participants,
              investigators, and clinical sites rather than a disclosed base of paying customers. Multiples labels the
              company customer focus as B2B and revenue model as product sales, but also describes it as clinical-stage
              with no revenue or EBITDA reported. The disease-side opportunity is large: the Lupus Foundation of America
              estimates 1.5 million Americans and at least five million people worldwide have lupus, with most patients
              developing it between ages 15 and 44. That population is an addressable patient pool, not evidence of
              Beeline adoption. Public materials identify systemic lupus as the lead indication for afimetoran and
              describe additional programs for atopic dermatitis, lupus, and rare autoimmune conditions, but do not
              disclose payer contracts, prescribing physicians, or commercial accounts.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU009
              - CU012
      - number: '6.2'
        title: Adoption and clinical proof trajectory
        blocks:
          - type: paragraph
            body: >-
              The observable adoption funnel is clinical rather than commercial. Beeline's June 2026 announcement says
              afimetoran was being prepared for pivotal development ahead of an expected Phase 2 systemic-lupus readout
              in the second half of 2026, while BLN-326 had ongoing Phase 1b studies and other programs were planned or
              preclinical. The ClinicalTrials.gov record for BMS-986326, the former name of BLN-326, is a Phase 1b
              randomized, double-blind, placebo-controlled multiple-ascending-dose study across discoid, subacute
              cutaneous, and systemic lupus; its record was last updated May 26, 2026, is marked completed, and says no
              results are posted. This is real clinical execution and geographic site reach, but it is not a
              demonstrated customer outcome or repeat usage signal.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence names investors and a licensing counterparty more readily than customers. Fierce Biotech
              reports that Beeline grew from just under 40 workers at launch to more than 60 and that management is
              considering future private or public financing; that is an operating-scale indicator, not customer
              retention. BioPharma Dive describes the portfolio as licensed from Bristol Myers Squibb and says the
              company expects additional clinical starts, while the company release identifies Bain Capital, CPP
              Investments, BMS, and management participation in the Series A extension. The disclosed relationship set
              therefore points to sponsor, partner, and capital-provider dependence, but does not quantify customer
              concentration, contract duration, enrollment conversion, trial retention, or post-approval access. These
              are material diligence gaps before underwriting durable demand or expansion.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate addressable disease population, development-stage participation, and disclosed
              relationships so that patient counts and financing activity are not mistaken for commercial customer
              metrics. The customer evidence is therefore best read as a staged pathway: disease burden creates
              potential demand, trial participation provides an early validation surface, and regulatory and payer steps
              remain ahead. The absence of public commercial accounts, repeat-use data, and posted clinical outcomes is
              itself decision-relevant; it prevents a precise conclusion about customer durability or concentration.
            claimRefs:
              - CU002
              - CU006
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and regulatory execution
        blocks:
          - type: paragraph
            body: >
              Beeline's lead value driver is afimetoran, an investigational once-daily TLR7/8 inhibitor for lupus. The
              company says its Phase 2 systemic lupus study is expected to complete in the second half of 2026 and that
              it is preparing pivotal development, but those are company timelines rather than regulatory outcomes. The
              FDA source confirms that Fast Track approval lists are maintained as an archive and does not independently
              establish an afimetoran approval or efficacy result. The ClinicalTrials.gov record for the related
              BMS-986326 program describes a randomized, double-blind, placebo-controlled Phase 1b crossover study whose
              stated purpose is to evaluate safety, tolerability, pharmacokinetics, pharmacodynamics and disease
              severity in atopic dermatitis. Therefore, the central kill criterion is not a missing incident; it is
              failure to convert planned or early-stage studies into reproducible, regulator-acceptable efficacy and
              safety evidence on schedule.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR012
      - number: '7.2'
        title: Operating, financial and portfolio risk
        blocks:
          - type: paragraph
            body: >
              The June 2026 financing release reports a $126.3 million extension that brought total Series A financing
              to $426.3 million and says proceeds will support several clinical studies. Fierce Biotech separately
              reported management's warning that all of the trials will be expensive and that the cash raised will not
              last forever, while also reporting that the extension delays the need to fundraise for a while. Those
              statements support financing-duration risk, not a quantified runway: cash balance, burn by function,
              runway, clinical cost-to-complete and dilution terms are not disclosed in the retained sources. The
              portfolio is diversified across afimetoran, BLN-326, lomedeucitinib, BLN-481 and BLN-498, but each
              additional program adds execution, manufacturing, monitoring and capital demands. Monitoring should focus
              on trial starts, readouts, enrollment, protocol changes, cash disclosures and financing terms.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Dependencies, concentration and diligence triggers
        blocks:
          - type: paragraph
            body: >
              Beeline's initial portfolio was in-licensed from Bristol Myers Squibb, and the financing release
              identifies BMS among existing shareholders and investors. This creates a material dependency on the
              quality of the underlying transferred assets and on the contractual economics and governance of the
              relationship; the retained evidence does not disclose royalty, milestone, reversion, change-of-control or
              supply provisions. Fierce reports that management is less likely to partner the assets, which may preserve
              strategic control but can increase internal capital and commercialization requirements. The public
              evidence also lacks a company-specific adverse record for litigation, safety incidents, cybersecurity,
              manufacturing failures or customer concentration. That absence is not evidence that those risks are
              absent. The diligence path is to obtain the in-license agreements, quality and pharmacovigilance records,
              CMC readiness package, cap table, cash plan and board-approved contingency triggers.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Evidence limits
        blocks:
          - type: paragraph
            body: >
              The risk assessment is constrained by a private-company disclosure set dominated by company-issued
              releases and one company-hosted product page. Independent reporting provides useful financing and
              management context, while government and registry pages establish the structure of regulatory and clinical
              processes, but none supplies a complete risk register for Beeline. The market-capitalization page is a
              comparator reference for public biotech scale, not evidence about Beeline's valuation, liquidity or
              operating capacity. Claims below preserve those boundaries and turn unknowns into diligence asks rather
              than inferred negatives.
            claimRefs:
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A failed, materially delayed or safety-limited afimetoran readout, especially if paired with an inability
              to secure capital on acceptable terms, would break the current clinical-stage thesis.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
          - type: callout
            title: Unknown is not clear
            body: >-
              The retained pool does not establish company-specific litigation, manufacturing, cybersecurity or safety
              incidents; those items remain diligence gaps rather than clean bills of health.
            calloutType: assumption
            claimRefs:
              - CR011
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Beeline's financing record demonstrates sponsor support and the capacity to advance several clinical
              programs, but it does not establish an investable entry price. The company reported a $126.3 million
              extension that brought its Series A to $426.3 million, following the $300 million financing disclosed at
              launch. Independent reporting corroborates the financing and also records management's expectation that
              costly trials will eventually require more private or public capital. None of the retained financing
              disclosures states a post-money valuation, price per share, fully diluted capitalization, preference
              stack, current cash, burn, or runway. Funding raised therefore cannot be treated as cash available or
              enterprise value. The current recommendation is research-more, confidence is medium, risk is high, and
              valuation stance is unknown until both price terms and clinical evidence are available.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is a well-capitalized, sponsor-backed immunology platform with five Bristol Myers
              Squibb-originated programs, a lead oral lupus asset, and leadership associated with a prior $3.9 billion
              biotech exit. Existing investors participated in the extension, and the proceeds were directed toward
              pivotal preparation for afimetoran and additional pipeline trials. The anti-thesis is equally material:
              afimetoran had not produced the decisive Phase 2 readout in the retained evidence, the portfolio creates
              multiple simultaneous development obligations, and management expects future financing needs. The company
              profile and deal database also provide no commercial revenue evidence. Platform breadth creates option
              value only if clinical, regulatory, CMC, and capital milestones remain coordinated; otherwise it increases
              burn and dilution exposure before any product revenue exists.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
      - number: '8.3'
        title: Scenario framework and comparable boundaries
        blocks:
          - type: paragraph
            body: >-
              A milestone-based, probability-adjusted development model is more appropriate than a revenue multiple for
              Beeline. The bull case requires a positive and clinically meaningful afimetoran Phase 2 result, a credible
              pivotal plan, and continued progression of the other programs. The base case assumes useful clinical
              evidence but additional time and financing before commercialization. The bear case assumes a disappointing
              readout, delay, portfolio reprioritization, or capital raised on adverse terms. Aurinia provides a lupus
              commercialization reference with $271.3 million of 2025 LUPKYNIS net product sales and $398.0 million of
              year-end cash and investments. Incyte's reported $23.70 billion October 2026 market capitalization is a
              mature public-biotech scale marker. Neither is a stage-matched valuation multiple for a private
              pre-readout company, so the evidence supports qualitative scenarios rather than invented valuation ranges.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Entry discipline, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Entry discipline should be tied to ownership economics and evidence milestones rather than the headline
              financing total. Diligence should obtain the latest term sheet, fully diluted cap table, option pool,
              liquidation preferences, anti-dilution provisions, investor rights, and all Bristol Myers Squibb
              royalties, milestones, governance rights, and change-of-control provisions. It should also reconcile
              proceeds raised to current cash, quarterly burn, committed trial and CMC spending, and runway under base
              and downside enrollment scenarios. Exit readiness is not demonstrated by the public record: no IPO plan,
              sale process, valuation, or commercial revenue base is disclosed. Thesis-break triggers are a clinically
              insufficient afimetoran readout, a material program delay, senior or heavily dilutive financing terms, or
              evidence that portfolio obligations exceed available capital. Re-underwrite only after clinical data and
              transaction terms permit a defensible ownership-return model.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at an undisclosed price
            body: >-
              Sponsor conviction and clinical ambition do not support a price-sensitive buy decision without a cap
              table, preferences, cash plan, and Phase 2 data.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV015
          - type: callout
            title: Funding raised is not valuation or runway
            body: >-
              The $426.3 million Series A total does not disclose current cash, post-money value, ownership, burn, or
              investor seniority.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV008
