        title: Financing, scale, and milestone implications
        blocks:
          - type: paragraph
            body: >-
              On June 30, 2026, Beeline announced a $126.3 million Series A extension that brought the total round to
              $426.3 million. Independent databases preserve the sequence as an initial $300 million financing in April
              followed by approximately $126 million in June. The capital is intended to support afimetoran pivotal
