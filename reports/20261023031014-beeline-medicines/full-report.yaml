      - number: '3.2'
        title: Competitor profiles and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              The closest publicly evidenced commercial comparator in this pool is Aurinia, whose LUPKYNIS is described
              as the first FDA-approved oral therapy for active lupus nephritis and whose 2025 net product sales were
              $271.3 million. That is evidence of an established commercial route, not proof that it competes directly
              with every Beeline indication. Bristol Myers Squibb and GSK illustrate incumbent scale and portfolio
              depth: BMS reported $26.4 billion of 2025 Growth Portfolio revenue and described a pipeline with potential
              for more than ten new medicines by 2030, while GSK reported 58 pipeline assets and 17 assets in Phase III
              or registration. These incumbents have distribution, regulatory, and launch capabilities that a new
              company must either build, partner for, or out-execute. Pricing, discounts, contracting, and switching
              data are not disclosed in the assigned evidence.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP012
      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Beeline's proposed differentiation rests on selective mechanisms, once-daily oral dosing for afimetoran,
              biologically validated pathways, and a portfolio assembled with assets that already have clinical
              development history. The independent BioPharma Dive account confirms that Beeline was built around Bristol
              Myers drugs and that afimetoran was in mid-stage testing, while also framing the financing as a strategy
              that gives investors access to more advanced assets and potentially quicker returns. That framing supports
              an execution advantage but also highlights dependence on clinical readouts and the asset-transfer model.
              LUPKYNIS demonstrates that an oral lupus-nephritis product can reach the market, while BMS and GSK show
              how incumbent scale can support many simultaneous programs. No assigned source provides comparative
              clinical outcomes, manufacturing cost, payer access, licensing economics, or evidence of lock-in; those
              are material unknowns for moat durability.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Portfolio and capital create option value
            body: >-
              The June announcement says the $426.3 million Series A will support pivotal development preparation for
              afimetoran and additional clinical studies, giving Beeline more than a single near-term development shot.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Commercial moat is not yet demonstrated
            body: >-
              The assigned evidence does not disclose comparative trial outcomes, realized pricing, payer access,
              manufacturing economics, or customer lock-in; incumbent scale and an approved oral comparator remain
              credible displacement pressures.
            calloutType: risk
            claimRefs:
              - CP005
              - CP010
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital base and revenue model
        blocks:
          - type: paragraph
            body: >-
              Beeline is a privately held, clinical-stage biotechnology company whose public financial profile is
              development-led rather than commercial. The company announced a $126.3 million Series A extension on June
              30, 2026, bringing the total Series A to $426.3 million, with proceeds directed to afimetoran
              pivotal-development preparation and additional clinical studies. BioXconomy reports that the extension was
              intended to right-size the initial financing after leadership, development, and hiring plans became
              clearer. That is evidence of planned capital adequacy for a stated development program, not evidence of
              cash on hand, unrestricted liquidity, or a guaranteed runway. Multiples lists a product-sales revenue
              model but reports no revenue or EBITDA; this should be treated as a database classification, not realized
              sales. No public list price, contracting terms, royalty burden, milestone schedule, or commercialization
              revenue is available in the retained sources.
