  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and unmet need
        blocks:
          - type: paragraph
            body: >-
              Beeline's stated market is precision therapies for autoimmune and inflammatory diseases, but the
              investable commercial boundary is narrower than the total prevalence of those conditions. The initial
              beachhead is lupus, led by afimetoran, a once-daily oral TLR7/8 inhibitor; the pipeline also reaches
              atopic dermatitis, psoriasis, rare autoimmune and inflammatory conditions, and other immune-mediated
              diseases through BLN-326, lomedeucitinib, BLN-481, and BLN-498. The relevant included spend is
              prescription medicine and associated treatment economics for diagnosed patients who can reach specialist
              care. It excludes undiagnosed prevalence, non-medical support, and every disease population for which
              Beeline has no development or regulatory path. Lupus is a high-need entry point: CDC identifies
              approximately 204,000 people with systemic lupus erythematosus (SLE) in the United States, while the Lupus
              Foundation describes 1.5 million Americans and at least five million people worldwide with some form of
              lupus. Those counts are epidemiology lenses, not addressable revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The public record supports multiple sizing lenses but not a defensible company-specific TAM/SAM/SOM
              waterfall. The broadest lens is disease prevalence: five million people worldwide have a form of lupus
              according to the Lupus Foundation, and the CDC's narrower SLE estimate is 204,000 people in the United
              States. A treatment-burden lens is also material: the Lupus Foundation cites average annual direct
              healthcare costs of $33,223 per person and total annual costs as high as $50,000, while cautioning that
              severe or active disease may be more expensive. A commercial benchmark comes from Aurinia, whose LUPKYNIS
              product generated $271.3 million of 2025 net product sales and whose 2026 guidance was $305 million to
              $315 million; this demonstrates that an oral lupus nephritis product can support a measurable market, but
              it is a competitor's realized sales base rather than Beeline's forecast. The company has not disclosed its
              price, eligible launch population, payer mix, market-access assumptions, or probability-adjusted share, so
              SAM and SOM remain open diligence questions.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The likely buying system is multi-stakeholder rather than a single customer: patients and prescribers
              create clinical demand, while health plans and pharmacy benefit managers influence access and the payer
              ultimately controls reimbursement. Specialty pharmacies, infusion or administration partners where
              relevant, and provider networks can affect fulfillment and persistence. The oral route is a potential
              adoption advantage for afimetoran because Beeline describes it as a once-daily pill, but convenience alone
              does not establish formulary placement or adherence. Adoption must clear clinical efficacy and safety
              thresholds, regulatory approval, diagnostic and specialist-care bottlenecks, payer evidence requirements,
              and switching costs from existing immunomodulators. Aurinia's disclosed 2026 focus on increasing LUPKYNIS
              adoption illustrates that even an approved oral lupus-nephritis product still has an active
              market-development task. Beeline's planned pivotal development and multiple upcoming trials imply that
              clinical readouts and regulatory execution, rather than current revenue, govern near-term market
              conversion. Public sources do not disclose Beeline's commercialization, reimbursement, or hub-service
              design.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Market risks and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              Market attractiveness is constrained by heterogeneity and execution. Lupus is not one uniform population:
              CDC reports higher burden among women and certain racial and ethnic groups, and the Lupus Foundation
              reports that systemic lupus accounts for approximately 70% of lupus cases while organ involvement occurs
              in approximately half of those systemic cases. These differences can complicate trial recruitment,
              diagnosis, treatment selection, and equitable access. The adjacent categories are also competitive and
              clinically segmented: the National Psoriasis Foundation reports more than eight million people in the
              United States have psoriasis, but prevalence does not identify the subset appropriate for a TYK2 therapy
              or the share available to a new entrant. The core market gaps are Beeline's indication-level epidemiology,
              target pricing and gross-to-net assumptions, payer and geography strategy, expected launch sequence, and
              probability-adjusted share. Until those are disclosed or independently evidenced, valuation should use
              scenario ranges rather than a top-down market multiple.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Lupus is the clearest beachhead, not the whole market
            body: >-
              The lead program and the strongest public epidemiology evidence are lupus-focused, while the wider
              pipeline supplies optionality across immune-mediated disease. The commercial case depends on converting
              prevalence into diagnosed, eligible, reimbursed patients.
            calloutType: insight
            claimRefs:
              - CM001
              - CM010
          - type: callout
            title: Public sizing cannot yet support a company-specific revenue model
            body: >-
              No retained source discloses Beeline's price, launch geography, payer access, eligible population, or
              probability-adjusted share. A diligence model should therefore keep SAM and SOM as explicit gaps rather
              than derive them from prevalence.
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Beeline's stated portfolio spans an oral TLR7/8 inhibitor for lupus, an IL-2-CD25 fusion protein, a TYK2
              inhibitor, an IL-18 receptor antibody, and an IL-10 therapeutic. The launch material says the five initial
              programs were licensed from Bristol Myers Squibb, while the June financing announcement says the company
              was formed in July 2025 and was preparing afimetoran for pivotal development. This creates a
              differentiated starting point versus a single-asset biotech, but it also creates several development and
              manufacturing fronts. The relevant alternatives include approved lupus-nephritis therapy LUPKYNIS,
              large-pharma immunology portfolios, other oral and biologic mechanisms, and physician status quo or
              off-label care. Public sources do not identify Beeline market share, head-to-head results, or a commercial
              customer base.
