      - [Confidence, "Financing is corroborated; ownership economics are absent", medium, "Confidence applies to the evidence boundary, not to intrinsic value"]
      - [Risk rating, "Clinical-stage portfolio with expensive trials and future financing needs", high, "Require downside financing and milestone tests"]
      - [Valuation stance, "Post-money valuation, share price, and preferences are undisclosed", unknown, "Obtain the cap table and financing documents before pricing"]
      - [Return and exit, "No public valuation, liquidity process, or commercial revenue base", not supportable, "Build a return range only after diligence closes the missing inputs"]
    notes: >-
      Financing amounts are reported capital raised, not cash available or
      valuation; unsupported price and return fields remain unavailable rather
      than being estimated.
    claimRefs: [CV001, CV007, CV008, CV009, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Side, Argument, Evidence, What would change the view]
    rows:
      - [Thesis, Sponsor support, "Existing investors joined the $126.3M extension", "Verify continued support and the preference stack"]
      - [Thesis, Lead-asset upside, "Afimetoran was preparing for pivotal development after Phase 2", "Require clinically meaningful efficacy and acceptable safety"]
      - [Thesis, Platform optionality, "Five BMS-originated programs provide multiple development shots", "Confirm asset economics and milestone-funded prioritization"]
      - [Anti-thesis, Clinical concentration, "The lead asset had not yet read out Phase 2", "Positive replicated data would reduce this risk"]
      - [Anti-thesis, Capital intensity, "Independent reporting says trials are expensive and more capital will be needed", "A funded plan through pivotal milestones would reduce dilution risk"]
      - [Anti-thesis, Commercial proof, "The retained deal database reports no revenue or EBITDA", "Validated launch economics or partnership cash flows would add proof"]
    notes: >-
      Company claims and independent reporting are distinguished in the source
      ledger; change-of-view conditions are diligence thresholds, not forecasts.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV009, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Operating assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Positive afimetoran Phase 2 and credible pivotal execution; pipeline trials advance", "Re-underwrite from risk-adjusted asset values after price and ownership terms are disclosed", "Clinical and financing milestones both turn favorable", "Efficacy or safety does not support pivotal development"]
      - [Base, "Useful Phase 2 evidence but more time and capital are required", "Remain research-more until diluted ownership and financing needs support a return range", "Most defensible current public-evidence case", "Runway or enrollment slips before a value inflection"]
      - [Bear, "Disappointing data, delay, reprioritization, or adverse financing", "Downside cannot be quantified without cash and preference data; assume dilution and reduced option value", "Material for a pre-readout clinical-stage company", "Down round or senior preference overhang"]
      - [Commercial reference, "Aurinia reported $271.3M of 2025 LUPKYNIS net product sales", "Use as evidence that lupus commercialization can produce revenue, not as a Beeline multiple", "Observed commercial-company result", "Product and stage differences invalidate direct comparison"]
      - [Public-biotech reference, "Incyte market capitalization was reported at $23.70B in October 2026", "Use only as a mature scale marker, not a private-company valuation input", "Observed market-data point", "Public scale and portfolio differences invalidate direct comparison"]
    notes: >-
      Scenarios are qualitative because no public Beeline valuation, fully
      diluted share count, cash, burn, approval probabilities, or revenue exists;
      comparator metrics retain their original units and periods.
    claimRefs: [CV006, CV009, CV010, CV011, CV012, CV014, CV015, CV016]
