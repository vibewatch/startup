company:
  name: Beeline Medicines
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Beeline Medicines is a private, clinical-stage biotechnology company formed in July 2025
    around autoimmune and inflammatory-disease assets originating at Bristol Myers Squibb.
    Its $426.3 million Series A and experienced leadership support a broad clinical program,
    but valuation, cash runway, governance terms, and asset economics remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Beeline Medicines is a private, clinical-stage biotechnology company developing precision
      therapies for autoimmune and inflammatory diseases. The company says it was formed in July
      2025, and its lead program is afimetoran, a once-daily oral TLR7/8 inhibitor being prepared
      for pivotal lupus development. Independent reporting describes the business as built around
      drugs licensed from Bristol Myers Squibb, so the current operating model is portfolio
      development rather than demonstrated commercial product sales. Public databases do not
      present a single headquarters designation: Tracxn places the company in Stamford, while
      FundedIQ and Multiples list Boston. The June financing announcement is datelined from both
      cities, leaving the legal headquarters and exact operating footprint as diligence items.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-stakeholders
    title: Leadership and stakeholder structure
    body: >-
      Saqib Islam is Beeline's chief executive officer, and FundedIQ also lists him as founder.
      Fierce Biotech identifies Badreddin Edris as president and chief operating officer and
      describes Beeline's leaders as SpringWorks Therapeutics veterans. Merck's 2025 acquisition
      announcement identifies Islam as SpringWorks CEO and values that transaction at approximately
      $3.9 billion, providing evidence of prior company-building and commercialization experience.
      The financing syndicate combines Bain Capital, CPP Investments, Bristol Myers Squibb, and
      participating management members. That alignment is meaningful, but the assigned evidence
      does not disclose the board roster, voting control, ownership percentages, succession
      arrangements, or the economics governing the Bristol Myers-originated assets.
    claimRefs: [CO006, CO007, CO008, CO009, CO014]
    tableRefs: [TO002, TO003]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestone implications
    body: >-
      On June 30, 2026, Beeline announced a $126.3 million Series A extension that brought the
      total round to $426.3 million. Independent databases preserve the sequence as an initial
      $300 million financing in April followed by approximately $126 million in June. The capital
      is intended to support afimetoran pivotal preparation and additional clinical starts, but
      it should not be treated as cash available or as evidence of a disclosed valuation. Fierce
      Biotech reports that trials will be expensive and that management does not expect the cash
      to last forever. Scale evidence is also inconsistent: Tracxn reports 69 employees as of
      September 30, while FundedIQ reports an 11–50 band. Revenue, customers, burn, runway, and
      financing terms remain gaps rather than estimable cover metrics.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Unusually large disclosed Series A
    body: >-
      The $426.3 million total Series A, backed by Bain Capital, CPP Investments, Bristol Myers
      Squibb, and participating management members, provides substantial disclosed financing for
      a newly formed clinical-stage company with several development programs.
    claimRefs: [CO009, CO010, CO015]
  - calloutType: risk
    title: Financing size does not establish runway or price
    body: >-
      The assigned evidence does not disclose valuation, cash balance, burn, runway, cap-table
      rights, or asset-level economics, while independent reporting explicitly notes that the
      clinical program will require additional capital over time.
    claimRefs: [CO014, CO016]
