    columns: [item, price or contract basis, list vs realized, evidence status, underwriting implication]
    rows:
      - [Afimetoran, "No public price or contract", "Not available", "Pre-commercial clinical program", "No net-price, access, or gross-to-net underwriting"]
      - [BLN-326, "No public price or contract", "Not available", "Phase 1b program", "No product-level monetization evidence"]
      - [Lomedeucitinib, "No public price or contract", "Not available", "Development program", "No indication-specific pricing or reimbursement case"]
      - [BLN-481 / BLN-498, "No public price or contract", "Not available", "Early development / preclinical programs", "No basis for revenue timing or margin estimate"]
    notes: "The retained sources describe programs and financing use but do not publish list pricing, realized pricing, discounts, royalties, or reimbursement assumptions."
    claimRefs: [CI003, CI004, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [metric, value, confidence, why it matters, diligence ask]
    rows:
      - [Revenue / ARR, null, low, "No public commercial revenue is reported", "Monthly management accounts and revenue-recognition policy"]
      - [Gross margin, null, low, "Product is not publicly commercialized", "Program-level COGS, manufacturing assumptions, and net-price model"]
      - [Cash balance, null, low, "Funding raised is not cash available", "Latest balance sheet and restricted-cash schedule"]
      - [Cash burn / runway, null, low, "Clinical starts and pivotal preparation can accelerate spend", "24-month cash waterfall by program and hiring plan"]
      - [CAC / payback, null, low, "No commercial sales motion is disclosed", "Commercial plan, channel economics, and launch assumptions"]
      - [Debt / project finance, null, low, "No debt obligations are disclosed in retained evidence", "Debt schedule, covenants, guarantees, and milestone financing"]
    notes: "Nulls mean unavailable in the assigned public evidence, not zero; estimates should be supplied by management and labeled by scenario."
    claimRefs: [CI006, CI007, CI009, CI012, CI013]
