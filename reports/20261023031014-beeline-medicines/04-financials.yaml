      - [Research and development funding, "Equity financing supports clinical development", "USD financing", "$426.3M total Series A disclosed in 2026", "Company-disclosed financing", "Cash received, restricted cash, closing costs, and remaining balance"]
      - [Commercial services, "Hub, market-access, or patient-support services", "Service contract", "No public commercial build or revenue disclosed", "Unavailable", "Commercialization plan, service vendors, and reimbursement economics"]
