callouts:
  - calloutType: insight
    title: Lupus is the clearest beachhead, not the whole market
    body: The lead program and the strongest public epidemiology evidence are lupus-focused, while the wider pipeline supplies optionality across immune-mediated disease. The commercial case depends on converting prevalence into diagnosed, eligible, reimbursed patients.
    claimRefs:
      - CM001
      - CM010
  - calloutType: risk
    title: Public sizing cannot yet support a company-specific revenue model
    body: No retained source discloses Beeline's price, launch geography, payer access, eligible population, or probability-adjusted share. A diligence model should therefore keep SAM and SOM as explicit gaps rather than derive them from prevalence.
    claimRefs:
      - CM009
      - CM013
      - CM017
