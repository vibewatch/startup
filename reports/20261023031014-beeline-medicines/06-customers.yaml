schemaVersion: "report-v2"
artifact: customers
slug: beeline-medicines
runDate: 2026-10-23
company:
  name: Beeline Medicines
chapter:
  number: 6
  title: Customers
  summary: Beeline's public customer evidence is primarily clinical-development participation rather than commercial adoption. The company has a broad autoimmune pipeline and a completed lupus study record, but public sources do not establish paying customers, approved products, retention, or revenue concentration.
sections:
  - id: customer-segments
    title: Customer and user segments
    body: >-
      Beeline is a private, clinical-stage biotechnology company, so its current users are trial participants, investigators, and clinical sites rather than a disclosed base of paying customers. Multiples labels the company customer focus as B2B and revenue model as product sales, but also describes it as clinical-stage with no revenue or EBITDA reported. The disease-side opportunity is large: the Lupus Foundation of America estimates 1.5 million Americans and at least five million people worldwide have lupus, with most patients developing it between ages 15 and 44. That population is an addressable patient pool, not evidence of Beeline adoption. Public materials identify systemic lupus as the lead indication for afimetoran and describe additional programs for atopic dermatitis, lupus, and rare autoimmune conditions, but do not disclose payer contracts, prescribing physicians, or commercial accounts.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and clinical proof trajectory
    body: >-
      The observable adoption funnel is clinical rather than commercial. Beeline's June 2026 announcement says afimetoran was being prepared for pivotal development ahead of an expected Phase 2 systemic-lupus readout in the second half of 2026, while BLN-326 had ongoing Phase 1b studies and other programs were planned or preclinical. The ClinicalTrials.gov record for BMS-986326, the former name of BLN-326, is a Phase 1b randomized, double-blind, placebo-controlled multiple-ascending-dose study across discoid, subacute cutaneous, and systemic lupus; its record was last updated May 26, 2026, is marked completed, and says no results are posted. This is real clinical execution and geographic site reach, but it is not a demonstrated customer outcome or repeat usage signal.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named proof, expansion, and concentration
    body: >-
      Public evidence names investors and a licensing counterparty more readily than customers. Fierce Biotech reports that Beeline grew from just under 40 workers at launch to more than 60 and that management is considering future private or public financing; that is an operating-scale indicator, not customer retention. BioPharma Dive describes the portfolio as licensed from Bristol Myers Squibb and says the company expects additional clinical starts, while the company release identifies Bain Capital, CPP Investments, BMS, and management participation in the Series A extension. The disclosed relationship set therefore points to sponsor, partner, and capital-provider dependence, but does not quantify customer concentration, contract duration, enrollment conversion, trial retention, or post-approval access. These are material diligence gaps before underwriting durable demand or expansion.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate addressable disease population, development-stage participation, and disclosed relationships so that patient counts and financing activity are not mistaken for commercial customer metrics. The customer evidence is therefore best read as a staged pathway: disease burden creates potential demand, trial participation provides an early validation surface, and regulatory and payer steps remain ahead. The absence of public commercial accounts, repeat-use data, and posted clinical outcomes is itself decision-relevant; it prevents a precise conclusion about customer durability or concentration.
    claimRefs: [CU002, CU006, CU009]
