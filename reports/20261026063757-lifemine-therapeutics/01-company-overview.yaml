    - type: private-evidence-only
      severity: material
      topic: private-financial-disclosure
      missingEvidence: "Current valuation, share count, liquidation preferences, revenue, cash balance, burn, runway, headcount, and customer or licensing metrics; public cumulative-funding reports also conflict."
      whyItMatters: "Without these inputs, investors cannot assess dilution, financial durability, operating scale, or the capital required to reach the planned transplant studies."
      diligencePath: "Request the latest financing documents and cap table, audited financial statements, current cash forecast and milestone bridge, employee roster, and a reconciled financing schedule."
