      severity: material
      topic: independent-LIFE-001-clinical-evidence
      missingEvidence: "A complete independent Phase 1 dataset with safety, pharmacokinetic, pharmacodynamic, discontinuation, and dose-level detail, plus a verified protocol and current trial status."
      whyItMatters: "The available evidence for the lead program's favorable profile is company-reported and does not establish efficacy or tolerability in transplant recipients."
      diligencePath: "Obtain the clinical study report or a complete conference or journal data package and reconcile planned study dates against trial registrations."
