callouts:
  - calloutType: insight
    title: "Financing improves capacity, not transparency"
    body: >-
      The $263M financing is a meaningful capital event, but gross proceeds do
      not establish cash available, runway, valuation, or the resources retained
      for the broader discovery platform.
    claimRefs: [CO005, CO006, CO016]
  - calloutType: risk
    title: "Clinical promise remains company-reported"
    body: >-
      The lead program is still in Phase 1 in the assigned evidence, and the
      planned transplant studies are prospective. Independent efficacy and
      safety data and a current cash-to-milestone bridge remain material gaps.
    claimRefs: [CO004, CO005]
