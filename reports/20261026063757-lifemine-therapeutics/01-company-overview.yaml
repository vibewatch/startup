artifact: company-overview
slug: lifemine-therapeutics
runDate: 2026-10-26
company:
  name: LifeMine Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    LifeMine is a Watertown-based clinical-stage biotech using fungal genomics
    to discover medicines, with LIFE-001 as its lead transplant program.
    Its August 2026 financing is substantial, but reported lifetime capital,
    private-company metrics, the depth of clinical evidence, and parts of its
    operating history remain uncertain or undisclosed.
sections:
  - id: identity-and-platform
    title: Identity and discovery platform
    body: >-
      LifeMine describes itself as a clinical-stage biopharmaceutical company
      using digital genomic search technology from fungi to source precision
      medicines. BioPharma Dive reports that the company was formed in 2017;
      its current contact page identifies Watertown, Massachusetts, as
      headquarters, with additional offices in Gloucester and Basel. The
      company presents LIFE-001 as the first clinical proof point of this
      discovery approach. That establishes a coherent company identity and a
      tangible lead program, but not a validated repeatable discovery engine:
      the assigned materials do not provide an independently reviewed
      portfolio-conversion rate, platform productivity benchmark, or
      commercial revenue base. Company descriptions of the platform should
      therefore remain distinguished from externally demonstrated
      performance.
    claimRefs: [CO001, CO002, CO003, CO004]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      LifeMine identifies co-founder Gregory Verdine as President and CEO.
      BioPharma Dive describes him as a former Harvard chemical biologist and
      serial biotech entrepreneur, making scientific and company-building
      experience visible in the public leadership narrative. The company also
      lists transplant surgeon Andrew Cameron on its Clinical Advisory Board,
      and its October 2026 news page records the board's formation. BioSpace
      separately reports the addition of Yves Zinggeler as chief commercial
      officer, but that appointment was not corroborated by another assigned
      source. These are useful signals of founder, clinical, and commercial
      coverage, not a complete governance map: the materials do not establish
      the full executive roster, board control, succession depth, or the
      division of operating authority.
    claimRefs: [CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: financing-and-disclosure
    title: Financing and disclosure limits
    body: >-
      LifeMine announced $263 million of financing in August 2026, comprising
      a $188 million Series E and a previously completed $75 million Series D.
      The release and independent coverage identify Milky Way Investments as
      the Series E lead and name new and continuing institutional and family
      office investors. This is gross financing, not evidence of cash still
      available, runway, or valuation. Published lifetime-funding totals do
      not reconcile: StartupRise reports $558 million, while BioPharma Dive
      reports roughly $580 million. The difference may reflect differing
      financing histories or source treatment, but the assigned evidence
      cannot resolve it. No valuation, share count, liquidation preference,
      revenue, cash balance, burn, runway, customer count, or headcount figure
      is established in the reviewed materials; those are diligence gaps, not
      zeros.
    claimRefs: [CO005, CO006, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO001, TO003]
  - id: milestones-and-execution
    title: Milestones and execution risk
    body: >-
      The milestone record combines company announcements with independent
      reporting. LifeMine says LIFE-001 remains in an ongoing Phase 1 study
      involving more than 120 adults and projects Phase 2 kidney-transplant
      and Phase 1b islet-cell studies for early 2027; these are company
      statements and plans, not independently reviewed efficacy results.
      Fierce Biotech reports that the company previously laid off staff and
      paused its fungal platform while concentrating resources on LIFE-001,
      and that a GSK discovery collaboration stalled after GSK reprioritized.
      The 2026 financing may support a renewed push, but the sources do not
      quantify rehiring, current platform breadth, or the collaboration's
      rights and economics. As a result, the financing and clinical plan
      warrant attention, while execution capacity and the repeatability of
      the platform remain open questions.
    claimRefs: [CO004, CO015, CO016]
    figureRefs: [FO001]
