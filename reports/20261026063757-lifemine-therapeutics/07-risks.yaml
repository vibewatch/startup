callouts:
  - calloutType: risk
    title: Clinical execution is the central exposed dependency
    body: "The evidence supports a clinical-stage lead program, a reported resource shift toward clinical development, and material unknowns in trial results, operating capacity, and cash runway. No clinical failure is established; a verified safety/regulatory setback or an unfunded next milestone would be a thesis-break trigger."
    claimRefs: [CR001, CR002, CR007, CR014, CR015]
