      - ["External R&D capacity", "Unidentified third-party R&D force", "CEO told Fierce the company had a large external R&D force during its transition to clinical development.", "Provider failure or weak oversight could disrupt quality or timelines.", "Potentially material; provider concentration is unknown.", "No vendor roster or quality controls are evidenced.", "Request named providers, quality agreements, audit results, and continuity plans."]
      - ["Capital to fund clinical milestones", "Equity investors and financing sources", "Goodwin reports $263 million across Series D/E; LifeMine states $558 million total raised, neither figure measures current cash.", "Insufficient available capital could delay or stop clinical development.", "Potentially critical if runway does not cover the next milestone.", "Recent financing is a source of capital, but cash balance, burn, and runway are not disclosed.", "Obtain current cash, monthly burn, commitments, debt, and milestone-linked financing needs."]
    notes: "Financing amounts are reported funding raised, not cash available. This partial register does not imply that a partner or financing failure has occurred."
    claimRefs: [CR004, CR005, CR006, CR007, CR009, CR015]
