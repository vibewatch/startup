      - ["External R&D provider oversight and continuity", "CEO told Fierce a large external R&D force supported the clinical-stage transition; providers were not named.", "Potentially material to quality, timelines, and control of work.", "No provider controls or contingency plan are described in the assigned sources.", "Unknown.", "Request provider roster, quality agreements, audit status, concentration, and backup arrangements."]
      - ["Facility consolidation and site continuity", "Fierce reported consolidation into a 55,000-square-foot Watertown facility; LifeMine's contact page lists Watertown, Gloucester, and Basel sites.", "Operational impact cannot be sized from site listings alone.", "A consolidation was reported; implementation and continuity controls are not documented.", "Unknown.", "Confirm which sites and capabilities remain active and how records, equipment, and staff transitions were controlled."]
      - ["Recruiting impersonation and applicant data handling", "The official careers page warns candidates about payment and sensitive-information requests; it does not report a confirmed incident.", "Potential applicant harm; no company incident is established.", "Company publishes an official-application route and recruiting contact.", "Residual impersonation exposure is not measured.", "Verify reporting/escalation process and whether any incidents or losses occurred; do not infer a breach from the warning."]
    notes: "Partial risk register from an independent report and LifeMine pages. Reported restructuring and company warnings are not evidence of a clinical quality failure, confirmed fraud, or security breach."
    claimRefs: [CR007, CR008, CR012, CR013, CR014]
  - id: TR003
