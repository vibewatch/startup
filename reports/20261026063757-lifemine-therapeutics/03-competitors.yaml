figures:
  - id: FP001
    title: Mechanism differentiation versus clinical maturity
    type: quadrant
    summary: "Analyst ordinal scores from 1 (low) to 5 (high), based on this chapter's cited evidence: LIFE-001 is differentiated in mechanism but early in clinical validation, while tacrolimus is an established comparator with a less differentiated legacy mechanism. Formulations of tacrolimus are shown separately but share one active ingredient. Coordinates are not trial outcomes or a validated benchmark."
    data:
      points:
        - label: LIFE-001
          x: 5
          "y": 1
          detail: Company-described direct mechanism; Phase I registry record has no results posted.
        - label: Tacrolimus immediate-release oral
          x: 1
          "y": 5
          detail: Kidney-transplant rejection prophylaxis is listed in the cited monograph; legacy calcineurin-inhibitor mechanism.
        - label: Tacrolimus intravenous
          x: 1
          "y": 5
          detail: The monograph lists an IV formulation for kidney-transplant rejection prophylaxis; it is the same active drug as oral forms.
        - label: Tacrolimus extended-release
          x: 1
          "y": 5
          detail: Extended-release capsules and tablets are listed in the monograph; they are formulations of the same incumbent active drug.
        - label: Cyclosporine
          x: 1
          "y": 4
          detail: Named as a legacy calcineurin inhibitor and kidney-transplant comparator; agent-specific evidence is limited in this source set.
        - label: Voclosporin
          x: 1
          "y": 2
          detail: Named by LifeMine among existing calcineurin inhibitors; no independent transplant-scale evidence was retained.
