chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and discovery platform
        blocks:
          - type: paragraph
            body: >-
              LifeMine describes itself as a clinical-stage biopharmaceutical company using digital genomic search
              technology from fungi to source precision medicines. BioPharma Dive reports that the company was formed in
              2017; its current contact page identifies Watertown, Massachusetts, as headquarters, with additional
              offices in Gloucester and Basel. The company presents LIFE-001 as the first clinical proof point of this
              discovery approach. That establishes a coherent company identity and a tangible lead program, but not a
              validated repeatable discovery engine: the assigned materials do not provide an independently reviewed
              portfolio-conversion rate, platform productivity benchmark, or commercial revenue base. Company
              descriptions of the platform should therefore remain distinguished from externally demonstrated
              performance.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              LifeMine identifies co-founder Gregory Verdine as President and CEO. BioPharma Dive describes him as a
              former Harvard chemical biologist and serial biotech entrepreneur, making scientific and company-building
              experience visible in the public leadership narrative. The company also lists transplant surgeon Andrew
              Cameron on its Clinical Advisory Board, and its October 2026 news page records the board's formation.
              BioSpace separately reports the addition of Yves Zinggeler as chief commercial officer, but that
              appointment was not corroborated by another assigned source. These are useful signals of founder,
              clinical, and commercial coverage, not a complete governance map: the materials do not establish the full
              executive roster, board control, succession depth, or the division of operating authority.
            claimRefs:
              - CO007
              - CO008
              - CO009
