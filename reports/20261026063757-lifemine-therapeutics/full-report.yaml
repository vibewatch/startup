      - number: '1.4'
        title: Milestones and execution risk
        blocks:
          - type: paragraph
            body: >-
              The milestone record combines company announcements with independent reporting. LifeMine says LIFE-001
              remains in an ongoing Phase 1 study involving more than 120 adults and projects Phase 2 kidney-transplant
              and Phase 1b islet-cell studies for early 2027; these are company statements and plans, not independently
              reviewed efficacy results. Fierce Biotech reports that the company previously laid off staff and paused
              its fungal platform while concentrating resources on LIFE-001, and that a GSK discovery collaboration
