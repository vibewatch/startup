      - number: '6.4'
        title: Durability and expansion remain unmeasured
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence provides no customer count, revenue generated from product sales, renewal or
              retention rate, cohort data, contract duration, concentration measure, or center-level outcome. The
              B2B/product-sales classification is therefore a business-model description, not a traction metric. For a
              clinical-stage asset, the path from discovery to durable commercial use still depends on clinical
              validation, regulatory decisions, site operations, and payer or partner economics; the reviewed sources do
              not document those downstream gates as completed. Diligence should request the current GSK agreement scope
              and economics, trial-site roster and enrollment denominators, and any paid collaborations or product
              revenue, then verify renewals and customer concentration against contracts and finance records.
            claimRefs:
