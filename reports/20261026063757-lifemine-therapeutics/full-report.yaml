      - number: '6.2'
        title: Clinical milestones are not commercial adoption
        blocks:
          - type: paragraph
            body: >-
              The clearest public adoption-adjacent signal is clinical progression: LifeMine's news page lists
              first-participant dosing in a first-in-human Phase 1 trial on April 8, 2025. The page also lists formation
              of an organ-transplant clinical advisory board on October 15, 2026. These are development and
              expert-engagement milestones, not disclosed customer deployments or trial-site counts. The assigned
              evidence includes no named participating center, patient outcomes, repeat purchasing, or utilization
              denominator. NMDP and provider directories can help diligence the transplant-site landscape, but a
              directory listing is not evidence that LifeMine selected or contracted with any listed institution.
