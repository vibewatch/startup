              LifeMine's August 2026 news index lists a company announcement titled “LifeMine Raises $263 Million,”
              while a CEO-attributed article describes the $263 million as a $188 million Series E plus a previously
              completed $75 million Series D (CI001, CI002, CI003). These are financing-event amounts, not a reported
              current cash balance. The recorded lifetime totals differ: FundedIQ lists $413 million across three
              rounds, the CEO-attributed account says approximately $558 million, and Forge displays $522.71 million
              total funding alongside a $150.54 million Series E entry and $469.78 million post-money valuation (CI004,
              CI005, CI006). Forge says its post-money valuation is estimated from company-submitted incorporation
              certificates and disclaims independent verification (CI007). These records have different methods and
