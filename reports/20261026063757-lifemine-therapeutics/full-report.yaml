      - number: '6.3'
        title: Named counterparties do not yet establish a customer base
        blocks:
          - type: paragraph
            body: >-
              GSK is the clearest named commercial-side counterparty in the assigned sources: Fierce Biotech describes a
              2022 R&D alliance to develop three drug candidates, while a 2026 third-party profile reports GSK among
              Series E participants. Neither fact establishes that the alliance remains operational, that a product has
              been sold, or what economics accrue to LifeMine. Fierce also reported restructuring as the company
              prioritized its lead clinical program and said the number of affected staff had not been disclosed at
              press time. The selected transplant centers in the table are ecosystem examples only; the sources do not
              identify them as LifeMine customers, trial sites, or reference accounts.
