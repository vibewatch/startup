      - number: '7.3'
        title: Partner and capital dependencies
        blocks:
          - type: paragraph
            body: >-
              Goodwin reports $263 million of financing across a $75 million Series D closed in 2025 and a $188 million
              Series E completed in July 2026; LifeMine's own site says total funding raised is $558 million (CR004,
              CR005, CR006). These are financing disclosures, not cash available, revenue, or runway. Fierce reported
              that the current status of LifeMine's GSK collaboration was unclear at publication and that the parties
              had not answered its questions (CR009). The sources also do not identify the terms, rights, milestones,
              economics, or termination provisions of that relationship. Request current cash and burn data alongside
              the executed partner agreements; until then, capital adequacy and partner optionality cannot be assessed
              from round size alone.
            claimRefs:
