  summary: >-
    LifeMine Therapeutics is a Watertown-based clinical-stage biotech formed in 2017. It describes a fungal-genomics
    discovery platform and identifies LIFE-001, a long-acting injectable calcineurin activation inhibitor, as its lead
    transplant program. The company announced $263 million of Series D and Series E financing in 2026, but public
    reports disagree on cumulative capital raised, and the reviewed sources do not establish available cash, runway,
    commercial revenue, or current valuation.
