  - id: FR001
    title: Qualitative risk evidence and mitigation matrix
    type: matrix
    summary: >-
      The matrix separates potential downside from what the assigned evidence can establish about likelihood and
      mitigation; it contains no numeric risk scores.
    data:
      columns:
        - Potential impact
        - Likelihood evidence
        - Mitigation maturity
        - Residual exposure
        - Diligence trigger
        - Evidence boundary
      rows:
        - label: LIFE-001 clinical progression
          values:
            - Potentially thesis-critical if safety or efficacy prevents progression
            - 'Not estimable: first-participant dose is reported, but no outcomes are provided'
            - Advisory board described; effectiveness is not demonstrated
            - Obtain full Phase 1 and regulator evidence
            - Safety, PK/PD, discontinuations, and next milestones
            - No numeric probability or outcome in assigned pages
        - label: Operating transition
          values:
            - Potentially material to trial execution and quality
            - Staff changes and external R&D were reported; impact is unquantified
            - Resource rebalancing is the reported rationale; controls are not documented
            - Verify staffing, vendor oversight, and continuity
            - Critical-role coverage and vendor quality controls
            - No reported quality failure or quantified staffing impact
        - label: Partner and IP rights
          values:
            - Potentially material if rights constrain development
            - Current GSK status and company-specific FTO are unknown
            - No current agreement terms or FTO evidence in the assigned sources
            - Confirm rights, economics, ownership, and FTO
            - Executed GSK agreement and IP/FTO diligence
            - General WIPO guidance is not a LifeMine-specific review
    approximationNotes: >-
      Qualitative, source-bounded assessment only; potential impact is not a probability estimate, and unknown
      likelihood must not be read as low.
