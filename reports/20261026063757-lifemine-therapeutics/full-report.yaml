        title: Financing and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              LifeMine announced $263 million of financing in August 2026, comprising a $188 million Series E and a
              previously completed $75 million Series D. The release and independent coverage identify Milky Way
              Investments as the Series E lead and name new and continuing institutional and family office investors.
              This is gross financing, not evidence of cash still available, runway, or valuation. Published
              lifetime-funding totals do not reconcile: StartupRise reports $558 million, while BioPharma Dive reports
              roughly $580 million. The difference may reflect differing financing histories or source treatment, but
              the assigned evidence cannot resolve it. No valuation, share count, liquidation preference, revenue, cash
              balance, burn, runway, customer count, or headcount figure is established in the reviewed materials; those
              are diligence gaps, not zeros.
