      - number: '7.2'
        title: Operating concentration and execution transition
        blocks:
          - type: paragraph
            body: >-
              Fierce Biotech reported that LifeMine was reducing staff and redirecting resources toward clinical
              development; the CEO described a “rebalancing of capital and personnel,” while the article said the
              company did not disclose the number affected or whether LIFE-001 had become its only asset (CR007). The
              same report relayed the CEO's statement that internal operations were being consolidated into a
              55,000-square-foot Watertown facility and that a large external R&D force was part of the transition
              (CR008). These are reported changes, not proof of a quality failure or clinical delay. The current source
              set does not identify the external providers, staffing baseline, quality controls, or continuity plan.
              Diligence should test whether trial execution, vendor oversight, and facilities remain adequately
              resourced.
            claimRefs:
              - CR007
              - CR008
              - CR013
              - CR014
