  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Entry decision and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              LifeMine's official news page lists an August 6, 2026 announcement titled “LifeMine Raises $263 Million”;
              Fierce Biotech reports that the financing combined a $188 million Series E with a previously completed $75
              million Series D. Startuprise repeats a $558 million cumulative amount raised. These are financing
              amounts, not a disclosed post-money valuation, current cash balance, or investor return. The retrieved
              financing coverage gives no price per share, capitalization table, or liquidation-preference waterfall.
              Accordingly, the evidence supports a track / research-more decision, not a numeric fair-value opinion: do
              not underwrite a fresh entry at an undisclosed price. Confidence is medium on this evidence-based decision
              and low on fair value; the clinical and financing risk is high.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The upside case is a platform with a company-reported library of 100,000 deep-sequenced fungal strains
              across more than 25,000 species, paired with a lead asset that the company says is in a first-in-human
              Phase 1 study. LifeMine's pipeline page says kidney- and islet-cell-transplant studies are expected to
              begin in early 2027. These are meaningful development milestones, but platform scale is not proof of
              reproducible discovery economics, and a company description is not independent confirmation of clinical
              benefit. The counterweight is execution and concentration risk: Fierce reported that the platform had been
              put on ice during a prior period of austerity and that the GSK discovery alliance had stalled after GSK
              reprioritized internally. The new financing changes the funding context; it does not erase the need to
              establish clinical differentiation, partnership economics, and a capital-efficient path to the next value
              inflection. LifeMine reports a Watertown headquarters and additional offices in Gloucester and Basel, but
              those locations disclose no staffing or cost denominator.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Bull, base, and bear cases can be framed as milestone paths, but a defensible equity or enterprise-value
              range cannot be calculated from these sources: the latest financing price, fully diluted share count,
              preference stack, cash and burn, and clinical outcome probabilities are not supplied. Fierce attributes a
              $25–$30 billion opportunity to the CEO if LIFE-001 is approved; the article does not specify a revenue
              period, denominator, or independently validated market model, so this is not treated as revenue,
              addressable market, or a valuation input. Companies Market Cap reports Eledon Pharmaceuticals' market
              capitalization at $0.18 billion on October 25, 2026. That is one public-company market snapshot, not a
              directly comparable valuation benchmark for LifeMine. Entry discipline is therefore binary rather than
              price-target based: revisit only after disclosed financing terms and clinical evidence can support a
              probability-weighted model; do not fill missing inputs with unsupported multiples or scenario
              probabilities.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The path from financing to investable value runs through clinical proof, disclosed ownership economics,
              and an executable development plan. The company identifies LIFE-001 as a Phase 1 program and expects
              transplant studies in early 2027; these are forward-looking milestones, not achieved outcomes. No exit
              value, liquidity route, or return horizon is supportable from the retained evidence. Before underwriting,
              obtain the Series E price and fully diluted capitalization, preferred rights and seniority, current cash
              and burn with milestone runway, protocol and independent safety/PK/PD data, trial timelines, and the GSK
              alliance's rights and economics. Reassess if studies are delayed, safety or efficacy fails to
              differentiate LIFE-001, the platform remains single-asset dependent, or the funding terms imply dilution
              or preferences that absorb plausible exit proceeds.
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Defer a new entry price
            body: >-
              Public evidence establishes a financing and an active clinical program, but not the price, capitalization,
              cash runway, or outcome probabilities needed for an investable valuation.
            calloutType: recommendation
            claimRefs:
