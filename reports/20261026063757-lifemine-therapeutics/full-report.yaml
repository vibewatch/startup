      - number: '4.2'
        title: The disclosed capital plan is clinical, not commercial
        blocks:
          - type: paragraph
            body: >-
              The company-attributed account says financing proceeds will support clinical development of LIFE-001 and
              advance its transplantation and immunology pipeline; it describes plans for a Phase 2 kidney-transplant
              study and a Phase 1b islet-cell-transplant study (CI008, CI009). This establishes a stated use and
              development plan, not the amount allocated to either study, a timing-adjusted budget, or a path to
              recognized revenue. The assigned evidence contains no supported product price, realized revenue, royalty,
              milestone-payment, or revenue-recognition figure for underwriting (CI015). LifeMine's economic model
              therefore remains dependent on financing and/or future partnering or product commercialization, with the
              economics of any such arrangement unproven in this evidence set.
            claimRefs:
