      - number: '7.4'
        title: Monitoring gates and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Monitoring should focus on evidence that can change the clinical and financing assessment: the next
              disclosed LIFE-001 safety and pharmacology data, trial progress against company-provided milestones, any
              confirmed change in the active pipeline, and a documented current status for the GSK relationship (CR002,
              CR007, CR009, CR014). A material safety signal, a regulatory hold, inability to fund the next clinical
              milestone, or loss of a critical partner would warrant a thesis reset; these are diligence triggers, not
              events established by the assigned sources. LifeMine's careers page warns applicants about recruiting
              impersonation and sensitive-information requests, but it reports no confirmed security incident (CR012).
              The missing cash, trial, partner, and IP records are material diligence gaps, not evidence that an adverse
              event has occurred.
