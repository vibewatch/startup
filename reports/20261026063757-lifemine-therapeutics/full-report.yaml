  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical, regulatory, and intellectual-property exposure
        blocks:
          - type: paragraph
            body: >-
              LifeMine identifies LIFE-001 as its lead clinical-stage program and its news page lists an April 2025
              first-participant dose in a first-in-human Phase 1 trial (CR001, CR002). The company describes a clinical
              advisory board that will advise on development, but that is an oversight mechanism, not efficacy, safety,
              or regulatory validation (CR003). The assigned company pages do not provide trial outcomes or a
              regulator-record identifier (CR014); they therefore cannot establish safety, efficacy, approval status, or
              the probability of success. WIPO's general biotechnology guidance emphasizes the financing and
              commercialization importance of patent rights and freedom-to-operate analysis, but does not assess
              LifeMine's portfolio (CR010, CR011). Obtain the trial package and a company-specific IP/FTO review before
              treating either risk as mitigated.
