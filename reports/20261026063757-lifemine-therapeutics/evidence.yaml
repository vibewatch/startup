evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-financial-disclosure
    missingEvidence: >-
      Current valuation, share count, liquidation preferences, revenue, cash balance, burn, runway, headcount, and
      customer or licensing metrics; public cumulative-funding reports also conflict.
    whyItMatters: >-
      Without these inputs, investors cannot assess dilution, financial durability, operating scale, or the capital
      required to reach the planned transplant studies.
    diligencePath: >-
      Request the latest financing documents and cap table, audited financial statements, current cash forecast and
      milestone bridge, employee roster, and a reconciled financing schedule.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: independent-LIFE-001-clinical-evidence
    missingEvidence: >-
      A complete independent Phase 1 dataset with safety, pharmacokinetic, pharmacodynamic, discontinuation, and
      dose-level detail, plus a verified protocol and current trial status.
    whyItMatters: >-
      The available evidence for the lead program's favorable profile is company-reported and does not establish
      efficacy or tolerability in transplant recipients.
    diligencePath: >-
      Obtain the clinical study report or a complete conference or journal data package and reconcile planned study
      dates against trial registrations.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: GSK-rights-and-platform-economics
    missingEvidence: >-
      Current GSK collaboration status, rights scope, economics, IP encumbrances, and the company's plan for the broader
      platform after the reported pause.
    whyItMatters: >-
      These terms could determine whether platform value accrues to LifeMine and whether the company can fund or partner
      programs beyond LIFE-001.
    diligencePath: >-
      Review the executed collaboration and IP agreements, amendments, termination or reprioritization notices, and the
      current platform staffing and program plan.
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-governance-roster
    missingEvidence: >-
      A complete current executive, statutory-board, and clinical-advisory roster with biographies, reporting lines, and
      governance authority.
    whyItMatters: >-
      The public record identifies selected leaders but is insufficient to assess management depth, board oversight, or
      key-person concentration.
    diligencePath: >-
      Request the current organization chart, board and committee roster, executive biographies, and succession
      coverage.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A dated, indication-specific estimate of eligible patients, treatment duration, annual drug spend, expected net
      price, and reimbursement for LIFE-001; the assigned sources do not provide these inputs.
    whyItMatters: >-
      Procedure counts cannot be converted into an addressable market without the eligible share, treatment course,
      pricing, and adoption assumptions; any precise TAM, SAM, or SOM would otherwise be invented.
    diligencePath: >-
      Request management's indication-level epidemiology, treatment assumptions, pricing and payer-access model, then
      reconcile the denominator to SRTR/OPTN data and label all modeled conversions.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-gap
    missingEvidence: >-
      Evidence identifying the transplant-center decision maker, budget owner, procurement pathway, payer reimbursement,
      and switching criteria for LIFE-001.
    whyItMatters: >-
      Clinical need does not establish a purchasing path or payer acceptance; these factors determine whether an
      efficacious therapy can be adopted.
    diligencePath: >-
      Obtain trial-site and transplant-center interviews, payer research, formulary/procurement workflow, and a
      documented comparison with current immunosuppressive regimens.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-economics
    missingEvidence: >-
      Current net prices, treatment-course costs, payer coverage, and transplant-center contract terms for LIFE-001 and
      comparator regimens.
    whyItMatters: >-
      Without comparable regimen-level economics, a potential cost or access advantage cannot be credited and
      pricing-based substitution risk cannot be assessed.
    diligencePath: >-
      Obtain current U.S. net-price and reimbursement scenarios from LifeMine, transplant centers, and payers, including
      administration and monitoring costs.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: clinical-comparison-and-switching
    missingEvidence: >-
      Head-to-head or otherwise comparable efficacy, safety, dosing-burden, and real-world adoption evidence across
      LIFE-001 and incumbent transplant regimens.
    whyItMatters: >-
      A differentiated mechanism does not establish clinical superiority, switching willingness, or durable displacement
      of established protocols.
    diligencePath: >-
      Request the full LIFE-001 Phase I package and protocol-level plans, then compare results with transplant-center
      practice and relevant active-comparator studies.
    relatedQuestionRefs:
      - QP004
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: private-unit-economics
    missingEvidence: >-
      Dated financial statements and management schedules for revenue by stream, product pricing, recognition, gross
      margin, cost of goods, trial costs, external R&D, and commercial-channel economics.
    whyItMatters: >-
      Without operating metrics, revenue quality, future margin potential, and any commercial unit economics cannot be
      underwritten.
    diligencePath: >-
      Request audited or reviewed statements, a stream-level revenue schedule, trial and external-R&D budgets, and
      management's documented pricing and commercialization assumptions.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Current cash and restricted cash, monthly operating burn, debt and committed obligations, and a milestone-based
      forecast through the next clinical readout.
    whyItMatters: >-
      Announced financing is not cash available; these inputs determine whether the company can reach clinical
      milestones without another financing.
    diligencePath: >-
      Request a current balance sheet, monthly cash bridge, debt schedule, trial commitments, and downside/base-case
      runway model with milestone triggers.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
