schemaVersion: "report-v2"
artifact: valuation
slug: lifemine-therapeutics
runDate: 2026-10-26
company:
  name: LifeMine Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: LifeMine disclosed a $263 million financing and is advancing LIFE-001 in Phase 1, but the retained public evidence gives no financing valuation, capitalization terms, cash runway, or independent clinical data package. Track the company, but defer a new entry price or numeric valuation range until those inputs and the next clinical milestones are diligence-ready.
sections:
  - id: entry-decision
    title: Entry decision and valuation evidence
    body: >-
      LifeMine's official news page lists an August 6, 2026 announcement titled
      “LifeMine Raises $263 Million”; Fierce Biotech reports that the financing
      combined a $188 million Series E with a previously completed $75 million
      Series D. Startuprise repeats a $558 million cumulative amount raised.
      These are financing amounts, not a disclosed post-money valuation, current
      cash balance, or investor return. The retrieved financing coverage gives
      no price per share, capitalization table, or liquidation-preference
      waterfall. Accordingly, the evidence supports a track / research-more
      decision, not a numeric fair-value opinion: do not underwrite a fresh
      entry at an undisclosed price. Confidence is medium on this evidence-based
      decision and low on fair value; the clinical and financing risk is high.
    claimRefs: [CV001, CV002, CV003, CV004, CV013, CV015]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The upside case is a platform with a company-reported library of 100,000
      deep-sequenced fungal strains across more than 25,000 species, paired with
      a lead asset that the company says is in a first-in-human Phase 1 study.
      LifeMine's pipeline page says kidney- and islet-cell-transplant studies
      are expected to begin in early 2027. These are meaningful development
      milestones, but platform scale is not proof of reproducible discovery
      economics, and a company description is not independent confirmation of
      clinical benefit. The counterweight is execution and concentration risk:
      Fierce reported that the platform had been put on ice during a prior
      period of austerity and that the GSK discovery alliance had stalled after
      GSK reprioritized internally. The new financing changes the funding
      context; it does not erase the need to establish clinical differentiation,
      partnership economics, and a capital-efficient path to the next value
      inflection. LifeMine reports a Watertown headquarters and additional
      offices in Gloucester and Basel, but those locations disclose no staffing
      or cost denominator.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV014, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      Bull, base, and bear cases can be framed as milestone paths, but a
      defensible equity or enterprise-value range cannot be calculated from
      these sources: the latest financing price, fully diluted share count,
      preference stack, cash and burn, and clinical outcome probabilities are
      not supplied. Fierce attributes a $25–$30 billion opportunity to the CEO
      if LIFE-001 is approved; the article does not specify a revenue period,
      denominator, or independently validated market model, so this is not
      treated as revenue, addressable market, or a valuation input. Companies
      Market Cap reports Eledon Pharmaceuticals' market capitalization at
      $0.18 billion on October 25, 2026. That is one public-company market
      snapshot, not a directly comparable valuation benchmark for LifeMine.
      Entry discipline is therefore binary rather than price-target based:
      revisit only after disclosed financing terms and clinical evidence can
      support a probability-weighted model; do not fill missing inputs with
      unsupported multiples or scenario probabilities.
    claimRefs: [CV002, CV003, CV005, CV011, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and diligence gates
    body: >-
      The path from financing to investable value runs through clinical proof,
      disclosed ownership economics, and an executable development plan. The
      company identifies LIFE-001 as a Phase 1 program and expects transplant
      studies in early 2027; these are forward-looking milestones, not achieved
      outcomes. No exit value, liquidity route, or return horizon is supportable
      from the retained evidence. Before underwriting, obtain the Series E
      price and fully diluted capitalization, preferred rights and seniority,
      current cash and burn with milestone runway, protocol and independent
      safety/PK/PD data, trial timelines, and the GSK alliance's rights and
      economics. Reassess if studies are delayed, safety or efficacy fails to
      differentiate LIFE-001, the platform remains single-asset dependent, or
      the funding terms imply dilution or preferences that absorb plausible
      exit proceeds.
    claimRefs: [CV006, CV008, CV010, CV013, CV015]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Evidence-based assessment, Investor implication]
    rows:
      - ["Recommendation", "Track / research more; no new entry at an undisclosed price", "Re-underwrite when financing terms and clinical evidence are available"]
      - ["Confidence", "Medium on the decision to defer; low on fair value", "The evidence supports disciplined uncertainty, not a price target"]
      - ["Risk rating", "High: clinical-stage lead asset and unresolved financing economics", "Require milestone and capitalization diligence before commitment"]
      - ["Valuation stance", "Not estimable from retained public inputs; neither cheap nor stretched is established", "Do not infer valuation from funding raised or a non-comparable public market cap"]
    notes: >-
      Judgment is based on the assigned prefetched evidence as of 2026-10-26.
      “Not estimable” is not a zero valuation or a claim that the company has no
      value; it reflects missing transaction price, capitalization, cash, and
      outcome-probability inputs.
    claimRefs: [CV001, CV002, CV003, CV013, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, Counter-evidence or limitation, Valuation implication]
    rows:
      - ["Discovery-platform optionality", "Company reports 100,000 sequenced strains across more than 25,000 species", "Company-reported platform scale does not establish repeatable output, economics, or independent validation", "Credit as an option only after externally validated candidate productivity"]
      - ["LIFE-001 clinical opportunity", "Company says LIFE-001 is in Phase 1 and expects transplant studies in early 2027", "No independent clinical data package or quantified probability of success is in the retained evidence", "Use milestone-based scenarios; do not capitalize approval assumptions as fact"]
      - ["New financing", "Company lists a $263 million raise; Fierce reports $188 million Series E plus $75 million Series D", "Funding raised is not current cash, post-money value, or available runway", "Request transaction terms and current cash/burn before modeling dilution"]
      - ["Execution and partner risk", "Fierce reports prior austerity, a paused platform, and a stalled GSK alliance", "The same article reports renewed financing; current rights and economics remain unclear", "Require milestone bridge, rights scope, and concentration analysis"]
    notes: >-
      Company claims are attributed to company-issued pages or statements
      reported by Fierce. The table distinguishes evidence of financing and
      scientific activity from evidence of economic value.
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenario gates
    columns: [Scenario, Explicit assumptions and probability signal, Valuation or return logic, Downside trigger / next evidence]
    rows:
      - ["Bull", "LIFE-001 differentiates clinically; planned transplant studies start and produce favorable data; platform yields additional validated assets. Low-confidence signal until human data.", "No numeric range is supportable; value would depend on disclosed terms, clinical probability, and commercial economics.", "Require protocol, safety/PK/PD and efficacy readouts, trial execution, and independently supportable market assumptions."]
      - ["Base", "Development advances but clinical and platform economics remain unproven. Central planning case only; probability is not quantified.", "No numeric range or return estimate is supportable without price, share count, preferences, cash, and burn.", "Reassess after financing terms, runway, and the next clinical milestone are disclosed."]
      - ["Bear", "Clinical differentiation fails, studies slip, or the platform remains concentrated in one lead program. Material downside is plausible but unquantified.", "Downside cannot be bounded from public evidence; preferences and dilution could materially affect common-equity recovery.", "Trigger reassessment for safety/efficacy failure, trial delay, financing need before data, or unfavorable preference seniority."]
      - ["Public reference only", "Companies Market Cap reports Eledon's market cap at $0.18 billion on Oct. 25, 2026; Eledon is a competitor, not an independent valuation benchmark.", "Do not apply this market capitalization as a LifeMine multiple or valuation range.", "A usable comp set requires stage-, asset-, rights-, and capitalization-adjusted data."]
    notes: >-
      Scenario likelihoods are qualitative signals, not assigned probabilities.
      No monetary company valuation, expected return, revenue forecast, or
      probability-weighted range is estimated because the required inputs are
      absent. Eledon's market capitalization is retained as a dated public
      reference only, not as a comparable benchmark.
    claimRefs: [CV005, CV006, CV011, CV012, CV013, CV015]
