        - id: price
          label: "Price gate"
          detail: "Post-money valuation, share count, preferences, cash, and burn are unavailable"
        - id: terms
          label: "Terms and runway"
          detail: "Obtain share count, preferences, current cash, and burn"
        - id: decision
          label: "Decision"
          detail: "Track / research more; no new entry price or numeric valuation range"
    claimRefs: [CV002, CV006, CV009, CV010, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Defer a new entry price
    body: >-
      Public evidence establishes a financing and an active clinical program,
      but not the price, capitalization, cash runway, or outcome probabilities
      needed for an investable valuation.
    claimRefs: [CV002, CV006, CV013, CV015]
  - calloutType: risk
    title: Funding is not valuation or cash
    body: >-
      The reported amount raised is cumulative financing evidence; it does not
      establish current cash available, post-money value, or investor recovery
      after preferences and dilution.
    claimRefs: [CV002, CV003, CV004, CV013]
