- id: TE003
  title: Technology dependencies and validation gaps
  columns:
  - Layer / dependency
  - Role
  - Evidence available
  - Risk or uncertainty
  - Diligence evidence required
  rows:
  - - Fungal collection and sequencing
    - Provides genomic search space
    - 100000-strain scale reported by Fierce; MTEC describes LifeBank
    - Counts do not show access rights, completeness, or useful diversity
    - Collection inventory, provenance, sequence quality, and governance
  - - BGC expression and compound recovery
    - Moves sequence hypotheses into experimental chemistry
    - General technical paper identifies refactoring needs for fungal BGC expression in yeast
    - Field context does not establish LifeMine’s specific expression system
    - Company-specific methods, recovery rates, and independent replication
  - - AI and target prioritization
    - Prioritizes candidate pathways and target hypotheses
    - Fierce reports 1200 potential targets and a planned AI-agent workflow
    - Potential targets and roadmap are not validated outputs
    - Target-level evidence, benchmark set, false-positive rate, and decision logs
  - - Clinical and quality systems
    - Translates LIFE-001 into a safe reproducible product
    - Phase 1 start and management-reported safety comments are publicly described
    - Complete protocol, clinical dataset, CMC controls, and detailed quality/security practices are not in this
      pool
    - Protocol, full safety/PK-PD data, manufacturing controls, and system-control documentation
  notes: The technical paper is general fungal-BGC evidence, not a description of LifeMine’s proprietary implementation.
    Missing details are evidence gaps, not proof that controls or capabilities do not exist.
