    - Described as integrated capabilities; no throughput disclosed
    - Combines computational selection with laboratory work
    - Assay reproducibility, compound recovery, and chemistry success rates
  - - LIFE-001
    - Lead clinical product for transplant-related immune suppression
    - First-in-human Phase 1 dosing announced in April 2025
    - Company describes a long-acting injectable calcineurin activation inhibitor
    - Full formulation, CMC, pharmacology, and clinical outcome package
