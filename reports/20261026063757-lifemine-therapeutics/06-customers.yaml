  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer or trial-site roster with production-versus-pilot status, site-level use, outcomes, and authorized references.
      whyItMatters: Without attributable deployments or customer outcomes, clinical progress and partner names cannot establish product adoption or repeatable demand.
      diligencePath: Request the current trial-site list, site activation and enrollment denominators, customer references, and evidence of any paid product deployments.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Customer count, recognized product-sales revenue, contract duration, renewals, retention cohorts, and concentration by customer or partner.
      whyItMatters: These measures determine whether the stated B2B model produces durable revenue and whether a small number of counterparties control commercialization.
      diligencePath: Review audited revenue schedules, customer and partner contracts, renewal history, and top-counterparty concentration under NDA.
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: gsk-partnership
      missingEvidence: Current GSK collaboration status, rights scope, economics, milestones, and responsibility split.
      whyItMatters: GSK is a named R&D counterparty and reported investor, but neither fact independently proves ongoing collaboration or customer revenue.
      diligencePath: Obtain the executed and amended collaboration agreement, current program status, milestone schedule, and revenue-recognition detail.
      relatedQuestionRefs: [QU003, QU005, QU007]
      relatedTableRefs: [TU003]
