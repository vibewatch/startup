chapter:
  number: 6
  title: Customers
  summary: Public evidence describes LifeMine as a B2B drug-discovery business and records clinical-development milestones, but it does not establish paid product sales, named transplant-site deployments, or customer retention. GSK is a named R&D counterparty and investor; the current operating scope and economics of that relationship remain unverified.
sections:
  - id: buyer-user-map
    title: Buyer, user, and beneficiary are different groups
    body: >-
      A third-party company profile characterizes LifeMine as B2B with product sales as
      its revenue model, but that classification is not evidence of realized product
      revenue. A potential economic buyer is a pharmaceutical partner licensing or
      co-developing assets; transplant centers and clinical investigators would be
      operational users during trials, while transplant recipients are intended
      beneficiaries rather than buyers. LifeMine's own listing describes medicines
      intended for patients, and public provider pages show that transplant care
      involves multidisciplinary teams and referral pathways. None of those provider
      pages establishes a relationship with LifeMine. The distinction matters: partner
      participation, patient need, and clinical-site capacity cannot substitute for
      contracts, active use, or payer evidence.
    claimRefs: [CU001, CU007, CU010, CU011, CU012, CU015]
    tableRefs: [TU001]
  - id: clinical-adoption-signals
    title: Clinical milestones are not commercial adoption
    body: >-
      The clearest public adoption-adjacent signal is clinical progression: LifeMine's
      news page lists first-participant dosing in a first-in-human Phase 1 trial on
      April 8, 2025. The page also lists formation of an organ-transplant clinical
      advisory board on October 15, 2026. These are development and expert-engagement
      milestones, not disclosed customer deployments or trial-site counts. The
      assigned evidence includes no named participating center, patient outcomes,
      repeat purchasing, or utilization denominator. NMDP and provider directories
      can help diligence the transplant-site landscape, but a directory listing is
      not evidence that LifeMine selected or contracted with any listed institution.
    claimRefs: [CU002, CU003, CU006, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-counterparties-and-proof
    title: Named counterparties do not yet establish a customer base
    body: >-
      GSK is the clearest named commercial-side counterparty in the assigned sources:
      Fierce Biotech describes a 2022 R&D alliance to develop three drug candidates,
      while a 2026 third-party profile reports GSK among Series E participants.
      Neither fact establishes that the alliance remains operational, that a product
      has been sold, or what economics accrue to LifeMine. Fierce also reported
      restructuring as the company prioritized its lead clinical program and said
      the number of affected staff had not been disclosed at press time. The selected
      transplant centers in the table are ecosystem examples only; the sources do not
      identify them as LifeMine customers, trial sites, or reference accounts.
    claimRefs: [CU004, CU005, CU013, CU015]
    tableRefs: [TU003]
  - id: durability-and-diligence
    title: Durability and expansion remain unmeasured
    body: >-
      The assigned evidence provides no customer count, revenue generated from
      product sales, renewal or retention rate, cohort data, contract duration,
      concentration measure, or center-level outcome. The B2B/product-sales
      classification is therefore a business-model description, not a traction
      metric. For a clinical-stage asset, the path from discovery to durable
      commercial use still depends on clinical validation, regulatory decisions,
      site operations, and payer or partner economics; the reviewed sources do not
      document those downstream gates as completed. Diligence should request the
      current GSK agreement scope and economics, trial-site roster and enrollment
      denominators, and any paid collaborations or product revenue, then verify
      renewals and customer concentration against contracts and finance records.
    claimRefs: [CU001, CU005, CU013, CU014, CU016]
