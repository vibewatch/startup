    - type: conflicting-data
      severity: material
      topic: funding-records
      missingEvidence: >-
        A company-confirmed round ledger reconciling Series E proceeds, the
        previously completed Series D, cumulative capital raised, and the
        valuation basis shown by third-party databases.
      whyItMatters: >-
        The reported Series E and lifetime totals differ across sources, and
        valuation records are not equivalent to cash proceeds or enterprise
        value.
      diligencePath: >-
        Request closing statements, cap-table and share-count history, round
        dates, and a definition-by-definition reconciliation of cumulative
        funding and post-money valuation.
