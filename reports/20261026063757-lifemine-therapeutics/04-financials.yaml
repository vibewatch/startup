company:
  name: LifeMine Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    LifeMine's 2026 financing announcements describe substantial capital raised
    for clinical development, but third-party round and valuation records do not
    reconcile to a single cumulative funding figure. The assigned public evidence
    does not establish commercial revenue, pricing, unit economics, cash, burn,
    or runway, so the clinical funding announcement cannot be treated as cash
    available or as evidence of a self-funding business.
sections:
  - id: financing-records
    title: Financing announcements do not establish available cash
    body: >-
      LifeMine's August 2026 news index lists a company announcement titled
      “LifeMine Raises $263 Million,” while a CEO-attributed article describes
      the $263 million as a $188 million Series E plus a previously completed
      $75 million Series D (CI001, CI002, CI003). These are financing-event
      amounts, not a reported current cash balance. The recorded lifetime totals
      differ: FundedIQ lists $413 million across three rounds, the CEO-attributed
      account says approximately $558 million, and Forge displays $522.71 million
      total funding alongside a $150.54 million Series E entry and $469.78
      million post-money valuation (CI004, CI005, CI006). Forge says its
      post-money valuation is estimated from company-submitted incorporation
      certificates and disclaims independent verification (CI007). These records
      have different methods and scopes; none is an audited financing
      reconciliation or a liquidity measure.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI002
  - id: monetization-and-capital-use
    title: The disclosed capital plan is clinical, not commercial
    body: >-
      The company-attributed account says financing proceeds will support
      clinical development of LIFE-001 and advance its transplantation and
      immunology pipeline; it describes plans for a Phase 2 kidney-transplant
      study and a Phase 1b islet-cell-transplant study (CI008, CI009). This
      establishes a stated use and development plan, not the amount allocated
      to either study, a timing-adjusted budget, or a path to recognized
      revenue. The assigned evidence contains no supported product price,
      realized revenue, royalty, milestone-payment, or revenue-recognition
      figure for underwriting (CI015). LifeMine's economic model therefore
      remains dependent on financing and/or future partnering or product
      commercialization, with the economics of any such arrangement unproven
      in this evidence set.
    claimRefs:
      - CI008
      - CI009
      - CI015
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: unit-economics-and-liquidity
    title: Private operating metrics block underwriting
    body: >-
      The retained evidence does not provide a current company revenue or ARR,
      list or realized pricing, gross margin, cost of goods, customer-acquisition
      cost, or payback period (CI015). It likewise does not report current cash,
      operating burn, runway, debt obligations, or a fully costed milestone
      bridge (CI016). These are unknowns, not zeros. A Fierce Biotech report
      describes staff reductions and consolidation of operations, but says the
      company had not provided the number of employees affected or whether
      LIFE-001 was its only pipeline asset at publication (CI010, CI011).
      Restructuring is a material capital-allocation signal, not a quantified
      savings estimate. A decision-grade model requires company financial
      statements, trial and external-R&D budgets, and a cash forecast through
      the next clinical value inflection.
    claimRefs:
      - CI010
      - CI011
      - CI015
      - CI016
    tableRefs:
      - TI003
  - id: financing-environment-and-verdict
    title: Capital-market context does not resolve company-level risk
    body: >-
      J.P. Morgan's July 2026 report records $16.3 billion of biopharma venture
      funding across 235 rounds in H1 2026 and says later-stage rounds received
      71% of deployed capital, versus 62% in 2025 (CI012, CI013). EY's 2026
      industry report, also summarized by BioProcess International, describes
      a market where financing and revenue are concentrated; its aggregate
      industry figures are not a LifeMine revenue or margin benchmark (CI014).
      These data show an active but selective financing market, not assured
      access to future capital. The financial verdict is therefore conditional:
      disclosed fundraising supports continued clinical work, while unresolved
      liquidity, trial-cost, financing-reconciliation, and commercial-economics
      questions prevent a reliable runway, dilution, or unit-economics
      assessment.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI016
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns:
      - Stream or mechanism
      - Public evidence in assigned sources
      - Underwriting treatment
      - Diligence request
    rows:
      - - LIFE-001 product sales
        - Clinical development is the stated focus; no realized sales figure is reported.
        - Revenue is not established; do not model as zero or as ARR.
        - Provide product-level recognized revenue, if any, with period and accounting basis.
      - - LIFE-001 pricing
        - No list price, contract price, or net realized price is reported.
        - Unknown; no price or reimbursement assumption is supported.
        - Provide pricing, access, discount, and reimbursement assumptions by indication.
      - - Platform or partnering economics
        - Financing account describes advancing a pipeline; no royalty, milestone, or upfront economics are stated.
        - No partnership revenue or license value can be credited from this evidence.
        - Provide current deal terms, rights, payment triggers, and recognized amounts.
      - - Revenue recognition and mix
        - No revenue mix, recognition policy, or segment disclosure is present in the assigned evidence.
        - Revenue quality and concentration are unassessable.
        - Provide audited statements and revenue-recognition policies by stream.
    notes: >-
      Public-source coverage only; “not reported” means unavailable in this
      assigned evidence, not proof that the value is zero or that no private
      transaction exists.
    claimRefs:
      - CI008
      - CI015
  - id: TI002
    title: Reported financing figures and limitations
    columns:
      - Source and reported measure
      - Amount or valuation
      - Period / definition
      - Limitation
    rows:
      - - LifeMine news index; announced raise
        - $263 million
        - Release dated August 6, 2026; headline amount
        - Company announcement; not a cash balance.
      - - CEO-attributed Management Boston account
        - $188 million Series E plus $75 million previously completed Series D; approximately $558 million lifetime
        - August 2026 financing account
        - Company-attributed report; cumulative total not reconciled to other databases.
      - - FundedIQ database
        - $188 million Series E; $413 million total across three rounds
        - Latest round listed as August 2026
        - Database's recorded rounds and cumulative total differ from the company-attributed account.
      - - Forge Global private-market page
        - $150.54 million Series E; $469.78 million post-money valuation; $522.71 million total funding
        - Series E row dated August 6, 2026; page updated August 20, 2026
        - Forge describes its valuation as estimated from company-submitted COIs and disclaims independent verification.
    notes: >-
      Amounts retain each publisher's labels and periods. The $263 million
      announcement includes a previously completed tranche in the
      CEO-attributed account; lifetime totals and Series E amounts conflict
      across records and should not be summed or treated as cash available.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns:
      - Metric
      - Public value in assigned evidence
      - Why it matters
      - Specific diligence request
    rows:
      - - Revenue, ARR, and revenue growth
        - Not established
        - Determines whether financing has a commercial offset; these measures are not interchangeable.
        - Provide audited revenue by stream and period, and separately defined ARR only if applicable.
      - - Gross margin, COGS, and trial-delivery cost
        - Not established
        - Clinical and external-R&D spend may dominate economics before commercialization.
        - Provide product and trial budgets, outsourced-R&D commitments, and gross-margin bridge.
      - - Pricing, CAC, and payback
        - Not established
        - No commercial sales-efficiency assumption is supported for a clinical-stage pipeline.
        - Provide pricing research, channel terms, sales-cycle assumptions, CAC, and payback methodology.
      - - Cash, burn, runway, and debt
        - Not established
        - Determines whether announced financing reaches the next value inflection without another raise.
        - Provide current cash, monthly cash burn, restricted cash, debt schedule, and milestone-based forecast.
    notes: >-
      All entries are evidence gaps, not numerical estimates or zero values.
      Request a dated management bridge with definitions, periods, and
      denominators before building an underwriting case.
    claimRefs:
      - CI010
      - CI011
      - CI015
      - CI016
