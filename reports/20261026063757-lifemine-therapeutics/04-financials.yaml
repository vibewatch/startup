    - type: private-evidence-only
      severity: material
      topic: liquidity
      missingEvidence: >-
        Current cash and restricted cash, monthly operating burn, debt and
        committed obligations, and a milestone-based forecast through the next
        clinical readout.
      whyItMatters: >-
        Announced financing is not cash available; these inputs determine whether
        the company can reach clinical milestones without another financing.
      diligencePath: >-
        Request a current balance sheet, monthly cash bridge, debt schedule, trial
        commitments, and downside/base-case runway model with milestone triggers.
      relatedQuestionRefs:
