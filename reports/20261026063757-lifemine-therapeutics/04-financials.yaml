    - type: private-evidence-only
      severity: material
      topic: private-unit-economics
      missingEvidence: >-
        Dated financial statements and management schedules for revenue by stream,
        product pricing, recognition, gross margin, cost of goods, trial costs,
        external R&D, and commercial-channel economics.
      whyItMatters: >-
        Without operating metrics, revenue quality, future margin potential, and
        any commercial unit economics cannot be underwritten.
      diligencePath: >-
        Request audited or reviewed statements, a stream-level revenue schedule,
        trial and external-R&D budgets, and management's documented pricing and
        commercialization assumptions.
