    - type: private-evidence-only
      severity: material
      topic: restructuring
      missingEvidence: >-
        Current workforce size, roles and locations affected by the reported
        restructuring, operating footprint, and the resulting cost or pipeline
        changes.
      whyItMatters: >-
        Without an updated workforce and operating plan, the effect of
        restructuring on cash needs, execution capacity, and development scope
        cannot be assessed.
      diligencePath: >-
        Request a current organization chart, dated headcount by function and
        location, restructuring timing, quantified savings, and approved
        pipeline priorities.
