  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing-gap
      missingEvidence: >-
        A dated, indication-specific estimate of eligible patients, treatment
        duration, annual drug spend, expected net price, and reimbursement for
        LIFE-001; the assigned sources do not provide these inputs.
      whyItMatters: >-
        Procedure counts cannot be converted into an addressable market without
        the eligible share, treatment course, pricing, and adoption assumptions;
        any precise TAM, SAM, or SOM would otherwise be invented.
      diligencePath: >-
        Request management's indication-level epidemiology, treatment
        assumptions, pricing and payer-access model, then reconcile the
        denominator to SRTR/OPTN data and label all modeled conversions.
      relatedQuestionRefs: [QM006]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-gap
      missingEvidence: >-
        Evidence identifying the transplant-center decision maker, budget
        owner, procurement pathway, payer reimbursement, and switching criteria
        for LIFE-001.
      whyItMatters: >-
        Clinical need does not establish a purchasing path or payer acceptance;
        these factors determine whether an efficacious therapy can be adopted.
      diligencePath: >-
        Obtain trial-site and transplant-center interviews, payer research,
        formulary/procurement workflow, and a documented comparison with
        current immunosuppressive regimens.
      relatedQuestionRefs: [QM006]
      relatedTableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition and boundaries
    columns: [Segment or category, Included or excluded spend, Buyer / user / payer, Relevance and evidence]
    rows:
      - [LIFE-001 for kidney transplantation, "Included clinical target; commercial market not yet demonstrated", "Transplant clinicians and centers are the care setting; buyer and payer are unverified", "Phase 2 kidney-transplant study planned for early 2027"]
      - [LIFE-001 for islet-cell transplantation, "Adjacent planned indication; no quantified market", "Clinical users, budget owner, and payer not disclosed", "Phase 1b study planned for early 2027"]
      - [Other solid-organ transplant indications, "Not separately included in a quantified near-term market", "No indication-specific buyer or payer evidence in the assigned sources", "Do not extrapolate the kidney/islet study plan to all organs"]
      - [Legacy immunosuppressive drugs, "Status-quo/substitute therapy, not incremental market spend", "Transplant physicians and resourced care facilities; exact purchasing path for LIFE-001 unknown", "FDA describes approved tacrolimus use and care requirements"]
      - [Fungal drug-discovery platform, "Excluded from the transplant-drug market boundary", "No separate transplant-market buyer or platform revenue is disclosed", "Company describes a broad discovery platform, not transplant-drug sales"]
    notes: >-
      Boundary is limited to the clinical product opportunity. Planned studies
      are not approvals or commercial launches; buyer, payer, and spend fields
      remain unknown where the assigned sources do not establish them.
    claimRefs: [CM004, CM005, CM006, CM010, CM012, CM013]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [Lens, Value and unit, Geography / period, Interpretation and limitation]
    rows:
      - ["Annual transplant procedure flow", "More than 45,000 procedures", "United States, 2024", "SRTR figure; does not equal treated patients, LIFE-001 eligibility, or annual drug sales"]
      - ["Wait-list additions", "One person every 10 minutes", "United States; period not separately stated on the landing page", "Demand-pressure indicator, not a transplant count or drug-market denominator"]
      - ["Living transplant-recipient population", "More than 1.6 million people", "Worldwide; date and methodology not stated in retained text", "MycoStories estimate; low-confidence, point-in-time stock, not annual flow"]
      - ["Drug spend / addressable eligible share", "Not disclosed in assigned evidence", "LIFE-001 indications; period not available", "No support for a numeric TAM/SAM/SOM without price, eligibility, treatment duration, and adoption inputs"]
    notes: >-
      These lenses use different units and time bases and must not be summed or
      treated as interchangeable. The transplant counts are not a revenue
      estimate; unknown values are evidence gaps, not zero.
    claimRefs: [CM001, CM002, CM003, CM012]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer / user, Payer or budget owner, Adoption trigger / evidence status]
    rows:
      - [Kidney-transplant recipients, "Transplant physicians and centers are the clinical setting", "Not identified for LIFE-001", "Company plans a Phase 2 study; efficacy, safety, and eligible population remain unquantified"]
      - [Islet-cell-transplant recipients, "Clinical users not identified by the assigned sources", "Not identified for LIFE-001", "Company plans a Phase 1b study; no addressable-patient estimate supplied"]
      - [Other solid-organ recipients, "Transplant-care teams are the general clinical setting", "Not identified for LIFE-001", "No indication-specific plan or commercial adoption evidence in the assigned pool"]
      - [Transplant centers and hospitals, "Experienced transplant clinicians; facilities need laboratory and supportive-care capacity for tacrolimus", "LIFE-001 procurement and budget ownership are unknown", "FDA's tacrolimus requirements are contextual and do not establish LIFE-001's label or purchasing path"]
    notes: >-
      Buyer and payer detail is not disclosed for LIFE-001. Standard-of-care
      requirements cited here refer to tacrolimus and should not be assumed to
      be the eventual LIFE-001 label.
    claimRefs: [CM005, CM007, CM012, CM013]
figures:
  - id: FM001
    title: Evidence-constrained transplant market layers (not to scale)
    type: pyramid
    summary: >-
      Public evidence narrows from transplant activity to clinical target
      segments, but does not quantify eligible patients or commercial value.
    data:
      items:
        - label: Annual U.S. transplant activity
          value: "45,000+ procedures in 2024"
          valueNote: "SRTR procedure flow; not a count of eligible LIFE-001 patients"
        - label: Disclosed near-term study segments
          value: "Kidney and islet-cell transplantation"
          valueNote: "Company-planned studies; not approved indications or proven adoption"
        - label: Eligible treated population and spend
          value: "Not quantified"
          valueNote: "Eligibility, price, duration, payer coverage, and uptake remain unknown"
        - label: Annual drug spend
          value: "Not disclosed"
          valueNote: "No pricing or treatment-duration input supports a spend estimate"
        - label: Buyer and payer pathway
          value: "Not disclosed"
          valueNote: "Clinical need does not establish procurement or reimbursement"
        - label: Additional organ indications
          value: "Not quantified"
          valueNote: "Do not extrapolate beyond the kidney and islet-cell studies named by LifeMine"
    approximationNotes: >-
      No market-size conversion is calculated. The layers are qualitative
      evidence boundaries, not proportional values or estimates.
    claimRefs: [CM001, CM005, CM012, CM013]
