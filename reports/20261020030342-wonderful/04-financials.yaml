callouts:
  - calloutType: "risk"
    title: "Capital is ample; capital efficiency is unproven"
    body: >-
      The $550 million Series C supports aggressive product and deployment expansion, but public
      sources do not disclose cash on hand, burn, runway, debt, gross margin, or payback. The round
      therefore reduces near-term financing pressure without proving durable unit economics.
    claimRefs: ["CI008", "CI009", "CI011", "CI013"]
