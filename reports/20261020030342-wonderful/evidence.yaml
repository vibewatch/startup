evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, observer rights, committee structure, reserved matters, executive bench, and succession
      plans.
    whyItMatters: >-
      Founder concentration cannot be distinguished from a mature governance structure using the assigned public
      evidence.
    diligencePath: >-
      Request the board and committee roster, organization chart, voting agreements, reserved-matters schedule, and
      succession materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A reconciled monthly ARR, recognized-revenue, and annualized-revenue bridge with definitions and period dates.
    whyItMatters: >-
      The public $55M, $70M, and $100M figures are not safely comparable and materially affect growth and valuation
      analysis.
    diligencePath: >-
      Obtain CFO-certified monthly ARR, GAAP or IFRS revenue, bookings, and customer-cohort schedules through September
      2026.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Primary evidence for contracted customers, live production customers, and customer concentration.
    whyItMatters: >-
      One secondary report of 80 customers cannot establish the denominator, production status, or revenue
      concentration.
    diligencePath: Request the customer master, signed contracts, go-live dates, ARR by account, and top-10 concentration schedule.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: Independent legal, regulatory, outage, breach, complaint, and leadership-change checks with authoritative records.
    whyItMatters: >-
      The assigned adverse query returned only the company homepage, so no recorded incident can be treated as evidence
      of absence.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, data-protection, sanctions, outage, and executive-history checks
      before investment approval.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Independent category spending, growth, geography, and methodology sufficient to define TAM, SAM, and SOM.
    whyItMatters: Without a bounded denominator, market share, penetration, and valuation upside cannot be modeled credibly.
    diligencePath: >-
      Obtain current independent analyst or industry data and reconcile its category boundary to Wonderful's products
      and target geographies.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Contract-level payer, budget owner, sales cycle, ACV, implementation fee, and expansion approval data by segment.
    whyItMatters: Stakeholder titles do not establish which budget funds initial deployment or how reliably accounts expand.
    diligencePath: Review a representative contract sample and interview economic buyers across at least three regulated sectors.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: deployment-economics
    missingEvidence: >-
      Software-versus-services revenue mix, deployment staffing per account, gross margin, and time to customer
      self-operation.
    whyItMatters: The forward-deployed model may enable adoption while constraining margin and scalable delivery.
    diligencePath: >-
      Request cohort-level implementation hours, services attach, gross-margin waterfalls, and post-handover support
      requirements.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Independent customer references covering renewal, expansion, realized ROI, and failed or delayed deployments.
    whyItMatters: >-
      Issuer-derived outcomes and a limited public review footprint cannot establish repeatability or downside
      frequency.
    diligencePath: Conduct reference calls with renewed, expanded, churned, and still-implementing customers under confidentiality.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: private-evidence-only
    severity: material
    topic: comparative-proof
    missingEvidence: >-
      Independent win-loss data, customer reference calls, competitive replacement evidence, and comparable
      production-quality benchmarks.
    whyItMatters: >-
      Without buyer-side comparisons, vendor positioning cannot establish preference, displacement, or durable product
      advantage.
    diligencePath: >-
      Request a blinded win-loss file, interview recent wins and losses, and run a controlled bake-off on identical
      workflows and service obligations.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Executed contracts, realized annual contract value, implementation fees, unit definitions, discounts, renewal
      uplifts, and competitor quotes on matched scope.
    whyItMatters: A marketplace listing and quote-only sales motion cannot support a normalized total-cost or payback comparison.
    diligencePath: >-
      Obtain redacted order forms and three matched-scope vendor proposals, then normalize software, services,
      infrastructure, and internal labor costs.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Cohort retention, multi-homing, expansion, migration effort, integration ownership, and post-handoff customer
      staffing requirements.
    whyItMatters: >-
      These data determine whether Wonderful compounds into a durable system of action or remains a replaceable
      services-heavy layer.
    diligencePath: >-
      Review renewal cohorts and churn memos, inspect contract portability clauses, and interview customers that
      completed the capability handoff.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Gross-margin waterfall, model and voice costs, deployment labor, support cost, CAC, sales cycle, and payback by
      customer cohort.
    whyItMatters: >-
      These inputs determine whether rapid revenue growth produces scalable software economics or remains
      services-intensive.
    diligencePath: >-
      Obtain the finance pack and cohort contribution-margin schedule, then reconcile them to audited revenue and
      payroll.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current cash, monthly burn, committed hiring spend, runway, debt, covenants, liquidation terms, and next-round
      trigger.
    whyItMatters: >-
      Funding raised is not cash available, so financing resilience and downside protection cannot be assessed from
      round size.
    diligencePath: >-
      Review the latest balance sheet, cash forecast, debt schedule, cap table, financing documents, and board-approved
      operating plan.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: >-
      Contracts, realized usage rates, minimum commitments, discounts, renewal data, services mix, concentration, and
      ARR reconciliation.
    whyItMatters: >-
      Annualized revenue does not reveal recurring quality, customer concentration, retention, or exposure to negotiated
      usage pricing.
    diligencePath: >-
      Sample customer contracts and reconcile billing, recognized revenue, deferred revenue, and retention by cohort and
      geography.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer surface, repository or package activity, practitioner forum history, and independent
      production-user reviews were not present in the assigned evidence.
    whyItMatters: >-
      Without practitioner evidence, integration friction, release cadence, API stability, and maintainability cannot be
      assessed outside vendor and reviewer descriptions.
    diligencePath: >-
      Request API and CLI documentation, release history, SDK usage metrics, support-ticket samples, and reference calls
      with customer engineering teams.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      The retained sources do not include certification reports and scope, penetration-test results, a threat model,
      model-provider data-flow evidence, or an incident and uptime history.
    whyItMatters: >-
      Control labels alone do not establish tenant isolation, effective redaction, safe tool execution, recoverability,
      or compliance for a specific customer workflow.
    diligencePath: >-
      Review SOC 2 and ISO scope, architecture and data-flow diagrams, recent penetration tests, subprocessors, status
      and incident records, and a live permission and rollback trace.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: product-performance
    missingEvidence: >-
      Independent workload benchmarks and customer-authored evidence for Agent Builder quality, routing performance,
      computer-use reliability, and deployment effort are unavailable.
    whyItMatters: >-
      Company-reported improvement percentages and broad production claims cannot establish repeatability, denominator
      quality, or economics across customer environments.
    diligencePath: >-
      Run a paid proof of concept on representative workflows with pre-agreed quality, latency, cost, intervention,
      rollback, and time-to-production measures.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort retention, and expansion by deployment
      vintage.
    whyItMatters: >-
      Production deployments do not establish durable recurring revenue or repeat use without renewal and cohort
      evidence.
    diligencePath: >-
      Request anonymized quarterly customer and ARR cohorts, renewal schedules, churn reasons, and three reference calls
      spanning renewed, expanded, and lost accounts.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer revenue shares; ARR by vertical and geography; and revenue attributable to
      partners or deployment services.
    whyItMatters: >-
      A small set of flagship accounts, markets, or service-heavy deployments could make reported scale less repeatable
      than the footprint suggests.
    diligencePath: >-
      Review customer-level ARR, bookings, pipeline, deployment staffing, and gross retention, segmented by vertical,
      geography, channel, and contract type.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer roster with deployment status, direct customer confirmation, production dates, outcome
      definitions, contract scope, and renewal status.
    whyItMatters: >-
      The available named examples are a small vendor-published sample and cannot establish broad referenceability or
      representative production performance.
    diligencePath: >-
      Reconcile the CRM customer roster to contracts and invoices, then obtain direct references and primary outcome
      exports for at least five representative deployments.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-record
    missingEvidence: >-
      Primary regulator, court, licensing, and enforcement records mapped to Wonderful's legal entities and operating
      jurisdictions.
    whyItMatters: >-
      Without primary records, the analysis cannot establish legal status, disputes, authorizations, or the absence of
      enforcement.
    diligencePath: >-
      Obtain the legal-entity and jurisdiction list, then run regulator, court, sanctions, IP, privacy, and
      sector-license checks with local counsel.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Current audit reports, certification scope, penetration-test summaries, data-flow diagrams, subprocessors,
      retention settings, and control exceptions.
