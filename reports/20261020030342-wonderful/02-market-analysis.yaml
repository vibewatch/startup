      - "Confidence"
      - "Limitation"
    rows:
      - ["Verdict", "September 2026 / global operations", "650 employees; more than 35 markets", "Company operating scale reported after Series C", "Medium", "Company scale, not market demand or spend"]
      - ["TechStartups", "September 2026 / company-wide", "Roughly $70M annualized revenue", "Third-party report citing company trajectory", "Medium", "Annualized revenue is not TAM, ARR, or independently audited revenue"]
      - ["Ventureburn", "March 2026 / customer cohort not disclosed", "More than 70% expand within three months", "Wonderful CEO statement about enterprises starting with one use case", "Low", "Issuer-derived; cohort size, eligibility, and revenue expansion are undisclosed"]
      - ["eesel AI", "October 2026 / AWS Marketplace listing", "$2.5M for a 12-month enterprise contract", "Competitor-authored review of a public contract anchor", "Low", "Private-offer anchor is not realized price, ACV, or representative willingness to pay"]
      - ["Retained evidence set", "As of 2026-10-20 / geography undefined", null, "No source provided a bounded TAM, SAM, SOM, CAGR, or reproducible category-spend model", "Unresolved", "Requires independent market data and Wonderful-specific conversion assumptions"]
    notes: >-
      Values have different units, periods, populations, and issuers. They are displayed as
      separate sizing lenses and must not be combined into a market estimate.
    claimRefs: [CM007, CM009, CM010, CM013, CM016]
  - id: "TM003"
    title: "Segment, buyer, user, and adoption map"
    columns:
      - "Segment"
      - "Buyer"
      - "User"
      - "Payer / budget owner"
      - "Workflow"
      - "Adoption trigger"
    rows:
      - ["Telecommunications", "C-suite, IT, and customer-service leadership", "Service and operations teams", "Not publicly identified", "Customer interactions and account operations", "High interaction volume and legacy automation limits"]
      - ["Banking", "C-suite, IT, risk, and functional leadership", "Customer and operations teams", "Not publicly identified", "Regulated customer and back-office workflows", "Governance, on-premise options, and production reliability"]
      - ["Healthcare", "Executive, IT, and operations leadership", "Patient-service and administrative teams", "Not publicly identified", "Patient-facing and administrative workflows", "Localization, compliance, and system integration"]
      - ["Insurance", "Executive, IT, and operations leadership", "Service, claims, and operations teams", "Not publicly identified", "Customer and end-to-end managed workflows", "Cross-system orchestration and governed execution"]
      - ["Retail and utilities", "Functional executives and IT", "Customer-service and operations teams", "Not publicly identified", "Customer-facing and internal workflows", "Multi-channel automation and measurable handling outcomes"]
      - ["Cross-enterprise expansion", "Initial executive sponsor plus adjacent functional leaders", "Employees and workflow owners", "Expansion budget owner not disclosed", "Productivity agents and AI-native applications", "Successful first production use case and reusable shared platform"]
    notes: >-
      Buyer signals come from Wonderful's reposted enterprise-sales role and product positioning;
      payer and budget-owner fields remain unknown rather than inferred from stakeholder titles.
    claimRefs: [CM002, CM004, CM005, CM008, CM010, CM012]
figures:
  - id: "FM001"
    title: "Market sizing evidence ladder"
    type: "pyramid"
    summary: >-
      Public evidence narrows from an unquantified category thesis to company-specific adoption
      and commercial signals, without establishing a numeric TAM, SAM, or SOM.
    data:
      items:
        - label: "Enterprise AI adoption"
          value: "Unquantified"
          detail: "Broad category demand is discussed, but no retained source defines total spending."
        - label: "Unified AI operating layer"
          value: "Unquantified"
          detail: "Wonderful targets agents, workflows, applications, governance, and integrations."
        - label: "Regulated industry focus"
          value: "6 named sectors"
          detail: "Banking, telecommunications, healthcare, retail, utilities, and insurance."
        - label: "Operating footprint"
          value: ">35 markets"
          detail: "Reported company presence as of September 2026, not a serviceable-market count."
        - label: "Within-account expansion"
          value: ">70% within 3 months"
          detail: "Wonderful company claim; customer cohort and revenue denominator were not disclosed."
        - label: "Public contract anchor"
          value: "$2.5M / 12 months"
          detail: "Competitor-reported AWS Marketplace listing; not a realized or representative price."
    approximationNotes: >-
      Layers are an evidence hierarchy, not proportional or additive market segments. Values have
      non-comparable units and do not constitute TAM, SAM, SOM, conversion rates, or market share.
    claimRefs: [CM001, CM002, CM007, CM009, CM010, CM013, CM016]
callouts:
  - calloutType: "risk"
    title: "Market size remains a diligence gap"
    body: >-
      Do not capitalize Wonderful's reported operating scale or funding into a market estimate.
      Obtain independent category-spend data and customer-level conversion, retention, pricing,
      and services-mix evidence before using a numeric market assumption in valuation.
    claimRefs: [CM007, CM013, CM016]
