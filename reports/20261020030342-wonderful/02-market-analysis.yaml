      - ["Regulated-industry deployment", "Integration, compliance, governance, and local deployment for six named sectors", "Unregulated SMB self-service tooling", "C-suite, risk, compliance, and IT stakeholders", "Primary served-customer profile"]
      - ["Status quo and internal build", "Legacy automation replacement, integration work, and human-operated processes", "Spend outside workflows Wonderful can deploy or govern", "Existing operations and technology budgets", "Substitute and budget competition"]
