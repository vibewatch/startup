      - number: '3.3'
        title: 定价、采购与切换
        blocks:
          - type: paragraph
            body: >-
              公开定价证据太薄，无法做标准化的总成本比较。竞争对手撰写的评测称 Wonderful 没有公开价目表，并引用一条 $2.5 million、12 个月的 AWS Marketplace
              挂牌，买方需申请私有报价。这个数字只是挂牌锚点，不是已验证的实际合同价格；现有证据也没有 Palantir AIP、Relevance AI 或 Cognigy 的可比价格。Wonderful
              的模块化、模型无关设计、客户拥有能力的表述和交付移交，可能降低技术锁定。反过来，全企业运营层所需的集成、治理、本地部署团队和变更管理，可能带来很高的流程切换成本。合同条款、实施费、折扣、续约行为、迁移工作量和多平台并用率仍未披露。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
