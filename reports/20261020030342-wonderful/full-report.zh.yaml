  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Wonderful 对可服务市场的定义比客服自动化更宽：公司声称其提供一层统一运营层，覆盖智能体、工作流、AI
              原生应用、治理、集成和编排。它明确聚焦银行、电信、医疗、零售、公用事业和保险，因此实际目标更接近拥有关键任务工作流的大型受监管企业。相关支出边界包括与生产工作流相连的企业 AI 应用和部署预算，但不包括
              Wonderful 自己尚未证明能够获取的一般云、基础模型和无关 SaaS 支出。现状竞争也比智能体厂商更广：部门级点工具、传统自动化、内部集成项目和人工运营流程，都在争夺同一笔数字化转型预算。
            claimRefs:
