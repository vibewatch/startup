  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 集成式 AI 运营层加上本地部署，有望打开复杂的企业工作流
        - 公司介绍了开放、模型无关的架构，以及前置部署团队
        - 独立证据证明实施速度可重复、且服务投入强度正在下降
      - - 投资逻辑
        - 先落地再扩张的模式可能放大平台价值
        - 投资者材料将三个月工作流扩张 70%+ 归因于 CEO
        - 按队列拆分的合同扩张、续约和流失数据
      - - 反向逻辑
        - 以部署为主的交付模式可能限制毛利率扩张
        - 本地团队和嵌入式工程师是经营模式的核心
        - 一份利润率桥接分析，展示部署成熟后软件杠杆如何释放
      - - 反向逻辑
        - 证据广度落后于估值
        - 竞争对手评测称 G2 上有 0 条评论，独立公开用户评论也很少
        - 客户访谈、续约证据，以及独立测量的生产环境结果
    notes: 大多数经营证据由 Wonderful 或投资者发布；竞争对手评论属于反向证据，而非独立的业绩基准。
