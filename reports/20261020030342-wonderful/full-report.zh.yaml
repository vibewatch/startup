            body: >-
              据报道，Wonderful 于 2026 年 9 月以 $5 billion 估值完成 $550 million C 轮，距 $2 billion 的 B
              轮估值约六个月。本轮显著扩大了融资能力，报道将资金用途与产品开发、全球部署团队以及员工数从约 650 人增至约 1,000 人联系起来。更早的 B 轮材料已计划把员工数从 350 人增至年末约 900
