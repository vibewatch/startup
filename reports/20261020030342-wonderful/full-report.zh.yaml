  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 证据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - $5B 2026 年 9 月融资估值；据报道年化收入约为 $70M
        - 在完成财务和股权结构表尽调前，不要评估新的入场机会
      - - 信心
        - 中
        - 融资已获交叉印证；经济性和条款尚未被公开确立
        - 将该判断视为有条件结论，而不是目标价
      - - 风险评级
        - 高
        - 隐含估值 / 年化收入倍数约为 71x，且缺少非公开的留存率和利润率数据
        - 要求下行保护，并以里程碑为基础建立投资信心
      - - 估值立场
        - 偏高
        - 公开口径估值从 2026 年 3 月到 9 月提高了 2.5x
        - 只有在增长质量得到验证或入场条款明显改善后才重新评估
    notes: 融资数字是据报道的交易估值；约 71x 的倍数是分析师使用第三方据报道的年化收入计算得出，并非 ARR。
