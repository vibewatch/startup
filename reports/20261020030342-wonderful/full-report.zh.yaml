      - number: '4.2'
        title: GTM 路径与交付经济性
        blocks:
          - type: paragraph
            body: >-
              商业路径以企业客户为主，而且高度依赖部署。Wonderful 声称本地嵌入式团队会把智能体接入复杂系统，上线后继续优化，再帮助客户把共享平台扩展到更多工作流。公司还声称，从一个用例开始的企业中，超过 70%
              会在三个月内增加工作流；这是一个可能很有吸引力的扩张信号，但分母、队列规模、合同扩展和留存都未披露。独立评论直接指出了财务取舍：实施能力必须随软件收入扩大，可能挤压利润率、招聘质量和交付一致性。没有部署人力、支持成本、销售周期、CAC
              和回本周期数据，就无法评估软件杠杆或销售效率。
