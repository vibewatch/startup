  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖
      - 交易对手方
      - 角色
      - 集中度证据
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余暴露
    rows:
      - - 基础模型和云基础设施
        - 未披露的模型和基础设施供应商
        - 推理、托管、延迟、安全和可用性
        - 供应商份额和合同最低量未披露
        - 价格、策略、模型质量、地区可用性或宕机冲击
        - 高
        - 已描述模型无关的架构和路由
        - 实质性，因为多元化和可迁移性未经验证
      - - 前置部署和本地实施团队
        - Wonderful 员工队伍和本地交付组织
        - 集成、本地化、控制和变更管理
        - 利用率和对分包商的依赖未披露
        - 招聘或交付瓶颈拖慢实施并削弱质量
        - 高
        - 据报道的招聘计划及各市场的本地团队
        - 在提供产能和利润率数据前为高
      - - 大型企业采购和客户背书
        - 未披露的企业客户
        - 合同价值、续约、可信度和扩张
        - 头部客户和行业集中度未披露
        - 一个大型客户不续约或延迟上线，就可能扰乱增长并削弱客户背书
        - 高
        - 已点名部署和嵌入式交付可能提高切换成本
        - 高，因为无法获得留存和集中度明细
      - - 资本与估值预期
        - 投资者与未来融资市场
        - 为扩张提供资金，并抬高增长预期
        - 据报道的收入指标使用了不同标签和期间；可用现金未披露
        - 增长、利润率或续约证据不足以支撑经营计划或估值
        - 高
        - 大额据报道融资提供资金，但不能证明现金跑道或单位经济性
        - 在烧钱速度、现金跑道、优先权和部署经济性披露前，该风险仍属重大
    notes: 公开来源能识别依赖类别，但未披露对手方份额、合同保护、客户集中度、可用现金或单位经济性；融资额不等同于现金跑道。
