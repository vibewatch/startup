      - number: '3.2'
        title: 能力与交付定位
        blocks:
          - type: paragraph
            body: >-
              Wonderful
              最强的差异化来自产品广度与实施模式的组合，而不是某个已披露的自研基础模型。公司称平台与模型无关，能接入现有技术栈，并可运行在任何云环境，包括本地部署。前置部署工程师先把初始用例推入生产，再把能力交给客户。这能降低试点停滞的组织风险，也吸引受监管买方，但同时让
              Wonderful 更像一家软件赋能的转型伙伴。现有材料中，Palantir 是最接近的成熟厂商类比；Relevance AI 强调全组织 AI 团队成员；Cognigy
              仍聚焦大型联络中心；自助式支持工具则在速度、透明度和试用便利性上竞争。因此，序位图描述的是产品广度和部署强度，不是经过测量的产品质量或市场领导地位。
