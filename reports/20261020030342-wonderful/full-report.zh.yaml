              可投资的逻辑是：Wonderful 把开放、与模型无关的运营层与本地前置部署团队结合起来，可能跨过让企业 AI
              项目停滞的集成和变更管理障碍。公司与投资人材料描述了快速地域扩张、首个用例后的工作流扩张，以及显著的运营结果。反向逻辑同样重要：这些运营指标仍来自发行方或投资人，部署的劳动密集度可能限制软件式利润率，而竞争对手评测称公开客户评价证据稀少。产品广度和融资能力是可信优势，但不能独立证明持久留存或有吸引力的单位经济性。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景与可比信号
        blocks:
          - type: paragraph
            body: >-
              现有可比证据只能提供方向，尚不足以建立常规估值区间。AI Funding 发现，Wonderful 3 月 B 轮在其指定跟踪窗口内约为美元计价 B 轮中位数的 2.5x；9 月融资又把公司估值重置到 $5
              billion。现有证据没有确立上市公司收入倍数、私募二级价格或相关并购交易，因此套用通用软件倍数会制造虚假的精确度。乐观情景需要扩张得到验证且部署经济性改善；基准情景需要在指标成熟期间守住价格；悲观情景是报道收入无法转化为有留存、具备高毛利的业务，导致倍数压缩。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效
        blocks:
          - type: paragraph
            body: >-
              融资记录证明了强大的私募市场融资能力，而不是退出准备度。没有入场持股、稀释、优先条款、审计收入、毛利率、烧钱和留存队列，就无法计算有依据的目标回报、持有期或退出价值。尽调应将年化收入与合同收入和已收收入对账，按队列测试扩张和流失，将平台毛利率与前置部署人力分开，识别头部客户集中度，并为资本结构表中的每项证券建模。如果审计收入明显低于报道的运行率、队列扩张无法抵消流失、部署强度阻碍利润率扩张，或优先条款将普通股等价回报压低到要求回报以下，投资逻辑就应失效。
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 如果 Wonderful 的扩张和结果主张能转化为经独立验证的留存和软件式利润率，它可能配得上溢价；但在没有私有财务和优先条款数据的情况下，现有公开证据不足以支持按当前 $5 billion 估值进行投资判断。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
