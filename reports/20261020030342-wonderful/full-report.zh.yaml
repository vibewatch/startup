            body: >-
              公开材料一致将联合创始人 Bar Winkler 和 Roey Lalazar 分别列为 CEO 和
              CTO。他们的职责对应两项最关键的执行要求：企业级市场拓展和技术平台交付。现有证据没有披露更完整的高管团队、董事会构成、独立董事或委员会架构。这一缺失不代表这些控制不存在，但治理和继任能力仍无法观察。在公司提供最新组织架构图、董事会名单、保留事项清单和继任计划前，尽调仍应把公司视为创始人依赖型。
