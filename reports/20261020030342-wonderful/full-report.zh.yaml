        - 获取 AI 系统分类、DPIA、数据地图、子处理方、传输机制、审计报告和例外日志
      - - 自动化客户互动和录音的行业规则
        - 银行、电信、医疗、公用事业和保险市场
        - 公司点名受监管行业；没有可用的司法辖区授权或责任矩阵
        - 中（定性）
        - 高
        - 平台层面公开列出了权限、评测、告警和护栏
        - 在明确范围前为高
        - 将每个用例映射到行业规则、同意和录音义务、人工复核阈值、投诉权利及负责的法律实体
      - - 合同、IP、模型输出和第三方处理责任
        - 多个运营市场
        - 客户条款、模型供应商条款、赔偿责任和输出权利分配均不可得
        - 中（定性）
        - 高
        - 模型无关的路由可能分散供应商依赖，但合同责任分配未知
        - 实质性
        - 审阅 MSA、DPA、模型供应商合同、保险、IP 赔偿、留存条款和事故通知义务
    notes: 这是基于截至 2026-10-20 指定 8 个来源的定性分析师评估；不代表存在概率估计或完整司法辖区清单，已报道的控制仍需一手验证。
    enumerationScope:
      coverage: sample
      basis: >-
        Three material legal and regulatory themes supported by the assigned source set, not an exhaustive inventory of
        every operating jurisdiction, license, regulator, or dispute.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR012
      - CR015
  - id: TR002
    title: 运营 / 质量 / 安全风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余暴露
      - 监测指标
      - 未解决缺口
    rows:
      - - 本地部署能力增长慢于签约实施量
        - 中高
        - 高
        - 本地团队和嵌入式部署是其模式核心；团队扩张幅度较大
        - 高
        - 积压、上线生产所需时间、FDE 利用率、实施毛利率和升级事项积压时长
        - 没有产能计划、利用率数据或服务 / 软件成本拆分
      - - 模型或语言性能在生产环境回退
        - 中
        - 高
        - 公开描述了评测、护栏、监控和模型无关的选择机制
        - 实质性
        - 按语言拆分的任务成功率、重复联系、人工交接、回滚频率和关键错误率
        - 没有独立验证的按语言基准或事故历史
      - - 控制失效导致客户或企业敏感数据暴露
        - 未量化
        - 严重
        - 竞争对手评论称其具备认证、脱敏、加密和审计日志
        - 在验证前为高
        - 控制例外、特权访问、子处理方变更、数据留存偏差和通知时长
        - 没有一手审计报告、渗透测试摘要或部署数据流证据
      - - 独立反馈稀少，掩盖可靠性或支持问题
        - 中
        - 中高
        - 有已点名案例研究，但据报道独立评论深度有限
        - 实质性
        - 推荐电话转化率、经核实的评论数量、续约队列、投诉率和一级严重事故
        - 没有广泛的独立客户样本或队列级可靠性披露
    notes: 可能性和严重性是定性尽调判断，不是实测事故频率；控制成熟度基于公开描述，需要客户和审计师层面的确认。
