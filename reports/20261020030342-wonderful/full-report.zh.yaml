        - label: 上下文与执行
          modules:
            - 企业知识与数据
            - API 与 CLI
            - 工具与集成
            - 面向旧系统的计算机使用
        - label: 模型层
          modules:
            - 多模型路由
            - 外部基础模型
        - label: 部署与交付
          modules:
            - 云端和客户控制的部署选项
            - 前置部署工程团队
    approximationNotes: 概念性来源综合，不代表已验证的运行时拓扑或保障边界。
    claimRefs:
      - CE001
      - CE004
      - CE009
      - CE011
  - id: FU001
    title: 企业客户采用与扩张旅程
    type: journey-map
    summary: 据报道的市场进入路径是一条由服务辅助的流程，从高管支持走向生产环境和更多工作流；初次部署后，公开证据逐渐减弱。
    data:
      items:
        - label: 高管指令
          detail: 高级管理者优先推进受监管或任务关键型工作流。
          touchpoints:
            - 战略转型合作
            - 企业需求定义
        - label: 工作流选择
          detail: 客户与 Wonderful 共同选择高价值流程和部署边界。
          touchpoints:
            - 用例范围界定
            - 系统与政策映射
        - label: 嵌入式实施
          detail: 本地部署团队集成系统，并将工作流控制规则编码落地。
          touchpoints:
            - 前置部署工程
            - 变更管理
        - label: 试点验证
          detail: 客户测试结果、边界情况、授权和交接。
          touchpoints:
            - 评估与防护栏
            - 人工升级审查
        - label: 生产运营
          detail: 智能体在面向客户或内部渠道中执行受治理的工作流。
          touchpoints:
            - 生产监控
            - 结果衡量
        - label: 工作流扩张
          detail: 团队交付首个用例，并推进更多工作流。
          touchpoints:
            - 本地交接
            - 下一个用例的优先级排序
    approximationNotes: 该顺序综合了 Wonderful 所述的部署模式和评审者描述；它不是经过测量的漏斗，也未推断转化、留存或扩张率。
    claimRefs:
      - CU003
      - CU008
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图：定性剩余敞口
    type: matrix
    summary: 公开证据显示，风险主要集中在高影响的执行、合规和依赖敞口；由于缺少事故和队列数据，可能性标签仅为定性判断。
    data:
      columns:
        - label: 较高可能性
          detail: 证据显示存在实际敞口，但不代表经过测量的概率。
        - label: 中等可能性
          detail: 证据支持存在合理的敞口，但仍有实质不确定性。
        - label: 未量化的可能性
          detail: 影响可能很大，但现有来源不足以支持概率判断。
      rows:
        - label: 全球交付扩张 — 严重影响
          note: 可能损害跨市场及受监管工作流的实施质量。
          values:
            - label: 全球交付扩张
              detail: 人员和市场快速扩张，增加了实施及质量控制要求。
            - null
            - null
        - label: 受监管工作流问责 — 严重影响
          note: 可能阻碍受监管部署，或造成重大的法律和客户风险。
          values:
            - null
            - label: 受监管工作流问责
              detail: 资料描述了平台控制措施，但缺少针对具体部署的一手证据。
            - null
        - label: 敏感数据控制失效 — 严重影响
          note: 可能造成运营中断、法律风险和企业信任流失。
          values:
            - null
            - null
            - label: 敏感数据控制失效
              detail: 未推断事故频率；审计和数据流证据仍是尽调事项。
        - label: 服务投入强度 — 高影响
          note: 可能限制经营杠杆，使增长依赖稀缺的实施人才。
          values:
            - label: 服务投入强度
              detail: 嵌入式部署可能限制类似软件业务的利润率扩张。
            - null
            - null
        - label: 模型和云依赖 — 高影响
          note: 可能损害可靠性、成本、区域可用性或产品质量。
          values:
            - null
            - label: 模型和云依赖
              detail: 多模型设计能缓解但无法消除对外部供应商的敞口。
            - null
        - label: 证据和经济性不透明 — 中等影响
          note: 可能削弱价格实现、尽调信心以及对持久性的判断。
          values:
            - null
            - label: 独立评测稀少且定价不透明
              detail: 评测深度、公开定价、续约队列和客户集中度仍有限或不可得。
            - null
    approximationNotes: 仅作定性定位；现有证据不足以支持数值概率、事故率、损失估计或完整风险总体。
    claimRefs:
      - CR003
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资势头和部署广度在进入建议“继续研究”之前，先经过证据质量和入场价格风险的筛选。
    data:
      nodes:
        - id: financing
          label: 融资证明
          detail: $550M C 轮，估值 $5B
        - id: scale
          label: 规模信号
          detail: 35+ 个市场和 650 名员工，据公司声称
        - id: economics
          label: 经济性测试
          detail: 约 $70M 年化收入，据第三方报道
        - id: multiple
          label: 价格测试
          detail: 隐含估值 / 年化收入倍数约为 71x
        - id: gaps
          label: 缺失证明
          detail: 留存率、利润率、集中度、所有权和优先权
        - id: decision
          label: 继续研究
          detail: 在私有证据补齐回报模型前，不设定目标价
    approximationNotes: 约 71x 的倍数由据报道的 $5B 估值和约 $70M 年化收入计算得出；顺序表示逻辑，不表示规模。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV007
      - CV015
      - CV016
