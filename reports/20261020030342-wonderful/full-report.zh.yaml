  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 工作流扩张经验证据持久、留存率强劲，且部署利润率改善
        - 溢价可能延续，但公开证据不足以支持任何数值估值区间
        - 执行质量未能转化为类似软件的经济性
        - 经审计的增长质量和队列扩张数据将提高该情景概率
      - - 基准
        - 增长延续，但留存率、利润率和集中度仍未得到验证
        - 当前 $5B 估值对信息高度敏感，无法据此计算目标回报
        - 稀释或优先权负担吞噬经营上行空间
        - 在取得股权结构表、收入桥接和客户队列数据前保持中性
      - - 悲观
        - 据报道的年化收入没有隐含的那么持久，或服务投入更重
        - 隐含倍数约 71x 的压缩带来下行
        - 流失、集中度或实施成本削弱现金创造能力
        - 未达到经审计的运行率或续约疲弱，将提高该情景概率
    notes: 由于现有证据缺少经审计的预测、利润率和条款，情景分析刻意不编造概率或绝对估值区间。
    claimRefs:
