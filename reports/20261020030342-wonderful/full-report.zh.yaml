    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Wonderful 将自己定位为面向大型企业的应用型 AI
              平台，以统一运营层覆盖数据、权限、编排、评测、防护、工作区和知识。它并非纯自助软件模式：公司和投资人材料强调本地嵌入式部署团队及战略支持，尤其面向受监管行业。独立资料将公司所在地列为阿姆斯特丹，并把成立时间追溯到
              2025 年。因此，它更像“软件加实施”，而不是传统的低接触 SaaS 厂商；尽调应把平台的可复制性与服务驱动的部署能力分开评估。
