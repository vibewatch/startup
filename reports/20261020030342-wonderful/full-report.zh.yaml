              - CP007
              - CP010
              - CP015
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Wonderful
              潜在的护城河来自不断累积的企业上下文、集成、治理和部署经验：每增加一个工作流，运营层就可能更有用，也更难替换。同一批证据也暴露了持久性问题。由于平台明确开放且与模型无关，差异化必须靠编排、生产可靠性、受监管部署和执行速度持续，而不是靠独占模型访问。前置部署团队能加快采用，但
              650
              人的组织和嵌入式交付模式可能带来较高服务强度，公开的年化收入数据无法解释这一点。成熟厂商可以把编排打包进更大的套件，专业厂商可以赢下更窄的工作负载，客户也可以保留部分内部能力。这里审阅的公开记录仍以公司表述、二手融资报道和竞争对手评测为主；没有独立基准化的胜负、留存和切换数据。
            claimRefs:
