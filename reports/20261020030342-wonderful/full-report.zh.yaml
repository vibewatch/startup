      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开销售材料指向一个多方参与的采购群体，包括 C-suite 高管、IT 负责人和客服高管。用户不止支持团队，因为 Wonderful 还面向员工生产力、托管工作流和 AI
              原生应用；但证据无法确认一个可重复的付款方或预算负责人。采用似乎从一个工作流开始，由本地或前置部署团队完成系统集成，再把运营能力交给客户。Wonderful
              报道的扩张和运营结果指标暗示潜在的“落地后扩张”路径，但两者都来自发行方。尽调要追踪的关键经济链条是：发起人批准、集成与合规工作、生产验证、扩展到相邻工作流，最终由客户接管运营。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
