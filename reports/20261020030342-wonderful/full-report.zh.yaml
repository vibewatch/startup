      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有来源没有提供独立编制、且披露地域、支出定义、基准年份或方法论的市场估算，因此无法转化为 TAM、SAM 和 SOM。现有数字测量的反而是 Wonderful 自身：超过 35 个运营市场、650
              名员工、据报道 $70 million 的年化收入、公司声称超过 70% 的首个用例客户会在三个月内扩展，以及一份竞争对手报告的 AWS Marketplace
              合同锚点。这些观察支持企业需求和“落地后扩张”行为存在的方向性判断，但分母不同，不能相加、相除或外推为市场规模。在取得独立的品类支出和 Wonderful
              特定转化数据前，任何估值模型都应明确保留市场规模这一项未解决。
