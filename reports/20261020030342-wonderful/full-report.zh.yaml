              自身的利润率或现金转化。投资判断需要按客户队列对合同经常性软件收入、用量、服务、模型与电话成本、部署人力、支持、留存和烧钱进行对账。在这些数据提供前，尽管刚完成大额融资，收入质量、利润率路径和现金跑道仍是重大尽调阻塞项。
