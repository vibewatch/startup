              - CM010
              - CM012
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的采用驱动来自几项需求：把 AI 从试点推入生产、支持传统系统、跨语言和司法辖区运行，以及在多个工作流中复用受治理的平台。Wonderful
              广泛的产品范围和新增的大额资本可能提升交付能力。同一设计也带来约束：嵌入式部署很耗人力，企业销售需要许多高层参与，公开价格不透明，竞争对手撰写的评测也几乎找不到广泛的用户评价证据。这些因素可能拉长采购周期，使增长受制于稀缺的实施人才，并模糊经常性软件与服务的边界。因此，市场逻辑作为采用方向是可信的，但仍未量化；估值应依赖经验证的留存、扩张、毛利率、服务占比和销售周期数据，而不应只看品类热度。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场规模仍是尽调缺口
            body: 不要把 Wonderful 报道的运营规模或融资额资本化为市场估算。在估值中采用任何数字市场假设前，应先取得独立的品类支出数据，以及客户层面的转化、留存、定价和服务构成证据。
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与品类边界
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合远不止对话式 AI。Wonderful 在 C 轮融资中的定位，把产品从客服智能体扩展为覆盖工作流、员工智能体、AI 原生应用、企业上下文、集成和治理的共享层。这让它更接近 Palantir AIP
              的“平台加前置部署”模式；Relevance AI 则是规模更小的横向智能体同类，Cognigy 更专注于联络中心。买方也可以选择 CRM
              或云套件、自助式支持工具、内部自建，或继续使用传统软件和人工运营。这些替代方案的范围并不完全相同，但都在争夺同一笔自动化预算，并可能推迟或缩小 Wonderful
              的全企业部署。公开规模比较并不均衡：Wonderful 报称有 650 名员工、覆盖 35 多个市场，而现有证据对多数同类只给出零散的融资或股权信息。
            claimRefs:
              - CP001
