  topStrengths:
    - Broad model-agnostic product surface spanning agent development, governance, integrations, and workflow execution
    - Rapid financing and geographic expansion with substantial institutional backing
    - Named enterprise deployments and reported production activity across regulated industries
    - Local deployment model may reduce enterprise integration and change-management friction
  topRisks:
    - The $5B valuation implies roughly 71x the reported $70M annualized-revenue figure
    - Forward-deployed implementation intensity may constrain gross margin and operating leverage
    - Retention, renewal, customer concentration, and recurring-versus-services revenue quality remain undisclosed
    - Security, regulatory, incident, and control-effectiveness evidence requires primary verification
    - Independent practitioner and customer-review evidence remains sparse
  unresolvedGaps:
    - Audited revenue, contracted ARR reconciliation, gross-margin bridge, cash burn, and runway
    - NRR, GRR, churn, renewal, expansion, and customer-concentration cohorts
    - Fully diluted capitalization, liquidation preferences, anti-dilution terms, and secondary transaction terms
    - Primary audit reports, certification scope, penetration tests, data flows, and incident history
    - Current board structure, executive bench, reserved matters, and succession planning
disclaimer: >-
