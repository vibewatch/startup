summary:
  headline: >-
    Wonderful has credible product breadth, financing strength, and enterprise deployment momentum, but a roughly 71x
    valuation-to-annualized-revenue signal and missing retention, margin, concentration, control, and financing-term
    data make further research necessary before underwriting an entry.
