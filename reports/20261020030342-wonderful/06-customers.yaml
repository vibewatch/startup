        renewal and cohort evidence.
      diligencePath: >-
        Request anonymized quarterly customer and ARR cohorts, renewal schedules, churn reasons, and
        three reference calls spanning renewed, expanded, and lost accounts.
      relatedQuestionRefs: [QU004]
