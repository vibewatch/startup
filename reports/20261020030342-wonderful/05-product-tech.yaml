callouts:
  - calloutType: "risk"
    title: "Broad product surface, narrow public verification"
    body: >-
      Wonderful's public architecture is internally coherent, but the retained evidence is
      dominated by company descriptions and secondary summaries. Investment diligence should
      require production telemetry, control-assurance scope, incident history, and customer-led
      reference tests before treating the platform's breadth as verified maturity.
    claimRefs: ["CE010", "CE012", "CE014"]
