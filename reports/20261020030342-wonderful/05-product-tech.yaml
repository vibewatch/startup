      - ["Governance and assurance", "Applies permissions, guardrails, redaction, evaluations, and audit logging", "Control coverage across every deployment and downstream provider", "Public claims do not establish certification scope or control effectiveness"]
    notes: "Risk-oriented architecture view; roles are publicly described, while dependencies and risks are analyst inferences requiring technical diligence."
