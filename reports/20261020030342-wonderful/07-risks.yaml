  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "regulatory-record"
      missingEvidence: "Primary regulator, court, licensing, and enforcement records mapped to Wonderful's legal entities and operating jurisdictions."
      whyItMatters: "Without primary records, the analysis cannot establish legal status, disputes, authorizations, or the absence of enforcement."
      diligencePath: "Obtain the legal-entity and jurisdiction list, then run regulator, court, sanctions, IP, privacy, and sector-license checks with local counsel."
      relatedQuestionRefs:
        - "QR002"
      relatedTableRefs:
        - "TR001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "security-controls"
      missingEvidence: "Current audit reports, certification scope, penetration-test summaries, data-flow diagrams, subprocessors, retention settings, and control exceptions."
      whyItMatters: "Public control descriptions cannot establish that controls operate effectively in each deployment or cover every model and hosting configuration."
      diligencePath: "Review the trust package under NDA and sample evidence for access, redaction, retention, model routing, incident response, and customer-managed deployments."
      relatedQuestionRefs:
        - "QR006"
      relatedTableRefs:
        - "TR001"
        - "TR002"
    - type: "missing-source"
      severity: "material"
      topic: "incident-history"
      missingEvidence: "Production uptime, severity-one incidents, security events, model regressions, rollback rates, customer complaints, and regulator notifications."
      whyItMatters: "Absence of a recorded incident in the assigned sources is not proof of operational reliability or safety."
      diligencePath: "Request a 24-month incident and postmortem log, status-page history, cyber claims history, and customer reference calls focused on failures."
      relatedQuestionRefs:
        - "QR003"
        - "QR009"
      relatedTableRefs:
        - "TR002"
    - type: "conflicting-data"
      severity: "material"
      topic: "revenue-quality"
      missingEvidence: "A reconciled schedule defining ARR, annualized revenue, recognized revenue, implementation revenue, usage revenue, period, currency, and customer concentration."
      whyItMatters: "The public $55 million ARR and roughly $70 million annualized-revenue reports use different labels and periods and cannot establish growth quality or margins."
      diligencePath: "Reconcile monthly recurring and nonrecurring revenue to audited or board reporting, including cohorts, churn, expansion, gross margin, and top-customer shares."
      relatedQuestionRefs:
        - "QR005"
        - "QR007"
      relatedTableRefs:
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: "Cash balance, burn, runway, financing preferences, implementation labor, cloud and model costs, gross-margin waterfall, pricing units, renewal, and concentration data."
      whyItMatters: "Funding raised is not cash available, and reported annualized revenue does not establish durable software economics."
      diligencePath: "Review cash statements, financing documents, customer-level contribution margins, implementation utilization, infrastructure costs, renewal cohorts, and pricing schedules."
