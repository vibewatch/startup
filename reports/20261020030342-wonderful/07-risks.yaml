figures:
  - id: "FR001"
    title: "Risk heatmap: qualitative residual exposure"
    type: "matrix"
    summary: >-
      The public-evidence risk profile clusters around high-impact execution, compliance, and
      dependency exposures; likelihood labels are qualitative because incident and cohort data are unavailable.
    data:
      columns:
        - label: "Higher likelihood"
          detail: "Evidence indicates an active exposure, not a measured probability."
        - label: "Medium likelihood"
          detail: "Evidence supports a plausible exposure with meaningful uncertainty."
        - label: "Unquantified likelihood"
          detail: "Impact could be material, but the assigned sources do not support a probability."
      rows:
        - label: "Global delivery scaling — severe impact"
          note: "Could impair implementation quality across markets and regulated workflows."
          values:
            - label: "Global delivery scaling"
              detail: "Rapid workforce and market expansion increase implementation and quality-control demands."
            - null
            - null
        - label: "Regulated-workflow accountability — severe impact"
          note: "Could block regulated deployments or create material legal and customer exposure."
          values:
            - null
            - label: "Regulated-workflow accountability"
              detail: "Platform controls are described, but deployment-specific primary evidence is missing."
            - null
        - label: "Sensitive-data control failure — severe impact"
          note: "Could cause operational interruption, legal exposure, and loss of enterprise trust."
          values:
            - null
            - null
            - label: "Sensitive-data control failure"
              detail: "No incident frequency is inferred; audit and data-flow evidence remain diligence items."
        - label: "Services intensity — high impact"
          note: "Could constrain operating leverage and make growth dependent on scarce implementation talent."
          values:
            - label: "Services intensity"
              detail: "Embedded deployment may constrain software-like margin expansion."
            - null
            - null
        - label: "Model and cloud dependency — high impact"
          note: "Could impair reliability, cost, regional availability, or product quality."
          values:
            - null
            - label: "Model and cloud dependence"
              detail: "Multi-model design mitigates but does not remove external provider exposure."
            - null
        - label: "Evidence and economics opacity — moderate impact"
          note: "Could weaken price realization, diligence confidence, and visibility into durability."
          values:
            - null
            - label: "Sparse independent reviews and opaque pricing"
              detail: "Review depth, public pricing, renewal cohorts, and customer concentration remain limited or unavailable."
            - null
    approximationNotes: >-
      Qualitative placement only; the assigned evidence does not support numeric probabilities,
      incident rates, loss estimates, or a complete risk population.
    claimRefs:
      - "CR003"
      - "CR014"
      - "CR016"
callouts:
  - calloutType: "risk"
    title: "Do not infer safety from silence"
    body: >-
      The assigned pool did not provide primary regulator, court, or incident records. That is an
      evidence limitation, not proof that no enforcement, litigation, outage, breach, or control failure exists.
    claimRefs:
      - "CR002"
      - "CR012"
      - "CR016"
  - calloutType: "recommendation"
    title: "Conditional diligence gate"
    body: >-
      Require primary audit evidence, deployment-level quality and incident data, renewal and
      concentration cohorts, and a services-versus-software margin bridge before treating reported
      financing or annualized revenue as validation of durable operating leverage.
    claimRefs:
      - "CR004"
      - "CR007"
      - "CR008"
      - "CR014"
      - "CR016"
