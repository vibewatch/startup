        - "Funds expansion and sets growth expectations"
        - "Reported revenue metrics use different labels and periods; cash availability is undisclosed"
        - "Growth, margin, or renewal evidence fails to support the operating plan or valuation"
        - "High"
        - "Large reported financing provides funding, but does not prove runway or unit economics"
        - "Material until burn, runway, preferences, and deployment economics are disclosed"
    notes: >-
      Public sources identify dependency categories but do not disclose counterparty shares, contractual
