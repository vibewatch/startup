        - "Provider shares and contractual minimums are undisclosed"
        - "Price, policy, model-quality, regional availability, or outage shock"
        - "High"
        - "Model-agnostic architecture and routing are described"
        - "Material because diversification and portability are unverified"
      - - "Forward-deployed and local implementation teams"
