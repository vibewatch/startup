        - "Integration, localization, controls, and change management"
        - "Utilization and subcontractor dependence are undisclosed"
        - "Hiring or delivery bottleneck slows implementations and weakens quality"
        - "High"
        - "Reported hiring plans and local teams in each market"
        - "High until capacity and margin data are supplied"
      - - "Large-enterprise procurement and customer references"
        - "Undisclosed enterprise customers"
        - "Contract value, renewal, credibility, and expansion"
        - "Top-customer and vertical concentration are undisclosed"
        - "One large non-renewal or delayed rollout disrupts growth and references"
        - "High"
