chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Wonderful presents itself as an applied-AI platform for large enterprises, with a unified operating layer
              spanning data, permissions, orchestration, evaluations, guardrails, workspaces, and knowledge. The
              operating model is not pure self-serve software: company and investor materials emphasize locally embedded
              deployment teams and strategic support, especially in regulated industries. Independent profiles place the
              company in Amsterdam and date its founding to 2025. This combination makes the business closer to software
              plus implementation than a conventional low-touch SaaS vendor; diligence should therefore separate
              platform repeatability from services-led deployment capacity.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently identify co-founders Bar Winkler and Roey Lalazar as chief executive and
              chief technology officer, respectively. Their roles align with the two most important execution demands:
              enterprise go-to-market and technical platform delivery. The assigned evidence does not identify a broader
              executive bench, board composition, independent directors, or committee structure. That omission is not
              proof those controls are absent, but it leaves governance and succession capacity unobservable. The
              resulting diligence posture is founder-dependent until the company supplies a current organization chart,
              board roster, reserved-matters schedule, and succession plan.
            claimRefs:
              - CO003
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO016
      - number: '1.3'
        title: Financing, scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              The clearest current financing marker is the September 2026 Series C: three secondary sources report $550
              million raised at a $5 billion valuation. Primary-capital totals differ by scope. One tear sheet sums the
              Seed through Series C rounds to $834 million, while Multiples adds a $4 million angel round and a $15
              million Series B extension to report $853 million across six rounds. Neither amount is cash available
              today. Operational scale also moved quickly, from 350 employees in March to roughly 630-650 by August or
              September, but year-end hiring targets remain forecasts rather than achieved headcount.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: Milestones and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Wonderful moved from founding to a reported $5 billion valuation in less than two years, while its
              disclosed footprint expanded beyond 30 markets. The speed is notable, but the public operating metrics do
              not form a clean time series: one secondary source reports $55 million ARR in August, another reports $70
              million annualized revenue around September, and a third records $100 million as revenue or ARR at the
              September round. These are not interchangeable measures. Customer count is likewise supported only by one
              secondary tear sheet. The timeline therefore distinguishes dated financing events from unresolved
              operating-metric reconciliation.
