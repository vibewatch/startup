              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: Pricing, procurement, and switching
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is too thin for a normalized total-cost comparison. A competitor-authored review
              reports that Wonderful has no public rate card and cites a $2.5 million, 12-month AWS Marketplace listing
              that directs buyers to request a private offer. That figure is a listing anchor, not a verified realized
              contract price, and the assigned evidence provides no comparable prices for Palantir AIP, Relevance AI, or
              Cognigy. Wonderful's modular, model-agnostic design, customer ownership language, and capability handoff
              could reduce technical lock-in. Conversely, the integration, governance, local deployment teams, and
              change-management work required for an enterprise-wide operating layer may create substantial process
              switching costs. Contract terms, implementation fees, discounts, renewal behavior, migration effort, and
              multi-homing rates remain undisclosed.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Wonderful's potential moat is cumulative enterprise context, integrations, governance, and deployment
              know-how: each additional workflow can make the operating layer more useful and harder to replace. The
              same evidence also exposes the durability question. Because the platform is explicitly open and
              model-agnostic, differentiation must persist in orchestration, production reliability, regulated
              deployment, and execution speed rather than exclusive model access. Forward-deployed teams can accelerate
              adoption, but a 650-person organization and an embedded delivery model may carry services intensity that
              public annualized-revenue claims do not resolve. Incumbents can bundle orchestration into broader suites,
              specialists can win narrower workloads, and customers can retain selected internal capabilities. The
              public record reviewed here is still dominated by company statements, secondary funding coverage, and a
              competitor-authored comparison; independently benchmarked win-loss, retention, and switching data are not
              available.
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Wonderful appears to monetize as a B2B software platform with usage charges tied to interactions or voice
              minutes and volume discounts for large deployments, according to Sacra. That model can align revenue with
              customer activity, while geographic rollout and additional workflows can expand usage within an account.
              However, the company does not publish list prices, realized prices, minimum commitments, contract
              duration, renewal terms, or the split between recurring platform revenue and implementation work. The
              official proposition explicitly combines software, local deployment teams, and strategic partnership, so
              annualized revenue cannot be assumed to be pure software ARR. The $70 million August 2026
              annualized-revenue estimate is useful traction evidence, but it is an external estimate rather than
              audited revenue or company-disclosed ARR.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
