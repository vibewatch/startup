              - CI005
              - CI012
              - CI013
      - number: '4.2'
        title: GTM motion and delivery economics
        blocks:
          - type: paragraph
            body: >-
              The commercial motion is enterprise-led and deployment-heavy. Wonderful says locally embedded teams
              integrate agents into complex systems, support optimization after go-live, and then help customers extend
              the shared platform into more workflows. The company also claims that more than 70% of enterprises
              starting with one use case add workflows within three months, a potentially attractive expansion signal,
              but the denominator, cohort size, contract expansion, and retention are not disclosed. Independent
              commentary identifies the financial trade-off directly: implementation capacity must scale with software
              revenue, creating possible pressure on margin, hiring quality, and delivery consistency. Without
              deployment labor, support cost, sales-cycle, CAC, and payback data, neither software leverage nor sales
              efficiency can be underwritten.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Capital, hiring, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Wonderful raised a reported $550 million Series C at a $5 billion valuation in September 2026, roughly six
              months after the $2 billion Series B valuation. The round materially expands financing capacity, and
              reports tie its use to product development, global deployment teams, and a workforce increase from about
              650 toward roughly 1,000. Earlier Series B materials had already planned growth from 350 employees to
              approximately 900 by year-end, demonstrating how closely the operating plan links capital, hiring, and
              local delivery. Funding raised is not cash available: no reviewed source provides current cash, monthly
              burn, runway, debt, project-finance obligations, or liquidation terms. Capital adequacy therefore cannot
              be assessed from round size alone.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports fast revenue formation and a plausible land-and-expand mechanism, but not yet
              high-quality recurring economics. Usage pricing can scale with interactions, while additional workflows
              and countries create expansion opportunities; conversely, volume discounts, model-inference expense, voice
              infrastructure, integration labor, local teams, and ongoing optimization may absorb a meaningful share of
              gross profit. Public operating metrics emphasize handling-time, containment, and customer efficiency
              rather than Wonderful's own margins or cash conversion. The investment case requires a cohort-level
              reconciliation of contracted recurring software, usage, services, model and telephony costs, deployment
              labor, support, retention, and cash burn. Until those data are supplied, revenue quality, margin path, and
              runway remain material diligence blockers despite substantial fresh financing.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI007
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital is ample; capital efficiency is unproven
            body: >-
              The $550 million Series C supports aggressive product and deployment expansion, but public sources do not
              disclose cash on hand, burn, runway, debt, gross margin, or payback. The round therefore reduces near-term
              financing pressure without proving durable unit economics.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Wonderful is not positioned as a standalone customer-service chatbot. Its own site calls the product a
              unified operating layer, while independent profiles describe a platform for building, testing, and running
              agents across voice, chat, email, documents, employee work, and back-office processes. The product surface
              therefore spans both reusable software and deployment work: agents and AI-native applications sit on
              shared orchestration, context, integration, and control layers, while forward-deployed engineers connect
              those layers to each customer's systems. That combination can shorten the path from a prototype to an
              operating workflow, but it also makes the delivered product partly dependent on implementation quality.
              Public evidence supports the breadth of the offer more strongly than it supports repeatable outcomes
              across customers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
