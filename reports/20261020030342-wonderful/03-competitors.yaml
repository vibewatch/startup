    columns:
      - Offering
      - Public price or contract marker
      - Packaging / buying motion
      - Included scope supported by evidence
      - Diligence implication
    rows:
      - ["Wonderful", "$2.5M 12-month AWS Marketplace listing reported by a competitor; realized price unknown", "Contact sales / private offer; no public rate card", "Enterprise operating layer plus embedded deployment model", "Obtain order form, implementation fees, unit definition, discounts, renewal terms, and realized annual contract value"]
      - ["Palantir AIP", "Unknown in assigned evidence", "Unknown in assigned evidence", "Unified platform and forward-deployed model in cited comparison", "Request comparable scope and implementation-cost quote before benchmarking"]
      - ["Relevance AI", "Unknown in assigned evidence", "Unknown in assigned evidence", "Organization-wide AI teammates in cited comparison", "Test whether narrower scope produces a materially different total cost"]
      - ["Cognigy", "Unknown in assigned evidence", "Unknown in assigned evidence", "Large-contact-center conversational and generative AI", "Compare on the same channels, volumes, integrations, and service obligations"]
      - ["Self-serve support AI", "Competitor says fixed monthly pricing and a free start; exact price absent from fetched text", "Self-serve and trial-led", "Narrow support-workflow scope", "Do not compare sticker price without adjusting for breadth, services, governance, and deployment"]
    notes: >-
      Wonderful's marketplace amount is a competitor-reported listing anchor, not a verified
      transacted price. Other vendor prices and all realized discounts are unavailable in the
      assigned evidence and are shown as unknown.
    claimRefs: [CP006, CP007, CP010, CP015]
