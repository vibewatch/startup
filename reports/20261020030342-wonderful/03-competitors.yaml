      - ["Palantir AIP", "Incumbent enterprise AI platform", "Public-company scale; cited article gives an approximate $400B market value", "Mission-critical enterprise deployments", "Unified platform and forward-deployed execution model", "Scale and maturity make stage-to-stage comparison weak; detailed feature evidence is limited"]
      - ["Relevance AI", "Horizontal agent-platform startup", "$24M Series A in May 2025", "Organizations deploying AI teammates", "Organization-wide agent-building proposition", "Assigned evidence does not establish enterprise deployment depth, pricing, or regulated-industry proof"]
      - ["Cognigy", "Contact-center AI specialist", "Acquired and operated as a NiCE brand", "Large contact centers", "Conversational and generative AI specialization", "Narrower workflow scope than Wonderful's stated enterprise OS"]
