      - ["Public proof quality", "Company claims and named deployments; broad independent user evidence remains thin", "Comparison article only in this pool", "Comparison article only in this pool", "Comparison article only in this pool", "Competitor claims are directional and are not independent benchmarks"]
    notes: >-
      Cells state only capabilities present in the assigned fetched evidence; "not established"
