company:
  name: "Outschool"
chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence supports a research-more recommendation rather than underwriting Outschool at its $3.0B 2021 mark. A June 2026 secondary print and QuantLogix model point to a much lower reference corridor, while current revenue, margins, retention, cash, and preference terms remain private."
sections:
  - id: "price-evidence-and-entry-discipline"
    title: "Price Evidence and Entry Discipline"
    body: "The last confirmed financing mark in the assigned evidence is the $3.0B valuation attached to Outschool's $110M Series D in October 2021. That historical mark is not a current price. QuantLogix reports a $318M secondary-market print dated June 27, 2026 and publishes a $491.12M model estimate as of October 13, 2026, 84% below the last round. QuantLogix also says no later priced round has tested its estimate. These observations support a stretched stance on the legacy mark and a research-more recommendation, but they do not establish intrinsic value, a bid, an ask, or cash available to the company."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "operating-proof-and-anti-thesis"
    title: "Operating Proof and Anti-Thesis"
    body: "The operating evidence shows breadth and visible marketplace activity, not verified economics. Outschool displays a 4.9 rating across 1.5 million class reviews and says more than 80% of academic classes are taught by credentialed teachers. A sampled provider profile carries 1,636 reviews, while a law-category page shows live and self-paced listings across several price points. Outschool.org separately reports more than $100M deployed to low-income families and programs designed with more than 40 community organizations and state agencies. These are useful adoption and supply signals, but company, affiliated-program, and provider-issued pages cannot prove retention, take rate, revenue quality, margins, or cash generation."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenario-and-comparable-framework"
    title: "Scenario and Comparable Framework"
    body: "A conventional revenue-multiple valuation is not supportable from this evidence set because Outschool has not published revenue and the only revenue figure is GetLatka's $200M estimate for June 2024. The scenario table therefore uses observed public marks as decision-reference bands rather than forecasts. The base reference corridor is $318M to $491.12M; a bull case can extend toward the $3.0B legacy mark only if current audited growth, margins, cohorts, and cash generation justify a re-rating; and the bear case has no defensible public floor below the secondary print. No public-company, M&A, or private-round comparable in the assigned pool has a sufficiently matched period, metric, and denominator to support a multiple."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV008"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence-gates"
    title: "Exit Readiness and Diligence Gates"
    body: "Exit readiness is limited: QuantLogix reports that Outschool remains private and has no public S-1 on file. Public evidence also does not disclose the current cap table, liquidation preferences, tender history, cash balance, burn, or runway. The learner find-classes URL resolved only to authentication controls in the prefetched text, reinforcing that public product surfaces do not close the operating-data gap. Before entry, investors should require audited statements, GMV-to-net-revenue reconciliation, family and educator cohorts, current capitalization and preference waterfalls, and evidence on safety-policy incidence. The thesis breaks if those materials show deteriorating repeat behavior, insufficient runway, or preference seniority that impairs junior equity at the observed reference corridor."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV013"
      - "CV016"
