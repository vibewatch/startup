    title: "Thesis / anti-thesis table"
    columns:
      - "Evidence pillar"
      - "Thesis"
      - "Anti-thesis or limitation"
      - "What would change the view"
    rows:
      - - "Marketplace activity"
        - "Outschool displays a 4.9 rating across 1.5 million class reviews."
        - "Cumulative reviews do not disclose active families, repeat behavior, refunds, or current-period growth."
        - "Monthly active-family and cohort-repeat data reconciled to bookings."
      - - "Educator supply"
        - "Outschool says more than 80% of academic classes are taught by credentialed teachers; one provider profile shows 1,636 reviews."
        - "The evidence is company- or provider-issued and does not establish supply retention or concentration."
        - "Educator cohorts, listing concentration, fill rates, and payout retention."
      - - "Program reach"
        - "Outschool.org reports more than $100M deployed and programs with more than 40 organizations and state agencies."
        - "Program deployment is not Outschool revenue, recurring contracted value, or cash available to the company."
        - "Contract-level revenue, renewal, funding-source, and concentration schedules."
      - - "Trust and safety"
        - "Outschool can immediately restrict or remove educators for severe violations."
        - "A policy describes controls but does not disclose incident rates, enforcement consistency, or loss exposure."
        - "Incident, appeal, removal, complaint, and insurance-loss histories."
    notes: "Positive evidence is classified by issuer relationship: Outschool pages are company-issued, Outschool.org is treated as a partner/affiliate signal, and the educator profile is supplier-issued."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Probability signal"
      - "Downside trigger or decision"
    rows:
      - - "Bull"
        - "Audited growth, contribution margin, retention, and cash generation justify re-rating from the current reference marks."
        - "$491.12M to $3.0B observation band; the upper endpoint is a legacy mark, not a supported current value."
        - "Unproven in public evidence."
        - "Proceed only at a diligence-supported price with a target return derived from verified cash-flow and dilution inputs."
      - - "Base"
        - "No new priced round; private diligence shows a viable but lower-growth marketplace."
        - "$318M to $491.12M public reference corridor; neither endpoint is an intrinsic-value conclusion."
        - "Most consistent with the available price observations, subject to transaction terms."
        - "Research more; negotiate from current evidence rather than the 2021 mark."
      - - "Bear"
        - "Weak cohorts, insufficient runway, adverse safety losses, or senior preferences reduce junior-equity recovery."
        - "Below $318M or no-entry; the public record provides no defensible valuation floor."
        - "Material until private financial and capitalization evidence is reviewed."
        - "Decline if downside protection or a credible preference-adjusted return cannot be established."
    notes: "Ranges are decision-reference bands derived from the cited historical mark, model estimate, and secondary print; no revenue multiple, probability percentage, or intrinsic value is asserted."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV008"
      - "CV013"
