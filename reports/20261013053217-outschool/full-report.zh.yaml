  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Outschool 位于更广泛 K-12
              教育科技市场中的细分领域，核心是同步小班直播网课、私人一对一辅导和兴趣驱动的课外拓展，而不是经认证的全日制学校教育。目标支出包括家庭可自由支配的课后拓展预算、在家学习补充课程支出、私人辅导额度，以及微型补助或社区补贴的拓展项目。相反，公立学校核心税收拨款、州级生均拨款公式、强制性的学区企业教学采购，以及授予学历的中等教育学费，都不属于
              Outschool 的主要可变现市场边界。家长使用 Outschool，是为了解决传统课堂无法灵活处理的具体教学缺口，例如小众主题、高中进阶写作、竞技辩论或外语。但平台持续面临既有替代方案的竞争，从 Khan
              Academy 等免费异步视频资源，到社区体育联赛、当地社区中心项目，以及 Kumon、Mathnasium 等线下辅导中心。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
      - number: '2.2'
        title: 市场规模视角与受限 TAM/SAM/SOM 边界
        blocks:
          - type: paragraph
            body: >-
              评估 Outschool 的商业机会，需要把全球教育科技总量预测拆成可执行的可触达层级。宏观层面，全球教育支出接近数万亿美元，其中 Contrary Research 汇编的市场研究估计，全球 EdTech
              支出到 2025 年约达 $404B。总可触达市场层面，全球在线 K-12 教育市场 2022 年约为 $8.0B，预计到 2028 年以 8.3% 的复合年增长率扩大至 $12.9B。进一步收窄到
              Outschool 的可服务市场后，范围包括消费者付费的补充直播教学、非认证的在家学习拓展，以及面向英语国家和国际家长群体的在线辅导，对应约 $2.0B 至 $3.0B
              的可触达消费者支出。在此边界内，Outschool 的可获取市场反映平台实际净佣金率，即从已预订课程收入中抽取 30%。未经审计的行业画像估计其历史预订总额运行率为 $100M 至
              $200M，因此在不大规模拓展正式机构合同的情况下，现实可获取净收入约为 $40M 至 $70M。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
