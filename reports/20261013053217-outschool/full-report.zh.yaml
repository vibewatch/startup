            body: >-
              Outschool 的核心人群是 3 至 18
              岁的未成年学习者，因此其技术差异化和运营防御力高度依赖学习者安全控制、身份核验和平台完整性执法。公司明确采用双轨执法架构，把信任与安全违规和教师政策事件分开，并分别设置三次移除门槛。轨道 1
              监控安全、隐私、安保和严重社区问题；该轨道的违规不会过期，达到三次有效计数后会永久禁止教育者。轨道 2
              处理职业操守、教学质量和上架合规，事件在一个日历年后过期。严重安全违规会立即跳过渐进式纪律程序，触发账户终止和永久列入黑名单。除消费者市场审核外，Outschool.org
