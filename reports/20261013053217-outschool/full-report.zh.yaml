          - type: paragraph
            body: >-
              COVID-19 疫情期间需求空前增长，传统学校复课后 Outschool 收缩，并在 2022 年 6 月和 12 月大幅裁员以重新调整运营费用。公司随后调整商业策略，在 2026
              年撤销不受欢迎的强制订阅政策，恢复按课结账，同时保留基于学分的会员制。此外，联合创始人 Amir Nathoo 于 2026 年 2 月退出执行领导岗位，把日常管理交给 COO 和 CTO，同时继续寻找外部
              CEO。从投资判断角度看，Outschool 仍是私有且不透明的公司，没有公布净收入、毛利率或现金续航的经审计指标。主要论点破坏触发器包括系统性儿童安全事故、被立法排除在州 ESA
              项目之外、教师加速转向替代平台，或其历史 2021 年三十亿美元估值出现严重倍数压缩的证据。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 平台质量分散与家长搜索疲劳
            body: Outschool 是开放市场，独立教师自行定义课程、价格和教学方法，因此教育结果差异很大。与课程统一的结构化辅导服务不同，家长承担持续评估、寻找合格教师的负担，导致退款摩擦和留存风险上升。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: 州教育储蓄账户中的公共资金脆弱性
            body: >-
              Outschool 通过 ClassWallet
              拓展州资助的教育储蓄账户（ESA）项目，带来有价值的非可自由支配收入，但也形成监管集中度。州资格规则、课程限制或获批供应商政策变化，都是平台管理层无法直接缓解的重大外部风险。
            calloutType: insight
            claimRefs:
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格证据与入场纪律
        blocks:
          - type: paragraph
            body: >-
              指定证据中最后一次确认的融资标记，是 Outschool 2021 年 10 月 $110M D 轮对应的 $3.0B 估值。该历史标记不是当前价格。QuantLogix 报告了日期为 2026 年 6 月 27
              日的 $318M 二级市场成交价，并截至 2026 年 10 月 13 日发布 $491.12M 模型估值，比上一轮低 84%。QuantLogix
              还表示，此后没有更晚的定价轮验证其估值。这些观察支持对历史标记采取偏谨慎的立场，并建议继续研究，但不能证明内在价值、买价、卖价或公司可用现金。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
      - number: '8.2'
        title: 运营证明与反论点
        blocks:
          - type: paragraph
            body: >-
              运营证据显示的是广度和可见的市场活动，而非经过验证的经济数据。Outschool 展示 150 万条课程评价、平均 4.9 星，并称超过 80% 的学术课程由持证教师授课。抽样供应商主页有 1,636
              条评价，法律类别页面则展示多个价格点的直播和自主学习课程。Outschool.org 另行报告向低收入家庭投入超过 $100M，并与超过 40
              个社区组织和州机构共同设计项目。这些是有用的采用和供给信号，但公司页面、关联项目页面及供应商发布页面无法证明留存、抽成率、收入质量、利润率或现金创造。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              基于这组证据，传统收入倍数估值无法成立，因为 Outschool 尚未公布收入，唯一的收入数字是 GetLatka 对 2024 年 6 月 $200M
              的估计。因此，情景表将已观察到的公开标记作为决策参考区间，而非预测。基础参考区间为 $318M 至 $491.12M；只有当前经审计的增长、利润率、cohort 和现金创造足以支持重估时，乐观情景才可向
              $3.0B 历史标记靠拢；公开证据无法支持悲观情景在二级市场成交价以下设定可辩护的底价。指定样本中没有一家上市公司、并购交易或私募轮可比对象同时具备足够匹配的期间、指标和分母来支持倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
      - number: '8.4'
        title: 退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              退出准备度有限：QuantLogix 报告 Outschool 仍为私有公司，且没有公开提交的 S-1。公开证据也没有披露当前股权结构表、清算优先权、要约历史、现金余额、现金消耗或续航。学习者找课程 URL
              在预取文本中只解析到认证控制，进一步说明公开产品界面无法填补运营数据缺口。入场前，投资者应要求经审计报表、GMV 到净收入的对账、家庭和教育者
              cohort、当前资本化及优先权瀑布图，以及安全政策事件证据。如果这些材料显示复购行为恶化、续航不足，或优先权级别损害观察参考区间内的次级股权，投资论点即告失效。
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 入场纪律
            body: >-
              将 $318M 和 $491.12M 视为不完美的价格参考，而不是有证据支持的估值区间。任何投资决策都需要一套按优先权调整的回报模型，基础是经审计的经济数据、当前现金与消耗、经验证的
              cohort，以及完全稀释后的资本化表。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
