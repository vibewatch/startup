      - number: '4.4'
        title: 资本充足性与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Outschool 在成长周期累计融资约 $230M 至 $240M，最终于 2021 年 10 月由 Tiger Global 领投 $110M C 轮融资，投后估值为
              $3.0B。该估值形成于疫情高峰期教育科技市场狂热阶段，此后没有公开定价事件或二级市场标记在 2021 年末之后重新确认它。对承销方和潜在投资者而言，资本充足性仍不明确：平台或许能在估计 $200M
              的收入规模上接近现金盈亏平衡，但没有私人银行账户和董事会材料，无法评估真实现金消耗、当前资金储备和资本续航。机构微型补助及 B2B 学校合作带来有吸引力的多元化，但在经认证的留存 cohort
              和经审计的单位贡献报表提交前，无法为增长估值提供投资判断。
