      - number: '2.3'
        title: 目标细分市场中的买方、用户与付款方动态
        blocks:
          - type: paragraph
            body: >-
              Outschool 的商业推进受多方利益相关者共同影响，购买者、消费者和受益人往往并不相同。在占主导地位的家庭消费者市场中，父母或法定监护人既是经济买方也是预算所有者，3 至 18
              岁儿童则是日常终端用户。在家学习家庭是平台日间复购流量的基础，其采用通常由课程缺口、高中专业选修需求，或希望在没有学校官僚体系的情况下进行结构化同伴社交所触发。传统学校家庭则在晚间和周末采用平台，用于补救性学习、考试准备或兴趣探索。第三个新兴细分市场来自机构和公益资金：Outschool.org
              历史上发放了 $2.4M 社区伙伴补助和 34,000 个学习者奖学金，以扩大种族和经济边缘化学生的获得机会。各类买方的交易摩擦都因透明、拆分式定价而降低，单节小班课通常定价为 $10 至 $20。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM011
      - number: '2.4'
        title: 结构性增长驱动与长期采用瓶颈
        blocks:
          - type: paragraph
            body: >-
              Outschool
              的市场机会由长期增长驱动推动，同时受到供给侧摩擦和疫情后行为变化的约束。关键驱动包括灵活在家学习的长期增长、家长对千篇一律公立学校课程的不满，以及教育者希望在传统课堂限制之外灵活赚取补充收入。但严重的采用瓶颈限制平台规模。Outschool
              是开放市场而非标准化课程供应商，教学质量、班级管理和学术严谨度在不同教师之间差异很大。为控制供给侧风险，Outschool
              执行正式的双轨政策治理体系，分别设置信任与安全违规记分轨道及教师政策事件轨道，并在各自累计三次后永久移除。此外，30% 的市场佣金率持续制造平台留存与去中介化之间的经济张力，尤其当独立教育者试图把忠实学生
              cohort 带到平台外以规避费用时。
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场碎片化带来相互竞争的质量动态
            body: >-
              Outschool 作为开放市场，能迅速把课程目录扩展到 140,000+
              个课程，但也把质量筛选负担转移给家长。由于教学交付、定价和课程深度取决于各个独立教育者，平台更像去中心化的发现引擎，而非标准化的学术机构。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM014
          - type: callout
            title: 去中介化与抽成压力威胁平台单位经济
            body: >-
              Outschool 从独立教师收入中抽取 30% 佣金。在一对一辅导和多周 cohort
              课程中，教育者与家长较早建立信任，参与者因而有很强的经济动机把教学转移到平台外，平台必须依靠严格的沟通政策和自动化合规监控。
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM013
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代品类别
        blocks:
          - type: paragraph
            body: >-
              K-12 补充教育和替代教育市场涵盖直播市场、专门的一对一辅导服务、异步教学资料库，以及现状型在家学习网络。Outschool 主要凭借开放报名的小班市场模式实现差异化，把 3–18
              岁学习者与独立承包者连接起来，通过 Zoom 交付超过 140,000 门直播课程。Brighterly 等直接竞争者以专门的一对一辅导争夺数学、阅读等小学核心学科；Wyzant
              等老牌网络则汇集覆盖各年级的大型教师目录。相比之下，Khan Academy 等异步平台提供免费的掌握式课程模块，却缺少同步的同伴社交环境。Outschool
              位于社交化小组拓展与灵活学科辅导的交叉点，同时面对结构化商业服务和家长组织的在家学习合作社竞争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
