      - - 项目覆盖
        - Outschool.org 报告称已部署超过 $100M 的资金，并与超过 40 家组织和州级机构开展项目。
        - 项目资金部署不等于 Outschool 的收入、经常性合同金额或公司可用现金。
        - 按合同拆分的收入、续约、资金来源及集中度明细。
      - - 信任与安全
        - 对于严重违规行为，Outschool 可以立即限制或移除教育者。
        - 政策说明了控制措施，但没有披露事故率、执行一致性或损失敞口。
        - 事故、申诉、移除、投诉及保险损失历史。
