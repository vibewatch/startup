      - number: '4.2'
        title: 单位经济与服务交付成本
        blocks:
          - type: paragraph
            body: >-
              Outschool 的核心单位经济体现在 GMV 转化上：课程总付款的 70% 直接流向教育者，留下 30% 的总抽成来覆盖全部平台运营。与边际交付成本接近于零的异步课程平台不同，Outschool
              依赖同步直播视频教学，平均师生比为 4:1，超过 80% 的学术课程由持证教师授课。可变服务交付成本包括直播视频基础设施、支付网关处理费（通常为 GMV 的 2% 至
              3%）以及较高的信任与安全合规开销。Outschool 执行正式的双轨教育者政策，多次事件会取消教师的促销徽章资格并下架课程。由于毛利率受 30%
              抽成率限制，贡献利润率对教师供给留存、支付处理费用和客服解决成本高度敏感。
            claimRefs:
              - CI001
