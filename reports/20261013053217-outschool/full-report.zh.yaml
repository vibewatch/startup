              Outschool 的技术和商业架构高度依赖关键第三方基础设施供应商及专门渠道中介。所有直播课堂交付都通过平台提供的 Zoom
              链接完成，因此第三方服务降级或安全漏洞会直接停止教学运营，形成运营单点故障。同样，消费者支付由 Stripe 处理，使平台结账暴露于支付处理商政策变化。在分销侧，Outschool 通过与 ClassWallet
              集成进入州资助的教育储蓄账户（ESA）项目，让家庭把公共资金代金券用于合资格课程。但该渠道带来外部政策脆弱性：州代金券资格、供应商认证规则或公共资金上限变化，都可能突然压缩招生量。同时，Outschool
              从课程销售中保留百分之三十抽成，持续给表现最佳的独立教师带来留存压力。
