      - number: '4.3'
        title: 公开规模基准与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              2020 年初疫情封锁期间，居家的家庭转向直播拓展，Outschool 平台收入增长了 30 倍。随后传统线下学校重开，线上学习疲劳和常态化逆风明显。第三方市场追踪者估计其 2024–2025 年收入运行率约为
              $200M，但公司仍为私有企业，未披露经验证的 GAAP 收入、GMV 明细或 cohort 留存曲线。Common Sense Media
              的独立家长评价持续抱怨行政支持和结算做法，显示消费者家庭留存存在摩擦；没有管理层认证的 cohort 核算，未来收入的耐久性仍不确定。
