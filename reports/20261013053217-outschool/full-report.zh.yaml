          detail: 依托学习者兴趣数据和 CDP 基础设施中的行为匹配，在 140,000+ 门课程中提供个性化搜索。
          tone: neutral
        - label: 小班课程
          detail: 学习者参加直播小班课程，平均师生比为 4:1，由经过审核的教育者授课。
          tone: positive
        - label: 辅导与拓展
          detail: 家庭从单一兴趣课程拓展到多周写作学院、一对一辅导及核心课程科目。
          tone: positive
        - label: 反馈与评价
          detail: 家庭提交评价（150 万条评价平均为 4.9 分），平台则执行双轨安全与质量标准。
          tone: neutral
        - label: 机构采用
          detail: 学区和社区组织签约开展定向线上辅导队列（例如 CCSD 课后项目）。
          tone: positive
