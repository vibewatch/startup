      - number: '3.2'
        title: 核心购买标准下的能力与功能矩阵
        blocks:
          - type: paragraph
            body: >-
              将 Outschool 与主要市场替代品并置，可以看到教学形式、课程治理和资质认证之间明显的运营取舍。Outschool 以直播小班 cohort 为价值核心，典型师生比为 4:1，促进了 Wyzant 和
              Brighterly 等专门一对一服务有意排除的同伴互动。但 Outschool 的课程标准化存在结构性局限：课程由自由职业教师独立编写，没有锚定统一的州教育框架。虽然超过 80%
              的学科课程由持证教育者授课，平台不提供统一的诊断测试或纵向进度跟踪，因此家长必须自行审查学习结果。相反，Brighterly 等专门服务执行符合州标准的课程，为追求补救性学习效果的家长提供更高的可预测性。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价结构、抽成率与客户经济
        blocks:
          - type: paragraph
            body: >-
              在线学习生态的定价模式决定用户采用速度和客户终身价值。Outschool 将按需购买课程与月度学分订阅结合起来，订阅方案从 $40 购买 80 个学分到 $240 购买 500 个学分不等。小班直播课通常每节
              $5 至 $36，显著低于私人一对一辅导每节 $24 至 $58 的收费，也低于 Wyzant 每小时 $35 至 $80 的费率。Outschool 从教师课程费中抽取 30%
              佣金，并在结账时另向家长收取市场服务费。教师保留总费用的 70%，形成一条收入引擎；外部分析师估计其截至 2024 年创造约 $200M 年度平台收入，而历史风险投资估值为 $3B。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河耐久性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Outschool 面临显著的长期耐久性障碍，原因在于退出门槛低且供给侧脆弱。家庭要么按课付费，要么使用灵活的月度学分订阅，且没有长期年约，因此转换成本很低。教育者是独立承包者而非专属员工，长期存在跨
              Preply、Wyzant 及私人辅导多平台经营的动机，以规避 Outschool 的 30% 抽成率。为维护市场完整性，Outschool
              执行双轨纪律协议，将信任与安全违规和专业事件分开，并在累计三次后移除。尽管如此，公开客户评价仍指出学分核算复杂和教学质量不稳定，说明 Outschool 的网络效应容易受到局部去中介化和垂直辅导竞争者的冲击。
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 教师多平台经营与供给去中介化
            body: >-
              Outschool 从独立教师处抽取 30% 佣金，同时执行严格的双轨纪律程序。教育者以承包者身份经营且不受平台排他约束，热门教师持续有经济动机把既有学生关系转移到平台外，或在 Wyzant、Preply
              等竞争市场上多平台经营。
            calloutType: risk
            claimRefs:
              - CP010
              - CP014
          - type: callout
            title: 拓展细分市场使 Outschool 避开免费异步替代品
            body: Khan Academy、Chegg 等免费或低价异步平台占据核心学科学习和作业辅导，但 Outschool 通过直播社交和自动化或静态课程无法复制的兴趣主题守住了市场切口。
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价机制
        blocks:
          - type: paragraph
            body: >-
              Outschool 主要是直播在线 K-12 补充教育的双边市场，从教师课程收入中扣除约定的 30% 平台抽成，以此变现消费者需求。独立教师自行设定上架价格，单节直播课通常为 $10 至
              $30；多周学期项目和强化学术训练营则常按每名注册学习者收取超过 $100 至 $200。除家庭消费者结算外，Outschool
              还凭借学区合同、雇主赞助的家庭福利以及州管理的教育储蓄账户（ESA）微型补助拓展机构分销。其非营利伙伴 Outschool.org 已在公共和私人项目中投入超过 $100M，对应每名学生 $150 至 $225
              的补贴单位成本基准。但实际价格和净抽成率受到满意度退款政策及消费者结算摩擦的下行压力。
