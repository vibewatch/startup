  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链依次从历史融资、当前价格参考走向尚未解决的私人尽调问题，最终得出继续研究的决定。
    data:
      nodes:
        - id: legacy-mark
          label: $3.0B 历史估值
          detail: 2021 年 10 月 $110M D 轮融资
        - id: secondary-print
          label: $318M 二级市场成交记录
          detail: QuantLogix 记录，日期为 2026 年 6 月 27 日
        - id: model-mark
          label: $491.12M 模型估值
          detail: QuantLogix 估值，日期为 2026 年 10 月 13 日
        - id: operating-signals
          label: 可见的市场平台信号
          detail: 评价、教育者资质、课程目录定价及合作伙伴项目
        - id: private-gaps
          label: 私人证据缺口
          detail: 收入质量、队列、现金、资金可支撑期限、股权结构表及优先权
        - id: decision
          label: 继续研究
          detail: 高风险；历史估值看起来偏高
      edges:
        - from: legacy-mark
          to: secondary-print
        - from: secondary-print
          to: model-mark
        - from: model-mark
          to: operating-signals
        - from: operating-signals
          to: private-gaps
        - from: private-gaps
          to: decision
    approximationNotes: 该流程是定性且按顺序展开的；不表示价格观察、运营信号和尽调缺口共享同一数值尺度。
    claimRefs:
      - CV001
