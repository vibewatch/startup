        blocks:
          - type: paragraph
            body: >-
              Outschool 由联合创始人兼首席执行官 Nicholas Grandy 领导，他带领公司从早期参加 Y Combinator
              走过多轮风险融资。市场依赖数万名独立承包者，而非受薪教学人员，因此高度依赖社区信任、教学质量和教师合规。为约束教育者行为，Outschool
              建立正式的双轨纪律框架，分别对信任与安全违规及专业质量事件设置独立的三次违规门槛。外部机构利益相关者包括早期加速器 Y
              Combinator、成长期风险投资联盟、公益基金会伙伴，以及参与定向扫盲项目的市政公立学区。
