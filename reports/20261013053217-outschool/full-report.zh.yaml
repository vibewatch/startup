      - number: '1.3'
        title: 资本化历史、运营轨迹与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              COVID-19 疫情期间全球学校停摆，虚拟小班教学需求激增，Outschool 迅速扩张，并在 2021 年末通过 C 轮和 D 轮融资达到 $3.0B 估值。GetLatka 的第三方分析师估计其 2024
              年收入约为 $200M，LinkedIn 报告的员工数约为 1,540 人，但管理层尚未公开审计或确认任一指标。消费者评价呈两极分化：Trustpilot 上 3,210 条家长评价给出 4.5/5 星，而
              Sitejabber 因客服和严格退款政策引发的抱怨仅得 1.8/5 星。实质性尽调仍需审计财务报表、实际 GMV 到净收入的桥接表及经验证的留存 cohort。
