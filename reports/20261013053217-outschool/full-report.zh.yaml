  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件或决策
    rows:
      - - 乐观
        - 经审计的增长、贡献利润率、留存及现金生成足以推动估值相对当前参考记录重估。
        - $491.12M 至 $3.0B 的观察区间；上限是历史估值，不代表有依据的当前价值。
        - 公开证据尚未验证。
        - 只有在尽调支持的价格下才推进交易，并根据经核实的现金流和稀释输入设定目标回报。
      - - 基准
        - 没有新一轮定价融资；私人尽调显示这是一个可行但增速较低的市场平台。
        - $318M 至 $491.12M 的公开参考区间；两端都不是内在价值结论。
        - 与现有价格观察最一致，但仍取决于交易条款。
        - 继续研究；根据当前证据谈判，不要依据 2021 年估值。
      - - 悲观
        - 队列表现疲弱、资金可支撑期限不足、安全损失不利或优先权较高，压低普通股权益回收。
        - 低于 $318M 或不入场；公开记录没有提供可辩护的估值底线。
        - 在审查私人财务和资本结构证据前，该情景具有实质性可能。
        - 如果无法确立下行保护或可信的经优先权调整回报，则放弃交易。
    notes: 区间是根据引用的历史估值、模型估值和二级市场成交记录得出的决策参考带；没有主张收入倍数、概率百分比或内在价值。
    claimRefs:
