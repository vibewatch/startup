    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Outschool, Inc. 由 Nicholas Grandy 及联合创始人于 2015 年创立，运营一个在线补充学习市场，把 3 至 18 岁儿童和青少年与独立教育者连接起来。平台在全球 183
              个国家提供超过 140,000 门直播小班和自主学习视频课程，覆盖学科辅导、创意写作及兴趣拓展。Outschool 采用交易佣金模式，课程按次收费，通常为每小时 $10 至 $30；独立教师获得学费总额的
              70%，Outschool 留存 30% 的平台服务费。同时，其非营利部门 Outschool.org 已向低收入家庭和流离失所学习者投入超过 $100M 的州机构及基金会资金。
