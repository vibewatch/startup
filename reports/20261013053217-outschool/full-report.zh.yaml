        title: 监管、COPPA 与儿童安全治理
        blocks:
          - type: paragraph
            body: >-
              运营互动式 K-12 直播在线教育市场，使 Outschool 在儿童网络安全、数据隐私和教师审查上受到更严格的监管审视。包括《儿童在线隐私保护法》（COPPA）在内的联邦法规要求严格的同意框架，并限制收集 13
              岁以下未成年人的个人数据。为管理每天数千次视频互动中的儿童安全责任，Outschool
              要求所有教师在入职前完成身份核验和刑事背景调查，并每年续核。平台维持严格的双轨执法架构，将信任与安全违规与常规政策事件分开。尽管公开记录中没有针对公司的正式联邦执法行动或州检察长调查，儿童安全仍是生死攸关的运营边界，任何一次灾难性失误都可能引发立法制裁或家长大规模弃用。
