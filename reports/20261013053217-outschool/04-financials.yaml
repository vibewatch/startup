schemaVersion: report-v2
artifact: financials
slug: outschool
runDate: '2026-10-13'
company:
  name: Outschool
chapter:
  number: 4
  title: Financials
  summary: Outschool operates a live K-12 learning marketplace monetized via a 30% commission on teacher class fees, but underwriting its estimated $200M revenue run-rate and $3B peak valuation remains blocked by private metric opacity and post-pandemic retention headwinds.
sections:
  - id: revenue-streams-and-pricing-model
    title: Revenue Streams and Pricing Mechanics
    tableRefs:
      - TI001
      - TI002
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI010
      - CI011
      - CI012
      - CI014
    body: Outschool operates primarily as a two-sided marketplace for live online K-12 supplemental education, monetizing consumer demand through a contractual 30% platform take rate deducted from teacher class earnings. Independent instructors set their own listing prices, which typically range between $10 and $30 per single live class, while multi-week semester programs and intensive academic bootcamps frequently command prices exceeding $100 to $200 per enrolled learner. Beyond consumer family billing, Outschool has expanded into institutional distribution through school district contracts, employer-sponsored family benefits, and state-administered education savings account (ESA) microgrants. Outschool.org, the platform's non-profit partner, has deployed over $100M across public and private initiatives, establishing subsidized unit cost benchmarks between $150 and $225 per student. However, realized pricing and net take rates face downward pressure from satisfaction refund policies and consumer billing friction.
  - id: unit-economics-and-cost-structure
    title: Unit Economics and Service Delivery Costs
    tableRefs:
      - TI003
    figureRefs:
      - FI001
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI008
      - CI009
    body: The core unit economics of Outschool center on gross marketplace volume (GMV) conversion, where 70% of gross class payments flow directly to educators, leaving a 30% gross take rate to cover all platform operations. Unlike asynchronous course platforms with near-zero marginal delivery costs, Outschool relies on live, synchronous video instruction maintaining an average 4:1 learner-to-teacher ratio, with over 80% of academic courses taught by credentialed instructors. Variable service-delivery costs include live video streaming infrastructure, payment gateway processing fees (typically 2% to 3% of GMV), and substantial trust-and-safety compliance overhead. Outschool enforces a formal two-track educator policy where multiple incidents disqualify teachers from promotional badging and lead to unlisting. Because gross margin is bounded by the 30% take rate, contribution margins remain sensitive to teacher supply retention, payment processing expenses, and customer service resolution costs.
  - id: traction-metrics-and-scale-validation
    title: Public Scale Benchmarks and Private Metric Gaps
    claimRefs:
      - CI003
      - CI004
      - CI010
      - CI013
    body: Outschool experienced an extraordinary demand surge during the initial 2020 pandemic lockdowns, when platform revenue expanded by 30x as homebound families turned to live virtual enrichment. However, the subsequent reopening of traditional in-person schooling introduced severe online learning fatigue and normalization headwinds. While third-party market trackers estimate Outschool's revenue run-rate at approximately $200M in ARR by 2024-2025, the company remains privately held and has not released verified GAAP revenue figures, GMV breakdowns, or cohort retention curves. Independent parent reviews from Common Sense Media highlight recurring complaints regarding administrative support and billing practices, pointing to ongoing friction in consumer family retention that leaves forward revenue durability uncertain without management-certified cohort accounting.
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital Adequacy and Diligence Verdict
    claimRefs:
      - CI004
      - CI005
      - CI009
      - CI010
      - CI012
    body: 'Outschool accumulated approximately $230M to $240M in total venture financing across its growth lifecycle, culminated by a $110M Series C round in October 2021 led by Tiger Global that valued the business at $3.0B post-money. That valuation was established during peak pandemic EdTech market exuberance and has not been reaffirmed by any public pricing event or secondary mark since late 2021. For underwriters and prospective investors, capital adequacy remains ambiguous: while the platform may approach cash break-even on estimated $200M top-line scale, true cash burn, current treasury reserves, and capital runway cannot be evaluated without access to private bank accounts and board materials. Institutional microgrants and B2B school partnerships offer attractive diversification, but underwriting a growth valuation remains blocked pending certified retention cohorts and audited unit contribution statements.'
tables:
  - id: TI001
    title: Revenue Streams Table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Pricing / Volume Unit
      - Current Status / Scale
      - Revenue Quality
      - Diligence Ask
    rows:
      - - Live Marketplace Classes
        - 30% platform take rate deducted from teacher gross fee
        - Per-class enrollment ($10–$30/class)
        - Core business; >200K class topics
        - Moderate; dependent on repeat family bookings
        - Provide GMV-to-net-revenue bridge and refund rates.
      - - Semester & Multi-Week Courses
        - 30% platform take rate on multi-week curricula
        - Curriculum bundle ($100–$200+/course)
        - Scaled; core academic subject offerings
        - High; upfront payment with lower intra-term churn
        - Verify semester course completion and drop-out rates.
      - - 1-on-1 Private Tutoring
        - Platform commission on hourly tutoring rate
        - Hourly session ($30–$80+/hr)
        - Enrichment and academic remediation
        - High; predictable recurring need but teacher-constrained
        - Inspect tutor supply constraints and gross margin.
      - - Institutional & Microgrant Programs
        - Direct-to-family public funding (ESA/microgrants) & district contracts
        - Per-learner grant ($150–$300 wallet)
        - Outschool.org deployed >$100M via public/private programs
        - Moderate; subject to public policy and annual renewal
        - Confirm institutional contract renewal terms and state policy concentration.
    notes: Revenue stream data synthesizes reported marketplace take-rate structures and public program disclosures; private GMV totals remain unreleased.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI011
      - CI012
      - CI014
  - id: TI002
    title: Pricing / Monetization Table
    columns:
      - Product / Format
      - Price / Contract Model
      - List vs Realized Pricing
      - Discounts & Subsidies
      - Diligence Focus
    rows:
      - - Single Live Session
        - Teacher-set list price ($10–$30 typical)
        - List price minus 30% take rate realized by teacher
        - Promotional credits and checkout parent donations ($33.8K)
        - Average realized order value and discount absorption.
      - - Multi-Week / Semester
        - Fixed multi-session enrollment ($100–$200+)
        - Full curriculum commitment; refund policy applies
        - Need-based scholarships via Outschool.org ($300 wallets)
        - Refund rate and cancellation policy impact on net bookings.
      - - Private 1-on-1 Tutoring
        - Hourly or package rate
        - Variable list pricing; 30% platform cut
        - School district contracts and ESSER/microgrant subsidies
        - Pricing power vs dedicated tutoring networks.
      - - Outbridge / Community Programs
        - Subsidized public program partnership
        - Targeted at $150–$225 per learner cost basis
        - State agency grants (e.g., Virginia Learning Acceleration Grants)
        - State microgrant budget permanence and contract margins.
    notes: Pricing ranges reflect platform search observations and published Outschool.org cost reports; institutional volume discounts are unpublished.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI010
      - CI011
  - id: TI003
    title: Unit Economics Table
    columns:
      - Unit Metric
      - Reported / Estimated Value
      - Confidence
      - Strategic Significance
      - Underwriting Diligence Ask
    rows:
      - - Marketplace Take Rate
        - 30.0%
        - high
        - Determines platform net revenue share from gross merchandise volume
        - Confirm whether large institutional or high-volume teachers receive discounted take rates.
      - - Class Size Ratio
        - 4:1 learner-to-teacher ratio
        - high
        - Drives teacher hourly earnings potential and family perceived value
        - Provide distribution of actual class enrollment vs capacity caps.
      - - Enrichment Cost per Learner
        - $150 to $225
        - medium
        - Represents effective subsidized cost of delivery in community programs
        - Examine gross margin on direct-to-family institutional contracts.
      - - Annual Net Revenue / ARR
        - $200M (Est. 2024-2025)
        - medium
        - Top-line scale indicator for underwriting post-pandemic baseline
        - Request audited financial statements and GAAP revenue breakdown.
    notes: Take rate and class ratios reflect company and analyst benchmarks; ARR is estimated by third parties as audited financials are private.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI008
figures:
  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: Conversion flow of parent booking expenditure through platform take-rate retention and educator disbursements.
    data:
      nodes:
        - label: Parent Class Booking
          detail: Families purchase live classes ($10–$30/class) or multi-week courses ($100–$200+).
        - label: Gross Merchandise Volume (GMV)
          detail: Aggregated gross transaction volume processed through Outschool platform payments.
        - label: Platform Take Rate (30%)
          detail: Outschool retains contractual 30% marketplace commission on completed bookings.
        - label: Educator Net Earnings (70%)
          detail: Independent vetted teachers receive remaining 70% share of class tuition fees.
        - label: Cost of Service Delivery
          detail: Platform absorbs payment gateway processing fees, video infrastructure, and trust-and-safety overhead.
        - label: Net Platform Contribution
          detail: Residual operating contribution supporting corporate SG&A, product R&D, and marketing.
    approximationNotes: Commission take-rate is documented; service delivery hosting and payment processing costs are unseparated in public reports.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI009
callouts:
  - calloutType: risk
    title: Post-Pandemic Growth Normalization and Private Metric Opacity
    body: While Outschool achieved dramatic 30x expansion during peak 2020 pandemic school closures and reached a $3B valuation in 2021, current revenue stability ($200M ARR estimates) cannot be independently validated without audited financial disclosures. In-person school resumption and documented consumer billing friction present material retention risks.
    claimRefs:
      - CI003
      - CI004
      - CI010
      - CI013
  - calloutType: insight
    title: B2B and Public Microgrant Channel Diversification
    body: Outschool's partnerships with school districts, community organizations, and state educational agencies represent a strategic hedge against direct-to-consumer churn. With Outschool.org deploying over $100M in public and private education funds, institutional microgrants offer a pathway to recurring, subsidized enrollment.
    claimRefs:
      - CI007
      - CI012
      - CI014
