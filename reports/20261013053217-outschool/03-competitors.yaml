callouts:
  - calloutType: "risk"
    title: "Teacher Multi-Homing and Supply Disintermediation"
    body: "Outschool extracts a 30% commission from independent teachers while enforcing strict two-track disciplinary procedures. Because educators operate as contractors without platform exclusivity, popular tutors face persistent economic incentives to transition established student relationships off-platform or multi-home on competing marketplaces like Wyzant and Preply."
    claimRefs:
      - "CP010"
      - "CP014"

  - calloutType: "insight"
    title: "Enrichment Niche Shields Outschool From Asynchronous Free Substitutes"
    body: "While free and low-cost asynchronous platforms like Khan Academy and Chegg dominate core academic practice and homework help, Outschool protects its market wedge through live socialization and niche interest-driven topics that automated or static curricula cannot replicate."
    claimRefs:
      - "CP002"
      - "CP007"
      - "CP015"

