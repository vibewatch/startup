callouts:
  - calloutType: "insight"
    title: "Marketplace Fragmentation Creates Competing Quality Dynamics"
    body: "Outschool's strategic position as an open marketplace enables rapid catalog expansion across 140,000+ class listings, yet shifts the burden of quality discovery onto parents. Because instructional delivery, pricing, and curriculum depth depend on individual independent educators, the platform functions more as a decentralized discovery engine than a standardized academic institution."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM012"
      - "CM014"
  - calloutType: "risk"
    title: "Disintermediation and Take-Rate Pressure Threaten Platform Unit Economics"
    body: "Outschool's 30% commission take rate represents a significant portion of teacher earnings. In recurring 1-on-1 tutoring and multi-week cohort classes where educator-parent trust is established early, strong economic incentives exist for participants to take instruction off-platform, necessitating strict platform communication policies and automated compliance monitoring."
    claimRefs:
      - "CM005"
      - "CM007"
      - "CM013"
      - "CM015"
