callouts:
  - calloutType: "insight"
    title: "Marketplace Asymmetry and Supply Governance"
    body: "Outschool's commercial leverage stems from its 30% take rate and catalog of over 140,000 classes, yet its reliance on independent contractors creates significant governance vulnerabilities. Because instructors design their own curricula and bear business risk, the platform must enforce strict disciplinary strike systems to maintain parent trust without triggering contractor reclassification disputes."
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO009"
  - calloutType: "risk"
    title: "Unverified Valuation Marks and Customer Friction"
    body: "The historical $3B valuation achieved in 2021 reflects peak pandemic-era multiples that may not represent current private secondary pricing. Furthermore, divergent customer satisfaction metrics—highlighted by 4.5 stars on Trustpilot contrasted against 1.8 stars on Sitejabber—indicate lingering friction regarding strict refund rules and customer service responsiveness."
    claimRefs:
      - "CO003"
      - "CO012"
