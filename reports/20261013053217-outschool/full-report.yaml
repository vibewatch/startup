chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Architecture, and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2015 by Nicholas Grandy and his co-founders, Outschool, Inc. operates an online supplementary
              learning marketplace connecting children and teenagers aged 3 to 18 with independent educators. The
              platform offers more than 140,000 live small-group and self-paced video classes spanning academic
              tutoring, creative writing, and enrichment topics across 183 countries worldwide. Outschool monetizes
              through a transaction commission model where courses are priced on a pay-per-session basis (typically
              ranging from $10 to $30 per hour), with independent teachers receiving 70% of gross tuition and Outschool
              retaining a 30% platform service fee. In parallel, its non-profit arm Outschool.org has deployed over
              $100M in state agency and foundation funding to low-income families and displaced learners.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO013
