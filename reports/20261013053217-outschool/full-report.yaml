              - CE009
      - number: '5.3'
        title: Trust, Safety, Security & Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Given its core demographic of minor learners aged 3 to 18, Outschool's technical differentiation and
              operational defensibility hinge heavily on learner safety controls, identity verification, and platform
              integrity enforcement. The company maintains an explicit two-track enforcement architecture separating
              Trust & Safety strikes from teacher policy incidents, each governed by an independent three-count removal
              threshold. Track 1 monitors safety, privacy, security, and severe community concerns; strikes on this
              track do not expire and trigger permanent educator debarment upon reaching three active counts. Track 2
              addresses professional conduct, pedagogical quality, and listing compliance, issuing incidents that expire
              after one calendar year. Severe safety violations immediately bypass progressive discipline, triggering
              immediate account termination and permanent blacklisting. In addition to consumer marketplace moderation,
              Outschool's non-profit arm Outschool.org coordinates public-agency and philanthropic education programs,
              deploying structured tutoring and literacy interventions across community-based organizations.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical External Dependency on Zoom Video Infrastructure
            body: >-
              Outschool does not own or operate a proprietary live video streaming media network; all synchronous
              interactive sessions rely on Zoom Video Communications infrastructure. This design drastically reduced
              initial infrastructure overhead but creates a single point of failure where third-party Zoom platform
              disruptions directly interrupt core service delivery.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Structured Two-Track Trust & Safety Governance
            body: >-
              By formalizing a decoupled two-track system—separating non-expiring Trust & Safety strikes from one-year
              pedagogical incidents—Outschool protects minor learner safety while providing transparent procedural
              governance for independent educators.
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer-Payer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Outschool segments its customer base across direct-to-consumer household families, neurodivergent student
              cohorts, and institutional public school partnerships. In the primary direct-to-consumer segment, parents
              and caregivers act as the financial payers while school-age children between ages 3 and 18 are the active
              daily users. This consumer base splits into two primary use cases: traditional homeschooling families who
              rely on Outschool for core subject instruction like algebra and English, and supplemental enrichment
              families seeking interest-driven topics such as foreign languages or creative arts. In addition, Outschool
              captures specialized learner demand through small-group formats tailored for students with ADHD and
              Orton-Gillingham instruction for dyslexia. On the institutional front, Outschool.org partners with public
              school districts to deploy small-group virtual tutoring for underperforming students, creating a
              dual-channel buyer landscape where public grant funding and state Education Savings Accounts increasingly
              supplement private household credit card spending.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Platform Scale
        blocks:
          - type: paragraph
            body: >-
              Since its founding in 2015, Outschool has demonstrated significant cumulative scale, reaching more than
              1.5 million families and over 900,000 learners across global markets. The catalog has expanded to
              encompass more than 140,000 live online classes maintaining an average student-to-teacher ratio of 4:1.
              This expansion was accelerated by post-pandemic changes in alternative schooling, with homeschooling rates
              more than doubling over five years and 36% of reporting states reaching peak homeschool enrollment in
              2024-2025. Demand is further reinforced by legislative tailwinds, as more than 19 states now offer
              Education Savings Accounts that provide direct state vouchers for tutoring and online tuition. However,
              public disclosures emphasize cumulative lifetime metrics rather than active annual transacting families.
              Independent market aggregators estimate 2024 revenue at $200 million, but Outschool does not publish
              audited financials, gross bookings bridges, or active recurring user counts.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU007
      - number: '6.3'
        title: Named Customer Proof and Educational Outcomes
        blocks:
          - type: paragraph
            body: >-
              Named reference proof on Outschool spans both institutional public school district engagements and
              prominent independent educator organizations. In the institutional sector, Outschool.org partnered with
              the Charleston County School District (CCSD) in South Carolina to deliver an 11-week virtual tutoring
              intervention for 59 elementary learners in the Kaleidoscope afterschool program. Bi-weekly 90-minute
              tutoring sessions resulted in 100% of participants demonstrating growth on iReady math assessments (with
              79% increasing scores by 10 or more points) and 76% showing reading growth, prompting CCSD to expand
              Outschool tutoring into its Turnaround Schools. On the marketplace supply side, individual teacher
              storefronts demonstrate deep customer volume; for example, Teacher Jade's Writing Academy has accumulated
              1,636 reviews with a 4.9 average rating across multi-week writing curricula, while specialized law and
              logic courses by certified instructors command per-session pricing between $10 and $40 with high
              satisfaction marks.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Customer Journey, Retention Durability, and Supply Risk
        blocks:
          - type: paragraph
            body: >-
              The customer journey on Outschool progresses from top-of-funnel discovery through interest-based search,
              small-group class participation, and expansion into tutoring and multi-week curriculum bundles. To support
              personalized discovery across its catalog of over 100,000 classes, Outschool deployed Twilio Segment's
              customer data platform, combining onboarding survey data with demographic and behavioral tracking to
              automate class recommendations and save an estimated 3,000 engineering hours annually. While the platform
              boasts 1.5 million class reviews averaging 4.9 out of 5 stars, customer retention durability remains
              subject to critical diligence gaps. Outschool does not disclose net revenue retention, annual customer
              churn, or repeat booking cohorts. Furthermore, learner satisfaction and platform safety depend heavily on
              marketplace supply governance, where Outschool enforces a strict two-track disciplinary system consisting
              of Trust & Safety strikes and teacher policy incidents to restrict or remove non-compliant educators.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU009
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Supply Quality and Churn Constraints in Live Marketplace Learning
            body: >-
              Maintaining educator quality across more than 140,000 live classes requires active platform governance,
              including a two-track strike and policy incident enforcement system to manage teacher removals and quality
              lapses.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, COPPA, and Child Safety Governance
        blocks:
          - type: paragraph
            body: >-
              Operating an interactive K-12 live online educational marketplace places Outschool under heightened
              regulatory scrutiny regarding child online safety, data privacy, and instructor vetting. Federal
              regulations including the Children's Online Privacy Protection Act (COPPA) mandate rigorous consent
              frameworks and restrict personal data collection for minors under 13. To manage child safety liabilities
              across thousands of daily video interactions, Outschool enforces mandatory identity verification and
              criminal background checks for all instructors prior to onboarding, supplemented by required annual
              renewals. The platform maintains a strict two-track enforcement architecture separating Trust & Safety
              strikes from routine policy incidents. While no formal federal enforcement actions or state attorney
              general investigations have been publicly recorded against the company, child safety remains an
              existential operational perimeter where a single catastrophic failure mode could provoke legislative
              sanctions or widespread parent abandonment.
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR013
      - number: '7.2'
        title: Operational Execution, Teacher Quality Dispersion, and Parent Friction
        blocks:
          - type: paragraph
            body: >-
              Outschool's marketplace mechanics create structural quality dispersion across its expansive course
              catalog. While the company reports that over eighty percent of academic subject classes are conducted by
              credentialed teachers, non-academic enrichment and hobby classes rely on independent educators with highly
              variable domain mastery and instructional competence. Because independent instructors define their own
              curricula, lesson plans, and pricing, parents bear the substantial friction of evaluating teacher ratings,
              syllabi, and reviews. Public consumer feedback reflects recurring dissatisfaction with billing
              transparency, cancellation terms, and refund restrictions. Although Outschool offers a Learning Experience
              Pledge to compensate dissatisfied parents with credit vouchers, the policy enforces strict limitations,
              including a three-voucher lifetime cap per family and the total exclusion of classes funded via public
              programs. This quality asymmetry elevates user acquisition costs and accelerates customer churn.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
      - number: '7.3'
        title: Infrastructure Reliance, Payment Rails, and Public Voucher Concentration
        blocks:
          - type: paragraph
            body: >-
              Outschool's technical and commercial architecture relies heavily on critical third-party infrastructure
              providers and specialized channel intermediaries. All live video classroom delivery is conducted through
              platform-provided Zoom links, creating an operational single point of failure where third-party service
              degradation or security breaches directly halt instructional operations. Similarly, consumer payment
              processing is managed through Stripe, exposing platform checkout to payment processor policy shifts. On
              the distribution side, Outschool has expanded into state-funded Education Savings Account (ESA) programs
              through integration with ClassWallet, enabling families to deploy public funding vouchers toward qualified
              classes. However, this channel introduces external policy vulnerability: legislative changes to state
              voucher eligibility, vendor accreditation rules, or public funding caps could abruptly compress enrollment
              volume. Meanwhile, Outschool retains a thirty percent take rate from class sales, creating ongoing
              retention pressure among top-performing independent teachers.
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
      - number: '7.4'
        title: Financial Durability, Leadership Transition, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Following unprecedented demand expansion during the COVID-19 pandemic, Outschool experienced contraction
              as traditional schooling resumed, precipitating significant workforce reductions in June and December 2022
              to realign operating expenses. The company has since adjusted its commercial strategy, reversing an
              unpopular mandatory subscription policy in 2026 to restore à la carte per-class checkout alongside
              credit-based memberships. Furthermore, co-founder Amir Nathoo stepped back from executive leadership in
              February 2026, transitioning day-to-day management to the COO and CTO while an external CEO search
              proceeds. From an investment underwriting perspective, Outschool remains private and opaque, publishing no
              audited metrics on net revenue, gross margin, or cash runway. Primary thesis-break triggers include any
              systemic child safety incident, legislative exclusion from state ESA programs, accelerating teacher
              defection to alternative platforms, or evidence of severe multiple compression from its historic 2021
              three-billion-dollar valuation.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Quality Dispersion and Parent Search Fatigue
            body: >-
              Because Outschool operates as an open marketplace where independent instructors define curricula, pricing,
              and pedagogical methods, educational outcomes vary widely. Unlike structured tutoring services with
              unified curricula, parents bear the ongoing evaluation burden to identify capable teachers, leading to
              elevated refund friction and retention risks.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: Public Funding Vulnerability in State Education Savings Accounts
            body: >-
              Outschool's expansion into state-funded Education Savings Account (ESA) programs via ClassWallet offers
              valuable non-discretionary revenue but introduces legislative concentration. Changes in state eligibility
              rules, curriculum restrictions, or approved vendor policies represent a material external risk that
              platform management cannot directly mitigate.
            calloutType: insight
            claimRefs:
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price Evidence and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The last confirmed financing mark in the assigned evidence is the $3.0B valuation attached to Outschool's
              $110M Series D in October 2021. That historical mark is not a current price. QuantLogix reports a $318M
              secondary-market print dated June 27, 2026 and publishes a $491.12M model estimate as of October 13, 2026,
              84% below the last round. QuantLogix also says no later priced round has tested its estimate. These
              observations support a stretched stance on the legacy mark and a research-more recommendation, but they do
              not establish intrinsic value, a bid, an ask, or cash available to the company.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
      - number: '8.2'
        title: Operating Proof and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The operating evidence shows breadth and visible marketplace activity, not verified economics. Outschool
              displays a 4.9 rating across 1.5 million class reviews and says more than 80% of academic classes are
              taught by credentialed teachers. A sampled provider profile carries 1,636 reviews, while a law-category
              page shows live and self-paced listings across several price points. Outschool.org separately reports more
              than $100M deployed to low-income families and programs designed with more than 40 community organizations
              and state agencies. These are useful adoption and supply signals, but company, affiliated-program, and
              provider-issued pages cannot prove retention, take rate, revenue quality, margins, or cash generation.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario and Comparable Framework
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple valuation is not supportable from this evidence set because Outschool has
              not published revenue and the only revenue figure is GetLatka's $200M estimate for June 2024. The scenario
              table therefore uses observed public marks as decision-reference bands rather than forecasts. The base
              reference corridor is $318M to $491.12M; a bull case can extend toward the $3.0B legacy mark only if
              current audited growth, margins, cohorts, and cash generation justify a re-rating; and the bear case has
              no defensible public floor below the secondary print. No public-company, M&A, or private-round comparable
              in the assigned pool has a sufficiently matched period, metric, and denominator to support a multiple.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
      - number: '8.4'
        title: Exit Readiness and Diligence Gates
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is limited: QuantLogix reports that Outschool remains private and has no public S-1 on
              file. Public evidence also does not disclose the current cap table, liquidation preferences, tender
              history, cash balance, burn, or runway. The learner find-classes URL resolved only to authentication
              controls in the prefetched text, reinforcing that public product surfaces do not close the operating-data
              gap. Before entry, investors should require audited statements, GMV-to-net-revenue reconciliation, family
              and educator cohorts, current capitalization and preference waterfalls, and evidence on safety-policy
              incidence. The thesis breaks if those materials show deteriorating repeat behavior, insufficient runway,
              or preference seniority that impairs junior equity at the observed reference corridor.
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry discipline
            body: >-
              Treat $318M and $491.12M as imperfect price references, not a supported valuation range. Any investment
              decision requires a preference-adjusted return model built from audited economics, current cash and burn,
              verified cohorts, and the fully diluted capitalization table.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
