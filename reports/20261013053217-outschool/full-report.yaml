      - number: '4.2'
        title: Unit Economics and Service Delivery Costs
        blocks:
          - type: paragraph
            body: >-
              The core unit economics of Outschool center on gross marketplace volume (GMV) conversion, where 70% of
              gross class payments flow directly to educators, leaving a 30% gross take rate to cover all platform
              operations. Unlike asynchronous course platforms with near-zero marginal delivery costs, Outschool relies
              on live, synchronous video instruction maintaining an average 4:1 learner-to-teacher ratio, with over 80%
              of academic courses taught by credentialed instructors. Variable service-delivery costs include live video
              streaming infrastructure, payment gateway processing fees (typically 2% to 3% of GMV), and substantial
              trust-and-safety compliance overhead. Outschool enforces a formal two-track educator policy where multiple
              incidents disqualify teachers from promotional badging and lead to unlisting. Because gross margin is
              bounded by the 30% take rate, contribution margins remain sensitive to teacher supply retention, payment
              processing expenses, and customer service resolution costs.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI008
              - CI009
