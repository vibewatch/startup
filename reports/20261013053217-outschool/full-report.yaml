figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of Outschool from 2015 inception through multi-stage venture financing, pandemic
      acceleration, and 2026 platform governance.
    data:
      items:
        - date: '2015'
          label: Inception and Founding
          detail: >-
            Outschool founded in 2015 by Nicholas Grandy and team to provide live online small-group classes for K-12
            learners.
