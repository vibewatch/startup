      - number: '2.3'
        title: Buyer, User, and Payer Dynamics Across Target Segments
        blocks:
          - type: paragraph
            body: >-
              Outschool's commercial velocity is governed by a multi-stakeholder dynamic where the purchaser, consumer,
              and beneficiary often diverge. In the dominant consumer household segment, parents or legal guardians act
              as both the economic buyer and budget owner, while children aged 3 to 18 serve as the daily end users. For
              homeschooling families, who represent the platform's foundational base of recurring daytime volume,
              adoption is triggered by curriculum gaps, specialized high school elective needs, or the desire for
              structured peer socialization without school bureaucracy. For conventional schooling families, adoption
              occurs on evenings and weekends, driven by remedial academic needs, test preparation, or hobby
              exploration. A third emerging segment involves institutional and philanthropic funding, illustrated by
              Outschool.org's historical deployment of $2.4 million in community partner grants and 34,000 learner
              scholarships to expand access among racially and economically marginalized students. Across all buyer
              cohorts, transaction friction is minimized through transparent unbundled pricing, with individual group
              classes frequently priced between $10 and $20 per session.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM011
      - number: '2.4'
        title: Structural Growth Drivers and Long-Term Adoption Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The expansion of Outschool's market opportunity is propelled by secular growth drivers while
              simultaneously constrained by supply-side friction and post-pandemic behavior shifts. Key growth drivers
              include the continued secular rise of flexible homeschooling, parental dissatisfaction with
              one-size-fits-all public school curricula, and educator desire for supplemental income flexibility outside
              traditional classroom constraints. However, serious adoption bottlenecks restrict platform scale. Because
              Outschool operates as an open marketplace rather than a standardized curriculum provider, instructional
              quality, group management, and academic rigor vary widely across individual teachers. To manage
              supply-side risk, Outschool enforces a formal two-track policy governance system featuring separate Trust
              & Safety strike and teacher policy incident tracks, each with a three-count permanent removal threshold.
              Furthermore, Outschool's 30% marketplace commission take rate creates ongoing economic tension between
              platform retention and disintermediation, particularly as independent educators seek to migrate loyal
              student cohorts off-platform to avoid fees.
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace Fragmentation Creates Competing Quality Dynamics
            body: >-
              Outschool's strategic position as an open marketplace enables rapid catalog expansion across 140,000+
              class listings, yet shifts the burden of quality discovery onto parents. Because instructional delivery,
              pricing, and curriculum depth depend on individual independent educators, the platform functions more as a
              decentralized discovery engine than a standardized academic institution.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM014
          - type: callout
            title: Disintermediation and Take-Rate Pressure Threaten Platform Unit Economics
            body: >-
              Outschool's 30% commission take rate represents a significant portion of teacher earnings. In recurring
              1-on-1 tutoring and multi-week cohort classes where educator-parent trust is established early, strong
              economic incentives exist for participants to take instruction off-platform, necessitating strict platform
              communication policies and automated compliance monitoring.
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Categories
        blocks:
          - type: paragraph
            body: >-
              The landscape of K-12 supplementary and alternative education spans live marketplaces, dedicated 1:1
              tutoring services, asynchronous instructional libraries, and status-quo homeschooling networks. Outschool
              differentiates primarily through its open-enrollment group marketplace model, connecting learners aged
              3–18 with independent contractors across more than 140,000 live courses delivered over Zoom. Direct
              competitors like Brighterly contest core elementary subjects such as math and reading through dedicated
              1:1 coaching, while incumbent networks like Wyzant aggregate extensive tutor directories across all grade
              levels. In contrast, asynchronous platforms such as Khan Academy offer free, mastery-based curriculum
              modules but lack synchronous social peer environments. Outschool occupies an intersection between social
              group enrichment and flexible academic tutoring, competing against both structured commercial services and
              parent-organized homeschool co-ops.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
