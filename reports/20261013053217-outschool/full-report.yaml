      - number: '2.2'
        title: Market Sizing Lenses and Constrained TAM/SAM/SOM Boundaries
        blocks:
          - type: paragraph
            body: >-
              Sizing the commercial opportunity for Outschool requires segmenting aggregate global education technology
              forecasts into actionable addressable layers. At the macro layer, broader global education expenditure
              approaches multiple trillions of dollars, within which global EdTech spending was estimated to reach
              approximately $404 billion by 2025 according to market research compiled by Contrary Research. At the
              total addressable market level, the global online K-12 education market was pegged at approximately $8.0
              billion in 2022 and projected to expand to $12.9 billion by 2028 at an 8.3% compound annual growth rate.
              Narrowing this scope to Outschool's serviceable addressable market isolates consumer-paid supplementary
              live instruction, non-accredited homeschool enrichment, and online tutoring across English-speaking and
              international parent demographics, representing roughly $2.0 billion to $3.0 billion in addressable
              consumer spend. Within this perimeter, Outschool's serviceable obtainable market reflects the platform's
              actual net commission take rate, taking 30% commission on booked class revenue. Unaudited industry
              profiles estimate Outschool's historical gross booking run-rates between $100 million and $200 million,
              indicating a realistic obtainable net revenue footprint of $40 million to $70 million without major
              expansion into formal institutional contracting.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
