      - number: '5.2'
        title: Operating Model, Technology Stack & Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >-
              Outschool's technical operating model is structured around a web application architecture that decouples
              catalog management, commerce, and identity from real-time communication infrastructure. Because Outschool
              delegates live synchronous audio and video streaming to Zoom Video Communications, the company avoids the
              high capital and engineering expenditure required to operate custom WebRTC media server meshes, but incurs
              deep architectural and operational dependency on external videoconferencing availability and third-party
              Zoom client software updates. Core transactional systems handle asynchronous classroom interactions, user
              scheduling, multi-timezone calendar coordination, and merchant payment settlement. On the educator side,
              independent teachers configure their own curriculum, syllabi, class durations, and pricing schedules
              within platform parameters, while Outschool enforces secular education standards, pedagogical quality
              criteria, and mandatory background verification before listing approval.
            claimRefs:
