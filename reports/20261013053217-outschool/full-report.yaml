      - number: '4.3'
        title: Public Scale Benchmarks and Private Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Outschool experienced an extraordinary demand surge during the initial 2020 pandemic lockdowns, when
              platform revenue expanded by 30x as homebound families turned to live virtual enrichment. However, the
              subsequent reopening of traditional in-person schooling introduced severe online learning fatigue and
              normalization headwinds. While third-party market trackers estimate Outschool's revenue run-rate at
              approximately $200M in ARR by 2024-2025, the company remains privately held and has not released verified
              GAAP revenue figures, GMV breakdowns, or cohort retention curves. Independent parent reviews from Common
              Sense Media highlight recurring complaints regarding administrative support and billing practices,
              pointing to ongoing friction in consumer family retention that leaves forward revenue durability uncertain
              without management-certified cohort accounting.
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI013
      - number: '4.4'
        title: Capital Adequacy and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Outschool accumulated approximately $230M to $240M in total venture financing across its growth lifecycle,
              culminated by a $110M Series C round in October 2021 led by Tiger Global that valued the business at $3.0B
              post-money. That valuation was established during peak pandemic EdTech market exuberance and has not been
              reaffirmed by any public pricing event or secondary mark since late 2021. For underwriters and prospective
              investors, capital adequacy remains ambiguous: while the platform may approach cash break-even on
              estimated $200M top-line scale, true cash burn, current treasury reserves, and capital runway cannot be
              evaluated without access to private bank accounts and board materials. Institutional microgrants and B2B
              school partnerships offer attractive diversification, but underwriting a growth valuation remains blocked
              pending certified retention cohorts and audited unit contribution statements.
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI010
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Pandemic Growth Normalization and Private Metric Opacity
            body: >-
              While Outschool achieved dramatic 30x expansion during peak 2020 pandemic school closures and reached a
              $3B valuation in 2021, current revenue stability ($200M ARR estimates) cannot be independently validated
              without audited financial disclosures. In-person school resumption and documented consumer billing
              friction present material retention risks.
            calloutType: risk
            claimRefs:
