              - CP013
      - number: '3.2'
        title: Capability and Feature Matrix Across Core Buying Criteria
        blocks:
          - type: paragraph
            body: >-
              Evaluating Outschool alongside key market alternatives reveals sharp operational trade-offs across
              instructional format, curriculum governance, and credentialing. Outschool centers its value proposition on
              live small-group cohorts with a typical 4:1 learner ratio, fostering peer engagement that dedicated 1:1
              providers like Wyzant and Brighterly purposefully exclude. However, Outschool exhibits structural
              limitations in curriculum standardization: classes are authored independently by freelance teachers rather
              than anchored to uniform state educational frameworks. While over 80% of academic classes are led by
              credentialed educators, the platform provides no uniform diagnostic testing or longitudinal progress
              tracking system, requiring parents to independently audit learning outcomes. Conversely, dedicated
              services like Brighterly enforce state standards-aligned curricula, offering greater predictability for
              parents seeking remediated academic gains.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
