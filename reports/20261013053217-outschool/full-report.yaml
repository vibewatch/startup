              current private secondary pricing. Furthermore, divergent customer satisfaction metrics—highlighted by 4.5
              stars on Trustpilot contrasted against 1.8 stars on Sitejabber—indicate lingering friction regarding
              strict refund rules and customer service responsiveness.
            calloutType: risk
            claimRefs:
