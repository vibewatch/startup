  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: Conversion flow of parent booking expenditure through platform take-rate retention and educator disbursements.
    data:
      nodes:
        - label: Parent Class Booking
          detail: Families purchase live classes ($10–$30/class) or multi-week courses ($100–$200+).
        - label: Gross Merchandise Volume (GMV)
          detail: Aggregated gross transaction volume processed through Outschool platform payments.
        - label: Platform Take Rate (30%)
          detail: Outschool retains contractual 30% marketplace commission on completed bookings.
        - label: Educator Net Earnings (70%)
          detail: Independent vetted teachers receive remaining 70% share of class tuition fees.
        - label: Cost of Service Delivery
          detail: Platform absorbs payment gateway processing fees, video infrastructure, and trust-and-safety overhead.
        - label: Net Platform Contribution
          detail: Residual operating contribution supporting corporate SG&A, product R&D, and marketing.
    approximationNotes: >-
      Commission take-rate is documented; service delivery hosting and payment processing costs are unseparated in
      public reports.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI009
  - id: FE001
    title: Outschool Product Architecture and Service Delivery Stack
    type: stack
    summary: Layered representation of Outschool's functional architecture, from presentation to underlying infrastructure.
    data:
      layers:
        - label: Learner & Family Experience Layer
          detail: Web portals and native mobile clients providing catalog discovery, enrollment, and classroom entry
        - label: Teacher Operations & Curriculum Studio
          detail: Educator tools for class listing creation, pricing configuration, syllabus setup, and roster management
        - label: Marketplace Search & Scheduling Engine
          detail: Search algorithms, age and subject filtering, multi-timezone calendar scheduling, and review aggregation
        - label: Classroom Orchestration & Messaging Layer
          detail: Zoom meeting room dispatch, roster verification, and asynchronous Outschool Classroom messaging
        - label: Trust, Safety & Governance Layer
          detail: Two-track strike/incident engine, mandatory educator background checks, and secular content moderation
        - label: Core Transactional & Payments Rails
          detail: Consumer credit card checkout, merchant transaction settlement, and weekly PayPal teacher payouts
    approximationNotes: >-
      Logical architectural layering based on public platform functionality, support documentation, and published
      executive disclosures.
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE009
