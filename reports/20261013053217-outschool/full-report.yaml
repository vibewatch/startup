  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform Definition & Delivery Workflows
        blocks:
          - type: paragraph
            body: >-
              Outschool delivers an interactive online education marketplace targeted at K-12 learners aged 3 to 18,
              connecting families with independent instructors across more than 140,000 live and asynchronous class
              listings. The primary customer workflow centers on small-group synchronous video sessions maintained at
              low student-to-teacher ratios, complemented by individual private tutoring sessions, multi-week academic
              cohorts, seasonal camps, and asynchronous 'Flex' classes hosted within the proprietary Outschool
              Classroom. Rather than producing or mandating proprietary curriculum directly, Outschool functions as an
              orchestration layer that manages class catalog discovery, learner enrollment, payment processing,
              background screening, and live video room dispatch. Live instructional delivery relies directly on deep
              Zoom integration, where learners join authenticated sessions directly from their web or mobile schedule
              dashboards.
            claimRefs:
