              - CI013
          - type: callout
            title: B2B and Public Microgrant Channel Diversification
            body: >-
              Outschool's partnerships with school districts, community organizations, and state educational agencies
              represent a strategic hedge against direct-to-consumer churn. With Outschool.org deploying over $100M in
              public and private education funds, institutional microgrants offer a pathway to recurring, subsidized
              enrollment.
            calloutType: insight
            claimRefs:
