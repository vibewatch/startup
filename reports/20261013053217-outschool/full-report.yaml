              - CP007
              - CP008
      - number: '3.3'
        title: Pricing Structure, Take Rates, and Customer Economics
        blocks:
          - type: paragraph
            body: >-
              Pricing models across the online learning ecosystem dictate user adoption velocity and customer lifetime
              value. Outschool operates a hybrid monetization framework combining à la carte class purchases with
              monthly credit subscription plans ranging from $40 for 80 credits up to $240 for 500 credits. Group live
              classes typically cost between $5 and $36 per session, positioning Outschool significantly below the $24
              to $58 per session charged for private 1:1 tutoring and well beneath Wyzant's $35 to $80 hourly rates.
              Outschool monetizes by taking a 30% commission on teacher class fees while charging parents a separate
              marketplace service fee at checkout. Tutors retain 70% of gross fees, creating a revenue engine that
              external analysts estimate generated approximately $200 million in annual platform revenue as of 2024
              against its historical $3 billion venture valuation.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Outschool faces meaningful long-term durability hurdles stemming from low barrier to exit and supply-side
              vulnerability. Because families transact either on a pay-per-class basis or via flexible monthly credit
              subscriptions without long-term annual contracts, switching costs remain minimal. Furthermore, educators
              are independent contractors rather than exclusive employees, creating chronic platform multi-homing
              incentives across Preply, Wyzant, and direct private tutoring to avoid Outschool's 30% take rate. To
              maintain marketplace integrity, Outschool enforces a two-track disciplinary protocol with three-count
              removal thresholds separating Trust & Safety strikes from professional incidents. Nonetheless, public
              customer reviews highlight friction regarding credit accounting complexity and inconsistent instructional
              quality, indicating that Outschool network effects remain susceptible to localized disintermediation and
              specialized vertical tutoring competitors.
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Teacher Multi-Homing and Supply Disintermediation
            body: >-
              Outschool extracts a 30% commission from independent teachers while enforcing strict two-track
              disciplinary procedures. Because educators operate as contractors without platform exclusivity, popular
              tutors face persistent economic incentives to transition established student relationships off-platform or
              multi-home on competing marketplaces like Wyzant and Preply.
            calloutType: risk
            claimRefs:
              - CP010
              - CP014
          - type: callout
            title: Enrichment Niche Shields Outschool From Asynchronous Free Substitutes
            body: >-
              While free and low-cost asynchronous platforms like Khan Academy and Chegg dominate core academic practice
              and homework help, Outschool protects its market wedge through live socialization and niche
              interest-driven topics that automated or static curricula cannot replicate.
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Outschool operates primarily as a two-sided marketplace for live online K-12 supplemental education,
              monetizing consumer demand through a contractual 30% platform take rate deducted from teacher class
              earnings. Independent instructors set their own listing prices, which typically range between $10 and $30
              per single live class, while multi-week semester programs and intensive academic bootcamps frequently
              command prices exceeding $100 to $200 per enrolled learner. Beyond consumer family billing, Outschool has
              expanded into institutional distribution through school district contracts, employer-sponsored family
              benefits, and state-administered education savings account (ESA) microgrants. Outschool.org, the
              platform's non-profit partner, has deployed over $100M across public and private initiatives, establishing
              subsidized unit cost benchmarks between $150 and $225 per student. However, realized pricing and net take
              rates face downward pressure from satisfaction refund policies and consumer billing friction.
            claimRefs:
