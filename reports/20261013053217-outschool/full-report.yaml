      - number: '1.3'
        title: Capitalization History, Operational Trajectory, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Outschool achieved rapid expansion during the COVID-19 pandemic as global school disruptions drove massive
              demand for virtual small-group instruction, culminating in Series C and Series D financings that valued
              the business at $3.0B in late 2021. Third-party analyst estimates from GetLatka project 2024 annual
              revenue at approximately $200M alongside a LinkedIn-reported headcount of roughly 1,540 individuals,
              though management has not publicly audited or confirmed either metric. Consumer sentiment reflects a
              bifurcated experience: Outschool maintains a 4.5 out of 5-star rating on Trustpilot across 3,210 parent
              reviews, but registers an adverse 1.8 out of 5-star score on Sitejabber driven by customer service and
              strict refund policy grievances. Substantive diligence requires access to audited financial statements,
              actual gross merchandise value (GMV) to net revenue bridges, and verified retention cohorts.
            claimRefs:
              - CO003
              - CO006
              - CO011
              - CO012
              - CO014
