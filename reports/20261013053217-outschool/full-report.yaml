  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Outschool occupies a specialized segment of the broader K-12 education technology landscape, centering on
              synchronous, small-group live online instruction, private 1-on-1 tutoring, and interest-led
              extracurricular enrichment rather than accredited full-time schooling. The platform's target spend
              consists of discretionary household after-school enrichment budgets, homeschool supplemental curriculum
              expenditures, private tutoring allowances, and microgrant or community-subsidized enrichment programs.
              Conversely, standard core public school tax allocations, state per-pupil funding formulas, mandatory
              enterprise district instructional adoptions, and accredited degree-granting secondary tuitions are
              excluded from Outschool's primary addressable monetization boundary. Parents and caregivers turn to
              Outschool to solve specific instructional deficits that conventional classrooms cannot address flexibly,
              such as niche topics, advanced high school writing workshops, competitive debate, or foreign languages.
              However, the platform faces constant competition from established status-quo alternatives, ranging from
              free asynchronous video repositories like Khan Academy to neighborhood sports leagues, local community
              center programs, and brick-and-mortar tutoring centers such as Kumon and Mathnasium.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
