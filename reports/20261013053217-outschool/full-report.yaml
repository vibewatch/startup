      - number: '1.2'
        title: Executive Leadership, Educator Standards, and Stakeholder Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Outschool is led by co-founder and Chief Executive Officer Nicholas Grandy, who has guided the
              organization from its early participation in Y Combinator through its multi-stage venture financing
              rounds. The marketplace relies on tens of thousands of independent contractors rather than salaried
              instructional staff, creating a key operational dependency on community trust, pedagogical quality, and
              instructor compliance. To govern educator conduct, Outschool enforces a formal two-track disciplinary
              framework with independent three-strike thresholds separating Trust & Safety violations from professional
              quality incidents. External institutional stakeholders include early accelerator Y Combinator,
              growth-stage venture syndicates, philanthropic foundation partners, and municipal public school districts
              collaborating on targeted literacy initiatives.
