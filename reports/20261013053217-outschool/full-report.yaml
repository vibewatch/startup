      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace Asymmetry and Supply Governance
            body: >-
              Outschool's commercial leverage stems from its 30% take rate and catalog of over 140,000 classes, yet its
              reliance on independent contractors creates significant governance vulnerabilities. Because instructors
              design their own curricula and bear business risk, the platform must enforce strict disciplinary strike
              systems to maintain parent trust without triggering contractor reclassification disputes.
            calloutType: insight
            claimRefs:
