  topStrengths:
    - Large and visible marketplace footprint with more than 140,000 classes and 1,000,000+ learners served.
    - Clear monetization model with a 30% take rate and repeatable marketplace economics.
    - Additional distribution and mission credibility through Outschool.org and partner-funded programming.
  topRisks:
    - Private financials remain opaque, including revenue quality, GMV-to-net-revenue bridge, margins, cash, and runway.
    - Marketplace quality and retention depend on independent educators, creating churn and multi-homing risk.
    - Child-safety, regulatory, and infrastructure dependencies remain material for a live video marketplace.
  unresolvedGaps:
    - Management-certified 2024-2026 revenue, GMV-to-net-revenue bridge, gross margin, cash balance, burn, and runway.
    - Current retention cohorts, repeat-booking behavior, refund rates, and customer concentration.
    - Current cap table, liquidation preferences, secondaries, and any post-2021 price-setting event or internal mark.
    - Current headcount and concentration across institutional, ESA, and other non-consumer channels.
