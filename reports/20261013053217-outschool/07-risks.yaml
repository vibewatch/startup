callouts:
  - calloutType: risk
    title: Platform Quality Dispersion and Parent Search Fatigue
    body: Because Outschool operates as an open marketplace where independent instructors define curricula, pricing, and pedagogical methods, educational outcomes vary widely. Unlike structured tutoring services with unified curricula, parents bear the ongoing evaluation burden to identify capable teachers, leading to elevated refund friction and retention risks.
    claimRefs:
      - CR004
      - CR005
  - calloutType: insight
    title: Public Funding Vulnerability in State Education Savings Accounts
    body: Outschool's expansion into state-funded Education Savings Account (ESA) programs via ClassWallet offers valuable non-discretionary revenue but introduces legislative concentration. Changes in state eligibility rules, curriculum restrictions, or approved vendor policies represent a material external risk that platform management cannot directly mitigate.
    claimRefs:
      - CR008
