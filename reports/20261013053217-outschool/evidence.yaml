evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Snapshot KPI table private financial performance
    missingEvidence: >-
      Audited financial statements, certified 2024–2026 revenue run rate, gross margin, operating cash burn, and
      GMV-to-net-revenue bridge.
    whyItMatters: >-
      Without certified financial data, valuation multiples and commercial sustainability cannot be underwritten
      independently.
    diligencePath: >-
      Request management presentation, audited P&L, and financial disclosures under non-disclosure agreement during
      private investment review.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table and Stakeholder or investor map enumeration
    missingEvidence: >-
      Complete historical cap table, board of directors roster, secondary share transaction logs, and teacher cohort
      retention curves.
    whyItMatters: >-
      Partial governance and stakeholder visibility limits analysis of investor control rights, teacher churn, and board
      composition.
    diligencePath: Review certified cap table, investor rights agreements, and comprehensive HR/board directory from company records.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: post-pandemic-cohort-retention
    missingEvidence: >-
      Audited post-2023 customer cohort retention curves, family repeat booking frequencies, and net revenue retention
      disclosures.
    whyItMatters: >-
      Without certified cohort data, investors cannot verify whether pandemic-era customer scale has stabilized or if
      user churn has eroded booking volumes.
    diligencePath: >-
      Request confidential cohort retention tables segmented by student age group, subject category, and acquisition
      year in private diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: take-rate-disintermediation
    missingEvidence: >-
      Quantitative telemetry measuring tutor and family off-platform communication, disintermediation frequency, and
      churn to private payment rails.
    whyItMatters: >-
      A 30% marketplace rake creates continuous incentives for private tutoring clients to bypass the platform once
      teacher relationships are established.
    diligencePath: >-
      Review internal platform communication audit logs, repeat booking drop-offs after initial sessions, and teacher
      tenure metrics under NDA.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-churn
    missingEvidence: >-
      Audited family repeat enrollment rates, student cohort retention curves, and teacher cross-platform retention data
      comparing pre- and post-membership rollout.
    whyItMatters: >-
      Understanding whether Outschool credit subscription improved family LTV or accelerated churn is essential for
      evaluating long-term moat durability against 1:1 tutoring alternatives.
    diligencePath: >-
      Request historical monthly cohort retention tables, churn rates by course category, and teacher multi-homing
      survey metrics from company management.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: competitor-headcount-scale
    missingEvidence: Independent verification of competitor and Outschool operational headcounts and active teacher supply figures.
    whyItMatters: >-
      Discrepancies between public professional network profiles (1,500+ listed associates) and primary venture
      disclosures (107 full-time staff) obscure operational overhead and organizational efficiency.
    diligencePath: Obtain certified payroll reports and contractor 1099 volume breakdowns directly from diligence dataroom.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: private-financial-metrics
    missingEvidence: Audited financial statements, income statements, and management-certified gross margin figures for 2024-2026.
    whyItMatters: >-
      Without certified GAAP financials, true gross margin, contribution margin after video and payment processing
      costs, and operating profitability cannot be independently underwritten.
    diligencePath: >-
      Request audited financial statements, historical income statements, and management accounts under NDA during
      confirmatory diligence.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cohort-retention-dynamics
    missingEvidence: Cohort-level learner retention data, customer acquisition costs (CAC), and payback period metrics.
    whyItMatters: >-
      Post-COVID class fatigue and normal school resumption present severe retention risks that require granular cohort
      LTV/CAC data to evaluate marketplace sustainability.
    diligencePath: Request family cohort retention curves, repeat booking rates, and marketing spend attribution from management.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-balance-and-runway
    missingEvidence: Current cash on hand, monthly net cash burn rate, and capital runway as of 2026.
    whyItMatters: >-
      Determining whether Outschool is cash-flow self-sustaining or dependent on forward equity financing requires
      verified treasury balances.
    diligencePath: Obtain bank account balance confirmations, 24-month cash flow forecasts, and board deck financial exhibits.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer platform documentation, API schemas, open-source repositories, or developer portal metrics for
      Outschool software integrations.
    whyItMatters: >-
      Without public API documentation or developer tools, technical assessment of third-party integration capabilities
      and programmatic extensibility cannot be verified.
    diligencePath: >-
      Request engineering architecture documentation, internal API specifications, and developer ecosystem roadmaps
      during management diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Audited cohort retention data, repeat booking rates, and Net Revenue Retention (NRR) for direct-to-consumer and
      ESA-funded families.
    whyItMatters: >-
      Without retention and churn data, it is impossible to evaluate customer lifetime value or assess post-pandemic
      platform durability.
    diligencePath: >-
      Request management cohort metrics bridging initial course bookings to annual repeat purchase and subscription
      membership retention.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive registry of public school district contracts, charter school partnerships, and institutional
      contract values.
    whyItMatters: >-
      Public case studies highlight isolated pilots (e.g. CCSD 59-learner cohort), leaving the commercial scale and
      renewal rate of institutional B2B sales unverified.
    diligencePath: >-
      Obtain state procurement records and Outschool.org district contract schedules detailing recurring institutional
      billings.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: minor
    topic: esa-channel-concentration
    missingEvidence: >-
      Breakdown of gross bookings derived from state Education Savings Account (ESA) vouchers versus direct household
      out-of-pocket credit card payments.
    whyItMatters: Expansion into 19+ ESA states creates dependency on state voucher regulations and public education policy shifts.
    diligencePath: >-
      Request state-level payment processor reporting indicating the percentage of GMV processed via ESA wallet
      providers.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: financial-burn-and-revenue-durability
    missingEvidence: >-
      Audited financial statements, current annual cash burn, GMV-to-net-revenue bridge, and gross margin figures for
      fiscal years 2024 through 2026.
    whyItMatters: >-
      Without verified cash runway and gross margins, underwriting Outschool's post-pandemic durability or remaining
      capital from its $110M Series D is impossible.
    diligencePath: >-
      Request management presentation containing audited income statements, cash balances, and unit economics during
      confirmatory diligence.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: minor
    topic: esa-channel-revenue-concentration
    missingEvidence: >-
      Breakdown of gross merchandise value (GMV) derived from state Education Savings Accounts (ESA) versus direct
      consumer credit card billing.
    whyItMatters: >-
      High reliance on state-subsidized programs creates policy-dependent revenue volatility that could quickly reverse
      if state voucher statutes shift.
    diligencePath: >-
      Analyze payment processor transaction volume reports segmented by ClassWallet and direct credit card merchant
      accounts.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited revenue, GMV-to-net-revenue reconciliation, gross margin, contribution margin, cash, burn, runway, and
      working-capital schedules for 2024-2026.
    whyItMatters: >-
      The available price observations cannot establish intrinsic value or target returns without verified operating and
      liquidity inputs.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank evidence, and a finance-leader reconciliation under
      NDA.
    relatedQuestionRefs:
      - QV002
      - QV004
      - QV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      Current fully diluted cap table, option and warrant schedules, secondary-transfer history, and the complete
      liquidation-preference waterfall.
    whyItMatters: Preference seniority and dilution determine junior-equity recovery and price-sensitive return outcomes.
    diligencePath: >-
      Review the charter, investor-rights agreements, capitalization ledger, board approvals, and preference-adjusted
      exit waterfall with counsel.
    relatedQuestionRefs:
      - QV005
      - QV007
  - type: missing-source
    severity: material
    topic: comparable-transactions
    missingEvidence: >-
      Period-matched public-company, private-round, and M&A comparables with consistent revenue definitions, growth,
      margins, and transaction dates.
    whyItMatters: A credible multiple requires comparable metric definitions and periods; the assigned pool does not supply them.
    diligencePath: >-
      Build a transaction set from filings and deal announcements after management supplies a verified Outschool
      financial denominator.
    relatedQuestionRefs:
      - QV006
