chapter:
  number: 6
  title: "Customers"
  summary: "Outschool operates a dual-sided live learning marketplace serving over 1.5 million families and 900,000 learners globally across 140,000 teacher-led classes, while expanding into public K-12 district tutoring and state-funded Education Savings Account programs. While customer engagement is supported by strong ratings across high-volume teaching storefronts, lack of reported retention metrics, cohort churn rates, and customer concentration data creates diligence ambiguity."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Segmentation and Buyer-Payer Dynamics"
    body: "Outschool segments its customer base across direct-to-consumer household families, neurodivergent student cohorts, and institutional public school partnerships. In the primary direct-to-consumer segment, parents and caregivers act as the financial payers while school-age children between ages 3 and 18 are the active daily users. This consumer base splits into two primary use cases: traditional homeschooling families who rely on Outschool for core subject instruction like algebra and English, and supplemental enrichment families seeking interest-driven topics such as foreign languages or creative arts. In addition, Outschool captures specialized learner demand through small-group formats tailored for students with ADHD and Orton-Gillingham instruction for dyslexia. On the institutional front, Outschool.org partners with public school districts to deploy small-group virtual tutoring for underperforming students, creating a dual-channel buyer landscape where public grant funding and state Education Savings Accounts increasingly supplement private household credit card spending."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-scale-metrics"
    title: "Adoption Trajectory and Platform Scale"
    body: "Since its founding in 2015, Outschool has demonstrated significant cumulative scale, reaching more than 1.5 million families and over 900,000 learners across global markets. The catalog has expanded to encompass more than 140,000 live online classes maintaining an average student-to-teacher ratio of 4:1. This expansion was accelerated by post-pandemic changes in alternative schooling, with homeschooling rates more than doubling over five years and 36% of reporting states reaching peak homeschool enrollment in 2024-2025. Demand is further reinforced by legislative tailwinds, as more than 19 states now offer Education Savings Accounts that provide direct state vouchers for tutoring and online tuition. However, public disclosures emphasize cumulative lifetime metrics rather than active annual transacting families. Independent market aggregators estimate 2024 revenue at $200 million, but Outschool does not publish audited financials, gross bookings bridges, or active recurring user counts."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-customer-deployments-and-institutional-proof"
    title: "Named Customer Proof and Educational Outcomes"
    body: "Named reference proof on Outschool spans both institutional public school district engagements and prominent independent educator organizations. In the institutional sector, Outschool.org partnered with the Charleston County School District (CCSD) in South Carolina to deliver an 11-week virtual tutoring intervention for 59 elementary learners in the Kaleidoscope afterschool program. Bi-weekly 90-minute tutoring sessions resulted in 100% of participants demonstrating growth on iReady math assessments (with 79% increasing scores by 10 or more points) and 76% showing reading growth, prompting CCSD to expand Outschool tutoring into its Turnaround Schools. On the marketplace supply side, individual teacher storefronts demonstrate deep customer volume; for example, Teacher Jade's Writing Academy has accumulated 1,636 reviews with a 4.9 average rating across multi-week writing curricula, while specialized law and logic courses by certified instructors command per-session pricing between $10 and $40 with high satisfaction marks."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-governance-risks"
    title: "Customer Journey, Retention Durability, and Supply Risk"
    body: "The customer journey on Outschool progresses from top-of-funnel discovery through interest-based search, small-group class participation, and expansion into tutoring and multi-week curriculum bundles. To support personalized discovery across its catalog of over 100,000 classes, Outschool deployed Twilio Segment's customer data platform, combining onboarding survey data with demographic and behavioral tracking to automate class recommendations and save an estimated 3,000 engineering hours annually. While the platform boasts 1.5 million class reviews averaging 4.9 out of 5 stars, customer retention durability remains subject to critical diligence gaps. Outschool does not disclose net revenue retention, annual customer churn, or repeat booking cohorts. Furthermore, learner satisfaction and platform safety depend heavily on marketplace supply governance, where Outschool enforces a strict two-track disciplinary system consisting of Trust & Safety strikes and teacher policy incidents to restrict or remove non-compliant educators."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
