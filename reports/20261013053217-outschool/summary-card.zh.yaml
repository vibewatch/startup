  topStrengths:
    - 市场规模和可见度都较高，已开设超过 140,000 门课程，服务过 1,000,000+ 名学习者。
    - 变现模式清晰，抽成率为 30%，市场经济模型具备可复制性。
    - Outschool.org 和合作伙伴资助的项目进一步扩大分发能力，也增强了使命叙事的可信度。
  topRisks:
    - 私有财务仍不透明，收入质量、GMV 到净收入的桥接、利润率、现金和现金跑道都缺乏披露。
    - 市场质量和留存依赖独立教育者，因而面临流失和多平台经营风险。
    - 对直播视频市场而言，儿童安全、监管和基础设施依赖仍是重大风险。
  unresolvedGaps:
    - 管理层认证的 2024-2026 年收入、GMV 到净收入的桥接、毛利率、现金余额、烧钱速度和现金跑道。
