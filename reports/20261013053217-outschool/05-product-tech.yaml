callouts:
  - calloutType: "risk"
    title: "Critical External Dependency on Zoom Video Infrastructure"
    body: "Outschool does not own or operate a proprietary live video streaming media network; all synchronous interactive sessions rely on Zoom Video Communications infrastructure. This design drastically reduced initial infrastructure overhead but creates a single point of failure where third-party Zoom platform disruptions directly interrupt core service delivery."
    claimRefs:
      - "CE006"
      - "CE007"
  - calloutType: "strength"
    title: "Structured Two-Track Trust & Safety Governance"
    body: "By formalizing a decoupled two-track system—separating non-expiring Trust & Safety strikes from one-year pedagogical incidents—Outschool protects minor learner safety while providing transparent procedural governance for independent educators."
    claimRefs:
      - "CE009"
      - "CE010"
