chapter:
  number: 5
  title: "Product & Technology"
  summary: "Outschool operates a video-first learning marketplace connecting K-12 students with independent educators across live small-group, 1:1 tutoring, and asynchronous formats. The architecture depends heavily on Zoom Video Communications infrastructure, custom scheduling and payment routing, and a rigorous two-track Trust & Safety enforcement engine, while lacking public developer APIs or proprietary synchronous video infrastructure."
sections:
  - id: "core-platform-and-service-delivery"
    title: "Core Platform Definition & Delivery Workflows"
    body: "Outschool delivers an interactive online education marketplace targeted at K-12 learners aged 3 to 18, connecting families with independent instructors across more than 140,000 live and asynchronous class listings. The primary customer workflow centers on small-group synchronous video sessions maintained at low student-to-teacher ratios, complemented by individual private tutoring sessions, multi-week academic cohorts, seasonal camps, and asynchronous 'Flex' classes hosted within the proprietary Outschool Classroom. Rather than producing or mandating proprietary curriculum directly, Outschool functions as an orchestration layer that manages class catalog discovery, learner enrollment, payment processing, background screening, and live video room dispatch. Live instructional delivery relies directly on deep Zoom integration, where learners join authenticated sessions directly from their web or mobile schedule dashboards."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
  - id: "architecture-and-infrastructure-dependencies"
    title: "Operating Model, Technology Stack & Infrastructure Dependencies"
    body: "Outschool's technical operating model is structured around a web application architecture that decouples catalog management, commerce, and identity from real-time communication infrastructure. Because Outschool delegates live synchronous audio and video streaming to Zoom Video Communications, the company avoids the high capital and engineering expenditure required to operate custom WebRTC media server meshes, but incurs deep architectural and operational dependency on external videoconferencing availability and third-party Zoom client software updates. Core transactional systems handle asynchronous classroom interactions, user scheduling, multi-timezone calendar coordination, and merchant payment settlement. On the educator side, independent teachers configure their own curriculum, syllabi, class durations, and pricing schedules within platform parameters, while Outschool enforces secular education standards, pedagogical quality criteria, and mandatory background verification before listing approval."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "trust-safety-and-compliance-mechanisms"
    title: "Trust, Safety, Security & Compliance Controls"
    body: "Given its core demographic of minor learners aged 3 to 18, Outschool's technical differentiation and operational defensibility hinge heavily on learner safety controls, identity verification, and platform integrity enforcement. The company maintains an explicit two-track enforcement architecture separating Trust & Safety strikes from teacher policy incidents, each governed by an independent three-count removal threshold. Track 1 monitors safety, privacy, security, and severe community concerns; strikes on this track do not expire and trigger permanent educator debarment upon reaching three active counts. Track 2 addresses professional conduct, pedagogical quality, and listing compliance, issuing incidents that expire after one calendar year. Severe safety violations immediately bypass progressive discipline, triggering immediate account termination and permanent blacklisting. In addition to consumer marketplace moderation, Outschool's non-profit arm Outschool.org coordinates public-agency and philanthropic education programs, deploying structured tutoring and literacy interventions across community-based organizations."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
