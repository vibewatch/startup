  rows:
  - - Blue Energy deployment platform
    - Large-load customer / infrastructure sponsor
    - Publicly framed; not yet operating
    - Project-finance plus prefabrication plus sequencing
    - How much value capture sits here vs with partners?
  - - Blue Way prefabrication and logistics
    - Developer, EPC, site team
    - Concept publicly described; throughput undisclosed
    - Offsite fabrication, transportation, super modules assembly
    - Which shipyards or fab yards are contracted and at what capacity?
  - - Gas-bridge power phase
    - Customer needing early power
    - Roadmapped for Texas; economics undisclosed
    - Earlier energization before nuclear conversion
    - What contract form applies during gas phase?
  - - BWRX-300 nuclear island
    - Customer / regulator / lender
    - Partner reactor path selected
    - Commercially available fuel and modular construction narrative
    - What exact scope sits with GEH vs Blue Energy?
  - - Regulatory sequencing package
    - Regulator / lender / development team
    - Active; topical report accepted
    - Construction order innovation may improve financeability
    - How portable is the NRC logic to actual site approvals?
  - - Integrated monopile IP
    - Engineering / siting team
    - Issued patent as of 2026-08-18
    - Suggests proprietary infrastructure architecture beyond vendor hardware
    - How directly does the patent map to the Texas project?
  notes: The public product is a stack of assets and methods, not a single off-the-shelf reactor SKU.
