- id: differentiation-roadmap-and-peer-benchmarks
  title: Differentiation, roadmap, and peer benchmarks
  body: |-
    The clearest way to understand Blue Energy's product maturity is to compare it with peers. Kairos is building maturity through Hermes and Hermes 2 test reactors, with explicit TRISO-fuel, HALEU, and steam-cycle learning steps under NRC construction permits. Holtec presents a more conventional light-water product. TerraPower emphasizes storage-enabled grid response. X-energy emphasizes electricity plus industrial steam. Against that landscape, Blue Energy stands out by prioritizing deployment around partner hardware instead of foregrounding a dedicated reactor test program.

    That strategy has benefits and costs. The benefit is that Blue Energy may avoid some of the technical and capital burden of inventing and separately de-risking its own reactor. The cost is that more of the company's differentiation has to come from architecture, logistics, financing, and schedule discipline. Public roadmap evidence so far supports milestone-level progress—NRC pre-application work, the BE-BOPTR-02 path, GE agreements, and public date markers for 2027, 2030, and 2032—but not detailed engineering-release transparency.

    Investors should therefore benchmark Blue Energy less against raw reactor novelty and more against proof that its sequencing and construction thesis can mature faster than peers' test-reactor or utility-style pathways. The product-tech question is not only 'is the reactor credible?' It is 'is the delivery system credibly becoming industrial?'.
