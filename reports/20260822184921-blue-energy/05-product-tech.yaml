chapter:
  number: 5
  title: Product & Tech
  summary: Blue Energy's product is a systems-level deployment platform that combines partner reactor hardware, GE gas turbines, regulatory sequencing, and offsite fabrication into a phased power-delivery model. Public evidence supports a credible architecture thesis and an emerging infrastructure-IP signal via the newly issued integrated-monopile patent, but operating detail, manufacturing throughput, and cyber/control disclosures remain thin.
sections:
- id: product-definition-and-asset-map
  title: Product definition and asset map
  body: |-
    Blue Energy's product is best understood as a deployment platform for financeable nuclear power plants, not as a single reactor SKU. The public materials consistently emphasize project finance, prefabrication, logistics, and compatibility with leading reactor technology. That makes the unit of analysis a power-plant system: site, hardware stack, sequencing plan, and customer outcome, rather than only a reactor core.

    The visible asset set reflects that orientation. Blue Energy's public product includes the Texas flagship site path, the Blue Way prefabrication model, the gas-plus-nuclear architecture, the regulatory sequencing strategy, and the partner hardware selection built around GE Vernova gas turbines and the BWRX-300. Put differently, the company is packaging development know-how, physical architecture, and counterparties into a productized deployment motion.

    This framing is strategically important because it explains why Blue Energy can look differentiated without inventing a new reactor. The company is trying to standardize how a large nuclear-backed power asset is assembled, financed, and delivered. If it succeeds, that could be commercially valuable even if much of the reactor science sits with partners.
