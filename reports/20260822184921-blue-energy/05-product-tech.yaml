- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Qualified site and infrastructure envelope
    - Provides land, transmission, pipelines, water or waterfront access, and fiber
    - Port / local counterparties / customer site needs
    - Site mismatch can break the whole product
  - - GE 7HA.02 gas turbines
    - Provide early power before nuclear conversion
    - GE Vernova supply and integration
    - Gas phase may become sticky if nuclear slips
  - - BWRX-300 units
    - Provide later nuclear baseload output
    - GE Vernova Hitachi reactor program
    - Partner schedule and licensing exposure
  - - Regulatory sequencing / BE-BOPTR-02
    - Allows balance-of-plant and non-nuclear scope to advance earlier
    - NRC acceptance and later permit portability
    - May not eliminate all site-specific licensing risk
  - - Offsite fabrication and super modules
    - Intended to compress schedule and improve repeatability
    - Shipyard / fab-yard quality and logistics execution
    - Manufacturing throughput undisclosed
  - - Operations, maintenance, and refueling
    - Long-life support after commissioning
    - Staffing, vendor support, outage planning
    - Public operating details largely undisclosed
  notes: The architecture is more supply-chain and sequencing dependent than a standalone reactor brochure implies.
