- id: architecture-workflow-and-deployment-model
  title: Architecture, workflow, and deployment model
  body: |-
    At a high level, Blue Energy's public architecture is a phased infrastructure stack. A large-load customer need and qualified site come first. Early non-nuclear development and gas-turbine energization follow. The BWRX-300 nuclear island then comes online later as the long-duration baseload anchor. Blue Energy's materials explicitly tie this sequence to earlier time-to-power and better financeability.

    The Blue Way is the core operating concept tying these layers together. In Blue Energy's own framing, it means offsite prefabrication, transportation, and super-module assembly to improve schedule, cost, and execution certainty. The BWRX-300 path matters because GE says the reactor uses commercially available fuel, reduced material intensity, and modular/open-top construction methods that in principle support faster deployment. Blue Energy's product claim is therefore partly a construction-method claim.

    What is still missing is lifecycle-operating detail. The public record says much more about how Blue Energy intends to build than about how it will maintain, refuel, monitor, or staff deployed plants over decades. For diligence, that silence is important: infrastructure products live or die on operations as much as on first build.
