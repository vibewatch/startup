- id: capability-trust-and-channel-comparison
  title: Capability, trust, and channel comparison
  body: |-
    Blue Energy's strongest comparative feature is not a superior reactor datasheet. It is the combination of named AI-load demand, project-finance framing, phased gas-to-nuclear sequencing, and shipyard-style logistics. That package is designed to win on time to power and financing pragmatism rather than on thermodynamic novelty. The trade-off is that Blue Energy inherits concentration on GE Vernova hardware and must prove that its sequencing thesis survives scrutiny from customers, regulators, and lenders.

    By contrast, NuScale and Holtec compete with simpler trust narratives. Both are built on light-water familiarity and conventional fuel forms, and both foreground regulatory progress in public materials. TerraPower and X-energy have stronger technology distinctiveness, but they also carry higher fuel or FOAK complexity through HALEU or TRISO-linked pathways. Kairos and Oklo sit somewhere in the middle: their corporate-demand channels look commercially relevant, yet their technology and execution paths still carry substantial first-of-a-kind risk.

    For buyers, that means vendor choice is likely to hinge on which constraint is most painful. If the pain is AI-scale power timing, Blue Energy, Oklo, and Kairos look most relevant. If the pain is industrial steam or coal-replacement grid flexibility, X-energy and TerraPower gain relevance. If the pain is lender comfort with standard fuel and well-understood licensing norms, NuScale and Holtec may have an edge. Blue Energy therefore has a credible wedge, but not a monopoly on the problem definition.
