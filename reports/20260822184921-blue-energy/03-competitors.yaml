- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Crusoe plus GE Vernova create a differentiated stakeholder stack
    - Customer or partner concentration could turn one flagship into one point of failure
    - High
    - Request contract scope, termination rights, and contingency plans if either partner slips
  - - Shipyard logistics and phased construction shorten time to power
    - Peers or incumbents could copy sequencing ideas, and schedule complexity may offset the claimed edge
    - High
    - Request independent schedule model and lender feedback on the gas-to-nuclear bridge
  - - Blue Energy targets a bigger AI-campus wedge than many peers
    - A larger site ambition can magnify capital needs and execution risk relative to smaller, staged peer deployments
    - High
    - Ask management to show why size improves rather than worsens financeability
  - - Using BWRX-300 plus gas turbines improves hardware credibility
    - Dependence on GE-centered supply access reduces strategic independence and bargaining power
    - Medium-High
    - Request slot reservation terms, alternative pathways, and sole-source exposure
  - - AI-demand tailwind provides top-of-funnel urgency
    - Buyers can still choose grid upgrades, gas, or another nuclear vendor before FID
    - Medium
    - Map actual pipeline conversion stages and reasons for competitive wins/losses
  - - Peer sector momentum validates category demand
    - IEEFA-style sector bear case could compress appetite for all SMR-backed projects
    - Medium-High
    - Stress-test lender and customer appetite under slower nuclear timelines or rising FOAK costs
  notes: Severity is qualitative and investor-oriented. The biggest competitive threat may come from concentrated dependencies and unclear commercial proof rather than from a single superior rival reactor.
