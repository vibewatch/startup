  evidenceGaps:
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: Like-for-like delivered power pricing, capital-cost, or offtake economics for Blue Energy and each comparator.
    whyItMatters: Without comparable pricing or LCOE-style disclosures, investors cannot tell whether Blue Energy is competitively advantaged or simply differently narrated.
    diligencePath: Request draft term sheets, indicative $/MWh ranges, EPC/capex assumptions, and lender materials for Blue Energy; collect equivalent customer-facing economics from peers where possible.
    relatedQuestionRefs:
    - QP008
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: blue-pipeline-depth
    missingEvidence: A stage-gated customer pipeline beyond Crusoe, including vertical, load size, site status, and commercial milestone status.
    whyItMatters: Competitive differentiation is much stronger if Blue Energy is already converting multiple large-load prospects rather than relying on one flagship AI-campus narrative.
    diligencePath: Request CRM export, signed NDAs or LOIs, and management commentary on how many customers are past initial technical screening.
    relatedQuestionRefs:
    - QP004
    - QP023
    - QP024
  - type: missing-source
    severity: material
    topic: contract-structure-comparability
    missingEvidence: Comparable public documentation on who owns, finances, and operates projects across Blue Energy, Oklo, Kairos, NuScale/ENTRA1, X-energy/Dow, TerraPower, and Holtec.
    whyItMatters: Contract form is the best current pricing proxy, but the peer set discloses it unevenly, limiting precision on switching costs and gross-margin potential.
    diligencePath: Map each peer's owner/operator/offtaker structure from filings or management interviews; identify where merchant, tolling, PPA, prepay, or technology-license economics actually sit.
    relatedQuestionRefs:
    - QP007
    - QP014
    - QP015
    relatedTableRefs:
    - TP001
    - TP003
