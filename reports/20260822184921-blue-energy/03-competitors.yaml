  title: Competitors
  summary: Blue Energy is competitively differentiated by its AI-campus channel, phased gas-to-nuclear delivery, and project-finance framing, but its edge is still fragile. Direct peers such as Oklo and Kairos disclose clearer customer-backed commercialization mechanics, while NuScale and Holtec compete on light-water trust and regulatory familiarity; X-energy and TerraPower broaden the field with industrial and grid-focused alternatives.
sections:
- id: landscape-boundary-and-closest-comparables
  title: Landscape boundary and closest comparables
  body: |-
    Blue Energy sits in a crowded advanced-nuclear field, but its closest competition is narrower than the whole SMR universe. The fetched evidence points to two direct-comparable groups. First are nuclear developers chasing large-load digital infrastructure customers, where Oklo and Kairos matter most because both have named corporate-demand pathways tied to data-center or hyperscaler-style load. Second are light-water or regulator-forward vendors such as NuScale and Holtec that may not share Blue Energy's exact AI-campus wedge but compete on credibility, licensing familiarity, and bankability. X-energy and TerraPower are adjacent rather than identical, because their best-supported public cases lean more toward industrial steam, grid balancing, or coal-site replacement than toward Blue Energy's first Texas AI-campus narrative.

    This distinction matters because Blue Energy is not selling the same thing as every peer. Many competitors are still principally marketing reactor technology. Blue Energy's public pitch is different: it wraps known partner hardware inside a financing and construction-sequencing thesis designed to deliver earlier power and make projects easier to underwrite. That gives the company a chance to stand out, but it also means investors should compare Blue Energy not only on reactor attributes, but on site control, customer channel, contract structure, and capital stack.

    The large-load substitute set is broader still. Blue Energy is competing against waiting for the grid, self-building gas generation, renewables-plus-storage packages, and choosing a more regulator-mature light-water path. The result is a competitive market where a company can lose without losing to another startup specifically; it can also lose to a buyer deciding that conventional power infrastructure is good enough.
