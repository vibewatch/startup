evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, backlog conversion, project-level margin assumptions, debt terms, and cash runway.
    whyItMatters: >-
      Without operating and financing detail, outside investors cannot tell whether Blue Energy has merely raised a
      large round or actually derisked project economics enough to justify its implied valuation.
    diligencePath: >-
      Request management financials, debt-vs-equity breakdown for the April 2026 financing, current cash/runway, backlog
      conversion assumptions, and any project-finance term sheets.
    relatedQuestionRefs:
      - QO012
      - QO018
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Exact board-seat allocation, investor voting rights, liquidation preferences, and any customer or partner
      governance side letters.
    whyItMatters: >-
      This is a capital-intensive company whose financing and strategic-partner rights could materially alter downside
      protection and future fund-raising leverage.
    diligencePath: >-
      Request the current cap table, board observer list, investor-rights agreement, and any strategic-commercial side
      letters linked to Constellation, Crusoe, or GE partners.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: texas-schedule
    missingEvidence: >-
      A reconciled project schedule explaining the 2028, 2030, 2031, and 2032 dates that appear across public Blue
      Energy, Crusoe, and GE Vernova materials.
    whyItMatters: >-
      The company's value proposition is schedule compression. Investors need to know which date refers to first gas
      power, first revenue, first nuclear steam, and full nuclear output.
    diligencePath: >-
      Request the latest integrated schedule, milestone definitions, and the specific basis for each public date promise
      used with customers, investors, and regulators.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: tam-dollarization
    missingEvidence: A defensible dollar TAM, SAM, and SOM tied to Blue Energy's actual plant economics and target contract structures.
    whyItMatters: >-
      Electricity-demand projections prove need, but they do not tell investors how much revenue Blue Energy can capture
      or how fast demand converts into bankable contracts.
    diligencePath: >-
      Request Blue Energy's internal market model showing contract value per campus, geographic filters, expected
      conversion assumptions, and segment-specific pricing logic.
    relatedQuestionRefs:
      - QM007
      - QM022
  - type: private-evidence-only
    severity: material
    topic: pipeline-visibility
    missingEvidence: A qualified pipeline list beyond Crusoe, including stage, megawatt size, counterparties, and gating issues.
    whyItMatters: >-
      A single flagship AI campus does not establish a repeatable market without evidence that other buyers are actually
      moving through the same adoption funnel.
    diligencePath: Request CRM/pipeline output, signed NDAs or LOIs, and a stage-gated view of prospects by segment and geography.
    relatedQuestionRefs:
      - QM022
  - type: conflicting-data
    severity: material
    topic: schedule-definition
    missingEvidence: >-
      A consistent company explanation for how 36 months, 48 months, 2028, 2030, 2031, and 2032 fit together in
      commercial-market messaging.
    whyItMatters: >-
      The market case depends on schedule advantage, so inconsistent public timelines directly weaken buyer confidence
      and investor underwriting.
    diligencePath: >-
      Request a milestone dictionary that maps each published date to first gas power, first revenue, first nuclear
      output, and full project completion.
    relatedQuestionRefs:
      - QM020
      - QM025
    relatedTableRefs:
      - TM002
      - TM004
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: Like-for-like delivered power pricing, capital-cost, or offtake economics for Blue Energy and each comparator.
    whyItMatters: >-
      Without comparable pricing or LCOE-style disclosures, investors cannot tell whether Blue Energy is competitively
      advantaged or simply differently narrated.
    diligencePath: >-
      Request draft term sheets, indicative $/MWh ranges, EPC/capex assumptions, and lender materials for Blue Energy;
      collect equivalent customer-facing economics from peers where possible.
    relatedQuestionRefs:
      - QP008
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: blue-pipeline-depth
    missingEvidence: >-
      A stage-gated customer pipeline beyond Crusoe, including vertical, load size, site status, and commercial
      milestone status.
    whyItMatters: >-
      Competitive differentiation is much stronger if Blue Energy is already converting multiple large-load prospects
      rather than relying on one flagship AI-campus narrative.
    diligencePath: >-
      Request CRM export, signed NDAs or LOIs, and management commentary on how many customers are past initial
      technical screening.
    relatedQuestionRefs:
      - QP004
      - QP023
      - QP024
  - type: missing-source
    severity: material
    topic: contract-structure-comparability
    missingEvidence: >-
      Comparable public documentation on who owns, finances, and operates projects across Blue Energy, Oklo, Kairos,
      NuScale/ENTRA1, X-energy/Dow, TerraPower, and Holtec.
    whyItMatters: >-
      Contract form is the best current pricing proxy, but the peer set discloses it unevenly, limiting precision on
      switching costs and gross-margin potential.
    diligencePath: >-
      Map each peer's owner/operator/offtaker structure from filings or management interviews; identify where merchant,
      tolling, PPA, prepay, or technology-license economics actually sit.
    relatedQuestionRefs:
      - QP007
      - QP014
      - QP015
    relatedTableRefs:
