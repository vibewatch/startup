      - number: '2.2'
        title: Sizing lenses and demand evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing evidence comes from electricity-demand scenarios, not from a neat dollar TAM
              produced by Blue Energy or an investment bank. EPRI's 2026 work is the most decision-useful U.S. lens in
              the fetched set. It says data centers are already the fastest-growing source of U.S. electricity demand
              and could reach 9% to 17% of total U.S. electricity use by 2030. Data Center Knowledge's summary
              translates that into roughly 380 to 790 TWh by 2030 versus roughly 177 to 192 TWh in 2024, showing how
              wide—but undeniably large—the planning band has become.


              The global lens points in the same direction. The IEA says data-center electricity demand could reach
              about 950 TWh by 2030, with AI as an important accelerator. Goldman Sachs similarly frames data-center
              demand as a structural force that is pulling forward investment in new energy technologies. For Blue
              Energy, the implication is not that every terawatt-hour is addressable; it is that the top-of-funnel
              demand pool is no longer the binding constraint.


              What public sources do not provide is a reliable Blue Energy-specific dollar SOM. There is still a missing
              bridge from electricity-demand scenarios to contract size, customer conversion, and unit economics.
              Investors should therefore treat the market as large in physical-demand terms but only partially
              translated into Blue Energy-relevant commercial value.
