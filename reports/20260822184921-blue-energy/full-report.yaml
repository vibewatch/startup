      - number: '3.2'
        title: Peer profiles and commercial models
        blocks:
          - type: paragraph
            body: >-
              Oklo, Kairos, NuScale, X-energy, TerraPower, and Holtec each illuminate a different attack surface against
              Blue Energy. Oklo is the cleanest direct challenge on AI-linked demand because its Meta agreement shows a
              1.2 GW campus development plan plus a disclosed prepayment mechanism that advances fuel procurement and
              development work. Kairos offers a second corporate-demand model, using a multi-plant agreement with Google
              and explicitly disclosed PPAs for energy, ancillary services, and environmental attributes. Both matter
              because they show forms of customer-backed commercialization that Blue Energy has not yet described at
              equal detail in public.


              NuScale and Holtec represent a different kind of pressure. Their public materials emphasize light-water
              familiarity, regulator-facing maturity, and well-defined reactor products. NuScale stresses its
              NRC-approved 77 MWe module and exclusive commercialization relationship with ENTRA1, while Holtec stresses
              standard PWR fuel, Palisades siting, phased permitting, and Mission 2030 deployment ambitions. Those
              narratives may resonate strongly with lenders or counterparties who value conventional nuclear familiarity
              over Blue Energy's more novel delivery model.


              X-energy and TerraPower broaden the comparison rather than perfectly matching it. X-energy's strongest
              public proof is the Dow Seadrift industrial project, where electricity plus high-temperature steam matters
              as much as raw megawatts. TerraPower's Natrium platform is framed around grid flexibility, storage, and a
              DOE-backed Wyoming demonstration. These peers show that advanced nuclear demand is not one market; Blue
              Energy's AI-campus wedge is real, but it competes against adjacent pathways that may solve different
              customer problems more directly.
