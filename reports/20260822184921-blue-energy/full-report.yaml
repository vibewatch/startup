  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Blue Energy's public financial identity is still forward-looking. The company has not disclosed revenue,
              ARR, or backlog values in the fetched record, and there is no public evidence of realized pricing for
              power, development fees, or milestone payments. Instead, the company frames itself as a
              project-financeable platform that develops, sequences, and eventually delivers large nuclear-backed power
              assets. Financially, that implies a model closer to infrastructure development and long-term contracted
              power than to one-time equipment sales.


              That distinction matters because it shifts what investors should ask. The key questions are not just
              whether Blue Energy can sell reactors, but how value accrues across development, construction, financing,
              and eventual operation. If Blue Energy is paid only after full nuclear operation, the model is much more
              capital hungry. If it can monetize earlier site work, gas-bridge power, or development milestones, the
              cash-flow profile improves materially. Public evidence does not yet resolve where that line falls.


              Peer disclosures reinforce that contract form is currently more informative than posted price. Oklo
              disclosed a prepayment mechanic with Meta; Kairos disclosed PPAs with Google; NuScale and ENTRA1 disclosed
              a programmatic commercialization platform. Blue Energy, by contrast, has narrative-level commercialization
              proof but little public pricing transparency. That does not make the model weak, but it does make it
              harder to underwrite.
            claimRefs:
