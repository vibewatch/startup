      - number: '3.4'
        title: Switching costs, moat durability, and the safest conclusion
        blocks:
          - type: paragraph
            body: >-
              The most important competitive question is when Blue Energy's advantages become sticky. Before a project
              reaches final investment decision, a buyer can still compare grid upgrades, gas generation, Blue Energy,
              and multiple nuclear peers. Once a site, offtake structure, licensing path, and fuel strategy start to
              harden, switching costs rise fast because changing vendor may also mean changing reactor class,
              counterparties, and timetable. That makes early pipeline evidence unusually important: the company that
              wins the first few bankable screens may create de facto moat even before large revenue arrives.


              Blue Energy's moat claim is therefore plausible but fragile. Its combination of Crusoe demand proof, Texas
              site progress, GE Vernova alignment, and phased construction logic is hard to replicate instantly. Yet
              competitors can attack from different directions. Oklo and Kairos can present clearer public contract
              structures. NuScale and Holtec can present more conventional trust signals. X-energy and TerraPower can
              present stronger fit for certain industrial or grid use cases. And the entire field remains exposed to the
              bear case that SMRs stay too expensive and too slow to scale commercially on attractive timelines.


              The safest investor conclusion is not that Blue Energy is uniquely unbeatable. It is that the company is
              differentiated in a strategically interesting part of the market, but that its edge will remain fragile
              until it proves repeatable customer conversion, clearer commercial terms, and execution that compares
              favorably with peers who are stronger on at least one major dimension today.
            claimRefs:
