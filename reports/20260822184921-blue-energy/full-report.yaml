  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Gas phase outpaces nuclear thesis
        - Early gas milestones advance while nuclear conversion timing weakens materially
        - Project can appear active while differentiation erodes
        - Re-cut valuation and challenge financeability claim
      - - No customer broadening
        - Crusoe remains the only meaningful named demand proof for too long
        - Concentration discount deepens and pipeline credibility weakens
        - Do not upgrade recommendation
      - - Financing opacity persists
        - No credible sources-and-uses, term, or cap-table package appears near major decisions
        - Headline valuation loses underwriting support
        - Require stronger rights or lower price
      - - Partner stack weakens
        - GE, Constellation, Crusoe, or site ecosystem commitments narrow materially
        - Strategic credibility and execution odds fall together
        - Increase haircut or pause diligence
      - - Schedule / regulatory drift grows
        - Public milestone dictionary keeps expanding or slipping without explanation
        - Down-round probability rises as confidence breaks
        - Shift toward bear case quickly
    notes: Triggers are monitorable events designed to move recommendation fast if the facts change.
    claimRefs:
      - CV024
      - CV026
      - CV036
      - CV037
      - CV038
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Cap table and preferences
        - Post-money ownership, liquidation stack, participation, option pool, debt seniority
        - Controls actual investor downside and upside, not just headline valuation
        - Review financing documents and waterfall model
      - - Project-finance architecture
        - Sources and uses, milestone draws, lender appetite, and fallback capital plan
        - Determines whether the flagship can progress without punitive dilution
        - Request lender deck, model, and financing timeline
      - - Contract economics
        - Offtake logic, gas-phase economics, nuclear conversion economics, and termination rights
        - Valuation cannot be trusted without knowing where margin can appear
        - Review executed agreements or detailed term sheets
      - - Flagship milestone dictionary
        - Precise mapping of FID, gas energization, nuclear start, and permitting steps
        - Reduces narrative ambiguity and helps scenario probabilities
        - Request integrated milestone tracker with owners and dates
      - - Pipeline breadth
        - Second site or second demand-anchor evidence beyond the current flagship
        - Tests whether Blue Energy is a one-asset story or a repeatable platform
        - Review active pipeline and dated counterparties
      - - Liquidity path
        - Board view on IPO, secondary, or strategic-exit timing
        - Private value matters only if a realizable exit path exists
        - Review board materials and banker conversations if any
    notes: These asks are ranked by how directly they could change recommendation, valuation stance, or downside protection.
    claimRefs:
      - CV006
      - CV021
      - CV028
      - CV039
      - CV040
      - CV041
