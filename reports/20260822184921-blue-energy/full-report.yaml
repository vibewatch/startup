      - number: '2.4'
        title: Drivers, constraints, and the safest market conclusion
        blocks:
          - type: paragraph
            body: >-
              The core driver behind Blue Energy's opportunity is real: very large-load customers increasingly need
              power faster than the grid alone can provide it. That demand backdrop is strengthened by EPRI, Goldman,
              IEA, and Texas-specific reporting. Blue Energy's phased gas-to-nuclear model is designed to exploit
              exactly that mismatch by offering speed first and nuclear later. If the model works, it could widen the
              set of buyers willing to consider nuclear-backed infrastructure.


              The constraints are just as real. HALEU availability remains a broad advanced-nuclear bottleneck. Nuclear
              project-delivery history remains poor enough that GAO, IEA, and IEEFA all supply credible reasons for
              skepticism. Blue Energy also faces self-inflicted narrowing: barge-based logistics, very large project
              size, and a requirement for buyers sophisticated enough to contract around complex delivery and conversion
              milestones.


              The safest market statement, then, is not that Blue Energy has a limitless TAM waiting to sign tomorrow.
              It is that Blue Energy operates in one of the most structurally attractive electricity-demand environments
              in the economy, but its realizable market narrows sharply once commercial, geographic, fuel, financing,
              and regulatory filters are applied. That still supports serious investor interest—it just does not justify
              hand-waving over conversion risk.
