      - number: '6.4'
        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Blue Energy's upside comes from the possibility that one flagship AI-campus path can become a repeatable
              template. If that happens, expansion could mean more campuses, more sites, or more segment penetration
              into advanced manufacturing. The broader demand backdrop from EPRI, Goldman, and Bloom makes that
              plausible.


              But the concentration risk is obvious today. Public evidence points to one named demand partner, one main
              region, one site ecosystem, and one dominant hardware / counterparty stack. That is enough to validate
              customer relevance, but not enough to claim commercial breadth. The comparison set is instructive: Oklo
              has Meta, Kairos has Google, and X-energy has Dow. Blue Energy belongs in that serious peer group, yet it
              still needs more than one flagship to show durable diversification.


              The safest customer conclusion is therefore balanced. Blue Energy has more tangible early demand proof
              than many frontier-energy startups, but it remains highly concentrated and pre-operational from a
              customer-traction perspective. Expansion is the next proof step, not a fact already demonstrated.
