      - number: '6.3'
        title: Retention, durability, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is almost nonexistent, which is unsurprising given Blue Energy's current stage.
              There are no disclosed contract lengths, renewal rates, NRR, GRR, churn, or satisfaction scores in the
              fetched record. That means durability must currently be inferred from project structure rather than
              measured from cohorts.


              The structural inference is that switching costs are low early and high late. Before site, permitting, and
              financing harden, a prospective customer can still compare Blue Energy with the grid, gas, or other
              nuclear paths. After those decisions harden, changing course becomes materially more expensive because the
              customer path becomes tied to specific land, equipment, counterparties, and timeline assumptions. This is
              a potentially favorable retention dynamic—but it remains unproven until Blue Energy has live customer
              cohorts.


              Procurement friction is correspondingly high. Customers must be willing to evaluate not just electricity
              price, but land, transmission, regulatory sequencing, partner stack, and the credibility of a phased
              gas-to-nuclear build. That makes customer acquisition slow and concentrated, but also means a win can be
              unusually sticky if it reaches full commitment.
            claimRefs:
              - CU020
              - CU021
              - CU022
              - CU023
