      - number: '8.2'
        title: Comparable valuation frame and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The comp set does not justify a mechanical mark, but it does help establish boundaries. Oklo and NuScale
              are the most relevant public advanced-nuclear equity references because they represent investor
              willingness to fund nuclear commercialization stories before large-scale economic maturity is visible in
              conventional utility terms. At about USD7.82 billion and USD3.85 billion respectively, those public marks
              sit well above Blue Energy's disclosed >USD1 billion private floor. That means Blue Energy is not trying
              to price itself above every public nuclear growth narrative.


              At the same time, public market caps for GE Vernova, Constellation, Cameco, Vistra, Dow, Meta, and Centrus
              show how different reference categories behave. Some are giant operating incumbents with diversified
              earnings, some are nuclear-fuel or commodity-adjacent names, and some are customer balance-sheet
              references rather than direct comps. They help answer whether multibillion outcomes are plausible, not
              whether Blue Energy deserves them today. Public issuers also file continuously with the SEC and reprice
              every day, while Blue Energy's private mark remains intermittent and less transparent.


              That is why entry discipline matters. The current price may be directionally credible, but investors
              should still insist on either better terms or better evidence. A lower price, milestone-based tranching,
              downside protection, or much clearer project-finance visibility would all improve the setup. Without one
              of those, the comp work supports a conclusion of plausibility, not of margin-of-safety.
            claimRefs:
              - CV010
              - CV011
