        title: Customer segmentation and buyer map
        blocks:
          - type: paragraph
            body: >-
              Blue Energy's clearest current customer segment is the large-load AI campus. Crusoe is the flagship
              signal: an energy-first AI factory company that fits Blue Energy's stated objective of powering
              data-center-scale infrastructure with dedicated firm power. In that channel, the buyer appears to be the
              campus developer or project sponsor, the user is the data-center or AI-compute operation, and the payer is
              likely the contracted offtaker or infrastructure sponsor rather than a retail utility customer.


              Public materials also point to adjacent but less-proven segments. Blue Energy itself names advanced
              manufacturing, and utility-like or public-power demand sits in the background as a broader nuclear
              customer class. But those segments remain mostly narrative in Blue Energy's own case because no named
              industrial or utility customer is yet public in the fetched set.


              Google, Meta, Dow, and TVA matter less as Blue Energy customers than as segment validation. They show the
              kinds of buyer profiles that are actively considering or procuring advanced-nuclear-adjacent power:
              hyperscalers, industrial operators, and public-power institutions. That supports Blue Energy's segment
              choice while still leaving its own account coverage narrow.
