  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and current price context
        blocks:
          - type: paragraph
            body: >-
              Blue Energy has earned the right to stay on an investment committee agenda. The April 2026 USD380 million
              financing was unusually large for a company founded in 2023, media coverage described the round as taking
              the company above a USD1 billion valuation, and Constellation's later investment added further strategic
              validation. Those are real signals, not cosmetic ones. They suggest sophisticated capital providers
              believe Blue Energy has a credible shot at turning large-load power demand into a bankable nuclear
              development platform.


              The problem is that the current price is much easier to describe than to underwrite. The retained public
              record still does not disclose revenue, backlog, realized pricing, project-level contract economics, cash
              balance, debt terms, or the cap-table protections that would determine true investor outcomes. For that
              reason, the right public-evidence call is not buy. It is track / research-more. The committee can justify
              continued diligence because the strategic setup is strong, but it cannot justify price-insensitive
              conviction because the core valuation denominator remains private.


              That leads to a balanced stance. Blue Energy does not look obviously overvalued in an absolute sense;
              advanced-nuclear public equities already trade in the billions when markets believe in their long-term
              optionality. But Blue Energy also does not yet have the public operating proof or financing transparency
              needed to treat the unicorn mark as attractive on its face. The current valuation should therefore be
              treated as fair-to-stretched, with medium confidence and high risk, until private diligence shows how the
              first flagship actually converts capital into cash-generating assets.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
