      - number: '1.4'
        title: Texas Campus, Customer Proof, and Regulatory Path
        blocks:
          - type: paragraph
            body: >-
              Blue Energy's first project is unusually concrete for a 2023-founded nuclear startup. The Port of Victoria
              granted an option agreement for roughly 70 acres in 2025, and Crusoe publicly tied Blue Energy to a nearby
              AI-factory campus that it said spans 1,600 acres in Calhoun County. Blue Energy, Crusoe, and later GE
              Vernova materials all describe the site as a multi-gigawatt effort anchored around AI-driven electricity
              demand. Public sources also quantify local economic hopes: more than USD1 billion of first-phase
              investment and around 100 permanent jobs, according to the port authority.


              The public schedule, however, needs careful parsing. Crusoe's 2025 announcement described gas-bridge power
              as early as 2028 and nuclear generation by 2031. By August 2026, the GE Vernova Hitachi agreement laid out
              a more detailed staging plan: two gas turbines delivered in 2029, around 1 GW from gas by 2030, and around
              1.5 GW of nuclear output as BWRX-300 units come online as early as 2032. Those statements are not
              necessarily incompatible, but they do show why Blue Energy needs a disciplined explanation of what each
              date refers to.


              On licensing, Blue Energy already looks more advanced than many young climate-infrastructure companies.
              NRC records show pre-application work beginning in March 2025, and the agency's Blue Energy docket
              includes a quality-assurance program, a regulatory-engagement plan, and the approved BE-BOPTR-02 topical
              report on resequencing construction. Blue Energy treats that resequencing approval as a key unlock because
              it allows non-nuclear scope and gas-turbine energization to advance ahead of full nuclear completion. If
              that sequencing truly survives execution, it is the company's most differentiated regulatory asset.
