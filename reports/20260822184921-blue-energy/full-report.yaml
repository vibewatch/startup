  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The current unicorn mark is supportable only inside a wide scenario envelope rather than by a precise
      public-market-style denominator.
    data:
      items:
        - label: Bear case
          low: 600
          mid: 800
          high: 1000
          displayValue: $0.6B-$1.0B
          detail: Schedule drift, narrow pipeline, or financing opacity create down-round risk.
        - label: Current disclosed floor
          low: 1000
          mid: 1000
          high: 1000
          displayValue: '>$1.0B'
          detail: Public reporting describes the April 2026 mark as above USD1B.
        - label: Base case
          low: 1200
          mid: 1800
          high: 2500
          displayValue: $1.2B-$2.5B
          detail: Flagship advances without fully resolving financing and concentration concerns.
        - label: Bull case
          low: 4000
          mid: 6000
          high: 8000
          displayValue: $4.0B-$8.0B
          detail: Flagship de-risks and Blue Energy begins to look more like a repeatable platform than a single-asset story.
    approximationNotes: >-
      Ranges are committee scenario envelopes inferred from strategic scarcity, public comp context, and risk discounts;
      they are not DCF outputs or management guidance.
    claimRefs:
