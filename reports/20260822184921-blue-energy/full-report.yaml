  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and asset map
        blocks:
          - type: paragraph
            body: >-
              Blue Energy's product is best understood as a deployment platform for financeable nuclear power plants,
              not as a single reactor SKU. The public materials consistently emphasize project finance, prefabrication,
              logistics, and compatibility with leading reactor technology. That makes the unit of analysis a
              power-plant system: site, hardware stack, sequencing plan, and customer outcome, rather than only a
              reactor core.


              The visible asset set reflects that orientation. Blue Energy's public product includes the Texas flagship
              site path, the Blue Way prefabrication model, the gas-plus-nuclear architecture, the regulatory sequencing
              strategy, and the partner hardware selection built around GE Vernova gas turbines and the BWRX-300. Put
              differently, the company is packaging development know-how, physical architecture, and counterparties into
              a productized deployment motion.


              This framing is strategically important because it explains why Blue Energy can look differentiated
              without inventing a new reactor. The company is trying to standardize how a large nuclear-backed power
              asset is assembled, financed, and delivered. If it succeeds, that could be commercially valuable even if
              much of the reactor science sits with partners.
