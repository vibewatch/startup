chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Deployment Model
        blocks:
          - type: paragraph
            body: >-
              Blue Energy is best understood as a nuclear-plant deployment company, not as a novel-reactor science
              project. Public company materials consistently describe it as a developer of financeable, prefabricated
              nuclear power plants that can house proven reactor technologies rather than invent a new core design from
              scratch. That positioning matters because Blue Energy's commercial thesis is aimed squarely at the
              historic pain point in U.S. nuclear: unpredictable construction cost, timeline slippage, and financing
              structures that repel private infrastructure capital.


              The company's answer is industrialized construction. Blue Energy says it will build large plant modules
              offsite in existing shipyards and fabrication yards, then move them to the final location by barge for
              modular installation. TechCrunch and company materials both tie the concept to lessons from LNG and
              offshore-energy construction rather than to a radically new reactor technology. Blue Energy further says
              the architecture is reactor agnostic, even though the first announced Texas project has now become closely
              associated with GE Vernova Hitachi's BWRX-300 SMR.


              Blue Energy also frames schedule compression as the heart of its differentiation. Depending on the
              document, the company describes time to power as either 48 months or less or, in customer/project
              materials tied to Crusoe and Victoria, as 36 months or less when the natural-gas bridge is used. The
              common thread is the same: Blue Energy wants to energize the non-nuclear balance of plant earlier, then
              transition to nuclear later. That is a more credible framing than promising a miracle reactor, but it
              still leaves investors needing a rigorous definition of which milestone each public date actually
              measures.
