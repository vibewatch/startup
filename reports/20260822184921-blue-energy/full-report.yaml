  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Blue Energy has regulatory momentum, not regulatory completion. The NRC pre-application record and
              accepted topical report show that the company has moved beyond concept-stage nuclear storytelling. But
              that same record also shows how much remains unresolved. A topical report that helps resequence
              construction is valuable only if it survives full site-specific scrutiny and does not create new
              downstream questions around what exactly can be built, energized, or financed at each stage.


              The best benchmark is not a zero-risk case, but the broader sector. Holtec's phased permitting and
              Kairos's Hermes permits show that advanced nuclear projects—even when progressing—still live inside long,
              staged regulatory journeys. Blue Energy may have chosen a pragmatically financeable path, but it has not
              escaped the structural burden of nuclear permitting.


              The legal and political overlay matters too. Site concentration in Texas can be a strength, but it also
              means community, environmental, and local-approval durability matter more than the headline partnership
              narrative implies. Investors should treat regulatory progress as a real mitigation, not as a solved
              problem.
            claimRefs:
