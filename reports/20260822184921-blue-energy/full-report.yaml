      - number: '1.3'
        title: Capital Formation, Stakeholders, and Strategic Backers
        blocks:
          - type: paragraph
            body: >-
              The April 2026 financing is the event that moved Blue Energy from interesting concept to credible
              venture-backed platform. Company statements, PRNewswire, and TechCrunch all converge on the headline
              number: USD380 million. Blue Energy says the round was led by VXI Capital with significant backing from
              Engine Ventures and participation from At One Ventures and Tamarack Global, while TechCrunch adds that the
              package included both equity and debt. That distinction is important. A large blended financing can signal
              genuine capital access, but it can also obscure structure, priority, and downside protection until the
              terms are disclosed.


              Public commentary around valuation is directionally bullish but still lightly documented. Third-party
              outlets portrayed the round as producing unicorn status, yet no public filing in the reviewed set
              establishes price per share, liquidation preferences, or ownership transfer details. The safer conclusion
              is that Blue Energy has clearly attracted major financial sponsorship very early in its life, but
              outsiders still cannot underwrite the cap table with precision.


              The strategic value of the July 2026 Constellation investment likely matters as much as the cash.
              Constellation brings operating credibility from the largest U.S. nuclear fleet, and GE Vernova Hitachi
              adds a concrete reactor/turbine pathway for the Texas site. Crusoe and the Port of Victoria add commercial
              and location proof. This combination means Blue Energy is no longer just raising money against a pitch
              deck; it is assembling a stakeholder stack that touches capital, customers, technology, site control, and
              eventual operations. That said, the exact governance and commercial rights embedded in those relationships
              remain private.
