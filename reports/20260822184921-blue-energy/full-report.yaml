        title: Sales motion and traction proxies
        blocks:
          - type: paragraph
            body: >-
              Blue Energy's GTM motion appears to be a low-volume, extremely high-value enterprise sale. Crusoe is the
              first named demand partner, and the Port of Victoria plus NRC pre-application work show that commercial
              progress is inseparable from siting, permitting, and infrastructure alignment. This is not a model where
              CAC or payback can be estimated from public funnel data. It is a model where one additional qualified site
              or one lender-backed term sheet could matter more than dozens of top-of-funnel conversations.


              That reality creates two competing interpretations. On the positive side, Blue Energy does not need
              hundreds of customers to support a large business. One or two flagship projects could create substantial
              enterprise value if contracted and financed correctly. On the negative side, public commercial evidence is
              highly concentrated. With only one named customer and one named flagship site, investors cannot yet assess
              win rates, renewal logic, or channel breadth.


              The demand backdrop is supportive: EPRI, Goldman Sachs, and Bloom all show that AI-era power scarcity is
              real. But demand support is not the same as sales efficiency. Blue Energy still has to prove that it can
              convert urgency into bankable projects faster than peers or incumbent substitutes can.
