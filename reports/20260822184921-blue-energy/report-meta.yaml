companyProfile:
  summary: >-
    Blue Energy is a U.S.-based advanced-nuclear developer building a project-financeable deployment model rather than
    inventing a novel reactor from scratch. Its public strategy combines shipyard or fabrication-yard manufacturing,
    phased gas-to-nuclear project sequencing, GE Vernova Hitachi's BWRX-300 pathway, and large-load demand from AI data
    centers and advanced manufacturing customers. Public evidence supports unusual early momentum for a 2023-founded
    company, but not the mature financial and contractual disclosure needed for price-insensitive underwriting.
  foundedDate: '2023-01-01'
  founders:
    - name: Jake Jurewicz
      role: CEO and co-founder
      background: MIT nuclear-trained energy strategist with prior work in climate-risk, nuclear-security, and behind-the-meter power development.
      claimRefs: [CO004]
    - name: Matt Slotkin
      role: Co-founder
      background: Product and technical founder previously tied to Vowel and Bridgewater's Systemized Intelligence Lab.
      claimRefs: [CO005]
  foundingLocation: United States
  headquarters: Washington, DC area
  productSummary: Prefabricated gas-plus-nuclear power plants that use offsite module manufacturing, early gas generation, and later BWRX-300 nuclear buildout.
  customerFocus: AI data centers, advanced manufacturing sites, and other large-load users needing firm power.
  businessModel: Project-led infrastructure development and long-term power delivery model centered on making gigawatt-scale nuclear-backed plants financeable.
