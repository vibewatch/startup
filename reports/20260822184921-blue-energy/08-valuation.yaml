- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: |-
    Exit readiness is not visible in the retained public record. Blue Energy has logical strategic relevance to utilities, nuclear OEM ecosystems, hyperscale-adjacent infrastructure, and project-finance platforms, but no public source discloses IPO timing, a secondary market, or an active sale process. As a result, the final diligence agenda matters more than generic excitement about the category. Investors need to know not only whether the company is promising, but whether the current price and terms protect them if the flagship takes longer or costs more than expected.

    The most important thesis-break triggers are concrete. If gas milestones arrive while nuclear conversion timing weakens, the company could appear to make progress while actually undermining its differentiation. If customer proof remains narrowly concentrated around one flagship path, valuation can compress even without a technical failure. And if financing architecture, contract rights, or cap-table economics stay opaque near major milestones, the market signal becomes less trustworthy just when investors need it most.

    That makes the closing ask list straightforward: cap table and liquidation preferences, project-finance sources and uses, contract economics and termination rights, a milestone dictionary for the flagship, and evidence that management can broaden from one proof point to a repeatable platform. Until those are reviewed, the best disciplined stance is to keep Blue Energy in diligence rather than to force a confident buy or a reflexive pass.
