  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Flagship milestones de-risk on time, project finance becomes legible, and customer/site proof broadens
    - Current >$1B mark can prove conservative; upside comes from scarcity plus execution
    - Still depends on heavy capital and multi-party coordination
    - Possible, but it needs real milestone proof rather than narrative momentum
  - - Base
    - Strategic relevance holds, flagship advances, but contract economics and financing terms remain partly private
    - Valuation can hold or expand modestly, but without a wide margin of safety
    - Dilution, schedule drift, and concentration keep upside capped
    - Best fit with current public evidence
  - - Bear
    - Schedule slips, customer proof stays narrow, or financing opacity worsens near capital decisions
    - Unicorn mark can compress into down-round territory even without total project failure
    - Narrative premium disappears faster than underlying asset quality
    - Credible because risk cluster is tightly coupled
  - - Structured-upside
    - Investor gets milestones, downside protection, or better price even if company quality is unchanged
    - Return potential improves through terms discipline rather than optimistic mark expansion
    - Requires management willingness and strong information rights
    - Most investable path if current price does not move
