  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: cap-table-preferences-and-waterfall
    missingEvidence: Exact post-money ownership, liquidation preferences, debt seniority, side letters, and dilution waterfall from the April 2026 round and later strategic financing.
    whyItMatters: Headline valuation can look acceptable while actual common or new-investor economics remain weak.
    diligencePath: Request executed financing documents, cap table, and waterfall analysis.
    relatedQuestionRefs:
    - QV016
    - QV024
    - QV025
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: critical
    topic: project-finance-and-contract-economics
    missingEvidence: Sources and uses, lender appetite, contract pricing logic, gas-phase economics, nuclear conversion economics, and key termination rights for the flagship project.
    whyItMatters: This is the missing denominator behind both fair value and downside risk.
    diligencePath: Request project model, lender materials, and major commercial agreements or detailed term sheets.
    relatedQuestionRefs:
    - QV017
    - QV019
    - QV020
    - QV025
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: exit-readiness-and-pipeline-breadth
    missingEvidence: Public evidence on second-site pipeline, secondary-liquidity planning, IPO readiness, or a defined strategic-exit pathway.
    whyItMatters: Without broader pipeline and liquidity evidence, the current mark remains a flagship option value rather than a clearly realizable platform value.
    diligencePath: Request pipeline review, board discussion of liquidity options, and dated next-step evidence beyond the Texas flagship.
    relatedQuestionRefs:
    - QV022
    - QV024
    - QV025
    relatedTableRefs:
    - TV005
    - TV006
