- id: scenario-valuation-logic
  title: Bull, base, and bear scenario logic under explicit uncertainty
  body: |-
    Because Blue Energy lacks a public revenue denominator, scenario work has to start with milestones rather than with a tidy sales multiple. The bull case requires more than optimism about nuclear demand. It requires site-specific regulatory progress, clearer final investment decision timing, stronger evidence that the gas-plus-nuclear sequencing actually improves financeability, and at least some broadening beyond a single named customer-path story. If those pieces lock together, today's unicorn mark could prove conservative relative to later-stage strategic value.

    The base case is more restrained and fits current evidence best. In that case, Blue Energy keeps its strategic relevance, protects its core partnerships, and advances the flagship enough to avoid a confidence break, but it still carries large unresolved financing and contract-economics gaps. Under that path, the current valuation can remain intact or expand modestly, yet the upside is limited by dilution risk and by the absence of public proof that one site can scale into a repeatable fleet program.

    The bear case does not require the company to fail outright. It only requires some combination of schedule drift, customer concentration, partner delay, or financing opacity to turn the narrative from premium optionality into down-round risk. That is why the most useful range work is not a precise fair-value model. It is a set of committee envelopes that translate execution quality into valuation outcomes and make explicit what evidence would move the call.
