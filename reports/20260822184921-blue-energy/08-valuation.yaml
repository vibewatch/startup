  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Cap table and preferences
    - Post-money ownership, liquidation stack, participation, option pool, debt seniority
    - Controls actual investor downside and upside, not just headline valuation
    - Review financing documents and waterfall model
  - - Project-finance architecture
    - Sources and uses, milestone draws, lender appetite, and fallback capital plan
    - Determines whether the flagship can progress without punitive dilution
    - Request lender deck, model, and financing timeline
  - - Contract economics
    - Offtake logic, gas-phase economics, nuclear conversion economics, and termination rights
    - Valuation cannot be trusted without knowing where margin can appear
    - Review executed agreements or detailed term sheets
  - - Flagship milestone dictionary
    - Precise mapping of FID, gas energization, nuclear start, and permitting steps
    - Reduces narrative ambiguity and helps scenario probabilities
    - Request integrated milestone tracker with owners and dates
  - - Pipeline breadth
    - Second site or second demand-anchor evidence beyond the current flagship
    - Tests whether Blue Energy is a one-asset story or a repeatable platform
    - Review active pipeline and dated counterparties
  - - Liquidity path
    - Board view on IPO, secondary, or strategic-exit timing
    - Private value matters only if a realizable exit path exists
    - Review board materials and banker conversations if any
  notes: These asks are ranked by how directly they could change recommendation, valuation stance, or downside protection.
