  topStrengths:
    - >-
      Blue Energy has assembled an unusually strong early stakeholder stack spanning VXI Capital, Engine Ventures,
      Constellation, Crusoe, GE Vernova Hitachi, and the NRC.
    - >-
      The company is pursuing a real market need in AI-era firm-power demand and has a concrete flagship Texas use case
      rather than a purely abstract commercialization story.
    - >-
      Using a light-water BWRX-300 path and phased construction may improve financeability relative to more novel
      advanced-nuclear approaches.
  topRisks:
    - >-
      The flagship remains pre-operational and concentrated around one geography, one main customer path, and one core
      partner stack.
    - >-
      Public evidence does not disclose contract economics, cap-table protections, project-finance architecture, or
      realized unit economics.
    - >-
      The capital required to deliver gigawatt-scale projects is far larger than the disclosed venture financing,
      leaving dilution and execution risk high.
    - Gas-phase progress could mask nuclear-conversion delay, weakening the core differentiation if milestones drift.
  unresolvedGaps:
    - Exact post-money ownership, liquidation preferences, debt seniority, and waterfall economics.
    - Sources and uses, lender appetite, and full project-finance structure for the flagship Texas site.
    - Contract pricing, termination rights, and margin logic for the gas phase and later nuclear phase.
    - Evidence of second-site or second-customer repeatability beyond the current flagship narrative.
