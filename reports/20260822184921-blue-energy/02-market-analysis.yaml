chapter:
  number: 2
  title: Market Analysis
  summary: Blue Energy is pursuing one of the most attractive power-demand pockets in the economy—gigawatt-scale AI and industrial loads that need firm power faster than the grid alone can supply it—but the realizable market is far smaller than the headline demand pool. Public evidence supports a large physical-demand opportunity, yet it also shows that geography, fuel, financing, regulation, and contracting will sharply narrow Blue Energy's true SAM and SOM.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: |-
    Blue Energy's market is often described casually as ‘nuclear for AI,’ but the fetched record supports a narrower and more useful definition. The company is pursuing very large loads that need firm power, can justify dedicated infrastructure, and care intensely about schedule certainty. Crusoe's announced campus is the clearest example: an AI-factory site measured in gigawatts, tied to pipelines, fiber, and port-linked land. That is a different demand category from residential clean energy, small community reactors, or general merchant generation.

    This boundary matters because it clarifies both inclusion and exclusion. Included demand is dominated by hyperscale AI campuses and a secondary bucket of advanced-manufacturing or industrial customers that value around-the-clock supply. Excluded or at least distant demand includes ordinary retail load, small behind-the-meter resilience projects, and broad utility service territories where Blue Energy's barge-based logistics or phased construction advantages may be less decisive.

    The substitutes are also clearer once the boundary is narrowed. Buyers can wait in the utility interconnection queue, self-procure gas generation, combine renewables with storage, or contract with other nuclear developers. Blue Energy is therefore not just competing against nuclear peers. It is competing against every other path to fast, firm, large-scale power.
