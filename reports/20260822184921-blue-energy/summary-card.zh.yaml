summary:
  headline: Blue Energy 作为 2023 年成立的核能创业公司，融资能力和伙伴质量罕见；但项目经济性、融资条款，以及旗舰项目之外能否复制仍未披露，当前独角兽估值只能说方向上讲得通，还不能算被充分穿透。
