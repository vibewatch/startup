  topStrengths:
    - Blue Energy 已拉起一套罕见的早期利益相关方组合，覆盖 VXI Capital、Engine Ventures、Constellation、Crusoe、GE Vernova Hitachi 和 NRC。
    - 公司切中 AI 时代稳定电力需求，并拿出 Texas 旗舰用例，而不是停在抽象商业化叙事。
    - 选择轻水 BWRX-300 路线并分阶段建设，相比更新奇的先进核能方案，可能更容易被项目融资接受。
  topRisks:
    - 旗舰项目尚未投运，并高度集中在单一地域、一个主客户路径和一套核心伙伴组合上。
    - 公开证据没有披露合同经济性、股权结构保护、项目融资架构或已兑现的单位经济性。
    - 交付吉瓦级项目所需资金远高于已披露风投资金，稀释和执行风险仍高。
    - 燃气阶段进展可能掩盖核转换延误；若里程碑漂移，核心差异化会被削弱。
  unresolvedGaps:
    - 准确的投后所有权、清算优先权、债务优先级和现金瀑布经济性。
    - Texas 旗舰场址的资金来源与用途、贷款人意愿和完整项目融资结构。
    - 燃气阶段和后续核能阶段的合同定价、终止权和利润率逻辑。
    - 当前旗舰叙事之外，第二场址或第二客户能否复制的证据。
