  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-burn
    missingEvidence: Current revenue, contracted backlog, monthly burn, cash balance, and runway by quarter.
    whyItMatters: Without internal financial statements, investors cannot judge whether Blue Energy has enough time to reach its next financing or project milestone.
    diligencePath: Request management P&L, balance sheet, cash-flow forecast, and signed backlog schedule.
    relatedQuestionRefs:
    - QI002
    - QI010
    - QI020
    - QI022
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: contract-pricing
    missingEvidence: Power-pricing, availability-payment, or development-fee terms for Crusoe or any other prospective customer.
    whyItMatters: Pricing and contract form drive revenue quality, margin path, and lender confidence, yet the public record only shows narrative-level commercialization.
    diligencePath: Request term sheets or modeled economics for Blue Energy's first project and compare them with peer customer contracts.
    relatedQuestionRefs:
    - QI004
    - QI008
    - QI021
    - QI024
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: capital-stack
    missingEvidence: Detailed project-finance architecture showing how equity, debt, turbines, reactor hardware, and conversion milestones are funded from FID through operation.
    whyItMatters: The April 2026 round is clearly insufficient for full buildout on its own, so project-finance design is central to the whole business model.
    diligencePath: Request lender deck, sources-and-uses model, milestone draw schedule, and downside cases for schedule slips.
    relatedQuestionRefs:
    - QI006
    - QI015
    - QI022
    - QI025
    relatedTableRefs:
