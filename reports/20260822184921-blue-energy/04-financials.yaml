- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue / backlog / signed contract values
    - Without these, revenue quality and market traction cannot be judged
    - Request signed contracts, backlog bridge, and milestone-payment schedule
  - - Cash balance / burn / runway
    - Without these, investors cannot assess financing urgency or dilution risk
    - Request CFO cash report and 18-month operating plan
  - - Customer concentration / pipeline stage map
    - Without this, Blue Energy may be over-indexed to one flagship project
    - Request CRM export with deal stage, MW size, and next gating milestone
  - - Project-finance architecture
    - Without this, the core business-model claim remains largely narrative
    - Request sources-and-uses, lender deck, and debt-equity stack by phase
  - - Gross-margin and capex assumptions
    - Without this, the economics of the USD5k/kW claim cannot be tested
    - Request project model with sensitivity cases for delay, fuel, and equipment cost
  - - Revenue recognition policy
    - Without this, early monetization claims cannot be mapped to accounting reality
    - Request controller memo or audited statement footnotes once available
  notes: These are the highest-priority diligence blockers because every one of them directly changes valuation, dilution, or solvency conclusions.
