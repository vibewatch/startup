- id: cost-structure-working-capital-and-capex
  title: Cost structure, working capital, and capex
  body: |-
    Blue Energy likely enjoys one important cost advantage relative to some peers: it is not funding a wholly proprietary reactor program from scratch. Using GE Vernova Hitachi's BWRX-300 shifts some technology-development burden outside the company and may improve lender comfort versus more novel fuel or reactor pathways. But this is only a partial relief. Project development, site work, turbine procurement, licensing, balance-of-plant integration, and financing orchestration remain expensive even when the reactor technology comes from a partner.

    Public evidence suggests the capital burden is enormous. The Port of Victoria referenced more than USD1 billion of first-phase investment, while Blue Energy's own homepage cost claim of roughly USD5,000 per kW implies around USD7.5 billion of nuclear-build capital for 1.5 GW before the gas phase or ancillary scope are layered in. Those figures are not clean apples-to-apples accounting metrics, but together they show the same thing: Blue Energy is building an infrastructure business with capex measured in billions, not a normal venture software company.

    Working capital and margin risk are also intertwined with schedule. Long-lead equipment and early site activities bring cash needs forward. Fuel availability and licensing milestones can delay revenue without proportionately delaying fixed spend. And broader sector evidence from GAO and IEEFA keeps alive the risk that even well-framed nuclear projects suffer from overruns that compress margins or force new financing on unattractive terms.
