- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - FID / financing slippage
    - No visible progress toward 2027 FID path
    - Key permitting or financing steps fail to appear on expected cadence
    - Move from constructive monitoring to thesis-break review
  - - Gas bridge becomes end state
    - Early gas milestones advance while nuclear milestones drift materially
    - Project narrative shifts from bridge to indefinite gas dependency
    - Re-rate thesis downward and challenge financeability claim
  - - No customer broadening
    - No second credible customer / site path emerges
    - Customer story remains Crusoe-only for too long
    - Increase concentration discount
  - - Partner stack weakens
    - GE, Crusoe, or strategic backer commitments materially narrow
    - Any key counterparty exits, delays, or reduces scope
    - Escalate counterparty risk and valuation haircut
  - - Execution detail stays private
    - Operating, cyber, or financing detail remains unavailable late into process
    - Key diligence questions stay unanswered near major milestones
    - Do not underwrite optimistic base case
  notes: These triggers are designed to be monitored continuously, not only at financing events.
