- id: operational-quality-and-schedule-risk
  title: Operational, quality, and schedule risk
  body: |-
    Blue Energy's core execution gamble is the phased gas-to-nuclear handoff. That is simultaneously the company's most interesting innovation and one of its biggest operational risks. If early gas power arrives but nuclear conversion lags, the project can preserve some superficial momentum while still failing to deliver its full strategic promise. That creates a distinctive failure mode relative to more conventional single-phase nuclear builds.

    Quality and schedule risk are tightly linked. The QA program is evidence that Blue Energy is taking formal controls seriously, but there is a big difference between preparing quality systems and proving them under real procurement, module fabrication, field assembly, and licensing stress. Public schedule variation across Blue Energy materials is therefore more than a messaging issue; it is a direct trust and underwriting issue.

    Broader nuclear history keeps the base rate sober. GAO and IEEFA provide strong reasons to assume that cost and schedule optimism can break badly in real projects. Blue Energy does not need to be worse than the sector to disappoint investors. It only needs to prove less repeatable than it claims.
