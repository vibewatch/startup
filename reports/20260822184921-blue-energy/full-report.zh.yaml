      - number: '2.3'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 第一条公开买方路径穿过 AI 基础设施，而不是传统受监管公用事业。在 Crusoe 渠道里，买方是园区开发商或基础设施发起方， 终端用户是 AI
              或数据中心运营方，付款逻辑很可能落在专门的项目融资或承购结构里，而不是广泛零售电价基础。仅这一点就让 Blue Energy 的进入市场路径更接近超大规模基础设施采购，而非经典公用事业资源规划。


              第二条可能渠道是先进制造，这既出现在 Blue Energy 自有材料中，也出现在 Texas 核能行业信息里。这些客户可能不那么在意纯碳叙事，
              更在意可靠的兆瓦级供电、开发速度，以及让电力与生产同址部署的能力。两条渠道里，电力可得性本身都正在成为选址筛选器。 Texas 报道和 Bloom 调查都显示，电网和并网约束收紧时，自带电力策略的项目更有优势。


              因此，采用路径会很快收窄。漏斗顶部不缺需求认知，但只有一小部分场址同时具备土地、水源或港口通道、输电、光纤、燃料、政治条件和交易对手质量。 Blue Energy
              的挑战，是证明自己能反复带买方穿过这些筛选器，而不只是赢下一次象征性的 AI 园区公告。
