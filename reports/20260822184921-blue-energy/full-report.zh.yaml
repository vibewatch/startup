  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、置信度与当前价格背景
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 已经有资格留在投资委员会议程上。2026 年 4 月的 USD380 million 融资，对于一家 2023 年成立的公司来说异常大；媒体报道说该轮融资把公司估值推到 USD1
              billion 以上；Constellation 随后的投资又增加了战略背书。上述事件都是真信号，不是装饰性指标。它们说明，成熟资本提供方相信 Blue Energy
              有可信机会，把大负荷电力需求转成可融资的核能开发平台。


              问题在于，当前价格容易描述，却难以承销。已保留的公开记录仍未披露收入、积压订单、已实现定价、项目级合同经济性、现金余额、债务条款，或决定真实投资人回报的股权结构保护。因此，基于公开证据的正确判断不是买入，而是观察
              / 继续研究。委员会可以因为战略格局强而继续尽调，但不能因为核心估值分母仍是私有信息，就给出不看价格的确信。


              因而，立场应当平衡。从绝对值看，Blue Energy 并不显然估值过高；当市场相信长期可选性时，先进核能上市股票已经能达到数十亿美元估值。但 Blue Energy
              还没有足够的公开运营证据或融资透明度，无法只因为独角兽估值本身就认为有吸引力。除非私有尽调证明首个旗舰项目如何把资本转成产现金资产，否则当前估值应视为合理到偏高，置信度中等、风险高。
