              因此，现在正确的采用指标不是使用量统计，而是里程碑代理：场址选择权已锁定、合作伙伴已公布、融资已到位、监管路径已打开、供电时间已有公开框架。相反，公开来源没有披露已服务客户、已交付兆瓦时或利用率。投资人必须把关系证明和运营证明区分清楚。


              从证据质量看，Crusoe 是最强信号，因为双方都确认，且有行业媒体支撑。Port of Victoria
              也有意义，但角色不同：它验证场址和本地支持，本身不验证终端需求。两者合在一起，形成了连贯的旗舰故事，但还不是多元化客户基础。
