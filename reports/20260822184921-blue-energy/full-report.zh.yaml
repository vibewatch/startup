      - number: '4.3'
        title: 成本结构、营运资金与资本开支
        blocks:
          - type: paragraph
            body: >-
              相比部分同行，Blue Energy 可能有一项重要成本优势：它不用从零资助一个完全自研的反应堆项目。采用 GE Vernova Hitachi 的
              BWRX-300，把部分技术开发负担转到公司外部；相比更新颖的燃料或反应堆路径，也可能提高贷款方舒适度。但这只能缓解一部分压力。
              即使反应堆技术来自伙伴，项目开发、场址工作、汽轮机采购、许可、电厂配套系统集成和融资编排仍然昂贵。


              公开证据显示，资本负担巨大。Port of Victoria 提到一期投资超过 USD1 billion；Blue Energy 自己官网约 USD5,000 per kW
              的成本主张，则意味着在叠加天然气阶段或辅助范围之前，1.5 GW 核能建设资本约为 USD7.5 billion。 这些数字不是干净的同口径会计指标，但合在一起说明同一件事：Blue Energy
              正在建设的是资本开支以十亿计的基础设施业务， 不是普通风险软件公司。


              营运资金和利润率风险也与进度交织。长周期设备和早期场址活动会把现金需求前置。燃料可得性和许可里程碑可能推迟收入， 但固定支出未必同比例推迟。GAO 和 IEEFA
              的更广行业证据也让一种风险继续存在：即便叙事良好的核能项目，也可能超支， 从而压缩利润率，或迫使公司以不具吸引力的条款再融资。
