    rows:
      - - 乐观
        - 旗舰项目里程碑按时降险，项目融资变得清晰，客户 / 场址证据拓宽
        - 当前 >$1B 估值可能显得保守；上行来自稀缺性叠加执行
        - 仍取决于重资本投入和多方协调
        - 有可能，但需要真实里程碑证据，而不是叙事动能
      - - 基准
        - 战略意义仍在，旗舰项目推进，但合同经济性和融资条款仍部分保密
        - 估值可以守住或小幅扩张，但安全边际不宽
        - 稀释、进度漂移和集中度限制上行空间
        - 最符合当前公开证据
      - - 悲观
        - 进度滑坡、客户证据仍然狭窄，或临近资本决策时融资不透明加剧
        - 即使项目没有彻底失败，独角兽估值也可能压缩到降轮区间
        - 叙事溢价消失快于底层资产质量
        - 可信，因为风险簇高度耦合
      - - 结构化上行
        - 即便公司质量不变，投资人也拿到里程碑条款、下行保护或更好价格
        - 回报潜力靠条款纪律改善，而不是靠乐观估值扩张
        - 需要管理层配合和强信息权
        - 如果当前价格不动，这是最可投路径
    notes: 情景逻辑以里程碑为基础，因为公开证据不足以支撑精确的收入倍数模型。
