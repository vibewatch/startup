      - number: '1.4'
        title: Texas 园区、客户证明与监管路径
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 的首个项目异常具体，尤其考虑到它是一家 2023 年才成立的核能初创公司。Port of Victoria 在 2025 年授予约 70 acres 期权协议；Crusoe 公开把
              Blue Energy 与附近一个位于 Calhoun County、占地 1,600 acres 的 AI 工厂园区绑定。Blue Energy、Crusoe 以及后来的 GE Vernova
              材料都把该场址描述为围绕 AI 用电需求展开的多吉瓦项目。 公开来源还量化了地方经济预期：港务局称一期投资超过 USD1 billion，并带来约 100 个永久岗位。


              但公开时间表需要仔细拆解。Crusoe 的 2025 年公告称，天然气过渡电力最早 2028 年上线，核能发电到 2031 年实现。 到 2026 年 8 月，GE Vernova Hitachi
              协议给出更细的分阶段计划：2029 年交付两台燃气轮机，2030 年前后由天然气提供约 1 GW，BWRX-300 机组最早 2032 年上线后提供约 1.5 GW 核能出力。这些说法不一定互相矛盾，但确实说明
              Blue Energy 需要纪律严明地解释每个日期具体指什么。


              许可层面，Blue Energy 看起来已经领先于许多年轻气候基础设施公司。NRC 记录显示，预申请工作始于 2025 年 3 月； 该机构的 Blue Energy
              案卷包括质量保证计划、监管沟通计划，以及已获批准的 BE-BOPTR-02 施工重排序专题报告。 Blue Energy
              把这项重排序批准视为关键解锁点，因为它允许非核范围和燃气轮机通电先于完整核能完工推进。如果这个排序在执行中真的站得住， 它就是公司最具差异化的监管资产。
