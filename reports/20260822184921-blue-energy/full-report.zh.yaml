        title: 退出准备度、投资逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              本次保留的公开记录看不到退出准备度。Blue Energy 对公用事业、核能 OEM 生态、超大规模云厂商相邻基础设施和项目融资平台都有合理的战略相关性，但没有公开来源披露 IPO
              时间、老股交易市场或主动出售流程。因此，最终尽调议程比对赛道的泛泛兴奋更重要。投资人不仅要知道公司是否有前景，还要知道如果旗舰项目耗时更长、成本更高，当前价格和条款能否保护自己。


              最重要的投资逻辑破裂触发点很具体。若燃气里程碑兑现但核能转换时间转弱，公司可能看似取得进展，实则削弱差异化。若客户证据仍窄窄集中在一条旗舰路径，即便没有技术失败，估值也可能压缩。若融资架构、合同权利或股权结构经济性在重大里程碑前后仍不透明，市场信号会在投资人最需要时变得更不可信。


              最后的尽调清单很直接：股权结构表和清算优先权、项目融资资金来源与用途、合同经济性和终止权、旗舰项目里程碑定义表，以及管理层能否从一个证明点扩展成可复制平台的证据。在这些问题审阅完之前，最有纪律的立场是继续尽调
              Blue Energy，而不是强行给出确信买入或条件反射式放弃。
