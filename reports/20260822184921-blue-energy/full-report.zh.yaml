  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 的市场常被简单说成「AI 核能」，但抓取记录支持一个更窄、也更有用的定义。公司追逐的是超大负荷： 它们需要稳定电力，能证明专用基础设施的合理性，并极度重视工期确定性。Crusoe
              已宣布园区就是最清晰的例子： 一个以吉瓦计量的 AI 工厂场址，连接管道、光纤和与港口相连的土地。这类需求不同于居民清洁能源、小型社区反应堆或普通商用发电。


              这个边界很重要，因为它同时说明该纳入什么、排除什么。纳入的需求以超大规模 AI 园区为主，第二层是重视全天候供电的先进制造或工业客户。
              排除或至少相距较远的需求包括普通零售负荷、小型表后韧性项目，以及广域公用事业服务区；在这些场景里，Blue Energy 基于驳船的物流或分阶段建设优势未必那么关键。


              边界收窄后，替代方案也更清楚。买方可以排队等待公用事业并网，自行采购天然气发电，组合可再生能源与储能，或与其他核能开发商签约。 因此，Blue Energy
              不只是与核能同行竞争；它面对的是所有获得快速、稳定、大规模电力的路径。
