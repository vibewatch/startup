            body: >-
              Blue Energy 目前最清晰的客户分群，是大负荷 AI 园区。Crusoe 是旗舰信号：这家公司先从能源切入 AI 工厂，正好贴合 Blue Energy
              自称要用专用稳定电力支撑数据中心级基础设施的目标。在这条渠道里，买方看起来是园区开发商或项目发起方，使用方是数据中心或 AI 算力运营方，付款方很可能是签约承购方或基础设施发起方，而不是零售公用事业客户。


              公开材料也指向相邻但证据更弱的分群。Blue Energy 自己提到先进制造；类似公用事业或公共电力的需求，也作为更宽泛的核能客户类别在背景中存在。但在 Blue Energy
              自身案例里，这些分群大多还停留在叙事层面，因为已抓取资料中还没有公开具名的工业或公用事业客户。


              Google、Meta、Dow 和 TVA 作为 Blue Energy
              客户的重要性不如作为分群验证。它们显示，正在考虑或采购先进核能相邻电力的买方画像包括超大规模云厂商、工业运营商和公共电力机构。上述画像支撑了 Blue Energy 的分群选择，但也说明它自己的客户覆盖仍然很窄。
