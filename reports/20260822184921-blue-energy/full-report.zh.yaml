      - number: '3.2'
        title: 同行画像与商业模式
        blocks:
          - type: paragraph
            body: >-
              Oklo、Kairos、NuScale、X-energy、TerraPower 和 Holtec 从不同角度给 Blue Energy 带来压力。Oklo 在 AI 需求上是最干净的直接挑战者，因为它与 Meta
              的协议展示了 1.2 GW 园区开发计划，还披露了推进燃料采购和开发工作的预付款机制。 Kairos 提供了第二种企业需求模式：与 Google 签订多电站协议，并明确披露覆盖能源、辅助服务和环境属性的
              PPA。两者都重要， 因为它们展示了客户支持型商业化形式，而 Blue Energy 尚未在公开层面给出同等细节。


              NuScale 和 Holtec 代表另一类压力。它们的公开材料强调轻水堆熟悉度、面向监管的成熟度，以及定义清楚的反应堆产品。 NuScale 强调其已获 NRC 批准的 77 MWe 模块，以及与 ENTRA1
              的独家商业化关系；Holtec 强调标准 PWR 燃料、 Palisades 选址、分阶段许可和 Mission 2030 部署目标。贷款方或交易对手如果更看重常规核能熟悉度，而不是 Blue Energy
              更新颖的交付模式，这些叙事可能很有共鸣。


              X-energy 和 TerraPower 扩展了比较面，而不是完美对标。X-energy 最强的公开证明是 Dow Seadrift 工业项目； 在那里，电力加高温蒸汽与原始兆瓦数同样重要。TerraPower
              的 Natrium 平台围绕电网灵活性、储能和 DOE 支持的 Wyoming 示范项目展开。这些同行说明，先进核能需求不是一个单一市场；Blue Energy 的 AI
              园区切入点真实存在，但它要与相邻路径竞争， 后者可能更直接解决不同客户问题。
