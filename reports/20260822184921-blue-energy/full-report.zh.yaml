  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 有监管进展，但还没有监管闭环。NRC
              预申请记录和已接受的专题报告显示，公司已经不再只是概念阶段的核能叙事。但同一份记录也说明，未解问题仍然很多。能帮助重排施工顺序的专题报告有价值，但前提是经得起完整的场址专项审查，且不会在每个阶段究竟能建设哪些内容、并网送电到什么程度、融资哪些资产的问题上制造新的下游疑问。


              最好的参照不是零风险案例，而是整个行业。Holtec 的分阶段许可、Kairos 的 Hermes 许可都显示，先进核能项目即便在推进，也仍处在漫长、分阶段的监管旅程里。Blue Energy
              可能选择了一条更务实、更可融资的路径，但并没有摆脱核能许可的结构性负担。


              法律和政治层面的叠加也很重要。场址集中在 Texas 可以是优势，但这也意味着社区、环境和地方审批的耐久性，比头条式合作叙事暗示的更关键。投资人应把监管进展视为真实的风险缓释，而不是已经解决的问题。
