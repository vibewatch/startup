      - number: '1.3'
        title: 资本形成、利益相关方与战略支持者
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月融资把 Blue Energy 从有意思的概念推成了可信的风投支持平台。公司声明、PRNewswire 和 TechCrunch 都指向同一个核心数字：USD380 million。Blue
              Energy 称该轮由 VXI Capital 领投，Engine Ventures 大力支持， At One Ventures 和 Tamarack Global 参投；TechCrunch
              还补充，这笔融资同时包含股权和债务。这个区别很重要： 大额混合融资可以说明公司确实拿得到资本，但在条款披露之前，也可能遮住结构、优先级和下行保护。


              围绕估值的公开评论方向偏乐观，但证据仍薄。第三方媒体把这一轮描绘成独角兽诞生事件，但所审阅材料中没有公开文件给出每股价格、 清算优先权或所有权转让细节。更稳妥的结论是：Blue Energy
              在极早期已经明确吸引到重要金融支持，但外部人仍无法精确评估其股权结构表。


              2026 年 7 月 Constellation 投资的战略价值可能不亚于现金本身。Constellation 带来美国最大核电机组组合的运营可信度； GE Vernova Hitachi 为 Texas
              场址补上具体的反应堆 / 汽轮机路线。Crusoe 和 Port of Victoria 则提供商业与地点证明。 这组组合意味着 Blue Energy
              不再只是拿商业计划书融资；它正在搭建一个覆盖资本、客户、技术、场址控制和最终运营的利益相关方栈。 但这些关系里嵌入的具体治理权和商业权利仍未公开。
