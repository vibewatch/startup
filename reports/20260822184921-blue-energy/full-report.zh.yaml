        - 要求提供带负责人和日期的一体化里程碑跟踪表
      - - 管线广度
        - 当前旗舰之外的第二场址或第二需求锚证据
        - 检验 Blue Energy 是单资产故事，还是可复制平台
        - 审查活跃管线和带日期的交易对手
      - - 流动性路径
        - 董事会对 IPO、老股交易或战略退出时点的判断
        - 只有存在可实现退出路径，私人市场价值才有意义
        - 审查董事会材料；如有，审查投行沟通记录
    notes: 这些问题按其改变投资建议、估值立场或下行保护的直接程度排序。
