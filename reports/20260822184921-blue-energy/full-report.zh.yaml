  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 的公开财务身份仍然面向未来。抓取记录中，公司没有披露收入、年经常性收入（ARR）或订单储备价值；
              也没有公开证据显示电力、开发费或里程碑付款已经形成实际定价。公司反而把自己定义为一个可项目融资的平台，
              负责开发、排序并最终交付大型核能支撑电力资产。从财务上看，这意味着它更接近基础设施开发和长期合约电力，而不是一次性设备销售。


              这个区别很重要，因为它改变了投资人该问的问题。关键不只是 Blue Energy 能否卖出反应堆，而是价值如何在开发、建设、融资和最终运营之间累积。 如果 Blue Energy
              只有在完整核能运营后才收钱，模式会更加吃资本。如果它能更早变现场址工作、天然气过渡电力或开发里程碑， 现金流画像会显著改善。公开证据还没有回答这条线落在哪里。


              同行披露进一步说明，现在合同形式比标价更有信息量。Oklo 披露了与 Meta 的预付款机制；Kairos 披露了与 Google 的 PPA； NuScale 和 ENTRA1
              披露了项目化商业化平台。相比之下，Blue Energy 有叙事层面的商业化证明，但公开定价透明度很低。 这不代表模式弱，却确实让承销更难。
