      - number: '2.4'
        title: 驱动因素、约束与最稳妥的市场结论
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 机会背后的核心驱动是真实的：超大负荷客户越来越需要比单靠电网更快拿到电力。EPRI、Goldman、IEA 和 Texas 专项报道都强化了这个需求背景。Blue Energy
              的分阶段气转核模式正是要利用这一错配——先给速度，后给核能。 如果模式跑通，愿意考虑核能支撑基础设施的买方集合可能扩大。


              约束同样真实。HALEU 可得性仍是先进核能的广泛瓶颈。核能项目交付历史足够糟，GAO、IEA 和 IEEFA 都给出了可信的怀疑理由。 Blue Energy
              还面临自我收窄：基于驳船的物流、极大的项目规模，以及买方必须足够成熟，能围绕复杂交付和转换里程碑签约。


              因此，最稳妥的市场表述不是 Blue Energy 有一个明天就会签约的无限总可用市场（TAM）。更准确地说，Blue Energy
              所处的用电需求环境在经济体中结构性吸引力最强之一；但一旦加入商业、地理、燃料、融资和监管筛选，可实现市场会急剧收窄。 这仍足以支撑严肃投资兴趣，只是不足以让人轻描淡写地越过转化风险。
