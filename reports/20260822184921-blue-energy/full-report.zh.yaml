chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、产品与部署模式
        blocks:
          - type: paragraph
            body: >-
              更准确地说，Blue Energy 是一家核电站部署公司，而不是新反应堆科研项目。公司公开材料一贯把它描述为可融资、
              预制化核电站开发商，电站可以承载已验证的反应堆技术，而不是从零发明新的堆芯设计。这个定位很关键： Blue Energy
              的商业逻辑正对美国核电的历史痛点——建设成本难预测、工期滑坡、融资结构让私人基础设施资本却步。


              公司的答案是工业化建设。Blue Energy 称，将在现有造船厂和制造场地异地建造大型电站模块，再用驳船运到最终地点做模块化安装。 TechCrunch 和公司材料都把这个概念归因于 LNG
              与海上能源建设经验，而不是激进的新反应堆技术。Blue Energy 还称其架构不绑定反应堆， 尽管首个已宣布的 Texas 项目现在已经与 GE Vernova Hitachi 的 BWRX-300 SMR
              深度绑定。


              Blue Energy 也把压缩工期放在差异化核心。不同文件里，公司把通电时间写成不超过 48 个月；在 Crusoe 与 Victoria 的 客户 / 项目材料中，如果采用天然气过渡方案，则是不超过 36
              个月。共同主线不变：Blue Energy 想先让非核电厂配套系统通电， 再在后期切换到核能。这个说法比承诺奇迹反应堆更可信，但投资人仍需要严格界定每个公开日期到底衡量哪一个里程碑。
