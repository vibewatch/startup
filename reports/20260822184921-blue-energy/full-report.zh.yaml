      - number: '3.4'
        title: 切换成本、护城河耐久度与最稳妥结论
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争问题，是 Blue Energy 的优势什么时候会固化为粘性。在项目达到最终投资决定之前，买方仍可比较电网升级、天然气发电、 Blue Energy
              和多个核能同行。一旦场址、承购结构、许可路径和燃料策略开始固化，切换成本会迅速上升，因为更换供应商也可能意味着更换反应堆类别、
              交易对手和时间表。这让早期管线证据格外重要：谁先通过前几个可融资筛选，谁就可能在大额收入到来前形成事实护城河。


              因此，Blue Energy 的护城河主张可信但脆弱。Crusoe 需求证明、Texas 场址进展、GE Vernova 对齐和分阶段建设逻辑的组合， 很难被立刻复制。但竞争者可以从不同方向进攻。Oklo 和
              Kairos 能拿出更清楚的公开合同结构；NuScale 和 Holtec 能拿出更传统的信任信号；X-energy 和 TerraPower 在某些工业或电网用例上可能更契合。整个赛道还暴露在一个悲观情景下：
              SMR 仍然太贵、太慢，难以在有吸引力的时间线上商业化规模化。


              最稳妥的投资人结论不是 Blue Energy 独一无二、不可击败。而是：公司在一个战略上有意思的市场位置形成差异化，
              但在证明可重复客户转化、更清晰商业条款，以及执行表现优于那些今天至少在一个主要维度更强的同行之前，它的优势仍会脆弱。
