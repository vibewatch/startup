      - number: '8.2'
        title: 可比估值框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              可比公司集合不能给出机械估值锚，但能帮助划定边界。Oklo 和 NuScale
              是最相关的先进核能上市股参照，因为它们代表投资人愿意在传统公用事业口径下尚未看到大规模经济成熟前，先资助核能商业化故事。两者公开估值分别约为 USD7.82 billion 和 USD3.85
              billion，明显高于 Blue Energy 已披露的 >USD1 billion 私有市场底线。这意味着，Blue Energy 并不是把自己定价到高于所有公开核能增长叙事。


              与此同时，GE Vernova、Constellation、Cameco、Vistra、Dow、Meta 和 Centrus
              的公开市值说明，不同参照类别的表现差异很大。有些是拥有多元化盈利的巨型在位运营商，有些是核燃料或大宗商品相邻公司，还有些只是客户资产负债表参照，而不是直接可比公司。这些参照能回答数十亿美元结果是否可能，不能回答
              Blue Energy 今天是否配得上。上市公司还会持续向 SEC 报告并每天重定价，而 Blue Energy 的私募估值只间歇披露，透明度也更低。


              因此，入场纪律很重要。当前价格在方向上可能可信，但投资人仍应坚持更好条款或更好证据。更低价格、按里程碑分批投入、下行保护，或更清晰的项目融资可见度，都会改善交易设置。若缺少其中至少一项，可比公司工作只支持「有可能」，不支持「有安全边际」。
