      - number: '6.4'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 的上行空间，来自一个旗舰 AI 园区路径能否变成可复制模板。若跑通，扩张可以体现为更多园区、更多场址，或向先进制造渗透更深。EPRI、Goldman 和 Bloom
              给出的更大需求背景，让这种路径具备可信度。


              但今天的集中度风险很明显。公开证据指向一个具名需求伙伴、一个主要地区、一个场址生态，以及一个主导硬件 / 交易对手组合。这种证据足以验证客户相关性，但不足以证明商业覆盖面。参照组很有启发：Oklo 有
              Meta，Kairos 有 Google，X-energy 有 Dow。Blue Energy 属于这个严肃同业组，但还需要不止一个旗舰项目，才能证明多元化可持续。


              因此，最稳妥的客户结论应当保持平衡。和许多前沿能源创业公司相比，Blue Energy 拥有更实在的早期需求证据；但从客户牵引看，它仍高度集中且尚未投运。扩张是下一步证据，不是已经被证明的事实。
