      - number: '7.2'
        title: 运营、质量与进度风险
        blocks:
          - type: paragraph
            body: >-
              Blue Energy
              的核心执行赌注，是分阶段从燃气交接到核能。这既是公司最有意思的创新，也是最大的运营风险之一。若早期燃气电力到位但核能转换滞后，项目可以维持某种表面进度，却仍无法兑现完整战略承诺。相较更传统的单阶段核能建设，这会形成一种独特失败模式。


              质量风险和进度风险紧密相连。QA 项目说明 Blue Energy 严肃对待正式控制，但准备质量体系和在真实采购、模块制造、现场装配、许可压力下证明这些体系，中间差距很大。因此，Blue Energy
              公开材料中的进度差异不只是口径问题，而是直接的信任和承销判断问题。


              更长的核能行业历史让基准判断必须保守。GAO 和 IEEFA 给出了强理由，让人假设真实项目里的成本和进度乐观主义可能严重失效。Blue Energy
              不必比行业更差也会让投资人失望；只要可复制性低于自己的说法，就够了。
