      - number: '3.3'
        title: 能力、信任与渠道对比
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 最强的比较特征不是更好的反应堆参数表，而是具名 AI 负荷需求、项目融资框架、分阶段气转核排序和造船厂式物流的组合。
              这套组合瞄准的是通电速度和融资务实性，而不是热力学新意。代价是，Blue Energy 继承了对 GE Vernova 硬件的集中依赖， 并且必须证明它的排序逻辑经得起客户、监管机构和贷款方审视。


              相比之下，NuScale 和 Holtec 用更简单的信任叙事竞争。两者都建立在轻水堆熟悉度和常规燃料形态上，也都在公开材料中突出监管进展。 TerraPower 和 X-energy 的技术独特性更强，但
              HALEU 或 TRISO 路径也带来更高燃料复杂度或首创项目复杂度。 Kairos 和 Oklo 位于中间：它们的企业需求渠道看起来具备商业相关性，但技术和执行路径仍有相当大的首创风险。


              对买方来说，供应商选择很可能取决于哪项约束最痛。如果痛点是 AI 级电力的时间，Blue Energy、Oklo 和 Kairos 最相关。如果痛点是工业蒸汽或煤电替代带来的电网灵活性，X-energy 和
              TerraPower 更相关。如果痛点是贷款方对标准燃料和成熟许可规范的舒适度， NuScale 和 Holtec 可能占优。因此，Blue Energy 有可信切入点，但没有垄断问题定义。
