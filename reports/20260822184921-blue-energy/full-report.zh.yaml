        title: 明确不确定性下的乐观、基准与悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              Blue Energy
              没有公开收入分母，情景分析必须从里程碑开始，而不是从整齐的销售倍数开始。乐观情景需要的不只是对核能需求乐观，还需要场址专项监管进展、更清晰的最终投资决定时间、更强证据证明燃气加核能排序确实改善可融资性，并且至少部分突破单一具名客户路径故事。若这些要素咬合，今天的独角兽估值标记相对于后期战略价值可能会显得保守。


              基准情景更克制，也最符合当前证据。在这种路径下，Blue Energy
              保持战略相关性，守住核心合作关系，并把旗舰项目推进到足以避免信心断裂的程度；但融资和合同经济性仍有大量未解缺口。沿着这条路，当前估值可以维持或温和扩张，但稀释风险以及缺乏一个场址可扩成可复制舰队项目的公开证明，会限制上行空间。


              悲观情景不需要公司彻底失败。只要进度漂移、客户集中、合作伙伴延迟或融资不透明中的若干因素叠加，叙事就可能从高溢价可选性转成下轮融资风险。因此，最有用的区间工作不是精确公允价值模型，而是一组投资委员会边界：这些边界把执行质量翻译成估值结果，并明确哪些证据会改变结论。
