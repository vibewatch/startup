  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与资产图谱
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 的产品更适合理解为可融资核电站部署平台，而不是单一反应堆 SKU。公开材料持续强调项目融资、预制化、物流，
              以及与领先反应堆技术兼容。因此，分析单元应是一个电站系统：场址、硬件栈、排序计划和客户结果，而不只是反应堆堆芯。


              可见资产组合也反映了这个方向。Blue Energy 的公开产品包括 Texas 旗舰场址路径、Blue Way 预制化模式、气核一体架构、 监管排序策略，以及围绕 GE Vernova 燃气轮机和
              BWRX-300 构建的伙伴硬件选择。换句话说，公司正在把开发诀窍、 物理架构和交易对手打包成产品化部署动作。


              这个框架在战略上重要，因为它解释了 Blue Energy 为什么不发明新反应堆也能看起来有差异化。公司试图把大型核能支撑电力资产的组装、
              融资和交付方式标准化。如果成功，即便大量反应堆科学留在伙伴手里，也可能具备商业价值。
