  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局边界与最接近的可比公司
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 身处拥挤的先进核能赛道，但最直接的竞争范围比整个 SMR 版图更窄。抓取证据指向两组直接可比对象。 第一组是追逐大负荷数字基础设施客户的核能开发商，其中 Oklo 和 Kairos
              最重要，因为两者都有绑定数据中心或超大规模云负荷的具名企业需求路径。 第二组是 NuScale、Holtec 这类轻水堆或监管前置型供应商；它们未必拥有 Blue Energy 同样的 AI 园区切入点，
              但会在可信度、许可熟悉度和可融资性上竞争。X-energy 和 TerraPower 更相邻而非完全相同，因为公开证据最强的案例更偏工业蒸汽、 电网平衡或煤电场址替代，而不是 Blue Energy 首个
              Texas AI 园区叙事。


              这个区分很重要，因为 Blue Energy 卖的不是与所有同行相同的东西。许多竞争者主要仍在推销反应堆技术。Blue Energy
              的公开说法不同：它把已知伙伴硬件包进一套融资和施工排序逻辑，目标是更早交付电力，让项目更容易承销。这给了公司脱颖而出的机会； 但也意味着投资人比较 Blue Energy
              时，不能只看反应堆属性，还要看场址控制、客户渠道、合同结构和资本栈。


              大负荷替代集合更宽。Blue Energy 还要与等待电网、自建天然气发电、可再生能源加储能组合，以及更成熟监管路径的轻水堆方案竞争。
              结果是，公司可能并不是输给另一家初创公司，也可能只是输给买方的一项判断：常规电力基础设施已经够用。
