      - number: '5.3'
        title: 差异化、路线图与同行基准
        blocks:
          - type: paragraph
            body: >-
              理解 Blue Energy 产品成熟度最清楚的方法，是与同行比较。Kairos 正通过 Hermes 和 Hermes 2 测试反应堆积累成熟度， 在 NRC 施工许可下明确推进 TRISO 燃料、HALEU
              和蒸汽循环学习步骤。Holtec 提供更常规的轻水堆产品。 TerraPower 强调带储能的电网响应。X-energy 强调电力加工业蒸汽。在这个格局中，Blue Energy 的突出点是围绕伙伴硬件优先部署，
              而不是把专属反应堆测试项目放在最前面。


              这个策略有收益，也有成本。收益是 Blue Energy 可能避开一部分自研反应堆并单独去风险的技术和资本负担。成本是，
              公司更多差异化必须来自架构、物流、融资和进度纪律。迄今为止，公开路线图证据支持里程碑级进展——NRC 预申请工作、 BE-BOPTR-02 路径、GE 协议，以及 2027、2030 和 2032
              的公开日期标记——但没有详细工程发布透明度。


              因此，投资人不应主要用原始反应堆新意来衡量 Blue Energy，而应看它能否证明自身排序和建设逻辑比同行测试反应堆路径或公用事业式路径成熟得更快。
              产品技术问题不只是「反应堆可信吗？」还包括「交付系统是否可信地走向工业化？」。
