      - number: '6.3'
        title: 留存、耐久性与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              公开留存证据几乎不存在，这符合 Blue Energy 目前所处阶段。已抓取记录里没有披露合同期限、续约率、NRR、GRR、流失或满意度评分。因此，耐久性现在只能从项目结构推断，不能从客户队列实测。


              结构性推断是，切换成本前低后高。场址、许可和融资定型前，潜在客户仍可拿 Blue Energy
              与电网、燃气或其他核能路径比较。上述决策定型后，改道会明显更贵，因为客户路径已经绑定具体土地、设备、交易对手和时间表假设。这种留存动态可能有利，但要等 Blue Energy 拥有真实客户队列后才能验证。


              采购摩擦也因此很高。客户不仅要评估电价，还要评估土地、输电、监管顺序、合作伙伴组合，以及分阶段燃气转核能建设是否可信。获客会变慢、客户会更集中；但一旦项目走到完整承诺阶段，单个胜利也可能异常黏。
