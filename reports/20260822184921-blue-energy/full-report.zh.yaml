      - number: '1.5'
        title: 反向因素与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 比普通前沿能源初创公司更有实质内容，但剩余缺口仍然重大。抓取到的公开来源没有披露收入、年经常性收入（ARR）、
              当前员工数、详细订单储备经济性、债务条款或项目级利润率假设。这一点尤其重要，因为公司声称的新意不是反应堆专利，
              而是显著更优的资金成本和建设风险画像。没有私有财务证据，外部人还无法验证这轮融资究竟代表真正的经济去风险， 还是只是市场继续追逐 AI 核能期权。


              Blue Energy 也无法完全摆脱更广的品类风险。它首个已宣布反应堆路径基于 BWRX-300；IEEFA 的反向外部分析认为， 相比拥护者的承诺，SMR 仍然太贵、太慢、风险太高。即便 Blue
              Energy 判断正确，更好的电站交付可以修复核电许多历史痛点， 这也不能消除技术项目风险、许可风险，或首创项目一旦进入实体建设后工期拉长的危险。


              最后，天然气过渡既是 Blue Energy 最强的创新，也是最清晰的脆弱点之一。它有吸引力，是因为可能更早打开现金流，
              并形成贷款方熟悉的融资结构；它也脆弱，因为如果临时天然气运营变得黏住，或核能交接反复延误，市场会严厉惩罚公司。 目前，Blue Energy
              值得作为美国核能部署的一次严肃执行实验来关注，但还不能视为已经跑通的基础设施工厂。
