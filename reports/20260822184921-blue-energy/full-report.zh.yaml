      - number: '7.3'
        title: 合作伙伴、融资与团队风险
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 对少数外部和内部节点的依赖异常高。GE 提供汽轮机和反应堆路径。Crusoe 提供最清晰的需求信号。Texas
              场址生态提供本地可行性。战略投资人提供可信度。公开可见的高管梯队相对小，却承载了大量投资逻辑。若所有节点同步推进，这种集中可以加速进展；但任何单个节点停滞，也会放大挫折。


              融资风险同样嵌在网络里。USD380 million 融资很重要，但还不是完整的项目资本答案。同业公开文件显示，先进核能公司经常面临流动性、合同授予和执行风险；Blue Energy
              不太可能因为是私营公司就例外。这不意味着资本结构薄弱，而是说明缺失细节比头条融资规模更重要。


              团队风险更隐蔽，但很实质。Blue Energy
              的产品不只是反应堆参数表，还部分是金融、许可和交付的跨职能编排；在这样的公司里，创始人与关键人集中风险更重。因此，领导层连续性、专业招聘深度和合作伙伴管理纪律，都应列为一线尽调主题。
