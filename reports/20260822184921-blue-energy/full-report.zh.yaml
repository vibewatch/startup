      - number: '2.2'
        title: 规模测算视角与需求证据
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模证据来自用电需求情景，而不是 Blue Energy 或投行给出的整齐美元口径总可用市场（TAM）。在抓取材料中， EPRI 2026
              年研究是最有决策价值的美国视角。它指出，数据中心已经是美国用电需求增长最快的来源，到 2030 年可能占美国总用电量的 9% 到 17%。Data Center Knowledge 的摘要把它换算成 2030
              年约 380 到 790 TWh，而 2024 年约为 177 到 192 TWh，显示规划区间已经变得很宽，但无疑很大。


              全球视角指向同一方向。IEA 称，到 2030 年数据中心用电需求可能达到约 950 TWh，AI 是重要加速器。Goldman Sachs 也把数据中心需求定义为结构性力量，正在把新型能源技术投资前置。对
              Blue Energy 来说，含义不是每一太瓦时都可触达； 而是漏斗顶部需求池已不再是约束。


              公开来源没有提供可靠的 Blue Energy 专属美元口径可获取市场（SOM）。从用电需求情景到合同规模、客户转化和单位经济性之间，
              仍缺一座桥。因此，投资人应把这个市场理解为物理需求很大，但只有一部分已经转化为对 Blue Energy 有用的商业价值。
