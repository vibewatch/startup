      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 面向资本密集、强监管市场，但公开叙事异常依赖创始人牵引。Jake Jurewicz 是官方公告和媒体采访中的核心发声人； 公司简介页也把他的能源战略、气候风险项目、施工相邻领域经验和
              MIT 核能学习经历放在故事中心。公开来源还显示 Matt Slotkin 是联合创始人，但画像不同：他更偏软件、产品和技术组织搭建，而非传统公用事业或反应堆运营。两人组合说明，Blue Energy
              的起点不只是经典公用事业孵化，也很大程度上来自项目开发设计和系统思维。


              这个故事不止是一页双创始人 PPT，关键在于 Blue Energy 已公开展示的招聘广度。公司简介页显示，它有意识地补齐监管、 许可、商业、项目融资、选址开发和电站运营岗位。NRC
              前员工出现在高级监管职位上；Tom O'Neill、Tim Hanley、Steve Bolze 等董事或顾问又带来 Exelon、Constellation、GE Power
              和基础设施运营经验。这家公司的瓶颈会在许可、签约、施工排序和利益相关方管理， 而非纯反应堆 R&D；这类人才密度是对的。


              不过，治理透明度仍不完整。Blue Energy 公开列出部分董事和领导层姓名，但没有披露董事会控制权、投资人权利、 所有权和保护性条款的完整分布。因此，公司在运营招聘上的可信度高于治理披露。公开传播高度集中在
              Jurewicz 身上，也意味着在项目进度和伙伴组合不再依赖这一单一叙事锚点之前， 创始人可信度仍是实质性的关键人物风险。
