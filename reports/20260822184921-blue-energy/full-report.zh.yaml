      - number: '4.2'
        title: 销售动作与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Blue Energy 的进入市场动作看起来是低量、极高价值的企业销售。Crusoe 是第一个具名需求伙伴；Port of Victoria 加上 NRC
              预申请工作说明，商业进展离不开选址、许可和基础设施对齐。这不是一个能用公开漏斗数据估算获客成本（CAC）或回本周期的模式。 在这个模式里，多一个合格场址或一份贷款方支持的条款清单，可能比几十次漏斗顶部对话更重要。


              这个现实带来两种相互竞争的解读。积极一面是，Blue Energy 不需要数百个客户也能支撑大公司；只要签约和融资正确，
              一两个旗舰项目就可能创造可观企业价值。消极一面是，公开商业证据高度集中。只有一个具名客户和一个具名旗舰场址， 投资人还无法评估胜率、续约逻辑或渠道宽度。


              需求背景是支持性的：EPRI、Goldman Sachs 和 Bloom 都显示，AI 时代电力短缺是真实的。但需求支撑不等于销售效率。 Blue Energy
              仍要证明，它能比同行或既有替代方案更快把紧迫性转化为可融资项目。
