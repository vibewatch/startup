      - number: '5.2'
        title: 架构、流程与部署模式
        blocks:
          - type: paragraph
            body: >-
              从高层看，Blue Energy 的公开架构是一套分阶段基础设施栈。大负荷客户需求和合格场址先行；早期非核开发和燃气轮机通电随后推进； BWRX-300 核岛再在后期上线，成为长期基荷锚点。Blue Energy
              材料明确把这一顺序与更早通电和更好的可融资性绑定。


              Blue Way 是把这些层连起来的核心运营概念。按 Blue Energy 自己的说法，它意味着异地预制、运输和超级模块组装， 用来改善工期、成本和执行确定性。BWRX-300 路径重要，是因为 GE
              称该反应堆使用商业可得燃料、材料用量更低， 并采用原则上支持更快部署的模块化 / 开顶施工方法。因此，Blue Energy 的产品主张有一部分其实是施工方法主张。


              仍缺的是全生命周期运营细节。公开记录更多讲 Blue Energy 打算如何建设，而很少讲它将如何在数十年里维护、换料、监控或为已部署电站配人。
              尽调时，这种沉默很重要：基础设施产品成败不只看首次建设，也同样取决于运营。
