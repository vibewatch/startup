company:
  name: Blue Energy
chapter:
  number: 1
  title: Company Overview
  summary: Blue Energy is a 2023-founded U.S. nuclear-deployment startup that raised USD380 million in April 2026 to commercialize a project-financed, shipyard-manufactured plant model rather than a novel reactor design. Public evidence already shows unusually strong counterparties for such a young company—Crusoe, GE Vernova Hitachi, Constellation, the Port of Victoria, and the NRC—but it does not yet disclose operating metrics, capital structure detail, or a fully reconciled schedule across its 2025-2026 announcements.
sections:
- id: identity-and-deployment-model
  title: Identity, Product, and Deployment Model
  body: |-
    Blue Energy is best understood as a nuclear-plant deployment company, not as a novel-reactor science project. Public company materials consistently describe it as a developer of financeable, prefabricated nuclear power plants that can house proven reactor technologies rather than invent a new core design from scratch. That positioning matters because Blue Energy's commercial thesis is aimed squarely at the historic pain point in U.S. nuclear: unpredictable construction cost, timeline slippage, and financing structures that repel private infrastructure capital.

    The company's answer is industrialized construction. Blue Energy says it will build large plant modules offsite in existing shipyards and fabrication yards, then move them to the final location by barge for modular installation. TechCrunch and company materials both tie the concept to lessons from LNG and offshore-energy construction rather than to a radically new reactor technology. Blue Energy further says the architecture is reactor agnostic, even though the first announced Texas project has now become closely associated with GE Vernova Hitachi's BWRX-300 SMR.

    Blue Energy also frames schedule compression as the heart of its differentiation. Depending on the document, the company describes time to power as either 48 months or less or, in customer/project materials tied to Crusoe and Victoria, as 36 months or less when the natural-gas bridge is used. The common thread is the same: Blue Energy wants to energize the non-nuclear balance of plant earlier, then transition to nuclear later. That is a more credible framing than promising a miracle reactor, but it still leaves investors needing a rigorous definition of which milestone each public date actually measures.
