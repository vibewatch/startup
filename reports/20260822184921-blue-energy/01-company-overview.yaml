- id: adverse-factors-and-diligence-gaps
  title: Adverse Factors and Remaining Diligence Gaps
  body: |-
    Blue Energy has more substance than the average frontier-energy startup, but the remaining gaps are still material. No fetched public source discloses revenue, ARR, current headcount, detailed backlog economics, debt terms, or project-level margin assumptions. That is especially important because the company's claim to novelty is not a reactor patent but a radically better cost of capital and construction-risk profile. Without private financial evidence, outsiders cannot yet verify whether the funding round represents true economic de-risking or simply continued appetite for AI-linked nuclear optionality.

    There is also a broader category risk that Blue Energy cannot entirely escape. Its first announced reactor path is BWRX-300-based, and adverse external analysis from IEEFA argues that SMRs remain too expensive, too slow, and too risky relative to their advocates' promises. Even if Blue Energy is right that better plant delivery can fix much of nuclear's historical pain, that does not remove technology-program risk, licensing risk, or the danger that first-of-a-kind schedules stretch once physical construction begins.

    Finally, the gas bridge is both Blue Energy's strongest innovation and one of its clearest vulnerabilities. It is attractive because it may unlock earlier cash flow and a finance structure lenders recognize. It is vulnerable because the market will judge the company harshly if temporary gas operation becomes sticky or if the nuclear handoff slips repeatedly. For now, Blue Energy merits attention as a serious execution experiment in U.S. nuclear deployment, but not yet as a proven infrastructure factory.
