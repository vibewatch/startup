  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, backlog conversion, project-level margin assumptions, debt terms, and cash runway.
    whyItMatters: Without operating and financing detail, outside investors cannot tell whether Blue Energy has merely raised a large round or actually derisked project economics enough to justify its implied valuation.
    diligencePath: Request management financials, debt-vs-equity breakdown for the April 2026 financing, current cash/runway, backlog conversion assumptions, and any project-finance term sheets.
    relatedQuestionRefs:
    - QO012
    - QO018
    relatedTableRefs:
    - TO001
    - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure
    missingEvidence: Exact board-seat allocation, investor voting rights, liquidation preferences, and any customer or partner governance side letters.
    whyItMatters: This is a capital-intensive company whose financing and strategic-partner rights could materially alter downside protection and future fund-raising leverage.
    diligencePath: Request the current cap table, board observer list, investor-rights agreement, and any strategic-commercial side letters linked to Constellation, Crusoe, or GE partners.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: material
    topic: texas-schedule
    missingEvidence: A reconciled project schedule explaining the 2028, 2030, 2031, and 2032 dates that appear across public Blue Energy, Crusoe, and GE Vernova materials.
    whyItMatters: The company's value proposition is schedule compression. Investors need to know which date refers to first gas power, first revenue, first nuclear steam, and full nuclear output.
    diligencePath: Request the latest integrated schedule, milestone definitions, and the specific basis for each public date promise used with customers, investors, and regulators.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
    - TO004
