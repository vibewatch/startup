- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance Visibility
  body: |-
    Blue Energy's public narrative is unusually founder-led for a company attacking a capital-intensive and highly regulated market. Jake Jurewicz is the dominant spokesperson across official announcements and media interviews, and the company's about page makes his prior experience in energy strategy, climate-risk projects, construction-adjacent work, and MIT nuclear studies central to the company story. Public sources also identify Matt Slotkin as co-founder, with a different profile: software, product, and technical-organization building rather than traditional utility or reactor operations. Together that pairing suggests Blue Energy's origins are as much about project-development design and systems thinking as about classic utility incubation.

    What makes the story more substantial than a two-founder slide is the breadth of public hiring Blue Energy already advertises. The about page shows a deliberate build-out in regulatory, licensing, commercial, project-finance, site-development, and plant-operations roles. Former NRC staff appear in senior regulatory posts, while Tom O'Neill, Tim Hanley, Steve Bolze, and other board or advisor figures add experience from Exelon, Constellation, GE Power, and infrastructure operations. That is the right kind of talent density for a company whose bottlenecks will be permitting, contracting, construction sequencing, and stakeholder management rather than pure reactor R&D.

    Still, governance transparency remains incomplete. Blue Energy publicly lists selected board and leadership names, but not the full distribution of board control, investor rights, ownership, or protective provisions. The company is therefore more credible on operational hiring than on governance disclosure. The concentration of public messaging around Jurewicz also means that founder credibility remains a meaningful key-person risk until the project schedule and partner set become self-evidently durable without that single narrative anchor.
