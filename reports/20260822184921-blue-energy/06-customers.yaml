- id: adoption-trajectory-and-proof-quality
  title: Adoption trajectory and proof quality
  body: |-
    Blue Energy's customer proof is unusually concrete for a young nuclear startup, but it is still pre-operational. The Crusoe relationship names a real counterparty, the Port of Victoria relationship names a real site path, and later GE-linked materials add more detail on staging. That is significantly better than a generic 'we serve AI' claim. Yet it is still a development trajectory, not a delivered-power trajectory.

    As a result, the right adoption metrics are milestone proxies rather than usage statistics. Site option secured, partner announced, financing raised, regulatory path opened, and power dates publicly framed—those are the observable steps today. By contrast, public sources do not disclose customers served, megawatt-hours delivered, or utilization. Investors therefore need to distinguish clearly between relationship proof and operating proof.

    On evidence quality, Crusoe is the strongest signal because it is confirmed by both sides and supported by trade coverage. Port of Victoria is meaningful but plays a different role: it validates site and local support, not end-use demand on its own. Together, the two form a coherent flagship story, but not yet a diversified customer base.
