- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Open marketplace leadership
    - Wanjiyi and other domestic aggregators
    - High
    - SHAREBOT does not own the platform model exclusively; Wanjiyi launched with alliance, finance, and insurance backing.
    - Request city-level supply share, monthly active providers, and buyer repeat rates by scenario
  - - OEM access advantage
    - JD and Unitree-linked direct channels
    - High
    - Retailer and OEM channels already provide booking, delivery, and support without a neutral marketplace.
    - Request channel conflict data, OEM exclusivity, and share of supply locked to JD or direct pages
  - - Industrial expansion optionality
    - Warehouse RaaS specialists
    - High
    - Locus, inVia, Vecna, and Geek+ already sell recurring warehouse outcomes with support and scaling logic.
    - Show named industrial deployments, SLAs, and repeat order evidence versus logistics substitutes
  - - Factory trust and support
    - ABB / KUKA / FANUC installed-base service channels
    - High
    - Incumbent channels already sit inside factories with training, spares, and maintenance infrastructure.
    - Collect factory RFQs, incumbent displacement cases, and required certification pathways
  - - Pricing edge
    - Rapid rate compression
    - Medium-High
    - Chinese coverage shows mainstream rents cooling while service-heavy fulfillment remains the real bottleneck.
    - Track blended realized price, gross margin, and service attachment by scenario over time
  - - Narrative moat
    - Commodity convenience messaging
    - Medium
    - Competitors also use Didi-like or simple-access framing, so top-of-funnel storytelling is not defensible alone.
    - Measure customer acquisition source, referral loop, and conversion after first booking instead of relying on brand slogans
  notes: Severity is an underwriting judgment based on reviewed public evidence as of 2026-06-16, not a market-share forecast.
