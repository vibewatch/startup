tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / channel
  - Category
  - Scale / adoption signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - SHAREBOT
    - Open robot-rental platform
    - 50-city launch footprint and 600+ service providers in public launch coverage
    - Events, retail, education, and aspirational industrial/logistics use cases
    - Multi-brand access plus delivery, operators, insurance, and programming
    - Public proof of repeat industrial wins is still thin
  - - Wanjiyi Rental
    - Domestic platform-style aggregator
    - Launched Jan. 2026 as a full-scenario robot-rental ecosystem platform with city-partner expansion
    - Service, cleaning, companionship, performance, education, families, SMEs
    - Alliance model combining hardware makers, finance, insurance, and mini-program ordering
    - Scale and quality consistency are still early-stage in public evidence
  - - JD robot rental / JoyInside
    - Retailer- and infrastructure-led channel
    - 27 JD MALL stores, self-operated rentals, 10M-device JoyInside target, 50+ city repair ambition
    - Consumers, enterprises, retail, education, logistics-adjacent users
    - Combines discovery, transaction, logistics, repair, insurance, and recycling
    - Economics of the rental layer itself are not publicly disclosed
  - - ZMProbots / Unitree G1 rental
    - OEM-linked direct rental page
    - Online booking with self-service and full-service event packages
    - Events, creators, agencies, short-term demos
    - Direct access to flagship humanoid hardware with delivery and operator options
    - Single-brand focus and event-centric framing
  - - Futurobots / Unitree Go2-A2
    - OEM-linked robot-dog rental channel
    - 1,370+ customers in 65+ countries; 7-day minimum rental
    - Industrial inspection, education, events, R&D pilots
    - Delivery, pickup, training, damage cover, and SDK-friendly models
    - Primarily quadruped focus rather than broad humanoid marketplace
  - - Locus Robotics
    - Warehouse RaaS substitute
    - Hundreds of deployments cited on official page
    - Warehouses and fulfillment operators
    - Subscription robotics with deployment, maintenance, analytics, and flexible fleet scaling
    - Not built for short-term public event rentals
  - - inVia Robotics
    - Warehouse RaaS substitute
    - Throughput-based subscription and remote robotics operation center
    - Warehouse operators seeking goods-to-person automation
    - Pay-for-productivity model with software plus remotely managed robots
    - Use case is narrower than a general multi-scenario rental marketplace
  - - Vecna Robotics
    - Warehouse RaaS substitute
    - Annual-fee model with 24/7 monitoring and SLA framing
    - Material handling and warehouse operations
    - Transparent annual-fee RaaS with maintenance and support included
    - Focused on internal logistics, not broad commercial activation demand
  - - Geek+
    - Warehouse automation substitute
    - Global modular solutions for eCommerce, 3PL, retail, pharma, and grocery
    - Distribution centers and warehouses
    - Modular robotics across picking, sorting, replenishment, pallet handling, and transport
    - Public rental or daily-pricing transparency is low
  - - ABB / KUKA / FANUC service channels
    - Industrial incumbent substitute
    - Large global service networks, lifecycle support, and dense installed bases in factories
    - Plant engineers, integrators, and industrial buyers
    - Installed-base trust, maintenance, training, modernization, and support depth
    - Less flexible than open rental for one-off or short-duration scenarios
  notes: 'Rows prioritize the competitive routes most relevant to SHAREBOT: another domestic platform, retailer/OEM-linked channels, global warehouse RaaS substitutes, and incumbent industrial service channels.'
  enumerationScope:
    coverage: partial
    basis: This table captures the most visible direct, substitute, and incumbent channels supported by public evidence on 2026-06-16 rather than every city-level robot rental operator in China.
