company:
  name: SHAREBOT
chapter:
  number: 3
  title: Competitors
  summary: 'SHAREBOT is not fighting one mirror-image rival so much as a layered field: another domestic rental aggregator in Wanjiyi, retailer- and OEM-linked Chinese channels through JD and Unitree, mature warehouse RaaS substitutes such as Locus, inVia, Vecna, and Geek+, and entrenched factory service channels from ABB, KUKA, and FANUC. The competitive risk is therefore strongest where buyers value fulfillment reliability, maintenance coverage, and installed-base trust more than the existence of an open robot-rental marketplace.'
sections:
- id: domestic-platforms-and-oem-channels
  title: Domestic platforms and OEM-linked channels already contest the same access layer
  body: SHAREBOT’s Chinese direct landscape is broader than a simple list of lookalike rental apps. The category now includes a second platform-style aggregator in Wanjiyi Rental, retailer-led distribution through JD’s self-operated robot rental launch and JoyInside ecosystem, and OEM-linked booking channels that let customers rent Unitree machines directly with delivery, operator support, and damage cover. That matters because SHAREBOT’s current value proposition is not exclusive robot IP; it is convenient access, city-level dispatch, and bundled service. Wanjiyi copies the marketplace logic directly, while JD and Unitree-linked channels attack it indirectly by combining rentals with retail discovery, logistics, financing, and after-sales service. The result is a domestic field where SHAREBOT may have strong brand momentum, but does not yet own the national standard for how a customer books, receives, repairs, or returns a robot.
