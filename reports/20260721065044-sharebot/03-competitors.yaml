- id: incumbent-service-channels
  title: Industrial incumbents compete through service-channel trust, not open marketplaces
  body: 'In factories, SHAREBOT’s hardest substitute may be the incumbent service stack of ABB, KUKA, and FANUC. Their competition is less visible on consumer-facing rental pages, but more powerful in procurement reality. Each offers lifecycle support, training, modernization, spare-parts or maintenance infrastructure, and long-standing relationships with plant engineers. IFR’s 2024 data show how large that installed base already is in China: 295,000 industrial robot installations in one year and more than 2 million robots in operation. In that context, a plant manager does not need another app to discover robotics demand; the manager already has trusted vendors, support teams, and qualification paths. SHAREBOT can still matter where flexible access lowers trial risk, but factory buyers may view incumbent channels as the safer answer whenever uptime, compliance, and long-term support carry more weight than short-term asset access. Another way to frame the risk is that factory procurement
    teams already have escalation paths, training routines, and spare-parts habits tied to these vendors. Even if SHAREBOT can source a compatible machine, it still must prove the equivalent reliability of field service, troubleshooting, and accountability when something fails during production.'
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
  - CP035
