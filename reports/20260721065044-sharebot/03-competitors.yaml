  figureRefs: []
- id: price-pressure-and-moat-durability
  title: Price pressure and fulfillment quality now matter more than novelty
  body: 'The adverse evidence is consistent across Chinese coverage: public attention created demand, but it also accelerated oversupply and pricing pressure. Xinhua, Yicai, Sohu, RoboHorizon, and China Daily all describe a market where event-led demand remains important, prices have fallen sharply from peak hype, and the spread economics of simple matchmaking are shrinking. Local operators in multiple cities are already monetizing rentals, which means SHAREBOT must coordinate a fragmented supply base while defending against JD-style infrastructure bundles and warehouse RaaS substitutes. That pushes moat analysis away from storytelling and toward operations. The scarce capabilities are rapid maintenance, reliable dispatch, insurance handling, partner density, and repeatable scenario execution. What remains missing in public is the hard underwriting evidence—take rates, utilization, gross margin, and industrial win-loss data—that would prove SHAREBOT can convert category momentum into durable
    economics before competitors normalize the same service bundle. That missing evidence keeps the moat story provisional rather than proven.'
