- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / channel
  - Public pricing signal
  - Contract model
  - Included capabilities
  - Unknowns
  - Implication
  rows:
  - - SHAREBOT
    - Public coverage ranges from sub-CNY2,000 promotions to premium custom packages
    - Short-term rental and scenario package model
    - Robot, delivery, operators, insurance, and custom programming depending on package
    - Take rate, realized margin, and utilization are private
    - Competes on packaged service breadth more than pure listing fees
  - - Wanjiyi Rental
    - No clean public list price found
    - Platform-style rental with alliance-backed support
    - Robot matching, standardized O&M, ecosystem alliance enablement
    - Realized pricing and partner economics remain undisclosed
    - Positioning pressure comes from broad scenario coverage, not transparent prices
  - - JD / Unitree channels
    - Official rental launch disclosed flexible daily or long-term access, but not a stable rate card
    - Retailer-led rental plus after-sales infrastructure
    - Discovery, booking, logistics, repair, insurance, recycling, and data services
    - Unit economics between retail and rental layers are private
    - JD can compete even without the clearest public day-rate table
  - - ZMProbots / Unitree G1
    - From $299/day self-service or about $1,875/day full-service event package
    - Direct rental page with self-service or operator-led event package
    - Delivery, collection, protection cover, and optional trained operator
    - Cross-country pricing and utilization are not comparable to China day-rates
    - OEM-linked direct rental can bypass neutral marketplaces for flagship humanoids
  - - Futurobots / Unitree Go2-A2
    - 7-day minimum with live country-specific pricing
    - Direct multi-day rental
    - Delivery, pickup, training, damage cover, technical support
    - Pricing varies by country and duration
    - Useful analogue for how vendors monetize trial, inspection, and education use cases
  - - Locus / inVia / Vecna
    - Opex subscription or annual-fee framing rather than public day-rates
    - RaaS subscription contract
    - Hardware, software, maintenance, monitoring, analytics, and scale flexibility
    - Public list pricing is limited and usually quote-based
    - For warehouse buyers, recurring subscription economics matter more than event-style daily rental
  - - ABB / KUKA / FANUC
    - Customized service contracts; no public daily rental analogue
    - Lifecycle service, maintenance, modernization, and support
    - Planning, training, repairs, upgrades, spares, and installed-base service
    - Comparable pricing and SLA detail are private
    - Incumbents compete on procurement confidence, not on visible list prices
  notes: Public evidence is far better on packaging and support structure than on normalized realized pricing, so this table emphasizes contract logic rather than a false apples-to-apples price comparison.
