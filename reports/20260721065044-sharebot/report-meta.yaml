companyProfile:
  summary: SHAREBOT is a Pudong, Shanghai-based robot-leasing platform that positions itself as a Robot-as-a-Service marketplace and service layer between robot supply, local service partners, and enterprise users. Public materials show strongest early traction in event, retail, restaurant, office, and promotional deployments, while management and policy-linked coverage frame industrial manufacturing, warehousing, logistics, and park operations as the next expansion lane. The company is closely tied to the Agibot ecosystem and reached unicorn-level valuation headlines within months of launch, but public disclosure remains thin on recurring revenue, retention, margins, governance, and unit economics.
  foundedDate: '2025-12-01'
  founders:
    - name: Zhiyuan Robotics (Agibot)
      role: Institutional co-founder
      background: Public coverage ties Agibot to SHAREBOT's founding, chairmanship, and broader robot-supply ecosystem.
      claimRefs: [CO011, CO013, CO015]
    - name: Flycode
      role: Institutional co-founder
      background: 36Kr identified Flycode alongside Zhiyuan Robotics as a co-founding party in SHAREBOT's formation.
      claimRefs: [CO013]
  foundingLocation: Pudong, Shanghai, China
  headquarters: Pudong, Shanghai, China
  productSummary: Robot-leasing platform plus service orchestration layer spanning sourcing, booking, partner fulfillment, insurance, delivery coordination, maintenance, and on-site support.
  customerFocus: SMEs, event and retail operators, restaurants, property managers, and early industrial or logistics adopters in China.
  businessModel: Robot-as-a-Service leasing with daily, monthly, and annual rental fees plus deployment, maintenance, insurance, and support services.
  stage: Series A
  fundingStatus: Series A and A+ financing were reported by May 2026 at a RMB 7 billion valuation, with Crunchbase News rounding the company to a $1 billion unicorn.
