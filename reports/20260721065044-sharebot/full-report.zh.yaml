      - number: '5.2'
        title: 多品牌目录与履约架构
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 实际交付的是一套分层编排栈。供给来自多个机器人 OEM 和相邻硬件厂商；发布报道点名 AgiBot 人形机器人和机器狗、AheadForm 仿生机器人、ULS 外骨骼，而管理层目标是在 2026
              前接入超过 10 家 OEM 和 200 家优质服务伙伴。公司自有界面强调城市伙伴、制造伙伴、RaaS
              伙伴和创作者伙伴，这意味着目录宽度既取决于机器人库存，也同样取决于本地服务覆盖和定制内容。履约同样外部化：订单预订后，本地伙伴处理运输、部署、操作员和现场执行，保险以及 JD
              关联维护或回收层包在流程外围。换句话说，SHAREBOT 更像服务网络协调方，而不是单品牌机器人店面；每增加一个城市或场景，都需要硬件可用，也需要能准时到场的本地执行层。这种架构比集中式机队更快扩大触达，但也让
              SHAREBOT 依赖其直接控制之外的伙伴质量、OEM 兼容性和售后基础设施。
