            title: 这个细分市场增长快于经济性验证
            body: 各来源同时认同需求扩张和价格下行。两者叠加意味着，总市场可以增长，但平台利润率可能恶化。没有可靠的调度、维护、保险和回收经济性，更大的市场不会自动变成更好的生意。
