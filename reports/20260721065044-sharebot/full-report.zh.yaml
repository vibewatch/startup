  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 公司 / 渠道
      - 公开定价信号
      - 合同模式
      - 包含能力
      - 未知项
      - 启示
    rows:
      - - SHAREBOT
        - 公开报道从低于 CNY2,000 的促销价到高端定制套餐不等
        - 短租和场景套餐模式
        - 视套餐包含机器人、配送、操作员、保险和定制编程
        - 抽佣率、实际利润率和利用率未披露
        - 竞争点更在打包服务广度，而不只是挂牌费
      - - Wanjiyi Rental
        - 未找到清晰公开标价
        - 平台式租赁，联盟提供支持
        - 机器人匹配、标准化运维、生态联盟支持
        - 实际定价和伙伴经济账仍未披露
        - 定位压力来自广场景覆盖，而非透明价格
      - - JD / Unitree 渠道
        - 官方租赁发布披露可按日或长期灵活使用，但没有稳定价目表
        - 零售商主导租赁，加售后基础设施
        - 发现、预订、物流、维修、保险、回收和数据服务
        - 零售层和租赁层之间的单位经济账未披露
        - 即便没有最清晰的公开日租价目表，JD 也能竞争
      - - ZMProbots / Unitree G1
        - $299/day 起的自助套餐，或约 $1,875/day 的全服务活动套餐
        - 直租页面，提供自助或操作员带队活动套餐
        - 配送、回收、保障覆盖，以及可选受训操作员
        - 跨国家定价和利用率不能直接对比中国日租价
        - 对旗舰人形机器人，OEM 关联直租可绕过中立市场
      - - Futurobots / Unitree Go2-A2
        - 最低 7 天，实时显示各国价格
        - 直接多日租赁
        - 配送、取回、培训、损坏保障、技术支持
        - 定价随国家和租期变化
        - 可作为供应商变现试用、巡检和教育场景的参照
      - - Locus / inVia / Vecna 同业
        - Opex 订阅或年费口径，而非公开日租价
        - RaaS 订阅合同
        - 硬件、软件、维护、监控、分析和弹性扩容
        - 公开标价有限，通常按询价报价
        - 对仓储买方，持续订阅经济账比活动式日租更重要
      - - ABB / KUKA / FANUC
        - 定制化服务合同；无公开日租可比项
        - 生命周期服务、维护、现代化改造和支持
        - 规划、培训、维修、升级、备件和装机基础服务
        - 可比定价和 SLA 细节未披露
        - 传统厂商靠采购信心竞争，而不是靠可见标价
    notes: 公开证据对打包方式和支持结构更充分，对标准化实际定价则弱得多；因此本表强调合同逻辑，而不做虚假的同口径价格对比。
