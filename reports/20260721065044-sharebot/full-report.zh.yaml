      - number: '8.4'
        title: 建议、入场纪律与投资逻辑破裂信号
        blocks:
          - type: paragraph
            body: >-
              实操投资结论是：战略上把 SHAREBOT 放在前排，但价格上保持保守。公开证据足以反驳 SHAREBOT 是假公司或纯概念 PPT
              的看法：融资发生了，市场存在，服务需求真实，多方公开来源显示平台试图解决部署基础设施，而不只是出租硬件。但以当前标题估值给出买入式判断，证据仍太薄。公司还没有拿出审计财务和队列数据，让投资人判断它该和投机期权价值公司、重服务型机器人运营商相比，还是最终和规模化自动化平台相比。因此，最干净的立场是继续研究，中等置信度、高风险、估值偏高。下一轮尽调应聚焦收入确认、抽佣率、续约和留存、工业试点转化、在线率和事故数据，以及轮次条款细节。如果这些检查结果强，当前估值可能显得有先见之明。若这些指标继续不公开，而估值持续上台阶，投资逻辑应被视为越来越脆弱，而不是越来越被证实。
