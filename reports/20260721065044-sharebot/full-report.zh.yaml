        blocks:
          - type: paragraph
            body: >-
              核心尽调问题在于，SHAREBOT 也许不重持有硬件，但运营一点也不轻。多个独立来源已经描述了预订之后的重活：跨城调度、现场调试、动作编排或定制编程、操作员、维护、保险和故障恢复。Xinhua
              提到合理人机比仍约为每台机器人一名操作员，这一点尤其重要，因为当前人力负担很难忽略。与此同时，市场定价快速下行。Xinhua 和 China Daily 都描述了国内日租价格从 2025 年初高于 RMB
              10,000 的峰值大幅重置；Sohu 则认为简单信息套利正在消失。两者叠加意味着，SHAREBOT
              的护城河必须来自服务可靠性、本地伙伴密度和资产利用率，而不能只靠醒目的租赁报价。如果可重复、高频需求出现，工业逻辑仍可能有吸引力；但 IFR 和 MIIT
              材料合在一起说明，大规模真实世界人形机器人部署仍处早期。除非 SHAREBOT 披露利用率、退款、维护和续约数据，否则利润率路径更像叙事，不像模型。
