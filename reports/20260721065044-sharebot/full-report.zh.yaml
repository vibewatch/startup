        - 单一品牌为主，叙事集中在活动场景
      - - Futurobots / Unitree Go2-A2
        - OEM 关联机器狗租赁渠道
        - 65+ 个国家 1,370+ 客户；最低租期 7 天
        - 工业巡检、教育、活动、研发试点
        - 配送、取回、培训、损坏保障，以及 SDK 友好机型
        - 主要聚焦四足机器人，不是广义人形机器人市场
      - - Locus Robotics
        - 仓储 RaaS 替代方案
        - 官网称已有数百个部署
        - 仓库与履约运营商
        - 订阅式机器人，包含部署、维护、分析和机器人队列弹性扩容
        - 不是为短期公开活动租赁设计
      - - inVia Robotics
        - 仓储 RaaS 替代方案
        - 按吞吐量计费的订阅，以及远程机器人运营中心
        - 寻求货到人自动化的仓库运营商
        - 按产能付费，软件加远程托管机器人
        - 使用场景窄于通用多场景租赁市场
      - - Vecna Robotics
        - 仓储 RaaS 替代方案
        - 年费模式，配 24/7 监控和 SLA 框架
        - 物料搬运与仓储运营
        - 透明年费 RaaS，包含维护和支持
        - 聚焦内部物流，而非广泛商业激活需求
      - - Geek+
        - 仓储自动化替代方案
        - 面向电商、3PL、零售、医药和生鲜杂货的全球模块化方案
        - 配送中心和仓库
        - 覆盖拣选、分拣、补货、托盘处理和运输的模块化机器人
        - 租赁或按日定价的公开透明度低
      - - ABB / KUKA / FANUC 服务渠道
        - 工业传统厂商替代方案
        - 大型全球服务网络、生命周期支持，以及工厂里的密集装机基础
        - 工厂工程师、集成商和工业买方
        - 装机基础带来的信任，以及维护、培训、现代化改造和深度支持
        - 在一次性或短时场景中，灵活性不如开放租赁
    notes: 这些行优先列出与 SHAREBOT 最相关的竞争路径：另一家国内平台、零售商 / OEM 关联渠道、全球仓储 RaaS 替代方案，以及传统工业服务渠道。
