  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与下单流程
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 面向客户呈现的产品，不是裸设备市场，而是由场景牵引的租赁流程。中英文网站都引导用户进入 WeChat 小程序或 app，并由客服协助报价和场景适配；iOS
              上架页还给出具体买方可控项，包括场景选择、租赁时长、设备数量、操作员加购、定制内容和多种支付方式。公开发布和季节性需求报道显示，平台重点押注婚礼、年会、展会、商场活动、庙会、学校或亲子活动，因为这些用例能容忍当前机器人限制，同时仍愿意为新鲜感和服务付费。实际产品承诺是「便利
              + 线下履约」：用户浏览套餐、配置任务、下单，然后依赖 SHAREBOT 网络把机器人、操作员和可在现场真正跑起来的脚本交付到位。
