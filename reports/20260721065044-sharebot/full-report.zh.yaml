      - number: '2.3'
        title: 政策支持与结构性需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              中国的大机器人背景异常有利。IFR、Statista 和 SCIO/Xinhua
              材料都显示，按存量和年度装机量，中国已经是全球最大的工业机器人市场；国家政策也在有意推动行业从传统自动化转向具身和智能机器人。2026 年 6 月的 MIIT-SASAC 行动计划尤其关系到
              SHAREBOT，因为它明确点名制造、巡检、维护、仓储物流、零售、医疗和应急响应中的工业、服务和特殊场景部署。计划还鼓励机器人即服务（RaaS）、经营租赁、按效果付费等商业创新，以降低用户投入门槛。与此同时，中国推进标准制定、真实场景训练基础设施、开放数据项目和共享测试基地，目的都是缩短从演示到可部署产品的路径。这些政策对
              SHAREBOT 的意义，不主要在于直接给补贴，而在于扩大了「租一台机器人」能够成为机构可接受采购行为的场景集合。
