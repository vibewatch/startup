        - 当前部署约每台机器人 1 名操作员
        - 高
        - 人工是直接服务成本，会限制类软件毛利假设
        - 按场景提供每笔预订操作员工时
      - - 国内价格趋势
        - 较 >RMB10k/day 峰值明显下行
        - 高
        - 价格下行压缩简单中介的价差经济账
        - 展示上线以来每月实际 ASP 和折扣率
      - - 保险覆盖
        - 1,000+ 台投保机器人 / 投保金额 >RMB200m
        - 中
        - 保险是运营模型的一部分，可能在损坏事件中保护现金
        - 提供保费成本、出险频率和免赔额结构
      - - 维修和售后依赖
        - 高
        - 中
