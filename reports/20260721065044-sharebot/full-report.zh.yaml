      - number: '4.4'
        title: 披露缺口、治理风险与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开记录仍缺少投资承保最关键的变量。已审阅来源没有披露收入、ARR、毛利率、烧钱速度、现金跑道、CAC、回本周期或净留存，本章也没有能从一级登记页面干净核验当前所有权的直接公开文件，因为对 Qichacha
              的自动访问被阻断。SHAREBOT 自身隐私政策又叠加了一层财务风险：平台收集订单、场景、预算、交易和伙伴申请数据，并称部分注册或交易数据可能同步给关联方或业务伙伴。这些披露支持一个判断：SHAREBOT
              正在搭建真实运营平台；但随着业务跨越更多城市和国家扩张，治理、合规和跨方数据处理成本也会抬升。因此，Tencent 和 Sohu
              给出的反向情景是连贯的：估值已跑在已披露经济性前面；如果价格压缩快过利用率提升，高服务强度可能迫使进一步稀释。财务结论：SHAREBOT
              可能成为有意义的机器人服务基础设施层，但今天它仍是一家服务很重、披露私有的公司；仅凭公开证据，收入质量、利润率路径和资本效率还无法充分承保。
