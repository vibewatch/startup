        title: 融资历史、所有权信号与早期规模
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 在公开亮相后不到六个月里压缩进了异常密集的融资活动。Baidu Baike 和 3 月融资报道指向一轮 2026 年 1 月种子轮、3 月的天使轮和 angel+ 组合融资（规模超过 RMB
              100 million，据报道估值为 RMB 3 billion）、4 月由产业和上市公司资本领投的 Pre-A，以及 2026 年 5 月的 A 和 A+ 轮；多家媒体称，后两轮把估值推到 RMB 7
              billion。Crunchbase News 另将 SHAREBOT 列入 2026 年 5 月新晋独角兽，估值为 $1 billion；即便按现货汇率换算 RMB-USD
              略低，方向上仍与中文报道一致。运营层面，公开牵引指标仍是市场平台式，而不是财务式：启动时覆盖 50 个核心城市、600 多家服务商、初始超过 1,000 台设备，2026 年 3 月可调度机器人超过 3,000
              台，累计订单超过 5,500 单。这些是有意义的网络效应指标，但不能替代已披露收入、利润率或利用率。
