      - number: '2.4'
        title: 约束、节奏与商业化风险
        blocks:
          - type: paragraph
            body: >-
              市场在扩张，但资料里的摩擦也很明显。IFR
              明确指出，人形机器人不能与成熟工业机器人混为一谈：可预见未来，高速精密制造仍会使用专用工业系统；人形机器人在工厂或家庭中的广泛采用仍是较后阶段的规划结果，不是近期基准情景。IDC
              从需求侧补充了另一道瓶颈：用户普遍认可工业机器人的价值主张，但仍想要更好的性能、软件、售后服务和更容易的系统集成。Sohu 的 2026 年 6
              月租赁分析显示了这些缺口的商业后果。供给增加后，租赁价格快速下行，简单撮合方可赚取的价差经济收窄，差异化转向物流、维护、保险、动作编排、维修和回收。简言之，SHAREBOT
              的市场机会真实存在；但这个市场是否值得投资，取决于平台能否在价格压缩摧毁利润率前，把演出驱动的需求转成可重复服务工作流。
