        - from: n4
          to: n7
          label: 阻断买入结论
        - from: n5
          to: n6
          label: 拉宽区间
        - from: n6
          to: n7
          label: 迫使保持纪律
    approximationNotes: 该流程把本章判断压缩成决策节点；它不是公司披露的流程图。
    claimRefs:
      - CV006
      - CV009
      - CV012
      - CV013
      - CV032
      - CV040
      - CV041
      - CV045
  - id: FV002
    title: 未披露收入规模下的估值敏感性
    type: bar
    layout: standard
    summary: 在 $1B 公开估值固定不变时，只有 SHAREBOT 已经达到可观但未披露的规模，隐含收入倍数才会快速压缩。
    data:
      items:
        - label: 如果收入为 $10M
          value: 100
        - label: 如果收入为 $25M
          value: 40
        - label: 如果收入为 $50M
          value: 20
        - label: 如果收入为 $100M
          value: 10
        - label: 如果收入为 $200M
          value: 5
        - label: 如果收入为 $300M
          value: 3.3
    approximationNotes: 条形展示使用约 $1B 公开估值和假设收入水平计算出的隐含市值 / 收入倍数，因为 SHAREBOT 未公开披露收入。
    claimRefs:
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 宽场景区间比单点估值更站得住，因为最大的争议仍是证据质量，而不是表格精度。
    data:
      items:
        - label: 悲观情景（30%）
          low: 0.3
          value: 0.45
          high: 0.6
          unit: $B
        - label: 基准情景（50%）
          low: 0.6
          value: 0.8
          high: 0.95
          unit: $B
        - label: 乐观情景（20%）
          low: 1.1
          value: 1.3
          high: 1.6
          unit: $B
        - label: 当前公开估值
          low: 0.95
          value: 1
          high: 1.05
          unit: $B
    approximationNotes: 区间是示意性场景带，锚定公开可比视角和披露缺失折价，并非基于公司未公开财务数据的 DCF。
    claimRefs:
      - CV001
      - CV038
      - CV039
      - CV040
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会风格的 1-5 分评分，把本章压缩成一张只基于公开证据的决策快照。
    data:
      items:
        - label: 市场机会
          score: 4
          detail: 需求和政策信号真实，品类也在快速放大。
        - label: 战略位置
          score: 4
          detail: SHAREBOT 还早，但已经明显站在机器人部署讨论的中心。
        - label: 运营证明
          score: 2
          detail: 有机队和订单轶事，但没有经审计财务和续约证明。
        - label: 单位经济性可见度
          score: 1
          detail: 公开证据看不出收入质量、毛利率或现金效率。
        - label: 估值支撑
          score: 2
          detail: 只有在乐观执行假设下，公开估值才说得通。
        - label: 风险画像
          score: 2
          detail: 执行、融资和披露风险仍异常高。
        - label: 证据质量
          score: 2
          detail: 信源集足以搭场景框架，但不足以做精确投资承做。
    approximationNotes: 评分是方向性的，并且刻意保守，因为只使用截至 2026 年 6 月的公开证据。
    claimRefs:
      - CV013
      - CV028
      - CV029
      - CV041
      - CV042
      - CV043
      - CV044
