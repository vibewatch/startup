  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 标题估值与公开运营披露的落差
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 2026 年 5 月的融资标题容易复述；难的是用它支撑投资定价。多家英文和中文来源在核心事实上一致：公司完成数亿元人民币 A 轮和 A+ 轮融资，新估值达到人民币 70
              亿元，管理层计划把资金用于从活动驱动部署转向更广泛的 RaaS
              平台，覆盖工业、园区、仓储、物流和商业服务用例。这足以证明估值存在，也证明投资人买的是平台逻辑而非单个项目。但这不足以证明当前价格有已披露经济性支撑。确认标题的同一组来源也暴露缺口：公开层面仍没有收入、ARR、毛利率、烧钱速度、现金跑道或股权结构条款披露，运营指标仍主要停留在可调度车队、城市覆盖、订单轶事和场景广度。公开来看，这轮融资更像围绕机器人部署基础设施品类领导地位的一笔战略稀缺性交易。因此，尽调负担不是证明需求是否存在，而是测试
              $1 billion 等值估值买到的是真正运营飞轮，还是一个快速推进但财务形态仍不透明的叙事。
