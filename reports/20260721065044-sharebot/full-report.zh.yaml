      - number: '7.4'
        title: 价格下行、需求质量与产业节奏风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的市场风险是：SHAREBOT
              可能看对了机器人租赁市场方向，却仍过早押注可持续经济性。多方资料显示，当前需求真实存在，但结构仍偏向节庆、展会、零售活动、旅游等高曝光、尚未深嵌流程的场景。上海春季假日报告显示订单大幅增长，但超过一半来自假日场景；Tencent
              访谈也明说，2025 年需求很大程度仍由新鲜感驱动，而非习惯性运营使用。与此同时，价格已经开始松动。Sohu 和 Tencent
              报道，供给扩大后租赁费率明显下滑；反向评论警告，六个月回本的故事依赖暂时性稀缺和高价格，未必能扛过更大规模量产。政策雄心不等于客户准备度。MIIT 的 2026
              行动和上海具身智能计划都指向工业、物流、零售和服务部署，但它们把这些类别描述为验证和示范赛道，需要安全性、可靠性、标准和长期经济性证据。若 SHAREBOT
              不能在价格正常化前，从活动驱动的短促爆发迁移到可重复的企业工作流，市场可能继续变大，平台可拿的利润池却会收缩。
