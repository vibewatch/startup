      - number: '3.3'
        title: 工业既有厂商靠服务渠道信任竞争，而不是开放市场
        blocks:
          - type: paragraph
            body: >-
              在工厂里，SHAREBOT 最难替代的对手可能是 ABB、KUKA 和 FANUC
              的既有服务栈。它们在面向消费者的租赁页面上不显眼，但在采购现实里更有力量。每家公司都提供生命周期支持、培训、现代化改造、备件或维护基础设施，并与工厂工程师维持长期关系。IFR 的 2024
              数据显示，这个装机基础在中国已经很大：一年 295,000 台工业机器人安装量，运行中的机器人超过 2 million
              台。在这种背景下，工厂经理不需要另一个应用来发现机器人需求；他们已经有可信供应商、支持团队和认证路径。只要灵活接入能降低试用风险，SHAREBOT 仍然有意义；但当
              uptime、合规和长期支持比短期资产接入更重要时，工厂买家可能会把既有渠道视为更安全的答案。换个说法，工厂采购团队已经有与这些供应商绑定的升级处理路径、培训惯例和备件习惯。即便 SHAREBOT
              能找到兼容机器，一旦生产中出故障，它仍必须证明自己的现场服务、故障排查和责任承担同样可靠。
