      - number: '8.2'
        title: 早期机器人编排平台的可比视角
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 没有完美的公开可比公司，这正是不能假装精确的原因。Serve Robotics 有用，因为它是公开上市的自主平台，拥有真实 SEC 披露、真实亏损和真实流动性；Richtech
              有用，因为它明确推销 RaaS 和经常性合同，同时也显示融资结构和控制质量如何让估值故事变复杂；Knightscope 展示了重服务型机器人业务在有经常性收入但增长和盈利仍有争议时如何交易；Symbotic
              则展示了收入和现金终于大到足以用运营证据支撑数十亿美元市值时，规模化工业自动化是什么样。合在一起，这些同行并不能为 SHAREBOT
              产出一个干净倍数，而是搭出一架估值阶梯。一端是公开微市值机器人公司，即便有审计报表、经常性收入和现金披露，交易价格也可能远低于 SHAREBOT
              标题估值；另一端是真正规模化自动化龙头，估值高得多，但前提是已经交付数十亿美元收入和深得多的客户证据。SHAREBOT
              目前夹在两端之间：战略上比普通微市值公司更有意思，但证明责任仍更接近早期平台，而不是工业自动化龙头的成熟画像。
