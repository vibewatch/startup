  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT
              并不参与整个机器人经济。它的可寻址市场更窄，应定义为客户不直接拥有硬件，而选择临时使用、按项目付费服务或经营租赁式使用权时产生的机器人接入和部署支出。落到实际场景，就是活动和营销激活租赁、零售和接待部署、短周期教育和文旅用例，以及未来切入仓库、园区、巡检和工业工作流——这些客户想要机器人能力，但不想立即投入
              capex。多份中国 2025-2026 来源给出的短期市场估算接近：2025 国内机器人租赁规模约 RMB 1 billion，2026 大约 RMB 10 billion，意味着广泛商业化第一年出现 10
              倍跃升。相对更大的工业和服务机器人经济，这个租赁细分仍很小；但战略上重要，因为它充当试用、分销和数据采集层，能加速更昂贵硬件的采用。
