      - number: '8.3'
        title: 情景框架，而非点估值确定性
        blocks:
          - type: paragraph
            body: >-
              今天评估
              SHAREBOT，正确方法是看情景，而不是给一个单一目标数。乐观情景假设公司成为中国具身机器人部署的默认编排层：工业和企业工作流开始重复发生，调度密度改善，伙伴中立性保持可信，变现来自可靠的平台和服务经济性，而不是一次性活动爆发。基准情景更克制。SHAREBOT
              仍成为真实品类公司，但经济性在更长时间内保持混合、受人工影响，工业部署扩张慢于融资故事暗示。悲观情景不是机器人需求消失；而是需求仍真实却大多偶发，价格持续下行，人工支持和维修负担仍重，后续投资人在没有审计证据时拒绝继续为估值跃升买单。在这个框架下，当前标题估值已经偏向上行情景。只有
              SHAREBOT 证明自身明显高于公开微市值机器人板块，并开始弥合收入质量、可重复性和单位经济性披露缺口，$1 billion 估值才说得通。在此之前，情景宽度比小数点精度更重要。
