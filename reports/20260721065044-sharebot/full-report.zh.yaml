    rows:
      - - 市场时点
        - 机器人租赁需求和政策支持真实存在，公开资料显示品类认知快速提升。
        - 需求可以真实存在，但经济性仍由新奇感和一次性事件驱动。
        - 证明工业和企业需求变成重复使用，而不是展示型流量。
      - - 商业模式
        - 如果平台能协调 OEM、伙伴和场景，就可能成为机器人部署的运营层。
        - 平台也可能只是重服务协调方，软件式利润率有限。
        - 抽佣率披露和按场景贡献利润率。
      - - 战略稀缺性
        - 快速融资和独角兽身份可能反映其在新兴瓶颈环节的品类领导地位。
        - 快速融资也可能只是热度，而非耐久经济性。
        - 证明后续融资跟随运营进展，而不只是叙事动能。
      - - 可比公司组
        - 公开同业显示，自动化平台一旦规模化，仍有机会做出大结果。
        - 公开同业也说明，一旦规模、控制或经常性经济性不达预期，估值会被猛烈压缩。
        - 更成熟的披露，说明 SHAREBOT 实际属于哪一类同业。
      - - 执行护城河
        - 本地交付、稳定运行、保险和伙伴管理可能很难复制。
        - 同样这些层也会吃掉利润率，让扩张在运营上变得混乱。
        - 城市级 SLA、事故和留存指标。
      - - 退出路径
        - 如果 SHAREBOT 完成工业化，它可能成为有吸引力的战略买方或成长股权平台资产。
        - 治理薄弱、控制薄或 KPI 薄会推迟 IPO 准备度并压缩退出价值。
        - 董事会级报告、审计准备度和更清晰的股权结构披露。
    notes: 本表把上行和下行论点配对，确保建议随证据变化，而不是只押公司质量。
