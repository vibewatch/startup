  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 真实需求和战略潜力，与薄弱的公开经济性和很宽的场景不确定性相撞，最终导出这一建议。
    data:
      nodes:
        - id: n1
          label: 品类需求真实
          detail: 公开信源显示订单、机队增长和政策支持。
        - id: n2
          label: 工业场景有上行空间
          detail: 管理层和政策信源指向物流、园区和制造场景。
        - id: n3
          label: 服务负担很重
          detail: 定价、物流、操作员、维修和保险仍在塑造经济性。
        - id: n4
          label: 公开披露薄弱
          detail: 没有公开收入、利润率、烧钱速度、现金跑道或轮次条款细节。
        - id: n5
          label: 公开可比公司分化
          detail: 微型市值机器人公司可能远低于 $1B，而规模化自动化公司可能远高于它。
        - id: n6
          label: 当前估值标记已很激进
          detail: 约 $1B 的公开估值，在证据追上前已经把上行空间打进去。
        - id: n7
          label: 建议：继续研究
          detail: 保持跟进，但在承做前要求更多证明或更好价格。
      edges:
