      - number: '1.2'
        title: 领导层、创始方与治理背景
        blocks:
          - type: paragraph
            body: >-
              领导层看起来由 Agibot 生态和一批消费互联网运营人才共同构成。独立报道和准参考资料将 Jiang Qingsong 标注为董事长、Zhiyuan AGIBOT 合伙人，以及上海运营主体法定代表人。Li
              Yiyan 一直被列为首席执行官，也是解释公司存在理由的主要发言人：降低采用摩擦只是第一步，更难的是在真实生产场景里稳定、可重复地交付服务。中文参考资料还称，平台由 Zhiyuan Robotics 相关实体和
              Flycode 联合创立，前 Alibaba 和 Ele.me 高管在 2026 年初加入，以扩展运营和战略。缺口在于常见的后期种子轮治理披露仍没有出现：没有公开董事会名单、没有股东权利摘要，也没有披露对
              Zhiyuan 生态相关方依赖的控制机制。尽调角度看，创始方与市场匹配度强，但治理透明度仍然偏薄。
