      - number: '7.3'
        title: 生态依赖、治理不透明与融资脆弱性
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 对外讲开放平台，但公开记录仍把它和 Agibot 生态绑得很紧。Agibot 共同主办发布会，Jiang Qingsong 同时以 Agibot 合伙人和 SHAREBOT
              董事长身份公开出现，Tencent 报道还把平台写成 Agibot 自有机器人和能力进入更多场景、再由更大生态补位的通道。供给稀缺、标准未成熟时，这种依赖有用；但一旦第三方 OEM 或服务伙伴认为 Agibot
              拿到优先待遇，产品准入、伙伴中立性和关联方经济性都会出现实质集中风险。治理不透明会放大这个问题。公开材料谈到投资人、高管和增长计划，却基本没有交代董事会构成、正式风险监督、关联方规则和单位经济披露。融资节奏带来的更多是压力，不是安心。SHAREBOT
              几个月内从种子轮走到独角兽级标题，反向评论已经质疑订单量和已披露运营证据能否支撑估值跃升。若融资预期跑在可见经济性前面，即使表面业务仍热闹，后续轮次也会更脆弱。
