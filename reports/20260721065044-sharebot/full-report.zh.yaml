  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开价值 / 指标
      - 运营披露信号
      - 为什么有用
      - 为什么不完全匹配
    rows:
      - - Serve Robotics
        - $0.61B 市值；2025 年收入 $2.7M；流动性 $233.4M
        - 通过 SEC 公开披露的配送机器人平台，亏损大、现金也多。
        - 可作为已披露自动驾驶平台的参照；该平台仍高度依赖期权价值交易。
        - 配送模式不同，且现金充裕的资产负债表会扭曲简单倍数解读。
      - - Richtech Robotics
        - $0.47B 市值；FY2025 收入 $5.0M；55 份 RaaS 合同；现金 $193.6M
        - 模式相邻的 RaaS 故事，有公开申报文件和明确经常性收入定位。
        - 说明早期公开 RaaS 公司仍可能依赖融资结构和控制质量。
        - ATM 融资支撑的资产负债表和控制弱点，使它不是干净可比对象。
      - - Knightscope
        - $35M 市值；2025 年收入 $11.3M；服务收入占比 70%
        - 重服务机器人运营商，拥有真实经常性服务足迹和公开业绩。
        - 当服务模式经济性仍有争议时，可作为公开市场愿意支付价格的底部参照。
        - 安防机器人不是人形机器人租赁，也不是部署编排层。
      - - Symbotic
        - $25.18B 市值；FY2025 收入 $2.247B；现金 $1.245B
        - 已规模化的工业自动化和仓储平台，客户验证很深。
        - 可作为成熟度上限参照：当收入和现金体量足够大时，大估值支撑长什么样。
        - 成熟度高得多，垂直领域不同，也不是早期市场平台或部署层。
      - - SHAREBOT 头条估值
        - 2026 年 5 月私募估值约等于 $1B；公开收入未披露
        - 头条估值靠融资新闻、市场热度和情景宽度支撑，而不是公开财务报表。
        - 可作为锚点，判断当前价格更接近期权价值还是规模化执行。
        - 尚未经过已披露收入、利润率或融资轮条款细节的直接压力测试。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows are a model-appropriate comparison set for June 2026 valuation framing: two smaller disclosed robotics
        platforms, one service-heavy public operator, one scaled industrial automation leader, and SHAREBOT’s own
        headline mark.
    notes: 可比行刻意混用市值、收入和披露风格视角。目标是情景框定，而不是错误声称五行都应套用同一倍数方法。
