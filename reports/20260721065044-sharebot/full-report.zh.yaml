      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              客户图谱很分散。近期需求由活动主办方、商场、旅游场地、零售商、学校和营销团队带动，他们看重新鲜感、引流和短周期人力替代。此时买方和付款方往往落在品牌、活动或门店运营预算里，而不是工厂 capex
              委员会。下一层是设施管理方、办公运营方、商业地产房东和园区运营方，他们更在意可重复的接待、巡逻或清洁工作流。再往后，市场才开始与工业和物流买方重叠，采购逻辑也明显变化：运营、工程和仓库经理要的是
              uptime、安全和集成，而不是表演效果。多份来源明确把机器人租赁描述为客户的低风险试用机制，以及制造商的真实世界反馈回路。因此，采用漏斗通常从一次性项目开始，转向重复服务包，最后才可能进入标准化运营预算。路径很直观，但许多品类的可重复性仍未验证。
