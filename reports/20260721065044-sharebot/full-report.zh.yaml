      - number: '1.4'
        title: 里程碑、运营覆盖与近期执行风险
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月以来的里程碑脉络很清楚：先在上海上线平台，用早期融资搭全国服务网络，再加入保险等生态服务，随后借 JD.com、Rui’an Office
              等战略伙伴扩展平台。公开资料也显示，管理层正试图把叙事从「活动里的机器人」推向更广的运营工作流。但同一组证据已经暴露出主要执行风险。Sohu 的 2026 年 6
              月分析认为，租赁价格下行压缩了纯平台运营方的信息套利空间，真正的护城河转向物流、维护、保险和回收。Xinhua
              还补充说，当前需求仍明显由娱乐驱动，复购客户稀缺，现有部署往往仍需要每台机器人配一名操作员。换句话说，SHAREBOT
              很快拿到了可见度和头部估值，但公司仍必须证明，服务网络能支撑工业级利用率和可持续单位经济，而不是只靠新奇感拉动增长。
