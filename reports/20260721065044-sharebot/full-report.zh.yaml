  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 有证据支撑的理由
      - 缓释措施 / 尽调问题
    rows:
      - - 开放市场领导地位
        - Wanjiyi 和其他国内聚合方
        - 高
        - SHAREBOT 并不独占平台模式；Wanjiyi 上线时已有联盟、金融和保险支持。
        - 要求提供按城市划分的供给份额、月活服务商，以及按场景划分的买方复购率
      - - OEM 接入优势
        - JD 与 Unitree 关联直营渠道
        - 高
        - 零售商和 OEM 渠道已经能提供预订、交付和支持，不需要中立市场。
        - 要求提供渠道冲突数据、OEM 排他安排，以及锁定在 JD 或直营页面的供应占比
      - - 工业场景扩张选项
        - 仓储 RaaS 专门厂商
        - 高
        - Locus、inVia、Vecna 和 Geek+ 已经把仓储结果按经常性服务销售，并配套支持与扩展逻辑。
        - 要求列出具名工业部署、SLA 和复购证据，并与物流替代方案对比
      - - 工厂信任与支持
        - ABB / KUKA / FANUC 存量装机服务渠道
        - 高
        - 既有渠道已扎根工厂，带着培训、备件和维护基础设施。
        - 收集工厂 RFQ、替换既有厂商案例和必要认证路径
      - - 定价优势
        - 租金快速压缩
        - 中高
        - 中文报道显示主流租金在降温，真正瓶颈仍是重服务交付。
        - 按场景持续跟踪混合实际价格、毛利率和服务附着率
      - - 叙事护城河
        - 商品化便利性叙事
        - 中
        - 竞争对手也在用类似 Didi 或「简单接入」的叙事，光靠漏斗顶端故事守不住。
        - 不要依赖品牌口号，改为衡量获客来源、转介绍闭环和首次预订后的转化。
    notes: 严重程度是基于截至 2026-06-16 已审阅公开证据作出的承销判断，不是市场份额预测。
