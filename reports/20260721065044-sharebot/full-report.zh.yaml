  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性估值区间
      - 概率信号
      - 对投资者意味着什么
    rows:
      - - 悲观
        - 需求仍由活动驱动，价格承压，服务人力保持高位，新融资轮需要比公司公开可展示材料更强的证据。
        - $0.30B-$0.60B
        - 如果下一次更新时工业续约和单位经济性仍不透明，该情景就有实质权重。
        - 今天的头条估值会显得过早，且容易遭遇平轮或下轮降估值。
      - - 基准
        - SHAREBOT 成为真正的全国部署平台，但工业复购和利润率结构的验证时间，比融资叙事暗示的更长。
        - $0.60B-$0.95B
        - 最符合当前公开资料。
        - 头条估值看起来已满；更好的进入点要么来自时间，要么来自更多披露。
      - - 乐观
        - 工业、物流和企业工作流开始续约，伙伴密度提高利用率，披露的 KPI 支撑耐久编排模式。
        - $1.10B-$1.60B
        - 需要几个目前仍属私有的证据点。
        - 当前头条估值可以成立，但前提是公司快速验证经常性经济性。
      - - 当前头条估值
        - 外部报道把 2026 年 5 月融资估值视为大致相当于 $1B。
        - $0.95B-$1.05B
        - 市场已经可见。
        - 在这个价位买入的投资者，是在披露追上来之前先承销很大一部分上行空间。
    notes: 区间刻意保持宽泛、基于情景。它们反映公开证据框架，不是建立在缺失私有指标上的 DCF 模型。
