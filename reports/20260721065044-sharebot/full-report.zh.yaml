        title: 服务网络、维护与运营负担
        blocks:
          - type: paragraph
            body: >-
              近期最重要的风险是执行负担。SHAREBOT
              的发布材料和访谈反复描述了一门远不止撮合供需的业务：用户通过平台下单，本地伙伴履约，工程师现场调参，操作员监控实时运行，公司还承诺跨多城市的服务保障。上海假日相关报道把隐藏人力暴露出来。工程师描述的日常包括交付前检查、实时监控、参数调整和应急响应，尤其是在密集公共场所，机器人可能遇到碰撞、意外指令、拥挤和长时间运行。Securities
              Daily 的 2026 年 6 月保险特写把问题从 SHAREBOT 扩展到整个品类：运输、跨场景部署、第三方伤害、系统故障和昂贵维修，都是租赁核心风险，不是边缘情况。因此，Sohu
              的反向观点很重要——护城河可能属于能大规模协调物流、维护、保险和回收的一方，而不是列出最多机器人的一方。这让 SHAREBOT 的服务网络同时成为公司最好资产和最大运营负债。
