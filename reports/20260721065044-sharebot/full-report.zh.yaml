  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 触发因素
      - 观察阈值
      - 为什么重要
      - 行动含义
    rows:
      - - 没有工业重复性
        - 下一次更新仍看不到具名续约、试点转量产，也没有稳定运行证明。
        - 乐观情景依赖经常性运营工作流，而不只是活动需求。
        - 将当前估值视为透支了证据基础。
      - - 服务负担压过定价
        - 价格继续压缩，而操作员、维修和物流成本披露仍缺失或为负面。
        - 业务可能很忙，但经济性仍然单薄。
        - 除非价格大幅回调，否则立场应转向回避。
      - - 融资持续跑在披露前面
        - 估值再次上调，但仍没有披露经审计 KPI 或更清晰的轮次条款。
        - 叙事持续累积却缺少证据，会抬高后续下调估值融资风险。
        - 即便表面估值上升，也应假设优先权风险在上升。
      - - 合作伙伴中立性削弱
        - 少数 OEM 或关联生态方主导供给和经济收益。
        - 集中度会压住市场平台可信度和议价能力。
        - 下调平台可选性和战略退出上行空间。
      - - 事故画像恶化
        - 理赔、故障或合规摩擦上升速度快于服务控制成熟速度。
        - 运营可靠性是企业复购的核心。
        - 重新评估 SHAREBOT 到底是可扩展平台，还是脆弱的服务协调方。
    notes: 这些触发项是下一轮尽调的决策规则，并不等于任何单一失败都会自动否决公司。
    claimRefs:
      - CV039
      - CV043
      - CV045
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 经审计的 2025 年收入，以及 2026 年从订单到确认收入的月度桥接。
        - 没有这组数据，估值就无法锚定规模或增长。
        - CFO 数据室和审计师资料包。
      - - 抽佣率和利润率
        - 按场景拆分的抽佣率、毛利率、操作员成本、物流成本和维修成本。
        - 上述指标决定 SHAREBOT 是平台，还是人力很重的服务生意。
        - 财务团队加运营 KPI 工作簿。
      - - 工业续约
        - 具名工业试点、合同期限、续约率和客户 ROI 证明。
        - 乐观情景取决于运营场景能否反复发生。
        - 客户访谈和合同样本审查。
      - - 留存和集中度
        - 队列留存、重复预订率、头部客户敞口，以及取消 / 退款数据。
        - 有需求活动，不等于收入质量可持续。
        - CRM 导出和队列材料。
      - - 设备池经济性
        - 自有与托管设备池占比、按场景拆分的利用率，以及营运资金节奏。
        - 投资人需要知道资本密集度到底落在哪里。
        - 运营与财务对账。
      - - 融资条款
        - 优先股堆叠、反稀释、投资人权利和股权集中度。
        - 如果条款偏向投资人，表面估值可能高估普通股经济收益。
        - 围绕股权结构表和已签署条款清单的法律尽调。
    notes: 如果管理层能用一手证据回答，这几项最可能迅速改变投资建议。
    claimRefs:
      - CV013
      - CV036
      - CV041
      - CV045
      - CV046
      - CV047
