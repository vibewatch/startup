            body: 平台把机器人变成可预订的服务，并打包操作员、保险和本地履约，从而降低初始 capex 门槛。上游机器人制造商想要分销、场景数据和更快商业化，又不想从零搭建全国服务网络，SHAREBOT 因此具备战略价值。
