  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、变现架构与定价证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一种具体的商业模式形态，但还拼不出干净的损益表。SHAREBOT 并不把自己包装成确认硬件销售收入的机器人 OEM；它呈现为一个 RaaS
              式应用平台，连接机器人供应商、本地服务伙伴、创作者和终端客户。最具体的变现信号来自 4 月的 Tencent 报道，当时 CEO Li Yiyan
              描述了早期完全轻资产结构：战略伙伴拥有或购买机器人，SHAREBOT 运营这些资产，平台赚取运营管理费和服务费。这一点重要，因为它降低直接机队
              capex，却把经济依赖转向抽佣率、利用率和服务执行。定价也比一张简单的单机器人价格卡更分散。发布报道、Xinhua 和 Tencent
              报道指向几类价格：基础机器狗或长周期入门方案每日几百元人民币，主流国内租赁每日低千元人民币，高端打包或定制方案升至五位数，甚至接近 RMB
              100,000。由此形成的业务，收入端大概率混合了平台费、打包解决方案收费和场景定制，但实际成交价仍未披露。
