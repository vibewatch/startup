  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 国内平台与 OEM 关联渠道已在争夺同一接入层
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 在中国的直接竞争图谱，不只是几个相似租赁应用。这个品类现在还包括 Wanjiyi Rental 这样的第二个聚合平台、JD 自营机器人租赁上线和 JoyInside
              生态带来的零售商主导分销，以及让客户可直接租用 Unitree 机器并获得配送、操作员支持和损坏保障的 OEM 关联预订渠道。这很关键，因为 SHAREBOT 当前的价值主张不是独占机器人
              IP，而是便捷接入、城市级调度和打包服务。Wanjiyi 直接复制市场平台逻辑；JD 和 Unitree 关联渠道则把租赁与零售发现、物流、融资和售后服务结合起来，从侧面进攻。结果是，在中国市场，SHAREBOT
              可能有强品牌动能，但尚未拥有客户如何预订、接收、维修或归还机器人的全国标准。
