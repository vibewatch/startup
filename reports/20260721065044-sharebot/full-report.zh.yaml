  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT 英文品牌叫 BOTSHARE，中文为擎天租，做的是机器人租赁和出租平台，而不是单一机器人
              OEM。官网文案和发布报道一直把这项服务描述为机器人即服务（RaaS）市场：连接需求侧客户、供给侧机器人制造商、服务伙伴和运营方。短期产品不是孤立的软件订阅，而是一层协同履约，把机器人选择、预订、现场部署、受训操作员，以及越来越多的保险和维护打包在一起。发布材料显示，公司先从零售活动、展会、婚礼、接待、教育等高可见度场景切入；管理层则称，战略目标是迁移到工业制造、园区运营、仓储、物流等更可重复的工作流。两者叠加后，SHAREBOT
              在所有权叙事上显得轻资产，但在调度、本地服务质量和 uptime 执行上很重。
