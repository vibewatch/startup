  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: SHAREBOT 最高的剩余风险集中在服务执行、价格压力，以及监管期待与公开治理成熟度之间的缺口。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 服务网络执行
          values:
            - label: 高
              tone: negative
              detail: 全国覆盖取决于本地合作伙伴和工程师的一致性。
            - label: 高
              tone: negative
              detail: 执行薄弱会同时打击在线率、利润率和品牌信任。
            - label: 部分
              tone: neutral
              detail: 网络已经存在，但 SLA 证明未公开。
            - label: 高
              tone: negative
              detail: 这是近期投资判断的核心风险。
        - label: 价格压缩
          values:
            - label: 高
              tone: negative
              detail: 多个信源已经提到日租金下滑。
            - label: 高
              tone: negative
              detail: 价差收窄会很快吃掉中介经济性。
            - label: 低
              tone: negative
              detail: 没有公开证据表明 SHAREBOT 能靠效率抵消价格压力。
            - label: 高
              tone: negative
              detail: 利润率脆弱性仍然突出。
        - label: Agibot 依赖
          values:
            - label: 中高
              tone: negative
              detail: 管理层和上线证据显示 SHAREBOT 与 Agibot 绑定很深。
            - label: 高
              tone: negative
              detail: 集中度过高可能扭曲中立性和供给获取。
            - label: 部分
              tone: neutral
              detail: 开放平台叙事有帮助，但不能消除关联方风险。
            - label: 中高
              tone: negative
              detail: 需要直接尽调商业条款。
        - label: 隐私 / 安全合规
          values:
            - label: 中高
              tone: negative
              detail: 公共场景部署和数据采集带来真实合规负担。
            - label: 高
              tone: negative
              detail: 一起可见事故就可能伤害信任，并拖慢企业采用。
            - label: 早期
              tone: neutral
              detail: 政策和保险已经有了；治理证明更薄。
            - label: 中高
              tone: negative
              detail: 监管态度支持，但要求不低。
        - label: 需求质量 / 重复使用
          values:
            - label: 高
              tone: negative
              detail: 现有证据仍偏向活动和节假日需求。
            - label: 高
              tone: negative
              detail: 重复需求弱，会削弱利用率和合作伙伴经济性。
            - label: 低
              tone: negative
              detail: 没有披露公开队列或留存指标。
            - label: 高
              tone: negative
              detail: 这是最需要盯住的投资逻辑破裂信号。
        - label: 融资 / 估值脆弱性
          values:
            - label: 中高
              tone: negative
              detail: 融资节奏快于运营披露。
            - label: 高
              tone: negative
              detail: 估值重置会限制增长投入，也会压低合作伙伴信心。
            - label: 低
              tone: negative
              detail: 目前没有公开经济性材料填上缺口。
            - label: 中高
              tone: negative
              detail: 在基本面可见之前，剩余风险仍处高位。
    claimRefs:
      - CR004
      - CR007
      - CR018
      - CR024
      - CR037
      - CR041
      - CR048
