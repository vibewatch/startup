        title: 资本充足性、融资依赖与投资者组合
        blocks:
          - type: paragraph
            body: >-
              融资是最清楚的公开财务数据点，但更应视为面向未来的燃料，而不是盈利能力证明。SHAREBOT 在数月内从种子轮走到天使轮、pre-A，再到 A/A+，最终形成据报道 RMB 7 billion 的估值和
              Crunchbase 的 $1 billion 独角兽标题。这个速度说明投资者胃口很强，但胃口的构成也很重要：36Kr、Baidu Baike 和 Tencent
              都指向战略产业投资者、上市公司、生态内部人士，以及娱乐或消费侧资本的混合。换句话说，股权结构表看起来既是为了提供现金，也是为了打开场景和渠道。最新一轮降低了短期融资风险，但也为非常激进的铺开提供资金：更多城市、更多伙伴、更多创作者、更多工业场景、全球
              app 和 SaaS
              工具，以及潜在国际扩张。即便采用轻资产模式，这也意味着在伙伴赋能、销售、调度系统、保险、维护链路和应收支持上会有实质性支出。由于公司仍未披露现金、烧钱速度、现金跑道或轮次条款，审慎读法是：在管理层证明服务费和场景解决方案能为网络增长买单前，SHAREBOT
