        - RMB 200-499 / 天
        - 多为标价式或促销价
        - 硬件使用权和基础交付时段
        - 利用率、补贴成本和合作伙伴分成未知
        - 入门价低能拉动需求，但没有规模时利润空间可能很薄
      - - 国内主流人形机器人租赁
        - RMB 1,499-5,000 / 天
        - 观察到的市场价格，不是已披露平均实际成交价
        - 多数情况下包括机器人、操作员或安全支持、现场处理
        - 折扣、差旅费和停机时间未知
        - 价格已跌到几千元低段，挤压套利经济账
      - - 高端定制套餐
        - 最高约 RMB 100,000 / 天
        - 套餐卡 / 场景报价
        - 技术人员、定制编程、演出设计、多机器人协同
        - 实际毛利率和可重复性未知
        - 只要服务质量守得住，高价打包方案可以抵消低端价格压缩
      - - Tencent 上线套餐
        - 起价 RMB 13,300 或 RMB 16,900 / 天
        - 公开套餐报价
        - 预设租赁组合，另可选择定制
        - 转化率和增购结构未知
        - 支撑打包解决方案收入，而不只是按机器人计费
      - - 欧洲 Lingxi X2 租赁
        - EUR 2,000-3,000 / 天
        - 管理层公开提到的个案价格
        - 本地服务合作伙伴交付与支持
        - 本地合规、人工和合作伙伴分成未知
        - 国际定价可能抬高 ASP，但也增加执行成本
      - - 北美 Expedition 租赁
        - 最高 USD 6,000 / 天
        - 管理层公开提到的个案价格
        - 合作伙伴支持下的本地化部署
        - 价格上限能否持续尚未验证
        - 存在潜在上行，但没有规模数据前不应放进基准情景
    notes: 各行反映公开标价、套餐价或访谈级价格信号。没有任何一行提供 SHAREBOT 的实际平均价格、贡献毛利率或客户层面留存经济账。
