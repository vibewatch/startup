  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows from real demand and strategic potential colliding with thin public economics and wide
      scenario uncertainty.
    data:
      nodes:
        - id: n1
          label: Category demand is real
          detail: Public sources show orders, fleet growth, and policy support.
        - id: n2
          label: Industrial upside exists
          detail: Management and policy sources point toward logistics, parks, and manufacturing scenarios.
        - id: n3
          label: Service burden is heavy
          detail: Pricing, logistics, operators, repair, and insurance still shape economics.
        - id: n4
          label: Public disclosure is thin
          detail: No public revenue, margin, burn, runway, or round-term detail.
        - id: n5
          label: Public comps are split
          detail: Microcap robotics can trade far below $1B, scaled automation far above it.
        - id: n6
          label: Current mark already ambitious
          detail: The ~$1B headline leans into upside before proof catches up.
        - id: n7
          label: 'Recommendation: research-more'
          detail: Stay engaged, but demand more proof or better price before underwriting.
      edges:
        - from: n1
          to: n2
          label: supports upside
        - from: n1
          to: n7
          label: keeps thesis alive
        - from: n2
          to: n6
          label: explains enthusiasm
        - from: n3
          to: n7
          label: raises risk
        - from: n4
          to: n7
          label: blocks buy call
        - from: n5
          to: n6
          label: widens range
        - from: n6
          to: n7
          label: forces discipline
    approximationNotes: This flow compresses the chapter’s judgment into decision nodes; it is not a disclosed company process map.
    claimRefs:
      - CV006
      - CV009
      - CV012
      - CV013
      - CV032
      - CV040
      - CV041
      - CV045
  - id: FV002
    title: Valuation sensitivity to undisclosed revenue scale
    type: bar
    layout: standard
    summary: >-
      At a fixed $1B headline, implied revenue multiples collapse quickly only if SHAREBOT is already at substantial
      undisclosed scale.
    data:
      items:
        - label: If revenue is $10M
          value: 100
        - label: If revenue is $25M
          value: 40
        - label: If revenue is $50M
          value: 20
        - label: If revenue is $100M
          value: 10
        - label: If revenue is $200M
          value: 5
        - label: If revenue is $300M
          value: 3.3
    approximationNotes: >-
      Bars show implied market-cap-to-revenue multiples using the roughly $1B headline and hypothetical revenue levels
      because SHAREBOT does not publicly disclose revenue.
    claimRefs:
      - CV035
      - CV036
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Wide scenario bands are more defensible than a point estimate because the largest debate is still proof quality
      rather than spreadsheet precision.
    data:
      items:
        - label: Bear (30%)
          low: 0.3
          value: 0.45
          high: 0.6
          unit: $B
        - label: Base (50%)
          low: 0.6
          value: 0.8
          high: 0.95
          unit: $B
        - label: Bull (20%)
          low: 1.1
          value: 1.3
          high: 1.6
          unit: $B
        - label: Current headline
          low: 0.95
          value: 1
          high: 1.05
          unit: $B
    approximationNotes: >-
      Ranges are illustrative scenario bands anchored to public comparison lenses and missing-disclosure penalties, not
      to a DCF based on unavailable company financials.
    claimRefs:
      - CV001
      - CV038
      - CV039
      - CV040
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scores on a 1-5 scale translate the chapter into a decision snapshot grounded in public evidence only.
    data:
      items:
        - label: Market opportunity
          score: 4
          detail: Demand and policy signals are real, and the category is scaling quickly.
        - label: Strategic positioning
          score: 4
          detail: SHAREBOT is early but visibly central in the robot-deployment conversation.
        - label: Operating proof
          score: 2
          detail: Fleet and order anecdotes exist, but audited financial and renewal proof do not.
        - label: Unit economics visibility
          score: 1
          detail: Public evidence does not reveal revenue quality, gross margin, or cash efficiency.
        - label: Valuation support
          score: 2
          detail: The headline is plausible only under optimistic execution assumptions.
        - label: Risk profile
          score: 2
          detail: Execution, financing, and disclosure risks are still unusually high.
        - label: Evidence quality
          score: 2
          detail: The source set is good enough for scenario framing, not enough for precision underwriting.
    approximationNotes: Scores are directional and intentionally conservative because they use only public June 2026 evidence.
    claimRefs:
      - CV013
      - CV028
      - CV029
      - CV041
      - CV042
      - CV043
      - CV044
