      - number: '7.3'
        title: Ecosystem dependence, governance opacity, and financing fragility
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT is marketed as an open platform, but the public record still ties it tightly to the Agibot
              ecosystem. Agibot co-hosted the launch, Jiang Qingsong appears publicly as both an Agibot partner and
              SHAREBOT chairman, and Tencent coverage frames the platform as a way for Agibot’s own robots and
              capabilities to reach more scenarios while the broader ecosystem fills gaps. That dependence can be
              helpful while supply is scarce and standards are immature, but it creates real concentration risk around
              product access, partner neutrality, and related-party economics if third-party OEMs or service partners
              believe Agibot receives preferential treatment. Governance opacity amplifies the issue. Public materials
              discuss investors, executives, and growth plans, yet still leave board composition, formal risk oversight,
              related-party rules, and unit-economics disclosure largely absent. Financing pace adds pressure rather
              than comfort. SHAREBOT moved from seed financing to unicorn-level headlines within months, and adverse
              commentary already questions whether order volume and disclosed operating proof justify the valuation
              step-up. If financing expectations outrun visible economics, later rounds can become more fragile even if
              top-line activity still looks busy.
            claimRefs:
