  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Bull / pro-thesis
      - Anti-thesis / why it may fail
      - What would change the view
    rows:
      - - Market timing
        - Robot-rental demand and policy support are real, with public sources showing rapid category awareness.
        - Demand can stay real while economics stay novelty-led and episodic.
        - Evidence that industrial and enterprise demand becomes repeat rather than showcase traffic.
      - - Business model
        - >-
          A platform that coordinates OEMs, partners, and scenarios could become the operating layer for robot
          deployment.
        - The platform may remain a heavy service coordinator with limited software-like margin.
        - Take-rate disclosure and contribution-margin by scenario.
      - - Strategic scarcity
        - Fast fundraising and unicorn status may reflect category leadership in an emerging bottleneck.
        - Fast fundraising can also reflect hype, not durable economics.
        - Proof that later fundraising follows operating progress, not just narrative momentum.
      - - Comparable set
        - Public peers show room for large outcomes if automation platforms scale.
        - Public peers also show brutal compression when scale, controls, or recurring economics disappoint.
        - More mature disclosure that clarifies which peer bucket SHAREBOT actually belongs in.
      - - Execution moat
        - Local delivery, uptime, insurance, and partner management could be hard to replicate.
        - Those same layers can absorb margin and make scaling operationally messy.
        - City-level SLA, incident, and retention metrics.
      - - Exit path
        - If SHAREBOT industrializes, it could become an attractive strategic or growth-equity platform asset.
        - Weak governance, thin controls, or thin KPIs can delay IPO-readiness and compress exit value.
        - Board-quality reporting, audit readiness, and cleaner cap-table disclosure.
    notes: >-
      The table pairs upside and downside arguments so the recommendation stays evidence-sensitive rather than
      company-quality-only.
