          - type: callout
            title: Office and retail deployments matter strategically
            body: >-
              The Rui'an / Shui On WorkX deployment is strategically important because it moves SHAREBOT beyond pure
              stage performance into office, commercial-property, merchant, and retail-traffic workflows where recurring
              property budgets might eventually exist.
