          - type: callout
            title: Durability remains the main diligence hole
            body: >-
              The source pack never discloses NRR, GRR, churn, renewal rate, contract length, or top-customer revenue
              share, and Xinhua explicitly says repeat customers are rare. Investors can see adoption activity, but not
              yet recurring revenue quality.
            calloutType: risk
            claimRefs:
