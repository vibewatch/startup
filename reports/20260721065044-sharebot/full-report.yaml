      - number: '1.3'
        title: Funding history, ownership signals, and early scale
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT compressed an unusual amount of financing activity into less than six months of public life.
              Baidu Baike and March financing coverage point to a January 2026 seed round, a March angel and angel+
              package worth more than RMB 100 million at a reported RMB 3 billion valuation, an April Pre-A led by
              industrial and listed-company capital, and May 2026 A and A+ rounds that multiple outlets say lifted
              valuation to RMB 7 billion. Crunchbase News separately counted SHAREBOT among May 2026’s new unicorns and
              listed it at a $1 billion valuation, which is directionally consistent with the Chinese reporting even
              though the RMB-USD conversion is slightly lower at spot rates. Operationally, public traction metrics are
              still marketplace-style rather than financial: 50 core cities at launch, 600-plus service providers, more
              than 1,000 devices initially, more than 3,000 deployable robots by March 2026, and more than 5,500
              cumulative orders. These are meaningful network-effect indicators, but they are not substitutes for
              disclosed revenue, margins, or utilization.
