  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold to watch
      - Why it matters
      - Action implication
    rows:
      - - No industrial repeatability
        - Next refresh still shows no named renewals, no pilot-to-production conversions, and no uptime proof.
        - The bull case depends on recurring operational workflows, not only event demand.
        - Treat current valuation as over-earning its evidence base.
      - - Service burden overwhelms pricing
        - Pricing keeps compressing while operator, repair, and logistics cost disclosure remains absent or negative.
        - The business could stay busy but economically thin.
        - Move stance toward avoid unless price resets sharply.
      - - Financing keeps outrunning disclosure
        - Another valuation step-up arrives without audited KPI release or clearer round terms.
        - Narrative compounding without proof raises down-round risk later.
        - Assume preference risk is rising even if the headline mark goes up.
      - - Partner neutrality weakens
        - A small set of OEMs or related ecosystem actors dominates supply and economics.
        - Concentration can cap marketplace credibility and bargaining power.
        - Discount platform optionality and strategic-exit upside.
      - - Incident profile worsens
        - Claims, failures, or compliance friction rise faster than service controls mature.
        - Operational reliability is central to repeat enterprise adoption.
        - Reassess whether SHAREBOT is a scalable platform or a brittle services coordinator.
    notes: >-
      These triggers are designed as decision rules for the next diligence cycle, not as claims that any single failure
      automatically kills the company.
    claimRefs:
      - CV039
      - CV043
      - CV045
      - CV046
