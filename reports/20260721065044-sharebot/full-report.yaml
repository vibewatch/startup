          to: f4
        - from: f4
          to: f5
    approximationNotes: >-
      The flow abstracts repeated operating roles from launch, partner-network, and JD-service reporting rather than a
      single disclosed SOP.
    claimRefs:
      - CU027
      - CU029
      - CU030
      - CU042
      - CU043
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      SHAREBOT’s highest-residual risks cluster around service execution, pricing pressure, and the gap between
      regulatory expectations and public governance maturity.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Service-network execution
          values:
            - label: High
              tone: negative
              detail: National reach depends on local partner and engineer consistency.
            - label: High
              tone: negative
              detail: Weak execution can hit uptime, margin, and brand trust simultaneously.
            - label: Partial
              tone: neutral
              detail: Network exists, but SLA proof is not public.
            - label: High
              tone: negative
              detail: This is the core near-term underwriting risk.
        - label: Price compression
          values:
            - label: High
              tone: negative
              detail: Multiple sources already describe falling daily rents.
            - label: High
              tone: negative
              detail: Lower spreads can erase intermediary economics quickly.
            - label: Low
              tone: negative
              detail: No public proof that SHAREBOT offsets price pressure with efficiency.
            - label: High
              tone: negative
              detail: Margin fragility remains acute.
        - label: Agibot dependence
          values:
            - label: Medium-high
              tone: negative
              detail: Leadership and launch evidence tie SHAREBOT tightly to Agibot.
            - label: High
              tone: negative
              detail: Concentration can distort neutrality and supply access.
            - label: Partial
              tone: neutral
              detail: Open-platform rhetoric helps but does not remove related-party risk.
            - label: Medium-high
              tone: negative
              detail: Needs direct diligence on commercial terms.
        - label: Privacy / safety compliance
          values:
            - label: Medium-high
              tone: negative
              detail: Public-scene deployment and data collection create real compliance load.
            - label: High
              tone: negative
              detail: A visible incident could damage trust and slow enterprise adoption.
            - label: Early
              tone: neutral
              detail: Policies and insurance exist; governance proof is thinner.
            - label: Medium-high
              tone: negative
              detail: Regulation is supportive but demanding.
        - label: Demand quality / repeat usage
          values:
            - label: High
              tone: negative
              detail: Current evidence still skews toward event and holiday demand.
            - label: High
              tone: negative
              detail: Weak repeat demand undercuts utilization and partner economics.
            - label: Low
              tone: negative
              detail: No public cohort or retention metrics are disclosed.
            - label: High
              tone: negative
              detail: This is the main thesis-break signal to watch.
        - label: Financing / valuation fragility
          values:
            - label: Medium-high
              tone: negative
              detail: Funding pace has been faster than operating disclosure.
            - label: High
              tone: negative
              detail: A reset can constrain growth spending and partner confidence.
            - label: Low
              tone: negative
              detail: No public economics deck closes the gap yet.
            - label: Medium-high
              tone: negative
              detail: Residual risk remains elevated until fundamentals are visible.
    claimRefs:
      - CR004
      - CR007
      - CR018
      - CR024
      - CR037
      - CR041
      - CR048
