      - number: '1.2'
        title: Leadership, founders, and governance context
        blocks:
          - type: paragraph
            body: >-
              Leadership appears to be split between the Agibot ecosystem and a consumer-internet operating bench.
              Independent and quasi-reference coverage identifies Jiang Qingsong as chairman, a partner at Zhiyuan
              AGIBOT, and the legal representative of the Shanghai operating entity. Li Yiyan is consistently identified
              as chief executive officer and the main spokesperson explaining why the company exists: lowering adoption
              friction is only the first step, while the harder problem is stable and repeatable service delivery in
              real production settings. Chinese-language reference material further says the platform was co-founded by
              Zhiyuan Robotics-related entities and Flycode, and that former Alibaba and Ele.me executives joined in
              early 2026 to expand operations and strategy. What remains missing is normal late-seed governance
              disclosure: there is no public board list, no shareholder rights summary, and no disclosed controls around
              related-party dependence on the Zhiyuan ecosystem. For diligence purposes, founder-market fit is strong,
              but governance transparency is still thin.
