      - number: '3.2'
        title: Global RaaS and logistics substitutes are operationally more mature in warehouses
        blocks:
          - type: paragraph
            body: >-
              For logistics or warehouse buyers, the most relevant substitute is often not another humanoid-rental
              marketplace at all. Locus, inVia, Vecna, and Geek+ sell or operate recurring automation programs whose
              promise is throughput, uptime, and labor productivity inside real fulfillment environments. Those vendors
              do not need to win the same event-rental demand that powers much of China’s near-term humanoid excitement.
              They only need to persuade a warehouse manager that subscription robotics with monitoring, software,
              maintenance, and fast scaling is safer than experimenting with a general-purpose rental platform. That
              makes SHAREBOT’s industrial and logistics expansion structurally harder than its commercial-show
              expansion: in those buyers’ eyes, the benchmark is no longer “Can I book a robot quickly?” but “Can this
              provider hit SLAs, integrate into my workflow, and keep the fleet running at predictable cost?”
