      - number: '3.3'
        title: Industrial incumbents compete through service-channel trust, not open marketplaces
        blocks:
          - type: paragraph
            body: >-
              In factories, SHAREBOT’s hardest substitute may be the incumbent service stack of ABB, KUKA, and FANUC.
              Their competition is less visible on consumer-facing rental pages, but more powerful in procurement
              reality. Each offers lifecycle support, training, modernization, spare-parts or maintenance
              infrastructure, and long-standing relationships with plant engineers. IFR’s 2024 data show how large that
              installed base already is in China: 295,000 industrial robot installations in one year and more than 2
              million robots in operation. In that context, a plant manager does not need another app to discover
              robotics demand; the manager already has trusted vendors, support teams, and qualification paths. SHAREBOT
              can still matter where flexible access lowers trial risk, but factory buyers may view incumbent channels
              as the safer answer whenever uptime, compliance, and long-term support carry more weight than short-term
              asset access. Another way to frame the risk is that factory procurement teams already have escalation
              paths, training routines, and spare-parts habits tied to these vendors. Even if SHAREBOT can source a
              compatible machine, it still must prove the equivalent reliability of field service, troubleshooting, and
              accountability when something fails during production.
            claimRefs:
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
              - CP035
      - number: '3.4'
        title: Price pressure and fulfillment quality now matter more than novelty
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is consistent across Chinese coverage: public attention created demand, but it also
              accelerated oversupply and pricing pressure. Xinhua, Yicai, Sohu, RoboHorizon, and China Daily all
              describe a market where event-led demand remains important, prices have fallen sharply from peak hype, and
              the spread economics of simple matchmaking are shrinking. Local operators in multiple cities are already
              monetizing rentals, which means SHAREBOT must coordinate a fragmented supply base while defending against
              JD-style infrastructure bundles and warehouse RaaS substitutes. That pushes moat analysis away from
              storytelling and toward operations. The scarce capabilities are rapid maintenance, reliable dispatch,
              insurance handling, partner density, and repeatable scenario execution. What remains missing in public is
              the hard underwriting evidence—take rates, utilization, gross margin, and industrial win-loss data—that
              would prove SHAREBOT can convert category momentum into durable economics before competitors normalize the
              same service bundle. That missing evidence keeps the moat story provisional rather than proven.
            claimRefs:
              - CP022
              - CP023
              - CP024
