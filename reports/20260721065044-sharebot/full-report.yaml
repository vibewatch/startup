  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Repeat-demand weakness
        - Order mix remains dominated by festivals, weddings, and promo events
        - No visible shift toward recurring enterprise workflows within 12-18 months
        - Treat service demand as novelty-led and underwrite lower terminal margin
      - - Service-network underperformance
        - By-city outages, missed deliveries, or incident rates stay opaque or worsen
        - Management cannot show standardized SLA / incident reporting across top cities
        - Pause underwriting until operating-system proof improves
      - - Agibot concentration
        - Multi-brand supply remains nominal while Agibot devices dominate volume
        - Third-party OEM share or partner satisfaction looks weak
        - Discount platform-neutrality claims and assume concentration risk
      - - Valuation / financing fragility
        - New rounds continue stepping ahead of revenue and margin disclosure
        - Fundraising depends on headline markups without economics transparency
        - Assume down-round or structured-financing risk rises materially
      - - Industrial timing miss
        - Industrial / logistics pilots do not convert into validated repeat deployments
        - No named production references or validation reports despite policy push
        - Push out industrial TAM realization and compress base-case adoption
      - - Compliance maturity lag
        - Privacy / safety governance remains policy-only with no certification or audit proof
        - No disclosed compliance owner, audit process, or safety playbook
        - Escalate diligence and price in higher legal / reputational downside
    notes: >-
