companyProfile:
  summary: >-
    SHAREBOT is a Pudong, Shanghai-based robot-leasing platform that positions itself as a Robot-as-a-Service
    marketplace and service layer between robot supply, local service partners, and enterprise users. Public materials
    show strongest early traction in event, retail, restaurant, office, and promotional deployments, while management
