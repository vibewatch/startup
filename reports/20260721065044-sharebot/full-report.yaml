      - number: '2.3'
        title: Policy support and structural demand drivers
        blocks:
          - type: paragraph
            body: >-
              The broader robotics backdrop is unusually favorable in China. IFR, Statista, and SCIO/Xinhua materials
              all show that China is already the world’s largest industrial robotics market by stock and annual
              installations, while national policy is now deliberately steering the sector from traditional automation
              toward embodied and intelligent robotics. The June 2026 MIIT-SASAC action plan is especially relevant for
              SHAREBOT because it explicitly names industrial, service, and special-scenario deployments across
              manufacturing, inspection, maintenance, warehousing and logistics, retail, healthcare, and emergency
              response. It also encourages commercial innovation such as Robot-as-a-Service, operating leases, and
              pay-by-effect models to reduce user investment thresholds. In parallel, China’s standard-setting effort,
              real-scenario training infrastructure, open data programs, and shared testing bases are intended to
              shorten the path from demo to deployable product. For SHAREBOT, these policies matter less because they
              hand it subsidies directly, and more because they widen the set of scenarios in which renting a robot can
              become institutionally acceptable procurement behavior.
            claimRefs:
