      - number: '2.4'
        title: Constraints, timing, and commercialization risks
        blocks:
          - type: paragraph
            body: >-
              The market is expanding, but the friction is obvious in the source base. IFR is explicit that humanoids
              should not be confused with mature industrial robots: high-speed precision manufacturing will keep using
              specialized industrial systems for the foreseeable future, and wide humanoid adoption in factories or
              households is still a later-plan outcome, not a near-term baseline. IDC adds a different bottleneck from
              the demand side: users broadly accept the value proposition of industrial robots, but still want better
              performance, software, after-sales service, and easier systems integration. Sohu’s June 2026 rental
              analysis shows the commercial consequence of those gaps. As supply increases, rental prices fall quickly,
              shrinking the spread economics available to simple matchmakers and shifting differentiation toward
              logistics, maintenance, insurance, choreographing, repair, and recovery. In short, SHAREBOT’s market
              opportunity is real, but the investable version of that market depends on whether platforms can turn
              show-driven demand into repeatable service workflows before price compression destroys margins.
            claimRefs:
              - CM008
              - CM009
              - CM018
              - CM021
              - CM022
              - CM023
              - CM024
