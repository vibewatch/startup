      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              The real debate is not whether SHAREBOT matters, but whether today’s price is already paying for
              tomorrow’s proof.
            body: >-
              SHAREBOT has enough market traction and strategic positioning to stay on an investor watchlist. The
              missing link is not attention; it is audited operating evidence that connects the unicorn headline to
              repeatable economics.
            calloutType: insight
            claimRefs:
              - CV001
              - CV006
              - CV013
              - CV041
          - type: callout
            title: Private-market enthusiasm is running ahead of public disclosure.
            body: >-
              Public peers show that robotics valuations can range from distressed service multiples to very rich
              option-value multiples, but they also show that markets eventually force a choice. SHAREBOT has not yet
              provided the public metrics needed to justify where it belongs on that spectrum.
            calloutType: risk
            claimRefs:
              - CV032
              - CV033
              - CV040
