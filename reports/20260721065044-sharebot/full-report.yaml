        title: Exhibits
        blocks:
          - type: callout
            title: Robot rental is best understood as an on-ramp, not the whole market
            body: >-
              The strongest market logic for SHAREBOT is not that rentals themselves become the majority of robotics
              spend. It is that leasing, short-term deployment, and RaaS can convert curiosity into trial, and trial
              into recurring operational use, while manufacturers and service providers collect real-world data.
            calloutType: insight
            claimRefs:
              - CM006
              - CM014
              - CM016
              - CM031
          - type: callout
            title: The niche is growing faster than its economics are being proven
            body: >-
              Sources agree on demand expansion and price declines at the same time. That combination means the total
              market can grow while platform margins deteriorate. Without reliable dispatch, maintenance, insurance, and
              recovery economics, a larger market does not automatically translate into a better business.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM038
              - CM039
          - type: callout
            title: China’s policy stack is unusually aligned with SHAREBOT’s thesis
            body: >-
              Few markets combine robot-manufacturing scale, national standards work, real-scenario pilot
              infrastructure, and explicit endorsement of service or leasing-style commercialization. China’s policy and
              supply backdrop makes it plausible for a robot-leasing platform to scale faster there than in most other
              geographies.
            calloutType: strength
            claimRefs:
