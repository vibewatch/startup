      - number: '4.3'
        title: Capital adequacy, financing dependency, and investor mix
        blocks:
          - type: paragraph
            body: >-
              Funding is the clearest public financial data point, but it should be read as forward fuel rather than
              proof of earnings power. SHAREBOT moved from seed to angel, pre-A, and then A/A+ within months,
              culminating in a reported RMB 7 billion valuation and a Crunchbase $1 billion unicorn headline. That speed
              signals strong investor appetite, yet the composition of that appetite matters: 36Kr, Baidu Baike, and
              Tencent all point to a mix of strategic industrial investors, listed companies, ecosystem insiders, and
              entertainment or consumer-facing capital. In other words, the cap table appears designed to open scenarios
              and channels as much as to provide cash. The newest round reduces immediate financing risk, but it also
              funds a very ambitious rollout: more cities, more partners, more creators, more industrial scenarios,
              global app and SaaS tooling, and potentially international expansion. Even under a light-asset model, that
              implies meaningful spending on partner enablement, sales, dispatch systems, insurance, maintenance links,
              and receivables support. Because the company still does not disclose cash, burn, runway, or round terms,
              the prudent reading is that SHAREBOT remains funding-dependent until management proves that service fees
              and scenario solutions can finance network growth.
