      - number: '8.3'
        title: Scenario framing, not point-estimate certainty
        blocks:
          - type: paragraph
            body: >-
              The right way to frame SHAREBOT today is through scenarios rather than a single-number target. The bull
              case assumes the company becomes the default orchestration layer for embodied-robot deployment in China:
              industrial and enterprise workflows start to recur, dispatch density improves, partner neutrality remains
              credible, and monetization comes from reliable platform and service economics rather than one-off event
              bursts. The base case is more modest. SHAREBOT still becomes a real category company, but its economics
              remain hybrid and labor-influenced for longer than investors hope, with industrial deployment scaling
              slower than the financing story suggests. The bear case is not that robot demand disappears; it is that
              demand stays real but mostly episodic, pricing keeps compressing, human support and repair stay heavy, and
              later investors refuse to keep paying step-up marks without audited evidence. Under that framing, the
              current headline already leans into upside. A $1 billion mark can be rationalized only if SHAREBOT proves
              it belongs materially above the public microcap robotics bucket and begins to close the disclosure gap
              around revenue quality, repeatability, and unit economics. Until then, scenario width matters more than
              decimal-point precision.
