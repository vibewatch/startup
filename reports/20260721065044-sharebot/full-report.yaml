  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline valuation versus public operating disclosure
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT’s May 2026 financing headline is easy to repeat and much harder to underwrite. Multiple English
              and Chinese sources agree on the core fact pattern: the company completed Series A and A+ rounds worth
              several hundred million renminbi, the new mark reached RMB 7 billion, and management intends to use the
              money to shift from event-led deployments toward a broader RaaS platform for industrial, park,
              warehousing, logistics, and commercial-service use cases. That is enough to establish that the valuation
              exists and that investors are paying for a platform thesis rather than a single project. It is not enough
              to establish that the current price is supported by disclosed economics. The same source set that confirms
              the headline also shows what is missing: there is still no public revenue, ARR, gross margin, burn,
              runway, or cap-table-term disclosure, and public operating markers still lean heavily toward dispatchable
              fleet, city coverage, order anecdotes, and scenario breadth. Publicly, the raise reads like a strategic
              scarcity trade on category leadership in robot deployment infrastructure. The diligence burden is
              therefore not to prove that demand exists at all; it is to test whether the $1 billion equivalent mark is
              being paid for a real operating flywheel or for a fast-moving narrative whose financial shape remains
              private.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
