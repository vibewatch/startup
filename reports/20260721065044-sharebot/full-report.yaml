            body: >-
              SHAREBOT has public evidence of real customer demand across multiple surfaces: 50 launch cities, more than
              600 service providers, more than 1,000 devices, Spring Festival order spikes, a named restaurant client,
              and a named office-property deployment. That is materially stronger than a pure concept-stage marketplace
              pitch.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
