  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Domestic platforms and OEM-linked channels already contest the same access layer
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT’s Chinese direct landscape is broader than a simple list of lookalike rental apps. The category
              now includes a second platform-style aggregator in Wanjiyi Rental, retailer-led distribution through JD’s
              self-operated robot rental launch and JoyInside ecosystem, and OEM-linked booking channels that let
              customers rent Unitree machines directly with delivery, operator support, and damage cover. That matters
              because SHAREBOT’s current value proposition is not exclusive robot IP; it is convenient access,
              city-level dispatch, and bundled service. Wanjiyi copies the marketplace logic directly, while JD and
              Unitree-linked channels attack it indirectly by combining rentals with retail discovery, logistics,
              financing, and after-sales service. The result is a domestic field where SHAREBOT may have strong brand
              momentum, but does not yet own the national standard for how a customer books, receives, repairs, or
              returns a robot.
