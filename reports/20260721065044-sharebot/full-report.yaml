          - type: callout
            title: A better information-to-price ratio matters more than another narrative upgrade.
            body: >-
              The next diligence win is not another article about category growth. It is primary evidence on revenue,
              retention, industrial renewals, and round terms. Without that, a disciplined investor should prefer
              patience over momentum chasing.
            calloutType: recommendation
