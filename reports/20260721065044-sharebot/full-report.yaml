  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and safety risk
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT already sits inside a heavier regulatory perimeter than a generic classifieds marketplace because
              the product bundles physical robots, payments, user identities, delivery coordination, on-site operations,
              and increasingly public-scene interaction. The company’s own privacy policy says the service spans its
              app, mini-program, website, and third-party integrations, and that it collects device identifiers, order
              details, addresses, budgets, use scenarios, photos, video, and payment-linked information. Meanwhile, the
              2026 MIIT/SASAC deployment action and CAC’s smart-agent implementation opinion both push the sector toward
              stronger lifecycle management, privacy controls, behavior boundaries, collision detection, black-box
              traceability, and explicit responsibility allocation before large-scale deployment. That is positive for
              long-run industry legitimacy, but it also means a young operator like SHAREBOT can be pulled into
              compliance work faster than its public disclosures suggest. The presence of insurance products covering
              third-party liability, product liability, and information leakage is useful corroboration that the
              real-world risk set is already understood by insurers. The problem is not absence of mitigation; it is
              that public evidence of board-level governance, certifications, and incident-governance maturity is still
              thin relative to the pace of commercial rollout.
            claimRefs:
              - CR001
              - CR002
