      - number: '8.4'
        title: Recommendation, entry discipline, and thesis-break signals
        blocks:
          - type: paragraph
            body: >-
              The practical investment conclusion is to keep SHAREBOT on the front foot strategically while staying
              conservative on price. Public evidence is strong enough to reject the view that SHAREBOT is a fake company
              or a pure concept deck: the financing happened, the market exists, service demand is real, and multiple
              public sources show a platform trying to solve deployment infrastructure rather than only leasing
              hardware. But the evidence is still too thin for a buy-style call at the current headline. The company has
              not yet shown the audited financial and cohort data needed to tell investors whether it deserves to be
              compared to speculative option-value names, to service-heavy robotics operators, or eventually to scaled
              automation platforms. That is why the cleanest stance is research-more with medium confidence, high risk,
              and a stretched valuation posture. The next diligence cycle should focus on revenue recognition, take
              rate, renewal and retention, industrial pilot conversion, uptime and incident data, and round-term detail.
              If those checks are strong, the current mark may look prescient. If they remain private while valuations
              keep stepping up, the thesis should be treated as increasingly fragile rather than increasingly confirmed.
            claimRefs:
