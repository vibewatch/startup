      - number: '5.1'
        title: Product surface and ordering workflow
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT presents the customer-facing product as a scenario-led rental workflow rather than a bare
              equipment marketplace. The English and Chinese sites both push a WeChat mini-program or app entry point,
              assisted by customer service for quoting and scenario adaptation, while the iOS listing adds concrete
              buyer controls such as scenario selection, rental duration, device quantity, operator add-ons, custom
              content, and multiple payment methods. Public launch and seasonal-demand coverage show the platform
              leaning into weddings, annual galas, exhibitions, mall activations, temple fairs, and school or
              parent-child events because those use cases can tolerate current robot limitations while still paying for
              novelty and service. In practice, the product promise is convenience plus offline fulfillment: users
              browse a package, configure a job, place an order, and rely on SHAREBOT’s network to deliver a robot,
              operator, and script that can actually run on site.
