        title: Customer segments, sectors served, and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT is not selling to one homogeneous customer class. Official site copy positions the platform as a
              matchmaker between robotics service providers and end clients, and explicitly highlights restaurants,
              retail, and corporate events as target sectors. Launch and trade-show coverage broadens that set into
              conferences, weddings, education, malls, exhibitions, cultural tourism, celebrations, and reception
              workflows. That matters because the payer often differs from the user: a brand manager may fund a mall
              activation, a restaurant chain may use the robot to improve guest engagement during a holiday campaign,
              while an office operator or landlord may care more about tenant experience and property traffic. The
              official material and later deployment reporting consistently suggest that SHAREBOT wins first where
              customers want short-duration robotic capability without owning hardware, while management keeps framing
              industrial, logistics, and routine service scenarios as the next expansion wedge rather than the current
              revenue center.
