      - number: '4.2'
        title: Service-heavy unit economics and margin path constraints
        blocks:
          - type: paragraph
            body: >-
              The core underwriting issue is that SHAREBOT may be light on owned hardware but it is not light on
              operations. Multiple independent sources now describe the heavy work after the booking: cross-city
              dispatch, on-site debugging, choreography or custom programming, operators, maintenance, insurance, and
              failure recovery. Xinhua’s quote that the rational human-robot ratio is still about one operator per robot
              is especially important, because it makes current labor burden hard to ignore. Meanwhile, market pricing
              is falling fast. Xinhua and China Daily both describe domestic daily rents resetting sharply from
              early-2025 peaks above RMB 10,000, while Sohu argues that simple information arbitrage is disappearing.
              That combination means SHAREBOT’s moat has to come from service reliability, local partner density, and
              asset utilization rather than from headline rental rates alone. The industrial thesis could still be
              attractive if repeatable, high-frequency demand emerges, but IFR and MIIT materials together suggest that
              large-scale real-world humanoid deployment is still early. Until SHAREBOT discloses utilization, refund,
              maintenance, and renewal data, margin path remains more narrative than model.
