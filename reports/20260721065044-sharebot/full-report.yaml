      - number: '8.2'
        title: Comparable lenses for an early robotics-orchestration platform
        blocks:
          - type: paragraph
            body: >-
              There is no perfect public comparable for SHAREBOT, which is exactly why false precision would be a
              mistake. Serve Robotics is helpful because it is a public autonomy platform with real SEC disclosure, real
              losses, and real liquidity; Richtech is helpful because it explicitly pitches RaaS and recurring contracts
              while still showing how financing structure and control quality can complicate the valuation story;
              Knightscope shows how a service-heavy robotics business can trade when recurring revenue exists but growth
              and profitability remain contested; and Symbotic shows what scaled industrial automation looks like when
              revenue and cash are finally large enough to justify a multi-billion-dollar market cap on operating proof.
              Taken together, those peers do not produce one clean multiple for SHAREBOT. Instead, they create a
              valuation ladder. On one end, public microcap robotics names can trade far below SHAREBOT’s headline even
              with audited statements, recurring revenue, and cash disclosure. On the other end, truly scaled automation
              leaders trade much higher but only after delivering billions of dollars of revenue and far deeper customer
              proof. SHAREBOT currently sits between those poles: strategically more interesting than a generic
              microcap, but still far closer to the proof burden of an early platform than to the maturity profile of an
              industrial automation leader.
