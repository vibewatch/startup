  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-opacity
    missingEvidence: Board roster, committee structure, named compliance owner, and any public certifications or audit reports.
    whyItMatters: These artifacts determine whether Botshare’s legal and operational controls are scaling with its valuation and public-scene exposure.
    diligencePath: Request corporate-governance deck, board materials, and external compliance or safety audit evidence from management.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: related-party-governance
    missingEvidence: Related-party policy, OEM neutrality rules, and disclosed commercial terms between Botshare and Agibot-affiliated entities.
    whyItMatters: Agibot concentration could shape supply access, partner trust, and economics if neutrality is weaker than public messaging implies.
    diligencePath: Request master commercial agreements, SKU mix by supplier, and any board-approved conflict-management framework.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Revenue, gross margin, burn, cash runway, repeat-order rates, and payback by city or scenario.
    whyItMatters: Without these metrics, investors cannot validate whether valuation step-ups are supported by underlying economics.
    diligencePath: Obtain monthly management accounts, cohort retention, and scenario-level contribution margin analysis.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: service-network-metrics
    missingEvidence: SLA attainment, failed-fulfillment rate, incident frequency, MTBF, and staffing ratios across major cities.
    whyItMatters: Service-network quality is the main operational moat claim and the clearest source of downside if it is inconsistent.
    diligencePath: Request operational KPI dashboard, by-city partner scorecards, and incident postmortem samples.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: global-expansion-risk
    missingEvidence: Country-by-country compliance plan, overseas unit economics, and contract model for the reported 13-country expansion.
    whyItMatters: Global claims can magnify legal, safety, and pricing risk if local economics or compliance assumptions are weak.
    diligencePath: Request international expansion memo covering entity structure, insurance, privacy, safety, and local partner economics.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
