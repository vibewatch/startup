- id: service-network-and-operations-risk
  title: Service-network, maintenance, and operational burden
  body: 'The most important near-term risk is execution burden. SHAREBOT’s launch materials and interviews repeatedly describe a business that does far more than match demand and supply: users place orders through the platform, local partners fulfill, engineers tune parameters on site, operators monitor live runs, and the company promises service guarantees across many cities. Shanghai holiday reporting makes the hidden labor visible. Engineers describe a routine of pre-delivery checks, live monitoring, parameter adjustment, and emergency response, especially in dense public venues where robots may face collisions, unexpected commands, crowding, and long operating hours. Securities Daily’s June 2026 insurance feature widens the point from SHAREBOT to the category: transport, cross-scene deployment, third-party injury, system faults, and expensive repairs are core rental risks, not edge cases. Sohu’s adverse take is therefore important—the moat may belong to whoever can coordinate logistics,
    maintenance, insurance, and recovery at scale, not whoever lists the most robots. That makes SHAREBOT’s service network both the company’s best asset and its largest operating liability.'
