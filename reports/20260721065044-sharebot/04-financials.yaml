- id: disclosure-risks-and-financial-verdict
  title: Disclosure gaps, governance risks, and financial verdict
  body: 'The public record is still missing the variables that matter most for investment underwriting. There is no disclosed revenue, ARR, gross margin, burn, runway, CAC, payback, or net retention figure in the reviewed source set, and there is no direct public filing in this chapter that cleanly verifies current ownership from a primary registry page because automated access to Qichacha was blocked. SHAREBOT’s own privacy policies add a second layer of financial risk: the platform collects order, scenario, budget, transaction, and partner-application data, and says some registration or transaction data may be synchronized to affiliates or business partners. Those disclosures support the idea that SHAREBOT is building a real operating platform, but they also raise governance, compliance, and cross-party data-handling costs as the business scales across more cities and countries. The adverse case from Tencent and Sohu is therefore coherent: valuation has outrun disclosed economics, and high service intensity could force further dilution if price compression arrives faster than utilization gains. Financial verdict: SHAREBOT may become a meaningful robot-services infrastructure layer, but today it remains a service-heavy, privately disclosed business whose revenue quality, margin path, and capital efficiency cannot yet be fully underwritten from public evidence alone.'
