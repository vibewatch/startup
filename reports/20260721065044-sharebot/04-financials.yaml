- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric or proof
  - Impact on verdict
  - Why public sources are insufficient
  - Exact diligence path
  - Priority
  rows:
  - - Recognized revenue and take rate
    - Blocks revenue-quality underwriting
    - Orders and robot counts do not translate into booked revenue without fee share and cancellation data
    - Request monthly revenue bridge from GMV/order value to recognized revenue by stream
    - Critical
  - - Gross margin by scenario
    - Blocks margin-path underwriting
    - Service-heavy delivery, operators, repairs, and insurance can dominate economics
    - Request contribution margin by event, retail, industrial, and overseas scenario
    - Critical
  - - Cash balance, burn, and runway
    - Blocks solvency view
    - Recent funding is visible, but liquidity and burn are not
    - Request treasury snapshot and monthly cash-flow statement
    - Critical
  - - A/A+ investor list and terms
    - Weakens valuation interpretation
    - Public sources name amount and valuation but not the full buyer list or protections
    - Request legal close memo, term-sheet summary, and board-rights schedule
    - High
  - - Direct registry verification
    - Leaves control and related-party questions partially open
    - Qichacha blocked automated access and no primary registry extract is in this chapter
    - Pull GSXT or manual registry extract and compare with secondary summaries
    - Medium
  - - Industrial utilization and renewals
    - Limits long-term thesis confidence
    - Public evidence says industrial expansion is the goal, not that it already earns attractive returns
    - Request customer cohort data with uptime, operator hours, renewals, and refunds
    - High
  notes: These are the missing items that matter most for underwriting. The chapter can describe the shape of the model without them, but it cannot close the financial diligence loop.
