  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Monthly revenue, take rate, realized pricing by scenario, and any recurring contract revenue by customer type.
    whyItMatters: Without booked revenue and take rate data, order counts and robot counts cannot be translated into revenue quality or growth durability.
    diligencePath: Request management P&L bridge, scenario-level GMV-to-revenue conversion, and top-20 contract summaries.
    relatedQuestionRefs:
    - QI004
    - QI008
    - QI023
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-and-runway
    missingEvidence: Cash balance, monthly burn, runway, gross margin by scenario, and working-capital timing by partner or customer type.
    whyItMatters: Capital adequacy cannot be underwritten without knowing whether the service network is consuming cash faster than recent rounds can replenish it.
    diligencePath: Obtain board pack or finance memo with cash, burn, runway, margin waterfall, and receivables/payables aging.
    relatedQuestionRefs:
    - QI015
    - QI023
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: a-round-investor-breakout
    missingEvidence: A/A+ investor list, round split between A and A+, instrument terms, and any liquidation or ratchet protections.
    whyItMatters: Investor names and terms determine whether the latest valuation was broadly market-clearing or supported mainly by insiders and strategics.
    diligencePath: Request cap-table update, signed term-sheet summary, and legal closing memo for the May 2026 rounds.
    relatedQuestionRefs:
    - QI012
    - QI013
    relatedTableRefs:
    - TI004
  - type: access-blocked
    severity: minor
    topic: registry-verification
    missingEvidence: Direct current registry record confirming shareholder percentages, registered capital, and any pledges or legal changes.
    whyItMatters: This chapter can describe funding history without the registry, but direct entity verification is still needed to check control and related-party exposure.
    diligencePath: Pull the company record manually from Qichacha, GSXT, or another accessible registry mirror and reconcile it against Baidu Baike.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: industrial-unit-economics
    missingEvidence: Scenario-level uptime, operator hours, maintenance cost, refund rates, and renewal rates for industrial, warehouse, and park deployments.
    whyItMatters: The bullish thesis depends on moving from novelty rentals to high-frequency operational work, but the current public record does not show whether those deployments earn attractive contribution margins.
    diligencePath: Request cohort data for industrial pilots with revenue, service cost, operator ratio, and renewal outcome by customer.
    relatedQuestionRefs:
    - QI018
    - QI025
    - QI026
    relatedTableRefs:
    - TI003
