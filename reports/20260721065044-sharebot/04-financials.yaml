- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / signal
  - Public price or unit
  - List vs. realized pricing
  - Included capabilities
  - Unknowns
  - Implication
  rows:
  - - Basic robot-dog entry rentals
    - RMB 200-499 per day
    - Mostly list-style or promotional
    - Hardware access and basic delivery window
    - Utilization, subsidy cost, and partner payout unknown
    - Low entry price expands demand but likely leaves little margin without scale
  - - Mainstream domestic humanoid rental
    - RMB 1,499-5,000 per day
    - Observed market pricing, not disclosed average realized price
    - Robot, operator or safety support, on-site handling in many cases
    - Discounting, travel charges, and downtime unknown
    - Shows prices are falling into lower-thousands, pressuring arbitrage economics
  - - Premium custom packages
    - Up to roughly RMB 100,000 per day
    - Package card / scenario quote
    - Technicians, custom programming, performance design, multi-robot coordination
    - Actual gross margin and repeatability unknown
    - High-priced bundles can offset low-end price compression if service quality holds
  - - Tencent launch packages
    - RMB 13,300 or RMB 16,900 per day starting price
    - Public package offer
    - Pre-defined rental bundles plus optional customization
    - Conversion rate and upsell mix unknown
    - Supports bundled-solution revenue rather than only per-robot billing
  - - Europe Lingxi X2 rentals
    - EUR 2,000-3,000 per day
    - Public anecdotal pricing from management
    - Local service partner delivery and support
    - Local compliance, labor, and partner share unknown
    - International pricing could lift ASPs but adds execution cost
  - - North America Expedition rentals
    - Up to USD 6,000 per day
    - Public anecdotal pricing from management
    - Localized deployment with partner support
    - Sustainability of price ceiling untested
    - Potential upside exists, but it should not be modeled as base case without volume data
  notes: Rows reflect public list, package, or interview-level pricing signals. None of them provides SHAREBOT’s realized average price, contribution margin, or customer-level retention economics.
