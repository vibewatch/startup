  - CI018
  - CI019
  - CI024
- calloutType: risk
  title: Valuation ran ahead of disclosed economics
  body: Public funding and valuation headlines are abundant, but revenue, margin, burn, and runway are not. That asymmetry makes the current financial case much more dependent on belief in future service density and industrial conversion than on evidence of present earnings quality.
  claimRefs:
  - CI001
  - CI002
  - CI026
  - CI036
  - CI037
- calloutType: assumption
  title: Industrial expansion is a margin thesis, not a proven fact
  body: The bullish case assumes warehousing, park, and industrial scenarios produce higher-frequency, more durable revenue than event work. The current source base shows intent and policy support, but not disclosed customer-level contribution margins or renewals.
