chapter:
  number: 4
  title: Financials
  summary: SHAREBOT’s public financial story is strong on funding velocity, pricing anecdotes, and network scale, but weak on disclosed revenue, margin, and cash data. The company appears intentionally light on owned hardware and heavy on service execution, so the core diligence issue is whether management fees and scenario solutions can outgrow dispatch, labor, maintenance, and financing needs before valuation outruns economics.
sections:
- id: revenue-model-pricing
  title: Revenue model, monetization architecture, and pricing evidence
  body: 'Public evidence supports a specific shape of business model but not a clean income statement. SHAREBOT does not market itself as a robot OEM that books hardware sales; it presents as a RaaS-style application platform connecting robot suppliers, local service partners, creators, and end customers. The most concrete monetization signal comes from April Tencent reporting, where CEO Li Yiyan described an early-stage fully light-asset structure: strategic partners own or purchase the robots, SHAREBOT operates the assets, and the platform earns operating-management and service fees. That matters because it lowers direct fleet capex but shifts economic dependence toward take rate, utilization, and service execution. Pricing is also more heterogeneous than a simple per-robot card. Launch, Xinhua, and Tencent coverage point to basic dogs or long-duration entry plans at a few hundred renminbi per day, mainstream domestic rentals around low-thousands per day, and premium bundles or custom packages rising into five figures or even nearly RMB 100,000. The result is a business whose topline probably blends platform fees, packaged-solution charges, and scenario customization, but whose realized pricing remains undisclosed.'
