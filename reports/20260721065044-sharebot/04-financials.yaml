callouts:
- calloutType: insight
  title: Asset-light does not mean cost-light
  body: SHAREBOT’s strongest public narrative is that partners own the robots while the platform earns management and service fees. That lowers direct fleet capex, but current evidence says the heavy costs move into people, dispatch, insurance, maintenance, and partner-quality control rather than disappearing.
  claimRefs:
