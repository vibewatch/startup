tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Platform operating-management fees
    - Partners hold robot assets while SHAREBOT operates dispatch and fulfillment
    - Per order / managed asset / service package
    - Explicitly described in Tencent April coverage; exact take rate not public
    - Medium
    - Request fee schedule by partner type and scenario
  - - Service fees / delivery fees
    - On-site deployment, technical support, programming, and orchestration around each rental
    - Per job / service bundle
    - Supportable from light-asset interviews and service-heavy coverage; actual split undisclosed
    - Medium
    - Break out service revenue versus pure platform revenue
  - - Bundled scenario solutions
    - Packaged pricing for annual meetings, retail activations, education, tourism, and custom shows
    - Per package / day / campaign
    - Public packages start at RMB 13,300 or RMB 16,900 per day in Tencent launch coverage
    - Medium
    - Request realized ASP by package and attach rate of custom work
  - - Industrial and logistics scenario expansion
    - RaaS deployment into warehouse, park, and production workflows
    - Per deployment / contract
    - Management says new capital targets these scenarios, but no revenue disclosed yet
    - Low to medium
    - Provide signed industrial contracts, pilot-to-renewal conversion, and margin by scenario
  - - Overseas rentals
    - Localized rentals through regional partners in 13 countries
    - Per day / solution package
    - Public high-price anecdotes exist, but booked overseas revenue is not disclosed
    - Low to medium
    - Provide overseas bookings, local partner economics, and country-level margin
  - - Hardware sales
    - Direct robot sales recognized by SHAREBOT itself
    - Unit sale
    - No reviewed public source supports SHAREBOT as a primary hardware seller
    - Low
    - Confirm whether the company books any direct robot resale revenue
  notes: Public evidence supports fee-based, bundled, and scenario-solution monetization, but no source discloses SHAREBOT’s realized take rate or stream-by-stream revenue split.
