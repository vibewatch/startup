    - Fresh capital reduces short-term financing stress
    - Provide exact gross proceeds, net cash in, and close dates by tranche
  - - Funding chronology pace
    - Seed in Jan, angel/angel+ in Mar, Pre-A in Apr, A/A+ in May
    - Medium
    - Shows very fast capital formation and potentially fast spending needs
    - Provide cap-table evolution and dilution by round
