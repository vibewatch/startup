evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A board list, voting-rights summary, shareholder agreements, and any related-party governance controls between
      Botshare and the Zhiyuan ecosystem.
    whyItMatters: >-
      The company is embedded in a sponsor ecosystem, but public materials do not show who controls board decisions,
      related-party approvals, or future capital raises.
    diligencePath: >-
      Request the cap table, board roster, shareholder agreement, and related-party transaction schedule from
      management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Revenue, gross margin, contribution margin by deployment, utilization by robot class, and any monthly recurring
      revenue or take-rate data.
    whyItMatters: >-
      Marketplace order counts do not reveal whether Botshare’s service-heavy model earns positive unit economics or
      merely subsidizes activity.
    diligencePath: >-
      Obtain monthly management accounts, city-level unit economics, and cohort utilization data by robot type and
      scenario.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: debt-and-credit
    missingEvidence: >-
      Any debt facilities, credit lines, lease-financing arrangements, or inventory-backed borrowing tied to fleet
      procurement or partner support.
    whyItMatters: >-
      Hardware-adjacent service platforms can accumulate off-balance-sheet or partner-financing obligations long before
      revenue visibility catches up.
    diligencePath: Request debt schedules, guarantee schedules, and any warehouse, partner, or equipment financing documents.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A primary-source registration extract or official about page naming the exact registered office and principal
      operating office.
    whyItMatters: >-
      Public coverage is consistent on Pudong/Shanghai, but the exact legal address and operating footprint are not yet
      anchored in a primary registry pull.
    diligencePath: Pull the SAIC/company registry entry or management-provided registration certificate.
    relatedQuestionRefs:
      - QO002
  - type: conflicting-data
    severity: minor
    topic: valuation-usd-translation
    missingEvidence: A company-sanctioned USD translation or FX convention for the RMB 7 billion May 2026 valuation headline.
    whyItMatters: >-
      Chinese coverage states RMB 7 billion while Crunchbase News rounds the company to $1 billion, creating a small but
      important normalization gap for later valuation analysis.
    diligencePath: >-
      Normalize with a dated FX rate in the valuation chapter and request investor deck language on official USD
      translation.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: sam-som-modeling
    missingEvidence: >-
      A clean China-specific serviceable available market and serviceable obtainable market model for robot leasing by
      segment, city tier, and workflow.
    whyItMatters: >-
      Public sources size the niche at a headline level, but they do not reveal how much of that spend is realistically
      addressable by one platform versus local integrators or direct OEM channels.
    diligencePath: >-
      Build a bottom-up model using city counts, segment budgets, rental frequency, and robot-class utilization by
      scenario.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer-payback
    missingEvidence: >-
      Customer-level payback data, utilization targets, and willingness-to-pay by SME, retail, logistics, and industrial
      segment.
    whyItMatters: >-
      Without segment-level ROI, it is impossible to know whether falling prices accelerate adoption faster than they
      destroy contribution margins.
    diligencePath: >-
      Interview customers, obtain proposal templates, and model payback against outright purchase and labor
      substitution.
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: minor
    topic: analyst-forecast-dispersion
    missingEvidence: Consistent methodology across analyst market forecasts for global and APAC robotics markets.
    whyItMatters: >-
      Analyst pages use different definitions and forecast horizons, so they are best treated as bounding lenses rather
      than a single canonical TAM.
    diligencePath: Normalize analyst definitions before using them in valuation work.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: TM003 buyer map
    missingEvidence: >-
      Observed procurement examples with named budget owners for each segment, especially logistics and industrial
      users.
    whyItMatters: The buyer/user/payer split is economically important but not well documented in public sources.
    diligencePath: Collect case studies, proposals, or interviews showing who signed and paid for deployments by segment.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: TM001 market boundary
    missingEvidence: >-
      A primary-source definition from a government or industry association specifically classifying robot leasing as a
      distinct market segment.
    whyItMatters: Current boundary logic is evidence-based but still inferred from deployment and pricing coverage.
    diligencePath: Look for association taxonomies, procurement frameworks, or investment decks defining the robot-rental segment.
    relatedQuestionRefs:
      - QM001
    relatedTableRefs:
      - TM001
  - type: enumeration-incomplete
    severity: minor
    topic: local-operator-roster
    missingEvidence: >-
      A province-by-province or city-by-city roster of Chinese robot-rental operators, JD storefronts, and OEM-linked
      channels is still missing from public reporting.
    whyItMatters: >-
      The direct domestic landscape is fragmented, so missing the long tail can distort how concentrated or contestable
      Botshare’s supply layer really is.
    diligencePath: >-
      Run a city-by-city search and platform audit across JD, WeChat mini-programs, and major local operator websites to
      build a canonical supply map.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: platform-economics
    missingEvidence: >-
      Comparable take rates, utilization, service attachment, and gross margin data for Botshare, Wanjiyi, and JD-linked
      channels are not public.
    whyItMatters: >-
      Without normalized economics, it is impossible to know whether price compression still leaves enough contribution
      margin for a platform operator.
    diligencePath: >-
      Request monthly cohort data by scenario, including average order value, take rate, service attach, utilization,
      and damage-loss rates across major channels.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: incumbent-sla-comparison
    missingEvidence: >-
      Sample factory SLAs, maintenance response times, and service pricing from ABB, KUKA, FANUC, and comparable
      integrators are not visible in public sources.
    whyItMatters: >-
      Botshare’s industrial expansion case depends on whether flexible access can beat the incumbent support standard,
      not just whether robots can be booked quickly.
    diligencePath: >-
      Collect sample RFQs or customer service contracts from factory buyers and compare incumbent response times,
      spare-part terms, and training commitments with Botshare’s offer.
    relatedQuestionRefs:
      - QP019
      - QP023
    relatedTableRefs:
