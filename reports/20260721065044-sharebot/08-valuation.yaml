- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold to watch
  - Why it matters
  - Action implication
  rows:
  - - No industrial repeatability
    - Next refresh still shows no named renewals, no pilot-to-production conversions, and no uptime proof.
    - The bull case depends on recurring operational workflows, not only event demand.
    - Treat current valuation as over-earning its evidence base.
  - - Service burden overwhelms pricing
    - Pricing keeps compressing while operator, repair, and logistics cost disclosure remains absent or negative.
    - The business could stay busy but economically thin.
    - Move stance toward avoid unless price resets sharply.
  - - Financing keeps outrunning disclosure
    - Another valuation step-up arrives without audited KPI release or clearer round terms.
    - Narrative compounding without proof raises down-round risk later.
    - Assume preference risk is rising even if the headline mark goes up.
  - - Partner neutrality weakens
    - A small set of OEMs or related ecosystem actors dominates supply and economics.
    - Concentration can cap marketplace credibility and bargaining power.
    - Discount platform optionality and strategic-exit upside.
  - - Incident profile worsens
    - Claims, failures, or compliance friction rise faster than service controls mature.
    - Operational reliability is central to repeat enterprise adoption.
    - Reassess whether SHAREBOT is a scalable platform or a brittle services coordinator.
  notes: These triggers are designed as decision rules for the next diligence cycle, not as claims that any single failure automatically kills the company.
  claimRefs:
  - CV039
  - CV043
  - CV045
  - CV046
  - CV047
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited 2025 revenue plus 2026 monthly bridge from orders to recognized revenue.
    - Without it, the valuation cannot be anchored to scale or growth.
    - CFO data room and auditor package.
  - - Take rate and margin
    - Scenario-level take rate, gross margin, operator cost, logistics cost, and repair cost.
    - This decides whether SHAREBOT is a platform or a labor-heavy services business.
    - Finance team plus operating KPI workbook.
  - - Industrial renewals
    - Named industrial pilots, contract length, renewal rate, and customer ROI references.
    - The bull case depends on recurrence in operational scenarios.
    - Customer calls and contract sample review.
  - - Retention and concentration
    - Cohort retention, repeat-booking rate, top-customer exposure, and cancellation/refund data.
    - Demand activity is not the same as durable revenue quality.
    - CRM export and cohort deck.
  - - Fleet economics
    - Owned versus managed fleet mix, utilization by scenario, and working-capital cadence.
    - Investors need to know where capital intensity really sits.
    - Ops + finance reconciliation.
  - - Round terms
    - Preference stack, anti-dilution, investor rights, and ownership concentration.
    - Headline valuation may overstate common-equity economics if terms are investor-friendly.
    - Legal diligence on cap table and signed term sheet.
  notes: These are the few questions most likely to change the recommendation quickly if management can answer them with primary evidence.
