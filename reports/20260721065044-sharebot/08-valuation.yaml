tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why it is the right posture now
  - What would improve the view
  rows:
  - - Recommendation
    - research-more
    - Strategic momentum is real, but public financial disclosure is too thin for a clean buy call at the current headline.
    - Audited revenue, margin, retention, and round-term detail.
  - - Confidence
    - medium
    - There is enough evidence to frame the market and the proof gap, but not enough to collapse scenario width.
    - Named industrial renewals plus KPI disclosure.
  - - Risk rating
    - high
    - Service intensity, financing dependency, and commercialization timing remain unresolved.
    - Better unit economics and lower execution volatility by scenario.
  - - Valuation stance
    - stretched
    - A ~$1B mark leans into upside before public operating proof catches up.
    - Either more disclosure or a lower effective entry price.
  - - Decision implication
    - Track closely, do not chase headline price.
    - The company could still become important, but investors need a more favorable information-to-price ratio.
    - A diligence package that converts narrative optionality into measurable operating proof.
  notes: This table intentionally summarizes posture rather than pretending the public source set can support a tighter valuation point estimate.
