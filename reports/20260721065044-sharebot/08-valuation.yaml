  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Liquidation preferences, investor rights, anti-dilution terms, ownership concentration, and exact pre/post-money structure for the May 2026 A/A+ financing.
    whyItMatters: Without term-sheet detail, investors cannot judge whether the headline valuation overstates common-equity value or hides preference overhang.
    diligencePath: Request the signed term sheet, cap table, and any side letters from company counsel before underwriting entry price.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue, GMV-to-revenue conversion, gross margin, burn, runway, and working-capital data for 2025 and YTD 2026.
    whyItMatters: The valuation debate cannot be anchored to operating performance without basic financial statements or KPI disclosure.
    diligencePath: Request audited 2025 financial statements plus monthly 2026 management accounts and KPI bridge to reported order activity.
    relatedQuestionRefs:
    - QV012
    - QV013
    - QV023
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: material
    topic: industrial-renewal
    missingEvidence: Named industrial customers, pilot-to-production conversion, contract length, renewal rates, and site-level uptime outcomes.
    whyItMatters: The bull case depends on Botshare graduating from event demand to repeat operational workflows, not just adding more showcase deployments.
    diligencePath: Review customer cohort data and interview at least three industrial customers or pilots about ROI, uptime, and renewal intent.
    relatedQuestionRefs:
    - QV011
    - QV024
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: service-unit-economics
    missingEvidence: Take rate, operator-hours per booking, logistics cost, repair cost, insurance cost, refund rate, and owned-versus-managed fleet split.
    whyItMatters: The central question is whether Botshare becomes a software-like orchestration layer or remains a labor-heavy service operator with thin contribution margins.
    diligencePath: Obtain scenario-level unit-economics cohorts and reconcile contribution margin by domestic events, retail, overseas, and industrial use cases.
    relatedQuestionRefs:
    - QV008
    - QV023
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: minor
    topic: exit-readiness
    missingEvidence: Board-level governance artifacts, KPI package for future fundraising, and evidence of public-company-quality controls that would support an eventual IPO or strategic sale process.
    whyItMatters: Even if the business scales, weak governance or immature reporting can delay exit timing and compress realized value.
    diligencePath: Request board deck templates, audit readiness materials, and finance/control hiring plan for the next 12 months.
    relatedQuestionRefs:
    - QV030
