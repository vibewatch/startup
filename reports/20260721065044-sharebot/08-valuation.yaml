- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public value / metric
  - Operating disclosure signal
  - Why it helps
  - Why it does not fit perfectly
  rows:
  - - Serve Robotics
    - $0.61B market cap; $2.7M 2025 revenue; $233.4M liquidity
    - Public SEC-reported delivery-robotics platform with large losses and significant cash.
    - Useful lens for a disclosed autonomy platform still trading heavily on option value.
    - Different delivery model and cash-rich balance sheet distort simple multiple reads.
  - - Richtech Robotics
    - $0.47B market cap; $5.0M FY2025 revenue; 55 RaaS contracts; $193.6M cash
    - Model-adjacent RaaS story with public filings and explicit recurring-revenue positioning.
    - Shows how early public RaaS names can still depend on financing structure and control quality.
    - ATM-funded balance sheet and control weakness make it an imperfect clean peer.
  - - Knightscope
    - $35M market cap; $11.3M 2025 revenue; 70% service-revenue mix
    - Service-heavy robotics operator with real recurring service footprint and public results.
    - Useful floor for what public markets can pay when service-model economics remain contested.
    - Security robotics is not humanoid rental or deployment orchestration.
  - - Symbotic
    - $25.18B market cap; $2.247B FY2025 revenue; $1.245B cash
    - Scaled industrial-automation and warehouse platform with deep customer proof.
    - Useful upper-bound maturity lens showing what large valuation support looks like when revenue and cash are huge.
    - Far more mature, vertically different, and not an early marketplace or deployment layer.
  - - SHAREBOT headline
    - $1B-equivalent May 2026 private mark; public revenue undisclosed
    - Headline supported by financing news, market enthusiasm, and scenario breadth rather than public financial statements.
    - Useful anchor for assessing whether current price sits closer to option value or scaled execution.
    - Not directly pressure-tested by disclosed revenue, margin, or round-term detail.
  enumerationScope:
    coverage: partial
    basis: 'Rows are a model-appropriate comparison set for June 2026 valuation framing: two smaller disclosed robotics platforms, one service-heavy public operator, one scaled industrial automation leader, and SHAREBOT’s own headline mark.'
  notes: Comparable rows mix market-cap, revenue, and disclosure-style lenses intentionally. The goal is scenario framing, not a false claim that all five rows deserve the same multiple methodology.
