callouts:
- calloutType: insight
  title: The real debate is not whether SHAREBOT matters, but whether today’s price is already paying for tomorrow’s proof.
  body: SHAREBOT has enough market traction and strategic positioning to stay on an investor watchlist. The missing link is not attention; it is audited operating evidence that connects the unicorn headline to repeatable economics.
  claimRefs:
  - CV001
  - CV006
  - CV013
  - CV041
- calloutType: risk
  title: Private-market enthusiasm is running ahead of public disclosure.
  body: Public peers show that robotics valuations can range from distressed service multiples to very rich option-value multiples, but they also show that markets eventually force a choice. SHAREBOT has not yet provided the public metrics needed to justify where it belongs on that spectrum.
  claimRefs:
  - CV032
  - CV033
  - CV040
  - CV044
- calloutType: recommendation
  title: A better information-to-price ratio matters more than another narrative upgrade.
  body: The next diligence win is not another article about category growth. It is primary evidence on revenue, retention, industrial renewals, and round terms. Without that, a disciplined investor should prefer patience over momentum chasing.
  claimRefs:
  - CV045
  - CV046
  - CV047
