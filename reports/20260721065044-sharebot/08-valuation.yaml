- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Indicative valuation range
  - Probability signal
  - What it means for investors
  rows:
  - - Bear
    - Demand remains event-led, pricing compresses, service labor stays high, and new rounds require better proof than the company can publicly show.
    - $0.30B-$0.60B
    - Meaningful if industrial renewals and unit economics stay opaque through the next refresh.
    - Today’s headline would look early and vulnerable to a flat or down round.
  - - Base
    - SHAREBOT becomes a real national deployment platform, but industrial recurrence and margin structure take longer to prove than the financing narrative implies.
    - $0.60B-$0.95B
    - Most consistent with the current public source set.
    - Headline valuation looks full; a better entry would come from either time or more disclosure.
  - - Bull
    - Industrial, logistics, and enterprise workflows start renewing, partner density improves utilization, and disclosed KPIs support a durable orchestration model.
    - $1.10B-$1.60B
    - Requires several proof points that are still private today.
    - Current headline can work, but only if the company quickly validates recurring economics.
  - - Current headline
    - May 2026 fundraising mark treated as roughly $1B-equivalent in outside coverage.
    - $0.95B-$1.05B
    - Already visible in the market.
    - Investors buying here are underwriting a large share of the upside before disclosure catches up.
  notes: Ranges are intentionally broad and scenario-based. They reflect public-evidence framing, not a discounted-cash-flow model built on missing private metrics.
