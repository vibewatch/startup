  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A board list, voting-rights summary, shareholder agreements, and any related-party governance controls between Botshare and the Zhiyuan ecosystem.
    whyItMatters: The company is embedded in a sponsor ecosystem, but public materials do not show who controls board decisions, related-party approvals, or future capital raises.
    diligencePath: Request the cap table, board roster, shareholder agreement, and related-party transaction schedule from management.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue, gross margin, contribution margin by deployment, utilization by robot class, and any monthly recurring revenue or take-rate data.
    whyItMatters: Marketplace order counts do not reveal whether Botshare’s service-heavy model earns positive unit economics or merely subsidizes activity.
    diligencePath: Obtain monthly management accounts, city-level unit economics, and cohort utilization data by robot type and scenario.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: material
    topic: debt-and-credit
    missingEvidence: Any debt facilities, credit lines, lease-financing arrangements, or inventory-backed borrowing tied to fleet procurement or partner support.
    whyItMatters: Hardware-adjacent service platforms can accumulate off-balance-sheet or partner-financing obligations long before revenue visibility catches up.
    diligencePath: Request debt schedules, guarantee schedules, and any warehouse, partner, or equipment financing documents.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: A primary-source registration extract or official about page naming the exact registered office and principal operating office.
    whyItMatters: Public coverage is consistent on Pudong/Shanghai, but the exact legal address and operating footprint are not yet anchored in a primary registry pull.
    diligencePath: Pull the SAIC/company registry entry or management-provided registration certificate.
    relatedQuestionRefs:
    - QO002
  - type: conflicting-data
    severity: minor
    topic: valuation-usd-translation
    missingEvidence: A company-sanctioned USD translation or FX convention for the RMB 7 billion May 2026 valuation headline.
    whyItMatters: Chinese coverage states RMB 7 billion while Crunchbase News rounds the company to $1 billion, creating a small but important normalization gap for later valuation analysis.
    diligencePath: Normalize with a dated FX rate in the valuation chapter and request investor deck language on official USD translation.
    relatedQuestionRefs:
    - QO012
