- id: milestones-footprint-risks
  title: Milestones, operating footprint, and immediate execution risks
  body: 'The milestone pattern since December 2025 is clear: launch the platform in Shanghai, use early financing to build a national service network, add ecosystem services such as insurance, and then broaden the platform with strategic partners such as JD.com and Rui’an Office. Public sources also show that management is trying to move the narrative away from “robots at events” toward broader operational workflows. However, the same evidence already surfaces the main execution risks. Sohu’s June 2026 analysis argues that falling rental prices compress the arbitrage opportunity for pure marketplace operators and make logistics, maintenance, insurance, and recovery the real moat. Xinhua adds that current demand is still heavily entertainment-led, that repeat customers remain scarce, and that current deployments often still need one operator per robot. In other words, SHAREBOT reached visibility and headline valuation quickly, but the company still has to prove that its service network can
    support industrial-grade utilization and sustainable unit economics instead of novelty-led growth.'
