callouts:
- calloutType: strength
  title: SHAREBOT attacks the adoption barrier that hardware makers struggle to solve alone
  body: The platform lowers the initial capex barrier by turning robots into bookable services and by bundling operators, insurance, and local fulfillment. That makes SHAREBOT strategically useful to upstream robot manufacturers that want distribution, scenario data, and faster commercialization without building their own nationwide service network from scratch.
  claimRefs:
  - CO007
  - CO030
  - CO031
  - CO045
- calloutType: risk
  title: The unicorn headline is far ahead of disclosed fundamentals
  body: SHAREBOT has public order, city, and robot-count metrics, but no disclosed revenue, gross margin, utilization, burn, or repayment profile for the service network it is building. The company may deserve strategic enthusiasm as a commercialization layer, yet the May 2026 RMB 7 billion / $1 billion narrative rests on private financing momentum rather than transparent operating economics.
  claimRefs:
  - CO021
  - CO023
  - CO039
  - CO046
  - CO048
- calloutType: risk
  title: Operations—not catalog breadth—will determine whether SHAREBOT earns durable advantage
  body: Multiple 2026 sources argue that falling rental prices reduce the value of simple marketplace intermediation and shift competition toward maintenance, logistics, insurance, and rapid on-site recovery. SHAREBOT’s own expansion into JD-linked maintenance and PICC-backed insurance suggests management recognizes that service infrastructure, not traffic alone, will make or break the model.
  claimRefs:
  - CO034
  - CO037
  - CO046
  - CO047
