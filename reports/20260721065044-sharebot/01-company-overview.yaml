company:
  name: SHAREBOT
chapter:
  number: 1
  title: Company Overview
  summary: SHAREBOT (擎天租/ BOTSHARE) is a Pudong, Shanghai-based robot leasing platform launched in December 2025 out of the Zhiyuan Robotics ecosystem. Public reporting indicates a six-round funding sprint culminating in May 2026 A and A+ rounds at a reported RMB 7 billion valuation, while the operating model remains very early, service-heavy, and still concentrated in event-led deployments that management wants to push into industrial and logistics use cases.
sections:
- id: identity-business-model
  title: Identity and business model
  body: SHAREBOT markets itself in English as BOTSHARE and in Chinese as 擎天租, operating as a robot leasing and rental platform rather than a single-robot OEM. Official site copy and launch coverage consistently frame the service as a Robotics-as-a-Service marketplace that connects demand-side customers with supply-side robot makers, service partners, and operators. The near-term product is not a software subscription in isolation; it is a coordinated fulfillment layer that bundles robot selection, booking, on-site deployment, trained operators, and increasingly insurance and maintenance. Launch materials show the company starting from high-visibility scenarios such as retail activations, exhibitions, weddings, receptions, and education, while management says the strategic goal is to migrate into industrial manufacturing, park operations, warehousing, logistics, and other more repeatable workflows. That combination makes SHAREBOT simultaneously asset-light in ownership claims, but operationally
    heavy in dispatch, local service quality, and uptime execution.
