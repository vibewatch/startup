companyProfile:
  summary: >-
    Multiverse is a private enterprise workforce training company that combines apprenticeship delivery, applied AI
    upskilling, and proprietary coaching software for large employers. Founded in London in 2016 by Euan Blair and
    Sophie Adelman, it grew from UK apprenticeship programs into a broader enterprise AI adoption platform after the
    2026 StackFuel acquisition, with customers spanning major corporations and public institutions.
