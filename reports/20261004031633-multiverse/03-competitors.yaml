callouts:
  - calloutType: "insight"
    title: "Direct Provider vs. Platform-Enabled Networks"
    body: "The central strategic divide in enterprise AI apprenticeship delivery is between vertically integrated direct providers like Multiverse and decentralized independent providers powered by operational platforms like TIQ-plus. While Multiverse offers standardized corporate brand recognition and end-to-end management, platform-enabled networks provide flexibility in cohort sizes and specialized industry contextualization."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP004"
  - calloutType: "risk"
    title: "Levy Price Band Saturation and Procurement Scrutiny"
    body: "Statutory funding bands (such as £18,000 for ST1512) cap government and levy co-funding, meaning any enterprise premium charged by premium providers must be justified by demonstrable business ROI. As enterprise buyers evaluate commercial terms against independent options, Multiverse faces ongoing pressure to prove superior completion and productivity outcomes."
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP013"
