      - number: '4.2'
        title: Cost Structure, Unit Economics, and Operational Efficiency
        blocks:
          - type: paragraph
            body: >-
              The core operational cost structure for Multiverse combines expert human coaching, curriculum development,
              learner assessment overhead, platform engineering for the Atlas coaching interface, and compliance
              administration associated with regulated training standards. Unlike automated software platforms that
              enjoy software gross margins exceeding 75%, high-touch apprenticeship delivery requires dedicated
              coach-to-learner ratios, ongoing mentoring checkpoints, and tripartite employer progress reviews across 13
              to 16-month programme durations. Adverse reporting highlights that prior expansion cycles in the United
              States and broad vocational subjects coincided with widening operating losses, workforce layoffs, and
              challenges meeting statutory training completion targets before management consolidated delivery into
              approximately 14 focused digital and AI programmes. Cohort-level customer acquisition costs, coach labor
              utilization rates, and gross profit margins remain confidential private data points that require detailed
              diligence verification.
            claimRefs:
