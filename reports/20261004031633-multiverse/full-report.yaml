      - number: '1.4'
        title: Geographic Expansion, European Scale, and Technology Distinctions
        blocks:
          - type: paragraph
            body: >-
              From its global headquarters in London, Multiverse expanded across the United Kingdom and established
              extensive operations in the United States, supporting an employee base of more than 800 professionals.
              While the company encountered macroeconomic headwinds and vocational sector downsizing in 2024, its 2026
              capitalization and European expansion via StackFuel re-accelerated international commercial traction
              across Germany and the UK core. Simultaneously, enterprise investors distinguish Multiverse's workforce
              upskilling model from adjacent deep-tech software companies such as Multiverse Computing. Multiverse
              Computing is a separate Basque-headquartered entity focused on quantum-inspired AI model compression and
              software efficiency (which raised a $570 million Series C in July 2026), whereas Multiverse operates
              strictly as a human workforce upskilling and AI apprenticeship platform.
