              - CR003
              - CR004
              - CR005
              - CR009
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Vulnerability to Vocational Apprenticeship Policy Transitions
            body: >-
              Because Multiverse's historical commercial expansion was incubated through the UK Apprenticeship Levy
              system, any legislative restructuring of levy expenditure caps, eligible course accreditations, or
              employer co-investment mandates creates an immediate risk to unit economics and sales conversion velocity.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
          - type: callout
            title: Acquisition Integration Hurdles in Cross-Border Expansion
            body: >-
              The January 2026 acquisition of Berlin-based StackFuel marks Multiverse's transition into continental
              Europe, where vocational education operates under rigid tripartite governance involving federal agencies,
              trade unions, and chambers of commerce that differ markedly from Anglo-American workforce models.
            calloutType: insight
            claimRefs:
              - CR007
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Stance
        blocks:
          - type: paragraph
            body: >-
              Multiverse presents an investment case centered on the thesis that enterprise artificial intelligence
              adoption requires human workforce upskilling rather than pure software substitution. The company operates
              a platform delivering apprenticeship-style technical training across enterprise clients, reporting over
              1,500 partner organizations and approximately 22,000 enrolled learners. While corporate AI budgets have
              expanded rapidly, executive surveys indicate that internal skills shortages represent a primary bottleneck
              to realizing productivity gains. Multiverse claims over two billion pounds in tracked return on investment
              across clients including Babcock, Capita, Addison Lee, and John Lewis Partnership. However, the
              anti-thesis highlights significant execution risks. The business model remains heavily tied to subsidized
              training frameworks and services-intensive delivery, which constrains software-like operating leverage.
              Past operational challenges, including US market retrenchment and workforce reductions amid widening
              losses, demonstrate vulnerability to macro and policy shifts. Given the premium $2.1 billion valuation
              relative to estimated private revenues, we assign a research-more recommendation with high risk and a
              stretched valuation rating.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
      - number: '8.2'
        title: Financing History, Round Structure, and Multiple Realities
        blocks:
          - type: paragraph
            body: >-
              In May 2026, Multiverse announced a $70 million primary financing round led by Schroders Capital,
              alongside participation from existing venture backers including General Catalyst, Lightspeed Venture
              Partners, Index Ventures, D1 Capital Partners, Bond, and StepStone Group. This transaction established a
              post-money valuation of $2.1 billion, representing a $400 million step-up from its $1.7 billion Series D
              valuation completed in June 2022. Cumulative capital raised reached approximately $570 million across all
              equity rounds. Management reported 50% year-on-year revenue expansion and achieved its first cash-positive
              quarter between January and March 2026. Nevertheless, baseline revenue disclosure remains opaque.
              Historical private benchmarks recorded $13 million in revenue at the time of the September 2021 Series C
              round, and UK filing aggregations indicated fiscal 2025 revenue between £50 million and £100 million. At a
              $2.1 billion valuation, the implied enterprise multiple remains elevated compared to broader software
              benchmarks, requiring sustained accelerated growth to justify the price.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Valuations'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Multiverse requires assessing how international expansion and enterprise adoption interact with
              unit economics and margin stability. In the bull scenario, European expansion following the January 2026
              acquisition of Berlin-based StackFuel succeeds, driving cross-border adoption and enterprise AI coaching
              scale via the Atlas platform. Sustained cash generation and operating leverage could support a valuation
              expansion toward $3.0 billion. In the base case, revenue grows at a moderate 30% to 40% rate in core UK
              and European markets, but margin expansion is dampened by human coaching costs, keeping fair market value
              near the current $2.1 billion mark or slightly lower on a secondary basis. In the bear scenario,
              regulatory scrutiny on government-subsidized apprenticeship allocations intensifies, enterprise churn
              rises post-pilot, and international execution stumbles as observed during earlier US expansions,
              triggering multiple compression down toward $1.0 billion to $1.2 billion.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV012
      - number: '8.4'
        title: Comparable Benchmarks, Diligence Priorities, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Multiverse straddles two distinct market categories: enterprise workforce upskilling and AI infrastructure
              enablement. While pure AI infrastructure companies like Multiverse Computing command high infrastructure
              multiples for compressed models and edge compute, Multiverse's core delivery model aligns more closely
              with enterprise education and training services. Public comparable multiples for tech-enabled training and
              HR tech providers trade at significant discounts to frontier AI software valuations. Exit readiness
              through a public listing in London or New York will depend on establishing multi-year profitable
              operations and demonstrating that European expansion can offset UK market maturation. Critical diligence
              priorities before considering capital deployment include verifying the durability of positive quarterly
              cash flow, auditing cohort-level customer retention beyond curated case studies, and assessing the exact
              cap table preference structure established during the May 2026 financing round.
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Allocation Discipline: Valuation Sensitivity'
            body: >-
              While Multiverse has established a reputable enterprise client footprint and demonstrated 50% revenue
              growth, the $2.1 billion valuation implies aggressive execution assumptions. Investors should refrain from
              purchasing shares at this mark without access to audited gross margins, unit-level cohort churn metrics,
              and verified customer retention data.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
          - type: callout
            title: Delivery Leverage and Historical Expansion Volatility
            body: >-
              The retreat from co-headquarters in New York and prior workforce adjustments emphasize that
              internationalizing apprenticeship models is operationally demanding. Expanding into Germany and wider
              Europe via StackFuel requires rigorous monitoring to ensure marketing and integration expenditures do not
              erode recent cash breakeven achievements.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV009
