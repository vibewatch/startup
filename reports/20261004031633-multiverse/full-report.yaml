  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Customer Segmentation & Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Multiverse segments its commercial customer base across large multinational enterprises, regulated public
              sector institutions, and national infrastructure operators facing urgent imperatives to translate
              artificial intelligence investments into operational capability [CU001, CU002]. Economic decision-makers
              typically comprise enterprise Chief People Officers, Chief Human Resources Officers, and corporate
              Strategy Directors seeking to protect workforces against technological displacement while capturing
              measurable operational efficiencies [CU002, CU003]. Commercial engagements span core customer profiles
              including critical national infrastructure contractors such as Babcock, established commercial services
              operators including The AA, Capita, and Addison Lee, and large public institutions such as the UK National
              Health Service (NHS), where Multiverse has deployed training across more than 100 NHS Trusts [CU001,
              CU002, CU004]. Rather than targeting small and medium-sized enterprises with self-serve digital content,
              Multiverse concentrates account acquisition on large corporate entities capable of deploying multi-year
              apprenticeships, funding programmes via statutory levy allocations, and mobilizing multi-departmental
              cohorts across data analysis, digital support, and agentic AI automation [CU001, CU003, CU005].
