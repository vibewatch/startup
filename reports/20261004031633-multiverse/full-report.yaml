      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Positioning as the Enterprise AI Adoption Layer
            body: >-
              Multiverse's technical moat lies not in training frontier foundation models, but in bridging the
              operational gap between enterprise software stacks and employee workflow execution. By pairing proprietary
              AI coaching software (Atlas) and emerging internal agentic systems with government-accredited
              apprenticeship frameworks, Multiverse secures deeply embedded enterprise deployments that pure software
              vendors struggle to duplicate [CE004, CE007, CE009].
            calloutType: insight
            claimRefs:
              - CE004
              - CE007
