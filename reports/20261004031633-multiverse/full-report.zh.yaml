        blocks:
          - type: paragraph
            body: >-
              Multiverse 将其商业客户群细分为大型跨国企业、受监管的公共部门机构，以及面临将人工智能投资转化为实际运营能力紧迫需求的国家基础设施运营商 [CU001,
              CU002]。采购决策者通常包括企业首席人才官、首席人力资源官与企业战略总监，他们期望在防范员工被技术替代的同时，获取可量化的运营效率提升 [CU002, CU003]。商业签约客户涵盖多个核心画像，包括
              Babcock 等关键国家基础设施承包商、The AA、Capita 与 Addison Lee 等老牌商业服务运营商，以及英国国家医疗服务体系（NHS）等大型公共机构（Multiverse 已在 100 多个
              NHS 信托机构部署培训）[CU001, CU002, CU004]。Multiverse
