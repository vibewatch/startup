  - id: FU001
    title: 企业客户旅程与落地架构
    type: journey-map
    summary: 展示典型企业客户从技能缺口诊断到全组织 AI 扩张的完整生命周期。
    data:
      nodes:
        - label: 1. 诊断评估
          touchpoints:
            - Skills audit via platform
            - Executive goal benchmarking
            - Levy allocation review
          detail: 平台对照企业 AI 战略，精准锁定员工能力差距。
          tone: neutral
        - label: 2. 班期签约
          touchpoints:
            - Programme selection
            - Apprenticeship levy contracting
            - Manager orientation
          detail: 企业管理层按业务部门签约定向班期，培训周期覆盖 13 to 16-month。
          tone: neutral
        - label: 3. 在岗技能提升
          touchpoints:
            - Bi-weekly coaching checkpoints
            - Atlas AI coaching interactions
            - Applied enterprise projects
          detail: 学徒把数据自动化与生成式 AI 工具直接应用到实际工作问题中。
          tone: positive
        - label: 4. 流程成效评估
          touchpoints:
            - Projected ROI tracking
            - Efficiency gain calculation
            - Manager review meetings
          detail: 学员为雇主交付可量化的项目成本节约与流程效率提升。
          tone: positive
        - label: 5. 跨部门复购扩张
          touchpoints:
            - Adjacent team enrollment
            - Partner platform integrations
            - Advanced Level 6 pathways
          detail: 试点成效显著，推动班期签约向工程与运营等多个部门扩展。
          tone: positive
        - label: 6. 持续性与留存风险
          touchpoints:
            - Contract renewal negotiation
            - Completion rate audit
            - Levy policy monitoring
          detail: 重服务交付模式、客户管理层变动或政策转向，均可能导致后续班期中断。
          tone: risk
    approximationNotes: 客户旅程阶段根据官方客户导入资料、岗位职责说明及公开案例研究梳理提炼。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU011
