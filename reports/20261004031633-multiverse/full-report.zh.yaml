              评估 Multiverse 的商业持久性，需要权衡管理层所宣称的高额投资回报率与非上市公司巨大的披露空白。Multiverse 宣称经核实的雇主投资回报率超过 £2
              billion，并声称借助生产力提升与成本节约，预计每位学员平均带来 £181,970 的财务回报 [CU006, CU010]。为扩大现有客户的钱包份额，Multiverse 与微软、Palantir 和
