      - number: '4.3'
        title: 资金充裕度、现金消耗率与投资评估结论
        blocks:
          - type: paragraph
            body: >-
              Multiverse 迎来了重要的流动性里程碑：公司在 2026 年 1 月至 3 月录得首个经营现金流为正的季度，随后在 2026 年 5 月获得由 Schroders Capital 领投的 $70
              million 一级融资，估值达 $2.1
              billion。然而，由于经审计财务报表、确切现金消耗率、资产负债表储备或客户集中度明细完全缺失，对这一现金流走势可持续性的评估受到制约。此外，一级半二级市场交易平台常将 Multiverse 与
              Multiverse Computing 混淆——后者是一家独立的西班牙量子 AI 基础设施初创公司，曾于 2026 年 7 月宣布了不相关的 $570 million C
              轮融资——从而引发市场对头部融资数据的困惑。严谨的投资评估需要核实 2026 年第一季度的正向现金流表现究竟反映了持久的经营性现金转化，还是仅为营运资金收付时点所致，同时还须评估总留存率与企业续约批次数据。
