chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、使命与创立演变
        blocks:
          - type: paragraph
            body: >-
              Multiverse（2016 年创立初期名为 WhiteHat）由 Euan Blair 与 Sophie Adelman
              在伦敦创立。公司成立的核心假设在于：劳动力市场系统性依赖传统大学文凭，既造成不公平的人才门槛，又未能为企业培养现代数字技能。Multiverse
              定位为技术赋能的劳动力转型与技能提升平台，旨在提供高质量专业学徒制培训，以此替代企业校招应届生与传统高等教育。2021 年，联合创始人 Sophie Adelman
              退出日常管理运营，但保留董事会席位与公司股份。公司起初依托英国法定学徒税（Apprenticeship Levy）框架搭建核心运营引擎，为大型企业设计并交付覆盖数据分析、软件工程与数字化业务转型的结构化培训。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO008
              - CO010
              - CO011
              - CO013
      - number: '1.2'
        title: 企业交付模式与应用型 AI 业务拓展
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的运营模式结合了个性化专业真人辅导、结构化应用课程模块、自研能力评估软件与活跃的学徒社群。公司与英国及美国的 1,500 多家企业机构合作（包括微软、Salesforce
              与巴克莱等大型跨国雇主），交付免背负债务的培训项目，由企业客户赞助学徒，同时获取可量化的生产力提升。Multiverse 培养的 AI 学徒人数超过任何同类职业培训机构，课程已拓展至 AI
              驱动的生产力、数字支持与 Agent 式 AI 解决方案。2026 年 1 月，Multiverse 收购了位于柏林的数据与 AI 培训机构
              StackFuel，加速其在欧洲大陆的业务拓展，将公司打造为专为企业员工设计的 AI 落地平台。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 管理层治理、领导架构与资本化历程
        blocks:
          - type: paragraph
            body: >-
              Multiverse 由创始人兼首席执行官 Euan Blair 掌舵，自 2016 年创立以来一直负责公司战略与业务扩张。高管领导层与董事会治理融合了创始人股权代表与大西洋两岸顶级风险投资机构。2022 年 6
              月，Multiverse 以 $1.7 billion 投后估值完成 $220 million D 轮融资，成为英国首家教育科技独角兽。2026 年 5 月，Multiverse 获得由 Schroders
              Capital 领投的 $70 million 一级融资，老股东 General Catalyst、Lightspeed Venture Partners、StepStone Group 与 Index
              Ventures 跟投。该轮融资对公司估值为 $2.1 billion，较上一轮提升 $400 million，反映出同比营收增长提速以及欧洲培训资产的战略整合成效。
