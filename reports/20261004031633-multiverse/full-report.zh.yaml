          detail: 多 Agent 协同、上下文评估流水线以及模型上下文协议（MCP）工具链
        - label: 生态与基础底座设施
          detail: 商用 LLM 厂商、云托管环境以及企业合作伙伴集成生态（Microsoft、Databricks、Palantir）
        - label: 治理与资质认证基座
          detail: 英国学徒税标准、官方资质认证框架与企业级安全合规护栏
        - label: 企业客户业务集成
          detail: 直嵌工作场景、企业专属数据环境与导师赞助人协同工作流
    approximationNotes: 根据官方工程规范、招聘披露及合作伙伴数据综合梳理的平台架构概念图。
