      - number: '7.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 职业学徒培训政策变动带来的脆弱性
            body: 由于 Multiverse 过去的商业扩张依托英国学徒税体系孕育发展，学徒税支出上限、合规课程资质认证或雇主共同出资要求的任何立法层面的调整，都会对单体经济模型和销售转化速度带来直接风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
          - type: callout
            title: 跨国扩张中的并购整合阻碍
            body: 2026 年 1 月收购位于柏林的 StackFuel 标志着 Multiverse 进军欧洲大陆，而欧洲大陆的职业教育在由联邦机构、工会与商会组成的三方治理机制下刚性运转，与英美劳动力市场模式存在显著差异。
            calloutType: insight
            claimRefs:
              - CR007
              - CR010
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资逻辑与建议立场
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的投资逻辑建立在一个判断上：企业落地人工智能需要员工技能提升，而非纯软件替代。公司运营着一个为企业客户交付学徒式技术培训的平台，公布拥有超过 1,500 家合作机构和约 22,000
              名在读学员。尽管企业 AI 预算迅速扩张，但高管调查表明内部技能短缺是实现生产力提升的首要瓶颈。Multiverse 宣称在包括 Babcock、Capita、Addison Lee 与 John Lewis
              Partnership 在内的客户中追踪到超过 two billion pounds（20
              亿英镑）的投资回报。然而，反方逻辑揭示了巨大的执行风险。其商业模式仍高度绑定补贴性培训框架和服务密集型交付，制约了类似软件的运营杠杆。包括美国市场收缩以及亏损扩大背景下的裁员在内的既往运营挑战，表明其对宏观与政策变动具备脆弱性。鉴于相比估算的非公开营收存在
              $2.1 billion 的高估值溢价，我们维持继续研究（research-more）建议，风险等级为高，估值评级为偏高（stretched）。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV013
