              - CM014
              - CM015
      - number: '2.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 企业 AI 落地瓶颈
            body: 企业对 AI 软件工具的投资激增，但实际生产力的提升受制于员工的业务实操能力，而非模型可用性。企业买方正日益将预算投向实操型技能培训，使前沿模型与员工日常工作流紧密衔接。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: 政策与地域层面的规模约束
            body: 英国的企业员工培训需求历来依赖法定学徒税。向欧洲大陆市场扩张，需要在缺乏同等国家资金补贴的情况下，应对不同的企业培训预算体系与劳动法规。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代交付模式
        blocks:
          - type: paragraph
            body: >-
              企业员工转型与 AI 技能提升市场为企业买方提供了截然不同的架构路径。Multiverse 主要作为面向雇主的直营培训机构运营，在认证标准下交付并管理全流程数字与 AI 学徒项目。相比之下，英国独立培训机构则利用
              TIQ-plus 等专业软件平台规模化管理合规审核、学员证据追踪以及脱产培训监管。在直营培训机构之外，企业还会评估现状替代方案，包括企业内部培训项目、数字内容库与模块化软件平台。Multiverse
              在企业学员梯队中推行标准化课程与交付，而由独立专业机构组成的去中心化网络则在医疗和金融服务等特定受监管行业提供本地化或定制化学徒培训。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
