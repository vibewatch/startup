      - number: '2.3'
        title: 买方经济学、利益相关方协同与结构性落地约束
        blocks:
          - type: paragraph
            body: >-
              企业采购员工 AI
              培训，需要首席人力资源官、首席信息官或首席技术官与业务部门主管达成协同。采购决策取决于经核实的投资回报率与工作流自动化成果，而非被动的课程结业率指标。在英国，企业的采纳很大程度上受到法定学徒税框架的驱动与补贴，降低了符合条件雇主的净现金支出。结构性落地约束包括企业重组风险、政府职业教育资金政策调整带来的敞口、员工培训结业率，以及欧洲大陆的跨国监管摩擦。此外，早年从美国市场的收缩表明，将享受本土补贴的学徒模式推广至海外企业采购环境存在显著难度。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
