      - number: '4.2'
        title: 成本结构、单体经济模型与运营效率
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的核心运营成本结构包含专家真人辅导、课程研发、学员考核管理费、Atlas 辅导界面的平台工程研发，以及与受监管培训标准相关的合规管理成本。与毛利率超过 75%
              的自动化软件平台不同，高触点学徒培训需要固定的人员辅导配比、持续的督导评估节点，以及在 13 至 16
              个月的项目周期内开展包含雇主在内的三方进度评审。负面报道指出，此前在美国以及广泛职业学科领域的扩张阶段，伴随着经营亏损扩大、员工裁员，以及难以达到法定培训结业指标等挑战；此后管理层将交付项目精简为约 14
              个聚焦的数字与 AI 课程。批次维度的获客成本、教练人员利用率与毛利率仍属非公开保密数据，需要通过详尽的尽职调查予以核实。
