  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 决策流向图呈现从商业落地成效推导至继续研究建议的完整路径。
    data:
      nodes:
        - label: 商业规模与落地渗透
          detail: 合作雇主 1,500+ 家，声称带来 £2B+ ROI，注册学员 22,000 名
        - label: 资本注入与领投机构
          detail: 按 $2.1B 估值完成 Schroders Capital 领投的 $70M 的 Series D 延展轮融资
        - label: 经营与财务信号
          detail: Q1 2026 首次实现正向现金流，但历史长期亏损且关闭了 US 联合总部
        - label: 估值水平与结构性阻力
          detail: 收入倍数偏高，且交付重度依赖人工导致毛利率承压
        - label: 尽调核心核验项
          detail: 重点核查现金流持续性、毛利率结构与客户班期留存率
        - label: 研究建议结论立场
          detail: 确立继续研究建议，提示高风险评级与估值偏高
