              CU004]。然而，负面及独立分析揭示出显著的商业风险。此前公司向美国市场及非技术性职业领域的扩张遭遇严重运营阻力，导致员工裁员、亏损扩大以及法定培训结业指标未达标，随后管理层才收缩至由 14 门数字化与 AI
              核心课程组成的产品组合 [CU011, CU012]。此外，由于 Multiverse
