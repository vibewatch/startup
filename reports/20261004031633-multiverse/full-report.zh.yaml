      - number: '1.4'
        title: 地域扩张、欧洲业务规模与技术定位差异
        blocks:
          - type: paragraph
            body: >-
              Multiverse 以伦敦全球总部为基点，在全英拓展业务并在美国建立广泛运营，员工规模超过 800 人。尽管公司在 2024 年遭遇宏观逆风与职业教育行业缩减，但 2026 年的资本注入及借助
              StackFuel 开展的欧洲扩张，推动了德国与英国核心市场的国际商业落地重新提速。与此同时，机构投资者将 Multiverse 的员工技能提升模式与 Multiverse Computing
              等邻近深科技软件公司明确区分。Multiverse Computing 是一家总部位于巴斯克地区的独立实体，专注于受量子启发（quantum-inspired）的 AI 模型压缩与软件能效（该公司于 2026 年
              7 月完成 $570 million C 轮融资），而 Multiverse 则完全定位为面向员工的技能提升与 AI 学徒培训平台。
