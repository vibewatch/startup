      - number: '2.2'
        title: 市场测算视角、增长驱动力与测算空白
        blocks:
          - type: paragraph
            body: >-
              企业对 AI 技能提升的需求源于突出的落地差距：企业在人工智能软件上的支出同比翻倍，但可量化的企业生产力提升仍受制于员工能力不足。行业调查显示，首席执行官们将内部技能短缺列在数据质量之前，视为企业引入 AI
              的首要瓶颈。尽管宏观科技与软件市场资本高度集中于算力基础设施，但人力资本赋能平台正将自身定位为不可或缺的落地承接层。然而，公开市场规模测算往往依赖宽泛的全球教育科技总额或未经核实的企业新闻通稿，而非可审计的自下而上企业支出调研。由于缺乏欧洲各司法管辖区独立且经审计的企业
              TAM 与 SAM 数据，长期潜在市场的实质性估值与规模测算依然存在未决疑问。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
