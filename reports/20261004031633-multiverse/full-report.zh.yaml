  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与实体消歧
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的核心目标市场涵盖英国与欧洲的企业员工 AI
              及数据技能提升、结构化学徒项目与员工技术赋能平台。纳入范畴的支出包括企业学习与发展（L&D）预算、技术培训开支，以及用于企业员工转型的英国学徒税拨款。排除在外的支出包括基础模型授权、算力与云基础设施采购、机器人流程自动化（RPA）运行环境、面向消费者的教育教程以及大学学位学费。严格界定品类边界至关重要，因为公开市场评论与自动搜索索引经常将英国员工培训提供商
              Multiverse，与西班牙 AI 模型压缩开发商 Multiverse Computing 以及不相关的消费级溶剂产品线混为一谈。独立分析必须将员工落地预算与国家级深科技算力支出剥离，以评估可持续的市场潜力。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
