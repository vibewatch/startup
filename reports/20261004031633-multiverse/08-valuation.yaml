    title: "Capital Allocation Discipline: Valuation Sensitivity"
    body: "While Multiverse has established a reputable enterprise client footprint and demonstrated 50% revenue growth, the $2.1 billion valuation implies aggressive execution assumptions. Investors should refrain from purchasing shares at this mark without access to audited gross margins, unit-level cohort churn metrics, and verified customer retention data."
    claimRefs:
