company:
  name: "Multiverse"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in London in 2016 by Euan Blair and Sophie Adelman, Multiverse pioneered tech-enabled apprenticeships funded via the UK Apprenticeship Levy before pivoting toward enterprise AI workforce upskilling. After reaching unicorn status with a $220M Series D round in 2022 and securing a $70M round at a $2.1B valuation in May 2026, the company acquired StackFuel and expanded its AI adoption platform across Europe, serving over 1,500 enterprise partners."

sections:
  - id: "corporate-identity-and-founding"
    title: "Corporate Identity, Mission, and Founding Evolution"
    body: "Multiverse (originally established in 2016 as WhiteHat) was founded in London by Euan Blair and Sophie Adelman. The enterprise was built on the core thesis that systemic reliance on traditional university degrees creates inequitable labor market gatekeeping while failing to equip corporate enterprises with modern digital competencies. Multiverse operates as a tech-enabled workforce transformation and upskilling platform designed to offer high-quality professional apprenticeships as an alternative to corporate graduate hiring and traditional higher education. In 2021, co-founder Sophie Adelman stepped back from executive operations while retaining a board seat and shareholding. The company initially built its core operating engine around the United Kingdom's statutory Apprenticeship Levy framework, designing and delivering structured training across data analytics, software engineering, and digital business transformation for large enterprises."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "business-model-and-enterprise-transformation"
    title: "Enterprise Delivery Model and Applied AI Expansion"
    body: "Multiverse's operating model combines personalized professional human coaching, structured applied curriculum modules, proprietary competency evaluation software, and an active apprentice community. The enterprise partners with over 1,500 corporate organizations across the United Kingdom and United States—including major multinational employers such as Microsoft, Salesforce, and Barclays—to deliver debt-free training programmes where corporate clients sponsor apprentices while capturing measurable productivity gains. Multiverse trains more AI apprentices than any competing vocational provider, expanding its curriculum into AI-powered productivity, digital support, and agentic AI solutions. In January 2026, Multiverse acquired Berlin-based data and AI training company StackFuel, accelerating its operational expansion across continental Europe and positioning the business as a dedicated AI adoption platform for enterprise workforces."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
  - id: "governance-leadership-and-capitalization"
    title: "Executive Governance, Leadership, and Capitalization"
    body: "Multiverse is led by Founder and Chief Executive Officer Euan Blair, who has guided corporate strategy and enterprise expansion since founding the business in 2016. Executive leadership and board oversight combine founder equity representation with premier transatlantic venture capital sponsors. In June 2022, Multiverse completed a $220 million Series D funding round at a post-money valuation of $1.7 billion, becoming the UK's first edtech unicorn. In May 2026, Multiverse secured $70 million in primary funding led by Schroders Capital, with follow-on participation from existing growth sponsors including General Catalyst, Lightspeed Venture Partners, StepStone Group, and Index Ventures. The round valued the enterprise at $2.1 billion, representing a $400 million valuation uplift reflecting accelerating year-over-year revenue growth and the strategic integration of European training assets."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "operational-footprint-and-restructuring"
    title: "Geographic Expansion, European Scale, and Technology Distinctions"
    body: "From its global headquarters in London, Multiverse expanded across the United Kingdom and established extensive operations in the United States, supporting an employee base of more than 800 professionals. While the company encountered macroeconomic headwinds and vocational sector downsizing in 2024, its 2026 capitalization and European expansion via StackFuel re-accelerated international commercial traction across Germany and the UK core. Simultaneously, enterprise investors distinguish Multiverse's workforce upskilling model from adjacent deep-tech software companies such as Multiverse Computing. Multiverse Computing is a separate Basque-headquartered entity focused on quantum-inspired AI model compression and software efficiency (which raised a $570 million Series C in July 2026), whereas Multiverse operates strictly as a human workforce upskilling and AI apprenticeship platform."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"

