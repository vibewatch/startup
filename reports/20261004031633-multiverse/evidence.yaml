evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-runway
    missingEvidence: >-
      Audited financial statements for fiscal year 2025 and 2026 detailing post-Series D revenue, operating margins, and
      cash balances.
    whyItMatters: >-
      Prevents independent verification of cash runway and recurring revenue growth following the May 2026 $70M
      financing round.
    diligencePath: Inspect Companies House annual report filings for Multiverse Group Limited for FY2025 and FY2026 once registered.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: investor-cap-table-breakdown
    missingEvidence: >-
      Detailed share class breakdown, liquidation preference multiples, and cap table percentages for Series D and 2026
      growth equity sponsors.
    whyItMatters: >-
      Limits exact modeling of common equity dilution and downside returns if enterprise exit occurs below the $2.1
      billion valuation.
    diligencePath: Review confirmation statements and capital return schedules in Companies House filings.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive listing of all supervisory board seats, independent non-executive directors, and secondary
      management committee members.
    whyItMatters: >-
      Full governance audit requires identifying all voting board members and committee chairs beyond the named
      executive officers.
    diligencePath: Examine full register of directors and secretarial filings at Companies House.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Exhaustive register of minority angel investors, early syndicate backers, and private secondary holders across all
      funding rounds.
    whyItMatters: Prevents exhaustive enumeration of smaller economic stakeholders across early seed and venture financing vehicles.
    diligencePath: Request shareholder register or cap table ledger during formal transaction diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular, bottom-up independent market study quantifying corporate budget allocation specifically for employee AI
      adoption and upskilling in the UK and continental Europe.
    whyItMatters: >-
      Vendor estimates conflate total software spend with training budgets, making it difficult to verify whether
      Multiverse's addressable market supports its valuation.
    diligencePath: >-
      Review independent analyst sector sizing from Gartner or IDC and cross-reference enterprise procurement filings
      for corporate L&D line items.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited FY2025 and FY2026 profit and loss statements, balance sheet, and audited cash burn figures.
    whyItMatters: >-
      Essential to underwrite whether Q1 2026 cash-positive performance represents durable profitability or timing
      variance.
    diligencePath: Request statutory accounts, management accounts, and trailing 12-month P&L under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Cohort-level gross margins, coach utilization, customer acquisition cost, and net revenue retention.
    whyItMatters: Directly determines operational leverage and long-term enterprise software versus service economics.
    diligencePath: Obtain cohort retention tables, customer renewal data, and fully burdened cost of delivery breakdowns.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: proprietary-software-ip
    missingEvidence: >-
      Technical documentation, architecture whitepapers, or benchmark evaluations demonstrating proprietary algorithmic
      IP in Multiverse's software layer versus third-party LLM orchestration.
    whyItMatters: >-
      Affects whether Multiverse is valued primarily as a high-margin software technology platform or as an
      operationally intensive professional education and apprenticeship service provider.
    diligencePath: >-
      Review internal technical architecture documentation, proprietary IP filings, and code evaluations for Atlas and
