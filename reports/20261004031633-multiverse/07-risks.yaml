    body: "Because Multiverse's historical commercial expansion was incubated through the UK Apprenticeship Levy system, any legislative restructuring of levy expenditure caps, eligible course accreditations, or employer co-investment mandates creates an immediate risk to unit economics and sales conversion velocity."
