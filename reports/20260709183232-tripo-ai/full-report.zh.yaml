      - number: '1.3'
        title: 融资、规模与商业化
        blocks:
          - type: paragraph
            body: >-
              公开融资动能真实，而且压缩得不同寻常。Forbes 报道称，2026 年 3 月 Alibaba 和 Hengxu 领投了 $50 million Series A；约三个月后，INCE
              Capital、Genesis Capital 和 Primavera 等组成的财团又参与了约 $200 million 的 2026 年 6 月 Series A+/A++ 轮。AI Weekly 也提到
              $200 million 融资，并把一家 China Life 关联基金加入轮次叙事。这些来源共同支撑核心结论：即使确切投后估值仍非官方、且依赖不同来源，VAST/Tripo
              也在很短时间内从有前景的产品公司变成中国 AI 独角兽。


              商业牵引也方向性强，但具体规模数字必须谨慎看待。SCMP/Yahoo 引述 6.5 million 用户，其中超过 85% 在中国以外，并列出 Tencent、NetEase、Sony、Microsoft 和
              Pop Mart 等企业用户。Forbes 2025 和 2026 年文章分别提到超过 3 million 专业用户、20 million 全球用户；AI Weekly 则称有 10 million 个人用户和
              90,000 家工作室客户。这些口径彼此差距太大，不能当作单一经审计 KPI 承销，但方向一致：Tripo 不是只有几个试点 logo
              的小众玩具。它已经形成可观的全球分发，尤其在游戏、创意以及接近工业设计的工作流里。


              变现模型比财务披露更清楚。官方定价显示，公司提供从免费到团队层级的自助订阅；Forbes 称，NetEase、Sony 等企业按项目收费，终端用户按月订阅，价格大致从 $20 到 $140。消费者 /
              专业消费者订阅、项目制企业变现、开发者 API 组合在一起，契合公司既做创作软件、也做 3D 基础设施的定位。仍然缺的是每个投资人最想先看的数字：经审计收入、ARR、毛利率和现金消耗。
