        title: 具名客户证明与开发者信号
        blocks:
          - type: paragraph
            body: >-
              具名 logo 证明存在，但质量不均。Sony、NetEase、MakerWorld 或 Bambu Lab、Replit
              是最强的公开样本，因为它们要么出现在多个独立来源中，要么有官方工作流页面解释合作如何运作。NetEase 尤其有用，因为 KR Asia 明确称 Tripo 用在 Where Winds Meet
              中，把证据从泛泛罗列 logo 推向有记录的下游使用。Sony 的公开合作伙伴页面也重要，因为它把 Tripo 连接到一个具体工作流环境——Spatial Reality
              Display——以及零售、教育和数字孪生等行业场景。


              开发者信号从另一个角度强化了同一故事。ComfyUI 官方伙伴文档、Tripo SDK，以及 TripoSR 和 ComfyUI-Tripo 周边的 GitHub
              足迹显示，技术用户不只是旁观产品，而是在把它接入工具链。这很关键，因为 3D-AI 公司可以有病毒式创作者采用，却不一定变得运营上重要。Tripo
              的公开开发者与伙伴界面更有力地说明，客户基础中至少有一部分正在真实工作流里使用系统。剩下的缺口是商业具体性：公开来源仍未清晰区分付费生产客户、试点、合作伙伴和参考用户。
