      - number: '5.2'
        title: 开发者界面与集成生态
        blocks:
          - type: paragraph
            body: >-
              开发者界面是公开记录里最清楚的差异化之一。Tripo 不只是暴露一个营销网站；它有开发者门户、需要密钥的 API、官方 Python SDK、ComfyUI 合作文档、官方 ComfyUI 和 Blender
              代码库，以及 MCP/Cursor 和 Babylon.js 或 Three.js 部署工作流指南。这套组合释放出的产品策略信号是：公司想嵌入创作者和开发者栈，而不是强迫所有使用都穿过单一浏览器
              UI。OpenAPI 任务端点要求认证，SDK 是异步的，插件生态覆盖 Blender、ComfyUI、web 运行时，甚至面向 Roblox 的导出教程——这些都指向托管、以 API 为中心的运营模型。


              生态证据不只是轶事。GitHub 元数据显示，TripoSR 牵引异常强，TripoSG 代码库、ComfyUI 节点、Blender 扩展和 Python SDK 也有较小但有意义的牵引。与
              MakerWorld/Bambu Lab 的合作案例也重要，因为它表明 Tripo 可以嵌入别人的工作流或市场，而不只是作为独立创作者应用使用。主要限制是，公开界面里的企业治理文档仍偏薄：功能文档很多，但
              SLA、SSO、管理控制或可用性承诺的可见证据很少，难以帮助技术买方承销关键任务部署。
