      - number: '8.2'
        title: 可比公司语境与反推收入约束
        blocks:
          - type: paragraph
            body: >-
              评估 Tripo 估值最诚实的方式，是先看市场语境，再反推出公司需要的收入分母。Multiples.vc 和 Acquiry 都认为，2026 年软件倍数仍然分化：AI
              原生资产仍可拿到真实溢价，但买方非常看重增长质量、留存和盈利能力。公开创意与 3D 邻近可比公司让这个判断落地。按市值口径，Adobe 当前收入倍数约 3.6x，Roblox 和 Unity 更接近 7x 到
              8x。这些同行并不完美，但为创意软件、创作者生态和 3D 工作流基础设施提供了有用的公开市场边界。


              最关键的前沿 AI 私募可比对象是 Runway。TechCrunch 报道了该公司 2025 年 $300 million 年化收入目标，以及 2026 年 $5.3 billion
              估值。这不是干净的同口径倍数，因为分母是目标而不是审计数字；但它确实说明，稀缺创意 AI 只要靠近世界模型，投资人有时愿意支付十几倍后段的倍数。从这个视角看，Tripo 的 $1.5 billion
              并不荒唐。不过，它要求背后有相当可观的隐含收入基础：20x 时约 $75 million，15x 时约 $100 million，12x 时约 $125 million，10x 时约 $150
              million。没有披露，这个分母仍然只是猜测。
