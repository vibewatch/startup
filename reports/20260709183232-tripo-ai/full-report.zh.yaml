      - number: '2.2'
        title: 买方、用户与付费方
        blocks:
          - type: paragraph
            body: >-
              买方地图是 Tripo 最有吸引力的结构特征之一。产品可以从个人、设计团队或技术组织切入，不必等待单一大型采购方。官方定价用 credits 和订阅支持个人创作者和小团队；官方 API
              页面和工作流页面则明确拆出开发者 / API 产品线，服务用量更高、集成更重的用户。这让 Tripo 能覆盖很不同的待完成任务：原型化一个道具，为 WebAR 生成家具资产，快速生成房间布局，把资产接入
              Unity 或 Unreal，或为工作室管线生成定制 3D 元素。


              实际细分比确切收入拆分更清楚。游戏工作室和 XR 团队看重低多边形网格、绑定、导出纪律和引擎桥接。电商和零售团队看重 GLB/USDZ 部署、商品页转化提升、AR
              摆放和退货率下降。室内与工业设计师更看重快速迭代和标准文件导出，而不是大规模 API 自动化。独立创作者和爱好者看重速度、credit
              包和浏览器易用性。每个细分的付费方都不同：创作者用信用卡自助购买，工作室动用美术或制作预算，企业 API 买方需要工程或产品基础设施批准，商业团队往往归在商品、增长或数字体验预算之下。


              这种多样性利好需求，却不利于讲一个简单故事。公司可以展示大量用户，却尚未证明深度企业变现；也可以展示强企业 logo，却尚未证明跨细分有标准化、可重复预算。Tripo
              的市场在资产吞吐反复发生、文件导出重要、节省人力显而易见的地方最强——尤其是游戏管线、XR /
              空间内容和商业可视化。偶发概念图或一次性新奇资产已经足够的地方则更弱，因为这些买方可以继续做免费用户，或低成本在工具之间切换。
