      - number: '3.2'
        title: 直接 3D 原生同行
        blocks:
          - type: paragraph
            body: >-
              Meshy 是最重要的直接公开基准，因为它的包装与 Tripo 的重叠度高于任何更宽的多模态平台。Meshy 营销文字 / 图像生成 3D、后处理、导出、插件、REST API
              访问、团队工作区、企业控制和安全姿态；定价页足够透明，让买方容易比较；2026 年博客 / 新闻节奏显示，它在工作流、打印、智能体式创作和合作节点工具上快速出货。如果 Tripo
              想主张自己独特地生产就绪，Meshy 是成熟客户或投资人会第一个拉出来的反例。


              Stability 是另一类威胁。它的公开 3D 产品没有包装成同样精致的创作者工作台，但 Stable Fast 3D 和 Stable Point Aware 3D 缩小了核心生成任务上的技术差距，并借
              API、GitHub 和社区许可渠道分发。对 Tripo 最不利的证据很直接：Stability 自己的 Stable Fast 3D 代码库称，该模型基于 TripoSR，并加入 UV 展开和材质技术。这意味着
              Tripo 的研究领先可以向外扩散到生态工具，而不是被锁在公司付费产品界面里。NVIDIA 又把这个威胁放大，因为 SPAR3D 有了绑定 RTX AI PCs 和 CES 式关注的硬件分发故事。


              结果是一场双线直接同行竞争。Tripo 必须在打包产品和商业转化层面击败 Meshy，同时证明自己的端到端工作流广度，能持续领先于开放模型和 API
              生态低成本重组出的能力。因此，竞争尽调不应只看表面模型质量，还要看转化、留存、团队工作区采用，以及当相似重建能力在别处广泛可用后，付费客户是否还会留下。
