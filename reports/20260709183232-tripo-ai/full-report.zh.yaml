      - number: '6.4'
        title: 留存、扩张与客户质量风险
        blocks:
          - type: paragraph
            body: >-
              最大投资判断问题不是缺少采用，而是客户质量不清楚。公开来源大量谈到创作者、logo 和增长，却很少披露 NRR、流失率、合同期限、按席位或 API
              量扩张的情况，或数百万用户中到底有多少会变成付费订阅者。价格阶梯暗示了一条可行的落地扩张路径：从免费创作者，到付费 Pro，再到团队或 API
              使用；但实际转化数学缺失。独立评测和定价摘要强化了反向证据：免费层足够慷慨，容易支撑大量试用；只有商业或私有使用变得重要时，付费权利才真正必要；更大的席位制计划价格不低，不是每个试用都会扩成严肃企业部署。


              因此，投资人应把客户故事视为有前景但尚未完全证实。获客动作看起来是产品驱动且国际化分布；如果转化健康，这很高效，反之风险也高。具名 logo 有帮助，但 logo
              密度本身不等于耐久收入。正确的下一步尽调，是从亮眼的公开触达转向有 cohort 支撑的收入质量：转化、续约、使用强度，以及按支出区间划分的 logo 状态。看不到这些之前，Tripo
              的客户章节支持正面的需求判断，但变现判断只能给中等置信度。
