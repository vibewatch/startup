      - number: '7.2'
        title: 地缘政治、算力与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Tripo 的算力风险并不抽象。美国贸易和出口管制来源明确显示，先进计算限制正直接瞄准放慢中国获得顶级芯片及配套 AI
              应用的速度。指引已经延伸到总部位于受限地区、但在其他地方运营的实体；美国官员也持续用军民融合和执法视角看待与中国有关联的交易对手。对一家耗算力的生成式 3D
              公司来说，实际后果很清楚：获得最佳芯片更难或更慢，会传导到模型质量、推理成本、产品延迟和发布节奏。


              依赖故事不止硬件。Tripo 还依赖云交付、插件生态和下游工作流信任。与此同时，巨型平台公司正在整合多模态模型目录、定价弹性和开发者工具。Microsoft Foundry 和 Azure OpenAI
              展示了既有巨头如何把前沿模型、可观测性和吞吐定价打包，从而让单点方案更难防守。OpenAI 的 Sora 时代模型阵容也从另一方向强化同一风险：Tripo 不只与其他 3D
              专家公司竞争，还要与更大的模型平台竞争；后者可能在客户提出专门 3D 供应商需求前，就先拿走预算份额。
