chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、结构、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              更准确地说，Tripo AI 是更大 VAST/Holymolly 公司栈里的产品品牌，而不是一家单一且披露清楚的运营公司。官方条款把 Holymolly Ltd 列为 tripo3d.ai
              背后的签约实体，并给出香港办公室地址；South China Morning Post 则称，公司以 Vast 名义注册于 Cayman Islands，并于 2023 年在北京设立。CB Insights
              的口径又不同，列出 Shanghai Pilot Free Trade Zone 总部。合在一起看，公开记录支持一个务实尽调结论：Tripo AI 是面向客户的品牌，VAST
              是融资报道里的母体身份；集团大概率采用多司法辖区结构，这在与中国有关的风投支持公司里很常见。


              产品主张本身在年轻 AI 公司里相当具体。官网、定价页、API 和多篇产品博客都把 Tripo 定位成端到端 3D
              创作工作流：用文字提示、图像、多视角输入和草图，在数秒内生成更接近生产可用的资产。官方材料反复强调的不只是生成，还包括分割、绑定、动画、格式转换、低多边形优化、导出到标准 3D
              格式等下游资产处理能力。这一点重要，因为 Tripo 推销的不是新奇图像生成器，而是为创作者、开发者和工作室提供的工作流替代或加速层，交付的是实际网格输出。


              截至报告日，这家公司已不再是早期概念验证。Forbes、SCMP/Yahoo 和公司材料都把 Tripo
              放在产品市场契合之后、高增长私营公司的类别里：公司已越过消费者演示阶段，同时销售订阅和项目制企业服务，并开始把自己从 3D
              资产生成器重新叙述为更广的空间智能与世界模型平台。最需要警惕的是，成熟叙事在运营层面更可见，在机构层面仍不够可见：公开产品界面很丰富，但公司栈和治理界面滞后。
