  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              分析 Tripo 的第一条纪律，是把市场定义窄到有用。Tripo 不是面向整个中国 AI 市场销售，甚至也不是面向整个全球创作者软件市场。它所在的是 AI 原生 3D 资产创作工作流层：文字 / 图像 /
              草图生成 3D、纹理 / 材质生成、网格清理与重拓扑、绑定、导出、API 驱动接入，以及从创作者到引擎的工作流工具。因此，它的真实市场边界更接近「把创意意图转换成生产可用 3D
              资产的软件和服务」，而不是泛泛的生成式 AI 支出。


              多个公开规模测算视角都有用，但各自回答的问题不同。Axis 和 Grand View 给出宽口径中国 AI 市场收入区间，Research and Markets 描述具体 3D 资产类别结构，China
              Daily/IDC 提供沉浸式计算支出视角，Digital in Asia 则用中国电商和游戏提供消费者需求背景。不能把这些数字硬塞进一个假的 TAM/SAM/SOM
              栈。更合适的做法是建立分层边界：最上层是巨大的中国数字化和 AI 预算；下面是更小的沉浸式、游戏 / 电商内容层；再往下才是 3D 资产生成工作流可变现的窄楔子。


              这种分层很重要，因为它避免了创业公司常见错误：用一张巨大 AI 市场幻灯片支撑估值。Tripo 的机会真实存在，但它不是完整的 $62 billion IDC 式中国 AI 市场，也不是完整的 $2.93
              trillion 中国电商市场。可用机会只占这些预算的一小部分：这些预算确实需要反复创作 3D 资产、快速迭代、标准导出，并具备足够下游信任，让团队敢把 AI 生成资产放进真实生产系统。
