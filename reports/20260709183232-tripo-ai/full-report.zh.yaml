      - number: '8.3'
        title: 中国 AI 语境，以及为什么溢价仍要打折
        blocks:
          - type: paragraph
            body: >-
              确有为溢价买单的牛市逻辑。2026 年，中国 AI 资本市场愿意给类别龙头打出极高估值：Moonshot 以 $20 billion 估值融资，CNBC 和 TechCrunch 描述的 Zhipu 与
              MiniMax 公开市场价值，也会随着模型发布改变情绪而大幅移动。Tripo 也有可信的增长可选性。Forbes、Yahoo/SCMP、ACCESS
              和官方新闻稿合在一起，描绘的是一家公司正从快速用户增长，走向更大的世界模型、内容和生态野心。换句话说，溢价叙事不是虚构。Tripo 是少数拥有可见消费者漏斗、创作者心智和企业 logo 的中国应用 AI
              公司之一。


              但同一叙事需要纪律性打折。Moonshot、Zhipu 和 MiniMax 更接近前沿模型融资故事，而不是私有 3D 应用栈。Tripo
              还暴露在中国特有的监管和出口管制风险下，可能冲击算力成本、全球企业胃口和投资人退出假设。CNBC 的 AI 退出报道给出第二个折扣：资本充裕，但流动性仍然稀薄且不均衡。最后，独立评测仍把 Tripo
              描述为常常受益于清理的工作流加速器，而不是通用生产替代品。这些事实不会杀死估值逻辑，但会让投资人更难在没有不透明折扣的情况下，支付干净的前沿 AI 倍数。
