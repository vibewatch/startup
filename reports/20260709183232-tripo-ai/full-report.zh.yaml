  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与工作流组合
        blocks:
          - type: paragraph
            body: >-
              Tripo
              还很年轻，但客户图谱已少见地分散。官方材料没有把产品锁定在单一买方，而是反复面向创作者、独立游戏开发者、工作室、产品团队、建筑师、零售商，以及影视或媒体用户。这种多样性重要，因为它给平台带来多个入口：个人创作者可以从免费计划开始，游戏团队可以用它快速原型，电商运营可以把它接入商品目录工作流，平台伙伴则可以通过
              API 或工作区界面嵌入。时尚 AR、目录扩展、影视级预演和游戏绑定的垂直页面，都指向同一个结论：只要 3D 资产吞吐是反复出现的问题，Tripo 的卖点就是工作流加速器。


              广度的另一面，是不同用户分层的变现能力并不相同。免费层降低了使用门槛，创作者和爱好者采用大概率充足；但企业级付费意愿会集中在 3D
              资产具有运营重要性、而不只是装饰性的场景。因此，公开用例页面在游戏、商业可视化、平台嵌入、建筑或工业设计，以及 XR 或空间显示上最有说服力。拿来证明深度企业粘性时，它们的说服力较弱，因为公开记录更多说明谁能使用
              Tripo，而不是哪些分层会续约、扩张，并长期贡献可观付费。
