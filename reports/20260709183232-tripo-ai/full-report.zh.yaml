  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚与商业化表面
        blocks:
          - type: paragraph
            body: >-
              公开记录已经足以验证，Tripo 是一个真实融资故事，而不是传闻。2026 年 6 月的官方发布、SaaS 行业报道、AI Weekly 和 Forbes 指向同一幅大体图景：VAST 完成约 $200
              million 的 A+ 和 A++ 融资，借此推出世界模型路线图，并已经被讨论为独角兽。Forbes 是最干净的可得估值锚，因为它把该轮融资与包括 INCE Capital
              在内的财团联系起来，并称一位知情人士给出的公司估值约为 $1.5 billion。确切投后条款仍有一些模糊，但足以把 $1.5 billion 作为尽调使用的工作市场价格。


              商业化表面也比纯 demo 叙事更真实。Tripo 定价页显示出明确的免费增值漏斗，然后清楚抬升到付费商业权利、更高并发、批量导出和私有模型。API
              页面和官方垂直案例研究又显示出第二层变现：开发者使用、伙伴嵌入和工作室工作流。问题不是缺少可见变现表面，而是公开档案从未告诉投资人，1000 万用户或 90,000
              个工作室客户中到底有多少在付费、花多少钱，或产品是否能产生软件式利润率。
