      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人记录是本案最清晰的正面信号之一。多家独立来源都确认 Simon Song 是创始人兼 CEO；他的创始人与市场匹配既来自领域审美，也来自此前运营 AI 公司的经验。Forbes 和 SCMP 称，Song
              曾就读于 Johns Hopkins，任职于 SenseTime，随后联合创办 MiniMax，并在 2022 年离开去创建 VAST。这些细节重要，因为 Tripo 位于生成式
              AI、游戏、动画和工具的交叉点，而 Song 自己的公开叙事也明确锚定在玩家身份：他想让 3D 创作更快。


              看不见的部分几乎同样重要。公开材料高度围绕创始人展开：Song 是融资报道里的发声者、被点名的技术叙事者，也是显眼的人才磁铁。但已抓取资料没有给出扎实的公开董事会名单、具名
              CFO，或清晰独立的治理层。即便公司面向用户的文件在产品权利和用户义务上写得很细，也没有实质披露控制权、委员会结构或更宽的高管梯队。这对一家 2023
              年创立的私营公司并不少见，但当估值进入独角兽区间，它就是实打实的尽调缺口。


              因此，治理判断是混合，而非负面。创始人集中度可能加快产品速度，也帮助 Tripo
              下重注：发布开源模型、投入世界模型、扩展工作流插件。代价也很清楚：关键人物依赖明显，外部很难看见谁在内部挑战创始人、谁负责财务纪律，以及香港、Cayman、北京和可能与上海有关的注册主体之间如何治理。
