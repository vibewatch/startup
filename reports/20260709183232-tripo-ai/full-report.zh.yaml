      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Tripo 的公开财务图景，架构最强，证明最弱。架构是合理的：低摩擦获客、与使用挂钩的 API 变现、分层向上销售到商业权利和工作流功能，以及看起来足够大的资本基础，能让产品开发继续推进。这正是 AI
              基础设施邻近应用公司该有的设置，因为模型创新和工作流包装都很重要。


              但证明缺口大到投资人不应过度自信。公司没有公开展示决定其定价界面是否有经济吸引力的核心数字：付费转化、收入集中度、实际 ARPU 或
              ARPA、扣除推理和支持后的毛利率、企业留存和现金消耗。竞争平台也在发布易获取的定价，仅凭标价很难推断定价权。


              实际结论是，Tripo
              看起来可融资，但还不能完全承销。公开信息支持看多资本获取能力，也支持对变现设计作出中等正面判断。它不支持对效率、收入质量或达到自我维持经济性的时间作出精确判断。在管理层打开构成、毛利率和现金消耗账本之前，投资逻辑仍取决于相信快速扩张和未来强转化，而不是已展示的公开财务表现。
