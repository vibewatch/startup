      - number: '1.4'
        title: 里程碑、技术信号与不利因素
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，平台扩张速度异常快。官方和半官方来源把公司从 2023 年创立，追踪到 2025 年产品强化，再到 2026 年资本加速。到 2025 年末，Tripo
              已经越过原始提示词到模型生成，进入纹理引擎、分割、绑定、格式转换、ComfyUI 节点、Blender 工作流，以及 Sony Spatial Reality Display
              合作等企业合作叙事。研究界面也有实质内容：TripoSR、TripoSG 和 GitHub / 开源足迹，让公司相对许多只有产品、缺少公开研究产物的 AI 应用公司，拥有更强技术信号。


              同时，证据集还不足以让人盲目接受每一句管线就绪声明。本章最有用的不利来源是独立 Medium 拆解，它提出了一个公平观点：3D AI 演示在导出前可以很漂亮，但真实生产价值取决于 mesh 是否干净、UV
              是否可迁移、绑定是否稳健，以及在真实下游工具里的清理时间。这个批评也呼应 Tripo
              自己反复强调的分割、绑定、低多边形优化和导出处理——只有当下游摩擦真实存在时，公司才会重压这些功能。换句话说，不利情形并不是产品造假；而是真实生产就绪度是一条光谱，不是二元标签。


              因此，战略弧线可信，但尚未充分去风险。VAST 显然想超越单一资产生成应用：Project Eden 和 W1.0 表明公司有意向世界模型与空间仿真上爬；Sony
              以及工作流插件合作则显示出真正的商业化落地想象力。尽调的开放问题是，产品和资本形成的速度，是否已经由企业控制、治理成熟度和独立测量的生产性能跟上。
