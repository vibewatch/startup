      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Tripo 最强的公开护城河，并不是别人生成不了 3D 物体。公开记录已经推翻了这一点。相反，它的护城河在这些地方最强：工作流包装、创作者 UX、导出纪律、团队功能和带有领域感的 3D
              身份，合在一起形成一个比从模型、代码库和通用创意套件拼栈更容易采用的产品。这是真实价值，尤其适合需要反复资产吞吐，而不是偶发 AI 实验的游戏、XR、电商和设计团队。


              但护城河裂缝可见。Meshy 证明另一家创业公司可以用透明定价、企业控制和大规模宣称，包装出高度相似的故事。Stability 证明源于 Tripo
              的研究思路可以扩散到开放或半开放生态。Adobe、Luma、OpenAI 和 Microsoft
              证明，围绕工作流的信任、安全控制、品牌认知和打包客户入口，可能和生成器本身一样重要。这些力量指向一种可能的多栖市场结构：买方测试多家供应商，把手工 DCC 工具作为后备，并避免深度依赖单一供应商，除非
              API、工作区、资产库或协作功能创造出真正锁定。


              因此，实际尽调问题很简单：Tripo 哪些切换成本已经能穿越模型商品化？如果付费收入仍主要来自追逐最新模型输出的自助创作者，耐久性就弱。若收入越来越多嵌入 API
              驱动资产管线、共享工作区、企业治理和可重复垂直工作流，耐久性就更好。在管理层用队列、留存和赢单 / 输单数据证明这次转变前，公司应被视为竞争前景不错，但防线尚未牢固。
