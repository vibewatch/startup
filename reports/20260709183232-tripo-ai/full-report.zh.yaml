      - number: '8.4'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              本章结论应该谨慎，但不应轻易否定。Tripo 有足够的产品广度、采用证明和可比市场支撑，可以留在投资人的主动跟踪名单上；当前价格也不像某些纯炒作 AI
              轮次那样明显不理性。然而，缺失分母的问题具有决定性。投资人仍看不到 ARR、付费 logo 质量、cohort
              留存、毛利率，或估值背后的真实清算优先权结构。这意味着市场价格也许说得过去，但仅凭公开证据，公允价值仍未充分证明。


              因此，可支撑的建议是跟踪，而不是买入。估值是偏紧，而非明显昂贵，因为真实动能存在，Runway 式私募可比对象也说明，市场有时会为稀缺创意 AI
              支付上沿倍数。置信度应保持中等，风险保持高位，因为下行路径很容易描述：如果 Tripo 的 ARR 仍远低于约 $100
              million，如果免费到付费转化较弱，或如果中国因素引发的算力和合规冲击加剧，估值压缩风险会很大。接下来的尽调任务很明确：核实分母，检查留存和利润率质量，并弄清当前估值是由经济性支撑，还是由轮次结构撑住。
