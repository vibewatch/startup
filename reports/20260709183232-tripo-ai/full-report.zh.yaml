    联合创始人。Tripo 已从文字 / 图像生成 3D，扩展到 API、工作流、商业、媒体以及接近世界模型的产品界面。公开报道把 VAST 与 2026 年 3 月 Alibaba 领投的一轮融资，以及规模大得多的 2026 年 6
