        - 收入成本一重，AI 原生倍数会很快压缩。
        - 工程与财务尽调
      - - 股权结构表与轮次结构
        - 优先股堆叠、清算优先权、反稀释棘轮、员工老股条款和稀释历史
        - 名义价格可能不等于普通股价值。
        - 法律顾问与融资备忘录审阅
      - - 客户质量
        - 具名付费客户、ACV 区间、企业客户收入占比和免费转付费
        - 只有底层收入质量足够强，10M 用户才有投资价值。
        - 销售运营、产品分析和客户访谈核验
    notes: 这些请求正好补齐当前阻碍更高确信度建议的缺口。
    claimRefs:
      - CV013
      - CV016
      - CV024
      - CV028
      - CV040
      - CV043
