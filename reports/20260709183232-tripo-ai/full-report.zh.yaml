  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律压力
        blocks:
          - type: paragraph
            body: >-
              Tripo 处在当前 AI 版图中合规压力最重的区域之一：与中国有关联的生成式模型业务，拥有全球用户、可下载输出，训练数据来源也不清晰。公开记录已经显示，公司要穿过的规则密度很高。中国监管环境现在覆盖生成式 AI
              安全要求、标识执法、网络安全法修订，以及多部门 AI 智能体指引。与此同时，Tripo
              自身条款和隐私政策显示，服务处在正式法律框架下，触及企业客户数据，并涉及国际数据传输。这意味着合规负担不是理论问题，而是直接落在客户和产品表面上。


              更难的法律问题是 IP。美国版权争论围绕训练数据合理使用、市场损害和输出责任持续变化，但远未落定。近期分析称，训练在某些情形下可能构成合理使用；但盗版或未经授权的来源，或与权利人竞争的输出，仍可能带来责任。由于
              Tripo 没有公布其 3D 模型背后数据的清晰来源图，投资人不能把训练数据合法性视为已解决。对一家输出可能与商业 3D 资产重叠的公司来说，这种不确定性不是脚注，而是核心投资判断问题。
