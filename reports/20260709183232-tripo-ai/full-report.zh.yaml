  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价界面
        blocks:
          - type: paragraph
            body: >-
              Tripo 的公开变现架构，比它的公开财务披露具体得多。公司清楚销售三类经济产品：自助 Studio 订阅、按使用量计费的 API credits，以及更高席位数的团队或企业计划。定价页展示了经典 SaaS
              阶梯——Free、Pro、Max、Team；API 文档则展示了独立的先付后用 credit 账本。这种拆分很重要，因为它意味着 Tripo 不依赖单一变现动作。它可以靠循环订阅变现爱好者和专业人士，靠用量和预付
              credits 变现开发者，并靠团队治理、并发、工作区和管理功能变现组织。


              公开界面也显示 Tripo 实际在为什么收费。定价页不只是限制模型访问，还限制私有模型、商业使用、并发、批量导出、专用处理、共享工作区、存储深度和编辑历史。API 文档再加一层：复杂度更高的工作流消耗更多
              credits，SDK 和任务端点暴露精确的已消耗 credit 与余额计量数据。换句话说，Tripo 已经搭出一个商业控制系统，不只按席位数，也能按真实工作流强度计量价值。


              但这不能证明收入质量。便宜入门价格会扩大漏斗，也意味着如果免费用户占主导，或专业用户没有转化为 API 或团队支出，表面用户规模可能掩盖弱变现。公开材料证明 Tripo
              知道自己想怎么收费；还没有证明这些收费能否高效转化为高毛利、可重复的企业收入。
