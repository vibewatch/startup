  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Tripo 当前产品界面明显宽于简单文字生成 3D
              演示。官方首页和功能页展示了一个托管工作流，从文字提示、图像和多视角参考开始，再延伸到贴图、分割、四边面重网格、绑定和导出等后处理模块。定价页进一步说明，这套产品想跨不同用户类型运行：轻量免费层用于实验，专业消费者和工作室层提供更高并发，面向团队的包装则加入共享工作区和集中管理。这种广度重要，因为
              Tripo 试图把 3D 管线的多个步骤压缩到一个订阅界面里，而不是以单一狭窄模型端点竞争。


              输出叙事也比许多通用生成式 AI 产品更懂工作流。Tripo 官方材料和教程讨论 GLB、FBX、OBJ、STL，以及面向 Roblox 的导出；JavaScript 指南明确建议网页部署使用 GLB，并提到
              USDZ 在某些集成工作流中可作为替代路径。实践中，当用户想为游戏、网页场景、3D 打印或交互原型快速拿到第一版资产，并愿意把它们送入下游清理或引擎检查时，Tripo
              看起来最强。因此，产品最好被框定为从创作者到生产的加速层，而不是每个 DCC 或引擎原生任务的替代品。
