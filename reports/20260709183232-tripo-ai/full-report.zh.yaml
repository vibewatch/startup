      - number: '4.3'
        title: 单位经济与披露缺口
        blocks:
          - type: paragraph
            body: >-
              用公开信息承销 Tripo，最难的不是理解产品可能如何赚钱，而是理解它已经做得多好。保留来源没有披露收入、ARR、毛利率、现金消耗、现金余额、客户集中度、净留存、企业 ACV
              或算力承诺。这迫使分析师从收入机制而不是业绩证据出发。好消息是机制清楚：credits 可以把使用量映射到计费，团队计划可以变现协作和治理，私有 /
              商业权利可以把免费用户推向付费层。坏消息是，看得懂机制不等于证明机制有效。


              公开标价足够低，仅凭用户数说明不了多少。大量免费或低支出创作者，可能与不高的实际收入并存。如果存在更高质量收入，它大概率位于循环团队合同、共享工作区、API 集成，以及管线反复消耗 credits
              的客户中。因此，单位经济问题本质上是构成问题。没有细分转化和使用强度，投资人无法区分炒作式规模和变现规模。


              还有一个不利运营角度。独立拆解的怀疑和竞争定价压力提示，Tripo
              仍必须证明生产就绪输出足够好，可以支撑持久预算，而不是反复实验。如果导出清理或工作流摩擦仍高，哪怕漏斗顶端增长很强，变现也可能卡住。因此，公开证据支持可信的计费设计，但还不能公开证明 Tripo
              已经从令人兴奋的采用，跨入高质量软件经济性。
