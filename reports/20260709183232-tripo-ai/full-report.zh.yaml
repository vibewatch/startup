      - number: '5.3'
        title: 模型架构与公开路线图信号
        blocks:
          - type: paragraph
            body: >-
              Tripo 最强技术可信度信号来自研究层。TripoSG 论文和代码库展示的是真实模型架构，而不是模糊产品营销：大规模 rectified-flow transformer，结合 SDF、normal 和
              eikonal losses 的 hybrid VAE supervision，以及 2 million 个样本的 image-to-SDF 数据管线。代码库还记录了 1.5B
              参数版本和涂鸦条件变体，说明公司愿意向研究和开发者社区暴露至少一部分模型谱系。TripoSR 从重建侧补全了这个故事：它是领先单图模型，声称在 A100 硬件上推理不到 0.5 秒，并以 MIT license
              发布，由 Stability AI 共同开发。


              2026 年路线图叙事越过了这些研究产物。公开新闻和赞助报道把 P1.0 和 H3.1 描述为更整体的空间架构、更面向生产，目标是降低许多 3D
              生成器面临的手工编辑负担。这不能证明完整产品已经在所有地方交付每一项声称能力，但它确实展示了一条连贯战略方向：Tripo 想从「快速生成一个网格」走向「生成更干净、更能进管线的资产，并借插件、API
              和创作者工作区分发」。剩余尽调任务，是把这些研究和营销标签干净映射到实际生产端点和变现界面。
