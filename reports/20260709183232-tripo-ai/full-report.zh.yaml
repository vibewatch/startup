      - number: '7.4'
        title: 团队、执行与止损标准
        blocks:
          - type: paragraph
            body: >-
              Tripo 的执行风险与人员风险紧密相连。公开报道把 Simon Song 放在创始人、运营者和对外叙事者的中心位置，而更广的接班梯队仍不清楚。这种集中可能帮助速度，但如果创始人分心、离开，或无法招募并留住前沿
              3D 平台所需的研究和基础设施负责人，也会增加脆弱性。更广泛的 AI 市场已经人才紧缺；热门创业公司在景气期或许还能应对，一旦产品失手或政策挤压，就会很痛。


              对投资人来说，关键问题不是这些风险是否存在——它们显然存在——而是哪些风险最可能先打破投资论点。信号最强的触发器很直接：可见的监管行动、芯片获取明显恶化、无法把头条规模转化为付费质量、生产质量基准恶化，或领导层流失且没有可见梯队。Tripo
              确实有一些可见缓释因素——开放研究信号、活跃发版、伙伴界面和创作者驱动分发——但还不足以把残余风险压低。它仍是高风险、高上行的运营画像，需要扎实的私下尽调之后，才能有信心支撑价格。
