      - number: '2.4'
        title: 中国语境与 SAM 含义
        blocks:
          - type: paragraph
            body: >-
              中国对 Tripo 有两重意义：一是基础设施和政策背景，二是部分但不完整的需求上限。中国在 AI、云、5G、游戏、电商和数字支付上的规模，为 3D 内容工具提供了肥沃土壤。但第一章证据显示，超过 85%
              的用户在中国以外；纯中国 TAM 叙事会低估 Tripo 需求已经有多全球化。更好的框架是：中国生态给 Tripo 便宜实验、人才密度和产业政策支持，而商业机会在全球范围内存在，前提是当地有重复 3D
              内容创作需求。


              这引出 SAM 含义。可触达市场不是单一地理区域，也不是一个采购渠道。Tripo 可服务的市场，是中国内外同时需要 3D 资产吞吐、又能容忍 AI
              生成资产进入真实生产工作流的团队集合。游戏、XR、电商可视化、室内 / 产品设计，以及部分工业仿真用途都符合条件，只是置信度和付费意愿不同。公司的创作者基础可能是全球的，但更高置信度的变现口袋，大概率集中在手工
              3D 工作痛点频繁、可测量且昂贵的场景。


              未解决的尽调问题在于，没有公开来源把这个可服务市场干净切出来。投资人可以用相邻支出池和工作流经济学去夹逼估算，但仍需要管理层展示用户细分构成、各用例转化率、企业
              ACV，以及公司到底在哪里真正替代了既有人力或软件支出。在此之前，市场故事最好被视为大且上行——但只有一部分已经转化为可证明的可服务收入基础。
