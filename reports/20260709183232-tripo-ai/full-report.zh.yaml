      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自 Tripo 想替代的难看基线。传统 3D 工作流很慢，重度依赖专业经验，还被建模、UV、贴图、重拓扑、绑定和导出切得很碎。Tripo
              每个公开工作流页面都在抓同一个市场事实：团队愿意为更短的从概念到资产周期、更少的一版几何美术工时，以及更容易进入引擎、查看器或 AR 店面而付费。当游戏管线、XR
              内容、数字商业和工业可视化都要求比人工团队更高的资产量时，这种需求拉力会变得更强。


              第二个驱动是工作流集成。即使市场预算很大，AI 点解决方案的输出进不了真实下游系统，也很难转化。Tripo 围绕 ComfyUI、Blender、Unity、Unreal、REST APIs、标准导出和 DCC
              桥接的官方信息之所以重要，正是因为工作流深度常常决定一个 pilot 能否变成预算项。用市场语言说，互操作性降低切换成本，也让无法忍受孤儿资产或每次交接都手工返工的团队更容易服务。


              最大约束同样清楚。第一，输出质量仍需要人工验证：官方页面强调分割、低多边形和导出处理，正是因为下游摩擦仍真实存在；第一章的不利来源说明了这点为何重要。第二，公开市场规模估算会随着边界是窄口径软件收入还是宽口径
              AI 关联经济活动而大幅波动，这削弱了巨型 TAM 幻灯片的用处。第三，中国生成式 AI
              监管和标识规则，会给面向中国公众用户或跨境数据流的服务带来反复合规工作。因此，市场有吸引力，但只奖励那些把原始生成能力、工作流可靠性、合规纪律和足够产品深度组合起来、能跨过专业信任门槛的供应商。
