  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方选择集
        blocks:
          - type: paragraph
            body: >-
              Tripo 同时在不止一条赛道竞争，所以简单同行组会误导。买方如果想要生产可用的 3D 网格、导出、低多边形优化以及从浏览器到管线的工作流，相关替代品是 Meshy 这类直接 AI-3D 产品，以及围绕
              Stability 发布版搭建的开放模型栈。买方如果主要想要营销活动内容、分镜动态或创意概念生成，Adobe Firefly、Luma 和 OpenAI/Azure 即便不交付同一套 3D
              网格工作流，也能拿走预算。对很多团队来说，默认替代品仍然不是另一家创业公司，而是手工 Blender/Maya/Substance 工作、外包工作室、摄影测量，或由 API 和插件拼起来的内部工具链。


              因此，公开材料指向一个分层竞争地图。Tripo 和 Meshy 是最清晰的自助、web 优先、AI 原生 3D 工作台替代品：两者都营销速度、民主化、导出和更宽的工作流工具，而不只是实验室演示。Stability
              和 NVIDIA 重要，是因为它们可以把高质量 3D 生成推到开放层或平台放大的层面，从而削弱纯算法护城河。Adobe 重要，是因为它已经掌握大量创意预算，并把多个合作伙伴模型、商业安全定位和 Content
              Credentials 打包在一起。Luma 和 OpenAI 重要，是因为买方注意力正漂向多模态和世界模型叙事；即使它们不能逐资产替代 Tripo，也能重定向企业实验预算和投资人框架。


              战略含义是，Tripo 不能只问今天谁的网格最好来评估竞争。它必须同时赢三场比较：相对 Meshy 的直接打包 3D 工作流，相对 Stability 式开放生态的模型 /
              平台经济性，以及相对创意套件既有平台的信任加分发。这让市场比狭义创业公司对创业公司比较更危险；但也意味着 Tripo 不需要在所有地方击败 Adobe 或 OpenAI，它只需要在生产就绪 3D
              资产生成确实是待完成任务的场景里赢得清楚。
