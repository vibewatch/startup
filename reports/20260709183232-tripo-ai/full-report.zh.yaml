      - number: '6.2'
        title: 采用趋势与地域分布
        blocks:
          - type: paragraph
            body: >-
              即便把口径噪音打折，公开采用曲线仍然强。多个 2025 和 2026 年来源显示，Tripo 已远不只是小众开发者玩具：用户数从 2025 年夏末约 300 万，升至 2025 年末 650 万，再到某个
              2026 年来源称 1000 万个人用户；另有来源还提到 35,000 名活跃开发者、40,000 家工作室或企业伙伴、90,000 名开发者，或 90,000
              个工作室客户。这些数字明显在衡量不同人群，不能合并成一个干净 KPI；但它们足以支撑一个稳健的方向性结论：Tripo 以少见速度建立了全球分发。


              地域格局同样值得注意。Yahoo 转发的 SCMP 报道称，超过 85% 用户在中国以外，欧洲和美国是最大市场；Forbes 又把日本和韩国加入集中市场清单。这一点重要，因为它说明 Tripo
              的增长不只是一个中国 AI 故事。与此同时，全球足迹还没有告诉投资人付费收入实际在哪里。没有董事会级别的定义表和区域收入拆分之前，公开采用故事很亮眼，但只有部分达到投资级质量。
