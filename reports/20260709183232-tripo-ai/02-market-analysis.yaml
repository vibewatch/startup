- id: china-context-and-sam-implications
  title: China Context and SAM Implications
  body: 'China matters to Tripo in two different ways: as an infrastructure and policy backdrop, and as a partial but not complete demand ceiling. The country''s AI, cloud, 5G, gaming, e-commerce, and digital-payments scale creates fertile conditions for 3D-content tools. But chapter one''s evidence that more than 85% of users are outside China means a pure China TAM story understates how global Tripo''s demand already is. The better framing is that China''s ecosystem gives Tripo cheap experimentation, talent density, and industrial-policy support, while the commercial opportunity is global wherever repetitive 3D content creation exists.


    That leads to the SAM implication. The addressable market is not a monolithic geography or one procurement channel. Tripo''s serviceable market is the set of teams—inside and outside China—that both need 3D asset throughput and can tolerate AI-generated assets inside a real production workflow. Gaming, XR, e-commerce visualization, interior/product design, and some industrial simulation uses all qualify, but with different confidence levels and different willingness to pay. The company''s creator base may be global, but its higher-confidence monetization pockets likely concentrate where the pain of manual 3D work is frequent, measurable, and expensive.


    The unresolved diligence issue is that no public source isolates this serviceable market cleanly. Investors can bracket it with adjacent spend pools and workflow economics, but they still need management to show user-segment mix, conversion rates by use case, enterprise ACVs, and where the company is genuinely displacing incumbent labor or software spend. Until then, the market story is best treated as large and rising—but only partially translated into a provable serviceable revenue base.'
