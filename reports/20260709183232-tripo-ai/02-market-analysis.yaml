- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Manual 3D workflow cost and speed pain
    - driver
    - current
    - Creates a clear ROI story for first-pass generation, retopology, and export automation
    - Ask management for measured customer time-saved or cleanup-time benchmarks
  - - China gaming market scale and content depth
    - driver
    - current
    - Supports recurring demand for props, environments, characters, and iteration workflows
    - Request segment revenue or user mix from gaming and entertainment accounts
  - - China e-commerce and live-commerce scale
    - driver
    - current to medium term
    - Creates a large adjacent budget pool for 3D visualization and AR-enabled merchandising
    - Request conversion / return-rate case studies from real merchants, not illustrative examples
  - - AR/VR / spatial-computing expansion
    - driver
    - current to medium term
    - Supports interactive 3D, display partnerships, and real-time asset demand
    - Request XR customer concentration and platform-partner roadmap
  - - Standard exports, plugins, and API separation
    - driver
    - current
    - Lowers switching cost from trial use to production insertion
    - Check real usage of API, DCC bridges, and export formats by paying cohort
  - - Large Chinese AI / cloud / 5G infrastructure base
    - driver
    - current
    - Makes distribution and compute-heavy experimentation easier than in thinner digital ecosystems
    - Confirm whether model inference economics benefit from domestic cloud relationships
  - - Output-quality and cleanup risk
    - constraint
    - current
    - Slows conversion from demo enthusiasm to scaled paid deployment
    - Run a benchmark against real engine, commerce, and design pipelines
  - - Market-definition dispersion
    - constraint
    - current
    - Makes valuation slides easy to overstate if broad AI numbers are used as direct TAM
    - Ask management to show serviceable market by use case, not only top-down AI charts
  - - Generative-AI data, safety, and algorithm rules
    - constraint
    - current
    - Adds compliance work for services reaching Chinese public users or handling programmable interfaces
    - Review compliance ownership for data provenance, logging, labeling, and filing obligations
  - - AI-generated-content labeling rules
    - constraint
    - current to medium term
    - Raises product and export obligations when generated content is downloaded, published, or redistributed
    - Ask how Tripo handles metadata, watermarks, and labeling across API and export flows
  notes: The key market question is not whether demand exists; it is whether Tripo can convert demand into repeat paid workflows while clearing quality and compliance hurdles.
