  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam
    missingEvidence: A clean public estimate for the specific serviceable market of AI-native 3D asset-generation workflows in China and globally.
    whyItMatters: Without a category-specific SAM, valuation work can drift into giant adjacent TAMs that do not map to what Tripo actually sells.
    diligencePath: Ask management for segmented revenue, paying-account mix, and internal market-sizing work by gaming, commerce, XR, and design use case.
    relatedQuestionRefs:
    - QM022
    - QM025
  - type: private-evidence-only
    severity: material
    topic: segment-conversion
    missingEvidence: Conversion rates, ARPA/ACV, and retention by creator, studio, API, commerce, and design segment.
    whyItMatters: The market story depends on whether Tripo is monetizing the best buyer segments or simply accumulating broad but shallow usage.
    diligencePath: Request cohort data by segment, enterprise contract count, and API consumption revenue from finance and RevOps.
    relatedQuestionRefs:
    - QM017
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: roi
    missingEvidence: Measured time-saved, cleanup-time reduction, conversion lift, or return-rate reduction from real customer deployments.
    whyItMatters: Adoption triggers are plausible, but ROI needs customer-level proof to support market capture assumptions.
    diligencePath: Request named case studies with before/after metrics for gaming, commerce, and design customers.
