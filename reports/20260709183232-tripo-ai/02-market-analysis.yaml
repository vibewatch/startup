  - - XR / AR / spatial computing
    - Real-time 3D assets, low-poly optimization, interactive content, display pipelines
    - Headset hardware sales alone, general AR ad spend
    - XR builders, spatial-content teams, hardware partners
    - Strong fit where interactive 3D and low-friction iteration are required
  - - E-commerce product visualization
    - 3D product pages, WebAR assets, catalog conversion, digital prototypes
    - Entire retail GMV, payments revenue, logistics spend
    - Merchandising, growth, digital-commerce, AR experience owners
