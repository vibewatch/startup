          value: 11
          detail: Narrower cohort that embeds Tripo into recurring technical or enterprise workflows
    approximationNotes: >-
      Values are ordinal indices showing likely narrowing stages rather than measured conversion rates; public sources
      do not disclose a true customer funnel.
