            body: >-
              The largest underwriting problem is not lack of adoption; it is lack of clarity on customer quality.
              Public sources say plenty about creators, logos, and growth, but very little about NRR, churn, contract
              length, expansion by seat or API volume, or how many millions of users ever become paying subscribers. The
              pricing ladder implies a plausible land-and-expand motion from free creator to paid pro to team or API
              usage, but the actual conversion math is absent. Independent reviews and pricing summaries strengthen the
              adverse case: the free tier is generous enough to support trial-heavy behavior, paid rights only become
              essential once commercial or private use matters, and larger seat-based plans are expensive enough that
              not every trial will broaden into a serious enterprise rollout.


              That means investors should treat the customer story as promising but not fully proven. The go-to-market
              motion appears product-led and internationally distributed, which is efficient if conversion is healthy
              and risky if it is not. Named logos help, but logo density alone is not the same as durable revenue. The
              right diligence next step is therefore to move from impressive public reach to cohort-backed revenue
              quality: conversion, renewals, usage intensity, and logo status by spend band. Until that is visible,
