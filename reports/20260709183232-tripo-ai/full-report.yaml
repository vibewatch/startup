  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Overhang
        blocks:
          - type: paragraph
            body: >-
              Tripo sits inside one of the most compliance-heavy parts of the current AI landscape: a China-linked
              generative model business with global users, downloadable outputs, and unclear training-data provenance.
              The public record already shows how much rule density the company must navigate. China’s regulatory
              environment now spans generative-AI security expectations, labeling enforcement, cybersecurity-law
              amendments, and multi-agency AI-agent guidance. Meanwhile, Tripo’s own terms and privacy policies show
              that the service sits under a formal legal framework, touches enterprise-customer data, and involves
              international data transfers. That means compliance burden is not theoretical; it sits directly in the
              customer and product surface.


              The harder legal question is IP. U.S. copyright debates are moving, but not settling, around training-data
              fair use, market harm, and output liability. Recent analyses say training may be fair use in some
              circumstances while pirated or unlicensed sourcing, or output competition with rights-holders, can still
              create liability. Because Tripo does not publish a clean provenance map for the data behind its 3D models,
              investors cannot treat training-data legality as solved. For a company whose outputs may overlap
              commercial 3D assets, that uncertainty is not a footnote—it is a central underwriting issue.
            claimRefs:
