      - number: '7.2'
        title: Geopolitics, Compute, and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Tripo’s compute risk is not abstract. U.S. trade and export-control sources make clear that advanced
              computing restrictions are aimed directly at slowing PRC access to top-end chips and related AI
              applications. Guidance already extends to entities headquartered in restricted geographies even when they
              operate elsewhere, while U.S. officials continue to frame China-linked counterparties through
              military-civil-fusion and enforcement lenses. For a compute-hungry generative-3D company, the practical
              consequence is clear: harder or slower access to the best chips can transmit into model quality, inference
              cost, product latency, and release cadence.


              The dependency story is broader than hardware. Tripo also relies on cloud delivery, plugin ecosystems, and
              downstream workflow trust. At the same time, giant platform companies are consolidating multimodal model
              catalogs, pricing flexibility, and developer tooling. Microsoft Foundry and Azure OpenAI show how
              incumbents can package frontier models, observability, and throughput pricing in ways that make point
              solutions harder to defend. OpenAI’s Sora-era model lineup reinforces the same risk from the other
              direction: Tripo does not only compete with other 3D specialists; it competes with larger model platforms
              that can win budget share before a customer even asks for a dedicated 3D vendor.
