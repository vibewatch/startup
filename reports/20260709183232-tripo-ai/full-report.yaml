  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Price Anchor and Commercial Surface
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to verify that Tripo has become a real financing story, not a rumor.
              The official June 2026 release, SaaS trade coverage, AI Weekly, and Forbes all converge on the same broad
              picture: VAST completed roughly $200 million of A+ and A++ financing, used that moment to launch a
              world-model roadmap, and was already being discussed as a unicorn. Forbes is the cleanest accessible
              valuation anchor because it ties the round to a syndicate that included INCE Capital and says one informed
              source put the company around $1.5 billion. That still leaves some ambiguity on exact post-money terms,
              but it is good enough to treat $1.5 billion as the working market price for diligence purposes.


              The commercial surface is also more real than a pure demo narrative. Tripo’s pricing page shows an
              explicit freemium funnel, then a clear step-up into paid commercial rights, higher concurrency, bulk
              export, and private models. The API page and official vertical case studies show a second monetization
              layer around developer usage, partner embeds, and studio workflows. The problem is not a lack of visible
              monetization surfaces; it is that the public file never tells investors how many of the 10 million users
              or 90,000 studio clients are actually paying, how much they spend, or whether the product generates
              software-like margins.
