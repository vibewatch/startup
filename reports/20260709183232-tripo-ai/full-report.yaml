      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Tripo's strongest public moat is not that no one else can generate a 3D object. The public record already
              disproves that. Instead, its moat looks strongest where workflow packaging, creator UX, export discipline,
              team features, and domain-specific 3D identity combine into a product that is easier to adopt than
              assembling a stack from models, repos, and general-purpose creative suites. That is real value, especially
              for gaming, XR, e-commerce, and design teams that need recurring asset throughput rather than occasional
              AI experiments.


              But the moat has visible cracks. Meshy shows that another startup can package a highly similar story with
              transparent pricing, enterprise controls, and large claimed scale. Stability shows that Tripo-originated
              research ideas can propagate into open or semi-open ecosystems. Adobe, Luma, OpenAI, and Microsoft show
              that surrounding workflow trust, safety controls, brand recognition, and bundled customer access may
              matter as much as the generator itself. Those forces point toward a likely multi-homing market structure
              in which buyers test several providers, keep manual DCC tools as fallback, and avoid deep single-vendor
              dependence unless API, workspace, asset-library, or collaboration features create real lock-in.


              The practical diligence question is therefore simple: where does Tripo already have switching costs that
              survive model commoditization? If paid revenue still depends mostly on self-serve creators chasing the
              newest model output, durability is weak. If revenue increasingly sits inside API-driven asset pipelines,
              shared workspaces, enterprise governance, and repeat vertical workflows, durability is better. Until
              management proves that transition with cohort, retention, and win-loss data, the company should be viewed
              as competitively promising but not yet securely defended.
