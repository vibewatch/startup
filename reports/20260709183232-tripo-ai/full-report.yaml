  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The first analytical discipline for Tripo is to define the market narrowly enough to be useful. Tripo is
              not selling into the whole China AI market, nor even into the whole global creator-software market. It
              sits in the AI-native 3D asset-creation workflow layer: text/image/sketch-to-3D generation,
              texture/material generation, mesh cleanup and retopology, rigging, export, API-driven ingestion, and
              creator-to-engine workflow tooling. That means its true market boundary is closer to 'software and
              services that convert creative intent into production-usable 3D assets' than to generic generative AI
              spend.


              Multiple public sizing lenses are helpful, but each answers a different question. Axis and Grand View give
              broad China AI market revenue brackets, Research and Markets frames the specific 3D-assets category
              structure, China Daily/IDC provides the immersive-computing spend lens, and Digital in Asia provides the
              consumer-demand backdrop through Chinese e-commerce and gaming. None of these should be forced into a fake
              TAM/SAM/SOM stack. Instead they create a layered boundary: very large Chinese digital and AI budgets at
              the top, a smaller immersive and gaming/e-commerce content layer below that, and an even narrower
              monetizable wedge for 3D-asset-generation workflows.


              That layering matters because it prevents the standard startup mistake of defending valuation with a
              single enormous AI slide. Tripo's opportunity is real, but it is not the full $62 billion IDC-style China
              AI market, nor the full $2.93 trillion China e-commerce market. The usable opportunity is the fraction of
              those budgets that actually requires repeat 3D asset creation, fast iteration, standard exports, and
              enough downstream trust for teams to insert AI-generated assets into real production systems.
