chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Structure, Product, and Stage
        blocks:
          - type: paragraph
            body: >-
              Tripo AI is best understood as a product brand sitting inside a broader VAST/Holymolly corporate stack
              rather than a single plainly disclosed operating company. Official terms identify Holymolly Ltd as the
              contracting entity behind tripo3d.ai and list a Hong Kong office address, while the South China Morning
              Post says the company is registered as Vast in the Cayman Islands and was set up in Beijing in 2023. CB
              Insights, by contrast, lists a Shanghai Pilot Free Trade Zone headquarters. Taken together, the public
              record supports a pragmatic diligence conclusion: Tripo AI is the customer-facing brand, VAST is the
              parent identity used in funding coverage, and the group likely uses a multi-jurisdiction structure common
              to China-linked venture-backed companies.


              The product proposition itself is unusually concrete for a young AI company. Across the homepage, pricing,
              API, and multiple product blogs, Tripo positions itself as an end-to-end 3D creation workflow that turns
              text prompts, images, multi-view inputs, and sketches into production-leaning assets in seconds. Official
              materials repeatedly emphasize not just generation but downstream asset-handling functions such as
              segmentation, rigging, animation, format conversion, low-poly optimization, and export into standard 3D
              formats. That matters because Tripo is not pitching itself as a novelty image generator; it is pitching a
              workflow replacement or acceleration layer for creators, developers, and studios that need actual mesh
              outputs.


              By run date, the business is no longer early proof-of-concept. Forbes, SCMP/Yahoo, and company materials
              all place Tripo in the post-product-market-fit, high-growth private-company category: the company has
              scaled beyond a consumer demo, sells both subscriptions and project-based enterprise work, and has already
              started reframing itself from a 3D asset generator toward a wider spatial-intelligence and world-model
              platform. The strongest caution is that this maturity story is still more operationally visible than
              institutionally visible: public product surfaces are rich, but the corporate stack and governance surface
              lag behind.
