      - number: '8.3'
        title: China AI Context and Why the Premium Still Needs Haircuts
        blocks:
          - type: paragraph
            body: >-
              There is a real bull case for paying up. Chinese AI capital markets in 2026 were willing to put
              extraordinary marks on category leaders: Moonshot raised at $20 billion, and CNBC and TechCrunch describe
              Zhipu and MiniMax public-market values that moved sharply as model releases changed sentiment. Tripo also
              has credible growth optionality. Forbes, Yahoo/SCMP, ACCESS, and the official press release together
              describe a company moving from fast user growth into broader world-model, content, and ecosystem
              ambitions. In other words, the premium narrative is not fictional. Tripo is one of the rare Chinese
              applied-AI companies with a visible consumer funnel, creator mindshare, and enterprise logos.


              But that same narrative needs disciplined haircuts. Moonshot, Zhipu, and MiniMax are closer to
              frontier-model financing stories than to a private 3D application stack. Tripo is also exposed to
              China-specific regulatory and export-control risk in a way that can hit compute costs, global enterprise
              appetite, and investor exit assumptions. CNBC’s AI-exit reporting adds a second haircut: capital is
              abundant, but liquidity is still thin and uneven. Finally, independent reviews still describe Tripo as a
              workflow accelerator that often benefits from cleanup, not a universal production replacement. Those facts
              do not kill the valuation case, but they do make it harder to justify paying a pristine frontier-AI
              multiple with no opacity discount.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
              - CV028
              - CV033
              - CV036
              - CV042
              - CV043
              - CV044
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV005
              - CV010
              - CV013
              - CV033
              - CV037
              - CV038
              - CV039
              - CV041
              - CV042
      - number: '8.4'
        title: Recommendation and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The chapter conclusion should be cautious but not dismissive. Tripo has enough product breadth, adoption
              proof, and comparable-market support to stay on an investor’s active list, and the current price is not
              obviously irrational in the way some pure-hype AI rounds are. Yet the missing denominator problem is
              decisive. Investors still cannot see ARR, paying-logo quality, cohort retention, gross margin, or the real
              preference stack behind the mark. That means the market price may be defensible, but the fair value is
              still under-proven from public evidence alone.


              That is why the supportable recommendation is Track rather than buy. The valuation stance is stretched
              rather than obviously expensive because real momentum exists and Runway-like private comps show that the
              market will sometimes pay upper-band multiples for scarce creative AI. Confidence should remain medium and
              risk high because the downside path is easy to describe: if Tripo is still well below about $100 million
              of ARR, if free-to-paid conversion is weak, or if China-related compute and compliance shocks intensify,
              the compression risk is significant. The diligence burden from here is mechanical: verify the denominator,
              inspect retention and margin quality, and understand whether the current mark is supported by economics or
              by round structure.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
