      - number: '4.4'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Tripo's public financial picture is strongest on architecture and weakest on proof. The architecture is
              sensible: low-friction acquisition, usage-linked API monetization, tiered upsell into commercial rights
              and workflow features, and a capital base that appears large enough to keep product development moving.
              That is the kind of setup one would want to see in an AI infrastructure-adjacent application company where
              model innovation and workflow packaging both matter.


              But the proof gap is large enough that investors should resist overconfidence. The company has not
              publicly shown the core numbers that determine whether its pricing surface is economically attractive:
              paid conversion, revenue concentration, realized ARPU or ARPA, gross margin after inference and support,
              enterprise retention, and cash burn. Competing platforms are also publishing accessible pricing, which
              limits the ability to infer pricing power from list prices alone.


              The practical verdict is that Tripo looks financeable, not yet fully underwritten. Public information
              supports a bullish view on capital access and a moderately positive view on monetization design. It does
              not support a precise view on efficiency, quality of revenue, or time to self-sustaining economics. Until
              management opens the books on mix, margins, and burn, the investment case remains contingent on belief in
              rapid scaling plus strong future conversion—not on demonstrated public financial performance.
