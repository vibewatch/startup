  - id: FU004
    title: Expansion loop and customer-quality gates
    type: flow
    layout: standard
    summary: >-
      Expansion only becomes durable when users move from creator excitement into commercial rights, workflow embed, and
      team adoption without unacceptable cleanup or procurement friction.
    data:
      nodes:
        - id: e1
          label: Free creator trial
          detail: Low-friction entry drives broad experimentation
        - id: e2
          label: Commercial need appears
          detail: Paid rights, privacy, or volume pushes upgrade consideration
        - id: e3
          label: Workflow embed / repeat use
          detail: Exports, plugins, or APIs become part of a real production routine
        - id: e4
          label: Team or platform adoption
          detail: Seat-based or embedded deployment expands the account
        - id: e5
          label: Renewal / retention proof
          detail: NRR, churn, and contract data would validate durability
        - id: e6
