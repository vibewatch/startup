      - number: '2.2'
        title: Buyers, Users, and Payers
        blocks:
          - type: paragraph
            body: >-
              The buyer map is one of Tripo's most attractive structural features. The product can enter through
              individuals, design teams, or technical organizations without needing a single monolithic purchaser.
              Official pricing supports individual creators and small teams through credits and subscriptions; official
              API pages and workflow pages explicitly separate a developer/API product line for higher-volume,
              integration-heavy users. That allows Tripo to address very different jobs-to-be-done: prototype a prop,
              generate a furniture asset for WebAR, spin up a room layout, automate asset ingestion into Unity or
              Unreal, or generate custom 3D elements for a studio pipeline.


              The practical segment split is clearer than the exact revenue split. Game studios and XR teams care about
              low-poly meshes, rigging, export discipline, and engine bridges. E-commerce and retail teams care about
              GLB/USDZ deployment, product-page lift, AR placement, and lower return rates. Interior and industrial
              designers care about rapid iteration and standard file exports more than they care about large-scale API
              automation. Independent creators and hobbyists care about speed, credit packs, and browser-based ease of
              use. The payer changes across each segment: creators self-serve on cards, studios use art or production
              budgets, enterprise API buyers need engineering or product infrastructure approval, and commerce teams
              often sit under merchandising, growth, or digital-experience budgets.


              That diversity is good for demand but bad for simple storytelling. A company can show many users without
              yet proving deep enterprise monetization, or show strong enterprise logos without proving standardized
              repeat budgets across segments. For Tripo, the market looks strongest where asset throughput is recurring,
              file exports matter, and labor savings are obvious—especially gaming pipelines, XR/spatial content, and
              commerce visualization. It is weaker where occasional concept art or one-off novelty assets are enough,
              because those buyers can remain free users or switch among tools cheaply.
