  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The decision path runs from a real financing mark and visible product momentum through denominator opacity and
      China-specific haircuts to a Track stance.
    data:
      nodes:
        - id: price
          label: $1.5B anchor
          detail: Credible market-price signal from June 2026 reporting
        - id: proof
          label: Real adoption proof
          detail: 10M users, 90K studio clients, named logos, pricing ladder
        - id: opacity
          label: Missing economics
          detail: ARR, retention, gross margin, and structure are undisclosed
        - id: haircut
          label: China and liquidity haircut
          detail: Regulatory, export-control, and exit risks compress supportable multiples
        - id: outcome
          label: Track
          detail: Strategically interesting, but still stretched without deeper diligence
      edges:
        - from: price
          to: proof
          label: supports further work
        - from: proof
          to: opacity
          label: offset by
        - from: opacity
          to: haircut
          label: amplifies
        - from: haircut
          to: outcome
          label: leads to
    claimRefs:
      - CV004
      - CV005
      - CV010
      - CV013
      - CV033
      - CV039
      - CV041
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      A fixed $1.5B valuation implies very different ARR thresholds depending on which multiple ultimately proves
      defensible.
    data:
      items:
        - label: 20x revenue
          value: 75
        - label: 15x revenue
          value: 100
        - label: 12x revenue
          value: 125
        - label: 10x revenue
          value: 150
        - label: 8x revenue
          value: 187.5
        - label: 6x revenue
          value: 250
      yAxis:
        label: ARR or revenue needed for $1.5B (USD M)
    approximationNotes: >-
      Values are reverse-engineered thresholds from $1.5B divided by each multiple and are scenario tools rather than
      disclosed Tripo metrics.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: The supportable multiple band narrows sharply once investors apply opacity, quality, and China-specific discounts.
    data:
      items:
        - label: Bear support band
          low: 6
          mid: 8
          high: 10
          detail: Application-software treatment with meaningful haircuts
        - label: Base support band
          low: 10
          mid: 12
          high: 15
          detail: Real growth plus private-company opacity discount
        - label: Bull support band
          low: 15
          mid: 17
          high: 20
          detail: Requires premium creative-AI scarcity and strong hidden economics
    approximationNotes: Ranges describe supportable revenue-multiple bands, not a point estimate of Tripo’s equity value.
    claimRefs:
      - CV015
      - CV023
      - CV036
      - CV041
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard across market momentum, product proof, economics visibility, risk, and valuation support.
    data:
      items:
        - label: Product momentum
          value: 8/10
          detail: Broadening from 3D generation into richer workflow and world-model narratives
        - label: Adoption proof
          value: 8/10
          detail: 10M users, 90K studio clients, and named logos are meaningful public signals
        - label: Monetization surface
          value: 7/10
          detail: Freemium, paid commercial rights, API, and enterprise workflows all exist
        - label: Economics visibility
          value: 3/10
          detail: ARR, retention, margins, and burn are still missing publicly
        - label: Competitive insulation
          value: 6/10
          detail: Specialized 3D focus helps, but large ecosystems can still crowd the space
        - label: Geopolitical resilience
          value: 3/10
          detail: China-related compute and compliance risk remains material
        - label: Evidence quality
          value: 5/10
          detail: Enough to support a working price anchor, not enough for a high-conviction underwrite
        - label: Valuation support
          value: 5/10
          detail: The price can work, but only if the hidden denominator is already meaningful
    approximationNotes: >-
      Scores are analytical judgments for investment-committee framing rather than standardized external ratings. Higher
      is better.
    claimRefs:
      - CV005
      - CV010
      - CV013
      - CV033
      - CV037
      - CV038
      - CV039
      - CV041
      - CV042
