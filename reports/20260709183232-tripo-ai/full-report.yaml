      - number: '1.4'
        title: Milestones, Technical Signals, and Adverse Considerations
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows unusually fast platform expansion. Official and semi-official sources track the
              business from a 2023 founding into 2025 product hardening and 2026 capital acceleration. By late 2025,
              Tripo was already pushing beyond raw prompt-to-model generation into texture engines, segmentation,
              rigging, format conversion, ComfyUI nodes, Blender workflows, and enterprise partnership narratives such
              as Sony’s Spatial Reality Display collaboration. The research surface also looks substantive: TripoSR,
              TripoSG, and the GitHub/open-source footprint give the company a technical-signaling advantage over many
              AI application companies that ship product without visible research artifacts.


              At the same time, the evidence set does not justify blind acceptance of every pipeline-readiness claim.
              The most useful adverse source in this chapter is the independent Medium teardown, which makes a fair
              point: 3D AI demos can look polished before export, but actual production value depends on mesh
              cleanliness, UV portability, rigging robustness, and cleanup time inside real downstream tools. That
              critique lines up with Tripo’s own heavy emphasis on segmentation, rigging, low-poly optimization, and
              export handling—features companies only stress when downstream friction is real. In other words, the
              adverse case is not that the product is fake; it is that real-world production readiness is a spectrum,
              not a binary label.


              The strategic arc is therefore credible but not fully de-risked. VAST is clearly trying to become more
              than a single asset-generation app: Project Eden and W1.0 show an ambition to climb toward world models
              and spatial simulation, while Sony and workflow-plugin partnerships show real go-to-market imagination.
              The open question for diligence is whether this pace of product and capital formation is now being matched
              by enterprise controls, governance maturity, and independently measured production performance.
