        title: People, Execution, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Execution risk at Tripo is tightly linked to people risk. Public reporting makes Simon Song the central
              founder, operator, and external storyteller, while broader succession depth remains obscure. That
              concentration may help speed, but it also increases fragility if the founder is distracted, departs, or
              cannot recruit and retain the research and infrastructure leaders needed for a frontier 3D platform. The
              wider AI market is already talent-constrained, which can be manageable for a hot startup during boom times
              and painful during any product stumble or policy squeeze.


              For investors, the important question is not whether these risks exist—they clearly do—but which ones are
              most likely to become thesis-breakers first. The highest-signal triggers are straightforward: a visible
              regulatory action, materially worse chip access, failure to convert headline scale into paying quality,
              worsening production-quality benchmarks, or leadership turnover without a visible bench. Tripo does have
              some visible mitigants—open research signaling, active shipping, partner surfaces, and creator-led
              distribution—but they are not yet strong enough to make the residual risk low. This remains a high-risk,
              high-upside operating profile that needs hard private diligence before price can be underwritten
              confidently.
