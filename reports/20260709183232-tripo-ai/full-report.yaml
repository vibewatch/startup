  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Choice Set
        blocks:
          - type: paragraph
            body: >-
              Tripo competes in more than one lane at once, which is why simplistic peer sets are misleading. For a
              buyer that wants production-usable 3D meshes, exports, low-poly optimization, and a browser-to-pipeline
              workflow, the relevant substitutes are direct AI-3D products such as Meshy and open-model stacks built
              around Stability releases. For a buyer that mainly wants campaign content, storyboard motion, or creative
              concept generation, Adobe Firefly, Luma, and OpenAI/Azure can capture budget even if they do not ship the
              same 3D mesh workflow. And for many teams the default substitute is still not another startup at all, but
              manual Blender/Maya/Substance work, outsourced studios, photogrammetry, or an internal toolchain stitched
              together with APIs and plugins.


              Public materials therefore point to a tiered competitor map. Tripo and Meshy are the clearest self-serve,
              web-first, AI-native 3D workbench substitutes: both market speed, democratization, exports, and broader
              workflow tooling rather than only a lab demo. Stability and NVIDIA matter because they can push
              high-quality 3D generation into an open or platform-amplified layer that weakens pure algorithmic moat.
              Adobe matters because it already owns large creative budgets and now bundles multiple partner models,
              commercially safe positioning, and Content Credentials. Luma and OpenAI matter because buyer attention is
              drifting toward multimodal and world-model narratives; even when they do not replace Tripo
              asset-for-asset, they can redirect both enterprise experimentation and investor framing.


              The strategic implication is that Tripo cannot evaluate competition only by asking who has the best mesh
              today. It has to win three comparisons at once: direct packaged 3D workflow versus Meshy, model/platform
              economics versus Stability-style open ecosystems, and trust-plus-distribution versus creative-suite
              incumbents. That makes the market more dangerous than a narrow startup-vs-startup comparison would
              suggest, but it also means Tripo does not need to beat Adobe or OpenAI everywhere; it needs to win clearly
              wherever production-ready 3D asset generation is the actual job to be done.
