      - number: '5.3'
        title: Model Architecture and Public Roadmap Signals
        blocks:
          - type: paragraph
            body: >-
              Tripo’s strongest technical credibility signal comes from the research layer. The TripoSG paper and
              repository lay out a real model architecture rather than vague product marketing: a large-scale
              rectified-flow transformer, hybrid VAE supervision with SDF, normal, and eikonal losses, and a 2 million
              sample image-to-SDF data pipeline. The repository also documents a 1.5B-parameter release and a
              scribble-conditioned variant, which suggests a company that is comfortable exposing at least some of its
              model lineage to the research and developer community. TripoSR complements that story from the
              reconstruction side, with a state-of-the-art single-image model that claims sub-0.5-second inference on
              A100 hardware and an MIT-licensed release co-developed with Stability AI.


              The 2026 roadmap narrative extends beyond those research artifacts. Public news and sponsored coverage
              describe P1.0 and H3.1 as more holistically spatial, more production-oriented architectures intended to
              reduce the manual editing burden that plagues many 3D generators. That does not prove the full product
              already ships every claimed capability everywhere, but it does show a coherent strategic direction: Tripo
              wants to move from “generate a mesh quickly” toward “generate a cleaner, more pipeline-usable asset and
