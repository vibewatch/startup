      - number: '2.3'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The most powerful growth driver is the ugly baseline that Tripo is trying to replace. Traditional 3D
              workflows are slow, expertise-heavy, and fragmented across modeling, UV work, texturing, retopology,
              rigging, and export. Every public Tripo workflow page leans into the same market truth: teams pay for
              shorter concept-to-asset cycles, fewer artist-hours on first-pass geometry, and easier movement into
              engines, viewers, or AR storefronts. That demand pull becomes stronger as gaming pipelines, XR content,
              digital commerce, and industrial visualization all ask for higher asset volumes than manual teams can
              produce cost-effectively.


              The second driver is workflow integration. Markets with large budgets still do not convert well for AI
              point solutions unless outputs move into real downstream systems. Tripo's official messaging around
              ComfyUI, Blender, Unity, Unreal, REST APIs, standard exports, and DCC bridges is important precisely
              because workflow depth often decides whether a pilot becomes a budget line. In market terms,
              interoperability lowers switching cost and makes the product more serviceable for teams that cannot
              tolerate orphaned assets or manual rework at every handoff.


              The biggest constraints are also clear. First, output quality still needs human validation: official pages
              emphasize segmentation, low-poly, and export handling because downstream friction remains real, and
              chapter one's adverse source shows why that matters. Second, public market-size estimates vary
              dramatically depending on whether the perimeter is narrow software revenue or broad AI-related economic
              activity, which limits the usefulness of giant TAM slides. Third, Chinese generative-AI regulation and
              labeling rules create recurring compliance work for services exposed to Chinese public users or
              cross-border data flows. The market is therefore attractive, but only for vendors that pair raw generation
              with workflow reliability, compliance discipline, and enough product depth to clear professional trust
              thresholds.
