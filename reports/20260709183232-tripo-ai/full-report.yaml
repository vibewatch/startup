  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Workflow Mix
        blocks:
          - type: paragraph
            body: >-
              Tripo’s customer map is unusually diverse for such a young company. Official material does not frame the
              product around one monolithic buyer; instead it repeatedly addresses creators, indie game developers,
              studios, product teams, architects, retailers, and film or media users. That diversity matters because it
              creates multiple entry points into the platform: an individual creator can start on a free plan, a game
              team can adopt it for rapid prototyping, an e-commerce operation can connect it to catalog workflows, and
              a platform partner can embed it through an API or workspace surface. The vertical pages for fashion AR,
              catalog scaling, film-ready previsualization, and game-rigging all reinforce the same conclusion: Tripo is
              being sold as a workflow accelerator wherever 3D asset throughput is a recurring problem.


              The flip side of this breadth is that not every user segment is equally monetizable. Creator and hobbyist
              adoption is likely plentiful because the free tier lowers friction, but enterprise-grade willingness to
              pay will concentrate where 3D assets are operationally important rather than merely decorative. Public
              use-case surfaces are therefore most convincing in gaming, commerce visualization, platform embedding,
              architecture or industrial design, and XR or spatial display. They are less convincing for deep enterprise
              stickiness because the public record says more about who can use Tripo than about which segments renew,
              expand, and pay materially over time.
