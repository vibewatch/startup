  summary: >-
    Tripo AI, the flagship product of Chinese AI startup VAST, is one of the most visible AI-native platforms for rapid
    3D asset generation. Founded in 2023 by Simon Song, an ex-SenseTime operator and MiniMax co-founder, the company has
    expanded from text- and image-to-3D generation into API, workflow, commerce, media, and world-model-adjacent
