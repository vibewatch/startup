      - number: '4.3'
        title: Unit Economics and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              The hardest part of underwriting Tripo from public information is not understanding how the product might
              make money. It is understanding how well it already does. None of the retained sources disclose revenue,
              ARR, gross margin, burn, cash balance, customer concentration, net retention, enterprise ACVs, or compute
              commitments. That forces an analyst to work from revenue mechanism instead of performance evidence. The
              good news is that the mechanism is legible: credits can map usage to billing, team plans can monetize
              collaboration and governance, and private/commercial rights can push free users toward paid tiers. The bad
              news is that legibility is not the same thing as proof.


              Public list prices are low enough that user counts alone say very little. A large base of free or
              low-spend creators could coexist with modest realized revenue. The higher-quality revenue, if it exists,
              would likely sit inside recurring team contracts, shared workspaces, API integrations, and customers whose
              pipelines repeatedly consume credits rather than browsing the free tier. That is why the unit-economics
              problem is mostly a mix problem. Without segment conversion and usage intensity, investors cannot
              distinguish hype-scale from monetization-scale.


              There is also an adverse operational angle. Independent teardown skepticism and competitive pricing
              pressure suggest Tripo still must prove that production-ready output is good enough to sustain durable
              budgets rather than repeated experimentation. If export cleanup or workflow friction remains high,
              monetization can stall even with strong top-of-funnel growth. Public evidence therefore supports a
              credible billing design, but not a public case that Tripo has already crossed from exciting adoption into
              high-quality software economics.
