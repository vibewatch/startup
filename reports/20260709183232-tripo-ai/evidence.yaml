evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, board observer rights, and executive org chart.
    whyItMatters: >-
      A fast-rising valuation with a founder-centric public surface creates real governance and key-person risk if
      oversight is weak.
    diligencePath: Request a current board deck, cap table with governance rights, and executive org chart directly from management.
    relatedQuestionRefs:
      - QO013
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: >-
      Authoritative legal-entity map tying Holymolly Ltd, VAST Cayman registration, mainland China operating entities,
      and any Shanghai or Hong Kong affiliates together.
    whyItMatters: Entity-stack ambiguity affects contracting risk, IP ownership, capital structure, and regulatory exposure.
    diligencePath: >-
      Request certificates of incorporation, SAFE/VIE or offshore-holding documents, and a current legal-entity chart
      from counsel.
    relatedQuestionRefs:
      - QO001
      - QO002
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      Audited or board-reported definitions for users, creators, developers, studios, enterprise customers, and paying
      accounts.
    whyItMatters: >-
      Public scale claims drive valuation narrative, but conflicting numerators can distort customer quality and
      monetization assumptions.
    diligencePath: Request a board KPI pack showing MAU, WAU, paying accounts, enterprise logos, and cohort definitions by month.
    relatedQuestionRefs:
      - QO011
      - QO021
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, burn, runway, and headcount by function.
    whyItMatters: >-
      The company-overview chapter can show momentum but cannot underwrite unit economics or capital adequacy without
      core financials.
    diligencePath: Request a 12-month P&L, ARR bridge, burn/runway schedule, and current employee census by department.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership-bench
    missingEvidence: Named leaders for finance, security, compliance, sales, and product operations beyond Simon Song.
    whyItMatters: Broader bench quality helps investors judge whether execution can scale with the product and capital base.
    diligencePath: Review company leadership page or ask management for an executive roster and succession plan.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: TO004-milestone-coverage
    missingEvidence: >-
      Exact close dates, board approvals, and product-general-availability dates for several milestone entries that are
      only supportable to month or year precision in public sources.
    whyItMatters: >-
      The milestone table is directionally strong, but finer chronology matters when investors reconstruct execution
      speed, financing cadence, and control events.
    diligencePath: >-
      Request the internal launch timeline, signed financing close notices, and board-approved milestone tracker from
      management.
    relatedQuestionRefs:
      - QO003
      - QO008
      - QO015
      - QO019
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam
    missingEvidence: >-
      A clean public estimate for the specific serviceable market of AI-native 3D asset-generation workflows in China
      and globally.
    whyItMatters: >-
      Without a category-specific SAM, valuation work can drift into giant adjacent TAMs that do not map to what Tripo
      actually sells.
    diligencePath: >-
      Ask management for segmented revenue, paying-account mix, and internal market-sizing work by gaming, commerce, XR,
      and design use case.
    relatedQuestionRefs:
      - QM022
      - QM025
