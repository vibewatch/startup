    topic: round-structure
    missingEvidence: Liquidation preferences, ratchets, pro rata rights, employee-secondary terms, and any structure that makes the headline price diverge from common-equity value.
    whyItMatters: A reported $1.5B valuation can overstate fair value if the round is heavily structured or if downside protection is unusually investor-friendly.
    diligencePath: Review financing documents, cap-table history, and the official valuation memo with counsel.
