- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR denominator disappointment
    - Verified ARR is materially below ~$75M-$100M
    - Current premium narrative loses its cleanest support band immediately.
    - Step down to avoid / pass unless price resets.
  - - Weak paid conversion
    - Large user base converts poorly into paying cohorts or enterprise ACV
    - 10M users becomes a vanity metric rather than valuation support.
    - Demand full cohort data before underwriting.
  - - Gross-margin or inference-cost weakness
    - High compute cost keeps margins well below software-quality levels
    - AI-native premium compresses because revenue quality is weak.
    - Require margin bridge and supplier concentration review.
  - - China regulatory or export-control shock
    - Compute access tightens or cross-border commercialization becomes harder
    - Multiple contraction can happen without customer demand collapsing.
    - Increase discount rate or pause underwriting.
  - - Structured-round overhang
    - Preference stack or side terms prop up headline price
    - Reported valuation stops being a reliable fair-value anchor.
    - Re-cut return math on a common-equity-equivalent basis.
  notes: These triggers are monitorable and designed to break the thesis mechanically rather than emotionally.
