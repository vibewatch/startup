- id: china-ai-context-and-haircuts
  title: China AI Context and Why the Premium Still Needs Haircuts
  body: |-
    There is a real bull case for paying up. Chinese AI capital markets in 2026 were willing to put extraordinary marks on category leaders: Moonshot raised at $20 billion, and CNBC and TechCrunch describe Zhipu and MiniMax public-market values that moved sharply as model releases changed sentiment. Tripo also has credible growth optionality. Forbes, Yahoo/SCMP, ACCESS, and the official press release together describe a company moving from fast user growth into broader world-model, content, and ecosystem ambitions. In other words, the premium narrative is not fictional. Tripo is one of the rare Chinese applied-AI companies with a visible consumer funnel, creator mindshare, and enterprise logos.

    But that same narrative needs disciplined haircuts. Moonshot, Zhipu, and MiniMax are closer to frontier-model financing stories than to a private 3D application stack. Tripo is also exposed to China-specific regulatory and export-control risk in a way that can hit compute costs, global enterprise appetite, and investor exit assumptions. CNBC’s AI-exit reporting adds a second haircut: capital is abundant, but liquidity is still thin and uneven. Finally, independent reviews still describe Tripo as a workflow accelerator that often benefits from cleanup, not a universal production replacement. Those facts do not kill the valuation case, but they do make it harder to justify paying a pristine frontier-AI multiple with no opacity discount.
