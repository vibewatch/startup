- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue denominator
    - ARR, monthly recurring revenue, recognized revenue, and last-twelve-month revenue bridge
    - This is the single gating variable behind whether $1.5B is fair, stretched, or expensive.
    - Management data room and board KPI pack
  - - Retention and expansion
    - NRR, GRR, cohort retention, enterprise renewal, and seat or usage expansion curves
    - Premium multiples depend on durable expansion, not just logo accumulation.
    - Finance and GTM diligence
  - - Margin quality
    - Gross margin by product, inference cost per generated asset, and cloud or GPU concentration
    - AI-native multiples compress quickly when cost of revenue is heavy.
    - Engineering plus finance diligence
  - - Cap table and round structure
    - Preference stack, liquidation preferences, ratchets, employee secondary terms, and dilution history
    - Headline price may not equal common-equity value.
    - Legal counsel and financing memo review
  - - Customer quality
    - Named paying logos, ACV bands, share of revenue from enterprise, and free-to-paid conversion
    - 10M users is only investable if revenue quality is strong underneath it.
    - Sales ops, product analytics, and customer reference checks
  notes: These asks close the exact gaps that block a higher-conviction recommendation today.
