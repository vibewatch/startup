- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Supportable multiple band
  - ARR or revenue needed for $1.5B
  - What must be true
  - What breaks it
  rows:
  - - Bull
    - 15x-20x
    - $75M-$100M
    - Tripo already has premium-scale ARR, strong retention, high-margin software economics, and genuine scarcity in 3D generative workflows.
    - The hidden denominator proves smaller or the world-model narrative does not monetize.
  - - Base
    - 10x-12x
    - $125M-$150M
    - Adoption is real, but investors still apply a private-company opacity and China-risk discount.
    - Enterprise mix, margins, or retention are materially weaker than the narrative implies.
  - - Bear
    - 8x-10x
    - $150M-$187.5M
    - The market treats Tripo closer to contested application software with meaningful regulatory and liquidity haircuts.
    - Free-to-paid conversion or compute costs deteriorate enough to undermine efficient growth.
  notes: Reverse-engineered thresholds are more defensible here than a false-precision DCF because public revenue is undisclosed.
