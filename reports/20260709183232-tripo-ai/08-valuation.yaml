  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-denominator
    missingEvidence: ARR, monthly recurring revenue, recognized revenue, and a quarterly bridge showing how much of the 10M-user and 90K-client base is monetized.
    whyItMatters: The current valuation cannot be cleanly judged without knowing whether Tripo is closer to $50M, $100M, or $150M+ of ARR.
    diligencePath: Request board KPI definitions, monthly ARR bridge, segment mix, and active paying-account counts by product surface.
    relatedQuestionRefs:
