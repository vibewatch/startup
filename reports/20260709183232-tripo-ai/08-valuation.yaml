- id: TV004
  title: Comparable valuation table
  columns:
  - Reference
  - Type
  - Current or public status
  - Why relevant
  - Limitation
  rows:
  - - Adobe
    - Public comp
    - ~$88.5B market cap and ~$24.45B TTM revenue in July 2026
    - Shows what scaled creative-software disclosure and monetization look like in public markets.
    - Far larger, more diversified, and not a frontier AI startup.
  - - Roblox
    - Public comp
    - ~$40.38B market cap and ~$5.29B TTM revenue in July 2026
    - Useful for creator-economy, UGC, and 3D ecosystem context.
    - Platform economics differ materially from Tripo’s software stack.
  - - Unity
    - Public comp
    - ~$13.4B market cap and ~$1.92B TTM revenue in July 2026
    - Relevant to engine-adjacent 3D workflow infrastructure.
    - Unity is a mature public platform with different monetization and cost structure.
  - - Runway
    - Private creative-AI comp
    - $5.3B valuation in Feb 2026; previously discussed ~$300M annualized revenue goal
    - Best private comp for premium creative AI with world-model adjacency.
    - Revenue denominator is not audited public disclosure.
  - - Moonshot / MiniMax / Zhipu
    - China AI sentiment comps
    - $20B private mark for Moonshot and $13B-$55.9B public values for peers in 2026 reporting
    - Shows that China AI winners could re-rate dramatically in 2026.
    - Frontier-model labs and public stocks are structurally different from private 3D application software.
  - - 2026 software multiple benchmarks
    - Analyst market lens
    - AI-native SaaS often cited around 8x-15x ARR, faster growers higher
    - Helps translate Tripo’s hidden denominator into supportable multiple bands.
    - Benchmark ranges do not solve Tripo’s missing disclosure.
  enumerationScope:
    coverage: partial
    basis: Selected rows cover the main public, private, China-AI, and benchmark references that matter for this chapter instead of pretending that an exhaustive peer set would be more precise.
  notes: The comp set is meant to set plausible boundary conditions, not to produce a mechanically exact fair value.
