    severity: material
    topic: retention-and-margin-quality
    missingEvidence: NRR, GRR, logo retention, usage retention, gross margin, inference cost per asset, and CAC payback by segment.
    whyItMatters: AI-native multiples only hold when growth quality and cost structure look like durable software rather than expensive experimentation.
    diligencePath: Request finance dashboards, cohort analyses, gross-margin bridge, and cloud or GPU supplier concentration data.
