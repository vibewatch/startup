- id: recommendation-and-final-diligence-asks
  title: Recommendation and Final Diligence Asks
  body: |-
    The chapter conclusion should be cautious but not dismissive. Tripo has enough product breadth, adoption proof, and comparable-market support to stay on an investor’s active list, and the current price is not obviously irrational in the way some pure-hype AI rounds are. Yet the missing denominator problem is decisive. Investors still cannot see ARR, paying-logo quality, cohort retention, gross margin, or the real preference stack behind the mark. That means the market price may be defensible, but the fair value is still under-proven from public evidence alone.

    That is why the supportable recommendation is Track rather than buy. The valuation stance is stretched rather than obviously expensive because real momentum exists and Runway-like private comps show that the market will sometimes pay upper-band multiples for scarce creative AI. Confidence should remain medium and risk high because the downside path is easy to describe: if Tripo is still well below about $100 million of ARR, if free-to-paid conversion is weak, or if China-related compute and compliance shocks intensify, the compression risk is significant. The diligence burden from here is mechanical: verify the denominator, inspect retention and margin quality, and understand whether the current mark is supported by economics or by round structure.
