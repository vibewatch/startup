- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Adoption
    - 10M users, 90K studio clients, and named logos imply real product-market pull.
    - Those counts do not disclose how many users are paying or how much revenue they generate.
    - Paid-account cohorts and segment-level ARR by plan
  - - Monetization
    - Freemium plus API plus enterprise workflow packaging creates multiple revenue surfaces.
    - A broad surface can still mask weak conversion or heavy discounting.
    - Realized ACV bands, ARPA, and conversion funnels
  - - Category premium
    - Creative AI and world-model-adjacent assets can still command premium private multiples.
    - Premium multiples compress quickly when growth quality or liquidity support weakens.
    - Verified growth quality and evidence of durable exit appetite
  - - Competitive position
    - Tripo has momentum in a niche where speed, 3D specialization, and integrations matter.
    - Adobe, Roblox ecosystems, Unity tooling, and new AI entrants limit scarcity over time.
    - Win-loss data and renewal proof against alternatives
  - - China context
    - Domestic capital has repriced Chinese AI winners aggressively in 2026.
    - China domicile also adds export-control, compliance, and geopolitical discounts.
    - A credible compute and compliance contingency plan
  notes: The anti-thesis is primarily about valuation support and evidence quality, not about whether Tripo has built something useful.
