- id: comparable-context-and-reverse-math
  title: Comparable Context and Reverse-Math Discipline
  body: |-
    The most honest way to assess Tripo’s valuation is to start with market context and then reverse-engineer the revenue denominator the company would need. Multiples.vc and Acquiry both argue that 2026 software multiples remain bifurcated: AI-native assets can still clear a real premium, but buyers are discriminating heavily on growth quality, retention, and profitability. Public creative and 3D-adjacent comps keep that point grounded. Adobe screens around 3.6x current revenue on a market-cap basis, while Roblox and Unity sit closer to 7x to 8x. Those are imperfect peers, but they provide a useful public-market fence line for creative software, creator ecosystems, and 3D workflow infrastructure.

    The private frontier-AI comp that matters most is Runway. TechCrunch reported both the company’s 2025 annualized-revenue aspiration of $300 million and its 2026 $5.3 billion valuation. That is not a clean apples-to-apples multiple because the denominator is a target rather than an audited figure, but it does show that investors will sometimes pay an upper-teens multiple for scarce creative AI with world-model adjacency. On that lens, Tripo’s $1.5 billion does not look absurd. It does, however, require a meaningful hidden revenue base: about $75 million at 20x, $100 million at 15x, $125 million at 12x, and $150 million at 10x. Without disclosure, that denominator is still guesswork.
