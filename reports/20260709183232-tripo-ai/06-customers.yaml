  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paying-conversion
    missingEvidence: Paying subscriber counts, API-paying accounts, active enterprise contract counts, and conversion funnels from free users to paid cohorts.
    whyItMatters: Large topline user counts are far less informative without knowing how many accounts convert into durable revenue.
    diligencePath: Request cohort data for free-to-paid conversion, ARPA by plan, API-paying accounts, and active enterprise logos by month.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU023
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal rates, contract lengths, cohort curves, and seat-expansion data.
    whyItMatters: Durability determines whether Tripo is building a sticky platform or a trial-heavy prototyping tool with high drop-off.
    diligencePath: Request retention dashboards by plan and segment, plus enterprise renewal reports and seat-expansion cohorts.
    relatedQuestionRefs:
    - QU018
    - QU024
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: material
    topic: definition-drift
    missingEvidence: One canonical definitions sheet for creators, developers, studio clients, enterprise customers, and corporate partners.
    whyItMatters: Conflicting denominators make it too easy to overstate customer quality or progress toward enterprise monetization.
    diligencePath: Request board KPI definitions and a time series showing each metric with exact inclusion criteria.
    relatedQuestionRefs:
    - QU019
    - QU024
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: named-logo-quality
    missingEvidence: Clear production-versus-pilot status, paid-vs-unpaid status, ACV, and outcome detail for each named logo.
    whyItMatters: Public logo density is only investable if investors know which logos are active paying deployments rather than pilots or marketing references.
    diligencePath: Ask management for a logo list with status, spend band, use case, and renewal history.
    relatedQuestionRefs:
    - QU020
    - QU024
    relatedTableRefs:
    - TU003
