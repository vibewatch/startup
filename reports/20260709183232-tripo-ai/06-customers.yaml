- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Free → Pro → Max / Team packaging
    - Large free cohort may never convert
    - Can produce impressive user counts with thinner monetization than headline adoption suggests
    - Request funnel and ARPA by plan
  - - Creator → studio workflow depth
    - Power users may adopt without org-wide seat expansion
    - Revenue quality could lag technical engagement
    - Ask for seat-growth cohorts and studio expansion patterns
  - - API / platform embedding
    - A few platform deals could carry outsized strategic weight
    - Partner concentration may create channel risk if one workflow changes
    - Review top platform accounts and pipeline dependence
  - - International user concentration
    - Most users reportedly sit outside China, but regional revenue mix is opaque
    - Paying demand may be narrower than global usage breadth implies
    - Request revenue mix by geography and local compliance / support model
  - - Named-logo marketing density
    - Logos may mix pilots, partners, and reference users
    - Investors can over-read customer quality from brand names alone
    - Request status, spend band, and renewal date for each named logo
  - - Lean direct-sales surface
    - Product-led efficiency is attractive but may under-serve large enterprises
    - Can slow deeper penetration into procurement-heavy customers
    - Request enterprise-sales headcount, conversion rates, and implementation support data
  notes: The key customer risk is not lack of demand but unclear conversion and expansion quality inside a very broad top-of-funnel base.
