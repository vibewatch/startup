- id: adoption-trajectory-and-geography
  title: Adoption Trajectory and Geographic Footprint
  body: 'The public adoption trajectory is strong even after adjusting for noisy denominators. Multiple 2025 and 2026 sources place Tripo far beyond a niche developer toy: user counts move from roughly 3 million in late summer 2025 to 6.5 million by late 2025 and then to 10 million individual users in one 2026 source, while related sources cite 35,000 active developers, 40,000 studios or corporate partners, 90,000 developers, or 90,000 studio clients. These figures cannot be merged into one clean KPI because they are clearly measuring different populations, but they do support a robust directional conclusion that Tripo has built global distribution at uncommon speed.


    The geographic pattern is also notable. Yahoo-syndicated SCMP reporting says more than 85% of users sit outside China, with Europe and the United States as the biggest markets, while Forbes adds Japan and Korea to the concentration list. That matters because it suggests Tripo’s growth is not only a China-AI story. At the same time, this global footprint does not yet tell investors where paying revenue actually sits. Without a board-level definitions sheet and regional revenue split, the public adoption story remains impressive but only partially investment-grade.'
  claimRefs:
  - CU013
  - CU014
  - CU017
  - CU018
