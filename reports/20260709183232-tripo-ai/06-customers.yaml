tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Revenue or strategic value
  - Gap
  rows:
  - - Individual creators / hobbyists
    - User and payer often the same individual
    - Rapid concepting, asset generation, experimentation
    - Millions of users across 2025-2026 sources
    - Massive top-of-funnel and community growth engine
    - Paying conversion rate is unknown
  - - Game developers / studios
    - Artists, technical artists, producers, indie founders
    - Prototype props, rigged characters, engine-ready assets
    - Official game-dev content plus NetEase proof and survey framing
    - Likely one of the most monetizable recurring asset-creation segments
    - Need ACV, deployment depth, and repeat-usage data
  - - E-commerce / retail teams
    - Merchandising, product, growth, or engineering teams
    - Product visualization, AR try-on, large-SKU 3D catalogs
    - Multiple official commerce vertical pages and product-prototyping guides
    - Could produce high-volume API or batch-workflow demand
    - Outcome metrics and live customer names are thin
  - - Architecture / industrial design
    - Design specialists, architects, project teams
    - Sketch-to-3D, client iteration, design previews
    - Dewan guest piece and architecture guide
    - High-value workflows if precision is good enough
    - Named paying customers and accuracy benchmarks are missing
  - - Platform / API integrators
    - Developer teams and platform operators
    - Embed 3D generation into catalogs, tools, or workspaces
    - ComfyUI docs, SDKs, PIM-oriented API pages, Replit references
    - Important for scalable distribution and stickier technical adoption
    - Public usage volumes and contract quality are undisclosed
  - - XR / spatial / media users
    - Hardware, media, and spatial-experience teams
    - Spatial display, previsualization, digital twins, interactive content
    - Sony Spatial Reality and media-production pages
    - Strategic proof that Tripo is not limited to toy creator use
    - Production scale and spend remain unclear
  notes: Segment labels blend official use-case pages with third-party coverage; they show who Tripo can reach, not audited revenue mix by cohort.
