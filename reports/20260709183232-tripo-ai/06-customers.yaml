- id: named-customer-proof-and-developer-signals
  title: Named Customer Proof and Developer Signals
  body: 'Named-logo proof exists, but it is uneven in quality. Sony, NetEase, MakerWorld or Bambu Lab, and Replit are the strongest public examples because they either appear across multiple independent sources or have an official workflow page that explains how the relationship works. NetEase is especially useful because KR Asia specifically says Tripo was used in Where Winds Meet, moving the evidence from generic logo-dropping toward documented downstream usage. Sony’s public partnership page is also important because it links Tripo to a specific workflow environment—Spatial Reality Display—and to industry settings such as retail, education, and digital twins.


    Developer signals reinforce the same story from another angle. ComfyUI’s official partner docs, the Tripo SDK, and the GitHub footprints around TripoSR and ComfyUI-Tripo show that technical users are not just passively observing the product; they are integrating it into toolchains. This matters because a 3D-AI company can show viral creator adoption without becoming operationally important. Tripo’s public developer and partner surfaces make a stronger case that at least part of the customer base is using the system inside real workflows. The remaining gap is commercial specificity: public sources still do not clearly separate paid production customers from pilots, partnerships, and reference users.'
