companyProfile:
  summary: >-
    Tripo AI, the flagship product of Chinese AI startup VAST, is one of the most visible
    AI-native platforms for rapid 3D asset generation. Founded in 2023 by Simon Song,
    an ex-SenseTime operator and MiniMax co-founder, the company has expanded from text-
    and image-to-3D generation into API, workflow, commerce, media, and world-model-adjacent
    surfaces. Public reporting ties VAST to a March 2026 round led by Alibaba and a much larger
    June 2026 A+ / A++ financing that put the company into unicorn territory, with one informed
    source cited by Forbes placing the valuation around $1.5B. Public adoption signals are strong,
    including 10M users and 90K studio clients, but the economics behind those claims remain private.
  foundedDate: '2023-01-01'
  founders:
    - name: Simon Song
      role: CEO and Founder
      background: >-
        Former SenseTime operator and MiniMax co-founder with a public founder narrative rooted
        in gaming, generative AI, and creator tooling.
      claimRefs: [CO008, CO010, CO011]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Tripo3D.ai platform for text-to-3D and image-to-3D asset generation; developer API;
    workflow tooling for gaming, ecommerce, and media production; and Project Eden,
    a world-model research initiative introduced alongside the June 2026 financing.
  customerFocus: >-
    Game developers, XR and media teams, ecommerce and catalog operators, industrial or creative
    designers, and individual creators globally, with meaningful usage outside China but public
    revenue mix still undisclosed.
  businessModel: >-
    Freemium self-serve subscriptions with paid commercial rights, higher-concurrency creator or studio tiers,
    plus developer API and enterprise workflow monetization.
  stage: Series A+
  fundingStatus: >-
