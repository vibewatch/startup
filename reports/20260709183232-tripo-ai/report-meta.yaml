  topStrengths:
    - Tripo has real product breadth across creator UI, paid workflow tooling, API, and partner integrations rather than a single demo feature.
    - Public adoption signals are unusually strong for a young 3D AI company, with 10M users and 90K studio clients claimed by mid-2026.
    - Private creative-AI comps such as Runway show that premium multiples are possible when scarcity and momentum are genuine.
  topRisks:
    - Public sources still do not disclose ARR, retention, gross margin, or paid conversion, making the $1.5B mark hard to underwrite.
    - China-linked export-control, compute-access, and generative-AI compliance risks can compress valuation support even if demand stays strong.
    - Independent reviews still frame Tripo as a fast workflow accelerator that may need cleanup rather than a universal production-ready replacement.
  unresolvedGaps:
    - Verified ARR, recognized revenue, gross margin, and free-to-paid conversion by plan or cohort.
    - Enterprise logo quality, ACV bands, renewal behavior, and concentration across named customers.
    - Cap-table mechanics, preference terms, and any structure that may make headline valuation differ from common-equity value.
disclaimer: >-
  This report is for informational purposes only, is based on public sources as of 2026-07-09,
  and is not investment advice. Tripo AI / VAST is a private company and many underwriting-critical
