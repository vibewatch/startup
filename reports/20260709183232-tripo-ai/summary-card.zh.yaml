  topStrengths:
    - Tripo 的产品宽度真实，覆盖创作者 UI、付费工作流工具、API 和伙伴集成，不只是单一 demo 功能。
    - 对一家年轻 3D AI 公司来说，公开采用信号异常强：到 mid-2026，公司声称已有 10M 用户和 90K studio 客户。
