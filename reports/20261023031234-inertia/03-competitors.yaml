callouts:
  - calloutType: strength
    title: Institutional access is the clearest differentiator
    body: "The LLNL collaboration combines laser development, target design, and target fabrication work, giving Inertia a differentiated route to scarce expertise and infrastructure."
    claimRefs: [CP006, CP010]
  - calloutType: risk
    title: Technical proof is still far from commercial proof
    body: "The same evidence that supports Inertia's NIF lineage describes the need for repeated operation several times per second and continued laser and target industrialization."
    claimRefs: [CP003, CP011]
  - calloutType: assumption
    title: Funding is not available cash or customer traction
    body: "Peer funding, valuation, and financing tranches are retained as capital-market signals only; they do not establish cash available, runway, revenue, or realized power pricing."
    claimRefs: [CP007, CP008, CP013]

