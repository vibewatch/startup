company:
  name: Inertia
chapter:
  number: 8
  title: Valuation
  summary: Inertia has unusually strong scientific and strategic starting assets, but public evidence supports a research-more recommendation rather than a price-supported investment call. The disclosed $450 million Series A funds a technically ambitious path whose capital needs, commercialization milestones, customer economics, and post-money terms remain unavailable.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The positive case is that Inertia is commercializing an approach with a documented
      scientific milestone, an experienced founding team, and an unusually deep laboratory
      partnership. The company's own financing announcement says the Series A is milestone-based
      and intended to fund a high-power laser and target manufacturing, while independent coverage
      describes the technical gap between NIF breakeven and a grid-scale plant. The anti-thesis is
      equally material: the disclosed program is still pre-commercial, the public record does not
      disclose revenue, customers, plant economics, ownership, liquidation preferences, or a
      post-money valuation, and the industry itself reports that most fusion companies still see
      investment as a major challenge. Rising electricity demand from AI and data centres is a
      market-level tailwind, but it is not customer proof for Inertia. Therefore the evidence
      supports strategic optionality, not a conventional growth-company underwriting.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV014]
    tableRefs: [TV001, TV002]
  - id: scenarios-and-price
    title: Scenarios and entry discipline
    body: >-
      A scenario framework is more defensible than a point estimate. The bull case requires
      successful scale-up from ignition physics to repeatable laser operation, low-cost target
      production, regulatory and siting progress, and credible utility or industrial offtake.
      The base case assumes technical progress but continued financing and schedule uncertainty.
      The bear case is a capital-intensive program that reaches further milestones without proving
      commercial cadence, forcing a down-round or a longer private funding cycle. The disclosed
      $450 million should be treated as funding raised, not cash available for plant construction,
      and no public source establishes valuation or investor economics. Proposed reverse-merger
      marks reported for General Fusion and TAE span $1 billion to $6 billion, illustrating that
      transaction structure and technical maturity prevent a simple read-across. Entry should
      therefore be contingent on receiving cap-table terms, a milestone budget, target cost data,
      runway, and independently testable commercial milestones.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-decision
    title: Decision, exit readiness, and diligence
    body: >-
      The current decision is research-more with low confidence in the valuation stance and high
      execution risk. That is not a judgment that the science is weak; it is a judgment that public
      evidence does not connect the science to a priced equity return. The DOE roadmap frames
      commercialization as a set of infrastructure, supply-chain, workforce, and cost-competitive
      power challenges, while the LLNL arrangement provides capability and access rather than
      proof of revenue or plant economics. Before an investment decision, diligence should verify
      financing terms, remaining runway, milestone definitions, laser and target manufacturing
      yields, regulatory pathway, plant site, offtake, insurance, IP licenses, and the triggers for
      the next round. A thesis break occurs if milestones slip without revised financing, if target
      costs or repetition rates fail, or if customer and permitting evidence remain absent as the
      2030 construction ambition approaches.
    claimRefs: [CV011, CV012, CV013, CV015]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a priced entry from public evidence]
      - [Confidence, low, Key financing and commercialization inputs are undisclosed]
      - [Risk rating, high, Technical scale-up and capital intensity dominate downside]
      - [Valuation stance, unknown, Require post-money valuation and preference terms]
    notes: "Assessment synthesizes disclosed financing, technical milestones, industry funding constraints, and identified evidence gaps; unknown is not an estimate."
    claimRefs: [CV001, CV007, CV011, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - ["Scientific foundation", "NIF achieved target-energy breakeven and Inertia is built around that work", "Repeated integrated net-energy and engineering results at commercial cadence"]
      - ["Strategic access", "LLNL partnership includes a CRADA and two Strategic Partnership Projects", "Binding delivery milestones and independently verifiable industrial outputs"]
      - ["Capital availability", "$450 million Series A disclosed", "Audited runway and a budget showing sufficient capital for the next technical gate"]
      - ["Commercial demand", "No public customer contracts or offtake economics located", "Signed offtake or buyer diligence with price and volume terms"]
    notes: "Rows separate company or partner announcements from independent validation; absence of public disclosure is an evidence gap, not proof that no contract exists."
    claimRefs: [CV001, CV002, CV003, CV004, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "Laser repetition and target manufacturing scale; plant path and offtake become credible", "Strategic value can support a premium only after milestones and terms are verified", "Low-to-medium", "Missed technical gates or inability to finance the next stage"]
      - ["Base", "Scientific progress continues but plant economics and commercial cadence remain unproven", "No defensible public multiple; hold optionality rather than assign a point value", "Medium", "Additional rounds fund research without integrated plant evidence"]
      - ["Bear", "Capital intensity and long timelines produce dilution or down-round pressure", "Investor return is impaired by dilution, delay, or preference overhang", "Medium-to-high", "No repeatable output, regulatory delay, or absent buyers"]
      - ["Research-more gate", "Terms, runway, cost curve, and milestones are obtained in diligence", "Re-rate only when price and evidence become jointly testable", "High priority", "Any material input remains unavailable at entry"]
    notes: "Scenarios are qualitative because no public valuation, revenue, margin, cash runway, cap table, or target-cost curve was disclosed; funding raised is not cash available."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV012, CV016]

