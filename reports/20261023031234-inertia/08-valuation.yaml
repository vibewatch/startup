callouts:
  - calloutType: recommendation
    title: Decision
    body: "Research-more: the evidence supports a technically differentiated option, but not a price-sensitive buy decision."
    claimRefs: [CV007, CV011, CV012]
  - calloutType: risk
    title: Thesis-break trigger
    body: "Treat missed scale-up milestones, financing stress, or continued absence of customers and permitting evidence as thesis-breaking until independently resolved."
    claimRefs: [CV008, CV009, CV015]

