evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Post-money valuation, capitalization table, liquidation preferences, debt, cash balance, burn, runway, and
      milestone-release terms.
    whyItMatters: The financing size cannot be translated into ownership, dilution, or solvency without terms and cash-use evidence.
    diligencePath: Obtain the signed financing documents, current cap table, board materials, and a 24-month cash forecast.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: >-
      Verified customer agreements, revenue recognition, headcount, production capacity, target cost, plant siting, and
      permitting milestones.
    whyItMatters: Technical pedigree and funding do not establish commercial traction or an investable plant-economics case.
    diligencePath: >-
      Request customer pipeline evidence, audited or management financials, organization chart, technical milestone
      dashboard, and permitting plan.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete executive, board, and governance roster.
    whyItMatters: Key-person and control risks cannot be fully assessed from four publicly named individuals.
    diligencePath: Request the current organization chart, board composition, reserved matters, and succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: breakeven
    missingEvidence: Integrated evidence that connects target gain to whole-facility net electricity and repeatable operating cadence.
    whyItMatters: Scientific breakeven is materially different from commercial breakeven and can otherwise overstate readiness.
    diligencePath: >-
      Request independently reviewed energy-balance tests, repetition-rate data, target yield, and plant-level
      engineering assumptions.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: addressable-market
    missingEvidence: >-
      Inertia-specific plant capacity, target geography, buyer pipeline, contracted price, project count, win
      assumptions, and delivery schedule needed for TAM/SAM/SOM.
    whyItMatters: >-
      Without company-specific capacity, price, timing, and obtainable-project assumptions, a precise addressable market
      or market share would be invented.
    diligencePath: >-
      Obtain the commercial model, pipeline by stage, buyer interviews, site shortlist, and board-approved deployment
      plan; reconcile each scenario to plant output and pricing.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: plant-economics
    missingEvidence: >-
      Plant capex, target cost and cadence, laser wall-plug efficiency, conversion efficiency, component life,
      availability, fuel-cycle inventory, and delivered-cost model.
    whyItMatters: These inputs determine whether scientific performance can translate into financeable and competitive electricity.
    diligencePath: >-
      Review the integrated techno-economic model, vendor quotations, reliability model, target-production plan, and
      independent engineering assessment.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: customer-demand
    missingEvidence: >-
      Inertia customer contracts, letters of intent, utility interconnection work, site control, or buyer-validated
      willingness to pay.
    whyItMatters: Peer offtake supports category demand but cannot establish demand, bankability, or obtainable share for Inertia.
    diligencePath: >-
      Request executed commercial documents and interview named utilities, hyperscalers, project financiers, and grid
      counterparties under NDA.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: conflicting-data
    severity: minor
    topic: sector-financing
    missingEvidence: >-
      A harmonized time series reconciling the F4E €9.9B global dataset at 10 June 2025 with DOE's >$10B U.S.
      private-investment statement in June 2026.
    whyItMatters: >-
      Scope, geography, currency, cutoff, and funding classifications differ, so the figures cannot support an implied
      growth rate.
    diligencePath: >-
      Acquire the underlying transaction-level datasets and normalize currency, geography, funding type, announcement
      date, and duplicate rounds.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable customer tariffs, power-purchase agreements, contract structures, and realized pricing for Inertia and
      its closest fusion alternatives.
    whyItMatters: >-
      Without buyer economics, technical differentiation cannot be translated into switching value, market share, or a
      price-to-beat.
    diligencePath: Obtain signed or redacted customer contracts, utility procurement terms, and a geography-specific grid tariff set.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: permitting-and-deployment
    missingEvidence: >-
      Primary permitting, plant-siting, repeat-shot, and commercial-availability milestones for Inertia and peer
      demonstrations.
    whyItMatters: >-
      Commercial fusion competition is determined by deployable, repeatable power rather than laboratory or component
      milestones.
    diligencePath: >-
      Request milestone schedules, regulator correspondence, site-control evidence, and independently witnessed
      operating data.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: access-blocked
    severity: material
    topic: assigned-pool-access
    missingEvidence: Readable text from the assigned Independent News URL and the assigned Enlit/IEA URL.
    whyItMatters: >-
      The assigned pool reports successful fetch status for two URLs whose fetched text is only a location-form shell or
      a title, so they cannot safely support claims.
    diligencePath: >-
      Re-fetch those URLs through an approved source-access path or replace them with readable original reporting from
      distinct domains.
    relatedQuestionRefs:
      - QP001
      - QP004
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue by stream, backlog, signed offtake, and customer contract economics.
    whyItMatters: Without contracted or recognized revenue, the revenue-quality and demand-conversion case cannot be underwritten.
    diligencePath: Request executed contracts, backlog schedule, offtake term sheets, and revenue-recognition memos under NDA.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Post-Series-A cash balance, restricted-use schedule, monthly burn, runway, debt, and next-round trigger.
    whyItMatters: Funding raised does not establish cash available or the time to the next financing event.
    diligencePath: Obtain a post-close balance sheet, 24-month cash forecast, sources-and-uses schedule, and financing plan.
    relatedQuestionRefs:
      - QI006
      - QI009
      - QI010
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Costed target, laser, plant, maintenance, fuel, and staffing model with sensitivity cases.
    whyItMatters: Gross margin, capex intensity, and project returns depend on these unreported inputs.
    diligencePath: >-
      Request the integrated techno-economic model, bill of materials, yield assumptions, and independent engineering
      review.
    relatedQuestionRefs:
      - QI004
      - QI010
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Customer pipeline, sales cycle, customer acquisition cost, channel economics, and utility qualification
      milestones.
    whyItMatters: A technically credible plant can still fail to convert into bankable demand or acceptable financing.
    diligencePath: Request a stage-gated pipeline, buyer diligence record, offtake strategy, and customer-conversion assumptions.
    relatedQuestionRefs:
      - QI005
      - QI009
  - type: missing-source
    severity: material
    topic: maturity
    missingEvidence: >-
      Integrated test results showing repeated shots, net electric output, availability, and degradation across laser,
      target, chamber, and power-conversion subsystems.
    whyItMatters: >-
      The commercial thesis depends on system-level cadence and economics, while current evidence is mostly design
      intent and component-level collaboration.
    diligencePath: >-
      Request the integrated test plan, milestone acceptance criteria, raw or independently reviewed performance data,
      and failure-recovery logs.
    relatedQuestionRefs:
      - QE004
      - QE005
  - type: private-evidence-only
    severity: material
    topic: manufacturing
    missingEvidence: >-
      Target-factory throughput, defect rates, cost per target, tritium-handling procedures, and supply-chain
      qualification.
    whyItMatters: Mass-manufactured targets are a core differentiator and a critical dependency for the proposed repetition rate.
    diligencePath: >-
      Review pilot-line records, supplier qualification files, target-yield distributions, and independent materials
      testing.
    relatedQuestionRefs:
      - QE002
      - QE005
  - type: missing-source
    severity: material
    topic: trust-safety
    missingEvidence: >-
      Permitting, safety case, cybersecurity controls, incident reporting, maintenance documentation, and a public
      developer or practitioner-community validation surface for the planned plant.
    whyItMatters: Fusion commercialization requires regulatory and operational evidence beyond scientific ignition.
    diligencePath: >-
      Obtain the permitting roadmap, safety-basis documents, cyber-risk assessment, emergency procedures, and
      third-party assurance reports.
    relatedQuestionRefs:
      - QE007
  - type: stale
    severity: minor
    topic: roadmap
    missingEvidence: >-
      Independent updates on whether the 2030 construction target and subsequent power-production target have moved into
      funded, permitted execution.
    whyItMatters: >-
      A roadmap date is decision-relevant only if supported by current site, financing, procurement, and regulatory
      milestones.
    diligencePath: Recheck construction, siting, permitting, and procurement evidence at the next refresh.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: blocking
    topic: customer-proof
    missingEvidence: A named customer pipeline with signed offtake, PPA, pilot, procurement, or deployment evidence for Inertia.
    whyItMatters: >-
      Without a buyer or contracted output, public partnership and funding milestones cannot establish commercial
      adoption or revenue durability.
    diligencePath: >-
      Request a dated customer pipeline, executed agreements, deployment sites, contracted megawatts, pricing terms,
      milestones, and permission for customer reference calls.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal terms, utilization, satisfaction, cohort, and concentration data.
    whyItMatters: >-
      Fusion projects have long conversion cycles, so durability and expansion cannot be inferred from a research
      partnership or planned plant.
    diligencePath: >-
      Obtain customer-level contract schedules, renewal and termination provisions, utilization data, pipeline stages,
      and concentration by counterparty and project.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: missing-source
    severity: material
    topic: commercialization-risk
    missingEvidence: Site, permitting, interconnection, contracted output, and delivery schedule evidence for the planned first plant.
    whyItMatters: >-
