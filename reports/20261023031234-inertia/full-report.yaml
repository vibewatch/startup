              - CO008
              - CO012
              - CO014
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The disclosed leadership group combines Jeff Lawson, a former Twilio founder and CEO, with Mike Dunne and
              Annie Kritcher. Kritcher is the technically distinctive member: Inertia says she led NIF fusion
              experiments from 2017 and had more than 20 years at LLNL, while TechCrunch identifies her with the NIF
              effort that surpassed scientific breakeven. LLNL also identifies Lawson as CEO and co-founder. No assigned
              source discloses a board, ownership split, executive compensation, or a complete leadership roster. The
              combination creates real technical and commercialization advantages, but the disclosed dependence on a
              small group and on LLNL-linked expertise is a diligence risk.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO009
              - CO010
              - CO011
