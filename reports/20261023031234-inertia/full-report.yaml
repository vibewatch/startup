  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and technical pathways
        blocks:
          - type: paragraph
            body: >-
              The relevant competitor set is broader than companies selling electricity today: it includes
              inertial-confinement peers, magnetically confined fusion developers, adjacent laser and pulsed-power
              platforms, and the status quo of grid electricity and continued public research. TechCrunch identifies
              Inertia, Xcimer, Focused Energy, and First Light as companies attempting to commercialize laser-driven
              inertial confinement. Inertia's distinct starting point is the NIF lineage: LLNL's experiment is described
              as the only experiment to have demonstrated a controlled fusion reaction producing more energy than
              required to ignite it, while the company is pursuing more efficient lasers and manufactured fuel targets.
              That is a credible technical proof point, not proof of a power plant, because the article also says a
              commercial reactor would need repeated operation several times per second. Pacific Fusion is a close
              technical comparator but uses pulsed electrical modules rather than Inertia's laser-centered design.
              Helion represents a different magnetic-confinement route and has a much larger disclosed financing
              benchmark. The status quo remains grid power: every fusion concept must still demonstrate dependable,
              affordable generation, not merely scientific breakeven.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP010
              - CP014
      - number: '3.2'
        title: Buyer-facing comparison and commercial proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports comparing technical route, capital access, and development milestones, but not
              realized price, customer count, power-purchase contracts, or operating availability. Inertia's LLNL
              relationship may lower access and learning friction: the partnership includes a CRADA for laser
              development, two Strategic Partnership Projects for target design and fabrication, and an intended license
              of almost 200 patents. Pacific Fusion's disclosed prototype and tranche-based financing show a different
              milestone-to-capital model, while Helion's Series G announcement shows how a rival can pair financing with
              an explicit commercial-deployment narrative. These are not comparable customer outcomes. No retained
              source provides a verified list price or realized contract price for any peer, so unknown cells remain
              unknown rather than being inferred from funding or technical specifications.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP014
              - CP015
      - number: '3.3'
        title: Switching, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Inertia's potential moat is concentrated in institutional and technical access rather than a demonstrated
              distribution network. The LLNL collaboration brings expertise, facilities, target-fabrication knowledge,
              and access to a large patent portfolio, and the founders' NIF experience is difficult to reproduce
              quickly. However, the same evidence describes substantial remaining scale-up requirements: lasers and
              targets must become more efficient and manufacturable, and the process must move from an isolated ignition
              result to repeated operation. Pacific Fusion's 156-module architecture and 440-gigawatt, 80-nanosecond
              prototype illustrate that competing inertial approaches can create their own hard-to-copy engineering
              programs. Industry-wide capital intensity is a material displacement risk: 83% of surveyed fusion
              companies called investment a major challenge, with a median additional requirement of USD700 million to
              bring first pilot plants online. This creates consolidation risk as well as an opportunity for well-funded
              leaders; it does not identify Inertia as the eventual winner.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Evidence gaps and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The competitive record is strong enough to establish route-level differentiation but too thin for a
              conventional feature, pricing, or share-based ranking. The retained materials do not disclose Inertia's
              customer pipeline, realized pricing, commercial contracts, plant siting, delivered cost of electricity,
              repeat-shot performance, or an independently verified schedule. They also do not provide a consistent
              capital-spend comparison across peers: Helion's financing and Pacific Fusion's funding are company or
              reported financing disclosures, not available cash or cost-to-complete. The practical underwriting test is
              therefore milestone conversion: evidence that Inertia can industrialize target production and laser
              efficiency, secure a repeatable plant cadence, and convert LLNL-linked technical assets into contracted
              demand before better-capitalized or technically divergent peers establish commercial proof.
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional access is the clearest differentiator
            body: >-
              The LLNL collaboration combines laser development, target design, and target fabrication work, giving
              Inertia a differentiated route to scarce expertise and infrastructure.
            calloutType: strength
            claimRefs:
              - CP006
              - CP010
          - type: callout
            title: Technical proof is still far from commercial proof
            body: >-
              The same evidence that supports Inertia's NIF lineage describes the need for repeated operation several
              times per second and continued laser and target industrialization.
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
          - type: callout
            title: Funding is not available cash or customer traction
            body: >-
              Peer funding, valuation, and financing tranches are retained as capital-market signals only; they do not
              establish cash available, runway, revenue, or realized power pricing.
            calloutType: assumption
            claimRefs:
              - CP007
              - CP008
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization is prospective, not yet demonstrated
        blocks:
          - type: paragraph
            body: >-
              Inertia's public materials describe a future utility-scale energy business rather than a current
              recurring-revenue product. The near-term economic engine is technology development: a prototype laser, a
              fuel-target manufacturing line, and an integrated pilot-plant design. The company says the laser and
              target tracks are intended to create a phased commercialization roadmap, but the sources do not disclose
              customer contracts, electricity offtake, realized prices, revenue recognition policy, or a current revenue
              figure. That distinction matters because a $450 million financing is capital raised, not revenue or cash
              available after commitments. Public statements also frame customer demand as less immediate than technical
              and commercial viability, so a financial model should not convert broad electricity demand into booked
              sales. The closest public benchmark is NuScale's disclosure that its current-stage revenue arose from
              engineering and licensing fees and services, with product and lifecycle services expected later; that is
              an industry analogue, not evidence of Inertia revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Capital intensity dominates the underwriting
        blocks:
          - type: paragraph
            body: >-
              The company describes an unusually capital-intensive sequence: prototype the Thunderwall laser, prove
              scalable target production, integrate the power plant, and then build a pilot facility. ENR reports that
              industrialization and large-scale energy construction are capital-intensive and that Inertia expects to
              raise more capital as objectives are achieved. The Fusion Report independently places first-of-a-kind
              fusion commercialization in a multi-billion-dollar financing context and describes later plants as
              potentially requiring commercial funds, commercial debt, and construction debt. These observations support
              a financing-dependency risk, but not a precise Inertia burn or runway estimate. The available sources also
              do not disclose target cost, laser cost, conversion efficiency at plant level, maintenance reserve,
              working-capital cycle, decommissioning provision, or gross margin. A useful unit-economics table therefore
              records unavailable fields explicitly and attaches a concrete diligence request rather than manufacturing
              estimates from physics targets or list-like technical specifications.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: 'Financial verdict: funded development, unproven operating economics'
        blocks:
          - type: paragraph
            body: >-
              Inertia's Series A materially extends the time available to execute early technical milestones, but it
              does not establish a self-funding business. The announced funding is milestone-based, and the company
              explicitly says it will raise more capital as plans move forward. LLNL's public partnership provides
              technical and institutional leverage, including a CRADA and two Strategic Partnership Projects, but it is
              not disclosed as customer revenue or unrestricted corporate cash. A public NuScale filing illustrates why
              commercialization-stage nuclear businesses must separate accounting loss, operating cash use, cash
              balances, and future financing needs; those figures belong to NuScale and are not a proxy for Inertia. The
              resulting judgment is medium-confidence on capital intensity and low-confidence on revenue quality, margin
              path, runway, and project returns. The decisive diligence package is a sources-and-uses schedule, monthly
              cash forecast, milestone budget, target-cost curve, pilot-plant capex estimate, financing plan, and
              evidence of offtake or other contracted economics.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI005
              - CI010
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing dependency
            body: >-
              The $450 million Series A funds a development program, while the sources describe further capital raises
              and potentially multi-billion-dollar plant financing; runway and financing terms remain undisclosed.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI010
          - type: callout
            title: Do not confuse technical targets with unit economics
            body: >-
              Beam energy, firing rate, and intended plant capacity are engineering targets or plans; they do not
              establish realized electricity price, cost of goods sold, gross margin, or cash generation.
            calloutType: assumption
            claimRefs:
              - CI002
              - CI008
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Inertia's product is a planned grid-scale fusion power plant rather than a currently delivered software or
              energy service. The operating workflow starts with a laser pulse, converts laser light to X-rays inside a
              hohlraum target, compresses deuterium-tritium fuel until atoms fuse, captures the resulting energy, and
              repeats the cycle at high frequency. TechCrunch describes the reactor as lasers bombarding a fuel target
              and notes that the X-rays ultimately heat and compress the fuel pellet. ABC7 reports that the company
              intends to convert its Livermore facility into an end-to-end fuel-capsule production line. The
              customer-facing outcome is dispatchable baseload electricity, while Enlit provides directional demand
              context from rising AI and data-centre electricity use. Public evidence does not yet establish a
              commercial offtake, operating plant, or realized cost of electricity.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE011
              - CE013
      - number: '5.2'
        title: Architecture and technical maturity
        blocks:
          - type: paragraph
            body: >-
              The announced architecture has distinct technical layers: a high-repetition laser system, mass-produced
              fuel targets, a reaction chamber and surrounding power-conversion systems, and a manufacturing and control
              operation. The Fusion Report reports a target of 1,000 smaller lasers, 4.5 mm hohlraum targets, ten shots
              per second, and 1.5 gigawatts of baseload electricity. These are design objectives, not measured plant
              performance. Inertia's own LIFE comparison says the design uses 10 MJ laser energy, 1,000 beamlines, and a
              lithium-based ternary alloy, with changes informed by NIF ignition and diode-pumped solid-state laser
              development. The gap between component plans and an integrated, repeatable plant remains the central
              technical underwriting issue.
            claimRefs:
              - CE005
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE010
              - CE013
      - number: '5.3'
        title: Dependencies and differentiation
        blocks:
          - type: paragraph
            body: >-
              Inertia's differentiation is the combination of NIF-derived inertial-fusion physics, an experienced
              founding team, and an unusually broad public-private development relationship. LLNL says the collaboration
              covers laser development plus separate strategic projects for target design and target fabrication; the
              company says it is updating the earlier LIFE design using more than ten years of learning and NIF ignition
              results. This creates access to scientific expertise and target-fabrication know-how, but also leaves the
              product dependent on specialist suppliers, optics and diode performance, target yield, tritium and blanket
              engineering, and continued institutional collaboration. The DOE roadmap frames commercialization as
              requiring technical milestones, infrastructure, supply chains, and public-private partnerships,
              reinforcing that the dependency set is system-level rather than confined to one laser component.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Reliability, safety, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public materials describe a future plant and development program, not a demonstrated production asset.
              ABC7 reports a company goal to operate ten shots per second continuously, break ground on a gigawatt-scale
              plant by 2030, and begin producing fusion power five years later; those statements are roadmap targets
              attributed to company representatives. LLNL describes the partnership as a way to tackle scientific
              hurdles and build infrastructure, supply chain, and talent, which is evidence of support but not evidence
              of safety certification, availability, cybersecurity controls, or validated maintenance intervals. The
              most important diligence requests are an integrated test plan, shot-to-shot reliability data, target
              manufacturing yield and cost data, laser availability, tritium and materials safety cases, permitting
              milestones, incident reporting, and independent confirmation of the plant schedule.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Physics-to-product bridge
            body: >-
              The product plan is tied to a demonstrated NIF ignition lineage and a formal LLNL collaboration spanning
              lasers, target design, and target fabrication.
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: Integration is the gating risk
            body: >-
              The public record provides design targets and development partnerships, but not measured commercial
              cadence, plant availability, safety qualification, or customer operation.
            calloutType: risk
            claimRefs:
              - CE013
              - CE015
              - CE016
          - type: callout
            title: Roadmap targets are not operating results
            body: >-
              Laser repetition, target cost, gigawatt output, and 2030 construction references are treated as company or
              publication-reported objectives rather than verified performance.
            calloutType: assumption
            claimRefs:
              - CE005
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              Inertia's disclosed customer-facing surface is still dominated by the infrastructure required to
              commercialize inertial fusion rather than by named revenue accounts. LLNL is a strategic research and
              technology counterparty through a CRADA and two Strategic Partnership Projects, not evidence of a paying
              power customer. The eventual buyer set is likely to include large electricity users and grid or utility
              counterparties, but the assigned sources do not disclose signed offtake, power-purchase, pilot, or
              procurement agreements for Inertia. The segmentation table therefore separates observed counterparties
              from plausible but unverified buyer groups and keeps strategic value distinct from revenue evidence.
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU008
              - CU013
              - CU015
      - number: '6.2'
        title: Adoption and commercialization trajectory
        blocks:
          - type: paragraph
            body: >-
              Public milestones show movement from laboratory-linked know-how toward industrialization, but they are not
              interchangeable with customer adoption. The April 2026 announcement describes a $450 million funding
              round, a CRADA, two SPPs, target-design and target-fabrication work, and a planned high-power laser
              program. TechCrunch reports a 2030 construction objective and describes the scale-up challenge from
              NIF-style experiments to repeated commercial operation. These are capability and financing milestones;
              they do not establish active users, contracted megawatts, revenue, utilization, or repeat purchase.
              External energy-demand evidence supports a real market pull, while also highlighting permitting, grid, and
              supply-chain friction.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU007
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU007
              - CU012
      - number: '6.3'
        title: Named proof, durability, and expansion
        blocks:
          - type: paragraph
            body: >-
              The strongest named relationship is with LLNL, whose public description emphasizes collaboration on laser
              technology, target manufacturing, and designs and says the work is intended to bridge research and future
              commercial fusion power. That is meaningful technical and institutional validation, but it is not a
              customer reference or production deployment. A competitor benchmark shows what stronger commercial proof
              would look like: Helion publicly identified Microsoft as its first customer and described a power-purchase
              agreement with delivery penalties. No comparable Inertia customer, contract term, outcome, renewal, churn,
              GRR, NRR, cohort, or concentration disclosure appears in the assigned evidence. The commercial diligence
              priority is to obtain a customer pipeline and contract evidence before underwriting durability or
              expansion.
            claimRefs:
              - CU003
              - CU006
              - CU009
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU009
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU012
              - CU013
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional validation is real but narrow
            body: >-
              The LLNL arrangement combines a CRADA and two SPPs and links Inertia to laboratory expertise in lasers,
              target design, and target fabrication. It is a strong technical and institutional relationship, but its
              public description does not establish commercial revenue or a paying customer.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Customer conviction is the key unresolved diligence gap
            body: >-
              The assigned evidence does not disclose a named Inertia buyer, signed offtake, production deployment,
              customer outcome, retention metric, renewal term, or concentration profile. A commercial underwrite should
              remain provisional until those records are available.
            calloutType: risk
            claimRefs:
              - CU006
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implications
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is integrated technical execution. DOE's June 2026 roadmap identifies
              unresolved work across structural materials, plasma-facing components, confinement, fuel-cycle and tritium
              processing, blanket technology, and whole-plant integration; its infrastructure appendix separately labels
              Inertia's Thunderwall-Test and Thunderwall as planned while Thunderdome is still a needed or
              gap-identified capability. Those labels are not evidence of failure, but they show that the commercial
              architecture depends on multiple facilities and validation steps that are not yet operating proof.
              Regulatory risk ranks below that technical risk because the federal direction favors a byproduct-material
              framework, although the proposed rule, environmental review, waste classification, and state
              implementation still create schedule uncertainty. Likelihood labels below are qualitative because the
              assigned public sources do not provide company-specific probabilities, loss distributions, burn, runway,
              or quantified contingency reserves.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal path
        blocks:
          - type: paragraph
            body: >-
              The clearest federal signal is the NRC's proposed fusion-specific pathway under the Part 30
              byproduct-material framework rather than conventional fission-reactor construction and operating rules.
              The proposal still calls for radiation-safety, operating, emergency, training, inventory, and
              environmental submissions, while its waste pathway retains implementation questions for activation
              products. Agreement States may become the day-to-day licensing authorities, making California and local
              execution material even if the federal framework is comparatively streamlined. Part 53 is useful
              advanced-reactor context but should not be mistaken for Inertia's direct fusion-machine route. California
              policy is supportive, yet SB 80 made its fusion initiative contingent on an appropriation and set a
              January 1, 2028 repeal date. Neither provision establishes funding available to Inertia, and the fetched
              company press index does not establish a company-specific permit, license, environmental review, IP
              allocation, or incident record.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              LLNL confirms a broad collaboration covering fusion laser technology, target manufacturing, and target
              design, which is a meaningful mitigation because it links Inertia to specialist public infrastructure and
              expertise. It is also a dependency: the retrieved evidence does not disclose milestone ownership, data
              rights, termination protections, replacement capacity, or whether the collaboration proves commercial
              cadence. DOE's roadmap makes the scale of the remaining problem explicit. It says no fusion blanket has
              yet been built and validated, describes plant-throughput fuel-cycle integration as unproven, and calls for
              whole-plant RAMI, remote maintenance, radiation-hard diagnostics, controls, and digital-twin
              qualification. Public evidence therefore supports treating quality, reliability, tritium accountancy,
              component lifetime, and cybersecurity controls as diligence items rather than completed mitigations.
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Dependencies, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investment case should be monitored through evidence releases rather than calendar claims alone.
              Near-term proof should include repeatable driver and target operation, independently witnessed
              target-manufacturing yield, component-lifetime and availability data, a regulator-engagement plan naming
              the expected licensing authority, and a funded path through each critical facility. The thesis should be
              paused if commercial-cadence tests repeatedly miss disclosed thresholds, if the company cannot demonstrate
              a credible tritium and waste-accountancy path, if public-laboratory access or enabling infrastructure
              becomes unavailable without a substitute, or if financing falls short of the next integrated milestone. It
              should break if management represents scientific target gain as plant net electricity without an evidenced
              wall-plug, repetition-rate, heat-extraction, fuel-cycle, and availability bridge. These criteria are
              analyst-defined controls anchored to the cited technical and regulatory gaps, not company forecasts.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break condition
            body: >-
              Treat any attempt to equate target-level scientific gain with commercial net electricity as
              thesis-breaking unless Inertia supplies a measured bridge through wall-plug efficiency, repetition rate,
              target cost and yield, chamber recovery, fuel cycle, heat extraction, maintenance, and availability.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Inertia is commercializing an approach with a documented scientific milestone,
              an experienced founding team, and an unusually deep laboratory partnership. The company's own financing
              announcement says the Series A is milestone-based and intended to fund a high-power laser and target
              manufacturing, while independent coverage describes the technical gap between NIF breakeven and a
              grid-scale plant. The anti-thesis is equally material: the disclosed program is still pre-commercial, the
              public record does not disclose revenue, customers, plant economics, ownership, liquidation preferences,
              or a post-money valuation, and the industry itself reports that most fusion companies still see investment
              as a major challenge. Rising electricity demand from AI and data centres is a market-level tailwind, but
              it is not customer proof for Inertia. Therefore the evidence supports strategic optionality, not a
              conventional growth-company underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
      - number: '8.2'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate. The bull case requires successful scale-up
              from ignition physics to repeatable laser operation, low-cost target production, regulatory and siting
              progress, and credible utility or industrial offtake. The base case assumes technical progress but
              continued financing and schedule uncertainty. The bear case is a capital-intensive program that reaches
              further milestones without proving commercial cadence, forcing a down-round or a longer private funding
              cycle. The disclosed $450 million should be treated as funding raised, not cash available for plant
              construction, and no public source establishes valuation or investor economics. Proposed reverse-merger
              marks reported for General Fusion and TAE span $1 billion to $6 billion, illustrating that transaction
              structure and technical maturity prevent a simple read-across. Entry should therefore be contingent on
              receiving cap-table terms, a milestone budget, target cost data, runway, and independently testable
              commercial milestones.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.3'
        title: Decision, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              The current decision is research-more with low confidence in the valuation stance and high execution risk.
              That is not a judgment that the science is weak; it is a judgment that public evidence does not connect
              the science to a priced equity return. The DOE roadmap frames commercialization as a set of
              infrastructure, supply-chain, workforce, and cost-competitive power challenges, while the LLNL arrangement
              provides capability and access rather than proof of revenue or plant economics. Before an investment
              decision, diligence should verify financing terms, remaining runway, milestone definitions, laser and
              target manufacturing yields, regulatory pathway, plant site, offtake, insurance, IP licenses, and the
              triggers for the next round. A thesis break occurs if milestones slip without revised financing, if target
              costs or repetition rates fail, or if customer and permitting evidence remain absent as the 2030
              construction ambition approaches.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more: the evidence supports a technically differentiated option, but not a price-sensitive buy
              decision.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV011
              - CV012
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat missed scale-up milestones, financing stress, or continued absence of customers and permitting
              evidence as thesis-breaking until independently resolved.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV015
