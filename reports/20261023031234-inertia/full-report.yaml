            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capital, partners, and institutional position
        blocks:
          - type: paragraph
            body: >-
              Inertia announced a $450 million Series A on February 11, 2026, led by Bessemer Venture Partners with GV,
              Modern Capital, Threshold Ventures, and other participants. The announcement calls the financing
              milestone-based, but does not disclose post-money valuation, liquidation preferences, ownership, debt,
              cash balance, burn, or runway. The LLNL relationship is more specific than a generic memorandum: it
              comprises a CRADA focused on laser development and two Strategic Partnership Projects for target design
              and fabrication. DOE’s roadmap places the wider sector in a public-private gap-closing phase, noting
              unresolved fuel, materials, and plasma-performance challenges. California SB80 adds a possible
              state-support pathway, but its implementation is contingent on an appropriation and its chapter is
              repealed January 1, 2028.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Scale, milestones, and underwritten gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a dated sequence from founding and financing through the LLNL agreements, but it
              does not establish operating scale. No assigned source provides revenue, recurring revenue, customers,
              headcount, valuation, production volume, target cost, plant site, permitting milestones, or commercial
              power output. TechCrunch explicitly separates scientific breakeven from commercial breakeven, while DOE
              lists materials, fuel handling, and plasma performance as critical gaps. The company’s stated “within the
              next decade” plant ambition is therefore a roadmap claim rather than an operating forecast. Investors
              should treat the technical partnership and capital as enabling assets, not as proof of customer traction
              or economic viability.
            claimRefs:
              - CO011
              - CO013
              - CO015
              - CO016
