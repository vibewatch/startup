chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and commercialization strategy
        blocks:
          - type: paragraph
            body: >-
              Inertia Enterprises is described by Lawrence Livermore National Laboratory as a San Francisco Bay Area
              fusion-energy startup. Its disclosed strategy is inertial confinement fusion: lasers compress fuel
              targets, with the company pursuing a high-average-power laser, target manufacturing, and eventually a
              gigawatt-scale plant. The company says it was founded in 2024 and that its Series A is milestone-based.
              Those are company-reported facts, while the independent TechCrunch account corroborates the founders, the
              NIF lineage, the laser-based approach, the April agreements, and the $450 million Series A. The
              distinction matters because a proven ignition experiment is not the same as a commercial power plant.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO009
              - CO015
