  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Inertia's direct market is not fusion research, venture funding, or the whole electricity market. It is
              the prospective development and delivery of laser inertial-fusion power plants, including the
              high-average-power laser, mass-produced fuel targets, fusion chamber, fuel cycle, and balance-of-plant
              systems needed to sell grid electricity. The company's stated roadmap begins with Thunderwall and target
              manufacturing before a pilot and utility-scale plant, while an independent tracker says a 2030
              construction start remains an intention and discloses neither a site nor a power rating. Adjacent markets
              include enabling equipment, public research partnerships, and component supply, but these should not be
              counted as plant revenue without separate contracts. Status-quo substitutes include fission, renewables
              plus storage, natural-gas generation, transmission, and demand management; the assigned evidence does not
              quantify their spend or Inertia's cost position.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM013
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available figures size the fusion financing ecosystem rather than the market for electricity or plants.
              Fusion for Energy estimated €9.9 billion of cumulative investment in private-sector fusion companies as of
              10 June 2025, comprising more than €6.7 billion of private capital, about €1.8 billion of public funds,
              and €1.4 billion of hybrid forms. Its methodology standardizes transactions in euros and cross-checks
              funding events, but explicitly excludes broader public-sector fusion programs. The same report found that
              five companies represented nearly 70% of global private investment and that magnetic confinement attracted
              70% of funding. These are useful capital-availability and competitive-intensity indicators, not TAM. A
              2026 DOE roadmap separately said the U.S. private sector had attracted more than $10 billion; different
              cutoffs, currencies, scopes, and methodologies prevent treating the two figures as a growth series.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most concrete buyer evidence is outside Inertia. Google signed a 200 MW power-purchase agreement for
              half of Commonwealth Fusion Systems' planned 400 MW ARC plant, with first power projected for the early
              2030s. That transaction identifies hyperscale load and utility-scale project offtake as a plausible
              adoption path, but it does not establish demand for Inertia's design or convert peer capacity into Inertia
              SAM. Plant owners and utilities would control generation capital budgets; large electricity users could
              support bankability through long-dated offtake; governments and laboratories can fund de-risking
              infrastructure; and suppliers can support lasers, targets, materials, tritium systems, and plant
              integration. Inertia's $450 million Series A is milestone-based development capital, not revenue,
              contracted demand, cash available without conditions, or proof of a financeable plant.
            claimRefs:
              - CM008
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM011
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: Adoption drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Policy and capital are constructive but do not remove the engineering bottleneck. California enacted an
              initiative intended to accelerate fusion research and pursue a pilot project in the state by the 2040s,
              yet implementation is contingent on a legislative appropriation. Federal law directs DOE to support
              pilot-plant design teams, while DOE's 2026 roadmap targets commercialization infrastructure and identifies
              unresolved materials, plasma-facing components, confinement, tritium fuel-cycle, blanket, and whole-plant
              integration gaps. The market therefore depends on technical qualification, licensing, fuel
              self-sufficiency, maintainability, capital formation, and buyer willingness to sign bankable contracts
              before plant performance is proven. Scientific breakeven is not commercial breakeven: facility input,
              repetition rate, component life, fuel supply, heat extraction, availability, and delivered cost still
              govern adoption. A valuation case should use scenario ranges only after Inertia discloses a site, rated
              output, build cost, target cadence, conversion efficiency, availability, power price, and customer
              evidence.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is the measurable proxy, not the market
            body: >-
              Sector funding shows investor capacity and competitive intensity, but it does not measure electricity
              demand, plant revenue, or Inertia's obtainable share.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM014
          - type: callout
            title: Demand proof remains peer-derived
            body: >-
              A 200 MW peer PPA demonstrates a possible route to bankability; the assigned evidence does not disclose an
              Inertia offtake agreement, site, power rating, or plant-level economics.
            calloutType: risk
