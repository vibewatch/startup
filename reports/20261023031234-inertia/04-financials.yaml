company:
  name: Inertia
chapter:
  number: 4
  title: Financials
  summary: Inertia has substantial launch capital for a 2024-founded fusion company, but its public financial profile is still a development-stage investment case rather than an operating-revenue underwrite. The evidence supports a milestone-funded path through laser, target-manufacturing, and pilot-plant work while leaving revenue, margin, burn, runway, realized pricing, and project-finance needs undisclosed.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization is prospective, not yet demonstrated
    body: >-
      Inertia's public materials describe a future utility-scale energy business rather than
      a current recurring-revenue product. The near-term economic engine is technology
      development: a prototype laser, a fuel-target manufacturing line, and an integrated
      pilot-plant design. The company says the laser and target tracks are intended to create
      a phased commercialization roadmap, but the sources do not disclose customer contracts,
      electricity offtake, realized prices, revenue recognition policy, or a current revenue
      figure. That distinction matters because a $450 million financing is capital raised,
      not revenue or cash available after commitments. Public statements also frame customer
      demand as less immediate than technical and commercial viability, so a financial model
      should not convert broad electricity demand into booked sales. The closest public
      benchmark is NuScale's disclosure that its current-stage revenue arose from engineering
      and licensing fees and services, with product and lifecycle services expected later;
      that is an industry analogue, not evidence of Inertia revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: capital-intensity-and-unit-economics
    title: Capital intensity dominates the underwriting
    body: >-
      The company describes an unusually capital-intensive sequence: prototype the
      Thunderwall laser, prove scalable target production, integrate the power plant, and
      then build a pilot facility. ENR reports that industrialization and large-scale energy
      construction are capital-intensive and that Inertia expects to raise more capital as
      objectives are achieved. The Fusion Report independently places first-of-a-kind fusion
      commercialization in a multi-billion-dollar financing context and describes later plants
      as potentially requiring commercial funds, commercial debt, and construction debt. These
      observations support a financing-dependency risk, but not a precise Inertia burn or
      runway estimate. The available sources also do not disclose target cost, laser cost,
      conversion efficiency at plant level, maintenance reserve, working-capital cycle,
      decommissioning provision, or gross margin. A useful unit-economics table therefore
      records unavailable fields explicitly and attaches a concrete diligence request rather
      than manufacturing estimates from physics targets or list-like technical specifications.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI002, TI003]
  - id: financial-verdict-and-gaps
    title: "Financial verdict: funded development, unproven operating economics"
    body: >-
      Inertia's Series A materially extends the time available to execute early technical
      milestones, but it does not establish a self-funding business. The announced funding is
      milestone-based, and the company explicitly says it will raise more capital as plans
      move forward. LLNL's public partnership provides technical and institutional leverage,
      including a CRADA and two Strategic Partnership Projects, but it is not disclosed as
      customer revenue or unrestricted corporate cash. A public NuScale filing illustrates
      why commercialization-stage nuclear businesses must separate accounting loss, operating
      cash use, cash balances, and future financing needs; those figures belong to NuScale and
      are not a proxy for Inertia. The resulting judgment is medium-confidence on capital
      intensity and low-confidence on revenue quality, margin path, runway, and project
      returns. The decisive diligence package is a sources-and-uses schedule, monthly cash
      forecast, milestone budget, target-cost curve, pilot-plant capex estimate, financing
      plan, and evidence of offtake or other contracted economics.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
callouts:
  - calloutType: risk
    title: Financing dependency
    body: The $450 million Series A funds a development program, while the sources describe further capital raises and potentially multi-billion-dollar plant financing; runway and financing terms remain undisclosed.
    claimRefs: [CI005, CI006, CI010]
  - calloutType: assumption
    title: Do not confuse technical targets with unit economics
    body: Beam energy, firing rate, and intended plant capacity are engineering targets or plans; they do not establish realized electricity price, cost of goods sold, gross margin, or cash generation.
    claimRefs: [CI002, CI008, CI009]
tables:
  - id: TI001
    title: Revenue streams and monetization status
    columns: [Stream, Mechanism, Unit or basis, Current value/status, Quality, Diligence ask]
    rows:
      - [Technology development, Prototype laser and target-line milestones, Milestone funding, Publicly described; no revenue disclosed, Company-claimed, Obtain milestone budget and payment restrictions]
      - [Fusion electricity, Pilot and later utility-scale plant output, MWe/GWe and offtake, Planned; no customer contract or price disclosed, Unavailable, Obtain offtake terms and dispatch assumptions]
      - [Licensing or engineering, Potential technology and development services, Contract or project fee, No Inertia amount disclosed, Unavailable, Obtain executed contracts and revenue-recognition policy]
      - [Lifecycle services, "Start-up, testing, fuel or refueling analogue", Service contract, Not publicly disclosed for Inertia, Industry analogue only, Obtain service scope and attach rate assumptions]
    notes: "Inertia-specific public sources describe a future plant and development milestones, not recognized revenue; the lifecycle-services row is an explicitly labeled nuclear-industry analogue from NuScale."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Economic item, Price or contract model, List vs realized, Public evidence, Implication, Diligence ask]
    rows:
      - [Electricity, "Unknown power-purchase or merchant model", Not disclosed, No Inertia tariff or offtake price found, Revenue cannot be forecast from plant capacity alone, Obtain PPA terms and price curve]
      - [Fuel targets, Internal manufactured input, Unknown unit cost, Company describes mass production but gives no target price, Cost curve is a core commercialization risk, Obtain target bill of materials and yield]
      - [Laser beamlines, Internal modular equipment, Unknown transfer or service price, Technical specifications are disclosed without a commercial price, Capex and replacement economics remain open, Obtain prototype-to-production cost bridge]
      - [Plant development, Project finance and construction, Unknown capex and debt terms, External reporting describes multi-billion-dollar sector needs, Inertia-specific funding need is unquantified, "Obtain capex estimate, debt sizing, and contingencies"]
    notes: "No public Inertia list price or realized price was identified. Technical performance and sector funding comparisons are not substitutes for customer pricing."
    claimRefs: [CI006, CI007, CI008, CI009]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Revenue or ARR", null, Low, No public operating-revenue base supports a recurring-revenue underwrite, Obtain audited revenue by stream and backlog]
      - [Gross margin, null, Low, Target manufacturing and plant operations could dominate cost of service, Obtain costed unit model and maintenance assumptions]
      - [Cash on hand, null, Low, Series A size is not the same as unrestricted cash after milestones, Obtain post-close balance sheet and restricted-use schedule]
      - [Burn and runway, null, Low, The company says more capital will be raised as objectives advance, "Obtain monthly cash forecast, burn bridge, and financing trigger"]
      - [Pilot-plant capex, null, Low, First-of-a-kind construction is the likely largest funding need, "Obtain engineering estimate, contingency, and financing plan"]
      - [Customer concentration or contracted backlog, null, Low, Customer interest is described broadly without disclosed contracts, "Obtain signed offtake, reservations, or buyer diligence"]
    notes: "Null means the assigned public evidence did not disclose an Inertia-specific value; it is not zero. Accounting loss, cash burn, funding raised, and cash available must remain separate."
    claimRefs: [CI004, CI005, CI006, CI010, CI011, CI012]
