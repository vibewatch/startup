company:
  name: Inertia
chapter:
  number: 5
  title: Product & Technology
  summary: Inertia is developing an inertial-confinement fusion power system that combines NIF-derived physics with a high-repetition laser, mass-manufactured fuel targets, and an LLNL-backed development program. Public evidence is strongest on the intended architecture and institutional partners; integrated commercial cadence, reliability, and safety performance remain unproven.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      Inertia's product is a planned grid-scale fusion power plant rather than a currently delivered software or energy service. The operating workflow starts with a laser pulse, converts laser light to X-rays inside a hohlraum target, compresses deuterium-tritium fuel until atoms fuse, captures the resulting energy, and repeats the cycle at high frequency. TechCrunch describes the reactor as lasers bombarding a fuel target and notes that the X-rays ultimately heat and compress the fuel pellet. ABC7 reports that the company intends to convert its Livermore facility into an end-to-end fuel-capsule production line. The customer-facing outcome is dispatchable baseload electricity, while Enlit provides directional demand context from rising AI and data-centre electricity use. Public evidence does not yet establish a commercial offtake, operating plant, or realized cost of electricity.
    claimRefs: [CE001, CE002, CE003, CE004, CE006]
    tableRefs: [TE001, TE002]
  - id: architecture-and-technical-maturity
    title: Architecture and technical maturity
    body: >-
      The announced architecture has distinct technical layers: a high-repetition laser system, mass-produced fuel targets, a reaction chamber and surrounding power-conversion systems, and a manufacturing and control operation. The Fusion Report reports a target of 1,000 smaller lasers, 4.5 mm hohlraum targets, ten shots per second, and 1.5 gigawatts of baseload electricity. These are design objectives, not measured plant performance. Inertia's own LIFE comparison says the design uses 10 MJ laser energy, 1,000 beamlines, and a lithium-based ternary alloy, with changes informed by NIF ignition and diode-pumped solid-state laser development. The gap between component plans and an integrated, repeatable plant remains the central technical underwriting issue.
    claimRefs: [CE005, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: dependencies-and-differentiation
    title: Dependencies and differentiation
    body: >-
      Inertia's differentiation is the combination of NIF-derived inertial-fusion physics, an experienced founding team, and an unusually broad public-private development relationship. LLNL says the collaboration covers laser development plus separate strategic projects for target design and target fabrication; the company says it is updating the earlier LIFE design using more than ten years of learning and NIF ignition results. This creates access to scientific expertise and target-fabrication know-how, but also leaves the product dependent on specialist suppliers, optics and diode performance, target yield, tritium and blanket engineering, and continued institutional collaboration. The DOE roadmap frames commercialization as requiring technical milestones, infrastructure, supply chains, and public-private partnerships, reinforcing that the dependency set is system-level rather than confined to one laser component.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: reliability-trust-and-gaps
    title: Reliability, safety, and diligence gaps
    body: >-
      Public materials describe a future plant and development program, not a demonstrated production asset. ABC7 reports a company goal to operate ten shots per second continuously, break ground on a gigawatt-scale plant by 2030, and begin producing fusion power five years later; those statements are roadmap targets attributed to company representatives. LLNL describes the partnership as a way to tackle scientific hurdles and build infrastructure, supply chain, and talent, which is evidence of support but not evidence of safety certification, availability, cybersecurity controls, or validated maintenance intervals. The most important diligence requests are an integrated test plan, shot-to-shot reliability data, target manufacturing yield and cost data, laser availability, tritium and materials safety cases, permitting milestones, incident reporting, and independent confirmation of the plant schedule.
    claimRefs: [CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Physics-to-product bridge
    body: The product plan is tied to a demonstrated NIF ignition lineage and a formal LLNL collaboration spanning lasers, target design, and target fabrication.
    claimRefs: [CE009, CE010]
  - calloutType: risk
    title: Integration is the gating risk
    body: The public record provides design targets and development partnerships, but not measured commercial cadence, plant availability, safety qualification, or customer operation.
    claimRefs: [CE013, CE015, CE016]
  - calloutType: assumption
    title: Roadmap targets are not operating results
    body: Laser repetition, target cost, gigawatt output, and 2030 construction references are treated as company or publication-reported objectives rather than verified performance.
    claimRefs: [CE005, CE013]
