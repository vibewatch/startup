  evidenceGaps:
    - type: missing-source
      severity: material
      topic: maturity
      missingEvidence: Integrated test results showing repeated shots, net electric output, availability, and degradation across laser, target, chamber, and power-conversion subsystems.
      whyItMatters: The commercial thesis depends on system-level cadence and economics, while current evidence is mostly design intent and component-level collaboration.
      diligencePath: Request the integrated test plan, milestone acceptance criteria, raw or independently reviewed performance data, and failure-recovery logs.
      relatedQuestionRefs: [QE004, QE005]
    - type: private-evidence-only
      severity: material
      topic: manufacturing
      missingEvidence: Target-factory throughput, defect rates, cost per target, tritium-handling procedures, and supply-chain qualification.
      whyItMatters: Mass-manufactured targets are a core differentiator and a critical dependency for the proposed repetition rate.
      diligencePath: Review pilot-line records, supplier qualification files, target-yield distributions, and independent materials testing.
      relatedQuestionRefs: [QE002, QE005]
    - type: missing-source
      severity: material
      topic: trust-safety
      missingEvidence: Permitting, safety case, cybersecurity controls, incident reporting, maintenance documentation, and a public developer or practitioner-community validation surface for the planned plant.
      whyItMatters: Fusion commercialization requires regulatory and operational evidence beyond scientific ignition.
      diligencePath: Obtain the permitting roadmap, safety-basis documents, cyber-risk assessment, emergency procedures, and third-party assurance reports.
      relatedQuestionRefs: [QE007]
    - type: stale
      severity: minor
      topic: roadmap
      missingEvidence: Independent updates on whether the 2030 construction target and subsequent power-production target have moved into funded, permitted execution.
      whyItMatters: A roadmap date is decision-relevant only if supported by current site, financing, procurement, and regulatory milestones.
      diligencePath: Recheck construction, siting, permitting, and procurement evidence at the next refresh.
      relatedQuestionRefs: [QE008]
