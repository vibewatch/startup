      - [Reaction chamber and blanket, "Convert fusion output and manage neutron/material environment", "Tritium breeding and structural materials", "Safety, lifetime, and maintainability are unverified"]
      - [Power conversion and grid interface, Deliver electricity to the grid, Thermal and balance-of-plant systems, Net output and plant economics are unverified]
      - ["Controls, diagnostics, and maintenance", Coordinate shots and recover from component downtime, "Sensors, software, and spare beamlines", "Cybersecurity and availability controls are undisclosed"]
      - [LLNL partnership and supply chain, "Provide design, fabrication, and scientific support", "CRADA, SPPs, specialist suppliers", "Continuity, scale, and commercial terms are not fully public"]
    notes: Architecture is synthesized from the cited technical descriptions; unresolved risks are diligence gaps, not findings of failure.
    claimRefs: [CE007, CE009, CE010, CE011, CE012]
