company:
  name: Inertia
chapter:
  number: 6
  title: Customers
  summary: Inertia has public evidence of a substantial LLNL research partnership and a capital-backed path toward grid-scale fusion, but the assigned evidence does not identify a paying commercial customer, production deployment, retention metric, or renewal history. Customer readiness is therefore best assessed as research-partner validation plus an unproven commercial conversion path.
sections:
  - id: customer-segments
    title: Buyer and user segmentation
    body: >-
      Inertia's disclosed customer-facing surface is still dominated by the infrastructure required to commercialize inertial fusion rather than by named revenue accounts. LLNL is a strategic research and technology counterparty through a CRADA and two Strategic Partnership Projects, not evidence of a paying power customer. The eventual buyer set is likely to include large electricity users and grid or utility counterparties, but the assigned sources do not disclose signed offtake, power-purchase, pilot, or procurement agreements for Inertia. The segmentation table therefore separates observed counterparties from plausible but unverified buyer groups and keeps strategic value distinct from revenue evidence.
    claimRefs: [CU001, CU003, CU006, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and commercialization trajectory
    body: >-
      Public milestones show movement from laboratory-linked know-how toward industrialization, but they are not interchangeable with customer adoption. The April 2026 announcement describes a $450 million funding round, a CRADA, two SPPs, target-design and target-fabrication work, and a planned high-power laser program. TechCrunch reports a 2030 construction objective and describes the scale-up challenge from NIF-style experiments to repeated commercial operation. These are capability and financing milestones; they do not establish active users, contracted megawatts, revenue, utilization, or repeat purchase. External energy-demand evidence supports a real market pull, while also highlighting permitting, grid, and supply-chain friction.
    claimRefs: [CU002, CU004, CU005, CU007, CU015]
    tableRefs: [TU002]
  - id: named-proof-and-retention
    title: Named proof, durability, and expansion
    body: >-
      The strongest named relationship is with LLNL, whose public description emphasizes collaboration on laser technology, target manufacturing, and designs and says the work is intended to bridge research and future commercial fusion power. That is meaningful technical and institutional validation, but it is not a customer reference or production deployment. A competitor benchmark shows what stronger commercial proof would look like: Helion publicly identified Microsoft as its first customer and described a power-purchase agreement with delivery penalties. No comparable Inertia customer, contract term, outcome, renewal, churn, GRR, NRR, cohort, or concentration disclosure appears in the assigned evidence. The commercial diligence priority is to obtain a customer pipeline and contract evidence before underwriting durability or expansion.
    claimRefs: [CU003, CU006, CU009, CU012, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
