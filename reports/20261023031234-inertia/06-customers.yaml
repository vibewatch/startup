callouts:
  - calloutType: strength
    title: Institutional validation is real but narrow
    body: >-
      The LLNL arrangement combines a CRADA and two SPPs and links Inertia to laboratory expertise in lasers, target design, and target fabrication. It is a strong technical and institutional relationship, but its public description does not establish commercial revenue or a paying customer.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Customer conviction is the key unresolved diligence gap
    body: >-
      The assigned evidence does not disclose a named Inertia buyer, signed offtake, production deployment, customer outcome, retention metric, renewal term, or concentration profile. A commercial underwrite should remain provisional until those records are available.
    claimRefs: [CU006, CU012, CU014]
