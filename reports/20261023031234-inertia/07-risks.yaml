chapter:
  number: 7
  title: Risks
  summary: >-
    Inertia's dominant public-evidence risk is not a single licensing prohibition but the
    simultaneous execution of high-cadence inertial-fusion drivers, targets, materials,
    tritium systems, blankets, and plant integration. The U.S. fusion licensing direction
    is becoming clearer, yet implementation details, company-specific permits, financing
    durability, and mitigation maturity remain insufficiently disclosed for a low-risk view.
sections:
  - id: risk-ranking
    title: Risk ranking and investment implications
    body: >-
      The highest residual exposure is integrated technical execution. DOE's June 2026
      roadmap identifies unresolved work across structural materials, plasma-facing
      components, confinement, fuel-cycle and tritium processing, blanket technology, and
      whole-plant integration; its infrastructure appendix separately labels Inertia's
      Thunderwall-Test and Thunderwall as planned while Thunderdome is still a needed or
      gap-identified capability. Those labels are not evidence of failure, but they show
      that the commercial architecture depends on multiple facilities and validation steps
      that are not yet operating proof. Regulatory risk ranks below that technical risk
      because the federal direction favors a byproduct-material framework, although the
      proposed rule, environmental review, waste classification, and state implementation
      still create schedule uncertainty. Likelihood labels below are qualitative because
      the assigned public sources do not provide company-specific probabilities, loss
      distributions, burn, runway, or quantified contingency reserves.
    claimRefs: [CR011, CR012, CR013, CR014, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal path
    body: >-
      The clearest federal signal is the NRC's proposed fusion-specific pathway under the
      Part 30 byproduct-material framework rather than conventional fission-reactor
      construction and operating rules. The proposal still calls for radiation-safety,
      operating, emergency, training, inventory, and environmental submissions, while its
      waste pathway retains implementation questions for activation products. Agreement
      States may become the day-to-day licensing authorities, making California and local
      execution material even if the federal framework is comparatively streamlined. Part
      53 is useful advanced-reactor context but should not be mistaken for Inertia's direct
      fusion-machine route. California policy is supportive, yet SB 80 made its fusion
      initiative contingent on an appropriation and set a January 1, 2028 repeal date.
      Neither provision establishes funding available to Inertia, and the fetched company
      press index does not establish a company-specific permit, license, environmental
      review, IP allocation, or incident record.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR001]
  - id: operational-technical
    title: Operational, quality, and security exposure
    body: >-
      LLNL confirms a broad collaboration covering fusion laser technology, target
      manufacturing, and target design, which is a meaningful mitigation because it links
      Inertia to specialist public infrastructure and expertise. It is also a dependency:
      the retrieved evidence does not disclose milestone ownership, data rights, termination
      protections, replacement capacity, or whether the collaboration proves commercial
      cadence. DOE's roadmap makes the scale of the remaining problem explicit. It says no
      fusion blanket has yet been built and validated, describes plant-throughput
      fuel-cycle integration as unproven, and calls for whole-plant RAMI, remote maintenance,
      radiation-hard diagnostics, controls, and digital-twin qualification. Public evidence
      therefore supports treating quality, reliability, tritium accountancy, component
      lifetime, and cybersecurity controls as diligence items rather than completed
      mitigations.
    claimRefs: [CR001, CR002, CR011, CR012, CR013]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Dependencies, monitoring, and thesis-break triggers
    body: >-
      The investment case should be monitored through evidence releases rather than calendar
      claims alone. Near-term proof should include repeatable driver and target operation,
      independently witnessed target-manufacturing yield, component-lifetime and
      availability data, a regulator-engagement plan naming the expected licensing authority,
      and a funded path through each critical facility. The thesis should be paused if
      commercial-cadence tests repeatedly miss disclosed thresholds, if the company cannot
      demonstrate a credible tritium and waste-accountancy path, if public-laboratory access
      or enabling infrastructure becomes unavailable without a substitute, or if financing
      falls short of the next integrated milestone. It should break if management represents
      scientific target gain as plant net electricity without an evidenced wall-plug,
      repetition-rate, heat-extraction, fuel-cycle, and availability bridge. These criteria
      are analyst-defined controls anchored to the cited technical and regulatory gaps, not
      company forecasts.
    claimRefs: [CR001, CR006, CR007, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR003]
