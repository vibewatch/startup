callouts:
  - calloutType: risk
    title: Primary thesis-break condition
    body: >-
      Treat any attempt to equate target-level scientific gain with commercial net
      electricity as thesis-breaking unless Inertia supplies a measured bridge through
      wall-plug efficiency, repetition rate, target cost and yield, chamber recovery,
      fuel cycle, heat extraction, maintenance, and availability.
    claimRefs: [CR011, CR012, CR015]
