company:
  name: Inertia
chapter:
  number: 1
  title: Company Overview
  summary: Inertia is a 2024-founded fusion-energy startup built around National Ignition Facility expertise, a $450 million Series A, and an unusually broad public-private partnership with Lawrence Livermore National Laboratory. The evidence supports strong technical pedigree and capital formation, but not yet a verified commercial customer base, valuation, revenue, headcount, or plant economics.
sections:
  - id: identity-and-strategy
    title: Identity and commercialization strategy
    body: >-
      Inertia Enterprises is described by Lawrence Livermore National Laboratory as a San Francisco Bay Area fusion-energy startup. Its disclosed strategy is inertial confinement fusion: lasers compress fuel targets, with the company pursuing a high-average-power laser, target manufacturing, and eventually a gigawatt-scale plant. The company says it was founded in 2024 and that its Series A is milestone-based. Those are company-reported facts, while the independent TechCrunch account corroborates the founders, the NIF lineage, the laser-based approach, the April agreements, and the $450 million Series A. The distinction matters because a proven ignition experiment is not the same as a commercial power plant.
    claimRefs: [CO001, CO002, CO003, CO004, CO009, CO010]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-dependencies
    title: Leadership, governance, and key-person dependence
    body: >-
      The disclosed leadership group combines Jeff Lawson, a former Twilio founder and CEO, with Mike Dunne and Annie Kritcher. Kritcher is the technically distinctive member: Inertia says she led NIF fusion experiments from 2017 and had more than 20 years at LLNL, while TechCrunch identifies her with the NIF effort that surpassed scientific breakeven. LLNL also identifies Lawson as CEO and co-founder. No assigned source discloses a board, ownership split, executive compensation, or a complete leadership roster. The combination creates real technical and commercialization advantages, but the disclosed dependence on a small group and on LLNL-linked expertise is a diligence risk.
    claimRefs: [CO005, CO006, CO007, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital, partners, and institutional position
    body: >-
      Inertia announced a $450 million Series A on February 11, 2026, led by Bessemer Venture Partners with GV, Modern Capital, Threshold Ventures, and other participants. The announcement calls the financing milestone-based, but does not disclose post-money valuation, liquidation preferences, ownership, debt, cash balance, burn, or runway. The LLNL relationship is more specific than a generic memorandum: it comprises a CRADA focused on laser development and two Strategic Partnership Projects for target design and fabrication. DOE’s roadmap places the wider sector in a public-private gap-closing phase, noting unresolved fuel, materials, and plasma-performance challenges. California SB80 adds a possible state-support pathway, but its implementation is contingent on an appropriation and its chapter is repealed January 1, 2028.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: scale-and-evidence-gaps
    title: Scale, milestones, and underwritten gaps
    body: >-
      The evidence supports a dated sequence from founding and financing through the LLNL agreements, but it does not establish operating scale. No assigned source provides revenue, recurring revenue, customers, headcount, valuation, production volume, target cost, plant site, permitting milestones, or commercial power output. TechCrunch explicitly separates scientific breakeven from commercial breakeven, while DOE lists materials, fuel handling, and plasma performance as critical gaps. The company’s stated “within the next decade” plant ambition is therefore a roadmap claim rather than an operating forecast. Investors should treat the technical partnership and capital as enabling assets, not as proof of customer traction or economic viability.
    claimRefs: [CO011, CO013, CO015, CO016]
    tableRefs: []
    figureRefs: []
