companyProfile:
  summary: Pindrop is a privately held, Atlanta-founded voice-security company that protects enterprise contact centers by authenticating legitimate callers and intercepting fraud and audio deepfakes. Founded in 2011 by three Georgia Tech PhDs, it combines acoustic, device (Phoneprinting), network, behavioral, risk and liveness signals into a multifactor risk score, and has expanded from authentication and fraud detection into deepfake detection with its Pulse line. By 2026 it counts a majority of the largest US banks plus leading insurers, healthcare providers and telecoms among its customers, and AWS designated it the recommended replacement for the retired Connect Voice ID. Public evidence supports real category leadership and strong proof, but the company does not disclose revenue, ARR, margins or a current valuation.
  foundedDate: '2011-01-01'
  founders:
    - name: Dr. Vijay Balasubramaniyan
      role: Co-founder, CEO
      background: Georgia Tech PhD; leads strategy, technical vision and public policy advocacy on voice security.
      claimRefs:
        - CO006
    - name: Dr. Paul Judge
      role: Co-founder
      background: Former Barracuda CTO and serial security entrepreneur.
