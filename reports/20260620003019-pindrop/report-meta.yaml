  foundingLocation: Atlanta, Georgia, USA
  headquarters: Atlanta, Georgia, USA
  productSummary: Pindrop sells an enterprise voice-security platform spanning Pindrop Protect (fraud detection), Pindrop Passport (authentication) and Pindrop Pulse / Pulse Inspect (audio deepfake detection). The platform fuses six signal types — voice, device, network, behavior, risk and liveness — into a multifactor risk score, and the Pulse line uses deep neural networks and a proprietary fakeprint methodology to detect synthetic speech in real time, integrated through contact-center and cloud channels.
  customerFocus: Large enterprises in banking, insurance, healthcare, retail and telecom that operate high-volume contact centers.
  businessModel: Enterprise SaaS / subscription licensing of voice authentication, fraud and deepfake-detection products, sold directly and through partner channels (Five9, NICE, Google Cloud, AWS), with a reimbursement-capped Pulse Deepfake Warranty.
  stage: Series D private (venture-backed)
  fundingStatus: More than $200M of equity raised across Series A–D (Series C $75M in 2016, Series D ~$90M in 2019), plus a $100M venture-debt facility from Hercules Capital in July 2024; no current valuation disclosed.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO017
    - CO018
