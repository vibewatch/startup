      - number: '5.3'
        title: Detection Architecture
        blocks:
          - type: paragraph
            body: >-
              Technically, Pindrop's deepfake defense rests on understanding how synthetic speech is made. Modern
              text-to-speech follows a text-to-acoustic-model-to-vocoder pipeline, and because many generators reuse
              shared vocoder components such as HiFi-GAN, Pindrop can learn generator-specific fingerprints that
              transfer to unseen systems. The Pulse engine uses deep neural networks to score short audio segments —
              about 250ms each — across roughly two seconds of audio in around 150ms with continuous scoring. The
              central abstraction is the "fakeprint," a low-rank unit-vector representation that captures
              synthetic-voice artifacts compactly. This methodology underpinned Pindrop's attribution of the Biden
              robocall to ElevenLabs using fakeprint analysis across 155 segments. Fusing this synthetic-voice signal
              with device, behavior and liveness signals into one risk score improves robustness against single-vector
              spoofing, which is the architectural thesis distinguishing Pindrop from narrow point detectors.
            claimRefs:
