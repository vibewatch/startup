  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              In customer terms, Pindrop is a real-time decision layer for the enterprise voice channel: as a caller
              speaks, the platform authenticates legitimate customers and flags likely fraud before an agent or IVR
              completes a sensitive action. It does this by fusing six signal classes — voice, device, network,
              behavior, risk and liveness — into a single risk score that downstream Protect and Passport products act
              on. In production the system scores each call as audio streams, returning authentication or fraud signals
              inline so the contact center can route, challenge or clear the interaction. Pindrop also publishes
              voice-authentication concepts to standardize buyer understanding of the category. The defining workflow
              property is that detection happens continuously and quickly enough to influence the live call, not in
              batch afterward, which is what makes it usable as an authentication control rather than a forensic tool.
            claimRefs:
