      - number: '2.2'
        title: Sizing Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Rather than rely on a single broad number, the analysis triangulates three lenses. The narrowest is the
              voice-biometrics market, sized near $1.1B in 2020 and forecast toward $3.9B by 2026 at roughly 22.8% CAGR.
              The widest is the overall biometric-system market, estimated at $33.18B in 2025 and projected toward
              $113.22B by 2034 at about 11.48% CAGR. The most speculative is the CEO's $110B generative-AI trust
              opportunity, which is directional rather than bottom-up. Together these bound a serviceable opportunity
              that is large and growing but imprecise, and an independent NPR-cited benchmark showing Pindrop Pulse at
              96.4% accuracy reinforces that accuracy, not just market size, is what buyers will pay for. The lenses are
              preserved separately because collapsing them into one figure would overstate precision.
