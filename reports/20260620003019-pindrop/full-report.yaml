      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is pulled forward by a roughly 60% two-year rise in contact-center fraud, a 450% jump in deepfake
              attacks in the first half of 2024 versus all of 2023, and an even larger 760% increase across 2023 to
              2024. The FBI's 2026 report — cybercrime losses at a $20B high with spoofing dominant — reinforces
              urgency, as does a 53% year-over-year rise in financial-sector fraud. ROI evidence such as about $25M in
              handle-time savings across 33 customers and documented IVR-containment gains supports the buying case.
              Constraints temper this: switching costs, integration effort and consumer-trust concerns slow rollout, and
              regulation cuts both ways by spurring accountability while imposing biometric-consent limits. Liveness
              detection and rising consumer voice-assistant use further normalize the category even as adversaries grow
              more capable.
