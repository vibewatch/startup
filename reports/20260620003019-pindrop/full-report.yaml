          - type: paragraph
            body: >-
              Pindrop has raised more than $200M of equity across four priced rounds — Series A in 2013, Series B in
              2014, a $75M Series C in 2016 led by Andreessen Horowitz with Goldman Sachs, CapitalG and IVP, and a
              roughly $90M Series D in 2019 led by Vitruvian Partners. Its investor base also includes GV, Citi
