        title: Revenue Streams and Pricing
        blocks:
          - type: paragraph
            body: >-
              Pindrop earns income from three subscription product lines — authentication, fraud prevention and
              synthetic-voice defense — sold to large enterprises on an enterprise and usage basis tied to call volume
              and module mix. The newer deepfake line is scaling alongside the established authentication and fraud
              products, gradually shifting the revenue mix toward AI-era detection. A Fortune 500-weighted customer base
              supports higher contract values and durable revenue, while subscription terms paired with a
              reimbursement-capped warranty introduce revenue-recognition and contingency nuances that diligence should
              examine. Demand is reinforced by a large biometric-system market backdrop and by rising deepfake fraud
              that sustains the fastest-growing line. None of these dynamics, however, substitute for disclosed pricing
              tiers or contract economics, which Pindrop does not publish, so the revenue picture is qualitative and
