chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage and Business Model
        blocks:
          - type: paragraph
            body: >-
              Pindrop is a privately held voice-security company founded in 2011 in Atlanta, Georgia by three Georgia
              Tech PhDs whose research targeted telephone-channel fraud. The company positions itself as a "Real Human
              and Right Human" platform built for the AI era, combining acoustic, device and behavioral signals to
              authenticate legitimate callers and intercept fraudsters. Its commercial footprint spans three flagship
              products — Pindrop Protect for fraud detection, Pindrop Passport for authentication, and Pindrop Pulse for
              deepfake detection — sold primarily to large enterprises. Pindrop reports that seven of the ten largest US
              banks rely on its technology, alongside leading insurers, healthcare providers and retailers. The business
              remains venture-backed rather than public, and it anchors its narrative on protecting the voice channel as
              generative AI makes synthetic speech cheap and convincing.
