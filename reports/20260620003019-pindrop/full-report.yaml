  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Pindrop sits in a contact-center security landscape populated by large incumbents and focused specialists.
              Direct peers include NICE, Verint and Microsoft-owned Nuance, all of which carry authentication
              capabilities inside broader platforms, while specialists such as ID R&D — now owned by Mitek — compete on
              liveness. The default alternatives are knowledge-based authentication and internal build, which many
              enterprises still run. The most consequential recent shift is Amazon's May 2026 retirement of Connect
              Voice ID; AWS now points customers toward Pindrop, effectively converting a hyperscaler competitor into a
              referral source. Likely future entrants include open-source deepfake detectors and cloud platforms
              embedding native detection, and internationally Pindrop's SK Telecom partnership opens Korea while
              exposing it to regional telecom-native offerings. The landscape is therefore consolidating around platform
              incumbents and deepfake-focused specialists, with Pindrop straddling both through partnerships.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP035
              - CP026
