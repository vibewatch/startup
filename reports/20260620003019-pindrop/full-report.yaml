  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Pindrop's addressable market centers on authenticating and protecting the enterprise voice channel —
              contact-center authentication, fraud detection and deepfake defense — rather than consumer device unlock
              or general identity verification. The status-quo substitutes it displaces are knowledge-based questions,
              one-time passcodes and manual agent verification, all of which are slow and increasingly defeated by
              attackers. Adjacent opportunities include IVR automation, fraud analytics and wider identity verification,
              which can expand wallet share over time. A notable boundary shift is Amazon's decision to retire Connect
              Voice ID, which vacates demand that specialist vendors can absorb. Asia-Pacific expansion further widens
              the serviceable footprint. Defining the boundary this way keeps sizing honest: the relevant spend is
              contact-center security budgets, not the entire biometrics universe, even though that universe provides
              useful upper-bound context.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM033
              - CM024
