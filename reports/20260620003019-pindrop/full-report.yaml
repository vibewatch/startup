        title: Buyers, Payers and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The primary buyers are fraud-operations, contact-center and security leaders at banks, insurers,
              healthcare providers and retailers, with budget ownership usually sitting in fraud and customer-experience
              functions rather than core IT. Adoption typically flows from awareness, through a proof-of-value pilot,
              into production, and then expands across additional lines of business. Fraud concentration varies sharply
              by vertical: roughly one in 99 calls is fraudulent at large retailers versus about one in 600 across
              Pindrop's base, and states that restrict biometrics show about double the fraud rate while accounting for
              a third of US fraud losses. Cloud-marketplace availability broadens the top of the buyer funnel, and
              independent market maps situate Pindrop squarely among voice-security and anti-fraud vendors competing for
              these same enterprise budgets.
