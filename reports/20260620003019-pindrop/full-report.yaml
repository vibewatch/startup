        title: Trust, Privacy and Compliance
        blocks:
          - type: paragraph
            body: >-
              On trust and compliance, Pindrop pairs detection with provenance and standards engagement. Source-tracing
              research aims to identify which generator produced a given sample, and in April 2026 Pindrop researchers
              and its chief legal officer filed a NIST NCCoE comment proposing delegation provenance chains, signaling a
