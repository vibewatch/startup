        title: Sizing Gaps and Conflicting Estimates
        blocks:
          - type: paragraph
            body: >-
              Several gaps qualify the market story. There is no public bottom-up SOM that maps Pindrop's wallet share
              onto the analyst TAM, so the serviceable estimate remains inferred rather than measured. Vendor and
              analyst figures also diverge — the disciplined analyst forecasts cluster in the single-digit billions for
              voice biometrics, while the CEO's $110B generative-AI framing is far larger — and both are preserved side
              by side rather than averaged. Freshness is mixed: the voice-biometrics forecast targets 2026 and is
              current, but some component studies project to 2034 and rest on pre-2026 baselines. Macro fraud growth and
              AI voice cloning clearly accelerate the opportunity, yet converting that tailwind into a defensible
              Pindrop-specific number requires private revenue and pipeline data the company does not disclose, which
              diligence must obtain before underwriting any precise share assumption.
