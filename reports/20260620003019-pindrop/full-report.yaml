      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Processing voice biometrics places Pindrop squarely under BIPA, CCPA and GDPR consent and data-handling
              obligations, with state restrictions in markets like Illinois adding enrollment friction and litigation
              exposure. The FCC's move to make AI-generated robocall voices illegal, confirmed by multiple outlets,
              simultaneously validates demand and raises compliance complexity for the broader ecosystem. The Pulse
              Deepfake Warranty is a notable legal exposure: it creates contingent reimbursement liabilities, capped by
              stated terms, that diligence must size against potential claim volume. Pindrop's 300-plus patent estate is
              a defensive moat but remains subject to challenge and design-around. No material public litigation or
              enforcement action was identified, though limited disclosure constrains certainty. Offsetting these risks,
              Pindrop engages regulators directly — testifying at Senate AI forums and the House Financial Services
              working group and backing the TAKE IT DOWN Act — which both reduces surprise risk and signals that the
              regulatory environment is consequential to the business.
