      - number: '7.3'
        title: Operational and Security Risk
        blocks:
          - type: paragraph
            body: >-
              The deepfake arms race is the dominant operational risk: staying effective requires relentless retraining
              against new generators, and any lag directly degrades protection. University of Waterloo research shows
              signal modifications can evade voice-liveness countermeasures — a capability risk Pindrop disputes but
              that diligence cannot dismiss. Zero-day tools never seen in training are an inherent challenge that
              Pindrop addresses through shared-vocoder generalization, with mixed initial accuracy before retraining.
              Production false positives or accuracy degradation could damage customer trust if detection misfires, and
              the real-time low-latency architecture makes outages and latency spikes a reliability risk for contact
              centers. Centralizing voice-biometric data also makes Pindrop a high-value breach target. Seasonal
              deepfake surges against retailers and the rapid emergence of incidents like the Biden robocall illustrate
              how quickly novel attacks appear, underscoring that operational resilience here is a continuous race
              rather than a solved problem, even as Pindrop has demonstrated strong attribution capability.
