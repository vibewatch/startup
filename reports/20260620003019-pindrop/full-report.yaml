      - number: '5.5'
        title: Differentiation, IP and Data
        blocks:
          - type: paragraph
            body: >-
              Pindrop's differentiation is a combination of purpose-built deepfake models, multifactor signal fusion and
              a proprietary data advantage. A peer-reviewed 2020 Odyssey publication reported a 1.26% equal-error-rate
              on ASVspoof 2019 alongside a winning challenge submission, and the company detected Meta's Voicebox at
              about 90% initially and over 99% after retraining. A collaboration with Nvidia on early Riva Magpie access
              reached 99.2% accuracy after retraining on 40,000 seconds of audio, demonstrating fast adaptation to new
              generators. Underpinning this is a portfolio exceeding 300 patents and a large, continuously labeled audio
              corpus spanning hundreds of generators that is hard to replicate. The durable edge is less any single
              model than the generalization approach — detecting shared generator fingerprints rather than memorized
              samples — which is what enables zero-day coverage and is corroborated by security-press coverage and
