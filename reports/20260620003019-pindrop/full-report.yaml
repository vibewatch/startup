      - number: '5.2'
        title: Product Module Map
        blocks:
          - type: paragraph
            body: >-
              The portfolio comprises four principal products. Pindrop Protect targets fraud detection, Pindrop Passport
              handles authentication, Pindrop Pulse provides real-time deepfake detection in the contact center, and
              Pulse Inspect extends synthetic-media analysis to media and government use cases. Pulse Inspect reports
              roughly 99% accuracy, trained across more than 350 deepfake tools, over 20 million utterances and 40-plus
              languages, signaling breadth beyond the call center. Caller-risk capabilities combine identity and
              behavioral signals to score inbound calls, and the underlying Phoneprinting technology analyzes device and
              call-path characteristics as one core signal class. Together these modules let Pindrop sell a graduated
              stack — from authentication of known customers to detection of novel synthetic attacks — so enterprises
              can adopt incrementally. The module map is the clearest expression of how Pindrop converts its research
              into discrete, separately purchasable SKUs.
