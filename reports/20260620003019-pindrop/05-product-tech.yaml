callouts:
  - calloutType: strength
    title: Generalization, not memorization
    body: By learning shared generator fingerprints, Pindrop detects zero-day synthetic voices it has never seen, evidenced by fast retraining to 99.2% accuracy with Nvidia.
    claimRefs:
      - CE011
      - CE014
  - calloutType: risk
    title: Detection is adversarial
    body: University research showing signal-modification evasion confirms that detection accuracy must be continuously re-earned against improving attackers.
    claimRefs:
      - CE026
      - CE012
  - calloutType: insight
    title: IP and data depth
    body: A 300+ patent portfolio and a multi-generator labeled corpus form a defensible technical moat beyond any single model.
    claimRefs:
      - CE013
      - CE022
