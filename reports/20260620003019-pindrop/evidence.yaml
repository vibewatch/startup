evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover metrics financials
    missingEvidence: Audited revenue, ARR, valuation and exact customer count.
    whyItMatters: Without disclosed financials the cover relies on company-reported aggregates and a capital summary.
    diligencePath: Request a management financial package and cap table under NDA.
  - type: stale
    severity: minor
    topic: funding freshness
    missingEvidence: Confirmation that no financing has occurred since the July 2024 Hercules facility.
    whyItMatters: A newer round would reset valuation and dilution analysis.
    diligencePath: Check SEC Form D filings and press through 2026.
  - type: conflicting-data
    severity: material
    topic: sizing estimates conflict
    missingEvidence: Reconciliation between single-digit-billion analyst forecasts and the $110B gen-AI framing.
    whyItMatters: The two figures imply very different upside and must not be blended.
    diligencePath: Obtain Pindrop pipeline and revenue data to anchor a bottom-up SOM.
  - type: missing-source
    severity: material
    topic: serviceable market share
    missingEvidence: A defensible Pindrop wallet-share or SOM estimate.
    whyItMatters: Underwriting returns requires converting TAM into capturable revenue.
    diligencePath: Triangulate customer count, ACV and renewal data under NDA.
  - type: missing-source
    severity: minor
    topic: competitor pricing
    missingEvidence: Published list prices or contract benchmarks for NICE, Verint and Nuance authentication.
    whyItMatters: Pricing comparison is directional without contract-level data.
    diligencePath: Collect anonymized customer pricing during reference calls.
  - type: conflicting-data
    severity: material
    topic: deepfake detection durability
    missingEvidence: Independent re-test of Pindrop accuracy against evolving open-source detectors.
    whyItMatters: Moat durability hinges on whether the accuracy lead persists as adversaries adapt.
    diligencePath: Commission a current third-party deepfake-detection benchmark.
  - type: private-evidence-only
    severity: blocking
