  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图
        blocks:
          - type: paragraph
            body: >-
              Pindrop 所处的是由大型既有厂商和聚焦型专家共同构成的联络中心安全市场。直接同业包括 NICE、Verint 和 Microsoft 旗下 Nuance，它们都把认证能力嵌入更宽的平台；ID R&D
              等专家厂商——现已归 Mitek 所有——则围绕活体检测竞争。默认替代方案是知识型认证和内部自建，许多企业仍在使用。最近最关键的变化是 Amazon 于 2026 年 5 月退役 Connect Voice
              ID；AWS 现在把客户引向 Pindrop，实际上把一个超大云竞争者转成推荐来源。未来可能进入者包括开源深伪检测器和嵌入原生检测能力的云平台；国际上，Pindrop 与 SK Telecom
              的合作打开韩国市场，同时也让它面对区域电信原生方案。因此，市场正在围绕平台既有厂商和深伪聚焦专家整合，Pindrop 通过合作伙伴横跨两端。
