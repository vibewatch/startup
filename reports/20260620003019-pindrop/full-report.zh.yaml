      - number: '2.4'
        title: 增长驱动和采用约束
        blocks:
          - type: paragraph
            body: >-
              需求被几股力量提前拉动：联络中心欺诈两年约增长 60%，2024 年上半年深伪攻击较 2023 全年跳升 450%，2023 至 2024 年更录得 760% 的增幅。FBI 2026 年报告显示网络犯罪损失创
              $20B 高位且 spoofing 占主导，进一步强化紧迫感；金融行业欺诈同比增长 53% 也如此。ROI 证据，如 33 个客户合计约 $25M 的处理时长节省和有记录的 IVR
              拦截提升，支撑采购理由。约束也在压低速度：切换成本、集成工作和消费者信任顾虑拖慢上线；监管一方面推动问责，另一方面施加生物识别同意限制。活体检测和消费者语音助手使用上升进一步让这一品类常态化，但对手也在变得更强。
