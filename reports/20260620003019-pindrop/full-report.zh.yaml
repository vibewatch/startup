        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Pindrop 的客户基础横跨银行、保险、医疗、零售和电信企业，其中银行是主导垂直，领先美国金融机构多数在其账户中。除最大银行外，具名部署还延伸到信用合作社、社区和亲和型机构、保险公司和医疗机构；医疗机构采用
              Pindrop，部分是为满足患者验证和合规需求。零售客户部署 Pindrop，是为打击数百个目标店面的退款滥用。地域上，足迹以北美为中心，但国际化正在增强，SK Telecom
              已在韩国生产使用，亚太扩张也在推进。创纪录欺诈损失和增长中的生物识别市场强化了各细分买方的紧迫感。因此，分层图景在纸面上很宽，但明显偏向金融服务；这既是可信度信号——银行是要求严苛的买方——也是集中度考量，后续分析收入耐久性时会回到这一点。
