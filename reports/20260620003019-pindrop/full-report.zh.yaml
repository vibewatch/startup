      - number: '5.3'
        title: 检测架构
        blocks:
          - type: paragraph
            body: >-
              技术上，Pindrop 的深伪防御建立在理解合成语音生成方式之上。现代文本转语音遵循文本到声学模型再到声码器的流水线；许多生成器复用 HiFi-GAN 等共享声码器组件，因此 Pindrop
              可以学习可迁移到未知系统的生成器特定指纹。Pulse 引擎用深度神经网络给短音频片段评分——每段约 250ms——在约两秒音频上用约 150ms
              完成连续评分。核心抽象是「fakeprint」，一种低秩单位向量表示，能紧凑捕捉合成语音伪迹。该方法支撑了 Pindrop 对 Biden 机器人电话的归因：用 fakeprint 分析 155 个片段，将其指向
              ElevenLabs。把这种合成语音信号与设备、行为和活体信号融合成一个风险评分，可提升对单一向量 spoofing 的鲁棒性；这也是 Pindrop 区别于狭窄单点检测器的架构论点。
