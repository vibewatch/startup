            tableRef: TR005
            claimRefs:
              - CR033
              - CR034
              - CR037
      - number: '7.7'
        title: 图表
        blocks:
          - type: callout
            title: 军备竞赛是核心风险
            body: 如果对抗性语音生成快过检测，Pindrop 的价值主张就会被侵蚀；这是最重大的单一风险，也要求公司持续投入昂贵重训。
            calloutType: risk
            claimRefs:
              - CR002
              - CR014
          - type: callout
            title: 或有负债与披露敞口
            body: 保修责任、生物识别隐私规则和有限财务披露叠加，留下实质性残余敞口，尽调必须用硬数据量化。
            calloutType: risk
            claimRefs:
              - CR008
