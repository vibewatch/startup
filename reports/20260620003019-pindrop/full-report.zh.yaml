      - number: '2.2'
        title: 多视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              分析不依赖单一宽口径数字，而是用三重视角交叉校准。最窄的是语音生物识别市场，2020 年规模约 $1.1B，预计到 2026 年接近 $3.9B，CAGR 约 22.8%。最宽的是整体生物识别系统市场，2025
              年估计为 $33.18B，预计到 2034 年达 $113.22B，CAGR 约 11.48%。最具推测性的是 CEO 所称 $110B 生成式 AI
              信任机会，它更偏方向性，并非自下而上测算。三者共同框定了一个大且增长、但不精确的可服务机会；NPR 引用的独立基准显示 Pindrop Pulse 准确率达
              96.4%，也强化了买方真正愿意付费的不只是市场规模，还有准确率。各视角被分开保留，因为把它们压成一个数字会夸大精确度。
