              年信贷额度之后，资本位置也显得舒适。不过，没有披露毛利率，利润率路径无法证明；盈亏平衡说法也未验证。因此，主要尽调阻碍是未披露收入、未审计利润率、未验证的盈亏平衡主张，以及银行业收入集中。财务估算区间可以框定可能图景，但只有管理层财务、股权结构表和审计报表，才能把这些推断转化为承销级结论。在此之前，本章基于可得信号把
