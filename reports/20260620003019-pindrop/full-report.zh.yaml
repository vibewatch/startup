        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              从客户视角看，Pindrop 是企业语音渠道的实时决策层：来电者说话时，平台在坐席或 IVR 完成敏感操作前认证合法客户，并标记可能的欺诈。它把语音、设备、网络、行为、风险和活体六类信号融合成单一风险评分，下游
              Protect 和 Passport 产品据此行动。生产环境中，系统随音频流对每通电话评分，内联返回认证或欺诈信号，让联络中心能够路由、挑战或放行交互。Pindrop
              还发布语音认证概念，帮助买方统一理解这一品类。决定性工作流属性是，检测连续发生且速度足以影响实时通话，而不是事后批处理；这让它能作为认证控制，而不只是取证工具。
