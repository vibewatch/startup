    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段和商业模式
        blocks:
          - type: paragraph
            body: >-
              Pindrop 是一家非上市语音安全公司，2011 年在 Georgia 州 Atlanta 创立，三位 Georgia Tech 博士的早期研究瞄准电话渠道欺诈。公司把自己定位成面向 AI 时代的「Real
              Human and Right Human」平台，靠声学、设备和行为信号认证真实来电者并拦截欺诈者。商业版图覆盖三款旗舰产品：用于欺诈检测的 Pindrop Protect、用于认证的 Pindrop
              Passport，以及用于深伪检测的 Pindrop Pulse，主要卖给大型企业。Pindrop
              称，美国十家最大银行中有七家依赖其技术，客户还包括领先保险公司、医疗机构和零售商。公司仍由风险资本支持，并未上市；其叙事核心是：生成式 AI 让合成语音便宜且逼真，语音渠道需要被保护。
