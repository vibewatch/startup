  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和替代方案
        blocks:
          - type: paragraph
            body: >-
              Pindrop
              的可服务市场聚焦企业语音渠道的认证和保护——联络中心认证、欺诈检测和深伪防御——而不是消费设备解锁或通用身份验证。它替代的现状方案是知识型问题、一次性密码和人工坐席核验；这些方案速度慢，也越来越容易被攻击者攻破。相邻机会包括
              IVR 自动化、欺诈分析和更广义的身份验证，可随时间扩大钱包份额。一个显著边界变化是 Amazon 决定退役 Connect Voice
              ID，释放出专业厂商可承接的需求。亚太扩张进一步扩大可服务版图。这样划定边界能让规模测算更诚实：相关支出来自联络中心安全预算，不是整个生物识别宇宙，尽管后者能提供有用的上限背景。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM033
              - CM024
