      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              处理语音生物识别，让 Pindrop 直接落在 BIPA、CCPA 和 GDPR 的同意与数据处理义务之下；Illinois 等市场的州级限制增加注册摩擦和诉讼暴露。FCC 将 AI
              生成机器人电话语音定为非法，且被多家媒体确认，这一行动同时验证需求，也提高整个生态的合规复杂度。Pulse Deepfake Warranty
              是一项值得注意的法律暴露：它创造了有条件赔付负债，虽受明示条款封顶，但尽调必须按潜在索赔量测算。Pindrop 的 300
              多项专利资产是防御性护城河，但仍可能遭遇挑战和规避设计。未发现重大公开诉讼或执法行动，不过披露有限，确定性受限。抵消这些风险的是，Pindrop 直接参与监管——在参议院 AI
              论坛和众议院金融服务工作组作证，并支持 TAKE IT DOWN Act——这既降低意外风险，也显示监管环境对业务至关重要。
