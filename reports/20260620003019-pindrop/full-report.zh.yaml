      - number: '2.3'
        title: 买方、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              主要买方是银行、保险公司、医疗机构和零售商中的欺诈运营、联络中心和安全负责人；预算归属通常在欺诈和客户体验职能，而非核心
              IT。采用路径通常从认知开始，经过价值验证试点，进入生产环境，再向更多业务线扩展。欺诈集中度随垂直行业大幅变化：大型零售商约每 99 通电话就有 1 通欺诈，Pindrop 客户基数中约每 600 通 1
              通；限制生物识别的州，欺诈率约翻倍，同时贡献美国三分之一欺诈损失。云市场可用性拓宽了买方漏斗顶部，独立市场地图也把 Pindrop 明确放在争夺同一企业预算的语音安全和反欺诈厂商之中。
