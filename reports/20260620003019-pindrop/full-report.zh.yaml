      - number: '7.5'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              永不停歇的重训竞赛很耗资本，也会维持较高 R&D
              现金消耗；对一家仍在扩张的公司来说，这是财务模型的核心风险。为此提供资金的创业债务又引入了契约和再融资风险；一旦增长或现金生成不及预期，风险比股权更尖锐，因为债务无论业绩如何都要偿付。竞争和 R&D
              压力也会带来利润率压缩风险，即使 Pindrop
              定位高端，守住准确率领先也很昂贵。更复杂的是，公开财务披露有限，尽调很难看清真实现金消耗、利润率和留存，只能依赖管理层对现金流盈亏平衡的陈述。最后，如果发生严重高损失事件，保修赔付和直接欺诈损失敞口可能挤压模型。单看每一项都不足以否决投资，CEO
              所称的盈亏平衡姿态也让人安心；但合在一起，财务风险应靠硬数据评估——契约条款、现金消耗和保修索赔历史——而不是只听叙事。
