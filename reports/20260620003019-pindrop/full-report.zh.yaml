            body: >-
              联合创始人 Dr. Vijay Balasubramaniyan 以 CEO 身份领导 Pindrop，也是公司在 AI 政策上的主要公开发声者；另外两位联合创始人 Dr. Paul Judge（前
              Barracuda CTO）和 Dr. Mustaque Ahamad（Georgia Tech 教授）奠定了早期研究基础。2022 至 2023 年，公司补强了高管层：来自 Bandwidth 的 CFO
