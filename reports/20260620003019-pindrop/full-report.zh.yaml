  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Pindrop
              的风险画像主要由不断升级的深伪军备竞赛主导，其后紧跟监管和生物识别隐私暴露，再往后是融资和集中度风险。按严重性、发生可能性和剩余暴露排序，最重要的单一风险是对抗性语音生成跑赢检测，侵蚀客户付费购买的核心价值主张。监管、隐私和
              warranty
              暴露即使在主动缓释后仍保留重大剩余风险，因为它们取决于第三方规则制定和管理层控制之外的或有事件。这些风险并不独立：一次高调检测失误或不利生物识别裁决，会通过客户流失传导到收入和利润率，最终进入估值。本章依次评估监管
              / 法律、运营 / 安全、合作伙伴 / 依赖，以及财务 / 模型风险，并以缓释措施和 thesis-break 触发条件收束，给出基于证据的判断：Pindrop
              管理良好，但结构上暴露在快速变化的对抗和监管动态之下。
