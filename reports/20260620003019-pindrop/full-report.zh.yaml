      - number: '2.5'
        title: 规模测算缺口和估算冲突
        blocks:
          - type: paragraph
            body: >-
              市场叙事存在多个限定条件。没有公开的自下而上 SOM 把 Pindrop 钱包份额映射到分析师
              TAM，因此可服务估算仍是推断，而非实测。厂商和分析师数字也分化：严谨的分析师预测集中在语音生物识别的数十亿美元量级，而 CEO 的 $110B 生成式 AI
              叙事大得多；两者并列保留，不做平均。新鲜度也不一致：语音生物识别预测目标年是 2026，仍算当前；但一些组件研究延伸到 2034，并基于 2026 前的基线。宏观欺诈增长和 AI
              语音克隆显然在加速机会，但要把顺风转化为可辩护的 Pindrop 专属数字，需要公司未披露的私有收入和管线数据；尽调在承销任何精确份额假设前必须取得这些数据。
            claimRefs:
              - CM029
              - CM027
              - CM028
