      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 deepfake 需求持续复合增长，Pindrop 守住准确率领先，多产品扩张拉升净留存；deepfake
              检测线和国际扩张是主要上行杠杆。基准情景假设公司在增长市场中稳步拿份额，利润率适中，并延续品类领导；创纪录欺诈损失和银行验证紧迫性带来的宏观顺风提供支撑。熊市情景假设 Big Tech
              原生商品化检测，或一次高知名度公开失误触发流失并损害价值。鉴于证明强但披露和军备竞赛风险未解，概率权重偏向基准情景。估值对收入增长和退出倍数最敏感，其次是里程碑概率和利润率；增长或倍数的小幅变化都会显著摆动结果。情景区间之所以宽，正因为同一个对抗动态既创造了
              Pindrop 的机会，也制造了主要下行；在这里，明确假设和可监控触发点比单一点估值更重要。
            claimRefs:
