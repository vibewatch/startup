companyProfile:
  summary: >-
    Pindrop 是一家非上市语音安全公司，创立于 Atlanta，服务企业联络中心，通过认证真实来电者、拦截欺诈和音频深伪来保护语音渠道。公司 2011 年由三位 Georgia Tech
    博士创立，把声学、设备（Phoneprinting）、网络、行为、风险和活体信号融合成多因子风险评分，并从认证和欺诈检测扩展到 Pulse 系列的深伪检测。到 2026
    年，美国最大银行中的多数，以及领先保险公司、医疗机构和电信公司，已进入其客户名单；AWS 也把 Pindrop 指定为退役 Connect Voice ID
    的推荐替代方案。公开证据显示其确有品类领导力和强验证，但公司不披露收入、ARR、利润率或当前估值。
