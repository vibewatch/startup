      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              可比组混合了按增长调整收入倍数交易的上市企业安全和生物识别厂商、voice-AI M&A 参照点，以及近期私募轮。最有参考意义的 M&A 锚点是 Microsoft 收购 Nuance、Mitek 收购 ID
              R&D，它们框定了大型收购方给语音和生物识别能力的战略价值。Pindrop
              的多因子风险评分平台支持相对单点方案的溢价定位。如果增长和留存得到验证，高个位数到低双位数收入倍数可以辩护，但需要因财务不透明打折。局限也很大，必须讲清楚：Pindrop 是私营公司，财务未披露，deepfake
              聚焦也独特，因此每个可比都不完美，得出的区间只能指示方向，不能精确计价。因此，可比公司最好用来框定预期、压力测试报价，而不是推导唯一权威估值；它们也再次说明，披露访问权是自信定价的门槛。
