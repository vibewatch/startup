      - number: '8.6'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Pindrop 可以通过战略收购退出；随着披露成熟，也可能最终 IPO。潜在收购方包括云、安全和联络中心平台，Nvidia 与 AWS
              的关系暗示了战略兴趣。最清晰的终止触发点是失去独立准确率领先、限制核心部署的不利生物识别裁定，或创业债务契约违约；任何一个都会实质性损害投资逻辑。最终尽调问题直接构成任何承诺前的门槛：经审计财务、队列留存数据、完整契约条款，以及在对抗条件下测试准确率主张的独立基准或红队结果。这些材料合在一起，才能把强定性案例转化为可承销案例。结论是，Pindrop
              是一家高质量、领导得当、资本充足的业务，处在结构性增长市场中，值得认真尽调；但最终投资价值取决于私有数据和有纪律的入场价格，而不是仅靠公开记录。
            claimRefs:
              - CV027
