      - CR023
      - CR025
      - CR026
  - id: FV001
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向投委会的尽调维度评分（满分 10 分）。
    data:
      items:
        - label: 市场吸引力 — 8 / 10
        - label: 客户验证 — 8 / 10
        - label: 护城河耐久度 — 6 / 10
        - label: 单位经济性 — 5 / 10
        - label: 风险画像 — 5 / 10
        - label: 估值透明度 — 4 / 10
        - label: 证据质量 — 6 / 10
    claimRefs:
      - CV006
      - CV007
      - CV031
  - id: FV002
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从证据到建议的推导链。
    data:
      nodes:
        - id: market
          label: 大且增长的市场
        - id: proof
          label: 明确点名的强客户验证
        - id: moat
          label: 可被挑战的护城河
        - id: risk
          label: 军备竞赛 + 披露风险
        - id: val
          label: 未披露估值
        - id: rec
          label: 有条件正面：尽调
      edges:
        - from: market
          to: rec
        - from: proof
          to: rec
        - from: moat
          to: rec
        - from: risk
          to: rec
        - from: val
          to: rec
    claimRefs:
      - CV008
      - CV007
      - CV009
  - id: FV003
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值对关键驱动因素的相对敏感度（指数）。
    data:
      items:
        - label: 收入增长
          value: 100
        - label: 退出倍数
          value: 85
        - label: 里程碑概率
          value: 55
        - label: 利润率
          value: 40
        - label: 稀释 / 优先权
          value: 30
    approximationNotes: 敏感性指数只是相对权重示意，并非校准模型。
    claimRefs:
      - CV020
      - CV026
  - id: FV004
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 各情景下的回报倍数示意。
    data:
      items:
        - label: 悲观
          low: 0
          mid: 0.5
          high: 1
        - label: 基准
          low: 1.5
          mid: 2.5
          high: 3.5
        - label: 乐观
          low: 4
          mid: 6
          high: 8
    approximationNotes: 回报倍数仅用于展示情景差异，并非承销测算结果。
    claimRefs:
      - CV010
      - CV017
      - CV019
