    title: 风险传导图
    type: dag
    layout: wide
    summary: 触发事件如何传导成估值影响。
    data:
      nodes:
        - id: trigger
          label: 漏检 / 不利裁定
        - id: trust
          label: 客户信任流失
        - id: churn
          label: 流失 / 增长放缓
        - id: rev
          label: 收入与利润率承压
        - id: fin
          label: 融资 / 契约压力
        - id: val
          label: 估值受损
      edges:
        - from: trigger
          to: trust
        - from: trust
          to: churn
        - from: churn
          to: rev
        - from: rev
          to: fin
        - from: rev
          to: val
        - from: fin
          to: val
    claimRefs:
