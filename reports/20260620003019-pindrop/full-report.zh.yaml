            body: >-
              一旦 Pindrop 接入 IVR 和欺诈工作流，切换成本就会上升；帮助客户迁出 Amazon Connect Voice ID 的迁移工具包，则把竞争对手退出市场转化为 Pindrop
              装机。分销力量有实质意义：Five9 渠道触达超过 3,000 个客户，Pindrop 获得 Five9 ISV 年度合作伙伴和年度解决方案认可，合作伙伴触达还覆盖 NICE、云市场和 Nvidia
