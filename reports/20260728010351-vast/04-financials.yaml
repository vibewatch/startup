callouts:
- calloutType: strength
  title: Monetization design is more mature than the disclosure surface
  body: Tripo has already separated seat plans, API credits, team administration, privacy rights, and workflow upsells into distinct billing surfaces. That is a stronger commercial starting point than a startup that only exposes one generic subscription tier.
  claimRefs:
  - CI001
  - CI005
  - CI013
  - CI014
- calloutType: risk
  title: Funding headlines are cleaner than revenue proof
  body: The company has no shortage of exciting capital raises and user-count headlines, but the retained public record still does not disclose revenue, margins, burn, or enterprise retention. That means the public story is about momentum, not yet financial quality.
  claimRefs:
  - CI022
  - CI023
  - CI027
  - CI037
- calloutType: insight
  title: The real economic test is whether API and Team revenue dominate the mix
  body: If Tripo's best customers are embedding credits, shared workspaces, and governance into repeat workflows, the model can become durable. If most activity remains in free or low-priced creator tiers, impressive scale may still mask weak economics.
  claimRefs:
  - CI029
  - CI030
  - CI038
  - CI039
