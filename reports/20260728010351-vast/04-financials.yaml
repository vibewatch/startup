- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Impossible to translate user and developer counts into actual business scale
    - Request monthly recurring revenue, quarterly revenue, and ARR by product line
  - - Gross margin after inference costs
    - Cannot judge if higher usage creates economic leverage or margin compression
    - Review COGS waterfall including GPU, storage, bandwidth, payment, and support costs
  - - Paid conversion and free cohort quality
    - Large free funnel may or may not monetize efficiently
    - Request free-to-paid conversion by plan and by use case
  - - Enterprise ACV and contract duration
    - Team and API economics could be materially better than self-serve, but magnitude is unknown
    - Request top enterprise contract sizes, standard term length, and renewal rates
  - - Net revenue retention / expansion
    - No proof yet that customers deepen spend as workflows mature
    - Request NRR by API, Team, and creator cohorts
  - - Burn and cash balance
    - Runway cannot be estimated despite large funding headlines
    - Request current cash, monthly burn, and next 12-month operating plan
  - - Cloud / GPU commitments
    - Capital needs could spike if inference or training commitments are locked in
    - Review cloud contracts, reserved compute commitments, and model-training budget
  - - Revenue concentration
    - A few partners or studios could drive an outsized share of revenue
    - Request top-10 customer revenue share and pipeline concentration
  notes: These gaps are the difference between admiring the revenue design and underwriting the business.
