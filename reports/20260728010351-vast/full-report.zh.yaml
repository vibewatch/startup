      - - AI 原生 3D 资产生成软件
        - 文本 / 图像 / 草图转 3D、网格生成、纹理、重拓扑、绑定、导出、工作流插件
        - 通用 LLM 席位、2D 图像生成、非 3D 创作者工具
        - 创作者、工作室、工程团队、设计团队
        - 核心市场，与 Tripo 产品界面直接匹配
      - - 游戏和动画管线
        - 原型道具、环境资产、角色、引擎就绪网格、API 自动化
        - 完整游戏预算、发行支出、广告 UA
        - 美术总监、技术美术、制作负责人
        - 高匹配，因为资产吞吐和引擎兼容性重要
      - - XR / AR / 空间计算
        - 实时 3D 资产、低多边形优化、交互内容、显示管线
        - 仅头显硬件销售、一般 AR 广告支出
        - XR 构建者、空间内容团队、硬件伙伴
        - 需要交互式 3D 和低摩擦迭代的场景匹配强
      - - 电商产品可视化
        - 3D 产品页、WebAR 资产、目录转化、数字原型
        - 整体零售 GMV、支付收入、物流支出
        - 商品运营、增长、数字商业、AR 体验负责人
        - 有吸引力，因为转化和退货率经济性可衡量
      - - 室内 / 工业设计
        - 概念模型、房间规划器、产品可视化、数字样机
        - 完整 CAD/PLM 栈替代、制造资本开支
        - 独立设计师、产品团队、工业设计负责人
        - 有用切入点，但要求更高精度和信任
      - - 教育 / 爱好 / 3D 打印
        - 学生项目、创客资产、可打印模型、创作者实验
        - 全机构 LMS 或教育科技预算
        - 个人、教师、爱好者
        - 良好漏斗顶部，但客单价更低、企业锁定更弱
      - - 现状替代品
        - 人工 Blender/Maya/CAD、摄影测量、服务工作室、素材库
        - N/A
        - 现有美术或设计预算
        - 关键，因为 Tripo 必须替代人工和工作流摩擦，而不只是增加新奇感
    notes: 市场围绕把创意意图转成可用 3D 资产的工作流层定义，而不是围绕总 AI 或总数字经济支出。
