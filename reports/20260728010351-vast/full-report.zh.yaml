    年创立，已从文本和图像生成 3D，扩展到 API、工作流、商业、媒体，以及接近世界模型的产品面。公开报道把 VAST 与 Alibaba 领投的 March 2026 融资，以及规模更大的 June 2026 A+ / A++
    融资联系起来；后者让公司进入独角兽区间，Forbes 引述一名知情人士称估值约 $1.5B。用户采用信号很强，包括 10M 用户和 90K 工作室客户，但这些数字背后的经济性仍未公开。
