    rows:
      - - Tripo AI
        - 免费；Pro 约 $19.9/月 / 年付折合 $13.93；Max 约 $89/月 / 年付折合 $53.94；Team 按席位 定价
        - 积分、并发、网格质量升级、批量生成、私有模型、团队工作区
        - 实际企业定价和 API 经济性未公开
        - 清晰自助阶梯有助于创作者转化，但也暴露直接比价风险
      - - Meshy
        - 免费 $0；Pro $20/mo；Studio $60/mo；Enterprise 定制
        - 积分、更快生成、API 访问、私有所有权、并发、企业控制
        - 促销折扣会改变入门价；企业定价未披露
