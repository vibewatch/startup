      - number: '3.2'
        title: 直接 3D 原生同行
        blocks:
          - type: paragraph
            body: >-
              Meshy 是最重要的直接公开基准，因为它的包装与 Tripo 的重叠度高于任何更宽的多模态平台。Meshy 营销文本 / 图像生成 3D、后处理、导出、插件、REST API
              访问、团队工作区、企业控制和安全姿态；定价页足够透明，买方容易比较；其 2026 年博客 / 新闻节奏也显示，在工作流、打印、智能体创作和伙伴节点工具上快速发货。如果 Tripo
              要证明自己独一无二地生产就绪，Meshy 是成熟客户或投资者最先会调出的反例。

              Stability 是另一类威胁。其公开 3D 产品没有包装成同样精致的创作者工作台，但 Stable Fast 3D 和 Stable Point Aware 3D 缩小了核心生成任务的技术差距，并通过
              API、GitHub 和社区许可证渠道分发。对 Tripo 最不利的证据很直接：Stability 自己的 Stable Fast 3D 仓库称，该模型基于 TripoSR，并加入 UV 展开和材质技术。这意味着
              Tripo 的研究领先可以向外扩散进生态工具，而不是被锁在公司的付费产品面内。NVIDIA 又用与 RTX AI PCs 和 CES 式关注绑定的硬件分发叙事放大了这一威胁。

              结果是两线直接同行竞争。Tripo 必须在打包产品和商业转化层击败 Meshy，同时还要证明端到端工作流宽度能一直领先于开放模型和 API
              生态可低成本重组出的能力。因此，竞争尽调不应只看头部模型质量，还要看转化、留存、团队工作区采用，以及当类似重建能力在其他地方广泛可得后，付费客户是否仍会留下。
