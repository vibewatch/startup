        - 按产品拆分的毛利率、每个生成资产的推理成本，以及云或 GPU 集中度
        - 收入成本重时，AI 原生估值倍数压缩很快。
        - 工程与财务尽调
      - - 股权结构和轮次条款
        - 优先权堆栈、清算优先权、棘轮条款、员工老股条款，以及稀释历史
        - 名义价格可能不等于普通股价值。
        - 法律顾问和融资备忘录审查
      - - 客户质量
        - 具名付费客户 logo、ACV 区间、企业收入占比，以及免费转付费
        - 只有底层收入质量强，10M 用户才值得投资。
        - 销售运营、产品分析和客户访谈核验
    notes: 这些问题正好补上当前阻碍形成更高确信度建议的缺口。
    claimRefs:
      - CV013
      - CV016
      - CV024
