      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Tripo 最强的公开护城河，不是别人都生成不了 3D 物体。公开记录已经否定了这一点。相反，护城河最强的地方，是工作流包装、创作者 UX、导出纪律、团队功能和专属 3D
              身份结合成一个产品，比从模型、仓库和通用创意套件拼栈更容易采用。这是真实价值，尤其对需要反复资产吞吐、而不是偶发 AI 实验的游戏、XR、电商和设计团队来说。

              但护城河裂缝也可见。Meshy 证明另一家创业公司可以用透明定价、企业控制和大规模宣称，包装出高度相似的故事。Stability 证明源自 Tripo
              的研究思路可以传播到开放或半开放生态。Adobe、Luma、OpenAI 和 Microsoft
              证明，周边工作流信任、安全控制、品牌认知和打包客户入口，可能和生成器本身一样重要。这些力量指向一个可能的多归属市场结构：买方测试多个供应商，把手工 DCC 工具留作后备，并避免深度依赖单一供应商，除非
              API、工作区、资产库或协作功能创造真实锁定效应。

              因此，实际尽调问题很简单：Tripo 已经在哪些地方拥有能穿越模型商品化的切换成本？如果付费收入仍主要依赖自助创作者追逐最新模型输出，耐久性就弱。如果收入越来越多落在 API
              驱动的资产流水线、共享工作区、企业治理和重复垂直工作流里，耐久性就更好。在管理层用队列、留存和赢单 / 输单数据证明这次迁移之前，公司应被视为竞争前景不错，但尚未安全筑防。
