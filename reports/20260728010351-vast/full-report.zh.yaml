      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Tripo 的公开财务图景，在架构上最强，在证明上最弱。架构合理：低摩擦获客、与用量挂钩的 API 变现、向商业权利和工作流功能分层增购，以及看起来足以维持产品开发的资本基础。对一家贴近 AI
              基础设施的应用公司来说，模型创新和工作流包装都重要，这正是投资者希望看到的设置。

              但证明缺口大到足以让投资者克制过度自信。公司尚未公开决定其定价面是否有经济吸引力的核心数字：付费转化、收入集中度、实现 ARPU 或
              ARPA、扣除推理和支持后的毛利率、企业留存，以及现金烧钱速度。竞争平台也在发布容易获取的定价，这限制了仅凭标价推断定价权的能力。

              实际结论是，Tripo
              看起来可融资，但尚未能被完整承保。公开信息支持看多资本可得性，也支持对变现设计的中等正面看法。它不支持对效率、收入质量或走向自我维持经济性的时间给出精确判断。除非管理层打开账本，披露结构、利润率和烧钱速度，否则投资逻辑仍取决于相信快速扩张和未来强转化，而不是已经展示的公开财务表现。
