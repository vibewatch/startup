      - number: '8.2'
        title: 可比公司语境与反推约束
        blocks:
          - type: paragraph
            body: >-
              评估 Tripo 估值最诚实的方法，是先看市场语境，再反推公司需要怎样的收入分母。Multiples.vc 和 Acquiry 都认为，2026 年软件倍数仍然两极分化：AI
              原生资产仍能拿到真实溢价，但买方会严格挑剔增长质量、留存和盈利能力。公开创意和 3D 邻近可比公司让这一点落地。Adobe 按市值口径约为当期收入 3.6x，Roblox 和 Unity 更接近 7x 到
              8x。这些同行并不完美，但为创意软件、创作者生态和 3D 工作流基础设施提供了有用的公开市场围栏。


              最重要的私有前沿 AI 可比对象是 Runway。TechCrunch 同时报道了该公司 2025 年 $300M 年化收入目标和 2026 年 $5.3B
              估值。这个倍数不是干净的同口径比较，因为分母是目标而非审计数字；但它说明，对于稀缺且有世界模型邻近性的创意 AI，投资人有时会支付十几倍偏上的倍数。从这个视角看，Tripo 的 $1.5B
              并不荒谬。不过，它确实需要一个有意义的隐藏收入基础：20x 对应约 $75M，15x 对应 $100M，12x 对应 $125M，10x 对应 $150M。没有披露，分母仍是猜测。
