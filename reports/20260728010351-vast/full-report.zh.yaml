      - - TripoSG 图像转 3D 基础模型
        - 基于图像条件输入生成高保真 3D
        - 大规模校正流训练、精选数据、GPU 推理
        - 公开研究有多少能直接落到付费生产接口，仍不清楚
      - - TripoSR 重建模型
        - 快速单图重建，并带来开源技术可信度
        - A100 级基准环境和 CUDA 兼容栈
        - 开源基准速度未必等于真实负载下的产品延迟
      - - 后处理层
        - 分割、重网格化、贴图、绑定、低多边形、格式转换
        - 工作流编排和面向特定模型的编辑工具
        - 过度依赖修复，可能说明首轮输出还不够干净
      - - API 与 SDK 层
        - 以程序化方式创建任务、下载结果、自动化流程，并嵌入应用
        - 认证端点、异步任务处理、客户端库
        - 公开文档没有呈现企业级 SLA 或管理保障
      - - 插件 / 生态适配器
        - Blender、ComfyUI、JS 运行时、Roblox、合作方嵌入、MCP/Cursor
        - 第三方工具兼容性和持续插件维护
        - 每个适配器都会多出一个可能失效或漂移的集成点
    notes: 该架构图依据公开研究论文、代码仓库、SDK 文档、插件教程和 API 行为推断；Tripo 没有发布一张权威系统图。
