  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律阴影
        blocks:
          - type: paragraph
            body: >-
              Tripo 落在当前 AI 版图里合规负担最重的区域之一：一家与中国相关的生成式模型公司，拥有全球用户、可下载输出，训练数据来源又不清楚。公开记录已经显示，公司必须穿越多密的规则层。中国监管环境如今覆盖生成式
              AI 安全要求、标识执法、网络安全法修订，以及多部门 AI 智能体指引。与此同时，Tripo
              自身条款和隐私政策显示，服务置于正式法律框架下，会触达企业客户数据，也涉及跨境数据传输。也就是说，合规负担不是理论问题，而是直接嵌在客户和产品界面里。


              更难的法律问题是知识产权。美国版权争论围绕训练数据合理使用、市场损害和输出责任持续演进，但尚未落定。近期分析认为，训练在某些情形下可能构成合理使用；但盗版或未授权来源，或与权利人形成竞争的输出，仍可能带来责任。Tripo
              没有为其 3D 模型背后的数据发布清晰来源图，投资人就不能把训练数据合法性视为已解决。对一家输出可能与商业 3D 资产重叠的公司来说，这种不确定性不是脚注，而是核心承保问题。
