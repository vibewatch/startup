      - number: '4.2'
        title: 牵引、轮次与资本部署
        blocks:
          - type: paragraph
            body: >-
              公开牵引和融资信号很多，但很杂。独立来源和公司邻近来源都指向一个快速扩张的产品足迹——数百万用户、数万开发者或工作室客户，以及不断增强的企业叙事——但这些数字在媒体之间冲突很大。融资金额也是如此。March
              2026 报道围绕 $50 million Series A 和新模型发布。June 2026 报道围绕近 $200 million 的 Series A+ 与 A++ 融资，以及世界模型野心。July 2026
              中文报道又描述了 RMB1 billion 以上的 A3 战略轮。数据聚合商随后发布了仍不同的总额，包括约 $397 million 累计融资和最近一笔 $147 million 融资。

              正确解读不是某个来源显然真实、其他都是编造。更合理的解释是，Tripo 在相近时间内完成了几笔分批交割，采用了不同本地命名惯例、战略投资者组合和发布时间。即便如此，仍支撑一个核心结论：公司在 2026
              年获得新资本的能力异常强。资金用途语言在保留记录中也方向一致。管理层强调模型研究、算法迭代、数据积累、基础设施、人才，以及全球产品或生态扩张，而不是承诺短期经营杠杆。

              从财务角度看，这是双刃剑。它提升了近期资本充足性，让 Tripo
              不太可能马上放慢产品开发。但它也意味着当前投资者仍在资助建设期，而不是收获一个披露充分的收入引擎。因此，今天的公开故事是继续扩张的资本充足性，而不是成熟、高效软件业务的证明。
