      - number: '7.4'
        title: 团队、执行与止损标准
        blocks:
          - type: paragraph
            body: >-
              Tripo 的执行风险与人员风险紧密相连。公开报道把 Simon Song 放在核心创始人、经营者和外部叙事者的位置，更广泛的继任深度仍然模糊。这种集中可能提高速度；但如果创始人分心、离开，或无法招聘并留住前沿
              3D 平台所需的研究和基础设施负责人，脆弱性也会上升。更广泛 AI 市场已经受人才约束：繁荣期的热门创业公司还能管理，一旦产品失误或政策挤压出现，就会疼。


              对投资人来说，关键问题不是这些风险是否存在——它们显然存在——而是哪一个最可能先变成打破投资论点的因素。最高信号触发条件很直接：可见监管行动、芯片获取显著恶化、无法把头部规模转成付费质量、生产质量基准走差，或管理层流失且没有可见梯队。Tripo
              确实有一些可见缓释因素——开放研究信号、积极发版、伙伴界面、创作者驱动分发——但还不足以把剩余风险降到低位。公司仍是高风险、高上行的运营画像；在价格能被有信心承保前，需要硬私有尽调。
