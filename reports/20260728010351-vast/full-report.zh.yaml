  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方选择集
        blocks:
          - type: paragraph
            body: >-
              Tripo 同时在多条赛道竞争，因此简单同行集合会误导判断。对想要生产可用 3D 网格、导出、低多边形优化和浏览器到流水线工作流的买方来说，真正的替代品是 Meshy 等直接 AI 3D 产品，以及围绕
              Stability 发布构建的开放模型栈。对主要想要活动内容、分镜运动或创意概念生成的买方来说，Adobe Firefly、Luma 和 OpenAI/Azure 即使不交付同样的 3D
              网格工作流，也能拿走预算。对很多团队而言，默认替代方案甚至不是另一家创业公司，而是手工 Blender/Maya/Substance 工作、外包工作室、摄影测量，或用 API 和插件拼起来的内部工具链。

              因此，公开材料指向分层竞争地图。Tripo 和 Meshy 是最清晰的自助式、网页优先、AI 原生 3D 工作台替代品：两者都强调速度、民主化、导出和更宽的工作流工具，而不是只展示实验室演示。Stability
              和 NVIDIA 重要，因为它们可以把高质量 3D 生成推入开放或平台放大的层，削弱纯算法护城河。Adobe 重要，因为它已经掌握大额创意预算，如今又把多家伙伴模型、商业安全定位和 Content
              Credentials 打包在一起。Luma 和 OpenAI 重要，因为买方注意力正在向多模态和世界模型叙事漂移；即便它们不能逐个资产替代 Tripo，也可能改写企业试验预算和投资者框架。

              战略含义是，Tripo 不能只问今天谁的网格最好来评估竞争。它必须同时赢下三场比较：与 Meshy 比直接打包的 3D 工作流，与 Stability 式开放生态比模型 /
              平台经济性，与创意套件巨头比信任加分发。这让市场比狭义创业公司对创业公司的比较更危险；但也意味着 Tripo 不必在所有地方打败 Adobe 或 OpenAI，它需要在「生产就绪 3D
              资产生成」才是真实待办任务的地方赢得清楚。
