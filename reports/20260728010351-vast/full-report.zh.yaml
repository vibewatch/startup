      - number: '2.4'
        title: 中国语境与 SAM 含义
        blocks:
          - type: paragraph
            body: >-
              中国对 Tripo 有两层意义：一层是基础设施和政策背景，另一层是部分但并不完整的需求天花板。中国在 AI、云、5G、游戏、电商和数字支付上的规模，为 3D 内容工具提供了肥沃土壤。但第一章证据显示，超过 85%
              用户位于中国以外；因此，纯中国 TAM 叙事会低估 Tripo 需求已经全球化到什么程度。更好的框架是：中国生态给 Tripo 提供低成本试验、人才密度和产业政策支持，而商业机会则存在于全球所有反复创建 3D
              内容的地方。

              由此引出 SAM 含义。可寻址市场不是单一地理区域，也不是单一采购渠道。Tripo 的可服务市场，是中国内外同时需要 3D 资产吞吐、且能在真实生产工作流里容忍 AI
              生成资产的团队集合。游戏、XR、电商可视化、室内 / 产品设计，以及部分工业仿真用途都符合，但信心水平和付费意愿不同。公司的创作者基数可能是全球的，但更高确定性的变现口袋，可能集中在手工 3D
              工作痛点频繁、可衡量且昂贵的地方。

              未解的尽调问题在于，没有公开来源把这个可服务市场清晰剥离出来。投资者可以用相邻支出池和工作流经济性给它划区间，但仍需要管理层展示用户分群结构、各用例转化率、企业
              ACV，以及公司到底在哪些地方真实替代了既有劳动力或软件支出。在此之前，市场故事最好被视为规模大、仍在上升——但只有一部分已经转化为可证明的可服务收入基础。
