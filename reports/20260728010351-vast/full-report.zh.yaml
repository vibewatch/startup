        - 创作者、游戏开发者、3D 打印、团队、企业
        - 价格透明，插件 / API 叙事强，企业控制完善，2026 年发布节奏快
        - 主张主要来自公司自发材料，独立验证有限
      - - Stability AI
        - 开放 / API 3D 模型平台
        - 企业平台 + 开源仓库和开发者 API
        - 开发者、游戏、VR、零售、设计团队
        - 单图快速 3D、API / 社区分发、开放生态杠杆
        - 相比 Tripo 或 Meshy，不像一个打磨成熟的创作者工作站
      - - NVIDIA + SPAR3D
        - 平台放大器 / 生态入局者
        - CES 发布，叠加 RTX AI PC 分发和 NVIDIA 合作叙事
        - 开发者、产品设计师、环境构建者
        - 硬件绑定分发和实时点云编辑叙事
        - 留存证据中，它不是独立面向终端用户的 3D SaaS 入口
      - - Luma
        - 相邻的多模态创作平台
        - 获 HUMAIN、a16z、Amazon、AMD Ventures、NVIDIA、Amplify、Matrix 支持
        - 工作室、代理商、企业营销、开发者
        - Ray3.x 电影级控制、HDR/EXR、API、创意智能体平台
        - 重心更在视频和多模态创作，而不是可导出的 3D 网格
      - - Adobe Firefly + Substance 3D
        - 在位创意套件型替代品
        - 庞大装机基础和 Creative Cloud 捆绑分发
        - 设计师、营销人员、创意团队、企业买家
        - 商业安全叙事、Content Credentials、伙伴模型中心、Substance 近邻优势
