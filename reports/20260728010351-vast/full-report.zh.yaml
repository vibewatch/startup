      - number: '5.2'
        title: 开发者面与集成生态
        blocks:
          - type: paragraph
            body: >-
              开发者面是公开记录中最清楚的差异化之一。Tripo 不只是放出一个营销网站；它有开发者门户、API 密钥门控的 API、官方 Python SDK、ComfyUI 伙伴文档、官方 ComfyUI 和
              Blender 仓库，以及 MCP/Cursor 与 Babylon.js 或 Three.js 部署工作流指南。这个组合表明，产品策略瞄准的是嵌入创作者和开发者栈，而不是强迫所有使用都经过单一浏览器
              UI。OpenAPI 任务端点需要认证、SDK 是异步的、插件生态横跨 Blender、ComfyUI、网页运行时，甚至还有面向 Roblox 的导出教程，这些都指向一个托管、以 API 为中心的运营模型。

              生态证据不只是轶事。GitHub 元数据显示，TripoSR 牵引异常强，TripoSG 仓库、ComfyUI 节点、Blender 扩展和 Python SDK 的牵引较小但仍有意义。与
              MakerWorld/Bambu Lab 的伙伴案例也重要，因为它说明 Tripo 可以嵌入别人的工作流或市场，而不只是作为独立创作者应用使用。主要但书是，企业治理文档在公开产品面仍偏薄：功能文档很多，但
              SLA、SSO、管理控制或可用性承诺的可见证据很少；这些证据本可帮助技术买方承保关键任务部署。
