      - number: '2.2'
        title: 买方、用户与付费方
        blocks:
          - type: paragraph
            body: >-
              买方地图是 Tripo 最有吸引力的结构特征之一。产品可以从个人、设计团队或技术组织切入，不需要单一大一统采购方。官方定价通过积分和订阅支持个人创作者及小团队；官方 API 页面和工作流页面则明确分出开发者 /
              API 产品线，面向用量更高、集成更重的用户。这让 Tripo 能覆盖很不一样的待办任务：原型化一个道具、为 WebAR 生成家具资产、快速搭建房间布局、把资产摄取自动化接入 Unity 或
              Unreal，或为工作室流水线生成定制 3D 元素。

              实际分群比确切收入拆分更清楚。游戏工作室和 XR 团队关心低多边形网格、绑定、导出纪律和引擎桥接。电商和零售团队关心 GLB/USDZ 部署、商品页转化提升、AR
              摆放和更低退货率。室内与工业设计师更在意快速迭代和标准文件导出，而不是大规模 API
              自动化。独立创作者和爱好者关心速度、积分包和浏览器端易用性。每个分群的付费方不同：创作者用银行卡自助付费，工作室动用美术或制作预算，企业 API
              买方需要工程或产品基础设施审批，商业团队往往归在商品、增长或数字体验预算之下。

              这种多样性利好需求，却不利于简单讲故事。公司可以展示很多用户，却尚未证明深度企业变现；也可以展示强企业客户标识，却尚未证明各分群都有标准化、可重复预算。对 Tripo
              来说，市场最强的位置在资产吞吐会重复发生、文件导出很关键、劳动力节省明显的场景——尤其是游戏流水线、XR /
              空间内容和商业可视化。市场较弱的位置，是偶发概念图或一次性新奇资产已经足够的场景，因为这些买方可以继续做免费用户，或低成本地在工具之间切换。
