      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动，是 Tripo 试图替代的丑陋基线。传统 3D 工作流慢、重专家、还分散在建模、UV、纹理、重拓扑、绑定和导出之间。每个公开 Tripo
              工作流页面都抓住同一个市场事实：团队愿意为更短的概念到资产周期、更少的一稿几何美术工时，以及更容易进入引擎、查看器或 AR 店面的路径付费。当游戏流水线、XR
              内容、数字商业和工业可视化都要求比人工团队更高的资产量时，这种需求拉力会更强。

              第二个驱动是工作流集成。预算很大的市场，仍不会因为一个 AI 点状方案就自然转化；输出必须进入真实下游系统。Tripo 围绕 ComfyUI、Blender、Unity、Unreal、REST
              APIs、标准导出和 DCC 桥接的官方信息之所以重要，正因为工作流深度常常决定试点能不能变成预算线。从市场角度看，互操作性降低切换成本，也让不能忍受孤立资产或每次交接都手工返工的团队更容易服务。

              最大约束也很清楚。第一，输出质量仍需要人工验证：官方页面强调分割、低多边形和导出处理，是因为下游摩擦仍然存在，第一章的反向来源也说明了原因。第二，公开市场规模估计会随边界不同剧烈变化——窄口径软件收入和宽口径
              AI 相关经济活动差异很大，巨型 TAM 幻灯片的用处因此有限。第三，中国生成式 AI
              监管和标识规则，会给面向中国公众用户或跨境数据流的服务带来反复合规工作。因此，这个市场有吸引力，但只适合把原始生成能力与工作流可靠性、合规纪律和足够产品深度结合起来、能越过专业信任门槛的供应商。
