      - number: '8.3'
        title: 中国 AI 语境：为什么溢价仍要打折
        blocks:
          - type: paragraph
            body: >-
              高价买入确有牛市理由。2026 年，中国 AI 资本市场愿意给品类领导者极高标记：Moonshot 以 $20B 估值融资，CNBC 和 TechCrunch 描述的 Zhipu 与 MiniMax
              公开市场价值，也会随模型发布改变情绪而剧烈波动。Tripo 也有可信的增长可选性。Forbes、Yahoo/SCMP、ACCESS
              和官方新闻稿共同描绘了一家公司：从快速用户增长，走向更广泛的世界模型、内容和生态野心。换句话说，溢价叙事并非虚构。Tripo 是少数拥有可见消费者漏斗、创作者心智和企业客户标识的中国应用 AI 公司之一。


              但同一叙事需要纪律性折扣。Moonshot、Zhipu 和 MiniMax 更接近前沿模型融资故事，而不是私有 3D 应用栈。Tripo
              还暴露在中国特定监管和出口管制风险中，这些风险会打到算力成本、全球企业胃口和投资人退出假设。CNBC 关于 AI 退出的报道给出第二道折扣：资本充裕，但流动性仍然薄且不均衡。最后，独立评测仍把 Tripo
              描述为常常受益于清理的工作流加速器，而不是通用生产替代品。这些事实不会杀死估值案，但会让没有透明度折扣、直接支付干净前沿 AI 倍数更难自圆其说。
