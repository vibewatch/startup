      - number: '4.3'
        title: 单位经济与披露缺口
        blocks:
          - type: paragraph
            body: >-
              用公开信息承保 Tripo，最难的不是理解产品如何赚钱，而是理解它已经赚得多好。保留来源均未披露收入、年经常性收入（ARR）、毛利率、烧钱速度、现金余额、客户集中度、净留存率（NRR）、企业 ACV
              或算力承诺。这迫使分析师从收入机制，而不是业绩证据出发。好消息是机制清楚：积分可以把用量映射到计费，团队计划可以变现协作和治理，私有 / 商业权利可以把免费用户推向付费层。坏消息是，看得懂机制不等于有证明。

              公开标价足够低，单看用户数几乎说明不了什么。大量免费或低消费创作者，可以与不高的实际收入并存。更高质量的收入如果存在，可能位于经常性团队合同、共享工作区、API
              集成，以及那些流水线反复消耗积分的客户，而不是浏览免费层的用户。因此，单位经济问题本质上多半是结构问题。缺少分群转化和使用强度，投资者无法区分炒作式规模和变现式规模。

              还有一个反向运营角度。独立拆解的怀疑和竞争定价压力说明，Tripo
              仍必须证明生产就绪输出足够好，能支撑持久预算，而不是反复试验。如果导出清理或工作流摩擦仍高，即便漏斗顶端增长强，变现也可能卡住。因此，公开证据支持可信的计费设计，但还不支持一个公开结论：Tripo
              已经从令人兴奋的采用跨入高质量软件经济性。
