      - number: '1.4'
        title: 里程碑、技术信号与反向因素
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示平台扩张速度异常快。官方与半官方来源把公司轨迹从 2023 年创立，推进到 2025 年产品打磨，再到 2026 年资本加速。到 2025 年底，Tripo
              已经不只做原始提示词生成模型，而是推进纹理引擎、分割、绑定、格式转换、ComfyUI 节点、Blender 工作流，以及 Sony Spatial Reality Display
              合作等企业伙伴叙事。研究面也看起来有分量：TripoSR、TripoSG 和 GitHub / 开源足迹，让公司相较许多只发产品、没有可见研究产出的 AI 应用公司，拥有技术信号优势。

              同时，证据集并不足以让人盲目接受每一条流水线就绪声明。本章最有用的反向来源是一篇独立 Medium 拆解，观点公平：3D AI 演示在导出前可以很好看，但真实生产价值取决于网格干净程度、UV
              可迁移性、绑定稳健性，以及真实下游工具里的清理时间。这个批评与 Tripo
              自己反复强调分割、绑定、低多边形优化和导出处理相互印证——公司只会在下游摩擦真实存在时，才会重压这些功能。换句话说，反向论点不是产品造假，而是现实生产就绪度是一条光谱，不是二元标签。

              因此，战略弧线可信，但风险尚未完全出清。VAST 显然想超越单一资产生成应用：Project Eden 和 W1.0 显示其有意向世界模型和空间仿真上爬，Sony
              与工作流插件合作也显示真实的市场进入想象力。尽调的开放问题在于，产品和资本形成的速度，是否已经由企业控制、治理成熟度和独立衡量的生产性能同步跟上。
