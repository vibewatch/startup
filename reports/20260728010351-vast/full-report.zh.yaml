  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Tripo 当前产品面明显宽于一个简单的文本生成 3D
              演示。官方主页和功能页展示了一个托管工作流：从文本提示、图像和多视角参考开始，再延伸到纹理、分割、四边面重网格、绑定和导出等后处理模块。定价页进一步说明，它要覆盖不同用户类型：用于试验的轻量免费层，拥有更高并发的准专业用户和工作室层级，以及加入共享工作区和集中管理的团队包装。这种宽度重要，因为
              Tripo 试图把 3D 流水线的多个步骤压缩到一个订阅界面里，而不是作为单一狭窄模型端点竞争。

              输出叙事也比许多泛生成式 AI 产品更懂工作流。官方 Tripo 材料和教程讨论 GLB、FBX、OBJ、STL 以及面向 Roblox 的导出；JavaScript 指南明确建议网页部署使用 GLB，并提到
              USDZ 在某些集成工作流中是替代路径。实际看，Tripo 最强的场景是用户需要为游戏、网页场景、3D
              打印或交互原型快速生成一稿资产，并愿意把它们送进下游清理或引擎检查。因此，产品最好被定义为创作者到生产的加速层，而不是每个 DCC 或引擎原生任务的替代品。
