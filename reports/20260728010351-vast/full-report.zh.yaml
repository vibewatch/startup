  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与工作流组合
        blocks:
          - type: paragraph
            body: >-
              Tripo
              作为一家年轻公司，客户版图少见地多元。官方材料没有把产品框在一个单一买方身上，而是反复面向创作者、独立游戏开发者、工作室、产品团队、建筑师、零售商，以及影视或媒体用户。这种广度重要，因为它给平台开出多个入口：个人创作者可以从免费计划起步，游戏团队可以用它快速原型，电商业务可以接入目录工作流，平台伙伴可以通过
              API 或工作区界面嵌入。时尚 AR、目录规模化、影视级预演和游戏绑定的垂直页面都指向同一结论：只要 3D 资产吞吐是反复出现的问题，Tripo 就在卖一套工作流加速器。


              广度的反面，是并非每个用户分层都同样能变现。免费层降低摩擦，创作者和爱好者采用很可能不少；但企业级付费意愿会集中在 3D
              资产具备运营价值，而不只是装饰价值的场景。因此，公开用例界面在游戏、商业可视化、平台嵌入、建筑或工业设计、XR 或空间显示上最有说服力。它们对深度企业粘性说服力较弱，因为公开记录更多说明谁能使用
              Tripo，而不是哪些分层会续费、扩张，并长期贡献实质收入。
