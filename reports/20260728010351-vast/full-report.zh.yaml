      - number: '5.3'
        title: 模型架构与公开路线图信号
        blocks:
          - type: paragraph
            body: >-
              Tripo 最强的技术可信度信号来自研究层。TripoSG 论文和仓库给出的是真实模型架构，而不是模糊产品营销：大规模 rectified-flow transformer，结合 SDF、normal 和
              eikonal losses 的 hybrid VAE supervision，以及 2 million 样本的 image-to-SDF 数据流水线。仓库还记录了 1.5B 参数版本和
              scribble-conditioned 变体，说明公司愿意向研究和开发者社区暴露至少一部分模型谱系。TripoSR 从重建侧补完了这个故事：它是一个领先的单图模型，声称在 A100 硬件上推理低于 0.5
              秒，并由 Stability AI 联合开发、以 MIT 许可证发布。

              2026 年路线图叙事延伸到这些研究产物之外。公开新闻和赞助报道把 P1.0 与 H3.1 描述为更整体的空间架构、更偏生产的架构，目标是减少困扰许多 3D
              生成器的手工编辑负担。这不能证明完整产品已经在所有地方交付每一项宣称能力，但它确实显示出连贯战略方向：Tripo 想从「快速生成一个网格」走向「生成更干净、更能进流水线的资产，并通过插件、API
              和创作者工作区分发」。剩余尽调任务，是把这些研究和营销标签，清楚映射到真实生产端点和已变现产品面。
