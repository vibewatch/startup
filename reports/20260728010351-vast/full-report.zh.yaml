chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、结构、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              更合理的理解是，Tripo AI 是置于更大 VAST/Holymolly 公司架构中的产品品牌，而不是一家披露清晰、单一的运营实体。官方条款把 Holymolly Ltd 列为 tripo3d.ai
              背后的签约主体，并列出香港办公室地址；South China Morning Post 则称公司以 Vast 名义注册于开曼群岛，并于 2023 年在北京设立。CB Insights
              又列出上海自贸试验区总部。合在一起，公开记录支持一个务实的尽调结论：Tripo AI 是面向客户的品牌，VAST 是融资报道使用的母体身份，该集团很可能采用中国背景风投公司常见的多司法辖区架构。

              对一家年轻 AI 公司而言，产品主张本身异常具体。从官网、定价页、API 到多篇产品博客，Tripo 都把自己定位成端到端 3D
              创作工作流：把文本提示、图像、多视角输入和草图，在数秒内变成接近生产可用的资产。官方材料反复强调的不只是生成，还包括分割、绑定、动画、格式转换、低多边形优化，以及导出到标准 3D
              格式等下游资产处理能力。这一点重要，因为 Tripo 不是在推一个新奇图像生成器；它卖的是面向创作者、开发者和工作室的工作流替代或加速层，目标是交付真实网格输出。

              到本报告运行日，这家公司已不再是早期概念验证。Forbes、SCMP/Yahoo 和公司材料都把 Tripo
              放在产品市场匹配之后、高增长私人公司的类别里：公司已超出消费者演示阶段，同时销售订阅和项目制企业服务，并已开始把自己从 3D
              资产生成器重塑为更宽的空间智能和世界模型平台。最大的谨慎点在于，这套成熟度叙事在运营层面更可见，在制度层面仍不够可见：公开产品面很丰富，但公司架构和治理披露滞后。
