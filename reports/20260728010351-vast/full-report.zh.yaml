  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              分析 Tripo 的第一条纪律，是把市场定义得足够窄，才有用。Tripo 不是卖给整个中国 AI 市场，甚至也不是卖给整个全球创作者软件市场。它位于 AI 原生 3D 资产创作工作流层：文本 / 图像 /
              草图生成 3D，纹理 / 材质生成，网格清理与重拓扑，绑定，导出，API 驱动的摄取，以及创作者到引擎的工作流工具。因此，它真正的市场边界更接近「把创意意图转化为生产可用 3D 资产的软件和服务」，而不是泛生成式
              AI 支出。

              多个公开规模视角都有帮助，但回答的是不同问题。Axis 和 Grand View 给出宽泛的中国 AI 市场收入区间，Research and Markets 勾勒具体 3D 资产类别结构，China
              Daily/IDC 提供沉浸式计算支出视角，Digital in Asia 则通过中国电商和游戏提供消费者需求背景。不能把这些硬塞成虚假的 TAM/SAM/SOM
              栈。更合适的做法是形成分层边界：最上层是很大的中国数字化和 AI 预算，下面是较小的沉浸式及游戏 / 电商内容层，再往下才是 3D 资产生成工作流可变现的更窄楔形市场。

              这种分层重要，因为它能避免创业公司用一张巨大 AI 市场幻灯片为估值背书的常见错误。Tripo 的机会真实存在，但它不是完整的 $62 billion IDC 式中国 AI 市场，也不是完整的 $2.93
              trillion 中国电商市场。可用机会只是这些预算里真正需要反复创建 3D 资产、快速迭代、标准导出，并且对下游足够信任、能把 AI 生成资产放进真实生产系统的那一部分。
