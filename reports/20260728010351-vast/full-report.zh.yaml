      - number: '6.4'
        title: 持续性、扩张与客户质量风险
        blocks:
          - type: paragraph
            body: >-
              最大承保问题不是缺少采用，而是客户质量不清。公开来源大量谈到创作者、客户标识和增长，却很少披露 NRR、流失、合同期限、按席位或 API
              量扩张，以及数百万用户里有多少最终成为付费订阅者。定价阶梯暗示一条可行的先落地再扩张路径：从免费创作者到付费 Pro，再到团队或 API
              用量；但真实转化数学缺席。独立评测和定价摘要强化了反向观点：免费层足够慷慨，可能支撑大量试用型行为；只有商业或私有使用变得重要时，付费权益才必不可少；更大的按席位付费计划价格不低，并非每个试用都会扩展成严肃企业部署。


              因此，投资人应把客户故事视为有潜力，但尚未完全证实。获客动作看起来由产品驱动且全球分布：如果转化健康，效率很高；如果转化不健康，风险也高。点名客户有帮助，但客户标识密度不等于耐久收入。下一步尽调应从亮眼的公开触达，转向有队列数据支撑的收入质量：转化、续费、使用强度，以及按支出区间划分的客户状态。在这些可见前，Tripo
              的客户章节支持正向需求判断，但变现判断只有中等信心。
