      - number: '6.2'
        title: 采用轨迹与地域分布
        blocks:
          - type: paragraph
            body: >-
              即便对噪声分母打折，公开采用轨迹仍然强劲。多个 2025 和 2026 年来源显示 Tripo 早已不是小众开发者玩具：用户数从 2025 年夏末约 300 万，升至 2025 年末 650 万，再到某个
              2026 年来源中的 1000 万个人用户；相关来源还提到 35,000 名活跃开发者、40,000 家工作室或企业伙伴、90,000 名开发者，或 90,000
              个工作室客户。这些数字显然衡量的是不同人群，不能并成一个干净 KPI；但它们足以支持一个方向性很强的结论：Tripo 以少见速度跑出了全球分发。


              地域结构也值得注意。Yahoo 转发的 SCMP 报道称，超过 85% 用户在中国以外，欧洲和美国是最大市场；Forbes 还把日本和韩国列入集中市场。这一点重要，因为它说明 Tripo 的增长不只是「中国
              AI」故事。同时，全球足迹尚未告诉投资人付费收入实际在哪里。没有董事会层面的定义表和区域收入拆分，公开采用故事仍然亮眼，但只有一部分达到投资级。
