  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚与商业化界面
        blocks:
          - type: paragraph
            body: >-
              公开记录足以证明，Tripo 已经是真实融资故事，而不是传闻。2026 年 6 月官方发布、SaaS 行业报道、AI Weekly 和 Forbes 都指向同一大图景：VAST 完成约 $200M 的 A+ 和
              A++ 融资，借此发布世界模型路线图，并已被市场按独角兽讨论。Forbes 是最干净的可得估值锚，因为它把本轮融资与包括 INCE Capital 的财团联系起来，并称一位知情人士把公司估值放在约
              $1.5B。准确投后条款仍有一些模糊，但足以在尽调中把 $1.5B 作为工作市场价格。


              商业界面也比纯演示叙事更真实。Tripo 定价页显示明确的免费增值漏斗，随后清楚上探到付费商业权利、更高并发、批量导出和私有模型。API
              页面和官方垂直案例研究显示第二层变现：开发者用量、伙伴嵌入和工作室工作流。问题不是缺少可见变现界面，而是公开文件从未告诉投资人，1000 万用户或 90,000
              个工作室客户中有多少真正付费、花多少钱，或产品是否能产生软件式利润率。
