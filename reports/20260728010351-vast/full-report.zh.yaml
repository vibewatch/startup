      - number: '1.3'
        title: 融资、规模与商业化
        blocks:
          - type: paragraph
            body: >-
              公开融资动能真实，而且压缩得不同寻常。Forbes 报道 March 2026 由 Alibaba 和 Hengxu 领投的 $50 million Series A，约三个月后又完成 June 2026 约
              $200 million 的 Series A+/A++ 融资，投资方包括 INCE Capital、Genesis Capital 和 Primavera。AI Weekly 也呼应 $200 million
              融资，并把一家 China Life 关联基金加入轮次叙事。合在一起，这些来源支撑核心结论：即便确切投后估值仍非官方、且取决于来源，VAST/Tripo 也在极短时间内从有前景的产品公司变成中国 AI 独角兽。

              商业牵引同样方向性很强，但具体规模数字必须谨慎看待。SCMP/Yahoo 引述 6.5 million 用户，其中超过 85% 来自中国以外，并列出 Tencent、NetEase、Sony、Microsoft
              和 Pop Mart 等企业用户。Forbes 的 2025 与 2026 文章先后引用超过 3 million 专业用户、20 million 全球用户；AI Weekly 则引用 10 million
              个人用户和 90,000 工作室客户。这些数字差异太大，不能当作单一审计 KPI 承保，但它们指向同一方向：Tripo
              不是只有少数试点客户标识的小众玩具。它已经形成有意义的全球分发，尤其在游戏、创意和邻近工业设计的工作流中。

              变现模型比财务披露更清楚。官方定价显示从免费到团队层级的自助订阅，Forbes 则称 NetEase、Sony 等企业按项目付费，终端用户以大约 $20 到 $140 的月费订阅。消费者 /
              准专业用户订阅、项目制企业变现、开发者 API 这三者组合，契合公司既是创作软件、也是 3D 基础设施的定位。缺失的仍是每个投资者最想先看到的数字：经审计收入、年经常性收入（ARR）、毛利率和烧钱速度。
