        title: 点名客户佐证与开发者信号
        blocks:
          - type: paragraph
            body: >-
              点名客户证据存在，但质量不均。Sony、NetEase、MakerWorld 或 Bambu Lab、Replit
              是最强的公开样本，因为它们要么出现在多个独立来源中，要么有官方工作流页面解释关系如何运转。NetEase 尤其有用，因为 KR Asia 明确称 Tripo 被用于 Where Winds
              Meet，把证据从泛泛客户标识展示推向有记录的下游使用。Sony 的公开合作页面也重要，因为它把 Tripo 连接到具体工作流环境 Spatial Reality
              Display，以及零售、教育、数字孪生等行业场景。


              开发者信号从另一个角度强化同一故事。ComfyUI 官方伙伴文档、Tripo SDK，以及 TripoSR 和 ComfyUI-Tripo 的 GitHub
              足迹显示，技术用户不只是被动围观产品，而是在把它接入工具链。这一点重要，因为一家 3D-AI 公司可以有病毒式创作者采用，却仍未进入运营要害。Tripo
              的公开开发者和伙伴界面更有力地说明，至少一部分客户群在真实工作流中使用系统。剩下的缺口是商业细节：公开来源仍未清楚区分付费生产客户、试点、合作伙伴和引用用户。
