      - number: '8.4'
        title: 建议与最后尽调要求
        blocks:
          - type: paragraph
            body: >-
              本章结论应谨慎，但不应轻视。Tripo 有足够的产品广度、采用证据和可比市场支撑，可以留在投资人的持续跟踪名单上；当前价格也不像某些纯炒作 AI 融资那样明显不理性。但缺失分母的问题是决定性的。投资人仍看不到
              ARR、付费客户质量、队列留存、毛利率，或支撑估值标记的真实优先权结构。因此，市场价格也许可辩护，但仅凭公开证据，公允价值仍未充分证明。


              因此，可支持的建议是跟踪，而不是买入。估值立场是偏撑，而非明显昂贵，因为真实动能存在，Runway 式私有可比也说明市场有时愿意为稀缺创意 AI
              支付高区间倍数。信心应维持中等、风险维持高，因为下行路径很容易描述：如果 Tripo 的 ARR 仍显著低于约
              $100M，如果免费转付费疲弱，或中国相关算力与合规冲击加剧，估值压缩风险就很大。从这里开始，尽调负担很机械：验证分母、检查留存和利润率质量，并理解当前估值标记是由经济性支撑，还是由轮次结构支撑。
