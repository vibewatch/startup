      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人履历是本文件里最清晰的正面信号之一。多家独立来源确认 Simon Song 是创始人兼 CEO；他的创始人-市场匹配来自领域品味和此前 AI 公司运营经验。Forbes 和 SCMP 称 Song 曾就读
              Johns Hopkins，在 SenseTime 工作，之后联合创立 MiniMax，并于 2022 年离开去做 VAST。这些细节重要，因为 Tripo 位于生成式 AI、游戏、动画和工具的交叉点，而
              Song 自己的公开叙事也明确落在「一个游戏玩家想更快完成 3D 创作」上。

              看不见的部分几乎同样重要。公开材料高度围绕创始人展开：Song 是融资报道中的声音、具名技术讲述者，也是显而易见的人才磁石。但已抓取材料没有给出扎实的公开董事会名单、具名
              CFO，或清晰独立的治理层。即便面向公司的文件在产品权利和用户义务上写得细，也没有真正披露控制权、委员会结构或更宽的高管梯队。对一家 2023
              年创立的私营公司来说，这并不罕见；但当估值进入独角兽区间后，这就是实打实的尽调缺口。

              因此，治理判断是混合而非负面。创始人集中大概率加快产品速度，也帮助 Tripo
              下大胆赌注，例如发布开源模型、投入世界模型、扩展到工作流插件。代价同样明显：关键人依赖，以及外部难以看清谁在内部挑战创始人、谁负责财务纪律、跨香港、开曼、北京和潜在上海注册实体的架构如何治理。
