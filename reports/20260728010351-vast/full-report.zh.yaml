      - number: '7.2'
        title: 地缘政治、算力与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Tripo 的算力风险并不抽象。美国贸易和出口管制来源明确表示，先进计算限制直接瞄准放缓中国取得顶尖芯片及相关 AI
              应用。指引已经延伸到总部位于受限地区、但在其他地方运营的实体；美国官员也继续用军民融合和执法视角看待中国相关交易对手。对一家吃算力的生成式 3D
              公司来说，实际后果很清楚：更难或更慢拿到最好芯片，会传导到模型质量、推理成本、产品延迟和发布节奏。


              依赖故事不止硬件。Tripo 还依赖云交付、插件生态和下游工作流信任。与此同时，巨型平台公司正在整合多模态模型目录、定价弹性和开发者工具。Microsoft Foundry 和 Azure OpenAI
              展示了既有巨头如何把前沿模型、可观测性和吞吐定价打包，使点状解决方案更难防守。OpenAI 的 Sora 时代模型阵容从另一个方向强化了同一风险：Tripo 竞争的不只是其他 3D
              专家；它还要同更大的模型平台争预算，而这些平台可能在客户询问专门 3D 供应商前就先拿走预算份额。
