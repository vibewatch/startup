  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价面
        blocks:
          - type: paragraph
            body: >-
              相比公开财务披露，Tripo 的公开变现架构更具体。公司清楚销售三类经济产品：自助 Studio 订阅、按用量计费的 API 积分，以及更高席位数的团队或企业计划。定价页展示了经典 SaaS
              阶梯——Free、Pro、Max、Team——API 文档则展示了独立的先付后用积分账本。这个拆分重要，因为它意味着 Tripo
              不依赖单一变现动作。它可以通过经常性订阅变现爱好者和专业人士，通过用量和预付积分变现开发者，通过团队治理、并发、工作区和管理功能变现组织。

              公开产品面也显示 Tripo 实际在为什么收费。定价页不只是给模型访问设门槛，还把私有模型、商业使用、并发、批量导出、专用处理、共享工作区、存储深度和编辑历史纳入门槛。API
              文档再加一层：复杂度更高的工作流消耗更多积分，SDK 和任务端点暴露精确的已消耗积分与余额仪表。换句话说，Tripo 已经搭建了一个商业控制系统，不只按席位数计量价值，也能按真实工作流强度计量价值。

              这仍不能证明收入质量。低门槛定价扩大漏斗，但如果免费用户占主导，或专业用户没有转化为 API 或团队支出，头部用户规模也会掩盖弱变现。公开材料证明 Tripo
              知道自己想怎样收费；它们还没有证明这些收费是否高效转化为高毛利、可重复的企业收入。
