callouts:
- calloutType: risk
  title: Training-data provenance is the sharpest unresolved legal edge
  body: Public rules and legal analyses increasingly distinguish between transformative training and tainted or undocumented source material. Tripo’s public record does not yet close that gap.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
  - CR040
- calloutType: risk
  title: Compute access can become a product risk before it becomes a finance risk
  body: If export controls meaningfully slow hardware upgrades or raise inference cost, customers will feel the impact through latency, quality, and slower shipping before it even shows up cleanly in reported margins.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR033
- calloutType: insight
  title: The biggest danger is interaction risk, not one isolated weakness
