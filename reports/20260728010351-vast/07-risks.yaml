  - type: private-evidence-only
    severity: blocking
    topic: dataset-provenance
    missingEvidence: A documented provenance and licensing map for all major 3D, image, and reference datasets used to train Tripo models.
    whyItMatters: Training-data rights are one of the most material unresolved IP risks for generative 3D companies, especially when outputs may compete with original creators.
    diligencePath: Request internal training-data governance records, source lists, license agreements, and any red-team review of copyrighted dataset exposure.
