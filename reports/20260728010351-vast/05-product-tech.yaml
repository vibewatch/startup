- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in stack
  - Key dependency
  - Main technical risk
  rows:
  - - Hosted generation UI
    - Front-door interface for prompt, image, and creator tasks
    - Cloud inference and Tripo account system
    - User experience can hide quality variance behind polished previews
  - - TripoSG image-to-3D foundation model
    - High-fidelity generation from image-conditioned inputs
    - Large-scale rectified-flow training, curated data, GPU inference
    - Unclear how much of public research translates directly into paid production endpoints
  - - TripoSR reconstruction model
    - Fast single-image reconstruction and open technical credibility
    - A100-class benchmark environment and CUDA-compatible stack
    - Open-source benchmark speed may not equal product latency under real workload
  - - Post-processing layer
    - Segmentation, remeshing, texturing, rigging, lowpoly, conversion
    - Workflow orchestration and model-specific editing tools
    - Over-reliance on fixes can signal that first-pass outputs are not yet clean enough
  - - API and SDK layer
    - Programmatic task creation, downloads, automation, and app embedding
    - Authenticated endpoints, async task handling, client libraries
    - Public docs do not surface enterprise-grade SLA or admin guarantees
  - - Plugin / ecosystem adapters
    - Blender, ComfyUI, JS runtimes, Roblox, partner embeds, MCP/Cursor
    - Third-party tool compatibility and ongoing plugin maintenance
    - Each adapter adds another integration point that can fail or drift
  notes: This architecture map is inferred from public research papers, repositories, SDK docs, plugin tutorials, and API behavior; Tripo does not publish one canonical system diagram.
