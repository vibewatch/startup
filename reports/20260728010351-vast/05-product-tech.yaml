  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: infrastructure-economics
    missingEvidence: GPU-cluster architecture, inference-cost curves, concurrency ceilings, and internal latency/SLA dashboards.
    whyItMatters: Production readiness depends on whether Tripo can keep seconds-level latency and plugin responsiveness as enterprise or API usage grows.
    diligencePath: Request infra architecture, GPU vendor exposure, p95 latency by workflow, and cost per generated asset from engineering leadership.
    relatedQuestionRefs:
    - QE021
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: independent-benchmarks
    missingEvidence: Third-party benchmark data for complex characters, cloth-heavy rigs, and full engine-import success rates across real production pipelines.
    whyItMatters: The biggest technical underwriting risk is whether Tripo remains usable after export on the hard asset classes that often break AI 3D tools.
    diligencePath: Run a structured bakeoff against real game, XR, and commerce assets using Unity, Unreal, Blender, and web runtimes.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: enterprise-controls
    missingEvidence: Public docs for uptime SLA, SSO, admin roles, audit logs, data retention options, and support tiers for enterprise customers.
    whyItMatters: A broad product surface is less investable if enterprise deployment controls lag behind creator-facing feature velocity.
    diligencePath: Ask management for enterprise security documentation, SLA sheets, and current workspace-admin roadmaps.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: minor
    topic: export-ambiguity
    missingEvidence: A canonical first-party export matrix covering all currently supported formats, including whether USDZ is GA, beta, or only documented in ancillary workflows.
    whyItMatters: Output-format ambiguity matters for mobile AR, Apple-centric commerce flows, and any customer that needs deterministic downstream handoff.
    diligencePath: Request a current export capability sheet or verify directly in the production UI and API responses.
