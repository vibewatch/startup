  rows:
  - - Core text/image generation
    - Creators, studios, developers
    - GA on web surface and pricing tiers
    - Hosted 3D generation in seconds with broad creator packaging
    - Need audited quality distribution by asset class
  - - Multi-view / parts generation
    - Prosumer and studio users
    - Publicly included in Pro tier
    - Suggests movement beyond single-shot prompt demo into controllable workflows
    - Need exact success rates and credit economics
  - - AI texturing + stylization
    - Artists and product-visual teams
    - Public feature page and workflow guides
    - Moves Tripo from mesh-only into fuller asset finishing
    - Need proof of texture portability across engines
  - - Auto rigging + animation
    - Character teams and game creators
    - Public feature page plus SDK support
    - Broadens utility toward character or animation workflows
    - Need benchmark results on difficult asymmetric or cloth-heavy characters
  - - Segmentation + quad remeshing + cleanup
    - Technical artists and downstream editors
    - Public feature pages and tutorials
    - Directly addresses common AI-3D cleanup bottlenecks
    - Heavy emphasis implies raw outputs still often need assistance
  - - API / SDK / plugins
    - Developers and workflow integrators
    - Developer portal, Python SDK, Blender, ComfyUI, MCP, JS guides
    - Embedding surface is deeper than most creator-only tools
    - Enterprise controls and SLAs remain under-disclosed
  notes: Rows summarize only the modules visible in fetched public surfaces; they do not prove that every feature is equally mature across web app, API, and plugins.
