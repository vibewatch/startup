- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality metric
  - Current public status
  - Scope
  - Gap / implication
  rows:
  - - API authentication
    - Visible
    - OpenAPI task endpoint rejects anonymous access
    - Shows basic key gating but not enterprise identity controls
  - - Public usage rights
    - Visible
    - Free plan explicitly labels public models under CC BY 4.0
    - Need a fuller matrix for paid-plan output rights and reference-data handling
  - - Game-ready validation
    - Visible
    - Official checklist covers polygons, UVs, textures, scale, and import checks
    - Checklist is useful but not a substitute for benchmark pass rates
  - - Cleanup / repair tooling
    - Visible
    - Tripo markets retopology, segmentation, clean-mesh, and hole-repair workflows
    - Confirms support tools exist, but also implies raw outputs still break often enough to matter
  - - Enterprise deployment controls
    - Weak public visibility
    - No clear fetched SLA, SSO, or admin-governance surface
    - Could slow enterprise adoption or force bespoke diligence before rollout
  notes: This table intentionally mixes positive controls with missing controls because the underwriting question is whether Tripo has enough trust surface for production deployment, not whether it has zero controls.
