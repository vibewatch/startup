- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Tripo solution
  - Measurable benefit / public signal
  - Limitation or caveat
  rows:
  - - Web creator concepting
    - Manual modeling is slow for first-pass assets
    - Text-to-3D or image-to-3D from browser workflow
    - Seconds-level generation and free entry tier lower experimentation cost
    - Quality varies; the first export still may need cleanup
  - - Game-asset preparation
    - Mesh, UV, and scale issues can break engines
    - Game-ready checklist, remeshing, rigging, and FBX/GLB workflows
    - Official docs are unusually explicit about Unity/Unreal constraints
    - Checklist publication itself shows real downstream failure risk
  - - Developer embedding
    - Building custom 3D generation from scratch is complex
    - Developer portal, Python SDK, authenticated API, async tasks
    - Independent dev guide and official SDK point to low-friction integration
    - Little public evidence of uptime or admin guarantees
  - - Node-based AI workflow
    - Moving between tools fragments creative flow
    - ComfyUI nodes and official partner docs
    - Native partner-node support and active repo updates
    - Still relies on hosted API and key management
  - - Blender-based editing
    - AI outputs often need DCC-side cleanup
    - Official Blender plugin, segmentation, retopo, and MCP/Cursor workflow
    - Shortens distance between generation and manual correction
    - Serious cleanup still happens inside Blender, not magically away
  - - Web / AR / 3D printing deployment
    - Format mismatch and scale errors slow deployment
    - GLB-first web guide, Roblox scale guide, MakerWorld print partner story
    - Documented handoffs into Babylon.js, Three.js, Roblox, and MakerWorld
    - USDZ and some mobile-AR paths remain less clearly confirmed on core docs
  notes: Benefits are directional and workflow-based; public sources rarely provide hard conversion or time-saved metrics outside the MakerWorld case study.
