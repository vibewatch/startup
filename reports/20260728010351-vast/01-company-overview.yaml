  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, board observer rights, and executive org chart.
    whyItMatters: A fast-rising valuation with a founder-centric public surface creates real governance and key-person risk if oversight is weak.
    diligencePath: Request a current board deck, cap table with governance rights, and executive org chart directly from management.
    relatedQuestionRefs:
    - QO013
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: Authoritative legal-entity map tying Holymolly Ltd, VAST Cayman registration, mainland China operating entities, and any Shanghai or Hong Kong affiliates together.
    whyItMatters: Entity-stack ambiguity affects contracting risk, IP ownership, capital structure, and regulatory exposure.
    diligencePath: Request certificates of incorporation, SAFE/VIE or offshore-holding documents, and a current legal-entity chart from counsel.
    relatedQuestionRefs:
    - QO001
    - QO002
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: Audited or board-reported definitions for users, creators, developers, studios, enterprise customers, and paying accounts.
    whyItMatters: Public scale claims drive valuation narrative, but conflicting numerators can distort customer quality and monetization assumptions.
    diligencePath: Request a board KPI pack showing MAU, WAU, paying accounts, enterprise logos, and cohort definitions by month.
    relatedQuestionRefs:
    - QO011
    - QO021
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, burn, runway, and headcount by function.
    whyItMatters: The company-overview chapter can show momentum but cannot underwrite unit economics or capital adequacy without core financials.
    diligencePath: Request a 12-month P&L, ARR bridge, burn/runway schedule, and current employee census by department.
    relatedQuestionRefs:
    - QO022
    - QO023
    relatedTableRefs:
    - TO001
