- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / current signal
  - Diligence ask
  rows:
  - - End-to-end 3D workflow packaging
    - Meshy already offers similar web, export, plugin, and API packaging
    - High
    - Tripo still markets a broader all-in-one 3D workstation identity
    - Review win/loss data versus Meshy by creator and studio segment
  - - Proprietary model lead
    - Stability openly building on TripoSR shows research diffusion into ecosystem tools
    - High
    - Tripo can still differentiate in workflow depth and integrated productization
    - Ask what percentage of paid usage depends on features unavailable in open alternatives
  - - Spatial-intelligence / world-model narrative
    - Luma, OpenAI, and NVIDIA also frame physical-world or world-model ambition
    - Medium
    - Tripo has 3D-native product proof, not just narrative positioning
    - Test whether customers buy Tripo for current workflow or for future world-model story
  - - Enterprise procurement trust
    - Adobe and Azure come with stronger bundled trust, moderation, and buying relationships
    - High
    - Tripo can win where specialized 3D output matters more than suite standardization
    - Request security, compliance, and renewal evidence from larger accounts
  - - Self-serve creator acquisition
    - Multi-homing and low switching cost let creators chase newest model quality
    - High
    - Published pricing and frequent releases can still keep Tripo in consideration
    - Measure paid-conversion and churn after rival major launches
  - - API and workspace lock-in
    - If customers only use generation endpoints, switching remains easy
    - Medium
    - Shared workspaces, asset history, and admin features can raise embed depth
    - Break out revenue from API/workspace cohorts versus casual seat buyers
  - - Manual DCC fallback
    - Many teams can keep Blender/Substance/manual workflows and use AI only opportunistically
    - Medium
    - Strong time savings and export readiness can still create repeat usage
    - Run pipeline benchmark showing where Tripo reduces real artist hours, not just demo time
  notes: Severity reflects risk to durability rather than immediate share loss. The common pattern is commoditization of baseline generation while value migrates to workflow, trust, and embedded usage.
