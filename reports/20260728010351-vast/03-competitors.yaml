    detail: CB Insights confirms a broader 3D asset creation category, but this chapter did not independently fetch current official pages for every long-tail peer such as Kaedim or Kinetix.
  - id: GP002
    topic: Tripo versus Meshy win-loss, conversion, and retention data
    severity: high
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
    detail: Public sources reveal product overlap and transparent list pricing, but they do not show paid conversion, net retention, or enterprise renewal performance in direct head-to-head competition.
  - id: GP003
    topic: Realized enterprise pricing and discounting across Tripo, Meshy, Adobe, and Luma
    severity: medium
    relatedQuestionRefs:
    - QP004
    - QP010
    - QP014
    relatedTableRefs:
    - TP003
    detail: Self-serve list prices are public for several vendors, but contract pricing, volume discounts, API minimums, and bundled enterprise terms remain opaque.
  - id: GP004
    topic: Independent benchmark of production-readiness across Tripo, Meshy, and Stability models
    severity: high
    relatedQuestionRefs:
    - QP005
    - QP016
    relatedTableRefs:
    - TP002
    detail: Retained sources provide company-authored capability claims and some technical descriptions, but not a controlled third-party benchmark on export cleanup, topology, rigging, or downstream engine performance.
