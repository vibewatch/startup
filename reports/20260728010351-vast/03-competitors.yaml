- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Price / unit / contract model
  - Included capabilities
  - Discounts or unknowns
  - Implication
  rows:
  - - Tripo AI
    - Free; Pro about $19.9 monthly / $13.93 annualized; Max about $89 monthly / $53.94 annualized; Team seat pricing
    - Credits, concurrency, mesh-quality upgrades, batch generation, private models, team workspace
    - Realized enterprise pricing and API economics are not public
    - Clear self-serve ladder helps creator conversion but exposes direct comparison risk
  - - Meshy
    - Free $0; Pro $20/mo; Studio $60/mo; Enterprise custom
    - Credits, faster generation, API access, private ownership, concurrency, enterprise controls
    - Promotional discounts can change entry price; enterprise pricing undisclosed
    - Buyer comparison versus Tripo is immediate because both publish consumer-facing tiers
  - - Luma
    - Credit-based plans plus team and enterprise commitments; Ray3.14 base around 4 credits/sec
    - Video/image models, Luma Agents usage, team management, SSO, analytics
    - Dollar translation of credits varies by plan and output mode
    - Expands competition when buyers budget by media output rather than by mesh asset
  - - Adobe Firefly
    - Free daily generations plus paid plans with generative credits
    - Image, video, audio, vectors, editing, partner models, commercial-safe workflow
    - Public plan page is high level in retained evidence; exact enterprise discounts unknown
    - Bundled credits and incumbent trust can make separate specialist tools harder to justify
  - - Stability AI
    - API / platform and community-license distribution; no simple consumer tier on retained pages
    - Stable Fast 3D, SPAR3D, API access, open/community ecosystem
    - List pricing for 3D usage was not retained in public sources reviewed here
    - Competes through developer adoption and commoditization pressure more than clean seat pricing
  - - OpenAI / Azure Sora 2
    - Per-second billing through async API model
    - Text/image/video-to-video, remix, audio, Azure safeguards and moderation
    - Public retained source omits simple end-user package comparison with Tripo
    - Relevant mostly for adjacent budget capture and platform consolidation
  notes: Pricing visibility is much better for direct packaged rivals than for platform or API substitutes; that itself is a competitive advantage for Tripo and Meshy in self-serve acquisition.
