  rows:
  - - Tripo AI
    - Direct AI-native 3D workstation
    - Publicly reported 10M+ users / 90k+ enterprise or studio clients; recent $200M round in prior chapter context
    - Creators, game/XR teams, e-commerce, design, API buyers
    - End-to-end 3D-native workflow, creator brand, spatial-intelligence narrative
    - Public competitive proof on retention and realized enterprise depth remains thin
  - - Meshy
    - Direct AI-native 3D workstation
    - Claims $15M ARR, 30% MoM growth, 6M users, 85% gross margin
    - Creators, game developers, 3D printing, teams, enterprise
    - Transparent pricing, strong plugin/API story, enterprise controls, rapid 2026 shipping
    - Claims come largely from company-authored materials; independent validation is limited
  - - Stability AI
    - Open/API 3D model platform
    - Enterprise platform plus open-source repos and developer API
    - Developers, gaming, VR, retail, design teams
    - Fast single-image 3D, API/community distribution, open ecosystem leverage
    - Less packaged as a polished creator workstation than Tripo or Meshy
  - - NVIDIA + SPAR3D
    - Platform amplifier / ecosystem entrant
    - CES launch with RTX AI PC distribution and NVIDIA partnership narrative
    - Developers, product designers, environment builders
    - Hardware-linked distribution and real-time point-cloud editing story
    - Not a standalone end-user 3D SaaS destination in retained evidence
  - - Luma
    - Adjacent multimodal creative platform
    - Backed by HUMAIN, a16z, Amazon, AMD Ventures, NVIDIA, Amplify, Matrix
    - Studios, agencies, enterprise marketing, developers
    - Ray3.x cinematic control, HDR/EXR, API, creative-agents platform
    - Focus is video and multimodal creation more than exportable 3D meshes
  - - Adobe Firefly + Substance 3D
    - Incumbent creative-suite substitute
    - Massive installed base and bundled Creative Cloud distribution
    - Designers, marketers, creative teams, enterprise buyers
    - Commercial-safety story, Content Credentials, partner-model hub, Substance adjacency
    - Dedicated 3D mesh generation and export workflow is less explicit than Tripo/Meshy
  - - OpenAI / Azure Sora 2
    - Adjacent platform substitute
    - OpenAI model deployed through Azure with enterprise API and moderation layer
    - Developers, enterprise app builders, creative teams
    - Text/image/video-to-video, remix, audio, per-second billing, Azure trust layer
    - No retained evidence of dedicated 3D mesh workflow or asset-library product
  - - Manual tools / internal build
    - Status quo substitute
    - Existing labor budgets and incumbent DCC stack
    - Studios, designers, internal pipeline teams
    - Highest control, familiar tools, no model-vendor dependency
    - Slowest iteration and weakest democratization for non-experts
  notes: Direct competition is strongest where buyers need exportable 3D assets inside real pipelines; broader creative platforms compete more for adjacent budget and trust than for identical mesh workflows.
