callouts:
- calloutType: strength
  title: The real head-to-head is Tripo versus Meshy, not Tripo versus Sora
  body: The most decision-useful public comparison is between two transparent, web-first, AI-3D products with credits, exports, plugins, and API stories. Broader multimodal platforms matter, but mostly by surrounding the category rather than by matching Tripo mesh-for-mesh today.
  claimRefs:
  - CP004
  - CP005
  - CP019
  - CP030
- calloutType: risk
  title: Research diffusion is a real moat leak
  body: Stability's own Stable Fast 3D repository explicitly says the model is based on TripoSR. That is unusually direct evidence that core 3D reconstruction advances can spread into competing ecosystems, reducing the value of treating research novelty alone as a durable moat.
  claimRefs:
  - CP014
  - CP016
  - CP028
  - CP035
- calloutType: insight
  title: Winning the generator is not enough if others own the workflow around it
  body: Adobe, Azure/OpenAI, and Luma demonstrate that enterprise buyers may care as much about trust, moderation, incumbent workflow, and bundled spend as about pure 3D output quality. Tripo's best defense is to embed deeper into production workflows where a generic multimodal suite is a poor substitute.
  claimRefs:
  - CP026
  - CP027
  - CP036
  - CP038
