      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              VAST documents substantive mitigations, including DBox redundancy, DBox-HA, erasure coding, encryption,
              role-based and attribute-based access control, immutable snapshots, and external key-management support.
              The same white paper also identifies configuration boundaries that matter to underwriting: a classic
              cluster can go offline with a whole DBox failure; DBox-HA requires at least eight DBoxes and raises
              protection overhead in the stated example; cloud-local NVMe alone does not deliver the durability claimed
              for on-premises systems; and a single cloud instance has no failure protection. These are not evidence of
              incidents. They are reasons to verify the exact topology, availability tier, RPO/RTO tests, encryption
              settings, privileged-support process, and cloud persistence mode for each material deployment. A kill
              criterion should be any production-critical environment that cannot demonstrate recovery from its declared
              failure domain or any unremediated material security exception.
