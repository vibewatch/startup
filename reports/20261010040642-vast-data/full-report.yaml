        title: Contract Durability, Retention Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              VAST Data's customer durability benefits from exceptional architectural switching barriers and extended
              commercial commitment terms. Typical enterprise contracts run for durations of five to seven years,
              creating high revenue visibility and insulation from short-term churn. Because VAST's Disaggregated Shared
              Everything (DASE) platform stores primary training data, operational metadata, and real-time vector
              indexes, displacing the platform requires complex, high-risk data migration across petabyte-to-exabyte
              volumes. Industry analyses note that once an organization deploys VAST into active production, customer
              churn remains remarkably low. However, this architectural lock-in is counterbalanced by acute commercial
              concentration risk. High-profile neocloud accounts such as CoreWeave and sovereign cluster buildouts
              represent a disproportionate share of contracted pipeline and committed ARR. Consequently, VAST faces
              meaningful counterparty exposure if leading GPU cloud providers experience capacity digestion, financing
              constraints, or renegotiations upon contract expiration. Additionally, independent research notes that
              while VAST's platform is highly capable, enterprise buyers face platform lock-in risks because migrating
              AI-focused vector and unstructured data out of VAST's integrated ecosystem requires substantial data
              engineering overhead.
