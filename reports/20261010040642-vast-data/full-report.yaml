  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator
      - Unresolved gap
    rows:
      - - Whole-enclosure or rack failure under an underspecified availability design
        - Medium
        - High
        - Documented architecture; deployment-specific
        - High when classic mode is used for critical workloads; lower with tested DBox-HA
        - Recovery tests, free rebuild capacity, failed-domain duration, and protection state
        - Actual topology, availability tier, and customer RPO/RTO results
      - - Cloud instance or zonal failure causes data unavailability or loss
        - Medium
        - High
        - Persistence and replication patterns documented
        - High for local-only or single-instance use; configuration-dependent otherwise
        - Persistent-checkpoint lag, replication health, zone-failover test, and instance count
        - Production cloud configurations and durability commitments
      - - Privileged compromise, ransomware, or key-control failure
        - Medium
        - High
        - Multiple controls documented; operating effectiveness unverified
        - Material because emergency deletion uses a support-issued token under customer rules
        - Privileged access events, immutable-snapshot coverage, token issuance, and restore tests
        - Independent attestations, incidents, exceptions, and support-process audit
      - - Product roadmap or scaling feature arrives late or below required maturity
        - Medium
        - Medium
        - Existing platform is substantial; future features remain demand-dependent
        - Material for buyers underwriting unshipped cross-cluster and cloud-elasticity capabilities
        - GA dates, adoption, support cases, release slippage, and workload-specific benchmarks
        - Contracted roadmap commitments and production references
    notes: >-
      Qualitative ratings distinguish documented design mitigations from verified deployment performance; no public
      incident rate or SLA-attainment denominator was available.
