  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Recommendation, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              VAST Data occupies a strategically critical position in the modern artificial intelligence stack,
              transforming from high-performance storage into a comprehensive AI Operating System that integrates
              storage, database functionality, and containerized compute. The company's technical architecture, based on
              Disaggregated Shared Everything (DASE), enables exabyte-scale deployments supporting millions of GPUs
              worldwide across major AI infrastructure providers including CoreWeave, Nscale, Firmus, and Fluidstack.
              Financial execution has been exceptionally rapid, with cumulative bookings surpassing $4 billion and
              committed annual recurring revenue (CARR) exceeding $500 million while maintaining operating profitability
              and positive free cash flow over several years. However, the April 2026 Series F funding round—which
              raised approximately $1 billion in combined primary and secondary capital led by Drive Capital and Access
              Industries—valued VAST Data at $30 billion. This headline price tags the company at roughly 60x committed
              ARR, leaving virtually zero margin of safety for external public shocks, hardware transition cycles, or AI
              multiple contraction. Consequently, our recommendation for uncommitted institutional capital is track,
              advising investors to maintain strict valuation discipline and await detailed private diligence on revenue
              composition, customer concentration, and contractual retention before participating at or near round
              pricing.
            claimRefs:
