  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is not a documented failure; it is the combination of migration friction, a
              vertically integrated operating model, and limited public evidence on concentration. Dell, an interested
              competitor rather than an independent benchmark, argues that VAST requires data to enter its namespace and
              depends on hardware and integration partners. VAST's own technical description confirms a
              shared-everything architecture in which every compute node mounts every SSD and system state is shared
              across the cluster. That supports a high-impact lock-in hypothesis, but not Dell's broader commercial
              conclusions. Financial disclosure is the second major risk: current reporting distinguishes cumulative
              bookings and committed ARR from cash-flow claims, while 2023 public materials used ARR and signed-contract
              language for the same headline amount. Proposed thesis-break triggers are a top customer above 20% of ARR
              without contractual protection, inability to reconcile reported commercial metrics within 10%, or a
              critical workload deployed without a tested recovery design. Those thresholds are investment controls, not
              reported facts.
