        title: Scenario Valuation, Peer Comparables, and Diligence Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              A robust scenario framework demonstrates that VAST Data's current valuation embeds sustained high-growth
              execution and continued public-market enthusiasm for AI infrastructure assets. In our bull scenario,
              durable recurring revenue scales toward $1.5 billion to $2.0 billion as enterprise agentic deployments
              mature, supporting a 20x to 25x multiple and an enterprise valuation of $30 billion to $45 billion upon
              public listing. In our base scenario, audited recurring revenue stabilizes in the $800 million to $1.0
              billion range with moderate enterprise expansion, yielding a valuation of $16 billion to $22 billion at a
              18x to 22x software-infrastructure multiple—representing a 25% to 45% discount to the Series F mark. In
              our bear scenario, AI capital expenditure cycles cool, hyperscaler in-house storage alternatives compress
              pricing power, or major neocloud customers renegotiate capacity, compressing revenue to $600 million to
              $700 million and multiples to 10x to 12x, resulting in an equity value of $6.0 billion to $8.5 billion.
              Relative to public infrastructure peers such as Pure Storage and NetApp, VAST trades at a multiple premium
              exceeding 5x, placing the burden of proof squarely on private metrics. Investors must establish strict
              kill triggers: any audit finding that reveals top-three customer concentration exceeding 45% of ARR,
              trailing gross margins below 70%, or a prolonged stall in formal IPO governance preparations should
              immediately terminate further investment consideration.
