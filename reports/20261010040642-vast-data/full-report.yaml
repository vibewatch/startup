            body: >-
              To support enterprise on-premises and sovereign AI factory deployments, VAST packages its software stack
              onto turnkey hardware platforms through strategic original equipment manufacturer (OEM) and cloud
              partnerships. The Cisco AI Data Platform with VAST AI OS pairs Cisco CNode-X compute systems (UCS C845A M8
              rack servers equipped with dual AMD EPYC 5th Generation processors and eight NVIDIA RTX PRO 6000 GPUs)
              with Cisco EBox persistent storage nodes (UCS C225 M8 rack servers housing all-flash NVMe SSDs and
              storage-class memory). In validated Cisco configurations, each individual EBox delivers up to 21 GB/s read
              throughput, 10 GB/s peak burst write throughput, and 2.6 GB/s sustained write throughput, backed by dual
              Mellanox ConnectX-7 400GbE network interfaces. However, initial cluster dimensioning imposes critical
              performance constraints: deployments configured with fewer than 12 EBox storage nodes suffer an
              approximate 6% to 15% reduction in maximum write bandwidth because the write buffer stripe width is
              permanently fixed at installation time and cannot be dynamically widened post-deployment. From a
              commercial standpoint, VAST operates purely as a software subscription model with terms spanning 36 to 60
              months, pricing licenses based on usable capacity (per terabyte) and orchestrated CPU cores, with no
              perpetual licensing option available.
