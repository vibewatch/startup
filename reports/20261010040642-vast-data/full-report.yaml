  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Disaggregated Shared-Everything (DASE) Core Architecture
        blocks:
          - type: paragraph
            body: >-
              VAST Data's foundational innovation is its Disaggregated Shared-Everything (DASE) architecture, designed
              to eliminate the performance bottlenecks, stranded capacity, and metadata synchronization overhead endemic
              to traditional scale-out NAS and shared-disk storage systems. In conventional clustered storage, compute
              and storage are tightly coupled within individual appliances, requiring complex inter-node chatter,
              distributed cache coherence protocols, and data re-balancing during scale-out operations. DASE resolves
              these structural constraints by separating stateless front-end compute nodes (CNodes) from highly dense,
              persistent flash storage enclosures (DNodes or EBoxes) over a low-latency NVMe over Fabrics (NVMe-oF)
              network fabric using RoCE or InfiniBand. Because front-end compute nodes are entirely stateless and
              maintain no persistent local cache, any compute node can directly address any NVMe solid-state drive
              across the entire cluster without routing requests through an owning node or engaging in distributed
              locking. A global transactional element store provides Atomicity, Consistency, Isolation, and Durability
              (ACID) semantics across all operations using atomic RDMA primitives, enabling simultaneous multi-protocol
              access to files, objects, and tabular records within a unified global namespace (DataSpace).
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
