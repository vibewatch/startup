      - number: '4.3'
        title: Cost Structure, Gross Margin Dynamics, and Cash Flow Profile
        blocks:
          - type: paragraph
            body: >-
              VAST Data's cost structure reflects the operational advantages of an asset-light, software-defined
              business model. By offloading server and drive manufacturing, logistics, and hardware inventory to partner
              OEMs, the company avoids physical cost of goods sold and achieves reported software gross margins of
              approximately 90%. Cost of delivery is primarily composed of engineering support, cloud telemetry
              infrastructure, and technical customer success. The company reports maintaining positive operating margins
              and positive free cash flow for several consecutive years, eliminating operational burn and external
              capital dependency. However, because VAST's disaggregated architecture is optimized exclusively for
              all-flash QLC NAND media, enterprise customer hardware procurement remains sensitive to cyclical flash
              memory pricing and supply chain constraints, which can indirectly compress enterprise software budget
              allocations.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
