chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Genesis, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              VAST Data was established in 2016 by Renen Hallak and Shachar Fienblit to address the critical
              input/output bottlenecks emerging from modern deep learning and distributed data systems. The enterprise
              operates under a remote-first organizational structure with official global headquarters located in New
              York City, supported by major specialized research and development centers in Tel Aviv and Haifa, Israel.
              Unlike conventional enterprise storage vendors that silo file, block, and object access into disparate
              hardware appliances, VAST Data engineered its platform around a breakthrough Disaggregated
              Shared-Everything (DASE) software architecture. The DASE model unifies unstructured file and object
              storage, high-throughput tabular databases, and containerized compute engine capabilities into a single
              software-defined substrate termed the VAST AI Operating System. This architecture decouples stateless
              compute logic from globally accessible, shared non-volatile flash media, enabling thousands of graphics
              processing units (GPUs) and AI accelerator nodes to simultaneously query and ingest petabyte-scale
              datasets without lock contention, latency spikes, or filesystem fragmentation. The company's recent
              technology extensions, including confidential AI runtimes and the Polaris global control plane developed
              in close alignment with NVIDIA's computing ecosystem, target large-scale frontier model training
              laboratories, national research centers, and enterprise AI factories requiring continuous real-time data
              access.
            claimRefs:
              - CO001
              - CO010
              - CO011
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
