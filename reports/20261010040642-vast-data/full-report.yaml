              independent certification report, penetration-test summary, incident register, or privacy audit. The
              adverse search record returned no allocated URLs; that is a coverage limitation and must not be read as
              proof that no lawsuit, enforcement action, breach, or outage exists. VAST markets an isolated, encrypted,
