      - number: '4.4'
        title: Capital Adequacy, Concentration Risks, and Underwriting Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              In 2026, VAST Data finalized a $1 billion Series F financing round at a $30 billion valuation led by Drive
              Capital and Access Industries, providing growth capital and secondary shareholder liquidity while
              positioning the company for potential IPO readiness. Despite robust reported capitalization and
              self-funding operating cash flows, institutional underwriting faces substantial diligence hurdles. VAST's
              forward bookings exhibit heavy customer concentration, underscored by a landmark $1.17 billion multi-year
              agreement with neocloud provider CoreWeave. Any plateau in generative AI infrastructure spending or shift
              in CoreWeave's hardware roadmap poses direct downside risk to projected revenue. Furthermore, enterprise
              hardware incumbents including Dell Technologies have launched competitive counter-campaigns, specifically
