        blocks:
          - type: paragraph
            body: >-
              VAST Data's customer base is structured across four primary segments: hyperscale and specialized GPU
              neocloud providers, sovereign AI infrastructure operators, regulated enterprise accounts, and
              high-performance computing or research institutions. In the specialized neocloud segment, buyers are
              infrastructure engineering leaders and cloud architects whose economic model requires maximizing GPU
              utilization and eliminating storage I/O bottlenecks. In the sovereign and regional cloud segment,
              operators such as Nscale in Europe, BUZZ HPC in Canada, and Sharon AI in Australia purchase VAST
              infrastructure to deliver hardware-isolated, compliant compute environments that adhere to local data
              residency requirements. Regulated enterprise accounts—spanning global financial institutions, healthcare
              networks like Boston Children's Hospital, and commercial enterprises like Booking Holdings—procure VAST
              through CIO and Chief AI Officer mandates to unify unstructured file repositories and vector embeddings
              under strict zero-trust governance. Finally, research and public-sector institutions, including NASA and
              the US Department of Energy, utilize VAST for multi-exabyte scientific simulations and petabyte-scale data
              pipelines. Across these groups, procurement is shifting from standalone storage evaluations to
              comprehensive AI platform architectures co-engineered with server OEMs and compute partners.
