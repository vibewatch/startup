      - number: '5.4'
        title: Write-Path Mechanics, Network Fabric Pressure, and Architectural Risks
        blocks:
          - type: paragraph
            body: >-
              Despite VAST's substantial throughput and architectural simplicity advantages for read-heavy deep learning
              workloads, independent storage architectural analysis highlights meaningful engineering trade-offs
              inherent in the DASE write path and shared-everything topology. Because VAST utilizes commodity quad-level
              cell (QLC) NAND flash to achieve archive-like storage economics, incoming writes cannot be written
              directly to flash in small granular blocks without causing severe write amplification and premature drive
              wear. Instead, incoming client writes are routed to storage-class memory (3D XPoint) buffers and
              triplicated across three distinct physical media targets to guarantee power-fail safety before being
              acknowledged. Consequently, writes experience an estimated 3:1 performance penalty compared to reads,
              which is further exacerbated by the higher power consumption and lower write bandwidth of solid-state
              media. Furthermore, because every stateless compute node mounts every storage drive across the cluster via
              NVMe-oF, large-scale deployments create dense all-to-all communication patterns that place severe pressure
              on the storage network fabric, making cluster performance highly vulnerable to network topology congestion
              and packet loss. Additionally, client-side NFS access enforces close-to-open consistency rather than
              strict POSIX locking, meaning concurrent overlapping writes to identical file extents from multiple client
              hosts can produce data corruption unless applications enforce direct I/O semantics.
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: DASE Architectural Scalability
            body: >-
              Decoupling stateless compute nodes from persistent storage media eliminates distributed locking and
              per-node cache coherence overhead, enabling independent compute and storage scaling while maintaining
              transactional ACID semantics across a unified exabyte-scale namespace.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Write Amplification and Sizing Constraints
            body: >-
              Buffering incoming writes across storage-class memory with 3x replication introduces an intrinsic
              write-throughput penalty relative to read performance, while sub-12 node cluster configurations
              permanently lock narrower write striping, requiring careful upfront hardware sizing.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
