  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, license, or case
      - Jurisdiction
      - Public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Data protection and security assurance
        - Global; customer-specific
        - Product controls described; independent operating-effectiveness evidence not allocated
        - Medium
        - High
        - Encryption, RBAC, ABAC, key management, and immutable snapshots
        - Material until certifications, exceptions, and incident history are verified
        - Obtain SOC 2 and ISO reports, penetration tests, incident log, and customer security exceptions
      - - Data residency, privacy, and sovereign-data obligations
        - United States, EU, Israel, and material sales jurisdictions
        - Sensitive-data and confidential-runtime claims are public; jurisdictional mappings are not
        - Medium
        - High
        - Isolated and encrypted runtime plus transport and at-rest encryption
        - Migration and centralized-control design may complicate residency or customer governance
        - Map data flows, subprocessors, transfer mechanisms, retention, and customer-controlled keys
      - - Litigation, IP, export-control, sanctions, and enforcement
        - Global
        - Unverified; assigned adverse query returned no allocated source URLs
        - Unknown
        - High
        - No public mitigation established in the assigned evidence
        - Material evidence gap; no-URL search outcome is not proof of no proceedings
        - Run court, regulator, patent, sanctions, and export-control searches and obtain counsel letters
    notes: >-
      Rows are severity-ordered analyst assessments based on the assigned public evidence; likelihood is not an
      incident-frequency estimate, and unverified does not mean absent.
    enumerationScope:
