      - number: '4.2'
        title: Commercial Traction, Enterprise Scale, and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              VAST Data has demonstrated unprecedented commercial acceleration within enterprise infrastructure, scaling
              from early commercialization to reported committed annual recurring revenue exceeding $500 million and
              cumulative bookings surpassing $4 billion by early 2026. The company reached $100 million in ARR within
              three years of launch and achieved $200 million in ARR by December 2023, reflecting rapid adoption among
              data-intensive organizations. VAST's enterprise go-to-market motion focuses on accounts with
              petabyte-scale unstructured data requirements across AI research, life sciences, quantitative finance, and
              GPU cloud infrastructure. Among its top 100 new accounts, average annual commitments exceed $1.2 million,
              with top customer engagements scaling beyond $100 million in total platform spend. Reported penetration
              exceeds 25% of the Fortune 100 alongside major GPU cloud service providers, establishing strong enterprise
              validation despite an opaque private reporting environment.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
