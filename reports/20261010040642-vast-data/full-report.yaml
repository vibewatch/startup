  - id: FI001
    title: Customer Workload Conversion to Software Gross Margin
    type: flow
    summary: >-
      Seven-stage conversion flow mapping how enterprise AI workload demands translate into capacity-based software
      subscriptions, bookings, and high gross margin realization.
    data:
      nodes:
        - id: node-ingest
          label: AI Workload Ingestion
          description: >-
            Enterprises and GPU clouds generate exabyte-scale unstructured training and inference datasets requiring
            accelerated data access.
        - id: node-dase
          label: Hardware Enclosure Setup
          description: >-
            Customer deploys certified NVMe-oF commodity flash hardware via OEM partners such as Dell, Cisco, or
            Supermicro.
        - id: node-license
          label: Software Capacity License
          description: >-
            Customer licenses VAST AI OS software under multi-year subscription based on total raw storage capacity
            deployed.
        - id: node-commit
          label: Annual Contract Commitments
          description: >-
            Customer executes annual commitments averaging $1.2M for top 100 accounts or scaling to $100M+ for
            hyperscalers.
        - id: node-arr
          label: Committed ARR Recognition
          description: Contract commitments convert into committed annual recurring revenue, surpassing $500M in committed ARR.
        - id: node-cogs
          label: Software-Only Cost of Delivery
          description: >-
            VAST incurs zero hardware manufacturing or warranty costs, with delivery expenses limited to support and
            telemetry.
        - id: node-margin
          label: Realized Gross Profit
          description: Software-defined model yields approximately 90% gross margins and sustained positive operating cash flow.
      edges:
        - from: node-ingest
          to: node-dase
          label: Demands high-throughput NVMe fabric
        - from: node-dase
          to: node-license
          label: Capacity provisions VAST AI OS software
        - from: node-license
          to: node-commit
          label: Capacity pricing formalizes annual spend
        - from: node-commit
          to: node-arr
          label: Contract commitments establish ARR base
        - from: node-arr
          to: node-cogs
          label: Revenue delivers with asset-light COGS
        - from: node-cogs
          to: node-margin
          label: Generates 90% software gross margin
    approximationNotes: >-
      Flow stages illustrate standard commercial progression and software gross margin realization; individual contract
      ramp milestones vary.
    claimRefs:
      - CI001
      - CI003
      - CI007
      - CI010
      - CI013
