  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Scope, and Architectural Shifts
        blocks:
          - type: paragraph
            body: >-
              The enterprise storage and data management market is experiencing a structural architectural
              transformation driven by the scaling demands of accelerated artificial intelligence computing. Legacy
              storage infrastructures historically relied on dual-controller storage area networks (SAN) and
              network-attached storage (NAS) designed around hierarchical tiering, where expensive high-speed flash was
              strictly isolated from high-capacity hard disk drives. Under generative AI training and large-scale
              inference workloads, this legacy model fails: thousands of GPUs running parallel checkpointing and token
              ingestion rapidly saturate traditional storage controllers, leaving multi-million-dollar accelerator
              clusters idle during data fetch cycles. VAST Data defines its addressable market boundary around the AI
              Operating System layer, utilizing a Disaggregated Shared Everything (DASE) architecture that physically
              separates stateless compute nodes (CNodes) from high-density flash storage media (DBoxes) over an
              NVMe-over-Fabrics network fabric. Included spend within VAST's core market comprises high-throughput flash
              file and object storage, real-time vector databases, embedded runtime task engines, and hybrid-cloud data
              fabric software. Conversely, commodity bulk backup for legacy virtual machines, physical tape archiving,
              and commodity enterprise file shares that do not interact with accelerated compute fall outside the
              primary target spend boundary.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing, Growth Drivers, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable opportunity for modern AI data platforms requires balancing expansive top-down
              macroeconomic forecasts with evidence-constrained commercial realities. Industry forecasters and ARK
              Invest have posited that the market capitalization of AI hardware and software vendors could scale at a
              50% annualized pace toward $87 trillion by 2030, with data platforms representing an addressable market
              exceeding $400 billion over the next decade. More immediately, Tech Insider identified a $76 billion wave
              in AI data infrastructure spending powering large-scale training and inference deployments. Concurrently,
              independent research from Manhattan Venture Partners projected VAST Data's annual software revenues
              between $540 million and $700 million in 2025, charting a five-year trajectory toward $2.49 billion to
              $3.35 billion by 2030. In practice, the serviceable addressable market (SAM) is bounded by organizations
              operating high-density GPU clusters and enterprise datasets exceeding 10 petabytes, such as specialized
              neoclouds, national research supercomputers, and Fortune 500 AI labs. VAST Data's commercial
              disclosures—exceeding $500 million in committed ARR at the close of fiscal year 2025 alongside more than
              $4 billion in cumulative software bookings—demonstrate substantial serviceable obtained market (SOM)
              penetration within these high-capacity environments, even as broad enterprise production adoption remains
              in early phases.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
