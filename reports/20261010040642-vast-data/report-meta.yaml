companyProfile:
  summary: >-
    VAST Data is a late-stage private AI infrastructure company founded in 2016 that sells the VAST AI Operating System
    and DASE-based software for enterprise and neocloud workloads. It is headquartered in New York City with major R&D
    operations in Israel, monetizes through capacity-based software subscriptions, and has scaled to a $30 billion
    Series F valuation while sustaining positive cash flow and large enterprise adoption. The remaining underwriting
    questions center on revenue-quality reconciliation, customer concentration, and cap-table transparency.
