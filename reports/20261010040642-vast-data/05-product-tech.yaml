  title: "Product & Technology"
  summary: "VAST Data delivers a unified AI Operating System built on its Disaggregated Shared-Everything (DASE) architecture that decouples stateless compute nodes from persistent all-flash storage over an NVMe-oF fabric. Validated hardware integrations with Cisco UCS and NVIDIA accelerate enterprise RAG and deep learning pipelines, while write-path triplication in storage-class memory introduces latency and networking trade-offs under write-intensive workloads."
sections:
  - id: "dase-architecture-core"
    title: "Disaggregated Shared-Everything (DASE) Core Architecture"
    body: "VAST Data's foundational innovation is its Disaggregated Shared-Everything (DASE) architecture, designed to eliminate the performance bottlenecks, stranded capacity, and metadata synchronization overhead endemic to traditional scale-out NAS and shared-disk storage systems. In conventional clustered storage, compute and storage are tightly coupled within individual appliances, requiring complex inter-node chatter, distributed cache coherence protocols, and data re-balancing during scale-out operations. DASE resolves these structural constraints by separating stateless front-end compute nodes (CNodes) from highly dense, persistent flash storage enclosures (DNodes or EBoxes) over a low-latency NVMe over Fabrics (NVMe-oF) network fabric using RoCE or InfiniBand. Because front-end compute nodes are entirely stateless and maintain no persistent local cache, any compute node can directly address any NVMe solid-state drive across the entire cluster without routing requests through an owning node or engaging in distributed locking. A global transactional element store provides Atomicity, Consistency, Isolation, and Durability (ACID) semantics across all operations using atomic RDMA primitives, enabling simultaneous multi-protocol access to files, objects, and tabular records within a unified global namespace (DataSpace)."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "platform-modules-workflows"
    title: "Software Modules, InsightEngine, and Workflow Execution"
    body: "The VAST AI Operating System consolidates four primary functional engines into an integrated software stack, moving enterprise data management beyond passive file storage into active computational infrastructure. The underlying DataStore delivers high-throughput multi-protocol file and object access supporting NFSv3/4.1, SMB 2.1/3.1, S3 object APIs, and NVMe-over-TCP without duplicating data across separate functional pools. Layered directly atop this substrate, VAST DataBase provides a low-latency columnar and tabular database supporting real-time SQL analytics, feature store operations, and native vector storage for retrieval-augmented generation (RAG). VAST DataEngine functions as an event-driven serverless processing tier that automates ingestion, transformation, and indexing directly as new data arrives on flash. Building upon these services, VAST InsightEngine continuously classifies incoming enterprise content, extracts contextual features, and generates vector embeddings via deep integration with NVIDIA Inference Microservices (NIM). This automated vectorization allows enterprises and foundation model builders to query exabyte-scale unstructured datasets in real time without engineering complex external ETL data pipelines. In media and entertainment environments, deployment partners such as Scale Logic utilize this unified namespace to eliminate traditional tiered hierarchies, providing simultaneous real-time multi-stream playback for 4K/8K video editing and seamless long-term archival."
    claimRefs:
      - "CE002"
      - "CE011"
      - "CE012"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "hardware-appliance-specifications"
    title: "Hardware Appliance Packaging, Performance, and Commercial Licensing"
    body: "To support enterprise on-premises and sovereign AI factory deployments, VAST packages its software stack onto turnkey hardware platforms through strategic original equipment manufacturer (OEM) and cloud partnerships. The Cisco AI Data Platform with VAST AI OS pairs Cisco CNode-X compute systems (UCS C845A M8 rack servers equipped with dual AMD EPYC 5th Generation processors and eight NVIDIA RTX PRO 6000 GPUs) with Cisco EBox persistent storage nodes (UCS C225 M8 rack servers housing all-flash NVMe SSDs and storage-class memory). In validated Cisco configurations, each individual EBox delivers up to 21 GB/s read throughput, 10 GB/s peak burst write throughput, and 2.6 GB/s sustained write throughput, backed by dual Mellanox ConnectX-7 400GbE network interfaces. However, initial cluster dimensioning imposes critical performance constraints: deployments configured with fewer than 12 EBox storage nodes suffer an approximate 6% to 15% reduction in maximum write bandwidth because the write buffer stripe width is permanently fixed at installation time and cannot be dynamically widened post-deployment. From a commercial standpoint, VAST operates purely as a software subscription model with terms spanning 36 to 60 months, pricing licenses based on usable capacity (per terabyte) and orchestrated CPU cores, with no perpetual licensing option available."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE003"
  - id: "technical-risks-tradeoffs"
    title: "Write-Path Mechanics, Network Fabric Pressure, and Architectural Risks"
    body: "Despite VAST's substantial throughput and architectural simplicity advantages for read-heavy deep learning workloads, independent storage architectural analysis highlights meaningful engineering trade-offs inherent in the DASE write path and shared-everything topology. Because VAST utilizes commodity quad-level cell (QLC) NAND flash to achieve archive-like storage economics, incoming writes cannot be written directly to flash in small granular blocks without causing severe write amplification and premature drive wear. Instead, incoming client writes are routed to storage-class memory (3D XPoint) buffers and triplicated across three distinct physical media targets to guarantee power-fail safety before being acknowledged. Consequently, writes experience an estimated 3:1 performance penalty compared to reads, which is further exacerbated by the higher power consumption and lower write bandwidth of solid-state media. Furthermore, because every stateless compute node mounts every storage drive across the cluster via NVMe-oF, large-scale deployments create dense all-to-all communication patterns that place severe pressure on the storage network fabric, making cluster performance highly vulnerable to network topology congestion and packet loss. Additionally, client-side NFS access enforces close-to-open consistency rather than strict POSIX locking, meaning concurrent overlapping writes to identical file extents from multiple client hosts can produce data corruption unless applications enforce direct I/O semantics."
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE013"
