    summary: >-
      Qualitative heatmap of evidence-backed exposure after public mitigations, with unknowns
      retained where the assigned evidence lacks operating or legal verification.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Architecture and migration lock-in
          values:
            - value: High
            - value: High
            - value: Medium
            - value: High
          note: Competitor framing is directional; VAST's shared-state design is documented.
        - label: Customer and neocloud concentration
          values:
            - value: Unknown
            - value: High
            - value: Unknown
            - value: High
          note: A large CoreWeave agreement is reported, but no ARR denominator is public.
        - label: Availability and cloud durability configuration
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: High
          note: DBox-HA and persistence controls exist, but deployment choices determine protection.
        - label: Security and privileged-support governance
          values:
            - value: Unknown
            - value: High
            - value: Medium
            - value: High
          note: Controls are described; certifications, incidents, and effectiveness remain unverified.
        - label: Commercial-metric and capital disclosure
          values:
            - value: Medium
            - value: High
            - value: Low
            - value: High
          note: Bookings, committed ARR, signed contracts, and mixed financing require reconciliation.
        - label: Roadmap and ecosystem execution
          values:
            - value: Medium
            - value: Medium
            - value: Medium
            - value: Medium
          note: Broad adoption claims mitigate risk, but future features have no promised delivery dates.
    approximationNotes: >-
      Ratings are ordinal analyst judgments, not calculated probabilities; unknown means the
      assigned public evidence does not support a frequency or maturity estimate.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR007, CR008, CR010, CR012, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Do not equate commercial labels
    body: >-
      Cumulative bookings, committed ARR, signed contracts, accounting revenue, cash flow,
      and primary financing are different measures. Investment underwriting should require
      an audited bridge and the exact primary-versus-secondary Series F split.
    claimRefs: [CR008, CR009, CR010, CR011, CR016]
  - calloutType: recommendation
    title: Minimum diligence package before underwriting
    body: >-
      Require customer-level ARR and contract terms, audited financial and metric bridges,
      cap-table and preference schedules, topology-specific reliability tests, security
      attestations and incident history, and legal/regulatory counsel searches.
    claimRefs: [CR001, CR003, CR005, CR006, CR007, CR012, CR016]
