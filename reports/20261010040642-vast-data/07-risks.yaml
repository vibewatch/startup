schemaVersion: "report-v2"
artifact: risks
slug: vast-data
runDate: 2026-10-10
company:
  name: VAST Data
chapter:
  number: 7
  title: Risks
  summary: >-
    VAST Data's principal underwritable risks are architecture and migration lock-in,
    availability choices that require explicit high-availability configuration, partner
    and customer concentration, and financial-disclosure ambiguity. Public materials
    describe meaningful resilience and security controls, but they do not close diligence
    on incidents, certifications, litigation, customer concentration, or the bridge among
    bookings, committed ARR, signed contracts, and recognized revenue.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implication
    body: >-
      The highest residual exposure is not a documented failure; it is the combination of
      migration friction, a vertically integrated operating model, and limited public
      evidence on concentration. Dell, an interested competitor rather than an independent
      benchmark, argues that VAST requires data to enter its namespace and depends on
      hardware and integration partners. VAST's own technical description confirms a
      shared-everything architecture in which every compute node mounts every SSD and system
      state is shared across the cluster. That supports a high-impact lock-in hypothesis,
      but not Dell's broader commercial conclusions. Financial disclosure is the second
      major risk: current reporting distinguishes cumulative bookings and committed ARR
      from cash-flow claims, while 2023 public materials used ARR and signed-contract
      language for the same headline amount. Proposed thesis-break triggers are a top
      customer above 20% of ARR without contractual protection, inability to reconcile
      reported commercial metrics within 10%, or a critical workload deployed without a
      tested recovery design. Those thresholds are investment controls, not reported facts.
    claimRefs: [CR001, CR002, CR008, CR009, CR010, CR011, CR012, CR016]
    figureRefs: [FR001]
  - id: operational-security-resilience
    title: Operational, quality, and security exposure
    body: >-
      VAST documents substantive mitigations, including DBox redundancy, DBox-HA, erasure
      coding, encryption, role-based and attribute-based access control, immutable snapshots,
      and external key-management support. The same white paper also identifies configuration
      boundaries that matter to underwriting: a classic cluster can go offline with a whole
      DBox failure; DBox-HA requires at least eight DBoxes and raises protection overhead in
      the stated example; cloud-local NVMe alone does not deliver the durability claimed for
      on-premises systems; and a single cloud instance has no failure protection. These are
      not evidence of incidents. They are reasons to verify the exact topology, availability
      tier, RPO/RTO tests, encryption settings, privileged-support process, and cloud
      persistence mode for each material deployment. A kill criterion should be any
      production-critical environment that cannot demonstrate recovery from its declared
      failure domain or any unremediated material security exception.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR014, CR015]
    tableRefs: [TR002]
  - id: legal-regulatory-governance
    title: Legal, regulatory, privacy, and governance diligence
    body: >-
      The assigned evidence includes product-control descriptions but no regulator filing,
      court record, independent certification report, penetration-test summary, incident
      register, or privacy audit. The adverse search record returned no allocated URLs; that
      is a coverage limitation and must not be read as proof that no lawsuit, enforcement
      action, breach, or outage exists. VAST markets an isolated, encrypted, and verifiable
      confidential-AI runtime for sensitive data, while the technical paper describes FIPS
      140-3 validated libraries, transport encryption, and granular access controls. Those
      controls lower design risk but do not establish operating effectiveness or compliance
      in each jurisdiction. Before investment, counsel should run litigation, sanctions,
      export-control, privacy, and IP searches in the United States, Israel, the EU, and other
      material sales jurisdictions, then reconcile results to management's claims, insurance,
      customer notifications, and security attestations.
    claimRefs: [CR001, CR006, CR007, CR015]
    tableRefs: [TR001]
  - id: dependencies-financial-model
    title: Partner, customer, and financial-model dependencies
    body: >-
      VAST's partner network is simultaneously a moat and a correlated dependency. Public
      reporting identifies a $1.17 billion CoreWeave commercial agreement, while another
      source describes Nvidia as both investor and technology partner and CoreWeave as a
      large buyer. VAST also claims adoption across more than 25% of the Fortune 100 and
      leading GPU cloud providers, but this does not disclose revenue concentration,
      cancellation rights, renewal cohorts, or gross margin by deployment. The 2026 Series F
      reportedly included both primary and secondary capital; a lower-tier independent blog
      says more than half went to selling holders, but the assigned higher-quality source
      does not provide the split. Underwriting should therefore separate funding raised from
      cash available and bookings from ARR or revenue. Kill criteria are undisclosed related
      commercial terms with strategic investors, concentration above the approved threshold,
      or audited schedules that materially contradict public commercial or profitability
      claims.
    claimRefs: [CR002, CR008, CR009, CR010, CR011, CR012, CR013, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, license, or case
      - Jurisdiction
      - Public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Data protection and security assurance
        - Global; customer-specific
        - Product controls described; independent operating-effectiveness evidence not allocated
        - Medium
        - High
        - Encryption, RBAC, ABAC, key management, and immutable snapshots
        - Material until certifications, exceptions, and incident history are verified
        - Obtain SOC 2 and ISO reports, penetration tests, incident log, and customer security exceptions
      - - Data residency, privacy, and sovereign-data obligations
        - United States, EU, Israel, and material sales jurisdictions
        - Sensitive-data and confidential-runtime claims are public; jurisdictional mappings are not
        - Medium
        - High
        - Isolated and encrypted runtime plus transport and at-rest encryption
        - Migration and centralized-control design may complicate residency or customer governance
        - Map data flows, subprocessors, transfer mechanisms, retention, and customer-controlled keys
      - - Litigation, IP, export-control, sanctions, and enforcement
        - Global
        - Unverified; assigned adverse query returned no allocated source URLs
        - Unknown
        - High
        - No public mitigation established in the assigned evidence
        - Material evidence gap; no-URL search outcome is not proof of no proceedings
        - Run court, regulator, patent, sanctions, and export-control searches and obtain counsel letters
    notes: >-
      Rows are severity-ordered analyst assessments based on the assigned public evidence;
      likelihood is not an incident-frequency estimate, and unverified does not mean absent.
    enumerationScope:
      coverage: partial
      basis: >-
        Public risk categories visible in the assigned source pool as of 2026-10-10;
        no regulator or court-record source was allocated.
    claimRefs: [CR001, CR006, CR007, CR015, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator
      - Unresolved gap
    rows:
      - - Whole-enclosure or rack failure under an underspecified availability design
        - Medium
        - High
        - Documented architecture; deployment-specific
        - High when classic mode is used for critical workloads; lower with tested DBox-HA
        - Recovery tests, free rebuild capacity, failed-domain duration, and protection state
        - Actual topology, availability tier, and customer RPO/RTO results
      - - Cloud instance or zonal failure causes data unavailability or loss
        - Medium
        - High
        - Persistence and replication patterns documented
        - High for local-only or single-instance use; configuration-dependent otherwise
        - Persistent-checkpoint lag, replication health, zone-failover test, and instance count
        - Production cloud configurations and durability commitments
      - - Privileged compromise, ransomware, or key-control failure
        - Medium
        - High
        - Multiple controls documented; operating effectiveness unverified
        - Material because emergency deletion uses a support-issued token under customer rules
        - Privileged access events, immutable-snapshot coverage, token issuance, and restore tests
        - Independent attestations, incidents, exceptions, and support-process audit
      - - Product roadmap or scaling feature arrives late or below required maturity
        - Medium
        - Medium
        - Existing platform is substantial; future features remain demand-dependent
        - Material for buyers underwriting unshipped cross-cluster and cloud-elasticity capabilities
        - GA dates, adoption, support cases, release slippage, and workload-specific benchmarks
        - Contracted roadmap commitments and production references
    notes: >-
      Qualitative ratings distinguish documented design mitigations from verified deployment
      performance; no public incident rate or SLA-attainment denominator was available.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Large neocloud commercial relationship
        - CoreWeave
        - Material customer and deployment partner
        - $1.17 billion agreement reported; ARR share and terms undisclosed
        - Delay, renegotiation, cancellation, or downstream neocloud stress
        - High
        - Broader enterprise and GPU-cloud adoption claimed
        - High until customer-level ARR, term, backlog conversion, and collectability are verified
      - - Hardware and integration delivery
        - Nvidia, AIC, server, networking, and integration partners
        - Compute, DPU, enclosure manufacturing, networking, and full-stack deployment
        - No supplier share or substitution timing disclosed
        - Component constraint, roadmap divergence, support handoff, or margin pressure
        - High
        - Software-defined CNodes and multiple deployment patterns
        - Material because VAST does not provide the entire compute and networking stack
      - - Centralized data and control plane
        - VAST platform
        - Shared namespace, metadata, database, orchestration, and governance
        - Workload and migration scope not disclosed
        - Exit costs rise as more services and security context become VAST-native
        - High
        - Standards-based protocols and documented portability mechanisms
        - High without tested export, coexistence, and migration plans
      - - Capital structure and public-market readiness
        - Series F investors and selling holders
        - Primary funding, secondary liquidity, strategic alignment, and governance
        - Mixed primary/secondary round; exact split not established by higher-quality assigned evidence
        - Cash available is overstated, preferences constrain exits, or disclosure controls lag scale
        - High
        - Reported positive free cash flow and operating profitability
        - Material pending audited cash, cap table, preferences, and metric-reconciliation schedules
    notes: >-
      Contract size is not treated as revenue or ARR, and funding raised is not treated as
      cash available; concentration and round-split quantities remain diligence gaps.
    claimRefs: [CR001, CR002, CR008, CR009, CR010, CR011, CR012, CR016]
