    title: "Secondary Liquidity and Cap Table Overhang"
    body: "External reports show that up to half of the $1 billion April 2026 transaction represented secondary share sales for early investors and employees, rather than primary balance sheet cash. This dual structure creates uncertainty regarding net primary runway additions and liquidation preference waterfalls."
