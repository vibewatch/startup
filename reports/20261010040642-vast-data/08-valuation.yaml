    title: "Entry Discipline at $30 Billion Valuation"
    body: "At a headline multiple of ~60x committed ARR, VAST Data leaves no room for execution missteps or cyclical AI infrastructure pauses. Investors must not conflate exceptional business momentum with an attractive risk-adjusted entry price. Maintain a track recommendation until secondary pricing softens or private diligence clarifies customer concentration."
