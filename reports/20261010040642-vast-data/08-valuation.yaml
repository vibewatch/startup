chapter:
  number: 8
  title: "Valuation"
  summary: "VAST Data has demonstrated exceptional enterprise scale with over $4 billion in cumulative bookings and $500 million-plus in committed ARR, yet its April 2026 Series F valuation of $30 billion represents an aggressive ~60x multiple on committed recurring revenue. While the business benefits from surging AI infrastructure demand and positive cash generation, fresh investment requires strict entry discipline and private verification of customer concentration, gross margins, and liquidation preferences."
sections:
  - id: "investment-thesis-recommendation"
    title: "Investment Thesis, Recommendation, and Entry Discipline"
    body: "VAST Data occupies a strategically critical position in the modern artificial intelligence stack, transforming from high-performance storage into a comprehensive AI Operating System that integrates storage, database functionality, and containerized compute. The company's technical architecture, based on Disaggregated Shared Everything (DASE), enables exabyte-scale deployments supporting millions of GPUs worldwide across major AI infrastructure providers including CoreWeave, Nscale, Firmus, and Fluidstack. Financial execution has been exceptionally rapid, with cumulative bookings surpassing $4 billion and committed annual recurring revenue (CARR) exceeding $500 million while maintaining operating profitability and positive free cash flow over several years. However, the April 2026 Series F funding round—which raised approximately $1 billion in combined primary and secondary capital led by Drive Capital and Access Industries—valued VAST Data at $30 billion. This headline price tags the company at roughly 60x committed ARR, leaving virtually zero margin of safety for external public shocks, hardware transition cycles, or AI multiple contraction. Consequently, our recommendation for uncommitted institutional capital is track, advising investors to maintain strict valuation discipline and await detailed private diligence on revenue composition, customer concentration, and contractual retention before participating at or near round pricing."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-antithesis-financing"
    title: "Thesis, Anti-Thesis, and Late-Stage Financing Dynamics"
    body: "Evaluating VAST Data at a $30 billion valuation requires balancing a compelling secular expansion thesis against substantial private-market anti-theses. The core thesis rests on VAST becoming the default data platform for hyperscale AI model development, inference clusters, and emerging agentic workflows that require unified low-latency data access across distributed hardware. Existing strategic backers such as NVIDIA, Fidelity Management & Research Company, and New Enterprise Associates (NEA) validate the company's platform centrality. Conversely, the anti-thesis highlights three material structural risks. First, VAST Data's reported revenue construct of committed ARR may diverge meaningfully from audited GAAP recognized revenue or trailing subscription ARR, obscuring true run-rate recurring cash flows. Second, significant commercial exposure to specialized GPU cloud providers creates pronounced counterparty concentration risk should neocloud buildouts slow or face capital rationing. Third, the Series F round incorporated substantial secondary liquidity for early investors and employees, alongside dual reported funding figures ($500 million primary equity versus $1 billion total transaction volume), creating potential liquidation preference overhang and dilution complexities. Diligence must establish full cap table transparency and evaluate whether common equity value matches the preferred headline valuation."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV002"
  - id: "scenarios-comparables-exit"
    title: "Scenario Valuation, Peer Comparables, and Diligence Kill Triggers"
    body: "A robust scenario framework demonstrates that VAST Data's current valuation embeds sustained high-growth execution and continued public-market enthusiasm for AI infrastructure assets. In our bull scenario, durable recurring revenue scales toward $1.5 billion to $2.0 billion as enterprise agentic deployments mature, supporting a 20x to 25x multiple and an enterprise valuation of $30 billion to $45 billion upon public listing. In our base scenario, audited recurring revenue stabilizes in the $800 million to $1.0 billion range with moderate enterprise expansion, yielding a valuation of $16 billion to $22 billion at a 18x to 22x software-infrastructure multiple—representing a 25% to 45% discount to the Series F mark. In our bear scenario, AI capital expenditure cycles cool, hyperscaler in-house storage alternatives compress pricing power, or major neocloud customers renegotiate capacity, compressing revenue to $600 million to $700 million and multiples to 10x to 12x, resulting in an equity value of $6.0 billion to $8.5 billion. Relative to public infrastructure peers such as Pure Storage and NetApp, VAST trades at a multiple premium exceeding 5x, placing the burden of proof squarely on private metrics. Investors must establish strict kill triggers: any audit finding that reveals top-three customer concentration exceeding 45% of ARR, trailing gross margins below 70%, or a prolonged stall in formal IPO governance preparations should immediately terminate further investment consideration."
    claimRefs:
      - "CV003"
      - "CV007"
      - "CV008"
      - "CV011"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
