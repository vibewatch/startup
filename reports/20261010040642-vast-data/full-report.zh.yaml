  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              VAST Data 处在现代人工智能技术栈的战略要害位置，正从高性能存储转向完整的 AI 操作系统，整合存储、数据库功能和容器化计算。公司以解耦共享一切（DASE）为基础的技术架构，支持全球主要 AI
              基础设施提供商的大规模部署，规模可达 EB 级，服务数百万 GPU，包括 CoreWeave、Nscale、Firmus 和 Fluidstack。财务执行速度极快：累计订单额超过 $4
              billion，承诺年度经常性收入（CARR）超过 $500 million，并连续数年保持经营盈利和自由现金流为正。然而，2026 年 4 月由 Drive Capital 和 Access
              Industries 领投的 Series F 融资轮合计新增资金与老股转让约 $1 billion，将 VAST Data 的估值推至 $30 billion。按这一表面价格，公司约为承诺 ARR 的 60
              倍，几乎没有空间应对外部公共市场冲击、硬件换代周期或 AI
              估值倍数收缩。因此，对于尚未承诺的机构资本，我们的建议是持续跟踪：投资者应严格执行估值纪律，先完成对收入构成、客户集中度和合同留存的详细私募尽调，再考虑按本轮价格或接近本轮价格参与。
