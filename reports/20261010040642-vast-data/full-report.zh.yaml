      - number: '1.4'
        title: 商业规模、生态联盟与交易对手风险
        blocks:
          - type: paragraph
            body: >-
              VAST Data 已在人工智能模型构建商、企业级超大规模客户和主权计算项目中迅速扩大商业版图。公司报告累计合同预订额已超过 $4 billion， 并在上一财年结束时实现超过 $500 million 的
              Committed Annual Recurring Revenue（CARR），同时保持正经营利润率和自由现金流。 与公司披露的 Committed ARR 不同，Calcalist 2026 年 3
              月的第三方报道估计，截至 2025 年底年化运行收入接近 $2 billion；这显示出 明显的报告差异，需要严格审计多年期预订排期与按期确认收入之间的关系。VAST 商业增长的核心支柱，是与新云领导者
              CoreWeave 达成的多年期合作，交易金额 $1.17 billion；该合作把 VAST 存储层嵌入数千个 GPU 集群，为包括 Mistral AI 和 xAI 在内的客户工作负载
              提供支持。不过，EquityZen 的二级市场研究指出，公司依赖专业 AI 超大规模客户，带来显著交易对手集中度风险；CoreWeave 若放缓资本开支 或改变架构，可能冲击预期预订额。与此同时，Dell
              Technologies 等传统硬件厂商已用 2025 PowerScale 方案加强直接竞争，若主要合作伙伴 NVIDIA 扩大内部软件存储能力，平台被蚕食也会成为长期风险。
