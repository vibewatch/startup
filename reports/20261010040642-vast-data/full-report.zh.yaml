              million；行业报道还称，若把非承诺型、硬件绑定的扩容计入，总年化运行收入已突破 $2 billion。大型组织的企业采用继续 加深：公司在 Fortune 1000 客户中的客户基础翻了四倍，Fortune
              100 中超过 25% 已部署 VAST。企业账户扩张也带来强劲 ACV 增长， 前 100 个新客户群的初始合同支出平均超过 $1.2 million。客户部署的实体和计算规模不断刷新纪录，支持多 EB
              存储足迹，为全球覆盖 数十万 GPU 的集群供数。尽管这些高层速度指标亮眼，VAST 没有公开披露活跃客户总数或按用量加权的使用档位，因此无法准确判断更广泛 非标杆客户群的收入分布。
