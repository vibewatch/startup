      - number: '8.3'
        title: 情景估值、可比公司与尽调终止触发条件
        blocks:
          - type: paragraph
            body: >-
              严谨的情景框架表明，VAST Data 当前估值已计入持续的高增长执行力，以及公开市场对 AI 基础设施资产的热情。在乐观情景下，随着企业智能体部署成熟，稳定的经常性收入增长至 $1.5 billion 至
              $2.0 billion，支撑 20 倍至 25 倍倍数，上市时企业估值达到 $30 billion 至 $45 billion。在基准情景下，经审计的经常性收入稳定在 $800 million 至 $1.0
              billion，企业业务温和扩张，按 18 倍至 22 倍软件基础设施倍数估值为 $16 billion 至 $22 billion，相比 Series F 定价折价 25% 至 45%。在悲观情景下，AI
              资本开支周期降温、超大规模云厂商的自研存储替代方案挤压定价能力，或主要新云客户重新谈判容量，收入降至 $600 million 至 $700 million，倍数降至 10 倍至 12 倍，股权价值为 $6.0
              billion 至 $8.5 billion。与 Pure Storage、NetApp 等上市基础设施可比公司相比，VAST 的估值倍数溢价超过 5
              倍，举证责任完全落在私有指标上。投资者必须设定严格的终止触发条件：任何审计发现若显示前三大客户占 ARR 超过 45%、过去收入的毛利率低于 70%，或正式 IPO 治理准备长期停滞，都应立即终止后续投资评估。
