  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              最高的剩余敞口并不是已记录的故障，而是迁移摩擦、垂直整合运营模式以及关于集中度的公开证据有限三者叠加。Dell 是有利益关系的竞争者， 而非独立基准；它认为 VAST
              要求数据进入自身命名空间，并依赖硬件和集成伙伴。VAST 自己的技术说明确认，其共享一切架构让每个计算节点 挂载每块 SSD，并在集群范围共享系统状态。这支持高影响锁定假说，但不能支持 Dell
              更广泛的商业结论。财务披露是第二大风险：当前报告 把累计预订额和 committed ARR 与现金流说法区分开，而 2023 年公开材料却用 ARR 和已签合同措辞描述同一公开口径金额。拟定的论点
              破坏触发条件包括：最大客户占 ARR 超过 20% 且没有合同保护；无法在 10% 范围内核对已报告商业指标；或关键工作负载已部署却没有经过 测试的恢复设计。这些阈值是投资控制，不是已报告事实。
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
