        - 超大规模云厂商（AWS、Azure、GCP）或专业存储创业公司可能构建有竞争力的解耦替代方案。
        - 可验证的企业非云收入超过软件总销售额的 50%。
      - - 财务执行
        - 累计预订额超过 $4B，CARR 达 $500M+，并持续保持现金流为正。
        - CARR 指标代表合同承诺，而非经审计的追踪 GAAP 收入；毛利率尚未核实。
