      - number: '2.3'
        title: 买方画像、采购机制与价值论证
        blocks:
          - type: paragraph
            body: >-
              VAST Data 平台的采用覆盖三个主要客户群，各自的采购驱动和预算归属结构不同。第一大支出引擎是专业 AI 新云和 GPU 即服务提供商， 典型案例是 CoreWeave 的 $1.17 billion
              多年期商业协议。这类客户的采购由云基础设施高管和首席技术官主导，首要目标是提高 GPU 利用率， 消除超大规模多租户集群的 I/O 饥饿。第二类包括前沿 AI 实验室、主权 AI 项目和联邦国防机构，例如 xAI
              的 200,000-GPU Colossus 设施和美国空军；研究主管和项目经理需要 EB 级吞吐、确定性多租户和严格的数据主权。第三类是金融交易、自动驾驶、生命科学和零售 分析等数据密集型 Fortune
              500 企业，例如 Lowe's。为打破传统企业采购惯性，VAST 推出了 Gemini 商业模式，把软件许可与实体硬件采购 解耦。客户通过 AVNET 等制造合作伙伴按成本购买通用硬件，再向 VAST
              支付容量型软件许可费；企业 IT 买方因此无需承担传统硬件加价， 同时 VAST 的软件毛利率可接近 90%。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 市场约束、切换壁垒与规模不确定性
        blocks:
          - type: paragraph
            body: >-
              尽管 Solidigm 和 VAST 的评估显示，相比硬盘层级总拥有成本可降低 58.9%，市场仍面临显著采用约束和尽调风险。企业 IT 部门受组织惯性、 复杂的既有数据管理流程以及与 NetApp、Dell
              Technologies 等存储厂商签订的长期协议牵制。许多企业生成式 AI 项目仍停留在试点阶段， 使 GPU 容量从实验走向全企业数据平台部署的速度变慢。专业 GPU 云的高客户集中度还会把收入波动与更广泛的
              GPU 融资宏观条件绑定。 $400 billion 的自上而下 TAM 依赖传统企业存储被替代的激进假设，而企业实际支出仍分散在计算、网络和旧数据仓库之间。要维持长期 收入增长，VAST
              必须从超大规模训练部署扩展到持续、高毛利的企业推理管线和多云数据库工作负载。
            claimRefs:
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 把硬件采购与软件价值捕获解耦
            body: >-
              VAST Data 的 Gemini 商业模式取消厂商硬件加价，从根本上打破传统存储采购。企业客户通过 AVNET 等合同制造商按成本购买通用 NVMe 和 QLC 闪存硬件，再按可用 PB 为 VAST
              软件层付费，让 VAST 获得接近 90% 的软件毛利率。
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
          - type: callout
            title: 客户集中度与 GPU 资本开支依赖
            body: >-
              VAST 在 GPU 新云中的商业牵引力带来了 CoreWeave $1.17 billion 多年期承诺等里程碑式协议，但也使公司高度暴露于外部 GPU 融资周期 和集群建设排期。要持续扩张，VAST
              必须加快渗透拥有多样化、非训练工作负载的主流 Fortune 500 企业。
            calloutType: risk
            claimRefs:
              - CM011
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与架构分类
        blocks:
          - type: paragraph
            body: >-
              企业 AI 存储和基础设施市场分成两类：一类是改造传统架构以适配 GPU 工作负载的传统企业存储厂商，另一类是为超大规模并行吞吐打造的 专业 AI 原生平台。VAST Data 同时面对多条战线：既有
              NetApp、Pure Storage 等企业全闪存和混合存储厂商，也有 Weka、开源 Lustre 等高性能并行文件系统，还有 Dell Technologies 和 HPE 的全栈 OEM
              系统。传统企业存储系统长期采用双控制器或集群化共享无架构，数据访问 紧密绑定特定控制器节点；当系统扩展到数千个 GPU 时，服务器间通信瓶颈和复杂故障切换协调就会暴露。VAST 的 DASE 架构通过高速
              NVMe-over-Fabrics 把计算节点与共享存储介质分开，让无状态计算服务器并行访问所有 QLC 闪存设备，无需控制器间协调。在当前 $30 billion 估值和 $1 billion Series F
              融资支持下，VAST Data 的私有市场估值已超过 NetApp、Pure Storage 等长期上市存储领导者的市值，显示投资者 强烈相信其平台与商品化存储硬件不同。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
      - number: '3.2'
        title: 架构差异化与核心能力矩阵
        blocks:
          - type: paragraph
            body: >-
              VAST Data 以存储介质经济性、协议统一和原生 AI 安全集成组合形成差异化。公司使用消费级四层单元（QLC）闪存承载超过 90% 的存储容量，
