chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与运营模式
        blocks:
          - type: paragraph
            body: >-
              VAST Data 由 Renen Hallak 和 Shachar Fienblit 于 2016 年创立，目标是解决现代深度学习和分布式数据系统不断暴露的关键输入输出瓶颈。
              公司采用远程优先的组织模式，官方全球总部设在纽约市，并在以色列特拉维夫和海法设有大型专业研发中心。传统企业存储厂商通常把文件、 块和对象访问拆进彼此隔离的硬件设备，VAST Data 则围绕突破性的
              Disaggregated Shared-Everything（DASE）软件架构打造平台。 DASE 把非结构化文件与对象存储、高吞吐表格数据库和容器化计算引擎能力，统一到一个称为 VAST AI
              Operating System 的软件定义底座。 该架构把无状态计算逻辑与全球可访问的共享非易失闪存介质解耦，让数千个图形处理器（GPU）和 AI 加速节点能够同时查询并写入 PB
              级数据集，避免锁竞争、延迟尖峰和文件系统碎片化。公司近期扩展了机密 AI 运行时和 Polaris 全球控制平面；这些技术与 NVIDIA
              计算生态紧密协同，面向大规模前沿模型训练实验室、国家级研究中心及需要持续实时数据访问的企业 AI 工厂。
            claimRefs:
              - CO001
              - CO010
              - CO011
              - CO014
