      - number: '8.2'
        title: 投资论点、反论点与后期融资动态
        blocks:
          - type: paragraph
            body: >-
              对 VAST Data 进行 $30 billion 估值，需要在有吸引力的长期扩张论点与私募市场上的重大反论点之间取得平衡。核心论点是：随着超大规模 AI 模型开发、推理集群和新兴智能体工作流的发展，VAST
              可能成为默认数据平台；这些场景需要在分布式硬件间统一、低延迟地访问数据。NVIDIA、Fidelity Management & Research Company 和 New Enterprise
              Associates（NEA）等现有战略支持者，也印证了该平台的核心地位。反论点则有三项结构性风险。第一，VAST 报告的承诺 ARR 收入口径，可能与经审计的 GAAP 确认收入或过去 12 个月的订阅 ARR
              存在重大偏差，掩盖真实的经常性现金流运行水平。第二，公司对专业 GPU 云厂商存在较大商业敞口；如果新云建设放缓或遭遇资本配给，就会形成明显的交易对手集中风险。第三，Series F
              为早期投资者和员工提供了大量老股流动性，同时出现两套融资数字（$500 million 新增股权资金对比 $1 billion
              总交易额），可能带来清算优先权悬置和稀释复杂性。尽调必须厘清完整股权结构表的透明度，并评估普通股价值是否匹配优先股的表面估值。
            claimRefs:
