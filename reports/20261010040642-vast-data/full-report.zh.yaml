      - number: '5.4'
        title: 写入路径机制、网络织构压力与架构风险
        blocks:
          - type: paragraph
            body: >-
              尽管 VAST 在读密集型深度学习工作负载上具备高吞吐和架构简洁优势，独立存储架构分析也指出，DASE 写入路径和共享一切拓扑存在明显 工程取舍。VAST 使用商品化四层单元（QLC）NAND
              闪存，以取得近似归档存储的经济性；若把小块写入直接落到闪存，会产生严重写放大并 使硬盘过早磨损。因此，客户端写入先进入存储级内存（3D
              XPoint）缓冲，并在三个不同物理介质目标上复制三份，确认前先保证断电安全。 结果是写入相对读取承受估计 3:1 的性能损失，而固态介质更高的功耗和更低的写带宽又会放大这一差距。由于每个无状态计算节点都通过
              NVMe-oF 挂载集群内每块存储盘，大规模部署会形成密集的全互联通信模式，给存储网络织构带来巨大压力；集群性能因此很容易受网络拓扑 拥塞和丢包影响。此外，客户端 NFS 访问采用 close-to-open
              一致性，而非严格 POSIX 锁；多个客户端主机同时对相同文件范围重叠写入时， 如果应用不强制使用直接 I/O 语义，就可能造成数据损坏。
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
              - CE013
