      - number: '1.2'
        title: 高管团队、治理与人力资本
        blocks:
          - type: paragraph
            body: >-
              VAST Data 的战略方向和架构执行仍由技术联合创始人主导。创始人兼 CEO Renen Hallak 此前在 XtremIO 负责核心工程团队，后者被 EMC 收购；他为 VAST
              的商业愿景带来了高性能闪存优化存储系统经验。联合创始人兼首席研发官 Shachar Fienblit 负责以色列研发中心的 庞大工程体系，主管核心分布式系统软件、硬件认证和协议优化。联合创始人兼首席营销官
              Jeff Denworth 负责产品战略和生态定位， 也是主要技术会议上的架构布道者。公司于 2024 年任命前 Shopify 首席财务官 Amy Shapero 为 CFO，这是重要治理里程碑；在可能提交
              IPO 文件前，该任命显著加强了公司报告、内部财务纪律和审计准备度。公司全球员工总数已增至约 1,100 人，其中约三分之一集中在
              以色列工程中心，其余分布于全球企业销售、技术支持和合作伙伴工程团队。关键人物依赖仍集中在 CEO Renen Hallak 身上；他的架构愿景 以及与 NVIDIA
              等战略投资者的高管关系，仍是公司增长动能的核心。
