      - number: '6.3'
        title: 指名客户验证与生产工作负载
        blocks:
          - type: paragraph
            body: >-
              VAST Data 的平台能力已在商业 AI、娱乐和生命科学的大规模生产部署中得到实证。最突出的是 xAI 的 Colossus 超级计算机：VAST 为超过 200,000 个 Nvidia GPU
              提供数据层；据已发布披露，VAST 的解耦架构相较传统存储架构把总拥有成本降低了 50%。商业云服务方面，CoreWeave 通过 2025 年 11 月签署的 $1.17 billion 里程碑协议，把
              VAST 确立为核心数据底座。数字媒体方面，Pixar Animation Studios 用 VAST 管理 PB 级渲染资产，这些资产又为动画管线提供多模态训练数据。生命科学领域中，Boston
              Children's Hospital 依靠 VAST 分析高吞吐 基因测序数据；企业商业领导者 Booking Holdings 则用该平台处理实时推荐数据。这些指名案例表明，VAST
              已从探索性实验室试点进入主要 运营生产，但客户样本仍明显偏向技术领先者和资本充足的 AI 基础设施建设者。
