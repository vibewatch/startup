      - number: '6.4'
        title: 合同耐久性、留存动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              VAST Data 的客户耐久性受益于极高的架构切换壁垒和长期商业承诺。典型企业合同期限为 5 至 7 年，带来较高收入可见度，并隔离短期流失。 VAST 的 DASE
              平台存储主要训练数据、运营元数据和实时向量索引；替换平台意味着跨 PB 至 EB 规模数据进行复杂且高风险的迁移。行业分析 指出，一旦组织把 VAST
              部署到生产环境，客户流失率就会保持极低。不过，架构锁定被尖锐的商业集中度风险抵消。CoreWeave 等高知名度 新云客户和主权集群建设占合同管线及 committed ARR 的比例不成比例。因此，如果主要
              GPU 云供应商出现容量消化、融资约束或在合同到期 时重新谈判，VAST 将面临显著交易对手敞口。独立研究还指出，VAST 平台能力虽强，但企业买方仍有平台锁定风险，因为要把面向 AI 的向量 和非结构化数据迁出
              VAST 的集成生态，需要大量数据工程工作。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
