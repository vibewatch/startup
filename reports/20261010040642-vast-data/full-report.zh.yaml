            title: 写放大与尺寸约束
            body: 用存储级内存以 3x 复制方式缓冲写入，会相对读取性能带来内在写吞吐损失；少于 12 节点的集群还会永久锁定更窄的写条带，因此必须提前仔细规划硬件规模。
            calloutType: risk
            claimRefs:
              - CE006
