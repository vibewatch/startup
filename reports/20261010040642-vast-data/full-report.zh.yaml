  - id: FI001
    title: 客户工作负载向软件毛利率的转化
    type: flow
    summary: 七阶段转化流程，展示企业 AI 工作负载需求如何转化为按容量计费的软件订阅、预订额和高毛利率兑现。
    data:
      nodes:
        - id: node-ingest
          label: AI 工作负载摄入
          description: 企业和 GPU 云产生 EB 级非结构化训练与推理数据集，需要加速数据访问。
        - id: node-dase
          label: 硬件机箱部署
          description: 客户通过 Dell、Cisco 或 Supermicro 等 OEM 合作伙伴部署经过认证的 NVMe-oF 商用闪存硬件。
        - id: node-license
          label: 软件容量许可
          description: 客户按部署的原始存储总容量，以多年订阅方式获得 VAST AI OS 软件许可。
        - id: node-commit
          label: 年度合同承诺
          description: 客户签署年度承诺：前 100 大客户平均 $1.2M，超大规模云厂商可达 $100M+。
        - id: node-arr
          label: 承诺 ARR 确认
          description: 合同承诺转化为承诺年度经常性收入，承诺 ARR 超过 $500M。
        - id: node-cogs
          label: 纯软件交付成本
          description: VAST 不承担硬件制造或保修成本，交付费用仅限于支持和遥测。
        - id: node-margin
          label: 已兑现毛利
          description: 软件定义模式带来约 90% 的毛利率，并持续保持经营现金流为正。
      edges:
        - from: node-ingest
          to: node-dase
          label: 要求高吞吐 NVMe 网络
        - from: node-dase
          to: node-license
          label: 容量配置 VAST AI OS 软件
        - from: node-license
          to: node-commit
          label: 容量定价明确年度支出
        - from: node-commit
          to: node-arr
          label: 合同承诺建立 ARR 基础
        - from: node-arr
          to: node-cogs
          label: 收入以轻资产销货成本兑现
        - from: node-cogs
          to: node-margin
          label: 产生 90% 软件毛利率
    approximationNotes: 流程阶段展示标准商业推进和软件毛利率兑现；各合同的爬坡里程碑有所不同。
