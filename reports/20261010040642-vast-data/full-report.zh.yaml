            title: 长合同构成运营护城河，也掩盖客户集中
            body: >-
              5 至 7 年的多年期承诺为 VAST Data 打造极具黏性的收入基础：迁移 EB 级 AI 数据层会带来高昂摩擦和运营风险。不过，过度依赖 GPU
              新云运营商的巨额承诺，也造成尖锐的收入集中度，需要对客户群续约动态开展专项私有尽调。
