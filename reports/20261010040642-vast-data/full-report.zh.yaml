      - number: '7.3'
        title: 法律、监管、隐私与治理尽调
        blocks:
          - type: paragraph
            body: >-
              已分配证据包含产品控制说明，但没有监管机构文件、法院记录、独立认证报告、渗透测试摘要、事件登记册或隐私审计。负面搜索记录没有返回已分配
              URL；这只是覆盖范围限制，不能解读为不存在诉讼、执法行动、数据泄露或服务中断。VAST 将面向敏感数据的隔离、加密、可验证机密 AI 运行时作为产品卖点，而技术论文描述了通过 FIPS 140-3
              验证的库、传输加密和细粒度访问控制。这些控制措施能降低设计风险，但不能证明在每个司法辖区都具备运营有效性或合规性。投资前，法律顾问应在美国、以色列、欧盟及其他重要销售辖区开展诉讼、制裁、出口管制、隐私和 IP
              搜索，再将结果与管理层口径、保险、客户通知及安全证明相互核对。
