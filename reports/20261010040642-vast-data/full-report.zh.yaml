      - number: '1.3'
        title: 资本化轨迹、估值与投资者联合体
        blocks:
          - type: paragraph
            body: >-
              VAST Data 的机构资本化反映出一条由生成式 AI 基础设施需求加速推动的异常估值曲线。2021 年 5 月，公司宣布由 Tiger Global Management 领投的 $83 million
              Series D 融资，投后估值 $3.7 billion；在客户快速采用的推动下，公司估值在 12 个月内翻了三倍。 到 2023 年 12 月，VAST 完成 Series E 融资，估值再次接近翻三倍至
              $9.1 billion，同时确认 ARR 为 $200 million，并已持续三年 保持现金流为正。2026 年 4 月，VAST 完成具有里程碑意义的 Series F，估值达到 $30 billion，较
              Series E 基准再增逾三倍， 成为以色列科技生态中估值最高的私有软件企业。Series F 交易总额约 $1 billion，包括新增主要增长资本，以及为早期员工和种子投资者 提供的逾 $500
              million 二级股份流动性；交易价格较公开估值估计折价 15%。本轮由 Drive Capital 领投，Access Industries 联合领投，战略投资者 NVIDIA、Fidelity
              Management & Research 和 New Enterprise Associates 继续参与。在 Series F 之前，VAST 累计募集股权资本接近 $400
              million，展现出在超大规模企业基础设施独角兽中并不常见的资本效率。
            claimRefs:
              - CO002
