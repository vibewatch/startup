  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 解耦共享一切（DASE）核心架构
        blocks:
          - type: paragraph
            body: >-
              VAST Data 的基础创新是 DASE 架构，旨在消除传统横向扩展 NAS 和共享磁盘存储系统固有的性能瓶颈、闲置容量和元数据同步开销。
              传统集群存储把计算和存储紧密绑在单个设备内，扩容时需要复杂的节点间通信、分布式缓存一致性协议和数据再平衡。DASE 通过低延迟 NVMe over
              Fabrics（NVMe-oF）网络，把无状态前端计算节点（CNodes）与高密度持久闪存存储机箱（DNodes 或 EBoxes）分开，并采用 RoCE 或
              InfiniBand。前端计算节点完全无状态、不保留持久本地缓存，所以集群任意计算节点都能直接访问任意 NVMe 固态硬盘，无需经由 所有者节点转发请求，也不需要分布式加锁。全局事务元素存储利用原子 RDMA
              原语，让所有操作具备原子性、一致性、隔离性和持久性 （ACID）语义；因此文件、对象和表格记录能在统一全局命名空间（DataSpace）内同时进行多协议访问。
            claimRefs:
              - CE001
              - CE002
              - CE003
