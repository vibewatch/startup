      - number: '7.2'
        title: 运营、质量与安全敞口
        blocks:
          - type: paragraph
            body: >-
              VAST 记录了实质性的缓解措施，包括 DBox 冗余、DBox-HA、纠删码、加密、基于角色和基于属性的访问控制、不可变快照以及外部密钥管理支持。同一份白皮书也指出了影响投资判断的配置边界：经典集群在整台
              DBox 故障时可能离线；DBox-HA 至少需要八台 DBox，并会增加示例中所述的保护开销；仅靠云本地 NVMe
              无法提供本地部署系统所宣称的持久性；单个云实例也没有故障保护。这些并不是事故证据，而是需要逐一核实每个重大部署的确切拓扑、可用性等级、RPO/RTO
              测试、加密设置、特权支持流程和云持久化模式的理由。任何无法证明能从其声明故障域中恢复的生产关键环境，或任何尚未补救的重大安全例外，都应成为终止投资的标准。
