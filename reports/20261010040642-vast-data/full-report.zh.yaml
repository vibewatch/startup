  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这条逻辑链从已验证的技术规模和财务势头出发，经过估值阻力，最终落到投资立场。
    data:
      nodes:
        - id: arch-scale
          label: 企业 AI 架构
          detail: DASE 软件层在全球超大规模 AI 集群中支持数百万个 GPU。
        - id: financial-proof
          label: 财务执行
          detail: 累计预订额已超过 $4B，CARR 超过 $500M；据报道现金流为正。
        - id: valuation-step
          label: Series F 估值标记
          detail: 估值于 2026 年 4 月达到 $30B，较 Series E 价格大幅跃升（tripling），对应约 60x CARR 倍数。
        - id: private-gaps
          label: 尽调信息缺口
          detail: 毛利率、新云客户集中度和二级交易拆分均未验证。
        - id: decision-stance
          label: 跟踪建议
          detail: 要求严格执行入场纪律；在取得经审计披露前，暂缓投入资金。
        - id: milestone-triggers
          label: 监测触发条件
          detail: 若二级市场定价低于 $20B，或经审计的客户群留存验证 NRR >130%，则重新评估。
      edges:
        - from: arch-scale
          to: financial-proof
        - from: financial-proof
          to: valuation-step
        - from: valuation-step
          to: private-gaps
        - from: private-gaps
          to: decision-stance
        - from: decision-stance
          to: milestone-triggers
    approximationNotes: 流程图展示了分析决策架构，将公司已验证的优势与估值纪律连接起来。
