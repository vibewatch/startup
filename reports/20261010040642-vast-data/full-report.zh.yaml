              为支持企业本地和主权 AI 工厂部署，VAST 通过战略 OEM 与云合作伙伴把软件栈装进交钥匙硬件平台。Cisco AI Data Platform with VAST AI OS 将 Cisco
              CNode-X 计算系统（配备双 AMD EPYC 5th Generation 处理器和八块 NVIDIA RTX PRO 6000 GPU 的 UCS C845A M8 机架服务器） 与 Cisco EBox
