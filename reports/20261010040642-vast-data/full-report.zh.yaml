  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从硬件设备到智能体应用运行时的 VAST AI 操作系统六层架构栈。
    approximationNotes: 基于 Cisco UCS 和 VAST 技术规格，对 VAST Data Platform 层级及集成硬件组件的概念性呈现。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE011
      - CE012
      - CE013
    data:
      layers:
        - label: 智能体应用层（AgentEngine）
          detail: 机密 AI 运行时，提供可观测且安全的智能体记忆、状态共享和多租户隔离
        - label: 向量与摄入流水线层（InsightEngine）
          detail: 自动持续生成向量嵌入，并与 NVIDIA NIM 微服务集成
        - label: 计算与执行引擎（DataEngine）
          detail: 事件驱动的无服务器处理环境，直接在存储层执行容器化逻辑
        - label: 表格与结构化数据库（DataBase）
          detail: 事务型列式元素存储，支持低延迟 SQL 分析、特征库和向量搜索
        - label: 统一多协议数据平面（DataStore）
          detail: 全局命名空间（DataSpace）通过解耦闪存提供 NFS、SMB、S3 和 NVMe/TCP 协议
        - label: 硬件基础设施底座（CNode-X 与 EBox）
          detail: Cisco UCS C845A M8 GPU 计算节点和 UCS C225 M8 NVMe 全闪存存储节点通过 400GbE NVMe-oF 互联
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示企业和新云部署中的客户导入、运营扩展及多年生命周期留存。
    data:
      items:
        - label: 发现与架构评估
          stage: 发现与架构评估
          buyer: Infrastructure Engineers & AI Architects
          touchpoints:
            - Nvidia AI 参考架构评估
            - 对照 Dell、WEKA 和 Pure Storage 开展基准测试
            - CNode-X 概念验证测试
          experience: High interest in eliminating storage tiering and accelerating GPU I/O
          friction: Reluctance to abandon established enterprise storage vendors
        - label: 试点部署与工作负载验证
          stage: 试点部署与工作负载验证
          buyer: VP of Infrastructure & Platform Engineering
          touchpoints:
            - 部署到隔离的 GPU 开发集群
            - 非结构化数据摄入和向量索引测试
            - Cosmos 合作伙伴集成验证
          experience: Validation of line-rate throughput and zero-trust policy controls
          friction: Integration overhead with legacy data pipelines and Kafka streams
        - label: 采购与商业签约
          stage: 采购与商业签约
          buyer: VP of Procurement & Finance
          touchpoints:
            - 谈判五至七年期合同
            - 多 PB 软件许可的批量折扣
            - 硬件 OEM 服务器配置报价
          experience: Clear TCO advantages through data reduction and tiering elimination
          friction: Long enterprise procurement review cycles and large capital allocations
        - label: 生产上线与集群扩展
          stage: 生产上线与集群扩容
          buyer: CIO & Enterprise Procurement
          touchpoints:
            - 多年期企业软件合同落地
            - 通过 OEM 合作伙伴（Cisco、Supermicro）交付硬件
            - 集群扩展至多 petabyte / exabyte 规模
          experience: Substantial TCO reduction and high infrastructure reliability
          friction: Complex data ingestion and operational migration overhead
        - label: 跨工作负载与 DataEnclave 扩展
          stage: 跨工作负载与 DataEnclave 扩展
          buyer: Chief Information Security Officer & Data Governance Leads
          touchpoints:
            - 部署 DataEnclave 机密 AI 运行时
            - 集成硬件隔离的 GPU 内存保护
            - 验证敏感模型与企业数据加密
          experience: Compliance approval to run proprietary AI models on sensitive enterprise data
          friction: Attestation setup and key management integration across boundaries
        - label: 自主智能体编排与生命周期留存
          stage: 自主智能体编排与生命周期留存
          buyer: Chief AI Officer & Line-of-Business Leads
          touchpoints:
            - PolicyEngine 零信任智能体治理
            - TuningEngine 自动模型微调循环
            - 通过 Polaris 控制平面实现多区域编排
          experience: Deep platform embedment and near-zero churn over 5-7 year terms
          friction: Platform lock-in and high switching barriers to alternative data layers
