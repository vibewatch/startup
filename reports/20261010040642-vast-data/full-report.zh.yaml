  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载范围与架构变迁
        blocks:
          - type: paragraph
            body: >-
              企业存储与数据管理市场正经历由加速人工智能计算的扩展需求驱动的结构性架构转型。传统存储基础设施长期依赖双控制器存储区域网络
              （SAN）和网络附加存储（NAS），采用分层设计，把昂贵的高速闪存与大容量硬盘严格隔离。在生成式 AI 训练和大规模推理工作负载下， 这种模式会失效：数千个 GPU 并行执行检查点写入和 token
              摄取，很快就会打满传统存储控制器，让价值数百万美元的加速器集群在取数时空闲。 VAST Data 将可服务市场边界定义在 AI Operating System 层，使用 DASE 架构，通过
              NVMe-over-Fabrics 网络把无状态计算节点（CNodes） 与高密度闪存存储介质（DBoxes）物理分开。VAST 核心市场包含高吞吐闪存文件和对象存储、实时向量数据库、嵌入式运行时任务引擎以及
              混合云数据面软件；面向旧虚拟机的通用批量备份、实体磁带归档和不与加速计算交互的普通企业文件共享，则不在主要目标支出边界内。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 可寻址市场规模、增长驱动与测算视角
        blocks:
          - type: paragraph
            body: >-
              评估现代 AI 数据平台的机会，必须在宏观自上而下的扩张预测与受证据约束的商业现实之间取平衡。行业预测者和 ARK Invest 认为， 到 2030 年 AI 硬件和软件厂商的市值可能以 50%
              的年化速度增长至 $87 trillion，数据平台未来十年的可寻址市场将超过 $400 billion。 更近期，Tech Insider 识别出一波 $76 billion 的 AI
              数据基础设施支出，支撑大规模训练和推理部署。与此同时，Manhattan Venture Partners 的独立研究预计，VAST Data 2025 年软件收入在 $540 million 至 $700
              million 之间，并在五年内增长到 2030 年的 $2.49 billion 至 $3.35 billion。实际上，服务可寻址市场（SAM）受限于运营高密度 GPU 集群、企业数据集超过 10 PB
              的机构，包括专业新云、国家级研究 超级计算机和 Fortune 500 AI 实验室。VAST Data 披露截至 2025 财年末 committed ARR 超过 $500 million，累计软件预订额超过
              $4 billion；这显示公司已在高容量环境中取得可观的可服务获得市场（SOM）渗透，尽管广泛的企业生产采用仍处于早期。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
