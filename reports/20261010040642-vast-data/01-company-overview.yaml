company:
  name: VAST Data
chapter:
  number: 1
  title: Company Overview
  summary: VAST Data has established itself as a premier AI infrastructure data platform, scaling from its 2016 founding to a $30 billion Series F valuation backed by Drive Capital and NVIDIA. The company reports surpassing $500 million in Committed Annual Recurring Revenue with positive free cash flow, though substantial revenue concentration with neocloud partners such as CoreWeave and aggressive incumbent responses from Dell require ongoing private diligence.
sections:
  - id: corporate-identity-and-operating-model
    title: Corporate Identity, Genesis, and Operating Model
    body: VAST Data was established in 2016 by Renen Hallak and Shachar Fienblit to address the critical input/output bottlenecks emerging from modern deep learning and distributed data systems. The enterprise operates under a remote-first organizational structure with official global headquarters located in New York City, supported by major specialized research and development centers in Tel Aviv and Haifa, Israel. Unlike conventional enterprise storage vendors that silo file, block, and object access into disparate hardware appliances, VAST Data engineered its platform around a breakthrough Disaggregated Shared-Everything (DASE) software architecture. The DASE model unifies unstructured file and object storage, high-throughput tabular databases, and containerized compute engine capabilities into a single software-defined substrate termed the VAST AI Operating System. This architecture decouples stateless compute logic from globally accessible, shared non-volatile flash media, enabling thousands of graphics processing units (GPUs) and AI accelerator nodes to simultaneously query and ingest petabyte-scale datasets without lock contention, latency spikes, or filesystem fragmentation. The company's recent technology extensions, including confidential AI runtimes and the Polaris global control plane developed in close alignment with NVIDIA's computing ecosystem, target large-scale frontier model training laboratories, national research centers, and enterprise AI factories requiring continuous real-time data access.
    claimRefs:
      - CO001
      - CO010
      - CO011
      - CO014
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance
    title: Executive Leadership, Governance, and Human Capital
    body: VAST Data's strategic direction and architectural execution remain anchored by its technical co-founders. Founder and Chief Executive Officer Renen Hallak previously led core engineering teams at XtremIO prior to its acquisition by EMC, bringing extensive experience in high-performance flash-optimized storage systems to VAST's commercial vision. Co-founder and Chief R&D Officer Shachar Fienblit directs the company's extensive engineering apparatus across its Israeli development centers, overseeing core distributed systems software development, hardware certification, and protocol optimizations. Co-founder and Chief Marketing Officer Jeff Denworth leads product strategy and ecosystem positioning, serving as the primary architectural evangelist across major technology conferences. In 2024, the company appointed former Shopify Chief Financial Officer Amy Shapero as its CFO, a critical governance milestone that significantly bolstered corporate reporting, internal fiscal discipline, and audit readiness ahead of potential initial public offering filings. Total organizational headcount has scaled to approximately 1,100 employees globally, with roughly one-third concentrated in Israeli engineering hubs and the remainder distributed across global enterprise sales, technical support, and partnership engineering. Key-person dependency remains high around CEO Renen Hallak, whose architectural vision and executive relationships with strategic investors such as NVIDIA remain central to company momentum.
    claimRefs:
      - CO001
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO002
  - id: capitalization-trajectory-and-investor-syndicate
    title: Capitalization Trajectory, Valuation, and Investor Syndicate
    body: VAST Data's institutional capitalization reflects an exceptional valuation trajectory driven by accelerating demand for generative AI infrastructure. In May 2021, the company announced an $83 million Series D funding round led by Tiger Global Management at a post-money valuation of $3.7 billion, tripling its valuation within twelve months on the back of rapid customer adoption. By December 2023, VAST completed a Series E financing round that nearly tripled its valuation again to $9.1 billion while confirming $200 million in ARR and over three years of sustained cash-flow positivity. In April 2026, VAST closed a landmark Series F financing that valued the company at $30 billion, more than tripling its Series E benchmark and establishing VAST as the highest-valued private software enterprise originating from the Israeli tech ecosystem. The Series F transaction totaled approximately $1 billion, comprising new primary growth capital alongside more than $500 million in secondary share liquidity for early employees and seed investors, transacted at an estimated 15% discount to headline valuation. The round was led by Drive Capital with Access Industries serving as co-lead, alongside continued participation from strategic investor NVIDIA, Fidelity Management & Research, and New Enterprise Associates. Prior to Series F, VAST had raised nearly $400 million in cumulative equity capital, demonstrating capital efficiency uncommon among mega-cap enterprise infrastructure unicorns.
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO003
  - id: commercial-scale-ecosystem-alliances-and-counterparty-risks
    title: Commercial Scale, Ecosystem Alliances, and Counterparty Risks
    body: VAST Data has expanded its commercial footprint rapidly across artificial intelligence model builders, enterprise hyperscalers, and sovereign computing initiatives. The company reported surpassing $4 billion in cumulative contract bookings and exiting its previous fiscal year with more than $500 million in Committed Annual Recurring Revenue (CARR), while sustaining positive operating margins and free cash flow. In contrast to company-disclosed Committed ARR, third-party press reporting from Calcalist in March 2026 estimated annualized run-rate figures approaching $2 billion by year-end 2025, highlighting a material reporting variance that requires rigorous audit verification across multi-year booking schedules versus ratable revenue recognition. A central pillar of VAST's commercial growth is its landmark multi-year partnership with neocloud leader CoreWeave, valued at $1.17 billion, which embeds VAST's storage layer into thousands of GPU clusters powering client workloads including Mistral AI and xAI. However, secondary market research from EquityZen underscores substantial counterparty concentration risks tied to this reliance on specialized AI hyperscalers; any capital expenditure moderation or architectural shift by CoreWeave could adversely disrupt projected bookings. Concurrently, legacy hardware incumbents including Dell Technologies have escalated direct competitive counter-positioning with 2025 PowerScale solutions, and platform encroachment remains a long-term risk if primary partner NVIDIA expands internal software storage capabilities.
    claimRefs:
      - CO007
      - CO008
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
