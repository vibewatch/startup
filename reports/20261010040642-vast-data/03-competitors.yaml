  - - Pure Storage (FlashBlade / FlashArray)
    - Incumbent All-Flash
    - $17.8B market cap; mature public enterprise vendor
    - Enterprise IT, general file/block, private cloud
    - Direct-to-flash module integration and established enterprise channel presence
    - Dual-controller bottlenecks at extreme GPU scale; higher $/TB on TLC flash
  - - NetApp (ONTAP / AFF)
    - Incumbent Hybrid & Flash
    - $20.2B market cap; legacy enterprise storage leader
    - Enterprise NAS, hybrid cloud, corporate IT infrastructure
    - Mature multi-decade file data management services and hyperscaler integrations (FSxN)
    - Legacy shared-nothing codebase with controller pairing limits throughput for exabyte AI clusters
  - - Weka (WekaFS)
    - Direct AI / HPC Parallel File
    - Late-stage venture backed; specialized HPC file vendor
    - High-performance AI model training, life sciences, HPC
    - Kernel-bypass parallel file performance and high metadata throughput on flash
    - Specialized file system requiring dedicated compute nodes; lacks unified real-time database layer
  - - Dell Technologies (PowerScale / AI Factory)
    - Enterprise OEM Systems
    - Mega-cap diversified hardware OEM ($90B+ enterprise scale)
    - Global enterprise IT, sovereign AI clouds, government
    - Integrated full-stack server/storage bundles and turnkey Dell AI Factory with NVIDIA
    - Siloed legacy storage platforms; leaves model distribution and data platform integration to customer
