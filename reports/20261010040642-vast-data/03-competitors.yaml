- id: TP002
  title: Feature and Capability Comparison Matrix
  columns:
  - Buying Criteria
  - VAST Data
  - Pure Storage / NetApp
  - Weka / Parallel File
  - Hyperscalers (AWS / Azure)
  rows:
  - - Cluster Architecture
    - DASE (Disaggregated Shared-Everything) over NVMe-oF
    - Dual-controller or shared-nothing clustered pairs
    - Distributed parallel file system with node-local flash
    - Distributed object / managed NAS (S3, FSx, Azure Files)
  - - Storage Media Economics
    - 90%+ QLC flash with SCM write buffer and global similarity reduction
    - Proprietary TLC/QLC flash modules; higher $/TB list tiers
    - High-performance NVMe TLC/QLC for scratch and training cache
    - Tiered commodity object storage; high cross-zone egress fees
  - - Multiprotocol Unification
    - Simultaneous NFS, SMB, S3, and structured tabular database
    - Separate file/block/object arrays or layered gateway appliances
    - High-speed POSIX/NFS file; object gateway layered separately
    - Discrete services requiring ETL pipelines between object and database
  - - Confidential AI & Governance
    - DataEnclave hardware-isolated runtime with NVIDIA and Fortanix attestation
    - Host-level or drive-level encryption without GPU TEE runtime
    - Host OS encryption; no native GPU confidential compute integration
    - Public cloud confidential VMs (Azure, Google Cloud TEE instances)
  - - Hardware Flexibility
    - Software-defined; runs on certified commodity hardware (Cisco, Supermicro)
    - Proprietary appliance enclosures with proprietary flash blades/shelves
    - Software-defined on certified x86 commodity storage servers
    - Fully managed public cloud infrastructure with zero on-prem control
  notes: Capability assessment derived from vendor architectural documentation, NAND Research technical analysis, and third-party benchmark evaluations; unsupported capabilities marked per vendor specifications.
