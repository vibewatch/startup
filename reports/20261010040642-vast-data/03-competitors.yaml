- id: TP003
  title: Commercial Packaging and Procurement Comparison
  columns:
  - Vendor & Commercial Model
  - Pricing & Contract Structure
  - Included Capabilities
  - Discounts & Pricing Unknowns
  - Enterprise Buyer Implication
  rows:
  - - VAST Data (Gemini Model)
    - Capacity-based software subscription in 100TB increments decoupled from hardware
    - Full AI OS platform (DataStore, DataBase, DataEngine) and data reduction guarantee
    - Enterprise list prices not publicly published; requires sales engagement for volume rates
    - Avoids hardware refresh tax as licenses transfer across hardware generations; requires hardware procurement channel
  - - Pure Storage (Evergreen // One & Array SKUs)
    - Bundled hardware appliance purchase or STaaS (Evergreen//One) consumption contract
    - All-flash array storage, Purity operating environment, controller upgrade commitments
    - Public list prices obscured by reseller discounting and multi-year commitment terms
    - Simplified turnkey procurement but ongoing vendor lock-in to proprietary hardware architectures
  - - LucidLink (Filespace SaaS)
    - Per-member per-month subscription ($7 to $27/seat) plus pooled storage overage ($7-$8/100GB)
    - Remote cloud-attached filespace for distributed creative and design collaboration
    - Enterprise seat rates and custom add-on pricing require direct quote; egress costs vary
    - Highly transparent for mid-market creative teams, but lacks high-throughput parallel I/O required for large GPU clusters
  - - Hyperscaler Managed Storage (AWS / Azure)
    - Pay-as-you-go capacity, IOPS provisioning, and data transfer/egress billing
    - Fully managed object/file storage with tight cloud compute integration
    - Complex variable billing models with substantial egress and API transaction surcharges
    - Zero upfront capital expenditure but severe data gravity and punitive egress costs if repatriating workloads
  notes: Commercial models compiled from RFP.wiki evaluation reports, published vendor pricing pages, and enterprise procurement analyses as of 2026.
