  - calloutType: "insight"
    title: "Decoupling Hardware Procurement from Software Value Capture"
    body: "VAST Data's Gemini commercial model fundamentally disrupts legacy storage procurement by eliminating vendor hardware markup. By partnering with contract manufacturers like AVNET, enterprise customers buy commodity NVMe and QLC flash hardware at cost while licensing VAST's software layer per usable petabyte, enabling VAST to capture software gross margins near 90%."
    claimRefs:
      - "CM012"
      - "CM013"
  - calloutType: "risk"
    title: "Customer Concentration and GPU Capex Dependency"
    body: "While VAST's commercial traction in GPU neoclouds has generated landmark agreements—such as CoreWeave's $1.17 billion multi-year commitment—this profile creates acute exposure to external GPU financing cycles and cluster buildout schedules. Sustaining long-term expansion requires accelerating penetration among mainstream Fortune 500 enterprises with diverse, non-training workloads."
    claimRefs:
      - "CM011"
      - "CM015"
