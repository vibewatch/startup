evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: arr-reconciliation
    missingEvidence: >-
      Audited financial bridge reconciling company-reported Committed ARR ($500M+ CARR) with third-party press estimates
      citing roughly $2B in ARR by late 2025.
    whyItMatters: >-
      Understanding the exact composition of ratable GAAP software revenue versus multi-year committed bookings is
      critical to evaluating VAST's $30B valuation multiple.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve-month revenue recognition schedules, and customer
      cohort expansion metrics under NDA.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Complete post-Series F capitalization table showing share classes, liquidation preferences, voting covenants, and
      employee option pool dilution.
    whyItMatters: >-
      With more than $500M of the Series F round consisting of secondary sales at a 15% discount, underwriting new
      capital requires knowing senior preference rights.
    diligencePath: >-
      Inspect the amended Certificate of Incorporation and investor rights agreement through secondary transaction
      documents or company data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance-and-succession
    missingEvidence: >-
      Formal board of directors composition, independent director representation, committee charters, and founder
      succession policies.
    whyItMatters: >-
      High operational and strategic key-person dependency on founder-CEO Renen Hallak creates institutional fragility
      if independent board governance is lacking.
    diligencePath: >-
      Review board minutes, director appointment agreements, and key-person insurance covenants during pre-IPO
      compliance review.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-staff-enumeration
    missingEvidence: >-
      Comprehensive corporate directory of functional vice presidents, regional sales directors, and engineering staff
      beyond core executive co-founders.
    whyItMatters: >-
      Assessing organizational scaling durability requires visibility into mid-level management depth across US and
      Israeli engineering operations.
    diligencePath: Review organizational charts and executive recruiting pipelines disclosed in confidential data rooms.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: shareholder-stakeholder-enumeration
    missingEvidence: >-
      Complete schedule of minority institutional shareholders, angel investors, and former employee equity pools across
      Series A through F.
    whyItMatters: Understanding potential secondary selling overhang and shareholder alignment ahead of an eventual public offering.
    diligencePath: Request comprehensive cap table schedule from transfer agent or company legal counsel.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited industry segment breakdown reconciling top-down $400B AI data platform projections against granular
      enterprise software budget allocations.
    whyItMatters: >-
      Macro forecasts by ARK Invest conflate broad AI compute, storage hardware, and software platforms, obscuring the
      precise serviceable market available to software-defined storage vendors.
    diligencePath: >-
      Obtain independent IT analyst bottom-up spend reports (e.g., IDC or Gartner storage software trackers) segmented
      by GPU-adjacent file and object storage.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited customer concentration schedule detailing revenue contribution and renewal terms from top accounts
      including CoreWeave and xAI.
    whyItMatters: >-
      While CoreWeave represents a $1.17B multi-year agreement, the exact annual revenue run-rate contribution and
      renewal exposure across neoclouds remain private, creating valuation uncertainty.
    diligencePath: Review confidential customer cohort disclosures and S-1 registration filings prior to public market underwriting.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
