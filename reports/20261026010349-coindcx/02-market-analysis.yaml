callouts:
  - calloutType: insight
    title: Scale is not addressable revenue
    body: "Registered-user and quarterly-volume claims establish reach but do not disclose active users, take rate, retention, or contribution margin; valuation should not capitalize them as ARR."
    claimRefs: [CM005, CM006]
  - calloutType: risk
    title: Trust is a market constraint
    body: "Withdrawal restrictions, support friction and security incidents can reduce adoption even when product breadth and regulatory optimism expand the theoretical opportunity."
    claimRefs: [CM014, CM015, CM016, CM017]
