artifact: financials
slug: coindcx
runDate: 2026-10-26
company:
  name: CoinDCX
chapter:
  number: 4
  title: Financials
  summary: CoinDCX has a transaction-led crypto-exchange model with public signals of substantial activity, but the available financial evidence is mostly historical or company-claimed. The underwriting case is therefore more dependent on current fee revenue, realized take rate, margins, cash, and post-incident capital adequacy than on the headline valuation or trading-volume figures.
sections:
  - id: monetization
    title: Revenue model and monetization
    body: >-
      CoinDCX's visible monetization is primarily transaction-led: the available
      private-market profile labels its revenue model as commission, while the
      product surface describes spot, futures, options, leverage, staking and
      recurring investment products. This creates multiple opportunities to
      monetize trading activity, but the sources do not disclose the realized
      fee schedule, net take rate, spread capture, revenue mix, or the share of
      revenue from non-trading products. Official app copy is list-level product
      positioning, not recognized revenue. The 2022 revenue figure reported by
      third-party databases is explicitly described as revenue or ARR recorded
      alongside a funding round, and may be run-rate or LTM; it should not be
      treated as current ARR. Consequently, the commercial model is plausible
      and diversified by product surface, but revenue quality remains
      unverified until management provides monthly net revenue by stream,
      customer cohort and geography.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: efficiency-and-costs
    title: Activity, operating leverage and cost drivers
    body: >-
      Public activity signals are large but do not bridge directly to earnings.
      The app listing claims more than two crore Indian users and more than
      ₹2.44 lakh crore of quarterly trading volume, while Multiples records
      $141 million of revenue alongside the April 2022 Series D and describes
      the figure as a run-rate or LTM value. These measures have different
      denominators and periods, so an implied revenue-per-user or take rate
      would be misleading. The operating cost base is also opaque: public
      sources do not provide gross margin, cloud and custody costs, liquidity
      rebates, customer acquisition cost, support cost, compliance staffing,
      chargebacks, or wallet-loss provisions. For a centralized exchange,
      liquidity, security, compliance and customer support are structural
      service-delivery costs, and the legacy-wallet loss linked to a wallet
      abandoned after a 2025 security incident demonstrates that operational
      risk can become a direct financial charge. The right efficiency test is therefore net revenue after
      liquidity and incentive costs, loss-adjusted operating margin, and
      recurring compliance/security spend.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      The last clearly documented priced financing in the assigned evidence is
      the $135 million Series D in April 2022 at a $2.1 billion valuation in
      Multiples, with EquityZen separately describing the company as privately
      held and withholding current valuation and financial detail behind
      accreditation access. A later Republic portfolio update reports a
      Coinbase investment at a reportedly $2.45 billion valuation, but it does
      not state the investment amount, cash balance or use-of-funds schedule.
      The evidence therefore supports financing access and strategic investor
      interest, not a quantified runway. Phemex reports a $15.99 million USDT
      loss tied to a compromised legacy wallet and says CoinDCX credited
      affected users and continued operations; even if customer assets were
      unaffected, the event is a material test of treasury resilience and
      controls. A finance diligence package should obtain current cash and
      restricted cash, monthly burn, debt and contingent liabilities, incident
      remediation costs, insurance recoveries, and the next-round trigger.
      On current evidence, revenue potential is credible but underwriting
      confidence is low because current profitability, liquidity and capital
      adequacy are not disclosed.
    claimRefs: [CI009, CI010, CI011, CI012]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Spot trading, "Transaction commissions and/or spread capture", "Trade value", "Product is offered; realized revenue not disclosed", "Mechanism observed; economics unavailable", "Monthly gross and net take rate by pair and customer tier"]
      - [Futures and margin, "Trading fees and possibly financing-related charges", "Contract or leveraged trade", "Product is offered; mix and net revenue unavailable", "Company-claimed product availability", "Revenue, incentives, liquidation and loss data by product"]
      - [Options, "Options trading fees", "Options notional", "Product is offered; realized pricing unavailable", "Company-claimed product availability", "Fee schedule, rebates, volume and contribution margin"]
      - [Staking and passive rewards, "Potential service or spread economics on held assets", "Assets or rewards", "Product is marketed; revenue recognition unavailable", "Mechanism not quantified", "Custody terms, revenue share and customer-asset treatment"]
      - [Crypto SIP, "Recurring investment activity that can generate trading fees", "Scheduled investment", "Starts at ₹100 according to app listing", "List/product claim, not revenue", "Cohort retention, average order size and net fee yield"]
    notes: "Product availability and minimums come from the official Google Play listing; no source discloses realized revenue by stream. Null or unavailable economics require management data rather than zero assumptions."
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Signal, Price/unit/contract, List vs realized, Discount or unknown, Source, Implication]
    rows:
      - [Crypto purchase minimum, "₹100 minimum", "List/product minimum", "Realized order size and fee unknown", "Google Play listing", "Supports low-ticket acquisition but says nothing about monetization"]
      - [Crypto SIP minimum, "₹100 minimum", "List/product minimum", "Retention and fee yield unknown", "Google Play listing", "Recurring behavior may improve activity quality if retained"]
      - [Options brokerage, "0 brokerage up to 1M USDT notional", "Promotional/list claim", "Eligibility, spread and other charges unknown", "Google Play listing", "Could accelerate volume while compressing direct fee yield"]
      - [Futures leverage, "Up to 100x BTC, ETH and altcoin futures", "Product limit", "Liquidation economics and incentives unknown", "Google Play listing", "Adds activity potential but increases risk and support burden"]
      - [Exchange revenue model, Commission, "Third-party profile classification", "Actual take rate and mix unknown", "Multiples", "Supports transaction-led underwriting, not a revenue forecast"]
    notes: "These are advertised product terms or a profile classification, not realized customer pricing, net revenue, gross margin or cash generation. A current fee card and cohort-level realized pricing are required."
    claimRefs: [CI001, CI002, CI004]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Reported revenue or ARR, "$141M (April 2022)", "Medium; third-party round-associated figure", "Anchor for historical scale, but period and definition are not current", "Reconcile audited revenue, run-rate revenue and ARR definitions"]
      - [Reported valuation, "$2.1B (April 2022)", "Medium; third-party financing profile", "Historical financing mark, not current fair value", "Obtain latest cap table, preferred terms and 2025/2026 mark"]
      - [Reported total funding, "$247M across six rounds", "Medium; third-party financing profile", "Indicates financing access, not cash available", "Reconcile proceeds, secondary sales, cash and restricted cash"]
      - [Quarterly trading volume, "₹2.44L Cr+ claimed", "Medium; company app listing", "Activity denominator for take-rate analysis", "Provide monthly volume, fee waivers and net revenue bridge"]
      - [Users, "2.0 Crore+ Indians claimed", "Medium; company app listing", "Acquisition and liquidity scale proxy", "Define registered, funded, active and retained users"]
      - [Current cash, null, "Unavailable", "Determines runway and ability to absorb losses", "Provide latest cash, restricted cash and treasury holdings"]
      - [Burn and runway, null, "Unavailable", "Determines financing dependency", "Provide 24-month monthly cash-flow bridge and base/downside runway"]
      - [Gross margin, null, "Unavailable", "Tests operating leverage after liquidity and custody costs", "Provide gross profit definition and product-level margin"]
      - [CAC/payback, null, "Unavailable", "Tests whether paid growth creates durable economics", "Provide channel CAC, activation, retention and payback cohorts"]
      - [Debt and project finance, null, "Unavailable", "Identifies fixed claims ahead of equity", "Provide debt schedule, covenants and contingent obligations"]
    notes: "Null means the assigned successful sources did not disclose the metric; it is not zero. Historical financing and activity figures are not interchangeable with cash, burn, ARR or current revenue."
    claimRefs: [CI005, CI006, CI009, CI010, CI012]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Customer activity can feed several transaction-led product streams, but the conversion to recognized net revenue and gross profit is not publicly quantified.
    data:
      nodes:
        - id: users
          label: "Users"
          detail: "2.0 Crore+ Indians claimed in the app listing"
        - id: activity
          label: "Trading and investing activity"
          detail: "Spot, futures, options, margin and SIP products"
        - id: volume
          label: "Gross transaction volume"
          detail: "₹2.44L Cr+ quarterly volume claimed in the app listing"
        - id: fees
          label: "Fees, spread and financing economics"
          detail: "Commission model identified; realized take rate unavailable"
        - id: netrevenue
          label: "Net revenue"
          detail: "Historical $141M revenue/ARR-associated figure reported for April 2022"
        - id: grossprofit
          label: "Gross profit and cash generation"
          detail: "Gross margin, burn and runway unavailable"
    claimRefs: [CI001, CI005, CI006, CI007]

callouts:
  - calloutType: strength
    title: Broad monetization surface
    body: "The platform advertises multiple trading and investing products, giving CoinDCX more than one route to monetize customer activity; the evidence does not establish that each route is material or profitable."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Capital adequacy is the central blocker
    body: "Current cash, burn, runway, margin and loss-absorption capacity are not disclosed in the assigned evidence, while a reported $15.99 million wallet loss shows why treasury resilience matters."
    claimRefs: [CI011, CI012]
  - calloutType: recommendation
    title: Underwrite on net revenue, not volume or valuation
    body: "Require a current product-level revenue bridge, cash-flow schedule and incident-loss reconciliation before relying on the historical financing marks or advertised activity metrics."
    claimRefs: [CI005, CI009, CI011]

