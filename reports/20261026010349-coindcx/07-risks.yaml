schemaVersion: "report-v2"
artifact: risks
slug: coindcx
runDate: 2026-10-26
company:
  name: CoinDCX
chapter:
  number: 7
  title: Risks
  summary: CoinDCX's principal exposure is the interaction between custody and wallet-control failures, withdrawal friction, and a still-maturing independent risk-control framework. The October 2026 retired-wallet loss was reportedly absorbed without customer-balance impact, but the incident and contemporaneous complaints leave material questions about control effectiveness, communications, liquidity resilience, and regulatory protection.
sections:
  - id: custody-and-security
    title: Custody, security, and operational control
    body: >-
      The highest-severity risk is not a proven loss of customer balances in the
      reviewed evidence, but the control gap between wallets classified as retired
      and wallets that continued receiving deposits. Crypto.news reported that
      CoinDCX acknowledged a 15.99 million USDT loss after a failed automated
      sweeping service allowed deposits to accumulate at an old address following
      the July 2025 breach; the company said it absorbed the loss and that customer
      balances and active trading systems were unaffected (CR005). A separate
      account described the same event as an operational loss and reported that
      blockchain analysts found activity at addresses labeled retired (CR016).
      Crypto.news also reported 40 affected addresses, approximately 9.63 million
      dollars traced to exchange-associated deposit addresses, and a 2.21 million
      dollar USDT freeze, but did not establish how the private keys were obtained
      or whether the missing assets were recovered (CR008). The evidence supports a
      severe residual custody and change-management risk, not a conclusion that
      customer funds were lost. The immediate control test is a reconciled inventory
      of every legacy address, a signed deprecation control, and independent proof
      that deposits to retired infrastructure cannot remain operational.
    claimRefs: [CR005, CR006, CR008, CR016]
    tableRefs: [TR001, TR002]
  - id: regulatory-and-customer-access
    title: Regulatory perimeter and customer access
    body: >-
      Regulatory registration reduces some compliance uncertainty but does not
      establish compensation protection, withdrawal timeliness, or resilience in
      every customer jurisdiction. BrokerRank describes CoinDCX as holding one FIU
      license, with no compensation scheme and no fund-segregation protection
      stated in its comparison fields (CR011). That is a third-party description
      and should be verified against the regulator's own register and CoinDCX's
      legal entities; it is not evidence that the FIU registration is invalid.
      The company-controlled Google Play listing instead says the platform is FIU
      compliant, ISO/IEC 27001:2022 certified, and publishes quarterly proof-of-
      reserves reports (CR002). Those controls are useful signals, but the listing
      does not disclose scope, audit opinion, liability coverage, or the treatment
      of legacy-wallet exceptions. AInvest reported delayed crypto and INR
      withdrawals and said CoinDCX attributed restrictions to safety and compliance
      reasons (CR003). Trustpilot contains customer reports of withdrawal
      restrictions lasting more than 20 days and unresolved deposit verification
      (CR014, CR015). These reports are not a measured incident rate, yet they
      make exit access and support responsiveness material risk indicators during
      periods of compliance review or market stress.
    claimRefs: [CR002, CR003, CR011, CR014, CR015]
    tableRefs: [TR003]
  - id: risk-governance-and-financial-resilience
    title: Risk governance, liquidity, and financial resilience
    body: >-
      CoinDCX's own hiring materials indicate that several second-line controls
      are being formalized rather than providing evidence that the target state is
      already operating. The Levels.fyi posting for an AVP/Director of Financial
      and Liquidity Risk assigns ownership of margin and liquidation parameters,
      counterparty concentration, liquidity coverage, client-fund segregation
      review, and proof-of-reserves processes (CR009). It calls for quarterly
      liquidity stress tests and a 72-hour stressed-withdrawal horizon model, and
      describes the first three months as establishing a baseline of current
      exposures and controls (CR010). That is a meaningful mitigation plan, but a
      job specification is company-issued evidence of intended scope, not proof of
      completed implementation or independent assurance. The financial risk is
      therefore model and execution risk: a fast market move, bank or stablecoin
      counterparty problem, or concentrated liquidity dependency could expose gaps
      before the proposed monitoring cadence is demonstrably live. The practical
      kill criterion is a failed reconciliation, an unmodeled bad-debt event, or a
      stressed-withdrawal horizon below the board-approved floor; diligence should
      request dated test outputs, exception logs, counterparty limits, and board
      sign-off.
    claimRefs: [CR009, CR010, CR005, CR008]
  - id: decision-triggers
    title: Monitoring and thesis-break triggers
    body: >-
      The risk posture should be monitored through observable control outcomes
      rather than broad assurances. A repeated withdrawal restriction without a
      documented reason and service-level resolution path would convert a
      customer-support warning into a liquidity and conduct concern (CR003,
      CR014). A second incident involving a deprecated address, an unreconciled
      custody exception, or a failure to distinguish customer liabilities from
      operating assets would materially weaken the claim that segregated custody
      contains platform losses (CR005, CR006, CR016). The proposed risk role gives
      a concrete framework for monitoring: margin and liquidation backtests,
      counterparty exposure matrices, a proof-of-reserves cycle, and fiat custody
      adequacy reviews (CR009, CR010). Until dated outputs are supplied, those
      items remain diligence asks rather than completed mitigations. The investment
      thesis should be paused if CoinDCX cannot evidence the control owners,
      frequency, exceptions, and remediation dates for these tests, or if
      regulatory restrictions prevent customers from accessing assets within the
      stated operating policy.
    claimRefs: [CR003, CR005, CR006, CR009, CR010, CR014, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Legacy-wallet control failure, "15.99 million USDT loss reportedly followed a failed sweeping service; cause and recovery remain partly undisclosed.", High, Critical, Planned or not independently evidenced, "Customer impact was reported as contained; control credibility remains impaired.", "Reconcile every legacy address and test that deprecated addresses cannot receive or retain deposits."]
      - [Regulatory protection mismatch, "Third-party review describes one FIU license and no compensation scheme; scope requires verification.", Medium, High, Partial, "Protection may differ by entity, product, and customer jurisdiction.", "Obtain regulator-register extracts, legal-entity map, customer terms, and compensation / segregation analysis."]
      - [Withdrawal and KYC restriction, "AInvest reported delayed crypto and INR withdrawals; customer reviews describe prolonged restrictions.", Medium, High, Partial, "Exit access and support quality may deteriorate during compliance reviews.", "Request withdrawal SLA data, restriction reasons, aging buckets, and complaint-resolution logs."]
      - [Security disclosure and incident-response gap, "Public reporting describes a 2025 breach and a later retired-wallet loss; regulator notification was not identified in the reviewed record.", Medium, High, Unclear, "Unresolved reporting and root-cause questions could amplify trust and enforcement exposure.", "Confirm incident notices, post-mortems, control exceptions, and independent remediation testing."]
    notes: "Rows synthesize third-party reporting, a company-controlled app listing, and customer reports; likelihood and severity are analyst judgments constrained by the cited evidence, while null or unverified control states mean diligence is required."
    enumerationScope:
      coverage: partial
      basis: "Publicly available regulatory, incident, withdrawal, and customer-support evidence reviewed through 2026-10-26."
    claimRefs: [CR002, CR003, CR005, CR006, CR007, CR011, CR014, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Retired deposit address remains active, High, Critical, Partial, "Funds can accumulate outside the intended active-wallet perimeter.", "No dated independent test of address deprecation and sweeping controls."]
      - [Automated sweeping or reconciliation failure, Medium, Critical, Partial, "A control outage can become an exchange-funded loss before detection.", "Failure window, alerting threshold, and recovery-time objective are not public."]
      - [Withdrawal queue and support delay, Medium, High, Partial, "Users may face trapped liquidity and loss of confidence during volatility.", "No public denominator, median resolution time, or aging distribution."]
      - ["Margin, liquidity, and counterparty model gap", Medium, High, Planned, "Bad debt or bank / stablecoin concentration may surface before second-line limits are live.", "No dated backtest, stress result, board limit, or proof-of-reserves assurance was reviewed."]
    notes: "The register separates observed or reported failure modes from mitigation intent; customer-review examples are directional and do not establish population-wide incident rates."
    claimRefs: [CR003, CR005, CR008, CR009, CR010, CR014, CR015, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - [Banking and fiat rails, "Banking partners / Treasury", "A bank restriction or reconciliation break delays INR deposits or withdrawals.", High, "Independent custody review and liquidity coverage monitoring are proposed.", "Counterparty and account concentration are not publicly quantified.", "Stressed-withdrawal horizon, reconciliation breaks, and unresolved payment tickets."]
      - [Stablecoin issuer intervention, Tether, "A freeze may recover only part of an incident and can interrupt settlement.", High, "On-chain monitoring and incident coordination.", "A reported 2.21 million dollar freeze was smaller than the roughly 16 million dollar loss.", "Frozen, recovered, and unrecovered balances by incident."]
      - [Market makers and liquidity providers, "Market makers / liquidity counterparties", "Counterparty failure or thin liquidity worsens liquidation slippage and exits.", High, "Exposure matrix, credit lines, collateral haircuts, and backtesting are proposed.", "No public exposure matrix or realized-versus-modeled slippage data.", "Counterparty limits, order-book depth, liquidation slippage, and exceptions."]
      - [Customer support and compliance operations, "Support, KYC, and compliance teams", "Slow review or unclear restrictions extend trapped-funds incidents.", Medium, "Automated KYC and support escalation are referenced, but effectiveness is not measured.", "Customer reports indicate unresolved cases; denominator and SLA are missing.", "Restriction aging, first-response time, resolution rate, and repeat complaints."]
    notes: "Counterparties and roles are identified from incident reporting and the company-issued risk role; concentrations, contractual protections, and service levels were not publicly quantified."
    claimRefs: [CR003, CR008, CR009, CR010, CR014, CR015, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: "Custody and exit-access risks are the most urgent because the public evidence combines severe incident consequences with incomplete proof that proposed controls are operating."
    data:
      columns: [Likelihood, Impact, Residual exposure]
      rows:
        - label: Legacy-wallet control failure
          values: [High, Critical, High]
        - label: Withdrawal and KYC restriction
          values: [Medium, High, High]
        - label: Liquidity and counterparty model gap
          values: [Medium, High, High]
        - label: Regulatory protection mismatch
          values: [Medium, High, Medium-High]
        - label: Support and incident communication
          values: [Medium, Medium, Medium-High]
        - label: Stablecoin recovery dependency
          values: [Medium, High, Medium-High]
    approximationNotes: "Likelihood and residual exposure are qualitative assessments based on the cited public evidence and the absence of disclosed control test results; they are not probabilities."
    claimRefs: [CR003, CR005, CR008, CR009, CR010, CR011, CR014, CR016]
callouts:
  - calloutType: risk
    title: Retired infrastructure remains the central control warning
    body: "The reported 15.99 million USDT loss followed a failed sweep from wallets treated as retired; customer impact was described as contained, but the control boundary was not."
    claimRefs: [CR005, CR008, CR016]
  - calloutType: risk
    title: Exit access is an operating-risk metric
    body: "Withdrawal restrictions and unresolved customer cases can turn compliance friction into liquidity and conduct risk, especially when users cannot see a clear resolution path."
    claimRefs: [CR003, CR014, CR015]
  - calloutType: insight
    title: Mitigation maturity is not yet demonstrated
    body: "The proposed second-line risk role identifies the right controls, but a job specification is not evidence that stress tests, custody reviews, or proof-of-reserves assurance have been completed."
    claimRefs: [CR009, CR010]
  - calloutType: assumption
    title: Do not infer customer loss from platform loss
    body: "The reviewed reporting says CoinDCX absorbed the latest loss and customer balances were unaffected; independent verification of segregation and recovery remains a diligence requirement."
    claimRefs: [CR005, CR006]
