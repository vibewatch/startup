  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: retention
      missingEvidence: "Monthly active traders, funded accounts, cohort retention, GRR/NRR, churn, repeat-trade rates, and revenue retention by segment."
      whyItMatters: "Registered-user growth and campaign conversion do not establish durable customer economics or a repeatable revenue base."
      diligencePath: "Request monthly cohort tables for the last 24 months linking registration, KYC completion, first funding, first trade, repeat trade, churn, and fee revenue."
      relatedQuestionRefs: [QU004, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: "At least three independently verifiable named customer deployments or references with production status and outcomes."
      whyItMatters: "The strongest named proof is a partner-hosted case study, while app ratings and reviews cannot verify production outcomes."
      diligencePath: "Obtain customer-reference calls, anonymized account cohorts, and independently verifiable partner or procurement records."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Customer concentration by top accounts, geography, acquisition channel, institutional versus retail mix, and partner dependence."
      whyItMatters: "Concentration can make aggregate user growth misleading and expose the business to channel, regulatory, or liquidity shocks."
      diligencePath: "Request the top-10 account and channel concentration schedule, geographic mix, and monthly changes in the retail/institutional split."
      relatedQuestionRefs: [QU005]
    - type: conflicting-data
      severity: material
      topic: customer-feedback
      missingEvidence: "A representative customer-support and satisfaction dataset reconciling high app ratings with adverse Trustpilot complaints."
      whyItMatters: "The two public feedback surfaces have different samples and may reflect different customer cohorts, so neither should be treated as representative alone."
      diligencePath: "Reconcile app-store ratings, Trustpilot complaints, support tickets, withdrawal SLAs, and resolved-versus-open issue cohorts."
      relatedQuestionRefs: [QU008]
    - type: stale
      severity: minor
      topic: historical-scale
      missingEvidence: "A current source that reconciles historical 10M+ user claims with the H1CY26 22M registered-user figure and current activity."
      whyItMatters: "Older user and transaction figures are useful context but should not be substituted for current active-customer metrics."
      diligencePath: "Request the latest audited or management-certified customer KPI pack with definitions and period-over-period reconciliation."
      relatedQuestionRefs: [QU002]
