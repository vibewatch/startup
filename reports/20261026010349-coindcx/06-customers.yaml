    rows:
      - [Registered users, 22 million, H1CY26, high, "Reach expanded from the prior comparable half-year", "Funded, active, and fee-paying users"]
      - [Registered-user growth, "15.8% increase from 19 million to 22 million", H1CY25 to H1CY26, high, "Account base grew", "Net adds, activation, and retention"]
      - [Total traded value, "₹14,664 crore", H1CY26, high, "Activity remained material in absolute terms", "Active traders and fee revenue"]
      - [Total traded-value change, "37% year-on-year decline from ₹23,497 crore", H1CY25 to H1CY26, high, "User growth did not translate into comparable traded value", "Monthly active users and mix"]
      - [New-user widget conversion, "10% of users who saw the widget made a trade", Three-month case-study period, medium, "A targeted surface can move first trade behavior", "Exposure count, control group, persistence"]
      - [Futures campaign lift, "30% more users started trading crypto futures after seeing the campaign", Three-month case-study period, medium, "Feature education may improve derivatives adoption", "Baseline, absolute users, revenue, retention"]
      - [First-trade walkthrough outcome, "Approximately 45% of targeted users started their first trade", Three-month case-study period, medium, "Guided onboarding may reduce early drop-off", "Target size, counterfactual, later activity"]
    notes: "Business Standard reports H1CY26/H1CY25 figures; Plotline reports campaign outcomes from a vendor case study. The figures should not be combined into a single conversion funnel because populations and time bases differ."
