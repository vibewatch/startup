company:
  name: CoinDCX
chapter:
  number: 6
  title: Customers
  summary: >-
    CoinDCX reported 22 million registered users in H1CY26, but Business
    Standard also reported a 37% year-over-year decline in total traded value.
    Vendor-hosted activation results indicate that in-app guidance can move
    first-trade and futures behavior, while retention, cohort durability, and
    customer concentration remain unverified.
sections:
  - id: customer-segments
    title: Customer segments and adoption
    body: >-
      Available evidence describes CoinDCX primarily as a retail crypto
      investment and trading platform spanning newer investors, active spot
      traders, futures traders, and a historically referenced institutional
      segment. Business Standard reported 22 million registered users in
      H1CY26, up from 19 million in H1CY25, while average investor age moved
      from 29–30 to 30–31. The same report said average tokens per trader were
      five. CoinDCX's Google Play listing separately markets the app to more
      than 2.0 crore Indians, but that company-issued figure is not a funded,
      active, retained, or fee-paying customer count. A stale secondary case
      study said 90% of users came from Tier-I and Tier-II cities, without
      disclosing a methodology. These sources establish broad reach, not
      current cohort quality or segment economics.
    claimRefs: [CU001, CU003, CU004, CU010, CU015, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and conversion proof
    body: >-
      CoinDCX has measurable product-conversion evidence, but it is
      campaign-level rather than a complete retention funnel. Plotline, a
      supplier to CoinDCX, says the growth team launched more than 20 in-app
      campaigns over three months. It reports that 10% of exposed new users
      made a trade, 30% more exposed users started trading futures, and about
      45% of users targeted by a six-step walkthrough started their first
      trade. These figures identify an exposed population and an action, but
      the case study does not disclose control groups, absolute sample sizes,
      revenue per user, or post-campaign persistence. Business Standard's
      H1CY26 figures reinforce that caution: registered users grew while total
      traded value fell from ₹23,497 crore to ₹14,664 crore. Reach and
      activation therefore should not be read as durable engagement.
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU008, CU009]
  - id: named-proof-and-durability
    title: Named proof, durability, and customer risk
    body: >-
      Public named-customer proof is limited. The strongest production-like
      evidence is a named CoinDCX growth leader describing measured first-trade
      and futures outcomes, but it is a supplier-hosted case study rather than
      an independently audited customer reference. CoinDCX's Google Play
      listing claims broad customer reach and substantial quarterly trading
      volume; neither figure discloses active users or retention. Trustpilot's
      fetched page provides adverse, user-generated accounts involving
      withdrawals, deposit verification, liquidation, fees, delistings, and
      support responsiveness. These self-selected complaints are not a
      representative churn study, but they identify trust and service issues
      that customer data should test. Crypto Briefing also reported a roughly
      $16 million operational wallet loss in 2026; CoinDCX said affected users
      were credited and trading continued. No retained source establishes GRR,
      NRR, churn, renewal, contract length, concentration, or channel
      dependence.
    claimRefs: [CU006, CU007, CU008, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: diligence-implications
    title: Customer diligence implications
    body: >-
      The customer thesis is strongest on reach and the ability to move users
      through first-trade and futures-product journeys, not on durable economic
      engagement. Underwriting should separate registered accounts from funded
      accounts, monthly active traders, first-time traders, repeat traders, and
      fee-paying customers, then reconcile each cohort to traded value and
      revenue. It should test whether campaign lifts persist and whether
      support, withdrawal, liquidation, and wallet incidents increase churn or
      move deposits off-platform. The H1CY26 decline in traded value despite
      user growth makes traded value per registered user a key monitor. The
      evidence is also silent on top-account, geography, acquisition-channel,
      and institutional-versus-retail concentration, so no durable expansion
      or concentration conclusion is supportable from public data.
    claimRefs: [CU001, CU002, CU007, CU009, CU012, CU013, CU014, CU016]
    tableRefs: [TU002]
