    rows:
      - [CoinDCX growth team, New and dormant retail users, High-volume-token widget, "In-app production campaign described by vendor", "10% of exposed new users made a trade", "Vendor case study; no control group or sample size"]
      - [CoinDCX growth team, Futures traders, Futures education and wallet top-up flow, "In-app production campaign described by vendor", "30% more users started futures trading after exposure", "No absolute baseline or persistence measure"]
      - [CoinDCX growth team, Newly onboarded users, Six-step homepage walkthrough, "In-app production campaign described by vendor", "Approximately 45% of targeted users started a first trade", "Targeted conversion is not retention or revenue proof"]
      - [CoinDCX app users, Broad retail audience, Android investment and trading features, "Live company-issued app listing", "Listing claims 2.0 crore+ Indians and ₹2.44 lakh crore+ quarterly trading volume", "No active-user, funded-account, or retention denominator"]
      - [CoinDCX reviewers, Retail users with support or trading issues, "Withdrawals, deposits, liquidation, fees, and delistings", "User-generated review evidence", "Fetched reviews describe repeated access and support problems", "Self-selected sample; not representative churn data"]
    notes: "No named enterprise customer or independently audited deployment was found in the assigned pool. Vendor-hosted and user-generated evidence is retained but labeled with its limitations."
    claimRefs: [CU006, CU007, CU008, CU010, CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from reach to durable activity
    type: journey-map
    summary: The evidence supports a path from broad registration through first trade and product adoption, while durable retention and expansion remain unverified.
    data:
      items:
        - label: Registered reach
          detail: "22 million registered users in H1CY26"
          touchpoints: ["Account registration", "Retail acquisition"]
        - label: Onboarding
          detail: "Automated KYC and onboarding are described in the app listing"
          touchpoints: ["KYC", "INR deposit and withdrawal"]
        - label: First trade
          detail: "Approximately 45% of targeted walkthrough users started a first trade"
          touchpoints: ["Guided walkthrough", "Token discovery"]
        - label: Spot activity
          detail: "10% of exposed new users made a trade after the widget campaign"
          touchpoints: ["Spot trading", "Portfolio use"]
        - label: Futures adoption
          detail: "30% more users started futures trading after the campaign"
          touchpoints: ["Futures education", "Futures wallet top-up"]
        - label: Durable value
          detail: "Retention, repeat trading, and expansion are not publicly quantified"
          touchpoints: ["Repeat trading", "Retention and expansion evidence gap"]
    approximationNotes: "Conceptual journey only; stages use different populations and periods, so no conversion rate is implied."
    claimRefs: [CU001, CU005, CU006, CU007, CU008, CU009]
callouts:
  - calloutType: insight
    title: Reach is proven more clearly than durability
    body: Registered-user growth and campaign conversion signals show a meaningful acquisition and activation surface, but the fall in traded value and absence of retention cohorts prevent a conclusion that customer economics are improving.
    claimRefs: [CU001, CU002, CU005, CU009]
  - calloutType: risk
    title: Trust and service friction are material customer risks
    body: User-generated complaints about withdrawals, deposit verification, liquidation, fees, and support should be tested against ticket-level data, withdrawal SLAs, complaint rates, and churn cohorts rather than dismissed as anecdotal.
    claimRefs: [CU012, CU013, CU014]
