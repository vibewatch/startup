              - CP007
              - CP011
              - CP012
              - CP015
      - number: '3.3'
        title: Durability, displacement, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Trust and operational reliability are the clearest durability tests in this pool. Economic Times reported
              that the July 2025 breach targeted an internal liquidity account, while CoinDCX said customer funds were
              segregated and that it would absorb the loss. In October 2026, Crypto Briefing reported a roughly $16
              million loss linked to deprecated wallet infrastructure and an automated sweeping failure; CryptoPotato
              quoted the company's statement that the loss was absorbed and customer balances were accounted for, while
              also recording the earlier denial that wallets had been breached. Trustpilot's archived page contains
              low-rated user reports about withdrawal restrictions, support delays, and trading-cost disputes. These are
              not controlled benchmarks, but they are adverse signals against a trust-based moat. The pool does not
              disclose competitor fees, liquidity depth, uptime, institutional contracts, or independently measured
              switching costs, so moat durability remains an open diligence question.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is a credible positioning asset
            body: >-
              CoinDCX's app listing combines retail, derivatives, options, global futures, SIPs, tax integration, and
              Web3 surfaces; the breadth can support segmentation if execution remains reliable.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
          - type: callout
            title: Operational resilience can erase the moat
            body: >-
              The 2025 breach and the 2026 deprecated-wallet loss show why proof-of-reserves and product breadth should
              not be treated as substitutes for wallet lifecycle controls, incident disclosure, and support performance.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: callout
            title: Missing competitor economics are material
            body: >-
              The assigned pool does not contain comparable competitor fee schedules, liquidity measurements, customer
              cohorts, or switching-cost data; any relative pricing or moat conclusion needs fresh primary diligence.
            calloutType: assumption
            claimRefs:
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              CoinDCX's visible monetization is primarily transaction-led: the available private-market profile labels
              its revenue model as commission, while the product surface describes spot, futures, options, leverage,
              staking and recurring investment products. This creates multiple opportunities to monetize trading
              activity, but the sources do not disclose the realized fee schedule, net take rate, spread capture,
              revenue mix, or the share of revenue from non-trading products. Official app copy is list-level product
              positioning, not recognized revenue. The 2022 revenue figure reported by third-party databases is
              explicitly described as revenue or ARR recorded alongside a funding round, and may be run-rate or LTM; it
              should not be treated as current ARR. Consequently, the commercial model is plausible and diversified by
              product surface, but revenue quality remains unverified until management provides monthly net revenue by
              stream, customer cohort and geography.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: Activity, operating leverage and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Public activity signals are large but do not bridge directly to earnings. The app listing claims more than
              two crore Indian users and more than ₹2.44 lakh crore of quarterly trading volume, while Multiples records
              $141 million of revenue alongside the April 2022 Series D and describes the figure as a run-rate or LTM
              value. These measures have different denominators and periods, so an implied revenue-per-user or take rate
              would be misleading. The operating cost base is also opaque: public sources do not provide gross margin,
              cloud and custody costs, liquidity rebates, customer acquisition cost, support cost, compliance staffing,
              chargebacks, or wallet-loss provisions. For a centralized exchange, liquidity, security, compliance and
              customer support are structural service-delivery costs, and the legacy-wallet loss linked to a wallet
              abandoned after a 2025 security incident demonstrates that operational risk can become a direct financial
              charge. The right efficiency test is therefore net revenue after liquidity and incentive costs,
              loss-adjusted operating margin, and recurring compliance/security spend.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The last clearly documented priced financing in the assigned evidence is the $135 million Series D in
              April 2022 at a $2.1 billion valuation in Multiples, with EquityZen separately describing the company as
              privately held and withholding current valuation and financial detail behind accreditation access. A later
              Republic portfolio update reports a Coinbase investment at a reportedly $2.45 billion valuation, but it
              does not state the investment amount, cash balance or use-of-funds schedule. The evidence therefore
              supports financing access and strategic investor interest, not a quantified runway. Phemex reports a
              $15.99 million USDT loss tied to a compromised legacy wallet and says CoinDCX credited affected users and
              continued operations; even if customer assets were unaffected, the event is a material test of treasury
              resilience and controls. A finance diligence package should obtain current cash and restricted cash,
              monthly burn, debt and contingent liabilities, incident remediation costs, insurance recoveries, and the
              next-round trigger. On current evidence, revenue potential is credible but underwriting confidence is low
              because current profitability, liquidity and capital adequacy are not disclosed.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad monetization surface
            body: >-
              The platform advertises multiple trading and investing products, giving CoinDCX more than one route to
              monetize customer activity; the evidence does not establish that each route is material or profitable.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: callout
            title: Capital adequacy is the central blocker
            body: >-
              Current cash, burn, runway, margin and loss-absorption capacity are not disclosed in the assigned
              evidence, while a reported $15.99 million wallet loss shows why treasury resilience matters.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
          - type: callout
            title: Underwrite on net revenue, not volume or valuation
            body: >-
              Require a current product-level revenue bridge, cash-flow schedule and incident-loss reconciliation before
              relying on the historical financing marks or advertised activity metrics.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI009
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The observable product is an integrated crypto trading and investing surface rather than a single exchange
              screen. The Google Play listing describes INR deposits and withdrawals, automated KYC, spot trading,
              futures wallets, cross-margin, options, global futures, crypto SIPs, tax-reporting integration, and
              unified Go/Pro modes. It also claims access to 500+ cryptocurrencies and 300+ futures pairs, while
              separately describing 1,000+ curated spot assets and 50,000+ tokens or pre-launch tokens. Those counts are
              company-published app-store claims with different scopes, not a reconciled inventory. The customer
              workflow therefore appears to run from onboarding and KYC through funding, order entry, execution,
              portfolio tracking, and reporting, but the public record does not establish how availability, eligibility,
              or liquidity differs by product, jurisdiction, or account tier.
            claimRefs:
