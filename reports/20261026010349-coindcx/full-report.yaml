  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public scale and strategic reach are filtered through financial opacity and control risk before reaching a
      research-more decision.
    data:
      nodes:
        - id: scale
          label: Company-claimed scale
          detail: More than two crore Indians and broad product coverage require active-user and monetization verification.
        - id: strategic-reach
          label: Strategic reach
          detail: BitOasis adds a MENA expansion path, but acquisition economics are undisclosed.
        - id: private-mark
          label: $2.45B private mark
          detail: The October 2025 post-money mark is observable but not a current intrinsic-value proof.
        - id: economics-gap
          label: Current economics gap
          detail: Audited revenue, margins, cash, retention, and liability detail are unavailable in retained evidence.
        - id: risk-filter
          label: High-risk filter
          detail: Tax sensitivity, customer complaints, and the reported wallet loss increase the required return.
        - id: decision
          label: Research-more
          detail: Price only after primary financial, cap-table, preference, and control evidence is verified.
      edges:
        - from: scale
          to: strategic-reach
        - from: strategic-reach
          to: private-mark
        - from: private-mark
          to: economics-gap
        - from: economics-gap
          to: risk-filter
        - from: risk-filter
          to: decision
    approximationNotes: >-
      The sequence expresses decision dependencies only; it does not assign probabilities, conversion rates, or
      value-proportional weights.
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV010
      - CV012
      - CV014
      - CV016
