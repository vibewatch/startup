      - number: '5.2'
        title: Operating model and technical evidence
        blocks:
          - type: paragraph
            body: >-
              CoinDCX exposes a developer surface through an official GitHub repository for REST API documentation, with
              instructions to generate API keys through the company API dashboard and to read documentation at
              docs.coindcx.com. A third-party integration article describes the API as supporting market data, order
              execution, account information, WebSockets, and more than 200 markets, but it is also marketing an
              alternative integration product and should not be treated as independent verification of every capability.
              A CoinDCX engineering job repost provides a useful signal about the problems the team is hiring to solve:
              large-scale consumer web applications, shared frameworks and SDKs, frontend performance, observability,
              web security, and integration across frontend, backend, and platform services. None of these sources
              disclose the backend topology, custody controls, matching-engine design, SLOs, test evidence, or
              production incident metrics.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
