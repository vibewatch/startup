chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              CoinDCX is consistently described as a Mumbai-based cryptocurrency exchange founded in 2018. Its consumer
              app markets spot trading, futures, options, crypto SIPs, INR funding, and tax-reporting integration,
              positioning the business as an all-in-one trading and investment platform rather than a single-product
              broker. The Google Play copy is company-issued even though it is hosted by Google, so it establishes
              offered functionality and management's current positioning but does not independently verify adoption or
              service quality. Multiples describes a commission-led, privately held exchange serving retail and
              institutional users. Together, the evidence supports the exchange model, but it does not disclose the
              current revenue mix across trading commissions, deposit or withdrawal fees, listings, or other services.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
