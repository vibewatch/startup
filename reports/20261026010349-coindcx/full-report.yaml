      - number: '3.2'
        title: Buyer-facing comparison
        blocks:
          - type: paragraph
            body: >-
              The buying decision is likely segmented by user sophistication and trust requirements. The assigned
              evidence describes a simplified retail mode, professional tools, institutional/HNI services, and a Web3
              wallet, while the interview guide describes operational roles covering trade operations, customer queries,
              reporting, and risk management. These signals support a multi-product operating model, but they do not
              establish realized customer mix, switching rates, or competitor win rates. For a buyer, supported local
              access and product breadth may reduce the need to multi-home; however, the same breadth increases the
              surface area for wallet, support, and compliance failures.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
