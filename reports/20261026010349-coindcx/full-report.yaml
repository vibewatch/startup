      - number: '1.3'
        title: Capital, scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              CoinDCX has clear access to institutional capital, but the public financing record is not internally
              consistent. FundedIQ reports $228 million across three rounds, Lapaas reports $245 million across seven
              tracked rounds, and Multiples and TexAu report $247 million. The April 2022 Series D is reported at either
              $135 million or $136 million depending on the dataset. More recent secondary sources place the company at
              a $2.45 billion post-money valuation after an October 2025 investment, but the amount invested is not
              disclosed in the retained evidence. Company-issued app copy claims more than two crore Indian users and
              over ₹2.44 lakh crore in quarterly trading volume, while headcount sources diverge sharply. None of these
              figures should be treated as current audited revenue, cash available, or independently verified usage.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The operating trajectory runs from a 2018 founding through multiple financing rounds, a 2021 unicorn
              valuation, the 2024 BitOasis acquisition, and an October 2025 investment reported at a higher valuation.
              That growth record is counterbalanced by control failures. AInvest reports that a July 2025 malware
              incident led to a roughly $44 million loss from an internal liquidity wallet, followed in 2026 by a
              roughly $15.99 million loss after a deposit-sweeping control for retired addresses failed. The article
              says the company absorbed the later loss and credited affected users, but this is a balance-sheet response
              rather than independent assurance that custody controls were remediated. Archived Trustpilot reviews also
              repeatedly describe withdrawal restrictions, deposit verification delays, and weak support; these
              anecdotes identify diligence themes but cannot measure their incidence across the customer base.
