        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public profiles identify Sumit Gupta as co-founder and CEO and Neeraj Khandelwal as co-founder. The
              assigned evidence does not establish a complete current executive roster, board composition, ownership
              structure, or succession plan, so founder-market fit can be described only at the level of role continuity
              rather than independently verified operating depth. A listing-services provider says CoinDCX evaluates
              token applicants across business model, technology, team, market position, token utility, traction, and
              financial structure. That supplier-authored description indicates the breadth of governance information
              expected from listed projects; it is not evidence that CoinDCX itself publicly meets an equivalent
              disclosure standard. Primary group-structure and board records remain necessary.
