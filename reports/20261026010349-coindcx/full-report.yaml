          Company-claimed reach exceeds two crore Indians and the app spans spot, futures, options, SIPs, and other
          products.
        - Verify monthly funded active users, cohort retention, net revenue, and product-level contribution margin.
      - - Thesis
        - The BitOasis acquisition adds a MENA expansion path beyond the Indian market.
        - Disclose purchase price, integration costs, regulated-entity economics, and post-acquisition revenue.
      - - Anti-thesis
        - India's 1% TDS was reported to reduce trading activity, making volume and revenue policy-sensitive.
        - Show normalized activity and revenue resilience under the current tax and regulatory regime.
      - - Anti-thesis
        - Customer complaints and the reported 2026 wallet loss raise service, control, and trust concerns.
        - Provide incident root-cause evidence, reserve impact, remediation testing, and complaint-resolution metrics.
    notes: >-
      The app metrics are company-issued claims; complaints are an unverified review sample, not a population estimate;
      tax and incident evidence reflects the periods stated in the cited sources.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Case
      - Assumptions and valuation logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          Verified active-user monetization, resilient post-tax volumes, successful BitOasis integration, and clean
          control remediation could justify a premium to the latest $2.45B private mark.
        - 'Signal: audited growth and improving unit economics. Trigger: integration costs or controls fail to reconcile.'
      - - Base
        - >-
          Stable operations and moderate growth could support the latest private mark only if current revenue quality
          and security terms are verified.
        - >-
          Signal: flat-to-positive funded-user cohorts. Trigger: valuation relies on historical 2022 revenue or
          company-claimed volume alone.
      - - Bear
        - >-
          Volume compression, trust erosion, further control losses, or unfavorable preferences could drive a down-round
          or impaired common-equity outcome.
        - >-
          Signal: declining funded activity or unresolved incidents. Trigger: another material custody or wallet-control
          failure.
    notes: >-
      These are conditional scenarios without assigned probabilities or precise valuation ranges because current audited
      financials, ownership terms, and comparable transaction economics are unavailable.
    claimRefs:
      - CV003
      - CV005
      - CV007
