  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “all crypto” and should not be sized from a single global headline. For
              CoinDCX, the core boundary is Indian retail and active-trader access to crypto assets through an
              INR-linked centralized exchange, including spot, derivatives, options, recurring investment, custody or
              wallet functionality, and compliance support. The Google Play listing describes access to 500+ crypto
              assets, global futures, US stocks, SIPs, INR deposits and withdrawals, and quarterly proof of reserves,
              while its disclaimer says crypto products are unregulated and may have no regulatory recourse. That
              creates a market with both transaction-fee demand and trust/compliance demand. Adjacent spend includes
              Web3 wallet, stablecoin and tokenization services; excluded from the core estimate are the full value of
              underlying tokens, unrelated global exchange volume, and investment returns. Direct substitutes include
              other Indian exchanges and global platforms; decentralized exchanges, peer-to-peer trading, self-custody,
              and simply holding assets are additional substitutes. The market boundary is therefore a service-revenue
              market, not a measure of customer assets or token capitalization.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              Evidence supports multiple sizing lenses but not a reliable CoinDCX-specific TAM, SAM, or SOM. The company
              app listing provides a company-claimed user and activity lens: “2.0 Crore+ Indians” and “₹2.44L Cr+ Qtrly
              Trading Volumes”; these are platform claims and do not establish active users, fee revenue, take rate, or
              market share. The Hindu separately reports that CoinDCX’s website said it had over 1.6 crore registered
              users, showing both a large disclosed scale and a metric-definition discrepancy that must be preserved
              rather than averaged. A third-party SWOT page estimates 15M+ registered users and says Indian crypto
              penetration is below 15%, but presents no transparent methodology; it is directional, not a
              valuation-grade market estimate. A second lens is product breadth: spot, futures, options, SIPs, passive
              earnings, and Web3 access expand monetizable workflows, while a third lens is institutional and
              tokenization demand. The missing bridge is the denominator: India’s active, compliant, fee-paying trading
              population, wallet balances, volume, and achievable share by product are not established in the assigned
              evidence.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              CoinDCX’s demand is segmented by workflow rather than by one homogeneous “crypto user.” Retail investors
              need onboarding, education, simple spot access and recurring purchases; active traders need liquidity,
              leverage, derivatives, transparent fees and reliable execution; high-net-worth individuals, family offices
              and emerging institutions need controls, custody, reporting and policy confidence; and Web3 users need
              wallet, token and decentralized-application access. The app listing directly supports the first two
              workflows through low minimums, SIPs, futures, options and advanced order management. The SWOT source
              identifies institutional services and family offices as an opportunity, but that is an analyst-style
              assertion rather than evidence of current budget ownership or conversion. In this market the user and
              payer are often the same retail account holder, while an institution’s trading, treasury, compliance and
              risk functions can split user, approver and budget owner. Adoption triggers are simpler INR access,
              acceptable tax treatment, liquidity, security assurance, and confidence that withdrawals and support will
              work.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is governed by a tension between product expansion and institutional trust. The Crypto Times
              reports that CoinDCX expects regulatory clarity, stablecoin adoption and tokenization to influence 2026
              demand, and quotes Sumit Gupta saying “tokenization is a big theme…we see more and more adoption happening
              in stablecoins and crypto in general in 2026, not just in the US but many other countries also.” Those are
              company-linked outlook statements, not independent forecasts. The Hindu documents the opposite friction:
              CoinDCX restricted crypto withdrawals for safety and compliance reasons, users saw conflicting
              information, and a KYC/PAN downtime alert appeared during a period of elevated support volume.
              CryptoBriefing reports a roughly $16 million operational loss after a failed sweeping service and notes a
              prior 2025 hack, while Trustpilot contains anecdotal complaints about withdrawals, support and fees;
              neither establishes a population-wide failure rate, but both identify trust as a material adoption
              constraint. Regulation, tax, liquidity, security, service reliability and switching costs therefore matter
              more to valuation than raw registered-user scale. The assigned evidence does not establish retention,
              active users, take rate, contribution margin, or conversion from retail to higher-value segments.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not addressable revenue
            body: >-
              Registered-user and quarterly-volume claims establish reach but do not disclose active users, take rate,
              retention, or contribution margin; valuation should not capitalize them as ARR.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
          - type: callout
            title: Trust is a market constraint
            body: >-
              Withdrawal restrictions, support friction and security incidents can reduce adoption even when product
              breadth and regulatory optimism expand the theoretical opportunity.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              CoinDCX's competitive set is layered rather than a single peer group. A public fintech review places
              WazirX, ZebPay, and Bitbns in its domestic comparison set, while describing Okto as indirectly competing
              with Binance and Coinbase Wallet for cross-border Web3 use cases. The same source describes CoinDCX as
              spanning beginner access, advanced trading, and institutional/HNI services. CoinDCX's own app listing
              supports the breadth claim with 500+ cryptocurrencies, 300+ futures pairs, options, global futures, SIPs,
              and Web3 access to more than 50,000 tokens. This is a breadth-led position, not proof of superior
              liquidity, execution, or economics. The relevant substitutes also include keeping assets in a self-custody
              wallet, using a global exchange, or not trading at all.
