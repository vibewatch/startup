evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      A current board and executive roster, group structure, capitalization table, investor rights schedule, and founder
      succession plan.
    whyItMatters: >-
      The public pool names founders and investors but cannot establish oversight depth, control, ownership
      concentration, or continuity.
    diligencePath: >-
      Request corporate registers, board materials, organization charts, shareholder agreements, founder employment
      terms, and succession documentation.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-and-headcount
    missingEvidence: >-
      Primary financing schedules and a current employee census that reconcile round coverage, funding totals, and
      workforce size.
    whyItMatters: >-
      Funding totals range from $228M to $247M and headcount ranges from a 101-250 band to 945, preventing a reliable
      current scale baseline.
    diligencePath: >-
      Reconcile executed financing documents and bank proceeds, then obtain payroll records and contractor definitions
      as of the run date.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: custody-controls
    missingEvidence: >-
      Primary incident reports, wallet reconciliations, remediation testing, insurance recoveries, and independent
      assurance after the 2025 and 2026 losses.
    whyItMatters: >-
      Absorbing reported losses does not demonstrate that custody controls, monitoring, or the capital buffer can
      prevent or withstand recurrence.
    diligencePath: >-
      Obtain forensic reports, affected-wallet reconciliations, regulator correspondence, reserve attestations, and
      third-party control testing.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      Independent India crypto market revenue, active-user, fee-volume and segment data with a transparent denominator
      and current period.
    whyItMatters: >-
      Without a denominator and monetization bridge, CoinDCX's disclosed reach cannot be translated into TAM, SAM, SOM
      or valuation.
    diligencePath: >-
      Obtain current regulator, exchange-volume, analyst and audited operating data; reconcile active accounts, fee
      volume, take rate and geography.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: platform-scale
    missingEvidence: A reconciled definition and period for the 1.6 crore, 15M+ and 2.0 crore user figures.
    whyItMatters: >-
      Registered users may include inactive or duplicate accounts and cannot be used as a comparable adoption
      denominator.
    diligencePath: >-
      Request cohort-level active, funded and transacting-user definitions by product and period, with reconciliation to
      reported volume.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: institutional
    missingEvidence: Current institutional customer count, pipeline, budget owner, product usage and economics.
    whyItMatters: >-
      Institutional expansion is cited as an opportunity but cannot yet support a separate SAM or diversification
      thesis.
    diligencePath: >-
      Review anonymized institutional contracts, active accounts, volume, revenue, retention and compliance requirements
      under NDA.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption
    missingEvidence: >-
      Current impact of tax, withdrawal restrictions, support incidents and security losses on active users, volume and
      retention.
    whyItMatters: These constraints may determine adoption timing and valuation more than gross registered-user scale.
    diligencePath: >-
      Obtain product-level cohorts, withdrawal completion times, complaint and SLA data, incident-loss ledger and
      post-incident retention.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: Current official fee schedules and realized-fee examples for CoinDCX and named peers.
    whyItMatters: >-
      Without comparable prices, a breadth or low-fee position cannot be translated into buyer economics or moat
      strength.
    diligencePath: >-
      Collect current official pricing pages and anonymized executed-fee examples for retail, derivatives, and
      institutional tiers.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: liquidity-and-execution
    missingEvidence: Independent depth, spread, slippage, uptime, and order-execution benchmarks across CoinDCX and peers.
    whyItMatters: Trading-platform differentiation depends on execution quality, not only listed asset counts.
    diligencePath: Commission a controlled multi-venue execution study using matched instruments, sizes, and time windows.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: Customer cohort, churn, multi-homing, withdrawal, and asset-portability evidence.
    whyItMatters: The durability of a crypto-exchange moat depends on whether users stay when alternatives or incidents arise.
    diligencePath: Request cohort retention, wallet-transfer, support-resolution, and competitor-win/loss data under NDA.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: security
    missingEvidence: >-
      A reconciled incident chronology and independent control assessment covering the 2025 breach and 2026
      deprecated-wallet loss.
    whyItMatters: The gap between initial denial and later loss disclosure is directly relevant to trust and operational resilience.
    diligencePath: Obtain post-incident reports, control attestations, wallet lifecycle logs, and board-level remediation evidence.
    relatedQuestionRefs:
      - QP007
      - QP009
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, restricted cash, monthly burn, runway, debt, treasury exposure and insurance recoveries.
    whyItMatters: >-
      The chapter cannot determine whether CoinDCX can absorb operational losses or fund compliance and growth without
      another financing.
    diligencePath: >-
      Request a management-certified 24-month cash-flow bridge, latest balance sheet, debt schedule and treasury-loss
      reconciliation.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Product-level net revenue, realized take rate, liquidity expense, incentives, CAC, retention and gross margin.
    whyItMatters: High trading volume and user counts may not translate into durable contribution profit.
    diligencePath: Obtain monthly cohort and product P&L schedules for spot, derivatives, staking and SIP products.
    relatedQuestionRefs:
      - QI004
      - QI009
  - type: stale
    severity: material
    topic: revenue
    missingEvidence: A current audited or management-reconciled revenue and valuation update after the 2022 financing references.
    whyItMatters: >-
      The available $141 million revenue and $2.1 billion valuation are historical and may not represent the current
      business.
    diligencePath: Request FY2025/FY2026 revenue, run-rate definitions, valuation terms and latest investor reporting.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: access-blocked
    severity: material
    topic: adverse-evidence
    missingEvidence: >-
      Independent incident report, root-cause analysis and evidence of remediation for the wallet loss and withdrawal
      complaints.
    whyItMatters: >-
      The available adverse evidence is credible but does not quantify total remediation cost, recurrence risk or
      customer attrition.
    diligencePath: >-
      Obtain incident postmortem, affected-account reconciliation, insurer correspondence and customer-retention
      analysis.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Production uptime, latency, crash, order-failure, withdrawal-failure, and incident metrics with defined
      denominators and periods.
    whyItMatters: >-
      Product breadth and claims of speed or scale do not establish execution quality or resilience during market
      stress.
    diligencePath: Request a 24-month SLO and incident pack segmented by product, region, and critical customer workflow.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: blocking
    topic: custody-security
    missingEvidence: >-
      Custody architecture, key-management controls, asset segregation, reconciliation, recovery, and independent
      security-test evidence.
    whyItMatters: The trust boundary protects customer assets; public product descriptions cannot validate control effectiveness.
    diligencePath: >-
      Obtain current SOC/ISO scope, penetration-test executive summaries, custody diagrams, reconciliation attestations,
      and recovery-test results.
    relatedQuestionRefs:
      - QE008
      - QE009
  - type: conflicting-data
    severity: material
    topic: asset-coverage
    missingEvidence: A single dated inventory reconciling the listing's 500+, 1,000+, 300+, and 50,000+ asset or pair counts.
    whyItMatters: >-
      Different denominators may describe different products, and treating them as one inventory would overstate
      breadth.
    diligencePath: >-
      Request a dated product-by-product asset and pair inventory with active-trading, liquidity, and jurisdiction
      flags.
    relatedQuestionRefs:
      - QE001
      - QE002
    relatedTableRefs:
      - TE001
  - type: access-blocked
    severity: minor
    topic: api
    missingEvidence: Complete current API reference with permissions, rate limits, versioning, sandbox, and service-level commitments.
    whyItMatters: >-
      The public repository confirms a documentation surface but not production integration reliability or security
      boundaries.
    diligencePath: >-
      Run an authenticated technical review against a test account and obtain the current API changelog and support
      policy.
    relatedQuestionRefs:
      - QE003
      - QE009
  - type: missing-source
    severity: blocking
    topic: retention
    missingEvidence: >-
      Monthly active traders, funded accounts, cohort retention, GRR/NRR, churn, repeat-trade rates, and revenue
      retention by segment.
    whyItMatters: >-
      Registered-user growth and campaign conversion do not establish durable customer economics or a repeatable revenue
      base.
    diligencePath: >-
      Request monthly cohort tables for the last 24 months linking registration, KYC completion, first funding, first
      trade, repeat trade, churn, and fee revenue.
    relatedQuestionRefs:
      - QU004
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      At least three independently verifiable named customer deployments or references with production status and
      outcomes.
    whyItMatters: >-
      The strongest named proof is a partner-hosted case study, while app ratings and reviews cannot verify production
      outcomes.
    diligencePath: >-
      Obtain customer-reference calls, anonymized account cohorts, and independently verifiable partner or procurement
      records.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
