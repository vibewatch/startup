      - [API, Developers and algorithmic users, "Official public documentation repository and API dashboard", "Programmatic market/account/trading access", "Test authentication, rate limits, permissions, sandbox, and incident handling"]
    notes: "Product availability and counts are primarily company-published app-store claims; API capability is supported by official documentation surface plus a third-party integration article, while the remaining gaps require direct technical diligence."
    claimRefs: [CE001, CE002, CE005, CE006, CE007]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow evidence, Company solution, Measurable benefit or signal, Limitation]
    rows:
