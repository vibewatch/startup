schemaVersion: "report-v2"
artifact: product-tech
slug: coindcx
runDate: 2026-10-26
company:
  name: CoinDCX
chapter:
  number: 5
  title: Product & Technology
  summary: CoinDCX presents a broad, multi-surface crypto trading product spanning mobile/web spot, futures, options, SIPs, INR funding, and an API. Public evidence supports the breadth of the product surface and some developer-facing infrastructure, but not the internal matching, custody, observability, or incident-control architecture needed to underwrite technical resilience.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      The observable product is an integrated crypto trading and investing surface rather than a single
      exchange screen. The Google Play listing describes INR deposits and withdrawals, automated KYC,
      spot trading, futures wallets, cross-margin, options, global futures, crypto SIPs, tax-reporting
      integration, and unified Go/Pro modes. It also claims access to 500+ cryptocurrencies and 300+
      futures pairs, while separately describing 1,000+ curated spot assets and 50,000+ tokens or
      pre-launch tokens. Those counts are company-published app-store claims with different scopes, not
      a reconciled inventory. The customer workflow therefore appears to run from onboarding and KYC
      through funding, order entry, execution, portfolio tracking, and reporting, but the public record
      does not establish how availability, eligibility, or liquidity differs by product, jurisdiction, or
      account tier.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating model and technical evidence
    body: >-
      CoinDCX exposes a developer surface through an official GitHub repository for REST API
      documentation, with instructions to generate API keys through the company API dashboard and to
      read documentation at docs.coindcx.com. A third-party integration article describes the API as
      supporting market data, order execution, account information, WebSockets, and more than 200
      markets, but it is also marketing an alternative integration product and should not be treated as
      independent verification of every capability. A CoinDCX engineering job repost provides a useful
      signal about the problems the team is hiring to solve: large-scale consumer web applications,
      shared frameworks and SDKs, frontend performance, observability, web security, and integration
      across frontend, backend, and platform services. None of these sources disclose the backend
      topology, custody controls, matching-engine design, SLOs, test evidence, or production incident
      metrics.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-dependencies
    title: Maturity, dependencies, and implementation risk
    body: >-
      The product appears mature at the surface layer: the app listing describes multiple trading
      products, high leverage, automated onboarding, charting, order management, and tax integration,
      while the API repository is public and the job specification calls for reusable UI components,
      scalable architecture, security practices, and performance optimization. However, breadth also
      increases dependency exposure. Third-party clone vendors describe the exchange pattern as a
      combination of wallet integration, KYC/AML, matching, liquidity routing, and settlement; those
      descriptions are competitor marketing, not proof of CoinDCX internals, but they identify the
      control points an investor should test. The Trustpilot sample contains complaints about delayed
      withdrawals, unresolved deposit verification, and support responsiveness. These are self-selected
      reviews and do not establish incident frequency, yet they make operational support and funds-access
      workflows material diligence topics alongside the unverified security and reliability controls.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: differentiation-and-gaps
    title: Differentiation, trust controls, and diligence gaps
    body: >-
      The strongest public differentiation signals are product breadth, a stated liquidity aggregation
      model, and a developer-accessible API surface. The job listing also indicates attention to frontend
      security concepts such as CORS, CSP, CSRF, and XSS, but a hiring requirement is not evidence that
      controls are implemented or independently tested. The app listing claims FIU compliance, ISO/IEC
      27001:2022, quarterly proof-of-reserves reporting, and insurance protection; these should be
      verified against certificates, scope statements, report dates, exclusions, and entity coverage.
      Public sources do not establish custody segregation, key-management design, reconciliation
      frequency, withdrawal controls, disaster recovery, uptime, penetration-test results, or roadmap
      delivery. The underwriting conclusion is therefore a capable and broad product surface with
      meaningful evidence gaps around the trust boundary where technical failure becomes customer loss.
    claimRefs: [CE013, CE014, CE015, CE017]
