      - [Trade actively, "Order management, charting, spot, futures, and options are listed", "Unified Go/Pro modes and multiple order types", "Faster access to multiple instruments is claimed", "Execution quality and slippage are not independently measured"]
      - [Manage recurring holdings, "Crypto SIP workflow is listed", "Recurring Bitcoin, Ethereum, and supported-token purchases", "Starting amount stated as ₹100", "Retention, cancellation, and realized economics are unavailable"]
      - [Build an external tool, "Official API repository and API-key dashboard are public", "REST/API integration with market and account functions", "Documentation is publicly accessible", "No public production SLA, sandbox, or version-support policy was found in the assigned evidence"]
      - [File crypto taxes, "Transaction-data import into KoinX is listed", "Tax-reporting integration", "Reduces manual reporting steps by product claim", "Coverage, reconciliation, and customer error handling are not disclosed"]
    notes: "This table separates user jobs from product claims; no conversion, retention, execution, or support KPI is inferred where the sources do not disclose a denominator."
    claimRefs: [CE001, CE002, CE005, CE007, CE009]
  - id: TE003
    title: Technology and operating architecture table
    columns: [Layer or process, Public evidence, Dependency, Principal risk, Required diligence]
    rows:
      - [User surfaces, "Mobile/web app with charting, customizable interface, Go/Pro modes, and order management", "Mobile platforms, browser rendering, frontend services", "Performance or UI defects can affect trading decisions", "Obtain latency, crash, accessibility, and release-quality metrics"]
      - [Developer/API layer, "Official REST API documentation repository; third-party article describes WebSockets and account/order functions", "API keys, documentation, client integrations", "Credential leakage, version drift, or rate-limit failure", "Review scopes, rotation, rate limits, audit logs, and deprecation policy"]
      - [Trading and liquidity, "App claims deep liquidity and fast order execution; job repost cites backend/platform integration", "External liquidity venues and internal execution services", "Slippage, outages, or fragmented liquidity during stress", "Request routing logic, venue concentration, execution-quality reports, and failover tests"]
      - [Identity and compliance, "Automated KYC is listed; clone vendors identify KYC/AML as an exchange control point", "Identity providers, compliance operations, regulators", "Onboarding errors, account restrictions, or regulatory non-compliance", "Verify provider controls, review queues, sanctions logic, and audit evidence"]
      - [Custody and settlement, "App lists wallets and INR/crypto deposits and withdrawals", "Banking rails, blockchain nodes, wallet/key systems", "Withdrawal delay, reconciliation error, or key compromise", "Test segregation, reconciliation, signing policy, recovery, and customer-asset coverage"]
    notes: "The architecture is an evidence-led operating model, not a reconstruction of CoinDCX's undisclosed internal topology; competitor descriptions are used only to define diligence control points."
    claimRefs: [CE006, CE007, CE008, CE010, CE011]
