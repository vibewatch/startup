        - label: Integration and data
          modules:
            - label: REST API
              detail: "Official repository and API dashboard expose a developer-facing documentation surface."
            - label: Real-time updates
              detail: "A third-party integration article describes WebSocket support and real-time market data; independent verification is pending."
        - label: Trading operations
          modules:
            - label: Markets and execution
              detail: "App listing describes spot, futures, options, leverage, order management, and deep liquidity claims."
        - label: Funding and settlement
          modules:
            - label: INR and crypto rails
              detail: "App listing describes INR deposits/withdrawals, crypto wallets, and tax-data integration; internal controls are not disclosed."
        - label: Trust and controls
          modules:
            - label: Security and reserves
              detail: "The app listing claims ISO/IEC 27001:2022, quarterly proof-of-reserves reports, and insurance; scope and test evidence require verification."
    approximationNotes: "The stack is a public-evidence map, not an asserted internal architecture; undisclosed components are intentionally represented as diligence gaps in the accompanying prose and table."
    claimRefs: [CE001, CE005, CE006, CE007, CE010, CE013]
callouts:
  - calloutType: risk
    title: Trust-boundary evidence is incomplete
    body: >-
      CoinDCX publicly exposes a broad product and API surface, but the assigned evidence does not
      establish custody segregation, reconciliation, execution quality, uptime, or independently tested
      security controls. Customer-support and withdrawal complaints in the review sample make those
      operational controls priority diligence items rather than assumptions.
    claimRefs: [CE010, CE011, CE014, CE017]
