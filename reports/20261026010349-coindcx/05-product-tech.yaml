  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: "Production uptime, latency, crash, order-failure, withdrawal-failure, and incident metrics with defined denominators and periods."
      whyItMatters: "Product breadth and claims of speed or scale do not establish execution quality or resilience during market stress."
      diligencePath: "Request a 24-month SLO and incident pack segmented by product, region, and critical customer workflow."
      relatedQuestionRefs: [QE009]
    - type: private-evidence-only
      severity: blocking
      topic: custody-security
      missingEvidence: "Custody architecture, key-management controls, asset segregation, reconciliation, recovery, and independent security-test evidence."
      whyItMatters: "The trust boundary protects customer assets; public product descriptions cannot validate control effectiveness."
      diligencePath: "Obtain current SOC/ISO scope, penetration-test executive summaries, custody diagrams, reconciliation attestations, and recovery-test results."
      relatedQuestionRefs: [QE008, QE009]
    - type: conflicting-data
      severity: material
      topic: asset-coverage
      missingEvidence: "A single dated inventory reconciling the listing's 500+, 1,000+, 300+, and 50,000+ asset or pair counts."
      whyItMatters: "Different denominators may describe different products, and treating them as one inventory would overstate breadth."
      diligencePath: "Request a dated product-by-product asset and pair inventory with active-trading, liquidity, and jurisdiction flags."
      relatedQuestionRefs: [QE001, QE002]
      relatedTableRefs: [TE001]
    - type: access-blocked
      severity: minor
      topic: api
      missingEvidence: "Complete current API reference with permissions, rate limits, versioning, sandbox, and service-level commitments."
      whyItMatters: "The public repository confirms a documentation surface but not production integration reliability or security boundaries."
      diligencePath: "Run an authenticated technical review against a test account and obtain the current API changelog and support policy."
      relatedQuestionRefs: [QE003, QE009]
