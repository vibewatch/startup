callouts:
  - calloutType: strength
    title: Repeated access to institutional capital
    body: >-
      Multiple datasets record successive financings through 2022 and a further
      investment in 2025, with Pantera, Steadview, B Capital, Coinbase, and
      Polychain among the named stakeholders.
    claimRefs: [CO005, CO006, CO007, CO008]
  - calloutType: risk
    title: Growth evidence is offset by custody-control failures
    body: >-
      Two reported losses in 2025 and 2026 raise questions about endpoint
      security, wallet retirement, monitoring, reconciliation, and the equity
      buffer available to absorb future operational losses.
    claimRefs: [CO013, CO014]
  - calloutType: recommendation
    title: Require primary corporate and control records
    body: >-
      Before relying on headline valuation or scale, diligence should reconcile
      the cap table, current financials, user and volume definitions, group
      governance, and independent incident-remediation testing.
    claimRefs: [CO006, CO008, CO009, CO010, CO011, CO013, CO014]
