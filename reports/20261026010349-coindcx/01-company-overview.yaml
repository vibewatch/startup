company:
  name: CoinDCX
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CoinDCX is a Mumbai-headquartered cryptocurrency exchange founded in 2018,
    with a broad retail trading product, substantial venture backing, and
    expansion into the Middle East through BitOasis. Public sources disagree on
    funding and headcount, while two reported custody losses and recurring
    customer complaints make primary governance, financial, and control evidence
    essential to diligence.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      CoinDCX is consistently described as a Mumbai-based cryptocurrency exchange
      founded in 2018. Its consumer app markets spot trading, futures, options,
      crypto SIPs, INR funding, and tax-reporting integration, positioning the
      business as an all-in-one trading and investment platform rather than a
      single-product broker. The Google Play copy is company-issued even though
      it is hosted by Google, so it establishes offered functionality and
      management's current positioning but does not independently verify adoption
      or service quality. Multiples describes a commission-led, privately held
      exchange serving retail and institutional users. Together, the evidence
      supports the exchange model, but it does not disclose the current revenue
      mix across trading commissions, deposit or withdrawal fees, listings, or
      other services.
    claimRefs: [CO001, CO002, CO009, CO010]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Public profiles identify Sumit Gupta as co-founder and CEO and Neeraj
      Khandelwal as co-founder. The assigned evidence does not establish a
      complete current executive roster, board composition, ownership structure,
      or succession plan, so founder-market fit can be described only at the
      level of role continuity rather than independently verified operating
      depth. A listing-services provider says CoinDCX evaluates token applicants
      across business model, technology, team, market position, token utility,
      traction, and financial structure. That supplier-authored description
      indicates the breadth of governance information expected from listed
      projects; it is not evidence that CoinDCX itself publicly meets an
      equivalent disclosure standard. Primary group-structure and board records
      remain necessary.
    claimRefs: [CO003, CO004, CO016]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital, scale, and stakeholders
    body: >-
      CoinDCX has clear access to institutional capital, but the public financing
      record is not internally consistent. FundedIQ reports $228 million across
      three rounds, Lapaas reports $245 million across seven tracked rounds, and
      Multiples and TexAu report $247 million. The April 2022 Series D is reported
      at either $135 million or $136 million depending on the dataset. More recent
      secondary sources place the company at a $2.45 billion post-money valuation
      after an October 2025 investment, but the amount invested is not disclosed
      in the retained evidence. Company-issued app copy claims more than two crore
      Indian users and over ₹2.44 lakh crore in quarterly trading volume, while
      headcount sources diverge sharply. None of these figures should be treated
      as current audited revenue, cash available, or independently verified usage.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-adverse-signals
    title: Milestones and adverse signals
    body: >-
      The operating trajectory runs from a 2018 founding through multiple
      financing rounds, a 2021 unicorn valuation, the 2024 BitOasis acquisition,
      and an October 2025 investment reported at a higher valuation. That growth
      record is counterbalanced by control failures. AInvest reports that a July
      2025 malware incident led to a roughly $44 million loss from an internal
      liquidity wallet, followed in 2026 by a roughly $15.99 million loss after a
      deposit-sweeping control for retired addresses failed. The article says the
      company absorbed the later loss and credited affected users, but this is a
      balance-sheet response rather than independent assurance that custody
      controls were remediated. Archived Trustpilot reviews also repeatedly
      describe withdrawal restrictions, deposit verification delays, and weak
      support; these anecdotes identify diligence themes but cannot measure their
      incidence across the customer base.
    claimRefs: [CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
