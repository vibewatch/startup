  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Vendor-by-vendor win/loss data, renewal rates, and churn reasons against named competitors.
    whyItMatters: Public product pages show scope but do not show who actually wins deals or why.
    diligencePath: Request a 12-quarter win/loss log with competitor names, ACV, and churn causes.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: missing-source
    severity: minor
    topic: valuations
    missingEvidence: Direct, current valuation disclosures for private competitors such as Wellhub, Rippling, Deel, and HiBob.
    whyItMatters: Valuation affects competitor firepower, but several rivals do not disclose it on current official pages.
    diligencePath: Pull verified funding announcements or reputable market-data profiles before citing exact valuations.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized PEPM pricing, bundle discounts, broker commissions, and insurer economics across Betterfly and rivals.
    whyItMatters: Packaging cues are public, but true price competition occurs in negotiated enterprise contracts.
    diligencePath: Request sample contracts, rate cards, and pricing waterfall comparisons by segment.
    relatedQuestionRefs:
    - QP012
    - QP013
    - QP014
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: distribution-dependence
    missingEvidence: Carrier exclusivity terms, broker compensation structures, and channel concentration by country.
    whyItMatters: Distribution power is central to competitive durability, especially against insurers and HR-suite partners.
    diligencePath: Review partner agreements and country-level channel revenue mix.
    relatedQuestionRefs:
    - QP017
    - QP023
  - type: conflicting-data
    severity: minor
    topic: scope-overlap
    missingEvidence: A management-certified feature comparison showing which competitor capabilities are actually used by customers, not only marketed.
    whyItMatters: Official pages overstate breadth for every vendor, so real overlap can differ from brochure overlap.
    diligencePath: Validate capability usage through customer reference calls and platform-utilization data.
    relatedQuestionRefs:
    - QP021
    - QP025
