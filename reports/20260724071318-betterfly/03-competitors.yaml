  rows:
  - - Wellhub (ex-Gympass)
    - Global / wellness network
    - Private; valuation not confirmed in current fetch set
    - Employer wellness marketplace, apps, classes, engagement and usage tracking
    - Betterfly is more insurance-led and links healthy actions directly to protection and rewards.
  - - Buk
    - Chile / LATAM HR-finance suite
    - Private; 10,000+ clients and 2M+ users on official site
    - HR, finance, payroll, benefits, insurance, financial wellbeing
    - Betterfly is narrower in HR scope but deeper in insured engagement and prevention.
  - - Gusto
    - United States / SMB HR-payroll
    - Private; 500,000+ businesses on official product page
    - Payroll, tax, HR, health and financial benefits
    - Betterfly is more behavior-linked and insurance-centric; Gusto is stronger as a core SMB operating system.
  - - Rippling
    - United States / HR-IT-finance platform
    - Private; public valuation not confirmed in current fetch set
    - Benefits administration synced with payroll, HR, and carrier integrations
    - Betterfly has a stronger consumer-wellness and insurance-reward loop; Rippling has stronger system-of-record leverage.
  - - Deel
    - Global / HR-compliance platform
    - Private; public valuation not confirmed in current fetch set
    - Global HR, payroll, compliance, contractor and employee management
    - Betterfly is purpose-built for insured wellbeing rather than global employment infrastructure.
  - - HiBob
    - Global / mid-market HR suite
    - Private; public valuation not confirmed in current fetch set
    - Benefits administration and compensation inside connected HR platform
    - Betterfly is more differentiated on daily health engagement; HiBob is broader in HR workflow.
  - - beqom
    - Global / enterprise total rewards
    - Private; public valuation not confirmed in current fetch set
    - Compensation management, pay equity, total comp platform
    - Betterfly competes on benefits engagement, not enterprise compensation depth.
  - - AXA / Zurich / MetLife
    - Global insurers
    - Public or large-scale incumbent insurance groups
    - Insurance and employee-benefit capacity at global scale
    - Betterfly offers a more app-native engagement model but lacks incumbent underwriting depth.
  - - Minu (pre-acquisition)
    - Mexico / employee financial wellness
    - Raised $50M+ and 2,000 corporate customers per public reporting
    - Financial wellness, earned wage access, telemedicine, benefits
    - Betterfly historically differentiated through insured health engagement; acquisition now internalizes that overlap.
  notes: 'Valuation cells are intentionally conservative: where the reviewed fetch set did not directly verify a current valuation, the table records scale signals or non-disclosure instead of guessing.'
