company:
  name: Betterfly
chapter:
  number: 3
  title: Competitors
  summary: 'Betterfly competes against three different classes of alternatives at once: wellness-first platforms such as Wellhub, generalist HR/payroll suites such as Gusto, Rippling, Deel, Buk, HiBob, and Crehana, and incumbent insurers such as AXA, Zurich, and MetLife. Its sharpest point of differentiation remains the insurance-led engagement loop that turns healthy behavior into richer protection and rewards, but that same hybrid positioning also means Betterfly can be displaced from either side by deeper-capital wellness networks or broader HR suites. The Minu acquisition removed one financial-wellness competitor while also raising the bar on integration execution.'
sections:
- id: landscape-structure
  title: Landscape Structure and Competitive Set
  body: Betterfly does not face one tidy peer group. The closest direct overlap comes from platforms that promise employee wellbeing outcomes and employer ROI, such as Wellhub, because those vendors also sell retention, productivity, and lower healthcare-cost narratives to employers. A second class is broader HR and payroll infrastructure — Deel, Rippling, Gusto, Buk, HiBob, and beqom-adjacent compensation platforms — which may not center insurance-driven behavior change but already sit inside employer workflows and can bolt benefits, compensation, and communications onto existing systems. A third class is incumbent insurance and employee-benefits infrastructure from carriers such as AXA, Zurich, and MetLife, which have much deeper underwriting and distribution capacity but weaker public evidence of daily engagement loops. Minu used to overlap with Betterfly from the financial-wellness side and is now internalized via acquisition. The competitive question is therefore not only “who else
    offers wellness” but “which alternative owns the employer budget, employee relationship, or insurance capacity that Betterfly needs to protect.”
  claimRefs:
