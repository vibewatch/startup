- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat claim
  - Threat vector
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Insurance-led engagement is unique
    - Wellness-only players can copy rewards without carrying insurance complexity
    - Medium
    - Could erode novelty while keeping operations simpler for rivals
    - Validate whether coverage-linked behavior change lifts retention enough to matter.
  - - Broker and carrier channels support distribution
    - Insurers or HR suites can bypass Betterfly with their own digital layers
    - High
    - Partner dependence can become replacement risk
    - Map exclusivity, renewal terms, and carrier economics by market.
  - - Hybrid model spans wellness and protection
    - Generalist HR suites already own payroll and employee records
    - High
    - System-of-record incumbency lowers switching appetite
    - Measure implementation effort and attachment rates versus HR-suite alternatives.
  - - Acquisition of Minu broadens financial wellness
    - Integration failure or product sprawl could weaken focus
    - High
    - Large acquisition changes execution risk and distracts management
    - Request product roadmap, migration plan, and Mexico cross-sell targets.
  - - Regional brand and purpose narrative drive engagement
    - Bigger-capital rivals can outspend Betterfly on go-to-market and content
    - Medium
    - Narrative alone is rarely durable if participation evidence is mixed
    - Demand cohort-level usage and renewal proof versus peers.
  notes: This register focuses on strategic threats rather than cybersecurity or legal risks, which are handled in later chapters.
