- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor
  - Pricing model visible in public sources
  - Packaging cue
  - Known unknowns
  - Implication for Betterfly
  rows:
  - - Betterfly
    - Employer-sponsored platform; detailed public list pricing not disclosed
    - Insurance, preventive health, rewards, and employer analytics bundled
    - Realized PEPM and carrier economics undisclosed
    - Makes apples-to-apples price comparison hard but supports value-based selling.
  - - Wellhub
    - Employees subscribe to monthly plans; companies pay a monthly corporate fee
    - Marketplace-style wellness access layered on employer sponsorship
    - Enterprise pricing and contract structure not fully disclosed on page
    - Wellhub can compete on flexibility and content breadth even without insurance linkage.
  - - Gusto
    - Public benefits admin and health-benefits packaging visible
    - Health and financial benefits sold inside broader HR platform
    - Bundle discounting vs standalone modules undisclosed
    - Generalists can cross-subsidize benefits with payroll or HR products.
  - - Buk
    - Benefits, insurance, and wellbeing modules sold from one HR-finance suite
    - Flexible benefits, insurance, salary advance, discounts, payroll integration
    - Public list pricing not disclosed
    - Buk can attach benefits to an installed HR base in LATAM.
  - - Minu
    - B2B2C employee benefits and financial wellness model
    - 50+ employee benefits including earned wage access and telemedicine
    - Historic pricing not disclosed in fetched source
    - Shows that financial-wellness bundles can compete for the same HR budget.
  notes: Most vendors do not expose realized enterprise pricing publicly, so the comparison focuses on visible packaging and monetization cues rather than invented price points.
