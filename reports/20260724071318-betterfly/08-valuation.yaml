- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Betterfly (2022 round)
    - Reported private valuation
    - ~$1B at Series C
    - Best direct last-round reference
    - Historical peak-market mark, not a current traded price.
  - - Betterfly (public ARR heuristic)
    - 2024 ARR proxy
    - 5x–10x on $72M ARR implies ~$360M–$720M
    - Most direct public anchor available today
    - Depends on one lightly corroborated ARR estimate and ignores cap-table terms.
  - - Wellhub
    - Strategic private comp
    - Current valuation not verified in retained set
    - Closest wellness-budget competitor
    - Public valuation support is incomplete in this run.
  - - Oscar Health
    - Public market cap
    - ~$8.71B market cap (July 2026)
    - Shows public markets still reward scaled health-insurance models
    - Much more regulated and structurally different than Betterfly.
  - - Affirm / PayPal
    - Public market caps
    - ~$23.84B / ~$49.39B market caps (July 2026)
    - Useful only as broad fintech valuation context
    - Too different from Betterfly for direct multiple transfer.
  - - Minu acquisition
    - M&A marker
    - ~$100M reported deal value
    - Shows Betterfly is willing to pay materially for growth assets
    - Applies to acquired target value, not Betterfly equity value.
  notes: This comparable set is intentionally mixed; no one public comp cleanly matches Betterfly’s hybrid employer-benefits model.
