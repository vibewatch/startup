- id: TV005
  title: Thesis-break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak financing event
    - Down-round or punitive preference stack
    - Undermines valuation support and strategic flexibility
    - Pause or reprice the opportunity materially.
  - - Minu integration miss
    - No meaningful cross-sell or retention proof within 12 months
    - Weakens the main upside expansion case
    - Downgrade from research-more to avoid / pass.
  - - Another market retreat
    - Any additional forced country exit from a core market
    - Shows focus did not solve execution fragility
    - Treat as thesis-break.
  - - Privacy or trust incident
    - Confirmed material breach or regulator inquiry
    - Hits customers, sales, and partners at once
    - Escalate diligence or stop.
  - - Margin / retention underperformance
    - Disclosed metrics show weak gross margin or poor NRR
    - Kills premium-multiple hopes
    - Use low-end scenario only.
  notes: These kill triggers convert valuation uncertainty into monitorable events that should clearly move the recommendation.
