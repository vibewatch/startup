company:
  name: Betterfly
chapter:
  number: 8
  title: Valuation
  summary: 'Betterfly should remain a research-more, not a buy. The company still has real strategic assets: a differentiated wellness-plus-insurance narrative, visible customer proof, and the ability to buy Minu in 2026 rather than merely defend itself. But the current public valuation bridge is too incomplete for conviction pricing. The best current top-line anchor is a $72M ARR estimate for 2024, while the last strong private valuation marker is a reported $1B 2022 unicorn round. Simple 5x–10x ARR heuristics imply roughly $360M–$720M, well below the 2022 mark, even before adjusting for concentration, disclosure gaps, and integration risk. That does not produce a precise fair value. It does produce a disciplined stance: Betterfly may still become more valuable, but public evidence today supports medium confidence, high risk, and a likely-below-last-round valuation view until retention, margin, runway, cap-table, and post-Minu integration data are disclosed.'
sections:
- id: valuation-context-and-price-discipline
  title: Valuation Context and Price Discipline
  body: 'Betterfly’s valuation discussion has to start with one tension: the last strong public financing marker is a reported $1B valuation from 2022, while the best current public top-line marker is GetLatka’s $72M ARR estimate for 2024. On their own, those two facts do not settle the question, but they do define the discipline needed. If one applies rough 5x to 10x revenue multiples to the public ARR proxy, the resulting range lands around $360M to $720M, below the 2022 unicorn mark. That does not prove Betterfly is worth less than $1B today because ARR may have changed, margin quality is unknown, and Minu could shift the trajectory. It does prove that investors should not assume the old mark still holds without updated evidence. The right stance is therefore price-sensitive skepticism rather than nostalgia for the peak market.'
