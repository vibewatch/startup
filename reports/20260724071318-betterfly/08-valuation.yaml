- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - ARR by country, product, and customer segment
    - Separates software-like growth from opaque hybrid growth
    - Management reporting package
  - - Gross margin and contribution margin
    - Product and geography margin bridge
    - Defines whether premium multiples are defensible
    - Finance diligence
  - - Retention and expansion
    - NRR, GRR, contract length, attach rates, cohort usage
    - Tests durability and wallet-share thesis
    - Customer diligence + data room
  - - Runway and financing terms
    - Cash, burn, debt, preference stack, board plan
    - Needed to assess dilution and downside risk
    - Board / finance diligence
  - - Minu integration scorecard
    - Cross-sell, retention, and timeline KPIs
    - Core swing factor in the current thesis
    - Post-close integration review
  - - Reference quality
    - Named customers outside Spain, especially Chile / Mexico / U.S.
    - Improves confidence that public proof is representative
    - Commercial diligence
  notes: These asks are the minimum set required to move from narrative confidence to pricing confidence.
