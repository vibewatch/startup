- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR grows beyond the 2024 proxy, Minu cross-sell works, and concentration eases
    - Value could move toward upper-end software / hybrid multiples and narrow the gap to the last round
    - Integration still has to work and disclosure must improve
    - Possible but not yet publicly proven
  - - Base
    - Betterfly remains scaled but disclosure stays mixed and integration is incremental
    - Valuation stays below the 2022 mark and near mid-range hybrid multiples
    - Opaque margin and retention keep investors cautious
    - Most plausible from current public evidence
  - - Bear
    - Integration drags, concentration bites, or financing weakens
    - Valuation compresses toward low-end revenue multiples or distressed private terms
    - Another retreat or down-round changes the story sharply
    - Material risk and not hard to imagine from today’s data
  notes: The scenarios are directional because Betterfly does not publish enough operating data for precise DCF-style underwriting.
