- id: retention-durability-and-concentration
  title: Retention, Durability, and Concentration
  body: 'Public durability evidence is much thinner than existence proof. No retained source in this run discloses NRR, gross retention, logo churn, contract length, or cohort behavior. That matters because Betterfly’s model likely depends on repeated employee activation and continued employer sponsorship, not just initial sign-up. The 2025 restructuring makes concentration questions more urgent: Startups Latam and Forbes Chile both say Chile, Mexico, and Spain generate 94% of revenue, meaning geography may matter as much as individual customer concentration. The same move also implies that publicly visible customer breadth across Latin America is narrower than the company’s earlier expansion narrative suggested. In practical terms, the current public file supports the existence of a real customer base, but not a durable proof pack for renewal behavior. The case-study set is also skewed toward Spain, so it cannot stand in for the entire business. Until those metrics are supplied, renewal
    quality must be treated as an open diligence question rather than an evidenced strength.'
  claimRefs:
  - CU018
  - CU019
  - CU022
  - CU023
  - CU027
  - CU028
  - CU031
  - CU033
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-path-and-underwriting-verdict
  title: Expansion Path and Underwriting Verdict
  body: 'The main expansion story is visible, but only at a high level. Betterfly lands with HR or benefits buyers, tries to create employee engagement through the app, and can theoretically expand wallet share through more modules, deeper usage, and now financial-wellness capability from Minu. The employer-admin onboarding step also makes the product more embedded than a pure consumer app because activation depends on roster setup and internal sponsorship. At the same time, the public file remains weak on the precise evidence investors would want most: customer concentration by logo, contract duration, penetration inside employer accounts, and quantified cross-sell. The underwriting verdict is therefore balanced. Betterfly has credible named-customer proof and a plausible land-and-expand motion, but public evidence still falls short of demonstrating durable retention or low concentration risk with confidence. Spain-specific health-insurance and flexible-compensation pages also imply that
    Betterfly can broaden the employer relationship beyond one narrow perk, but they still do not show how many customers actually adopt multiple modules in production. The public expansion logic is therefore believable, yet still substantially under-measured.'
