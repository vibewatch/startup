- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - More modules per employer
    - No public wallet-share or attach-rate data
    - Could overstate expansion opportunity
    - Request product-attachment and upsell metrics by account.
  - - Minu acquisition in Mexico
    - Integration may not translate into retained employer expansion
    - Can turn growth story into execution risk
    - Request cross-sell pipeline and post-close retention tracking.
  - - Geographic focus on three revenue markets
    - Customer health may be overexposed to a narrow country set
    - Country shocks could hit revenue disproportionately
    - Request revenue and customer counts by market.
  - - Admin-led onboarding
    - Activation may depend on employer data quality and internal championing
    - Weak setup can limit realized employee usage
    - Request activation funnel by customer cohort.
  - - Named customer proof concentrated in Spain
    - Public proof quality may not reflect rest of business
    - Overstates confidence in broader customer base
    - Request named references from Chile, Mexico, Brazil, and the U.S.
  notes: This table focuses on how Betterfly could expand inside accounts while still carrying concentration risk at the logo, market, and deployment levels.
