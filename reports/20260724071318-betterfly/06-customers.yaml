runDate: '2026-07-24'
company:
  name: Betterfly
chapter:
  number: 6
  title: Customers
  summary: 'Betterfly has credible customer existence proof but incomplete public durability proof. Official surfaces make the B2B2C structure clear: employers buy, employees use, and mobile engagement is central to the value proposition. Named customer evidence is strongest in Betterfly Spain case studies, where Education First, Vorwerk, and Alain Afflelou appear as real production-style references. The 2026 Minu acquisition also added reported scale in Mexico through 2,000+ enterprise clients and one million users. However, public sources do not disclose NRR, GRR, contract length, churn, or customer concentration by logo. The 2025 restructuring further raises concentration risk because Chile, Mexico, and Spain reportedly generate 94% of revenue. The result is a balanced verdict: Betterfly’s customer base is real and strategically expandable, but public evidence is still too thin to prove durability with confidence.'
sections:
- id: buyer-user-and-segment-structure
  title: Buyer, User, and Segment Structure
  body: 'Betterfly’s customer model is straightforward in concept but important in underwriting terms: employers buy, employees use, and the product’s value is supposed to compound through repeated engagement. Official pages sell Betterfly to HR and benefits buyers on retention, wellbeing, and ROI, while employee-facing pages center healthy habits, rewards, and coverage. That means Betterfly is not just selling an insurance plan or a wellness perk; it is trying to insert itself into the employer-to-employee relationship as an always-on benefits layer. Public sources also suggest that the use cases can vary by market. Mexico-specific NOM-035 positioning broadens the employer reason to buy beyond generic wellness, while the Minu acquisition expands the product toward financial wellbeing. The segmentation logic is therefore B2B2C by structure, with country-specific modules widening the buyer rationale and potentially increasing wallet share over time.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU016
  - CU017
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  - FU002
- id: named-customer-proof-and-adoption-signals
  title: Named Customer Proof and Adoption Signals
  body: 'The strongest direct adoption evidence in the fetched set comes from Betterfly’s own case-study library in Spain. Education First, Vorwerk, and Alain Afflelou are each presented as real customers using Betterfly to manage flexible-compensation or benefits workflows, which is materially stronger than vague logo walls. Those case studies show production-style deployment language and named operating contexts, especially around simplification, personalization, and centralized management. Still, they remain vendor-authored. They do not provide independent confirmation of long-term retention or quantified ROI. Outside those case studies, the public source set is more directional: app-store listings confirm there is a live end-user product, while the Minu acquisition adds reported client and user volume. Together, these sources establish that Betterfly has real customers and active distribution, but not yet that those customers are deeply retained across all markets.'
