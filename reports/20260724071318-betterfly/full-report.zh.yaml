      - number: '1.4'
        title: 规模、里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              Betterfly 的里程碑有正反两面。利好一面，公司 2018 年从 Burn To Give 起步，转成福利与保险平台；成为独角兽前会员数接近 100 万；借助保险公司合作进入多个拉美市场；2024 年初达到
              100 万付费用户；2026 年收购 Minu，加深财务健康能力和墨西哥分销。官方雇主页现在称企业客户超过 2,000 家；2022、2023 年 Forbes 和媒体访谈则根据地域和时期提到超过 2,500
              家、后来超过 5,000 家客户公司。反面是，Betterfly 在 2022 年调整期已显出压力，Contxto 报道其在巴西和智利裁员；到 2025 年，战略收缩更明确，公司停止五个拉美国家业务，并称 94%
              收入集中在智利、墨西哥和西班牙。这一序列重要，因为它把 Betterfly 从单纯的高增长赢家，重新定义为一家已经不得不激进重配资本的公司。因此，2026 年收购 Minu
              在战略上积极，但也应被解读为一次高风险押注：通过 M&A，而不是单靠有机重启，在墨西哥重建可持续规模。
