              提供了公开市场参照：有规模的健康保险或金融科技相邻平台可以撑起很大的市值，但它们的结构都不同于 Betterfly。因此，Betterfly 既不能按直接保险公司估值，也不是纯 SaaS
              平台，更不是支付公司。公司在墨西哥和智利的营销足迹显示，它仍在投入 GTM，也说明 Betterfly
              不是在进入收缩清盘状态。但退出准备度仍取决于它能否拿出比当前公开材料更干净的留存、利润率和股权结构清晰度。投资人可以勾勒这个机会，却无法只靠公开证据自信地补上估值桥。换句话说，这里的可比公司是护栏，不是自动驾驶。它们帮人看清
              Betterfly 不是什么；这一点，几乎和猜它会变成什么一样重要。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV025
              - CV026
              - CV027
              - CV028
              - CV036
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV017
              - CV018
              - CV019
              - CV020
              - CV037
          - type: table
            tableRef: TV005
            claimRefs:
              - CV013
              - CV031
              - CV035
              - CV039
              - CV040
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV023
              - CV024
              - CV029
              - CV031
              - CV032
              - CV039
      - number: '8.4'
        title: 投资建议与尽调闸门
        blocks:
          - type: paragraph
            body: >-
              因此，建议是继续研究，置信度中等，风险评级高。这不是骑墙，而是面对一家仍有真实战略上行、但公开披露不足以支撑高确信定价的公司时，最诚实的回应。Betterfly
              已有足够证据证明产品真实、客户存在，也具备战略能动性，值得留在投资人名单上。但它披露的经济性、股权结构可见度和整合证据还不够，无法在条款未知时支持买入判断。估值立场因此应是：「大概率低于 2022
              年那一轮，但仍不透明。」什么会改变判断？更清晰的 Minu 之后
              KPI、按国家拆分的客户留存数据、毛利率证据、跑道透明度，以及优先权结构可见度。没有这些信息时，假精确带来的下行风险，大于激进热情带来的上行收益。换一种说法，Betterfly
              已经赢得了严肃尽调的资格，但还没有赢得估值自满的资格。两者之间的落差，正是投资人在私人成长期轮次里最容易犯下昂贵错误的地方。
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV021
              - CV022
              - CV036
              - CV040
      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 继续研究是价格纪律判断，不是否定公司质量
            body: Betterfly 仍有足够战略含量，值得留在名单上，但公开证据不足以支持在条款未知时作出高确信买入。
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV029
              - CV030
              - CV039
          - type: callout
            title: 最大估值陷阱，是锚定 2022 年
            body: 最容易犯的错，是把 2022 年独角兽标记当成当前事实，而不是一个现在必须重新承保的历史参照点。
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV033
              - CV038
