      - number: '2.2'
        title: 规模测算视角与地理相关性
        blocks:
          - type: paragraph
            body: >-
              这里审阅的公开市场数据支持“市场大，但方法敏感”，而不是一个标准 TAM。Grand View Research、Fortune Business Insights、Mordor Intelligence 和
              Global Wellness Institute
              都把雇主健康福利和更广义健康经济支出描述为数十亿美元级、且中期增长为正的品类。这些估算差异很大，因为发布者方法纳入的服务和地域不同；但它们指向同一战略方向：雇主承压，需要在预防、参与和员工健康支持上花更多钱，即使预算分散在
              HR、福利和保险之间。Betterfly 自身商业现实更受限。2025 年收缩报道称，94% 收入来自智利、墨西哥和西班牙；2026 年 Minu
              收购和美国扩张表态显示，管理层正集中在更少、更大的市场，而不是铺满整个区域。这意味着 Betterfly 的有效 SAM 集中在少数市场的正规雇主和经纪—保险生态里，而不是全部全球健康福利支出。
