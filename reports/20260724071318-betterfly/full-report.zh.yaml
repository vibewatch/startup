            body: >-
              财务结论因此偏谨慎。Betterfly 看起来有真实业务：雇主客户、员工使用，以及足够战略可信度，可以收购
              Minu，而不是只谈扩张。但当前公开证据更擅长证明战略意图，而不是证明经济性。报告可以较有把握地说，Betterfly 运行混合 SaaS + 保险模式，2025 年缩小地理足迹，2026 年又用 M&A
              加深墨西哥和财务健康。但它还不能说明毛利率是多少，经常性收入中软件与保障相关部分各占多少，客户分群是否耐久，或扩张和收购支出之后现金跑道还剩多少。对投资判断来说，这些缺失数字不是装饰；它们是形成收入质量、资本充足性和估值韧性确信的主要阻断项。公开资料尤其难把增长叙事和会计现实对齐：本次抓取没有审计收入分拆、没有贡献利润率桥、也没有董事会层面的现金跑道披露。这些缺口足够大，使本章应保持尽调阻断姿态，而不是进入可投资判断状态。
