      - number: '3.4'
        title: Betterfly 的相对位置与耐久性
        blocks:
          - type: paragraph
            body: >-
              相对整个竞争场，Betterfly 的核心差异化在概念上仍然强：更健康的行为会转化为有形保险价值、公益捐赠和奖励，而不只是 App 内容或 HR
              管理。这比通用福利市场更能触动情绪，也比传统保险组合更贴近行为。但护城河比品类故事暗示的更窄。Wellhub 可以在网络广度和健康内容上包抄 Betterfly。HR
              套件可以在嵌入式工作流和管理重力上包抄它。保险公司可以在产品宽度和受监管能力上包抄它。Minu 收购通过加入财务健康和墨西哥客户触达，改善了 Betterfly 的牌面；但它也改变了证明责任：Betterfly
              现在必须证明，自己能整合收购能力，同时仍与通用福利平台保持差异。竞争耐久性因此更少取决于口号，更多取决于 Betterfly 能否让其保险化参与模式，在可衡量结果上优于从 Wellhub 买健康福利、从 HR
              套件买管理、从保险公司或经纪人买保障。
