  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >-
              Betterfly 横跨几个相邻支出池，因此尽调第一步是界定它到底在哪个市场。官方页面把产品定位为雇主付费平台，打包保险、预防健康服务、日常参与、HR
              分析和奖励。因此，最相关边界不是孤立的纯数字保险、纯健身福利或纯 HR
              软件。最接近可投资口径的边界，是雇主赞助的健康与福利运营支出：企业用来改善身心健康、留存、理赔或成本结果的软件、服务、内容和保险公司挂钩产品。多家市场报告发布者估算了庞大的全球企业健康福利市场，但数字不能直接比较，因为有的纳入筛查、教练、EAP、健身、分析或保险挂钩服务，有的只看软件或项目。对
              Betterfly 来说，有用结论是品类相邻性，而不是虚假精确。公司参与广义健康福利 TAM、较窄的雇主赞助预防健康和自愿福利 SAM，以及更窄的逐国
              SOM；后者由保险合作、经纪渠道和雇主部署行为挂钩福利的意愿决定。
