      - number: '3.2'
        title: 能力与工作流对比
        blocks:
          - type: paragraph
            body: >-
              官方竞品页面说明，Betterfly 的混合模式有防守性，但并非无懈可击。Wellhub 强调广泛的身心健康网络、应用市场和全公司参与，收费来自雇主费用加员工订阅。Rippling、Gusto、HiBob 和
              Buk 强调与薪资、员工记录和合规同步的福利管理；这些平台活在系统记录层，能降低切换成本，因此优势不同但很强。Deel 覆盖更广，聚焦全球 HR、薪资和合规，而不是专门的健康参与体验。beqom
              及相关薪酬工具从总回报角度竞争，帮助 HR 和财务团队决定薪酬和激励，即便没有复制 Betterfly 的保险化参与机制。Betterfly
              当前优势在于把保险、预防健康提醒、奖励和雇主分析融合成一个叙事；当前弱点是，许多相邻对手已经控制薪资工作流、HR 数据层或消费者健康福利目录中的一个。
