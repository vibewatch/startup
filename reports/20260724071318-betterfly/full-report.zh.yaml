  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局结构与竞争集合
        blocks:
          - type: paragraph
            body: >-
              Betterfly 面对的不是一个整齐的同类群。最直接重叠来自承诺员工身心健康结果和雇主 ROI 的平台，例如 Wellhub，因为这些供应商也向雇主销售留存、生产率和降低医疗成本的叙事。第二类是更广义 HR
              和薪资基础设施——Deel、Rippling、Gusto、Buk、HiBob 以及与 beqom
              相邻的薪酬平台。它们未必以保险驱动的行为改变为核心，但已经嵌在雇主工作流里，可以把福利、薪酬和沟通接到现有系统上。第三类是 AXA、Zurich、MetLife
              等保险公司已有的保险和员工福利基础设施，承保和分销能力深得多，但公开证据中每日参与闭环较弱。Minu 曾从财务健康侧与 Betterfly
              重叠，现在通过收购被内部化。因此，竞争问题不只是“谁也提供健康福利”，而是“哪种替代方案掌握了 Betterfly 需要守住的雇主预算、员工关系或保险能力”。
