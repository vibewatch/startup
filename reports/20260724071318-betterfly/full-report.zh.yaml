              SaaS；又因为 Betterfly
              并不把自己呈现为主要风险承担方，毛利率应高于全栈保险公司。这意味着合作伙伴条款、经纪人经济性和附着率，可能决定大部分盈利能力。问题是，关键数字——CAC、回本周期、NRR、logo
              流失、使用率、赔付率或按产品拆分的毛利率——在审阅资料中都不公开。因此，本阶段财务尽调仍更偏定性，而不是定量。
