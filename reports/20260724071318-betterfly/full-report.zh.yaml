      - CE006
      - CE007
      - CE015
      - CE016
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 一个可见的 Betterfly 部署流程，从雇主采购开始，进入员工导入、App 互动、奖励，最后回到续约所需的雇主价值。
    data:
      nodes:
        - id: a1
          label: 雇主购买 Betterfly
          description: HR 或福利买方采购平台，目标是留存、ROI 和员工身心健康。
        - id: a2
          label: 管理员添加协作者
          description: 客户门户流程把员工导入系统。
        - id: a3
          label: 员工下载 App
          description: 用户在 iPhone 或 Android 上安装 Betterfly，并在一个入口使用福利。
        - id: a4
          label: 员工完成健康行动
          description: 步数、饮水、睡眠等行动进入奖励循环跟踪。
        - id: a5
          label: 奖励、保障和影响力更新
          description: 健康行动推动福利、保障变化和捐赠。
        - id: a6
          label: 雇主感知价值
          description: 使用情况和身心健康结果支撑续约和持续采购。
      edges:
        - from: a1
          to: a2
        - from: a2
          to: a3
        - from: a3
          to: a4
        - from: a4
          to: a5
        - from: a5
          to: a6
    claimRefs:
      - CE002
      - CE004
      - CE007
      - CE008
      - CE019
      - CE033
      - CE034
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 除自有 App 设计外，Betterfly 还依赖移动平台、雇主数据配置、保险伙伴和本地合规触点。
    data:
      nodes:
        - id: d1
          label: Betterfly 产品层
          description: 员工 App 加面向雇主的运营界面
        - id: d2
          label: Apple / App Store
          type: distribution
          risk: iOS 分发和更新审核影响一个主要使用渠道。
        - id: d3
          label: Google Play / Android
          type: distribution
          risk: Android 分发和应用商店政策变化影响第二个主要移动渠道。
        - id: d4
          label: 雇主名册 / 管理数据
          type: customer-data
          risk: 员工数据质量差，会卡住激活和奖励映射。
        - id: d5
          label: 保险伙伴
          type: partner
          risk: 保障设计和市场可得性依赖外部保险公司或经纪商。
        - id: d6
          label: 本地合规模块
          type: regulatory
          risk: 各国要求会增加路线图和支持负担。
        - id: d7
          label: 隐私和信任控制
          type: governance
          risk: 使用敏感数据，使信任要求高于普通健康 App。
      edges:
        - from: d1
          to: d2
          label: iOS 分发
        - from: d1
          to: d3
          label: Android 分发
        - from: d4
          to: d1
          label: 员工导入数据
        - from: d5
          to: d1
          label: 保障层
        - from: d6
          to: d1
          label: 本地化功能
        - from: d7
          to: d1
          label: 数据治理要求
    claimRefs:
      - CE007
      - CE015
      - CE027
      - CE029
      - CE032
      - CE034
      - CE035
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 核心 App 循环已经商业化的公开证据最强，运营工作流深度证据中等，技术披露证据较弱。
    data:
      columns:
        - 成熟度
        - 证据基础
        - 主要缺口
      rows:
        - label: 员工移动 App
          values:
            - 高
            - 官方 App 页面，以及 Apple 和 Google 仍在线的商店列表
            - 没有公开 MAU、崩溃率或发布质量指标
        - label: 保险联动福利循环
          values:
            - 高
            - 雇主、员工、保险和影响力页面的核心叙事一致
            - 没有公开理赔流程或承保方范围资料包
        - label: 雇主导入 / 管理工作流
          values:
            - 中
            - 客户门户证明激活路径存在
            - 没有详细管理文档或集成矩阵
        - label: 本地化市场模块
          values:
            - 中
            - 墨西哥 NOM-035 页面显示按国家适配
            - 没有公开地图说明各市场有哪些模块
        - label: 信任 / 质量控制
          values:
            - 中
            - 隐私政策，以及 ISO 和管理政策页面
            - 没有运行时可靠性证据，也没有深入的信任中心
        - label: 技术架构披露
          values:
            - 中低
            - 公开文件只提示工作流层级
            - 没有具名技术栈、API 目录或详细系统图
    claimRefs:
      - CE011
      - CE016
      - CE018
      - CE019
      - CE025
      - CE026
      - CE036
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 可见的 Betterfly 旅程从雇主采购发起，经过管理员导入和 App 激活，目标是以重复使用和更多模块采用收尾。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU029
      - CU030
    data:
      items:
        - label: 雇主需求明确
          detail: HR 或福利买方需要参与度、留存、身心健康或合规支持。
        - label: 选定平台
          detail: 雇主把 Betterfly 作为福利层采购。
        - label: 管理员导入
          detail: 客户管理员把协作者添加到门户。
        - label: 员工激活
          detail: 员工下载 App 并使用奖励 / 福利。
        - label: 习惯使用与价值感知
          detail: 持续使用 App 应当支撑续约和扩张。
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据从宽泛的雇主营销逐步收窄到更小的一组已激活员工、案例研究和扩张信号。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU024
      - CU028
    data:
      nodes:
        - id: f1
          label: 雇主潜在客户
          description: 福利买方看到 Betterfly 的价值主张。
        - id: f2
          label: 雇主客户
          description: 公司为员工采购 Betterfly。
        - id: f3
          label: 员工已添加
          description: 管理员上传员工，或把协作者添加到门户。
        - id: f4
          label: App 已激活
          description: 员工在 iOS 或 Android 上下载 Betterfly。
        - id: f5
          label: 使用与扩张
          description: 参与度和额外模块决定留存和钱包份额。
      edges:
        - from: f1
          to: f2
          label: 销售
        - from: f2
          to: f3
          label: 配置
        - from: f3
          to: f4
          label: 激活
        - from: f4
          to: f5
          label: 重复使用
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 西班牙案例研究的证据质量最强，应用商店分发证据中等，留存可见性较弱。
    claimRefs:
      - CU007
      - CU008
      - CU012
      - CU013
      - CU015
      - CU022
      - CU025
      - CU026
      - CU027
    data:
      columns:
        - 具名证据
        - 结果具体性
        - 独立性
        - 留存可见性
        - 时效性
      rows:
        - label: 西班牙案例研究
          values:
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 中低
              tone: warning
            - label: 低
              tone: warning
            - label: 高
              tone: positive
        - label: 应用商店产品证据
          values:
            - label: 低
              tone: warning
            - label: 低
              tone: warning
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 高
              tone: positive
        - label: 被收购 Minu 的规模说法
          values:
            - label: 中
              tone: neutral
            - label: 中低
              tone: neutral
            - label: 中低
              tone: warning
            - label: 低
              tone: warning
            - label: 高
              tone: positive
  - id: FU004
    title: 留存 / 重复使用队列
    type: cohort
    layout: wide
    summary: 这个示意性队列视图标出 Betterfly 公开证据最薄弱的地方：长期留存和重复使用。
    approximationNotes: 这些百分比只是方向性示意，用来区分不同动作可能带来的相对粘性，并非 Betterfly 披露指标。依据是本章判断：员工使用循环应比一次性激活更有粘性，但公开资料尚未验证。
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU035
    data:
      columns:
        - 第 1 个月
        - 第 3 个月
        - 第 6 个月
        - 第 12 个月
      rows:
