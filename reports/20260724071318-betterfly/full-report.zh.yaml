      - number: '3.3'
        title: 分销、切换成本与既有玩家力量
        blocks:
          - type: paragraph
            body: >-
              对 Betterfly 最大的竞争危险，可能不是长得像的创业公司，而是更大 HR 套件和既有保险公司的分销权力。Rippling 和 Gusto 明确在薪资和核心 HR 里销售福利。Buk 为五个国家超过
              10,000 家客户、超过 200 万用户集中管理 HR 和财务，拥有强大的装机基础，可顺势上销售福利。HiBob 和 beqom 把福利和薪酬放进 HR
              与财务的一体化平台；这很重要，因为雇主买方通常偏好更少供应商。保险侧，AXA 和 Zurich 展示了规模、全球客户触达和长期员工福利能力。上述既有玩家可能缺少 Betterfly
              公开讲述的游戏化和参与故事，但它们不必复制整个产品，也能压迫价格或分销。因此，Betterfly 必须证明，保险驱动的参与闭环能创造足够的参与和留存价值，足以占据一个独立品类位置，而不是被更广的 HR
