figures:
  - id: FO001
    title: Betterfly 里程碑时间线
    type: timeline
    layout: wide
    summary: 公开里程碑勾勒出一条陡峭轨迹：从使命驱动的创立，到独角兽融资，再到收缩和靠收购重新扩张。
    data:
      items:
        - label: 以 Burn To Give 名义创立
          detail: della Maggiora 兄弟推出使命驱动的健康与捐赠概念。
          date: '2018'
          tone: positive
        - label: 更名为 Betterfly
          detail: 模式扩展到保险科技和雇主付费福利。
          date: '2019'
          tone: positive
        - label: A 轮
          detail: QED 支持的 US$9M 融资支撑机构化扩张。
          date: '2020'
          tone: positive
        - label: B 轮
          detail: US$60M 融资带来拉美扩张所需的大额增长资本。
          date: '2021'
          tone: positive
