        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Betterfly 的风险画像从监管和隐私开始。公司销售保险相邻的员工福利，跨多国运营，并使用会呈现健康相关行为数据的移动 App。这样的组合让法律和监管风险成为结构性问题，而不是偶发事项。公开材料显示
              Betterfly 意识到这项负担：它发布隐私政策，提及 ISO 取向的信息安全和质量体系，并在墨西哥提供国家特定 NOM-035
              模块。不过，公开资料偏描述，而非定论。它没有说明每个市场由哪个实体承担受监管保险风险、是否有任何监管方审阅过该模式，或隐私控制在运营中如何执行。主要法律结论因此是混合的：Betterfly
              看起来有合规意识，但最影响投资判断的监管细节仍是私下或间接信息。至少目前如此。
