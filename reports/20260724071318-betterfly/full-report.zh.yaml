            body: >-
              Betterfly 的公开材料描述的是混合雇主福利平台，而不是狭窄软件小工具。雇主购买的套装围绕员工身心健康、降低医疗成本、更好留存和可衡量 ROI；员工则通过 App
              里的日常任务、奖励和保险挂钩保障互动。这个框架强烈指向两层变现：经常性雇主平台收入，以及通过保险伙伴交付保障栈带来的经济性。公开资料没有显示两层如何拆分。没有披露价目表、实际
              PEPM、佣金率或收入确认讨论。本次抓取中唯一明确的当前收入信号，是 GetLatka 对 2024 年 $72M ARR 的估算；它可作为方向性标记，但不足以单独支撑投资判断。简言之，Betterfly
              看起来规模已足够重要，但活动如何转化为报表收入，具体机制仍不透明。
