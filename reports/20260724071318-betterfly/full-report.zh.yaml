      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              审阅资料把买方地图勾得异常清楚。Betterfly 官方页面反复瞄准雇主、HR 团队和经纪人，而不是消费者。雇主是主要付款方，因为他们配置福利，并希望在留存、参与、理赔或医疗成本趋势上看到可衡量
              ROI。员工是用户，但采用取决于消费级体验：上手简单、保障可见、有激励、健康建议相关。经纪人和保险公司是渠道放大器；Betterfly 明确销售经纪人门户，历史上也依靠 Chubb、Icatu
              等承保方支持国家扩张和保险广度。分层逻辑还随公司规模变化。Forbes Mexico 报道称 Betterfly 明确同时瞄准 SME
              和大型企业；更新的美国雇主营销则强调企业客户和可衡量参与证明。因此，实际采用路径是带渠道支持的 B2B2C：雇主或经纪人先证明预算合理，随后员工群体必须反复参与，经济性和续约故事才跑得通。
