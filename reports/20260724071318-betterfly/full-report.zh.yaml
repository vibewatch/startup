      - number: '1.3'
        title: 资本基础与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Betterfly 的资本故事是一轮快速抬升。审阅资料支持一条融资线：2020 年由 QED Investors 领投 Series A；2021 年 $60M Series B，DST
              Global、QED、Valor Capital、Endeavor Catalyst、SoftBank Latin America Fund 等参与；2022 年 Series C 把 Betterfly
              推入独角兽行列。不同资料对 Series C 规模和累计融资额说法不一：Refresh Miami、Contxto、Forbes Mexico 和 Life Insurance International 等
              2022 年独立报道写的是 $125M Series C、估值 $1B；用户提供背景和部分二级资料则把这次跃升描述为约 $60M 融资、估值超过
              $1B。更稳妥的公开结论不是在单一数字上制造虚假精确，而是看时间线：Betterfly 2022 年初达到独角兽状态，吸引知名成长资本，并带着智利创业史上最强之一的资产负债表进入 2022
              年后的下行周期。利益相关方的宽度同样重要。QED、DST、Glade Brook、Greycroft、Lightrock、SoftBank Latin America Fund、Chubb、Icatu 以及后来的
              Minu，都出现在可见的融资和分销图谱里，说明 Betterfly 的股东表和合作伙伴网络横跨风险资本与保险分销网络。2026 年 Minu 交易进一步说明，Betterfly
              仍有足够火力去买增长，而不只是防守现金跑道。
