      - number: '2.4'
        title: 增长驱动、约束与采用时点
        blocks:
          - type: paragraph
            body: >-
              需求驱动是真实的。WHO 和 ILO 都指出心理健康和职场健康负担，让预防与支持具备经济相关性；Gallup 和 Mercer 突出员工参与压力和福利计划使用不足；Betterfly
              自身雇主材料则从商业角度描述同一问题：大多数员工在投保登记和理赔事件之间会忽视福利。这些动态支撑对日常参与系统的需求，因为它能让福利变得可感知。但约束同样重要。雇主仍面对预算压力、健康数据隐私顾虑、ROI
              证明怀疑、福利疲劳和实施摩擦。因此，Betterfly 2025 年市场撤退具有分析价值：品类可能有吸引力，但一次性跨多国扩张在运营和经济性上都很难。市场不只是“大”；只有 Betterfly
              能把雇主预算、保险公司伙伴、本地合规和持续员工参与对齐时，市场才有吸引力。这指向比公司 2021–2022 年扩张营销更窄、更克制的商业化策略。
