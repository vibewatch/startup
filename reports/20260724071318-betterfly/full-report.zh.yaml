chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Betterfly 目前的公开定位比泛泛的“健康 App”具体得多。英文官网、雇主页、员工页和 LinkedIn 公司档案都把 Betterfly
              描述为基于保险的员工福利平台，而不是简单的福利集市。雇主为员工购买访问权；员工从第一天起获得保证承保或简化核保的保障，以及预防健康服务和奖励；平台用积分、挑战和更健康的日常行为把续保周期之间的使用频率拉起来。产品组合反复把保险、预防健康服务、行为参与和社会影响奖励放在一起，因此
              Betterfly 更适合被看作保险科技驱动的 B2B2C 员工福利操作系统。公司材料也声称覆盖广、规模大，但口径存在张力：关于我们页面仍称 Betterfly
              覆盖八个国家，是拉美领先的保障和福利平台；LinkedIn 现在把 Miami 列为总部，美国官网则强调美国商业化推进。最清晰的综合判断是：Betterfly 创立于智利，最早在 Santiago
              建立运营底盘；到 2026 年，公司公开管理口径已是多市场平台，Miami 是美国扩张的门面，而不是一家纯智利运营商。
