            body: >-
              Betterfly 的客户模式概念上直接，但对投资判断很重要：雇主购买，员工使用，产品价值应通过反复参与持续复合。官方页面向 HR 和福利买方销售留存、身心健康和
              ROI；面向员工的页面则聚焦健康习惯、奖励和保障。因此，Betterfly 卖的不只是一个保险计划或健康福利；它试图把自己嵌入雇主与员工之间，成为常开型福利层。公开来源也显示，使用场景会因市场而异。墨西哥特定的
              NOM-035 定位，把雇主购买理由从通用健康福利扩展出去；Minu 收购则把产品推向财务健康。因此，分层逻辑在结构上是 B2B2C；逐国模块扩大买方理由，并可能随时间提升钱包份额。
