      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              本次审阅的公开资料以创始人为中心。独立媒体报道和 Forbes Mexico 访谈多次称 Betterfly 由 Eduardo 和 Cristóbal della Maggiora 创立，Eduardo
              长期担任 CEO，也是主要公开发言人。融资、Chubb 合作和扩张报道中，出面发声的是
              Eduardo；裁员和重组的公开回应，则更多来自人才与文化负责人或创始人访谈，而不是一个对外可见的董事会结构。正式治理披露薄得多。审阅到的官方、媒体和档案资料，没有任何一项完整列出董事会名单、控制权安排或清算优先权细节。这不能证明治理薄弱，但意味着外部投资人无法只靠公开资料判断董事会动态。公开领导层也似乎从智利本土创业团队，演进为更国际化的运营结构：Miami
              在品牌中更突出，Lucas Melman 等国家经理出现在市场进入报道里。净结论是：Betterfly 有真实运营班底，但对 Eduardo della Maggiora
              的关键人依赖仍然重大，因为资本市场叙事、监管与合作伙伴可信度、以及公司使命驱动品牌叙事都由他锚定。
