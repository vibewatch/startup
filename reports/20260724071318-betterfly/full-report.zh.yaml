            - 67
            - 55
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Betterfly 最严重的剩余风险集中在执行、监管复杂度、融资不透明和伙伴依赖。
    claimRefs:
      - CR001
      - CR010
      - CR013
      - CR016
      - CR025
      - CR040
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
      rows:
        - label: 监管 / 隐私风险
          values:
            - 中高
            - 高
            - 中
        - label: 执行 / 收缩风险
          values:
            - 高
            - 高
            - 中
        - label: Minu 集成风险
          values:
            - 高
            - 高
            - 中低
        - label: 伙伴依赖风险
          values:
            - 中高
            - 高
            - 中低
        - label: 融资 / 估值重置风险
          values:
            - 中
            - 高
            - 低
        - label: 客户集中风险
          values:
            - 中高
            - 中高
            - 中
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 少数 Betterfly 风险可同时传导到收入、客户信任、融资和估值。
    claimRefs:
      - CR005
      - CR010
      - CR013
      - CR038
      - CR039
    data:
      nodes:
        - id: t1
          label: 隐私事件
          description: 敏感数据事件或滥用担忧
        - id: t2
          label: 客户信任受损
          description: 雇主和员工失去信心
        - id: t3
          label: 流失 / 销售放缓
          description: 留存和销售管道承压，收入受损
        - id: t4
          label: 融资议价力减弱
          description: 融资条款恶化
        - id: t5
          label: 估值压力
          description: 私募市场估值标记或定价下调
        - id: t6
          label: 集成不达预期
          description: Minu 未能带来预期扩张
        - id: t7
          label: 执行压力
          description: 管理层带宽和产品焦点被削弱
      edges:
        - from: t1
          to: t2
          label: 削弱信任
        - from: t2
          to: t3
          label: 抬高流失风险
        - from: t3
          to: t4
          label: 削弱叙事
        - from: t4
          to: t5
          label: 削弱价格支撑
        - from: t6
          to: t7
          label: 增加复杂度
        - from: t7
          to: t3
          label: 拖累交付
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 除自有 App 和门户外，Betterfly 还依赖监管方、应用商店、保险公司、雇主管理员和投资者。
    claimRefs:
      - CR007
      - CR009
      - CR019
      - CR020
      - CR029
      - CR039
    data:
      nodes:
        - id: d1
          label: Betterfly 核心产品
          description: 员工 App 加雇主门户
        - id: d2
          label: 监管方 / 法律框架
          type: regulatory
          risk: 决定哪些产品能卖，以及数据能如何处理
        - id: d3
          label: 保险公司 / 经纪商
          type: partner
          risk: 提供产品深度和经济收益
        - id: d4
          label: 雇主管理员
          type: customer
          risk: 把关入职质量和激活
        - id: d5
          label: Apple / Google
          type: distribution
          risk: 控制移动端分发和更新
        - id: d6
          label: 未来投资者
          type: capital
          risk: 影响下一轮融资灵活性
      edges:
        - from: d2
          to: d1
          label: 合规负担
        - from: d3
          to: d1
          label: 保障层
        - from: d4
          to: d1
          label: 员工配置数据
        - from: d5
          to: d1
          label: 应用商店触达
        - from: d6
          to: d1
          label: 资金可得性
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 这项建议沿着清晰链条展开：先看真实产品和客户验证，再落到重大披露与执行缺口，最终给出继续研究的立场。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
      - CV029
      - CV030
    data:
      nodes:
        - label: 真实产品 + 客户验证
          detail: Betterfly 已有上线应用、案例研究和面向雇主的价值主张。
        - label: 2025 年重置 + 2026 年收购
          detail: 业务仍在推进，但已不是简单的增长故事。
        - label: 公开经济性仍薄
          detail: 有 ARR 代理值，但毛利率、NRR、现金跑道和股权结构细节都缺失。
        - label: 估值很可能低于 2022 年峰值
          detail: 按简单 ARR 倍数估算，估值落在独角兽门槛以下。
        - label: 建议：继续研究
          detail: 保持跟进，但不要只凭叙事付高价。
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Betterfly 的公开估值更受假设收入倍数牵动，战略叙事本身不是主要变量。
    approximationNotes: 数值均为隐含企业价值，单位为十亿美元；计算以 $72M ARR 代理值作粗略估算，并非经审计的公司指引。
    claimRefs:
      - CV006
      - CV007
      - CV014
      - CV034
      - CV035
    data:
      items:
        - label: 悲观 / 5x ARR
          value: 0.36
        - label: 基准 / 7.5x ARR
          value: 0.54
        - label: 乐观 / 10x ARR
          value: 0.72
        - label: 2022 年披露融资估值
          value: 1
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于 Betterfly 的核心输入靠估算而非披露，示意性公开估值区间仍很宽。
    approximationNotes: 所有数值均为隐含企业价值区间，单位为十亿美元；区间由公开 ARR 和战略情景假设推导，不是管理层给出的估值。
    claimRefs:
      - CV006
      - CV007
      - CV012
      - CV013
      - CV014
      - CV033
    data:
      items:
        - label: 悲观
          low: 0.25
          high: 0.45
        - label: 基准
          low: 0.45
          high: 0.75
        - label: 乐观
          low: 0.75
          high: 1.1
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Betterfly 在战略契合度上得分较高，但定价准备度和披露深度偏弱。
    approximationNotes: 分数是定性 0-10 IC 风格指标，来自保留的公开证据，不是公司内部评分卡。
    claimRefs:
      - CV023
      - CV024
      - CV029
      - CV031
      - CV032
      - CV039
    data:
      items:
        - label: 市场契合度
          value: 8
        - label: 产品 / 客户验证
          value: 7
        - label: 增长选择权
          value: 7
        - label: 经济指标披露
          value: 3
        - label: 估值透明度
          value: 2
        - label: 整体 IC 准备度
          value: 4
