- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / revenue run-rate
    - $72M ARR (GetLatka, 2024 estimate)
    - Medium
    - Only current public top-line proxy in fetched set
    - Request monthly recurring revenue by geography and product.
  - - Gross margin
    - Unavailable publicly; likely below pure SaaS and above full-stack insurer
    - Low
    - Determines scalability and valuation quality
    - Request gross margin by product line and by country.
  - - CAC / payback
    - Unavailable publicly
    - Low
    - Shows whether employer acquisition is efficient
    - Request blended CAC, payback, and channel split.
  - - Net revenue retention
    - Unavailable publicly
    - Low
    - Tests durability of employer revenue base
    - Request NRR, expansion ARR, and churn by cohort.
  - - Engagement / utilization
    - Qualitatively central but quantitatively undisclosed
    - Low
    - Behavior-linked model only works if employees keep using it
    - Request MAU, mission completion, and benefits-attachment rates.
  - - Partner economics
    - Undisclosed carrier/broker terms
    - Low
    - May be the single biggest gross-profit lever
    - Request take rates, risk ownership, and commission waterfall.
  notes: Every key unit-economics field that matters for underwriting remains private, so the table explicitly converts each gap into a diligence request.
