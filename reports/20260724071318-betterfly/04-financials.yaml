- id: unit-economics-and-margin-drivers
  title: Unit Economics and Margin Drivers
  body: Because Betterfly does not publish realized pricing or gross margin, the only defensible way to discuss unit economics is through what must be true for the model to work. Revenue quality should depend on employer retention, sustained employee engagement, and efficient insurance-partner economics rather than one-off implementation fees. Gross margin should land somewhere below pure SaaS because the product includes insured benefits and partner distribution costs, but above a full-stack carrier because Betterfly does not present itself as the primary risk bearer. That means partner terms, broker economics, and attachment rates likely govern a large share of profitability. The problem is that none of the critical numbers — CAC, payback, NRR, logo churn, utilization, claims ratios, or gross margin by product — are public in the reviewed file. Financial diligence therefore remains more qualitative than quantitative at this stage.
