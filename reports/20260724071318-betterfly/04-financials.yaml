- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial verdict is therefore cautious. Betterfly appears to have a genuine business with employer customers, employee usage, and enough strategic credibility to buy Minu rather than merely discuss expansion. But the current public evidence is far better at proving strategic intent than proving economics. The report can say with some confidence that Betterfly runs a hybrid SaaS-plus-insurance model, narrowed its footprint in 2025, and then used M&A in 2026 to deepen Mexico and financial wellness. It cannot yet say what gross margin is, how much recurring revenue is software versus protection-related, whether customer cohorts are durable, or how much runway remains after expansion and acquisition spending. For investment underwriting, those missing numbers are not cosmetic; they are the main blockers to forming a conviction on quality of revenue, capital adequacy, and valuation resilience. The public file is especially weak on reconciliation between growth narrative and accounting
    reality: no audited revenue segmentation, no contribution margin bridge, and no board-level runway disclosures are available in the fetched set. Those omissions are large enough to keep this chapter at a diligence-blocker posture rather than an underwriting-ready one.'
