- id: TI004
  title: Capital Adequacy Table
  columns:
  - Item
  - Public evidence
  - Current status
  - Why it matters
  - Diligence ask
  rows:
  - - Historical scale financing
    - 2022 Series C at reported unicorn valuation
    - Visible but partially conflicting on investor details
    - Shows Betterfly could once raise meaningful growth capital
    - Request full cap table and round terms.
  - - Current cash on hand
    - Not disclosed in fetched public file
    - Unknown
    - Most direct runway input is missing
    - Request latest cash balance and restricted cash.
  - - Monthly burn
    - Not disclosed; only restructuring behavior is visible
    - Unknown
    - Needed to interpret runway after retrenchment and M&A
    - Request monthly burn trend before and after March 2025.
  - - Runway / financing dependency
    - Can only be inferred from exits plus continued acquisition spend
    - Unknown
    - Critical for underwriting next-round risk
    - Request internal runway model and board plan assumptions.
  - - Acquisition spending capacity
    - $100M Minu purchase was widely reported
    - Visible at deal-value level, not funding-source level
    - Signals flexibility but also major deployment of capital
    - Request consideration mix, funding source, and expected payback.
  notes: This chapter intentionally references the financing chronology only to frame forward capital adequacy; it does not attempt to recreate the full round history from Chapter 1.
