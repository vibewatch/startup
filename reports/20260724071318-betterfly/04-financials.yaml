company:
  name: Betterfly
chapter:
  number: 4
  title: Financials
  summary: 'Betterfly appears to run a real hybrid employer-benefits business, but the current public file proves strategy more clearly than economics. Official pages support a B2B2C model that blends wellness engagement with insurance-linked protection, while GetLatka provides a lightly corroborated $72M ARR signal for 2024. The March 2025 retrenchment and the reported $100M Minu acquisition in June 2026 together imply both discipline and remaining capital flexibility. What remains missing are the core underwriting inputs: revenue mix, gross margin, CAC/payback, retention, cash, burn, debt, and partner economics. The verdict is therefore cautious: Betterfly has visible scale and strategic momentum, but public evidence is not yet strong enough to underwrite revenue quality or runway with conviction.'
sections:
- id: revenue-model-and-public-traction
  title: Revenue Model and Public Traction
  body: 'Betterfly’s public materials describe a hybrid employer-benefits platform, not a narrow software widget. Employers buy a package framed around employee wellbeing, lower healthcare costs, better retention, and measurable ROI, while employees interact with the app through daily missions, rewards, and insurance-linked protection. That framing strongly suggests two monetization layers: recurring employer platform revenue and economics tied to the protection stack delivered through insurance partners. What the public file does not show is the split between those layers. There is no disclosed list pricing, realized PEPM, commission rate, or revenue-recognition discussion. The only explicit current top-line signal in the fetched set is GetLatka’s $72M ARR estimate for 2024, which is useful as a directional marker but not enough for underwriting by itself. In short, Betterfly looks scaled enough to matter, yet still opaque on the exact mechanics of how activity converts into reported revenue.'
