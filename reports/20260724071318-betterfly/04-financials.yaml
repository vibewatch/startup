- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact on diligence
  - Exact diligence path
  rows:
  - - Revenue mix by stream and country
    - Without this, investors cannot tell whether growth is software-like, insurance-like, or acquisition-driven
    - Obtain monthly management P&L segmented by stream and geography.
  - - Gross margin and contribution margin
    - Prevents underwriting of long-term profitability and valuation support
    - Request product-level gross margin bridge and carrier-partner cost schedule.
  - - CAC, payback, and sales efficiency
    - Blocks view on whether Betterfly can grow efficiently after retrenchment
    - Request funnel, win-rate, CAC, and payback by channel and market.
  - - NRR, churn, and cohort performance
    - Prevents judgment on revenue durability and customer love
    - Request renewal cohorts, expansion ARR, and logo churn by country.
  - - Cash, burn, and debt
    - Makes next-round timing impossible to judge from public data
    - Request board package with cash forecast, debt schedule, and covenant summary.
  notes: These are the five highest-priority blockers for investment underwriting because they directly affect valuation support, survivability, and quality of revenue.
