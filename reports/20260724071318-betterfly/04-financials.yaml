tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Quality
  - Diligence ask
  rows:
  - - Employer platform subscription
    - Employer pays for access to wellness, engagement, analytics, and benefits experience
    - Per employer / employee
    - Mechanism visible; realized pricing undisclosed
    - Potentially recurring and sticky if engagement sustains
    - Request PEPM bands, contract lengths, and country mix.
  - - Insurance-linked economics
    - Betterfly distributes protection and likely shares in premium or commission economics through partners
    - Policy / covered employee
    - Protection layer visible; exact economics undisclosed
    - Can deepen ARPU but may compress margin versus pure SaaS
    - Request carrier contracts, commission/take-rate mechanics, and claims responsibility.
  - - Financial wellness upsell via Minu
    - Cross-sell of earned wage access, savings, or financial wellbeing modules after acquisition
    - Per client / active employee
    - Strategic opportunity visible; monetization split not public
    - Could improve wallet share if attach rates prove durable
    - Request cross-sell plan, attach assumptions, and post-close product revenue mix.
  - - Implementation / enterprise integration services
    - Set-up, integrations, onboarding, and client success work around deployments
    - Project / implementation
    - Public sources imply enterprise onboarding but do not disclose fee treatment
    - Could be low-margin or bundled; recognition unknown
    - Request implementation pricing and revenue-recognition policy.
  - - Data / analytics value capture
    - Employer ROI reporting and health-engagement analytics support value-based renewals
    - Included feature, not separately priced publicly
    - Visible as positioning, not disclosed as standalone revenue
    - Supports retention rather than explicit top-line line item
    - Request renewal drivers, analytics adoption, and upsell monetization.
  notes: This table separates visible commercial mechanisms from inferred economics; Betterfly does not publish a revenue-line-item breakout in the reviewed public file.
