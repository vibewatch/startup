- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Integration risk
    - Minu cross-sell / retention underperforms
    - No material attach or retained-client evidence within 12 months
    - Move from watch to negative thesis.
  - - Geographic concentration
    - Another market retreat or major slowdown in a top-three country
    - Any additional forced exit from a core market
    - Treat as thesis-break until proven otherwise.
  - - Financing risk
    - Weak financing event
    - Down-round, punitive preferences, or emergency capital
    - Reset valuation framework and reconsider exposure.
  - - Privacy / trust risk
    - Material incident or regulatory inquiry
    - Confirmed breach, data misuse claim, or regulator action
    - Pause diligence or investment process immediately.
  - - Execution focus
    - Roadmap diffusion after acquisition
    - Product sprawl without clearer customer outcomes
    - Lower conviction on operating leverage and moat.
  notes: These kill criteria are intentionally monitorable; they turn abstract risks into observable events that should change investment behavior.
