- id: financial-and-execution-risks
  title: Financial and Execution Risks
  body: 'The biggest public red flag is execution. Betterfly’s March 2025 restructuring closed five markets and cut staff, which implies that the prior growth footprint was not sustainable on the original path. That would already be a serious signal in isolation. Layering on a reported $100M Minu acquisition in 2026 adds a second, different risk: post-retrenchment management now has to integrate a large cross-border acquisition while also deepening Mexico and pushing into the U.S. Meanwhile, public disclosure on cash, burn, debt, and unit economics remains weak. The result is a company that can still look strategically active while being financially difficult to underwrite. The risk is not necessarily imminent insolvency; it is that a mixture of integration friction, concentration, and valuation overhang could force a weak financing outcome or strategic reset before the growth story is fully proven.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
