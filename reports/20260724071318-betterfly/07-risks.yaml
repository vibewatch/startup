- id: residual-exposure-and-kill-criteria
  title: Residual Exposure and Kill Criteria
  body: The residual-risk picture is therefore high. Betterfly has real mitigations — published privacy and quality surfaces, narrowed strategic focus, active product distribution, and a willingness to reposition through acquisition — but the highest-severity risks are precisely the ones least resolved by public evidence. These include who ultimately bears regulatory responsibility in each market, whether integration benefits materialize after Minu, how dependent renewals are on employee engagement, and whether the company can grow inside a smaller but more concentrated footprint without needing a painful recapitalization. For investors, the practical response is not to ignore the company but to define crisp kill criteria. Another major geographic retreat, a weak financing event, a material privacy incident, or evidence that Minu fails to cross-sell would each directly weaken the thesis. That makes Betterfly investable only under close diligence and strict monitoring, not under trust-me
    optimism. One practical reason to stay strict is that Betterfly’s public materials currently offer far more strategic narrative than operational scorekeeping. Until management shows concrete post-restructuring and post-acquisition performance data, residual exposure should be assumed to remain elevated even if external messaging sounds confident.
  claimRefs:
  - CR024
  - CR026
  - CR027
  - CR034
  - CR035
  - CR040
