company:
  name: Betterfly
chapter:
  number: 7
  title: Risks
  summary: 'Betterfly’s residual-risk profile is high. The most important risks are not hypothetical: the company already retrenched from five countries in 2025, remains concentrated in a smaller market set, and then committed to a large 2026 Minu acquisition that raises integration complexity. At the same time, Betterfly handles health-adjacent employee data and insurance-linked workflows, which elevate privacy, compliance, and partner-dependence risks. Public mitigation evidence exists — privacy policy, ISO-themed control pages, localized compliance modules, and a narrower strategic focus — but the key underwriting questions remain unresolved: who carries the regulated obligations in each market, how resilient the business is after retrenchment, what cash / runway really look like, and whether Minu creates value or distraction. The result is a clear conclusion: Betterfly is not uninvestable, but it is a high-monitoring, high-diligence story with multiple thesis-break triggers.'
sections:
- id: regulatory-and-legal-exposure
  title: Regulatory and Legal Exposure
  body: 'Betterfly’s risk profile starts with regulation and privacy. The company sells insurance-adjacent employee benefits, operates across multiple countries, and uses a mobile app that surfaces health-related behavior data. That combination makes legal and regulatory risk structural, not incidental. Public materials show that Betterfly is aware of this burden: it publishes a privacy policy, references ISO-oriented information-security and quality systems, and offers a country-specific NOM-035 module in Mexico. Still, the public file is descriptive rather than dispositive. It does not show which entity bears regulated insurance risk in each market, whether any regulator has reviewed the model, or how privacy controls are implemented operationally. The main legal takeaway is therefore mixed: Betterfly appears conscious of compliance, but the most underwriting-relevant regulatory details remain private or indirect. Today.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR006
  - CR007
  - CR008
  - CR009
