- id: operational-partner-and-customer-risks
  title: Operational, Partner, and Customer Risks
  body: 'Operationally, Betterfly looks more exposed to execution quality than to heavy industrial or supply-chain failure, but the exposure is still meaningful. Administrators must add employees before the app can work, so onboarding quality depends on customer data and internal sponsors. The live iOS and Android apps create a direct dependence on Apple and Google distribution. The product also appears to rely on external insurers or brokers for parts of its value proposition, which means service quality and economics can be affected by partners outside Betterfly’s direct control. Reliability is another under-documented risk: public trust and policy pages exist, yet no uptime, support, or incident data were visible in the fetched file. This combination creates a familiar enterprise-software hazard: the product can be commercially compelling while still failing if onboarding, support, partner coordination, or mobile distribution breaks down at scale. That makes reference quality and deployment
    hygiene meaningful risk controls in their own right.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
