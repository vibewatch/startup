- id: drivers-constraints-and-adoption-timing
  title: Growth Drivers, Constraints, and Adoption Timing
  body: 'The demand drivers are real. WHO and ILO both point to mental-health and workplace-health burdens that make prevention and support economically relevant; Gallup and Mercer highlight engagement pressure and benefit-plan underuse; Betterfly’s own employer materials frame the same problem from a commercial angle: most employees ignore benefits between enrollment and claim events. Those dynamics support demand for daily-engagement systems that make benefits feel tangible. But constraints are equally important. Employers still face budget pressure, privacy concerns around health data, proof-of-ROI skepticism, benefit fatigue, and implementation friction. Betterfly’s 2025 market retreat is therefore analytically important: it shows that the category may be attractive, but scaling it across many countries at once is operationally and economically hard. The market is not simply “big”; it is attractive only where Betterfly can align employer budgets, carrier partners, localized compliance,
    and sustained employee participation. That argues for a narrower, more disciplined commercialization strategy than the company’s 2021-2022 expansion marketing suggested.'
