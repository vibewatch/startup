company:
  name: Betterfly
chapter:
  number: 2
  title: Market Analysis
  summary: 'Betterfly sells into the intersection of employee benefits, corporate wellness, and embedded insurance rather than a single clean software category. Public market reports consistently show a large and growing global wellness and employer-benefits opportunity, but they disagree on exact TAM because some include healthcare services, analytics, fitness, or insurance spend while others do not. Betterfly’s real SAM is narrower: employers willing to pay HR-, broker-, or insurer-led budgets for daily-engagement benefits in markets where health, retention, and cost control matter enough to justify implementation.'
sections:
- id: market-boundary
  title: Market Boundary and Category Logic
  body: 'Betterfly operates across several adjacent spend pools, so the first diligence task is to define what market it is actually in. Official Betterfly pages position the product as an employer-paid platform that bundles insurance, preventive health services, daily engagement, HR analytics, and rewards. That means the most relevant boundary is not pure digital insurance, pure fitness benefits, or pure HR software in isolation. The closest investable boundary is employer-sponsored health-and-benefits operating spend: software, service, content, and carrier-linked products used by companies to improve wellbeing, retention, and claims or cost outcomes. Several market-report publishers estimate large global corporate-wellness markets, but those figures are not directly comparable because some include screenings, coaching, EAPs, fitness, analytics, or insurance-linked services while others focus on software or programs only. For Betterfly, the useful takeaway is category adjacency, not false
    precision. The company participates in a broad wellness-and-benefits TAM, a narrower employer-sponsored preventive-health-and-voluntary-benefits SAM, and a still narrower country-by-country SOM defined by insurance partnerships, broker channels, and employer willingness to deploy behavior-linked benefits.'
