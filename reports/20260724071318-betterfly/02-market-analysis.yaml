- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Mental-health and workplace-health burden
    - Positive demand driver
    - Current and structural
    - Supports prevention and employee-support budgets
    - Quantify how Betterfly converts health engagement into lower claims or lower churn.
  - - Benefits underuse between enrollment and claims
    - Positive demand driver
    - Current
    - Supports Betterfly’s daily-engagement positioning
    - Validate whether Betterfly’s engagement metrics persist after onboarding cohorts mature.
  - - Pressure on retention and productivity
    - Positive demand driver
    - Current
    - Makes employee-experience budgets more strategic
    - Test whether Betterfly is funded from HR, insurance, or broader wellbeing budgets in each country.
  - - Budget pressure and macro volatility in LATAM
    - Negative constraint
    - Current
    - Can slow adoption, especially in SMEs and multi-country rollout plans
    - Stress-test willingness to pay across employer sizes and countries.
  - - Privacy, regulation, and data-sharing concerns
    - Negative constraint
    - Current and structural
    - Can limit data collection or raise implementation friction
    - Map legal and carrier constraints country by country.
  - - Implementation and localization complexity
    - Negative constraint
    - Current
    - Explains why category TAM does not automatically become regional SOM
    - Request deployment times, local carrier dependence, and post-launch retention by market.
  notes: The same conditions that create market demand also make cross-border execution hard; Betterfly’s 2025 retrenchment is evidence of that tension.
