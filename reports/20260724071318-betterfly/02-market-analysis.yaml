tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Betterfly
  rows:
  - - Corporate wellness programs
    - Screenings, coaching, engagement, mental-health support, benefits platforms
    - Acute-care payer spend and hospital claims administration
    - Employer / HR / benefits
    - Core adjacent market because Betterfly packages engagement and preventive-health surfaces.
  - - Voluntary insurance and employee protection
    - Life, accident, critical illness, hospital indemnity, broker-distributed add-ons
    - Property-casualty lines and unrelated retail insurance
    - Employer and employee with carrier support
    - Core because Betterfly uses insurance as the economic and emotional anchor.
  - - HR benefits administration
    - Enrollment, eligibility, benefit catalogs, ROI dashboards
    - Payroll-only or HCM core-record systems without benefits engagement
    - Employer / HRIS / broker
    - Relevant because Betterfly sells portal and analytics workflows, but is not a full HCM suite.
  - - Consumer fitness or wellness subscriptions
    - Gym memberships, direct-to-consumer apps, wearables
    - Employer-sponsored insurance-linked benefits budgets
    - Individual consumers
    - Adjacent substitute, but incomplete for Betterfly because no insurance or employer workflow is required.
  - - Healthcare claims and medical delivery
    - Provider networks, hospital systems, payer claims adjudication
    - Employee engagement and rewards layers
    - Insurers / providers / governments
    - Mostly excluded because Betterfly influences prevention and usage, not full care delivery.
  notes: The table distinguishes the broad wellness economy from the narrower employer-sponsored insurance-and-engagement spend that Betterfly actually addresses.
