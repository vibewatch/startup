    - Employer
    - Retention, claims trend visibility, benefits engagement, employer brand
    - Benefits / People / Total Rewards
    - Need to prove ROI and improve underused benefits.
  - - SME / mid-market
    - Founder, finance leader, HR generalist, broker
    - Employees
    - Employer with broker guidance
    - Offer “big-company” benefits without building a full internal benefits stack
    - Owner / HR / broker
    - Need affordable differentiation and simpler administration.
  - - Broker channel
    - Benefits broker or advisor
    - Employer clients and enrolled employees
    - Commission-backed or bundled with employer spend
    - Enrollment, quoting, renewal support, and participation analytics
    - Broker and employer
    - Need higher take-up and stickier renewals.
  - - Carrier partner
    - Insurer or MGA
    - Employer client base
    - Carrier or co-funded distribution motion
    - Bundle insurance products with engagement and prevention layer
    - Insurance product / partnership team
    - Need differentiated distribution and richer customer contact.
  - - Employee end-user
    - Individual worker
    - Individual worker
    - Indirect via employer sponsor
    - Daily health actions, rewards, coverage clarity, community, claims guidance
    - N/A; user not primary payer
    - Need immediate value and habit formation, not just annual enrollment.
  notes: 'Betterfly is clearly B2B2C: the buyer and payer sit above the daily user, so adoption requires both budget approval and repeated end-user engagement.'
