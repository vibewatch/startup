- id: TM003
  title: Segment / Buyer Map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow / value
  - Budget owner
  - Adoption trigger
  rows:
  - - Large enterprise
    - HR / benefits leader
