- id: architecture-dependencies-and-deployment
  title: Architecture, Dependencies, and Deployment
  body: Public evidence for Betterfly’s operating architecture is much thinner than evidence for its product messaging. The strongest workflow proof comes from the client-portal page, which shows that employers or administrators must first add collaborators before employees can use the app. That implies at least one onboarding and roster-management dependency on the employer side, with the mobile app providing the employee side of the loop. App-store listings confirm that Betterfly distributes live iPhone and Android applications, which in turn creates dependence on Apple and Google platform rules. The reviewed public file does not expose a named API stack, infrastructure diagram, or detailed integration catalog, so architecture claims must stay conservative. Betterfly likely depends on mobile sensors, app-store distribution, admin data ingestion, and insurer-partner connectivity, but only the first three are directly visible in the fetched set.
