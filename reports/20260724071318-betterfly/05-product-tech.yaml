company:
  name: Betterfly
chapter:
  number: 5
  title: Product & Technology
  summary: 'Betterfly’s public product file supports a real, shipped, multi-module benefits platform with an insurance anchor, live iOS and Android apps, employer onboarding workflows, localized market modules, and visible privacy / quality narratives. The strongest verified differentiator is the behavior-to-value loop: healthy actions trigger rewards, better protection, and donations. What the public file does not prove in depth is the technical substrate beneath that experience. The fetched sources show a client portal, app-store distribution, policy pages, and ISO-themed trust pages, but they do not verify the exact HRIS integrations, named wellness-content integrations, or underlying architecture details from the user brief. The chapter verdict is commercially positive but technically incomplete: Betterfly looks product-real and user-facing mature, yet still requires direct diligence to validate architecture depth, integration breadth, and runtime reliability.'
sections:
- id: product-definition-and-modules
  title: Product Definition and Modules
  body: 'Betterfly’s product is best understood as a combined employee-benefits operating layer rather than a single wellness app. Official pages consistently present one employer-sponsored experience that bundles health engagement, rewards, benefits, and insurance into a single narrative. Employees interact through a mobile app where healthy actions are supposed to translate into rewards, better protection, and social impact. At the same time, employers are sold a retention-and-ROI proposition rather than simply an insurance policy or fitness perk. The Chilean product pages reinforce that there are multiple public modules inside that promise: healthy-habit activation, digital wellbeing benefits, complementary insurance, and the “Betterfly effect” loop tying activity to donations and coverage growth. The broad shape is therefore clear even if the exact SKU map and pricing logic are not. Betterfly looks like a modular benefits platform with an insurance anchor and behavior-design overlay.'
