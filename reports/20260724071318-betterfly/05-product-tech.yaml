- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Employee mobile apps
    - Primary engagement surface for habits, rewards, and benefits
    - Apple and Google distribution plus device capabilities
    - Store-policy changes or app-quality issues could hit usage quickly.
  - - Employer / admin portal
    - Adds collaborators and likely controls access / setup
    - Accurate roster data and employer admin participation
    - Bad data ingestion can weaken activation and perceived value.
  - - Behavior and reward loop
    - Converts actions into benefits, coverage changes, and donations
    - Reliable event capture from user activity flows
    - Public file does not show event-processing precision or fraud controls.
  - - Insurance-partner layer
    - Supplies protection product underneath the user experience
    - Carrier and broker relationships
    - Partner changes can affect product economics and market coverage.
  - - Privacy / data-governance layer
    - Governs collection and use of personal information across services
    - Policy enforcement and legal/compliance execution
    - No public architecture pack shows how sensitive data flows are segmented.
  - - Localized compliance modules
    - Adapt product for country-specific needs such as NOM-035
    - Local regulatory and customer requirements
    - Localization burden can complicate roadmap and support.
  notes: This architecture table intentionally distinguishes visible operating layers from unverified implementation detail such as exact cloud vendors or API frameworks.
