companyProfile:
  summary: Betterfly is a Chile-founded, Miami-facing employee wellness and insurtech platform that ties healthy behavior to richer insurance coverage, rewards, and charitable impact. Public evidence supports a real employer-paid B2B2C model, 2,000-plus enterprise clients on official pages, a 2022 unicorn financing, and a 2026 Minu acquisition that deepened Mexico and financial-wellness exposure. The same public file also shows a 2025 retreat from five Latin American markets and limited disclosure on economics and governance.
