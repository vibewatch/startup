      claimRefs: [CO022]
  foundingLocation: Santiago, Chile
  headquarters: Santiago, Chile origin / Miami, Florida current public HQ signal
  productSummary: Employer-sponsored platform combining wellness engagement, insurance protection, rewards, and social-impact loops through a mobile app and employer-facing workflows.
  customerFocus: Employers and HR / benefits teams as buyers, employees as end users, with strongest public proof in Chile, Mexico, and Spain.
  businessModel: Hybrid B2B2C benefits model combining employer sponsorship, insurance-linked engagement, and adjacent wellness / financial-wellness modules.
  stage: Private company with unicorn-era funding history
  fundingStatus: Reported 2022 unicorn financing at ~$1B valuation, followed by 2025 retrenchment and a reported $100M Minu acquisition in 2026.
