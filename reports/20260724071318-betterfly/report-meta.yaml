  topStrengths:
    - Differentiated behavior-to-insurance value loop with a real employer-sponsored product.
    - Visible customer proof, live mobile distribution, and official claims of 2,000-plus enterprise clients.
    - Strategic optionality from the 2026 Minu acquisition and continued Mexico / U.S. expansion narrative.
    - Strong category fit at the intersection of wellness, benefits, and insurtech.
  topRisks:
    - 2025 exit from five countries signals meaningful execution and focus risk.
    - Public disclosure on margin, retention, runway, and cap-table terms is weak.
    - Minu integration is a large swing factor that can help or hurt the thesis.
    - Concentration in Chile, Mexico, and Spain makes country-level shocks more dangerous.
    - Privacy, partner, and regulatory complexity remain under-documented publicly.
  unresolvedGaps:
