- id: capital-base-and-stakeholders
  title: Capital Base and Stakeholders
  body: 'Betterfly’s capital story is one of rapid escalation. The reviewed corpus supports a 2020 Series A led by QED Investors, a 2021 $60M Series B involving DST Global, QED, Valor Capital, Endeavor Catalyst, and SoftBank Latin America Fund, and a 2022 Series C that elevated Betterfly to unicorn status. Coverage diverges on the exact Series C size and lifetime capital raised: independent 2022 reporting from Refresh Miami, Contxto, Forbes Mexico, and Life Insurance International cites a $125M Series C at a $1B valuation, while user-provided background and some secondary references frame the step-up around a $60M raise at a $1B-plus mark. The safer public conclusion is therefore not a false precision on one number but a chronology: Betterfly reached unicorn status in early 2022, attracted high-profile growth capital, and entered the post-2022 downcycle with one of the strongest balance sheets in Chilean startup history. Stakeholder breadth also matters. QED, DST, Glade Brook, Greycroft,
    Lightrock, SoftBank Latin America Fund, Chubb, Icatu, and later Minu all show up in the visible financing-and-distribution map, indicating that Betterfly’s cap-table and partner graph overlaps with both venture and insurance distribution networks. The 2026 Minu deal reinforces that Betterfly still had enough firepower to buy growth rather than only defend runway.'
