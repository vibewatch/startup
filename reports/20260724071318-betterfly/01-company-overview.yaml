- id: scale-milestones-and-adverse-signals
  title: Scale, Milestones, and Adverse Signals
  body: Betterfly’s milestones cut both ways. On the favorable side, the company moved from Burn To Give in 2018 into a benefits-and-insurance platform, reached nearly one million members before becoming a unicorn, launched into multiple Latin American markets with carrier partnerships, hit one million paying users by early 2024, and in 2026 bought Minu to deepen financial-wellness capability and Mexican distribution. Official employer pages now claim more than 2,000 enterprise clients, while 2022 and 2023 Forbes and media interviews describe more than 2,500 and later more than 5,000 client companies depending on geography and time period. On the adverse side, Betterfly already showed strain during the 2022 reset, when Contxto reported layoffs in Brazil and Chile, and the strategic retreat became much more explicit in 2025 when the company ceased operations in five Latin American countries and said 94% of revenue was concentrated in Chile, Mexico, and Spain. That sequence matters because
    it reframes Betterfly from a simple hypergrowth winner into a company that has already had to reallocate capital aggressively. The 2026 Minu acquisition is therefore strategically positive, but it should also be read as a high-stakes attempt to rebuild durable scale in Mexico through M&A instead of organic relaunch alone.
