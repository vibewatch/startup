company:
  name: Betterfly
chapter:
  number: 1
  title: Company Overview
  summary: Betterfly is a Chile-founded employee wellness and insurtech platform that publicly positions itself as an insurance-led employee benefits system tying healthy behavior to richer coverage, rewards, and social impact. Public coverage consistently shows a 2022 unicorn round at a $1B valuation, a 2025 retrenchment from five Latin American countries, and a 2026 $100M Minu acquisition that re-established Mexico as a strategic market. The strongest open diligence gaps are current governance detail, fully reconciled headcount, and audited financial disclosure.
sections:
- id: identity-business-model
  title: Identity and Business Model
  body: 'Betterfly’s current public positioning is much more specific than a generic “wellness app.” Its English-language homepage, employer page, employee page, and LinkedIn company profile all frame Betterfly as an employee benefits platform built on insurance, not simply a perk marketplace. Employers buy access for their workforce, employees receive guaranteed-issue or simplified-issue protection plus preventive health and rewards from day one, and the platform uses points, challenges, and healthier daily behavior to deepen usage between renewal cycles. The product bundle repeatedly combines insurance, preventive health services, behavioral engagement, and social-impact rewards, which is why Betterfly is best analyzed as an insurtech-enabled B2B2C employee benefits operating system. The company’s own materials also claim broad geographic reach and scale, but they do so with some tension: the About page still says Betterfly is present in eight countries and is the leading protection-and-benefits
    platform in Latin America, while LinkedIn now presents Miami as headquarters and the U.S. homepage emphasizes an American go-to-market push. The cleanest synthesis is that Betterfly was founded in Chile, built its first operating base in Santiago, and by 2026 is publicly managing the company as a multi-market platform with Miami as the face of U.S. expansion rather than a pure Chile-only operator.'
