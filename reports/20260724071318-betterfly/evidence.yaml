evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting rights, investor protections, and any founder-control agreements.
    whyItMatters: >-
      These items determine real decision rights and downside protection but are absent from the public record reviewed
      here.
    diligencePath: Request the latest board deck, cap table, shareholder agreement summary, and any observer or veto-right schedule.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled financing table showing round dates, primary versus secondary mix, and total capital raised.
    whyItMatters: Public sources align on unicorn status but diverge on exact Series C sizing and lifetime capital raised.
    diligencePath: Request a management-certified financing chronology with transaction documents or a cap-table export.
    relatedQuestionRefs:
      - QO008
      - QO010
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee count split by market and function after the 2025 restructuring and 2026 Minu integration.
    whyItMatters: >-
      Public headcount signals range from 201-500 on LinkedIn to 200-plus in a 2026 interview and 500-plus in older
      expansion coverage.
    diligencePath: Request a current org snapshot, payroll count, and headcount bridge from 2022 through 2026.
    relatedQuestionRefs:
      - QO013
  - type: conflicting-data
    severity: minor
    topic: customer-count
    missingEvidence: A single management definition for enterprise clients, employers, members, employees covered, and paid users.
    whyItMatters: Different sources cite 2,000+, 2,500+, 4,000+, or 5,000+ companies depending on period and geography.
    diligencePath: Request a KPI dictionary plus quarterly customer cohort metrics by country.
    relatedQuestionRefs:
      - QO011
      - QO023
  - type: stale
    severity: material
    topic: geographic-footprint
    missingEvidence: An updated country-by-country operating map after the 2025 exits and the 2026 Minu acquisition.
    whyItMatters: >-
      Official marketing still advertises eight-country presence, while adverse reporting shows a narrower current
      footprint.
    diligencePath: Request current operating entities, licensed insurance partners, and active-revenue markets as of 2026-07-24.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO005
  - type: missing-source
    severity: material
    topic: latin-america-tam
    missingEvidence: A consistent Latin America-specific employer wellness and insurance-linked benefits market model.
    whyItMatters: Public global market pages support category attractiveness but do not cleanly isolate Betterfly’s regional SAM.
    diligencePath: Request management TAM workbook by country and segment, with external assumptions clearly referenced.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: private-evidence-only
    severity: material
    topic: country-penetration
    missingEvidence: Country-level revenue, customer, and covered-life counts for Chile, Mexico, Spain, and any active U.S. pilots.
    whyItMatters: Without penetration data, Betterfly’s effective SOM cannot be underwritten market by market.
    diligencePath: Request cohort KPIs and employer counts by country for the last eight quarters.
    relatedQuestionRefs:
      - QM020
      - QM022
  - type: conflicting-data
    severity: minor
    topic: geography
    missingEvidence: >-
      A current operating-footprint map that reconciles marketing claims of eight-country presence with retrenchment
      reporting.
    whyItMatters: Geographic ambiguity makes TAM narratives look larger than the commercial reality.
    diligencePath: Request current active-revenue countries, licensed carrier partners, and local legal entities.
    relatedQuestionRefs:
      - QM006
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-proof
    missingEvidence: Renewal, claims, and retention impact data by employer cohort.
    whyItMatters: The market story depends on measurable employer ROI, but public evidence is mostly marketing-level.
    diligencePath: Request renewal rates, benefit participation curves, and cost-outcome correlations for mature cohorts.
    relatedQuestionRefs:
      - QM013
      - QM014
  - type: stale
    severity: minor
    topic: market-reports
    missingEvidence: Publisher workbooks behind public market-report landing pages.
    whyItMatters: Summary pages prove direction but not the full segmentation logic behind the estimates.
    diligencePath: >-
      Review the underlying paid reports or management’s cited extracts before using any exact TAM number in an
      investment memo.
    relatedQuestionRefs:
      - QM004
      - QM018
  - type: private-evidence-only
    severity: material
    topic: market-share
