  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Betterfly’s valuation discussion has to start with one tension: the last strong public financing marker is
              a reported $1B valuation from 2022, while the best current public top-line marker is GetLatka’s $72M ARR
              estimate for 2024. On their own, those two facts do not settle the question, but they do define the
              discipline needed. If one applies rough 5x to 10x revenue multiples to the public ARR proxy, the resulting
              range lands around $360M to $720M, below the 2022 unicorn mark. That does not prove Betterfly is worth
              less than $1B today because ARR may have changed, margin quality is unknown, and Minu could shift the
              trajectory. It does prove that investors should not assume the old mark still holds without updated
              evidence. The right stance is therefore price-sensitive skepticism rather than nostalgia for the peak
              market.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV033
          - type: table
