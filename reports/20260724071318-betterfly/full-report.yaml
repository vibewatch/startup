      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The reviewed public source set is founder-centric. Independent media coverage and Forbes Mexico interviews
              repeatedly describe Betterfly as founded by Eduardo and Cristóbal della Maggiora, with Eduardo as the
              recurring chief executive and principal public spokesperson. That concentration is visible in both
              positive and adverse moments: Eduardo is the quoted voice in fundraising, Chubb partnership, and expansion
              coverage, while the company’s public response to layoffs and restructuring appears through People and
              Culture leadership or founder interviews rather than a broadly visible external board structure. Public
              disclosures are much thinner on formal governance. None of the reviewed official, media, or profile
              sources provide a fully enumerated board roster, control-rights disclosure, or liquidation-preference
              detail. That does not prove governance weakness, but it does mean outside investors cannot underwrite
              board dynamics from public information alone. Public leadership also appears to have evolved from a
              Chile-centered startup bench to a broader international operating structure, with Miami becoming prominent
              in public branding and country managers such as Lucas Melman appearing in market-entry coverage. The net
              takeaway is that Betterfly has a real operating bench, but key-person dependence on Eduardo della Maggiora
              remains material because he anchors capital-markets storytelling, regulatory-partner credibility, and the
              company’s purpose-driven brand narrative.
