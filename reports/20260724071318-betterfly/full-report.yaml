            body: >-
              The biggest public red flag is execution. Betterfly’s March 2025 restructuring closed five markets and cut
              staff, which implies that the prior growth footprint was not sustainable on the original path. That would
              already be a serious signal in isolation. Layering on a reported $100M Minu acquisition in 2026 adds a
