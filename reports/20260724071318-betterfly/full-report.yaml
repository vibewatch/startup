            body: >-
              Betterfly’s customer model is straightforward in concept but important in underwriting terms: employers
              buy, employees use, and the product’s value is supposed to compound through repeated engagement. Official
              pages sell Betterfly to HR and benefits buyers on retention, wellbeing, and ROI, while employee-facing
              pages center healthy habits, rewards, and coverage. That means Betterfly is not just selling an insurance
              plan or a wellness perk; it is trying to insert itself into the employer-to-employee relationship as an
              always-on benefits layer. Public sources also suggest that the use cases can vary by market.
              Mexico-specific NOM-035 positioning broadens the employer reason to buy beyond generic wellness, while the
              Minu acquisition expands the product toward financial wellbeing. The segmentation logic is therefore B2B2C
              by structure, with country-specific modules widening the buyer rationale and potentially increasing wallet
