  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Structure and Competitive Set
        blocks:
          - type: paragraph
            body: >-
              Betterfly does not face one tidy peer group. The closest direct overlap comes from platforms that promise
              employee wellbeing outcomes and employer ROI, such as Wellhub, because those vendors also sell retention,
              productivity, and lower healthcare-cost narratives to employers. A second class is broader HR and payroll
              infrastructure — Deel, Rippling, Gusto, Buk, HiBob, and beqom-adjacent compensation platforms — which may
              not center insurance-driven behavior change but already sit inside employer workflows and can bolt
              benefits, compensation, and communications onto existing systems. A third class is incumbent insurance and
              employee-benefits infrastructure from carriers such as AXA, Zurich, and MetLife, which have much deeper
              underwriting and distribution capacity but weaker public evidence of daily engagement loops. Minu used to
              overlap with Betterfly from the financial-wellness side and is now internalized via acquisition. The
              competitive question is therefore not only “who else offers wellness” but “which alternative owns the
              employer budget, employee relationship, or insurance capacity that Betterfly needs to protect.”
            claimRefs:
