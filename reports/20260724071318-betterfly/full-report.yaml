  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Logic
        blocks:
          - type: paragraph
            body: >-
              Betterfly operates across several adjacent spend pools, so the first diligence task is to define what
              market it is actually in. Official Betterfly pages position the product as an employer-paid platform that
              bundles insurance, preventive health services, daily engagement, HR analytics, and rewards. That means the
              most relevant boundary is not pure digital insurance, pure fitness benefits, or pure HR software in
              isolation. The closest investable boundary is employer-sponsored health-and-benefits operating spend:
              software, service, content, and carrier-linked products used by companies to improve wellbeing, retention,
              and claims or cost outcomes. Several market-report publishers estimate large global corporate-wellness
              markets, but those figures are not directly comparable because some include screenings, coaching, EAPs,
              fitness, analytics, or insurance-linked services while others focus on software or programs only. For
              Betterfly, the useful takeaway is category adjacency, not false precision. The company participates in a
              broad wellness-and-benefits TAM, a narrower employer-sponsored preventive-health-and-voluntary-benefits
              SAM, and a still narrower country-by-country SOM defined by insurance partnerships, broker channels, and
              employer willingness to deploy behavior-linked benefits.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
