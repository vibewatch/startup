              - CV039
      - number: '8.4'
        title: Recommendation and Diligence Gates
        blocks:
          - type: paragraph
            body: >-
              The resulting recommendation is research-more, with medium confidence and a high risk rating. That is not
              fence-sitting; it is the most honest response to a company that still has real strategic upside but
              insufficient public disclosure for high-conviction pricing. Betterfly has enough evidence of product
              reality, customer existence, and strategic agency to stay on an investor’s list. It does not have enough
              disclosed economics, cap-table visibility, or integration proof to justify a buy call at unknown terms.
              The valuation stance should therefore be “likely below the 2022 round, but still opaque.” What would move
              the call? Clearer post-Minu KPIs, customer-retention data by country, gross-margin evidence, runway
              transparency, and preference-stack visibility. Without those, the downside from false precision is greater
              than the upside from aggressive enthusiasm. Another way to frame the call is that Betterfly has already
              earned the right to serious diligence, but not yet the right to valuation complacency. The gap between
              those two states is exactly where investors most often make expensive mistakes in private growth rounds.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV038
              - CV039
              - CV040
