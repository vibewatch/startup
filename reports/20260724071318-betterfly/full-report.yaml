chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Betterfly’s current public positioning is much more specific than a generic “wellness app.” Its
              English-language homepage, employer page, employee page, and LinkedIn company profile all frame Betterfly
              as an employee benefits platform built on insurance, not simply a perk marketplace. Employers buy access
              for their workforce, employees receive guaranteed-issue or simplified-issue protection plus preventive
              health and rewards from day one, and the platform uses points, challenges, and healthier daily behavior to
              deepen usage between renewal cycles. The product bundle repeatedly combines insurance, preventive health
              services, behavioral engagement, and social-impact rewards, which is why Betterfly is best analyzed as an
              insurtech-enabled B2B2C employee benefits operating system. The company’s own materials also claim broad
              geographic reach and scale, but they do so with some tension: the About page still says Betterfly is
              present in eight countries and is the leading protection-and-benefits platform in Latin America, while
              LinkedIn now presents Miami as headquarters and the U.S. homepage emphasizes an American go-to-market
              push. The cleanest synthesis is that Betterfly was founded in Chile, built its first operating base in
              Santiago, and by 2026 is publicly managing the company as a multi-market platform with Miami as the face
              of U.S. expansion rather than a pure Chile-only operator.
