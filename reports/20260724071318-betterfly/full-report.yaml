  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction
        blocks:
          - type: paragraph
            body: >-
              Betterfly’s public materials describe a hybrid employer-benefits platform, not a narrow software widget.
              Employers buy a package framed around employee wellbeing, lower healthcare costs, better retention, and
              measurable ROI, while employees interact with the app through daily missions, rewards, and
              insurance-linked protection. That framing strongly suggests two monetization layers: recurring employer
              platform revenue and economics tied to the protection stack delivered through insurance partners. What the
              public file does not show is the split between those layers. There is no disclosed list pricing, realized
