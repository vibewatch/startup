  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: standard
    summary: Betterfly’s capital profile is defined more by what is missing than by what is disclosed.
    approximationNotes: Qualitative matrix because public sources do not provide current cash, burn, or debt values.
    claimRefs:
