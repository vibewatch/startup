      - number: '3.3'
        title: Distribution, Switching Costs, and Incumbent Power
        blocks:
          - type: paragraph
            body: >-
              The biggest competitive danger to Betterfly may not be a lookalike startup. It may be distribution power
              from broader HR suites and incumbent insurers. Rippling and Gusto explicitly pitch benefits inside payroll
              and core HR. Buk centralizes HR and finance for more than 10,000 clients and over 2 million users across
              five countries, giving it a strong installed-base route into benefits upsell. HiBob and beqom frame
              benefits and compensation inside one connected platform for HR and finance, which matters because employer
              buyers often prefer fewer vendors. On the insurance side, AXA and Zurich demonstrate scale, global client
              reach, and long-standing employee-benefit capabilities. Those incumbents may lack Betterfly’s public
              gamification and engagement story, but they do not need to replicate the entire product to pressure
              pricing or distribution. Betterfly therefore depends on proving that its insurance-led engagement loop
              creates enough participation and retention value to justify a dedicated category slot instead of being
              absorbed into a broader HR or carrier-led stack.
