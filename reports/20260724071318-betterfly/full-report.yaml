              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more is a price discipline call, not a quality dismissal
            body: >-
              Betterfly still has enough strategic substance to stay on the list, but public evidence does not support a
              high-conviction buy at unknown terms.
            calloutType: recommendation
            claimRefs:
