            body: >-
              Betterfly’s capital story is mixed. On one hand, the company’s 2022 unicorn financing and 2026 acquisition
              activity imply that it once commanded significant private-market support and still retained the ability to
              pursue strategic transactions. On the other hand, the March 2025 restructuring — five market exits plus
              staff reductions — shows that management was not behaving like a company with unlimited room for error.
              The strongest public signal is not a disclosed cash balance but a sequence of actions: retrench to
              concentrate on markets generating 94% of revenue, then redeploy into Mexico and the United States through
              a $100M acquisition and expansion push. That pattern supports the view that Betterfly still had capital
