        blocks:
          - type: paragraph
            body: >-
              Betterfly’s risk profile starts with regulation and privacy. The company sells insurance-adjacent employee
              benefits, operates across multiple countries, and uses a mobile app that surfaces health-related behavior
              data. That combination makes legal and regulatory risk structural, not incidental. Public materials show
              that Betterfly is aware of this burden: it publishes a privacy policy, references ISO-oriented
              information-security and quality systems, and offers a country-specific NOM-035 module in Mexico. Still,
              the public file is descriptive rather than dispositive. It does not show which entity bears regulated
              insurance risk in each market, whether any regulator has reviewed the model, or how privacy controls are
              implemented operationally. The main legal takeaway is therefore mixed: Betterfly appears conscious of
              compliance, but the most underwriting-relevant regulatory details remain private or indirect. Today.
