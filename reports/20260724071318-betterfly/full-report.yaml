  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Betterfly turns employer sponsorship and employee behavior into a blend of platform revenue, protection economics,
      and potential upsell revenue.
    approximationNotes: >-
      This is a mechanism map, not a quantified waterfall, because Betterfly does not publicly disclose
      revenue-line-item percentages.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI029
    data:
      nodes:
        - label: Employer buys Betterfly
          detail: HR / benefits team sponsors the platform to improve retention, health engagement, and ROI.
        - label: Employees complete missions
          detail: Workers use wellness missions and reward loops inside the app.
        - label: Platform subscription economics
          detail: Recurring employer revenue is implied but undisclosed publicly.
        - label: Insurance-linked economics
          detail: Coverage and partner-insurance layer likely generate commission or premium-share economics.
        - label: Rewards and analytics loop
          detail: Usage data supports ROI reporting and renewal narrative.
        - label: Minu cross-sell opportunity
          detail: Financial wellness modules can broaden wallet share after the 2026 acquisition.
        - label: Reported top-line proxy
          detail: GetLatka lists $72M ARR for 2024, but the underlying mix is undisclosed.
    tableRefs:
      - TI001
      - TI002
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: >-
      The key unit-economics chain is conceptually clear even though most values remain private, and Minu can increase
      wallet share only if activation converts into attach and renewal gains.
    approximationNotes: Nodes identify what management would need to prove rather than presenting fabricated public values.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI032
    data:
      nodes:
        - label: Employer acquisition
          detail: Sales and partner channels win an employer contract; CAC is not public.
        - label: Employee activation
          detail: Workers must actually use missions and benefits for the model to earn its keep.
        - label: Benefit attachment
          detail: Coverage, rewards, and partner products determine monetization depth.
        - label: Gross profit after partner costs
          detail: Carrier and broker economics likely absorb a meaningful share of value.
        - label: Renewal and expansion
          detail: Retention, wallet share, and multi-product adoption define revenue quality.
        - label: LTV / payback outcome
          detail: None of CAC, payback, or NRR is publicly disclosed today.
    tableRefs:
      - TI003
