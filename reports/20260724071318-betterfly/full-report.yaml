      - number: '3.4'
        title: Betterfly Relative Position and Durability
        blocks:
          - type: paragraph
            body: >-
              Relative to the field, Betterfly’s core differentiation is still conceptually strong: healthier actions
              translate into tangible insurance value, social donations, and rewards, not only app content or HR
              administration. That is more emotionally resonant than generic benefits marketplaces and more
              behavior-linked than traditional insurance bundles. Yet the moat is narrower than the category story
              implies. Wellhub can outflank Betterfly on network breadth and wellness content. HR suites can outflank it
              on embedded workflows and administrative gravity. Insurers can outflank it on product breadth and
              regulated capacity. The Minu acquisition improves Betterfly’s hand by adding financial wellness and
              Mexican client reach, but it also changes the burden of proof: Betterfly now has to show it can integrate
              acquired capabilities while staying differentiated from generalist benefits platforms. Competitive
              durability therefore rests less on slogans and more on whether Betterfly can make its insured engagement
              model measurably better than buying wellness from Wellhub, admin from an HR suite, and protection from a
              carrier or broker.
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
