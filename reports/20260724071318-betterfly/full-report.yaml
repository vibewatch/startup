      - number: '3.2'
        title: Capability and Workflow Comparison
        blocks:
          - type: paragraph
            body: >-
              Official competitor pages show why Betterfly’s hybrid model is defensible but not unassailable. Wellhub
              emphasizes a broad wellbeing network, app marketplace, and company-wide engagement with employer fees plus
              employee subscriptions. Rippling, Gusto, HiBob, and Buk emphasize benefits administration synchronized
              with payroll, employee records, and compliance; that creates a different but potent advantage because
              those platforms can reduce switching costs by living at the system-of-record layer. Deel is broader still,
              focusing on global HR, payroll, and compliance rather than a dedicated health-engagement experience. beqom
              and related compensation tools compete from the total-rewards angle, helping HR and finance teams make pay
              and incentive decisions, even if they do not replicate Betterfly’s insured engagement mechanics.
              Betterfly’s current advantage is that it fuses insurance, preventive-health prompts, rewards, and employer
              analytics into one narrative, but its current weakness is that many adjacent rivals already control either
              the payroll workflow, the HR data layer, or the consumer wellness catalog.
