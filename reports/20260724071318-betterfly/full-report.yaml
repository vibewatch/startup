        - Public negative evidence
        - What it implies
      rows:
        - label: Historical financing access
          values:
            - Unicorn round at reported $1B valuation
            - Investor details conflict across narratives
            - Past fundability does not guarantee present valuation support.
        - label: Operating discipline
          values:
            - Management concentrated on highest-revenue markets
            - Five market exits and layoffs show stress or at least caution
            - Company is actively reallocating, not simply scaling linearly.
        - label: Acquisition firepower
          values:
            - Betterfly bought Minu for a reported $100M
            - Funding source and integration budget are undisclosed
            - Capital flexibility exists, but balance-sheet comfort is unclear.
        - label: Revenue base
          values:
            - Public sources imply real employer and user scale
            - No public gross margin, NRR, or churn data
            - Scale is visible, quality of scale is not.
        - label: Runway confidence
