              - CV035
      - number: '8.3'
        title: Comparable Frame and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is useful here only as a bounding exercise. Wellhub is strategically relevant because
              it competes for the same employer wellness budget, but current valuation support is incomplete in the
              retained set. Oscar, Affirm, and PayPal provide public-market context showing that scaled health-insurance
              or fintech-adjacent platforms can trade at large market caps, yet each is structurally different from
              Betterfly. That means Betterfly cannot be valued as a direct insurer, nor as a pure SaaS platform, nor as
              a payments company. The company’s own marketing footprint across Mexico and Chile shows continued
              go-to-market investment and suggests Betterfly is not in runoff mode. But exit readiness still depends on
              showing cleaner retention, margin, and cap-table clarity than the public file currently provides.
              Investors can frame the opportunity, yet they cannot confidently close the valuation bridge from public
              evidence alone. In other words, comparables here are guardrails, not autopilots. They help show what
              Betterfly is not, which is nearly as important as guessing what it might become.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV025
