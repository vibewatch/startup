      - number: '2.2'
        title: Sizing Lenses and Geographic Relevance
        blocks:
          - type: paragraph
            body: >-
              The public market data reviewed here supports “large but methodology-sensitive” rather than one canonical
              TAM. Grand View Research, Fortune Business Insights, Mordor Intelligence, and Global Wellness Institute
              all frame employer wellness and broader wellness-economy spending as multi-billion-dollar categories with
              positive medium-term growth. The variation across these estimates is material, because publisher
              methodologies sweep in different services and geographies; however, they consistently point to the same
              strategic direction: employers are under pressure to spend more on prevention, engagement, and
              workforce-health support, even if that budget is fragmented across HR, benefits, and insurance.
              Betterfly’s own commercial reality is more constrained. The 2025 retrenchment report said 94% of revenue
              came from Chile, Mexico, and Spain, while the 2026 Minu acquisition and U.S. expansion comments show that
              management is concentrating on fewer, larger markets rather than blanket regional coverage. That implies
              Betterfly’s effective SAM is concentrated in formal employers and broker-insurer ecosystems in a handful
              of markets, not all global wellness spend.
