      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The reviewed source set makes the buyer map unusually clear. Betterfly’s official pages repeatedly target
              employers, HR teams, and brokers rather than consumers. Employers are the primary payers because they
              configure benefits and want measurable ROI on retention, engagement, and claims or healthcare-cost trends.
              Employees are the users, but their adoption depends on a consumer-grade experience: simple onboarding,
              visible coverage, incentives, and relevant health guidance. Brokers and insurers matter as channel
              amplifiers because Betterfly explicitly sells a broker portal and has historically relied on carriers such
              as Chubb and Icatu to support country expansion and insurance breadth. The segment logic also differs by
              company size. Forbes Mexico coverage says Betterfly explicitly targets SMEs as well as large corporates,
              while its newer U.S. employer marketing emphasizes enterprise clients and proof of measurable
              participation. The practical adoption path is therefore B2B2C with channel support: an employer or broker
              first justifies the budget, then the employee base has to repeatedly engage for the economics and renewal
              story to work.
