callouts:
  - calloutType: strength
    title: Scale now supports an infrastructure narrative
    body: |
      Socure’s official 2024-2026 metrics and customer logos support the argument that it has moved beyond a narrow
      onboarding tool into a broader identity-and-risk infrastructure layer. The combination of 3,000+ customers, 18 of
      the top 20 banks, 190+ countries, and public-sector penetration is unusual breadth for a private identity vendor.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO042
      - CO043
  - calloutType: risk
    title: Public-sector opportunity comes with policy and transparency scrutiny
    body: |
      The same public-sector expansion that strengthens Socure’s moat also creates a live diligence line around privacy,
      bias, explainability, and procurement governance. The New York criticism wave did not produce a disclosed enforcement
      action in the fetched set, but it is enough to treat transparency and controls as investment-relevant rather than
      cosmetic.
    claimRefs:
      - CO049
      - CO050
      - CO051
      - CO052
  - calloutType: insight
    title: Resist marking the company to opaque tracker pages
    body: |
      PitchBook and Forge are useful directional signals that Socure remains an actively watched late-stage company, but
      they do not expose a newer clean primary amount-and-valuation pair in the fetched evidence. Until management provides
      cap-table updates or a later priced round, the 2021 Series E should remain the canonical public valuation anchor.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO054
