  evidenceGaps:
    - type: missing-source
      severity: material
      topic: headquarters
      missingEvidence: Direct company confirmation of operating headquarters, legal headquarters, and any material secondary office footprint.
      whyItMatters: Headquarters and location concentration affect company-profile accuracy, hiring assumptions, and later regulatory/jurisdiction analysis.
      diligencePath: Request incorporation documents, principal-office designation, office lease list, and the current executive location map.
      relatedQuestionRefs:
        - QO003
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Current board roster, observer rights, committee structure, and investor-control documentation.
      whyItMatters: Public leadership visibility is not enough to assess governance quality, investor influence, or control concentration.
      diligencePath: Request current board deck cover page, cap-table summary with board rights, and governance charter excerpts.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO002
        - TO003
    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: Any post-2021 priced primary round, debt facility, tender structure, or management-confirmed current valuation.
      whyItMatters: Valuation stance and financing runway analysis should not rely on opaque secondary tracker signals alone.
      diligencePath: Request post-Series-E financing history, debt schedule, tender documentation, and latest board-approved valuation materials.
      relatedQuestionRefs:
        - QO011
        - QO025
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: Current employee count, functional split, and office-by-office distribution.
      whyItMatters: Headcount and location data are core maturity indicators and affect operating-leverage judgments later in the report.
      diligencePath: Request current org chart summary, HR headcount report, and active office list with primary functions.
      relatedQuestionRefs:
        - QO023
        - QO025
      relatedTableRefs:
        - TO001
    - type: conflicting-data
      severity: material
      topic: public-sector-scale
      missingEvidence: A dated, management-confirmed reconciliation of public-sector counts across states, agencies, higher-ed institutions, and total organizations.
      whyItMatters: Later chapters should not accidentally drift across incompatible count conventions when citing Socure's government footprint.
      diligencePath: Ask management to reconcile 13-state / 30+ agency / 20+ higher-ed / 2 federal claims against the newer 160 public-sector-organization framing.
      relatedQuestionRefs:
        - QO005
      relatedTableRefs:
        - TO001
        - TO004
