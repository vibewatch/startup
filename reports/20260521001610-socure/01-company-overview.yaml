company:
  name: Socure
chapter:
  number: 1
  title: Company Overview
  summary: |
    Socure is a private, AI-native identity verification and fraud prevention company whose official materials now frame
    RiskOS as an identity, fraud, risk, and compliance orchestration layer serving more than 3,000 customers across 190+
    countries. The strongest public financing anchor remains the November 2021 Series E ($450M at a $4.5B valuation),
    while Q1 2026 company-disclosed metrics point to $340M+ ARR, 62% year-over-year total new ARR growth, and 134% net
    dollar retention. Public evidence supports significant platform expansion through the Effectiv acquisition and federal
    authorization milestones, but headquarters, board composition, headcount, and any post-Series-E primary valuation all
    remain caveated.
sections:
  - id: identity-platform
    title: Identity, platform, and headquarters signal
    body: |
      Socure presents itself as an AI-powered digital identity verification and fraud prevention company, and its current
      web copy positions RiskOS as an AI-native platform that unifies identity, fraud, risk, and compliance workflows.
      That positioning matters because it shifts Socure from a point-solution vendor narrative into an infrastructure
      narrative: the company is selling identity proofing, fraud controls, decisioning, and regulatory workflows across
      onboarding and later lifecycle moments rather than only first-use CIP/KYC checks. The Effectiv acquisition extends
      that story by adding transaction monitoring, KYB, and underwriting-adjacent decisioning capabilities, giving the
      company a broader “risk engine” posture than its original identity-verification brand alone would imply.

      The reviewed source set supports a 2012 founding date and current private-company status, but headquarters should be
      treated carefully. Official 2026 web footers and BusinessWire datelines point to 885 Tahoe Blvd., Suite 1, Incline
      Village, Nevada as the strongest current address signal. At the same time, the public materials reviewed do not
      cleanly distinguish whether that Nevada location is the operating headquarters, a legal/mailing address, or a
      tax-efficient reporting location. Because later private-company trackers are incomplete and sometimes gated, chapter 1
      should preserve Incline Village as the strongest current public signal while explicitly flagging location certainty as
      unresolved rather than converting it into false precision for later chapters.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO047
      - CO048
      - CO055
    figureRefs:
      - FO002
  - id: leadership-governance
    title: Leadership, governance, and control points
    body: |
      Johnny Ayers remains the central leadership figure in the public record: he is the founder and CEO on the company
      page and the recurring spokesperson across 2024-2026 company announcements covering results, awards, and product
      positioning. That continuity is constructive for narrative discipline, but it also creates material key-person
      concentration because the public record routes product strategy, mission framing, and much of the company’s external
      credibility through a single founder-operator. Current official materials identify Matthew Thompson as President and
      Chief Commercial Officer and list Pablo Abreu, Rivka Gewirtz Little, Arun Kumar, Aviad Levin, Teneka Polite, and
      Eric Woodward in senior roles, giving investors enough visibility to see functional coverage across product,
      commercial, legal/privacy, technology, and people operations.

      Governance transparency is thinner than operating-leadership transparency. The current source pack does not surface a
      robust public board roster, committee structure, observer rights, or a clean control map beyond what can be inferred
      from historic investors and executive roles. Aviad Levin-Gur appearing as both General Counsel/Corporate Secretary
      and named DPO does provide a visible legal/privacy governance signal, but it is not a substitute for board-level
      disclosure. For diligence, the practical implication is that Socure’s public leadership bench looks real and current,
      yet the governance layer still needs direct management-room confirmation before chapter 1 facts are used as hard
      ground truth for later investment judgments.
    claimRefs:
      - CO015
