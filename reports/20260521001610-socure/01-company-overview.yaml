  - id: scale-public-sector-and-scrutiny
    title: Scale, public-sector breadth, and active diligence risks
    body: |
      On scale, the company is clearly larger and broader than a niche identity-verification startup. Official sources now
      say Socure serves more than 3,000 customers, counts 18 of the top 20 banks among them, operates across 190+
      countries, and serves 160 public-sector organizations. The 2024 results release added another important layer of
      evidence: 2.7 billion identity requests, 370 million unique identities, 42% customer growth to more than 2,800
      organizations, 54% GAAP revenue growth, and 16 new patent filings. Q1 2026 company-disclosed metrics then add
      $340M+ total ARR, 62% year-over-year total new ARR growth, 134% net dollar retention, and more than $31 million in
      new bookings. Those are meaningful proof points for commercial traction, but they are still company-disclosed rather
      than audited public-company metrics, so they belong in chapter 1 as high-utility anchors with medium confidence.

      The main caveat is not demand; it is scrutiny. New York lawmakers and allied advocates publicly questioned Socure’s
      data sourcing, fairness controls, and transparency in 2024, particularly for public-sector identity-verification
      deployments. StateScoop also reported Socure’s rebuttal: the company denied being a data broker and said humans are
      involved throughout the process. Socure’s responsible-AI and privacy materials show that management knows this is an
      important trust surface and is trying to articulate governance, fairness testing, and security controls. Even so,
      chapter 1 should carry policy and transparency scrutiny as a live diligence item because public-sector expansion can
      amplify both procurement opportunity and reputational/regulatory risk at the same time.
