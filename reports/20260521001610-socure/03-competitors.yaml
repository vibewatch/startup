- id: moat-durability-substitutes-and-adverse-evidence
  title: Moat durability, substitutes, and adverse evidence
  body: |-
    The central underwriting risk is that point identity proofing becomes more commodity-like even while overall category demand grows. Independent market reports and NIST both describe an escalating arms race around AI fraud, deepfakes, and morph attacks. That favors vendors with broader data and workflow context, but it also means raw document or liveness performance is unlikely to remain a long-lived moat on its own. Socure's answer is breadth: graph and consortium data, public-sector trust, first-party fraud, and KYB. The problem is that substitute pressure also rises with breadth. Alloy, Persona, and Sardine show that buyers can buy orchestration and fraud breadth elsewhere. Direct SSA access, Plaid Identity, TransUnion, and manual-review or bureau stacks show that narrower substitutes remain viable for specific workflows.

    Adverse evidence also matters here. New York lawmakers publicly challenged Socure's data sourcing, transparency, bias controls, and human-review practices in state deployments. Socure has responded that it is not a data broker, does not sell data for marketing, and tests for bias, but governance scrutiny still increases diligence burden in public-sector and highly regulated accounts. The result is a nuanced verdict: Socure likely has one of the strongest breadth-plus-trust stories in the reviewed set, but the moat is only durable if that breadth is translating into measurable displacement wins, deeper account penetration, and lower multi-homing than public sources currently reveal.
