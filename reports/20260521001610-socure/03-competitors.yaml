- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Cross-industry graph and consortium intelligence
    - Socure cites 5B identities seen, 3,000+ network companies, and a 190M-identity first-party consortium
    - Jumio also markets an Identity Graph, and orchestration vendors can add partner data over time
    - medium-high
    - Request win-loss evidence showing graph signals materially lift approval or fraud outcomes versus direct proofing peers
  - - Government and regulated-buyer trust
    - FedRAMP Moderate plus public-sector deployments give Socure procurement credibility
    - IDEMIA and Entrust also sell into trust-sensitive environments, and public-sector cycles are long and reference-driven
    - medium
    - Ask for federal and state renewal cohorts plus proof that trust posture shortens sales cycles or raises win rates
  - - Broad platform scope across KYC, fraud, KYB, and orchestration
    - Socure spans consumer IDV, document, consortium fraud, eCBSV, and business onboarding
    - Alloy, Persona, and Sardine show buyers can source workflow breadth elsewhere, and partner-heavy modules may be replaceable
    - high
    - Separate proprietary modules from orchestrated partner modules and review module-level attach rates and margins
  - - Inclusive and authoritative checks for thin-file populations
    - eCBSV and inclusive-verification claims differentiate versus bureau-first legacy flows
    - Buyers can access SSA directly or combine bureau, document, and manual-review tools themselves
    - medium
    - Quantify lift from eCBSV + graph versus direct SSA or competitor stacks in matched customer cohorts
  - - Implementation speed and self-serve packaging
    - RiskOS Launch and week-scale go-live claims reduce deployment friction
    - Veriff, Persona, and Mitek case studies also emphasize fast integration or mobile completion
    - medium
    - Review time-to-live and required services effort in competitive bake-offs
  - - Data governance and AI responsibility
    - Socure publishes responsible-AI principles and rebuttals to lawmaker criticism
    - Privacy scrutiny or bias concerns can slow public-sector and regulated adoption even if product performance is strong
    - high
    - Obtain model-governance docs, bias-test outputs, human-review policy, privacy complaints, and any state-agency remediation commitments
  notes: Severity reflects threat to differentiation durability rather than a claim of imminent share loss; substitute stacks, procurement inertia, and governance scrutiny are the most material risks.
