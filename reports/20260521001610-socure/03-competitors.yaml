callouts:
- calloutType: strength
  title: Rare mix of network scale and regulated-buyer trust
  body: Socure's most differentiated public combination is graph and consortium scale plus FedRAMP and eCBSV-backed trust. Several rivals can match pieces of that story, but few reviewed peers pair cross-institution data effects with explicit U.S. public-sector readiness on one platform.
  claimRefs:
  - CP022
  - CP023
  - CP038
- calloutType: risk
  title: Breadth is partly orchestration breadth, not only proprietary data
  body: Socure's platform breadth is meaningful, but some of it depends on partner data and integrations. That creates a real risk that sophisticated customers buy orchestration or authoritative checks separately and keep Socure as only one layer in a broader multi-vendor stack.
  claimRefs:
  - CP028
  - CP037
  - CP040
- calloutType: insight
  title: The biggest substitute is often internal build, not another startup
  body: Direct SSA checks, bureau data, and manual review still satisfy narrow onboarding needs for many regulated buyers. Socure's value proposition strengthens only when fraud complexity or inclusion requirements justify replacing that stitched-together status quo with a broader identity-risk layer.
  claimRefs:
  - CP020
  - CP021
  - CP031
