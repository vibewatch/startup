tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - RiskOS core decisioning layer
    - Fraud, risk, and platform teams
    - Clearly merchandised
    - Unifies identity, fraud, risk, and compliance into one orchestration layer
    - Need architecture detail on internal services, tenancy, and observability
  - - Socure Verify
    - Growth, onboarding, and compliance teams
    - Mature and heavily promoted
    - Passive identity verification with 400+ sources and strong Gen Z / mainstream coverage claims
    - Need independent false-positive and approval-rate evidence by segment
  - - Predictive DocV
    - Higher-risk onboarding and reverification teams
    - Mature module with published metrics
    - Fast document and biometric step-up with public true-accept and liveness disclosures
    - Need third-party benchmark detail and ongoing spoof-resistance data
  - - Graph Intelligence and consortium signals
    - Fraud strategy and data-science teams
    - Strategic differentiator
    - 220 features across 15 attributes and network-scale visibility into identity connections
    - Need evidence on customer-specific lift versus simpler rules engines
  - - eCBSV
    - Regulated onboarding teams
    - Specialized authoritative add-on
    - Direct SSA-backed match signal integrated into RiskOS
    - Need exact eligibility, cost pass-through, and fallback handling by customer tier
  - - Sigma First-Party Fraud
    - Payments, disputes, and fraud-ops teams
    - Expansion module
    - Consortium-driven lifecycle fraud scoring and alerts beyond account opening
    - Need production evidence on dispute-abuse and early-default reduction
  - - Business Onboarding / KYB
    - Commercial onboarding, AML, and risk teams
    - Newer but concrete expansion area
    - Single-API business verification, UBO checks, and sanctions screening using external partners
    - Need proof of partner depth, country coverage by workflow, and latency under load
  - - Socure Launch
    - Builders and early-stage product teams
    - New self-serve motion launched in 2026
    - Transparent pricing plus API or hosted-UI integration without a traditional enterprise sales cycle
    - Need evidence on docs completeness, sandbox depth, and conversion into enterprise accounts
  notes: Maturity here means public evidence depth and apparent commercialization, not independent customer-satisfaction or reliability proof for every module.
