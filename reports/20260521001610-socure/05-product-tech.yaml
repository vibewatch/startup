- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Socure solution
  - Measurable benefit
  - Limitation
  rows:
  - - Low-friction consumer onboarding
    - Start with passive identity, fraud, and watchlist checks
    - Verify plus orchestration and optional prefill
    - Higher approvals with limited friction for low-risk users
    - Public evidence is company-claimed rather than independently benchmarked
  - - Risky applicant step-up
    - Escalate only when signals warrant extra proof
    - Predictive DocV, selfie, liveness, and eCBSV where relevant
    - Keeps friction off most users while preserving stronger controls for edge cases
    - Exact threshold logic and fallback rates are not public
  - - First-party abuse and downstream fraud
    - Monitor legitimate-looking identities after account opening
    - Sigma First-Party Fraud with consortium scores and alerts
    - Extends trust decisions beyond day-one onboarding
    - No public post-deployment loss-reduction data by customer cohort
  - - Business and merchant onboarding
    - Verify entity, owners, and sanctions exposure in one flow
    - Business Onboarding with partner-fed KYB and UBO checks
    - Reduces manual business research and consolidates compliance steps
    - Coverage and quality depend on third-party provider depth
  - - Enterprise trust orchestration
    - Combine multiple internal and third-party signals into one decision flow
    - RiskOS plus Effectiv orchestration and case-management breadth
    - Lets teams consolidate fragmented tools and automate connected decisions
    - Post-acquisition integration depth is not yet visible publicly
  - - Builder self-serve onboarding
    - Prototype and deploy quickly without a full enterprise rollout
    - Socure Launch with API or hosted UI, test traffic, and usage pricing
    - Compresses time to market for startups
    - Public docs and SDK surface are still less visible than the marketed breadth
  notes: Benefits are workflow-level and mostly company-claimed; public sources are stronger on process design than on audited ROI.
