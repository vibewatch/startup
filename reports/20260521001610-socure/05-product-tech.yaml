  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: internal architecture transparency
    missingEvidence: Detailed engineering documentation on RiskOS service topology, tenant isolation, data retention, failover boundaries, and post-Effectiv component integration.
    whyItMatters: Platform-breadth claims are easier to market than to operate; underwriting technical risk requires proof that the stack is internally coherent and observable.
    diligencePath: Request architecture review materials, security-architecture diagrams, retention policy details, and a live engineering walkthrough covering pre- and post-Effectiv services.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability and incident evidence
    missingEvidence: Customer-facing SLA terms, service-credit history, uptime time series, and incident / postmortem artifacts for major reliability or security events.
    whyItMatters: Product maturity in trust infrastructure depends on how the platform behaves under failure, not just on certifications or headline performance statements.
    diligencePath: Request current SLA, historical uptime reports, bridge letters, incident register, and sample postmortems for material outages or control failures.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: public API and docs depth
    missingEvidence: A fuller public technical-docs surface showing endpoint coverage, SDKs, workflow examples, rate limits, and how Launch maps into broader enterprise configurations.
    whyItMatters: A real developer motion lowers integration risk; without deeper docs visibility it is hard to judge whether the public API surface matches the marketed platform breadth.
    diligencePath: Review current API docs, sandbox credentials, implementation guides, and sample code with product and solutions engineering teams.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: government deployment boundary
    missingEvidence: Explicit evidence on commercial versus government hosting models, whether private-cloud deployment exists, and what controls separate GovCloud or SocureGov from the main commercial environment.
    whyItMatters: Deployment model and boundary clarity matter for regulated customers evaluating residency, shared-services risk, and authorization inheritance.
    diligencePath: Request environment diagrams, authorization boundary documentation, and a comparison of commercial and public-sector deployment controls.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
