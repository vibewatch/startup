- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Socure's public architecture reads as a layered trust stack that starts with packaged workflows, passes through orchestration and specialized controls, and depends on graph data, partners, and authoritative systems underneath.
  data:
    layers:
    - label: Experience and packaging
      detail: Socure Enterprise for customized deployments; Socure Launch for self-serve builders with API or hosted UI
    - label: Workflow and decisioning
      detail: RiskOS orchestration, rules, scoring, approvals, declines, and step-up logic across customer lifecycle events
    - label: Specialized controls
      detail: Verify, Predictive DocV, Sigma fraud products, watchlist / compliance tools, eCBSV, and business-onboarding services
    - label: Graph and intelligence
      detail: Global Graph, Local Graph, consortium data, behavioral signals, and reason-code generation
    - label: Partner and data ecosystem
      detail: KYB partners, third-party integrations, imported customer data, external fraud tools, and partner APIs
    - label: Authoritative and standards layer
      detail: SSA eCBSV, sanctions / watchlist sources, and external identity-guideline expectations such as NIST SP 800-63-4
