- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Responsible AI framework
    - Publicly documented
    - Trustworthiness, transparency, accountability, and protection principles plus customer-in-the-loop usage
    - Need model-versioning, fallback, and escalation detail by product
  - - Model testing and human review
    - Publicly documented
    - Accuracy, false-positive, false-negative, true-accept/reject, stability, uptime, and investigator review processes
    - Need independent validation evidence product by product
  - - Certifications and privacy controls
    - Publicly claimed
    - SOC 2 and ISO 27001/27017/27018/27701 plus policy-hub, privacy-rights FAQ, DocV terms, and privacy-rights commitments
    - Need current reports, scope statements, product/control mapping, and exceptions rather than headline certifications and policy pages
  - - Public-sector authorizations
    - Publicly claimed
    - FedRAMP Moderate plus StateRAMP and TX-RAMP for public-sector offerings
    - Need exact environment boundary and inheritance model versus commercial stack
  - - DocV quality disclosures
    - Publicly quantified
    - 98.4% first-try verification, 0.92-second 95th-percentile response time, 98% liveness, 98.22% true-accept rate
    - Need third-party benchmark methodology and drift history
  - - Authoritative SSA eCBSV control
    - Publicly documented by Socure and SSA
    - Consent-based SSN / name / DOB verification with written-consent prerequisites, mismatch details, and death indications
    - Need customer economics, consent-capture workflow detail, and failure-handling evidence when SSA data is unavailable or mismatched
  - - NIST-aligned evolving identity requirements
    - External standard updated
    - Continuous evaluation and forged-media controls raise the bar for digital identity proofing
    - Need clear mapping from public product claims to control-by-control implementation
  notes: Public trust signals are real, but they are still summaries; the diligence ask is the underlying operating evidence.
