company:
  name: Socure
chapter:
  number: 5
  title: Product & Technology
  summary: 'Socure publicly presents a real identity-and-risk platform rather than a single KYC widget: RiskOS spans passive onboarding, document and biometric step-up, graph intelligence, first-party fraud, eCBSV, KYB/UBO, and—after Effectiv—broader orchestration across payments, AML, and credit. The public evidence supports meaningful module breadth, strong compliance and governance signaling, and a genuine builder surface through Launch, but it still leaves material diligence gaps around internal topology, tenancy boundaries, SLA history, and the exact maturity of the post-Effectiv integration.'
sections:
- id: product-surface-and-packaging
  title: Product surface and packaging
  body: 'Socure''s chapter-five story is no longer a single identity-verification widget. The company publicly presents RiskOS as a broad identity and risk operating layer with a visible split between enterprise deployments and a self-serve builder motion. On the surface, that means customers are not only buying passive identity resolution; they can mix consumer onboarding, document and biometric step-up, graph intelligence, first-party fraud, watchlist and compliance tools, eCBSV, and now business-onboarding utilities inside the same commercial frame. Launch matters because it turns that platform into a developer-facing product rather than a pure enterprise sales motion: builders can sign up, test real scenarios, integrate through API or hosted UI, and graduate into broader enterprise workflows later. That packaging is strategically important because it supports the thesis that Socure is trying to own the trust layer across customer size bands. The resulting product map looks real and monetizable,
    but public packaging still reveals less than diligence would want on module attach rates, enterprise packaging boundaries, and how much of the marketed breadth is deeply integrated versus commercially adjacent.'
  claimRefs:
