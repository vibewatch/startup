- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Signal ingestion and graph layers
    - Resolve identity, device, behavioral, and consortium signals into one profile
    - Access to data partners, consortium feedback, and graph infrastructure
    - Lift depends on data freshness, partner quality, and graph observability
  - - Decisioning and orchestration layer
    - Apply rules, scores, step-up logic, and connected workflows across the lifecycle
    - RiskOS core services plus Effectiv orchestration assets
    - Internal service topology and post-Effectiv integration depth are not public
  - - Document and biometric layer
    - Perform ID-document checks, liveness, and selfie verification when higher assurance is needed
    - Camera capture quality, model quality, device conditions, and anti-spoofing resilience
    - Public metrics exist, but ongoing red-team and spoof-resistance detail is limited
  - - Authoritative and compliance layer
    - Use eCBSV, watchlist, sanctions, and policy controls to strengthen regulated decisions
    - SSA service design, consent collection, and regulatory framework updates
    - Government-service latency, fee changes, or eligibility rules can affect product economics
  - - Business-verification partner layer
    - Verify entities and beneficial owners and enrich KYB workflows
    - Middesk, Baselayer, Kyckr, Markaaz, FIS, and other partner APIs
    - Coverage breadth depends on external providers and imported partner data quality
  - - Delivery and developer layer
    - Expose packaged workflows through enterprise deployments or Launch self-serve integrations
    - API, hosted UI, testing environment, and operational support motion
    - Public documentation depth and migration path from self-serve to enterprise remain incomplete externally
  notes: This is a public-evidence operating model rather than an internal engineering diagram.
