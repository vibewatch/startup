- id: trust-quality-and-compliance-controls
  title: Trust, quality, and compliance controls
  body: 'Socure''s public trust posture is stronger than its public internal-architecture disclosure. The company provides a substantive responsible-AI narrative that describes model governance, performance testing, fairness testing for fraud products, customer-facing reason codes, human review, and the continued presence of the customer in the decision loop. It also publicly claims a meaningful certification stack—SOC 2, ISO 27001, 27017, 27018, and 27701—plus FedRAMP Moderate and related state authorizations for the public-sector offering. Product-specific quality disclosures are also comparatively concrete for some modules: DocV publishes speed and true-accept metrics, the eCBSV materials clearly describe where an authoritative SSA signal fits in the flow, and Socure maintains a policy hub, privacy-rights FAQ, and DocV terms surface that make the company''s front-door consent and data-rights posture more legible. External standards matter here too. NIST''s updated identity-guideline package raises the bar on forged-media resistance and continuous evaluation, and SSA''s consent and fee rules remind buyers that authoritative verification is
    partly governed outside Socure''s control. What remains missing is the deeper diligence layer: audit scope detail, tenant-boundary specifics, and the operational evidence that turns good principles and policy pages into underwriteable engineering confidence.'
  claimRefs:
