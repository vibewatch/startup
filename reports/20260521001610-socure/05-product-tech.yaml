- id: maturity-dependencies-and-technical-risk
  title: Maturity, dependencies, and technical risk
  body: 'Public maturity signals are strong enough to support a real platform-breadth argument. Socure is now quoting $340M+ ARR, 134% net dollar retention, and more than 3,000 customers, while the 2024 results release showed 2.7 billion identity requests, 370 million unique identities, and continued patent output. Those are not engineering proofs by themselves, but they are consistent with a platform that is winning repeated use cases rather than a single-point sale. Category context also helps explain why Socure is broadening: market demand is shifting toward cloud-native orchestration, deepfake-resistant proofing, and lifecycle risk decisions, while competitors such as Jumio and Veriff increasingly market graph, AML, KYB, or cross-session intelligence too. The core diligence risk is therefore not whether Socure has enough surface area; it is whether the increasingly broad stack is as internally coherent, observable, and controllable as the outside narrative suggests. Public materials
    still leave unanswered questions on internal topology, uptime-history depth, documentation completeness, government-versus-commercial deployment boundaries, and how fully the post-Effectiv platform has been integrated into one operational system of record.'
