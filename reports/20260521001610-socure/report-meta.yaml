companyProfile:
  summary: >-
    Socure is a 2012-founded, privately held identity-and-risk infrastructure company led by founder-CEO Johnny Ayers.
    Its RiskOS platform now spans identity verification, fraud prevention, risk decisioning, compliance workflows, and,
    after the Effectiv acquisition, broader orchestration for KYB, AML, payments risk, and underwriting-adjacent use cases.
    Public evidence supports real scale—more than $340M ARR, 134% net dollar retention, 3,000+ customers, and expanding
    public-sector adoption—but the company still requires caveats on operating headquarters, current financing terms, and
    audited financial depth.
  foundedDate: '2012-01-01'
