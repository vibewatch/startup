      - number: '6.4'
        title: Public-sector adoption and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Public sector is simultaneously one of Socure’s most attractive customer segments and one of its most
              complicated. FedRAMP authorization expanded the company’s addressable federal footprint and management
              reports rapid public-sector growth after that milestone, while the public-sector page lists contract
              vehicles and a California Mortgage Relief case example that look more like production procurement
              infrastructure than one-off pilots. At the same time, state lawmakers in New York and Virginia publicly
              questioned Socure’s privacy practices, bias testing, human-review process, and procurement vetting. Those
              concerns do not disprove adoption, but they do show that public-sector expansion can be slowed by
              oversight, legal review, or additional transparency demands even when fraud pressure remains high. Broader
              government demand is real: GAO estimates hundreds of billions of dollars in annual federal fraud losses,
              SSA’s eCBSV program imposes operational steps and fees on financial-institution users, and NIST’s 800-63
              revision raises expectations for digital identity assurance and forged-media defenses. Socure’s
              public-sector customer opportunity is therefore durable, but not frictionless.
            claimRefs:
