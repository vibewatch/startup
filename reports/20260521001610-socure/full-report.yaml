              this is an

              important trust surface and is trying to articulate governance, fairness testing, and security controls.
              Even so,

              chapter 1 should carry policy and transparency scrutiny as a live diligence item because public-sector
              expansion can

              amplify both procurement opportunity and reputational/regulatory risk at the same time.
