      - number: '8.5'
        title: Final diligence asks, thesis-break triggers, and exit posture
        blocks:
          - type: paragraph
            body: >-
              The call stays at Research-More / Track because the remaining unknowns are exactly the ones that determine
              whether a high- growth private mark converts into an attractive investment outcome. Public evidence still
              does not disclose current gross margin, cash burn, CAC payback, audited ARR-to-revenue bridge, or the
              cap-table and preference stack created by any 2025 financing. Those omissions matter more than another
              product launch announcement because they decide whether common-equity holders participate in upside or are
              diluted by structure. The most important diligence asks are therefore mechanical, not rhetorical: current
              share count and preferred terms so secondary quotes can be translated into equity value; audited 2025 and
              Q1 2026 financials; retention by cohort and product; Effectiv cross-sell contribution; Launch conversion
              and CAC; and any procurement or regulatory correspondence tied to the New York concerns reported by
              StateScoop. Thesis-break signals are equally concrete: ARR growth falling below 30%, NDR dropping below
              120%, a financing below the 2021 round, a material public-sector investigation, or proof that
              orchestration and self-serve channels fail to convert into durable expansion. Without those answers, the
              best-supported posture is to monitor rather than force a precision entry or a near-term exit thesis.
