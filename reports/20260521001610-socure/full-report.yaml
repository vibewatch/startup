    rows:
      - - Socure
        - Broad identity-risk platform (subject)
        - 3,000+ customers; 190+ countries; public-sector and fintech depth
        - Regulated enterprises, fintechs, marketplaces, government
        - Graph + consortium data, eCBSV, first-party fraud, KYB, FedRAMP, Launch + Enterprise packaging
