      - number: '2.4'
        title: Growth drivers, constraints, and open questions
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers in Socure’s market are workflow changes, not just TAM slogans. NIST’s latest
              digital identity guidance explicitly expands fraud requirements and addresses forged media and injection
              attacks, while Socure’s own document-verification positioning shows why buyers are responding with more
              liveness and anti-spoof spending. In financial services, SSA eCBSV and the CFPB’s Section 1033
              implementation both increase the value of robust identity infrastructure and the operational burden around
              data access, consent, and interface quality. In the public sector, GAO’s fraud-loss estimate is large
              enough to keep identity verification and improper-payment prevention on real program budgets.
              First-party-fraud evidence adds another demand vector by extending the market beyond point-in-time
              onboarding. The main constraints are equally clear. Sensitive data handling brings privacy and security
              enforcement risk, public-sector procurement can slow around bias or performance challenges, and the
              retained adverse coverage shows that not every performance claim will go unchallenged. Most importantly
              for valuation, no retained public source cleanly isolates Socure’s pricing, segment mix, or serviceable
              market share. The right takeaway is therefore that the market is attractive and strategically important,
              but still hard to size precisely at the company level without management data.
