      - number: '2.2'
        title: Buyers, workflows, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than a simple bank-KYC story, but it is still concentrated in regulated and
              fraud-sensitive digital workflows. In financial services, Socure’s own banking and fintech pages describe
              the economic buyer as a mix of risk, compliance, fraud, and product owners who need to approve more
              legitimate users without creating manual-review drag. The same logic extends into public sector and higher
              education, where the workflow is less about customer acquisition and more about protecting benefits,
              refunds, admissions, aid, and access to public services. Federal, state and local, and higher-education
              pages all frame identity verification as a way to keep access open for legitimate users while reducing
              improper payments or applicant fraud. Business onboarding adds a second regulated wedge, because KYB and
              UBO checks move the platform into business-account approval rather than only consumer onboarding. The
              adoption path also broadens after day one. Socure’s first-party-fraud materials and consortium evidence
              imply that the relevant buying motion increasingly includes lifecycle abuse detection, not just the
              initial proofing event. That is why the market should be segmented by workflow and budget owner rather
              than by one abstract “identity” line item.
