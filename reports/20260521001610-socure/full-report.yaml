    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and headquarters signal
        blocks:
          - type: paragraph
            body: >
              Socure presents itself as an AI-powered digital identity verification and fraud prevention company, and
              its current

              web copy positions RiskOS as an AI-native platform that unifies identity, fraud, risk, and compliance
              workflows.

              That positioning matters because it shifts Socure from a point-solution vendor narrative into an
              infrastructure

              narrative: the company is selling identity proofing, fraud controls, decisioning, and regulatory workflows
              across

              onboarding and later lifecycle moments rather than only first-use CIP/KYC checks. The Effectiv acquisition
              extends

              that story by adding transaction monitoring, KYB, and underwriting-adjacent decisioning capabilities,
              giving the

              company a broader “risk engine” posture than its original identity-verification brand alone would imply.


              The reviewed source set supports a 2012 founding date and current private-company status, but headquarters
              should be

              treated carefully. Official 2026 web footers and BusinessWire datelines point to 885 Tahoe Blvd., Suite 1,
              Incline

              Village, Nevada as the strongest current address signal. At the same time, the public materials reviewed
              do not

              cleanly distinguish whether that Nevada location is the operating headquarters, a legal/mailing address,
              or a

              tax-efficient reporting location. Because later private-company trackers are incomplete and sometimes
              gated, chapter 1

              should preserve Incline Village as the strongest current public signal while explicitly flagging location
              certainty as

              unresolved rather than converting it into false precision for later chapters.
