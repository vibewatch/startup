            body: >-
              The public cost story is visible only in fragments. Socure's own materials point to continued AI and
              product investment, dependence on external data and sanctions/watchlist services, partner-fed KYB
              workflows, transaction-volume economics in eCBSV, and broader orchestration complexity after the Effectiv
              acquisition. That is directionally consistent with a software-led business that should enjoy good
              incremental economics, but not necessarily pure-software gross margins, because some value creation sits
              in third-party data, regulated workflow support, and implementation. Public comparables help anchor the
              range: Mitek's 2025 Form 10-K shows a scaled identity vendor with growing SaaS and service revenue but
              still meaningful sales and R&D spend, while CLEAR's public statistics show respectable but not ultra-high
              gross margin and only moderate revenue per employee.


              Capital adequacy is the chapter's hardest blocker. Company Overview owns the round chronology, but
              Financials still needs the financing facts that matter for forward underwriting: TechCrunch reported that
              the 2021 Series E brought total raised to $646M, while PitchBook's archived profile says $744M and also
              lists later debt and financing entries without public amounts. Socure also agreed to acquire Effectiv for
              $136M in late 2024. Yet no public source in the reviewed set discloses current cash, monthly burn, runway,
