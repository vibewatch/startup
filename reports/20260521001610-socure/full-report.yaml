      - number: '8.3'
        title: Comparable set, market backdrop, and thesis / anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Socure deserves a premium to pure point-solution identity vendors because the company is no longer selling
              only identity checks. Official company materials and transaction disclosures show a broader platform that
              spans identity verification, fraud prevention, sanctions screening, risk decisioning, orchestration, and
              now startup self-serve onboarding through Launch. That breadth matters in a market Mordor estimates will
              grow from $15.78B in 2026 to $26.8B by 2031, but it does not eliminate valuation discipline because the
              same report says no provider controls more than 15% of revenue. Gartner's inaugural Magic Quadrant also
              signals a crowded upper tier: Biometric Update reported leaders including Socure, Entrust, Jumio, and
              Incode, while competitor pages from Veriff, Jumio, Alloy, Persona, Entrust, IDEMIA, Mitek, and Sardine
              show meaningful breadth across lifecycle verification and fraud orchestration. Fresh public comps widen
              the valuation range further. Okta's FY2025 release showed 13% Q4 revenue growth and 25% RPO growth, yet
              May 2026 statistics still put it at about 5.35x sales and 4.63x EV/sales. CyberArk's current valuation
              table sat much higher at about 16.5x capitalization-to- revenue and 15.9x EV-to-revenue, while OneSpan sat
              near 1.94x capitalization-to-revenue and 1.77x EV-to-revenue. Private peer financing marks are also
              informative but stale: Veriff and Persona each publicized $1.5B valuations, Alloy said its September 2022
              extension valued the company at $1.55B, and Trulioo said its Series D priced at $1.75B. Those peer marks
              show that investors will pay up for identity and fraud infrastructure, but they also make Socure's 2021
              $4.5B round look exceptional rather than normal for the category. Socure can justify a premium to slower
              public names because its growth is materially stronger, but the broader peer set still argues for a wide
              valuation band and against paying an unquestioned 2021-cycle price.
