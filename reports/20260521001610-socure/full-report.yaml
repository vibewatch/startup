      - number: '8.2'
        title: Financing context and current price signals
        blocks:
          - type: paragraph
            body: >-
              The financing record is unusually asymmetric: the historical anchor is explicit, but the current one is
              not. TechCrunch reported that Socure raised a $450M Series E at a $4.5B valuation on November 9, 2021,
              bringing total funding at that time to $646M. PitchBook later showed Socure as a private company with a
              completed later-stage VC entry dated January 1, 2025, and total capital raised of $744M, but without a
              public post-money valuation. That means public evidence suggests another financing event likely happened
              after the Series E, yet does not prove whether it was an up round, flat round, structured round, or
              internal bridge. Secondary-market snippets are even weaker. Forge displayed a $3.81 per-share indicative
              mark on May 20, 2026, but expressly said Forge Price may rely on a very limited number of inputs and does
              not necessarily represent market price. Notice displayed a $3.60 stock headline without publishing
              methodology in the extracted text. PM Insights also advertises valuation and cap-table intelligence behind
              subscriber access rather than publishing a clean current mark. Taken together, these signals are
              directionally useful for caution but not strong enough to underwrite a firm enterprise value or
              common-equity outcome.
            claimRefs:
