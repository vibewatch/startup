  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Socure's public financial picture is much stronger on monetization logic than on audited disclosure. The
              company markets RiskOS as a broad identity, fraud, risk, and compliance layer sold across consumer
              onboarding, business onboarding, authentication, payment screening, and other lifecycle workflows, so the
              commercial model looks like a mix of enterprise platform contracts and variable decision volume tied to
              specific checks. Launch makes that logic concrete for the first time: Socure now publishes $1,000 per
              month in platform credits and packaged per-evaluation prices from $0.80 to $1.30, confirming that at least
              one go-to-market lane is explicitly usage priced. Business onboarding, eCBSV, and the post-Effectiv
              product set further imply monetization through add-on workflows, partner-fed verifications, and broader
              wallet share over time.


              That said, public pricing visibility is still narrow. Launch is list pricing for startup-ready packages,
              not proof of realized enterprise pricing, discount ladders, implementation fees, or revenue recognition
              policy. Socure does not disclose segment revenue, product mix, deferred revenue, or service versus
              software contribution. So the right underwriting conclusion is that a recurring and usage-based revenue
              engine is clearly visible, but the exact translation from product breadth into realized revenue quality
              still depends on contract-level diligence.
