      - number: '3.2'
        title: Capability, packaging, and budget overlap
        blocks:
          - type: paragraph
            body: >-
              Socure's public advantage is breadth. Its pages and results releases combine document and biometric
              proofing, graph intelligence, first-party fraud, eCBSV, business onboarding, and broader decisioning. By
              contrast, Jumio and Veriff look strongest where a buyer prizes high-confidence global proofing depth.
              IDEMIA looks strongest where incumbent trust, biometrics, and public-sector style requirements dominate.
              Alloy, Persona, and Sardine look strongest where the buyer wants configurable workflows, partner-data
              orchestration, sponsor-bank controls, or unified fraud operations more than one vendor's proprietary
              identity graph. Plaid Identity is the clearest narrow substitute: it can improve conversion and reduce
              downstream fraud in a matching flow without replacing the entire identity-risk stack.


              Pricing is far less transparent than product claims. Across the reviewed public surfaces, vendors
              overwhelmingly push demos, packaging tiers, automation claims, and ROI case studies rather than publish
              list prices. Socure's Launch packaging is useful because it lowers initial friction, but it is not
              uniquely defensible: Veriff emphasizes fast implementation, Persona emphasizes modular building blocks,
              and Mitek case studies emphasize faster mobile onboarding. The practical implication is that competitive
              pressure likely shows up through bundle scope, approval rates, manual-review savings, and implementation
              effort rather than through visible posted pricing. That makes realized pricing and discount discipline a
              key diligence gap even though the packaging comparison is directionally clear.
