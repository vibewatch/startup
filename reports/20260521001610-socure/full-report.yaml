  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute map
        blocks:
          - type: paragraph
            body: >-
              Socure does not compete against one clean peer set. The reviewed evidence breaks the field into four
              layers. First are direct proofing vendors such as Jumio, Veriff, IDEMIA, Entrust/Onfido, and Mitek that
              sell document, biometric, and identity-proofing workflows. Second are broader orchestration or fraud
              platforms such as Alloy, Persona, and Sardine that may not win every head-to-head document test but still
              compete for the same onboarding, compliance, and fraud budget. Third are narrower data or matching
              substitutes such as Plaid Identity and TransUnion TruValidate that can solve part of the job without a
              full platform purchase. Fourth are status-quo substitutes: internal rules engines, direct SSA checks,
              bureau data, and manual review queues.


              That structure matters because Socure's strongest claims are not about one isolated proofing check. Its
              public surface spans identity verification, document and biometric verification, graph intelligence,
              first-party fraud, eCBSV, and business onboarding. The company therefore wins best when a buyer wants one
              identity-risk layer across multiple workflows. It loses more easily when the customer only needs one
              proofing module, one authoritative check, or an orchestration shell wrapped around existing data vendors.
              The category also looks increasingly mature rather than startup-fragmented: Gartner's inaugural Magic
              Quadrant places Socure, Jumio, and Entrust among the scaled leaders, while Mitek and Persona sit in
              adjacent but still relevant positions.
