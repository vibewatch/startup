  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation framework
        blocks:
          - type: paragraph
            body: >-
              Socure clears the quality bar for continued diligence but not the price bar for an affirmative buy
              recommendation on public evidence alone. The operating case is strong: Business Wire said Socure exited Q1
              2026 with $340M+ total ARR, 62% year- over-year growth in total new ARR, more than $31M in bookings, 134%
              net dollar retention, and more than 3,000 customers. That evidence supports a real growth platform rather
              than a purely narrative-driven company. The valuation problem is that the last clean primary anchor is
              still the November 2021 Series E at $4.5B. Using the disclosed $340M+ ARR base, that mark implies at least
              roughly 13.2x ARR. Fresh public identity-software references widen the range: Okta's May 2026 statistics
              showed about 5.35x sales and 4.63x EV/sales, CyberArk's 2025 valuation table showed about 16.5x
              capitalization-to-revenue and 15.9x EV-to-revenue, and OneSpan sat near 1.94x capitalization-to-revenue
              and 1.77x EV-to-revenue. That spread means a premium is possible, but only for companies with unusually
              strong mission-critical positioning and economics. Because later funding terms are not public and
              secondary prices are methodologically weak, the most supportable recommendation is Research-More / Track
              with medium confidence and high risk. Price discipline matters more than company quality here: a lower
              entry point or better evidence could move the call, but a fresh round near or above $4.5B is
              under-evidenced today.
            claimRefs:
              - CV010
              - CV011
