  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Socure’s typical journey begins with a fraud or compliance trigger, lands through an onboarding workflow, and then
      expands into broader lifecycle risk products once trust and integration are established.
    data:
      nodes:
        - id: trigger
          label: Fraud / compliance trigger
          detail: >-
            Bank, fintech, gaming, or agency team identifies rising fraud losses, onboarding friction, or compliance
            pressure.
        - id: evaluation
          label: Evaluation
          detail: >-
            Buyer tests onboarding, document, fraud, or public-sector modules against existing legacy checks and manual
            review load.
        - id: initial-land
          label: Initial land
          detail: >-
            Customer launches consumer onboarding, account opening, or resident verification workflow as the first
            production use case.
        - id: go-live
          label: Go-live
          detail: Management says average go-live has fallen from roughly six months to a few weeks on RiskOS.
        - id: lifecycle-use
          label: Lifecycle usage
          detail: >-
            Use expands into authentication, payments, account changes, watchlist screening, or program-integrity
            workflows.
        - id: cross-sell
          label: Cross-sell
          detail: >-
            Customers add business onboarding, eCBSV, consortium products, or public-sector modules as trust and
            requirements deepen.
        - id: renew-expand
          label: Renew / expand
          detail: 134% NDR implies surviving customers are increasing spend or usage even though public GRR is missing.
    approximationNotes: >-
      Journey stages are inferred from company workflow pages, deployment examples, and disclosed go-live language
      rather than from a published sales-process diagram.
    claimRefs:
      - CU011
      - CU014
      - CU016
      - CU028
      - CU044
      - CU051
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Socure’s adoption path is best represented as a flow because public evidence supports sequential deployment stages
      but not reliable public conversion percentages between them.
    data:
      nodes:
        - id: problem
          label: Problem discovery
          detail: Buyer seeks lower fraud, faster approvals, or stronger compliance in a regulated workflow.
        - id: pilot
          label: Workflow evaluation
          detail: Customer assesses onboarding, fraud, or government identity proofing modules.
        - id: deploy
          label: Initial deployment
          detail: >-
            Socure lands in onboarding, benefits access, or account creation; named examples include Lili, Betterment,
            Public, and public-sector agencies.
        - id: operate
          label: Operational usage
          detail: >-
            Billions of identity requests and hundreds of millions of identities indicate live production traffic across
            the network.
        - id: expand
          label: Expansion
          detail: RiskOS, business onboarding, and consortium tools extend the relationship beyond the first workflow.
        - id: renew
          label: Retention test
          detail: NDR is disclosed, but public cohort and churn data are not.
      edges:
        - from: problem
          to: pilot
          label: Fraud / compliance need
        - from: pilot
          to: deploy
          label: Selected workflow
        - from: deploy
          to: operate
          label: Go live
        - from: operate
          to: expand
          label: Cross-sell / higher volume
        - from: expand
          to: renew
          label: Retention and upsell
    approximationNotes: >-
      A flow is used instead of a numeric funnel because public sources disclose customer scale and outcomes but not
      stage-by-stage conversion rates.
