  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Consumer identity proofing and onboarding
        - >-
          Identity verification, identity proofing, orchestration, approval automation, document and biometric checks at
          account opening
        - Generic CRM, marketing attribution, or payments processing disconnected from identity decisions
        - Risk, compliance, fraud, product, and onboarding teams
        - Core Socure wedge and the clearest entry workflow
      - - Document verification and liveness
        - ID document capture, biometric comparison, passive liveness, spoof or injection defense, exception handling
        - Standalone capture utilities with no identity graph or fraud decisioning layer
        - Fraud, trust, compliance, and digital onboarding teams
        - Included because Socure packages DocV inside the same trust stack
      - - Identity-linked fraud decisioning
        - >-
          Synthetic identity, first-party fraud, account takeover prevention, risk scoring, device and behavior signals
          tied to identity
        - Pure transaction monitoring or chargeback tools with no identity proofing context
        - Fraud and risk teams, sometimes shared with product or payments
        - Important adjacency because the workflow extends beyond day-one KYC
      - - Business onboarding / KYB
        - Business entity verification, UBO verification, sanctions and watchlist screening, KYB orchestration
        - General procurement software or legal-entity management disconnected from onboarding
        - Compliance operations, business onboarding, B2B risk teams
        - Meaningful adjacency that broadens Socure beyond consumer-only verification
      - - Public-sector access and benefits verification
        - Identity checks for benefits, taxes, aid, admissions, refunds, and digital public-service access
        - General cloud security spend or agency modernization projects with no identity proofing layer
        - Program integrity, digital services, CIO, agency fraud teams
        - High-value vertical because improper payments and fraud losses are large
      - - Status quo substitutes and excluded adjacencies
        - N/A
        - >-
          Manual review, legacy KBA, bank-owned utilities, generic IAM, transaction-only fraud tools, and pure AML
          monitoring when they are not integrated into identity proofing
        - Existing internal operations or incumbent vendors
        - These are real alternatives, but they should not be counted as included Socure TAM without workflow overlap
    notes: >-
      Boundary is intentionally narrower than generic trust infrastructure. Included spend must sit inside digital
      identity proofing or identity-linked fraud decisions; excluded categories are substitutes or adjacencies, not
      additive TAM.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM025
      - CM026
