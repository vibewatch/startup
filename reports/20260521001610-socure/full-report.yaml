      - number: '5.2'
        title: Workflow and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The most useful way to understand Socure is as an adaptive workflow engine rather than as a static
              compliance tool. Consumer onboarding can begin with passive identity, fraud, and watchlist checks, then
              escalate only where risk appears into document verification or other higher-friction steps. That same
              orchestration logic extends into first-party fraud monitoring, account-change or payment-risk events,
              and—after Effectiv—broader KYB, AML, payment-fraud, and credit workflows. The architecture disclosed
              publicly is therefore layered around signal aggregation, graph and consortium intelligence, specialized
              modules such as DocV and eCBSV, and a decisioning layer that decides when to approve, decline, or step up.
              Business onboarding reinforces this view because it is explicitly partner-driven: Socure leans on
              providers such as Middesk, Baselayer, Kyckr, and Markaaz to verify businesses and beneficial owners, while
              Effectiv adds a larger third-party orchestration surface. That breadth is a real product strength because
              it shortens integration count for customers, but it also means execution quality depends on outside data
              feeds, partner APIs, and regulated authoritative services as much as on Socure's own models.
