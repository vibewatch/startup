      - number: '8.4'
        title: Bull, base, and bear scenario valuation ranges
        blocks:
          - type: paragraph
            body: >-
              Scenario work is best done from current ARR rather than from stale financing optics. Using the disclosed
              $340M+ ARR base, a bear case around $1.8B-$2.8B corresponds to roughly 5x-8x ARR, which is where
              public-market discipline and financing reset risk start to matter if growth decelerates toward public
              comparables, cross-sell from Effectiv stalls, or a new round introduces material preference overhang. A
              base case around $3.0B-$4.1B corresponds to roughly 9x-12x ARR, paying a meaningful premium for superior
              growth, 134% NDR, and broader platform scope, but not paying for flawless execution or an IPO-ready margin
              profile that has not been publicly disclosed. A bull case around $4.8B-$6.5B requires continued >40%
              growth, 130%+ retention, clear proof that orchestration and Launch are expanding wallet share rather than
              merely widening narrative scope, and no punitive financing structure. In other words, the public record
              supports upside beyond the 2021 round, but only in the execution-heavy bull case. That asymmetry is why
              valuation sensitivity matters more than generic company quality in the recommendation.
