  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Socure's public architecture reads as a layered trust stack that starts with packaged workflows, passes through
      orchestration and specialized controls, and depends on graph data, partners, and authoritative systems underneath.
    data:
      layers:
        - label: Experience and packaging
          detail: Socure Enterprise for customized deployments; Socure Launch for self-serve builders with API or hosted UI
        - label: Workflow and decisioning
          detail: >-
            RiskOS orchestration, rules, scoring, approvals, declines, and step-up logic across customer lifecycle
            events
        - label: Specialized controls
          detail: >-
            Verify, Predictive DocV, Sigma fraud products, watchlist / compliance tools, eCBSV, and business-onboarding
            services
        - label: Graph and intelligence
          detail: Global Graph, Local Graph, consortium data, behavioral signals, and reason-code generation
        - label: Partner and data ecosystem
          detail: KYB partners, third-party integrations, imported customer data, external fraud tools, and partner APIs
        - label: Authoritative and standards layer
          detail: >-
            SSA eCBSV, sanctions / watchlist sources, and external identity-guideline expectations such as NIST SP
            800-63-4
    claimRefs:
      - CE001
      - CE002
      - CE014
      - CE018
      - CE019
      - CE034
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      The public operating flow starts with low-friction intake, applies passive identity and graph signals, escalates
      only when needed, and then keeps monitoring after onboarding.
    data:
      nodes:
        - id: n1
          label: User / business intake
          detail: Consumer or business submits lightweight identity or entity information
        - id: n2
          label: Passive identity and fraud checks
          detail: Verify, watchlist, device, and graph signals evaluate risk without immediate document friction
        - id: n3
          label: Graph and consortium scoring
          detail: Global Graph, Local Graph, and consortium features enrich the decision context
        - id: n4
          label: Step-up or authoritative proof
          detail: DocV, selfie, liveness, eCBSV, or owner-level KYB checks are invoked when risk requires more certainty
        - id: n5
          label: Decision and orchestration
          detail: RiskOS and Effectiv-style logic route approve, decline, review, or downstream workflow actions
        - id: n6
          label: Ongoing lifecycle monitoring
          detail: >-
            First-party fraud, payments, account changes, and other post-onboarding events keep using the same identity
            layer
