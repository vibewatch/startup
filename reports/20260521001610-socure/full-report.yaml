      - number: '3.3'
        title: Distribution, trust, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Socure's moat appears strongest where distribution and trust matter as much as pure algorithmic accuracy.
              The company says it serves more than 3,000 customers in 190+ countries, and its public-sector posture
              includes FedRAMP Moderate plus deployments across dozens of state agencies and several federal agencies.
              That matters because many competitors reviewed here can credibly claim APIs, biometrics, or workflow
              flexibility, but fewer can pair a cross-industry network narrative with explicit U.S. government
              authorization and an eCBSV wrapper for regulated onboarding. Socure's graph and consortium claims also
              help explain why its competitive shape differs from a simple document-verification bake-off: the public
              story is that the platform improves as more identities, fraud events, and institutions enter the network.


              Still, not every part of the moat is equally proprietary. Business onboarding depends partly on partners
              such as Middesk, Baselayer, Kyckr, and Markaaz. eCBSV itself is an SSA service that sophisticated buyers
              or intermediaries can access directly. Those details do not erase switching costs, but they do change
              their character. Switching costs look strongest when customers embed several Socure modules into one
              decision layer. They look weaker when a customer only buys one proofing check or one authoritative
              verification path. Public sources also do not show exclusive distribution or win-rate data, so
              multi-homing should be assumed until management proves otherwise.
