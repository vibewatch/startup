  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Public-sector privacy and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Socure's most acute legal and regulatory risk is not a disclosed enforcement action today; it is the
              combination of rising government adoption and recurring criticism that the company's data collection,
              controller-like graph intelligence, and AI screening could outrun public-sector transparency standards.
              New York Sen. Jeremy Cooney asked the state CIO how Socure had been vetted and whether its practices
              comply with privacy law, while Virginia Del. Cliff Hayes questioned data-rights handling, arbitration
              language, and VCDPA compliance. Socure's rebuttal — that it is not a data broker, that humans are involved
              throughout identity verification, and that it pressure-tests for bias — matters, but it does not remove
              the underlying scrutiny amplifier.


              Socure's own privacy policy says it often acts as processor for customer transactions while independently
              acting as controller for derived insights and network or graph-based risk intelligence. That split can be
              commercially powerful, yet it makes data-rights, retention, and procurement diligence more important as
              public-sector customers scale from dozens of agencies toward a 160-organization base. Overlaying FTC
              privacy and security theories, CFPB Section 1033 security and retention expectations, the FTC Safeguards
              Rule codified at 16 CFR Part 314, and SSA consent rules means the risk is best viewed as
              procurement-fragility risk rather than a single-case legal event. The separate DocV terms and privacy
              materials on Socure's policies page also show that product-surface growth increases the number of policy
              promises that must stay synchronized.
