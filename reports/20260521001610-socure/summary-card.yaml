summary:
  headline: >-
    Socure looks like a real, scaled identity-and-risk platform with unusually strong private-company growth evidence,
    but unresolved valuation, disclosure, and control-system questions keep the investment posture at track rather than
    buy.
  overallScore: 6.9
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 4500
    revenueRunRateUsdM: null
    arrUsdM: 340
    revenueGrowthYoYPct: 54
    grossMarginPct: null
    nrrPct: 134
    totalRaisedUsdM: null
    customerCount: 3000
    headcount: null
  topStrengths:
    - >-
      Unusually strong private-company operating proof: $340M+ ARR, 62% YoY total new ARR growth, 134% NDR, and 54% 2024
      GAAP revenue growth.
    - >-
      RiskOS plus Effectiv gives Socure a broader identity, fraud, compliance, and orchestration platform than a single
      KYC point solution.
    - >-
      Customer breadth is real: 3,000+ customers, 18 of the top 20 banks, 190+ countries, and meaningful public-sector
      traction after FedRAMP.
    - >-
      Graph, consortium, and authoritative signals such as eCBSV create workflow depth and cross-sell potential across
      onboarding and lifecycle fraud.
    - Launch adds a self-serve wedge that can widen acquisition and seed larger enterprise relationships over time.
  topRisks:
    - >-
      Public-sector/privacy scrutiny remains live, with New York and Virginia questions around data practices, bias
      testing, and procurement vetting.
    - >-
      Control-system maturity is only partly externally testable across biometrics, document verification, graph data,
      and 200+ integrations.
    - >-
      Core product value depends on external data networks and authorizations, including SSA eCBSV, partner KYB
      providers, consortium participation, and FedRAMP-style access.
    - >-
      Financial disclosure remains thin: no audited public financials, gross margin, cash burn/runway, gross retention,
      or customer-concentration disclosure.
    - >-
      Valuation is easy to overpay for: the last clean $4.5B 2021 round already implies a premium, while 2025 financing
      terms and cap-table preferences are undisclosed.
  unresolvedGaps:
    - Audited 2025 and Q1 2026 financials, including ARR-to-revenue bridge, gross margin, cash burn, and runway.
    - Gross retention, logo churn, contract terms, and customer or public-sector concentration by account and segment.
    - >-
      Current share count, preferred terms, 2025 financing details, and reconciliation of the $646M versus $744M
      total-raised figures.
    - Hard proof on Effectiv cross-sell, Launch conversion, and product-level unit economics by workflow.
    - Clear operating-HQ, board, and governance disclosure beyond the visible executive roster.
    - >-
      Any formal procurement, privacy, or remediation correspondence resolving the New York and Virginia scrutiny
      threads.
