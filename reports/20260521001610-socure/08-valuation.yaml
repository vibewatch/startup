  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-structure
      missingEvidence: Current share count, cap table, liquidation preferences, option pool, and any ratchets from the 2025 later-stage financing.
      whyItMatters: Secondary price snippets and any fresh private price cannot be converted into common-equity value without capital-structure detail.
      diligencePath: Request the latest cap table, board-approved financing terms, and fully diluted share-count bridge in the data room.
      relatedQuestionRefs: [QV003, QV004, QV021, QV023]
    - type: private-evidence-only
      severity: blocking
      topic: economics
      missingEvidence: Audited 2025 financial statements plus a Q1 2026 bridge for ARR, revenue, gross margin, burn, cash runway, and CAC payback.
      whyItMatters: The recommendation turns on whether public growth quality survives contact with real profitability and cash-consumption data.
      diligencePath: Request audited financials, monthly management accounts, and KPI definitions for ARR, bookings, and retention.
      relatedQuestionRefs: [QV005, QV006, QV007, QV023]
    - type: private-evidence-only
      severity: material
      topic: platform-monetization
      missingEvidence: Effectiv attach rates, AML and KYB revenue contribution, Launch funnel conversion, and product-level cohort expansion.
      whyItMatters: The premium case relies on platform breadth monetizing into durable wallet share rather than only broadening the story.
      diligencePath: Review post-acquisition integration KPIs, cohort retention by product, and Launch-to-enterprise upsell data.
      relatedQuestionRefs: [QV009, QV010, QV019, QV028]
    - type: missing-source
      severity: material
      topic: comparable valuation table
      missingEvidence: More current private peer marks with disclosed terms and a clean current primary Socure valuation; the fetched peer rounds here are mostly 2021-2022 and do not disclose today's structure.
      whyItMatters: The current comparable set is directionally much stronger, but it is still not rich enough to narrow the valuation band to a precision mark.
      diligencePath: Add 2025-2026 private financing memos, recent investor mark schedules, and any internal comparable set used by existing investors.
      relatedQuestionRefs: [QV016, QV017, QV018, QV024, QV025, QV026]
      relatedTableRefs: [TV004]
    - type: missing-source
      severity: material
      topic: public-sector-governance
      missingEvidence: Formal responses, procurement renewals, or agency correspondence resolving the concerns cited in the New York StateScoop report.
      whyItMatters: Public-sector upside is part of the growth narrative, and unresolved procurement or data-practice issues could alter the risk rating.
      diligencePath: Review agency renewal records, public-sector customer references, and any legal or compliance memos tied to the reported concerns.
      relatedQuestionRefs: [QV022, QV029]
