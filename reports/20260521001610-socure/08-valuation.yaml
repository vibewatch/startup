          value: 3400
          detail: Mid-base for strong growth with incomplete disclosure
        - label: 12x ARR
          value: 4080
          detail: High base if retention and breadth remain strong
        - label: 14x ARR
          value: 4760
          detail: Low bull and first clear break above the 2021 round
        - label: 16x ARR
