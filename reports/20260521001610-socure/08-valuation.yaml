        - label: Growth quality
          value: 9/10
          detail: 62% YoY new ARR growth and 54% GAAP revenue growth are elite public signals
        - label: Competitive insulation
          value: 6/10
          detail: Gartner leadership helps, but peer breadth is substantial
        - label: Evidence quality
          value: 4/10
          detail: Current valuation and financing terms remain under-disclosed
        - label: Capital structure transparency
          value: 3/10
          detail: No public share-count or preference-stack bridge
        - label: Valuation support
          value: 4/10
          detail: Premium is plausible, but public comps do not make $4.5B look obviously cheap
    approximationNotes: >-
      Scores are analytical judgments for investment committee framing rather than standardized external ratings. Higher is better.
    claimRefs: [CV020, CV021, CV022, CV023, CV024, CV043, CV044]

