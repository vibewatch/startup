schemaVersion: report-v2
artifact: valuation
slug: socure
runDate: '2026-05-21'
company:
  name: Socure
chapter:
  number: 8
  title: Valuation
  summary: >-
    Socure has enough operating proof to stay investable in principle—$340M+ ARR, 62% year-over-year total new ARR growth,
    134% net dollar retention, 54% GAAP revenue growth in 2024, and expanding platform scope through Effectiv and Launch—but
    public valuation support lags operating support. The last well-disclosed primary anchor remains the November 2021 Series E
    at $4.5B, while later financing terms are undisclosed and 2026 secondary signals are noisy and not convertible into an
    enterprise value without share-count and preference data. Recommendation: Research-More / Track; treat valuations near or
    above $4.5B as stretched and under-evidenced until cap-table, audited economics, and current financing details are disclosed.
sections:
  - id: valuation-framework
    title: Recommendation and valuation framework
    body: >-
      Socure clears the quality bar for continued diligence but not the price bar for an affirmative buy recommendation on public
      evidence alone. The operating case is strong: Business Wire said Socure exited Q1 2026 with $340M+ total ARR, 62% year-
      over-year growth in total new ARR, more than $31M in bookings, 134% net dollar retention, and more than 3,000 customers.
      That evidence supports a real growth platform rather than a purely narrative-driven company. The valuation problem is that
      the last clean primary anchor is still the November 2021 Series E at $4.5B. Using the disclosed $340M+ ARR base, that mark
      implies at least roughly 13.2x ARR. Fresh public identity-software references widen the range: Okta's May 2026 statistics
      showed about 5.35x sales and 4.63x EV/sales, CyberArk's 2025 valuation table showed about 16.5x capitalization-to-revenue
      and 15.9x EV-to-revenue, and OneSpan sat near 1.94x capitalization-to-revenue and 1.77x EV-to-revenue. That spread means a
      premium is possible, but only for companies with unusually strong mission-critical positioning and economics. Because later
      funding terms are not public and secondary prices are methodologically weak, the most supportable recommendation is
      Research-More / Track with medium confidence and high risk. Price discipline matters more than company quality here: a lower
      entry point or better evidence could move the call, but a fresh round near or above $4.5B is under-evidenced today.
    claimRefs: [CV010, CV011, CV037, CV038, CV044, CV050, CV055, CV056, CV057, CV063]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context
    title: Financing context and current price signals
    body: >-
      The financing record is unusually asymmetric: the historical anchor is explicit, but the current one is not. TechCrunch
      reported that Socure raised a $450M Series E at a $4.5B valuation on November 9, 2021, bringing total funding at that time
      to $646M. PitchBook later showed Socure as a private company with a completed later-stage VC entry dated January 1, 2025,
      and total capital raised of $744M, but without a public post-money valuation. That means public evidence suggests another
      financing event likely happened after the Series E, yet does not prove whether it was an up round, flat round, structured
      round, or internal bridge. Secondary-market snippets are even weaker. Forge displayed a $3.81 per-share indicative mark on
      May 20, 2026, but expressly said Forge Price may rely on a very limited number of inputs and does not necessarily represent
      market price. Notice displayed a $3.60 stock headline without publishing methodology in the extracted text. PM Insights also
      advertises valuation and cap-table intelligence behind subscriber access rather than publishing a clean current mark. Taken
      together, these signals are directionally useful for caution but not strong enough to underwrite a firm enterprise value or
      common-equity outcome.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV039, CV040, CV042]
  - id: comparable-set
    title: Comparable set, market backdrop, and thesis / anti-thesis
    body: >-
      Socure deserves a premium to pure point-solution identity vendors because the company is no longer selling only identity
      checks. Official company materials and transaction disclosures show a broader platform that spans identity verification,
      fraud prevention, sanctions screening, risk decisioning, orchestration, and now startup self-serve onboarding through
      Launch. That breadth matters in a market Mordor estimates will grow from $15.78B in 2026 to $26.8B by 2031, but it does
      not eliminate valuation discipline because the same report says no provider controls more than 15% of revenue. Gartner's
      inaugural Magic Quadrant also signals a crowded upper tier: Biometric Update reported leaders including Socure, Entrust,
      Jumio, and Incode, while competitor pages from Veriff, Jumio, Alloy, Persona, Entrust, IDEMIA, Mitek, and Sardine show
      meaningful breadth across lifecycle verification and fraud orchestration. Fresh public comps widen the valuation range
      further. Okta's FY2025 release showed 13% Q4 revenue growth and 25% RPO growth, yet May 2026 statistics still put it at
      about 5.35x sales and 4.63x EV/sales. CyberArk's current valuation table sat much higher at about 16.5x capitalization-to-
      revenue and 15.9x EV-to-revenue, while OneSpan sat near 1.94x capitalization-to-revenue and 1.77x EV-to-revenue. Private
      peer financing marks are also informative but stale: Veriff and Persona each publicized $1.5B valuations, Alloy said its
      September 2022 extension valued the company at $1.55B, and Trulioo said its Series D priced at $1.75B. Those peer marks
      show that investors will pay up for identity and fraud infrastructure, but they also make Socure's 2021 $4.5B round look
      exceptional rather than normal for the category. Socure can justify a premium to slower public names because its growth is
      materially stronger, but the broader peer set still argues for a wide valuation band and against paying an unquestioned
      2021-cycle price.
    claimRefs: [CV015, CV016, CV017, CV018, CV020, CV021, CV022, CV023, CV031, CV032, CV033, CV034, CV035, CV036, CV041, CV043, CV054, CV055, CV056, CV057, CV058, CV059, CV060, CV061, CV062, CV063]
    tableRefs: [TV002, TV004]
    figureRefs: [FV004]
  - id: scenario-analysis
    title: Bull, base, and bear scenario valuation ranges
    body: >-
      Scenario work is best done from current ARR rather than from stale financing optics. Using the disclosed $340M+ ARR base,
      a bear case around $1.8B-$2.8B corresponds to roughly 5x-8x ARR, which is where public-market discipline and financing
      reset risk start to matter if growth decelerates toward public comparables, cross-sell from Effectiv stalls, or a new
      round introduces material preference overhang. A base case around $3.0B-$4.1B corresponds to roughly 9x-12x ARR, paying a
      meaningful premium for superior growth, 134% NDR, and broader platform scope, but not paying for flawless execution or an
      IPO-ready margin profile that has not been publicly disclosed. A bull case around $4.8B-$6.5B requires continued >40%
      growth, 130%+ retention, clear proof that orchestration and Launch are expanding wallet share rather than merely widening
      narrative scope, and no punitive financing structure. In other words, the public record supports upside beyond the 2021
      round, but only in the execution-heavy bull case. That asymmetry is why valuation sensitivity matters more than generic
      company quality in the recommendation.
    claimRefs: [CV037, CV038, CV043, CV044, CV046, CV047, CV051, CV052, CV053]
    tableRefs: [TV003]
    figureRefs: [FV002, FV003]
  - id: diligence-and-triggers
    title: Final diligence asks, thesis-break triggers, and exit posture
    body: >-
      The call stays at Research-More / Track because the remaining unknowns are exactly the ones that determine whether a high-
      growth private mark converts into an attractive investment outcome. Public evidence still does not disclose current gross
      margin, cash burn, CAC payback, audited ARR-to-revenue bridge, or the cap-table and preference stack created by any 2025
      financing. Those omissions matter more than another product launch announcement because they decide whether common-equity
      holders participate in upside or are diluted by structure. The most important diligence asks are therefore mechanical,
      not rhetorical: current share count and preferred terms so secondary quotes can be translated into equity value; audited
      2025 and Q1 2026 financials; retention by cohort and product; Effectiv cross-sell contribution; Launch conversion and CAC;
      and any procurement or regulatory correspondence tied to the New York concerns reported by StateScoop. Thesis-break signals
      are equally concrete: ARR growth falling below 30%, NDR dropping below 120%, a financing below the 2021 round, a material
      public-sector investigation, or proof that orchestration and self-serve channels fail to convert into durable expansion.
      Without those answers, the best-supported posture is to monitor rather than force a precision entry or a near-term exit
      thesis.
    claimRefs: [CV024, CV042, CV044, CV045, CV048, CV049, CV050]
    tableRefs: [TV005, TV006]

tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - - Overall recommendation
        - Research-More / Track
        - Medium
        - High
        - Public evidence does not support paying confidently at or above $4.5B
        - Monitor, diligence, and demand either a lower price or materially better disclosure
      - - Operating proof
        - $340M+ ARR, 62% YoY total new ARR growth, 134% NDR, >3,000 customers
        - Medium
        - Medium
        - Strong enough to keep Socure on the list
        - Growth quality supports continued work but not valuation complacency
      - - Financing evidence
        - Series E $450M at $4.5B is still the last clean primary anchor; 2025 pricing is undisclosed
        - Medium
        - High
        - Under-evidenced
        - Do not treat later-stage VC references as proof of a markup without terms
      - - Secondary signals
        - Forge $3.81/share and Notice $3.60 are cautionary, not decisive
        - Low
        - High
        - Noisy / non-underwritable alone
        - Require share count and preferred terms before translating secondary quotes into value
      - - What moves the call
        - Audited economics, current cap table, and proof that Effectiv and Launch are expanding wallet share
        - Medium
        - Medium
        - Could justify a premium if delivered
        - Upgrade only after evidence closes the current diligence gaps
    notes: >-
      Recommendation is intentionally price-sensitive and evidence-sensitive. The key issue is not whether Socure is a strong
      company, but whether public evidence is sufficient to support a fresh entry price near or above the last disclosed 2021
      primary round.
    claimRefs: [CV010, CV011, CV037, CV038, CV039, CV040, CV044, CV048, CV050]

  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Growth quality
        - 2026 ARR, bookings, and 134% NDR show real expansion across a scaled customer base
        - Public data does not show whether that growth is durable after incentives, mix shifts, or margin pressure
        - Cohort retention, product-level expansion, and audited ARR-to-revenue bridge
      - - Platform breadth
        - Effectiv and Launch make Socure more than a single onboarding-check vendor
        - Orchestration breadth helps only if cross-sell converts into durable revenue and better unit economics
        - Cross-sell attach rates, Launch conversion data, and post-acquisition revenue contribution
      - - Competitive position
        - Gartner leadership and a broad product stack support premium positioning
        - Competitor pages show multiple well-funded vendors covering lifecycle identity and fraud workflows
        - Win-loss data and pricing durability against Entrust, Jumio, Veriff, Mitek, Persona, and others
      - - Market backdrop
        - The identity verification market is growing and remains fragmented
        - A large fragmented market does not by itself justify paying 2021-cycle prices in 2026
        - Proof that Socure is taking outsized share while preserving economics
      - - Governance / public sector
        - Public-sector expansion can diversify revenue and create defensibility
        - StateScoop's New York scrutiny signal shows procurement and data-practice risk cannot be ignored
        - Agency renewal data and any formal correspondence resolving the public concerns
    notes: >-
      The thesis is operatingly credible; the anti-thesis is mostly about price, disclosure quality, and competitive durability.
      Those are exactly the dimensions that determine whether a track name becomes an investable name.
    claimRefs: [CV010, CV011, CV015, CV016, CV017, CV018, CV020, CV021, CV022, CV023, CV024, CV041, CV043]

  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - ARR growth slows toward public-comp levels, NDR fades, and a new financing resets closer to public-market discipline
        - Roughly $1.8B-$2.8B, or about 5x-8x ARR on the current disclosed base
        - Down-round, preference overhang, failed Effectiv or Launch monetization, rising scrutiny
        - Material downside tail; cannot be ignored at a premium entry price
      - - Base
        - Growth remains strong but moderates, retention stays healthy, and platform breadth earns a premium without perfect execution
        - Roughly $3.0B-$4.1B, or about 9x-12x ARR
        - Missing margin disclosure, unclear cap-table terms, competition compressing pricing
        - Highest-likelihood zone on current public evidence
      - - Bull
        - ARR stays above $340M with >40% growth, NDR remains above 130%, and orchestration-led cross-sell proves out
        - Roughly $4.8B-$6.5B, or about 14x-19x ARR
        - Execution misstep could collapse the premium quickly because pricing already assumes strong outcomes
        - Low-probability but plausible only with continued exceptional execution
    notes: >-
      Scenario ranges are analytical estimates built from public ARR, public comparable trading references, and disclosed product
      breadth. They are not management guidance and should not be mistaken for a precision fair value.
    claimRefs: [CV037, CV038, CV043, CV044, CV051, CV052, CV053]

  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable / signal
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Socure Series E (Nov. 2021)
        - Last disclosed primary round
        - $450M raised at $4.5B valuation
        - Best hard primary anchor for entry discipline
        - 2021 growth-cycle pricing is stale versus 2026 public comps
      - - PitchBook later-stage VC entry (Jan. 2025)
        - Funding status
        - Completed later-stage VC listed; total raised shown at $744M; valuation undisclosed
        - Signals that capital likely remained available after Series E
        - Does not prove a markup, flat round, or structure
      - - Forge secondary signal (May 20, 2026)
        - Secondary share indication
        - $3.81 per share Forge Price
        - Live directional signal that is at least contemporaneous
        - Forge says the mark may rely on limited inputs and is not necessarily market price
      - - Notice secondary snippet
        - Secondary retail portal headline
        - $3.60 stock headline
        - Broadly consistent with Forge as a soft, direction-only signal
        - No published methodology or share-count bridge
      - - Effectiv acquisition (2024)
        - M&A transaction reference
        - $136M transaction for a risk-decisioning engine
        - Demonstrates Socure is buying platform breadth rather than only selling point solutions
        - Not a direct read-through to Socure equity value
      - - Okta public identity platform
        - FY2025 operating benchmark plus May 2026 trading stats
        - Q4 FY2025 revenue +13% YoY; roughly 5.35x sales and 4.63x EV/sales on May 20, 2026
        - Shows that scaled identity software can still trade at a premium without reaching 2021-cycle private marks
        - Broader IAM platform and public-company disclosure make it safer and lower-beta than Socure
      - - CyberArk public security / identity comp
        - 2025 market valuation
        - About 16.5x capitalization / revenue and 15.9x EV / revenue
        - Shows the upside case for a mission-critical identity-security asset with strategic scarcity
        - Cybersecurity and PAM mix are more security-heavy than Socure's identity-verification exposure
      - - OneSpan public trust / security software comp
        - 2026 market valuation
        - About 1.94x capitalization / revenue and 1.77x EV / revenue
        - Helpful lower-end anchor for slower-growth trust and digital-identity software
        - Product mix is less directly comparable to Socure's fraud and identity stack
      - - Veriff Series C
        - Private peer funding
        - $100M raised; $1.5B valuation; $200M total funding
        - Useful private-market reference for a scaled IDV specialist
        - January 2022 mark is stale and reflects narrower scope than Socure's current platform
      - - Persona Series C
        - Private peer funding
        - $150M raised at a $1.5B valuation
        - Supports willingness to pay premium software multiples for identity infrastructure
        - 2021-cycle pricing and different customer workflow mix limit read-through
      - - Alloy funding extension
        - Private peer funding
        - Additional $52M at a $1.55B valuation; company said revenue more than doubled over the prior 12 months
        - Good read-through for fintech-centric identity and fraud infrastructure demand
        - 2022 mark is stale and not a direct enterprise-value bridge for Socure
      - - Trulioo Series D
        - Private peer funding
        - $394M raised at a $1.75B valuation
        - Another large disclosed private identity benchmark below Socure's 2021 mark
        - 2021 cycle conditions were unusually favorable and the valuation is stale
      - - CLEAR Secure public reference
        - Public identity-adjacent comp
        - Archived Feb. 2026 stats showed ~5.15x P/S and 4.67x EV/Sales; CompaniesMarketCap later showed $8.28B market cap in May 2026
        - Shows premium public trading is possible for scaled identity infrastructure
        - Travel-heavy mix and sharp 2026 rerating make comparability imperfect
      - - Mitek Systems public reference
        - Public IDV / document-verification comp
        - ~$0.66B market cap on $179.7M FY2025 revenue, or about 3.7x sales
        - Useful lower-bound public comp for identity verification exposure
        - Slower growth and different product mix than Socure
    enumerationScope:
      coverage: partial
      basis: >-
        Selected reference set anchored on Socure's disclosed financing history, live secondary snippets, a platform-acquisition
        transaction, three public identity / trust software valuation references, and four disclosed private peer financing
        announcements fetched directly during this run.
    notes: >-
      This table is still partial because public evidence does not provide a clean current primary Socure valuation or 2025-2026
      private peer terms with disclosed structure. The added peer rounds show category appetite, not directly comparable current
      marks. Secondary prices are shown directionally and should not be treated as enterprise values.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV008, CV015, CV026, CV027, CV028, CV030, CV038, CV039, CV040, CV054, CV055, CV056, CV057, CV058, CV059, CV060, CV061, CV062, CV063]

  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth deterioration
        - ARR growth falls below 30%
        - Premium multiple support collapses toward public-comp discipline
        - Recut valuation to the bear range and pause investment work
      - - Retention slippage
        - Net dollar retention falls below 120%
        - The expansion-led thesis weakens and cross-sell value is in doubt
        - Reassess the base case and require customer-cohort evidence before proceeding
      - - Financing reset
        - New financing prices below the 2021 round or adds heavy preferences
        - Common-equity upside can be structurally impaired even if revenue keeps growing
        - Move stance from track to avoid unless terms are unusually protective
      - - Public-sector / governance event
        - Formal investigation, agency non-renewal, or substantiated data-practice finding
        - Risk rating rises and procurement-led growth assumptions weaken
        - Re-underwrite public-sector revenue and reputational downside immediately
      - - Platform monetization miss
        - Effectiv and Launch fail to generate durable cross-sell or lower-CAC growth
        - The breadth premium shrinks back toward point-solution valuation logic
        - Remove the bull case and anchor to public-comp multiples only
    notes: >-
      Kill triggers are intentionally measurable. The point is to make a valuation stance falsifiable before a fresh private round
      or secondary purchase is underwritten.
    claimRefs: [CV024, CV045, CV046, CV047, CV049]

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current cap table and share count
        - Full capitalization table, share classes, option pool, and share count
        - Secondary price snippets cannot be translated into equity value without this bridge
        - CFO / investor relations data room request
      - - 2025 and Q1 2026 financial bridge
        - Audited revenue, ARR bridge, gross margin, burn, and cash runway
        - The current recommendation turns on economics disclosure more than on narrative quality
        - Finance diligence; audited statements and management model review
      - - 2025 later-stage VC terms
        - Round size, lead investor, post-money, liquidation preferences, and any ratchets
        - Public evidence shows a round likely occurred but not whether it reset or supported valuation
        - Legal and financing diligence; term sheet or closing set
      - - Effectiv monetization
        - Cross-sell rate, orchestration attach, AML / KYB revenue, and product adoption cohorts
        - Platform-breadth premium depends on monetization, not just M&A headlines
        - Product and sales diligence with post-close KPI pack
      - - Launch economics
        - Conversion funnel, CAC, fraud-loss profile, and upsell path from self-serve to enterprise
        - Launch only supports valuation if it adds efficient growth rather than lower-quality volume
        - Growth analytics and cohort review
      - - Public-sector scrutiny resolution
        - Any correspondence, renewals, or remediation tied to the New York concerns
        - Public-sector upside should not be underwritten while governance or procurement questions remain open
        - Public-sector GM / legal diligence and agency reference checks
    notes: >-
      These asks are designed to close the exact evidence gaps that currently block a high-conviction buy call rather than to
      collect general diligence trivia.
    claimRefs: [CV009, CV024, CV039, CV042, CV048, CV050]

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Price-sensitive decision flow from operating proof and financing opacity to the current recommendation.
    data:
      nodes:
        - id: proof
          label: Operating proof ($340M+ ARR, 134% NDR)
          type: start
        - id: breadth
          label: Platform breadth strengthened by Effectiv plus Launch
          type: process
        - id: opacity
          label: Are current financing terms and cap table disclosed?
          type: decision
        - id: comps
          label: Do public comps justify paying near or above $4.5B today?
          type: decision
        - id: invest
          label: Conditional investable case
          type: end
        - id: track
          label: Research-More / Track
          type: end
        - id: pass
          label: Pass at premium price
          type: end
      edges:
        - from: proof
          to: breadth
          label: Yes — operating traction is real
        - from: breadth
          to: opacity
          label: Premium narrative exists
        - from: opacity
          to: track
          label: No — economics and terms still missing
        - from: opacity
          to: comps
          label: Yes — if disclosure arrives
        - from: comps
          to: invest
          label: Yes — price moves inside supportable range
        - from: comps
          to: pass
          label: No — price stays above evidence support
    approximationNotes: >-
      This flow simplifies a real diligence process into the two gating questions that matter most for this chapter: disclosure
      quality and price support versus public comp discipline.
    claimRefs: [CV037, CV039, CV040, CV044, CV048, CV049]

