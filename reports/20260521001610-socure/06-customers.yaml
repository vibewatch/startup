- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: 'Durability evidence exists, but it is uneven. The clearest current retention datapoint is management’s disclosure of 134% net dollar retention in Q1 2026, which strongly suggests land-and-expand economics within the installed base. That is consistent with Socure’s product design: customers can start with consumer onboarding and then add document verification, watchlist screening, eCBSV, business onboarding, first-party fraud controls, or public-sector program-integrity tools. Consortium products create another expansion vector because the value of the network rises as more institutions contribute data, and Socure’s Risk Insights Network page says customers and partners help build a collaborative ecosystem spanning more than 400 databases that continuously enrich the ID+ platform. However, the public record stops short of what an investor would want for a full durability underwrite. There is no public gross retention, logo churn, contract length, cohort table, or top-customer revenue disclosure in the materials reviewed, and the legal terms most readily available on Socure’s site are website Terms of Service rather than customer-specific MSAs or renewal schedules. That means expansion is visible, but base-retention quality and revenue concentration remain under-documented. The right interpretation is not that retention is weak, but that the current evidence set proves expansion better than it proves stickiness or concentration resilience.'
