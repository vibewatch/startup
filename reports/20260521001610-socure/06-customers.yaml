  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: An exhaustive, dated roster of named customers with production status and outcomes.
    whyItMatters: The named-customer proof table is intentionally a sample because Socure does not publish a complete public list with consistent outcome detail.
    diligencePath: Request a current top-customer / reference roster from management and validate a subset through reference calls or procurement records.
    relatedQuestionRefs:
    - QU008
    - QU010
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohorts
    missingEvidence: Gross retention, logo churn, contract length, and cohort retention percentages by segment.
    whyItMatters: NDR alone can overstate durability if expansion among remaining customers masks churn or weak renewal quality.
    diligencePath: Request billing-cohort exports and renewal schedules directly from management; do not infer cohort percentages from marketing materials.
    relatedQuestionRefs:
    - QU015
    - QU026
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top customer, top 10 customers, and public-sector share of ARR.
    whyItMatters: Logo breadth does not rule out revenue concentration, especially if a few banks or agencies account for disproportionate volume.
    diligencePath: Request a concentration schedule and compare it with public-sector contract calendars and renewal windows.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU005
    - TU006
  - type: conflicting-data
    severity: minor
    topic: public-sector-footprint-drift
    missingEvidence: A reconciled bridge from 2024 partnership counts to 2025 agency counts and 2026 organization counts.
    whyItMatters: Public-sector footprint is clearly growing, but disclosures use different units such as states, agencies, organizations, and partnerships.
    diligencePath: Ask management for a consistent public-sector customer taxonomy separating agencies, contract vehicles, and end-program deployments.
    relatedQuestionRefs:
    - QU005
    - QU020
  - type: private-evidence-only
    severity: material
    topic: independent-satisfaction-proof
    missingEvidence: Independent customer reviews, reference-call notes, or third-party renewal commentary.
    whyItMatters: Company-curated testimonials are useful but weaker than independent reference evidence when assessing satisfaction and renewal resilience.
    diligencePath: Collect direct references from banks, fintechs, and agencies; supplement with review exports if available.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: material
    topic: contract-structure-visibility
    missingEvidence: Customer-specific MSAs, renewal timing, termination rights, and minimum usage or volume commitments.
    whyItMatters: Socure’s public website terms are visible, but they do not reveal whether enterprise customer relationships are locked in by durable subscription terms or can churn quickly.
    diligencePath: Request a sample enterprise MSA plus one live public-sector contract and compare renewal, termination, and minimum-commitment language.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU006
