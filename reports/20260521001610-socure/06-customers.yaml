chapter:
  number: 6
  title: Customers
  summary: 'Socure has credible evidence of scaled adoption across financial institutions, fintechs, gaming platforms, and public-sector agencies, with management disclosing more than 3,000 customers and 134% net dollar retention in Q1 2026. The chapter’s main caveat is durability visibility: public materials prove logo breadth and selected deployment outcomes, but not gross retention, contract length, or customer concentration.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segment structure
  body: 'Socure’s paying customer base is broad rather than confined to a single identity-check niche. Company disclosures describe more than 3,000 customers across financial services, government, gaming, healthcare, telecom, marketplaces, and ecommerce, with especially heavy representation in banks, fintechs, and the public sector. The buyer is usually a risk, fraud, compliance, or digital-operations team; the end user is the applicant, account holder, resident, or enrolled consumer being verified; and the payer is generally the regulated enterprise or agency operating the workflow. That buyer-user-payer separation matters because it supports multi-product expansion: once an institution trusts Socure for onboarding, it can add authentication, account-change monitoring, payments screening, business onboarding, and consortium data products. Socure Launch also adds a down-market acquisition path for startups that need self-serve onboarding rather than an enterprise sales cycle, while business-onboarding
    products widen the platform from consumer identity into KYB and UBO verification. The result is a customer base that appears diversified by vertical and workflow, but still anchored in regulated or fraud-sensitive budgets.'
