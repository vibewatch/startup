- id: TU006
  title: Retention visibility and diligence gaps table
  columns:
  - Visibility area
  - Public evidence
  - What is missing
  - Why it matters
  - Next diligence step
  rows:
  - - Expansion versus retention
    - 134% NDR in Q1 2026
    - Gross retention and logo-retention breakdown
    - High NDR can mask weak core retention if expansion from surviving accounts is strong
    - Request NDR / GRR bridge by major segment
  - - Contract structure
    - Government pages show contract vehicles, and Socure’s public legal terms cover website/content use rather than customer subscriptions
    - Customer-specific MSA terms, renewal timing, termination rights, and usage or volume commitments
    - Longer terms make customer count more durable than annual transactional relationships
    - Review MSAs / public procurement terms for live accounts
  - - Customer concentration
    - Named customers show breadth but not revenue weight
    - Top-10 customer share and public-sector revenue percentage
    - A few very large bank or government accounts could dominate ARR
    - Ask management for customer concentration schedule
  - - Independent satisfaction proof
    - Customer quotes from Public, Green Dot, PrizePicks, and Lili
    - Independent review volume, reference calls, and renewal references
    - Company-curated testimonials do not fully substitute for third-party validation
    - Run reference calls and collect review-site exports
  - - Retention cohort figure
    - No public time-bucket cohort percentages found
    - Monthly or annual cohort retention percentages by segment
    - A cohort view would show durability and degradation over time
    - Request customer cohorts directly from management or billing system
  notes: This extra table intentionally substitutes for the planned cohort figure because the reviewed public sources do not responsibly support time-bucket retention percentages.
