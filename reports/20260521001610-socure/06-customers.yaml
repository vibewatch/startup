- id: named-customer-proof-and-usage
  title: Named customer proof and usage evidence
  body: Public customer proof is strongest when Socure combines named logos with a concrete workflow or measurable outcome. The most useful evidence in this chapter comes from company-hosted customer pages quoting Lili, Betterment, Dwellsy, Green Dot, and PrizePicks, plus a PRNewswire release quoting Public. Those examples show Socure being used in live onboarding, fraud prevention, or account-risk workflows rather than in vague “innovation” pilots. Lili’s testimonial speaks to higher auto-approval rates, Betterment’s case-study title claims a 30% lift in auto-approvals, Dwellsy’s title claims a 464% fraud-capture improvement, Green Dot describes consortium-based risk decisions, and Public says onboarding became faster and safer. Q1 2026 disclosures also name customers such as Coinbase, Federal Student Aid, HealthSherpa, Robinhood, Uber, and Western Union as contributors to new growth. The caveat is that most proof is company-curated. These references are valid as deployment evidence, but
    they do not independently prove renewal quality, contract size, or cohort retention.
