tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Large financial institutions
    - 'Buyer: fraud, compliance, digital banking; User: applicant / account holder; Payer: bank or FI'
    - Consumer onboarding, authentication, account changes, watchlist screening, first-party fraud
    - 18 of top 20 banks; consortium includes top U.S. financial institutions
    - Anchor enterprise accounts likely support multi-product expansion and large transaction volumes
    - No bank-by-bank revenue mix or average contract size disclosed
  - - Fintechs and neobanks
    - 'Buyer: risk / operations / compliance; User: end consumer; Payer: fintech platform'
    - Low-friction KYC, prefill, fraud scoring, sponsor-bank controls, business onboarding
    - 500+ fintechs in 2025 materials; 600+ by 2026 materials; Lili, Public, Robinhood, Dave, Green Dot named
    - High-growth cohort and natural fit for land-and-expand across onboarding and lifecycle risk
    - Public sources do not show net retention by fintech cohort
  - - Public sector
    - 'Buyer: agency program integrity / IT / procurement; User: resident / applicant; Payer: agency'
    - Benefits identity proofing, fraud prevention, account access, program integrity
    - 34 state agencies and 3 federal agencies in 2025; 160 public-sector organizations in Q1 2026 materials
    - Large strategic wedge because fraud pressure is acute and certifications can create barriers to entry
    - Adoption can be slowed by privacy, bias, and procurement scrutiny
  - - Gaming, marketplaces, and ecommerce
    - 'Buyer: trust & safety / fraud / operations; User: player, seller, or buyer; Payer: platform operator'
    - Fast onboarding, age / ID checks, fraud prevention, payout controls
    - Largest sportsbook operators named; PrizePicks and Dwellsy provide outcome proof; marketplaces highlighted in launch materials
    - Higher-frequency onboarding creates strong usage intensity and step-up opportunities
    - Vertical revenue concentration is not disclosed
  - - Startups via Socure Launch
    - 'Buyer: founder / product / risk lead; User: new applicant; Payer: startup'
    - Self-serve onboarding, sanctions screening, document step-up, payout workflows
    - Launch introduced March 2026 with self-serve signup and pay-as-you-go pricing
    - Broadens ICP and can seed future enterprise customers without full sales-cycle friction
    - Contribution of Launch customers to the 3,000+ total is undisclosed
  - - Business-onboarding / KYB users
    - 'Buyer: compliance / underwriting / payments risk; User: merchant or business owner; Payer: bank, fintech, lender, marketplace, or agency'
    - Entity verification, UBO verification, watchlist screening, business fraud checks
    - Business onboarding supports global verification via multiple data partners across 200+ countries
    - Adds a second wallet into existing customers that already trust Socure for consumer identity
    - Third-party data-provider dependence can affect coverage and economics
  notes: Rows synthesize company disclosures, named customer proof, and workflow pages; strategic value is inferred where revenue is not publicly broken out.
