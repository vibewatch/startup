- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Total ARR (Q1 2026)
    - '>$340M'
    - high
    - Establishes real commercial scale for a private company
    - Request audited ARR bridge by product, segment, and month
  - - Net dollar retention
    - 134%
    - high
    - Strong expansion is the clearest public proxy for revenue quality and land-and-expand efficiency
