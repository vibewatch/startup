- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Evidence quality
  - Implication
  - Diligence ask
  rows:
  - - Cash on hand
    - null
    - low
    - Current balance-sheet strength cannot be verified from public evidence
    - Request latest balance sheet, unrestricted cash, and debt cash restrictions
  - - Monthly burn
    - null
    - low
    - No public burn signal means runway cannot be underwritten
    - Request monthly burn bridge across payroll, cloud, data, sales, and G&A
  - - Runway months
    - null
    - low
    - Without burn and cash, the next-round trigger is inferential only
    - Request board runway model and downside scenario plan
  - - Latest clearly disclosed primary round
    - $450M Series E at $4.5B valuation in November 2021
    - medium
    - Confirms large historical capitalization but says little about current cash
    - Request post-Series-E cash uses and remaining proceeds by year
  - - Lifetime capital raised (public source-dependent)
    - $646M (TechCrunch 2021) vs. $744M (PitchBook snapshot)
    - medium
    - Source conflict must be reconciled before using any single total-raised figure
    - Request cap table and financing ledger reconciling equity, debt, and secondary events
  - - Strategic capital deployment
    - $136M agreed price for Effectiv acquisition in late 2024
    - medium
    - Shows meaningful cash deployment or financing capacity for platform expansion
    - Request acquisition consideration mix, integration cost, and earnout / retention obligations
  - - Later financing signals
    - PitchBook lists a 2023 debt-general event and a 2025 later-stage VC entry; amounts undisclosed
    - medium
    - Potentially important for leverage, dilution, or covenant risk
    - Request debt documents, maturity schedule, covenants, and any 2025 financing terms
  - - Next-round trigger
    - Not publicly disclosed; best public read is no obvious distress, but no verified runway
    - medium
    - The company may be self-funded enough for growth, or may still need financing for expansion or M&A
    - Request 24-month operating plan with base, upside, and downside financing triggers
  notes: Company Overview owns the full round chronology; this table focuses only on the financing facts needed to assess present capital adequacy.
