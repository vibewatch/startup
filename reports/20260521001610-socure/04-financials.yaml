- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Enterprise consumer onboarding on RiskOS
    - Enterprise platform plus workflow usage
    - Annual contract plus verification / decision volume
    - Clearly active across banks, fintechs, government, and marketplaces
    - Looks recurring and expansion-led, but product mix is undisclosed
    - Request ARR and gross margin by onboarding workflow and customer segment
  - - Socure Launch self-serve workflows
    - Usage pricing after monthly platform credits
    - Per evaluation plus monthly credits
    - Live in 2026 with public startup packaging
    - Best public pricing transparency, but current revenue contribution is unknown
    - Request Launch activation, paid conversion, and expansion into enterprise accounts
  - - Business onboarding / KYB / UBO
    - Single-API workflow with partner-fed data and compliance checks
    - Per business / owner workflow or custom contract
    - Publicly merchandised and positioned for banks, fintechs, and lenders
    - Potentially sticky, but partner pass-through could dilute gross margin
    - Request partner cost pass-through and attach rates versus consumer onboarding
  - - eCBSV authoritative step-up
    - Authoritative match/no-match check embedded in onboarding
    - Transaction / verification event
    - Live and positioned for higher-risk applications
    - Strong compliance value, but net economics depend on transaction cost and take rate
    - Request eCBSV unit margin, customer adoption rate, and pricing policy
  - - Lifecycle fraud, AML, payments, and credit workflows via Effectiv
    - Expanded orchestration platform beyond onboarding
    - Enterprise workflow volume and platform contract
    - Broadened materially after the 2024 acquisition
    - Can increase wallet share if cross-sell lands, but integration maturity still matters
    - Request standalone Effectiv ARR, churn, and cross-sell pipeline since acquisition
  - - Channel and partner-led distribution
    - Reseller, OEM, integration-partner, and sponsor-bank routes
    - Indirect distribution / referral economics
    - Publicly visible but financially opaque
    - Could lower CAC and widen reach, but contribution margin is undisclosed
    - Request sourced pipeline, revenue-share terms, and partner-led payback data
  notes: Public evidence identifies the main monetization lanes, but not product-level revenue mix or realized enterprise pricing.
