company:
  name: Socure
chapter:
  number: 4
  title: Financials
  summary: 'Socure shows unusually strong public growth signals for a private identity-infrastructure company: more than $340M ARR, 62% year-over-year total new ARR growth, 134% net dollar retention, and 54% GAAP revenue growth in 2024. The business appears to monetize through recurring enterprise workflows plus newly transparent self-serve usage pricing, but underwriting remains blocked by missing public cash, burn, gross-margin, pricing-realization, and customer-concentration data; required filing coverage is therefore satisfied through public-comparable identity-vendor filings rather than Socure filings, because Socure itself is private.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: |-
    Socure's public financial picture is much stronger on monetization logic than on audited disclosure. The company markets RiskOS as a broad identity, fraud, risk, and compliance layer sold across consumer onboarding, business onboarding, authentication, payment screening, and other lifecycle workflows, so the commercial model looks like a mix of enterprise platform contracts and variable decision volume tied to specific checks. Launch makes that logic concrete for the first time: Socure now publishes $1,000 per month in platform credits and packaged per-evaluation prices from $0.80 to $1.30, confirming that at least one go-to-market lane is explicitly usage priced. Business onboarding, eCBSV, and the post-Effectiv product set further imply monetization through add-on workflows, partner-fed verifications, and broader wallet share over time.

    That said, public pricing visibility is still narrow. Launch is list pricing for startup-ready packages, not proof of realized enterprise pricing, discount ladders, implementation fees, or revenue recognition policy. Socure does not disclose segment revenue, product mix, deferred revenue, or service versus software contribution. So the right underwriting conclusion is that a recurring and usage-based revenue engine is clearly visible, but the exact translation from product breadth into realized revenue quality still depends on contract-level diligence.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
