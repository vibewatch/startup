  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin and COGS split by data vendor costs, cloud, manual review, sanctions/watchlist services, and partner pass-through.
    whyItMatters: Strong ARR and NDR do not tell investors whether incremental revenue carries software-like margin or lower blended economics.
    diligencePath: Request FY2024 through Q1 2026 P&L detail with gross-margin bridge by workflow and by major cost bucket.
    relatedQuestionRefs:
    - QI011
    - QI013
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, operating cash flow, and runway forecast.
    whyItMatters: Capital adequacy and financing dependency cannot be underwritten from growth metrics alone.
    diligencePath: Request latest balance sheet, trailing twelve month cash flow statement, and board runway model under base, downside, and M&A cases.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-concentration
    missingEvidence: ARR and revenue by product, vertical, geography, and top customers, plus cohort retention by segment.
    whyItMatters: A business can look diversified in logos while still depending economically on a small set of customers or use cases.
    diligencePath: Request product P&L slices, top-20 customer revenue history, segment NDR, and churn / downgrade analysis.
    relatedQuestionRefs:
    - QI004
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-dilution-terms
    missingEvidence: Amount, maturity, covenants, collateral, warrants, and any preferred-share or later-stage financing terms for the 2023 debt and 2025 financing entries shown by PitchBook.
    whyItMatters: Undisclosed leverage or dilution can materially alter downside protection and post-money equity value.
    diligencePath: Request debt agreements, board approvals, capitalization table, and reconciliation of all primary, debt, and secondary transactions since 2021.
    relatedQuestionRefs:
    - QI019
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: enterprise-price-realization
    missingEvidence: Realized enterprise pricing, discount ladders, minimum commitments, services mix, and renewal uplift.
    whyItMatters: Launch list pricing is useful but not representative enough to underwrite the economics of the core business.
    diligencePath: Request sampled customer contracts, invoice history, implementation-fee treatment, and price-realization waterfalls by segment.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
