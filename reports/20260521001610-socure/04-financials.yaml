  - - Quarterly bookings
    - '>$31M in Q1 2026'
    - high
    - Shows current demand velocity, but not net cash collection
    - Request bookings-to-billings-to-revenue conversion by quarter
  - - 2024 GAAP revenue growth
    - 54% YoY
    - medium
    - Supports continued top-line momentum before the 2026 ARR snapshot
    - Request audited revenue by quarter to test consistency and seasonality
  - - ARR per customer floor
    - ~$113k+ using $340M ARR / 3,000 customers
    - medium
    - Useful lower bound on monetization density, but both inputs are threshold disclosures
    - Request full customer-count definition and revenue distribution by account size
  - - CAC payback
    - null
    - low
    - A core efficiency metric for underwriting go-to-market scalability
    - Provide fully loaded CAC, gross-margin-adjusted payback, and payback by channel
  - - Gross margin
    - null
    - low
    - Determines whether strong NDR converts into attractive incremental margin
    - Provide GAAP and non-GAAP gross margin with COGS split across data, cloud, manual review, and partner pass-through
  - - Channel economics
    - Public partner routes exist, but no economics disclosed
    - low
    - Indirect distribution can materially change CAC and sales productivity
    - Provide sourced pipeline, partner revenue share, and partner-led win rates
  notes: Threshold metrics come from company releases; null rows mark missing unit-economics disclosures that are material for underwriting.
