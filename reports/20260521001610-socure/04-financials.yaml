- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public best available proxy
  - Why it matters
  - Exact diligence path
  rows:
  - - Audited revenue and ARR bridge
    - Q1 2026 ARR snapshot plus 2024 GAAP revenue-growth release
    - Tests revenue quality, seasonality, and bookings conversion
    - Request audited FY2024-FQ1 2026 income statements and monthly ARR / revenue bridge
  - - Gross margin and COGS split
    - No direct disclosure; only external comparable benchmarks
    - Determines whether strong top-line growth converts into attractive unit economics
    - Request gross-margin bridge split across cloud, data, compliance, manual review, and partner pass-through
  - - Cash, burn, and runway
    - No public disclosure
    - Needed to judge financing dependency and next-round timing
    - Request latest balance sheet, cash-flow statement, and board runway model
  - - Product and vertical revenue mix
    - Public sources name use cases and sectors, not revenue contribution
    - Needed to assess concentration, pricing power, and moat durability
    - Request ARR by product, vertical, geography, and public-sector / private-sector split
  - - Customer concentration
    - Public logo lists and broad customer counts only
    - A few large banks or public-sector accounts could dominate revenue
    - Request top-20 customer revenue, gross margin, NDR, and churn history
  - - Debt terms and dilution mechanics
    - PitchBook shows later financing entries without amounts or terms
    - Potential hidden leverage or dilution can change equity value materially
    - Request debt agreements, warrant terms, and any 2025 financing documentation
  - - Realized pricing and services mix
    - Launch list prices only
    - List pricing is not enough to underwrite enterprise economics or revenue recognition
    - Request sampled contracts showing discounts, minimums, implementation fees, and renewal uplift
  notes: These are the highest-value missing disclosures for a serious underwriting review; most are private-company data-room asks rather than public-web research tasks.
