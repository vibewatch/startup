      - number: '2.2'
        title: 买方、工作流与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比简单的银行 KYC 故事更宽，但仍集中在受监管和欺诈敏感的数字工作流。在金融服务里，Socure 自己的银行和 fintech
              页面把经济买方描述为风险、合规、欺诈和产品负责人，他们需要批准更多合法用户，同时不制造人工审核拖累。同一逻辑延伸到公共部门和高等教育：工作流重点不再是获客，而是保护福利、退款、招生、助学金和公共服务入口。联邦、州和地方以及高等教育页面都把身份验证写成一种方式：让合法用户保持开放访问，同时减少不当支付或申请欺诈。企业开户提供第二条受监管楔子，因为
              KYB 和 UBO 检查把平台推进到企业账户审批，而不只服务消费者开户。采用路径在首日之后也继续扩宽。Socure
              的第一方欺诈材料和联盟证据暗示，相关采购动作越来越包含生命周期滥用检测，不只是初次核验事件。因此，市场应按工作流和预算负责人切分，而不是用一个抽象的“身份”科目概括。
