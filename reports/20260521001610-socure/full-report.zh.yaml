  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分部结构
        blocks:
          - type: paragraph
            body: >-
              Socure 的付费客户基础很宽，并不局限于一个身份检查小众场景。公司披露称客户超过 3,000 家，覆盖金融服务、政府、博彩、医疗、通信、市场平台和电商；银行、fintech
              和公共部门占比尤其重。买方通常是风险、欺诈、合规或数字运营团队；终端用户是被验证的申请人、账户持有人、居民或已注册消费者；付费方一般是运营该工作流的受监管企业或机构。买方、用户和付费方分离很重要，因为它支撑多产品扩张：一旦机构信任
              Socure 处理开户，就能增加认证、账户变更监控、支付筛查、企业开户和联盟数据产品。Socure Launch
              还为需要自助开户、而非企业销售周期的创业公司增加了下沉获客路径；企业开户产品则把平台从消费者身份扩展到 KYB 和 UBO 验证。结果是，客户基础在垂直和工作流上看起来多元，但仍锚定在受监管或欺诈敏感预算。
