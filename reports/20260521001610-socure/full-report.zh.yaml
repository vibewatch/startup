            body: >-
              耐久性证据存在，但不均衡。当前最清楚的留存数据点是管理层披露 Q1 2026 净美元留存 134%，强烈暗示存量客户内存在 land-and-expand 经济性。这与 Socure
              的产品设计一致：客户可从消费者开户开始，再增加证件验证、观察名单筛查、eCBSV、企业开户、第一方欺诈控制或公共部门项目完整性工具。联盟产品提供另一条扩张向量，因为随着更多机构贡献数据，网络价值会上升；Socure
              的 Risk Insights Network 页面称，客户和伙伴共同构建一个覆盖 400 多个数据库、持续丰富 ID+
              平台的协作生态。但公开记录没有给出投资人完整承销耐久性所需的信息。已审材料中没有公开毛留存、logo 流失、合同期限、cohort 表或大客户收入披露；Socure 官网最容易获取的法律条款是网站 Terms
              of Service，而非客户特定 MSA 或续约时间表。这意味着扩张可见，但基础留存质量和收入集中度仍缺乏文档。正确解读不是留存弱，而是当前证据集证明扩张的能力强于证明粘性或集中度韧性。
