      - number: '3.2'
        title: 能力、打包与预算重叠
        blocks:
          - type: paragraph
            body: >-
              Socure 的公开优势是广度。其页面和业绩发布把证件与生物识别核验、图谱情报、第一方欺诈、eCBSV、企业开户和更宽的决策能力放在一起。相比之下，Jumio 和 Veriff 在买方重视高置信度全球
              proofing 深度时更强。IDEMIA 在既有信任、生物识别和公共部门式要求占主导时更强。Alloy、Persona 和 Sardine
              在买方更想要可配置工作流、伙伴数据编排、发起行控制或统一欺诈运营，而不是某一家供应商的自有身份图谱时更强。Plaid Identity
              是最清楚的窄替代品：它能在匹配流程中提高转化并降低下游欺诈，而不替换整个身份风险栈。

              定价远比产品主张不透明。已审公开表面显示，供应商几乎都推 demo、打包层级、自动化主张和 ROI 案例，而不是公布标价。Socure 的 Launch
              打包有用，因为它降低初始摩擦，但并非独有防御点：Veriff 强调快速实施，Persona 强调模块化 building blocks，Mitek 案例强调更快移动开户。实际含义是，竞争压力大概率体现在
              bundle 范围、批准率、人工审核节省和实施工作量，而不是可见挂牌价。因此，已实现定价和折扣纪律是关键尽调缺口，尽管打包对比方向清楚。
