      - - 金融科技和数字银行
        - 购买方：风控 / 运营 / 合规；用户：终端消费者；付款方：金融科技平台
        - 低摩擦 KYC、预填、欺诈评分、合作银行控制、企业开户
        - 2025 年材料显示 500+ 家金融科技；2026 年材料显示 600+ 家；点名 Lili、Public、Robinhood、Dave、Green Dot
        - 高增长客户群，天然适合从开户扩展到全生命周期风险
        - 公开来源未显示金融科技客户群的净留存
      - - 公共部门
        - 购买方：机构项目完整性 / IT / 采购；用户：居民 / 申请人；付款方：机构
        - 福利身份核验、欺诈预防、账户访问、项目完整性
        - 2025 年有 34 个州级机构和 3 个联邦机构；2026 年 Q1 材料显示 160 个公共部门组织
        - 欺诈压力很急，认证又能制造进入壁垒，因此是大型战略切入口
        - 隐私、偏见和采购审查可能拖慢采用
      - - 游戏、市场平台和电商
        - 购买方：信任与安全 / 欺诈 / 运营；用户：玩家、卖家或买家；付款方：平台运营商
        - 快速开户、年龄 / ID 检查、欺诈预防、付款控制
        - 点名最大的体育博彩运营商；PrizePicks 和 Dwellsy 提供结果证明；发布材料突出市场平台
        - 更高频的开户带来强使用强度和补充验证机会
        - 未披露垂直收入集中度
      - - 通过 Socure Launch 覆盖的初创公司
        - 购买方：创始人 / 产品 / 风控负责人；用户：新申请人；付款方：初创公司
        - 自助开户、制裁筛查、文档补充验证、付款工作流
        - Launch 于 2026 年 3 月推出，提供自助注册和按量付费定价
        - 扩大 ICP，并可在没有完整销售周期摩擦的情况下培育未来企业客户
        - Launch 客户对 3,000+ 总数的贡献未披露
      - - 企业开户 / KYB 用户
        - 购买方：合规 / 承保 / 支付风险；用户：商户或企业所有者；付款方：银行、金融科技、贷款机构、市场平台或政府机构
        - 实体验证、UBO 验证、观察名单筛查、企业欺诈检查
        - 企业开户通过多个数据伙伴支持 200+ 个国家的全球验证
        - 在已经信任 Socure 消费者身份的现有客户里增加第二个预算入口
        - 第三方数据提供商依赖会影响覆盖和经济性
    notes: 各行综合公司披露、具名客户证明和工作流页面；未公开拆分收入时，战略价值为推断。
