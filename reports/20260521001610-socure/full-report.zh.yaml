  - id: TP001
    title: 竞争对手画像表
    columns:
      - 公司
      - 类别
      - 规模 / 范围
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Socure
        - 宽口径身份风险平台（研究对象）
        - 3,000+ 客户；190+ 国家；公共部门和金融科技深度
        - 受监管企业、金融科技公司、市场平台、政府
        - 图谱 + 联盟数据、eCBSV、第一方欺诈、KYB、FedRAMP、Launch + Enterprise 包装
        - 公开定价不透明；部分广度依赖合作伙伴；治理审查是仍需尽调的现实问题
      - - Jumio
        - 直接身份认证平台
        - 1B+ 笔交易；30M+ 个身份；5K+ 种 ID 类型
        - 全球受监管企业、旅游、游戏、金融科技
        - Identity Graph 加 AML 和编排；全球 ID 覆盖强
        - 在政府授权或第一方欺诈联盟深度上，公开证据少于 Socure
      - - Veriff
        - 直接身份认证平台
        - 3,000+ 家企业；230+ 国家；12.5K+ 种文件
        - 需要全球认证的数字企业
        - 自动化、全球文件覆盖、快速决策
        - 相比 Socure，KYB、政府和联盟广度的公开呈现更窄
      - - Alloy
        - 相邻的开户 / 风险编排
        - 800+ 家机构；270 个数据方案；195 个市场
        - 金融科技公司、发起银行、嵌入式金融
        - 工作流和合作伙伴数据编排能力强
        - 在文件 + 生物识别认证深度上，公开差异化不明显
      - - Persona
        - 模块化身份编排
        - 生命周期工作流、图谱和案件管理
        - 想配置 KYC、KYB 或员工流程的构建者
        - 灵活的构建模块和可配置流程
        - 公开规模和政府信任姿态不如 Socure、Jumio 或 IDEMIA 明确
      - - Sardine
        - 相邻的统一风险栈
        - 400+ 家企业客户；筛查 $1.3T+ 支付
        - 金融科技公司、商户、AML 和反欺诈团队
        - 行为与设备数据，加上 AML 和网络工具
        - 对权威身份认证和公共部门信任的公开强调较少
      - - IDEMIA
        - 既有认证 / 政府供应商
        - 500+ 种文件；195 个国家；全渠道生物识别
        - 大型企业和政府式工作流
        - 文件广度、生物识别、AML 观察名单、单一 API
        - 公开呈现对跨机构图谱或联盟效应着墨较少
      - - Entrust / Onfido
        - 整合后的既有认证对手
        - Gartner 领导者集合中的规模化认证供应商
        - 寻找成熟身份认证的企业
        - 既有厂商信任和认证可信度
        - 已审阅的公开呈现信息稀疏且以表单引导为主；整合后的集成路径仍需刷新
      - - Plaid Identity
        - 窄口径替代品
        - Identity Match 单点产品
        - 数字银行和金融科技开户团队
        - 快速匹配所有者，可提升转化并降低下游欺诈
        - 远窄于完整的身份风险与合规平台
      - - TransUnion TruValidate
        - 既有风险数据替代品
        - 大规模身份 / 设备 / 行为数据
        - 使用身份和欺诈数据层的企业
        - 多维查看身份、设备和行为
        - 已审阅页面停留在用例层面，没有透明披露具体产品深度或定价
      - - 内部自建 / 征信局 + 人工审核
        - 现状 / 内部替代品
        - 现有反欺诈运营团队，加上直接发卡方 API 或征信局数据
        - 工作流需求较窄的银行、贷款机构、政府机构
        - 无需采购完整平台，也能解决单一权威检查或人工例外路径
        - 集成成本高、控制碎片化、人工审核更慢，跨机构网络效应也更弱
    notes: 选取的 2026 年竞争集合覆盖直接认证同业、相邻编排供应商、既有替代品和主要内部自建路径；各行比较的是威胁形态，而非经审计收入。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected 2026 vendor and substitute set built from retained official competitor pages, market reports, and
        substitute evidence; not a census of every bureau, IAM, or regional verification vendor.
    claimRefs:
