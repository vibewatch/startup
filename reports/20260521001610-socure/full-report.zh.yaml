      - number: '8.2'
        title: 融资背景与当前价格信号
        blocks:
          - type: paragraph
            body: >-
              融资记录异常不对称：历史锚点很明确，当前锚点并不明确。TechCrunch 报道，Socure 于 2021 年 11 月 9 日以 $4.5B 估值完成 $450M Series E，当时总融资达到
              $646M。PitchBook 后来把 Socure 列为私营公司，并显示一条日期为 2025 年 1 月 1 日、已完成的后期 VC 记录，总募资
              $744M，但没有公开投后估值。这意味着公开证据显示，Series E 之后很可能又发生了一次融资事件，但无法证明它是上轮、平轮、结构化轮次，还是内部过桥。二级市场片段更弱。Forge 在 2026 年 5 月
              20 日展示 $3.81 的每股指示性标记，但明确表示 Forge Price 可能依赖非常有限的输入，且不一定代表市场价格。Notice 展示了 $3.60 的股票标题，但提取文本没有发布方法论。PM
              Insights 也只是把估值和 cap table 情报放在订阅访问之后，而不是发布干净的当前标记。合在一起，这些信号对谨慎有方向性参考，但不足以承销一个确定的企业价值或普通股结果。
