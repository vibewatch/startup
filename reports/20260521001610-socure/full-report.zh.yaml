      - number: '8.4'
        title: Bull、base 与 bear 情景估值区间
        blocks:
          - type: paragraph
            body: >-
              情景分析最好从当前 ARR 出发，而不是从陈旧融资观感出发。以已披露的 $340M+ ARR 为基数，bear case 约 $1.8B-$2.8B，对应约 5x-8x
              ARR；如果增长放缓到公开可比公司附近、Effectiv 交叉销售停滞，或新一轮引入实质性优先权包袱，公开市场纪律和融资重置风险就会开始发挥作用。base case 约 $3.0B-$4.1B，对应约
              9x-12x ARR，为更强增长、134% NDR 和更宽平台范围支付有意义溢价，但不为完美执行或尚未公开披露的 IPO-ready 利润率买单。bull case 约 $4.8B-$6.5B，需要持续 >40%
              增长、130%+ 留存，清楚证明编排和 Launch 在扩大钱包份额，而不是只扩大叙事范围，并且没有惩罚性融资结构。换句话说，公开记录支持高于 2021 年轮次的上行空间，但只在执行很重的 bull case
              中成立。这种不对称，正是估值敏感性比泛泛的公司质量更重要的原因。
