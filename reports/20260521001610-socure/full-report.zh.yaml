      - number: '4.2'
        title: 公开牵引与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Socure 的公开牵引信号对一家私有公司而言异常强。Q1 2026 材料提到总 ARR 超过 $340M、总新增 ARR 同比增长 62%、季度 bookings 超过 $31M、净美元留存 134%、客户超过
              3,000 家，并覆盖 190+ 个国家。2024 年业绩发布又补充了 GAAP 收入增长 54%、客户增长 42% 至 2,800 多家组织、27 亿次身份请求，以及 bookings
              和调整后经营利润超计划的表述。合在一起，这些都是真实商业规模、存量客户扩张和平台跨越单一窄验证场景变现的可信指标。

              销售效率仍只能推断，不能直接衡量。Launch 取消较小买方的销售电话和长期合同，可能降低创业公司客群获客成本；伙伴页面显示
              reseller、OEM、集成伙伴和发起行路径，可以在不完全线性增加直销人头的情况下扩展分销。但 Socure 不披露 CAC、回本周期、实施周期、按 cohort 的流失，或 Launch 向企业 upsell
              的转化。结果是：财务代理指标令人鼓舞，但还不是可完整承销的效率模型。
