      - 相关性
    rows:
      - - 消费者身份核验与开户
        - 账户开立时的身份验证、身份核验、编排、审批自动化、文档和生物识别检查
        - 与身份决策脱节的通用 CRM、营销归因或支付处理
        - 风险、合规、欺诈、产品和开户团队
        - Socure 的核心切入口，也是最清晰的切入工作流
      - - 文档验证与活体检测
        - ID 文档采集、生物识别比对、被动活体检测、防欺骗或注入、例外处理
        - 没有身份图谱或欺诈决策层的独立采集工具
        - 欺诈、信任、合规和数字开户团队
        - 纳入原因是 Socure 把 DocV 打包进同一信任栈
      - - 身份关联欺诈决策
        - 合成身份、first-party 欺诈、账户接管防控、风险评分，以及与身份绑定的设备和行为信号
        - 没有身份核验上下文的纯交易监控或拒付工具
        - 欺诈和风险团队，有时与产品或支付共用
        - 重要邻接，因为工作流延伸到首日 KYC 之后
      - - 企业开户 / KYB
        - 企业实体验证、UBO 验证、制裁和 watchlist 筛查、KYB 编排
        - 与开户脱节的通用采购软件或法人实体管理
        - 合规运营、企业开户、B2B 风险团队
        - 有意义的邻接，把 Socure 扩到消费者验证之外
      - - 公共部门访问与福利验证
        - 福利、税务、援助、招生、退款和数字公共服务访问的身份检查
        - 没有身份核验层的通用云安全支出或机构现代化项目
        - 项目完整性、数字服务、CIO、机构欺诈团队
        - 高价值垂直领域，因为不当支付和欺诈损失很大
      - - 现状替代方案与排除邻接
        - N/A
        - 人工审查、传统 KBA、银行自有工具、通用 IAM、仅交易欺诈工具，以及未整合进身份核验的纯 AML 监控
        - 既有内部运营或在位厂商
        - 这些是真实替代方案，但如果没有工作流重叠，不应计入 Socure TAM
    notes: 边界有意窄于通用信任基础设施。纳入支出必须位于数字身份核验或身份关联欺诈决策内；排除类别是替代品或邻接项，不是可叠加 TAM。
