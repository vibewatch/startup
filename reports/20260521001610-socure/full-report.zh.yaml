            body: >-
              公开成本故事只露出碎片。Socure 自己的材料指向持续 AI 和产品投入、对外部数据与制裁 / 观察名单服务的依赖、伙伴导入 KYB 工作流、eCBSV 中的交易量经济性，以及 Effectiv
              收购后的更宽编排复杂度。这在方向上符合软件主导业务：增量经济性应不错，但不一定拥有纯软件毛利，因为部分价值创造来自第三方数据、受监管工作流支持和实施。公开可比公司帮助锚定区间：Mitek 2025 Form
              10-K 显示，规模化身份供应商 SaaS 和服务收入在增长，但销售和 R&D 支出仍有意义；CLEAR 的公开统计显示毛利率体面但不极高，单员工收入也只是中等。

              资本充足性是本章最难的 blocker。公司概览负责融资时间线，但财务章节仍需要影响前瞻承销的融资事实：TechCrunch 报道 2021 年 Series E 后累计融资达到 $646M；PitchBook
              的存档档案写为 $744M，并列出后续债务和融资条目，但没有公开金额。Socure 还在 2024 年底同意以 $136M 收购 Effectiv。然而，已审集合没有任何公开来源披露当前现金、月度
