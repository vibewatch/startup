  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与替代方案地图
        blocks:
          - type: paragraph
            body: >-
              Socure 面对的不是一个干净的同业集合。已审证据把赛道拆成四层。第一层是直接 proofing 供应商，如 Jumio、Veriff、IDEMIA、Entrust/Onfido 和
              Mitek，销售证件、生物识别和身份核验工作流。第二层是更宽的编排或欺诈平台，如 Alloy、Persona 和
              Sardine；它们未必赢下每一次证件测试对比，但仍争夺同一笔开户、合规和欺诈预算。第三层是更窄的数据或匹配替代品，如 Plaid Identity 和 TransUnion
              TruValidate，可以解决部分任务，而不需要完整平台采购。第四层是现状替代：内部规则引擎、直接 SSA 检查、征信局数据和人工审核队列。

              这个结构很重要，因为 Socure 最强的主张并不围绕一次孤立核验。其公开表面覆盖身份验证、证件和生物识别验证、图谱情报、第一方欺诈、eCBSV
              和企业开户。因此，当买方想要一个跨多个工作流的身份风险层时，公司最容易赢；当客户只需要一个 proofing
              模块、一个权威检查，或一个包住既有数据供应商的编排壳时，公司更容易输。品类也越来越成熟，而不是初创公司碎片化竞争：Gartner 首份 Magic Quadrant 把 Socure、Jumio 和
              Entrust 列为规模化领导者，Mitek 和 Persona 处在相邻但仍相关的位置。
