  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Socure 的公开财务图景，在变现逻辑上远强于审计披露。公司把 RiskOS
              营销为覆盖消费者开户、企业开户、认证、支付筛查和其他生命周期工作流的身份、欺诈、风险与合规层，因此商业模式看起来是企业平台合同与特定检查决策量挂钩的可变收入混合。Launch 首次把这一逻辑具体化：Socure
              现在公布每月 $1,000 平台 credits，以及每次评估 $0.80 至 $1.30 的打包价格，确认至少一条 GTM 路径明确按用量定价。企业开户、eCBSV 和 Effectiv
              之后的产品集还暗示，公司会靠附加工作流、伙伴导入验证和更宽钱包份额变现。

              但公开定价可见度仍很窄。Launch 是面向创业公司就绪包的标价，不证明企业实际定价、折扣阶梯、实施费或收入确认政策。Socure
              不披露分部收入、产品结构、递延收入，也不拆服务与软件贡献。因此，正确的承销结论是：经常性加按量收费的收入引擎清晰可见，但产品广度如何转化为已实现收入质量，仍取决于合同级尽调。
