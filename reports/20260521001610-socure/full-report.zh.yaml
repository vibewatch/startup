              公开成熟度信号足以支撑真实平台广度论点。Socure 现在引用 $340M+ ARR、134% 净美元留存和 3,000 多家客户；2024 年业绩发布显示 27 亿次身份请求、3.7
              亿个唯一身份和持续专利产出。这些本身不是工程证明，但与一个能赢下重复用例、而非单点销售的平台相一致。品类背景也解释了 Socure 为何扩宽：市场需求正转向云原生编排、抗 deepfake 的 proofing
              和生命周期风险决策；Jumio、Veriff 等竞争对手也越来越多地营销图谱、AML、KYB 或跨会话情报。核心尽调风险因此不是 Socure
