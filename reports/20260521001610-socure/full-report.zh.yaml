      - number: '1.4'
        title: 规模、公共部门广度与当前尽调风险
        blocks:
          - type: paragraph
            body: >
              从规模看，Socure 已明显大于一家小众身份验证初创公司。官方来源现在称公司服务 3,000 多家客户，其中包括前 20 大银行中的 18 家，覆盖 190+ 个国家，并服务 160 家公共部门组织。2024
              年业绩发布又补上一层重要证据：27 亿次身份请求、3.7 亿个唯一身份、客户增长 42% 至 2,800 多家组织、GAAP 收入增长 54%、新增 16 项专利申请。Q1 2026 公司披露指标再补充：总
              ARR 超过 $340M、总新增 ARR 同比增长 62%、净美元留存 134%、新增 bookings 超过 $31M。这些都是商业牵引的实质证据，但仍是公司披露指标，而非上市公司式审计指标，因此第 1
              章应把它们作为高效用、中等置信度锚点。

              主要 caveat 不是需求，而是审视压力。2024 年，New York 议员和盟友倡导者公开质疑 Socure 的数据来源、公平性控制和透明度，尤其针对公共部门身份验证部署。StateScoop 也报道了
              Socure 的反驳：公司否认自己是数据经纪商，并称流程中始终有人参与。Socure 的负责任 AI 和隐私材料表明，管理层知道这是关键的信任界面，并在尝试阐明治理、公平性测试和安全控制。即便如此，第 1
              章仍应把政策和透明度审视列为活跃尽调项，因为公共部门扩张会同时放大采购机会和声誉 / 监管风险。
