      - number: '1.3'
        title: 融资历史、估值锚点与战略扩张
        blocks:
          - type: paragraph
            body: >
              最清晰的公开估值锚点仍是 2021 年 11 月的 Series E。Socure 自己的公告和 TechCrunch 当时报道一致：融资 $450M，估值 $4.5B，Accel 和 T. Rowe Price
              领投，Bain Capital Ventures 与 Tiger Global 作为新投资人加入。TechCrunch 还将该轮后累计融资写为 $646M，并提到此前 2021 年 3 月 Series D 估值
              $1.3B，这有助于框定公司在身份验证融资热潮中融资画像陡峭上行的速度。后续跟踪页面显示仍有晚期活动和二级市场兴趣，但抓取证据没有披露更新且同样权威的公开一手融资金额与估值组合；因此第 1
              章不应把更新的隐含价格写得像已取代 2021 年 Series E。

              战略上，2021 年之后最重要的公司动作是 2024 年收购 Effectiv。管理层称这笔交易打造了统一的身份、欺诈和风险决策引擎，并将 Socure 推入更宽的企业欺诈市场，覆盖支付欺诈、交易监控、承保和
              KYB。该扩张又自然接上 2025–2026 年平台里程碑：Local Graph 信息强化 RiskOS 运营叙事；2026 年 2 月 SocureGov RiskOS
              发布，更明确打包公共部门工作流；2026 年 3 月 FedRAMP Moderate 授权提升联邦采购可信度；Gartner 认可则提供有用的第三方产品验证信号，尽管它不能替代客户经济性或利润率。
