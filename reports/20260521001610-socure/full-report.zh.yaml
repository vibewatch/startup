      - number: '8.3'
        title: 可比公司、市场背景与 thesis / anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Socure 相比纯点状身份供应商应享有溢价，因为公司卖的已不只是身份检查。官方公司材料和交易披露显示，它已变成更宽的平台，覆盖身份验证、欺诈防控、制裁筛查、风险决策、编排，并通过 Launch
              新增初创公司自助开户。Mordor 估计市场将从 2026 年的 $15.78B 增至 2031 年的 $26.8B，这种宽度在其中很重要；但估值纪律仍不能消失，因为同一份报告称没有任何供应商掌握超过 15%
              的收入。Gartner 首个 Magic Quadrant 也显示头部很拥挤：Biometric Update 报道的领导者包括 Socure、Entrust、Jumio 和
              Incode；Veriff、Jumio、Alloy、Persona、Entrust、IDEMIA、Mitek 和 Sardine
              的竞品页面，也显示它们在全生命周期验证和欺诈编排上覆盖很广。新的公开可比公司进一步拉宽估值区间。Okta FY2025 发布显示 Q4 收入增长 13%、RPO 增长 25%，但 2026 年 5 月统计仍只有约
              5.35x sales 和 4.63x EV/sales。CyberArk 当前估值表高得多，约为 16.5x capitalization-to-revenue 和 15.9x
              EV-to-revenue；OneSpan 则接近 1.94x capitalization-to-revenue 和 1.77x EV-to-revenue。私营同业融资标记也有信息量，但已经偏旧：Veriff
              和 Persona 分别公开 $1.5B 估值，Alloy 称其 2022 年 9 月 extension 将公司估值定在 $1.55B，Trulioo 称其 Series D 定价为
              $1.75B。这些同业标记说明，投资人愿意为身份和欺诈基础设施付高价；但它们也让 Socure 2021 年 $4.5B 轮次显得是品类里的例外，而非常态。Socure
              可以用明显更强的增长来证明相对较慢公开公司的溢价，但更宽的同业组仍指向一个很宽的估值带，并反对不加质疑地支付 2021 周期价格。
