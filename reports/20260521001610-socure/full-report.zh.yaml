        - 较新但具体的扩展领域
        - 借助外部伙伴，用单一 API 完成企业验证、UBO 核验和制裁筛查
        - 需要证明伙伴深度、按工作流划分的国家覆盖，以及高负载下延迟
      - - Socure Launch
        - 开发者和早期产品团队
