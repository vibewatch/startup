      - number: '7.2'
        title: 运营、模型与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Socure 试图在最难的身份环境里取胜：AI 生成的 deepfake、合成身份、民族国家手法、高校退款欺诈、公共福利欺诈，以及变化很快的初创公司和加密滥用场景。公司材料称，2025 年 AI
              型欺诈攻击激增超过 8,000%；NIST 最终版 SP 800-63 修订也加入持续评估指标，以及针对伪造媒体和注入攻击的控制。随后，Socure 在 2026 年 3 月发布题为「The Layer
              Deepfake Detection is Missing」的文章；Mitek 2025 年 10-K 称，同业平台如今向超过 7,000 个组织营销生物识别活体检测和 deepfake
              检测能力。结论是，静态模型治理不够用；Socure 必须持续重校模型、供应商输入和工作流阈值，同时不能制造误报尖峰，把合法用户挡在门外。


              RiskOS 把 email、phone、device、IP、生物识别、文档、行为和其他 PII 统一起来，Socure 称平台现在支持 200
              多个第三方集成。覆盖面是优势，但如果上游数据质量恶化、客户启用的集成失效，或安全事件触及生物识别或文档验证触面，爆炸半径也会变大。公司公开描述的治理、第三方风险审查和调查员监督是有用缓释，但独立的性能漂移、例外队列和事件数据仍不公开。因此，投资人应承销控制系统的适应能力，而不只是当前欺诈捕获的营销说法。
