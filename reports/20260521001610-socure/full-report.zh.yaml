  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从运营证明和融资不透明度出发，推导当前建议的价格敏感型决策流。
    data:
      nodes:
        - id: proof
          label: 运营证明（$340M+ ARR，134% NDR）
          type: start
        - id: breadth
          label: Effectiv 与 Launch 强化平台宽度
          type: process
        - id: opacity
          label: 当前融资条款和股权结构是否披露？
          type: decision
        - id: comps
          label: 公开可比公司是否支持今天接近或高于 $4.5B 的价格？
          type: decision
        - id: invest
          label: 有条件可投案例
          type: end
        - id: track
          label: 继续研究 / 跟踪
          type: end
        - id: pass
          label: 溢价则放弃
          type: end
      edges:
        - from: proof
          to: breadth
          label: 是——运营牵引力真实
        - from: breadth
          to: opacity
          label: 存在溢价叙事
        - from: opacity
          to: track
          label: 否——经济指标和条款仍缺失
        - from: opacity
          to: comps
          label: 是——如果披露到位
        - from: comps
          to: invest
          label: 是——价格进入可支撑区间
        - from: comps
          to: pass
          label: 否——价格仍高于证据支撑
    approximationNotes: 该流程把真实尽调简化为本章最关键的两道门槛：披露质量，以及价格支撑能否经得起公开可比公司纪律检验。
    claimRefs:
      - CV037
      - CV039
      - CV040
      - CV044
      - CV048
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以披露的 $340M+ ARR 为基数，测算 ARR 倍数敏感性。
    data:
      items:
        - label: 5x ARR
          value: 1700
          detail: 熊市底部，符合严苛公开可比公司纪律
        - label: 8x ARR
          value: 2720
          detail: 若增长明显放缓，对应熊市上沿 / 基准下沿
        - label: 10x ARR
          value: 3400
          detail: 增长强劲但披露不完整时的基准中位
        - label: 12x ARR
          value: 4080
          detail: 留存和产品宽度继续强劲时的基准上沿
        - label: 14x ARR
          value: 4760
          detail: 牛市下沿，也是首次明确突破 2021 年轮次
        - label: 16x ARR
          value: 5440
          detail: 牛市溢价，需要异常强的执行和干净条款
    approximationNotes: 数值单位为百万美元，并以公开披露的 $340M+ ARR 作为分母。该图只给方向判断；现金、债务、股数和优先清算权结构未公开，因此未作调整。
    claimRefs:
      - CV037
      - CV038
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前公开证据能够支撑的熊市、基准和牛市估值区间。
    data:
      items:
        - label: 熊市
          low: 1800
          mid: 2200
          high: 2800
          detail: 公开可比公司纪律、增长放缓或融资重置
        - label: 基准
          low: 3000
          mid: 3500
          high: 4100
          detail: 强增长延续，但估值仍低于 2021 年峰值标记
        - label: 牛市
          low: 4800
          mid: 5600
          high: 6500
          detail: 增长持续高于 40%，NDR 高于 130%，平台货币化跑通
    approximationNotes: 数值单位为百万美元。该图展示估值区间而非投资人 IRR，因为当前股数、轮次结构和未来稀释情况都未公开。
    claimRefs:
      - CV046
      - CV047
      - CV051
      - CV052
      - CV053
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，覆盖市场、证明、经济指标能见度、风险和估值支撑。
    data:
      items:
        - label: 市场顺风
          value: 8/10
          detail: IDV 市场增长，CAGR 为双位数，份额仍分散
        - label: 产品宽度
          value: 8/10
          detail: 身份、欺诈、制裁、编排和 Launch 拓宽了产品栈
        - label: 客户证明
          value: 8/10
          detail: 3,000+ 客户和 134% NDR 说明真实扩张行为存在
        - label: 增长质量
          value: 9/10
          detail: 新 ARR 同比增长 62%、GAAP 收入增长 54%，都是顶级公开信号
        - label: 竞争隔离
          value: 6/10
          detail: Gartner 领先位置有帮助，但同业产品宽度也很强
        - label: 证据质量
          value: 4/10
          detail: 当前估值和融资条款披露仍不足
        - label: 资本结构透明度
          value: 3/10
          detail: 没有公开股数或优先清算权结构桥表
        - label: 估值支撑
          value: 4/10
          detail: 溢价有合理性，但公开可比公司并不能说明 $4.5B 显然便宜
    approximationNotes: 分数是为投资委员会框架服务的分析判断，不是标准化外部评级。分数越高越好。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV043
      - CV044
