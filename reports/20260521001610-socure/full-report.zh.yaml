  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 矩阵按可能性、影响、缓释成熟度和剩余严重度，排列 Socure 优先级最高的六类风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 公共部门隐私 / 采购审查
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 部分
              tone: neutral
            - label: 高
              tone: warning
        - label: 敏感数据安全或控制失效
          values:
            - label: 中
              tone: warning
            - label: 极高
              tone: negative
            - label: 部分
              tone: neutral
            - label: 高
              tone: warning
        - label: 联盟 / 数据共享受限
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 有限
              tone: risk
            - label: 高
              tone: warning
        - label: eCBSV 准入卡点或重新定价
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 部分
              tone: neutral
            - label: 中高
              tone: warning
        - label: AI 欺诈激增 8,000% 期间的模型漂移
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: negative
            - label: 部分
              tone: neutral
            - label: 高
              tone: warning
        - label: 公共部门、国际化和 Launch 并行推进带来的执行过载
          values:
