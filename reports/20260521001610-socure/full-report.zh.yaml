  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              定义 Socure 市场时，最干净的口径不是“所有信任基础设施”或“所有反欺诈软件”，而是更窄的一组工作流：数字机构必须判断一个声称的身份是否真实、在场，并且足够安全，可以与之交易。留存的 Socure
              产品页面一直把身份验证、证件与生物识别核验、欺诈防控和编排打包为一个运营层。因此，纳入口径从消费者开户和高风险账户事件开始；当证件验证、活体检测、合成身份防御和第一方欺诈控制属于同一决策流时，也应纳入。企业开户也在边界内，因为
              Socure 明确把 KYB、UBO 验证和制裁筛查放进一个 API 驱动工作流。相反，本章排除纯支付处理、通用网络安全支出、物理门禁
              IAM，以及未解决数字身份核验问题的独立交易监控工具。金融服务楔子尤其重要，因为 SSA eCBSV 是高价值验证输入，只开放给与金融机构及其服务商绑定的许可实体，这把一项特别强的数据优势限定在特定买方类别内。
