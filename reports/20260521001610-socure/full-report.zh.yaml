      - number: '2.4'
        title: 增长驱动、约束与未解问题
        blocks:
          - type: paragraph
            body: >-
              Socure 所在市场最强的增长驱动来自工作流变化，而不只是 TAM 口号。NIST 最新数字身份指南明确扩展欺诈要求，并纳入伪造媒体和注入攻击；Socure
              自己的证件验证定位也说明买方为何增加活体检测和反欺骗支出。在金融服务里，SSA eCBSV 和 CFPB Section 1033
              落地都抬高了稳健身份基础设施的价值，也加重了围绕数据访问、同意和接口质量的运营负担。在公共部门，GAO
              的欺诈损失估计足够大，能把身份验证和不当支付防控留在真实项目预算中。第一方欺诈证据又补上一条需求向量，把市场从一次性开户延伸出去。约束同样清楚。敏感数据处理带来隐私和安全执法风险；公共部门采购可能因偏见或性能质疑放慢；留存负面报道显示，并非所有性能主张都会无人挑战。对估值最重要的是，没有留存公开来源能清楚拆出
              Socure 的定价、分部结构或可服务市场份额。正确结论是：市场有吸引力且具战略重要性，但没有管理层数据，很难在公司层面精确测算。
