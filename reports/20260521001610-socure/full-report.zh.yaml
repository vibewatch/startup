        - 专门的权威数据附加模块
        - 直接接入 RiskOS 的 SSA 支持匹配信号
        - 需要按客户层级确认精确资格、成本转嫁和兜底处理
      - - Sigma First-Party Fraud
        - 支付、争议和反欺诈运营团队
        - 扩展模块
        - 借助联盟数据，在开户之外提供全生命周期第一方欺诈评分和预警
        - 需要生产环境证据，证明争议滥用和早期违约下降
