  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 增长恶化
        - ARR 增长跌破 30%
        - 溢价倍数支撑塌回上市可比公司纪律
        - 将估值重切到熊市区间，并暂停投资工作
      - - 留存滑坡
        - 净美元留存跌破 120%
        - 扩张驱动论点走弱，交叉销售价值存疑
        - 重估基准情景，并要求客户队列证据后再推进
      - - 融资重置
        - 新融资定价低于 2021 轮，或加入重优先权
        - 即便收入继续增长，普通股上行也可能被结构性削弱
        - 除非条款异常保护投资人，否则立场从跟踪转为回避
      - - 公共部门 / 治理事件
        - 正式调查、机构不续约，或数据实践问题被证实
        - 风险评级上升，采购驱动增长假设走弱
        - 立即重估公共部门收入和声誉下行
      - - 平台变现失手
        - Effectiv 和 Launch 未能产生持久交叉销售或降低 CAC 的增长
        - 宽度溢价收缩回点状解决方案估值逻辑
        - 移除牛市情景，只锚定上市可比倍数
    notes: 否决触发项有意设置为可衡量。重点是在承销新的私有轮或二级购买之前，让估值立场可以被证伪。
    claimRefs:
