      - number: '7.4'
        title: 商业化、财务披露与执行风险
        blocks:
          - type: paragraph
            body: >-
              业务显然在扩张，但投资风险在于，覆盖面跑得比可见度更快。Socure 2026 年披露显示，新 ARR 同比增长 62%，总 ARR 超过 $340M，净美元留存 134%，客户超过 3,000 家，覆盖 190
              多个国家，公共部门组织 160 家，并通过 Launch 快速切入初创公司自助服务。这些都是强信号，但仍是公司披露数字，缺少公开审计的分部结构、利润率结构、公共部门续约率，或数据网络贡献方集中度。


              同时，产品触面还在继续变宽：watchlist
              筛查、死亡核验、eCBSV、文档验证、生物识别，以及决策或编排，都被放进一个信任栈。钱包份额因此提高，但在失败成本差异很大的市场中，实施、支持和合规负荷也随之增加。公开市场和 incumbent
              竞争也是真实压力。CLEAR 2024 年 10-K 称，其 CLEAR1 平台向金融服务和其他垂直领域的 B2B 合作伙伴销售账户创建 / KYC、年龄验证、员工入职、关键访问控制和账户恢复。Mitek
              2025 年 10-K 称，公司为超过 7,000 个组织提供活体检测和 deepfake 检测能力，同时仍把竞争、监管、安全云交付、客户集中和关键员工流失列为重大风险。LexisNexis InstantID
              URL 跳转到更宽泛的 LexisNexis Risk Solutions 页面，由大型 incumbent 营销欺诈创新。领导层广度比纯创始人叙事更好，因为 Socure
              公开列出了产品、技术、商业、法律、人力和增长负责人；但在本轮尽调中，专门的 /company/leadership URL
              无法访问，班底深度和继任可见度低于理想水平。如果披露改善前增长显著放缓，投资人信心会比标题 ARR 所暗示的更快压缩。
