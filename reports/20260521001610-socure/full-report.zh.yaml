  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象 / 信号
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Socure Series E（2021 年 11 月）
        - 最后披露的一级轮
        - 融资 $450M，估值 $4.5B
        - 入场纪律最好的硬一级市场锚点
