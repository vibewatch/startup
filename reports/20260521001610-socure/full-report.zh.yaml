      - number: '5.3'
        title: 信任、质量与合规控制
        blocks:
          - type: paragraph
            body: >-
              Socure 的公开信任姿态强于公开内部架构披露。公司提供了有实质内容的负责任 AI 叙事，描述模型治理、性能测试、欺诈产品公平性测试、面向客户的 reason
              codes、人工审核，以及客户仍处在决策回路中。公司还公开声称拥有有分量的认证栈——SOC 2、ISO 27001、27017、27018 和 27701——加上公共部门产品的 FedRAMP Moderate
              和相关州级授权。一些模块的产品质量披露也相对具体：DocV 公布速度和 true-accept 指标，eCBSV 材料清楚说明权威 SSA 信号在流程中的位置，Socure 还维护政策中心、隐私权 FAQ 和
              DocV 条款页面，让公司的前门同意和数据权利姿态更容易读懂。外部标准同样重要。NIST 更新后的身份指南包提高了对伪造媒体抵抗和持续评估的要求；SSA 的同意和收费规则提醒买方，权威验证部分受 Socure
              控制之外的规则约束。缺失的是更深尽调层：审计范围细节、tenant 边界具体情况，以及把良好原则和政策页面转化为可承销工程信心的运营证据。
