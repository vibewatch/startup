      - - Effectiv 收购（2024 年）
        - M&A 交易参照
        - 以 $136M 交易收购风险决策引擎
        - 显示 Socure 在购买平台宽度，而不只是销售点状解决方案
        - 不能直接读到 Socure 股权价值
      - - Okta 上市身份平台
        - FY2025 经营基准加 2026 年 5 月交易统计
        - Q4 FY2025 收入同比 +13%；2026 年 5 月 20 日约 5.35x 销售额、4.63x EV/sales
        - 显示规模化身份软件不触及 2021 周期私有市场标记，仍可享受溢价交易
        - 更宽的 IAM 平台和上市公司披露让它比 Socure 更安全、beta 更低
      - - CyberArk 上市安全 / 身份可比公司
        - 2025 年市场估值
        - 约 16.5x 市值 / 收入、15.9x EV / 收入
        - 展示具备战略稀缺性的关键任务身份安全资产的上行情景
        - 网络安全和 PAM 组合比 Socure 的身份验证敞口更偏安全
      - - OneSpan 上市信任 / 安全软件可比公司
        - 2026 年市场估值
        - 约 1.94x 市值 / 收入、1.77x EV / 收入
        - 为较慢增长的信任和数字身份软件提供低端锚点
        - 产品组合与 Socure 的欺诈和身份栈可比性较弱
      - - Veriff Series C
        - 私有市场同行融资
        - 融资 $100M；估值 $1.5B；总融资 $200M
        - 对规模化 IDV 专业公司有参考价值
        - 2022 年 1 月标记已陈旧，且范围比 Socure 当前平台更窄
      - - Persona Series C
        - 私有市场同行融资
        - 以 $1.5B 估值融资 $150M
        - 支持市场愿意为身份基础设施支付溢价软件倍数
        - 2021 周期定价和不同客户工作流组合限制读透
      - - Alloy 融资扩展
        - 私有市场同行融资
        - 追加 $52M，估值 $1.55B；公司称过去 12 个月收入增长超过一倍
        - 对以 fintech 为中心的身份和欺诈基础设施需求有较好读透
        - 2022 年标记已陈旧，不能直接桥接到 Socure 企业价值
      - - Trulioo Series D
        - 私有市场同行融资
        - 融资 $394M，估值 $1.75B
        - 又一个大型已披露私有身份基准，低于 Socure 2021 年标记
        - 2021 周期条件异常有利，估值已经陈旧
      - - CLEAR Secure 上市参照
        - 身份相邻上市可比公司
        - 归档的 2026 年 2 月统计显示约 5.15x P/S 和 4.67x EV/Sales；CompaniesMarketCap 随后显示 2026 年 5 月市值为 $8.28B
