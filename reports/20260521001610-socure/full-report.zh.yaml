  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 有向图展示隐私、模型和安全失效如何传导到采购、客户留存和估值结果。
    data:
      nodes:
        - id: privacy_scrutiny
          label: 隐私 / AI 审查
        - id: procurement_freeze
          label: 政府采购冻结
        - id: graph_constraints
          label: 图谱 / 数据共享约束
        - id: model_quality
          label: 模型质量下滑
        - id: security_incident
          label: 安全或控制事件
        - id: customer_loss
          label: 客户信任 / 留存受损
        - id: growth_narrative
          label: 增长与估值叙事
        - id: regulatory_action
          label: 正式监管行动
      edges:
        - from: privacy_scrutiny
          to: procurement_freeze
          label: 放慢授标
        - from: graph_constraints
          to: model_quality
          label: 削弱信号深度
        - from: model_quality
          to: customer_loss
          label: 误通过 / 误拒绝
        - from: security_incident
          to: regulatory_action
          label: 触发调查
        - from: security_incident
          to: customer_loss
          label: 侵蚀信任
        - from: procurement_freeze
          to: growth_narrative
          label: 削减公共部门上行空间
        - from: customer_loss
          to: growth_narrative
          label: 打击 ARR / NDR 故事
        - from: regulatory_action
          to: growth_narrative
          label: 压缩信心
    approximationNotes: 该图强调公开来源中可见、严重度最高的传导路径，而不是穷尽所有依赖。最关键的未观测变量，是模型或安全事件后客户信任下滑的速度。
