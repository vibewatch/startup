chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与总部信号
        blocks:
          - type: paragraph
            body: >
              Socure 将自己定位为一家 AI 驱动的数字身份验证和欺诈防控公司；其当前官网文案把 RiskOS 描述为一个 AI 原生平台，统一身份、欺诈、风险和合规工作流。

              这个定位很关键，因为 Socure 的叙事已从单点方案供应商转向基础设施：公司卖的不只是首次使用时的 CIP/KYC 检查，而是贯穿开户和后续生命周期的身份核验、欺诈控制、决策和监管工作流。Effectiv
              收购继续扩宽叙事，补上交易监控、KYB 和偏承保决策能力，让公司比原本的身份验证品牌更像一个更宽的“风险引擎”。

              已审来源支持 2012 年成立和当前私有公司状态，但总部需要谨慎处理。2026 年官方网页页脚和 BusinessWire 电头都指向 885 Tahoe Blvd., Suite 1, Incline
              Village, Nevada，这是当前最强地址信号。同时，已审公开材料没有清楚区分 Nevada 地址究竟是运营总部、法律 /
              邮寄地址，还是税务效率导向的报告地点。由于后续私有公司跟踪器并不完整且有时设门槛，第 1 章应保留 Incline Village
              作为当前最强公开信号，同时明确标注地点确定性仍未解决，不能在后续章节把它写成虚假精确。
