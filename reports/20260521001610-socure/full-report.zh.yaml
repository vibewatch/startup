              tone: warning
            - label: 中高
              tone: warning
            - label: 中等
              tone: neutral
            - label: 中高
              tone: warning
    approximationNotes: 可能性、影响、缓释成熟度和剩余严重度，是基于公开事实和章节综合得出的分析判断，并非来自内部运营数据。独立的表现、事故和续约指标会显著校准每个单元格。
