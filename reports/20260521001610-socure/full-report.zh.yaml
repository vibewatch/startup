        - 要求按入驻工作流和客户分部披露 ARR 与毛利率
      - - Socure Launch 自助工作流
        - 月度平台额度用完后按用量定价
        - 按每次评估加月度额度
        - 2026 年上线，并公开面向创业公司的打包方案
        - 公开价格透明度最好，但当前收入贡献未知
        - 要求披露 Launch 激活、付费转化，以及向企业账户扩张情况
      - - 企业入驻 / KYB / UBO
        - 单一 API 工作流，接入伙伴数据和合规检查
        - 按每个企业 / 所有人工作流计费，或定制合同
        - 已公开销售，并定位于银行、金融科技和贷款机构
        - 潜在粘性强，但伙伴成本转嫁可能稀释毛利率
        - 要求披露伙伴成本转嫁，以及相对消费者入驻的附加率
      - - eCBSV 权威加严核验
        - 入驻流程中嵌入权威匹配 / 不匹配检查
        - 交易 / 验证事件
        - 已上线，并定位于更高风险应用
        - 合规价值强，但净经济性取决于交易成本和抽成率
        - 要求披露 eCBSV 单位毛利、客户采用率和定价政策
      - - 通过 Effectiv 覆盖生命周期欺诈、AML、支付和信贷工作流
        - 入驻之外扩展出的编排平台
        - 企业工作流量和平台合同
        - 2024 年收购后明显拓宽
        - 若交叉销售落地，可提高钱包份额，但整合成熟度仍关键
        - 要求披露收购以来 Effectiv 独立 ARR、流失率和交叉销售管线
      - - 渠道和伙伴驱动分销
        - 经销商、OEM、集成伙伴和合作银行路径
        - 间接分销 / 推荐经济性
        - 公开可见但财务不透明
        - 可能降低 CAC、扩大触达，但贡献毛利未披露
        - 要求披露来源管线、收入分成条款和伙伴驱动回本数据
    notes: 公开证据能识别主要变现路径，但无法看出产品级收入组合或实际企业定价。
