      - number: '2.3'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开市场证据支持这是一个真实且增长的品类，但不给出干净的 Socure 专属 TAM。三家留存分析来源把 2026 年全球身份验证市场放在 $14.1B 至 $16.05B
              之间。这个区间足够紧，可作为参考；但仍不应当成单一精确数字，因为各报告预测终点和市场定义略有不同。Research and Markets 的公开摘录进一步佐证这一点：它展示了正式的数字身份验证 TAM
              框架，却没有披露实际数值，方法论上有提示意义，但不能加总为数字。更影响决策的是垂直和买方结构。BFSI 似乎约占需求三分之一；Mordor
              显示云是主导交付模式，同一来源也显示大型企业占据多数份额。这些信号指向一个以受监管、企业重度开户和欺诈工作流为核心的可服务市场，而非泛行业身份大宇宙。因此，Socure
              自身规模指标——包括数十亿次身份请求和数千家客户——最好理解为品类拉力和跨垂直采用证据，而不是公开 SAM 或市场份额披露的替代品。
