        - ARR 增长放缓至接近上市可比公司水平，NDR 回落，新融资定价更贴近公开市场纪律
        - 约 $1.8B-$2.8B，或基于当前披露 ARR 约 5x-8x
        - 降价轮、优先权悬顶、Effectiv 或 Launch 变现失败、审视升温
        - 下行尾部风险实质存在；若以溢价入场，不能忽视
      - - 基准
        - 增长仍强但边际放缓，留存保持健康，平台宽度在非完美执行下仍赢得溢价
        - 约 $3.0B-$4.1B，或约 9x-12x ARR
        - 利润率披露缺失、资本结构表条款不清、竞争压缩定价
        - 基于当前公开证据，最可能落在这一区间
      - - 牛市
        - ARR 保持在 $340M 以上且增长 >40%，NDR 维持在 130% 以上，由编排带动的交叉销售得到验证
        - 约 $4.8B-$6.5B，或约 14x-19x ARR
        - 执行失误可能迅速击穿溢价，因为当前定价已假设强结果
        - 概率低，但若持续卓越执行，仍属合理
    notes: 情景区间是基于公开 ARR、上市可比交易参照和已披露产品宽度形成的分析估计。它们不是管理层指引，也不应被误认为精确公允价值。
