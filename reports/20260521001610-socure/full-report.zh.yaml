      - number: '3.3'
        title: 分销、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              Socure 的护城河似乎在分销和信任与纯算法准确率同等重要的场景最强。公司称服务 3,000 多家客户，覆盖 190+ 个国家；公共部门姿态包括 FedRAMP
              Moderate，以及在数十个州机构和若干联邦机构中的部署。这很关键，因为本章审阅的许多竞争对手都能可信地声称拥有 API、生物识别或工作流灵活性，但能把跨行业网络叙事、明确美国政府授权和面向受监管开户的
              eCBSV 封装放在一个平台上的公司更少。Socure 的图谱和联盟主张也解释了其竞争形态为何不同于简单的证件验证 bake-off：公开故事是，随着更多身份、欺诈事件和机构进入网络，平台会变得更好。

              但护城河并非每一部分都同样自有。企业开户部分依赖 Middesk、Baselayer、Kyckr 和 Markaaz 等伙伴。eCBSV 本身是 SSA
              服务，成熟买方或中介可以直接接入。这些细节不会抹去切换成本，但会改变切换成本的性质。当客户把多个 Socure 模块嵌入同一个决策层时，切换成本最强；当客户只买一个 proofing
              检查或一条权威验证路径时，切换成本更弱。公开来源也没有展示独家分销或 win-rate 数据，所以在管理层证明相反前，应假设客户会多供应商并用。
