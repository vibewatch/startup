      - number: '8.5'
        title: 最终尽调问题、thesis-break 触发器与退出姿态
        blocks:
          - type: paragraph
            body: >-
              建议维持在继续研究 / 跟踪，因为剩余未知项恰好决定了一个高增长私营估值能否转化为有吸引力的投资结果。公开证据仍未披露当前 gross margin、cash burn、CAC payback、经审计的
              ARR-to-revenue bridge，或任何 2025 年融资形成的 cap table
              与优先权结构。这些缺口比又一次产品发布公告更重要，因为它们决定普通股持有人能否参与上行，还是被结构稀释。最重要的尽调问题因此是机械性的，而不是修辞性的：当前股数和优先股条款，以便把二级报价转换为股权价值；经审计的
              2025 年和 2026 年 Q1 财务；按 cohort 和产品拆分的留存；Effectiv 交叉销售贡献；Launch 转化和 CAC；以及与 StateScoop
              报道的纽约关切相关的任何采购或监管往来。Thesis-break 信号同样具体：ARR 增长跌破 30%，NDR 低于 120%，融资低于 2021
              年轮次，出现重大公共部门调查，或有证据表明编排和自助渠道无法转化为持久扩张。在拿到这些答案前，最有证据支撑的姿态是监控，而不是强行给出精确入场点或近期退出 thesis。
