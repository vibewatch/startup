  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁
      - 严重性
      - 缓释 / 尽调问题
    rows:
      - - 跨行业图谱和联盟情报
        - Socure 称已覆盖 5B 个身份、3,000+ 家网络公司，以及 190M 个身份的一方联盟
        - Jumio 也在营销 Identity Graph，编排厂商也可能逐步接入伙伴数据
        - 中高
        - 要求提供赢单 / 输单证据，证明图谱信号相对直接核验同业能显著拉高审批率或压低欺诈结果
      - - 政府和受监管买家的信任
        - FedRAMP Moderate 与公共部门部署让 Socure 在采购中更有可信度
        - IDEMIA 和 Entrust 也卖给信任敏感环境，公共部门周期又长，且高度依赖参考客户
        - 中
        - 要求提供联邦和州级续约队列，并证明信任姿态能缩短销售周期或提高赢率
      - - 覆盖 KYC、欺诈、KYB 和编排的宽平台范围
        - Socure 覆盖消费者 IDV、证件、联盟欺诈、eCBSV 和企业入驻
        - Alloy、Persona 和 Sardine 表明，买家可以从别处采购工作流广度；重伙伴的模块也可能被替换
        - 高
        - 将自有模块与编排式伙伴模块拆开，审查模块级附加率和利润率
      - - 面向薄档案人群的包容性和权威核验
        - eCBSV 与包容性验证主张，使其区别于以征信局为先的传统流程
        - 买家可以直接接入 SSA，或自行组合征信局、证件和人工审核工具
        - 中
        - 量化 eCBSV + 图谱相对直接 SSA 或竞品栈在匹配客户队列中的提升
      - - 实施速度和自助服务打包
        - RiskOS Launch 与按周上线的主张降低部署摩擦
        - Veriff、Persona 和 Mitek 案例研究也强调快速集成或移动端完成
        - 中
        - 审查竞争性选型中的上线时间和所需服务投入
      - - 数据治理和 AI 责任
        - Socure 发布负责任 AI 原则，并回应立法者批评
        - 即便产品表现强，隐私审查或偏见担忧仍可能拖慢公共部门和受监管行业采用
        - 高
        - 获取模型治理文档、偏见测试输出、人工审核政策、隐私投诉，以及任何州机构整改承诺
    notes: 严重性衡量的是对差异化耐久度的威胁，而非认定份额会马上流失；替代栈、采购惯性和治理审查是最实质的风险。
