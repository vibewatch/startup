      - number: '5.2'
        title: 工作流与运营架构
        blocks:
          - type: paragraph
            body: >-
              理解 Socure
              最有用的方式，是把它看作自适应工作流引擎，而不是静态合规工具。消费者开户可以从被动身份、欺诈和观察名单检查开始；只有出现风险时，才升级到证件验证或其他更高摩擦步骤。同一套编排逻辑延伸到第一方欺诈监控、账户变更或支付风险事件，以及
              Effectiv 之后更宽的 KYB、AML、支付欺诈和信贷工作流。公开披露的架构因此围绕几层展开：信号聚合、图谱和联盟情报、DocV 与 eCBSV
              等专门模块，以及决定批准、拒绝或加验的决策层。企业开户进一步强化这一视角，因为它明确由伙伴驱动：Socure 依靠 Middesk、Baselayer、Kyckr 和 Markaaz
              等供应商验证企业和受益所有人；Effectiv 又增加了更大的第三方编排表面。这个广度是真实产品优势，因为它减少客户集成数量；但也意味着执行质量同样取决于外部数据 feed、伙伴 API
              和受监管权威服务，而不只取决于 Socure 自己的模型。
