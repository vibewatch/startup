  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调追问
    rows:
      - - AI 驱动的深度伪造、注入攻击和伪造文件
        - 驱动因素
        - 当前 / 结构性
        - 把买方从静态检查推向活体检测、文件验证和自适应欺诈模型
        - 按细分市场询问 DocV、生物识别和高风险工作流量的结构变化
      - - 远程开户 ROI：审批更快、人工审核更少
        - 驱动因素
        - 当前 / 结构性
        - 当转化、人力节省和客户体验与原始欺诈拦截同样重要时，预算更容易成立
        - 要求提供客户层面的审批提升、人工审核节省和回本周期证据
      - - eCBSV 和 Section 1033 接口等金融服务数据与合规层
        - 驱动因素
        - 当前 / 近期
        - 让受监管金融工作流信息更丰富，也更难用简单单点工具解决
        - 询问哪些银行和金融科技工作流在实践中依赖这些数据或接口要求
      - - 公共部门欺诈损失和数字服务现代化
        - 驱动因素
        - 当前 / 多年期
        - 支撑政府对安全、包容身份认证的需求，覆盖福利和数字访问场景
        - 要求拆分联邦与州 / 地方管线、项目类型和采购周期长度
      - - 第一方欺诈和联盟式生命周期智能
        - 驱动因素
        - 当前 / 结构性
        - 把市场从首日 KYC 扩到持续的身份关联滥用预防
        - 衡量第一方欺诈或开户后模块的附加率
      - - 隐私和安全执法负担
        - 约束
        - 当前 / 结构性
        - 推高收集、存储和解释敏感身份数据的成本
        - 要求提供治理控制、同意流程、审计结果和隐私事件历史
      - - 公共部门部署中的采购、偏见和效果营销审查
        - 约束
        - 当前 / 近期
        - 即便欺诈需求很高，也可能拖慢销售周期，并要求更多第三方验证
        - 要求提供公共部门客户证明、公平性测试，以及诉讼或投诉状态
      - - 没有公开 SAM、定价或细分市场层面的单位经济
        - 约束
        - 当前
        - 降低估值工作的精度，因为宽口径市场增长不会自动转化为可变现份额
        - 要求管理层提供定价架构、附加率和细分收入结构
    notes: 最强的驱动因素不只是品类增长标题，而是迫使买方用自适应身份基础设施替代静态检查的工作流变化。最重要的约束也不是宽口径市场是否存在，而是治理和变现能否讲清楚。
