      - - PitchBook 后期 VC 条目（2025 年 1 月）
        - 融资状态
        - 列示已完成后期 VC；总融资显示为 $744M；估值未披露
        - 表明 Series E 之后资本很可能仍可获得
        - 不能证明上调轮、平轮或结构
      - - Forge 二级市场信号（2026 年 5 月 20 日）
        - 二级股份指示
        - Forge Price 为 $3.81/股
        - 至少是同期的实时方向性信号
        - Forge 称该标记可能依赖有限输入，且不一定是市场价格
      - - Notice 二级市场片段
        - 二级零售门户标题
        - $3.60 股票标题
        - 作为软性、仅方向性信号，与 Forge 大体一致
