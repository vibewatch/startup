  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 公共部门隐私与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Socure 眼下最尖锐的法律和监管风险，并不是已经披露的执法行动；真正的风险在于，政府采用加速，而外界反复质疑公司的数据收集、近似控制者的图谱智能和 AI 筛查，可能跑在公共部门透明度标准前面。纽约州参议员
              Jeremy Cooney 追问州 CIO 如何审查 Socure，以及其实践是否符合隐私法；弗吉尼亚州众议员 Cliff Hayes 则质疑数据权利处理、仲裁条款和 VCDPA 合规。Socure
              的反驳——公司不是数据经纪商，身份验证全流程有人参与，并会做偏见压力测试——确实重要，但不能消除底层的审查放大效应。


              Socure 自己的隐私政策写明，公司在客户交易中通常充当处理者，同时又会为衍生洞察、网络或图谱型风险智能独立充当控制者。这个拆分有商业威力，但当公共部门客户从数十家机构扩到 160
              个组织时，数据权利、留存和采购尽调会变得更关键。叠加 FTC 隐私和安全理论、CFPB Section 1033 对安全与留存的预期、编入 16 CFR Part 314 的 FTC Safeguards
              Rule，以及 SSA 同意规则，风险更应被看作采购脆弱性，而不是单一法律事件。Socure 政策页面上单列的 DocV 条款和隐私材料也说明，产品触面扩张后，必须保持同步的政策承诺会变多。
