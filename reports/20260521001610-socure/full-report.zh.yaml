  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              Socure 达到继续尽调的质量门槛，但仅凭公开证据，还不到给出明确买入建议的价格门槛。运营逻辑很强：Business Wire 称，Socure 在 2026 年 Q1 结束时总 ARR 超过 $340M，总新
              ARR 同比增长 62%，预订额超过 $31M，净美元留存 134%，客户超过 3,000 家。这些证据支持它是一家真实增长平台，而不是只靠叙事驱动的公司。估值问题在于，最后一个干净的一手锚点仍是 2021 年
              11 月估值 $4.5B 的 Series E。用已披露的 $340M+ ARR 基数计算，这个估值至少意味着约 13.2x ARR。新的公开身份软件参照把区间拉宽：Okta 2026 年 5 月统计显示约
              5.35x sales 和 4.63x EV/sales，CyberArk 2025 年估值表显示约 16.5x capitalization-to-revenue 和 15.9x
              EV-to-revenue，OneSpan 则接近 1.94x capitalization-to-revenue 和 1.77x
              EV-to-revenue。这个分布说明溢价可能存在，但只适用于使命关键定位和经济性异常强的公司。由于后续融资条款未公开，二级价格的方法论又偏弱，目前最可支撑的建议是继续研究 /
              跟踪，置信度中等、风险高。这里价格纪律比公司质量更重要：更低的入场点或更好的证据可以改变判断，但今天若新一轮接近或高于 $4.5B，证据还不够。
