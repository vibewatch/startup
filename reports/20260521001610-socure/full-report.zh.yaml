      - number: '1.2'
        title: 领导层、治理与控制点
        blocks:
          - type: paragraph
            body: >
              公开记录里，Johnny Ayers 仍是核心领导人物：公司页面列其为创始人兼 CEO，2024–2026
              年围绕业绩、奖项和产品定位的公司公告也反复由他发声。这种连续性有利于叙事纪律，但也带来实质性的关键人物集中度，因为公开记录把产品战略、使命框架和公司大部分外部可信度都压在一位创始人经营者身上。当前官方材料将
              Matthew Thompson 列为 President and Chief Commercial Officer，并列出 Pablo Abreu、Rivka Gewirtz Little、Arun
              Kumar、Aviad Levin、Teneka Polite 和 Eric Woodward 等高管，足以让投资人看到产品、商业、法律 / 隐私、技术和人力运营的职能覆盖。

              治理透明度弱于经营领导层透明度。当前来源包没有给出完整公开董事会名单、委员会结构、观察员权利，或一张清晰控制权图谱；除历史投资人和高管角色外，很难推断更多。Aviad Levin-Gur 同时以 General
              Counsel / Corporate Secretary 和 DPO 身份出现，提供了可见的法律 / 隐私治理信号，但不能替代董事会层面的披露。对尽调而言，实际含义是：Socure
              的公开领导班子看起来真实且更新及时，但在把第 1 章事实作为后续投资判断硬依据前，治理层仍需要管理层会议直接确认。
