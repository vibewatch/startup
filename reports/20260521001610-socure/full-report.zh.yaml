  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前资本结构表和股数
        - 完整资本结构表、股份类别、期权池和股数
        - 没有这座桥，二级价格片段无法折算为股权价值
        - CFO / 投资者关系数据室请求
      - - 2025 年和 2026 年 Q1 财务桥接
        - 经审计收入、ARR 桥接、毛利率、烧钱速度和现金续航
        - 当前建议更多取决于经济性披露，而不是叙事质量
        - 财务尽调；审计报表和管理层模型审查
      - - 2025 年后期 VC 条款
        - 轮次规模、领投方、投后估值、清算优先权和任何估值调整条款
        - 公开证据显示很可能发生了一轮融资，但不知道它是重置估值还是支撑估值
        - 法务和融资尽调；条款清单或交割文件包
      - - Effectiv 变现
        - 交叉销售率、编排挂载、AML / KYB 收入和产品采用队列
        - 平台宽度溢价取决于变现，而不只是 M&A 标题
        - 产品和销售尽调，配合收购后 KPI 包
      - - Launch 经济性
        - 转化漏斗、CAC、欺诈损失画像，以及从自助服务到企业客户的向上销售路径
        - Launch 只有带来高效增长，而不是低质量量增，才支撑估值
        - 增长分析和队列审查
      - - 公共部门审视解决情况
        - 与纽约关切有关的任何往来、续约或整改
        - 治理或采购问题仍未解决时，不应承销公共部门上行
        - 公共部门 GM / 法务尽调和机构背调
    notes: 这些问题瞄准当前挡住高信心买入判断的具体证据缺口，而不是泛泛收集尽调琐事。
