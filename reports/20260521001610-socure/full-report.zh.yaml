      - number: '7.3'
        title: 合作伙伴、数据网络与授权依赖
        blocks:
          - type: paragraph
            body: >-
              Socure 的护城河很大程度上依赖外部因素，而这些因素之所以有价值，正因为公司并不能完全控制。对金融科技和受监管开户来说，eCBSV 是权威信号，但 SSA
              只允许获准实体及其服务提供商使用，要求措辞严格的书面同意，监控交易层级，并收取可观订阅费。如果资格规则收紧、同意完成率下降，或经济性恶化，一些高置信开户流程的吸引力会下降。


              联盟和图谱产品也一样。Green Dot 称，联盟成员之间的行为重合度约为 45%；Socure 和 PYMNTS
              则描述了一个覆盖数亿身份、数十亿笔交易的网络。规模就是产品优势——但如果主要贡献方减少参与，或监管机构收窄类似控制者的数据网络复用，这也是依赖风险。公共部门增长又加了一道平行门槛：FedRAMP 和
              StateRAMP 式授权、采购工具以及政府特定安全预期，不是可有可无的分销增强项，而是准入依赖。一旦这里失守，对管线可信度和续约议价力的伤害，会比普通产品失误来得更快。
