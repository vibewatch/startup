      - number: '3.4'
        title: 护城河耐久性、替代品与负面证据
        blocks:
          - type: paragraph
            body: >-
              核心承销风险是：点状身份 proofing 即使在整体品类需求增长时，也可能更加商品化。独立市场报告和 NIST 都描述了围绕 AI 欺诈、deepfake 和 morph attacks
              的升级军备竞赛。这利好拥有更宽数据和工作流上下文的供应商，但也意味着原始证件或活体检测性能本身不太可能长期构成护城河。Socure 的答案是广度：图谱和联盟数据、公共部门信任、第一方欺诈和
              KYB。问题在于，广度越宽，替代压力也越上升。Alloy、Persona 和 Sardine 表明买方可以在别处买到编排和欺诈广度。直接 SSA 接入、Plaid
              Identity、TransUnion，以及人工审核或征信局堆栈，都说明窄工作流仍有可行替代。

              负面证据在这里也重要。New York 议员公开质疑 Socure 在州部署中的数据来源、透明度、偏见控制和人工审核实践。Socure
              回应称公司不是数据经纪商，不出售营销数据，并会测试偏见；但治理审视仍会抬高公共部门和高度受监管账户的尽调负担。结论因此是细腻的：在已审集合里，Socure
              很可能拥有最强的广度加信任故事之一；但只有当广度转化为可衡量的替代胜利、更深账户渗透和低于公开来源当前可见水平的多供应商并用时，护城河才足够耐久。
