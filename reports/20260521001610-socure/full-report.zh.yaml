      - - 决策和编排层
        - 在全生命周期应用规则、评分、补充验证逻辑和串联工作流
        - RiskOS 核心服务加 Effectiv 编排资产
        - 内部服务拓扑和 Effectiv 后续整合深度未公开
      - - 文档和生物识别层
        - 需要更高保证时，执行身份证件检查、活体检测和自拍验证
        - 摄像头采集质量、模型质量、设备条件和反欺骗韧性
        - 已有公开指标，但持续红队和抗欺骗细节有限
