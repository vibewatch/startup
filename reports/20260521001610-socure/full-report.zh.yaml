  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与打包
        blocks:
          - type: paragraph
            body: >-
              Socure 第五章故事已不再是单一身份验证小组件。公司公开把 RiskOS 呈现为一个宽身份与风险运营层，并明显拆分企业部署和自助 builder
              动作。表面上看，客户买的不只是被动身份解析；他们可以在同一商业框架中混合消费者开户、证件与生物识别加验、图谱情报、第一方欺诈、观察名单和合规工具、eCBSV，以及现在的企业开户工具。Launch
              很重要，因为它把平台变成面向开发者的产品，而不只是纯企业销售动作：builder 可以注册、测试真实场景、通过 API 或 hosted UI
              集成，再在后续升级到更宽企业工作流。这种打包具有战略意义，因为它支撑了 Socure 试图跨客户规模带拥有 trust layer 的论点。最终产品地图看起来真实且可变现，但公开打包仍没有给出尽调想看的模块
              attach rate、企业包装边界，以及营销广度究竟是深度集成还是商业相邻。
