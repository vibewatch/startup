  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: Socure 的典型旅程从欺诈或合规触发点开始，经由开户入门工作流落地；信任和集成建立后，再扩展到更宽的生命周期风险产品。
    data:
      nodes:
        - id: trigger
          label: 欺诈 / 合规触发
          detail: 银行、金融科技、游戏或机构团队发现欺诈损失上升、开户摩擦增加，或合规压力加大。
        - id: evaluation
          label: 评估
          detail: 买方用现有遗留检查和人工审核负荷，测试开户、证件、欺诈或公共部门模块。
        - id: initial-land
          label: 初始落地
          detail: 客户把消费者开户入门、账户开立或居民验证工作流，作为第一个生产用例上线。
        - id: go-live
          label: 上线
          detail: 管理层称，RiskOS 的平均上线时间已从大约六个月降到几周。
        - id: lifecycle-use
          label: 生命周期使用
          detail: 用法扩展到认证、支付、账户变更、观察名单筛查或项目完整性工作流。
        - id: cross-sell
          label: 交叉销售
          detail: 随着信任和要求加深，客户加入企业入驻、eCBSV、联盟产品或公共部门模块。
        - id: renew-expand
          label: 续约 / 扩张
          detail: 134% NDR 意味着留存下来的客户在增加支出或用量，尽管公开 GRR 缺失。
    approximationNotes: 旅程阶段来自公司工作流页面、部署案例和已披露上线表述的推断，而不是已发布的销售流程图。
    claimRefs:
      - CU011
      - CU014
      - CU016
      - CU028
      - CU044
      - CU051
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: Socure 的采用路径最适合用流程表示，因为公开证据支持按顺序展开的部署阶段，但不足以给出阶段之间可靠的公开转化率。
    data:
      nodes:
        - id: problem
          label: 问题发现
          detail: 买方在受监管工作流中，希望降低欺诈、加快审批或强化合规。
        - id: pilot
          label: 工作流评估
          detail: 客户评估开户、反欺诈或政府身份核验模块。
        - id: deploy
          label: 初始部署
          detail: Socure 先落在开户、福利领取或账户创建环节；已点名案例包括 Lili、Betterment、Public 和公共部门机构。
        - id: operate
          label: 运营使用
          detail: 数十亿次身份请求、数亿个身份，说明网络里已有真实生产流量。
        - id: expand
          label: 扩展
          detail: RiskOS、企业开户和联盟工具把客户关系从首个工作流继续拉长。
        - id: renew
          label: 留存检验
          detail: NDR 已披露，但公开队列和流失数据仍缺失。
      edges:
        - from: problem
          to: pilot
          label: 欺诈 / 合规需求
        - from: pilot
          to: deploy
          label: 选定工作流
        - from: deploy
          to: operate
          label: 上线
        - from: operate
          to: expand
          label: 交叉销售 / 更高用量
        - from: expand
          to: renew
          label: 留存与增购
    approximationNotes: 这里用流程图而非数字漏斗，因为公开来源披露了客户规模和结果，但没有披露逐阶段转化率。
    claimRefs:
      - CU011
      - CU014
      - CU028
      - CU033
      - CU051
      - CU052
  - id: FU003
    title: 客户证明矩阵
