      - number: '4.4'
        title: 财务结论与承销 blocker
        blocks:
          - type: paragraph
            body: >-
              财务结论方向积极，但仍受尽调约束。收入质量看起来优于一般私有基础设施公司，因为增长伴随 134%
              净美元留存、加速的客户规模、更宽工作流覆盖，以及一个可随时间导入更大部署的新自助楔子。公司也在出售高价值买方痛点——降低欺诈损失、合规和提高批准率——而不是纯商品化 lookup
              工具。如果产品广度在生产中确实集成，这些特征支持 Socure 守住定价并扩大钱包份额。

              但本章仅凭公开证据无法跨过完整承销门槛。已审来源没有提供审计收入报表、毛利率桥、现金 burn 历史、runway、已实现企业定价、客户集中度或债务
              covenant。即使没有公司特定执法行动，监管和隐私义务仍是真实运营成本与执行风险。实际投资立场应是：商业动能强、利润率上行有可能、公开层面没有明显 distress
              信号；但资产负债表和单位经济性盲点很大，必须在 data room 关闭后，才能承销高置信估值或融资判断。
