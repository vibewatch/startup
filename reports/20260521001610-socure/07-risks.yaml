- id: partner-data-network-and-authorization-dependency
  title: Partner, data-network, and authorization dependency
  body: 'Socure''s moat depends heavily on external dependencies that are valuable precisely because

    the company does not fully control them. For fintech and regulated onboarding, eCBSV is

    an authoritative signal, but SSA limits use to permitted entities and their service

    providers, requires tightly specified written consent, monitors transaction tiers, and

    charges meaningful subscription fees. If eligibility rules tighten, consent completion

    falls, or economics worsen, some high-confidence onboarding flows become less attractive.


    The same logic applies to consortium and graph products. Green Dot said consortium members

    see roughly 45 percent overlap in behavior across members, while Socure and PYMNTS describe

    a network spanning hundreds of millions of identities and billions of transactions. That

    scale is the product advantage — but it is also dependency risk if major contributors

    reduce participation or regulators narrow controller-like reuse of network data.

    Public-sector growth adds a parallel gate: FedRAMP and StateRAMP-style authorizations,

    procurement vehicles, and government-specific security expectations are not optional

    distribution enhancers; they are gating dependencies. A lapse there would impair both

    pipeline credibility and renewal leverage faster than a normal product miss.'
