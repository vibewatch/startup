  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-sector-enforcement-status
    missingEvidence: Named procurement-review documents, attorney-general correspondence, or regulator
      responses that confirm whether scrutiny escalated beyond press coverage.
    whyItMatters: The difference between noisy criticism and a real procurement or enforcement problem
      determines whether public-sector growth deserves a discount rate penalty.
    diligencePath: Request state and federal procurement files, complaint logs, and any regulator or agency
      response letters tied to Socure privacy or AI concerns.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: 1033-workflow-applicability
    missingEvidence: Product-by-product mapping of which Socure workflows touch consumer-permissioned
      data, third-party interfaces, and retention windows that could fall under Section 1033 expectations.
    whyItMatters: Without workflow and contract detail, investors cannot distinguish general regulatory
      backdrop from a direct operational constraint.
    diligencePath: Review architecture diagrams, customer contracts, retention settings, and interface
      SLAs for products used in bank and fintech onboarding or data-sharing flows.
    relatedQuestionRefs:
    - QR006
  - type: private-evidence-only
    severity: material
    topic: consortium-governance
    missingEvidence: Contributor concentration, opt-out rights, data-retention rules for graph intelligence,
      and evidence on how much performance drops if major contributors leave.
    whyItMatters: The network effect is central to Socure's moat, so contributor fragility or privacy
      constraints could impair differentiation faster than headline ARR suggests.
    diligencePath: Request contributor concentration tables, governance rules, contractual reuse rights,
      and sensitivity analysis on graph-performance lift by contributor cohort.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited revenue mix, gross margin, public-sector renewal rates, network-contributor
      concentration, and support-cost trends by product line.
    whyItMatters: Investors cannot fully size downside if strong top-line disclosures are masking concentration,
      margin compression, or service-intensity issues.
    diligencePath: Review board materials, audited statements, cohort retention by segment, and customer
      or contributor concentration schedules.
    relatedQuestionRefs:
    - QR025
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: independent-performance-corroboration
    missingEvidence: Independent customer studies, regulator evaluations, or third-party benchmarks validating
      claimed fraud-capture, approval-rate, and bias outcomes across major verticals.
    whyItMatters: Company-claimed operating metrics are directionally useful but do not provide underwrite-grade
      evidence that performance stays durable under adversarial drift.
