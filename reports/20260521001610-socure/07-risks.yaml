- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / procurement scrutiny
    - Named regulator, AG, or procurement escalation tied to privacy, data use, or AI fairness
    - Major state or federal contract suspension, procurement freeze, or formal inquiry naming Socure
    - Pause public-sector upside assumptions and require written remediation plus customer impact review
  - - Security / control failure
    - Material breach, control exception, or misrepresentation involving biometric, DocV, or graph data
    - Confirmed incident or finding that undermines safeguard representations for sensitive data
    - Treat as thesis-break until root cause, containment, and contract fallout are understood
  - - Model efficacy under AI-fraud surge
    - Publicly visible fraud miss, false-positive spike, or customer churn tied to performance drift
    - Two or more marquee customers cite measurable identity-performance deterioration or a major fraud
      bypass event
    - Re-underwrite moat durability and required remediation spend before adding capital
  - - Consortium / data-sharing fragility
    - Contributor attrition, opt-out pressure, or privacy limits on controller-like graph use
    - Loss of key contributors or a disclosed policy change that materially narrows reusable network data
    - Cut network-effect upside assumptions and re-evaluate Graph Intelligence valuation premium
  - - eCBSV dependency
    - SSA fee, scope, availability, or consent-process deterioration
    - Tier repricing, sustained outages, or rule changes that materially reduce attach rate or economics
    - Revisit regulated-onboarding assumptions and model alternative-authority coverage
  - - Execution / disclosure slippage
    - Growth narrative weakens materially while disclosure on mix, margins, renewals, and workload remains
      thin
    - Management can no longer defend accelerated growth with stable retention, service quality, or greater
      transparency
    - Downgrade confidence and require deeper diligence before underwriting expansion multiples
  notes: These triggers are designed to be monitorable and investment-relevant rather than exhaustive.
    Any one of the first four rows could compress valuation faster than a normal quarterly miss because
    the business is selling trust infrastructure, not discretionary software alone.
