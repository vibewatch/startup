- id: operational-model-and-security-risk
  title: Operational, model, and security risk
  body: 'Operationally, Socure is trying to win in the hardest possible identity environment: AI-generated
    deepfakes, synthetic identities, nation-state tactics, higher-ed refund fraud, public-benefit fraud,
    and fast-moving startup and crypto abuse cases. Company materials say AI-based fraud attacks surged
    more than 8,000 percent in 2025, while NIST''s final SP 800-63 revision added continuous-evaluation
    metrics plus controls for forged media and injection attacks. Socure then published a March 2026 post
    titled "The Layer Deepfake Detection is Missing," and Mitek''s 2025 10-K says peer platforms now market
    biometric liveness and deepfake-detection capabilities to more than 7,000 organizations. The implication
    is that static model governance is insufficient; Socure must continuously recalibrate models, vendor
    inputs, and workflow thresholds without creating false-positive spikes that block legitimate users.


    RiskOS unifies email, phone, device, IP, biometrics, documents, behavior, and other PII, and Socure
    says the platform now supports more than 200 third-party integrations. That breadth is a strength,
    but it also increases blast radius if upstream data quality degrades, if a customer-enabled integration
    fails, or if a security incident touches biometric or document-verification surfaces. Public descriptions
    of governance, third-party risk review, and investigator oversight are helpful mitigants, yet independent
    performance-drift, exception-queue, and incident data remain private. Investors should therefore underwrite
    control-system adaptability, not just current fraud capture marketing claims.'
