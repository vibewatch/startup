  title: Market sizing lens
  type: pyramid
  summary: The broad public IDV market is large, but Socure’s serviceable wedge narrows as the lens moves from total market size to regulated, enterprise-heavy workflows.
  data:
    nodes:
    - id: n1
      label: Broad global IDV market
      description: Retained 2026 public estimates cluster between $14.1B and $16.05B across FMI, Mordor, and Coherent.
    - id: n2
      label: Regulated vertical concentration
      description: BFSI appears to represent roughly 30.72% to 32.8% of the broad market, keeping financial-services workflows central.
    - id: n3
      label: Enterprise-heavy delivery
      description: Mordor says cloud held 65.12% share and large enterprises 72.56% share in 2025, implying a serviceable market skew toward scaled buyers.
    - id: n4
      label: Socure serviceable wedge
      description: Socure’s likely wedge is regulated digital onboarding plus identity-linked fraud prevention in financial services, public sector, higher education, and KYB, but no public SOM is disclosed.
  approximationNotes: This figure layers public lenses instead of asserting an unsupported TAM/SAM/SOM stack. The final layer is qualitative because no retained public source provides a Socure-specific market-share baseline.
