- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI-enabled deepfakes, injection attacks, and spoofed documents
    - Driver
    - Current / structural
    - Pushes buyers toward liveness, document verification, and adaptive fraud models rather than static checks
    - Ask for mix shift toward DocV, biometric, and high-risk workflow volumes by segment
  - - Remote onboarding ROI from faster approvals and lower manual review
    - Driver
    - Current / structural
    - Supports budgets where conversion, labor savings, and customer experience matter as much as raw fraud capture
    - Request customer-level proof of approval lift, manual-review savings, and payback period
  - - Financial-services data and compliance layers such as eCBSV and Section 1033 interfaces
    - Driver
    - Current / near-term
    - Make regulated financial workflows richer and harder to solve with simple point tools
    - Ask which bank and fintech workflows depend on these data or interface requirements in practice
  - - Public-sector fraud losses and digital-service modernization
    - Driver
    - Current / multi-year
    - Supports government demand for secure, inclusive identity proofing across benefits and digital access
    - Request federal versus state/local pipeline, program types, and procurement cycle length
  - - First-party-fraud and consortium-style lifecycle intelligence
    - Driver
    - Current / structural
    - Expands the market beyond day-one KYC into ongoing identity-linked abuse prevention
    - Measure attachment rates for first-party fraud or post-onboarding modules
  - - Privacy and security enforcement burden
    - Constraint
    - Current / structural
    - Raises the cost of collecting, storing, and explaining sensitive identity data
    - Request governance controls, consent flows, audit outcomes, and privacy incident history
  - - Procurement, bias, and performance-marketing scrutiny in public-sector deployments
    - Constraint
    - Current / near-term
    - Can slow sales cycles and require more third-party validation even when fraud need is high
    - Request public-sector references, fairness testing, and litigation or complaint status
  - - No public SAM, pricing, or segment-level unit economics
    - Constraint
    - Current
    - Limits precision in valuation work because broad market growth does not automatically translate into monetizable share
    - Request pricing architecture, attach rates, and segment revenue mix from management
  notes: The strongest drivers are not just category growth headlines; they are workflow changes that force buyers to replace static checks with adaptive identity infrastructure. The most important constraints are governance and monetization clarity, not whether the broad market exists.
