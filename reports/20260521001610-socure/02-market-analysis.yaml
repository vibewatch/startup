  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-som-visibility
    missingEvidence: A management-backed decomposition of Socure addressable spend by banking, fintech, public sector, higher education, and business onboarding, including estimated market share or penetration by segment.
    whyItMatters: Without segment-level revenue mix or share data, the chapter can only defend a broad market range and a qualitative serviceable wedge, not a clean Socure-specific SAM or SOM.
    diligencePath: Request management’s current revenue mix, verification-volume mix, and win-rate assumptions by segment; reconcile them with retained market reports and large-customer disclosures.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: public-sector-mix
    missingEvidence: A breakout of federal versus state and local versus higher-education customers, volumes, and contract values inside Socure’s public-sector book.
    whyItMatters: Public-sector demand is clearly real, but valuation depends on which subsegments are recurring, how procurement-heavy they are, and whether adoption is concentrated in a few flagship programs.
    diligencePath: Ask for current ARR, customer count, pipeline, and renewal metrics by federal, state and local, and higher-education cohorts, plus the top live use cases in each.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: Public pricing, contract values, take rates, or per-transaction economics by workflow and buyer segment.
    whyItMatters: Market size alone does not determine attractiveness; pricing power and verification-unit economics decide how much of the broad identity market can convert into durable revenue.
    diligencePath: Collect procurement records, RFP responses, customer references, and management disclosures on average contract value, volume tiers, and module attach rates.
    relatedQuestionRefs:
    - QM025
  - type: access-blocked
    severity: minor
    topic: opaque-commercial-market-data
    missingEvidence: The exact numeric values behind the Research and Markets public-excerpt sizing framework.
    whyItMatters: The public excerpt corroborates that a commercial TAM framework exists, but it does not add a directly comparable public 2026 value to the retained estimate range.
    diligencePath: Purchase the full report or replace it with another independently fetched market source that publishes explicit 2026 values.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: public-sector-performance-scrutiny
    missingEvidence: Independent audit evidence, reference-call detail, or adjudicated case outcomes that validate or rebut Socure’s public-sector accuracy, bias, and fraud-reduction claims.
    whyItMatters: Procurement and privacy scrutiny can slow deployment even in an attractive market, especially when buyers need to defend model fairness and public-benefit access decisions.
    diligencePath: Request public-sector customer references, bias testing summaries, error-rate audits, and the current status of any litigation or procurement reviews cited in adverse coverage.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
