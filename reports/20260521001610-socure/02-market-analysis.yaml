company:
  name: Socure
chapter:
  number: 2
  title: Market Analysis
  summary: Socure’s most defensible market is not all fraud or all digital trust, but the narrower identity-proofing and identity-linked fraud-decisioning stack sold into regulated onboarding and public-service workflows. Retained public estimates place the broad 2026 global identity-verification market around $14.1 billion to $16.05 billion, but the serviceable wedge is narrower and concentrated in BFSI, public sector, higher education, and KYB workflows where AI-enabled fraud, compliance pressure, and labor-saving automation all matter at once.
sections:
- id: market-boundary-and-included-spend
  title: Market boundary and included spend
  body: The cleanest way to define Socure’s market is not “all trust infrastructure” or “all fraud software,” but the narrower set of workflows where a digital organization must decide whether a claimed identity is real, present, and safe to transact with. The retained Socure product pages consistently bundle identity verification, document and biometric proofing, fraud prevention, and orchestration into one operating layer. That means the included spend starts with consumer onboarding and high-risk account events, then expands into document verification, liveness, synthetic-identity defense, and first-party-fraud controls when those capabilities are part of the same decision flow. Business onboarding also belongs inside the boundary because Socure explicitly sells KYB, UBO verification, and sanctions screening inside one API-driven workflow. By contrast, this chapter excludes pure payments processing, generic cybersecurity spend, physical-access IAM, and standalone transaction-monitoring
    tools when they are not solving a digital identity-proofing problem. The financial-services wedge is especially important because SSA eCBSV is a high-value verification input that is only available to permitted entities tied to financial institutions and their service providers, which narrows one particularly strong data advantage to a specific buyer class.
