  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Budget Substitution, and Category Scope
        blocks:
          - type: paragraph
            body: >-
              EliseAI operates across housing and healthcare, two foundational operational sectors that together
              constitute more than 40% of the average American household budget. Rather than selling point-solution
              software tools that compete for modest IT and software licensing line items, the company positions its
              platform to absorb day-to-day administrative labor budgets. In residential rental properties, EliseAI's
              scope spans the full lifecycle of tenant and prospect interactions, including after-hours leasing inquiry
              triage, automated tour scheduling, resident maintenance request intake, lease renewal outreach, and
              delinquency follow-up. By integrating these conversational and agentic workflows into a centralized
              operational hub via EliseCRM, operators transition site-level staff away from repetitive administrative
              bottlenecks. Concurrently, the platform's expansion into specialty outpatient healthcare targets
              front-desk workflows—such as inbound call management, appointment scheduling, and patient intake—tackling
              administrative friction within a broader $600 billion national healthcare administration spend while
              leaving clinical electronic health record systems to incumbent providers.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM014
      - number: '2.2'
        title: 'Market Sizing Lenses: Software Benchmarks vs. Operational TAM'
        blocks:
          - type: paragraph
            body: >-
              Market sizing for vertical AI in real estate and healthcare requires evaluating multiple operational
              lenses rather than relying on a single top-down software figure. Traditional property management software
              represents a $6.53 billion global market in 2026, projected by Mordor Intelligence to reach $9.93 billion
              by 2031 at an 8.74% compound annual growth rate. However, EliseAI's commercial strategy captures a
              substantially larger economic footprint by competing against property-level operational payroll and
              administrative overhead. In multifamily housing, the platform has achieved category leadership, powering
              approximately one in six apartment units across the United States and securing commercial contracts with
              roughly 70% of the NMHC Top 50 rental operators. In healthcare, the market opportunity is anchored in an
              estimated $150 billion in annual financial losses resulting directly from missed clinic appointments and
              patient scheduling failures. By demonstrating verified operational labor displacement across large
              institutional portfolios, EliseAI expands its serviceable market well beyond the boundaries of traditional
              property management software licenses.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Workflow Ownership, and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Customer adoption across EliseAI's core markets is segmented by portfolio scale, regulatory complexity,
              and operational centralization capacity. Institutional multifamily operators managing portfolios above
              5,000 units represent the primary revenue engine, where corporate leadership seeks to centralize leasing
              operations, reduce on-site payroll, and overcome persistent staffing shortages. For mid-market operators
              managing between 500 and 5,000 units, procurement is typically triggered by inquiry response lag and
              after-hours lead leakage. In the affordable housing sector, adoption is driven by stringent statutory
              compliance, voucher verification, and annual recertification mandates where operational errors risk severe
              regulatory penalties. In healthcare, specialty physician groups deploy AI agents to mitigate high call
              abandonment rates and administrative burnout among front-desk staff. Industry benchmarks indicate that
              EliseAI's pricing typically structures as a recurring subscription between $1.00 and $2.50 per residential
              unit per month for large portfolios, accompanied by data-mapping implementation fees that reflect the
              technical complexity of bidirectional integration.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM011
              - CM014
      - number: '2.4'
        title: Adoption Drivers, Operating Constraints, and Macro Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Adoption of operational AI in multifamily housing is accelerating against severe margin pressures and
              macroeconomic shifts. Survey data across 350 industry decision-makers reveals that 89% of operators
              anticipate rising property insurance premiums, with 49% expecting significant or severe cost increases,
              while 57% express concern regarding new apartment supply weighing on market rents. While 89% of operators
              have introduced AI and 85% report verified operating expense reductions, only 34% have fully embedded
              automated agents into daily operations. Widespread deployment remains constrained by legacy property
              management system integration challenges (cited by 35% of operators) and internal technical limitations
              (28%). Furthermore, 76% of operators currently navigate multi-vendor AI sprawl, creating an urgent
              priority for vendor consolidation (27%). In parallel, interest rate volatility and construction cycles
              present macro headwinds that can dampen leasing urgency, forcing operators to rigorously prioritize
              platforms that demonstrate rapid payback through verified operational expense reduction.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Budget Substitution Over Software Licensing
            body: >-
              EliseAI's rapid ARR growth stems from pricing against operational payroll and labor replacement rather
              than conventional software IT budgets. With 85% of adopting operators realizing measurable operating
              expense reductions, the platform expands its effective market ceiling beyond legacy property management
              software.
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
          - type: callout
            title: Legacy PMS Integration and Vendor Consolidation Bottlenecks
            body: >-
              While 76% of operators utilize multiple AI point solutions, 35% cite integration friction and 28% report
              legacy PMS constraints as primary barriers to end-to-end automation. Operator demand for vendor
              consolidation creates a high-stakes race where failure to maintain deep bidirectional synchronization with
              systems like Yardi and RealPage risks displacement.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive arena in multifamily leasing automation has rapidly bifurcated into two distinct
              operational paradigms: enterprise-grade autonomous communication layers and embedded point solutions.
              EliseAI has emerged as the clear market leader in the enterprise tier, achieving over $200 million in
              annual recurring revenue and securing a $4 billion valuation to support approximately one in six apartment
              units across the United States. Direct independent competition has contracted significantly through
              consolidation; notably, venture-backed leasing bot Zuma was acquired by property technology platform Venn
              for $50 million, effectively eliminating its standalone market presence. Simultaneously, point-solution
              alternatives like Structurely and Verse.ai remain confined to residential real estate sales teams and
              single-agent brokerages, lacking the bidirectional property management system (PMS) integrations and
              multifamily portfolio scale required by institutional operators. In the healthcare adjacency, specialized
              competitors such as Assort Health have raised $50 million Series B rounds at a $750 million valuation to
              automate hospital phone intake, highlighting that EliseAI's cross-vertical expansion must defend against
              well-capitalized domain specialists while scaling its core residential footprint.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.2'
        title: 'Capability Benchmarking: Omnichannel Breadth and Conversational Latency'
        blocks:
          - type: paragraph
            body: >-
              Differentiation between EliseAI and competing leasing assistants centers on latency architecture,
              omnichannel capability, and the depth of property management system synchronization. While mid-market
              competitors like Lea (formerly BetterBot) provide basic prospect qualification with a rapid two-to-four
              week onboarding timeline, they operate primarily on decision-tree logic or generic LLM APIs with response
              latencies between 1.5 and 2.0 seconds. In contrast, EliseAI utilizes custom-trained models with on-policy
              self-distillation to achieve an industry-leading 250-millisecond conversational latency, eliminating
              unnatural pauses during voice interactions. Furthermore, EliseAI supports inbound and outbound voice in
              seven languages alongside text, email, and web chat across 51 languages, natively synchronizing guest
              cards, availability, and tour bookings with Yardi, RealPage, Entrata, and AppFolio. Although this depth
              requires a longer four-to-eight week deployment phase involving rigorous data mapping, large institutional
              operators such as Equity Residential have credited the resulting operational centralization with
              delivering roughly $14 million in annual payroll reductions.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
              - CP014
      - number: '3.3'
        title: Pricing Dynamics, Minimums, and the Threat of PMS Bundling
        blocks:
          - type: paragraph
            body: >-
              EliseAI enforces an enterprise-oriented, quote-only monetization framework that deliberately targets large
              portfolio operators managing at least 500 to 700 units. Industry disclosures indicate pricing ranges from
              $3 to $6 per unit per month, underpinned by a reported annual contract expenditure minimum of
              approximately $25,000. For large institutional portfolios managing thousands of doors, this expense is
              readily absorbed by labor reallocations, where centralized leasing teams replace redundant site-level
              administrative staffing. However, for mid-sized and regional property managers, the annual minimum sharply
              elevates the effective per-unit cost to unsustainable levels. This dynamic creates a substantial opening
              for incumbent property management software providers. Platforms like AppFolio (featuring Realm-X) and
              Buildium (featuring Lumina) are embedding conversational AI directly into their core software tiers at
              nominal or zero incremental cost. For operators with fewer than 500 units, bundled PMS solutions provide
              sufficient baseline automation, effectively capping EliseAI's addressable market at the institutional
              boundary.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Regulatory Asymmetries
        blocks:
          - type: paragraph
            body: >-
              EliseAI's structural defensibility rests on data network effects, deep workflow entanglement, and high
              migration friction. Once integrated across an institutional portfolio, the assistant accumulates
              proprietary conversation histories, localized building amenity rules, and historical resident interaction
              context that cannot be exported to competing vendors upon contract termination. This architectural
              asymmetry creates acute vendor lock-in, forcing any departing customer to undergo disruptive PMS
              re-integrations, staff retraining, and customer re-onboarding. Furthermore, operating across regulated
              residential leasing demands strict adherence to fair-housing mandates, where automated conversational
              agents must reliably avoid discriminatory steering or unlawful qualification criteria. While EliseAI's
              massive capitalization ($350 million raised in late 2026) enables dedicated compliance engineering that
              outpaces smaller startups, the absence of publicly disclosed, independent third-party algorithmic bias
              audits remains an ongoing diligence gap for underwriting institutional risk.
            claimRefs:
              - CP002
              - CP008
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural PMS Bundling Threatens Mid-Market Expansion
            body: >-
              While EliseAI dominates institutional multifamily operators (500+ units), incumbent property management
              software providers like AppFolio (Realm-X) and Buildium (Lumina) are aggressively embedding native
              conversational AI into core platforms at marginal or zero added cost. Because EliseAI enforces a reported
              ~$25,000 annual contract floor, it remains economically unviable for smaller landlords, creating a ceiling
              on addressable unit expansion unless EliseAI introduces lower-tier self-serve packaging.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              EliseAI monetizes its vertical automation platform primarily through B2B subscription
              software-as-a-service (SaaS) agreements priced on a per-unit-per-month basis across multifamily housing
              portfolios. In June 2026, the company announced that it surpassed $200 million in annual recurring revenue
              (ARR), achieving 100% year-over-year revenue growth for the fifth consecutive year. Independent research
              from Sacra corroborates this growth trajectory, estimating that EliseAI scaled from approximately $37
              million ARR at year-end 2023 to $75 million at year-end 2024, $150 million at year-end 2025, and reached
              $200 million in ARR by May 2026. The commercial wedge is driven by conversational front-office automation,
              with EliseCRM operating as the centralized platform layer that unifies prospect interactions, leasing
              communication, maintenance dispatch, resident renewals, fee transparency disclosures, and delinquency
              workflows. Customer deployments are structured around annual enterprise commitments, reflecting the
              integration overhead required to connect with property management systems of record and electronic health
              record software. While list pricing is not publicly published, customer procurement data indicates that
              pricing is contracted on a recurring per-unit subscription unit basis, with expansion driven by
              cross-portfolio unit additions and multi-module attach rates across resident services and outpatient
              specialty practices.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI006
              - CI013
