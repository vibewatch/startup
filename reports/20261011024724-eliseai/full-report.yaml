  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Market Profile
        blocks:
          - type: paragraph
            body: >-
              EliseAI's commercial foundation rests primarily on institutional multifamily housing operators, but the
              platform has systematically broadened its customer segmentation to include single-family rental
              portfolios, affordable housing operators, and outpatient healthcare practices. In conventional
              multifamily, EliseAI targets enterprise property managers seeking 24/7 lead capture, autonomous tour
              scheduling, and centralized leasing operations. Affordable housing operators, exemplified by Vesta
              Corporation, adopt the platform to automate strict regulatory intake and resident communications under
              lean staffing models. In healthcare, EliseAI addresses specialty physician groups struggling with
              front-desk staff turnover, automating patient intake, referrals, and scheduling. Across these segments,
              EliseAI positions its conversational AI agents as an operational backbone that directly integrates with
              core transaction systems rather than serving as an external web widget.
            claimRefs:
              - CU001
              - CU004
