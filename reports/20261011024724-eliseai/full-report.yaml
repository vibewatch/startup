chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Market Positioning
        blocks:
          - type: paragraph
            body: >-
              Founded in 2017 as MeetElise by Minna Song and Tony Stoyanov, EliseAI has established itself as the
              leading vertical artificial intelligence automation platform for the residential housing and healthcare
              sectors. The company operates from its corporate headquarters in a 109,000-square-foot office in
              Manhattan, New York, while actively establishing a second engineering hub in San Francisco. Rather than
              selling generic horizontal AI or standalone chatbots, EliseAI embeds conversational and operational
              intelligence directly into incumbent property management systems and electronic health record workflows.
              The platform automates repetitive administrative communication across omnichannel touchpoints including
              SMS, webchat, email, and phone, powering approximately one in six apartment units across the United States
              and serving over 30 million cumulative consumer interactions.
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
