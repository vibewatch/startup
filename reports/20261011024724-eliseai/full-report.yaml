            claimRefs:
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Automating customer interactions in residential leasing and healthcare places EliseAI at the intersection
              of heavily regulated consumer workflows [CR001]. In housing, conversational AI agents handle prospect
              pre-qualification, touring schedules, and application guidance. Under the federal Fair Housing Act and
              equivalent state statutes, communications that inadvertently steer prospective tenants, apply inconsistent
              qualification criteria, or provide discriminatory responses create strict liability for property owners
              and their software vendors [CR001]. EliseAI's survey research confirms that data privacy and regulatory
              compliance represent the single most prevalent blocker to AI expansion, cited by 39% of multifamily
              decision-makers [CR002]. Furthermore, EliseAI's aggressive expansion into healthcare operations with
              HealthAI introduces HIPAA compliance obligations, patient data privacy requirements, and clinical
              scheduling liability [CR001, CR004]. Because both housing and healthcare operate under thin operating
              margins and heightened regulatory oversight [CR004], any compliance failure or regulatory enforcement
              action could abruptly halt enterprise customer adoption and impair the company's $4 billion valuation
              [CR003].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Failure Modes and Tech-Stack Integration Friction
        blocks:
          - type: paragraph
            body: >-
              Operational deployment data indicates a widening gulf between surface-level AI adoption and full
              operational integration [CR005]. While 89% of multifamily operators report introducing AI in some form,
              only 34% have fully embedded it into daily business operations, leaving 41% partially deployed and 14%
              confined to pilot programs [CR005]. This deployment friction stems primarily from technical integration
              hurdles with legacy property management systems (PMS), with 35% of operators citing tech-stack integration
              and 28% citing legacy software limitations as top barriers [CR006]. EliseAI manages communication across
              voice, SMS text, email, and web chat through EliseCRM [CR008], requiring real-time bi-directional
              synchronization with back-office accounting and leasing engines such as Yardi, RealPage, and Entrata. Weak
              integrations or data mismatches can result in double-booked units, erroneous concession quotes, or dropped
              emergency maintenance escalations. Furthermore, 76% of operators operate fragmented multi-vendor AI
              environments with two or more solutions [CR007], creating operational friction that strains onsite teams
              already grappling with a 28% shortage of internal technical expertise [CR014]. At a 20x ARR multiple
              [CR013], EliseAI cannot afford integration-induced churn.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
