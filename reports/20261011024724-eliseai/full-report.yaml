              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Low-Latency Custom Model Edge
            body: >-
              By replacing generic third-party API wrappers with custom-trained models hosted on dedicated Baseten
              infrastructure, EliseAI achieved a 250ms conversational response time. Coupled with On-Policy
              Self-Distillation, this architecture prevents the conversational lag that disrupts automated voice
              interactions.
            calloutType: strength
