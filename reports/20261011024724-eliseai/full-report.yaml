            body: >-
              The primary structural vulnerability in EliseAI's vertical thesis lies in potential regulatory scrutiny
              under the Fair Housing Act regarding automated tenant screening and leasing dialogues. Investors should
              establish an explicit thesis-break trigger: any formal enforcement action by HUD or state attorneys
              general that restricts automated prospect qualification or mandates costly manual review would
              fundamentally impair the platform's operating leverage.
