  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              EliseAI presents a compelling category-defining investment thesis as the primary vertical AI operating
              system for residential property management, now expanding into specialty healthcare. The platform has
              achieved unmatched scale, automating communications and operational workflows across 6.5 million apartment
              units, representing roughly one in six rental units in the United States. Its ability to deeply integrate
              into existing property management systems creates formidable switching costs and enduring defensibility
              against horizontal AI entrants. The anti-thesis centers on valuation discipline, product commoditization
              risks, and disclosure opacity. At an implied multiple of 20x annual recurring revenue following its $350
              million Series F round, the entry valuation prices in near-perfect execution across both housing and
              healthcare. Furthermore, third-party analysts emphasize that EliseAI has not publicly released audited
              customer-level return-on-investment studies or a segregated revenue breakdown demonstrating the standalone
              traction and margin profile of its healthcare business.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
