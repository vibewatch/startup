  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Operational Module Architecture
        blocks:
          - type: paragraph
            body: >-
              EliseAI delivers a specialized vertical AI platform designed to automate high-volume communication and
              repetitive administrative tasks across residential housing and outpatient healthcare operations. Rather
              than acting as a superficial messaging bot, the platform functions as an integrated operational teammate
              that captures prospect demand, nurtures inquiries, and coordinates day-to-day property operations. The
              software suite spans multiple dedicated product lines, including LeasingAI for prospect capture and
              automated tour scheduling, ResidentAI for resident lifecycle management and maintenance ticket triage,
              VoiceAI for continuous zero-hold-time telephone communication across inbound and outbound channels, and
              EliseCRM as a centralized operational hub. In September 2026, the company introduced Apollo, its first
              fully agentic AI teammate capable of executing multi-step operational workflows directly within customer
              systems while escalating binding or sensitive decisions to human operators. Across all communication
              channels—including voice, text, email, and web chat—the platform operates continuously, supporting 7
              spoken and 51 written languages to ensure seamless tenant and patient engagement.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: End-to-End Workflow Automation Across Housing and Healthcare
        blocks:
          - type: paragraph
            body: >-
              The operational value of EliseAI stems from its ability to close communication loops autonomously without
              requiring manual staff intervention. In residential property management, the system replaces manual
              administrative touchpoints by qualifying prospect inquiries, parsing amenity preferences, checking
              real-time unit availability, and scheduling in-person or self-guided tours directly onto leasing
              calendars. For ongoing residency, the platform categorizes inbound maintenance requests using natural
              language understanding, assesses issue urgency, and automatically submits structured work orders into
              property management systems. Additionally, automated non-confrontational payment reminders assist onsite
              managers in mitigating delinquency before formal legal eviction proceedings become necessary. In
              healthcare, EliseAI replicates this operational playbook for outpatient specialty practices, automating
              inbound voice inquiries, patient referral intake, bidirectional calendar scheduling, pre-encounter chart
              preparation, and insurance eligibility checks. However, real-world deployment requires careful threshold
              calibration: without precise request categorization filters, automated resident outreach can generate work
              order overload by submitting dozens of minor non-emergency service requests daily.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE010
              - CE014
