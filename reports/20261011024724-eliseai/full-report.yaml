      - number: '6.4'
        title: Lifecycle Dynamics, Adoption Friction & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite rapid customer expansion, real-world deployments reveal meaningful operational friction during
              customer onboarding and ongoing resident management. Integrating EliseAI into institutional portfolios
              requires 4 to 8 weeks of technical data mapping across property management systems like Yardi, RealPage,
              and Entrata. Furthermore, property managers report the 'efficiency trap' where conversational bots
              over-prompt residents for maintenance feedback, triggering floods of low-priority work orders that
              overwhelm maintenance teams. Resident frustration also arises when automated bots loop without human
              escalation, necessitating robust human-in-the-loop safeguards. On the expansion front, EliseAI leverages
              its EliseCRM hub to expand from initial leasing capture into renewals, maintenance triage, and payment
              reminders. As 89% of multifamily operators now deploy AI, EliseAI's durability hinges on sustaining high
              net retention and expanding further into outpatient healthcare.
