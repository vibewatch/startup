      - number: '5.3'
        title: Technical Stack, Inference Latency, and Agentic Orchestration
        blocks:
          - type: paragraph
            body: >-
              Under the hood, EliseAI relies on a purpose-built technical infrastructure designed to overcome the
              conversational latency limitations inherent in generic large language model wrappers. Under the technical
              leadership of co-founder and CTO Tony Stoyanov, the engineering organization transitioned from third-party
              closed APIs to proprietary custom-trained models hosted on dedicated Baseten inference infrastructure.
              This migration compressed conversational latency from standard 2.2-second round-trips down to 250
              milliseconds, comfortably below the critical 1.3-second threshold required for natural human speech
              interaction. The platform incorporates On-Policy Self-Distillation (OPSD) training techniques to interpret
              colloquial and ambiguous tenant inputs—such as informal move-in timelines or approximate budgets—with high
              semantic accuracy. Furthermore, specialized structured JSON extraction modules reliably map conversational
              inputs into strict database fields rather than unindexed strings. The orchestration framework powers
              Apollo, coordinating autonomous task execution across connected tools while strictly enforcing
              human-in-the-loop escalation boundaries for edge cases and exceptions.
            claimRefs:
              - CE006
              - CE007
              - CE011
              - CE015
          - type: figure
            figureRef: FE001
