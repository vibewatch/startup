    title: Company Milestone Timeline
    type: timeline
    summary: Chronological evolution of EliseAI from 2017 inception through 2026 expansion into agentic AI and healthcare.
    data:
      items:
        - label: '2017: Company Founded'
          date: '2017'
          detail: Minna Song and Tony Stoyanov found MeetElise in New York after researching operational leasing bottlenecks.
          tone: neutral
        - label: '2023: Healthcare Vertical Launch'
          date: '2023'
          detail: Expands AI automation from multifamily housing into outpatient healthcare administration.
          tone: positive
        - label: 'Aug 2024: Series D Unicorn Round'
          date: 2024-08
          detail: Raises $75M Series D led by Sapphire Ventures, reaching a $1B valuation.
          tone: positive
        - label: 'Aug 2025: Series E Financing'
          date: 2025-08
          detail: Raises $250M Series E led by a16z at a $2.2B valuation.
          tone: positive
        - label: 'Jun 2026: $200M ARR Milestone'
          date: 2026-06
          detail: Surpasses $200M in annual recurring revenue following five consecutive years of doubling revenue.
          tone: positive
        - label: 'Sep 2026: Apollo Agentic AI Launch'
          date: '2026-09-03'
