      - number: '5.4'
        title: Enterprise Integrations, Deployment Realities, and Compliance Governance
        blocks:
          - type: paragraph
            body: >-
              A critical competitive moat for EliseAI is its deep integration into core enterprise systems of record.
              The platform maintains certified bidirectional synchronization with dominant property management systems,
              including Yardi, Entrata, and RealPage, alongside CRM solutions like Funnel, Rent Manager, and Bluemoon.
              This integration enables real-time extraction of unit pricing, floor plans, and concession data, while
              simultaneously writing back guest cards, booked appointments, and service orders. Because deep integration
              requires extensive property-specific data mapping, initial enterprise deployment entails a 4-to-8 week
              onboarding timeline where floor plans, amenities, and escalation rules are cataloged. For healthcare
              workflows, EliseAI adheres to rigorous compliance standards, incorporating HIPAA-compliant data
              encryption, granular role-based access controls, and administrative safeguards. While these controls
              secure sensitive patient and resident records, independent third-party algorithmic audit reports verifying
              compliance with federal Fair Housing Act nondiscrimination requirements remain unverified by public
              documentation, representing an ongoing governance diligence focus.
            claimRefs:
              - CE008
              - CE009
              - CE012
              - CE013
