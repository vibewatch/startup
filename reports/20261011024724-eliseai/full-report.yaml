        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Stance: Growth Allocation with Preference Scrutiny'
            body: >-
              EliseAI warrants a Buy recommendation for dedicated growth mandates given its unmatched footprint across
              one in six U.S. apartments and rapid ARR expansion to $200 million. However, because entry at 20x ARR
              leaves little tolerance for execution slip or regulatory friction, late-stage allocations should condition
              commitment on confirming senior liquidation preference structures and auditing customer unit retention.
            calloutType: recommendation
            claimRefs:
