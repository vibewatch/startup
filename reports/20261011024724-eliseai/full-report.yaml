      - number: '6.3'
        title: Institutional Deployments & ROI Case Evidence
        blocks:
          - type: paragraph
            body: >-
              Public customer case evidence confirms that EliseAI has moved beyond experimental pilots into
              mission-critical production deployments with Tier-1 institutional landlords. Publicly traded apartment
              REIT Equity Residential represents the benchmark customer proof point, attributing $14 million in annual
              payroll savings to EliseAI as part of an initiative to centralize leasing offices and automate
              administrative communications. Other institutional operators standardizing operations on EliseAI include
              Brookfield Properties, Greystar, AvalonBay, Bozzuto, and Invitation Homes. In the affordable housing
              sector, Vesta Corporation utilizes EliseAI to maintain regulatory compliance and customer responsiveness
              without overburdening lean on-site teams. Across these deployments, documented ROI centers on shortening
              lead response time from hours to seconds, capturing off-hours prospect tours, and reducing repetitive
              on-site administrative overhead.
            claimRefs:
              - CU005
              - CU006
              - CU008
