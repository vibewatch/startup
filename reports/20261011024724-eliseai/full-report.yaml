      - number: '8.2'
        title: Valuation Context and Financing History
        blocks:
          - type: paragraph
            body: >-
              On September 29, 2026, EliseAI closed a $350 million Series F financing round at a $4.0 billion post-money
              private valuation, co-led by Andreessen Horowitz and Bessemer Venture Partners with participation from
              Ontario Teachers' Pension Plan, Sapphire Ventures, and Navitas Capital. This transaction represents an 82%
              valuation uplift over the company's August 2025 Series E round of $2.2 billion, bringing cumulative equity
              capital raised to $756.93 million across eight institutional financing rounds. The transaction pricing
              establishes an entry multiple of 20.0x on EliseAI's reported June 2026 ARR milestone of $200 million. This
              multiple represents a significant premium relative to broader proptech venture valuations, where global
              funding contracted 65% from peak levels to $4.53 billion in the first half of 2026. The willingness of
              top-tier institutional sponsors like Ontario Teachers' to transact at 20x ARR validates EliseAI's
              exceptional five-year record of doubling ARR annually, while signaling that late-stage capital is
              concentrating aggressively into proven vertical AI leaders.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
      - number: '8.3'
        title: Scenario Analysis and Return Profiles
        blocks:
          - type: paragraph
            body: >-
              To evaluate risk-adjusted returns from the $4.0 billion Series F entry mark, we model three prospective
              operational scenarios over a three-year investment horizon through 2029. In the base case, EliseAI
              achieves a 50% ARR CAGR, growing from $200 million to $675 million as it deepens penetration among
              existing property operators and scales Apollo agentic workflows. As market maturity and scale compress the
              exit multiple to 10.0x ARR, the resulting enterprise value reaches $6.75 billion, delivering a 1.69x MOIC
              and 19.1% annualized IRR. In the bull case, driven by rapid healthcare adoption and successful deployment
              of fully autonomous property management workflows, ARR expands at a 75% CAGR to $1.07 billion. Sustaining
              a 12.0x exit multiple yields an enterprise value of $12.86 billion, representing a 3.22x MOIC and 47.6%
              IRR. Conversely, the bear case reflects growth deceleration to 25% CAGR ($390 million ARR) alongside
              severe multiple compression to 6.0x ARR due to regulatory delays or macro rental market softness,
              generating a 41.5% capital impairment ($2.34 billion enterprise value).
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Recommendation, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              We conclude with an overall Buy recommendation for dedicated growth mandates, coupled with a Stretched
              valuation stance and a High risk rating. EliseAI's entrenched market position across one in six U.S.
              apartments, proven monetization, and elite investor syndicate provide strong evidence of enduring
              enterprise value. However, the 20x ARR multiple affords negligible downside protection, necessitating
              stringent confirmatory diligence before capital deployment. Prospective investors must scrutinize the
              Series F senior preference waterfall to ensure common and early preferred holders are not burdened by
              liquidation overhang in moderate exit outcomes. Diligence must also independently evaluate Fair Housing
              Act compliance, verifying that conversational leasing algorithms maintain strict auditability against
              disparate impact claims. Finally, investors should establish firm thesis-break triggers: formal regulatory
              enforcement by HUD or state authorities, gross customer retention dropping below 90%, or healthcare ARR
              failing to reach $40 million by year-end 2027 would invalidate the growth thesis and mandate an immediate
              rating downgrade.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
