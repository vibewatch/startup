      - number: '4.2'
        title: Go-to-Market Economics and Service-Delivery Costs
        blocks:
          - type: paragraph
            body: >-
              EliseAI operates a high-touch, sales-led, demo-driven go-to-market motion targeting enterprise multifamily
              owners, third-party fee managers, and outpatient healthcare group practices. Unlike horizontal self-serve
              SaaS products, onboarding requires bespoke property management system synchronization, custom workflow
              configuration, and domain-specific knowledge base construction. Consequently, enterprise sales cycles
              involve structured technical evaluations and vendor approval phases before full portfolio rollout. On the
              cost side, EliseAI's service-delivery cost structure exhibits substantially heavier variable weight than
              traditional seat-based software. Operating live, 24/7 conversational voice, SMS, email, and web chat
              channels incurs recurring telephony carrier fees, SMS termination tolls, and computational language model
              token inference costs that scale directly with customer interaction volumes. Implementation and customer
              success personnel also carry meaningful operational expense given the integration depth required for
              automated maintenance dispatch, lease audit reconciliations, and clinical scheduling rules. Furthermore,
              as EliseAI pushes beyond top-50 multifamily operators into mid-market housing portfolios, affordable
              housing operators, and fragmented outpatient healthcare clinics, prospective buyers present lower internal
              IT maturity and more fragmented technology stacks, which increases customer acquisition costs and extended
              implementation timelines.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI015
      - number: '4.3'
        title: Capital Adequacy, Credit Facilities, and Financing History
        blocks:
          - type: paragraph
            body: >-
              On September 29, 2026, EliseAI announced a $350 million Series F growth financing co-led by Andreessen
              Horowitz and Bessemer Venture Partners at a $4 billion post-money valuation, with participation from
              Ontario Teachers' Pension Plan, Sapphire Ventures, and Navitas Capital. This transaction followed a $250
              million Series E in August 2025 at an over $2.2 billion valuation and a $75 million Series D in August
              2024, concentrating more than 90% of total equity funding into its last three rounds. Across seven equity
              financing rounds since its 2019 seed financing, EliseAI has secured $741.9 million in total equity
              funding. In addition to equity capital, the company secured non-dilutive financing through a revolving
              line of credit from Bridge Bank, initially established at $15 million in August 2022 and doubled to $30
              million in December 2023, tied directly to recurring subscription income. Combined equity and debt
              facilities bring total cumulative financing to approximately $772 million. EliseAI intends to allocate its
              Series F proceeds toward establishing a secondary engineering hub in San Francisco alongside its New York
              headquarters, expanding sales and implementation teams across North America, and scaling agentic
              capabilities through Apollo. With $350 million in newly injected primary capital and an established credit
              facility, the company maintains multi-year cash runway without near-term balance sheet refinancing
              pressures.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial Underwriting Verdict and Core Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an underwriting perspective, EliseAI presents top-decile growth velocity within vertical artificial
              intelligence, backed by credible tier-one venture sponsors and extensive enterprise adoption across
              roughly one in six U.S. apartment units. However, the $4 billion Series F valuation implies a rich 20x ARR
              multiple on reported $200 million ARR. Justifying this valuation requires sustained high-double-digit
              growth and aggressive expansion into outpatient healthcare specialties, where sales cycles are prolonged
              and electronic health record integration is fragmented. Crucially, several fundamental financial metrics
              remain strictly private and unverified. EliseAI does not publicly disclose its net revenue retention
              (NRR), gross margins, customer acquisition cost (CAC) payback periods, or gross churn rates by customer
              vintage. In addition, the platform faces structural disintermediation risk from incumbent property
              management systems—including Yardi, RealPage, Entrata, and AppFolio—which own the operational systems of
              record and are embedding native agentic capabilities. Finally, compliance liabilities under the Fair
              Housing Act and healthcare privacy laws present unquantified legal exposures that could jeopardize
              enterprise renewals. Confirmatory underwriting diligence must prioritize securing audited cohort retention
              data, unit-level gross margin breakdowns, and third-party algorithmic compliance audit records before
              establishing an investment valuation.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Variable Delivery Cost Sensitivity in Vertical AI
            body: >-
              Unlike traditional seat-licensed enterprise software, EliseAI's gross margin profile is fundamentally
              tethered to interaction volume, telephony termination rates, and model inference overhead. As
              conversational interactions scale across 24/7 front-office channels, unoptimized token consumption can
              compress gross margins unless offset by volume-tiered carrier agreements and specialized model
              distillation.
            calloutType: insight
            claimRefs:
              - CI007
          - type: callout
            title: Valuation Multiple Underwriting and Incumbent Disintermediation
            body: >-
              EliseAI's $4 billion Series F valuation represents a 20x multiple on its reported $200 million ARR.
              Underwriting this valuation requires sustaining triple-digit growth while navigating potential platform
              disintermediation from property management incumbents like Yardi and Entrata who control the core system
              of record and are embedding native AI agents.
