      - number: '7.3'
        title: Counterparty Concentration and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              EliseAI exhibits significant revenue and reputational concentration among the nation's largest
              institutional multifamily property managers [CR009]. The platform is currently deployed across 28 of the
              top 30 largest apartment owners and operators in the United States, including national giants such as
              Greystar and Equity Residential [CR009]. While this enterprise adoption provides immense validation and
              allows EliseAI to touch one in six US apartment units [CR010], it simultaneously creates counterparty
              vulnerability: the loss of two or three flagship accounts could materially diminish revenue run-rates and
              damage market perception. In addition, external industry headwinds compound operating risk across this
              customer base, as 89% of operators anticipate rising insurance premiums and 57% express anxiety that new
              multifamily construction supply will soften market rents [CR012]. As asset owners squeeze operating
              budgets, EliseAI must prove that its multi-channel automation defends net operating income rather than
              adding discretionary SaaS software overhead. Expanding into healthcare introduces additional counterparty
              risk, requiring partnerships with large hospital systems with extended sales cycles and stringent vendor
              security review boards [CR011].
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
