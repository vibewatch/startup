      - number: '7.4'
        title: Risk Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              To defend its market position and justify premium valuation multiples [CR013], EliseAI has developed
              targeted workflow mitigations across its core verticals [CR001]. The platform standardizes automated
              leasing communications into audited event streams inside EliseCRM, enforcing deterministic rule boundaries
              around fair housing inquiries, pricing disclosures, and emergency maintenance routing [CR001]. To overcome
              multi-vendor stack fatigue, EliseAI promotes a consolidated platform model spanning leasing, maintenance,
              renewals, and healthcare outreach [CR007]. However, key thesis-break indicators must be monitored closely
              by investors: first, any public regulatory inquiry, fair housing civil rights enforcement action, or HUD
              investigation regarding algorithmic disparate impact would fundamentally impair enterprise customer
              expansion [CR001, CR002]; second, enterprise contract terminations or non-renewals among top-5
              institutional landlords (e.g., Greystar or Equity Residential) would signal platform fatigue or in-house
              PMS vendor displacement [CR009]; third, growth deceleration in healthcare ARR would demonstrate that
              vertical expansion beyond core residential housing cannot sustain the 100% annual growth trajectory
              required by its $4 billion valuation [CR013].
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Exposure in Automated Housing Decisions
            body: >-
              Automating resident communication and leasing workflows introduces acute regulatory liability under the
              Fair Housing Act and state consumer protection laws. Because EliseAI interacts with more than 30 million
              Americans across one in six apartment units [CR010], any systematic steering, disparate impact, or
              discriminatory communication produced by autonomous conversational models could trigger class-action
              litigation or federal regulatory enforcement [CR001]. The lack of published independent third-party
              algorithmic bias audits leaves investors exposed to unhedged compliance liabilities [CR002].
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
          - type: callout
            title: Integration Friction and Enterprise Concentration Vulnerability
            body: >-
              While EliseAI has achieved deep penetration across 28 of the top 30 US multifamily operators [CR009],
              expanding beyond initial leasing automation encounters mounting technical debt in legacy property
              management software [CR006]. With 76% of operators maintaining fragmented multi-vendor AI stacks [CR007]
              and only 34% fully embedding AI into core operations [CR005], failure to maintain smooth bi-directional
              synchronization with platforms like Yardi and RealPage could stall expansion and jeopardize renewal
              economics on a $4 billion valuation [CR003, CR013].
            calloutType: risk
            claimRefs:
              - CR003
