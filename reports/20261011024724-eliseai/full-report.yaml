      - number: '6.2'
        title: Adoption Trajectory & Operational Scale
        blocks:
          - type: paragraph
            body: >-
              EliseAI has achieved rapid commercial acceleration, surpassing $200 million in annual recurring revenue in
              June 2026 following five consecutive years of 100% year-over-year revenue expansion. This revenue
              trajectory is underpinned by massive physical footprint expansion: the platform currently automates
              workflows across one in six apartment units nationwide, with more than 30 million Americans having
              interacted with EliseAI systems since company inception. Enterprise adoption is particularly concentrated
              at the top of the market, where over 50% of the National Multifamily Housing Council (NMHC) Top 50
              operators have deployed EliseAI across their properties. This customer density provides EliseAI with
              substantial compounding advantages in conversation training data, workflow benchmarks, and standard
              operational playbooks that raise barriers against generic conversational bots.
            claimRefs:
              - CU001
