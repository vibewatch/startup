    type: stack
    summary: 支撑 EliseAI 低延迟对话智能、智能体任务执行和企业双向集成的六层架构栈。
    approximationNotes: 架构层级综合自公开技术文档、Baseten 基础设施报告和企业 PMS 集成规范。
