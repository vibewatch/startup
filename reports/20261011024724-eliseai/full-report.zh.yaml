      - number: '5.3'
        title: 技术栈、推理延迟与智能代理编排
        blocks:
          - type: paragraph
            body: >-
              EliseAI 底层采用专门构建的技术基础设施，解决通用大语言模型封装固有的对话延迟问题。在联合创始人兼 CTO Tony Stoyanov 领导下，工程团队从第三方封闭 API 转向部署在专用 Baseten
              推理基础设施上的定制模型。这次迁移把对话往返延迟从标准的 2.2 秒压缩到 250 毫秒，明显低于自然人类语音互动所需的 1.3 秒关键阈值。平台采用 On-Policy
              Self-Distillation（OPSD）训练技术，以高语义准确度理解非正式和含混的租户输入，例如随意表达的入住时间或大致预算。专门的结构化 JSON
              提取模块还会把对话输入可靠地映射成严格的数据库字段，而不是无索引的字符串。编排框架驱动 Apollo，在连接的工具之间协调自主任务执行，同时对边缘情况和例外严格执行人工介入边界。
            claimRefs:
              - CE006
              - CE007
              - CE011
              - CE015
