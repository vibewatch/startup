            title: 私募估值倍数与指标验证缺口
            body: 以 $4B 估值对应 $200M ARR，EliseAI 的 ARR 倍数达到 20x；与此同时，公寓市场份额的分母说法冲突，独立毛利率和流失率指标也尚未验证。
            calloutType: risk
            claimRefs:
              - CO004
