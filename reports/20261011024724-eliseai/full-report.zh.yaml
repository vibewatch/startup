              - CV010
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 承保立场：增长配置与优先权审查
            body: >-
              鉴于 EliseAI 覆盖美国六分之一公寓、且 ARR 快速增长至 2 亿美元，针对专注增长的投资授权，EliseAI 值得买入建议。 但以 20 倍 ARR
              入场几乎无法容忍执行偏差或监管摩擦，因此后期配置应以确认高级清算优先权结构并审计客户单元留存为 承诺条件。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
          - type: callout
            title: 首要逻辑击穿触发器：算法合规执法
            body: >-
              EliseAI 垂直业务逻辑的首要结构性脆弱点，在于《公平住房法》下可能针对自动化租户筛选和租赁对话展开监管审查。投资者应 设定明确的逻辑击穿触发器：HUD
              或州总检察长对自动化潜客资格筛选施加限制，或要求昂贵的人工复核，都会从根本上损害 平台的运营杠杆。
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV014
