chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与市场定位
        blocks:
          - type: paragraph
            body: >-
              EliseAI 由 Minna Song 和 Tony Stoyanov 于 2017 年以 MeetElise 之名创办，已成为住宅和医疗领域领先的垂直人工智能自动化平台。公司总部位于纽约曼哈顿一栋
              109,000 平方英尺的办公室，并在积极建设旧金山第二个工程中心。EliseAI 不卖通用型横向 AI
              或独立聊天机器人，而是把对话和运营智能直接嵌入既有的物业管理系统及电子健康记录工作流。平台覆盖短信、网页聊天、电子邮件和电话等全渠道触点，自动处理重复性行政沟通，目前服务全美约六分之一的公寓单元，累计消费者互动超过
              30 million 次。
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO012
