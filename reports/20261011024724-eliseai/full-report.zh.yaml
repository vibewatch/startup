      - number: '5.2'
        title: 跨住房与医疗的端到端工作流自动化
        blocks:
          - type: paragraph
            body: >-
              EliseAI
              的运营价值在于能自主闭环处理沟通，无需员工手动介入。在住宅物业管理中，系统通过筛选潜客咨询、解析设施偏好、查询实时单元可用性，并直接把现场或自助看房安排到租赁日历，取代手工行政触点。住户入住后，平台用自然语言理解给维修请求分类、判断紧急程度，并自动把结构化工单提交到物业管理系统。自动发送不带对抗性的付款提醒，也能帮助现场经理在正式启动法律驱逐程序前降低欠款。在医疗领域，EliseAI
              把同一套运营打法复制到门诊专科机构，自动处理来电咨询、患者转诊登记、双向日历排班、就诊前病历准备和保险资格核验。但真实部署需要仔细校准阈值：请求分类过滤器若不够精准，自动住户触达每天可能提交几十个轻微、非紧急的服务请求，造成工单过载。
