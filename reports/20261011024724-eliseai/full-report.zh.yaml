  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、预算替代与品类范围
        blocks:
          - type: paragraph
            body: >-
              EliseAI 覆盖住房和医疗两大基础运营领域，二者合计占美国普通家庭预算的 40% 以上。公司不把自己定位成争夺少量 IT 和软件许可预算的点解决方案，而是瞄准日常行政人力预算。在住宅租赁物业，EliseAI
              覆盖租户和潜在租户互动的完整生命周期，包括非工作时间租赁咨询分流、自动安排看房、住户维修请求接收、续租触达和欠款跟进。通过 EliseCRM
              把这些对话和智能代理工作流接入统一运营中枢后，运营商可以让现场员工摆脱重复性行政瓶颈。与此同时，平台进军专科门诊医疗，目标是接听来电、预约和患者登记等前台流程，切入规模更大的 $600 billion
              全国医疗行政支出，同时把临床电子健康记录系统留给现有供应商。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM014
      - number: '2.2'
        title: 市场规模视角：软件基准与运营 TAM
        blocks:
          - type: paragraph
            body: >-
              评估房地产和医疗领域的垂直 AI 市场规模，不能只看一个自上而下的软件数字，而要从多个运营视角切入。传统物业管理软件在 2026 年的全球市场规模为 $6.53 billion，Mordor
              Intelligence 预计到 2031 年达到 $9.93 billion，复合年增长率为 8.74%。但 EliseAI
              的商业策略实际上覆盖更大的经济空间，因为它竞争的是物业层面的运营工资和行政开支。在多户住宅领域，平台已成为品类领导者，覆盖全美约六分之一的公寓单元，并与 NMHC Top 50 租赁运营商中约 70%
              签订商业合同。在医疗领域，机会锚定在每年约 $150 billion 的财务损失上，这些损失直接来自诊所爽约和患者预约失败。若能证明大型机构组合确实减少运营人力，EliseAI
              可服务市场就会远超传统物业管理软件许可的边界。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
      - number: '2.3'
        title: 买方分层、工作流归属与定价动态
        blocks:
          - type: paragraph
            body: >-
              EliseAI 核心市场的客户采用率按组合规模、监管复杂度和运营集中化能力分层。管理超过 5,000 个单元的机构型多户住宅运营商是主要收入引擎：企业管理层希望集中租赁运营、减少现场工资，并解决长期人手短缺。管理
              500 至 5,000
              个单元的中端运营商，通常因咨询响应慢和非工作时间销售线索流失而启动采购。保障性住房的采用由严格的法定合规、代金券核验和年度重新认证要求驱动，运营错误可能招致严重监管处罚。在医疗领域，专科医疗集团部署 AI
              代理，以降低高电话放弃率和前台员工的行政压力。行业基准显示，大型组合的 EliseAI 定价通常是每个住宅单元每月 $1.00 至 $2.50 的经常性订阅费，另收数据映射实施费，金额取决于双向集成的技术复杂度。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM011
              - CM014
      - number: '2.4'
        title: 采用驱动因素、运营约束与宏观敏感性
        blocks:
          - type: paragraph
            body: >-
              在利润率承压和宏观环境变化下，多户住宅运营 AI 的采用正在加速。对 350 名行业决策者的调查显示，89% 的运营商预计物业保险保费会上涨，其中 49% 预计成本将显著或严重增加；另有 57%
              担心新增公寓供应会压低市场租金。虽然 89% 的运营商已引入 AI，85% 报告运营费用得到验证后的下降，但只有 34% 已把自动化代理完全嵌入日常运营。大规模部署仍受制于旧物业管理系统的集成难题（35%
              的运营商提及）和内部技术限制（28%）。此外，76% 的运营商目前要应对多供应商 AI
              泛滥，供应商整合成为紧迫事项（27%）。利率波动和建设周期也构成宏观阻力，可能削弱租赁紧迫性，迫使运营商优先选择能通过经验证的运营费用下降快速回本的平台。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 从运营预算替代传统软件许可
            body: EliseAI 的 ARR 快速增长来自按运营工资和人力替代定价，而不是传统软件 IT 预算。已有 85% 的采用运营商实现可量化的运营费用下降，平台因此把有效市场上限推到了传统物业管理软件之外。
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
          - type: callout
            title: 旧 PMS 集成与供应商整合瓶颈
            body: >-
              76% 的运营商使用多个 AI 点解决方案，其中 35% 把集成摩擦、28% 把旧 PMS 约束列为端到端自动化的主要障碍。运营商对供应商整合的需求催生了一场高风险竞赛：若无法与 Yardi、RealPage
              等系统保持深度双向同步，EliseAI 就可能被替代。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、在位者与替代方案
        blocks:
          - type: paragraph
            body: >-
              多户住宅租赁自动化的竞争已快速分化为两种运营范式：企业级自主通信层和嵌入式点解决方案。EliseAI 已成为企业级市场的明显领导者，ARR 超过 $200 million，估值 $4
              billion，覆盖全美约六分之一的公寓单元。独立直接竞争因整合而大幅收缩：例如，获风投支持的租赁机器人 Zuma 被物业科技平台 Venn 以 $50 million
              收购，基本退出独立市场。与此同时，Structurely 和 Verse.ai 等点解决方案仍局限于住宅房地产销售团队和单经纪人机构，缺少机构运营商所需的双向 PMS
              集成和多户住宅组合规模。在医疗邻近市场，Assort Health 等专业竞争者已以 $750 million 估值完成 $50 million Series B，用于自动化医院电话登记，说明 EliseAI
              在扩张核心住宅业务时，还要抵御资本充足的领域专家。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.2'
        title: 能力基准：全渠道广度与对话延迟
        blocks:
          - type: paragraph
            body: >-
              EliseAI 与其他租赁助手的差异，集中在延迟架构、全渠道能力和物业管理系统同步深度。Lea（原 BetterBot）等中端竞争者可在两至四周内快速完成上线，提供基础的潜客筛选；但它们主要依赖决策树逻辑或通用
              LLM API，响应延迟为 1.5 至 2.0 秒。相比之下，EliseAI 使用定制训练模型和 on-policy 自蒸馏，把对话延迟压到行业领先的 250 毫秒，消除了语音互动中的不自然停顿。EliseAI
              还支持七种语言的来电和外呼语音，并以 51 种语言提供文本、电子邮件和网页聊天；它能原生把访客卡片、房源可用性和看房预约同步到 Yardi、RealPage、Entrata 和
              AppFolio。虽然这套深度能力需要四至八周、包含严格数据映射的部署周期，但 Equity Residential 等大型机构运营商认为，它带来的运营集中化每年节省约 $14 million 工资。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
              - CP014
      - number: '3.3'
        title: 定价动态、最低消费与 PMS 捆绑威胁
        blocks:
          - type: paragraph
            body: >-
              EliseAI 采用面向企业、需询价的商业化模式，刻意瞄准管理至少 500 至 700 个单元的大型组合运营商。行业披露显示，定价为每个单元每月 $3 至 $6，另据报道年度合同最低消费约为
              $25,000。大型机构组合管理数千套房源，这笔费用可以通过重新分配人力轻松消化：集中式租赁团队取代重复的现场行政岗位。中型和区域物业管理者则会发现，年度最低消费把有效单元成本推到难以承受的水平。这给现有物业管理软件供应商留下了明显机会。AppFolio（搭载
              Realm-X）和 Buildium（搭载 Lumina）等平台，正以名义成本或零增量成本把对话式 AI 嵌入核心软件层。运营商若管理少于 500 个单元，捆绑 PMS 已能提供足够的基础自动化，实际上把
              EliseAI 的可服务市场封顶在机构客户边界。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 护城河耐久性、切换成本与监管不对称
        blocks:
          - type: paragraph
            body: >-
              EliseAI
