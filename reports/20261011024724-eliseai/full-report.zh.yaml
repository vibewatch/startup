        title: 市场进入经济性与服务交付成本
        blocks:
          - type: paragraph
            body: >-
              EliseAI 采用高触达、销售驱动、演示驱动的市场进入方式，目标客户包括企业级多户住宅业主、第三方收费管理公司和门诊医疗集团。与横向自助式 SaaS 不同，客户上线需要定制 PMS
              同步、工作流配置和领域知识库建设。因此，企业销售周期包含结构化技术评估和供应商审批，之后才会全面铺开组合。成本方面，EliseAI 的服务交付成本比传统按席位计费软件含有更重的可变成本。持续运营 24/7
              的语音、短信、电子邮件和网页聊天渠道，会产生电信运营商费用、短信终结费和计算型语言模型 token
              推理成本，这些成本随客户互动量直接增长。由于自动维修派单、租约审计对账和临床排班规则需要深度集成，实施和客户成功人员也带来不小的运营费用。随着 EliseAI 从 Top 50
              多户住宅运营商进入中端住宅组合、保障性住房运营商和分散的门诊诊所，潜在买方的内部 IT 成熟度更低、技术栈更碎片化，客户获客成本和实施周期都会上升。
