            body: >-
              EliseAI 提供专门的垂直 AI
              平台，自动处理住宅和门诊医疗运营中的高频沟通与重复性行政任务。平台不是表层消息机器人，而是一个集成式运营队友：捕捉潜客需求、培育咨询并协调日常物业运营。软件套件包含多条产品线：LeasingAI
              负责潜客捕捉和自动安排看房，ResidentAI 负责住户全生命周期管理和维修工单分流，VoiceAI 持续处理来电和外呼，提供零等待语音沟通，EliseCRM 则作为中央运营中枢。2026 年 9 月，公司推出
              Apollo，这是首个完全智能代理化的 AI 队友，能直接在客户系统中执行多步骤运营工作流，并把有约束力或敏感的决策升级给人工运营者。在语音、文本、电子邮件和网页聊天等全部通信渠道中，平台持续运行，支持 7
              种口语和 51 种文字语言，保障租户和患者顺畅互动。
