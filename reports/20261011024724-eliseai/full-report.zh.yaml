      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 垂直扩张迅速，规模已获验证
            body: EliseAI 商业扩张持续稳定：ARR 从 2025 年的 $100M 增至 2026 年 6 月的 $200M 以上，同时保持约覆盖全美六分之一公寓的市场渗透率。
            calloutType: strength
            claimRefs:
