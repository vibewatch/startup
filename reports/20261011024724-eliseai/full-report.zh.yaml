  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              EliseAI 作为住宅物业管理的主导垂直 AI 操作系统，并开始拓展专业医疗领域，呈现出颇具说服力、足以定义品类的投资逻辑。 平台已达到无可匹敌的规模，为 650
              万套公寓自动化处理沟通和运营工作流，约占美国出租单元的六分之一。它能深度接入现有 物业管理系统，由此形成强大的切换成本，长期抵御横向 AI 入场者。反向逻辑集中在估值纪律、产品商品化风险和披露不透明上。 在完成
              3.5 亿美元 Series F 融资后，隐含的年度经常性收入倍数为 20 倍；这一入场估值已计入住房和医疗两条业务线近乎完美的执行。 此外，第三方分析师强调，EliseAI
              尚未公开发布经过审计的客户层面投资回报研究，也没有提供分拆收入明细来证明其医疗业务的独立 牵引力和利润率画像。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV014
      - number: '8.2'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 29 日，EliseAI 完成 $350 million Series F 融资，投后私募估值为 $4.0 billion；Andreessen Horowitz 与 Bessemer
              Venture Partners 联合领投，Ontario Teachers' Pension Plan、Sapphire Ventures 和 Navitas Capital 参投。该交易较公司 2025 年
              8 月 $2.2 billion 的 Series E 估值上涨 82%，使其在八轮机构融资中累计募得股权资本 $756.93 million。按 EliseAI 报告的 2026 年 6 月 ARR 里程碑
              $200 million 计算，本次交易确立了 20.0x 入场倍数。这一倍数相较更广泛的物业科技风险投资估值有显著溢价：2026 年上半年，全球融资从峰值水平收缩 65% 至 $4.53
              billion。Ontario Teachers' 等顶级机构投资者仍愿意按 20x ARR 交易，既验证了 EliseAI 连续五年 ARR 年年翻倍的出色记录，也表明后期资本正激进地集中于已验证的垂直 AI
              龙头。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
      - number: '8.3'
        title: 情景分析与回报画像
        blocks:
          - type: paragraph
            body: >-
              为评估 $4.0 billion Series F 入场价下的风险调整后回报，我们按三年投资期限、展望至 2029 年，建模三种运营情景。基准情景中，EliseAI 实现 50% ARR CAGR，从 $200
              million 增长至 $675 million，靠加深现有物业运营商渗透并扩大 Apollo 代理式工作流规模实现。随着市场成熟和规模扩大，退出倍数压缩至 10.0x ARR，企业价值达到 $6.75
              billion，带来 1.69x MOIC 和 19.1% 年化 IRR。乐观情景由医疗业务快速采用以及全自治物业管理工作流成功部署驱动，ARR 按 75% CAGR 增长至 $1.07 billion。维持
              12.0x 退出倍数后，企业价值达到 $12.86 billion，对应 3.22x MOIC 和 47.6% IRR。相反，悲观情景假设增长放缓至 25% CAGR（ARR 为 $390
              million），同时因监管延误或宏观租赁市场走弱，倍数严重压缩至 6.0x ARR，最终造成 41.5% 的资本减值（企业价值 $2.34 billion）。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 建议、尽调要求与逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              我们对专注增长的投资授权给出总体买入建议，同时将估值判断定为偏高，风险评级为高。EliseAI 已扎根于美国六分之一 公寓的市场地位、经过验证的变现能力和顶级投资者联盟，足以有力证明其企业价值能够持续。但 20
              倍 ARR 几乎没有下行保护， 投入资本前必须进行严格的确认性尽调。潜在投资者必须仔细审查 Series F 高级优先清算分配瀑布，确保在中等退出结果下，
              普通股和早期优先股持有人不会承受清算悬垂。尽调还必须独立评估其是否符合《公平住房法》，核验对话式租赁算法是否能针对 差异影响主张保持严格可审计性。最后，投资者应设定明确的逻辑击穿触发器：HUD
              或州级主管机构正式执法、客户总留存率降至 90% 以下，或医疗 ARR 到 2027 年底仍未达到 4000 万美元，都将使增长逻辑失效，并要求立即下调评级。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
