            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
              - CO008
              - CO009
              - CO012
              - CO014
      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              EliseAI 由首席执行官 Minna Song 和首席技术官 Tony Stoyanov 共同创办；Song 曾在 Massachusetts Institute of Technology
              学习计算机科学，Stoyanov 曾在 University of Cambridge 学习计算机科学。创办公司前，Song
              曾在纽约住宅房地产公司一线工作，亲自了解物业运营中的行政摩擦和高流失率。两人共同搭建了最初的自动化架构，解决租赁和维修工作流中的人手瓶颈。随着商业规模扩大，公司治理也显著升级：在 2026 年 9
              月融资后，Bessemer Venture Partners 合伙人、前 SendGrid 首席执行官 Sameer Dholakia 加入 EliseAI 董事会，带来企业软件规模化运营经验。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: 资本化历程与投资人联盟
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 29 日，EliseAI 宣布完成 $350 million 的增资轮，投后估值 $4 billion；相比 2025 年 8 月的 $2.2 billion
              私募市场估值接近翻倍。本轮由老股东 Andreessen Horowitz 和 Bessemer Venture Partners 共同领投；新机构投资人 Ontario Teachers' Pension
              Plan 大额参与，Sapphire Ventures 和 Navitas Capital 也继续跟投。公司资本化历程体现出由里程碑驱动的快速扩张：2024 年 8 月，EliseAI 完成由 Sapphire
              Ventures 领投、估值 $1 billion 的 $75 million Series D，取得独角兽地位；13 个月后，又完成由 Andreessen Horowitz 领投、估值 $2.2
              billion 的 $250 million Series E。2026 年 9 月这轮融资几乎全部是新增资本，用于扩大工程招聘和地域覆盖。
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.4'
        title: 产品里程碑与分析评价
        blocks:
          - type: paragraph
            body: >-
              EliseAI 从住宅租赁扩展到全生命周期自动化，带动财务快速增长。公司称，2026 年 6 月 ARR 超过 $200 million，此前连续五年收入同比翻倍。2023 年，EliseAI
              推出专门的医疗垂直业务，为专科医疗集团自动处理预约、患者登记、保险核验和护理跟进。2026 年 9 月，公司发布 Apollo，这是一名智能 AI
              队友，能自主执行跨平台多步骤任务，但会把具有约束力的决策交给人工主管。不过，独立分析也指出了关键尽调缺口：营销披露对平台究竟覆盖美国五分之一还是六分之一的公寓说法不一；住房和医疗之间的 ARR
              分拆尚未验证；估值对应的 ARR 倍数高达 20x。
            claimRefs:
              - CO007
              - CO010
              - CO011
              - CO013
              - CO014
