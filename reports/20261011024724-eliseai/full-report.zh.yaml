      - number: '4.4'
        title: 财务投资判断与核心尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断看，EliseAI 在垂直人工智能领域的增长速度位居头部，背后有可信的一线风投和覆盖全美约六分之一公寓单元的大规模企业采用。不过，$4 billion 的 Series F 估值对应已披露 $200
              million ARR 的 20x
              倍数。要支撑这一估值，公司需要保持高双位数增长，并积极扩张至门诊专科医疗；该领域销售周期更长，电子健康记录集成也更碎片化。关键问题是，多项基本财务指标仍严格保密且未获验证：EliseAI
              没有公开披露净收入留存率（NRR）、毛利率、客户获客成本（CAC）回收期，或按客户批次拆分的毛利流失率。此外，Yardi、RealPage、Entrata 和 AppFolio 等现有 PMS
              掌握着运营记录系统，并正在嵌入原生智能代理，平台面临结构性去中介风险。公平住房法和医疗隐私法规下的合规责任也带来未量化的法律风险，可能危及企业续约。在确定投资估值前，确认性尽调必须优先取得经审计的分组留存数据、单元级毛利拆分及第三方算法合规审计记录。
