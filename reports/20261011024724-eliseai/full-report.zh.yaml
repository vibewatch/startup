      - number: '4.3'
        title: 资本充足性、授信额度与融资历史
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 29 日，EliseAI 宣布完成 $350 million 的 Series F 成长融资，由 Andreessen Horowitz 和 Bessemer Venture
              Partners 共同领投，Ontario Teachers' Pension Plan、Sapphire Ventures 和 Navitas Capital 参与，投后估值 $4 billion。此前，公司于
              2025 年 8 月完成 $250 million 的 Series E，估值超过 $2.2 billion；2024 年 8 月完成 $75 million 的 Series D。最近三轮融资占其股权融资总额的
              90% 以上。自 2019 年种子轮起，EliseAI 共完成七轮股权融资，累计获得 $741.9 million 股权资金。除股权资本外，公司还从 Bridge Bank 获得循环信贷额度：2022 年 8
              月初始额度为 $15 million，2023 年 12 月增至 $30 million，与经常性订阅收入直接挂钩。股权和债务额度合计带来约 $772 million 的累计融资。EliseAI 计划用
              Series F 资金在纽约总部之外建设旧金山第二工程中心，在北美扩充销售和实施团队，并通过 Apollo 扩大智能代理能力。新增 $350 million
              原始资本加上既有授信额度，使公司拥有数年的现金跑道，短期内没有资产负债表再融资压力。
            claimRefs:
              - CI009
