    title: EliseAI 投资判断与建议决策链
    type: flow
    summary: 将收入增长势头、市场地位、估值倍数压力和风险因素串联起来，逐步推导出最终的“买入 / 估值偏高”立场。
    data:
      nodes:
        - id: scale
          label: 运营规模（$200M ARR）
          role: 'Milestone: 5 consecutive years of 100% ARR growth across housing and healthcare'
        - id: capitalization
          label: 资本化（$350M F 轮）
          role: 'Validation: Co-led by a16z and Bessemer at a $4.0B valuation'
        - id: penetration
          label: 市场主导地位（每 6 个单元中有 1 个）
          role: 'Moat: Core infrastructure serving 6.5M+ units and 70% of top 50 operators'
        - id: multiple
          label: 倍数压力（20x ARR）
          role: 'Discipline: 82% valuation step-up requires flawless execution and expansion'
        - id: diligence
          label: 投资判断缺口与风险
          role: 'Caveats: Unaudited segment margins and Fair Housing compliance exposure'
        - id: decision
          label: 建议：买入 / 估值偏高
          role: 'Action: Underwrite for growth portfolios with structured downside protections'
      edges:
        - from: scale
          to: capitalization
          label: 推动机构轮融资
        - from: capitalization
          to: penetration
          label: 为平台深化提供资金
        - from: penetration
          to: multiple
          label: 支撑溢价估值
        - from: multiple
          to: diligence
          label: 需要严格核验
        - from: diligence
          to: decision
          label: 影响最终立场
    approximationNotes: 该流程展示了将实际规模和资本化里程碑连接至投资判断结论的定性决策阶段。
