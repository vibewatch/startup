    data:
      layers:
        - label: 1. 全渠道互动层
          detail: 管理语音通话、SMS、电子邮件和网页聊天中的用户双向互动。
          modules:
            - VoiceAI 入站 / 出站
            - SMS 信使
            - 电子邮件处理器
            - 网页聊天组件
          outputs:
            - 原始音频流
            - 文本转录
            - 渠道元数据
        - label: 2. 对话智能与编排层
          detail: 编排意图分类、对话状态跟踪和智能体任务调度。
          modules:
