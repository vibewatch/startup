      - number: '7.3'
        title: 交易对手集中度与平台依赖
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的收入和声誉高度集中于全国最大的机构型多户住宅物业管理者 [CR009]。目前平台已部署在美国规模最大的 30 家公寓业主和运营商中的 28 家，包括 Greystar 和 Equity
              Residential 等全国性巨头 [CR009]。这种企业采用带来强力验证，也让 EliseAI 触达美国六分之一的公寓单元
              [CR010]；但与此同时，公司暴露于交易对手风险：失去两三个旗舰客户，就可能实质性削弱收入运行率并损害市场认知。此外，外部行业逆风也会放大这批客户的经营风险：89% 的运营商预计保险费上涨，57%
              担心新增多户住宅供应会压低市场租金 [CR012]。当资产所有者压缩运营预算时，EliseAI 必须证明多渠道自动化能够守住净营业收入，而不是增加可有可无的 SaaS
              软件开支。进军医疗还会引入额外交易对手风险，因为公司需要与销售周期长、供应商安全审查严格的大型医院系统合作 [CR011]。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 风险缓释、监测指标与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              为守住市场地位并支撑溢价估值倍数 [CR013]，EliseAI 已在核心垂直领域部署针对性的工作流缓释措施 [CR001]。平台把自动化租赁沟通标准化为 EliseCRM
              内可审计的事件流，并围绕公平住房咨询、定价披露和紧急维修分派 设置确定性的规则边界 [CR001]。为化解多供应商技术栈带来的疲劳，EliseAI 推出覆盖租赁、维修、续租和医疗触达的 一体化平台模式
              [CR007]。但投资者必须密切监测几个可能击穿投资逻辑的指标：第一，任何涉及算法差异影响的公开监管 询问、公平住房民权执法行动或 HUD 调查，都可能从根本上损害企业客户扩张 [CR001,
              CR002]；第二，头部五家机构型 房东（如 Greystar 或 Equity Residential）出现企业合同终止或不续约，将表明平台疲劳或内部 PMS 供应商替代 [CR009]；第三，医疗 ARR
              增长放缓将证明，核心住宅住房以外的垂直扩张无法维持其 $4 billion 估值所要求的 100% 年增长轨迹 [CR013]。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR013
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 自动化住房决策的监管敞口
            body: >-
              自动化住户沟通和租赁工作流，会在《公平住房法》及各州消费者保护法下引入尖锐的监管责任。EliseAI 覆盖超过 3000 万美国人，触达六分之一的公寓单元
              [CR010]；因此，自治对话模型一旦系统性地产生引导性偏向、差异影响或歧视性 沟通，就可能触发集体诉讼或联邦监管执法 [CR001]。目前没有公开发布的独立第三方算法偏见审计，投资者因此暴露在
              未被对冲的合规责任之下 [CR002]。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
          - type: callout
            title: 集成摩擦与企业集中度脆弱性
            body: >-
              EliseAI 已深入覆盖美国前 30 家多户住宅运营商中的 28 家 [CR009]，但从初始租赁自动化向外扩展时，会碰到传统 物业管理软件不断累积的技术债务 [CR006]。76%
              的运营商仍在维护碎片化的多供应商 AI 技术栈 [CR007]，只有 34% 将 AI 完整嵌入核心运营 [CR005]；如果无法与 Yardi、RealPage 等平台保持顺畅的双向同步，扩张可能停滞，并危及
              40 亿美元 估值下的续约经济性 [CR003, CR013]。
