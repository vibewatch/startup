            - Dakota 虚拟助手角色
            - 对话状态机
            - 上下文管理器
          outputs:
            - 结构化用户意图
            - 对话状态 token
            - 任务调度触发器
        - label: 3. 领域专用模型与推理层
          detail: 通过定制模型执行低延迟语言理解和结构化 JSON 提取。
          modules:
