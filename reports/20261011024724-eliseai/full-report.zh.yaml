              周的技术数据映射。物业经理还报告了所谓“效率陷阱”：对话机器人过度催促住户反馈维修问题，触发大量低优先级工单，压垮维修团队。自动机器人在没有人工升级时反复循环，也会引发住户不满，因此必须设置可靠的人机协同保护。扩张阶段，EliseAI
              借助 EliseCRM，从最初的租赁线索捕捉扩展到续租、维修分流和付款提醒。如今 89% 的多户住宅运营商已部署 AI，EliseAI 能否持续保持高净留存并进一步进入门诊医疗，将决定其护城河能否延续。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU005
      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 深度多户住宅集成与已记录的八位数 ROI
            body: >-
              EliseAI 在 NMHC Top 50 运营商中的强势渗透，建立在与核心物业管理系统（Yardi、RealPage、Entrata）的深度双向集成和已证明的企业 ROI 之上。Equity
              Residential 等大型机构运营商公开表示，平台通过集中租赁运营和自动处理重复性 24/7 行政工作流，每年帮助节省 $14 million 工资。
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: callout
            title: 采用陷阱：工单过载与住户身份摩擦
            body: >-
              真实运营反馈显示，激进自动化会带来明确的客户摩擦点。对话机器人过度追问住户维修问题时，现场设施团队可能涌入大量低优先级服务工单。自动机器人在没有人工升级时反复循环，也会让住户不满，因此需要严格的人机协同触发条件来维护住户满意度。
            calloutType: risk
            claimRefs:
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              在住宅租赁和医疗领域自动化客户互动，使 EliseAI 处在高度监管的消费者工作流交界处 [CR001]。在住房领域，对话式 AI
              代理会处理潜客预审、看房安排和申请指导。根据联邦公平住房法及同等州级法规，如果沟通无意中引导潜在租户、采用不一致的资格标准或给出歧视性回应，物业所有者及其软件供应商都可能承担严格责任
              [CR001]。EliseAI 的调查研究确认，数据隐私和监管合规是 AI 扩张最常见的单一阻碍，39% 的多户住宅决策者提到这一点 [CR002]。此外，EliseAI 通过 HealthAI
              激进拓展医疗运营，引入 HIPAA 合规义务、患者数据隐私要求和临床排班责任 [CR001, CR004]。住房和医疗的运营利润率都较薄，监管审查又更严格
              [CR004]；任何合规失败或监管执法行动，都可能突然阻断企业客户采用，并损害公司 $4 billion 的估值 [CR003]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营失败模式与技术栈集成摩擦
        blocks:
          - type: paragraph
            body: >-
              运营部署数据表明，表层 AI 采用与完整运营集成之间的鸿沟正在扩大 [CR005]。89% 的多户住宅运营商报告已以某种形式引入 AI，但只有 34% 完全嵌入日常业务运营，另有 41% 处于部分部署，14%
              仍限于试点项目 [CR005]。这种部署摩擦主要源于与旧物业管理系统（PMS）的技术集成障碍：35% 的运营商提到技术栈集成，28% 提到旧软件限制，并将其列为首要障碍 [CR006]。EliseAI 通过
              EliseCRM 管理语音、短信、电子邮件和网页聊天沟通 [CR008]，因此需要与 Yardi、RealPage 和 Entrata
              等后台会计及租赁引擎实时双向同步。集成薄弱或数据不匹配，可能导致单元重复预订、优惠报价错误，或紧急维修升级丢失。此外，76% 的运营商运行着包含两个或更多解决方案的多供应商 AI 环境
              [CR007]，这会增加运营摩擦，进一步拉扯本已面临 28% 内部技术人才短缺的现场团队 [CR014]。在 20x ARR 倍数下 [CR013]，EliseAI 经不起集成问题引发的流失。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
