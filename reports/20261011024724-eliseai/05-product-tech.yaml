  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job
      - Current Manual Workflow
      - EliseAI Automation Solution
      - Measurable Operational Benefit
      - Operational Limitation
    rows:
      - - Prospect Tour Scheduling
        - Manual back-and-forth email and phone outreach during business hours
        - Instant conversational qualification and calendar sync across voice, SMS, and chat
        - Eliminates lead drop-off; enables 24/7 immediate booking
        - Requires accurate real-time unit and amenity data mapping
      - - Resident Maintenance Triage
        - Tenants call or email front desk; staff manually enters work orders into PMS
        - Natural language NLP parses issue urgency and generates work order in PMS
        - Reduces administrative load on site staff and speeds triage
        - Risk of work order overload on non-emergency items without thresholds
      - - Delinquency & Rent Collection
        - Onsite agents send confrontational manual notices or make awkward phone calls
        - Automated non-confrontational SMS/email payment reminders and payment plan routing
        - Earlier payment collection and reduced legal/eviction fees
        - Complex dispute resolution still requires human intervention
      - - Ambulatory Patient Intake & Scheduling
        - Front-desk clinic staff answers high-volume calls with long hold times
        - Automated inbound voice and digital scheduling, insurance check, and reminders
        - Cuts administrative overhead up to 25% and reduces missed appointments
        - Requires extensive clinical rules and strict HIPAA access controls
    notes: Workflow analysis based on reported customer operating workflows and vendor technical documentation; benefits and limitations reflect documented deployment characteristics.
