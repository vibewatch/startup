chapter:
  number: 5
  title: Product & Technology
  summary: EliseAI provides an agentic conversational AI platform that automates high-volume residential leasing, resident lifecycle operations, and outpatient healthcare administration through custom low-latency models and deep bidirectional enterprise integrations.
sections:
  - id: product-scope-modules
    title: Product Scope and Operational Module Architecture
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
    tableRefs:
      - TE001
    body: EliseAI delivers a specialized vertical AI platform designed to automate high-volume communication and repetitive administrative tasks across residential housing and outpatient healthcare operations. Rather than acting as a superficial messaging bot, the platform functions as an integrated operational teammate that captures prospect demand, nurtures inquiries, and coordinates day-to-day property operations. The software suite spans multiple dedicated product lines, including LeasingAI for prospect capture and automated tour scheduling, ResidentAI for resident lifecycle management and maintenance ticket triage, VoiceAI for continuous zero-hold-time telephone communication across inbound and outbound channels, and EliseCRM as a centralized operational hub. In September 2026, the company introduced Apollo, its first fully agentic AI teammate capable of executing multi-step operational workflows directly within customer systems while escalating binding or sensitive decisions to human operators. Across all communication channels—including voice, text, email, and web chat—the platform operates continuously, supporting 7 spoken and 51 written languages to ensure seamless tenant and patient engagement.
  - id: workflow-automation-use-cases
    title: End-to-End Workflow Automation Across Housing and Healthcare
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE010
      - CE014
    tableRefs:
      - TE002
    body: 'The operational value of EliseAI stems from its ability to close communication loops autonomously without requiring manual staff intervention. In residential property management, the system replaces manual administrative touchpoints by qualifying prospect inquiries, parsing amenity preferences, checking real-time unit availability, and scheduling in-person or self-guided tours directly onto leasing calendars. For ongoing residency, the platform categorizes inbound maintenance requests using natural language understanding, assesses issue urgency, and automatically submits structured work orders into property management systems. Additionally, automated non-confrontational payment reminders assist onsite managers in mitigating delinquency before formal legal eviction proceedings become necessary. In healthcare, EliseAI replicates this operational playbook for outpatient specialty practices, automating inbound voice inquiries, patient referral intake, bidirectional calendar scheduling, pre-encounter chart preparation, and insurance eligibility checks. However, real-world deployment requires careful threshold calibration: without precise request categorization filters, automated resident outreach can generate work order overload by submitting dozens of minor non-emergency service requests daily.'
  - id: technical-architecture-models
    title: Technical Stack, Inference Latency, and Agentic Orchestration
    claimRefs:
      - CE006
      - CE007
      - CE011
      - CE015
    figureRefs:
      - FE001
    body: Under the hood, EliseAI relies on a purpose-built technical infrastructure designed to overcome the conversational latency limitations inherent in generic large language model wrappers. Under the technical leadership of co-founder and CTO Tony Stoyanov, the engineering organization transitioned from third-party closed APIs to proprietary custom-trained models hosted on dedicated Baseten inference infrastructure. This migration compressed conversational latency from standard 2.2-second round-trips down to 250 milliseconds, comfortably below the critical 1.3-second threshold required for natural human speech interaction. The platform incorporates On-Policy Self-Distillation (OPSD) training techniques to interpret colloquial and ambiguous tenant inputs—such as informal move-in timelines or approximate budgets—with high semantic accuracy. Furthermore, specialized structured JSON extraction modules reliably map conversational inputs into strict database fields rather than unindexed strings. The orchestration framework powers Apollo, coordinating autonomous task execution across connected tools while strictly enforcing human-in-the-loop escalation boundaries for edge cases and exceptions.
  - id: integrations-security-governance
    title: Enterprise Integrations, Deployment Realities, and Compliance Governance
    claimRefs:
      - CE008
      - CE009
      - CE012
      - CE013
    tableRefs:
      - TE003
    body: A critical competitive moat for EliseAI is its deep integration into core enterprise systems of record. The platform maintains certified bidirectional synchronization with dominant property management systems, including Yardi, Entrata, and RealPage, alongside CRM solutions like Funnel, Rent Manager, and Bluemoon. This integration enables real-time extraction of unit pricing, floor plans, and concession data, while simultaneously writing back guest cards, booked appointments, and service orders. Because deep integration requires extensive property-specific data mapping, initial enterprise deployment entails a 4-to-8 week onboarding timeline where floor plans, amenities, and escalation rules are cataloged. For healthcare workflows, EliseAI adheres to rigorous compliance standards, incorporating HIPAA-compliant data encryption, granular role-based access controls, and administrative safeguards. While these controls secure sensitive patient and resident records, independent third-party algorithmic audit reports verifying compliance with federal Fair Housing Act nondiscrimination requirements remain unverified by public documentation, representing an ongoing governance diligence focus.
