  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Architecture Component
      - Operational Role
      - Underlying Dependency
      - Technical / Operational Risk
    rows:
      - - Custom Model Inference
        - Understands conversational nuances and colloquial renter phrases
        - Baseten inference infrastructure, custom fine-tuned weights
        - Hosting provider reliability, model drift, cold-start latency
      - - On-Policy Self-Distillation (OPSD)
        - Distills complex language models into low-latency task-specific models
        - Training pipelines and proprietary interaction dataset
        - Edge-case degradation on rare colloquial expressions
      - - Bidirectional PMS / CRM Sync
        - Synchronizes guest cards, appointments, pricing, and work orders
        - APIs of Yardi, Entrata, RealPage, Funnel, Rent Manager
        - Vendor API rate limits, schema changes, sync latency collisions
      - - Human-in-the-Loop Routing
        - Escalates ambiguous requests and hostile interactions to onsite staff
        - Property staff responsiveness and notification routing rules
        - Staff notification fatigue if escalation thresholds are misconfigured
    notes: Architecture assessment derived from published technical reports, infrastructure provider case studies, and integration specifications.
