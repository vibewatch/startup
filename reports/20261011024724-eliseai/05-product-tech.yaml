figures:
  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: Six-layer architectural stack powering EliseAI low-latency conversational intelligence, agentic task execution, and bidirectional enterprise integrations.
    approximationNotes: Architectural layers generalized from published technical documentation, Baseten infrastructure reports, and enterprise PMS integration specifications.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE011
      - CE012
      - CE015
    data:
      layers:
        - label: 1. Omnichannel Engagement Layer
          detail: Manages bidirectional user interactions across voice calls, SMS, email, and web chat.
          modules:
            - VoiceAI Inbound/Outbound
            - SMS Messenger
            - Email Processor
            - Web Chat Widget
          outputs:
            - Raw audio streams
            - Text transcripts
            - Channel metadata
        - label: 2. Conversational Intelligence & Orchestration Layer
          detail: Orchestrates intent classification, dialogue state tracking, and agentic task dispatching.
          modules:
            - Apollo Agentic Teammate
            - Dakota Virtual Assistant Persona
            - Dialogue State Machine
            - Context Manager
          outputs:
            - Structured user intents
            - Dialogue state tokens
            - Task dispatch triggers
        - label: 3. Domain-Specific Model & Inference Layer
          detail: Executes low-latency language understanding and structured JSON extraction via customized models.
          modules:
            - Custom Fine-Tuned LLMs
            - Baseten Inference Infrastructure
            - On-Policy Self-Distillation (OPSD)
            - JSON Extraction Engine
          outputs:
            - 250ms latency responses
            - Normalized entity values
            - Confidence scores
        - label: 4. Workflow Automation & Task Execution Layer
          detail: Executes business logic for residential leasing, resident lifecycle, and healthcare clinical operations.
          modules:
            - LeasingAI Tour Scheduler
            - ResidentAI Maintenance Parser
            - Delinquency & Renewal Manager
            - Healthcare Front-Desk Agent
          outputs:
            - Calendar reservations
            - Maintenance tickets
            - Payment plans
            - Patient referrals
        - label: 5. Enterprise Integration & Data Sync Layer
          detail: Maintains bidirectional synchronization with external enterprise systems of record.
          modules:
            - Yardi API Connector
            - Entrata Integration Hub
            - RealPage Sync Engine
            - EHR Interoperability Gateway
          outputs:
            - Guest card sync
            - Real-time pricing/availability
            - EHR schedule write-back
        - label: 6. Security, Compliance & Governance Layer
          detail: Enforces data protection, healthcare regulatory standards, and human escalation guardrails.
          modules:
            - HIPAA Encryption Safeguards
            - Role-Based Access Control
            - Human-in-the-Loop Routing
            - Audit Logging Engine
          outputs:
            - Encrypted audit trails
            - Staff escalation alerts
            - Compliance verifications
callouts:
  - calloutType: strength
    title: Low-Latency Custom Model Edge
    body: By replacing generic third-party API wrappers with custom-trained models hosted on dedicated Baseten infrastructure, EliseAI achieved a 250ms conversational response time. Coupled with On-Policy Self-Distillation, this architecture prevents the conversational lag that disrupts automated voice interactions.
    claimRefs:
      - CE006
      - CE007
  - calloutType: risk
    title: Onboarding Complexity and Operational Thresholding
    body: While EliseAI delivers high automation efficiency, deploying across large portfolios demands 4 to 8 weeks of intensive data mapping. Furthermore, failure to tune maintenance request thresholds can lead to work order overload, burdening onsite maintenance teams with trivial tasks.
    claimRefs:
      - CE013
      - CE014
