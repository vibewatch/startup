callouts:
  - calloutType: "risk"
    title: "Regulatory Exposure in Automated Housing Decisions"
    body: "Automating resident communication and leasing workflows introduces acute regulatory liability under the Fair Housing Act and state consumer protection laws. Because EliseAI interacts with more than 30 million Americans across one in six apartment units [CR010], any systematic steering, disparate impact, or discriminatory communication produced by autonomous conversational models could trigger class-action litigation or federal regulatory enforcement [CR001]. The lack of published independent third-party algorithmic bias audits leaves investors exposed to unhedged compliance liabilities [CR002]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR010"
  - calloutType: "risk"
    title: "Integration Friction and Enterprise Concentration Vulnerability"
    body: "While EliseAI has achieved deep penetration across 28 of the top 30 US multifamily operators [CR009], expanding beyond initial leasing automation encounters mounting technical debt in legacy property management software [CR006]. With 76% of operators maintaining fragmented multi-vendor AI stacks [CR007] and only 34% fully embedding AI into core operations [CR005], failure to maintain smooth bi-directional synchronization with platforms like Yardi and RealPage could stall expansion and jeopardize renewal economics on a $4 billion valuation [CR003, CR013]."
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR009"
      - "CR013"
