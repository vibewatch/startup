companyProfile:
  summary: >-
    EliseAI is a New York-based vertical AI software company founded in 2017 that automates leasing, resident, and
    patient communications for multifamily housing operators and outpatient healthcare practices. The platform now spans
    roughly one in six U.S. apartment units, has surpassed $200 million in annual recurring revenue, and expanded into
    healthcare while launching the Apollo agentic assistant in 2026.
