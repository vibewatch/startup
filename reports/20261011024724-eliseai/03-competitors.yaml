  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Vendor / Solution
      - Pricing Model
      - Reported Unit / Contract Cost
      - Included Capabilities
      - Discounts / Unknowns
      - Strategic Implication for Buyers
    rows:
      - - EliseAI
        - Custom quote-only enterprise contract
        - Reported $3-$6/unit/mo with ~$25,000 annual minimum
        - Full conversational stack (LeasingAI, ResidentAI, VoiceAI, EliseCRM)
        - Modular discounting available; healthcare quoted separately
        - Highly cost-effective for 500+ units ($14M savings reported at scale); prohibitive for small operators
      - - Lea (BetterBot)
        - Tiered SaaS subscription
        - Per-property or per-unit monthly rate without heavy enterprise minimum
        - Chatbot lead capture, automated tour scheduling, basic SMS follow-up
        - Custom enterprise discounting on multi-property bundles
        - Lower barrier to entry for mid-sized operators unable to meet EliseAI minimums
      - - PMS Bundled AI (AppFolio / Buildium)
        - Bundled feature or platform add-on
        - Embedded in core subscription ($1-$3/unit/mo total PMS platform cost)
        - Native CRM prompts, basic maintenance parsing, resident portal bot
        - Included in premium tiers or nominal usage fee
        - Displaces standalone point solutions for sub-500 door portfolios
      - - Structurely / Verse.ai
        - Per-seat or per-lead subscription
        - $200-$500/month per agent or user tier
        - ISA lead qualification, SMS and email sequences for agent leads
        - Usage-based tier caps and overage fees
        - Irrelevant for institutional multifamily; tailored strictly for brokerage agents
      - - Status Quo (On-site Leasing Agents)
        - Direct payroll and agency staffing
        - $45,000-$65,000/year per leasing specialist plus benefits
        - Full-service on-site leasing, resident relations, and property oversight
        - Overtime premiums, recruitment fees, and turnover costs
        - Primary cost pool targeted for displacement; centralization yields 8-figure savings across REIT portfolios
