callouts:
  - calloutType: risk
    title: Structural PMS Bundling Threatens Mid-Market Expansion
    body: While EliseAI dominates institutional multifamily operators (500+ units), incumbent property management software providers like AppFolio (Realm-X) and Buildium (Lumina) are aggressively embedding native conversational AI into core platforms at marginal or zero added cost. Because EliseAI enforces a reported ~$25,000 annual contract floor, it remains economically unviable for smaller landlords, creating a ceiling on addressable unit expansion unless EliseAI introduces lower-tier self-serve packaging.
    claimRefs:
      - CP010
      - CP011
      - CP012
