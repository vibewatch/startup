company:
  name: "EliseAI"
chapter:
  number: 6
  title: "Customers"
  summary: "EliseAI has achieved substantial enterprise scale in multifamily housing, powering conversational operations across one in six U.S. apartments and securing adoption among over 50% of the NMHC Top 50 operators. Flagship customers like Equity Residential demonstrate measurable operational ROI including $14 million in annual payroll savings from centralizing leasing workflows. While penetration across institutional REITs and affordable housing operators is strong, customer adoption faces real-world operational pitfalls including work-order overload and complex 4-8 week integration cycles."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation & Market Profile"
    body: "EliseAI's commercial foundation rests primarily on institutional multifamily housing operators, but the platform has systematically broadened its customer segmentation to include single-family rental portfolios, affordable housing operators, and outpatient healthcare practices. In conventional multifamily, EliseAI targets enterprise property managers seeking 24/7 lead capture, autonomous tour scheduling, and centralized leasing operations. Affordable housing operators, exemplified by Vesta Corporation, adopt the platform to automate strict regulatory intake and resident communications under lean staffing models. In healthcare, EliseAI addresses specialty physician groups struggling with front-desk staff turnover, automating patient intake, referrals, and scheduling. Across these segments, EliseAI positions its conversational AI agents as an operational backbone that directly integrates with core transaction systems rather than serving as an external web widget."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-growth"
    title: "Adoption Trajectory & Operational Scale"
    body: "EliseAI has achieved rapid commercial acceleration, surpassing $200 million in annual recurring revenue in June 2026 following five consecutive years of 100% year-over-year revenue expansion. This revenue trajectory is underpinned by massive physical footprint expansion: the platform currently automates workflows across one in six apartment units nationwide, with more than 30 million Americans having interacted with EliseAI systems since company inception. Enterprise adoption is particularly concentrated at the top of the market, where over 50% of the National Multifamily Housing Council (NMHC) Top 50 operators have deployed EliseAI across their properties. This customer density provides EliseAI with substantial compounding advantages in conversation training data, workflow benchmarks, and standard operational playbooks that raise barriers against generic conversational bots."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU002"
  - id: "named-deployments-case-evidence"
    title: "Institutional Deployments & ROI Case Evidence"
    body: "Public customer case evidence confirms that EliseAI has moved beyond experimental pilots into mission-critical production deployments with Tier-1 institutional landlords. Publicly traded apartment REIT Equity Residential represents the benchmark customer proof point, attributing $14 million in annual payroll savings to EliseAI as part of an initiative to centralize leasing offices and automate administrative communications. Other institutional operators standardizing operations on EliseAI include Brookfield Properties, Greystar, AvalonBay, Bozzuto, and Invitation Homes. In the affordable housing sector, Vesta Corporation utilizes EliseAI to maintain regulatory compliance and customer responsiveness without overburdening lean on-site teams. Across these deployments, documented ROI centers on shortening lead response time from hours to seconds, capturing off-hours prospect tours, and reducing repetitive on-site administrative overhead."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
    tableRefs:
      - "TU003"
  - id: "lifecycle-friction-expansion"
    title: "Lifecycle Dynamics, Adoption Friction & Concentration Risks"
    body: "Despite rapid customer expansion, real-world deployments reveal meaningful operational friction during customer onboarding and ongoing resident management. Integrating EliseAI into institutional portfolios requires 4 to 8 weeks of technical data mapping across property management systems like Yardi, RealPage, and Entrata. Furthermore, property managers report the 'efficiency trap' where conversational bots over-prompt residents for maintenance feedback, triggering floods of low-priority work orders that overwhelm maintenance teams. Resident frustration also arises when automated bots loop without human escalation, necessitating robust human-in-the-loop safeguards. On the expansion front, EliseAI leverages its EliseCRM hub to expand from initial leasing capture into renewals, maintenance triage, and payment reminders. As 89% of multifamily operators now deploy AI, EliseAI's durability hinges on sustaining high net retention and expanding further into outpatient healthcare."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
