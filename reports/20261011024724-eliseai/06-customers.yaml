callouts:
  - calloutType: strength
    title: "Deep Multifamily Integration and Documented Eight-Figure ROI"
    body: "EliseAI's dominant penetration among NMHC Top 50 operators is anchored by deep bidirectional integrations with core property management systems (Yardi, RealPage, Entrata) and demonstrated enterprise ROI. Large institutional operators like Equity Residential publicly credit the platform with contributing to $14 million in annual payroll savings by centralizing leasing operations and automating repetitive 24/7 administrative workflows."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
  - calloutType: risk
    title: "Adoption Pitfalls: Work-Order Overload and Resident Identity Friction"
    body: "Real-world operational feedback indicates that aggressive automation introduces distinct customer friction points. When conversational bots over-prompt residents for maintenance issues, on-site facilities teams can experience an influx of low-priority service tickets. Furthermore, resident frustration occurs when automated bots loop without human escalation, necessitating strict human-in-the-loop triggers to preserve resident satisfaction."
    claimRefs:
      - "CU010"
