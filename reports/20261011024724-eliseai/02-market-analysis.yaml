callouts:
  - calloutType: "insight"
    title: "Budget Substitution Over Software Licensing"
    claimRefs:
      - "CM002"
      - "CM006"
    body: "EliseAI's rapid ARR growth stems from pricing against operational payroll and labor replacement rather than conventional software IT budgets. With 85% of adopting operators realizing measurable operating expense reductions, the platform expands its effective market ceiling beyond legacy property management software."
  - calloutType: "risk"
    title: "Legacy PMS Integration and Vendor Consolidation Bottlenecks"
    claimRefs:
      - "CM007"
      - "CM008"
    body: "While 76% of operators utilize multiple AI point solutions, 35% cite integration friction and 28% report legacy PMS constraints as primary barriers to end-to-end automation. Operator demand for vendor consolidation creates a high-stakes race where failure to maintain deep bidirectional synchronization with systems like Yardi and RealPage risks displacement."
