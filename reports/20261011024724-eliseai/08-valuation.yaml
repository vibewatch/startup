callouts:
  - calloutType: recommendation
    title: "Underwriting Stance: Growth Allocation with Preference Scrutiny"
    body: "EliseAI warrants a Buy recommendation for dedicated growth mandates given its unmatched footprint across one in six U.S. apartments and rapid ARR expansion to $200 million. However, because entry at 20x ARR leaves little tolerance for execution slip or regulatory friction, late-stage allocations should condition commitment on confirming senior liquidation preference structures and auditing customer unit retention."
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV010
  - calloutType: risk
    title: "Primary Thesis-Break Trigger: Algorithmic Compliance Enforcement"
    body: "The primary structural vulnerability in EliseAI's vertical thesis lies in potential regulatory scrutiny under the Fair Housing Act regarding automated tenant screening and leasing dialogues. Investors should establish an explicit thesis-break trigger: any formal enforcement action by HUD or state attorneys general that restricts automated prospect qualification or mandates costly manual review would fundamentally impair the platform's operating leverage."
    claimRefs:
      - CV004
      - CV006
      - CV010
      - CV014
