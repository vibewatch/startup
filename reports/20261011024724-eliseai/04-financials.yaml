callouts:
  - calloutType: "insight"
    title: "Variable Delivery Cost Sensitivity in Vertical AI"
    body: "Unlike traditional seat-licensed enterprise software, EliseAI's gross margin profile is fundamentally tethered to interaction volume, telephony termination rates, and model inference overhead. As conversational interactions scale across 24/7 front-office channels, unoptimized token consumption can compress gross margins unless offset by volume-tiered carrier agreements and specialized model distillation."
    claimRefs:
      - "CI007"
  - calloutType: "risk"
    title: "Valuation Multiple Underwriting and Incumbent Disintermediation"
    body: "EliseAI's $4 billion Series F valuation represents a 20x multiple on its reported $200 million ARR. Underwriting this valuation requires sustaining triple-digit growth while navigating potential platform disintermediation from property management incumbents like Yardi and Entrata who control the core system of record and are embedding native AI agents."
    claimRefs:
      - "CI001"
      - "CI008"
      - "CI009"
