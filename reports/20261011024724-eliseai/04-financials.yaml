chapter:
  number: 4
  title: "Financials"
  summary: "EliseAI passed $200 million in reported ARR in mid-2026 after five consecutive years of 100% year-over-year growth, supported by a $350 million Series F financing at a $4 billion valuation. While its B2B subscription model achieves strong penetration in multifamily housing, sustaining a 20x ARR multiple requires expanding into outpatient healthcare while managing variable telephony and inference cost burdens and defending against platform disintermediation from property management incumbents."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Architecture and Pricing Mechanics"
    body: "EliseAI monetizes its vertical automation platform primarily through B2B subscription software-as-a-service (SaaS) agreements priced on a per-unit-per-month basis across multifamily housing portfolios. In June 2026, the company announced that it surpassed $200 million in annual recurring revenue (ARR), achieving 100% year-over-year revenue growth for the fifth consecutive year. Independent research from Sacra corroborates this growth trajectory, estimating that EliseAI scaled from approximately $37 million ARR at year-end 2023 to $75 million at year-end 2024, $150 million at year-end 2025, and reached $200 million in ARR by May 2026. The commercial wedge is driven by conversational front-office automation, with EliseCRM operating as the centralized platform layer that unifies prospect interactions, leasing communication, maintenance dispatch, resident renewals, fee transparency disclosures, and delinquency workflows. Customer deployments are structured around annual enterprise commitments, reflecting the integration overhead required to connect with property management systems of record and electronic health record software. While list pricing is not publicly published, customer procurement data indicates that pricing is contracted on a recurring per-unit subscription unit basis, with expansion driven by cross-portfolio unit additions and multi-module attach rates across resident services and outpatient specialty practices."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-and-cost-structure"
    title: "Go-to-Market Economics and Service-Delivery Costs"
    body: "EliseAI operates a high-touch, sales-led, demo-driven go-to-market motion targeting enterprise multifamily owners, third-party fee managers, and outpatient healthcare group practices. Unlike horizontal self-serve SaaS products, onboarding requires bespoke property management system synchronization, custom workflow configuration, and domain-specific knowledge base construction. Consequently, enterprise sales cycles involve structured technical evaluations and vendor approval phases before full portfolio rollout. On the cost side, EliseAI's service-delivery cost structure exhibits substantially heavier variable weight than traditional seat-based software. Operating live, 24/7 conversational voice, SMS, email, and web chat channels incurs recurring telephony carrier fees, SMS termination tolls, and computational language model token inference costs that scale directly with customer interaction volumes. Implementation and customer success personnel also carry meaningful operational expense given the integration depth required for automated maintenance dispatch, lease audit reconciliations, and clinical scheduling rules. Furthermore, as EliseAI pushes beyond top-50 multifamily operators into mid-market housing portfolios, affordable housing operators, and fragmented outpatient healthcare clinics, prospective buyers present lower internal IT maturity and more fragmented technology stacks, which increases customer acquisition costs and extended implementation timelines."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI014"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "capital-adequacy-and-financing"
    title: "Capital Adequacy, Credit Facilities, and Financing History"
    body: "On September 29, 2026, EliseAI announced a $350 million Series F growth financing co-led by Andreessen Horowitz and Bessemer Venture Partners at a $4 billion post-money valuation, with participation from Ontario Teachers' Pension Plan, Sapphire Ventures, and Navitas Capital. This transaction followed a $250 million Series E in August 2025 at an over $2.2 billion valuation and a $75 million Series D in August 2024, concentrating more than 90% of total equity funding into its last three rounds. Across seven equity financing rounds since its 2019 seed financing, EliseAI has secured $741.9 million in total equity funding. In addition to equity capital, the company secured non-dilutive financing through a revolving line of credit from Bridge Bank, initially established at $15 million in August 2022 and doubled to $30 million in December 2023, tied directly to recurring subscription income. Combined equity and debt facilities bring total cumulative financing to approximately $772 million. EliseAI intends to allocate its Series F proceeds toward establishing a secondary engineering hub in San Francisco alongside its New York headquarters, expanding sales and implementation teams across North America, and scaling agentic capabilities through Apollo. With $350 million in newly injected primary capital and an established credit facility, the company maintains multi-year cash runway without near-term balance sheet refinancing pressures."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs: []
    figureRefs: []
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Underwriting Verdict and Core Diligence Blockers"
    body: "From an underwriting perspective, EliseAI presents top-decile growth velocity within vertical artificial intelligence, backed by credible tier-one venture sponsors and extensive enterprise adoption across roughly one in six U.S. apartment units. However, the $4 billion Series F valuation implies a rich 20x ARR multiple on reported $200 million ARR. Justifying this valuation requires sustained high-double-digit growth and aggressive expansion into outpatient healthcare specialties, where sales cycles are prolonged and electronic health record integration is fragmented. Crucially, several fundamental financial metrics remain strictly private and unverified. EliseAI does not publicly disclose its net revenue retention (NRR), gross margins, customer acquisition cost (CAC) payback periods, or gross churn rates by customer vintage. In addition, the platform faces structural disintermediation risk from incumbent property management systems—including Yardi, RealPage, Entrata, and AppFolio—which own the operational systems of record and are embedding native agentic capabilities. Finally, compliance liabilities under the Fair Housing Act and healthcare privacy laws present unquantified legal exposures that could jeopardize enterprise renewals. Confirmatory underwriting diligence must prioritize securing audited cohort retention data, unit-level gross margin breakdowns, and third-party algorithmic compliance audit records before establishing an investment valuation."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI008"
      - "CI009"
      - "CI013"
      - "CI015"
    tableRefs: []
    figureRefs: []
