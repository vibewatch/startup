    severity: blocking
    topic: regulatory-compliance
    missingEvidence: >-
      Independent Fair Housing Act compliance audit logs, algorithmic bias evaluations, and state healthcare privacy
      compliance documentation.
    whyItMatters: >-
      Automated leasing communications and patient intake carry substantial legal liabilities under fair housing
      statutes and HIPAA; regulatory penalties or litigation could materially impair enterprise customer contracts.
    diligencePath: >-
      Require third-party fair-housing compliance certifications, algorithmic audit reports, and legal regulatory review
      memos from underwriting counsel.
    relatedQuestionRefs:
      - QI009
