    topic: fair-housing-regulatory-verification
    missingEvidence: >-
      Third-party audit results and empirical fair-housing compliance evaluations testing EliseAI conversational agent
      responses across protected demographic classes.
    whyItMatters: >-
      Multifamily leasing communications are strictly governed by federal and state Fair Housing regulations; automated
      responses that inadvertently steer or discriminate create catastrophic liability for institutional landlords.
    diligencePath: >-
      Request confidential third-party algorithmic audit reports and regulatory compliance certifications during
      enterprise legal diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin breakdowns, customer acquisition cost (CAC), LTV, and net revenue retention (NRR) by customer
      cohort and product module.
    whyItMatters: >-
      Without segmented gross margins and cohort net expansion rates, investors cannot independently determine whether
      high telephony and inference variable costs impede long-term software profitability.
    diligencePath: >-
      Request confidential historical cohort retention tables, unit-level gross margin statements, and infrastructure
      cost accounting directly from management during confirmatory diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
