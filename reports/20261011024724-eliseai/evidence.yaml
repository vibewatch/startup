  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-completeness
    missingEvidence: >-
      Detailed organizational chart covering secondary executives, including VP of Engineering, Head of Healthcare, and
      Head of Compliance.
    whyItMatters: >-
      Assesses management depth and functional coverage beyond the two co-founders as the company scales across two
      heavily regulated verticals.
    diligencePath: Request an updated organizational chart and key-person retention agreements during management due diligence.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-shareholder-terms
    missingEvidence: >-
      Full capitalization table including liquidation preferences, dividend rights, and protective provisions for the
      Series E and September 2026 rounds.
    whyItMatters: >-
      Identifies whether the headline $4 billion valuation carries seniority over earlier venture investors or common
      shareholders.
    diligencePath: Review the restated certificate of incorporation and investor rights agreements with corporate legal counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: vertical-revenue-segmentation
    missingEvidence: >-
      Audited financial breakdown separating annual recurring revenue, gross margins, and customer accounts between
      housing and healthcare.
    whyItMatters: >-
      Determines whether the healthcare business has achieved genuine commercial product-market fit or represents
      early-stage exploratory revenue.
    diligencePath: Request audited revenue by segment and customer concentration schedules from company finance leadership.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: healthcare-market-size
    missingEvidence: >-
      Audited segment reporting or verified customer disclosure isolating healthcare ARR contribution, contract counts,
      and churn from multifamily operations.
    whyItMatters: >-
      EliseAI achieved $200M ARR in June 2026, but the relative contribution and growth rate of its healthcare division
      cannot be validated independently from public marketing statements.
    diligencePath: >-
      Request management presentation breaking down ARR, net revenue retention, and active practice groups across
      housing versus healthcare customer cohorts.
    relatedQuestionRefs:
