company:
  name: "EliseAI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "EliseAI is a New York-headquartered enterprise AI software company automating conversational and operational workflows across multifamily housing and outpatient healthcare. In September 2026, the company raised $350 million at a $4 billion valuation, following reported expansion to over $200 million in annual recurring revenue across one in six U.S. apartments."

sections:
  - id: "corporate-identity-and-market-positioning"
    title: "Corporate Identity and Market Positioning"
    body: "Founded in 2017 as MeetElise by Minna Song and Tony Stoyanov, EliseAI has established itself as the leading vertical artificial intelligence automation platform for the residential housing and healthcare sectors. The company operates from its corporate headquarters in a 109,000-square-foot office in Manhattan, New York, while actively establishing a second engineering hub in San Francisco. Rather than selling generic horizontal AI or standalone chatbots, EliseAI embeds conversational and operational intelligence directly into incumbent property management systems and electronic health record workflows. The platform automates repetitive administrative communication across omnichannel touchpoints including SMS, webchat, email, and phone, powering approximately one in six apartment units across the United States and serving over 30 million cumulative consumer interactions."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO009"
      - "CO012"
    tableRefs:
      - "TO001"

  - id: "founders-executive-leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance"
    body: "EliseAI was co-founded by Chief Executive Officer Minna Song, who studied computer science at the Massachusetts Institute of Technology, and Chief Technology Officer Tony Stoyanov, who studied computer science at the University of Cambridge. Prior to founding the company, Song spent time working directly inside a New York residential real estate firm to understand firsthand the administrative friction and high turnover plaguing property operations. Together, Song and Stoyanov built the initial automation architecture to resolve staffing bottlenecks in leasing and maintenance workflows. Corporate governance expanded significantly alongside commercial growth; following the company's September 2026 financing round, Sameer Dholakia, partner at Bessemer Venture Partners and former chief executive officer of SendGrid, joined EliseAI's board of directors, contributing deep operational enterprise software scaling expertise."
    claimRefs:
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO002"

  - id: "capitalization-history-and-investor-syndicate"
    title: "Capitalization History and Investor Syndicate"
    body: "On September 29, 2026, EliseAI announced a $350 million primary funding round at a post-money valuation of $4 billion, nearly doubling its private-market valuation from $2.2 billion in August 2025. The round was co-led by existing venture sponsors Andreessen Horowitz and Bessemer Venture Partners, with substantial participation from Ontario Teachers' Pension Plan as a new institutional allocator, alongside returning investors Sapphire Ventures and Navitas Capital. The company's capitalization history reflects rapid milestone-driven expansion: EliseAI attained unicorn status in August 2024 through a $75 million Series D led by Sapphire Ventures at a $1 billion valuation, followed 13 months later by a $250 million Series E led by Andreessen Horowitz at $2.2 billion. The September 2026 round consisted almost entirely of primary capital, expanding liquidity for engineering hiring and geographical expansion."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO003"

  - id: "product-milestones-and-analytical-evaluation"
    title: "Product Milestones and Analytical Evaluation"
    body: "EliseAI's expansion from residential leasing into full lifecycle automation has driven rapid financial growth, with the company reporting that it surpassed $200 million in annual recurring revenue in June 2026 after doubling revenue year-over-year for five consecutive years. In 2023, EliseAI launched a dedicated healthcare vertical, automating appointment scheduling, patient intake, insurance verification, and care follow-ups for specialty physician groups. In September 2026, the company introduced Apollo, an agentic AI teammate capable of executing multi-step cross-platform tasks autonomously while deferring binding decisions to human supervisors. However, independent analytical scrutiny highlights critical diligence gaps, including conflicting marketing disclosures regarding whether the platform powers one in five versus one in six U.S. apartments, unverified ARR segmentation between housing and healthcare, and a premium 20x ARR valuation multiple."
    claimRefs:
      - "CO007"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"

