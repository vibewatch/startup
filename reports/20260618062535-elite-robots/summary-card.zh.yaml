  topStrengths:
    - 在 40+ 个国家部署 10,000+ 台，说明它在协作机器人市场已有真实商业牵引。
    - 具成本优势的 CS 系列协作机器人具备 IP68 等级和宽载荷范围（3–30 kg），覆盖多个垂直场景。
    - 垂直整合的研发团队约占员工 40–50%，拥有 400+ 项 IP 资产和 100k 小时 MTBF 指标。
    - Series D 融资（累计 $142M）和 7 个全球办公室，提供了资本和市场进入基础设施。
    - 协作机器人市场增长（18–20% CAGR），叠加中国政策顺风和全球制造自动化需求。
  topRisks:
    - 2026 年 4 月 Hamburg 初步禁令认定其侵犯 UR 软件版权，限制德国市场；诉讼范围可能扩大，合作伙伴 / 经销商也可能承担责任。
    - 德国、丹麦和美国安全机构就可禁用安全设置的功能发出通知，带来监管和产品责任风险。
    - 收入、利润率和烧钱速度完全未披露，公开信息无法评估资本充足性和现金跑道。
    - 中国背景在欧盟和美国市场抬升地缘摩擦，技术出口限制和贸易紧张都在升级。
    - 依赖集成商 / OEM 渠道带来集中度风险，也限制了直接客户关系和留存可见度。
  unresolvedGaps:
    - 收入、ARR、毛利率和单台经济性仍未披露；没有财务数据，就无法评估估值支撑和资本充足性。
    - Hamburg 版权案的最终结果，以及 Teradyne 是否会对 Elite Robots 经销商 / 合作伙伴发起更广泛诉讼，仍不确定。
    - $87M Series D 轮投资人身份、条款，以及任何优先权 / 棘轮压力都未公开。
    - 没有公开留存、NRR 或 GRR 数据；客户耐久性和复购行为未验证。
    - 德国、丹麦和美国安全机构围绕安全禁用功能的调查结论尚未公开披露。
