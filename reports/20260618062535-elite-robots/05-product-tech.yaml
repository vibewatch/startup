  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-gap
      missingEvidence: Model-by-model uptime, field failure, and service ticket data for the installed base.
      whyItMatters: Without field reliability evidence, ruggedness claims remain weaker than deployment-surface claims.
      diligencePath: Request post-sale reliability dashboards, warranty claim summaries, and service metrics by SKU.
      relatedQuestionRefs: [QE023]
    - type: missing-source
      severity: material
      topic: roadmap-gap
      missingEvidence: A dated public or management-supplied controller and software roadmap for 2026 onward.
      whyItMatters: Buyers and investors need to know whether Elite is iterating HMI, simulation, and controller software fast enough.
      diligencePath: Ask management for a next-12-to-24-month product roadmap and release-history changelog.
      relatedQuestionRefs: [QE024]
      relatedTableRefs: [TE005]
    - type: conflicting-data
      severity: minor
      topic: ip-count-gap
      missingEvidence: A consistent official patent/IP-asset count with jurisdiction and filing status.
      whyItMatters: IP depth is part of the differentiation claim, and inconsistent counts weaken confidence.
      diligencePath: Request a patent schedule or legal IP summary broken down by patents, applications, and other IP assets.
      relatedQuestionRefs: [QE018, QE025]
    - type: access-blocked
      severity: minor
      topic: ros-context
      missingEvidence: Clear Elite-specific ROS documentation or code artifacts beyond general robotics documentation context.
      whyItMatters: ROS compatibility is strategically interesting for advanced integrators but not well documented in reviewed public sources.
      diligencePath: Ask for ROS packages, integration notes, or customer references that explicitly describe ROS deployments.
      relatedQuestionRefs: [QE009, QE010]
