    title: Product architecture map
    type: stack
    layout: wide
    summary: Elite’s product architecture layers hardware, controller/HMI, integration interfaces, and partner software around workflow-specific deployment packages.
    data:
      items:
        - label: Workflow package layer
          note: Assembly, machine tending, inspection, pick-and-place, palletizing, screw-driving, and related handling cells
        - label: Application hardware layer
          note: CS63, CS66, CS612, CS620, CS625, and CS530H / CP palletizing configurations
        - label: Controller and HMI layer
          note: Standard AC controller plus OEM option; ERP400 and optional ERP400S teach pendant
        - label: Integration layer
          note: SDK manuals, communication files, I/O, force plugin, conveyor tracking, and partner interfaces
        - label: Software and simulation layer
          note: Proprietary software plus third-party programming, design, simulation, and RoboDK tutorial surface
        - label: Ecosystem layer
          note: EoAT, vision, AGV, actuator, and OEM partner network used to complete customer cells
    approximationNotes: Architecture is reconstructed from public product, support, download, and ecosystem surfaces rather than from a single official system diagram.
