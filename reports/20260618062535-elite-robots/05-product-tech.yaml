  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: Elite’s technical delivery depends on software trust, documentation quality, partner execution, and external tooling compatibility as much as on the arm itself.
    data:
      nodes:
        - id: elite-hardware
          label: Elite hardware platform
          detail: CS and CP/CS530H families provide the motion base and payload envelope
        - id: controller-hmi
          label: Controller and HMI software
          detail: AC/OEM controller plus ERP400 or ERP400S operator interface
        - id: docs-sdk
          label: Documentation and SDK layer
          detail: Download center, service manuals, communication files, and tutorials
        - id: oem-ecosystem
          label: External OEM ecosystem
          detail: EoAT, vision, AGV, actuator, and third-party software partners
        - id: channel
          label: Distributors and system integrators
          detail: Channel owns much of deployment, training, and troubleshooting in practice
        - id: trust-risk
          label: Software trust and legal risk
          detail: Copyright and safety allegations can affect partner willingness and customer confidence
      edges:
        - from: elite-hardware
          to: controller-hmi
          label: Motion hardware depends on controller software and pendant control
        - from: controller-hmi
          to: docs-sdk
          label: Deployability depends on usable manuals, SDKs, and configuration assets
        - from: docs-sdk
          to: channel
          label: Channel execution quality depends on documentation and integration tooling
        - from: oem-ecosystem
          to: channel
          label: End-of-cell success depends on partner tooling interoperability
        - from: trust-risk
          to: channel
          label: Legal and safety concerns can slow distributor or SI selling motion
        - from: channel
          to: elite-hardware
          label: Customer success feeds future platform adoption and redeployment
    approximationNotes: The map emphasizes second-order dependencies that are visible in public evidence, not a hidden internal BOM.
