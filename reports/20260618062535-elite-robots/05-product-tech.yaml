  - id: differentiation-trust-and-quality-controls
    title: Differentiation, Trust, Safety, and Quality Controls
    body: >-
      Elite’s differentiation is clearest on breadth of use cases, open integration posture, and a price-performance position that appears aggressive in public reseller references. The company also argues for quality and design credibility through partner testimonials, compatibility pages, and a substantial documentation surface. On safety and trust, however, the chapter must separate certification language from litigation risk. Official materials and reviewed product pages point to safety-focused hardware choices such as IP-rated enclosures and a 3-mode enable key on the ERP400S pendant, while industry standards pages provide the regulatory context for collaborative-robot safety expectations. But third-party adverse reporting now materially clouds that narrative. Universal Robots and The Robot Report both describe the Hamburg preliminary injunction as a software copyright case, and The Robot Report additionally quotes Teradyne’s CTO alleging that Elite included a setting that allowed users to disable safety settings and that authorities in several countries were warned. None of that proves final liability, but it does mean Elite’s technical moat is currently strongest on deployable hardware and integration flexibility, not on uncontested software trust.
    claimRefs:
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035
