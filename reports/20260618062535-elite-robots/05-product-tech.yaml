  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Elite’s public deployment motion runs from workflow scoping into integration, programming, and line support rather than from arm shipment alone.
    data:
      nodes:
        - label: Workflow identified
          detail: Customer selects assembly, tending, inspection, handling, or palletizing task with labor or ergonomics pain
        - label: SKU and cell fit defined
          detail: Payload, reach, EoAT, vision, and environment needs determine whether CS, EC, or CP/CS530H package fits
        - label: Integration configured
          detail: Controller, communications, I/O, and third-party tooling are mapped into the target machine or line
        - label: Programming and simulation
          detail: Teach pendant, SDK, scripts, tutorials, and simulation assets support setup and changeover
        - label: Go-live and support
          detail: Partner or Elite support handles training, troubleshooting, and documentation access
        - label: Expansion or redeployment
          detail: Same platform is repositioned into adjacent tasks if throughput, footprint, or labor case remains attractive
    approximationNotes: The flow generalizes recurring steps implied by official support, ecosystem, and application pages.
    claimRefs:
