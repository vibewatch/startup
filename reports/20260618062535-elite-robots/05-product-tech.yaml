company:
  name: Elite Robots
chapter:
  number: 5
  title: Product-Tech
  summary: Elite Robots sells collaborative robot arms, palletizing cells, and a controller/software environment that fit assembly, machine-tending, inspection, and palletizing workflows rather than pure research robotics. The product line is broad enough to cover light, medium, and higher-payload tasks, and official materials support real integration depth through SDK manuals, programming documentation, third-party tooling compatibility, and offline/simulation tutorials. The strongest product positives are rugged IP-rated hardware, broad workflow fit, and a partner-friendly integration posture; the main technical overhang is trust, because the 2026 Hamburg injunction and safety-disable allegations can affect how customers interpret software originality, safety governance, and long-term support risk.
sections:
  - id: workflow-definition-and-portfolio-boundary
    title: Product Definition in Customer Workflow Terms
    body: >-
      Elite Robots should be evaluated as a collaborative-automation platform for specific factory workflows, not as a generic industrial-automation brand. Across official product and application pages, the recurring jobs are assembly, machine tending, pick-and-place, palletizing, screw-driving, inspection, and related handling tasks. That means the delivered product is not just an arm: it is an arm, controller, teach pendant, software environment, safety configuration, and partner-integrated end-of-arm tooling that together replace or upgrade a human-assisted cell. The strongest customer value proposition is flexible deployment across medium-complexity workflows where changeovers, reprogramming speed, and physical footprint matter. Official product pages repeatedly position the CS family for broad EoAT support and for use beside third-party vision, grippers, and AGV or actuator systems. In practical buying terms, Elite is selling deployable collaborative workcells that can be reconfigured across multiple applications rather than a single-purpose robot appliance.
    claimRefs:
      - CE001
      - CE010
      - CE012
      - CE013
      - CE015
      - CE016
      - CE017
      - CE019
      - CE020
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: module-map-and-operating-architecture
    title: Module, SKU, and Operating Architecture Map
    body: >-
      The portfolio now spans the older EC line, the mainstream CS line, and palletizing-oriented CP or CS530H configurations that extend payload and vertical reach. Official reviewed pages support a ladder from the compact CS63 and CS66 into the longer-reach CS612 and the higher-payload CS620, CS625, and CS530H. The operating architecture is modular. Product pages describe a compact AC controller with an OEM controller option, the standard ERP400 pendant plus the ERP400S safety-enabled variant, and downloadable documentation that covers SDKs, communications, programming, drawings, certificates, and software. Elite’s ecosystem page adds the key software point: the company says its cobots work with third-party software for programming, design, and simulation, and with external EoAT, vision, and mobility components. This architecture matters because collaborative-robot adoption often fails at the integration boundary rather than at the arm itself. Elite’s public posture is therefore not a closed hardware-only sale but a controller-plus-software-plus-partner stack intended to fit broader automation cells.
