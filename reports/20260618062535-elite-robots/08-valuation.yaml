- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Why it matters
  - Action implication
  rows:
  - - Legal overhang worsens
    - Broader EU injunctions or material damages case
    - Would further impair channel confidence and valuation range
    - Move from track to avoid until reset
  - - Safety allegation is formally confirmed
    - Authority action or forced remediation tied to safety-disable claims
    - Would make trust and compliance risk central to the thesis
    - Treat as thesis break
  - - Next round prices below expectation
    - New financing without clear revenue proof or on highly protective terms
    - Signals bargaining weakness and dilution overhang
    - Re-cut base and bear ranges downward
  - - Partner/reference erosion
    - Named distributors or customer proofs go inactive after 2026
    - Undermines the commercialization case more than deployment count alone
    - Reduce bull-case probability sharply
  - - Transparency still absent
    - Management will not provide revenue, margin, and cap-table detail in diligence
    - Blocks any serious return-underwriting exercise
    - Do not invest
  notes: The kill list is designed to be observable in diligence or public reporting.
