- id: market-position-and-valuation-lens
  title: Market Position and the Right Valuation Lens
  body: Elite should not be valued like a pure software company, and public evidence does not support treating it like a mature industrial-automation incumbent either. The company is a hardware-and-software cobot vendor with channel leverage, meaningful manufacturing exposure, and evidence of global demand, but without disclosed economics. The right lens is therefore a hybrid of late-stage industrial-robot private pricing, public collaborative-robot comparables, and strategic M&A precedent. Public peer evidence is instructive. Doosan Robotics entered public markets in 2023 at roughly a $1.3 billion market capitalization despite only 45 billion won of prior-year revenue and an operating loss, illustrating that public investors have occasionally priced collaborative-robot leaders on growth and category positioning rather than current profitability. At the same time, Teradyne’s filings and shareholder letter show that even scaled robotics assets face cyclical pressure, and Universal Robots’
    own revenue trajectory softened after peaking in 2022. That mix implies that Elite’s valuation, whatever it is privately, should carry both growth optionality and a legal-risk haircut.
