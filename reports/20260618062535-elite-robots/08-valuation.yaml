  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-relevant public and private references identified in reviewed sources; they are not an exhaustive universe of all robot companies or transactions.
  rows:
  - - Doosan Robotics
    - Public cobot pure-play
    - 2023 IPO valued company at about $1.3B; June 2026 market cap about $4.37B
    - 2022 revenue 45B won with operating loss
    - Best public collaborative-robot valuation reference
    - Public market timing and Korean investor mix differ from Elite
  - - Teradyne / Universal Robots
    - Public strategic owner and leading cobot asset
    - Teradyne market cap about $63.96B
    - UR revenue peaked at $326M in 2022 and fell to $293M in 2024
    - Shows how scaled category leaders monetize and cycle
    - Teradyne is diversified and UR is not separately valued today
  - - Universal Robots 2015 sale
    - M&A precedent
    - Acquired by Teradyne for $285M
    - UR later sold more than 100,000 units worldwide
    - Demonstrates strategic value for category-leading cobot platforms
    - Transaction is old and predates current market structure
  - - Standard Bots
    - Private 2026 round
    - $200M Series C at $1B valuation
    - Company says it serves hundreds of customers and targets 10% of new U.S. deployments next year
    - Useful current private robotics pricing reference
    - American manufacturing story and AI-native narrative are different from Elite
