callouts:
- calloutType: recommendation
  title: Research-More, Not Pass
  body: Public evidence is strong enough to keep Elite on the active watchlist because the company appears commercially real and operates in a favorable category. It is not strong enough to justify taking price risk before revenue, cap-table, and remediation diligence.
  claimRefs:
  - CV001
  - CV005
  - CV030
  - CV037
- calloutType: risk
  title: The Legal Event Is Now a Valuation Input
  body: The 2026 Hamburg injunction should not be treated as a background legal note. It is a direct input into European growth assumptions, partner behavior, and the discount rate investors should apply to any forward multiple.
  claimRefs:
  - CV002
  - CV028
  - CV033
- calloutType: insight
  title: Public Demand Proof Exists, But Revenue Translation Does Not
  body: Elite has public deployment and partner signals, including a 3,000-unit order announcement and 10,000+ deployed units claim. What is missing is the bridge from those volume signals to current revenue quality, gross margin, and renewal economics.
  claimRefs:
  - CV006
  - CV007
  - CV010
  - CV030
- calloutType: assumption
  title: Scenario Bands Are Better Than Single-Point Targets
  body: With no public financial statements or disclosed private mark, a precise fair value target would overstate certainty. The chapter therefore uses ranges anchored to public robotics references and legal-adjusted scenario assumptions.
  claimRefs:
  - CV017
  - CV019
  - CV020
  - CV034
  - CV035
  - CV036
