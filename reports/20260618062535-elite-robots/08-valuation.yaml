  title: Thesis and anti-thesis table
  columns:
  - Side
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - Elite has real product breadth and global distribution reach with 100+ partners across 40+ countries
    - Partner attrition or shrinking office footprint would weaken the commercialization case
  - - Thesis
    - 10,000+ deployments and a public 3,000-unit order suggest meaningful market acceptance
    - If deployments are mostly pilots or low-utilization sites, the signal weakens materially
  - - Thesis
    - Collaborative robots remain a high-growth automation category through the early 2030s
    - If category growth slows sharply, private valuation premiums compress further
  - - Anti-thesis
    - The Hamburg injunction and software-copy dispute create a direct legal discount on future European growth
    - A documented remediation plan and no broader enforcement would reduce the discount
  - - Anti-thesis
    - Public revenue, gross margin, burn, and retention data are absent
    - Audited financials or diligence-quality monthly reporting would change the underwriting quality
  - - Anti-thesis
    - Cap-table, preferences, and legal-remediation cost are undisclosed
    - A clean cap table and manageable remediation reserve would improve expected returns
  notes: The positive case is market-and-product led; the negative case is trust-and-disclosure led.
