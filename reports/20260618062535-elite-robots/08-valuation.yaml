- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Exact current valuation
    - Post-money price from the March 2026 round and any secondary transactions
    - Needed to judge whether entry is already pricing in best-case growth
    - Request cap table and board-approved financing summary
  - - Revenue and gross margin
    - Current run-rate revenue, gross margin by family, and service attachment
    - Required to translate deployments into economic value
    - Request monthly financial package and audited statements if available
  - - Litigation remediation
    - Software separation plan, counsel view, and reserve estimate
    - Determines whether legal discount is temporary or structural
    - Review external counsel memo and engineering remediation roadmap
  - - Channel durability
    - Top partner revenue mix and any post-injunction churn
    - GTM is partner-amplified, so channel health is valuation-critical
    - Request regional partner cohort and pipeline conversion data
  - - Preference stack
    - Liquidation preferences, participation rights, and anti-dilution terms
    - Return potential can diverge sharply from enterprise value
    - Obtain full financing documents before term-sheet work
  notes: These are the minimum asks required before converting the chapter from track to priceable.
