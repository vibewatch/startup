callouts:
- calloutType: insight
  title: Use the narrow SAM, not the broadest TAM
  body: The biggest analytical mistake would be to underwrite Elite against the most aggressive broad cobot forecast instead of the medium-payload industrial workflows its public product pages actually fit.
  claimRefs:
  - CM010
  - CM011
  - CM039
- calloutType: risk
  title: Trust can become a market-size limiter
  body: Even if cobot demand grows rapidly, unresolved software-origin and safety-setting concerns can remove Europe or multinational accounts from the reachable SAM faster than price can win them back.
  claimRefs:
  - CM036
  - CM037
