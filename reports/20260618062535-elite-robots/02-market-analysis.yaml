figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Layered sizing shows how Elite’s reachable market narrows from global cobot TAM to a medium-payload industrial SAM and a non-dollar SOM visible mainly through installed-base evidence.
  data:
    nodes:
    - label: Broad cobot TAM ($1.4B-$1.9B current; higher in aggressive forecasts)
      note: Conservative current estimates from Mordor and MarketsandMarkets; higher long-range cases from Market.us and Allied
    - label: Application-led industrial SAM
      note: Assembly, machine tending, palletizing, and adjacent collaborative handling workflows
    - label: Elite product-fit SAM
      note: 3-30 kg CS family plus palletizing and machine-tending pages skew toward medium/heavier payload industrial uses
    - label: Global channel-enabled reach
      note: 40+ countries and 100+ partners/branches expand geographic coverage but do not disclose revenue mix
    - label: Observable SOM (10,000+ deployed units)
      note: Installed-base footprint is public; dollar SOM is not
  approximationNotes: The first layer is expressed as a published market range, while later layers are evidence-constrained and boundary-based rather than revenue-quantified.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM011
  - CM012
  - CM023
  - CM038
  - CM039
