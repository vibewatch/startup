  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-revenue
    missingEvidence: Elite Robots does not publicly disclose annual revenue, ASP, or software attach rate by product line.
    whyItMatters: Without realized revenue or ASP data, public sources cannot turn deployed units into a credible dollar SOM or gross-profit pool.
    diligencePath: Request the last 24 months of bookings, shipments, and revenue by model, region, and channel partner.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: vertical-mix
    missingEvidence: No public source breaks Elite’s installed base or bookings by automotive, electronics, logistics, or food customers.
    whyItMatters: Vertical mix determines how much of the broad cobot TAM is actually reachable and whether customer concentration skews the SAM.
    diligencePath: Ask management for installed-base by vertical, top-20 accounts, and pipeline by application family.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: material
    topic: tams
    missingEvidence: Third-party market publishers disagree sharply on current size and forward CAGR for collaborative robots.
    whyItMatters: Valuation work should not anchor on a single inflated TAM when reputable vendors publish materially different market bounds.
    diligencePath: Reconcile methodologies with a bottoms-up shipment model using importer, integrator, and public-company segment disclosures.
    relatedQuestionRefs:
    - QM006
    - QM007
    - QM008
  - type: access-blocked
