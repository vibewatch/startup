  - CM008
  - CM009
  - CM010
- id: FM003
  title: Buyer / segment map
  type: flow
  layout: wide
  summary: Elite’s adoption path typically runs through engineers and integrators before the payer approves a collaborative cell.
  data:
    nodes:
    - label: Workflow pain identified
      detail: Repetitive assembly, tending, or palletizing task selected
    - label: Integrator / engineer specification
      detail: Automation manager or system integrator defines payload, reach, safety, and tooling
    - label: Proof of concept
      detail: Cycle time, footprint, and operator interaction are validated
    - label: Capex approval
      detail: Plant operations or finance approves spend based on labor and uptime ROI
    - label: Integration and training
      detail: Cell is installed, risk assessed, and operators are trained
    - label: After-sales support
      detail: Partner or branch network sustains uptime and spare parts
  approximationNotes: Flow is generalized from public vendor deployment patterns and partner-led go-to-market evidence; precise Elite sales-cycle durations are not publicly disclosed.
  claimRefs:
