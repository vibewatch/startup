- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer
  - User
  - Payer / budget owner
  - Adoption trigger
  - Why Elite fits or misses
  rows:
  - - Electronics / mixed-model assembly
    - Manufacturing engineering manager
