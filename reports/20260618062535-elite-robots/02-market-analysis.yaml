company:
  name: Elite Robots
chapter:
  number: 2
  title: Market Analysis
  summary: Elite Robots operates in the collaborative-robot market rather than the full automation stack, with the most supportable SAM centered on assembly, machine tending, and palletizing workflows where its 3-30 kg portfolio and channel footprint matter. Public TAM estimates are directionally attractive but contradictory, ranging from roughly $1.4-$1.9 billion current market size in conservative reports to much larger long-range outcomes in aggressive reports; meanwhile adoption still depends on integrator depth, safety/compliance work, ROI proof, and buyer trust, especially in Europe after the 2026 German injunction.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Alternatives
  body: 'Elite Robots should be evaluated inside collaborative robots, not inside the entire industrial-automation stack. Its official product surfaces are robot arms, teach pendants, and application-led workcells rather than complete fixed-line factories or software-only automation. That means the included spend is the collaborative workcell itself: arm, controller, safety configuration, gripper/tooling, integration labor, and support. The excluded spend is just as important. Fixed industrial robots, AMRs, vision-only software, and manual labor that never faces an automation buying decision should not be added to Elite’s core TAM. The company’s own application pages broaden the market beyond one narrow SKU: palletizing, assembly, and machine tending each imply different process economics and buyer needs. The real status quo substitutes are manual operators, legacy hard automation, and incumbent cobot brands sold through local integrators. That framing matters because Elite is not selling
    a generic robotics future; it is selling a specific collaborative-workcell replacement decision against those alternatives.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
- id: sizing-lenses-and-contradictions
  title: TAM, SAM, and Evidence-Constrained Sizing Lenses
  body: 'Public collaborative-robot market sizing is directionally bullish but numerically inconsistent. Mordor and MarketsandMarkets place the current market in the roughly $1.4-$1.9 billion range with sub-21% CAGR assumptions, while Market.us and Allied publish much larger long-range outcomes with CAGRs above 30%. Those divergences are too wide to ignore, so the chapter preserves them instead of selecting one flattering estimate. For Elite specifically, the more useful question is not the broadest cobot TAM but the company’s reachable subset. Elite’s current catalog and application pages point to a SAM centered on assembly, machine tending, and palletizing workloads in medium-payload industrial environments. Its 3-30 kg CS lineup and palletizing pitch move it above the light-duty center of the market, which may be strategically attractive if heavier payload categories keep growing faster than sub-5 kg volumes. Public evidence supports a layered view: broad cobot TAM, narrower industrial
    SAM, and an SOM that is visible in units and countries but not convertible into revenue dollars because Elite does not disclose revenue, ASPs, or software/service mix.'
  claimRefs:
