  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: The buyer journey narrows from broad automation interest to a supported production deployment, with compliance and integration work filtering opportunities at each stage.
  data:
    items:
    - label: Automation interest
      value: 100
      detail: Large universe of repetitive industrial tasks
    - label: Cobot-suitable workflow
      value: 70
      detail: Tasks with acceptable safety envelope and variability profile
    - label: Economically justified pilot
      value: 45
      detail: ROI survives hardware, integration, and training cost review
    - label: Validated production cell
      value: 25
      detail: Risk assessment and integrator work complete
    - label: Scaled installed program
      value: 10
      detail: Support network, spare parts, and buyer confidence hold
  approximationNotes: Values are ordinal, not measured conversion rates; they illustrate where cost, safety, and trust constraints narrow adoption.
