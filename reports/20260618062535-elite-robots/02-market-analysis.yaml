- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Elite Robots
  - Diligence ask
  rows:
  - - Flexible automation and smaller batch sizes
    - Tailwind
    - Current
    - Supports Elite assembly positioning and quicker justification for cobots vs hard automation
    - Request customer case studies showing payback in mixed-model lines
  - - Labor scarcity and ergonomic risk
    - Tailwind
    - Current
    - Strengthens machine-tending and palletizing ROI cases
    - Validate labor-savings assumptions against real customer deployments
  - - Safer human-robot collaboration
    - Tailwind
    - Structural
    - Keeps collaborative cells attractive versus caged robots in constrained footprints
    - Test whether Elite wins on safety certification in EU and North America
  - - Hardware-led bill of materials
    - Headwind
    - Current
    - Actuator, controller, and sensor costs can compress margins and lengthen payback
    - Request gross-margin bridge by model and supplier concentration
  - - Integration and training cost
    - Headwind
    - Current
    - SMEs may hesitate even when arm list price is competitive
    - Measure integrator hours and training burden per deployment
  - - Incumbent ecosystem depth
    - Headwind
    - Structural
    - UR, ABB, FANUC, and others compete on uptime support and partner breadth
    - Compare Elite partner coverage density and spare-parts response times
  - - European trust and compliance scrutiny
    - Headwind
    - Current
    - The 2026 Hamburg injunction can slow procurement in regulated or risk-sensitive markets
    - Confirm whether any distributors paused selling in Germany or adjacent EU markets
  - - Public-data gaps on vertical mix and revenue
    - Constraint
    - Current
    - Prevents clean SOM, penetration, and margin models from public evidence alone
    - Obtain bookings by vertical, region, and direct-vs-channel sales motion
  notes: Timing and severity are editorial assessments from public evidence; the injunction and data gaps are company-specific constraints layered on top of normal cobot adoption friction.
