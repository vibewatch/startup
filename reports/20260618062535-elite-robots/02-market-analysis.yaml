    - Plant operations capex or automation budget
    - Fast changeovers and small-batch flexibility
    - Elite assembly pitch aligns well; needs proof of uptime and precision
  - - Automotive and industrial components
    - Automation manager / plant engineering
    - Cell operators / maintenance staff
    - Plant leadership / capex committee
    - Safety-certified automation around repetitive tasks
    - Large segment but buyers favor proven service and safety track record
  - - Machine shops / CNC environments
    - Production manager or integrator
    - Machine operators
    - Ops budget or retrofit capex
    - Run multiple machines with fewer interruptions
    - Elite machine-tending pitch is strong if integrator support is local
  - - Packaging / logistics palletizing
    - Packaging or warehouse operations lead
    - End-of-line operators
    - Operations or packaging capex
    - Reduce lifting injuries and end-of-line labor cost
    - Elite’s 20-25 kg palletizing messaging is directly relevant
  - - SME general manufacturing
    - Owner-operator or plant manager
    - Cross-trained operators
    - Owner capex / operating cash
    - Need flexible automation without large engineering teams
    - Market exists, but integration cost and support burden can be a blocker
  notes: Buyer, user, and payer separate across most industrial accounts; partner and integrator influence is material in specification and deployment.
