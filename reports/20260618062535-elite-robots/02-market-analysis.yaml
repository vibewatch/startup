tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Elite Robots
  rows:
  - - Core collaborative robot workcell
    - Arm, controller, teach pendant, safety setup, gripper/tooling, integration, after-sales support
    - AMRs, conveyors, MES/ERP, unrelated factory software
    - Plant ops / manufacturing engineering / capex owner
    - Directly relevant; this is the product bundle Elite actually markets
  - - Assembly cobot applications
    - Small-batch assembly labor, fixture changes, inspection-adjacent handling
    - Dedicated high-volume hard automation with no collaborative requirement
    - Manufacturing engineering + operations
    - Directly relevant; Elite explicitly markets assembly flexibility and quick changeovers
  - - Machine tending cobot applications
    - CNC loading/unloading, cell tending, multi-machine supervision
    - Standalone machine tools without automation retrofit
    - Plant operations / automation manager
    - Directly relevant; Elite sells injury reduction and uptime benefits here
  - - Palletizing and end-of-line automation
    - End-of-line loading, ergonomic injury reduction, pallet cells, packaging handoff
    - Forklift fleets, warehouse software, non-collaborative heavy robot cells
    - Operations / logistics / packaging manager
    - Directly relevant; Elite explicitly markets 20-25 kg palletizing reach
  - - Broad industrial automation adjacencies
    - Traditional industrial robots, fixed automation, other robotic subsystems
    - Manual labor that never enters an automation evaluation
    - Varies by plant and process
    - Context only; should not be counted inside Elite’s core cobot TAM
  notes: Boundary is narrowed to collaborative workcells and their deployment services; adjacent automation spend is context, not core TAM.
