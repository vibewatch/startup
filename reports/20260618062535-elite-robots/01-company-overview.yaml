- id: product-footprint-and-operating-scale
  title: Product Footprint and Operating Scale
  body: 'Elite Robots’ current commercial story is centered on cobots rather than legacy industrial-control products. Official pages show an installed product set spanning older EC-series robots, the current CS-series line, CP palletizing solutions, CSA and CSH variants, and explosion-proof variants released domestically. The CS family is the clearest current flagship: the website states six models spanning 3 kg to 30 kg payloads, 624 mm to 1,800 mm reach, repeatability from ±0.02 mm to ±0.1 mm, max tool speed up to 4.0 m/s, and IP65 standard protection upgradeable to IP68. Safety and usability are central to the company message, with ISO 10218 and ISO 13849 alignment, 90 adjustable collision-detection levels, a graphical interface, and the optional ERP400S teach pendant launched globally in February 2024. Scale indicators are meaningful but not fully harmonized across pages. Official materials variously claim 10,000+ deployed units, service coverage across 35+ to 40+ countries, roughly
    40% to almost 50% of staff in R&D, and 200+ to 400+ patents or IP assets depending on the page. The company also points to a 11,000 m² Suzhou R&D/manufacturing site, a second manufacturing site in Zhengzhou, 100+ partners, and an aspirational push toward 20,000 deployed units, indicating rapid expansion but also highlighting that several scale metrics are marketing snapshots rather than audited operating disclosures.'
