    - Repeat investor across multiple rounds
    - Appears in both Tracxn and CB Insights as a recurring investor, implying durable cap-table presence.
    - Confirm ownership %, board rights, and whether Oriza influenced manufacturing expansion.
  - - Fortune Capital
    - Series C / Series D investor in secondary databases
    - Appears in both Tracxn and CB Insights and may be a bridge between earlier and latest financings.
    - Clarify lead role, pro-rata rights, and whether it participated in any 2025 valuation event.
  - - Lenovo Capital and Incubator Group
    - Lead investor in Apr-2021 Series B round per Tracxn
    - Important milestone investor tied to scale-up phase before international branch expansion.
    - Confirm whether Lenovo holds board rights, commercial introductions, or strategic procurement channels.
  - - Zhengzhou Embodied Intelligence Industry Fund
    - Named Series D investor in CB Insights
    - Potentially important because Elite also lists a second manufacturing site in Zhengzhou.
    - Test whether local-government-linked capital is tied to plant build-out, hiring, or subsidy conditions.
  - - Ceyuan Ventures / Langmafeng VC / Advantech Capital / Kunyan Capital
    - Named financial sponsors in secondary databases
    - These names broaden the cap-table beyond a single lead investor and imply multiple financing syndicates.
    - Request a full cap table, entry dates, and any secondary transfers or liquidation preferences.
  - - Partner ecosystem (100+ partners, including MOOVALL)
    - Commercial distribution stakeholder class
    - Not equity investors, but channel partners are economically meaningful because they support sales, support, and international reach.
    - Quantify partner-driven bookings share, distributor concentration, and termination rights if the litigation expands.
  notes: The map blends equity and economically material channel stakeholders because public disclosures do not reveal precise investor ownership or governance rights.
