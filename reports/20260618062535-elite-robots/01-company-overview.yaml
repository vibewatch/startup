- id: leadership-governance-and-key-person-risk
  title: Leadership, Governance, and Key-Person Risk
  body: 'Leadership disclosure is one of the thinnest areas in the public record. Tracxn names Kai Sun as founder and specifically identifies him as Co-Founder and COO. Public company-controlled materials separately quote Dr. Yunan Cao as CEO, and Craft also lists Cao Yunan as Founder & CEO. Those disclosures establish at least two named senior leaders, but they do not produce a complete management roster, board list, or governance-rights map. No reviewed official page disclosed independent directors, investor board seats, audit structure, or material leadership changes. That absence does not prove weak governance, but it does increase diligence burden because ownership concentration, board oversight, and succession planning are not visible from public materials. Key-person dependence therefore appears material: the externally visible leadership narrative is concentrated around a small number of named executives, and the public evidence base for broader operating leadership is sparse. Investors
    should specifically diligence whether Kai Sun and Yunan Cao hold complementary founder control, how operational authority is split between product/R&D, manufacturing, and international sales, and whether any major investor has governance rights that are not publicly surfaced.'
  claimRefs:
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
