  title: The German injunction is a concrete channel-risk event, not just a headline
  body: The April 2026 Hamburg preliminary injunction reportedly blocks Elite Robots Germany from offering or distributing the disputed software in Germany and requires customer disclosure, making the issue operational for distributors and customers even before a final ruling is reached.
