  - TO002
- id: funding-history-and-stakeholder-map
  title: Funding History and Stakeholder Map
  body: 'Funding history is directionally clear but numerically inconsistent across private-company databases. Tracxn reports Elite Robots as a Series D company founded in 2016 with $142 million raised across six rounds, first funded in June 2016, with a latest Series D round dated March 25, 2026 and earlier marked rounds in April 2021 and early 2022. CB Insights reports a larger $160.29 million raised across eight rounds, a March 25, 2026 Series D of $87 million, a December 2025 valuation datapoint of $361.66 million, and 19 investors. Because both sources are secondary and partially paywalled, the safest diligence position is that Elite Robots has raised substantial nine-figure private funding, but exact lifetime capital, round count, and valuation require direct company confirmation. The overlap between databases is still useful: investors repeatedly associated with the company include Oriza Holdings, Fortune Capital, Lenovo Capital and Incubator Group, Advantech Capital, Ceyuan Ventures,
    Langmafeng Venture Capital, Kunyan Capital, and later-stage China-based funds. No reviewed public source disclosed debt facilities, credit lines, secondary transactions, liquidation terms, or ownership percentages. That leaves stakeholder power, preference stack, and founder dilution as unresolved diligence asks rather than publishable facts.'
