companyProfile:
  summary: >-
    Elite Robots, founded in January 2016 in Suzhou, China, is a vertically
    integrated collaborative robot (cobot) manufacturer that designs, manufactures,
    and sells flexible automation solutions under the CS, EC, and CP product lines.
    The company shifted from industrial robots to cobots in 2017 and has since
    deployed more than 10,000 units in 40+ countries through a network of integrators,
    OEM partners, and seven global offices. With an R&D team comprising roughly
    40–50% of its workforce and 400+ IP assets, Elite Robots positions itself as a
    cost-effective alternative to Western cobot leaders. However, the company faces
    a material legal risk: in April 2026, the Regional Court of Hamburg issued a
    preliminary injunction against its German subsidiary for alleged copyright
    infringement of Universal Robots' PolyScope software, with safety authorities
    also notified about a feature allowing users to disable safety settings.
  foundedDate: "2016-01-01"
  founders:
    - name: Cao Yunan
      role: Co-Founder & CEO
      background: >-
        Named CEO in company blog post (2023); listed as Founder and CEO by
        Craft.co; background details not publicly disclosed.
      claimRefs: [CO024, CO025]
    - name: Kai Sun
