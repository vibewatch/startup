- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Price-performance at 6-20 kg tiers
    - UR, FANUC, and others can discount or widen payload coverage
    - High
    - Review recent quotes and realized discounts by competitor and region
  - - Rugged industrial positioning (e.g. IP68-oriented CS message)
    - Incumbents can match ruggedization in target accounts or sell trust over spec
    - Medium
    - Request customer references where environmental protection rating decided the sale
  - - International partner network
    - UR and other incumbents have far deeper disclosed local channel density
    - High
    - Map partner coverage overlap and spare-parts SLA by country
  - - Software / UI differentiation
    - Litigation and similarity allegations weaken any software-based moat narrative
    - High
    - Obtain product demos, source-code provenance review, and post-injunction roadmap evidence
  - - Switching costs after deployment
    - Integrators and large factories can multi-home across brands
    - Medium
    - Measure reprogramming time, tooling change cost, and retraining burden in lost/won accounts
  - - Cost challenger narrative
    - Margin-compressive peer economics can force unsustainable pricing
    - Medium
    - Request gross-margin by model and payback by application
  - - European expansion readiness
    - Adverse legal evidence may disqualify Elite before technical evaluation begins
    - High
    - Recheck distributor response, legal status, and any remediation actions in Europe
  notes: Severity is editorial and based on reviewed public evidence; multiple risks are unresolved because public win/loss, discount, and distributor-response data are absent.
