  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: No public source reveals Elite win/loss rates against Universal Robots, FANUC, ABB, or Doosan by region or application.
    whyItMatters: Without actual win-rate data, public positioning and price comparisons can overstate or understate Elite’s real competitive strength.
    diligencePath: Request CRM win/loss data by competitor, region, payload class, and application family for the last 12 months.
    relatedQuestionRefs:
    - QP023
    - QP025
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Public sources provide list or reseller pricing, but not realized discounts, bundle terms, service attach, or integrator markup.
    whyItMatters: Competitive pricing conclusions are fragile if realized pricing differs materially from public list references.
    diligencePath: Obtain recent quotes, discount schedules, and distributor margin structures for Elite and two major peers.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: No public source breaks Elite partner revenue by distributor or integrator concentration.
    whyItMatters: Channel concentration can amplify switching risk and weaken any claimed distribution moat.
    diligencePath: Request top-20 channel partners by bookings, support incidents, and renewal contribution.
    relatedQuestionRefs:
    - QP018
    - QP025
  - type: stale
    severity: material
    topic: europe-litigation-outcome
    missingEvidence: Reviewed public sources show the April 2026 injunction but not any final judgment, settlement, or distributor response update.
    whyItMatters: Trust and regulatory posture could improve or worsen materially depending on what happened after the injunction.
    diligencePath: Recheck German legal dockets, distributor statements, and company responses before underwriting European expansion.
    relatedQuestionRefs:
    - QP015
    - QP022
