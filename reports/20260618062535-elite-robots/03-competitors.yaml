  rows:
  - - Universal Robots
    - Direct category leader / pure-play cobots
    - 50,000+ installed cobots; 800+ distributors & integrators in 60+ countries
    - Broad industrial automation buyers seeking flexible cobots
    - Largest disclosed channel depth; strong ecosystem and service positioning
    - Higher list pricing at low payload tiers; challenger vendors can compete on upfront price
  - - Doosan Robotics
    - Public cobot specialist
    - 2023 IPO at 1.69T won market cap; 45B won revenue and operating loss disclosed
    - Industrial and service automation buyers; palletizing included
    - Public-market scale, Korea leadership claim, dedicated product expansion
    - Public losses show scale has not yet eliminated margin pressure
  - - ABB
    - Diversified incumbent
    - Global robotics organization; broad service network
    - Enterprise buyers prioritizing safety, support, and broad automation relationships
    - Formal safety guidance and large support organization
    - Not marketed as a price-led cobot specialist
  - - FANUC CRX
    - Diversified incumbent cobot line
    - 12-model CRX family spanning 3-50 kg payloads
    - Manufacturers valuing durability and easy deployment
    - Zero-maintenance message and pre-engineered solutions
    - Opaque public pricing and broad portfolio can reduce apples-to-apples comparison
  - - Techman Robot
    - Direct peer with software-led angle
    - Private; AI-vision focused public positioning
    - Manufacturers wanting built-in vision and simpler inspection workflows
    - Integrated AI vision differentiation
    - Public scale disclosure is thinner than UR or Doosan
  - - KUKA
    - Adjacent incumbent / diversified robotics
    - Large industrial robot franchise
    - Buyers purchasing through broader robot and cell relationships
    - Breadth across industrial applications
    - Less visible collaborative specialization on reviewed public page
  - - Elite Robots
    - Cost-effective challenger
    - Private; 10,000+ units and 100+ partners claimed publicly
    - Buyers balancing payload, ruggedness, and upfront cost
    - Aggressive public reseller pricing and 3-30 kg product span
    - Smaller service network and active legal overhang in Europe
  notes: Public scale evidence is uneven across private companies; competitor categories distinguish pure-play cobot leaders from broader robotics incumbents and substitutes.
