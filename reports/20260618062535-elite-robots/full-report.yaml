      - number: '7.4'
        title: Financial and Model Risk, Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Public financial opacity turns many risks into model risk. Elite has raised meaningful capital, but
              because revenue, gross margin, burn, and litigation reserve posture are undisclosed, investors cannot tell
              whether the company can self-fund legal remediation, absorb European disruption, or tolerate slower
              channel conversion. Hardware businesses also face working-capital and component risks that software
              businesses do not, and peer evidence from public robotics companies shows that scale does not guarantee
              profitability. That said, not all risks are unmitigated. The company has a wide partner footprint,
              multiple product families, and enough public deployment proof that remediation is not conceptually
              impossible. The key question is mitigation maturity. If management can show software separation or
              redesign, regulator engagement, partner retention, and continued growth outside the contested regions, the
              thesis may survive. If instead the company loses European channels, cannot explain the safety allegations,
              or needs new capital without visibility into economics, the investment case weakens sharply. The practical
              outcome is a high-risk posture with explicit thesis-break triggers rather than a blanket “avoid forever”
              view.
