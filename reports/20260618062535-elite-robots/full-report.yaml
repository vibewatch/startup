  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Elite Robots does not compete in a single tidy peer set. The real landscape spans pure-play cobot
              specialists, diversified industrial-robot incumbents, internal-build programs at the very largest
              manufacturers, and the ongoing baseline of manual or fixed automation. Public sources make Universal
              Robots the clearest reference leader because it combines a dedicated collaborative-robot portfolio with
              global channel depth. Doosan Robotics, Techman Robot, and FANUC CRX form a more directly relevant cobot
              peer set on product form factor and application overlap. ABB and KUKA matter because buyers often purchase
              robotics through broader automation relationships, safety confidence, and installed references rather than
              by comparing a single arm in isolation. Internal build is not the default threat for most buyers, but it
              remains strategically important because it shows that some high-volume manufacturers can convert from
              customer to substitute when volume and IT control justify it. For most of Elite’s actual prospects, the
              immediate alternatives remain another cobot brand, legacy fixed automation, or leaving the task manual.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
