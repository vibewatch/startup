      - number: '3.4'
        title: Switching Costs, Lock-In, Moat Durability, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Switching costs in cobots are real but not absolute. Buyers accumulate programming, end-effector,
              risk-assessment, training, and spare-parts dependencies once a cell is running, yet multi-homing remains
              possible because integrators and larger factories can support more than one brand. That makes this a
              market where incumbents can be displaced, but usually by vendors that also demonstrate local support and
              trust. Elite’s moat is most credible on price-performance, mid-to-higher payload economics, and rugged
              positioning. Those are helpful but not fully durable, because rivals continue to widen payload ranges,
              bundle more software or AI vision, and sell pre-engineered solutions that lower deployment friction. The
              strongest adverse evidence is the Hamburg injunction, which gives competitors a concrete trust narrative
              in Europe. Peer economics add another warning: Doosan’s public losses and Teradyne’s own discussion of
              robotics as an early-stage, cyclical business imply that even scaled vendors may keep pricing
              aggressively. The competitive verdict is therefore mixed: Elite can still win where price and payload
              matter most, but its moat is easier to compress than the service, ecosystem, and trust advantages of top
              incumbents.
