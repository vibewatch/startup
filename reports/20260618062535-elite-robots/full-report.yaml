        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Elite Robots should be evaluated as a collaborative-automation platform for specific factory workflows,
              not as a generic industrial-automation brand. Across official product and application pages, the recurring
              jobs are assembly, machine tending, pick-and-place, palletizing, screw-driving, inspection, and related
              handling tasks. That means the delivered product is not just an arm: it is an arm, controller, teach
              pendant, software environment, safety configuration, and partner-integrated end-of-arm tooling that
              together replace or upgrade a human-assisted cell. The strongest customer value proposition is flexible
              deployment across medium-complexity workflows where changeovers, reprogramming speed, and physical
              footprint matter. Official product pages repeatedly position the CS family for broad EoAT support and for
              use beside third-party vision, grippers, and AGV or actuator systems. In practical buying terms, Elite is
              selling deployable collaborative workcells that can be reconfigured across multiple applications rather
              than a single-purpose robot appliance.
