      - number: '7.2'
        title: Regulatory, Legal, IP, Privacy, and Safety Risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete public risk evidence is legal. Universal Robots said the Regional Court of Hamburg
              issued a preliminary injunction against Elite Robots Deutschland in April 2026 after Teradyne Robotics
              sued in February, and The Robot Report reported the same ruling with additional detail on customer
              disclosure and planned action against partners. The same reporting stream also carries the most serious
              safety allegation: The Robot Report quoted Teradyne CTO David Brandt saying Elite included a setting that
              allowed safety settings to be disabled and that authorities in Denmark, Germany, and the United States had
              been warned. Even without a final ruling, that combination matters because collaborative-robot buyers care
              about software trust, safety posture, and documentation quality simultaneously. Elite’s own
              privacy-policy, cookie-policy, and imprint pages show the company does maintain legal and data-processing
              surfaces for a global website, but they do not resolve the harder diligence questions around product
              software provenance, regulator correspondence, or remediation. Investors should therefore treat legal
              exposure, software originality, and safety governance as linked rather than separate issues.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
