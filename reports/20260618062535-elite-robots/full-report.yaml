    sections:
      - number: '1.1'
        title: Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Elite Robots presents itself as a collaborative-robot manufacturer founded in January 2016 in Suzhou,
              China, after initially focusing on industrial robots and motion controllers before pivoting to cobots. The
              operating model today is a hardware-plus-software automation business: the company sells collaborative
              robot arms, palletizing systems, controllers, teach pendants, and related integration support through a
              partner ecosystem. Public identity surfaces are directionally consistent on the company being Chinese,
              private, and growth-stage, but not perfectly consistent on headquarters language. The contact page labels
              Suzhou as the ‘HQ & Manufacturing Site’ while the about page says the company is headquartered in Shanghai
              AI Robot Valley and the same contact page labels Shanghai as the International Operations Center. For
              diligence purposes, the most supportable framing is a Suzhou-founded private cobot vendor with Suzhou as
              the core operating and manufacturing base and Shanghai as the international/commercial hub, pending
              confirmation of the legal registered headquarters. This ambiguity matters because later diligence on
              subsidies, local manufacturing incentives, litigation venue, and cap-table records should anchor to the
              registered entity rather than marketing copy.
