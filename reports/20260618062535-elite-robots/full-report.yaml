      - number: '7.3'
        title: Operational, Dependency, and Geopolitical Transmission Risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk starts with concentration. Public company materials and prior chapters point to
              manufacturing anchored in Suzhou and a second site in Zhengzhou, which means a meaningful share of build,
              service-parts flow, and product control is concentrated in China. That structure is not automatically bad;
              it likely supports cost and control. But it does create exposure to supply interruptions, shipping delays,
              trade-policy changes, and Western customer scrutiny during a period of heightened U.S.-China technology
              tension. Dependency risk is not limited to factories. Elite relies on distributors, OEMs, and system
              integrators to specify, install, and support many deployments. A legal dispute that makes those partners
              uncomfortable can propagate into lower pipeline conversion or slower post-sale support. Safety and quality
              risk also sit here because a collaborative robot installed beside people must be validated not only by the
              vendor but by the integrator, plant, and local safety process. In other words, operations risk is partly
              internal manufacturing concentration and partly external ecosystem fragility.
