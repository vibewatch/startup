      - number: '4.2'
        title: GTM Motion and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Elite’s GTM appears to be channel-amplified rather than purely direct. The company’s worldwide and contact
              pages point to regional offices plus a much larger partner network, which is a sensible approach for a
              manufacturer selling integrated automation into many countries. The tradeoff is that channel reach is not
              free: distributors and integrators can accelerate deployment, but they also take economics and mediate the
              customer relationship. Publicly, there is no CAC, payback, or sales-cycle disclosure. The best proxy is
              workflow complexity. Collaborative robot purchases usually require application scoping, risk assessment,
              integration, and training, which implies slower enterprise-style selling rather than impulse or self-serve
              demand. IFR’s 2026 update showing U.S. industrial robot installations up 11% to 38,000 units in 2025 is
              encouraging for underlying demand, but it does not solve the Elite-specific question of conversion
