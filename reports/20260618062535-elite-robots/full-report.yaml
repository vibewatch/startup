  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The case for Elite is not imaginary. Official company materials support a real installed footprint, broad
              partner coverage, multiple product lines, and evidence of large-volume orders. Customer and partner proof
              across Europe, Asia, and North America also suggests that the product is commercially relevant rather than
              purely promotional. Layered on top is a favorable category backdrop: collaborative robots remain a growth
              market, and many of Elite’s disclosed applications—assembly, machine tending, palletizing, and
              inspection—align with the highest-penetration use cases in public cobot research. The anti-thesis is
              stronger than for a normal private growth company, however, because valuation cannot be anchored by public
              revenue or margin disclosure and because the 2026 injunction creates an explicit legal discount on future
              European growth. Investors are therefore underwriting not just automation demand, but also remediation
              credibility, partner retention, and whether management can convert scale signals into durable economics
              without a public trust failure.
            claimRefs:
              - CV001
              - CV002
              - CV003
