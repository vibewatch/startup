        title: Revenue Streams, Pricing Model, and Recognition Shape
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a hardware-first revenue model. Elite’s official pages sell collaborative robot
              arms, application packages, and deployment support rather than a stand-alone software subscription.
              Reseller pages reinforce that framing by listing individual models with arm-level unit prices: EC63,
              EC612, CS63, and CS612 all appear with public dollar values, while the broader MachineToolProducts catalog
              lists the heavier CS620 as well. The revenue implication is straightforward: public monetization evidence
              is per-unit, per-model, and project-like, not ARR-like. There may well be services, peripherals, partner
              margin share, and support contracts layered on top, but no reviewed public source breaks out revenue mix.
              That also means revenue recognition is likely closer to shipment, installation, or project milestones than
              to smooth recurring software revenue. This does not make the model unattractive, but it does mean quality
              of revenue cannot be treated like SaaS without direct company disclosure.
