  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Elite Robots should be evaluated inside collaborative robots, not inside the entire industrial-automation
              stack. Its official product surfaces are robot arms, teach pendants, and application-led workcells rather
              than complete fixed-line factories or software-only automation. That means the included spend is the
              collaborative workcell itself: arm, controller, safety configuration, gripper/tooling, integration labor,
              and support. The excluded spend is just as important. Fixed industrial robots, AMRs, vision-only software,
              and manual labor that never faces an automation buying decision should not be added to Elite’s core TAM.
              The company’s own application pages broaden the market beyond one narrow SKU: palletizing, assembly, and
              machine tending each imply different process economics and buyer needs. The real status quo substitutes
              are manual operators, legacy hard automation, and incumbent cobot brands sold through local integrators.
              That framing matters because Elite is not selling a generic robotics future; it is selling a specific
              collaborative-workcell replacement decision against those alternatives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
