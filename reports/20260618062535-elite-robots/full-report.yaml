  foundingLocation: Suzhou, China
  headquarters: Suzhou, China (HQ and primary manufacturing)
  productSummary: >-
    Collaborative robotic arms (cobots) in the CS series (3–30 kg payload, 6 models), EC series, CP collaborative
    palletizer, CSA series, and 5-axis CSH series, with a proprietary controller OS, teach pendant, and virtual
    simulation platform.
  customerFocus: >-
    Small and medium-sized enterprises and large manufacturers in automotive, electronics, food & beverage, logistics,
    e-commerce, and general manufacturing; served primarily through system integrators and OEM partners globally.
  businessModel: >-
    Hardware-centric cobot manufacturer selling directly and via a global integrator/OEM distribution network; revenue
    driven by cobot unit sales plus accessories (end effectors, teach pendants) and after-sales support.
  stage: Series D
