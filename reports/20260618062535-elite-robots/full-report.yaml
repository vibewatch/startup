      - number: '1.5'
        title: Milestones, Globalization, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Elite Robots’ disclosed milestone arc is unusually detailed on product and branch expansion. The
              about-page chronology states that the company shifted from industrial robots to cobots and developed the
              alpha EC66 in August 2017, reached EC-series mass production in July 2019, tested the first CS66 prototype
              in August 2020, and crossed 1,000 deployed units in December 2020. It established a first overseas office
              in Knoxville, Tennessee in April 2021, opened the current 11,000 m² Suzhou manufacturing and R&D center in
              September 2021, opened Bavaria and Nagoya offices in mid-2022, released high-payload CS620 and CS625
              models in 2023, rolled out IP68-certified and specialized variants later that year, and released the
              ERP400S pendant globally in February 2024. A 2023 company post also disclosed a 3,000-unit order from a
              major Chinese corporation, which—if not cancelled—supports real commercial momentum beyond pilot
              deployments. The principal negative milestone is legal: in February 2026 Teradyne Robotics sued Elite
              Robots Deutschland in Germany, and on April 21, 2026 the Regional Court of Hamburg issued a preliminary
              injunction against the German subsidiary. Reporting says the injunction requires Elite Robots Germany to
              stop offering or distributing allegedly infringing software and disclose customer information; Teradyne
              also alleged similarities to Universal Robots’ PolyScope-like interface and raised safety-setting
              concerns. The order is not a final ruling, but it creates immediate channel, reputational, and compliance
              risk in Europe, especially because no public Elite Robots response was identified in reviewed sources.
