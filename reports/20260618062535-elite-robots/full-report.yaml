      - number: '8.2'
        title: Financing Context, Price Discovery Limits, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The public financing picture is meaningful but incomplete. Tracxn shows Elite as a Series D company
              founded in 2016 with $142 million raised across six rounds, with the latest round dated March 2026. That
              is enough to establish that Elite has attracted real institutional capital and has stayed financeable
              through multiple stages. It is not enough to establish an investable price today. The same source obscures
              the round-by-round post-money fields, and public materials do not provide audited revenue, gross margin,
              burn, backlog conversion, working-capital profile, or liquidation preferences. Even the employee count
              visible on tracker pages appears inconsistent with the company’s stated international office footprint and
              partner network. Because private pricing is undisclosed, entry discipline has to focus on what is missing:
              current ARR or hardware revenue run-rate, gross margin by robot family, warranty reserve behavior,
              legal-remediation budget, and the cap-table waterfall that would govern returns in any downside or
              flat-exit scenario.
            claimRefs:
              - CV008
