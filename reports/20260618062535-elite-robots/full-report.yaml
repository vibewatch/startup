      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Collaborative-robot buying is multi-threaded. The end user is the operator or technician working beside
              the cell; the technical specifier is often the automation engineer, manufacturing engineer, or system
              integrator; and the payer usually sits in operations, plant leadership, or a capex committee rather than
              on the shop floor. Elite’s worldwide and partner pages imply that the company often reaches these buyers
              through local partners and integrators even where it also maintains branch offices. Public application
              pages also imply differentiated buyer motion by workflow. Assembly cases emphasize fast changeovers and
              smaller batches; machine tending emphasizes uptime and labor redeployment; palletizing emphasizes heavy
              lifting and end-of-line ROI. Across vendors, the adoption path tends to follow the same stages: identify a
              repetitive workflow, run a proof of concept, complete a risk assessment, integrate the cell, train
              operators, then support the line after go-live. Vendors with deeper service networks and more capable
              integrators therefore gain an advantage even before list price is discussed.
            claimRefs:
