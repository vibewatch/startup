            body: >-
              This is the most opaque part of the public record, but several facts still point in the same direction.
              Elite manufactures physical robot arms, runs a large Suzhou site, references a second manufacturing
              location, and sells through channels that almost certainly expect margin participation. Market research
              sources say hardware still dominates collaborative-robot economics and that high upfront robot and
              integration cost remains a core industry restraint. Combined, those signals imply a cost stack driven by
              components, manufacturing overhead, inventory, outbound logistics, service readiness, and distributor
              economics more than by pure software gross margin. Public reseller pricing also shows a meaningful premium
              for the newer CS line over the older EC line at comparable payloads, which may indicate product-mix
              headroom if BOM inflation is controlled. But no public source discloses actual COGS, gross margin,
              warranty cost, receivables cadence, or inventory turns. So the right conclusion is not that margins are
