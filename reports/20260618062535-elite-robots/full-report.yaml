  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview and Investment Implication
        blocks:
          - type: paragraph
            body: >-
              Elite’s risk stack is not a generic “private hardware company” set of caveats. The lead risk is legal and
              trust-related because the Hamburg preliminary injunction is already operationally relevant in Germany and
              is paired with allegations that Elite copied Universal Robots software and allowed safety settings to be
              disabled. That alone would be serious. It becomes more serious when combined with a channel-dependent
              go-to-market model, because distributors and system integrators are part of the potential enforcement path
              and part of the commercial moat. Next are manufacturing and geopolitical risks. Elite’s public
              manufacturing narrative remains China-centered, which helps cost structure and control but exposes the
              company to trade friction, export-rule complexity, and perception risk in Western industrial accounts.
              Financial opacity is the final amplifier: because revenue, burn, cash, and reserve posture are
              undisclosed, investors cannot easily judge whether management has enough balance-sheet flexibility to
              absorb legal remediation, channel disruption, or longer sales cycles. The risk conclusion is therefore not
              just “watch the lawsuit,” but “assume risk transmission across legal, commercial, and financing layers.”
