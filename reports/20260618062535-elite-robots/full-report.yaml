      - number: '3.3'
        title: Capability, Distribution, and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              Capability breadth in this market now extends beyond payload charts. UR’s public positioning emphasizes
              deployability, service, and ecosystem tooling around the arm. ABB’s documentation makes safety methodology
              part of the product. FANUC sells ease of deployment through pre-engineered solutions and low-maintenance
              messaging. Techman pushes integrated AI vision. KUKA’s advantage is broader automation reach. Elite is
              strongest when the buying criteria overweight payload-per-dollar and rugged industrial positioning, but
              weaker when the buyer prioritizes global references, application-certified tooling ecosystems, or
              institutional trust. Distribution power is similarly uneven. Elite’s 100-plus partners across roughly 40
              countries are meaningful for a challenger, yet UR’s 800-plus distributors and integrators across 60-plus
              countries create a different order of magnitude in local support density. In cobots, that matters because
