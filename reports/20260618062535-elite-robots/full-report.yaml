      - number: '3.2'
        title: Competitor Profiles, Pricing, and Strategic Direction
        blocks:
          - type: paragraph
            body: >-
              Universal Robots still sets the reference line for category scale. The A3 profile attributes more than
              50,000 installed cobots and an 800-plus distributor and integrator network across more than 60 countries
              to UR, while reseller pricing puts the UR5e at $36,515 with 5 kg payload and 850 mm reach. Doosan offers a
              different signal: Reuters described a vendor large enough to go public at a 1.69 trillion won valuation
              while still losing money at the operating line, which suggests competitive scale does not eliminate margin
              pressure. ABB and FANUC sell on institutional trust, safety, and operating reliability, not just hardware.
              FANUC’s CRX family claims 12 models from 3 kg to 50 kg and eight years of zero maintenance. Techman
              competes through integrated AI vision. Elite’s publicly listed reseller references show why it can still
              win attention: the CS66 at $24,100 and CS620 at $41,400 position the company as an aggressive value
              challenger against Western peers rather than a premium incumbent. That strategic direction is coherent,
              but it shifts competitive burden onto service quality and trust.
