        title: Public Traction, Funding History, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Elite’s public traction signal is operational scale: more than 10,000 deployed units and support in
              roughly 40 countries. Public capital formation is directionally strong but numerically messy. Tracxn says
              the company has raised about $142 million across six rounds with a Series D dated March 2026; CB Insights
              reports roughly $160.29 million across eight rounds and also shows a valuation datapoint. That discrepancy
              matters because capital-adequacy analysis starts from historical inflows. Even if the lower figure is
              correct, Elite has raised meaningful capital for a private hardware company. The harder question is what
              remains. No reviewed public source discloses current cash, monthly burn, runway, debt, or project-finance
              obligations. The visible manufacturing footprint, R&D intensity, global offices, and possible legal costs
              in Germany all point to real cash demands. Public evidence therefore supports the conclusion that Elite
              has raised substantial capital, but not the conclusion that current capital is sufficient.
