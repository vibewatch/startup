      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are flexible automation, labor scarcity, safer human-robot interaction, and
              the need to change over smaller production batches without rebuilding an entire line. Those factors appear
              consistently across market reports and competitor pages. But the constraints are equally real. Hardware
              still dominates today’s cost stack, so buyers must justify arm cost, tooling, safety work, and integration
              effort before the first production cycle runs. SMEs feel that pain most sharply, while large manufacturers
              impose additional validation and procurement burdens. Europe adds another layer: collaborative deployment
              is anchored in risk assessment and safety standards, which makes unresolved software or safety disputes
              commercially meaningful. Elite’s April 2026 German injunction therefore matters beyond litigation
              headlines; it creates procurement friction in a region where compliance posture is part of the buying
              decision. Finally, the biggest diligence gaps are not on the size of the broad cobot story but on Elite’s
              own penetration within it. Public sources do not disclose vertical mix, direct-versus-channel revenue
              share, or dollar SOM, so any underwriting model still needs primary company data before market sizing
              becomes investable.
