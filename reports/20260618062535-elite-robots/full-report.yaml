        title: Financial Verdict on Revenue Quality, Margin Path, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The public financial story is mixed. On the positive side, Elite has real products, public price points,
              visible deployment scale, manufacturing capacity, and evidence of enough financing to build beyond
              prototype stage. On the negative side, almost every number that would matter in underwriting—revenue,
              gross margin, burn, runway, debt, realized discounts, warranty burden, partner concentration—is missing.
              Peer signals do not fully rescue the picture. Doosan’s public losses and Teradyne’s description of
              robotics as early-stage and cyclical both suggest that scale alone does not eliminate margin pressure. The
              injunction in Germany adds an extra source of potential financial drag without any public reserve
              estimate. The right verdict is therefore not bearish on demand, but cautious on investability: revenue
              quality looks more transactional than recurring, margin path is impossible to verify publicly, and capital
              intensity plus legal uncertainty make management data mandatory before any high-conviction financial
              judgment.
