      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Public collaborative-robot market sizing is directionally bullish but numerically inconsistent. Mordor and
              MarketsandMarkets place the current market in the roughly $1.4-$1.9 billion range with sub-21% CAGR
              assumptions, while Market.us and Allied publish much larger long-range outcomes with CAGRs above 30%.
              Those divergences are too wide to ignore, so the chapter preserves them instead of selecting one
              flattering estimate. For Elite specifically, the more useful question is not the broadest cobot TAM but
              the company’s reachable subset. Elite’s current catalog and application pages point to a SAM centered on
              assembly, machine tending, and palletizing workloads in medium-payload industrial environments. Its 3-30
              kg CS lineup and palletizing pitch move it above the light-duty center of the market, which may be
              strategically attractive if heavier payload categories keep growing faster than sub-5 kg volumes. Public
              evidence supports a layered view: broad cobot TAM, narrower industrial SAM, and an SOM that is visible in
              units and countries but not convertible into revenue dollars because Elite does not disclose revenue,
              ASPs, or software/service mix.
