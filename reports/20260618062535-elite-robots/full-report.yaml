      - number: '8.5'
        title: Exit Readiness, Kill Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Elite does not currently read like an IPO-ready company from a public-disclosure perspective. There is no
              public filing trail comparable to a late-stage pre-IPO issuer, no disclosed audited revenue set, and no
              visible evidence that litigation overhang has been fully ring-fenced. That does not mean exit paths are
              absent. A strategic buyer could value Elite for product breadth, China-centered manufacturing capability,
              and global channel reach if the software-trust issue is remediated; later-stage private investors could
              also continue to finance the company if revenue quality is stronger than the public record suggests. But
              those are conditional paths, not underwritten outcomes. The practical diligence stance is therefore
              simple: no firm valuation conviction without cap-table disclosure, current trading metrics,
              litigation-remediation evidence, and proof that major partners and reference customers remain active after
              the Hamburg event. If any of those break negatively, the thesis changes from “track” to “avoid until
              reset.”
            claimRefs:
              - CV002
              - CV003
