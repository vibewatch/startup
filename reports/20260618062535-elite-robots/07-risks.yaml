  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold or event
      - Action implication
    rows:
      - [Hamburg injunction expands, Final ruling or broader EU enforcement, Any confirmed sales ban expansion beyond current scope, Shift stance toward avoid or demand sharp entry discount]
      - [Safety allegation confirmed, Regulator action or independent audit validates disable-setting concern, Any formal authority action or forced recall-level remediation, Treat as thesis-break until resolved]
      - [Channel deterioration, Distributor or OEM exits become visible, Multiple named partners stop carrying Elite or freeze pipeline, Reduce growth assumptions materially]
      - [Capital strain, New financing needed without economics disclosure, Raise announced before clarity on legal or revenue posture, Increase dilution risk and valuation caution]
      - [Manufacturing disruption, Delivery delays or trade restriction effects become public, Missed shipments or market-access interruption, Increase downside probability in base and bear cases]
    notes: Kill criteria focus on observable public events that would change underwriting, not on abstract concerns alone.
    claimRefs: [CR001, CR002, CR003, CR004, CR034, CR035, CR036, CR037, CR038, CR039, CR040]
