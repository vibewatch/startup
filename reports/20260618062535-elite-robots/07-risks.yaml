      - [Potential partner or distributor enforcement, Europe primarily, UR said it planned action against distributors and partners, Medium, High, Low, High, Request current partner retention and legal notice status]
      - [Privacy and data-compliance website obligations, Global website footprint, Privacy and cookie policies exist on live site, Low, Medium, Moderate, Medium, Request data-map and controller/processor architecture]
    notes: Legal and safety items are ranked by current ability to impair commercial activity rather than by eventual damages size alone.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR016, CR017]
