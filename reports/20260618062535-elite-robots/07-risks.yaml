      whyItMatters: This is the most severe current risk and cannot be fully underwritten from third-party reporting alone.
      diligencePath: Request legal files, external counsel memo, and engineering remediation workstream documents.
      relatedQuestionRefs: [QR003, QR004, QR025]
      relatedTableRefs: [TR001]
