      severity: material
      topic: concentration-gap
      missingEvidence: Top-partner, top-customer, and region concentration data plus channel SLA metrics.
      whyItMatters: Channel dependence is central to both growth and downside transmission.
      diligencePath: Request partner revenue concentration, backlog concentration, and partner churn statistics.
