  topStrengths:
    - 10,000+ units deployed across 40+ countries demonstrates real commercial traction in the cobot market
    - >-
      Cost-effective CS-series cobot line with IP68 rating and broad payload range (3–30 kg) addresses multiple
      verticals
    - Vertically integrated R&D comprising ~40–50% of workforce with 400+ IP assets and 100k-hour MTBF specification
    - Series D funding ($142M total) and 7 global offices provide capital and market-access infrastructure
    - Growing cobot market (18–20% CAGR) with China's policy tailwind and global manufacturing automation demand
  topRisks:
    - >-
      April 2026 Hamburg preliminary injunction for UR software copyright infringement restricts German market;
      potential for expanded litigation and partner/distributor liability exposure
    - >-
      Safety authority notifications in Germany, Denmark, and US regarding a feature allowing safety-setting disablement
      pose regulatory and product-liability risk
    - >-
      Revenue, margins, and burn rate are entirely undisclosed; capital adequacy and runway cannot be assessed from
      public information
    - >-
      Chinese origin raises geopolitical friction in EU and US markets amid escalating technology-export restrictions
      and trade tensions
    - >-
      Dependence on integrator/OEM channel creates concentration risk and limits direct customer relationships and
      retention visibility
  unresolvedGaps:
    - >-
      Revenue, ARR, gross margin, and unit-level economics remain undisclosed; without financials, valuation support and
      capital adequacy cannot be assessed
    - >-
      Final resolution of the Hamburg copyright case and any broader litigation by Teradyne against Elite Robots
      distributors/partners is unknown
    - >-
