- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Revenue / bookings / ARR
    - Prevents underwriting revenue quality or growth durability
    - Request monthly revenue, bookings, and backlog by model and region
  - - Gross margin and BOM
    - Prevents view on unit economics and pricing power
    - Request margin by model plus component cost bridge
  - - Cash / burn / runway
    - Prevents capital-adequacy conclusion
    - Request current cash balance, monthly burn, and 18-month plan
  - - Distributor economics
    - Prevents net-realization and support-cost modeling
    - Request channel discounts, partner mix, and service obligations
  - - Legal reserve / Europe order impact
    - Prevents estimating injunction-related financial drag
    - Request legal budget, reserve assumptions, and Europe bookings trend
  - - Debt / inventory / receivables aging
    - Prevents working-capital and covenant analysis
    - Request debt schedule, inventory aging, and receivables aging
  notes: These gaps are the minimum package needed to move from descriptive public research to investable financial diligence.
