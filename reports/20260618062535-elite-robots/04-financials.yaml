  rows:
  - - Robot-arm hardware
    - Sale of collaborative robot arms by model
    - Per arm / per cell
    - Publicly visible through reseller list pricing
    - Transactional, shipment-based revenue likely dominates
    - Request revenue by model and channel
  - - Application packages / workcells
    - Palletizing, assembly, and tending deployments
    - Per project / per deployed cell
    - Implied by application pages, not quantified
    - Can raise ASP but may lengthen sales and revenue recognition
    - Request average project scope and attach rate
  - - Peripherals / accessories
    - Teach pendants, tooling, peripherals, spares
    - Per order / bundle
    - Publicly implied, not separately priced in reviewed evidence
    - Could improve margin if attach is strong; currently unobservable
    - Request accessory revenue as % of bookings
  - - Support / partner enablement
    - After-sales support and channel services
    - Service / support contract
    - Support network is public; revenue line is not
    - Potential recurring element but no public disclosure
    - Request service revenue, renewals, and warranty cost
  - - Software / analytics
    - No separate public pricing found
    - Unknown
    - No ARR or subscription evidence found
    - Weakens any SaaS-style quality argument
    - Confirm whether any software subscription exists and how it is recognized
  notes: Only hardware list pricing is directly visible; other revenue streams are inferred from official product and support surfaces rather than separately disclosed financial lines.
