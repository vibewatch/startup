- id: public-traction-and-capital-adequacy
  title: Public Traction, Funding History, and Capital Adequacy
  body: 'Elite’s public traction signal is operational scale: more than 10,000 deployed units and support in roughly 40 countries. Public capital formation is directionally strong but numerically messy. Tracxn says the company has raised about $142 million across six rounds with a Series D dated March 2026; CB Insights reports roughly $160.29 million across eight rounds and also shows a valuation datapoint. That discrepancy matters because capital-adequacy analysis starts from historical inflows. Even if the lower figure is correct, Elite has raised meaningful capital for a private hardware company. The harder question is what remains. No reviewed public source discloses current cash, monthly burn, runway, debt, or project-finance obligations. The visible manufacturing footprint, R&D intensity, global offices, and possible legal costs in Germany all point to real cash demands. Public evidence therefore supports the conclusion that Elite has raised substantial capital, but not the conclusion
    that current capital is sufficient.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  - CI037
  tableRefs:
  - TI005
- id: financial-verdict-and-blockers
  title: Financial Verdict on Revenue Quality, Margin Path, and Diligence Blockers
  body: 'The public financial story is mixed. On the positive side, Elite has real products, public price points, visible deployment scale, manufacturing capacity, and evidence of enough financing to build beyond prototype stage. On the negative side, almost every number that would matter in underwriting—revenue, gross margin, burn, runway, debt, realized discounts, warranty burden, partner concentration—is missing. Peer signals do not fully rescue the picture. Doosan’s public losses and Teradyne’s description of robotics as early-stage and cyclical both suggest that scale alone does not eliminate margin pressure. The injunction in Germany adds an extra source of potential financial drag without any public reserve estimate. The right verdict is therefore not bearish on demand, but cautious on investability: revenue quality looks more transactional than recurring, margin path is impossible to verify publicly, and capital intensity plus legal uncertainty make management data mandatory before
    any high-conviction financial judgment.'
  claimRefs:
