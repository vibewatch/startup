- id: TI004
  title: Unit economics and cost-structure drivers
  columns:
  - Driver
  - Public evidence
  - Likely effect
  - What remains unknown
  rows:
  - - Hardware-dominant market mix
    - Allied says hardware dominated the cobot component stack
    - Supports lower gross-margin profile than software-heavy businesses
    - Actual BOM and assembly cost by model
  - - Large manufacturing footprint
    - 11,000 m² Suzhou site plus second manufacturing site
    - Raises fixed-cost absorption and working-capital needs
    - Utilization rate and depreciation burden
  - - Channel-led distribution
    - Partner network and regional offices are public
    - Adds margin sharing and support overhead
    - Realized partner commission and support cost
  - - CS-vs-EC pricing premium
    - Newer CS line priced above EC line at equal payloads
    - Could improve mix and margin if BOM premium is smaller than price premium
    - Whether higher protection and feature set increase cost equally
  - - High upfront integration burden
    - Market sources flag integration cost as industry restraint
    - Can slow conversion and require presales engineering
    - Elite-specific presales labor and installation cost
  notes: This table mixes direct facts and inference. It is a cost-structure map, not a disclosed company P&L.
