callouts:
- calloutType: risk
  title: This is a hardware diligence problem, not a SaaS one
  body: Public evidence points to shipment-driven, channel-mediated hardware economics. That means missing gross margin, discounting, inventory, and runway data matter more than missing ARR-style KPIs.
  claimRefs:
  - CI003
  - CI010
  - CI018
  - CI021
- calloutType: assumption
  title: List pricing is only a starting point
  body: Elite’s public reseller prices are useful anchors, but realized economics may differ materially once distributor margin, tooling, installation, and warranty cost are included.
  claimRefs:
  - CI004
  - CI009
  - CI020
