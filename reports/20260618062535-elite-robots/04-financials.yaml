company:
  name: Elite Robots
chapter:
  number: 4
  title: Financials
  summary: Elite Robots shows credible commercial traction and publicly visible list pricing, but the public record remains deeply incomplete on revenue, margin, burn, and runway. Reseller references support a hardware-led monetization model with Elite priced well below at least one reviewed UR benchmark, while manufacturing footprint, partner-led distribution, and the April 2026 German injunction all point to a capital-intensive operating model whose adequacy cannot be judged without private financial disclosure.
sections:
- id: revenue-model-and-public-pricing
  title: Revenue Streams, Pricing Model, and Recognition Shape
  body: 'Public evidence shows a hardware-first revenue model. Elite’s official pages sell collaborative robot arms, application packages, and deployment support rather than a stand-alone software subscription. Reseller pages reinforce that framing by listing individual models with arm-level unit prices: EC63, EC612, CS63, and CS612 all appear with public dollar values, while the broader MachineToolProducts catalog lists the heavier CS620 as well. The revenue implication is straightforward: public monetization evidence is per-unit, per-model, and project-like, not ARR-like. There may well be services, peripherals, partner margin share, and support contracts layered on top, but no reviewed public source breaks out revenue mix. That also means revenue recognition is likely closer to shipment, installation, or project milestones than to smooth recurring software revenue. This does not make the model unattractive, but it does mean quality of revenue cannot be treated like SaaS without direct
    company disclosure.'
  claimRefs:
