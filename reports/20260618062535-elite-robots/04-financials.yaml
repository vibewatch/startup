- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Exact diligence ask
  rows:
  - - Average selling price (ASP) by model
    - Partially visible from reseller pages only
    - medium
    - Needed to translate units into revenue and gross profit
    - Request shipped ASP by model and region over last 12 months
  - - Channel discount / distributor margin
    - Not public
    - low
    - Determines net realized revenue below list price
    - Request distributor agreements and average gross-to-net bridge
  - - Gross margin by model
    - Not public
    - low
    - Core test of hardware economics and premium-line mix
    - Request gross margin and BOM by model family
  - - Warranty / field-service cost
    - Not public
    - low
    - Can consume margin quickly in robotics deployments
    - Request warranty reserve, field-failure rate, and service cost per installed unit
  - - Sales cycle / payback / CAC
    - Not public
    - low
    - Tests GTM efficiency and capital needs
    - Request CAC, sales-cycle duration, and payback by channel and region
  notes: “Not public” means reviewed sources did not disclose the metric; low confidence reflects evidence absence rather than a negative business judgment.
