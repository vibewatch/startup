evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      Registered entity address and legal-headquarters documentation resolving Suzhou-versus-Shanghai public
      descriptions.
    whyItMatters: >-
      Entity jurisdiction affects corporate registry checks, subsidy tracing, litigation venue, and tax/incentive
      analysis.
    diligencePath: Obtain the business license, corporate registry extract, and shareholder register for the operating entity.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Primary documentation for the latest post-money valuation and round-by-round cap-table terms.
    whyItMatters: >-
      Valuation stance, dilution, liquidation stack, and investor rights cannot be judged from conflicting secondary
      databases alone.
    diligencePath: Request the latest financing documents, cap table, and any board-approved 409A or comparable valuation memo.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: debt
    missingEvidence: Any debt facilities, venture loans, credit lines, equipment financing, or secondary transactions.
    whyItMatters: Hidden senior claims or founder liquidity can materially change downside protection and financing need.
    diligencePath: Request a debt schedule, bank facility summary, and board minutes covering secondary sales or refinancing.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, run-rate, gross margin, and customer concentration data.
    whyItMatters: Commercial traction cannot be converted into investability or valuation judgment without basic operating metrics.
    diligencePath: Request monthly ARR/revenue reporting, customer concentration, and board KPI packs.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee count and geography/function breakdown.
    whyItMatters: Headcount is a required scale metric and helps test burn, R&D intensity, and international operating leverage.
    diligencePath: Request HRIS headcount by location and function plus the last 12 months of hiring/departure data.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full board list, committee structure, and investor governance rights.
    whyItMatters: Governance strength and key-person mitigation cannot be assessed from the sparse public record.
    diligencePath: Request board roster, board observer rights, reserved matters schedule, and founder employment agreements.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: litigation-response
    missingEvidence: An on-record company response or court filing showing Elite Robots’ defense posture.
    whyItMatters: >-
      Without the company side, investors cannot distinguish between a narrow preliminary dispute and a deeper
      software-compliance issue.
    diligencePath: Request counsel summary, court filings, and management's written incident response for the German case.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map completeness
    missingEvidence: >-
      A complete investor list with ownership percentages, board rights, and round-by-round entry/exit data for the
      stakeholder or investor map.
    whyItMatters: >-
      The public map is only partial, so control dynamics, liquidation preferences, and investor concentration cannot be
      assessed from published evidence.
    diligencePath: >-
      Request the cap table, financing summary, and side-letter schedule that maps each investor to ownership and
      governance rights.
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO019
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: som-revenue
    missingEvidence: Elite Robots does not publicly disclose annual revenue, ASP, or software attach rate by product line.
    whyItMatters: >-
      Without realized revenue or ASP data, public sources cannot turn deployed units into a credible dollar SOM or
      gross-profit pool.
    diligencePath: Request the last 24 months of bookings, shipments, and revenue by model, region, and channel partner.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: vertical-mix
    missingEvidence: >-
      No public source breaks Elite’s installed base or bookings by automotive, electronics, logistics, or food
      customers.
    whyItMatters: >-
      Vertical mix determines how much of the broad cobot TAM is actually reachable and whether customer concentration
      skews the SAM.
    diligencePath: Ask management for installed-base by vertical, top-20 accounts, and pipeline by application family.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: material
    topic: tams
    missingEvidence: Third-party market publishers disagree sharply on current size and forward CAGR for collaborative robots.
    whyItMatters: >-
      Valuation work should not anchor on a single inflated TAM when reputable vendors publish materially different
      market bounds.
    diligencePath: >-
      Reconcile methodologies with a bottoms-up shipment model using importer, integrator, and public-company segment
      disclosures.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
  - type: access-blocked
    severity: minor
    topic: ifr-country-breakout
    missingEvidence: IFR holds the most detailed installation and application tables behind paid World Robotics products.
    whyItMatters: >-
      The public summary confirms direction but not the country-by-application detail needed for a precise geographic
      SAM build.
    diligencePath: >-
      Obtain the World Robotics industrial-robots dataset or have a channel partner with access export the relevant
      country/application tables.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: >-
      No public source reveals Elite win/loss rates against Universal Robots, FANUC, ABB, or Doosan by region or
      application.
    whyItMatters: >-
      Without actual win-rate data, public positioning and price comparisons can overstate or understate Elite’s real
      competitive strength.
    diligencePath: Request CRM win/loss data by competitor, region, payload class, and application family for the last 12 months.
    relatedQuestionRefs:
      - QP023
      - QP025
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Public sources provide list or reseller pricing, but not realized discounts, bundle terms, service attach, or
      integrator markup.
    whyItMatters: Competitive pricing conclusions are fragile if realized pricing differs materially from public list references.
    diligencePath: Obtain recent quotes, discount schedules, and distributor margin structures for Elite and two major peers.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: No public source breaks Elite partner revenue by distributor or integrator concentration.
    whyItMatters: Channel concentration can amplify switching risk and weaken any claimed distribution moat.
    diligencePath: Request top-20 channel partners by bookings, support incidents, and renewal contribution.
    relatedQuestionRefs:
      - QP018
      - QP025
  - type: stale
    severity: material
    topic: europe-litigation-outcome
    missingEvidence: >-
      Reviewed public sources show the April 2026 injunction but not any final judgment, settlement, or distributor
      response update.
    whyItMatters: Trust and regulatory posture could improve or worsen materially depending on what happened after the injunction.
    diligencePath: >-
      Recheck German legal dockets, distributor statements, and company responses before underwriting European
      expansion.
    relatedQuestionRefs:
      - QP015
      - QP022
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: No public source discloses Elite’s annual revenue, gross margin, or operating burn.
    whyItMatters: >-
      Without core financial statements, no outside investor can underwrite revenue quality, margin trajectory, or
      runway with confidence.
    diligencePath: >-
      Request monthly revenue, gross margin, opex, and cash-balance reporting for the last 24 months plus current
      forecast.
    relatedQuestionRefs:
      - QI002
      - QI020
      - QI025
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: >-
      Realized discounts, distributor margin, integrator markup, warranty burden, and service attach are absent from
      public evidence.
    whyItMatters: List pricing can materially overstate net realized revenue and gross profit in a partner-led hardware model.
    diligencePath: >-
      Obtain recent quote sheets, distributor agreements, warranty reserve data, and service revenue contribution by
      model.
    relatedQuestionRefs:
      - QI007
      - QI012
      - QI016
  - type: conflicting-data
    severity: material
    topic: funding-totals
    missingEvidence: Tracxn and CB Insights disagree on lifetime funding, round count, and implied chronology.
    whyItMatters: >-
      Capital adequacy analysis requires a precise cash-in history and a clear view of whether later rounds were primary
      or included secondaries.
    diligencePath: Reconcile the cap table, signed financing documents, and bank receipts for each round since 2021.
    relatedQuestionRefs:
      - QI018
      - QI019
  - type: stale
    severity: material
    topic: litigation-costs
    missingEvidence: Public injunction coverage does not quantify any legal reserve, settlement exposure, or channel disruption cost.
    whyItMatters: Even a manageable injunction can change runway if distributors pause orders or remediation work is expensive.
    diligencePath: >-
      Ask management for legal budget, distributor churn since April 2026, and any settlement or remediation reserve
      assumptions.
    relatedQuestionRefs:
      - QI022
      - QI025
  - type: missing-source
    severity: material
    topic: debt-runway
    missingEvidence: No primary public evidence discloses debt, project finance, covenant terms, or runway months.
    whyItMatters: >-
      A well-funded growth-stage hardware company can still face working-capital stress if cash conversion is slow or
      channel inventory builds.
    diligencePath: Request debt schedules, bank facilities, inventory aging, receivables aging, and monthly cash-burn bridge.
    relatedQuestionRefs:
      - QI020
      - QI021
  - type: private-evidence-only
    severity: material
