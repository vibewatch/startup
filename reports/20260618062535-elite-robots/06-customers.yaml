    approximationNotes: Ratings are analyst evidence-quality judgments based on public source richness rather than numerical scores supplied by the company.
    claimRefs: [CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU028, CU030]
  - id: FU004
    title: Retention visibility map
    type: flow
    layout: wide
    summary: Public customer data allows a path from deployment proof to qualitative durability signals, but breaks before true retention economics.
    data:
      nodes:
        - label: Deployment claims
          detail: 10k+ units, 40+ countries, and 100+ partners support breadth.
        - label: Named references
          detail: Shining 3D, MOOVALL, Abiman, TWT, and Otes provide identifiable proof.
        - label: Operational case studies
          detail: Salt-core, Gaotong, and Sentinel cases show workflow-level usage.
        - label: Expansion hints
          detail: Multi-cobot or multi-task cases imply some repeat or redeployment behavior.
        - label: Missing retention metrics
          detail: No public NRR, GRR, churn, renewal, contract length, or cohort table.
        - label: Diligence dependency
          detail: Customer-quality underwriting still depends on management data and channel analytics.
    approximationNotes: This figure uses a flow rather than a cohort because no supportable public retention percentages were found.
    claimRefs: [CU024, CU025, CU026, CU027, CU028, CU029, CU030]
