  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or partner
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome or proof quality
      - Limitation
    enumerationScope:
      coverage: partial
      basis: Rows cover the most supportable named customer, OEM, and distributor proof points visible in reviewed public sources as of the 2026 run date; Elite does not publish a complete customer roster.
    rows:
      - [Gaotong Machinery, End customer SME, Pick-and-place tapping and palletizing with up to four Elite cobots, Production use case, Strong workflow detail and expansion evidence, No contract value or fleetwide repeat-order data]
      - [North China automotive salt-core supplier, End customer manufacturer, EC66 plus 3D camera for salt-core production, Production use case, Strong operational detail including seven-month payback claim, Customer name withheld]
      - [Sentinel / QRobot cable inspection solution, OEM or partner-led solution, EC66 motion platform for AI-powered cable inspection, Production-style application proof, Good technical proof of inspection workflow fit, Counterparty brand is not a classic end-customer logo]
      - [Shining 3D GmbH, OEM-style partner/customer, Named testimonial on easy SDK integration and flexibility, Production relationship implied, Named reference with identifiable company, Outcome metrics not quantified]
      - [MOOVALL, Distributor, Named testimonial and product catalog for Elite robots, Production distribution relationship, Identifiable distributor with current site and Elite product links, Not a direct end-customer]
      - [Abiman Engineering, Distributor / integrator, Named testimonial on support and technology quality, Production channel relationship implied, Identifiable company and named individual, No unit-volume disclosure]
      - [TWT Robot Enterprise, Distributor, Named testimonial and Thailand contact presence, Production channel relationship implied, Named company with current site and testimonial, Mostly qualitative proof]
      - [Otes Elektronik, Distributor / automation partner, Named testimonial on support and responsiveness, Production channel relationship implied, Named company with active website, Mostly qualitative proof]
    notes: Reference quality is highest where case studies include workflow and outcome detail, and lower where testimonials are named but qualitative.
    claimRefs: [CU022, CU023, CU027, CU028, CU030, CU038]
  - id: TU004
    title: Retention / repeat usage / satisfaction table
    columns:
      - Metric
      - Public status
      - Segment
      - Confidence
      - Diligence ask
    rows:
      - [NRR, Not disclosed, Entire customer base, low, Request revenue retention by direct and channel cohort]
      - [GRR or churn, Not disclosed, Entire customer base, low, Request logo retention and replacement rates by region]
      - [Renewal cadence, Not disclosed, Distributor and OEM agreements, low, Request contract term and renewal structure for channel partners]
      - [Expansion evidence, Qualitative only through multi-task and multi-cobot case studies, Factory deployments, medium, Request repeat-order rate and attachment by account]
      - [Customer satisfaction, Qualitative named testimonials only, Channel references and OEM-style partners, medium, Request NPS or service-response KPIs]
    notes: This table intentionally distinguishes qualitative durability proof from absent quantitative retention disclosure.
    claimRefs: [CU024, CU025, CU026, CU027, CU028, CU029, CU030]
  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - [Land through distributors and SIs then expand into adjacent workflows, Heavy dependence on channel quality and incentives, Weak partners can reduce deployment quality and repeat purchase, Request top-partner revenue concentration and regional performance]
      - [OEM or embedded-solution reuse, A few OEM wins may overstate breadth if reuse is narrow, Could make pipeline look broader than end-customer diversity, Request OEM resale volumes and top-OEM dependence]
      - [Large bulk unit orders, Unnamed big orders can mask customer concentration, One delayed or cancelled program could distort growth optics, Request top-10 customer and order-book concentration]
      - [European growth through branch plus channel model, Hamburg injunction may slow partner or customer procurement in Europe, Can hurt expansion in a high-compliance market, Request region-by-region pipeline status after April 2026]
      - [Installed-base expansion into more tasks, Public proof is case-based not cohort-based, Difficult to translate workflow wins into durable revenue assumptions, Request repeat-order and cell-expansion statistics by account]
    notes: The chapter can support expansion logic qualitatively, but cannot quantify concentration without management data.
    claimRefs: [CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038, CU039, CU040]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Elite’s public customer journey runs through channel discovery, technical validation, deployment, and workflow expansion rather than through self-serve demand.
    data:
      items:
        - label: Distributor or SI introduces workflow
          detail: A local channel partner or direct regional office identifies a candidate task such as tending, inspection, or palletizing.
        - label: Technical validation
          detail: Payload, reach, EoAT, camera, and safety requirements are matched to an Elite configuration and local cell design.
        - label: Initial deployment
          detail: The customer installs the first cell with channel-led integration, training, and support.
        - label: Production proof
          detail: The line runs in production or a sustained use-case environment and generates operator, quality, or labor benefits.
        - label: Adjacent workflow expansion
          detail: The same factory or channel partner reuses the platform for more tasks, machines, or product lines.
        - label: Regional scaling
          detail: Repeat deployments, OEM reuse, or multi-country channel selling broaden the footprint if support quality holds.
    approximationNotes: The journey is generalized from partner descriptions, case studies, and named testimonials rather than from disclosed CRM funnel data.
    claimRefs: [CU001, CU002, CU003, CU015, CU018, CU031, CU032]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Public evidence narrows from broad deployment and geographic scale claims to a much smaller set of named, high-detail proof points.
    data:
      items:
        - label: Claimed deployed cobots
          value: 10000
        - label: Claimed countries served
          value: 40
        - label: Claimed channel partners
          value: 100
        - label: Named testimonial organizations reviewed
          value: 5
        - label: High-detail case studies reviewed
          value: 3
        - label: Public retention cohorts disclosed
          value: 0
    approximationNotes: Values are public-evidence counts and scale claims, not accounting records; the last stage is zero because no public NRR/GRR cohort data was found.
    claimRefs: [CU010, CU011, CU012, CU013, CU019, CU024]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Elite’s public proof is strongest on named references and workflow detail, weaker on quantified outcomes and retention visibility.
    data:
      columns: [Named identity, Workflow detail, Quantified outcome, Freshness, Direct end-customer quality]
      rows:
