      - [Branch footprint, Seven worldwide branches claimed, Current live partner material, Official partner page, medium, Supports hybrid direct-plus-channel model]
      - [Partner count, 100+ partners claimed, Current live partner material, Official partner page, medium, Channel depth is a growth lever and a dependency]
      - [Large bulk-order signal, "3,000 cobot units order mentioned", 2023 company blog, Official company blog, medium, Suggests ability to win high-volume demand but customer identity is undisclosed]
      - [Factory-level expansion proof, Up to four cobots at Gaotong Machinery, Current case study page, Official case study, medium, Indicates multi-task expansion inside one customer]
