  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: NRR, GRR, churn, renewal, and contract-length data by direct and channel cohort.
      whyItMatters: Without retention economics, installed-base breadth cannot be converted into durable revenue quality.
      diligencePath: Request cohort retention tables split by direct customers, distributors, and OEMs.
      relatedQuestionRefs: [QU016, QU017, QU025]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Top-10 customer and top-10 partner revenue concentration, plus exposure to any single large unit order.
      whyItMatters: Channel-heavy growth can mask concentration risk even when deployment count looks broad.
      diligencePath: Request customer concentration, partner concentration, and backlog concentration analyses by region.
      relatedQuestionRefs: [QU022, QU023, QU025]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: minor
      topic: zf-proof-gap
      missingEvidence: A direct public case-study or plant-level source confirming the claimed ZF Mexico deployment.
      whyItMatters: ZF would be a strong anchor logo if independently evidenced.
      diligencePath: Search plant news, customer case releases, or direct company references; otherwise request customer-reference permission from management.
      relatedQuestionRefs: [QU009]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: minor
      topic: revenue-quality-gap
      missingEvidence: Repeat-order rates, attachment of additional cells per account, and distributor reorder patterns.
      whyItMatters: The chapter can support expansion logic qualitatively but not quantify it.
      diligencePath: Request reorder curves and installed-base expansion statistics by account.
      relatedQuestionRefs: [QU018, QU021]
