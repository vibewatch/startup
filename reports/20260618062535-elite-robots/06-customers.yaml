    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Geography or channel signal
      - Typical use case
      - Strategic value
      - Public gap
    rows:
      - [Distributor channel, Buyer is local reseller or distributor; user is end factory; payer varies, Portugal Thailand Turkey and Korea references, Local sales support and deployment access, Expands geographic reach without full direct branch cost, Direct-vs-channel revenue split is undisclosed]
      - [System integrator channel, Buyer is SI or plant engineering through SI; user is factory operators, Partner page positions SIs as turn-key delivery experts, Machine tending palletizing welding and full cell integration, Critical for deployment success and application specificity, No partner productivity metrics or top-SI concentration]
      - [OEM-style customer, Buyer is equipment or solution company; user is downstream industrial customer, Shining 3D and Sentinel/QRobot evidence, Embedded inspection or packaged automation solutions, Supports repeatable indirect scale if OEM reuse is real, No disclosed OEM revenue share or unit mix]
      - [Industrial SME end user, Buyer is owner or plant operations; user is technicians and operators, Case studies in China and broader partner footprint, Tapping pick and place palletizing and dust-heavy production automation, Proof that Elite can solve real factory pain points, No public active-account count]
      - [Enterprise manufacturing program, Buyer is multi-site industrial group or major unit order customer, "3,000-unit order blog and global office footprint imply larger accounts", Bulk deployment and multi-plant standardization, Could materially accelerate installed base growth, Named customer concentration not disclosed]
    notes: Segmentation uses public proof types rather than booked revenue because Elite does not disclose customer-count or revenue-band data.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009]
