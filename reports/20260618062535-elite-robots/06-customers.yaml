company:
  name: Elite Robots
chapter:
  number: 6
  title: Customers
  summary: >-
    Elite Robots’ public customer evidence points to a channel-heavy global footprint rather than
    a concentrated direct-enterprise model: official materials describe 100+ partners, 40+
    countries, 10k+ deployed cobots, and a mix of distributors, system integrators, OEMs, and
    named customer references. The quality of proof is respectable for a private hardware company
    because it includes real named distributors, an OEM-style reference in Shining 3D, and several
    use-case case studies with operational detail. But the public record is still weak on the
    metrics investors would want most—active accounts, repeat purchase, NRR, GRR, churn, and
    top-customer concentration—so the customer story is strong on breadth and proof-of-use, weaker
    on durable revenue-quality disclosure.
sections:
  - id: segmentation-and-channel-structure
    title: Customer Base Segmentation by Buyer, User, Geography, and Channel
    body: >-
      Elite’s customer base is best understood through channel structure and workflow segmentation rather than through disclosed revenue cohorts. The company’s partner page says Elite works through distributors, system integrators, and OEMs, while also claiming 100-plus partners, 40-plus countries, seven worldwide branches, and more than 10,000 deployed cobots. That implies a blended model: a direct commercial presence in a handful of regions, amplified by local resellers and integrators that own technical pre-sales, cell design, installation, and support. The named public references reinforce that view. MOOVALL in Portugal, Abiman Engineering in South Korea, TWT in Thailand, and Otes in Turkey are all channel-like entities rather than large disclosed end-customer logos. Shining 3D looks closer to an OEM or embedded-technology customer. The result is a customer map where the economic buyer is often an industrial SME or plant operator, but the commercial relationship is frequently mediated by partners that shape win rates, deployment quality, and ongoing expansion potential.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-named-proof
    title: Adoption Trajectory, Deployment Evidence, and Named Customer Proof
    body: >-
      Public adoption proof is broad, if not fully financial. At the top line, Elite’s partner materials claim 10,000-plus deployed cobots across 40-plus countries, and the partner page invites channel partners to help break through 20,000 deployed units. That is not the same as active paying accounts, but it is still meaningful hardware deployment scale for a private cobot vendor. More importantly, Elite’s case studies provide real operational detail. A North China automotive supplier reportedly used an EC66 with 3D vision in salt-core production, achieved seven-month payback, and cut worker exposure to dust. Gaotong Machinery reportedly deployed up to four Elite cobots across tapping, pick-and-place, and palletizing tasks, with redeployment between machines taking less than half a day. The Sentinel cable-inspection case shows Elite acting as the motion platform underneath a vision-led quality-control cell. The named testimonials on the CS620 and partner pages also give fresh reference-quality support from Shining 3D, MOOVALL, Otes, Abiman, and TWT, although most are qualitative rather than outcome-heavy.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002
      - FU003
  - id: retention-durability-and-proof-quality
    title: Retention, Durability, Satisfaction, and Evidence Freshness
    body: >-
      The retention story remains the largest public-data gap in this chapter. Elite does not disclose NRR, GRR, churn, renewal rate, average contract term, or account-level expansion. That means no public reader can tell whether 10,000 deployed units came from a wide base of one-off projects or from a smaller group of repeat buyers and channel-led reorders. The best public substitutes are qualitative. Elite’s testimonials emphasize support, integration ease, quality, and service responsiveness; case studies show redeployment into more tasks and operational expansion within factories; and the company’s hardware context implies long useful life once a cell is installed. But none of that is a true cohort analysis. Evidence freshness also varies. The testimonials are useful because they are named and recent on live product pages, while some broader office or expansion articles are older and support channel existence more than customer durability. The right conclusion is that public customer proof is credible enough to establish real usage, but not yet strong enough to underwrite retention quality or revenue durability.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-concentration-and-procurement-risk
    title: Expansion Logic, Concentration Risk, and Procurement Friction
    body: >-
      Elite’s expansion logic is visible even without revenue disclosure. The public playbook appears to be land through a distributor, system integrator, or OEM-style relationship, prove out one workflow, and then expand into adjacent tasks such as tapping, inspection, tending, palletizing, or handling. Several case studies explicitly describe moving from one use case into multiple tasks or replacing older automation. That is the constructive side of the story. The risk side is channel dependence and procurement friction. Because so much of the public footprint is partner-mediated, Elite is exposed to distributor quality, SI competence, and the commercial health of local channel relationships. The 2026 Hamburg injunction matters here even for customers rather than just for legal analysis, because procurement teams and channel partners in Europe can interpret the software and safety allegations as a support or compliance risk. Investors therefore need to diligence whether the installed base is diversifying across many independent accounts or whether growth is being disproportionately driven by a narrower set of strong channel partners and a few large unit orders.
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
    tableRefs:
      - TU005
    figureRefs: []
tables:
