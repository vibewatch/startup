          values:
            - label: Strong
            - label: Strong
            - label: Moderate
            - label: Current
            - label: Strong
        - label: Sentinel QRobot case
          values:
            - label: Strong
            - label: Strong
            - label: Moderate
            - label: Current
            - label: Moderate
        - label: Shining 3D testimonial
          values:
            - label: Strong
            - label: Moderate
