            body: >-
              运营风险首先卡在集中度。公司公开材料和前文都指向两处制造锚点：苏州，以及郑州第二基地。这意味着相当一部分生产、备件流转和产品控制集中在中国。这种结构并不天然是坏事；它很可能带来成本和管控优势。但在美中技术摩擦升温的周期里，供应中断、发运延误、贸易政策变化，以及西方客户审视都会被放大。依赖风险也不止工厂。Elite
              很多项目要靠经销商、OEM
              和系统集成商来指定方案、安装和支持。一旦法律纠纷让这些伙伴不安，销售线索转化会变慢，售后支持也可能被拖住。安全与质量风险同样在这里：协作机器人装在人旁边，不能只由厂商验证，还要经集成商、工厂和本地安全流程确认。换句话说，运营风险一半来自内部制造集中，一半来自外部生态脆弱。
