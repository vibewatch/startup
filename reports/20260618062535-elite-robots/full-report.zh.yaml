      - number: '2.2'
        title: TAM、SAM 与受证据约束的测算视角
        blocks:
          - type: paragraph
            body: >-
              公开的协作机器人市场规模测算方向上乐观，但数字不一致。Mordor 和 MarketsandMarkets 将当前市场放在约 $1.4-$1.9 billion 区间，CAGR 假设低于
              21%；Market.us 和 Allied 则发布了更大的长期结果，CAGR 超过 30%。这些分歧太大，不能忽略，因此本章保留分歧，而不是挑一个更好看的估算。对 Elite
              来说，更有用的问题不是最宽口径的协作机器人 TAM，而是公司能触达的子集。Elite 当前目录和应用页面指向一个 SAM：以中等负载工业环境中的装配、机床上下料和码垛负载为中心。其 3-30 kg CS
              产品线和码垛卖点，让它站到市场轻载中心之上；如果更高负载品类继续比 5 kg 以下销量增长更快，这可能具有战略吸引力。公开证据支持分层看法：广义协作机器人 TAM、更窄的工业
              SAM，以及一个能从台数和国家覆盖中看见、但无法换算成收入美元的 SOM，因为 Elite 不披露收入、ASP 或软件 / 服务组合。
