      - number: '3.4'
        title: 转换成本、锁定、护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              协作机器人存在转换成本，但并非绝对。一个工作站跑起来后，买方会积累编程、末端执行器、风险评估、培训和备件依赖；不过多品牌并用仍然可能，因为集成商和较大工厂可以支持不止一个品牌。因此，这个市场中既有厂商可以被替换，但通常只有那些同时证明本地支持和信任的供应商才能做到。Elite
              的护城河在价格性能、中高负载经济性和坚固定位上最可信。这些有帮助，但并不完全耐久，因为竞争对手仍在拓宽负载范围，捆绑更多软件或 AI
              视觉，并销售降低部署摩擦的预工程化方案。最强的反向证据是汉堡禁令，它给竞争对手在欧洲提供了具体的信任叙事。同业经济性也带来警示：Doosan 的公开亏损，以及 Teradyne
              自己将机器人业务描述为早期、周期性业务，都暗示即使规模化供应商也可能继续激进定价。因此，竞争结论是混合的：Elite
              仍可在价格和负载最重要的场景中获胜，但其护城河比头部既有厂商的服务、生态和信任优势更容易被压缩。
