      - number: '1.2'
        title: 产品版图与经营规模
        blocks:
          - type: paragraph
            body: >-
              Elite Robots 目前的商业叙事围绕协作机器人，而非早期工业控制产品。官方页面显示，其已装机产品覆盖较早的 EC 系列机器人、当前 CS 系列、CP 码垛方案、CSA 与 CSH
              变体，以及在国内发布的防爆变体。CS 家族是最清晰的当期旗舰：网站称其有 6 个型号，负载从 3 kg 到 30 kg，臂展从 624 mm 到 1,800 mm，重复定位精度从 ±0.02 mm 到 ±0.1
              mm，最高工具速度可达 4.0 m/s，标准防护为 IP65，并可升级到 IP68。安全和易用性是公司信息的中心，包括对 ISO 10218 和 ISO 13849 的适配、90 档可调碰撞检测、图形化界面，以及
              2024 年 2 月面向全球推出的可选 ERP400S 示教器。规模指标有意义，但不同页面之间尚未完全统一。官方材料分别宣称 10,000+ 台已部署、服务覆盖 35+ 至 40+ 个国家、约 40% 至接近
              50% 的员工在研发，以及 200+ 至 400+ 项专利或知识产权资产，具体取决于页面。公司还提到苏州 11,000 m² 研发 / 制造基地、郑州第二制造基地、100+ 个伙伴，以及向 20,000
              台部署目标推进的愿景；这些信息显示公司快速扩张，也说明若干规模指标更像营销快照，而不是经审计的经营披露。
