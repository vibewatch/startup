      - number: '1.5'
        title: 里程碑、全球化与不利事件
        blocks:
          - type: paragraph
            body: >-
              Elite Robots 披露的里程碑轨迹在产品和分支机构扩张上异常详细。关于页面的时间线显示，公司从工业机器人转向协作机器人，并在 2017 年 8 月开发出 alpha EC66；2019 年 7 月实现
              EC 系列量产；2020 年 8 月测试首台 CS66 原型机；2020 年 12 月已部署台数突破 1,000 台。公司 2021 年 4 月在田纳西州 Knoxville 设立首个海外办公室，2021 年 9
              月启用当前 11,000 m² 苏州制造和研发中心，2022 年年中开设巴伐利亚和名古屋办公室，2023 年发布高负载 CS620 和 CS625 型号，同年晚些时候推出 IP68 认证及专用变体，并在 2024
              年 2 月全球发布 ERP400S 示教器。公司 2023 年文章还披露来自一家中国大型企业的 3,000 台订单；若该订单未取消，它能支撑试点部署之外的真实商业动能。主要负面里程碑是法律事件：2026 年 2
              月，Teradyne Robotics 在德国起诉 Elite Robots Deutschland；2026 年 4 月 21 日，汉堡地区法院对这家德国子公司发布初步禁令。报道称，该禁令要求 Elite
              Robots Germany 停止提供或分发涉嫌侵权的软件，并披露客户信息；Teradyne 还指称其界面类似 Universal Robots 的
              PolyScope，并提出安全设置问题。该命令不是最终裁决，但已在欧洲制造即时的渠道、声誉和合规风险，尤其是已审阅来源中没有发现 Elite Robots 的公开回应。
