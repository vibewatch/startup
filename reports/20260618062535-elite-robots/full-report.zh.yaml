  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Elite
              的投资案并非空中楼阁。公司官方材料支撑了真实装机、广泛伙伴覆盖、多条产品线，以及大批量订单证据。欧洲、亚洲和北美的客户与伙伴证据也说明，产品有商业相关性，不只是宣传。再叠加一个顺风品类：协作机器人仍是增长市场，而
              Elite 披露的许多应用——装配、机床上下料、码垛、检测——也贴合公开协作机器人研究中渗透率最高的用例。不过，反向论点比普通私营成长公司更强：估值没有公开收入或利润率披露可锚定，2026
              年禁令也为未来欧洲增长打上明确法律折价。投资人承销的不只是自动化需求，还包括补救可信度、伙伴留存，以及管理层能否把规模信号转成耐久经济性，同时不触发公开信任危机。
