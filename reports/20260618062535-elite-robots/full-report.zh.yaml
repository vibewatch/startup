    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Elite Robots 将自己描述为一家协作机器人制造商，2016 年 1
              月创立于中国苏州；公司早期聚焦工业机器人和运动控制器，之后转向协作机器人。如今的经营模式是硬件加软件的自动化业务：公司通过伙伴生态销售协作机械臂、码垛系统、控制器、示教器和相关集成支持。公开身份信息在方向上基本一致：公司是中国、私营、成长阶段企业；但总部表述并不完全一致。联系页把苏州标为“总部与制造基地”，关于页面则称公司总部位于上海
              AI Robot Valley，同一联系页又把上海标为国际运营中心。尽调中最稳妥的表述是：一家创立于苏州的私营协作机器人供应商，苏州是核心运营和制造基地，上海是国际 /
              商业枢纽；法律注册总部仍待确认。这一模糊点很重要，因为后续关于补贴、地方制造激励、诉讼管辖地和股权记录的尽调，应锚定注册实体，而不是营销文案。
