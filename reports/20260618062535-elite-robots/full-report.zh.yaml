  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              评估 Elite Robots
              应把它视为面向特定工厂工作流的协作自动化平台，而不是泛工业自动化品牌。官方产品和应用页面反复出现的任务是装配、机床上下料、取放、码垛、拧螺丝、检测及相关搬运。这意味着交付产品不只是一条机械臂，而是机械臂、控制器、示教器、软件环境、安全配置，以及由伙伴集成的末端工具；它们合在一起，替换或升级一个有人辅助的工作站。最强的客户价值主张，是在中等复杂度工作流中实现柔性部署，尤其是换线、重编程速度和物理占地重要的场景。官方产品页面反复将
              CS 家族定位为支持广泛 EoAT，并可与第三方视觉、夹爪、AGV 或执行器系统配合使用。放到实际采购语言中，Elite 销售的是可部署的协作工作站，可在多个应用之间重新配置，而不是单一用途的机器人设备。
