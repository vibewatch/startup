          - type: callout
            title: 法律事件现在就是估值输入
            body: 2026 年 Hamburg 禁令不应被当作背景法律注释。它会直接进入欧洲增长假设、伙伴行为，以及投资人套用任何前瞻倍数时应使用的折现率。
            calloutType: risk
            claimRefs:
              - CV002
              - CV028
              - CV033
          - type: callout
            title: 公开需求证据存在，但收入转化不存在
            body: Elite 有公开部署和伙伴信号，包括一项 3,000 台订单公告和 10,000+ 台部署口径。缺少的是从这些出货量信号到当前收入质量、毛利率和续费经济性的桥。
            calloutType: insight
