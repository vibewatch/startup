            - label: 强
            - label: 当前
            - label: 中
        - label: Gaotong Machinery 案例
          values:
            - label: 强
            - label: 强
            - label: 中
            - label: 当前
            - label: 强
        - label: Sentinel QRobot 案例
          values:
            - label: 强
            - label: 强
            - label: 中
            - label: 当前
            - label: 中
        - label: Shining 3D 证言
