companyProfile:
  summary: >-
    Elite Robots 于 2016 年 1 月在中国苏州成立，是一家垂直整合的协作机器人（cobot）制造商，设计、生产并销售 CS、EC、CP 产品线下的柔性自动化方案。公司 2017
    年从工业机器人转向协作机器人，此后借助集成商、OEM 伙伴和 7 个全球办公室，已在 40+ 个国家部署超过 10,000 台。Elite Robots 的研发团队约占员工总数 40–50%，拥有 400+
    项知识产权资产，公司把自己定位为西方协作机器人龙头的高性价比替代者。但公司面临实质性法律风险：2026 年 4 月，汉堡地区法院因涉嫌侵犯 Universal Robots 的 PolyScope
    软件版权，对其德国子公司发布初步禁令；安全主管部门也已获知一项允许用户关闭安全设置的功能。
  foundedDate: '2016-01-01'
  founders:
    - name: Cao Yunan
      role: 联合创始人兼 CEO
