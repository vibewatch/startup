      - number: '8.5'
        title: 退出就绪度、止损触发器与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              从公开披露看，Elite 目前不像一家 IPO 就绪公司。它没有类似后期 pre-IPO
              发行人的公开申报轨迹，没有披露经审计收入口径，也看不到诉讼悬置已被完全隔离的证据。这不等于退出路径不存在。若软件信任问题得到修复，战略买家可能会看重 Elite
              的产品宽度、中国中心制造能力和全球渠道触达；若收入质量强于公开记录显示，后期私募投资人也可能继续提供资金。但这些都是有条件的路径，不是可以承销的结果。实际尽调立场很简单：没有 cap table
              披露、当前经营指标、诉讼补救证据，以及 Hamburg 事件后主要伙伴和标杆客户仍活跃的证明，就不应形成坚定估值判断。上述任一项若负面破裂，论点就会从「跟踪」变成「重置前回避」。
