  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览与投资含义
        blocks:
          - type: paragraph
            body: >-
              Elite 的风险栈不是泛泛的“私营硬件公司”注意事项。首要风险是法律与信任风险，因为汉堡初步禁令已经在德国具有运营相关性，并与 Elite 复制 Universal Robots
              软件、允许关闭安全设置的指控相伴。仅这一点就很严重。叠加渠道依赖型 GTM 后，它更严重，因为分销商和系统集成商既是潜在执行路径的一部分，也是商业护城河的一部分。其次是制造和地缘政治风险。Elite
              的公开制造叙事仍以中国为中心，这有利于成本结构和控制，但也让公司暴露于贸易摩擦、出口规则复杂性，以及西方工业客户中的感知风险。财务不透明是最后的放大器：由于收入、烧钱、现金和准备金姿态未披露，投资人很难判断管理层是否有足够资产负债表弹性，吸收法律整改、渠道中断或更长销售周期。因此，风险结论不只是“关注诉讼”，而是“假设风险会沿法律、商业和融资层传导”。
