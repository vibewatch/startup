  - id: FM001
    title: 市场规模拆解视角
    type: pyramid
    layout: standard
    summary: 分层测算显示，Elite 可触达市场从全球协作机器人 TAM 收窄到中等负载工业 SAM；可观察 SOM 主要靠装机量证据支撑，无法换算成美元规模。
