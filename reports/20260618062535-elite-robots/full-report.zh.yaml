      - number: '1.3'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              领导层披露是公开记录中最薄弱的部分之一。Tracxn 称 Kai Sun 为创始人，并明确列为联合创始人兼 COO。公司控制的公开材料另行引用 Dr. Yunan Cao 的 CEO 身份，Craft 也将
              Cao Yunan 列为创始人兼
              CEO。这些披露至少确认了两名具名高管，但没有给出完整管理层名单、董事会名单或治理权利图谱。已审阅的官方页面没有披露独立董事、投资人董事席位、审计结构或重大领导层变动。缺失披露并不证明治理薄弱，但会增加尽调负担，因为所有权集中度、董事会监督和接班安排无法从公开材料看清。因此，关键人依赖看起来具有实质性：外部可见的领导叙事集中在少数具名高管身上，支撑更广泛经营领导层的公开证据很少。投资人应重点尽调
              Kai Sun 与 Yunan Cao 是否形成互补的创始人控制，产品 / 研发、制造和国际销售之间如何分配经营权，以及是否有主要投资人拥有未公开呈现的治理权利。
