      - CU028
      - CU030
  - id: FU004
    title: 留存可见度地图
    type: flow
    layout: wide
    summary: 公开客户数据能从部署证明走到定性耐久性信号，但到真正的留存经济性之前就断了。
    data:
      nodes:
        - label: 部署声明
          detail: 10k+ 台、40+ 个国家和 100+ 个合作伙伴支撑覆盖宽度。
        - label: 具名参考客户
          detail: Shining 3D、MOOVALL、Abiman、TWT 和 Otes 提供了可识别的证明。
        - label: 运营案例
          detail: Salt-core、Gaotong 和 Sentinel 案例显示，产品已进入工作流级使用。
        - label: 扩张信号
          detail: 多协作机器人或多任务案例暗示，客户可能出现复购或重新部署。
        - label: 留存指标缺失
          detail: 公开资料没有 NRR、GRR、流失率、续约率、合同期限或同期群表。
        - label: 尽调依赖
          detail: 客户质量承销仍要靠管理层数据和渠道分析来支撑。
    approximationNotes: 该图采用流程图而非同期群，因为公开资料中找不到可支撑的留存比例。
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 法律和安全风险严重度最高，因为它们会直接传导到渠道行为、采购节奏和后续融资。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 法律 / IP 禁令
          values:
            - label: None
            - label: 低
            - label: 中等
            - label: 强
        - label: 安全指控
          values:
            - label: None
            - label: 低
            - label: 中等
            - label: 强
        - label: 中国制造集中度
          values:
            - label: None
            - label: 中等
            - label: 强
            - label: 低
        - label: 财务不透明 / 资本充足性
          values:
            - label: None
            - label: 中等
            - label: 强
            - label: 中等
    approximationNotes: 标签基于公开证据概括当前严重度和影响传导路径，并非数字化概率估计。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR009
      - CR013
      - CR019
      - CR029
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最大下行路径从法律和安全担忧出发，传导为渠道犹豫、订单放慢和融资压力。
    data:
      nodes:
        - id: injunction
          label: Hamburg 禁令
          detail: 当前法律事件影响德国市场和软件信任
        - id: safety
          label: 安全指控
          detail: 禁用设置指控及主管机关通知
        - id: channel
          label: 渠道犹豫
          detail: 分销商、SI 和 OEM 可能放慢或收窄合作
        - id: bookings
          label: 订单放慢
          detail: 管线转化和采购周期被拉长
        - id: cash
          label: 现金承压
          detail: 增长放慢、整改成本上升，压缩财务弹性
        - id: valuation
          label: 估值下行
          detail: 风险调整后的入场价格和回报预期变差
      edges:
        - from: injunction
          to: channel
          label: 法律不确定性削弱伙伴信心
        - from: safety
          to: channel
          label: 合规担忧抬高部署摩擦
        - from: channel
          to: bookings
          label: 活跃销售方减少，客户审批放慢
        - from: bookings
          to: cash
          label: 规模下降、回款变慢，流动性承压
        - from: injunction
          to: cash
          label: 法律整改和伙伴管理成本上升
        - from: cash
          to: valuation
          label: 稀释和下行概率增加
    approximationNotes: 该图强调公开证据可见的因果方向，不代表确切时间或幅度。
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR013
      - CR020
      - CR029
      - CR034
      - CR037
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Elite 同时依赖中国制造基地、伙伴主导的分销，以及监管方和客户的信任。
    data:
      nodes:
        - id: china-sites
          label: 中国制造基地
          detail: 苏州和郑州集中承接生产和供应
        - id: partner-network
          label: 伙伴网络
          detail: 分销商、SI 和 OEM 夹在 Elite 与许多客户关系之间
        - id: western-buyers
          label: 西方工业买家
          detail: 采购取决于合规信任和支持信任
        - id: regulators
          label: 监管方和安全主管机关
          detail: 正式或非正式态度都可能影响买方信心
        - id: capital
          label: 私募资本基础
          detail: 缓释能力取决于未披露的现金和烧钱状况
      edges:
        - from: china-sites
          to: western-buyers
          label: 交付和地缘政治暴露影响买方安心程度
        - from: partner-network
          to: western-buyers
          label: 伙伴掌握本地销售和支持可信度
        - from: regulators
          to: western-buyers
          label: 安全和合规担忧影响采购
        - from: western-buyers
          to: capital
          label: 订单和回款影响融资需求
        - from: capital
          to: partner-network
          label: 整改和支持投入取决于现金弹性
    approximationNotes: 依赖边展示某一节点受冲击后，可能如何传导到商业或融资结果。
    claimRefs:
      - CR003
      - CR019
      - CR020
      - CR021
      - CR026
      - CR027
      - CR028
      - CR030
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 公开证据支持继续跟踪，但只有在出价前通过法律和披露关口后，才适合进入定价。
    data:
      nodes:
        - id: market
          label: 协作机器人品类强增长
          type: start
        - id: product
          label: 产品和部署证明存在
          type: process
        - id: legal
          label: 法律和安全阴影可接受？
          type: decision
        - id: finance
          label: 收入和股权结构可见度足够？
          type: decision
        - id: invest
          label: 可定价的尽调结果
          type: end
        - id: track
          label: 跟踪 / 继续研究
          type: end
        - id: avoid
          label: 重置前回避
          type: end
      edges:
        - from: market
          to: product
          label: 品类需求值得关注
        - from: product
          to: legal
          label: 商业证明支撑更深尽调
        - from: legal
          to: finance
          label: 是 - 整改看起来可信
        - from: legal
          to: avoid
          label: 否 - 阴影扩大
        - from: finance
          to: invest
          label: 是 - 经济性和条款支撑价格
        - from: finance
          to: track
          label: 否 - 继续观察
    approximationNotes: 该流程映射承销逻辑，不是公司披露的内部流程。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV028
      - CV030
      - CV037
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值最敏感的变量不是市场规模本身，而是法律整改质量、收入可见度和伙伴韧性。
