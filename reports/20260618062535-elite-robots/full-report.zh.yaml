      - number: '1.4'
        title: 融资历史与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              融资历史方向清楚，但不同私营公司数据库给出的数字不一致。Tracxn 将 Elite Robots 列为一家 2016 年成立的 Series D 公司，6 轮融资累计 $142M，首次融资在 2016 年 6
              月，最近一轮 Series D 日期为 2026 年 3 月 25 日，早前标注轮次在 2021 年 4 月和 2022 年初。CB Insights 则报告累计融资 $160.29M、覆盖 8 轮、2026 年
              3 月 25 日 Series D 融资 $87M、2025 年 12 月估值数据点 $361.66M，并列出 19 位投资人。由于两者都是二手来源且部分付费墙限制，最安全的尽调立场是：Elite Robots
              已获得可观的九位数私募融资，但累计资本、轮次数和估值仍需公司直接确认。数据库之间的交集仍有用：反复与公司相关联的投资人包括 Oriza Holdings、Fortune Capital、Lenovo
              Capital and Incubator Group、Advantech Capital、Ceyuan Ventures、Langmafeng Venture Capital、Kunyan
              Capital，以及后期中国基金。已审阅公开来源没有披露债务额度、授信、二级交易、清算条款或持股比例。因此，利益相关方权力、优先权栈和创始人稀释仍是未解决的尽调问题，而不是可发布事实。
