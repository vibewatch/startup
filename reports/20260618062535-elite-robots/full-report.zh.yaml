      nodes:
        - label: 广义协作机器人 TAM（当前 $1.4B-$1.9B；激进预测更高）
          note: 保守的当前估算来自 Mordor 和 MarketsandMarkets；更高的长期情景来自 Market.us 和 Allied
        - label: 应用牵引的工业 SAM
          note: 装配、机床上下料、码垛，以及相邻的协作搬运工作流
        - label: Elite 产品适配 SAM
