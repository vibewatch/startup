      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Elite 的 GTM
              看起来是渠道放大，而非纯直销。公司的全球页面和联系页指向区域办公室，加上规模大得多的伙伴网络；对一家向多国销售集成自动化的制造商来说，这是合理路径。代价是渠道触达并不免费：分销商和集成商能加快部署，但也会拿走经济利益，并居中调节客户关系。公开材料中没有
              CAC、回本期或销售周期披露。最好的代理指标是工作流复杂度。协作机器人采购通常需要应用界定、风险评估、集成和培训，这意味着更慢的企业式销售，而不是冲动购买或自助式需求。IFR 2026
              年更新显示，美国工业机器人安装量在 2025 年增长 11% 至 38,000 台，这对底层需求是鼓励信号，但不能解决 Elite 特有的转化效率或伙伴产能问题。
