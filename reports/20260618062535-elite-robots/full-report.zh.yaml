              公开证据显示，Elite 的收入模式以硬件优先。其官方页面销售协作机械臂、应用套件和部署支持，而不是独立软件订阅。经销商页面进一步强化这一框架：EC63、EC612、CS63 和 CS612
              均列出公开美元价格，更广的 MachineToolProducts 目录也列出更重载的 CS620。收入含义很直接：公开货币化证据是按台、按型号、按项目的，而不是类似 ARR
              的模式。其上很可能叠加服务、外设、伙伴利润分成和支持合同，但已审阅公开来源没有拆分收入组合。这也意味着收入确认更可能接近发货、安装或项目里程碑，而不是平滑的经常性软件收入。这并不代表模式没有吸引力，但说明若无公司直接披露，不能把收入质量当成
