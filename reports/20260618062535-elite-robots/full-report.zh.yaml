  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 取值
      - 理由
    rows:
      - - 建议
        - 继续研究 / 跟踪
        - 商业验证存在，但价格发现太弱，尚不足以下买入判断
      - - 信心
        - 中
        - 产品和市场证据尚可，但缺少收入和股权结构证据
      - - 风险评级
        - 高
        - 由禁令、安全指控、财务不透明和地缘暴露驱动
      - - 估值立场
        - 未知到偏高
        - 激进价格缺少支撑；只有强有力的私有数据支持时才可能接受
      - - 目标回报姿态
        - 要求严格入场纪律
        - 任何投资论点都需要针对法律和稀释风险的下行保护
    notes: 建议受限于公开证据质量，而不是缺少商业活动。
    claimRefs:
