  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              评估 Elite Robots
              应放在协作机器人市场内，而不是整个工业自动化栈内。其官方产品表面是机械臂、示教器和应用牵引的工作站，而不是完整固定产线工厂或纯软件自动化。这意味着纳入的支出是协作工作站本身：机械臂、控制器、安全配置、夹爪 /
              工装、集成劳务和支持。排除的支出同样重要。固定工业机器人、AMR、纯视觉软件，以及从未进入自动化采购决策的人工劳动，都不应被加进 Elite 的核心 TAM。公司自己的应用页面把市场从一个狭窄 SKU
              扩展出去：码垛、装配和机床上下料各自意味着不同的流程经济性和买方需求。真正的现状替代方案是人工操作员、传统硬自动化，以及通过本地集成商销售的既有协作机器人品牌。这一框架很重要，因为 Elite
              卖的不是泛泛的机器人未来，而是在这些替代方案面前，出售一项具体的协作工作站替换决策。
