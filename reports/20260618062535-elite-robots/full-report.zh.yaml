      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              协作机器人采购是多线并行的。终端用户是与工作站并肩作业的操作员或技师；技术规格制定者通常是自动化工程师、制造工程师或系统集成商；付款方多在运营部门、工厂管理层或资本开支委员会，而不是车间一线。Elite
              的全球页面和伙伴页面显示，即便公司也设有分支机构，它仍常通过本地伙伴和集成商触达这些买方。公开应用页面还暗示，不同工作流对应不同买方动作。装配案例强调快速换线和小批量；机床上下料强调正常运行时间和劳动力再部署；码垛强调重物搬运和产线末端
              ROI。不同供应商之间，采用路径往往遵循同样阶段：识别重复性工作流，跑 PoC，完成风险评估，集成工作站，培训操作员，然后在上线后支持产线。因此，在讨论标价之前，服务网络更深、集成商能力更强的供应商就已经占优。
