  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 当前确切估值
        - 2026 年 3 月融资后的投后价格，以及任何二级交易
        - 需要判断入场价是否已经计入最佳情形增长
        - 要求提供股权结构表和董事会批准的融资摘要
      - - 收入和毛利率
        - 当前收入运行率、按产品族划分的毛利率、服务附加情况
        - 必须把部署量翻译成经济价值
        - 要求提供月度财务包；如有，经审计报表也需提供
      - - 诉讼整改
        - 软件剥离计划、律师意见和储备估算
        - 决定法律折扣是暂时还是结构性
        - 审阅外部律师备忘录和工程整改路线图
      - - 渠道耐久性
        - 头部合作伙伴收入组合，以及禁令后的任何流失
        - GTM 借合作伙伴放大，因此渠道健康对估值至关重要
        - 要求提供区域合作伙伴队列和管线转化数据
      - - 优先权堆栈
        - 清算优先权、参与权和反稀释条款
        - 回报潜力可能与企业价值大幅背离
        - 条款清单工作前，先取得完整融资文件
    notes: 这些是把本章从跟踪转为可定价前必须满足的最低要求。
