            body: >-
              产品组合现在覆盖较早的 EC 线、主流 CS 线，以及面向码垛的 CP 或 CS530H 配置，用以扩展负载和垂直臂展。已审阅官方页面支持一条阶梯：从紧凑型 CS63 和 CS66，到更长臂展的
              CS612，再到更高负载的 CS620、CS625 和 CS530H。运行架构是模块化的。产品页面描述了紧凑型 AC 控制器、OEM 控制器选项、标准 ERP400 示教器和带安全功能的 ERP400S
              变体；可下载文档覆盖 SDK、通信、编程、图纸、证书和软件。Elite 生态页面补上关键软件点：公司称其协作机器人可配合第三方软件进行编程、设计和仿真，也可配合外部
              EoAT、视觉和移动组件。这一架构很重要，因为协作机器人采用往往不是卡在机械臂本身，而是卡在集成边界。因此，Elite 的公开姿态不是封闭的纯硬件销售，而是控制器加软件加伙伴的栈，意在嵌入更广泛的自动化工作站。
