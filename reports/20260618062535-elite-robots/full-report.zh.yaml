      - number: '7.4'
        title: 财务与模型风险、缓释、监控和止损标准
        blocks:
          - type: paragraph
            body: >-
              公开财务不透明，会把很多风险都推成模型风险。Elite
              已经融到可观资本，但收入、毛利率、烧钱速度和诉讼准备金口径都未披露，投资人无法判断公司能否自掏腰包修复法律问题、扛住欧洲扰动，或容忍渠道转化变慢。硬件公司还要承受软件公司没有的营运资本和零部件风险；上市机器人同行的证据也显示，规模不等于盈利。话虽如此，并非所有风险都没有缓释路径。公司有宽广的伙伴网络、多条产品线，也有足够公开部署证据，说明补救在概念上并非不可能。关键在于缓释能力是否成熟。若管理层能证明软件隔离或重构、监管沟通、伙伴留存，以及争议地区之外仍在增长，投资逻辑仍可能守住。若公司失去欧洲渠道、无法解释安全指控，或在经济性不透明的情况下再融资，投资案会迅速变弱。实际结论是：风险很高，但应设置明确的论点失效触发器，而不是一概「永远回避」。
