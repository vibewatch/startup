        - 要求管理层回应时间线
      - - 法务和工程整改团队
        - 需要足够的软件和合规深度，才能剥离或重设争议元素
        - 中
        - 严重
        - 设立专门整改项目
        - 要求提供产品和法务工作流负责人
      - - 区域销售领导层
        - 不确定期内，各分支机构必须留住合作伙伴
        - 中
        - 高
        - 强化客户管理和本地升级机制
        - 按办公室索取区域管线
      - - 质量和现场支持组织
        - 公开服务指标稀少
        - 中
        - 高
        - 发布内部 SLA 和服务 KPI
        - 要求提供服务组织人数和关闭时长
      - - 财务职能
        - 缺少公开透明度时，仍必须管理资本规划
        - 中
        - 高
        - 保守规划现金跑道和储备
        - 要求提供下行情景下的现金规划
    notes: 执行风险被抬高，是因为多项问题可能需要并行解决，而不是按顺序逐个处理。
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值或事件
      - 行动含义
    rows:
      - - 汉堡禁令扩大
        - 终审裁定或更广泛的 EU 执法
        - 任何确认的销售禁令扩大到当前范围之外
        - 转向回避，或要求大幅入场折扣
      - - 安全指控被确认
        - 监管行动或独立审计证实禁用设置担忧
        - 任何正式主管部门行动，或被迫达到召回级整改
        - 解决前视为论点破裂
      - - 渠道恶化
        - 经销商或 OEM 退出变得可见
        - 多个具名合作伙伴停止销售 Elite，或冻结管线
        - 大幅下调增长假设
      - - 资本压力
        - 缺少经济性披露时仍需要新融资
        - 在法律或收入态势清晰前宣布融资
        - 提高稀释风险和估值谨慎度
      - - 制造中断
        - 交付延迟或贸易限制影响公开化
        - 交付错失或市场准入中断
        - 提高基准和悲观情景中的下行概率
    notes: 否决标准聚焦会改变承销判断的可观察公开事件，而不只是抽象担忧。
    claimRefs:
