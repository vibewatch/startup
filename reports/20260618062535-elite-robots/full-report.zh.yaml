    title: 客户
    sections:
      - number: '6.1'
        title: 按买方、用户、地域和渠道划分客户基础
        blocks:
          - type: paragraph
            body: >-
              理解 Elite 的客户基础，最好的切口是渠道结构和工作流分层，而不是已披露的收入队列。公司伙伴页面称 Elite 通过分销商、系统集成商和 OEM 合作，同时宣称拥有 100+ 个伙伴、40+ 个国家、7
              个全球分支和超过 10,000 台已部署协作机器人。这意味着一种混合模式：在少数地区有直接商业存在，再由本地经销商和集成商放大；后者掌握技术售前、工作站设计、安装和支持。具名公开参考也强化了这一点。葡萄牙
              MOOVALL、韩国 Abiman Engineering、泰国 TWT 和土耳其 Otes 都更像渠道实体，而不是已披露的大型终端客户 logo。Shining 3D 更接近 OEM
              或嵌入式技术客户。结果是，客户图谱中经济买方通常是工业中小企业或工厂运营方，但商业关系常由伙伴居中；这些伙伴会塑造赢单率、部署质量和后续扩张潜力。
