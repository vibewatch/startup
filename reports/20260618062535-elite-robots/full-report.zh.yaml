            title: 继续研究，而不是放弃
            body: 公开证据足以让 Elite 留在主动观察名单：公司看起来商业上真实，也处在有利品类。但在收入、cap table 和补救尽调之前，还不足以承担价格风险。
            calloutType: recommendation
            claimRefs:
              - CV001
