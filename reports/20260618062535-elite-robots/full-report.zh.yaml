      - number: '2.4'
        title: 增长驱动、采用约束与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动来自柔性自动化、劳动力短缺、更安全的人机协作，以及在不重建整条产线的情况下切换小批量生产的需要。这些因素在市场报告和竞争对手页面中反复出现。但约束也同样真实。今天的成本栈仍由硬件主导，因此买方必须在第一个生产周期开始之前，为机械臂成本、工装、安全工作和集成投入找到理由。中小企业最能感到这类痛点，大型制造商则会叠加更多验证和采购负担。欧洲又多一层：协作部署以风险评估和安全标准为锚，未解决的软件或安全争议会具有商业意义。因此，Elite
              2026 年 4 月德国禁令的影响超出诉讼标题；在合规姿态本就是采购决策组成部分的地区，它会制造采购摩擦。最后，最大的尽调缺口不在宽口径协作机器人故事有多大，而在 Elite
              自身渗透到哪里。公开来源不披露垂直行业组合、直销与渠道收入占比或美元口径 SOM，因此任何承销模型都还需要公司一手数据，市场规模测算才有投资可用性。
