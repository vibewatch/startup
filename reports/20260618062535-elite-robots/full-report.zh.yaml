  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: Elite 的公开证明在具名参考客户和工作流细节上最强，在量化结果和留存可见度上较弱。
    data:
      columns:
        - 具名身份
        - 工作流细节
        - 量化结果
        - 新鲜度
        - 直接终端客户质量
