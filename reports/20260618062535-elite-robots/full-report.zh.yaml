      - number: '5.3'
        title: 部署、集成、可靠性与支持动作
        blocks:
          - type: paragraph
            body: >-
              部署证据在 Elite 讨论支持资料、伙伴描述集成工作的地方最强。支持中心集中提供文档和教程，下载中心列出 SDK
              手册、服务手册、通信文件、证书和软件资产，这些通常是安装商在真实部署中需要的东西。教程页面提到脚本、I/O、力控插件、传送带跟踪和 RoboDK
              安装，合在一起说明公司在努力降低售后设置摩擦，并支持在现场调试前进行远程或离线准备。产品页面还强调控制器选项、标准线缆和全线一致的示教器，这些都会降低分销商和系统集成商的培训负担。可靠性披露比功能披露薄，但官方信息确实持续强调工业坚固性：已审阅
              CS 页面将 IP65 作为标准，并提供 IP68 选项。因此，支持层面的主要结论是：部署准备和伙伴赋能偏正面；但现场故障指标仍不完整，因为 Elite 不公开详细服务
