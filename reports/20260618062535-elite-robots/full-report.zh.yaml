      - number: '7.2'
        title: 监管、法律、知识产权、隐私与安全风险
        blocks:
          - type: paragraph
            body: >-
              最具体的公开风险证据来自法律。Universal Robots 称，Teradyne Robotics 2 月起诉后，汉堡地区法院于 2026 年 4 月对 Elite Robots Deutschland
              发布初步禁令；The Robot Report 也报道了同一裁定，并补充客户披露和计划针对伙伴采取行动的细节。同一报道线还包含最严重的安全指控：The Robot Report 引用 Teradyne CTO
              David Brandt 的说法，称 Elite
              加入了一项允许关闭安全设置的设置，并且丹麦、德国和美国主管部门已收到警告。即便没有最终裁决，这一组合也很重要，因为协作机器人买方会同时关注软件信任、安全姿态和文档质量。Elite 自身的隐私政策、cookie
              政策和 imprint
              页面显示，公司确实为全球网站维护法律和数据处理界面，但这些页面不能解决围绕产品软件来源、监管沟通或整改的更难尽调问题。因此，投资人应把法律敞口、软件原创性和安全治理视为互相连接的问题，而不是割裂的议题。
