  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 重要性
      - 行动含义
    rows:
      - - 法律悬顶恶化
        - 更广泛的 EU 禁令或重大损害赔偿案
        - 会进一步损害渠道信心和估值区间
        - 从跟踪转为回避，直到重新设定
      - - 安全指控被正式确认
        - 主管部门行动或被迫整改，且与安全禁用指控有关
        - 会让信任和合规风险成为论点核心
        - 视为论点破裂
      - - 下一轮定价低于预期
        - 缺少明确收入验证，或以高度保护性条款完成新融资
        - 传递议价弱势和稀释悬顶信号
        - 下调基准和悲观区间
      - - 合作伙伴 / 客户背书流失
        - 2026 年后，具名经销商或客户验证转为不活跃
        - 比单纯部署数量更能削弱商业化论点
        - 大幅降低乐观情景概率
      - - 透明度仍缺位
        - 管理层在尽调中不提供收入、毛利率和股权结构细节
        - 阻断任何严肃的回报承销
        - 不投资
    notes: 否决清单设计成可在尽调或公开报道中观察到。
