      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              公开收入未披露，情景估值就必须明说假设，而不是假装精确。牛市情景假设 Elite 成功修复争议软件问题，保住大部分伙伴网络，继续在码垛和装配应用中拿单，并把 10,000+
              部署叙事转化为增长，更像其他已规模化协作机器人厂商，而不是陷入困境的硬件创业公司。基准情景假设商业活动继续推进，但相较没有 2026
              年法律事件时本可达到的水平打折，欧洲增长更慢，透明度折价持续。熊市情景假设法律或安全问题从德国外溢，渠道伙伴更谨慎，下一轮融资在议价能力更弱的位置完成。在这套框架下，估值更适合写成概率加权区间，而不是单点目标；当前公开记录支持很宽的区间，因为需求证据方向上强，但变现质量证据弱。
