      - number: '8.3'
        title: 市场位置与合适的估值镜头
        blocks:
          - type: paragraph
            body: >-
              Elite
              不能按纯软件公司估值，公开证据也不足以把它当成熟工业自动化巨头。它是一家软硬件结合的协作机器人厂商，有渠道杠杆、实质制造暴露，也有全球需求证据，但没有披露经济性。合适镜头应混合三类参照：后期工业机器人私募定价、上市协作机器人可比公司，以及战略并购先例。上市同行证据有参考价值。Doosan
              Robotics 2023 年上市时市值约 $1.3 billion，尽管上一年收入只有 450
              亿韩元且仍经营亏损，说明公开市场有时会按增长和品类位置给协作机器人龙头定价，而不是只看当前盈利。与此同时，Teradyne 的申报文件和股东信显示，即便规模化机器人资产也会承受周期压力，Universal
              Robots 自身收入在 2022 年见顶后也走弱。几项证据合在一起意味着，不管 Elite 私募估值是多少，都应同时包含增长期权和法律风险折价。
