      - number: '8.2'
        title: 融资背景、价格发现限制与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资图景有意义，但并不完整。Tracxn 显示 Elite 成立于 2016 年，处于 Series D，六轮共融资 $142 million，最新一轮在 2026 年 3 月。这足以证明 Elite
              吸引过真实机构资本，也能跨阶段持续融资。但还不足以证明今天的价格可投。同一来源隐藏了各轮 post-money
              字段，公开材料也没有给出经审计收入、毛利率、烧钱速度、积压订单转化、营运资本结构或清算优先权。即便追踪页面上可见的员工数，也与公司宣称的国际办公室版图和伙伴网络不完全一致。既然私募定价未披露，入场纪律就必须盯住缺口：当前
              ARR 或硬件收入 run-rate、各机器人家族毛利率、质保准备金变化、法律补救预算，以及在下行或平退出情景中决定回报的股权结构清算瀑布。
