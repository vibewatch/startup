      - CV002
      - CV003
      - CV037
  - id: TV002
    title: 正方论点与反方论点表
    columns:
      - 方向
      - 论点
      - 什么会改变判断
    rows:
      - - 正方论点
        - Elite 拥有真实产品宽度和全球分销触达，在 40+ 个国家有 100+ 家合作伙伴
        - 合作伙伴流失或办公室版图收缩，会削弱商业化论点
      - - 正方论点
        - 10,000+ 部署和公开的 3,000 台订单，显示市场接受度有分量
        - 如果部署主要是试点或低利用率站点，这一信号会明显变弱
      - - 正方论点
        - 到 2030 年代初，协作机器人仍是高增长自动化品类
        - 如果品类增长急剧放缓，私募估值溢价会进一步压缩
      - - 反方论点
        - 汉堡禁令和软件复制争议，直接给未来欧洲增长打上法律折扣
        - 有文档支撑的整改计划，且没有更广泛执法，会降低这一折扣
      - - 反方论点
        - 公开收入、毛利率、烧钱和留存数据缺失
        - 经审计财务或达到尽调质量的月度报告，会改变承销质量
      - - 反方论点
        - 股权结构、优先权和法律整改成本未披露
        - 干净股权结构和可控整改储备，会改善预期回报
    notes: 正面案例由市场和产品驱动；负面案例由信任和披露驱动。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV025
      - CV026
      - CV028
      - CV029
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值区间（USD）
      - 概率信号
      - 下行触发项
    rows:
      - - 乐观
        - 法律整改把问题控制住；渠道保持完整；增长跟上头部协作机器人同行
        - 900M-1400M
        - 需要强有力的私有收入和利润率验证
        - 更广泛的 EU 执法或合作伙伴退出
      - - 基准
        - 业务带着诉讼折扣继续推进，欧洲放慢，透明度仍低
        - 400M-800M
        - 与当前公开证据最一致
        - 下一轮定价偏弱，或可见销售放缓
      - - 悲观
        - 禁令扩散，合作伙伴犹豫，融资杠杆恶化
        - 100M-300M
        - 与尚未解决的信任和资本压力一致
        - 不利终审裁定，或流动性吃紧证据
    notes: 区间是分析情景带，不是公司披露的估值。
    claimRefs:
      - CV028
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 估值标记
      - 收入或规模标记
      - 与 Elite 的相关性
      - 关键局限
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant public and private references identified in reviewed sources; they are not
        an exhaustive universe of all robot companies or transactions.
    rows:
      - - Doosan Robotics
        - 上市协作机器人纯标的
        - 2023 年 IPO 对公司估值约 $1.3B；2026 年 6 月市值约 $4.37B
        - 2022 年收入 450 亿韩元，并录得经营亏损
        - 最好的公开协作机器人估值参照
        - 公开市场时点和韩国投资者结构不同于 Elite
      - - Teradyne / Universal Robots
        - 上市战略所有者和头部协作机器人资产
        - Teradyne 市值约 $63.96B
        - UR 收入在 2022 年达到 $326M 峰值，2024 年降至 $293M
        - 展示规模化品类龙头如何变现和穿越周期
        - Teradyne 业务多元，UR 今天没有单独估值
      - - Universal Robots 2015 年出售
        - M&A 先例
        - 被 Teradyne 以 $285M 收购
        - UR 后来在全球售出超过 100,000 台
        - 说明品类领先协作机器人平台的战略价值
        - 交易年代久远，早于当前市场结构
      - - Standard Bots
        - 2026 年私募轮
        - $200M Series C，估值 $1B
        - 公司称服务数百名客户，并计划明年拿下美国新增部署的 10%
        - 有用的当期私营机器人定价参照
        - 美国制造叙事和 AI 原生叙事不同于 Elite
    notes: 这些行应作为区间锚点，而不是直接按模型盯市的替代品。
