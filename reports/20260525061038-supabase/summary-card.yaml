  topStrengths:
    - >-
      Integrated open-source Postgres platform bundles database, auth, storage, realtime, APIs, and edge functions in
      one developer workflow.
    - Strong developer distribution with 7M+ registered developers, 16M+ databases created, and 100k GitHub stars.
    - >-
      Clear monetization ladder from free/self-serve plans to enterprise governance and support, reinforced by named
      customers such as GitHub, PwC, Mozilla, and Epsilon3.
    - >-
      $200M Series D financing gives Supabase capital to keep investing through reliability and enterprise maturation
      work.
  topRisks:
    - >-
      Revenue, ARR, gross margin, NRR, and headcount remain undisclosed or only available through conflicting
      third-party estimates.
    - >-
      Managed-cloud reliability remains a live underwriting issue after the February 2026 regional outage and the
      absence of automatic cross-region failover.
    - >-
      Monetization depends on converting a huge open-source funnel into durable Team and Enterprise revenue while
      Firebase, hyperscalers, and Postgres specialists keep narrowing differentiation.
  unresolvedGaps:
    - Canonical ARR or revenue, gross margin, burn, and NRR are not publicly disclosed.
    - >-
      Conversion from free/open-source usage into Team and Enterprise cohorts, plus customer concentration, remains
      opaque.
    - >-
      Current headcount, legal-entity versus headquarters presentation, and later-round financing history still conflict
      across public sources.
