    {
      "id": "moat-durability-and-adverse-evidence",
      "title": "Moat durability and the adverse evidence",
      "body": "The core strategic conclusion is that Supabase's moat looks more like packaging, portability, and community affinity than exclusive underlying technology. That is still valuable. Supabase has built a coherent Postgres-centered experience that feels simpler than stitching together cloud primitives, and official signals around enterprise controls and operating scale suggest the platform is no longer just a hobbyist tool. But the adverse evidence is real. Firebase has already moved toward PostgreSQL through Data Connect, Appwrite now markets itself as another open-source full-stack backend with migration paths from Supabase, and PlanetScale and Neon keep strengthening the database layer for buyers who do not need the whole Supabase bundle. Even generic substitutes like Railway and Render make it easier to assemble enough backend infrastructure without choosing a dedicated BaaS. The result is a category where the biggest risk is commoditization rather than sudden displacement by one single rival. For diligence, the key question is whether Supabase can keep being the default integrated open-source Postgres platform while the rest of the field makes more of its bundle look table stakes.",
