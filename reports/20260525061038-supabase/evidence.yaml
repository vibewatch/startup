evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      Corporate registry documents and management confirmation that distinguish legal domicile from operating
      headquarters and remote workforce structure.
    whyItMatters: >-
      Jurisdiction and operating-footprint clarity affect tax, legal, and go-to-market assumptions that later chapters
      should not guess at.
    diligencePath: >-
      Request entity charts, incorporation records, and a management-confirmed HQ / remote-work summary during
      diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, observer list, lead-investor rights summary, and any protective provisions that define
      actual control.
    whyItMatters: >-
