      - CV043
      - CV044
    figureRefs:
      - FV002
  - id: public-comparable-context
    title: Public comparable context
    body: >-
      A useful public-comp set for Supabase is not “backend as a service” in the abstract but scaled data and developer infrastructure names whose revenue is fully disclosed: MongoDB, Datadog, Snowflake, and Cloudflare. They are imperfect peers, but together they frame what public markets currently pay for durable software infrastructure franchises. As of May 22, 2026, MongoDB traded around 9.7x EV/revenue, Snowflake around 12.5x, Datadog around 20.6x, and Cloudflare around 32.5x. Applied back to a $2 billion value, that band implies revenue support of roughly $206 million at MongoDB’s multiple, $160 million at Snowflake’s, $97 million at Datadog’s, and about $62 million at Cloudflare’s. That comparison is the core reason the chapter stays cautious. Supabase’s high-end third-party 2025 estimate of $70 million starts to look more plausible only if investors underwrote a Cloudflare-like premium path, while the lower $27 million to $31 million estimates sit materially below the revenue base that most of the comp set would need. Official IR pages and SEC filing pages also remind the reader that these comparables are already much larger, more diversified, and publicly disclosed businesses, so their multiples are contextual ceilings rather than direct private-company clearing prices.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV039
      - CV040
      - CV041
      - CV042
