  - id: recommendation-risks-and-missing-evidence
    title: Recommendation, adverse valuation risks, and missing evidence
    body: >-
      The chapter recommendation is research-more with medium confidence, high risk, and a stretched-to-fair boundary at the $2 billion Series D mark depending on where true ARR actually sat. Said differently, the anchor is supportable, but it is not yet cheap on public evidence. The main adverse valuation risk is that later private-market signals have run ahead of disclosed monetization. A hypothetical $5 billion mark would imply about 71x on a $70 million revenue base and roughly 185x on a $27 million base, which looks difficult to support from anything currently public. Reliability risk also matters because infrastructure buyers pay premium multiples only when they trust the platform for production workloads; the February 2026 outage and the lack of automatic cross-region failover for customer Postgres databases show that some resilience work is still underway. The biggest missing evidence is straightforward: current audited ARR, net revenue retention, gross margin, enterprise ACV mix, concentration, fully diluted share count, and any liquidation preferences or secondary terms. Without those items, this chapter can bracket valuation rationally, but it cannot pin it with venture-round precision. Public evidence also shows no visible IPO-readiness signal, so the next valuation proof point is more likely another private financing or secondary transaction than a near-term public listing.
    claimRefs:
      - CV016
