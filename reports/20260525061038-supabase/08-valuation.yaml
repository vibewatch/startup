  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Why it matters
      - Action implication
    rows:
      - - Weak monetization proof
        - Evidence points to ARR or revenue still below roughly $60M on a sustained basis.
        - That level struggles to support $2B except under unusually aggressive multiple assumptions.
        - Treat the 2025 mark as stretched and avoid underwriting upside without a price reset.
      - - Flat or down financing
        - Next round prices at or below $2B or relies on heavily structured terms.
        - A flat headline or stacked preferences would suggest the market is not validating the growth story cleanly.
        - Downgrade the valuation view and refocus on downside protection.
      - - Reliability deterioration
        - Another multi-hour regional outage or slow progress on resilience commitments.
        - Premium infrastructure multiples require trust in production durability.
        - Apply a quality discount even if top-line growth remains strong.
      - - $5B mark without disclosure
        - New private marks rise sharply without matching ARR, margin, or customer-quality disclosure.
        - Multiple expansion without evidence increases down-round risk.
        - Treat later marks as speculative signals, not supportable anchors.
      - - Enterprise conversion stalls
        - Public or diligence evidence shows weak upmarket adoption or poor expansion behavior.
        - Supabase’s premium case depends on monetizing the massive developer funnel.
        - Reframe the company as strong product + weaker monetization, which lowers fair value.
    notes: >-
      Triggers are designed to be monitorable and valuation-relevant, not generic operational concerns.
    claimRefs:
      - CV028
      - CV029
      - CV031
      - CV037
      - CV038
      - CV043
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Current ARR / revenue cadence
        - Monthly or quarterly recurring revenue bridge since the April 2025 round.
        - This is the single biggest driver of whether $2B was fair or stretched.
        - Request management reporting or board materials that reconcile 2025 and 2026 run-rate progression.
      - - Gross margin and infra cost profile
        - Cost of service, support burden, and overage contribution by product surface.
        - Premium infrastructure multiples depend on durable software-like unit economics.
        - Ask for gross margin trend and workload-cost segmentation by database, auth, storage, and networking features.
      - - Enterprise mix and retention
        - NRR, enterprise ARR share, ACV distribution, and concentration.
        - Developer adoption is valuable only if it converts into sticky, expanding spend.
        - Review cohort analysis, top-customer exposure, and plan-tier migration data.
      - - Cap table and preference stack
        - Fully diluted share count, liquidation preferences, secondaries, and any structured terms.
        - Headline valuation can materially overstate common-equity upside if terms are aggressive.
        - Inspect financing docs or a cap-table summary before accepting mark-to-market returns.
      - - Later-round corroboration
        - First-party confirmation of any actual post-Series D $5B financing or credible 2026 process.
        - The valuation narrative changes if a later round truly closed on clean terms.
        - Confirm through company materials, investor letters, or primary financing documents.
    notes: >-
      The diligence asks prioritize the missing inputs most likely to change valuation rather than repeating already visible product or adoption facts.
    claimRefs:
      - CV016
      - CV043
      - CV044
      - CV045
      - CV046
figures:
