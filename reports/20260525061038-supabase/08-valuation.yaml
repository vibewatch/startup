  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Scale and distribution
        - Millions of developers, rising databases created, and strong open-source adoption create a real funnel for monetization.
        - Scale metrics are mostly top-of-funnel and do not disclose paid conversion or revenue quality.
        - Show conversion from registered developers and free projects into paid teams and enterprise contracts.
      - - Enterprise path
        - Compliance, support, PrivateLink, and named enterprise references suggest Supabase can move upmarket.
        - Public sources do not show enterprise ACV, concentration, renewal quality, or NRR.
        - Disclose enterprise ARR mix, cohort retention, and top-customer exposure.
      - - Pricing architecture
        - Usage overages and add-ons can create nonlinear expansion as workloads scale.
        - Infrastructure-heavy usage can also pressure gross margin if pricing is too generous or support too expensive.
        - Publish gross margin and attach-rate data for overages, SSO, logs, and networking add-ons.
      - - Round economics
        - $398M cumulative funding gives runway to grow into the 2025 valuation.
        - Later $5B and $10B signals are weakly corroborated and could reflect optimism outrunning fundamentals.
        - Confirm whether any post-Series D financing actually closed and on what terms.
      - - Reliability and trust
        - Incident transparency and remediation steps are constructive.
        - The February 2026 outage showed infrastructure mistakes can still create platform-wide disruption.
        - Demonstrate incident-free operating performance and clearer multi-region resilience.
    notes: >-
      The anti-thesis is centered on monetization and durability proof, not on whether Supabase has product-market fit.
