  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-disclosure
      missingEvidence: Current audited ARR, NRR, gross margin, and quarterly revenue bridge since the April 2025 Series D.
      whyItMatters: These are the main inputs that would determine whether the $2B anchor was fair or stretched.
      diligencePath: Request management reporting or board-level KPI materials that reconcile monthly recurring revenue, gross margin, and plan-tier mix.
      relatedQuestionRefs:
        - QV029
    - type: private-evidence-only
      severity: material
      topic: cap-table-terms
      missingEvidence: Fully diluted share count, liquidation preferences, secondary structure, and any investor protections tied to the headline valuation.
      whyItMatters: Headline valuation can materially overstate common-equity upside when late-stage terms are aggressive.
      diligencePath: Review the cap table, stock-plan summary, and the latest financing documents before underwriting returns.
      relatedQuestionRefs:
        - QV031
    - type: conflicting-data
      severity: material
      topic: post-series-d-valuation
      missingEvidence: First-party confirmation of whether any post-Series D financing actually closed at $5B or whether current references are still database or market-talk signals.
      whyItMatters: The later-mark narrative changes the valuation framing only if it reflects a real transaction on clean terms.
      diligencePath: Confirm the later-round history through company documents, investor letters, or primary financing records rather than secondary databases alone.
      relatedQuestionRefs:
        - QV032
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set-boundary
      missingEvidence: A broader set of open-source or developer-infrastructure public and late-stage private comps with equally clear revenue disclosure.
      whyItMatters: The selected public-comp table is directionally useful but still a partial sample rather than the whole valuation universe.
      diligencePath: Expand the comparable set only if additional names can be supported with directly observed revenue and market-value data.
      relatedTableRefs:
        - TV004
