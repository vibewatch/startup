artifact: valuation
slug: supabase
runDate: '2026-05-25'
company:
  name: Supabase
chapter:
  number: 8
  title: Valuation
  summary: >-
    The only well-supported valuation anchor for Supabase is the April 2025 $200 million Series D at a $2 billion post-money valuation. Public revenue proxies ranging from roughly $27 million to $70 million imply a wide 29x-74x multiple band, so the round looks plausible only if investors were underwriting very fast continued enterprise conversion; later $5 billion and $10 billion signals remain interesting but too weakly corroborated to replace the $2 billion anchor.
sections:
  - id: latest-supportable-anchor-and-round-economics
    title: Latest supportable anchor and round economics
    body: >-
      The cleanest valuation starting point is still the April 2025 Series D that brought Supabase $200 million at a $2 billion post-money valuation. That anchor is repeated by TechCrunch and Yahoo Finance and is consistent with the company moving up from an approximately $80 million prior round only seven months earlier. The same reporting puts cumulative capital after the round at roughly $398 million, which matters because it gives Supabase real time to grow into the valuation instead of forcing immediate mark-to-market proof. Public operating signals also explain why investors were willing to pay up. At round time, Supabase was already talking about roughly two million developers and 3.5 million managed databases, while current official pages show seven million registered developers, ninety-eight thousand-plus GitHub stars, and more than sixteen million created databases. That scale story supports premium ambition, but it does not by itself reset the valuation anchor. Later database entries and market-data pages that mention $5 billion or even $10 billion should be kept as low-confidence signals, not as the chapter’s core mark, because they are not yet corroborated with the same quality as the disclosed Series D.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
      - CV015
      - CV016
      - CV032
      - CV048
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: revenue-triangulation-and-implied-multiples
    title: Revenue triangulation and implied multiples
    body: >-
      The underwriting problem is not whether Supabase has revenue, but where the true run-rate actually sat when investors paid $2 billion. Public third-party estimates diverge sharply. TapTwice points to about $16 million of 2024 revenue and about $27 million of 2025 revenue, while GetLatka says Supabase had reached $31 million revenue by April 2025 and $70 million by September 2025. Sacra separately estimates about $70 million ARR in 2025, up from roughly $30 million at the end of 2024. Those figures are directionally coherent in one sense, because all of them imply fast growth, but they are not close enough to support precision. At the $2 billion anchor, the implied multiple is roughly 74x on the $27 million figure, roughly 65x on the $31 million figure, and about 29x on the $70 million figure. That is a huge range for one financing mark. Supabase’s monetization model makes the gap more understandable: official pricing shows free, $25 Pro, and $599 Team entry points plus usage charges for storage, egress, point-in-time recovery, SSO, logs, and custom domains, so realized revenue can expand nonlinearly as projects mature into enterprise workloads. Even so, public evidence suggests the round was pricing in future conversion, not merely current disclosed revenue.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV024
      - CV025
      - CV026
      - CV027
      - CV030
