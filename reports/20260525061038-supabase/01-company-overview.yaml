    {
      "id": "founders-governance-and-capital-base",
      "title": "Founders, governance, and capital base",
      "body": "Leadership and capital are easier to anchor than formal governance. The user-provided frame, TechCrunch, Tech Funding News, TapTwice, and Tracxn all identify Paul Copplestone and Ant Wilson as founders, with Copplestone clearly serving as CEO and public face of the company. Public materials also suggest the culture remains strongly founder-shaped: Supabase emphasizes open-source maintainers, ex-founders, and a developer-first operating style, which is helpful for product velocity but also implies key-person dependence on a small founding group. Governance disclosure is materially thinner. The official company surfaces in the retained set do not publish a current board page or control map, and Tracxn’s board listing is only a partial third-party reconstruction. That means even well-correlated fundraising history does not automatically imply public governance transparency. Capital formation, by contrast, is well covered at the latest round. Retained April 2025 reporting supports a $200 million Series D at a $2 billion valuation, following an approximately $80 million prior round roughly seven months earlier. The cleanest investor set across retained coverage is Accel, Coatue, Y Combinator, Craft Ventures, and Felicis, with Y Combinator also visible as an earlier institutional backer. A later Tracxn Series E and $5 billion valuation entry exists, but without first-party corroboration it should remain a flagged conflict, not canonical history.",
