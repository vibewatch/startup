  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Supabase is a remote-first, developer-focused database platform founded in 2020 by Paul Copplestone and Ant Wilson and positioned as an open-source, Postgres-based alternative to Firebase. Retained April 2025 coverage supports a $200 million Series D at a $2 billion valuation with Accel leading and Coatue, Y Combinator, Craft Ventures, and Felicis participating, while official surfaces also show rapid community and enterprise adoption. The same public record is uneven on headquarters, board composition, headcount, revenue, and later-round database entries, and 2026 outage records show operational resilience and communication remain diligence items."
  },
  "sections": [
    {
      "id": "identity-product-and-operating-footprint",
      "title": "Identity, product, and operating footprint",
      "body": "Supabase’s cleanest current identity is not as a generic backend-as-a-service vendor but as a Postgres development platform that tries to give developers a Firebase-like experience with open-source components. The homepage, docs, and GitHub repo all converge on the same architecture story: every project is an isolated Postgres cluster wrapped with authentication, auto-generated APIs, Edge Functions, Realtime, Storage, and vector tooling. The monetization logic is managed cloud plus enterprise upsell rather than closed-source lock-in. Official pricing shows a free tier, a $25 Pro tier, and a $599 Team starting point, while the repo and YC page also emphasize self-hosting and portability. That combination matters because it lets Supabase look simultaneously like open-source infrastructure, a managed developer SaaS product, and a platform that can expand into enterprise accounts without changing its technical center of gravity. Where the identity becomes less crisp is geography. YC and the company page say Supabase is fully remote, independent round coverage calls it San Francisco-based, and Tracxn ties the business to a Singapore legal entity. For diligence, the safest working view is remote-first with unresolved legal and operating HQ distinctions, not a single confidently sourced headquarters claim.",
