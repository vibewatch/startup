tables:
  - id: TE001
    title: "Product module / asset matrix"
    columns:
      - Module / asset
      - Primary user job
      - Current status / maturity
      - Differentiation
      - Main diligence gap
    rows:
      - - Dedicated Postgres database
        - Core app data, SQL, triggers, extensions, and portability
        - Core foundation; present in every project
        - Single Postgres cluster anchors the rest of the product instead of treating database as an add-on
        - No public independent benchmark pack for mixed OLTP plus analytical production workloads
      - - Auth + Data API + RLS
        - User identity, session handling, policy-controlled CRUD access
        - Mature core module with managed pricing and audit-log upsell
        - Authorization lives in JWT plus Postgres RLS, giving one policy model across app and API access
        - Complexity of writing robust RLS policies still shifts some burden onto customers
      - - Storage
        - File, media, analytics, and vector-adjacent object handling
        - Mature, broadening beyond simple blobs
        - S3/REST/TUS support, CDN, image transforms, and policy integration with Postgres
        - Public docs do not fully quantify large-scale durability/performance tiers by workload class
      - - Realtime
        - Collaborative updates, presence, broadcast, and database change streams
        - Mature feature surface with clear use cases
        - Built from Postgres changes plus broadcast and presence rather than a separate sync data model
        - Offline/mobile semantics remain less publicly mature than Firebase-like defaults
      - - Edge Functions
        - Custom backend logic, hooks, webhooks, and low-latency APIs
        - Mature but still operationally sensitive for some workflows
        - Deno-compatible TypeScript runtime with gateway auth handling and local CLI parity
        - Cold starts, pooling, and self-hosted URL assumptions still require care
      - - Vector / AI toolkit
        - Embeddings, semantic search, RAG, and AI-native app storage
        - Fast-growing surface backed by customer evidence
        - Keeps vectors, metadata, auth, and business data inside the same Postgres system
        - Official public evidence is stronger on design wins than on audited retrieval quality or cost curves
      - - Self-hosted deployment
        - Run the stack in isolated or compliance-constrained environments
        - Real and documented, but not feature-parity with managed cloud
        - Open-source posture is genuine and reduces lock-in risk
        - Managed-only features and operator-owned HA/DR limit how enterprise-ready self-hosting is out of the box
    notes: "Rows distinguish what is clearly productized today from the places where managed-cloud maturity or self-hosted parity still depends on follow-up diligence."
