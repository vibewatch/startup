  - id: TE002
    title: "Workflow / use-case table"
    columns:
      - User job
      - Current workflow
      - Supabase solution
      - Measurable benefit / proof
      - Main limitation
    rows:
      - - Launch a full-stack SaaS MVP quickly
        - Small team wants auth, database, API, and storage without backend orchestration
        - Start with one project and turn on Auth, APIs, Storage, and Functions around the same Postgres cluster
        - Resend and Xendit describe shipping quickly without building backend plumbing first
        - Public proof is mostly curated customer narrative, not neutral implementation studies
      - - Replace middleware-heavy CRUD backends
        - Team wants relational data plus policy-controlled APIs with less custom glue code
        - Use PostgREST, Auth tokens, and RLS to expose app data safely
        - Maergo cut codebase size sharply and reduced deployment times to seconds
        - RLS and schema design still need database literacy to avoid misconfiguration
      - - Build AI / RAG products on one data system
        - Developer wants vectors, metadata, files, and auth together
        - Use pgvector plus Storage/Auth/Functions on the same platform
        - Chatbase, Markprompt, Quivr, Firecrawl, and Humata all describe consolidation benefits
        - Best public proof is customer-side; independent production benchmarks remain thin
      - - Support regulated or security-reviewed buyers
        - Team needs private networking, auditability, SSO, and compliance artifacts
        - Move up to Team or Enterprise with PrivateLink, audit logs, roles, and certificate access
        - Enterprise page and ISO post materially improve procurement posture
        - PrivateLink currently covers database connectivity only, not the whole Supabase surface
      - - Scale read-heavy or analytics-heavy applications
        - Workload grows beyond single-instance simplicity
        - Use bigger compute first or add read replicas to isolate analytics and regional reads
        - Chatbase and Resend both align with the replica and scaling story in public materials
        - Write-heavy or cross-region failover needs are not solved by replicas alone
    notes: "This table maps concrete builder jobs to the product bundle; it intentionally separates rapid-build proof from the less-corroborated claim of enterprise-grade maturity."
