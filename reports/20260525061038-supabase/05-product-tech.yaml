  - id: postgres-centric-architecture-extensibility-and-self-hosting
    title: "Postgres-centric architecture, extensibility, and self-hosting"
    body: "The architectural differentiator is coherence. Supabase’s own repo and docs show an opinionated stack where PostgREST, GoTrue, Realtime, Storage, pg_graphql, postgres-meta, and Kong are assembled around an isolated Postgres cluster rather than exposed as disconnected managed services. Auth stores state in Postgres and pushes authorization into JWT plus row-level security; Storage also inherits policy semantics from the database; Realtime rides Postgres change streams; and Edge Functions are routed through a gateway that applies auth and traffic rules before code runs on a Deno-compatible edge runtime. This is a stronger technical story than generic “backend as a service” marketing because it explains why teams can share data models, policies, and operational context across modules. Self-hosting extends that posture, but with real caveats. Supabase officially supports Docker-based self-hosting for teams that need control, compliance, or isolation, yet the same docs are explicit that managed-only capabilities like branching, advanced metrics, managed backups/PITR, analytics/vector buckets, ETL, and the management API do not come along for free. In practice, Supabase’s openness is real, but enterprise-grade self-hosting still requires meaningful operator competence."
    claimRefs:
      - CE004
      - CE008
      - CE010
      - CE011
      - CE012
