  - id: TE004
    title: "Trust / quality / compliance table"
    columns:
      - Control / signal
      - Status
      - Scope
      - What it supports
      - Remaining gap
    rows:
      - - ISO/IEC 27001:2022 certification
        - Officially announced
        - ISMS across Database, Auth, Storage, Realtime, Edge Functions, and Data API
        - Helps security reviews and procurement for international buyers
        - Certification is necessary but not sufficient evidence of runtime reliability
      - - Security defaults and remediation tooling
        - Publicly documented
        - RLS-by-default for dashboard tables, event-trigger patterns, Security Advisors, Assistant workflows
        - Moves security earlier into developer workflow and reduces accidental exposure
        - Public proof does not quantify how often customers still misconfigure policies in practice
      - - Modern key management
        - Publicly documented
        - Publishable keys, revocable secret keys, asymmetric JWT support, GitHub leak revocation
        - Improves rotation, auditability, and blast-radius control
        - Legacy key migration is still ongoing through late 2026
      - - Private networking
        - Beta / limited release
        - AWS-only PrivateLink for Postgres and PgBouncer on Team or Enterprise
        - Reduces public attack surface and supports regulated workloads
        - Does not yet cover API, Storage, Auth, or Realtime endpoints
      - - Enterprise controls and support
        - Commercially available
        - Audit logs, access roles, network restrictions, designated experts, support coverage
        - Improves enterprise adoption readiness and migration confidence
        - Public evidence is descriptive rather than SLA-level operationally audited
      - - Incident transparency and resilience posture
        - Visible but mixed
        - Detailed February 2026 postmortem, public status page, explicit acknowledgement of failover gap
        - Good transparency and root-cause disclosure
        - A real platform-wide outage and no automatic cross-region failover keep resilience as an active risk
    notes: "Controls are increasingly legible to enterprise buyers, but the table separates governance posture from the still-open question of hard runtime resilience under multi-region failure scenarios."
    claimRefs:
