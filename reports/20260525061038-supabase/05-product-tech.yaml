  - id: enterprise-packaging-platform-velocity-and-scaling-signals
    title: "Enterprise packaging, platform velocity, and scaling signals"
    body: "Supabase now presents itself as more than an indie-developer shortcut. Pricing and enterprise pages show a clear migration path from self-serve usage to governance-heavy accounts, with SSO, audit logs, custom roles, PrivateLink, longer log retention, designated support, SLAs, and compliance help attached to higher tiers. The last year of public technical evidence also shows credible platform motion rather than static feature marketing. Official materials cover ISO 27001 certification, a 2025 security hardening cycle with concrete 2026 roadmap items, PrivateLink beta for private database connectivity, and more explicit read-replica guidance for analytics isolation and regional latency. Customer stories reinforce that these are not purely theoretical modules. Chatbase is planning replica-based analytics isolation, Humata used enterprise support around a large vector workload, Resend cites partitioning and replicas for scale, and Markprompt plus Firecrawl show that the vector stack can support production AI use cases without forcing a separate vector database. The main caveat is that many of these performance proofs remain curated customer narratives rather than independently audited operating benchmarks."
