  - id: trust-controls-outages-and-technical-risk
    title: "Trust controls, outages, and technical risk"
    body: "The trust picture is improving, but it is not frictionless. On the positive side, Supabase now publicly documents ISO 27001 scope across the platform, default RLS protections for new dashboard tables, key rotation and leak-revocation changes, security advisors, private networking, and a standing external testing and disclosure program. Those are meaningful signals for procurement and production adoption. The limiting factor is that reliability and operational maturity still show visible seams. The February 2026 us-east-2 outage was a true platform-wide event caused by Supabase’s own deployment controls, and the company acknowledged that automatic cross-region failover for customer Postgres was not yet available. The public status page also records network/provider access issues and ongoing pooler maintenance work. Meanwhile, GitHub issues show recurring developer friction in areas that matter to production trust: opaque auth email rate limits, persistent PostgREST schema-cache failures on RPC paths, and cloud-shaped Edge Function URL generation that breaks self-hosted cron flows. The resulting judgment is constructive but cautious: Supabase looks materially stronger on controls and transparency than many developer platforms, yet its weakest link is still operational sharp edges around the exact moments customers most need infrastructure to disappear into the background."
