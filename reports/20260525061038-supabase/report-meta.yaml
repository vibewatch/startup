companyProfile:
  summary: Supabase is a San Francisco-based open-source backend platform founded in 2020 by Paul Copplestone and Ant Wilson. The company packages Postgres, authentication, realtime subscriptions, storage, auto-generated APIs, edge functions, and vector capabilities into a hosted or self-hosted developer platform, then monetizes through usage-based cloud plans and enterprise governance and support features. Public evidence shows unusually strong developer distribution and credible enterprise adoption, but the company still discloses limited financial detail.
