  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Supabase's risk profile is dominated by three linked issues: managed-cloud reliability that is now visibly stress-tested by a major 2026 outage, monetization and competitive pressure around converting a vast open-source funnel into durable higher-tier revenue, and governance/disclosure opacity that leaves funding, revenue, and concentration harder to underwrite than brand momentum suggests. Security and compliance mitigants are real, but contractual asymmetry, AWS-specific dependencies, and incomplete public conversion or resilience disclosures keep residual risk high rather than merely theoretical."
  },
  "sections": [
    {
      "id": "reliability-and-operational-risk",
      "title": "Reliability and operational risk are now evidenced, not hypothetical",
      "body": "The biggest downside in the current record is operational fragility in the managed platform. Supabase's February 2026 us-east-2 incident was not a narrow degradation: it took databases, auth, storage, functions, realtime, and related services offline for 3 hours and 42 minutes because an internal deployment enabled AWS VPC Block Public Access at the regional level. The incident matters less because outages happen and more because the company also disclosed that automatic cross-region failover for customer Postgres still does not exist. Status materials then show a second class of risk: network-path dependence outside Supabase's direct control, including the Brazil access issue that left customers relying on VPN workarounds while the company chased an ISP. GitHub issues add a third layer of evidence. The adverse examples are not all the same bug; they span opaque auth email throttling, persistent RPC schema-cache corruption, and self-hosted edge-function URL assumptions. Read replicas and bigger-compute guidance are useful mitigants, but they do not erase the fact that operational sharp edges still sit on core paths customers assume should simply work.",
