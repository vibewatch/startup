      "id": "governance-disclosure-and-key-person-risk",
      "title": "Governance and disclosure risk is less about scandal than about under-specified underwriting inputs",
      "body": "Supabase's governance problem in public diligence is opacity rather than obvious misconduct. The company is private, so investors are forced to triangulate business health through a mix of company marketing pages and third-party databases that do not agree cleanly. The official company page still says Supabase has raised over $116 million, while TechCrunch, TechFundingNews, and Fortune/Yahoo coverage of the 2025 Series D point to roughly $398 million total funding at a $2 billion valuation. Tracxn goes further and reports a later 2025 Series E, $544 million total funding, and a $5 billion valuation. User metrics also move depending on the source: two million developers in one financing article, 7M+ registered developers on the company page, and eight million developers in the 100k-stars post. None of those figures necessarily proves deception, but together they show that the market lacks one authoritative, current operating baseline. The same pattern applies to revenue and concentration: third-party estimates exist, yet there is no public audited revenue, no retention disclosure, and no clean plan-mix data. Combined with a founder- and community-led narrative, that leaves key-person and disclosure risk materially higher than the brand polish suggests.",
