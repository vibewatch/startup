    {
      "id": "underwriting-blockers-and-adverse-evidence",
      "title": "Underwriting blockers and adverse evidence",
      "body": "The key financial risk is not visible distress but disclosure insufficiency layered on top of operational obligations. Supabase publishes enough to understand pricing architecture, product breadth, customer enthusiasm, and financing history, but it still withholds the metrics a serious investor would need to underwrite revenue quality: cash, burn, gross margin, realized pricing, retention, concentration, and net revenue expansion. The adverse evidence matters because it hints at the hidden cost base. The February 2026 outage lasted 3 hours and 42 minutes and came from Supabase's own deployment controls, not an external attack or AWS-wide failure. The post also admitted that automatic cross-region failover for customer Postgres databases was not yet available. Separate GitHub issues show that rate-limit behavior and schema-cache bugs can still create friction for paying users, which implies real support and product-hardening expense. Even filing visibility is limited: Tracxn exposes only an entity-level Singapore revenue datapoint, while direct OpenCorporates retrieval was challenge-blocked during this run. The result is a constructive but incomplete verdict: recurring infrastructure software economics are plausible and the balance-sheet cushion looks meaningful, but rigorous underwriting stops well short of a defendable model.",
