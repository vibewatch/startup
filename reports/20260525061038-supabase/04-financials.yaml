    {
      "id": "capital-base-and-cost-structure-clues",
      "title": "Capital base, war chest, and cost-structure clues",
      "body": "The capital story is clearer than the operating statement. For this chapter, the correct anchor remains the April 2025 $200 million Series D at a $2 billion valuation, with Accel leading and Coatue, Y Combinator, Craft Ventures, and Felicis participating. That frame implies roughly $396 million to $398 million of cumulative capital after the round, which is a meaningful war chest for a software infrastructure company even though no public source discloses the actual cash balance. The complication is that Tracxn later records a March 2025 Series D of $202 million and an October 2025 Series E of $143 million at a $5 billion valuation. Without first-party corroboration, those database entries should stay flagged as conflicts rather than replace the canonical financing history. On cost structure, the public evidence points toward software-like economics with real infrastructure sensitivity. Supabase's own scaling guide shows compute tiers from $10 per month to $3,730 per month and frames read replicas, bigger compute, indexing, and analytics isolation as explicit cost-performance choices. Customer evidence from Chatbase shows that successful workloads can hit IOPS and throughput ceilings, which means gross margin will depend on cloud efficiency, support intensity, and enterprise-scale reliability investments rather than on purely fixed software delivery.",
