    {
      "id": "public-traction-topline-and-headcount-signals",
      "title": "Public traction, topline signals, and headcount gaps",
      "body": "Supabase has enough public adoption evidence to suggest real commercial scale, but not enough clean disclosure to build a dependable topline model. The sharpest problem is that no retained official source discloses company revenue or ARR. Instead, outsiders are left triangulating between Sacra's estimate of roughly $70 million ARR in 2025 and TapTwice's estimate of roughly $16 million of 2024 revenue and $27 million of 2025 revenue. Those figures are directionally useful but not apples to apples, so they should be treated as a rough public band rather than a valuation-grade number. Headcount is similarly unresolved: public third-party estimates range from about 124 employees on TapTwice to 351 on Tracxn in 2026. Customer stories do show why monetization plausibly exists at scale. Shotgun, Good Tape, Chatbase, Maergo, Voypost, Markprompt, and Mobbin all describe meaningful cost, productivity, or growth outcomes on top of Supabase. Those stories support product value and buyer willingness to pay, but they remain curated case studies, not audited cohort data on Supabase's own retention, margin, or collections quality.",
