  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a broad range around the $2B anchor, with the center of gravity still below later $5B
      chatter.
    data:
      items:
        - label: Bear public-evidence range
          low: 0.4
          mid: 0.55
          high: 0.7
          unit: USD bn
        - label: Base public-evidence range
          low: 1.1
          mid: 1.45
          high: 1.8
          unit: USD bn
        - label: Bull public-evidence range
          low: 2
          mid: 2.5
          high: 3
          unit: USD bn
        - label: April 2025 anchor
          low: 2
          mid: 2
          high: 2
          unit: USD bn
        - label: Uncorroborated later mark
          low: 5
          mid: 5
          high: 5
          unit: USD bn
    approximationNotes: The last item is included as a conflicting outside-band signal rather than as an endorsed valuation anchor.
    claimRefs:
