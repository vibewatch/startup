            body: >
              The value case is most persuasive where Supabase helps buyers collapse multiple backend tools into a
              single Postgres-centered system. Across the retained stories, buyers repeatedly cite the same economic
              benefits: faster initial shipping, fewer vendors, lower infrastructure cost, less custom middleware,
              easier support, and fewer operational burdens for small engineering teams. The metrics are concrete:
              Shotgun cut database-related spend from more than $12,000 per month to $2,155 per month; Good Tape reduced
