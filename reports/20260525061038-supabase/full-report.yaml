      - number: '8.2'
        title: Revenue triangulation and implied multiples
        blocks:
          - type: paragraph
            body: >-
              The underwriting problem is not whether Supabase has revenue, but where the true run-rate actually sat
              when investors paid $2 billion. Public third-party estimates diverge sharply. TapTwice points to about $16
              million of 2024 revenue and about $27 million of 2025 revenue, while GetLatka says Supabase had reached
              $31 million revenue by April 2025 and $70 million by September 2025. Sacra separately estimates about $70
              million ARR in 2025, up from roughly $30 million at the end of 2024. Those figures are directionally
              coherent in one sense, because all of them imply fast growth, but they are not close enough to support
              precision. At the $2 billion anchor, the implied multiple is roughly 74x on the $27 million figure,
              roughly 65x on the $31 million figure, and about 29x on the $70 million figure. That is a huge range for
              one financing mark. Supabase’s monetization model makes the gap more understandable: official pricing
              shows free, $25 Pro, and $599 Team entry points plus usage charges for storage, egress, point-in-time
              recovery, SSO, logs, and custom domains, so realized revenue can expand nonlinearly as projects mature
              into enterprise workloads. Even so, public evidence suggests the round was pricing in future conversion,
              not merely current disclosed revenue.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
