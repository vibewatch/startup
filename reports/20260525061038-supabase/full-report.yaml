  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing model and revenue architecture
        blocks:
          - type: paragraph
            body: >-
              Supabase's revenue model is easiest to understand as a managed-cloud subscription ladder wrapped around
              Postgres infrastructure, with enterprise upsell layered on top of usage-based expansion. Official pricing
              supports a wide funnel: free entry, a $25 per month Pro plan, a $599 per month Team starting point, and
              custom enterprise sales above that. Importantly, the list-price story is not only seat-like SaaS. The
              public page also shows variable monetization through database disk, egress, point-in-time recovery
              retention, phone MFA, and SSO-related active-user charges. That means realized revenue should be a mix of
              base subscriptions, usage overages, and negotiated enterprise packages rather than one flat platform fee.
              The architecture also affects pricing power. Supabase still leans on open-source and self-hostable
              posture, which helps acquisition and trust but can limit lock-in relative to a fully proprietary backend.
              Enterprise and customer-proof pages do show credible willingness to pay for compliance, support, and
              scale, yet public materials still reveal list pricing rather than realized discounting, ACV, or renewal
              quality.
