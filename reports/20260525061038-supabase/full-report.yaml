      - number: '1.3'
        title: Scale, milestones, and operational caveats
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence for Supabase is abundant but not perfectly normalized, so later chapters should
              reuse it carefully. Official surfaces currently show 7 million-plus registered developers, 98,000-plus
              GitHub stars, 190,000-plus followers, 47,000-plus SupaTroopers, and more than 16 million databases created
              with 90,000-plus launched daily. A later company blog says the project crossed 100,000 GitHub stars and
              eight million developers, while financing coverage cites 1.7 million to 2 million developers and 3.5
              million database environments. Those are too inconsistent to collapse into one clean comparable metric,
              but directionally they all point to large and still-growing adoption. Enterprise proof points are also
              meaningful even when customer economics remain company-curated: official pages name GitHub, PwC, Mozilla,
              and Epsilon3, and customer stories cite one million users reached in seven months for one auth deployment
              and 83% cost reduction in another migration. Milestones since founding include the enterprise motion, the
              2024 prior financing, the 2025 Series D, 2025 security hardening, and the 2026 incident record. The most
              material adverse signals in retained sources are the February 2026 us-east-2 outage, the May 2026 Brazil
              access issue, and open GitHub complaints around rate limits, schema cache behavior, and self-hosted URL
              handling. Exact headcount, exact revenue, and direct customer-review sentiment remain under-supported or
              contradictory.
