      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Preserved Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are not abstract TAM narratives but concrete shifts in how software teams
              build products. Postman's 2025 data shows APIs becoming revenue-critical and AI-native, while Stack
              Overflow, DB-Engines, and JetBrains all support the view that PostgreSQL and other open-source databases
              remain central to the working developer stack. Those conditions favor Supabase's Postgres-first platform
              story. Open-source control and self-hosting also matter for some buyers because they preserve exit options
              and data residency that fully Google-hosted alternatives cannot. The constraints are equally real.
              Governance-heavy customers only expand when trust, compliance, and support tiers are credible; switching
              costs rise once auth, policies, data, and edge workloads are wired into production; and Supabase's
              database-centric model assumes more SQL literacy than a more abstracted mobile BaaS. Cost dynamics cut
              both ways too: Firebase-like usage pricing can be cheaper for small apps, while flatter platform pricing
              is easier to forecast once real-time traffic scales. The unresolved diligence issue is category clarity
              itself. Public sources still disagree on whether Supabase should be sized as BaaS, managed Postgres, or a
              broader app platform, and public pricing evidence remains too uneven to support a fully normalized
              competitor TCO curve without additional direct vendor inputs.
