  - id: FR001
    title: Risk heatmap — Supabase key risks by likelihood and impact
    type: matrix
    layout: wide
    summary: >-
      The riskiest cells are occupied by managed-platform reliability, monetization opacity under competitive pressure,
      and governance/disclosure uncertainty rather than a single existential legal event.
    approximationNotes: >-
      Likelihood and impact are author assessments synthesized from public evidence as of 2026-05-25. Each cell lists
      the dominant named risk for that combination rather than every possible sub-risk.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Impact
          values:
            - Regulatory enforcement surprise
            - No automatic failover during next major incident
            - Managed-platform outage / conversion hit
        - label: High Impact
          values:
            - Key-person disruption
            - AWS / vendor dependency shock
            - Monetization opacity under competitive pressure
        - label: Medium Impact
          values:
            - Contractual dispute process
            - Self-hosting execution drag
            - Disclosure inconsistency and KPI drift
        - label: Low Impact
          values:
            - Routine feature bugs
            - Procurement-cycle friction
            - Minor pricing confusion
