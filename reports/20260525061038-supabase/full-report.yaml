  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Supabase’s customer motion moves from developer discovery and self-serve activation toward module attachment and
      enterprise controls.
    data:
      nodes:
        - id: f1
          label: Developer discovery
          detail: Community, docs, GitHub visibility, and customer stories attract builders evaluating backend options.
        - id: f2
          label: Self-serve project start
          detail: A customer starts on Free or Pro to prove auth, database, API, or vector functionality quickly.
        - id: f3
          label: First production deployment
          detail: >-
            The account puts a real workload into production, often after migration from another backend or stitching
            multiple tools.
        - id: f4
          label: Multi-product attachment
          detail: Successful accounts add storage, vector, edge functions, read replicas, backups, or broader team usage.
        - id: f5
          label: Governance and support step-up
          detail: Security review, SSO, audit logs, PrivateLink, self-hosting, or designated support become relevant.
        - id: f6
          label: Higher-value ongoing account
          detail: >-
            Expansion can create a larger and stickier customer, but Supabase does not disclose the actual conversion or
            renewal rates.
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
