      - number: '7.3'
        title: Security, compliance, and legal posture is improving, but residual burden still sits with customers
        blocks:
          - type: paragraph
            body: >-
              Supabase deserves credit for building a materially stronger public security and compliance story than many
              developer platforms. The company now points to ISO 27001 coverage across its major services, PrivateLink
              for private database connectivity, a 2025 security hardening cycle around key rotation and RLS defaults,
              and a security page that makes HIPAA and backup posture more concrete. Those mitigants matter. They do not
              remove the risk that compliance-heavy buyers still face meaningful diligence and contractual asymmetry.
              Supabase's privacy notice says it acts as a controller for its own service data and a processor for
              customer data, with transfers that may involve the United States and Singapore. European Commission and
              HHS materials make clear that GDPR-style transfer safeguards and HIPAA-style administrative, technical,
              and breach-response duties are not solved by infrastructure marketing alone. Supabase's own terms
              reinforce that point: PHI requires a BAA, service can be suspended for security or vendor reasons,
              warranties are broadly disclaimed, liability is capped, and disputes are routed into arbitration. The net
              effect is a better procurement posture than before, but not a low-friction compliance posture for
              regulated or high-liability deployments.
