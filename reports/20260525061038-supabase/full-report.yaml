  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reliability and operational risk are now evidenced, not hypothetical
        blocks:
          - type: paragraph
            body: >-
              The biggest downside in the current record is operational fragility in the managed platform. Supabase's
              February 2026 us-east-2 incident was not a narrow degradation: it took databases, auth, storage,
              functions, realtime, and related services offline for 3 hours and 42 minutes because an internal
              deployment enabled AWS VPC Block Public Access at the regional level. The incident matters less because
              outages happen and more because the company also disclosed that automatic cross-region failover for
              customer Postgres still does not exist. Status materials then show a second class of risk: network-path
              dependence outside Supabase's direct control, including the Brazil access issue that left customers
              relying on VPN workarounds while the company chased an ISP. GitHub issues add a third layer of evidence.
              The adverse examples are not all the same bug; they span opaque auth email throttling, persistent RPC
              schema-cache corruption, and self-hosted edge-function URL assumptions. Read replicas and bigger-compute
              guidance are useful mitigants, but they do not erase the fact that operational sharp edges still sit on
              core paths customers assume should simply work.
            claimRefs:
              - CR001
