  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, archetypes, and likely budgets
        blocks:
          - type: paragraph
            body: >
              Supabase’s customer base is best understood as a layered funnel rather than one homogeneous buyer segment.
              At the low end, it clearly serves solo developers, hobbyists, and early-stage founders who can start on
              free or low-cost managed plans and get database, auth, storage, and functions in one place. The named
              stories then show a second layer of startup and SMB buyers using Supabase as production infrastructure:
              AI-native products such as Chatbase, Markprompt, Firecrawl, Quivr, and Humata; developer infrastructure
              companies such as Resend; and digital product teams such as Good Tape, Mobbin, Voypost, Shotgun, and
              Maergo. A third layer is more procurement-heavy and enterprise-skewed: GitHub Next, Mozilla, PwC, and
              Epsilon3 are all presented on official enterprise surfaces, with compliance, self-hosting, security
              review, and support features positioned for larger accounts. The only supportable budget anchors are
              official list prices—Free, Pro at $25 per month, Team from $599 per month, and custom Enterprise. That
              means likely annual customer spend ranges from effectively self-serve experimentation up to Team and
              Enterprise contracts, but Supabase does not publicly disclose ACV, customer count by plan, or what share
              of revenue comes from larger regulated buyers.
