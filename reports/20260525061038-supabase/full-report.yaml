  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk if weak
    rows:
      - - Isolated Postgres cluster per project
        - System of record for relational data, extensions, and core policy state
        - Managed Postgres operations and extension compatibility
        - If Postgres operations lag, nearly every higher-level module degrades together
      - - Auth + JWT + RLS path
        - Creates identities and scopes database/API access through policy
        - GoTrue, JWT signing, Postgres schemas, and customer-written RLS policies
        - Weak defaults or poor policy ergonomics can create security exposure or developer churn
      - - API layer via PostgREST / gateway
        - Turns database objects into application-facing APIs and centralizes traffic handling
        - PostgREST, Kong, auth headers, and schema state
        - Schema-cache or gateway failures can break broad swaths of application functionality
      - - Realtime change and presence pipeline
        - Converts database changes and ephemeral events into websocket-delivered updates
        - Logical replication, Realtime service, and authorized client subscriptions
        - If laggy or brittle, collaboration and live UX claims weaken quickly
      - - Edge runtime and automation path
        - Runs low-latency TypeScript functions and hooks near users
        - Edge gateway, Deno-compatible runtime, secrets, and safe Postgres connectivity patterns
        - Operational footguns around URL generation, pooling, or cold starts can surface in production
      - - Managed-vs-self-hosted control plane split
        - Determines which governance, backup, metrics, and platform APIs customers actually get
        - Docker/self-host support, docs, and enterprise support motion
        - Customers can overestimate parity and under-budget for operator work in self-hosted environments
    notes: >-
      The architecture is coherent because most modules terminate back into Postgres; the main diligence question is not
      whether the pieces exist, but where operational coupling becomes a shared failure mode.
    claimRefs:
      - CE002
