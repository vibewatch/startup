  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Revenue required to support a $2B value changes materially depending on which public multiple investors use as
      reference.
    data:
      items:
        - label: Cloudflare multiple (~32.5x)
          value: 61.5
          detail: Revenue required in USD millions
        - label: Datadog multiple (~20.6x)
          value: 97
          detail: Revenue required in USD millions
        - label: 20x reference
          value: 100
          detail: Simple round-number benchmark
        - label: Snowflake multiple (~12.5x)
          value: 160.4
          detail: Revenue required in USD millions
        - label: MongoDB multiple (~9.7x)
          value: 206.2
          detail: Revenue required in USD millions
    approximationNotes: >-
      Values are derived by dividing the $2B anchor by each selected multiple; they are support thresholds, not
      forecasts.
