  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitute Set
        blocks:
          - type: paragraph
            body: >-
              Supabase's market boundary is narrower than headline database or backend infrastructure markets and is
              easiest to define from the product bundle buyers actually evaluate. Official surfaces present one Postgres
              project wrapped with authentication, instant APIs, edge functions, realtime, storage, and vector tooling.
              That means included spend is the budget for a developer team that wants one managed data layer plus core
              backend primitives, usually before it staffs a specialized platform or database team. Excluded spend
              includes generic IaaS, pure database administration tooling, analytics warehouses, and many enterprise
              DBaaS contracts that solve very different operating problems. The closest full-stack substitute remains
              Firebase, but Bytebase's 2026 comparison shows the choice is no longer a clean SQL-versus-NoSQL split
              because Firebase Data Connect has added a managed PostgreSQL path. Outside that core ring, the substitute
              set fragments: Neon and PlanetScale are stronger database-layer alternatives; Appwrite is the nearest
              open-source full-stack peer; Amplify, Railway, and Render pull budgets from broader app-platform lines;
              and Hasura is more data/API adjacency than a full Supabase replacement. That boundary logic matters
              because a broader frame can make the market look larger than the budget pools Supabase directly competes
              to win.
