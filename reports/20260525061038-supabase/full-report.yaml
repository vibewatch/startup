              - CV041
              - CV042
      - number: '8.4'
        title: Scenario range and what would move the multiple
        blocks:
          - type: paragraph
            body: >-
              A practical valuation view is to frame Supabase in scenarios rather than pretend the public record
              supports one precise number. In the bear case, monetization proves closer to $40 million to $60 million of
              revenue and the market treats Supabase more like a solid but still maturing infrastructure asset at
              roughly 10x-12x, which yields about $0.4 billion to $0.7 billion of value. In the base case, Supabase is
              already nearer $80 million to $100 million of revenue, retains premium growth, and supports something like
              a 14x-18x multiple, which points to roughly $1.1 billion to $1.8 billion. In the bull case, enterprise
              conversion accelerates, ARR pushes into roughly $120 million to $150 million, and the market continues to
              reward developer-infrastructure scarcity at around 17x-20x, which can support about $2.0 billion to $3.0
              billion. What moves the multiple upward is not just more signups; it is evidence that free developer scale
              is converting into large enterprise contracts with strong retention, acceptable infrastructure economics,
              and enough reliability to justify mission-critical workloads. What moves it downward is the opposite:
              another stretch round without disclosed economics, weak enterprise monetization, or recurring operational
              incidents that make the platform feel less durable than the valuation assumes.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV033
              - CV034
              - CV035
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
