      - number: '2.2'
        title: Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              There is no public, universally accepted market report for "Postgres development platforms," so classic
              TAM/SAM/SOM treatment has to stay cautious. The broadest retained benchmark is Sacra's citation of a $23.3
              billion backend-as-a-service market, but that supercategory is too expansive to serve as Supabase's direct
              TAM because it sweeps in products and workloads that do not resemble a Postgres-first development stack.
              Grand View's public DBaaS landing page, meanwhile, is too teaser-heavy in the retained fetch to provide a
              usable open-methodology benchmark. The stronger sizing method is a bottom-up buyer-budget lens. Public
              retained pricing shows comparable platforms clustering around free entry, low double-digit or roughly $25
              monthly production entry points, and a much steeper step-up once team controls, auditability, support, or
              compliance enter. Supabase's own visible anchors remain Free, $25 Pro, and $599 Team. Against those
              budgets, the company's estimated $70 million ARR and 1.7-2.0 million developers indicate that adoption
              breadth is already meaningful, but monetization relative to broad category spend is still early. The right
              diligence takeaway is not that Supabase can claim every BaaS or DBaaS dollar, but that it sits inside a
              real, expanding developer budget corridor whose public price and adoption thresholds are observable even
              when top-down market taxonomies are not.
