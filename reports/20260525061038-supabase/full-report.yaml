  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated product surface and developer workflow
        blocks:
          - type: paragraph
            body: >-
              Supabase is not selling a single database feature so much as a tightly bundled backend operating surface
              built around Postgres. The official homepage, docs, YC profile, and pricing all describe the same core
              pattern: each project starts with a Postgres database and layers authentication, auto-generated APIs, edge
              compute, realtime synchronization, storage, and vector tooling on top. That matters because the buyer
              workflow is unusually short. A small team can stand up auth, relational data, file handling, and
              server-side logic without stitching together multiple control planes. Customer evidence shows how that
              bundle gets used in practice. Xendit shipped a sanctions-screening workflow in under a week on full
              Postgres plus extensions, Maergo replaced heavy middleware with PostgREST, and Chatbase, Markprompt, and
              Quivr used the same integrated stack for AI and retrieval workloads. The product packaging also mirrors
              the workflow: free and low-end plans expose the full shape of the platform, while usage and governance
              features scale upward rather than forcing an early architectural rewrite.
