  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation stays cautious because strong distribution and financing signals are offset by revenue-opacity
      and reliability-proof gaps.
    data:
      nodes:
        - id: scale
          label: Millions of developers and large database footprint support a premium narrative
        - id: anchor
          label: April 2025 Series D at $2B is the only well-supported valuation anchor
        - id: opacity
          label: Public revenue estimates span roughly $27M to $70M, capping precision
        - id: comps
          label: Public comp band implies ~$62M-$206M revenue support for a $2B value
        - id: risk
          label: Reliability and cap-table unknowns add downside to headline price
        - id: call
          label: 'Recommendation: research-more; $2B is plausible but not clearly cheap'
      edges:
        - from: scale
          to: call
          label: supports staying engaged
        - from: anchor
          to: call
          label: gives a clean base mark
        - from: opacity
          to: call
          label: caps confidence
        - from: comps
          to: call
          label: demands more revenue proof
        - from: risk
          to: call
          label: requires diligence discount
    approximationNotes: The flow is qualitative and encodes the chapter’s reasoning chain rather than a weighted scoring model.
