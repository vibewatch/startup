  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public customer proof is strongest on production anecdotes and weakest on independently auditable retention and
      satisfaction.
    data:
      columns:
        - Self-serve / startup buyer
        - AI-native growth company
        - Enterprise / institutional buyer
        - Durability blind spot
      rows:
        - label: Production proof
          values:
            - High — many stories describe real migrations or live apps
            - High — Chatbase, Markprompt, Firecrawl, Quivr, and Humata are concrete AI workloads
            - Medium — GitHub, Mozilla, PwC, and Epsilon3 are named but often with less deployment detail
            - Low — no public renewal cohort by segment
        - label: Outcome specificity
          values:
            - Medium — speed and cost wins recur across stories
            - High — several AI stories cite usage, embeddings, or paying-customer counts
            - Medium — support, security, and self-hosting benefits are described but not independently audited
            - Low — customer lifetime value and realized expansion remain opaque
        - label: Independent corroboration
          values:
            - Low — most evidence is authored by Supabase
            - Low-to-medium — some customer-domain context exists, but not much deployment detail
            - Low — official enterprise page is helpful but still company-controlled
            - Low — G2 and TrustRadius were blocked during this run
        - label: Trust / reliability exposure
          values:
            - Medium — outages matter once projects leave prototype mode
            - Medium-to-high — AI support and data workflows depend on reliability during growth
            - High — procurement-sensitive buyers will scrutinize the 2026 outage and later status issues closely
            - High — public incident and issue evidence is more auditable than churn evidence
        - label: Overall proof quality
          values:
            - Good — enough to show real production use
            - Good — especially strong for AI-native workloads
            - Moderate — logos plus some quotes, but less independent enterprise documentation
            - Moderate — durability conclusion remains incomplete without retention and concentration data
