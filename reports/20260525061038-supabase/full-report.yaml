      - number: '7.5'
        title: Mitigants are real, but the risk view only improves if operational and disclosure evidence gets sharper
        blocks:
          - type: paragraph
            body: >-
              This is not a thesis that collapses under one bad status page or one legal clause. Supabase has clear
              mitigating assets: a very large developer community, recent capital access, enterprise packaging, improved
              security defaults, ISO certification, private networking, read-scaling guidance, and a roadmap that openly
              names the gaps it still intends to close. The problem is that the strongest mitigants are either gated to
              larger accounts, dependent on AWS or customer implementation discipline, or still partly forward-looking.
              The watch-items are therefore straightforward. Reliability risk falls if Supabase demonstrates a clean
              post-February 2026 operating record and publishes clearer failover and multi-region guidance.
              Business-model risk falls if management discloses plan mix, enterprise conversion, concentration, and a
              canonical funding and revenue baseline. Governance risk falls if the public facts stop moving across
              company and third-party surfaces. Until then, the prudent stance is to treat the company as high-potential
              but still high-residual-risk: strong enough to merit continued diligence, not transparent enough to
              underwrite on narrative alone.
