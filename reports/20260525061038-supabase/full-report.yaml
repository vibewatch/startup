  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Why it matters
      - Action implication
    rows:
      - - Weak monetization proof
        - Evidence points to ARR or revenue still below roughly $60M on a sustained basis.
        - That level struggles to support $2B except under unusually aggressive multiple assumptions.
        - Treat the 2025 mark as stretched and avoid underwriting upside without a price reset.
      - - Flat or down financing
        - Next round prices at or below $2B or relies on heavily structured terms.
        - A flat headline or stacked preferences would suggest the market is not validating the growth story cleanly.
        - Downgrade the valuation view and refocus on downside protection.
      - - Reliability deterioration
        - Another multi-hour regional outage or slow progress on resilience commitments.
        - Premium infrastructure multiples require trust in production durability.
        - Apply a quality discount even if top-line growth remains strong.
      - - $5B mark without disclosure
        - New private marks rise sharply without matching ARR, margin, or customer-quality disclosure.
        - Multiple expansion without evidence increases down-round risk.
        - Treat later marks as speculative signals, not supportable anchors.
      - - Enterprise conversion stalls
        - Public or diligence evidence shows weak upmarket adoption or poor expansion behavior.
        - Supabase’s premium case depends on monetizing the massive developer funnel.
        - Reframe the company as strong product + weaker monetization, which lowers fair value.
    notes: Triggers are designed to be monitorable and valuation-relevant, not generic operational concerns.
