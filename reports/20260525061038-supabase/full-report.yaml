  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and where the real alternatives sit
        blocks:
          - type: paragraph
            body: >-
              Supabase is not competing in a single clean category anymore. The direct peer set still starts with
              Firebase and Appwrite because both can credibly pitch a developer-facing backend with data, identity,
              storage, and application acceleration primitives. But the competitive field widens immediately after that.
              AWS Amplify is an incumbent fullstack alternative for teams that already want AWS services and Git-centric
              deployment workflows. Neon and PlanetScale pressure the database layer directly, especially for buyers who
              mainly want managed Postgres, branching, and performance rather than a full bundled backend. Hasura is
              more adjacent because it owns the data API and federation layer rather than the whole application
              platform. Railway and Render are substitutes that can absorb backend spend by combining managed Postgres
              with deployment and networking primitives. The status quo also remains internal build on cloud services.
              In practice, the buyer is often choosing between an integrated Postgres bundle, a hyperscaler stack, a
              database-first wedge, or a generic platform assembled into a backend, not simply between Supabase and one
              named BaaS rival.
