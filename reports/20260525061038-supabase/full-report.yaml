      - number: '3.2'
        title: Profiles, capability breadth, and pricing shape
        blocks:
          - type: paragraph
            body: >-
              The closest feature-breadth comparison is not actually the cheapest product; it is the product that can
              credibly replace the most modules without forcing a team to assemble its own backend. Firebase remains the
              broadest incumbent because it layers managed data, auth, hosting, analytics, and AI tooling on top of
              Google Cloud, but it keeps a proprietary and multi-product posture and still appears strongest for
              mobile-first, offline-heavy use cases. Amplify matters for a different reason: it is less a tidy BaaS than
              an AWS front door for fullstack teams comfortable with Cognito, AppSync, Lambda, S3, and CDK. Appwrite is
              the clearest open-source full-stack peer because it bundles auth, databases, functions, storage, realtime,
              and self-hosting in one subscription. Neon and PlanetScale are narrower but sharp where the buying
              criterion is serverless Postgres economics, branching, or database operations. Supabase's own list-price
              posture is attractive relative to peers because it is still legible as Free, Pro, Team, and Enterprise,
              whereas Firebase and Amplify increasingly meter the stack by service and Neon meters database compute by
              usage.
