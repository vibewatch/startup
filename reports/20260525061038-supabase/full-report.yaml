  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Latest supportable anchor and round economics
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation starting point is still the April 2025 Series D that brought Supabase $200 million
              at a $2 billion post-money valuation. That anchor is repeated by TechCrunch and Yahoo Finance and is
              consistent with the company moving up from an approximately $80 million prior round only seven months
              earlier. The same reporting puts cumulative capital after the round at roughly $398 million, which matters
              because it gives Supabase real time to grow into the valuation instead of forcing immediate mark-to-market
              proof. Public operating signals also explain why investors were willing to pay up. At round time, Supabase
              was already talking about roughly two million developers and 3.5 million managed databases, while current
              official pages show seven million registered developers, ninety-eight thousand-plus GitHub stars, and more
              than sixteen million created databases. That scale story supports premium ambition, but it does not by
              itself reset the valuation anchor. Later database entries and market-data pages that mention $5 billion or
              even $10 billion should be kept as low-confidence signals, not as the chapter’s core mark, because they
              are not yet corroborated with the same quality as the disclosed Series D.
            claimRefs:
              - CV001
              - CV002
              - CV003
