      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Supabase sells into a market where the buyer, user, and payer often begin as the same person and only
              separate later. For solo founders, indie hackers, and small startup teams, the user choosing the platform
              is usually also the budget owner; the relevant decision is speed to launch versus cost predictability. As
              the workload becomes more production-critical, the economic buyer shifts toward the CTO, VP Engineering,
              or platform lead, and then security, IT, and finance begin shaping the short list once SSO, audit logs,
              support SLAs, or data residency become requirements. Segment fit is not uniform. SQL-native web
              applications, internal tools, collaborative SaaS, and AI products are a natural match for Supabase because
              they benefit from one Postgres system of record, instant APIs, and vector tooling. Mobile-first products
              with heavy offline-sync needs remain a weaker fit because Firebase still has a stronger offline and mobile
              synchronization story. This creates a recognizable adoption path: free or low-cost evaluation, single-team
              production adoption, governance review, and then either enterprise standardization or a re-platform into
              best-of-breed database and deployment services. The market is therefore shaped less by one monolithic
              buyer and more by a sequence of buyer-role changes as complexity and risk rise.
