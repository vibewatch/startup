      - CV031
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Supabase scores highest on distribution and product pull, but much lower on monetization transparency and
      valuation support.
    data:
      items:
        - label: Developer distribution
          value: 8
          unit: /10
          detail: Millions of registered developers and strong OSS adoption support relevance.
        - label: Enterprise proof
          value: 6
          unit: /10
          detail: Named references and compliance packaging are positive, but economics are undisclosed.
        - label: Monetization visibility
          value: 4
          unit: /10
          detail: Public revenue estimates are helpful but conflict too much for precise underwriting.
        - label: Public comp support
          value: 5
          unit: /10
          detail: The $2B mark is plausible only under the upper half of the comp band or higher ARR.
        - label: Reliability confidence
          value: 4
          unit: /10
          detail: Incident transparency is good, but production resilience still needs proof.
        - label: Financing anchor quality
          value: 7
          unit: /10
          detail: The Series D is clearly reported; later marks are not.
        - label: Evidence quality
          value: 4
          unit: /10
          detail: Public evidence is enough for a range view, not enough for venture-round precision.
    approximationNotes: Scores are directional IC-style judgments based only on retained public evidence as of the canonical run date.
    claimRefs:
      - CV016
      - CV032
      - CV036
      - CV043
      - CV044
