  - id: named-customers-and-production-proof
    title: Named customers, case studies, and proof of production use
    body: |
      The chapter’s strongest evidence is not logo wallpaper but a sizable set of named production stories with concrete workload details. Maergo, Shotgun, Good Tape, Markprompt, Mobbin, Chatbase, Firecrawl, Quivr, Xendit, Resend, Voypost, and Humata each describe a real deployment, and many add quantitative outcomes that are more specific than the average startup customer page. Maergo cites 100x load-test traffic and much faster deployments; Shotgun cites an 83% infrastructure cost reduction and lower database response times; Good Tape reports 75,000 transcriptions per week, customers in 130 countries, and a one-month migration of both database and auth workloads; Chatbase says the platform supports thousands of production AI agents and more than 8,000 paying customers; Resend reports 5,000-plus paying customers, 300,000-plus registered users, and millions of daily emails. Xendit’s sanctions-screening workflow was shipped to production in under a week and reportedly ran for nine months without issue. These are meaningful proofs that Supabase is used in production by revenue-generating software businesses, even though most of the source material still comes from Supabase-authored case studies rather than customer-authored postmortems or neutral audits.
