figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: "Typical path from developer discovery through production deployment, governance review, and broader account expansion."
    data:
      items:
        - label: Discovery
          actor: Solo developer or startup founder
          touchpoints:
            - Docs, GitHub, and customer stories
            - Free project creation and quick prototype
            - Comparison against Firebase, Auth0, or vector specialists
          emotion: Wants fast setup and low coordination overhead
          painpoint: Too many backend vendors slow the first launch
          opportunity: Supabase wins with one bundled Postgres-centered stack
        - label: First production workload
          actor: Engineering lead or product team
          touchpoints:
            - Managed Postgres and Auth rollout
            - Data migration or new application launch
            - Dashboard usage by non-database specialists
          emotion: Wants speed without operational burden
          painpoint: Reliability and migration risk matter as traffic becomes real
          opportunity: Customer stories show rapid time-to-production and simpler operations
        - label: Expansion
          actor: Same account with broader requirements
          touchpoints:
            - Add storage, vector, edge functions, read replicas, or backups
            - More teams query or administer the data layer
            - Security reviews and support interactions deepen
          emotion: Sees convenience in consolidating tools
          painpoint: Scaling and governance needs start to outrun self-serve defaults
          opportunity: Land-and-expand economics improve if module attachment holds
        - label: Governance / procurement
          actor: Security, platform, or compliance owner
          touchpoints:
            - SSO, audit logs, PrivateLink, support, self-hosting discussion
            - ISO 27001 and broader compliance review
            - Incident and uptime scrutiny
          emotion: Focused on control, resilience, and accountability
          painpoint: Public proof of retention and concentration is limited
          opportunity: Enterprise packaging can convert technical adoption into larger contracts
        - label: Renewal / trust test
          actor: Existing customer or reference buyer
          touchpoints:
            - Support interactions and incident response
            - Ongoing workload performance and operational sharp edges
            - Potential reference call or public case study
          emotion: Stays if value outweighs trust risk
          painpoint: Outages or opaque limits can reopen vendor-evaluation decisions
          opportunity: Strong support plus low migration pressure can support durable accounts
