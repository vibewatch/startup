  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver / risk
      - Evidence
      - Likely impact
      - Current read
      - Diligence path
    rows:
      - - Database/auth wedge expands into broader stack
        - Good Tape, Quivr, Resend, and Chatbase all cite multiple Supabase modules over time
        - Higher revenue per successful account
        - Positive motion is visible in stories
        - Ask for product attach-rate data by plan
      - - Free / community to hosted or paid expansion
        - Quivr and Chatbase show customer examples of developer-community traction turning into paid hosted usage
        - Broadens monetization beyond prototypes
        - Plausible but anecdotal for Supabase itself
        - Request free-to-paid and community-to-Team / Enterprise conversion cohorts
      - - Startup to upmarket enterprise motion
        - Chatbase, Resend, Humata, and enterprise packaging all point to stronger governance needs over time
        - Supports higher ACV and stickier accounts
        - Credible but not quantified by conversion or renewal data
        - Request Team-to-Enterprise win rate and average expansion timeline
      - - Sector diversification reduces single-vertical proof bias
        - Stories span logistics, events, AI support, email, fintech, design research, and knowledge software
        - Helps product thesis look broad rather than niche
        - Positive at the proof-set level
        - Request revenue segmentation by vertical and plan tier
      - - Customer concentration remains unknown
        - No public top-account revenue data, plan mix, or renewal concentration is disclosed
        - Could materially change downside risk
        - Negative information gap
        - Request top-customer concentration, largest account churn risk, and dependency map
      - - Trust shocks can interrupt expansion
        - Outages, access issues, and auth friction could slow enterprise conversion or trigger account review
        - Impacts both new sales and renewals
        - Real but not yet shown as material churn in public
        - Request post-incident churn, incident-credit, and pipeline-loss analysis
    notes: "The expansion story is real at the module-attachment level, but concentration risk remains mostly opaque because Supabase does not publish customer-revenue concentration or retention metrics."
