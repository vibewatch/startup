  - id: customer-value-and-enterprise-readiness
    title: Evidence of value and enterprise readiness
    body: |
      The value case is most persuasive where Supabase helps buyers collapse multiple backend tools into a single Postgres-centered system. Across the retained stories, buyers repeatedly cite the same economic benefits: faster initial shipping, fewer vendors, lower infrastructure cost, less custom middleware, easier support, and fewer operational burdens for small engineering teams. The metrics are concrete: Shotgun cut database-related spend from more than $12,000 per month to $2,155 per month; Good Tape reduced backend expenses by 60%; Humata reports a 4x cost reduction after moving vector workloads; Voypost says development became 20% faster; Maergo reduced code and deployment complexity; Chatbase emphasizes that one platform and one support relationship matter as it moves upmarket. Enterprise readiness is helped by official packaging—ISO 27001, SOC 2, HIPAA and GDPR positioning, audit logs, role-based controls, longer log retention, and PrivateLink—plus support promises around migration and designated experts. The key diligence caveat is that most of this proof remains company-curated. Supabase has many customer quotes and metrics, but far fewer customer-domain case studies, procurement records, or independent benchmark packs that would let an investor separate good storytelling from repeatable enterprise-grade durability.
