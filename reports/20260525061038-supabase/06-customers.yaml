  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: community-to-enterprise-conversion-rates
      missingEvidence: Public conversion data showing what percentage of Free, Pro, or community-led accounts graduate into Team or Enterprise contracts.
      whyItMatters: Conversion quality is central to the customer thesis, but anecdotal customer stories do not reveal whether the wide developer funnel reliably monetizes into durable higher-ACV accounts.
      diligencePath: Request funnel conversion by plan tier, free-to-paid conversion by project age, and Team-to-Enterprise conversion by quarter.
      relatedQuestionRefs: [QU015]
      relatedTableRefs: [TU005]
    - type: private-evidence-only
      severity: material
      topic: retention-renewal-and-logo-churn
      missingEvidence: NRR, GRR, gross logo retention, renewal rates, and cohort retention by customer segment or plan tier.
      whyItMatters: Without retention data, the chapter can show real customer value and production use but cannot underwrite customer durability with investment-grade confidence.
      diligencePath: Request monthly cohort retention, logo churn, NRR/GRR, and downgrade / upgrade flows by plan from finance and RevOps.
      relatedQuestionRefs: [QU016]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: top-customer-concentration-and-plan-mix
      missingEvidence: Top-customer revenue share, top-10 account exposure, and revenue mix across Free/Pro/Team/Enterprise.
      whyItMatters: The public proof set is diversified by vertical, but that does not answer whether a few large customers or one plan tier dominate monetization.
      diligencePath: Request top-account concentration, customer-size buckets, revenue by plan tier, and exposure to the largest renewal events.
      relatedQuestionRefs: [QU017]
      relatedTableRefs: [TU005]
    - type: access-blocked
      severity: material
      topic: independent-review-corpus
      missingEvidence: Auditable independent review text or rating distributions from G2 and TrustRadius captured successfully during this run.
      whyItMatters: Public customer stories skew positive. Independent review evidence would help separate product value from marketing curation and identify recurring complaints.
      diligencePath: Re-run review capture with approved access, obtain exported review summaries, or supplement with customer reference calls and support-ticket analysis.
      relatedQuestionRefs: [QU018]
      relatedTableRefs: [TU004]
