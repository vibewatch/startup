  - id: TU006
    title: Customer trust incident table
    columns:
      - Signal
      - Customer impact
      - Evidence
      - Why it matters
      - Limitation
    rows:
      - - February 2026 us-east-2 outage
        - Databases, Auth, Storage, Realtime, Functions, and related services were unavailable for affected customers
        - Official incident post cites 3 hours and 42 minutes of impact from an internal configuration error
        - Directly tests whether enterprise and production buyers should trust Supabase for mission-critical workloads
        - One severe incident does not by itself prove broad churn or systemic unreliability
      - - Brazil network-provider access issue
        - Some customers reportedly could not reach Supabase IPs from a specific ISP and were told to use VPNs or alternate networks as a workaround
        - Public status update documents the access issue and ISP escalation efforts
        - Shows customer experience can still depend on external network-provider conditions outside the core database layer
        - Scope appears geographically bounded in the public record
      - - Shared-pooler maintenance wave
        - Some customers on older shared-pooler connection strings were told to expect errors during scheduled maintenance windows
        - Status history details V1 to V2 pooler upgrades across regions
        - Suggests multi-tenant operational changes remain relevant to customer experience and should be understood in diligence
        - Scheduled maintenance is not equivalent to an unplanned outage
      - - Auth email hook rate-limit friction
        - A public issue reports sign-up attempts blocked for more than 30 minutes despite an auth email hook setup
        - GitHub issue #45743 records the complaint and expected behavior
        - Highlights the kind of sharp edge that can matter disproportionately in production onboarding flows
        - Single issue evidence does not prove prevalence across the installed base
    notes: "This table captures the most visible trust-risk events in the retained source set; it is not a complete incident ledger or a direct churn analysis."
    claimRefs:
