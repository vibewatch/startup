  - id: customer-risks-satisfaction-blind-spots-and-adverse-evidence
    title: Customer risks, churn blind spots, and adverse evidence
    body: |
      The biggest customer-risk issue is not a lack of logos; it is the lack of clean durability data outside curated success stories. Public materials in this chapter do not provide customer retention, logo churn, renewal rates, top-customer exposure, or a defensible independent satisfaction corpus. During this run, both the G2 and TrustRadius review URLs were challenge-blocked or rate-limited, which is itself a reminder that independent review visibility is thin. More importantly, there is real adverse operational evidence. The February 2026 us-east-2 outage took customer databases, auth, storage, functions, and related services offline for 3 hours and 42 minutes because of an internal Supabase configuration error. The status record also shows a Brazil network-provider access issue and continuing shared-pooler maintenance activity. A separate GitHub issue shows that a customer using auth email hooks could still hit opaque email rate limits and be blocked for more than 30 minutes. These issues do not erase the positive customer stories—Good Tape, Resend, Humata, and others explicitly praise support and reliability after migration—but they do mean customer trust underwriting cannot stop at testimonials. Supabase looks strong on breadth of proof and decent on value realization, but only moderate on externally verified durability.
