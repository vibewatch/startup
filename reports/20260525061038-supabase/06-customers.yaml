      - Main diligence gap
    rows:
      - - Self-serve developers and solo founders
        - Individual builders or tiny product teams
        - MVP backends, prototypes, hackathon apps, side projects
        - Homepage and pricing posture; Quivr and early Chatbase stories
        - Free tier to Pro ($25/month) list-price anchor
        - No public conversion rate from free projects to paid accounts
      - - Startup and SMB product teams
        - Founders, engineering leads, or product teams
        - Production SaaS apps needing database, auth, storage, and APIs quickly
        - Good Tape, Mobbin, Voypost, Shotgun, Maergo
        - Pro to Team ($599/month) plus usage; actual realized spend undisclosed
        - No ACV or revenue mix by plan disclosed
      - - AI-native software vendors
        - Engineering-led startup teams
        - Vector search, RAG, AI support agents, knowledge retrieval, internal tools
        - Chatbase, Markprompt, Firecrawl, Quivr, Humata
        - Team and Enterprise are the most plausible fits once volume, support, or compliance rises
        - Public proof is strong on feature fit, weaker on long-term retention
      - - Transactional or operational platforms
        - Operations or platform engineering teams
        - Payments screening, logistics, email infrastructure, document workflows
        - Xendit, Maergo, Resend
        - Team or custom Enterprise most likely once uptime and security reviews matter
        - No outage-credit or SLA-attachment disclosure at customer level
      - - Enterprise innovation and regulated teams
        - Security, platform, or innovation leaders
        - RAG over internal knowledge, prototyping, self-hosted or compliance-sensitive backends
        - GitHub Next, Mozilla, PwC, Epsilon3, Humata
        - Team starts at $599/month; Enterprise custom with SSO, audit logs, PrivateLink, support
        - No named enterprise contract values, win rates, or renewal data
      - - Self-hosting / control-sensitive buyers
        - Teams with isolation or compliance needs
        - Open-source portability, data control, bespoke networking, or internal hosting
        - Epsilon3 quote on self-hosting; Quivr local-run preference; Markprompt open-source positioning
        - Custom operational budget likely exceeds list price because self-hosting shifts work to the buyer
        - Public evidence does not show how many such users convert to managed Enterprise
    notes: "Budget size is anchored only to public list pricing and the requirements implied by customer stories; Supabase does not disclose realized ACV or plan mix."
