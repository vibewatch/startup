  - id: expansion-motion-community-and-concentration-unknowns
    title: Land-and-expand motion, community-to-enterprise conversion, and concentration unknowns
    body: |
      Supabase’s expansion motion looks credible, but mostly through customer stories and product packaging rather than direct cohort disclosure. The common pattern is a narrow wedge—managed Postgres, auth, or vector search—followed by broader adoption of adjacent modules such as storage, edge functions, read replicas, backups, security controls, or enterprise support. Good Tape added auth and broader backend services after database migration. Resend started with a rapid YC-stage proof of concept and later relied on partitioning, read replicas, and security help. Quivr shows the most obvious community-to-hosted pathway: an open-source project that became a hosted product with 17,000 signups and over 5,000 Supabase databases. Chatbase shows a parallel motion from MVP speed to upmarket reliability work. What is still missing is Supabase’s own conversion math. The company does not disclose free-to-paid conversion, Team-to-Enterprise conversion, community-to-enterprise conversion, NRR, GRR, or top-account concentration. The named proof set is diversified by vertical—logistics, fintech, email, design research, AI support, documentation, and knowledge work—but that is not the same thing as revenue diversification. For diligence, the right conclusion is that the land-and-expand story is plausible and visible at the anecdote level, while concentration risk remains largely an unknown because the company withholds the metrics that would prove durability.
