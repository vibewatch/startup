      - number: '7.3'
        title: 安全、合规和法律姿态在改善，但剩余负担仍落在客户身上
        blocks:
          - type: paragraph
            body: >-
              Supabase 值得肯定，因为它搭出了比许多开发者平台强得多的公开安全与合规叙事。公司现在指向覆盖主要服务的 ISO 27001、用于私有数据库连接的 PrivateLink、围绕密钥轮换和 RLS 默认值的
              2025 年安全加固周期，以及让 HIPAA 和备份姿态更具体的安全页面。这些缓释措施有意义。它们并不会消除一个风险：合规要求高的买家仍面临有意义的尽调和合同不对称。Supabase
              隐私通知称，公司对自身服务数据担任 controller、对客户数据担任 processor，传输可能涉及 United States 和 Singapore。European Commission 和 HHS
              材料明确说明，GDPR 式传输保障和 HIPAA 式行政、技术、违规响应义务，不能只靠基础设施营销解决。Supabase 自己的条款也强化了这一点：PHI 需要
              BAA，服务可因安全或供应商原因暂停，担保被广泛免责声明，责任设上限，争议进入仲裁。净效果是采购姿态比以前更好，但对受监管或高责任部署来说，合规姿态并不低摩擦。
