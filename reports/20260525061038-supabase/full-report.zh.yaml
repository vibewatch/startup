  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 当前 ARR / 收入节奏
        - 自 2025 年 4 月轮次以来，月度或季度经常性收入桥接表。
        - 这是判断 $2B 公允还是偏高的最大单一变量。
        - 索取管理层报告或董事会材料，对 2025 和 2026 年收入运行率进展做勾稽。
      - - 毛利率和基础设施成本画像
        - 按产品面拆分的服务成本、支持负担和超额用量贡献。
        - 基础设施溢价倍数取决于耐久的软件式单位经济性。
        - 要求按数据库、Auth、Storage 和网络功能拆分毛利率趋势与工作负载成本。
      - - 企业占比和留存
        - NRR、企业 ARR 占比、ACV 分布和客户集中度。
        - 开发者采用只有转化为高粘性、可扩张支出才有价值。
        - 审查队列分析、头部客户敞口和套餐层级迁移数据。
      - - 股权结构表和优先股堆叠
        - 完全摊薄股数、清算优先权、老股交易和任何结构化条款。
        - 如果条款激进，账面估值可能显著夸大普通股上行空间。
        - 接受按市值重估回报前，先检查融资文件或股权结构摘要。
      - - 后续轮次佐证
        - 对 Series D 后任何实际 $5B 融资或可信 2026 年进程的一手确认。
        - 如果后续轮次确实以干净条款完成，估值叙事会改变。
        - 通过公司材料、投资人信或原始融资文件确认。
    notes: 尽调问题优先指向最可能改变估值的缺失输入，而不是重复已经可见的产品或采用事实。
    claimRefs:
      - CV016
      - CV043
      - CV044
      - CV045
      - CV046
