      - number: '8.2'
        title: 收入三角测算与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              投资判断的难点不是 Supabase 有没有收入，而是投资人按 $2B 定价时，真实收入运行率到底在哪里。公开第三方估计分歧很大。TapTwice 指向 2024 年约 $16M 收入、2025 年约 $27M
              收入；GetLatka 则称 Supabase 到 2025 年 4 月已达到 $31M 收入，9 月达到 $70M。Sacra 另行估计 2025 年 ARR 约 $70M，高于 2024 年底约
              $30M。这些数字在一个意义上方向一致，因为都意味着高速增长；但彼此并不接近，不能支撑精确判断。在 $2B 锚点下，隐含倍数按 $27M 约为 74x，按 $31M 约为 65x，按 $70M 约为
              29x。对同一个融资标记来说，这个区间很大。Supabase 的货币化模型让差距更容易理解：官方定价显示 Free、$25 Pro、$599 Team
              三个入口，以及存储、出站流量、时间点恢复、SSO、日志和自定义域名的用量收费；项目成熟为企业工作负载后，实际收入可能非线性扩张。即便如此，公开证据仍表明，本轮定价押注的是未来转化，而不仅是当前已披露收入。
