      - number: '8.5'
        title: 建议、估值下行风险与缺失证据
        blocks:
          - type: paragraph
            body: >-
              本章建议为继续研究，置信度中、风险高；$2B Series D 标记处在偏高到合理的边界，取决于真实 ARR
              当时到底在哪里。换句话说，这个锚点可以支撑，但基于公开证据还谈不上便宜。主要的估值下行风险，是后续私募市场信号已经跑在已披露货币化前面。假设 $5B 标记成立，在 $70M 收入基数上意味着约 71x，在
              $27M 基数上约 185x，以当前公开信息看很难支撑。可靠性风险同样重要，因为基础设施买家只有在信任平台能跑生产工作负载时，才愿意支付高倍数；2026 年 2 月故障，以及客户 Postgres
              数据库缺少自动跨区域故障切换，说明一部分韧性工作仍在推进。最大的缺失证据很直接：当前经审计 ARR、净留存率、毛利率、企业 ACV
              结构、客户集中度、完全稀释股本，以及任何清算优先权或老股交易条款。没有这些项目，本章可以理性框定估值，但不能用风险投资轮次的精度钉住它。公开证据也没有显示可见 IPO
              准备信号，因此下一次估值验证点更可能是另一轮私募融资或老股交易，而不是近期上市。
