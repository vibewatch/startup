      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开市场上没有被普遍接受的「Postgres 开发平台」报告，所以经典总可用市场（TAM）/ 可服务市场（SAM）/ 可获取市场（SOM）处理必须保持谨慎。保留基准中最宽的是 Sacra 引用的 $23.3
              billion 后端即服务（BaaS）市场，但这个超级品类过于宽泛，不能作为 Supabase 的直接总可用市场（TAM），因为它扫入了许多不像 Postgres 优先开发栈的产品和工作负载。与此同时，Grand
              View 的公开 DBaaS 落地页在本次保留抓取中太像预告，无法提供可用的开放方法论基准。更强的规模测算方法，是自下而上的买方预算视角。保留的公开价格显示，可比平台大多聚在免费入口、低双位数或约 $25
              的月度生产入口点，一旦团队控制、可审计性、支持或合规加入，价格会大幅上台阶。Supabase 自己可见的锚点仍是 Free、$25 Pro 和 $599 Team。对照这些预算，公司估计年经常性收入（ARR）约
              $70 million、开发者 1.7-2.0 million，说明采用广度已经有意义，但相对广义品类支出的变现仍处早期。尽调的正确结论不是 Supabase 能拿下每一美元 BaaS 或 DBaaS
              支出，而是它位于一条真实、扩张中的开发者预算走廊里；即便自上而下的市场分类并不清晰，公开价格和采用门槛仍可观察。
