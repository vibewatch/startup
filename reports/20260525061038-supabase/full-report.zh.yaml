        - 量化新客户需求中 API 驱动与数据库驱动各占多少
      - - AI 原生开发与智能体就绪基础设施
        - 驱动
        - 当前
        - 利好把 API、向量工具和快速后端搭建放在一起的平台
        - 验证 AI 原生工作负载是提高转化，还是只增加试用量
      - - 开发者信号中的 PostgreSQL 偏好
        - 驱动
        - 当前
        - 强化 Supabase 作为 Postgres 优先标准的定位，而不是小众选择
        - 验证 Postgres 偏好能否转化为付费平台选择
      - - 开源 / 自托管与数据驻留需求
        - 驱动
        - 中期
        - 让 Supabase 能切入一部分反感封闭托管替代品的买家
        - 衡量管线中有多少比例把控制权、可移植性或数据驻留列为决策因素
      - - 治理与合规要求
        - 约束兼扩张驱动
        - 当前
