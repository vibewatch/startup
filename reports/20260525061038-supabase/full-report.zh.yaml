  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 信号
      - 为什么重要
      - 行动含义
    rows:
      - - 商业化证据偏弱
        - 证据显示 ARR 或收入持续低于大约 $60M。
        - 除非采用异常激进的倍数假设，这一水平很难支撑 $2B。
        - 将 2025 年估值视为偏高；若没有价格重置，不承销上行空间。
      - - 平轮或下轮融资
        - 下一轮价格等于或低于 $2B，或高度依赖结构化条款。
        - 估值持平或优先权堆叠，说明市场并未干净利落地验证增长故事。
        - 下调估值判断，重新聚焦下行保护。
      - - 可靠性恶化
        - 再次出现持续数小时的区域性宕机，或韧性承诺推进缓慢。
        - 基础设施要拿溢价倍数，必须让市场相信生产环境耐久性。
        - 即使头部增长仍强，也要施加质量折扣。
      - - 缺乏披露的 $5B 估值
        - 新的私募估值大幅上升，却没有匹配的 ARR、利润率或客户质量披露。
        - 没有证据支撑的倍数扩张，会抬高下轮下调风险。
        - 将后续估值视为投机信号，而不是可支撑的锚点。
      - - 企业转化停滞
        - 公开或尽调证据显示高端市场采用偏弱，或扩张行为不佳。
        - Supabase 的溢价情景要靠庞大开发者漏斗商业化。
        - 把公司重估为强产品、弱商业化，公允价值随之下调。
    notes: 这些触发项强调可监控且与估值相关，而不是泛泛的运营问题。
    claimRefs:
