      - number: '5.4'
        title: 信任控制、故障与技术风险
        blocks:
          - type: paragraph
            body: >-
              信任图景在改善，但并不无摩擦。积极一面是，Supabase 现在公开记录了覆盖整个平台的 ISO 27001 范围、新 dashboard 表默认 RLS
              保护、密钥轮换和泄露撤销改动、安全顾问、私有网络，以及常设外部测试和披露计划。这些信号对采购和生产采用都有意义。限制因素在于，可靠性和运营成熟度仍能看到缝隙。2026 年 2 月 us-east-2
              故障是真正的平台级事件，由 Supabase 自己的部署控制触发；公司也承认，客户 Postgres 的自动跨区域故障转移尚不可用。公开状态页还记录了网络 / 提供商访问问题和持续的 pooler
              维护。与此同时，GitHub issues 显示，生产信任关键领域反复出现开发者摩擦：不透明的身份验证邮件速率限制、RPC 路径上持续的 PostgREST schema 缓存故障，以及会破坏自托管 cron
              流程的云形态 Edge Function URL 生成。由此得到的判断是建设性但谨慎：Supabase
              在控制和透明度上明显强于许多开发者平台，但最弱环节仍是运营毛刺，且这些毛刺恰好出现在客户最希望基础设施隐入后台的时刻。
