      - number: '3.4'
        title: 护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              核心战略结论是，Supabase 的护城河更像包装、可移植性和社区亲和力，而不是排他的底层技术。这仍然有价值。Supabase 已经做出一个以 Postgres
              为中心的连贯体验，比把云原语缝在一起更简单；围绕企业控制和运营规模的官方信号也显示，平台不再只是爱好者工具。但反向证据真实存在。Firebase 已经通过 Data Connect 转向
              PostgreSQL，Appwrite 如今把自己营销成另一个开源全栈后端，并提供从 Supabase 迁移的路径；PlanetScale 和 Neon 也在持续强化数据库层，面向不需要完整 Supabase
              包的买家。即便 Railway 和 Render 这类通用替代品，也让团队更容易在不选择专门 BaaS
              的情况下拼出足够的后端基础设施。结果是一个最大风险来自商品化、而非某个单一对手突然替代的品类。尽调的关键问题，是当其他玩家把更多捆绑能力做成准入门槛时，Supabase 能否继续成为默认的集成式开源
              Postgres 平台。
