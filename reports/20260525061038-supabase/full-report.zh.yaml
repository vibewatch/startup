      - number: '5.2'
        title: 以 Postgres 为中心的架构、可扩展性与自托管
        blocks:
          - type: paragraph
            body: >-
              架构差异点在于连贯性。Supabase 自己的代码仓库和文档显示，它是一套有明确主张的技术栈：PostgREST、GoTrue、Realtime、Storage、pg_graphql、postgres-meta
              和 Kong 围绕独立 Postgres 集群组装，而不是作为彼此断开的托管服务暴露。Auth 把状态存进 Postgres，并把授权推入 JWT 加行级安全；Storage
              也继承数据库的策略语义；Realtime 跑在 Postgres change streams 上；Edge Functions 则经由网关路由，在代码进入 Deno-compatible edge
              runtime 之前应用身份验证和流量规则。这比泛泛的「后端即服务」营销更强，因为它解释了团队为何能在多个模块之间共享数据模型、策略和运营上下文。自托管延伸了这一姿态，但有真实限制。Supabase 官方支持基于
              Docker 的自托管，面向需要控制、合规或隔离的团队；但同一份文档也明确说明，branching、advanced metrics、managed backups/PITR、analytics/vector
              buckets、ETL 和 management API 等仅托管能力不会免费随行。实践中，Supabase 的开放性真实存在，但企业级自托管仍需要相当的运维能力。
