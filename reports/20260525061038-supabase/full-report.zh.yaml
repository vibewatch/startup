      - number: '8.4'
        title: 情景区间与倍数变化因素
        blocks:
          - type: paragraph
            body: >-
              实用的估值看法，是用情景框住 Supabase，而不是假装公开记录能支撑一个精确数字。悲观情景下，货币化更接近 $40M 至 $60M 收入，市场把 Supabase 视为扎实但仍在成熟的基础设施资产，给予约
              10x-12x，价值约 $0.4B 至 $0.7B。基准情景下，Supabase 已更接近 $80M 至 $100M 收入，保持溢价增长，可支撑约 14x-18x 倍数，对应约 $1.1B 至
              $1.8B。乐观情景下，企业转化加速，ARR 推进到约 $120M 至 $150M，市场继续奖励开发者基础设施的稀缺性，约 17x-20x 可支撑 $2.0B 至
              $3.0B。推动倍数上行的不是更多注册量本身，而是证据：免费开发者规模正在转成大额企业合同，留存强、基础设施经济性可接受，并且可靠性足以承载关键任务工作负载。压低倍数的则相反：又一轮不披露经济性的拉伸融资、企业货币化弱，或反复运营事故让平台耐久度低于估值假设。
