  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最新可支撑锚点与融资轮经济性
        blocks:
          - type: paragraph
            body: >-
              最干净的估值起点仍是 2025 年 4 月的 Series D：Supabase 融资 $200M，投后估值 $2B。TechCrunch 和 Yahoo Finance
              都重复了这一锚点，也与公司仅七个月前刚完成约 $80M 融资后继续上行相符。同一组报道把本轮后累计融资额放在约 $398M，这一点重要，因为它给 Supabase
              留出了用增长消化估值的时间，而不是立刻拿出按市价重估的证明。公开运营信号也解释了投资人为什么愿意给高价。本轮融资时，Supabase 已在谈约 2M 开发者和 3.5M 托管数据库；当前官方页面则显示 7M
              注册开发者、98k+ GitHub 星标，以及超过 16M 个已创建数据库。这个规模故事支撑高溢价野心，但本身不能重置估值锚点。后续数据库条目和市场数据页面提到的 $5B 甚至
              $10B，应保留为低置信度信号，而不是作为本章核心标记，因为它们还没有获得与已披露 Series D 同等质量的佐证。
