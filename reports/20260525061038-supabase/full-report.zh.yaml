        - 没有独立成本审计或合同条款披露
      - - Good Tape
        - AI 转录 SaaS
        - 为快速增长的转录产品迁移托管 Postgres 和 Auth
        - 生产环境
        - 每周 75k 次转录；130 个国家；后端成本降低 60%；一个月完成数据库和 auth 迁移
        - 客户引述很强，但仍是公司策划的案例研究
      - - Markprompt
        - AI 支持 / 文档平台
        - 面向企业级支持智能体的向量数据库和 auth
        - 生产环境
        - 索引 500k+ 个内容片段，每日新增 10k-50k 个内容片段；强调 GDPR 定位
        - 结果集中在规模 / 合规，不涉及续约或 NPS
      - - Mobbin
        - 设计研究 / 创作者平台
        - 从 Firebase 迁移认证和关系型后端
        - 生产环境
        - 200k+ 创作者和 400k+ 注册用户；auth 痛点解决，支出下降
        - 没有明确支出数字或留存数据
      - - Chatbase
        - AI 客服平台
        - AI 智能体和内部工具的全栈生产后端
        - 生产环境
        - 8,000+ 付费客户；ARR 超过 $10M；数千个生产智能体；上探高端市场的动作有记录
        - 业务指标是客户故事中的说法，不是经审计文件
      - - Firecrawl
        - AI 网络数据 / 开发者工具
        - 用于文档搜索的向量搜索和元数据存储
        - 生产环境
        - 自 3 月以来周活用户增长近 300%；客户认为 Supabase 比替代方案更简单、更便宜
        - 性能主张是 Supabase 故事中的客户比较说法
      - - Quivr
        - 开源 / 托管 AI 知识产品
        - 向量数据库、auth、storage 和 Edge Functions
        - 生产环境
        - 1.6M 个向量嵌入；5,100 个数据库；略多于 2 个月内 17k 次注册；托管应用 500 DAU
        - 托管收入和留存仍未披露
      - - Xendit
        - 金融科技 / 支付
        - 制裁名单筛查和搜索工作流
        - 生产环境
        - 不到一周构建并上线；生产运行九个月没有问题
        - 证明的是窄工作流，不是全账户依赖
      - - Resend
        - 开发者邮件基础设施
        - 快速增长邮件 API 的数据库和 auth 基座
        - 生产环境
        - 5,000+ 付费客户；300,000+ 注册用户；每日数百万封邮件；提到读副本和备份
        - 能支撑规模的信号，但没有独立 SLA 数据
      - - Voypost
        - B2B 软件开发 / 合同工作流
        - 面向合同谈判平台的 Firebase 迁移
        - 生产环境
        - 核心迁移不到六个月完成；代码库减少 25%；开发速度快 20%
        - 改善是运营层面、基于故事，不是外部基准
      - - Humata
        - 企业 / 政府知识 AI
        - 面向文档分析的向量、auth、Realtime 和企业支持
        - 生产环境
        - 向量成本降低 4x；数百万用户；提到大型企业和政府机构
        - 没有公开采购或续约记录连接到具名机构
