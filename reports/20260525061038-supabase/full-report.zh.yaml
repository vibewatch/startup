  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 可靠性和运营风险已有证据，不再是假设
        blocks:
          - type: paragraph
            body: >-
              当前记录中最大的下行，是托管平台的运营脆弱性。Supabase 2026 年 2 月 us-east-2 事故不是窄幅降级：内部部署在区域层面启用 AWS VPC Block Public
              Access，导致数据库、身份验证、存储、函数、实时和相关服务离线 3 小时 42 分钟。事故重要，不只是因为故障会发生，更因为公司同时披露，客户 Postgres
              的自动跨区域故障转移仍不存在。状态材料随后显示第二类风险：Supabase 无法直接控制的网络路径依赖，包括 Brazil 访问问题，客户在公司追查 ISP 时只能依赖 VPN 临时方案。GitHub
              issues 加上第三层证据。负面案例并非同一个 bug；它们横跨不透明身份验证邮件限速、持续 RPC schema 缓存损坏，以及自托管边缘函数 URL
              假设。只读副本和更大计算规格指南是有用缓释，但无法抹掉一个事实：运营毛刺仍坐在客户默认认为应该直接可用的核心路径上。
