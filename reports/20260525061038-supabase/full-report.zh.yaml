      - number: '1.3'
        title: 规模、里程碑与运营注意事项
        blocks:
          - type: paragraph
            body: >-
              Supabase 的公开规模证据很多，但口径并不完全一致，后续章节应谨慎复用。官方页面目前显示注册开发者超过 7 million、GitHub 星标超过 98,000、关注者超过
              190,000、SupaTroopers 超过 47,000，并且已创建超过 16 million 个数据库、每日启动超过 90,000 个。后一篇公司博客称项目已跨过 100,000 个 GitHub 星标和
              8 million 开发者，而融资报道引用的是 1.7 million 至 2 million 开发者、3.5 million
              个数据库环境。这些数字不一致，不能压成一个干净的可比指标，但方向上都指向大规模且仍在增长的采用。企业证明点也有意义，即便客户经济仍由公司筛选：官方页面点名 GitHub、PwC、Mozilla 和
              Epsilon3，客户故事提到一个身份验证部署七个月触达 1 million 用户，另一项迁移降低 83% 成本。创立以来的里程碑包括企业动作、2024 年前次融资、2025 年 Series D、2025
              年安全加固，以及 2026 年事故记录。保留来源中最重要的负面信号是 2026 年 2 月 us-east-2 故障、2026 年 5 月 Brazil 访问问题，以及 GitHub 上围绕速率限制、schema
              缓存行为和自托管 URL 处理的公开投诉。准确员工数、准确收入和直接客户评价情绪仍证据不足或互相矛盾。
