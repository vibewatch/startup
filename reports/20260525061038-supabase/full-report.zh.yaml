  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 核心用户任务
      - 当前状态 / 成熟度
      - 差异化
      - 主要尽调缺口
    rows:
      - - 专用 Postgres 数据库
        - 核心应用数据、SQL、触发器、扩展和可移植性
        - 核心底座；每个项目都有
        - 以单个 Postgres 集群托住其余产品，而不是把数据库当作附加项
        - 没有公开的独立基准测试包覆盖 OLTP 与分析混合的生产负载
      - - Auth、Data API 与 RLS
        - 用户身份、会话处理、受策略控制的 CRUD 访问
        - 成熟核心模块，托管版已有定价，并可通过审计日志增购
        - 授权落在 JWT 和 Postgres RLS 上，让应用与 API 访问共用一套策略模型
        - 写出稳健 RLS 策略仍有复杂度，部分负担会压到客户身上
      - - Storage
        - 文件、媒体、分析数据和向量相关对象管理
        - 已成熟，正从简单 blob 扩到更多场景
        - 支持 S3/REST/TUS、CDN、图片转换，并与 Postgres 策略集成
        - 公开文档尚未按负载类型完整量化大规模耐久性 / 性能层级
      - - Realtime
        - 协作更新、在线状态、广播和数据库变更流
        - 功能面成熟，用例清晰
        - 基于 Postgres 变更、广播和在线状态搭出来，而不是另起一套同步数据模型
        - 离线 / 移动端语义的公开成熟度仍不如 Firebase 式默认能力
      - - Edge Functions
        - 自定义后端逻辑、钩子、webhook 和低延迟 API
        - 已成熟，但部分工作流仍对运维细节敏感
        - Deno 兼容的 TypeScript 运行时，带网关鉴权处理，并与本地 CLI 保持一致
        - 冷启动、连接池和自托管 URL 假设仍需小心处理
      - - Vector / AI 工具包
        - 向量嵌入、语义搜索、RAG 和 AI 原生应用存储
        - 增长很快，已有客户证据支撑
        - 向量、元数据、Auth 和业务数据留在同一个 Postgres 系统里
        - 官方公开证据更能证明设计赢单，较少证明经过审计的检索质量或成本曲线
      - - 自托管部署
        - 在隔离或合规受限环境中运行整套栈
        - 能落地且有文档，但与托管云不具备功能齐平
        - 开源姿态真实，降低锁定风险
        - 仅托管版功能以及由运营方承担的 HA/DR，限制了自托管开箱即用的企业就绪度
    notes: 各行区分今天已经明确产品化的能力，以及托管云成熟度或自托管齐平仍要继续尽调的地方。
