  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: Supabase 的公司形态把开源 Postgres 根基、托管云商业化、开发者采用、企业扩张和运营风险连在一起。
    data:
      nodes:
        - id: n1
          label: 开源 Postgres 核心
          description: Supabase 将产品锚定在 Postgres 和开源组件上，而不是专有数据模型。
        - id: n2
          label: 类 Firebase 开发者体验
          description: Auth、API、Realtime、Storage、Edge Functions 和向量工具压缩后端搭建时间。
        - id: n3
          label: 托管云定价
          description: Free、Pro、Team 和企业层级把采用转化为订阅与用量收入。
        - id: n4
