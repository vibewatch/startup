      - number: '4.3'
        title: 资本基础、弹药库与成本结构线索
        blocks:
          - type: paragraph
            body: >-
              资本故事比经营报表更清楚。本章的正确锚点仍是 2025 年 4 月 $200 million Series D、估值 $2 billion，由 Accel 领投，Coatue、Y Combinator、Craft
              Ventures 和 Felicis 参与。这个框架意味着该轮后累计资本约 $396 million 至 $398
              million；对一家软件基础设施公司来说，这是有意义的弹药库，尽管没有公开来源披露实际现金余额。复杂之处在于，Tracxn 后来记录了 2025 年 3 月 $202 million Series D，以及
              2025 年 10 月 $143 million Series E、估值 $5
              billion。没有一手佐证时，这些数据库条目应继续标记为冲突，而不是替换标准融资历史。成本结构上，公开证据指向类似软件的经济性，但对基础设施成本有真实敏感度。Supabase 自己的扩展指南显示，计算层从每月
              $10 到每月 $3,730，并把只读副本、更大计算规格、索引和分析隔离定义为明确的成本—性能选择。来自 Chatbase 的客户证据显示，成功工作负载可能撞上 IOPS
              和吞吐上限，这意味着毛利率取决于云效率、支持强度和企业级可靠性投入，而不只是固定的软件交付。
