  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层、原型与可能预算
        blocks:
          - type: paragraph
            body: >
              Supabase
              的客户基础最好理解为分层漏斗，而不是一个同质买方群体。低端层面，它显然服务独立开发者、爱好者和早期创始人；这些人可以从免费或低成本托管方案起步，并在一处获得数据库、身份验证、存储和函数。具名故事展示了第二层：把
              Supabase 用作生产基础设施的初创公司和 SMB 买家，包括 Chatbase、Markprompt、Firecrawl、Quivr、Humata 等 AI 原生产品；Resend
              等开发者基础设施公司；以及 Good Tape、Mobbin、Voypost、Shotgun、Maergo 等数字产品团队。第三层采购更重，也更偏企业：GitHub Next、Mozilla、PwC 和
              Epsilon3 都出现在官方企业页面上，合规、自托管、安全审查和支持功能被定位给更大账户。唯一可支撑的预算锚点是官方标价——Free、每月 $25 的 Pro、每月 $599 起的 Team，以及定制
              Enterprise。这意味着可能的年客户支出，从几乎自助实验一路到 Team 和 Enterprise 合同；但 Supabase 没有公开披露 ACV、按方案划分的客户数，或收入中来自大型受监管买家的比例。
