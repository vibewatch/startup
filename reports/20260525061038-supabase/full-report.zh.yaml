            body: >-
              Supabase 有足够公开采用证据，说明商业规模真实存在，但还不足以搭出可靠收入模型。最尖锐的问题是，保留的官方来源没有披露公司收入或年经常性收入（ARR）。外部只能在 Sacra 对 2025
              年年经常性收入（ARR）约 $70 million 的估计、以及 TapTwice 对 2024 年约 $16 million 收入和 2025 年 $27 million
              收入的估计之间三角测量。这些数字在方向上有用，但不是同一口径，所以应视为粗略公开区间，而非可用于估值的数字。员工数同样未解：公开第三方估计从 TapTwice 的约 124 人到 Tracxn 2026 年的
              351 人不等。客户故事显示了为什么规模化变现有合理可能。Shotgun、Good Tape、Chatbase、Maergo、Voypost、Markprompt 和 Mobbin 都描述了在 Supabase
              之上的显著成本、生产力或增长结果。这些故事支持产品价值和买方支付意愿，但它们仍是经过筛选的案例研究，不是 Supabase 自身留存、利润率或回款质量的经审计队列数据。
