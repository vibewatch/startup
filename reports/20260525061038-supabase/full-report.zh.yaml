      - number: '6.5'
        title: 客户风险、流失盲点与反向证据
        blocks:
          - type: paragraph
            body: >
              最大的客户风险不是缺少客户标识，而是筛选过的成功故事之外，缺少干净的耐久数据。本章公开材料没有提供客户留存、logo 流失、续约率、头部客户暴露，或可辩护的独立满意度语料。本次运行中，G2 和
              TrustRadius 评价 URL 都被验证挑战阻断或限速，这本身提醒我们，独立评价可见度很薄。更重要的是，真实反向运营证据存在。2026 年 2 月 us-east-2 故障源于 Supabase
              内部配置错误，导致客户数据库、身份验证、存储、函数和相关服务离线 3 小时 42 分钟。状态记录还显示 Brazil 网络提供商访问问题，以及持续的 shared-pooler 维护活动。另一个 GitHub
              issue 显示，使用身份验证邮件 hooks 的客户仍可能碰到不透明的邮件速率限制，并被阻断超过 30 分钟。这些问题不会抹掉正面客户故事——Good Tape、Resend、Humata
              等在迁移后明确称赞支持和可靠性——但它们说明客户信任承销不能止步于证言。Supabase 在证明广度上很强，价值兑现还不错，但外部验证的耐久度只能算中等。
