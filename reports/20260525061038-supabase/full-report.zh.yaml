      - number: '6.3'
        title: 价值证明与企业就绪度
        blocks:
          - type: paragraph
            body: >
              Supabase 帮买家把多个后端工具压缩成一个以 Postgres
              为中心的系统时，价值案例最有说服力。保留故事中，买家反复提到同一组经济收益：更快首发、更少供应商、更低基础设施成本、更少自定义中间件、更容易支持，以及小型工程团队更少的运营负担。指标很具体：Shotgun
              把数据库相关支出从每月超过 $12,000 降到每月 $2,155；Good Tape 将后端费用降低 60%；Humata 报告迁移向量工作负载后成本降低 4x；Voypost 称开发速度提升
              20%；Maergo 降低了代码和部署复杂度；Chatbase 强调，随着它走向上市场，一个平台和一条支持关系很重要。官方包装——ISO 27001、SOC 2、HIPAA 和 GDPR
              定位、审计日志、基于角色的控制、更长日志保留和 PrivateLink——再加上围绕迁移和指定专家的支持承诺，都有助于企业就绪度。关键尽调限制是，大部分证明仍由公司筛选。Supabase
              有许多客户引语和指标，但客户域名案例研究、采购记录或独立基准包少得多，投资者难以把好故事与可重复的企业级耐久度分开。
