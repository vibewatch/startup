    rows:
      - - Postgres 开发平台 / 一体化开发者数据库平台
        - 托管 Postgres，以及认证、API、实时、存储、边缘函数和向量工具
        - 通用 IaaS、DBA 工具、分析型数据仓库、无关云服务
        - 创始人、全栈开发者、工程负责人
        - 核心直接市场边界
      - - 全栈 BaaS（Firebase、Appwrite）
        - 面向应用团队的托管后端服务，包括数据、认证、存储和运行时界面
        - 独立数据库、缺少后端原语的通用计算
        - 移动 / Web 产品团队
        - 最接近的替代圈层，但架构不同
      - - 托管 Postgres / 无服务器数据库平台（Neon、PlanetScale）
        - 数据库计算、存储、分支、HA 和开发者数据库工作流
        - 打包式认证、存储、实时，或完整应用后端栈
        - 平台负责人、后端工程师、数据库负责人
        - 当买方想要同类最佳数据库层时，是部分替代品
      - - 应用平台 / 部署云（Amplify、Railway、Render）
        - 构建、部署、托管、运行时及相邻托管数据服务
        - 统一的 Postgres 优先认证授权和后端套件
        - 全栈团队或平台负责人
        - 相邻替代品，可能吸收同一钱包支出
      - - 数据 / API 层平台（Hasura、Firebase Data Connect）
        - API 抽象、联邦，以及数据之上的 GraphQL 类或 API 交付层
        - 打包式全栈 BaaS 工作流
        - 数据平台或后端架构师
        - 这是重塑比较集的相邻领域，而不是替代整套栈
      - - 宽泛 BaaS / DBaaS 大类
        - 分析师市场里对后端或数据库服务大盘的简写
        - 许多企业托管或不可比服务
        - 投资人或战略分析师
        - 仅作外围参照，不是干净的直接 TAM
    notes: 此表刻意把直接可比平台、相邻领域和外围市场简写拆开，避免本章后续内容夸大可服务支出。
