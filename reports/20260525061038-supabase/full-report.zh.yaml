  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与真正替代品所在位置
        blocks:
          - type: paragraph
            body: >-
              Supabase 已不再只竞争于一个干净品类。直接同业集合仍从 Firebase 和 Appwrite
              开始，因为二者都能可信地推销一套面向开发者的后端，包含数据、身份、存储和应用加速原语。但竞争场很快扩宽。AWS Amplify 是既有全栈替代品，适合已经想要 AWS 服务和以 Git
              为中心部署工作流的团队。Neon 和 PlanetScale 直接压迫数据库层，尤其面向主要想要托管 Postgres、分支和性能，而非完整捆绑后端的买家。Hasura 更偏邻接，因为它掌握数据 API
              和联邦层，而不是整个应用平台。Railway 和 Render 是能把托管 Postgres 与部署、网络原语结合起来吸收后端支出的替代品。现状方案也仍然是基于云服务内部自建。实践中，买家往往是在一套集成
              Postgres 包、超大规模云厂商栈、数据库优先切入点，或拼装成后端的通用平台之间选择，而不是简单地在 Supabase 和某个具名 BaaS 对手之间二选一。
