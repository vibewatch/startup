        - 假设受监管垂直行业的企业销售周期更慢、流失风险更高
      - - 披露和治理可信度
        - 规范经营基线
        - 融资、用户或收入的公开指标在不同渠道仍然相互冲突
        - 即使头部增长势头仍强，也要约束置信度
