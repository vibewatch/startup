      - number: '6.4'
        title: 先落地再扩张动作、社区到企业转化与集中度未知
        blocks:
          - type: paragraph
            body: >
              Supabase 的扩张动作看起来可信，但主要证据来自客户故事和产品包装，而不是直接队列披露。常见模式是一条窄切入点——托管
              Postgres、身份验证或向量搜索——之后更广泛采用相邻模块，如存储、边缘函数、只读副本、备份、安全控制或企业支持。Good Tape 在数据库迁移后加入身份验证和更广后端服务。Resend 从 YC
              阶段的快速概念验证（PoC）起步，之后依赖分区、只读副本和安全帮助。Quivr 展示了最明显的社区到托管路径：一个开源项目变成托管产品，获得 17,000 次注册和超过 5,000 个 Supabase
              数据库。Chatbase 展示了一条平行路径：从 MVP 速度走向上市场可靠性工作。仍然缺失的是 Supabase 自己的转化数学。公司没有披露免费到付费转化、Team 到 Enterprise
              转化、社区到企业转化、净留存率（NRR）、总留存率（GRR）或头部账户集中度。具名证明集按垂直领域看是分散的——物流、fintech、email、设计研究、AI
              支持、文档和知识工作——但这不等于收入多元化。尽调的正确结论是，先落地再扩张故事在案例层面可见且合理，而集中度风险很大程度上仍未知，因为公司扣住了能证明耐久度的指标。
