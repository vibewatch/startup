  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 规模和分发
        - 数百万开发者、持续增加的数据库创建量和强开源采用，给商业化带来真实漏斗。
        - 规模指标大多停留在漏斗顶部，未披露付费转化和收入质量。
        - 证明注册开发者和免费项目能转化为付费团队与企业合同。
      - - 企业路径
        - 合规、支持、PrivateLink 和具名企业案例显示 Supabase 有机会向上打企业客户。
        - 公开来源没有给出企业 ACV、客户集中度、续约质量或 NRR。
        - 披露企业 ARR 占比、队列留存和头部客户敞口。
      - - 定价架构
        - 工作负载放大后，用量超额费和附加模块可能撬动非线性扩张。
        - 如果定价太慷慨或支持成本过高，基础设施重用量也会压低毛利率。
        - 公布用量超额、SSO、日志和网络附加项的毛利率与附加购买率数据。
      - - 轮次经济性
        - $398M 累计融资给公司留下跑进 2025 年估值的现金跑道。
        - 后续 $5B 和 $10B 信号佐证较弱，可能是乐观预期跑在基本面前面。
        - 确认 Series D 之后是否真的完成融资，以及条款如何。
      - - 可靠性和信任
        - 事故透明度和修复动作是正面信号。
        - 2026 年 2 月宕机说明，基础设施失误仍可能造成平台级中断。
        - 拿出无重大事故的运营记录，并更清楚地证明多区域韧性。
    notes: 反向逻辑集中在商业化和耐久性证据，而不是 Supabase 是否具备产品市场契合。
