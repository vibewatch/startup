chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >-
              Supabase 眼下最清晰的身份，不是泛化的后端即服务（BaaS）厂商，而是一个 Postgres 开发平台：它试图用开源组件给开发者一套类似 Firebase 的体验。官网、文档和 GitHub
              代码仓库都讲着同一套架构故事：每个项目都是一个独立 Postgres 集群，外面包上身份验证、自动生成 API、Edge Functions、Realtime、Storage
              和向量工具。变现逻辑是托管云加企业增购，而不是闭源锁定。官方价格显示有免费层、$25 的 Pro 层和 $599 起的 Team 层；代码仓库和 YC 页面也强调自托管和可移植性。这个组合很关键，因为
              Supabase 可以同时像开源基础设施、托管开发者 SaaS 产品，也像一个不改变技术重心就能扩进企业账户的平台。身份不够清楚的地方在地理位置。YC 和公司页面称 Supabase
              完全远程，独立轮次报道说它位于 San Francisco，Tracxn 则把业务绑定到一个 Singapore
              法律实体。做尽调时，最稳妥的工作判断是远程优先，但法律总部和运营总部仍有未解区别，而不是认定一个来源充分的单一总部。
