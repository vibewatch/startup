  - id: FM003
    title: 买方 / 客群地图
    type: matrix
    layout: wide
    summary: Supabase 的需求客群主要差异在于：买方、用户、付款方是合并到一个开发者，还是拆分到工程、安全和采购等角色。
    data:
      columns:
        - 买方 / 用户 / 付款方结构
        - 主要预算负责人
        - 最适配原因
        - 主要阻力 / 替代方案
      rows:
        - label: 独立创始人 / 独立开发者
          values:
            - 三个角色合并为一人
            - 创始人 / 本人
            - 从想法到可用后端最快
            - 极小规模下，用量计费替代方案可能更便宜
        - label: 创业公司产品小队
          values:
            - 买方和用户是工程团队；付款方是创业公司预算
            - CTO / 工程负责人
            - 无需专职平台团队，也能获得可预测的托管后端
            - 也可能改用 Neon 或 Railway 加其他服务拼装
        - label: SQL 原生 Web / AI 团队
          values:
            - 工程主导采购，直接做技术评估
            - 平台或后端负责人
            - 一个 Postgres 记录系统，叠加 Auth、API 和向量支持
            - 需要更强的 SQL 熟练度和运维纪律
        - label: 移动优先应用团队
          values:
            - 产品工程同时评估两套技术栈
            - 移动工程经理
            - Supabase 可以适配类似 Web 的协作模式
            - 离线同步和移动端易用性占主导时，Firebase 胜出
        - label: 受治理企业工作负载
          values:
            - 用户、买方和付款方分散在应用团队、平台、安全和采购之间
            - 中央工程 / IT
            - 可移植性、控制力、合规和支持可以支撑平台标准化
            - 评估周期更长，也更直接面对最佳单项组合的竞争
    notes: 矩阵强调谁掌握预算，以及治理要求提高后，为什么候选清单会变化。
