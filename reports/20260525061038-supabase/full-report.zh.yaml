      - number: '8.3'
        title: 上市可比公司参照
        blocks:
          - type: paragraph
            body: >-
              Supabase 有用的上市可比组，不应抽象地叫「后端即服务」，而应是收入完全披露、已具规模的数据与开发者基础设施公司：MongoDB、Datadog、Snowflake 和
              Cloudflare。它们不是完美同业，但合在一起能框定公开市场当前愿意为持久软件基础设施资产支付的价格。截至 2026 年 5 月 22 日，MongoDB 约按 9.7x EV/revenue
              交易，Snowflake 约 12.5x，Datadog 约 20.6x，Cloudflare 约 32.5x。倒推 $2B 估值，这一区间意味着所需收入支撑分别约为：MongoDB 倍数下
              $206M，Snowflake 倍数下 $160M，Datadog 倍数下 $97M，Cloudflare 倍数下约 $62M。这就是本章保持谨慎的核心原因。只有当投资人押注的是一条类似 Cloudflare
              的溢价路径时，Supabase 第三方 2025 年高端估计 $70M 才开始更可信；而 $27M 至 $31M 的较低估计，明显低于大多数可比公司倍数所需的收入基数。官方 IR 页面和 SEC
              文件页面也提醒读者，这些可比公司规模更大、业务更多元、披露更充分，因此其倍数更像情境上限，而不是私营公司直接出清价格。
