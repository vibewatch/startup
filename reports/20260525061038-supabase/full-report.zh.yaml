  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 定价模型与收入架构
        blocks:
          - type: paragraph
            body: >-
              Supabase 的收入模型最容易理解为一条围绕 Postgres 基础设施的托管云订阅阶梯，上面再叠企业增购和用量扩张。官方价格支撑一个宽漏斗：免费入口、每月 $25 的 Pro 方案、每月 $599 起的
              Team 方案，以及更高的定制企业销售。重要的是，标价叙事不只是按席位计费的 SaaS。公开页面还显示，数据库磁盘、出站流量、时间点恢复保留、电话 MFA 和 SSO
              相关活跃用户收费都会带来可变变现。因此，实际收入应是基础订阅、用量超额和谈判型企业包的组合，而不是一笔扁平平台费。架构也影响定价权。Supabase
              仍依托开源和可自托管姿态，这有助于获客和信任，但相对完全专有后端可能限制锁定。企业和客户证明页面确实显示，客户愿意为合规、支持和规模付费；但公开材料仍只揭示标价，而不是实际折扣、ACV 或续约质量。
