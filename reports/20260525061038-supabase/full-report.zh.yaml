      - number: '4.4'
        title: 承销阻断点与反向证据
        blocks:
          - type: paragraph
            body: >-
              关键财务风险不是可见困境，而是披露不足叠加运营义务。Supabase
              公开的信息足以理解定价架构、产品宽度、客户热情和融资历史，但仍扣住严肃投资者承销收入质量所需的指标：现金、烧钱速度、毛利率、实际定价、留存、集中度和净收入扩张。反向证据之所以重要，是因为它暗示隐藏成本基。2026
              年 2 月故障持续 3 小时 42 分钟，源自 Supabase 自己的部署控制，而不是外部攻击或 AWS 大范围故障。事后复盘还承认，客户 Postgres 数据库的自动跨区域故障转移尚不可用。另有
              GitHub issues 显示，速率限制行为和 schema 缓存 bug 仍会给付费用户制造摩擦，意味着真实的支持和产品加固开支。即便备案可见度也有限：Tracxn 只暴露实体层面的 Singapore
              收入数据点，而本次运行中直接检索 OpenCorporates 被验证挑战阻断。结果是一个建设性但不完整的判断：经常性基础设施软件经济性有合理可能，资产负债表缓冲看起来也有意义，但严谨承销远未达到可辩护模型。
