  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品集合
        blocks:
          - type: paragraph
            body: >-
              Supabase 的市场边界比标题里的数据库或后端基础设施市场更窄，最容易从买家实际评估的产品包来定义。官方页面呈现的是一个 Postgres 项目，外面包上身份验证、即时
              API、边缘函数、realtime、存储和向量工具。因此，纳入范围的支出，是一个开发团队想要一层托管数据层加核心后端原语、且通常还没配备专门平台或数据库团队时的预算。排除范围包括通用
              IaaS、纯数据库管理工具、分析仓库，以及许多解决完全不同运营问题的企业 DBaaS 合同。最接近的全栈替代品仍是 Firebase，但 Bytebase 的 2026 年对比显示，选择已经不再是干净的 SQL
              对 NoSQL 切分，因为 Firebase Data Connect 已经加入托管 PostgreSQL 路径。核心圈之外，替代品集合会碎片化：Neon 和 PlanetScale
              是更强的数据库层替代品；Appwrite 是最接近的开源全栈同业；Amplify、Railway 和 Render 从更广的应用平台预算中分流；Hasura 更像数据 / API 邻接，而不是完整
              Supabase 替代品。这个边界逻辑很重要，因为更宽的框架会让市场看起来大于 Supabase 直接争夺的预算池。
