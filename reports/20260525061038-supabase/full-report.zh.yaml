      - - 数据库层拆捆绑
        - 部分买家只需要托管 Postgres 加分支或性能，不需要完整后端套件
        - Neon 和 PlanetScale 都在强化数据库优先替代方案
        - 高
        - Supabase 赢单中有多少真正需要一体化套件，而不只是更好的 Postgres 运维？
      - - 开源仿品
        - 可移植性有助于获客，也降低了 Appwrite 等开源同行的结构性门槛
        - Appwrite 捆绑了类似模块组合，并主推从 Supabase 迁移
        - 中高
        - 社区规模会转化为持久产品偏好，还是只降低获客摩擦？
      - - 多栈并用与基础设施替代品
        - 团队可以把部分栈留在 Supabase，同时把托管或数据库转到别处
        - Supabase 支持迁移路径，Railway、Render 等替代品也能在基础设施层共存
        - 中
        - 有多少客户把 Supabase 当成更大栈里的一个模块，而不是整个控制平面？
      - - 企业信任缺口
        - 安全和合规改进很重要，但可见事故和较弱采购能力仍可能拖慢大单
        - Supabase 已增加 Team 和 Enterprise 控制，但公开状态页仍显示实时运营事件
        - 中高
        - 企业管线更多卡在保证姿态，还是缺少功能？
      - - 品类商品化
        - 在位者和相邻玩家持续增加 PostgreSQL 和后端功能，削弱独特性
        - Firebase 增加了 Data Connect，PlanetScale 现在提供 Postgres，数据库优先玩家也在拓宽工作流界面
        - 高
        - Supabase 能让一体化套件明显优于市场默认方案吗？
