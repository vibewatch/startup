        - 需要用来对标估值、增长质量和收入耐久性
        - 仅有 Sacra 和 TapTwice 估计
        - 管理层收入历史、ARR 定义备忘录和月度收入桥
      - - 毛利率和 COGS
        - 无官方披露
        - 需要确认基础设施软件的毛利结构和支持成本负担
        - 计算和副本定价博客，加上客户工作负载案例
        - 按产品面拆毛利率，并拆出云 / 支持成本
      - - 现金余额、烧钱速度和现金跑道
        - 无官方披露
        - 需要测试融资依赖和悲观情景韧性
        - 仅有 Series D 规模和累计融资
        - 月度现金桥、烧钱预测和悲观情景规划模型
      - - 实际成交价和折扣
        - 无官方披露
        - 标价不能揭示 ACV、爬坡、回款质量或让利水平
        - 公开的 Free / Pro / Team / 定制企业版架构
        - 顶级合约样本，含 ACV、期限、折扣和续约
      - - NRR、流失和集中度
        - 未找到公开证据
        - 对判断经常性收入质量和企业客户耐久性至关重要
        - 只有客户 logo 和筛选过的案例研究
        - 队列留存、logo 流失和前 10 大客户敞口
      - - 支持负担、补偿和可靠性成本
        - 无量化披露
        - 宕机和产品 bug 暗示隐藏的支持与补救开支
        - 事故帖和 GitHub issue 线索
        - 支持工单量、事故补偿和 SRE 人员成本
      - - 直接申报可见度
        - 注册登记页被 challenge 拦截，保留下来的申报证据不完整
        - 限制基本法律主体和收入验证
        - Tracxn 主体行，加上被拦截的 OpenCorporates 检索
        - 获取本地注册登记摘录、经审计主体报表和所有权结构图
    notes: 本表直接记录投资判断中的卡点，而不是用低置信度猜测填补。
