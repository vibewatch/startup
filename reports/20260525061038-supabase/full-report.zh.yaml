  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 集成产品表面与开发者工作流
        blocks:
          - type: paragraph
            body: >-
              Supabase 卖的与其说是单个数据库功能，不如说是一套围绕 Postgres 紧密捆绑的后端运营表面。官方首页、文档、YC 资料和价格页面都描述了同一个核心模式：每个项目从一个 Postgres
              数据库开始，再往上叠身份验证、自动生成
              API、边缘计算、实时同步、存储和向量工具。这很重要，因为买方工作流异常短。小团队无需缝合多个控制平面，就能立起身份验证、关系型数据、文件处理和服务端逻辑。客户证据显示这套打包能力在实践中的用法。Xendit
              用完整 Postgres 加扩展，不到一周就上线制裁筛查工作流；Maergo 用 PostgREST 替换笨重中间件；Chatbase、Markprompt 和 Quivr 用同一套集成栈承载 AI
              和检索工作负载。产品包装也映射了工作流：免费和低端方案暴露平台完整形态，用量和治理功能向上扩展，而不是迫使早期架构重写。
