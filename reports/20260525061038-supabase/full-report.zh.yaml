  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Supabase 方案
      - 可量化收益 / 证据
      - 主要限制
    rows:
      - - 快速上线全栈 SaaS MVP
        - 小团队需要 Auth、数据库、API 和存储，但不想编排后端
        - 从一个项目起步，围绕同一个 Postgres 集群打开 Auth、API、Storage 和 Functions
        - Resend 和 Xendit 称，不必先搭后端管线就能快速发货
        - 公开证据多是筛选过的客户叙事，不是中立实施研究
      - - 替换中间件很重的 CRUD 后端
        - 团队想要关系型数据，也想要受策略控制的 API，但不想写太多自定义胶水代码
        - 用 PostgREST、Auth token 和 RLS 安全暴露应用数据
        - Maergo 大幅压缩代码库，并把部署时间降到秒级
        - RLS 和 schema 设计仍需要数据库素养，才不至于误配置
      - - 在同一套数据系统上构建 AI / RAG 产品
        - 开发者希望向量、元数据、文件和 auth 放在一起
        - 在同一平台上使用 pgvector，并配合 Storage / Auth / Functions
        - Chatbase、Markprompt、Quivr、Firecrawl 和 Humata 都描述了整合收益
        - 最好的公开证据来自客户侧；独立的生产基准仍然不足
      - - 支持受监管或需安全审查的买方
        - 团队需要私有网络、可审计性、SSO 和合规材料
        - 升级到 Team 或 Enterprise，获得 PrivateLink、审计日志、角色和证书访问
        - Enterprise 页面和 ISO 文章明显改善采购姿态
        - PrivateLink 目前只覆盖数据库连接，不覆盖 Supabase 全部表面
      - - 扩展读密集或分析密集应用
        - 工作负载超出单实例的简单边界
        - 先使用更大计算资源，或增加读副本来隔离分析和区域读取
        - Chatbase 和 Resend 的公开材料都贴合读副本和扩展叙事
        - 写密集或跨区域故障转移需求，单靠副本解决不了
    notes: 本表把具体的构建者任务映射到产品组合；它刻意区分快速构建的证据，和企业级成熟度这一证据较弱的主张。
