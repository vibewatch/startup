      - number: '2.4'
        title: 增长驱动、采用约束与保留缺口
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动不是抽象总可用市场（TAM）叙事，而是软件团队构建产品方式的具体变化。Postman 2025 年数据显示 API 正变得收入关键且 AI 原生；Stack Overflow、DB-Engines
              和 JetBrains 也支持 PostgreSQL 及其他开源数据库仍处在开发者工作栈中心的判断。这些条件有利于 Supabase 的 Postgres
              优先平台叙事。开源控制和自托管对部分买家也重要，因为它们保留了完全 Google
              托管替代品无法提供的退出选项和数据驻留。约束同样真实。治理要求高的客户只有在信任、合规和支持层级可信时才会扩张；一旦身份验证、策略、数据和边缘工作负载接入生产，切换成本会上升；Supabase
              的数据库中心模型也假设用户有比更抽象移动 BaaS 更强的 SQL 素养。成本动态两面切：Firebase
              式用量定价对小应用可能更便宜，而当实时流量扩张后，更平的平台定价更容易预测。仍未解决的尽调问题是品类清晰度本身。公开来源仍不同意应把 Supabase 按 BaaS、托管 Postgres
              还是更广应用平台来测算；公开价格证据也仍不均匀，无法在没有更多直接供应商输入时支撑完全归一的竞品 TCO 曲线。
