          label: 功能对等 / 可运维性影响受监管买家
        - from: privatelink
          to: expansion
          label: 与 AWS 匹配时改善采购
        - from: uptime
          to: expansion
          label: 可靠性塑造转化
        - from: customerops
          to: expansion
          label: 共同责任影响成败
    claimRefs:
      - CR003
      - CR013
      - CR018
      - CR023
      - CR038
      - CR041
      - CR043
      - CR048
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 尽管分发和融资信号很强，收入不透明和可靠性证据缺口抵消了这部分优势，因此投资建议仍保持谨慎。
    data:
      nodes:
        - id: scale
          label: 数百万开发者和庞大数据库足迹支撑溢价叙事
        - id: anchor
          label: 2025 年 4 月 $2B 估值的 Series D 轮是唯一证据扎实的估值锚
        - id: opacity
          label: 公开收入估计大约在 $27M 到 $70M 之间，限制精确度
        - id: comps
          label: 公开可比公司区间意味着，$2B 估值需要约 $62M-$206M 收入支撑
        - id: risk
          label: 可靠性和股权结构表未知项给名义价格增加下行
        - id: call
          label: 建议：继续研究；$2B 有合理性，但谈不上明显便宜
      edges:
        - from: scale
          to: call
          label: 支持继续跟踪
        - from: anchor
          to: call
          label: 给出清晰基准估值
        - from: opacity
          to: call
          label: 限制信心
        - from: comps
          to: call
          label: 需要更多收入证明
        - from: risk
          to: call
          label: 需要尽调折价
    approximationNotes: 该流程是定性图示，呈现本章推理链，而不是加权评分模型。
    claimRefs:
      - CV005
      - CV006
      - CV016
      - CV021
      - CV028
      - CV043
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 要支撑 $2B 估值，需要多少收入，很大程度取决于投资者采用哪一个公开倍数作为参照。
    data:
      items:
        - label: Cloudflare 倍数（~32.5x）
          value: 61.5
          detail: 所需收入，百万美元
        - label: Datadog 倍数（~20.6x）
          value: 97
          detail: 所需收入，百万美元
        - label: 20x 参照
          value: 100
          detail: 简单整数基准
        - label: Snowflake 倍数（~12.5x）
          value: 160.4
          detail: 所需收入，百万美元
        - label: MongoDB 倍数（~9.7x）
          value: 206.2
          detail: 所需收入，百万美元
    approximationNotes: 数值由 $2B 估值锚除以各选定倍数得出；它们是支撑门槛，不是预测。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持围绕 $2B 锚点的宽区间，重心仍低于后来关于 $5B 的传闻。
    data:
      items:
        - label: 悲观公开证据区间
          low: 0.4
          mid: 0.55
          high: 0.7
          unit: USD bn
        - label: 基准公开证据区间
          low: 1.1
          mid: 1.45
          high: 1.8
          unit: USD bn
        - label: 乐观公开证据区间
          low: 2
          mid: 2.5
          high: 3
          unit: USD bn
        - label: 2025 年 4 月锚点
          low: 2
          mid: 2
          high: 2
          unit: USD bn
        - label: 未经证实的后续估值
          low: 5
          mid: 5
          high: 5
          unit: USD bn
    approximationNotes: 最后一项作为区间外的冲突信号纳入，并非认可其作为估值锚。
    claimRefs:
      - CV016
      - CV031
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Supabase 在分发和产品拉力上得分最高，但在变现透明度和估值支撑上低得多。
    data:
      items:
        - label: 开发者分发
          value: 8
          unit: /10
          detail: 数百万注册开发者和强劲 OSS 采用度支撑其市场相关性。
        - label: 企业客户证明
          value: 6
          unit: /10
          detail: 具名客户背书和合规打包是正面信号，但经济性未披露。
        - label: 变现可见度
          value: 4
          unit: /10
          detail: 公开收入估计有用，但彼此冲突太大，难以精确投资测算。
        - label: 公开可比公司支撑
          value: 5
          unit: /10
          detail: 只有采用可比公司区间上半段，或 ARR 更高时，$2B 标记才有合理性。
        - label: 可靠性信心
          value: 4
          unit: /10
          detail: 事故透明度不错，但生产环境韧性仍需证明。
        - label: 融资锚质量
          value: 7
          unit: /10
          detail: Series D 轮报道清晰；后续估值并非如此。
        - label: 证据质量
          value: 4
          unit: /10
          detail: 公开证据足以形成区间判断，但不足以达到风险投资轮次的精度。
    approximationNotes: 分数是方向性的 IC 式判断，只基于截至基准运行日期留存的公开证据。
    claimRefs:
      - CV016
      - CV032
      - CV036
      - CV043
      - CV044
