      - number: '3.2'
        title: 画像、能力宽度与价格形态
        blocks:
          - type: paragraph
            body: >-
              最接近的功能宽度比较对象，其实不是最便宜的产品，而是能在不迫使团队自己拼后端的情况下可信替代最多模块的产品。Firebase 仍是最宽的既有厂商，因为它把托管数据、身份验证、托管、分析和 AI 工具叠在
              Google Cloud 之上，但它保持专有、多产品姿态，并且看起来仍最适合移动优先、重离线的用例。Amplify 的重要性来自另一点：它不像一个整齐的 BaaS，更像是为熟悉
              Cognito、AppSync、Lambda、S3 和 CDK 的全栈团队提供的 AWS 前门。Appwrite 是最清晰的开源全栈同业，因为它在一份订阅中打包身份验证、数据库、函数、存储、实时和自托管。Neon
              和 PlanetScale 更窄，但当购买标准是 serverless Postgres 经济性、分支或数据库运营时，它们很锋利。Supabase 自己的标价姿态相对同业有吸引力，因为它仍能被清楚读成
              Free、Pro、Team 和 Enterprise；Firebase 和 Amplify 则越来越按服务计量整套栈，Neon 按用量计量数据库计算。
