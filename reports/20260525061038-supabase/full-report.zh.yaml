      - number: '3.3'
        title: 切换成本、多栖、分发与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Supabase 受益于有意义但并非绝对的切换成本。一旦团队围绕 Supabase 写了
              schema、行级安全策略、身份验证流程、存储规则和部署习惯，迁移就是实打实的工作。但这个品类没有极端的合同或文件格式锁定。Supabase 自己的文档强调从 Firebase、Neon、Render
              和遗留数据库迁移，Appwrite 也公开宣传可从 Supabase 迁移。这就是市场的本质：可移植性帮助从封闭既有厂商手中赢得用户，也让邻接供应商更容易挑战这个品类。多栖在结构上也可行。团队可以保留
              Supabase 做身份验证和 API，同时把数据库工作负载、预览环境或运营服务转向 Neon、Render 或 Railway。分发上，Google 和 AWS 保留最强优势，因为 Firebase 和
              Amplify 连接着更广的云身份、伙伴生态和采购动作。信任上，Supabase 借 Team 和 Enterprise 控制、安全默认值以及 PrivateLink
              已有实质改善，但公开状态记录提醒我们，可靠性和企业保证仍是竞争筛选器。
