      - number: '7.5'
        title: 缓释真实存在，但只有运营和披露证据变得更清晰，风险视图才会改善
        blocks:
          - type: paragraph
            body: >-
              这不是一条会被一张糟糕状态页或一条法律条款击穿的投资逻辑。Supabase 手里有清晰的缓释资产：庞大的开发者社区、近期融资能力、企业级包装、更好的安全默认值、ISO
              认证、私有网络、读扩展指引，以及公开承认仍待补齐缺口的路线图。问题在于，最强的缓释项要么只向更大客户开放，要么依赖 AWS 或客户自己的实施纪律，要么仍有一部分停留在前瞻承诺。因此，观察项很直接。若
              Supabase 能证明 2026 年 2
              月之后运营记录干净，并发布更清晰的故障切换和多区域指引，可靠性风险会下降。若管理层披露套餐结构、企业转化、客户集中度，以及权威的融资和收入基线，商业模式风险会下降。若公司页面和第三方页面上的公开事实不再漂移，治理风险会下降。在那之前，审慎立场是把公司视为高潜力但剩余风险仍高：强到值得继续尽调，但透明度还不足以只靠叙事下判断。
