        - 评估从 Firebase 或定制栈迁移的真实工作量
      - - SQL 能力要求
        - 约束
        - 当前
        - 更适合工程能力强的团队，但对追求抽象层的买家吸引力变弱
        - 追问成功部署中有多少依赖内部 SQL 专长
