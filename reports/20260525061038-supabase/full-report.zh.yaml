        - DDN、连接器、GraphQL API、authz、私有部署
        - 占住数据访问层，而不是整个应用后端
        - 不是完整后端套件
      - - PlanetScale
        - 相邻托管数据库厂商
        - 包含 Postgres 和 Vitess 的托管数据库平台
        - 优化高可用数据库运维的团队
        - Postgres 和 Vitess 集群、分支、HA、支持
        - 从数据库核心扩展到更广的托管 Postgres 部署
        - 缺少捆绑的身份认证、存储和实时能力
