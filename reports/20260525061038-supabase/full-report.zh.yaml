      - number: '7.2'
        title: 商业模式风险来自转化数学、定价压力和集中依赖
        blocks:
          - type: paragraph
            body: >-
              Supabase 的商业吸引力很明显：开源分发、强开发者好感和简单价格阶梯让初始采用变得容易。风险在于，同一结构把大部分耐久变现推向更窄的一组 Team 和 Enterprise
              升级，而公开转化数学缺失。价格栈仍清晰分层，但公开语料里，投资者看不到方案组合、扩张、集中度或留存细节。即便市场安静，这个缺口也重要；竞争压力在两端上升后，它更重要。Bytebase 的 2026
              年对比认为，Firebase 借 Data Connect 缩小了旧有关系型与 NoSQL 分野，同时仍保留更强的移动 / 离线工具；Tracxn
              统计更广应用后端栈周围有数百个活跃竞争者。与此同时，Supabase 一些最佳企业缓释措施高度依赖外部，而非普遍适用。PrivateLink 有意义，但初始发布仅支持 AWS
              且限同区域，条款也明确设想关键供应商或第三方产品故障时可能暂停服务。结果是，当开发者动能强时，这个模型看起来很有力量；但放到企业转化纪律和超大规模云厂商竞争面前，它更脆弱。
