  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程 / 组件
      - 角色
      - 依赖
      - 薄弱时的风险
    rows:
      - - 每个项目一个隔离的 Postgres 集群
        - 承载关系型数据、扩展和核心策略状态的记录系统
        - 托管 Postgres 运维和扩展兼容性
        - Postgres 运维一旦滞后，几乎所有上层模块都会一起降级
      - - Auth + JWT + RLS 路径
        - 创建身份，并通过策略限定数据库 / API 访问范围
        - GoTrue、JWT 签名、Postgres schema，以及客户编写的 RLS 策略
        - 默认设置薄弱或策略体验差，可能带来安全暴露或开发者流失
      - - 经 PostgREST / 网关的 API 层
        - 把数据库对象变成面向应用的 API，并集中处理流量
        - PostgREST、Kong、auth header 和 schema 状态
        - schema 缓存或网关故障可能打断大范围应用功能
      - - Realtime 变更和在线状态管线
        - 把数据库变更和临时事件转成 websocket 推送更新
        - 逻辑复制、Realtime 服务，以及已授权的客户端订阅
        - 一旦延迟高或脆弱，协作和实时 UX 主张会迅速变弱
      - - Edge 运行时和自动化路径
        - 在用户附近运行低延迟 TypeScript 函数和 hook
        - Edge gateway、Deno 兼容运行时、密钥，以及安全的 Postgres 连接模式
        - URL 生成、连接池或冷启动等运维坑，可能在生产中暴露
      - - 托管与自托管控制平面分割
        - 决定客户实际能获得哪些治理、备份、指标和平台 API
        - Docker / 自托管支持、文档和企业支持动作
        - 客户可能高估二者平价，并低估自托管环境所需的运维工作
    notes: 架构之所以自洽，是因为大多数模块最终都回到 Postgres；尽调的主问题不是这些部件是否存在，而是运营耦合会在哪里变成共同故障模式。
