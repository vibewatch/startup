      - number: '1.2'
        title: 创始人、治理与资本基础
        blocks:
          - type: paragraph
            body: >-
              领导层和资本比正式治理更容易锚定。用户提供的框架、TechCrunch、Tech Funding News、TapTwice 和 Tracxn 都把 Paul Copplestone 与 Ant Wilson
              列为创始人，Copplestone 明确担任 CEO，也是公司的公开面孔。公开材料还显示，Supabase
              的文化仍深受创始人塑造：它强调开源维护者、前创始人和开发者优先的运营方式，这有利于产品速度，但也意味着一小撮创始团队存在关键人物依赖。治理披露明显更薄。保留来源中的官方公司页面没有发布当前董事会页面或控制权地图，Tracxn
              的董事会清单也只是第三方的部分重建。因此，即便融资历史能互相印证，也不自动等于公开治理透明。相比之下，最新轮次的资本形成有充分覆盖。保留的 2025 年 4 月报道支持一轮 $200 million Series
              D，估值 $2 billion，约七个月前还有一轮约 $80 million 的前置融资。保留报道中最清晰的投资方组合是 Accel、Coatue、Y Combinator、Craft Ventures 和
              Felicis，Y Combinator 也作为更早期机构支持者出现。Tracxn 另有后续 Series E 和 $5 billion 估值条目，但没有一手佐证，只应作为已标记冲突保留，而不是写进标准历史。
