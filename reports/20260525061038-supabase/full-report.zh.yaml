      - number: '6.2'
        title: 具名客户、案例研究与生产使用证明
        blocks:
          - type: paragraph
            body: >
              本章最强的证据不是 logo 陈列，而是一组数量可观、带有具体工作负载细节的具名生产故事。Maergo、Shotgun、Good
              Tape、Markprompt、Mobbin、Chatbase、Firecrawl、Quivr、Xendit、Resend、Voypost 和 Humata
              都描述了真实部署，许多还补充了比普通初创客户页更具体的量化结果。Maergo 提到 100x 压测流量和快得多的部署；Shotgun 提到基础设施成本降低 83%、数据库响应时间下降；Good Tape 报告每周
              75,000 次转写、客户分布 130 个国家，并在一个月内迁移数据库和身份验证工作负载；Chatbase 称平台支持数千个生产 AI 智能体和超过 8,000 名付费客户；Resend 报告超过 5,000
              名付费客户、超过 300,000 名注册用户和每日数百万封邮件。Xendit 的制裁筛查工作流不到一周就上线生产，据称九个月无问题运行。这些都是有意义的证明，说明 Supabase
              被有收入的软件企业用于生产；但大多数来源材料仍来自 Supabase 撰写的案例研究，而不是客户撰写的复盘或中立审计。
