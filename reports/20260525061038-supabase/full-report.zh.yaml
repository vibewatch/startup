  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 典型路径从开发者发现开始，进入生产部署、治理审查，再扩展到更大的账户。
    data:
      items:
        - label: 发现
          actor: 独立开发者或初创公司创始人
          touchpoints:
            - 文档、GitHub 和客户故事
            - 免费创建项目和快速原型
            - 与 Firebase、Auth0 或向量专门厂商对比
          emotion: 想要快速搭建，降低协调开销
          painpoint: Too many backend vendors slow the first launch
          opportunity: Supabase wins with one bundled Postgres-centered stack
        - label: 第一个生产工作负载
          actor: 工程负责人或产品团队
          touchpoints:
            - 托管 Postgres 和 Auth 上线
            - 数据迁移或新应用发布
            - 非数据库专员使用仪表盘
          emotion: 想要速度，不想背运维负担
          painpoint: Reliability and migration risk matter as traffic becomes real
          opportunity: Customer stories show rapid time-to-production and simpler operations
        - label: 扩张
          actor: 需求扩大的同一账户
          touchpoints:
            - 添加存储、向量、边缘函数、只读副本或备份
            - 更多团队查询或管理数据层
            - 安全审查和支持互动加深
          emotion: 看到工具整合带来的便利
          painpoint: Scaling and governance needs start to outrun self-serve defaults
          opportunity: Land-and-expand economics improve if module attachment holds
        - label: 治理 / 采购
          actor: 安全、平台或合规负责人
          touchpoints:
            - SSO、审计日志、PrivateLink、支持、自托管讨论
            - ISO 27001 和更广泛合规审查
            - 事故和可用性审查
          emotion: 关注控制权、韧性和问责
          painpoint: Public proof of retention and concentration is limited
          opportunity: Enterprise packaging can convert technical adoption into larger contracts
        - label: 续约 / 信任测试
          actor: 现有客户或参考买方
          touchpoints:
            - 支持互动和事故响应
            - 持续工作负载表现和运维棘手点
            - 潜在背调电话或公开案例研究
          emotion: 如果价值压过信任风险，就会留下
          painpoint: Outages or opaque limits can reopen vendor-evaluation decisions
          opportunity: Strong support plus low migration pressure can support durable accounts
    claimRefs:
      - CU007
      - CU008
      - CU026
      - CU029
      - CU030
      - CU031
      - CU033
      - CU040
