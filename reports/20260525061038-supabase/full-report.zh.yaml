      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Supabase
              所在市场里，买家、用户和付款人常常一开始是同一个人，之后才分离。独立创始人、独立开发者和小型初创团队中，选择平台的用户通常也是预算所有者；关键决策是上线速度与成本可预测性之间的取舍。当工作负载变得更生产关键时，经济买家会转向
              CTO、工程副总裁（VP Engineering）或平台负责人；一旦 SSO、审计日志、支持 SLA 或数据驻留成为要求，安全、IT 和财务也会开始影响短名单。分层匹配并不均匀。SQL 原生 Web
              应用、内部工具、协作型 SaaS 和 AI 产品天然适合 Supabase，因为它们受益于一个 Postgres 记录系统、即时 API 和向量工具。大量依赖离线同步的移动优先产品匹配度较弱，因为
              Firebase
              的离线和移动同步叙事仍更强。这形成了一条可识别的采用路径：免费或低成本评估、单团队生产采用、治理审查，然后要么企业标准化，要么重平台化到同类最佳数据库和部署服务。因此，市场不是由一个单体买家塑造，而是随着复杂度和风险上升，由一连串买方角色变化塑造。
