      - 状态
      - 范围
      - 支撑什么
      - 剩余缺口
    rows:
      - - ISO/IEC 27001:2022 认证
        - 官方宣布
        - 覆盖 Database、Auth、Storage、Realtime、Edge Functions 和 Data API 的 ISMS
        - 帮助国际买方完成安全审查和采购
        - 认证是必要条件，但还不足以证明运行时可靠性
      - - 安全默认值和修复工具
        - 公开文档
        - 仪表盘表默认 RLS、事件触发器模式、Security Advisors、Assistant 工作流
        - 把安全前移到开发者工作流，降低意外暴露
        - 公开证据没有量化客户在实践中仍会多频繁误配置策略
      - - 现代密钥管理
        - 公开文档
        - 可发布密钥、可吊销密钥、非对称 JWT 支持、GitHub 泄露撤销
        - 改善轮换、可审计性和爆炸半径控制
        - 旧密钥迁移仍会持续到 2026 年底
      - - 私有网络
        - Beta / 有限发布
        - Team 或 Enterprise 上面向 Postgres 和 PgBouncer、仅限 AWS 的 PrivateLink
        - 降低公网攻击面，支撑受监管工作负载
        - 尚未覆盖 API、Storage、Auth 或 Realtime 端点
      - - 企业控制和支持
        - 商业可用
        - 审计日志、访问角色、网络限制、指定专家、支持覆盖
        - 提升企业采用准备度和迁移信心
        - 公开证据停留在描述层面，不是经 SLA 级运营审计的证据
      - - 事故透明度和韧性姿态
        - 可见但信号参差
        - 详细的 2026 年 2 月事后复盘、公开状态页、明确承认故障转移缺口
        - 透明度和根因披露较好
        - 真实的平台级宕机，加上没有自动跨区域故障转移，使韧性仍是活跃风险
    notes: 企业买方越来越看得懂这些控制，但本表把治理姿态和多区域故障场景下硬运行时韧性这个仍未解决的问题分开。
