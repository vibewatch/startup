      - number: '7.4'
        title: 治理和披露风险更多是承销输入不足，而非丑闻
        blocks:
          - type: paragraph
            body: >-
              Supabase 在公开尽调中的治理问题是不透明，而不是明显不当行为。公司是私营企业，投资者只能把公司营销页面与互相对不上的第三方数据库混在一起，三角测量业务健康。官方公司页面仍称 Supabase 已融资超过
              $116 million，而 TechCrunch、TechFundingNews 和 Fortune/Yahoo 对 2025 年 Series D 的报道指向约 $398 million 累计融资、估值 $2
              billion。Tracxn 更进一步，报告了 2025 年后续 Series E、$544 million 累计融资和 $5 billion 估值。用户指标也随来源移动：一篇融资文章称 2 million
              开发者，公司页面称 7M+ 注册开发者，100k 星标文章称 8 million
              开发者。这些数字不一定证明欺骗，但合在一起说明市场缺少一个权威、当前的运营基线。同样模式也适用于收入和集中度：第三方估计存在，但没有公开审计收入、没有留存披露，也没有干净方案组合数据。再叠加创始人和社区主导的叙事，关键人物和披露风险明显高于品牌光泽所暗示的水平。
