company:
  name: Govini
chapter:
  number: 6
  title: Customers
  summary: >-
    Govini's public customer evidence is unusually concrete for a defense-software company,
    but it is much stronger on named deployments and contract access than on retention
    metrics. The strongest proof points are the Army's $49 million Ark SaaS contract,
    Washington Headquarters Services' bridge award for continued and expanded use, the
    Navy's industrial-base deployment, and Govini-authored DLA and Army workflow case
    studies with quantified outcomes. Public sources also show procurement leverage through
    SCRIPTS and Carahsoft. The main underwriting gap is durability visibility: no retained
    source discloses customer count, NRR, GRR, churn, NPS, or top-account concentration,
    so the customer story supports mission relevance and expansion pathways more than it
    supports measurable retention quality.
sections:
- id: federal-customer-base-and-buyer-map
  title: Govini's customer base is broad across U.S. defense buyers, but still concentrated inside federal procurement
  body: |-
    Public evidence supports a real customer base, not just a prospect list. Bain Capital says Ark is trusted by every department of the U.S. military and other federal agencies, while Govini's late-2025 releases and contract records show concrete buying paths through Army Contracting Command, Washington Headquarters Services on behalf of the acquisition office, the Navy, and the SCRIPTS BPA sponsored by the Office of the Under Secretary of Defense for Acquisition and Sustainment. Govini's own product pages add specific mission-supported logos and workflow case studies for the Defense Logistics Agency, Army Futures Command and other defense organizations, plus one unnamed federal healthcare agency. That combination matters because it separates abstract platform breadth from actual procurement and operational use. At the same time, the revenue base still appears overwhelmingly federal and U.S.-centric. The public record does not show meaningful commercial, allied, or self-serve customer diversification. For diligence purposes, the buyer map looks strongest where Govini solves supply-chain, sustainment, logistics, and acquisition workflows for large defense institutions; it looks weakest where an investor would want customer-count disclosure, civilian-agency mix, or direct proof of renewals outside the core defense establishment.
