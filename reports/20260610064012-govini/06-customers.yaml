- id: TU006
  title: Customer evidence gap table
  columns:
  - Missing datapoint
  - Why it matters
  - Best public proxy today
  - Required diligence path
  rows:
  - - Paying-customer count
    - Needed to distinguish true portfolio breadth from a few large contracts.
    - Bain breadth claim plus several named defense organizations.
    - Request current paying agencies, active programs, and logo count trend.
  - - Top-account concentration
    - Needed to understand renewal volatility and budget sensitivity.
    - Army, WHS, Navy, and SCRIPTS appear important, but mix is unknown.
    - Request ARR by top five and top 10 customers / vehicles.
  - - Net and gross revenue retention
    - Core durability metric for subscription software underwriting.
    - Multi-year vehicles and repeat-award language only.
    - Request cohort retention, GRR, NRR, and logo churn by agency cohort.
  - - Active-seat and usage depth
    - Needed to distinguish shelfware from mission-critical adoption.
    - Operational case studies with strong workflow outcomes.
    - Request seats sold, MAU/WAU analogs, and workflow frequency by module.
  - - Implementation and expansion time
    - Needed to know how quickly Govini can convert procurement into visible user value.
    - ATO and contract-vehicle evidence imply readiness but not deployment duration.
    - Request median time from award to live deployment and to second-module adoption.
  - - Satisfaction and support quality
    - Needed to understand renewal resilience and service burden.
    - No retained public NPS, CSAT, or complaint dataset.
    - Request support SLAs, NPS, CSAT, and lost-deal / churn reasons.
  notes: These gaps do not negate the customer story; they define the minimum private data room needed to underwrite durability.
