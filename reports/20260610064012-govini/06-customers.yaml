- id: customer-verdict-and-diligence-priorities
  title: Customer verdict is strong mission fit with real logos and contracts, but investors still need private durability data
  body: |-
    The customer chapter underwrites two things confidently. First, Govini has won real credibility with defense buyers; this is not a company relying on one pilot and a slide deck. Second, the product is being used in mission areas where outcomes matter—industrial-base resilience, logistics planning, sustainment readiness, and acquisition modernization—so the software is clearly attached to consequential customer jobs. What the chapter cannot underwrite from public data is durability quality at the portfolio level. A company can have high-value federal accounts and still face concentration, budget timing, or renewal volatility if buying authority sits with a narrow set of sponsors. The next diligence step should therefore focus less on whether customers exist and more on how usage compounds: seat growth by account, application expansion by agency, renewal rates, implementation timelines, referenceable champions, churn reasons, and the exact share of ARR tied to the top five programs or procurement vehicles.
