- id: retention-expansion-and-concentration
  title: Expansion paths are visible through vehicles and module breadth, but retention economics remain almost entirely opaque
  body: |-
    Public sources support a plausible land-and-expand motion. Sacra describes Govini's model as expanding through added seats and modules as agencies digitize more workflows, and the procurement record supports that story directionally: the Army award runs through 2030, transaction history shows modifications after award, the WHS bridge contract explicitly says mission partners can continue and expand use, and the SCRIPTS BPA gives DoD and civilian agencies a lower-friction route to access Ark's Supply Chain application. Those are useful retention proxies, but only proxies. No retained source discloses customer count, renewal rate, NRR, GRR, churn, implementation duration, NPS, or a top-10 account mix. That makes it hard to distinguish durable product pull from contract-vehicle availability. Concentration risk is also material. Public business coverage says Govini sells to federal customers, and nearly all retained customer proof sits inside defense acquisition and industrial-base missions, which means procurement delays, continuing resolutions, and changes in program priorities can affect both new deployments and renewals. SCRIPTS broadens reach, but it is a multi-award vehicle with nine awardees, so access should not be confused with captured spend. The right customer verdict is therefore positive but qualified: Govini appears embedded in high-value defense workflows, yet public durability and concentration metrics are still too thin for a clean retention underwriting case.
