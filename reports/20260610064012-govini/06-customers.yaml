tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Customer segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Revenue / strategic value
  - Key gap
  rows:
  - - Department-wide acquisition leadership
    - Buyer and sponsor are enterprise acquisition offices such as OUSD A&S or WHS; users are analysts and program teams; payer is federal contract funding.
    - Cross-portfolio acquisition modernization, industrial-base risk, and enterprise software standardization.
    - WHS bridge contract and SCRIPTS sponsorship show enterprise-level procurement leverage.
    - High strategic value because this segment can unlock multi-program standardization and expansion paths.
    - Public sources do not show seat counts, budget owners by office, or realized ARR from enterprise sponsors.
  - - Military service and component program offices
    - Buyers are service contracting and program offices; users include logisticians, sustainment teams, and acquisition operators; payer is program or service funding.
    - Army and Navy mission workflows spanning logistics, supply chain, and production readiness.
    - Army IDIQ through 2030 plus named Navy deployment are the clearest scale signals.
    - Likely core revenue segment because these customers buy operational software tied to specific mission workflows.
    - No public account list or spend concentration by service is disclosed.
  - - Defense industrial-base and supplier-risk teams
    - Buyers are supply-chain and industrial-base leaders; users are analysts performing FOCI, vendor due diligence, and resilience monitoring.
    - Continuous screening of vendors, suppliers, and production ecosystems.
    - SCRIPTS BPA and DLA / Navy proof suggest this workflow family is one of Govini's strongest wedges.
    - Attractive expansion vector because the same data spine can support multiple applications and use cases.
    - Public evidence does not reveal how much of the BPA ceiling has converted to recurring spend.
  - - Federal civilian and national-security agencies
    - Buyers appear to be agency mission offices; users are risk and acquisition teams; payer is agency program funding.
    - Vendor-risk monitoring and industrial-base analysis beyond DoD.
    - Bain cites other federal agencies, while Govini's Supply Chain case study shows one unnamed federal healthcare agency.
    - Useful diversification signal versus a purely service-branch business.
    - Public evidence is largely unnamed and does not quantify civilian revenue contribution.
  - - Channel and reseller path
    - Buyer of record may be a reseller such as Carahsoft while end users remain government agencies; payer remains government procurement budgets.
    - Procurement access, contract convenience, and distribution support.
    - Carahsoft hosts Govini's offering and broadens purchasing channels.
    - Can shorten procurement friction and widen reach into agencies that prefer established resellers.
    - Reseller involvement can obscure direct customer intimacy and exact end-account mix.
  notes: Segmentation is inferred from retained contracts, product pages, partner listings, and mission descriptions rather than from a disclosed customer roster.
