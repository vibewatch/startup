- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Add more seats and modules inside existing agencies
    - Module breadth does not guarantee budget authority or user adoption across programs.
    - Expansion could be large if Ark becomes the standard workflow layer, but false if deployments stay narrow.
    - Review account-level seat growth, module attach rates, and sponsor maps by agency.
  - - Contract-vehicle leverage via Army IDIQ, WHS, and SCRIPTS
    - Vehicle access can be mistaken for realized demand; SCRIPTS is also multi-award.
    - Pipeline may look bigger than booked ARR if agencies do not convert access into recurring orders.
    - Request bookings, backlog, and obligational burn by vehicle.
  - - Cross-service adoption helped by 2025 ATO claims
    - Security readiness eases expansion, but each program still faces budget and change-management hurdles.
    - Good deployability signal, but not a direct predictor of renewals.
    - Request implementation timelines and time-to-value by service.
  - - Federal-only customer concentration
    - Revenue concentration to U.S. budget cycles, procurement timing, and defense priorities remains high.
    - Continuing resolutions or program deferrals can delay both net-new and renewal decisions.
    - Request top-customer ARR share and exposure to each appropriation path.
  - - Reseller and channel support
    - Partners like Carahsoft can widen distribution but can also intermediate direct customer ownership.
    - Helps procurement friction but may reduce visibility into user satisfaction and upsell control.
    - Request direct-vs-channel mix and channel economics.
  - - Civilian and intelligence expansion
    - Bain cites other federal and intelligence deployments, but public proof is thin and mostly unnamed.
    - Diversification potential exists, yet it is not underwritten by transparent public customer data.
    - Request named references and ARR contribution outside DoD.
  notes: Expansion logic is real, but concentration risk remains material because nearly all retained proof sits inside U.S. federal acquisition and defense missions.
