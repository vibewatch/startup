artifact: valuation
slug: govini
runDate: '2026-06-10'
company:
  name: Govini
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a serious software asset, but not an obvious bargain. Govini's
    reported $100M-plus ARR milestone, 100%+ three-year CAGR, and real defense customer proof
    make a billion-dollar valuation plausible. Sacra's roughly $1.3B secondary estimate implies
    an ARR multiple near 13x, which is much cheaper than Palantir's public premium but much
    richer than distressed govtech or lower-conviction AI names. The underwriting problem is not
    scale; it is denominator quality. Public sources still do not disclose margins, NRR, GRR,
    top-account concentration, or contract-conversion depth. The best-supported stance is
    conditional proceed with entry discipline: fair-to-slightly-full at the current public mark,
    attractive only if private diligence proves durable expansion and manageable concentration.
sections:
- id: current-mark-and-what-it-implies
  title: The public mark is plausible on revenue scale, but not yet derisked by durability data
  body: |-
    The core valuation fact pattern is straightforward. Bain, CNBC, and GovConWire all support that Govini crossed $100 million in ARR in October 2025, while Bain's growth investment and broader press coverage confirm that the company joined the defense-unicorn cohort. Sacra provides the most usable public pricing anchor, estimating an implied valuation of roughly $1.3 billion. On the reported ARR denominator, that implies about a 13x ARR multiple. That is not cheap in an absolute sense, but it is not irrational either. A company growing quickly inside a mission-critical defense niche can plausibly command a double-digit revenue multiple if customer durability and expansion quality are real. The problem is that public data is still sparse where valuation most needs support. There is no retained public disclosure of gross margin, free-cash-flow profile, NRR, GRR, churn, or top-account exposure. As a result, the mark is easier to defend as a strategic software-asset valuation than as a rigorously underwritten subscription-economics valuation.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV001
  - TV003
  figureRefs:
  - FV001
- id: public-comp-set-and-range
  title: Public comps argue for a wide band, with Govini sitting between premium defense software and fragile govtech
  body: |-
    The comparable set is more useful as a band than as a precise formula. Palantir is the upper-quality analogue: a mission software company with federal credibility, strong commercial growth, and public-market enthusiasm. Its June 2026 valuation ratios are dramatically above what Govini's current private mark implies, which shows that defense software can support extraordinary multiples when scale, profitability, and durability are visible. FiscalNote is the opposite warning case. Its 2025 filing and June 2026 market-cap data show how violently government-adjacent software can derate when execution, balance-sheet, and demand quality weaken. C3.ai and BigBear.ai illustrate a volatile middle zone where AI narrative and public-market appetite can move valuation sharply without making the underlying business low-risk. Tyler Technologies is the steadier govtech reference: much more mature, less defense-specific, and valued as a proven public software company rather than a narrative-heavy AI asset. Against that set, Govini's implied 13x ARR looks aggressive versus opaque or struggling names, but conservative versus the market's willingness to reward truly durable category leaders.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
