- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Govini appears to own a differentiated defense-acquisition workflow niche with real customer proof.
    - Stronger named customer expansion and multi-module adoption data would strengthen conviction.
  - - $100M-plus ARR and 100%+ three-year CAGR justify taking the asset seriously.
    - If ARR quality is weaker than implied by public headlines, conviction drops sharply.
  - - Procurement vehicles and sponsor offices can widen expansion inside DoD.
    - If those pathways have poor conversion from access to usage, the growth case weakens.
  - - Security and trust signals lower deployment risk in sensitive workflows.
    - Weak audit, incident, or ATO-maintenance evidence would meaningfully damage the thesis.
  - - The current implied multiple is far below Palantir's public premium.
    - Palantir is only relevant if Govini can show similarly strong durability and economics.
  - - The main anti-thesis is opacity around concentration, renewals, and margins.
    - Private data proving software-like margins and healthy retention would move the stance from conditional to more affirmative.
  notes: The anti-thesis is mostly about denominator quality, not about whether Govini has built something valuable.
  claimRefs: [CV018, CV019, CV020, CV021, CV022, CV024, CV026]
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR grows well beyond the 2025 milestone, multi-module expansion is strong, renewals are healthy, and concentration is manageable.
    - 18x-22x ARR or equivalent strategic-premium logic supports roughly $1.8B-$2.2B+ value.
    - Execution or budget shocks interrupt momentum before durability is proven.
    - Low-to-medium
  - - Base
    - ARR claim is real, growth remains attractive, but concentration and margin data are mixed rather than elite.
    - 11x-16x ARR logic supports roughly $1.1B-$1.6B fair-value band.
    - Investors overpay for growth without enough renewal proof.
    - Medium
  - - Bear
    - Concentration is high, renewals are weaker than expected, or public demand signals fail to convert into stable usage.
    - 7x-10x ARR logic supports roughly $0.7B-$1.0B value.
    - One or two major sponsor pathways slow or compress materially.
    - Medium
  notes: Scenario ranges are analytical estimates, not company guidance.
  claimRefs: [CV011, CV012, CV013, CV014, CV023, CV034]
- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Palantir
    - June 2026 public valuation ratios
    - Market cap $316.61B; PS 60.61x; EV/Sales 59.11x
    - Best proof that high-trust defense software can command extreme premiums when growth and durability are visible.
    - Far larger, more diversified, and far more transparent than Govini.
  - - FiscalNote
    - June 2026 public market value and revenue snapshot
    - OTC market cap $4.79M on $87.92M revenue; distressed govtech outcome
    - Useful downside warning for government-adjacent software when durability and capital structure break.
    - Different product category and clearly distressed, so not a central valuation anchor.
  - - C3.ai
    - June 2026 public market value
    - Market cap $1.57B; down 48.02% YoY
    - Useful narrative-AI comp showing public-market volatility around AI software.
    - Not defense-acquisition specific and public-market sentiment swings sharply.
  - - BigBear.ai
    - June 2026 public market value
    - Market cap $1.91B; up 71.80% YoY
    - Closer defense / AI adjacency and useful evidence that subscale defense-AI names can still hold billion-dollar values.
    - Highly volatile and not a clean profitability or durability benchmark.
  - - Tyler Technologies
    - June 2026 public market value
    - Market cap $12.70B
    - Mature govtech reference showing value creation when software is deeply embedded in government workflows.
    - Not AI-forward, not defense focused, and much more mature than Govini.
  notes: This comp set is used to create a band, not a single-point pricing formula.
  enumerationScope:
    coverage: partial
    basis: Rows capture the most decision-useful public software and govtech references available in retained evidence; no comp is a perfect match for defense-acquisition software.
  claimRefs: [CV009, CV010, CV015, CV016, CV017, CV025, CV026, CV027, CV028, CV029]
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Customer concentration too high
    - Top-account or top-path exposure is materially higher than the public story suggests
    - Makes the growth and renewal story much more fragile
    - Demand a lower entry or walk away
  - - Renewal quality weak
    - GRR / NRR or logo retention is inconsistent with mission-critical positioning
    - Cuts the justification for a double-digit revenue multiple
    - Re-rate to bear or pass
  - - Margins not software-like
    - Gross margin and delivery burden look closer to services than scaled SaaS
    - Undermines premium-multiple logic
    - Compress valuation assumptions materially
  - - Vehicle conversion poor
    - SCRIPTS, Army, and WHS pathways do not translate into deployed usage
    - Suggests pipeline narrative is overstated
    - Lower growth case and extend time horizon
  - - Security / compliance weakness surfaces
    - Incident, audit, or ATO evidence is weaker than public trust claims imply
    - Threatens deployment breadth and customer confidence
    - Pause or terminate the investment case
  notes: Kill triggers focus on public-claim verification rather than on speculative market timing.
  claimRefs: [CV030, CV031, CV032, CV035, CV036, CV039]
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Customer concentration
    - Top-10 ARR mix and sponsor-path concentration
    - Determines how fragile the revenue base is.
    - Finance and sales ops diligence
  - - Retention quality
    - GRR, NRR, logo retention, and module attach by agency cohort
    - Determines whether the revenue denominator deserves a premium.
    - Revenue analytics and customer-success diligence
  - - Margin structure
    - Gross margin, services burden, and implementation cost profile
    - Determines whether Govini is software-like or services-heavy.
    - Finance and delivery diligence
  - - Security posture
    - Incident history, audit outcomes, ATO maintenance, and control evidence
    - Core trust pillar for sensitive defense workflows.
    - Security diligence and control review
  - - Vehicle conversion
    - Bookings, usage, and renewal performance by Army, WHS, and SCRIPTS pathways
    - Tells investors whether procurement access is real monetization.
    - Sales / GTM diligence
  - - Exit readiness
    - Public-company controls, disclosure maturity, and appetite for eventual liquidity event
    - Determines how quickly value can be realized by outside investors.
    - CFO / board diligence
  notes: These asks are the minimum work required before turning public plausibility into private underwriting.
  claimRefs: [CV033, CV034, CV037, CV038, CV039, CV040]
