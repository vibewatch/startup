  - TV002
  figureRefs:
  - FV004
- id: downside-triggers-and-final-work
  title: The last mile is not market discovery but proof of quality beneath the revenue headline
  body: |-
    Public evidence is enough to justify serious work, but not enough to close. The most important final diligence asks all sit below the ARR headline: customer concentration, renewal behavior, margin structure, implementation burden, and the real conversion rate from contract vehicles into active deployments. The downside case is easy to imagine if those answers are weak. A company selling mainly to a small set of federal sponsors can de-rate quickly if one or two programs slow, if contract vehicles fail to convert to usage, or if security and implementation friction cap expansion. The upside case is also easy to imagine if Govini can prove multi-module expansion, durable mission ownership, and software-like economics. That is why the final recommendation should remain conditional rather than binary. The company has earned valuation attention, but not yet valuation complacency, and prudent investors should keep underwriting discipline tighter than the headline growth rate alone would suggest.
