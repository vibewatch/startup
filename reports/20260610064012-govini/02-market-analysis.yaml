callouts:
  - calloutType: strength
    title: "Policy-Driven Demand: EO and SWP Create Structural Tailwind"
    body: >
      The April 2025 White House executive order mandating commercial software for defense acquisition and the March 2025 DoD mandatory Software Acquisition Pathway directive create a structural, top-down demand tailwind that converts Govini's value proposition from optional to required. This is a rare policy environment that directly benefits Govini's category.
    claimRefs:
      - CM017
      - CM018
      - CM019

  - calloutType: risk
    title: Palantir's Entrenched Army Contract Creates Competitive Ceiling
    body: >
      Palantir's 10-year, $10 billion Army enterprise deal for its ABMS/Foundry/AIP platform represents a significant competitive ceiling in some portions of the Army's analytics and data integration budget. Govini's differentiation must be maintained on acquisition-specificity and supply chain use cases; head-to-head competition with Palantir for general analytics budget would be disadvantageous.
    claimRefs:
      - CM021
      - CM022

  - calloutType: insight
    title: Bottom-Up Sizing Suggests <5% SAM Penetration with Significant Runway
    body: >
      Govini's $100 million ARR represents less than 5% of a conservative $2–5 billion SAM estimate for defense acquisition software. Even at 100% annual growth for three more years, Govini would still represent a minority share of the serviceable market—suggesting substantial runway if market boundaries hold and budget access continues to expand.
    claimRefs:
      - CM010
      - CM011

