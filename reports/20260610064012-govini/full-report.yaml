  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The core investment risk is concentrated federal exposure wrapped around a mission-critical software thesis
        blocks:
          - type: paragraph
            body: >-
              Govini's public risk profile looks less like a consumer-software failure pattern and more like a
              concentrated federal-enterprise pattern. The company appears to sell into important defense institutions
              with large budgets and painful workflows, which is the reason the upside case exists. But the same pattern
              makes the downside more lumpy. Public evidence ties Govini's visible customer proof to Army Contracting
              Command, Washington Headquarters Services, the Office of the Under Secretary for Acquisition and
              Sustainment, the Navy, DLA, and government-wide procurement vehicles. That customer map implies high
              average contract value, yet it also implies a business that can be meaningfully affected by continuing
              resolutions, delayed awards, changing priorities, and the purchasing behavior of a relatively small set of
              sponsor organizations. Comparable-company filings reinforce that this is normal for government-facing
              enterprise software: long sales cycles, termination-for-convenience clauses, competition for large
              contracts, and fluctuating timing of awards are structural rather than incidental. For Govini, the
              underwriting question is therefore whether mission fit and expansion potential are strong enough to
              overcome concentration and timing risk. Public evidence supports the mission fit, but not enough renewal
              and concentration data is disclosed to dismiss the downside.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.2'
        title: Privacy, security, procurement, and contract structure create the most visible non-market risks
        blocks:
          - type: paragraph
            body: >-
              The strongest public regulatory and legal risk is not a disclosed lawsuit; it is the burden of operating
              software in highly regulated, sensitive federal environments. Govini's own privacy policy says the company
              collects and stores business-customer information, uses service providers, may process customer-employee
              information as a service provider, and cannot guarantee the security of every network, system, server, or
              database it or its providers operate. That language is normal, but in Govini's context it matters more
              because the product sits near acquisition, readiness, and industrial-base workflows where a security
              incident or privacy failure could have outsized trust consequences. Comparable filings from Palantir and
              FiscalNote reinforce the category risk pattern: privacy, cybersecurity, evolving AI regulation, complex
              government-contract rules, termination-for-convenience clauses, and budget-driven delays are recurring
              hazards for mission software vendors. Govini's public strengths partially offset this. The company and
              partner pages emphasize security posture, IL5 and FedRAMP trust signals, and service ATOs in 2025. Still,
              public sources do not disclose incident history, uptime, audit outcomes, penetration-test findings, or
              contract termination rates. The risk is therefore best described as mitigated but under-observed.
            claimRefs:
