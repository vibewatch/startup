      - number: '2.2'
        title: Market Sizing and TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >
              Multiple sizing lenses are needed given the absence of a dedicated market report specifically for "defense
              acquisition workflow software." The broadest applicable lens is the global military and defense software
              market, estimated at $1.78 billion in 2025, growing at 6.3% CAGR to approximately $1.89 billion in 2026.
              This is a conservative floor that excludes the broad commercial IT and enterprise software spending by
              DoD, which is substantially larger. A broader commercial enterprise software market lens applied to the
              U.S. DoD IT budget yields a higher estimate: with the DoD's C4I systems budget at $23.2 billion and
              defense-focused enterprise software a sub-component, the applicable commercial software segment accessible
              to Govini is in the range of $3–8 billion annually, depending on how broadly defense enterprise software
              is defined.

              For Govini's specific SAM—acquisitions professionals, logistics officers, supply chain managers, and
              sustainment personnel in U.S. military branches and federal defense agencies who could adopt a defense
              acquisition SaaS platform—a bottoms-up estimate based on DoD acquisition workforce size (estimated
              170,000+ acquisition professionals) and Govini's observed pricing of ~$150,000 per seat annually yields a
              theoretical SAM of ~$25 billion at full penetration, though realistic pricing tiers and competition
              significantly reduce the achievable segment. A more conservative SAM estimate of $2–5 billion reflects
              commercial software spend available through IDIQs, BPAs, and direct agency procurement within the DoD's
              annual software and IT budget.

              Govini's current SOM is anchored by its $100 million ARR and $919 million SCRIPTS BPA ceiling—the SOM at
              current run rate is approximately $100M–$130M annually, representing less than 5% penetration of even a
              conservative $3 billion SAM. The TAM/SAM/SOM gap is substantial, but Govini's growth rate (100%+ CAGR)
              relative to a slowly-growing market creates a credible path to 3–5% SAM penetration over a five-year
              horizon. The key sizing uncertainty is whether Govini's market is constrained by the defense acquisition
              software sub-segment only or can expand into broader defense IT and commercial government analytics.
            claimRefs:
