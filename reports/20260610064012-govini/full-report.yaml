            body: >-
              The best-supported financial verdict is positive on growth quality but incomplete on operating quality.
              Govini has several attributes investors want to see in a defense software asset: triple-digit growth, a
              subscription-oriented product, large contract vehicles that shorten future procurement cycles, and enough
              capital to accelerate product and hiring. The chapter's caution is that almost every classic underwriting
              metric below ARR remains private. Public evidence does not reveal whether growth is concentrated in a
