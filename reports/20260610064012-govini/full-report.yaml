              - CM021
              - CM022
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Policy-Driven Demand: EO and SWP Create Structural Tailwind'
            body: >
              The April 2025 White House executive order mandating commercial software for defense acquisition and the
              March 2025 DoD mandatory Software Acquisition Pathway directive create a structural, top-down demand
              tailwind that converts Govini's value proposition from optional to required. This is a rare policy
              environment that directly benefits Govini's category.
            calloutType: strength
            claimRefs:
              - CM017
              - CM018
              - CM019
          - type: callout
            title: Palantir's Entrenched Army Contract Creates Competitive Ceiling
            body: >
              Palantir's 10-year, $10 billion Army enterprise deal for its ABMS/Foundry/AIP platform represents a
              significant competitive ceiling in some portions of the Army's analytics and data integration budget.
              Govini's differentiation must be maintained on acquisition-specificity and supply chain use cases;
              head-to-head competition with Palantir for general analytics budget would be disadvantageous.
            calloutType: risk
            claimRefs:
              - CM021
              - CM022
          - type: callout
            title: Bottom-Up Sizing Suggests <5% SAM Penetration with Significant Runway
            body: >
              Govini's $100 million ARR represents less than 5% of a conservative $2–5 billion SAM estimate for defense
              acquisition software. Even at 100% annual growth for three more years, Govini would still represent a
              minority share of the serviceable market—suggesting substantial runway if market boundaries hold and
              budget access continues to expand.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: >-
          The landscape is multi-layered: mission software, gov-contractor workflow, policy intelligence, integrators,
          and status quo
        blocks:
          - type: paragraph
            body: >-
              Govini is not entering a clean one-vs-one market. The practical buyer can solve related jobs through
              several different classes of alternatives: Palantir for broad mission-software and analytics platforms,
              Deltek for government-contractor market intelligence plus ERP and compliance workflows, Bloomberg
              Government and FiscalNote for policy or legislative intelligence, systems integrators such as Leidos,
              CACI, and SAIC for services-led transformation, and the enduring status quo of spreadsheets, data calls,
              and custom builds. That matters because Govini wins only part of the stack unless it can become the
              default system of record for defense acquisition decisions. The retained evidence points to Govini’s
              strongest relevance where acquisition, industrial-base, and readiness workflows intersect. It is weaker
              where the buyer mostly needs policy awareness, broad public-affairs tooling, or a labor-heavy
              digital-modernization program. The chapter’s core underwriting question is therefore not whether
              competitors exist, but which competitor class most directly constrains Govini’s expansion into additional
              budgets and users.
            claimRefs:
