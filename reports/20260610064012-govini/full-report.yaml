      - CV012
      - CV013
      - CV014
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: The current public mark sits inside the base case, with upside only if private quality metrics are strong.
    data:
      items:
        - label: Bear fair value
          low: 0.7
          mid: 0.9
          high: 1
          displayValue: $0.7B-$1.0B
          detail: Concentration, renewals, or margins disappoint.
          tone: risk
        - label: Base fair value
          low: 1.1
          mid: 1.3
          high: 1.6
          displayValue: $1.1B-$1.6B
          detail: ARR milestone is real and growth remains strong, but public opacity is only partly resolved.
          tone: neutral
        - label: Bull fair value
          low: 1.8
          mid: 2
          high: 2.2
          displayValue: $1.8B-$2.2B
          detail: Private data confirms strong renewals, margins, and cross-sell quality.
          tone: positive
        - label: Current public reference mark
          low: 1.3
          mid: 1.3
          high: 1.3
          displayValue: ~$1.3B
          detail: Secondary-market estimate cited by Sacra.
          tone: neutral
