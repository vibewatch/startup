  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >
              Govini's market is best defined as defense acquisition software: commercial AI-enabled software platforms
              sold to U.S. Department of Defense (DoD) agencies and components to automate, analyze, and accelerate the
              defense acquisition lifecycle—spanning supply chain risk management, science and technology scouting,
              production analytics, sustainment, logistics, and modernization planning. The status-quo substitutes are
              manual spreadsheet workflows, custom-built government systems, and broad-purpose data platforms like
              Palantir Foundry. Adjacent markets include traditional systems integration services (e.g., Booz Allen
              Hamilton, SAIC), enterprise resource planning systems (ERP), and commercial supply chain management
              software not purpose-built for defense.

              The excluded spend includes hardware procurement, weapons system acquisition R&D costs, and broader DoD IT
              infrastructure managed by DISA and cloud service providers. Also excluded are pure analytics consulting
              services and commercial SCM software without defense-specific data integration. Govini's included spend is
              the category of per-seat SaaS software licenses for defense acquisition workflow automation, with
              particular emphasis on supply chain intelligence, acquisition decision support, and acquisition lifecycle
              management.

              The broader DoD budget context is significant: the FY2026 DoD budget request totaled approximately $961
              billion, including $113 billion from the 2025 reconciliation act. Command, Control, Communications,
              Computers, and Intelligence (C4I) systems spending was requested at $23.2 billion for FY2026, up from
              $10.2 billion in 2020—a 127% increase in six years, reflecting the policy shift toward software-enabled
              defense capabilities. Within this envelope, PPBE reform, the mandatory DoD Software Acquisition Pathway,
              and Enterprise Software Agreements are channeling more discretionary IT spending toward commercial
              software vendors like Govini.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
