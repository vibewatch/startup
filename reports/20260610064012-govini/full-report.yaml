              after security and cleared-personnel costs, or how quickly the company converts bookings into cash.
              External budget sources add another layer of caution by showing that continuing resolutions and slow
              acquisition processes routinely delay awards and raise costs across the defense system. Put simply, Govini
              looks much more like a real scaled software platform than an early

