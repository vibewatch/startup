      - number: '1.4'
        title: Milestones, Scale, and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Govini's development from a 2011 startup to a defense software unicorn in 2025 follows a progression
              through product development, initial government adoption, platform expansion, and enterprise-scale
              deployment. The company's milestone history includes the original founding by Eric Gillespie in 2011,
              early-stage funding in 2013, a Series C in 2015, and a long incubation period before achieving enterprise
              adoption at scale beginning in 2022–2023. The most consequential recent milestones include the granting of
              Authorities to Operate (ATOs) by the U.S. Army, Navy, and Space Force in 2025; a five-year IDIQ contract
              from the U.S. Army Contracting Command; a DoW-wide bridge contract from Washington Headquarters Services;
              and a $919 million supply chain risk illumination contract.

              The company's headcount has grown to approximately 305–327 employees as of 2026, reflecting the team
              expansion enabled by the Bain Capital investment and the scaling demands of enterprise government
              deployments. Office locations include Arlington, Virginia (headquarters) and Pittsburgh, Pennsylvania. The
              Pittsburgh office is located in Federated Tower near Union Station, in a technology hub adjacent to
              several major universities.

              No material lawsuits, regulatory enforcement actions, data breaches, or public controversies directly
              naming Govini have been identified in public records. The broader defense software sector faced adverse
              publicity in 2025 when a U.S. Army CTO memo labeled the competing Anduril-Palantir NGC2 platform as
              presenting "very high risk" due to security vulnerabilities, a situation that contrasts with Govini's
              track record of earning ATOs from multiple military branches. Govini has not been subject to comparable
              security criticism and has positioned its discipline-over-demos approach as a differentiated security
              posture.
