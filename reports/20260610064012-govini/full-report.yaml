      - number: '8.2'
        title: Public comps argue for a wide band, with Govini sitting between premium defense software and fragile govtech
        blocks:
          - type: paragraph
            body: >-
              The comparable set is more useful as a band than as a precise formula. Palantir is the upper-quality
              analogue: a mission software company with federal credibility, strong commercial growth, and public-market
              enthusiasm. Its June 2026 valuation ratios are dramatically above what Govini's current private mark
              implies, which shows that defense software can support extraordinary multiples when scale, profitability,
              and durability are visible. FiscalNote is the opposite warning case. Its 2025 filing and June 2026
              market-cap data show how violently government-adjacent software can derate when execution, balance-sheet,
              and demand quality weaken. C3.ai and BigBear.ai illustrate a volatile middle zone where AI narrative and
              public-market appetite can move valuation sharply without making the underlying business low-risk. Tyler
              Technologies is the steadier govtech reference: much more mature, less defense-specific, and valued as a
              proven public software company rather than a narrative-heavy AI asset. Against that set, Govini's implied
              13x ARR looks aggressive versus opaque or struggling names, but conservative versus the market's
              willingness to reward truly durable category leaders.
            claimRefs:
