  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Connects Govini's scale, proof, risk, and valuation context to the final recommendation.
    data:
      nodes:
        - id: n1
          label: $100M+ ARR and triple-digit CAGR signal
          description: Public sources support real software scale.
        - id: n2
          label: Mission-critical customer proof
          description: Army, Navy, DLA, WHS, and SCRIPTS create real market credibility.
        - id: n3
          label: Public denominator gaps
          description: Margins, renewals, and concentration remain opaque.
        - id: n4
          label: Current public mark near $1.3B
          description: Implies a double-digit ARR multiple that is plausible but not obviously cheap.
        - id: n5
          label: Comparable band is wide
          description: Public software comps support both upside and sharp downside.
        - id: n6
          label: Conditional proceed
          description: The company merits work, but entry discipline is essential.
