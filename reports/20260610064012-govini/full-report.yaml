  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Shows how Govini's implied equity value moves if investors apply different ARR multiples to the reported $100M ARR
      milestone.
    data:
      items:
        - label: 8x ARR
          value: 0.8
          detail: Bear-style multiple for a concentrated or only partly proven software asset.
          tone: risk
        - label: 10x ARR
          value: 1
          detail: Lower-premium software valuation support.
          tone: risk
        - label: 13x ARR
          value: 1.3
          detail: Roughly the current public secondary reference mark.
          tone: neutral
        - label: 16x ARR
          value: 1.6
          detail: Base-to-bull range if durability checks out well.
          tone: positive
        - label: 20x ARR
          value: 2
          detail: Premium case if Govini looks much closer to elite defense software than opaque private govtech.
          tone: positive
