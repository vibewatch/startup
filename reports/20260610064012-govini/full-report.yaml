      - number: '8.3'
        title: Recommendation should be conditional proceed, not full-speed conviction
        blocks:
          - type: paragraph
            body: >-
              The right investment recommendation from public evidence is conditional proceed with disciplined entry.
              The thesis is real: Govini appears to have built a differentiated defense-acquisition software asset with
              meaningful scale, strong customer proof, and sponsor pathways that can support further expansion. The
              anti-thesis is equally real: public evidence still does not reveal the durability math needed to justify a
              Palantir-style premium. If private diligence shows healthy renewal quality, acceptable top-account
              concentration, and software-like margins, then the current mark could look reasonable to slightly
              attractive. If those metrics disappoint, the same mark quickly looks full because concentration and
              procurement timing risk would dominate the story. That asymmetry matters. Investors should not pay today
              as if the durability questions are already resolved. They should pay only if the pricing leaves room for
              the still-unproven denominator.
            claimRefs:
