  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The public mark is plausible on revenue scale, but not yet derisked by durability data
        blocks:
          - type: paragraph
            body: >-
              The core valuation fact pattern is straightforward. Bain, CNBC, and GovConWire all support that Govini
              crossed $100 million in ARR in October 2025, while Bain's growth investment and broader press coverage
              confirm that the company joined the defense-unicorn cohort. Sacra provides the most usable public pricing
              anchor, estimating an implied valuation of roughly $1.3 billion. On the reported ARR denominator, that
              implies about a 13x ARR multiple. That is not cheap in an absolute sense, but it is not irrational either.
              A company growing quickly inside a mission-critical defense niche can plausibly command a double-digit
              revenue multiple if customer durability and expansion quality are real. The problem is that public data is
              still sparse where valuation most needs support. There is no retained public disclosure of gross margin,
              free-cash-flow profile, NRR, GRR, churn, or top-account exposure. As a result, the mark is easier to
              defend as a strategic software-asset valuation than as a rigorously underwritten subscription-economics
              valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
