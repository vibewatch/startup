      - number: '5.2'
        title: The product stack appears data-centric, workflow-centric, and delivered through a secure web portal
        blocks:
          - type: paragraph
            body: >-
              The public architecture story has three layers. First is the data foundation: Govini repeatedly says Ark
              is powered by integrated government and commercial data, while Govini-authored technical material and
              Naval Postgraduate School research add that the National Security Knowledge Graph is driven by a
              patent-pending Object Fusion data engine that continuously ingests, normalizes, and fuses new sources.
              Second is the application layer: each Ark module exposes guided workflows and application-specific views
              rather than raw tables alone. Third is the delivery layer: public access is mediated through the Ark.ai
              portal and security or accreditation claims, not through open APIs or downloadable client software. This
              package is coherent. It suggests Govini is building a secure, browser-oriented enterprise product with
              proprietary data fusion at the core and application-specific workflow logic on top. What remains hidden is
              almost everything a technical diligence session would ask next: cloud

              topology, data refresh cadence, model governance, integration methods, public API availability, and
              reliability instrumentation. Those gaps do not negate the product thesis, but they do limit an outside
              reader's ability to judge how differentiated the underlying platform is versus the workflow experience
              wrapped around it.
