          detail: Plausible, but not cheap enough to ignore denominator risk.
          tone: neutral
        - label: Growth signal
          value: '>100% 3yr CAGR'
          detail: Strong public growth narrative.
          tone: positive
        - label: Customer proof quality
          value: Strong
          detail: Real Army, Navy, DLA, and sponsor-path evidence.
          tone: positive
        - label: Risk load
          value: Elevated
          detail: Concentration, renewal opacity, and procurement timing remain material.
          tone: risk
        - label: Evidence quality
          value: Medium
          detail: Enough for serious work, not enough for blind conviction.
          tone: neutral
