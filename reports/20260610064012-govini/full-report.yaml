      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Govini is led by CEO Tara Murphy Dougherty, who previously worked at Palantir and brings both commercial
              software and national security expertise to the role. Dougherty is publicly active on acquisition reform
              issues and serves on the NDIA Board of Directors, providing direct access to policy discussions shaping
              defense procurement. Founder Eric Gillespie serves as Executive Chairman, maintaining strategic influence
              over the company's long-term direction and technology vision. The two roles reflect a standard founder-CEO
              transition structure where the founder retains significant board authority.

              The senior leadership team as of early 2026 includes Carter Sednaoui (CFO), Marco Corona (CTO), Tom Goter
              (Chief Data Officer), Amir Hegazy (Chief Strategy Officer), Eric Schatz (COO), Wookie Nam (Chief Creative
              Officer), JulieAnne Evanina (CMO, appointed January 2026), Crystal Benton Burnett (SVP Communications,
              appointed January 2026), Ted Reynolds (SVP Sales), Olivia Clepper (SVP Mission Implementation), and Louis
              Bergeron (EVP). The recent addition of CMO and SVP Communications roles in January 2026 reflects the
              company's preparation for an expanded commercial growth phase following the Bain Capital investment.

              Key-person risk is material: Tara Murphy Dougherty is the public face of acquisition reform advocacy, and
              her relationships with senior DoD officials are a competitive asset that could be disrupted by departure.
              Eric Gillespie's founder status creates additional key-person exposure at the board level. No material
              executive departures have been publicly reported, but the company's strong growth trajectory has
              historically correlated with executive recruitment from defense agencies and technology companies.
