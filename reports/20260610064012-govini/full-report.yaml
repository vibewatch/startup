    data:
      nodes:
        - id: d1
          label: Federal appropriations process
          description: Budget timing and continuing resolutions shape procurement cadence.
        - id: d2
          label: Sponsor offices and vehicles
          description: Army ACC, WHS, OUSD A&S, and SCRIPTS create access to buyers.
        - id: d3
          label: Security accreditations
          description: ATOs and compliance posture enable sensitive use cases.
        - id: d4
          label: Reseller and partner channel
          description: Carahsoft and partners widen distribution.
        - id: d5
          label: Third-party infrastructure / data
          description: Publicly undisclosed upstream systems and sources support the product.
        - id: d6
          label: Leadership and specialist workforce
          description: Govini needs defense experts plus strong software, data, and product teams.
        - id: d7
          label: Customer deployments
          description: Operational proof and renewals depend on all prior nodes working.
      edges:
        - from: d1
          to: d2
