      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Defense acquisition software has a multi-layered buyer structure. The payer is the U.S. government through
              its appropriations process; the buyer is typically a Program Executive Office (PEO), a Contracting Officer
              at an Army Contracting Command, or an enterprise-level decision-maker at OUSD A&S. The user is the
              acquisition professional, logistics officer, supply chain specialist, or program manager who directly
              operates the Ark platform. This separation of payer, buyer, and user creates a sales complexity that
              Govini addresses through enterprise-level contracting vehicles (IDIQ, BPA) that reduce per-transaction
              procurement burden.

              Key buyer segments include: (1) U.S. Army acquisition and logistics organizations, which are Govini's most
              documented customer segment following the Army IDIQ and DoW bridge contract; (2) U.S. Navy sustainment and
              modernization programs, where Ark has demonstrated ROI through submarine maintenance obsolescence
              resolution; (3) U.S. Space Force acquisition officers managing satellite and space system supply chains;
              (4) OUSD A&S-level enterprise buyers who sponsor cross-DoW contracts; and (5) the U.S. Intelligence
              Community (IC), referenced by Govini as an expanding deployment area but with less public detail.

              The adoption trigger is typically a mission-critical supply chain failure, a mandated audit or compliance
              requirement, or a leadership-driven modernization initiative. Budget ownership resides primarily with
              Operations and Maintenance (O&M) appropriations for sustainment software, with Research, Development,
              Test, and Evaluation (RDT&E) funds used for new capability development. The FY2026 NDAA's software funding
              flexibility provision—allowing Procurement, RDT&E, and O&M funds to be used interchangeably—reduces
              procurement friction and should increase Govini's addressable budget.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
