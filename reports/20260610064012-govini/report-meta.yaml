companyProfile:
  summary: >-
    Govini is an Arlington, Virginia-based defense software company founded in 2011 by Eric Gillespie
    that sells the Ark platform into the U.S. Department of Defense and adjacent federal buyers.
    The company appears to have reached real breakout scale, surpassing $100M ARR in October 2025 and
    adding Bain Capital as a major backer, but private-company disclosure remains limited on the quality
    and durability of that growth.
  foundedDate: "2011-01-01"
  founders:
    - name: Eric Gillespie
      role: Founder, Executive Chairman
      background: Founded Govini in 2011 and continues to shape strategy as Executive Chairman.
      claimRefs: [CO002, CO011]
  foundingLocation: Arlington, VA, USA
  headquarters: Arlington, VA, USA
  productSummary: >-
    Govini's flagship Ark platform packages AI-enabled applications for defense acquisition, supply chain,
    logistics, sustainment, production, and modernization workflows, with deployment pathways supported by
    IL5 ATOs and major DoD procurement vehicles.
  customerFocus: >-
    Primary customers are U.S. defense agencies and related federal national-security organizations that need
    acquisition, readiness, and supply-chain decision software in secure environments.
  businessModel: >-
    Private B2G SaaS sold through multi-year software licenses, often on a per-seat basis, with land-and-expand
    potential across additional Ark modules and defense programs.
  stage: growth
  fundingStatus: >-
    Govini has raised about $174.5M in total, including a $150M Bain Capital growth round announced in October
    2025 after the company crossed the $100M ARR milestone.
  disclosureProfile: private-undisclosed
