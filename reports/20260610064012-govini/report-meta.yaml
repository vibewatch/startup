  topStrengths:
    - Strong ARR growth (>100% 3yr CAGR) and $100M+ milestone achieved.
    - Deep DoD embedding with IL5 ATOs and SCRIPTS BPA access.
    - Bain Capital validation at an implied ~$1.3B valuation.
  topRisks:
    - 100% revenue concentration in DoD and federal-government budgets.
    - Contract renewal timing and budget-cycle dependency can distort growth visibility.
    - CEO/founder key-person risk remains meaningful around Tara Murphy Dougherty and Eric Gillespie.
  unresolvedGaps:
    - Unit economics and SaaS efficiency metrics are not publicly disclosed.
    - Customer retention, churn, and account concentration data remain unavailable.
    - Public evidence does not resolve margin structure or the conversion rate from contract access to active usage.
finalJudgment:
  recommendation: invest
  confidence: medium
  rationale: Govini's $100M+ ARR milestone, 100%+ multi-year growth, Bain Capital backing, and unusually deep DoD embedding support an invest recommendation, but limited financial transparency and concentration risk keep confidence at medium.
  keyStrengths:
    - Strong ARR growth (>100% 3yr CAGR) and $100M+ milestone achieved
    - Deep DoD embedding with IL5 ATOs and SCRIPTS BPA access
    - Bain Capital validation at ~$1.3B valuation
  keyRisks:
    - 100% revenue concentration in DoD/federal government
    - Contract renewal and budget cycle dependency
    - CEO/founder key-person risk (Tara Murphy Dougherty, Eric Gillespie)
  mainGaps:
    - Unit economics and SaaS efficiency metrics not disclosed
    - Customer retention and churn data unavailable
  valuationStance: ~$1.3B at roughly 13x ARR looks reasonable for a defense SaaS asset with an IL5 moat and real procurement access, but it is not obviously cheap without better durability data.
