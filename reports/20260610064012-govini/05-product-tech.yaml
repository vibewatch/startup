chapter:
  number: 5
  title: Product & Technology
  summary: 'Govini''s product record is strong on workflow specificity and deployment readiness. Official product pages, partner listings, and Govini-authored technical material support Ark as a six-application acquisition-software suite built on integrated government and commercial data, with a National Security Knowledge Graph and continuous data-fusion engine underneath. Public trust signals are also meaningful: partner materials cite FedRAMP High and DISA IL5 PA, while late-2025 releases say the Army, Navy, and Space Force each granted Ark an ATO. The main diligence gap is observability: public sources validate workflows and security claims better than they validate uptime, model governance, API design, or exact integration burden.'
sections:
- id: product-definition-and-module-map
  title: Ark is a six-application defense-acquisition operating system, not a single-point tool
  body: |-
    Govini's product definition is unusually specific by defense-software standards. The company does not market a generic data lake or catch-all analytics layer; it markets Ark as a suite of six AI-enabled applications mapped to concrete acquisition jobs: Supply Chain, Science & Technology, Production, Sustainment, Logistics, and Modernization. The official product pages are explicit that these applications are tied to day-to-day work such as foreign ownership screening, vendor due diligence, bill-of-materials management, supportability analysis, requisition intelligence, resupply planning, and modernization demand planning. That job-to-be-done framing matters because it explains why Govini can expand horizontally inside an agency without losing mission specificity. Each module shares the same acquisition-centered vocabulary and integrated data spine, but the workflow surfaces differ by user type and mission. Public evidence therefore supports a real application family with meaningful
    module breadth rather than a single dashboard re-skinned for multiple buyers. The tradeoff is that public materials remain marketing-forward: they show screenshots, named workflows, and outcome anecdotes, but not the deeper technical specifications that would let outsiders verify data lineage, latency, or model-quality claims.
