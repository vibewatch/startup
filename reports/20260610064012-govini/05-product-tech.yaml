- id: trust-security-and-differentiation
  title: 'Trust surfaces are strong publicly: ATOs, FedRAMP/IL5 claims, and regulated-environment engineering signals'
  body: |-
    Govini's clearest product moat in public evidence is not a patent count or an open benchmark; it is trust and fit inside a highly regulated defense workflow. Multiple company and partner pages assert FedRAMP High and DISA IL5 PA credentials, while late-2025 press releases say the Army, Navy, and Space Force each granted Ark an Authority to Operate in 2025. Careers materials and job descriptions also matter here. They show Govini hiring software engineers who work in federal-accredited environments, with backend API, SQL, Linux, and React or JavaScript expectations, plus a technical assessment in the hiring loop. That is useful developer signal because it suggests a real software engineering organization supporting the product rather than a thin layer of services or slideware. Differentiation also comes from defense-specific workflows: FOCI analysis, supply assurance, requisition intelligence, combat-power planning, and nuclear-enterprise modernization are not generic BI jobs. The main
    limitation is evidentiary depth. Public sources validate certifications, security posture claims, and workflow breadth better than they validate uptime, false-positive rates, or model-governance quality. Investors can believe the product is mission-trusted; they still need private technical review to judge how robustly it is engineered.
  claimRefs:
