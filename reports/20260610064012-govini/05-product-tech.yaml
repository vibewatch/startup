- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Integrated government and commercial data
    - Feeds the application family with acquisition, supplier, investment, and program signals.
    - Access to proprietary and government data rights plus continuous ingestion.
    - Coverage or rights gaps could weaken workflow quality.
  - - National Security Knowledge Graph
    - Acts as the fused data model underneath Ark use cases.
    - Govini’s proprietary schema, mapping logic, and data governance.
    - Public documentation is too limited to verify ontology depth or data lineage.
  - - Object Fusion data engine
    - Continuously ingests, normalizes, and integrates new data into existing catalogs.
    - Internal pipelines and data-engineering operations.
    - No public metrics on throughput, latency, or failure handling.
  - - Application workflows
    - Translate raw data into role-specific tasks such as due diligence, planning, and risk mitigation.
    - Product design, domain expertise, and model or rules logic.
    - Workflow quality may be hard to replicate, but customization burden is unknown.
  - - Secure web delivery via Ark portal
    - Provides authenticated browser-based access to customers.
    - Identity, access control, and cloud or hosting architecture.
    - Public API surface and offline-mode behavior are not documented.
  - - Engineering and support organization
    - Builds, integrates, and maintains scalable data architecture in accredited environments.
    - Hiring pipeline for cleared, technically capable staff.
    - Talent bottlenecks or clearance friction could slow roadmap delivery.
  notes: The table intentionally separates what public materials state from the architectural details they omit. It is a topology sketch, not a vendor-certified design document.
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE024
  - CE025
  - CE031
