- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - FedRAMP High
    - Publicly claimed
    - SoftwareOne marketplace listing and Govini materials present it as a security credential for Ark.
    - No public package, boundary diagram, or control inheritance details are retained.
  - - DISA IL5 PA
    - Publicly claimed
    - SoftwareOne listing and product-page seals indicate IL5 positioning for sensitive data handling.
    - No public SSP, assessment report, or exact boundary definition is available.
  - - Army, Navy, and Space Force ATOs in 2025
    - Publicly claimed
    - Two late-2025 PR releases say each service granted Ark an ATO.
    - No service-authored corroborating ATO documentation is retained publicly.
  - - Federal-accredited development environment
    - Publicly signaled
    - Job description requests experience in federal accredited software environments and clearances.
    - Public sources do not reveal SDLC controls, vulnerability management cadence, or incident metrics.
  - - Technical assessment in hiring loop
    - Publicly stated
    - Careers page says technical candidates complete a take-home assessment.
    - This shows software seriousness, not production quality or code-review standards.
  - - Public reliability and model-quality metrics
    - Not publicly disclosed
    - No retained source provides uptime, SLA, latency, precision/recall, or model-governance KPIs.
    - Private diligence is required for observability and model-risk review.
  notes: Public trust surfaces are materially better than public observability metrics. The absence of uptime or model-quality data is itself part of the diligence record.
