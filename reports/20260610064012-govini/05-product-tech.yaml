tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Supply Chain
    - Acquisition and industrial-base analysts
    - High public maturity with named workflows and quantified outcomes
    - FOCI, vendor due diligence, and supplier mapping are defense-specific and deeply tied to acquisition risk.
    - Need customer references on false positives, data freshness, and exportability of reports.
  - - Science & Technology
    - R&D and technology-scouting teams
    - High public maturity with named workflows and quantified time savings
    - Combines adversarial capital, VC/PE/M&A, and due diligence in one defense-specific workflow.
    - Need evidence on data coverage breadth, ontology quality, and update cadence.
  - - Production
    - Program owners and manufacturing-risk teams
    - High public maturity with detailed workflow screenshots and case metrics
    - BOM-centric production risk monitoring is more operational than generic market-intelligence tools.
    - Need proof of ERP/MES integrations and user adoption depth.
  - - Sustainment
    - Program-health and readiness managers
    - High public maturity with DMSMS and requisition workflows plus outcome metrics
    - Part Replicator, Supply Assurance, and Requisition Intelligence map directly to fleet readiness needs.
    - Need accuracy metrics for alternate-part suggestions and readiness impact.
  - - Logistics
    - Operational logistics officers and commanders
    - High public maturity with contested-environment workflow evidence
    - Resupply, combat-power, and common-operating-picture workflows tie directly to battlefield execution.
    - Need integration architecture for operational systems and disconnected environments.
  - - Modernization
    - Industrial-base and force-modernization planners
    - Moderate-to-high public maturity with clear workflows but fewer quantified proofs
    - Demand planning, market research, and capacity simulation extend the same data spine into future-force planning.
    - Need customer-level evidence on forecast accuracy and program outcomes.
  notes: Rows are scored from public product pages and retained proof points, not from private usage telemetry or roadmap briefings.
