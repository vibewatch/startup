- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Supplier and FOCI analysis
    - Manual spreadsheets and fragmented vendor data slow risk review.
    - Supply Chain workflows such as FOCI Navigator and Vendor Due Diligence centralize supplier mapping and reporting.
    - One published case cut reporting time by 83% and increased output by 500%.
    - Public evidence does not disclose ongoing accuracy or analyst override rates.
  - - Emerging-technology due diligence
    - Deep dives on markets and experts are time-consuming.
    - Science & Technology workflows generate AI-driven reports and expert or market views.
    - Public case says analysis time fell 94% and saved 160 hours per report.
    - No public disclosure on hallucination controls or analyst review workflow.
  - - Production bottleneck identification
    - Program offices struggle to see risky parts and vendors before delays occur.
    - Production workflows surface BOM, supplier, and supportability risks.
    - One published case evaluated 80,000 parts and 6,000 suppliers to isolate 32 high-risk items.
    - No public integration detail with source BOM systems.
  - - DMSMS and requisition readiness
    - Teams often react late to obsolescence and low-stock issues.
    - Sustainment workflows identify alternative parts and vendors and flag requisition risk.
    - Public case says similar-part identification time fell 98% across 7 million DLA-managed parts.
    - Need private validation on recommendation precision and procurement follow-through.
  - - Contested logistics planning
    - Manual resupply planning is slow and siloed.
    - Logistics workflows combine COP, resupply planning, and combat-power views.
    - Public case says planning fell from 36 hours to 1 hour and risk resolution became 16x faster.
    - No public data on performance in classified or disconnected conditions.
  - - Modernization capacity planning
    - Future-platform demand and workforce constraints are hard to model.
    - Modernization workflows forecast needs and assess supplier and workforce readiness.
    - Public case claims improved schedule feasibility and faster alternate-supplier identification.
    - No public benchmark on forecast accuracy or scenario sensitivity.
  notes: Benefits are taken from Govini’s published outcomes and should be treated as customer-story evidence, not as independently audited benchmarks.
