- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Customer concentration
    - Top-account ARR share
    - Top five customers or sponsor pathways exceed a concentration level that cannot be offset by renewal strength
    - Recut downside case and require stronger entry discount or pass.
  - - Renewal durability
    - GRR / NRR / logo retention by agency cohort
    - Renewal data is materially weaker than public mission proof implies
    - Treat public deployment evidence as overstating stickiness.
  - - Vehicle conversion risk
    - Bookings and usage sourced from SCRIPTS, Army, and WHS pathways
    - Procurement access grows without corresponding deployed-seat or ARR growth
    - Lower expansion assumptions and base-case valuation.
  - - Security and compliance
    - Incident history, audit outcomes, and ATO maintenance
    - Material unresolved findings or weak controls surface in diligence
    - Pause investment until remediation is verified.
  - - Execution capacity
    - Hiring velocity, attrition, and implementation bandwidth
    - Critical roles stay open or delivery teams are overstretched
    - Lower growth assumptions and extend time-to-scale.
  notes: Kill criteria focus on whether the strongest public positives translate into durable private operating evidence.
