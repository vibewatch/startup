- id: mitigation-monitoring-and-kill-criteria
  title: The mitigants are real, but the thesis should break quickly if concentration or reliability evidence disappoints
  body: |-
    Govini does have meaningful mitigants. The company has named customer proof, quantified workflow outcomes, late-2025 contract momentum, sponsor offices that appear willing to expand deployments, and security credentials serious enough to support sensitive missions. Those facts make the risk chapter more about disciplined monitoring than about immediate disqualification. Still, the public evidence supports a strict kill-criteria framework. If top-account concentration proves extreme, if renewals depend on one or two sponsor offices, if SCRIPTS and other vehicles do not convert into recurring usage, if security and ATO maintenance are weaker than claimed, or if the company cannot recruit and retain enough product, engineering, data, and go-to-market talent, then the downside transmission into growth and valuation is fast. The right diligence stance is therefore conditional. Govini is investable only if private materials show that the strongest public signals—mission criticality, customer expansion, and security readiness—translate into durable renewals, acceptable concentration, and execution capacity.
  claimRefs:
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
  - CR042
