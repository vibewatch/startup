tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale / funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Govini
    - Direct category specialist
    - Private; $100M+ ARR and $150M Bain round disclosed in Oct. 2025
    - DoD acquisition, industrial-base, supply-chain, logistics, sustainment buyers
    - Six-app Ark stack built specifically for defense acquisition and readiness workflows
    - Private disclosures remain limited; pricing, renewal, and seat-depth data are not public
  - - Palantir
    - Dominant incumbent
    - Public company; Yahoo coverage says market value passed $400B in Oct. 2025
    - Defense, intelligence, and enterprise data-AI buyers
    - Broad horizontal mission platform family spanning Gotham, Foundry, and AIP
    - Breadth can be less workflow-specific than Govini’s acquisition-focused positioning
  - - Deltek
    - GovCon workflow incumbent
    - Private installed-base software incumbent; public pages stress top-10 A&D contractor penetration
    - Government contractors and A&D finance / capture / compliance teams
    - GovWin IQ, Costpoint, proposal pricing, ERP, manufacturing, and contract-management breadth
    - More contractor workflow and compliance oriented than mission-readiness analytics
  - - Bloomberg Government
    - Adjacent policy-intelligence incumbent
    - 'Official scale proxy: 355 congressional offices, 93% of cabinet agencies, 70% of top 100 lobbying spenders'
    - Public affairs, lobbying, associations, corporations, agencies
    - All-in-one public-affairs platform with news, analysis, legislative tracking, and decision-maker tools
    - Not a defense acquisition execution platform
  - - FiscalNote
    - Adjacent policy-intelligence incumbent
    - Public company with investor relations, SEC filings, annual reports, and mission-critical insight positioning
    - Government affairs and policy teams needing legislative / regulatory tracking
    - PolicyNote adds AI summaries, drafting tools, tracking, and API access
    - Adjacency is strongest in policy monitoring, not industrial-base execution
  - - Leidos / CACI / SAIC
    - Services-led substitute set
    - Large defense services incumbents with digital modernization, analytics, AI, and enterprise IT offerings
    - Agencies preferring integrator-led transformation and large service contracts
    - Can package mission IT, analytics, and implementation under existing services relationships
    - More bespoke and labor-heavy than Govini’s product-led SaaS model
  - - Status quo / internal build
    - Status-quo substitute
    - No vendor license required; uses existing labor and fragmented tools
    - Program offices still running spreadsheets, data calls, and custom reporting
    - Familiar process and easier to start without new software procurement
    - Slow, manual, hard to scale, and weak on integrated visibility
  notes: Scale cells rely on retained public proxies; where exact revenue or valuation was not disclosed in retained materials, the table labels the competitor by public-company status, installed-base signal, or public adoption proxy instead of inventing numbers.
