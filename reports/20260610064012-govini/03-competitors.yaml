  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized pricing, discount ladders, minimum seat counts, and module packaging for Govini, Palantir, Deltek, Bloomberg Government, and FiscalNote enterprise deals.
    whyItMatters: Public price opacity limits apples-to-apples comparison of expansion economics and procurement friction.
    diligencePath: Request current price books, representative SOWs, and three recent won-deal pricing examples by buyer segment.
    relatedQuestionRefs:
    - QP015
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: Win-loss data, renewal rates, and evidence on whether accounts use Govini alongside Palantir, Deltek, Bloomberg Government, or FiscalNote.
    whyItMatters: Moat durability depends on whether Govini displaces rivals or only occupies one layer of a broader tool stack.
    diligencePath: Request account-level competitive battlecards, renewal cohorts, and top-20 customer stack maps.
    relatedQuestionRefs:
    - QP022
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: competitor-overlap
    missingEvidence: Program-level contract overlap data showing where Palantir, Deltek, and Govini each sit in the same agency budget lines.
    whyItMatters: Without overlap data, competitive intensity is inferred from positioning rather than measured by shared programs and wallet share.
    diligencePath: Pull USASpending and agency contract records by NAICS/PSC and map them to retained vendor names and program offices.
    relatedQuestionRefs:
    - QP017
    - QP018
    relatedTableRefs:
    - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: feature-matrix-coverage
    missingEvidence: Private deployment-depth evidence for classified data support, implementation timelines, and workflow adoption by competitor.
    whyItMatters: The feature matrix necessarily uses public capabilities and misses hidden integration depth in deployed programs.
    diligencePath: Request product demos, security package summaries, and deployment references for each named competitor.
    relatedQuestionRefs:
    - QP004
    relatedTableRefs:
    - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: landscape-completeness
    missingEvidence: A full census of smaller venture-backed defense analytics challengers and internal-build substitutes by program office.
    whyItMatters: The competitor profile table focuses on the most material visible alternatives, not every niche entrant.
    diligencePath: Expand discovery through procurement databases, venture databases, and customer interviews focused on alternatives considered.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
