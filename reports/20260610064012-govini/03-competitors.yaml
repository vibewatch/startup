- id: TP003
  title: Pricing / packaging comparison
  columns:
  - company
  - price / unit / contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - Govini
    - No public list price; Sacra estimates roughly $15K-$150K per seat; sells through enterprise contracts and contract vehicles
    - Ark applications for acquisition, supply chain, logistics, sustainment, modernization
    - Realized pricing, seat floors, and module packaging are undisclosed
    - Buying friction depends more on approved vehicles and security readiness than on visible list price
  - - Palantir
    - Custom enterprise contract pricing; no public list price retained
    - Platform family across Gotham, Foundry, and AIP
    - Module packaging and realized pricing undisclosed
    - Competes through large strategic contracts rather than transparent SaaS list pricing
  - - Deltek
    - Enterprise subscription pricing not public in retained pages
    - GovWin IQ, Costpoint, ProPricer, manufacturing, and related gov-contractor modules
    - Bundling and segment-specific pricing undisclosed
    - Pricing is likely modular and buyer-specific, favoring incumbent capture rather than public transparency
  - - Bloomberg Government
    - Demo / quote-led subscription motion; no public list price retained
    - News, analysis, legislative tracking, AI bill summaries, decision-maker tools
    - User-tier pricing and package structure not public in retained evidence
    - Competes on workflow value and adoption scale, not visible price points
  - - FiscalNote
    - Get-pricing / demo motion; no public list price retained
    - PolicyNote platform, AI summaries, drafting tools, and API access
    - Platform versus API pricing not public in retained evidence
    - Packaging flexibility may help adjacent budgets even without public transparency
  - - Leidos / CACI / SAIC
    - Services-contract pricing under SOWs or task orders, not list pricing
    - Digital modernization, analytics, AI, enterprise IT, implementation labor
    - Margins and rate cards depend on labor mix and contract terms
    - Substitutes can win when agencies want custom transformation instead of packaged software
  notes: The retained public record is largely quote-led and enterprise-oriented. This table compares visible pricing posture and packaging transparency rather than pretending that non-public enterprise contracts have list prices.
  enumerationScope:
    coverage: partial
    basis: Rows compare the most material alternatives with enough retained public evidence to describe pricing posture, even when exact realized price points remain undisclosed.
