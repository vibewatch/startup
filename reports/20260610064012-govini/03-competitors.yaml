- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - mitigation / diligence ask
  rows:
  - - DoD-native acquisition workflow depth
    - Palantir can bundle broader mission-platform capability around the same programs
    - High
    - Independent coverage still treats Palantir as the entrenched incumbent with scale and contract depth
    - Request program-level win/loss evidence versus Palantir and proof that Govini expands after initial landings
  - - Supply-chain and industrial-base specialization
    - Deltek can absorb adjacent spend through GovWin, ERP, proposal pricing, and contractor operations
    - High
    - Deltek publicly spans pre-award intelligence through ERP and manufacturing support
    - Map which budgets are contractor-workflow spend versus acquisition-readiness software spend
  - - Procurement readiness via ATOs and vehicles
    - Approvals matter less if deployed users and seats do not expand materially after contract award
    - Medium
    - Public sources confirm ATOs and vehicles but not branch-by-branch utilization depth
    - Request seat counts, MAUs, and module adoption by branch and program office
  - - Channel and ecosystem access
    - Channel support may help reach but not guarantee displacement of incumbents already embedded in agency workflows
    - Medium
    - Carahsoft and NDIA improve reach and trust but do not prove competitive dislodgement
    - Review sourced pipeline contribution and win rates from partner-led opportunities
  - - Category-specific workflow fit
    - Buyer behavior may stay multi-homed, limiting winner-take-all economics
    - High
    - Public evidence supports stack combinations across Deltek, policy tools, Govini, and integrators
    - Request top-customer tool-stack maps and renewal evidence by module
  - - Opaque enterprise pricing
    - Without public benchmarks it is hard to prove Govini wins on economic value versus rivals
    - Medium
    - Most named alternatives do not disclose public list pricing in retained materials
    - Obtain current price books, statement-of-work examples, and realized discount ranges
  notes: Severity reflects underwriting judgment from retained evidence, not company-disclosed risk rankings. The register emphasizes the threats most likely to weaken Govini’s apparent moat despite strong workflow specificity.
  enumerationScope:
    coverage: partial
    basis: Rows isolate the main moat claims and countervailing threats visible in retained public evidence for 2025-2026, with emphasis on procurement readiness, substitute stacks, and incumbent response.
