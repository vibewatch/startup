callouts:
  - calloutType: strength
    title: Unicorn-Scale ARR with 100%+ CAGR in Defense SaaS
    body: >
      Govini's achievement of $100M+ ARR with a three-year CAGR exceeding 100% places it among the fastest-growing defense software companies in the U.S. market. Enterprise-wide contracts from the Army, Navy, and Space Force, combined with three Impact Level 5 ATOs, provide durable revenue visibility and reduce customer concentration risk relative to earlier stages.
    claimRefs:
      - CO001
      - CO005
      - CO025
      - CO026

  - calloutType: risk
    title: Customer Concentration and Budget Dependency Risk
    body: >
      Govini's revenue is concentrated in the U.S. Department of War. Any significant shifts in defense acquisition modernization budgets, continuing resolutions, sequestration, or political de-prioritization of software spending could materially impact contract renewals and new award timelines. The company has not disclosed revenue diversification across civilian agencies or international customers.
    claimRefs:
      - CO022
      - CO027

  - calloutType: insight
    title: Key-Person Risk in CEO and Founder Roles
    body: >
      Both the CEO (Tara Murphy Dougherty) and the Founder (Eric Gillespie) represent material key-person risks. Dougherty's Palantir background and NDIA board membership are competitively differentiated assets tied to her personally. The absence of a disclosed independent board composition and limited executive succession transparency heightens this risk at the current stage.
    claimRefs:
      - CO010
      - CO011
      - CO014

