  - id: funding-and-capital-structure
    title: Funding and Capital Structure
    body: >
      Govini has raised approximately $174.5 million in total funding across its lifetime. The most significant round was a $150 million growth investment from Bain Capital announced in October 2025, coinciding with the company's crossing of the $100 million ARR milestone. The investment was led by Scott Kirk, Partner at Bain Capital Tech Opportunities. Prior rounds include a $20 million Series C in May 2015 led by Accel, and a $4.5 million Series B in February 2013. Earlier investors include Salesforce Ventures and Symphony Technology Group (STG). Govini has also utilized Hercules Capital, a technology-focused specialty finance firm, as part of its capital structure.

      While the company has not publicly disclosed a formal valuation, secondary market data and analyst estimates as of early 2026 place Govini's implied valuation at approximately $1.3 billion, conferring unicorn status. The Bain Capital investment enables continued product investment, team expansion, and capability enhancement to meet what the company describes as "surging demand" across the national security community. The capital infusion follows a series of major contract wins and platform authorizations that substantially de-risked the business from a revenue and regulatory standpoint.

      As a private company, Govini does not disclose gross margin, burn rate, or net income publicly. The SaaS model with government multi-year contracts typically generates more stable and recurring cash flows than project-based revenues, but the per-seat pricing model requires ongoing seat expansion to sustain growth at the current 100%-plus CAGR pace. The $919 million government-wide supply chain risk illumination contract provides a long-duration revenue ceiling that supports aggressive growth assumptions, though actual call-off rates remain undisclosed.
