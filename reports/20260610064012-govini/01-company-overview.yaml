company:
  name: Govini

chapter:
  number: 1
  title: Company Overview
  summary: >
    Govini is an Arlington, Virginia-based defense technology company founded in 2011 that builds AI-powered software—principally its Ark platform—to modernize the U.S. Department of War's acquisition, supply chain, logistics, and sustainment processes. The company surpassed $100 million in ARR in October 2025, secured a $150 million growth investment from Bain Capital at a reported ~$1.3 billion valuation, and holds enterprise-wide contracts across the Army, Navy, and Space Force, positioning it as a leading challenger to Palantir in the defense data software market.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      Govini was founded in 2011 by Eric Gillespie with the mission to create an entirely new category of software built to transform how the U.S. government uses AI and data to make decisions for national security. The company is incorporated and headquartered in Arlington, Virginia, with additional offices in Pittsburgh, Pennsylvania, and historically San Francisco, California. Govini operates as a private B2B SaaS company selling primarily to U.S. government defense agencies and defense contractors through multi-year software license agreements priced on a per-seat basis.

      The company's flagship product, Ark, is a suite of AI-enabled applications powered by a proprietary National Security Knowledge Graph that integrates both government and commercial data. Ark addresses the full spectrum of defense acquisition: Supply Chain, Science and Technology, Production, Logistics, Sustainment, and Modernization. Govini's value proposition centers on replacing slow, manual, spreadsheet-driven acquisition workflows with automated, AI-driven processes. The platform is deployed in a FedRAMP High cloud environment and accessed via CAC-secured browser, enabling use by personnel with classified data access requirements.

      As of October 2025, Govini surpassed $100 million in annual recurring revenue, growing at a three-year compound annual growth rate exceeding 100%. A recent benchmark contract awarded a $12.15 million Navy deal for 81 Ark seats, pricing at approximately $150,000 per seat annually—suggesting strong unit economics for a defense SaaS business. The company describes its business model as one where customers start with specific use cases and expand across additional application modules over time, enabling land-and-expand revenue dynamics.
