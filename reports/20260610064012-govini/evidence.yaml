evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Formal company-disclosed post-money valuation from the October 2025 Bain Capital round
    whyItMatters: >-
      Without an official valuation, all pricing and IRR analyses are based on secondary market estimates (~$1.3B) which
      may not reflect actual transaction terms or liquidation preferences.
    diligencePath: >-
      Request capitalization table, Series D term sheet, or post-money valuation certification from Govini management or
      Bain Capital directly.
    relatedQuestionRefs:
      - QO005
      - QO027
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Full capitalization table including founder equity, investor ownership percentages, preferred share classes, and
      any secondary sales
    whyItMatters: Cap table structure determines effective control, exit economics, and alignment between management and investors.
    diligencePath: Request capitalization table from Govini's CFO or corporate counsel during a formal diligence process.
    relatedQuestionRefs:
      - QO027
      - QO012
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Gross margin, burn rate, net income, and customer revenue concentration breakdown for FY2025
    whyItMatters: >-
      Without gross margin data, the quality of the $100M ARR cannot be assessed—a low-margin government services
      business warrants a different valuation multiple than a true SaaS business.
    diligencePath: >-
      Review audited financial statements or management accounts for gross margin, EBITDA, and top-10 customer
      concentration.
    relatedQuestionRefs:
      - QO022
