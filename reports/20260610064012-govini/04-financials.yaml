- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metrics
  - Impact
  - Current public status
  - Exact diligence path
  rows:
  - - Revenue mix by product, branch, and contract vehicle
    - Without mix, investors cannot test concentration or the software-versus-services blend.
    - Not publicly disclosed.
    - Request quarterly revenue bridge by product, agency, and contract vehicle.
  - - Gross margin and support-cost structure
    - Blocks judgment on software operating leverage and margin path.
    - Not publicly disclosed.
    - Provide software-only gross margin, blended gross margin, hosting cost, and cleared-personnel support cost.
  - - Retention, churn, and expansion cohorts
    - Prevents testing whether growth is driven by renewals or new logos alone.
    - Not publicly disclosed.
    - Provide logo retention, gross retention, NRR, and seat/module expansion by cohort.
  - - Cash, burn, and runway
    - Prevents sizing financing dependency under procurement delays.
    - Not publicly disclosed.
    - Provide monthly cash bridge, budgeted burn, and downside runway scenarios.
  - - Sales efficiency and CAC payback
    - Makes it impossible to compare Govini with scaled SaaS underwriting frameworks.
    - Not publicly disclosed.
    - Provide fully-loaded CAC, sales cycle by vehicle, and CAC payback by segment.
  - - Recognized revenue versus contract ceilings
    - Prevents investors from overstating BPA or IDIQ ceilings as booked revenue.
    - Public materials cite vehicles, not realized revenue conversion.
    - Provide task-order history, booked revenue, deferred revenue, and collection timing by vehicle.
  notes: Every row identifies a concrete diligence request because the public record supports a growth narrative more strongly than a full financial model.
