- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR
    - '> $100M in October 2025'
    - high
    - Confirms scale and product-market fit for a private defense software company.
    - Provide monthly ARR bridge and 2024-2026 cohort growth.
  - - Three-year CAGR
    - '>100%'
    - medium
    - Suggests acceleration is real, not one-off, if measured consistently.
    - Provide exact baseline years and whether CAGR is GAAP revenue or ARR-based.
  - - Gross margin
    - null
    - low
    - Core test of whether Govini behaves like scaled software versus mixed software-services delivery.
    - Disclose software-only gross margin, blended gross margin, and margin by major contract vehicle.
  - - Net revenue retention
    - null
    - low
    - Best public proxy for land-and-expand durability is currently missing.
    - Provide NRR, gross retention, expansion ARR, and seat expansion by cohort.
  - - Headcount
    - ~300 employees in late 2025
    - medium
    - Useful operating-cost proxy while burn and opex are undisclosed.
    - Provide headcount by function, clearance status, and productivity metrics.
  - - Per-seat pricing proxy
    - ~$150K annualized on a cited Navy example
    - medium
    - Helps bound monetization power, but contract-specific pricing may not generalize.
    - Share realized ASP by product, branch, and user tier.
  notes: Nulls are intentional where public evidence does not support a run-date metric. Non-null cells still mix official disclosures with analyst or contract-derived proxies rather than a full company KPI deck.
