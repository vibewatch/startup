    - Sacra
  - - Illustrative Navy deployment pricing proxy
    - $12.15M for 81 seats (~$150K per seat annually)
    - Contract-derived proxy rather than public rate card
    - Need contract scope, term length, and services content before treating as normalized ASP.
    - Sacra plus Navy-deployment coverage
  - - SCRIPTS BPA ordering model
    - Subscription-based business-intelligence tools plus value-added services
    - Vehicle framework, not a published price sheet
    - Agency-level pricing, order types, and line-item mixes are negotiated.
    - GSA SCRIPTS BPA page
  - - Army / DoD enterprise vehicles
    - IDIQ / BPA access to Ark through mission-specific tasking
    - Procurement pathway rather than public list price
    - Actual ACV, seat floors, and discounting remain undisclosed.
    - Bain, PRNewswire, GovConWire
  - - AWS or quote-led commercial presentation
    - No public standard rate card retained in public materials
    - Quote-led / negotiation-led
    - No evidence of a normalized commercial price book for outside investors.
    - Official and analyst sources
  notes: This table separates published or inferred monetization signals from realized pricing. Public evidence is strong on access mechanisms and weak on standard list prices or discounts.
