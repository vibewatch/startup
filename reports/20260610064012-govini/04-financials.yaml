- id: traction-comparables-and-missing-unit-economics
  title: Traction is strong, but public unit economics remain mostly undisclosed
  body: |-
    The public growth story is unusually strong for a private defense-software company. Bain, PRNewswire, CNBC, Virginia Business, and other outlets corroborate that Govini crossed $100 million in ARR in October 2025, and CNBC plus regional reporting indicate a three-year CAGR above 100%. Those signals support real product-market fit and suggest the company has moved beyond pilot-stage defense software. What remains missing is the information needed to decide whether that growth compounds efficiently. Govini does not publicly disclose gross margin, net retention, sales efficiency, CAC payback, churn, burn, or cash conversion. The cleanest available benchmark therefore comes from public comps rather than from Govini itself. Palantir's 2026 results show what scaled defense software can look like when margins are disclosed, while FiscalNote provides a smaller govtech benchmark with subscription-heavy revenue and high adjusted gross margin despite lower scale. Those comps help frame the outer
    boundary of possible software economics, but they do not prove Govini is already there. Investors can underwrite momentum with confidence; they cannot yet underwrite margin durability or sales efficiency without private materials.
