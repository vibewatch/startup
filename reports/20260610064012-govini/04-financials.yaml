- id: financial-verdict-and-diligence-blockers
  title: 'Financial verdict: high-quality growth signal, incomplete underwriting file'
  body: |-
    The best-supported financial verdict is positive on growth quality but incomplete on operating quality. Govini has several attributes investors want to see in a defense software asset: triple-digit growth, a subscription-oriented product, large contract vehicles that shorten future procurement cycles, and enough capital to accelerate product and hiring. The chapter's caution is that almost every classic underwriting metric below ARR remains private. Public evidence does not reveal whether growth is concentrated in a handful of programs, how much services content rides alongside software, what gross margins look like after security and cleared-personnel costs, or how quickly the company converts bookings into cash. External budget sources add another layer of caution by showing that continuing resolutions and slow acquisition processes routinely delay awards and raise costs across the defense system. Put simply, Govini looks much more like a real scaled software platform than an early
    experimental defense startup, but investors still need a management-room data pack before they can judge margin path, renewal durability, and financing self-sufficiency with conviction.
