- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2025 Bain round
    - $150M growth investment
    - high
    - Largest disclosed financing event and best live signal of sponsor conviction.
    - Provide post-money valuation, primary vs secondary split, and investor rights.
  - - Lifetime funding
    - ~$174.5M
    - medium
    - Sets the cumulative equity base supporting current scale.
    - Provide full round-by-round cap table and ownership changes.
  - - Current valuation anchor
    - Above $1B, with regional coverage citing $1.25B and Sacra estimating roughly $1.3B
    - medium
    - Frames dilution sensitivity and marks the company as a late-stage asset.
    - Confirm official post-money valuation and any step-up since the Bain round.
  - - Cash on hand / monthly burn / runway
    - null
    - low
    - Key forward-adequacy variable remains completely undisclosed publicly.
    - Provide current cash, burn trend, and base / downside runway.
  - - Planned use of funds
    - Hiring, product acceleration, AI/data engineering growth, and possible acquisitions / data assets
    - medium
    - Explains why the company raised growth capital despite strong ARR traction.
    - Quantify allocation across product, go-to-market, M&A, and working capital.
  - - Debt / project-finance obligations
    - No public debt disclosure found in retained materials
    - low
    - Hidden leverage or implementation liabilities could change dilution risk materially.
    - Disclose debt, guarantees, deferred comp, and any capitalized contract obligations.
  notes: Historical round amounts are used only to judge forward adequacy. The absence of public cash, burn, and debt figures remains the main underwriting blocker.
