chapter:
  number: 4
  title: Financials
  summary: Govini's financial picture is strongest on top-line traction and weakest on unit-economics disclosure. Bain, Govini, and CNBC corroborate that the company surpassed $100 million of ARR in October 2025 and raised $150 million from Bain Capital, while regional and analyst sources place valuation in roughly a $1.0 billion to $1.3 billion band. The underwriting caution is that gross margin, retention, cash, runway, and revenue-mix disclosure remain private, so the company screens as a scaled, high-quality defense software asset with incomplete operating-quality visibility rather than as a fully modeled SaaS name.
sections:
- id: revenue-model-and-pricing-signals
  title: Revenue model, contract vehicles, and pricing signals
  body: |-
    Govini should be underwritten as a government software subscription business sold through contract vehicles rather than as a transaction marketplace or a services-first contractor. Official, analyst, and news sources all describe Ark as a suite of AI-enabled applications delivered to defense-acquisition users through browser-based workflows and multi-year government software relationships. The best public monetization evidence is indirect. Sacra describes Govini as selling multi-year licenses and estimates a rough per-seat range of about $15,000 to $150,000, while recent Navy contract commentary implies the high end of that range for enterprise-grade deployments. The GSA SCRIPTS BPA is even more important than any isolated seat price because it formalizes the ordering path: the vehicle is explicitly structured around subscription-based business-intelligence tools and value-added services, which means Govini can land software revenue while also attaching analytic support. That mix is
    strategically positive for distribution and expansion, but it leaves investors without clean disclosure on realized average selling price, discounting, software-versus-services mix, or revenue-recognition timing. Revenue quality is therefore helped by sticky government workflows and long procurement vehicles, yet partially obscured by the absence of stream-by-stream disclosure.
  claimRefs:
