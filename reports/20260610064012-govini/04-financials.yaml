tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Ark software subscriptions
    - Multi-year agency or program licenses for Ark applications used in acquisition, supply chain, logistics, production, sustainment, and modernization workflows.
    - Seat licenses / enterprise subscriptions
    - Publicly confirmed as the core model; exact stream split is undisclosed.
    - High if renewals hold because workflows are embedded and mission-critical.
    - Provide revenue by application, customer, and contract vehicle plus renewal cohorts.
  - - Supply Chain application via SCRIPTS BPA
    - Subscription access to Ark Supply Chain Application through GSA SCRIPTS BPA with optional analytic support.
    - BPA task orders / subscriptions
    - Vehicle ceiling is $919M over 10 years, but realized revenue is undisclosed.
    - Medium to high because access path is strong, but BPA ceiling is not booked revenue.
    - Disclose awarded task orders, software-only share, and collection timing under SCRIPTS.
  - - Branch-specific Army / Navy deployments
    - Software subscriptions or task orders attached to branch programs and industrial-base workflows.
    - Program licenses / seat bundles
    - Recent Army and Navy deployments show live adoption, but dollar mix remains private.
    - Medium to high because counterparties are strong, but concentration may be high.
    - Break out branch revenue concentration and average contract duration.
  - - Analytics / value-added services
    - Professional analytic support allowed under GSA and contract-vehicle structures alongside subscriptions.
    - Service fees / support packages
    - GSA scope confirms services can attach, but realized mix is not public.
    - Medium because services can lift ACV but compress software-like gross margins.
    - Separate software revenue from services and implementation revenue.
  - - Seat expansion and module upsell
    - Existing customers can add more seats or additional Ark applications as workflows digitize.
    - Additional seats / modules
    - Sacra describes modular expansion path; actual expansion rates are not disclosed.
    - High potential if expansion drives net retention, but evidence is indirect.
    - Provide NRR, seat growth, module attach, and churn by cohort.
  notes: Rows distinguish subscription software, contract-vehicle access, and attached services. Public ceilings and contract pathways are not the same as recognized revenue.
