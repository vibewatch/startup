  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局是多层的：任务软件、政府承包商流程、政策情报、集成商和现状
        blocks:
          - type: paragraph
            body: >-
              Govini 进入的不是一个清晰的一对一市场。实际买方可以用几类替代方案解决相邻工作：Palantir 用于广义任务软件和分析平台，Deltek 用于政府承包商市场情报加 ERP 和合规流程，Bloomberg
              Government 和 FiscalNote 用于政策或立法情报，Leidos、CACI、SAIC 等系统集成商用于服务驱动的转型，还有长期存在的电子表格、数据征集和定制开发现状。重要之处在于，Govini
              只有在成为国防采办决策的默认记录系统时，才能赢下技术栈中的更多部分。保留证据显示，Govini
              在采办、工业基础和战备流程交汇处最相关；若买方主要需要政策感知、广义公共事务工具，或重人力的数字现代化项目，其相关性较弱。因此，本章核心承销问题不是竞争对手是否存在，而是哪一类竞争对手最直接限制 Govini
              向更多预算和用户扩张。
