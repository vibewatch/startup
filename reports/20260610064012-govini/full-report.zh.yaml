      - CR014
      - CR018
      - CR028
      - CR035
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示 Govini 的核心风险如何传导到增长、利润率和估值。
    data:
      nodes:
        - id: n1
          label: 预算 / CR 延迟
          description: 联邦采购时点变化或暂停。
        - id: n2
          label: 合同授予 / 续约滑坡
          description: 订单或续约落地晚于预期。
        - id: n3
          label: ARR 时点波动
          description: 增长和订单变得更难预测。
        - id: n4
          label: 安全 / 合规弱点
          description: 事件或控制缺口伤害信任。
        - id: n5
          label: ATO / 部署摩擦
          description: 敏感部署放慢或范围变窄。
        - id: n6
          label: 客户扩张走弱
          description: 新模块、席位或任务伙伴落地减少。
        - id: n7
          label: 利润率压力
          description: 销售、交付和补救成本上升。
        - id: n8
          label: 估值压缩
          description: 投资人下调增长、耐久性和终局倍数。
      edges:
        - from: n1
          to: n2
          label: 延迟
        - from: n2
          to: n3
