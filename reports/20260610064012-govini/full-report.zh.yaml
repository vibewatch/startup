    type: journey-map
    layout: standard
    summary: 公开旅程从任务痛点和企业级赞助开始，进入合同工具准入、安全部署，随后在国防工作流中扩展模块。
    data:
      items:
        - id: pain
          label: 任务痛点出现
          actor: 采购赞助方或项目团队
          description: 客户起步时往往有紧迫的供应链、物流、保障或工业基础问题，手工流程很难解决。
          channels:
            - Govini 产品页
            - NDIA / 国防工业信息
            - 国防媒体
        - id: sponsor
          label: 赞助方与买方对齐
          actor: 军种合同办公室、WHS 或 OUSD A&S 赞助方
          description: 采用通常由预算和采购牵引，而不是自助购买；企业级赞助方往往会塑造采购路径。
          channels:
            - Army 合同路径
            - WHS 过桥合同
            - SCRIPTS BPA
        - id: deploy
          label: 安全部署
          actor: 任务用户和项目办公室
          description: ATO 和认证环境就绪度降低了国防组织内部敏感部署的摩擦。
          channels:
            - ATO 声明
            - 合同授予
            - 合作伙伴 / 经销商列表
        - id: operate
          label: 作战工作流使用
          actor: 分析师、后勤人员、保障团队
          description: 用户跑通供应商尽调、零件监测、补给规划或工业基础风险工作流时，价值才算被证明。
          channels:
            - Army 物流案例
            - DLA 保障案例
            - Navy 部署证明
        - id: expand
          label: 按模块或任务伙伴扩展
          actor: 现有赞助方和相邻团队
          description: 扩张看起来来自新模块、增加席位，以及在现有采购工具下跨任务伙伴扩大使用。
          channels:
            - WHS 持续并扩张措辞
            - Sacra 商业模式分析
            - SCRIPTS / Army 工具准入
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU014
      - CU017
      - CU018
      - CU030
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 采购准入和部署证明上的证据最强；续约、使用深度和组合留存阶段证据最弱。
    data:
      nodes:
        - id: awareness
          label: 认知 / 任务痛点
          description: 国防采购和就绪度问题构成评估 Ark 的初始理由。
        - id: vehicle
          label: 采购工具
          description: Army IDIQ、WHS 过桥合同、SCRIPTS 或经销商路径降低采购摩擦。
        - id: authorization
          label: 安全 / 授权
          description: ATO 和认证环境声明帮助产品进入敏感工作流。
        - id: deployment
          label: 具名部署
          description: Army、Navy、DLA 和医疗机构证明显示软件已经在用，而不只是被评估。
        - id: expansion
          label: 扩张 / 重复使用
          description: 公开证据显示有增购席位和任务伙伴增长，但没有量化。
        - id: retention
          label: 组合留存指标
          description: NRR、GRR、流失率、NPS 和头部账户集中度未公开披露。
      edges:
        - from: awareness
          to: vehicle
          label: 证明采购合理性
        - from: vehicle
          to: authorization
          label: 获得资格
        - from: authorization
          to: deployment
          label: 上线
        - from: deployment
          to: expansion
          label: 证明价值
        - from: expansion
          to: retention
          label: 衡量耐久性
    claimRefs:
      - CU003
      - CU004
      - CU006
      - CU014
      - CU020
      - CU021
      - CU023
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 比较 Govini 最可见客户细分和证明界面上的公开证据质量。
    data:
      columns:
        - 证据质量
        - 是否具名客户？
        - 是否披露结果？
        - 留存是否可见？
      rows:
        - label: Army / DoW 组成单位
          values:
            - 强——新闻稿加官方采购记录和作战案例证明
            - 是
            - 是——合同金额和工作流结果
            - 仅部分可见
        - label: WHS / 采购企业级赞助方
          values:
            - 强——重复采购和明确扩张措辞
            - 是
            - 部分——持续和扩张，但没有完整经济数据
            - 否
        - label: Navy 工业基础部署
          values:
            - 中到强——新闻稿加国防媒体轶事
            - 是
            - 是——就绪度风险案例
            - 否
        - label: DLA 保障用户
          values:
            - 中——自有页面上的案例研究证明
            - 是
            - 是——7M 个零件和 98% 时间缩短
            - 否
        - label: 民用 / 其他国家安全机构
          values:
            - 中——广度声明和一个未具名医疗案例
            - 部分 / 多数未具名
            - 部分——工作流规模，但无合同经济数据
            - 否
    claimRefs:
      - CU001
      - CU006
      - CU012
      - CU013
      - CU018
      - CU020
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 按可能性和影响对 Govini 最重要的公开风险排序。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 联邦预算 / 授标时点
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客户集中 / 赞助方依赖
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 安全 / 隐私事件
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 部署复杂度 / 长销售周期
          values:
            - 高
            - 中
            - 中
            - 中高
        - label: 人才和执行压力
          values:
            - 中高
            - 中高
            - 中
            - 中高
        - label: 采购工具准入未转化为使用
          values:
            - 中高
            - 中高
            - 中
            - 中高
    claimRefs:
