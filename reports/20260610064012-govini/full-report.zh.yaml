  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心投资风险，是围绕任务关键型软件逻辑形成的联邦敞口集中
        blocks:
          - type: paragraph
            body: >-
              Govini 的公开风险画像不像消费软件的失败模式，更像集中型联邦企业软件。公司似乎卖进了预算庞大、工作流痛点很强的重要国防机构，这正是上行逻辑存在的原因。但同一种模式也让下行情景更不平滑。公开证据把
              Govini 的可见客户证明连接到 Army Contracting Command、Washington Headquarters Services、Office of the Under Secretary
              for Acquisition and Sustainment、Navy、DLA
              以及政府范围采购载体。这张客户地图意味着平均合同价值高，但也意味着业务会被持续决议、授标延迟、优先级变化，以及少数赞助机构的采购行为显著影响。可比公司文件进一步说明，面向政府的企业软件天然如此：销售周期长、便利终止条款、大合同竞争和授标时间波动，都是结构性问题，不是偶发问题。对
              Govini 来说，承销问题因此变成：任务匹配和扩张潜力是否足以抵消集中度和时间风险。公开证据支持任务匹配，但披露的续约和集中度数据还不足以排除下行。
