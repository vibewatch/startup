chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Govini 由 Eric Gillespie 于 2011 年创立，使命是开创一个全新品类的软件，改变美国政府用 AI
              和数据做国家安全决策的方式。公司注册并总部位于弗吉尼亚州阿灵顿，另在宾夕法尼亚州匹兹堡设有办公室，历史上也曾在加利福尼亚州旧金山设点。Govini 是一家私营 B2B SaaS
              公司，主要通过按席位定价的多年期软件许可协议，向美国政府国防机构和国防承包商销售。

              公司旗舰产品 Ark 是一套 AI 应用，由专有 National Security Knowledge Graph 驱动，整合政府和商业数据。Ark
              覆盖国防采办全链条：供应链、科学与技术、生产、物流、保障和现代化。Govini 的价值主张是用自动化、AI 驱动流程，替代缓慢、手工、电子表格主导的采办流程。平台部署在 FedRAMP High 云环境中，并通过
              CAC 安全浏览器访问，可供有涉密数据访问需求的人员使用。

              截至 2025 年 10 月，Govini 年度经常性收入超过 $100M，三年复合年增长率超过 100%。近期一份标杆合同授予其 $12.15M 的 Navy 交易，对应 81 个 Ark 席位，年化每席位约
              $150,000——显示国防 SaaS 业务具备较强单位经济。公司称，其商业模式是客户从具体用例开始，之后逐步扩展到更多应用模块，由此形成 land-and-expand 收入动力。
