      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Govini 由 CEO Tara Murphy Dougherty 领导。她曾在 Palantir 工作，兼具商业软件和国家安全经验。Dougherty 在采办改革议题上公开活跃，并担任 NDIA
              董事会成员，能够直接接触影响国防采购的政策讨论。创始人 Eric Gillespie 担任执行董事长，继续影响公司的长期方向和技术愿景。这两个角色体现了标准的创始人—CEO 交接结构：创始人仍保留重要董事会权力。

              截至 2026 年初，高管团队包括 Carter Sednaoui（CFO）、Marco Corona（CTO）、Tom Goter（Chief Data Officer）、Amir Hegazy（Chief
              Strategy Officer）、Eric Schatz（COO）、Wookie Nam（Chief Creative Officer）、JulieAnne Evanina（CMO，2026 年 1
              月任命）、Crystal Benton Burnett（SVP Communications，2026 年 1 月任命）、Ted Reynolds（SVP Sales）、Olivia Clepper（SVP
              Mission Implementation）和 Louis Bergeron（EVP）。2026 年 1 月新增 CMO 和 SVP Communications 角色，说明 Bain Capital
              投资之后，公司在为扩大的商业增长阶段做准备。

              关键人风险实质存在：Tara Murphy Dougherty 是采办改革倡议的公众面孔，她与 DoD 高级官员的关系是竞争资产，一旦离任可能被扰动。Eric Gillespie
              的创始人身份也带来董事会层面的关键人暴露。公开资料未显示重大高管离职，但公司强劲增长轨迹历来伴随从国防机构和科技公司招募高管。
