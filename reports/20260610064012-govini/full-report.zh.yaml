    rows:
      - - 部门级采购领导层
        - 买家和发起方是 OUSD A&S 或 WHS 等企业级采购办公室；用户是分析师和项目团队；付款方是联邦合同资金。
        - 跨组合采购现代化、工业基础风险和企业软件标准化。
        - WHS 过桥合同和 SCRIPTS 发起方身份显示企业级采购撬动力。
        - 战略价值高，因为该分层可能打开多项目标准化和扩张路径。
        - 公开来源没有显示席位数、各办公室预算负责人，或企业发起方带来的已实现 ARR。
      - - 军种和组成部门项目办公室
        - 买家是军种合同和项目办公室；用户包括物流人员、保障团队和采购执行人员；付款方是项目或军种资金。
        - 覆盖物流、供应链和生产就绪度的 Army 与 Navy 任务工作流。
        - 延续至 2030 年的 Army IDIQ 加上具名 Navy 部署，是最清晰的规模信号。
        - 这很可能是核心收入分层，因为这些客户购买的是绑定具体任务工作流的作业软件。
        - 没有公开账户列表，也没有披露按军种划分的支出集中度。
      - - 国防工业基础和供应商风险团队
        - 买家是供应链和工业基础负责人；用户是负责 FOCI、供应商尽调和韧性监控的分析师。
        - 持续筛查厂商、供应商和生产生态。
        - SCRIPTS BPA 和 DLA / Navy 证据表明，这个工作流家族是 Govini 最强的切入点之一。
        - 扩张向量有吸引力，因为同一条数据主干可以支撑多个应用和用例。
        - 公开证据没有显示 BPA 上限已有多少转化为经常性支出。
      - - 联邦民事和国家安全机构
        - 买家似乎是机构任务办公室；用户是风险和采购团队；付款方是机构项目资金。
        - DoD 之外的供应商风险监控和工业基础分析。
        - Bain 提到其他联邦机构，Govini 的 Supply Chain 案例研究则展示了一家未具名的联邦医疗机构。
        - 相比纯军种业务，这是有用的多元化信号。
        - 公开证据大多未具名，也没有量化民事收入贡献。
      - - 渠道和经销商路径
        - 记录买家可能是 Carahsoft 等经销商，但终端用户仍是政府机构；付款方仍是政府采购预算。
        - 采购入口、合同便利性和分销支持。
        - Carahsoft 托管 Govini 的产品，并拓宽采购渠道。
        - 可以缩短采购摩擦，并触达偏好成熟经销商的机构。
        - 经销商介入可能遮蔽直接客户黏性和精确终端账户结构。
    notes: 分层来自保留合同、产品页、合作伙伴列表和任务描述的推断，而不是披露的客户名册。
