      - number: '7.3'
        title: 执行风险落在部署复杂度、赞助方依赖，以及维持专业团队稳定上
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Govini 卖的软件之所以有价值，正因为它很难部署好。可比公司文件在这里很有用，因为它们描述的模式与 Govini
              公开证据暗示的模式一致：机会很大但执行很难，安装成本高，数据环境复杂，销售周期长。Govini 自己的招聘页面也说明执行并不简单。公司明确希望在 Arlington 和 Pittsburgh
              汇集技术人员、国防专家、退伍军人和前公务人员，同时让技术候选人经过带回家完成的测评和由领导层参与的半天终面。这说明公司是真正的软件组织，但也意味着招聘速度、留存和跨职能协同都很重要。依赖风险同样集中。Army
              IDIQ、WHS 过桥和 SCRIPTS 等合同载体扩大分发，却也让 Govini 依赖相对少数的赞助路径。Carahsoft
              和更广泛的合作关系可以帮助分发，但也可能居中隔开客户关系。因此，公司有一条可信的规模化路径，但路径足够窄；领导层流失、招聘不及预期、授权延迟，或从载体准入到实际部署使用的转化偏弱，都可能很快传导到收入和估值。
