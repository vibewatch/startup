        - from: n4
          to: n5
          label: 削弱信任
        - from: n5
          to: n6
          label: 放慢部署
        - from: n3
          to: n8
          label: 降低信心
        - from: n6
          to: n8
          label: 降低上行空间
        - from: n4
          to: n7
          label: 补救成本
        - from: n7
          to: n8
          label: 压缩估值
    claimRefs:
      - CR002
      - CR019
      - CR025
      - CR029
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 梳理对 Govini 风险画像最重要的外部和组织依赖。
    data:
      nodes:
        - id: d1
          label: 联邦拨款流程
          description: 预算时点和持续决议决定采购节奏。
        - id: d2
          label: 赞助办公室和采购工具
          description: Army ACC、WHS、OUSD A&S 和 SCRIPTS 打开买方入口。
        - id: d3
          label: 安全认证
          description: ATO 和合规姿态支撑敏感用例。
        - id: d4
          label: 经销商和伙伴渠道
          description: Carahsoft 和合作伙伴扩大分发。
        - id: d5
          label: 第三方基础设施 / 数据
          description: 公开未披露的上游系统和来源支撑产品。
        - id: d6
          label: 领导层和专业人才队伍
          description: Govini 需要国防专家，也需要强软件、数据和产品团队。
        - id: d7
          label: 客户部署
          description: 作战证明和续约依赖前面所有节点正常运转。
      edges:
