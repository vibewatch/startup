      - CR016
      - CR028
      - CR030
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 将 Govini 的规模、证明、风险和估值背景连接到最终推荐。
    data:
      nodes:
        - id: n1
          label: $100M+ ARR 和三位数 CAGR 信号
          description: 公开来源支撑真实的软件规模。
        - id: n2
          label: 任务关键型客户证明
          description: Army、Navy、DLA、WHS 和 SCRIPTS 带来真实的市场可信度。
        - id: n3
          label: 公开分母缺口
          description: 利润率、续约和集中度仍不透明。
        - id: n4
          label: 当前公开估值标记接近 $1.3B
          description: 隐含两位数 ARR 倍数，合理但并不明显便宜。
        - id: n5
          label: 可比公司区间很宽
          description: 上市软件可比公司既支撑上行，也留出大幅下行空间。
        - id: n6
          label: 有条件推进
          description: 公司值得继续做功课，但入场纪律必须守住。
      edges:
        - from: n1
          to: n4
          label: 支撑
        - from: n2
          to: n4
          label: 支撑
        - from: n3
          to: n6
          label: 限制确信度
        - from: n4
          to: n6
          label: 设定价格纪律
        - from: n5
          to: n6
          label: 拉宽区间
    claimRefs:
      - CV001
      - CV003
      - CV018
      - CV022
      - CV025
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果投资者把不同 ARR 倍数套用于已报道的 $100M ARR 里程碑，Govini 的隐含股权价值会如何变化。
    data:
      items:
        - label: 8x ARR
          value: 0.8
          detail: 客户集中或只得到部分验证的软件资产适用的偏悲观估值倍数。
          tone: risk
        - label: 10x ARR
          value: 1
          detail: 较低溢价的软件估值支撑。
          tone: risk
        - label: 13x ARR
          value: 1.3
          detail: 大致对应当前公开老股交易参考标记。
          tone: neutral
        - label: 16x ARR
          value: 1.6
          detail: 如果耐久性验证顺利，属于基准到乐观区间。
          tone: positive
        - label: 20x ARR
          value: 2
          detail: 如果 Govini 看起来更接近顶级国防软件，而不是不透明的民营政府科技公司，就是溢价情景。
          tone: positive
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV013
      - CV014
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前公开估值标记落在基准情景内；只有私有质量指标强，才有上行空间。
    data:
      items:
        - label: 悲观公允价值
          low: 0.7
          mid: 0.9
          high: 1
          displayValue: $0.7B-$1.0B
          detail: 集中度、续约或利润率不及预期。
          tone: risk
        - label: 基准公允价值
          low: 1.1
          mid: 1.3
          high: 1.6
          displayValue: $1.1B-$1.6B
          detail: ARR 里程碑真实、增长仍强，但公开信息不透明只得到部分缓解。
          tone: neutral
        - label: 乐观公允价值
          low: 1.8
          mid: 2
          high: 2.2
          displayValue: $1.8B-$2.2B
          detail: 私有数据证实续约、利润率和交叉销售质量都强。
          tone: positive
        - label: 当前公开参考标记
          low: 1.3
          mid: 1.3
          high: 1.3
          displayValue: ~$1.3B
          detail: Sacra 引用的老股交易市场估计。
          tone: neutral
    claimRefs:
      - CV003
      - CV012
      - CV013
      - CV014
      - CV022
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向 IC 的记分卡显示：资产可信，但公开证据还不足以支撑满价确信。
    data:
      items:
        - label: ARR 里程碑
          value: $100M+
          detail: 由 Bain、CNBC 和 GovConWire 的公开信息支撑。
          tone: positive
        - label: 累计融资
          value: $174.5M
          detail: 投资方支持足够，能支撑真正的品类建设。
          tone: positive
        - label: 公开参考估值
          value: ~$1.3B
          detail: 老股交易估计，不是公司确认的定价轮。
          tone: neutral
        - label: 隐含 ARR 倍数
          value: ~13x
          detail: 合理，但还没便宜到可以忽略分母风险。
          tone: neutral
        - label: 增长信号
          value: '>100% 3yr CAGR'
          detail: 公开增长叙事很强。
          tone: positive
        - label: 客户证明质量
          value: Strong
          detail: 有真实的 Army、Navy、DLA 与赞助方路径证据。
          tone: positive
        - label: 风险权重
          value: Elevated
          detail: 客户集中、续约不透明和采购节奏仍然重要。
          tone: risk
        - label: 证据质量
          value: Medium
          detail: 足以支撑认真尽调，不足以盲目确信。
          tone: neutral
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV018
      - CV020
      - CV032
      - CV040
