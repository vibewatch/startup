  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前值 / 状态
      - 收入质量
      - 尽调要求
    rows:
      - - Ark 软件订阅
        - 机构或项目购买多年期 Ark 应用许可，用在采购、供应链、物流、生产、保障和现代化工作流中。
        - 席位许可 / 企业订阅
        - 已被公开确认为核心模式；具体收入流拆分未披露。
        - 若续约守得住，质量较高，因为工作流已嵌入且任务关键。
        - 按应用、客户和合同工具提供收入，并给出续约 cohort。
      - - 通过 SCRIPTS BPA 提供的 Supply Chain 应用
        - 通过 GSA SCRIPTS BPA 订阅访问 Ark Supply Chain Application，并可选配分析支持。
        - BPA 任务订单 / 订阅
        - 采购工具上限为 10 年 $919M，但实际收入未披露。
        - 中到高；访问路径强，但 BPA 上限不是已入账收入。
        - 披露 SCRIPTS 下已授予任务订单、纯软件占比和回款时间。
      - - 陆军 / 海军按军种部署
        - 绑定军种项目和工业基础工作流的软件订阅或任务订单。
        - 项目许可 / 席位包
        - 近期陆军和海军部署显示已经实际采用，但金额结构仍未公开。
        - 中到高；交易对手强，但集中度可能较高。
        - 拆分军种收入集中度和平均合同期限。
      - - 分析 / 增值服务
        - GSA 和合同工具结构允许在订阅之外附加专业分析支持。
        - 服务费 / 支持包
        - GSA 范围确认服务可以附加，但实际组合未公开。
        - 中；服务可以抬高 ACV，但会压低软件式毛利率。
        - 将软件收入与服务和实施收入拆开。
      - - 席位扩张和模块加购
        - 工作流数字化后，现有客户可以增加席位或增购 Ark 应用。
        - 新增席位 / 模块
        - Sacra 描述了模块化扩张路径；实际扩张率未披露。
        - 若扩张拉动净留存，潜力较高，但证据是间接的。
        - 提供 NRR、席位增长、模块 attach 和按 cohort 拆分的流失率。
    notes: 各行区分订阅软件、合同工具访问和附加服务。公开上限和合同路径不等于已确认收入。
