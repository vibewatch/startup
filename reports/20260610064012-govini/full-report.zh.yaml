      - number: '8.4'
        title: 最后一公里不是市场发现，而是证明收入标题下的质量
        blocks:
          - type: paragraph
            body: >-
              公开证据足以支持认真推进，但不足以成交。最重要的最终尽调问题都藏在 ARR
              标题下面：客户集中度、续约行为、利润率结构、实施负担，以及合同载体转化为活跃部署的真实比例。如果答案偏弱，下行情景很容易想象。一家公司如果主要卖给少数联邦赞助方，一两个项目放缓、合同载体无法转化为使用，或安全和实施摩擦限制扩张，都可能让估值快速下修。如果
              Govini
              能证明多模块扩张、耐久的任务所有权和软件式经济性，上行情景也很容易想象。因此，最终建议应保持有条件，而不是二元判断。公司已经赢得估值关注，但还没有赢得估值上的松懈；审慎投资者应把承销纪律收得比标题增长率暗示的更紧。
