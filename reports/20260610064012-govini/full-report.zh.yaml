      - - 供应链与工业基础专业化
        - Deltek 可以借 GovWin、ERP、提案定价和承包商运营吸收相邻支出
        - 高
        - Deltek 公开覆盖从授标前情报到 ERP 和制造支持
        - 拆分哪些预算属于承包商工作流支出，哪些属于采购就绪软件支出
      - - 通过 ATO 和采购工具形成采购就绪
        - 如果合同授予后部署用户和席位没有实质扩张，审批优势就没那么重要
        - 中
        - 公开来源确认 ATO 和采购工具，但没有确认各军种的使用深度
        - 要求按军种和项目办公室提供席位数、MAU 和模块采用情况
      - - 渠道和生态入口
        - 渠道支持可能扩大触达，但不能保证替换已经嵌入机构工作流的既有厂商
        - 中
        - Carahsoft 和 NDIA 提升触达和信任，但不能证明竞争替换已经发生
        - 审查合作伙伴主导机会贡献的线索管道和赢单率
      - - 品类特定工作流契合度
        - 买方可能继续多栖使用，限制赢家通吃经济性
        - 高
        - 公开证据支持 Deltek、政策工具、Govini 和系统集成商之间的组合式技术栈
        - 要求提供头部客户工具栈图谱，以及按模块拆分的续约证据
      - - 企业定价不透明
        - 没有公开基准，很难证明 Govini 相比对手靠经济价值取胜
        - 中
        - 留存材料中，多数具名替代方案都未披露公开标价
        - 获取当前价格册、工作说明书样本和实际折扣区间
    notes: 严重性来自对留存证据的承销判断，不是公司披露的风险排序。尽管 Govini 的工作流特异性很强，本登记表仍聚焦最可能削弱其表面护城河的威胁。
