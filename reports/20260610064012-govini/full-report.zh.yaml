    rows:
      - - 供应商和 FOCI 分析
        - 手工电子表格和碎片化供应商数据拖慢风险审查。
        - FOCI Navigator、Vendor Due Diligence 等 Supply Chain 工作流集中供应商映射和报告。
        - 一个已发布案例将报告时间缩短 83%，产出提高 500%。
        - 公开证据未披露持续准确率或分析师 override 率。
      - - 新兴技术尽调
        - 深入研究市场和专家很耗时。
        - Science & Technology 工作流生成 AI 驱动的报告，以及专家或市场视图。
        - 公开案例称分析时间下降 94%，每份报告节省 160 小时。
        - 未公开披露幻觉控制或分析师审查工作流。
      - - 生产瓶颈识别
        - 项目办公室很难在延误发生前看清高风险零件和供应商。
        - Production 工作流浮现 BOM、供应商和可保障性风险。
        - 一个已发布案例评估 80,000 个零件和 6,000 家供应商，隔离出 32 个高风险项。
        - 未公开披露与源 BOM 系统的集成细节。
      - - DMSMS 和 requisition 就绪
        - 团队往往到过时和低库存问题出现后才反应。
        - Sustainment 工作流识别替代零件和供应商，并标记 requisition 风险。
        - 公开案例称，在 700 万个 DLA 管理零件中，相似零件识别时间下降 98%。
        - 需要私有验证推荐精度和采购跟进。
      - - 争夺环境物流规划
        - 手工补给规划又慢又孤岛化。
        - Logistics 工作流结合 COP、补给规划和战斗力视图。
        - 公开案例称规划时间从 36 小时降到 1 小时，风险解决速度提高 16 倍。
        - 未公开披露在涉密或断连条件下的表现数据。
      - - 现代化产能规划
        - 未来平台需求和劳动力约束很难建模。
        - Modernization 工作流预测需求，并评估供应商和劳动力就绪度。
        - 公开案例称提升了进度可行性，也更快识别替代供应商。
        - 未公开披露预测准确性或情景敏感性基准。
    notes: 收益来自 Govini 发布的结果，应视为客户故事证据，而不是独立审计基准。
