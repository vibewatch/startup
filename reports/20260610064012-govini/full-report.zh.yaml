    title: 缓释与止损标准表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 客户集中度
        - 头部账户 ARR 占比
        - 前五大客户或发起方路径超过某个集中度，续约强度也无法抵消
        - 重新切分下行情景，并要求更大的入场折价，否则放弃。
      - - 续约耐久性
        - 按机构队列拆分的 GRR / NRR / logo 留存
        - 续约数据明显弱于公开任务证明所暗示的水平
        - 将公开部署证据视为高估粘性。
      - - 采购载体转化风险
        - 来自 SCRIPTS、Army 和 WHS 路径的预订量与使用量
        - 采购入口增长，但已部署席位或 ARR 没有同步增长
        - 下调扩张假设和基准估值。
      - - 安全与合规
        - 事件历史、审计结果和 ATO 维护
        - 尽调中出现重大未解决发现或控制薄弱
        - 暂停投资，直到确认整改完成。
      - - 执行能力
        - 招聘速度、流失和实施带宽
        - 关键岗位长期空缺，或交付团队过度拉伸
        - 下调增长假设，并延长达到规模所需时间。
    notes: 止损标准聚焦于最强的公开正面因素能否转化为耐久的私有经营证据。
    claimRefs:
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 有条件推进
        - 中
        - 偏高
        - 接近公开老股交易标记，合理到略偏满
        - 只有在严格完成集中度、续约和利润率尽调后才推进。
    notes: 建议仅基于公开证据，并假设据报道的 ARR 里程碑在方向上准确。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV019
      - CV022
      - CV040
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Govini 似乎拥有一个差异化的国防采购工作流细分市场，并且有真实客户证明。
        - 更强的具名客户扩张和多模块采用数据会增强确信度。
      - - 超过 $100M 的 ARR 和三年 100%+ CAGR 足以让这项资产值得认真研究。
        - 如果 ARR 质量弱于公开标题所暗示的水平，确信度会急剧下降。
      - - 采购载体和发起办公室可以扩大 DoD 内部的扩张空间。
        - 如果这些路径从入口到使用的转化很差，增长逻辑会削弱。
      - - 安全和信任信号降低了敏感工作流中的部署风险。
        - 审计、事件或 ATO 维护证据薄弱，会显著伤害投资逻辑。
      - - 当前隐含倍数远低于 Palantir 的公开市场溢价。
        - 只有 Govini 能展示同样强的耐久性和经济性，Palantir 才有参考价值。
      - - 主要反向逻辑是集中度、续约和利润率不透明。
        - 如果私有数据证明软件式利润率和健康留存，立场会从有条件推进转向更肯定。
    notes: 反向逻辑主要指向分母质量，而不是 Govini 是否做出了有价值的东西。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV026
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 远超 2025 年里程碑，多模块扩张强劲，续约健康，集中度可控。
        - 18x-22x ARR 或等价的战略溢价逻辑支撑大约 $1.8B-$2.2B+ 价值。
        - 在耐久性被证明前，执行或预算冲击打断动能。
        - 低到中
      - - 基准
        - ARR 说法真实，增长仍有吸引力，但集中度和利润率数据只是混合，并非顶尖。
        - 11x-16x ARR 逻辑支撑大约 $1.1B-$1.6B 的公允价值区间。
        - 投资人在续约证明不足时为增长支付过高价格。
        - 中
      - - 悲观
        - 集中度高、续约弱于预期，或公开需求信号无法转成稳定使用。
        - 7x-10x ARR 逻辑支撑大约 $0.7B-$1.0B 价值。
        - 一两个主要发起方路径放慢，或受到实质性挤压。
        - 中
    notes: 情景区间是分析估计，不是公司指引。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV023
      - CV034
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Palantir
        - 2026 年 6 月公开估值比率
        - 市值 $316.61B；PS 60.61x；EV/Sales 59.11x
        - 最强证据：当增长和耐久性可见时，高信任国防软件可以拿到极高溢价。
        - 比 Govini 大得多、更多元，也透明得多。
      - - FiscalNote
        - 2026 年 6 月公开市场价值与收入快照
        - OTC 市值 $4.79M，对应 $87.92M 收入；陷入困境的 govtech 结果
        - 当耐久性和资本结构破裂时，政府相邻软件会走向下行情景，这是有用警示。
        - 产品类别不同，且明显陷入困境，因此不是核心估值锚。
      - - C3.ai
        - 2026 年 6 月公开市场价值
        - 市值 $1.57B；同比下跌 48.02%
        - 可作为叙事型 AI 可比，显示公开市场围绕 AI 软件的波动。
        - 并非国防采购特定公司，公开市场情绪波动很剧烈。
      - - BigBear.ai
        - 2026 年 6 月公开市场价值
        - 市值 $1.91B；同比上涨 71.80%
        - 更接近国防 / AI 相邻公司，也说明小规模国防 AI 公司仍可守住十亿美元级估值。
        - 波动很高，不是干净的盈利能力或耐久性基准。
      - - Tyler Technologies
        - 2026 年 6 月公开市场价值
        - 市值 $12.70B
        - 成熟 govtech 参照，显示软件深嵌政府工作流时如何创造价值。
        - 不偏 AI、不聚焦国防，也比 Govini 成熟得多。
    notes: 这组可比公司用于构建区间，而不是单点定价公式。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful public software and govtech references available in retained evidence; no
        comp is a perfect match for defense-acquisition software.
    claimRefs:
      - CV009
      - CV010
      - CV015
      - CV016
      - CV017
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV005
    title: 投资逻辑破裂与止损触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 客户集中度过高
        - 头部账户或头部路径暴露显著高于公开故事所暗示的水平
        - 让增长和续约故事脆弱得多
        - 要求更低入场价，或直接放弃
      - - 续约质量弱
        - GRR / NRR 或 logo 留存与关键任务定位不一致
        - 削弱两位数收入倍数的理由
        - 重估到悲观情景或放弃
      - - 利润率不像软件公司
        - 毛利率和交付负担更接近服务业务，而不是规模化 SaaS
        - 削弱高倍数估值逻辑
        - 明显压低估值假设
      - - 采购载体转化差
        - SCRIPTS、Army 和 WHS 路径没有转化为已部署使用
        - 说明管线叙事被夸大
        - 下调增长情景并拉长时间线
      - - 安全 / 合规弱点暴露
        - 事故、审计或 ATO 证据弱于公开信任声明暗示
        - 威胁部署广度和客户信心
        - 暂停或终止投资案
    notes: 终止触发点聚焦公开声明验证，而不是猜测市场时点。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV035
      - CV036
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 客户集中度
        - Top-10 ARR 占比和赞助方路径集中度
        - 决定收入基础有多脆弱。
        - 财务和销售运营尽调
      - - 留存质量
        - 按机构队列拆分 GRR、NRR、logo 留存和模块挂载
        - 决定收入分母是否配得上溢价。
        - 收入分析和客户成功尽调
      - - 利润率结构
        - 毛利率、服务负担和实施成本画像
        - 判断 Govini 更像软件公司还是服务偏重公司。
        - 财务和交付尽调
      - - 安全态势
        - 事故历史、审计结果、ATO 维护和控制证据
        - 敏感防务工作流的核心信任支柱。
        - 安全尽调和控制审查
      - - 采购载体转化
        - 按 Army、WHS 和 SCRIPTS 路径拆分预订、使用和续约表现
        - 告诉投资人采购入口是否真正变成货币化。
        - 销售 / GTM 尽调
      - - 退出准备度
        - 上市公司控制、披露成熟度和未来流动性事件意愿
        - 决定外部投资人多快能兑现价值。
        - CFO / 董事会尽调
    notes: 这些问题是把公开合理性转成私下承销前必须完成的最低工作。
    claimRefs:
      - CV033
      - CV034
      - CV037
      - CV038
      - CV039
      - CV040
