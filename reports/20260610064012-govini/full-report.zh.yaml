    rows:
      - - 在既有机构内增加更多席位和模块
        - 模块宽度不能保证预算权限，也不能保证跨项目用户采用。
        - 如果 Ark 成为标准工作流层，扩张空间可能很大；如果部署保持狭窄，这一判断就不成立。
        - 审查按机构划分的账户级席位增长、模块挂载率和发起方地图。
      - - 借 Army IDIQ、WHS 和 SCRIPTS 撬动合同工具
        - 合同工具入口可能被误判为已实现需求；SCRIPTS 也是多获奖方机制。
        - 如果机构没有把入口转成经常性订单，管线可能看起来大于已预订 ARR。
        - 索取按合同工具划分的预订额、积压订单和义务支出消耗。
      - - 2025 年 ATO 声称推动跨军种采用
        - 安全就绪度会降低扩张难度，但每个项目仍要面对预算和变革管理门槛。
        - 这是良好的可部署性信号，但不能直接预测续约。
        - 索取按军种划分的实施时间表和价值实现时间。
      - - 仅联邦客户的集中度
        - 收入仍高度集中于美国预算周期、采购时点和国防优先事项。
        - 持续决议或项目延期可能同时拖延净新增和续约决策。
        - 索取头部客户 ARR 占比，以及对各拨款路径的暴露。
      - - 经销商和渠道支持
        - Carahsoft 这类伙伴可以拓宽分销，但也可能隔在 Govini 与直接客户关系之间。
        - 有助于降低采购摩擦，但可能削弱对用户满意度和增购控制的可见度。
        - 索取直销 / 渠道结构和渠道经济性。
      - - 民事和情报领域扩张
        - Bain 提到其他联邦和情报部署，但公开证明薄弱，且大多未具名。
        - 多元化潜力存在，但缺少透明公开客户数据支撑。
        - 索取具名背书，以及 DoD 之外的 ARR 贡献。
    notes: 扩张逻辑真实存在，但集中度风险仍然重要，因为几乎所有保留证据都落在美国联邦采购和国防任务内部。
