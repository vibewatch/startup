      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              国防采办软件的买方结构分层。付款方是通过拨款流程出资的美国政府；买方通常是 Program Executive Office（PEO）、Army Contracting Command 的 Contracting
              Officer，或 OUSD A&S 的企业级决策者。用户则是直接操作 Ark 平台的采办专业人员、后勤军官、供应链专家或项目经理。付款方、买方和用户分离，带来销售复杂度；Govini
              通过企业级合同工具（IDIQ、BPA）降低单笔采购负担来应对。

              关键买方细分包括：（1）美国陆军采办和物流组织，在陆军 IDIQ 和 DoW 桥接合同之后，这是 Govini 公开记录最充分的客户细分；（2）美国海军保障和现代化项目，Ark 已通过解决潜艇维护过时问题展示
              ROI；（3）管理卫星和太空系统供应链的美国 Space Force 采办军官；（4）发起跨 DoW 合同的 OUSD A&S 级企业买方；（5）美国情报共同体（IC），Govini
              称其为正在扩大的部署领域，但公开细节较少。

              采用触发点通常是任务关键供应链失效、强制审计或合规要求，或由领导层推动的现代化倡议。保障软件的预算所有权主要落在运营与维护（O&M）拨款上，新能力开发则使用研究、开发、测试与评估（RDT&E）资金。FY2026
              NDAA 的软件资金灵活性条款——允许 Procurement、RDT&E 和 O&M 资金互换使用——降低采购摩擦，应会扩大 Govini 的可触达预算。
