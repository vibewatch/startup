  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓释 / 尽调要求
    rows:
      - - DoD 原生采购工作流深度
        - Palantir 可以围绕同一批项目打包更宽的任务平台能力
        - 高
        - 独立报道仍把 Palantir 视为规模和合同深度都很强的既有龙头
