              - CR010
      - number: '7.2'
        title: 隐私、安全、采购和合同结构构成最可见的非市场风险
        blocks:
          - type: paragraph
            body: >-
              公开监管和法律风险中，最强的不是已披露诉讼，而是在高度监管、敏感联邦环境中运行软件的负担。Govini
              自己的隐私政策称，公司收集并存储企业客户信息，使用服务提供商，可能以服务提供商身份处理客户员工信息，也无法保证其自身或供应商运营的每个网络、系统、服务器或数据库都安全。这类措辞很常见，但放在 Govini
              的语境里更重要，因为产品靠近采购、就绪和工业基础工作流；一旦发生安全事件或隐私失误，信任后果可能被放大。Palantir 和 FiscalNote 的可比文件也强化了这一类别风险：隐私、网络安全、演进中的 AI
              监管、复杂政府合同规则、便利终止条款和预算驱动延迟，都是任务软件供应商的反复风险。Govini 的公开优势部分抵消了这些问题。公司和合作伙伴页面强调安全姿态、IL5 与 FedRAMP 信任信号，以及 2025
              年的服务 ATO。不过，公开资料没有披露事件历史、正常运行时间、审计结果、渗透测试发现或合同终止率。因此，最准确的风险表述是：风险已有缓释，但观察仍不足。
