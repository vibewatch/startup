  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Ark 是一个六应用国防采办操作系统，而不是单点工具
        blocks:
          - type: paragraph
            body: >-
              按国防软件标准看，Govini 的产品定义异常具体。公司没有营销通用数据湖或包罗万象的分析层；它把 Ark 定位为一套六个 AI
              应用，映射到具体采办工作：供应链、科学与技术、生产、保障、物流和现代化。官方产品页面明确把这些应用绑定到日常工作，例如外国所有权筛查、供应商尽调、物料清单管理、可保障性分析、请购情报、补给规划和现代化需求规划。这种
              job-to-be-done 框架很重要，因为它解释了 Govini
              为何能在机构内部横向扩张而不丢失任务专用性。每个模块共享同一套以采办为中心的词汇和集成数据脊柱，但流程界面因用户类型和任务而异。因此，公开证据支持一个真实应用家族，且模块广度有意义。

              它不是一个为多个买方换皮的单一仪表盘。代价是公开材料仍偏营销：它们展示截图、具名流程和结果轶事，却没有更深的技术规格，让外部人验证数据血缘、延迟或模型质量主张。
