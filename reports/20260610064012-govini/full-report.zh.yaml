        title: 投资建议应是有条件推进，而不是全速确信
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确的投资建议是有纪律地有条件推进。投资逻辑真实存在：Govini
              似乎已经打造出一个差异化的国防采购软件资产，规模可观、客户证据强，并拥有可支撑进一步扩张的赞助路径。反向逻辑同样真实：公开证据仍没有揭示足以支撑 Palantir
              式溢价的耐久性数学。如果私有尽调显示续约质量健康、前几大账户集中度可接受、利润率像软件公司，那么当前估值可能合理，甚至略有吸引力。如果这些指标不及预期，同一估值会很快显得偏满，因为集中度和采购节奏风险将主导故事。这种不对称很重要。投资者今天不应按耐久性问题已经解决来出价。只有当价格为仍未验证的分母留出空间时，才应付款。
