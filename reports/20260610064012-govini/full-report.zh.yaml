  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标分部
      - 差异化
      - 局限
    rows:
      - - Govini
        - 直接品类专家
        - 私营公司；2025 年 10 月披露 $100M+ ARR 和 Bain 领投 $150M 轮融资
        - DoD 采购、工业基础、供应链、后勤、保障买方
        - 专为国防采购和就绪度工作流打造的六应用 Ark 栈
        - 私营公司披露仍有限；定价、续约和席位深度数据不公开
      - - Palantir
        - 主导型既有厂商
        - 上市公司；Yahoo 报道称 2025 年 10 月市值突破 $400B
        - 国防、情报和企业数据 AI 买方
        - 横向任务平台家族很宽，覆盖 Gotham、Foundry 和 AIP
        - 相比 Govini 聚焦采购的定位，其广度可能牺牲工作流针对性
      - - Deltek
        - GovCon 工作流既有厂商
        - 私营存量软件厂商；公开页面强调已打入前 10 大 A&D 承包商
        - 政府承包商，以及 A&D 财务 / 捕获 / 合规团队
        - 覆盖 GovWin IQ、Costpoint、提案定价、ERP、制造和合同管理
        - 相比任务就绪度分析，更偏承包商工作流和合规
      - - Bloomberg Government
        - 相邻政策情报既有厂商
        - 官方规模代理：355 个国会办公室、93% 内阁机构、前 100 大游说支出方中的 70%
        - 公共事务、游说、协会、企业、机构
        - 一体化公共事务平台，包含新闻、分析、立法跟踪和决策者工具
        - 不是国防采购执行平台
      - - FiscalNote
        - 相邻政策情报既有厂商
        - 上市公司，拥有投资者关系、SEC 文件、年报和任务关键洞察定位
        - 需要立法 / 监管跟踪的政府事务和政策团队
        - PolicyNote 增加 AI 摘要、起草工具、跟踪和 API 访问
        - 相邻性最强的是政策监控，而非工业基础执行
      - - Leidos / CACI / SAIC
        - 服务主导的替代方案
        - 大型国防服务既有厂商，提供数字现代化、分析、AI 和企业 IT 服务
        - 偏好集成商主导转型和大型服务合同的机构
        - 可借既有服务关系打包任务 IT、分析和实施
        - 相比 Govini 产品主导的 SaaS 模式，更定制化、也更吃人力
      - - 现状 / 内部自建
        - 现状替代
        - 无需供应商许可证；使用现有人力和碎片化工具
        - 仍在跑电子表格、数据征集和定制报告的项目办公室
        - 流程熟悉，无需新软件采购即可启动
        - 慢、手工、难扩展，集成可视化也弱
    notes: 规模单元格依赖保留下来的公开代理指标；如果保留材料未披露确切收入或估值，本表用上市公司身份、装机基础信号或公开采用代理来标注竞争对手，而不是编造数字。
