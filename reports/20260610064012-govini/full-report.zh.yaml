  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Govini 的市场最适合定义为国防采办软件：向美国国防部（DoD）机构和组成部门销售的商业 AI
              软件平台，用于自动化、分析并加速国防采办生命周期——覆盖供应链风险管理、科学与技术扫描、生产分析、保障、物流和现代化规划。现状替代方案包括手工电子表格流程、政府自建系统，以及 Palantir Foundry
              这类通用数据平台。相邻市场包括传统系统集成服务（如 Booz Allen Hamilton、SAIC）、企业资源规划系统（ERP），以及并非专为国防设计的商业供应链管理软件。

              排除支出包括硬件采购、武器系统采办 R&D 成本，以及 DISA 和云服务商管理的更广泛 DoD IT 基础设施。纯分析咨询服务、缺少国防专用数据集成的商业 SCM 软件也被排除。Govini
              纳入范围的支出，是国防采办流程自动化所需的按席位 SaaS 软件许可类别，重点在供应链情报、采办决策支持和采办生命周期管理。

              更广泛的 DoD 预算背景很重要：FY2026 DoD 预算请求约 $961B，其中包括来自 2025 年调和法案的 $113B。FY2026 指挥、控制、通信、计算机和情报（C4I）系统支出请求为
              $23.2B，高于 2020 年的 $10.2B，六年增长 127%，反映政策正转向软件赋能的国防能力。在这一预算包络内，PPBE 改革、强制性 DoD Software Acquisition Pathway
              和 Enterprise Software Agreements，正在把更多可支配 IT 支出导向 Govini 这类商业软件供应商。
