        blocks:
          - type: paragraph
            body: >-
              Govini 2025 年 10 月 Bain Capital 轮显然改善了近期财务灵活性，但没有消除对流动性和融资依赖的尽调需求。Bain 和 PRNewswire 确认 $150M 成长投资；Sacra
              的轮次年表则在加入 2013 年和 2015 年早期融资后，把生命周期融资额放在约 $174.5M。Virginia Business 和 Defense One
              都称新资本将用于招聘、路线图加速，并可能用于收购或数据集扩张。这是建设性的，因为它暗示融资来自需求位置，而非明显困境。与此同时，保留的公开来源都未披露 Govini
              的现金余额、月度烧钱、跑道、债务义务，或资本化实施承诺。SCRIPTS BPA 以及 Army 或 Navy 工具也不应被误认为已保证的确认收入；它们是降低摩擦的采购赋能工具，而不是已经

              完全去风险化回款的承诺。换句话说，公司资本化水平看起来远好于规模化前创业公司，但公开证据仍未回答一个核心前瞻问题：如果采购时点滑动，或扩张招聘快于回款，Govini 有多少跑道？
