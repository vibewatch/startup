      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >
              Govini 生命周期内总融资约 $174.5M。最重要的一轮是 2025 年 10 月宣布的 Bain Capital $150M 成长投资，时间点与公司跨过 $100M ARR 里程碑一致。该投资由 Bain
              Capital Tech Opportunities 合伙人 Scott Kirk 牵头。此前融资包括 2015 年 5 月由 Accel 领投的 $20M Series C，以及 2013 年 2 月的
              $4.5M Series B。早期投资方包括 Salesforce Ventures 和 Symphony Technology Group（STG）。Govini 也将专注科技的专业金融公司 Hercules
              Capital 纳入资本结构。

              公司尚未公开披露正式估值，但截至 2026 年初，二级市场数据和分析师估算把 Govini 的隐含估值放在约 $1.3B，对应独角兽地位。Bain Capital
              投资使公司能够继续投入产品、扩张团队、增强能力，以满足公司所称国家安全共同体中的「激增需求」。这笔资本注入发生在一系列重大合同赢单和平台授权之后，从收入和监管角度显著降低了业务风险。

              作为私营公司，Govini 不公开披露毛利率、烧钱速度或净利润。政府多年期合同下的 SaaS 模式，通常比项目制收入带来更稳定、更经常性的现金流，但按席位定价模式需要持续扩席，才能维持当前 100% 以上
              CAGR 的增速。$919M 的政府范围供应链风险照明合同提供了长期收入天花板，支撑激进增长假设，不过实际下单率未披露。
