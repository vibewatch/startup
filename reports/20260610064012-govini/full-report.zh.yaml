    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、合同工具与定价信号
        blocks:
          - type: paragraph
            body: >-
              Govini 应被视为一家通过合同工具销售的政府软件订阅公司，而不是交易市场或服务优先承包商。官方、分析师和新闻来源都把 Ark 描述为一套 AI
              应用，通过浏览器流程和多年期政府软件关系交付给国防采办用户。最好的公开变现证据是间接的。Sacra 称 Govini 销售多年期许可，并估计每席位粗略区间约为 $15,000 到 $150,000；近期 Navy
              合同评论则暗示企业级部署落在该区间高端。GSA SCRIPTS BPA 比任何单个席位价格都更重要，因为它把订购路径正式化：该工具明确围绕订阅型商业情报工具和增值服务设计，意味着 Govini
              可以落地软件收入，同时附加分析支持。这个组合

              对分销和扩张具有战略利好，但投资者仍看不到已实现平均售价、折扣、软件与服务组合，或收入确认时点的清晰披露。因此，黏性的政府流程和长期采购工具提升了收入质量，但分流披露缺失又让收入质量部分变得不透明。
