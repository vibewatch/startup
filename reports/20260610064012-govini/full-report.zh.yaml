      - number: '4.2'
        title: 牵引力很强，但公开单位经济大多未披露
        blocks:
          - type: paragraph
            body: >-
              对一家私营国防软件公司而言，公开增长故事异常强劲。Bain、PRNewswire、CNBC、Virginia Business 和其他媒体相互印证：Govini 在 2025 年 10 月跨过 $100M
              ARR；CNBC 加上地区报道则显示三年 CAGR 超过 100%。这些信号支持真实产品市场契合，也说明公司已越过国防软件试点阶段。缺失的是判断这种增长能否高效复利所需的信息。Govini
              不公开披露毛利率、净留存、销售效率、CAC 回收期、流失率、烧钱、或现金转化。最干净的可用基准因此来自上市可比公司，而不是 Govini 自身。Palantir 2026
              年业绩展示了规模化国防软件在披露利润率时可能呈现的样子；FiscalNote 则提供了一个规模更小的 govtech
              基准，收入以订阅为主，调整后毛利率较高，即便规模较低。这些可比公司有助于框定可能的软件经济性范围。

              但它们不能证明 Govini 已经达到那一水平。投资者可以有信心承销增长动能；若没有私有材料，则还不能承销利润率耐久性或销售效率。
