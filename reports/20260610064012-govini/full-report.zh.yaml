      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >
              由于没有专门针对「国防采办流程软件」的市场报告，需要用多个口径测算。最宽的适用口径是全球军事与国防软件市场，2025 年估计为 $1.78B，并以 6.3% CAGR 增长到 2026 年约
              $1.89B。这是一个保守底线，因为它排除了 DoD 更大规模的商业 IT 和企业软件支出。把更宽的商业企业软件市场口径套到美国 DoD IT 预算上，会得到更高估计：在 DoD C4I 系统预算为
              $23.2B、国防导向企业软件作为子组件的情况下，Govini 可触达的商业软件细分市场约为每年 $3–8B，取决于国防企业软件定义有多宽。

              对 Govini 的具体 SAM——美国军种和联邦国防机构中可能采用国防采办 SaaS 平台的采办专业人员、后勤军官、供应链经理和保障人员——若用 DoD 采办人员规模（估计 170,000+ 名采办专业人员）和
              Govini 观察到的每席位年费 ~$150,000 自下而上估算，满渗透理论 SAM 约为 ~$25B；但现实定价层级和竞争会显著压低可实现细分市场。更保守的 SAM 估计为 $2–5B，反映 DoD
              年度软件和 IT 预算中可通过 IDIQ、BPA 和机构直接采购获得的商业软件支出。

              Govini 当前 SOM 由其 $100M ARR 和 $919M SCRIPTS BPA 上限锚定——按当前运行率计，SOM 约为每年 $100M–$130M，即便以保守 $3B SAM 计算，渗透率也低于
              5%。TAM/SAM/SOM 缺口很大，但相对缓慢增长的市场，Govini 的增速（100%+ CAGR）给出了五年内达到 3–5% SAM 渗透率的可信路径。关键规模不确定性在于：Govini
              的市场是否只受国防采办软件子细分约束，还是能扩展到更广泛的国防 IT 和商业政府分析。
