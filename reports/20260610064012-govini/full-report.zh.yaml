        - 驱动
        - 立即（FY2025–2026）
        - 自上而下要求国防采购采用商业软件，直接支撑 Govini 所在品类
        - 核实现有执行状态和各机构合规截止日期
      - - DoD 强制 Software Acquisition Pathway (SWP) 指令（2025 年 3 月）
        - 驱动
        - 近期（FY2025–2026）
        - 要求所有软件开发采购优先选择商业软件，削弱定制开发替代方案的竞争力
        - 确认 Govini 认证和路径合规状态
      - - PPBE 改革：数据标准化与分析现代化
        - 驱动
        - 中期（FY2025–2028）
        - 统一数据平台需求增加；Govini 的 National Security Knowledge Graph 与 PPBE 数据标准化目标一致
        - 审查 PPBE 改革执行时间表和 DoD 机构采用计划
      - - FY2026 NDAA：软件资金灵活性条款
        - 驱动
        - 近期（FY2026）
        - 允许 Procurement、RDT&E 和 O&M 资金在软件支出中互换使用；Govini 在不同拨款类型下的可触达预算池随之扩大
        - 跟踪 NDAA 落地；评估对 Govini 合同载体的影响
      - - C4I 系统预算：FY2026 为 $23.2B（FY2020 为 $10.2B）
        - 驱动
        - 当前
        - 6 年预算增加 127%，说明政府对指挥、控制和情报软件支出的承诺巨大且仍在增长
        - 核实 Govini 合同是否登记为符合 C4I 支出资格
      - - DoD 采购队伍惯性和对电子表格的依赖
        - 约束
        - 持续（结构性）
        - 传统 Excel 流程带来变革管理负担；即便合同授予后，也会拖慢全平台采用
        - 评估现有客户的上线周期和用户采用指标
      - - Palantir 10 年 $10B 陆军企业 ABMS/Foundry 合同
        - 约束
        - 持续（合同周期）
        - Palantir 已拿走一部分预算，竞争平台可争取的增量钱包变少；机构可能整合到 Palantir，而不是再加 Govini
        - 将 Govini 合同载体与 Palantir 陆军合同覆盖范围做重叠分析
      - - 持续决议和国防预算不确定性
        - 约束
        - 周期性（年度）
        - CR 要求的支出冻结会延后新合同授予和席位扩张，尤其影响非关键软件项目
        - 跟踪 Govini 管线中的 CR 暴露；评估来自合同和任务订单的收入占比
      - - 安全认证负担（ATO 维护、FedRAMP High）
        - 约束（也是护城河）
        - 持续（运营成本）
        - ATO 维护成本高，会压低利润率；但也抬高进入门槛。Govini 一旦拿到 ATO，净效应就是护城河
        - 核实既有军种授权的年度 ATO 续期成本和续期风险
      - - 国防工业基础供应链脆弱性（顺风）
