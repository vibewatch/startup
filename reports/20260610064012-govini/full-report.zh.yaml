      - number: '8.2'
        title: 公开可比公司给出宽区间，Govini 介于高溢价国防软件和脆弱 govtech 之间
        blocks:
          - type: paragraph
            body: >-
              可比公司集合更适合用来画区间，而不是套精确公式。Palantir 是上限质量类比：一家拥有联邦信誉、强劲商业增长和公开市场热情的任务软件公司。它 2026 年 6 月的估值倍数远高于 Govini
              当前私有市场估值所暗示的水平，说明当规模、盈利能力和耐久性清晰可见时，国防软件可以支撑极高倍数。FiscalNote 则是相反的警示案例。它的 2025 年文件和 2026 年 6
              月市值数据说明，当执行、资产负债表和需求质量走弱时，政府相邻软件的估值可以剧烈下修。C3.ai 和 BigBear.ai 展示了一个波动中间区：AI
              叙事和公开市场风险偏好可以大幅推动估值，却不意味着底层业务低风险。Tyler Technologies 是更稳的 govtech
              参照：成熟得多、防务属性更弱，市场按已验证的公开软件公司定价，而不是按叙事浓度很高的 AI 资产定价。放在这组公司中，Govini 隐含 13x ARR
              相比不透明或挣扎中的公司显得激进，但相比市场愿意奖励的真正耐久品类龙头，又显得保守。
