  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值按收入规模看合理，但尚未被耐久性数据充分去风险
        blocks:
          - type: paragraph
            body: >-
              核心估值事实很直接。Bain、CNBC 和 GovConWire 都支持 Govini 在 2025 年 10 月跨过 $100 million ARR，而 Bain
              的增长投资和更广泛媒体报道确认公司进入国防独角兽阵营。Sacra 给出了最可用的公开定价锚，估计隐含估值约 $1.3 billion。按披露的 ARR 分母计算，这意味着约 13x ARR
              倍数。绝对看并不便宜，但也并非不理性。一家公司如果在任务关键型国防细分领域高速增长，只要客户耐久性和扩张质量真实存在，就有可能拿到双位数收入倍数。问题在于，估值最需要支撑的地方，公开数据仍很稀疏。留存公开资料没有披露毛利率、自由现金流状况、NRR、GRR、流失或大客户敞口。因此，把这个估值解释为战略软件资产估值，比把它解释为经过严格承销的订阅经济性估值更容易。
