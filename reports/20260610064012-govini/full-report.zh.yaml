            body: >-
              公开资料支持一个可信的先落地、再扩张路径。Sacra 将 Govini 的模式描述为：随着机构把更多工作流数字化，公司靠新增席位和模块扩张；采购记录也从方向上支撑这一点：Army 合同持续到 2030
              年，交易记录显示授标后仍有修改，WHS 过桥合同明确称任务伙伴可以继续并扩大使用，SCRIPTS BPA 则让 DoD 和民事机构更低摩擦地接入 Ark 的 Supply Chain
              应用。这些都是有用的留存代理指标，但终究只是代理指标。留存资料没有披露客户数、续约率、NRR、GRR、流失、实施周期、NPS 或前 10
              大账户结构。因此，很难区分长期产品拉力和合同载体可用性。集中度风险也很实质。公开商业报道称 Govini
              面向联邦客户销售，而几乎所有留存客户证据都落在国防采购和工业基础任务里，意味着采购延迟、持续决议以及项目优先级变化，都可能影响新部署和续约。SCRIPTS
