        - from: d4
          to: d7
          label: 分发
        - from: d5
          to: d7
          label: 驱动工作流
        - from: d6
          to: d5
          label: 构建 / 维护
        - from: d6
          to: d7
          label: 销售 / 交付
    claimRefs:
