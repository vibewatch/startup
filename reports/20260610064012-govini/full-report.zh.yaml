      - number: '5.2'
        title: 产品栈看起来以数据为中心、以流程为中心，并通过安全网页门户交付
        blocks:
          - type: paragraph
            body: >-
              公开架构叙事有三层。第一层是数据基础：Govini 反复称 Ark 由集成政府和商业数据驱动；Govini 撰写的技术材料和 Naval Postgraduate School 研究还补充说，National
              Security Knowledge Graph 由正在申请专利的 Object Fusion 数据引擎驱动，持续摄取、标准化并融合新来源。第二层是应用层：每个 Ark
              模块呈现引导式流程和应用专用视图，而不只是原始表格。第三层是交付层：公开访问通过 Ark.ai 门户以及安全或认证声明来中介，而不是通过开放 API 或可下载客户端软件。这个组合是连贯的。它暗示 Govini
              正在打造一个安全、面向浏览器的企业产品，以专有数据融合为核心，上面叠加应用专用流程逻辑。隐藏起来的，是技术尽调会继续追问的几乎所有问题：云拓扑、

              数据刷新节奏、模型治理、集成方法、公共 API 可用性和可靠性仪表。上述缺口不会否定产品论点，但会限制外部读者判断底层平台相较其包装的流程体验有多差异化。
