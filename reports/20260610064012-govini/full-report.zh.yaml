      - number: '7.4'
        title: 缓释因素真实存在，但如果集中度或可靠性证据不及预期，投资逻辑应快速失效
        blocks:
          - type: paragraph
            body: >-
              Govini 确实有有意义的缓释因素。公司有具名客户证据、量化工作流结果、2025
              年底合同动能、似乎愿意扩大部署的赞助办公室，以及足以支撑敏感任务的安全资质。这些事实让风险章节更像是纪律化监控，而不是立即否决。不过，公开证据支持一套严格的否决标准。如果前几大账户集中度极高，如果续约依赖一两个赞助办公室，如果
              SCRIPTS 和其他载体无法转化为经常性使用，如果安全和 ATO 维护弱于公司所称，或者公司无法招聘并留住足够的产品、工程、数据和 GTM
              人才，那么下行会迅速传导到增长和估值。因此，正确的尽调立场应是有条件的。只有当私有材料证明最强的公开信号——任务关键性、客户扩张和安全就绪——能够转化为耐久续约、可接受集中度和执行能力时，Govini 才可投资。
