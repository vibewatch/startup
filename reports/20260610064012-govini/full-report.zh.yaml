      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              Govini 市场最强的增长驱动因素是联邦政策：白宫在 2025 年 4 月发布的行政令明确要求改革国防采办，强调速度、创新和商业软件使用。这形成自上而下的政策要求，把 Govini
              的价值主张从「锦上添花」变成「行政令要求」。与此同时，DoD 的强制性 Software Acquisition Pathway（SWP）指令——由 Hegseth 部长在 2025 年 3
              月发布——要求所有软件开发采购使用 SWP，并优先选择商业软件供应商而不是自建系统。自 2024 年以来推进的 PPBE 改革，正在 DoD 内标准化数据分析工具，并制造对统一平台的需求。

              主要采用约束是机构惯性：DoD 国防采办人员长期依赖电子表格管理、遗留 ERP 系统和孤立数据源。转向 Ark
              这样的平台，需要变更管理、培训和流程再造。第二个约束是采购周期风险：即便有政策要求，软件支出仍可能被持续决议、预算封存或项目重组推迟。第三个约束是 Palantir 的既有位置：Palantir 为
              Foundry 和 AIP marketplace 拿到的 10 年、$10B 陆军企业级交易，在陆军分析预算的部分区域形成竞争天花板。

              转换成本分析有利于 Govini 留住现有客户：Ark 的 FedRAMP High IL5 授权、与涉密和 CUI 数据系统的集成，以及多年期 ATO 维护，为已经部署 Govini
              的机构形成高转换成本。不过，对尚未采用 Govini 的机构而言，从既有手工流程转向新的 SaaS 平台本身也构成初始采用摩擦。净效果是高留存但新增获客速度中等——这与 Govini 的
              land-and-expand 商业模式一致。
