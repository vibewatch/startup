      - number: '4.4'
        title: 财务结论：高质量增长信号，但承销文件不完整
        blocks:
          - type: paragraph
            body: >-
              最有支撑的财务结论是：增长质量正面，但经营质量信息不完整。Govini
              具备国防软件资产中投资者希望看到的几项特征：三位数增长、订阅导向产品、能缩短未来采购周期的大型合同工具，以及足以加速产品和招聘的资本。本章的谨慎点在于，ARR
              以下几乎所有经典承销指标仍是私有信息。公开证据没有揭示增长是否集中在少数项目中、软件旁边叠加了多少服务内容、安全和涉密人员成本之后的毛利率是什么样、公司把预订转化为现金的速度有多快。外部预算来源又增加一层谨慎：持续决议和缓慢采办流程经常推迟授标，并推高整个国防体系成本。简单说，Govini
              看起来更像真实规模化软件平台，而不是早期的

              实验性国防创业公司；但投资者仍需要管理层数据包，才能有把握判断利润率路径、续约耐久性和融资自给能力。
