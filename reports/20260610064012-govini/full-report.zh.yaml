      - number: '1.4'
        title: 里程碑、规模与负面事件
        blocks:
          - type: paragraph
            body: >
              Govini 从 2011 年创业公司发展为 2025 年国防软件独角兽，路径依次经历产品开发、早期政府采用、平台扩展和企业级部署。公司里程碑包括 Eric Gillespie 于 2011 年创立公司、2013
              年早期融资、2015 年 Series C，以及在 2022–2023 年开始实现企业级大规模采用之前的长期孵化。近期最关键的里程碑包括 2025 年获得美国陆军、海军和 Space Force
              授予的运行授权（ATO）；美国陆军合同司令部授予的五年期 IDIQ 合同；Washington Headquarters Services 授予的 DoW 范围桥接合同；以及 $919M 供应链风险照明合同。

              截至 2026 年，公司员工数约 305–327 人，反映 Bain Capital 投资带来的团队扩张，以及企业级政府部署的规模化需求。办公室位于弗吉尼亚州阿灵顿（总部）和宾夕法尼亚州匹兹堡。匹兹堡办公室设在
              Union Station 附近的 Federated Tower，处在毗邻多所主要大学的技术枢纽中。

              公开记录未发现直接点名 Govini 的重大诉讼、监管执法、数据泄露或公共争议。2025 年，一份美国陆军 CTO 备忘录称竞争对手 Anduril-Palantir NGC2 平台因安全漏洞呈现「very
              high risk」，国防软件行业因此遭遇负面舆论；这与 Govini 从多个军种获得 ATO 的记录形成对比。Govini 未遭遇类似安全批评，并把重纪律、轻演示的做法定位为差异化安全姿态。
