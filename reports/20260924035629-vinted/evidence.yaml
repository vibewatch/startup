      If Vinted is designated a VLOP (>45M EU users), it faces enhanced transparency, audit, and algorithmic
      accountability requirements that could impose compliance costs and product constraints.
    diligencePath: Check DSA Transparency Database for Vinted reporting; request compliance officer briefing on DSA readiness.
