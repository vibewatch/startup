    missingEvidence: >-
      No publicly available third-party panel data independently corroborates the exact 90% EU C2C market share figure;
      the claim originates from Sacra and is not verified by market regulators or audited research firms.
    whyItMatters: Overstated market dominance could mask vulnerability to local challengers.
    diligencePath: Request Nielsen, Kantar, or Similarweb panel data segmented by European market and C2C fashion transaction volume.
    relatedQuestionRefs:
      - QP009
