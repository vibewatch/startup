      Eastern Europe. Offline secondhand (charity shops, flea markets) vs online split not quantified by country.
    whyItMatters: Required to assess true competitive position and organic growth potential by market.
    diligencePath: Monitor SimilarWeb traffic data; request internal GMV by market and segment from data room.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: minor
    topic: EU regulatory cost quantification (QM016, QM018) and Vinted Go logistics impact (QM019)
    missingEvidence: >-
      No public quantification of Vinted's CSRD, DAC7, or GDPR compliance costs. No independent data on Vinted Go's
      contribution to conversion rate vs. third-party logistics. EU regulatory impact asymmetry (scale players vs.
      entrants) not empirically measured.
    whyItMatters: Regulatory cost structure affects margin and competitive moat analysis.
    diligencePath: Request compliance cost breakdown from Vinted data room; review Vinted Go logistics take-rate economics.
    relatedQuestionRefs: []
  - type: missing-source
    severity: minor
    topic: TAM extension from electronics and non-fashion verticals (QM020) and adoption journey drop-off data (QM024)
    missingEvidence: >-
      No public data on Vinted's electronics GMV or buyer journey conversion rates by funnel stage. Industry benchmarks
      for C2C marketplace conversion exist but are not specific to Vinted's geography/demographics.
    whyItMatters: Electronics TAM extension and funnel conversion improvement are potential upside levers.
    diligencePath: Request conversion funnel data by category and cohort from Vinted data room.
    relatedQuestionRefs: []
