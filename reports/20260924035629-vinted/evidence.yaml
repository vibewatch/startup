    diligencePath: Review Naver's investor communications and Poshmark's international product roadmap announcements.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: Per-stream revenue breakdown (shipping, promoted listings, Vinted Pay)
    missingEvidence: >-
      Vinted does not disclose revenue by business line; the split between buyer protection fees, Vinted Go shipping
      margins, promoted listings, and Vinted Pay is not independently verifiable beyond >50% buyer protection fee
      attribution.
    whyItMatters: >-
      Revenue quality and growth sustainability depend on whether the >50% buyer protection fee share is stable or
