    diligencePath: Request audited segmental revenue disclosure or internal management accounts as part of any investment process.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: Vinted cash position and balance sheet
    missingEvidence: >-
      Vinted's group-level cash, cash equivalents, and total assets are not disclosed in any public filing; only the
      Lithuanian standalone entity (Vinted UAB) files public accounts with limited balance sheet data.
    whyItMatters: >-
      Without a visible cash position, runway cannot be independently assessed; FCF alone does not confirm liquidity
      adequacy against potential obligations.
    diligencePath: Obtain audited consolidated financial statements from Vinted Group UAB and its Luxembourg holding company.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: minor
    topic: CAC, LTV, payback period by market cohort
    missingEvidence: >-
      No unit-level economics (CAC, LTV, CAC payback) are disclosed. TV advertising as the acquisition channel in new
      markets suggests high absolute CAC in early-stage markets.
    whyItMatters: >-
      If CAC is high and payback periods exceed 18 months in new markets, the profitability of expansion into Croatia,
      Greece, Ireland, Latvia, Estonia, and Slovenia may be structurally poor for several years.
    diligencePath: >-
      Request cohort-level acquisition data by country and channel; estimate payback from average order value × take
      rate × buying frequency.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: minor
    topic: Country-level revenue and GMV breakdown
    missingEvidence: >-
      No geographic revenue segmentation is publicly available; Vinted does not disclose per-country GMV, revenue, or
      user economics.
