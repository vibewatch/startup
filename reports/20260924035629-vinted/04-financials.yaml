    - '>€550M (est. >50% of €1.1B)'
    - High – transactional, non-discretionary, 100% attachment
    - Confirm exact fee schedules by market; assess trend vs GMV growth
  - - Vinted Go Shipping Margins
    - Bulk carrier rate negotiation; pass partial savings to users; retain shipping margin per label
    - ~€200–250M (est., growing)
    - Medium – volume-driven but carrier cost fluctuations create margin risk
