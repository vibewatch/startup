  - - Net Margin
    - 5.6% (2025), 9.4% (2024)
    - Medium – derived from disclosed figures
    - Declining net margin while FCF grows suggests non-cash charges; investigate nature of adjustments
    - Reconcile net profit to operating cash flow
  - - CAC (new markets)
    - €10–30+ per active user (industry benchmark)
    - Low – not disclosed
    - High CAC in new markets reduces IRR on expansion; TV advertising CAC may be >€30
    - Request country-level CAC and payback period data
  - - FCF / Revenue
    - '12.5% (2025: €137M / €1.1B)'
    - Medium – FCF disclosed by company
    - Positive FCF despite profit decline shows real cash generation; key capital adequacy signal
    - Request FCF bridge from EBITDA (capex, working capital, M&A)
