  - - Promoted Listings
    - Seller-paid item visibility boost; wardrobe spotlight and bump features
    - ~€150–200M (est.)
    - High – high-margin digital ad product with no variable COGS at scale
    - Confirm seller adoption rate, ARPU from promotions, market mix
  - - Vinted Pay Margins
    - EMI-licensed payment service; retains margin on transactions processed in-platform
    - ~€70–100M (est., early stage)
    - Medium – growing but regulatory capital requirement constrains leverage
    - Confirm EMI capital adequacy requirements, take rate on Vinted Pay
  - - Cross-Border / International Fees
    - Additional service charges for cross-border transactions and premium buyer services
    - ~€30–50M (est., minor)
    - Low – nascent, dependent on cross-border adoption rate
    - Confirm presence and fee levels across 26+ markets
