  - Diligence Ask
  rows:
  - - Effective Take Rate (GMV)
    - '~10.2% (2025: €1.1B / €10.8B)'
    - Medium – derived from disclosed figures
    - Higher take rate than eBay (10%) or Depop (~11% incl. fees) — validates buyer-pays model
    - Request GMV and revenue by stream to decompose take rate components
  - - Gross Margin (est.)
    - 70–85% (marketplace benchmark)
    - Low – undisclosed
