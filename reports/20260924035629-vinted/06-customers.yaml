- id: TU003
  title: Named customer proof table
  description: Evidence of adoption by distinct Vinted user segments, with deployment context, measured outcomes, and limitations.
  enumerationCoverage: exhaustive
  enumerationScope:
    coverage: exhaustive
    basis: Three primary user archetypes documented via consumer surveys, market research, and media reporting; no named corporate customer deployments (C2C marketplace).
  notes: As a C2C marketplace, 'named customers' are user archetypes with documented outcomes rather than named enterprises. minSourcesPerEnumerationRow enforced.
  claimRefs:
  - CU004
  - CU006
  - CU008
  - CU009
  columns:
  - Customer / Segment
  - Segment
  - Deployment / Use Case
  - Production vs. Pilot
  - Outcome
  - Limitation
  rows:
  - - Casual fashion seller (European women, 25–34)
    - Individual seller
    - Listing wardrobe surplus on Vinted; receiving buyer protection fee-funded transactions
    - Production – tens of millions of users
    - Zero seller fee vs. eBay/Depop; preferential routing of transactions; high supply loyalty
    - Seller retention drops if platform experience fails; power sellers may leave for tax reasons (DAC7)
  - - Budget-conscious family buyers (parents with children)
    - Individual buyer
    - Purchasing children's clothing at <£20 AOV; sustainable wardrobe management
    - Production – children's items ~1/3 of all listings
    - 84% rate quality as good as new; 73% prefer PUDO delivery aligned with Vinted Go model
    - Low AOV creates high transaction-cost sensitivity; support failures damage loyalty permanently
  - - Sustainability-motivated Millennial buyers
    - Individual buyer
    - Primary secondhand fashion platform; wardrobe building from secondhand-first principle
    - Production – 65% cite Vinted as primary secondhand platform; 65% have >25% secondhand wardrobe
    - 65% buy fewer, more durable items; strong brand alignment with 'New Again' campaign
    - Sustainability motivation may ebb if economic pressures ease; trend dependency risk
figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  description: 'End-to-end journey of a typical Vinted casual seller across five stages: awareness, first listing, first sale, repeat use, and loyalty expansion.'
  sourceRefs:
  - SU001
  - SU004
  - SU021
  claimRefs: []
  notes: Journey mapped for the modal user archetype (casual European individual seller, female, 25–34). Touchpoints and emotions are inferred from consumer surveys and user reports.
  data:
    items:
    - id: awareness
      label: Awareness
      description: Hears about Vinted via friend referral or social media; downloads app; sees zero-seller-fee value proposition
    - id: first-listing
      label: First Listing
      description: Takes photos; AI-assisted categorisation; sets price; item indexed in Vespa in ~5 seconds and searchable immediately
    - id: first-sale
      label: First Sale
      description: Receives offer or buy-now; selects Vinted Go carrier; drops off at PUDO point; buyer protection fee paid by buyer
    - id: repeat-use
      label: Repeat Use
      description: Positive experience drives repeat listings; starts buying secondhand items from other sellers; dual role emerges
    - id: loyalty-expansion
      label: Loyalty & Expansion
      description: Recommends Vinted to friends; becomes word-of-mouth acquisition channel; may upgrade to Wardrobe Spotlight for visibility
    - id: cross-category
      label: Cross-category Adoption
      description: Users expand from fashion into electronics, books, and home items as category breadth increases
