sections:
- id: SE_SEC001
  title: Product Scope, Differentiation, and Roadmap
  body: 'Vinted''s core product is a C2C fashion and secondhand goods marketplace across 26+ European markets. The buyer-facing product includes mobile-first apps (iOS/Android), a web interface, and embedded Vinted Go shipping label generation with carrier tracking. The seller-facing product enables free item listing with AI-powered categorisation, promoted listing tools (Wardrobe Spotlight, item bump), and integrated payments via Vinted Pay.


    Product differentiation rests on three pillars: (1) zero seller fees creating superior economics for sellers versus rivals; (2) ML-powered search and recommendation (Vespa + two-tower model) producing higher relevance at scale; and (3) Vinted Go logistics integrated into the transaction flow, eliminating the need for sellers to arrange separate shipping. These pillars collectively reduce friction at every step of the C2C transaction loop.


    In 2024, Vinted expanded into electronics — a meaningful category move signalling ambition to become a broader secondhand marketplace rather than fashion-only. Plans for books, toys, and video games in 2025 extend this trajectory. Luxury authentication capabilities are expanding to serve demand in authenticated pre-loved luxury fashion. The ''New Again'' brand campaign (2025) is Vinted''s first major global brand investment, designed to broaden the platform''s appeal beyond its fashion-first origins. US market entry is the most significant strategic product challenge of 2026, requiring adaptation of sizing conventions, building brand awareness from zero, and competing with established Poshmark and eBay incumbents.

    '
  claimRefs: []
  callouts:
  - type: insight
    title: Category Expansion Is a Revenue Optionality Lever
    body: Electronics, books, and toys offer incremental GMV without cannibalising fashion; each new category extends the average seller monetisation window and increases buyer visit frequency.
    tone: positive
  - type: risk
    title: US Expansion Is a High-Risk, High-Reward Bet
    body: US C2C resale is dominated by Poshmark and eBay; Vinted's EU brand has no recognition in the US; product adaptation (sizing, payment rails, trust mechanics) adds execution complexity.
    tone: risk
  tableRefs:
  - TE001
  - TE002
  figureRefs: []
- id: SE_SEC002
  title: Core Technology Stack and Scalability
  body: 'Vinted''s technology stack is among the most advanced of any European C2C marketplace. The search infrastructure was migrated from Elasticsearch to **Vespa** in 2023–2024, enabling the platform to handle one billion searchable items with integrated vector search and ML inference. Post-migration performance gains were substantial: 2.5x search latency improvement, 3x indexing latency improvement, and search visibility delay compressed from five minutes to five seconds. Vespa''s architecture enables tight integration of lexical and neural search — critical for multilingual queries across 26 markets.


    The recommendation system is powered by a **two-tower neural network** (query tower + item tower), encoding both user searches and item features into a shared 256-dimensional vector space using multilingual CLIP embeddings. Approximate Nearest Neighbor (ANN) search retrieves top candidates in under 100ms from a billion-item corpus. This architecture, combined with LightGBM learning-to-rank (LTR) for final ranking, delivers superior search relevance compared to rivals using simpler keyword-based or standard collaborative-filtering systems.


    The database layer uses **Vitess** for MySQL sharding, handling over 1.3 million queries per second. Container orchestration uses **Kubernetes with GitOps**, presented at Cloud Native Lithuania 2023. The company operates in-house **data centers in Vilnius** with a custom Clos network topology, prioritising cost efficiency at scale over hyperscaler convenience. The event-driven microservices architecture (transitioned from a monolith) supports independent team deployment and fault isolation.

    '
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  callouts:
  - type: strength
    title: Vespa + Two-Tower ML Is a Durable Search Advantage
    body: No C2C fashion rival has published comparable ML-for-search capabilities; Depop and Wallapop use conventional Elasticsearch-based or third-party search, creating a multi-year technical moat in search relevance.
    tone: positive
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: SE_SEC003
  title: Tech Debt, Security, and Compliance Evidence
  body: 'Vinted''s migration from a monolithic architecture to event-driven microservices (domain-driven design) is substantially complete based on engineering blog disclosures, reducing systematic tech debt in the core backend. However, the GDPR compliance record introduces material concerns about governance processes that intersect with product and data engineering.


    The July 2024 **Lithuanian DPA fine of €2,385,276** is the most significant adverse product/compliance event in Vinted''s history. Three violations were cited: (1) shadow banning users without a lawful data processing basis; (2) unlawfully requiring users to specify a legal ground for erasure requests; and (3) inadequate transparency to users about data processing. Lithuanian courts upheld these findings in 2025, and in January 2026, the Supreme Administrative Court referred GDPR interpretation questions to the CJEU, extending legal uncertainty.


    Importantly, no security breach (hacking, data leak) has been publicly documented. The GDPR violations are procedural — they relate to trust-and-safety system design (shadow banning) and rights-management workflows, not data exfiltration. However, the systematic nature of the violations — affecting users across France, Poland, and Lithuania — suggests that the compliance controls around personal data processing in trust-and-safety systems were inadequate at the time, representing an engineering governance gap. No ISO 27001 or SOC 2 certification for Vinted is publicly disclosed.

    '
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  callouts:
  - type: risk
    title: CJEU Referral Creates Unresolved Regulatory Risk
    body: With the CJEU referral ongoing as of January 2026, Vinted faces continued legal uncertainty. If the CJEU ruling expands the interpretation of GDPR obligations for platforms, additional compliance costs and product design changes may follow.
    tone: adverse
  tableRefs: []
- id: SE_SEC004
  title: Developer Culture, Talent, and Team Quality
  body: 'Vinted''s engineering organisation is centred in Vilnius and Kaunas, Lithuania — a deliberate bet on Baltic tech talent that has proven effective. The company employs 2,200+ people overall, with a large proportion in engineering and product. Vinted''s engineering blog publishes detailed technical content on Vespa search, ML models, SRE practices, and infrastructure, indicating a high-transparency engineering culture comfortable with knowledge sharing.


    The company''s presentation at Cloud Native Lithuania (June 2023) — covering Kubernetes/GitOps infrastructure and data center network evolution — demonstrates active participation in the broader engineering community. This is a positive signal: companies that contribute publicly to technical communities typically have higher internal engineering standards, attract better talent, and retain engineers longer (since external recognition amplifies career value).


    The Vilnius and Kaunas talent pools are growing; COO Mantas Mikuckas co-funded the €100M Tech Zity campus project, Europe''s planned largest tech hub, signalling long-term institutional commitment to building local engineering talent. Vinted''s ability to hire for specialist ML, infrastructure, and payments roles at scale — without London/Berlin/Paris relocation premiums — gives a structural cost advantage in engineering relative to Western European tech companies.

    '
  claimRefs: []
  callouts:
  - type: strength
    title: Baltic Engineering Talent as a Structural Cost Advantage
    body: Building a 1,000+ engineer team in Vilnius and Kaunas at significantly lower all-in compensation than London, Berlin, or Amsterdam peers creates a durable cost structure advantage — particularly valuable for compute-intensive ML workloads.
    tone: positive
- id: SE_SEC005
  title: Product Diligence Gaps and Open Questions
  body: 'Several product and technology questions remain open for a complete diligence assessment. First, **DSA compliance**: Vinted likely qualifies as a large online platform under the EU Digital Services Act given its 100M+ EU user base. Whether it has been designated a Very Large Online Platform (VLOP) — triggering the most onerous DSA obligations — and what its compliance readiness is, is not publicly documented. Second, **trust and safety at scale**: as Vinted expands into electronics (a higher-fraud category than fashion) and the US, the robustness of its fraud detection, item verification, and seller vetting systems becomes more critical. No transparency report or audit result is publicly available. Third, **security certification**: no ISO 27001 or SOC 2 Type II report has been publicly disclosed, which is a gap for any institutional investor doing cyber due diligence. Fourth, **cloud versus self-hosted mix**: the data center strategy is partially opaque; the extent to which any
    production workloads depend on hyperscaler cloud services is unknown.


    The CJEU referral creates a multi-year legal overhang: if the CJEU rules that Vinted''s GDPR obligations are broader than the DPA''s initial interpretation, the company may face retrospective penalties and mandated product changes in its trust-and-safety stack. Investors should ensure that legal counsel tracks the CJEU referral closely, as it could set a precedent for all European C2C platforms operating trust-and-safety algorithms.

    '
  claimRefs:
  - CE012
  callouts:
  - type: risk
    title: Electronics and US Expansion Increase Trust-and-Safety Surface Area
    body: Fashion is a lower-complexity trust environment than electronics. The expansion into electronics without a publicly documented fraud detection upgrade plan is a product diligence gap.
    tone: warning
tables:
- id: TE001
  title: Product module / asset matrix
  description: Vinted's core product modules and proprietary assets, assessed for maturity, user segment, differentiation, and key diligence question.
  enumerationCoverage: exhaustive
  enumerationScope:
    coverage: exhaustive
    basis: Covers all six publicly disclosed Vinted product modules; no additional modules were identified from company, engineering blog, or analyst research.
  notes: Maturity ratings based on company disclosures and engineering blog depth. 'Early' = recently launched or limited market rollout.
  claimRefs:
  - CE001
  - CE004
  columns:
  - Module / Asset
  - Primary User
  - Status / Maturity
  - Differentiation
  - Key Diligence Gap
  rows:
  - - Vinted Marketplace (fashion)
    - Buyers and sellers, all ages, EU/UK
    - Mature – 26+ markets, 100M+ users
    - Zero seller fees, ML search, network effects
    - Germany growth deceleration (not publicly disclosed)
  - - Vinted Go (logistics)
    - Sellers (shipping labels); buyers (delivery)
    - Growing – 500K+ PUDOs, expanding to Spain/Portugal
    - Proprietary carrier network; no rival has equivalent EU coverage
    - Unit economics of PUDO deployment by market not disclosed
  - - Vinted Pay (payments)
    - Buyers (payment) and sellers (payouts)
    - Early–Mid – EU rollout in progress
    - EMI licensed; internalises payment margin
    - Regulatory capital adequacy for EMI license not disclosed
  - - Electronics Category
    - Tech-savvy buyers and sellers
    - Early – launched 2024
    - Extends platform TAM beyond fashion
    - Fraud and misrepresentation controls for electronics not documented
  - - Luxury Authentication
    - Luxury fashion buyers seeking authenticated items
    - Early – expanding in 2025–2026
    - Builds trust for high-AOV transactions
    - Authentication capacity, error rate, and third-party auditor not disclosed
  - - Vinted Ventures (CVC)
    - Startup ecosystem; strategic investments
    - Very early – launched April 2025
    - Strategic optionality; tracks complementary technology
    - Investment thesis and portfolio not publicly disclosed
- id: TE002
  title: Workflow / use-case table
  description: Key user workflows on Vinted and how the platform improves them compared to the status quo.
  enumerationCoverage: exhaustive
  enumerationScope:
    coverage: exhaustive
    basis: Covers the four primary job-to-be-done user workflows on the platform; no additional core workflows were identified.
  notes: Measurable benefits are where publicly disclosed; otherwise estimated from user research and platform benchmarks.
  claimRefs:
  - CE002
  - CE004
  columns:
  - User Job
  - Prior / Status-Quo Workflow
  - Vinted Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Sell secondhand clothing
    - List on Facebook Marketplace; pay eBay ~12% fee; arrange own postage
    - List for free; embedded Vinted Go label; buyer pays protection fee
    - Zero seller cost; 5-second listing search visibility vs 5 minutes pre-migration
    - No auction format; fixed price only for most items
  - - Find specific secondhand item
    - Manual keyword search on eBay; poor relevance in fashion
    - Vespa ML two-tower search; ANN retrieval <100ms; personalised results
    - 2.5x search latency improvement; better recall for image/multilingual queries
    - No image search yet confirmed in production at scale
  - - Ship purchased item securely
    - Seller ships independently; buyer risk of non-delivery
    - Vinted Go label pre-generated; tracked delivery via 60+ carriers; buyer protection
    - 500K+ PUDO points; buyers protected by mandatory protection fee
    - Spain/Portugal Vinted Go launched only in 2025; not all markets covered
  - - Pay and receive funds securely
    - Bank transfer or PayPal with fraud risk
    - Vinted Pay (EMI licensed); funds held in escrow until delivery confirmed
    - Regulated payment institution; disputes resolved by Vinted
    - EMI rollout still in progress across all EU markets
- id: TE003
  title: Technology / operating architecture table
  description: Layer-by-layer breakdown of Vinted's technology and operating architecture, with role, dependency, and risk assessment.
  enumerationCoverage: exhaustive
  enumerationScope:
    coverage: exhaustive
    basis: Based on Vinted engineering blog publications and CNCF community presentations; no undisclosed layers can be confirmed.
  notes: 'Risk ratings: High = could impair core operations if it fails; Medium = significant degradation; Low = partial degradation only.'
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE007
  columns:
  - Layer / Component
  - Role
  - Key Dependency
  - Risk
  rows:
  - - Vespa Search Engine
    - Item search, recommendation retrieval, ML inference at query time
    - Vinted engineering team + Vespa open-source community
    - Medium – Vespa is mature OSS; Vinted's customisation layer is a key-person risk
  - - Two-Tower ML Model
    - Dense retrieval for personalised search; CLIP-based multilingual embedding
    - PyTorch, CLIP pre-training, internal ML team for retraining
    - Medium – model staleness if retraining cadence is disrupted; team concentration risk
  - - Vitess / MySQL
    - Relational database sharding for 1.3M queries/second
    - Vitess open-source; in-house DBA team
    - High – core transactional database; any sharding error cascades to all transactions
  - - Kubernetes / GitOps
    - Container orchestration for microservices; deployment pipeline
    - In-house platform engineering team; Kubernetes upstream
    - Low – Kubernetes is commodity infrastructure; GitOps reduces human error
  - - In-house Vilnius Data Centers
    - Compute and storage for all production workloads; custom Clos network
    - Real estate and power in Vilnius; hardware vendors
    - Medium – geographic concentration risk; no disclosed failover region
  - - Vinted Go Carrier Network
    - Label generation, carrier API integrations, PUDO point mapping
    - 60+ carrier APIs; Homerr acquisition for NL logistics
    - Medium – carrier failure or contract dispute disrupts shipping in affected market
  - - Vinted Pay EMI
    - Buyer escrow, seller payout, dispute resolution
    - Lithuanian National Bank EMI license; payment scheme rules
    - Low – EMI license is active; regulatory withdrawal risk is low but not zero
figures:
- id: FE001
  title: Product architecture map
  type: stack
  description: Layered architecture of the Vinted product stack, from user interface through application logic, ML infrastructure, data, and infrastructure layers.
  sourceRefs:
  - SE001
  - SE002
  - SE006
  - SE007
  - SE019
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE007
  notes: 'Layer ordering: top = user-facing; bottom = infrastructure. Internal architecture not fully public; based on engineering blog and community presentation disclosures.'
  data:
    layers:
    - id: user-interface
      label: User Interface Layer
      detail: iOS/Android apps, web PWA; mobile-first design; buy/sell flows, messaging, Vinted Go label generation
    - id: product-services
      label: Product & Services Layer
      detail: Marketplace service, Vinted Go logistics APIs, Vinted Pay payment service, Promoted Listings service
    - id: search-ml
      label: Search & ML Layer
      detail: Vespa search engine; two-tower neural network (dense retrieval); LightGBM LTR; multilingual CLIP embeddings; ANN <100ms
    - id: data-platform
      label: Data & Analytics Layer
      detail: Event streaming (domain-driven microservices); analytics pipelines; ML training data; user behaviour signals
    - id: infrastructure
      label: Infrastructure Layer
      detail: In-house Vilnius data centers; custom Clos network; Kubernetes/GitOps orchestration; Vitess MySQL sharding (1.3M QPS)
    - id: trust-safety
      label: Trust & Safety Layer
      detail: Buyer protection, dispute handling, moderation, and anti-fraud controls that preserve marketplace trust.
