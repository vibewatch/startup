      - number: '1.3'
        title: 商业模式、财务表现与战略定位
        blocks:
          - type: paragraph
            body: >
              Vinted 最核心的差异化优势在于零卖家费模式，搭配每笔交易强制收取的买家保障费（约占商品售价 5% 加固定
              €0.70–€0.90，因市场而异）。该费用涵盖资金托管结算、客户支持与纠纷裁决。公司向买家而非卖家收费，从而最大化释放了供给端潜能，运转起支撑其行业地位的网络效应飞轮。其余变现来源包括运费差价（买家按
              Vinted 谈判的协议大客户价购买预付费运单）、可选的商品置顶推广（Bump）、衣橱聚光灯（Wardrobe Spotlight）订阅费以及 Vinted Pay
              支付处理利润。买家保障费贡献了过半总营收；运费差价为第二大收入来源。财务表现极为亮眼：在 2022 年录得 €20.4M 净亏损后，公司于 2023 年首度扭亏为盈，营收达 €596.3M（同比
              +61%），净利润 €17.8M。2024 年营收达 €813.4M（+36%），净利润达 €76.7M（+330%），调整后 EBITDA 为 €158.9M。2024 年全职员工平均为 2,200
              人（+19%），业务遍及 26+ 个市场。2025 年 GMV 达 €10.8bn（+47%），营收达 €1.1bn（+38%）；但因公司大力投入德国市场、新类目与物流基建，净利润下滑 19% 至
              €62M。战略布局上，Vinted 持续开展增厚型并购：包括 United Wardrobe（荷兰，2020 年）、Chicfy（西班牙，2019 年）、Rebelle（德国奢侈品电商，2022 年，后于
              2024 年 3 月完全并入 Vinted）、Homerr（荷兰物流，2023 年）与 Trendsales（丹麦，2024 年初）。公司当前面临严密监管：2024 年 7
              月，立陶宛个人数据保护局（DPA）因其在删除权执行与隐形屏蔽（shadow-banning）上违反 GDPR，开出 €2,385,276 罚单。Vinted
              已提起上诉。在波兰、意大利与法国，相关诉讼亦在审理之中。
