          description: 美国社交时尚平台；Naver旗下；欧洲基本无布局
  - id: FI001
    title: 商业与营收变现拆解桥
    type: waterfall
    description: 瀑布图展示 Vinted 在 2025 年如何依托买家保护费模式，将 €10.8B GMV 转化为 €1.1B 营收，并叠加辅助收入流。
    sourceRefs:
      - SI001
      - SI019
      - SI020
      - SI021
    claimRefs:
      - CI002
      - CI009
      - CI010
      - CI011
      - CI012
    notes: 各收入流贡献比例为估算值；买家保护费贡献超50%为公司官方披露。其余收入流根据分析师研报及行业对标推导得出。
    data:
      items:
        - label: GMV（€10.8B）
          value: 10800
          description: 2025年Vinted平台撮合的商品交易总额
        - label: 未变现GMV
          value: -9700
          description: 未变现的GMV部分（货款全额归卖家所有）；Vinted仅抽取服务费层
        - label: 买家保护费
          value: 550
          description: 预计占总营收 50% 以上；每笔交易向买家收取约 5% + €0.70
        - label: Vinted Go物流差价留存
          value: 230
          description: 扣除对接承运商成本后留存的运费差价收益预估
        - label: 卖家付费推广（橱窗打顶/曝光）
          value: 180
          description: 卖家付费购买的高毛利流量曝光产品
        - label: Vinted Pay及其他收入
          value: 140
          description: 支付服务手续费利润及其他新兴业务线收入
  - id: FE001
    title: 产品技术架构拓扑图
    type: stack
    description: Vinted技术栈分层架构图，涵盖前端用户界面、业务逻辑、机器学习底座、数据体系以及底层基础设施。
    sourceRefs:
      - SE001
      - SE002
      - SE006
      - SE007
      - SE019
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
    notes: 分层由上至下：顶部面向用户端，底部为底层基建。内部架构细节未完全公开，基于工程博客及技术分享公开披露整理。
    data:
      layers:
        - id: user-interface
          label: 用户交互层
          detail: iOS/Android客户端、Web PWA；移动优先设计；买卖交易流、站内信、Vinted Go面单生成
        - id: product-services
          label: 业务与服务层
          detail: 交易市场服务、Vinted Go物流API、Vinted Pay支付服务、付费推广服务
        - id: search-ml
          label: 搜索与机器学习层
          detail: Vespa搜索引擎；双塔神经网络（稠密检索）；LightGBM排序模型（LTR）；多语言CLIP向量嵌入；近似最近邻搜索（ANN）时延低于100毫秒
        - id: data-platform
          label: 数据与分析层
          detail: 事件流体系（领域驱动微服务）；数据分析流水线；模型训练数据集；用户行为特征信号
        - id: infrastructure
          label: 底层基础设施层
          detail: 维尔纽斯自建数据中心；自研Clos网络架构；Kubernetes/GitOps容器编排；Vitess MySQL分库分表（峰值130万QPS）
        - id: trust-safety
          label: 信任与风控安全层
          detail: 买家保护机制、纠纷仲裁、内容审核与反欺诈风控，筑牢平台信任根基。
  - id: FU001
    title: 用户全生命周期旅程图
    type: journey-map
    description: 典型Vinted个人长尾卖家跨越认知、首次上架、首单成交、高频复用及忠诚裂变五个阶段的全流程旅程图。
    sourceRefs:
      - SU001
      - SU004
      - SU021
    claimRefs: []
    notes: 旅程基于最具代表性的用户画像绘制（欧洲个人长尾卖家，女性，25–34岁）。触点与情绪体验基于消费者调研与用户反馈推导。
    data:
      items:
        - id: awareness
          label: 平台认知
          description: 经朋友推荐或社交媒体知晓Vinted；下载App；被“卖家零佣金”的核心价值主张吸引
        - id: first-listing
          label: 首次挂牌
          description: 拍照上传；AI辅助自动分类；自主定价；商品约5秒内被Vespa索引并立即可搜
        - id: first-sale
          label: 首单成交
          description: 收到买家出价或一口价购买；选择Vinted Go合作承运商；送到PUDO自提/代收点寄件；买家全额承担买家保护费
        - id: repeat-use
          label: 持续复用
          description: 顺畅体验促使持续挂牌；开始在平台购买其他卖家闲置；形成“买卖一体”的双重身份
        - id: loyalty-expansion
          label: 忠诚裂变
          description: 向好友推荐Vinted；成为口碑传播的获客渠道；尝试购买衣橱聚焦（Wardrobe Spotlight）等付费曝光产品
        - id: cross-category
          label: 跨品类渗透
          description: 平台品类拓展后，用户从二手服装扩展至消费电子、图书及家居用品
  - id: FR001
    title: 核心风险热力图
    type: matrix
    description: Vinted核心风险热力图，覆盖四大风险领域，按发生概率与冲击程度（高/中/低）进行评级。
    sourceRefs:
      - SR001
      - SR004
      - SR007
      - SR010
      - SR016
      - SR023
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR010
    notes: 评级基于调研证据的定性评估。高 = 实质性冲击（影响营收10%以上或遭遇重大监管处罚）；中 = 中度冲击；低 = 影响有限。
    data:
      columns:
        - 监管与法律合规
        - 行业竞争
        - 运营与技术
        - 人才与执行
        - 宏观与资本市场
        - 品牌与用户信任
      rows:
        - id: high-impact
          label: 高冲击
          values:
            - CJEU不利裁决（倒逼产品逻辑重构）；面临DSA最高营收6%的巨额罚款
            - 美国市场拓展失利（资本沉没损失）
            - 维尔纽斯数据中心宕机（全站瘫痪）
            - 资深工程师核心团队大规模流失
            - 融资窗口关闭；估值面临大幅压缩
            - 爆发重大信任危机或全网严重舆论反弹
        - id: medium-impact
          label: 中冲击
          values:
            - DAC7税务合规导致大卖家流失；GPSR电子产品安全召回
            - Vestiaire向轻奢大众领域下沉蚕食；Depop重金反攻欧洲市场
            - 核心承运商服务瘫痪（法国/德国）；支付系统故障
            - 美国市场执行力断档（缺乏本土核心高管）
            - 资金成本走高；扩张性资本开支放缓
            - 负面舆情逐步侵蚀用户信任
        - id: low-impact
          label: 低冲击
          values:
            - 被认定为DMA“守门人”（短期概率极低）
            - eBay重新向欧洲二手时尚业务追加投入
            - App暂时性宕机（48小时以内）；客服响应脱节
            - CEO接班人交接；CLIP模型迭代受阻
            - IPO窗口期推迟但仍具开放性
            - 零星负面舆情，未对GMV造成实质冲击
  - id: FV001
    title: 投资决策推导逻辑图
    type: flow
    description: 投资建议决策推导流：从业务质地评估，到估值水准衡量，再到风险调整后回报测算。
    sourceRefs:
      - SV001
      - SV006
      - SV013
      - SV029
    claimRefs: []
    notes: 逻辑图展示从基本面质量评估推导至最终投资建议的完整路径。
    data:
      nodes:
        - id: business-quality
          label: 业务质地：极佳
          description: 欧洲纯C2C垄断地位、38%营收增速、一体化护城河、2023年起持续盈利
        - id: valuation-anchor
          label: 估值：€8B（7.3x 营收，53x EBITDA）
          description: 2026年4月老股转让；获超额认购；获 BlackRock、OTPP、EQT、Schroders 等知名机构背书
        - id: return-assessment
          label: 回报评估：基准情景回报平平（0–25%）
          description: 基准情景：2028 年达 €8–10B → 0–25% 毛上行空间；乐观：38%–100%；悲观：-30% 至 -55%
        - id: regulatory-overlay
          label: 监管风险贴水：实质性风险
          description: 涉及 CJEU 对 GDPR 案件审查、DSA 强监管及 GPSR 电子品类缺口——€8B 估值尚未充分计入该风险
        - id: preferred-structure
          label: 首选方案：€6–7B 估值入场或锁定下行保护
          description: 引入下行保护条款（清算优先权、反稀释）或以更低估值入场，以提升风险调整后回报
        - id: recommendation
          label: 投资建议：谨慎关注
          description: 值得深入尽调；在获取审计财报、用户留存队列、CJEU抗辩文件及美国业务一手数据前不宜轻易交割
