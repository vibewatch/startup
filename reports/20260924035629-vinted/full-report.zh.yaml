chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与起源
        blocks:
          - type: paragraph
            body: >
              Vinted Group UAB 总部位于立陶宛维尔纽斯，是一家私营科技公司。公司于 2008 年由 Milda Mitkutė（时年 22 岁）与 Justas Janauskas 共同创立。创业灵感源于
              Mitkutė 搬入较小的学生公寓前需要清理闲置衣物，程序员 Janauskas 便协助她搭建了一个与他人换物的网站。短短数周内，该平台就从个人工具演变为热门社区市场。公司率先在立陶宛上线，随后于 2009
              年拓展至德国、2011 年进入捷克、2013 年挺进法国与波兰、2014 年进入英国。截至 2016 年，Vinted 虽然打入 9
              个市场，却受困于各地区商业模式各异、收取卖家费导致用户流失，且广告收入勉强只够支付服务器成本。公司距离破产大约仅剩 9 至 12 个月时，Insight Partners 引荐了荷兰创业者 Thomas
              Plantenga。Plantenga 于 2016 年以 5 周咨询顾问身份介入后便未再返回纽约，最终接任 CEO。他实施了激进重组：关闭除维尔纽斯总部外的所有分支办公室，裁员超三分之一，彻底取消 20%
              的卖家费，改收买家保障费，并投放大量电视广告。营收随即强劲反弹；2019 年 11 月，Vinted 完成由 Lightspeed Venture Partners 领投的 €128M Series E
              轮融资，估值超 €1B+，成为立陶宛首家科技独角兽。如今 Vinted 在维尔纽斯、考纳斯、阿姆斯特丹、柏林、汉堡和巴黎设有办公室，员工规模超 2,200 人。
