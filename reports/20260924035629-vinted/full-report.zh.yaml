      - number: '5.3'
        title: 技术债、安全与合规审计证据
        blocks:
          - type: paragraph
            body: >
              综合工程博客披露的信息，Vinted 从单体架构向事件驱动微服务（领域驱动设计）的改造已基本收官，大幅出清了核心后端的系统性技术债。然而，GDPR 相关的合规处罚，暴露了横跨产品设计与数据工程的内部治理漏洞。


              2024 年 7 月**立陶宛 DPA 开出的 €2,385,276 罚单**，是 Vinted 史上最严峻的产品与合规负面事件。监管裁定了三项违规：(1)
              在缺乏合法数据处理依据的情况下对用户施加隐形屏蔽（shadow banning）；(2) 违法要求用户在行使删除权时必须陈述法定理由；(3) 数据处理流程透明度不足。立陶宛地方法院在 2025
              年维持了上述判决；2026 年 1 月，最高行政法院将 GDPR 法律适用问题移交欧洲法院（CJEU），使得该案的法律不确定性进一步拉长。


              需要强调的是，未见针对黑客攻击或数据泄露等安全事件的公开记录。上述 GDPR
              违规本质上属于程序性瑕疵——根源在于风控安全系统设计（隐形屏蔽）与用户权利响应流程，而非遭遇黑客外泄。然而，该违规行为具有系统性，波及法国、波兰和立陶宛等多国用户，反映出当时风控系统在处理个人数据时的合规防线存在疏漏，暴露了工程治理短板。此外，Vinted
              尚未公开披露获得 ISO 27001 或 SOC 2 认证。
            claimRefs:
