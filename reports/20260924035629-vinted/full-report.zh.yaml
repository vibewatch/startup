      - number: '5.2'
        title: 核心技术栈与系统扩展性
        blocks:
          - type: paragraph
            body: >
              Vinted 的技术架构在欧洲 C2C 交易平台中位居前列。搜索底座于 2023–2024 年从 Elasticsearch 全面迁移至 **Vespa**，使系统能够承载 10
              亿级可检索商品，并内生支持向量检索与机器学习在线推理。迁移带来的性能提升尤为显著：搜索延迟优化 2.5x，索引延迟优化 3x，商品上架到可被检索的时间延迟从 5 分钟压缩至 5 秒。Vespa
              架构将文本检索与神经网络语义检索深度整合——这对支撑 26 个国家的多语言复杂查询至关重要。


              推荐引擎采用**双塔神经网络**（查询塔 + 商品塔），利用多语言 CLIP 向量嵌入将用户搜索意图与商品特征统一映射至 256 维向量空间。近似最近邻（ANN）检索能在 100ms 内从 10
              亿级商品候选库中圈定最匹配结果。该底层架构结合用于终排的 LightGBM 排序学习（LTR）算法，相比竞对依靠简单关键词或传统协同过滤的检索体系，实现了远为精准的搜索相关度。


              数据库选用 **Vitess** 进行 MySQL 分库分表，每秒处理超 1.3M 次查询。容器编排采用基于 **GitOps 的 Kubernetes** 架构（曾于 Cloud Native
              Lithuania 2023 大会作专题分享）。公司在**维尔纽斯自建数据中心**，并部署定制 Clos
              网络拓扑，相比依赖大型公有云，更加强调规模化运转下的极致成本控制。从早期单体架构重构而来的事件驱动微服务体系，有力支撑了敏捷团队独立部署与故障隔离。
