companyProfile:
  summary: >
    Vinted 总部位于立陶宛维尔纽斯，是由 Milda Mitkutė 与 Justas Janauskas 于 2008 年创立的 C2C
    二手交易平台。公司起步于立陶宛学生闲置衣物互换社区，现已发展为欧洲最大的二手垂直交易市场，拥有 75M+ 注册会员，业务覆盖 20+ 个市场。Vinted 依托交易平台（买家保障费）、自建物流（Vinted Go：500K+
    个自提点、接入 60+ 家承运商）与支付体系（持 EMI 牌照的 Vinted Pay）运转飞轮，构筑出竞对若非投入数年平台建设便无法复制的结构性护城河。平台于 2023 年实现首度法定盈利（净利润 €17.8M），2024
    年净利润升至 €76.7M，2025 年受美国市场拓展及 Vinted Go 物流投入拖累，净利润收缩至 €62M。法国（占 GMV 35%）、英国（25%）与德国（15%）是其前三大市场。2026 年 4 月，Vinted
    完成一笔超额认购的 €880M 老股转让，投后估值达 €8B，由 EQT 领投，新引入 BlackRock、Ontario Teachers'、Schroders Capital 及 Lombard Odier
    等投资方，全程未发行任何新股。
