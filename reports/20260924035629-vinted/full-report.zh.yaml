          label: 法国二手消费需求
          value: High
          description: 法国为Vinted GMV贡献最大的单一市场，二手转售市场已高度成熟。
        - id: uk
          label: 英国二手消费需求
          value: High
          description: 英国用户在二手转售场景展现出极强的复购粘性与价格敏感度。
        - id: germany
          label: 德国二手消费需求
          value: Medium
          description: 德国市场体量庞大，但相较英法渗透率依然偏低。
  - id: FP001
    title: 竞争格局定位矩阵
    type: quadrant
    description: 主要二手交易平台二维定位矩阵：横轴为地域覆盖广度（0=单国市场，100=全球覆盖），纵轴为C2C时尚聚焦度（0=综合/B2C，100=纯C2C时尚）。坐标轴采用基于调研证据的序数评分。
    sourceRefs:
      - SP009
      - SP023
      - SP001
      - SP004
      - SP020
    claimRefs: []
    notes: 序数评分基于公开报道的市场覆盖与品类结构；具体坐标仅作示意。象限定义：右上=纯C2C时尚领跑者；右下=综合类传统巨头。
    data:
      xAxis: 地域覆盖广度（0=单一市场，100=全球）
      yAxis: C2C时尚聚焦度（0=综合/B2C，100=纯C2C）
      points:
        - id: vinted
          label: Vinted
          x: 85
          'y': 95
          description: 覆盖欧洲26国以上，纯C2C时尚，欧洲样本市占率超90%
        - id: depop
          label: Depop (Etsy)
          x: 60
          'y': 85
          description: 覆盖英、美、澳；聚焦Z世代潮流时尚；强社交交互体验
        - id: wallapop
          label: Wallapop (Naver)
          x: 20
          'y': 70
          description: 西班牙本土霸主；综合C2C（非纯时尚）；西班牙月活约1900万
        - id: vestiaire
          label: Vestiaire Collective
          x: 70
          'y': 55
          description: 全球二手奢侈品交易；非大众平价市场；高客单价垂直平台
        - id: thredup
          label: ThredUp
          x: 30
          'y': 45
          description: 聚焦美国的B2C二手电商；2024年剥离欧洲业务；非C2C模式
        - id: ebay
          label: eBay
          x: 95
          'y': 30
          description: 全球全品类传统巨头；二手销售中时尚品类占39%
        - id: poshmark
