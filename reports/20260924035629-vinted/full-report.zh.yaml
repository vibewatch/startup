      - number: '3.3'
        title: 业务能力、定价机制与分发渠道对比
        blocks:
          - type: paragraph
            body: >
              Vinted 的零卖家费机制是其在定价端最具颠覆性的结构差异。Depop 向卖家收取约 10% 的抽成外加支付处理费，Wallapop 收取 5–10%，Vestiaire 抽成 15%+，eBay
              在时尚品类的抽成约为 12%。ThredUp 的 B2C 寄售模式则剥夺了个人卖家的定价与上架控制权。Vinted 的买家保障费（单件约 5% 加固定费用）贡献了总收入的 50%
              以上，同时保障卖家每笔交易的到手收益最大化。


              在业务底座能力上，Vinted 自建的物流履约网络（Vinted Go：500K+ 自提点、整合 60+ 家承运商）与内置的 Vinted Pay（持 EMI 牌照），是任何纯 C2C
              竞对均无法企及的重资产壁垒。Depop 与 Poshmark 完全依赖第三方承运商。Wallapop 虽培育出了物流业务（2024 年收入 €74M），但其网点高度集中在西班牙。Vestiaire
              依靠专业快递承运商进行奢侈品验真物流，并未自建品牌承运网络。


              在分发维度，eBay 坐拥无可匹敌的全球体量与卖家信任，但其时尚流量被电子、汽摩配与收藏品严重摊薄。Depop 的 Z 世代社群与社交电商属性，使其在 18–25 岁人群中确立了极强的获客优势。Vestiaire
              与奢侈品巨头（Kering、LVMH 试点项目）的合作，筑起了 Vinted 无法涉足的保真分发渠道。Vinted 的获客强项则在于电视广告的高举高打、零摩擦的新客入驻体验，以及零卖家费驱动的裂变机制。
