      - number: '3.2'
        title: 核心竞对剖析与战略动向
        blocks:
          - type: paragraph
            body: >
              **Depop**（归属 Etsy，2021 年 6 月以 $1.6B 被其收购）专注面向 Z 世代买卖家，主打精选古着与街头潮流。其在 2024 年录得 $788.9M GMS（同比 +31.6%），营收约
              $85M，注册用户数达 43.5M。尽管 GMS 增长迅猛，Depop 仍录得 £42M 营业亏损（较上年收窄 14%）。强大的社区属性与社交电商机制构成了 Depop
              的独特壁垒，但其过度聚焦英美两地且深陷亏损，与 Vinted 横扫欧洲并实现盈利的态势形成鲜明反差。


              **Wallapop**（归属 Naver，2025 年以 ~€650M 被其收购）是西班牙统治级的 C2C 平台，月活跃用户数达 19–21M。2024 年营收为 €101M（+13%），但营业亏损仍达
              €25M。Naver 同时将 Wallapop（南欧）与 Poshmark（美国）收入囊中，使其成为全球唯一的跨区域 C2C 二手整合者，但跨国业务协同效应目前未经验证。


              **Vestiaire Collective** 布局全球轻奢与高端二手市场，2024 年依托 ~€1B GMV 录得 ~€200M 营收。其 2024 年 €1.1–1.2B 的估值已跌破 2021 年
              €1.4B 的峰值。该平台的目标是在 2026 年首度实现全年盈利。其专长在于二手奢侈品鉴定，与 Vinted 扎根的大众主航道并不重合。


              **ThredUp**（Nasdaq: TDUP）为美国 B2C 二手寄售平台——并非真正意义上的 C2C 竞对——其 2024 年实现营收 $260M（+1%），毛利率高达 79.7%，但净亏损达
              $40M。关键在于，ThredUp 在 2024 年 Q4 剥离了 91% 的欧洲业务，实质上大幅瓦解了与 Vinted 在欧直接交锋的可能。


              **eBay** 是底蕴最深的巨头，二手服装占其时尚类目销售额的 39%，二手品类贡献了其全球 GMV 的 40%。eBay 在 C2C
              时尚赛道的长板在于历经二十余载沉淀的卖家信任与全球分发网络，但其多品类综合体验相比 Vinted 垂直打磨的时尚体验显得较为分散。
