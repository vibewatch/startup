  productSummary: >
    Vinted 的核心产品是 C2C 交易平台，个人卖家可零佣金挂售二手服装与生活方式类物品。买家支付买家保障费（约占商品售价 3–8% 加固定费用），构成 Vinted 的核心收入来源。Vinted Go 提供一体化物流服务（覆盖
    15 个市场的 60+ 家承运商与 500K+ 个自提柜及代收点），免除了买卖双方单独对接承运商的成本。持 EMI 牌照的 Vinted Pay 将支付处理利润内部化，并支持跨国交易。产品类目已拓展至电子产品（2024
    年）、自有可持续品牌线「New Again」（2025 年），目前正在试水美国市场（2026 年）。平台采用 AI 搜索，依托双塔机器学习模型与 256 维 CLIP 向量嵌入。
  customerFocus: >
    核心客群为 25–34 岁女性（女性用户占 63%）；80% 的客单价在 £20 以下；买家注重性价比且复购频繁（在英国市场复购率达 50%+）。供给端主要为个人卖家，大卖家（达到 DAC7 年度申报门槛：€2,000 或 30
    件商品）贡献了相当可观但未量化的 GMV 份额。平台不提供任何企业级或 B2B 产品。
  businessModel: >
    零卖家费模式：Vinted 按笔向买家收取买家保障费（约 3–8% 加固定费用），变现收入约占 GMV 的 10%。Vinted Go 提供物流履约服务并赚取单票包裹利润。Vinted Pay 将支付处理利润内部化。2025
    年营收：€1.1B。调整后 EBITDA：€151M（利润率 13.7%）。自由现金流（FCF）：€137M。
