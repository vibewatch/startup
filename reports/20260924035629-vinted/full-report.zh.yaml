      - number: '1.2'
        title: 管理层、治理与资本结构
        blocks:
          - type: paragraph
            body: >
              Thomas Plantenga（荷兰籍，生物物理学背景，曾任 OLX 新兴市场主管，Bookaboat 与 Sell It 联合创始人）自约 2017 年起出任
              CEO。他以数据驱动决策、对投资人高度透明，以及将用户行为视作“流体动力学”的管理哲学著称。核心管理层包括 COO Mantas Mikuckas、CFO Maurizio D'Arrigo（2024
              年加入）、Marketplace CEO Adam Jay（2022 年加入）以及 VP Vinted Go Vytautas Atkočaitis。联合创始人 Justas Janauskas
              依然深度参与业务。Milda Mitkutė 仍列名联合创始人，但据报道未承担实际运营职务。董事会汇聚了核心投资方代表：Insight Partners 的 Deven Parekh 与 AJ Malhotra
              担任长期董事；2021 年 Series F 轮后 EQT Growth 进入董事会；Carolina Brochado 出任董事。Vinted 在历次融资中累计募集约 €480M 的新股股权资本：包括
              ~$27M 的 Series C 轮（2015 年）、€50M 的 Series D 轮（2018 年 9 月）、由 Lightspeed 领投的 €128M Series E 轮（2019 年 11 月，估值
              €1B），以及由 EQT Growth 领投的 €250M Series F 轮（2021 年 5 月，估值 €3.5B）。2024 年 10 月，TPG（通过 TPG Tech Adjacencies）以
              €5B 估值领投一笔 €340M 的老股转让，既解决了员工流动性需求，又引入了 Hedosophia、Baillie Gifford、Invus Opportunities、FJ Labs、Manhattan
              Venture Partners 与 Moore Strategic Ventures 等新股东。所有既有机构投资方均未减持。2023 年 Q4，Vinted 从 BNP Paribas 与 ING Bank
              获得了一笔 €50M 的循环信贷额度。2026 年 4 月，由 EQT 领投的一笔 €880M 老股交易将 Vinted 估值推高至 €8B。
