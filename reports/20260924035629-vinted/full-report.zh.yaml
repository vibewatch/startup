      - number: '2.3'
        title: 买家与卖家画像分群
        blocks:
          - type: paragraph
            body: >
              Vinted 的双边交易市场服务买家和卖家，两边的诉求与行为模式截然不同。


              **买家分群**：价格敏感型买家（主要诉求为性价比，占受访欧洲消费者的 72%）构成大众基本盘，贡献了核心交易量。淘货型买家——以 Z 世代为主——偏好独特性、古着或绝版款式（40% 的 Z
              世代出于该目的使用二手交易平台）。环保可持续型买家（主诉求占比约 14%）在法国、德国及年轻女性群体中呈上升态势。“混搭型”消费者（同时购买一手与二手服装）在法国消费者中占 28%，在英国占 24%，而在德国仅占
              7%，显现出鲜明的地域差异。


              **卖家分群**：偶发闲置清理型卖家构成供给主体——其目的在于清理衣橱空间而非经商。高频转售型卖家将 Vinted 视为收入来源，在 Z 世代中尤为突出（56%
              的人出售物品是为了赚取外快）。古着商家与时尚小微商户则以商家身份入驻 Vinted Pro，开展平台内 B2C 销售。买卖双重身份重合度极高：绝大多数 Vinted
              用户既是买家也是卖家，形成了供给生成与需求释放的双向飞轮。


              **信任壁垒**制约转化率：约 25% 的欧洲消费者对二手服装存在卫生顾虑；假货或货不对板风险削弱了高客单价商品的购买信心；而平台信任度（资金托管可靠性、纠纷裁决公允度）直接决定了用户留存。Vinted
              的买家保障机制——资金全程托管直至买家确认收货——直击支付安全痛点，化解了最关键的结构性信任障碍。


              Vinted 英国买家用户画像（Consumer Edge，2024 年）：女性占比更高，年龄略高于 Depop 用户；80% 的消费客单价在 £20
              以下；复购率（>50%）明显领先竞对。可见其牢牢抓住了高忠诚度的大众市场核心客群，而非狭窄的小众潮流先锋。
