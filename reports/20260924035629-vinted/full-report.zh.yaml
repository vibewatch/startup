      - number: '6.2'
        title: 市场份额、增长与地理位置
        blocks:
          - type: paragraph
            body: >
              Vinted 是主导欧洲的 C2C 二手电商平台，在英国与欧洲大陆的**纯 C2C 时尚二手交易**中估计占据 **90%+ 市场份额**。在英国，Vinted 自 2020 年以来规模增长约
              200x，按客户触达计已成为第三大纯时尚零售商，仅次于 Primark 和 Next——对一家不持库存的平台型市场而言，这是极其罕见的成绩。


              **地域集中度十分显著**：法国（Vinted 最初的核心市场）贡献约 35% 的 GMV；英国与德国分别贡献约 25% 和 15%，意味着前三大市场合计占总 GMV 的 75%
              左右。这既是优势（深度渗透拉动高流动性），也是风险（三大市场中任一市场遭受经济或竞争冲击，都会带来放大效应）。


              增长轨迹依然强劲：GMV 从 2023 年的 €7.3B 增长至 2025 年估计的 €10.8B，其中德国增速在 2025
              年重新加快，英国和葡萄牙保持两位数增长。新近开拓的市场（西班牙、葡萄牙、克罗地亚、希腊、爱尔兰）仍处早期，目前对 GMV 贡献极小。2026 年进军美国市场处于测试阶段——这是一步高风险动作：Poshmark 和
              eBay 早已根深蒂固，品牌认知度为零，尺码与文化差异亦会增加产品摩擦。
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
      - number: '6.3'
        title: 留存、参与度与满意度证据
        blocks:
          - type: paragraph
            body: >
              目前最可靠的留存信号来自 Consumer Edge 的交易数据：**超过 50% 的英国买家为复购客户**——对交易平台而言属于亮眼的留存指标。Vinted 的 **NPS 为
              25**（Comparably，2024），自报忠诚率达 81%，整体满意度 3.4/5，在主流电商平台中处于及格但并不出彩的区间（Amazon NPS 约 70，典型时尚电商约 30–40）。


              用户参与深度表现向好：GMV 增速显著快于会员增长（2025 年 75M+ 会员贡献 €10.8B GMV，而 2022 年较少会员贡献 €5.5B GMV），意味着每名活跃会员的交易频次在增加。由于 80%
              的购买金额低于 £20，Vinted 属于高频、小额交易平台——其留存形态更偏向日常习惯性消费，而非低频奢侈品采购。


              买家对核心产品价值的定性满意度相当高：84% 认为二手物品质量好于或不输新品，65% 的买家将 Vinted 列为首选二手时尚平台。73% 倾向于使用自提柜（PUDO）提货——这正是 Vinted Go
              提供的物流模式——印证了其在物流环节较强的产品市场契合度（PMF）。


              关键公开披露缺口：未见公开披露队列留存曲线（第 1 个月、第 3 个月、第 6 个月）、DAU/MAU 比率及平台停留时长指标。单凭复购买家这一替代指标，不足以支撑完整的 LTV 建模。
            claimRefs:
