    - B2C Recommerce (US)
    - $260M rev / ~$564M mkt cap
    - US value buyers, broad apparel
    - High gross margin (79.7%), fashion-as-a-service
    - B2C model; divested European ops Q4 2024
  - - eBay
    - General Multi-Category
    - '>$24B mkt cap (total)'
    - All ages, broad global, fashion + collectibles
    - Global scale, deep seller trust, 2 decades brand
    - Diluted fashion UX; category breadth reduces focus
