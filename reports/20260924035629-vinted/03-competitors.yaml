sections:
- id: SP_SEC001
  title: Competitive Landscape Overview
  body: 'Vinted operates in the global secondhand fashion marketplace sector, which reached approximately $300 billion in GMV in 2024 and is projected to grow at roughly 20% CAGR through 2030. The competitive landscape spans five distinct competitor categories. **Direct C2C peers** include Depop (Gen Z fashion, Etsy-owned), Wallapop (general C2C, Spain-dominant, Naver-acquired), and Poshmark (social fashion, US-focused, Naver-owned). **Luxury resale specialists** are represented by Vestiaire Collective and The RealReal. **B2C recommerce** is anchored by ThredUp (US) and Rebag. **General incumbents** — primarily eBay — compete across all categories with pre-owned items constituting 39% of eBay''s clothing/shoes/accessories volume and 40% of total global GMV. **Likely entrants** include tech-enabled fast fashion players (Shein, Zalando) who could add resale features, and social platforms (Instagram, TikTok Shop) that enable peer-to-peer commerce natively.


    Vinted''s 90%+ EU C2C panel share reflects the winner-take-most dynamics of liquidity-driven marketplaces: once a platform achieves sufficient buyer density, sellers follow, creating a self-reinforcing cycle that makes displacement structurally difficult. General resale platforms (eBay, Vinted, Wallapop, Mercari) collectively command approximately 80% of global resale web traffic, with fashion-focused platforms (Depop, Poshmark, Vestiaire) accounting for most of the remainder.

    '
  claimRefs: []
  callouts:
  - type: insight
    title: Winner-Take-Most in EU C2C
    body: Vinted's buyer density advantage in France, Germany, and the UK creates a structural moat that requires any challenger to simultaneously overcome liquidity gaps, brand recognition deficits, and logistics matching — a combination no current rival has achieved.
    tone: positive
  figureRefs:
  - FP001
- id: SP_SEC002
  title: Competitor Profiles and Strategic Directions
  body: '**Depop** (Etsy, acq. June 2021 at $1.6B) targets Gen Z buyers and sellers of curated vintage and streetwear. It generated $788.9M GMS in 2024 (+31.6% YoY), with approximately $85M revenue and 43.5M registered users. Despite rapid GMS growth, Depop posted an operating loss of £42M, narrowed 14% from the prior year. Depop''s strong community and social-commerce features differentiate it, but its US-UK focus and continued losses contrast with Vinted''s European profitability.


    **Wallapop** (Naver, acquired 2025 at ~€650M) is Spain''s dominant C2C marketplace with 19–21M monthly active users. Revenue was €101M (+13%) in 2024, still running a €25M operating loss. Naver''s simultaneous ownership of Wallapop (Southern Europe) and Poshmark (US) positions it as the only global C2C recommerce consolidator, though cross-border feature leverage is unproven.


    **Vestiaire Collective** targets mid-to-luxury resale globally, generating ~€200M revenue in 2024 from ~€1B GMV. Its €1.1–1.2B 2024 valuation is below its 2021 €1.4B peak. The platform targets its first full-year profit in 2026. Its luxury authentication capabilities position it outside Vinted''s core mass-market lane.


    **ThredUp** (Nasdaq: TDUP) is a US B2C recommerce platform — not a true C2C peer — that generated $260M revenue (+1%) in 2024 with a 79.7% gross margin but a $40M net loss. Critically, ThredUp divested 91% of its European operations in Q4 2024, materially reducing any direct competitive overlap with Vinted in Europe.


    **eBay** is the largest incumbent, with pre-owned clothing comprising 39% of fashion category sales and pre-loved goods representing 40% of global GMV. eBay''s C2C fashion strengths are seller trust built over two decades and global reach, but its multi-category UX is diluted relative to Vinted''s fashion-focused experience.

    '
