    title: GPSR Electronics Compliance Gap is Undisclosed
    body: Vinted expanded into electronics in 2024 before the GPSR took effect in December 2024. No public evidence exists that Vinted's GPSR compliance process covers electronics-specific safety obligations — a material gap with regulatory and reputational consequences.
    tone: risk
