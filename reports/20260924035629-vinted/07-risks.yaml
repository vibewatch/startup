  - CR005
  - CR007
  - CR010
  columns:
  - Risk
  - Status
  - Max Financial Exposure
  - Timeline
  - Mitigation Disclosed
  rows:
  - - DSA non-compliance (fees, transparency, algorithm)
    - Active – June 2024 adjustments made; monitoring continues
    - 6% of global revenue (~€66M at 2025 revenue)
    - Ongoing; next review in 2025–2026
    - Fee disclosure updated; verification improved; gaps remain in price display
  - - GDPR CJEU referral (shadow-ban, erasure)
    - Active – CJEU referral January 2026; fine upheld 2025
    - Additional fines + mandatory product redesign
    - CJEU ruling likely 2027–2028
    - Shadow-ban policy changed post-fine; new lawful basis not publicly specified
  - - DAC7 seller tax reporting (platform obligation)
    - Active – first reports due January 2024
    - €50,000+ per member state for non-compliance
    - Ongoing annually
    - Not publicly disclosed
  - - GPSR (secondhand and electronics safety)
    - Active – December 2024 effective date
    - Product recall costs + market surveillance penalties
    - Ongoing; electronics-specific gaps not documented
    - No public GPSR compliance program for electronics disclosed
  - - EU Product Liability Directive (new)
    - Emerging – in legislative process; not yet enacted
    - Material if products cause consumer harm via platform
    - 2025–2026 enactment; 2–3 year implementation
    - No specific mitigation disclosed
  - - Counterfeit / IP obligations (DSA MoU)
    - Active – MoU modernised April 2024
    - Reputational and legal exposure if IP holders sue
    - Ongoing; luxury expansion increases exposure
    - Luxury authentication service expanding
