    title: CJEU Referral Is the Highest Regulatory Uncertainty
    body: A CJEU ruling adverse to Vinted on shadow-banning practices could require redesigning trust-and-safety algorithms across all EU markets, impose retrospective penalties beyond the initial €2.385M, and force industry-wide changes affecting all C2C platforms.
    tone: adverse
