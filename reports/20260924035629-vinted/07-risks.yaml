sections:
- id: SR_SEC001
  title: Regulatory and Legal Risk
  body: 'Vinted''s most material risk cluster is regulatory. Four distinct regulatory frameworks imposed simultaneous obligations on the company in 2024–2026.


    **DSA (Digital Services Act)**: Fully applicable from February 17, 2024, the DSA requires Vinted to verify seller identities (Article 30), operate notice-and-action mechanisms for illegal products (Article 16), take action against repeat offenders (Article 23), and maintain transparency in algorithm and advertising practices. In June 2024, EU Commission and Lithuanian authorities required Vinted to stop adding undisclosed automatic fees at checkout and to improve refund transparency — indicating that Vinted was not fully DSA-compliant at launch. Ongoing monitoring continues, with gaps remaining in price clarity. DSA non-compliance fines can reach 6% of global annual revenue — approximately €66M at 2025 revenue levels — with operational bans possible for severe or repeated violations.


    **GDPR CJEU Referral**: Vinted''s €2,385,276 fine (July 2024) was upheld by Lithuanian courts in 2025. The case was referred to the CJEU in January 2026, creating multi-year legal uncertainty. If the CJEU rules adversely, Vinted may be required to redesign its shadow-banning and user-visibility algorithms across all 26 markets simultaneously — a significant engineering and product risk. This case also sets precedent for the entire C2C platform industry.


    **GPSR (General Product Safety Regulation)**: Effective December 2024, GPSR classifies Vinted as a ''distributor'' for secondhand goods, imposing safety verification, market surveillance cooperation, and recall obligations. Vinted''s expansion into electronics — a category with materially higher product safety risks than fashion — amplifies this exposure. No public evidence of electronics-specific GPSR compliance processes at Vinted exists.


    **DAC7**: Since January 31, 2024, Vinted must report sellers with >€2,000/year revenue or >30 annual transactions to EU member-state tax authorities. This creates a dual risk: a platform compliance obligation (fines of €50,000+ per state if Vinted fails to report), and a supply-side demand risk (power sellers reducing activity to avoid tax scrutiny).

    '
