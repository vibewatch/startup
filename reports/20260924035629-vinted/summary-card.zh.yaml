summary:
  headline: >-
    Vinted 是欧洲少有的复利型互联网公司：已实现盈利，收入增长 38%，交易、物流与支付一体化构成护城河。但以 2026 年 4 月 €8B 老股交易价格入场（7.3x 历史收入、53x
    EBITDA），基准情景的上行空间有限；监管与执行风险一旦兑现，悲观情景下跌幅不小。
  overallScore: 7
