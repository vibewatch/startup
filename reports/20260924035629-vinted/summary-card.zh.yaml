  topStrengths:
    - 在欧洲 C2C 领域接近垄断：纯 C2C 二手交易份额超过 90%；法国、英国、德国三地合计贡献 75% GMV，构成持久的结构性优势
    - 一体化飞轮（交易平台 + Vinted Go 物流 + Vinted Pay 支付）构建起高切换成本护城河，竞对复制需耗时 3–5 年并投入 €300M+ 资金
    - 自 2023 年起持续盈利且自由现金流为正（2025 年录得 €137M FCF）：在平台级体量下兼顾高速增长（收入增速 38%）与造血能力，极为罕见
    - 2025 年营收 CAGR 达 38%，规模已达 €1.1B；对已盈利的欧洲平台而言，这一增速尤为突出，显著高于所有上市交易平台可比公司
    - 2026 年 4 月的老股交易获超额认购，估值达 €8B，买方均为可完整查阅财务信息的蓝筹机构投资者（BlackRock、OTPP、EQT、Schroders），为这一估值提供了有力的市场背书
  topRisks:
    - 欧洲法院（CJEU）GDPR 移交审理案（2026 年 1 月）：不利判决可能强制要求重构信任与安全体系；工程团队可能因此被占用 18–24 个月，拖慢产品路线图并压缩 EBITDA
    - 当前估值要求持续高增长：在 7.3x 历史收入与 53x 调整后 EBITDA 的倍数下，一旦收入增速连续两个季度低于 15%，将引发大幅估值回调
    - 美国市场执行风险：进军美国既是乐观情景的核心催化剂，也是首要资本风险；Vinted 迄今未披露任何公开的美国市场 KPI
    - 买家保护费面临监管定性风险：若欧盟将该费用重新归类为卖家端费用，Vinted 免收卖家费用的价值主张与供给侧护城河将不复存在
    - 财务披露缺口：2024 与 2025 年数据均为未经审计的新闻稿数字；公开渠道没有提供任何 IFRS 财务账目；无法排除重大口径差异
  unresolvedGaps:
    - 2023 与 2024 年经审计的 IFRS 财务报表——按 €8B 估值进行投资承销不可或缺的前提
    - 买家群体留存曲线（按市场划分的第 1/3/6/12 个月数据）——缺少群体队列数据即无法对 LTV 假设进行建模
    - 欧洲法院（CJEU）案件诉讼进展及法律顾问关于判决可能情景与时间表的简报
    - 2026 年启动测试以来美国市场的 GMV、挂牌商品数及获客数据
    - 自 2024 年 1 月报告要求实施以来，DAC7 规范下的大卖家交易量及观察到的商品挂牌率变动
    - 包含管理层预测的 Vinted Pay 佣金率（take-rate）路线图及 2026–2028 年 EBITDA 贡献模型
