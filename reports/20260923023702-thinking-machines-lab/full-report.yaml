chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and control
        blocks:
          - type: paragraph
            body: >
              Thinking Machines Lab presents itself as an artificial intelligence research and product company focused
              on AI systems that are more widely understood, customizable, and generally capable. The public-facing
              identity is unusually founder-centric: Mira Murati leads the company, the company has described itself as
              a public benefit corporation, and public coverage repeatedly frames the lab as an OpenAI alumni spinout
              rather than a conventional software startup. That matters because the company’s differentiation is as much
              cultural as technical: it is betting that openness, customization, and collaborative human-AI workflows
              can be a product strategy rather than a research slogan.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO008
              - CO009
              - CO011
      - number: '1.2'
        title: Team formation and product path
        blocks:
          - type: paragraph
            body: >
              The founding bench is the other core fact pattern. Murati assembled a team that included John Schulman,
              Barret Zoph, Lilian Weng, Andrew Tulloch, and Luke Metz, all of whom had previously worked at OpenAI or
              adjacent frontier labs. That gave the company instant credibility, but it also created a concentration of
              key-person risk: the same talent depth that helped the company launch later made departures especially
              visible. The product path has now become clearer. Tinker came first as a cloud fine-tuning tool, and
              Inkling arrived later as the company’s first in-house open-weights model. The sequence suggests a platform
              strategy rather than a one-shot model release.
            claimRefs:
              - CO003
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO012
      - number: '1.3'
        title: Capital, scale, and open questions
        blocks:
          - type: paragraph
            body: >
              The capital story is extraordinary even by frontier-AI standards. In July 2025 the company closed a $2
              billion seed round at a $12 billion post-money valuation, and the investor list included Andreessen
              Horowitz, Nvidia, Accel, ServiceNow, Cisco, AMD, and Jane Street. Reporting in 2025 and 2026 then
              described attempts to re-rate the company at much higher values, but those talks did not close. Current
              public estimates put the team in the low hundreds rather than the thousands, while the company’s compute
              plan and product ambitions have expanded materially. The main diligence gap is therefore not whether the
              lab can attract capital; it is whether that capital translates into durable revenue and repeatable
              customer adoption.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO010
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Founder pedigree is the core asset
            body: >-
              The startup’s clearest advantage is not product breadth but founder credibility: Murati plus an unusually
              dense OpenAI alumni bench made the seed round and early hiring possible.
            calloutType: strength
            claimRefs:
              - CO002
              - CO003
              - CO006
          - type: callout
            title: The same pedigree creates key-person risk
            body: >-
              Leadership churn is a real diligence issue because the founding team is small, highly specialized, and
              already has seen multiple departures and replacements.
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substitute set
        blocks:
          - type: paragraph
            body: >
              The relevant market is AI customization infrastructure: cloud fine-tuning, self-hosted open-weight models,
              and developer tooling for adaptation and deployment. Buyers are typically researchers, startups, or
              enterprise teams that need private data handling, controllable outputs, or a tighter feedback loop than a
              generic API can provide. The substitute set is broad but concrete: closed-model APIs from OpenAI or
              Anthropic, open-weight models hosted in-house, and classic ML workflows built on internal compute.
              Thinking Machines wins only when customization matters more than convenience.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.2'
        title: Demand drivers and adoption friction
        blocks:
          - type: paragraph
            body: >
              The company’s own messaging, plus third-party coverage, suggests demand is being pulled by three factors:
              the desire to keep sensitive data in house, the appeal of open weights that can be modified, and the need
              for systems that work well in human-in-the-loop workflows. That is a strong value proposition for
              regulated sectors, research teams, and custom enterprise deployments. The trade-off is that adoption is
              not frictionless. Teams need engineering depth, GPU access, compliance comfort, and enough usage intensity
              to justify the overhead of fine-tuning and hosting.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM012
      - number: '2.3'
        title: Sizing remains evidence-constrained
        blocks:
          - type: paragraph
            body: >
              Public market sizing is still highly constrained. There is no disclosed TAM for the company’s exact slice
              of the market, and the best public signals are indirect: usage-based compute fees on Tinker, a $100M-plus
              revenue run-rate reported in 2026, and a growing set of named proofs such as Bridgewater and academic
              users. Those signals are enough to show that a market exists, but not enough to tell us how large it is or
              how quickly it will commoditize. The diligence implication is that the business should be judged on
              workflow depth and retention, not on market-size rhetoric.
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM007
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real, but narrow
            body: >-
              Thinking Machines is best viewed as an infrastructure vendor for teams that want control and
              customization, not as a broad AI app company.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: callout
            title: Adoption friction is the gating variable
            body: >-
              The key question is not whether customization is valuable; it is whether enough buyers will tolerate the
              operational overhead required to use it well.
            calloutType: risk
            claimRefs:
              - CM007
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct rivals and status-quo alternatives
        blocks:
          - type: paragraph
            body: >
              Thinking Machines does not compete on the same basis as a consumer chatbot vendor. Its actual comparison
              set is a mix of closed frontier labs and open-weight model ecosystems. OpenAI, Anthropic, and Google
              DeepMind compete for the same mindshare around frontier capability, while Meta, Mistral, Qwen, DeepSeek,
              and Nemotron matter because they supply the open models that Thinking Machines' customers may fine-tune
              instead of buying a proprietary API. That means the company is really fighting both platform incumbents
              and model commoditization at the same time.
            claimRefs:
              - CC001
              - CC002
              - CC004
              - CC005
          - type: table
            tableRef: TP001
            claimRefs:
              - CC001
              - CC002
              - CC004
      - number: '3.2'
        title: What is distinct about the product strategy
        blocks:
          - type: paragraph
            body: >
              The clearest differentiator is that Thinking Machines is selling control. Tinker lets customers fine-tune
              open-weight models on private data, while Inkling is itself an open-weights foundation model with
              multimodal capability and controllable thinking effort. That stack creates a different buying motion from
              a closed chat API: buyers who need auditability, portability, and local control may prefer it even if raw
              model quality is not the absolute best. The company’s human-AI collaboration framing also helps it stand
              apart from labs focused on pure autonomy or single-turn chatbot flows.
            claimRefs:
              - CC002
              - CC003
              - CC005
              - CC007
          - type: table
            tableRef: TP002
            claimRefs:
              - CC002
              - CC003
              - CC005
              - CC007
      - number: '3.3'
        title: Durability and switching-cost pressure
        blocks:
          - type: paragraph
            body: >
              The open-weights thesis is strategically appealing, but it is not a free moat. If model quality converges
              and the open ecosystem keeps improving, buyers can switch to other open models or self-hosted stacks with
              modest friction. That means Thinking Machines has to defend its position through product velocity,
              customer success, and a better workflow than the alternatives, not just through branding. Its strongest
              moat candidates are the Tinker workflow, the user experience around fine-tuning, and the combination of
              model releases with a developer platform, but each of those can be copied if the company stops shipping.
            claimRefs:
              - CC006
              - CC008
              - CC010
              - CC012
          - type: table
            tableRef: TP003
            claimRefs:
              - CC006
              - CC008
              - CC010
              - CC011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CC001
              - CC002
              - CC004
              - CC006
              - CC010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Open weights create a real wedge
            body: >-
              The company has a sharper value proposition than a generic model lab because it gives buyers control over
              weights, data, and deployment.
            calloutType: strength
            claimRefs:
              - CC002
              - CC003
          - type: callout
            title: Open weights also narrow the moat
            body: >-
              If the ecosystem keeps improving, customers can move to alternative open models or self-hosted stacks
              without paying a large switching penalty.
            calloutType: risk
            claimRefs:
              - CC004
              - CC006
              - CC010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization
        blocks:
          - type: paragraph
            body: >
              The company appears to have two monetization layers. First, it can charge usage-based compute fees for
              Tinker fine-tuning and related platform usage. Second, it can monetize model releases and enterprise-grade
              deployment once customers adopt Inkling or related open-weight offerings in earnest. Public evidence
              suggests the first layer is already generating meaningful revenue, while the second layer is still in the
              proof stage. That makes the business more real than a pure research lab, but still far from a mature,
              diversified software company.
            claimRefs:
              - CF001
              - CF002
              - CF008
              - CF010
          - type: table
            tableRef: TF001
            claimRefs:
              - CF001
              - CF002
              - CF010
      - number: '4.2'
        title: Capital base and infrastructure intensity
        blocks:
          - type: paragraph
            body: >
              The company’s balance sheet story is unusually strong because of the $2 billion seed, but the operating
              model is also compute-hungry. The Nvidia and Google arrangements are not just commercial relationships;
              they are economic commitments that effectively replace self-built infrastructure with external
              infrastructure at scale. That lowers up-front capex, but it does not make the business cheap to run. The
              key diligence question is whether the company can scale revenue faster than its compute bill expands.
            claimRefs:
              - CF003
              - CF005
              - CF012
          - type: table
            tableRef: TF003
            claimRefs:
              - CF001
              - CF003
              - CF005
              - CF006
      - number: '4.3'
        title: What is still hidden
        blocks:
          - type: paragraph
            body: >
              The biggest gaps are still classical startup diligence gaps: no disclosed gross margin, no audited burn
              number, no runway statement, no public customer count, and no list price card. That means the current
              valuation has to be evaluated on proxy evidence such as product launches, named users, and partnership
              commitments. Those are better than nothing, but they leave a lot of room for over-interpretation. Until
              the company discloses more of the P&L, the right posture is to treat the revenue story as real but
              unpriced risk as high.
            claimRefs:
              - CF006
              - CF007
              - CF009
              - CF011
          - type: table
            tableRef: TF002
            claimRefs:
              - CF002
              - CF009
          - type: figure
            figureRef: FF001
            claimRefs:
              - CF001
              - CF002
              - CF003
              - CF005
              - CF006
              - CF010
              - CF012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue is real enough to matter
            body: >-
              The company is no longer a pure pre-revenue narrative; a reported $100M-plus run-rate changes the
              diligence bar materially.
            calloutType: strength
            claimRefs:
              - CF001
              - CF002
          - type: callout
            title: Unknown margins are the main financial risk
            body: >-
              Without gross margin and burn disclosure, it is impossible to tell whether the business is becoming
              efficient or merely expensive at scale.
            calloutType: risk
            claimRefs:
              - CF005
              - CF006
              - CF007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and workflow definition
        blocks:
          - type: paragraph
            body: >
              In customer terms, the company sells tools that let teams customize, fine-tune, and run frontier models
              without starting from scratch. Tinker is the operational layer: it abstracts distributed training and lets
              users tune open-weight models on private data. Inkling is the flagship model layer: a multimodal
              open-weights foundation model with a large context window and controllable thinking effort. The company’s
              broader research narrative adds interaction models and open science so the product story feels like a
              platform rather than a one-off model release.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
          - type: table
            tableRef: TT001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              The architecture is built around customization and portability. Thinking Machines says it trains strong
              models with multimodal interaction, fine-tuning, and developer-facing abstractions; third-party guides
              describe Tinker as a LoRA-based training workflow for open models. Inkling itself is a very large MoE
              model that can be run locally only with serious hardware. That makes the stack suitable for technically
              sophisticated teams and less suitable for casual users, but it also gives the company a credible reason to
              exist beyond benchmark chasing.
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
          - type: table
            tableRef: TT003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
      - number: '5.3'
        title: Trust, safety, and roadmap
        blocks:
          - type: paragraph
            body: >
              The company’s own messaging stresses a high safety bar, sharing best practices, and studying misuse risks
              for open weights. That matters because the open-weights strategy makes portability easier but can also
              widen safety exposure if the model is repurposed badly. The roadmap is still early: more models, more
              multimodal capability in Tinker, and broader access to the platform. In short, the company is not yet a
              mature product suite; it is a research-led system that is trying to turn model capability into workflow
              advantage.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TT002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP011
          - type: figure
            figureRef: FT001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP010
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The stack is coherent
            body: >-
              Tinker, Inkling, and the interaction-model thesis fit together, which is better than a collection of
              unrelated launches.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP005
          - type: callout
            title: Technical depth is a moat only if it ships
            body: >-
              A sophisticated stack is valuable only if it keeps turning into product releases, customer wins, and
              better workflows.
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buying motion
        blocks:
          - type: paragraph
            body: >
              The customer set is concentrated in technically sophisticated buyers. Public reporting points to
              researchers, developers, startups, and regulated enterprises as the natural fit for Tinker and Inkling.
              That makes the buying motion mostly developer-led and workflow-led rather than consumer-led. The payer is
              often the team or platform budget owner, while the user is the engineering or research team that needs to
              adapt a model to private data, domain language, or specialized workflows. That is a good early-market
              shape, but it narrows the pool of buyers relative to a broad AI API.
            claimRefs:
              - CU001
              - CU005
              - CU009
          - type: table
            tableRef: TC001
            claimRefs:
              - CU001
              - CU005
      - number: '6.2'
        title: Named customer proof
        blocks:
          - type: paragraph
            body: >
              Bridgewater is the clearest proof point because public reporting says it fine-tuned a Qwen3-235B model
              with Tinker and saw large compute savings alongside better document triage outcomes. Built In also reports
              academic use at Princeton, Stanford, and the University of California, Berkeley. Those references matter
              because they show the product can appeal to both commercial and research buyers, but they are still a
              small set of marquee examples rather than a disclosed customer roster.
            claimRefs:
              - CU002
              - CU003
              - CU008
          - type: table
            tableRef: TC002
            claimRefs:
              - CU002
              - CU003
      - number: '6.3'
        title: Durability, concentration, and gaps
        blocks:
          - type: paragraph
            body: >
              What is missing is just as important: no public customer count, no NRR or GRR, no published cohort
              retention, and no disclosed concentration by account. That means the company’s customer story is still a
              wedge rather than a demonstrated scale engine. Partnerships with Nvidia and Google matter because they
              expand infrastructure access, but they are not the same as customer traction. The customer diligence
              question is therefore simple: are early users becoming repeat users, and is the product moving from a
              one-off fine-tune to a repeatable deployment pattern?
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU012
              - CU013
          - type: table
            tableRef: TC003
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The customer proof points are credible
            body: >-
              Bridgewater plus top universities is a better proof set than anonymous logos because it shows both
              enterprise and research fit.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: The install base is still opaque
            body: >-
              No public count, no retention data, and no concentration disclosure means the customer story cannot yet
              support a scale valuation by itself.
            calloutType: risk
            claimRefs:
              - CU004
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance and people risk
        blocks:
          - type: paragraph
            body: >
              The single biggest risk is concentration of control and talent. Murati’s control is unusually strong, but
              the founding team is small and already has seen multiple exits. Public reporting around Zoph, Metz,
              Schoenholz, and Tulloch shows that the company is not immune to poaching by OpenAI and Meta. That creates
              two problems at once: execution risk from losing key people and signaling risk when those departures
              happen while the company is trying to raise or re-rate capital.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR008
      - number: '7.2'
        title: Operational, product, and safety risk
        blocks:
          - type: paragraph
            body: >
              The product itself is open-weight, which is a strength and a risk. It helps buyers control data and
              deployment, but it also increases misuse exposure and raises the bar for safety controls. The company says
              it studies bio and cyber misuse, but the public evidence set does not include a mature red-team or
              compliance package. Operationally, the stack also depends on very large compute commitments, so the
              company can be healthy on paper and still fragile if infrastructure pricing, supply, or reliability
              shifts.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Financial and market risk
        blocks:
          - type: paragraph
            body: >
              Financially, the company sits in the uncomfortable middle ground between success and overvaluation. It has
              real revenue and a large seed round, but the valuation is far ahead of public disclosure, and the burn /
              margin picture is hidden. If revenue growth slows or repeat usage proves thin, the market can quickly
              reprice the story from frontier winner to capital-intensive niche platform. The downside case is not
              failure to launch; it is failure to convert launches into a repeatable, efficient business.
            claimRefs:
              - CR007
              - CR009
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Key-person risk is not theoretical
            body: >-
              The company has already lost multiple founders or senior researchers, so succession planning matters now
              rather than later.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Safety and partner dependency are linked
            body: >-
              Because the product is open-weight and compute-heavy, the company must manage safety and infrastructure
              risk at the same time.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis
        blocks:
          - type: paragraph
            body: >
              The bull case is straightforward: a founder-led AI lab with strong brand, real revenue, a major seed war
              chest, and products that address a real enterprise pain point. If Tinker becomes a repeatable fine-tuning
              platform and Inkling becomes a meaningful open-weight foundation model, the company could still compound
              into a major infrastructure franchise. The problem is that most of that thesis is forward-looking. Public
              evidence shows promise, but not yet enough scale or retention to call the price attractive.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
      - number: '8.2'
        title: Anti-thesis
        blocks:
          - type: paragraph
            body: >
              The anti-thesis is valuation compression. The company is already richly capitalized, but its revenue
              disclosure is partial, its customer proof is narrow, and its team has experienced visible churn. If growth
              slows or the market decides that open-weight tools are commoditizing, the valuation can move from "premium
              frontier lab" to "expensive niche platform" very quickly. That downside matters because the company’s
              current mark still reflects reputation and optionality more than fully proven recurring earnings.
            claimRefs:
              - CV002
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >
              The right posture is track, not chase. A bull case assumes product velocity, repeatable enterprise
              adoption, and monetization that scales faster than compute cost. A base case assumes useful but still
              narrow adoption with a high valuation multiple. A bear case assumes the company remains a prestige lab
              with good demos and modest commercial depth. Until more financial and customer data are public, the entry
              discipline should be driven by evidence of repeat usage, margin clarity, and stable leadership rather than
              by the existence of another large headline financing.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase
            body: >-
              The company deserves attention because it has revenue and real product traction, but the evidence is not
              yet strong enough to call the current price compelling.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV009
          - type: callout
            title: The multiple is already doing a lot of work
            body: >-
              If growth decelerates or open-weight competition intensifies, the valuation can compress faster than the
              underlying product narrative can recover.
            calloutType: risk
            claimRefs:
              - CV002
              - CV006
              - CV010
