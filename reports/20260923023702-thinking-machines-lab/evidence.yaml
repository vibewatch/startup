    relatedTableRefs:
      - TF003
  - type: missing-source
    severity: material
    topic: safety
    missingEvidence: Public red-team results, model card detail, or third-party security evaluation for Inkling and Tinker.
    whyItMatters: Open-weights distribution makes safety claims more important, not less.
    diligencePath: Request red-team reports and model governance artifacts.
