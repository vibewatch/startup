evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting rights detail, and any side-letter or investor governance terms.
    whyItMatters: >-
      Murati’s control profile affects succession risk, investor protections, and the practical meaning of the
      public-benefit structure.
    diligencePath: Request the latest cap table, stockholder voting summary, and board roster from management or counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market sizing
    missingEvidence: A credible external TAM/SAM study for customizable open-weight model fine-tuning and enterprise deployment.
    whyItMatters: Without a market-size benchmark, valuation and growth assumptions remain mostly narrative.
    diligencePath: Pull a market-research report or public industry analysis that isolates this niche rather than generic AI spend.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: minor
    topic: retention
    missingEvidence: Public retention, workflow-switching, or NRR data that would show whether Tinker creates durable lock-in.
    whyItMatters: Without retention data, moat claims remain mostly theoretical.
    diligencePath: Ask for cohort retention or repeat-usage evidence from management.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: blocking
    topic: burn
    missingEvidence: Audited burn, runway, and gross-margin disclosure.
    whyItMatters: >-
      These metrics are necessary to judge whether the reported revenue base is economically attractive or just
      compute-intensive.
    diligencePath: Request management financials or a board deck with burn, runway, and gross margin.
    relatedQuestionRefs:
