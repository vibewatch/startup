company:
  name: "Thinking Machines Lab"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Thinking Machines Lab is a San Francisco-based AI research and product company
    founded in February 2025 by former OpenAI CTO Mira Murati and a small group of
    OpenAI alumni. The company positions itself around open-weight, customizable,
    multimodal AI rather than a closed chatbot product, and it has already shipped
    Tinker and Inkling. Public reporting still leaves the exact current headcount,
    board composition, and revenue mix partly opaque, but the company has moved from
    a record $2 billion seed round to a growing product and partnership footprint.
sections:
  - id: "identity-and-control"
    title: "Identity, mission, and control"
    body: >
      Thinking Machines Lab presents itself as an artificial intelligence research
      and product company focused on AI systems that are more widely understood,
      customizable, and generally capable. The public-facing identity is unusually
      founder-centric: Mira Murati leads the company, the company has described itself
      as a public benefit corporation, and public coverage repeatedly frames the lab
      as an OpenAI alumni spinout rather than a conventional software startup. That
      matters because the company’s differentiation is as much cultural as technical:
      it is betting that openness, customization, and collaborative human-AI workflows
      can be a product strategy rather than a research slogan.
    claimRefs: ["CO001", "CO002", "CO005", "CO012"]
    tableRefs: ["TO001"]
  - id: "team-and-product-path"
    title: "Team formation and product path"
    body: >
      The founding bench is the other core fact pattern. Murati assembled a team that
      included John Schulman, Barret Zoph, Lilian Weng, Andrew Tulloch, and Luke Metz,
      all of whom had previously worked at OpenAI or adjacent frontier labs. That gave
      the company instant credibility, but it also created a concentration of key-person
      risk: the same talent depth that helped the company launch later made departures
      especially visible. The product path has now become clearer. Tinker came first as
      a cloud fine-tuning tool, and Inkling arrived later as the company’s first in-house
      open-weights model. The sequence suggests a platform strategy rather than a one-shot
      model release.
    claimRefs: ["CO003", "CO008", "CO009", "CO012"]
    tableRefs: ["TO002"]
  - id: "capital-and-scale"
    title: "Capital, scale, and open questions"
    body: >
      The capital story is extraordinary even by frontier-AI standards. In July 2025 the
      company closed a $2 billion seed round at a $12 billion post-money valuation, and the
      investor list included Andreessen Horowitz, Nvidia, Accel, ServiceNow, Cisco, AMD, and
      Jane Street. Reporting in 2025 and 2026 then described attempts to re-rate the company
      at much higher values, but those talks did not close. Current public estimates put the
      team in the low hundreds rather than the thousands, while the company’s compute plan and
      product ambitions have expanded materially. The main diligence gap is therefore not whether
      the lab can attract capital; it is whether that capital translates into durable revenue and
      repeatable customer adoption.
    claimRefs: ["CO006", "CO007", "CO010", "CO011"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
