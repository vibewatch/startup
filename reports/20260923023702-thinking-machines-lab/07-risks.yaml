company:
  name: "Thinking Machines Lab"
chapter:
  number: 7
  title: "Risks"
  summary: >
    Thinking Machines Lab’s risk profile is dominated by governance, talent, compute
    dependency, and financial opacity. The company has a strong brand and serious capital,
    but it has also suffered visible co-founder departures and public allegations around
    misconduct and internal conflict. Because the product is open-weight and compute-heavy,
    operational, safety, and partner risk all compound rather than offset each other. The
    central investment question is whether the company can stabilize its team and convert
    technical credibility into durable customer adoption before the market loses patience.
sections:
  - id: "governance"
    title: "Governance and people risk"
    body: >
      The single biggest risk is concentration of control and talent. Murati’s control is
      unusually strong, but the founding team is small and already has seen multiple exits.
      Public reporting around Zoph, Metz, Schoenholz, and Tulloch shows that the company
      is not immune to poaching by OpenAI and Meta. That creates two problems at once:
      execution risk from losing key people and signaling risk when those departures happen
      while the company is trying to raise or re-rate capital.
    claimRefs: ["CR001", "CR002", "CR006", "CR011"]
    tableRefs: ["TR001"]
  - id: "operational-and-model-risk"
    title: "Operational, product, and safety risk"
    body: >
      The product itself is open-weight, which is a strength and a risk. It helps buyers
      control data and deployment, but it also increases misuse exposure and raises the bar
      for safety controls. The company says it studies bio and cyber misuse, but the public
      evidence set does not include a mature red-team or compliance package. Operationally,
      the stack also depends on very large compute commitments, so the company can be healthy
      on paper and still fragile if infrastructure pricing, supply, or reliability shifts.
    claimRefs: ["CR003", "CR004", "CR005", "CR008"]
    tableRefs: ["TR002", "TR003"]
  - id: "financial-and-market-risk"
    title: "Financial and market risk"
    body: >
      Financially, the company sits in the uncomfortable middle ground between success and
      overvaluation. It has real revenue and a large seed round, but the valuation is far
      ahead of public disclosure, and the burn / margin picture is hidden. If revenue growth
      slows or repeat usage proves thin, the market can quickly reprice the story from
      frontier winner to capital-intensive niche platform. The downside case is not failure
      to launch; it is failure to convert launches into a repeatable, efficient business.
    claimRefs: ["CR007", "CR009", "CR012"]
