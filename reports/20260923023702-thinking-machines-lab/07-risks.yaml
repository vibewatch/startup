    title: "Regulatory / legal risk register"
    columns: ["risk", "severity", "likelihood", "why it matters", "diligence ask"]
    rows:
      - ["AI safety / misuse", "high", "medium", "Open weights can be repurposed by third parties", "Request red-team and policy docs"]
      - ["Employment / conduct disputes", "medium", "medium", "Public allegations can distract leadership and damage hiring", "Ask for internal investigation / HR controls"]
      - ["Public policy / compliance", "medium", "medium", "Global public policy hiring shows the issue is live", "Request compliance roadmap and policy owner"]
    notes: "The company has not publicly disclosed a major lawsuit, but open-weights safety and employment disputes remain active diligence topics."
    claimRefs: ["CR003", "CR006", "CR008"]
  - id: "TR002"
    title: "Operational / quality / security risk register"
    columns: ["risk", "severity", "likelihood", "why it matters", "diligence ask"]
    rows:
      - ["Compute concentration", "high", "high", "Nvidia and Google are critical to the stack", "Review infra dependency and alternative supply"]
      - ["Model safety", "high", "medium", "Open weights can be misused", "Review safety evaluation artifacts"]
      - ["Shipping cadence", "medium", "medium", "Long gaps would weaken the narrative", "Track release schedule and support load"]
    notes: "Operational risk is mostly a function of scale, safety, and the company’s dependence on external infrastructure."
    claimRefs: ["CR004", "CR005", "CR008", "CR009"]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns: ["dependency", "severity", "likelihood", "exposure", "mitigation"]
    rows:
      - ["Nvidia", "high", "high", "Compute and strategic investment concentration", "Secondary compute options and contract review"]
      - ["Google Cloud", "high", "medium", "Platform and hosting dependence", "Multi-cloud fallback and pricing clarity"]
      - ["Talent market", "high", "high", "Recruiting and retention pressure from bigger labs", "Retention packages and succession planning"]
    notes: "The partnership stack is a strength only if it remains affordable and non-exclusive."
    claimRefs: ["CR001", "CR004", "CR005", "CR006"]
callouts:
