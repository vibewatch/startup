company:
  name: "Thinking Machines Lab"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Thinking Machines Lab is not selling a consumer chatbot; it is trying to own the
    enterprise and developer market for customizable, open-weight AI. The market
    boundary is therefore narrower than "AI" in the abstract and broader than a single
    model release: it spans fine-tuning, self-hosted deployment, multimodal collaboration,
    and tooling that reduces the cost and complexity of adapting frontier models to
    private data and specialized workflows. That framing gives the company a real wedge,
    but it also means adoption depends on technical sophistication and clear ROI.
sections:
  - id: "market-boundary"
    title: "Boundary and substitute set"
    body: >
      The relevant market is AI customization infrastructure: cloud fine-tuning,
      self-hosted open-weight models, and developer tooling for adaptation and deployment.
      Buyers are typically researchers, startups, or enterprise teams that need private
      data handling, controllable outputs, or a tighter feedback loop than a generic API
      can provide. The substitute set is broad but concrete: closed-model APIs from
      OpenAI or Anthropic, open-weight models hosted in-house, and classic ML workflows
      built on internal compute. Thinking Machines wins only when customization matters
      more than convenience.
    claimRefs: ["CM001", "CM002", "CM003", "CM009"]
    tableRefs: ["TM001"]
  - id: "demand-and-adoption"
    title: "Demand drivers and adoption friction"
    body: >
      The company’s own messaging, plus third-party coverage, suggests demand is being
      pulled by three factors: the desire to keep sensitive data in house, the appeal of
      open weights that can be modified, and the need for systems that work well in
      human-in-the-loop workflows. That is a strong value proposition for regulated
      sectors, research teams, and custom enterprise deployments. The trade-off is that
      adoption is not frictionless. Teams need engineering depth, GPU access, compliance
      comfort, and enough usage intensity to justify the overhead of fine-tuning and
      hosting.
    claimRefs: ["CM004", "CM005", "CM007", "CM012"]
    tableRefs: ["TM002"]
  - id: "sizing-and-proof"
    title: "Sizing remains evidence-constrained"
    body: >
      Public market sizing is still highly constrained. There is no disclosed TAM for the
      company’s exact slice of the market, and the best public signals are indirect:
      usage-based compute fees on Tinker, a $100M-plus revenue run-rate reported in 2026,
      and a growing set of named proofs such as Bridgewater and academic users. Those
      signals are enough to show that a market exists, but not enough to tell us how large
      it is or how quickly it will commoditize. The diligence implication is that the
      business should be judged on workflow depth and retention, not on market-size rhetoric.
    claimRefs: ["CM006", "CM008", "CM010", "CM011"]
    tableRefs: ["TM003"]
    figureRefs: ["FM001"]
