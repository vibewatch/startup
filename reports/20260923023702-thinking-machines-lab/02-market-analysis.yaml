callouts:
  - calloutType: "insight"
    title: "The market is real, but narrow"
    body: "Thinking Machines is best viewed as an infrastructure vendor for teams that want control and customization, not as a broad AI app company."
    claimRefs: ["CM001", "CM002", "CM009"]
  - calloutType: "risk"
    title: "Adoption friction is the gating variable"
    body: "The key question is not whether customization is valuable; it is whether enough buyers will tolerate the operational overhead required to use it well."
    claimRefs: ["CM007", "CM010", "CM011"]
