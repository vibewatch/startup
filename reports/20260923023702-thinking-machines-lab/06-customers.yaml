      - ["Startup", "Founder / CTO", "Product / ML engineer", "Engineering budget", "Private-data fine-tuning"]
      - ["Regulated enterprise", "IT / security / data owner", "Domain team", "Platform budget", "Data-resident customization"]
    notes: "The segmentation is inferred from public usage examples and product messaging, not from a disclosed CRM export."
    claimRefs: ["CU001", "CU005"]
  - id: "TC002"
