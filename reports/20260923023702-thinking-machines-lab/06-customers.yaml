runDate: "2026-09-23"
company:
  name: "Thinking Machines Lab"
chapter:
  number: 6
  title: "Customers"
  summary: >
    Thinking Machines Lab’s public customer proof is still thin relative to its valuation,
    but the pattern that does exist is coherent. The company is targeting researchers,
    developers, startups, and larger enterprises that need model control and private-data
    adaptation. The strongest named proof point is Bridgewater, and public coverage also
    points to academic users at Princeton, Stanford, and Berkeley. That is enough to show
    demand, but not enough to show durable repeatable enterprise penetration or retention.
sections:
  - id: "customer-segmentation"
    title: "Customer segmentation and buying motion"
    body: >
      The customer set is concentrated in technically sophisticated buyers. Public reporting
      points to researchers, developers, startups, and regulated enterprises as the natural
      fit for Tinker and Inkling. That makes the buying motion mostly developer-led and
      workflow-led rather than consumer-led. The payer is often the team or platform budget
      owner, while the user is the engineering or research team that needs to adapt a model
      to private data, domain language, or specialized workflows. That is a good early-market
      shape, but it narrows the pool of buyers relative to a broad AI API.
    claimRefs: ["CU001", "CU005", "CU009"]
    tableRefs: ["TC001"]
  - id: "named-proof"
    title: "Named customer proof"
    body: >
      Bridgewater is the clearest proof point because public reporting says it fine-tuned a
      Qwen3-235B model with Tinker and saw large compute savings alongside better document
      triage outcomes. Built In also reports academic use at Princeton, Stanford, and the
      University of California, Berkeley. Those references matter because they show the
      product can appeal to both commercial and research buyers, but they are still a small
      set of marquee examples rather than a disclosed customer roster.
    claimRefs: ["CU002", "CU003", "CU008"]
    tableRefs: ["TC002"]
  - id: "durability-and-concentration"
    title: "Durability, concentration, and gaps"
    body: >
      What is missing is just as important: no public customer count, no NRR or GRR, no
      published cohort retention, and no disclosed concentration by account. That means the
      company’s customer story is still a wedge rather than a demonstrated scale engine.
      Partnerships with Nvidia and Google matter because they expand infrastructure access,
      but they are not the same as customer traction. The customer diligence question is
      therefore simple: are early users becoming repeat users, and is the product moving from
      a one-off fine-tune to a repeatable deployment pattern?
    claimRefs: ["CU004", "CU006", "CU007", "CU012", "CU013"]
    tableRefs: ["TC003"]
    figureRefs: ["FU001"]
