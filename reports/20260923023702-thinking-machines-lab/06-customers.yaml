    columns: ["name", "public evidence", "status", "what it proves"]
    rows:
      - ["Bridgewater", "Publicly cited Tinker fine-tune on Qwen3-235B", "Production-like", "High-value enterprise use case"]
      - ["Princeton", "Publicly cited user of Tinker", "Academic user", "Research validation"]
      - ["Stanford", "Publicly cited user of Tinker", "Academic user", "Research validation"]
      - ["UC Berkeley", "Publicly cited user of Tinker", "Academic user", "Research validation"]
    notes: "Named customers are public proof points, not a disclosure of total installed base."
    claimRefs: ["CU002", "CU003"]
  - id: "TC003"
    title: "Expansion and concentration risk table"
    columns: ["risk", "public signal", "why it matters", "diligence ask"]
    rows:
      - ["Account concentration", "No public customer count or mix", "Could be over-reliant on a few large users", "Request top-account concentration"]
      - ["Retention", "No public cohort data", "Hard to tell if users repeat", "Ask for repeat-use / renewal data"]
      - ["Channel dependence", "Research and developer led motion", "Growth may depend on a small set of technical champions", "Ask for activation and conversion metrics"]
    notes: "The company may have more users than it discloses, but the absence of public retention data is still a diligence gap."
    claimRefs: ["CU004", "CU006", "CU012", "CU013"]
