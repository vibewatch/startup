company:
  name: "Thinking Machines Lab"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Thinking Machines Lab’s product strategy is a stack, not a single model. Tinker is
    the developer-facing fine-tuning layer, Inkling is the flagship open-weights model,
    and the company’s research messaging adds interaction models and open science as a
    broader platform thesis. The technical pitch is coherent: combine customizable weights,
    multimodality, and human-centered interaction so buyers can adapt frontier AI to their
    own workflows. The question is not whether the technology is interesting; it is whether
    it can become a repeatable product advantage rather than a one-time launch.
sections:
  - id: "product-stack"
    title: "Product and workflow definition"
    body: >
      In customer terms, the company sells tools that let teams customize, fine-tune, and
      run frontier models without starting from scratch. Tinker is the operational layer:
      it abstracts distributed training and lets users tune open-weight models on private
      data. Inkling is the flagship model layer: a multimodal open-weights foundation model
      with a large context window and controllable thinking effort. The company’s broader
      research narrative adds interaction models and open science so the product story feels
      like a platform rather than a one-off model release.
    claimRefs: ["CP001", "CP002", "CP003", "CP005"]
    tableRefs: ["TT001"]
  - id: "architecture"
    title: "Architecture and operating model"
    body: >
      The architecture is built around customization and portability. Thinking Machines says
      it trains strong models with multimodal interaction, fine-tuning, and developer-facing
      abstractions; third-party guides describe Tinker as a LoRA-based training workflow for
      open models. Inkling itself is a very large MoE model that can be run locally only with
      serious hardware. That makes the stack suitable for technically sophisticated teams and
      less suitable for casual users, but it also gives the company a credible reason to exist
      beyond benchmark chasing.
    claimRefs: ["CP004", "CP006", "CP008", "CP011"]
    tableRefs: ["TT003"]
  - id: "trust-and-roadmap"
    title: "Trust, safety, and roadmap"
    body: >
      The company’s own messaging stresses a high safety bar, sharing best practices, and
      studying misuse risks for open weights. That matters because the open-weights strategy
      makes portability easier but can also widen safety exposure if the model is repurposed
      badly. The roadmap is still early: more models, more multimodal capability in Tinker,
      and broader access to the platform. In short, the company is not yet a mature product
      suite; it is a research-led system that is trying to turn model capability into workflow
      advantage.
    claimRefs: ["CP007", "CP009", "CP010", "CP012"]
    tableRefs: ["TT002"]
    figureRefs: ["FT001"]
