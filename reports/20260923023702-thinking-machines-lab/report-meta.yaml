companyProfile:
  summary: >-
    Thinking Machines Lab is a San Francisco-based AI research and product company founded in February 2025 by Mira
    Murati and a small group of OpenAI alumni. The company positions itself around open-weight, customizable, multimodal
    AI and has already shipped Tinker and Inkling. It has raised a $2 billion seed at a $12 billion valuation, attracted
    marquee infrastructure partners, and generated a public revenue run-rate north of $100 million, but it still keeps
    most financial and governance details private.
