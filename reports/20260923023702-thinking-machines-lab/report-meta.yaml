  topStrengths:
    - Founder pedigree is exceptional and helped the company raise a huge seed round.
    - 'The stack is coherent: Tinker, Inkling, and interaction-model research reinforce each other.'
    - Public revenue run-rate is now real, not just narrative.
    - Nvidia and Google partnerships materially de-risk compute access.
    - Open-weight positioning is attractive for regulated or privacy-sensitive buyers.
  topRisks:
    - Leadership churn and key-person risk are already visible.
    - Financial opacity keeps margin and runway judgment weak.
    - Open weights narrow the moat and can increase misuse exposure.
    - Compute and partner dependency are high.
    - Valuation still assumes more execution than public evidence proves.
  unresolvedGaps:
    - Audited burn, runway, and gross margin remain undisclosed.
    - Board composition and voting-right detail are not public.
    - Customer retention / NRR data is not public.
    - Public pricing or contract terms for Tinker are not disclosed.
