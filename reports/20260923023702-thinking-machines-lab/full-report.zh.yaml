  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接对手与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Thinking Machines 不是按消费者聊天机器人厂商的逻辑竞争。它真正的对标集合混合了闭源前沿实验室和开放权重模型生态。OpenAI、Anthropic 和 Google DeepMind
              争夺围绕前沿能力的同一心智，Meta、Mistral、Qwen、DeepSeek 和 Nemotron 也重要，因为它们提供开放模型，Thinking Machines 的客户可以选择微调这些模型，而不是购买专有
              API。也就是说，公司同时在和平台在位者、模型商品化作战。
            claimRefs:
              - CC001
              - CC002
              - CC004
              - CC005
          - type: table
            tableRef: TP001
            claimRefs:
              - CC001
              - CC002
              - CC004
      - number: '3.2'
        title: 产品策略的独特之处
        blocks:
          - type: paragraph
            body: >
              最清楚的差异化是 Thinking Machines 卖的是控制权。Tinker 让客户用私有数据微调开放权重模型，Inkling
              本身也是具备多模态能力、思考强度可控的开放权重基础模型。这套栈创造的购买路径不同于闭源聊天
              API：需要可审计性、可移植性和本地控制的买方，即使原始模型质量不是绝对第一，也可能更偏好它。公司对人机协作的叙事也让它区别于专注纯自治或单轮聊天机器人流程的实验室。
            claimRefs:
              - CC002
              - CC003
              - CC005
              - CC007
          - type: table
            tableRef: TP002
            claimRefs:
              - CC002
              - CC003
              - CC005
              - CC007
      - number: '3.3'
        title: 耐久性与切换成本压力
        blocks:
          - type: paragraph
            body: >
              开放权重论点有战略吸引力，但不是免费护城河。如果模型质量趋同、开放生态持续改善，买方可以以不高摩擦切换到其他开放模型或自托管栈。这意味着 Thinking Machines
              必须靠产品速度、客户成功和优于替代方案的工作流守住位置，而不只是靠品牌。最可能成为护城河的是 Tinker 工作流、围绕微调的用户体验，以及模型发布与开发者平台的组合；但只要公司停止出货，这些都可能被复制。
            claimRefs:
              - CC006
              - CC008
              - CC010
              - CC012
