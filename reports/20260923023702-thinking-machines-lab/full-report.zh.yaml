companyProfile:
  summary: >-
    Thinking Machines Lab 是一家总部位于 San Francisco 的 AI 研究与产品公司，Mira Murati 与一小群 OpenAI 前员工在 2025 年 2
    月创立。公司把自己定位在开放权重、可定制、多模态 AI 上，已经推出 Tinker 和 Inkling。它以 $12 billion 估值完成 $2 billion 种子轮，吸引头部基础设施伙伴，并拿到公开报道中超过 $100
    million 的年化收入，但大多数财务和治理细节仍不对外披露。
