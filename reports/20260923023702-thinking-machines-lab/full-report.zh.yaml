  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与变现
        blocks:
          - type: paragraph
            body: >
              公司看起来有两层变现。第一，Tinker 微调及配套平台使用可以收取按用量计费的算力费用。第二，一旦客户真正采用 Inkling
              或配套开放权重产品，公司可以靠模型发布和企业级部署变现。公开证据显示，第一层已经产生有意义收入，第二层仍处于验证阶段。这让公司比纯研究实验室更真实，但距离成熟、多元的软件公司还很远。
