            body: 领导层流动是真实尽调问题，因为创始团队规模小、专业度高，而且已经出现多次离职和替换。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界和替代集合
        blocks:
          - type: paragraph
            body: >
              这里的市场是 AI 定制化基础设施：云端微调、自托管开放权重模型，以及用于适配和部署的开发者工具。买方通常是研究人员、初创公司，或需要私有数据处理、可控输出、反馈回路比通用 API
              更紧的企业团队。替代集合很宽但具体：OpenAI 或 Anthropic 的闭源模型 API、内部托管的开放权重模型，以及基于内部算力搭建的传统 ML 工作流。只有当定制化比便利性更重要时，Thinking
              Machines 才能赢。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.2'
        title: 需求驱动与采用摩擦
        blocks:
          - type: paragraph
            body: >
              公司自身口径和第三方报道都显示，需求由三股力量拉动：敏感数据要留在内部、开放权重可以修改有吸引力、系统需要在人类在环工作流中表现稳定。这个价值主张很适合受监管行业、研究团队和定制企业部署。代价是采用并不无摩擦。团队需要工程深度、GPU
              可用性、合规信心，以及足够高的使用强度，才能证明微调和托管开销值得承担。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM012
      - number: '2.3'
        title: 规模判断仍受证据约束
        blocks:
          - type: paragraph
            body: >
              公开市场规模仍缺乏证据约束。公司所在细分市场没有披露 TAM，最好的公开信号也都是间接的：Tinker 按用量计费的算力费用、2026 年报道的 $100M+ 收入年化规模，以及 Bridgewater
              和学术用户等具名验证。这些信号足以说明市场存在，但不足以说明市场有多大、商品化会多快。尽调含义是，判断这门生意应看工作流深度和留存，而不是市场规模叙事。
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
