  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品和工作流定义
        blocks:
          - type: paragraph
            body: >
              按客户视角，公司卖的是一套工具，让团队无需从零开始，就能定制、微调并运行前沿模型。Tinker 是运营层：它抽象掉分布式训练，让用户用私有数据调校开放权重模型。Inkling
              是旗舰模型层：一个多模态开放权重基础模型，具备大上下文窗口和可控思考强度。公司更宽的研究叙事加入交互模型和开放科学，让产品故事更像平台，而不是一次性模型发布。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
          - type: table
            tableRef: TT001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >
              架构围绕定制化和可移植性搭建。Thinking Machines 称其训练强模型，支持多模态交互、微调和面向开发者的抽象；第三方指南把 Tinker 描述为面向开放模型、基于 LoRA
              的训练工作流。Inkling 本身是一个很大的 MoE 模型，只有严肃硬件才能本地运行。这让这套栈适合技术成熟团队，不太适合普通用户；但也给了公司一个可信理由，说明它存在不只是追逐基准榜。
