        title: 信任、安全与路线图
        blocks:
          - type: paragraph
            body: >
              公司自己的口径强调高安全门槛、分享最佳实践，并研究开放权重的误用风险。这一点重要，因为开放权重策略让可移植性更强，但模型一旦遭到不当改用，也会扩大安全暴露面。路线图仍早期：更多模型、Tinker
              中更多多模态能力，以及更广的平台访问。简言之，公司还不是成熟产品套件；它是一个研究驱动系统，正试图把模型能力转成工作流优势。
