        title: 资本基础与基础设施强度
        blocks:
          - type: paragraph
            body: >
              因为 $2 billion 种子轮，公司的资产负债表故事异常强；但经营模型也很吃算力。Nvidia 和 Google
              安排不只是商业关系，也是经济承诺，本质上用外部基础设施替代自建基础设施并放大规模。这降低前期资本开支，但不会让生意变便宜。关键尽调问题是，收入扩张能否快过算力账单膨胀。
