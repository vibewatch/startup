chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与控制权
        blocks:
          - type: paragraph
            body: >
              Thinking Machines Lab 对外把自己定义为一家人工智能研究与产品公司，专注于让 AI 系统更容易被广泛理解、可定制，并具备通用能力。它的公开形象异常围绕创始人展开：Mira Murati
              领导公司，公司称自己是公益公司，公开报道也反复把这家实验室写成 OpenAI
              前员工出走创业，而不是传统软件初创公司。这一点重要，因为公司的差异化不只在技术，也在文化：它押注开放性、定制化和协作式人机工作流可以成为产品策略，而不只是研究口号。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO008
              - CO009
              - CO011
      - number: '1.2'
        title: 团队组建与产品路径
        blocks:
          - type: paragraph
            body: >
              创始阵容是另一条核心事实线。Murati 组建的团队包括 John Schulman、Barret Zoph、Lilian Weng、Andrew Tulloch 和 Luke Metz，他们此前都在
              OpenAI 或其他前沿实验室工作。这让公司一开始就有信用，但也带来关键人风险集中：同样的人才密度帮助公司启动，后来也让离职尤其显眼。产品路径现在更清楚。Tinker 先作为云端微调工具推出，Inkling
              随后作为公司的首个自研开放权重模型发布。这个顺序更像平台策略，而不是一次性模型发布。
            claimRefs:
              - CO003
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO012
      - number: '1.3'
        title: 资本、规模与未解问题
        blocks:
          - type: paragraph
            body: >
              资本故事即便放在前沿 AI 里也很夸张。2025 年 7 月，公司以 $12 billion 投后估值完成 $2 billion 种子轮，投资方包括 Andreessen
              Horowitz、Nvidia、Accel、ServiceNow、Cisco、AMD 和 Jane Street。2025 和 2026
              年的报道随后称，公司曾试图以更高估值重定价，但谈判没有成交。当前公开估算把团队规模放在低数百人，而不是数千人；公司的算力计划和产品野心却已大幅扩张。因此，主要尽调缺口不是实验室能否吸引资本，而是这些资本能否转化为耐久收入和可重复的客户采用。
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
