        title: 图表
        blocks:
          - type: callout
            title: 市场真实，但边界窄
            body: Thinking Machines 更适合被看作一家服务于追求控制权和定制化团队的基础设施供应商，而不是泛 AI 应用公司。
            calloutType: insight
