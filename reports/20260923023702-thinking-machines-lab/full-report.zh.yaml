        title: 图表
        blocks:
          - type: callout
            title: 技术栈是连贯的
            body: Tinker、Inkling 和交互模型论点能拼在一起，好过一串互不相关的发布。
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP005
          - type: callout
            title: 技术深度只有持续出货才是护城河
            body: 复杂技术栈有价值，但前提是它持续转化为产品发布、客户赢单和更好的工作流。
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP012
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与购买路径
        blocks:
          - type: paragraph
            body: >
              客户集中在技术成熟买方中。公开报道显示，研究人员、开发者、初创公司和受监管企业天然适配 Tinker 和
              Inkling。这让购买路径主要由开发者和工作流牵引，而不是消费者牵引。付款方往往是团队或平台预算负责人，用户则是需要把模型适配到私有数据、行业语言或专门工作流上的工程或研究团队。这是不错的早期市场形态，但相较泛
              AI API，也压窄了买方池。
            claimRefs:
              - CU001
              - CU005
              - CU009
          - type: table
            tableRef: TC001
            claimRefs:
              - CU001
              - CU005
      - number: '6.2'
        title: 具名客户验证
        blocks:
          - type: paragraph
            body: >
              Bridgewater 是最清楚的验证点，因为公开报道说，它用 Tinker 微调了 Qwen3-235B 模型，在文档分诊结果更好的同时节省了大量算力。Built In 还报道
              Princeton、Stanford 和 University of California, Berkeley
              的学术使用。这些参考有意义，因为它们说明产品能同时吸引商业和研究买方；但它们仍是一小组招牌案例，而不是已披露客户名单。
            claimRefs:
              - CU002
              - CU003
              - CU008
          - type: table
            tableRef: TC002
            claimRefs:
              - CU002
              - CU003
      - number: '6.3'
        title: 耐久性、集中度与缺口
        blocks:
          - type: paragraph
            body: >
              同样重要的是缺失项：没有公开客户数、没有 NRR 或 GRR、没有发布队列留存、没有披露按账户的集中度。这意味着公司的客户故事仍是一个切入口，而不是已验证的规模引擎。Nvidia 和 Google
              伙伴关系有意义，因为它们扩大基础设施访问，但这不等同于客户牵引力。因此，客户尽调问题很简单：早期用户是否变成重复用户，产品是否从一次性微调走向可重复部署模式？
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU012
              - CU013
          - type: table
            tableRef: TC003
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
      - number: '6.4'
        title: 图表
        blocks:
          - type: callout
            title: 客户验证点可信
            body: Bridgewater 加上顶尖大学，比匿名客户标识更好的验证集合，因为它同时显示企业和研究适配。
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: 装机基础仍不透明
            body: 没有公开数量、没有留存数据、没有集中度披露，意味着客户故事本身还撑不起规模化估值。
            calloutType: risk
            claimRefs:
              - CU004
              - CU007
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 治理与人事风险
        blocks:
          - type: paragraph
            body: >
              最大的单一风险是控制权和人才集中。Murati 的控制力异常强，但创始团队规模小，已经出现多次离职。围绕 Zoph、Metz、Schoenholz 和 Tulloch 的公开报道显示，公司并不能免于 OpenAI
              和 Meta 挖角。这同时制造两个问题：关键人才流失带来的执行风险，以及这些离职发生在公司试图融资或重定价估值时带来的信号风险。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR008
      - number: '7.2'
        title: 运营、产品与安全风险
        blocks:
          - type: paragraph
            body: >
              产品本身是开放权重，这既是优势也是风险。它帮助买方控制数据和部署，但也增加误用暴露面，并抬高安全控制门槛。公司称其研究生物和网络误用，但公开证据中还没有成熟的红队或合规包。运营上，这套栈还依赖很大的算力承诺，所以公司可以账面健康，却在基础设施定价、供给或可靠性变化时依然脆弱。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 财务与市场风险
        blocks:
          - type: paragraph
            body: >
              财务上，公司处在成功与高估之间不舒服的中间地带。它有真实收入和大额种子轮，但公开披露远跟不上估值，烧钱和利润率仍看不清。如果收入增长放慢，或重复使用很薄，市场可以很快把故事从前沿赢家重定价为资本密集型小众平台。下行情形不是无法发布产品，而是无法把发布转成可重复、高效率的生意。
            claimRefs:
              - CR007
              - CR009
              - CR012
      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 关键人风险不是理论
            body: 公司已经失去多名创始人或高级研究员，因此继任规划现在就重要，而不是以后才重要。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 安全和伙伴依赖相互绑定
            body: 因为产品是开放权重且重算力，公司必须同时管理安全和基础设施风险。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点
        blocks:
          - type: paragraph
            body: >
              牛市情形很直接：创始人主导的 AI 实验室，品牌强、有真实收入、有大额种子弹药库，产品击中真实企业痛点。如果 Tinker 成为可重复的微调平台，Inkling
              成为有意义的开放权重基础模型，公司仍可能滚成一家重要基础设施平台。问题是，大部分论点都面向未来。公开证据显示希望，但规模和留存还不足以证明价格有吸引力。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
      - number: '8.2'
        title: 反向论点
        blocks:
          - type: paragraph
            body: >
              反向论点是估值压缩。公司资本已经很充足，但收入披露不完整、客户验证窄、团队出现明显流动。如果增长放慢，或市场认定开放权重工具正在商品化，估值可能很快从「高溢价前沿实验室」变成「昂贵的小众平台」。这个下行重要，因为公司当前估值仍更多反映声誉和可选性，而不是已经完全验证的经常性收益。
            claimRefs:
              - CV002
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >
              正确姿态是跟踪，不是追高。牛市情形假设产品速度、可重复企业采用，以及变现扩张快过算力成本。基准情形假设采用有用但仍窄，同时估值倍数很高。熊市情形假设公司仍是演示效果好、商业深度有限的声望实验室。在更多财务和客户数据公开之前，入场纪律应由重复使用证据、利润率清晰度和领导层稳定性驱动，而不是由又一轮大额融资标题驱动。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 跟踪，不要追高
            body: 公司有收入和真实产品牵引力，值得关注；但现有证据还不足以说明当前价格有吸引力。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV009
          - type: callout
            title: 倍数已经承担了很多叙事
            body: 如果增长减速或开放权重竞争加剧，估值压缩可能快过底层产品叙事的修复速度。
            calloutType: risk
            claimRefs:
              - CV002
              - CV006
              - CV010
