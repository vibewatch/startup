company:
  name: "Thinking Machines Lab"
chapter:
  number: 8
  title: "Valuation"
  summary: >
    Thinking Machines Lab still looks like a premium frontier-AI asset, but the public
    evidence does not support treating the current valuation as a settled floor. The seed
    round priced the company at $12 billion before it had shipped a product; later $40B to
    $60B rerating attempts did not close; and by September 2026 the company was still being
    described as a $12 billion asset with $100M-plus revenue run-rate. That is enough to
    justify a track-worthy franchise, not enough to justify complacency about the entry
    multiple.
sections:
  - id: "thesis"
    title: "Investment thesis"
    body: >
      The bull case is straightforward: a founder-led AI lab with strong brand, real revenue,
      a major seed war chest, and products that address a real enterprise pain point. If Tinker
      becomes a repeatable fine-tuning platform and Inkling becomes a meaningful open-weight
      foundation model, the company could still compound into a major infrastructure franchise.
      The problem is that most of that thesis is forward-looking. Public evidence shows promise,
      but not yet enough scale or retention to call the price attractive.
    claimRefs: ["CV001", "CV004", "CV005", "CV011"]
    tableRefs: ["TV001"]
  - id: "anti-thesis"
    title: "Anti-thesis"
    body: >
      The anti-thesis is valuation compression. The company is already richly capitalized,
      but its revenue disclosure is partial, its customer proof is narrow, and its team has
      experienced visible churn. If growth slows or the market decides that open-weight tools
      are commoditizing, the valuation can move from "premium frontier lab" to "expensive
      niche platform" very quickly. That downside matters because the company’s current mark
      still reflects reputation and optionality more than fully proven recurring earnings.
    claimRefs: ["CV002", "CV006", "CV009", "CV010"]
    tableRefs: ["TV002"]
  - id: "scenario-and-entry"
    title: "Scenario framing and entry discipline"
    body: >
      The right posture is track, not chase. A bull case assumes product velocity, repeatable
      enterprise adoption, and monetization that scales faster than compute cost. A base case
      assumes useful but still narrow adoption with a high valuation multiple. A bear case
      assumes the company remains a prestige lab with good demos and modest commercial depth.
      Until more financial and customer data are public, the entry discipline should be driven
      by evidence of repeat usage, margin clarity, and stable leadership rather than by the
      existence of another large headline financing.
    claimRefs: ["CV003", "CV007", "CV008", "CV012"]
    tableRefs: ["TV003"]
