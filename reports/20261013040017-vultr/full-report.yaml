            title: Private Financial Opacity and Debt Service Burden
            body: >-
              While Vultr claims operating profitability, its financials remain unverified by audited public filings,
              and its $329 million debt financing introduces material liquidity and debt-service considerations amid
              intense hyperscaler competition.
