  - id: FU001
    title: Evidence-based customer adoption and trust journey
    type: journey-map
    summary: >-
      The public evidence supports entry and scaling surfaces, but the path breaks at commercial durability and includes
      a policy-trust remediation loop.
    data:
      items:
        - label: Self-service compute entry
          actor: Developer or infrastructure team
          touchpoints:
            - Low-cost virtual servers
            - Hourly accelerator pricing
          painpoint: Public evidence does not disclose conversion from evaluation to a paid recurring cohort.
          opportunity: Multiple hourly products lower the observable technical entry barrier.
        - label: Workload specialization
          actor: AI, research, graphics, or platform team
          touchpoints:
            - Training and inference accelerators
            - HPC, analytics, graphics, and virtual-desktop workloads
          painpoint: Named users and measured customer outcomes are absent from the assigned evidence.
          opportunity: Six published NVIDIA offers address distinct workload profiles.
        - label: Geographic deployment
          actor: Distributed engineering or operations team
          touchpoints:
            - 32 reported regions
            - Six-continent footprint
          painpoint: Regional utilization and revenue distribution are not disclosed.
          opportunity: Broad geographic presence can support latency and locality requirements.
        - label: Capacity expansion
          actor: AI infrastructure buyer
          touchpoints:
            - Additional GPU acquisition intent
            - AMD and NVIDIA availability
          painpoint: Booked demand, capacity commitments, and accelerator utilization are unknown.
          opportunity: Financing provides a stated route to expand GPU supply.
        - label: Policy trust challenge
          actor: Existing self-hosting customer
          touchpoints:
            - Terms-of-service acceptance
            - Support and account access
          painpoint: One user claimed lockout and other users claimed cancellations after disputed terms.
          opportunity: Clearer terms and support escalation can reduce avoidable switching friction.
        - label: Retention and expansion proof
          actor: Investor or enterprise procurement team
          touchpoints:
            - Renewal and contract review
            - Cohort and concentration analysis
          painpoint: NRR, GRR, churn, contract duration, and concentration are not public in the retained evidence.
          opportunity: Data-room cohort and contract evidence could convert product breadth into an underwritable durability case.
    approximationNotes: >-
      This is an analytical evidence journey, not a measured funnel; it does not imply conversion rates, stage order for
      every customer, or a common population.
    claimRefs:
      - CU001
      - CU004
      - CU010
      - CU011
      - CU013
