      - - AI Infrastructure
        - Strategic alignment with AMD and NVIDIA enables rapid adoption of advanced GPUs like GH200 and MI300X
        - Cloud providers that do not design proprietary chips face vendor margin capture and hardware allocation risks
        - Demonstrated durable gross margins above 50% across AI model training and inference workloads
      - - Valuation Support
        - Validation from sophisticated institutional sponsors including LuminArx, AMD, Goldman Sachs, and top banks
        - $3.5B valuation established in late 2024 may reflect peak cycle multiples in unlisted secondary markets
        - Release of audited ARR, GAAP revenue growth rates, and positive free cash flow metrics
    notes: Core strategic and structural tensions across product, market demand, capitalization, and hyperscaler competition.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Enterprise AI cluster adoption surges, GPU utilization exceeds 85%, and cloud revenue grows over 40% annually
        - Valuation expands to $5.0B–$6.0B driven by public IPO execution or premium strategic consolidation
        - Execution bottleneck in high-density data center buildouts or power availability constraints
        - 25% — Dependent on massive enterprise GPU cluster migration away from hyperscalers
      - - Base Case
        - Steady expansion across independent developer and mid-market accounts; GPU infrastructure scales profitably
        - Valuation remains stable around the $3.5B mark, yielding modest hold returns while debt is amortized
        - Compression in compute pricing margins and increased financing costs upon credit refinancing
        - 50% — Consistent with historical measured scaling and competitive market dynamics
      - - Bear Case
        - GPU overcapacity in market, hyperscaler price wars, and customer churn among self-serve accounts
        - Valuation contracts below $2.5B; debt service requirements force dilutive restructuring or down-round
        - Inability to maintain covenants on $329M credit facility during AI infrastructure cycle downswing
        - 25% — Heightened by macroeconomic volatility and aggressive capital spending across the cloud sector
    notes: >-
      Scenario analysis modeling exit returns and capital needs based on $3.5B Dec 2024 post-money mark and $329M debt
      facility.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV009
      - CV011
      - CV014
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of Vultr from bootstrapped hosting origins in 2014 to $3.5B valuation and syndicated
      credit financing in 2024–2026.
    approximationNotes: All milestone dates derived from corporate news announcements, CNBC reporting, and published company histories.
    data:
      items:
        - label: '2014-02: Founding & Bootstrapped Launch'
          date: 2014-02
          detail: >-
            David Aninowsky establishes Vultr under The Constant Company, LLC, focusing on developer-friendly VPS cloud
            compute with 100% SSD storage without outside capital.
          tone: positive
        - label: '2021-06: Initial Debt & GPU Infrastructure'
          date: 2021-06
          detail: >-
            Vultr initiates early cloud GPU investments and raises an initial $150 million debt facility from Bank of
            America and JPMorgan.
          tone: neutral
        - label: '2022-12: $125M ARR Milestone'
          date: 2022-12
          detail: >-
            Reaches reported milestone of over $125 million in annual recurring revenue across developer accounts
            worldwide while remaining self-funded.
          tone: positive
        - label: '2024-02: Deploy Interface Modernization'
          date: 2024-02
          detail: >-
            Launches deploy-beta interface to streamline multi-region instance provisioning and NVMe block storage
            attachment across 32 data center regions.
          tone: neutral
        - label: '2024-12: $333M First Outside Equity at $3.5B Valuation'
          date: 2024-12
          detail: >-
            Completes first external equity funding round led by LuminArx Capital Management and AMD Ventures, valuing
            Vultr at $3.5 billion.
          tone: positive
        - label: '2025-06: $329M Wall Street Syndicated Credit Package'
          date: 2025-06
          detail: >-
            Secures $255 million syndicated credit facility and $74 million in lease financing led by JPMorgan, Bank of
            America, and Wells Fargo.
          tone: neutral
        - label: '2025-10: VX1 AMD EPYC Compute Launch'
          date: 2025-10
          detail: >-
            Introduces VX1 cloud compute instances powered by AMD EPYC processors, claiming up to 82% better performance
            per dollar versus hyperscalers.
          tone: neutral
        - label: '2026-06: Global Cloud Expansion & HPE Partnership'
          date: 2026-06
          detail: >-
            Expands footprint across 33 cloud locations and announces enterprise AI infrastructure integration with HPE
            at HPE Discover 2026.
          tone: positive
