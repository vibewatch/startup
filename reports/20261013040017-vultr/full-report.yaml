        title: Exhibits
        blocks:
          - type: callout
            title: Bootstrapped Discipline vs. Institutional Capital Infusion
            body: >-
              Vultr's decade of profitable self-funding established a globally distributed 32-region infrastructure
              footprint before taking outside equity, distinguishing its capital efficiency from venture-dependent cloud
              providers.
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
              - CO003
