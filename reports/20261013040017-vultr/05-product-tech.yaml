callouts:
  - calloutType: "strength"
    title: "Open Composable Architecture and Dual-Vendor GPU Strategy"
    body: "Vultr distinguishes its AI infrastructure by offering both AMD Instinct MI300X and NVIDIA GPU accelerators coupled with open Broadcom and Juniper Ethernet networking. This open ecosystem approach reduces sole-source dependency on NVIDIA's proprietary CUDA fabric while enabling competitive pricing for enterprise inference workloads."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE012"
  - calloutType: "risk"
    title: "Third-Party Colocation and Semiconductor Supply Exposure"
    body: "Unlike hyperscale competitors that design custom silicon and own mega-scale data center facilities, Vultr relies entirely on merchant semiconductor allocations from NVIDIA and AMD and leases space across 32 commercial colocation facilities. Tight GPU allocations or datacenter power limits could constrain capacity expansion."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE014"
