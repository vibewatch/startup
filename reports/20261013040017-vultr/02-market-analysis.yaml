- calloutType: insight
  title: Hyperscaler Concentration Leaves a Multibillion-Dollar Unbundled Wedge
  body: While the Big Three hold 63% of enterprise cloud spend, the sheer expansion of the 90 billion annual market creates
    substantial addressable room for independent providers offering transparent pricing, zero complex lock-in, and rapid GPU
    provisioning.
  claimRefs:
  - CM004
  - CM005
  - CM007
  - CM008
- calloutType: risk
  title: Capital Intensity and Enterprise Inertia Cap Neocloud Addressability
  body: Capturing high-value enterprise workloads requires significant data center footprint and sustained hardware capex,
    while corporate inertia and hyperscaler enterprise discount commitments limit the speed of multi-cloud adoption.
  claimRefs:
  - CM005
  - CM006
  - CM010
  - CM015
