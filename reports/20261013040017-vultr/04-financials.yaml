company:
  name: Vultr
chapter:
  number: 4
  title: Financials
  summary: Vultr pairs a ten-year bootstrapped developer hosting core with $329 million in bank debt and $333 million in equity to scale AI infrastructure. Despite operating over 1.5 million customer accounts across 32 global data centers, the company keeps ARR, gross margins, and debt covenants private, creating material diligence gaps.
sections:
  - id: revenue-streams-and-pricing-architecture
    title: Revenue Streams and Pricing Architecture
    body: Vultr generates revenue primarily through on-demand utility billing and reserved instance commitments across cloud compute, accelerated GPU systems, bare metal servers, and attached storage. Historically, the company operated as a self-funded developer infrastructure platform specializing in low-cost virtual private servers (VPS), starting at $2.50 per month. Management projects that specialized GPU cloud leasing will expand rapidly to represent the single largest share of total revenue. Published catalog pricing reflects transparent per-hour tiers, ranging from entry-level inference accelerators such as NVIDIA A16 at $0.033 per hour to high-performance HGX H100 clusters starting at $19.988 per hour and NVIDIA GH200 systems at $4.335 per hour. However, realized revenue deviates materially from published list prices due to unpublicized enterprise discount schedules, committed-use volume agreements, and introductory developer promotions.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI009
      - CI010
    tableRefs:
      - TI001
      - TI002
  - id: unit-economics-and-cost-structure
    title: Unit Economics and Cost Structure Dynamics
    body: The unit economics of Vultr exhibit a sharp bifurcation between high-margin legacy commodity compute and capital-intensive GPU hosting. With over 1.5 million customer accounts across 185 countries, a large proportion of users generate low average revenue per user (ARPU), spending only a few dollars per month on basic virtual servers. In contrast, artificial intelligence enterprise workloads demand continuous hardware investments in high-density facilities, such as the multi-thousand AMD Instinct MI300X cluster deployed in Chicago. Because Vultr procures standard silicon from NVIDIA and AMD rather than designing proprietary accelerators, cost of goods sold is dominated by hardware amortization, equipment lease obligations, data center power density, and colocation fees. While legacy CPU hosting delivers strong baseline gross margins, accelerated computing introduces volatile margin profiles dependent on sustained fleet utilization and rising power costs.
    claimRefs:
      - CI006
      - CI007
      - CI011
      - CI012
    tableRefs:
      - TI003
    figureRefs:
      - FI001
  - id: capital-structure-and-financing-dependency
    title: Capital Structure, Debt Facilities, and Financing Dependency
    body: To finance capital expenditures without diluting equity during an era of hyperscaler expansion, Vultr transitioned from a purely bootstrapped operator to an institutional borrower. In June 2025, the company secured a $329 million credit financing package, featuring a $255 million syndicated credit facility co-led by J.P. Morgan, Bank of America, and Wells Fargo, alongside a $74 million equipment lease facility arranged by Bank of America. Management claims this syndicated debt facility was priced at an interest rate hundreds of basis points below competitor CoreWeave’s 9.25 percent debt terms. This follows a December 2024 equity round of $333 million at a $3.5 billion valuation led by LuminArx Capital Management and AMD Ventures. While these capital injections validate Wall Street lending appetite, independent cloud providers face structural refinancing risk relative to cash-rich megacap hyperscalers.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI013
  - id: financial-verdict-and-underwriting-gaps
    title: Financial Verdict and Underwriting Gaps
    body: From an investment diligence standpoint, Vultr presents a validated operational engine with meaningful private disclosure deficits. While regional filings such as Vultr India Private Limited confirm localized commercial momentum with annual revenue between 10 crore and 50 crore INR, parent-level financial performance remains closely held. The company has not publicly reported consolidated annual recurring revenue, gross margins by product family, net revenue retention, or audited free cash flow. Although management asserts that the business is profitable overall, the lack of third-party audited financial statements, unreleased debt covenant details, and undisclosed customer concentration metrics prevent underwriting a definitive buy recommendation at the December 2024 $3.5 billion valuation mark.
    claimRefs:
      - CI006
      - CI014
      - CI015
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Unit / Pricing Basis
      - Current Value / Status
      - Revenue Quality
      - Diligence Ask
    rows:
      - - Cloud Compute (Shared & Dedicated CPU)
        - Usage-based hourly billing and monthly fixed caps
        - Per vCPU hour ($2.50 to $640.00 / month)
        - Core legacy revenue base; self-funded foundation
        - High; stable developer and small-business hosting base
        - Customer churn rate and gross margin by compute tier
      - - Cloud GPU (NVIDIA & AMD Clusters)
        - On-demand hourly rental and multi-month reservations
        - Per GPU hour ($0.033 to $19.988 / hour)
        - Fastest-growing revenue driver; GPU fleet expansion
        - Moderate-variable; dependent on cluster utilization and power costs
        - Committed contract duration, prepayment terms, and renewal rates
      - - Bare Metal Infrastructure
        - Single-tenant dedicated hardware provisioning
        - Monthly hardware instance lease
        - Established enterprise workload hosting across 32 regions
        - High; sticky multi-tenant workloads with low operational churn
        - Hardware replacement cycles and residual equipment value
      - - Storage & Networking Attach
        - Metered block storage, object storage, and egress bandwidth
        - Per GB stored ($0.01/GB) and per TB data transfer
        - High-margin complementary attach services to virtual instances
        - High; low incremental delivery cost and strong retention lock-in
        - Attach rate per active compute instance and net egress contribution
    notes: Compiled from official Vultr service specifications and press announcements; realized revenue mix and stream-specific ARR remain private and undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI009
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product Family
      - List Price / Unit
      - Contract Structure
      - List vs Realized Dynamic
      - Discounts & Unknowns
      - Source Reference
    rows:
      - - Standard Cloud Compute (Shared CPU)
        - $2.50 to $96.00 / month
        - Hourly on-demand, no minimum duration
        - Realized pricing closely tracks published list rates
        - Promotional onboarding credits ($100-$250) for developers
        - Official Pricing (SI003)
      - - High-End NVIDIA HGX H100 GPU
        - From $19.988 / GPU hour
        - Hourly on-demand or multi-month reservation
        - Realized pricing discounted on annual enterprise commitments
        - Volume discount tiers and cluster reservation discounts undisclosed
        - Official Pricing (SI003)
      - - Entry-Level NVIDIA A16 / A40 GPU
        - From $0.033 to $0.082 / GPU hour
        - Hourly on-demand fractional allocation
        - List pricing standard for developer inference and VDI workloads
        - Spot availability and burst usage preemption terms unpublished
        - Official Pricing (SI003)
      - - NVIDIA GH200 Grace Hopper Superchip
        - From $4.335 / hour
        - On-demand and reserved instance allocations
        - Realized enterprise contracts negotiated with supercomputer clusters
        - Regional availability limits across global data centers
        - Official Pricing (SI003)
    notes: List pricing verified from public Vultr catalog snapshots as of 2024-2026; volume enterprise discounts and custom cluster terms require bilateral non-disclosure disclosure.
    claimRefs:
      - CI009
      - CI010
  - id: TI003
    title: Unit economics table
    columns:
      - Financial Metric
      - Reported Value
      - Confidence
      - Underwriting Impact
      - Diligence Requirement
    rows:
      - - Customer Account Count
        - 1.5M+ total registered; hundreds of thousands active
        - High
        - Validates extensive developer adoption and global platform reach
        - Breakdown of paying monthly accounts versus inactive developer tiers
      - - Average Revenue Per User (ARPU)
        - Unreported (Low; a few dollars per month for long-tail)
        - Medium
        - Demonstrates high volume of low-spending developer accounts
        - ARPU segmentation separating CPU hosting from enterprise GPU clusters
      - - Gross Margin by Product Line
        - Unreported
        - Low
        - Critical to assessing profitability post-power and hardware lease costs
        - GAAP gross margins separating commodity VPS from accelerated GPUs
      - - Net Revenue Retention (NRR)
        - Unreported
        - Low
        - Reflects enterprise expansion velocity and net dollar churn dynamics
        - Historical NRR schedules by cohort over trailing 24 months
      - - Customer Acquisition Cost (CAC) & Payback
        - Unreported
        - Low
        - Measures marketing efficiency between self-serve and direct enterprise sales
        - Blended and channel-specific CAC and payback periods
    notes: Values reflect public filings and management interview statements; unreported cells represent critical diligence gaps requiring private financial disclosures.
    claimRefs:
      - CI006
      - CI007
      - CI014
      - CI015
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Operational flow illustrating how customer compute demand converts into cash flow and margin.
    data:
      nodes:
        - label: Customer Workload Provisioning
          detail: Developer and enterprise consumption of vCPU, storage, and specialized GPU instances
        - label: Usage Metering & Invoicing
          detail: Hourly metering converted into prepaid balances, credit card charges, or enterprise invoicing
        - label: Direct Infrastructure Costs
          detail: Data center colocation leases, power draw, network transit, and GPU hardware lease amortization
        - label: Gross Margin Realization
          detail: Unit margin generated post-infrastructure delivery; high on legacy VPS, compressed on commoditized GPUs
        - label: Operating Overhead Allocation
          detail: Engineering, infrastructure software maintenance, developer support, and GTM execution
        - label: Operating Cash Generation
          detail: Self-funding baseline cash flow supplemented by external credit facilities for large-scale GPU capex
    approximationNotes: Conceptual flow model reflecting Vultr utility billing architecture and infrastructure delivery model.
    claimRefs:
      - CI008
      - CI011
      - CI012
callouts:
  - calloutType: risk
    title: Capital Intensity and Syndicated Debt Dependency
    body: Unlike hyperscalers funding AI data centers from massive cloud operating cash flows, Vultr relies on external growth equity and syndicated bank credit facilities. Carrying $329M in credit and lease financing exposes the business to refinancing risk and debt service pressure if GPU rental utilization falters.
    claimRefs:
      - CI003
      - CI007
      - CI013
  - calloutType: insight
    title: 'Bifurcated Revenue Economics: Legacy VPS vs. High-Capex GPUs'
    body: 'Vultr operates two structurally distinct businesses under one brand: a mature, self-funded developer VPS platform with sticky, low-ARPU customers, and a nascent, capital-heavy GPU cloud fleet with high dollar-per-hour billing but compressed gross margins after power and accelerator lease amortization.'
    claimRefs:
      - CI002
      - CI007
      - CI008
      - CI009
