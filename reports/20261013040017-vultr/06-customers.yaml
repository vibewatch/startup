  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-gap
      missingEvidence: Named end-customer production deployments, workload scope, duration, and measurable customer outcomes.
      whyItMatters: Anonymous complaint evidence and product breadth cannot establish enterprise reference quality or production adoption.
      diligencePath: Request a management-provided customer roster and independently interview at least three current production customers across general compute and AI workloads.
      relatedQuestionRefs:
        - QU003
        - QU008
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: durability-gap
      missingEvidence: NRR, GRR, logo churn, renewal rates, contract duration, and cohort expansion by customer segment.
      whyItMatters: Without cohort evidence, published products, prices, and regions cannot be translated into durable recurring revenue.
      diligencePath: Review monthly and annual account cohorts, renewal schedules, expansion bridges, and cancellation reasons in the data room.
      relatedQuestionRefs:
        - QU004
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Revenue shares for the top 1, top 5, top 10, and top 25 customers plus partner- and channel-attributed revenue.
      whyItMatters: Undisclosed concentration could make reported infrastructure breadth economically dependent on a small number of accounts or counterparties.
      diligencePath: Reconcile audited customer revenue schedules to contracts, billing records, and partner referrals, including termination rights and renewal dates.
      relatedQuestionRefs:
        - QU006
    - type: stale
      severity: material
      topic: adoption-freshness
      missingEvidence: Current 2026 customer count, accelerator utilization, regional utilization, workload mix, and case studies with dated measurable outcomes.
      whyItMatters: Most retained quantitative and customer-behavior evidence dates to 2024-2025 and may not describe the current customer base.
      diligencePath: Obtain October 2026 operating dashboards and current customer references, then reconcile them with billing and capacity records.
      relatedQuestionRefs:
        - QU002
        - QU008
