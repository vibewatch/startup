figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronological evolution of Vultr from bootstrapped hosting origins in 2014 to $3.5B valuation and syndicated credit financing in 2024–2026.
    approximationNotes: All milestone dates derived from corporate news announcements, CNBC reporting, and published company histories.
    data:
      items:
        - label: '2014-02: Founding & Bootstrapped Launch'
          date: 2014-02
          detail: David Aninowsky establishes Vultr under The Constant Company, LLC, focusing on developer-friendly VPS cloud compute with 100% SSD storage without outside capital.
          tone: positive
        - label: '2021-06: Initial Debt & GPU Infrastructure'
          date: 2021-06
          detail: Vultr initiates early cloud GPU investments and raises an initial $150 million debt facility from Bank of America and JPMorgan.
          tone: neutral
        - label: '2022-12: $125M ARR Milestone'
          date: 2022-12
          detail: Reaches reported milestone of over $125 million in annual recurring revenue across developer accounts worldwide while remaining self-funded.
          tone: positive
        - label: '2024-02: Deploy Interface Modernization'
          date: 2024-02
          detail: Launches deploy-beta interface to streamline multi-region instance provisioning and NVMe block storage attachment across 32 data center regions.
          tone: neutral
        - label: '2024-12: $333M First Outside Equity at $3.5B Valuation'
          date: 2024-12
          detail: Completes first external equity funding round led by LuminArx Capital Management and AMD Ventures, valuing Vultr at $3.5 billion.
          tone: positive
        - label: '2025-06: $329M Wall Street Syndicated Credit Package'
          date: 2025-06
          detail: Secures $255 million syndicated credit facility and $74 million in lease financing led by JPMorgan, Bank of America, and Wells Fargo.
          tone: neutral
        - label: '2025-10: VX1 AMD EPYC Compute Launch'
          date: 2025-10
          detail: Introduces VX1 cloud compute instances powered by AMD EPYC processors, claiming up to 82% better performance per dollar versus hyperscalers.
          tone: neutral
        - label: '2026-06: Global Cloud Expansion & HPE Partnership'
          date: 2026-06
          detail: Expands footprint across 33 cloud locations and announces enterprise AI infrastructure integration with HPE at HPE Discover 2026.
          tone: positive
