companyProfile:
  summary: >-
    Vultr is an independent cloud infrastructure provider founded in 2014 and operated under The Constant Company, LLC.
    It built a broad developer and AI compute platform across 32 global regions while remaining bootstrapped for roughly
    a decade, then accepted its first outside equity in December 2024 and later added syndicated debt and lease
    financing in June 2025. Public evidence supports meaningful scale in customer accounts and infrastructure footprint,
    but the company still withholds consolidated ARR, gross margin, and covenant detail.
  foundedDate: 2014-02-01T00:00:00.000Z
  founders:
    - name: David Aninowsky
      role: Founder and Executive Chairman
      background: Managed infrastructure veteran and early Datapipe team member who founded Vultr in 2014.
