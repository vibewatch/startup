  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将历史盈利能力、GPU 扩张、债务杠杆和估值不确定性串联至最终尽调立场的决策链。
    data:
      nodes:
        - id: n1
          label: 自力更生传统
          detail: 10 年盈利且自我融资的基础设施增长运营历史（2014-2024）
        - id: n2
          label: 资本扩张转向
          detail: 获得 $333M 股权轮，估值 $3.5B，并取得 $329M 债务融资以采购 GPU 硬件
        - id: n3
          label: 全球规模版图
          detail: 在全球运营 32 个数据中心区域，拥有 1.5M+ 客户账户
        - id: n4
          label: 超大规模云厂商与资本风险
          detail: 债务杠杆高企，并与资产负债表规模巨大的超大规模云厂商竞争
        - id: n5
          label: 不透明的财务指标
          detail: 未公开披露确切 ARR、毛利率、产品层面单位经济性或债务契约
        - id: n6
          label: 建议：继续研究
          detail: 估值立场偏高，在投资前需要核验收入运行率和债务契约
