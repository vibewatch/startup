companyProfile:
  summary: >-
    Vultr 是一家成立于 2014 年、由 The Constant Company, LLC 运营的独立云基础设施提供商。公司在约十年时间里 一直依靠自筹资金，在全球 32 个区域搭建了覆盖开发者与 AI 计算的广泛平台；随后于
    2024 年 12 月完成首次 外部股权融资，并在 2025 年 6 月新增银团债务和租赁融资。公开证据显示其客户账户和基础设施版图已具备相当 规模，但公司仍未披露合并 ARR、毛利率和债务契约细节。
