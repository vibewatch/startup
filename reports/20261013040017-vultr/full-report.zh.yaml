  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、许可条款与客户数据权利
        blocks:
          - type: paragraph
            body: >-
              Vultr 以开发者透明访问和遵守国际数据隐私标准为基础设施原则，但公开争议暴露了反复出现的法律和声誉风险。 2024 年 3 月，一篇爆红 Reddit 帖子指称 Vultr
              修改服务条款，试图对云服务器上的客户数据和应用主张永久、免 版税的商业许可权，引发开发者广泛警觉。高管迅速介入，CMO Kevin Cochrane 公开确认客户仍完整、无负担地拥有
              所有已部署工作负载，并解释争议条款是此前适用于已归档公共留言板的过时文字。Vultr 随后删除该条款，但事件 说明企业云买家对 IP 所有权歧义高度敏感。管理层强调 HIPAA 和 GDPR
              合规认证，称这证明公司不主张拥有租户数据， 因为这样做会直接违反两套法规。同时，Vultr 对平台进行清理：实例连续两年不活跃时通知用户账户将被暂停。
