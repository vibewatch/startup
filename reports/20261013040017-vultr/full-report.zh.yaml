          detail: 开发者和企业使用 vCPU、存储及专业 GPU 实例
        - label: 用量计量与开票
          detail: 按小时计量，转化为预付余额、信用卡扣款或企业开票
        - label: 直接基础设施成本
          detail: 数据中心托管租赁、电力消耗、网络传输和 GPU 硬件租赁摊销
        - label: 毛利率实现
          detail: 基础设施交付后的单位利润；传统 VPS 较高，商品化 GPU 则被压缩
        - label: 运营开销分摊
          detail: 工程、基础设施软件维护、开发者支持和 GTM 执行
        - label: 经营现金生成
          detail: 自我融资的基准现金流，加上用于大规模 GPU 资本支出的外部信贷额度
    approximationNotes: 反映 Vultr 公用事业式计费架构和基础设施交付模式的概念流程模型。
    claimRefs:
      - CI008
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Vultr 基础设施平台的六层架构栈，从实体数据中心延伸至开发者编排界面。
    data:
      layers:
        - label: 开发者与编排层
          detail: 官方 HashiCorp Terraform provider（下载量超过 6.1M）、REST API v2、CLI 和 Web 管理控制台
        - label: 平台与托管服务层
          detail: Vultr Kubernetes Engine（VKE）、无服务器计算、托管数据库、VPC 对等连接和 Cloud Alliance 生态
        - label: 存储与数据层
          detail: NVMe 本地块存储、与 Wasabi 合作的 S3 兼容对象存储和分布式共享文件系统
        - label: 计算与虚拟化层
          detail: 基于 KVM 的云计算实例（VC2）、高频计算和专用单租户裸金属节点
        - label: 加速硬件层
          detail: NVIDIA GH200、HGX H100、L40S 和 AMD Instinct MI300X 加速器，配套 Broadcom 以太网网络
        - label: 全球实体基础设施层
          detail: 覆盖 18 个国家和 6 大洲的 32 座托管数据中心设施，通过运营商骨干网互联
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE013
  - id: FU001
    title: 基于证据的客户采用与信任旅程
    type: journey-map
    summary: 公开证据支持进入和扩张环节，但商业持久性环节出现断点，并包含一轮政策信任修复。
    data:
      items:
        - label: 自助式计算入口
          actor: 开发者或基础设施团队
          touchpoints:
            - 低成本虚拟服务器
            - 按小时计价的加速器
          painpoint: Public evidence does not disclose conversion from evaluation to a paid recurring cohort.
          opportunity: Multiple hourly products lower the observable technical entry barrier.
        - label: 工作负载专业化
          actor: AI、研究、图形或平台团队
          touchpoints:
            - 训练与推理加速器
            - HPC、分析、图形和虚拟桌面工作负载
          painpoint: Named users and measured customer outcomes are absent from the assigned evidence.
          opportunity: Six published NVIDIA offers address distinct workload profiles.
        - label: 地理部署
          actor: 分布式工程或运营团队
          touchpoints:
            - 据报道 32 个区域
            - 覆盖六大洲
          painpoint: Regional utilization and revenue distribution are not disclosed.
          opportunity: Broad geographic presence can support latency and locality requirements.
        - label: 容量扩张
          actor: AI 基础设施买方
          touchpoints:
            - 追加 GPU 的采购意向
            - AMD 和 NVIDIA 的供应情况
          painpoint: Booked demand, capacity commitments, and accelerator utilization are unknown.
          opportunity: Financing provides a stated route to expand GPU supply.
        - label: 政策信任挑战
          actor: 现有自托管客户
          touchpoints:
            - 接受服务条款
            - 支持和账户访问
          painpoint: One user claimed lockout and other users claimed cancellations after disputed terms.
          opportunity: Clearer terms and support escalation can reduce avoidable switching friction.
        - label: 留存与扩张证明
          actor: 投资者或企业采购团队
          touchpoints:
            - 续约与合同审查
            - 客户群和集中度分析
          painpoint: NRR, GRR, churn, contract duration, and concentration are not public in the retained evidence.
          opportunity: Data-room cohort and contract evidence could convert product breadth into an underwritable durability case.
    approximationNotes: 这是分析性的证据旅程，而非经过测量的漏斗；不代表转化率、每位客户都经历的阶段顺序或共同客户群体。
    claimRefs:
      - CU001
      - CU004
      - CU010
      - CU011
      - CU013
