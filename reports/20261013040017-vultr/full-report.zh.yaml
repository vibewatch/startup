figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Vultr 从 2014 年自力更生的主机业务起步，发展至 2024–2026 年的 $3.5B 估值和银团信贷融资。
    approximationNotes: 所有里程碑日期均来自公司新闻公告、CNBC 报道和公开公司历史。
    data:
      items:
        - label: '2014-02: 成立与自力更生式上线'
          date: 2014-02
          detail: David Aninowsky 通过 The Constant Company, LLC 成立 Vultr，专注于面向开发者的 VPS 云计算，提供 100% SSD 存储且不依赖外部资本。
          tone: positive
        - label: '2021-06: 初始债务与 GPU 基础设施'
          date: 2021-06
          detail: Vultr 开始早期云 GPU 投资，并从 Bank of America 和 JPMorgan 筹得首笔 $150 million 债务融资。
          tone: neutral
        - label: '2022-12: $125M ARR 里程碑'
          date: 2022-12
          detail: 在保持自我融资的同时，Vultr 在全球开发者账户中实现据报道超过 $125 million 的年度经常性收入里程碑。
          tone: positive
        - label: '2024-02: 部署界面现代化'
          date: 2024-02
          detail: 推出 deploy-beta 界面，简化跨区域实例配置以及 NVMe 块存储挂载，覆盖 32 个数据中心区域。
          tone: neutral
        - label: '2024-12: 首轮 $333M 外部股权融资，估值 $3.5B'
          date: 2024-12
          detail: 完成首轮外部股权融资，由 LuminArx Capital Management 和 AMD Ventures 领投，Vultr 估值达到 $3.5 billion。
          tone: positive
        - label: '2025-06: $329M 华尔街银团信贷方案'
          date: 2025-06
          detail: 获得由 JPMorgan、Bank of America 和 Wells Fargo 牵头的 $255 million 银团信贷额度及 $74 million 租赁融资。
          tone: neutral
        - label: '2025-10: VX1 AMD EPYC 计算产品上线'
          date: 2025-10
          detail: 推出由 AMD EPYC 处理器驱动的 VX1 云计算实例，声称单位美元性能最高比超大规模云厂商好 82%。
          tone: neutral
        - label: '2026-06: 全球云扩张与 HPE 合作'
          date: 2026-06
          detail: 将业务版图扩展至 33 个云地点，并在 HPE Discover 2026 上宣布与 HPE 整合企业 AI 基础设施。
          tone: positive
    claimRefs:
      - CO003
      - CO008
      - CO009
      - CO011
      - CO013
      - CO014
