        title: 证据展品
        blocks:
          - type: callout
            title: 以杠杆替代股权稀释
            body: Vultr 向主要华尔街贷款机构借入 $329M 债务工具，在保留创始人股权、避免波动股权市场下轮融资风险的同时，推动 GPU 基础设施大幅扩张。
