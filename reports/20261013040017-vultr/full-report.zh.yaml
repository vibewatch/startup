              - CV014
      - number: '8.4'
        title: 建议框架、风险评级与尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合现有公开数据，结论是继续研究、风险评级高、估值偏高。Vultr 的运营稳定性、盈利传统和银团支持使其相较 困境或投机型基础设施供应商更具优势；但公开记录缺少
              ARR、分部毛利率、净收入留存和债务契约的必要审计数据。 管理层会定期评估 IPO，但尚未承诺明确公开时间表。若无法通过私有尽调取得经审计 GAAP 财报、企业客户群留存数据 和债务工具合规证明，就不能在
              $3.5 billion 价位作出直接资本承诺。
            claimRefs:
              - CV001
