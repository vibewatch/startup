      - number: '8.2'
        title: 资本结构、融资历史与估值标记
        blocks:
          - type: paragraph
            body: >-
              Vultr 于 2024 年 12 月从纯自筹转向加速增长融资，以 $3.5 billion 估值完成 $333 million 股权融资。LuminArx Capital Management 和 AMD
              Ventures 领投，Goldman Sachs 担任财务顾问；这笔交易显示公司积极押注高性能 AI 计算。 为采购硬件而不严重稀释股权，Vultr 于 2025 年 6 月获得 $329 million
              银团信贷，由 Bank of America、Citigroup、 Goldman Sachs、JPMorgan Chase、KeyBank 和 Wells Fargo 支持。管理层称该工具利率比
              CoreWeave 支付的 9.25% 低数百个基点。加上 2021 年筹集的早期银行信贷，累计资本承诺超过 $800 million，形成用不断上升的债务偿付换取 股权估值防守的资本结构。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
      - number: '8.3'
        title: 情景分析与公私市场同业倍数
        blocks:
          - type: paragraph
            body: >-
              Vultr 估值需要同时评估专用 AI 云同业和成熟独立托管商。公开可比公司倍数分散明显：CoreWeave 尽管报告季度 会计净亏损、背负超过 $8.7 billion 债务，市值仍快速扩大到 $88
              billion；Nebius Group 获得超过 1.2 GW 数据中心 电力以扩建专用 AI 工厂。乐观情景下，Vultr 加快企业 GPU 集群预订、维持盈利单位经济模型，并在 IPO 时将估值 扩张至
              $5.0B 至 $6.0B。基准情景下，增长稳健，但硬件折旧、高利息负担和竞争性定价压力使估值维持在约 $3.5B。 悲观情景下，超大规模云厂商降价、客户集中度变化或 GPU 利用率下降，会把估值倍数压向低于
              $2.5B 的水平。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
