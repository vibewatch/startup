      - number: '7.2'
        title: 运营可靠性、实例限速与滥用控制
        blocks:
          - type: paragraph
            body: >-
              运营尽调显示，Vultr 的自动化平台安全机制与标准客户开户流程之间摩擦明显。独立消费者评价平台上，Vultr 在 Trustpilot 的综合评分为 1.9 out of
              5（差），主要因为用户频繁投诉充值后账户被暂停。Vultr 客服解释，多层自动 和人工欺诈审查是防止欺诈性挖矿及网络滥用所必需的；但新用户经常报告账户突然关闭，且没有及时解释或退还押金。
              除账户验证障碍外，技术用户还报告标准实例受限：共享 CPU 虚拟服务器在触发吵闹邻居利用率阈值后，自动防护会把 CPU 利用率限制到 25%，严重损害突发数据处理工作负载。Vultr 还全面封锁出站 SMTP
              端口 25，保护网络 IP 声誉 免受垃圾邮件影响，导致合法自托管邮件请求被拒并促使开发者转向竞争云。缺少实时人工支持也加剧不满，部署受阻时 用户只能依赖异步工单。
