evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: Audited financial statements detailing current ARR, gross margins by product line, and revenue retention metrics.
    whyItMatters: >-
      Without audited revenue run-rates and gross margins, valuation and capital efficiency cannot be independently
      modeled.
    diligencePath: >-
      Request confidential historical financials, audited P&L statements, and cohort retention data in confidential
      diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive corporate registry of all executive officers, vice presidents, and board members beyond the founder
      and CEO.
    whyItMatters: >-
      Complete executive governance mapping is necessary to assess key-person dependency and bench depth across
      engineering and sales.
    diligencePath: Obtain certified board registry, officer certificates, and organizational charts from corporate records.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: Detailed credit agreements, covenant thresholds, collateral packages, and exact equity cap table percentages.
    whyItMatters: >-
      Syndicated credit terms and ownership percentages dictate capital structure seniority, refinance risks, and
      governance control.
    diligencePath: >-
      Request copy of credit facility agreement with JPMorgan and Bank of America, alongside fully diluted
      capitalization table.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-diligence
    missingEvidence: >-
      Audited breakdown of Vultr annual recurring revenue (ARR), gross margins by compute tier, and net revenue
      retention across developer versus enterprise customer cohorts.
    whyItMatters: >-
      Without segmented revenue and retention figures, Vultr effective serviceable addressable market (SAM) capture and
      market share within the neocloud tier cannot be verified against broad TAM projections.
    diligencePath: >-
      Request confidential disclosure of customer cohort retention, gross margins, and GPU utilization metrics during
      private diligence review.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: enterprise-procurement-benchmarks
    missingEvidence: >-
      Third-party audited benchmark surveys comparing enterprise total cost of ownership (TCO) between independent GPU
      cloud providers and hyperscaler reserved instances.
    whyItMatters: >-
      Assessing buyer conversion friction and switching cost dynamics requires rigorous price-performance validation
      beyond vendor list pricing.
    diligencePath: >-
      Commission independent benchmarking studies measuring effective throughput per dollar for LLM inference workloads
      across Vultr, AWS, and Azure.
  - type: private-evidence-only
    severity: material
    topic: enterprise-retention-metrics
    missingEvidence: >-
      Publicly auditable enterprise net revenue retention (NRR), customer churn rates, and cohort retention by product
      line.
    whyItMatters: >-
      Assessing moat durability and switching costs requires understanding whether enterprise AI workloads remain on
      Vultr long-term or migrate to hyperscalers once credits or spot pricing expire.
    diligencePath: >-
      Request audited enterprise retention cohort schedules and annual contract value renewal data under
      confidentiality.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: revenue-run-rate-and-arr
    missingEvidence: >-
      Audited consolidated revenue, billed ARR, and product-level revenue breakdown between legacy CPU VPS hosting and
      accelerated GPU computing.
    whyItMatters: >-
      Without segmented ARR, underwriters cannot determine whether Vultr's revenue multiple is justified by high-growth
      AI compute or anchored to mature, low-growth commodity virtual servers.
    diligencePath: >-
      Request audited GAAP revenue schedules for FY2024 through FY2026 showing recurring subscription revenue,
      usage-based billings, and customer concentration.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Segmented gross margin data reflecting data center power costs, colocation leasing fees, and GPU hardware
      depreciation or lease liabilities.
    whyItMatters: >-
      Rapid expansion of high-wattage GPU clusters introduces severe gross margin sensitivity to power rates and
      hardware utilization, which cannot be assessed from list prices.
    diligencePath: >-
      Review management profit-and-loss statements by product family and assess hardware depreciation schedules across
      NVIDIA and AMD GPU clusters.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-cash-runway
    missingEvidence: >-
      Full credit agreement documentation for the June 2025 $329 million debt package, including interest rate margin,
      amortization schedules, and financial covenants.
    whyItMatters: >-
      Syndicated credit facilities frequently impose debt service coverage or minimum liquidity covenants that could
      constrain operational flexibility during compute demand downcycles.
    diligencePath: >-
      Obtain credit facility agreements, compliance certificates, and debt service amortization schedules from company
      management or lead lenders.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: compliance-and-security-audits
    missingEvidence: >-
      Audited SOC 2 Type II reports, ISO 27001 certification scopes, and facility-level physical security attestations
      across all 32 colocation facilities.
    whyItMatters: >-
      Enterprise AI workloads and regulated financial or healthcare deployments require verified independent security
      attestation before onboarding sensitive proprietary data.
    diligencePath: >-
      Request third-party compliance audit summaries, NDA-protected SOC 2 reports, and regional data protection
      agreements during technical diligence.
    relatedQuestionRefs:
      - QE009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-gap
    missingEvidence: Named end-customer production deployments, workload scope, duration, and measurable customer outcomes.
    whyItMatters: >-
      Anonymous complaint evidence and product breadth cannot establish enterprise reference quality or production
      adoption.
    diligencePath: >-
      Request a management-provided customer roster and independently interview at least three current production
      customers across general compute and AI workloads.
    relatedQuestionRefs:
