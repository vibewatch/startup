tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Owned-brand flight retail
    - Flight search, itinerary selection, ancillaries, checkout, fulfilment, and support on Gotogate/Mytrip/Flightnetwork
    - Non-flight lodging and experience revenue except where it supports a flight-led package
    - Traveler is payer; Etraveli controls storefront and conversion funnel
    - Defines the consumer-facing baseline, but not the full market.
  - - Partner-powered flight retail
    - White-label or embedded flights for partners such as Booking.com or Radisson
    - Generic affiliate traffic that does not include booking and fulfilment execution
    - Partner product/commercial team buys capability; traveler pays ticket spend
    - Proves Etraveli addresses enterprise buyers, not only direct consumers.
  - - Airline-content distribution
    - NDC, direct-connect, full-content access, ancillaries, bundles, and interlining access
    - Airline operations, fleet economics, and airport handling
    - Airlines and travel sellers share economic interest in content reach
    - This is the core supplier-side workflow layer.
  - - Payments and fraud orchestration
    - Authorization, fraud checks, settlement routing, reconciliation, and refund flows
    - Generic corporate treasury or unrelated merchant-acquiring services
    - Risk, finance, and payments owners buy the workflow; traveler funds the transaction
    - Shows why margin protection can matter as much as ticket volume.
  - - Post-booking servicing / flexibility
    - Changes, cancellations, price assurance, flexibility products, and edge-case servicing automation
    - Offline call-center work not connected to platform workflows
    - Operations, customer-experience, and partner commercial teams bear the cost
    - Important because servicing often determines whether travel economics scale.
  - - Status-quo substitute stacks
    - GDS marketplaces, ticketing enablers, metasearch partners, and API builders
    - Broad “all travel” software categories with no air-distribution function
    - Travel sellers or suppliers choose between building, buying, or combining these tools
    - Keeps the market bounded to comparable jobs-to-be-done.
  notes: Included and excluded spend are qualitative because the public pack supports workflow boundaries more cleanly than clean revenue segmentation.
