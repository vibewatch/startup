- id: growth-drivers-constraints-and-gaps
  title: Growth drivers, adoption constraints, and evidence gaps
  body: |-
    The growth case is straightforward at the industry level. Passenger volumes are still rising, airlines want richer and more personalized offers, and both NDC and ONE Order are explicitly designed to modernize distribution and fulfilment. Etraveli’s 2024–2025 partner announcements show that these standards are translating into live commercial behavior: Frontier is using direct NDC, BA and Iberia expanded content access, Amadeus wants to resell ETG content, and Radisson is embedding flights to capture package demand. Wenrix and Precision add another driver: agencies and partners are searching for margin protection in pricing, fraud, flexibility, and servicing rather than only top-of-funnel demand.

    The constraints are just as important. IATA still expects only a 3.9% net margin and sub-WACC returns for airlines, which means sellers and suppliers will scrutinize every point of distribution cost. Regulatory risk also remains real: the UK CMA cleared Booking/Etraveli while the European Commission blocked it, showing that the market can support commercial dependence without necessarily supporting deeper structural consolidation. That matters for valuation because a partner can remain strategically essential while still facing antitrust resistance if the relationship hardens into ownership or market foreclosure.

    The largest remaining gap is economic precision. The public file proves that Etraveli operates in a large, growing, and technically complex market. It does not prove a clean standalone SAM, channel mix, take rate, or partner concentration profile. Those unknowns do not negate the market opportunity; they bound how confidently this chapter can translate demand, partnerships, and technical complexity into a valuation-grade market model. Until management discloses segment economics, the right posture is to treat the market as attractive but only partially quantified.
