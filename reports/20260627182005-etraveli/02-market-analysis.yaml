chapter:
  number: 2
  title: Market Analysis
  summary: 'The strongest public evidence frames Etraveli’s market as global flight-commerce infrastructure rather than a simple OTA category: a layered stack spanning consumer storefronts, partner-powered flight retail, airline-content distribution, settlement, and post-booking servicing. External demand is enormous, but the public record supports only bounded sizing lenses—global airline and passenger-ticket pools on the outside, then a much narrower workflow slice where NDC, payments, virtual interlining, and servicing complexity make outsourcing rational. Growth drivers are real, especially NDC adoption and partner embedding, yet thin airline margins, concentration sensitivity, and missing segment-level economics keep the market case only partially bounded.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included workflows, and status-quo substitutes
  body: |-
    Etraveli’s market should not be defined as “online travel” in the abstract because the retained evidence describes something more specific: a flight-commerce layer that sits between airlines, travel sellers, embedded partners, and end travelers. Etraveli’s own platform materials place consumer brands next to TripStack, Precision, Wenrix, and Flygresor.se, which means the relevant market includes search, itinerary construction, booking, fulfilment, payments, fraud, pricing, and post-booking servicing. The Booking.com renewal strengthens that interpretation because Booking is not buying raw traffic; it is buying a scalable flight capability that handles search, book, and fulfilment across 57 countries. Radisson Flights points in the same direction from another angle: hotel groups can buy flights as an embedded module to deepen packaging and direct-booking economics instead of becoming airlines or building travel plumbing themselves.

    That boundary also clarifies what to exclude. The sources support flight retail and fulfilment workflows, not airline operations, hotel property management, or generalized trip inspiration. Expedia’s filing is useful here because it shows the broad status-quo substitute: a giant OTA bundle that mixes flights with lodging, packages, cars, cruises, insurance, and activities. Sabre, Travelport, Travelfusion, Hahn Air, Duffel, and Google Flights show the other side of the substitute set: incumbent GDS-style marketplaces, direct-connect and NDC aggregators, metasearch gateways, ticketing specialists, and API-first builders. In other words, Etraveli competes partly with broad consumer OTAs and partly with infrastructure providers that help sellers access, merchandise, settle, and service air content.

    The cleanest market definition for this chapter is therefore “digitally mediated flight-commerce infrastructure and retail workflows,” not “all travel” and not “all airline revenue.” That narrower definition keeps the included spend anchored on the jobs the evidence actually proves—content access, pricing, checkout, settlement, fulfilment, servicing, and partner distribution—while preserving the fact that buyers can still solve those jobs through multiple substitute stacks.
