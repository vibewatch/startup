  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: A third-party market study or public benchmark that isolates the revenue pool for outsourced flight fulfillment, ticketing, settlement, and servicing rather than total airline or OTA spend.
    whyItMatters: Without a bounded external denominator, TAM and SAM can only be framed as layered proxies rather than a clean market share model.
    diligencePath: Request management’s internal SAM definition, attach-rate assumptions, and any banker or analyst market maps used in strategy reviews.
    relatedQuestionRefs:
    - QM007
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: Segment-level revenue, gross margin, and take-rate split across owned-brand OTA, partner-powered flights, payments/fraud, and post-booking or AI modules.
    whyItMatters: Valuation depends on whether growth is coming from low-margin flight retail or from higher-value software-like modules such as payments, interlining, or servicing AI.
    diligencePath: Ask for a management bridge showing 2024 and 2025 revenue and EBITDA contribution by business line and by owned-brand versus partner channels.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Current share of orders, travelers, revenue, and gross profit tied to Booking.com and to the top five partners.
    whyItMatters: The Booking renewal is commercially positive, but concentration could limit negotiating power and cap exit optionality if one partner dominates demand.
    diligencePath: Request partner concentration tables, renewal dates, minimum-volume terms, and any change-of-control or exclusivity clauses.
    relatedQuestionRefs:
    - QM022
    - QM025
  - type: missing-source
    severity: minor
    topic: buyer-map
    missingEvidence: Public win-rate, contract-length, and implementation-time data by buyer segment such as airlines, OTAs, hotel groups, or embedded-travel partners.
    whyItMatters: Segmentation is evidence-backed on workflows but still weak on sales-cycle duration and willingness-to-pay by segment.
    diligencePath: Collect recent customer case studies, sales collateral, or management pipeline data that quantifies deployment time, conversion rate, and contract scope by segment.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM021
    relatedTableRefs:
    - TM003
