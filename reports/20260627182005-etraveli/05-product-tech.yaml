- id: architecture-integrations-and-dependencies
  title: Architecture, integrations, and dependency model
  body: 'The retained product surfaces allow a specific architecture read. ETG’s own B2B page says partners can integrate individual capabilities or leverage the full platform, which implies loose commercial modularity on top of a shared fulfilment base. TripStack’s pages make the distribution layer concrete: it exposes flight content through an API, supports ancillaries, and specializes in virtual interlining across non-cooperating carriers. Precision then sits closer to transaction approval and payment orchestration, with single-API integration, real-time fraud decisioning, and named integrations into Mastercard Gateway and Sabre Direct Pay. Wenrix extends the stack beyond checkout into pricing optimization, flexibility merchandising, and post-booking change/refund execution.


    This stack is powerful, but the dependencies are visible too. ETG still relies on third-party demand partners such as Booking.com and Google Flights for major traffic surfaces, and its fraud-and-payments expansion depends on external orchestration partners rather than a fully self-contained payment rail. Open distribution standards also limit hard lock-in. IATA’s NDC standard is explicitly open to any third party, and competitor documentation such as Travelfusion’s shows that branded fares, NDC access, and travel-payment controls are not unique feature categories. ETG’s edge is therefore not ownership of a closed standard; it is the operational bundling of content, fulfilment, payments, fraud, and servicing into a partner-ready workflow.'
