  rows:
  - - Named partner payment integrations
    - Publicly confirmed
    - Mastercard Gateway and Sabre Direct Pay integrations for Precision
    - Integration depth is visible, but ETG does not publish implementation metrics or merchant-count detail
  - - Travel-specific fraud model positioning
    - Publicly claimed
    - Real-time decisioning trained on millions of travel-specific data points
    - No public audit of model accuracy, governance, or drift management
  - - Single API integration claim
    - Publicly claimed
    - Precision and FlexEngine both market simplified integration paths
    - No public developer documentation set or sandbox onboarding detail in reviewed pack
  - - Public security/certification disclosures
    - Not visible in reviewed ETG/PRECISION texts
    - Would normally cover items like SOC 2, ISO 27001, PCI scope, or formal trust center content
