  - - Public reliability / uptime disclosure
    - Not visible in reviewed texts
    - Would normally cover SLA, status page, or incident history
    - Reliability evidence is indirect because fulfilment/support are marketed but not KPI-backed
  - - Competitive compliance signaling benchmark
    - Visible in competitor docs
    - Travelfusion tfPay explicitly markets PCI DSS and PSD2/SCA compliance
    - Shows that compliance proof is a buyer-facing surface in this category and ETG is quieter on it publicly
  - - Developer / practitioner signal
    - Visible
    - TripStack careers, Wenrix careers, and ETG hiring show active product, fraud, payments, BI, and partner roles
    - Hiring proves continued investment, not product reliability or security maturity
