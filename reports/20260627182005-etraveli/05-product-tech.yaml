  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-certification-gap
    missingEvidence: A public trust center, audit letter, or certification register naming ETG or PRECISION security/compliance certifications.
    whyItMatters: Without named certifications or control attestations, buyers cannot independently verify security maturity from public evidence.
    diligencePath: Request SOC 2 / ISO 27001 / PCI scope documents and any third-party security audit summaries from management.
    relatedQuestionRefs:
    - QE013
    - QE014
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: A public or private SLA, uptime history, incident log, or status-page archive for ETG, TripStack, Precision, or Wenrix.
    whyItMatters: Mission-critical travel infrastructure must be judged on reliability and recovery behavior, not only on feature scope.
    diligencePath: Request uptime reports, Sev-1 incident history, support KPIs, and customer SLA templates for the last 12 months.
    relatedQuestionRefs:
    - QE015
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-sla-gap
    missingEvidence: Module-level pricing models, take rates, attach rates, and contract structures for TripStack, Precision, and Wenrix.
    whyItMatters: The product stack may be strategically broad while still monetizing unevenly across modules, which directly affects valuation quality.
    diligencePath: Request module P&Ls, pricing schedules, top-customer contract examples, and attach-rate by module.
    relatedQuestionRefs:
    - QE015
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: implementation-proof
    missingEvidence: Independent customer references or benchmark data showing Precision approval-rate lift, Wenrix automation outcomes, and TripStack disruption or servicing performance.
    whyItMatters: Public module claims are currently strongest on vendor-reported positioning and weakest on independently verified customer outcomes.
    diligencePath: Request customer case studies with baseline-and-post metrics, renewal evidence, and implementation timelines by module.
    relatedQuestionRefs:
    - QE006
    - QE007
    - QE008
    - QE025
    relatedTableRefs:
    - TE002
    - TE004
