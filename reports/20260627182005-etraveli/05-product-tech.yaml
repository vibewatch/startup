  name: Etraveli Group
chapter:
  number: 5
  title: Product & Technology
  summary: 'Etraveli Group now presents itself as a modular flight-technology stack rather than a single OTA brand: TripStack handles content assembly and virtual interlining, PRECISION handles fraud and payment risk, Wenrix handles AI-driven price, flexibility, and servicing, and ETG still owns fulfilment through both partner and consumer channels. The public record is strongest on module scope, partner integrations, and roadmap milestones from 2024-2025, but materially weaker on public SLA, certification, pricing, and module-level economics.'
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Etraveli Group’s product should be read in workflow terms, not just in brand terms. The current official homepage, platform page, and B2B page all describe the company as a global flight-technology platform that combines distribution, fulfilment, fintech, and AI capabilities for both partners and ETG-owned consumer brands. That framing matters because it makes clear that the company is not only selling flight inventory through Gotogate, Mytrip, and Flightnetwork; it is also packaging reusable infrastructure for enterprise partners that need search, booking, fulfilment, risk, and post-booking functionality without building a flights stack from scratch.


    The module map is now publicly explicit. TripStack is presented as the distribution and fulfilment gateway, with API access to LCC, FSC, NDC, and virtual-interlining content plus ancillaries and customer support. PRECISION is the fintech and risk layer, commercialized from ETG’s internal fraud stack and now sold through direct and partner channels. Wenrix is the AI layer, focused on price competitiveness, flexibility products, and post-booking servicing. Booking.com and Google Flights are the best public examples of where this architecture lands in the customer workflow: ETG captures demand from external channels, then executes search, booking, and fulfilment on the back end. The product is therefore best understood as a modular air-commerce operating system rather than a conventional OTA front end.'
