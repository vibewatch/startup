- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - TripStack distribution and fulfilment gateway
    - OTAs, airlines, demand partners
    - Operational; long-standing ETG subsidiary since 2019
    - Combines LCC, FSC, NDC, and virtual-interlining content plus ancillaries and fulfilment access
    - No public partner pricing, attach-rate, or SLA disclosure
  - - TripStack virtual interlining engine
    - Travel retailers and airlines
    - Operational at scale
    - Creates bookable single itineraries across non-cooperating carriers
    - No public false-positive/disruption-rate or servicing-cost disclosure
  - - PRECISION fraud and payment-risk engine
    - Travel sellers and airlines
    - Commercialized externally since 2024
    - Travel-specific risk decisioning with single-API integration and partner distribution through Mastercard/Sabre
    - No public certification page, model-governance detail, or public benchmark deck
  - - Wenrix pricing layer (FareSight / price assurance)
    - OTAs and TMCs
    - Operational; acquired 2025
    - AI-led price competitiveness across EDIFACT, NDC, and LCC content
    - No public before/after benchmarks split by customer segment
  - - Wenrix flexibility layer (FlexEngine)
    - OTAs, TMCs, corporate-travel sellers
    - Operational
    - Single API for price-lock, refund guarantee, and flexibility ancillaries
    - No public attach-rate, claims-loss, or unit-economics disclosure
  - - Wenrix servicing layer (DeepFlow)
    - OTAs and TMC operations teams
    - Operational
    - Targets hard post-booking edge cases rather than only top-of-funnel automation
    - Automation and CSAT claims are company-reported, not independently audited
  - - Shared ETG consumer brands and fulfilment base
    - End travelers plus partner channels
    - Operational at global scale
    - Lets ETG reuse support and fulfilment know-how across B2C and B2B
    - Public materials do not quantify what share of traffic or gross profit each module contributes
  notes: Rows synthesize official ETG, TripStack, Precision, and Wenrix product pages. “Status / maturity” reflects public commercialization state rather than internal TRL scoring.
