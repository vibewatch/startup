- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Own flight demand without building a full stack
    - Partner acquires traffic but needs third-party search, booking, and fulfilment
    - ETG powers search-book-fulfilment through Booking.com-style and Google Flights-style partner flows
    - Faster time to market than building air-commerce plumbing internally
    - Public sources do not disclose ETG take rate, uptime, or partner-level economics
  - - Sell complex multi-carrier itineraries
    - Retailer must stitch non-cooperating carriers or avoid the itinerary entirely
    - TripStack virtual interlining engine creates single itineraries and exposes them through API and white-label flows
    - Broader content and potentially cheaper/faster options
    - No public disruption-rate or re-accommodation KPI
  - - Reduce false declines while blocking fraud
    - Seller relies on generic fraud tools or manual review
    - PRECISION balances fraud, conversion, and cost with real-time travel-specific decisioning
    - Higher approval rates and lower fraud losses are the stated goal
    - Public pages do not disclose audited lift, model drift, or rule-governance metrics
  - - Expand payment acceptance without heavy re-platforming
    - Merchant must integrate multiple payment controls and gateway flows itself
    - PRECISION through Mastercard Gateway and Sabre Direct Pay shortens integration path
    - Less internal integration work per merchant according to partner launches
    - The public record does not quantify implementation time or merchant retention
  - - Compete on flexibility and price
    - OTA/TMC relies on static fares or manual flexibility products
    - Wenrix adds price assurance, price lock, refund guarantee, and flexibility merchandising via API
    - Potential conversion, loyalty, and ancillary uplift
    - No public customer-by-customer outcome distribution
  - - Automate post-booking edge cases
    - Human agents handle the hardest change/refund scenarios
    - Wenrix DeepFlow automates changes, refunds, and servicing workflows across content sources
    - Company claims +93% automation on changes and refunds
    - The claim is vendor-reported and not independently benchmarked
  - - Bundle support with distribution
    - Seller pieces together shopping, payment, and service vendors
    - ETG markets fulfilment and customer support as part of the same platform family
    - Potentially fewer vendors and less handoff friction
    - Public materials do not disclose ticket-resolution speed or cost-to-serve by module
  notes: Benefits are framed as company-claimed workflow outcomes unless a third-party source explicitly corroborates them. Limitations reflect missing public evidence, not proven product failure.
