  title: Public assurance evidence lags public integration evidence
  body: The reviewed sources make integrations and module scope easy to verify, but they do not make uptime, security certification, pricing, or module-level economics easy to verify. That leaves a real diligence gap for any buyer treating ETG as mission-critical infrastructure.
