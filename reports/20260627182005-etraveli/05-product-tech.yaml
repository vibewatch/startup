- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - External demand surfaces (Booking.com, Google Flights, other partners)
    - Acquire shopper intent and route demand into ETG-controlled booking flows
    - Partner traffic quality, contract durability, and search visibility
    - ETG does not fully own top-of-funnel demand
  - - TripStack content and shopping API
    - Assemble LCC/FSC/NDC/VI offers and expose them with ancillaries
    - Carrier connections, fare caching, and API operations
    - Open standards and competing aggregators can narrow content differentiation
  - - Fulfilment and customer-support base
    - Handle booking execution, downstream fulfilment, and service handoffs
    - Shared operating processes across B2C and B2B
    - Public surfaces do not publish SLA or reliability KPIs
  - - PRECISION decision engine
    - Approve, decline, or step-up risky transactions in real time
    - Travel-specific data, model governance, and payment-orchestration hooks
    - No public certification or benchmark pack for outside diligence
  - - Payment-orchestration partners (Mastercard Gateway / Sabre Direct Pay)
    - Extend PRECISION into merchant payment flows
    - Partner APIs, commercial alignment, and rollout execution
    - A meaningful part of fintech expansion sits on third-party rails
  - - Wenrix AI layer
    - Optimize price, flexibility, and servicing actions before and after booking
    - Access to content-source rules, pricing data, and customer workflows
    - Outcome claims are vendor-reported and may vary by customer mix
  - - Open standards and competitor stacks
    - Set the protocol baseline for content distribution
    - NDC adoption, airline direct-connect behavior, and rival API offerings
    - Standards openness weakens protocol-level lock-in even if ETG execution stays strong
  notes: Architecture rows combine ETG’s own module descriptions with partner-doc evidence on Google Flights, Mastercard, Sabre, Travelfusion, and IATA NDC. Risks reflect dependency concentration or missing public assurance evidence.
