  summary: ETG’s public architecture can be read as a four-layer air-commerce stack with shared fulfilment in the middle and specialist modules around it.
  data:
    layers:
    - label: Demand capture
      detail: Partner surfaces such as Booking.com and Google Flights originate shopper intent and deep-link traffic.
    - label: Shopping and content assembly
      detail: TripStack exposes LCC, FSC, NDC, ancillaries, and virtual-interlining content through API and white-label flows.
    - label: Booking fulfilment and support
      detail: ETG executes booking, fulfilment, and customer-support workflows for both partner and consumer channels.
    - label: Transaction risk and payments
      detail: PRECISION handles fraud decisioning and plugs into Mastercard Gateway and Sabre Direct Pay.
    - label: Post-booking optimization
      detail: Wenrix extends the stack into pricing, flexibility, and servicing automation across content sources.
