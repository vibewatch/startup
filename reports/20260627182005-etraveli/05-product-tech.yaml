  title: The stack is broader than a classic OTA workflow
  body: ETG can credibly show one product family spanning demand-partner handoff, content assembly, fulfilment, fraud decisioning, flexibility merchandising, and post-booking servicing. That is broader than the public surface area shown by a pure metasearch gateway or single-purpose NDC connector.
