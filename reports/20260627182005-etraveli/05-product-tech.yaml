- id: roadmap-differentiation-and-open-gaps
  title: Roadmap, differentiation, and open gaps
  body: 'The public roadmap is unusually visible for a private travel company, even if it is milestone-based rather than release-note-based. The sequence runs from Precision’s July 2024 launch, to the January 2025 Wenrix acquisition, to the June 2025 Booking.com renewal and Mastercard integration, to the December 2025 Sabre Direct Pay agreement. The through-line is consistent: ETG is turning internal flight-commerce capabilities into sellable B2B modules and widening the platform from search-and-fulfilment into fintech and AI. That makes the technology differentiation real. ETG can credibly say it spans distribution, virtual interlining, transaction-risk control, flexibility merchandising, and post-booking servicing under one umbrella, while many rivals still specialize in only one or two layers.


    But the same public record also defines the next diligence agenda. ETG does not disclose module-level revenue mix, attach rates, pricing mechanics, API documentation depth, or reliability commitments. It is also still dependent on large partner channels and open-industry standards that reduce pure protocol lock-in. The practical interpretation is that ETG’s moat is executional and workflow-based, not standards-based. If the company keeps shipping partner integrations and monetizing modules like Precision and Wenrix, that moat can deepen. If not, competitors offering NDC content, travel payments, or AI servicing could replicate parts of the surface area faster than ETG can prove that the stack is indispensable.'
