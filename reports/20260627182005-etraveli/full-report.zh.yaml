    rows:
      - - 不自建全栈也掌握机票需求
        - 伙伴拿到流量，但需要第三方搜索、预订和履约
        - ETG 通过 Booking.com 式和 Google Flights 式伙伴流程支撑搜索—预订—履约
        - 上线速度快于内部自建航空电商管线
        - 公开来源未披露 ETG 抽佣率、在线率或伙伴层面经济性
      - - 销售复杂多航司行程
        - 零售商必须拼接不合作的航司，否则只能放弃该行程
        - TripStack 虚拟联运引擎创建单一行程，并通过 API 和白标流程开放
