  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：消费者卖家、需求网关与基础设施替代品
        blocks:
          - type: paragraph
            body: >-
              Etraveli 周围的机票竞争图谱，比经典 OTA 同业集合更宽。一端是 Kiwi.com 和 eDreams ODIGEO 等面向消费者的机票卖家，它们用保障或订阅等打包层争夺同样的预订意图。需求网关层有
              Google Flights 和 Booking.com Flights，即便另一家公司拥有履约，它们也会影响谁拥有发现入口。基础设施层有
              Travelport、Sabre、Amadeus、Travelfusion、Duffel 和 Hahnair，它们各自销售搜索、NDC、票务、支付或服务栈的一部分，可以替代 Etraveli
              平台的部分功能。因此，理解 Etraveli 最干净的方式，是把它看作位于需求所有者与供给基础设施之间的编排层，而不只是又一家零售 OTA。


              Etraveli 自身披露强化了这种解读。公司如今称，最快增长来自 B2B 伙伴关系，而不是自有消费者门店，并把 Booking.com、Google Flights、Skyscanner 和 KAYAK
              列为主要伙伴渠道。这在战略上很强，因为它把 Etraveli
              放进大型需求漏斗，但也意味着公司并不完全拥有获客层。竞争格局表和定位图说明了为什么这重要：最强威胁不只是直接卖家，也包括既有旅行集团和模块化分销供应商；后者可以帮助航空公司、OTA 和元搜索伙伴绕过单一集成中介。
