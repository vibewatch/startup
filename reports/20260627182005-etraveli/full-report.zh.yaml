      - number: '3.3'
        title: 定价、分销力量与切换成本
        blocks:
          - type: paragraph
            body: >-
              公开定价是证据基础中最清晰的弱点之一。消费者竞争对手确实公开展示其打包逻辑：Kiwi 突出中断保护和自动值机，eDreams 强调 Prime
              会员。相比之下，企业级机票科技竞争对手多通过联系表单、注册流程、伙伴入驻或能力清单营销，而不是公布标价。这意味着买方通常可以推断合同模型——报价制企业软件、与交易量挂钩的支付服务，或市场 /
              收入分成经济性——但无法直接观察真实抽佣率、折扣或伙伴层面的利润拆分。因此，定价表应被解读为打包比较，而不是真正同口径的单位经济性表。


              切换成本真实存在，但不像垄断级别。TripStack、Wenrix 和 PRECISION 表明，Etraveli 可以嵌入购物、定价、欺诈、支付和服务，给考虑迁移的伙伴制造运营摩擦。与此同时，IATA 的
              NDC 标准明确对任何中介开放，Google Flights 通过免费深度链接分销，Travelport、Sabre、Amadeus、Travelfusion、Duffel 和 Hahnair
              都在营销替代连接层。实践中，这意味着伙伴可以多归属或重建，但这样做可能需要拼接更多供应商、投入更深集成工作，或接受弱于 Etraveli 当前能力的履约覆盖。
