  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Etraveli 作为业务看起来可投资，但作为价格还不能承销。正向案例是真实的： 公司披露了有意义的 2024 年规模、正 EBITDA，并持续转向质量更高的 B2B 基础设施。 Booking.com
              续约至下一个十年、KKR 少数股权交易完成，以及 TripStack、Precision 和 Wenrix 组成的产品集扩大，都支持一个判断：Etraveli 已经不再只是薄利的零售机票转售商。
              它正在变成混合型机票商业平台，拥有合作伙伴分销、支付和反欺诈工具， 以及预订后或定价工作流暴露。这部分故事足以支撑其估值高于商品化 OTA 模板。


              反论点同样重要，也是建议停留在继续研究而非买入的原因。公开记录仍未披露 KKR 入场价格、 债务或优先权负担，以及合作伙伴集中度经济。记录中最强的战略估值锚点仍是 2021 年 Booking 报价，
              但这条路被欧盟委员会阻断，因此不能被视为干净的实时底价。 此外，消费者投诉证据和 2023 年消费者保护承诺说明，服务质量和信任在下行情景中仍然重要。 正确解读是，Etraveli
              可能是一家好公司，但当前公开材料还不足以让投资者在缺少更多尽调或更严格价格纪律时， 接受一个未披露的私有估值。
