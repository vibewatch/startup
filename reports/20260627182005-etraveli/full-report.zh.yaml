      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，Etraveli 不像一家马上陷入困境的公司。它报告了正的 2024 年 EBITDA，2025 年获得 KKR 重大少数股权投资，并在 2026 年 1 月继续投入资本收购
              Wenrix。这些信号正面，因为它们显示资方通道、收购能力，以及至少一个已披露盈利能力数据点。不过，它们不能替代资产负债表披露。留存来源没有揭示手头现金、循环贷款可用额度、债务到期、契约余量、退款负债、营运资本季节性或月度烧钱。因此，本章可以观察到融资支持和战略投资意愿，但不能负责任地把这些信号转换为跑道估算。


              历史交易轨迹仍有用。CVC 在 2017 年支付 5.08 亿欧元，Booking 在 2021 年同意支付约 16.3 亿欧元但交易被阻止，KKR 后来购买未披露的少数股权，CVC
              仍为多数股东。合在一起，这些事件显示外部资本反复认可 Etraveli 在机票分销中的位置，但没有任何一项揭示今天的流动性缓冲或杠杆。因此，承销资本充足性仍取决于管理层披露，而不是公开推断。
