  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入流程与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Etraveli 的市场不应抽象定义为「在线旅行」，因为留存证据描述的是更具体的东西：一个夹在航空公司、旅行卖家、嵌入式伙伴和终端旅客之间的机票商务层。Etraveli 自己的平台材料把消费者品牌与
              TripStack、Precision、Wenrix 和 Flygresor.se 放在一起，意味着这个市场包括搜索、行程构建、预订、履约、支付、欺诈、定价和预订后服务。Booking.com
              续约强化了这种解读，因为 Booking 购买的不是原始流量，而是一套可规模化的机票能力，能在 57 个国家处理搜索、预订和履约。Radisson Flights
              从另一个角度指向同一方向：酒店集团可以把机票作为嵌入式模块购买，以加深打包和直订经济性，而不必自己变成航空公司或搭建旅行管道。


              这个边界也澄清了应排除的内容。来源支持的是机票零售和履约流程，而不是航空公司运营、酒店物业管理或泛化的旅行灵感。Expedia 的申报文件在这里有用，因为它展示了宽泛的现状替代方案：一个巨型 OTA
              组合，把机票与住宿、套餐、汽车、邮轮、保险和活动混在一起。Sabre、Travelport、Travelfusion、Hahn Air、Duffel 和 Google Flights 展示了替代集合的另一侧：既有
              GDS 式市场、直连和 NDC 聚合商、元搜索网关、票务专家和 API 优先的构建者。换句话说，Etraveli 一部分与宽泛消费者 OTA
              竞争，另一部分与帮助卖家访问、商品化、结算和服务航空内容的基础设施提供商竞争。


              因此，本章最干净的市场定义是「数字化撮合的机票商务基础设施和零售流程」，不是「所有旅行」，也不是「所有航空收入」。这个更窄定义把纳入支出锚定在证据实际证明的工作上——内容访问、定价、结账、结算、履约、服务和伙伴分销——同时保留一个事实：买方仍可通过多种替代栈解决这些工作。
