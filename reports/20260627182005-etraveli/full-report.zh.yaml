      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              从待完成工作而不是公司标签看，分层证据最强。在自有品牌渠道中，旅客既是用户也是经济付款方，Etraveli 控制商品化、结账、履约和支持。在 Booking.com Flights 或 Radisson
              Flights 等伙伴驱动渠道中，买方通常是伙伴的产品、电商或商业团队，它们想在不独自搭建机票栈的情况下提升转化、留存和套餐附着。终端用户仍是旅客，但经济逻辑还包括伙伴的生命周期价值、交叉销售和品牌留存目标。


              供给侧分层则不同。航空公司关心内容准确性、辅营、服务和客户数据控制，这就是 Ryanair 的获批 OTA 表述和 Frontier 的 NDC 上线都重要的原因。Amadeus
              增加了另一类买方：想要一站式访问多元航空内容的旅行卖家和转售商，包括虚拟联运内容。Google Flights
              通过作为免费元搜索网关并深度链接到伙伴，切出了发现层。Hahnair、Travelfusion、Travelport 和 Duffel 显示，市场还包括希望获得票务触达、直连内容、AI 支持服务或快速 API
              集成的代理商、TMC、企业和开发者。


              这种分层之所以重要，是因为每个细分都用不同预算项购买。酒店集团把机票当作转化和打包工具来买。航空公司基于分销经济性和控制权来购买或允许访问。OTA 或 TMC
              基于广度、速度、服务和利润保护购买连接。开发者驱动的新进入者购买的是集成便利和上线速度。正因这种多样性，单一 TAM 标题会误导：Etraveli
              的真实机会取决于这些买方中有多少人会认为，外包机票商务复杂度比自己搭建或拼接替代方案更便宜。
