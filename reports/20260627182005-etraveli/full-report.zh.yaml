  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 旅客增长和创纪录客流
        - 正向
        - 当前
        - 扩大整体机票需求，也扩大中介和合作伙伴可触达的交易基数。
        - 检查 Etraveli 是否靠份额提升跑赢客流，还是只是跟随市场。
      - - NDC 丰富内容采用
        - 正向
        - 当前至中期
        - 当卖家需要附加服务和捆绑包时，外包航空内容连接更值钱。
        - 按供应商和区域衡量 ETG 交易量中已有多少启用 NDC。
      - - ONE Order 和履约简化
        - 正向
        - 中期
        - 如果 ETG 抓住工作流迁移，可能降低服务摩擦并改善合作伙伴经济性。
        - 询问 ETG 是在自建内部订单管理能力，还是依赖合作伙伴。
      - - 非航空品牌的嵌入式旅游需求
        - 正向
        - 当前
        - 催生酒店集团、平台伙伴等新买方类别。
        - 量化酒店或忠诚度计划等非航空伙伴的管线和续约模式。
      - - AI、定价和服务自动化
        - 正向
        - 当前
        - 如果工具守住利润率，而不只是提高转化，客户付费意愿会提高。
        - 要求提供 Wenrix 或 Precision 式模块的附加率和 ROI 证据。
      - - 航空公司利润率压力和低于 WACC 的回报
        - 负向
        - 当前
        - 如果分销成本上升却没有明确的收益或效率好处，供应方会抵触。
        - 用航空公司成本和利润率约束来压力测试 ETG 价值主张。
      - - 监管对集中度敏感
        - 负向
        - 中期
        - 如果一个主导合作伙伴关系固化为控制，可能限制退出路径或加深审查。
        - 复核反垄断律师对未来整合路径和合作伙伴依赖的看法。
      - - 合作伙伴集中风险
        - 负向
        - 当前
        - 大型合作伙伴可以保持商业必要性，同时压缩议价能力。
        - 要求按头部合作伙伴披露当前交易量、毛利份额和续约条款。
      - - 缺少公开分部经济数据
        - 负向
        - 当前
        - 无法把吞吐量增长干净地转化为可用于估值的市场份额或利润率模型。
        - 获取按业务线和客户细分拆分的收入、抽佣率和 EBITDA 桥表。
    notes: 多个条目既是市场事实，也是尽调提示，因为当前公开材料对工作流方向讲得充分，但变现细节不足。
