  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Etraveli 的公开风险图景不是由某个生死级运营失败主导，而是由一组相互关联的暴露点主导； 它们最终都指向同一个投资下行情景。最清楚的一线风险，是围绕分销权力和消费者待遇的监管与法律残留。
              欧盟委员会不只是放慢 Booking 交易，而是在认定该合并可能阻碍竞争后直接禁止交易。 这个公开结果今天仍重要，因为 Etraveli 后来又通过 8 年合作续约加深了同一商业关系。
              也就是说，投资者面对的是一家外部验证最强的公司，而这个验证点同时也是最明显的集中度和反垄断敏感点。 第二个一线风险簇是运营质量和消费者信任。MyTrip、GoToGate 和 FlightNetwork
              的评论界面仍集中在退款、取消、客服时延和费用透明度上。相比品牌观感，这些问题更重要， 因为 Etraveli 的业务越来越覆盖履约、反欺诈、定价和预订后服务。
              服务层一旦表现不佳，损害会传导到合作伙伴续约、拒付和品牌层面的转化。


              下一层风险是依赖和执行复杂度。Etraveli 现在连接 Booking 驱动的需求、Precision 的支付风险层、Sabre 和 Mastercard 的分销挂钩、TripStack 面向航司的技术栈，
              以及 Wenrix 的 AI 定价和服务模块。这比纯机票 OTA 的产品面更强， 但也制造了更多接口，商业、技术或合规摩擦都可能在这些接口上累积。 公开信息显示公司规模健康、EBITDA 为正，并获得 KKR
              新资金，所以这不是困境债故事。 未解的问题是，公开验证是否跟上了产品外延扩张。答案是否定的。 公开来源仍没有给出杠杆、合作伙伴经济、正式保证材料，或完全透明的董事会与继任视图。
              因此，风险热力图和否决标准表很重要：它们把一个规模大但部分不透明的平台转化为可观察的断点， 而不是依赖直觉判断。
