  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - B2B 占比继续提升，Booking 续约保持稳定，Precision/Wenrix 成为看得见的利润率增强项。
        - 方向性 EV 区间：€1.9B-€2.4B，约等于已披露 EBITDA 下限的 12x-14x。
        - 需要真实的软件质量经济性，而不只是叙事扩张。
        - 需要披露合作伙伴多元化、更干净的法律页面，以及对投资者友好的当前股权结构条款。
      - - 基准
        - 业务保持健康，但披露缺口、战略可选项受阻和集中度风险只得到部分解决。
        - 方向性 EV 区间：€1.3B-€1.7B，约为已披露 EBITDA 下限的 8x-10x。
        - 如果 KKR 条款继续不透明，B2B 质量只是被主张而未充分量化，这是最可能的情形。
        - 与当前证据包匹配，因此决定今天的入场纪律。
      - - 熊市
        - 增长放慢，消费者摩擦成本持续，投资者给 ETG 的估值更接近低利润分销处理商，而不是高溢价平台。
        - 方向性 EV 区间：€0.8B-€1.2B，约为已披露 EBITDA 下限的 5x-7x。
        - 退出路径受阻、合作伙伴集中和航空产业价值链压力同时咬住公司。
        - 如果尽调发现渠道经济性偏弱或股权结构包袱，该情景就变得相关。
    notes: 区间只是基于公开信息的方向性企业价值启发式估算，来自已披露 EBITDA 和明确折价 / 溢价因子；它们不是公平性意见结论。
    claimRefs:
      - CV007
      - CV022
      - CV023
      - CV030
      - CV032
      - CV033
      - CV040
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Etraveli 2017 年 CVC 收购
        - 历史交易
        - €508M
        - 在当前 B2B 技术栈完全建成前，为该资产提供真实历史底价。
        - 较小、更早期 ETG 的旧控制权交易。
      - - Etraveli 2021 年拟议 Booking 收购
        - 历史战略交易
        - ~€1.63B
        - 衡量 ETG 在航班分销中稀缺价值的最佳直接战略参照。
        - 2023 年被阻止，因此不能视为干净的当前成交价。
      - - Booking Holdings
        - 上市 OTA / 需求所有者
        - 覆盖 220+ 个国家的大型上市旅游集团
        - 显示需求所有权基准比 ETG 大多少。
        - 业务太宽、垂直领域太多，不能作为直接倍数可比。
      - - Expedia Group
        - 上市 OTA / 市场平台
        - 2025 年文件中市值约 $19.97B；覆盖 500+ 家航空公司
        - 作为有重要航空敞口的上市在线旅游基准有参考价值。
        - 并非以航班为中心，且比 ETG 多元化得多。
      - - Sabre
        - 上市旅游基础设施供应商
        - 2024 年文件中市值约 $682M
        - 可作为 ETG B2B 技术栈的基础设施型对照。
        - 传统业务画像更老，也不是接近的消费者需求可比。
      - - eDreams ODIGEO 和 Duffel
        - 替代模式参照
        - 订阅驱动 OTA（Prime 7.8M 会员）和 API 原生嵌入式旅游挑战者
        - 有助于思考 ETG 某些部分可对标的替代变现模式。
        - 这份公开资料包没有干净披露交易倍数。
    notes: 这组可比对象刻意保持混合，因为 ETG 本身横跨消费者需求捕获和旅游基础设施功能；各行是可比视角，不是等权可比公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public valuation references available in this run across ETG’s own transactions,
        large listed OTAs, infrastructure vendors, and model-adjacent challengers, but it excludes paid-database private
        multiples and undisclosed banker comps.
    claimRefs:
      - CV001
      - CV020
      - CV025
      - CV026
      - CV031
      - CV041
  - id: TV005
    title: 投资论点破裂与否决触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 当前轮次没有新披露，却高于基准情景上限定价
        - KKR 条款和债务仍不透明，价格却明显高于约 €1.7B
        - 把好公司论点变成糟糕入场论点。
        - 放弃，或要求大幅更好的条款。
      - - Booking 集中度被证明极端
        - Booking 在收入或 EBITDA 中占比高到不舒服，而多元化证据薄弱
        - 把续约强项转化为依赖风险。
        - 向熊市情景重估，或直接退出。
      - - 消费者服务指标仍偏弱
        - 退款、投诉或拒付趋势没有改善
        - 削弱「B2B 质量能跑赢消费者品牌拖累」这一主张。
        - 套用更低倍数，并要求整改里程碑。
      - - 航班分销或排他性再次升温为监管焦点
        - 出现绑定 ETG 或 Booking 渠道的新反垄断或消费者保护事件
        - 削弱退出可选项，也可能拖慢合作伙伴扩张。
        - 暂停部署资本，重新评估战略下行。
      - - 股权结构或债务被证明对投资者不友好
        - 隐藏杠杆、强硬优先权或限制性少数股权条款浮出水面
        - 把价值从新资金转移给既有利益相关方。
        - 重设定价、要求结构变化，或退出尽调。
    notes: 每个触发点都可从外部监测，并绑定估值纪律，而不是泛泛的风险语言。
    claimRefs:
      - CV002
      - CV004
      - CV028
      - CV029
      - CV032
      - CV033
      - CV042
      - CV044
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构和 KKR 条款
        - 2025 年少数股权投资的价格、证券类型、清算优先权和控制条款
        - 这是今天承销入场的最大单一阻碍。
        - 向管理层 + 律师索取数据室材料。
      - - 债务和流动性
        - 债务时间表、现金、契约和营运资本画像
        - 需要据此判断 EBITDA 会转成股权价值，还是被债务束缚。
        - NDA 下的财务尽调。
      - - 合作伙伴集中度
        - Booking 在预订量、收入和 EBITDA 中的占比，以及续约经济性
        - 只有经济性和集中度可接受，长期合同才有帮助。
        - 结合渠道队列数据做商业尽调。
      - - 消费者信任和服务
        - 按品牌拆分的投诉趋势、退款周期和拒付指标
        - 需要量化公开投诉证据到底是历史噪音，还是持续的利润率拖累。
        - 运营和 CX 仪表盘复核。
      - - 公共政策和法律界面
        - GoToGate、MyTrip 和 Flight Network 当前可链接的隐私、条款和支持页面，以及可用浏览器验证的 Booking/Skyscanner 渠道检查
        - 页面损坏或设门槛会降低对公开尽调记录的信心。
        - 手动浏览器复核，配归档截图和法律签字。
    notes: 这些索取项是从方向性公开区间走向可投资私募估值所需的最低材料包。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV042
