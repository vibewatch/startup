        - id: n1
          label: Etraveli 平台核心
          description: 跨 B2B 和 B2C 的共享编排、履约和模块打包。
        - id: n2
          label: 需求伙伴
          description: Booking.com、Google Flights、Skyscanner、KAYAK 和其他伙伴渠道。
        - id: n3
          label: TripStack
          description: 内容组装、虚拟联运、附加服务和 API 暴露。
        - id: n4
          label: PRECISION
          description: 欺诈和支付风险决策引擎。
        - id: n5
          label: Wenrix
          description: 面向价格、灵活性和服务的 AI 层。
        - id: n6
          label: 支付 / 编排轨道
          description: Mastercard Gateway 和 Sabre Direct Pay 伙伴路径。
        - id: n7
          label: 开放分销标准
          description: IATA NDC 和竞争 API 生态塑造互操作性。
      edges:
        - from: n2
          to: n1
          label: 流量和分销入口
        - from: n1
          to: n3
          label: 内容网关
        - from: n1
          to: n4
          label: 金融科技模块
        - from: n1
          to: n5
          label: AI 模块
        - from: n4
          to: n6
          label: 支付集成
        - from: n3
          to: n7
          label: 内容互操作
        - from: n5
          to: n7
          label: 内容规则依赖
        - from: n6
          to: n1
          label: 外部轨道依赖
    approximationNotes: 依赖箭头表示运营依赖，不代表所有权。ETG 没有发布这张图，但公开模块和伙伴公告足以明确这些关系并绘制出来。
    claimRefs:
      - CE015
      - CE016
      - CE025
      - CE026
      - CE038
      - CE040
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    summary: 公开产品面在分销和履约上最成熟；披露的保障证据较弱；对外销售的金融科技和 AI 模块最新。
    data:
      columns:
        - 能力领域
        - 公开商业化信号
        - 公开保障信号
        - 主要未解问题
      rows:
        - label: TripStack 内容 / 虚拟联运
          values:
            - 强
            - 中等
            - 规模主张和产品页面公开
            - 无公开 SLA 或中断率 KPI
        - label: 预订 / 履约支持
          values:
            - 强
            - 弱至中等
            - 伙伴流程和履约角色公开
            - 无公开正常运行时间或服务解决指标
        - label: PRECISION 欺诈引擎
          values:
            - 中等至强
            - 中等
            - 发布以及 Mastercard/Sabre 合作公开
            - 无公开认证或经审计模型基准包
        - label: 支付编排触达
          values:
            - 中等
            - 中等
            - 已点名网关 / 编排集成公开
            - 商业推出广度未量化
        - label: Wenrix 定价 / 灵活性
          values:
            - 强
            - 中等
            - 产品家族和 API 定位公开
            - 客户结果分布由供应商报告
        - label: Wenrix 服务自动化
          values:
            - 强
            - 中等
            - 具体自动化主张公开
            - 缺少对 +93% 自动化的独立验证
    approximationNotes: 评级是对公开商业化和保障信号的定性总结，不是 ETG 内部成熟度评分。
    claimRefs:
      - CE022
      - CE023
      - CE029
      - CE032
      - CE034
      - CE035
      - CE036
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: ETG 贯穿完整航班客户旅程，从伙伴或消费者需求捕获，到预订后服务，再到最终续约或渠道扩张。
    data:
      nodes:
        - id: discover
          label: 发现界面
          description: 旅客或伙伴从 Gotogate、MyTrip、FlightNetwork、Google Flights、KAYAK、Booking.com，或 Radisson Flights 等酒店主导界面开始。
        - id: compare
          label: 报价比较
          description: ETG 或其伙伴界面在航空公司内容和伙伴渠道之间比较航线、价格、附加服务和打包选项。
        - id: book
          label: 预订并添加服务
          description: 客户完成支付，并可能添加行李、灵活性、支持或打包元素；即使购买界面归伙伴所有，旅客仍是付款方。
        - id: service
          label: 出票与服务
          description: 改签、退款、支持和中断处理，决定需求会转化为持久客户信任，还是只留下单次交易量。
        - id: expand
          label: 续约或扩张
          description: 执行成功后，关系可能加深为更长合同、更多地理市场、更多航空公司内容，或定价和服务 AI 等附加模块。
    approximationNotes: 这是工作流图，不是量化队列。它根据公开发布、伙伴页面和评论证据，反映 ETG 出现在客户旅程中的位置。
    claimRefs:
      - CU001
      - CU003
      - CU010
      - CU014
      - CU022
      - CU035
      - CU037
      - CU041
  - id: FU002
    title: 采纳 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证明从广泛市场存在收窄到少数具名、外部可见的部署和耐久性信号。
    data:
      items:
        - label: ETG 服务的市场
          value: 75
        - label: Booking.com 基于 ETG 技术上线的国家
          value: 57
        - label: Radisson Flights 上线国家
          value: 13
        - label: 保留资料包中的具名生产客户证明
          value: 5
        - label: 已披露多年续约的具名规模伙伴
          value: 1
    approximationNotes: 这是证明质量漏斗，不是转化率漏斗；它混合直接公开计数，展示宽泛的顶线客户触达如何收窄为少得多的外部可验证耐久性信号。
    claimRefs:
      - CU010
      - CU011
      - CU014
      - CU016
      - CU018
      - CU020
      - CU026
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: ETG 同时拥有上线部署和独立佐证时，具名证明质量最高；公开披露止步于上线措辞时，证明会变弱。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 耐久性可见度
        - 上线范围
      rows:
        - label: Booking.com
          values:
            - 公司 + 伙伴 + 新闻联合佐证
            - 经济性低；足迹高
            - 最强（2019 年起点 + 2025 年八年续约）
            - 57 个国家
          tone: positive
        - label: Radisson
          values:
            - 公司新闻稿 + 外部上线客户页面
            - 中等；套装和功能界面可见
            - 中等；未披露长期合同期限
            - 13 个上线国家
          tone: positive
        - label: Ryanair
          values:
            - 公司新闻稿附航空公司引述
            - 低；未披露交易量或 NPS
            - 中等；只有「未来多年」措辞
            - 在三个 ETG 品牌上线
          tone: neutral
        - label: BA / Iberia
          values:
            - 公司新闻稿附两家航空公司引述
            - 低；无转化或附加服务数据
            - 中等；提到多年推进
            - ETG 品牌 + Booking.com
          tone: neutral
        - label: Frontier
          values:
            - 公司新闻稿说明 NDC 连接上线
            - 低；未披露客户 KPI
            - 低至中；新近上线
            - ETG 品牌 + Booking.com，含附加服务
          tone: neutral
    claimRefs:
      - CU010
      - CU011
      - CU014
      - CU016
      - CU018
      - CU020
      - CU028
      - CU036
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 矩阵按可能性和影响力放置 Etraveli 的主要公开风险。最密集区域是中高可能性的高影响敞口，而不是低概率灾难。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 轻微可持续性信号缺口
            - 治理不透明
            - 退款和收费投诉
            - Booking 集中度叠加监管遗留问题
        - label: 中等可能性
          values:
            - 局部客服延迟
            - 岗位补齐延误
            - 反欺诈模型治理缺口
            - Booking / Mastercard / Sabre / Wenrix 合作伙伴栈失灵
        - label: 低可能性
          values:
            - 小型公关事件
            - 单一合作伙伴延迟
            - 单一模块上线失手
            - 隐性杠杆或执法触发严重流动性或合规事件
    approximationNotes: 可能性和影响分档是分析师基于公开证据作出的外部判断，不是公司提供的风险评分。严重影响指可能实质削弱退出选择、估值或合作伙伴经济性的事件。
    claimRefs:
      - CR001
      - CR002
      - CR012
      - CR024
      - CR035
      - CR036
      - CR040
      - CR041
      - CR043
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 有向图展示 Etraveli 的法律、服务和合作伙伴风险如何传导到收入质量、利润率、融资杠杆和估值信心。
    data:
      nodes:
        - id: r1
          label: 监管遗留问题
          description: 反垄断受阻和消费者保护承诺仍留在公开记录里。
        - id: r2
          label: 服务摩擦
          description: 退款、取消、客服和定价投诉在多个品牌中持续出现。
        - id: r3
          label: 合作伙伴集中
          description: Booking 需求，以及对 Mastercard、Sabre、Wenrix 和 TripStack 的依赖，带来技术栈风险。
        - id: r4
          label: 利润率和拒付压力
          description: 服务故障和支付错误会侵蚀实际经济性。
        - id: r5
          label: 续约和多元化风险
          description: 合作伙伴信心和渠道多元化更难证明。
        - id: r6
          label: 融资不透明折价
          description: 杠杆和现金跑道细节缺失，会放大未来融资事件中的估值折价。
        - id: r7
          label: 投资逻辑信心下降
          description: 投资者会把平台宽度视为复杂性，而不是可防守护城河。
      edges:
        - from: r1
          to: r5
          label: 压缩战略选项
        - from: r2
          to: r4
          label: 推高退款、客服成本和拒付
        - from: r3
          to: r5
          label: 抬高续约和集中度风险
        - from: r4
          to: r6
          label: 削弱利润率清晰度
        - from: r5
          to: r6
          label: 降低承销确定性
        - from: r6
          to: r7
          label: 迫使估值打折
        - from: r3
          to: r7
          label: 可能把平台宽度变成复杂性拖累
    approximationNotes: 连线展示的是外部视角下可能成立的因果路径，不是经审计的内部 KPI 瀑布图。该图用于投资监控，不用于运营预测。
    claimRefs:
      - CR012
      - CR018
      - CR034
      - CR036
      - CR040
      - CR041
      - CR042
      - CR044
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: 依赖关系 DAG 展示 Etraveli 自有模块如何架在外部需求、支付和航司关系接口之上。
    data:
      nodes:
        - id: d1
          label: Booking.com
          description: 公开可见的最大外部需求和机票分销合作伙伴。
        - id: d2
          label: Precision / 支付栈
          description: 反欺诈和支付决策层，借助网关和旅行支付合作伙伴商业化。
        - id: d3
          label: Mastercard Gateway
          description: Precision 进入商户网关工作流的分发轨道。
        - id: d4
          label: Sabre Direct Pay
          description: Precision 的支付和旅行行业集成合作伙伴。
        - id: d5
          label: TripStack
          description: Flights-as-a-Service 和航司关系骨干。
        - id: d6
          label: Wenrix
          description: AI 定价、灵活性和服务模块。
        - id: d7
          label: Etraveli 收入和估值
          description: 合作伙伴韧性和技术栈执行会影响该经济结果节点。
      edges:
        - from: d1
          to: d7
          label: 拉动需求，也抬高集中度
        - from: d2
          to: d7
          label: 影响支付经济性和商户价值
        - from: d3
          to: d2
          label: 扩大分发触达
        - from: d4
          to: d2
          label: 延展旅行支付工作流
        - from: d5
          to: d7
          label: 支撑航司和履约能力
        - from: d6
          to: d7
          label: 增加定价和服务上行，也带来集成负担
    approximationNotes: 该图把更大的生态系统简化为少数几项依赖；它们公开可见，也可能对承销判断构成实质影响。
    claimRefs:
      - CR015
      - CR016
      - CR019
      - CR021
      - CR041
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从运营证据和风险推导到当前「继续研究」判断的建议链条。
    data:
      nodes:
        - id: scale
          label: 已披露 2024 年规模和 EBITDA
        - id: b2b
          label: 借助 TripStack、Precision、Wenrix 扩宽 B2B 技术栈
        - id: partner
          label: Booking 续约提升可见度，但加深集中度
        - id: gaps
          label: KKR 条款、债务和股权结构仍不透明
        - id: friction
          label: 消费者信任和监管遗留问题仍可见
        - id: call
          label: 继续研究 / 当前估值立场未知
      edges:
        - from: scale
          to: call
        - from: b2b
          to: call
        - from: partner
          to: call
        - from: gaps
          to: call
        - from: friction
          to: call
    approximationNotes: 节点概括的是决策逻辑，不是实测流程；该图有意采用定性表达。
    claimRefs:
      - CV007
      - CV012
      - CV032
      - CV033
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在已披露 €163M EBITDA 底线上，企业价值启发式估算对简单 EBITDA 倍数的敏感性。
    data:
      items:
        - label: 8x EBITDA
          value: 1304
        - label: 10x EBITDA
          value: 1630
        - label: 12x EBITDA
          value: 1956
        - label: 14x EBITDA
          value: 2282
    approximationNotes: 假设已披露的 €163M EBITDA 底线是当前盈利锚点；数值为企业价值启发式估算，单位为百万欧元。
    claimRefs:
      - CV007
      - CV030
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 仅基于公开证据给出的方向性牛市、基准和熊市 EV 区间。
    data:
      items:
        - label: 熊市 EV（€m）
          low: 800
          high: 1200
        - label: 基准 EV（€m）
          low: 1300
          high: 1700
        - label: 牛市 EV（€m）
          low: 1900
          high: 2400
    approximationNotes: 区间吸收了退出受阻折价和披露缺口；它们是决策带，不是点估计。
    claimRefs:
      - CV030
      - CV031
      - CV033
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 风格评分卡，覆盖市场、证据、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场需求
          value: 7
        - label: 运营证据
          value: 7.5
        - label: B2B 护城河
          value: 7
        - label: 经济性透明度
          value: 4
        - label: 监管 / 信任风险
          value: 3.5
        - label: 当前估值支撑
          value: 4
        - label: 证据质量
          value: 4.5
    approximationNotes: 分数是作者基于所引用公开证据作出的 0-10 分判断，不是管理层提供的评级。
    claimRefs:
      - CV007
      - CV012
      - CV023
      - CV032
      - CV042
      - CV043
      - CV044
