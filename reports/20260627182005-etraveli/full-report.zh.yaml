      - number: '5.4'
        title: 路线图、差异化与开放缺口
        blocks:
          - type: paragraph
            body: >-
              对一家私营旅行公司来说，公开路线图异常可见，即便它基于里程碑而不是发布说明。序列从 2024 年 7 月 Precision 上线，到 2025 年 1 月 Wenrix 收购，再到 2025 年 6 月
              Booking.com 续约和 Mastercard 集成，最后到 2025 年 12 月 Sabre Direct Pay 协议。主线一致：ETG 正把内部机票商务能力转化为可销售的 B2B
              模块，并把平台从搜索与履约拓宽到金融科技和 AI。这让技术差异化变得真实。ETG 可以可信地说，它在一个伞下覆盖分销、虚拟联运、交易风险控制、灵活性商品化和预订后服务，而许多对手仍只专精一两层。


              但同一份公开记录也定义了下一步尽调清单。ETG 没有披露模块级收入结构、附着率、定价机制、API 文档深度或可靠性承诺。它也仍依赖大型伙伴渠道和开放行业标准，这会降低纯协议锁定。实践解读是，ETG
              的护城河来自执行和流程，而不是标准。如果公司持续交付伙伴集成，并变现 Precision 和 Wenrix 等模块，这条护城河可以加深。否则，提供 NDC 内容、旅行支付或 AI 服务的竞争对手，可能比 ETG
              证明整套栈不可或缺更快地复制部分表面能力。
