      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是混合但方向偏正。与泛化机票 OTA 案例相比，收入质量看起来更好，因为 Etraveli 有证据表明它拥有伙伴驱动分销、支付和欺诈工具，以及可能在纯机票转售之外赚钱的 AI
              驱动预订后或定价流程。公开牵引力也真实存在：公司处理大规模旅行量，并披露了正 EBITDA。这些都是有意义的强项。


              阻挡完整承销的不是需求，而是需求如何转化为可审计经济性。公开记录没有显示收入确认政策、按渠道抽佣率、扣除支持和退款成本后的贡献利润、伙伴集中度、毛利率、流动性或杠杆。负面评论证据在这里重要，因为围绕隐藏费用、退款延迟和糟糕支持的反复投诉，正是会在薄价值链业务中侵蚀真实利润率的问题。再加上
              Booking 交易被阻止形成的反垄断先例，正确结论是：Etraveli 可能有足够财务稳健度继续扩张，但当前公开材料还不够披露充分，无法有信心地为资本充足性或持久利润率定价。
