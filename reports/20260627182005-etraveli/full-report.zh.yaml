              - CV041
      - number: '8.3'
        title: 牛、基准与熊情景，以及入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开材料中最干净的情景方法，是用已披露 EBITDA 作锚，再强制估值区间吸收缺失信息。 在牛市情景下，委员会假设 B2B 转向继续改善组合质量，Booking 在续约窗口内保持稳定， Precision 和
              Wenrix 等产品从战略叙事转化为可见利润率支撑。这个情景可以证明估值区间高于旧的 2021 年战略价格， 因为业务现在披露了更高规模和更宽的软件技术栈。在基准情景下，正确答案更接近对已披露 EBITDA
              底线施加谨慎的混合型倍数， 暂不把未披露少数股权条款或溢价控制权动态计入信用。在熊市情景下，公司仍有价值， 但市场会因为受阻退出可选性、持续信任问题，以及航司价值池结构性偏薄而施加更重折扣。


              因此，入场纪律比讲故事更重要。只有当私有轮价格低于基准情景区间顶部， 且投资者对股权结构、杠杆和合作伙伴集中度获得安慰时，公开证据才支持方向上有吸引力的下行 / 上行比。
              如果卖方反而锚定旧的战略报价，却不回答当前披露缺口，正确动作是等待，而不是硬往上够。 这一点尤其成立，因为本轮中若干当前合作伙伴或消费者品牌页面无法直接验证； 这会扩大证据质量折扣，而不是缩小。
            claimRefs:
              - CV007
