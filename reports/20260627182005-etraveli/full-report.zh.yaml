      - number: '7.2'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              最重要的公开法律暴露，不是 Etraveli 缺少销售旅行产品的牌照， 而是监管机构已经认定 Etraveli 与最大酒店 OTA 之间更深的纵向整合会威胁竞争。
              这很关键，因为它压缩了未来围绕退出、排他性和上市路径控制的战略可选项。 欧盟委员会决定和 Etraveli 自身声明共同锚定了这一点；CMA 记录则显示，
              当重大交易触及机票分销时，公司已经处在多司法辖区审查环境中。 第二条法律线索来自消费者待遇。2023 年，欧盟消费者机构点名 Etraveli 等主要 OTA，称其承诺改进退款取消流程并更清晰披露权利。 2026
              年的公开投诉不能逐案证明公司违反了承诺，但它们确实说明退款、取消和透明度仍是活跃的信任与执法敏感议题。


              隐私和欺诈处理义务构成第三层法律风险。Etraveli 的企业隐私政策明确， 集团是合作伙伴和欺诈服务数据流的控制者，并明确提到制裁筛查、政府请求、 反洗钱合规和跨境传输控制。Precision
              的隐私政策更进一步，描述了实时欺诈评分、 可能随商户合同变化的数据留存，以及与商户、服务提供商和监管机构共享数据。 这不意味着存在不当行为。它意味着 Etraveli 已经进入一个比简单导流或店面 OTA
              更重合规的角色。剩余风险在于，公开法律页面对义务和法律依据的描述足以证明边界， 但没有提供外部保证证明、公开 DPA 细节，或足以仅靠披露就清空隐私与支付技术栈的模型治理证据。
