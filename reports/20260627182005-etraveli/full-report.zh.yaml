      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              ETG 的扩张逻辑很清晰。2024-2026 年，公司不再只做通用 OTA 转售， 而是通过 Radisson 切入酒店打包，通过 Ryanair 和 Frontier 推进航司直连和 NDC 增长， 借助
              Amadeus 扩大供应商访问，并通过 Wenrix 向预订后和定价客户扩张。 这种广度重要，因为它展示了公司加深钱包份额的多条路径：更多酒店嵌入、更多航司内容、
              更多合作伙伴履约，以及围绕定价、灵活性、欺诈和服务的更多软件化挂载。 原则上，这应当降低对任何单一流量来源的依赖。


              但在实践中，集中度风险仍披露不足。Booking.com 是公开记录中最清楚的具名规模化合作伙伴， 因而也是最明显的潜在集中点；但 ETG 不按合作伙伴、品牌、地域或渠道披露收入组合或总预订额组合。
              酒店、航司和元搜索界面也一样：证据足以证明客户类型多元， 但不足以证明经济权重多元。这个缺口意味着本章可以用中等信心承销扩张向量， 却无法用同样确定性承销集中度或续约经济。
