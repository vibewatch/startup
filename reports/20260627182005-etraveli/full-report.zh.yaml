      - - 退款和支持质量恶化
        - MyTrip、GoToGate 和 FlightNetwork 的公开投诉强度以及监管评论
        - 退款、取消或隐藏费用投诉持续激增，且未披露 KPI 改善
        - 下调客户生命周期和合作伙伴续约假设；索取服务整改计划
      - - Booking 集中度加深
        - 新披露显示，B2B 交易量或经济收益中绑定 Booking 的比例更高，且缺少足够多元化对冲
        - 再过 12 个月后，Booking 仍是唯一看得见规模的需求伙伴
        - 将渠道集中视为限制投资论点的因素，并下调终局利润率假设
      - - 欺诈 / 支付治理尚未充分验证
        - 公开或尽调证据显示模型控制偏弱、误拒率升高或商户反弹
        - 重要商户流失、监管问询，或无法证明模型治理控制
        - 暂停给金融科技上行加分，把 Precision 重新按风险中心而非护城河承销
      - - 流动性和杠杆不透明持续存在
        - 下一轮融资、再融资或赞助方事件出现时，仍没有债务、现金和契约清晰度
        - 下一次资本事件仍未干净披露杠杆 / 跑道
        - 假设存在下行情景融资风险，扩大估值折扣，并要求贷款方尽调
      - - 整合和人才执行停滞
        - 关键商业或产品岗位持续空缺，或被收购模块未显示附着率 / 留存进展
        - 未来一年看不到 Wenrix、Precision 或 TripStack 的执行里程碑进展
        - 将平台广度叙事从筑护城河改判为复杂度拖累
    notes: 这些触发点把公开不确定性转成可监测阈值。它们是分析师从外部定义的断点，不是管理层指引。
