      - number: '1.4'
        title: 负面信号与未解尽调缺口
        blocks:
          - type: paragraph
            body: >
              负面图景有分量，但尚不击穿投资主线。记录中最大的正式负面事件，是欧盟委员会于 2023 年禁止 Booking/Etraveli 交易；该事件说明，监管者认为把 Booking 的酒店 OTA 力量进一步绑定到
              Etraveli 的机票能力，会带来竞争风险。这没有在运营上削弱 Etraveli，但对于后续讨论平台依赖、退出可选性或战略控制权，它是重要背景。它表明集团足够接近关键分销卡点，监管可能会持续重要。


              客服证据是第二组负面信号。第三方评论来源没有呈现一边倒的负面图景，但确实显示围绕退款、航班时间变更、支持响应、行李和附加价格透明度，以及结账过程中价格变化的反复投诉。Trustpilot 在 2025
              年末的快照显示 Gotogate 评分为 3.1/5，评论量很高；Sitejabber 在 2026 年 6 月的快照略好，为 3.7 星，但仍包含服务质量批评。ComplaintsBoard
              更严厉，不应视为统计代表性样本，但有方向性价值，因为它点出了在低利润 OTA 模式中可能重要的运营失败类型。


              剩余缺口主要关乎精度，而非方向。来源集合证明 Etraveli 规模很大、有资方支持、对 Booking 具有商业重要性，并且越来越由 B2B 驱动。它仍未证明的是确切创始人名单、完整董事会结构、当前杠杆，或
              KKR 少数股权所隐含的精确估值和所有权组合。这些不是小元数据问题；它们是投资者评估控制权、下行保护和下一阶段增长真实经济性的必要输入。
