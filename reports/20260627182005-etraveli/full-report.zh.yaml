chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台边界与当前足迹
        blocks:
          - type: paragraph
            body: >
              Etraveli Group 的身份已经不只是「一家在线旅行社」。官方 About、Facts、Platform 和消费者品牌页面都描述了一家公司：2000 年从 Seat24 起步，2007 年并入
              Etraveli，如今定位为全球机票科技平台，而不是单一门店。主线是机票复杂度：Etraveli
              称其把搜索、预订、履约、支付和欺诈流程组合起来，让自有品牌和第三方伙伴都能规模化分销航空旅行。这个定位很重要，因为它解释了公司为何仍持有消费者 OTA，同时又向旅行栈的其他参与者营销基础设施模块。


              平台描述也合理解释了集团今天的构成。官方页面在 B2C 侧持续列出 Gotogate、Mytrip 和 Flightnetwork，同时把 TripStack、Precision、Wenrix 和
              Flygresor.se 放进更广的模块化 B2B 产品。伙伴名单在不同来源中也相对稳定：Booking.com、Google Flights、Skyscanner 和 KAYAK
              反复出现，构成主要分销关系。因此，最清晰的公司概览不是围绕某一个零售品牌，而是围绕一个多层机票分销系统：它同时变现直接需求和伙伴需求。


              按私营 OTA 标准看，规模已经很大，但当前员工足迹仍有噪音。公司材料在 75 个以上市场上基本一致，年度旅客数也显示快速扩张：2023 年超过 3000 万，2024 年超过 4000 万，到 2025
              年末超过 4800 万。总部也足够清晰：当前来源把公司放在 Stockholm，尽管更早的公告在集团后续重组和收购之前把 Etraveli 锚定在 Uppsala。未解问题是人员和办公室数量。一个当前页面称员工
              3200 多名、外包人员 2300 多名、办公室 11 个，而 25 周年公告称员工 3000 多名、外包人员 1400 多名、办公室 10
              个。尽调上，这足以证明有意义的规模，但在管理层确认前，还不够精确，不能当作干净 KPI 使用。
