companyProfile:
  summary: >-
    Etraveli Group 是一家总部位于 Stockholm 的私营旅行科技公司。公司当前平台可追溯到 2000 年瑞典的 Seat24，以及 2007 年与 Svenska Resegruppen
    的合并。公开材料如今把它描述为全球机票科技平台，而不只是零售 OTA，覆盖 Gotogate、MyTrip、Flightnetwork
    等自有消费者品牌，也覆盖面向伙伴的搜索、预订、履约、支付、反欺诈和定价流程。Booking.com 提供了清晰的规模化生产验证，广泛伙伴分销和一个已披露的 2024 年 EBITDA 数据点也支撑了公司质量；2025 年 KKR
    注入新资本，确认资方兴趣。同一份公开记录在当前估值、杠杆、确切持股比例、创始人 / 董事会细节和集中度经济性上仍明显不完整。
