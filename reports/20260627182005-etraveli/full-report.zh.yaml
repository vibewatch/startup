      - number: '7.4'
        title: 人才、执行风险、缓释措施与否决标准
        blocks:
          - type: paragraph
            body: >-
              Etraveli 的人才风险，与其说是公开的创始人真空，不如说是执行带宽和披露深度。 招聘页面和职位看板释放的可见信号是，公司仍在欺诈预防、B2B 支付、履约、
              劳动力管理、航司关系和企业市场拓展等职能上招聘。作为缓释因素，这是建设性的， 因为它显示公司仍在投入承载新产品面的关键职能。它同时也是风险信号， 因为它确认关键角色仍在补齐，而 Etraveli 又在同步商业化
              Precision、整合 Wenrix， 并维持 TripStack 驱动的合作伙伴增长。Wenrix 自己的招聘页面也强调了同一点： 公司在为顶级 TMC 和 OTA
              关系招聘高级领导，说明收购后的商业化建设仍在进行，而不是已经完成。


              更难排除的人才风险是治理不透明。已审阅的公开材料对当前董事会结构、委员会深度和继任规划仍很薄， 这在一家由赞助方支持、产品边界已经扩宽且资本结构可能复杂的公司里更重要。
              今天可见的缓释因素是真实但不完整的：Etraveli 有大规模、新的少数股权资本、 公开合作伙伴验证、承认监管义务的隐私边界，以及对人员和可持续性信号的持续投入。
              但这些都不能消除明确否决标准的必要性。从投资角度看，如果监管机构重新打开结构性竞争担忧， 如果各品牌投诉强度或退款摩擦明显恶化，如果 Booking 依赖加深却没有多元化证据，
              如果杠杆和流动性在融资事件前仍不透明，或如果 Wenrix、Precision 和 TripStack 周边的关键商业招聘 / 集成里程碑停滞，投资论点就应失效，至少需要大幅重定价。
              这些是可监测的外部事件，不是抽象担忧；在更深的私有尽调可得之前，它们才是风险管理的正确框架。
