      - number: '1.3'
        title: 里程碑、战略转向与运营规模
        blocks:
          - type: paragraph
            body: >
              里程碑序列说明，Etraveli 更像一个整合中的机票平台，而不是静态 OTA。2017 年 CVC 收购和 e-Travel 合并确立了财务资方和更广地理基础。2019 年 TripStack 和 Flight
              Network 交易增加了航空公司集成能力和北美触达。2021 年，Booking Holdings 同意以约 16.3 亿欧元收购 Etraveli，但即便所有权交易失败，「Etraveli
              作为核心机票基础设施」的战略逻辑仍保留下来：英国 CMA 于 2022 年批准交易，欧盟委员会于 2023 年阻止交易，之后两家公司仍加深了商业关系。


              被阻止之后最清晰的里程碑，是 2025 年 Booking.com 八年续约。Etraveli 和 Booking Holdings 的官方公告都称，双方合作始于 2019 年；续约宣布时，Booking.com
              的机票产品已在 57 个国家上线。这一点很重要，因为它把一桩失败收购命题变成了仍在运行的依赖命题：Booking 不需要拥有 Etraveli 才能继续依赖它，Etraveli 也不需要出售自己才能继续借
              Booking 扩张。


              2024 年和 2025 年的运营披露让 B2B 转向更具体。周年材料称，Etraveli 在 2024 年处理了 2500 万个旅行订单，总销售额近 140 亿欧元，EBITDA 超过 1.63
              亿欧元，同时强调航空公司伙伴超过 550 家。与此同时，2024 年 Precision 上线，2025 年 Wenrix 收购完成，Precision 又与 Mastercard 和 Sabre
              建立分销伙伴关系。模式一致：公司在尝试把内部机票商务能力转换为可复用的外部产品，而不只是通过自有门店卖出更多机票。
