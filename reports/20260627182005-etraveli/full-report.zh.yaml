  - id: TP001
    title: 竞争格局表
    columns:
      - 集群
      - 具名替代方案
      - 控制点
      - 为什么影响 Etraveli
      - 相比 Etraveli 的关键劣势
    rows:
      - - 直接面向消费者的 OTA 品牌
        - Kiwi.com；eDreams Prime 等零售竞争对手
        - 消费者预订意图和结账体验
        - 与 Gotogate / MyTrip / Flightnetwork 直接争夺机票交易
        - B2B 履约栈比 Etraveli / TripStack / PRECISION 更窄
      - - 既有 OTA 超级 app
        - Booking.com Flights；Expedia Group 等需求网关
        - 巨大的跨旅游品类需求和 app 流量
        - 能在全球规模把需求导入自有机票漏斗
        - 对更广的平台而言，机票专业化没有 Etraveli 那么核心
      - - 元搜索入口
        - Google Flights；KAYAK；Skyscanner
        - 发现和合作伙伴流量
        - 能把发现商品化，并把议价权推向赢得点击的一方
        - 通常不拥有完整下游履约栈
      - - GDS / 航空零售栈
        - Travelport；Sabre；Amadeus
        - 供应商连接、NDC、服务、航空零售工作流
        - 让航空公司和卖家不用 Etraveli 作为主编排方，也能拼出竞争栈
        - 相比 Etraveli，历史上更偏重基础设施，消费者洞察驱动更弱
      - - API 原生聚合商
        - Travelfusion；Duffel
        - 通过单一 API 接入内容、NDC 或订单管理
        - 削弱大型既有中介的集成优势
        - 公开证据中，全规模搜索、欺诈和服务覆盖不如 Etraveli 充分
      - - 出票 / 结算专家
        - Hahnair
        - 旅行社覆盖、出票、退款保护
        - 提供航空内容和旅行社网络的后备接入
        - 不是完整零售加履约替代品
      - - 航空公司直销现状路径
        - 航空公司直订加 NDC 计划
        - 航司关系和直接服务
        - 让中介持续承受定价和服务压力
        - 航空公司仍需解决比价购物和多航司复杂性
      - - 内部自建
        - 大型 OTA 或航空公司基于开放 API 自建
        - 围绕所选供应商定制编排
        - 对具备工程资源的规模化合作伙伴最可信
        - 实施周期更长，交钥匙履约覆盖更弱
    notes: 格局行混合了直接同业、相邻替代品和潜在进入者；分组依据是旅游预订工作流中的控制点，而不是法律公司类型。
