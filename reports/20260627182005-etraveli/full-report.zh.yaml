      - number: '4.2'
        title: 公开牵引力与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              对一家私营旅行平台来说，公开牵引力信号异常强。Etraveli 25 周年材料披露，2024 年旅行订单 2500 万个、总销售额近 140 亿欧元、EBITDA 超过 1.63 亿欧元；2025 年 12 月
              KKR 交割公告又增加了 160 亿欧元 TTV、超过 4800 万年度旅客，以及公司声称超过 20% 的十年
              CAGR。这些是有分量的处理量，但仍没有解决核心承销问题，因为公司披露的是吞吐量，不是收入。按粗算，总销售额 / 订单约为 560 欧元，TTV / 旅客约为 333
              欧元，有助于校验票种结构和处理规模，但不能反推抽佣率、毛利或服务成本强度。


              行业和上市公司类比更适合划边界，而不是直接可比。IATA 的 2026 年展望称，客票收入仍极其庞大，辅营收入接近航空公司收入的 14%，航空公司自身每名旅客仍只赚约 7.90 美元，ROIC 低于
              WACC。Sabre 的 10-K 显示基础设施供应商同时变现交易轨道和软件层，Expedia 年报则显示更大的上市 OTA 受益于更广市场和广告经济性。这些类比支持 Etraveli
              可在价值链不止一层参与变现的观点，但也再次说明，机票分销结构上利润很薄，辅营捕捉和流程效率格外重要。
