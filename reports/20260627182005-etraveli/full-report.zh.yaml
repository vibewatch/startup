      - number: '2.4'
        title: 增长驱动、采用约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              行业层面的增长逻辑很直接。旅客量仍在上升，航空公司想要更丰富、更个性化的报价，NDC 和 ONE Order 也明确为现代化分销和履约而设计。Etraveli 2024–2025
              年伙伴公告显示，这些标准正在转化为真实商业行为：Frontier 使用直接 NDC，BA 和 Iberia 扩大内容访问，Amadeus 希望转售 ETG 内容，Radisson
              嵌入机票以捕捉套餐需求。Wenrix 和 Precision 增加了另一个驱动：代理商和伙伴不再只追求漏斗顶部需求，也在定价、欺诈、灵活性和服务中寻找利润保护。


              约束同样重要。IATA 仍预计航空公司净利率仅 3.9%，回报低于 WACC，这意味着卖家和供应商会审视每一个分销成本点。监管风险也仍真实存在：英国 CMA 批准
              Booking/Etraveli，欧盟委员会却阻止交易，说明市场可以支持商业依赖，但不一定支持更深的结构性整合。这对估值重要，因为一名伙伴可以在战略上仍不可或缺，但如果关系固化为所有权或市场封锁，仍会遭遇反垄断阻力。


              最大剩余缺口是经济精度。公开档案证明 Etraveli 所处市场规模大、在增长且技术复杂。它没有证明干净的独立
              SAM、渠道结构、抽佣率或伙伴集中度画像。这些未知数不会否定市场机会；它们限制了本章把需求、伙伴关系和技术复杂度转化为可估值市场模型的信心。在管理层披露分部经济性之前，正确姿态是把市场视为有吸引力，但仅部分量化。
