      - number: '6.2'
        title: 具名验证与部署质量
        blocks:
          - type: paragraph
            body: >-
              最强的具名验证来自 Booking.com：合作已经上线，有独立交叉印证，而且足够持久。 Etraveli 和 Booking Holdings 都称，双方合作始于 2019 年，2025 年续约 8 年，
              目前支撑 Booking.com 在 57 个国家的机票业务。这比泛泛的 logo 墙有力得多， 因为它同时给出了具名客户、运营覆盖面和续约决定。Radisson 是次强验证点： ETG 宣布了上线，外部的
              Radisson Flights 页面也仍以面向客户的形态运行， 页面上有打包产品、灵活选项和订单管理功能。这把证据从新闻稿推进到了可观察的生产流程。


              航司合作同样重要，但验证质量更混合。Ryanair、British Airways/Iberia 和 Frontier 看起来都已经在 ETG 品牌中上线，Frontier 还明确延伸到 Booking.com。
              这些披露说明，ETG 不只是消费端 OTA 运营商；它越来越像一层连接组织， 把航司内容、附加产品和打包产品送到 ETG 自有店面和合作伙伴界面。仍然缺失的是可量化的客户结果披露。
              公开记录说明集成已经上线并在扩张，但没有说明它们如何影响转化、复购、附加产品采纳率或客户生命周期价值。
