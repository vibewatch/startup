        - 评论显示退款和支持成本可能重要
        - 要求提供毛利、退款成本、支持成本和欺诈损失明细
      - - 现金、债务和契约余量
        - 卡住跑道和下行情景分析
        - KKR 少数股权交易显示支持，但不显示流动性
        - 要求提供资产负债表、债务协议和流动性瀑布
      - - Booking.com 集中度和续约经济性
        - 无法评估渠道依赖
        - 57 个国家的伙伴覆盖已公开
        - 要求提供 Booking 预订占比、毛利占比和续约经济性
      - - 附加产品购买率和退款负债
        - 无法分析辅助收入质量与获客摩擦之间的关系
        - 评论来源提到付费附加项和退款投诉
        - 要求按品牌提供附加购买率、取消率、退款、拒付和 NPS
    notes: 这些缺失的私有指标，正是公开增长数据无法变成可支撑估值的财务模型的原因。
