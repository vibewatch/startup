  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层与采用表面
        blocks:
          - type: paragraph
            body: >-
              Etraveli 的客户基础不是一个市场、一个买方。公司仍通过 Gotogate、MyTrip 和 FlightNetwork 直接获取需求，这意味着旅客是终端用户和经济付款方，即便 ETG
              是中介。但公开材料也显示，ETG 如今向其他旅行公司销售基础设施，让后者无需自己搭建完整航空商务栈就能提供机票。Booking.com 是最清晰的大规模例子，Radisson 则把 ETG
              延伸到酒店主导的打包场景；Ryanair、British Airways、Iberia 和 Frontier 等航空公司关系显示，ETG 越来越作为供应商内容的分销和履约层运作。Google Flights 和
              KAYAK 展示了位于交易之上的元搜索式发现表面。


              因此，采用证据最强的是渠道广度和流量处理代理指标。ETG 报告 2024 年旅行订单 2500 万个、总销售额近 140 亿欧元，当前材料称集团如今每年在 75 个市场服务超过 4800
              万旅客。TripStack 增加了重要需求密度证据，因为它声称摄入 300 亿个价格点、每日搜索超过 2.4 亿次。这些数字很大，但仍是生态和吞吐量指标，而不是客户质量指标。公开层面，ETG
              可以证明客户表面全球化、多渠道；它还不能证明每个细分贡献多少收入、复购或利润质量。
