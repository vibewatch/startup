      - number: '3.4'
        title: 护城河耐久性与竞争负面证据
        blocks:
          - type: paragraph
            body: >-
              负面证据足够强，Etraveli 的护城河应被表述为耐久但可被挑战，而不是自我强化且不可打破。最清晰的正式挑战来自监管：欧盟委员会阻止 Booking 收购 Etraveli，因为其认定该组合会损害 EEA
              的酒店、客户和竞争，尽管英国 CMA 早些时候批准了同一交易。这种分歧重要，因为它显示 Etraveli 靠近战略重要的分销卡点。第二组负面信号来自消费者信任。Gotogate 和 MyTrip
              在一些平台上保留可用评分，但评论记录反复提出同类投诉：退款、价格变化、行李或附加费用，以及支持响应。


              与此同时，公司没有停滞。Etraveli 的 2024 年规模、550 多家航空公司关系、TripStack 搜索量、Precision 与 Mastercard 和 Sabre 的伙伴关系，以及 Wenrix
              收购，都指向一个正在变宽而不是变窄的栈。KPI 图和风险登记表把取舍讲得很清楚：Etraveli
              有相当的履约和流程深度，但仍依赖伙伴需求，面对开放标准带来的去中介压力，也背负品牌信任包袱；资本更雄厚的既有企业或更模块化的 API 供应商可以利用这些弱点。这是真实护城河，只是不是封闭护城河。
