  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 方向
      - 证据
      - 什么会改变判断
    rows:
      - - B2B 转向叠加合作伙伴续约，支撑的收入结构质量高于纯零售 OTA。
        - 正向论点
        - Booking 续约、TripStack、Precision 和 Wenrix 都显示出基础设施广度。
        - 披露分部收入、毛利和留存，证明 B2B 占比已经足够重要。
      - - 已披露的 2024 年 EBITDA 和 2025 年赞助方支持说明，公司不是困境资产。
        - 正向论点
        - ETG 披露 EBITDA 超过 €163M，并完成 KKR 少数股权资本。
        - 补充债务、现金和契约细节，让韧性可审计，而不是只能推断。
      - - 2021 年战略竞购证明，战略买家曾认可 ETG 航班技术栈的稀缺价值。
        - 正向论点
        - 在 EC 阻止前，Booking 同意以约 €1.63B 收购。
        - 证明当前经济性即使不依赖被阻断的路径，仍能支撑这份战略溢价。
      - - 公开披露仍缺当前估值、工具条款、杠杆和优先权结构。
        - 反向论点
        - KKR 条款未披露，公开口径也没有资产负债表资料包来补上缺口。
        - 在 NDA 下提供当前股权结构、融资文件和 2026 年运营计划。
      - - Booking 退出受阻意味着，最好的历史估值锚点并不是干净的当前底价。
        - 反向论点
        - EC 在 2023 年因竞争原因禁止该合并。
        - 展示替代退出路径、多元化需求渠道，以及更低的反垄断敏感度。
      - - 在航班业务中，消费者信任摩擦侵蚀价值的速度可能快过表面总销售额所暗示的水平。
        - 反向论点
        - ComplaintsBoard 和 2023 年退款承诺显示，服务质量仍是现实问题。
        - 证明投诉强度、退款周期和拒付趋势正在结构性改善。
    notes: 每一行都把正向经营证据与更高置信度估值判断所需的具体披露或执行证明配对。
