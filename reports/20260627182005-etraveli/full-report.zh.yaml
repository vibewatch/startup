      - number: '7.3'
        title: 运营、合作伙伴与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，公开证据指向两个相互连接的弱点：品牌层面的服务摩擦， 以及平台层面的复杂度累积。MyTrip、GoToGate 和 FlightNetwork 的客户评论界面继续提到退款延迟、
              取消摩擦、预订支持循环、行李或座位混淆以及结账加购项。这些投诉本身不是监管结论， 但它们相关，因为 Etraveli 自己的联系页面仍强调订单认证的 24/7 服务运营，
              说明集团在结构上仍暴露于劳动密集度和边缘案例支持复杂度。 与此同时，Etraveli 已经从零售履约扩张到支付、欺诈、定价和预订后自动化。 Precision
              声称在旅行场景中有很深的专用准确性，并嵌在支付决策流里； Wenrix 现在覆盖定价、灵活性和服务；TripStack 仍是航司和虚拟联程骨干。
              更宽的技术栈可能降低单一产品依赖，但也抬高了集成、失效模式和合作伙伴治理风险。


              合作伙伴集中度是核心传导通道。Booking.com 仍是最可见的外部需求合作伙伴。 Mastercard 和 Sabre 重要，是因为它们把 Precision 的分销延伸到旅行支付。 TripStack 和
              Wenrix 重要，是因为它们扩大了 Etraveli 必须集成和商业化的产品足迹， 同时不能制造可靠性或责任缺口。财务上，公开图景好于风险图景，但还不够干净， 无法有信心承销。2024 年 EBITDA
              披露和已完成的 KKR 投资说明公司并不明显缺资本。 但本轮检索没有任何公开来源披露债务、契约空间或合作伙伴层面的经济性； IATA 的 2026 年行业展望也强化了旅行经济结构性偏薄这一点。 因此，即使以
              Etraveli 当前规模，服务质量、合作伙伴续约条款、欺诈损失或营运资本效率出现温和恶化， 仍可能产生实质影响。
