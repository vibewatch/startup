      - number: '5.3'
        title: 信任、可靠性与开发者信号证据
        blocks:
          - type: paragraph
            body: >-
              公开信任图景是混合的。正面来看，ETG 和 Precision 如今展示了具名支付和编排集成，TripStack
              也反复营销履约和客户支持覆盖，而不只是搜索。这意味着公司理解：支付批准、服务或支持在预订后断裂时，航空分销就会失败。Precision 的定位也比泛泛的欺诈营销更实在：产品页强调单一
              API、实时决策，以及在风险、转化和成本之间优化；Sabre 和 Mastercard 公告则显示，ETG 正尝试通过既有旅行支付轨道分销该产品。


              缺失项同样重要。在已审阅表面中，ETG、TripStack、Precision 和 Wenrix 没有公布公开标价、正常运行时间目标、状态页，或 SOC 2、ISO 27001 等具名 ETG/PRECISION
              安全认证。这不能证明这些控制不存在；它意味着公开证明表面比集成表面更薄。最强实务信号来自招聘。ETG 正在 B2B 支付、反欺诈、BI 和伙伴分析岗位上积极招聘，TripStack
              职业页面强调工程和数据科学文化，Wenrix 职业页面把产品方向与 OTA/TMC 分销经济性联系起来。合在一起，这些信号支持一个结论：ETG
              仍在投资这套栈，但尚未暴露足够运营保障细节，让买方或投资者把信任主张视为已独立闭环。
