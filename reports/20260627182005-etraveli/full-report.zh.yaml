  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现表面
        blocks:
          - type: paragraph
            body: >-
              Etraveli 的公开记录支持多流机票商务模型，而不是简单的零售 OTA 佣金命题。消费者层仍重要：MyTrip、Gotogate 和 Flightnetwork 在 75
              个以上市场销售机票和相关服务。但更强的财务信号是，公司如今把同一套基础设施向外打包。Booking.com 八年续约显示，Etraveli 变现伙伴驱动需求，而不只是自有门店；公司平台页面也把
              TripStack、PRECISION 和 Wenrix
              呈现为可单独销售或拼接的模块化能力。这意味着合乎逻辑的收入桶包括消费者预订经济性、伙伴驱动履约经济性、支付和欺诈工具、定价和预订后工具，以及围绕预订旅程附着的辅营或支持费用。


              问题不在于没有规模，而在于缺少真实定价细节。留存来源都没有披露抽佣率、实际佣金、企业合同最低额、收入分成拆分或按渠道的折扣阶梯。公开投诉证据部分填补了这个缺口：它显示 Etraveli
              品牌似乎围绕低基础票价，把支持、行李相关选项、消息、中断保障和其他附加项变现，但没有说明这些项目最终占总销售额多少。正确解读是，Etraveli 拥有不止一个变现杠杆，但公开材料仍只展示了这些经济性的外壳。
