  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Etraveli Group 的产品应从流程而非品牌来理解。当前官网、平台页和 B2B 页面都把公司描述为全球机票科技平台，为伙伴和 ETG 自有消费者品牌组合分销、履约、金融科技和 AI
              能力。这个框架重要，因为它说明公司不只是通过 Gotogate、Mytrip 和 Flightnetwork
              销售机票库存；它也在为企业伙伴打包可复用基础设施，让后者不必从零搭建机票栈，就能获得搜索、预订、履约、风险和预订后功能。


              模块地图如今在公开层面已经明确。TripStack 被呈现为分销和履约网关，通过 API 访问 LCC、FSC、NDC 和虚拟联运内容，并支持辅营和客户支持。PRECISION 是金融科技和风险层，从 ETG
              内部欺诈栈商业化而来，如今通过直接渠道和伙伴渠道销售。Wenrix 是 AI 层，聚焦价格竞争力、灵活性产品和预订后服务。Booking.com 和 Google Flights
              是这种架构落到客户流程中的最佳公开例子：ETG 从外部渠道捕获需求，然后在后端执行搜索、预订和履约。因此，最好把产品理解为模块化航空商务操作系统，而不是传统 OTA 前端。
