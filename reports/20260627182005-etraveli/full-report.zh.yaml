      - number: '2.2'
        title: 有边界的规模测算视角：从航空需求到 Etraveli 可观测吞吐量
        blocks:
          - type: paragraph
            body: >-
              公开记录支持分层规模测算，而不是一句话 TAM。IATA 的 2026 年展望给出外壳：1.053 万亿美元航空收入、7510 亿美元客票收入和 52 亿旅客。这些数字太宽，不能直接称作 Etraveli
              的可服务市场，因为其中包含 Etraveli 不拥有的航空公司经济性。不过它们仍重要，因为它们定义了需求环境的规模；这个环境喂给栈中的每个中介、分销商、元搜索伙伴和结算提供商。


              下一层有用视角，是复杂度创造外包意愿的流程池。IATA 清算所数字——2024 年为 581 家航空公司及关联公司结算 638 亿美元——说明，仅支付和对账就已规模庞大且高度专业。NDC 和 ONE Order
              文档说明了为什么这重要：航空公司和卖家希望释放更丰富内容和更干净的订单管理，而不必从零重建每条连接。TripStack 的 300 亿多个价格点、Frontier 的 NDC 上线、Amadeus 的转售计划和
              Precision 的欺诈工具，正是在这一层产生经济意义。它们不能证明一个完全隔离的 SAM，但能证明市场楔子是机票收入和旅客量中的一个子集：该子集依赖外包连接、履约、结算和服务。


              在这个楔子内部，Etraveli 自身吞吐量已具分量。公司披露 2024 年总销售额约 140 亿欧元、订单 2500 万个，随后又单独描述 160 亿欧元 TTV 和 4800 万旅客。不过，即便最新规模仍低于
              IATA 52 亿旅客展望的 1%。这正是规模测算应保持有边界的原因。Etraveli 大到足以重要，但公开证据不足以宣称它覆盖所有航空收入或所有 OTA 支出。最强证据支持更窄解读：Etraveli
              正在争夺复杂的外包机票商务层，内容广度、伙伴分销、结算、欺诈和预订后服务在这里创造真实切换成本。
