      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              最相关的具名竞争对手分为两组。第一组与 Etraveli 争夺旅客或伙伴需求：Booking Holdings/Booking.com Flights、Expedia、Kiwi.com 和 eDreams
              ODIGEO。Booking 和 Expedia 带来巨大的跨旅行分销规模，Kiwi 用强调保障的虚拟联运主张竞争，eDreams 则用大型订阅项目竞争，把机票购买重塑为会员留存。第二组与 Etraveli
              争夺旅行分销内部的基础设施位置：Travelport、Sabre、Amadeus、Travelfusion、Duffel 和 Hahnair。这些供应商并非都复制了完整 Etraveli 栈，但每一家都能替换
              NDC 访问、票务、支付或 API 原生购物等重要模块。


              Etraveli 最可信的回应是，它已经把不止一层能力装到同一屋檐下。TripStack 给它虚拟联运和大规模购物吞吐量。PRECISION 把栈延伸到欺诈和支付。Wenrix 扩展到 AI
              驱动的定价、灵活性和预订后服务。因此，功能矩阵关注的不是谁品牌最多，而是谁能把航空内容、购物、预订、欺诈和服务逻辑合在一起，不迫使伙伴拼接太多独立供应商。这仍不能消除替代品，但解释了为什么 Etraveli
              可以同时处在 B2C 和 B2B 流程中间。
