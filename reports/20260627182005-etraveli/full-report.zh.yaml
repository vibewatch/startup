      - 买方 / 付款方
      - 重要性
    rows:
      - - 自有品牌机票零售
        - Gotogate/Mytrip/Flightnetwork 上的机票搜索、行程选择、附加产品、结账、履约和支持
        - 非机票住宿和体验收入，除非它支撑以机票为主导的打包产品
        - 旅客是付款方；Etraveli 控制店面和转化漏斗
        - 定义面向消费者的基线，但不是完整市场。
      - - 合作伙伴驱动的机票零售
        - 为 Booking.com 或 Radisson 等合作伙伴提供白标或嵌入式机票
        - 不包含预订和履约执行的通用联盟营销流量
        - 合作伙伴产品 / 商业团队购买能力；旅客支付机票支出
        - 证明 Etraveli 面向企业买方，而不只是直接消费者。
      - - 航司内容分销
        - NDC、直连、全内容访问、附加产品、打包和联程访问
        - 航司运营、机队经济和机场地面服务
        - 航司和旅行销售方共同分享内容触达的经济利益
        - 这是核心的供应商侧工作流层。
      - - 支付和欺诈编排
        - 授权、欺诈检查、结算路由、对账和退款流程
        - 通用企业资金管理或无关商户收单服务
        - 风险、财务和支付负责人购买工作流；旅客为交易出资
        - 说明利润率保护为什么能和票量一样重要。
      - - 预订后服务 / 灵活性
        - 改签、取消、价格保障、灵活性产品和边缘案例服务自动化
        - 未连接平台工作流的线下呼叫中心工作
        - 运营、客户体验和合作伙伴商业团队承担成本
        - 重要，因为服务往往决定旅行经济能否规模化。
      - - 现状替代技术栈
        - GDS 市场、票务赋能方、元搜索合作伙伴和 API 构建者
        - 不具备航空分销功能的宽泛“全部旅行”软件类别
        - 旅行销售方或供应商在自建、购买或组合这些工具之间选择
        - 把市场边界限定在可比较的待完成工作上。
    notes: 纳入和排除支出是定性的，因为公开材料对工作流边界的支持，比对干净收入分拆的支持更强。
