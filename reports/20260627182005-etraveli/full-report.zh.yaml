      - number: '6.3'
        title: 持久性、留存代理指标与客户风险
        blocks:
          - type: paragraph
            body: >-
              留存是 Etraveli 公开客户记录中最薄弱的主要部分。公司没有披露整体业务的 NRR、GRR、 流失率、续约 cohort、合同期限表或客户满意度看板。可用代理指标都是定性的。 Booking.com 的 8
              年续约是最强的持久性信号，因为它表明一个规模化合作伙伴明确选择继续合作。 British Airways 和 Iberia 描述了多年推进，Ryanair 称关系应会在未来数年延续，
              但这些仍是关系信号，不是量化留存指标。


              消费者评论证据提供了重要反向权重。Gotogate、MyTrip 和 FlightNetwork 都有大量评论， 意味着使用量很广，但各品牌反复出现的投诉模式相近：退款拖延、价格变化、费用不满、
              支持升级薄弱和预订后摩擦。这很关键，因为 ETG 所处的机票价值链利润很薄， 服务质量摧毁单位经济的速度可能和前端需求创造收入一样快。正确解读不是 ETG 没有客户；
              它显然有。问题在于，公开材料更清楚地证明了交易量和上线活动， 而不是持久满意度和健康的长期留存。
