      - number: '8.2'
        title: 当前估值背景与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开估值背景只能指方向，不能给定论。历史锚点很清楚：CVC 在 2017 年以 €508 million 收购 Etraveli，Booking 在 2021 年同意支付约 €1.63 billion，KKR 在
              2025 年底买入重要少数股权， 但未披露价格或结构。与此同时，Etraveli 此后披露的业务规模远大于 2017 年资产， 包括 2024 年 25 million 笔订单、接近 €14 billion
              总销售额、超过 €163 million 的 EBITDA， 以及 €16 billion TTV 下每年 48 million+ 旅客。这些事实支持一个判断： 公司已经具备真实规模，不是押注遥远增长的期权。


              但纪律严明的委员会也应注意公开框架做不到什么。2021 年战略报价发生在 2023 年欧盟委员会阻断之前， 也发生在当前私有资本结构再次变得不透明之前。公开可比公司还横跨差异很大的模型： Booking 和
              Expedia 拥有大得多的需求端界面，Sabre 和 Travelport 基础设施更重， eDreams 和 Duffel 则推动差异化的订阅或 API 层。因此，可比表应被视为边界练习，
              而不是盯市电子表格。合理的公开信息方法，是把 Etraveli 当作混合型资产， 使用已披露 EBITDA，再对受阻退出可选性、披露缺口和合作伙伴集中度施加结构性折扣， 而不是假装当前私有价格已经得到证明。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV024
