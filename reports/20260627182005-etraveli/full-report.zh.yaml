      - number: '1.2'
        title: 领导层、所有权与治理可见度
        blocks:
          - type: paragraph
            body: >
              来源包里最强的具名高管信号是 Mathias Hedlund。公司公开公告持续称其为首席执行官，2017 年一份交易公告还明确说他自 2014 年起已担任 CEO。这段长期任期很重要，因为它把今天的 B2B
              平台叙事同更早那个以机票为中心的 OTA 阶段连接起来。公开治理可见度更薄。Lorne Somerville 多次以董事长和 CVC
              高级人士身份出现，足以证明资方监督存在，但已检索来源没有给出完整董事会名单、委员会结构或独立董事图景。


              所有权时间线比治理时间线清楚得多。2017 年，CVC 同意以 5.08 亿欧元收购 Etraveli，随后 Etraveli 在当年晚些时候与 e-Travel
              合并，以加深地理覆盖。资方时代的逻辑至今仍塑造着公司：公司利用私募股权阶段加入 TripStack 和 Flight Network，随后又扩展到金融科技和 AI 驱动的 B2B 工具。2025 年，KKR
              作为重大少数股权投资者与 CVC 并列进入，公司随后宣布该交易于 12
              月完成。关键是，无论公告还是交割新闻稿都没有披露估值或持股比例，因此资本故事的标题应是「新的少数股权资本和验证」，而不是「公开可知的按市值重估」。


              创始人信息上，公开记录对一家这等规模的公司来说出人意料地不完整。已检索来源很擅长列出起源品牌、交易和当前高管，但没有浮现当今集团的清晰创始人名单。这留下真实尽调缺口：后续章节可以复用 Mathias
              Hedlund、Lorne Somerville、CVC 和 KKR 作为已知行为体，但不应仅凭概览章节推断未经验证的创始人持股、创始人角色或董事会构成。
