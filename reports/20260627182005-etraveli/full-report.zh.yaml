      - number: '5.2'
        title: 架构、集成与依赖模型
        blocks:
          - type: paragraph
            body: >-
              留存产品表面允许做出具体架构判断。ETG 自己的 B2B 页面称，伙伴可以集成单项能力，也可以利用完整平台，这意味着共享履约底座之上的松耦合商业模块化。TripStack 页面把分销层讲得具体：它通过 API
              暴露机票内容，支持辅营，并专长于跨非合作承运人的虚拟联运。Precision 更靠近交易批准和支付编排，提供单一 API 集成、实时欺诈决策，并具名集成 Mastercard Gateway 和 Sabre
              Direct Pay。Wenrix 把栈从结账延伸到定价优化、灵活性商品化和预订后改签 / 退款执行。


              这套栈有力量，但依赖也清晰可见。ETG 仍依赖 Booking.com 和 Google Flights
              等第三方需求伙伴获取主要流量表面，它在欺诈与支付上的扩张也依赖外部编排伙伴，而不是完全自有的支付轨道。开放分销标准也限制了硬锁定。IATA 的 NDC 标准明确向任何第三方开放，Travelfusion
              等竞争对手文档也显示，品牌票价、NDC 访问和旅行支付控制并非独有功能类别。因此，ETG 的边际优势不是拥有封闭标准，而是把内容、履约、支付、欺诈和服务运营性地打包成伙伴可用流程。
