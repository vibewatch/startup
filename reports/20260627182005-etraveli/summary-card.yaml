  topStrengths:
    - >-
      Scaled flight-commerce platform with roughly 25 million 2024 travel orders, nearly EUR 14 billion of gross sales,
      and disclosed EBITDA above EUR 163 million.
    - >-
      Booking.com renewed the relationship for eight years in 2025 with flights live across 57 countries, providing
      strong external production validation.
    - >-
      The product footprint now extends beyond OTA retail into partner-facing infrastructure through TripStack,
      PRECISION, Wenrix, and the broader flight-tech stack.
  topRisks:
    - >-
      Current valuation, ownership percentages, leverage, covenant headroom, and preference stack remain undisclosed
      even after KKR's 2025 minority investment.
    - >-
      Booking dependence and the 2023 European Commission block leave regulatory residue and concentration risk around
      the most important commercial relationship.
    - >-
      Persistent customer-service complaints plus broken or challenge-gated public pages reduce confidence in operating
      quality and diligence completeness.
  unresolvedGaps:
    - >-
      Current private valuation, instrument terms, and cap-table / preference overhang after the KKR transaction are not
      publicly disclosed.
    - >-
      Debt load, cash balance, leverage, covenant package, and liquidity sufficiency remain unverified in public
      sources.
    - >-
      Revenue mix, take rate, and partner concentration economics across Booking.com, owned brands, and B2B modules
      remain opaque.
    - Verified current headcount, board composition, and a full founder roster remain unresolved.
