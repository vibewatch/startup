- id: public-traction-and-unit-economics-proxies
  title: Public traction and unit-economics proxies
  body: 'The public traction signal is unusually strong for a private travel platform. Etraveli’s 25th-anniversary materials disclosed 25 million travel orders, nearly €14 billion of gross sales, and EBITDA above €163 million for 2024; the December 2025 KKR-close release added €16 billion of TTV, more than 48 million annual travelers, and a claimed decade-long CAGR above 20%. Those are meaningful processing volumes, but they still do not solve the main underwrite question because the company disclosed throughput, not revenue. Gross sales per order works out to roughly €560 and TTV per traveler to roughly €333, which is useful for sanity-checking ticket mix and processing scale, but not for reconstructing take rate, gross profit, or service-cost intensity.


    Industry and public-company analogs help more with boundary-setting than with direct comparability. IATA’s 2026 outlook says passenger ticket revenue remains enormous, ancillary revenue is nearly 14% of airline revenue, and airlines themselves still earn only about $7.90 per passenger with ROIC below WACC. Sabre’s 10-K shows infrastructure vendors monetize both transaction rails and software layers, while Expedia’s annual report shows larger public OTAs benefit from broader marketplace and advertising economics. Those analogs support the idea that Etraveli can monetarily participate in more than one layer of the value chain, but they also reinforce that flight distribution is structurally thin-margin and that ancillary capture plus workflow efficiency matter disproportionately.'
