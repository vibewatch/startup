  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Audited B2C versus B2B revenue split, plus stream-level take rates and partner revenue shares.
    whyItMatters: Without mix and take-rate data, public throughput cannot be converted into revenue quality or concentration risk.
    diligencePath: Request a channel-mix bridge from gross sales and TTV to recognized revenue, segmented by consumer brands, partner flights, fintech, and software modules.
    relatedQuestionRefs:
    - QI004
    - QI005
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin, contribution margin, refund cost, fraud loss, support cost, and chargeback data.
    whyItMatters: Margin path cannot be underwritten from EBITDA alone in a refund- and service-intensive category.
    diligencePath: Request monthly or quarterly gross-profit bridges with support, refund, and fraud-loss detail by brand and by partner channel.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Cash balance, debt maturities, covenant package, revolver availability, and runway model.
    whyItMatters: Capital adequacy cannot be assessed from sponsor ownership and EBITDA alone.
    diligencePath: Request latest balance sheet, debt agreements, lender covenant calculations, and 12-18 month base / downside runway model.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Booking.com share of bookings, gross profit, and renewal economics, plus concentration for other major partners.
    whyItMatters: A large opaque partner channel can improve growth while weakening bargaining power and exit optionality.
    diligencePath: Request concentration schedules by bookings, revenue, gross profit, and EBITDA contribution for the top ten partners.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: ancillary-quality
    missingEvidence: Attach rates, opt-out rates, refund rates, and customer-complaint incidence for ancillary and support products.
    whyItMatters: Ancillary revenue can be high quality or highly corrosive depending on refund and service behavior.
    diligencePath: Request brand-level ancillary cohorts showing purchase rates, cancellation rates, chargebacks, complaint rates, and net contribution.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI002
    - TI005
