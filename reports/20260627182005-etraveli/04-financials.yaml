- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwrite
  - Public clue available
  - Exact diligence path
  rows:
  - - B2C vs B2B revenue mix
    - Prevents valuation of quality and concentration by stream
    - Platform and partner materials prove both streams exist
    - Request audited revenue split by brand, partner distribution, fintech, and software
  - - Take rate / net revenue yield
    - Prevents conversion of gross sales and TTV into revenue
    - Gross sales, orders, and TTV are disclosed
    - Request net revenue by channel plus take-rate bridge
  - - Gross margin and servicing cost
    - Blocks true margin path assessment
    - Reviews imply refunds and support costs can matter
    - Request gross profit, refund cost, support cost, and fraud-loss schedule
  - - Cash, debt, and covenant headroom
    - Blocks runway and downside analysis
    - KKR minority event shows support but not liquidity
    - Request balance sheet, debt agreements, and liquidity waterfall
  - - Booking.com concentration and renewal economics
    - Blocks assessment of channel dependence
    - 57-country partner footprint is public
    - Request Booking share of bookings, gross profit, and renewal economics
  - - Add-on attach rates and refund liability
    - Blocks analysis of ancillary quality versus customer-acquisition friction
    - Review sources mention paid extras and refund complaints
    - Request attach rates, cancellation rates, refunds, chargebacks, and NPS by brand
  notes: These are the specific missing private metrics that prevent public traction from becoming a valuation-grade financial model.
