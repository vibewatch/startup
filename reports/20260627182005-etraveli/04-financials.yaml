- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Owned OTA airfare resale
    - Consumer brands sell tickets and related travel services directly to travelers
    - Gross sales / booking
    - Large but opaque; consumer brands active in 75+ markets
    - 'Medium: scale is public, realized take rate is not'
    - Request channel revenue, take rate, and refund-adjusted margin by brand
  - - Partner-powered flights
    - ETG provides search, booking, and fulfilment for partners such as Booking.com
    - Partner contract / processed booking
    - Booking.com flights live in 57 countries on ETG technology
    - High on existence, low on economics
    - Request partner revenue share, minimums, and renewal terms
  - - TripStack / airline-integration services
    - Airline-content access, virtual interlining, and fulfilment capabilities sold into the ecosystem
    - Platform / transaction economics
    - Publicly positioned as modular B2B capability; no pricing disclosed
    - Medium
    - Request TripStack revenue, client count, and attach rate to consumer volume
  - - PRECISION payments and fraud
    - Fraud prevention and payment-risk tooling sold to sellers and airlines
    - Software / service contract
    - Commercial partnerships announced with Mastercard and Sabre
    - Medium
    - Request ARR, implementation fees, fraud-loss assumptions, and customer retention
  - - Wenrix pricing and servicing AI
    - Pricing, flexibility, and post-booking optimization tooling
    - Software / optimization contract
    - Acquired in 2026; trusted by 60+ OTAs and TMCs per company claim
    - Medium
    - Request Wenrix standalone revenue, margins, and cross-sell pipeline
  - - Ancillary and support add-ons
    - Baggage, alerts, disruption cover, support, and other extras around bookings
    - Per-booking attach / fee
    - Visible in review evidence but not quantified publicly
    - Low to medium
    - Request attach rates, refund incidence, and net contribution by add-on
