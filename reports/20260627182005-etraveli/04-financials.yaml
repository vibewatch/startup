- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is therefore mixed but directionally positive. Revenue quality looks better than a generic flight-OTA case because Etraveli has evidence of partner-powered distribution, payments and fraud tooling, and AI-driven post-booking or pricing workflows that could earn money away from pure airfare resale. Public traction is also real: the company processes large travel volumes and disclosed positive EBITDA. Those are meaningful strengths.


    What still blocks a full underwrite is not demand, but conversion from demand into auditable economics. The public record does not show revenue recognition policy, take rate by channel, contribution margin after support and refund costs, partner concentration, gross margin, liquidity, or leverage. Adverse review evidence matters here because repeated complaints around hidden fees, refund delays, and poor support are exactly the kinds of issues that can erode realized margin in a thin-value-chain business. Add the antitrust precedent from the blocked Booking deal, and the right conclusion is that Etraveli may be financially solid enough to keep expanding, but the current public package is not disclosure-rich enough to price capital adequacy or durable margin power with confidence.'
