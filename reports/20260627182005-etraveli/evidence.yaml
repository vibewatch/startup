evidenceGaps:
  - type: missing-source
    severity: material
    topic: founders
    missingEvidence: >-
      An authoritative founder roster for Seat24, SRG, and the current Etraveli Group entity is missing from the
      retrieved public source set.
    whyItMatters: >-
      Founder identity and continuing economic influence matter for assessing key-person risk, governance continuity,
      and management incentives.
    diligencePath: >-
      Request Swedish registry extracts, early incorporation records, and archived corporate/about pages that name
      founders explicitly.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: >-
      A current board roster, independent-director list, committee structure, and reserved-matters schedule are not
      disclosed publicly in the retrieved pack.
    whyItMatters: >-
      Sponsor-backed private companies can look operationally strong while still having governance asymmetries that
      affect control, oversight, and minority protection.
    diligencePath: >-
      Request the current board list, committee charters, shareholder agreement summary, and most recent governance
      calendar directly from management.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: workforce
    missingEvidence: >-
      The company needs to reconcile exact employee, outsourced-staff, and office counts across current public pages and
      2025 releases.
    whyItMatters: Headcount precision affects operating leverage, outsourcing dependence, and confidence in headline KPI discipline.
    diligencePath: >-
      Ask management for the current org chart summary, FTE count, outsourced-headcount definition, and office list as
      of quarter-end 2026.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Post-KKR valuation, ownership percentages, board rights, and any secondary component were not publicly disclosed.
    whyItMatters: >-
      Without the economics of the minority deal, it is hard to assess sponsor mark-up, liquidity pressure, and future
      exit optionality.
    diligencePath: >-
      Request the KKR transaction summary deck, cap-table waterfall, board-rights schedule, and any fairness materials
      shared with investors.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: capital-structure
    missingEvidence: >-
      No retrieved source discloses debt facilities, leverage ratios, maturities, or covenant package for the current
      private company.
    whyItMatters: Leverage can materially change downside resilience even when gross sales and EBITDA look healthy.
    diligencePath: Request the latest debt summary, covenant calculations, lender list, and any hedging or guarantee arrangements.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: TO004 chronology completeness
    missingEvidence: >-
      The milestone table is a public-source chronology, not a complete internal history, and it lacks private
      milestones such as board changes, debt events, and any undisclosed secondary transactions.
    whyItMatters: >-
      The overview chronology is strong enough for strategic context, but a complete diligence timeline needs
      private-company events that do not appear in public press materials.
    diligencePath: >-
      Request a management-prepared corporate timeline covering financing closes, board changes, debt amendments, major
      customer wins, and product launches from 2020-2026.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: >-
      A third-party market study or public benchmark that isolates the revenue pool for outsourced flight fulfillment,
      ticketing, settlement, and servicing rather than total airline or OTA spend.
    whyItMatters: >-
      Without a bounded external denominator, TAM and SAM can only be framed as layered proxies rather than a clean
      market share model.
    diligencePath: >-
      Request management’s internal SAM definition, attach-rate assumptions, and any banker or analyst market maps used
      in strategy reviews.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: >-
      Segment-level revenue, gross margin, and take-rate split across owned-brand OTA, partner-powered flights,
