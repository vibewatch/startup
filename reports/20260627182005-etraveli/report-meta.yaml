companyProfile:
  summary: Etraveli Group is a Stockholm-headquartered private travel-technology company whose current platform traces back to Seat24 in Sweden in 2000 and the 2007 merger with Svenska Resegruppen. Public materials now describe the business as a global flight-technology platform rather than only a retail OTA, spanning owned consumer brands such as Gotogate, MyTrip, and Flightnetwork plus partner-facing search, booking, fulfilment, payments, fraud, and pricing workflows. The company has clear scaled-production proof through Booking.com, broad partner distribution, and one disclosed 2024 EBITDA datapoint, while fresh KKR capital in 2025 confirms sponsor interest. The same public record remains meaningfully incomplete on current valuation, leverage, exact ownership percentages, founder / board detail, and concentration economics.
  foundedDate: "2000-01-01"
  founders:
    - name: Seat24 / current-group founder roster not publicly disclosed
      role: Origin founders not cleanly named in retained public sources
      background: Retained sources identify Seat24 as the 2000 origin and the 2007 Seat24-SRG merger, but they do not surface a complete founder roster for the present-day Etraveli Group entity.
      claimRefs: [CO001, CO002, CO016]
  foundingLocation: Sweden
  headquarters: Stockholm, Sweden
  productSummary: Flight-commerce platform spanning consumer OTA brands and B2B flight infrastructure, including partner-powered search, booking, fulfilment, fraud, payments, and pricing workflows.
  customerFocus: Consumers booking flights through owned brands plus travel partners, hotels, airlines, and other travel sellers embedding or outsourcing flight retail and fulfilment.
  businessModel: Monetizes owned-brand OTA bookings and partner-powered flight retail / fulfilment, with expanding software and fintech modules around fraud prevention, payments, pricing, and servicing.
  stage: Late-stage private, sponsor-backed
  fundingStatus: CVC remains majority owner and KKR closed a significant minority investment in December 2025, but public sources do not disclose valuation, ownership percentages, or instrument terms.
