      - number: '1.4'
        title: Adverse signals and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >
              The adverse picture is meaningful but not thesis-breaking. The biggest formal adverse event in the record
              is the European Commission’s 2023 prohibition of the Booking/Etraveli deal, which established that
              regulators saw competitive risk in further tying Booking’s hotel OTA power to Etraveli’s flights
              capability. That did not cripple Etraveli operationally, but it is important context for any later
              discussion of platform dependence, exit optionality, or strategic control. It shows that the group sits
              close enough to critical distribution chokepoints that regulators may continue to matter.


              Customer-service evidence is the second adverse cluster. Third-party review sources do not paint a
              uniformly negative picture, but they do show recurring complaints around refunds, schedule changes,
              support responsiveness, baggage and ancillary pricing clarity, and price changes during checkout.
              Trustpilot’s late-2025 snapshot showed Gotogate at 3.1 out of 5 with very high review volume, while
              Sitejabber’s June 2026 snapshot was somewhat better at 3.7 stars but still contained service-quality
              criticisms. ComplaintsBoard is harsher and should not be treated as statistically representative, yet it
              is directionally useful because it names the kinds of operational failures that can matter in a
              thin-margin OTA model.


              The remaining gaps are mostly about precision, not direction. The source set proves that Etraveli is
              large, sponsor-backed, commercially important to Booking, and increasingly B2B-led. What it still does not
              prove is the exact founder roster, the full board structure, current leverage, or the precise valuation
              and ownership mix implied by KKR’s minority stake. Those are not minor metadata issues; they are the
              inputs an investor would need to assess control, downside protection, and the true economics of the next
              leg of growth.
