      - number: '7.3'
        title: Operational, Partner, and Financial-Model Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the public evidence points to two linked weaknesses: service friction at the brand layer
              and complexity accumulation at the platform layer. Customer-review surfaces across MyTrip, GoToGate, and
              FlightNetwork continue to cite refund delay, cancellation friction, booking-support loops, baggage or
              seating confusion, and checkout add-ons. Those complaints are not by themselves a regulatory finding, but
              they are relevant because Etraveli’s own contact page still emphasizes order-authenticated, 24/7 service
              operations, implying the group remains structurally exposed to labor intensity and edge-case support
              complexity. At the same time, Etraveli has expanded from retail fulfilment into payments, fraud, pricing,
              and post-booking automation. Precision claims deep travel-specific accuracy and sits inside the payment
              decision flow; Wenrix now spans pricing, flexibility, and servicing; TripStack remains the airline and
              virtual-interlining backbone. That broader stack may reduce single-product dependence, but it also raises
              integration, failure-mode, and partner-governance risk.


              Partner concentration is the central transmission channel. Booking.com remains the most visible external
              demand partner. Mastercard and Sabre matter because they extend Precision distribution into travel
              payments. TripStack and Wenrix matter because they expand the product footprint that Etraveli must
              integrate and commercialize without creating reliability or accountability gaps. Financially, the public
              picture is better than the risk picture but not clean enough to underwrite with confidence. The 2024
              EBITDA disclosure and completed KKR investment show the company is not obviously capital-starved. However,
              no public source in this run discloses debt, covenant headroom, or partner-level economics, and IATA’s
              2026 industry outlook reinforces that travel economics remain structurally thin. That means a modest
              deterioration in service quality, partner renewal terms, fraud loss, or working-capital efficiency can
              still matter materially even at Etraveli’s current scale.
