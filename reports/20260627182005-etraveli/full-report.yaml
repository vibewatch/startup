  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Etraveli’s public-risk picture is not dominated by one existential operating failure; it is dominated by a
              stack of correlated exposure points that all feed the same investment downside. The clearest top-tier risk
              is regulatory and legal residue around distribution power and consumer treatment. The European Commission
              did not merely slow the Booking transaction; it prohibited it after concluding the merger would likely
              impede competition, and that public outcome still matters because Etraveli later deepened the same
              commercial relationship through an eight-year partnership renewal. That means investors are looking at a
              company whose strongest external proof point is also its most obvious concentration and antitrust
              sensitivity. The second top-tier cluster is operating quality and consumer trust. Review surfaces across
              MyTrip, GoToGate, and FlightNetwork still center on refunds, cancellations, support latency, and fee
              transparency. Those issues matter more than brand optics because Etraveli’s business increasingly spans
              fulfilment, fraud prevention, pricing, and post-booking servicing. If the service layer performs poorly,
              the damage transmits into partner renewals, chargebacks, and brand-level conversion.


              The next tier of risk is dependency and execution complexity. Etraveli now links Booking-driven demand,
              Precision’s payment-risk layer, Sabre and Mastercard distribution hooks, TripStack’s airline-facing stack,
              and Wenrix’s AI pricing and servicing modules. That is a stronger product surface than a pure flight OTA,
              but it also creates more interfaces where commercial, technical, or compliance friction can accumulate.
              Publicly the company shows healthy scale, positive EBITDA, and fresh KKR capital, so this is not a
              distressed-credit story. The unresolved question is whether public proof has kept pace with product
              sprawl. It has not. Public sources still do not give leverage, partner economics, formal assurance
              artifacts, or a fully transparent board-and-succession view. The risk heatmap and kill-criteria table
              therefore matter because they convert a large but partly opaque platform into observable breakpoints
              rather than intuition.
            claimRefs:
              - CR001
              - CR002
