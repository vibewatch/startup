      - number: '3.4'
        title: Moat durability and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is strong enough that Etraveli’s moat should be framed as durable-but-contestable
              rather than self-reinforcing and unbreakable. The clearest formal challenge is regulatory: the European
              Commission blocked Booking’s attempt to acquire Etraveli because it concluded the combination would harm
              hotels, customers, and competition in the EEA, even though the UK CMA cleared the same transaction
              earlier. That divergence matters because it shows Etraveli sits close to strategically important
              distribution choke points. A second adverse cluster comes from consumer trust. Gotogate and MyTrip retain
              usable review scores on some platforms, but the review record repeatedly raises the same complaints around
              refunds, price changes, baggage or add-on charges, and support responsiveness.


              At the same time, the company is not standing still. Etraveli’s 2024 scale, its 550-plus airline
              relationships, TripStack search volume, Precision partnerships with Mastercard and Sabre, and Wenrix
              acquisition all point to a stack that is widening rather than narrowing. The KPI figure and risk register
              make the trade-off clear: Etraveli has meaningful fulfillment and workflow depth, but it still relies on
              partner demand, faces open-standards disintermediation pressure, and carries brand-trust baggage that
              better-capitalized incumbents or more modular API vendors can exploit. That is a real moat, just not a
              closed one.
