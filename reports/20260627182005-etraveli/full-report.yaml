      - number: '6.4'
        title: Expansion path and concentration risk
        blocks:
          - type: paragraph
            body: >-
              ETG's expansion logic is easy to see. In 2024-2026 it pushed beyond generic OTA resale into hotel
              packaging through Radisson, airline direct-connect and NDC growth through Ryanair and Frontier, broader
              supplier access through Amadeus, and post-booking/pricing customer expansion through Wenrix. That breadth
              matters because it shows multiple ways the company can deepen wallet share: more hotel embedding, more
              airline content, more partner fulfillment, and more software-like attach around pricing, flexibility,
              fraud, and servicing. In principle, that should reduce dependence on any single traffic source.


              In practice, concentration risk remains underdisclosed. Booking.com is the clearest named scale partner in
              the public record and therefore the clearest potential concentration point, yet ETG does not publish
              revenue mix or gross-booking mix by partner, brand, geography, or channel. The same is true for hotels,
              airlines, and metasearch surfaces: there is enough evidence to prove customer diversification by type, but
              not enough to prove diversification by economic weight. That gap means the chapter can underwrite
              expansion vectors with moderate confidence, but it cannot underwrite concentration or renewal economics
              with the same certainty.
