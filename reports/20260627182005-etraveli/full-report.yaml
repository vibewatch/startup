  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Etraveli looks investable as a business but not yet underwritable as a price. The positive case is real:
              the company disclosed meaningful 2024 scale, positive EBITDA, and a continuing shift toward higher-quality
              B2B infrastructure. The Booking.com renewal through the next decade, the KKR minority close, and the
              widening product set across TripStack, Precision, and Wenrix all support the idea that Etraveli is no
              longer just a thin retail airfare reseller. It is becoming a hybrid flight-commerce platform with partner
              distribution, payments and fraud tooling, and post-booking or pricing workflow exposure. That is the part
              of the story that can merit a valuation above a commodity OTA template.


              The anti-thesis is just as important and is why the recommendation stays at research-more rather than buy.
              The public record still does not disclose the KKR entry price, debt or preference overhang, or partner
              concentration economics. The strongest strategic valuation datapoint on record remains the 2021 Booking
              bid, but that path was blocked by the European Commission and therefore cannot be treated as a clean live
              floor. On top of that, consumer complaint evidence and the 2023 consumer-protection commitments show that
              service quality and trust still matter in the downside case. The right read is that Etraveli may be a good
              company, but the current public pack is not good enough to accept an undisclosed private mark without more
              diligence or sharper price discipline.
            claimRefs:
