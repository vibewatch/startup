  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Matrix placing Etraveli’s main public risks by likelihood and impact. The densest zone is high-impact exposure
      with medium-to-high likelihood rather than low-probability catastrophe.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - Minor sustainability signaling gap
            - Governance opacity
            - Refund and fee complaints
            - Booking concentration plus regulatory residue
        - label: Medium Likelihood
          values:
            - Localized support delays
            - Role-fill slippage
            - Fraud-model governance gap
            - Partner-stack failure across Booking / Mastercard / Sabre / Wenrix
        - label: Low Likelihood
          values:
            - Small PR issue
            - Single-partner delay
            - One-module launch miss
            - Severe liquidity or compliance event triggered by hidden leverage or enforcement
    approximationNotes: >-
      Likelihood and impact bands are outside-in analyst judgments based on public evidence, not company-provided risk
      scoring. Critical impact reflects events that can materially impair exit optionality, valuation, or partner
      economics.
    claimRefs:
      - CR001
      - CR002
      - CR012
      - CR024
      - CR035
      - CR036
      - CR040
      - CR041
      - CR043
  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      Directed map of how Etraveli’s legal, service, and partner risks flow into revenue quality, margins, financing
      leverage, and valuation confidence.
    data:
      nodes:
        - id: r1
          label: Regulatory residue
          description: Antitrust block plus consumer-protection commitments remain part of the public record.
        - id: r2
          label: Service friction
          description: Refund, cancellation, support, and pricing complaints persist across brands.
        - id: r3
          label: Partner concentration
          description: Booking demand plus Mastercard, Sabre, Wenrix, and TripStack dependencies create stack risk.
        - id: r4
          label: Margin and chargeback pressure
          description: Service breakdowns and payments errors can erode realized economics.
        - id: r5
          label: Renewal and diversification risk
          description: Partner confidence and channel diversity become harder to prove.
        - id: r6
          label: Financing opacity discount
          description: Missing leverage and runway detail widen valuation discounts in future capital events.
        - id: r7
          label: Thesis confidence declines
          description: Investors treat platform breadth as complexity rather than defensible moat.
      edges:
        - from: r1
          to: r5
          label: narrows strategic options
        - from: r2
          to: r4
          label: drives refunds, support cost, and chargebacks
        - from: r3
          to: r5
          label: raises renewal and concentration risk
        - from: r4
          to: r6
          label: weakens margin clarity
        - from: r5
          to: r6
          label: reduces underwriting certainty
        - from: r6
          to: r7
          label: forces valuation discount
        - from: r3
          to: r7
          label: can turn platform breadth into complexity drag
    approximationNotes: >-
      Edges show plausible outside-in causal paths rather than audited internal KPI waterfalls. The chart is intended
      for investment monitoring, not operational forecasting.
    claimRefs:
      - CR012
      - CR018
      - CR034
      - CR036
      - CR040
      - CR041
      - CR042
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Dependency DAG showing how Etraveli’s owned modules sit on top of external demand, payment, and
      airline-relationship interfaces.
    data:
      nodes:
        - id: d1
          label: Booking.com
          description: Largest visible external demand and flights-distribution partner.
        - id: d2
          label: Precision / payments stack
          description: Fraud and payment decision layer commercialized through gateway and travel-payments partners.
        - id: d3
          label: Mastercard Gateway
          description: Distribution rail for Precision inside merchant gateway workflows.
        - id: d4
          label: Sabre Direct Pay
          description: Payment and travel-industry integration partner for Precision.
        - id: d5
          label: TripStack
          description: Flights-as-a-Service and airline-relations backbone.
        - id: d6
          label: Wenrix
          description: AI pricing, flexibility, and servicing module.
        - id: d7
          label: Etraveli revenue and valuation
          description: Economic outcome node affected by partner durability and stack execution.
      edges:
        - from: d1
          to: d7
          label: drives demand and concentration
        - from: d2
          to: d7
          label: affects payments economics and merchant value
        - from: d3
          to: d2
          label: extends distribution reach
        - from: d4
          to: d2
          label: extends travel-payments workflow
        - from: d5
          to: d7
          label: supports airline and fulfilment capability
        - from: d6
          to: d7
          label: adds pricing and servicing upside but integration burden
    approximationNotes: >-
      The map simplifies a broader ecosystem into the few dependencies that are both publicly visible and likely
      material to underwriting.
    claimRefs:
      - CR015
      - CR016
      - CR019
      - CR021
      - CR041
      - CR042
