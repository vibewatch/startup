chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and current footprint
        blocks:
          - type: paragraph
            body: >
              Etraveli Group’s identity is no longer just “an online travel agency.” The official About, Facts,
              Platform, and consumer-brand pages all describe a business that started in 2000 as Seat24, merged into
              Etraveli in 2007, and now positions itself as a global flight-technology platform rather than a single
              storefront. The core through-line is flight complexity: Etraveli says it combines search, booking,
              fulfilment, payments, and fraud workflows so both its own brands and third-party partners can distribute
              air travel at scale. That positioning matters because it explains why the company still owns consumer OTAs
              while simultaneously marketing infrastructure modules to the rest of the travel stack.


              The platform description also gives a credible explanation for what sits inside the group today. Official
              pages consistently name Gotogate, Mytrip, and Flightnetwork on the B2C side, while TripStack, Precision,
              Wenrix, and Flygresor.se sit inside a broader modular B2B offering. The partner list is similarly stable
              across sources: Booking.com, Google Flights, Skyscanner, and KAYAK recur as major distribution
              relationships. That makes the cleanest company-overview read less about one retail brand and more about a
              multi-layer flight-distribution system that monetizes both direct demand and partner demand.


              Scale is large by private OTA standards, but the exact current workforce footprint is still noisy. Company
              materials line up on 75-plus markets and a sharp expansion in annual travellers from 30 million-plus in
              2023 to 40 million-plus in 2024 and 48 million-plus by late 2025. Headquarters also looks clear enough:
              current sources place the company in Stockholm even though older releases anchored Etraveli in Uppsala
              before the group’s later reorganization and acquisitions. The open issue is staffing and office count. One
              current page says 3,200-plus employees, 2,300-plus outsourced staff, and 11 offices, while the
              25th-anniversary release says 3,000-plus employees, 1,400-plus outsourced staff, and 10 offices. For
              diligence, that is close enough to prove meaningful scale, but not precise enough to treat as a clean KPI
              without management confirmation.
