  summary: >-
    Etraveli Group is a Stockholm-headquartered private travel-technology company whose current platform traces back to
    Seat24 in Sweden in 2000 and the 2007 merger with Svenska Resegruppen. Public materials now describe the business as
    a global flight-technology platform rather than only a retail OTA, spanning owned consumer brands such as Gotogate,
