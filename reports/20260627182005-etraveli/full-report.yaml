  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - B2B mix keeps rising, Booking renewal remains stable, and Precision/Wenrix become visible margin enhancers.
        - 'Directional EV range: €1.9B-€2.4B, equivalent to roughly 12x-14x the disclosed EBITDA floor.'
        - Requires real software-quality economics rather than only narrative expansion.
        - >-
          Would need disclosed partner diversification, cleaner legal pages, and current cap-table terms that are
          investor-friendly.
      - - Base
        - >-
          Business remains healthy, but disclosure gaps, blocked strategic optionality, and concentration risk stay only
          partly resolved.
        - 'Directional EV range: €1.3B-€1.7B, or roughly 8x-10x the disclosed EBITDA floor.'
        - Most likely case if KKR terms stay opaque and B2B quality is asserted but not fully quantified.
        - Fits the current evidence pack and therefore governs entry discipline today.
      - - Bear
        - >-
          Growth slows, consumer-friction costs persist, and investors mark ETG closer to a thin-margin distribution
          processor than a premium platform.
        - 'Directional EV range: €0.8B-€1.2B, or roughly 5x-7x the disclosed EBITDA floor.'
        - Blocked exit route, partner concentration, and airline-industry value-chain pressure all bite at once.
        - Becomes relevant if diligence reveals weak channel economics or a cap-table overhang.
    notes: >-
      Ranges are public-only directional enterprise-value heuristics built from disclosed EBITDA and explicit discount
      or premium factors; they are not fairness-opinion outputs.
