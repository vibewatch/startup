  - id: TP001
    title: Competitive landscape table
    columns:
      - Cluster
      - Named alternatives
      - What they control
      - Why they matter to Etraveli
      - Key disadvantage vs Etraveli
    rows:
      - - Direct consumer OTA brands
        - Kiwi.com; eDreams Prime
        - Consumer booking intent and checkout experience
        - Compete directly with Gotogate/MyTrip/Flightnetwork for flight transactions
        - Narrower B2B fulfillment stack than Etraveli/TripStack/PRECISION
      - - Incumbent OTA super-apps
        - Booking.com Flights; Expedia Group
        - Massive cross-travel demand and app traffic
        - Can route demand into owned flight funnels at global scale
        - Flight specialization is less central to the broader platform than for Etraveli
      - - Metasearch gateways
        - Google Flights; KAYAK; Skyscanner
        - Discovery and partner traffic
        - Can commoditize discovery and shift bargaining power toward whoever wins the click
        - Typically do not own the full downstream fulfillment stack
      - - GDS / airline-retailing stacks
        - Travelport; Sabre; Amadeus
        - Supplier connectivity, NDC, servicing, airline retailing workflows
        - Enable airlines and sellers to assemble competing stacks without using Etraveli as prime orchestrator
        - Historically more infrastructure-heavy and less consumer-insight-led than Etraveli
      - - API-native aggregators
        - Travelfusion; Duffel
        - Single-API access to content, NDC, or order management
        - Reduce the integration advantage of a large incumbent intermediary
        - Less proof of full-scale search, fraud, and servicing breadth than Etraveli discloses
      - - Ticketing / settlement specialists
        - Hahnair
        - Agency reach, ticketing, reimbursement protection
        - Offer fallback access to airline content and agency networks
        - Not a full retail-and-fulfillment substitute
      - - Status quo direct-airline path
        - Airline direct booking plus NDC initiatives
        - Carrier relationship and direct servicing
        - Keeps intermediaries under pricing and service pressure
        - Airlines must still solve comparison shopping and multi-carrier complexity
      - - Internal build
        - Large OTA or airline builds on open APIs
        - Customized orchestration over chosen vendors
        - Most credible for scaled partners with engineering resources
        - Longer implementation path and less turnkey fulfillment coverage
    notes: >-
      Landscape rows mix direct peers, adjacent substitutes, and likely entrants; they are grouped by control point in
      the travel-booking workflow rather than by legal company type.
