  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation and adoption surface
        blocks:
          - type: paragraph
            body: >-
              Etraveli's customer base is not one market with one buyer. The company still acquires demand directly
              through Gotogate, MyTrip, and FlightNetwork, which means the traveler is the end user and economic payer
              even when ETG is the intermediary. But the public pack also shows that ETG now sells infrastructure to
              other travel companies that want flights without building the full air-commerce stack themselves.
              Booking.com is the clearest large-scale example, while Radisson extends ETG into hotel-led packaging, and
              airline relationships such as Ryanair, British Airways, Iberia, and Frontier show ETG increasingly
              operating as a distribution and fulfillment layer for supplier content. Google Flights and KAYAK
              illustrate the metasearch-style discovery surfaces that sit above the transaction.


              The adoption evidence is therefore strongest on channel breadth and traffic-processing proxies. ETG
              reported 25 million travel orders in 2024, nearly €14 billion of gross sales, and current materials say
              the group now serves more than 48 million travellers annually across 75 markets. TripStack adds important
              demand density evidence because it claims 30 billion ingested price points and more than 240 million daily
              searches. Those are large numbers, but they are still ecosystem and throughput metrics rather than
              customer-quality metrics. Publicly, ETG can show that the customer surface is global and multi-channel; it
              cannot yet show how much revenue, repeat usage, or margin quality each segment contributes.
