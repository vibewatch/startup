      - CI023
      - CI024
      - CI025
      - CI033
  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      Positive sponsor and profitability signals coexist with major blind spots on liquidity, leverage, concentration,
      and cost leakage.
    data:
      columns:
        - Positive signal
        - Missing disclosure
        - Cash-flow effect
        - Net read
      rows:
        - label: Sponsor support
          values:
            - KKR minority investment closed and CVC stayed majority owner
            - No disclosed check size or proceeds split
            - Could strengthen optionality but cannot be translated into runway
            - Positive signal, incomplete capital adequacy
        - label: Operating profitability
          values:
            - 2024 EBITDA >€163M was disclosed
            - No revenue line, gross margin, or free-cash-flow bridge
            - Unknown conversion from EBITDA to cash generation
            - Helpful but not sufficient
        - label: Strategic M&A
          values:
            - Wenrix acquisition announced in January 2026
            - No acquisition price or integration budget disclosed
            - Expansion spend may absorb liquidity before showing returns
            - Growth-positive, cash-opaque
        - label: Partner concentration
          values:
            - Booking partnership is large and extended through an eight-year term
            - No share of bookings or gross profit by partner
            - A concentrated channel could amplify renewal or bargaining risk
            - Material unknown
        - label: Refund and service friction
          values:
            - Review sources show repeated fee and refund complaints
            - No reserve, chargeback, or refund-liability disclosure
            - Support and refund leakage can erode thin-margin economics
            - Adverse quality risk
        - label: Debt and runway
          values:
            - No direct distress signal in retained sources
            - No debt stack, cash balance, or covenant data
            - Runway cannot be underwritten publicly
            - Core blocker
    approximationNotes: >-
      The matrix is qualitative because the public record does not disclose enough balance-sheet detail to quantify
      liquidity or leverage exposure directly.
    claimRefs:
      - CI031
      - CI032
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
      - CI040
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      ETG’s public architecture can be read as a four-layer air-commerce stack with shared fulfilment in the middle and
      specialist modules around it.
    data:
      layers:
        - label: Demand capture
          detail: Partner surfaces such as Booking.com and Google Flights originate shopper intent and deep-link traffic.
        - label: Shopping and content assembly
          detail: >-
            TripStack exposes LCC, FSC, NDC, ancillaries, and virtual-interlining content through API and white-label
            flows.
        - label: Booking fulfilment and support
          detail: ETG executes booking, fulfilment, and customer-support workflows for both partner and consumer channels.
        - label: Transaction risk and payments
          detail: PRECISION handles fraud decisioning and plugs into Mastercard Gateway and Sabre Direct Pay.
        - label: Post-booking optimization
          detail: Wenrix extends the stack into pricing, flexibility, and servicing automation across content sources.
    approximationNotes: >-
      Layer order reflects the operating flow implied by the reviewed product pages; ETG does not publish a formal
      architecture diagram.
    claimRefs:
      - CE021
      - CE027
      - CE028
      - CE041
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    summary: >-
      A partner-facing workflow starts with external demand capture and ends with ETG-owned fulfilment and service, with
      optional fintech and AI modules layered in.
    data:
      nodes:
        - id: n1
          label: Traveler intent appears
          description: Demand originates on Booking.com, Google Flights, or ETG-owned consumer brands.
        - id: n2
          label: Search and offer assembly
          description: TripStack/API layer returns LCC, FSC, NDC, and virtual-interlining options plus ancillaries.
        - id: n3
          label: Checkout and risk scoring
          description: PRECISION evaluates fraud, conversion, and payment risk in real time.
        - id: n4
          label: Booking execution
          description: ETG handles booking and downstream fulfilment tasks for the partner flow.
        - id: n5
          label: Optional flexibility upsell
          description: Wenrix FlexEngine can add price-lock, refund guarantee, and flexibility options.
        - id: n6
          label: Post-booking change / refund servicing
          description: Wenrix DeepFlow and ETG support workflows manage edge cases after purchase.
      edges:
        - from: n1
          to: n2
          label: traffic handoff
        - from: n2
          to: n3
          label: offer selected
        - from: n3
          to: n4
          label: approved booking
        - from: n4
          to: n5
          label: optional ancillary path
        - from: n4
          to: n6
          label: service event
        - from: n5
          to: n6
          label: flexibility claim / change request
    approximationNotes: >-
      The flow is synthesized from ETG, TripStack, Precision, Wenrix, Booking.com, and Google product descriptions
      rather than from a public ETG process diagram.
    claimRefs:
      - CE005
      - CE007
      - CE014
      - CE020
      - CE030
      - CE041
      - CE042
  - id: FE003
    title: Critical dependency map
    type: dag
    summary: >-
      ETG’s stack depends on external demand, airline/content standards, payment rails, and acquired specialist brands
      as much as on its own orchestration layer.
    data:
      nodes:
        - id: n1
          label: Etraveli platform core
          description: Shared orchestration, fulfilment, and module packaging across B2B and B2C.
        - id: n2
          label: Demand partners
          description: Booking.com, Google Flights, Skyscanner, KAYAK, and other partner channels.
        - id: n3
          label: TripStack
          description: Content assembly, virtual interlining, ancillaries, and API exposure.
        - id: n4
          label: PRECISION
          description: Fraud and payment-risk decision engine.
        - id: n5
          label: Wenrix
          description: AI layer for price, flexibility, and servicing.
        - id: n6
          label: Payment/orchestration rails
          description: Mastercard Gateway and Sabre Direct Pay partner paths.
        - id: n7
          label: Open distribution standards
          description: IATA NDC and rival API ecosystems shape interoperability.
      edges:
        - from: n2
          to: n1
          label: traffic and distribution access
        - from: n1
          to: n3
          label: content gateway
        - from: n1
          to: n4
          label: fintech module
        - from: n1
          to: n5
          label: AI module
        - from: n4
          to: n6
          label: payment integration
        - from: n3
          to: n7
          label: content interoperability
        - from: n5
          to: n7
          label: content-rule dependency
        - from: n6
          to: n1
          label: external rail dependency
    approximationNotes: >-
      Dependency arrows show operational dependence, not ownership. ETG does not publish this graph, but the public
      module and partner announcements make these relationships explicit enough to map.
    claimRefs:
      - CE015
      - CE016
      - CE025
      - CE026
      - CE038
      - CE040
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    summary: >-
      The public product surface is most mature in distribution and fulfilment, less mature in disclosed assurance
      evidence, and newest in externally sold fintech and AI modules.
    data:
      columns:
        - Capability area
        - Public commercialization signal
        - Public assurance signal
        - Main open issue
      rows:
        - label: TripStack content / virtual interlining
          values:
            - Strong
            - Moderate
            - Scale claims and product pages are public
            - No public SLA or disruption-rate KPI
        - label: Booking / fulfilment support
          values:
            - Strong
            - Weak-to-moderate
            - Partner flows and fulfilment role are public
            - No public uptime or service-resolution metrics
        - label: PRECISION fraud engine
          values:
            - Moderate-to-strong
            - Moderate
            - Launch plus Mastercard/Sabre partnerships are public
            - No public certification or audited model benchmark pack
        - label: Payment-orchestration reach
          values:
            - Moderate
            - Moderate
            - Named gateway/orchestration integrations are public
            - Commercial rollout breadth not quantified
        - label: Wenrix pricing / flexibility
          values:
            - Strong
            - Moderate
            - Product families and API positioning are public
            - Customer-outcome distribution is vendor-reported
        - label: Wenrix servicing automation
          values:
            - Strong
            - Moderate
            - Specific automation claims are public
            - Independent validation of +93% automation is absent
    approximationNotes: >-
      Ratings are qualitative summaries of public commercialization and assurance signals, not internal ETG maturity
      scores.
    claimRefs:
      - CE022
      - CE023
      - CE029
      - CE032
      - CE034
