  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Passenger growth and record traffic
        - positive
        - Current
        - Expands overall flight demand and the transaction base available to intermediaries and partners.
        - Check whether Etraveli is outgrowing traffic through share gains or merely riding the market.
      - - NDC rich-content adoption
        - positive
        - Current to medium term
        - Makes outsourced airline-content connectivity more valuable when sellers want ancillaries and bundles.
        - Measure how much of ETG volume is already NDC-enabled by supplier and by region.
      - - ONE Order and fulfilment simplification
        - positive
        - Medium term
        - Could reduce servicing friction and improve partner economics if ETG captures the workflow transition.
        - Ask whether ETG is building internal order-management capabilities or relying on partners.
      - - Embedded travel demand from non-air brands
        - positive
        - Current
        - Creates new buyer classes such as hotel groups and platform partners.
        - Quantify pipeline and renewal patterns for non-air partners like hotel or loyalty programs.
      - - AI, pricing, and servicing automation
        - positive
        - Current
        - Raises willingness to pay if the tools protect margin rather than only boosting conversion.
        - Request proof of attach rates and ROI for Wenrix or Precision style modules.
      - - Airline margin pressure and sub-WACC returns
        - negative
        - Current
        - Suppliers will resist economics that raise distribution cost without clear yield or efficiency benefits.
        - Stress-test ETG value propositions against airline cost and margin constraints.
      - - Regulatory concentration sensitivity
        - negative
        - Medium term
        - Can limit exit routes or deepen scrutiny if one dominant partner relationship hardens into control.
        - Review antitrust counsel views on future consolidation paths and partner dependencies.
      - - Partner concentration risk
        - negative
        - Current
        - A large partner can remain commercially essential while also compressing bargaining power.
        - Request current volume and gross-profit share by top partners and renewal terms.
      - - Missing public segment economics
        - negative
        - Current
        - Prevents clean translation from throughput growth into valuation-grade market share or margin models.
        - Obtain revenue, take-rate, and EBITDA bridge by business line and customer segment.
    notes: >-
