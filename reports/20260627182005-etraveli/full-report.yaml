      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The segmentation evidence is strongest when the market is viewed through jobs-to-be-done rather than
              company labels. In the owned-brand channel, the traveler is both user and economic payer while Etraveli
              controls merchandising, checkout, fulfilment, and support. In partner-powered channels such as Booking.com
              Flights or Radisson Flights, the buyer is usually a partner product, ecommerce, or commercial team trying
              to improve conversion, retention, and package attachment without building a flights stack alone. The end
              user is still the traveler, but the economic logic includes the partner’s lifetime value, cross-sell, and
              brand-retention goals.


              Supplier-side segmentation looks different. Airlines care about content accuracy, ancillaries, servicing,
              and control of customer data, which is why Ryanair’s approved-OTA framing and Frontier’s NDC launch both
              matter. Amadeus adds another buyer class: travel sellers and resellers that want one-stop access to
              diversified air content, including virtual interlining. Google Flights carves out the discovery layer by
              acting as a free metasearch gateway with deep links to partners. Hahnair, Travelfusion, Travelport, and
              Duffel show that the market also includes agencies, TMCs, enterprises, and developers that want ticketing
              reach, direct-connect content, AI-supported servicing, or fast API integration.


              This segmentation matters for adoption timing because each segment buys on a different budget line. A
              hotel group buys flights as a conversion and packaging tool. An airline buys or permits access based on
              distribution economics and control. An OTA or TMC buys connectivity based on breadth, speed, servicing,
              and margin protection. A developer-led entrant buys ease of integration and time-to-launch. That diversity
              is why a single TAM headline is misleading: Etraveli’s real opportunity depends on how many of these
              buyers decide that outsourced flight-commerce complexity is cheaper than building or stitching
              alternatives themselves.
            claimRefs:
