      - number: '1.2'
        title: Leadership, ownership, and governance visibility
        blocks:
          - type: paragraph
            body: >
              The strongest named executive signal in the source pack is Mathias Hedlund. Public company releases
              consistently identify him as chief executive officer, and a 2017 transaction release explicitly says he
              had already been CEO since 2014. That long tenure matters because it links the current B2B-platform story
              to the earlier period when Etraveli was still primarily known as a flight-centric OTA. Public governance
              visibility is thinner. Lorne Somerville appears repeatedly as chairman and as a senior CVC figure, which
              is enough to show sponsor oversight, but the retrieved sources do not provide a full board roster,
              committee structure, or independent-director picture.


              Ownership chronology is much clearer than governance chronology. In 2017, CVC agreed to buy Etraveli for
              €508 million, then Etraveli combined with e-Travel later that year to deepen geographic coverage. That
              sponsor-era logic still shapes the business today: the company used the private-equity period to add
              TripStack and Flight Network, then later broaden into fintech and AI-driven B2B tooling. In 2025, KKR
              joined as a significant minority investor alongside CVC, and the company later announced the close of that
              transaction in December. Importantly, neither the announcement nor the closing release disclosed valuation
              or ownership percentages, so the capital-story headline is “new minority capital and validation,” not
              “publicly knowable mark-to-market valuation.”


              Founders are where the public record is surprisingly incomplete for a company of this scale. The retrieved
              sources are good at naming origin brands, transactions, and current executives, but they do not surface a
              clean founder roster for the present-day group. That leaves a real diligence gap: later chapters can reuse
              Mathias Hedlund, Lorne Somerville, CVC, and KKR as known actors, but they should not infer unverified
              founder ownership, founder roles, or board composition from the overview chapter alone.
