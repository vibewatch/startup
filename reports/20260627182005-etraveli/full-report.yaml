  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Etraveli 2017 CVC acquisition
        - Historical transaction
        - €508M
        - Provides a real historical floor for the asset before the current B2B stack was fully built.
        - Old control deal from a smaller, earlier-stage ETG.
      - - Etraveli 2021 proposed Booking acquisition
        - Historical strategic transaction
        - ~€1.63B
        - Best direct strategic reference for ETG’s scarcity value in flight distribution.
        - Blocked in 2023, so cannot be treated as a clean current clearing price.
      - - Booking Holdings
        - Public OTA / demand owner
        - Very large-cap listed travel group with 220+ country reach
        - Shows how much larger the demand-ownership benchmark is than ETG.
        - Too broad and multi-vertical to be a direct multiple comp.
      - - Expedia Group
        - Public OTA / marketplace
        - ~$19.97B market value in 2025 filing; 500+ airlines
        - Useful as a listed online-travel benchmark with meaningful air exposure.
        - Not flight-centric and far more diversified than ETG.
      - - Sabre
        - Public travel infrastructure vendor
        - ~$682M market value in 2024 filing
        - Useful as an infrastructure-heavy counterpoint for ETG’s B2B stack.
        - Older legacy profile and not a close consumer-demand comp.
      - - eDreams ODIGEO and Duffel
        - Alternative model references
        - Subscription-led OTA (Prime 7.8M members) and API-native embedded-travel challenger
        - Helpful for thinking about alternative monetization models that ETG could be compared against in parts.
        - No clean disclosed transaction multiple in this public pack.
    notes: >-
      The set is intentionally hybrid because ETG itself spans consumer demand capture and travel-infrastructure
      functions; rows are comparable lenses, not equal-weight comps.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public valuation references available in this run across ETG’s own transactions,
        large listed OTAs, infrastructure vendors, and model-adjacent challengers, but it excludes paid-database private
        multiples and undisclosed banker comps.
