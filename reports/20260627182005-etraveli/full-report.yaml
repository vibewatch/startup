      - number: '7.2'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              The most material public legal exposure is not that Etraveli lacks licenses to sell travel; it is that
              regulators have already judged deeper vertical integration between Etraveli and the largest hotel OTA to
              be competition-threatening. That matters because it narrows future strategic optionality around exit,
              exclusivity, and route-to-market control. The Commission decision and Etraveli’s own statement anchor that
              point, while the CMA record shows the company already lives in a multi-jurisdictional review environment
              when major transactions touch flights distribution. A second legal track comes from consumer treatment. In
              2023 EU consumer authorities named Etraveli among major OTAs that committed to refund-cancellation
              improvements and clearer rights disclosures. Public complaints in 2026 do not prove non-compliance with
              that commitment case-by-case, but they do show that refunds, cancellations, and transparency remain live
              trust and enforcement-sensitive topics.


              Privacy and fraud-processing obligations add a third legal layer. Etraveli’s corporate privacy policy
              makes clear the group is a controller for partner and fraud-service data flows and explicitly references
              sanctions screening, government requests, anti-money-laundering compliance, and cross-border transfer
              controls. Precision’s privacy policy goes further by describing real-time fraud scoring, data retention
              that may vary by merchant contract, and data-sharing with merchants, service providers, and regulators.
              This does not imply misconduct. It does imply that Etraveli has moved into a more compliance-intensive
              role than a simple referral or storefront OTA. The residual risk is that public legal pages describe
              obligations and legal bases well enough to prove the perimeter, but they do not provide external assurance
              proof, public DPA detail, or model-governance evidence strong enough to clear the privacy-and-payments
              stack on disclosure alone.
            claimRefs:
