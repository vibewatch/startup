      - number: '8.3'
        title: Bull, Base, and Bear Scenarios with Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest scenario method in the public pack is to use disclosed EBITDA as an anchor and then force the
              range to absorb what is missing. In the bull case, the committee assumes the B2B pivot keeps improving mix
              quality, Booking remains stable through the renewal window, and products like Precision and Wenrix convert
              from strategic narrative into visible margin support. That case can justify a range above the old 2021
              strategic price because the business now discloses higher scale and a broader software stack. In the base
              case, the right answer is closer to a cautious hybrid multiple on the disclosed EBITDA floor, with no
              credit yet for undisclosed minority terms or premium control dynamics. In the bear case, the company is
              still valuable, but the market applies sharper discounts for blocked exit optionality, persistent trust
              issues, and the fact that airline value pools remain structurally thin.


              Entry discipline therefore matters more than storytelling. Public evidence can support directionally
              attractive downside-versus-upside only if the private round clears below the top of the base-case range
              and the investor gets comfort on cap table, leverage, and partner concentration. If sellers anchor instead
              to the old strategic bid without answering current disclosure gaps, the right move is to wait rather than
              stretch. That is especially true because several current partner or consumer-brand pages were not directly
              verifiable in this run, which widens the evidence-quality discount instead of narrowing it.
