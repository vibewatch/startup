  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Current round prices above base-case ceiling without new disclosure
        - Price set materially above ~€1.7B while KKR terms and debt remain opaque
        - Turns a good-company thesis into a bad-entry thesis.
        - Decline or require materially better terms.
      - - Booking concentration proves extreme
        - Booking share of revenue or EBITDA is uncomfortably high with weak diversification evidence
        - Converts renewal strength into dependency risk.
        - Re-rate toward bear case or walk away.
      - - Consumer-service metrics remain weak
        - Refund, complaint, or chargeback trends do not show improvement
        - Undermines the claim that B2B quality can outgrow consumer brand drag.
        - Apply lower multiple and require remediation milestones.
      - - Regulatory heat reopens around flight distribution or exclusivity
        - New antitrust or consumer-protection event tied to ETG or the Booking channel
        - Cuts exit optionality and can slow partner expansion.
        - Pause deployment and reassess strategic downside.
      - - Cap table or debt proves investor-unfriendly
        - Hidden leverage, hard preferences, or restrictive minority terms emerge
        - Transfers value from new money to existing stakeholders.
        - Reset pricing, demand structure changes, or exit diligence.
    notes: Each trigger is externally monitorable and tied to valuation discipline rather than generic risk language.
    claimRefs:
      - CV002
      - CV004
      - CV028
      - CV029
      - CV032
      - CV033
      - CV042
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and KKR terms
        - Price, security, liquidation preference, and control terms of the 2025 minority investment
        - This is the single biggest blocker to underwriting today’s entry.
        - Management + counsel data room request.
      - - Debt and liquidity
        - Debt schedule, cash, covenants, and working-capital profile
        - Required to judge whether EBITDA converts into equity value or is encumbered.
        - Finance diligence under NDA.
      - - Partner concentration
        - Booking share of bookings, revenue, and EBITDA plus renewal economics
        - A long contract helps only if the economics and concentration are acceptable.
        - Commercial diligence with channel cohort data.
      - - Consumer trust and servicing
        - Complaint trends, refund cycle times, and chargeback metrics by brand
        - Needed to quantify whether public complaint evidence is legacy noise or ongoing margin drag.
        - Operations and CX dashboard review.
      - - Public-policy and legal surface
        - >-
          Current linked privacy, terms, and support pages for GoToGate, MyTrip, and Flight Network plus
          browser-verifiable Booking/Skyscanner channel checks
        - Broken or gated pages lower confidence in the public diligence record.
        - Manual browser review with archived screenshots and legal sign-off.
    notes: These asks are the minimum package needed to move from directional public ranges to an investable private mark.
    claimRefs:
      - CV032
      - CV033
      - CV034
