      - number: '8.2'
        title: Current Valuation Context and Comparable Frame
        blocks:
          - type: paragraph
            body: >-
              The public valuation context is directional, not definitive. The historical anchor points are clear: CVC
              bought Etraveli for €508 million in 2017, Booking agreed to pay about €1.63 billion in 2021, and KKR
              bought a significant minority stake in late 2025 without disclosing price or structure. At the same time,
              Etraveli has since disclosed a much larger business than the 2017 asset, including 25 million 2024 orders,
              nearly €14 billion of gross sales, EBITDA above €163 million, and 48 million-plus annual travellers at €16
              billion of TTV. Those facts support the view that the company has real scale and is not an option on
              distant growth.


              But a disciplined committee should also note what the public frame cannot do. The 2021 strategic bid was
              struck before the 2023 EC block and before the current private capital structure became opaque again.
              Public comparables also span very different models: Booking and Expedia own far larger demand surfaces,
              Sabre and Travelport are infrastructure-heavy, and eDreams and Duffel push differentiated subscription or
              API layers. That is why the comparable table should be read as a bounding exercise rather than a
              mark-to-market spreadsheet. A reasonable public-only method is to treat Etraveli as a hybrid asset and use
              disclosed EBITDA plus structural discounts for blocked exit optionality, disclosure gaps, and partner
              concentration rather than pretending the current private price is already proven.
            claimRefs:
