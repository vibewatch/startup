      - number: '2.2'
        title: 'Bounded sizing lenses: from airline demand to Etraveli-observed throughput'
        blocks:
          - type: paragraph
            body: >-
              The public record supports a layered sizing exercise, not a clean one-line TAM. IATA’s 2026 outlook gives
              the outer shell: $1.053 trillion of airline revenue, $751 billion of passenger ticket revenue, and 5.2
              billion passengers. Those numbers are too broad to call Etraveli’s addressable market directly because
              they include airline economics that Etraveli does not own. Still, they matter because they define the
              scale of the demand environment feeding every intermediary, distributor, metasearch partner, and
              settlement provider in the stack.


              The next useful layer is the workflow pool where complexity creates willingness to outsource. IATA’s
              clearing-house figure—$63.8 billion settled across 581 airlines and associated companies in 2024—shows
              that payments and reconciliation alone are large and specialized. NDC and ONE Order documentation show why
              this matters: airlines and sellers are trying to unlock richer content and cleaner order management
              without rebuilding every connection from scratch. That is the layer where TripStack’s 30-billion-plus
              price points, Frontier’s NDC launch, Amadeus’s reseller initiative, and Precision’s fraud tooling become
              economically meaningful. They do not prove a fully isolated SAM, but they do prove that the market wedge
              is the subset of flight revenue and traveler volume that depends on outsourced connectivity, fulfilment,
              settlement, and servicing.


              Inside that wedge, Etraveli’s own throughput is already meaningful. The company disclosed about €14
              billion of 2024 gross sales and 25 million orders, then separately described €16 billion of TTV and 48
              million travelers. Yet even that latest scale is still below 1% of IATA’s 5.2 billion passenger outlook.
              That is exactly why the sizing case should remain bounded. Etraveli is large enough to matter, but the
              public evidence does not justify claiming it addresses all of airline revenue or all OTA spend. The
              strongest evidence supports a narrower interpretation: Etraveli is competing for the complex, outsourced
              flight-commerce layer where content breadth, partner distribution, settlement, fraud, and post-booking
              servicing create real switching costs.
