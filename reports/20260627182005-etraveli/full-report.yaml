      - number: '4.3'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Publicly, Etraveli does not read like an immediately distressed company. It reported positive 2024 EBITDA,
              won a significant minority investment from KKR in 2025, and continued deploying capital into the Wenrix
              acquisition in January 2026. Those are constructive signals because they show sponsor access, acquisition
              capacity, and at least one disclosed profitability datapoint. They are not, however, a substitute for
              balance-sheet disclosure. The retained sources do not reveal cash on hand, revolver availability, debt
              maturities, covenant headroom, refund liabilities, working-capital seasonality, or monthly burn. That
              means the chapter can observe financing support and strategic investment appetite, but cannot responsibly
              convert those signals into a runway estimate.


              The historical transaction trail is still useful. CVC paid €508 million in 2017, Booking agreed to pay
              about €1.63 billion in 2021 before the deal was blocked, and KKR later bought an undisclosed minority
              stake while CVC remained majority owner. Together those events show that outside capital has repeatedly
              valued Etraveli’s position in flight distribution, but none of them reveal today’s liquidity cushion or
              leverage. Underwriting capital adequacy therefore still depends on management disclosures rather than
              public inference.
