  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              Etraveli’s public record supports a multi-stream flight-commerce model rather than a simple retail-OTA
              commission thesis. The consumer layer still matters: MyTrip, Gotogate, and Flightnetwork sell airfare and
              related services in more than 75 markets. But the stronger financial signal is that the company now
              packages the same infrastructure outward. Booking.com’s eight-year extension shows Etraveli monetizes
              partner-powered demand, not only its own storefronts, while the company’s platform pages present
              TripStack, PRECISION, and Wenrix as modular capabilities that can be sold separately or stitched together.
              That means the logical revenue buckets are consumer booking economics, partner-powered fulfillment
              economics, payments and fraud tooling, pricing and post-booking tooling, and ancillary or support fees
              attached around the booking journey.


              The problem is not absence of scale; it is absence of realized pricing detail. None of the retained
              sources disclose take rate, realized commission, enterprise contract minimums, revenue-share splits, or
              discount ladders by channel. Public complaint evidence partially fills that gap by showing how Etraveli
              brands appear to monetize support, baggage-related options, messaging, disruption cover, and other extras
              around a low base fare, but it does not say how much of gross sales those items become. The right read is
              that Etraveli has more than one monetization lever, yet the public pack still only shows the outer shell
              of those economics.
