    - label: Medium Likelihood
      values:
      - Localized support delays
      - Role-fill slippage
      - Fraud-model governance gap
      - Partner-stack failure across Booking / Mastercard / Sabre / Wenrix
    - label: Low Likelihood
      values:
      - Small PR issue
      - Single-partner delay
      - One-module launch miss
