  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current debt, cash balance, covenant headroom, and sponsor-side leverage terms after the KKR transaction.
    whyItMatters: Without capital-structure detail, investors cannot separate healthy EBITDA from potentially tight liquidity or leverage risk.
    diligencePath: Request lender materials, debt schedule, covenant package, and monthly liquidity bridge under NDA.
    relatedQuestionRefs:
    - QR009
    - QR020
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: assurance-proof
    missingEvidence: Named public or private assurance artifacts such as SOC 2, ISO 27001, PCI scope detail, DPA templates, or model-governance audit outputs for Precision.
    whyItMatters: Etraveli now sits inside fraud and payment decision flows where assurance credibility affects merchant trust and compliance risk.
    diligencePath: Request security packet, latest audits, incident log, DPIA or model-risk documentation, and merchant-facing assurance collateral.
    relatedQuestionRefs:
    - QR016
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: Current board roster, committee structure, sponsor governance rights, and succession planning for critical functions.
    whyItMatters: Governance depth matters in a sponsor-backed, multi-module travel platform with increasing payments and AI exposure.
    diligencePath: Request board materials, committee charters, cap-table rights summary, and succession plan under NDA.
    relatedQuestionRefs:
    - QR015
  - type: missing-source
    severity: material
    topic: booking-dependency
    missingEvidence: Partner-level revenue concentration, renewal economics, and diversification trend outside Booking.
    whyItMatters: Public evidence proves importance of the Booking channel but not how concentrated gross profit or EBITDA really are.
    diligencePath: Request top-partner revenue or profit contribution, contract duration map, and non-Booking growth bridge.
    relatedQuestionRefs:
    - QR005
    - QR024
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: service-ops
    missingEvidence: Brand-level complaint denominator, refund-cycle KPI, first-contact resolution, and chargeback trend data.
    whyItMatters: Review sites show pain points, but investors need operating denominators to distinguish scalable noise from structural breakdown.
    diligencePath: Request KPI pack for support backlog, refund aging, chargebacks, and complaint closure by brand and geography.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR012
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: minor
    topic: workforce-scale
    missingEvidence: Updated split between employees and outsourced staff plus attrition and role-fill times in key fintech and support teams.
    whyItMatters: Execution risk depends on whether ETG can staff specialized product and service roles quickly enough to support growth.
    diligencePath: Request workforce dashboard covering employee versus outsourced mix, attrition, time-to-fill, and open-role aging.
