- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / antitrust residue
    - New EC or major-jurisdiction action touching Booking or distribution power
    - Any reopened structural investigation, blocked tie-up, or remedy demand linked to Etraveli
    - Escalate legal risk rating and require explicit counsel review before new capital or strategic-underwrite assumptions
  - - Refund and support quality deterioration
    - Public complaint intensity and regulator commentary across MyTrip, GoToGate, and FlightNetwork
    - Persistent surge in refund, cancellation, or hidden-fee complaints without disclosed KPI improvement
    - Discount customer-lifetime and partner-renewal assumptions; request service remediation plan
  - - Booking concentration deepens
    - New disclosure indicates higher share of B2B volume or economics tied to Booking without offsetting diversification
    - Booking remains the only visibly scaled demand partner after another 12 months
    - Treat channel concentration as thesis-limiting and haircut terminal-margin assumptions
  - - Fraud / payments governance under-proven
    - Public or diligence evidence shows weak model controls, elevated false declines, or merchant pushback
    - Material merchant loss, regulator inquiry, or inability to prove model-governance controls
    - Pause fintech-upside credit and re-underwrite Precision as a risk center rather than a moat
  - - Liquidity and leverage opacity persists
    - Next financing, refinancing, or sponsor event arrives without debt, cash, and covenant clarity
    - Still no clean leverage/runway disclosure at the next capital event
    - Assume downside financing risk, widen valuation discount, and require lender-side diligence
  - - Integration and talent execution stalls
    - Key commercial or product roles remain open or acquired modules fail to show attachment / retention progress
    - No visible Wenrix, Precision, or TripStack execution milestone progress over the next year
    - Reclassify platform-breadth story from moat-building to complexity drag
  notes: These triggers convert public uncertainty into monitorable thresholds. They are analyst-defined outside-in breakpoints, not management guidance.
