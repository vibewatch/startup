- id: pricing-distribution-and-switching-costs
  title: Pricing, distribution power, and switching costs
  body: |-
    Public pricing is one of the clearest weak spots in the evidence base. Consumer competitors do show their packaging logic in public: Kiwi highlights disruption protection and automatic check-in, while eDreams foregrounds Prime membership. By contrast, enterprise flight-tech competitors mostly market through contact forms, registration flows, partner onboarding, or capability lists rather than public list prices. That means buyers can usually infer the contract model — quote-based enterprise software, volume-linked payment services, or marketplace/revenue-share economics — but cannot directly observe realized take rates, discounts, or partner-level margin splits. The pricing table should therefore be read as a packaging comparison, not as a true apples-to-apples unit-economics sheet.

    Switching costs are real, but they do not look monopoly-grade. TripStack, Wenrix, and PRECISION suggest that Etraveli can embed itself across shopping, pricing, fraud, payments, and servicing, which creates operational friction for a partner considering migration. At the same time, IATA’s NDC standard is explicitly open to any intermediary, Google Flights distributes via free deep links, and Travelport, Sabre, Amadeus, Travelfusion, Duffel, and Hahnair all market alternative connection layers. In practice that means a partner can multi-home or rebuild, but doing so may require more vendor stitching, deeper integration work, or weaker fulfillment coverage than Etraveli currently provides.
