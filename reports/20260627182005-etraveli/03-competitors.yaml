- id: competitor-profiles-and-capabilities
  title: Competitor profiles and capability comparison
  body: |-
    The most relevant named competitors divide into two groups. The first group fights Etraveli for traveler or partner demand: Booking Holdings/Booking.com Flights, Expedia, Kiwi.com, and eDreams ODIGEO. Booking and Expedia bring enormous cross-travel distribution scale, Kiwi competes with an assurance-heavy virtual-interlining proposition, and eDreams competes with a large subscription program that reframes flight buying as membership retention. The second group fights Etraveli for infrastructure position inside travel distribution: Travelport, Sabre, Amadeus, Travelfusion, Duffel, and Hahnair. Those vendors do not all replicate the entire Etraveli stack, but each can replace important modules such as NDC access, ticketing, payment, or API-native shopping.

    Etraveli’s most credible answer is that it has assembled more than one capability layer under the same roof. TripStack gives it virtual interlining and large-scale shopping throughput. PRECISION extends the stack into fraud and payments. Wenrix expands into AI-driven pricing, flexibility, and post-booking servicing. The feature matrix is therefore less about who has the most brands and more about who can combine airline content, shopping, booking, fraud, and service logic without forcing partners to stitch together as many separate vendors. That still does not eliminate substitutes, but it does explain why Etraveli can sit in the middle of both B2C and B2B workflows.
