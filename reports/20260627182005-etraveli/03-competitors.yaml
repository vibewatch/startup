company:
  name: Etraveli Group
chapter:
  number: 3
  title: Competitors
  summary: Etraveli sits at the intersection of consumer flight selling, partner-demand distribution, and modular airline-retailing infrastructure, so its most dangerous competitors are not only OTAs but also gateways like Booking.com and Google Flights plus stack vendors such as Sabre, Travelport, Amadeus, Travelfusion, Duffel, and Hahnair. The company has a real integration moat through TripStack, PRECISION, and Wenrix, but adverse regulatory findings, open NDC standards, partner-demand dependence, and recurring consumer-service complaints show that the moat is durable-but-contestable rather than closed.
sections:
- id: competitive-landscape
  title: 'Competitive landscape: consumer sellers, demand gateways, and infrastructure substitutes'
  body: |-
    The flight-competition map around Etraveli is broader than a classic OTA peer set. At one end are consumer-facing flight sellers such as Kiwi.com and eDreams ODIGEO that compete for the same booking intent with packaging layers like guarantees or subscriptions. At the demand-gateway layer sit Google Flights and Booking.com Flights, both of which influence who owns discovery even when another company owns fulfillment. At the infrastructure layer sit Travelport, Sabre, Amadeus, Travelfusion, Duffel, and Hahnair, which each sell pieces of the search, NDC, ticketing, payment, or servicing stack that can substitute for parts of Etraveli’s platform. The cleanest way to understand Etraveli is therefore as an orchestration layer positioned between demand owners and supply infrastructure rather than as just another retail OTA.

    Etraveli’s own disclosures reinforce that interpretation. The company now says its fastest growth comes from B2B partnerships, not from owned consumer storefronts, and it names Booking.com, Google Flights, Skyscanner, and KAYAK as major partner channels. That is strategically powerful because it places Etraveli inside large demand funnels, but it also means the company does not fully own the customer-acquisition layer. The landscape table and positioning map show why that matters: the strongest threats are not only direct sellers, but also incumbent travel groups and modular distribution vendors that can help airlines, OTAs, and metasearch partners bypass a single integrated intermediary.
