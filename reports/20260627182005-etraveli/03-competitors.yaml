- id: TP006
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation or diligence ask
  rows:
  - - Partner-distribution reach
    - Partner demand is controlled by Booking, Google, and other gateways
    - High
    - Etraveli names external partners as core channels
    - Quantify partner concentration and renewal economics, especially Booking exposure
  - - Virtual interlining and fulfillment depth
    - Kiwi and modular API vendors narrow differentiation on complex flight selling
    - Medium
    - TripStack and Kiwi both emphasize itinerary-assurance logic
    - Request partner churn data and evidence of win rates against API-native rivals
  - - Fraud and payment workflow moat
    - Payments and fraud can be modularized by large ecosystem vendors
    - Medium
    - PRECISION integrates with Mastercard Gateway and Sabre Direct Pay
    - Validate attach rates, merchant retention, and standalone PRECISION adoption
  - - AI pricing / flexibility moat
    - Wenrix-style tooling can become table stakes across OTAs and TMCs
    - Medium
    - Wenrix already serves 60+ OTAs/TMCs and remains a separate brand
    - Clarify proprietary data advantage versus generic AI vendors
  - - Regulatory optionality
    - Competition authorities may limit strategic combinations or channel practices
    - High
    - EC blocked Booking/Etraveli; EU consumer authorities imposed refund commitments
    - Stress-test exit routes and regulatory perimeter for future combinations
  - - Consumer brand trust
    - Refund, support, and price-change complaints weaken conversion and brand equity
    - Medium
    - Trustpilot, SmartCustomer, and ComplaintsBoard complaints recur around the same themes
    - Ask for complaint-resolution metrics, refund SLAs, and support quality trends by brand
  notes: Risk severity reflects threat to durable advantage, not near-term probability of revenue collapse; several risks can coexist with continued growth.
