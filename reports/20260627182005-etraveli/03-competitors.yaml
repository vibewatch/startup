  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-packaging
    missingEvidence: Partner-level take rates, commission splits, and realized contract economics across Booking, metasearch, and enterprise modules.
    whyItMatters: Without realized economics, public packaging signals cannot be converted into a true relative-margin view of Etraveli versus peers.
    diligencePath: Request cohort-level revenue take rates by channel, plus representative contracts for Booking-linked, metasearch-linked, and enterprise API deals.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: Documented partner migration times, implementation costs, churn rates, and win/loss data when sellers move between Etraveli and competing stacks.
    whyItMatters: Workflow claims support moderate switching costs, but public sources do not quantify how sticky those workflows are in practice.
    diligencePath: Ask management for historical partner churn, implementation-duration distributions, and case studies of migrations to or from Etraveli.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: missing-source
    severity: material
    topic: b2b-shift
    missingEvidence: Exact current B2B-versus-B2C revenue mix, Booking concentration, and channel contribution by gross sales or EBITDA.
    whyItMatters: The chapter can prove strategic direction and scale but cannot prove how concentrated Etraveli is by partner or by revenue source.
    diligencePath: Request audited revenue mix by channel, top-partner concentration, and trend lines for B2B share of gross profit over the last three years.
    relatedQuestionRefs:
    - QP026
