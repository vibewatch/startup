  topStrengths:
    - 机票电商平台已有规模：2024 年约 25 million 笔旅行订单、近 EUR 14 billion 总销售额，披露 EBITDA 超过 EUR 163 million。
    - Booking.com 在 2025 年把合作续签 8 年，机票业务已覆盖 57 个国家，给出了很强的外部生产环境验证。
    - 产品版图已经越过 OTA 零售，借 TripStack、PRECISION、Wenrix 和更宽的机票技术栈切入面向伙伴的基础设施。
  topRisks:
    - 即便 KKR 在 2025 年完成少数股权投资，当前估值、持股比例、杠杆、契约余量和优先股堆叠仍未披露。
    - 对 Booking 的依赖叠加 2023 年 European Commission 阻止交易，给最重要商业关系留下监管尾部风险和集中度风险。
    - 客服投诉长期存在，公开页面还出现失效或需要挑战验证的入口，削弱了对运营质量和尽调完整性的信心。
  unresolvedGaps:
    - KKR 交易之后的当前私募估值、工具条款、股权结构表和优先股压力尚未公开披露。
    - 债务规模、现金余额、杠杆、契约组合和流动性是否充足，在公开来源中仍无法验证。
    - Booking.com、自有品牌和 B2B 模块之间的收入结构、抽佣率和伙伴集中度经济账仍不透明。
    - 当前员工数、董事会构成和完整创始人名单仍缺少已验证信息。
