- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Driver or risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Hotel embedding expansion
    - Radisson Flights live externally after 2024 launch
    - Shows ETG can move beyond OTA resale into package-led customer acquisition
    - Request hotel attach rate, repeat booking rate, and incremental direct-booking uplift
  - - Airline direct-content expansion
    - Ryanair, BA/Iberia, and Frontier all expanded live airline access in 2024-2025
    - Improves supply breadth and can deepen ETG’s fulfillment role
    - Request airline partner count by contract type, NDC share, and renewal schedule
  - - Metasearch and discovery breadth
    - ETG cites Google Flights and KAYAK-class surfaces as partner channels
    - Diversifies top-of-funnel demand sources
    - Request traffic and booking mix by metasearch/discovery partner
  - - Booking.com concentration risk
    - Booking.com is the clearest named scaled B2B customer in public materials
    - Could create hidden revenue concentration even if channel breadth looks strong
    - Request top-partner GMV, revenue, and margin concentration
  - - Outcome-measurement gap
    - Launches are public; conversion, repeat usage, and retention metrics are not
    - Makes customer-quality underwriting weaker than customer-breadth underwriting
    - Request customer scorecards or case-study dashboards
  - - Module cross-sell opportunity
    - Wenrix adds 60+ OTA/TMC relationships to ETG’s platform perimeter
    - Potential to expand share of wallet beyond search-and-book
    - Request customer overlap, upsell rate, and module-level retention
  notes: The table separates visible expansion vectors from economic unknowns. ETG has public breadth by customer type, but concentration by revenue remains undisclosed.
