  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Segment-level NRR, GRR, churn, renewal cohorts, and contract-length schedules for major partners and consumer brands.
    whyItMatters: Without formal retention metrics, durability must be inferred from renewals and public language rather than measured customer economics.
    diligencePath: Request partner renewal dashboards, customer cohorts, and brand-level repeat booking statistics from management.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU016
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue, GMV, and margin concentration by Booking.com, owned brands, hotels, metasearch channels, and major airlines.
    whyItMatters: Breadth of customer type does not reveal whether a single partner dominates the economics of the customer base.
    diligencePath: Request top-10 partner concentration, channel mix, and geography mix for bookings, revenue, and contribution margin.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU024
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: Measured customer outcomes such as conversion lift, ancillary attach, repeat purchase, or contract expansion for Booking.com, Radisson, and airline partners.
    whyItMatters: Named launches prove production presence, but they do not prove that ETG creates durable economic value for those customers.
    diligencePath: Request case-study dashboards or customer scorecards with before/after metrics for named partners.
    relatedQuestionRefs:
    - QU013
    - QU023
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: consumer-support-quality
    missingEvidence: Brand-level refund aging, chargeback rates, contact-center SLA, and internal CSAT/NPS across Gotogate, MyTrip, and FlightNetwork.
    whyItMatters: Public review platforms clearly surface complaints, but they cannot measure whether the underlying support operation is improving or degrading over time.
    diligencePath: Request monthly operational support KPIs, complaint-resolution data, and refund backlog metrics by brand.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
