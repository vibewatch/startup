- id: TU005
  title: Public complaint and customer-risk evidence table
  columns:
  - Brand / source
  - Signal
  - Latest public datapoint
  - Implication
  - Limitation
  rows:
  - - Gotogate / Trustpilot
    - Mixed mass-market usage with service friction
    - 3.1 / 5 from 146,089 reviews (archived 2025 snapshot)
    - Large review count implies broad adoption; recurring refund/support complaints imply meaningful servicing risk
    - Review platforms are noisy and non-random
  - - Gotogate / ComplaintsBoard
    - Adverse complaint concentration
    - 1.1 / 5 and 528 complaints
    - Strongest adverse-source signal in the retained pack
    - Complaint boards over-index for unhappy customers
  - - MyTrip / Trustpilot
    - Mixed rating at high volume
    - 3.1 / 5 from 75,427 reviews (archived 2026 snapshot)
    - Suggests heavy usage but uneven customer experience
    - No verified linkage to repeat purchase or chargeback rates
  - - MyTrip / Sitejabber
    - Fee and refund frustration
    - 3.3 stars from 3,055 reviews
    - Corroborates recurring post-booking pain points
    - Third-party AI summaries may compress nuance
  - - FlightNetwork / Sitejabber
    - Add-on and cancellation complaints
    - 3.6 stars from 4,796 reviews
    - Confirms consumer friction is not isolated to one ETG brand
    - Still not a replacement for internal CSAT or resolution data
  notes: These review and complaint surfaces are adverse by construction, so they are best read as risk signals and pattern detectors rather than clean satisfaction surveys.
  claimRefs:
