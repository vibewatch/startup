figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: ETG sits across the full flight customer journey, from partner or consumer demand capture to post-booking servicing and eventual renewal or channel expansion.
  data:
    nodes:
    - id: discover
      label: Discovery surface
      description: Traveler or partner starts on Gotogate, MyTrip, FlightNetwork, Google Flights, KAYAK, Booking.com, or a hotel-led surface like Radisson Flights.
    - id: compare
      label: Offer comparison
      description: ETG or its partner surface compares route, price, ancillary, and packaging options across airline content and partner channels.
    - id: book
      label: Book and add services
      description: Customer completes payment and may add bags, flexibility, support, or package elements; the traveler remains the payer even when the buying interface is partner-owned.
    - id: service
      label: Ticketing and servicing
      description: Changes, refunds, support, and disruption handling determine whether demand converts into durable customer trust rather than one-off transaction volume.
    - id: expand
      label: Renewal or expansion
      description: Successful execution can deepen the relationship into longer contracts, more geographies, more airline content, or additional modules such as pricing and servicing AI.
  approximationNotes: This is a workflow map, not a quantified cohort. It reflects where ETG appears in the customer journey based on public launches, partner pages, and review evidence.
