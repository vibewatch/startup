tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Owned-brand OTA travelers
    - Traveler is user and payer; ETG brand is merchant/intermediary
    - Search, book, and manage retail flight journeys
    - Gotogate, MyTrip, and FlightNetwork remain live flight-booking brands; ETG says these brands serve 75+ markets
    - Still important demand source and data surface even as B2B grows faster
    - No public repeat-purchase, CAC, or brand-level revenue disclosure
  - - Large OTA / super-app partners
    - Partner product team buys; traveler uses and pays
    - Add flights without building the full stack
    - Booking.com is live in 57 countries on ETG technology and renewed for eight more years in 2025
    - High strategic value because partner distribution is scaled and durable
    - No public partner revenue share, GMV mix, or top-partner concentration
  - - Hotel and packaging partners
    - Hotel group buys; guest uses and pays
    - Embed flights into hotel-led trip planning and packages
    - Radisson Flights launched across 13 European countries and remains live externally
    - Expansion vector into direct booking uplift and package share
    - No public conversion, attach, or incremental-direct-booking metrics
  - - Airline content partners
    - Airline commercial/distribution teams buy; traveler uses and pays
    - Distribute direct/NDC content with ancillaries and bundles
    - Ryanair, British Airways/Iberia, and Frontier integrations are publicly live
    - Improves content breadth and can deepen fulfillment role
    - No public airline-by-airline retention or economics
  - - Metasearch and discovery channels
    - Platform product teams buy; traveler uses and pays
    - Top-of-funnel search, comparison, and deep-link traffic
    - ETG names Google Flights and KAYAK-class partners; the external Google Flights and KAYAK surfaces show very large discovery channels
    - Important scale and demand-acquisition surface
    - No public disclosure of which discovery channels matter most economically
  - - Post-booking / optimization customers
    - OTA/TMC operations or product teams buy; traveler benefits indirectly
    - Pricing, flexibility, servicing, and automation via Wenrix-style modules
    - Wenrix says it serves 60+ OTAs and TMCs
    - Could improve software mix quality and cross-sell depth
    - No disclosed customer count overlap, retention, or module revenue mix
  notes: Segmentation is based on retained public evidence, so it shows channel types and named examples rather than a full disclosed revenue bridge by customer class.
