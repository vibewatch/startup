callouts:
- calloutType: strength
  title: Booking.com and Radisson turn customer proof into something better than logos
  body: Booking.com provides the strongest public production proof because the relationship is independently corroborated, country-scaled, and renewed. Radisson strengthens the pack because its external live booking page shows ETG technology operating in a customer-facing hotel workflow, not just inside company-authored PR copy.
  claimRefs:
  - CU010
  - CU011
  - CU014
  - CU015
  - CU028
- calloutType: risk
  title: Consumer complaint patterns are a real durability risk signal
  body: 'Across Gotogate, MyTrip, and FlightNetwork, the recurring review pattern is not demand failure but post-booking friction: refunds, price changes, support access, and fee complaints. In flight distribution, those issues can erode retention, increase chargebacks, and compress margins even when top-of-funnel volumes remain high.'
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
- calloutType: insight
  title: ETG has breadth of customer type, but not yet breadth of disclosed customer economics
  body: The public pack comfortably proves that ETG serves consumers, OTAs, hotels, airlines, and metasearch channels. It does not prove the economic weight of each segment, how sticky those customers are, or how much partner concentration sits behind the broad channel map.
