- id: named-proof-and-deployment-quality
  title: Named proof and deployment quality
  body: 'The best named proof is Booking.com because it is clearly live, independently corroborated, and durable. Etraveli and Booking Holdings both say the partnership began in 2019, was renewed for eight years in 2025, and currently powers Booking.com flights in 57 countries. That is much better evidence than a generic logo wall because it shows a named customer, an operating footprint, and a renewal decision. Radisson is the next-best proof point: ETG announced the launch, but the external Radisson Flights page also exists as a live customer-facing surface, complete with bundle language, flexibility options, and managed-booking features. That moves the evidence from announcement into observable production flow.


    The airline partnerships are also meaningful, but their proof quality is more mixed. Ryanair, British Airways/Iberia, and Frontier all appear live across ETG brands, and Frontier explicitly extends through Booking.com as well. Those disclosures show ETG is not only a consumer OTA operator; it is increasingly the connective layer through which airline content, ancillaries, and bundles reach both ETG-owned storefronts and partner surfaces. What is still missing is measured customer outcome disclosure. The public record says the integrations are live and expanding, but it does not say what they did to conversion, repeat purchase, ancillary take rate, or customer lifetime value.'
  claimRefs:
