- id: durability-retention-and-customer-risk
  title: Durability, retention proxies, and customer risk
  body: 'Retention is the weakest major part of Etraveli''s public customer record. There is no disclosed NRR, GRR, churn rate, renewal cohort, contract-length schedule, or customer-satisfaction dashboard for the business as a whole. The available proxies are qualitative. Booking.com''s eight-year extension is the strongest durability signal because it shows a scaled partner explicitly chose to continue the relationship. British Airways and Iberia describe progress over multiple years, and Ryanair says the relationship should continue over the coming years, but these are still relationship signals rather than quantified retention metrics.


    Consumer review evidence adds an important counterweight. Gotogate, MyTrip, and FlightNetwork all show large review counts, which implies broad usage volume, but the recurring complaint pattern is similar across brands: refund delays, price changes, fee frustration, weak support escalation, and post-booking friction. That matters because ETG operates in a thin-margin flight value chain where servicing quality can destroy unit economics as quickly as top-of-funnel demand creates them. The right interpretation is not that ETG lacks customers; it clearly has them. The concern is that the public pack proves volume and launch activity more clearly than it proves durable satisfaction and healthy long-run retention.'
