- id: milestones-scale-and-strategic-shift
  title: Milestones, strategic shift, and operating scale
  body: 'The milestone sequence shows why Etraveli is better understood as a consolidating flight platform than as a static OTA. The 2017 CVC acquisition and e-Travel combination established financial sponsorship and a broader geographic base. The 2019 TripStack and Flight Network deal added airline-integration capability and North American reach. In 2021, Booking Holdings agreed to acquire Etraveli for about €1.63 billion, but the strategic logic of “Etraveli as core flights infrastructure” survived even though the ownership transaction did not: the UK CMA cleared the deal in 2022, the European Commission blocked it in 2023, and the companies still deepened their commercial relationship afterward.


    The clearest post-blocking milestone is the 2025 eight-year Booking.com extension. Official releases from both Etraveli and Booking Holdings say the partnership began in 2019 and that Booking.com’s flights product was already live in 57 countries when the extension was announced. That matters because it turns a failed acquisition thesis into a live dependence thesis: Booking did not need to own Etraveli to keep relying on it, and Etraveli did not need to sell in order to keep scaling with Booking.


    The operating disclosures around 2024 and 2025 make the B2B shift more tangible. Anniversary materials say Etraveli handled 25 million travel orders worth nearly €14 billion in gross sales in 2024 with EBITDA above €163 million, while also highlighting more than 550 airline partnerships. At the same time, 2024 brought the launch of Precision, and 2025 brought the Wenrix acquisition plus Precision distribution partnerships with Mastercard and Sabre. The pattern is consistent: the company is trying to convert internal flight-commerce capabilities into reusable external products, not merely to sell more tickets through its own storefronts.

    '
