    severity: material
    topic: board-governance
    missingEvidence: A current board roster, independent-director list, committee structure, and reserved-matters schedule are not disclosed publicly in the retrieved pack.
    whyItMatters: Sponsor-backed private companies can look operationally strong while still having governance asymmetries that affect control, oversight, and minority protection.
    diligencePath: Request the current board list, committee charters, shareholder agreement summary, and most recent governance calendar directly from management.
