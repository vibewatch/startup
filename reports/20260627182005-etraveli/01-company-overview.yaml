    topic: founders
    missingEvidence: An authoritative founder roster for Seat24, SRG, and the current Etraveli Group entity is missing from the retrieved public source set.
    whyItMatters: Founder identity and continuing economic influence matter for assessing key-person risk, governance continuity, and management incentives.
