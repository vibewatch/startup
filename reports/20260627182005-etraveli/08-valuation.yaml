- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - Evidence
  - What would change the view
  rows:
  - - B2B pivot plus partner renewals support higher-quality revenue mix than a pure retail OTA.
    - thesis
    - Booking renewal, TripStack, Precision, and Wenrix all show infrastructure breadth.
    - Show segment revenue, gross profit, and retention proving the B2B mix is already material.
  - - Disclosed 2024 EBITDA and 2025 sponsor support show the company is not a distress asset.
    - thesis
    - ETG disclosed >€163M EBITDA and closed KKR minority capital.
    - Add debt, cash, and covenant detail so resilience is auditable instead of inferred.
  - - The 2021 strategic bid proves that strategic buyers once saw scarce value in ETG’s flight stack.
    - thesis
    - Booking agreed to pay about €1.63B before the EC block.
    - Show that current economics still justify that strategic premium without relying on the blocked route.
  - - Public disclosures still omit the current valuation, instrument terms, leverage, and preference stack.
    - anti-thesis
    - KKR terms were undisclosed and no public balance-sheet pack closes the gap.
    - Provide current cap table, financing docs, and 2026 operating plan under NDA.
  - - The blocked Booking exit means the best historical valuation datapoint is not a clean live floor.
    - anti-thesis
    - The EC prohibited the merger in 2023 for competition reasons.
    - Show alternative exit paths, diversified demand channels, and lower antitrust sensitivity.
  - - Consumer-trust friction can erode value faster in flight than headline gross sales imply.
    - anti-thesis
    - ComplaintsBoard and the 2023 refund commitments show that service quality remains a live issue.
    - Prove complaint intensity, refund cycle time, and chargeback trends are structurally improving.
  notes: Rows pair positive operating evidence with the specific disclosure or execution proof needed before a higher-confidence valuation call.
