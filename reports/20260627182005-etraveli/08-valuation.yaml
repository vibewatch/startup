- id: thesis-breaks-diligence-asks-and-final-call
  title: Thesis-Break Triggers, Diligence Asks, and Final Call
  body: 'The thesis breaks if any one of three things happens. First, if the company cannot show that Booking concentration is manageable and economically attractive, then the most visible external proof point becomes a single-point dependency rather than a moat. Second, if trust and servicing issues remain persistent at the consumer-brand layer, then thin flight economics can deteriorate faster than the B2B story can offset them. Third, if the 2025 KKR investment proves to have come in at a structure or price that leaves little room for new-money returns, then even a high-quality operating story would not rescue the entry. Those are measurable problems, not philosophical concerns.


    That is why the final call is research-more with medium confidence, high risk, and an unknown current valuation stance. Public evidence is strong enough to say Etraveli is a scaled and still-expanding hybrid flight-tech platform. It is not strong enough to say today’s undisclosed private price is attractive. A constructive investor should push for the diligence asks in the final table, compare the eventual cap-table reality against the scenario range, and only upgrade the call if missing valuation terms, leverage, and partner economics come clean. If those answers are weak, the proper reaction is not to average up on optimism but to re-rate the asset down toward the bear case.'
