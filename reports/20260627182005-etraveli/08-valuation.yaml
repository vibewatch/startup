  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure-gap
    missingEvidence: Current debt, cash, covenant, and liquidation-preference detail for the KKR/CVC capital structure.
    whyItMatters: A private entry price cannot be judged fairly without knowing whether enterprise value is burdened by leverage or preference overhang.
    diligencePath: Request the latest cap table, debt schedule, key financing documents, and board-approved 2026 budget under NDA.
    relatedQuestionRefs:
    - QV017
    - QV018
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Channel-mix disclosure showing Booking.com share of gross bookings, revenue, and EBITDA contribution.
    whyItMatters: The renewal is positive, but concentration risk cannot be priced without knowing how much of the business is economically tied to one partner.
    diligencePath: Request 2024 and 2025 channel mix by bookings, gross sales, revenue, gross profit, and EBITDA contribution.
    relatedQuestionRefs:
    - QV005
    - QV006
    relatedTableRefs:
    - TV001
    - TV003
  - type: access-blocked
    severity: material
    topic: verification-gap
    missingEvidence: Direct browser-verifiable Booking.com and Skyscanner flight funnels plus current consumer-brand legal pages.
    whyItMatters: Challenge pages and broken legal URLs reduce confidence in public channel checks and consumer-policy diligence, which should widen the evidence-quality discount.
    diligencePath: Repeat the review with a manual browser session, archive screenshots, and confirm the currently linked terms/privacy pages for each major consumer brand.
    relatedQuestionRefs:
    - QV019
    - QV020
    - QV021
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: valuation-gap
    missingEvidence: The price, instrument, and ownership terms of the 2025 KKR minority investment.
    whyItMatters: Without the actual minority-entry valuation, every current EV range remains a directional estimate rather than a supportable market mark.
    diligencePath: Request the signed transaction summary, shareholder agreement highlights, and any fairness or valuation materials prepared for the KKR transaction.
    relatedQuestionRefs:
    - QV018
    - QV025
    relatedTableRefs:
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A cleaner public set of directly comparable flight-focused private transactions with disclosed multiples.
    whyItMatters: The public comparable set mixes large OTAs, infrastructure vendors, and historical transactions, which is directionally useful but not perfectly comparable.
    diligencePath: Supplement the public pack with banker comps, board materials, or paid databases that show transaction multiples for flight-tech and OTA infrastructure assets.
    relatedQuestionRefs:
    - QV003
    - QV011
    - QV012
    relatedTableRefs:
    - TV004
