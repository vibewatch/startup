  title: "Customers"
  summary: "Peregrine serves over 400 government agencies representing 125 million citizens across North America, anchoring its enterprise footprint in municipal police departments, county sheriff offices, and major event security centers. Its core commercial moat relies on built-in auditability and NIBRS-ready data integration that overcome public records compliance barriers, though expanding beyond state and local agencies faces notable community opposition over algorithmic surveillance."
sections:
  - id: "customer-base-segmentation-and-buyer-profile"
    title: "Customer Base Segmentation and Buyer Profile"
    body: "Peregrine Technologies primarily targets public sector safety agencies, with its historical core concentrated in municipal police departments, county sheriff offices, and regional 911 emergency dispatch centers. These agencies operate in high-consequence operational environments characterized by fragmented legacy technology stacks, where arrest logs, dispatch records, sensor streams, and jail management records have historically been trapped in disconnected silos. By integrating into these core operational systems, Peregrine serves distinct buyer and user tiers: agency executive leadership (police chiefs, sheriffs, and municipal CIOs) who hold procurement and budget authority, specialized investigative teams who require rapid cross-jurisdictional correlation during active cases, and operational dispatchers coordinating real-time response. Furthermore, Peregrine's platform is designed around strict role-based access control, purpose-based query justification, and comprehensive immutable audit logging, directly addressing public records compliance laws, oversight requirements, and judicial review standards. As part of its Series D expansion funded in mid-2026, the company is actively pushing into federal civilian and defense agencies, large-scale event security management, and allied international public safety markets in Canada and the United Kingdom, broadening its buyer landscape beyond traditional local government entities."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs: []
  - id: "adoption-trajectory-and-named-deployment-outcomes"
    title: "Adoption Trajectory and Named Deployment Outcomes"
    body: "Peregrine's commercial adoption has accelerated markedly over recent funding cycles, scaling from initial law enforcement pilot engagements into an installed base exceeding 400 government agencies across North America by June 2026. The company reports that its customer footprint now touches jurisdictions representing over 125 million citizens across more than 30 U.S. states and two countries, driven by a doubling of agency customer logos over the preceding twelve months. High-profile municipal and county deployments provide tangible validation of platform utility across varying mission sets. In Orange County, California, the Sheriff's Department deployed Peregrine on AWS infrastructure to bridge over 30 siloed departmental systems and modernize data handling for FBI NIBRS compliance, replacing legacy data collation workflows that previously required up to three weeks. In Kansas City, Missouri, Peregrine supported the municipal SAVE KC focused deterrence initiative, an operational deployment credited by local officials with contributing to an 18% decline in violent crime. Operational agility is further demonstrated by investigative wins, such as Fairfax County investigators locating a child abduction suspect within 13 minutes, and emergency management workflows during hurricane relief operations in Manatee County, Florida. Critically, Peregrine has secured high-visibility security fusion center deployments for eight of the 11 North American host cities for the 2026 FIFA World Cup, establishing an operational beachhead for coordinating cross-jurisdictional public safety during major international events."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs: []
  - id: "expansion-dynamics-and-procurement-friction"
    title: "Expansion Dynamics, Retention Moats, and Procurement Resistance"
    body: "Peregrine's commercial engine relies heavily on an organic land-and-expand trajectory within and across public safety jurisdictions. Initial entry typically occurs through targeted investigative units, where software engineers embed directly with detectives to prove search and correlation capabilities against active case files. Once departmental value is established, Peregrine expands horizontally into patrol operations, crime analysis units, 911 dispatch, and emergency management, increasing license utilization and contract value. Furthermore, neighboring municipalities and regional task forces frequently join shared data federation networks to facilitate mutual aid, creating powerful regional network effects that elevate customer switching costs. However, this expansion faces substantial political and procurement headwinds. Civil liberties organizations, privacy advocates, and community activists frequently challenge municipal contract approvals during city council hearings, pointing to Peregrine's Palantir heritage and expressing broader public apprehension regarding automated surveillance and predictive policing technologies. Peregrine attempts to counter these concerns by emphasizing that it does not employ facial recognition or collect proprietary third-party surveillance data, positioning its embedded audit trails and purpose-driven access logging as accountability mechanisms rather than surveillance infrastructure. Managing these procurement controversies and navigating stringent Federal Acquisition Regulation (FAR) compliance represent pivotal operational requirements as Peregrine pursues its ambitious target of expanding to nearly 1,000 cities."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs: []
    figureRefs:
      - "FU001"
