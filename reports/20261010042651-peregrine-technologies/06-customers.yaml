callouts:
  - calloutType: "risk"
    title: "Civil Liberties Backlash and Municipal Procurement Friction"
    body: "Public apprehension regarding AI-enabled surveillance and algorithmic policing presents significant friction during municipal contract approvals. A 2026 ITIF survey indicated that 54% of Americans view AI-powered surveillance as overly dangerous, and community activists regularly mobilize at city council hearings against Peregrine contracts due to its founders' Palantir lineage. While Peregrine eschews facial recognition and builds extensive audit trails to deter misuse, political resistance remains an ongoing sales friction point that can lengthen municipal procurement cycles."
    claimRefs:
      - "CU013"
      - "CU014"
  - calloutType: "insight"
    title: "Compliance Architecture as the Core Retention Moat"
    body: "In government enterprise software, auditability and explainability are statutory legal requirements rather than discretionary feature enhancements. Because public safety decisions are subject to strict public records laws, judicial scrutiny, and chain-of-custody rules, Peregrine's permission-aware data federation architecture creates high switching barriers once embedded within an agency's operational and legal workflows."
    claimRefs:
      - "CU004"
      - "CU012"
