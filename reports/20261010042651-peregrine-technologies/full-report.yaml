        title: Scenario Analysis and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Evaluating Peregrine's forward return profile requires analyzing divergent adoption and regulatory
              scenarios across bull, base, and bear operating cases. Under the bull case, Peregrine successfully
              leverages its marquee role powering security fusion centers across 8 of 11 FIFA World Cup 2026 host cities
              into permanent multi-year enterprise contracts, driving rapid expansion into federal departments and
              international security agencies across Canada and the United Kingdom. Conversely, the bear case captures
              critical headwinds identified by adverse market analysis: public sector sales remain politically
              sensitive, surveillance-adjacent technologies face intensifying civil liberties scrutiny following Supreme
              Court limits on bulk-data warrants, and enterprise compliance requirements impose significant sales
              overhead. Furthermore, job postings confirm Peregrine is heavily investing in public sector compliance
              management, including FAR/DFARS flow-down requirements, SAM.gov maintenance, and DCSA facility security
              clearances (FCL) to unlock federal contracting. Until Peregrine provides transparent audits clarifying ARR
              growth rate, gross margin profiles, and renewal retention cohorts, prospective investors should maintain a
              'track' stance and require verifiable diligence milestones before deploying capital at current prices.
