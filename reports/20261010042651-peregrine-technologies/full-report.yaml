      - number: '8.2'
        title: Financing History and Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Peregrine's capitalization history demonstrates aggressive capital accumulation across private rounds,
              raising total cumulative funding of approximately $461M to $479M across four primary institutional stages.
              Prior to its $250M Series D, the company raised $190M in Series C financing in March 2025 at a $2.5B
              post-money valuation, $30M in Series B in May 2024, and earlier seed/undisclosed rounds. Estimated
              dilution indicates minimal equity surrender per stage, with the Series D selling approximately 3.7% to 4%
              of equity ($250M raised on a $6.5B pre-money / $6.8B post-money structure) and Series C surrendering
              roughly 7.6% ($190M on $2.5B post-money). In comparable market context, Peregrine trades at an implied
              multiple of over 160x against previously estimated historical ARR of $40.9M, representing a dramatic
              valuation premium compared to public-safety peers such as Flock Safety (last valued at $8.4B with physical
              automated license plate reader hardware integration) and legacy public safety software vendors like
              Versaterm or CAD/RMS suites. While Peregrine's software-only data indexing model avoids hardware
              maintenance liabilities and sidesteps the legal baggage of proprietary data custody, sustaining a $6.8B
              valuation requires expanding beyond core municipal police departments into federal agencies, international
              jurisdictions, and enterprise compliance markets.
            claimRefs:
