      - number: '5.2'
        title: Core Use Cases and Operational Value Creation
        blocks:
          - type: paragraph
            body: >
              The platform addresses systemic fragmentation in local government data, where critical operational records
              reside in disparate vendor silos across municipal police, fire, emergency services, and regional transit
              agencies. Across active deployments, Peregrine modernizes complex investigative and coordination
              workflows. Detectives investigating urgent criminal incidents utilize cross-jurisdictional entity
              resolution to identify suspects and vehicles across county borders in minutes rather than waiting days for
              manual record requests. In major incident management, the platform unifies emergency call volumes, traffic
              sensor alerts, and road hazard maps to coordinate disaster evacuations and perimeter security. Crucially,
              the platform powers security fusion center operations for eight of the eleven FIFA World Cup 2026 North
              American host cities, demonstrating its capacity for high-stakes multi-agency event intelligence. On edge
              devices, vision capabilities process camera frames under 85 milliseconds, blurring faces and license
              plates before transmission.
            claimRefs:
