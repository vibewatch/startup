      - number: '3.3'
        title: Pricing, Packaging, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial models in public safety software reflect significant divergence between legacy multi-year
              software licenses, custom defense task orders, and modern SaaS subscriptions. While Palantir commands
              multi-million dollar annual commitments with extensive professional service fees, Peregrine structures its
              offering as an annual software subscription with lower initial implementation expenses. However, municipal
              procurement exposes software vendors to high political visibility and city council veto risks. For
              example, the City of Durham canceled a $517,500 contract with Peregrine in February 2026 after community
              advocacy groups mobilized against police data integration. To expand beyond municipal law enforcement into
              defense and civilian markets, Peregrine requires robust federal contracting infrastructure, enforcing
              Federal Acquisition Regulation (FAR) compliance, Defense Counterintelligence and Security Agency (DCSA)
              facility clearances, and structured proposal operations.
            claimRefs:
              - CP004
              - CP008
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP011
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Regulatory Defensibility
        blocks:
          - type: paragraph
            body: >-
              Evaluating the durability of Peregrine's competitive moat requires balancing strong regulatory credentials
              against severe political vulnerabilities. Peregrine achieved FedRAMP High authorization in April 2026,
              establishing a major compliance moat that disqualifies uncertified commercial software vendors from
              high-security federal and municipal deployments. Furthermore, by serving over 400 agencies and 125 million
              citizens, Peregrine benefits from referenceability across law enforcement agencies where peer trust
              governs buying decisions. Nevertheless, displacement risks remain pronounced. Incumbent CAD and RMS
              vendors maintain powerful structural lock-in because police departments cannot easily replace their
              operational system of record. Additionally, public sensitivity regarding surveillance and the Palantir
              pedigree of Peregrine's leadership creates persistent friction during municipal renewals, meaning
              long-term defensibility depends on maintaining strict governance controls and proving non-custodial data
              integrity.
            claimRefs:
              - CP005
              - CP009
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Civil-Liberties Backlash and Procurement Veto Risk
            body: >-
              Despite differentiating its software by excluding facial recognition and maintaining granular audit
              trails, Peregrine faces severe political friction at municipal city council hearings. Local controversies
              over surveillance technology and associations with Palantir led directly to contract cancellations, such
              as the February 2026 Durham council decision, demonstrating that municipal procurement decisions can be
              abruptly derailed by public advocacy.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP013
          - type: callout
            title: Displacement Barriers in Legacy Public Safety Workflows
            body: >-
              Peregrine does not directly replace legacy Computer Aided Dispatch (CAD) or Records Management Systems
              (RMS) provided by incumbents like Versaterm and EFORCE Software. Instead, Peregrine acts as an overlay
              intelligence layer that connects to these transactional databases. This architecture sidesteps high
              switching costs and painful multi-year database migrations, allowing rapid adoption while leaving
              underlying systems of record intact.
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Sector Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies operates a public sector enterprise SaaS monetization model, monetizing primarily
              through annual recurring software subscriptions across municipal police departments, county sheriff
              offices, emergency operations centers, and major event security consortia. The platform functions as a
              unified operational data integration and search environment, ingesting legacy records management systems
              (RMS), computer-aided dispatch (CAD), and digital evidence management systems (DEMS) without assuming
              ownership of customer data. Beyond municipal public safety agencies, Peregrine has monetized large-scale
              security fusion operations for major high-profile events, including coordinating operations across eight
              of the eleven North American host cities for the 2026 FIFA World Cup. While commercial pilots in private
              enterprise verticals such as financial fraud and travel have commenced, revenue realization remains
              overwhelmingly concentrated in local government appropriations, where procurement cycles require
              multi-jurisdictional buy-in and formalized city council funding votes.
            claimRefs:
              - CI001
              - CI006
