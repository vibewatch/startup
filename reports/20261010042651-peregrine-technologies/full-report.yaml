      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Velocity Outpaces Disclosed Fundamentals
            body: >-
              Peregrine's valuation jumped from $2.5 billion in March 2025 to $6.8 billion in June 2026, marking a 2.72x
              expansion in 15 months across consecutive rounds led by Sequoia Capital and Fifth Down Capital. However,
              with the latest recorded revenue standing at $30 million as of the Series C round, the valuation multiple
              reaches 83.3x revenue, underscoring that current pricing reflects aggressive forward growth assumptions
              rather than audited near-term financial metrics.
            calloutType: insight
            claimRefs:
