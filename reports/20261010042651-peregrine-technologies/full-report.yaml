      - number: '7.2'
        title: Federal Contractor Compliance, Facility Clearances, and Operational Security Governance
        blocks:
          - type: paragraph
            body: >-
              Scaling public sector deployments across municipal, state, and federal entities introduces demanding
              operational governance requirements and strict regulatory burdens. To service defense and intelligence
              counterparties alongside municipal public safety customers, Peregrine actively maintains formal compliance
              systems spanning the Federal Acquisition Regulation (FAR), DFARS clause flow-downs, and SAM.gov active
              entity validation. The company has institutionalized dedicated operational management to oversee its
              Defense Counterintelligence and Security Agency (DCSA) Facility Security Clearance (FCL) and cleared
              personnel reinvestigation lifecycles. Maintaining these government contractor standards requires rigorous
              internal ethics hotlines, mandatory disclosure protocols, and systematic pre-award debarment screening of
              all subcontractors and third-party software vendors. Operational failure in mandatory regulatory
              disclosure, breach of clearance controls, or mishandling of criminal justice information standards
              represents an acute existential vulnerability that could trigger contract termination for cause or
              administrative debarment across interlinked government procurement schedules.
