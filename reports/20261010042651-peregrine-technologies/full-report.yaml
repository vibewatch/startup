  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Civil Liberties Scrutiny, Municipal Procurement Friction, and Regulatory Oversight
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies operates at the center of intense public discourse regarding government artificial
              intelligence adoption and mass surveillance. Independent polling by the Information Technology and
              Innovation Foundation indicated that 54% of Americans view AI-powered mass surveillance as too dangerous,
              creating acute political sensitivity around municipal contracts. Community activists and civil-liberties
              groups have mobilized at city council meetings to actively oppose contract approvals, frequently
              highlighting co-founder Nick Noone's prior leadership tenure at Palantir as a proxy for intrusive
              surveillance capabilities. In response, Peregrine maintains an architectural stance that explicitly
              rejects facial recognition, refrains from proprietary data creation, and deploys active anomaly flagging
              rather than passive logging. However, as agency deployments scale to 400+ jurisdictions across the United
              States, Canada, and the United Kingdom, independent surveillance trackers have documented escalating
              regional scrutiny of multi-agency intelligence fusion, exposing the company to procurement delays, local
              ordinance bans, and potential statutory limits on federated police record sharing.
