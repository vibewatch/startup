      - number: '5.3'
        title: Platform Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >
              Peregrine's core software architecture is designed to handle terabytes of streaming municipal data while
              maintaining real-time search responsiveness. The distributed backend is built predominantly in Python and
              Django, backed by Celery and Apache Airflow to orchestrate complex data ingestion pipelines, and Apache
              Kafka for low-latency event-driven message streaming. To handle heterogeneous queries, the data
              persistence tier combines PostgreSQL for relational entities with distributed Elasticsearch clusters for
              low-latency full-text indexing and spatial queries. The user interface leverages React, Redux, and Mapbox
              to render dense geospatial maps and operational intelligence overlays. Infrastructure is hosted on Amazon
              Web Services (AWS GovCloud) and containerized via Kubernetes, utilizing Terraform and Pulumi for
              infrastructure-as-code automation. Specialized platform engineering services written in Python and Go
              implement autoscaling and tenant isolation to provision dedicated customer regions efficiently.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
