  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profile
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies primarily targets public sector safety agencies, with its historical core
              concentrated in municipal police departments, county sheriff offices, and regional 911 emergency dispatch
              centers. These agencies operate in high-consequence operational environments characterized by fragmented
              legacy technology stacks, where arrest logs, dispatch records, sensor streams, and jail management records
              have historically been trapped in disconnected silos. By integrating into these core operational systems,
              Peregrine serves distinct buyer and user tiers: agency executive leadership (police chiefs, sheriffs, and
              municipal CIOs) who hold procurement and budget authority, specialized investigative teams who require
              rapid cross-jurisdictional correlation during active cases, and operational dispatchers coordinating
              real-time response. Furthermore, Peregrine's platform is designed around strict role-based access control,
              purpose-based query justification, and comprehensive immutable audit logging, directly addressing public
              records compliance laws, oversight requirements, and judicial review standards. As part of its Series D
              expansion funded in mid-2026, the company is actively pushing into federal civilian and defense agencies,
              large-scale event security management, and allied international public safety markets in Canada and the
              United Kingdom, broadening its buyer landscape beyond traditional local government entities.
            claimRefs:
