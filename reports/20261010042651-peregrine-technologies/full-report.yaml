      - number: '4.2'
        title: Municipal Procurement Economics and Contract Realization
        blocks:
          - type: paragraph
            body: >-
              Empirical examination of executed public procurement filings reveals distinct contract realization
              structures across agency tiers. For single municipal departments, exemplified by the City of Burnsville,
              Minnesota, Peregrine structures multi-year agreements with predictable annual subscriptions ($77,500 in
              2026) featuring built-in 3% compounding annual escalators ($79,825 in 2027 and $82,220 in 2028).
              Conversely, regional deployments leverage consortium contracting models: in San Mateo County, California,
              the Board of Supervisors approved a 40-month agreement not to exceed $3,386,218 across 18 participating
              municipal police departments and county offices. The County Executive funded the initial 18-month
              deployment via a $1,900,145 non-departmental appropriation transfer, establishing a lead-agency financing
              structure that shifts funding obligations to individual participating municipalities upon initial term
              expiration. Contractual terms bundle core data integration features while explicitly mandating that
              customers absorb third-party vendor API costs and egress fees.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Service Delivery Cost Structure and Unit Economic Blind Spots
        blocks:
          - type: paragraph
            body: >-
              The service delivery economics of Peregrine's model reflect significant integration intensity that
              separates gross revenue from true software margins. While the platform leverages cloud-hosted software
              architectures, onboarding municipal datasets requires specialized data engineering to map incompatible CAD
              schemas, proprietary RMS databases, and body-worn camera feeds. To support strict government contractor
              requirements, Peregrine maintains significant compliance and security overhead, recruiting specialized
              public sector compliance managers at base compensation up to $175,000 to administer FAR, DFARS, SAM.gov,
              and Defense Counterintelligence and Security Agency (DCSA) facility clearances. Furthermore, third-party
              pass-through fees and forward-deployed implementation teams represent hidden service drag on gross
              profitability. Because management maintains total confidentiality over GAAP gross margins, customer
              acquisition costs (CAC), and cohort payback periods, underwriters cannot verify whether platform gross
              margins reflect standard enterprise software levels (>75%) or remain compressed by professional services.
            claimRefs:
              - CI008
              - CI011
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI008
              - CI011
      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Investment Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Peregrine's capitalization was substantially bolstered in June 2026 through a $250 million Series D
              financing round co-led by Fifth Down Capital and Sequoia Capital, establishing a post-money valuation of
              $6.8 billion. This transaction represents an aggressive 2.7x valuation expansion from its $2.5 billion
              Series C valuation achieved in March 2025, elevating cumulative lifetime funding past $470 million. With
              total headcount expanding past 450 employees across five metropolitan offices in the United States,
              Canada, and the United Kingdom, operating cash burn is substantial. Although CEO Nick Noone cited doubling
              customer accounts to over 400 agencies, he explicitly declined to disclose revenue, ARR, or cash burn
              metrics. Moreover, growing community opposition to data fusion systems at municipal council hearings
              introduces procurement friction. From an underwriting perspective, the absence of audited ARR, net revenue
              retention (NRR) cohorts, and customer concentration schedules renders the $6.8 billion valuation
              ungrounded in verifiable financial fundamentals, presenting an opaque private profile.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI012
              - CI014
