        title: Integrated Risk Synthesis, Valuation Exposure, and Investment Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Following its June 2026 Series D funding round raising $250 million at a $6.8 billion post-money
              valuation, Peregrine faces significant valuation multiple compression exposure if ARR expansion or
              municipal contract velocity decelerates. The company has demonstrated top-line momentum by tripling
              revenue three consecutive years, yet private market expectations require continued rapid penetration
              across municipal agencies and commercial pilot conversions in financial services. An investment
              thesis-break would be triggered by three observable downside milestones: first, legislative enactments in
              key metropolitan markets that prohibit automated municipal data fusion or mandate statutory algorithmic
              bans; second, documented failure or compromise in purpose-based role access controls resulting in
              unauthorized civil data exposure; and third, procurement stagnation or account cancellations among Tier-1
