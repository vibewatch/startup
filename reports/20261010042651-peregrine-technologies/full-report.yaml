      - number: '5.4'
        title: Trust, Security, Governance, and Regulatory Controls
        blocks:
          - type: paragraph
            body: >
              Operating in the public safety and government sector requires stringent technical safeguards and
              regulatory compliance. Peregrine enforces strict granular role-based access controls (RBAC) and
              purpose-based permissions, requiring personnel to authenticate their legitimate operational purpose before
              accessing sensitive records. Every search, view, and analytical query is recorded in an immutable audit
              trail, enabling internal affairs and supervisory bodies to inspect query history and actively detect
              improper data access. Addressing intense civil liberties scrutiny surrounding police technologies,
              Peregrine maintains an explicit policy refusing to deploy facial recognition, avoiding the creation of
              novel surveillance feeds, and implementing active alerting mechanisms when unusual query patterns occur.
              Federal and state contracting obligations are governed by Federal Acquisition Regulation (FAR) compliance,
              SAM.gov registrations, and Defense Counterintelligence and Security Agency (DCSA) facility security
              clearances.
            claimRefs:
              - CE010
              - CE011
              - CE012
