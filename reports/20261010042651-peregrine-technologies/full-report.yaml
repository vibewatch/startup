      - number: '6.2'
        title: Adoption Trajectory and Named Deployment Outcomes
        blocks:
          - type: paragraph
            body: >-
              Peregrine's commercial adoption has accelerated markedly over recent funding cycles, scaling from initial
              law enforcement pilot engagements into an installed base exceeding 400 government agencies across North
              America by June 2026. The company reports that its customer footprint now touches jurisdictions
              representing over 125 million citizens across more than 30 U.S. states and two countries, driven by a
              doubling of agency customer logos over the preceding twelve months. High-profile municipal and county
              deployments provide tangible validation of platform utility across varying mission sets. In Orange County,
              California, the Sheriff's Department deployed Peregrine on AWS infrastructure to bridge over 30 siloed
              departmental systems and modernize data handling for FBI NIBRS compliance, replacing legacy data collation
              workflows that previously required up to three weeks. In Kansas City, Missouri, Peregrine supported the
              municipal SAVE KC focused deterrence initiative, an operational deployment credited by local officials
              with contributing to an 18% decline in violent crime. Operational agility is further demonstrated by
              investigative wins, such as Fairfax County investigators locating a child abduction suspect within 13
              minutes, and emergency management workflows during hurricane relief operations in Manatee County, Florida.
              Critically, Peregrine has secured high-visibility security fusion center deployments for eight of the 11
              North American host cities for the 2026 FIFA World Cup, establishing an operational beachhead for
              coordinating cross-jurisdictional public safety during major international events.
