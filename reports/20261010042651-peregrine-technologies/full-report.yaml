              - CO007
              - CO008
              - CO015
          - type: callout
            title: Palantir Lineage and Public Scrutiny Threaten Procurement Velocity
            body: >-
              As Peregrine expands into major metropolitan police departments, it faces increasing resistance from
              community advocates and civil liberties organizations wary of mass surveillance and automated data fusion.
              With 54% of Americans viewing AI-powered surveillance as dangerous and municipal procurement hearings
              frequently citing the founders' Palantir backgrounds, political friction represents a material barrier to
              maintaining past customer acquisition velocity.
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Functional Scope, and Structural Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for public safety software has historically been fragmented across siloed records
              management systems (RMS), computer-aided dispatch (CAD) databases, automated license plate readers (ALPR),
              and regional sensor networks. Peregrine's operational boundary is defined specifically as an AI-enabled
              data integration and semantic search layer, rather than a replacement for underlying transactional
              repositories. By connecting disparate data sources—such as municipal police logs, jail booking records,
              emergency 911 calls, and traffic management feeds—into a unified intelligence workspace without demanding
              permanent data custody, Peregrine overcomes high institutional switching costs that entrench legacy public
              safety vendors. The primary alternatives confronting public safety buyers remain the status quo of manual
              cross-database querying, specialized point analytics tools, or bespoke consulting integrations. In
              contrast to broader enterprise search engines or general-purpose data warehouses, municipal public safety
              requires fine-grained role-based access control, purpose-based query auditing, and strict compliance with
              criminal justice information systems standards.
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Market Sizing
        blocks:
          - type: paragraph
            body: >-
              Sizing Peregrine's market opportunity requires decomposing aggregate GovTech expenditures into specialized
              operational software budgets. While total global GovTech software spending approaches $30 billion, the
              serviceable North American public safety IT and analytics market represents approximately $12.5 billion
              across federal, state, and local agencies. Within this aggregate envelope, state and local law enforcement
              operational software accounts for roughly $6.2 billion, with core data integration, multi-source fusion,
              and investigative analytics representing an addressable market of $3.8 billion. Peregrine's serviceable
              available market is concentrated across high-density metropolitan police departments, county sheriffs, and
              state fusion centers, representing a $1.4 billion segment. The company's immediate serviceable obtainable
              market of $350 million is validated by its expanding footprint of over 400 customer agencies covering 125
              million citizens, alongside prominent deployments such as security operations across 8 of 11 U.S. host
              cities for the 2026 FIFA World Cup. At an estimated ARR of $40.9 million and a June 2026 valuation of $6.8
              billion, market sizing indicates significant headroom for account expansion and cross-departmental
              penetration.
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
