  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Operational Workflow
        blocks:
          - type: paragraph
            body: >
              Peregrine provides a cloud-native data integration and operational intelligence platform specifically
              engineered for government, municipal public safety, and critical infrastructure operators. Rather than
              acting as a centralized data repository or proprietary data collector, the platform functions as an
              institutional search engine that connects natively into existing records systems—including Computer-Aided
              Dispatch (CAD), Records Management Systems (RMS), 911 call logs, city permit databases, and field sensor
              feeds—without claiming ownership or creating redundant data copies. By operating as a federated query and
              entity resolution fabric, Peregrine enables detectives, dispatchers, emergency managers, and agency
              leadership to query disparate municipal databases through a unified interface. As of 2026, the software
              serves over 400 government agencies representing more than 125 million residents across North America,
              supporting everyday public safety workflows as well as multi-agency coordination centers.
            claimRefs:
