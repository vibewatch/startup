  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Overview
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies presents an extraordinary commercial profile, scaling rapidly across government
              agencies by delivering a cloud-native intelligence platform that connects siloed municipal, state, and
              emergency databases without collecting or owning the underlying source data. In June 2026, the company
              raised a $250 million Series D financing led by Sequoia Capital and Fifth Down Capital alongside OG
              Venture Partners, Goldcrest Capital, XYZ Ventures, and Godfrey Capital, establishing a post-money
              valuation of $6.8 billion. This mark represents a sharp 2.7x valuation step-up from its $2.5 billion
              Series C valuation established in March 2025. While public-sector traction has doubled over the past year
              to more than 400 customer agencies serving roughly 125 million citizens across North America, the
              valuation prices in flawless hypergrowth execution against opaque underlying fundamentals. Independent
              commentary highlights that govtech and public-safety AI are currently commanding aggressive multiples akin
              to frontier research labs, yet public-sector procurement cycles remain protracted and vulnerable to budget
              reallocations. Without audited revenue figures or verified net revenue retention metrics, institutional
              capital must approach the current pricing tier with rigorous valuation discipline.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
