    title: Product architecture map
    type: stack
    summary: Multi-tier platform architecture of Peregrine's data unification and operational intelligence platform.
    data:
      layers:
        - label: Presentation & Geospatial Intelligence Layer
          detail: >-
            React and Redux web client featuring Mapbox tactical GIS mapping, live operational dashboards, and natural
            language query interfaces.
        - label: Operational AI & Reasoning Layer
          detail: >-
            AWS Bedrock and SageMaker pipelines running retrieval-augmented generation (RAG), entity resolution models,
            and hallucination guardrails.
        - label: Application Services & API Gateway Layer
          detail: >-
            Python and Django backend services with Go microservices handling authentication, federated query dispatch,
            and multi-tenant isolation.
        - label: Event Streaming & Pipeline Orchestration Layer
          detail: >-
            Apache Kafka message broker and Apache Airflow with Celery task queues processing streaming sensor feeds and
            scheduled database syncs.
        - label: Data Persistence & Geospatial Indexing Layer
          detail: >-
            PostgreSQL relational database for operational entities paired with distributed Elasticsearch clusters for
            low-latency full-text and spatial queries.
        - label: Cloud Infrastructure & Compliance Foundation
          detail: >-
            AWS GovCloud containerized on Kubernetes with Terraform and Pulumi infrastructure-as-code, meeting FAR and
            DCSA facility clearance standards.
