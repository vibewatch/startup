        title: Exhibits
        blocks:
          - type: callout
            title: Civil Liberties Resistance as a Procurement Friction Driver
            body: >-
              Public opposition stemming from privacy and surveillance concerns poses a tangible headwind to sales
              efficiency. Community mobilizations at city council hearings risk lengthening procurement cycles or
              derailing approvals, directly inflating customer acquisition costs.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
          - type: callout
            title: Bifurcated Contract Economics Across Agency Tiers
            body: >-
              Empirical procurement filings reveal a bifurcated customer base: small municipalities enter at modest
              five-figure subscription levels (~$78k/year) with built-in 3% escalators, while regional county consortia
              generate multi-million-dollar commitments ($3.4M over 40 months) requiring inter-agency cost-sharing.
