        blocks:
          - type: paragraph
            body: >
              Peregrine
              为政府、市政公共安全机构和关键基础设施运营商提供云原生数据集成与运营情报平台。平台不充当集中式数据存储库，也不收集专有数据，而是作为机构搜索引擎原生连接现有记录系统，包括计算机辅助调度（CAD）、记录管理系统（RMS）、911
              呼叫日志、市政许可数据库和现场传感器数据，不主张所有权，也不创建重复数据副本。Peregrine 作为联邦查询与实体解析织物运行，让侦探、调度员、应急管理人员和机构领导层通过统一界面查询分散的市政数据库。截至
              2026 年，软件服务超过 400 家政府机构，覆盖北美 1.25 亿以上居民，既支持日常公共安全工作流，也支持多机构协调中心。
