            body: >
              在公共安全和政府领域运营，需要严格的技术防护与监管合规。Peregrine
              强制执行细粒度基于角色的访问控制（RBAC）和基于目的的权限，要求人员在访问敏感记录前验证其合法运营目的。每次搜索、查看和分析查询都会记录在不可篡改的审计轨迹中，让内部事务部门和监督机构能够检查查询历史，主动发现不当数据访问。面对围绕警务技术的强烈公民自由审视，Peregrine
