      - number: '5.3'
        title: 平台架构与技术栈
        blocks:
          - type: paragraph
            body: >
              Peregrine 核心软件架构面向 TB 级市政流数据设计，同时保持实时搜索响应。分布式后端主要使用 Python 和 Django，并由 Celery、Apache Airflow
              编排复杂数据摄入管道，Apache Kafka 负责低延迟事件驱动消息流。为处理异构查询，数据持久化层将 PostgreSQL 的关系实体与分布式 Elasticsearch
              集群结合，用于低延迟全文索引和空间查询。用户界面使用 React、Redux 和 Mapbox，渲染密集的地理空间地图与运营情报叠加层。基础设施托管于 Amazon Web Services（AWS
              GovCloud），通过 Kubernetes 容器化，并使用 Terraform 和 Pulumi 自动化基础设施即代码。用 Python 和 Go
              编写的专用平台工程服务实现自动扩缩容和租户隔离，高效配置专属客户区域。
            claimRefs:
