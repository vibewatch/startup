      - number: '3.3'
        title: 定价、产品打包与采购动态
        blocks:
          - type: paragraph
            body: >-
              公共安全软件的商业模式在传统多年期软件许可、定制国防任务订单和现代 SaaS 订阅之间差异显著。Palantir 收取数百万美元的年度承诺并叠加大量专业服务费；Peregrine
              则采用年度软件订阅，初始实施费用更低。然而，市政采购让软件供应商暴露在高政治能见度和市议会否决风险下。例如，2026 年 2 月，社区倡导团体反对警务数据集成后，Durham 市取消了与 Peregrine
              签订的 $517,500 合同。若要从市政执法扩展到国防和民用市场，Peregrine 需要健全的联邦合同基础设施，落实《联邦采购条例》（FAR）合规、国防反情报与安全局（DCSA）设施许可和规范化提案运营。
            claimRefs:
              - CP004
              - CP008
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP011
      - number: '3.4'
        title: 护城河持久性、切换成本与监管防御力
        blocks:
          - type: paragraph
            body: >-
              评估 Peregrine 竞争护城河的持久性，需要在其强监管资质与严重政治脆弱性之间权衡。Peregrine 于 2026 年 4 月取得 FedRAMP High
              授权，形成重要合规护城河，使未认证商业软件供应商无法参与高安全等级的联邦和市政部署。此外，公司服务超过 400 家机构、覆盖 1.25
              亿居民，在同行信任决定采购的执法机构中具备标杆效应。不过，替代风险仍然突出。传统 CAD 和 RMS 厂商保持强大的结构性锁定，因为警察部门难以轻易替换运营记录系统。与此同时，公众对监控的敏感度以及
              Peregrine 管理层的 Palantir 渊源，在市政续约时持续制造摩擦，长期防御力取决于维持严格的完整性。
            claimRefs:
              - CP005
              - CP009
              - CP012
              - CP013
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 公民自由反弹与采购否决风险
            body: >-
              Peregrine 不采用面部识别，并维持细粒度审计轨迹，以此形成软件差异化；但公司仍在市议会听证会上面临严重政治摩擦。围绕监控技术的地方争议及其与 Palantir 的关联直接导致合同取消，例如 2026 年
              2 月 Durham 市议会的决定，说明公共倡议可能突然打乱市政采购。
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP013
          - type: callout
            title: 传统公共安全工作流中的替代壁垒
            body: >-
              Peregrine 不直接替代 Versaterm、EFORCE Software
              等传统厂商提供的计算机辅助调度（CAD）或记录管理系统（RMS），而是充当连接这些交易数据库的上层情报层。这种架构绕开了高昂切换成本和痛苦的多年数据库迁移，使采用速度更快，同时保留底层记录系统。
            calloutType: insight
            claimRefs:
