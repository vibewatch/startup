      - number: '8.3'
        title: 情景分析与尽调路径
        blocks:
          - type: paragraph
            body: >-
              要评估 Peregrine 的远期回报，必须分别审视乐观、基准和悲观经营情景下的采用速度与监管走向。乐观情景中，Peregrine 将其为 2026 年 FIFA 世界杯 11 座主办城市中的 8
              座提供安全融合中心能力这一标志性角色，转化为多年期固定企业合同，并快速拓展至联邦部门以及加拿大、英国的国际安全机构。反之，悲观情景纳入了反向市场分析指出的关键阻力：公共部门销售在政治上仍然敏感；最高法院限制批量数据令状后，监控相关技术面临更强的公民自由审查；企业合规要求也会显著抬高销售开销。此外，招聘信息证实
              Peregrine 正大举投入公共部门合规管理，包括 FAR/DFARS 流转要求、SAM.gov 维护和 DCSA 设施安全许可（FCL），以打开联邦合同市场。在 Peregrine 通过透明审计说明 ARR
              增长率、毛利率结构和续约留存队列之前，潜在投资者应维持“观察”立场，要求可验证的尽调里程碑，再按当前价格投入资本。
