  - id: FE001
    title: 产品架构图
    type: stack
    summary: Peregrine 数据统一与运营情报平台的多层架构。
    data:
      layers:
        - label: 展示与地理空间情报层
          detail: 基于 React 和 Redux 的 Web 客户端，提供 Mapbox 战术 GIS 制图、实时运营仪表盘和自然语言查询界面。
        - label: 运营 AI 与推理层
          detail: AWS Bedrock 和 SageMaker 管线运行检索增强生成（RAG）、实体解析模型和幻觉防护机制。
        - label: 应用服务与 API 网关层
          detail: Python 和 Django 后端服务搭配 Go 微服务，处理身份验证、联邦查询分发和多租户隔离。
        - label: 事件流与管线编排层
          detail: Apache Kafka 消息代理及搭配 Celery 任务队列的 Apache Airflow，处理传感器流数据和定时数据库同步。
        - label: 数据持久化与地理空间索引层
          detail: PostgreSQL 关系数据库存储运营实体，搭配分布式 Elasticsearch 集群，支持低延迟全文和空间查询。
        - label: 云基础设施与合规底座
          detail: AWS GovCloud 在 Kubernetes 上容器化，使用 Terraform 和 Pulumi 基础设施即代码，符合 FAR 和 DCSA 设施许可标准。
    approximationNotes: 架构组件综合自工程招聘技术要求、平台职位描述和合规记录；内部网络拓扑属于专有信息。
