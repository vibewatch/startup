      - number: '6.4'
        title: 展示
        blocks:
          - type: callout
            title: 公民自由反弹与市政采购摩擦
            body: >-
              公众对 AI 监控和算法警务的担忧，在市政合同审批中造成显著摩擦。2026 年 ITIF 调查显示，54% 的美国人认为 AI 驱动的监控过于危险；由于创始人与 Palantir
              的渊源，社区活动人士经常在市议会听证会上动员反对 Peregrine 合同。Peregrine 虽避开面部识别并建立广泛审计轨迹以遏制滥用，政治阻力仍是持续的销售摩擦点，可能拉长市政采购周期。
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
          - type: callout
            title: 合规架构成为核心留存护城河
            body: >-
              在政府企业软件中，可审计性和可解释性是法定要求，不是可选的功能增强。公共安全决策受严格公共记录法、司法审查和证据保管链规则约束，因此 Peregrine
              的权限感知数据联邦架构一旦嵌入机构的运营和法律工作流，就会形成高切换壁垒。
            calloutType: insight
            claimRefs:
              - CU004
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 公民自由审视、市政采购摩擦与监管监督
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies 处于政府采用人工智能和大规模监控的激烈公共讨论中心。Information Technology and Innovation Foundation
              的独立民调显示，54% 的美国人认为 AI 驱动的大规模监控过于危险，令市政合同高度政治敏感。社区活动人士和公民自由团体已在市议会会议上动员反对合同审批，并经常把联合创始人 Nick Noone 曾在
              Palantir 任职的经历作为侵入式监控能力的替代指标。Peregrine 因此明确拒绝面部识别，不创建专有数据，并采用主动异常标记而非被动日志记录。然而，随着机构部署扩展到美国、加拿大和英国的 400
              多个辖区，独立监控追踪机构已记录多机构情报融合引发的区域审视加剧，使公司面临采购延迟、地方条例禁令，以及对联邦警务记录共享的潜在法定限制。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
