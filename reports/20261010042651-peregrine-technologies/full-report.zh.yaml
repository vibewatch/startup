      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 估值增速超过已披露基本面
            body: >-
              Peregrine 估值从 2025 年 3 月的 $2.5B 跳升至 2026 年 6 月的 $6.8B，连续融资轮由 Sequoia Capital 和 Fifth Down Capital 领投，15
              个月内扩张 2.72 倍。然而，最新记录显示 C 轮时收入为 $30M，估值收入倍数达到 83.3 倍，说明当前定价反映的是激进的未来增长假设，而非经审计的近期财务指标。
            calloutType: insight
            claimRefs:
              - CO001
