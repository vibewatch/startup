              - CO008
              - CO015
          - type: callout
            title: Palantir 渊源与公共审视威胁采购速度
            body: >-
              Peregrine 向大都市警察部门扩张时，面临社区倡导者和公民自由组织越来越强的抵制，他们担心大规模监控和自动化数据融合。54% 的美国人认为 AI 驱动的监控具有危险性，市政采购听证会又经常提及创始人的
              Palantir 背景，政治摩擦因此成为维持过去获客速度的实质障碍。
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、功能范围与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              公共安全软件的可服务市场长期分散在孤立的记录管理系统（RMS）、计算机辅助调度（CAD）、自动车牌识别系统（ALPR）和区域传感器网络之间。Peregrine 的运营边界明确是 AI
              驱动的数据集成与语义搜索层，而不是底层交易型存储库的替代品。它将市政警察日志、监狱收押记录、紧急 911
              呼叫和交通管理数据等不同来源连接到统一情报工作区，同时不要求永久接管数据，从而缓解了巩固传统公共安全供应商地位的高机构切换成本。公共安全买方面临的主要替代方案仍包括手工跨数据库查询、专用点分析工具或定制咨询集成。相较于更广泛的企业搜索引擎或通用数据仓库，市政公共安全需要细粒度的基于角色访问控制、基于目的的查询审计，以及严格遵守刑事司法信息系统标准。
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
      - number: '2.2'
        title: TAM、SAM 与受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              测算 Peregrine 的市场机会，需要把 GovTech 总支出拆解为专业运营软件预算。全球 GovTech 软件支出接近 $30B；其中，北美公共安全 IT 与分析市场约为
              $12.5B，覆盖联邦、州和地方机构。在这一总盘子中，州和地方执法运营软件约占 $6.2B，核心数据集成、多源融合和调查分析对应的可寻址市场为 $3.8B。Peregrine
              的可服务市场集中在高密度大都市警察部门、县治安官办公室和州级融合中心，对应 $1.4B 细分市场。公司眼下可获取的服务市场为 $350M，其扩张中的客户覆盖已超过 400 家机构和 1.25 亿居民，并有
              2026 年 FIFA 世界杯 11 个美国主办城市中的 8 个城市开展安全运营等知名部署作为验证。按估计 ARR $40.9M 和 2026 年 6 月 $6.8B
              估值计算，市场规模显示账户扩张和跨部门渗透仍有较大空间。
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM007
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
