            body: >
              平台解决地方政府数据长期碎片化问题：关键运营记录分散在市政警察、消防、应急服务和区域交通机构的不同供应商孤岛中。在现有部署中，Peregrine
              改造复杂调查与协调工作流。侦探调查紧急刑事事件时，可用跨辖区实体解析在几分钟内跨县识别嫌疑人和车辆，而不必等待数日的人工调档。在重大事件管理中，平台统一应急呼叫量、交通传感器警报和道路危险地图，用于协调灾害疏散与外围安保。更重要的是，平台为
              2026 年 FIFA 世界杯 11 个北美主办城市中的 8 个城市提供安全融合中心运营，证明其处理高风险多机构活动情报的能力。在边缘设备上，视觉能力在 85 毫秒内处理摄像机画面，并在传输前模糊人脸和车牌。
