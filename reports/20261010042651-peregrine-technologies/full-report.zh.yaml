      - number: '7.3'
        title: 生态系统交易对手依赖、系统集成与账户集中度
        blocks:
          - type: paragraph
            body: >-
              Peregrine
              的核心产品主张依赖非侵入式数据融合：连接不同机构数据库、计算机辅助调度日志和市政传感器数据，而不取得底层数据资产的永久所有权。这种架构对第三方记录管理软件供应商、专有市政数据库模式和商业云托管平台形成结构性依赖。虽然平台覆盖超过
              400 家机构和 125M+ 居民，但收入在知名市政融合中心、Ohio 分析合作等州级项目，以及包括 2026 年 FIFA 世界杯 11 个主办城市中的 8
              个城市在内的复杂高曝光安保协调部署中存在明显集中。传统 CAD 和 RMS 供应商上游修改
              API、未公告弃用模式，或调度领域既有厂商单方面收紧许可，都可能削弱数据摄入管道，并推高异构客户环境中的持续集成工程成本。
