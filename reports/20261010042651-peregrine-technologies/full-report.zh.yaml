      - number: '8.2'
        title: 融资历程与可比基准
        blocks:
          - type: paragraph
            body: >-
              Peregrine 的资本化历程显示，公司在多轮私募融资中积极积累资本，四个主要机构融资阶段的累计融资约为 $461M 至 $479M。在 $250M 的 Series D 之前，公司于 2025 年 3 月以
              $2.5B 投后估值完成 $190M 的 Series C 融资，并于 2024 年 5 月完成 $30M 的 Series B
              融资，此外还有更早的种子轮及未披露轮次。按估算的稀释幅度看，各阶段让渡的股权比例并不高：Series D 约出售 3.7% 至 4% 的股权（以 $6.5B 投前 / $6.8B 投后结构融资
              $250M），Series C 约让渡 7.6%（以 $2.5B 投后估值融资 $190M）。在可比市场环境下，按此前估计的 $40.9M 历史 ARR 计算，Peregrine 的隐含倍数超过
              160x，估值溢价远高于 Flock Safety 等公共安全同行（最近估值 $8.4B，并整合实体自动车牌识别硬件）以及 Versaterm、CAD/RMS 套件等传统公共安全软件供应商。Peregrine
              只做软件数据索引，既避开硬件维护负担，也绕开持有专有数据带来的法律包袱；但要撑住 $6.8B 估值，公司必须从核心市政警察部门扩展到联邦机构、国际辖区和企业合规市场。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
