              - CM006
              - CM011
              - CM015
      - number: '2.3'
        title: 买方画像、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              公共安全采购在不同辖区层级呈现出不同的买方、使用者和付款方画像。在市政警察部门，主要买方通常是警察局长或副局长；侦探、巡逻主管和民用犯罪分析师则承担主要分析工作。但采购批准和预算拨款掌握在市议会、市长及市政 IT
              主管手中，资金来自市政一般税收。到了区域和县一级，县治安官和区域融合中心主任是关键支持者，部署资金往往来自联邦国土安全拨款计划或州拨公共安全信托基金。对于超级碗或 FIFA
              世界杯主办委员会等高曝光全国性活动，采购由联邦、州和地方资源组成的跨机构联合行动组协调。合同扩张通常遵循落地再扩张路径：机构在重大犯罪激增、复杂跨辖区调查或人员短缺后开始采用，随后把软件许可扩展到相邻市政部门。
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: 增长驱动、监管标准与采用约束
        blocks:
          - type: paragraph
            body: >-
              结构性顺风正在加快市场采用，尤其是北美城市严重的警力短缺，迫使部门用自动化情报综合取代手工调查劳动。此外，从实时随身摄像视频到私人安防摄像头和无人机遥测数据，数字传感器输入不断增加，催生了对集中式态势感知平台的迫切需求。另一方面，监管和政治因素带来了显著采用摩擦。公司若要从地方市政合同扩展到联邦采购，必须严格遵守《联邦采购条例》（FAR）条款、维护
              SAM.gov
              信息并取得国防反情报与安全局管理的设施安全许可（FCL）。更关键的是，公民自由组织和市政监督委员会持续审视数据融合技术，担心预测性警务和大规模监控。平台必须保留透明审计轨迹和基于目的的访问控制，以避免法律挑战或合同撤销。
            claimRefs:
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 数据集成架构成为采购切入口
            body: Peregrine 不试图替代底层记录数据库，而是充当权限感知的语义搜索层，因此区别于传统 CAD/RMS 龙头，并降低了机构 IT 领导层的切换障碍。
            calloutType: insight
            claimRefs:
              - CM001
              - CM011
          - type: callout
            title: 监控监督与公民自由摩擦
            body: 公共安全数据融合平台在自动化情报能力上面临更强的社区阻力和立法约束，因此必须建立严格的合规框架和透明审计日志，避免市政合同被取消。
            calloutType: risk
            claimRefs:
              - CM010
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              公共部门数据集成的竞争格局涵盖多个不同供应商类别，从大型国防情报平台到根深蒂固的市政记录系统。独立软件评测将 Palantir Foundry、Palantir Gotham 和 SAS Data
              Management 列为与 Peregrine 比较时评估的主要企业级替代方案。同时，专业 GovTech 市场数据还指出，ForceMetrics
              等公共安全细分同业为一线急救人员提供实时搜索工具；Versaterm 和 EFORCE Software 等传统计算机辅助调度（CAD）与记录管理系统（RMS）厂商也在竞争。Flock Safety
              等相邻传感器网络通过部署固定式自动车牌识别系统，形成另一条竞争轴线，其私募估值为 $8.4B。自动化市场分类有时会把 Peregrine 与 Universe、Evite
              等消费级活动平台混为一谈，但真正的竞争场域由市政公共安全预算、数据融合速度和运营信任定义。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
      - number: '3.2'
        title: 架构差异化与部署速度
        blocks:
          - type: paragraph
            body: >-
              Peregrine 依靠部署速度和架构边界，区别于重型企业平台。同行比较显示，Palantir Gotham 和 Foundry 为大规模联邦与国防运营提供广泛的定制数据建模，而 Peregrine
              以快速实施和面向资源有限地方机构的易用分析能力见长。Peregrine 目标是在约 12 周内完成生产部署，接入孤立的 911
              日志、事件文件和传感器数据，同时不取得市政数据的专有所有权。不同于把客户数据锁在僵化关系模式中的传统 CAD 和 RMS 架构，Peregrine 充当上层搜索与融合引擎。更重要的是，Peregrine
              按用途细分权限，并保留完整审计日志；同时明确不采用面部识别技术，直接解决企业级国防平台常让用户体验和合规变得复杂的问题。
            claimRefs:
