              对已执行公共采购文件的实证分析显示，不同机构层级的合同兑现结构各异。以明尼苏达州 Burnsville 市为例，单个市政部门签订多年协议，年度订阅费可预测，2026 年为 $77,500，并内置 3%
              的年度复合递增条款（2027 年 $79,825，2028 年 $82,220）。相比之下，区域部署采用联盟合同模式：加利福尼亚州 San Mateo County 监督委员会批准了一份 40 个月协议，18
