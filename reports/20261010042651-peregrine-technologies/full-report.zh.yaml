chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与公共安全使命
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies, Inc. 是一家成立于 2018 年、总部位于加利福尼亚州旧金山 71 Stevenson Street
              的风险投资支持型企业软件与运营情报公司。公司专门为市政公共安全部门、执法机构和应急管理组织设计并运营云原生数据集成与态势感知平台。不同于制造专有硬件或汇总外部消费者数据的传统监控供应商，Peregrine
              将其软件定位为具备权限感知能力的机构记忆层：它把计算机辅助调度日志、随身摄像机记录、911 呼叫记录和市政事件数据等分散数据集摄入、建模并连接到统一的可搜索界面。平台采用经常性 B2G
              软件订阅模式，让地方政府机构能快速查询不同数据孤岛，同时执行严格的刑事司法信息服务合规和基于角色的审计。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO015
      - number: '1.2'
        title: 创始人、领导架构与合规治理
        blocks:
          - type: paragraph
            body: >-
              Peregrine 由首席执行官 Nick Noone 和首席技术官 Ben Rudolph 共同创立。两人曾是斯坦福大学体操队队友，并通过在 San Pablo
              警察局侦探部门驻场两年的设计实践，确立了公司的运营理念。Noone 曾负责 Palantir Technologies 的美国特种行动业务，领导反叛乱情报软件在高风险行动场景中的部署；Rudolph
              则为联合国难民署和 Dimagi 设计基础医疗与难民数据系统。这种互补背景把 Palantir 式数据融合架构与专业人道主义数据治理结合起来。为应对市政和联邦合同的严格监管要求，Peregrine
              维持活跃的合规体系，覆盖《联邦采购条例》要求、国防反情报与安全局设施许可和自动化访问日志；但完整董事会构成与独立治理监督仍属内部信息。
            claimRefs:
              - CO002
              - CO003
              - CO009
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO014
      - number: '1.3'
        title: 资本化历史、估值扩张与投资者支持
        blocks:
          - type: paragraph
            body: >-
              自 2018 年 6 月最初 $1M 种子轮以来，Peregrine 已在七轮融资中筹集约 $500M 股权融资。2025 年 3 月，Sequoia Capital 领投 $190M C 轮，投后估值
              $2.5B，公司由此达到独角兽地位。仅 15 个月后，即 2026 年 6 月，Peregrine 完成 $250M D 轮融资，估值升至 $6.8B，单个融资周期内上涨 2.72 倍。该轮由 Sequoia
              Capital 与 Fifth Down Capital、Goldcrest Capital、Godfrey Capital、OG Venture Partners 和 XYZ Venture Capital
              联合领投。虽然风险投资市场数据库在 C 轮时记录的历史年化收入为 $30M，隐含收入倍数高达 83.3 倍，但员工流动性安排、清算优先权悬垂和按比例投票权等详细资本结构信息，除主要投资者联合体外仍未披露。
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO008
              - CO010
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO004
              - CO010
      - number: '1.4'
        title: 运营规模、知名部署与社会阻力
        blocks:
          - type: paragraph
            body: >-
              2024 至 2026 年间，Peregrine 商业规模显著扩大，客户基础翻倍以上，服务超过 400 家政府和公共安全机构，覆盖北美约 125M 居民。为支撑这一覆盖范围，公司将员工数扩充至 450
              人以上，并在华盛顿特区、纽约、多伦多和伦敦开设区域办公室。Peregrine 软件曾为超级碗、奥斯卡颁奖礼以及 2026 年 FIFA 世界杯 11 个主办城市中的 8
              个城市的安全融合中心协调安保运营。与此同时，公司的曝光度也引来公民自由组织和市政监督团体更强烈的审视。社区活动人士援引一项显示 54% 美国人对 AI 监控感到担忧的全国调查，在市议会采购听证会上动员反对
              Peregrine 合同，并强调创始人与 Palantir 的联系以及自动化执法情报持续存在的争议。
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
              - CO013
