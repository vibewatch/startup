              Peregrine 的 Palantir 渊源，并表达公众对自动化监控和预测性警务技术的更广泛担忧。Peregrine
              强调不使用面部识别，也不收集第三方专有监控数据，试图回应这些担忧，并把嵌入式审计轨迹和基于目的的访问日志定位为问责机制，而非监控基础设施。随着公司追求扩展至近 1,000
              个城市的激进目标，处理这些采购争议并应对严格的《联邦采购条例》（FAR）合规要求，成为关键运营任务。
            claimRefs:
