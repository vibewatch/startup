            body: >-
              Peregrine 估值跃升 2.7x 至 $6.8B，反映出风险资本对公共安全运营型 AI 的强烈兴趣。但如果没有经审计的 ARR
              构成、毛利率细节或经验证的净留存，投资者在增长回归常态或监管摩擦拖慢采购时，就会面临估值倍数压缩风险。
