      - number: '7.2'
        title: 联邦承包商合规、设施许可与运营安全治理
        blocks:
          - type: paragraph
            body: >-
              将公共部门部署扩展到市、州和联邦实体，会带来苛刻的运营治理要求和严格监管负担。为同时服务国防与情报对手方以及市政公共安全客户，Peregrine 持续维护正式合规体系，覆盖《联邦采购条例》（FAR）、DFARS
              条款下传和 SAM.gov
              活跃实体验证。公司已建立专门运营管理团队，负责其国防反情报与安全局（DCSA）设施安全许可（FCL）及获许可人员重新调查周期。维持这些政府承包商标准，需要严格的内部道德热线、强制披露流程，以及对所有分包商和第三方软件供应商进行系统性的授标前禁入审查。若强制监管披露失败、许可控制遭破坏，或刑事司法信息标准处理不当，就会形成严重的生存性风险，可能触发有因合同终止，或在相互关联的政府采购计划中遭行政禁入。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
