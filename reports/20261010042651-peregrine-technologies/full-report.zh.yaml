      - number: '7.4'
        title: 综合风险判断、估值敞口与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              Peregrine 在 2026 年 6 月完成 $250M D 轮融资、投后估值 $6.8B 后，如果 ARR
              扩张或市政合同速度放缓，将面临显著的估值倍数压缩风险。公司连续三年收入增长三倍，展现出顶线动能；但非上市市场预期要求其继续快速渗透市政机构，并把金融服务商业试点转化为正式客户。以下三个可观察的下行里程碑将触发投资逻辑破坏：第一，关键大都市市场通过法律，禁止自动化市政数据融合或强制实施算法禁令；第二，基于目的的角色访问控制被记录为失效或遭入侵，导致未经授权的公民数据暴露；第三，有组织的社区抵制之后，一级大都市警察部门采购停滞或取消账户。
