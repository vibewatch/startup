  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值概览
        blocks:
          - type: paragraph
            body: >-
              Peregrine Technologies 的商业画像非常突出：它提供云原生情报平台，连接彼此割裂的市政、州级和应急数据库，却不收集或持有底层源数据，并借此在政府机构中快速扩张。2026 年 6 月，公司由
              Sequoia Capital 和 Fifth Down Capital 领投、OG Venture Partners、Goldcrest Capital、XYZ Ventures 与 Godfrey
              Capital 共同参与，完成 $250 million 的 Series D 融资，投后估值达到 $6.8 billion。这一估值较 2025 年 3 月确定的 $2.5 billion Series C
              估值跃升 2.7x。过去一年，公共部门业务进展翻倍，客户机构增至 400 多家，覆盖北美约 125 million
              名居民；但当前估值已经计入近乎无瑕的超高速增长执行，而底层基本面仍不透明。独立评论指出，govtech 和公共安全 AI
              目前享有类似前沿研究实验室的激进倍数，但公共部门采购周期仍然漫长，也容易受到预算重新分配影响。在没有经审计的收入数据或经验证的净收入留存指标之前，机构资本必须以严格的估值纪律看待当前定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
