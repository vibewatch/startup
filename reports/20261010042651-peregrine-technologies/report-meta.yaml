companyProfile:
  summary: >-
    Peregrine Technologies is a San Francisco-based public safety software company that fuses municipal, county, and
    event-security data into a permission-aware operational intelligence platform. The business has expanded rapidly
    through municipal deployments and marquee reference accounts, including security fusion-center work around the 2026
    FIFA World Cup, while remaining privately held and only partially transparent on revenue quality, margins, and
    retention.
