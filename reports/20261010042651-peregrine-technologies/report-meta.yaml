  topStrengths:
    - Rapidly expanding adoption across 400+ public safety agencies and 125M+ covered residents.
    - Tier-1 venture sponsorship and a successful June 2026 Series D continuation.
    - Strong product fit for fragmented municipal data workflows and compliance-heavy operating environments.
  topRisks:
    - Audited ARR, gross margin, NRR, and customer concentration remain undisclosed.
    - Municipal procurement friction and civil-liberties scrutiny can slow sales cycles or trigger backlash.
    - High valuation leaves little margin for error if growth decelerates or services intensity is higher than assumed.
  unresolvedGaps:
    - Audited ARR composition and the software-versus-services split.
    - Customer retention, NRR, and churn cohorts across municipal budget cycles.
    - Top-customer concentration and the ARR contribution of marquee deployments.
    - Gross margin by segment, including implementation and compliance-heavy work.
    - Governance, board rights, and the liquidation-preference stack after the Series D.
