company:
  name: "Peregrine Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: "Peregrine Technologies operates a public sector SaaS and data integration model with multi-year municipal contracts, achieving a $6.8B Series D valuation in June 2026 backed by $250M in fresh capital. While municipal procurement disclosures verify annual agency ACVs ranging from ~$77.5k in Burnsville to ~$1.02M annualized in San Mateo County, top-line ARR, gross margins, and NRR remain closely held private gaps, creating high financing dependence on private venture capital."
sections:
  - id: "revenue-model-and-monetization-structure"
    title: "Revenue Model and Public Sector Monetization Structure"
    body: "Peregrine Technologies operates a public sector enterprise SaaS monetization model, monetizing primarily through annual recurring software subscriptions across municipal police departments, county sheriff offices, emergency operations centers, and major event security consortia. The platform functions as a unified operational data integration and search environment, ingesting legacy records management systems (RMS), computer-aided dispatch (CAD), and digital evidence management systems (DEMS) without assuming ownership of customer data. Beyond municipal public safety agencies, Peregrine has monetized large-scale security fusion operations for major high-profile events, including coordinating operations across eight of the eleven North American host cities for the 2026 FIFA World Cup. While commercial pilots in private enterprise verticals such as financial fraud and travel have commenced, revenue realization remains overwhelmingly concentrated in local government appropriations, where procurement cycles require multi-jurisdictional buy-in and formalized city council funding votes."
    claimRefs:
      - "CI001"
      - "CI006"
      - "CI007"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "municipal-procurement-and-realized-pricing"
    title: "Municipal Procurement Economics and Contract Realization"
    body: "Empirical examination of executed public procurement filings reveals distinct contract realization structures across agency tiers. For single municipal departments, exemplified by the City of Burnsville, Minnesota, Peregrine structures multi-year agreements with predictable annual subscriptions ($77,500 in 2026) featuring built-in 3% compounding annual escalators ($79,825 in 2027 and $82,220 in 2028). Conversely, regional deployments leverage consortium contracting models: in San Mateo County, California, the Board of Supervisors approved a 40-month agreement not to exceed $3,386,218 across 18 participating municipal police departments and county offices. The County Executive funded the initial 18-month deployment via a $1,900,145 non-departmental appropriation transfer, establishing a lead-agency financing structure that shifts funding obligations to individual participating municipalities upon initial term expiration. Contractual terms bundle core data integration features while explicitly mandating that customers absorb third-party vendor API costs and egress fees."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Service Delivery Cost Structure and Unit Economic Blind Spots"
    body: "The service delivery economics of Peregrine's model reflect significant integration intensity that separates gross revenue from true software margins. While the platform leverages cloud-hosted software architectures, onboarding municipal datasets requires specialized data engineering to map incompatible CAD schemas, proprietary RMS databases, and body-worn camera feeds. To support strict government contractor requirements, Peregrine maintains significant compliance and security overhead, recruiting specialized public sector compliance managers at base compensation up to $175,000 to administer FAR, DFARS, SAM.gov, and Defense Counterintelligence and Security Agency (DCSA) facility clearances. Furthermore, third-party pass-through fees and forward-deployed implementation teams represent hidden service drag on gross profitability. Because management maintains total confidentiality over GAAP gross margins, customer acquisition costs (CAC), and cohort payback periods, underwriters cannot verify whether platform gross margins reflect standard enterprise software levels (>75%) or remain compressed by professional services."
    claimRefs:
      - "CI008"
      - "CI011"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-underwriting-verdict"
    title: "Capital Adequacy, Financing Dependency, and Investment Underwriting Verdict"
    body: "Peregrine's capitalization was substantially bolstered in June 2026 through a $250 million Series D financing round co-led by Fifth Down Capital and Sequoia Capital, establishing a post-money valuation of $6.8 billion. This transaction represents an aggressive 2.7x valuation expansion from its $2.5 billion Series C valuation achieved in March 2025, elevating cumulative lifetime funding past $470 million. With total headcount expanding past 450 employees across five metropolitan offices in the United States, Canada, and the United Kingdom, operating cash burn is substantial. Although CEO Nick Noone cited doubling customer accounts to over 400 agencies, he explicitly declined to disclose revenue, ARR, or cash burn metrics. Moreover, growing community opposition to data fusion systems at municipal council hearings introduces procurement friction. From an underwriting perspective, the absence of audited ARR, net revenue retention (NRR) cohorts, and customer concentration schedules renders the $6.8 billion valuation ungrounded in verifiable financial fundamentals, presenting an opaque private profile."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI011"
      - "CI012"
      - "CI014"
