        - "Full contract distribution: median ACV, mean ACV, and ACV by population tier"
      - - "Customer Acquisition Cost (CAC) & Payback"
        - null
        - "low"
        - "GovTech sales cycles span 6-18 months of municipal approvals; high CAC could severely depress net margins"
        - "Sales cycle length, quota attainment, direct sales commission structure, and fully burdened CAC payback period"
      - - "Gross Margin (Subscription vs Services)"
        - null
        - "low"
        - "Complex government data ingestion (CAD, RMS, JMS, DFR) risks heavy services dragging down software gross margin"
        - "Cost of goods sold breakdown between cloud compute/storage, data engineering personnel, and third-party API costs"
      - - "Net Revenue Retention (NRR)"
        - null
        - "low"
        - "Without NRR >100%, sustaining 3x revenue growth requires pure new logo acquisition across a finite universe of ~18,000 US police departments"
        - "Historical cohort net retention, logo churn rate, and expansion revenue from module cross-sell"
      - - "Customer Concentration"
        - null
        - "low"
        - "Exposure to major metro anchor contracts (e.g. LAPD, FIFA World Cup host cities) creates renewal and budget cliff vulnerability"
        - "Top 10 customer share of total ARR and percentage of revenue tied to single-year municipal appropriations"
    notes: "ACV values are derived from primary municipal contracts; all margin, retention, and acquisition metrics are private and undisclosed by Peregrine Technologies."
