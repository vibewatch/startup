callouts:
  - calloutType: "risk"
    title: "Civil-Liberties Backlash and Procurement Veto Risk"
    body: "Despite differentiating its software by excluding facial recognition and maintaining granular audit trails, Peregrine faces severe political friction at municipal city council hearings. Local controversies over surveillance technology and associations with Palantir led directly to contract cancellations, such as the February 2026 Durham council decision, demonstrating that municipal procurement decisions can be abruptly derailed by public advocacy."
    claimRefs:
      - "CP008"
      - "CP009"
      - "CP013"
  - calloutType: "insight"
    title: "Displacement Barriers in Legacy Public Safety Workflows"
    body: "Peregrine does not directly replace legacy Computer Aided Dispatch (CAD) or Records Management Systems (RMS) provided by incumbents like Versaterm and EFORCE Software. Instead, Peregrine acts as an overlay intelligence layer that connects to these transactional databases. This architecture sidesteps high switching costs and painful multi-year database migrations, allowing rapid adoption while leaving underlying systems of record intact."
    claimRefs:
      - "CP002"
      - "CP007"
      - "CP010"
