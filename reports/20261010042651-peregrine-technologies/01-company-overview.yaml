company:
  name: "Peregrine Technologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Peregrine Technologies is a San Francisco-based public safety software company valued at $6.8 billion following a $250 million Series D round in June 2026 led by Sequoia Capital and Fifth Down Capital. Founded in 2018 by Palantir veteran Nick Noone and technologist Ben Rudolph, the platform integrates municipal public safety datasets for more than 400 government agencies covering 125 million people. Diligence reveals an unverified 83.3x revenue multiple from historical disclosures alongside intensifying municipal scrutiny regarding AI-driven mass surveillance."
sections:
  - id: "company-identity-and-mission"
    title: "Corporate Identity and Public Safety Mission"
    body: "Peregrine Technologies, Inc. is a venture-backed enterprise software and operational intelligence company founded in 2018 and headquartered at 71 Stevenson Street in San Francisco, California. The company designs and operates a cloud-native data integration and situational awareness platform built specifically for municipal public safety departments, law enforcement agencies, and emergency management organizations. Unlike legacy surveillance vendors that manufacture proprietary hardware or aggregate external consumer data, Peregrine positions its software as a permission-aware institutional memory layer that ingests, models, and connects disparate municipal datasets—including computer-aided dispatch logs, body-worn camera records, 911 call records, and municipal incident feeds—into a unified searchable interface. The platform operates under a recurring B2G software subscription model, enabling local government agencies to query disparate silos rapidly while enforcing strict Criminal Justice Information Services compliance and role-based auditing."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founders, Leadership Structure, and Compliance Governance"
    body: "Peregrine was co-founded by Chief Executive Officer Nick Noone and Chief Technology Officer Ben Rudolph, former Stanford University gymnastics teammates who established the company's operational philosophy through a two-year embedded design residency with the San Pablo Police Department detective division. Noone previously directed Palantir Technologies' U.S. Special Operations business, leading deployment of counter-insurgency intelligence software in high-stakes operational theaters, while Rudolph designed foundational health and refugee data systems for the United Nations High Commissioner for Refugees and Dimagi. This complementary background blends Palantir-style data fusion architecture with specialized humanitarian data governance. To manage the stringent regulatory requirements of municipal and federal contracting, Peregrine maintains an active compliance apparatus overseeing Federal Acquisition Regulation requirements, Defense Counterintelligence and Security Agency facility clearances, and automated access logging, though comprehensive board composition and independent governance oversight remain closely held."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO009"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization History, Valuation Expansion, and Syndicate Backing"
    body: "Peregrine has raised approximately $500 million in total equity financing across seven funding rounds since its initial $1 million seed financing in June 2018. The company achieved unicorn status in March 2025 when Sequoia Capital led a $190 million Series C round at a $2.5 billion post-money valuation. Just fifteen months later, in June 2026, Peregrine closed a $250 million Series D financing that escalated its valuation to $6.8 billion, representing a 2.72x valuation increase within a single funding cycle. The round was co-led by Sequoia Capital alongside Fifth Down Capital, Goldcrest Capital, Godfrey Capital, OG Venture Partners, and XYZ Venture Capital. While venture market databases recorded historical annualized revenue of $30 million alongside the Series C round, implying a steep 83.3x revenue multiple, detailed capitalization details such as employee liquidity carve-outs, senior liquidation preference overhangs, and pro-rata voting rights remain undisclosed outside the primary investor syndicate."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO007"
      - "CO008"
      - "CO010"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-milestones"
    title: "Operational Scale, High-Profile Deployments, and Societal Headwinds"
    body: "Between 2024 and 2026, Peregrine experienced substantial commercial expansion, more than doubling its customer base to serve over 400 government and public safety agencies covering approximately 125 million residents across North America. To support this footprint, the company expanded its headcount to more than 450 employees and opened regional offices in Washington D.C., New York City, Toronto, and London. Peregrine's software has coordinated security operations for major events, including the Super Bowl, the Academy Awards, and security fusion centers across eight of eleven host cities for the 2026 FIFA World Cup. Concurrently, Peregrine's visibility has attracted heightened scrutiny from civil liberties organizations and municipal watchdog groups. Citing a national survey where 54% of Americans expressed alarm over AI surveillance, community activists have mobilized at city council procurement hearings to oppose Peregrine contracts, highlighting founder ties to Palantir and the ongoing controversy surrounding automated law enforcement intelligence."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO011"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
