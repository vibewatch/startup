callouts:
  - calloutType: "insight"
    title: "Valuation Velocity Outpaces Disclosed Fundamentals"
    body: "Peregrine's valuation jumped from $2.5 billion in March 2025 to $6.8 billion in June 2026, marking a 2.72x expansion in 15 months across consecutive rounds led by Sequoia Capital and Fifth Down Capital. However, with the latest recorded revenue standing at $30 million as of the Series C round, the valuation multiple reaches 83.3x revenue, underscoring that current pricing reflects aggressive forward growth assumptions rather than audited near-term financial metrics."
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO008"
      - "CO015"
  - calloutType: "risk"
    title: "Palantir Lineage and Public Scrutiny Threaten Procurement Velocity"
    body: "As Peregrine expands into major metropolitan police departments, it faces increasing resistance from community advocates and civil liberties organizations wary of mass surveillance and automated data fusion. With 54% of Americans viewing AI-powered surveillance as dangerous and municipal procurement hearings frequently citing the founders' Palantir backgrounds, political friction represents a material barrier to maintaining past customer acquisition velocity."
    claimRefs:
      - "CO012"
      - "CO013"
