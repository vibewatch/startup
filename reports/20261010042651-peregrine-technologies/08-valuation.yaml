  title: "Valuation"
  summary: "Peregrine secured a $250M Series D in June 2026 at a $6.8B post-money valuation, marking a steep 2.7x multiple expansion in 15 months despite unverified unit economics and significant regulatory overhang. While growth metrics and marquee deployments like the 2026 FIFA World Cup validate high product utility, the absence of audited ARR and public retention metrics necessitates a disciplined 'track' stance."
sections:
  - id: "investment-thesis-and-valuation-overview"
    title: "Investment Thesis and Valuation Overview"
    body: "Peregrine Technologies presents an extraordinary commercial profile, scaling rapidly across government agencies by delivering a cloud-native intelligence platform that connects siloed municipal, state, and emergency databases without collecting or owning the underlying source data. In June 2026, the company raised a $250 million Series D financing led by Sequoia Capital and Fifth Down Capital alongside OG Venture Partners, Goldcrest Capital, XYZ Ventures, and Godfrey Capital, establishing a post-money valuation of $6.8 billion. This mark represents a sharp 2.7x valuation step-up from its $2.5 billion Series C valuation established in March 2025. While public-sector traction has doubled over the past year to more than 400 customer agencies serving roughly 125 million citizens across North America, the valuation prices in flawless hypergrowth execution against opaque underlying fundamentals. Independent commentary highlights that govtech and public-safety AI are currently commanding aggressive multiples akin to frontier research labs, yet public-sector procurement cycles remain protracted and vulnerable to budget reallocations. Without audited revenue figures or verified net revenue retention metrics, institutional capital must approach the current pricing tier with rigorous valuation discipline."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV008"
      - "CV011"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-history-and-comparable-benchmarks"
    title: "Financing History and Comparable Benchmarks"
    body: "Peregrine's capitalization history demonstrates aggressive capital accumulation across private rounds, raising total cumulative funding of approximately $461M to $479M across four primary institutional stages. Prior to its $250M Series D, the company raised $190M in Series C financing in March 2025 at a $2.5B post-money valuation, $30M in Series B in May 2024, and earlier seed/undisclosed rounds. Estimated dilution indicates minimal equity surrender per stage, with the Series D selling approximately 3.7% to 4% of equity ($250M raised on a $6.5B pre-money / $6.8B post-money structure) and Series C surrendering roughly 7.6% ($190M on $2.5B post-money). In comparable market context, Peregrine trades at an implied multiple of over 160x against previously estimated historical ARR of $40.9M, representing a dramatic valuation premium compared to public-safety peers such as Flock Safety (last valued at $8.4B with physical automated license plate reader hardware integration) and legacy public safety software vendors like Versaterm or CAD/RMS suites. While Peregrine's software-only data indexing model avoids hardware maintenance liabilities and sidesteps the legal baggage of proprietary data custody, sustaining a $6.8B valuation requires expanding beyond core municipal police departments into federal agencies, international jurisdictions, and enterprise compliance markets."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Analysis and Diligence Path"
    body: "Evaluating Peregrine's forward return profile requires analyzing divergent adoption and regulatory scenarios across bull, base, and bear operating cases. Under the bull case, Peregrine successfully leverages its marquee role powering security fusion centers across 8 of 11 FIFA World Cup 2026 host cities into permanent multi-year enterprise contracts, driving rapid expansion into federal departments and international security agencies across Canada and the United Kingdom. Conversely, the bear case captures critical headwinds identified by adverse market analysis: public sector sales remain politically sensitive, surveillance-adjacent technologies face intensifying civil liberties scrutiny following Supreme Court limits on bulk-data warrants, and enterprise compliance requirements impose significant sales overhead. Furthermore, job postings confirm Peregrine is heavily investing in public sector compliance management, including FAR/DFARS flow-down requirements, SAM.gov maintenance, and DCSA facility security clearances (FCL) to unlock federal contracting. Until Peregrine provides transparent audits clarifying ARR growth rate, gross margin profiles, and renewal retention cohorts, prospective investors should maintain a 'track' stance and require verifiable diligence milestones before deploying capital at current prices."
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
