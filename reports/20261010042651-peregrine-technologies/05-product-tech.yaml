callouts:
  - calloutType: "insight"
    title: "Integration Layer vs. Surface Applications"
    body: "Peregrine's primary technological moat resides in its underlying data unification and entity resolution layer rather than customer-facing analytical dashboards. By ingesting dozens of fragmented municipal data systems without centralizing or duplicating underlying records, the platform establishes a durable operational foundation that makes subsequent AI grounding defensible and difficult for horizontal SaaS providers to replicate."
    claimRefs:
      - "CE001"
      - "CE009"
  - calloutType: "risk"
    title: "Public Scrutiny and Governance Accountability"
    body: "Public safety software operates under intense civil liberties scrutiny regarding algorithmic bias and surveillance risks. While Peregrine maintains strict technical guardrails—including full audit logging, proactive access flagging, and an explicit refusal to deploy facial recognition—the platform's expansion into federal and municipal agencies requires continuous verification that operational access matches stated evidentiary justifications."
    claimRefs:
      - "CE010"
      - "CE011"
