evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-revenue-and-nrr
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, SaaS subscription vs. professional services revenue split,
      and net revenue retention rates across annual agency cohorts.
    whyItMatters: >-
      At a $6.8 billion valuation, premium multiples require sustained organic expansion within existing customer
      accounts and high gross margins that cannot be verified from private estimates.
    diligencePath: >-
      Request confidential disclosure of audited income statements, subscription cohort retention waterfalls, and
      professional services margin breakdown under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: complete-management-directory
    missingEvidence: >-
      Complete executive directory and board of directors governance charter disclosing independent director seats and
      voting control agreements.
    whyItMatters: >-
      High founder dependence on Nick Noone and Ben Rudolph elevates operational key-person risk if independent
      governance and succession depth are unestablished.
    diligencePath: >-
      Review state corporate registry filings and request the current board roster, committee assignments, and voting
      rights agreement from company legal counsel.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: shareholder-register-and-liquidation-stack
    missingEvidence: >-
      Full shareholder capitalization table detailing exact equity ownership percentages, option pool allocation, and
      Series D senior liquidation preferences.
    whyItMatters: >-
      Multi-class preference stacks and potential senior liquidation overhangs could impair common equity returns if
      exit multiples compress from 83x.
    diligencePath: >-
      Examine the Certificate of Incorporation on file with Delaware Division of Corporations and request the certified
      capitalization table.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-segmentation
    missingEvidence: >-
      Granular breakdown of municipal public safety IT software spend distinguishing standalone data integration
      platforms from legacy CAD and RMS suites.
    whyItMatters: >-
      Without segmented procurement data, sizing the precise serviceable addressable market depends on unverified
      proxies and top-down municipal budget assumptions.
    diligencePath: >-
      Obtain state and municipal RFP awards, contract schedules, and Gartner/IDC GovTech software sector expenditure
      audits.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: municipal-contract-pricing-and-margins
    missingEvidence: >-
      Disclosed pricing schedules, gross margin profiles, and contract-level profitability metrics across Peregrine's
      400+ public safety customer base.
    whyItMatters: >-
      Without line-item contract economics, it is impossible to evaluate pricing power against competitors or determine
      whether customer acquisition yields sustainable software gross margins.
    diligencePath: >-
      Audit public records requests (FOIA/public records) for city council procurement approvals and request
      contract-level contribution margin data in management diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-arr-and-margins
    missingEvidence: >-
      Audited GAAP revenue, annual recurring revenue (ARR) breakdown between software licenses and professional
      integration fees, and gross margins by customer cohort.
    whyItMatters: >-
      Without audited ARR or gross margin figures, underwriting Peregrine's $6.8 billion valuation relies entirely on
      unverified promotional growth multiples and private round pricing.
    diligencePath: >-
      Request GAAP audited financial statements, subscription revenue waterfalls, and margin accounting schedules during
      confidential management diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: net-revenue-retention
    missingEvidence: >-
      Historical cohort Net Revenue Retention (NRR), gross revenue retention, and agency contract churn rates across
      multi-year municipal budget cycles.
    whyItMatters: >-
      Municipal contracts often feature termination-for-convenience clauses or require annual appropriation approval;
      failure to retain or expand existing agencies would severely impair forward enterprise value.
    diligencePath: >-
      Obtain multi-year agency retention cohorts and sub-agency opt-in renewal statistics from consortium deployments
      such as San Mateo County.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue contribution and ARR concentration across municipal, county, and federal agency accounts.
    whyItMatters: >-
      High concentration among marquee police departments or event-driven fusion centers (e.g. FIFA World Cup host
      cities) exposes the revenue base to political, regulatory, or administrative turnover risk.
    diligencePath: >-
      Examine customer revenue concentration schedules and assess contract expiration dates for the largest five
      municipal agency accounts.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: legacy-ingestion-performance
    missingEvidence: >-
      Independent technical benchmarks and telemetry detailing ingestion throughput, latency overhead, and failure rates
      when connecting to on-premises legacy Computer-Aided Dispatch (CAD) and Records Management Systems (RMS).
    whyItMatters: >-
      Legacy CAD and RMS platforms in local police departments utilize varied proprietary schemas and legacy relational
      models; ingestion delays or sync errors directly impair real-time situational awareness and officer safety during
      emergency responses.
    diligencePath: >-
      Request customer deployment telemetry, average API sync latency metrics across top RMS integrations (e.g.,
      Versaterm, CentralSquare, Tyler Technologies), and SLA performance records from active fusion centers.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: corporate-entity-boundary
    missingEvidence: >-
      Clear corporate documentation regarding the relationship, IP ownership, and operational boundary between Peregrine
      Technologies, Inc. (US data integration platform) and edge-vision camera technology under peregrine.ai (Peregrine
      Technologies GmbH).
    whyItMatters: >-
      Diligence must verify whether edge vision intellectual property and European telematics partnerships represent an
      owned product line, affiliate licensing, or distinct corporate entity.
    diligencePath: >-
      Review corporate organization charts, subsidiary filings, and intercompany IP transfer agreements during legal
      diligence.
    relatedQuestionRefs:
      - QE001
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: Customer retention cohorts and Net Revenue Retention (NRR)
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross retention rate (GRR), and logo churn rates across
      municipal law enforcement customers.
    whyItMatters: >-
      While third-party commentary asserts high retention, Peregrine does not disclose audited SaaS retention metrics,
