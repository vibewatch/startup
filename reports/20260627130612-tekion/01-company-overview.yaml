- id: scale-and-milestones
  title: Scale, Operations, and Key Milestones
  body: 'As of July 2024, Tekion serves more than 2,000 automotive retailers (dealership franchises/rooftops) and works with
    more than 250 ecosystem technology partners. The platform supports 52+ OEM brands including General Motors, Ford, Honda,
    Hyundai, Toyota, Porsche, and others, giving it broad coverage across both domestic and import automotive segments. The
    company''s dealer base has expanded significantly — from a handful of pilot dealers in 2020 to 2,000+ as of mid-2024.


    Key strategic milestones include: the February 2020 ARC product launch; October 2020 unicorn status; the April 2022 expansion
    of ARC to include CRM and digital retail capabilities (renamed Automotive Enterprise Cloud); the July 2023 acquisition
    of Five64 (vehicle registration technology); the January 2024 partnership with Asbury Automotive Group (one of the largest
    US publicly listed dealer groups, initiating a four-store DMS pilot); and the January 2025 announcement of Ken Garff Automotive
    Group as a Tekion customer.


    Tekion''s employees number approximately 2,500+, including development teams in Bengaluru and Chennai, India, and go-to-market
    teams across the US and Europe. The company executed a 10% workforce reduction in August 2023, impacting approximately
    200 Indian employees, reflecting a recalibration of growth investment following its high-growth phase. Despite this, the
    July 2024 $200M round signals continued investor confidence in the long-term opportunity.

    '
