callouts:
- calloutType: strength
  title: 97% YoY ARR Growth — Elite SaaS Growth Rate
  body: Tekion disclosed 97% year-over-year ARR growth for 2023 in its July 2024 funding announcement, an elite growth rate
    for a vertical SaaS company at this stage. Combined with a $4B+ valuation and 2,000+ dealer customers, this confirms Tekion's
    market leadership in automotive cloud DMS.
  claimRefs:
  - CO019
  - CO022
- calloutType: strength
  title: OEM Certification Network Provides Durable Distribution Moat
  body: Tekion's integration and certification across 52+ OEM brands — including as an approved GM DMS provider and Porsche-preferred
    platform — creates a structural distribution advantage. Dealers select Tekion partly because their OEM requires or recommends
    it, reducing churn risk and customer acquisition costs.
  claimRefs:
  - CO006
  - CO007
  - CO008
- calloutType: risk
  title: Revenue Opacity Limits Independent Valuation Verification
  body: Tekion has never publicly disclosed its exact ARR or revenue trajectory beyond the single 97% YoY growth rate disclosed
    in July 2024. This opacity makes independent valuation verification difficult and leaves investors reliant on founder-disclosed
    metrics and growth rate proxies.
  claimRefs:
  - CO033
- calloutType: risk
  title: CDK Global Cyberattack Signals Industry-Wide DMS Security Risk
  body: The June 2024 ransomware attack on CDK Global that disrupted thousands of US dealerships demonstrates that automotive
    DMS providers are high-value cyberattack targets. While the attack benefited Tekion's positioning short-term, it also
    signals that Tekion's own cloud infrastructure will face escalating adversarial pressure as it grows.
  claimRefs:
  - CO031
  - CO032
  - CO034
