- id: funding-history-and-valuation
  title: Funding History and Valuation
  body: 'Tekion has raised a total of $640 million in external capital since its 2016 founding, reaching a $4B+ valuation
    in its most recent July 2024 round. The funding trajectory reflects both the company''s strong growth metrics and the
    automotive industry''s recognition of DMS modernization as a significant market opportunity.


    Early investors included Index Ventures, Storm Ventures, Airbus Ventures, BMWi Ventures, Renault-Nissan-Mitsubishi Alliance
    Ventures, and General Motors, signaling automotive industry validation from inception. The October 2020 Series C ($150M,
    led by Advent International with participation from Exor, Airbus Ventures, and FM Capital) brought Tekion into the unicorn
    club at a $1B+ valuation — a major milestone reflecting the maturity of its platform and growing dealer adoption.


    In October 2021, the company closed a $250M Series D at a $3.5B valuation, led by Alkeon Capital and Durable Capital Partners
    with participation from Hyundai Motor Company, demonstrating continued momentum and OEM strategic alignment. The most
    recent round — $200M in growth equity from Dragoneer Investment Group on July 16, 2024 — pushed the valuation above $4
    billion. The 2024 round was accompanied by the announcement of 97% year-over-year ARR growth in 2023 and 2,000+ automotive
    retailer partnerships, signaling strong market traction. Tekion has not disclosed its exact ARR, but the 97% YoY growth
    rate and the $4B valuation imply a rapidly expanding revenue base.

    '
