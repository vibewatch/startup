      - number: '3.3'
        title: 'Secondary Competitors: Cox Automotive Portfolio and Emerging Players'
        blocks:
          - type: paragraph
            body: >-
              Cox Automotive (Atlanta, GA, private; subsidiary of Cox Enterprises) has assembled a comprehensive
              automotive software portfolio including DealerSocket (DMS, acquired from Solera Holdings in 2021),
              Dealertrack (F&I and digital contracting), VinSolutions (CRM), and Dealer.com (digital marketing).
              DealerSocket serves approximately 9,000 dealerships globally, primarily through its iDMS platform, and
              represents a credible cloud-native alternative to CDK and Reynolds at a lower price point. Cox
              Automotive's bundled value proposition creates both a competitive threat (full ecosystem lock-in) and a
              differentiation opportunity for Tekion (open API vs. closed Cox ecosystem).


              PBS Systems (British Columbia, Canada) is a cloud-based DMS serving 1,000+ North American dealerships,
              primarily small to mid-size. DMS for Dealers is a newer entrant targeting independent and franchise
              dealers with modern cloud architecture. VinSolutions and Dealertrack, while not full DMS platforms,
              compete directly with Tekion's CRM and F&I modules respectively. Salesforce has begun entering the
              automotive CRM space through partnerships with dealer groups, representing a longer-term threat to the CRM
              component of Tekion's ARC platform.
            claimRefs:
