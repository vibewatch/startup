  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Overview and Market Structure
        blocks:
          - type: paragraph
            body: >-
              The US dealer management system market is an entrenched oligopoly anchored by two incumbent providers with
              combined dealer reach exceeding 90%: CDK Global and Reynolds & Reynolds. This duopoly has persisted for
              over four decades, sustained by long-term contracts, deep OEM integrations, and the embedded nature of DMS
              workflows in dealership operations. Tekion's competitive position is that of a cloud-native challenger
              disrupting this incumbency by offering a unified, API-first platform.


              The CDK Global ransomware attack of June 2024 was a watershed competitive event: the 19-day outage
              affecting 15,000+ dealerships forced dealer groups to evaluate vendor risk concentration, accelerating the
              competitive evaluation pipeline for alternatives including Tekion and DealerSocket. CDK Global's leveraged
              capital structure (Brookfield $8.3B acquisition in 2022) limits R&D investment capacity, while Reynolds &
              Reynolds, privately held and conservatively managed, has been slow to offer cloud-native alternatives.
              This structural incumbency vulnerability is Tekion's primary market entry wedge.
            claimRefs:
