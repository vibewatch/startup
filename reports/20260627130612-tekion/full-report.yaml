      - number: '4.2'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Tekion has raised approximately $640 million in total venture funding across six rounds since its 2016
              founding, with its most recent round being a $200 million Series E in July 2024 led by Dragoneer
              Investment Group, valuing the company at over $4 billion. Earlier rounds include a $250 million Series D
              in October 2021 that valued the company at $3.5 billion. Other investors include General Atlantic, Advent
              International, Greenoaks Capital, BMW i Ventures, and Hertz. The Series E marked a 14% valuation premium
              over the Series D, reflecting continued execution in a challenging macro environment for late-stage
              venture. The funding composition suggests a mix of growth equity and strategic investors: BMW i Ventures
              and Hertz bring OEM and fleet strategic alignment; Dragoneer, Greenoaks, and General Atlantic represent
              pure financial sponsors. Tekion has reportedly turned down IPO discussions, indicating management's
              preference for private growth financing, with bankers cited in Automotive News discussions suggesting a
              potential IPO readiness timeline of 2026–2027. Secondary share sales have been reported to provide
              liquidity for early employees. The company's capital structure remains private, and preferred stock terms
              are not publicly disclosed, though standard liquidation preferences and anti-dilution provisions are
              presumed based on investor class.
