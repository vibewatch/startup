      - number: '5.3'
        title: OEM Integrations and Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Tekion's multi-OEM support model is a core competitive differentiator. Traditional DMS providers like
              Reynolds and Reynolds and CDK Global certify integrations individually with each OEM, creating siloed data
              architectures. Tekion's ARC uses a unified OEM data layer that normalizes vehicle data, warranty claims,
              recall notifications, and incentive programs across 52+ OEM brands, enabling dealers carrying multiple
              brands to operate from a single platform. The GM partnership is particularly notable: Tekion built GM's
              proprietary EV digital retail tool, Ultifi, giving it a preferred-vendor relationship with North America's
              largest automaker by volume. AWS Marketplace lists Tekion as a verified solution provider, and Google
              Cloud includes Tekion in its automotive industry solutions portfolio, reflecting the platform's
              cloud-native credentials. Beyond OEM integrations, Tekion's 250+ ecosystem partners include F&I product
              providers, digital retail platforms, CRM tools, and compliance systems—all accessing dealership data via
              Tekion's open APIs. ApexVehicle Solutions and other independent dealer technology consultants have
              documented Tekion's API ecosystem as best-in-class for extensibility. The platform also supports
              integration with Honda, Kia, Hyundai, and Toyota dealer portals, extending beyond domestic OEMs to cover
              the top import brands. This breadth of OEM certification is a significant barrier to new entrant
              competition: each OEM certification requires 6–18 months of technical testing, data format negotiation,
              and dealer pilot programs.
            claimRefs:
