      - number: '5.2'
        title: AI and Machine Learning Capabilities
        blocks:
          - type: paragraph
            body: >-
              Tekion has invested substantially in AI/ML capabilities embedded throughout the ARC platform. Key AI
              features include Tekion Pay—an integrated payment and financing workflow that uses machine learning to
              optimize F&I product presentation based on customer profile, purchase history, and real-time lender rate
              data; AI-powered parts recommendation in the service department that reduces parts obsolescence and
              improves first-fix rates; predictive inventory management that uses historical sales data, OEM
              build-to-order timelines, and regional demand signals to optimize stock levels; and generative AI-powered
              customer communication tools for service appointment scheduling, follow-up messaging, and digital
              retailing workflows. The company's proprietary dataset—spanning 2,000+ rooftops, 52+ OEM brands, and
              millions of customer transactions—provides a unique training corpus that competitors with less
              cloud-native deployments cannot replicate. IBM has published research on automotive cloud AI applications
              that aligns with Tekion's approach of using multi-modal data (transaction logs, service records, customer
              interactions) to train models at scale. Tekion's AI capabilities are marketed under the Tekion
              Intelligence brand, though specific model architectures and benchmark performance data are not publicly
              disclosed. The integration of AI tools into F&I workflows is particularly significant given that F&I
              products (warranties, GAP insurance, service contracts) represent $2,800–$4,200 per vehicle sold in dealer
              gross profit.
