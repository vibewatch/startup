  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              The dealer management system (DMS) market encompasses enterprise software platforms that orchestrate
              franchised and independent automotive dealerships' core operations: vehicle inventory management, customer
              relationship management (CRM), finance and insurance (F&I) processing, service and parts scheduling, and
              regulatory compliance. Tekion competes primarily in the cloud-native DMS segment, which is displacing
              decades-old on-premise platforms (CDK Drive, Reynolds ERA, DealerSocket) across the $1.3 trillion US
              franchised-dealership revenue base reported by NADA for 2023.


              Status-quo substitutes—paper-based processes, spreadsheet hybrids, and first-generation Windows-era
              DMS—remain prevalent at approximately 35–40% of US dealerships as of 2024. Adjacent spend categories
              addressable by Tekion's Automotive Enterprise Cloud (AEC) include OEM dealer portals, third-party vehicle
              valuation services, and standalone digital retailing tools, representing $2–4B in additional annual
              software spend not included in core DMS market estimates. The DMS category definition varies substantially
              across research firms: narrow definitions focus solely on dealer-facing transaction software (inventory,
              F&I, service scheduling), while broader definitions include adjacent CRM, digital marketing, and OEM
              connectivity platforms. This definitional divergence explains the wide range of market size estimates—from
              $0.85B (US, dealer-license-only) to $14.2B (global, broad definition by 2034). For competitive and
              valuation purposes, Tekion's primary addressable market is the US franchised-dealer core DMS segment,
              where it faces CDK Global and Reynolds & Reynolds as incumbent duopoly holders.
            claimRefs:
              - CM003
              - CM004
              - CM021
              - CM032
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM014
              - CM021
      - number: '2.2'
        title: Market Sizing and TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Emergen Research valued the global Automotive DMS market at USD 6.8 billion in 2024, projecting growth to
              USD 14.2 billion by 2034 at a CAGR of 7.6%. This estimate encompasses both on-premise and cloud
              deployments globally. The North American segment represents approximately 35–40% of global DMS spend,
              implying a US DMS market of roughly USD 2.4–2.7 billion in 2024 (derived estimate; not separately
              reported).


              NADA's 2023 Annual Data reports 16,990 franchised light-vehicle dealers in the US, collectively generating
              $1.3 trillion in total sales and 276 million repair orders. At an estimated average annual DMS contract
              value of $50,000–$120,000 per rooftop (depending on modules and group size), the US franchised-dealer DMS
              TAM approximates $0.85B–$2.0B annually. Tekion's current ~2,000 dealer rooftops at an estimated $60,000
              average ACV implies ~$120M ARR from dealer licenses—consistent with the company's reported 97% YoY ARR
              growth rate in 2023. Research firm estimates diverge significantly—from $3.5B to $14.2B globally by
              2030–2034—depending on whether adjacent modules (CRM, digital retail, F&I) are included in the market
              boundary definition. Multiple analytical lenses are therefore required for defensible TAM sizing:
              bottom-up (NADA dealer counts × ACV), top-down research reports (Emergen Research, MarketsandMarkets,
              IBISWorld), and competitive revenue proxy (CDK + Reynolds combined revenue ~$3B implies total market $4–6B
              including services). The serviceable obtainable market (SOM) reflects annual contract renewal
              opportunities: approximately 3,400–4,200 US dealerships whose 4–5 year contracts expire each year.
            claimRefs:
