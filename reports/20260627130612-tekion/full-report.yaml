  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and ARR Trajectory
        blocks:
          - type: paragraph
            body: >-
              Tekion generates revenue primarily through a subscription model based on per-rooftop monthly fees for its
              Automotive Retail Cloud (ARC) platform, which includes the Dealer Management System (DMS), Customer
              Relationship Management (CRM), and ancillary modules. Additional revenue streams include implementation
              and onboarding fees, professional services, and transaction-based fees for payments and financing
              facilitation through its ecosystem. The company reported 97% year-over-year ARR growth in 2023,
              which—combined with its claimed 2,000+ dealer rooftop base—implies an estimated ARR of $200 million to
              $350 million as of mid-2025. This growth rate far exceeds industry medians for vertical SaaS companies at
              this scale. The SaaS model provides high revenue visibility, with multi-year contracts (typically 3–5
              years) typical for DMS platforms. Churn is structurally low in DMS because switching costs are extremely
              high—dealer data migration, staff retraining, and OEM recertification create 18–36 month migration
              timelines. Tekion's per-rooftop pricing is estimated at $2,000–$4,500 per month, consistent with industry
              benchmarks for full-suite DMS, CRM, and service lane tools bundled together. This pricing may represent a
              premium over incumbents like CDK Global but is justified by cloud-native capabilities and reduced IT
              infrastructure costs for dealers.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
