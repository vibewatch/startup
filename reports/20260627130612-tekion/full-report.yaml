      - number: '5.5'
        title: Technical Risks and Competitive Technology Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite its architectural advantages, Tekion faces several technical risks and capability gaps. First, the
              scale of migrating large dealer groups (100+ rooftops) from incumbent systems is complex: data migration
              from CDK and Reynolds involves proprietary data formats, and incomplete migrations can cause revenue
              disruption. Asbury Automotive's migration to Tekion, confirmed by DigitalDealer and BusinessWire, took
              multiple years and required significant IT resources. Second, Tekion's open API model—while competitively
              advantageous—creates potential security surface area. The CDK Global ransomware incident in June 2024
              demonstrated that DMS platforms are high-value targets; Tekion's cloud architecture provides better
              intrinsic security than on-premise CDK, but its broader API ecosystem increases exposure. Third, Tekion's
              AI/ML capabilities, while promising, are not independently benchmarked. Competitors including CDK
              (post-breach) are also investing in AI workflows, and Salesforce's Automotive Cloud is adding AI-first DMS
              capabilities. Red Hat's automotive cloud research notes that open-source DMS alternatives may emerge for
              smaller dealers. Fourth, the platform's dependency on AWS and Google Cloud creates cost and vendor lock-in
              risks as it scales—infrastructure costs rise proportionally with transaction volume, potentially
              compressing gross margins if cloud cost management is not optimized. These technical risks are manageable
              but should be monitored as Tekion scales to larger dealer groups and international markets.
            claimRefs:
