    title: Company Overview
    sections:
      - number: '1.1'
        title: Founding and Identity
        blocks:
          - type: paragraph
            body: >
              Tekion Corp was founded in 2016 by Jay Vijayan and Guru Sankararaman in Pleasanton, California. Jay
              Vijayan previously served as Chief Information Officer (CIO) at Tesla, Inc., reporting directly to CEO
              Elon Musk, where he led the transformation of Tesla's enterprise information systems. Recognizing the
              profound technological gap between legacy automotive dealer management systems (DMS) and modern cloud
              software, Vijayan left Tesla to build a fully cloud-native platform for the automotive retail industry.


              The company's flagship product, the Automotive Retail Cloud (ARC), launched in February 2020 as the first
              fully integrated, cloud-native platform serving the entire automotive retail ecosystem. Unlike legacy DMS
              providers such as CDK Global and Reynolds and Reynolds, which rely on on-premises client-server
              architecture developed in the 1990s, Tekion's ARC is API-first, modular, and built on modern cloud
              infrastructure. This architectural advantage enables real-time integrations with OEM factory systems,
              consumer digital retail tools, and third-party ecosystem partners.


              Tekion is headquartered in Pleasanton, California, with Asia-Pacific headquarters in Bengaluru, India, and
              a regional center in Chennai. The company also operates offices in the United Kingdom, Canada, Germany,
              and France, reflecting its ambitions for international automotive retail coverage. As of mid-2024, Tekion
              employs 2,500+ people and has integrated 52+ automotive brands into its platform, spanning General Motors,
              Ford, Honda, Hyundai, Toyota, Porsche, and others. The company is currently in the growth stage, having
              achieved unicorn status in October 2020 at its Series C financing round.
