              - CR010
      - number: '7.2'
        title: Key-Person and Talent Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Jay Vijayan, Tekion's founder and CEO, is the single most important individual at the company. He built
              Tekion's original vision, recruited the founding team, and is the primary relationship holder with major
              OEM and investor partners. His prior role as Tesla's Global CIO is the central narrative behind Tekion's
              technological differentiation and market credibility. Departure, incapacitation, or significant
              distraction of Jay Vijayan would materially impact investor confidence, OEM relationships, and employee
              morale. This key-person risk is elevated by the absence of any publicly disclosed succession planning or
              co-CEO structure. Beyond the CEO, Tekion's technology talent is concentrated in Bengaluru, India—estimated
              at 60–70% of the engineering workforce. This creates geopolitical and operational risk: US-India
              technology export restrictions, visa policy changes, or regional disruptions could affect development
              velocity. Talent retention in Bengaluru's competitive tech market (competing with Amazon, Google, Infosys,
              and Wipro) is a cost and operational risk. The company's pre-IPO status limits the appeal of equity
              compensation relative to publicly traded competitors. Human resource law compliance (DOL FMLA, employment
              standards) in dual US/India operations adds organizational complexity. A secondary key-person risk
              involves the OEM relationship managers and partner integration engineers: Tekion's 52+ OEM certifications
              required specialized negotiation and technical knowledge that is embedded in a small team.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Competitive and Market Risks
        blocks:
          - type: paragraph
            body: >-
              Tekion's competitive position faces risks from multiple directions. CDK Global, post-breach, is actively
              rebuilding its cloud migration strategy with urgency driven by reputational necessity—a successfully
              modernized CDK would eliminate Tekion's primary architectural advantage and leverage CDK's existing
              relationships with 10,000+ dealers. Reynolds and Reynolds' ERA platform, while legacy, has deep dealer
              loyalty and Reynolds' private ownership (R.L. Polk family) means it is not under quarterly earnings
              pressure to make cost-cutting decisions that could hurt service quality. DealerSocket (acquired by
              Reynolds) and Dealertrack (Cox) are investing in cloud migrations. Beyond incumbents, Salesforce
              Automotive Cloud is building AI-first DMS capabilities from a strong enterprise software position. New
              entrants from Silicon Valley (venture-backed) could attempt to replicate Tekion's greenfield approach. The
              FTC's enforcement against CDK for anti-competitive data access practices is a double-edged sword: it
              creates competitive opportunity (CDK dealers seeking alternatives) but also signals the FTC is actively
              monitoring DMS market dynamics, which could create regulatory risk for Tekion's own data practices as it
              becomes the dominant cloud DMS. The Emergen Research forecast of $6.8B DMS market by 2032 and 14.5% CAGR
              validates market growth but also signals that the market is large enough to attract additional well-funded
              competitors.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Regulatory, Privacy, and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Tekion's data platform processes highly sensitive consumer and dealer financial data, creating significant
              regulatory exposure. Key regulatory risks include: CCPA/CPRA compliance for California dealer data
              (California has 3,000+ rooftops, representing ~18% of the US market); GDPR exposure for any European
              dealer expansion; FTC automotive data-sharing enforcement (the 2024 FTC action against CDK Global for data
              access practices creates a precedent framework that applies to all DMS providers); PCI DSS compliance for
              Tekion Pay payment processing; HIPAA-adjacent obligations for insurance and financing data in F&I
              workflows; and potential antitrust scrutiny if Tekion's market share reaches a level that triggers
              monopoly-power concerns under US antitrust law. The FTC press release on CDK data-sharing (2024) is a
              landmark precedent: it establishes that DMS providers cannot use market power to block third-party data
              access, a principle that governs Tekion's own API ecosystem as it grows. Data localization requirements in
              international markets (EU GDPR Article 44, India DPDP Act) create compliance costs for Tekion's
              international expansion. HHS HIPAA regulations overlap with the consumer financial data Tekion processes
              for F&I transactions—while Tekion is not technically a covered entity, F&I data includes health-adjacent
              information that creates compliance gray areas. The govinfo.gov published FTC-CDK order provides a
              regulatory framework reference for the DMS industry.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
          - type: table
            tableRef: TR004
            claimRefs:
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
      - number: '7.5'
        title: Execution, Financial, and Capital Market Risks
        blocks:
          - type: paragraph
            body: >-
              Tekion's execution risks are concentrated in two areas: large dealer group migration complexity and
              pre-profitability capital requirements. The Asbury Automotive migration (200+ rooftops) has extended
              beyond initial timelines per trade press reporting, creating a risk that large enterprise migrations
              produce reference damage—one failed Fortune 500 migration can deter other large groups from adopting
              Tekion, slowing the growth curve that justifies the $4B+ valuation. Financial risks include: (1) the
              company is not profitable and must either reach breakeven by 2027–2028 or raise additional capital; (2)
              the $640M raised has been consumed by aggressive hiring, OEM integrations, and US market expansion—cash
              runway is not publicly disclosed; (3) a deteriorating venture capital market could force Tekion to IPO at
              a lower multiple than desired, diluting employees and early investors; (4) if the growth rate decelerates
              below the 40% threshold needed to support the $4B+ valuation, a down-round risk exists; (5) interest rate
              sensitivity—Tekion's valuation is based on high-multiple SaaS pricing that is inversely correlated with
              risk-free rates, and any sustained rate environment above 4% compresses multiples. The company's decision
              to avoid an IPO through 2024–2025 was strategically sound but creates a compounding pressure: each year of
              private status means a larger public market debut is required to generate meaningful employee liquidity.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
          - type: table
            tableRef: TR005
            claimRefs:
              - CR018
              - CR019
              - CR021
          - type: figure
            figureRef: FR004
            claimRefs:
