  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation and Comparable Analysis
        blocks:
          - type: paragraph
            body: >-
              Tekion Corp's most recent valuation anchor is its July 2024 Series E at $4B+ post-money valuation, led by
              Dragoneer Investment Group with $200M raised. This valuation implies an EV/ARR multiple of approximately
              13–20x on estimated 2024 ARR of $200–300M (midpoint: ~16x on $250M). For context, public vertical SaaS
              companies trade at median NTM EV/ARR of 8–12x as of 2025 per a16z SaaS market data and KeyBanc SaaS survey
              benchmarks. The premium over public comps is driven by Tekion's superior growth rate (97% YoY ARR in 2023
              vs. vertical SaaS median ~15–25% at comparable scale) and private market illiquidity discount expectations
              at exit. Comparable public companies include: Veeva Systems (life sciences vertical SaaS, ~$30B market
              cap, ~10x NTM ARR), Tyler Technologies (government vertical SaaS, ~$20B market cap, ~9x NTM ARR), and
              ServiceTitan (home services vertical SaaS, recently public at ~$9B market cap). CDK Global, as the direct
              automotive DMS comparable, was acquired by Brookfield at ~$8.3B in 2022 on $1.8B revenue (~4.6x revenue),
              though CDK was mature/slow-growing at that point. Macrotrends historical data and Yahoo Finance show
              Veeva's peak EV/ARR multiple of 20–30x at 40%+ growth, suggesting Tekion's current pricing is reasonable
              for its stage and trajectory. Morningstar provides public comp benchmarking for vertical SaaS sector
              multiples.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: Bull Case Valuation ($6–8B)
        blocks:
          - type: paragraph
            body: >-
              The bull case for Tekion assumes: (1) ARR growth sustains at 50%+ annually through 2026, reaching $500M+
              ARR by end of 2026; (2) Tekion monetizes AI features at a premium, with Tekion Intelligence commanding a
              15–20% ARPU uplift per rooftop; (3) the company expands to 3,500+ US rooftops by 2026, capturing ~20% of
              the US dealer market; (4) international expansion into UK, Germany, or Australia (BMW/Toyota network) adds
              incremental ARR; (5) SaaS multiples recover to 15–18x NTM ARR driven by declining interest rates. Under
              these conditions, a 2026–2027 IPO at 15x projected 2027 ARR of $700M implies a $10.5B+ valuation at IPO,
              with a current NPV of $6–8B. This bull scenario requires consistent execution, no major CDK cloud
              competitive response, and a favorable capital markets environment. The ForEntrepreneurs SaaS metrics
              framework supports the thesis that companies with 50%+ growth and strong NRR command premium multiples at
              IPO. The a16z SaaS benchmarks indicate that vertical SaaS companies with >20% market penetration and
              strong OEM certification moats have historically achieved premium exit multiples.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Base Case Valuation ($4.5–6B)
        blocks:
          - type: paragraph
            body: >-
              The base case assigns an estimated fair value range of $4.5–6B for a 2026–2027 IPO, based on 12–15x
              projected 2026 ARR of $380–480M. This scenario assumes: (1) ARR growth moderates to 40–50% annually
              through 2026 as the company passes the $300M ARR inflection point; (2) Tekion reaches 2,500–3,000 rooftops
              by 2026; (3) the GM and Ken Garff partnerships generate strong references but no single transformational
              OEM or DSO win; (4) SaaS multiples stabilize at 10–14x NTM ARR as interest rates normalize. The base case
              valuation represents a modest premium over the July 2024 $4B+ Series E, reflecting one to two more years
              of compound growth at 40% through the expected IPO window. DnB business intelligence and Sapient Capital's
              private company valuation frameworks support this range. Under the base case, the $4B+ Series E represents
              a reasonable entry for late-stage investors at a 20–30% IRR target over 24–36 months, consistent with
              Dragoneer's historical portfolio performance. Pitchbook and KeyBanc comparable transaction data support
              the 12–15x ARR multiple range for pre-IPO vertical SaaS at this growth rate.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV004
            claimRefs:
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Bear Case Valuation ($2.5–3.5B)
        blocks:
          - type: paragraph
            body: >-
              The bear case values Tekion at $2.5–3.5B (a 12–37% discount to the 2024 Series E), driven by one or more
              adverse scenarios: (1) ARR growth decelerates to below 30% annually as CDK completes a credible cloud
              migration and retains existing customers, limiting Tekion's greenfield wins; (2) the Asbury Automotive
              migration failure creates reference damage that significantly slows the enterprise sales cycle; (3) SaaS
              multiples compress to 6–8x NTM ARR in a sustained high-rate environment, consistent with Macrotrends
              historical data on 2022 multiple compression; (4) a cybersecurity breach at Tekion triggers churn among
              risk-averse large dealer groups; (5) Jay Vijayan departs or a key-person event significantly impacts
              investor confidence. Under this scenario, public market investors would value Tekion at 7–9x projected
              2027 ARR of $350–450M, implying $2.5–4B market cap at IPO. This represents a down-round for Series E
              investors and significant employee equity dilution. The bear case probability is assessed at 20–25% given
              current execution trajectory and the significant structural advantages Tekion maintains. Yahoo Finance
              comparable analysis for mature SaaS multiples provides the lower-bound reference.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
      - number: '8.5'
        title: Recommendation and Investment Thesis
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Cautious Buy, contingent on audited financial verification and CDK competitive monitoring.
              Tekion presents a compelling investment thesis as the leading cloud-native DMS disruptor in a $6.8B total
              addressable market growing at 14.5% CAGR. Its technological moat (cloud-native microservices, 52+ OEM
              certifications, open API ecosystem, proprietary AI training data from 2,000+ rooftops) creates durable
              competitive advantages that legacy incumbents cannot easily replicate. The 97% YoY ARR growth rate,
              enterprise anchor customers (Ken Garff, Asbury, GM partnership), and $4B+ valuation from a sophisticated
              growth investor (Dragoneer) all provide third-party validation of the thesis. The primary investment
              risks—CDK cloud rebuild, key-person concentration, cybersecurity exposure—are real but manageable with
              active monitoring. The base case $4.5–6B fair value implies a 1.1–1.5x return on the Series E $4B+
              valuation, which is modest for venture but appropriate for late-stage pre-IPO at this maturity. Investors
              willing to hold through the 2026–2027 IPO window and accept the execution risks should find the
              risk-reward profile attractive. The Sapient Capital and ForEntrepreneurs frameworks for late-stage SaaS
              support the thesis of value creation at this stage. Confidence: Medium-High. Critical data gaps—exact ARR,
              gross margin, EBITDA, and audited financials—prevent a High confidence rating.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
          - type: table
            tableRef: TV005
            claimRefs:
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV005
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
