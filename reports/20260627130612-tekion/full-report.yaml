      - number: '5.4'
        title: Technology Stack and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Tekion's technology stack reflects modern cloud-native practices. The platform runs on AWS as its primary
              cloud provider, with Google Cloud used for specific ML workloads and regional redundancy. StackShare data
              indicates Tekion uses Java and Node.js for backend services, React for frontend applications, and Apache
              Kafka for real-time event streaming across dealership workflows. The microservices architecture enables
              independent scaling of high-load components—for example, service scheduling spikes at month-end without
              affecting financial reporting latency. Tekion's data architecture processes millions of transactions daily
              across its 2,000+ dealer rooftop customer base, requiring significant investment in data pipeline
              reliability and multi-region redundancy. The platform is SOC 2 Type II certified, meeting enterprise
              security requirements for customer financial and personal data handling. GetApp and other software review
              platforms confirm that Tekion's uptime SLA is 99.9% or better, consistent with enterprise cloud standards.
              The company has grown from approximately 100 engineers in 2019 to 1,500+ engineers by 2024, primarily
              based in Bengaluru, India, enabling rapid feature development cadence. The platform's continuous
              deployment model—leveraging its cloud-native architecture—allows for weekly or bi-weekly feature releases,
              compared to quarterly or annual update cycles for legacy DMS platforms. This development velocity is a key
              operational differentiator that incumbents with legacy codebases cannot easily match.
            claimRefs:
              - CE013
              - CE014
