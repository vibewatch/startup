      - number: '3.4'
        title: Competitive Differentiation and Moat Analysis
        blocks:
          - type: paragraph
            body: >-
              Tekion's competitive differentiation rests on four pillars: (1) Cloud-native unified platform—all ARC
              modules share a single database and real-time data model, eliminating the integration overhead present in
              CDK's modular architecture or Cox Automotive's assembled portfolio; (2) OEM-agnostic integrations—Tekion
              is certified with 52+ OEM brands for warranty, parts, and customer data exchange, the minimum requirement
              for franchised dealer adoption; (3) AI-first architecture—Tekion.ai capabilities are natively embedded
              rather than bolted on, enabling predictive inventory, AI customer interactions, and automated deal
              structuring; (4) Open ecosystem—250+ technology partners can integrate via Tekion's APIs, vs. CDK's
              historically closed data access model that generated DOJ antitrust scrutiny.


              Moat durability risks: (1) CDK and Reynolds have the relationships and scale to accelerate cloud
              investment post-breach; (2) Cox Automotive's bundled ecosystem provides an alternative full-stack to
              Tekion's ARC; (3) Tekion's ARR growth rate may moderate as low-hanging CDK/Reynolds post-breach
              displacement opportunities are captured; (4) New entrants like Salesforce Financial Services Cloud could
              commoditize the CRM layer of the DMS stack.
