      - number: '4.4'
        title: Path to Profitability and IPO Trajectory
        blocks:
          - type: paragraph
            body: >-
              Tekion is not yet profitable, with reported operating losses reflecting its aggressive investment in
              engineering talent, OEM integrations, international expansion, and sales infrastructure. The company
              employs 2,500+ staff, with engineering centers in India (Bengaluru) representing a cost advantage for R&D.
              Comparable automotive SaaS companies—CDK Global achieved EBITDA margins of approximately 20–25% at $2B+
              revenue at public scale, while DealerSocket achieved similar margins before its acquisition. This suggests
              Tekion's long-run EBITDA margin potential of 20–30% at scale. At an estimated $200–350M ARR in 2025, the
              company needs to reach approximately $500M–700M ARR to achieve EBITDA breakeven at typical SaaS cost
              structures, based on OpenView Partners SaaS benchmarking data. This implies a 2–3 year runway to
              profitability if current growth rates moderate to 40–60% per year. IPO readiness is contingent on
              demonstrating consistent profitability or clear path to it, with bankers and analysts citing 2026–2027 as
              the earliest plausible window. The company's 2024 Dragoneer round came with no IPO contingency, giving
              management runway to optimize the unit economics before accessing public markets. A key financial risk is
              the concentration of costs in the US: if international expansion into Europe or broader Asia-Pacific
              requires heavy localization spend, it could delay the profitability timeline.
