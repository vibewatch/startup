  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Cybersecurity and Ransomware Risk
        blocks:
          - type: paragraph
            body: >-
              Tekion's cloud-native architecture provides structural security advantages over legacy on-premise DMS
              platforms, but also creates new risk surfaces. The CDK Global ransomware attack in June 2024 demonstrated
              that DMS platforms are critical infrastructure for automotive retail: CDK's outage disrupted 15,000+
              dealer customers for up to 2 weeks, costing the auto retail industry an estimated $1 billion in lost
              transactions. Tekion, as the cloud-based alternative, is an equally high-value target. BlackFog's security
              analysis and CloudSkope's breach research both document DMS platforms as prime ransomware targets given
              their storage of consumer financial data (PII, payment card, SSNs for F&I financing), vehicle transaction
              records, and dealership financial accounts. Tekion's multi-tenant architecture creates the risk of lateral
              movement: a breach of one dealership's data environment could potentially expose other tenants if
              architectural isolation controls are incomplete. The company claims SOC 2 Type II certification and uses
              AWS and Google Cloud security infrastructure. OWASP's Top 10 framework for API security is directly
              applicable to Tekion's 500+ open API endpoints. NIST's Cybersecurity Framework and PCI DSS standards
              govern Tekion's handling of payment card data through Tekion Pay. Despite these controls, no independent
              security audit results are publicly disclosed. The FTC's enforcement action against CDK Global for data
              access practices (2024) signals heightened regulatory scrutiny of DMS data security broadly. Importantly,
              Tekion's broader open API ecosystem—while commercially valuable—creates significantly more exposure than
              CDK's historically closed API model.
            claimRefs:
