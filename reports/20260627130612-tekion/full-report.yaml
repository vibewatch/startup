      - number: '3.2'
        title: 'Primary Competitors: CDK Global and Reynolds & Reynolds'
        blocks:
          - type: paragraph
            body: >-
              CDK Global (headquartered in Hoffman Estates, IL) serves approximately 15,000 US franchised dealerships
              through its CDK Drive DMS. Acquired by Brookfield Business Partners in 2022 for $8.3 billion, CDK carries
              significant debt that constrains capital allocation to platform modernization. The June 2024 ransomware
              attack—widely attributed to BlackSuit ransomware—shut down CDK's systems for 19 days, disrupting vehicle
              sales and service operations across the US with estimated aggregate losses of $600M–$1B. CDK paid a ransom
              reported at approximately $25 million to restore services. The breach materially damaged CDK's brand trust
              and accelerated competitive switching conversations.


              Reynolds & Reynolds (Dayton, OH), privately held, serves approximately 4,000–4,500 US dealerships with its
              ERA-IGNITE platform. Founded in 1866 as a printer of business forms, Reynolds pivoted to automotive
              software in the 1960s and has maintained exceptional dealer loyalty through its white-glove service model
              and deeply embedded workflows. Reynolds' competitive advantage is perceived stability and long-term
              relationships; its weakness is legacy architecture and conservative technology investment relative to
              cloud-native challengers. Reynolds' pricing is typically at parity with CDK, with 5–7 year contract terms
              standard.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP014
