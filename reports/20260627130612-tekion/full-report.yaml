      - number: '4.5'
        title: Revenue Gaps and Financial Disclosure Limitations
        blocks:
          - type: paragraph
            body: >-
              As a private company, Tekion does not file public financial statements, and all revenue and profitability
              estimates are derived from secondary sources, investor commentary, and comparable company analysis. Key
              gaps include: (1) the exact ARR figure has not been publicly disclosed since the 97% growth claim in 2023,
              making 2024–2025 estimates uncertain; (2) gross margin and EBITDA data are entirely estimated based on
              SaaS industry benchmarks; (3) details of capitalization table, preferred share terms, and employee equity
              dilution are not publicly available; (4) cash burn rate and runway have not been disclosed; (5) geographic
              revenue breakdown is unavailable. These gaps are inherent to pre-IPO private company diligence and are
              noted here to calibrate the confidence level of financial projections. The Moneycontrol and TechInAsia
              coverage of the Series E provided limited incremental financial details beyond the headline raise and
              valuation. Independent verification of ARR claims would require access to Series E investor materials or
              audited financials, neither of which is publicly accessible.
