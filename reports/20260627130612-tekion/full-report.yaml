      - number: '1.5'
        title: Competitive Context and Market Position
        blocks:
          - type: paragraph
            body: >
              The US automotive DMS market is dominated by a small number of legacy providers, with CDK Global (a Cox
              Automotive company) and Reynolds and Reynolds holding the majority of dealer rooftops under contract. CDK
              Global serves approximately 15,000+ rooftop customers in North America, representing market leadership
              that Tekion is systematically challenging. Reynolds and Reynolds is another long-standing competitor with
              a significant installed base and dealer relationships built over decades.


              A critical competitive event in June 2024 was the ransomware cyberattack on CDK Global, which disrupted
              thousands of US car dealerships for several weeks and severely impacted dealer operations including sales,
              financing, and service scheduling. This event sharply highlighted the operational risk of legacy,
              on-premises DMS architectures and created both urgency and opportunity for Tekion's cloud-native,
              resilience-by-design alternative. Post-attack, dealer sentiment toward DMS modernization accelerated,
              benefiting Tekion's pipeline and sales momentum.


              Tekion has positioned itself as the modern cloud alternative to legacy DMS, with OEM partnerships (GM,
              Hyundai Motor as investor, Porsche integration) creating structural advantages in dealer adoption. The
              company's 97% YoY ARR growth in 2023 and the $4B valuation reflect growing recognition of Tekion's
              differentiated position. However, conversion from the installed base of CDK and Reynolds customers remains
              a multi-year enterprise sales cycle, and competitive intensity is expected to increase as legacy providers
              accelerate cloud migration efforts.
