      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Tekion's unit economics reflect the profile of a vertical SaaS company at scale-up phase. Gross margins
              for cloud-native DMS are estimated at 55–70%, consistent with benchmarks from KeyBanc Capital Markets SaaS
              surveys, which indicate median gross margins of 73% for vertical SaaS and 65% for companies with higher
              professional services mix. Tekion's gross margin likely sits toward the lower end of this range given the
              complexity of DMS implementations and the significant services component. Estimated customer acquisition
              cost (CAC) for DMS is high due to long enterprise sales cycles, but is mitigated by dealership groups
              (DSOs) who bring multiple rooftops in a single deal. The lifetime value (LTV) is structurally strong: at
              3-year contract minimums, $3,000/month per rooftop, and near-100% gross retention, LTV per rooftop exceeds
              $108,000, implying LTV/CAC ratios above 3:1 even with aggressive sales costs. Operating expenses are
              dominated by R&D (estimated 35–45% of ARR at this stage) and customer success/implementations. The company
              has invested heavily in OEM integrations—covering 52+ brands—which creates ongoing but high-value
              development costs. As Tekion scales, operating leverage should improve: each additional OEM integration
              amortizes across the growing dealer base, and customer success costs per rooftop decrease with product
              maturation. Net revenue retention (NRR) is estimated above 110% based on module expansion, add-on
              adoption, and rooftop count growth within dealer groups.
