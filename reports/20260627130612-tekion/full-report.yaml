      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >-
              The primary buyer persona is the dealer group CFO/COO at mid-size to large franchised dealer groups (5–50
              rooftops), who controls DMS vendor selection and renewal decisions. Individual store operators
              (single-point dealers) typically defer to OEM recommendations or dealer association guidance. Large public
              dealer groups (AutoNation, Penske, Lithia, Asbury, Ken Garff) conduct formal RFPs and negotiate
              enterprise-level pricing over 18–36 month sales cycles. Mid-size private regional groups (10–100 rooftops)
              represent Tekion's primary growth market, with 12–24 month sales cycles and moderate negotiating leverage.


              Cox Automotive's 2025 Digitization Study found that dealers offering full online purchase steps have
              doubled in just two years, reflecting rapid acceleration of digitization across all dealer tiers. AI
              chatbot integration improved dealership customer experience by 57%, per the same study, creating
              additional pull from forward-leaning dealer groups willing to invest in modern platforms. Budget ownership
              for DMS sits at group/corporate IT and finance, not at the individual store manager level—meaning
              enterprise-level procurement processes and multi-year ROI analyses govern purchasing decisions.
              Single-point dealers (the largest population at ~12,000 US rooftops) have the lowest ACV ($30K–$100K),
              longest proportional sales cycles relative to deal size, and strongest dependence on OEM vendor
              recommendations, making them a lower-priority segment for Tekion's current go-to-market motion.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM025
              - CM027
