  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Core Platform Architecture: ARC and AEC'
        blocks:
          - type: paragraph
            body: >-
              Tekion's flagship product, the Automotive Retail Cloud (ARC), is the industry's first cloud-native DMS,
              purpose-built on AWS and Google Cloud infrastructure using a microservices architecture. Unlike legacy DMS
              systems that run on client-server architectures requiring on-premise hardware at each dealership, ARC
              operates entirely in the cloud, delivering real-time data synchronization across all dealership
              departments and remote access without VPN dependencies. The platform was architected from inception with a
              multi-tenant cloud design, enabling Tekion to deploy updates to all customers simultaneously without
              per-site patching cycles—a fundamental differentiation from CDK and Reynolds and Reynolds, which require
              dealer IT staff for system maintenance. The companion platform, Automotive Enterprise Cloud (AEC), extends
              functionality to OEM headquarters level, providing OEMs with real-time visibility into dealer inventory,
              sales performance, customer satisfaction, and compliance metrics across their dealer networks. As of 2026,
              Tekion supports 52+ OEM brands on ARC/AEC, including GM, Ford, BMW, Toyota, and Stellantis brands. The
              platform's open API design exposes 500+ endpoints enabling third-party developers and integration partners
              to build applications on the Tekion data layer, underpinning the 250+ ecosystem partners. This open
              architecture contrasts sharply with CDK's historical closed-API posture that was subject to FTC
              investigation for anti-competitive data access practices.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
