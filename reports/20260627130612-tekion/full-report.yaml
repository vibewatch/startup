      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Primary growth drivers accelerating cloud DMS adoption: (1) Cloud migration tailwind—65% of new DMS
              implementations were cloud-based in 2024 per Emergen Research, up from ~30% in 2020, as legacy on-premise
              systems accumulate technical debt; (2) CDK Global ransomware breach, June 2024—the 19-day outage froze
              operations at 15,000+ dealerships with estimated industry losses of $600M–$1B, catalyzing board-level
              conversations about DMS vendor risk concentration; (3) EV complexity—over 85% of new vehicles sold in 2024
              include connected technologies per NHTSA, requiring modern DMS platforms to handle OTA update
              coordination, specialized service protocols, and battery management workflows; (4) AI-driven
              efficiency—advanced AI DMS users report 23% inventory turnover improvement and 18% customer satisfaction
              increase per Emergen Research; (5) OEM digital retail mandates—GM's selection of Tekion as its EV digital
              retail platform signals an emerging OEM preference for cloud-native DMS partners.


              Primary adoption constraints: (1) Contract lock-in—CDK Global and Reynolds & Reynolds typically require
              5–7 year contracts with financial penalty clauses, limiting annual switching to the ~3,400–4,200
              dealerships whose contracts expire each year; (2) Switching costs—migration from legacy DMS requires 6–12
              months of staff retraining, data migration, and workflow redesign; (3) Thin dealer margins—US dealerships
              average 2–3% pre-tax net profit on new vehicles, limiting technology budgets and requiring ROI
              justification; (4) OEM certification requirements—52+ OEM brands require certified DMS data exchange for
              warranty, parts ordering, and customer data, a qualification barrier Tekion has largely cleared but which
              still constrains new entrants.
            claimRefs:
              - CM002
