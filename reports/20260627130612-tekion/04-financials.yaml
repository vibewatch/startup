company:
  name: Tekion Corp
chapter:
  number: 4
  title: Financials
  summary: Tekion Corp is a high-growth, pre-IPO automotive SaaS company with estimated ARR of $200–350 million in 2025, driven
    by 97% year-over-year ARR growth reported in 2023. The company has raised $640 million across six funding rounds, achieving
    a $4B+ valuation in its July 2024 Series E led by Dragoneer. Its SaaS-native subscription model with per-rooftop pricing
    generates predictable recurring revenue, but the company is not yet profitable as it invests aggressively in product development,
    OEM integrations, and geographic expansion. Capital efficiency appears reasonable for its growth stage, with a gross margin
    structure typical of cloud infrastructure-heavy vertical SaaS (estimated 55–70%). Path to profitability hinges on achieving
    scale across its 16,990-dealer total addressable market while managing R&D and customer success costs.
sections:
- id: SEC-I-01
  title: Revenue Model and ARR Trajectory
  body: Tekion generates revenue primarily through a subscription model based on per-rooftop monthly fees for its Automotive
    Retail Cloud (ARC) platform, which includes the Dealer Management System (DMS), Customer Relationship Management (CRM),
    and ancillary modules. Additional revenue streams include implementation and onboarding fees, professional services, and
    transaction-based fees for payments and financing facilitation through its ecosystem. The company reported 97% year-over-year
    ARR growth in 2023, which—combined with its claimed 2,000+ dealer rooftop base—implies an estimated ARR of $200 million
    to $350 million as of mid-2025. This growth rate far exceeds industry medians for vertical SaaS companies at this scale.
    The SaaS model provides high revenue visibility, with multi-year contracts (typically 3–5 years) typical for DMS platforms.
    Churn is structurally low in DMS because switching costs are extremely high—dealer data migration, staff retraining, and
    OEM recertification create 18–36 month migration timelines. Tekion's per-rooftop pricing is estimated at $2,000–$4,500
    per month, consistent with industry benchmarks for full-suite DMS, CRM, and service lane tools bundled together. This
    pricing may represent a premium over incumbents like CDK Global but is justified by cloud-native capabilities and reduced
    IT infrastructure costs for dealers.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: SEC-I-02
  title: Funding History and Capital Structure
  body: 'Tekion has raised approximately $640 million in total venture funding across six rounds since its 2016 founding,
    with its most recent round being a $200 million Series E in July 2024 led by Dragoneer Investment Group, valuing the company
    at over $4 billion. Earlier rounds include a $250 million Series D in October 2021 that valued the company at $3.5 billion.
    Other investors include General Atlantic, Advent International, Greenoaks Capital, BMW i Ventures, and Hertz. The Series
    E marked a 14% valuation premium over the Series D, reflecting continued execution in a challenging macro environment
    for late-stage venture. The funding composition suggests a mix of growth equity and strategic investors: BMW i Ventures
    and Hertz bring OEM and fleet strategic alignment; Dragoneer, Greenoaks, and General Atlantic represent pure financial
    sponsors. Tekion has reportedly turned down IPO discussions, indicating management''s preference for private growth financing,
    with bankers cited in Automotive News discussions suggesting a potential IPO readiness timeline of 2026–2027. Secondary
    share sales have been reported to provide liquidity for early employees. The company''s capital structure remains private,
    and preferred stock terms are not publicly disclosed, though standard liquidation preferences and anti-dilution provisions
    are presumed based on investor class.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs:
  - TI003
  figureRefs: []
- id: SEC-I-03
  title: Unit Economics and Cost Structure
  body: 'Tekion''s unit economics reflect the profile of a vertical SaaS company at scale-up phase. Gross margins for cloud-native
    DMS are estimated at 55–70%, consistent with benchmarks from KeyBanc Capital Markets SaaS surveys, which indicate median
    gross margins of 73% for vertical SaaS and 65% for companies with higher professional services mix. Tekion''s gross margin
    likely sits toward the lower end of this range given the complexity of DMS implementations and the significant services
    component. Estimated customer acquisition cost (CAC) for DMS is high due to long enterprise sales cycles, but is mitigated
    by dealership groups (DSOs) who bring multiple rooftops in a single deal. The lifetime value (LTV) is structurally strong:
    at 3-year contract minimums, $3,000/month per rooftop, and near-100% gross retention, LTV per rooftop exceeds $108,000,
    implying LTV/CAC ratios above 3:1 even with aggressive sales costs. Operating expenses are dominated by R&D (estimated
    35–45% of ARR at this stage) and customer success/implementations. The company has invested heavily in OEM integrations—covering
    52+ brands—which creates ongoing but high-value development costs. As Tekion scales, operating leverage should improve:
    each additional OEM integration amortizes across the growing dealer base, and customer success costs per rooftop decrease
    with product maturation. Net revenue retention (NRR) is estimated above 110% based on module expansion, add-on adoption,
    and rooftop count growth within dealer groups.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  tableRefs:
  - TI004
  figureRefs:
  - FI002
- id: SEC-I-04
  title: Path to Profitability and IPO Trajectory
  body: 'Tekion is not yet profitable, with reported operating losses reflecting its aggressive investment in engineering
    talent, OEM integrations, international expansion, and sales infrastructure. The company employs 2,500+ staff, with engineering
    centers in India (Bengaluru) representing a cost advantage for R&D. Comparable automotive SaaS companies—CDK Global achieved
    EBITDA margins of approximately 20–25% at $2B+ revenue at public scale, while DealerSocket achieved similar margins before
    its acquisition. This suggests Tekion''s long-run EBITDA margin potential of 20–30% at scale. At an estimated $200–350M
    ARR in 2025, the company needs to reach approximately $500M–700M ARR to achieve EBITDA breakeven at typical SaaS cost
    structures, based on OpenView Partners SaaS benchmarking data. This implies a 2–3 year runway to profitability if current
    growth rates moderate to 40–60% per year. IPO readiness is contingent on demonstrating consistent profitability or clear
    path to it, with bankers and analysts citing 2026–2027 as the earliest plausible window. The company''s 2024 Dragoneer
    round came with no IPO contingency, giving management runway to optimize the unit economics before accessing public markets.
    A key financial risk is the concentration of costs in the US: if international expansion into Europe or broader Asia-Pacific
    requires heavy localization spend, it could delay the profitability timeline.'
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  tableRefs:
  - TI005
  figureRefs:
  - FI003
  - FI004
- id: SEC-I-05
  title: Revenue Gaps and Financial Disclosure Limitations
  body: 'As a private company, Tekion does not file public financial statements, and all revenue and profitability estimates
    are derived from secondary sources, investor commentary, and comparable company analysis. Key gaps include: (1) the exact
    ARR figure has not been publicly disclosed since the 97% growth claim in 2023, making 2024–2025 estimates uncertain; (2)
    gross margin and EBITDA data are entirely estimated based on SaaS industry benchmarks; (3) details of capitalization table,
    preferred share terms, and employee equity dilution are not publicly available; (4) cash burn rate and runway have not
    been disclosed; (5) geographic revenue breakdown is unavailable. These gaps are inherent to pre-IPO private company diligence
    and are noted here to calibrate the confidence level of financial projections. The Moneycontrol and TechInAsia coverage
    of the Series E provided limited incremental financial details beyond the headline raise and valuation. Independent verification
    of ARR claims would require access to Series E investor materials or audited financials, neither of which is publicly
    accessible.'
  claimRefs:
  - CI018
  - CI019
  - CI020
  tableRefs: []
  figureRefs: []
