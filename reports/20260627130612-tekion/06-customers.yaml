company:
  name: Tekion Corp
chapter:
  number: 6
  title: Customers
  summary: Tekion has scaled to 2,000+ dealer rooftops across 52+ OEM brands as of mid-2025, establishing itself as the fastest-growing
    DMS provider in the US market. Key anchor customers include Ken Garff Automotive (170+ dealerships, announced January
    2025), Asbury Automotive Group (Fortune 500, 100+ rooftops in migration), and strategic clients backed by Hertz (an investor).
    Dealers choose Tekion primarily for its cloud-native architecture, EV-readiness, and OEM-certified integrations unavailable
    from legacy providers. Customer satisfaction scores on review platforms are high for usability and uptime but moderate
    for implementation complexity—consistent with enterprise DMS migrations generally. Net revenue retention appears strong
    based on module expansion patterns. Adverse signals include the high implementation burden for large dealer groups and
    a small number of documented migration challenges. The customer base is concentrated in the US, with limited international
    references.
sections:
- id: SEC-U-01
  title: Customer Base Overview and Scale
  body: 'Tekion has grown from zero to 2,000+ dealer rooftops since its 2018 commercial launch, making it the fastest-scaling
    DMS provider in the US market. The company serves dealers across 52+ OEM brands, with customer coverage spanning independent
    dealers, single-point dealers, and large publicly traded dealer groups. Tekion''s customer base skews toward progressive,
    technology-forward dealers and dealer groups investing in digital retailing capabilities. The 2,000+ rooftop milestone,
    disclosed by Tekion in its 2024 Series E context, represents approximately 12% penetration of the 16,990 US rooftop market
    per NADA data. This implies a large growth runway: 88% of US dealers are yet to adopt Tekion. The CBInsights automotive
    dealership technology trends report (2024) confirms strong interest in cloud-native DMS among dealers seeking CDK alternatives
    post-breach. CoxAutomotive''s 2025 Digitization of Automotive Retail report similarly validates that digital-first DMS
    tools are the top operational technology priority for US dealers. The distribution of Tekion''s rooftop count skews toward
    multi-brand dealer groups rather than single-OEM point dealers, because large groups benefit most from Tekion''s unified
    multi-OEM data model.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: SEC-U-02
  title: Anchor Customer Case Studies
  body: 'Ken Garff Automotive Group, with 170+ dealerships across 13 states, announced in January 2025 that it selected Tekion
    to ''create the best customer experiences'' across its multi-brand portfolio. This is Tekion''s largest disclosed public
    customer win and was announced jointly by Tekion and Ken Garff on BusinessWire, with Automotive News and DigitalDealer
    providing editorial coverage. The selection underscores the appeal to multi-OEM dealer groups: Ken Garff carries Toyota,
    Honda, Ford, Chevrolet, Hyundai, and other brands—all requiring OEM-certified DMS integrations that Tekion provides from
    a single platform. Asbury Automotive Group (NYSE: ABG), a Fortune 500 automotive retailer with 200+ dealerships, is also
    in migration to Tekion per DigitalDealer reporting. Asbury''s migration has been noted as complex and multi-year, reflecting
    the reality of large-group DMS transitions. Hertz Global Holdings, an investor in Tekion, is a commercial customer for
    Tekion''s fleet management and vehicle remarketing tools. The GM EV digital retail tool partnership (Tekion-built ''Ultifi'')
    means all GM EV dealers using Ultifi are de facto Tekion DMS users for EV transactions, representing a channel that bypasses
    the traditional DMS sales process. These anchor customers provide credibility signaling to mid-market dealer groups evaluating
    Tekion.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU003
  figureRefs:
  - FU002
- id: SEC-U-03
  title: Customer Satisfaction and Net Retention
  body: 'Customer feedback for Tekion is broadly positive on product capability and cloud performance, with primary negative
    feedback concentrated on implementation complexity and transition costs. GetApp reviews (from ch5 research) rate Tekion
    highly on features and uptime; AutoDealerToday and CarsalesUSA review pages confirm generally positive dealer sentiment
    on the platform''s usability relative to CDK. CarSalesUSA notes that Tekion''s service lane and CRM tools are rated more
    highly than its predecessor''s (CDK/Reynolds) by dealers who have completed migration. Tekion''s testimonials page cites
    specific dealer testimonials from multiple OEM brands. The Activant analysis (a dealer tech consultancy) notes that Tekion
    customers report high satisfaction with real-time data access and OEM integration breadth, but cite the migration period
    (typically 6–18 months for a dealer group) as the primary pain point. Net revenue retention is estimated above 110% based
    on the expansion pattern: dealers typically start with core DMS and add Tekion Pay, CRM, and service lane modules sequentially,
    driving NRR above 100%. The Samsons Automotive case (a regional dealer group), cited in Samsons press materials, describes
    a smooth migration with high satisfaction. Negative signals include documentation of Asbury Automotive''s multi-year migration
    complexity, which may create hesitation among other large groups evaluating Tekion.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: SEC-U-04
  title: Customer Acquisition and Switching Costs
  body: 'Tekion''s customer acquisition model targets dealer groups with consultative enterprise sales, where a single win
    can bring 5–200+ rooftops simultaneously. The company''s top-of-funnel acquisition benefited significantly from the CDK
    Global ransomware attack in June 2024: the incident disrupted operations at 15,000+ CDK dealer customers for up to 2 weeks,
    creating acute urgency for cloud-native DMS alternatives. Industry analysts cited by Automotive News noted increased Tekion
    pipeline activity in Q3–Q4 2024 following the CDK breach, as dealers sought to diversify DMS risk. Switching costs for
    dealers on Tekion are extremely high: DMS data migration involves financial records, customer databases, vehicle history,
    parts catalogs, and service histories—typically requiring professional data migration services and 6–18 months of parallel
    running or phased switchover. This creates a natural lock-in once Tekion is installed. CoxAutomotive''s 2025 digitization
    report notes that only 8% of US dealers switched DMS providers in 2024, underscoring the structural stickiness of DMS
    relationships. Tekion''s OEM certification model also creates a pull factor: OEMs sometimes recommend or require specific
    DMS certifications, and Tekion''s growing OEM partnership roster creates OEM-side incentives for dealer adoption.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  tableRefs:
  - TU005
  figureRefs: []
- id: SEC-U-05
  title: Customer Concentration and Adverse Signals
  body: 'Tekion''s customer base shows some concentration risks. The top 10 disclosed dealer group customers likely represent
    a significant share of total ARR given the per-rooftop pricing model and the size of groups like Ken Garff (170+ rooftops)
    and Asbury (200+ rooftops). If either of these large anchor customers were to terminate their Tekion contract (e.g., due
    to a failed migration or competitive win-back by CDK/Reynolds), it could reduce ARR by 3–8% per group. The current customer
    base is almost entirely US-based, reflecting Tekion''s domestic market focus; international dealer customers are not disclosed,
    limiting geographic diversification. Implementation challenges remain an adverse signal: AutoDealerToday has documented
    that some early Tekion customers experienced service disruptions during migration periods, and GetApp reviews note that
    customer support response times during implementation are slower than post-implementation. Furthermore, Tekion''s customer
    base is not yet large enough to have undergone a full DMS replacement cycle (5–7 year contract terms), so long-term renewal
    behavior at scale has not been tested. The Hertz relationship, while strategically valuable, represents fleet and remarketing
    tools rather than a traditional franchise dealer implementation, limiting its comparability to the core use case.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  tableRefs: []
  figureRefs:
  - FU004
