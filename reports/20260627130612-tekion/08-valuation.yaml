company:
  name: Tekion Corp
chapter:
  number: 8
  title: Valuation
  summary: 'Tekion Corp''s $4B+ valuation from its July 2024 Dragoneer-led Series E implies a forward EV/ARR multiple of approximately
    13–20x on estimated 2025 ARR of $280–400M. This premium over public vertical SaaS comps (median ~8–12x NTM ARR) is justified
    by Tekion''s 97% reported YoY ARR growth rate, cloud-native architectural moat, 52+ OEM integrations, and early enterprise
    wins at Ken Garff and Asbury. Our base case assigns an estimated fair value range of $4.5–6B at exit for a 2026–2027 IPO
    window based on 12–15x projected 2026 ARR of $380–480M. The bull case ($6–8B) requires sustained 50%+ growth and multiple
    expansion from AI monetization. The bear case ($2.5–3.5B) reflects growth deceleration below 30%, CDK cloud rebuild success,
    or sustained high interest rates compressing multiples. Recommendation: Cautious Buy with follow-on diligence on audited
    financials and CDK competitive response.'
sections:
- id: SEC-V-01
  title: Current Valuation and Comparable Analysis
  body: 'Tekion Corp''s most recent valuation anchor is its July 2024 Series E at $4B+ post-money valuation, led by Dragoneer
    Investment Group with $200M raised. This valuation implies an EV/ARR multiple of approximately 13–20x on estimated 2024
    ARR of $200–300M (midpoint: ~16x on $250M). For context, public vertical SaaS companies trade at median NTM EV/ARR of
    8–12x as of 2025 per a16z SaaS market data and KeyBanc SaaS survey benchmarks. The premium over public comps is driven
    by Tekion''s superior growth rate (97% YoY ARR in 2023 vs. vertical SaaS median ~15–25% at comparable scale) and private
    market illiquidity discount expectations at exit. Comparable public companies include: Veeva Systems (life sciences vertical
    SaaS, ~$30B market cap, ~10x NTM ARR), Tyler Technologies (government vertical SaaS, ~$20B market cap, ~9x NTM ARR), and
    ServiceTitan (home services vertical SaaS, recently public at ~$9B market cap). CDK Global, as the direct automotive DMS
    comparable, was acquired by Brookfield at ~$8.3B in 2022 on $1.8B revenue (~4.6x revenue), though CDK was mature/slow-growing
    at that point. Macrotrends historical data and Yahoo Finance show Veeva''s peak EV/ARR multiple of 20–30x at 40%+ growth,
    suggesting Tekion''s current pricing is reasonable for its stage and trajectory. Morningstar provides public comp benchmarking
    for vertical SaaS sector multiples.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  tableRefs:
  - TV001
  - TV002
  figureRefs:
