companyProfile:
  summary: Tekion Corp, founded in 2016 by former Tesla CIO Jay Vijayan, is building the automotive industry's first cloud-native
    dealer management system (DMS), replacing incumbent platforms from CDK Global and Reynolds & Reynolds. The company's Automotive
    Retail Cloud (ARC) serves 2,000+ dealer rooftops across 52+ OEM brands with a microservices SaaS architecture, open API
    ecosystem, and integrated AI features including Tekion Pay for F&I optimization.
  foundedDate: '2016-01-01'
