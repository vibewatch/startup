  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争概览与市场结构
        blocks:
          - type: paragraph
            body: >-
              美国经销商管理系统市场是一个根深蒂固的寡头市场，由两家既有供应商锚定，合计经销商触达率超过 90%：CDK Global 和 Reynolds & Reynolds。这一双寡头格局已持续四十多年，靠长期合同、深度
              OEM 集成，以及 DMS 工作流嵌入经销商运营来维持。Tekion 的竞争位置是云原生挑战者，用统一、API 优先的平台冲击既有格局。


              2024 年 6 月 CDK Global 勒索软件攻击是一个分水岭式竞争事件：影响 15,000+ 家经销商的 19 天停摆，迫使经销商集团重新评估供应商风险集中，加快了包括 Tekion 和
              DealerSocket 在内替代方案的竞争评估管线。CDK Global 的杠杆资本结构（Brookfield 2022 年以 $8.3B 收购）限制了 R&D 投资能力；Reynolds & Reynolds
              为私有公司且管理保守，推出云原生替代方案的速度偏慢。这种既有厂商结构性脆弱点，是 Tekion 进入市场的主要楔子。
