    title: 公司概览
    sections:
      - number: '1.1'
        title: 创立与身份
        blocks:
          - type: paragraph
            body: >
              Tekion Corp 由 Jay Vijayan 和 Guru Sankararaman 于 2016 年在加州 Pleasanton 创立。Jay Vijayan 曾任 Tesla, Inc.
              首席信息官（CIO），直接向 CEO Elon Musk 汇报，主导 Tesla 企业信息系统转型。Vijayan 看到传统汽车经销商管理系统（DMS）与现代云软件之间存在巨大技术断层，因而离开
              Tesla，为汽车零售行业打造一套完全云原生的平台。


              公司的旗舰产品 Automotive Retail Cloud（ARC）于 2020 年 2 月上线，是首个服务整个汽车零售生态的全栈集成云原生平台。CDK Global、Reynolds and
              Reynolds 等传统 DMS 供应商依赖 1990 年代形成的本地部署客户端-服务器架构；Tekion 的 ARC 则 API 优先、模块化，并构建在现代云基础设施之上。架构优势让 ARC 能够实时接入
              OEM 工厂系统、消费者数字零售工具和第三方生态伙伴。


              Tekion 总部位于加州 Pleasanton，亚太总部设在印度 Bengaluru，并在 Chennai 设有区域中心。公司还在英国、加拿大、德国和法国设有办公室，显示出覆盖国际汽车零售市场的野心。截至
              2024 年中，Tekion 员工超过 2,500 人，平台已集成 52+ 个汽车品牌，包括 General Motors、Ford、Honda、Hyundai、Toyota、Porsche
              等。公司目前处于成长阶段，并在 2020 年 10 月 Series C 融资时成为独角兽。
