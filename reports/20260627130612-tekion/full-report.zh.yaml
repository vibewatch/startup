      - number: '8.2'
        title: 乐观情形估值（$6–8B）
        blocks:
          - type: paragraph
            body: >-
              Tekion 乐观情形假设：（1）ARR 增长到 2026 年仍能维持每年 50%+，到 2026 年底达到 $500M+ ARR；（2）Tekion 以溢价变现 AI 功能，Tekion
              Intelligence 可按每个门店带来 15–20% ARPU 提升；（3）公司到 2026 年扩张至 3,500+ 个美国门店，拿下约 20%
              美国经销商市场；（4）向英国、德国或澳大利亚（BMW/Toyota 网络）的国际扩张带来增量 ARR；（5）利率下降推动 SaaS 倍数恢复至 15–18x NTM ARR。在这些条件下，若 2026–2027
              年 IPO 按 2027 年预计 ARR $700M 的 15x 定价，IPO 估值将达到 $10.5B+，当前 NPV 为 $6–8B。这一乐观情形需要持续执行、CDK
              云端不出现重大竞争反击，并且资本市场环境有利。ForEntrepreneurs SaaS 指标框架支持这一判断：50%+ 增长且 NRR 强的公司，IPO 时可获得溢价倍数。a16z SaaS
              基准显示，市场渗透率超过 20%、且拥有强 OEM 认证护城河的垂直 SaaS 公司，历史上实现过溢价退出倍数。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
