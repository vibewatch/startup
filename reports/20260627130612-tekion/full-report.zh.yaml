      - number: '5.2'
        title: AI 与机器学习能力
        blocks:
          - type: paragraph
            body: >-
              Tekion 已在嵌入 ARC 平台各处的 AI/ML 能力上投入大量资源。核心 AI 功能包括 Tekion Pay——一套集成支付和融资工作流，使用机器学习基于客户画像、购买历史和实时贷款方利率数据优化
              F&I 产品呈现；服务部门的 AI 零件推荐，可减少零件过时并提高首次修复率；预测性库存管理，利用历史销售数据、OEM 按单生产时间线和区域需求信号优化库存水平；以及生成式 AI
              客户沟通工具，用于服务预约排期、后续消息和数字零售工作流。公司的专有数据集覆盖 2,000+ 个网点、52+ 个 OEM 品牌和数百万笔客户交易，形成竞争对手在非云原生部署下难以复制的独特训练语料。IBM
              已发表关于汽车云 AI 应用的研究，与 Tekion 用多模态数据（交易日志、服务记录、客户互动）规模化训练模型的路径一致。Tekion 将 AI 能力以 Tekion Intelligence
              品牌营销，但具体模型架构和基准性能数据未公开披露。AI 工具与 F&I 工作流的集成尤其重要，因为 F&I 产品（保修、GAP 保险、服务合同）在每辆售出车辆中代表 $2,800–$4,200 的经销商毛利。
