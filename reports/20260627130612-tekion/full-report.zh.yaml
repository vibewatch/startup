      - number: '7.2'
        title: 关键人物与人才集中风险
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Jay Vijayan 是 Tekion 最重要的个人。他建立了 Tekion 的原始愿景，招募创始团队，也是主要 OEM 和投资方关系的核心持有人。他曾任 Tesla Global
              CIO，这段经历构成 Tekion 技术差异化和市场可信度的核心叙事。Jay Vijayan 若离职、失去履职能力或被重大事务分心，将实质影响投资者信心、OEM 关系和员工士气。公司未公开披露任何继任计划或联席
              CEO 架构，放大了关键人物风险。CEO 之外，Tekion 的技术人才集中在印度 Bengaluru，估计占工程团队
              60–70%。这带来地缘政治和运营风险：美国—印度技术出口限制、签证政策变化或区域性扰动，都可能影响开发速度。Bengaluru 科技人才市场竞争激烈，Tekion 要与
              Amazon、Google、Infosys 和 Wipro 竞争，人才留存构成成本和运营风险。公司处于 IPO 前阶段，相比已上市竞争对手，股权激励吸引力有限。美国 /
              印度双地运营还增加了人力资源法律合规复杂度，包括 DOL FMLA 与雇佣标准。次一级关键人物风险在 OEM 关系经理和合作伙伴集成工程师：Tekion 的 52+ 项 OEM
              认证需要专业谈判和技术知识，这些能力嵌在一个小团队里。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
