      - number: '5.4'
        title: 技术栈与基础设施
        blocks:
          - type: paragraph
            body: >-
              Tekion 的技术栈体现现代云原生实践。平台以 AWS 为主要云提供商，并使用 Google Cloud 处理特定 ML 工作负载和区域冗余。StackShare 数据显示，Tekion 后端服务使用 Java
              和 Node.js，前端应用使用 React，并用 Apache Kafka 在经销商工作流中进行实时事件流处理。微服务架构允许高负载组件独立扩展，例如月末服务排期激增，而不会影响财务报告延迟。Tekion
              的数据架构每天处理其 2,000+ 个经销商网点客户基础上的数百万笔交易，因此需要在数据管道可靠性和多区域冗余上投入大量资源。平台获得 SOC 2 Type II
              认证，满足客户金融和个人数据处理的企业安全要求。GetApp 和其他软件评论平台确认，Tekion 正常运行时间 SLA 为 99.9% 或更高，符合企业云标准。公司工程师从 2019 年约 100 人增至
              2024 年 1,500+ 人，主要位于印度 Bengaluru，支撑快速功能开发节奏。平台借助云原生架构采用持续部署模式，可每周或每两周发布功能；传统 DMS
              平台通常按季度或年度更新。这种开发速度是既有厂商凭传统代码库难以复制的关键运营差异点。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
