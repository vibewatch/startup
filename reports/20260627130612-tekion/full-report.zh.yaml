      - number: '4.4'
        title: 盈利路径与 IPO 轨迹
        blocks:
          - type: paragraph
            body: >-
              Tekion 尚未盈利，报告中的运营亏损反映其对工程人才、OEM 集成、国际扩张和销售基础设施的激进投入。公司员工超过 2,500 人，印度 Bengaluru 的工程中心为 R&D 带来成本优势。可比汽车
              SaaS 公司显示，CDK Global 在公开市场规模达到 $2B+ 收入时 EBITDA 利润率约 20–25%，DealerSocket 被收购前也达到类似水平。这意味着 Tekion 长期规模化后的
              EBITDA 利润率潜力为 20–30%。按 2025 年估计 ARR $200–350M 计算，基于 OpenView Partners SaaS 基准数据，公司需要达到约 $500M–700M
              ARR，才能在典型 SaaS 成本结构下实现 EBITDA 盈亏平衡。如果当前增速放缓至每年 40–60%，这意味着距离盈利还有 2–3 年跑道。IPO
              就绪取决于公司能否证明持续盈利或清晰的盈利路径；投行人士和分析师认为 2026–2027 年是最早合理窗口。公司 2024 年 Dragoneer 融资没有附带 IPO
              条件，给管理层留下进入公开市场前优化单位经济的时间。一个关键财务风险是成本集中在美国：如果向欧洲或更广泛亚太地区扩张需要高额本地化支出，盈利时间线可能被推迟。
