      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >
              Jay Vijayan 担任 Tekion 创始人兼 CEO。他在 Tesla 积累了深厚的企业技术领导经验，曾搭建并扩展 Tesla 全球 IT 基础设施，随后于 2016 年离职创办 Tekion。Guru
              Sankararaman 被列为公司联合创始人。2024 年 7 月 Dragoneer 融资前后，Tekion
              大幅扩充高管团队，引入有经验的运营管理者担任首席财务官（CFO）、首席营收官（CRO）和首席技术官（CTO），显示公司正在从工程驱动的创业公司，转向规模化 SaaS 企业。


              Tekion 董事会和投资人基础为公司提供了强治理监督和战略指引。核心投资方包括 Dragoneer Investment Group（2024 年 7 月最近一轮领投方）、Advent
              International（Series C 领投方）、Alkeon Capital Management、Durable Capital Partners 和 Hyundai Motor
              Company。Hyundai Motor Company 同时是投资方和 OEM 集成伙伴，战略意义突出，使产品路线图与客户需求更一致。Exor N.V.（Ferrari/Stellantis
              控股公司）也参与了 Series C，为公司增加了欧洲 OEM 触点。


              Jay Vijayan 是公司公共形象和主要发言人，Tekion 因此存在关键人物依赖风险。Vijayan 在媒体上高度可见，经常被引用，几乎出现在所有重要融资公告和产品发布中。创始人 CEO
              的信誉集中在单一个人身上，带来接班风险；考虑到汽车 DMS 市场竞争激烈，且公司仍处于早期收入披露惯例阶段，投资人应持续跟踪。
