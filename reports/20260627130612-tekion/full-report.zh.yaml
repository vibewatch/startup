  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值与可比分析
        blocks:
          - type: paragraph
            body: >-
              Tekion Corp 最近的估值锚点是 2024 年 7 月 Series E，投后估值 $4B+，由 Dragoneer Investment Group 领投，融资 $200M。按估计 2024 年 ARR
              $200–300M 计算，这一估值隐含 EV/ARR 约 13–20x（中点：按 $250M 约 16x）。作为背景，a16z SaaS 市场数据和 KeyBanc SaaS 调查基准显示，截至 2025
              年，上市垂直 SaaS 公司交易在 NTM EV/ARR 中位数 8–12x。相较上市可比公司的溢价，来自 Tekion 更高的增长率（2023 年 ARR 同比增长 97%，而同等规模垂直 SaaS 中位数约
              15–25%），以及退出时对私募市场流动性折价的预期。可比上市公司包括：Veeva Systems（生命科学垂直 SaaS，市值约 $30B，约 10x NTM ARR）、Tyler
              Technologies（政府垂直 SaaS，市值约 $20B，约 9x NTM ARR）和 ServiceTitan（家政服务垂直 SaaS，近期上市，市值约 $9B）。作为直接汽车 DMS 可比公司，CDK
              Global 2022 年被 Brookfield 以约 $8.3B 收购，当时收入 $1.8B（约 4.6x 收入），但 CDK 当时已成熟且增长缓慢。Macrotrends 历史数据和 Yahoo
              Finance 显示，Veeva 在 40%+ 增长时 EV/ARR 峰值倍数为 20–30x，说明 Tekion 当前定价对其阶段和轨迹而言合理。Morningstar 为垂直 SaaS
              板块倍数提供了上市可比基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
