      - number: '6.3'
        title: 客户满意度与净留存
        blocks:
          - type: paragraph
            body: >-
              Tekion 的客户反馈整体偏正面，主要认可产品能力和云端性能；负面反馈集中在实施复杂度和切换成本。第五章研究引用的 GetApp 评价给了 Tekion
              较高的功能和正常运行时间评分；AutoDealerToday 与 CarsalesUSA 的评论页面也印证，经销商普遍认为该平台相较 CDK 更好用。CarSalesUSA 指出，完成迁移的经销商对 Tekion
              服务车道和 CRM 工具的评价，高于此前使用的 CDK/Reynolds。Tekion 的客户证言页面列出了来自多个 OEM 品牌经销商的具体评价。经销商技术咨询公司 Activant 的分析称，Tekion
              客户对实时数据访问和 OEM 集成广度满意度较高，但迁移期是主要痛点；经销商集团通常需要 6–18 个月完成迁移。净收入留存率估计超过 110%，依据是扩展模式：经销商通常先上核心 DMS，再逐步加购
              Tekion Pay、CRM 和服务车道模块，推动 NRR 高于 100%。Samsons Automotive 是一家区域经销商集团，其新闻材料引用的案例称迁移顺利且满意度高。负面信号包括 Asbury
              Automotive 多年迁移复杂度已有记录，这可能让其他评估 Tekion 的大型集团犹豫。
