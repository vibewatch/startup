      - number: '3.2'
        title: 主要竞争对手：CDK Global 和 Reynolds & Reynolds
        blocks:
          - type: paragraph
            body: >-
              CDK Global（总部位于 IL Hoffman Estates）通过 CDK Drive DMS 服务约 15,000 家美国特许经销商。Brookfield Business Partners 于
              2022 年以 $8.3B 收购 CDK 后，公司背负大量债务，限制了投向平台现代化的资本配置。2024 年 6 月勒索软件攻击——广泛归因于 BlackSuit ransomware——让 CDK 系统关闭
              19 天，扰乱全美车辆销售和服务运营，估计合计损失 $600M–$1B。据报道，CDK 支付约 $25M 赎金以恢复服务。此次入侵实质性损害了 CDK 的品牌信任，并加速了客户讨论切换竞争方案。


              Reynolds & Reynolds（OH Dayton）为私有公司，通过 ERA-IGNITE 平台服务约 4,000–4,500 家美国经销商。公司 1866 年以商业表格印刷商起家，1960
              年代转向汽车软件，并依靠白手套服务模式和深度嵌入的工作流维持了极强的经销商忠诚度。Reynolds 的竞争优势是被感知为稳定、关系长期；弱点是传统架构，以及相对云原生挑战者更保守的技术投入。Reynolds
              定价通常与 CDK 持平，标准合同期限为 5–7 年。
