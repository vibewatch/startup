              - CR007
              - CR008
      - number: '7.3'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              Tekion 的竞争位置面临多方风险。CDK Global 经历攻击后，正因声誉修复需要而加速重建云迁移战略；一旦 CDK 成功现代化，Tekion 的核心架构优势会被削弱，CDK 还可借助其与 10,000+
              家经销商的既有关系。Reynolds and Reynolds 的 ERA 平台虽属传统系统，但经销商忠诚度深，且 Reynolds 为私人所有（R.L. Polk
              家族），不承受季度盈利压力，不必为削减成本牺牲服务质量。DealerSocket（被 Reynolds 收购）和 Dealertrack（Cox）也在投入云迁移。现有厂商之外，Salesforce
              Automotive Cloud 正从强大的企业软件位置出发，构建 AI 优先的 DMS 能力。硅谷新进入者（风投资助）也可能试图复制 Tekion 的绿地打法。FTC 因反竞争数据访问实践对 CDK
              执法，是一把双刃剑：一方面带来竞争机会，CDK 经销商会寻找替代方案；另一方面也表明 FTC 正主动监测 DMS 市场动态，Tekion 若成为主导云端 DMS，其自身数据实践可能面临监管风险。Emergen
              Research 预测 DMS 市场到 2032 年达到 $6.8B、CAGR 为 14.5%，验证了市场增长，也说明市场足够大，会吸引更多资金充裕的竞争者。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
