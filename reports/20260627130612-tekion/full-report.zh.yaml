      - number: '6.5'
        title: 客户集中度与负面信号
        blocks:
          - type: paragraph
            body: >-
              Tekion 客户群存在一定集中度风险。按单门店定价模型和 Ken Garff（170+ 个门店）、Asbury（200+ 个门店）这类集团规模估算，披露的前 10 大经销商集团客户很可能贡献了相当比例的总
              ARR。若这类大型锚定客户终止 Tekion 合同，例如迁移失败或被 CDK/Reynolds 竞争性赢回，单个集团可能让 ARR 减少 3–8%。当前客户群几乎全部在美国，反映出 Tekion
              聚焦本土市场；国际经销商客户未披露，地理分散度有限。实施挑战仍是负面信号：AutoDealerToday 记录了部分早期 Tekion 客户在迁移期遭遇服务中断；GetApp
              评论也提到，实施期间客户支持响应速度慢于实施完成后。Tekion 的客户群尚未经历完整 DMS 更换周期（合同期限 5–7 年），因此长期大规模续约行为仍未得到验证。Hertz
              关系具备战略价值，但它代表车队和再营销工具，而非传统加盟经销商实施，可比性有限。
