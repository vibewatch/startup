      - number: '1.5'
        title: 竞争背景与市场位置
        blocks:
          - type: paragraph
            body: >
              美国汽车 DMS 市场由少数传统供应商主导，CDK Global（一家 Cox Automotive 公司）和 Reynolds and Reynolds 掌握了大多数已签约经销商网点。CDK Global
              在北美服务约 15,000+ 个网点客户，是市场领导者，也是 Tekion 正在系统性挑战的对象。Reynolds and Reynolds 则是另一家老牌竞争者，拥有显著装机基础和数十年积累的经销商关系。


              2024 年 6 月，CDK Global 遭遇勒索软件网络攻击，这是一个关键竞争事件。攻击让数千家美国汽车经销商停摆数周，严重影响销售、融资和服务排期等经销商运营。该事件尖锐暴露出传统本地部署 DMS
              架构的运营风险，也为 Tekion 这种云原生、韧性内置的替代方案制造了紧迫感和机会。攻击之后，经销商对 DMS 现代化的情绪加速升温，利好 Tekion 的管线和销售动能。


              Tekion 将自己定位为传统 DMS 的现代云替代品，并凭借 OEM 合作（GM、投资方 Hyundai Motor、Porsche 集成）在经销商采用上形成结构性优势。公司 2023 年 ARR 同比增长
              97%，估值达到 $4B，反映市场越来越认可 Tekion 的差异化位置。不过，从 CDK 和 Reynolds 客户装机基础中转化客户，仍是一个多年企业销售周期；随着传统供应商加快云迁移，竞争强度预计会上升。
