  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础概览与规模
        blocks:
          - type: paragraph
            body: >-
              Tekion 自 2018 年商业化发布以来，从零增长到 2,000+ 个经销商网点，成为美国市场扩张最快的 DMS 供应商。公司服务覆盖 52+ 个 OEM
              品牌，客户范围包括独立经销商、单店经销商和大型上市经销商集团。Tekion 客户基础偏向进取、技术前瞻型经销商和经销商集团，它们愿意投资数字零售能力。Tekion 在 2024 年 Series E 背景中披露
              2,000+ 个网点里程碑，按 NADA 数据，对应 16,990 个美国网点市场约 12% 渗透率。这意味着增长跑道仍大：88% 的美国经销商尚未采用 Tekion。CBInsights
              汽车经销商技术趋势报告（2024）确认，在入侵事件后，寻求 CDK 替代方案的经销商对云原生 DMS 兴趣强劲。CoxAutomotive 2025 Digitization of Automotive
              Retail 报告同样验证，数字优先 DMS 工具是美国经销商最优先的运营技术事项。Tekion 网点数量更多来自多品牌经销商集团，而非单一 OEM 单店经销商，因为大型集团最能受益于 Tekion 统一的多
              OEM 数据模型。
