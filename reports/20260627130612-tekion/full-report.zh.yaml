      - number: '4.5'
        title: 收入缺口与财务披露限制
        blocks:
          - type: paragraph
            body: >-
              作为私营公司，Tekion 不提交公开财务报表，所有收入和盈利能力估算都来自二手资料、投资人评论和可比公司分析。关键缺口包括：（1）自 2023 年 97% 增长声明以来，准确 ARR 数字未公开披露，使
              2024–2025 年估算存在不确定性；（2）毛利率和 EBITDA 数据完全基于 SaaS
              行业基准估算；（3）资本化表、优先股条款和员工股权稀释细节无法公开获得；（4）现金消耗率和跑道未披露；（5）地理收入拆分不可得。这些缺口是 IPO
              前私营公司尽调的内在限制，列于此处用于校准财务预测的置信水平。Moneycontrol 和 TechInAsia 对 Series E 的报道除融资额和估值标题外，提供的增量财务细节有限。要独立验证 ARR
              声明，需要获得 Series E 投资人材料或经审计财务数据，而两者均无法公开获取。
