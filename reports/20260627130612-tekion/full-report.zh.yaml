              - CR013
      - number: '7.4'
        title: 监管、隐私与法律风险
        blocks:
          - type: paragraph
            body: >-
              Tekion 的数据平台处理高度敏感的消费者和经销商财务数据，因此监管暴露显著。主要监管风险包括：加州经销商数据的 CCPA/CPRA 合规（加州有 3,000+ 个门店，约占美国市场
              18%）；任何欧洲经销商扩张带来的 GDPR 暴露；FTC 汽车数据共享执法（2024 年 FTC 针对 CDK Global 数据访问实践的行动，为所有 DMS 供应商建立了先例框架）；Tekion Pay
              支付处理的 PCI DSS 合规；F&I 工作流中保险和融资数据带来的 HIPAA 邻近义务；以及若 Tekion 市占率达到触发美国反垄断法下垄断力量担忧的水平，可能面临反垄断审查。FTC 关于 CDK
              数据共享的 2024 年新闻稿是里程碑式先例：它确立了 DMS 供应商不能利用市场力量阻断第三方数据访问的原则，Tekion 自身 API 生态扩张时也受这一原则约束。国际市场的数据本地化要求（EU GDPR
              Article 44、India DPDP Act）会增加 Tekion 国际扩张合规成本。HHS HIPAA 规则与 Tekion 为 F&I 交易处理的消费者金融数据存在交叉；Tekion
              技术上并非受监管实体，但 F&I 数据包含健康邻近信息，形成合规灰区。govinfo.gov 发布的 FTC-CDK 命令为 DMS 行业提供了监管框架参照。
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
