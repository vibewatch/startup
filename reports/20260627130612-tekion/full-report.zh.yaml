      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >-
              主要买方画像是中大型特许经销商集团（5–50 个网点）的 CFO/COO，他们掌握 DMS 供应商选择和续约决策。单店运营者（single-point dealers）通常听从 OEM
              推荐或经销商协会指引。大型上市经销商集团（AutoNation、Penske、Lithia、Asbury、Ken Garff）会进行正式 RFP，并在 18–36
              个月销售周期中谈判企业级价格。中型民营区域集团（10–100 个网点）是 Tekion 的主要增长市场，销售周期为 12–24 个月，谈判杠杆中等。


              Cox Automotive 的 2025 Digitization Study 发现，提供完整线上购车步骤的经销商在短短两年内翻倍，反映所有经销商层级都在加速数字化。该研究还显示，AI
              聊天机器人集成让经销商客户体验提升 57%，进一步拉动愿意投资现代平台的前沿经销商集团。DMS 预算归集团 / 公司 IT 和财务所有，而非单店经理；因此，企业级采购流程和多年 ROI
              分析决定购买。单店经销商（约 12,000 个美国网点，是最大群体）ACV 最低（$30K–$100K），相对于交易规模销售周期最长，且最依赖 OEM 供应商推荐，因此在 Tekion
              当前市场进入动作中优先级较低。
