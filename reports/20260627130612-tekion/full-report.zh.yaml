  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              经销商管理系统（DMS）市场涵盖编排特许和独立汽车经销商核心运营的企业软件平台：车辆库存管理、客户关系管理（CRM）、金融与保险（F&I）处理、服务与零部件排期，以及监管合规。Tekion 主要竞争于云原生
              DMS 细分市场，正在美国特许经销商 2023 年由 NADA 报告的 $1.3T 收入基础上，替代运行数十年的本地部署平台（CDK Drive、Reynolds ERA、DealerSocket）。


              截至 2024 年，纸质流程、电子表格混合方案和第一代 Windows 时代 DMS 等现状替代方案，仍存在于约 35–40% 的美国经销商中。Tekion 的 Automotive Enterprise
              Cloud（AEC）还可触达相邻支出类别，包括 OEM 经销商门户、第三方车辆估值服务和独立数字零售工具，代表每年额外 $2–4B 的软件支出，这些并未纳入核心 DMS 市场估算。不同研究机构对 DMS
              品类的定义差异很大：窄口径只看面向经销商的交易软件（库存、F&I、服务排期），宽口径则包括相邻 CRM、数字营销和 OEM 连接平台。定义分歧解释了市场规模估算为何跨度很大，从
              $0.85B（美国，仅经销商许可证）到 $14.2B（全球，2034 年宽口径）。出于竞争和估值目的，Tekion 的主要可服务市场是美国特许经销商核心 DMS 细分市场，面对的是 CDK Global 与
              Reynolds & Reynolds 这组既有双寡头。
            claimRefs:
              - CM003
              - CM004
              - CM021
              - CM032
