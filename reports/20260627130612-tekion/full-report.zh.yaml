  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 网络安全与勒索软件风险
        blocks:
          - type: paragraph
            body: >-
              Tekion 的云原生架构相较传统本地部署 DMS 平台有结构性安全优势，但也带来新的风险暴露面。2024 年 6 月 CDK Global 勒索软件攻击表明，DMS 平台是汽车零售的关键基础设施：CDK 停摆让
              15,000+ 家经销商客户最长中断 2 周，估计给汽车零售行业造成 $1 billion 交易损失。作为云端替代方案，Tekion 同样是高价值目标。BlackFog 的安全分析与 CloudSkope
              的泄露研究都记录，DMS 平台存有消费者金融数据（PII、支付卡、F&I 融资所需 SSN）、车辆交易记录和经销商财务账户，因此是勒索软件的首要目标。Tekion
              的多租户架构带来横向移动风险：若一家经销商的数据环境被攻破，而架构隔离控制不完整，其他租户可能被暴露。公司声称拥有 SOC 2 Type II 认证，并使用 AWS 和 Google Cloud
              安全基础设施。OWASP 的 API 安全 Top 10 框架直接适用于 Tekion 的 500+ 个开放 API 端点。NIST Cybersecurity Framework 与 PCI DSS 标准约束
              Tekion 通过 Tekion Pay 处理支付卡数据。即便有这些控制，独立安全审计结果仍未公开披露。FTC 2024 年针对 CDK Global 数据访问实践的执法行动，显示监管机构正更严密审视整个 DMS
              数据安全。更重要的是，Tekion 更开放的 API 生态虽有商业价值，但暴露面显著高于 CDK 过去封闭的 API 模式。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
