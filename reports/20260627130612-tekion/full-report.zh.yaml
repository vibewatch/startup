      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Emergen Research 将 2024 年全球 Automotive DMS 市场估值为 USD 6.8B，并预计到 2034 年增长至 USD 14.2B，CAGR 为
              7.6%。该估算覆盖全球本地部署和云部署。北美约占全球 DMS 支出的 35–40%，意味着 2024 年美国 DMS 市场约为 USD 2.4–2.7B（推导估算；未单独报告）。


              NADA 2023 Annual Data 报告称，美国有 16,990 家特许轻型车经销商，合计产生 $1.3T 总销售额和 276M 张维修工单。若按每个网点估计年 DMS 合同价值
              $50,000–$120,000（取决于模块和集团规模）计算，美国特许经销商 DMS TAM 约为每年 $0.85B–$2.0B。Tekion 目前约 2,000 个经销商网点，按估计平均 ACV $60,000
              计算，经销商许可证 ARR 约为 $120M，与公司披露的 2023 年 97% YoY ARR 增速一致。研究机构估算差异显著，从 2030–2034 年全球 $3.5B 到 $14.2B
              不等，取决于是否把相邻模块（CRM、数字零售、F&I）纳入市场边界。因此，防御性 TAM 测算需要多个分析视角：自下而上（NADA 经销商数量 × ACV）、自上而下研究报告（Emergen
              Research、MarketsandMarkets、IBISWorld），以及竞争收入代理（CDK + Reynolds 合计收入约 $3B，意味着包含服务的总市场约
              $4–6B）。可获取服务市场（SOM）反映年度合同续签机会：约 3,400–4,200 家美国经销商的 4–5 年合同每年到期。
