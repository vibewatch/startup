    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >-
              Tekion 的收入主要来自按网点月费订阅的模式，围绕 Automotive Retail Cloud（ARC）平台收费，平台包括 Dealer Management System（DMS）、Customer
              Relationship Management（CRM）和附属模块。其他收入流包括实施和上线费用、专业服务，以及通过生态体系促成支付和融资的交易型费用。公司报告 2023 年 ARR 同比增长
              97%；结合其声称的 2,000+ 个经销商网点基础，意味着截至 2025 年中估计 ARR 为 $200M–$350M。该增速远高于这一规模垂直 SaaS 公司的行业中位数。SaaS
              模型带来较高收入可见性，DMS 平台通常签多年合同（一般 3–5 年）。DMS 的流失在结构上较低，因为切换成本极高——经销商数据迁移、员工再培训和 OEM 重新认证会形成 18–36 个月迁移周期。Tekion
              每网点定价估计为每月 $2,000–$4,500，与全套 DMS、CRM 和服务车道工具打包的行业基准一致。该价格可能高于 CDK Global 等既有厂商，但可由云原生能力和经销商 IT
              基础设施成本下降来支撑。
