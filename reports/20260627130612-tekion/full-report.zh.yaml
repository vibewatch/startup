  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台架构：ARC 和 AEC
        blocks:
          - type: paragraph
            body: >-
              Tekion 旗舰产品 Automotive Retail Cloud（ARC）是行业首个云原生 DMS，基于 AWS 和 Google Cloud 基础设施，以微服务架构专门构建。传统 DMS
              系统运行在客户端-服务器架构上，要求每家经销商本地部署硬件；ARC 则完全运行在云端，在所有经销商部门之间提供实时数据同步，并支持无需 VPN 的远程访问。平台从一开始就采用多租户云设计，让 Tekion
              可以同时向所有客户部署更新，无需逐站点打补丁；这与 CDK 以及 Reynolds and Reynolds 需要经销商 IT 人员维护系统形成根本差异。配套平台 Automotive Enterprise
              Cloud（AEC）把功能延伸到 OEM 总部层面，让 OEM 能够实时查看其经销商网络中的库存、销售表现、客户满意度和合规指标。截至 2026 年，Tekion 在 ARC/AEC 上支持 52+ 个 OEM
              品牌，包括 GM、Ford、BMW、Toyota 和 Stellantis 旗下品牌。平台的开放 API 设计暴露 500+ 个端点，使第三方开发者和集成伙伴可在 Tekion 数据层上构建应用，支撑 250+
              个生态伙伴。该开放架构与 CDK 历史上的封闭 API 姿态形成鲜明对比；CDK 曾因反竞争数据访问做法受到 FTC 调查。
