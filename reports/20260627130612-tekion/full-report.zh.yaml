      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >
              Tekion 自 2016 年创立以来累计募集外部资本 $640M，并在最近的 2024 年 7 月融资中达到 $4B+ 估值。融资轨迹同时反映了公司的强增长指标，以及汽车行业对 DMS
              现代化这一重要市场机会的认可。


              早期投资人包括 Index Ventures、Storm Ventures、Airbus Ventures、BMWi Ventures、Renault-Nissan-Mitsubishi Alliance
              Ventures 和 General Motors，从创立之初就释放出汽车行业背书。2020 年 10 月 Series C（$150M，由 Advent International 领投，Exor、Airbus
              Ventures 和 FM Capital 参投）让 Tekion 以 $1B+ 估值进入独角兽俱乐部，这是一个关键里程碑，反映其平台成熟度和经销商采用度正在提升。


              2021 年 10 月，公司完成 $250M Series D，估值 $3.5B，由 Alkeon Capital 和 Durable Capital Partners 领投，Hyundai Motor
              Company 参投，显示增长动能和 OEM 战略协同仍在延续。最近一轮是在 2024 年 7 月 16 日由 Dragoneer Investment Group 投入 $200M 成长股权，将估值推高至
              $4B 以上。2024 年融资同时披露 2023 年 ARR 同比增长 97%，以及 2,000+ 个汽车零售商合作伙伴，表明市场牵引力强。Tekion 尚未披露准确 ARR，但 97% 的 YoY 增速和
              $4B 估值意味着收入基数正在快速扩大。
