      - number: '6.2'
        title: 锚定客户案例
        blocks:
          - type: paragraph
            body: >-
              Ken Garff Automotive Group 拥有遍布 13 个州的 170+ 家经销店，2025 年 1 月宣布选择 Tekion，在其多品牌组合中「创造最佳客户体验」。这是 Tekion
              已披露的最大公开客户胜利，由 Tekion 和 Ken Garff 在 BusinessWire 联合宣布，Automotive News 和 DigitalDealer 提供编辑报道。该选择凸显了对多 OEM
              经销商集团的吸引力：Ken Garff 经营 Toyota、Honda、Ford、Chevrolet、Hyundai 等品牌，这些品牌都需要 OEM 认证 DMS 集成，而 Tekion
              可通过单一平台提供。Asbury Automotive Group（NYSE: ABG）是一家 Fortune 500 汽车零售商，拥有 200+ 家经销店，据 DigitalDealer 报道，也正在迁移至
              Tekion。Asbury 迁移被描述为复杂且历时多年，反映大型集团 DMS 转换的现实。Hertz Global Holdings 是 Tekion 投资人，也是 Tekion
              车队管理和车辆再营销工具的商业客户。GM EV 数字零售工具合作（Tekion 构建的 Ultifi）意味着所有使用 Ultifi 的 GM EV 经销商，在 EV 交易中事实上都是 Tekion DMS
              用户，这是一条绕过传统 DMS 销售流程的渠道。这些锚定客户为正在评估 Tekion 的中端经销商集团提供了信誉信号。
