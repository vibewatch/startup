      - number: '8.4'
        title: 悲观情形估值（$2.5–3.5B）
        blocks:
          - type: paragraph
            body: >-
              悲观情形给 Tekion 估值 $2.5–3.5B（较 2024 年 Series E 折价 12–37%），驱动因素是一个或多个不利情境：（1）CDK 完成可信的云迁移并留住既有客户，限制 Tekion
              的绿地赢单，ARR 增长降至每年 30% 以下；（2）Asbury Automotive 迁移失败造成标杆口碑受损，显著拖慢企业销售周期；（3）在持续高利率环境下，SaaS 倍数压缩至 6–8x NTM
              ARR，与 Macrotrends 关于 2022 年倍数压缩的历史数据一致；（4）Tekion 发生网络安全泄露，引发风险厌恶型大型经销商集团流失；（5）Jay Vijayan
              离职或关键人物事件显著影响投资者信心。在该情形下，公开市场投资者会按预计 2027 年 ARR $350–450M 的 7–9x 给 Tekion 定价，IPO 市值隐含 $2.5–4B。这对 Series E
              投资者意味着估值下调轮，也会显著稀释员工股权。鉴于当前执行轨迹和 Tekion 保有的显著结构性优势，悲观情形概率评估为 20–25%。Yahoo Finance 对成熟 SaaS 倍数的可比分析提供了下限参照。
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
      - number: '8.5'
        title: 建议与投资论点
        blocks:
          - type: paragraph
            body: >-
              建议：谨慎买入，前提是完成经审计财务验证并持续监测 CDK 竞争动态。Tekion 是 $6.8B TAM、14.5% CAGR 市场中的领先云原生 DMS
              颠覆者，投资论点有吸引力。其技术护城河——云原生微服务、52+ 项 OEM 认证、开放 API 生态、来自 2,000+ 个门店的专有 AI 训练数据——构成持久竞争优势，传统在位者不易复制。97% YoY
              ARR 增长、企业锚定客户（Ken Garff、Asbury、GM 合作）以及来自成熟增长投资者 Dragoneer 的 $4B+ 估值，共同提供了第三方验证。主要投资风险——CDK
              云端重建、关键人物集中、网络安全暴露——真实存在，但可通过主动监测管理。基准情形 $4.5–6B 公允价值意味着相对 Series E $4B+ 估值有 1.1–1.5x
              回报；对风投而言偏温和，但对这一成熟度的后期 IPO 前投资是合适的。愿意持有到 2026–2027 年 IPO 窗口、并接受执行风险的投资者，会认为风险回报具备吸引力。Sapient Capital 与
              ForEntrepreneurs 的后期 SaaS 框架支持本阶段创造价值的论点。信心：中高。关键数据缺口——准确 ARR、毛利率、EBITDA 和经审计财务——使评级无法达到高信心。
