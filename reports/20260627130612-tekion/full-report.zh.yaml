      - number: '1.4'
        title: 规模、运营与关键里程碑
        blocks:
          - type: paragraph
            body: >
              截至 2024 年 7 月，Tekion 服务超过 2,000 家汽车零售商（经销商特许门店 / 网点），并与 250+ 家生态技术伙伴合作。平台支持 52+ 个 OEM 品牌，包括 General
              Motors、Ford、Honda、Hyundai、Toyota、Porsche 等，覆盖本土和进口汽车细分市场。公司的经销商基础显著扩大：从 2020 年少数试点经销商，增长到 2024 年中的 2,000+
              个网点。


              关键战略里程碑包括：2020 年 2 月 ARC 产品发布；2020 年 10 月成为独角兽；2022 年 4 月 ARC 扩展 CRM 和数字零售能力（更名为 Automotive Enterprise
              Cloud）；2023 年 7 月收购 Five64（车辆登记技术）；2024 年 1 月与 Asbury Automotive Group（美国最大上市经销商集团之一）建立合作，启动四店 DMS 试点；以及
              2025 年 1 月宣布 Ken Garff Automotive Group 成为 Tekion 客户。


              Tekion 员工约 2,500+ 人，包括位于印度 Bengaluru 和 Chennai 的研发团队，以及分布在美国和欧洲的市场进入团队。公司在 2023 年 8 月裁员 10%，影响约 200
              名印度员工，反映高增长阶段之后对增长投入进行再校准。即便如此，2024 年 7 月 $200M 融资仍显示投资人对长期机会有信心。
