      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              推动云 DMS 采用加速的主要增长驱动包括：（1）云迁移顺风——Emergen Research 称，2024 年 65% 的新 DMS 实施为云部署，高于 2020 年约
              30%，传统本地部署系统的技术债不断累积；（2）2024 年 6 月 CDK Global 勒索软件入侵——19 天停摆冻结 15,000+ 家经销商运营，估计行业损失 $600M–$1B，催化董事会层面对
              DMS 供应商风险集中的讨论；（3）EV 复杂度——NHTSA 称 2024 年售出的新车中超过 85% 包含联网技术，现代 DMS 平台必须处理 OTA 更新协调、专门服务协议和电池管理工作流；（4）AI
              驱动效率——Emergen Research 称，高级 AI DMS 用户报告库存周转提升 23%、客户满意度提升 18%；（5）OEM 数字零售要求——GM 选择 Tekion 作为其 EV
              数字零售平台，释放出 OEM 对云原生 DMS 伙伴偏好正在形成的信号。


              主要采用约束包括：（1）合同锁定——CDK Global 和 Reynolds & Reynolds 通常要求 5–7 年合同并设置经济罚则，将每年可切换量限制在约 3,400–4,200
              家合同到期经销商；（2）切换成本——从传统 DMS 迁移需要 6–12 个月的员工再培训、数据迁移和工作流重构；（3）经销商利润率薄——美国经销商新车税前净利率平均仅 2–3%，技术预算受限，必须证明
              ROI；（4）OEM 认证要求——52+ 个 OEM 品牌要求通过认证的 DMS 数据交换，用于保修、零件订购和客户数据。这道资格门槛 Tekion 已基本跨过，但仍会限制新进入者。
