      - number: '8.3'
        title: 基准情形估值（$4.5–6B）
        blocks:
          - type: paragraph
            body: >-
              基准情形给 Tekion 2026–2027 年 IPO 估算公允价值区间 $4.5–6B，依据是预计 2026 年 ARR $380–480M 的 12–15x。该情形假设：（1）公司跨过 $300M ARR
              拐点后，ARR 增长到 2026 年放缓至每年 40–50%；（2）Tekion 到 2026 年达到 2,500–3,000 个门店；（3）GM 与 Ken Garff 合作形成强标杆，但没有单个颠覆性 OEM
              或 DSO 大单；（4）利率正常化后，SaaS 倍数稳定在 10–14x NTM ARR。基准估值较 2024 年 7 月 $4B+ Series E 小幅溢价，反映预期 IPO 窗口前还有一到两年 40%
              复合增长。DnB 商业智能和 Sapient Capital 的私营公司估值框架支持该区间。在基准情形下，$4B+ Series E 对后期投资者而言是合理入场价，24–36 个月目标 IRR 为
              20–30%，与 Dragoneer 历史投资组合表现一致。Pitchbook 与 KeyBanc 可比交易数据支持这一增长率下 IPO 前垂直 SaaS 的 12–15x ARR 倍数区间。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
