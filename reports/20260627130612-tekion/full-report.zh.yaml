      - number: '7.5'
        title: 执行、财务与资本市场风险
        blocks:
          - type: paragraph
            body: >-
              Tekion 的执行风险集中在两处：大型经销商集团迁移复杂度，以及盈利前资本需求。贸易媒体报道显示，Asbury Automotive 迁移（200+
              个门店）已超过初始时间表，这带来大型企业迁移损害标杆口碑的风险——一次 Fortune 500 迁移失败，就可能劝退其他大型集团采用 Tekion，拖慢支撑 $4B+
              估值的增长曲线。财务风险包括：（1）公司尚未盈利，必须在 2027–2028 年前达到盈亏平衡，或再融资；（2）已融资 $640M 被激进招聘、OEM
              集成和美国市场扩张消耗，现金跑道未公开披露；（3）风险资本市场恶化可能迫使 Tekion 以低于预期的倍数 IPO，稀释员工和早期投资者；（4）若增长率降至支撑 $4B+ 估值所需的 40%
              门槛以下，就存在估值下调轮风险；（5）利率敏感性——Tekion 估值基于高倍数 SaaS 定价，与无风险利率负相关，任何持续高于 4% 的利率环境都会压缩倍数。公司避开 2024–2025 年 IPO
              的决定在战略上合理，但会累积压力：每多私有一年，未来上市规模就必须更大，才能为员工创造有意义的流动性。
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
