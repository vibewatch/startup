      - number: '6.4'
        title: 客户获取与切换成本
        blocks:
          - type: paragraph
            body: >-
              Tekion 的获客模式瞄准经销商集团，采用咨询式企业销售；拿下一个客户，可能一次带来 5–200+ 个门店。2024 年 6 月 CDK Global 勒索软件攻击显著推高了公司漏斗顶部需求：事件让
              15,000+ 家 CDK 经销商客户最长停摆 2 周，经销商对云原生 DMS 替代方案产生了急迫需求。Automotive News 引述的行业分析师称，CDK 被攻破后，2024 年 Q3–Q4 Tekion
              的销售管线活动增加，经销商开始寻求分散 DMS 风险。经销商一旦上 Tekion，切换成本极高：DMS 数据迁移涉及财务记录、客户数据库、车辆历史、零件目录和服务历史，通常需要专业数据迁移服务，并经历 6–18
              个月并行运行或分阶段切换。Tekion 装上之后，自然形成锁定。CoxAutomotive 的 2025 年数字化报告指出，2024 年只有 8% 的美国经销商更换了 DMS 供应商，凸显 DMS
              关系的结构性粘性。Tekion 的 OEM 认证模式也形成拉力：OEM 有时会推荐或要求特定 DMS 认证，Tekion 不断扩大的 OEM 合作伙伴名单，为经销商采用提供了 OEM 侧激励。
