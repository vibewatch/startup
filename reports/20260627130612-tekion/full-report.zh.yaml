            body: >-
              Cox Automotive（GA Atlanta，私有；Cox Enterprises 子公司）组建了完整汽车软件组合，包括 DealerSocket（DMS，2021 年从 Solera Holdings
              收购）、Dealertrack（F&I 和数字签约）、VinSolutions（CRM）和 Dealer.com（数字营销）。DealerSocket 主要通过 iDMS 平台在全球服务约 9,000
              家经销商，是 CDK 和 Reynolds 之外一个价格更低、可信的云原生替代方案。Cox Automotive 的捆绑价值主张同时制造竞争威胁（全生态锁定）和 Tekion 的差异化机会（开放 API 对比
              Cox 封闭生态）。


              PBS Systems（加拿大 British Columbia）是一家云端 DMS，服务 1,000+ 家北美经销商，主要为中小型客户。DMS for Dealers
              是较新的进入者，面向独立和特许经销商提供现代云架构。VinSolutions 和 Dealertrack 虽然不是完整 DMS 平台，但分别直接竞争 Tekion 的 CRM 和 F&I
              模块。Salesforce 已开始通过与经销商集团合作进入汽车 CRM 领域，对 Tekion ARC 平台的 CRM 组件构成较长期威胁。
