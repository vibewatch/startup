            body: >-
              Tekion 自 2016 年创立以来已通过六轮融资累计募集约 $640M 风险资金，最近一轮是 2024 年 7 月由 Dragoneer Investment Group 领投的 $200M Series
              E，公司估值超过 $4B。早前轮次包括 2021 年 10 月 $250M Series D，当时估值 $3.5B。其他投资人包括 General Atlantic、Advent
              International、Greenoaks Capital、BMW i Ventures 和 Hertz。Series E 相比 Series D 估值溢价
              14%，反映公司在后期风险投资宏观环境承压下仍持续执行。融资构成显示成长股权和战略投资人混合：BMW i Ventures 和 Hertz 带来 OEM 与车队战略协同；Dragoneer、Greenoaks 和
              General Atlantic 则是纯财务赞助方。据报道 Tekion 曾拒绝 IPO 讨论，显示管理层偏好以私募成长融资继续发展；Automotive News 讨论中引用的投行人士认为，潜在 IPO
              就绪时间线为 2026–2027 年。据报道，二级股销售为早期员工提供了流动性。公司资本结构仍为私有，优先股条款未公开，但基于投资人类别，可推定存在标准清算优先权和反稀释条款。
