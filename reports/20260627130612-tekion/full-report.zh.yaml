      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              Tekion 的单位经济体现了规模化阶段垂直 SaaS 公司的特征。云原生 DMS 毛利率估计为 55–70%，与 KeyBanc Capital Markets SaaS 调查基准一致；该调查显示，垂直
              SaaS 中位毛利率为 73%，专业服务占比较高公司的中位毛利率为 65%。考虑 DMS 实施复杂且服务成分显著，Tekion 毛利率可能落在该区间低端。DMS
              的估计客户获取成本（CAC）较高，因为企业销售周期长，但经销商集团（DSO）可在单笔交易中带来多个网点，从而摊薄 CAC。生命周期价值（LTV）结构上强：按 3 年最低合同、每网点每月 $3,000、接近
              100% 毛留存计算，单网点 LTV 超过 $108,000，即便销售投入激进，LTV/CAC 也高于 3:1。运营费用主要由 R&D（估计这一阶段占 ARR 的 35–45%）和客户成功 / 实施主导。公司重投
              OEM 集成，覆盖 52+ 个品牌，带来持续但高价值的开发成本。随着 Tekion 扩张，运营杠杆应改善：每新增一个 OEM
              集成都会在不断增长的经销商基础上摊销，产品成熟后每网点客户成功成本也会下降。基于模块扩张、附加组件采用和经销商集团内部网点数量增长，净收入留存（NRR）估计高于 110%。
