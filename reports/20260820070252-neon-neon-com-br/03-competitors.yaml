- id: switching-costs-lock-in-and-partner-power
  title: Switching costs, multi-homing, and partner power remain modest
  body: Neons competitive challenge is intensified by structurally modest switching costs. McKinsey says Brazilians hold 4.4 bank accounts on average, which means adding a new app is easy and dropping into secondary status is also easy. Open Finance and Pix reduce some friction for customers—which is good for challengers versus incumbents—but they also reduce any single challengers lock-in advantage. Credit cards, payroll links, salary deposits, and recurring bill flows create some stickiness, yet the market evidence suggests users still reward whichever app feels most reliable and complete. RankingsLatAm underscores this by elevating customer satisfaction as a core competitive variable; Inter can lead on low dissatisfaction while PagBank and Nu lead on satisfaction intensity. Partner power adds another layer. Employer channels matter in payroll credit, card networks and payment rails remain foundational, and marketplace or merchant ecosystems give some peers privileged data and traffic.
    Neon can still win, but the path is through execution, principality, and underwriting discipline—not through high structural lock-in.
