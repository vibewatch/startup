company:
  name: Neon
chapter:
  number: 3
  title: Competitors
  summary: Neon competes in a brutally crowded Brazilian digital-finance field where direct neobank peers, payments-led wallets, and super apps all chase the same primary-account relationship. Public data show Nubank, Mercado Pago, PicPay, Inter, C6, and PagBank all operate at larger or similar scale, with broad product suites spanning cards, credit, investments, payments, insurance, and merchant tools. Neons differentiation rests on working-class focus, MEI adjacency, and product simplicity, but multi-homing, low switching costs, and Pix/Open Finance interoperability mean any moat is executional rather than structural.
sections:
- id: landscape-and-where-neon-sits
  title: 'Landscape: direct peers, adjacents, incumbents, and substitutes'
  body: The Brazilian competitive field is best viewed as concentric circles rather than a single peer list. Direct peers are digital banks that target retail consumers with transaction accounts, cards, credit, and savings products—Nubank, Inter, C6 Bank, PagBank, and PicPay all fit part of this frame. A second ring includes ecosystem-heavy finance platforms such as Mercado Pago, which combine wallet, marketplace, merchant, and credit loops strong enough to compete for the same primary financial relationship even if they were not born as banks. A third ring is the incumbent-bank status quo, which still matters because the average Brazilian keeps multiple banking relationships. Neon therefore competes not only against other apps, but against inertia, payroll-linked incumbency, employer distribution, and merchant ecosystems. The strategic implication is that Neons true competition is any platform that can own the customers daily balance, payment habit, and credit decision—not just any company
    calling itself a neobank.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
