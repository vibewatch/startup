  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: neon-principality-gap
    missingEvidence: A direct comparison of primary-account penetration, salary-deposit share, and profitable actives across Neon and its peer set.
    whyItMatters: Gross customer-count comparisons understate the importance of engagement and wallet share in a multi-homing market.
    diligencePath: Request internal cohort and principal-account benchmarks against public peers.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: proprietary-moat-proof
    missingEvidence: Evidence of a durable proprietary moat beyond brand, UX, and execution in the working-class / MEI segment.
    whyItMatters: Without structural lock-in, valuation should not assume monopoly-like durability.
    diligencePath: Request retention, cohort-margin, and MEI cross-sell data showing defensibility versus peers.
    relatedQuestionRefs:
    - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: adjacent-substitutes
    missingEvidence: A full enumeration of incumbent-bank and payroll/ecosystem substitutes beyond the major digital peers.
    whyItMatters: The competitive set is broader than the named neobank leaders.
    diligencePath: Expand competitor mapping in a follow-up refresh if the investment advances.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
