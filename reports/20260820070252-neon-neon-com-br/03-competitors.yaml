- id: peer-profiles-and-scale
  title: 'Peer profiles: the major public and private challengers are already enormous'
  body: Scale is the first uncomfortable fact for Neon. Riotimes places Nubank at 131 million customers, while public releases put MercadoLibres fintech arm at 88 million monthly active users, PicPay at 67 million total accounts in 2025 and 68.6 million in Q1 2026, Inter at 45.3 million customers, C6 at 40 million clients, and PagBank at 34 million. Neon, at 32 million clients, is not small by any absolute standard; the problem is that the entire category is large. Several peers also show stronger disclosed monetisation. Inter reported R$815.9 million H1-2026 net profit, C6 said it earned R$2.5 billion in 2025, PagBank reported R$678 million recurring profit in 4Q25, PicPay exceeded R$10 billion revenue in FY2025, and Mercado Pago keeps scaling AUM and credit. This means investors should read Neon less as an early land-grab story and more as a scaled contender that still trails the very top tier on disclosed earnings and ecosystem breadth.
  claimRefs:
  - CP008
