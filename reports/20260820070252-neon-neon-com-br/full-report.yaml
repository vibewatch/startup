      - number: '3.3'
        title: 'Capability, pricing, and distribution: product breadth is table stakes, ecosystem depth is the real separator'
        blocks:
          - type: paragraph
            body: >-
              Product breadth across the category has converged. Nearly every major player now offers some combination
              of account, card, Pix, credit, investments, and insurance. What differentiates them is the distribution
              flywheel that feeds those products. Mercado Pago can attach finance to commerce; PagBank brings
              merchant-acquiring and working-capital flows; PicPay compounds wallet behaviour into credit and insurance;
              Inter layers a super app and marketplace on top of banking; C6 emphasises a broad 100-plus-product suite;
              Nubank monetises extreme scale and strong brand. Neon still has a clear value proposition—mass-market
              simplicity, CDB-led savings engagement, secured-limit behaviour tools such as Viracrédito, and MEI
              adjacency—but it lacks the obvious embedded-distribution engine that some peers own outside banking
              itself. Public product pages and rankings also imply that price is no longer the main separator; user
              experience, app reliability, breadth of adjacent services, and the ability to become the habitual payment
              / credit destination increasingly matter more than headline fee reductions.
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
