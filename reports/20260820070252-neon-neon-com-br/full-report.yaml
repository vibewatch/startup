      - number: '1.3'
        title: Funding history, investors, and capital base
        blocks:
          - type: paragraph
            body: >-
              Neons capital history shows repeated access to large global backers, but the public record mixes official
              timeline entries, older founder interviews, and secondary summaries rather than a single clean cap-table
              disclosure. The clearest anchor is the February 2022 BBVA-led US$300 million round that TechCrunch says
              valued Neon at US$1.6 billion and formally made it a unicorn. The official company timeline also records
              earlier capital milestones, including a R$400 million 2019 round backed by Banco Votorantim and General
              Atlantic, followed by the 2022 BBVA raise and a three-part Series E. Public 2024 and 2025 materials
              reconcile that Series E into R$518 million raised across December 2023 and August 2024, then an extension
              that brought the total to R$720 million in July 2025. BrazilCham and Fintech News America name IFC and DEG
              as new investors in that extension, while Startups says BBVA and General Atlantic also participated. The
              financing case is therefore strong on investor quality and recent access to capital, but still weak on
              preference terms, existing dilution, and exact post-money valuation in 2025.
