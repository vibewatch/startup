      - number: '4.5'
        title: 'Financial verdict: materially better, but still dependent on proving durable unit economics'
        blocks:
          - type: paragraph
            body: >-
              The financial verdict should be constructive but not complacent. Neon has clearly moved beyond a pure
              growth-at-all-costs profile: public sources support breakeven in late 2024, intermittent profitability in
              2025, strong gross-revenue growth, a larger credit book, and a more diversified funding structure. Yet the
              public record still omits the metrics investors need to fully underwrite a consumer-credit-led bank: CAC,
              payback by cohort, active-primary-account penetration, contribution margin by product, delinquency/vintage
              curves by segment, deposit beta, realized cost of funding, and the fraction of credit growth coming from
              the safest versus riskiest borrower bands. Even the more positive disclosures still acknowledge caution.
              Estadão highlights competitive pressure and elevated rates, while the financial statements show large
              expected-loss provisions and a material balance-sheet commitment to card receivables. The right conclusion
              is that Neon looks much healthier than in prior years, but its quality of earnings has not yet been proven
              enough for a clean underwriting leap without further management data.
