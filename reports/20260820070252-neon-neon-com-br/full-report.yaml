  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: A range is more honest than a point estimate because the updated post-2025 valuation was not disclosed publicly.
    data:
      items:
        - label: Bear fair value (USD M)
          low: 1000
          mid: 1150
          high: 1300
          unit: USD M
          note: Weak customer depth or funding/credit quality would justify compression below the 2022 anchor.
        - label: Base fair value (USD M)
          low: 1400
          mid: 1600
          high: 1700
          unit: USD M
          note: Assumes the stale unicorn mark is roughly defensible if quality keeps improving.
        - label: Bull fair value (USD M)
          low: 1900
          mid: 2200
          high: 2500
          unit: USD M
          note: Requires better customer depth, stronger profitability, and clearer pre-IPO readiness.
        - label: Bear MOIC vs $1.6B entry
          low: 0.63
          mid: 0.72
          high: 0.81
          unit: x
          note: Illustrative downside if entering near the legacy unicorn mark.
        - label: Base MOIC vs $1.6B entry
          low: 0.88
          mid: 1
          high: 1.06
          unit: x
          note: Shows why a stale mark does not automatically equal attractive upside.
        - label: Bull MOIC vs $1.6B entry
          low: 1.19
          mid: 1.38
          high: 1.56
          unit: x
          note: Upside exists, but it is not venture-like without proof or a better entry.
    approximationNotes: >-
      Illustrative fair-value and return ranges derived from public valuation anchors and scenario logic, not company
      guidance.
    claimRefs:
      - CV017
      - CV020
      - CV022
      - CV023
      - CV024
      - CV037
