      - number: '6.4'
        title: >-
          Retention, expansion, and concentration: cross-sell is credible, but concentration risk lives in channels and
          principality rather than in one giant account
        blocks:
          - type: paragraph
            body: >-
              Expansion logic in Neon is visible even when classical SaaS retention metrics are not. The app and product
              surfaces show several land-and-expand paths: account to card, card to Viracrédito, account to CDB,
              consumer banking to MEI area, and general digital banking to payroll/FGTS products. Startups also makes
              clear that management wants more users to treat Neon as their principal institution, not merely an
              acquisition statistic. Concentration risk is therefore unusual: the main risk is not a single top customer
              but over-reliance on certain acquisition channels, payment rails, or a large base of weakly engaged
              customers. Channel and partner dependence matter too; some products depend on correspondent structures or
              eligibility-linked rails, which can create procurement-like friction even in retail finance. The safest
              customer-retention conclusion is that Neon likely has meaningful repeat usage and cross-sell, but public
              data stop short of proving NRR-like durability or low churn in the most important cohorts.
            claimRefs:
