        title: 'Disclosed traction and profitability: real improvement, but not yet proof of steady-state earnings'
        blocks:
          - type: paragraph
            body: >-
              The strongest public progress markers came in 2025. InfoMoney reported R$3.5 billion gross revenue for the
              year, up 55%, with the accounting loss narrowing from R$357 million to R$43 million; the fourth quarter
              was profitable. Startups reported a R$9.3 million first-quarter 2025 profit and cited 63% quarterly
              gross-revenue growth to R$806 million in that quarter, while Estadão later said first-half 2025 still
              ended with a R$35 million loss after a R$265 million loss in the same period of 2024. Those facts together
              matter because they show improvement was real but uneven: Neon reached breakeven at the end of 2024,
              posted intermittent profits in 2025, yet had not fully locked in consistent period-by-period profitability
              by mid-2025. The credit book expanded at the same time. Consolidated June 2025 statements show gross
              receivables of roughly R$7.0 billion before expected-loss provisions, while year-end 2025 statements place
              the main book components at R$6.065 billion in card receivables, R$962 million in payroll lending, and
              R$820 million in personal lending. Growth is therefore visible; the key debate is whether revenue quality
              is keeping pace with underwriting risk and funding obligations.
