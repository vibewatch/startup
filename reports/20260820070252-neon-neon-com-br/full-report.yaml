  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The highest-probability Neon customer path runs from simple account use into credit, savings, and possibly MEI
      consolidation.
    data:
      items:
        - label: Open account + start Pix
          detail: User chooses Neon for low-friction digital banking.
        - label: Use card and daily payments
          detail: Habit formation depends on repeated everyday use.
        - label: Add CDB or Viracrédito
          detail: Balance-building and credit-readiness deepen engagement.
        - label: Use credit products
          detail: Card, personal, FGTS, or payroll credit raise monetization.
        - label: Expand into MEI area
          detail: Some users consolidate business and personal flows in one app.
