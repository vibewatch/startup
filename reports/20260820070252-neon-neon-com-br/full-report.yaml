  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: consumer digital banking plus adjacent credit, savings, and MEI workflows'
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Neon is broader than consumer current accounts but narrower than all Brazilian
              financial services. Neon competes in digital transaction accounts, payment flows, credit cards, personal
              loans, payroll-linked lending, FGTS advance, savings/CDB capture, and lightweight business-finance tools
              for MEIs. McKinsey describes Brazil as a full-stack digital-finance system in which Pix, Open Finance,
              digital identity, and tokenised rails are rewiring how consumers and small businesses transact. That makes
              the included spend pools everyday balances, payment activity, short-duration consumer credit, savings
              products, and micro-entrepreneur operating finance; excluded from the core market are wholesale banking,
              capital-markets origination, and complex affluent wealth management. Neon therefore sits between a
              neobank, a lender, and an engagement-led financial super app. The market boundary matters because the
              companys core question is not whether Brazilians want any digital account—they already do—but whether Neon
              can become the primary relationship for price-sensitive and underbanked users whose financial activity now
              moves easily across mobile apps.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
