              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 'Scenario logic and return discipline: range valuation is more honest than single-point precision'
        blocks:
          - type: paragraph
            body: >-
              Because the valuation denominator is incomplete, scenario ranges are more appropriate than precision. A
              bearish outcome is not bankruptcy; it is a world where Neon keeps a large user base but reveals weaker
              principality, more volatile credit quality, and funding or margin pressure that make the current unicorn
              framing look full. A base case assumes the company continues improving revenue quality, proves healthier
              funding and credit performance, and preserves something close to the legacy US$1.6 billion anchor. A bull
              case requires more: stronger product attachment, better customer depth, cleaner profitability, and
              credible pre-IPO progress that justifies a premium to the stale 2022 mark. Return discipline therefore
              starts with entry discipline. If investors cannot confirm what changed economically between the 2022
              unicorn mark and the 2025 extension other than better but still partial progress, they should not assume a
              large discount or a large premium without evidence.
            claimRefs:
              - CV017
              - CV018
