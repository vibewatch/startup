      - number: '2.2'
        title: 'TAM/SAM/SOM lenses: Brazil is huge, but principality is the true scarce resource'
        blocks:
          - type: paragraph
            body: >-
              The country-level opportunity is large even before making aggressive assumptions. IBGE put Brazils 2025
              population at 213.4 million, while McKinsey estimated more than 200 million digitally engaged citizens,
              188 million mobile-internet users, and 90% adult banking penetration by 2025. Those facts create a vast
              TAM for digital financial services but also show why one broad market-size number can be misleading: if
              almost all adults already hold an account and the average Brazilian maintains 4.4 bank relationships, the
              bottleneck is not initial onboarding but share-of-wallet, engagement, and risk-adjusted monetisation. Neon
              itself reported 32 million clients, meaning it has already penetrated a meaningful slice of the countrys
              population on a gross-account basis. A more useful SAM is the subset of working-class consumers and MEIs
              who remain under-served on credit, savings, and primary-account quality. Riotimes still describes 60
              million adults as lacking credit cards and 30% to 50% of the population as underbanked, which helps
              explain why Neons product roadmap keeps returning to secured-limit cards, payroll credit, FGTS advance,
              and MEI workflows rather than only card acquisition.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
