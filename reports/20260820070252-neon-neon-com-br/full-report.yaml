  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Principality rises, ARPAC/monetization improve, funding remains disciplined, and IPO readiness becomes
          credible
        - >-
          Valuation expands above stale $1.6B mark toward premium growth-fintech range; meaningful upside from current
          benchmark
        - Execution, credit, and macro still matter
        - Possible but needs private proof
      - - Base
        - >-
          Revenue quality keeps improving, customer depth improves modestly, and valuation remains near legacy unicorn
          territory
        - Roughly preserves $1.4B-$1.7B style range; returns depend heavily on actual entry price
        - Opacity and dilution can still mute returns
        - Most consistent with public evidence
      - - Bear
        - Gross scale remains large but primary use, losses, or funding cost disappoint
        - Fair value compresses below stale mark, producing weak or negative returns from an aggressive entry
        - Customer quality, competition, and funding stress
        - Very plausible without better disclosure
    notes: Public evidence supports range-based scenario analysis more than point estimates.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Inter
        - 45.3M customers; public profitability
        - Public-market digital-bank reference with disclosed revenue and profit
        - Shows what scaled Brazilian digital-banking economics can look like
        - Different capital-markets status and broader ecosystem
      - - PicPay
        - 67M total accounts / 42.7M active in FY2025; >R$10B revenue
        - Large private/platform reference with high activity and monetization
        - Useful for wallet-led monetization and active-user comparison
        - Not a pure bank; ownership and ecosystem differ
      - - Mercado Pago / MELI fintech
        - 88M fintech MAUs; $23B AUM; $16B+ credit book
        - Large public-ecosystem reference
        - Shows premium earned by finance embedded in broader commerce
        - Much stronger ecosystem advantages than Neon
      - - C6 Bank
        - 40M clients and R$2.5B net income in 2025
        - Private challenger-bank reference on product breadth and profitability
        - Useful for challenger-bank scale and earnings bar
        - Private valuation and full cap-table terms are not public
      - - PagBank
        - 34M clients and profitable payments-rooted banking
        - Public/payments-bank reference
        - Useful for merchant-rooted depth and retail monetization
        - Payments heritage differs from Neon
    notes: These are valuation references, not direct multiple lookups that can be applied mechanically.
    enumerationScope:
      coverage: sample
      basis: >-
        Selected public and private digital-finance references that illuminate valuation discipline for Neon; not an
        exhaustive peer list.
