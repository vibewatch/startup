  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and legal risk: the 2018 Banco Neon failure still matters as historical context even if the current
          entity moved beyond it
        blocks:
          - type: paragraph
            body: >-
              The single most important historical risk marker is the 2018 liquidation of Banco Neon by the Banco
              Central, widely covered by UOL, Veja, and Convergência Digital. That episode did not kill the broader Neon
              consumer-finance effort, but it permanently raises the bar for how investors should think about regulatory
              resilience, related-entity complexity, and control quality. More recent materials are notably stronger:
              current disclosures emphasize authorized payment-institution status, regulated partner relationships,
              privacy and LGPD processes, and a more mature funding structure. Still, the lesson from 2018 is not
              obsolete. Neons public product stack spans multiple regulated entities and correspondent or partner
              structures, so legal and regulatory slippage could still surface through licensing, disclosures, privacy
              handling, consumer-protection obligations, or product-partner boundaries. The right regulatory read is
              therefore improved posture with non-trivial residual exposure, not clean-room simplicity.
            claimRefs:
              - CR001
              - CR002
              - CR003
