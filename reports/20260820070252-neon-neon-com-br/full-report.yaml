companyProfile:
  summary: >-
    Neon is a São Paulo-based Brazilian neobank founded in 2016. Its modern business combines app-based retail banking,
    cards, credit, deposits/CDB, and MEI-adjacent financial workflows. The company has reached meaningful national scale
    and showed sharp financial improvement through 2024-2025, but the retained public evidence still leaves core
    underwriting questions unanswered around primary-account penetration, risk-adjusted credit quality, and the exact
    valuation/cap-table terms attached to the latest financing.
