      - number: '2.4'
        title: 'Growth drivers: Pix, Open Finance, mobile distribution, and still-open credit formalisation'
        blocks:
          - type: paragraph
            body: >-
              The strongest market tailwinds are infrastructural. McKinsey says Pix processed around 63 billion
              transactions in 2024, had 158 million users, and brought 71.5 million Brazilians into the digital-payments
              system; the BCBs own Pix page shows more than 170 million users and 7 billion transactions in January
              2026, with a 313.3 million record single day in December 2025. Those numbers matter because Neon can build
              on a default payment rail rather than educate the market from scratch. Open Finance is the second
              tailwind: McKinsey cites more than 64 million active data-sharing consents and 9.2 billion monthly API
              calls, while BCB communications frame the system as globally scaled and still expanding. Together, these
              rails reduce onboarding friction, make credit underwriting more data-driven, and allow new features such
              as Pix Automático, NFC Pix, and cross-institution account aggregation to compound user engagement. FIDC
              growth and a still-large corporate-credit gap also matter indirectly, because they deepen the
              private-credit and structured-finance plumbing behind consumer and small-business lending.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
