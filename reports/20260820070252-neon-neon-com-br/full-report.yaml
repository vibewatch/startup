  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Most top risks transmit first into customer trust and margin quality, then into financing needs and valuation.
    data:
      nodes:
        - id: ops
          label: Operational incident
          detail: Fraud, outage, migration failure, or support breakdown
        - id: customer
          label: Customer trust / principality
          detail: Active use and willingness to stay or deepen
        - id: credit
          label: Credit quality / losses
          detail: Underwriting, delinquency, and repeat-borrow quality
        - id: margin
          label: Margin and profitability
          detail: Funding cost, ECL, and support burden
        - id: capital
          label: Capital need
          detail: Need for more equity or balance-sheet support
        - id: valuation
          label: Valuation / recommendation
          detail: Investment case durability
      edges:
        - from: ops
          to: customer
          label: erodes trust
        - from: customer
          to: credit
          label: lower-quality cohorts
        - from: credit
          to: margin
          label: higher losses
        - from: ops
          to: margin
          label: support and fraud cost
        - from: margin
          to: capital
          label: more funding needed
        - from: capital
          to: valuation
          label: dilution or risk premium
        - from: customer
          to: valuation
          label: weaker growth quality
    claimRefs:
