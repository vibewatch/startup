      - number: '4.2'
        title: 'Pricing, monetization, and GTM proxies: engagement and cross-sell matter more than list fees'
        blocks:
          - type: paragraph
            body: >-
              Neons monetization logic is constrained by its positioning. The product pages repeatedly stress free or
              low-fee digital banking, no annual card fee, Pix utility, and simple onboarding. That implies GTM
              efficiency must come from app-led self-serve acquisition and cross-sell into higher-yield credit and
              savings products, not from expensive sales teams or high listed account fees. Management commentary in
              Startups makes the same point more directly: breakeven came from growing the customer base, improving
              revenue per user, and scaling enough to cover fixed costs. Public data on CAC, payback, or conversion by
              cohort remain unavailable, so the best proxies are account growth, active-account growth, credit-book
              expansion, stronger funding independence, and evidence that existing users deepen into products like
              Viracrédito, payroll credit, FGTS advance, and CDB. The commercial motion therefore resembles a digitally
              distributed consumer bank seeking better unit economics through deeper product attachment, not a
              merchant-acquiring platform or enterprise-sales lender. Investors should treat low published list pricing
              as customer acquisition strategy; realised economics depend on whether those customers become active, fund
              balances, and borrow profitably.
