      - number: '2.5'
        title: 'Constraints, competition, and verdict: large opportunity, but profitability pressure is structural'
        blocks:
          - type: paragraph
            body: >-
              The same market that makes Neon possible also makes the business harder. McKinsey notes that fintechs
              already hold 55% of current accounts and that profitability pressure rises as institutions try to move
              beyond niche products. Riotimes and public-peer disclosures show why: Nubank, Inter, PicPay, C6, PagBank,
              and Mercado Pago all operate at far larger scale than a startup but still compete on user experience,
              embedded credit, and principality. RankingsLatAm survey work reinforces that distribution is no longer
              enough; digital reliability and satisfaction are central competitive variables, with PagBank, Nu, and
              Mercado Pago leading APS rankings while Inter excels at minimising dissatisfaction. Macro conditions are
              also non-trivial. High rates, delinquency volatility, and the cost of funding can quickly compress returns
              in a market where low-fee accounts alone do not pay the bills. The right market verdict is therefore
              positive on demand and infrastructure, but sober on monetisation: Neon is playing in a very large market,
              yet the reachable value pool belongs only to institutions that can turn gross accounts into active,
              low-cost, well-underwritten financial relationships.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
