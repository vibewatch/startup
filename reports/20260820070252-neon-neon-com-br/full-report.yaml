          detail: Correspondents and product-specific counterparties
        - id: github
          label: GitHub + cloud stack
          detail: CI/CD, tooling, and platform operations
        - id: app
          label: Neon user experience
          detail: What the customer actually experiences
      edges:
        - from: stores
