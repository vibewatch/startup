      - number: '8.4'
        title: >-
          Comparables and exit readiness: Neon deserves comparison to scaled digital-finance peers, but not on a
          one-metric shortcut
        blocks:
          - type: paragraph
            body: >-
              The comparable set should include public and private references that illuminate what the market rewards in
              digital finance: scale, profitability, funding durability, product breadth, and customer depth. Inter,
              PagBank, Mercado Pago, PicPay, and C6 all help in different ways. Inter shows that a publicly listed
              Brazilian digital-banking platform can monetize at scale; PagBank shows a payments-rooted platform with
              profitable customer depth; Mercado Pago demonstrates the valuation power of a finance engine embedded in a
              larger ecosystem; PicPay highlights high revenue with a wallet-led platform; and C6 illustrates how a
              broad challenger-bank stack competes on both scale and profitability. None is a perfect multiple comp for
              Neon, but together they reveal the bar. Exit readiness is more uncertain. Several 2025 sources suggest
              management is thinking in IPO terms over a multi-year horizon, yet public evidence still lacks the kind of
              disclosure quality and stability that public-market investors would demand. Neon is therefore closer to
              pre-IPO option value than to clear IPO readiness.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
