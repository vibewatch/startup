  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from real scale and progress into a valuation discipline gate defined by missing
      denominators.
    data:
      nodes:
        - id: scale
          label: 32M clients + scaled product set
          detail: Neon clearly built meaningful reach and breadth.
        - id: progress
          label: Improving economics
          detail: Breakeven, profit signals, and funding diversity improved.
        - id: validation
          label: Institutional validation
          detail: IFC, DEG, BBVA, and General Atlantic supported the 2025 extension.
        - id: opacity
          label: Key denominator opacity
          detail: Primary use, dilution terms, and risk-adjusted returns remain unclear.
        - id: price
          label: Track / research-more
          detail: Proceed only if price and evidence improve together.
      edges:
        - from: scale
          to: price
        - from: progress
          to: price
        - from: validation
          to: price
        - from: opacity
          to: price
    approximationNotes: >-
      Recommendation map is qualitative and reflects the relative weight of public proof versus unresolved pricing
      inputs.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
      - CV013
      - CV033
