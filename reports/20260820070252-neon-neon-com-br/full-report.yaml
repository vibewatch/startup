      - number: '2.3'
        title: >-
          Buyer, user, and payer segmentation: mass-market consumer first, MEI second, employers and rails as indirect
          enablers
        blocks:
          - type: paragraph
            body: >-
              At the front end, the buyer, user, and payer are often the same person: a Brazilian consumer using a
              mobile device as the primary interface for payments, balances, and short-duration credit. TechCrunch and
              Neons own positioning both stress working-class and underbanked households, not affluent or enterprise
              users. A second important segment is the MEI / micro-entrepreneur cohort, where banking, receivables
              timing, tax routines, and personal-business cash mingling create adjacent needs that consumer banks can
              solve through bundled workflows. The MEI Fácil integration is therefore strategically important because it
              lowers acquisition friction into a segment where financial-operating pain is more acute and engagement can
              be higher. Budget ownership differs by product: the consumer owns transaction and savings decisions, but
              payroll-lending penetration also depends on employer agreements and credit-risk rails. Open Finance adds
              another buyer-behaviour twist: pricing power increasingly depends on access to external data and on
              whether the app becomes the place where users consent to move balances, not only where they open an
              account.
            claimRefs:
              - CM016
              - CM017
