  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and regulatory perimeter
        blocks:
          - type: paragraph
            body: >-
              Neon is a privately held Brazilian digital banking group headquartered in São Paulo and founded in 2016.
              Its own institutional materials describe the company as an authorised payment institution supervised by
              Banco Central do Brasil, built to serve everyday Brazilian workers with digital accounts, credit cards,
              loans, Pix, and savings products without the fee complexity that historically burdened incumbent-bank
              customers. The origin story is consistent across official and independent coverage: founder Pedro Conrade
              launched Neon after experiencing opaque bank fees firsthand and positioned the company around access,
              simplicity, and financial inclusion rather than premium banking. TechCrunch and the company timeline also
              make clear that Neon expanded from a prepaid-card and payments proposition into a fuller bank-like stack
              as it tried to become the primary financial relationship for lower- and middle-income users rather than
              only a secondary card or spending app.
