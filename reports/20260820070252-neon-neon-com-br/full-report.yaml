  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue stream
      - Mechanism
      - Unit / driver
      - Current public status
      - Revenue quality read
      - Diligence ask
    rows:
      - - Card receivables / revolving economics
        - Interest, fees, and receivable monetisation from card book
        - Outstanding receivables, payment behaviour, APR and loss rates
        - Clearly material; card is the dominant credit-book component
        - Potentially strong, but highly sensitive to delinquency and funding cost
        - Request product-level yield, charge-off, and revolving mix
      - - Personal loans
        - Interest income from unsecured installment lending
        - Originations, approvals, yield, expected losses
        - Disclosed as a growing product line
        - Can diversify monetisation, but credit quality matters
        - Request vintage curves and net interest margin by cohort
      - - Payroll-linked lending
        - Interest income from consignado privado
        - Employer/worker access, balance growth, yields, defaults
        - Growing faster than card from a smaller base
        - Potentially better risk-adjusted economics than unsecured credit
        - Request employer/channel mix and realized loss performance
      - - FGTS advance
        - Secured/structured consumer credit tied to FGTS flows
        - Eligible users, advance size, pricing, take-up
        - Publicly marketed but no revenue split disclosed
        - Likely attractive if underwriting and fraud remain controlled
        - Request volume, yield, and repeat-use data
      - - CDB / deposit spread support
        - Funding collected from customers and deployed into assets
        - Deposit balances, funding cost, duration
        - Very visible in statements and 2025 coverage
        - Supports margin if cost of funds stays disciplined
        - Request weighted average funding cost and beta
      - - Payment / interchange economics
        - Card usage and transaction-service economics
        - Active cards, spend, interchange, settlement volume
        - Economically relevant but not separately disclosed
        - Helps monetize engagement but unlikely to carry the model alone
        - Request TPV, active-card rate, and gross interchange contribution
    notes: >-
      The retained evidence supports a credit-led financial model supported by engagement and funding spread rather than
      fee-heavy banking.
