      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Brazil is not an adoption-risk market anymore
            body: >-
              Digital banking, Pix, and Open Finance are already mainstream. The investment debate has shifted from
              whether users will adopt digital finance to which institution wins primary usage and monetises it
              responsibly.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM023
              - CM025
          - type: callout
            title: Multi-homing makes customer-count headlines less meaningful
            body: >-
              When Brazilians maintain 4.4 bank relationships on average and satisfaction benchmarks matter this much,
              gross account count is a weak proxy for durable revenue quality.
            calloutType: risk
            claimRefs:
              - CM011
              - CM031
              - CM032
          - type: callout
            title: The underbanked credit gap still leaves room for focused challengers
            body: >-
              Despite high account penetration, gaps in credit-card access, principality, and MEI workflow tooling leave
              a real reachable market for a specialist like Neon.
            calloutType: strength
            claimRefs:
