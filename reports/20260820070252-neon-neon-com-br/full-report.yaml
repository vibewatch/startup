  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation and current pricing context: quality is credible, price support is incomplete'
        blocks:
          - type: paragraph
            body: >-
              Neon looks too substantial to dismiss and too opaque to underwrite casually. The 2025 extension round
              clearly validated the company with IFC, DEG, BBVA, and General Atlantic, while several 2025 reports tie
              the round to a business that had reached breakeven in late 2024, posted quarterly profit in early 2025,
              and kept expanding credit and engagement. But price discipline still matters. The most recently
              well-established valuation anchor is the 2022 unicorn round at roughly US$1.6 billion. The 2025 extension
              did not publicly disclose an updated valuation; management only reiterated unicorn status and the
              strategic rationale for taking more equity capital. That means investors are forced to reason from stale
              valuation anchors plus improving but incomplete operating evidence. On that record, the right call is
              track / research-more with medium confidence: positive enough to keep diligence active, but not
              transparent enough to support a buy recommendation at an unspecified or potentially still-rich mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
