      - number: '7.4'
        title: 'Financial/model and execution risk: the real threat is not growth collapse but low-quality growth'
        blocks:
          - type: paragraph
            body: >-
              The financial risk profile comes from scale, not from absence of scale. Public sources show a large and
              growing credit book, a move toward CDB-based funding, intermittent profitability, and still-visible loss
              and competition pressure. This is exactly the kind of setup where poor underwriting, rising funding costs,
              weak customer principality, or excessive reliance on less durable cohorts can compress value quickly even
              if headline accounts continue growing. June 2025 statements show more than R$7 billion of gross
              receivables before provisions, while year-end filings and 2026 reporting point to more than R$5.3 billion
              of CDB funding and a still-material loss history despite improvement. Add elevated-rate and delinquency
              conditions, and the core risk becomes clear: Neon may keep growing but fail to translate growth into
              durable, risk-adjusted returns. Execution risk also matters at management level because the firm is
              balancing product expansion, MEI migration, credit growth, and operational discipline at once.
            claimRefs:
              - CR024
