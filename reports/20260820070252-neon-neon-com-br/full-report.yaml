      - number: '4.4'
        title: >-
          Cost structure, working capital, and capital adequacy: funding mix has improved, but the model remains
          balance-sheet intensive
        blocks:
          - type: paragraph
            body: >-
              Neons public filings show a balance-sheet business, not a lightweight software model. The group funds
              customer operations through payment-account balances, CDB issuance, FIDCs, and equity capital, then
              converts that funding into credit assets and payment obligations. June 2025 consolidated statements show
              R$956.1 million of client payment-account balances, R$5.30 billion of term deposits/CDBs, and ongoing
              card-settlement obligations through Visa. The same filings explicitly say Neon is reducing exclusive
              dependence on FIDCs and increasing the role of CDBs issued by Neon entities, while 2025 media coverage
              says CDB funding reached R$5.3 billion. This is strategically positive because it can lower cost and
              improve funding control, but it also makes liabilities to customers more visible and raises the need for
              disciplined asset-liability management. Equity remains important: the Series E round eventually totalled
              R$720 million, and management told Startups that the company had more than R$1 billion in cash while still
              needing capital to keep growing. That combination—improving internal economics but continued capital
              reinforcement—supports a verdict of maturing resilience rather than self-funding inevitability.
