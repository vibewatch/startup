  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: the economic engine is credit-led, not fee-led'
        blocks:
          - type: paragraph
            body: >-
              Neons public product surface looks broad—account, Pix, card, CDB, Viracrédito, payroll-linked products,
              FGTS advance, and MEI-adjacent features—but the retained evidence suggests the economic engine is credit
              intermediation supported by transaction engagement and deposit gathering. The companys public account
              pages emphasize low-friction banking and low visible fees, which makes it unlikely that account
              maintenance itself is the core revenue pool. Instead, the clearer monetisation vectors are card-related
              receivables, personal credit, payroll-linked lending, structured credit products, interchange/payment
              economics, and funding spread captured through CDB issuance and credit-book deployment. Viracrédito is
              especially revealing: it turns customer savings behavior into better credit eligibility, showing how Neon
              uses deposits and engagement as precursors to monetisable lending rather than as ends in themselves.
              Public revenue recognition remains only partly visible, but available filings and news support a
              credit-led model whose revenue quality depends on credit selection, funding cost, and continued customer
              engagement rather than pure subscription or SaaS-style recurring revenue.
