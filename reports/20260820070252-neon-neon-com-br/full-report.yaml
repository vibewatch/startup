        title: Scale, product breadth, and operating metrics
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence is unusually rich for a private Brazilian fintech. Neons about page says the company
              serves 32 million clients and has backing from global investors; Estadão later described the base as more
              than 32 million customers and said Neon opened 2.4 million new accounts in the first half of 2025 alone.
              The companys official and semi-official materials also show product breadth: digital account, credit and
              debit cards, Pix, personal loans, payroll loans, FGTS advance, CDB savings products, Viracrédito,
