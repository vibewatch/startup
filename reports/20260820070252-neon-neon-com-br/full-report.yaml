              - CV033
      - number: '8.2'
        title: 'Thesis versus anti-thesis: the debate is about quality of scale, not existence of scale'
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward. Neon has massive gross reach, improving economics, stronger funding
              diversity, product breadth, and continued institutional validation. It operates in a large digital-finance
              market, and the 2025 extension from development-finance institutions suggests more than superficial
              momentum. The anti-thesis is equally serious: Brazil is crowded, customer multi-homing is structural,
              credit losses and funding cost can erase apparent progress quickly, and the company still does not
              disclose the quality metrics that would tell investors how much of its 32 million base is truly primary
              and profitable. This matters because a scaled fintech can still be overvalued if the market mistakes gross
              reach for durable economic depth. Put differently, the investment question is not whether Neon built
              something real. It did. The question is whether the existing or implied price already captures most of the
              upside before investors see principality, risk-adjusted credit returns, and true exit readiness.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
