      - number: '6.5'
        title: 'Customer verdict: mass adoption is credible; customer-quality proof is still the missing link'
        blocks:
          - type: paragraph
            body: >-
              The customer verdict should separate scale from depth. Neon clearly has significant top-of-funnel reach,
              an offering built for everyday financial jobs, and enough engagement to generate large app-store
              footprints, MEI migration needs, and measurable complaint-resolution activity. That is far stronger proof
              than a simple logo wall. Yet the case is still incomplete because the company does not publicly break out
              monthly actives, principal-account penetration, multi-product attachment by segment, or long-run cohort
              retention. A buyer should therefore view the customer base as a real asset whose quality is plausible but
              not yet fully transparent. The decisive customer diligence request is not another headline account count;
              it is a segmentation-and-cohort package showing how many users actively engage, how many treat Neon as
              primary, how many expand into credit or MEI products, and how durable those behaviors remain over time.
