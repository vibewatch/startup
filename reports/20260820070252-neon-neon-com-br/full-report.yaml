      - number: '7.3'
        title: 'Partner and dependency risk: Neon is a single app for users but a network of dependencies underneath'
        blocks:
          - type: paragraph
            body: >-
              The app experience hides a dense dependency network. Product execution touches app stores, Visa and
              settlement rails, Banco Central frameworks, Open Finance/Pix permissions, Neon Financeira,
              correspondent-bank structures, and product-specific partners such as those visible in privacy and
              MEI/ConsigaMais materials. Engineering velocity also depends on GitHub Enterprise, cloud/integration
              tooling, and surrounding security workflows. None of these dependencies is inherently fatal; in fact, they
              are common in fintech. The risk is cumulative: as Neon tries to become a one-stop financial surface, more
              parts of the experience depend on external entities, permissions, and platforms outside direct end-user
              visibility. This makes partner and regulatory coordination a first-order operating competency. A missed
              migration, partner service issue, or policy change can look to the user like a Neon product failure even
              when the root cause sits elsewhere.
            claimRefs:
              - CR017
