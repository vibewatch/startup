  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The Brazilian competitive field is best viewed as concentric circles rather than a single peer list.
              Direct peers are digital banks that target retail consumers with transaction accounts, cards, credit, and
              savings products—Nubank, Inter, C6 Bank, PagBank, and PicPay all fit part of this frame. A second ring
              includes ecosystem-heavy finance platforms such as Mercado Pago, which combine wallet, marketplace,
              merchant, and credit loops strong enough to compete for the same primary financial relationship even if
              they were not born as banks. A third ring is the incumbent-bank status quo, which still matters because
              the average Brazilian keeps multiple banking relationships. Neon therefore competes not only against other
              apps, but against inertia, payroll-linked incumbency, employer distribution, and merchant ecosystems. The
              strategic implication is that Neons true competition is any platform that can own the customers daily
              balance, payment habit, and credit decision—not just any company calling itself a neobank.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
