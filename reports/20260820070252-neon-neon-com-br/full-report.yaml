      - number: '1.2'
        title: Founders, leadership transition, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder identity is anchored most strongly to Pedro Conrade, who appears repeatedly in the historical
              record as founder and early chief executive. Independent founder interviews and TechCrunch coverage place
              him at the centre of Neons launch and early mission; the companys 2025 executive-signature pages still
              list him among top executives even after the formal leadership handoff. The governance picture changed
              materially in December 2024, when Neon announced Fernando Miranda as chief executive and moved Conrade to
              the board, signalling a shift from founder-led hypergrowth toward professionalised scaling and
              profitability discipline. That transition matters because 2025 operating commentary increasingly came from
              Miranda, Jamil Marques, and Wilton Pinheiro rather than Conrade. Public sources also show 2025
              management-bench building in legal, compliance, risk, and technology, but they do not disclose a full
              board roster, committee structure, ownership percentages, or investor-control provisions. The result is
              adequate visibility on senior management but still incomplete visibility on formal governance for
              institutional diligence.
