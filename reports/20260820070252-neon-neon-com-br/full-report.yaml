      - number: '7.2'
        title: 'Operational, security, and customer-trust risk: scale improves process maturity but also raises blast radius'
        blocks:
          - type: paragraph
            body: >-
              Operationally, Neon looks much more mature than a tiny early-stage fintech. GitHub case-study evidence
              indicates meaningfully stronger CI/CD discipline, faster deployments, and better security visibility.
              Public trust materials also show privacy, LGPD, Open Finance, and fraud-prevention controls are taken
              seriously. Yet a mass-market digital bank remains unusually exposed to operational trust shocks: app
              instability, fraud spikes, customer-support bottlenecks, payment or card outages, or bad migrations can
              quickly damage brand and activity. Reclame Aqui is useful here because it shows both mitigation and
              residual risk at once. RA1000 status and strong response/resolution metrics indicate Neon can handle large
              support volume, but the complaint corpus confirms that support, fraud, and debt-negotiation disputes are
              not theoretical risks. The practical implication is that operational risk at Neon is about reliability and
              customer repair at scale, not about whether the company knows these issues exist.
            claimRefs:
              - CR009
              - CR010
