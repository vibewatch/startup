      - number: '3.5'
        title: 'Moat durability: meaningful brand and segment fit, but little evidence of an unassailable moat'
        blocks:
          - type: paragraph
            body: >-
              The most defensible bullish case for Neon is not a proprietary technical moat; it is focused positioning.
              The companys working-class brand, MEI adjacency, simplified UX, savings-linked credit tools, and improving
              funding independence give it a coherent operating thesis. But public evidence does not support a claim of
              deep structural defensibility. Pix and Open Finance make the underlying rails more open, peer products
              increasingly overlap, and stronger ecosystems can subsidise customer acquisition with commerce, merchant
              services, or marketplace activity. Even customer-experience leadership is contestable: RankingsLatAm shows
              other platforms already scoring at excellence-level APS marks. The right durability conclusion is
              therefore conditional. Neon can still carve out a valuable place if it converts gross accounts into
              primary and profitable relationships better than the market expects; however, commoditisation, pricing
              pressure, and adjacent-super-app encroachment are real and should be treated as persistent competitive
