      - number: '8.5'
        title: >-
          Kill triggers and final diligence: the investment case should move only if valuation and evidence improve
          together
        blocks:
          - type: paragraph
            body: >-
              The most important discipline at this point is linking price to evidence. If the company can show
              principality, product-level economics, cohort retention, funding cost control, and credit performance that
              justify a premium to the old unicorn mark, the recommendation can move up. If it cannot, the right move is
              patience or a lower required entry price. The same logic applies to downside triggers: a worsening funding
              mix, weaker complaint and customer-quality indicators, hidden dilution or preference overhang, or delayed
              progress toward stable profitability would all make an already-uncertain mark less attractive. The final
              diligence agenda is therefore concrete. Resolve the cap-table and preference stack, verify updated
              valuation terms, test customer-quality cohorts, and understand risk-adjusted book performance. Only then
              can an investor decide whether Neon is fairly priced, stretched, or still attractive relative to its
              next-stage outcomes.
            claimRefs:
              - CV033
