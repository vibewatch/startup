      - number: '7.5'
        title: 'Mitigations, monitoring, and kill criteria: several risks are manageable if specific metrics improve'
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the risk picture is that most top risks have monitorable mitigations rather than
              purely binary outcomes. Funding independence can be tracked through cost-of-funds and CDB/FIDC mix;
              customer-quality risk through primary-account and multi-product rates; underwriting risk through
              delinquency and repeat-borrow cohorts; support risk through complaint-resolution quality and app-store
              trend direction; dependency risk through migration milestones, partner concentration, and incident
              history. The harder issue is transparency: many of these indicators are not publicly disclosed in
              sufficient detail. That means the investment case should probably not break on one scary historical
              headline, but it should break if management cannot produce evidence on the quality of accounts,
              risk-adjusted credit performance, and operational resilience behind the improving top-line story. In
              short, the largest risks are real but testable.
