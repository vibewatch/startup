        blocks:
          - type: paragraph
            body: >-
              The cleanest way to understand Neons product is by customer workflow, not by legal-entity labels. A user
              typically enters through a digital account, virtual or physical card, Pix, and basic money movement; from
              there the app tries to become the daily financial operating surface through credit, savings/CDB,
              Viracrédito, loans, FGTS advance, and increasingly a unified MEI area. Public materials consistently frame
              Neon as a transparent, low-friction financial app rather than a narrow single-product lender. That matters
              because the product experience is built around habit loops: transact, hold some balance, qualify for or
              expand credit, and add adjacent financial tasks without leaving the app. The MEI migration materials make
              the workflow even clearer by merging personal and microbusiness tasks into one interface. In practice,
              Neon is delivering a bundled consumer-finance workflow whose technical burden is not only feature
              development but reliable orchestration of payments, card issuing, credit decisions, notifications,
              support, and compliance controls.
