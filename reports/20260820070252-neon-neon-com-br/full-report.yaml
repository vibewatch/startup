            body: >-
              Neons customer base is best segmented by economic profile and use case rather than by traditional
              enterprise categories. The company explicitly speaks to the trabalhador brasileiro and was described by
              TechCrunch as focused on working-class and underbanked Brazilians. Public app-store copy and product pages
              reinforce this positioning: the buyer, user, and payer are usually the same person opening an app-based
              account, using Pix, requesting a card, and potentially adding CDB or credit. A second important segment is
              the micro-entrepreneur or MEI, where Neon is trying to combine personal banking with light business
              administration and credit needs. This is not a B2B enterprise-customer story; it is a mass retail customer
              story with a meaningful MEI adjacency. The implication is that user counts can grow quickly, but customer
              quality hinges on becoming the principal everyday finance app rather than merely a secondary account among
