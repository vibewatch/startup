- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Mobile app surfaces
    - Primary customer interface for account, card, Pix, MEI, and support flows
    - App stores, mobile release cadence, device compatibility
    - Mobile reliability or app-store friction can disrupt growth
  - - Product orchestration layer
    - Unifies consumer finance, savings, lending, and MEI features under one brand
    - Internal APIs and release tooling
    - Hidden complexity rises as modules converge
  - - Regulated entity / partner layer
    - Routes products through Neon Pagamentos, Neon Financeira, and selected correspondents or partners
    - Regulatory permissions and partner uptime
    - External entities can slow launches or create control boundaries
  - - CI/CD and developer platform
    - GitHub Enterprise, Actions, reusable workflows, issue tracking
    - GitHub platform and internal DevOps governance
    - Tooling centralization reduces friction but concentrates platform reliance
  - - Data / integration infrastructure
    - AWS, Kafka, RabbitMQ, Vault, Kubernetes, security tooling
    - Cloud, message-bus, secrets, and cluster operations
    - Operational incidents or bad migrations could affect many workflows
  - - Security / compliance controls
    - Vulnerability analysis, false-positive logic, privacy controls, fraud prevention
    - Control execution across repos, vendors, and user workflows
    - Public proof of external certification depth is limited
  notes: This table is evidence-backed but still partial because Neon does not publish a formal public architecture diagram.
