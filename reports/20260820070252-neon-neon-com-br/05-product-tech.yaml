- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Neon solution
  - Measurable benefit
  - Limitation
  rows:
  - - Open and fund a digital account
    - Download app, verify identity, activate account, start using Pix
    - Single mobile-first account flow with card and Pix
    - Lower branch friction and fast onboarding
    - Conversion / abandonment metrics not public
  - - Use a card without maintenance complexity
    - Request card and manage from app
    - No-annuity card with virtual and physical use cases
    - Simple everyday spending surface
    - Approval rates and credit-line quality not public
  - - Build or restore credit access
    - Set money aside and tie it to credit behaviour
    - Viracrédito converts saved value into better credit access probability
    - Potentially expands access for thin-file users
    - Does not guarantee approval and may cap upside
  - - Borrow at lower-friction terms
    - Use FGTS or payroll-linked product inside/app-adjacent workflow
    - Structured lending products beyond generic unsecured credit
    - Can improve affordability and conversion
    - Dependent on eligibility, partner rails, and regulation
  - - Manage MEI obligations while keeping personal banking nearby
    - Migrate MEI Fácil records and use Area MEI inside Neon
    - Unified PF + MEI workflow
    - Higher engagement and cross-sell potential
    - Some older MEI features are being discontinued
  - - Share data for personalization or new features
    - Consent via Open Finance / Pix ecosystem evolution
    - Data portability and richer app utility
    - Better underwriting or account aggregation potential
    - Public proof of realized benefit is limited
  notes: The strongest product story is workflow consolidation, not standalone feature novelty.
