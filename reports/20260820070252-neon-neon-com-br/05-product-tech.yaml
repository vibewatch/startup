  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-proof
    missingEvidence: Public uptime history, error budgets, incident metrics, or service-level objectives for the app and major product flows.
    whyItMatters: A multi-product consumer-finance app can look mature architecturally while still failing operationally under scale or dependency stress.
    diligencePath: Request reliability dashboards, incident history, and release rollback metrics.
    relatedQuestionRefs:
    - QE018
    - QE024
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: external-security-attestation
    missingEvidence: Independent public security attestations or audit reports comparable to SOC 2 / ISO-style trust proof.
    whyItMatters: Narratives about security workflows are helpful but not equivalent to third-party control validation.
    diligencePath: Request recent audit reports, pentest summaries, and certification scope.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: partner-map-completeness
    missingEvidence: A fully enumerated vendor and partner map across all rails, KYC, fraud, cloud, messaging, and analytics components.
    whyItMatters: The product works across many hidden dependencies; incomplete partner mapping can conceal concentration risk.
    diligencePath: Request architecture and vendor inventory under NDA.
    relatedQuestionRefs:
    - QE011
    - QE024
    relatedTableRefs:
    - TE003
