- id: growth-drivers-and-adoption-tailwinds
  title: 'Growth drivers: Pix, Open Finance, mobile distribution, and still-open credit formalisation'
  body: 'The strongest market tailwinds are infrastructural. McKinsey says Pix processed around 63 billion transactions in 2024, had 158 million users, and brought 71.5 million Brazilians into the digital-payments system; the BCBs own Pix page shows more than 170 million users and 7 billion transactions in January 2026, with a 313.3 million record single day in December 2025. Those numbers matter because Neon can build on a default payment rail rather than educate the market from scratch. Open Finance is the second tailwind: McKinsey cites more than 64 million active data-sharing consents and 9.2 billion monthly API calls, while BCB communications frame the system as globally scaled and still expanding. Together, these rails reduce onboarding friction, make credit underwriting more data-driven, and allow new features such as Pix Automático, NFC Pix, and cross-institution account aggregation to compound user engagement. FIDC growth and a still-large corporate-credit gap also matter indirectly,
    because they deepen the private-credit and structured-finance plumbing behind consumer and small-business lending.'
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  figureRefs:
  - FM002
- id: constraints-competition-and-market-verdict
  title: 'Constraints, competition, and verdict: large opportunity, but profitability pressure is structural'
  body: 'The same market that makes Neon possible also makes the business harder. McKinsey notes that fintechs already hold 55% of current accounts and that profitability pressure rises as institutions try to move beyond niche products. Riotimes and public-peer disclosures show why: Nubank, Inter, PicPay, C6, PagBank, and Mercado Pago all operate at far larger scale than a startup but still compete on user experience, embedded credit, and principality. RankingsLatAm survey work reinforces that distribution is no longer enough; digital reliability and satisfaction are central competitive variables, with PagBank, Nu, and Mercado Pago leading APS rankings while Inter excels at minimising dissatisfaction. Macro conditions are also non-trivial. High rates, delinquency volatility, and the cost of funding can quickly compress returns in a market where low-fee accounts alone do not pay the bills. The right market verdict is therefore positive on demand and infrastructure, but sober on monetisation:
    Neon is playing in a very large market, yet the reachable value pool belongs only to institutions that can turn gross accounts into active, low-cost, well-underwritten financial relationships.'
  claimRefs:
