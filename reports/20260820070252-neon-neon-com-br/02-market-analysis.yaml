- id: TM002
  title: Buyer and segment table
  columns:
  - Segment
  - Primary need
  - Budget owner / decision maker
  - Why Neon fits
  - Key friction
  rows:
  - - Working-class salaried consumer
    - Low-cost daily banking and cash-flow control
    - Individual user
    - Fee-light app, Pix, cards, credit, CDB, payroll products
    - Low switching cost and low loyalty across multiple apps
  - - Underbanked / thin-file user
    - Credit access and score-building
    - Individual user
    - Viracrédito and behaviour-linked limit growth
    - Underwriting and fraud costs can erase economics
  - - Consumer saver
    - Safe return on small balances
    - Individual user
    - CDB and balance-yield propositions
    - Deposit balances are price-sensitive and portable
  - - Payroll-loan customer
    - Lower-cost structured credit
    - User plus employer/payroll ecosystem
    - Payroll and FGTS products fit formal-worker use cases
    - Access depends on employer channels and regulation
  - - MEI / micro-entrepreneur
    - Business-operating money movement and lightweight admin
    - Owner-operator
    - MEI Fácil integration and business-oriented workflow tools
    - Segment may already use multiple apps and informal processes
  - - Family financial organiser
    - Centralising bills, Pix, and recurring flows
    - Household decision maker
    - Pix plus budgeting / account controls can build primary use
    - Retention depends on reliability and trust, not just sign-up
  notes: Segmentation is evidence-constrained and emphasises where buyer, user, and payer are often the same person.
