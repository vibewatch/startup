- id: TM005
  title: Sizing contradictions and diligence asks
  columns:
  - Issue
  - What the public record says
  - Why it matters
  - Next diligence step
  rows:
  - - Underbanked denominator
    - Secondary sources disagree on how many Brazilians remain underbanked or lack credit products
    - Affects TAM/SAM precision and credit-penetration assumptions
    - Request management SAM model and align with BCB segment data
  - - Primary-account rate
    - Neon discloses 32M clients but not primary-account penetration
    - Gross installed base can overstate monetisable SOM
    - Request MAU, salary inflow, and principal-account metrics
  - - Market-size vocabulary
    - Reports mix fintech-market value, banking-pool revenue, payment volume, and VC funding
    - Different lenses can mislead valuation work if treated as interchangeable
    - Normalize to one market-sizing framework before underwriting
  - - Open Finance monetisation
    - Infrastructure scale is clear, but direct revenue capture by each challenger is not
    - Adoption of rails does not guarantee profitable customer ownership
    - Test cohort conversion from connected accounts into funded credit and deposits
  notes: Captures the main market-analysis uncertainties that remain unresolved even after extensive public-source review.
