tables:
- id: TM001
  title: Market sizing lens table
  columns:
  - Lens
  - Evidence
  - Implied market size / meaning
  - Use for Neon
  - Caveat
  rows:
  - - National population
    - IBGE estimated 213.4M residents in 2025
    - Very large top-of-funnel population
    - Sets hard ceiling for consumer-account TAM
    - Population is not the same as bankable or digital addressable users
  - - Digitally engaged citizens
    - McKinsey cites 200M+ digitally engaged citizens
    - Near-national digital reach
    - Supports mobile-first distribution economics
    - Digital reach does not guarantee monetisable engagement
  - - Adult banking penetration
    - McKinsey says 90% of adults were banked by 2025
    - Most adults already have accounts
    - Shifts focus from onboarding to principality and credit attach
    - High penetration means intense competition for primary use
  - - Current-account share
    - Fintechs hold 55% of current accounts
    - Digital-first players already mainstream
    - Validates digital model and lower branch need
    - Also shows market is no longer greenfield
  - - Underbanking / card gap
    - Riotimes says 60M still lack credit cards and 30%-50% remain underbanked
    - Large SAM for credit-building and low-friction finance
    - Supports Viracrédito, payroll, FGTS, and MEI plays
    - Secondary source; exact official denominator varies
  - - Neon installed base
    - Neon says 32M clients
    - Meaningful SOM foothold already built
    - Demonstrates distribution, but not primary-account status
    - Gross clients can overstate active-quality base
  notes: Combines official demographic data, BCB-linked infrastructure metrics, and secondary market analysis to distinguish TAM from realistic monetisable opportunity.
