slug: neon-neon-com-br
runDate: '2026-08-20'
company:
  name: Neon
chapter:
  number: 2
  title: Market Analysis
  summary: 'Neon operates inside one of the worlds deepest digital-finance experiments: Brazil combines a 213.4 million population, very high smartphone penetration, Pix ubiquity, and Open Finance scale with intense competition and still-meaningful underbanking. McKinsey, BCB, and market sources suggest 90% of adults are banked, fintechs already hold 55% of current accounts, and Pix / Open Finance continue to lower switching and product-distribution costs. The opportunity is therefore large, but it is no longer a blank-market story; Neons SAM is best understood as working-class consumers and micro-entrepreneurs who still need primary-bank, credit, and savings relationships rather than merely another low-cost account.'
sections:
- id: market-boundary-and-what-counts
  title: 'Market boundary: consumer digital banking plus adjacent credit, savings, and MEI workflows'
  body: The relevant market for Neon is broader than consumer current accounts but narrower than all Brazilian financial services. Neon competes in digital transaction accounts, payment flows, credit cards, personal loans, payroll-linked lending, FGTS advance, savings/CDB capture, and lightweight business-finance tools for MEIs. McKinsey describes Brazil as a full-stack digital-finance system in which Pix, Open Finance, digital identity, and tokenised rails are rewiring how consumers and small businesses transact. That makes the included spend pools everyday balances, payment activity, short-duration consumer credit, savings products, and micro-entrepreneur operating finance; excluded from the core market are wholesale banking, capital-markets origination, and complex affluent wealth management. Neon therefore sits between a neobank, a lender, and an engagement-led financial super app. The market boundary matters because the companys core question is not whether Brazilians want any digital
    account—they already do—but whether Neon can become the primary relationship for price-sensitive and underbanked users whose financial activity now moves easily across mobile apps.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM001
- id: tam-sam-som-lenses
  title: 'TAM/SAM/SOM lenses: Brazil is huge, but principality is the true scarce resource'
  body: 'The country-level opportunity is large even before making aggressive assumptions. IBGE put Brazils 2025 population at 213.4 million, while McKinsey estimated more than 200 million digitally engaged citizens, 188 million mobile-internet users, and 90% adult banking penetration by 2025. Those facts create a vast TAM for digital financial services but also show why one broad market-size number can be misleading: if almost all adults already hold an account and the average Brazilian maintains 4.4 bank relationships, the bottleneck is not initial onboarding but share-of-wallet, engagement, and risk-adjusted monetisation. Neon itself reported 32 million clients, meaning it has already penetrated a meaningful slice of the countrys population on a gross-account basis. A more useful SAM is the subset of working-class consumers and MEIs who remain under-served on credit, savings, and primary-account quality. Riotimes still describes 60 million adults as lacking credit cards and 30% to 50%
    of the population as underbanked, which helps explain why Neons product roadmap keeps returning to secured-limit cards, payroll credit, FGTS advance, and MEI workflows rather than only card acquisition.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
