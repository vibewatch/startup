- id: TM003
  title: Driver and constraint table
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters
  - Implication for Neon
  rows:
  - - Pix ubiquity
    - Tailwind
    - 63B transactions in 2024; 170M+ users by 2026
    - Cuts payment friction and normalises account-based finance
    - Enables low-cost transaction acquisition and card substitution
  - - Open Finance scale
    - Tailwind
    - 64M+ active consents and 9.2B monthly API calls
    - Improves underwriting and account aggregation
    - Supports more targeted credit and cross-sell
  - - Smartphone reach
    - Tailwind
    - 188M mobile internet users
    - Keeps distribution digital-first
    - Reduces branch disadvantage versus incumbents
  - - High account multiplicity
    - Headwind
    - 4.4 bank accounts per person on average
    - Users can multi-home easily
    - Principality is more important than gross sign-ups
  - - Peer scale
    - Headwind
    - Large incumbents and major fintechs already massive
    - Customer acquisition is expensive when everyone is digital
    - Neon must differentiate on experience, not existence
  - - Rate environment
    - Headwind
    - Public peers and media highlight high-rate pressure
    - Funding and delinquency can compress returns
    - Credit growth must stay disciplined
  - - MEI digitisation
    - Tailwind
    - MEI integration / product pages show adjacent need
    - Extends consumer CAC into higher-frequency workflows
    - Opportunity depends on product depth beyond marketing
  - - Customer-experience benchmarking
    - Mixed
    - APS surveys reward reliability and breadth
    - Retention and referrals hinge on app quality
    - Operations and support are now strategic, not peripheral
  notes: Pairs infrastructure tailwinds with monetisation headwinds to show why Brazil is attractive but unforgiving.
