- id: TM004
  title: Peer scale benchmark table
  columns:
  - Player
  - Scale signal
  - Monetisation / profit signal
  - Market implication for Neon
  - Source vintage
  rows:
  - - Nubank
    - 131M customers per Riotimes 2025 summary
    - Secondary source says $16.3B revenue and $2.9B net income
    - Sets upper bound for digital-bank scale and brand gravity
    - 2025 secondary summary
  - - Inter
    - 45.3M customers, 58.3% activation
    - R$5.1B H1-2026 revenue and R$815.9M net profit
    - Shows super-app peers can monetise at scale
    - H1 2026
  - - PicPay
    - 67M total accounts / 42.7M active in FY2025; 68.6M total in Q1 2026
    - R$10B+ FY2025 revenue; R$3.5B Q1-2026 revenue
    - Demonstrates wallet-to-credit monetisation intensity
    - 2025-2026
  - - C6 Bank
    - 40M clients and 100+ products / services
    - R$2.5B net income in 2025
    - Highlights scale of full-stack challenger-bank competition
    - FY2025
  - - PagBank
    - 34M clients
    - R$678M 4Q25 recurring profit; R$40.7B deposits
    - Shows a payments-rooted platform can build profitable banking depth
    - 4Q25
  - - Mercado Pago / MercadoLibre fintech
    - 88M fintech MAUs; $23B AUM; $16B+ credit book
    - Fast-scaling fintech ecosystem with strong engagement loops
    - Raises competitive bar on ecosystem breadth and daily use
    - Q2 2026
  - - Neon
    - 32M clients
    - Breakeven in 2024 and first-quarter 2025 profit disclosed
    - Large installed base, but smaller balance-sheet and profit cushion than major peers
    - '2025'
  notes: Uses latest available public peer metrics to show Neons market position in a crowded digital-banking field.
