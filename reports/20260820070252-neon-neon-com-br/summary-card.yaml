    totalRaisedUsdM: 924
    customerCount: 32000000
    headcount: 1000
  topStrengths:
    - 32M-client scale, broad digital-banking workflow, and MEI adjacency create real strategic relevance in Brazil.
    - >-
      Economics improved materially through 2024-2025, with breakeven in late 2024, quarterly profit signals, and
      sharply narrower annual losses.
    - Funding mix appears to be improving through larger CDB balances and less exclusive dependence on FIDCs.
    - >-
      IFC, DEG, BBVA, and General Atlantic participation validates governance, resilience, and long-term strategic
      interest.
  topRisks:
    - >-
      Public disclosure still does not show primary-account penetration, true active cohorts, or product-level
      retention.
    - >-
      Credit quality, funding cost, and macro rates can still compress returns even if gross customer and book growth
      continue.
    - The updated post-2025 valuation and cap-table/preference terms remain opaque, limiting price support.
    - Operational trust, support, fraud, and multi-partner/product complexity remain meaningful scaled-fintech risks.
    - >-
      Competition from Nubank, Inter, PicPay, PagBank, Mercado Pago, and C6 raises the bar for principality and
      monetization.
  unresolvedGaps:
    - Updated post-2025 valuation, dilution, and preference-stack detail.
    - Primary-account, MAU, and multi-product customer cohorts by segment.
    - Product-level credit losses, repeat-borrow behavior, and risk-adjusted returns.
    - Weighted average cost of funds and funding concentration by instrument and tenor.
    - Public-market readiness evidence beyond broad management ambition.
