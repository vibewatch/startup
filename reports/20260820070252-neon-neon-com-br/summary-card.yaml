summary:
  headline: >-
    Neon is a credible scaled Brazilian fintech with improving economics and real institutional validation, but the
    investment case still hinges on proving customer depth, credit quality, and valuation terms behind the unicorn
    label.
  overallScore: 6.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
