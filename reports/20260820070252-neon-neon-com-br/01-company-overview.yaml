- id: milestones-adverse-history-and-judgment
  title: Milestones, adverse history, and current judgment
  body: 'The milestone record combines a compelling resilience story with durable risk reminders. Neon grew from an underbanked-consumer proposition into a unicorn neobank, acquired and integrated MEI Fácil for micro-entrepreneurs, reached breakeven in 2024, and reported a profitable first quarter in 2025. Yet the same history includes a sharp 2018 shock: Banco Central liquidated the separate Banco Neon entity that had operated as its partner bank, temporarily interrupting some services and highlighting infrastructure dependence even though Neon Pagamentos itself survived. More recently, Exame attributes Neons 2023 and 2024 losses to overly aggressive credit growth, elevated delinquencies, and expensive funding before the restructuring and leadership reset. That matters for the investment case because Neon now looks more mature and capitalised, but not fully derisked. Investors can reasonably view the company as a credible scaled franchise with improving execution, while still demanding
    deeper evidence on board structure, true active-customer quality, lifetime funding, and the sustainability of profitability once growth and credit conditions normalise.'
  claimRefs:
  - CO036
  - CO037
  - CO038
  - CO039
  - CO040
  - CO041
  - CO042
