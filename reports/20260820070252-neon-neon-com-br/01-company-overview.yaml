company:
  name: Neon
chapter:
  number: 1
  title: Company Overview
  summary: 'Neon is a São Paulo-based Brazilian neobank founded in 2016 that targets working-class consumers and micro-entrepreneurs with fee-light digital banking, credit, and savings products. Public evidence shows customer scale above 32 million accounts, a 2024 breakeven inflection, and a three-part Series E that reached R$720 million by July 2025 with IFC, DEG, BBVA, and General Atlantic participation. The same record also shows important execution caveats: a December 2024 CEO transition, incomplete board and cap-table disclosure, and a legacy 2018 partner-bank liquidation event that still matters as a reminder of regulatory and funding dependence.'
sections:
- id: identity-positioning-and-license-perimeter
  title: Identity, positioning, and regulatory perimeter
  body: 'Neon is a privately held Brazilian digital banking group headquartered in São Paulo and founded in 2016. Its own institutional materials describe the company as an authorised payment institution supervised by Banco Central do Brasil, built to serve everyday Brazilian workers with digital accounts, credit cards, loans, Pix, and savings products without the fee complexity that historically burdened incumbent-bank customers. The origin story is consistent across official and independent coverage: founder Pedro Conrade launched Neon after experiencing opaque bank fees firsthand and positioned the company around access, simplicity, and financial inclusion rather than premium banking. TechCrunch and the company timeline also make clear that Neon expanded from a prepaid-card and payments proposition into a fuller bank-like stack as it tried to become the primary financial relationship for lower- and middle-income users rather than only a secondary card or spending app.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  figureRefs:
  - FO002
- id: founders-leadership-and-governance
  title: Founders, leadership transition, and governance visibility
  body: Founder identity is anchored most strongly to Pedro Conrade, who appears repeatedly in the historical record as founder and early chief executive. Independent founder interviews and TechCrunch coverage place him at the centre of Neons launch and early mission; the companys 2025 executive-signature pages still list him among top executives even after the formal leadership handoff. The governance picture changed materially in December 2024, when Neon announced Fernando Miranda as chief executive and moved Conrade to the board, signalling a shift from founder-led hypergrowth toward professionalised scaling and profitability discipline. That transition matters because 2025 operating commentary increasingly came from Miranda, Jamil Marques, and Wilton Pinheiro rather than Conrade. Public sources also show 2025 management-bench building in legal, compliance, risk, and technology, but they do not disclose a full board roster, committee structure, ownership percentages, or investor-control
    provisions. The result is adequate visibility on senior management but still incomplete visibility on formal governance for institutional diligence.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  tableRefs:
  - TO002
- id: funding-history-and-capital-base
  title: Funding history, investors, and capital base
  body: Neons capital history shows repeated access to large global backers, but the public record mixes official timeline entries, older founder interviews, and secondary summaries rather than a single clean cap-table disclosure. The clearest anchor is the February 2022 BBVA-led US$300 million round that TechCrunch says valued Neon at US$1.6 billion and formally made it a unicorn. The official company timeline also records earlier capital milestones, including a R$400 million 2019 round backed by Banco Votorantim and General Atlantic, followed by the 2022 BBVA raise and a three-part Series E. Public 2024 and 2025 materials reconcile that Series E into R$518 million raised across December 2023 and August 2024, then an extension that brought the total to R$720 million in July 2025. BrazilCham and Fintech News America name IFC and DEG as new investors in that extension, while Startups says BBVA and General Atlantic also participated. The financing case is therefore strong on investor quality
    and recent access to capital, but still weak on preference terms, existing dilution, and exact post-money valuation in 2025.
  claimRefs:
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
