- id: scale-product-breadth-and-operating-metrics
  title: Scale, product breadth, and operating metrics
  body: 'Public scale evidence is unusually rich for a private Brazilian fintech. Neons about page says the company serves 32 million clients and has backing from global investors; Estadão later described the base as more than 32 million customers and said Neon opened 2.4 million new accounts in the first half of 2025 alone. The companys official and semi-official materials also show product breadth: digital account, credit and debit cards, Pix, personal loans, payroll loans, FGTS advance, CDB savings products, Viracrédito, cashback, and a growing micro-entrepreneur stack through MEI Fácil. On the lending side, Startups, BrazilCham, and the 2025 statements triangulate a credit portfolio above R$6 billion by early 2025, while the June 2025 consolidated statements break the book into R$5.46 billion of card receivables, R$785 million of private payroll loans, and R$783 million of personal credit. The core diligence caveat is that many user and traction numbers describe gross accounts, product
    balances, or app users rather than fully disclosed active-primary-banking customers.'
  claimRefs:
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
