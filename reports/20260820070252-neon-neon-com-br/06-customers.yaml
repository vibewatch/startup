  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: active-primary-depth
    missingEvidence: Absolute active-customer count, primary-account penetration, and multi-product attachment by segment.
    whyItMatters: These metrics determine whether 32 million clients represent durable customer value or mostly broad but shallow reach.
    diligencePath: Request MAU, principal-account rate, salary-inflow share, and product-attachment cohorts.
    relatedQuestionRefs:
    - QU008
    - QU015
    - QU021
    relatedTableRefs:
    - TU002
    - TU004
    - TU006
  - type: missing-source
    severity: material
    topic: true-retention-cohorts
    missingEvidence: Time-series retention or cohort data by customer segment, especially borrowers, savers, and MEIs.
    whyItMatters: Satisfaction proxies cannot replace true retention evidence in a multi-homing market.
    diligencePath: Request monthly retention and repeat-product cohorts for key user segments.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU021
    relatedTableRefs:
    - TU004
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: channel-mix
    missingEvidence: A public breakdown of customer acquisition channels and the quality of each channel.
    whyItMatters: Expansion risk is partly a channel-dependence problem rather than a single-customer problem.
    diligencePath: Request paid/organic/referral mix with activation and CAC data.
