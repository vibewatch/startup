  rows:
  - - Working-class retail consumer
    - Usually same person
    - Daily account, Pix, card, simple savings, basic credit
    - Core audience in official and media positioning
    - Largest installed-base opportunity and central monetization cohort
    - Primary-account share not disclosed
  - - Underbanked / thin-file credit seeker
    - Usually same person
    - Viracrédito, entry card access, basic credit building
    - Qualitatively important in positioning
    - Strategic for growth and social mission
    - No public approval/activation cohort
  - - Consumer saver
    - Usually same person
    - CDB and balance growth
    - CDB prominently marketed in app stores and site
    - Improves funding and engagement
    - Attachment rates not disclosed
  - - Payroll / FGTS borrower
    - Usually same person with employer/eligibility overlay
    - Lower-friction structured credit
    - Growing product set in 2025 materials
    - Can deepen monetization and risk-adjusted economics
    - No segment-size disclosure
  - - MEI owner-operator
    - Usually same person acting as business owner
    - Business obligations plus personal banking in one app
    - Migration and integration publicly visible in 2024-2026
    - Potentially higher engagement and cross-sell
    - Post-migration retention not public
  - - Secondary-account / opportunistic user
    - Same user but low commitment
    - Promotions, backup account, limited use
    - Implied by multi-homing market structure
    - Can inflate gross-client counts without strong revenue
    - Publicly unmeasured
  notes: Segmentation focuses on who actually uses and potentially pays for value in a retail-finance context.
