- id: TU006
  title: Customer evidence gaps table
  columns:
  - Missing metric
  - Why it matters
  - Exact diligence path
  rows:
  - - Active-primary-account count
    - Separates sign-ups from durable users
    - Request salary inflow, bill-pay, and principal-account metrics
  - - Monthly active by segment
    - Needed to validate segment quality
    - Request MAU split for retail, borrower, saver, and MEI cohorts
  - - Multi-product attachment rate
    - Needed to test land-and-expand thesis
    - Request share using 2+, 3+, and 4+ products
  - - Repeat credit / repeat deposit behavior
    - Needed to test stickiness and monetization durability
    - Request repeat borrow and deposit-hold cohorts
  - - MEI migration completion and churn
    - Needed to validate business-adjacent thesis
    - Request migrated count, active count, and attrition after migration
  - - Channel mix and acquisition quality
    - Needed to test whether growth is bought cheaply or expensively
    - Request acquisition channel mix with CAC and activation
  notes: The central customer diligence gap is depth, not existence.
