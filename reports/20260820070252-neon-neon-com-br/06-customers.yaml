- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Account to card and Pix
    - Weak principality despite sign-up scale
    - Gross accounts overstate monetizable depth
    - Request primary-bank metrics by cohort
  - - Card to Viracrédito or lending
    - Credit expansion into weaker cohorts
    - Can increase losses if activation quality is low
    - Request approval and delinquency curves
  - - Consumer to MEI workflow
    - Migration friction or feature gaps
    - Could hurt the highest-engagement adjacent segment
    - Request migration completion and MEI MAU
  - - CDB attachment
    - Promotional / yield-sensitive balances
    - Can support funding but may be less sticky than primary accounts
    - Request deposit retention by rate cycle
  - - Partner-dependent products
    - Eligibility, rails, or correspondent dependence
    - Can constrain expansion pace in some use cases
    - Request product-by-product channel dependency map
  - - Mass-retail concentration
    - No single giant customer, but heavy reliance on one macro segment
    - Economic shocks can affect broad user base at once
    - Request loss and retention sensitivity by income band
  notes: Customer concentration is distributed, not logo-concentrated, but still economically material.
  claimRefs:
