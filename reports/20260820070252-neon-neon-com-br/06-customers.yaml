company:
  name: Neon
chapter:
  number: 6
  title: Customers
  summary: Neons customer story is strongest at the top of the funnel and weakest on disclosed depth. Public sources consistently place the company with a 32 million-client base, working-class positioning, and a growing MEI adjacency, while 2025 reporting shows millions of new accounts and active-account growth. But the company still discloses little on active-primary-account penetration, retention, or cohort economics. Customer proof therefore supports broad adoption and decent service durability, yet stops short of proving how much of that base is truly primary, repeat, and expansion-rich.
sections:
- id: segments-and-who-actually-uses-neon
  title: 'Segments: the buyer, user, and payer are mostly the same mass-market person, with MEIs as the main adjacent cohort'
  body: 'Neons customer base is best segmented by economic profile and use case rather than by traditional enterprise categories. The company explicitly speaks to the trabalhador brasileiro and was described by TechCrunch as focused on working-class and underbanked Brazilians. Public app-store copy and product pages reinforce this positioning: the buyer, user, and payer are usually the same person opening an app-based account, using Pix, requesting a card, and potentially adding CDB or credit. A second important segment is the micro-entrepreneur or MEI, where Neon is trying to combine personal banking with light business administration and credit needs. This is not a B2B enterprise-customer story; it is a mass retail customer story with a meaningful MEI adjacency. The implication is that user counts can grow quickly, but customer quality hinges on becoming the principal everyday finance app rather than merely a secondary account among several digital banks.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-what-is-disclosed
  title: 'Adoption trajectory: gross adoption is strong, active-depth disclosure is still thin'
  body: The public adoption trajectory is undeniably large. Neon states that it has 32 million clients; O Globo and other 2025 reporting still describe a 32 million-customer base while Estadão says the company opened 2.4 million new accounts in the first half of 2025 and that active accounts rose 13% year over year in June, though the absolute active figure was not disclosed. These are important distinctions. Gross account growth shows the company can keep acquiring users; active-account growth suggests the product is not purely dormant; but the absence of a disclosed active-account denominator, salary-deposit share, or principality rate leaves investors unable to determine what fraction of 32 million accounts are truly monetizable primary relationships. For customer diligence, this means Neon has real adoption proof but incomplete conversion proof. The biggest open question is whether newer accounts are becoming repeat, engaged, multi-product users or simply adding to a broad but shallow
    installed base.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: customer-proof-satisfaction-and-repeat-usage-proxies
  title: 'Customer proof and repeat-usage proxies: consumer review surfaces are strong enough to matter, but not strong enough to replace cohort data'
  body: 'Because Neon is consumer-facing, the retained customer proof is not a library of Fortune 500 logos; it is a mix of app-store scale, complaint-handling metrics, and segment-specific proof such as the MEI migration path. The Apple App Store page shows a 4.7/5 rating from roughly 355 thousand ratings and a recently updated app build, while Google Play and public marketing copy show a broad feature set pitched to daily financial life. Reclame Aqui adds a more nuanced proof point: it still shows RA1000 status, 91.8% of complaints resolved, 99.7% responded to, and a 74.1% willingness to do business again across the 2026 half-year sample, but also confirms that support friction and fraud-related complaints remain live issues. In other words, customers appear numerous and sufficiently engaged to produce large-scale review and complaint data, yet the public proof remains transactional and satisfaction-oriented—not a substitute for true retention or cohort monetisation reporting.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-expansion-and-concentration
  title: 'Retention, expansion, and concentration: cross-sell is credible, but concentration risk lives in channels and principality rather than in one giant account'
  body: 'Expansion logic in Neon is visible even when classical SaaS retention metrics are not. The app and product surfaces show several land-and-expand paths: account to card, card to Viracrédito, account to CDB, consumer banking to MEI area, and general digital banking to payroll/FGTS products. Startups also makes clear that management wants more users to treat Neon as their principal institution, not merely an acquisition statistic. Concentration risk is therefore unusual: the main risk is not a single top customer but over-reliance on certain acquisition channels, payment rails, or a large base of weakly engaged customers. Channel and partner dependence matter too; some products depend on correspondent structures or eligibility-linked rails, which can create procurement-like friction even in retail finance. The safest customer-retention conclusion is that Neon likely has meaningful repeat usage and cross-sell, but public data stop short of proving NRR-like durability or low churn in
    the most important cohorts.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU004
  - TU005
- id: customer-verdict-and-gaps
  title: 'Customer verdict: mass adoption is credible; customer-quality proof is still the missing link'
  body: The customer verdict should separate scale from depth. Neon clearly has significant top-of-funnel reach, an offering built for everyday financial jobs, and enough engagement to generate large app-store footprints, MEI migration needs, and measurable complaint-resolution activity. That is far stronger proof than a simple logo wall. Yet the case is still incomplete because the company does not publicly break out monthly actives, principal-account penetration, multi-product attachment by segment, or long-run cohort retention. A buyer should therefore view the customer base as a real asset whose quality is plausible but not yet fully transparent. The decisive customer diligence request is not another headline account count; it is a segmentation-and-cohort package showing how many users actively engage, how many treat Neon as primary, how many expand into credit or MEI products, and how durable those behaviors remain over time.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
