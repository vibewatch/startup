- id: comparables-and-exit-readiness
  title: 'Comparables and exit readiness: Neon deserves comparison to scaled digital-finance peers, but not on a one-metric shortcut'
  body: 'The comparable set should include public and private references that illuminate what the market rewards in digital finance: scale, profitability, funding durability, product breadth, and customer depth. Inter, PagBank, Mercado Pago, PicPay, and C6 all help in different ways. Inter shows that a publicly listed Brazilian digital-banking platform can monetize at scale; PagBank shows a payments-rooted platform with profitable customer depth; Mercado Pago demonstrates the valuation power of a finance engine embedded in a larger ecosystem; PicPay highlights high revenue with a wallet-led platform; and C6 illustrates how a broad challenger-bank stack competes on both scale and profitability. None is a perfect multiple comp for Neon, but together they reveal the bar. Exit readiness is more uncertain. Several 2025 sources suggest management is thinking in IPO terms over a multi-year horizon, yet public evidence still lacks the kind of disclosure quality and stability that public-market investors
    would demand. Neon is therefore closer to pre-IPO option value than to clear IPO readiness.'
  claimRefs:
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
  - CV031
  - CV032
  tableRefs:
  - TV004
  figureRefs:
  - FV004
- id: kill-triggers-and-final-diligence
  title: 'Kill triggers and final diligence: the investment case should move only if valuation and evidence improve together'
  body: 'The most important discipline at this point is linking price to evidence. If the company can show principality, product-level economics, cohort retention, funding cost control, and credit performance that justify a premium to the old unicorn mark, the recommendation can move up. If it cannot, the right move is patience or a lower required entry price. The same logic applies to downside triggers: a worsening funding mix, weaker complaint and customer-quality indicators, hidden dilution or preference overhang, or delayed progress toward stable profitability would all make an already-uncertain mark less attractive. The final diligence agenda is therefore concrete. Resolve the cap-table and preference stack, verify updated valuation terms, test customer-quality cohorts, and understand risk-adjusted book performance. Only then can an investor decide whether Neon is fairly priced, stretched, or still attractive relative to its next-stage outcomes.'
  claimRefs:
