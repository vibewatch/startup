- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Updated cap table shows heavy preference or dilution overhang
    - New-money terms materially subordinate common-equivalent upside
    - Reduces return even if company performs
    - Demand lower entry price or step away
  - - Primary-account or active-depth proof disappoints
    - Management cannot show strong active-primary usage against gross accounts
    - Weakens monetization and durability thesis
    - Downgrade to avoid / no-go at current price
  - - Credit quality underperforms
    - Cohort losses or delinquencies look inconsistent with scale narrative
    - Hurts earnings quality and capital needs
    - Lower valuation or pause
  - - Funding mix deteriorates
    - Cost of funds or funding concentration worsens materially
    - Compresses valuation and increases downside
    - Re-underwrite with harsher assumptions
  - - Operational or migration failure
    - MEI or partner-linked failures damage trust materially
    - Weakens expansion and IPO-readiness thesis
    - Reduce scenario upside materially
  - - Regulatory setback
    - Material adverse action or permission disruption
    - Raises risk premium and delays exit path
    - Potential hard stop
  notes: Kill triggers convert abstract risk into decision thresholds.
  claimRefs:
  - CV033
  - CV034
  - CV035
  - CV036
  - CV037
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Updated valuation terms
    - Post-2025 round valuation, dilution, and preference stack
    - Determines whether public progress is already priced in
    - Finance / legal diligence with cap-table review
  - - Customer depth
    - Primary-account, MAU, and multi-product cohorts
    - Converts gross scale into economic quality
    - Management KPI package
  - - Credit quality
    - Vintage losses, repeat-borrow performance, and provisioning logic
    - Core to risk-adjusted earnings value
    - Credit/risk diligence with product P&Ls
  - - Funding durability
    - Weighted average cost of funds and concentration by instrument
    - Tests margin resilience and downside protection
    - Treasury / CFO diligence
  - - Public-market readiness
    - Disclosure cadence, governance, and stability of quarterly results
    - Determines exit timing and public-market discount/premium
    - Board / governance diligence
  - - Operational resilience
    - Incident history, support quality trend, and migration metrics
    - Valuation premium requires trust durability
    - Ops / risk / customer-support diligence
  notes: No valuation recommendation should improve until these asks are answered well enough to move scenario probabilities.
  claimRefs:
