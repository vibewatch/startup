company:
  name: Neon
chapter:
  number: 7
  title: Risks
  summary: Neons risk profile is no longer about whether the company can acquire users; it is about whether it can manage a scaled, balance-sheet-heavy digital bank without reliving older regulatory or operational failures. The sharpest risks cluster around credit quality, funding cost, customer principality, partner/regulatory dependency, and operational trust at scale. The company has meaningful mitigations—improving funding independence, stronger internal engineering workflows, privacy/security controls, and better complaint handling—but the public record still leaves key thesis-break indicators undisclosed.
sections:
- id: regulatory-and-legal-risk
  title: 'Regulatory and legal risk: the 2018 Banco Neon failure still matters as historical context even if the current entity moved beyond it'
  body: 'The single most important historical risk marker is the 2018 liquidation of Banco Neon by the Banco Central, widely covered by UOL, Veja, and Convergência Digital. That episode did not kill the broader Neon consumer-finance effort, but it permanently raises the bar for how investors should think about regulatory resilience, related-entity complexity, and control quality. More recent materials are notably stronger: current disclosures emphasize authorized payment-institution status, regulated partner relationships, privacy and LGPD processes, and a more mature funding structure. Still, the lesson from 2018 is not obsolete. Neons public product stack spans multiple regulated entities and correspondent or partner structures, so legal and regulatory slippage could still surface through licensing, disclosures, privacy handling, consumer-protection obligations, or product-partner boundaries. The right regulatory read is therefore improved posture with non-trivial residual exposure, not
    clean-room simplicity.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security-and-customer-trust-risk
  title: 'Operational, security, and customer-trust risk: scale improves process maturity but also raises blast radius'
  body: 'Operationally, Neon looks much more mature than a tiny early-stage fintech. GitHub case-study evidence indicates meaningfully stronger CI/CD discipline, faster deployments, and better security visibility. Public trust materials also show privacy, LGPD, Open Finance, and fraud-prevention controls are taken seriously. Yet a mass-market digital bank remains unusually exposed to operational trust shocks: app instability, fraud spikes, customer-support bottlenecks, payment or card outages, or bad migrations can quickly damage brand and activity. Reclame Aqui is useful here because it shows both mitigation and residual risk at once. RA1000 status and strong response/resolution metrics indicate Neon can handle large support volume, but the complaint corpus confirms that support, fraud, and debt-negotiation disputes are not theoretical risks. The practical implication is that operational risk at Neon is about reliability and customer repair at scale, not about whether the company knows
    these issues exist.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR002
- id: partner-and-dependency-risk
  title: 'Partner and dependency risk: Neon is a single app for users but a network of dependencies underneath'
  body: 'The app experience hides a dense dependency network. Product execution touches app stores, Visa and settlement rails, Banco Central frameworks, Open Finance/Pix permissions, Neon Financeira, correspondent-bank structures, and product-specific partners such as those visible in privacy and MEI/ConsigaMais materials. Engineering velocity also depends on GitHub Enterprise, cloud/integration tooling, and surrounding security workflows. None of these dependencies is inherently fatal; in fact, they are common in fintech. The risk is cumulative: as Neon tries to become a one-stop financial surface, more parts of the experience depend on external entities, permissions, and platforms outside direct end-user visibility. This makes partner and regulatory coordination a first-order operating competency. A missed migration, partner service issue, or policy change can look to the user like a Neon product failure even when the root cause sits elsewhere.'
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-model-and-execution-risk
  title: 'Financial/model and execution risk: the real threat is not growth collapse but low-quality growth'
  body: 'The financial risk profile comes from scale, not from absence of scale. Public sources show a large and growing credit book, a move toward CDB-based funding, intermittent profitability, and still-visible loss and competition pressure. This is exactly the kind of setup where poor underwriting, rising funding costs, weak customer principality, or excessive reliance on less durable cohorts can compress value quickly even if headline accounts continue growing. June 2025 statements show more than R$7 billion of gross receivables before provisions, while year-end filings and 2026 reporting point to more than R$5.3 billion of CDB funding and a still-material loss history despite improvement. Add elevated-rate and delinquency conditions, and the core risk becomes clear: Neon may keep growing but fail to translate growth into durable, risk-adjusted returns. Execution risk also matters at management level because the firm is balancing product expansion, MEI migration, credit growth, and operational
    discipline at once.'
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  tableRefs:
  - TR004
  figureRefs:
  - FR002
- id: mitigations-monitoring-and-kill-criteria
  title: 'Mitigations, monitoring, and kill criteria: several risks are manageable if specific metrics improve'
  body: 'The encouraging part of the risk picture is that most top risks have monitorable mitigations rather than purely binary outcomes. Funding independence can be tracked through cost-of-funds and CDB/FIDC mix; customer-quality risk through primary-account and multi-product rates; underwriting risk through delinquency and repeat-borrow cohorts; support risk through complaint-resolution quality and app-store trend direction; dependency risk through migration milestones, partner concentration, and incident history. The harder issue is transparency: many of these indicators are not publicly disclosed in sufficient detail. That means the investment case should probably not break on one scary historical headline, but it should break if management cannot produce evidence on the quality of accounts, risk-adjusted credit performance, and operational resilience behind the improving top-line story. In short, the largest risks are real but testable.'
  claimRefs:
  - CR032
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
