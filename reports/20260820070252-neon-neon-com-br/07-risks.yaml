- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Customer-quality weakness
    - Primary-account share stalls or falls
    - Management cannot show principality improvement despite account growth
    - Re-underwrite customer-value assumptions or pause investment
  - - Credit deterioration
    - Delinquency or repeat-borrow cohorts worsen materially
    - Loss trends exceed underwriting expectations by segment
    - Tighten growth assumptions and capital needs
  - - Funding stress
    - Cost of funds rises or CDB/FIDC mix worsens
    - Funding becomes meaningfully less attractive or more fragile
    - Reduce valuation or demand stronger capital buffer
  - - Operational trust failure
    - Complaint quality, fraud events, or app reliability worsen sharply
    - Sustained decline in resolution quality or app ratings
    - Escalate operational diligence and consider thesis break
  - - Migration / dependency breakdown
    - MEI or partner-linked features miss milestones or fail at scale
    - Material migration disruption or partner incident
    - Discount expansion thesis and partner-risk assumptions
  - - Regulatory setback
    - New supervisory issue or product-permission disruption
    - Material adverse action by regulator or major compliance lapse
    - Potential hard stop / avoid unless fully remediated
  notes: Every top risk is paired with a concrete monitor or thesis-break event.
