company:
  name: Neon
chapter:
  number: 4
  title: Financials
  summary: Neons public financial picture improved sharply through 2024-2025, but the underwriting story is still about quality of earnings and funding resilience rather than simple growth. Public sources point to R$3.5 billion of 2025 gross revenue, a sharply narrowed annual loss, first-quarter 2025 profit, a first-half 2025 loss of R$35 million, and a credit book that expanded toward roughly R$7.8 billion by year-end 2025. The central diligence question is whether better funding mix, disciplined credit expansion, and growing principal-account behavior can convert this progress into durable profitability without requiring repeated equity support.
sections:
- id: revenue-model-and-what-publicly-monetizes
  title: 'Revenue model: the economic engine is credit-led, not fee-led'
  body: 'Neons public product surface looks broad—account, Pix, card, CDB, Viracrédito, payroll-linked products, FGTS advance, and MEI-adjacent features—but the retained evidence suggests the economic engine is credit intermediation supported by transaction engagement and deposit gathering. The companys public account pages emphasize low-friction banking and low visible fees, which makes it unlikely that account maintenance itself is the core revenue pool. Instead, the clearer monetisation vectors are card-related receivables, personal credit, payroll-linked lending, structured credit products, interchange/payment economics, and funding spread captured through CDB issuance and credit-book deployment. Viracrédito is especially revealing: it turns customer savings behavior into better credit eligibility, showing how Neon uses deposits and engagement as precursors to monetisable lending rather than as ends in themselves. Public revenue recognition remains only partly visible, but available
    filings and news support a credit-led model whose revenue quality depends on credit selection, funding cost, and continued customer engagement rather than pure subscription or SaaS-style recurring revenue.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-monetization-and-gtm-proxies
  title: 'Pricing, monetization, and GTM proxies: engagement and cross-sell matter more than list fees'
  body: 'Neons monetization logic is constrained by its positioning. The product pages repeatedly stress free or low-fee digital banking, no annual card fee, Pix utility, and simple onboarding. That implies GTM efficiency must come from app-led self-serve acquisition and cross-sell into higher-yield credit and savings products, not from expensive sales teams or high listed account fees. Management commentary in Startups makes the same point more directly: breakeven came from growing the customer base, improving revenue per user, and scaling enough to cover fixed costs. Public data on CAC, payback, or conversion by cohort remain unavailable, so the best proxies are account growth, active-account growth, credit-book expansion, stronger funding independence, and evidence that existing users deepen into products like Viracrédito, payroll credit, FGTS advance, and CDB. The commercial motion therefore resembles a digitally distributed consumer bank seeking better unit economics through deeper
    product attachment, not a merchant-acquiring platform or enterprise-sales lender. Investors should treat low published list pricing as customer acquisition strategy; realised economics depend on whether those customers become active, fund balances, and borrow profitably.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  tableRefs:
  - TI002
  figureRefs:
  - FI002
- id: disclosed-traction-profitability-and-book-growth
  title: 'Disclosed traction and profitability: real improvement, but not yet proof of steady-state earnings'
  body: 'The strongest public progress markers came in 2025. InfoMoney reported R$3.5 billion gross revenue for the year, up 55%, with the accounting loss narrowing from R$357 million to R$43 million; the fourth quarter was profitable. Startups reported a R$9.3 million first-quarter 2025 profit and cited 63% quarterly gross-revenue growth to R$806 million in that quarter, while Estadão later said first-half 2025 still ended with a R$35 million loss after a R$265 million loss in the same period of 2024. Those facts together matter because they show improvement was real but uneven: Neon reached breakeven at the end of 2024, posted intermittent profits in 2025, yet had not fully locked in consistent period-by-period profitability by mid-2025. The credit book expanded at the same time. Consolidated June 2025 statements show gross receivables of roughly R$7.0 billion before expected-loss provisions, while year-end 2025 statements place the main book components at R$6.065 billion in card receivables,
    R$962 million in payroll lending, and R$820 million in personal lending. Growth is therefore visible; the key debate is whether revenue quality is keeping pace with underwriting risk and funding obligations.'
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
