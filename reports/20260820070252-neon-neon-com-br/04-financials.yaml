- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Active-primary-account penetration
    - Gross client count cannot be translated into durable revenue quality
    - Request monthly active, salary-deposit, and principal-account rates
  - - CAC and payback by channel
    - Cannot assess whether growth remains efficient as easy acquisition saturates
    - Request paid/organic/referral CAC and cohort payback
  - - Yield, ECL, and NIM by product
    - Cannot determine which products actually generate attractive risk-adjusted returns
    - Request product P&Ls and vintage loss curves
  - - Weighted average funding cost
    - Cannot test sensitivity to rate moves or promotional deposit pricing
    - Request cost of funds by tenor and new-vs-existing deposits
  - - Contribution margin by cohort
    - Cannot verify whether newer users are better or worse than legacy users
    - Request cohort-level contribution and retention data
  - - Regulatory capital and liquidity ratios
    - Cannot judge solvency buffer under adverse credit scenarios
    - Request Basel-style capital metrics or equivalent internal risk dashboards
  notes: The remaining diligence blockers are concrete and management-answerable.
