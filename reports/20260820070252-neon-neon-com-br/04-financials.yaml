- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Read-through
  - Diligence ask
  rows:
  - - Series E capital raised
    - R$ 720m total by July 2025
    - Supports growth, loss absorption, and regulatory capital strength
    - Helpful buffer, but also proof external capital still matters
    - Request current capital ratios and planned use by product
  - - Cash on hand
    - More than R$ 1bn per Startups interview
    - Indicates near-term liquidity cushion
    - Positive, though interview metric is not a full cash-flow statement
    - Request unrestricted cash and stress-liquidity breakdown
  - - Client payment-account balances
    - R$ 956.1m at June 2025
    - Shows transactional funding and settlement obligations
    - Useful engagement base but not term capital
    - Request average balances and stability under stress
  - - Term deposits / CDBs
    - R$ 5.303bn at June 2025
    - Core funding source for the credit machine
    - Positive diversification away from exclusive FIDCs; raises liability management importance
    - Request funding ladder and average cost by bucket
  - - Credit book gross receivables
    - R$ 7.025bn at June 2025 gross; ~R$ 7.847bn core book at FY2025
    - Size of risk assets being funded
    - Confirms balance-sheet intensity and leverage of growth
    - Request capital consumption and RWA by product
  - - FIDC dependency
    - Reduced but still present according to filings
    - Shows progress in funding independence, not complete elimination
    - Improves strategic control if managed well
    - Request residual FIDC exposure and covenants
  notes: Financial capacity improved, but Neon remains a capital-consuming lender rather than an asset-light software company.
