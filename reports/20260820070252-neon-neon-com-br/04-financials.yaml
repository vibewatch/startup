- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / price surface
  - List price / contract model
  - List vs realized monetization
  - Discounts / unknowns
  - Implication
  - Source
  rows:
  - - Digital account
    - Transparent / free-fee positioning
    - List pricing is intentionally low; revenue must come elsewhere
    - Realized economics per account undisclosed
    - Acquisition-friendly but not a standalone earnings engine
    - Official account pages
  - - Credit card
    - No annual fee
    - Monetization likely from receivables, interchange, and installment behaviour
    - APR / fee realization not public in retained set
    - Credit quality matters more than sticker price
    - Official account/about pages
  - - Viracrédito
    - Customer funds invested in Neon CDB to improve credit access
    - Monetizes through deposit gathering and later credit use rather than explicit subscription
    - Take-up and realized conversion undisclosed
    - Clever bridge from savings to lending
    - Official Viracrédito page
  - - CDB
    - Customer deposits remunerated broadly around CDI-linked yields
    - Cost of funding is visible, realized spread is not
    - Mix by term and promotional pricing not public
    - Funding competitiveness can support or compress NIM
    - Official CDB page and statements
  - - FGTS advance / payroll credit
    - Priced lending rather than free utility
    - Realized economics depend on risk, acquisition, and balance growth
    - APR / fees not disclosed in retained set
    - Potentially better monetisation than transaction products
    - FGTS page and media coverage
  - - MEI / Open Finance adjuncts
    - Engagement and data-enrichment surfaces
    - May improve revenue per user indirectly rather than directly
    - No separate monetization line disclosed
    - Could lower CAC and improve underwriting quality
    - Open Finance / MEI sources
  notes: Official pages are list-price evidence only; realized pricing and margin require management disclosure.
