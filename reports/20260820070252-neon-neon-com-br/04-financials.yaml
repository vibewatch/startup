- id: cost-structure-working-capital-and-capital-adequacy
  title: 'Cost structure, working capital, and capital adequacy: funding mix has improved, but the model remains balance-sheet intensive'
  body: 'Neons public filings show a balance-sheet business, not a lightweight software model. The group funds customer operations through payment-account balances, CDB issuance, FIDCs, and equity capital, then converts that funding into credit assets and payment obligations. June 2025 consolidated statements show R$956.1 million of client payment-account balances, R$5.30 billion of term deposits/CDBs, and ongoing card-settlement obligations through Visa. The same filings explicitly say Neon is reducing exclusive dependence on FIDCs and increasing the role of CDBs issued by Neon entities, while 2025 media coverage says CDB funding reached R$5.3 billion. This is strategically positive because it can lower cost and improve funding control, but it also makes liabilities to customers more visible and raises the need for disciplined asset-liability management. Equity remains important: the Series E round eventually totalled R$720 million, and management told Startups that the company had more
    than R$1 billion in cash while still needing capital to keep growing. That combination—improving internal economics but continued capital reinforcement—supports a verdict of maturing resilience rather than self-funding inevitability.'
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: verdict-and-diligence-blockers
  title: 'Financial verdict: materially better, but still dependent on proving durable unit economics'
  body: 'The financial verdict should be constructive but not complacent. Neon has clearly moved beyond a pure growth-at-all-costs profile: public sources support breakeven in late 2024, intermittent profitability in 2025, strong gross-revenue growth, a larger credit book, and a more diversified funding structure. Yet the public record still omits the metrics investors need to fully underwrite a consumer-credit-led bank: CAC, payback by cohort, active-primary-account penetration, contribution margin by product, delinquency/vintage curves by segment, deposit beta, realized cost of funding, and the fraction of credit growth coming from the safest versus riskiest borrower bands. Even the more positive disclosures still acknowledge caution. Estadão highlights competitive pressure and elevated rates, while the financial statements show large expected-loss provisions and a material balance-sheet commitment to card receivables. The right conclusion is that Neon looks much healthier than in prior
    years, but its quality of earnings has not yet been proven enough for a clean underwriting leap without further management data.'
