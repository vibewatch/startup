  topStrengths:
    - 32M 客户规模、覆盖较广的数字银行流程、与 MEI 客群相邻，让 Neon 在巴西具备真实战略价值。
    - 2024-2025 年经济性明显改善：2024 年末打平、季度利润已有信号，全年亏损也大幅收窄。
    - 资金结构似乎正在改善，CDB 余额扩大，对 FIDC 的独家依赖降低。
    - IFC、DEG、BBVA 和 General Atlantic 参与，背书了治理、韧性和长期战略兴趣。
  topRisks:
    - 公开披露仍看不到主账户渗透、真实活跃队列或产品层面留存。
    - 即便总客户和贷款账簿继续增长，信贷质量、资金成本和宏观利率仍可能压缩回报。
    - 2025 年后更新估值以及股权结构表 / 优先股条款仍不透明，价格支撑有限。
    - 运营信任、客服、欺诈，以及多伙伴 / 多产品复杂度，仍是规模型金融科技的实质风险。
    - Nubank、Inter、PicPay、PagBank、Mercado Pago 和 C6 的竞争，抬高了主账户地位和变现的门槛。
  unresolvedGaps:
    - 2025 年后估值、稀释和优先股堆叠细节。
    - 按细分拆分的主账户、MAU 和多产品客户队列。
    - 产品层面的信贷损失、复借行为和风险调整后回报。
    - 按工具和期限拆分的加权平均资金成本及资金集中度。
    - 除管理层整体意愿外，面向公开市场准备度的证据。
