  headquarters: "São Paulo, Brazil"
  productSummary: "Digital account, debit and credit cards, Pix, CDB savings products, personal loans, payroll-linked lending, FGTS advance, Viracrédito, and MEI-linked financial workflows within one app-centric customer experience."
  customerFocus: "Mass-market Brazilian consumers, especially working-class and underbanked users, with an adjacent focus on MEIs and micro-entrepreneurs."
  businessModel: "Acquire retail customers through low-friction digital banking, deepen engagement through card and payment usage, gather funding through deposits/CDB, and monetize via credit products, funding spread, and cross-sell."
  stage: "Series E"
  fundingStatus: "Series E completed across 2023-2025, culminating in a July 2025 extension of roughly US$129M / R$720M with IFC, DEG, BBVA, and General Atlantic participation."
