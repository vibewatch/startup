evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-control-rights-TO002
    missingEvidence: A current board roster, committees, investor governance rights, and any observer or veto structure.
    whyItMatters: >-
      Late-stage investors need to understand whether the founder handoff changed effective control or investor
      protections.
    diligencePath: Request updated board materials, shareholder agreements, and governance summary from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A current 2025 or 2026 employee-count disclosure or organisational overview.
    whyItMatters: Headcount is a key maturity and operating-leverage signal, especially after the profitability reset.
    diligencePath: Request current FTE count by function and compare with 2022 hiring claims.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: material
    topic: stakeholder-or-investor-map-TO003
    missingEvidence: Precise July 2025 post-money valuation, security type, preference stack, and any investor protections.
    whyItMatters: >-
      The investment case cannot cleanly anchor entry pricing or dilution without current round economics, and the
      stakeholder map remains incomplete without exact ownership and rights disclosure.
    diligencePath: Request Series E term sheet, cap table, and board consents covering the extension.
    relatedQuestionRefs:
      - QO014
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: milestone-table-TO004
    missingEvidence: Primary-account rate, monthly active users, deposit frequency, and engagement by cohort.
    whyItMatters: >-
      Gross account count overstates franchise quality if many users remain secondary or credit-only relationships, and
      some internal milestones are not public.
    diligencePath: >-
      Request cohort dashboards for actives, salary-deposit primary users, and product attach rates; reconcile any
      unpublished milestones against board materials.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: primary-account-rate-TM001
    missingEvidence: >-
      A verified measure of how many Neon accounts are primary-banking relationships rather than secondary or dormant
      accounts.
    whyItMatters: SAM and monetisable SOM are overstated if gross account counts are used as a proxy for active principal banking.
    diligencePath: Request MAU, salary-deposit penetration, and primary-account definitions used internally.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: material
    topic: underbanked-denominator
    missingEvidence: A cleaner official denominator for underbanked working adults and MEIs reachable by Neons current product stack.
    whyItMatters: >-
      Secondary market summaries disagree on the size of the remaining underbanked opportunity even though the
      qualitative opportunity is real.
    diligencePath: Request managements internal SAM model and compare it with BCB / IBGE segment data.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM001
  - type: conflicting-data
    severity: minor
    topic: market-size-estimates
    missingEvidence: A single consistently sourced digital-banking market-size series for Brazil.
    whyItMatters: >-
      Secondary sources mix fintech-market, banking-pool, and payment-volume measures, which should not be treated as
      interchangeable TAM figures.
    diligencePath: Normalize TAM to one consistent framework during investment-model work.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: neon-principality-gap
    missingEvidence: >-
      A direct comparison of primary-account penetration, salary-deposit share, and profitable actives across Neon and
      its peer set.
    whyItMatters: >-
      Gross customer-count comparisons understate the importance of engagement and wallet share in a multi-homing
      market.
    diligencePath: Request internal cohort and principal-account benchmarks against public peers.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: proprietary-moat-proof
    missingEvidence: Evidence of a durable proprietary moat beyond brand, UX, and execution in the working-class / MEI segment.
    whyItMatters: Without structural lock-in, valuation should not assume monopoly-like durability.
    diligencePath: Request retention, cohort-margin, and MEI cross-sell data showing defensibility versus peers.
    relatedQuestionRefs:
      - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: adjacent-substitutes
    missingEvidence: A full enumeration of incumbent-bank and payroll/ecosystem substitutes beyond the major digital peers.
    whyItMatters: The competitive set is broader than the named neobank leaders.
    diligencePath: Expand competitor mapping in a follow-up refresh if the investment advances.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-core
    missingEvidence: Product-level CAC, payback, cost of funds, expected-loss rates, and net interest margins by cohort or product.
    whyItMatters: >-
