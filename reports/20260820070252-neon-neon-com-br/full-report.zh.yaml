      - number: '8.5'
        title: 否决触发项与最终尽调：估值和证据一起改善，投资逻辑才应推进
        blocks:
          - type: paragraph
            body: >-
              眼下最重要的纪律，是把价格和证据绑在一起。若公司能证明主账户地位、产品层面经济性、队列留存、资金成本控制和信贷表现足以支撑相对旧独角兽估值的溢价，建议可以上调。若不能，正确动作就是等待，或要求更低入场价。同样逻辑也适用于下行触发项：融资组合恶化、投诉和客户质量指标走弱、隐藏稀释或优先权悬置、稳定盈利进展延迟，都会让本已不确定的估值锚更不具吸引力。因此，最终尽调议程很具体：理清股权结构表和优先股堆叠，核验最新估值条款，测试客户质量队列，并理解风险调整后账簿表现。只有到那时，投资者才能判断
              Neon 定价是合理、偏高，还是相对下一阶段结果仍有吸引力。
