        title: 已披露牵引力和盈利能力：改善真实存在，但还不能证明稳态盈利
        blocks:
          - type: paragraph
            body: >-
              最强的公开进展标记出现在 2025 年。InfoMoney 报道全年总收入 R$3.5 billion，同比增长 55%，会计亏损从 R$357 million 收窄到 R$43
              million；第四季度实现盈利。Startups 报道 2025 年第一季度利润 R$9.3 million，并引用该季度总收入增长 63% 至 R$806 million；Estadão 后来称，2025
              年上半年仍以 R$35 million 亏损收尾，而 2024 年同期亏损为 R$265 million。这些事实合在一起很重要，因为它们说明改善真实但不平滑：Neon 在 2024 年末达到盈亏平衡，2025
              年阶段性盈利，但到 2025 年中仍没有完全锁定逐期稳定盈利。信贷账簿同时扩张。2025 年 6 月合并报表显示，预期损失拨备前的总应收款约 R$7.0 billion；2025 年年末报表则把主要账簿构成列为
              R$6.065 billion 银行卡应收款、R$962 million 工资贷款和 R$820 million 个人贷款。因此，增长可见；关键争论是收入质量是否跟得上承销风险和资金义务。
