  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻玩家、传统大行和替代品
        blocks:
          - type: paragraph
            body: >-
              巴西竞争场更适合看成一圈圈同心圆，而不是一张单一同业名单。直接同业是面向零售消费者、提供交易账户、银行卡、信贷和储蓄产品的数字银行——Nubank、Inter、C6 Bank、PagBank 和 PicPay
              都部分符合这个框架。第二圈包括生态更重的金融平台，比如 Mercado
              Pago，它们把钱包、marketplace、商户和信贷循环结合起来，足以争夺同一条主要金融关系，即使它们并非以银行身份起家。第三圈是传统大行的现状，因为巴西人平均保有多个银行关系，这一点仍然重要。因此，Neon
              不只是在和其他 app 竞争，也在和惯性、工资挂钩的既有关系、雇主分发和商户生态竞争。战略含义是，Neon 真正的竞争者，是任何能占据客户日常余额、支付习惯和信贷决策的平台，而不只是任何自称 neobank
              的公司。
