figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Neon 从面向银行服务不足消费者的创业公司，经过持续融资、一次监管冲击和管理层重置，走向规模化数字银行。
    data:
      items:
        - date: '2016'
          label: 成立
          detail: Pedro Conrade 围绕低费用数字银行逻辑创办 Neon
          tone: positive
          claimRefs:
            - CO001
            - CO009
        - date: 2018-05
          label: 合作银行清算
          detail: Banco Central 清算 Banco Neon；Neon Pagamentos 存续，但服务受扰
          tone: negative
          claimRefs:
            - CO036
            - CO037
        - date: '2019'
          label: R$400M 轮
          detail: Banco Votorantim 和 General Atlantic 支持扩张
          tone: positive
          claimRefs:
