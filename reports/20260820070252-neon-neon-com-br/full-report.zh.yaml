              这个品类的产品宽度已经趋同。几乎每个主要玩家现在都提供账户、银行卡、Pix、信贷、投资和保险的某种组合。真正拉开差距的是给这些产品喂流量的分发飞轮。Mercado Pago 可以把金融嵌入商业；PagBank
              带来商户收单和营运资本流；PicPay 把钱包行为复合进信贷和保险；Inter 在银行之上叠加超级 app 和 marketplace；C6 强调 100 多个产品的宽产品套件；Nubank
              则变现极端规模和强品牌。Neon 仍有清晰价值主张——面向大众的简单性、CDB 带动的储蓄互动、Viracrédito 这类担保额度行为工具，以及 MEI
              邻近性——但它缺少一些同业在银行之外拥有的显性嵌入式分发引擎。公开产品页面和排名也暗示，价格不再是主要分水岭；用户体验、app 可靠性、相邻服务宽度，以及成为习惯性支付 /
