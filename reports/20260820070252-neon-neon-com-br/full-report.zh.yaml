  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前定价背景：质量可信，价格支撑仍不完整
        blocks:
          - type: paragraph
            body: >-
              Neon 已经足够大，不能轻易忽视；但也足够不透明，不能轻率承销。2025 年延伸轮显然获得 IFC、DEG、BBVA 和 General Atlantic 的背书；多篇 2025 年报道也显示，公司在 2024
              年末达到盈亏平衡，2025 年初实现季度盈利，并持续扩张信贷和参与度。但价格纪律仍然重要。最近一个较稳的估值锚，是 2022 年约 US$1.6 billion 的独角兽轮。2025
              年延伸轮没有公开披露更新估值；管理层只是重申独角兽状态和继续引入股权资本的战略理由。因此，投资者只能基于过时估值锚，以及改善但不完整的经营证据推理。在这些记录下，正确结论是以中等置信度观察 /
              继续研究：积极程度足以让尽调继续，但透明度不足以支撑在未披露或可能仍偏高的估值上给出买入建议。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
