            body: >-
              风险图谱中鼓舞人的部分在于，大多数主要风险都有可监测的缓释路径，而不是纯二元结果。融资独立性可通过资金成本和 CDB / FIDC
              组合追踪；客户质量风险可看主账户率和多产品率；承销风险可看逾期和重复借款队列；支持风险可看投诉解决质量和应用商店趋势方向；依赖风险可看迁移里程碑、伙伴集中度和事故历史。更难的是透明度：这些指标中许多并未以足够细节公开披露。这意味着投资逻辑大概不应因一个吓人的历史标题就破裂；但如果管理层无法拿出证据，证明账户质量、风险调整后信贷表现和运营韧性支撑了改善中的收入增长叙事，那么投资逻辑就应被否决。简言之，最大风险是真实的，但可以测试。
