      - CE031
      - CE038
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Neon 概率最高的客户路径，是从简单账户使用进入信贷、储蓄，并可能进一步整合 MEI。
    data:
      items:
        - label: 开户 + 开始 Pix
          detail: 用户为了低摩擦数字银行选择 Neon。
        - label: 使用银行卡和日常支付
          detail: 习惯形成取决于反复日常使用。
        - label: 添加 CDB 或 Viracrédito
          detail: 余额积累和信贷准备度加深互动。
        - label: 使用信贷产品
          detail: 信用卡、个人、FGTS 或工资信贷提高变现。
        - label: 拓展到 MEI 区域
          detail: 部分用户把企业和个人流转整合到一个 App。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU024
      - CU025
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: wide
    summary: 客户验证口径从总客户数收窄到活跃账户，再到仍未披露的主账户或多产品用户。
    data:
      items:
        - label: 总客户数
          value: 32
        - label: 2025 H1 新增账户
          value: 2.4
        - label: 活跃账户（已披露增速，未披露绝对值）
          value: 13
        - label: 已公开披露的主账户数
          value: 0
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 公开证据最强的是渠道规模和客服处理；主账户地位和重复队列可见度弱得多。
    data:
      columns:
        - 生产环境验证
        - 结果具体度
        - 留存可见度
        - 证据新鲜度
        - 战略价值
      rows:
