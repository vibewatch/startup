      - number: '4.2'
        title: 定价、变现和 GTM 代理指标：互动和交叉销售比挂牌费用更重要
        blocks:
          - type: paragraph
            body: >-
              Neon 的变现逻辑受自身定位约束。产品页面反复强调免费或低费率数字银行、信用卡无年费、Pix 实用性和简单开户。这意味着 GTM 效率必须来自 app
              驱动的自助获客，以及向更高收益信贷和储蓄产品的交叉销售，而不是昂贵销售团队或高挂牌账户费。Startups
              中的管理层评论更直接地表达了同一点：盈亏平衡来自客户基础增长、每用户收入改善，以及规模足以覆盖固定成本。关于
              CAC、回本周期或队列转化的公开数据仍不可得，因此最好的代理指标是账户增长、活跃账户增长、信贷账簿扩张、更强的资金独立性，以及现有用户加深使用 Viracrédito、工资信贷、FGTS 提前支取和 CDB
              等产品的证据。因此，商业动作更像一家数字分发的消费银行，通过更深产品附着追求更好单位经济，而不是商户收单平台或企业销售型贷款机构。投资人应把低公开标价视为获客策略；实际经济性取决于这些客户是否会活跃、沉淀余额并带来有利润的借款。
