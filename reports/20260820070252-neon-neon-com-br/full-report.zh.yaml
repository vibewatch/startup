        title: 客群：买方、用户和付费方大多是同一个大众市场个人，MEI 是主要相邻队列
        blocks:
          - type: paragraph
            body: >-
              Neon 的客户基础更适合按经济画像和使用场景分层，而不是按传统企业类别分层。公司明确面向 trabalhador brasileiro，TechCrunch 也把它描述为聚焦工薪阶层和银行服务不足的巴西人。公开
              app store 文案和产品页面进一步强化了这一定位：买方、用户和付费方通常是同一个人，打开 app 账户、使用 Pix、申请银行卡，并可能加入 CDB 或信贷。第二个重要客群是微型创业者或 MEI，Neon
              试图把个人银行服务与轻量企业管理和信贷需求结合起来。这不是一个 B2B 企业客户故事，而是一个大众零售客户故事，旁边有重要的 MEI 邻近性。含义是，用户数可以快速增长，但客户质量取决于 Neon
              能否成为主要日常金融 app，而不只是多个数字银行里的第二账户。
