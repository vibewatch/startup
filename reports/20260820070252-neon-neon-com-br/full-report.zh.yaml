      - number: '2.3'
        title: 买方、用户和付费方分层：大众消费者优先，MEI 次之，雇主和 rails 是间接使能方
        blocks:
          - type: paragraph
            body: >-
              在前端，买方、用户和付费方往往是同一个人：巴西消费者把移动设备作为支付、余额和短期限信贷的主要界面。TechCrunch 和 Neon
              自身定位都强调工薪阶层和银行服务不足家庭，而不是富裕人群或企业用户。第二个重要客群是 MEI /
              微型创业者，银行服务、应收款时点、税务流程，以及个人与企业现金混用，会产生相邻需求，消费银行可以用打包工作流解决。MEI Fácil
              的整合因此具有战略意义：它降低进入这个客群的获客摩擦，而这个客群的金融运营痛点更强，互动也可能更高。预算归属按产品不同而变：交易和储蓄决策由消费者自己掌握，但工资贷款渗透还取决于雇主协议和信用风险
              rails。Open Finance 又给买方行为增加了一层变化：定价权越来越取决于外部数据可得性，以及 app 是否成为用户同意迁移余额的入口，而不只是开户地点。
