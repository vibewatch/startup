        title: 规模、产品宽度与运营指标
        blocks:
          - type: paragraph
            body: >-
              对一家巴西私营金融科技公司来说，Neon 的公开规模证据异常丰富。Neon 关于页面称公司服务 32 million 客户，并获得全球投资人支持；Estadão 后来把客户基础描述为超过 32
              million，并称 Neon 仅在 2025 年上半年就新增 2.4 million 个账户。公司官方和半官方材料还显示了产品宽度：数字账户、信用卡和借记卡、Pix、个人贷款、工资贷款、FGTS
