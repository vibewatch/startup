  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型：经济引擎由信贷驱动，而不是由费用驱动
        blocks:
          - type: paragraph
            body: >-
              Neon 的公开产品表面很宽——账户、Pix、银行卡、CDB、Viracrédito、工资挂钩产品、FGTS 提前支取和 MEI
              相邻功能——但现有证据显示，经济引擎是交易互动和存款吸收支撑下的信贷中介。公司公开账户页面强调低摩擦银行服务和低可见费用，因此账户维护本身不太可能是核心收入池。更清晰的变现向量是银行卡相关应收款、个人信贷、工资挂钩贷款、结构化信贷产品、交换费
              / 支付经济性，以及通过 CDB 发行和信贷账簿投放获取的资金利差。Viracrédito 特别能说明问题：它把客户储蓄行为转化为更好的信贷资格，显示 Neon
              把存款和互动用作可变现贷款的前置条件，而不是目的本身。公开收入确认仍只部分可见，但可得文件和新闻支持一个信贷驱动模型；收入质量取决于信贷筛选、资金成本和持续客户互动，而不是纯订阅或 SaaS 式经常性收入。
            claimRefs:
              - CI001
