      - 阈值 / 事件
      - 行动含义
    rows:
      - - 客户质量薄弱
        - 主账户占比停滞或下降
        - 管理层无法证明账户增长之外主账户地位改善
        - 重新评估客户价值假设，或暂停投资
      - - 信贷恶化
        - 逾期或复借队列显著恶化
        - 各分群损失趋势超出承保预期
        - 收紧增长假设，并上调资本需求
      - - 资金压力
        - 资金成本上升，或 CDB / FIDC 组合恶化
        - 资金吸引力明显下降，或脆弱性上升
        - 下调估值，或要求更强资本缓冲
      - - 运营信任失效
        - 投诉表现、欺诈事件或 App 可靠性急剧恶化
        - 解决质量或 App 评分持续下滑
        - 升级运营尽调，并考虑投资逻辑失效
