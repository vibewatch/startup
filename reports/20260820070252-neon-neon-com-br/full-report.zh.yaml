        title: 合作伙伴与依赖风险：对用户是一个 app，底层却是一张依赖网络
        blocks:
          - type: paragraph
            body: >-
              App 体验遮住了一张密集依赖网络。产品执行牵涉应用商店、Visa 和清算通道、Banco Central 框架、Open Finance / Pix 授权、Neon
              Financeira、代理银行架构，以及隐私和 MEI / ConsigaMais 材料中可见的产品专属伙伴。工程速度也依赖 GitHub Enterprise、云 /
              集成工具和周边安全工作流。这些依赖本身没有哪个必然致命；事实上，它们在金融科技行业很常见。风险在于累积效应：Neon
              越想成为一站式金融界面，体验中的更多环节就越依赖外部实体、许可和终端用户看不见的平台。这让合作伙伴和监管协调成为一线运营能力。一次迁移失误、伙伴服务问题或政策变化，即便根因在别处，用户也会把它看成 Neon
              产品故障。
