companyProfile:
  summary: >-
    Neon 是一家总部在 São Paulo 的巴西 neobank，成立于 2016 年。公司现在的业务把 app 化零售银行、银行卡、信贷、存款 / CDB，以及 MEI 相邻金融工作流拼在一起。Neon
    已经达到有意义的全国规模，2024-2025 年财务表现明显改善；但现有公开证据仍没有回答几个核心承销问题：主账户渗透、风险调整后的信贷质量，以及最新融资对应的准确估值和股权结构条款。
