  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Neon 最重的残余风险集中在财务模型质量、合作伙伴 / 监管复杂度和运营信任。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 监管 / 法律复杂度
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 运营 / 信任失灵
          values:
            - 中
            - 高
            - 中高
            - 高
        - label: 合作伙伴 / 依赖断裂
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 财务模型 / 信贷质量失准
          values:
            - 中高
            - 高
            - 中
            - 高
        - label: 执行 / 迁移失准
          values:
            - 中
            - 中高
            - 中
            - 中高
    claimRefs:
      - CR001
      - CR009
      - CR017
      - CR024
      - CR032
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险大多先传导到客户信任和利润率质量，再传导到融资需求和估值。
    data:
      nodes:
        - id: ops
          label: 运营事件
          detail: 欺诈、宕机、迁移失败或客服体系崩塌
        - id: customer
          label: 客户信任 / 主账户地位
          detail: 是否活跃使用、是否愿意留下并加深关系
        - id: credit
          label: 信贷质量 / 损失
          detail: 风控授信、逾期和复借质量
        - id: margin
          label: 利润率和盈利能力
          detail: 资金成本、ECL 和客服负担
        - id: capital
          label: 资本需求
          detail: 需要更多股权资本或资产负债表支持
        - id: valuation
          label: 估值 / 投资建议
          detail: 投资逻辑耐久性
      edges:
        - from: ops
          to: customer
          label: 侵蚀信任
        - from: customer
          to: credit
          label: 更低质量队列
        - from: credit
          to: margin
          label: 损失上升
        - from: ops
          to: margin
          label: 客服和欺诈成本
        - from: margin
          to: capital
          label: 需要更多资金
        - from: capital
          to: valuation
          label: 稀释或风险溢价
        - from: customer
          to: valuation
          label: 增长质量走弱
    claimRefs:
      - CR010
      - CR015
      - CR024
      - CR025
      - CR032
      - CR033
      - CR034
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 一次完整的 Neon 应用体验，靠外部分发、清算轨道、监管机构、合作伙伴和内部平台工具一起撑住。
    data:
      nodes:
        - id: stores
          label: 应用商店
          detail: Apple 和 Google 分发闸口
        - id: visa
          label: Visa / 清算轨道
          detail: 卡交易执行与清算
        - id: bcb
          label: Banco Central 框架
          detail: Pix、Open Finance、权限和监管
        - id: partners
          label: 合作伙伴实体
          detail: 银行代理和特定产品交易对手
        - id: github
          label: GitHub + 云栈
          detail: CI/CD、工具链和平台运营
        - id: app
          label: Neon 用户体验
          detail: 客户真正用到的体验
      edges:
        - from: stores
          to: app
        - from: visa
          to: app
        - from: bcb
          to: partners
        - from: partners
          to: app
        - from: github
          to: app
        - from: bcb
          to: app
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议先承认真实规模和进展，最后落到由缺失分母划出的估值纪律关口。
    data:
      nodes:
        - id: scale
          label: 32M 客户 + 成规模产品组合
          detail: Neon 的触达和产品广度都已具备分量。
        - id: progress
          label: 经济性改善
          detail: 盈亏平衡、盈利信号和融资多元化都有改善。
        - id: validation
          label: 机构背书
          detail: IFC、DEG、BBVA 和 General Atlantic 支持了 2025 年延伸融资。
        - id: opacity
          label: 关键分母不透明
          detail: 主账户使用、稀释条款和风险调整后回报仍不清楚。
        - id: price
          label: 观察 / 继续研究
          detail: 只有价格和证据一起改善，才继续推进。
      edges:
        - from: scale
          to: price
        - from: progress
          to: price
        - from: validation
          to: price
        - from: opacity
          to: price
    approximationNotes: 投资建议图为定性判断，反映公开证据与未厘清定价输入之间的相对权重。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
      - CV013
      - CV033
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资测算最敏感的是客户深度、信贷质量、资金成本、稀释条款和退出准备度。
    data:
      items:
        - label: 主账户 / 活跃用户证明
          value: 10
        - label: 按队列拆分的信贷质量
          value: 10
        - label: 资金成本 / 融资结构
          value: 9
        - label: 优先权 / 稀释包袱
          value: 9
        - label: 公开市场准备度
          value: 8
        - label: 运营韧性
          value: 7
        - label: 宏观 / 利率环境
          value: 7
    approximationNotes: 0-10 序数敏感性评分，用于投资测算，不是公司披露指标。
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV033
      - CV034
      - CV035
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 2025 年后的更新估值没有公开披露，用区间比单点估算更诚实。
    data:
      items:
        - label: 悲观公允价值（USD M）
          low: 1000
          mid: 1150
          high: 1300
          unit: USD M
          note: 客户深度弱，或融资 / 信贷质量不足，都足以让估值压到 2022 年锚点以下。
        - label: 基准公允价值（USD M）
          low: 1400
          mid: 1600
          high: 1700
          unit: USD M
          note: 假设质量继续改善，过期的独角兽估值大致还能站住。
        - label: 乐观公允价值（USD M）
          low: 1900
          mid: 2200
          high: 2500
          unit: USD M
          note: 需要更深的客户使用、更强盈利能力，以及更清晰的 IPO 前准备。
        - label: 悲观 MOIC（入场价 $1.6B）
          low: 0.63
          mid: 0.72
          high: 0.81
          unit: x
          note: 若按旧独角兽估值附近入场，下行情景仅为示意。
        - label: 基准 MOIC（入场价 $1.6B）
          low: 0.88
          mid: 1
          high: 1.06
          unit: x
          note: 说明过期估值并不自动等于有吸引力的上行空间。
        - label: 乐观 MOIC（入场价 $1.6B）
          low: 1.19
          mid: 1.38
          high: 1.56
          unit: x
          note: 上行空间存在，但没有证据或更好入场价，就不像风险投资回报。
    approximationNotes: 示意性公允价值和回报区间来自公开估值锚点和情景逻辑，不是公司指引。
    claimRefs:
      - CV017
      - CV020
      - CV022
      - CV023
      - CV024
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Neon 在市场规模和业务存在性证明上得分强，但披露质量和当前价格支撑明显弱得多。
    data:
      items:
        - label: 市场规模 / 顺风
          score: 8
        - label: 客户规模
          score: 8
        - label: 产品宽度
          score: 7
        - label: 经济性趋势
          score: 6
        - label: 风控可见度
          score: 5
        - label: 披露质量
          score: 3
        - label: 当前价格支撑
          score: 4
    approximationNotes: 投资委员会式序数评分，基于留存公开证据和缺口。
    claimRefs:
      - CV003
      - CV010
      - CV011
      - CV018
      - CV025
      - CV031
      - CV040
