              公开路线图信号指向更深统一和更高运营杠杆，而不是激进产品重置。MEI 迁移页面称，独立的 MEI Fácil app 正并入 Neon，涉及账户迁移、额度转移、新产品访问，以及到 2026 年 8
              月前移除部分服务。Startups 称，Series E 资本支持银行卡改进、基础客户互动、Pix 驱动功能、Open Finance 和 AI。与此同时，Banco Central 和 Open Finance
              页面把 ITP/Open Finance 权限与 Pix 功能描述为机构可继续搭建其上的基础设施层。这些信号重要，是因为 Neon
