        title: 成本结构、营运资本和资本充足性：资金组合已经改善，但模型仍然重资产负债表
        blocks:
          - type: paragraph
            body: >-
              Neon 的公开文件显示，这是一门资产负债表生意，而不是轻量软件模型。集团通过支付账户余额、CDB 发行、FIDC 和股权资本为客户运营提供资金，再把这些资金转成信贷资产和支付义务。2025 年 6
              月合并报表显示，客户支付账户余额为 R$956.1 million，定期存款 / CDB 为 R$5.30 billion，并通过 Visa 承担持续银行卡清算义务。同一批文件明确称，Neon 正在降低对
              FIDC 的独家依赖，提高 Neon 实体发行 CDB 的作用；2025 年媒体报道也称 CDB 资金达到 R$5.3
              billion。这在战略上是正面的，因为它可能降低成本、改善资金控制；但它也让对客户的负债更显性，并提高了对资产负债管理纪律的要求。股权仍很重要：Series E 最终总额达到 R$720
              million，管理层告诉 Startups，公司现金超过 R$1 billion，同时仍需要资本继续增长。这组事实——内部经济性改善，但仍要补强资本——支持的结论是韧性正在成熟，而不是必然能自我供血。
