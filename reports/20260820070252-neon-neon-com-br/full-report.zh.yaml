      - number: '8.4'
        title: 可比公司与退出准备度：Neon 应与规模化数字金融同行比较，但不能用单一指标走捷径
        blocks:
          - type: paragraph
            body: >-
              可比集合应包括能说明市场奖励什么的公私市场参照：规模、盈利能力、融资耐久性、产品广度和客户深度。Inter、PagBank、Mercado Pago、PicPay 和 C6 都以不同方式有帮助。Inter
              说明，上市的巴西数字银行平台可以在规模上变现；PagBank 说明，以支付为根的平台也能做出盈利的客户深度；Mercado Pago 展示了嵌在更大生态里的金融引擎具备估值力量；PicPay
              突出了钱包主导平台的高收入；C6 则说明，广谱挑战者银行产品栈会同时在规模和盈利能力上竞争。它们都不是 Neon 的完美倍数可比公司，但放在一起揭示了门槛。退出准备度更不确定。多份 2025
              年来源显示管理层在以多年维度思考 IPO，但公开证据仍缺少公开市场投资者会要求的披露质量和稳定性。因此，Neon 更接近 IPO 前期权价值，而不是明确 IPO 就绪。
