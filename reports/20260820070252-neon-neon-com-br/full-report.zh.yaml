      - number: '8.3'
        title: 情景逻辑与回报纪律：区间估值比单点精度更诚实
        blocks:
          - type: paragraph
            body: >-
              由于估值分母不完整，情景区间比精确数字更合适。悲观结果不是破产，而是 Neon
              保住庞大用户基础，却暴露出更弱的主账户属性、更波动的信贷质量，以及融资或利润率压力，让当前独角兽叙事显得已经充分定价。基准情景假设公司继续改善收入质量，证明更健康的融资和信贷表现，并大致守住历史 US$1.6
              billion 锚。乐观情景要求更多：更强的产品附着、更深的客户关系、更干净的盈利能力，以及可信的 IPO 前进展，足以支撑相对过时 2022 估值的溢价。因此，回报纪律从入场纪律开始。如果投资者无法确认
              2022 年独角兽估值与 2025 年延伸轮之间，除更好但仍局部的进展外，经济性究竟发生了什么变化，就不应在没有证据时假设大幅折价或大幅溢价。
