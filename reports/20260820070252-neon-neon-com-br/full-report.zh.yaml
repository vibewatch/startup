      - CV035
      - CV036
      - CV037
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 最新估值条款
        - 2025 轮后估值、稀释和优先股堆叠
        - 判断公开进展是否已被计价
        - 财务 / 法务尽调，审阅股权结构表
      - - 客户深度
        - 主账户、MAU 和多产品队列
        - 将总规模转化为经济质量
        - 管理层 KPI 包
      - - 信贷质量
        - 放款批次损失、复借表现和拨备逻辑
        - 风险调整后盈利价值的核心
        - 信贷 / 风险尽调，结合产品 P&L
      - - 资金耐久性
        - 加权平均资金成本和按工具划分的集中度
        - 检验利润率韧性和下行保护
        - 资金 / CFO 尽调
      - - 公开市场准备度
        - 披露节奏、治理和季度业绩稳定性
        - 决定退出时点和公开市场折价 / 溢价
        - 董事会 / 治理尽调
      - - 运营韧性
        - 事故历史、支持质量趋势和迁移指标
        - 估值溢价需要信任耐久性
        - 运营 / 风险 / 客户支持尽调
    notes: 在这些问题的答案足以改变各情景概率之前，估值建议不应上调。
