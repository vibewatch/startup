      - number: '2.4'
        title: 增长驱动：Pix、Open Finance、移动分发，以及仍未关闭的信贷正规化缺口
        blocks:
          - type: paragraph
            body: >-
              最强的市场顺风来自基础设施。McKinsey 称，Pix 在 2024 年处理约 63 billion 笔交易，拥有 158 million 用户，并把 71.5 million 巴西人带入数字支付系统；BCB
              自己的 Pix 页面显示，2026 年 1 月用户超过 170 million、交易量达到 7 billion 笔，2025 年 12 月单日纪录为 313.3 million 笔。这些数字重要，是因为 Neon
              可以建立在默认支付 rails 上，而不需要从零教育市场。Open Finance 是第二股顺风：McKinsey 引用超过 64 million 个活跃数据共享授权和每月 9.2 billion 次 API
              调用，BCB 通信则把该系统描述为全球规模、仍在扩张。两类 rails 合在一起，降低开户摩擦，让信贷承销更数据驱动，并让 Pix Automático、NFC
              Pix、跨机构账户聚合等新功能复合提升用户互动。FIDC 增长和仍然庞大的企业信贷缺口也有间接意义，因为它们加深了消费者和小企业贷款背后的私募信贷与结构化金融管道。
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
