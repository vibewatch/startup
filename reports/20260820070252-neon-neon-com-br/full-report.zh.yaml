            - 中
            - 中-高
            - 中
            - 中
        - label: 开发者平台成熟度
          values:
            - 客户可见度低
            - 高
            - 中
            - 中-高
            - 中
    approximationNotes: 评级为有证据支撑的序数判断，不是基准分数。
    claimRefs:
      - CE005
