      - number: '7.4'
        title: 财务 / 模型与执行风险：真正威胁不是增长崩塌，而是低质量增长
        blocks:
          - type: paragraph
            body: >-
              财务风险来自规模，而不是没有规模。公开来源显示，公司信贷账簿庞大且仍在增长，融资向 CDB
              转移，盈利时断时续，亏损和竞争压力仍清晰可见。这正是授信质量差、融资成本上升、客户主账户属性偏弱，或过度依赖不够耐久队列会快速压缩价值的场景，即便头条账户数还在增长。2025 年 6
              月声明显示，拨备前总应收款超过 R$7 billion；年末申报文件和 2026 年报道则指向超过 R$5.3 billion 的 CDB
              融资，以及虽有改善但仍不轻的亏损历史。再叠加高利率和违约环境，核心风险就很清楚：Neon 可能继续增长，却无法把增长转化成耐久的风险调整后回报。执行风险在管理层层面同样重要，因为公司同时平衡产品扩张、MEI
              迁移、信贷增长和运营纪律。
