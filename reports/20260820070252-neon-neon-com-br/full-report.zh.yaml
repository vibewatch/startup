      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 观察 / 继续研究
        - 中
        - 高
        - 基于公开证据，合理到偏高
        - 保持跟进，但不要仅依据过期估值承做
      - - 转向买入的情形
        - 仅在私有尽调之后
        - 高，但可能改善
        - 如证据充分且价格纪律守住，可能变得有吸引力
        - 需要主账户地位、信贷质量和股权结构表清晰
      - - 转向回避的情形
        - 负面尽调会推高置信度
        - 高或严重
        - 质量指标若不及预期，价格会显得昂贵
        - 若更新数据不支持当前或更高估值，直接放弃
