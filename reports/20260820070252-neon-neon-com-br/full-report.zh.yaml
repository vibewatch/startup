  - id: TV005
    title: 投资逻辑失效与止损触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 更新后的股权结构表显示沉重优先权或稀释压力
        - 新资金条款显著压低普通股等价上行空间
        - 即使公司表现良好，回报也会下降
        - 要求更低入场价，或退出
