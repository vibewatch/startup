      - number: '2.5'
        title: 约束、竞争和结论：机会很大，但盈利压力是结构性的
        blocks:
          - type: paragraph
            body: >-
              让 Neon 成立的同一个市场，也让这门生意更难。McKinsey 指出，金融科技公司已经持有 55% 的活期账户；机构试图走出小众产品后，盈利压力随之上升。Riotimes
              和公开同业披露解释了原因：Nubank、Inter、PicPay、C6、PagBank 和 Mercado Pago
              的规模都远大于一家创业公司，但仍在用户体验、嵌入式信贷和主账户地位上竞争。RankingsLatAm 的调查进一步说明，分发已经不够；数字可靠性和满意度是核心竞争变量，PagBank、Nu 和 Mercado
              Pago 领先 APS 排名，Inter
              则在降低不满意度上表现突出。宏观条件也不轻松。高利率、逾期波动和资金成本，可以迅速压缩回报；在这个市场里，单靠低费率账户无法覆盖账单。因此，合适的市场结论是：需求和基础设施为正，但变现必须清醒看待。Neon
              身处一个非常大的市场，不过真正可触达的价值池只属于那些能把总账户转成活跃、低成本、承销扎实金融关系的机构。
