      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 主账户地位提升，ARPAC / 变现改善，资金纪律保持，IPO 准备度变得可信
        - 估值突破过期的 $1.6B 标记，向高溢价成长型 fintech 区间靠拢；相对当前基准有可观上行
        - 执行、信贷和宏观仍然重要
        - 可能成立，但需要私有证据
      - - 基准
        - 收入质量持续改善，客户深度温和提升，估值仍接近历史独角兽区间
        - 大致维持 $1.4B-$1.7B 这类区间；回报高度取决于实际入场价
        - 不透明和稀释仍会压低回报
        - 最符合公开证据
      - - 悲观
        - 总规模仍大，但主账户使用、损失或资金成本不及预期
        - 公允价值压到过期估值以下，激进入场会带来弱回报或负回报
        - 客户质量、竞争和资金压力
        - 如果没有更好披露，非常可能
    notes: 公开证据更支持区间式情景分析，而不是点估计。
    claimRefs:
