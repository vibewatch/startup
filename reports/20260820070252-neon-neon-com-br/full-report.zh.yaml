      - number: '2.2'
        title: TAM/SAM/SOM 视角：巴西很大，但主账户地位才是真正稀缺资源
        blocks:
          - type: paragraph
            body: >-
              即使不做激进假设，巴西全国层面的机会也很大。IBGE 给出的巴西 2025 年人口为 213.4 million；McKinsey 估计，到 2025 年，巴西有超过 200 million
              数字化参与公民、188 million 移动互联网用户，成人银行渗透率达到 90%。这些事实支撑了数字金融服务的巨大
              TAM，但也说明一个宽泛的市场规模数字可能误导判断：如果几乎所有成年人已经有账户，而巴西人平均维持 4.4 个银行关系，瓶颈就不是初次开户，而是钱包份额、互动深度和风险调整后的变现。Neon 自称拥有 32
              million 客户，意味着按总账户口径，公司已穿透巴西人口中相当有意义的一部分。更有用的 SAM，是那些在信贷、储蓄和主账户质量上仍服务不足的工薪阶层消费者和 MEI。Riotimes 仍称 60
              million 成年人没有信用卡，30% 到 50% 人口银行服务不足；这解释了为什么 Neon 的产品路线图反复回到担保额度卡、工资信贷、FGTS 提前支取和 MEI 工作流，而不只是获客发卡。
