            body: >-
              Neon 的竞争挑战被结构性偏低的切换成本放大。McKinsey 称巴西人平均持有 4.4 个银行账户，这意味着新增一个 app 很容易，降为第二选择也很容易。Open Finance 和 Pix
              降低了部分客户摩擦——这有利于挑战者对抗传统大行——但也削弱了任何单一挑战者的锁定优势。信用卡、工资链接、工资入账和经常性账单流可以制造一些粘性，但市场证据显示，用户仍会奖励那个感觉最可靠、最完整的
              app。RankingsLatAm 把客户满意度抬升为核心竞争变量，也强调了这一点；Inter 可以在低不满意度上领先，PagBank 和 Nu
              则在满意度强度上领先。合作伙伴权力又叠加一层。雇主渠道对工资信贷重要，卡组织和支付 rails 仍是基础设施，marketplace 或商户生态则给部分同业特权数据和流量。Neon
              仍能赢，但路径靠执行、主账户地位和承销纪律，而不是高结构性锁定。
