      - number: '1.5'
        title: 里程碑、负面历史与当前判断
        blocks:
          - type: paragraph
            body: >-
              里程碑记录把一个有吸引力的韧性故事，与持久的风险提醒放在一起。Neon 从服务银行不足消费者的方案，成长为独角兽 neobank，收购并整合 MEI Fácil 服务微型创业者，2024 年达到盈亏平衡，并在
              2025 年第一季度报告盈利。但同一段历史里也有 2018 年的剧烈冲击：Banco Central 清算了独立的 Banco Neon 实体，也就是当时作为 Neon
              合作银行运营的机构，部分服务一度中断，也暴露出基础设施依赖，尽管 Neon Pagamentos 本身存续下来。最近，Exame 把 Neon 2023 年和 2024
              年亏损归因于信贷增长过于激进、逾期率较高和资金成本昂贵，直到重组和领导层重置后才改善。对投资判断来说，这意味着 Neon
              现在更成熟、资本更充足，但风险并未完全出清。投资人可以合理地把它看作一家可信、已成规模、执行在改善的金融特许经营；同时仍需要更深的证据，验证董事会结构、真实活跃客户质量、长期资金来源，以及增长和信贷环境正常化后盈利能否持续。
