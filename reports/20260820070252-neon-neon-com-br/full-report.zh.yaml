  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：2018 年 Banco Neon 被清算仍是重要历史背景，即便当前实体已走出那一页
        blocks:
          - type: paragraph
            body: >-
              最重要的历史风险标记，是 Banco Central 在 2018 年清算 Banco Neon；UOL、Veja 和 Convergência Digital 都广泛报道了这一事件。那次事件没有终结更广义的
              Neon 消费金融努力，但它永久抬高了投资者评估监管韧性、关联实体复杂度和控制质量的门槛。较新的材料明显更强：当前披露强调已获授权的支付机构身份、受监管的合作伙伴关系、隐私和 LGPD
              流程，以及更成熟的融资结构。即便如此，2018 年的教训并未过时。Neon
              公开产品栈横跨多个受监管实体，以及代理行或合作伙伴架构，因此法律和监管滑坡仍可能从牌照、披露、隐私处理、消费者保护义务或产品伙伴边界中冒出来。正确的监管解读是：监管姿态已经改善，但残余敞口并不小，而不是干净无虞的简单结构。
