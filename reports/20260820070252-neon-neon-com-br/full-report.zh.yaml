      - number: '8.2'
        title: 投资逻辑与反向逻辑：争论焦点是规模质量，而不是规模是否存在
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑很直接。Neon 有巨大的总触达、正在改善的经济性、更丰富的融资来源、产品广度和持续的机构背书。它所处的数字金融市场很大，2025
              年来自发展金融机构的延伸轮说明动能不只是表面。反向逻辑同样严肃：巴西竞争拥挤，客户多栖是结构性现实，信贷损失和融资成本可能迅速抹掉表面进展，而公司仍未披露能让投资者判断 32M
              基数中有多少真正作为主账户使用且可盈利的质量指标。这一点重要，因为有规模的金融科技公司仍可能被高估，前提是市场把总触达误认为耐久的经济深度。换句话说，投资问题不是 Neon
              有没有做出真实业务。它做到了。问题在于，在投资者看到主账户地位、风险调整后信贷回报和真正退出准备度之前，现有或隐含价格是否已经吃掉了大部分上行空间。
            claimRefs:
              - CV009
