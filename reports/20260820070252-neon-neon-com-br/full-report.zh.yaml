  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 何种证据会改变判断
    rows:
      - - 庞大客户覆盖叠加改善中的经济性，可能复利成一家有韧性的规模化 fintech
        - 若 Neon 证明主账户渗透和重复多产品行为，判断会增强
      - - 资金结构在改善，发展金融投资者也验证了治理和韧性
        - 若资金成本或资本依赖仍高于预期，判断会削弱
      - - 产品宽度和 MEI 邻近场景可随时间加深变现
        - 若迁移、支持或伙伴依赖挡住产品扩张，判断会削弱
      - - 反向逻辑：多归属市场里，总账户数可能高估经济深度
        - 若管理层拿出主账户地位和队列盈利数据，反向判断会缓和
      - - 反向逻辑：即使运营改善，2025 轮融资也未必意味着入场价有吸引力
        - 若估值条款较 2022 年持平 / 下调，或为新资金提供投资者友好的下行保护，反向判断会缓和
      - - 反向逻辑：竞争和利率压缩回报的速度，可能快于客户增长扩张回报
        - 若承保和资金数据证明能穿越周期，反向判断会缓和
    notes: 每个投资逻辑点都绑定一个具体证据摆动因子。
    claimRefs:
