      - number: '1.3'
        title: 融资历史、投资人和资本基础
        blocks:
          - type: paragraph
            body: >-
              Neon 的资本历史显示，公司反复拿到大型全球投资人的支持；但公开记录混合了官方时间线、较早的创始人访谈和二手摘要，而不是一份干净的股权结构披露。最清晰的锚点是 2022 年 2 月由 BBVA 领投的
              US$300 million 融资，TechCrunch 称该轮让 Neon 估值达到 US$1.6 billion，并正式成为独角兽。公司官方时间线还记录了更早的资本里程碑，包括 2019 年由 Banco
              Votorantim 和 General Atlantic 支持的 R$400 million 融资，之后是 2022 年 BBVA 融资和三段式 Series E。2024 年和 2025 年公开材料把
              Series E 对齐为：2023 年 12 月和 2024 年 8 月合计融资 R$518 million，随后在 2025 年 7 月扩展至总额 R$720 million。BrazilCham 和
              Fintech News America 称 IFC 与 DEG 是该扩展轮的新投资人，Startups 则称 BBVA 和 General Atlantic
              也参与。融资故事因此在投资人质量和近期资本可得性上很强，但在优先权条款、既有稀释，以及 2025 年准确投后估值上仍偏弱。
