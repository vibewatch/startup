  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：消费者数字银行，加上相邻信贷、储蓄和 MEI 工作流
        blocks:
          - type: paragraph
            body: >-
              对 Neon 来说，相关市场比消费者活期账户更宽，但又窄于整个巴西金融服务业。Neon 竞争的领域包括数字交易账户、支付流、信用卡、个人贷款、工资挂钩贷款、FGTS 提前支取、储蓄 / CDB 吸收，以及面向
              MEI 的轻量业务金融工具。McKinsey 把巴西描述为一个全栈数字金融系统：Pix、Open Finance、数字身份和代币化 rails
              正在重写消费者和小企业的交易方式。因此，纳入的支出池包括日常余额、支付活动、短期限消费信贷、储蓄产品和微型创业者运营金融；排除在核心市场之外的是批发银行、资本市场发行业务和复杂的富裕人群财富管理。Neon
              因此位于 neobank、贷款机构和互动驱动型金融超级 app 之间。市场边界很重要，因为公司的核心问题不是巴西人是否想要某种数字账户——他们已经需要并使用——而是 Neon
              能否成为价格敏感、银行服务不足用户的主要关系；这些用户的金融活动如今可以在多个移动 app 之间轻松迁移。
