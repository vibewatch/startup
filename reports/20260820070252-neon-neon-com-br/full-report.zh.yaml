      - number: '1.2'
        title: 创始人、领导层交接与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人身份最明确地锚定在 Pedro Conrade 身上。历史记录反复把他列为创始人和早期 CEO。独立创始人访谈和 TechCrunch 报道都把他放在 Neon 创立和早期使命的中心；即便正式交棒后，公司
              2025 年高管签名页面仍把他列入核心高管。2024 年 12 月，Neon 宣布 Fernando Miranda 出任 CEO，并让 Conrade
              转入董事会，治理图景发生实质变化：公司从创始人带队的高速增长，转向更职业化的规模扩张和盈利纪律。这次交接很重要，因为 2025 年运营评论越来越多来自 Miranda、Jamil Marques 和 Wilton
              Pinheiro，而不是 Conrade。公开来源还显示，2025
              年公司在法务、合规、风险和技术管理层上补强；但完整董事会名单、委员会结构、持股比例和投资人控制条款没有披露。结果是，市场对高级管理层有足够可见度，但机构尽调所需的正式治理信息仍不完整。
