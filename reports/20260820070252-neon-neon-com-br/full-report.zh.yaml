    sections:
      - number: '1.1'
        title: 身份、定位与监管边界
        blocks:
          - type: paragraph
            body: >-
              Neon 是一家私营巴西数字银行集团，总部位于 São Paulo，成立于 2016 年。公司自己的机构材料称，Neon 是受 Banco Central do Brasil
              监管的授权支付机构，面向巴西普通劳动者，提供数字账户、信用卡、贷款、Pix 和储蓄产品，避开传统大行客户长期承受的复杂收费。官方和独立报道给出的起源叙事一致：创始人 Pedro Conrade
              在亲身经历不透明银行收费后创办 Neon，并把公司定位在可得性、简单性和金融普惠，而不是高端银行服务。TechCrunch 和公司时间线也清楚显示，Neon
              从预付卡和支付方案，扩展成更完整的类银行栈，目标是成为中低收入用户的主要金融关系，而不只是第二张卡或消费 app。
