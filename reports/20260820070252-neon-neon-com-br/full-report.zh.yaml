  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品：Neon 是面向大众消费者和 MEI、以 app 为中心的金融操作系统
        blocks:
          - type: paragraph
            body: >-
              理解 Neon 产品，最干净的方式是看客户工作流，而不是看法律实体标签。用户通常从数字账户、虚拟卡或实体卡、Pix 和基础资金流转进入；之后，app 试图借助信贷、储蓄 /
              CDB、Viracrédito、贷款、FGTS 提前支取，以及越来越统一的 MEI 区域，成为日常金融操作界面。公开材料一贯把 Neon 定位为透明、低摩擦的金融
              app，而不是狭窄的单一产品贷款机构。这很重要，因为产品体验围绕习惯循环搭建：交易、持有一定余额、获得或扩大信贷资格，并在不离开 app 的情况下加入相邻金融任务。MEI
              迁移材料把工作流说得更清楚：个人和微型企业任务被合并到同一个界面。实际交付中，Neon 提供的是打包的消费金融工作流；技术负担不只是功能开发，还包括可靠编排支付、发卡、信贷决策、通知、支持和合规控制。
