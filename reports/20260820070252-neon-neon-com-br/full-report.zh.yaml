            body: >-
              财务结论应当建设性但不能自满。Neon 显然已经走出纯粹不惜代价增长的状态：公开来源支持 2024 年末盈亏平衡、2025
              年阶段性盈利、总收入强劲增长、更大的信贷账簿，以及更多元的资金结构。但公开记录仍缺少投资人完整承销一家消费信贷驱动银行所需的指标：CAC、按队列计算的回本周期、活跃主账户渗透、按产品拆分的贡献利润率、按客群拆分的逾期
              / vintage 曲线、存款 beta、实际资金成本，以及信贷增长中来自最安全和最高风险借款人层级的比例。即便更正面的披露也承认需要谨慎。Estadão
              强调竞争压力和高利率，财务报表则显示大额预期损失拨备，以及对银行卡应收款的实质性资产负债表投入。正确结论是，Neon
              比前几年健康得多，但盈利质量尚未被充分证明，不能在没有更多管理层数据的情况下干净地跨过承销门槛。
