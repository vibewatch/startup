  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位 / 驱动因素
      - 当前公开状态
      - 收入质量判断
      - 尽调问题
    rows:
      - - 卡应收款 / 循环信贷经济性
        - 来自信用卡账簿的利息、费用和应收款变现
        - 应收余额、还款行为、APR 和损失率
        - 明显重要；信用卡是信贷账簿的主要组成
        - 潜在质量强，但对逾期和资金成本高度敏感
        - 要求提供产品级收益率、核销和循环信贷组合
      - - 个人贷款
        - 无担保分期贷款的利息收入
        - 放款量、审批、收益率、预期损失
        - 披露为增长中的产品线
        - 可分散变现来源，但信贷质量关键
        - 要求提供账龄曲线和按队列拆分的净息差
      - - 工资挂钩贷款
        - consignado privado 的利息收入
        - 雇主 / 员工触达、余额增长、收益率、违约率
        - 基数较小，但增速快于信用卡
        - 风险调整后经济性可能优于无担保信贷
        - 索取雇主 / 渠道结构和实际损失表现
      - - FGTS 垫款
        - 与 FGTS 资金流绑定的有担保 / 结构化消费信贷
        - 合格用户、垫款规模、定价、采用率
        - 已公开营销，但未披露收入拆分
        - 如果风控和反欺诈守得住，经济性很可能有吸引力
        - 索取放款量、收益率和重复使用数据
      - - CDB / 存款利差支撑
        - 从客户吸收资金并投向资产
        - 存款余额、资金成本、久期
        - 财报和 2025 年报道里披露度高
        - 如果资金成本保持克制，可支撑利润率
        - 索取加权平均资金成本和 beta
      - - 支付 / 交换费经济性
        - 卡使用和交易服务经济性
        - 活跃卡、消费额、交换费、结算量
        - 经济意义明确，但未单独披露
        - 有助于把参与度变现，但不太可能独自撑起模型
        - 索取 TPV、活跃卡率和交换费总贡献
    notes: 留存证据支持的模型是信贷主导，靠用户参与和资金利差支撑，而不是重手续费的银行模式。
