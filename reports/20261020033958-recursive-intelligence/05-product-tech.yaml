schemaVersion: "report-v2"
artifact: product-tech
slug: recursive-intelligence
runDate: "2026-10-20"
company:
  name: Recursive Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Ricursive is publicly described as an AI-native, full-stack chip-design platform spanning
    placement through verification, but the strongest technical proof still belongs to the
    founders' earlier AlphaChip work. Current product architecture, integrations, production
    deployments, reliability, security controls, and Ricursive-specific benchmark results remain
    undisclosed in the assigned evidence.
sections:
  - id: product-scope
    title: Product scope and user workflow
    body: >-
      Ricursive is building design software rather than manufacturing chips: TechCrunch reports
      that its intended users are chipmakers and other electronics companies seeking custom or
      conventional chips. The public proposition is broader than point floorplanning. The founders
      describe a platform that uses AI, including large language models, from component placement
      through design verification, while other coverage characterizes the ambition as a full-stack
      feedback loop between AI models and the silicon that runs them. This defines a plausible
      customer workflow from design intent to verified layout, but it does not establish a
      production SKU, supported process nodes, file formats, foundry signoff coverage, or realized
      cycle-time improvement. Investors should therefore treat the module map below as a boundary
      of the disclosed product thesis, not as evidence that every module is currently shipping.
    claimRefs: [CE001, CE002, CE003, CE009, CE013]
    tableRefs: [TE001]
  - id: architecture-and-learning-loop
    title: Architecture thesis and inherited technical proof
    body: >-
      The most concrete mechanism in the public record is the founders' AlphaChip predecessor.
      Google describes an edge-based graph neural network that represents relationships among
      connected components, places components sequentially, and learns from a reward based on final
      layout quality. Ricursive's founders now say their platform will learn across different chips
      so that each completed design improves later work. That is an important extension in product
      scope, but no source in the assigned pool discloses whether Ricursive reuses AlphaChip code,
      model weights, graph representations, training data, or validation infrastructure. The
      architecture map therefore separates historically demonstrated mechanisms from current
      company-described layers and from diligence-only dependencies. This distinction matters
      because transfer across customers and designs creates unresolved questions about data rights,
      isolation, reproducibility, and signoff accountability.
    claimRefs: [CE004, CE006, CE007, CE014]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: maturity-and-deployment
    title: Maturity, deployment, and operating dependencies
    body: >-
      Public maturity evidence remains pre-production in character. The founders declined to name
      early customers while describing inbound interest and a choice of development partners.
      Tech Funding News reports that the company is expanding research, engineering, compute, and
      distributed infrastructure to iterate across the chip-design stack; that is an input to
      development, not proof of tape-out, post-silicon performance, uptime, or repeatable
      integration. A low-reputation secondary article supplies aggressive cycle-time and
      power-reduction claims, but the assigned higher-quality sources do not corroborate those
      Ricursive-specific quantities. Meanwhile, sector funding remains unusually abundant, which
      raises the delivery benchmark rather than lowering it. The key diligence milestone is a
      named, production design carried from customer requirements through foundry-qualified
      signoff, with reproducible baselines and disclosed human intervention.
    claimRefs: [CE005, CE013, CE015, CE016]
    tableRefs: [TE003]
  - id: differentiation-and-controls
    title: Differentiation, competitive bar, and controls
    body: >-
      Ricursive's strongest differentiator is the founders' demonstrated AlphaChip pedigree:
      Google says the predecessor generated layouts used in multiple TPU generations and was
      extended by MediaTek. That proof validates AI-assisted floorplanning as a category, not the
      present platform's full-stack performance. The competitive bar has also moved. A Forbes
      contributor reports that incumbent EDA systems already apply AI across synthesis,
      place-and-route, physical design, coding, test planning, regression, and debugging, while
      cautioning that autonomous chip design remains years away. Ricursive therefore must prove
      cross-stage orchestration and learning advantages under fair baselines, rather than compare
      a broad roadmap with one narrow incumbent module. Trust controls are also material: advanced
      computing transactions can trigger end-user and parent-company export-license diligence, yet
      the assigned evidence contains no Ricursive trust center, security architecture, privacy
      terms, quality certifications, incident history, or model/data-governance documentation.
    claimRefs: [CE007, CE008, CE010, CE011, CE012]
tables:
  - id: TE001
    title: Disclosed product module and maturity matrix
    columns:
      - Module or asset
      - Primary user
      - Public status or maturity
      - Claimed differentiation
      - Diligence gap
    rows:
      - - Design-intent and full-stack interface
        - Chip architecture and design teams
        - Company-described; no public product documentation in the assigned pool
        - AI-native workflow intended to connect model and hardware iteration
        - Request supported inputs, outputs, process nodes, and release-stage evidence
      - - Placement and floorplanning
        - Physical-design engineers
        - Historical predecessor validated; current Ricursive benchmark undisclosed
        - Learning-based optimization informed by prior AlphaChip work
        - Reproduce results against human and incumbent EDA baselines
      - - Design verification
        - Verification and signoff teams
        - Stated product scope; public implementation details unavailable
        - Intended span from placement through verification
        - Identify covered checks, tool integrations, escalation, and signoff ownership
      - - Cross-chip learning loop
        - Enterprise design organizations
        - Founder-described roadmap or product thesis
        - Each design is intended to improve future design performance
        - Test isolation, permissioning, transfer benefit, and negative-transfer controls
      - - Distributed compute infrastructure
        - Internal ML and platform engineering
        - Infrastructure expansion reported; service characteristics undisclosed
        - Faster iteration across the design stack
        - Quantify training cost, serving cost, capacity, uptime, and recovery objectives
    notes: >-
      Statuses reflect only the assigned public sources as of 2026-10-20; predecessor AlphaChip
      evidence is not treated as proof that a corresponding Ricursive module is production-ready.
    claimRefs: [CE001, CE003, CE004, CE009, CE013]
  - id: TE002
    title: Workflow claims versus measurable proof
    columns:
      - User job
      - Disclosed approach
      - Best measurable evidence
      - Limitation
    rows:
      - - Convert chip requirements into an implementable layout
        - AI-assisted full-stack workflow using language models and optimization
        - No Ricursive-specific public benchmark in the assigned pool
        - Inputs, constraints, baseline methodology, and human effort are undisclosed
      - - Place connected components under design constraints
        - Reward-based learning informed by component relationships
        - AlphaChip produced layouts in hours rather than weeks or months
        - The result is historical predecessor evidence, not a Ricursive product result
      - - Improve across successive design tasks
        - Learn across different chips and carry experience forward
        - AlphaChip historically improved through prior placement tasks
        - Cross-customer transfer, data rights, and negative-transfer rates are undisclosed
      - - Verify and debug a design
        - Ricursive claims scope through verification
        - Incumbent tooling already reports automated test planning, regression, and debugging
        - No comparable Ricursive coverage, accuracy, or productivity result is public
    notes: >-
      Benefits are not directly comparable across rows; only the AlphaChip predecessor has a
      concrete elapsed-time comparison, and incumbent claims use different tasks and baselines.
    claimRefs: [CE003, CE004, CE006, CE007, CE010, CE011]
  - id: TE003
    title: Technology and operating architecture diligence
    columns:
      - Layer or process
      - Role
      - Dependency
      - Principal risk
    rows:
      - - Customer design context
        - Captures objectives, constraints, and reusable design knowledge
        - Access to sensitive specifications and qualified reference flows
        - Confidentiality, ownership, and cross-customer leakage
      - - Learning and optimization engine
        - Proposes and scores design decisions across chips
        - Representative training tasks, compute, and stable reward functions
        - Reward misspecification, non-reproducibility, and negative transfer
      - - EDA and verification integration
        - Converts proposals into checks and signoff-ready artifacts
        - Incumbent tool APIs, foundry rule decks, and human review
        - Integration fragility and unclear liability for failed signoff
      - - Compute and service operations
        - Trains models and runs iterative design workloads
        - Distributed infrastructure, capacity planning, and observability
        - Unpublished cost, latency, availability, and disaster-recovery posture
      - - Compliance and governance
        - Screens users, data, and controlled advanced-computing transactions
        - Customer ownership and headquarters diligence plus auditable controls
        - Export-license exposure and no public Ricursive control documentation
    notes: >-
      Risks are analytical diligence items derived from disclosed scope and external operating
      constraints; they are not recorded incidents or proof that a control failure has occurred.
    claimRefs: [CE002, CE005, CE012, CE013, CE016]
figures:
  - id: FE001
    title: Product architecture map by evidence status
    type: stack
    summary: >-
      A six-layer view separates customer inputs, disclosed product ambition, predecessor
      mechanisms, external dependencies, and the unverified production-control layer.
    data:
      layers:
        - label: Customer design intent
          detail: Sensitive specifications, objectives, constraints, and qualified baselines.
          items:
            - Requirements and architecture
            - Power, performance, and area objectives
        - label: AI interaction layer
          detail: Company-described use of large language models across a broader design workflow.
          items:
            - Natural-language or structured intent
            - Workflow orchestration
        - label: Learning and optimization
          detail: Cross-chip learning ambition informed by reward-based predecessor work.
          items:
            - Reward signal
            - Graph-based component relationships
            - Cross-design learning
        - label: Physical design and verification
          detail: Publicly claimed span from component placement through design verification.
          items:
            - Placement and floorplanning
            - Verification
        - label: Toolchain and compute dependencies
          detail: Distributed compute, incumbent EDA interfaces, foundry rules, and human review.
          items:
            - Training and inference infrastructure
            - EDA and signoff integration
        - label: Production controls
          detail: Reliability, isolation, security, quality, and compliance remain unverified.
          items:
            - Monitoring and recovery
            - Data governance and export screening
    approximationNotes: >-
      The diagram is a diligence model, not a disclosed Ricursive reference architecture; only
      layers and mechanisms explicitly distinguished in the cited claims are shown.
    claimRefs: [CE003, CE004, CE014]
callouts:
  - calloutType: strength
    title: Category proof exists
    body: >-
      AlphaChip gives the founding team unusually strong historical proof that learning-based
      floorplanning can reach real silicon, but that proof should not be extrapolated to every
      current Ricursive module.
    claimRefs: [CE007, CE008]
  - calloutType: risk
    title: Full-stack evidence has not caught up with full-stack scope
    body: >-
      No assigned source provides a named production customer, tape-out, post-silicon benchmark,
      integration matrix, reliability record, or public security and quality-control package for
      Ricursive.
    claimRefs: [CE003, CE005, CE015]
