  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: deployment-maturity
      missingEvidence: >-
        A named production customer, tape-out, post-silicon result, deployment date, and repeatable
        benchmark against human and incumbent EDA baselines.
      whyItMatters: >-
        Development-partner interest does not demonstrate that the current platform can complete a
        production flow or deliver its claimed time, cost, power, or performance benefits.
      diligencePath: >-
        Review one completed customer design under NDA, including baselines, intervention logs,
        foundry signoff, tape-out status, and measured post-silicon results.
      relatedQuestionRefs: [QE004, QE008]
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: material
      topic: technical-architecture
      missingEvidence: >-
        Current product documentation covering model architecture, data flow, supported EDA and
        foundry interfaces, verification scope, and cross-chip transfer controls.
      whyItMatters: >-
        Predecessor AlphaChip evidence cannot establish the architecture, coverage, or readiness of
        Ricursive's broader current platform.
      diligencePath: >-
        Obtain architecture diagrams, API and integration documentation, supported-flow matrices,
        model cards, evaluation reports, and a live technical walkthrough.
      relatedQuestionRefs: [QE003, QE004]
      relatedTableRefs: [TE001, TE003]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: >-
        Public or private evidence of security, privacy, customer-data isolation, quality
        management, incident response, export screening, and audit or certification status.
      whyItMatters: >-
        Chip specifications and design artifacts are highly sensitive, and controlled end users or
        destinations can add compliance obligations to deployment.
      diligencePath: >-
        Request the trust package, data-processing terms, threat model, audit results, incident
        register, quality procedures, and export-control compliance workflow.
      relatedQuestionRefs: [QE006, QE009]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        A public repository, package, release history, API forum, practitioner discussion, partner
        integration post, or other public developer or practitioner-community proxy.
      whyItMatters: >-
        No assigned source provides an independent signal of implementation activity, integration
        ergonomics, release cadence, or practitioner adoption.
