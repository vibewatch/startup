    title: Founder-market fit is unusually direct
    body: >-
      The founders' AlphaChip work provides production-linked evidence of relevant technical
      capability, rather than a merely adjacent AI resume.
    claimRefs: [CO005, CO014]
  - calloutType: risk
    title: Valuation has outrun public operating proof
    body: >-
      The $4 billion valuation is observable, but named customers, revenue, staffing, and
      Ricursive-specific benchmark results remain unavailable in the assigned evidence.
    claimRefs: [CO007, CO013, CO015]
