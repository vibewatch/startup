evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, ARR, customer count, current headcount, and complete operating-location data.
    whyItMatters: These metrics are needed to distinguish financing scale from commercial and organizational scale.
    diligencePath: Request current management accounts, customer schedules, HR roster, and legal-entity location list.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Full executive roster, board composition, observer rights, succession plan, and material leadership changes.
    whyItMatters: The public record indicates substantial founder dependence but does not show governance mitigants.
    diligencePath: Request the board deck, capitalization table, voting agreements, organization chart, and executive-change log.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: Complete capitalization table with ownership, board rights, preferences, debt, and secondary transactions.
    whyItMatters: Named round participation does not establish control, dilution, preference stack, or cash availability.
    diligencePath: Review signed financing documents, the fully diluted capitalization table, and all side letters.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: milestone-chronology
    missingEvidence: >-
      At least eight dated company milestones spanning product, customers, tape-outs, partnerships, regulatory events,
      and adverse events.
    whyItMatters: The public chronology is too short and financing-heavy to demonstrate operating progress.
    diligencePath: >-
      Obtain a management-verified milestone log and corroborate each material event with contracts, design records, or
      third-party evidence.
  - type: missing-source
    severity: material
    topic: legal-identity
    missingEvidence: Exact legal entity name, incorporation jurisdiction, registered address, and definitive brand history.
    whyItMatters: Public sources vary between Recursive and Ricursive, complicating entity-level diligence.
    diligencePath: Request formation documents and verify the entity in the applicable corporate registry.
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named paid customers, pilot scope, contract value, tape-outs, post-silicon results, and renewal or expansion
      evidence.
    whyItMatters: >-
      Without deployment evidence, broad buyer interest cannot be converted into adoption rates or a company-specific
      serviceable market.
    diligencePath: >-
      Request redacted contracts, design-partner references, tape-out records, benchmark protocols, and post-silicon
      validation from management.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: company-sizing
    missingEvidence: >-
      A bottom-up SAM and SOM built from target accounts, workflow-level pricing, eligible design programs, and expected
      penetration.
    whyItMatters: >-
      Generic EDA and semiconductor figures use different denominators and cannot establish Ricursive's realizable
      revenue opportunity.
    diligencePath: >-
      Obtain account segmentation, pipeline stages, expected annual contract value, deployment capacity, and a
      reconciled bottom-up market model.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-estimates
    missingEvidence: >-
      Original analyst tables supporting the approximately $20 billion current EDA market, $30.67 billion 2031 forecast,
      and approximately 74% incumbent share.
    whyItMatters: >-
      The retained source is a secondary synthesis and does not expose base year, geography, category boundary, or
      forecast methodology.
    diligencePath: >-
      Acquire the cited Mordor Intelligence and Wing Venture Capital materials or replace the estimates with
      public-company and industry-association data.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: benchmark-dispute
    missingEvidence: >-
      A current, reproducible Ricursive benchmark covering workload, process node, baseline tools, compute budget,
      power, performance, area, runtime, and signoff.
    whyItMatters: >-
      Without a like-for-like benchmark, the breadth and durability of technical differentiation cannot be separated
      from founder pedigree and company claims.
    diligencePath: >-
      Obtain benchmark artifacts and design-partner references, then reproduce at least one comparison with an
      independent EDA expert under matched constraints.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Ricursive price units, contract minimums, implementation fees, realized discounts, renewal terms, and economics
      for at least three customer cohorts.
    whyItMatters: >-
      Capability comparisons cannot establish procurement competitiveness, gross margin potential, or whether adoption
      requires services-heavy customization.
    diligencePath: >-
      Review current price sheets and anonymized executed contracts, then interview procurement owners at named design
      partners.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      A complete current census of AI-native EDA startups, incumbent modules, foundry programs, cloud design services,
      and co-design partners by buyer segment.
    whyItMatters: >-
      The assigned pool supports major alternative classes but not an exhaustive competitor list, so concentration and
      white-space judgments remain provisional.
    diligencePath: >-
      Build a buyer-led longlist from current procurement records, foundry partner directories, conference programs, and
      named semiconductor design teams.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Monthly revenue, ARR definition, bookings, billings, gross margin, customer concentration, and cash collections.
    whyItMatters: Without operating data, revenue quality, growth, retention, and valuation support cannot be underwritten.
    diligencePath: >-
      Review the general ledger, revenue-recognition policy, customer contracts, invoices, bank receipts, and cohort
      schedules.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net burn, debt, leases, compute commitments, approved hiring plan, and
      next-round trigger.
    whyItMatters: Funding raised does not establish usable liquidity or downside runway.
    diligencePath: Reconcile bank balances to the ledger and model base, downside, and delayed-commercialization cash cases.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: deployment-maturity
    missingEvidence: >-
      A named production customer, tape-out, post-silicon result, deployment date, and repeatable benchmark against
      human and incumbent EDA baselines.
    whyItMatters: >-
      Development-partner interest does not demonstrate that the current platform can complete a production flow or
      deliver its claimed time, cost, power, or performance benefits.
    diligencePath: >-
      Review one completed customer design under NDA, including baselines, intervention logs, foundry signoff, tape-out
      status, and measured post-silicon results.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      Current product documentation covering model architecture, data flow, supported EDA and foundry interfaces,
      verification scope, and cross-chip transfer controls.
    whyItMatters: >-
      Predecessor AlphaChip evidence cannot establish the architecture, coverage, or readiness of Ricursive's broader
      current platform.
    diligencePath: >-
      Obtain architecture diagrams, API and integration documentation, supported-flow matrices, model cards, evaluation
      reports, and a live technical walkthrough.
    relatedQuestionRefs:
      - QE003
      - QE004
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public or private evidence of security, privacy, customer-data isolation, quality management, incident response,
      export screening, and audit or certification status.
    whyItMatters: >-
      Chip specifications and design artifacts are highly sensitive, and controlled end users or destinations can add
      compliance obligations to deployment.
    diligencePath: >-
      Request the trust package, data-processing terms, threat model, audit results, incident register, quality
      procedures, and export-control compliance workflow.
    relatedQuestionRefs:
      - QE006
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public repository, package, release history, API forum, practitioner discussion, partner integration post, or
      other public developer or practitioner-community proxy.
    whyItMatters: >-
      No assigned source provides an independent signal of implementation activity, integration ergonomics, release
      cadence, or practitioner adoption.
    diligencePath: >-
      Ask for a private SDK and release log, then interview integration engineers at development partners and review
      support tickets and implementation timelines.
    relatedQuestionRefs:
      - QE009
  - type: conflicting-data
    severity: material
    topic: unverified-performance
    missingEvidence: Primary benchmark methodology for the secondary article's claimed cycle-time and power-reduction quantities.
    whyItMatters: Unsupported quantities could materially overstate product maturity and differentiation.
    diligencePath: >-
      Require benchmark reports defining workload, node, baseline, sample size, quality gates, human effort,
      repeatability, and whether results are simulated or measured in silicon.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A current named Ricursive customer roster with contract status, pilot or production stage, tape-out status, use
      case, and attributable outcome.
    whyItMatters: >-
      Historical AlphaChip deployments cannot establish Ricursive's commercial conversion, reference quality, or
      production reliability.
    diligencePath: >-
      Obtain management's customer schedule, verify a sample against contracts, and conduct reference calls with design,
      verification, procurement, and executive sponsors.
    relatedQuestionRefs:
      - QU001
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-metrics-gap
    missingEvidence: >-
      Customer count, active projects, pilot-to-production conversion, repeat tape-outs, gross and net retention, churn,
      renewal, contract duration, utilization, and cohort data.
    whyItMatters: Without these metrics, durability and repeatability cannot be separated from early design-partner experimentation.
    diligencePath: >-
      Review CRM exports, executed agreements, project telemetry, invoices, renewal records, and cohort schedules
      reconciled to finance.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
