      - number: '3.3'
        title: 既有渠道与内部建设经济性决定采用
        blocks:
          - type: paragraph
            body: >-
              既有厂商可以把 AI 嵌入成熟的 EDA 工具链、采购合同、验证流程和晶圆厂认证流程，而 Ricursive 必须先证明兼容性和可信度，才能替换或扩展这些工作流。超大规模云厂商是另一条路径：Microsoft 的
              Maia 200 账户描述了硅片、网络、软件、冷却和数据中心运营之间的共同开发，展示了最大型买方能够实现的集成深度。一篇独立分析师博客估计，内部定制硅片需要高度统一的工作负载、超过 $500 million
              的年度推理支出和多年承诺。这些估计是方向性的，并非独立基准阈值，但说明许多买方可能会选择既有厂商或共同设计伙伴，而不是从零组建内部团队。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
