              的种子轮。这样的资本基础可以支持执行，但估值跃升也提高了下一轮融资或流动性事件前所需的技术和商业证明量。风险不是融资等于现金消耗，也不是估值证明了脆弱性；两种结论都没有证据支持。更准确地说，估值让客户、收入、流片和治理证据的缺失，对投资者更为重要。如果管理层无法提供可独立审阅的设计赢单、已签署商业条款、经验证的流片结果，以及与资金续航挂钩的董事会批准运营计划，投资论点就应被打破。因此，热力图把融资与证明之间的不匹配排在行业供给约束之前；后者重要，但更不具有公司特异性。
