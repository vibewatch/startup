      - number: '3.2'
        title: 广泛目标领先于可复现证明
        blocks:
          - type: paragraph
            body: >-
              产品目标覆盖从组件布局到设计验证，并希望在连续芯片项目中学习，范围比单点布局规划工具更广。最强的技术先例是据报道 AlphaChip 已用于 Google TPU
              的三代产品。该先例虽相关，却存在争议：独立研究人员向 New Scientist
              表示需要公开、最新的基准，一项复现实验也未能稳定击败人类专家或传统算法。争议之所以重要，是因为商业买方会同时比较功耗、性能、面积、运行时间、计算成本、签核集成和可复现性。留存证据没有证明 Ricursive
              在这套完整评分表上的表现。
