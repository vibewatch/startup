  - id: TV002
    title: 投资论点与反论点
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些事实会改变判断
    rows:
      - - 技术渊源
        - AlphaChip 已有在 Google TPU 布局中投入生产使用的记录。
        - 在布局、验证、功耗、性能、面积和周期时间等维度，Ricursive 的基准测试需由独立方复现。
      - - 市场需求
        - 行业分析称工程产能受限，且 AI 在芯片设计中的使用正在增长。
        - 证明客户无需新增自动化也能满足设计需求，或 AI 采用停滞。
      - - 商业验证
        - 创始人描述芯片厂商需求广泛，但早期客户名称仍未公开。
        - 具名付费部署、续约、扩容和可供引用的生产流片记录。
      - - 竞争地位
        - Ricursive 提出覆盖广泛的 AI 原生工作流，而 Cadence 已在营销并测试智能体自动化。
        - 以实测工作流替代程度、互操作性和相对在位套件的可防御性能为依据。
    notes: 该表将创始人此前参与 AlphaChip 的证据，与 Ricursive 当前产品的证据分开；竞争对手厂商的自述不视为 Ricursive 的独立基准测试。
    claimRefs:
