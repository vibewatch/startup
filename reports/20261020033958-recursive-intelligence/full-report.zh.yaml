              - CP016
      - number: '3.4'
        title: 潜在护城河是学习数据与工作流集成，而不只是资金
        blocks:
          - type: paragraph
            body: >-
              Ricursive
              可能形成的持久优势，是一个随已完成设计而改进、且覆盖范围超过狭窄布局优化器的跨芯片学习闭环。能否持久取决于其获取专有设计数据、验证结果、晶圆厂和签核集成的能力，以及把合格项目迁离既有工具的成本。公开证据尚未显示已点名客户、实际定价、流片或合同锁定；TechCrunch
              特别报道创始人不会透露早期客户。AlphaChip 的不利基准争论也意味着，不能用创始人履历替代可复现的 Ricursive 结果。因此，投资判断应维持“可能有差异化，但尚未证明具备持久性”。
