            body: >-
              Recursive 位于由战略投资者、计算供应商、EDA 既有厂商、晶圆厂和大型芯片买方组成的集中生态中。TechCrunch 报道 Nvidia
              是投资者，而主要芯片厂商是目标客户，这既带来战略接入，也带来信息边界、中立性和集中度问题。同一报道称创始人不会透露早期客户；这不是客户不存在的证明，却阻碍了公开评估生产状态、续约或集中度。融资报道还称资金将扩充计算基础设施，使供应商条款和利用率成为重要运营变量。应要求管理层按角色披露交易对手、已承诺收入和计算支出的比例、关联方保护、客户数据隔离、晶圆厂和签核依赖，以及备用产能。否决标准包括独立流片失败、关键基础设施供应商在没有冗余的情况下退出、单一客户在没有终止保护的情况下占据大部分合同收入，或拒绝提供这里要求的控制和商业证据。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资否决标准
            body: 如果管理层无法证明知识产权所有权和数据控制，无法提供有基准结果的独立成功流片，或无法将客户承诺和运营里程碑与支撑 $4 billion 报道估值的资本计划对账，则停止投资判断。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决定与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资信号异常强：多份独立报道称，公司成立仅数月便完成 $300 million Series A、达到 $4 billion 估值，此前还有一轮报道估值 $750 million 的 $35 million
              种子轮。这一序列证明投资者需求，也给公司带来大量已募资金，但不能证明可用现金、收入质量、产品市场匹配或可投资回报。留存来源没有披露收入、ARR、毛利率、现金消耗、资金续航、持股、清算优先权或老股转让价格。因此，入场纪律应以里程碑为基础，而不是锚定最新公开估值。建议：继续研究；置信度：中；风险：高；估值判断：偏高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: 投资论点、反论点与竞争压力
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在可信的技术先例上。Google DeepMind 称 AlphaChip 生成的布局用于多代 TPU；TechCrunch
              报道创始人计划把方法从布局扩展到验证，并跨芯片学习。工程产能受限，需求环境因此有利。反论点同样重要：当前公司的客户名称仍未披露，而 Cadence 已经推出并与客户测试智能代理式设计与验证产品。Forbes
              撰稿人也判断完全自主的芯片设计仍需多年。创始人履历降低了技术概念风险，但不能替代 Ricursive 特有的生产基准、可重复部署或商业经济性。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV009
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 情景框架与可比背景
        blocks:
          - type: paragraph
            body: >-
              由于所需运营输入未披露，公开证据不足以支持传统收入倍数或 DCF 估值。最新的 $4 billion 融资估值因此是交易参考，而不是独立推导的公允价值结论。XCENA
              提供一个方向性的私募市场比较：它在芯片仍处于原型阶段、预计 2027 年产生收入时，以 $570 million 估值融资 $135
              million。两家公司的业务和资本需求并非直接可比，因此不应把差额转换成倍数。相反，乐观、基准和悲观情景应以已点名的生产赢单、独立测量的设计结果、经常性经济性、竞争替代和融资条款为条件。公开证据无法赋予概率百分比和目标回报。
            claimRefs:
              - CV002
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点打破触发器
        blocks:
          - type: paragraph
            body: >-
              留存证据没有证明退出准备度。由于主要芯片厂商被描述为目标客户、Nvidia 是投资者，战略性退出结果可能存在，但没有来源提供 Ricursive
              的已签客户名单、经常性收入基础、经审计经济数据、收购先例或公开市场路径。在判断持有期或退出价值前，尽调应取得股权结构表与优先股堆叠、每月现金使用、客户合同、设计里程碑、独立的功耗—性能—面积结果，以及晶圆厂和既有
              EDA 流程的集成计划。论点打破触发器包括生产基准失败、下一项重要产品里程碑后仍无已点名部署、现金使用明显快于计划，或使新资本处于次位的融资条款。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是门槛问题
            body: 技术履历和资本获取能力足以支持尽调，不足以支持不计价格的投资。积极判断必须有 Ricursive 特有的生产证据、经常性经济性，以及能够支撑目标回报的融资条款。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV016
