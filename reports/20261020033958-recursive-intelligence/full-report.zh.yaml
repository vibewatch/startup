chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与业务边界
        blocks:
          - type: paragraph
            body: >-
              独立报道将 Ricursive 描述为一家前沿 AI 实验室，开发能够跨芯片学习的芯片设计工具。报道也划出一条重要边界：公司开发的是设计芯片的 AI
              工具，而不是自行制造或销售芯片。其目标平台覆盖从组件布局到设计验证，商业目标足够宽泛，理论上可服务任何需要定制芯片的电子公司。Crunchbase
              将公司所在地标为加利福尼亚州帕洛阿尔托，但官网没有提供法定实体名称或完整运营地点清单。因此，更适合把它视为一家早期、私有的 EDA
              与设计自动化平台，而非半导体厂商。收入、ARR、客户数、员工人数及其他地点，在指定公开证据中均未披露。
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO013
              - CO016
      - number: '1.2'
        title: 领导层与执行依赖
        blocks:
          - type: paragraph
            body: >-
              联合创始人 Anna Goldie 和 Azalia Mirhoseini 分别担任 CEO 和 CTO。她们最直接的资历来自共同参与 Google 的 AlphaChip；Google DeepMind 在
              2024 年 9 月报告称，该方法已生成用于最近三代 TPU 的布局。公司官网还将多篇芯片设计论文及在主要 AI
              和半导体机构的经历归于更广泛的团队。这样的履历是现有最强的执行信号，但也带来集中度风险。指定来源没有披露更完整的高管梯队、董事会、独立董事或继任安排。尽调应区分创始人已证明的研究影响力，与 Ricursive
              尚未证明能否把这项能力制度化并落到商业组织中的能力。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
              - CO015
      - number: '1.3'
        title: 融资与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              融资节奏异常紧凑。据报道，2025 年 12 月完成 Sequoia 领投的 $35 million 种子轮，估值 $750 million；随后在 2026 年 1 月 26 日完成 Lightspeed
              领投的 $300 million Series A，估值 $4 billion。              公司及多家独立媒体均印证累计融资 $335 million。Series A 银团既有财务投资者，也通过
              NVentures
              带来战略性半导体敞口，但参与本身不能证明存在客户合同、设计赢单、董事会席位或商业验证。公开报道称资金将用于研发招聘和扩充计算基础设施。持股比例、投票权、清算优先权、董事会席位、债务、老股转让及剩余现金均未披露，因此目前只能从公开披露的轮次层面评估资本结构。
            claimRefs:
              - CO006
