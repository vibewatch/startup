            body: >-
              AlphaChip 据报道已用于生产，但独立研究人员质疑其广泛的优越性主张，并要求可复现的比较。投资判断应要求一项最新的 Ricursive
              基准，披露工作负载、工艺节点、基线、计算预算、功耗、性能、面积、运行时间和签核结果。
            calloutType: risk
            claimRefs:
