  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 必要假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 具名生产部署；独立基准测试领先；可重复的经常性经济性；稀释可控。
        - 只有在私有模型证明能够达到所需目标回报后，$4B 参考估值之上才有依据支持溢价。
        - 付费扩张、成功流片和独立复现结果都会提高该信号；公开信息不足以支持任何百分比。
        - 基准测试无法转化为生产使用。
      - - 基准
        - 试点继续推进，但客户集中度、单位经济性和全栈范围仍只得到部分验证。
        - 将 $4B 视为融资参考价；在经济性得到核实前，应压价交易，或要求与里程碑挂钩的保护条款。
        - 在资本获取能力强但公开商业证据不完整的情况下，这一情景最为一致。
        - 下一项重大里程碑之后，仍未披露具名部署或经常性经济性。
      - - 悲观
        - 在位厂商缩小能力差距；商业化延期；算力和招聘消耗资本的速度超过计划。
        - 估值低于最新定价，并将下轮融资或优先权悬置风险计入投资判断，而不是假设公开市场退出。
        - 如果类似 Cadence 的产品赢得工作流，而 Ricursive 的证据仍停留在私有范围内，该信号会上升。
        - 设计里程碑未达成、融资条款不利，或现金跑道低于尽调情景。
    notes: 情景区间是定性的，因为公开来源没有提供收入、现金流、所有权、优先权或退出倍数输入；没有凭空编造概率百分比或目标回报。
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV016
