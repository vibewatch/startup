      - CE004
      - CE014
  - id: FU001
    title: 经证据限定的客户采用旅程
    type: journey-map
    summary: 公开证据显示，目标账户已产生兴趣，并存在未公开的开发伙伴；生产验证、续约和多项目扩张仍未经验证。
    data:
      items:
        - label: 锁定目标账户
          detail: 需要定制芯片的芯片厂商和电子产品公司是所述目标客户。
          status: supported
          touchpoints:
            - 创始人访谈
            - 市场定位
        - label: 主动兴趣
          detail: 创始人称，已有大型芯片厂商主动联系。
          status: company-reported
          touchpoints:
            - 高管外联
            - 技术讨论
        - label: 选择开发伙伴
          detail: 创始人称，他们可以选择最初的开发伙伴，但没有透露名称。
          status: company-reported
          touchpoints:
            - 伙伴评估
            - 范围定义
        - label: 概念验证（PoC）
          detail: 一篇二手文章将 2026 年原型描述为预期目标，而非已完成结果。
          status: unverified
          touchpoints:
            - 受控设计任务
            - 人工复核
        - label: 生产流片
          detail: 保留证据中没有确认任何由 Ricursive 设计的量产芯片或流片。
          status: evidence-gap
          touchpoints:
            - 验证
            - 签核
            - 制造
        - label: 续约与跨芯片扩张
          detail: 产品旨在跨芯片学习，但重复使用和留存情况尚未公开。
          status: evidence-gap
          touchpoints:
            - 新增项目
            - 续约
            - 产品组合扩张
    approximationNotes: 各阶段是分析性的尽调序列，不是已报道的销售漏斗；顺序不代表转化、时间、客户数量或完成情况。
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU009
      - CU010
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 序数热力图用于排列剩余投资判断风险；标签是分析性判断，不是实测概率或公司发布的风险评分。
    data:
      columns:
        - label: 可能性
          detail: 基于现有证据的相对可能性；“未知”表示指定来源不足以支持概率判断。
        - label: 影响
          detail: 对产品交付、商业化或投资价值的潜在后果。
        - label: 缓释成熟度
          detail: 有公开证据支持的缓释成熟度，不假定公司内部能力。
        - label: 剩余严重性
          detail: 只计入指定证据已确立的缓释措施后的风险敞口。
      rows:
        - label: 估值与验证程度错配
          note: 由融资速度快和公开商业指标缺失驱动。
          values:
            - 高
            - 严重
            - 低
            - 严重
        - label: 全栈技术执行
          note: 历史楼层规划证据并不能证明完整宣称工作流已经跑通。
          values:
            - 中高
            - 严重
            - 早期
            - 高
        - label: 客户转化与集中度
          note: 早期客户未具名，合同集中度不可得。
          values:
            - Unknown
            - 严重
            - 未有证据
            - 高
        - label: 知识产权、隐私、安全与出口管制
          note: 指定证据无法证明其控制记录。
          values:
            - Unknown
            - 严重
            - 未有证据
            - 高
        - label: 在位厂商的竞争反应
          note: 与 Cadence 相关的报道描述了一款已经在客户测试中的智能体产品。
          values:
            - 高
            - 高
            - 早期
            - 高
        - label: 算力、功耗与内存可用性
          note: 行业证据支持该约束，但公司自身的风险敞口尚未公开。
          values:
            - 中
            - 高
            - 未有证据
            - 中高
    approximationNotes: 序数标签综合引用证据和已记录的缺口；它们不是数值概率、事故频率、损失严重程度或公司控制能力的测量。
    claimRefs:
      - CR001
      - CR002
      - CR013
      - CR015
  - id: FV001
    title: 从证据到价格的建议逻辑
    type: flow
    summary: 依次推进的决策链，将可信的技术积累和融资能力，与仍缺失的商业及估值证明分开。
    data:
      nodes:
        - id: technical-antecedent
          label: 技术渊源
          detail: AlphaChip 已有投入生产使用的记录。
        - id: financing-signal
          label: 融资信号
          detail: $300M A 轮融资，据报道估值 $4B。
        - id: product-scope
          label: 产品目标
          detail: 从布局到验证的自动化。
        - id: commercial-proof
          label: 商业证据缺口
          detail: 早期客户未具名；经济性尚未公开。
        - id: competitive-test
          label: 竞争测试
          detail: 在位厂商已经推出并测试智能体 EDA 工具。
        - id: recommendation
          label: 决策
          detail: 继续研究；高风险；估值偏高。
    approximationNotes: 该流程是闸门式顺序，不是概率模型或价值桥接。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
