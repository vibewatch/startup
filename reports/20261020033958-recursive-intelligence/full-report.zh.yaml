  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              相关市场是用于自动化或加速半导体设计的软件及配套计算资源，范围从设计探索、布局规划到验证；不包括晶圆制造产能、半导体设备，以及销售芯片本身的收入。TechCrunch 明确称 Ricursive
              开发的是芯片设计工具而非芯片，Lightspeed 则将产品定位为全栈设计平台。经济替代方案不只有既有 EDA
              软件，还包括内部工程人力和反复进行设计收敛的工作；对于高性能硅片，这些工作可能消耗两到三年和数亿美元。这个边界避免把规模更大的半导体收入池误标为可直接触达的软件支出。
            claimRefs:
              - CM001
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模与采用
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几种观察口径，但不足以建立可信的自上而下 TAM/SAM/SOM 体系。一份低置信度的二手综合估计认为，EDA 市场接近 $20 billion，预计 2031 年达到 $30.67
              billion，同时估计 Synopsys 和 Cadence 合计控制约 74%。一位行业分析师称，约 20 至 40% 的新一代数字 SoC 设计使用 AI
              辅助，但主要局限在选定任务，而非端到端自主设计。Cadence 的另一种情景推演称，只有当招聘较趋势多出 270,000 名工程师时，半导体收入才可能在本十年末达到 $1
              trillion。这些指标分别描述软件支出、采用率、集中度和劳动力稀缺，分母不同，不能相加，也不应转换成 Ricursive 收入。
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方范围包括芯片厂商、超大规模云厂商、电子公司和拥有定制芯片项目的 AI 实验室。经济买方可能是掌管研发和 EDA
              预算的工程、硅片或基础设施负责人；日常用户则是架构、实现、验证和物理设计团队。             
              采用应先从输出可对照成熟签核流程的有界工作流开始，只有在质量、安全和集成证据可重复之后才扩大范围。AlphaChip 为小时级布局规划和跨设计学习提供了可信先例，但 Ricursive
              覆盖从布局到验证的更广泛承诺仍是公司口径。留存证据没有指出 Ricursive 自身的已点名客户、付费部署、流片或芯片后测试结果。
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求来自更长的设计周期、稀缺的工程产能、对面向特定工作负载的硅片的需求，以及强化学习方法能够改善物理设计工作流的证据。约束同样重要：既有厂商已把 AI
              嵌入成熟工具链；一位行业分析师称完全自主的芯片设计仍需多年；出口管制义务可能增加买方筛查、安全、监控、认证和许可摩擦；公司也尚未公开点名早期客户。Ricursive 的 $300 million Series A
              能为团队和计算扩张提供资金，但已募资金不是采用或可用市场的证明。因此，在客户经济性和全流程生产证据出现前，估值应奖励技术期权价值，同时折价处理泛化的半导体 TAM 说法。
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业验证仍是市场判断的门槛问题
            body: 留存证据记录了广泛的目标客户范围和大额融资，但 TechCrunch 报道公司不会透露早期客户。要把品类需求转化为公司的可服务市场，仍需已点名的付费试点、流片、芯片后测试结果、定价以及续约或扩张证据。
            calloutType: risk
            claimRefs:
              - CM002
              - CM007
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止 AI 原生创业公司
        blocks:
          - type: paragraph
            body: >-
              Ricursive 开发的是设计芯片的软件，而不是争夺加速器插槽的芯片厂商。这个边界意味着它要面对多种解决同一买方任务的方案：Synopsys 和 Cadence 的广泛 EDA 套件，AlphaChip
              等专注于 AI 布局的方法，超大规模云厂商自建的项目，以及帮助客户构建定制 ASIC 的共同设计伙伴。Synopsys 和 Cadence 还具备规模优势：CompaniesMarketCap 报道称，截至
              2026 年 10 月 19 日，两者市值分别为 $87.11 billion 和 $89.87 billion。Ricursive 的报道融资可以支持研究和计算，但不能单独证明工具通过认证、设计赢单或生产份额。
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP013
              - CP014
