              - CO009
      - number: '1.4'
        title: 里程碑与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Ricursive 在成立数月内就完成了数十亿美元级融资里程碑，但公开里程碑记录主要由创始人经历和募资构成，而不是公司层面的产品证明。TechCrunch 在 2026 年 2
              月报道，创始人不愿透露早期客户；CIOL 则认为，该案例主要建立在创始人信誉上，而非公开基准或产品之上。这并不说明没有客户工作，只说明指定证据无法独立验证客户工作。时间线因此将创始人在公司成立前的
              AlphaChip 记录，与 Ricursive 的种子轮、Series
              A、招聘计划及后续产品描述分开。管理层数据室应补充带日期的试点、流片、签核结果、芯片后测试测量、合作关系、监管事件和不利事件，之后才能把融资时间线视为运营进展的证据。
