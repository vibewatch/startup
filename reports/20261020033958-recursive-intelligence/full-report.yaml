      - number: '5.4'
        title: Differentiation, competitive bar, and controls
        blocks:
          - type: paragraph
            body: >-
              Ricursive's strongest differentiator is the founders' demonstrated AlphaChip pedigree: Google says the
              predecessor generated layouts used in multiple TPU generations and was extended by MediaTek. That proof
              validates AI-assisted floorplanning as a category, not the present platform's full-stack performance. The
              competitive bar has also moved. A Forbes contributor reports that incumbent EDA systems already apply AI
              across synthesis, place-and-route, physical design, coding, test planning, regression, and debugging,
              while cautioning that autonomous chip design remains years away. Ricursive therefore must prove
              cross-stage orchestration and learning advantages under fair baselines, rather than compare a broad
              roadmap with one narrow incumbent module. Trust controls are also material: advanced computing
              transactions can trigger end-user and parent-company export-license diligence, yet the assigned evidence
              contains no Ricursive trust center, security architecture, privacy terms, quality certifications, incident
              history, or model/data-governance documentation.
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category proof exists
            body: >-
              AlphaChip gives the founding team unusually strong historical proof that learning-based floorplanning can
              reach real silicon, but that proof should not be extrapolated to every current Ricursive module.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
          - type: callout
            title: Full-stack evidence has not caught up with full-stack scope
            body: >-
              No assigned source provides a named production customer, tape-out, post-silicon benchmark, integration
              matrix, reliability record, or public security and quality-control package for Ricursive.
            calloutType: risk
            claimRefs:
              - CE003
              - CE005
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The addressable customer is clear; the actual buyer base is not
        blocks:
          - type: paragraph
            body: >-
              Ricursive is aimed at semiconductor companies and other electronics businesses that need custom chips,
              with chip-design and verification teams as likely daily users and enterprise engineering or R&D
              organizations as the economic buyers. TechCrunch reported that the founders had heard from major
              chipmakers and could choose their first development partners, which is evidence of inbound interest rather
              than signed, production-scale demand. The retained sources do not identify payer titles, contract values,
              procurement paths, or a named Ricursive account, so segment attractiveness cannot yet be translated into
              customer economics.
            claimRefs:
              - CU001
              - CU003
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU010
              - CU014
      - number: '6.2'
        title: Precursor adoption is credible, but company-level proof remains private
        blocks:
          - type: paragraph
            body: >-
              The strongest named deployment evidence belongs to AlphaChip, the founders' earlier Google work. Google
              DeepMind says AlphaChip layouts were used in three generations of Google TPUs and that MediaTek extended
              the method for advanced chips. Those examples establish that the underlying research approach can enter
              consequential semiconductor workflows, but they do not establish that either organization buys Ricursive's
              product. TechCrunch explicitly said the startup would not name early customers. A category comparator
              reinforces the evidentiary problem: Cognichip also reported collaborations without naming customers or
              showing a chip designed by its system.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Expansion logic exists at the product level, not yet in customer metrics
        blocks:
          - type: paragraph
            body: >-
              Ricursive's stated expansion mechanism is that learning across different chips should improve performance
              on subsequent designs, which could create a multi-project adoption loop if customers entrust additional
              programs to the platform. No retained source, however, reports renewal, gross or net retention, repeat
              tape-outs, active users, locations, utilization, contract duration, customer count, or customer revenue
              mix. Public descriptions of planned proof-of-concept work and early enterprise engagement remain
              forward-looking. Investors therefore cannot distinguish a concentrated design partner model from a
              diversified software-like customer base.
            claimRefs:
              - CU010
              - CU011
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU009
              - CU010
              - CU016
      - number: '6.4'
        title: Customer conversion will depend on controlled proof, not autonomous-design rhetoric
        blocks:
          - type: paragraph
            body: >-
              Semiconductor Engineering's industry panel provides the most useful adverse context: experts expected
              near-term automation in repetitive workflow, debugging, verification, and physical-design tasks, while
              cautioning that complete automation still needs human control and that the industry is not at a
              push-button-chip stage. That raises the proof burden for Ricursive: customers will likely require scoped
              evaluations, verification, security around proprietary design data, and production signoff before
              expanding. Cadence has publicly described testing its agentic product with key customers, while equivalent
              named evaluation evidence is absent for Ricursive.
            claimRefs:
              - CU008
              - CU009
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding and investor participation are not customer validation
            body: >-
              NVIDIA is named as an investor in several funding accounts, but none of the retained sources identifies it
              as a Ricursive customer. Treating the financing relationship as adoption would overstate commercial proof.
            calloutType: risk
            claimRefs:
              - CU012
          - type: callout
            title: Make customer evidence a gating diligence workstream
            body: >-
              Request a contract-level customer schedule, reference calls, pilot-to-production conversion, tape-out
              evidence, renewal data, and revenue concentration before assigning value to a repeatable customer
              franchise.
            calloutType: recommendation
            claimRefs:
              - CU002
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is milestone compression. Independent reports place the Series A at $300 million
              and the valuation at $4 billion shortly after a $35 million seed round at a $750 million valuation. That
              capital base can fund execution, but the step-up also raises the amount of technical and commercial proof
              needed before the next financing or liquidity event. The risk is not that funding equals burn or that
              valuation proves fragility; neither conclusion is supported. Rather, the valuation makes missing customer,
              revenue, tape-out, and governance evidence more consequential to an investor. A thesis break should occur
              if management cannot produce independently reviewable design wins, signed commercial terms, verified
              tape-out outcomes, and a board-approved operating plan tied to cash runway. The heatmap therefore ranks
              financing-to-proof mismatch above sector supply constraints, which are material but less company-specific.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and control risks remain diligence-led
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence documents the founders' prior AlphaChip work and its use within Google and by
              MediaTek, but it does not establish Recursive's ownership chain for relevant intellectual property,
              freedom to operate, export-control classification, privacy program, security certifications, or
              contractual treatment of confidential chip-design data. This is an evidence gap, not evidence of
              noncompliance or a dispute. Because prospective customers may provide sensitive designs and process
              information, the absence of public control evidence is investment-material even before any incident is
              known. Diligence should require the legal entity and cap table, founder invention-assignment records,
              former-employer separation analysis, patent and license schedules, data-flow maps, model-training
              provenance, standard customer terms, DPA and security exhibits, export-control memorandum, incident
              register, and insurance coverage. Failure to provide those materials before access to customer designs is
              a kill criterion.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR016
      - number: '7.3'
        title: Full-stack delivery, verification, talent, and infrastructure
        blocks:
          - type: paragraph
            body: >-
              Public technical proof is strongest for AlphaChip floorplanning and weakest for the broader product
              promise. Google describes production use of AlphaChip layouts, while reporting on Recursive describes an
              ambition spanning placement through design verification. A disclosed Cadence-aligned commentary argues
              that fully autonomous chip design remains years away and describes an incumbent already testing an agentic
              workflow with customers. This does not disprove Recursive's approach, but it raises the verification
              burden: investors need reproducible power, performance, area, timing, rule-check, tape-out, and
              post-silicon results against human teams and incumbent tools. Talent and infrastructure compound that
              burden. Reporting says proceeds will expand research, engineering, and compute, while industry sources
              flag engineering scarcity, rising data-center power needs, and memory constraints. Monitor tape-out pass
              rate, schedule variance, compute cost per design, critical hiring, toolchain integration, and customer
              acceptance defects.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.4'
        title: Partner and customer dependencies define the near-term kill criteria
        blocks:
          - type: paragraph
            body: >-
              Recursive sits inside a concentrated ecosystem of strategic investors, compute vendors, EDA incumbents,
              foundries, and large chip buyers. TechCrunch reports that Nvidia is an investor while major chipmakers are
              target customers, creating strategic access but also potential information-boundary, neutrality, and
              concentration questions. The same report says the founders would not name early customers; that is not
              proof that customers are absent, but it prevents public assessment of production status, renewal, or
              concentration. Financing reports also say capital will expand compute infrastructure, making supplier
              terms and utilization important operating variables. Require management to disclose counterparties by
              role, percentage of committed revenue and compute spend, related-party safeguards, customer data
              segregation, foundry and signoff dependencies, and fallback capacity. Kill criteria include a failed
              independent tape-out, loss of a critical infrastructure supplier without redundancy, one customer
              dominating contracted revenue without termination protection, or refusal to substantiate the control and
              commercial evidence requested here.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Stop underwriting if management cannot substantiate IP ownership and data controls, cannot produce an
              independent successful tape-out with benchmarked results, or cannot reconcile customer commitments and
              operating milestones with the capital plan supporting the $4 billion reported valuation.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing signal is unusually strong: multiple independent reports describe a $300 million Series A
              and a $4 billion valuation only months after launch, following a $35 million seed round at a reported $750
              million valuation. That sequence proves investor demand and gives the company substantial funding raised,
              but it does not establish cash available, revenue quality, product-market fit, or an investable return
              profile. The retained sources do not disclose revenue, ARR, gross margin, burn, runway, ownership,
              liquidation preferences, or secondary pricing. Entry discipline should therefore be milestone-based rather
              than anchored to the latest headline mark. Recommendation: research-more; confidence: medium; risk: high;
              valuation stance: stretched.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: Thesis, anti-thesis, and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a credible technical antecedent. Google DeepMind says AlphaChip produced layouts used
              across TPU generations, and TechCrunch reports that the founders intend to extend the approach from
              placement through verification and learning across chips. Demand conditions are favorable because
              engineering capacity is constrained. The anti-thesis is equally material: the current company's customer
              names remain undisclosed, while Cadence has already launched and tested an agentic design-and-verification
              product with customers. A Forbes contributor also judges fully autonomous chip design to remain years
              away. Founder pedigree lowers technical concept risk, but it cannot substitute for Ricursive-specific
              production benchmarks, repeatable deployments, or commercial economics.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV009
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public evidence cannot support a conventional revenue-multiple or discounted-cash-flow valuation because
              the required operating inputs are undisclosed. The latest $4 billion financing mark is therefore a
              transaction reference, not an independently derived fair-value conclusion. XCENA offers a directional
              private-market comparison: it raised $135 million at a $570 million valuation while its chip remained a
              prototype and revenue was expected in 2027. The businesses and capital needs are not directly comparable,
              so the gap should not be converted into a multiple. Instead, bull, base, and bear cases should be
              conditioned on named production wins, independently measured design outcomes, recurring economics,
              competitive displacement, and financing terms. Percentage probabilities and target returns remain
              unassignable from public evidence.
            claimRefs:
              - CV002
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not demonstrated by the retained evidence. A strategic outcome may be plausible because
              major chipmakers are described as target customers and Nvidia is an investor, but no source provides a
              signed-customer roster, recurring revenue base, audited economics, acquisition precedent, or public-market
              pathway for Ricursive. Before underwriting a hold period or exit value, diligence should obtain the cap
              table and preference stack, monthly cash use, customer contracts, design milestones, independent
              power-performance-area results, and the integration plan for foundry and incumbent EDA flows. Thesis-break
              triggers are failed production benchmarks, no named deployment after the next material product milestone,
              materially faster cash use than plan, or financing terms that subordinate new capital.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating issue
            body: >-
              Technical pedigree and capital access justify diligence, not a price-insensitive investment. A positive
              call requires Ricursive-specific production evidence, recurring economics, and financing terms that can
              support the target return.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV016
