  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Ordinal heatmap prioritizing residual underwriting exposure; labels are analytical judgments, not measured
      probabilities or company-issued risk scores.
    data:
      columns:
        - label: Likelihood
          detail: >-
            Relative likelihood based on the available evidence; Unknown means the assigned sources do not support a
            probability.
        - label: Impact
          detail: Potential consequence to product delivery, commercialization, or investment value.
        - label: Mitigation maturity
          detail: Publicly evidenced mitigation maturity, not assumed internal capability.
        - label: Residual severity
          detail: Exposure after crediting only mitigations established in the assigned evidence.
      rows:
        - label: Valuation-to-proof mismatch
          note: Driven by financing pace and missing public commercial metrics.
          values:
            - High
            - Critical
            - Low
            - Critical
        - label: Full-stack technical execution
          note: Historical floorplanning proof does not establish the complete announced workflow.
          values:
            - Medium-high
            - Critical
            - Early
            - High
        - label: Customer conversion and concentration
          note: Early customers are unnamed and contract concentration is unavailable.
          values:
            - Unknown
            - Critical
            - Not evidenced
            - High
        - label: IP, privacy, security, and export controls
          note: The assigned evidence does not establish the control record.
          values:
            - Unknown
            - Critical
            - Not evidenced
            - High
        - label: Incumbent competitive response
          note: Cadence-aligned reporting describes an agentic product already in customer testing.
          values:
            - High
            - High
            - Early
            - High
        - label: Compute, power, and memory availability
          note: Sector evidence supports the constraint, but company-specific exposure is undisclosed.
          values:
            - Medium
            - High
            - Not evidenced
            - Medium-high
    approximationNotes: >-
      Ordinal labels synthesize cited evidence and documented gaps; they are not numeric probability,
