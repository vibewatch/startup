      - number: '4.2'
        title: Early partner interest is not yet a sales-efficiency record
        blocks:
          - type: paragraph
            body: >-
              The target account universe is broad, but the available traction signal is qualitative. TechCrunch reports
              that the founders would not name early customers, while saying they had heard from major chipmakers and
              could choose among initial development partners. That may shorten design-partner sourcing, but it does not
              establish paid deployments, customer count, annual recurring revenue, average contract value, sales-cycle
              length, renewal behavior, channel economics, concentration, or customer acquisition payback. No public
              source in the assigned evidence pool supplies a customer contract, price sheet, procurement record, or
              named commercial deployment for the startup. Underwriting should therefore treat partner interest as a
              pipeline proxy only and request cohort-level conversion and collections evidence.
            claimRefs:
              - CI002
              - CI007
              - CI012
              - CI016
      - number: '4.3'
        title: Financing funds technical capacity, not demonstrated runway
        blocks:
          - type: paragraph
            body: >-
              Multiple reports place the January 2026 Series A at $300 million and the post-money valuation at $4
              billion, following a reported $35 million seed, for $335 million of cumulative funding. Reported uses
              include expanding research and engineering and scaling model-training infrastructure, both consistent with
              a compute- and talent-intensive cost base. Industry evidence also shows that advanced three-dimensional
              chip design requires continuous electrical, thermal, mechanical, and manufacturing analysis, making
              integration and verification costs economically material even if AI compresses parts of the workflow.
              Funding raised is not cash on hand: the evidence does not disclose cash balance, monthly burn, cloud or
              accelerator commitments, working capital, capex, debt, project-finance obligations, or the timing and
              conditions of a next round. Runway cannot be calculated without those inputs.
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Technical proof and market investment do not close the underwriting case
        blocks:
          - type: paragraph
            body: >-
              AlphaChip provides credible technical lineage: Google DeepMind says the method produced layouts used
              across multiple TPU generations and could generate comparable or better layouts in hours rather than weeks
              or months. SEMI's forecast of $110 billion of fab-equipment spending in 2025 and $130 billion in 2026
              indicates a capital-rich semiconductor backdrop, but neither datapoint proves demand, revenue, or margin
              for Ricursive. Competitive pressure is already visible because Synopsys and Cadence offer AI-assisted
              design features, while other AI labs are applying models to engineering tasks. The public financial case
              is therefore asymmetric: substantial financing reduces immediate fundraising pressure, yet the $4 billion
              valuation is reported without operating-performance disclosure. Investment underwriting should remain
              conditional on bank-verified cash, customer-level bookings and collections, gross-margin bridges, compute
              commitments, and a board-approved operating plan.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI014
              - CI016
