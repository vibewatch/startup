        - >-
          Named production deployments; independent benchmark leadership; repeatable recurring economics; manageable
          dilution.
        - >-
          A premium to the $4B reference is supportable only after a private model demonstrates the required target
          return.
        - >-
          Rises with paid expansion, successful tape-outs, and independently reproduced results; no percentage is
          supportable publicly.
        - Benchmarks fail to translate into production use.
      - - Base
        - Pilots advance, but customer concentration, unit economics, and full-stack scope remain only partly proven.
        - >-
          Treat $4B as a financing reference and negotiate below or with milestone-linked protection until economics are
          verified.
        - Most consistent with strong capital access but incomplete public commercial evidence.
        - No named deployment or recurring-economics disclosure after the next material milestone.
      - - Bear
        - >-
          Incumbents narrow the capability gap; commercialization slips; compute and hiring consume capital faster than
          planned.
        - >-
          Value below the latest mark and underwrite down-round or preference-overhang risk rather than a public-market
          exit.
        - Rises if Cadence-like products win workflows while Ricursive evidence remains private.
        - Missed design milestones, adverse financing terms, or runway below the diligence case.
    notes: >-
