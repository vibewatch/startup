  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is software and associated compute that automate or accelerate semiconductor design,
              from design exploration and floorplanning through verification; it excludes fabrication capacity,
              semiconductor equipment, and revenue from selling chips themselves. TechCrunch explicitly describes
              Ricursive as building chip-design tools rather than chips, while Lightspeed frames the product as a
              full-stack design platform. The economic substitute is not only incumbent EDA software but also the
              internal engineering labor and repeated design-closure work that can consume two to three years and
              hundreds of millions of dollars for high-performance silicon. This boundary prevents the much larger
              semiconductor revenue pool from being mislabeled as directly addressable software spend.
            claimRefs:
              - CM001
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing and adoption
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several lenses, not a defensible top-down TAM/SAM/SOM stack. A low-confidence
              secondary synthesis places the EDA market near $20 billion and projects $30.67 billion by 2031, while also
              estimating that Synopsys and Cadence control about 74 percent. An industry analyst reports AI assistance
              on roughly 20 to 40 percent of new leading-edge digital SoC designs, but chiefly in selected tasks rather
              than autonomous end-to-end design. A separate Cadence scenario says semiconductor revenue could reach $1
              trillion by decade-end only if hiring exceeds trend by 270,000 engineers. These metrics describe software
              spend, adoption, concentration, and labor scarcity on different denominators; they are not additive and
              should not be converted into Ricursive revenue.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer universe spans chipmakers, hyperscalers, electronics companies, and AI labs with custom-silicon
              programs. Economic buyers are likely engineering, silicon, or infrastructure leaders controlling R&D and
              EDA budgets; daily users are architecture, implementation, verification, and physical-design teams.
              Adoption should begin with bounded workflows where outputs can be checked against established signoff
              processes, then broaden only after repeatable quality, security, and integration evidence. AlphaChip
              provides credible precedent for hours-scale floorplanning and learning across designs, but Ricursive's
              broader promise to span placement through verification remains a company claim. The retained evidence
              identifies no named customer, paid deployment, tape-out, or post-silicon result for Ricursive itself.
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by longer design cycles, scarce engineering capacity, the desire for workload-specific
              silicon, and evidence that reinforcement-learning methods can improve physical-design workflows.
              Constraints are equally material: incumbents already embed AI in established toolchains; an industry
              analyst says fully autonomous chip design remains years away; export-control obligations can add buyer
              screening, security, monitoring, certification, and licensing friction; and the company has not publicly
              named early customers. Ricursive's $300 million Series A finances team and compute expansion, but capital
              raised is not proof of adoption or available market. Valuation should therefore reward technical option
              value while discounting generic semiconductor TAM claims until customer economics and full-flow production
              evidence emerge.
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof remains the gating market question
            body: >-
              The retained evidence documents a broad target-customer universe and substantial financing, but TechCrunch
              reports that the company will not name its early customers. Named paid pilots, tape-outs, post-silicon
              results, pricing, and renewal or expansion evidence are still required to convert category demand into a
              company-specific serviceable market.
            calloutType: risk
            claimRefs:
              - CM002
              - CM007
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set extends beyond AI-native startups
        blocks:
          - type: paragraph
            body: >-
              Ricursive is building software that designs chips rather than a chip vendor competing for accelerator
              sockets. That boundary puts the company against several ways of solving the same buyer job: broad EDA
              suites from Synopsys and Cadence, focused AI placement methods such as AlphaChip, internally staffed
              hyperscaler programs, and co-design partners that help buyers build custom ASICs. Synopsys and Cadence
              also have scale advantages: CompaniesMarketCap reported market capitalizations of $87.11 billion and
              $89.87 billion, respectively, on October 19, 2026. Ricursive's reported funding can support research and
              compute, but it does not by itself establish tool qualification, design wins, or production share.
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP013
              - CP014
