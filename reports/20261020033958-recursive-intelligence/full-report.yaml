      - number: '5.2'
        title: Architecture thesis and inherited technical proof
        blocks:
          - type: paragraph
            body: >-
              The most concrete mechanism in the public record is the founders' AlphaChip predecessor. Google describes
              an edge-based graph neural network that represents relationships among connected components, places
              components sequentially, and learns from a reward based on final layout quality. Ricursive's founders now
              say their platform will learn across different chips so that each completed design improves later work.
              That is an important extension in product scope, but no source in the assigned pool discloses whether
              Ricursive reuses AlphaChip code, model weights, graph representations, training data, or validation
              infrastructure. The architecture map therefore separates historically demonstrated mechanisms from current
              company-described layers and from diligence-only dependencies. This distinction matters because transfer
              across customers and designs creates unresolved questions about data rights, isolation, reproducibility,
              and signoff accountability.
            claimRefs:
