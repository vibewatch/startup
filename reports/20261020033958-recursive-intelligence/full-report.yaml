chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business boundary
        blocks:
          - type: paragraph
            body: >-
              Independent reporting characterizes Ricursive as a frontier AI lab building chip-design tooling intended
              to learn across chips. Independent reporting also draws an important boundary: the company is developing
              AI tools that design chips rather than manufacturing or selling chips itself. The intended platform spans
              component placement through design verification, and its commercial target is broad enough to include any
              electronics company that needs custom chips. Crunchbase identifies the company with Palo Alto, California,
              while the official site does not provide a legal entity name or complete operating-location list. The
              business is therefore best treated as an early-stage, private EDA and design-automation platform, not as a
              semiconductor vendor. Revenue, ARR, customer count, headcount, and additional locations remain undisclosed
              in the assigned public evidence.
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO013
              - CO016
      - number: '1.2'
        title: Leadership and execution dependence
        blocks:
          - type: paragraph
            body: >-
              Co-founders Anna Goldie and Azalia Mirhoseini serve as chief executive and chief technology officer,
              respectively. Their central qualification is unusually direct: they co-created AlphaChip at Google, and
              Google DeepMind reported in September 2024 that the method had generated layouts used in three recent TPU
              generations. The official company site also attributes multiple chip-design papers and experience across
              major AI and semiconductor organizations to the wider team. That pedigree is the strongest available
              execution signal, but it also creates concentration risk. Public sources in the assigned pool do not
              disclose a broader executive bench, board, independent directors, or succession arrangements. Diligence
              should distinguish the founders' demonstrated prior research impact from Ricursive's still-unproven
              ability to institutionalize that capability in a commercial organization.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
              - CO015
      - number: '1.3'
        title: Financing and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The financing sequence is unusually compressed. Reporting places a $35 million Sequoia-led seed round in
              December 2025 at a $750 million valuation, followed on January 26, 2026 by a $300 million Lightspeed-led
              Series A at a $4 billion valuation. The resulting $335 million total raised is corroborated by the company
              and multiple independent outlets. The Series A syndicate includes financial investors and strategic
              semiconductor exposure through NVentures, but participation alone does not establish a customer contract,
              design win, board seat, or commercial validation. Public reporting says the proceeds are intended for
              research and engineering hiring and expanded computing infrastructure. Ownership percentages, voting
              rights, liquidation preferences, board representation, debt, secondaries, and cash remaining are not
              disclosed, so the capital structure cannot yet be assessed beyond headline rounds.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: Milestones and proof gap
        blocks:
          - type: paragraph
            body: >-
              Ricursive reached a multibillion-dollar financing milestone within months of launch, but the public
              milestone record is dominated by founder history and fundraising rather than company-level product proof.
              TechCrunch reported in February 2026 that the founders would not name early customers, while CIOL argued
              that the case rested mainly on founder credibility rather than public benchmarks or products. This does
              not show an absence of customer work; it shows that the assigned evidence cannot independently verify it.
              The timeline therefore separates the founders' pre-company AlphaChip record from Ricursive's seed, Series
              A, hiring plan, and later product descriptions. A management data room should add dated pilots, tape-outs,
              signoff results, post-silicon measurements, partnerships, regulatory events, and adverse incidents before
              the financing chronology is treated as evidence of operating progress.
