  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and user workflow
        blocks:
          - type: paragraph
            body: >-
              Ricursive is building design software rather than manufacturing chips: TechCrunch reports that its
              intended users are chipmakers and other electronics companies seeking custom or conventional chips. The
              public proposition is broader than point floorplanning. The founders describe a platform that uses AI,
              including large language models, from component placement through design verification, while other
              coverage characterizes the ambition as a full-stack feedback loop between AI models and the silicon that
              runs them. This defines a plausible customer workflow from design intent to verified layout, but it does
              not establish a production SKU, supported process nodes, file formats, foundry signoff coverage, or
              realized cycle-time improvement. Investors should therefore treat the module map below as a boundary of
              the disclosed product thesis, not as evidence that every module is currently shipping.
            claimRefs:
