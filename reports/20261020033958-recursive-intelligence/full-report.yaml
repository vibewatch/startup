      - number: '3.2'
        title: Broad ambition is ahead of reproducible proof
        blocks:
          - type: paragraph
            body: >-
              The product ambition spans component placement through design verification and is intended to learn across
              successive chips, which is broader than a point floorplanning tool. The strongest technical precedent is
              AlphaChip's reported use in three generations of Google's TPUs. That precedent is relevant but contested:
              independent researchers told New Scientist that public, current benchmarks were needed, and a replication
              effort did not consistently beat a human expert or conventional algorithms. The dispute matters because
              commercial buyers compare power, performance, area, runtime, compute cost, signoff integration, and
              reproducibility together. No retained evidence demonstrates Ricursive's own performance on that complete
              scorecard.
