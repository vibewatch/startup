              - CP008
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: Incumbent distribution and internal-build economics shape adoption
        blocks:
          - type: paragraph
            body: >-
              Incumbents can insert AI into established EDA toolchains, procurement contracts, verification flows, and
              foundry-qualified processes, while Ricursive must prove compatibility and trust before replacing or
              expanding those workflows. Hyperscalers represent another route: Microsoft's Maia 200 account describes
              co-development across silicon, networking, software, cooling, and datacenter operations, illustrating the
              depth of integration available to the largest buyers. A separate analyst blog estimates that internal
              custom silicon requires highly uniform workloads, more than $500 million of annual inference spend, and a
              multiyear commitment. These estimates are directional rather than independently benchmarked thresholds,
              but they show why many buyers may choose an incumbent or co-design partner instead of a greenfield
              internal team.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: The likely moat is learning data and workflow integration, not funding alone
        blocks:
          - type: paragraph
            body: >-
              Ricursive's plausible durable advantage is a cross-chip learning loop that improves with completed designs
              and reaches more of the workflow than a narrow placement optimizer. Durability will depend on access to
              proprietary design data, verified outcomes, foundry and signoff integrations, and the cost of moving
              qualified projects away from incumbent tooling. Public evidence does not yet show named customers,
              realized pricing, tape-outs, or contractual lock-in; TechCrunch specifically reported that the founders
              would not name early customers. The adverse AlphaChip benchmark debate also prevents founder pedigree from
              serving as a substitute for reproducible Ricursive results. The underwriting stance should therefore
              remain "potentially differentiated, not yet demonstrated as durable."
            claimRefs:
              - CP004
              - CP005
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Founder pedigree is not a substitute for a Ricursive benchmark
            body: >-
              AlphaChip has reported production use, but independent researchers dispute broad superiority claims and
              ask for reproducible comparisons. Underwriting should require a current Ricursive benchmark that reports
              workload, process node, baselines, compute budget, power, performance, area, runtime, and signoff outcome.
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP005
