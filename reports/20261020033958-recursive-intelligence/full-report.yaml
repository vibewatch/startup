      - number: '5.3'
        title: Maturity, deployment, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              Public maturity evidence remains pre-production in character. The founders declined to name early
              customers while describing inbound interest and a choice of development partners. Tech Funding News
              reports that the company is expanding research, engineering, compute, and distributed infrastructure to
              iterate across the chip-design stack; that is an input to development, not proof of tape-out, post-silicon
              performance, uptime, or repeatable integration. A low-reputation secondary article supplies aggressive
              cycle-time and power-reduction claims, but the assigned higher-quality sources do not corroborate those
              Ricursive-specific quantities. Meanwhile, sector funding remains unusually abundant, which raises the
              delivery benchmark rather than lowering it. The key diligence milestone is a named, production design
              carried from customer requirements through foundry-qualified signoff, with reproducible baselines and
              disclosed human intervention.
            claimRefs:
