callouts:
  - calloutType: recommendation
    title: Price is the gating issue
    body: >-
      Technical pedigree and capital access justify diligence, not a price-insensitive
      investment. A positive call requires Ricursive-specific production evidence,
      recurring economics, and financing terms that can support the target return.
    claimRefs: [CV006, CV010, CV016]
