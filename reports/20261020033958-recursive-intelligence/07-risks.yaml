company:
  name: "Recursive Intelligence"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    The central underwriting risk is an execution gap: third-party reporting places a $300 million
    Series A at a $4 billion valuation behind a newly launched company whose public customer,
    revenue, governance, legal, and control evidence remains limited. Historical AlphaChip results
    support technical credibility, but they do not by themselves validate the announced full-stack
    product, commercial durability, or control environment.
sections:
  - id: "ranked-risk-posture"
    title: "Ranked risk posture and investment implication"
    body: >-
      The highest-priority risk is milestone compression. Independent reports place the Series A at
      $300 million and the valuation at $4 billion shortly after a $35 million seed round at a
      $750 million valuation. That capital base can fund execution, but the step-up also raises the
      amount of technical and commercial proof needed before the next financing or liquidity event.
      The risk is not that funding equals burn or that valuation proves fragility; neither conclusion
      is supported. Rather, the valuation makes missing customer, revenue, tape-out, and governance
      evidence more consequential to an investor. A thesis break should occur if management cannot
      produce independently reviewable design wins, signed commercial terms, verified tape-out
      outcomes, and a board-approved operating plan tied to cash runway. The heatmap therefore ranks
      financing-to-proof mismatch above sector supply constraints, which are material but less
      company-specific.
    claimRefs: [CR001, CR002, CR013, CR015]
    figureRefs: [FR001]
  - id: "regulatory-legal-controls"
    title: "Regulatory, legal, and control risks remain diligence-led"
    body: >-
      The assigned evidence documents the founders' prior AlphaChip work and its use within Google
      and by MediaTek, but it does not establish Recursive's ownership chain for relevant
      intellectual property, freedom to operate, export-control classification, privacy program,
      security certifications, or contractual treatment of confidential chip-design data. This is
      an evidence gap, not evidence of noncompliance or a dispute. Because prospective customers
      may provide sensitive designs and process information, the absence of public control evidence
      is investment-material even before any incident is known. Diligence should require the legal
      entity and cap table, founder invention-assignment records, former-employer separation
      analysis, patent and license schedules, data-flow maps, model-training provenance, standard
      customer terms, DPA and security exhibits, export-control memorandum, incident register, and
      insurance coverage. Failure to provide those materials before access to customer designs is a
      kill criterion.
    claimRefs: [CR004, CR006, CR007, CR008, CR016]
    tableRefs: [TR001]
  - id: "operational-technical-quality"
    title: "Full-stack delivery, verification, talent, and infrastructure"
    body: >-
      Public technical proof is strongest for AlphaChip floorplanning and weakest for the broader
      product promise. Google describes production use of AlphaChip layouts, while reporting on
      Recursive describes an ambition spanning placement through design verification. A disclosed
      Cadence-aligned commentary argues that fully autonomous chip design remains years away and
      describes an incumbent already testing an agentic workflow with customers. This does not
      disprove Recursive's approach, but it raises the verification burden: investors need
      reproducible power, performance, area, timing, rule-check, tape-out, and post-silicon results
      against human teams and incumbent tools. Talent and infrastructure compound that burden.
      Reporting says proceeds will expand research, engineering, and compute, while industry sources
      flag engineering scarcity, rising data-center power needs, and memory constraints. Monitor
      tape-out pass rate, schedule variance, compute cost per design, critical hiring, toolchain
      integration, and customer acceptance defects.
    claimRefs: [CR005, CR006, CR008, CR009, CR010, CR011, CR012, CR014, CR016]
    tableRefs: [TR002]
  - id: "partners-customers-kill-criteria"
    title: "Partner and customer dependencies define the near-term kill criteria"
    body: >-
      Recursive sits inside a concentrated ecosystem of strategic investors, compute vendors, EDA
      incumbents, foundries, and large chip buyers. TechCrunch reports that Nvidia is an investor
      while major chipmakers are target customers, creating strategic access but also potential
      information-boundary, neutrality, and concentration questions. The same report says the
      founders would not name early customers; that is not proof that customers are absent, but it
      prevents public assessment of production status, renewal, or concentration. Financing reports
      also say capital will expand compute infrastructure, making supplier terms and utilization
      important operating variables. Require management to disclose counterparties by role,
      percentage of committed revenue and compute spend, related-party safeguards, customer data
      segregation, foundry and signoff dependencies, and fallback capacity. Kill criteria include a
      failed independent tape-out, loss of a critical infrastructure supplier without redundancy,
      one customer dominating contracted revenue without termination protection, or refusal to
      substantiate the control and commercial evidence requested here.
    claimRefs: [CR003, CR004, CR005, CR014]
    tableRefs: [TR003]
