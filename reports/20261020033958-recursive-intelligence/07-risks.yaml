      - ["Early development and commercial partners", "Unnamed chipmakers and electronics companies", "Design partner and prospective buyer", "TechCrunch reports unnamed early customers; production status and concentration are not public", "Pilot fails to convert, a design win is delayed, or one partner dominates roadmap and revenue", "Critical", "Stage-gated contracts, acceptance criteria, termination protection, diversified pipeline, and reference rights", "High until signed contracts and deployment evidence are reviewed"]
