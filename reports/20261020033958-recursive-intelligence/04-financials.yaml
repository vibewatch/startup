      - [Gross margin, "Not disclosed", "High confidence in disclosure gap", "Compute and implementation costs may materially alter software economics", "Provide gross-margin bridge by product and customer, including compute allocation"]
      - [CAC and payback, "Not disclosed", "High confidence in disclosure gap", "Partner interest cannot establish efficient customer acquisition", "Provide fully loaded CAC, sales cycle, win rate, payback, and channel fees"]
      - [Compute cost per design or customer, "Not disclosed", "Medium; infrastructure expansion is reported", "Model training and verification may create usage-sensitive delivery cost", "Provide accelerator commitments, utilization, inference cost, and customer-level compute"]
      - [Cash burn and runway, "Not disclosed", "High confidence in disclosure gap", "Funding raised cannot be converted into runway without cash and burn", "Provide bank statements, monthly net burn, approved budget, and downside runway"]
      - [Debt and other obligations, "Not disclosed", "High confidence in disclosure gap", "Debt, leases, or minimum compute commitments can reduce usable liquidity", "Provide debt schedule, leases, cloud commitments, covenants, and security interests"]
    notes: "Funding amounts are third-party reported; all operating metrics remain unavailable and must not be interpreted as zero."
    claimRefs: [CI005, CI006, CI010, CI012, CI013, CI016]
