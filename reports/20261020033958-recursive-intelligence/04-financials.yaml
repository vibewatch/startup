callouts:
  - calloutType: strength
    title: Large financing base supports an ambitious technical build
    body: >-
      Reported cumulative funding of $335 million and a stated plan to invest in researchers, engineers, and compute
      give the company resources to pursue a technically demanding product.
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Public financial disclosure is below an underwriting threshold
    body: >-
      No assigned source discloses revenue, ARR, pricing, gross margin, burn, cash, runway, debt, or paid customer
      count; financing and valuation cannot substitute for those operating facts.
    claimRefs: [CI012, CI013, CI016]
