company:
  name: Recursive Intelligence
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a well-funded attempt to commercialize AI-assisted chip design, with $335 million
    reported raised and the latest proceeds directed to technical hiring and compute infrastructure. It does not
    disclose revenue, pricing, gross margin, customer count, burn, cash, runway, or debt, so revenue quality and
    capital adequacy remain ununderwritable from public data.
sections:
  - id: revenue-model
    title: Revenue model remains structurally plausible but commercially undisclosed
    body: >-
      Ricursive is described as building AI tools that design chips rather than manufacturing chips, and its stated
      customer universe includes semiconductor companies and other electronics businesses. The reported product
      scope runs from component placement through design verification, which could support a high-value enterprise
      software or development-partnership model. Public evidence does not identify an actual charging unit, contract
      form, list price, realized price, discount policy, revenue-recognition treatment, or services mix, however.
      The economic bridge therefore stops before monetization: technical activity and design output are evidenced,
      but conversion into booked revenue and gross profit is not. The founders' claimed potential for a roughly
      tenfold improvement in performance per total cost of ownership is a customer-value hypothesis, not evidence of
      pricing power, realized savings, or margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI012, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: go-to-market-and-traction
    title: Early partner interest is not yet a sales-efficiency record
    body: >-
      The target account universe is broad, but the available traction signal is qualitative. TechCrunch reports
      that the founders would not name early customers, while saying they had heard from major chipmakers and could
      choose among initial development partners. That may shorten design-partner sourcing, but it does not establish
      paid deployments, customer count, annual recurring revenue, average contract value, sales-cycle length,
      renewal behavior, channel economics, concentration, or customer acquisition payback. No public source in the
      assigned evidence pool supplies a customer contract, price sheet, procurement record, or named commercial
      deployment for the startup. Underwriting should therefore treat partner interest as a pipeline proxy only and
      request cohort-level conversion and collections evidence.
    claimRefs: [CI002, CI007, CI012, CI016]
  - id: cost-structure-and-capital
    title: Financing funds technical capacity, not demonstrated runway
    body: >-
      Multiple reports place the January 2026 Series A at $300 million and the post-money valuation at $4 billion,
      following a reported $35 million seed, for $335 million of cumulative funding. Reported uses include expanding
      research and engineering and scaling model-training infrastructure, both consistent with a compute- and
      talent-intensive cost base. Industry evidence also shows that advanced three-dimensional chip design requires
      continuous electrical, thermal, mechanical, and manufacturing analysis, making integration and verification
      costs economically material even if AI compresses parts of the workflow. Funding raised is not cash on hand:
      the evidence does not disclose cash balance, monthly burn, cloud or accelerator commitments, working capital,
      capex, debt, project-finance obligations, or the timing and conditions of a next round. Runway cannot be
      calculated without those inputs.
    claimRefs: [CI005, CI006, CI010, CI012, CI013]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Technical proof and market investment do not close the underwriting case
    body: >-
      AlphaChip provides credible technical lineage: Google DeepMind says the method produced layouts used across
      multiple TPU generations and could generate comparable or better layouts in hours rather than weeks or months.
      SEMI's forecast of $110 billion of fab-equipment spending in 2025 and $130 billion in 2026 indicates a
      capital-rich semiconductor backdrop, but neither datapoint proves demand, revenue, or margin for Ricursive.
      Competitive pressure is already visible because Synopsys and Cadence offer AI-assisted design features, while
      other AI labs are applying models to engineering tasks. The public financial case is therefore asymmetric:
      substantial financing reduces immediate fundraising pressure, yet the $4 billion valuation is reported without
      operating-performance disclosure. Investment underwriting should remain conditional on bank-verified cash,
      customer-level bookings and collections, gross-margin bridges, compute commitments, and a board-approved
      operating plan.
    claimRefs: [CI008, CI009, CI011, CI014, CI016]
