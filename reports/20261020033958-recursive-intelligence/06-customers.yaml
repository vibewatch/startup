callouts:
  - calloutType: risk
    title: Funding and investor participation are not customer validation
    body: >-
      NVIDIA is named as an investor in several funding accounts, but none of the retained
      sources identifies it as a Ricursive customer. Treating the financing relationship as
      adoption would overstate commercial proof.
    claimRefs: [CU012]
  - calloutType: recommendation
    title: Make customer evidence a gating diligence workstream
    body: >-
      Request a contract-level customer schedule, reference calls, pilot-to-production
      conversion, tape-out evidence, renewal data, and revenue concentration before assigning
      value to a repeatable customer franchise.
    claimRefs: [CU002, CU014, CU015]
