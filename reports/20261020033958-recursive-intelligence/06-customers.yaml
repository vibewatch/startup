company:
  name: Recursive Intelligence
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a broad target market of chipmakers and electronics companies,
    plus undisclosed early development-partner interest, but it does not identify a current
    Ricursive customer, production tape-out, customer count, retention metric, or revenue
    concentration. AlphaChip's use at Google and MediaTek validates the founders' precursor
    technology, not Ricursive's present commercial adoption.
sections:
  - id: buyer-user-payer-map
    title: The addressable customer is clear; the actual buyer base is not
    body: >-
      Ricursive is aimed at semiconductor companies and other electronics businesses that
      need custom chips, with chip-design and verification teams as likely daily users and
      enterprise engineering or R&D organizations as the economic buyers. TechCrunch reported
      that the founders had heard from major chipmakers and could choose their first
      development partners, which is evidence of inbound interest rather than signed,
      production-scale demand. The retained sources do not identify payer titles, contract
      values, procurement paths, or a named Ricursive account, so segment attractiveness
      cannot yet be translated into customer economics.
    claimRefs: [CU001, CU003, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Precursor adoption is credible, but company-level proof remains private
    body: >-
      The strongest named deployment evidence belongs to AlphaChip, the founders' earlier
      Google work. Google DeepMind says AlphaChip layouts were used in three generations of
      Google TPUs and that MediaTek extended the method for advanced chips. Those examples
      establish that the underlying research approach can enter consequential semiconductor
      workflows, but they do not establish that either organization buys Ricursive's product.
      TechCrunch explicitly said the startup would not name early customers. A category
      comparator reinforces the evidentiary problem: Cognichip also reported collaborations
      without naming customers or showing a chip designed by its system.
    claimRefs: [CU002, CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Expansion logic exists at the product level, not yet in customer metrics
    body: >-
      Ricursive's stated expansion mechanism is that learning across different chips should
      improve performance on subsequent designs, which could create a multi-project adoption
      loop if customers entrust additional programs to the platform. No retained source,
      however, reports renewal, gross or net retention, repeat tape-outs, active users,
      locations, utilization, contract duration, customer count, or customer revenue mix.
      Public descriptions of planned proof-of-concept work and early enterprise engagement
      remain forward-looking. Investors therefore cannot distinguish a concentrated design
      partner model from a diversified software-like customer base.
    claimRefs: [CU010, CU011, CU014, CU015, CU016]
    figureRefs: [FU001]
  - id: adoption-friction
    title: Customer conversion will depend on controlled proof, not autonomous-design rhetoric
    body: >-
      Semiconductor Engineering's industry panel provides the most useful adverse context:
      experts expected near-term automation in repetitive workflow, debugging, verification,
      and physical-design tasks, while cautioning that complete automation still needs human
      control and that the industry is not at a push-button-chip stage. That raises the proof
      burden for Ricursive: customers will likely require scoped evaluations, verification,
      security around proprietary design data, and production signoff before expanding.
      Cadence has publicly described testing its agentic product with key customers, while
      equivalent named evaluation evidence is absent for Ricursive.
    claimRefs: [CU008, CU009, CU013]
