company:
  name: "Recursive Intelligence"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    The addressable opportunity is best framed as AI-native semiconductor design
    automation rather than chip manufacturing: retained evidence points to a large,
    concentrated EDA market, a scarce-engineer bottleneck, and early adoption of AI
    assistance, but it does not support a company-specific SAM or SOM.
sections:
  - id: "market-boundary"
    title: "Market boundary and status quo"
    body: >-
      The relevant market is software and associated compute that automate or
      accelerate semiconductor design, from design exploration and floorplanning
      through verification; it excludes fabrication capacity, semiconductor
      equipment, and revenue from selling chips themselves. TechCrunch explicitly
      describes Ricursive as building chip-design tools rather than chips, while
      Lightspeed frames the product as a full-stack design platform. The economic
      substitute is not only incumbent EDA software but also the internal engineering
      labor and repeated design-closure work that can consume two to three years and
      hundreds of millions of dollars for high-performance silicon. This boundary
      prevents the much larger semiconductor revenue pool from being mislabeled as
      directly addressable software spend.
    claimRefs: [CM001, CM003, CM006]
    tableRefs: [TM001]
  - id: "sizing-and-adoption"
    title: "Evidence-constrained sizing and adoption"
    body: >-
      Public evidence supports several lenses, not a defensible top-down
      TAM/SAM/SOM stack. A low-confidence secondary synthesis places the EDA market
      near $20 billion and projects $30.67 billion by 2031, while also estimating
      that Synopsys and Cadence control about 74 percent. An industry analyst reports
      AI assistance on roughly 20 to 40 percent of new leading-edge digital SoC
      designs, but chiefly in selected tasks rather than autonomous end-to-end
      design. A separate Cadence scenario says semiconductor revenue could reach
      $1 trillion by decade-end only if hiring exceeds trend by 270,000 engineers.
      These metrics describe software spend, adoption, concentration, and labor
      scarcity on different denominators; they are not additive and should not be
      converted into Ricursive revenue.
    claimRefs: [CM005, CM008, CM009, CM010, CM011, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption-path"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      The buyer universe spans chipmakers, hyperscalers, electronics companies, and
      AI labs with custom-silicon programs. Economic buyers are likely engineering,
      silicon, or infrastructure leaders controlling R&D and EDA budgets; daily
      users are architecture, implementation, verification, and physical-design
      teams. Adoption should begin with bounded workflows where outputs can be
      checked against established signoff processes, then broaden only after
      repeatable quality, security, and integration evidence. AlphaChip provides
      credible precedent for hours-scale floorplanning and learning across designs,
      but Ricursive's broader promise to span placement through verification remains
      a company claim. The retained evidence identifies no named customer, paid
      deployment, tape-out, or post-silicon result for Ricursive itself.
    claimRefs: [CM002, CM004, CM007, CM013]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Demand is driven by longer design cycles, scarce engineering capacity, the
      desire for workload-specific silicon, and evidence that reinforcement-learning
      methods can improve physical-design workflows. Constraints are equally
      material: incumbents already embed AI in established toolchains; an industry
      analyst says fully autonomous chip design remains years away; export-control
      obligations can add buyer screening, security, monitoring, certification, and
      licensing friction; and the company has not publicly named early customers.
      Ricursive's $300 million Series A finances team and compute expansion, but
      capital raised is not proof of adoption or available market. Valuation should
      therefore reward technical option value while discounting generic semiconductor
      TAM claims until customer economics and full-flow production evidence emerge.
    claimRefs: [CM007, CM008, CM014, CM015, CM016]
