callouts:
  - calloutType: "risk"
    title: "Commercial proof remains the gating market question"
    body: >-
      The retained evidence documents a broad target-customer universe and substantial
      financing, but TechCrunch reports that the company will not name its early
      customers. Named paid pilots, tape-outs, post-silicon results, pricing, and
      renewal or expansion evidence are still required to convert category demand
      into a company-specific serviceable market.
    claimRefs: [CM002, CM007, CM016]
