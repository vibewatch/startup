  evidenceGaps:
    - type: missing-source
      severity: material
      topic: benchmark-dispute
      missingEvidence: >-
        A current, reproducible Ricursive benchmark covering workload, process node,
        baseline tools, compute budget, power, performance, area, runtime, and signoff.
      whyItMatters: >-
        Without a like-for-like benchmark, the breadth and durability of technical
        differentiation cannot be separated from founder pedigree and company claims.
      diligencePath: >-
        Obtain benchmark artifacts and design-partner references, then reproduce at
        least one comparison with an independent EDA expert under matched constraints.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP002]
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: >-
        Ricursive price units, contract minimums, implementation fees, realized
        discounts, renewal terms, and economics for at least three customer cohorts.
      whyItMatters: >-
        Capability comparisons cannot establish procurement competitiveness, gross
        margin potential, or whether adoption requires services-heavy customization.
      diligencePath: >-
        Review current price sheets and anonymized executed contracts, then interview
        procurement owners at named design partners.
      relatedQuestionRefs: [QP006]
      relatedTableRefs: [TP003]
    - type: enumeration-incomplete
      severity: minor
      topic: competitive-landscape
      missingEvidence: >-
        A complete current census of AI-native EDA startups, incumbent modules, foundry
        programs, cloud design services, and co-design partners by buyer segment.
      whyItMatters: >-
        The assigned pool supports major alternative classes but not an exhaustive
        competitor list, so concentration and white-space judgments remain provisional.
      diligencePath: >-
        Build a buyer-led longlist from current procurement records, foundry partner
        directories, conference programs, and named semiconductor design teams.
      relatedQuestionRefs: [QP001]
      relatedTableRefs: [TP001]
