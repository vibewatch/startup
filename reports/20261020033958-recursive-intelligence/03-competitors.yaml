        - label: Google AlphaChip
          x: 2
          y: 5
          note: Focused placement method used in multiple TPU generations
        - label: Microsoft internal build
          x: 4
          y: 5
          note: Integrated silicon-to-datacenter program with announced deployment
        - label: Broadcom-assisted route
          x: 3
          y: 3
          note: Co-design scale is an uncorroborated analyst estimate
    approximationNotes: >-
      Coordinates are analyst-authored ordinal scores derived from the retained source
      set, not measured market shares or performance benchmarks; equal distances do not
      imply equal commercial differences.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP008, CP012, CP014, CP015]
callouts:
  - calloutType: risk
    title: Founder pedigree is not a substitute for a Ricursive benchmark
    body: >-
      AlphaChip has reported production use, but independent researchers dispute broad
      superiority claims and ask for reproducible comparisons. Underwriting should
      require a current Ricursive benchmark that reports workload, process node,
      baselines, compute budget, power, performance, area, runtime, and signoff outcome.
    claimRefs: [CP003, CP004, CP005]
