      - Evidence-backed differentiation
      - Key limitation in retained evidence
    rows:
      - - Ricursive Intelligence
        - AI-native EDA entrant
        - "$335M cumulative funding and $4B post-money valuation reported January 2026"
        - Chipmakers and electronics companies needing custom silicon
        - Cross-chip learning; stated scope from placement through verification
