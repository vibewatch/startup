      max: 5
    yAxis:
      label: Public deployment proof (1 = unverified, 5 = deployed at scale)
      min: 1
      max: 5
    data:
      points:
        - label: Ricursive
          x: 4
          y: 2
          note: Broad stated scope; no named early customers or public benchmark
        - label: Synopsys
          x: 5
          y: 4
          note: Broad incumbent with reported AI feature; assigned proof is incomplete
        - label: Cadence
          x: 5
          y: 4
