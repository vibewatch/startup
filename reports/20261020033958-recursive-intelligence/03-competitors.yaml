      - - Cadence
        - Broad EDA incumbent
        - "$89.87B market cap reported October 19, 2026"
        - Semiconductor design organizations
        - Existing EDA position plus reported Cerebrus reinforcement learning
        - Assigned evidence does not detail current packaging or benchmark results
      - - Google AlphaChip
        - Focused internal AI design method
        - Used in three TPU generations according to Google and independent reporting
        - Google TPU teams; selected external extensions
        - Production lineage and learning across placement tasks
        - Independent researchers dispute superiority without fair public benchmarks
      - - Microsoft internal silicon program
        - Internal build / likely entrant pattern
        - Maia 200 deployed in one US region with another region announced
        - Microsoft's own cloud and AI workloads
        - End-to-end silicon, SDK, networking, and datacenter integration
        - Not a commercial EDA substitute in the assigned evidence
      - - Broadcom-assisted custom ASIC
        - Co-design partner / adjacent substitute
        - Analyst blog estimates 70–80% share of custom ASIC co-design
        - Organizations able to fund custom-silicon programs
        - Access to co-design capability without building every function internally
        - Estimate comes from one analyst blog and has no retained primary corroboration
    notes: >-
      Partial landscape based only on the assigned prefetched sources; market
      capitalizations are point-in-time values, funding is not cash available, and
      unsupported pricing, customer, and performance fields are marked as gaps.
    claimRefs: [CP001, CP003, CP006, CP007, CP012, CP013, CP014, CP015]
  - id: TP002
    title: Capability and evidence matrix
    columns:
      - Buying criterion
      - Ricursive
      - Synopsys / Cadence
      - Internal-build alternative
      - Evidence boundary
    rows:
      - - Workflow scope
        - Placement through verification is the stated ambition
        - Broad EDA incumbency; two named AI features in retained reporting
        - Can span silicon through datacenter operations
        - No like-for-like scope audit is available
      - - Learning across designs
        - Founders say each chip should improve the next design
        - Unknown in assigned sources
        - AlphaChip and hyperscaler programs reuse prior design experience
        - Ricursive mechanism is company-claimed, not independently benchmarked
      - - Production precedent
        - Founder lineage from AlphaChip
        - Commercial tools led one cited replication comparison
        - AlphaChip used in three TPU generations; Maia 200 deployed
        - Precedent is not evidence of a Ricursive production tape-out
      - - Public benchmark quality
        - No Ricursive result in assigned sources
        - Commercial tools performed best in one reported comparison
        - AlphaChip superiority is disputed by independent researchers
        - Current public benchmark and compute-cost comparison remains missing
      - - Verification and signoff
        - Verification is included in stated product scope
        - Specific capability unknown in assigned sources
        - Microsoft describes extensive pre-silicon validation
        - No retained evidence of Ricursive foundry or signoff qualification
      - - Software and deployment stack
        - Details unknown
        - Details unknown in assigned sources
        - Microsoft exposes an SDK, compiler, framework integration, and simulator
        - Stack breadth may create switching cost but is not a neutral benchmark
    notes: >-
      Cells distinguish company claims, reported deployments, and unavailable
      evidence; "unknown" means the assigned source pool did not support a conclusion,
      not that the capability is absent.
    claimRefs: [CP002, CP003, CP004, CP005, CP007, CP008, CP010, CP011, CP012]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Route
      - Price or contract unit
      - Included capability in retained evidence
      - Discount or realization evidence
      - Competitive implication
    rows:
      - - Ricursive
        - Not disclosed in assigned sources
        - Stated placement-through-verification platform
        - No list-to-realized pricing evidence
        - Cannot yet compare procurement cost or expansion economics
      - - Synopsys / Cadence
        - Not disclosed in assigned sources
        - Broad incumbent EDA position plus named AI features
        - No contract or discount evidence
        - Installed workflow may matter more than unsupported list-price comparisons
      - - Hyperscaler internal build
        - Internal program cost; no comparable unit price
        - Chip, software, networking, validation, and operations
        - Microsoft claims 30% better performance per dollar for Maia 200
        - Attractive only where scale and integration justify fixed investment
      - - Broadcom-assisted custom ASIC
        - Not disclosed in assigned sources
        - External co-design route
        - No contract or discount evidence
        - Offers a partner-led alternative to either Ricursive or full internal build
    notes: >-
      This is a gap map rather than a price benchmark. The Microsoft percentage is a
      company claim about its deployed infrastructure, not an EDA software price, and
      the internal-build thresholds come from one analyst blog.
    claimRefs: [CP007, CP008, CP009, CP012, CP014, CP016]
