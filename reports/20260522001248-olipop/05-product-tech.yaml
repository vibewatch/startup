  - id: manufacturing-and-supply-chain
    title: "Manufacturing Operations & Supply Chain"
    body: |
      OLIPOP operates an entirely asset-light manufacturing model: it owns no production facilities and
      relies fully on GMP-certified contract manufacturers (co-packers) for blending, filling, and canning.
      Each co-packer must adhere to good manufacturing practices covering allergen control, microbial
      safety, process consistency, and environmental monitoring. Lot-to-lot testing with industry-standard
      validated methods confirms fiber potency, microbial counts, and absence of pesticides or pathogen
      contamination before product release.

      The shelf-stable 6g line is produced on aseptic or hot-fill lines capable of achieving a hermetic
      seal required for ambient distribution. Shelf life of 9–12 months is achieved through controlled
      water activity and low pH rather than added preservatives. As OLIPOP scales, single-source
      manufacturing is a documented risk: the company has been publicly onboarding a second major co-packer
      in 2026, targeting a capacity increase and risk diversification. Co-packer identities remain
      confidential under NDAs, limiting diligence visibility into vendor concentration, switching costs, and
      the practical timeline for capacity diversification. Ingredient sourcing involves global commodity
      markets for cassava and chicory root, plus more specialized botanical extracts (marshmallow, calendula,
      kudzu, nopal), whose supply can be seasonal or geographically concentrated. The cost structure impact
      of specialty botanical sourcing relative to total CoGS is not publicly disclosed.
    claimRefs:
      - CE017
