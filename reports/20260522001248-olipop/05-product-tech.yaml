  - id: olismart-formulation-architecture
    title: "OliSmart® Formulation Architecture"
    body: |
      OliSmart is OLIPOP's registered trademark for its proprietary blend of prebiotic fibers and botanical
      extracts. The formulation was developed through collaboration with Dr. Stephen Lindemann of Purdue
      University's Whistler Center for Carbohydrate Research, whose lab focuses on how dietary fiber
      polysaccharides modulate the gut microbiome. The scientific premise is that multiple fiber sources
      feed different species of beneficial gut bacteria, supporting broader microbial diversity than any
      single fiber type could achieve alone.

      The refrigerated line's OliSmart uses three prebiotic fibers—cassava root fiber (a source of resistant
      dextrin), chicory root inulin, and Jerusalem artichoke inulin—alongside four botanical extracts:
      marshmallow root, calendula flower, kudzu root, and nopal cactus. The shelf-stable line swaps to acacia
      fiber, guar fiber, and cassava root fiber, retaining all four botanicals. Both blends are sweetened with
      stevia and allulose rather than cane sugar, yielding approximately 35–45 calories per can. Importantly,
      no granted US patent for the OliSmart formulation has been publicly identified as of May 2026; the
      company relies on trademark registration and trade secret protection rather than patent exclusivity.
      This is a meaningful IP-moat limitation: every ingredient in OliSmart is commercially available as a
      commodity food ingredient, meaning a well-resourced competitor can approximate the blend without
      infringing any patent.

      OLIPOP commissioned a real-world clinical pilot study, published as a MedRxiv preprint in April 2025,
      comparing OLIPOP Vintage Cola to a leading traditional cola on postprandial blood glucose in healthy
      adults. Results showed a slower, lower blood glucose rise with OLIPOP in both fasted and fed conditions.
      However, the study was self-funded by OLIPOP, a fact flagged by nutrition-watchdog Food Politics as
      raising industry-bias concerns. The clinical evidence base therefore remains at pilot scale, with no
      independently-funded long-term randomized controlled trials (RCTs) published as of the run date.
