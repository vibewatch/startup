chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    OLIPOP's product portfolio comprises two refrigerated and shelf-stable prebiotic soda lines built on its
    proprietary OliSmart® fiber-and-botanical blend, which is trademarked but not patented. The formulation
    was developed in collaboration with Purdue University, is NutraStrong Prebiotic Verified, and B Corp
    certified, yet faces active class-action challenges disputing whether 6–9 g of fiber per can is clinically
    sufficient to deliver the advertised digestive health benefits. Manufacturing is entirely co-packed, with a
    second co-packer being onboarded in 2026 to reduce concentration risk.

sections:
  - id: product-portfolio-and-skus
    title: "Product Portfolio & SKU Landscape"
    body: |
      OLIPOP markets prebiotic soda in 12-oz aluminum cans across two distinct product lines that share the
      same brand identity but differ in formulation, fiber level, refrigeration requirement, and distribution
      channel target. The flagship refrigerated 9g Fiber Line launched in 2018 and has grown to 17+ flavors
      by May 2026, including Vintage Cola, Classic Root Beer, Cream Soda, Strawberry Vanilla, Cherry Vanilla,
      Orange Squeeze, and Tropical Punch. Each can delivers 9 grams of dietary fiber and 2–5 grams of sugar,
      compared with approximately 39 grams of sugar in a traditional 12-oz cola—roughly a 90% reduction in
      added sugar while adding meaningful fiber.

      The shelf-stable 6g Fiber Line was introduced in 2024–2025 as OLIPOP's strategic answer to cold-chain
      limitations in convenience, drug, and mass-market retail channels. By reformulating OliSmart with
      acacia, guar, and cassava fibers instead of the original chicory/Jerusalem artichoke blend, the company
      achieved ambient shelf stability of 9–12 months without preservatives, enabling placement in the regular
      soda aisle alongside traditional brands. This line has slightly lower fiber (6g) but maintains the same
      low-sugar, botanical profile, and sweetener approach. The company's active flavor innovation is visible
      in its May 2026 releases: Raspberry Sherbet (limited edition), now featured in Costco variety packs, and
      Blackberry Vanilla, which was reinstated as a permanent SKU following sustained consumer demand. The
      two-line portfolio strategy reflects a deliberate effort to balance health-claim differentiation with
      the mass-market distribution scale needed to achieve the company's broader sales targets.
