companyProfile:
  summary: "OLIPOP is an Oakland-based prebiotic soda company founded in 2018 by Ben Goodwin and David Lester. The business sells branded functional soft drinks built around its OliSmart fiber-and-botanical blend, positioning itself as a lower-sugar, gut-health-oriented replacement for legacy soda. By 2024 it had reached $400 million in revenue, achieved profitability, and expanded into 50,000–65,000 retail locations, making it one of the fastest-scaling modern CPG beverage brands."
  founders:
    - name: "Ben Goodwin"
      role: "Chief Executive Officer & Co-founder"
      background: "Former kombucha operator and beverage formulator; led Obi before co-founding OLIPOP and remains the brand's chief product scientist."
      claimRefs: [CO002, CO004, CO033]
    - name: "David Lester"
      role: "Co-founder & Board Advisor"
      background: "Former Diageo marketer and Obi co-founder who helped build OLIPOP's go-to-market strategy before shifting to a board advisory role in 2025."
      claimRefs: [CO003, CO034]
  foundingLocation: "Oakland, California, USA"
  headquarters: "Oakland, California, USA"
  productSummary: "OLIPOP sells refrigerated and shelf-stable prebiotic sodas in 12-oz cans, with low sugar and 6–9 grams of fiber per serving across flavors such as Vintage Cola, Classic Root Beer, Cream Soda, and fruit-forward limited editions."
  customerFocus: "Health-conscious U.S. soda drinkers, especially millennials and Gen Z consumers seeking lower-sugar, functional alternatives to legacy carbonated soft drinks."
  businessModel: "Wholesale retail distribution through national grocery, club, mass, convenience, and foodservice accounts, supplemented by direct-to-consumer subscriptions through Olishop."
  stage: "Late-stage private consumer beverage company; Series C in February 2025 and profitable in 2024."
  fundingStatus: "~$195M total disclosed equity financing through the February 2025 Series C, which valued OLIPOP at $1.85B and was led by J.P. Morgan Private Capital."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO009, CO011, CO016, CO017, CO023]

