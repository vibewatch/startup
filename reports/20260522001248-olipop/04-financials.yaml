  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "gross-margin"
      missingEvidence: "Audited gross margin for FY2023 and FY2024, including both before and after trade spend."
      whyItMatters: "Without gross margin, it is impossible to underwrite operating leverage, path to operating profitability, or validate the unit economics that justify the $1.85B valuation."
      diligencePath: "Request audited GAAP income statements for FY2023 and FY2024 from the company's finance team or data room."
      relatedQuestionRefs:
        - QI006
        - QI019

    - type: private-evidence-only
      severity: blocking
      topic: "burn-rate"
      missingEvidence: "Monthly operating cash flow, cash burn rate (if any), and cash balance at fiscal year-end 2024 and post-Series C; also 2025 revenue run-rate or guidance not yet disclosed."
      whyItMatters: "Cannot assess true cash runway or whether the profitability claim reflects GAAP profitability or a different metric; lack of 2025 guidance leaves forward revenue trajectory unverifiable."
      diligencePath: "Request monthly P&L, cash flow statement, and balance sheet for the trailing 12 months."
      relatedQuestionRefs:
        - QI015
        - QI019
        - QI025

    - type: private-evidence-only
      severity: material
      topic: "revenue-mix"
      missingEvidence: "Revenue breakdown by channel: retail/wholesale by top-5 retailer; DTC one-time vs. subscription; online marketplace."
      whyItMatters: "Channel concentration drives trade spend requirements, negotiating leverage with retailers, and DTC scalability; the mix is a primary input to margin trajectory."
      diligencePath: "Request channel-level revenue summary from the last two fiscal years."
      relatedQuestionRefs:
        - QI008
        - QI017

    - type: private-evidence-only
      severity: material
      topic: "working-capital"
      missingEvidence: "Accounts receivable days, inventory turns, accounts payable terms, and net working capital balance."
      whyItMatters: "Beverage CPG is inventory-intensive; rapid revenue growth at retail can generate significant working capital needs that offset reported profitability."
      diligencePath: "Request balance sheet and working capital bridge for FY2023, FY2024, and current period."
      relatedQuestionRefs:
        - QI022

    - type: private-evidence-only
      severity: material
      topic: litigation
      missingEvidence: "Current litigation status of the Olipop class action complaint, including any settlement discussions, demand amounts, or potential financial exposure."
      whyItMatters: "If Olipop faces a Poppi-scale settlement ($8.9M or more), the financial impact on cash and brand would be material; unquantified liability creates underwriting uncertainty."
      diligencePath: "Request litigation schedule from management; obtain outside counsel summary of pending claims."
      relatedQuestionRefs:
        - QI010

