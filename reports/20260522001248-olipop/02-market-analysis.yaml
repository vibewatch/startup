  - id: buyer-segmentation-and-channels
    title: Buyer Segmentation and Distribution Channels
    body: |
      Olipop's buyer base is principally individual consumers purchasing for personal or household
      consumption; the company operates a business-to-consumer (B2C) model with the consumer as
      buyer, user, and payer simultaneously. Retailers (Walmart, Target, Kroger, Whole Foods,
      Costco, Starbucks) are key channel intermediaries, not the buyers. The retailer relationship
      is critical for velocity and shelf positioning, but budget authority for the product
      ultimately lies with the household grocery or discretionary beverage budget.

      The primary consumer segment consists of health-conscious millennials and Gen Z adults aged
      roughly 18–40. Data from Beverage Industry citing Mintel shows that approximately 32% of
      U.S. consumers express interest in functional CSD innovations, and 58% say they are willing
      to pay a premium for healthier alternatives. Innova Market Insights found that 62% of U.S.
      adults purchased CSDs in the past 12 months, but frequency of consumption halved in 2023
      versus 2022, with perceived unhealthiness as the primary reason for cutting back —
      conditions that directly benefit Olipop's positioning.

      A secondary segment is "soda switchers": existing CSD consumers reducing sugar intake who
      seek familiar flavors (root beer, cream soda, cola) in a lower-sugar format. Olipop reports
      that approximately 50% of its growth comes from new consumers entering the category
      incrementally (rather than straight brand switching), signaling genuine market expansion
      rather than purely zero-sum share capture. The company also reports 25% adoption among Gen
      Z consumers, the highest of any age cohort.

      A nascent but strategically meaningful segment is the "food as medicine" channel:
      health-insurance networks and employer wellness plans that reimburse Olipop purchases as a
      preventive-care benefit. This is a novel payer structure distinct from standard retail and
      creates a potential institutional channel that could materially expand SAM if clinical
      evidence strengthens.

      Olipop products are available in nearly 50,000 U.S. retail locations including Walmart,
      Target, Whole Foods, Kroger, Costco, Wawa, and Starbucks. Convenience stores and food
      service are the identified white-space channels for 2025–2026 expansion, with Olipop's
      Series C proceeds specifically earmarked for distribution diversification.
