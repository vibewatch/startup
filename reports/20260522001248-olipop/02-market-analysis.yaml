callouts:
  - calloutType: insight
    title: Big-Beverage Validation Confirms Category, But Intensifies Competition
    body: >-
      PepsiCo's $1.95 billion acquisition of Poppi and Coca-Cola's organic Simply Pop launch
      within the same two-month window in early 2025 is the strongest external validation that
      prebiotic soda is a durable category rather than a passing fad. These two moves alone
      represent over $2 billion in committed capital and signals that both incumbents view the
      category as a core strategic pillar. For Olipop, this is simultaneously a market-making
      event (it will drive mass consumer trial of the "functional soda" concept) and a
      competitive threat, as Coke and PepsiCo bring distribution networks operating in
      500,000+ U.S. outlets versus Olipop's ~50,000.
    claimRefs:
      - CM005
      - CM006
      - CM031
      - CM032

  - calloutType: risk
    title: Scientific Skepticism and Health-Claim Litigation Create Premium-Price Risk
    body: >-
      The premium pricing model ($2.49/can vs. ~$0.50–$1.00 for traditional CSD) depends
      critically on consumer belief in functional health benefits. Independent nutrition
      scientists (Caitlin Dow, CSPI) have publicly questioned whether 6–9 grams of prebiotic
      fiber per can is sufficient to confer meaningful gut health benefits, and a 2025 class
      action lawsuit directly challenges Olipop's health marketing claims. If health-benefit
      perception erodes — through adverse litigation outcomes, FDA enforcement, or accumulating
      skeptical scientific consensus — the premium pricing rationale weakens, and the brand
      would compete on taste and positioning alone against Coke and Pepsi with vast cost
      advantages.
    claimRefs:
      - CM019
      - CM020
      - CM021
      - CM033

