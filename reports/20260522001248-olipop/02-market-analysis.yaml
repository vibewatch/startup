chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Olipop operates in a U.S. prebiotic soda market estimated at approximately $820 million in
    retail sales (2024) — a fast-growing ~2% of the $55.2 billion total U.S. carbonated soft
    drink market. Driven by gut-health awareness, sugar-reduction preferences, and decisive
    big-beverage validation via PepsiCo's $1.95 billion Poppi acquisition and Coca-Cola's Simply
    Pop launch in 2025, the category shows durable demand signals. Olipop holds category
    leadership with $400 million in 2024 revenue across ~50,000 retail doors, but faces
    intensifying incumbent competition, scientific skepticism about health-claim efficacy, and
    real risk of category saturation.

sections:
  - id: market-boundary-and-substitutes
    title: Market Boundary and Substitutes
    body: |
      Olipop's market sits within a nested set of categories that must be defined precisely before
      sizing. The broadest frame is the total U.S. carbonated soft drink (CSD) market, estimated
      by Mintel at $55.2 billion in 2024 — the pool of consumer soda spend that Olipop ultimately
      competes for through substitution. Within that pool, the "better-for-you" (BFY) and
      functional soda segment — beverages with reduced sugar, functional ingredients such as
      prebiotics, probiotics, adaptogens, or vitamins, and clean-label positioning — reached
      approximately $1 billion in retail sales across SPINS Natural and Multi-Outlet (MULO)
      channels for the 52 weeks ending September 2024.

      The narrowest and most directly relevant frame is the prebiotic/probiotic soda sub-segment.
      Citi lead beverages analyst Filippo Falorni, cited in Fortune (February 2025), estimated
      the U.S. prebiotic soda market at approximately $820 million in retail sales as of early
      2025, representing about 2% of the $42.4 billion U.S. soft drink market. Historical sizing
      from Food Ingredients First cites growth from $197 million in 2020 to $440 million in
      2024 by a narrower product scope, illustrating how boundary choices materially affect
      quoted market size.

      Primary status-quo substitutes for Olipop include traditional carbonated soft drinks (Coca-
      Cola, Pepsi, Dr Pepper, Sprite), which carry a 97% U.S. household penetration rate and
      remain the incumbent spend pool. Secondary substitutes include sparkling water (LaCroix,
      Bubly, Waterloo), kombucha, energy drinks (Red Bull, Monster), sports drinks (Gatorade,
      Bodyarmor), and juice products. The gut-health supplement category (capsules, gummies,
      powders) addresses similar consumer needs through a different format and channel; globally
      this market was $19.98 billion in 2025 per Grand View Research.

      Adjacent market expansion opportunities identified for Olipop include food service (cafes,
      fast-casual restaurants), convenience stores, and international markets. The August 2024
      launch of Olipop's shelf-stable 6g-fiber line broadened the company's addressable channel
      footprint to include ambient-temperature convenience and club channels previously dominated
      exclusively by legacy CSD brands.
