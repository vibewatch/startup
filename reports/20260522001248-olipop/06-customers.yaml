  - id: retail-footprint-channel-mix
    title: Retail Footprint and Channel Mix
    body: |
      OLIPOP's growth strategy has been sequenced: launch in natural food retailers where
      health-oriented early adopters accept premium pricing, prove velocity, then push into
      mainstream grocery and ultimately mass-market channels. By May 2026 the official
      OLIPOP website confirmed availability in over 65,000 retail locations nationwide—roughly
      3× its 2023 base of 20,000 doors and an unprecedented pace for an independent beverage
      brand.

      Named retail partners span every grocery tier. The natural channel includes Whole Foods
      Market and Sprouts Farmers Market. Mainstream grocery includes Kroger, Albertsons,
      Safeway, H-E-B, Wegmans, Publix, Meijer, and The Fresh Market. Mass market and club
      retail includes Walmart, Target, Costco, and Sam's Club. Drug and convenience channels
      include CVS, Wawa, Casey's, 7-Eleven, Circle K, Love's Travel Stops, Pilot, ExtraMile,
      and Maverik. Foodservice is anchored by Starbucks. Online retail runs through Amazon and
      OLIPOP's own DTC Olishop.

      Channel mix is estimated at roughly 80% or more from retail/wholesale and less than 20%
      from DTC, a shift from the brand's 2018–2020 DTC-first launch mode. The DTC website
      (powered by Shopify Plus, ReCharge, and Klaviyo) now primarily functions as a retention
      and LTV engine rather than the main growth channel. Subscribers receive 15% off every
      order and free shipping with no lock-in, choosing delivery every 2, 4, or 8 weeks.

      OLIPOP introduced a shelf-stable product line in August 2024, enabling placement in warm
      soda aisles and convenience coolers that cannot accommodate refrigerated product. OLIPOP
      Minis (7.5 oz) expanded reach into Target, Walmart, and Amazon, targeting kid-friendly
      pack sizes and on-the-go impulse occasions. Instacart and Walmart Connect retail media
      support in-aisle velocity during seasonal promotions. The channel breadth—from natural
      food to convenience to foodservice—demonstrates that OLIPOP has crossed the threshold
      from wellness niche to mainstream soda competitor.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
