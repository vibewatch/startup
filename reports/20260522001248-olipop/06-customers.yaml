chapter:
  number: 6
  title: Customers
  summary: >-
    OLIPOP's customer base is dominated by health-conscious millennials and Gen Z consumers who
    treat its prebiotic soda as a functional swap for legacy soft drinks. Proof of adoption is
    strong: 65,000+ U.S. retail doors by May 2026, $400 million in 2024 revenue, 60% prebiotic
    soda market share, and a 4.33-star Amazon rating across 298,000+ reviews. No public
    retention or cohort data has been disclosed, and a January 2026 class action lawsuit
    alleging deceptive health-claims marketing—along with premium pricing complaints and Poppi's
    2× Amazon unit-volume advantage—are material risks to sustained repeat purchase.

sections:
  - id: customer-segmentation-buyer-profile
    title: Customer Segmentation and Buyer Profile
    body: |
      OLIPOP's end customer is primarily an individual consumer who simultaneously acts as
      buyer, user, and payer—a classic direct-retail CPG structure with no significant
      enterprise or institutional channel. Three distinct psychographic segments drive
      demand.

      The largest segment is health-conscious adults (primarily 25–45-year-old millennials
      and older Gen Z) who actively reduce sugar intake and seek better-for-you functional
      alternatives. These buyers read labels, respond to gut-health messaging, and are willing
      to pay $2.39–$2.49 per can compared to roughly $0.50 for a conventional soda. CNBC
      cited Euromonitor analyst Matthew Barry in 2023 as noting that "there is certainly a
      group of consumers who can afford to buy high-priced sodas regularly but that's a limited
      subset of the population"—an early acknowledged ceiling on mass-market penetration.

      The second segment is legacy soda switchers: adults who consumed traditional CSDs daily
      and now want the nostalgia of root beer, cream soda, or cola without the sugar load.
      OLIPOP's root beer overtook Keurig Dr Pepper's A&W as the best-selling root beer at a
      major unnamed U.S. retailer in February 2023—a dramatic velocity signal that shows
      habitual soda drinkers making a direct product swap, not merely adding a supplement.

      The third segment is younger Gen Z consumers (18–24) engaged via TikTok and Instagram,
      attracted to limited-edition flavors, viral moments (Shirley Temple for Dry January 2026,
      Raspberry Sherbet spring 2026), and influencer endorsements from Gwyneth Paltrow, Mindy
      Kaling, and the Jonas Brothers. Approximately 63% of Americans aged 18 and older drink
      soda at least once daily, giving OLIPOP a very large potential substitution market.
      OLIPOP itself estimates that 97% of U.S. households already purchase soda, framing the
      brand's pitch as a functional upgrade within an existing purchase routine rather than a
      category creation.

      The buyer and payer are almost always the same individual: a household grocery shopper
      or online subscriber. No significant B2B or institutional channel has been identified;
      Starbucks' shelf stocking for retail resale is the primary foodservice adjacency. This
      single-consumer dependency means OLIPOP lacks enterprise stickiness and its retention is
      fully driven by consumer taste, health conviction, and price tolerance.
