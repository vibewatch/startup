  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention data gap
      missingEvidence: >-
        NRR, GRR, cohort-level repeat-purchase rates, subscription renewal rate, and
        subscriber count from OLIPOP management or a credible third-party panel.
      whyItMatters: >-
        Without retention metrics, it is impossible to assess whether OLIPOP's customer
        base is genuinely loyal or primarily dependent on trial-driven velocity. This is
        the single most important gap for estimating long-term revenue sustainability.
      diligencePath: >-
        Request from management: (1) annual subscriber count and 6-month renewal rate;
        (2) cohort-level repeat-purchase curves by retail channel and vintage; (3) Amazon
        Subscribe & Save share of total Amazon revenue; (4) DTC vs. retail gross margin
        split.
      relatedQuestionRefs:
        - QU024
        - QU003

    - type: private-evidence-only
      severity: material
      topic: retailer concentration risk
      missingEvidence: >-
        Revenue breakdown by top-5 retail accounts to quantify dependence on Walmart,
        Target, and Kroger, and to assess the consequence of adverse shelf-reset decisions.
      whyItMatters: >-
        Retailer concentration is a well-known risk for challenger CPG brands. Without
        per-account revenue data, it is impossible to size the exposure from any single
        retail partner reducing or eliminating OLIPOP's shelf space.
      diligencePath: >-
        Request from management: top-10 retail account revenue concentration; velocity
        trends by account over the past 8 quarters; contractual shelf-space commitments
        (if any); slotting fee obligations.
      relatedQuestionRefs:
        - QU010
        - QU021

    - type: missing-source
      severity: material
      topic: household penetration
      missingEvidence: >-
        Verified household penetration figure from a named panel (e.g., Numerator, IRI,
        SPINS, or Nielsen) to confirm or refute the secondary claim that OLIPOP reaches
        approximately 1 in 5 U.S. households.
      whyItMatters: >-
        Household penetration is a key indicator of addressable repeat-purchase potential.
        If the 1-in-5 figure is inflated, the ceiling for household adoption may be lower
        than implied and the growth runway shorter than the revenue trajectory suggests.
      diligencePath: >-
        Source Numerator or IRI household panel data; alternatively request management's
        own household penetration reporting.
      relatedQuestionRefs:
        - QU012

    - type: missing-source
      severity: minor
      topic: class action lawsuit status
      missingEvidence: >-
