callouts:
  - calloutType: strength
    title: Retail Velocity and Category Leadership
    body: >-
      OLIPOP's 469× revenue growth from 2019 to 2024 and its 65,000-door retail
      footprint—spanning natural, mainstream, mass, club, convenience, and foodservice—
      provide exceptionally strong proof of broad consumer adoption. The root-beer
      shelf displacement of A&W is a hard velocity data point that shows OLIPOP competing
      and winning against legacy CPG incumbents at mass retail, not just in wellness
      specialty channels.
    claimRefs:
      - CU015
      - CU021
      - CU006

  - calloutType: risk
    title: Class Action and Pricing Backlash
    body: >-
      The January 2026 class action lawsuit alleging OLIPOP's prebiotic health claims are
      deceptive—and that consumers paid 200–500% more than necessary for benefits they did
      not receive—represents a significant threat to the health-motivated purchase trigger
      underpinning OLIPOP's premium pricing. If the litigation gains traction or generates
      significant media coverage, it could undermine consumer willingness to pay $2–$3 per
      can and compress volume at price-sensitive retail accounts.
    claimRefs:
      - CU031
      - CU032
      - CU040

  - calloutType: risk
    title: Retention Data Gap
    body: >-
      No NRR, GRR, cohort retention, or subscription renewal rate data has been publicly
      disclosed. Assessing OLIPOP's true customer durability is therefore not possible from
      public sources. The DTC subscription's 15% discount is a meaningful loyalty incentive
      but provides no visibility into actual subscriber counts or renewal behavior. A buyer
      should require management to provide at minimum: subscriber count, 6-month subscription
      renewal rate, retail velocity trends by account, and Amazon Subscribe & Save share.
    claimRefs:
      - CU030
      - CU038
      - CU039

  - calloutType: insight
    title: Velocity-First Growth Model
    body: >-
      OLIPOP's decision to prioritize revenue per store over total door count—reaching $200M
      with just 28,000 doors—is a textbook velocity-first CPG strategy. It creates genuine
      retailer pull (buyers re-order because product moves) rather than push (salesperson-led
      placement that may not sell through). This model is structurally sound but also means
      that any sustained velocity decline at key accounts would likely trigger rapid shelf
      space reduction, creating a downside amplification risk if consumer demand softens.
    claimRefs:
      - CU028
      - CU011
      - CU012

