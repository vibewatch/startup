            title: Recommendation — Track
            body: >
              Olipop's $1.85 billion valuation at 4.6× trailing FY2024 revenue is defensible for a category-leading,
              profitable, fast-growing CPG brand, but insufficient adverse signals have accumulated to warrant immediate
              capital deployment. The stalling of M&A talks, the pivot to a new $200 million raise, the unresolved class
              action litigation, and the narrowing strategic buyer universe collectively justify a patient track stance.
              The path to buy requires: the new round closing at or above $1.85 billion with favorable terms; or a
              confirmed acquisition interest from a credible strategic buyer at a premium; or FY2025 revenue confirmed
              above $500 million with sustained profitability.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV009
              - CV043
          - type: callout
            title: Category Hype Risk and Multiple Compression
            body: >
              The prebiotic soda category was validated by PepsiCo's Poppi acquisition and Coca-Cola's Simply Pop
              launch, but those same events introduce the most potent competitive threats to Olipop's velocity and
              margin. Incumbent CPG companies can sustain promotional pricing, dedicate trade marketing budgets, and
              negotiate shelf space at a scale Olipop cannot match. If category growth plateaus — as happened with
              kombucha after the initial health-trend surge — and Zevia's <1× EV/Revenue trajectory becomes the relevant
              comp, the $1.85 billion mark becomes structurally stretched. Investors should monitor SPINS data for
              velocity-per-door trends across Walmart, Target, and Kroger monthly.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV027
              - CV029
              - CV036
          - type: callout
            title: The Poppi Precedent Is Bullish and Adverse Simultaneously
            body: >
              PepsiCo's $1.95 billion acquisition of Poppi at a higher implied EV/Revenue multiple than Olipop's own
              private market price validates category strategic value well above Olipop's current mark. This is the
              strongest bull argument for Olipop: if Olipop grows to Poppi's scale and a strategic buyer emerges, the
              exit could be substantially above $1.85 billion. However, PepsiCo is no longer a buyer, Coca-Cola is
              building organically, and reported talks with other parties stalled — meaning the Poppi precedent, while
              directionally favorable, does not guarantee a near-term acquirer for Olipop at a premium valuation.
            calloutType: insight
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV020
              - CV044
          - type: callout
            title: Revenue Growth Sustainability Is the Central Underwriting Assumption
            body: >
              All return scenarios hinge on whether Olipop can sustain meaningful revenue growth from its $400 million
              FY2024 base while maintaining profitability. The 100% YoY growth achieved in FY2024 is almost certainly
              not repeatable at scale — the base is now four times larger and competition has intensified. The central
              assumption for the base case is 12–25% growth in FY2025 (to $450–500 million). Investors should treat any
              forward revenue claim as a hypothesis to be validated against Q1–Q2 2026 SPINS retail scan data, which
              provides a leading indicator of full-year performance before company-controlled annual disclosures.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV024
              - CV025
              - CV036
