  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: |
              Olipop generates revenue through two primary channels: retail/wholesale distribution
              to approximately 50,000–65,000 retail doors across major chains (Walmart, Target, Kroger,
              Whole Foods Market, Costco, and Amazon), and a direct-to-consumer (DTC) e-commerce
              business featuring subscription and one-time purchase options. The retail/wholesale
              channel is dominant, accounting for an estimated 80–85% of total revenue, consistent
              with Olipop's stated focus on mass-market distribution acceleration. BevNet, citing SPINS
              scan data, reported $470 million in 2024 retail sales, a figure modestly above the
              company-stated $400 million total revenue, likely reflecting a gross-sales versus
              net-revenue accounting difference or the timing of channel sell-in.

              The DTC business operates through the Olipop website with a subscription tier priced
              at approximately $30.59 per 12-pack ($2.55/can), representing a 15% discount to the
              one-time DTC list price of $35.99 ($2.99/can). Subscription revenue contributes higher
              lifetime value per customer but the active subscriber count and churn rate are not
              publicly disclosed. Retail pricing ranges from $2.19–$2.49 per 12oz can at mass-market
              retailers, with Costco offering a 15-pack Spring 2026 variety pack at $19.99 ($1.33/can),
              illustrating meaningful channel-specific price variation. Olipop does not report
              blended net realized prices, so the revenue per case after trade allowances cannot be
              computed externally. The 2024 SPINS retail sales figure of $470 million versus the
              company's $400 million reported revenue implies a meaningful deduction for trade spend
              and returns, consistent with CPG industry norms where trade spend runs 15–25% of gross
              revenue. Revenue recognition issues around sell-in versus sell-through timing at major
              retailers, and the interplay with promotional allowances, should be audited in any
              transaction data room.
