      - number: '6.3'
        title: Named Partners and Customer Proof
        blocks:
          - type: paragraph
            body: |
              OLIPOP's retail partnerships provide concrete, publicly verifiable proof of production
              deployment. The most compelling velocity evidence is the root-beer shelf milestone:
              OLIPOP's root beer displaced Keurig Dr Pepper's A&W brand as the top-selling root beer
              at a major unnamed U.S. retailer in February 2023—a striking consumer endorsement that
              Ben Goodwin called a potential template for other flavors.

              Costco's inclusion of OLIPOP in a spring 2026 limited-edition variety pack—15 cans for
              $19.99, roughly $1.33 per can—validates both the brand's club-channel acceptance and
              consumer willingness to stock up in bulk. Costco's notoriously selective SKU curation
              makes this listing a meaningful quality signal; the Parade article described Costco
              shoppers "running" to buy the new pack, suggesting strong impulse sell-through.

              On Amazon, OLIPOP has accumulated 298,024 customer reviews with a 4.33 average rating
              as of early 2025. MetricsCart's Amazon analysis (Feb 4–18, 2025) found OLIPOP selling
              approximately 1.55 million units per month, with top-selling products including Vintage
              Cola, Cream Soda Pantry Pack, and Strawberry Vanilla Sparkling Tonic. Individual-can
              sales performing strongly suggests OLIPOP's Amazon buyers are trial and repeat
              purchasers rather than purely variety-seeking shoppers.

              Sporked, an independent food review outlet, reported having tasted all 17 OLIPOP flavors
              as of May 2026, publishing detailed assessments that position the brand as the originator
              of the prebiotic soda trend. Wellnesspulse, a health and nutrition review platform,
              recommended OLIPOP as a legitimate option for consumers seeking to reduce sugar, while
              flagging that digestive discomfort from inulin fiber is a real adverse reaction risk for
              some users.

              OLIPOP's presence at Starbucks completes the channel proof: a consumer-goods brand must
              clear Starbucks' brand-alignment and quality criteria to gain shelf placement. Groupon's
              Where-to-Buy guide confirms single-can prices of $2–$3 at most major retailers,
              consistent with the premium positioning strategy.
            claimRefs:
