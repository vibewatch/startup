      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Exceptional Capital Efficiency
            body: >
              Olipop reached approximately $400 million in FY2024 revenue while raising only approximately $195 million
              in total equity — a capital-to-revenue ratio of roughly $0.49 raised per $1 of annual revenue. For a CPG
              beverage company that paid for retailer slotting, co-packing, trade spend, and marketing entirely through
              equity, this efficiency is exceptional. First-time profitability in FY2024 further validates that the
              business model converts gross revenue into operating cash without requiring continuous dilution.
            calloutType: strength
            claimRefs:
              - CI001
              - CI011
              - CI027
          - type: callout
            title: Gross Margin Opacity — No Audited Financials
            body: >
              Every unit-economics figure in this chapter is estimated from CPG industry benchmarks or inferred from
              Zevia (public comparable) — no Olipop-specific gross margin, COGS, or EBITDA is publicly available. The
              company's profitability claim cannot be independently verified. A data room including at least two years
              of audited income statements and a current balance sheet is the minimum requirement before any financial
              underwriting can be finalized.
            calloutType: risk
            claimRefs:
              - CI030
              - CI032
              - CI033
          - type: callout
            title: Health-Claim Litigation Creates Precedent Risk
            body: >
              A class action complaint filed against Olipop alleges that its prebiotic health claims overstate
              clinically meaningful gut-health benefits. Poppi's $8.9 million settlement of materially similar claims
              (final court approval April 2026) sets a direct precedent. A comparable settlement, or the cost of
              prolonged litigation, would reduce cash, impose management distraction, and potentially require
              reformulation or re-labelling that disrupts the brand's primary value proposition.
            calloutType: risk
            claimRefs:
              - CI028
              - CI029
          - type: callout
            title: Strategic Acquisition Upside Relative to Poppi Precedent
            body: >
              PepsiCo acquired Poppi at an implied revenue multiple of approximately 15–19× versus Olipop's current
              implied valuation of approximately 4.6× FY2024 revenue. Even if Olipop's growth rate moderates, the gap
              between its private-market valuation and strategic acquiree multiples for beverage category leaders
              suggests meaningful upside in a strategic transaction. Coca-Cola and PepsiCo have both approached Olipop
              previously; the Series C as a "final equity round" may position the company for a near-term strategic
              process.
