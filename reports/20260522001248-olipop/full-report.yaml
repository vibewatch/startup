  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue deceleration
        - FY2025 revenue confirmed below $430M or growth below 10% YoY
        - Forward multiple inflates above 4.3×; bear-case probability increases above 60%; buyer M&A interest erodes
        - Exit or avoid new capital deployment; reassess bear-case terminal value
      - - Confirmed down round on $200M raise
        - $200M raise priced below $1.85B post-money
        - Private market reset destroys momentum signal; liquidation preference math worsens for common
        - Reassess entry multiple and negotiate fresh terms; original Series C investors face paper loss
      - - Class action material settlement or adverse judgment
        - Settlement or judgment ≥$30M, or ongoing litigation materially restricts marketing language
        - Cash drain; regulatory precedent risk for health-claim marketing nationally; reduces acquirer appetite
        - Legal diligence escalation; haircut on exit valuation; monitor SPINS velocity for brand impact
      - - Strategic buyer universe collapses
        - >-
          KDP acquires a direct competitor; Monster confirms no interest; no international strategic emerges within 18
          months
        - Financial acquirer (PE) becomes only exit path; PE buyers apply lower revenue multiples and require leverage
        - Reassess exit valuation ceiling; monitor secondary discount to $1.85B mark
      - - Category share loss
        - SPINS / Nielsen data shows Olipop velocity below Simply Pop or Poppi-by-Pepsi at ≥3 major retail chains
        - Category leadership premium erodes; multiple compression to mid-2× range; strategic value declines
        - Thesis-break; revisit competitive differentiation; assess brand loyalty durability
    notes: >
      Trigger thresholds are analyst estimates based on financial modeling and sector experience; they are not company
      guidance. Events would need confirmation before triggering action.
    claimRefs:
      - CV009
      - CV010
      - CV013
      - CV021
      - CV022
      - CV036
      - CV044
      - CV045
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Gross margin and EBITDA
        - CPA-audited income statement; gross margin % by channel; EBITDA before and after stock compensation
        - EV/Revenue multiples are imprecise; gross margin drives terminal value and credible EBITDA multiple range
        - Data room request; management presentation; Series C investor disclosure
      - - $200M round valuation and terms
        - Post-money valuation, liquidation preference terms, and anti-dilution provisions of the pending new round
        - Defines whether existing investors face a down round and quantifies dilution impact on return analysis
        - Axios / Morgan Stanley deal process; company CFO disclosure to prospective investors
      - - Class action status and liability quantification
        - Filed complaint, discovery record, any settlement discussions, legal reserve established by company
        - Poppi's $8.9M settlement is benchmark; Olipop's specific legal exposure may differ based on scientific record
        - Company legal counsel disclosure; court docket review; industry litigation monitor
      - - Working capital and cash position
        - Cash balance as of Q1 2026, accounts receivable aging, inventory turns, and operating cash flow
        - >-
          Profitability claim cannot be independently verified; cash dynamics matter for assessing how much of the $200M
          is necessary vs. discretionary
        - Data room; management Q&A; Series C investor reference
      - - FY2025 revenue actuals (Q1–Q2 2026)
        - Q1 2026 and Q2 2026 revenue, or any FY2025 confirmed total
        - Forward multiple and scenario probability weights change materially depending on actual revenue trajectory
        - Company earnings briefings; beverage industry sell-in data (SPINS / Nielsen); BevNET reporting
    notes: >
      Diligence asks are prioritized by their impact on the investment decision. Items 1 and 2 are blocking for any
      incremental capital commitment at current terms.
    claimRefs:
      - CV040
      - CV041
      - CV043
      - CV044
      - CV045
