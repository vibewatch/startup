  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              Olipop operates in a nested competitive landscape that spans direct prebiotic soda peers,
              incumbent big-beverage brands now entering the category, adjacent functional beverage
              formats, and status-quo substitutes. The most consequential competitive development of 2025
              was the simultaneous entry of both major U.S. soda duopolists: PepsiCo acquired Poppi for
              $1.95 billion (announced March 17, closed May 19, 2025), and Coca-Cola launched Simply Pop in
              February 2025 under its trusted Simply juice brand. These moves validate the category's
              commercial durability but also shift the competitive environment from challenger-brand
              dynamics to incumbent-scale warfare.

              Direct prebiotic soda peers include Poppi (now PepsiCo-owned), Simply Pop (Coca-Cola),
              Culture Pop Soda (independent, Series B), SunSip (Health-Ade), Bloom Pop (Bloom Nutrition),
              Slice (Suja Life), and an emerging tier of private-label entries from mass retailers. The
              adjacent-competitor class includes Zevia (publicly traded, zero-sugar stevia soda),
              kombucha brands (GT's Living Foods, Health-Ade), sparkling waters (LaCroix, Bubly), and
              energy drinks (Red Bull, Monster). Status-quo substitutes remain traditional CSDs—Coca-Cola
              Classic, Pepsi-Cola, Dr Pepper—which command 97% U.S. household penetration and represent
              the primary share-of-stomach pool that Olipop targets for conversion. Internal build, in
              which retailers develop their own store-brand prebiotic sodas, is an emerging risk that
              Aldi and Trader Joe's have already begun to execute. The combined result is a shelf that
              is measurably more crowded in 2025–2026 than in any prior period, compressing the window
              in which Olipop's first-mover advantages remain structurally unchallenged.
