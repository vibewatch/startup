      - number: '7.3'
        title: Operational and Supply Chain Risk
        blocks:
          - type: paragraph
            body: >-
              OLIPOP manufactures through a network of undisclosed third-party co-packers. This outsourced model is
              common in better-for-you CPG but creates concentration and quality risk: a co-packer production outage or
              quality failure immediately impairs order fulfillment and risks retailer delisting. A Class I product
              recall triggered by contamination, mislabeling, or undisclosed allergens would impose direct remediation
              costs and permanent shelf-space loss at major retailers. The OliSmart blend requires chicory root inulin,
              cassava root fiber, and Jerusalem artichoke fiber — specialty botanical inputs with geographically
              concentrated supply chains subject to climate variability and demand spikes across the broader functional
              beverage industry. Olipop's official product quality page affirms GMP compliance and ingredient testing
              across its co-packer network but does not disclose co-packer identities, audit results, or supplier
              concentration metrics. COGS transparency is limited (private company), making it difficult to verify
              whether gross margin absorbs inflationary ingredient and co-packing pressures or must be passed to
              retailers. Food and beverage manufacturers broadly cite supply chain disruption, ingredient inflation, and
              regulatory compliance as top operational risks for 2025-2026.
