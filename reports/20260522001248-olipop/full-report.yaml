      - number: '5.4'
        title: Trust, Quality & Regulatory Compliance
        blocks:
          - type: paragraph
            body: |
              OLIPOP has built a multi-layered quality and certification posture that is unusual for a consumer
              packaged-goods brand at its stage. It is the first beverage brand certified under the NutraStrong
              Prebiotic Verified Product Certification program, operated by SGS Nutrasource in partnership with
              the Global Prebiotic Association. NutraStrong requires third-party verification of label accuracy
              (confirmed fiber type and quantity), GMP manufacturing standards, validated lot testing, and corporate
              values transparency. This certification provides a credible external signal that the fiber quantities
              stated on the label are what consumers actually receive—directly relevant given the ongoing litigation.

              OLIPOP holds B Corp certification (awarded 2023), consistent with its public benefit corporation (PBC)
              legal structure. B Corp certification requires biennial recertification audits covering environmental,
              social, and governance practices. On the adverse side, the Environmental Research Center filed
              California Proposition 65 60-day notices in 2024 alleging that 12 Olipop flavors contain lead and
              mercury above Prop 65 disclosure thresholds. These notices are a compliance gap requiring either
              independent testing rebuttal, corrective label warnings, or a negotiated settlement. Separately, active
              class action lawsuits in New York and California allege that OLIPOP's prebiotic health claims are
              misleading because a single can (6–9g fiber) delivers less than the 12+ grams per day that plaintiffs
              argue is required for meaningful digestive benefit. The FDA has not issued any enforcement action against
              OLIPOP for unsafe ingredients as of May 2026, and OLIPOP's ingredient list uses FDA-recognized dietary
              fibers (chicory inulin, cassava, acacia), providing some regulatory legitimacy to the fiber count on
              the label.
