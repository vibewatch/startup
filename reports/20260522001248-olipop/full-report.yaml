      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Rare Revenue Velocity for a CPG Brand
            body: >-
              Olipop grew from $852,000 in launch-year revenue (2019) to $400 million in 2024 — a 469x increase in five
              years — while simultaneously achieving profitability. This revenue trajectory and the displacement of A&W
              Root Beer as the top-selling root beer in the United States are meaningful signals that the brand is
              generating genuine consumer switching, not merely category experimentation.
            calloutType: strength
            claimRefs:
              - CO005
              - CO013
              - CO016
              - CO036
          - type: callout
            title: Health Claims Litigation Is a Structural Risk
            body: >-
              Olipop's $3–4 per can premium price is almost entirely underwritten by its prebiotic gut-health
              positioning. The 2025 class action alleging that the fiber dosage per can is insufficient for clinically
              meaningful benefit — combined with independent expert skepticism published in The Washington Post —
              creates a material risk to brand positioning, regulatory standing, and the pricing premium. If plaintiffs
              prevail or FDA/FTC guidance tightens on functional beverage health claims, Olipop may need to
              substantially revise marketing, which would compress margins and reduce its competitive differentiation
              from lower-priced legacy sodas.
            calloutType: risk
            claimRefs:
              - CO029
              - CO031
          - type: callout
            title: Institutional Investor Entry Signals Category Maturation
            body: >-
              J.P. Morgan Private Capital's $50 million Series C anchor is notable not for its size but for its source.
              Consumer venture capital and celebrity investors historically led functional beverage rounds; the entry of
              the largest U.S. bank's growth equity arm signals that Olipop's profitability, scale, and category
              leadership have crossed a threshold of institutional underwriting. This is a meaningful inflection point
              for diligence — the next question is whether the valuation multiple is supportable at the current revenue
              run rate.
            calloutType: insight
            claimRefs:
