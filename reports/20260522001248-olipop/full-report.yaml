      - number: '7.2'
        title: Competitive and Market Risk
        blocks:
          - type: paragraph
            body: >-
              OLIPOP's competitive environment shifted dramatically in 2025 with incumbent Big Soda entry. PepsiCo
              completed its Poppi acquisition for approximately $1.95 billion in 2025, granting Poppi access to
              PepsiCo's global direct-store-delivery distribution network, promotional budgets, and established retailer
              relationships. Coca-Cola simultaneously launched Simply Pop, a prebiotic soda with 6 g fiber per can, no
              added sugar, 25-30% real fruit juice, and vitamin C and zinc fortification, leveraging the Simply brand's
              mass retail footprint. Both incumbents have co-marketing agreements and promotional allowances with
              Walmart, Target, and Kroger that Olipop cannot match. Retailers allocate shelf facings based on velocity
              and promotional support; a Big Soda-backed alternative at a comparable or lower price point creates
              asymmetric risk of SKU rationalization for Olipop. The prebiotic soda category grew from approximately
              $197 million in 2020 to $440 million in 2024, but Olipop's share within the growing category is now
              contested by incumbents with structural distribution advantages. Olipop distributes across approximately
              50,000 US retail locations, with primary concentration in Walmart, Target, Kroger, and Costco — a channel
              mix that makes a decision by any single mass retailer to reduce Olipop facings immediately material to
              revenue.
