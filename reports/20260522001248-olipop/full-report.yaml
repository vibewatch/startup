      - number: '4.4'
        title: Capital Adequacy and Financing Position
        blocks:
          - type: paragraph
            body: |
              Olipop closed a $50 million Series C in February 2025, led by J.P. Morgan Private
              Capital's Growth Equity Partners, at a $1.85 billion post-money valuation. This follows
              a $39.7 million Series B in February 2022 (at approximately $200 million valuation)
              and earlier seed and Series A rounds, bringing total disclosed equity to approximately
              $195 million. CEO Ben Goodwin stated that the Series C represents Olipop's "final
              anticipated round of equity financing," signaling an expectation of self-funded growth
              or a near-term liquidity event (strategic acquisition or IPO process).

              Olipop achieved profitability in FY2024 — a rare milestone for a CPG brand at this
              stage of growth — which fundamentally changes the nature of the capital need. The Series C
              is being deployed for product development, marketing investment, and distribution
              expansion rather than to fund operating losses. No debt or project-finance facilities
              have been disclosed; the co-packing model avoids traditional capex for manufacturing
              infrastructure. However, beverage inventory is capital-intensive: raw materials must
              be sourced, co-packed, and warehoused before retail sell-through, typically creating
              meaningful accounts-receivable and inventory-on-hand balances. The actual cash balance,
              monthly operating cash flow, and working capital cycle are not publicly disclosed.
              At $400 million in revenue with positive operating cash flow claimed, and $50 million
              freshly raised, Olipop's cash position appears adequate for near-term operations, but
              cannot be independently verified without audited financials. The implied EV/Revenue
              multiple of approximately 4.6× at the $1.85 billion valuation compares favorably to
              PepsiCo's acquisition of Poppi at an estimated 15–19× forward revenue, suggesting
              strategic acquisition upside remains if Olipop sustains its growth trajectory.
