      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The category's near-term trajectory is shaped by powerful demand-pull drivers operating
              simultaneously with meaningful structural constraints that investors must weigh carefully.

              On the demand side, the secular shift away from sugar is the dominant macro driver.
              Approximately 49% of U.S. adults prefer zero-sugar beverages at least weekly, and 38% of
              all global soft drink launches in 2024 were sugar-free or low-sugar, per Gitnux. The gut-
              health wellness trend amplifies this: digestive disorders affect approximately 40% of the
              global population (WHO), and consumers have incorporated gut-health awareness into
              purchasing decisions at a measurable rate — SPINS data shows sodas with digestive health
              claims saw approximately 301% dollar growth in 2023 alone in measured channels.

              Big-beverage validation in 2025 is perhaps the single most consequential market signal.
              PepsiCo's $1.95 billion acquisition of Poppi and Coca-Cola's February 2025 Simply Pop
              launch transformed what was previously a startup-led niche into a board-level strategic
              priority for both incumbents. This validation cuts two ways: it confirms the market's
              durability and brings massive distribution scale, but it also introduces well-resourced
              competition targeting the same 18–40 demographic with established brand equity.

              On the constraint side, scientific skepticism about health-claim efficacy is the most
              material risk. CSPI nutrition scientist Caitlin Dow stated publicly that prebiotic sodas
              are "better than a regular soda" but expressed doubt about their gut health benefit:
              "I don't think we should be looking to soda or to processed foods to support our gut
              health." Citi analyst Filippo Falorni warned: "We've seen many new sub-categories fizzle
              out after a few years of strong growth." Litigation challenging Olipop's health marketing
              claims (a 2025 class action) adds regulatory and legal risk to the premium pricing model.
              Premium pricing ($2.49 per can vs. $0.50–$1.00 for traditional CSD) constrains mass-market
              penetration; in an era of high grocery inflation this creates a real affordability ceiling.

              GLP-1 weight-loss drug adoption creates an indirect tailwind: CPG companies are
              reformulating toward lower-sugar, higher-fiber products anticipating that GLP-1 users will
              shift their dietary preferences, which Olipop inherently satisfies. PepsiCo's portfolio
              overhaul explicitly cited GLP-1 as a strategic backdrop for its Poppi acquisition.
