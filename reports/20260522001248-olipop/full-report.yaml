      - number: '2.2'
        title: Market Sizing, Estimates, and Contradictions
        blocks:
          - type: paragraph
            body: |
              Multiple sizing lenses produce materially different estimates, reflecting genuine boundary
              and methodology disagreement that diligence must preserve rather than paper over. The
              widest U.S. CSD market figure — $55.2 billion in 2024 (Mintel, as reported by Beverage
              Industry) — captures total consumer CSD retail spend and represents the theoretical TAM
              that Olipop could win over the very long term. Circana multi-outlet data for the 52 weeks
              ending April 20, 2025 shows $46.1 billion in carbonated beverages dollar sales with 6.2%
              year-over-year dollar growth and 0.9% unit growth, confirming that volume is flat while
              revenue rises through pricing and mix shifts toward premium and functional SKUs.

              The most cited SAM (serviceable addressable market) for Olipop is the U.S. BFY/functional
              soda category. SPINS data through September 2024 puts this at approximately $1 billion
              across natural channel and MULO combined. This is the segment where Olipop and Poppi
              compete, where growth has been triple-digit in recent years, and where Coca-Cola found only
              20% market penetration — indicating substantial headroom.

              For the narrowest prebiotic-specific frame, estimates diverge significantly: Citi analyst
              Falorni cited $820 million in U.S. retail sales (early 2025); Food Ingredients First cited
              $440 million in 2024 for what appears to be a narrower U.S. scope; Persistence Market
              Research estimated the global market at $286.6 million in 2026 using an extremely narrow
              definition; Market Research Future estimated the global prebiotic soda market at $1.46
              billion in 2024 growing to $5.72 billion by 2035 (13.18% CAGR); Emergen Research
              estimated the global market at $1.8 billion in 2024, growing to $4.2 billion by 2034
              (8.9% CAGR). This five-fold spread — from ~$286 million to ~$1.8 billion globally in 2024
              — is a direct result of definitional variation (prebiotic-only vs. functional soda
              broadly, U.S. vs. global) and underscores the need to anchor any sizing claim to its
              explicit definition and geography.

              Olipop's $400 million in 2024 revenue and Poppi's $500 million in 2024 sales together
              total approximately $900 million in combined revenue from just two brands, which is
              consistent with a ~$820 million–$1 billion U.S. market-level estimate for the overall
              category when accounting for both brands' retail price premiums and direct channel revenue.
              The Marketing Dive and Coca-Cola's internal research cited a path to $3.5 billion for the
              global prebiotic soda market by 2032, offering the most widely cited long-term projection.
