      - number: '6.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Retail Velocity and Category Leadership
            body: >-
              OLIPOP's 469× revenue growth from 2019 to 2024 and its 65,000-door retail footprint—spanning natural,
              mainstream, mass, club, convenience, and foodservice— provide exceptionally strong proof of broad consumer
              adoption. The root-beer shelf displacement of A&W is a hard velocity data point that shows OLIPOP
              competing and winning against legacy CPG incumbents at mass retail, not just in wellness specialty
              channels.
            calloutType: strength
            claimRefs:
              - CU015
              - CU021
              - CU006
          - type: callout
            title: Class Action and Pricing Backlash
            body: >-
              The January 2026 class action lawsuit alleging OLIPOP's prebiotic health claims are deceptive—and that
              consumers paid 200–500% more than necessary for benefits they did not receive—represents a significant
              threat to the health-motivated purchase trigger underpinning OLIPOP's premium pricing. If the litigation
              gains traction or generates significant media coverage, it could undermine consumer willingness to pay
              $2–$3 per can and compress volume at price-sensitive retail accounts.
            calloutType: risk
            claimRefs:
              - CU031
              - CU032
              - CU040
          - type: callout
            title: Retention Data Gap
            body: >-
              No NRR, GRR, cohort retention, or subscription renewal rate data has been publicly disclosed. Assessing
              OLIPOP's true customer durability is therefore not possible from public sources. The DTC subscription's
              15% discount is a meaningful loyalty incentive but provides no visibility into actual subscriber counts or
              renewal behavior. A buyer should require management to provide at minimum: subscriber count, 6-month
              subscription renewal rate, retail velocity trends by account, and Amazon Subscribe & Save share.
            calloutType: risk
            claimRefs:
              - CU030
              - CU038
              - CU039
          - type: callout
            title: Velocity-First Growth Model
            body: >-
              OLIPOP's decision to prioritize revenue per store over total door count—reaching $200M with just 28,000
              doors—is a textbook velocity-first CPG strategy. It creates genuine retailer pull (buyers re-order because
              product moves) rather than push (salesperson-led placement that may not sell through). This model is
              structurally sound but also means that any sustained velocity decline at key accounts would likely trigger
              rapid shelf space reduction, creating a downside amplification risk if consumer demand softens.
            calloutType: insight
            claimRefs:
              - CU028
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              OLIPOP's most immediate legal exposure is an active federal class action filed December 17, 2025 by
              plaintiff Jordan Somers in the Eastern District of New York (Case No. 1:25-cv-06933). The complaint
              alleges that 6-9 g of prebiotic fiber per can is insufficient to produce meaningful gut-health outcomes at
              single-can frequency, making Olipop's digestive-wellness marketing deceptive under New York General
              Business Law provisions. The suit seeks statutory damages, an injunction against health-claim marketing,
              and corrective advertising — remedies that would directly disrupt the brand identity built over seven
              years. Plaintiff's counsel has a ready road map from Poppi's $8.9 million April 2026 settlement of an
              analogous class action, reducing discovery costs and providing a precedent settlement structure. On the
              regulatory front, the California AG Prop 65 database records a consent judgment (Case No. 24CV096887, June
              20, 2025) from an Environmental Research Center enforcement action identifying lead and mercury in
              multiple Olipop flavors. The judgment obligates Olipop to provide Prop 65 warnings in California under
              revised standards effective January 1, 2025. The FTC's 2022 Health Products Compliance Guidance (updated
              2025) requires competent and reliable scientific evidence — ideally from randomized controlled human
              trials — to substantiate prebiotic efficacy claims; FDA and DOJ maintained active coordinated enforcement
              in 2025. Olipop also filed an offensive trademark suit in the SDNY against Nutruit for using the Olipop
              name on olive products — a signal of brand value but a further drain on legal attention and budget.
