      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: |
              Poppi (PepsiCo): Founded in 2018 by Stephen and Allison Ellsworth in Austin, Texas, Poppi
              built its brand on apple cider vinegar, agave inulin (2g per can), and fruit juice with a
              maximum of 5g of sugar per serving. Poppi grew from $13 million in 2020 to an estimated
              $500 million in 2024, achieving approximately 19% U.S. prebiotic soda market share across
              36,000-plus retail locations before the PepsiCo acquisition closed. PepsiCo paid $1.95
              billion gross ($1.65 billion net of $300 million anticipated cash tax benefits), plus a
              performance-based earnout. The brand brings PepsiCo's global distribution infrastructure,
              marketing budget, and relationships with every major U.S. retailer. Poppi's notable
              liability is an $8.9 million false-advertising class action settlement (final approval
              April 2026) over insufficient prebiotic dosage per can—a precedent with direct relevance
              to Olipop's own pending litigation.

              Simply Pop (Coca-Cola): Launched February 2025 in five fruit-forward flavors under the
              Simply brand, each 12-oz slim can contains 6g prebiotic fiber, vitamin C, and zinc, with
              25-30% real fruit juice and no added sugar, at a $2.49 suggested retail price. Coca-Cola
              found the category had only approximately 20% market penetration and pursued an organic
              build rather than an acquisition, leveraging Simply's more than two decades of brand equity
              with Gen Z consumers. Simply Pop initially launched regionally (West Coast and Southeast)
              with national expansion planned through 2025. The marketing strategy is digital- and
              experiential-first, targeting Gen Z and Millennials with influencer activations and a
              Dear Media podcast tour.

              Culture Pop Soda: Founded 2020 by Tom First in Cambridge, Massachusetts. Raised $36.2
              million in disclosed funding including a Series B in March 2025 backed by Enlightened
              Hospitality Investments. Culture Pop positions as an internet-first, DTC-oriented brand
              with a small team (~15 employees mid-2024), focusing on natural grocery and specialty
              retail. Revenue remains undisclosed and is estimated well below $50 million.

              SunSip (Health-Ade): Launched February 2024 by Health-Ade, one of the leading kombucha
              brands since 2012. SunSip began as a Whole Foods exclusive before expanding. The product
              avoids stevia (a point of differentiation from some competitors), sweetening instead with
              real fruit juice, organic cane sugar, and monk fruit. Each can contains vitamins C, B6,
              B12, zinc, and selenium alongside prebiotic fiber. SunSip benefits from Health-Ade's
              established supply chain and retailer relationships, accelerating its shelf-expansion
              timeline compared to fully independent entrants.

              Zevia: A publicly traded (NYSE: ZVIA) zero-sugar, stevia-sweetened soda that does not
              carry prebiotic claims. Zevia reported $155.0 million in 2024 net sales (down 6.8% from
              $166.4 million in 2023) and recovered to $161.3 million in 2025 (up 4.0% YoY). Gross
              margin improved to 48.0% in 2025 from 46.4% in 2024, but the company remained loss-making
              ($11.2 million net loss in 2025). Zevia competes for the attention of calorie-conscious
              consumers but does not directly address gut-health positioning.
