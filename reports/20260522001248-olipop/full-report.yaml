      - number: '4.2'
        title: Cost Structure and Unit Economics Proxies
        blocks:
          - type: paragraph
            body: |
              Olipop's cost structure is characteristic of an asset-light CPG beverage brand: the
              company does not own manufacturing facilities, relying entirely on co-packers (contract
              manufacturers) for production. Co-packing costs for carbonated beverages at Olipop's
              scale typically range $0.10–$0.40 per can for manufacturing labor and overhead, with
              ingredients (chicory root inulin, cassava fiber, marshmallow root, and botanical
              extracts) adding a meaningful premium above conventional soda formulations. Packaging
              (cans, printed labels, secondary cartons) is the third major variable cost. Freight
              from co-packer facilities to regional distribution centers and then to retail stores
              adds a further 5–10% of net revenue, consistent with beverage-industry benchmarks.

              No gross margin figure is publicly disclosed for Olipop. The closest public comparable
              is Zevia PBC (ticker: ZVIA), a listed functional beverage company, which achieved a
              46.4% gross margin in FY2024 on $155 million in net sales — a record high driven by
              improved ingredient sourcing. Keurig Dr Pepper (KDP) reported an adjusted operating
              margin of 25.9% on $15.4 billion in net sales for FY2024, reflecting the economics of
              a mature, vertically integrated beverage business. Premium challenger brands with
              functional ingredients and premium co-packing typically target gross margins in the
              35–50% range before trade spend. Olipop's profitability claim in 2024 is consistent with
              a gross margin at the higher end of this range, but without audited financials, this
              cannot be confirmed. Trade spend — promotional allowances, temporary price reductions,
              slotting fees, and display fees — is an additional "below-the-line" cost for CPG brands
              that can compress the effective net margin meaningfully. For brands at Olipop's stage
              of retail expansion, slotting fees alone for a new SKU rollout to a national retailer
              can run $2,000–$5,000 per store, and total trade spend benchmarks at 15–25% of gross
              revenue represent the largest post-COGS line item on the P&L.
