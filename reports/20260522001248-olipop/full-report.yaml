      - number: '7.4'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Ben Goodwin occupies an unusually concentrated role at OLIPOP: co-founder, CEO, chief product formulator,
              and primary public brand spokesperson simultaneously. Every Olipop flavor is formulated by Goodwin
              personally, and the brand's scientific positioning, OliSmart blend narrative, and prebiotic efficacy
              credibility flow directly from his expertise and public identity. This is a key-person dependency rare
              even by founder-led CPG standards, because the risk spans both operational IP (formulation know-how) and
              reputational capital (brand authenticity is tied to the founder's story). In 2025, Olipop recruited Melvin
              Landis, a veteran of The Coca-Cola Company and The Clorox Company, as President, adding institutional
              operational depth. Co-founder David Lester transitioned to an advisory role, institutionalizing governance
              beyond the founding pair. These moves reduce operational concentration but do not fully address
              formulation IP custody or brand-identity dependency on Goodwin. The transition from a founder-led,
              operationally informal team to an institutionalized $500 M+ revenue business is a critical inflection
              point where CPG companies commonly experience mis-hires, cultural dilution, and operational breakdowns.
