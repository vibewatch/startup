      - number: '8.3'
        title: Scenario Analysis and Return Framework
        blocks:
          - type: paragraph
            body: |
              A three-scenario expected-value framework anchors the return analysis, using the
              $1.85 billion February 2025 Series C post-money valuation as the baseline entry.
              Preference overhang: UpsideList estimates $243 million in liquidation preferences
              ahead of common equity as of March 2026, representing approximately 13.1% of the
              $1.85 billion valuation — material for employee equity analysis and for assessing
              downside distributions, but less relevant for Series C preferred investors who sit
              at the top of the preference stack. Kalshi/Octagon prediction market data as of
              May 2026 assigns approximately 19% probability to an Olipop IPO before February
              2027, indicating that strategic acquisition remains the dominant expected exit path
              and that public market exit optionality is limited in the near term.

              Bull case (assigned approximately 25% probability by the UpsideList analyst model
              and consistent with this analysis): Olipop sustains 40–50% revenue growth to
              $600–800 million by 2027–2028, settles or dismisses the class action lawsuit with
              minimal financial impact, and is acquired by an international beverage conglomerate
              or domestic midcap strategic at 6–8× revenue, implying an exit valuation of
              $3.6–6.4 billion — a 2.0–3.5× return on the $1.85 billion mark. A public offering
              at comparable multiples would produce a similar outcome, requiring Olipop to
              maintain profitability and achieve sufficient revenue scale to command a premium
              listed multiple.

              Base case (assigned approximately 30% probability): FY2025 revenue of $450–500
              million with growth deceleration to 20–30% in 2026, continued profitability, and
              a strategic acquisition or controlled IPO in 2027–2028 at approximately 4–5×
              forward revenue. This implies an exit valuation of $2.0–2.5 billion — a 1.1–1.4×
              return on the $1.85 billion entry. The new $200 million raise is absorbed productively,
              buys time for strategic conditions to improve, and the Series C mark is validated
              rather than discounted.

              Bear case (assigned approximately 45% probability given fresh adverse signals):
              Revenue growth decelerates sharply below 20% as Simply Pop and Poppi-by-PepsiCo
              take meaningful shelf velocity, the class action settles at material cost ($20–50
              million), and the $200 million raise prices at a discount to $1.85 billion (confirmed
              down round). The eventual exit occurs at a distressed 2–3× revenue multiple,
              implying an exit valuation of $940 million to $1.4 billion — a 0.5–0.76× return
              on the $1.85 billion entry. UpsideList's independent model places this bear-case
              exit at approximately $760 million at the floor. The bear case is assigned a
              plurality probability because the stalling of M&A talks and the pivot to a new
              capital raise are fresh adverse signals that increase its weight relative to
              pre-2026 assessments.

              The probability-weighted expected return across scenarios is approximately 1.0–1.3×
              the $1.85 billion entry, reflecting meaningful upside optionality offset by a high
              bear-case probability. This is positive in expected-value terms but falls short of
              standard venture or growth-equity hurdle rates (typically 3× or more for illiquid
              private equity over a 3–5 year horizon). The valuation stance is fair: not expensive
              enough to avoid with conviction, but not cheap enough to deploy capital without
              additional catalysts. The strongest catalyst for re-rating upward would be a
              confirmed $200 million raise at or above $1.85 billion, resolution of the litigation
              exposure, or evidence of FY2025 revenue materially above $500 million.
