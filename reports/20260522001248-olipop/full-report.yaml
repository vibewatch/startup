        title: Exhibits
        blocks:
          - type: callout
            title: NutraStrong Prebiotic Certification — First Beverage Brand
            body: >
              OLIPOP is the first beverage brand to achieve NutraStrong Prebiotic Verified Product Certification across
              its entire product line. Administered by SGS Nutrasource and the Global Prebiotic Association, this
              certification requires third-party verification that the fiber quantities stated on the label actually
              match what is in the can—directly responsive to the core allegation in the class action lawsuits and a
              meaningful quality differentiator versus uncertified competitors.
            calloutType: strength
            claimRefs:
              - CE021
              - CE022
          - type: callout
            title: No Patent on OliSmart — Formula Copyability Risk
            body: >
              OliSmart relies exclusively on trademark and trade secret protection rather than granted patents. All
              OliSmart ingredients (cassava fiber, chicory inulin, acacia, guar, botanical extracts) are commercially
              available commodity food ingredients. This means a well-funded competitor—such as Coca-Cola, PepsiCo, or a
              private-label entrant—could reverse-engineer an approximation of the blend without IP infringement,
              eroding OLIPOP's formulation edge if brand differentiation weakens.
            calloutType: risk
            claimRefs:
              - CE011
              - CE033
          - type: callout
            title: Active Class Actions & Prop 65 Notices Create Compliance Overhang
            body: >
              Class action lawsuits in New York and California argue that OLIPOP's prebiotic health claims are
              overstated relative to the fiber dose per can (6–9g vs the cited scientific threshold of 12g/day).
              Separately, the Environmental Research Center's 2024 Proposition 65 notices allege lead and mercury
              content in 12 flavors above California safe-harbor limits. These concurrent legal exposures create
              settlement costs, potential label changes, and reputational risk that could constrain marketing spend and
              distribution momentum if they escalate.
