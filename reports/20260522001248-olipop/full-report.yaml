      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: |
              Olipop has raised approximately $195 million in disclosed equity across four priced rounds,
              reaching a $1.85 billion post-money valuation as of February 2025. The company bootstrapped
              from a $100,000 seed derived from the Obi sale before closing its first institutional round,
              a $2.5 million seed, in 2019. A $13 million Series A followed in January 2020 to fund
              national distribution build-out and marketing. The February 2022 Series B raised $39.7
              million and generated significant media attention through a celebrity investor roster
              including Gwyneth Paltrow, Mindy Kaling, Camila Cabello, Priyanka Chopra Jonas, the Jonas
              Brothers (Joe, Nick, Kevin), rapper Logic, and former PepsiCo CEO Indra Nooyi—all
              contributing brand equity and earned media alongside capital.

              The $50 million Series C, announced February 12, 2025, was anchored by J.P. Morgan Private
              Capital's Growth Equity Partners—the $1 billion growth equity arm of the largest U.S.
              bank—marking a structural transition from consumer venture and celebrity capital toward
              institutional-grade investors. J.P. Morgan's Christopher Dawe joined the board as part of
              this transaction. CEO Goodwin has publicly stated that this will be the company's last
              anticipated equity round, though no IPO or acquisition timeline has been confirmed. Olipop
              was previously valued at approximately $200 million in the 2022 Series B.
