        - Track price elasticity by channel; assess shelf-stable SKU performance vs. refrigerated at mass retail
      - - Convenience store channel underpenetration (~0% systematic coverage vs. legacy CSD ~100%)
        - Tailwind / opportunity
        - Near-term / 2025–2026
        - Significant white-space; shelf-stable format enables ambient convenience shelving; Mel Landis mandate
        - Request door count and velocity metrics for convenience vs. grocery channels; assess DSD coverage
