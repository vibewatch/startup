chapter:
  number: 8
  title: Valuation
  summary: >
    Olipop's February 2025 $1.85 billion post-money Series C valuation implies approximately
    4.6× trailing FY2024 revenue of $400 million — a defensible but not cheap entry for a
    profitable, fast-growing CPG challenger in a high-hype functional beverage category.
    Triangulating against PepsiCo's $1.95 billion Poppi acquisition (a significantly higher
    implied revenue multiple given Poppi's smaller revenue base), depressed public comparables
    (Zevia trading at <1× EV/revenue with declining sales), and mid-range functional beverage
    peers (Celsius at 4.5–5.3×), the multiple is justified at current growth rates but
    vulnerable to any revenue deceleration. The May 2026 Axios report that Olipop is raising
    a further $200 million — a pivot after strategic M&A talks stalled with Coca-Cola and Red
    Bull — introduces fresh uncertainty over exit timing, preference overhang, and buyer
    universe. The probability-weighted expected return across bull/base/bear scenarios is
    approximately 1.0–1.3× the entry valuation — positive but insufficient for standard
    venture hurdle rates under current conditions. Recommendation: track, with a path to
    buy if the $200 million round prices at a material discount to $1.85 billion, if
    litigation exposure is resolved, or if a credible acquirer emerges.

sections:
  - id: valuation-context-and-entry-discipline
    title: Valuation Context and Entry Discipline
    body: |
      Olipop closed its Series C in February 2025: $50 million raised at a $1.85 billion
      post-money valuation, led by J.P. Morgan Private Capital's Growth Equity Partners. At
      $400 million in FY2024 net revenue — representing 100% year-over-year growth from $200
      million in FY2023 — the implied EV/Revenue multiple is approximately 4.6× trailing
      revenue. On a forward basis, assuming FY2025 revenue of $450–500 million consistent
      with Bloomberg reporting and management guidance, the forward multiple compresses to
      roughly 3.7–4.1×. These figures sit in the middle of the functional beverage valuation
      spectrum: above mature large-cap soda incumbents (PepsiCo at approximately 2.7×
      EV/Revenue; Keurig Dr Pepper at approximately 3.3×) and at or below high-growth
      functional beverage comps (Monster Beverage at approximately 8.8×; Celsius Holdings at
      4.5–5.3×; Vita Coco at approximately 5.1×). Zevia PBC (NYSE: ZVIA) — the only
      publicly traded specialty functional soda comparable — trades at a drastically
      compressed approximately 0.73× EV/Revenue, reflecting declining revenue (down 6.8%
      YoY in FY2024 to $155 million), ongoing net losses ($23.8 million in FY2024), and
      investor confidence erosion. Zevia is a cautionary data point, not a peer anchor:
      Olipop is growing at more than 10× Zevia's revenue trajectory with a demonstrated
      path to profitability.

      The strategic M&A precedent set by PepsiCo's $1.95 billion acquisition of Poppi is
      the single most relevant data point in Olipop's valuation debate. PepsiCo announced
      the Poppi acquisition in February 2025, completing it in May 2025 at a net purchase
      price of approximately $1.65 billion after $300 million in anticipated cash tax
      benefits. Poppi's revenue base at acquisition was substantially smaller than Olipop's
      $400 million, implying that PepsiCo paid a significantly higher EV/Revenue multiple
      for Poppi than Olipop's 4.6× private market mark — a fact that is simultaneously
      bullish for Olipop's strategic value and adverse for post-Poppi buyer availability.
      PepsiCo, having closed Poppi in May 2025, is now in integration mode and unlikely to
      pursue another functional soda acquisition in the near term. Coca-Cola launched its
      own prebiotic soda brand (Simply Pop) in February 2025, reducing its strategic need
      to acquire Olipop rather than build organically. Keurig Dr Pepper has not publicly
      indicated category-level acquisition interest at these multiples.

      CEO Ben Goodwin's February 2025 statement that the Series C represents Olipop's
      "final anticipated round of equity financing" has been materially qualified by the
      May 2026 Axios report that Olipop is planning to raise more than $200 million in new
      capital, with Morgan Stanley advising, following strategic deal talks that stalled in
      2025. This pivot represents an adverse signal for investors who underwrote the $1.85
      billion valuation on the expectation of a near-term M&A exit: the buyer universe has
      narrowed, exit timeline has extended, and additional capital creates fresh dilution
      risk. The new round's valuation has not been publicly disclosed; if priced at or
      below $1.85 billion, it would constitute a formal down round and reset the private
      market valuation anchor.
