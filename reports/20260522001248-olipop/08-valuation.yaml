  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >
        CPA-audited income statement disclosing gross margin by channel, EBITDA before and
        after stock-based compensation, and operating cash flow for FY2024 and FY2025.
      whyItMatters: >
        Without gross margin, EV/EBITDA and EV/gross-profit multiples — which are far more
        discriminating than EV/Revenue — cannot be computed. A 35% versus 50% gross margin
        implies fundamentally different terminal values and justifies materially different
        multiples. The EV/gross profit comparison to Zevia (46.4% gross margin) and functional
        beverage peers is blocked, leaving the analysis relying on EV/Revenue alone.
      diligencePath: >
        Request audited or reviewed financials in the data room as part of the pending $200M
        raise process; obtain management presentation from Morgan Stanley; engage Series C
        investors for financial disclosure.
      relatedQuestionRefs:
        - QV009
        - QV028
        - QV032
      relatedTableRefs:
        - TV006

    - type: missing-source
      severity: material
      topic: new-capital-raise
      missingEvidence: >
        Post-money valuation, liquidation preference terms, anti-dilution provisions, and
        investor lineup for the pending $200 million round reported by Axios in May 2026.
      whyItMatters: >
        The valuation at which the new round closes is the most consequential near-term
        signal for whether the $1.85 billion mark is holding, compressing (down round), or
        expanding. It directly determines whether existing Series C investors are underwater
        or in the money and recalibrates all scenario probability weights.
      diligencePath: >
        Monitor Axios Pro, BevNET, and Bloomberg for deal closing announcements; engage
        Morgan Stanley's sell-side team as a prospective investor; monitor GlobeNewswire for
        official company press release upon closing.
      relatedQuestionRefs:
        - QV024
        - QV029
      relatedTableRefs:
        - TV006

    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: >
        Private M&A transaction multiples for comparable prebiotic and functional beverage
        brands beyond Poppi; secondary market transaction prices for Olipop equity; and
        forward EV/Revenue multiples for international beverage strategics (Suntory, Asahi,
        Kirin, Nestlé) that could be potential Olipop acquirers.
      whyItMatters: >
        The comparable set is limited to publicly traded U.S. beverage companies and the
        Poppi M&A precedent. A broader set of private market comps and international
        strategic acquirer multiples would sharpen the exit valuation range and the
        probability-weighted return model.
      diligencePath: >
        Review PitchBook / Preqin for private beverage M&A transactions with disclosed
        multiples; consult investment bank precedent transaction databases; monitor
        international food and beverage M&A announcements.
      relatedQuestionRefs:
        - QV008
      relatedTableRefs:
        - TV004

    - type: private-evidence-only
      severity: material
      topic: litigation
      missingEvidence: >
        Filed class action complaint, discovery record, any settlement discussions initiated,
        and any legal reserve established by Olipop in its management accounts.
      whyItMatters: >
        The Poppi $8.9 million settlement establishes a directional benchmark, but Olipop's
        specific exposure depends on its own scientific record, the strength of its fiber
        sourcing documentation, and the number of participating plaintiffs. A settlement
        could range from nominal to tens of millions of dollars and would be a material
        cash event for a company not yet generating substantial free cash flow.
      diligencePath: >
        Court docket review of the filed action; request legal reserve disclosure from
        company counsel; monitor class action aggregator sites for settlement progress.
      relatedQuestionRefs:
        - QV014
      relatedTableRefs:
        - TV006

