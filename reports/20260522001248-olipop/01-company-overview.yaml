  - id: revenue-scale-distribution
    title: Revenue, Scale, and Distribution
    body: |
      Olipop's revenue trajectory ranks among the fastest on record for a modern consumer packaged
      goods brand. Starting from $852,000 in its launch year, the company reached $73.4 million
      in 2022—a 223% year-over-year increase—then crossed $100 million in gross revenue in the
      first half of 2023 alone, finishing that year at approximately $200 million. In 2024,
      revenue doubled again to $400 million while the company achieved profitability for the first
      time; BevNet, citing SPINS data, reported $470 million in 2024 retail sales. As of early
      2025, Olipop held a position as the top single-serve non-alcoholic beverage brand by dollar
      and unit growth contribution (Circana and SPINS, 52 weeks ending December 1, 2024, excluding
      private label). Together with competitor Poppi, the two brands generated close to $900
      million in non-foodservice retail revenue in 2024.

      The company claims approximately 20% U.S. household penetration and approximately 60% share
      of the prebiotic/functional soda segment. Roughly half of its growth comes from consumers
      switching away from legacy carbonated soft drink brands, with the remainder attributable to
      new category entrants. Distribution spans 50,000 to 65,000 doors, including Walmart, Target,
      Kroger, Costco, Whole Foods Market, Starbucks, Albertsons, H-E-B, Sam's Club, Publix, CVS,
      Wawa, and major convenience chains including 7-Eleven and Circle K. Olipop also operates a
      direct-to-consumer subscription program (Olishop) offering 15% subscriber discounts and
      free shipping within the contiguous United States.
