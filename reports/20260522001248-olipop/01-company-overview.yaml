  name: OLIPOP

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Olipop (OLIPOP PBC) is an Oakland-based prebiotic soda company founded in 2018 by CEO Ben
    Goodwin and co-founder David Lester. As of February 2025 it holds a $1.85 billion valuation
    after a $50 million Series C led by J.P. Morgan, with $400 million in 2024 revenue and
    first-time profitability. The brand is distributed in 50,000–65,000 U.S. retail locations
    and faces class action litigation challenging its prebiotic health benefit claims.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: |
      Olipop, Inc. (trading as OLIPOP PBC) is a prebiotic soft drink company headquartered in
      Oakland, California, incorporated as a Public Benefit Corporation and Certified B Corporation
      (B Impact Score: 91.0, achieved July 2023). Founded in 2018 by Ben Goodwin and David Lester,
      the company manufactures a line of functional sodas whose core innovation is the proprietary
      OLISMART fiber blend—a combination of chicory root inulin, cassava root fiber, Jerusalem
      artichoke inulin, nopal cactus, and botanical extracts. Each refrigerated can delivers nine
      grams of prebiotic fiber with only two to five grams of sugar and fewer than fifty calories,
      positioning Olipop as a nutritional upgrade over legacy carbonated soft drinks averaging
      roughly thirty-nine grams of sugar per can. A shelf-stable line with six grams of fiber per
      can (using acacia and guar fiber) was launched in August 2024, substantially broadening the
      company's addressable retail footprint to include warm soda aisles and convenience channels
      that require ambient storage. The brand name is a portmanteau of "oligosaccharide"—the
      prebiotic fiber class anchoring the formula—and "pop," a regional American term for soda.
      As of early 2026, Olipop operates as a late-stage private company with a $1.85 billion
      valuation and a distribution footprint of 50,000 to 65,000 retail doors across the
      United States.
