  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: |
      Ben Goodwin, CEO and chief formulator, is the primary product-science driver of Olipop.
      Goodwin left the University of California Santa Cruz in 2005 to join a kombucha startup,
      subsequently spending approximately $300,000 of personal savings developing a gut-health
      beverage concept in a makeshift backyard lab alongside a microbiologist. He and David Lester
      partnered in 2013 after being introduced through Lester's former boss at Diageo, co-founded
      the probiotic soda company Obi, and sold Obi in 2016 to pivot to the prebiotic formulation
      that became Olipop. Lester, who brought marketing and commercial discipline from Diageo, was
      the go-to-market co-architect of Olipop's early years but transitioned from an operational
      role to a board advisory position in February 2025, concurrent with the Series C close.

      His successor as president is Melvin "Mel" Landis, appointed in February 2025 following an
      eighteen-month strategic advisory engagement. Landis is a 36-year veteran of the Coca-Cola
      system who previously served as Chief Commercial Officer of BodyArmor and held senior roles
      at Kraft General Foods; his mandate is operational scaling, convenience-channel expansion,
      and international readiness. Christopher Dawe, Managing Partner of J.P. Morgan Growth Equity
      Partners, joined the board as part of the Series C transaction. Olipop's broader leadership
      also includes a CFO, Chief People Officer, and General Counsel, though these roles have not
      been publicly detailed at the same depth. The company maintains a fully remote workforce of
      approximately 373 employees as of August 2025.
