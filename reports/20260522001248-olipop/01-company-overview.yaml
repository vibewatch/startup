  - id: milestones-and-adverse-events
    title: Milestones and Adverse Events
    body: |
      Olipop's public record spans a steady ascent from a two-person startup to a unicorn consumer
      packaged goods company, but it is punctuated by meaningful legal and reputational risks. On
      the adverse side, a class action lawsuit filed in 2025 alleges that Olipop's prebiotic sodas
      are falsely marketed, with plaintiffs arguing that six to nine grams of prebiotic fiber per
      can—typically the content of one or two cans—falls below the twelve grams per day threshold
      cited by some nutrition researchers as necessary for measurable gut health effects. Plaintiffs
      further contend that the added sugar in two cans per day could negate any potential fiber
      benefit, characterizing the product as "sugared water." The Washington Post reported in 2023
      that nutrition experts were broadly skeptical of prebiotic soda health claims, a concern that
      predated and contextualizes the litigation. A related trademark action was filed in 2025 when
      Olipop sued snack brand Nutruit for using the "Olipop" name on olive products.

      These legal risks are material for a brand whose premium price point (approximately $3–4 per
      can at retail) is substantially underwritten by functional health positioning. Despite these
      headwinds, Olipop declined acquisition approaches from both Coca-Cola and PepsiCo; PepsiCo
      subsequently acquired Olipop's principal competitor Poppi, a market signal widely interpreted
      as validation that functional soda represents a durable category shift. In 2026, Olipop
      partnered with supplement brand Grüns on a limited-edition Strawberry Vanilla Superfoods
      Greens Gummies product, extending the brand into adjacent wellness formats for the first time.
