          - type: callout
            title: 动销优先的增长模型
            body: >-
              OLIPOP 决定优先提高单店收入，而不是单纯扩大门店数——仅用 28,000 家门店就做到 $200M——是教科书式的动销优先 CPG
              策略。它创造真正的零售商拉力（买手因产品卖得动而补货），而不是推力（销售人员推动上架但未必卖穿）。这个模型结构上健康，但也意味着关键账户一旦持续动销下滑，就可能迅速触发货架空间削减；如果消费者需求走弱，下行风险会被放大。
