      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Ben Goodwin 在 OLIPOP 承担异常集中的角色：同时是联合创始人、CEO、首席产品配方师和主要公众品牌发言人。每一种 Olipop 口味都由 Goodwin
              亲自配方，品牌的科学定位、OliSmart 混合物叙事和益生元功效可信度都直接来自他的专业能力和公众身份。这是即便在创始人主导的 CPG 公司中也少见的关键人依赖，因为风险同时覆盖运营 IP（配方
              know-how）和声誉资本（品牌真实性与创始人故事绑定）。2025 年，Olipop 招募 The Coca-Cola Company 和 The Clorox Company 老将 Melvin Landis
              担任总裁，补充机构化运营深度。联合创始人 David Lester 转为顾问角色，使治理超越创始双人组并更制度化。这些动作降低了运营集中度，但没有完全解决配方 IP 托管或 Goodwin
              对品牌身份的依赖。从创始人主导、运营较非正式的团队，过渡到收入 $500 M+ 的制度化业务，是一个关键拐点；CPG 公司在这个阶段常见招错人、文化稀释和运营断裂。
