      - number: '8.5'
        title: 图表资料
        blocks:
          - type: callout
            title: 建议——观察
            body: >
              Olipop 以 FY2024 过去收入 4.6× 获得 $1.85 billion 估值，作为品类领先、 已盈利且快速增长的 CPG 品牌可以自洽，但反向信号累积还不足以支持立即部署资本。
              并购谈判停滞、转向新的 $200 million 融资、集体诉讼未决、战略买方范围收窄，合在一起 支撑耐心观察立场。转为买入需要满足：新一轮以等于或高于 $1.85 billion 的估值完成，
              且条款有利；或可信战略买方确认以溢价收购的兴趣；或 FY2025 收入确认超过 $500 million， 且盈利能力持续。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV009
              - CV043
          - type: callout
            title: 品类热度风险与倍数压缩
            body: >
              PepsiCo 收购 Poppi、Coca-Cola 推出 Simply Pop，验证了益生元汽水品类， 但同两件事也给 Olipop 的动销和利润率带来最强竞争威胁。存量 CPG 公司能够长期维持促销定价，
              投入贸易营销预算，并以 Olipop 无法匹配的规模谈判货架空间。若品类增长见顶——就像康普茶在 第一波健康趋势爆发后那样——而 Zevia 低于 1× EV/Revenue 的轨迹成为相关可比， $1.85
              billion 标记将结构性偏高。投资者应每月跟踪 SPINS 数据中 Walmart、Target 和 Kroger 的单店动销趋势。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV027
              - CV029
              - CV036
          - type: callout
            title: Poppi 先例同时利好也不利
            body: >
              PepsiCo 以 $1.95 billion 收购 Poppi，隐含 EV/Revenue 倍数高于 Olipop 自身私募市场价格， 验证了该品类的战略价值远高于 Olipop 当前标记。该交易构成
              Olipop 最强的乐观论据：如果 Olipop 增长到 Poppi 的规模，且战略买方出现，退出估值可能显著高于 $1.85 billion。但 PepsiCo 已不再是买方，Coca-Cola
              正在自建，据报道与其他方的谈判也已停滞——因此 Poppi 先例 虽然方向上有利，却不能保证 Olipop 近期能以溢价估值找到收购方。
            calloutType: insight
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV020
              - CV044
          - type: callout
            title: 收入增长可持续性是核心承销假设
            body: >
              所有回报情景都取决于 Olipop 能否在 $400 million FY2024 基数上维持有意义的收入增长， 同时保持盈利。FY2024 实现 100%
              同比增长，几乎不可能在规模化后重复——基数已扩大到四倍， 竞争也更激烈。基准情景的核心假设是 FY2025 增长 12–25%（至 $450–500 million）。 投资者应把任何前瞻收入说法当作假设，并用
              2026 年 Q1–Q2 SPINS 零售扫描数据验证； 这些数据能在公司控制的年度披露前，提供全年表现的领先指标。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV024
              - CV025
              - CV036
