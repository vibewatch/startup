      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: |
              Poppi（PepsiCo）：Stephen 和 Allison Ellsworth 于 2018 年在 Texas 州 Austin 创立。
              Poppi 以苹果醋、agave inulin（每罐 2g）和果汁搭建品牌，每份最多 5g 糖。Poppi 收入
              从 2020 年 $13 million 增至 2024 年估计 $500 million；在 PepsiCo 收购完成前，已在
              36,000+ 零售点取得约 19% 美国益生元汽水市场份额。PepsiCo 支付总价 $1.95 billion
              （扣除预期 $300 million 现金税务收益后净价 $1.65 billion），另有基于业绩的补价安排。
              该品牌带来 PepsiCo 的全球分销基础设施、营销预算和与美国每个主要零售商的关系。Poppi
              的显著负债，是一起因每罐益生元剂量不足而达成的 $8.9 million 虚假广告集体诉讼和解
              （2026 年 4 月最终批准）——该先例直接牵连 Olipop 自身未决诉讼。

              Simply Pop（Coca-Cola）：2025 年 2 月在 Simply 品牌下推出，首发五种偏水果口味。
              每个 12-oz 细罐含 6g 益生元纤维、维生素 C 和锌，含 25–30% 真实果汁，无添加糖，
              建议零售价 $2.49。Coca-Cola 发现该品类市场渗透率仅约 20%，因此选择自建而非收购，
              借助 Simply 二十多年品牌资产及其在 Z 世代消费者中的认知。Simply Pop 最初区域性上市
              （西海岸和东南部），计划 2025 年全国扩张。营销策略优先数字和体验，面向
              Z 世代和千禧一代，用达人活动和 Dear Media 播客巡回触达。

              Culture Pop Soda：Tom First 于 2020 年在 Massachusetts 州 Cambridge 创立。已披露
              融资 $36.2 million，包括 2025 年 3 月由 Enlightened Hospitality Investments 支持的
              Series B。Culture Pop 定位为互联网优先、DTC 导向品牌，团队很小（2024 年中约
              15 名员工），聚焦天然杂货和专业零售。收入未披露，估计远低于 $50 million。

              SunSip（Health-Ade）：由 2012 年以来领先康普茶品牌之一 Health-Ade 于 2024 年 2 月
              推出。SunSip 最初为 Whole Foods 独家，之后扩张。产品避免使用 stevia（与部分竞争者
              区分开），改用真实果汁、有机蔗糖和罗汉果增甜。每罐含维生素 C、B6、B12、锌和硒，
              同时含益生元纤维。SunSip 受益于 Health-Ade 既有供应链和零售商关系，相比完全独立
              新进入者，货架扩张时间线更快。

              Zevia：一家上市（NYSE：ZVIA）的零糖、甜叶菊增甜汽水，不做益生元声称。Zevia 报告
              2024 年净销售额 $155.0 million（较 2023 年 $166.4 million 下滑 6.8%），2025 年恢复至
              $161.3 million（同比增长 4.0%）。毛利率从 2024 年 46.4% 提升至 2025 年 48.0%，但公司
              仍亏损（2025 年净亏损 $11.2 million）。Zevia 争夺注重热量消费者的注意力，但不直接
              切入肠道健康定位。
