      - number: '1.4'
        title: 收入、规模与分销
        blocks:
          - type: paragraph
            body: |
              Olipop 的收入曲线在现代 CPG 品牌中属于少见的高速增长。从上市当年 $852,000 收入
              起步，公司 2022 年做到 $73.4 million，同比增长 223%；仅 2023 年上半年，毛收入就
              突破 $100 million，全年约 $200 million。2024 年收入再次翻倍至 $400 million，同时
              首次实现盈利；BevNet 援引 SPINS 数据称，2024 年零售销售额为 $470 million。截至
              2025 年初，按美元和销量增长贡献计算，Olipop 已是排名第一的单份非酒精饮料品牌
              （Circana 和 SPINS，截至 2024 年 12 月 1 日的 52 周，不含自有品牌）。Olipop 与
              竞争对手 Poppi 合计，在 2024 年贡献接近 $900 million 的非餐饮零售收入。

              公司称其美国住户渗透率约 20%，在益生元 / 功能性汽水细分中份额约 60%。大约一半
              增长来自消费者从传统碳酸软饮品牌转向 Olipop，其余来自新进入品类的消费者。分销
              覆盖 50,000–65,000 个门店，包括 Walmart、Target、Kroger、Costco、Whole Foods
              Market、Starbucks、Albertsons、H-E-B、Sam's Club、Publix、CVS、Wawa，以及
              7-Eleven、Circle K 等主要便利店连锁。Olipop 还运营直接面向消费者的订阅项目
              Olishop，向订阅用户提供 15% 折扣，并在美国本土连续州免运费。
