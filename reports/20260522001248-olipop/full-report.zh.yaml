      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 大型饮料公司验证品类，但竞争同步加剧
            body: >-
              PepsiCo 以 $1.95 billion 收购 Poppi，Coca-Cola 又在 2025 年初两个月内自建推出 Simply
              Pop，这是益生元汽水不是短暂潮流、而是耐久品类的最强外部验证。仅这两步动作就代表超过 $2 billion 的承诺资本，也表明两家既有巨头都把该品类视为核心战略支柱。Olipop
              一边收获造市场事件（会推动大众消费者试用「功能性汽水」概念），一边面对竞争威胁：Coke 和 PepsiCo 的分销网络覆盖美国 500,000+ 网点，Olipop 约为 50,000。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM031
              - CM032
          - type: callout
            title: 科学质疑与健康声称诉讼制造溢价风险
            body: >-
              溢价定价模型（$2.49/罐 vs. 传统 CSD 约 $0.50–$1.00）高度依赖消费者相信其功能性健康益处。独立营养科学家（Caitlin Dow、CSPI）已公开质疑每罐 6–9
              克益生元纤维是否足以带来实质性肠道健康益处，2025 年集体诉讼也直接挑战 Olipop 的健康营销声称。如果健康益处感知被削弱——无论来自不利诉讼结果、FDA
              执法，还是持续积累的科学质疑共识——溢价理由都会变弱，品牌就只能靠口味和定位，与拥有巨大成本优势的 Coke 和 Pepsi 竞争。
