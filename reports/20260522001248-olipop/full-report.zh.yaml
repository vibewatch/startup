      - number: '6.3'
        title: 具名合作伙伴与客户验证
        blocks:
          - type: paragraph
            body: >
              OLIPOP 的零售合作关系提供了具体、公开可验证的规模化上架证据。最有说服力的动销证据是根汁汽水货架里程碑：2023 年 2 月，在一家未具名美国大型零售商处，OLIPOP 根汁汽水取代 Keurig Dr
              Pepper 旗下 A&W，成为最畅销根汁汽水——这是鲜明的消费者背书，Ben Goodwin 称其可能成为其他口味的模板。


              Costco 在 2026 年春季限量组合装中加入 OLIPOP——15 罐售价 $19.99，约 $1.33/罐——同时验证了品牌在会员仓储渠道的接受度，以及消费者囤货购买意愿。Costco 对 SKU
              筛选出了名挑剔，因此这一上架是有意义的质量信号；Parade 文章称 Costco 购物者「跑着」去买新组合装，暗示冲动购买转化强劲。


              在 Amazon 上，截至 2025 年初，OLIPOP 累计 298,024 条客户评价，平均评分 4.33。MetricsCart 的 Amazon 分析（2025 年 2 月 4–18
              日）发现，OLIPOP 每月销售约 1.55 million 件，最畅销产品包括 Vintage Cola、Cream Soda Pantry Pack 和 Strawberry Vanilla
              Sparkling Tonic。单罐销售表现强劲，说明 OLIPOP 的 Amazon 买家是试用和复购买家，而不只是追求组合新鲜感的购物者。


              独立食品评测媒体 Sporked 报告称，截至 2026 年 5 月已品尝全部 17 种 OLIPOP 口味，并发布详细评估，把该品牌定位为益生元汽水潮流的开创者。健康与营养评测平台 Wellnesspulse
              推荐 OLIPOP 作为消费者减少摄糖的合理选择，同时提示菊粉纤维带来的消化不适确实是部分用户的真实不良反应风险。


              OLIPOP 进入 Starbucks 完成了渠道验证：一个消费品品牌要获得货架位置，必须通过 Starbucks 的品牌契合和质量标准。Groupon 的 Where-to-Buy
              指南确认，大多数主要零售商的单罐价格为 $2–$3，与溢价定位策略一致。
            claimRefs:
              - CU014
