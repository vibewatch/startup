      - number: '1.5'
        title: 里程碑与不利事件
        blocks:
          - type: paragraph
            body: |
              Olipop 的公开记录，是一家双人初创公司稳步爬升为独角兽 CPG 公司的过程；但其中也
              穿插着实质性法律和声誉风险。不利面上，2025 年提起的一起集体诉讼指控 Olipop 的
              益生元汽水存在虚假营销。原告认为，每罐 6–9 克益生元纤维——通常也就是一到两罐的
              含量——低于部分营养研究人员称产生可测量肠道健康效果所需的每日 12 克门槛。原告还
              主张，每天两罐中的添加糖可能抵消任何潜在纤维益处，并把产品描述为「糖水」。The
              Washington Post 在 2023 年报道称，营养专家普遍怀疑益生元汽水的健康声称；该担忧
              早于诉讼出现，也为诉讼提供了背景。2025 年，Olipop 起诉零食品牌 Nutruit 在橄榄产品
              上使用「Olipop」名称，另有一起商标诉讼。

              该品牌零售价约 $3–4 / 罐，溢价高度依赖功能性健康定位，上述法律风险因此
              具有重要性。尽管面临逆风，Olipop 拒绝了 Coca-Cola 和 PepsiCo 的收购接触；之后
              PepsiCo 收购了 Olipop 的主要竞争对手 Poppi，市场广泛解读为功能性汽水代表持久品类
              迁移的验证。2026 年，Olipop 与补剂品牌 Grüns 合作推出限量 Strawberry Vanilla
              Superfoods Greens Gummies，首次把品牌延伸到相邻健康形态。
