      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: |
              Ben Goodwin 是 CEO 兼首席配方师，也是推动 Olipop 产品科学的核心人物。Goodwin
              于 2005 年离开 University of California Santa Cruz，加入一家康普茶初创公司；之后
              他拿出约 $300,000 个人积蓄，与一名微生物学家在后院临时实验室开发肠道健康饮料
              概念。2013 年，经 Lester 在 Diageo 的前老板介绍，他与 David Lester 搭档，联合创立
              益生菌汽水公司 Obi，并在 2016 年出售 Obi，转向后来成为 Olipop 的益生元配方。
              Lester 带来 Diageo 的营销和商业纪律，是 Olipop 早期商业化路径的共同设计者；
              2025 年 2 月 Series C 完成时，他从运营岗位转为董事会顾问。

              接替 Lester 出任总裁的是 Melvin「Mel」Landis。Landis 在 2025 年 2 月获任命，此前
              已为公司提供 18 个月战略咨询。他在 Coca-Cola 体系工作 36 年，曾任 BodyArmor
              首席商务官，也曾在 Kraft General Foods 担任高级职位；他的职责是
              推动运营扩张、便利店渠道扩张和国际化准备。J.P. Morgan Growth Equity Partners
              管理合伙人 Christopher Dawe 随 Series C 交易加入董事会。Olipop 更广泛的
              管理层还包括 CFO、首席人力官和总法律顾问，但上述职位尚未以同等
              深度公开披露。截至 2025 年 8 月，公司维持全远程团队，约 373 名员工。
