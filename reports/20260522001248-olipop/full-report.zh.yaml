      - number: '4.5'
        title: 不利信号与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              尽管营收端表现强劲，Olipop 仍面临一组反向财务信号，给投资承销增加了复杂度。


              健康声称诉讼风险：Olipop 遭遇一起集体诉讼，原告称其益生元健康声称缺乏足够科学支撑，且每罐益生元纤维含量低于产生有意义肠道健康收益所需的阈值。竞争对手 Poppi（VNGR Beverage LLC）在
              2025–2026 年以 $8.9 million 和解了一起实质上相似的集体诉讼，但未承认不当行为。Poppi 和解在 2026 年 4 月获得法院最终批准，赔付安排持续到 2026 年 7 月。考虑到
              Olipop 声称的结构相似性（功能性纤维、肠道健康定位），Poppi 和解带来直接先例风险。任何重大和解都会减少现金，并带来持续法律费用。


              零售集中风险：Olipop 绝大多数收入来自少数大型零售商。Walmart、Target 或 Costco 一旦下架、动销不达标，或要求更多促销资金，收入可能出现非线性下滑。品牌越依赖大型 CPG
              渠道，零售商议价力越强；在大众市场规模下，渠道促销费用义务会显著侵蚀净利润率。


              无经审计财务报表：Olipop
              是私营公司，没有公开可取得的经审计财务报表。所有收入和盈利声明均由公司自述，未经独立审计师验证。毛利率、EBITDA、现金消耗和资产负债表数据完全没有进入公开记录。这是本章最关键的尽调阻断点：没有完整的经审计数据室，财务结论无法完成。


              估值风险：以 $400 million 的 2024 年收入对应 $1.85 billion 估值（4.6× EV/revenue），Olipop
              对一个成长期品类领导者而言估值合理；但如果收入增速放缓、利润率不及预期，或宏观 / 消费环境转弱，安全边际有限。据报道，公司未达到内部设定的 2024 年 $500 million 收入目标，最终实现 $400
              million。若未来预测持续落空，估值可能受损。
