      - number: '5.4'
        title: 信任、质量与监管合规
        blocks:
          - type: paragraph
            body: >
              OLIPOP 搭建了一套多层质量和认证体系，以其所处阶段的消费包装品牌来看并不常见。它是首个获得 NutraStrong Prebiotic Verified Product Certification
              认证的饮料品牌；该项目由 SGS Nutrasource 与 Global Prebiotic Association 合作运营。NutraStrong 要求第三方验证标签准确性（确认纤维类型和数量）、GMP
              制造标准、经验证的批次检测，以及企业价值观透明度。考虑到正在进行的诉讼，这项认证给出了可信的外部信号：标签标注的纤维量确实是消费者在罐内拿到的量。


              OLIPOP 持有 B Corp 认证（2023 年获得），与其公益公司（PBC）法律结构一致。B Corp 认证要求每两年进行一次重新认证审计，覆盖环境、社会和治理实践。反向看，Environmental
              Research Center 在 2024 年提交了加州 Proposition 65 的 60 天通知，称 12 种 Olipop 口味铅和汞含量高于 Prop 65
              披露阈值。这些通知构成合规缺口，需要独立检测反驳、纠正性标签警示，或谈判和解。另有纽约和加州的活跃集体诉讼称，OLIPOP 的益生元健康声称具有误导性，因为单罐（6–9g
              纤维）低于原告认为产生有意义消化收益所需的每日 12+ 克。FDA 截至 2026 年 5 月未因不安全成分对 OLIPOP 采取任何执法行动；OLIPOP 配料表使用 FDA
              认可的膳食纤维（菊苣菊粉、木薯、阿拉伯胶），给标签上的纤维含量提供了一定监管正当性。
