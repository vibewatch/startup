      - number: '4.6'
        title: 图表
        blocks:
          - type: callout
            title: 异常高的资本效率
            body: >
              Olipop 在 FY2024 收入达到约 $400 million，累计股权融资仅约 $195 million——相当于每 $1 年收入只融资约
              $0.49。对一家需要用股权资金覆盖零售商进场、代工生产、渠道促销和营销的 CPG 饮料公司，这种效率非常突出。FY2024 首次实现盈利，也进一步验证该业务模型能把总收入转化为经营现金，而不需要持续稀释。
            calloutType: strength
            claimRefs:
              - CI001
              - CI011
              - CI027
          - type: callout
            title: 毛利率不透明——没有经审计财务报表
            body: >
              本章所有单位经济模型数据都来自 CPG 行业基准估计，或从上市可比公司 Zevia 推导；没有任何 Olipop 专属的毛利率、COGS 或 EBITDA
              数据公开可得。公司的盈利声明无法独立验证。至少包含两年经审计利润表和当前资产负债表的数据室，是完成任何财务承销前的最低要求。
            calloutType: risk
            claimRefs:
              - CI030
              - CI032
              - CI033
          - type: callout
            title: 健康声称诉讼带来先例风险
            body: >
              针对 Olipop 的集体诉讼称，其益生元健康声称夸大了临床上有意义的肠道健康收益。Poppi 就实质相似声称达成 $8.9 million 和解（2026 年 4
              月获法院最终批准），形成直接先例。类似和解，或长期诉讼成本，都会减少现金、分散管理层注意力，并可能要求重配方或重贴标，进而打断品牌的核心价值主张。
            calloutType: risk
            claimRefs:
              - CI028
              - CI029
          - type: callout
            title: 相对 Poppi 先例的战略收购上行
            body: >
              PepsiCo 收购 Poppi 的隐含收入倍数约为 15–19×，而 Olipop 当前隐含估值约为 FY2024 收入的 4.6×。即便 Olipop
              增速放缓，其私募市场估值与饮料品类领导者的战略收购倍数之间仍有缺口，意味着战略交易存在有意义上行。Coca-Cola 和 PepsiCo 此前都曾接触 Olipop；Series C
              被定位为「最后一轮股权融资」，可能是在为近期战略流程铺路。
            calloutType: insight
