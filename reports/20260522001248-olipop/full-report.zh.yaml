      - number: '5.2'
        title: OliSmart® 配方架构
        blocks:
          - type: paragraph
            body: >
              OliSmart 是 OLIPOP 为其专有益生元纤维和植物提取物混合物注册的商标。该配方与 Purdue University Whistler Center for Carbohydrate Research
              的 Dr. Stephen Lindemann 合作开发；其实验室研究膳食纤维多糖如何调节肠道微生物组。科学前提是，多种纤维来源会喂养不同有益肠道菌种，比单一纤维类型更能支持广泛微生物多样性。


              冷藏线的 OliSmart
              使用三种益生元纤维——木薯根纤维（抗性糊精来源）、菊苣根菊粉和菊芋菊粉——并搭配四种植物提取物：药蜀葵根、金盏花、葛根和仙人掌。常温线改用阿拉伯胶纤维、瓜尔胶纤维和木薯根纤维，同时保留全部四种植物成分。两种混合物都用甜菊糖和阿洛酮糖替代蔗糖，每罐约
              35–45 卡路里。重要的是，截至 2026 年 5 月，公开信息中尚未发现 OliSmart 配方获得美国授权专利；公司依赖商标注册和商业秘密保护，而不是专利排他性。这是有意义的 IP
              护城河限制：OliSmart 的每一种成分都是商业上可获得的大宗食品配料，资源充足的竞争对手可以在不侵犯任何专利的情况下近似复制该混合物。


              OLIPOP 资助了一项现实世界临床试点研究，并在 2025 年 4 月以 MedRxiv 预印本发表，比较 OLIPOP Vintage Cola
              与一款领先传统可乐对健康成人餐后血糖的影响。结果显示，在空腹和进食两种状态下，OLIPOP 引起的血糖上升都更慢、更低。不过，该研究由 OLIPOP 自行资助，营养监督平台 Food Politics
              特别指出这会引发行业偏见担忧。因此，临床证据基础仍停留在试点规模；截至本报告运行日，尚无独立资助的长期随机对照试验（RCT）发表。
