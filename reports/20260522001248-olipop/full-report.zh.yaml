  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: |
              Olipop 于 2025 年 2 月完成 Series C：融资 $50 million，投后估值
              $1.85 billion，由 J.P. Morgan Private Capital 的 Growth Equity Partners
              领投。公司 FY2024 净收入 $400 million，较 FY2023 的 $200 million
              同比增长 100%，隐含 EV/Revenue 倍数约为过去 12 个月收入的 4.6×。
              若按前瞻口径，假设 FY2025 收入为 $450–500 million，与 Bloomberg
              报道和管理层指引一致，倍数压缩至约 3.7–4.1×。这些数字位于功能饮料
              估值谱系中段：高于成熟大盘汽水公司（PepsiCo 约 2.7× EV/Revenue；
              Keurig Dr Pepper 约 3.3×），也等于或低于高增长功能饮料可比公司
              （Monster Beverage 约 8.8×；Celsius Holdings 为 4.5–5.3×；
              Vita Coco 约 5.1×）。Zevia PBC（NYSE: ZVIA）是唯一上市的特色
              功能汽水可比公司，EV/Revenue 约 0.73×，估值被大幅压低，原因是收入下滑
              （FY2024 同比下降 6.8% 至 $155 million）、持续净亏损（FY2024 为
              $23.8 million）以及投资者信心受损。Zevia 是警示数据点，不是同业锚：
              Olipop 的收入轨迹增速超过 Zevia 的 10×，且已跑出盈利路径。

              PepsiCo 以 $1.95 billion 收购 Poppi 这笔战略并购，是 Olipop 估值争论中
              最关键的数据点。PepsiCo 于 2025 年 2 月宣布收购 Poppi，2025 年 5 月完成，
              扣除预计 $300 million 现金税收收益后，净购买价约 $1.65 billion。
              Poppi 被收购时的收入基数明显小于 Olipop 的 $400 million，这意味着
              PepsiCo 支付的 EV/Revenue 倍数显著高于 Olipop 私募市场 4.6× 的估值标记。
              这笔定价既利好 Olipop 的战略价值，也对 Poppi 之后的买方可得性构成反向信号。
              PepsiCo 已在 2025 年 5 月完成 Poppi 交易，目前进入整合阶段，短期内不太可能
              再收购一家功能汽水公司。Coca-Cola 于 2025 年 2 月推出自己的益生元汽水品牌
              Simply Pop，降低了收购 Olipop、而非自主孵化的战略必要性。Keurig Dr Pepper
              尚未公开表示有意在这些倍数上进行品类级收购。

              CEO Ben Goodwin 在 2025 年 2 月称 Series C 是 Olipop「预计最后一轮股权融资」，
              但这句话已被 2026 年 5 月 Axios 的报道实质性修正：Olipop 正计划新融资超过
              $200 million，由 Morgan Stanley 担任顾问，此前 2025 年战略交易谈判停滞。
              按近期并购退出预期承销 $1.85 billion 估值的投资者，会把新融资计划视为反向信号：
              买方范围收窄，退出时间线拉长，新增资本带来新的稀释风险。新一轮估值尚未公开；
              若定价等于或低于 $1.85 billion，将构成正式下轮，并重置私募市场估值锚。
