      - number: '2.2'
        title: 市场规模、估计与矛盾
        blocks:
          - type: paragraph
            body: |
              不同规模测算镜头会给出实质不同的估计，反映出真实存在的边界和方法论分歧。尽调应
              保留这种分歧，而不是把它抹平。最宽的美国 CSD 市场数字——2024 年 $55.2 billion
              （Mintel，经 Beverage Industry 报道）——覆盖消费者 CSD 零售总支出，是 Olipop 在
              很长期限内理论上可争夺的 TAM。Circana 多渠道数据则显示，截至 2025 年 4 月 20 日的
              52 周内，碳酸饮料美元销售额为 $46.1 billion，同比增长 6.2%，销量增长 0.9%；该数据确认
              销量基本持平，收入靠提价和产品组合向高端 / 功能性 SKU 迁移来增长。

              Olipop 最常被引用的 SAM（可服务市场）是美国 BFY / 功能性汽水品类。SPINS 截至
              2024 年 9 月的数据把自然渠道和 MULO 合计规模放在约 $1 billion。Olipop 和 Poppi 在
              这个细分竞争，过去几年该细分增长达到三位数；Coca-Cola 也发现其市场渗透率仅 20%，
              说明仍有大量空间。

              在最窄的益生元专属口径下，各方估计显著分化：Citi 分析师 Falorni 引用的美国零售
              销售额为 $820 million（2025 年初）；Food Ingredients First 引用的 2024 年数字为
              $440 million，似乎采用更窄的美国口径；Persistence Market Research 用极窄定义估计
              2026 年全球市场为 $286.6 million；Market Research Future 估计 2024 年全球益生元汽水
              市场为 $1.46 billion，到 2035 年增至 $5.72 billion（13.18% CAGR）；Emergen Research
              估计 2024 年全球市场为 $1.8 billion，到 2034 年增至 $4.2 billion（8.9% CAGR）。从
              全球 2024 年约 $286 million 到约 $1.8 billion，这个五倍区间直接来自定义差异（只算
              益生元 vs. 广义功能性汽水，美国 vs. 全球），也凸显任何规模结论都必须锚定明确的定义
              和地理范围。

              Olipop 2024 年收入 $400 million，Poppi 2024 年销售额 $500 million，两家公司合计约
              $900 million。考虑两家品牌的零售价格溢价和直接渠道收入，这与整个品类约 $820 million–
              $1 billion 的美国市场级估计相互吻合。Marketing Dive 和 Coca-Cola 内部研究引用了
              到 2032 年全球益生元汽水市场达到 $3.5 billion 的路径，该路径是被引用最广的长期预测。
