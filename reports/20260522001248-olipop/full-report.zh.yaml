      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: |
              品类近期轨迹由强需求拉动和实质性结构约束共同塑造，投资人必须仔细权衡。

              需求侧，远离糖的长期趋势是主导性宏观驱动。按 Gitnux，约 49% 美国成年人至少每周
              偏好零糖饮料，2024 年全球所有软饮新品中 38% 为无糖或低糖。肠道健康养生趋势
              又放大了需求：WHO 称消化系统疾病影响约 40% 全球人口，消费者已以可测量的速度把
              肠道健康意识纳入购买决策——SPINS 数据显示，带消化健康声称的汽水仅在 2023 年就在
              可测渠道实现约 301% 的美元增长。

              2025 年大型饮料公司的验证，可能是最重要的单一市场信号。PepsiCo 以 $1.95 billion
              收购 Poppi，Coca-Cola 在 2025 年 2 月推出 Simply Pop，把一个此前由初创公司主导的
              小众品类，变成两家既有巨头董事会层面的战略重点。该验证有双面性：它确认市场耐久性，
              并带来巨大的分销规模；但它也引入资源充足的竞争者，携既有品牌资产争夺同一批 18–40
              岁人群。

              约束侧，对健康声称有效性的科学怀疑是最实质风险。CSPI 营养科学家 Caitlin Dow 公开
              表示，益生元汽水「比普通汽水好一点」，但她质疑其肠道健康益处：「我们不应指望汽水
              或加工食品来支持肠道健康。」Citi 分析师 Filippo Falorni 警告：「很多新品类在经历
              几年强增长后就熄火了。」挑战 Olipop 健康营销声称的诉讼（2025 年集体诉讼）
              给溢价模型增加了监管和法律风险。溢价定价（每罐 $2.49 vs. 传统 CSD 的 $0.50–$1.00）
              限制大众市场渗透；在食品杂货通胀高企时期，这构成真实的可负担性天花板。

              GLP-1 减重药普及带来间接顺风：CPG 公司正预期 GLP-1 用户会改变饮食偏好，因而把产品
              重做成低糖、高纤维，而 Olipop 天然满足低糖高纤维方向。PepsiCo 在改造产品组合时，也明确
              把 GLP-1 作为收购 Poppi 的战略背景。
