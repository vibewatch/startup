      - number: '6.2'
        title: 零售覆盖与渠道组合
        blocks:
          - type: paragraph
            body: >
              OLIPOP 的增长策略按顺序推进：先在注重健康的早期采用者能接受溢价的天然食品零售商中推出，跑出动销，再进入主流杂货渠道，最终推进到大众市场渠道。到 2026 年 5 月，OLIPOP 官网确认其在全美超过
              65,000 个零售点有售——约为 2023 年 20,000 家门店基础的 3×，对独立饮料品牌而言速度空前。


              具名零售伙伴覆盖每个杂货层级。天然渠道包括 Whole Foods Market 和 Sprouts Farmers Market。主流杂货包括
              Kroger、Albertsons、Safeway、H-E-B、Wegmans、Publix、Meijer 和 The Fresh Market。大众市场和会员仓储零售包括
              Walmart、Target、Costco 和 Sam's Club。药店和便利渠道包括 CVS、Wawa、Casey's、7-Eleven、Circle K、Love's Travel
              Stops、Pilot、ExtraMile 和 Maverik。餐饮服务由 Starbucks 锚定。线上零售通过 Amazon 和 OLIPOP 自有 DTC Olishop 运行。


              渠道组合估计约 80% 或更多来自零售 / 批发，低于 20% 来自 DTC，这已不同于品牌 2018–2020 年 DTC 优先的启动模式。DTC 网站（由 Shopify Plus、ReCharge 和
              Klaviyo 驱动）现在主要承担留存和客户终身价值（LTV）引擎，而不是主要增长渠道。订阅用户每单享 15% 折扣、免运费且无锁定，可选择每 2、4 或 8 周配送。


              OLIPOP 在 2024 年 8 月推出常温货架稳定产品线，使产品能够进入常温汽水货架和无法容纳冷藏产品的便利店冷柜。OLIPOP Minis（7.5 oz）扩展到 Target、Walmart 和
              Amazon，瞄准儿童友好包装规格和外出即饮的冲动购买场景。Instacart 和 Walmart Connect 零售媒体支持季节性促销期间的货架动销。渠道宽度——从天然食品到便利店再到餐饮服务——显示
              OLIPOP 已从健康细分品牌跨过门槛，成为主流汽水竞争者。
