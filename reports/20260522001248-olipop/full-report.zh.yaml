      - number: '8.3'
        title: 情景分析与回报框架
        blocks:
          - type: paragraph
            body: |
              三情景期望值框架锚定回报分析，基准入场价采用 2025 年 2 月 Series C 的
              $1.85 billion 投后估值。优先权悬置：UpsideList 估计，截至 2026 年 3 月，
              普通股之前有 $243 million 清算优先权，约占 $1.85 billion 估值的 13.1%。
              清算优先权对员工股权分析和下行分配评估很重要，但对位于优先股堆叠顶部的 Series C 优先股投资者
              相关性较低。Kalshi/Octagon 预测市场截至 2026 年 5 月的数据给出：Olipop 在
              2027 年 2 月前 IPO 的概率约为 19%，说明战略收购仍是最主要的预期退出路径，近期公开市场
              退出可选性有限。

              乐观情景（UpsideList 分析师模型赋予约 25% 概率，且与本分析一致）：
              Olipop 到 2027–2028 年将收入增长维持在 40–50%，达到 $600–800 million；
              集体诉讼以较小财务影响和解或被驳回；公司由国际饮料集团或美国本土中型战略买方以
              6–8× 收入收购，对应退出估值 $3.6–6.4 billion，较 $1.85 billion 标记实现
              2.0–3.5× 回报。若以相似倍数上市，也会产生类似结果；前提是 Olipop 维持盈利，并达到足够收入规模，
              以获得上市溢价倍数。

              基准情景（赋予约 30% 概率）：FY2025 收入 $450–500 million，2026 年增速放缓至
              20–30%，继续盈利，并在 2027–2028 年以约 4–5× 前瞻收入完成战略收购或可控 IPO。
              对应退出估值 $2.0–2.5 billion，较 $1.85 billion 入场价回报 1.1–1.4×。
              新融资 $200 million 被有效吸收，为战略条件改善争取时间，Series C 标记得到验证而非被打折。

              悲观情景（考虑新出现的反向信号，赋予约 45% 概率）：随着 Simply Pop 和 PepsiCo 体系下的
              Poppi 拿走有意义的货架动销，收入增速急剧降至 20% 以下；集体诉讼以重大成本和解
              （$20–50 million）；$200 million 新融资按低于 $1.85 billion 的价格定价（确认下轮）。
              最终退出按承压的 2–3× 收入倍数发生，对应退出估值 $940 million 至 $1.4 billion，
              较 $1.85 billion 入场价回报 0.5–0.76×。UpsideList 的独立模型把这一悲观情景
              退出底部放在约 $760 million。悲观情景获得最高概率，是因为并购谈判停滞和转向新融资都是
              新鲜反向信号，相比 2026 年前的评估提高了其权重。

              各情景的概率加权预期回报约为 $1.85 billion 入场价的 1.0–1.3×，上行可选性有意义，
              但被较高的悲观情景概率抵消。期望值为正，却低于标准风险投资或成长股权门槛
              （流动性较差的私募股权在 3–5 年期限内通常要求 3× 或更高）。估值立场是合理：
              尚未贵到可以坚定回避，但也不便宜到无需额外催化剂就部署资本。最强的上调催化剂将是：
              确认 $200 million 融资以等于或高于 $1.85 billion 完成且条款有利；诉讼敞口解决；
              或 FY2025 收入显著高于 $500 million 的证据。
