      - number: '7.2'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              2025 年，大型汽水在位者入场后，OLIPOP 的竞争环境急剧变化。PepsiCo 在 2025 年以约 $1.95 billion 完成对 Poppi 的收购，使 Poppi 获得 PepsiCo
              全球直送到店（DSD）分销网络、促销预算和既有零售商关系。Coca-Cola 同期推出 Simply Pop，这是一款每罐含 6 g 纤维、无添加糖、25-30% 真果汁，并强化维生素 C 和锌的益生元汽水，借助
              Simply 品牌的大众零售覆盖。两家在位者都与 Walmart、Target 和 Kroger 拥有联合营销协议和促销津贴，Olipop
              无法匹配。零售商按动销和促销支持分配货架陈列面；一个由大型汽水公司支持、价格相当或更低的替代品，会让 Olipop 面临不对称的 SKU 精简风险。益生元汽水品类从 2020 年约 $197 million
              增长到 2024 年 $440 million，但 Olipop 在这个增长品类中的份额如今正被拥有结构性分销优势的在位者争夺。Olipop 分布在约 50,000 个美国零售点，主要集中于
              Walmart、Target、Kroger 和 Costco——这种渠道组合使任何一家大型零售商决定减少 Olipop 陈列面，都会立即对收入形成重大影响。
