    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: |
              Olipop, Inc.（以 OLIPOP PBC 名义经营）是一家益生元软饮公司，总部位于
              California 州 Oakland，注册为 Public Benefit Corporation，并获得 Certified B
              Corporation 认证（B Impact Score：91.0，2023 年 7 月取得）。Ben Goodwin 和 David
              Lester 于 2018 年创立公司。Olipop 生产一系列功能性汽水，核心创新是专有
              OLISMART 纤维配方——把菊苣根菊粉、木薯根纤维、Jerusalem artichoke 菊粉、
              nopal cactus 和植物提取物组合在一起。每罐冷藏产品含 9 克益生元纤维，糖分仅
              2–5 克，热量低于 50 卡；相比每罐平均约 39 克糖的传统碳酸软饮，Olipop 把自己
              做成营养升级选项。2024 年 8 月，公司推出每罐 6 克纤维的常温系列（使用 acacia
              和 guar fiber），显著拓宽可进入的零售货架，覆盖需要常温储存的常温汽水货架和
              便利店渠道。品牌名由「oligosaccharide」——支撑配方的益生元纤维类别——和
              「pop」（美国部分地区对汽水的叫法）拼合而成。截至 2026 年初，Olipop 是一家后期
              私营公司，估值 $1.85 billion，在美国铺设 50,000–65,000 个零售门店。
