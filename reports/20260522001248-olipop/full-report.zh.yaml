  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: |
              给 Olipop 做市场规模测算前，必须先精确定义它所在的嵌套品类。最宽口径是美国整体
              碳酸软饮（CSD）市场，Mintel 估计 2024 年规模为 $55.2 billion——这是 Olipop 最终
              通过替代所争夺的消费者汽水支出池。其中，「更健康」（BFY）和功能性
              汽水细分——低糖、含益生元 / 益生菌 / 适应原 / 维生素等功能性成分、主打清洁标签
              定位的饮料——在截至 2024 年 9 月的 52 周内，于 SPINS Natural 和 Multi-Outlet
              （MULO）渠道合计达到约 $1 billion 零售销售额。

              最窄、也最贴近 Olipop 的口径，是益生元 / 益生菌汽水子细分。Fortune（2025 年 2 月）
              援引 Citi 首席饮料分析师 Filippo Falorni 的估计称，截至 2025 年初，美国益生元汽水
              市场零售销售额约 $820 million，约占 $42.4 billion 美国软饮市场的 2%。Food Ingredients
              First 的历史规模数据称，按更窄产品口径，市场从 2020 年 $197 million 增至 2024 年
              $440 million，显示边界选择会实质影响被引用的市场规模。

              Olipop 的主要现状替代品包括传统碳酸软饮（Coca-Cola、Pepsi、Dr Pepper、Sprite）。
              传统品牌拥有 97% 的美国住户渗透率，仍是既有支出池。次级替代品包括气泡水（LaCroix、
              Bubly、Waterloo）、康普茶、能量饮料（Red Bull、Monster）、运动饮料（Gatorade、
              Bodyarmor）和果汁产品。肠道健康补剂品类（胶囊、软糖、粉剂）用不同形态和渠道满足
              相似消费者需求；按 Grand View Research，2025 年全球该市场规模为 $19.98 billion。

              Olipop 已识别的相邻扩张机会包括餐饮服务（咖啡馆、休闲快餐餐厅）、便利店和国际
              市场。2024 年 8 月推出的 6g 纤维常温系列，扩大了公司可进入的渠道版图，把此前几乎
              完全由传统 CSD 品牌占据的常温便利店和会员仓储渠道纳入范围。
