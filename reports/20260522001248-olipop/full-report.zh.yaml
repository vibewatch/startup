            title: 集体诉讼与定价反弹
            body: >-
              2026 年 1 月的集体诉讼指控 OLIPOP 的益生元健康声称具有欺骗性，并称消费者为没有获得的收益多支付了 200–500%；这对支撑 OLIPOP
              溢价定价的健康动机购买触发点构成重大威胁。如果诉讼获得势头或引发大量媒体报道，可能削弱消费者支付每罐 $2–$3 的意愿，并压缩价格敏感零售账户的销量。
