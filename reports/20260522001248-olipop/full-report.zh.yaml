      - number: '7.3'
        title: 运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 通过一张未披露的第三方代工灌装商网络制造产品。这种外包模式在更健康定位的 CPG
              中常见，但会造成集中和质量风险：某家代工灌装商一旦停产或出现质量问题，订单履约会立即受损，并带来零售商下架风险。污染、误贴标或未披露过敏原触发的 Class I
              产品召回，会产生直接补救成本，并导致主要零售商永久性货架损失。OliSmart
              混合物需要菊苣根菊粉、木薯根纤维和菊芋纤维——这些特色植物原料供应链地理集中，受气候波动和更广泛功能饮料行业需求激增影响。Olipop 官方产品质量页面确认其代工灌装商网络遵守 GMP
              并进行原料检测，但没有披露代工灌装商身份、审计结果或供应商集中度指标。COGS
              透明度有限（私营公司），因此很难验证毛利率能否吸收原料通胀和代工压力，还是必须转嫁给零售商。食品和饮料制造商普遍把供应链中断、原料通胀和监管合规列为 2025-2026 年最主要运营风险。
