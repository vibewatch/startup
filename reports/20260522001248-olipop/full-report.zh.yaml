  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: |
              Olipop 通过两大主要渠道创收：向 Walmart、Target、Kroger、Whole Foods Market、Costco
              和 Amazon 等主要连锁的约 50,000–65,000 个零售门店做零售 / 批发分销；以及直接面向
              消费者（DTC）的电商业务，提供订阅和一次性购买。零售 / 批发渠道占主导，估计贡献总收入
              80–85%，与 Olipop 所称加速大众市场分销的重点一致。BevNet 援引 SPINS 扫描数据称，
              2024 年零售销售额为 $470 million，略高于公司披露的 $400 million 总收入；差异可能来自
              毛销售额与净收入的会计口径不同，或渠道进货确认时点差异。

              DTC 业务通过 Olipop 官网运营，订阅档价格约为每 12-pack $30.59（$2.55/罐），相当于
              一次性 DTC 标价 $35.99（$2.99/罐）的 15% 折扣。订阅收入贡献更高客户终身价值，但活跃
              订阅用户数和流失率未公开披露。大众零售商的零售定价为每 12oz 罐 $2.19–$2.49，Costco
              在 2026 年春季提供 15-pack 混合装，售价 $19.99（$1.33/罐），显示渠道间价格差异
              明显。Olipop 未报告混合净实现价格，因此外部无法计算渠道折让后的每箱收入。
              2024 年 SPINS 零售销售额 $470 million 对比公司报告收入 $400 million，意味着渠道费用
              和退货扣减明显；符合 CPG 行业常态，渠道费用通常占毛收入 15–25%。任何交易数据室
              都应审计主要零售商进货与终端售出时点的收入确认问题，以及它与促销补贴的相互作用。
