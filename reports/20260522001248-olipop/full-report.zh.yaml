  - id: FV001
    title: 推荐逻辑流程
    type: flow
    layout: standard
    summary: |
      从品类验证和财务里程碑，到估值三角校验和反向信号，串起导向 TRACK 建议的因果链。
    data:
      nodes:
        - id: market-proof
          label: FY2024 收入 $400M（同比 100%）；品类份额 60%
        - id: profitability
          label: FY2024 盈利；每 1 美元股权融资约产生 $2.05 收入
        - id: poppi-precedent
          label: Poppi 并购先例：$1.95B，隐含倍数更高
        - id: series-c
          label: Series C 轮估值 $1.85B（2025 年 2 月）；按历史收入 EV/Revenue 4.6x
        - id: adverse-signals
          label: 反向信号：并购谈判停滞；转向融资 $200M；诉讼未结
        - id: buyer-universe
          label: 买方池收窄：Pepsi 整合 Poppi；Coke 打造 Simply Pop
        - id: recommendation
          label: 建议：TRACK —— 估值公允；催化剂出现后有买入路径
      edges:
        - from: market-proof
          to: profitability
        - from: profitability
          to: series-c
        - from: poppi-precedent
          to: series-c
        - from: series-c
          to: adverse-signals
        - from: buyer-universe
          to: adverse-signals
        - from: adverse-signals
          to: recommendation
    approximationNotes: |
      节点标签是摘要简写；每个节点的详细证据见章节正文和表格引用。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV011
      - CV013
      - CV043
  - id: FV002
    title: 收入情景下的估值敏感性
    type: bar
    layout: standard
    summary: |
      以 $1.85B 入场估值测算，从 FY2024 实际值到 FY2028 预测，不同收入情景下的隐含 EV/Revenue 倍数；它展示持续增长时倍数压缩有多快。
    data:
      items:
        - label: FY2024A：$400M（历史收入，4.6×）
          value: 4.6
        - label: FY2025E 基准：$475M（前瞻，3.9×）
          value: 3.9
        - label: FY2025E 牛市：$500M（前瞻，3.7×）
          value: 3.7
        - label: FY2026E 基准：$600M（前瞻，3.1×）
          value: 3.1
        - label: FY2026E 熊市：$480M（前瞻，3.9× —— 停滞）
          value: 3.9
        - label: FY2028E 牛市：$800M（退出情景，2.3×）
          value: 2.3
      xAxis: 收入情景
      yAxis: $1.85B 入场估值下的隐含 EV/Revenue 倍数（×）
    approximationNotes: |
      收入预测为分析师估计；FY2026 熊市情景假设增长放缓。所有倍数固定使用 $1.85B 作为分子（2025 年 2 月 Series C 轮估值）。
    claimRefs:
      - CV003
      - CV005
      - CV025
      - CV026
      - CV034
      - CV035
  - id: FV003
    title: 各情景估值与回报区间
    type: range
    layout: standard
    summary: |
      熊市、基准和牛市情景下的预期退出估值区间（百万美元），以及以 $1.85B Series C 入场计算的隐含回报倍数。
    data:
      items:
        - label: 熊市（约 45%）
          low: 760
          mid: 1100
          high: 1400
        - label: 基准（约 30%）
          low: 2000
          mid: 2250
          high: 2500
        - label: 牛市（约 25%）
          low: 3600
          mid: 5000
          high: 6400
    approximationNotes: |
      退出估值来自各情景收入预测和 EV/Revenue 退出倍数假设。熊市低端（$760M）取自 UpsideList 困境情景。所有数字单位为百万美元。概率判断为分析师估计。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV043
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      投委会可直接使用的综合评分卡，从七个投资维度给 Olipop 按 0–10 分打分，反映截至 2026 年 5 月的证据质量和确信度。
    data:
      items:
        - label: 市场机会
          value: 8
        - label: 品类验证与品牌
          value: 7
        - label: 竞争壁垒
          value: 5
        - label: 单位经济透明度
          value: 3
        - label: 执行与管理层
          value: 7
        - label: 估值（入场价格）
          value: 5
        - label: 证据质量
          value: 4
    approximationNotes: |
      评分为分析师在 0–10 分尺度上的定性判断。公司未上市、信息不透明，单位经济透明度得分较低；在位巨头入场风险压制竞争壁垒，只给中等；并购停滞且新融资在推进，估值倍数处在公允到略偏高区间，因此估值得分为中等。
    claimRefs:
      - CV005
      - CV006
      - CV014
      - CV023
      - CV040
      - CV043
