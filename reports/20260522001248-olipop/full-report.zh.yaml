      - number: '6.4'
        title: 采用情况与增长轨迹
        blocks:
          - type: paragraph
            body: >
              OLIPOP 的增长轨迹是现代美国饮料史上最快的一批。品牌 2019 年第一年只进入北加州 40 家杂货店、收入 $852,000，随后扩张到 2022 年 $73.4 million、2023 年 $200
              million、2024 年 $400 million——五年收入增长 469×。Femfounded 案例研究称，这是该时期美国非酒精饮料中最快的美元销售额和单位增长轨迹。


              零售扩张与收入同步：40 家门店（2019）→ 20,000 家门店（2023）→ 50,000+ 家门店（2025）→ 65,000+ 家门店（2026）。Femfounded 把 OLIPOP
              在扩大分销前先在每个零售商处建立动销的纪律，描述为关键运营经验：品牌只用 28,000 家门店就做到 $200
              million，因为它在增加新货架前，先把营销和渠道支持集中在既有货架上。这种动销优先策略创造了真正高的单店周转，进而说服主流杂货商和大众零售商在竞争激烈的汽水货架上给出空间。


              品类验证同步到来：PepsiCo 在 2025 年以 $1.95 billion 收购竞争对手 Poppi，Coca-Cola 在 2025 年 2 月推出 Simply Pop，与 OLIPOP
              直接竞争。两项动作都确认大型汽水巨头已把功能汽水细分视为持久市场，而不是一阵风潮；但这也意味着拥有显著更强分销基础设施和营销预算的玩家正在加速竞争。Collabfund 分析文章指出，按多年增长外推，OLIPOP
              2024 年销售额本来指向 $500 million，不过多方来源确认的数字是 $400 million。OLIPOP 在 2024 年初首次实现盈利，消除了资本消耗作为短期执行风险。
            claimRefs:
              - CU021
              - CU022
              - CU023
