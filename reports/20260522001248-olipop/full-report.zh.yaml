    notes: 严重程度评级基于公开证据评估；仅靠公开来源无法量化每项风险的完整财务影响。法律风险严重程度反映正在进行的集体诉讼， 但不包含任何尚未发生的判决或和解。尽调问题需要管理层访问和/或法律尽调才能完整评估。
