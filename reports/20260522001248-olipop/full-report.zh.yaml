      - number: '6.5'
        title: 复购行为、DTC 忠诚度与留存信号
        blocks:
          - type: paragraph
            body: >
              OLIPOP 没有公开披露净留存率（NRR）、总留存率（GRR）、订阅流失率或队列级复购数据。缺少这些数字，是任何要判断客户持久性的尽调都必须面对的重要证据缺口。公开信号能观察到的是稳定而非异常强劲的复购需求。


              在 Amazon 上，2025 年初每日销量约为 100 到 119 件——稳定，但与 Poppi 每日 120–157 件相比并不突出。这种稳定节奏暗示有忠诚核心买家，而不是靠爆款驱动的波动购买；但相对
              Poppi 的绝对销量缺口也说明，OLIPOP 在 Amazon 的渗透没有跟上 Poppi 由网红驱动的病毒式获客。


              DTC 订阅基础设施有意为复购设计：每单 15% 折扣、免运费、灵活的 2/4/8 周间隔，且无锁定取消。Propeller Industries 的案例研究（OLIPOP
              的财务合作伙伴）把品牌财务轨迹描述为从「一年 $1 million」到「一天 $1 million」，暗示收入运行率和复购经济性都不错；但公司没有披露订阅用户数或订阅续费率。


              Latterly 的营销分析称，OLIPOP 会先在 DTC 和有限杂货渠道测试新口味，再全国放量，并用第一方 DTC 数据判断动销阈值。这套机制让 DTC
              成为创新验证场：参与度高、具意见领袖属性的消费者推动早期发现，并在大规模零售承诺前提供信号。行业案例研究提到的主要忠诚度基础设施工具是 Klaviyo 邮件流、ReCharge 订阅管理和 Instacart
              零售媒体。


              根汁汽水动销里程碑（在一家大型零售商超越 A&W）是最强的单一零售复购证据：如果没有持续消费者复购来积累货架动能，OLIPOP
              不可能成为根汁汽水品类领导者。不过，这只发生在一家未具名零售商，公司也没有披露该表现是否已经在其完整 65,000 家门店覆盖中复现。
