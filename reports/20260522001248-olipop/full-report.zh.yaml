      - number: '6.6'
        title: 反向证据与结构性风险
        blocks:
          - type: paragraph
            body: >
              OLIPOP 承担几项重要客户侧风险，任何尽调分析都必须把这些风险与采用证据谨慎权衡。


              法律和监管风险最紧迫。2026 年 1 月在 U.S. District Court for the Central District of California 提起的一起集体诉讼称，OLIPOP
              宣称其饮料提供有意义的益生元消化收益，构成欺骗性营销。原告称这些饮料是「加了糖的水，益生元效果微不足道」，并主张消费者为没有获得的健康收益支付了每罐 $2–$3（比传统汽水高
              200–500%）。被点名产品覆盖全线。Environmental Research Center 早些时候在 2024 年 1 月提交 Proposition 65 通知，称多种 OLIPOP
              口味含铅和汞；公司在 2025 年中以 $75,000 民事罚款和律师费达成和解，并承诺加强检测和重配方以降低污染物水平。两项行动如果获得势头，可能削弱 OLIPOP 溢价定价所依赖的健康动机购买触发点。


              竞争替代是第二个风险。2025 年初，Poppi 在 Amazon 每月销售约 3.3 million 件，是 OLIPOP 1.55 million 的两倍多。Poppi 累计 Amazon 评价 1.17
              million 条，而 OLIPOP 为 298,024 条——这种量级优势说明 Poppi 已经建立更广泛的普通客户基础。在 PepsiCo 分销基础设施支持 Poppi、Coca-Cola 的 Simply
              Pop 进入该品类之后，OLIPOP 面对的是营销和分销资源为其 10–100× 的竞争对手。


              价格敏感性仍是结构性限制。Target 每罐 $2.39–$2.49 的价格，意味着一箱 12 罐 OLIPOP 超出多数家庭杂货预算所能支持的每日汽水习惯。Costco
              $1.33/罐的组合装有所缓解，但无法在所有渠道规模化。通胀时期，消费者会明显降级消费；如果诉讼或科学怀疑挑战其经济理由（肠道健康 ROI），一款被定价为高端健康品的产品会处在脆弱位置。


              集中风险同时存在于零售商和渠道层面。OLIPOP 的 65,000 家门店覆盖由少数大型零售商（Walmart、Target、Kroger）主导；任何一家失去上架或失去优质货架位置，都会实质压缩动销。DTC
              收入占比低于 20%，限制了品牌绕开零售商压力的能力。公司没有公开披露收入在各零售商之间如何分布，因此这一风险很难精确量化。
