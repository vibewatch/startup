      - number: '2.3'
        title: 买方分层与分销渠道
        blocks:
          - type: paragraph
            body: |
              Olipop 的买方基础主要是为个人或家庭消费而购买的个人消费者；公司采用 B2C 模式，
              消费者同时是买方、使用者和付款方。Walmart、Target、Kroger、Whole Foods、Costco、
              Starbucks 等零售商是关键渠道中介，不是最终买方。零售商关系对动销和货架位置至关
              重要，但产品的预算权最终来自家庭杂货或可自由支配饮料预算。

              核心消费者分层是注重健康、年龄大约 18–40 岁的千禧一代和 Z 世代成年人。Beverage
              Industry 援引 Mintel 的数据显示，约 32% 美国消费者对功能性 CSD 创新感兴趣，58%
              表示愿意为更健康的替代品支付溢价。Innova Market Insights 发现，62% 美国成年人在
              过去 12 个月购买过 CSD，但 2023 年饮用频率较 2022 年减半；感知不健康是减少饮用的
              主要原因——上述变化直接利好 Olipop 的定位。

              第二个分层是「汽水转向人群」：现有 CSD 消费者在减少糖摄入，同时希望以低糖形式获得
              熟悉口味（根汁汽水、奶油汽水、可乐）。Olipop 报告称，约 50% 增长来自
              新消费者增量进入品类（而不是直接品牌切换），说明市场确实在扩张，而不只是零和抢份额。
              公司还报告 Z 世代采用率为 25%，高于所有年龄队列。

              一个刚起步但具有战略意义的分层，是「食物即药物」渠道：健康保险网络和雇主
              健康计划把 Olipop 购买作为预防性护理福利报销。该结构不同于标准零售的新付款方
              安排；如果临床证据增强，它可能实质扩大 SAM。

              Olipop 产品已进入近 50,000 个美国零售点，包括 Walmart、Target、Whole Foods、Kroger、
              Costco、Wawa 和 Starbucks。便利店和餐饮服务是 2025–2026 年扩张的空白渠道，Olipop
              已明确把 Series C 资金用于分销多元化。
