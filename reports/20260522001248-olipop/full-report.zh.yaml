      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: CPG 品牌罕见的收入速度
            body: >-
              Olipop 从上市年（2019）收入 $852,000 增至 2024 年 $400 million，五年增长 469x，同时实现盈利。这条收入曲线，加上它取代 A&W Root Beer
              成为美国最畅销根汁汽水，都是重要信号：品牌确实推动了消费者转换，而不只是品类尝鲜。
            calloutType: strength
            claimRefs:
              - CO005
              - CO013
              - CO016
              - CO036
          - type: callout
            title: 健康声称诉讼是结构性风险
            body: >-
              Olipop 每罐 $3–4 的溢价几乎完全由其益生元肠道健康定位支撑。2025 年集体诉讼指称每罐纤维剂量不足以产生临床意义上的益处；再叠加 The Washington Post
              发布的独立专家质疑，品牌定位、监管地位和价格溢价都面临实质风险。如果原告胜诉，或 FDA / FTC 收紧功能性饮料健康声称指引，Olipop
              可能需要大幅调整营销，进而压缩利润率，并削弱它相对低价传统汽水的竞争差异。
            calloutType: risk
            claimRefs:
              - CO029
              - CO031
          - type: callout
            title: 机构投资人入场显示品类成熟
            body: >-
              J.P. Morgan Private Capital 在 Series C 中锚定 $50 million，值得注意的不是金额，而是资金来源。过去功能性饮料融资通常由消费 VC
              和明星投资人主导；如今美国最大银行的成长股权平台入场，说明 Olipop 的盈利能力、规模和品类领导地位已跨过机构承销门槛。这是尽调中的重要拐点——下一个问题是，在当前收入运行率下，估值倍数是否撑得住。
