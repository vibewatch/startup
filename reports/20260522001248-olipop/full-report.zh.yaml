      - number: '7.5'
        title: 财务与退出风险
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 在 2025 年 2 月完成由 JP Morgan Private Capital 领投的 $50 million Series C，投后估值 $1.85 billion，隐含约为 2025
              年预计收入 ~$500 million 的 3.7x。这个倍数相较上市可比公司 Zevia（ZVIA）有明显溢价，后者交易在约 1-2x 收入且 EBITDA 为负；相较高增长品牌通常 2-3x 收入的 CPG
              战略收购倍数也有溢价。Forge Global 提到，Olipop 已探索保密 S-1，显示其保留 IPO 或战略出售的选择权。BevNET 报道 Poppi 被收购后，2025
              年末出现活跃并购讨论；但最可能的战略买家——PepsiCo、Coca-Cola 和 Keurig Dr
              Pepper——如今各自都已有自己的益生元汽水，降低了战略紧迫性。在重大集体诉讼和解、动销下滑和利润率压缩叠加的下行情景中，独立分析师模型显示估值可能压缩到约 $760 million，较当前标记下降超过
              55%。Olipop 在 2024 年实现现金盈利，提供了有意义缓冲；但公司仍面临营运资本风险，因为它需要预先垫付零售商促销津贴，在全国规模下每年可能达到数千万美元。
