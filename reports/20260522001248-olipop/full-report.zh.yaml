        - 和解或判决 ≥$30M，或持续诉讼实质限制营销表述
        - 现金流出；全国健康宣称营销面临监管先例风险；买方意愿下降
        - 升级法律尽调；下调退出估值；监控 SPINS 动销以判断品牌影响
