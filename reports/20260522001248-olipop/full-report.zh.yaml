  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 SKU 格局
        blocks:
          - type: paragraph
            body: >
              OLIPOP 以 12-oz 铝罐销售益生元汽水，旗下有两条清晰分开的产品线：品牌身份相同，但配方、纤维含量、冷藏要求和目标分销渠道不同。旗舰冷藏 9g 纤维产品线在 2018 年推出，到 2026 年 5
              月已扩展到 17+ 种口味，包括 Vintage Cola、Classic Root Beer、Cream Soda、Strawberry Vanilla、Cherry Vanilla、Orange
              Squeeze 和 Tropical Punch。每罐提供 9 克膳食纤维、2–5 克糖；传统 12-oz 可乐约含 39 克糖，相比之下添加糖约减少 90%，同时补入有意义的纤维。


              常温货架稳定的 6g 纤维产品线在 2024–2025 年推出，是 OLIPOP 对便利店、药店和大众零售渠道冷链限制的战略回应。公司把 OliSmart 从原来的菊苣 /
              菊芋混合纤维，改为阿拉伯胶、瓜尔胶和木薯纤维，在不加防腐剂的情况下实现 9–12
              个月常温货架稳定，使产品能与传统品牌一起进入常规汽水货架。该产品线纤维略低（6g），但保持同样的低糖、植物成分和甜味剂路径。公司活跃的口味创新体现在 2026 年 5 月新品：Raspberry
              Sherbet（限量版）已进入 Costco 组合装，Blackberry Vanilla 在持续消费者需求推动下重新成为常设
              SKU。双产品线策略反映出公司有意在健康声称差异化与大众市场分销规模之间取得平衡，以支撑更大的销售目标。
