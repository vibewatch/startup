      - number: '5.3'
        title: 制造运营与供应链
        blocks:
          - type: paragraph
            body: >
              OLIPOP 采取完全轻资产的制造模式：不拥有任何生产设施，完全依赖 GMP
              认证的合同制造商（代工灌装商）完成混合、灌装和罐装。每家代工灌装商都必须遵守良好生产规范，覆盖过敏原控制、微生物安全、流程一致性和环境监测。产品放行前，逐批检测用行业标准验证方法确认纤维效价、微生物计数，以及不存在农药或病原体污染。


              常温 6g 产品线使用能够实现常温分销所需密封封口的无菌或热灌装产线生产。9–12 个月货架期靠受控水分活度和低 pH 实现，而不是添加防腐剂。随着 OLIPOP 放量，单一来源制造是已记录风险：公司已在
              2026 年公开推进第二家主要代工灌装商上线，目标是提升产能并分散风险。代工灌装商身份受 NDA
              约束保持保密，限制了尽调方对供应商集中度、切换成本和产能多元化实际时间表的可见度。原料采购涉及木薯和菊苣根等全球大宗商品市场，也涉及更专门的植物提取物（药蜀葵、金盏花、葛根、仙人掌），其供应可能有季节性或地理集中。特色植物采购相对总
              CoGS 的成本结构影响没有公开披露。
