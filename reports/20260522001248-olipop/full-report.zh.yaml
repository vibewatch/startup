  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 最直接的法律风险，是原告 Jordan Somers 于 2025 年 12 月 17 日在 Eastern District of New York 提起的活跃联邦集体诉讼（Case No.
              1:25-cv-06933）。起诉书称，每罐 6-9 g 益生元纤维在单罐消费频率下不足以产生有意义的肠道健康结果，因此 Olipop 的消化健康营销依据纽约 General Business Law
              构成欺骗。诉讼请求包括法定赔偿、禁止健康声称营销的禁令，以及纠正性广告——这些救济会直接打断品牌七年来建立的身份。原告律师可直接借鉴 Poppi 在 2026 年 4 月以 $8.9 million
              和解类似集体诉讼的现成路线图，降低取证成本，并提供先例和解结构。监管侧，California AG Prop 65 数据库记录了一项同意判决（Case No. 24CV096887，2025 年 6 月 20
              日），来自 Environmental Research Center 执法行动，认定多种 Olipop 口味含铅和汞。该判决要求 Olipop 按 2025 年 1 月 1 日生效的修订标准，在加州提供
              Prop 65 警示。FTC 的 2022 Health Products Compliance Guidance（2025
              年更新）要求用充分且可靠的科学证据——理想情况下来自人体随机对照试验——来支持益生元功效声称；FDA 和 DOJ 在 2025 年仍保持活跃协同执法。Olipop 还在 SDNY 对 Nutruit
              主动提起商标诉讼，指控其在橄榄产品上使用 Olipop 名称——这显示品牌价值，但也进一步消耗法律注意力和预算。
