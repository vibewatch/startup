      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 毛利率与 EBITDA
        - CPA 审计的利润表；按渠道划分的毛利率 %；股权激励前后 EBITDA
        - EV/Revenue 倍数不精确；毛利率决定终值和可信 EBITDA 倍数区间
        - 数据室请求；管理层演示；Series C 投资者披露
      - - $200M 融资估值与条款
        - 待完成新轮的投后估值、清算优先权条款和反稀释条款
        - 界定现有投资者是否面临降估值轮，并量化稀释对回报分析的影响
        - Axios / Morgan Stanley 交易流程；公司 CFO 对潜在投资者披露
      - - 集体诉讼状态与责任量化
        - 已提交诉状、证据开示记录、任何和解讨论、公司计提的法律准备金
        - Poppi 的 $8.9M 和解是基准；Olipop 的具体法律风险可能因科学记录而不同
        - 公司法律顾问披露；法院案卷审查；行业诉讼监测
      - - 营运资本与现金状况
        - 截至 Q1 2026 的现金余额、应收账款账龄、库存周转和经营现金流
        - 盈利说法无法独立核验；现金动态决定 $200M 中多少是必要资金、多少是可选资金
        - 数据室；管理层 Q&A；Series C 投资者背调
      - - FY2025 实际收入（Q1–Q2 2026）
        - Q1 2026 与 Q2 2026 收入，或任何已确认 FY2025 总额
        - 前瞻倍数和情景概率权重会随实际收入轨迹发生实质变化
        - 公司业绩简报；饮料行业 sell-in 数据（SPINS / Nielsen）；BevNET 报道
    notes: |
      尽调问题按其对投资决策的影响排序。第 1 和第 2 项是以当前条款追加资本承诺的阻断项。
    claimRefs:
      - CV040
      - CV041
      - CV043
      - CV044
      - CV045
