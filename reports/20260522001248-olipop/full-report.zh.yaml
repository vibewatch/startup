      - number: '4.2'
        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: |
              Olipop 的成本结构符合轻资产 CPG 饮料品牌特征：公司不拥有制造设施，生产完全依赖
              代工厂（合同制造商）。在 Olipop 当前规模下，碳酸饮料代工灌装成本通常为每罐
              $0.10–$0.40，覆盖制造人工和间接费用；成分（菊苣根菊粉、木薯纤维、marshmallow root
              和植物提取物）相较常规汽水配方又带来明显溢价。包装（罐、印刷标签、二级纸箱）是
              第三大可变成本。从代工厂到区域配送中心、再到零售门店的货运，会再增加净收入
              5–10%，与饮料行业基准一致。

              Olipop 未公开披露毛利率。最接近的公开可比公司是 Zevia PBC（股票代码：ZVIA），一家上市
              功能性饮料公司；它在 FY2024 以 $155 million 净销售额实现 46.4% 毛利率，受益于成分采购
              改善，创历史新高。Keurig Dr Pepper（KDP）在 FY2024 以 $15.4 billion 净销售额实现
              25.9% 调整后经营利润率，反映成熟、垂直整合饮料业务的经济性。带功能性成分、采用高端
              代工灌装的高端挑战者品牌，通常在渠道费用前瞄准 35–50% 毛利率区间。Olipop
              2024 年盈利的说法，与该区间高端的毛利率相一致；但没有经审计财务，无法确认。渠道费用——
              促销补贴、临时降价、进场费和陈列费——是 CPG 品牌额外的「线下」成本，可能显著
              压缩有效净利率。按 Olipop 当前零售扩张阶段，单是新 SKU 铺进全国性零售商的
              进场费就可能达到每店 $2,000–$5,000；总渠道费用占毛收入 15–25% 的基准，
              是 P&L 中 COGS 之后最大的项目。
