      - number: '3.3'
        title: 定价、分销与能力对比
        blocks:
          - type: paragraph
            body: |
              高端益生元汽水细分的标准零售价已收敛到每 12-ounce 罐 $2.49–$2.50，覆盖 Olipop、
              Poppi 和 Simply Pop 三大品牌；短期内，价格不再是消费者层面的差异化因素。Olipop 的
              DTC 订阅（Olishop）提供 15% 折扣和免运费，略微改善直接购买的价格竞争力；Costco、
              Sam's Club 等会员仓储的多罐装则提供额外价值感。价格谱系低端，Aldi 和 Trader Joe's
              的自有品牌益生元汽水以显著更低价格进入，中期会对品牌溢价形成下行压力。

              分销规模因母公司归属而显著分化。归入 PepsiCo 后，Poppi 可使用 PepsiCo 覆盖 200 多个
              国家、2024 年净收入约 $92 billion 的关系网络，其中包括便利店、加油站和餐饮服务的
              主导货架存在——Olipop 冷藏形态历史上正受限于便利店、加油站和餐饮服务。Coca-Cola 拥有全球软饮零售
              量 17% 份额，也给 Simply Pop 带来类似规模的分销。Olipop 到 2025 年初独立进入约
              50,000 个美国零售门店，作为挑战者品牌已是强成绩，但在结构上小于 PepsiCo 和
              Coca-Cola 可为各自品牌提供的能力。Olipop 2024 年 8 月推出的常温系列部分补上了
              渠道短板，使其可以进入常温便利店、会员仓储和大卖场货架。

              Olipop 与同行的配方差异很具体：Olipop 的 OLISMART 配方每罐提供 9g 益生元纤维
              （来自木薯根、菊苣根、Jerusalem artichoke 菊粉和其他植物成分），相比之下 Poppi 是
              2g agave inulin，Simply Pop 是 6g 未具体说明的益生元纤维。Olipop 相比 Poppi 的
              4.5× 纤维优势可能具有临床意义，尤其是 Poppi 的健康声称和解已建立先例：每罐剂量不足
              可能构成虚假广告。Olipop 还用公司资助的临床研究支持其声称，包括 Vintage Cola 的血糖
              反应研究，给了它一个业内其他品牌尚未发表的科学背书叙事。
