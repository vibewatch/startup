              OLIPOP 2019–2024 年收入增长 469×，并拥有 65,000 家门店零售覆盖，横跨天然、主流、大众、会员仓储、便利和餐饮服务渠道，为广泛消费者采用提供了异常强的证据。根汁汽水在货架上取代
              A&W，是一个硬动销数据点，说明 OLIPOP 不只是赢在健康专门渠道，而是在大众零售中与传统 CPG 在位者竞争并取胜。
            calloutType: strength
