      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: |
              Olipop 已在四轮定价融资中披露约 $195 million 股权融资，截至 2025 年 2 月投后估值
              达 $1.85 billion。公司最早靠出售 Obi 所得的 $100,000 种子资金启动，随后在 2019
              年完成第一轮机构融资——$2.5 million 种子轮。2020 年 1 月，公司完成 $13 million Series
              A，用于全国分销建设和营销。2022 年 2 月 Series B 融资 $39.7 million，并因明星投资人
              阵容获得大量媒体关注，包括 Gwyneth Paltrow、Mindy Kaling、Camila Cabello、Priyanka
              Chopra Jonas、Jonas Brothers（Joe、Nick、Kevin）、说唱歌手 Logic 和前 PepsiCo CEO
              Indra Nooyi——上述投资人在资金之外，也贡献了品牌背书和自然传播。

              2025 年 2 月 12 日宣布的 $50 million Series C，由 J.P. Morgan Private Capital 的
              Growth Equity Partners 锚定；这是美国最大银行旗下 $1 billion 成长股权平台，标志着
              Olipop 从消费风险资本和明星资本，结构性转向机构级投资人。J.P. Morgan 的 Christopher
              Dawe 随交易加入董事会。CEO Goodwin 曾公开表示，这将是公司预计中的最后一轮股权
              融资，但 IPO 或并购时间表尚未确认。Olipop 在 2022 年 Series B 的估值约为
              $200 million。
