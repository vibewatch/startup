  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与买方画像
        blocks:
          - type: paragraph
            body: >
              OLIPOP 的终端客户主要是个人消费者，同时承担买方、使用者和付款方角色——这是典型的直接零售 CPG 结构，没有显著企业或机构渠道。三个清晰的心理画像分群驱动需求。


              最大分群是注重健康的成年人（主要为 25–45 岁的千禧一代和较年长 Gen Z），他们主动减少摄糖，寻找更健康的功能性替代品。这些买家会看标签，对肠道健康信息有反应，并愿意为每罐支付
              $2.39–$2.49，而传统汽水约为 $0.50。CNBC 在 2023 年引用 Euromonitor 分析师 Matthew Barry
              的话称，「确实有一群消费者负担得起定期购买高价汽水，但那只是人口中的有限子集」——这是对大众市场渗透天花板的早期承认。


              第二个分群是传统汽水转换者：这些成年人过去每天消费传统碳酸软饮（CSD），现在想要根汁汽水、奶油汽水或可乐的怀旧感，但不想承受糖负担。2023 年 2 月，在一家未具名美国大型零售商处，OLIPOP 根汁汽水超越
              Keurig Dr Pepper 旗下 A&W，成为最畅销根汁汽水——这是一个强烈动销信号，说明习惯性汽水消费者是在直接替换产品，而不只是加买一种补充品。


              第三个分群是通过 TikTok 和 Instagram 触达的年轻 Gen Z 消费者（18–24 岁），他们被限量口味、病毒式传播节点（Dry January 2026 的 Shirley
              Temple、2026 年春季的 Raspberry Sherbet），以及 Gwyneth Paltrow、Mindy Kaling 和 Jonas Brothers 等网红背书吸引。约 63% 的 18
              岁及以上美国人每天至少喝一次汽水，给 OLIPOP 留下了很大的潜在替代市场。OLIPOP 自身估计，97% 的美国家庭已经购买汽水；因此，品牌叙事不是创造新品类，而是在既有购买习惯中提供功能升级。


              买方和付款方几乎总是同一个人：家庭杂货采购者或线上订阅者。没有识别出显著 B2B 或机构渠道；Starbucks 为零售转售上架，是主要的餐饮服务邻近场景。这种单一消费者依赖意味着 OLIPOP
              缺少企业级粘性，其留存完全由消费者口味、健康信念和价格承受力驱动。
