          - type: callout
            title: 留存数据缺口
            body: >-
              没有公开披露 NRR、GRR、队列留存或订阅续费率数据。因此，仅靠公开来源无法评估 OLIPOP 真实的客户持久性。DTC 订阅 15%
              折扣是有意义的忠诚度激励，但无法提供实际订阅用户数或续费行为的可见度。买方至少应要求管理层提供：订阅用户数、6 个月订阅续费率、按账户划分的零售动销趋势，以及 Amazon Subscribe & Save
              占比。
            calloutType: risk
