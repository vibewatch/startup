  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: |
              Olipop 所处竞争格局是嵌套的：直接的益生元汽水同行、已开始进入该品类的大型饮料既有
              品牌、相邻功能性饮料形态，以及现状替代品。2025 年最重要的竞争变化，是美国两大汽水
              双头几乎同时入场：PepsiCo 以 $1.95 billion 收购 Poppi（3 月 17 日宣布，2025 年
              5 月 19 日完成），Coca-Cola 则在 2025 年 2 月借旗下受信任的 Simply 果汁品牌推出
              Simply Pop。两项动作验证了品类商业耐久性，但也把竞争环境从挑战者品牌打法，推向
              既有巨头规模化战争。

              直接益生元汽水同行包括 Poppi（现归 PepsiCo）、Simply Pop（Coca-Cola）、Culture Pop
              Soda（独立，Series B）、SunSip（Health-Ade）、Bloom Pop（Bloom Nutrition）、Slice
              （Suja Life），以及大众零售商已开始推出的一层自有品牌产品。相邻竞争者包括
              Zevia（上市公司，零糖甜叶菊汽水）、康普茶品牌（GT's Living Foods、Health-Ade）、
              气泡水（LaCroix、Bubly）和能量饮料（Red Bull、Monster）。现状替代品仍是传统 CSD——
              Coca-Cola Classic、Pepsi-Cola、Dr Pepper；三大传统品牌拥有 97% 的美国住户渗透率，是
              Olipop 试图转化的主要饮料消费份额池。零售商自建店牌益生元汽水是一个新兴风险，
              Aldi 和 Trader Joe's 已经开始执行。合在一起，2025–2026 年的货架拥挤程度已可测量地
              高于任何此前阶段，压缩了 Olipop 先发优势仍能保持结构性不受挑战的窗口。
