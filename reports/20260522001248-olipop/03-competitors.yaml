  - id: pricing-distribution-capability-comparison
    title: Pricing, Distribution, and Capability Comparison
    body: |
      The premium prebiotic soda segment has converged around a standard retail price point of
      $2.49–$2.50 per 12-ounce can across all three major brands—Olipop, Poppi, and Simply Pop—
      eliminating price as a near-term differentiator at the consumer level. Olipop's DTC
      subscription (Olishop) offers a 15% discount and free shipping, slightly improving price
      competitiveness on direct purchases, while multi-packs at club stores (Costco, Sam's Club)
      provide additional value framing. At the low end of the pricing spectrum, private-label
      prebiotic sodas from Aldi and Trader Joe's enter at meaningfully lower price points,
      creating downward pressure on branded premiums over the medium term.

      Distribution scale diverges sharply by parent-company affiliation. Poppi under PepsiCo
      gains access to the company's relationships with more than 200 countries and approximately
      $92 billion in 2024 net revenue, including dominant shelf presence in convenience stores,
      gas stations, and foodservice—channels where Olipop's refrigerated format has historically
      been constrained. Coca-Cola, with 17% global soft drink retail volume, brings Similarly
      scaled distribution to Simply Pop. Olipop reached approximately 50,000 U.S. retail doors
      independently by early 2025, a strong achievement for a challenger brand but structurally
      smaller than what PepsiCo and Coca-Cola can offer their respective brands. Olipop's
      August 2024 shelf-stable line partially addresses this gap by enabling penetration of
      ambient-temperature convenience, club, and mass-aisle formats.

      The formulation differentiation between Olipop and peers is concrete: Olipop's OLISMART
      blend delivers 9g of prebiotic fiber per can (from cassava root, chicory root, Jerusalem
      artichoke inulin, and other botanicals), compared with Poppi's 2g of agave inulin and
      Simply Pop's 6g of unspecified prebiotic fiber. Olipop's 4.5× fiber advantage over Poppi
      is potentially clinically meaningful, especially as Poppi's health claim settlement
      establishes precedent that insufficient per-can dosage can constitute false advertising.
      Olipop also uniquely supports its claims with company-funded clinical research, including a
      blood-sugar response study of Vintage Cola, giving it a science-backed narrative that no
      other brand in the space has published.
