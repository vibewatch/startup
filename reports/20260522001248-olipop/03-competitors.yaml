figures:
  - id: FP001
    title: Competitive Positioning Map
    type: quadrant
    layout: standard
    summary: >-
      Ordinal competitive positioning map placing eight competitors across two axes:
      distribution channel power (x-axis, Low → High, based on door count and parent-company
      relationships) and formulation differentiation / clinical backing (y-axis, Low → High,
      based on fiber content, ingredient complexity, and published research). Olipop occupies
      the upper-right as the brand with the strongest formulation position that retains
      meaningful independent distribution; simply Pop and Poppi/PepsiCo occupy the
      right as incumbents with superior distribution but lesser or equivalent formulation depth.
      Scores are ordinal evidence-backed assessments, not interval data.
    data:
      points:
        - {x: 9, y: 10, label: "Olipop", id: comp1}
        - {x: 10, y: 4, label: "Poppi (PepsiCo)", id: comp2}
        - {x: 10, y: 6, label: "Simply Pop (Coca-Cola)", id: comp3}
        - {x: 7, y: 2, label: "Zevia", id: comp4}
        - {x: 4, y: 6, label: "SunSip (Health-Ade)", id: comp5}
        - {x: 2, y: 4, label: "Culture Pop", id: comp6}
        - {x: 6, y: 5, label: "Bloom Pop (KDP)", id: comp7}
        - {x: 10, y: 1, label: "Legacy CSD (Coca-Cola/Pepsi)", id: comp8}
    approximationNotes: >-
      X-axis (distribution channel power 1–10): based on door count and parent-company
