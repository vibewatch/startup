  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: co-packer identity and audit certification
      missingEvidence: >-
        Co-packer identity, geographic location, GMP audit certifications, third-party
        audit reports, and backup sourcing arrangements for Olipop's manufacturing network.
      whyItMatters: >-
        Without co-packer disclosure, it is not possible to independently assess concentration
        risk, GMP compliance depth, or the feasibility of rapid alternative sourcing in a
        supply disruption or quality failure scenario. This is the primary unverifiable
        operational risk in this chapter.
      diligencePath: >-
        Request from management: (1) co-packer names and locations; (2) most recent third-party
        GMP audit reports; (3) backup co-packer list and activation timeline; (4) any exclusivity
        arrangements that limit sourcing flexibility.
      relatedQuestionRefs:
        - QR011

    - type: stale
      severity: material
      topic: Somers v. Olipop current litigation status
      missingEvidence: >-
        Court docket updates for Somers v. Olipop (EDNY 1:25-cv-06933) including class
        certification decision, dispositive motion rulings, and any settlement negotiations
        or announcements beyond the initial December 2025 filing.
      whyItMatters: >-
        Material developments in the Somers case — particularly class certification or a
        settlement with broad injunctive terms — would fundamentally alter the litigation
        risk assessment and potentially trigger the thesis exit criterion defined in TR005.
      diligencePath: >-
        Monitor PACER for docket activity on Case No. 1:25-cv-06933; set Google Alerts for
        Somers AND Olipop; review plaintiff's counsel (identified in complaint) recent filings
        in analogous prebiotic soda cases.
      relatedQuestionRefs:
        - QR003

    - type: private-evidence-only
      severity: material
      topic: exit process timeline and S-1 or M&A status
      missingEvidence: >-
        Confirmation of whether Olipop has filed a confidential S-1 with the SEC, the
        current status of any M&A process, and the identity of any financial or legal
        advisors engaged for an exit transaction.
      whyItMatters: >-
        Without exit process confirmation, the timeline and probability of liquidity are
        speculative. An undisclosed M&A process or IPO preparation would materially affect
        the risk-adjusted return analysis.
      diligencePath: >-
        Request from management or investors: confirmation of any SEC S-1 filing; names of
        investment bankers retained; timeline for any announced or contemplated transaction.
      relatedQuestionRefs:
        - QR017

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Tables TR002, TR003, TR004, and TR005 contain probability, impact, and concentration
      estimates that are qualitative author assessments based on CPG industry benchmarks.
      OLIPOP does not publicly disclose co-packer identities, operational audit results,
      retailer revenue concentration, or organizational succession planning. The notes
      fields on each table explicitly disclose this limitation. Scores are consistent with
      the chapter evidenceGaps disclosures and represent the best available analytical
      judgment given the information publicly available as of May 2026.
