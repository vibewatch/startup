callouts:
  - calloutType: risk
    title: Active Class Action Threatens Core Health-Claim Positioning
    body: >-
      The Somers v. Olipop class action (EDNY, Dec 2025) targets the prebiotic efficacy marketing
      that underpins Olipop's brand premium and consumer loyalty. Even a partial settlement modeled
      on Poppi's $8.9 M resolution would likely require corrective advertising and marketing
      language revisions — disrupting seven years of brand equity built around digestive wellness.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005

  - calloutType: risk
    title: Big Soda Entry Compresses Shelf-Space and Pricing Moat
    body: >-
      PepsiCo's acquisition of Poppi and Coca-Cola's Simply Pop launch bring distribution-scale
      incumbents into Olipop's prebiotic soda category with DSD network advantages and promotional
      allowances Olipop cannot match. Monitoring velocity per store per week at Walmart and Target
      relative to Poppi and Simply Pop is the single most important leading indicator of whether
      Olipop can sustain its mass-retail position.
    claimRefs:
      - CR014
      - CR015
      - CR016
      - CR017

  - calloutType: risk
    title: Key-Person Dependency on Founder-CEO Spans Formulation and Brand Identity
    body: >-
      Ben Goodwin simultaneously holds formulation IP, brand credibility, and executive leadership
      — a triple concentration unusual even by founder-led CPG standards. The 2025 hire of
      President Mel Landis (Coca-Cola/Clorox) reduces operational concentration, but formulation
      IP custody and brand-identity dependency on Goodwin remain unresolved and unverifiable from
      public sources.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029

