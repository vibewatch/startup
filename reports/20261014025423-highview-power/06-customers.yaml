callouts:
  - calloutType: "insight"
    title: "Absence of Distributed Customer Base Reflects Infrastructure Asset Business Model"
    body: "Standard SaaS or consumer adoption metrics such as net revenue retention, logo churn, or annual recurring revenue are fundamentally inapplicable to Highview Power. As a developer and operator of utility-scale infrastructure assets, Highview's customer base consists of single-counterparty sovereign institutions, regional grid operators, and regulated utility syndicates. Revenue security is defined by asset availability factors, capacity payments, and regulatory floor guarantees rather than enterprise seat renewal rates."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
  - calloutType: "risk"
    title: "Extreme Regulatory and Policy Framework Dependency"
    body: "Highview's commercial pipeline of multi-gigawatt-hour facilities (including Hunterston and Killingholme) relies entirely on Ofgem's cap-and-floor scheme. If Ofgem rejects final applications in summer 2026 or sets floor prices below the required hurdle rate for cryogenic equipment, Highview will be unable to secure non-recourse debt financing, leaving gigawatt-scale projects stranded."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
