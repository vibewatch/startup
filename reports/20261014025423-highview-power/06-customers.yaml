company:
  name: "Highview Power"
chapter:
  number: 6
  title: "Customers"
  summary: "Highview Power operates as an infrastructure asset developer selling grid-scale flexibility and stability services to transmission system operators, utilities, and wholesale power markets rather than selling modular hardware to dispersed commercial accounts. Commercial proof is currently anchored by historic demonstrators such as the 5 MW Pilsworth project with Viridor and KiWi Power, while upcoming utility-scale revenue relies on the 50 MW / 300 MWh Carrington project commissioning in 2026 and two 3.2 GWh projects eligible under Ofgem's revenue cap-and-floor support regime."
sections:
  - id: "customer-segmentation-and-revenue-mechanisms"
    title: "Customer Segmentation and Institutional Counterparty Structure"
    body: "Highview Power does not address a distributed consumer or enterprise software base; its commercial model targets central grid infrastructure counterparties, institutional system operators, regional transmission networks, and wholesale power market participants. The primary buyer profile comprises national transmission system operators—specifically Great Britain's National Electricity System Operator (NESO)—seeking synchronous grid stability services such as inertia, voltage control, short-circuit contribution, and fast frequency response. Secondary commercial counterparties include utility partners and energy aggregators that interface with wholesale electricity markets to capture arbitrage spreads across peak and off-peak charging cycles. Because long-duration energy storage assets involve high upfront capital requirements, commercial adoption is tightly coupled with government-backed de-risking mechanisms, such as the UK Department for Energy Security and Net Zero and Ofgem cap-and-floor framework, which underwrites baseline project revenue."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "commercial-proof-and-operational-trajectories"
    title: "Commercial Deployment Proof: Demonstrators to Commercial-Scale Infrastructure"
    body: "Operational deployment proof for Highview Power spans historical pre-commercial demonstrators and currently under-construction utility-scale infrastructure. The foundational grid-connected operational benchmark was established in 2018 at the Pilsworth landfill gas facility in Bury, developed in partnership with waste management company Viridor and operated with demand response aggregator KiWi Power. The 5 MW / 15 MWh Pilsworth demonstrator validated thermodynamic performance and provided real-world balancing services to the UK power grid. In June 2024, Highview secured £300 million to finance its first commercial-scale deployment: the 50 MW / 300 MWh Carrington facility at Trafford Energy Park near Manchester, backed by £165 million from the UK Infrastructure Bank alongside strategic co-investors including Centrica, Rio Tinto, Goldman Sachs Power Trading, Kirkbi, and Mosaic Capital. Carrington Phase 1 focuses on delivering a zero-carbon stability island operational from 2026, marking Highview's transition from pilot-stage trials to commercial infrastructure operation."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
  - id: "pipeline-expansion-and-concentration-risks"
    title: "Pipeline Scaling, Offtake Frameworks, and Counterparty Concentration"
    body: "Highview's commercial expansion strategy hinges on developing multi-gigawatt-hour infrastructure assets integrated with sovereign policy frameworks. In November 2025, Highview raised £130 million to advance a 300 MW / 3.2 GWh hybrid liquid air and battery storage facility at Hunterston in North Ayrshire, Scotland, designed to absorb constrained Scottish offshore wind generation and dispatch clean electricity to high-demand load centers in England. Furthermore, Ofgem confirmed in 2025 that Highview's 3.2 GWh projects at Hunterston and Killingholme passed eligibility screening under the UK's long-duration electricity storage cap-and-floor investment scheme, advancing toward final investment framework decisions scheduled for summer 2026. However, Highview faces severe customer and regulatory concentration: because its commercial viability depends entirely on UK transmission network contracts and policy-regulated floors, any delay in Ofgem's final awards or interconnection execution represents a direct threat to project-level offtake security."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
