  topStrengths:
    - Strong strategic fit with the UK grid's need for long-duration storage and inertia-bearing flexibility.
    - Material project-finance backing for Carrington and a second-wave cap-and-floor pipeline.
    - Differentiated LAES architecture with non-chemical storage and grid-stability services.
  topRisks:
    - Commercial execution risk remains high until Carrington is commissioned and operating data becomes public.
    - Corporate valuation, ownership structure, and project-level economics remain opaque.
    - Revenue depends on regulatory awards, grid-access approvals, and policy support that are not yet fully bankable.
