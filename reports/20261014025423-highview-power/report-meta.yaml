companyProfile:
  summary: >-
    Highview Power is a UK-based long-duration energy storage developer commercializing liquid air energy storage (LAES)
    infrastructure and grid-stability services. The company is moving from pilot deployments toward the 50 MW / 300 MWh
    Carrington project, while two 3.2 GWh projects remain eligible under Ofgem's cap-and-floor regime. Public
    disclosures show substantial project-finance backing, but the operating economics and equity valuation remain only
    partially disclosed.
  foundingLocation: United Kingdom
  headquarters: United Kingdom
  productSummary: >-
    Grid-scale liquid air energy storage systems and CRYOBattery assets that deliver long-duration discharge plus
    synchronous inertia, voltage support, and other grid services.
  customerFocus: >-
    Transmission system operators, regional grid operators, and utilities procuring long-duration flexibility and
    grid-stability services.
  businessModel: >-
    Project-finance-backed grid flexibility and stability services monetized through bilateral service contracts,
    capacity mechanisms, wholesale arbitrage, and cap-and-floor support.
  stage: growth / pre-commercial
  fundingStatus: >-
    June 2024 project-finance round of £300 million for Carrington, anchored by a £165 million investment from the UK
    Infrastructure Bank and supported by Centrica and other investors.
