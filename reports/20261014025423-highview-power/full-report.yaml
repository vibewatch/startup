  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: Modular functional architecture of Highview Power CRYOBattery liquid air energy storage system.
    approximationNotes: >-
      Subsystem layers represent functional engineering process stages from intake to grid synchronization based on
      commercial 50MW plant design.
    claimRefs:
      - CE002
      - CE005
      - CE012
      - CE014
    data:
      layers:
        - label: Ambient Air Intake and Purification Stage
          detail: >-
            Multi-stage ambient air filtration, desiccant moisture removal, and carbon dioxide scrubbers to prevent
            dry-ice and frost clogging during cryogenic cooling.
        - label: Multi-Stage Compression and Heat Capture Train
          detail: >-
            Electrically driven industrial air compressors with interstage heat exchangers capturing high-temperature
            thermal energy for storage in hot thermal stores.
        - label: Cryogenic Liquefaction and Cold Energy Recycling
          detail: >-
            Plate-fin cryogenic heat exchangers and turbo-expanders chilling air to -196°C using recirculated cold
            thermal energy captured during prior power expansion.
        - label: Low-Pressure Cryogenic Liquid Air Storage
          detail: >-
            Insulated double-walled stainless-steel storage tanks containing liquid air at 1 bar atmospheric pressure,
            decoupling total energy volume from generator capacity.
        - label: Cryogenic Pressurization and Regasification Vaporizers
          detail: >-
            Cryogenic liquid pumps pressurizing liquid air to high operating pressure before passing through packed-bed
            evaporators that recycle cold energy.
        - label: Multi-Stage Air Expansion Turbines
          detail: >-
            High- and intermediate-pressure expansion turbines recovering mechanical work from superheated expanding air
            utilizing stored compression heat.
        - label: Synchronous Generator and Grid Stability Interface
          detail: >-
            Heavy-rotor synchronous generator delivering dispatchable electrical power, physical synchronous inertia,
            dynamic voltage control, and reactive power to the transmission grid.
