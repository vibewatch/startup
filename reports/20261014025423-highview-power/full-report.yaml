      - number: '8.3'
        title: Scenario Analysis, Return Hurdle, and Valuation Logic
        blocks:
          - type: paragraph
            body: >-
              Underwriting an equity investment in Highview Power requires modeling three distinct operational and
              regulatory outcomes across its UK development pipeline. In the bull case, Carrington commissions Phase 1
              on schedule in 2026, and Ofgem awards 20-year cap-and-floor revenue contracts for the 3.2-GWh Hunterston
              and Killingholme projects, unlocking institutional infrastructure capital for a £2 billion rollout. In the
              base case, Carrington achieves commercial operation with stable ancillary service contracts, yielding
              regulated project returns between 8% and 10% but requiring further corporate capital. In the bear case,
              thermodynamic efficiency shortfalls or commissioning delays depress asset revenues, subordinating
              corporate equity behind £165 million of UKIB debt and diluting legacy shareholders.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
