    rows:
      - - Bulk Long-Duration Energy Shifting
        - Pumped hydro storage or curtailed renewable power generation
        - Liquefaction of excess wind/solar electricity for multi-hour discharge
        - Provides 6 to 8+ hours of energy shifting without geographic or topological constraints
        - Round-trip cycle efficiency (55-60% target) lower than lithium-ion chemical batteries (~85%)
      - - Synchronous Grid Inertia Provision
        - Spinning fossil-fueled gas turbines (CCGT/OCGT) running at minimum load
        - Direct mechanical coupling of heavy synchronous generator on power expansion train
        - Delivers zero-carbon physical inertia and short-circuit current to stabilize grid frequency
        - Turbomachinery start-up ramp times (minutes) slower than instant battery inverter response (milliseconds)
      - - Transmission Constraint Relief
        - Grid reinforcement wires, line upgrades, or generator curtailment payments
        - Strategic co-location at transmission bottlenecks (e.g. SHEI or Scottish boundary)
        - Absorbs trapped local renewable generation and injects power during export capacity headroom
        - Requires high-voltage grid substation capacity and favorable regional transmission locational pricing
      - - Voltage Support and Reactive Power
        - Static VAR compensators or standalone synchronous condensers
        - Synchronous condenser operating mode with generator clutched to grid without expansion gas
        - Dynamic reactive power import/export and voltage control across transmission nodes
        - Standby parasitic auxiliary power consumption required to maintain cryogenic thermal readiness
    notes: >-
      Operating workflows reflect Highview Power technical whitepapers and NESO grid stability service definitions.
      Synchronous inertia operates independently of fossil combustion.
