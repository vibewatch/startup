      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Highview Power's governance and executive management structure reflects its strategic transition from an
              engineering-led research venture to a capital-intensive infrastructure developer. The leadership team is
              headed by Chief Executive Officer Richard Butland, a former Goldman Sachs executive with extensive private
              equity and energy investment background who orchestrated the company's £300 million commercial project
              syndicate. Chairman Colin Roy provides institutional board oversight and governance direction across
              diverse industrial and sovereign stakeholders. This commercial leadership builds upon technical scale-up
              work previously overseen by former Chief Executive Gareth Brett, who directed the 5MW Pilsworth
              demonstrator. Highview maintains concentrated key-person dependence on Butland for ongoing institutional
              investor alignment, capital orchestration, and multi-party syndicate management across upcoming
              gigawatt-scale projects.
            claimRefs:
              - CO005
              - CO008
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO008
