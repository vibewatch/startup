      - number: '6.2'
        title: 'Commercial Deployment Proof: Demonstrators to Commercial-Scale Infrastructure'
        blocks:
          - type: paragraph
            body: >-
              Operational deployment proof for Highview Power spans historical pre-commercial demonstrators and
              currently under-construction utility-scale infrastructure. The foundational grid-connected operational
              benchmark was established in 2018 at the Pilsworth landfill gas facility in Bury, developed in partnership
              with waste management company Viridor and operated with demand response aggregator KiWi Power. The 5 MW /
              15 MWh Pilsworth demonstrator validated thermodynamic performance and provided real-world balancing
              services to the UK power grid. In June 2024, Highview secured £300 million to finance its first
              commercial-scale deployment: the 50 MW / 300 MWh Carrington facility at Trafford Energy Park near
              Manchester, backed by £165 million from the UK Infrastructure Bank alongside strategic co-investors
              including Centrica, Rio Tinto, Goldman Sachs Power Trading, Kirkbi, and Mosaic Capital. Carrington Phase 1
              focuses on delivering a zero-carbon stability island operational from 2026, marking Highview's transition
              from pilot-stage trials to commercial infrastructure operation.
