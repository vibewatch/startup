        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Posture: Maintain Research-More Stance Until Commercial COD'
            body: >-
              While Highview Power has assembled a formidable £300 million funding package led by the UK Infrastructure
              Bank and Centrica for its Carrington facility, private equity investors should not commit capital without
              verified corporate equity valuations and audited operational performance. The prudent investment decision
              is to track Carrington's 2026 commissioning and Ofgem's summer 2026 Cap and Floor awards.
            calloutType: recommendation
            claimRefs:
