      - number: '1.3'
        title: Capitalization Structure, Sovereign Co-Investment, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              The financing model underpinning Highview Power relies heavily on public-private project consortia,
              combining sovereign credit support, strategic utility investment, and institutional private capital. In
              June 2024, Highview secured a landmark £300 million financing package to construct its Carrington
              facility, anchored by £165 million from the UK Infrastructure Bank (now operating as the National Wealth
              Fund) and co-led by Centrica plc. The financing syndicate also includes global mining corporation Rio
              Tinto, Goldman Sachs Power Trading, Kirkbi, and Mosaic Capital. Additionally, Highview secured £130
              million in dedicated financing for a Scottish stability island facility. Outside the UK domestic market,
              the company maintains international licensing and development arrangements with Sumitomo Heavy Industries
              in Japan and project development initiatives in Australia. However, corporate-level equity valuation,
              shareholder return waterfalls, and parent balance sheet reserves remain closely held private information.
            claimRefs:
              - CO003
              - CO004
              - CO012
              - CO013
