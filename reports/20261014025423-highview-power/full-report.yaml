          - type: callout
            title: Extreme Regulatory and Policy Framework Dependency
            body: >-
              Highview's commercial pipeline of multi-gigawatt-hour facilities (including Hunterston and Killingholme)
              relies entirely on Ofgem's cap-and-floor scheme. If Ofgem rejects final applications in summer 2026 or
              sets floor prices below the required hurdle rate for cryogenic equipment, Highview will be unable to
              secure non-recourse debt financing, leaving gigawatt-scale projects stranded.
            calloutType: risk
            claimRefs:
