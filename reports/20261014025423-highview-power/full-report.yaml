chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Technology Architecture
        blocks:
          - type: paragraph
            body: >-
              Highview Power is a specialized energy infrastructure developer based in the United Kingdom, founded in
              2005 as a university spin-off to pioneer large-scale liquid air energy storage (LAES). The company's
              technology operates by cleaning, chilling, and liquefying ambient air to -196 degrees Celsius during
              periods of surplus power, storing the cryogenic fluid in low-pressure insulated tanks, and regasifying it
              through expansion turbines to generate dispatchable power during demand peaks. Alongside physical storage,
              Highview operates its proprietary R2X power systems analytics platform to model transmission networks,
              evaluate local grid constraints, and identify high-value project locations. The company emphasizes that
              its LAES systems provide long-duration energy shifting alongside synchronous inertia, dynamic voltage
              regulation, and black start capabilities without the chemical degradation common in lithium-ion battery
              chemistries.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO014
          - type: table
            tableRef: TO001
