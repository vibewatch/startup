              - CE011
      - number: '5.2'
        title: Technical Architecture and Cryogenic Process Engineering
        blocks:
          - type: paragraph
            body: >-
              The proprietary CRYOBattery technical architecture is organized into three tightly integrated functional
              stages comprising charging and liquefaction, bulk cryogenic fluid storage, and power recovery expansion.
              During the charging stage, ambient air is filtered to remove particulate matter, desiccated to strip water
              moisture, and scrubbed of carbon dioxide before feeding an electrically driven multi-stage compressor
              train. Compression heat is extracted through intercoolers and diverted into thermal stores for subsequent
              re-use during power recovery. The pressurized air is chilled across cryogenic heat exchangers and expanded
              through a turbo-expander and throttling valves to produce liquid air. In the storage stage, liquid air is
              maintained at near-atmospheric pressure in modular cryogenic tanks, physically decoupling energy capacity
              from instantaneous power rating. In the discharge phase, cryogenic booster pumps repressurize the liquid,
              which passes through multi-pass evaporators to capture cold thermal energy into gravel or high-grade
              packed beds before superheating and expanding through multi-stage turbines to drive a synchronous
              generator. Independent academic thermodynamic analyses of Highview 5MW/15MWh Pilsworth pilot demonstrator
              established that recycle compressors and evaporators constitute the primary cycle bottlenecks, causing
              substantial exergy destruction. While theoretical design specifications project cycle round-trip
              efficiency between 55% and 60%, unoptimized pilot operations achieved only 8% electrical-to-electrical
              efficiency due to incomplete thermal and cold recycle integration, underscoring that commercial
              underwriting hinges on achieving high heat recovery rates in full-scale deployment.
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
              - CE011
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
