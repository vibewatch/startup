      - number: '6.3'
        title: Pipeline Scaling, Offtake Frameworks, and Counterparty Concentration
        blocks:
          - type: paragraph
            body: >-
              Highview's commercial expansion strategy hinges on developing multi-gigawatt-hour infrastructure assets
              integrated with sovereign policy frameworks. In November 2025, Highview raised £130 million to advance a
              300 MW / 3.2 GWh hybrid liquid air and battery storage facility at Hunterston in North Ayrshire, Scotland,
              designed to absorb constrained Scottish offshore wind generation and dispatch clean electricity to
              high-demand load centers in England. Furthermore, Ofgem confirmed in 2025 that Highview's 3.2 GWh projects
              at Hunterston and Killingholme passed eligibility screening under the UK's long-duration electricity
              storage cap-and-floor investment scheme, advancing toward final investment framework decisions scheduled
              for summer 2026. However, Highview faces severe customer and regulatory concentration: because its
              commercial viability depends entirely on UK transmission network contracts and policy-regulated floors,
              any delay in Ofgem's final awards or interconnection execution represents a direct threat to project-level
              offtake security.
            claimRefs:
