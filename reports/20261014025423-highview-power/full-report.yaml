      - number: '8.2'
        title: Thesis, Anti-Thesis, and Technical Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis rests on Highview Power's ability to supply zero-emission synchronous inertia,
              voltage control, and long-duration energy shifting across a projected 30 to 40 year operational lifespan
              without critical mineral dependencies. Conversely, the anti-thesis highlights unproven multi-megawatt
              commercial round-trip efficiency and persistent thermodynamic irreversibilities. Academic evaluation of
              pilot test data indicates that compression and regasification cycle efficiencies are physically
              constrained by losses in the recycle compressor and evaporator heat exchangers. Furthermore, the UK
              Department for Energy Security and Net Zero explicitly acknowledges that long-duration electricity storage
              faces severe deployment challenges under merchant power market frameworks, making commercial scaling
              contingent on government-backed revenue floor mechanisms rather than unhedged wholesale arbitrage.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
