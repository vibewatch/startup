      - number: '1.4'
        title: Project Milestones, Regulatory Advances, and Commercial Execution
        blocks:
          - type: paragraph
            body: >-
              Highview Power's developmental pathway spans more than twenty years of iterative engineering,
              demonstration, and commercial scaling. After initial pilot validation in 2011, the company launched its
              5MW/15MWh Pilsworth demonstrator in Bury in April 2018, supported by £8 million in UK government funding
              to demonstrate grid-scale balancing services. In November 2025, Greater Manchester Mayor Andy Burnham
              officially broke ground at the Trafford Low Carbon Energy Park on Highview's flagship 50MW/300MWh
              Carrington project, targeted for operational delivery by late 2026. On the regulatory horizon, Highview
              achieved a major commercial milestone when Ofgem confirmed that its proposed 3.2 GWh Hunterston and
              Killingholme projects passed eligibility screening under the UK cap-and-floor revenue support regime.
              Despite these commercial advances, independent academic research highlights that compressor recycle loops
              and evaporator heat exchangers create substantial exergy losses, meaning long-term economic returns will
              depend heavily on ancillary grid service value and cap-and-floor floor payments.
