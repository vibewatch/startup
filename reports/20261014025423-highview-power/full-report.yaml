      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Round-trip efficiency drag and merchant wholesale vulnerability
            body: >-
              Liquid air energy storage faces an intrinsic thermodynamic efficiency hurdle, with AC-to-AC round-trip
              efficiency typically limited to 50% to 65%. In pure merchant power arbitrage, this round-trip energy loss
              requires wide off-peak to peak wholesale price spreads to break even after charging costs. Consequently,
              Highview Power's financial underwriting is heavily dependent on sovereign-backed cap-and-floor revenue
              certainty and contracted grid stability fees rather than uncontracted merchant power spreads.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, LAES Mechanism, and Asset Portfolio
        blocks:
          - type: paragraph
            body: >-
              Highview Power designs and deploys proprietary Liquid Air Energy Storage (LAES) infrastructure engineered
              to provide utility-scale, long-duration energy shifting and dynamic grid-stability services. At its core,
              the technology uses off-peak or surplus renewable electricity to clean, compress, and chill ambient air
              down to -196 degrees Celsius (-320 degrees Fahrenheit), where it condenses into a liquid stored at low
              pressure in insulated, double-walled stainless-steel tanks. When electricity demand rises or intermittent
              renewable output subsides, the liquid air is pumped to high pressure, heated using stored thermal energy
              or ambient heat, and expanded through multi-stage power recovery turbogenerators to supply dispatchable
              electricity back to the high-voltage transmission system. Unlike chemical battery installations that face
              critical mineral constraints and progressive electrochemical degradation, Highview LAES architecture
              relies on standard industrial turbomachinery and benign cryogenic storage with an anticipated operating
              lifespan exceeding thirty to forty years. The company core asset deployment is centered on the flagship
              Carrington project (GEN01X) at Trafford Energy Park near Manchester, structured as a 50MW output, 300MWh
              capacity commercial facility delivering six hours of continuous storage. Carrington development is
              supported by a £300 million financing package secured in June 2024, including £165 million in direct
              investment from the UK Infrastructure Bank (now National Wealth Fund) and £70 million from Centrica.
              Beyond Carrington, Highview has advanced proposed 3.2 GWh multi-facility installations at Hunterston in
              Scotland and Killingholme in Lincolnshire, both of which gained eligibility under the Ofgem cap-and-floor
              regime in early 2025.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE012
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
