      - number: '7.2'
        title: Thermodynamic, Efficiency, and Engineering Scaling Challenges
        blocks:
          - type: paragraph
            body: >-
              Liquid air energy storage faces fundamental thermodynamic constraints that directly threaten commercial
              dispatch economics. A comprehensive meta-analysis of cold thermal energy storage systems revealed that
              cold exergy losses exert up to seven times greater leverage over round-trip efficiency than equivalent
              heat losses. At Highview's pilot facilities, thermodynamic audits identified the recycle compressor and
              evaporator as the principal bottlenecks inducing irreversible cycle losses. Furthermore, scaling from the
              15MWh Pilsworth demonstrator to the 300MWh commercial plant at Carrington entails a twenty-fold volumetric
              expansion. In simulated models, theoretical efficiencies often look promising, but real-world cyclic
              operations, thermal leakage during standby, and partial-load throttling severely depress realized
              round-trip efficiency, creating revenue vulnerability in competitive merchant power markets.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
