      - number: '7.3'
        title: Regulatory Approvals, Planning Consents, and Policy Mechanism Dependencies
        blocks:
          - type: paragraph
            body: >-
              Statutory planning and regulatory frameworks present both near-term execution hurdles and structural
              revenue uncertainties. On a local level, Highview secured planning consent for the Carrington facility
              from Trafford Council under application reference 108006/FUL/22, with engineering statements confirming a
              thirty-year operating design life. Because liquid air storage utilizes benign ambient air without toxic
              chemicals or explosive hazards, environmental permitting risks remain considerably lower than chemical
              battery installations. However, on the national market level, Highview remains acutely dependent on the UK
              Department for Energy Security and Net Zero and Ofgem implementing a dedicated long-duration energy
              storage cap-and-floor support mechanism. Without guaranteed revenue floors, Highview cannot secure
              non-recourse project debt for subsequent pipeline projects on acceptable commercial terms.
            claimRefs:
              - CR005
              - CR009
              - CR011
