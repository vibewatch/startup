              The substantial reliance on £165 million of UKIB senior debt alongside strategic partner capital
              ring-fences asset-level risk at Carrington but leaves corporate-level equity holders exposed to
              subordination. Any commissioning delays, thermodynamic inefficiencies in compression, or cost overruns
              could divert cash flows toward debt service before parent-level returns materialize.
