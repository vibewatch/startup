  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Hierarchy and Capital Exposure
        blocks:
          - type: paragraph
            body: >-
              Highview Power's commercial viability centers on successfully transitioning from technology demonstration
              to utility-scale commercial infrastructure. The primary risk facing the business is extreme capital
              intensity combined with refinancing exposure across its project pipeline. While securing £300m in June
              2024 for the 50MW/300MWh Carrington project marked a major milestone, constructing the facility requires
              seamless execution across civil, cryogenic, and electrical work packages. Furthermore, Highview's broader
              strategy targets four subsequent facilities totaling 2.5GWh, demanding an estimated £3bn in capital
              expenditure. If Carrington suffers material delays or budget overruns, syndicated private capital and
              infrastructure lenders may refuse to finance follow-on sites, stranding development expenditures and
              compressing equity valuation.
            claimRefs:
