      - number: '8.4'
        title: Recommendation Synthesis and Diligence Roadmap
        blocks:
          - type: paragraph
            body: >-
              Fiduciary discipline dictates a recommendation of research-more with medium confidence and a high risk
              rating. While Highview Power demonstrated initial grid-scale operability with its 5MW Pilsworth
              demonstrator in 2018 and has attracted top-tier sovereign and industrial partners for Carrington,
              committing equity capital before commercial operation is premature. Critical gating milestones include
              verification of Carrington's operating round-trip efficiency, confirmation of Ofgem's final 2026
              cap-and-floor award decisions, and access to the corporate capitalization table. Until audited project
              revenues and private equity valuation multiples are established, investors should track project milestones
              rather than pricing unhedged equity exposure.
            claimRefs:
