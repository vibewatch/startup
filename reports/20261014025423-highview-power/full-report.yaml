        title: Exhibits
        blocks:
          - type: callout
            title: Absence of Distributed Customer Base Reflects Infrastructure Asset Business Model
            body: >-
              Standard SaaS or consumer adoption metrics such as net revenue retention, logo churn, or annual recurring
              revenue are fundamentally inapplicable to Highview Power. As a developer and operator of utility-scale
              infrastructure assets, Highview's customer base consists of single-counterparty sovereign institutions,
              regional grid operators, and regulated utility syndicates. Revenue security is defined by asset
              availability factors, capacity payments, and regulatory floor guarantees rather than enterprise seat
              renewal rates.
            calloutType: insight
            claimRefs:
