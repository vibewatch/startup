  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job / Application
      - Incumbent / Alternative Workflow
      - Highview LAES Solution
      - Measurable System Benefit
      - Operational & Technical Limitation
    rows:
      - - Bulk Long-Duration Energy Shifting
        - Pumped hydro storage or curtailed renewable power generation
        - Liquefaction of excess wind/solar electricity for multi-hour discharge
        - Provides 6 to 8+ hours of energy shifting without geographic or topological constraints
        - Round-trip cycle efficiency (55-60% target) lower than lithium-ion chemical batteries (~85%)
      - - Synchronous Grid Inertia Provision
        - Spinning fossil-fueled gas turbines (CCGT/OCGT) running at minimum load
        - Direct mechanical coupling of heavy synchronous generator on power expansion train
        - Delivers zero-carbon physical inertia and short-circuit current to stabilize grid frequency
        - Turbomachinery start-up ramp times (minutes) slower than instant battery inverter response (milliseconds)
      - - Transmission Constraint Relief
        - Grid reinforcement wires, line upgrades, or generator curtailment payments
        - Strategic co-location at transmission bottlenecks (e.g. SHEI or Scottish boundary)
        - Absorbs trapped local renewable generation and injects power during export capacity headroom
        - Requires high-voltage grid substation capacity and favorable regional transmission locational pricing
      - - Voltage Support and Reactive Power
        - Static VAR compensators or standalone synchronous condensers
        - Synchronous condenser operating mode with generator clutched to grid without expansion gas
        - Dynamic reactive power import/export and voltage control across transmission nodes
        - Standby parasitic auxiliary power consumption required to maintain cryogenic thermal readiness
    notes: Operating workflows reflect Highview Power technical whitepapers and NESO grid stability service definitions. Synchronous inertia operates independently of fossil combustion.
    claimRefs:
      - CE002
      - CE004
      - CE010
  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Architecture Stage / Subsystem
      - Primary Engineering Function
      - Key Equipment Dependency
      - Technical Bottleneck / Operating Risk
    rows:
      - - Air Intake, Compression & Pre-Treatment
        - Ambient air filtering, moisture/CO2 stripping, multi-stage compression to ~100 bar
        - Industrial centrifugal/axial compressors, desiccant dryers, thermal intercoolers
        - Compressor isentropic efficiency losses; fouling of air purification filters over continuous duty
      - - Cryogenic Liquefaction & Cold Recycle
        - Cryogenic heat exchange and expansion cooling down to -196°C liquefaction
        - Multi-stream plate-fin cryogenic heat exchangers, turbo-expanders, Joule-Thomson valves
        - Exergy destruction during throttling; heat transfer temperature difference across evaporators
      - - Low-Pressure Liquid Air Storage
        - Safe containment of cryogenic fluid at near-ambient pressure (-196°C)
        - Double-walled, perlite-insulated stainless steel cryogenic tanks and boil-off gas reliquefiers
        - Boil-off gas management during extended idle periods; cryogenic tank insulation thermal integrity
      - - Power Recovery Turbogenerator Train
        - High-pressure liquid pumping, regasification heating, and multi-stage expansion to generate power
        - Cryogenic booster pumps, air expansion turbines, heavy-rotor synchronous generator
        - Turbine aerodynamic efficiency under fluctuating inlet pressures; thermal fatigue under rapid cycling
    notes: Subsystem classifications derived from Highview Power engineering disclosures and published academic thermodynamic evaluations. Exergy destruction concentrated in compression and cold recycle.
