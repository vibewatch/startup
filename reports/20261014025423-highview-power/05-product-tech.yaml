chapter:
  number: 5
  title: Product & Technology
  summary: Highview Power develops grid-scale Liquid Air Energy Storage (LAES) systems using industrial turbomachinery and low-pressure cryogenic tanks to deliver 6 to 8 hours of long-duration discharge alongside synchronous inertia and dynamic voltage stability. The proprietary CRYOBattery architecture transitions from demonstration (5MW/15MWh Pilsworth pilot) to commercial utility scale (50MW/300MWh Carrington GEN01X), backed by £165 million from the UK Infrastructure Bank and eligibility under Ofgem cap-and-floor regime. Commercial viability depends on closing thermodynamic round-trip efficiency gaps and validating multi-stage turbomachinery integration under high-cycling grid dispatch conditions.
sections:
  - id: product-definition-and-modular-assets
    title: Product Definition, LAES Mechanism, and Asset Portfolio
    body: Highview Power designs and deploys proprietary Liquid Air Energy Storage (LAES) infrastructure engineered to provide utility-scale, long-duration energy shifting and dynamic grid-stability services. At its core, the technology uses off-peak or surplus renewable electricity to clean, compress, and chill ambient air down to -196 degrees Celsius (-320 degrees Fahrenheit), where it condenses into a liquid stored at low pressure in insulated, double-walled stainless-steel tanks. When electricity demand rises or intermittent renewable output subsides, the liquid air is pumped to high pressure, heated using stored thermal energy or ambient heat, and expanded through multi-stage power recovery turbogenerators to supply dispatchable electricity back to the high-voltage transmission system. Unlike chemical battery installations that face critical mineral constraints and progressive electrochemical degradation, Highview LAES architecture relies on standard industrial turbomachinery and benign cryogenic storage with an anticipated operating lifespan exceeding thirty to forty years. The company core asset deployment is centered on the flagship Carrington project (GEN01X) at Trafford Energy Park near Manchester, structured as a 50MW output, 300MWh capacity commercial facility delivering six hours of continuous storage. Carrington development is supported by a £300 million financing package secured in June 2024, including £165 million in direct investment from the UK Infrastructure Bank (now National Wealth Fund) and £70 million from Centrica. Beyond Carrington, Highview has advanced proposed 3.2 GWh multi-facility installations at Hunterston in Scotland and Killingholme in Lincolnshire, both of which gained eligibility under the Ofgem cap-and-floor regime in early 2025.
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE012
      - CE014
    tableRefs:
      - TE001
  - id: technical-architecture-and-cryobattery-process
    title: Technical Architecture and Cryogenic Process Engineering
    body: The proprietary CRYOBattery technical architecture is organized into three tightly integrated functional stages comprising charging and liquefaction, bulk cryogenic fluid storage, and power recovery expansion. During the charging stage, ambient air is filtered to remove particulate matter, desiccated to strip water moisture, and scrubbed of carbon dioxide before feeding an electrically driven multi-stage compressor train. Compression heat is extracted through intercoolers and diverted into thermal stores for subsequent re-use during power recovery. The pressurized air is chilled across cryogenic heat exchangers and expanded through a turbo-expander and throttling valves to produce liquid air. In the storage stage, liquid air is maintained at near-atmospheric pressure in modular cryogenic tanks, physically decoupling energy capacity from instantaneous power rating. In the discharge phase, cryogenic booster pumps repressurize the liquid, which passes through multi-pass evaporators to capture cold thermal energy into gravel or high-grade packed beds before superheating and expanding through multi-stage turbines to drive a synchronous generator. Independent academic thermodynamic analyses of Highview 5MW/15MWh Pilsworth pilot demonstrator established that recycle compressors and evaporators constitute the primary cycle bottlenecks, causing substantial exergy destruction. While theoretical design specifications project cycle round-trip efficiency between 55% and 60%, unoptimized pilot operations achieved only 8% electrical-to-electrical efficiency due to incomplete thermal and cold recycle integration, underscoring that commercial underwriting hinges on achieving high heat recovery rates in full-scale deployment.
    claimRefs:
      - CE001
      - CE005
      - CE008
      - CE009
      - CE011
