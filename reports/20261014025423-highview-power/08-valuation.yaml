callouts:
- calloutType: recommendation
  title: 'Diligence Posture: Maintain Research-More Stance Until Commercial COD'
  body: While Highview Power has assembled a formidable £300 million funding package led by the UK Infrastructure Bank and Centrica for its Carrington facility, private equity investors should not commit capital without verified corporate equity valuations and audited operational performance. The prudent investment decision is to track Carrington's 2026 commissioning and Ofgem's summer 2026 Cap and Floor awards.
  claimRefs:
  - CV001
  - CV004
  - CV008
  - CV013
- calloutType: risk
  title: Structural Subordination in Project-Financed Cleantech
  body: The substantial reliance on £165 million of UKIB senior debt alongside strategic partner capital ring-fences asset-level risk at Carrington but leaves corporate-level equity holders exposed to subordination. Any commissioning delays, thermodynamic inefficiencies in compression, or cost overruns could divert cash flows toward debt service before parent-level returns materialize.
  claimRefs:
  - CV001
  - CV005
  - CV007
  - CV011
