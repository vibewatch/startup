- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating & Policy Assumptions
  - Valuation / Return Logic
  - Key Downside Triggers
  - Probability Signal
  rows:
  - - Bull
    - Carrington commissions Phase 1 in 2026 on budget; Ofgem awards 6.4-GWh Cap and Floor contracts; international licensing scales
    - Project IRR exceeds 14%; corporate equity re-rates 3x–5x via infrastructure asset monetization and global licensing fees
    - Supply chain inflation on cryogenic vessels or compressor delivery delays
    - Low-to-Medium (dependent on summer 2026 Ofgem decision)
  - - Base
    - Carrington stability island achieves COD; ancillary and capacity market revenues meet debt service; Ofgem grants partial Cap and Floor support
    - Regulated equity returns of 8%–10%; steady project cash flows support incremental UK pipeline development
    - Prolonged commissioning trials or lower than modeled ancillary service tariffs
    - Medium-to-High (supported by £300m committed capital)
  - - Bear
    - Technical integration issues at Carrington; lower round-trip efficiency; Ofgem rejects multi-GWh Cap and Floor bids
    - Subordinated equity impaired; project debt absorbs cash flow; corporate parent requires dilutive rescue financing
    - Compressor or heat-exchanger failures; merchant power spread collapse
    - Low-to-Medium (cushioned by UKIB public sponsorship)
  notes: Scenarios model equity return sensitivities across commissioning execution and Ofgem 2026 Cap and Floor decisions.
