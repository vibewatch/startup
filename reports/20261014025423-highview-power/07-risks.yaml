callouts:
  - calloutType: risk
    title: Thermodynamic Exergy Degradation in Cold Thermal Storage
    body: >-
      Academic thermodynamic synthesis reveals that cold storage losses exert up to seven times greater leverage over
      liquid air round-trip efficiency than thermal heat losses, creating a severe operational bottleneck if packed-bed
      sensible storage fails to maintain thermal stratification under dynamic grid cycling.
    claimRefs:
      - CR003
      - CR004
  - calloutType: assumption
    title: Project Finance Pipeline Dependent on Carrington De-Risking
    body: >-
      Highview's planned £3bn, 2.5GWh expansion across four follow-on UK facilities assumes successful operational
      validation of the 300MWh Carrington site; any multi-quarter delay or significant capital cost overrun threatens
      investor syndication for subsequent commercial deployments.
    claimRefs:
      - CR001
      - CR002
      - CR010
