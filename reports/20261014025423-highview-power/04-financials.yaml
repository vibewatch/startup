callouts:
  - calloutType: risk
    title: Round-trip efficiency drag and merchant wholesale vulnerability
    body: >-
      Liquid air energy storage faces an intrinsic thermodynamic efficiency hurdle, with AC-to-AC round-trip efficiency
      typically limited to 50% to 65%. In pure merchant power arbitrage, this round-trip energy loss requires wide
      off-peak to peak wholesale price spreads to break even after charging costs. Consequently, Highview Power's
      financial underwriting is heavily dependent on sovereign-backed cap-and-floor revenue certainty and contracted
      grid stability fees rather than uncontracted merchant power spreads.
    claimRefs:
      - CI002
      - CI003
      - CI009
