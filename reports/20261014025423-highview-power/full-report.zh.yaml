        title: 展示材料
        blocks:
          - type: callout
            title: 尽调立场：在商业 COD 前维持“继续研究”立场
            body: >-
              Highview Power 已为 Carrington 设施筹集一套由 UK Infrastructure Bank 和 Centrica 领投、总额 £300 million
              的强大融资方案，但私人股权投资者在 没有经过验证的公司股权估值和经审计运营表现之前，不应投入资本。审慎的投资决定是跟踪 Carrington 2026 年调试进度以及 Ofgem 于 2026 年夏季 授予的
              Cap and Floor。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV013
          - type: callout
            title: 项目融资清洁技术中的结构性次级受偿
            body: >-
              Carrington 高度依赖 £165 million 的 UKIB 优先级债务及战略伙伴资本，这从项目资产角度隔离了风险，却让母公司股东暴露于次级受偿风险。
              任何调试延迟、压缩环节的热力学效率损失或成本超支，都可能在母公司实现回报之前，将现金流转向偿债。
