  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、LAES 机制与资产组合
        blocks:
          - type: paragraph
            body: >-
              Highview Power 设计并部署专有液态空气储能（LAES）基础设施，提供公用事业规模的长时能量转移和动态电网稳定服务。其核心技术利用非高峰或过剩可再生电力净化、压缩并将环境空气冷却至 -196
              摄氏度（-320
              华氏度），使其凝结成液体后，在低压双层不锈钢绝热罐中储存。当电力需求上升或间歇性可再生能源出力下降时，液态空气被泵至高压，利用储存的热能或环境热量加热，再通过多级功率回收涡轮发电机膨胀，将可调度电力送回高压输电系统。不同于面临关键矿产限制和逐步电化学衰减的化学电池，Highview
              LAES 架构依靠标准工业涡轮机械和温和的低温储存，预计运营寿命超过 30 至 40 年。公司的核心资产部署围绕曼彻斯特附近 Trafford Energy Park 的旗舰 Carrington
              项目（GEN01X），该商业设施输出 50MW、容量 300MWh，可连续储能 6 小时。Carrington 开发获得 2024 年 6 月落实的 £300 million 融资支持，其中包括 UK
              Infrastructure Bank 直接投资 £165 million 和 Centrica 投资 £70 million。除 Carrington 外，Highview 还推进了苏格兰 Hunterston
              和林肯郡 Killingholme 的 3.2 GWh 多设施项目，两者均于 2025 年初获得 Ofgem cap-and-floor 机制资格。
            claimRefs:
