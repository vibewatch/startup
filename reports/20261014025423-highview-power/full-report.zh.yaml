            - 与工业企业直接共址，提供清洁工业热能和电力
          outcome: 7.6 million homes potential power equivalent across 7 GWh+ portfolio
    approximationNotes: 该图基于 Highview 商业里程碑和 Ofgem 监管咨询框架，展示机构承购进程。
