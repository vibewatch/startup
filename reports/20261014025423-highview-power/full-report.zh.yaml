      - number: '3.3'
        title: 商业封装、cap-and-floor 经济性与监管护城河
        blocks:
          - type: paragraph
            body: >-
              长时储能的商业可行性高度依赖市场设计、合同结构和收入承销机制。在英国，仅靠商业批发电力套利长期以来不足以为高 CAPEX 长时资产融资。为弥合这一融资缺口，能源监管机构 Ofgem 引入具有里程碑意义的
              cap-and-floor 支持机制，为符合条件的储能开发商保障最低收入底价，同时限制超额上行以保护消费者。在初步筛选阶段，涵盖液态空气、压缩空气、抽水蓄能和先进电池的 77 个项目申请支持。Highview
              成功将其 3.2 GWh Hunterston 和 3.2 GWh Killingholme 项目推进至该计划第二阶段，目标是在 2026 年夏季获得最终监管奖励。这一监管顺风还得到 National
              Electricity System Operator 英国 Clean Power 2030 战略的强化；该战略要求部署 58 GWh 非电池储能，需要 £20 billion 资本，并配套 34 GWh
              短时电池容量。美国竞争者如 Form Energy 则选择不同的商业化路径，将 Department of Energy 资助与公用事业规模双边企业合同结合起来，例如 Form 与 Xcel
              Energy、Google 合作的 300 MW、100 小时部署项目。
