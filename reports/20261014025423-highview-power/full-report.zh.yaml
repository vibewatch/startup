  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这套决策流程把技术验证、主权融资评估、执行里程碑和股权估值纪律串起来，最终形成尽调建议。
    data:
      nodes:
        - id: n1
          label: 技术与示范
          detail: Pilsworth 5MW 示范项目在 BEIS 提供 £8m 支持的情况下，已运行并验证 15 年
        - id: n2
          label: 项目资本化
          detail: Carrington 已完成 £300m 融资，其中包括 UKIB 提供的 £165m 债务融资及 Centrica 的支持
        - id: n3
          label: 系统需求与政策顺风
          detail: NESO 已识别出 58 GWh 的 LDES 缺口；Ofgem 已授予 Cap and Floor 资格
        - id: n4
          label: 执行与技术风险
          detail: Carrington 预计于 2026 年投入商业运营，但 COD 仍待确认；压缩机和蒸发器在 300 MWh 规模下的效率上限尚未得到验证
        - id: n5
          label: 估值与结构不透明
          detail: 公司股权的投后估值尚未披露；母公司的资本结构瀑布仍属非公开信息
        - id: n6
          label: 决策闸门
          detail: 等待 Carrington 运营数据及 Ofgem 2026 年 Cap and Floor 最终授予结果
        - id: n7
          label: 建议：继续研究
          detail: 持续跟踪尽调；在投入资本前，必须取得经验证的股权估值
