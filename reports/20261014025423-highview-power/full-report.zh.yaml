          tone: positive
        - label: 2011：早期试点测试
          date: '2011'
          detail: 在 SSE 生物质场地完成初步低温技术测试，验证空气液化和电力回收。
          tone: neutral
        - label: 2018：Pilsworth 示范项目
          date: 2018-04
          detail: 在 BEIS 支持下，于 Bury 的 Pilsworth 垃圾填埋场正式启动 5MW/15MWh 商业化前 LAES 示范项目。
