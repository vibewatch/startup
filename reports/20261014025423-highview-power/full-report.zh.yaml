      - number: '5.4'
        title: 技术成熟度、商业化放大与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Highview 的技术成熟度经历了超过 18 年的发展，从大学分拆知识产权起步；自 2012 年以来，该知识产权获得 UK Research and Innovation（UKRI）和 Innovate UK
              超过 £2 million 的资助。其运营里程碑是 2018 年在曼彻斯特附近 Pilsworth 调试全球首座电网规模 5MW/15MWh 试点电站；该项目与 Viridor 共同开发，并由 £8
              million BEIS 创新资金支持。但从 5MW 示范单元扩展至 Carrington 的 50MW 商业机组和 Hunterston 的 2.5 GWh
              项目，代表着显著的工程放大系数。首要尽调风险包括快速热循环下的涡轮机械集成、低温蓄冷填料多年的衰减，以及辅助液化冷却回路的寄生电负荷。此外，Highview
              通过成熟涡轮机械供应商采购经过验证的工业压缩机和低温罐，供应链因此受益于现成设备，而非定制电池供应商；但大型低温膨胀机和高压电网变压器的交付周期，在全球供应链中仍然较长。商业投资判断需要 Carrington
              第一阶段经过核实的调试数据，以证明真实往返效率、可用率和响应爬坡速率符合合同及监管预测。
            claimRefs:
              - CE003
              - CE006
              - CE008
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双收入技术架构：能量转移与零碳惯量
            body: >-
              Highview Power 的核心技术差异化，在于将大规模能量转移与真正的同步电网稳定结合起来。不同于必须通过合成惯量软件模拟电网支持的基于逆变器的电池储能，Highview
              的功率回收机组采用重型旋转涡轮机械，无需燃烧化石燃料就能直接提供瞬时物理惯量、短路电流和动态电压控制。
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
          - type: callout
            title: 商业执行瓶颈：往返效率与热循环
            body: >-
              尽管理论 LAES 往返效率目标为 55% 至 60%，Pilsworth 的实证试验显示，未优化的热力学回收会显著降低往返效率，压缩机和蒸发器造成最大的火用破坏。Carrington
              的商业投资判断取决于能否在商业电网循环下达到预期的热回收和冷回收效率。
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与机构交易对手结构
        blocks:
          - type: paragraph
            body: >-
              Highview Power 面向的不是分散消费者或企业软件客户，而是中央电网基础设施交易对手、机构系统运营商、区域输电网络和批发电力市场参与者。主要买方是英国大不列颠 National Electricity
              System
              Operator（NESO）等国家输电系统运营商，它们寻求惯量、电压控制、短路贡献和快速调频等同步电网稳定服务。次级商业交易对手包括公用事业伙伴和能源聚合商，它们对接批发电力市场，捕捉高峰与低谷充电周期之间的套利价差。由于长时储能资产前期资本需求高，商业采用与政府支持的降风险机制紧密相连，例如
              UK Department for Energy Security and Net Zero 与 Ofgem 的 cap-and-floor 框架，该框架为项目收入提供底线保障。
            claimRefs:
