          touchpoints:
            - Pilsworth 垃圾填埋场双边共址协议
            - 与 GE Jenbacher 填埋气发动机集成
            - 聚合商向 National Grid 平衡储备调度试验
          outcome: 5 MW / 15 MWh operational validation of cryogenic charging and discharge
        - label: 第二阶段：项目资本募集
          stage: 第二阶段：项目资本募集
          actor: 主权与战略银团（UKIB、Centrica、Goldman Sachs）
          touchpoints:
            - 为 Carrington 商业资产募集 £300 million
