        - 若 Carrington 成本超支，投资者可能失去耐心或拒绝为后续 £3 billion、2.5GWh 管线提供资金
        - 严重
        - 广泛的投资者银团，包括主权财富资金（NWF/UKIB）及战略工业承购方（Centrica）
        - 对管线融资依赖度高
      - - 商业承购与电网平衡服务
        - National Grid ESO / KiWi Power / 公用事业公司
        - 电网约束管理、频率响应及稳定性合同
        - 高
        - 辅助服务收入出清价格不足，或缺少长期签约的保底价格
        - 高
        - 稳定岛能力可在不依赖化石燃料的情况下提供惯量、无功功率及黑启动
        - 对商用市场的暴露中等
      - - 区域规划与场地业主
        - Trafford Council / Carrington Estate
        - 邻近旧电站的 50MW/300MWh 商业设施场地主
        - 中
        - 施工扰乱、进场限制或当地环境缓解措施争议
        - 中
        - '规划许可于 2022 年获批（Trafford Council Ref: 108006/FUL/22），并获当地市长支持'
        - 场地许可剩余风险低
      - - 国际开发合作
        - Encore Renewable Energy (US)
        - Vermont 50MW/400MWh LDES 项目的联合开发伙伴
        - 中
        - 伙伴降低项目优先级，或当地公用事业公司对 SHEI 输电接口集成持观望态度
        - 中
        - 当地开发经验与 Highview 专有模块化架构结合
        - 国际增长执行风险中等
    notes: 评估关键战略、财务和运营交易对手，并按潜在失效情景的严重程度排序。
