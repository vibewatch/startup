            title: 主权支持的项目资本为首座商业电站降低风险
            body: >-
              £300 million 的 Carrington 融资由 UK Infrastructure Bank 注入 £165 million 并由 Centrica 参与，为 Highview Power
              首座首创长时储能电站提供了难得的资产负债表支持。但私人股权结构细节和最终项目股权回报仍未披露。
