      - number: '1.3'
        title: 资本结构、主权共同投资与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Highview Power 的融资模式高度依赖公私合作项目联合体，将主权信用支持、战略公用事业投资和机构私募资本结合起来。2024 年 6 月，Highview 获得 £300 million 融资，用于建设
              Carrington 电站；其中 £165 million 来自 UK Infrastructure Bank（现以 National Wealth Fund 名义运营），Centrica plc
              共同牵头。融资联合体还包括全球矿业公司 Rio Tinto、Goldman Sachs Power Trading、Kirkbi 和 Mosaic Capital。此外，Highview
              还为苏格兰稳定岛设施获得了 £130 million 专项融资。在英国本土市场之外，公司与日本 Sumitomo Heavy Industries
              保持国际授权和开发安排，并在澳大利亚推进项目开发。但公司层面的股权估值、股东回报分配瀑布以及母公司资产负债表储备仍属于严格保密的私人信息。
