      - number: '5.2'
        title: 技术架构与低温工艺工程
        blocks:
          - type: paragraph
            body: >-
              专有 CRYOBattery
              技术架构由三个紧密集成的功能阶段组成：充电与液化、大容量低温流体储存，以及功率回收膨胀。充电阶段先过滤环境空气以去除颗粒物，再干燥去除水分并清除二氧化碳，之后送入电驱动多级压缩机组。压缩热通过中间冷却器提取并转入蓄热装置，在功率回收时重复利用。加压空气在低温换热器中冷却，再通过涡轮膨胀机和节流阀膨胀，生成液态空气。储存阶段将液态空气维持在接近大气压的模块化低温罐中，使能量容量与瞬时功率额定值物理解耦。放电阶段由低温增压泵重新加压液体，液体经过多程蒸发器，将冷能捕获到砾石或高等级填充床中，随后过热并通过多级涡轮膨胀，驱动同步发电机。对
              Highview 5MW/15MWh Pilsworth 试点示范项目的独立学术热力学分析确定，回流压缩机和蒸发器是循环主要瓶颈，会造成显著火用破坏。尽管理论设计规格预计循环往返效率为 55% 至
              60%，未优化的试点运行因热回收和冷回收整合不完整，电到电效率仅达到 8%，说明商业投资判断取决于全面部署后能否实现较高的热回收率。
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
              - CE011
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE009
