            - 以同步调相机模拟惯量和电压支持
            - 通过 Pathfinder 稳定性采购资格审核
          outcome: Zero-carbon stability island operational from 2026 at Carrington
        - label: 第四阶段：受监管 Cap-and-Floor 扩张
