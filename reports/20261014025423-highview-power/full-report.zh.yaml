  - id: TV002
    title: 正论 / 反论表
    columns:
      - 支柱
      - 正论
      - 反论风险
      - 证伪触发条件
    rows:
      - - 战略护城河
        - 专有 LAES 技术可提供 300 MWh 长时储能和零碳电网稳定性，不受地理位置限制
        - 与锂离子技术相比，压缩机和蒸发器的热力学不可逆损失限制循环效率
        - 实测商业化往返效率低于项目融资模型要求
      - - 主权支持
        - UKIB 承诺 £165 million，加上 Ofgem Cap and Floor 资格，降低英国组合的资本回收风险
        - 没有长期政府收入承保，商用电价差仍不足
        - Ofgem 将 Hunterston 或 Killingholme 排除在 2026 年夏季最终 Cap and Floor 授予之外
      - - 市场机会
        - NESO 预计到 2030 年需要 58 GWh 非电池 LDES，以避免可再生能源弃电
        - 抽水蓄能或压缩空气等替代技术可能抢占主权支持额度
        - 电网接入延迟或输电通道瓶颈使英国 6.4 GWh 管线停滞
      - - 融资结构
        - UKIB、Centrica、Rio Tinto 和 Goldman Sachs 组成的联合体验证了项目层面的可融资性
        - 高额债务杠杆和项目层面隔离可能使股东处于次级地位
        - Carrington 项目成本超支会稀释公司股权，或触发债务现金清扫
    notes: 正论将项目开发优势与技术及市场投资判断风险进行对照。
