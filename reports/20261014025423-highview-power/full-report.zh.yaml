      - number: '5.3'
        title: 电网稳定流程、承购与系统收益
        blocks:
          - type: paragraph
            body: >-
              Highview Power 将 LAES
              定位为不仅是能源套利电池，也是提供关键电网稳定和输电韧性服务的零碳方案。随着英国和欧洲电网中的同步化石燃料发电逐步退役，输电系统运营商面临系统惯量、短路电流和动态电压控制的严重短缺。由于 Highview
              的膨胀机组采用重型旋转涡轮机械并连接同步发电机，即使不燃烧天然气或煤炭，也能提供真正的物理同步惯量和无功功率。Carrington 第一阶段将建设从 2026 年开始运营的专用稳定岛，为 National
              Electricity System
              Operator（NESO）持续提供电压支撑、约束管理和快速调频。该运营灵活性可帮助输电运营商缓解区域外送约束——例如北部输电接口的约束——并在风电、太阳能高发时段避免弃电。即使发电闲置，系统也能以同步调相机模式运行，将电网稳定收入与商品电价差脱钩。国际项目共同开发计划也验证了区域输电瓶颈是推动
              LAES 采用的首要商业流程，例如与 Encore Renewable Energy 在佛蒙特州北部达成的 50MW/400MWh 协议（用于缓解 Sheffield-Highgate Export
              Interface 约束），以及西班牙七个规划站点合计最多 2 GWh 的项目。
            claimRefs:
              - CE002
              - CE004
              - CE010
          - type: table
            tableRef: TE002
