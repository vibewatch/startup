      - number: '8.2'
        title: 正向论点、反向论点与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              核心投资论点建立在 Highview Power 的能力之上：在预计 30 至 40 年的运营周期内，不依赖关键矿产，提供零排放同步惯量、电压控制和长时能量转移。
              反向论点则指出，多兆瓦商业系统的往返效率尚未得到验证，热力学不可逆损失也持续存在。对试点测试数据的学术评估表明，压缩和再气化循环的效率 在物理上受到回收压缩机及蒸发器换热器损失的约束。此外，UK
              Department for Energy Security and Net Zero 明确承认，在商用电力市场框架下，
              长时电力储能面临严重的部署挑战；因此，商业化扩张取决于政府支持的收入底价机制，而不是无对冲的批发套利。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: 情景分析、回报门槛与估值逻辑
        blocks:
          - type: paragraph
            body: >-
              对 Highview Power 进行股权投资判断，需要为其英国开发管线建模三种截然不同的运营和监管结果。在乐观情景下，Carrington 于 2026 年按期完成一期调试， Ofgem 为 3.2-GWh
              Hunterston 和 Killingholme 项目授予 20 年期 cap-and-floor 收入合同，从而释放机构基础设施资本，支持 £2 billion 的扩张。 在基准情景下，Carrington
              实现商业运营并获得稳定的辅助服务合同，产生 8% 至 10% 的受监管项目回报，但仍需要追加公司层面资本。在悲观情景下， 热力学效率不足或调试延迟压低资产收入，使公司股权排在 £165 million 的
              UKIB 债务之后，并稀释老股东权益。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV011
