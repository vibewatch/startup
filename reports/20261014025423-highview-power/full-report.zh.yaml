      - CV003
      - CV005
      - CV006
      - CV007
      - CV010
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 运营与政策假设
      - 估值 / 回报逻辑
      - 主要下行情景触发因素
      - 概率信号
    rows:
      - - 牛市
        - Carrington 第一阶段于 2026 年按预算投产；Ofgem 授予 6.4 GWh Cap and Floor 合同；国际授权规模扩大
        - 项目 IRR 超过 14%；基础设施资产变现及全球授权费推动公司股权重估 3 倍至 5 倍
        - 低温容器供应链通胀或压缩机交付延迟
        - 低至中（取决于 Ofgem 2026 年夏季决定）
      - - 基准
        - Carrington 稳定岛达到 COD；辅助服务和容量市场收入足以偿债；Ofgem 提供部分 Cap and Floor 支持
        - 受监管股权回报率为 8%–10%；稳定的项目现金流支持英国管线逐步开发
        - 调试试验拖延，或辅助服务费率低于模型
        - 中至高（有 £300 million 承诺资本支持）
      - - 熊市
        - Carrington 出现技术集成问题；往返效率下降；Ofgem 拒绝多 GWh Cap and Floor 报价
        - 次级股权受损；项目债务吞噬现金流；公司母体需要稀释性救助融资
        - 压缩机或热交换器故障；商用电力价差崩溃
        - 低至中（UKIB 公共赞助提供缓冲）
    notes: 情景模拟调试执行及 Ofgem 2026 年 Cap and Floor 决策对股权回报的敏感度。
