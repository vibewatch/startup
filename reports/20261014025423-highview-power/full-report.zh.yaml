  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务分类与储能时长架构
        blocks:
          - type: paragraph
            body: >-
              电力储能市场按放电时长和电网服务能力形成结构性分化。以锂离子化学体系为主的传统电池储能，主要覆盖 1 至 4
              小时的短时应用，聚焦批发价套利和快速调频。但随着电力系统接入越来越多间歇性的海上风电和太阳能，平衡需求延伸至数小时、数天乃至数周；在持续深度循环下，锂离子方案会面临过高的经济成本和加速的电芯衰减。Highview
              Power 的液态空气储能（LAES）技术瞄准这一长时储能（LDES）运行窗口，将压缩液态空气储存在绝热罐中，提供从 6 小时到数周的可调度清洁电力。更关键的是，LAES
              不再局限于纯电化学储能，而是采用同步旋转设备，即使电站输出为 0
              MW，也能向输电网络提供旋转惯量、动态无功功率、电压控制和短路容量。该综合平台将大规模能量转移与关键稳定服务结合起来，后者过去主要由逐步退役的化石燃料火电厂提供。
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM010
      - number: '2.2'
        title: 市场规模视角：系统运营商目标与商业现实
        blocks:
          - type: paragraph
            body: >-
              评估长时储能的可服务市场，必须正视雄心勃勃的系统脱碳目标与商业部署约束之间的张力。在英国大不列颠，National Grid 预测，为维持可再生能源扩张下的网络稳定，电力储能总容量需从当前约 6 GW 提升至
              2030 年最多 29 GW、2050 年 51 GW。全球范围内，Long Duration Energy Storage Council 预计，完整建设净零电力系统到 2040 年可释放累计最多 4
              万亿美元资本投入，并带来 5400 亿美元的全系统运营效率。Bloomberg New Energy Finance 早期行业预测也预计，到 2030 年全球累计储能将达到 125 GW 和 305
              GWh。然而，独立市场追踪机构 Modo Energy 的自下而上部署数据表明，截至 2026 年，中国以外所有替代性非锂储能技术的运营容量仍低于 1 GWh。Highview Power
              的商业规模项目组合正好连接了两者：其 50 MW / 300 MWh 的 Carrington 电站是欧洲首个商业 LAES 项目，并支撑更广泛的 6.4 GWh 英国开发管线。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM007
      - number: '2.3'
        title: 买方分层、收入叠加与受监管的 cap-and-floor 机制
        blocks:
          - type: paragraph
            body: >-
              Highview Power 面对多类买方，市场格局由网络监管激励与系统运营商的专业需求共同决定。主要买方是英国 National Energy System
              Operator（NESO），其采购电网稳定、调频和约束管理服务，以缓解网络瓶颈和弃风。受监管的基础设施开发商和机构融资联合体——例如 UK Infrastructure Bank（现为 National
              Wealth Fund）、Centrica 和 Rio Tinto——既是项目共同投资者，也是寻求通胀对冲基础设施收益的承购方。该买方群体的政策催化剂是 Ofgem 的长时储能 cap-and-floor
              机制。该机制由 Ofgem 管理，设定有保障的毛利率底价，以降低高额前期资本成本和较长建设周期的风险，同时设置收入上限，将超额利润返还消费者。2025 年末，Ofgem 接受 Highview Power 的
              3.2 GWh Hunterston 和 3.2 GWh Killingholme 电站为符合该机制的项目，正式确立机构债务联合融资所需的收入架构。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 采用驱动、技术权衡与商业尽调缺口
        blocks:
          - type: paragraph
            body: >-
              低温能源储能的商业采用受到强烈结构性驱动，但也受严格的技术和财务约束。首要驱动是可再生能源弃电加剧：由于输电外送瓶颈，发电公司每年经常获得数十亿英镑补偿，以削减苏格兰风机发电，这催生了对可灵活选址储能的迫切需求，使其能够吸收过剩电力而不受地理限制。但
              LAES 面临成熟短时技术的激烈竞争。Modo Energy 的独立成本模型显示，在 8 至 10 小时放电时长以内，锂离子电池安装仍拥有明显的平准化储能成本优势，其功率 CAPEX 为 399 美元 /
              kW，能量 CAPEX 为 153 美元 / kWh。超过 10 小时后，LAES 等机械储能方案的成本竞争力逐步增强，其功率 CAPEX 约为 1,250 美元 / kW，能量 CAPEX 约为 80 美元 /
              kWh；按 Highview 预计约 40 年的资产寿命摊销时，成本约为每 MWh 110 英镑。更关键的是，对 Highview 试点设施的学术热力学分析显示，循环往返效率（通常为 60 至
              65%）受到压缩热回收和蒸发器温差的机械约束。此外，由于批发电力市场目前缺乏透明的多日商业时长定价，Highview 从根本上仍依赖受监管的底价机制来实现债务偿付覆盖。
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 同步稳定性使 Highview 脱离纯商品套利
            body: >-
              与主要依靠短时能量套利和调频的基于逆变器的锂离子电池不同，Highview Power 的机械旋转设备即使在 0 MW
              输出时也能提供真正的同步惯量和无功功率。公司因此可以从输电运营商处获取关键电网稳定合同，形成必要的非商品收入来源。
            calloutType: insight
            claimRefs:
              - CM006
              - CM010
          - type: callout
            title: 商业可融资性高度依赖受监管的底价机制
            body: >-
              中国以外全球替代性 LDES 的运营容量仍低于 1 GWh，且锂离子成本持续下降；仅靠商业批发电力市场，无法提供足够的多日价格信号来为数亿英镑级别的低温设施融资。长期商业执行从根本上依赖 Ofgem 的
              cap-and-floor 支持机制。
            calloutType: risk
            claimRefs:
              - CM005
              - CM008
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与架构类型
        blocks:
          - type: paragraph
            body: >-
              电网规模储能领域包含多种竞争性的物理和电化学架构，用于平衡不断增加的间歇性可再生能源。历史上，英国大不列颠和国际电网几乎完全依赖抽水蓄能，目前苏格兰和威尔士提供 2.8 GW
              的长时容量。但抽水蓄能扩张受到山地地形和数十亿英镑土建工程前置周期的严重限制。相比之下，短时电网平衡已被 Tesla Megapack 等锂离子电池系统占据；它们主导 4 小时以内的平衡和调频，却在连续放电超过
              8 小时时遭遇显著的经济、供应链和消防安全障碍。Highview Power 凭借专有液态空气储能，处于新兴的中长时储能领域，与 Form Energy 的多日铁空气开发项目及 Invinity Energy
              Systems 的钒氧化还原液流系统并列。              Highview 在获得由 UK Infrastructure Bank 领投、其中包括 £165 million 基石承诺的 £300
              million 融资包后，商业化速度加快；该联合体还包括 Centrica、Rio Tinto、Goldman Sachs、Kirkbi 和 Mosaic Capital，用于建设 300 MWh 的
              Carrington 资产。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
