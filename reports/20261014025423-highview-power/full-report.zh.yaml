      - number: '6.3'
        title: 管线扩张、承购框架与交易对手集中度
        blocks:
          - type: paragraph
            body: >-
              Highview 的商业扩张战略取决于开发纳入主权政策框架的多 GWh 基础设施资产。2025 年 11 月，Highview 筹集 £130 million，用于推进苏格兰北艾尔郡 Hunterston 的
              300 MW / 3.2 GWh 混合液态空气与电池储能设施；该设施旨在吸收受约束的苏格兰海上风电，并向英格兰高需求负荷中心调度清洁电力。此外，Ofgem 于 2025 年确认，Highview 在
              Hunterston 和 Killingholme 的 3.2 GWh 项目通过了英国长时电力储能 cap-and-floor 投资计划的资格筛选，正推进至计划于 2026 年夏季作出的最终投资框架决定。但
              Highview 面临严重的客户和监管集中：由于商业可行性完全依赖英国输电网络合同和政策监管底价，Ofgem 最终授予或并网执行出现任何延迟，都会直接威胁项目层面的承购安全。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
