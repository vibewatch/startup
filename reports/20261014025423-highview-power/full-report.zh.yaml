        - 在 2026 年电网稳定运营验证收入模式前，继续保持尽调暂缓
      - - 信心
        - 中
        - 已核实的 £300 million 公共债务 / 股权联合体，被未披露的公司股权估值部分抵消
        - 投入资本前，要求审阅股权结构表及转换条款
      - - 风险评级
        - 高
        - 资本密集型 FOAK 基础设施、压缩机 / 蒸发器效率限制及政策依赖
        - 要求后续吉瓦级项目获得主权或监管保底支持
      - - 估值立场
        - unknown
        - 私营企业价值与股价尚未核实；已披露 UKIB 的 £165 million 债务及 Sumitomo 历史上的 £35 million 轮次
        - 未核实公司母体负债审计前，拒绝投机性入场倍数
      - - 入场纪律
        - 按里程碑定价入场
        - Carrington 第一阶段稳定岛计划于 2026 年调试
