      - number: '8.4'
        title: 建议汇总与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              受托责任要求给出“继续研究”的建议，置信度为中等，风险评级为高。Highview Power 虽然在 2018 年凭借 5MW Pilsworth 示范项目展示了初步的电网规模 可运营性，也为
              Carrington 吸引了顶级主权和工业伙伴，但在商业运营前投入股权资本仍为时过早。关键闸门包括：验证 Carrington 的运营往返效率、 确认 Ofgem 2026 年最终 cap-and-floor
              授予决定，并取得公司股权结构表。在经审计的项目收入和私人股权估值倍数确定之前，投资者应跟踪项目里程碑，而不是为无对冲的股权敞口定价。
