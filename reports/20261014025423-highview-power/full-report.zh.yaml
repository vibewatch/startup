            - 按 NESO 58 GWh 非电池储能要求评估
            - 2026 年第二季度 / 夏季作出最终 Cap-and-Floor 费率授予决定
          outcome: Long-term guaranteed floor revenue underwritten by electricity consumers
        - label: 第五阶段：混合风电约束管理
