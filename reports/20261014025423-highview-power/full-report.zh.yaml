      - number: '1.4'
        title: 项目里程碑、监管进展与商业执行
        blocks:
          - type: paragraph
            body: >-
              Highview Power 的发展路径跨越二十多年，经历了持续的工程迭代、示范和商业化放大。2011 年完成初步试点验证后，公司于 2018 年 4 月在 Bury 启动 5MW/15MWh 的
              Pilsworth 示范项目，并获得英国政府 £8 million 资金支持，用于展示电网规模的平衡服务。2025 年 11 月，大曼彻斯特市长 Andy Burnham 在 Trafford Low
              Carbon Energy Park 为 Highview 的旗舰 50MW/300MWh Carrington 项目正式破土动工，目标是在 2026 年底前投入运营。就监管而言，Ofgem 确认
              Highview 提议的 3.2 GWh Hunterston 和 Killingholme 项目通过了英国 cap-and-floor
              收入支持机制的资格筛选，构成重大商业里程碑。尽管商业进展积极，独立学术研究指出，压缩机回流回路和蒸发器换热器会造成显著火用损失，因此长期经济回报将高度取决于辅助电网服务价值和 cap-and-floor
              底价付款。
