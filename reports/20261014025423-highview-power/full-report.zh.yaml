  - id: FE001
    title: 产品架构图
    type: stack
    summary: Highview Power CRYOBattery 液态空气储能系统的模块化功能架构。
    approximationNotes: 子系统层代表从进气到并网同步的功能工程流程阶段，依据商业化 50MW 电站设计编制。
    claimRefs:
      - CE002
      - CE005
      - CE012
      - CE014
    data:
      layers:
        - label: 环境空气进气与净化阶段
          detail: 通过多级环境空气过滤、干燥剂除湿和二氧化碳洗涤，避免低温冷却时干冰和霜堵塞。
        - label: 多级压缩与热捕获链
          detail: 电驱工业空气压缩机配合级间热交换器，捕获高温热能并储存在高温蓄热器中。
        - label: 低温液化与冷能回收
          detail: 板翅式低温热交换器和涡轮膨胀机将空气冷却至 -196°C，并利用此前电力膨胀时捕获的循环冷能。
        - label: 低压低温液态空气储存
          detail: 绝热双层不锈钢储罐在 1 bar 大气压下储存液态空气，将总能量容量与发电机容量解耦。
        - label: 低温加压与再气化蒸发器
          detail: 低温液泵先将液态空气加压至高工作压力，再送入回收冷能的填充床蒸发器。
        - label: 多级空气膨胀涡轮机
          detail: 高压和中压膨胀涡轮机利用储存的压缩热，从过热膨胀空气中回收机械功。
        - label: 同步发电机与电网稳定接口
          detail: 重转子同步发电机向输电网提供可调度电力、物理同步惯量、动态电压控制和无功功率。
  - id: FU001
    title: Highview Power 客户与承购旅程图
    type: journey-map
    summary: 从技术示范走向受监管基础设施承购的商业进程。
