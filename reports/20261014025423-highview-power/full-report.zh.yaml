          tone: neutral
        - label: 2024：Carrington £300 million 募资
          date: 2024-06
          detail: 获得 £300 million 融资，其中 UKIB 和 Centrica 领投 £165 million，用于建设 Carrington 商业 LAES 设施。
          tone: positive
        - label: 2025：Ofgem Cap and Floor 资格
