      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 缺乏分散客户基础，反映基础设施资产商业模式
            body: >-
              净收入留存率、客户流失率或年度经常性收入等标准 SaaS 或消费者采用指标，根本不适用于 Highview Power。作为公用事业规模基础设施资产的开发商和运营商，Highview
              的客户基础由单一交易对手的主权机构、区域电网运营商和受监管公用事业联合体构成。收入安全取决于资产可用率、容量付款和监管底价保障，而不是企业席位续费率。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: 对监管和政策框架的极端依赖
            body: >-
              Highview 的多 GWh 设施商业管线（包括 Hunterston 和 Killingholme）完全依赖 Ofgem 的 cap-and-floor 计划。如果 Ofgem 在 2026
              年夏季拒绝最终申请，或将底价设在低温设备所需门槛回报率以下，Highview 将无法获得无追索权债务融资，GW 级项目将陷入停滞。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 管理层风险层级与资本敞口
        blocks:
          - type: paragraph
            body: >-
              Highview Power 的商业可行性取决于能否成功从技术示范转向公用事业规模的商业基础设施。公司面临的首要风险是极高的资本密集度，以及整个项目管线的再融资敞口。2024 年 6 月为 50MW/300MWh
              Carrington 项目获得 £300 million 融资虽是重大里程碑，但电站建设需要土建、低温和电气工程包无缝执行。此外，Highview 的更广泛战略还计划建设总计 2.5GWh
              的后续四座电站，预计需要 £3 billion 资本支出。如果 Carrington 出现重大延误或预算超支，私募资本联合体和基础设施贷款方可能拒绝为后续场址融资，导致开发支出被套住并压低股权估值。
            claimRefs:
              - CR001
              - CR002
              - CR010
