              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 技术差异化与定位变化
        blocks:
          - type: paragraph
            body: >-
              Highview Power 的低温液态空气技术在多个物理维度上区别于电化学和地质储能方案。公司将环境空气冷却至零下 196 摄氏度，并在低压绝热罐中储存所得液体，其体积仅为大气状态的
              1/700，由此实现无需稀有矿产、有毒电解液或特殊采矿供应链的清洁、可灵活选址储能。液态空气基础设施使用标准涡轮机械和钢罐，运营寿命为 40 至 50 年且不存在循环衰减；相比之下，锂离子资产会容量衰减，并在
              10 至 15 年内需要强制增配电芯。此外，Highview
              集成同步稳定岛，直接向输电运营商提供物理电网惯量、短路强度和无功功率。不过，独立学术热力学评估显示，液态空气循环效率受到回流压缩机和蒸发器阶段火用损失的根本限制。锂离子往返效率超过 85%，而 Highview
              低于 60% 的热力学性能，使其容易受到 Form Energy 100 小时铁空气电池等多日化学储能的冲击；后者以往返效率换取多日时长下极低的资本成本。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
