      - number: '4.2'
        title: 成本结构、单位经济性与 CAPEX 驱动因素
        blocks:
          - type: paragraph
            body: >-
              低温储能的成本结构主要集中于前端压缩和液化基础设施，而非储能体积。独立工程基准显示，交钥匙 LAES 资本支出集中在充电链，占电站安装总成本的 35% 至 45%；模块化绝热低温罐占 15% 至
              25%，涡轮功率回收占 20% 至 30%。在公用事业规模下，8 至 12 小时放电时长的预计平准化储能成本（LCOS）为每 MWh 放电 120 至 200
              美元。主要热力学和财务约束是交流到交流往返效率，通常在 50% 至 65%
              之间。在纯商业套利中，这一效率损失要求非高峰到高峰之间存在足够大的批发价差，才能覆盖输入电力成本。热力学研究将回流压缩机和蒸发器确定为限制整体循环效率的关键设备，也突出了与工业余热共址、提升电站产出的经济价值。
