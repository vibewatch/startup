    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与技术架构
        blocks:
          - type: paragraph
            body: >-
              Highview Power 是一家总部位于英国的专业能源基础设施开发商，2005 年由大学孵化成立，专注于大规模液态空气储能（LAES）。公司在电力过剩时净化、冷却并将环境空气液化至 -196
              摄氏度，将低温液体储存在低压绝热罐中，再通过膨胀涡轮机重新气化发电，在需求高峰输出可调度电力。除实体储能外，Highview 还运营自有的 R2X
              电力系统分析平台，用于建模输电网络、评估本地电网约束并识别高价值项目地点。公司强调，LAES 系统可在实现长时能量转移的同时提供同步惯量、动态电压调节和黑启动能力，且不存在锂离子电池化学体系常见的化学衰减。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO014
