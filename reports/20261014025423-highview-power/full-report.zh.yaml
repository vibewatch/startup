      - number: '6.2'
        title: 商业部署证明：从示范项目到商业规模基础设施
        blocks:
          - type: paragraph
            body: >-
              Highview Power 的运营部署证明覆盖历史上的商业化前示范项目和当前在建的公用事业规模基础设施。其首个并网运营基准于 2018 年在 Bury 的 Pilsworth
              垃圾填埋气设施建立；该项目与废物管理公司 Viridor 合作开发，并由需求响应聚合商 KiWi Power 运营。5 MW / 15 MWh Pilsworth
              示范项目验证了热力学性能，并为英国电网提供现实环境下的平衡服务。2024 年 6 月，Highview 获得 £300 million 融资，用于其首座商业设施 Carrington 的建设；该项目位于曼彻斯特
              Trafford Energy Park，由 UK Infrastructure Bank 投资 £165 million，并有 Centrica、Rio Tinto、Goldman Sachs Power
              Trading、Kirkbi 和 Mosaic Capital 等战略共同投资者支持。Carrington 第一阶段重点建设从 2026 年开始运营的零碳稳定岛，标志着 Highview
              从试点试验迈向商业基础设施运营。
            claimRefs:
              - CU005
