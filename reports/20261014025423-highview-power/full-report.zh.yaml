      - number: '1.2'
        title: 管理层、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Highview Power 的治理和管理层结构，反映出公司正从工程驱动的研究项目转向资本密集型基础设施开发商。CEO Richard Butland 曾任 Goldman Sachs
              高管，拥有丰富的私募股权和能源投资经验，并促成了公司 £300 million 的商业项目联合融资。董事长 Colin Roy
              负责在不同工业和主权利益相关方之间提供机构化董事会监督与治理方向。这套商业化领导班子建立在前 CEO Gareth Brett 主导的技术放大工作之上；Brett 曾负责 5MW Pilsworth
              示范项目。Highview 对 Butland 存在较高的关键人物依赖，尤其涉及机构投资者协调、资本统筹，以及即将开展的 GW 级项目的多方联合融资管理。
            claimRefs:
              - CO005
              - CO008
              - CO010
