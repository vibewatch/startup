  name: Highview Power
chapter:
  number: 1
  title: Company Overview
  summary: Highview Power is a UK-based long-duration energy storage developer deploying proprietary liquid air energy storage
    (LAES) infrastructure and grid stability systems. Founded in 2005 as a university spin-off, the company secured a £300
    million project financing round in June 2024 anchored by the UK Infrastructure Bank and Centrica to build its 50MW/300MWh
    commercial plant in Carrington, Manchester. Highview is advancing toward 2026 commercial operations while progressing
    two 3.2 GWh multi-technology storage facilities under Ofgem's cap-and-floor regime.
sections:
- id: corporate-identity-and-architecture
  title: Corporate Identity, Foundation, and Technology Architecture
  body: Highview Power is a specialized energy infrastructure developer based in the United Kingdom, founded in 2005 as a
    university spin-off to pioneer large-scale liquid air energy storage (LAES). The company's technology operates by cleaning,
    chilling, and liquefying ambient air to -196 degrees Celsius during periods of surplus power, storing the cryogenic fluid
    in low-pressure insulated tanks, and regasifying it through expansion turbines to generate dispatchable power during demand
    peaks. Alongside physical storage, Highview operates its proprietary R2X power systems analytics platform to model transmission
    networks, evaluate local grid constraints, and identify high-value project locations. The company emphasizes that its
    LAES systems provide long-duration energy shifting alongside synchronous inertia, dynamic voltage regulation, and black
    start capabilities without the chemical degradation common in lithium-ion battery chemistries.
  claimRefs:
  - CO001
  - CO002
  - CO009
  - CO014
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Executive Leadership, Governance, and Key-Person Structure
  body: Highview Power's governance and executive management structure reflects its strategic transition from an engineering-led
    research venture to a capital-intensive infrastructure developer. The leadership team is headed by Chief Executive Officer
    Richard Butland, a former Goldman Sachs executive with extensive private equity and energy investment background who orchestrated
    the company's £300 million commercial project syndicate. Chairman Colin Roy provides institutional board oversight and
    governance direction across diverse industrial and sovereign stakeholders. This commercial leadership builds upon technical
    scale-up work previously overseen by former Chief Executive Gareth Brett, who directed the 5MW Pilsworth demonstrator.
    Highview maintains concentrated key-person dependence on Butland for ongoing institutional investor alignment, capital
    orchestration, and multi-party syndicate management across upcoming gigawatt-scale projects.
  claimRefs:
  - CO005
  - CO008
  - CO010
  tableRefs:
  - TO002
- id: capitalization-and-stakeholder-syndicate
  title: Capitalization Structure, Sovereign Co-Investment, and Stakeholders
  body: The financing model underpinning Highview Power relies heavily on public-private project consortia, combining sovereign
    credit support, strategic utility investment, and institutional private capital. In June 2024, Highview secured a landmark
    £300 million financing package to construct its Carrington facility, anchored by £165 million from the UK Infrastructure
    Bank (now operating as the National Wealth Fund) and co-led by Centrica plc. The financing syndicate also includes global
    mining corporation Rio Tinto, Goldman Sachs Power Trading, Kirkbi, and Mosaic Capital. Additionally, Highview secured
    £130 million in dedicated financing for a Scottish stability island facility. Outside the UK domestic market, the company
    maintains international licensing and development arrangements with Sumitomo Heavy Industries in Japan and project development
    initiatives in Australia. However, corporate-level equity valuation, shareholder return waterfalls, and parent balance
    sheet reserves remain closely held private information.
  claimRefs:
  - CO003
  - CO004
  - CO012
  - CO013
  tableRefs:
  - TO003
- id: milestones-and-commercial-execution
  title: Project Milestones, Regulatory Advances, and Commercial Execution
  body: Highview Power's developmental pathway spans more than twenty years of iterative engineering, demonstration, and commercial
    scaling. After initial pilot validation in 2011, the company launched its 5MW/15MWh Pilsworth demonstrator in Bury in
    April 2018, supported by £8 million in UK government funding to demonstrate grid-scale balancing services. In November
    2025, Greater Manchester Mayor Andy Burnham officially broke ground at the Trafford Low Carbon Energy Park on Highview's
    flagship 50MW/300MWh Carrington project, targeted for operational delivery by late 2026. On the regulatory horizon, Highview
    achieved a major commercial milestone when Ofgem confirmed that its proposed 3.2 GWh Hunterston and Killingholme projects
    passed eligibility screening under the UK cap-and-floor revenue support regime. Despite these commercial advances, independent
    academic research highlights that compressor recycle loops and evaporator heat exchangers create substantial exergy losses,
    meaning long-term economic returns will depend heavily on ancillary grid service value and cap-and-floor floor payments.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO010
  - CO011
  - CO015
