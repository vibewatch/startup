callouts:
- calloutType: insight
  title: Sovereign-Backed Project Capital De-Risks First Commercial Plant
  body: The £300 million Carrington fundraise, anchored by a £165 million capital injection from the UK Infrastructure Bank
    alongside Centrica, gives Highview Power rare balance-sheet backing for a first-of-a-kind long-duration energy storage
    plant. However, private cap-table details and ultimate project equity returns remain undisclosed.
  claimRefs:
  - CO003
  - CO004
- calloutType: risk
  title: Thermodynamic and Operational Bottlenecks in Pre-Commercial Scale-Up
  body: Independent academic exergy analysis indicates that compressor recycling and heat exchanger temperature differentials
    fundamentally constrain LAES round-trip efficiency. Commercial viability at Carrington will depend on demonstrating cost-effective
    grid services and capacity payments rather than pure wholesale energy arbitrage.
  claimRefs:
  - CO007
  - CO011
  - CO015
