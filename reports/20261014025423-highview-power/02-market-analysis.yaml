callouts:
  - calloutType: "insight"
    title: "Synchronous Stability Decouples Highview from Pure Commodity Arbitrage"
    body: "Unlike inverter-based lithium-ion batteries that compete primarily on short-duration energy arbitrage and frequency response, Highview Power's mechanical rotating machinery delivers genuine synchronous inertia and reactive power even at zero MW output. This allows the company to tap critical grid stability contracts from transmission operators, creating an essential non-commodity revenue stream."
    claimRefs:
      - "CM006"
      - "CM010"
  - calloutType: "risk"
    title: "Commercial Bankability Relies Heavily on Regulated Floor Mechanisms"
    body: "With global operational alternative LDES capacity remaining under 1 GWh outside China and lithium-ion costs continuing to compress, merchant wholesale power markets alone do not provide sufficient multi-day price signals to finance multi-hundred-million-pound cryogenic facilities. Long-term commercial execution is fundamentally dependent on Ofgem's cap-and-floor support mechanism."
    claimRefs:
      - "CM005"
      - "CM008"
      - "CM015"
