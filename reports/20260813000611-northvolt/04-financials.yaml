tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public value / status
  - Quality assessment
  - Diligence ask
  rows:
  - - Product sales
    - Sale of standardized battery system modules and cells
    - USD revenue
    - $91.1m in 2023 recognized revenue
    - Main monetization path is real, but still small versus installed asset base and financing stack
    - Request customer-by-customer volume, realized ASP, returns, and warranty reserve data
  - - Project sales
    - Customized battery-system and cell development work for long-term partners
    - USD revenue
    - $12.4m in 2023 recognized revenue
    - Indicates engineering/commercial engagement, but not yet scaled recurring cell sales
    - Request milestone schedule, acceptance triggers, and backlog conversion history
  - - Other revenue
    - One-off or adjacent sales, including raw materials
    - USD revenue
    - $24.9m in 2023 recognized revenue
    - Useful cash source, but blurs comparability with pure cell revenue
    - Request exact composition and whether any items are non-recurring
  - - Contracted automotive offtake
    - Long-term supply agreements tied to future production
    - Contract value / GWh
    - $53bn order book at end-2023; BMW 2020 contract alone was €2bn before cancellation
    - Strong demand proof, weak accounting conversion proof
    - Request surviving contracted volumes, cancellation rights, and minimum-purchase terms
  - - Bankruptcy-period liquidity support
    - Cash collateral and DIP financing to keep operations running
    - USD facility size
    - ~$245m total support at Chapter 11 start
    - Solvency support, not customer revenue
    - Separate restructuring liquidity from operating revenue in any model
  notes: The table separates recognized revenue from contracted demand and restructuring liquidity. Northvolt’s problem was not the absence of commercial interest; it was the weak conversion of that interest into high-volume, margin-bearing, reported sales.
  enumerationScope:
    coverage: partial
    basis: Rows cover the revenue and pseudo-revenue surfaces clearly visible in the fetched record and deliberately exclude unsupported private side deals or speculative future monetization.
