- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Public unit / contract basis
  - What is known
  - List vs realized pricing
  - Source-backed caveat
  - Implication
  rows:
  - - Product sales
    - Customer order quantity and fixed transaction price per order
    - Annual report says product sales use fixed transaction prices and recognize revenue on delivery
    - Realized ASP not public
    - Pricing exists contractually, but public pack gives no customer-level economics
    - Revenue visibility is better than margin visibility
  - - Project sales
    - Development component milestone pricing
    - Recognition occurs when customer accepts the delivered component
    - Realized pricing not public
    - Acceptance gating makes timing and cash conversion harder to infer from headline demand
    - Backlog cannot be treated as booked revenue
  - - Long-term automotive contracts
    - GWh or multi-year contract values
    - BMW contract value and broader order-book totals are public
    - Realized pricing unknown
    - Contract value does not reveal discounting, volume flex, or inflation pass-through
    - Contract headlines overstate underwriting clarity
  - - Northvolt Ett project finance
    - Debt underwritten partly against long-term offtake
    - January 2024 financing cites >$55bn offtake support
    - Not a sales price point
    - Lender comfort with demand does not prove plant-level gross margins
    - Financing bankability and earnings quality must be kept separate
  - - DIP financing and cash collateral
    - Court-approved restructuring facilities
    - Size and some terms are public
    - Not monetization
    - These facilities preserve optionality but do not create healthy operating margins
    - Post-petition liquidity should be modeled as bridge capital only
  notes: This table is explicit about what public sources do not disclose. The missing fields are underwriting-critical, especially because Northvolt’s model depended on long-qualification customer programs rather than instant spot sales.
  enumerationScope:
    coverage: partial
    basis: The rows reflect the monetization surfaces that recur in the fetched primary and secondary record and isolate where the public evidence stops short of realized price and margin.
