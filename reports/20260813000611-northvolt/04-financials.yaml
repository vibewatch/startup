- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / signal
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2023 adjusted gross loss
    - -$258m
    - high
    - Shows manufacturing and delivery economics were far from breakeven
    - Request gross margin by plant, customer, and chemistry
  - - 2023 adjusted EBITDA
    - -$569m
    - high
    - Captures heavy operating-cost burden before financing structure is considered
    - Request fixed vs variable cost bridge
  - - 2023 annual loss
    - -$1.168bn
    - high
    - Confirms losses accelerated faster than revenue growth
    - Request normalized loss excluding one-offs and hedging effects
  - - Net operating cash flow
    - -$792m in 2023
    - high
    - Best public burn proxy available from audited statements
    - Request monthly or quarterly cash burn during 2024
  - - Inventory cash absorption
    - -$444m change in inventories; $322m raw-material write-down
    - high
    - Suggests ramp inefficiency, raw-material exposure, and weak working-capital discipline
    - Request scrap, slow-moving inventory, and reserve policy by category
  - - Installed capacity vs recognized revenue
    - 16 GWh installed capacity and $128m revenue in 2023
    - high
    - Shows the gap between factory build-out and commercial conversion
    - Request shipped MWh, qualified lines, and utilization by quarter
  - - Realized cost per kWh
    - not public
    - low
    - Single most important missing driver of margin durability
    - Request standard cost, actual cost, and yield-adjusted cash cost
  - - Warranty / field-performance burden
    - not public
    - low
    - Battery contracts can look profitable before warranty and defect costs are recognized
    - Request reserve methodology and post-delivery quality claims
  notes: Public sources reveal enough to conclude the unit economics were weak, but not enough to calculate a trustworthy gross-margin curve. This table is intentionally conservative about metrics that are still unavailable.
  enumerationScope:
    coverage: partial
    basis: The table covers every unit-economic signal directly visible in the audited statements or closely linked official disclosures, while leaving unavailable private metrics blank rather than estimated.
