- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public amount / status
  - Source basis
  - Financial read-through
  - Diligence ask
  rows:
  - - Cash and cash equivalents at 2023 year-end
    - $2.134bn
    - Annual report IFRS consolidated cash balance
    - Large cash balance did not prevent later restructuring, implying a very high spending base and/or restricted use of funds
    - Request unrestricted vs restricted cash split and 2024 monthly burn
  - - 2023 capex invested
    - $1.804bn
    - Annual report key ratios and PP&E build-out
    - Capex intensity remained enormous relative to revenue
    - Request capex by site, committed but unpaid capex, and required sustaining capex
  - - 2024 project financing
    - $5bn non-recourse financing; includes $1.038bn EIB package
    - Official Northvolt and EIB releases
    - Shows creditor willingness to fund assets when order-book and policy support were still credible
    - Request full debt ranking, amortization, covenant package, and availability conditions
  - - Year-end 2023 debt-like liabilities
    - $3.767bn convertible loans plus ~$1.759bn interest-bearing borrowings
    - Consolidated statement of financial position
    - Equity sat under a very large debt and convertible stack before Chapter 11
    - Request maturity ladder and security package by instrument
  - - Chapter 11 liquidity support
    - ~$145m cash collateral plus $100m DIP
    - Official Chapter 11 communications; court-derived reporting adds term details
    - Bridge liquidity preserved options but did not recapitalize the enterprise
    - Request actual draws, unused availability, and budget compliance reports
  - - Parent schedule summary at Feb 2025 filing
    - $430.9m parent personal property; $4.598bn parent liabilities
    - Official schedule summary for Northvolt AB
    - Useful parent-level snapshot, but not directly comparable with prior consolidated IFRS figures
    - Request entity-by-entity crosswalk from 2023 IFRS accounts to debtor schedules
  notes: This table focuses on solvency and runway rather than the historical funding chronology already covered in Company Overview. The key point is that even very large headline capital raises did not translate into durable liquidity.
  enumerationScope:
    coverage: partial
    basis: The rows capture the most decision-useful capital and liquidity anchors visible in the public pack and intentionally separate consolidated accounting, project finance, and parent-debtor filing views.
