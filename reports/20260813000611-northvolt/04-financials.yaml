- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Realized ASP by customer and chemistry
    - Needed to test whether green/localized positioning earned any price premium
    - Contract values and order-book headlines only
    - Revenue quality remains underdetermined
    - Obtain top-10 customer contracts and invoice-level pricing bridge
  - - Yield, scrap, and utilization by line
    - Determines material loss, labor absorption, and gross-margin slope
    - Inventory build, write-downs, and later yield-improvement claims
    - Cannot underwrite unit economics credibly
    - Obtain plant KPI dashboard by month for 2023-2025
  - - Unrestricted cash and weekly liquidity at petition date
    - Distinguishes survival runway from restricted project funds
    - Chapter 11 support package size and 2023 cash balance
    - Runway cannot be estimated tightly
    - Obtain 13-week cash flow and cash-control reports
  - - Maturity ladder and collateral ranking by instrument
    - Decides who sits ahead of equity and how much refinancing pressure existed
    - Broad debt, convertible, and DIP totals are public
    - Recovery analysis and covenant stress testing remain weak
    - Obtain debt register, security package, and intercreditor agreements
  - - Customer cancellation rights and take-or-pay protections
    - Determines how much of the order book was truly financeable
    - BMW cancellation and >$55bn offtake references
    - Contracted demand may be overstated as cash-flow support
    - Obtain offtake schedules, termination clauses, and flex-volume terms
  - - Warranty, recalls, and quality-cost reserves
    - Battery defects can destroy later cash conversion
    - No public reserve bridge available
    - Public gross-loss figures may understate future claims burden
    - Obtain reserve roll-forward and failure-rate metrics
  notes: The missing metrics are not cosmetic. They are the difference between a dramatic but financeable ramp and a structurally uninvestable manufacturing model.
  enumerationScope:
    coverage: partial
    basis: The table lists the minimum private metrics needed to convert the public record into a serious underwriting model, with emphasis on the exact data that would resolve the largest open questions.
