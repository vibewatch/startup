  evidenceGaps:
  - id: GI001
    title: Petition-date unrestricted cash and runway remain opaque
    description: Public sources show the size of the DIP and cash-collateral package but do not provide a clean unrestricted-cash figure or an approved 13-week runway bridge by legal entity.
    relatedQuestionRefs:
    - QI025
  - id: GI002
    title: Customer-level pricing and take-or-pay mechanics are not public
    description: Contract values and order-book totals exist, but realized ASPs, rebates, minimum-volume protections, and margin by customer are not disclosed in the fetched record.
    relatedQuestionRefs:
    - QI026
  - id: GI003
    title: Plant-level yield, scrap, and utilization curves are still missing
    description: Public evidence supports weak unit economics and later improvement, but not the monthly KPI series needed to test whether improvement was fast enough to save the business.
    relatedQuestionRefs:
    - QI024
