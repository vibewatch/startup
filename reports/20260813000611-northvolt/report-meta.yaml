companyProfile:
  summary: >-
    Northvolt was established in 2016 in Stockholm to build a European battery champion spanning cells,
    industrialization, recycling, and regional supply-chain localization. Its operating footprint centered
    on Northvolt Ett in Skellefteå, Northvolt Labs in Västerås, and Northvolt Dwa in Gdańsk, with major
    projects in Heide and Quebec. By early 2024 the company had raised roughly $15 billion and cited more
    than $55 billion of customer orders, but 2023 financials still showed weak manufacturing economics.
    After a September 2024 strategic review, Northvolt entered U.S. Chapter 11 in November 2024, then
    Swedish bankruptcy in March 2025. By 2026 the best public description is not an intact private scale-up
    but a distressed industrial and technology platform whose most valuable assets were being transferred to
    successor owners.
