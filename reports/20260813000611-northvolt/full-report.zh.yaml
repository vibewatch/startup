      - number: '2.4'
        title: 供应集中、政策与不利经济性
        blocks:
          - type: paragraph
            body: >-
              艰难的结论是：欧洲有一个战略重要的电池市场，但还没有一个宽容的电池产业。欧盟官方页面强调《电池法规》和《关键原材料法案》是增强自主性、可持续性和韧性的工具，但同样的公开来源也承认材料供应深度依赖进口且高度集中。IEA
              还补充说，中国仍主导锂和钴加工，并掌握近 85% 的电芯制造产能；美国则在税收抵免下快速扩产。Northvolt 2025 年停摆随后展示了这些结构压力的实践含义：到流程末尾，Scania 是 Ett
              唯一剩余客户，未充分利用的产能已变得过于昂贵，最明显的替代方案是 CATL 相关进口，或 Volkswagen 的 PowerCo 网络这类 OEM
              控制工厂。换句话说，市场存在，但欧洲独立厂商仍必须在良率、资本成本、化学体系组合和客户信心上跨过残酷门槛。
