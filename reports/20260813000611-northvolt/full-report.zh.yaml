  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持继任资产平台价值的情景区间，但不支持遗留普通股获得正回收。
    data:
      items:
        - label: 悲观继任价值
          low: 300
          mid: 500
          high: 800
          unit: USD million
        - label: 基准继任价值
          low: 900
          mid: 1400
          high: 1800
          unit: USD million
        - label: 乐观继任价值
          low: 2500
          mid: 3200
          high: 4000
          unit: USD million
        - label: 战略资产名义价值
          low: 4500
          mid: 5000
          high: 5000
          unit: USD million
    approximationNotes: 这些是示意性的、对证据敏感的继任方价值区间，以公开可比公司合理性校验和困境交易报道为锚。遗留普通股回收在所有展示情景中仍为零。
    claimRefs:
      - CV006
      - CV007
      - CV021
      - CV028
      - CV029
      - CV030
      - CV031
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 从遗留股权故事与继任资产观察清单项两种视角，看 Northvolt 当前状态的投委会式快照。
    data:
      items:
        - label: 遗留股权可回收性
          value: Very low
          note: 破产和资产转移主导旧股权结构
        - label: 继任资产吸引力
          value: Medium
          note: 战略买家证明幸存资产仍有相关性
        - label: 融资清晰度
          value: Low
          note: 完整分配瀑布和重启融资工具仍有部分未公开
        - label: 新所有权下的客户验证
          value: Low
          note: 历史客户 logo 还在，但重新签约需求还不够可见
        - label: 风险评级
          value: Critical
          note: 法律、财务和运营包袱仍然很重
        - label: 当下进入吸引力
          value: Very low
          note: 只有新的、干净的资产支持型证券才可能改善这一项
    claimRefs:
      - CV001
      - CV022
      - CV025
      - CV026
      - CV027
      - CV038
      - CV040
