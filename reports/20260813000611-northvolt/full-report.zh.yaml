        title: 破产后的连续性与重置
        blocks:
          - type: paragraph
            body: >-
              Northvolt 的客户故事没有在破产线前干净结束；它碎片化了。官方 Chapter 11 材料称客户交付会继续，瑞典破产申请仍指向近期产出和客户交付里程碑。但第三方报道显示，Scania 转向
              CATL，NOVO 在寻找新技术伙伴期间暂停，Northvolt 更广的客户连续性问题已从销售增长转向救援和资产转移。Lyten 2025
              年收购公告随后称，与此前锚定客户的合作正建设性推进；后续报道又称，Lyten 最初会继续为继承的 Northvolt 产线相关客户生产锂离子产品。NOVO 和 Volvo 相关的直接更新也显示，即使原先
              Northvolt 相关运营模式暂停或休眠、等待新技术伙伴，Gothenburg 的 OEM
              电池雄心仍存续。正确结论不是客户需求消失，而是关系图在破产和新所有权下被重置。公开层面，客户基础更多作为可转移战略需求存续，而不是作为稳定的独立 Northvolt 账户簿存续；这比正常留存弱得多。
