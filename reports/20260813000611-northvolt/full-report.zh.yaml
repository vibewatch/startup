      - number: '8.2'
        title: 破产清偿顺位，以及旧股权为何看起来受损
        blocks:
          - type: paragraph
            body: >-
              公开记录里最强的估值证据是负面的。Northvolt 自身重组材料显示的是过桥流动性，不是增长资本。 已提交的附表明确提醒，这些材料不是合并 IFRS 或 GAAP
              报表，不应被当作企业价值来读。随后法律报道显示， 美国程序走向驳回，瑞典破产管理人程序接管核心资产。关键在于，公开观察者能看到负债、应急融资和出售机制，
              却看不到旧普通股能排在所有索赔之上获得回收的清晰路径。零散交易标记也在强化这一点。ElevenFlo 对 Hydrovolt 和 Industrials
              业务交易的摘要表明，破产接管后，价值是通过具体资产出售和负债承接被变现，而不是通过整体股权恢复故事被释放。 旧控股公司或许仍作为历史存在，但公开证据不支持把它当作可投资证券。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV024
              - CV032
