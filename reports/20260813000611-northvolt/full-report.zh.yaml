    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与现状
        blocks:
          - type: paragraph
            body: >-
              理解 Northvolt，首先要把它看作工业电池平台，而不是软件式增长公司。官方材料一贯说，这家公司 2016 年创立于 Stockholm，目标是为汽车和储能客户制造可持续锂离子电池，生产体系由
              Skellefteå 的 Northvolt Ett 和 Västerås 的 Northvolt Labs 承托。到 2023
              年底，公司已有经审计收入、经审计员工数、已安装产能和披露订单簿，这让它不同于许多概念阶段的电池公司。它的版图也更广，覆盖波兰的电池系统，以及德国和 Quebec 的开发项目。但 2026 年的“现状”与 2023
              年的增长叙事根本不同：2024 年末 Chapter 11 和 2025 年 3 月瑞典破产之后，公开资料指向的是一个被拆分的资产平台，瑞典资产转入 Lyten，旧 Northvolt
              股权故事已不再是正常持续经营承销案例。
