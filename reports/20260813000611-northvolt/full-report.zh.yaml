companyProfile:
  summary: >-
    Northvolt 2016 年在 Stockholm 成立，目标是打造横跨电芯、工业化、回收和区域供应链本地化的欧洲电池冠军。运营版图以 Skellefteå 的 Northvolt Ett、Västerås 的
    Northvolt Labs 和 Gdańsk 的 Northvolt Dwa 为中心，并在 Heide 和 Quebec 推进大型项目。到 2024 年初，公司已累计融资大约 $15 billion，并称客户订单超过 $55
    billion，但 2023 年财务数据仍显示制造经济性偏弱。2024 年 9 月战略复盘后，Northvolt 于 2024 年 11 月进入美国 Chapter 11，随后在 2025 年 3 月进入瑞典破产。到 2026
    年，最准确的公开描述已不是一家完整的私营扩张型公司，而是一个陷入困境的工业与技术平台，最有价值的资产正被转给继任所有者。
