  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与披露质量
        blocks:
          - type: paragraph
            body: >-
              到 2023 年，Northvolt 已不是没有收入的科学项目，但距离自我供血的工业公司仍很远。年报显示，公司确认收入 $128.3 million，其中产品销售 $91.1 million、项目销售 $12.4
              million，原材料销售等其他收入 $24.9
              million。这一组合很重要，因为它意味着销售仍部分绑定工程工作、一次性项目和早期交付活动，而不是成熟的大批量电芯业务。同一份报告还显示，项目销售收入只有在独立开发组件交付并被客户接受后才确认，意味着即使商业关系存在，客户资格认证关口也会拖慢会计转化。公开来源对订单簿标题和具名交易对手很强，但对实际平均售价（ASP）、照付不议保护、保修准备、返利机制和客户层面盈利能力很弱。因此财务故事不是“没有收入”，而是“收入太小、太不透明，也太依赖资格认证，无法用来承销这样规模的制造平台”。
            claimRefs:
              - CI001
