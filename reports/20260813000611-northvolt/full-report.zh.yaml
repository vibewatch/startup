  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 组合、化学体系与公开产品定义
        blocks:
          - type: paragraph
            body: >-
              对一家常被简单称作欧洲 EV 电池创业公司的企业而言，Northvolt 的公开产品面异常宽。产品页列出三类电芯化学体系——锂离子、钠离子和锂金属——以及 Voltpack Core、Voltpack
              Mobile System、Voltrack 等系统级产品。核心商业平台仍是锂离子：官方电芯页面描述了 NMC 化学体系、方形电芯形态、定制化设计，以及意在覆盖多种应用的通用架构。Northvolt
              自己的产品页也清楚地区分成熟度。锂离子是当前生产平台；钠离子是面向储能、成本更低且不依赖关键金属的技术；锂金属仍是与 Cuberg 相关、面向先进移动场景的选项。因此，尽调中安全的解读不是 Northvolt
              只有一个电池产品外加可选相邻业务，而是它在搭建一个分层组合：一个相对成熟的化学体系、一个样品阶段的储能化学体系、一个验证阶段的航空 / 高性能移动化学体系，以及围绕它们的多个系统级封装产品。
