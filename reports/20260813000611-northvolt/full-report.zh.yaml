            body: >-
              如果把 Northvolt 的采用路径看作一串锚定里程碑，而不是传统客户数量曲线，它显得可信。公开弧线从 2018 年 Scania 开始，随后是 2019 年 Volkswagen 的合资与投资、2020 年
              BMW 的 €2 billion 合同、2021 年 Fluence 的储能合作，以及 Volvo Cars 的电池开发 / 合资关系。2022 年又跨过一个重要验证门槛：Northvolt 称 Ett
              向一家领先欧洲车企完成首次商业交付。到 2023 年，年报仍显示 $53 billion 订单簿；到 2024 年 1 月，Northvolt 称长期承购超过 $55
              billion。这些是强采用信号，但它们都经过很长的工业漏斗过滤：合同和战略联盟早于稳定量产很久就已存在。因此，公开故事是商业牵引有意义但兑现延迟，而不是市场兴趣浅。
