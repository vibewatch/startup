          type: process
          detail: $1.8bn 年度资本开支和庞大 PP&E 基础带来沉重折旧负担
        - id: gross-loss
          label: 毛亏
          type: output
          detail: 2023 年调整后毛亏为 $258m
        - id: cash-burn
          label: 现金消耗
          type: output
          detail: 2023 年经营现金流净额为 -$792m
      edges:
        - from: materials
          to: yield
          label: 波动 + 报废风险
        - from: yield
          to: inventory
          label: 转化差会困住现金
        - from: inventory
          to: fixed-cost
          label: 低吞吐拖累成本吸收
        - from: fixed-cost
          to: gross-loss
          label: 成本超过可变现产出
        - from: gross-loss
          to: cash-burn
          label: 亏损和营运资本消耗现金
    approximationNotes: 这座桥使用定性流程节点，因为 Northvolt 没有披露每 kWh 成本、良率或工厂利用率曲线。它凸显了最关键的财务机制。
