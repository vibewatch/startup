      - number: '1.4'
        title: 困境、重组与 2026 年位置
        blocks:
          - type: paragraph
            body: >-
              负面时间线现在和增长时间线一样重要。Northvolt 2024 年 9
              月的战略复盘明确把公司收窄到大规模电芯制造，将部分上游和正极资产置于维护状态，围绕系统业务启动合作伙伴流程，并警告大型项目时间线可能调整。两个月后，公司在 Texas 进入 Chapter
              11，称可通过现金抵押和债务人占有融资获得约 $245 million 新流动性，同时维持运营。官方法院与 FAQ 材料显示，德国和北美业务不在 Chapter 11 边界内，但美国程序没有解决资本问题。2025
              年 3 月，Northvolt AB、Ett、Labs、Revolt 和 Systems 进入瑞典破产，公司自己列出的原因包括资本成本压力、需求变化、供应链问题和内部爬坡困难。到 2026 年，关键公开证据集中在
              Lyten 接手主要瑞典资产，以及运营价值从旧 Northvolt 公司股权迁出。
