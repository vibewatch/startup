      - number: '5.3'
        title: 信任、质量、安全与循环控制
        blocks:
          - type: paragraph
            body: >-
              在 Northvolt 的公开记录里，质量与信任机制最扎实的部分，是它们和制造工艺、测试、回收交汇的地方。Northvolt Labs
              称其拥有性能和寿命设施，以及面向国际标准合规的安全和环境验证能力。Revolt
              又增加了一层异常细的循环性：官方页面描述了机械处理与湿法冶金结合的工艺、黑粉回收、高收率锂回收、电池级镍锰钴回收，以及面向生产废料、寿命终止电池包和召回的大规模处理。公司也选择性公开系统信任信号。Voltrack
              被描述为通过 UL 1973 认证；Cuberg 的锂金属模组由 TÜV SÜD 做第三方验证，并明确连接到 FAA 导向的认证工作。缺失的是 Northvolt
              主流锂离子电芯的完整公开信任档案：没有广泛公开的循环寿命表、现场故障历史、保修损失披露，或横跨主要汽车客户的资格认证矩阵。因此，信任故事有分量但不对称——流程、回收和部分先进技术验证很强；完整商业电芯性能档案较弱。
