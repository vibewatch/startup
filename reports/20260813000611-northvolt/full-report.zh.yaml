  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与需求底线
        blocks:
          - type: paragraph
            body: >-
              不应把 Northvolt
              放进所有电气化支出来估算。相关市场是合格电芯及紧密相连的系统，卖给欧洲汽车和固定式储能项目；采购团队看重成本、安全、可靠性、碳足迹和供应韧性。这个边界排除了大部分上游采矿和精炼经济性、整车收入、充电基础设施和电力市场软件。公共政策仍然重要，因为欧洲继续把电池描述为气候中和、循环性和工业自主的战略环节；公开市场数据也显示终端需求是真实的：IEA
              称 2024 年 EV 和储能电池需求达到 1 TWh，ACEA 显示 2026 年 Q1 欧盟纯电注册量重新增长。因此需求底线真实存在，但它比泛清洁技术 TAM
              说法更窄，也不保证一家独立欧洲生产商能赚到有吸引力的利润率或轻松融资。
