      - number: '5.2'
        title: 从 Labs 到超级工厂的工业化架构
        blocks:
          - type: paragraph
            body: >-
              Northvolt 技术栈的核心不是单一化学体系主张，而是把电芯从设计推到验证样品，再推到制造转移，最终进入商业生产的工作流。Northvolt Labs 是这条链中的核心资产。官方 Labs
              材料称，电芯开发项目会经历电芯设计、样品生产、优化、验证和最终设计，再进入超级工厂量产。历史 Labs 材料还补充说，基地不是为大规模生产而建，而是为电芯工业化而建：它有一条 350 MWh 产线，设备家族与
              Northvolt Ett 相同但自动化程度较低，并为操作员、工艺工程师和维护团队提供训练场。公开的首颗电芯和首批交付材料随后把这条工作流首尾相接：首颗 Ett 电芯为方形，在 Labs 开发；Northvolt
              称 Labs 已花费多年设计、验证并工业化后来从 Skellefteå 出货的电芯。结果是一套连贯的工业化架构：Labs 负责产品和工艺成熟，Ett
              放大通过资格认证的设计，只有转移跑通后，系统或客户才收到电芯或电池包。
