  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Northvolt 的核心风险始终是执行，但到 2024
              年末，执行失败已经扩散成法律、客户、融资和治理压力。公司仍有真实需求、重大公共背书，并在欧洲电池叙事中占有战略位置；但这些优势也放大了压力，因为资本结构、客户预期和政策承诺都假设 Northvolt
              的产能爬坡比实际更快、更干净。官方美国 Chapter 11 申请只通过现金抵押和 Scania 提供的 DIP
              融资买来很短跑道；随后的瑞典破产和分拆资产出售则显示，破产保护没有恢复可行的独立均衡。投资者因此应按以下顺序排列剩余风险：制造经济性和质量第一，流动性与债权人控制第二，集中合作伙伴 /
              客户依赖第三，安全和监管责任第四，人员 / 治理执行第五。这些风险在纸面上彼此独立，但在实践中紧密耦合。
