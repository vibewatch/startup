      - number: '2.3'
        title: 买方、化学体系与采用路径
        blocks:
          - type: paragraph
            body: >-
              Northvolt 面向几个相连但不同的采购中心销售。乘用车 OEM 和商用车制造商通过很长的资格认证周期采购，流程由采购、工程和合规团队主导；公用事业、开发商和 EPC
              采购储能电芯时，逻辑则围绕项目经济性、保修和融资。现在，化学体系选择和买方类型一样重要。IEA 数据显示，2024 年 LFP 几乎占全球 EV 电池市场的一半，在欧盟 EV 市场提高到 10%
              以上，且仍显著便宜于 NMC；IEA 更广的电池分析还说，2023 年 LFP 已占新储能应用的 80%。这让市场不利于主要围绕更高成本 NMC 爬坡的欧洲优先命题。Northvolt
              自己的钠离子公告也强化了这一点：管理层已经把下一代储能定位在丰富材料和价值链独立性上，意味着最有吸引力的储能市场，也是化学体系扰动和成本压力最强的细分。
