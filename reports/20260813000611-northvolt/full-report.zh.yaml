      - number: '8.4'
        title: 公开可比公司校验与区间纪律
        blocks:
          - type: paragraph
            body: >-
              公开电池股可比公司不能直接给 Northvolt 定价，但能约束估值区间。截至 2026 年 8 月 12 日， StockAnalysis 及相关市场数据页面显示，QuantumScape 市值约
              $3.9-4.0 billion，Enovix 约 $1.0 billion， Solid Power 约 $0.54 billion，SES AI 约 $0.21
              billion。这些都是仍在交易、具备流动性的公开证券， 股权结构透明度也比破产后的 Northvolt 更干净。含义不是 Northvolt 应该与其中任何一家完全同价交易；
              而是即便公开市场给电池技术平台的期权价值，也落在相当有边界的区间内。一个困境中的私营资产平台， 如果没有更强的重启证明，不应轻易被标到这个区间之上。Lyten 和资产转让新闻可以证明 Northvolt
              存续工业基础值得继续观察； 却不能证明老公司是隐藏便宜货。因此，情景纪律比怀念过去融资标题更重要。
            claimRefs:
              - CV015
