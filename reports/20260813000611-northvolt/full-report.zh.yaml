      - number: '8.3'
        title: 困境资产价值与旧股权
        blocks:
          - type: paragraph
            body: >-
              破产后仍有资产买家，是本章没有直接归零的主要原因。Lyten 已宣布并完成的交易、DLA Piper 的法律交割通知、 Noerr 对德国项目公司有偿付能力清算的描述，以及后续媒体报道，都显示 Northvolt
              的工厂、Labs、土地、IP 和部分员工延续仍有战略价值。 但这不应被误读为旧股权可以回收。战略买方可以为精选资产、运营延续和未来期权买单，同时旧股东仍可能一无所获。 Lyten 瑞典收购接近 $5
              billion 的标题数字，最适合被理解为困境中的战略资产平台标记， 而不是 Northvolt 原普通股仍保有实质价值的证明。从估值角度看，继任资产价值和破产前股权价值已经严重分叉。
              这个分叉是本章最重要的结论。
