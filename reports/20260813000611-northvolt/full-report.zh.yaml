        - 验收闸门让时点和现金转化更难从标题需求推断
        - 订单储备不能当成已入账收入
      - - 长期汽车合同
        - GWh 或多年合同价值
        - BMW 合同价值和整体订单簿总额公开
        - 实际价格未知
        - 合同价值不披露折扣、量的弹性或通胀传导
        - 合同新闻标题会高估投资测算的清晰度
      - - Northvolt Ett 项目融资
        - 债务部分靠长期包销支撑
        - 2024 年 1 月融资引用 >$55bn 包销支持
        - 不是销售价格点
        - 贷款方认可需求，不等于证明工厂层面的毛利率
        - 融资可贷性与盈利质量必须分开看
      - - DIP 融资和现金抵押
        - 法院批准的重组融资工具
        - 规模和部分条款公开
        - 不是变现
        - 这些融资工具保住选择权，但不会创造健康经营利润率
        - 申请后流动性只能按过桥资本建模
    notes: 本表明确列出公开来源没有披露的内容。缺失字段对投资测算至关重要，尤其因为 Northvolt 的模式依赖长认证周期的客户项目，而不是即时现货销售。
