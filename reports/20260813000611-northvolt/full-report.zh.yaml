      - number: '4.2'
        title: 亏损、营运资本与单位经济性
        blocks:
          - type: paragraph
            body: >-
              2023 年报表直接展示了 Northvolt 的核心经济问题：公司按规模化重工业运营商的节奏花钱，却远没有录得接近规模化工业的收入。调整后毛亏损为 $258 million，调整后 EBITDA 亏损为
              $569 million，调整后 EBIT 亏损为 $662 million，全年报告亏损为 $1.17 billion。营运资本变化前经营现金流已经为负，随后库存又吸收 $444 million
              现金，把净经营现金流出推到 $792 million。库存质量也受损，公司披露 $364 million 存货准备，其中包括与原材料市场价值下跌有关的 $322 million
              减记。任何一个事实单独看都不能证明制造良率灾难，但放在一起，它们说明这家公司在成本吸收、库存纪律和毛利率路径上远未稳定。公开数据从未披露实际每 kWh
              成本、报废率、劳动生产率或各产线良率，所以最稳妥的结论不是倒推精确单位经济性，而是判断：资本结构已经很大时，单位经济性仍然深度低于规模。
