      - number: '2.2'
        title: 横跨 EV 与储能的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开记录支持多种规模测算视角，而不是一个英雄式 TAM。汽车视角显示真实但不均衡的恢复：ACEA 报告 2026 年 Q1 欧盟纯电注册量为 546,937 辆，占比
              19.4%，但混动车仍主导结构。更广的电池需求视角更大：IEA 在既定政策情景下预计，到 2030 年 EV 电池需求将超过 3 TWh；欧盟委员会称，到 2030 年全球电池需求可能增长十四倍，欧盟约占其中
              17%。第二个主要视角是固定式储能。欧洲 2025 年新增 36 GWh 电池储能，累计容量超过 100 GWh；在 SolarPower Europe 情景下，到 2030 年年新增装机可能接近约 140
              GWh。对 Northvolt 来说，可服务市场从来不只是乘用 EV；储能提供第二根需求支柱，但这个市场越来越偏好低成本化学体系，以及有严格可融资性要求的买方。
