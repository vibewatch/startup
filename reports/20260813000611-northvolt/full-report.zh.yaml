            body: >-
              Northvolt 的公开客户基础始终比普通多元化工业客户名单更集中，也更具战略性。官方融资、年报和合作伙伴材料反复点名 BMW、Fluence、Scania、Volvo Cars 和 Volkswagen
              Group，把它们列为关键客户或合同交易对手。这些账户聚成少数买方类型：乘用车 OEM、重型商用车 OEM、固定式储能渠道伙伴，以及同时是客户、投资人或两者兼具的战略 OEM / JV
              伙伴。重要含义是，Northvolt
              不需要成千上万客户来证明需求；它需要少数大型、资格认证很重的账户，把长周期合同转成实际出货电芯。这种结构创造了不寻常的战略价值，也创造了不寻常的脆弱性。公开资料支持真实客户基础，但不支持一个广泛、独立且高度多元化的买方组合。这也意味着，每个具名账户都对贷款人、政策制定者、供应商和后来的资产买方有放大的信号价值。
