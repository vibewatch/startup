        title: Northvolt 倒下后的竞争版图
        blocks:
          - type: paragraph
            body: >-
              Northvolt 的竞争版图必须同时放在两个时间框架里读。建设阶段，它作为独立欧洲电池平台，与亚洲既有厂商、OEM 背书的内部供应部门，以及少数区域创业公司竞争。到 2026
              年的现实里，它已经完全不再是正常的独立商用供应商：Chapter 11、瑞典破产和 Ett 关停，把问题从增长份额转成谁接住 Northvolt
              的旧客户、人才和政治叙事。实际竞争地图也因此改变。CATL、BYD、LG Energy Solution、Samsung SDI 和 SK On 代表化学体系深度更强、制造信任更高的既有供给；PowerCo
              代表欧洲内部的 OEM 自有规模；ACC 和 Verkor 代表仍存续的欧洲挑战者路径；Panasonic 仍是广义全球电池基准，而不是以欧洲为中心的核心直接同行。任何考虑 Northvolt
              的买方，现状替代方案已经很简单：从已验证既有厂商采购，从自有 OEM 生态采购，或等资本更充足的欧洲挑战者证明量产输出。
