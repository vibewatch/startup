  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 欧洲汽车电池电芯
        - 在欧洲乘用车、厢式车和部分重型车项目中销售的合格锂离子电芯
        - 整车、充电硬件和大多数上游原材料价值
        - OEM 采购、工程、财务和合规团队
        - 这是 Northvolt 的核心市场；只要质量和成本通过认证，本地化就可能有意义
      - - 重型车辆电池供应
        - 面向卡车和巴士的电芯，耐久性、工况匹配和供应安全都重要
        - 车辆 OEM 收入、充电场站和通用零部件
        - 商用车 OEM 和车队相关采购团队
        - 相关性在于 Scania 是可见的锚定客户，而重型运输对供应商失败的容忍度更低
      - - 公用事业级和 C&I 储能电芯
        - 面向电网级、商业和工业储能部署销售的电芯和系统
        - 电力市场软件、纯 EPC 服务和非电池灵活性资产
        - 公用事业公司、开发商、集成商、EPC 和项目融资方
        - 重要的第二需求支柱，越来越奖励低成本且可融资的电池化学体系
      - - 政策加权本地供应
        - 可持续性、回收材料占比或韧性会影响采购的项目和采购筛选
        - 原产地不带来采购价值的纯市场化进口
        - 公共机构、补贴项目发起方、OEM 合规部门
        - 关键在于：即便不能保证经济性，欧盟监管也会塑造采购偏好
      - - 电池产业邻近机会
        - 回收、认证支持和本地生态集聚带来一定价值
        - 大多数采矿、精炼和整车经济性
        - 价值链各环节买方混杂
        - 有参考价值，但不等于 Northvolt 可直接变现的电芯市场
    notes: 这条边界把本章限定在可销售电芯需求上，并明确排除把所有电气化支出都算成 Northvolt 市场的冲动。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM033
      - CM050
