      - number: '4.3'
        title: 资本结构、破产流动性与债务优先级
        blocks:
          - type: paragraph
            body: >-
              在核心工厂完全证明自己之前，Northvolt 的资本结构早已演化成多层组合：股权、可转债、出口信贷支持贷款、银行债务、公共担保和项目融资。2023 年末合并负债为 $6.35 billion，其中包括
              $3.77 billion 可转贷款和约 $1.76 billion 计息借款，对应 $2.14 billion 股权。2024 年 1 月，公司仍设法为 Northvolt Ett 签下 $5 billion
              无追索项目融资，其中包括 EIB 牵头的 $1.038 billion 方案，并称交易由超过 $55 billion 的承购合同支持。这应被视为交易对手信念和政策支持的证据，而不是盈利质量的证明。到 2024 年
              11 月，公司需要 Chapter 11 来解锁约 $145 million 现金抵押，以及现有客户提供的 $100 million DIP。提交的清单尤其能说明问题：母公司 Northvolt AB 报告约
              $430.9 million 个人财产和 $4.60 billion 非优先无担保债权，但文件本身提醒，这些清单排除了有争议和未确定项目，不是合并 IFRS
              报表，也不是企业价值代理。正确的财务读法是，Northvolt 能接触到融资，但越来越多融资带着排序、契约、里程碑和重组监督，排在普通股权回收之前。
