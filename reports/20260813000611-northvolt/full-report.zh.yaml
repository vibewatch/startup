  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              Northvolt 已不再是一个正常的私营公司估值题。核心问题不是公司曾经是否配得上独角兽倍数，而是在美国 Chapter 11、瑞典破产、 DIP
              融资、债权人控制和破产管理人主导的资产转让之后，旧资本结构里还有没有东西能支撑可回收的普通股权益。 公开证据强烈指向没有。申请文件包、后续破产流程以及关键资产转给 Lyten，都说明战略工业价值仍然存在，
              但捕捉这部分价值的是债权人、破产管理人和继任买方，而不是最初的成长股权叙事。这个区别决定了建议。 投资者应回避 Northvolt
              旧普通股；任何新增敞口都应作为单独承销问题，绑定继任所有权、重启经济性和具体资产担保。 换句话说，今天正确的估值对象不是「Northvolt 这只独角兽」，而是「哪些存续资产仍值得新资金进入、资金层级是什么、
              需要满足哪些证明条件」。
