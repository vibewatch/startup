  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Northvolt 可观察到的客户旅程，从战略兴趣和认证开始，进入合同、工厂就绪、批量交付，最后走向扩张或流失。
    data:
      nodes:
        - id: stage-1
          label: 战略契合
          detail: OEM 或储能交易对手希望获得本地化、低碳电池或系统能力。
          tone: neutral
        - id: stage-2
          label: 合作 / 合同
          detail: JV、包销、共同开发或采购意向，往往在稳定规模生产前数年签下。
          tone: positive
        - id: stage-3
          label: 认证 + 爬坡关口
          detail: Labs/Ett 和质量爬坡必须把战略意图转成可出货产品。
          tone: warning
        - id: stage-4
          label: 商业交付
          detail: 电芯或系统开始流向具名客户。
          tone: positive
        - id: stage-5
          label: 复购 / 扩张测试
          detail: 客户要么扩大承诺，要么等待爬坡，要么转向其他来源。
          tone: warning
        - id: stage-6
          label: 延续或重置
          detail: 陷入困境后，需求可能转给新业主，而不是留在原供应商手里。
          tone: neutral
    approximationNotes: 这条旅程来自公开合同、交付和破产后重置，而不是 Northvolt 披露的 CRM 漏斗。
