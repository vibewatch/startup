      - number: '1.3'
        title: 资本形成、客户锚点与工业建设
        blocks:
          - type: paragraph
            body: >-
              Northvolt 的崛起靠的是一组罕见且可见的要素：客户需求、战略 OEM 背书和机构项目融资。公司披露，2020 年中前已融资超过 $3 billion，2021 年 6 月私募后超过 $6.5
              billion，2022 年可转债后接近 $8 billion，2023 年延期融资后超过 $9 billion，2024 年 1 月 Northvolt Ett 完成 $5 billion 无追索项目融资后超过
              $13 billion。年报随后把 2023 年末已获融资总额定义为 $15 billion，同时列出 $53 billion 订单簿。客户和合作伙伴披露也显示，这些资本如何落到工业资产上：BMW 签下 €2
              billion 电芯合同；Volkswagen 投入约 €900 million，换取约 20% 股权和德国 JV；Scania 早期投入重型车辆电池开发；EIB 支持 Labs 和 Ett；Canada 与
              Quebec 支持 Northvolt Six。这种广度是概览层面的证据，说明 Northvolt 在遭遇执行和流动性失败前，确实建立了工业相关性。
