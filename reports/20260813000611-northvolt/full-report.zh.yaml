  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条很简单：遗留股权被破产控制压在后面；幸存资产价值要按继任方重新承销，不能套用怀旧式独角兽估值逻辑。
    data:
      nodes:
        - id: a
          label: 战略资产留存
        - id: b
          label: 遗留股权结构失效
        - id: c
          label: 申报文件和受托人决定回收
        - id: d
          label: 继任资产价值可能仍在
        - id: e
          label: 回避遗留普通股
        - id: f
          label: 只有新的有担保敞口或干净的继任方敞口才重新评估
      edges:
        - from: a
          to: d
          label: 支撑资产关注
        - from: b
          to: e
          label: 阻断遗留上行
        - from: c
          to: e
          label: 使旧普通股居后受偿
        - from: d
          to: f
          label: 需要重新承销
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV027
      - CV032
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 少数尽调变量主导任何继任方敞口的合理价值区间。
    data:
      items:
        - label: 重启后的良率和利用率验证
          value: 30
          unit: impact score
        - label: 债权人受偿顺位和清晰权属
          value: 28
          unit: impact score
        - label: 客户重新签约质量
          value: 25
          unit: impact score
        - label: 重启资本开支和营运资金
          value: 22
          unit: impact score
        - label: 可比上市公司重估支撑
          value: 15
          unit: impact score
    approximationNotes: 这些条形只表示影响排序，不是模型输出。它们排序的是哪些尽调结果最会影响估值。
