      - number: '4.4'
        title: 倒下原因与承销结论
        blocks:
          - type: paragraph
            body: >-
              最终财务结论比表层融资故事更严厉。Northvolt
              有真实客户、真实贷款人、真实政策支持和真实的已安装资产基础，但公开记录显示，合同价值和融资额反复遮住了一个更慢的问题：第一座工厂能否把昂贵投入材料和固定成本稳定转化为可销售产出。负面报道和公司自己的文件指向同一模式：BMW
              取消 €2 billion 合同，同时削弱收入桥和融资故事；战略复盘随后暂停扩张并削减范围；Chapter 11
              买来临时流动性，却没有买来持久恢复；在无法完成长期资本重组后，瑞典破产接踵而至。管理层后来提到现金流出减少、良率改善和量产线产出增强，但这些改善发生在破产程序内，而不是发生在破产之前。做尽调时，Northvolt
              应被看作这样一个案例：市场需求和融资动能真实存在，但仍然不够，因为单位经济性、流动性韧性和债务优先级数学没有足够早地被控制住。
