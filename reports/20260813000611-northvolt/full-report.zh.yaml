      - number: '7.2'
        title: 法律、监管、环境与安全风险
        blocks:
          - type: paragraph
            body: >-
              Northvolt 财务崩盘后，法律和监管风险没有消失；有些反而更复杂。破产程序被拆到多个司法辖区：美国案件负责临时债权人保护，
              瑞典程序处理核心破产财产和出售流程。与此同时，围绕致命事故的工作场所安全调查仍在推进；瑞典检方也表示，即便破产后企业罚款更难适用， 个人责任仍可能被追究。瑞典之外，Northvolt 的 Quebec
              项目因废水和湿地问题累积了环境罚款，说明合规负担不只落在工厂良率上， 也延伸到环保执行和许可纪律。单看任何一项，都不足以解释公司倒下。合在一起，它们说明 Northvolt 的困境不只是融资事件；
              存续项目和资产仍留下流程控制、管理层问责和监管后遗症等开放问题。
