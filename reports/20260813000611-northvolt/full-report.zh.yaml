      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人与治理记录足以说明是谁建立了 Northvolt，但不足以承销破产后的控制结果。官方材料反复把 Peter Carlsson 列为从创立到 Chapter 11 申请期间领导公司的联合创始人；Paolo
              Cerruti 也因 Quebec 的 Northvolt Six 发布而持续具备公开重要性。Northvolt 连续完成股权和债务融资后，治理也越来越由投资人塑形；2023 年年报显示，Volkswagen 以
              21.0% 持股成为最大股东，Goldman Sachs Asset Management 基金持有 19.2%，前十大持有人合计占稀释后所有权的 75.5%，不含可转债。重组期间，Peter Carlsson
              卸任，Tom Johnstone 担任临时董事长，经营控制转向 CFO Pia Aaltonen-Forsell、Matthias Arleth 和 CRO Scott
              Millar。仍然不透明的是当前的破产后控制图：公开来源没有清楚说明存续股权价值、债权优先顺位结果，或破产后资产转让附带的治理条款。
