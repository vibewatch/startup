  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 存量回收瀑布
        - 债权人排序、破产财团成本，以及旧股权任何剩余处理
        - 决定存量普通股只是受损，还是实质归零
        - 获取美国和瑞典程序中的受托人、法院和索赔文件
      - - 重启经济性
        - 继任控制下的良率、报废率、利用率、营运资本和重启资本开支
        - 这些变量决定继任资产价值是真实，还是只停留在表演
        - 索取重启运营模型和首份商业 KPI 包
      - - 客户重新签约
        - 破产后具名客户的量、价格和认证状态
        - 没有可变现合同，需求头条不足以支撑价值
        - 寻找继任客户管线和出货承诺
      - - 负债承继
        - 每项资产附带的安全、环保、劳工和公共资金义务
        - 要把战略兴趣转成可投资价值，干净权属是前提
        - 交叉核对破产财团出售文件、监管文件和政府支持条件
      - - 新证券条款
        - 精确优先顺位、抵押资产包、优先股堆叠、治理权利和退出机制
        - 工具设计错了，好资产也可能变成坏投资
        - 只有完成完整条款清单和清偿瀑布审查后才承保
    notes: 尽调清单刻意聚焦工具，因为下一个可投对象若存在，将是围绕幸存资产的新证券，而不是 Northvolt 的存量股权。
