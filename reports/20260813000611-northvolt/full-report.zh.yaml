      - number: '7.3'
        title: 运营、客户与融资传导
        blocks:
          - type: paragraph
            body: >-
              Northvolt 最关键的风险链条，是工业产出不佳先传导到客户流失，再传导到贷款方控制。年报、重组材料和后续报道共同显示， 公司确有订单簿需求，也拿到大量外部融资，但制造经济性撑不起这些承诺。Ett
              的产出远低于铭牌产能目标，BMW 取消锚定合同， 到流程末期，Scania 实际上成了 Skellefteå 产出的唯一剩余客户。工厂利用率一旦降下来，每一个仍要交付的 kWh 都变得更贵，
              客户延续和救助融资也随之更难，而不是更容易。因此，DIP 条款、现金抵押品控制和被迫资产出售顺序， 最应被解读为债权人已经成为真正的运营约束。Northvolt 不只是缺钱；公司在通往商业规模的路上，
              已经失去继续吸收学习曲线错误的权利。
