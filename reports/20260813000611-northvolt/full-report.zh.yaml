      - number: '7.4'
        title: 合作伙伴依赖、人员风险与执行纪律
        blocks:
          - type: paragraph
            body: >-
              Northvolt 的依赖关系图异常缠绕。Scania 同时是客户、DIP 贷款方，后来又成为 Industrials 业务买方；Volkswagen 同时是投资方、 战略客户和产业生态锚点；EIB
              和欧盟相关项目等公共机构，既是背书方，也是利益相关方风险的来源。增长故事还完整时， 这种重叠强化了公司；产能爬坡一旦失速，脆弱性也被放大，因为交易对手可以同时收紧商业、治理和融资压力。
              领导层变动和裁员又加了一层执行风险。美国申请破产保护当天，Peter Carlsson 退居一旁，公司转入临时运营架构； 公开重组资料显示，裁员规模从 2024 年宣布在瑞典裁减 1,600 人，到瑞典破产时约
              4,000 名员工受影响， 后续欧盟援助则面向约 5,800 名被裁员工。一家已经被良率困住的电池制造商，最承受不起隐性工艺知识流失； 大规模裁员和管理层动荡恰恰会让这种流失更可能发生。
