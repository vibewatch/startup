              客户风险由集中度和执行主导，而不是由漏斗顶部薄弱主导。相同名字反复出现在 Northvolt 2021、2022、2023 和 2024
              年融资材料里，这是交易对手层面反复参与的间接证据。但公开资料几乎看不到续约、照付不议保护、NRR、GRR、流失或队列耐久性。2024 年 BMW
              合同取消后，这种结构的下行马上变得明显：失去一个锚定账户，会同时伤害收入桥和融资故事。Scania 后来转向替代供应，以及 BMW、Scania、Volkswagen、Volvo 和 Fluence
