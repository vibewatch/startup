  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Northvolt 的战略交易对手方在需求、融资、监管和重启路径上深度绑定。
    data:
      nodes:
        - id: d1
          label: Northvolt Ett / Labs 核心资产
          detail: 制造和工业化重心。
        - id: d2
          label: Scania
          detail: 客户、DIP 贷款人，也是 Industrials 业务收购方。
        - id: d3
          label: Volkswagen 生态
          detail: 投资方、战略客户，也是欧洲电池标杆。
        - id: d4
          label: EIB 与贷款人组
          detail: 项目融资背书和债权人纪律。
        - id: d5
          label: 瑞典法院 / 受托人
          detail: 破产财产管理和出售路径。
        - id: d6
          label: 魁北克监管机构
          detail: 北美项目的环境监管。
        - id: d7
          label: 劳动力 / 签证基础
          detail: 熟练劳动力池，对重启敏感。
        - id: d8
