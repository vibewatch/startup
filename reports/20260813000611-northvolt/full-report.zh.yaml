      - number: '5.4'
        title: 成熟度结论与依赖边界
        blocks:
          - type: paragraph
            body: >-
              Northvolt 的产品护城河真实存在，但成熟度不均。锂离子 NMC 电芯和回收是平台中最扎实的部分。钠离子有可信的公开技术证明和样品，但仍是下一波储能产品。Cuberg
              锂金属有亮眼验证数据，并且在航空和高性能移动场景中有合理应用匹配，但它仍是开发项目，而不是规模化 Northvolt 盈利引擎。公司 2024 年战略复盘和 2025
              年破产记录也显示，产品范围在压力下收窄：Cuberg 要并入 Labs，Gdańsk 的系统业务需要合作伙伴，瑞典破产申请强调更好良率和更多产出，却没有避免破产。之后 Lyten 交易让结论更清楚。买方看重
              Ett、Labs、Dwa、Cuberg 和剩余 IP，说明技术栈保有真实工业价值。但同一串交易也意味着，到本报告日期，平台各部分作为资产和技术诀窍的价值，高于作为完整一体、自我维持的 Northvolt
              产品业务的价值。
