      - number: '7.5'
        title: 缓释因素、监控指标与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              即便陷入困境，Northvolt 仍有实质缓释因素：战略资产、自有工艺 know-how、部分仍在的客户兴趣、公共政策重要性， 以及愿意收购工厂、Labs
              和回收基础设施的买方。这些缓释因素解释了为什么资产比股权故事撑得更久。 它们不能改变一个事实：最初的投资逻辑已经被破产击穿。后续尽调应追踪几件事：继任业主能否重启生产而不重演同样的质量和利用率失败；
              未决安全或环境责任是否扩大；旧合作伙伴图谱是否以真实签约需求、而非象征性支持的形式重新出现。 若有人声称 2024 年末之后 Northvolt
              本身风险已经被实质拆掉，需要的证据必须远强于持续的政治兴趣或资产出售新闻。 可执行的教训是，把已测得的运营证明，而不是战略叙事，作为放行门槛。
