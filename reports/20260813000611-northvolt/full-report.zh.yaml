      - number: '8.5'
        title: 什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              只有投资对象变了，判断才会变。对 Northvolt 旧普通股而言，公开证据需要揭示一条意外回收路径，
              且能在有担保和重组索赔之后仍留下剩余价值；已审阅材料没有支持这一点。若机会来自继任主体或新证券，尽调负担完全不同。 投资者需要看到重启良率证明、超出象征性锚定关系的可信客户重新签约、透明的重启 capex
              和营运资本需求， 以及围绕资产所有权、负债和公共资金条件的法律确定性。他们还需要价格纪律。可比公司集合显示，即便披露更干净的公开电池公司，
              估值也只在宽但有限的区间内交易。新业主或融资工具可以变得有吸引力，但前提是资产质量和结构同时成立， 让新资金能在隐藏索赔和应急融资吞掉上行之前捕捉收益。在此之前，正确姿态是把对资产的好奇，
              与为已失效股权故事付钱的意愿分开。
            claimRefs:
