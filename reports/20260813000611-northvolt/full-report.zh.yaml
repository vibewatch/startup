      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 隐藏优先索赔或负债主导价值
        - 新文件显示，旧债权或继任索赔在新资金之前吸走资产价值
        - 对新资金而言，资产期权性不再可投
        - 除非按近清算价格定价，否则离场
      - - 重启未能证明经济良率
        - 没有可信证据表明能以可接受成本稳定产出
        - 继任故事变成又一个只靠叙事的电池扭亏故事
        - 只按困境工厂资产估值
      - - 客户延续仍停留在象征层面
        - 除存量头条外，没有真正重新签约的出货
        - 战略相关性没有转成可变现价值
        - 下调情景区间，并要求深度折价
      - - 公共资金条件或法律负债扩大
        - 新罚款、追回权或权属争议削弱资产干净出售能力
        - 回收价值进一步流向债权人和法律准备金
        - 显著提高下行情景权重
      - - 新融资重复紧急过桥逻辑
        - 新资金只有在惩罚性条款或不透明优先顺位下才进来
        - 上行收益被优先资本拿走，而不是流向类股权持有人
        - 除非证券明确为优先且有资产支持，否则回避
    notes: 这些触发因素是从留存公开证据推导出的分析阈值，用来测试任何新证券是否优于失败的旧架构。
