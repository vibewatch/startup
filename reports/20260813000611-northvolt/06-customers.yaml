tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / disclosure
  - revenue / strategic value
  - gap
  rows:
  - - Passenger-vehicle OEM supply
    - BMW, Volkswagen Group ecosystem, Volvo Cars / Polestar programs
    - Regional low-carbon battery cells for EV production
    - Multi-billion contract values and repeated named references, but narrow public customer count
    - Highest-value volume pool and strongest strategic proof
    - Exact surviving contracts and current volumes are not public
  - - Heavy-commercial-vehicle electrification
    - Scania as buyer/user with end fleets as indirect users
    - Sustainable truck battery supply and recycling-aligned sourcing
    - Named early partner and later strategic financier
    - Strong proof that Northvolt mattered beyond passenger cars
    - Continuity weakened after Northvolt’s distress and Scania’s alternate sourcing
  - - Stationary-storage channel / integrator
    - Fluence and downstream grid-storage customers
    - Co-developed grid-scale storage systems and battery-system purchasing
    - Named partnership and purchase intent, but not a full public deployment ledger
    - Best evidence of non-automotive commercial reach
    - Public serial volumes and repeat orders are not disclosed
  - - Strategic JV / captive-adjacent partner
    - Volkswagen Group and Volvo Cars / NOVO structures
    - Battery development, manufacturing localization, and future supply optionality
    - Strong strategic ties but blurred line between partner, investor, and customer
    - Helps bankability and industrial legitimacy
    - Counterparty overlap increases concentration and governance complexity
  - - Broader industrial / energy ecosystem
    - ABB, Siemens, Vattenfall, Vestas and others named in older materials
    - Systems, energy, or industrial battery use cases
    - Mostly name-list evidence rather than detailed deployment evidence
    - Signals broader relevance and ecosystem pull
    - Public proof quality is weaker than for BMW, Scania, VW, Volvo, or Fluence
  notes: The segmentation table distinguishes a handful of high-value anchor accounts from a much weaker long tail of publicly named ecosystem relationships.
