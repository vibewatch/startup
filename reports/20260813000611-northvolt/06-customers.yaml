  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TU003 named-customer-proof-table remains logo-heavy without a full contract-status matrix
    missingEvidence: Public sources prove the existence of named anchor relationships, but they do not provide a full account-by-account status matrix covering signed volume, qualification stage, actual shipped volume, and post-bankruptcy continuity.
    whyItMatters: Without a clean matrix, diligence can prove customer relevance but cannot prove what fraction of the public roster was economically live, paused, cancelled, or transferred.
    diligencePath: Request contract roll-forwards, qualification scorecards, shipment history, and post-insolvency status for every customer named in TU003.
    relatedQuestionRefs:
    - QU003
    - QU004
    - QU005
    - QU006
    - QU021
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: durability metrics needed for QU025 remain private
    missingEvidence: Public materials do not disclose NRR, GRR, churn, repeat-order rates, contract renewal rates, customer satisfaction, warranty escapes by account, or a customer-by-customer backlog burn-down.
    whyItMatters: These are the metrics required to distinguish one-time strategic validation from durable customer resilience in a long-cycle industrial account base.
    diligencePath: Obtain customer cohort reporting, contract amendments, renewal history, account quality dashboards, and backlog conversion data before rendering a hard durability verdict.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU025
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: minor
    topic: post-bankruptcy continuity versus transferred demand
    missingEvidence: Public reporting shows some anchor demand survived through Lyten or Volvo/NOVO restructuring, but it does not reconcile which relationships remained with Northvolt, transferred to buyers, or effectively restarted from zero.
    whyItMatters: Recovery of strategic demand is not equivalent to retention of a functioning customer book, and that distinction shapes how much value should be attributed to the pre-bankruptcy roster.
    diligencePath: Reconcile estate-sale documents, successor supply agreements, and customer communications to map each major account before and after insolvency.
    relatedQuestionRefs:
    - QU018
    - QU024
    - QU026
