callouts:
- calloutType: insight
  title: Northvolt had real customer proof, but most of it came from a very small set of strategic accounts
  body: >-
    BMW, Scania, Volkswagen, Volvo-linked entities, and Fluence are enough to
    prove demand. They are not enough to prove diversification. The customer
    base was meaningful and narrow at the same time.
  claimRefs:
  - CU002
  - CU003
  - CU023
- calloutType: risk
  title: The BMW cancellation was a customer-loss event and a financing-loss event at once
  body: >-
    Because Northvolt’s public customer roster was concentrated and intertwined
    with its funding narrative, the loss of BMW damaged revenue credibility,
    order-book quality, and access to rescue capital simultaneously.
  claimRefs:
  - CU014
  - CU019
  - CU024
- calloutType: risk
  title: Customer continuity after bankruptcy is best read as transferability, not healthy retention
  body: >-
    Public sources suggest some anchor demand survived in the sense that new
    owners wanted to restart inherited lines for inherited counterparties. That
    is not the same as proving stable standalone Northvolt retention.
  claimRefs:
  - CU029
  - CU030
  - CU031
- calloutType: assumption
  title: Sustainability and localization opened doors, but did not create unbreakable switching costs
  body: >-
    Buyers clearly cared about greener and more local battery supply, yet those
    benefits were still contingent on Northvolt hitting quality, timing, and
    volume thresholds. Demand existed, but it was not immune to execution.
  claimRefs:
  - CU025
  - CU026
