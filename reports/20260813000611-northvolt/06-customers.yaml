- id: TU003
  title: Named customer proof table
  columns:
  - customer
  - segment
  - deployment / use case
  - production vs pilot
  - outcome / proof quality
  - limitation
  rows:
  - - BMW Group
    - Passenger-vehicle OEM
    - European battery-cell sourcing from Northvolt Ett
    - Signed long-term contract, later cancelled
    - Strong original proof because value and production location were public
    - Relationship ended as Northvolt failed to deliver needed timing and volume
  - - Scania
    - Heavy commercial vehicle OEM
    - Sustainable battery supply and electrification partnership
    - Strategic partnership; later customer-lender overlap
    - Strong proof that Northvolt mattered in truck electrification
    - Post-distress continuity weakened and alternative sourcing emerged
  - - Volkswagen Group
    - Strategic OEM / investor / JV partner
    - European battery production localization and future group demand
    - Strategic alignment rather than clean standalone supply disclosure
    - High strategic value and demand validation
    - Blurred line between customer proof and industrial-parent support
  - - Fluence
    - Grid-scale storage integrator / channel
    - Co-developed storage technology and planned purchases of Northvolt battery systems
    - Named commercial-development relationship
    - Best public non-automotive customer proof
    - Public deployment volumes and repeat-purchase history not disclosed
  - - Volvo Cars / NOVO Energy
    - OEM partner / JV counterparty
    - Battery development, gigafactory, and later future North America supply exploration
    - Strategic relationship with changing structure
    - Strong proof of strategic relevance inside European OEM ecosystem
    - Relationship was disrupted by Northvolt’s financial distress and NOVO reset
  notes: Named proof is real, but several relationships are hybrid customer-partner-investor structures rather than simple recurring purchase accounts.
