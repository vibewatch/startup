- id: TU006
  title: Volvo / NOVO reset timeline table
  columns:
  - date
  - source / actor
  - event
  - customer implication
  - confidence
  rows:
  - - '2025-01-30'
    - Northvolt / Volvo Cars
    - Volvo Cars took full ownership of NOVO Energy and signed a framework agreement to explore future battery-cell supply opportunities in North America
    - The relationship survived, but shifted away from the original 50/50 Northvolt-linked structure
    - medium
  - - '2025-05-05'
    - NOVO Energy
    - NOVO announced cost reductions and resizing after evaluating the business following Northvolt’s bankruptcy
    - Customer demand may have remained strategically relevant, but the original operating plan no longer held
    - medium
  - - '2026-01-13'
    - NOVO Energy / Volvo Cars
    - Volvo Cars announced an operational pause in NOVO Energy while continuing to search for a battery technology partner
    - Volvo preserved battery ambition while decoupling continuity from Northvolt technology dependence
    - high
  - - '2026-01-13'
    - electrive / Automotive World
    - Trade press described NOVO as put into hibernation or indefinite halt
    - Independent coverage corroborates that strategic OEM interest persisted, but the prior customer-partner structure was no longer operating normally
    - medium
  notes: The Volvo / NOVO timeline shows that one of Northvolt’s most strategic customer-adjacent relationships survived only through restructuring, pause, and redesign rather than smooth account continuity.
  enumerationScope:
    coverage: partial
    basis: Rows focus on the most decision-relevant public milestones showing how Volvo-linked demand persisted while the original Northvolt-linked operating structure deteriorated.
