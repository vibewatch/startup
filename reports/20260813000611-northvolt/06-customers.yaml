  - FU002
- id: durability-retention-and-concentration-risk
  title: Durability, retention, and concentration risk
  body: >-
    The customer risk profile was dominated by concentration and execution, not
    by top-of-funnel weakness. The same names appear across Northvolt’s 2021,
    2022, 2023, and 2024 financing materials, which is indirect proof of
    repeated counterpart-level engagement. But there is almost no public
    visibility into renewals, take-or-pay protections, NRR, GRR, churn, or
    cohort durability. Once the BMW contract was cancelled in 2024, the downside
    of this structure became obvious: losing one anchor account damaged both the
    revenue bridge and the financing story at once. Scania’s later move toward
    alternative supply, and the narrow set of public customers beyond BMW,
    Scania, Volkswagen, Volvo, and Fluence, reinforce that Northvolt’s roster
    had strategic quality but not much redundancy. Investors should read the
    public customer base as strong proof of relevance, yet weak proof of
    resilience under manufacturing stress.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU021
  - CU022
  - CU023
  - CU026
