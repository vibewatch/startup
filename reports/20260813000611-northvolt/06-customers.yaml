- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Convert order-book headlines into recurring shipments
    - Qualification and ramp delays can destroy confidence before revenue is recognized
    - Makes adoption timing fragile even with strong logos and contracts
    - Request customer-by-customer shipment curve and acceptance status
  - - Deepen automotive footprint within existing OEM group relationships
    - The public roster is concentrated in a few very large European OEM ecosystems
    - Growth can increase dependence on the same counterparties that already dominate perception and financing
    - Request share of demand by BMW/Scania/VW/Volvo family and upside outside them
  - - Expand stationary-storage footprint through Fluence and systems business
    - Public proof outside automotive is much thinner than the logo list suggests
    - Diversification story may be overstated if no serial storage backlog exists
    - Request named storage deployments, repeat orders, and systems-margin history
  - - Survive bankruptcy-driven customer reset
    - Insolvency can transfer assets while breaking the original seller-customer relationship
    - Customers may remain strategically interested but no longer be Northvolt accounts in the old sense
    - Request continuity matrix under Lyten or bankruptcy-estate sales
  - - Leverage sustainability and localization as a premium
    - Buyers may still switch if cost, quality, or timing slip
    - Sustainability helps access, but does not eliminate substitution risk
    - Request evidence of price premium or contract stickiness tied to local low-carbon supply
  notes: The central customer risk is not lack of demand; it is that a concentrated demand base amplifies every production and financing shock.
  enumerationScope:
    coverage: partial
