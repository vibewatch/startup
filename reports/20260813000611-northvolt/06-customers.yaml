figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Northvolt’s observed customer journey runs from strategic interest and qualification through contract, factory readiness, serial delivery, and either expansion or churn.
  data:
    nodes:
    - id: stage-1
      label: Strategic alignment
      detail: OEM or storage counterparty wants localized, lower-carbon batteries or system capability.
      tone: neutral
    - id: stage-2
      label: Partnership / contract
      detail: JV, offtake, co-development, or purchase intent is signed years before stable scale production.
      tone: positive
    - id: stage-3
      label: Qualification + ramp gate
      detail: Labs/Ett and quality ramp must convert strategic intent into shippable product.
      tone: warning
    - id: stage-4
      label: Commercial delivery
      detail: Cells or systems begin flowing to named customers.
      tone: positive
    - id: stage-5
      label: Repeat / expansion test
      detail: Customer either broadens commitment, waits on ramp, or re-sources elsewhere.
      tone: warning
    - id: stage-6
      label: Continuity or reset
      detail: Under distress, demand may transfer to a new owner rather than remain with the original supplier.
      tone: neutral
  approximationNotes: The journey is inferred from public contracts, deliveries, and post-bankruptcy resets rather than from a disclosed Northvolt CRM funnel.
  claimRefs:
  - CU004
  - CU007
  - CU008
  - CU010
  - CU014
  - CU030
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: The public funnel is less about lead count than about surviving a sequence of qualification and industrial gates before repeat shipments stick.
  data:
    nodes:
    - id: f1
      label: Buyer need
      detail: Europe wants localized battery supply or grid-storage systems
      tone: neutral
    - id: f2
      label: Strategic deal signed
      detail: BMW, Scania, VW, Fluence, or Volvo-linked structures form early
      tone: positive
    - id: f3
      label: Factory and qualification gate
      detail: Ett ramp and production reliability determine whether contracts monetize
      tone: warning
    - id: f4
      label: First deliveries
      detail: Limited commercial shipments prove some conversion
      tone: positive
    - id: f5
      label: Expansion or break
      detail: Customer either expands, pauses, or defects if timing/quality slip
      tone: warning
    - id: f6
      label: Post-distress continuity
      detail: Surviving demand may reappear under Lyten or other asset buyers
      tone: neutral
    edges:
    - from: f1
      to: f2
    - from: f2
      to: f3
    - from: f3
      to: f4
    - from: f4
      to: f5
    - from: f5
      to: f6
  approximationNotes: This funnel reflects public buyer behavior in a capital-intensive industrial category, not a high-frequency software conversion funnel.
