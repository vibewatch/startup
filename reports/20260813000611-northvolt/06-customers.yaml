  - TU004
  - TU005
- id: post-bankruptcy-continuity-and-reset
  title: Post-bankruptcy continuity and reset
  body: >-
    Northvolt’s customer story did not end cleanly at the bankruptcy line; it
    fragmented. Official Chapter 11 materials said customer deliveries would
    continue, and the Swedish bankruptcy filing still pointed to recent output
    and customer delivery milestones. But third-party reporting indicates that
    Scania shifted to CATL, NOVO paused while searching for a new technology
    partner, and Northvolt’s broader customer continuity problem had moved from
    sales growth to rescue and asset transfer. Lyten’s 2025 acquisition release
    then said collaboration with prior anchor customers was progressing
    constructively, while later reporting said Lyten would initially continue
    lithium-ion production for customers tied to the inherited Northvolt lines.
    Direct NOVO and Volvo-linked updates also show that OEM battery ambition in
    Gothenburg survived even while the original Northvolt-linked operating model
    was paused or put into hibernation pending a new technology partner. The
    right conclusion is not that customer demand disappeared; it is that the
    relationship map was reset under insolvency and new ownership. Publicly, the
    customer base survived as transferable strategic demand more than as a stable
    standalone Northvolt account book, which is a much weaker form of customer
    continuity than normal retention.
  claimRefs:
