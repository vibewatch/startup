- id: FM002
  title: Buyer / segment map
  type: matrix
  layout: wide
  summary: The relevant buyers are industrial procurement functions with different qualification logic in automotive and storage.
  approximationNotes: null
  data:
    columns:
    - Primary need
    - Decision owner
    - Chemistry pressure
    - Why Northvolt could matter
    rows:
    - label: Passenger-car OEMs
      values:
      - Qualified low-risk cell supply
      - Platform sourcing and engineering teams
      - Rising LFP pressure against higher-cost NMC
      - European location mattered only if quality and cost cleared qualification
    - label: Commercial-vehicle OEMs
      values:
      - Durable cells and secure volume
      - Truck and bus product sourcing leaders
      - Range and reliability still mattered more than cheapest chemistry alone
      - Northvolt had visible Scania anchoring, but heavy vehicles could not tolerate unstable output
    - label: Utility-scale storage
      values:
      - Bankable low-cost storage cells
      - Developer, integrator, and financing committees
      - Strong shift toward LFP and alternative lower-cost chemistries
      - Relevant only if Northvolt could match storage economics and warranty expectations
    - label: C&I storage integrators
      values:
      - Fast delivery, safety, and ROI
      - Integrator procurement heads and owner-operator CFOs
      - Chemistry choice tied to payback and installation simplicity
      - Useful where local support mattered, but import pricing remained a strong substitute
    - label: Public or supported projects
      values:
      - Compliance with resilience and sustainability screens
      - Program owner or public buyer
      - Localization can offset part of the price gap
      - EU policy could improve relevance without guaranteeing a win
