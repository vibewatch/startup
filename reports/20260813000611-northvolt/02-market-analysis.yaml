callouts:
- calloutType: strength
  title: End-demand was real
  body: Northvolt did not fail because Europe lacked a battery market. Open data show large EV battery demand, a recovering EU BEV mix, and a fast-growing storage market.
  claimRefs:
  - CM006
  - CM013
  - CM017
  - CM034
- calloutType: risk
  title: Localization did not erase cost and yield pressure
  body: Policy support improved the case for local production, but chemistry deflation, concentrated materials, and brutal ramp economics still punished weak execution.
  claimRefs:
  - CM021
  - CM028
  - CM032
  - CM033
  - CM048
  - CM054
- calloutType: insight
  title: Northvolt was exposed to two markets with different rules
  body: Automotive buyers cared about qualification and reliability; storage buyers cared about bankability and low-cost chemistry. Northvolt needed to win both without ever solving ramp economics.
  claimRefs:
  - CM027
  - CM036
  - CM050
  - CM051
  - CM052
