- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - EU battery-electric demand recovery in 2026
    - positive
    - current
    - Improving registrations keep a real automotive demand floor under local battery sourcing
    - Separate BEV registration growth from actual local-cell sourcing wins
  - - Stationary-storage growth
    - positive
    - current to 2030
    - Creates a second market outside passenger EV cycles and can absorb multiple chemistries
    - Test how much of European storage growth sources regional cells versus imports
  - - Batteries Regulation and sustainability rules
    - positive
    - current
    - Can strengthen non-price sourcing criteria around sustainability and circularity
    - Map which target customers are actually screened on these criteria
  - - Critical Raw Materials Act and resilience push
    - mixed
    - current to long-term
    - Supports local supply-chain investment logic but also highlights Europe's existing vulnerability
    - Identify whether Northvolt had secured material pathways that benefit from CRMA
  - - LFP cost advantage over NMC
    - negative
    - current
    - Cheap chemistry shifts compress margins for European producers focused on higher-cost cells
    - Model where Northvolt could still win if LFP keeps taking share
  - - Chinese processing and cell concentration
    - negative
    - structural
    - Europe remains exposed on inputs and cost structure even if final assembly localizes
    - Map dependency on China-linked materials, equipment, and know-how by chemistry
  - - US tax-credit-driven capacity expansion
    - negative
    - current to medium-term
    - North American growth raises opportunity cost for capital and talent that might otherwise back Europe
    - Pressure-test whether subsidy competition changed Northvolt's capital options
  - - OEM vertical integration and captive factories
    - negative
    - current
    - Automakers can back their own plants or shift to established suppliers instead of relying on independents
    - Track which target OEMs now prefer captive or JV supply over merchant purchases
  - - Yield, quality, and capital intensity
    - negative
    - current
    - Even real demand does not protect a producer with rejects, delays, and underutilized lines
    - Reconcile gross margin assumptions with realistic yield ramps and scrap rates
  - - Northvolt collapse and buyer skepticism
    - negative
    - current
    - The failure raises the hurdle for independent European entrants seeking customer and lender trust
    - Check whether post-Northvolt contracts demand tighter milestone, warranty, or governance terms
  notes: Demand drivers were real, but Northvolt's outcome depended on whether those drivers could overcome chemistry, cost, financing, and execution headwinds.
