  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: local-supply-price-premium
    missingEvidence: Public evidence does not quantify what premium, if any, automotive or storage buyers were willing to pay for localized European cells over imported alternatives.
    whyItMatters: That premium determines whether Europe-first battery manufacturing can earn acceptable returns instead of merely winning politically symbolic demand.
    diligencePath: Collect customer procurement records, term sheets, and internal sourcing memos comparing local-cell bids with Asian import alternatives.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: material
    topic: realized-vs-announced-domestic-share
    missingEvidence: Public sources do not provide a clean, reconciled forecast for what share of 2030 European battery demand will be met by realized domestic production rather than imports.
    whyItMatters: Northvolt's long-term opportunity depends on realized utilization and import substitution, not on announced gigafactory nameplate alone.
    diligencePath: Reconcile plant-by-plant timelines, import data, and OEM sourcing plans against demand scenarios from ACEA, IEA, and public project trackers.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: orderbook-segmentation
    missingEvidence: Northvolt's public materials do not provide a clean split of the more-than-$55 billion order backlog between passenger EVs, heavy vehicles, and stationary storage.
    whyItMatters: The mix matters because each segment has different qualification cycles, chemistry economics, and margin structures.
    diligencePath: Seek customer-by-customer contract schedules, product-mix disclosures, or bankruptcy materials that segment backlog by program and geography.
    relatedQuestionRefs:
    - QM011
    - QM019
    relatedTableRefs:
    - TM003
