    - Scenario numbers depend on policy, permitting, and revenue access
  - - IEA Batteries and Secure Energy Transitions
    - 2030 announced-plants lens
    - Europe / North America
    - Each region could reach about 15% of global battery manufacturing if announced plants are built
    - Supply-pipeline and localization lens
