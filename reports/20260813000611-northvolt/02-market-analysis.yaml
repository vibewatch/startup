    - Registrations are not the same as cell sourcing or supplier share
  - - ees Europe / SolarPower Europe
    - 2025 actual
    - Europe
    - 36 GWh annual installations; over 100 GWh cumulative fleet
    - Observed stationary-storage lens
    - medium
    - Mixes end-use storage deployment with cell demand indirectly
  - - ees Europe / SolarPower Europe
    - 2030 medium scenario
    - Europe
    - Almost 140 GWh annual installations; cumulative capacity above 580 GWh
    - Forward storage-growth lens
