chapter:
  number: 2
  title: Market Analysis
summary: Northvolt targeted a large and policy-backed battery market, but the 2026 record shows that demand growth alone was never enough. Energy-sector battery demand crossed 1 TWh in 2024, EU battery-electric share rebounded to 19.4% in Q1 2026, and European stationary storage passed 100 GWh cumulative capacity in 2025. At the same time, cheaper LFP chemistry, Chinese supply-chain concentration, tax-credit-driven North American expansion, and punishing yield economics meant Europe's local-supply thesis rewarded execution rather than ambition. Northvolt's collapse therefore reads less as a no-market story than as an execution failure inside a strategically important but brutally competitive market.
sections:
- id: market-boundary-and-demand-floor
  title: Market Boundary and Demand Floor
  body: 'Northvolt should not be sized against all electrification spending. The relevant market is the sale of qualified battery cells and closely linked systems into European automotive and stationary-storage programs where procurement teams care about cost, safety, reliability, carbon footprint, and resilience of supply. That excludes most upstream mining and refining economics, finished-vehicle revenue, charging infrastructure, and power-market software. Public policy still matters because Europe continues to describe batteries as strategic to climate neutrality, circularity, and industrial autonomy, while open market data show that end demand remains real: the IEA says battery demand for EVs and storage reached 1 TWh in 2024, and ACEA shows EU battery-electric registrations rising again in Q1 2026. The demand floor is therefore genuine, but it is narrower than generic clean-tech TAM language and it does not guarantee that an independent European producer earns attractive margins or easy financing.'
  claimRefs:
