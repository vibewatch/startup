- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Passenger-car OEMs
    - Automaker platform sourcing teams
    - Vehicle engineering and manufacturing plants
    - Automaker procurement budgets
    - Cell qualification -> pack integration -> serial production nomination
    - Chief purchasing officer, platform leadership, compliance teams
    - Need for qualified, lower-risk local supply that clears cost and volume tests
  - - Commercial-vehicle OEMs
    - Truck and bus manufacturers
    - Fleet vehicle platforms
    - OEM procurement and program finance
    - Pilot supply -> durability validation -> long-cycle platform sourcing
    - Commercial-vehicle sourcing and product teams
    - Duty-cycle fit, warranty confidence, and secure scale-up
  - - Utility-scale storage developers
    - Project sponsors, developers, and integrators
    - Grid-connected storage assets
    - Project SPVs and infrastructure capital
    - Technology selection -> bankability review -> EPC procurement
    - Project sponsor and financing committee
    - Revenue-stack economics and bankable warranty terms
  - - C&I storage integrators
    - EPCs and commercial system integrators
    - Commercial and industrial site operators
    - Integrator procurement and end-customer capex
    - System design -> attachment-rate and ROI analysis -> procurement
    - Integrator procurement head or owner-operator CFO
    - Self-consumption, resilience, and tariff savings
  - - Public or supported programs
    - Scheme administrators and screened procurements
    - Mixed public and private operators
    - Public budgets, subsidy-backed projects, or OEM compliance pools
    - Program rules -> resilience/sustainability screen -> sourcing decision
    - Public buyer or supported-project sponsor
    - Localization, carbon, or resilience criteria that add value beyond sticker price
  notes: Northvolt was not selling to a single generic EV market; the buyer map splits between automotive qualification logic and storage-project bankability logic.
