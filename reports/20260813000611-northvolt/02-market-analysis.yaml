tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - European automotive battery cells
    - Qualified lithium-ion cells sold into passenger-car, van, and selected heavy-vehicle programs in Europe
    - Finished vehicles, charging hardware, and most upstream raw-material value
    - OEM sourcing, engineering, treasury, and compliance teams
    - This was Northvolt's core market and where localization could matter if quality and cost cleared qualification
  - - Heavy-vehicle battery supply
    - Cells for trucks and buses where durability, duty-cycle fit, and supply security matter
    - Vehicle OEM revenue, charging depots, and generic components
    - Commercial-vehicle OEMs and fleet-linked procurement teams
    - Relevant because Scania was a visible anchor customer and heavy transport tolerates fewer supplier failures
  - - Utility-scale and C&I storage cells
    - Cells and systems sold into grid-scale, commercial, and industrial storage deployments
    - Power-market software, EPC-only services, and non-battery flexibility assets
    - Utilities, developers, integrators, EPCs, and project financiers
    - Important second demand pillar that increasingly rewards low-cost, bankable chemistries
  - - Policy-weighted localized supply
    - Projects and procurement screens where sustainability, recycled content, or resilience can influence sourcing
    - Pure merchant imports where origin carries no procurement value
    - Public bodies, subsidized-project sponsors, OEM compliance functions
    - Relevant because EU regulation can shape sourcing preferences even when it does not guarantee economics
  - - Battery-industry adjacency
    - Some value from recycling, qualification support, and local ecosystem clustering
    - Most mining, refining, and finished-vehicle economics
    - Mixed buyer set across the value chain
    - Useful context, but not the same as Northvolt's directly monetizable cell market
  notes: This boundary keeps the chapter on sellable battery-cell demand and explicitly excludes the temptation to treat all electrification spend as Northvolt's market.
