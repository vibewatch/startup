    topic: balance-sheet-stress
    sourceRefs:
    - SR008
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR005
  - id: CR008
    statement: Northvolt's January 2024 $5 billion financing and EIB-backed debt package extended runway but also confirmed that the company still needed large external capital injections to support Ett expansion and recycling buildout.
