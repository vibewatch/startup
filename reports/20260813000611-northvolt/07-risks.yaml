  claims:
  - id: CR001
    statement: By late 2024 to March 2025, Northvolt's downside had already progressed from restructuring into bankruptcy, proving that the core risk was realized rather than theoretical.
    type: inferred
    topic: realized-distress
    sourceRefs:
    - SR002
    - SR004
    - SR008
    - SR010
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QR001
    - QR004
  - id: CR002
    statement: Northvolt's Chapter 11 filing was designed to unlock approximately $145 million of cash collateral and a $100 million DIP facility from an existing customer while operations continued.
    type: observed
    topic: dip-liquidity
    sourceRefs:
    - SR002
    - SR003
    - SR008
    - SR019
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: Northvolt's 2023 annual report showed a company with only about $128 million of revenue against far larger losses and investment needs, demonstrating that commercial scale had not yet become economic scale.
    type: observed
    topic: weak-economics
    sourceRefs:
    - SR001
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR005
    - QR021
  - id: CR004
    statement: Northvolt's annual report showed negative operating cash flow and heavy investing cash outflow in 2023, meaning the model remained dependent on external financing even before the final distress cycle.
    type: observed
    topic: burn-dependence
    sourceRefs:
    - SR001
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR005
  - id: CR005
    statement: Northvolt's September 2024 strategic review explicitly re-scoped operations toward large-scale cell manufacturing and prepared workforce resizing, showing management had already concluded the earlier expansion plan was unsustainable.
    type: company-claimed
    topic: strategic-retrenchment
    sourceRefs:
    - SR005
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR006
  - id: CR006
    statement: ElevenFlo's restructuring summary says delayed ramp-up, large front-loaded investment, and uneven demand pushed Northvolt into a severe liquidity squeeze by late 2024.
