- id: partner-dependency-people-and-execution
  title: Partner dependency, people risk, and execution discipline
  body: >-
    Northvolt's dependency map was unusually entangled. Scania appeared as customer, DIP lender, and later buyer of the Industrials business; Volkswagen appeared as investor, strategic customer, and industrial ecosystem anchor; public institutions such as the EIB and EU-linked programs appeared both as validators and as sources of stakeholder exposure. This overlap strengthened the company while the growth story was intact, but it amplified fragility once the ramp slipped because counterparties could simultaneously tighten commercial, governance, and financing pressure. Leadership changes and layoffs added another layer of execution risk. Peter Carlsson stepped aside on the day of the U.S. filing, the company moved to an interim operating structure, and public restructuring sources describe workforce reductions ranging from 1,600 announced Swedish cuts in 2024 to roughly 4,000 workers affected by the Swedish bankruptcy, with later EU aid aimed at about 5,800 dismissed workers. A battery manufacturer already struggling with yields could least afford a loss of tacit process knowledge, yet that is exactly what mass downsizing and management churn make more likely.
  claimRefs:
  - CR009
  - CR010
  - CR023
  - CR024
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  - CR036
