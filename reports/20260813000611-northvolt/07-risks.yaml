- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Yield recovery remains insufficient
    - Stable commercial output and customer acceptance data
    - No independently credible proof of sustained economic yield after restart
    - Treat restart story as speculative and re-underwrite from asset value only
  - - Customer concentration remains unchanged
    - Named multi-customer shipment mix
    - Successor operations still rely on one anchor account or one OEM family
    - Apply a concentration discount and assume weak pricing power
  - - Safety / regulatory overhang widens
    - New penalties, charges, or unresolved corrective actions
    - Material escalation in Swedish or Quebec actions
    - Increase reserve assumptions and lower restart confidence
  - - Creditor or successor ownership captures all upside
    - Asset sales, liens, or new financing terms dominate economics
    - Equity-like holders have no clear path above secured stakeholders
    - Value the situation as a distressed industrial workout, not a growth company
  - - Strategic narrative outruns operating proof again
    - New expansion headlines before stable unit economics are shown
    - Management prioritizes footprint over demonstrated line health
    - Treat as a thesis-break signal given the historical failure pattern
  notes: >-
    These kill criteria are analyst monitoring thresholds inferred from retained public evidence rather than company-published risk metrics.
