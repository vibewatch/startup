  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lender covenants and milestone budget controls remain partially opaque
    missingEvidence: Public sources summarize DIP pricing, draw schedule, and cash-collateral monitoring, but do not provide a full diligence-ready picture of every covenant, milestone breach threshold, or budget variance trigger that constrained management.
    whyItMatters: Creditor controls determined how much manufacturing underperformance Northvolt could survive, so hidden thresholds are central to understanding both the collapse and any analogue restart risk.
    diligencePath: Obtain final DIP, cash-collateral, and lender-reporting packages with budget variance history and milestone waivers.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR029
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: full remediation record for Swedish safety deficiencies is not public
    missingEvidence: Public reporting establishes repeated accidents, regulatory concern, and ongoing prosecution, but does not disclose a complete site-by-site closure log for corrective actions, incident recurrence, and line-specific safety performance.
    whyItMatters: A battery factory restart is only investable if the safety-management system is improving in practice rather than being narrated as improved.
    diligencePath: Request regulator correspondence, internal EHS audits, corrective-action trackers, and post-incident engineering changes by area.
    relatedQuestionRefs:
    - QR013
