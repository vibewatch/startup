    topic: distress-causes
    sourceRefs:
    - SR008
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR009
    - QR021
  - id: CR007
    statement: ElevenFlo's legal summary says market reporting at filing cited roughly $5.84 billion of debt and about $30 million of available cash.
