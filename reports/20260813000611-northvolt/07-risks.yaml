    missingEvidence: Public sources show Scania, BMW, Volkswagen-linked structures, Quebec, and Lyten-era restart plans, but not a full matrix explaining which customers, projects, and product lines remained economic, transferable, cancelled, or dormant after insolvency.
    whyItMatters: That matrix determines whether successor value is truly commercial or mostly residual strategic optionality.
    diligencePath: Reconcile customer contracts, successor supply arrangements, trustee sale files, and project-level capital plans for every major site and account.
