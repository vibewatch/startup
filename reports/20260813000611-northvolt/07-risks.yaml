callouts:
- calloutType: risk
  title: Manufacturing economics was the master risk
  body: >-
    Northvolt proved that strategic demand and policy support cannot compensate for weak commercial yield. Once the factory economics broke, customer, financing, and governance risk all accelerated.
  claimRefs:
  - CR003
  - CR021
  - CR039
- calloutType: risk
  title: Cross-border restructuring bought time, not a cure
  body: >-
    The U.S. filing enabled cash collateral, DIP financing, and asset-sale authority, but it did not produce a confirmed standalone recovery path before the Swedish bankruptcy took over the core assets.
  claimRefs:
  - CR002
  - CR019
  - CR020
- calloutType: risk
  title: Safety and environmental issues widen the downside beyond cash flow
  body: >-
    Workplace investigations in Sweden and environmental fines in Quebec show that Northvolt's distress created compliance and accountability questions that extend beyond plant utilization.
  claimRefs:
  - CR013
  - CR015
  - CR017
- calloutType: insight
  title: Asset value survived even when the equity thesis failed
  body: >-
    Lyten's acquisitions and the preservation of Labs, Ett, and recycling assets show that the industrial stack retained strategic value, but that value was captured through distress rather than through Northvolt's original growth model.
  claimRefs:
  - CR035
  - CR037
