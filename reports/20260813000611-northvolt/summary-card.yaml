summary:
  headline: >-
    Northvolt proved that Europe could assemble a strategically important battery platform with real customer demand and
    massive financing access, but the legacy equity story appears broken by insolvency; only successor asset exposure
    may merit fresh underwriting.
  overallScore: 2
  recommendation: avoid
  confidence: medium
  riskRating: critical
  valuationStance: expensive
