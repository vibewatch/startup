  topStrengths:
    - Northvolt 建成了真正的大规模电池资产、实验室、IP 和工业 know-how，重要到让后续买方愿意推动持续经营转让。
    - 公司靠 BMW、Scania、Volkswagen、Volvo 相关结构及其他大型交易对手证明了实质战略需求，而不是停留在假设客户兴趣。
    - 披露融资超过 $15 billion，加上重大公共政策支持，证明该平台曾通过严格外部验证。
    - Ett、Labs、回收及相关项目拼出更宽的工业栈，不是单条试点产线式科学实验。
    - 后续交易显示，破产之后，资产、人才和客户相关性的某种组合仍保有价值。
  topRisks:
    - 原普通股排在破产程序、债权人索赔和受托人主导的资产出售之后，公开证据看回收高度存疑。
    - 制造经济性与良率失败吞没了订单簿、客户和融资优势；任何未来价值都先卡在重启证明。
    - 客户集中度一直偏高，BMW 取消订单和 Scania 后期的单一重要性，都暴露需求变现有多脆弱。
    - 安全、环保和公共资金义务可能继续侵蚀价值，或让瑞典、德国、魁北克之间的资产转让更复杂。
    - 公开证据在重启资本开支、营运资本、客户重新签约和继承方精确清偿顺位上仍太弱，无法支持干净估值。
  unresolvedGaps:
    - 美国与瑞典程序下，原股东最终回收清偿顺位尚未被公开调和到可决策程度。
    - 公开来源没有提供继承所有权下，良率、废品率、利用率、资本开支或营运资本的完整重启运营模型。
    - 破产后逐客户合同连续性、定价和资质状态仍不透明。
    - 环境、安全、劳动和公共资金负债如何逐资产分配，公开文件还没有完整映射。
    - 围绕存续平台的任何新继承融资机会，目前没有公开股权标记或工具披露。
