- id: northvolt-differentiation-switching-and-moat-verdict
  title: Northvolt Differentiation, Switching, and the Moat Verdict
  body: Northvolt did have real differentiators. Official and partner materials show a company with blue-chip European OEM backing, EIB financing, a large order book, installed capacity, a sustainability and recycling narrative, and an attempted chemistry extension into sodium-ion for storage. But those advantages did not prove durable. The strategic review narrowed scope, the company had to enter Chapter 11 for emergency liquidity, the Swedish entities then filed for bankruptcy, and by May 2025 the only remaining named customer at Ett was Scania. The competitive lesson is that battery switching costs are real before qualification, but not permanent after a supplier loses trust on yield, cost, or capital adequacy. BMW walked away, Scania reportedly could not justify underutilized output, and Volkswagen had already built a route to captive supply through PowerCo. In 2026 Northvolt's competition is therefore less about winning new share than about which rival ecosystems inherit its former
    demand, talent pool, and Europe-sovereignty storyline—and on that score the live advantage sits with CATL, PowerCo, and the still-ramping surviving European peers, not with legacy Northvolt.
