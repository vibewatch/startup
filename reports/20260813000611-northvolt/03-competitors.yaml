- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Northvolt moat claim
  - Threat vector
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - European location and sovereignty narrative
    - PowerCo, ACC, and Verkor also claim local strategic value while CATL localizes physically
    - Europe now has multiple “in Europe, for Europe” stories, not just Northvolt
    - High
    - Test whether any surviving Northvolt assets still command unique policy support or only generic sympathy
  - - Blue-chip OEM backing proves demand
    - OEMs can cancel, switch, or internalize supply
    - BMW cancelled, Scania balked at cost, Volkswagen built PowerCo
    - Critical
    - Trace which former Northvolt programs migrated where and on what terms
  - - Sustainability and recycling branding create a premium moat
    - Chemistry cost and yield can overwhelm ESG differentiation
    - LFP cost pressure and shutdown evidence show buyers do not pay any price for localization
    - High
    - Demand proof of willingness-to-pay, not only policy alignment
  - - European startup scarcity creates whitespace
    - Surviving peers like ACC and Verkor can occupy the same political and customer narrative
    - Regional challenger slot is contested even after Northvolt collapsed
    - High
    - Compare live ramp evidence, not past fundraising or headlines
  - - Technology optionality broadens the platform
    - CATL, Samsung SDI, BYD and PowerCo are already broader on chemistry and roadmaps
    - Northvolt tried sodium-ion, but rivals remained stronger on proven scale
    - Medium
    - Identify whether any transferred IP creates a defendable niche under new ownership
  - - Qualification creates lock-in
    - Qualification matters only while the supplier remains trusted
    - Northvolt still lost named programs despite prior qualification work
    - High
    - Focus on supplier resilience, warranty strength, and quality consistency
  - - Large historical order book equals durable moat
    - Backlog did not prevent insolvency or factory wind-down
    - Order visibility was real, but convertibility into healthy output was weaker
    - High
    - Ask which backlog elements were still live, financeable, and profitable at collapse
  notes: This register is analytical rather than purely factual. Severity reflects competitive durability for Northvolt as a standalone case, not legal materiality.
