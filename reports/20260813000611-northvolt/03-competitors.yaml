  - - PowerCo
    - Transfer pricing undisclosed
    - Internal Volkswagen supply with standardized Unified Cell architecture
    - NMC today, LFP and solid-state path possible, cell-to-pack alignment
    - Captive internal economics make it hard for merchant startups to win VW wallet share
  - - LGES / Samsung / SK On
    - Undisclosed
    - Incumbent OEM supply relationships across multiple form factors and chemistries
    - Global battery portfolios spanning EVs and, for some, ESS or PHEV
    - Even without public prices, buyers know these suppliers as repeatable industrial partners
  - - ACC / Verkor
    - Undisclosed
    - European localized supply narratives with policy support and named industrial sites
    - Low-carbon or high-performance European EV cells
    - Premium European alternative only works if customers accept price or risk trade-offs
  - - BYD
    - Vehicle-embedded economics rather than transparent cell list pricing
    - Integrated vehicle-plus-battery model
    - Blade LFP emphasizes safety, life, and cost efficiency
    - Sets a low-cost integrated benchmark that standalone suppliers struggle to match
  - - Panasonic Energy
    - Undisclosed
    - Broad automotive and industrial battery supply
    - Vehicle-mounted and industrial batteries
    - Benchmark for technical credibility more than for Europe-localized merchant pricing
