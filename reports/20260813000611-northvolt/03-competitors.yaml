- id: asian-incumbents-and-oem-captive-scale
  title: Asian Incumbents and OEM-captive Scale
  body: 'The hardest competitive ceiling on Northvolt came from suppliers that combined real volume with chemistry breadth. CATL''s Europe strategy is the clearest example: official releases describe operational plants in Germany and Hungary, a €4.1 billion Spain JV with Stellantis for up to 50 GWh of LFP capacity, and Europe-specific LFP products optimized around lifespan, fast charging, and safety. BYD reinforces the same cost and chemistry pressure from another angle, using Blade LFP to emphasize safety, long cycle life, and lower dependence on nickel and cobalt. Korean incumbents add a different kind of threat. IEA analysis says Korean producers such as LG Energy Solution remain Europe''s largest battery manufacturers even after share losses to China, while Samsung SDI and SK On continue to pair automotive relationships with live product roadmaps and local or near-local operating footprints. PowerCo is the most dangerous Europe-specific substitute because it combines live Salzgitter
    output, chemistry flexibility, and captive Volkswagen demand—advantages Northvolt never had at the same time.'
