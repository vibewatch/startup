  - type: conflicting-data
    severity: material
    topic: post-bankruptcy-customer-migration
    missingEvidence: Public reporting does not fully map which former Northvolt customer programs or contracted volumes definitively migrated to named rivals by 2026.
    whyItMatters: That migration map is the cleanest way to identify who actually captured Northvolt's competitive position after collapse.
    diligencePath: Gather OEM sourcing updates, trustee materials, and supplier qualification disclosures showing where former Northvolt programs were re-awarded.
