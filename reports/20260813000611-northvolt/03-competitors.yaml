  rows:
  - - Northvolt (legacy)
    - Independent European battery platform in insolvency
    - 16 GWh installed capacity and $53B order book at YE2023
    - Passenger EVs, heavy vehicles, ESS, recycling
    - European location, sustainability narrative, former blue-chip OEM backing, attempted sodium-ion path
    - No longer a normal standalone supplier after Chapter 11, Swedish bankruptcy, and Ett shutdown
  - - CATL
    - Chinese incumbent
    - '>€11bn invested in Europe; Spain JV up to 50 GWh; Germany and Hungary already operational'
    - Mass-market EVs, premium EVs, ESS
    - LFP and NMC scale, Europe footprint, deep supplier and OEM network
    - Lower European sovereignty fit than a local champion and no need to preserve Northvolt-style independence story
  - - PowerCo
    - OEM-captive European scale arm
    - Salzgitter 20 GWh first stage expandable to 40 GWh; expected to cover ~50% of VW Unified Cell demand
    - Volkswagen Group brands
    - Captive demand, chemistry flexibility, live European output, standard factory model
    - Less available to third-party OEMs than a merchant supplier
  - - LG Energy Solution
    - Korean incumbent
    - Largest battery producers in Europe as a Korean group per IEA class evidence
    - Global automotive and multi-application battery demand
    - Global production network and incumbent customer trust
    - Public source pack in this chapter is thinner on current Europe-specific product economics than on CATL or PowerCo
  - - Samsung SDI
    - Korean incumbent
    - 2026 profit turned positive again; premium and affordable EV offerings plus solid-state roadmap
    - Premium EVs, affordable EVs, PHEVs, ESS
    - Prismatic and cylindrical cells, cobalt-free offerings, solid-state ambition
    - Public Europe-footprint detail is lighter here than on CATL, PowerCo, or ACC
  - - SK On
    - Korean incumbent
    - Independent since 2021 with Hungary subsidiaries and EV-focused battery business
    - EVs with emerging ESS/BaaS interest
    - Safety and fast-charge positioning, OEM relationships, local subsidiaries
    - Less visible Europe-specific differentiation in the public source pack than CATL or PowerCo
  - - ACC
    - European JV peer
    - 2,500+ employees; Billy-Berclau operational; IPCEI-backed
    - European automotive batteries
    - Shareholder backing and live French ramp
    - Still an execution-sensitive European project rather than a proven cost leader
  - - Verkor
    - European startup peer
    - 16 GWh annual capacity target, ~1,000 employees, first on-site batteries in 2026
    - European mobility and stationary storage
    - Low-carbon French production and current industrial ramp momentum
    - Smaller scale and still proving serial production
  - - BYD
    - Integrated Chinese incumbent
    - Blade Battery deployed across BEV and DM-i lineup with >5,000 cycles
    - EVs and plug-in hybrids
    - LFP safety, cycle life, and integrated vehicle-plus-battery economics
    - Less explicit Europe-local manufacturing evidence in this chapter than CATL or PowerCo
  - - Panasonic Energy
    - Global incumbent benchmark
    - Broad business across vehicle-mounted and industrial batteries
    - Automotive and industrial batteries
    - Technical credibility and diversified battery scope
    - Not a core Europe-sovereignty comparator in this source pack
  notes: This table mixes official company disclosures with independent market context. Scale markers prioritize what is public and current over perfectly normalized like-for-like production figures.
