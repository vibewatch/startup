  - type: private-evidence-only
    severity: material
    topic: battery-pricing-visibility
    missingEvidence: Public sources do not disclose realized battery-cell ASPs, transfer prices, or discount structures for the major competitors in this chapter.
    whyItMatters: Without price visibility, it is impossible to measure whether Northvolt lost on product quality alone or on an unbridgeable delivered-cost gap.
    diligencePath: Request term sheets, transfer-pricing benchmarks, or procurement comparisons across Northvolt, CATL, PowerCo-linked supply, and Korean incumbents.
    relatedQuestionRefs:
