  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape After Northvolt’s Collapse
        blocks:
          - type: paragraph
            body: >-
              Northvolt's competitive landscape has to be read in two timeframes at once. In the buildout phase it
              competed as an independent European battery platform against Asian incumbents, OEM-backed internal supply
              arms, and a smaller set of regional startups. In the 2026 reality it no longer competes as a normal
              standalone merchant supplier at all: Chapter 11, Swedish bankruptcy, and the wind-down of Ett shifted the
              question from growth share to who captures Northvolt's former customers, talent, and political narrative.
              That changes the practical competitor map. CATL, BYD, LG Energy Solution, Samsung SDI, and SK On represent
              incumbent supply with chemistry depth and higher manufacturing trust; PowerCo represents captive OEM scale
              inside Europe; ACC and Verkor represent the surviving European challenger paths; Panasonic remains a broad
              global battery benchmark rather than a core Europe-centered direct peer. The status quo substitute for any
              buyer considering Northvolt became simple: source from a proven incumbent, source from a captive OEM
              ecosystem, or wait for a better-capitalized European challenger to prove serial output.
            claimRefs:
