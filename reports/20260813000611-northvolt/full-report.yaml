  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation framing
        blocks:
          - type: paragraph
            body: >-
              Northvolt is no longer a normal private-company valuation exercise. The core question is not whether the
              company once deserved a unicorn multiple; it is whether anything in the old capital structure still
              supports recoverable common equity after U.S. Chapter 11, Swedish bankruptcy, DIP financing, creditor
              controls, and trustee-led asset transfers. Public evidence points strongly toward no. The filing package,
              the later bankruptcy process, and the transfer of key assets to Lyten show that strategic industrial value
              survived, but in a way captured by creditors, trustees, and successor buyers rather than by the original
              growth-equity narrative. That distinction drives the recommendation. Investors should avoid legacy
              Northvolt common equity and treat any new exposure as a separate underwriting problem tied to successor
              ownership, restart economics, and asset-specific security. In other words, the right valuation object
              today is not “Northvolt the unicorn,” but “which surviving assets still merit fresh capital, at what
              seniority, and under what proof conditions.”
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
