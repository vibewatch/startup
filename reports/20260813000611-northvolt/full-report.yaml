      - number: '4.4'
        title: Collapse Drivers and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              The final financial verdict is harsher than the topline fundraising story. Northvolt had real customers,
              real lenders, real policy support, and a genuine installed asset base, but the public record suggests that
              contract value and capital raised repeatedly masked the slower question of whether the first factory was
              converting expensive input material and fixed cost into reliable saleable output. Adverse reporting and
              the company’s own filings point to the same pattern: BMW’s cancelled €2 billion contract weakened both the
              revenue bridge and the financing story; the strategic review then paused expansion and cut scope; Chapter
              11 bought temporary liquidity but not a durable recovery; and Swedish bankruptcy followed once no lasting
              recapitalization could be closed. Management later pointed to reduced cash outflow, better yields, and
              stronger serial-line output, but those improvements arrived inside an insolvency process rather than
              before it. For diligence, Northvolt should therefore be treated as a case where market demand and
              fundraising momentum were real, yet still insufficient because unit economics, liquidity resilience, and
              debt-priority math were never brought under control early enough.
