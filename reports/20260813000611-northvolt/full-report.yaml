      - number: '7.3'
        title: Operational, customer, and financing transmission
        blocks:
          - type: paragraph
            body: >-
              The most important Northvolt risk pathway ran from poor industrial output into customer defection and then
              into lender control. Public evidence across the annual report, restructuring materials, and later
              reporting shows a company with genuine order-book demand and large external financing, but without
              manufacturing economics that could support those promises. Output at Ett lagged far below nameplate
              ambition, BMW cancelled its anchor contract, and by the end stage of the process Scania was effectively
              the only remaining customer for Skellefteå output. Once the plant became underutilized, every remaining
              kilowatt-hour became more expensive, which made customer continuity and rescue financing harder rather
              than easier. The DIP terms, cash-collateral controls, and forced asset-sale sequence are therefore best
              read as evidence that creditors had become the real operating constraint. Northvolt did not simply run
              short of money; it lost the right to absorb more learning-curve mistakes on the way to commercial scale.
