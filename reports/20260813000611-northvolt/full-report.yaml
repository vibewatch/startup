      - number: '5.2'
        title: Labs-to-gigafactory industrialization architecture
        blocks:
          - type: paragraph
            body: >-
              The heart of Northvolt’s technical stack is not a single chemistry claim; it is the workflow that moves a
              cell from design into validated sample, then into manufacturing transfer and eventually commercial
              production. Northvolt Labs is the central asset in that chain. Official Labs material says
              cell-development projects move through cell design, sample production, optimization, validation, and final
              design before mass manufacturing at gigafactories. Historical Labs material adds that the site was built
              to industrialize cells rather than mass-produce them, with a 350 MWh line, the same equipment family as
              Northvolt Ett but less automation, and training grounds for operators, process engineers, and maintenance
              teams. Public first-cell and first-delivery materials then connect the workflow end to end: the first Ett
              cell was prismatic, was developed at Labs, and Northvolt said Labs had already spent years designing,
              validating, and industrializing the cells later shipped from Skellefteå. The result is a coherent
              industrialization architecture: Labs handles product and process maturity, Ett scales the qualified
              design, and systems or customers receive cells or packs only after that transfer works.
