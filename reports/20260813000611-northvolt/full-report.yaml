      - number: '4.2'
        title: Losses, Working Capital, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The 2023 statements show Northvolt’s core economic problem directly: the company was spending like a
              scaled heavy-industry operator without booking anything close to scaled industrial revenue. Adjusted gross
              loss was $258 million, adjusted EBITDA loss was $569 million, adjusted EBIT loss was $662 million, and
              reported loss for the year was $1.17 billion. Operating cash flow before working-capital changes was
              already negative, then inventories absorbed another $444 million of cash and took net operating cash
              outflow to $792 million. Inventory quality was also impaired, with the company disclosing a $364 million
              inventory provision including a $322 million write-down tied to lower raw-material market values. None of
              those facts alone proves catastrophic manufacturing yield, but together they show a business whose cost
              absorption, inventory discipline, and gross-margin path were nowhere near stable. Public data never
              discloses realized cost per kWh, scrap rates, labor productivity, or yield by line, so the safest
              conclusion is not to reverse-engineer precise unit economics, but to conclude that unit economics were
              still deeply subscale when the capital structure was already very large.
