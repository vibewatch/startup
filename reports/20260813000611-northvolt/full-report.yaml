      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Northvolt still had meaningful mitigants even in distress: strategic assets, proprietary process know-how,
              some live customer interest, public-policy relevance, and buyers willing to acquire plants, Labs, and
              recycling infrastructure. Those mitigants explain why the assets survived longer than the equity story.
              They do not reverse the fact that the original investment thesis was already broken by insolvency. For
              forward diligence, the right approach is to track whether the successor owners can restart production
              without repeating the same quality and utilization failures, whether unresolved safety or environmental
              liabilities expand, and whether the old partner map reappears as real contracted demand rather than
              symbolic support. Any claim that Northvolt itself remained de-risked after late 2024 would require
              evidence far stronger than continued political interest or asset-sale headlines. The actionable lesson is
              to treat measured operating proof, not strategic narrative, as the gating criterion.
            claimRefs:
