      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Asset value surviving is not the same as equity surviving
            body: >-
              The biggest analytical mistake would be to read Lyten's acquisitions or other asset transfers as proof
              that legacy Northvolt common equity still had recoverable upside.
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV027
          - type: callout
            title: The public comp set is a ceiling discipline, not a direct valuation formula
            body: >-
              QuantumScape, Enovix, Solid Power, and SES AI show what live public battery optionality trades for. A
              bankrupt private cap table deserves a steeper discount, not parity.
            calloutType: insight
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV021
          - type: callout
            title: Historical fundraising is not a valuation floor
            body: >-
              Northvolt raised enormous capital and secured major policy support, but that only proves willingness to
              finance the attempt, not durability of the equity instrument.
            calloutType: risk
            claimRefs:
              - CV011
              - CV013
              - CV023
          - type: callout
            title: Re-open the file only for a fresh security with clear title and economics
            body: >-
              If there is a future opportunity here, it will come from a new owner or new financing structure around
              surviving assets, not from the defunct legacy common story.
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV038
              - CV039
