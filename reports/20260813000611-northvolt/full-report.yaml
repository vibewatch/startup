        - id: stage-1
          label: Strategic alignment
          detail: OEM or storage counterparty wants localized, lower-carbon batteries or system capability.
          tone: neutral
        - id: stage-2
          label: Partnership / contract
          detail: JV, offtake, co-development, or purchase intent is signed years before stable scale production.
          tone: positive
        - id: stage-3
          label: Qualification + ramp gate
          detail: Labs/Ett and quality ramp must convert strategic intent into shippable product.
          tone: warning
        - id: stage-4
          label: Commercial delivery
          detail: Cells or systems begin flowing to named customers.
          tone: positive
        - id: stage-5
          label: Repeat / expansion test
          detail: Customer either broadens commitment, waits on ramp, or re-sources elsewhere.
          tone: warning
        - id: stage-6
          label: Continuity or reset
          detail: Under distress, demand may transfer to a new owner rather than remain with the original supplier.
          tone: neutral
    approximationNotes: >-
      The journey is inferred from public contracts, deliveries, and post-bankruptcy resets rather than from a disclosed
      Northvolt CRM funnel.
    claimRefs:
      - CU004
      - CU007
      - CU008
      - CU010
      - CU014
      - CU030
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      The public funnel is less about lead count than about surviving a sequence of qualification and industrial gates
      before repeat shipments stick.
    data:
      nodes:
        - id: f1
          label: Buyer need
          detail: Europe wants localized battery supply or grid-storage systems
          tone: neutral
        - id: f2
          label: Strategic deal signed
          detail: BMW, Scania, VW, Fluence, or Volvo-linked structures form early
          tone: positive
        - id: f3
          label: Factory and qualification gate
          detail: Ett ramp and production reliability determine whether contracts monetize
          tone: warning
        - id: f4
          label: First deliveries
          detail: Limited commercial shipments prove some conversion
          tone: positive
        - id: f5
          label: Expansion or break
          detail: Customer either expands, pauses, or defects if timing/quality slip
          tone: warning
        - id: f6
          label: Post-distress continuity
          detail: Surviving demand may reappear under Lyten or other asset buyers
          tone: neutral
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    approximationNotes: >-
      This funnel reflects public buyer behavior in a capital-intensive industrial category, not a high-frequency
      software conversion funnel.
    claimRefs:
      - CU008
      - CU010
      - CU014
      - CU016
      - CU019
      - CU031
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public customer proof is strongest for named anchor accounts and weakest for durability metrics and broad
      diversification.
    data:
      columns:
        - Evidence quality
        - Outcome specificity
        - Continuity visibility
      rows:
        - label: BMW
          values:
            - High at signing, weakened later
            - €2bn contract and European production location were explicit
            - Low after cancellation
        - label: Scania
          values:
            - High
            - Heavy-vehicle use case and later financial overlap were visible
            - Low to medium after alternate sourcing
        - label: Volkswagen Group
          values:
            - High
            - Strategic investment, JV, and demand signal were explicit
            - Medium because customer role is partly indirect
        - label: Fluence
          values:
            - Medium to high
            - Storage co-development and purchase intent were explicit
            - Medium because repeat deployments are not public
        - label: Volvo / NOVO
          values:
            - Medium to high
            - Strategic battery-development tie was explicit
            - Low to medium after JV reset and technology-partner search
        - label: Broader ecosystem names
          values:
            - Low to medium
            - Mostly logo-list or partner-list quality
            - Low
    approximationNotes: >-
      The matrix scores proof quality from the retained public record only. It does not imply these relationships had
      equal revenue value.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU012
      - CU016
      - CU023
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Northvolt's residual-severity map is led by manufacturing economics, insolvency control, and dependency overlap
      rather than by isolated market-demand weakness.
    data:
      columns:
        - Likelihood
        - Severity
        - Mitigation maturity
      rows:
        - label: Yield and unit economics failure
          values:
            - Very high
            - Critical
            - Low
        - label: Liquidity / creditor control
          values:
            - High
            - Critical
            - Low-Medium
        - label: Customer concentration and defection
          values:
            - High
            - High
            - Low-Medium
        - label: Safety and legal liability
          values:
            - Medium
            - High
            - Low-Medium
        - label: Environmental / permitting friction
          values:
            - Medium
            - Medium-High
            - Low
        - label: Governance and workforce churn
          values:
            - High
            - High
            - Medium
    approximationNotes: >-
      The matrix is a qualitative analytical ranking based on retained official, legal, regulatory, and independent
      sources rather than a company-published risk model.
    claimRefs:
      - CR001
      - CR013
      - CR017
      - CR021
      - CR022
      - CR033
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Northvolt's main failure chain ran from weak factory economics into customer loss, emergency financing, and
      insolvency-led asset fragmentation.
    data:
      nodes:
        - id: rt1
          label: Low yield / high rejects
          detail: Output and quality lag commercial expectations.
        - id: rt2
          label: Underutilized Ett economics
          detail: Fixed-cost absorption worsens and cells become too expensive.
        - id: rt3
          label: Customer loss / concentration shock
          detail: BMW cancels; Scania becomes dominant remaining anchor.
        - id: rt4
          label: Liquidity crunch
          detail: Existing cash and fundraising capacity stop covering the gap.
        - id: rt5
          label: DIP and cash-collateral control
          detail: Creditors set budgets, milestones, and sale pressure.
        - id: rt6
          label: Bankruptcy and asset sales
          detail: U.S. Chapter 11 and later Swedish bankruptcy transfer control.
        - id: rt7
          label: Successor restart optionality
          detail: Assets may live on even when the original capital stack does not.
      edges:
        - from: rt1
          to: rt2
        - from: rt2
          to: rt3
        - from: rt3
          to: rt4
        - from: rt4
          to: rt5
        - from: rt5
          to: rt6
        - from: rt6
          to: rt7
    approximationNotes: >-
      The map abstracts multiple overlapping events into the dominant causal chain visible across public restructuring
      and operating evidence.
    claimRefs:
      - CR003
      - CR006
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR035
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Northvolt's strategic counterparties were deeply entangled across demand, finance, regulation, and restart
      pathways.
    data:
      nodes:
        - id: d1
          label: Northvolt Ett / Labs core assets
          detail: Manufacturing and industrialization center of gravity.
        - id: d2
          label: Scania
          detail: Customer, DIP lender, and Industrials-business acquirer.
        - id: d3
          label: Volkswagen ecosystem
          detail: Investor, strategic customer, and European battery benchmark.
        - id: d4
          label: EIB and lender group
          detail: Project-finance validation and creditor discipline.
        - id: d5
          label: Swedish court / trustee
          detail: Estate administration and sale pathway.
        - id: d6
          label: Quebec regulators
          detail: Environmental oversight for the North America project.
        - id: d7
          label: Workforce / visa base
          detail: Skilled labor pool with restart sensitivity.
        - id: d8
          label: Lyten / successor owners
          detail: Buyers who may preserve assets but not legacy economics.
      edges:
        - from: d2
          to: d1
        - from: d3
          to: d1
        - from: d4
          to: d1
        - from: d5
          to: d1
        - from: d6
          to: d1
        - from: d7
          to: d1
        - from: d8
          to: d1
    claimRefs:
      - CR018
      - CR023
      - CR029
      - CR030
      - CR031
      - CR032
      - CR035
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: legacy equity sits behind insolvency controls, while surviving asset
      value belongs to successor underwriting, not nostalgic unicorn math.
    data:
      nodes:
        - id: a
          label: Strategic assets survived
        - id: b
          label: Legacy cap table failed
        - id: c
          label: Filings and trustees control recovery
        - id: d
          label: Successor asset value may remain
        - id: e
          label: Avoid legacy common equity
        - id: f
          label: Re-open only for fresh secured or clean successor exposure
      edges:
        - from: a
          to: d
          label: supports asset interest
        - from: b
          to: e
          label: blocks legacy upside
        - from: c
          to: e
          label: subordinates old common
        - from: d
          to: f
          label: requires new underwriting
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV027
      - CV032
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: A few diligence variables dominate the range of plausible value for any successor exposure.
    data:
      items:
        - label: Restart yield and utilization proof
          value: 30
          unit: impact score
        - label: Creditor hierarchy and clean title
          value: 28
          unit: impact score
        - label: Customer re-contracting quality
          value: 25
          unit: impact score
        - label: Restart capex and working capital
          value: 22
          unit: impact score
        - label: Public-comp rerating support
          value: 15
          unit: impact score
    approximationNotes: Ordinal impact bars rather than model outputs. They rank which diligence outcomes would move valuation most.
    claimRefs:
      - CV019
      - CV021
      - CV025
      - CV028
      - CV029
      - CV038
      - CV039
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a scenario range for successor asset-platform value, but not positive legacy
      common-equity recovery.
    data:
      items:
        - label: Bear successor value
          low: 300
          mid: 500
          high: 800
          unit: USD million
        - label: Base successor value
          low: 900
          mid: 1400
          high: 1800
          unit: USD million
        - label: Bull successor value
          low: 2500
          mid: 3200
          high: 4000
          unit: USD million
        - label: Strategic asset headline
          low: 4500
          mid: 5000
          high: 5000
          unit: USD million
    approximationNotes: >-
      These are illustrative, evidence-sensitive successor value ranges anchored by public comp sanity checks and
      distressed transaction reporting. Legacy common recovery remains zero across the displayed cases.
    claimRefs:
      - CV006
      - CV007
      - CV021
      - CV028
      - CV029
      - CV030
      - CV031
      - CV035
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style snapshot of where Northvolt stands as a legacy equity story versus a successor asset watchlist item.
    data:
      items:
        - label: Legacy equity recoverability
          value: Very low
          note: Bankruptcy and asset transfers dominate the old cap table
        - label: Successor asset interest
          value: Medium
          note: Strategic buyers proved surviving asset relevance
        - label: Financing clarity
          value: Low
          note: Full waterfall and restart instrument still partly private
        - label: Customer proof under new ownership
          value: Low
          note: Historical logos exist, but re-contracted demand is not yet visible enough
        - label: Risk rating
          value: Critical
          note: Legal, financial, and operational overhangs remain heavy
        - label: Entry attractiveness today
          value: Very low
          note: Only a new, clean, asset-backed security could improve this
    claimRefs:
      - CV001
      - CV022
      - CV025
      - CV026
      - CV027
      - CV038
      - CV040
