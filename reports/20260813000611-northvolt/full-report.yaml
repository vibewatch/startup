      - number: '8.2'
        title: Bankruptcy waterfall and why legacy equity looks impaired
        blocks:
          - type: paragraph
            body: >-
              The strongest valuation evidence in the public record is negative. Northvolt's own restructuring materials
              show bridge liquidity, not growth capital. The filed schedules explicitly warn that they are not
              consolidated IFRS or GAAP statements and should not be read as enterprise value. Legal reporting then
              shows that the U.S. process moved toward dismissal while the Swedish trustee process took control of the
              core assets. This matters because it means public observers can see liabilities, emergency financing, and
              sale mechanics, but not a clean path for legacy common equity to sit above all those claims. Even
              piecemeal transaction markers reinforce the point. ElevenFlo's summary of Hydrovolt and Industrials
              business transactions suggests that, once insolvency took over, value was being monetized through specific
              asset sales and liability assumptions rather than through a holistic equity recovery story. The old holdco
              might still exist as history, but the public evidence does not support it as an investable security.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV024
              - CV032
              - CV037
      - number: '8.3'
        title: Distressed asset value versus old equity
        blocks:
          - type: paragraph
            body: >-
              The existence of post-bankruptcy asset buyers is the main reason this chapter does not end at literal
              zero. Lyten's announced and completed transactions, DLA Piper's legal completion notice, Noerr's
              description of the German project company's solvent liquidation, and later media coverage all show that
              Northvolt's factories, Labs, land, IP, and some workforce continuity still had strategic worth. But that
              worth should not be mistaken for old-equity recovery. Strategic buyers can pay for selected assets,
              operating continuity, and future optionality while legacy shareholders still recover nothing. The nearly
              $5 billion headline around Lyten's Swedish acquisition is best read as a distressed strategic
              asset-platform marker, not as proof that Northvolt's original common equity retained meaningful value. In
              valuation terms, successor-asset value and pre-bankruptcy equity value diverged sharply. That divergence
              is the most important conclusion in the chapter.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
