      - number: '4.3'
        title: Capital Stack, Bankruptcy Liquidity, and Debt Priority
        blocks:
          - type: paragraph
            body: >-
              Northvolt’s capital structure evolved into a layered mix of equity, convertible paper,
              export-credit-backed loans, bank debt, public guarantees, and project finance long before the core factory
              had fully proved itself. Year-end 2023 consolidated liabilities were $6.35 billion, including $3.77
              billion of convertible loans and roughly $1.76 billion of interest-bearing borrowings, against $2.14
              billion of equity. In January 2024 the company still managed to sign a $5 billion non-recourse project
              financing for Northvolt Ett, including a $1.038 billion EIB-led package, and described the deal as backed
              by more than $55 billion of offtake contracts. That should be read as proof of counterparty belief and
              policy support, not proof of earnings quality. By November 2024 the company needed Chapter 11 to unlock
              approximately $145 million of cash collateral and a $100 million DIP from an existing customer. The filed
              schedules are especially revealing: parent Northvolt AB reported about $430.9 million of personal property
              and $4.60 billion of nonpriority unsecured claims, but the filing itself warns those schedules exclude
              disputed and undetermined items, are not consolidated IFRS statements, and are not a proxy for enterprise
              value. The right financial read-through is that Northvolt had financing access, but progressively more of
              that access came with ranking, covenants, milestones, and restructuring oversight that sat ahead of
              common-equity recovery.
