      - number: '2.4'
        title: Supply Concentration, Policy, and Adverse Economics
        blocks:
          - type: paragraph
            body: >-
              The difficult conclusion is that Europe has a strategically important battery market without yet having a
              forgiving battery industry. Official EU pages emphasize the Batteries Regulation and the Critical Raw
              Materials Act as tools to strengthen autonomy, sustainability, and resilience, but the same public sources
              acknowledge deep import dependence and concentration in materials supply. The IEA adds that China still
              dominates lithium and cobalt processing and holds almost 85% of cell manufacturing capacity, while U.S.
              capacity has expanded quickly under tax credits. Northvolt's 2025 shutdown then shows what those
              structural pressures mean in practice: by the end of the process, Scania was the only remaining customer
              at Ett, underutilized production had become too expensive, and the most obvious substitutes were
              CATL-linked imports or OEM-controlled factories such as Volkswagen's PowerCo network. In other words, the
              market existed, but a European independent still had to clear brutal hurdles on yield, capital cost,
              chemistry mix, and customer confidence.
