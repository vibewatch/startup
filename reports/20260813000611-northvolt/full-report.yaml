  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Demand Floor
        blocks:
          - type: paragraph
            body: >-
              Northvolt should not be sized against all electrification spending. The relevant market is the sale of
              qualified battery cells and closely linked systems into European automotive and stationary-storage
              programs where procurement teams care about cost, safety, reliability, carbon footprint, and resilience of
              supply. That excludes most upstream mining and refining economics, finished-vehicle revenue, charging
              infrastructure, and power-market software. Public policy still matters because Europe continues to
              describe batteries as strategic to climate neutrality, circularity, and industrial autonomy, while open
              market data show that end demand remains real: the IEA says battery demand for EVs and storage reached 1
              TWh in 2024, and ACEA shows EU battery-electric registrations rising again in Q1 2026. The demand floor is
              therefore genuine, but it is narrower than generic clean-tech TAM language and it does not guarantee that
              an independent European producer earns attractive margins or easy financing.
            claimRefs:
