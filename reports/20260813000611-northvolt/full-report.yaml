        - Qualification matters only while the supplier remains trusted
        - Northvolt still lost named programs despite prior qualification work
        - High
        - Focus on supplier resilience, warranty strength, and quality consistency
      - - Large historical order book equals durable moat
        - Backlog did not prevent insolvency or factory wind-down
        - Order visibility was real, but convertibility into healthy output was weaker
        - High
        - Ask which backlog elements were still live, financeable, and profitable at collapse
