      - number: '1.3'
        title: Capital Formation, Customer Anchors, and Industrial Buildout
        blocks:
          - type: paragraph
            body: >-
              Northvolt’s rise was built on an unusually visible combination of customer demand, strategic OEM backing,
              and institutional project finance. The company disclosed over $3 billion raised by mid-2020, over $6.5
              billion by the June 2021 private placement, close to $8 billion after the 2022 convertible note, over $9
              billion after the 2023 extension, and more than $13 billion after the January 2024 $5 billion non-recourse
              financing for Northvolt Ett. The annual report then framed total secured financing at $15 billion by the
              end of 2023, alongside a $53 billion order book. Customer and partner disclosures also show how this
              capital mapped onto industrial assets: BMW signed a €2 billion cell contract, Volkswagen invested about
              €900 million for an approximately 20% stake and a German JV, Scania invested early in heavy-vehicle
              battery development, the EIB supported both Labs and Ett, and Canada and Quebec backed Northvolt Six. This
              breadth is overview-level evidence that Northvolt built real industrial relevance before it ran into
              execution and liquidity failure.
