        title: Named roster and segmentation
        blocks:
          - type: paragraph
            body: >-
              Northvolt’s public customer base was always more concentrated and more strategic than a normal diversified
              industrial roster. Official financing, annual-report, and partner materials repeatedly named BMW, Fluence,
              Scania, Volvo Cars, and Volkswagen Group as key customers or contracted counterparties. Those accounts
              cluster into a small number of buyer types: passenger-vehicle OEMs, heavy-commercial-vehicle OEMs,
              stationary-storage channel partners, and strategic OEM/JV partners that were simultaneously customers,
              investors, or both. The important implication is that Northvolt did not need thousands of customers to
              prove demand; it needed a handful of large, qualification-heavy accounts to convert long-duration
              contracts into shipped cells. That setup created unusual strategic value but also unusual fragility. The
              public pack supports a real customer base, yet it does not support a broad, independent, highly
              diversified buyer portfolio. It also means each named account carried outsized signaling value for
              lenders, policymakers, suppliers, and later asset buyers.
