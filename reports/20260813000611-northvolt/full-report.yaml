  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Northvolt's central risk was always execution, but by late 2024 execution failure had already metastasized
              into legal, customer, financing, and governance stress. The company still had real demand, major public
              backing, and a strategic place in Europe's battery narrative, yet those strengths increased pressure
              because the capital stack, customer expectations, and policy commitments all assumed a faster and cleaner
              production ramp than Northvolt actually achieved. The official U.S. Chapter 11 filing bought only short
              runway through cash collateral and Scania-provided DIP financing, while the later Swedish bankruptcy and
              piecemeal asset sales showed that insolvency protection did not restore a viable standalone equilibrium.
              Investors should therefore rank residual risks in this order: manufacturing economics and quality first,
              liquidity and creditor control second, concentrated partner/customer dependencies third, safety and
              regulatory liabilities fourth, and people/governance execution fifth. These risks are distinct on paper
              but tightly coupled in practice.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR019
              - CR020
              - CR021
              - CR022
              - CR039
