  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio, chemistries, and public product definition
        blocks:
          - type: paragraph
            body: >-
              Northvolt’s public product surface is unusually broad for a company most often described simply as a
              European EV-battery startup. Its products page presents three cell-chemistry families—lithium-ion,
              sodium-ion, and lithium-metal—plus system-level offerings including Voltpack Core, Voltpack Mobile System,
              and Voltrack. The core commercial platform remains lithium-ion: official cell pages describe NMC
              chemistry, prismatic cell formats, customized designs, and a common architecture intended to cover
              multiple applications. Northvolt’s own product pages also separate maturity clearly. Lithium-ion is the
              present production platform; sodium-ion is a lower-cost, non-critical-metals technology aimed first at
              energy storage; and lithium-metal remains an advanced-mobility option associated with Cuberg. This means
              the diligence-safe interpretation is not that Northvolt had one battery product with optional adjacencies,
              but that it was building a layered portfolio with one relatively mature chemistry, one sample-stage
              storage chemistry, one validation-stage aviation/high-performance chemistry, and several system-level
              packaging products around them.
