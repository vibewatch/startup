      - number: '2.2'
        title: Sizing Lenses Across EV and Storage
        blocks:
          - type: paragraph
            body: >-
              The public record supports multiple sizing lenses rather than a single heroic TAM. The automotive lens
              shows a real but uneven recovery: ACEA reported 546,937 battery-electric registrations and 19.4% EU share
              in Q1 2026, while hybrids still led the mix. The broader battery-demand lens is larger: the IEA expects EV
              battery demand to exceed 3 TWh by 2030 in its stated-policies case, and the Commission says global battery
              demand could rise fourteen-fold by 2030 with the EU representing about 17% of that demand. The second
              major lens is stationary storage. Europe added 36 GWh of battery storage in 2025, exceeded 100 GWh
              cumulative capacity, and under SolarPower Europe scenarios could approach roughly 140 GWh of annual
              installations by 2030. For Northvolt, that means the addressable market was never only passenger EVs;
              storage provided a second demand pillar, but one that increasingly favored lower-cost chemistries and
              buyers with strict bankability requirements.
