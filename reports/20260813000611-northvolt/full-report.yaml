      - number: '3.3'
        title: European Challengers and Peer Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Northvolt's closest conceptual peers were the European challengers trying to build a sovereign cell
              industry without full incumbent scale. ACC and Verkor now matter more than failed aspirants because both
              remain visibly alive in 2026, but they do so in different ways. ACC's homepage stresses more than 2,500
              employees, Billy-Berclau as France and Europe's first operational gigafactory, and public support through
              IPCEI, which makes it a backed but still execution-sensitive industrial program. Verkor's 2026 site
              presents a leaner, lower-carbon, France-centered story: a 16 GWh annual capacity target, around 1,000
              employees, and 2026 movement from commissioning into first on-site battery deliveries. Both show that
              Europe still has surviving alternatives to imported cells, but both also underline why Northvolt's failure
              matters: sovereign support, named partners, and good industrial logic are no longer enough without
              transparent ramp discipline. By contrast, Panasonic is best read as a broad incumbent benchmark for
              automotive and industrial batteries rather than as a direct Europe-specific peer, which limits its
              relevance to Northvolt's sovereignty case even if its technical credibility remains high.
