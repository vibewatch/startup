  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Disclosure Quality
        blocks:
          - type: paragraph
            body: >-
              Northvolt was not a pre-revenue science project by 2023, but it was still far from a self-funding
              industrial company. The annual report shows recognized revenue of $128.3 million, with $91.1 million from
              product sales, $12.4 million from project sales, and $24.9 million from other revenue such as raw-material
              sales. That mix matters because it implies sales were still partly tied to engineering work, one-off
              items, and early-stage delivery activity rather than a mature high-volume cell business. The same report
              also shows that project-sale revenue is recognized only when distinct development components are delivered
              and accepted by the customer, which means customer qualification gates can delay accounting conversion
              even when commercial relationships exist. Public sources are strong on order-book headlines and named
              counterparties, but weak on realized ASPs, take-or-pay protection, warranty reserves, rebate mechanics,
              and customer-level profitability. The financial story is therefore not “no revenue,” but “revenue too
              small, too opaque, and too qualification-dependent to underwrite against the size of the manufacturing
              platform.”
