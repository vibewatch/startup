      - number: '8.5'
        title: What would change the call
        blocks:
          - type: paragraph
            body: >-
              The call changes only if the investment object changes. For legacy Northvolt common equity, public
              evidence would need to reveal an unexpected recovery path above secured and restructuring claims; nothing
              reviewed suggests that. For a successor or fresh-security opportunity, the diligence burden is different.
              Investors would need proof of restart yields, credible customer re-contracting beyond symbolic anchor
              relationships, transparent restart capex and working-capital needs, and legal certainty around asset
              title, liabilities, and public-money conditions. They would also need price discipline. The comp set shows
              that even public battery names with cleaner disclosure trade in a wide but finite valuation band. A new
              owner or financing vehicle can become interesting, but only if it combines asset quality with a structure
              that allows new capital to capture upside before hidden claims and emergency financing do. Until then, the
              right stance is to separate curiosity about the assets from willingness to pay for the defunct equity
              story.
            claimRefs:
              - CV023
              - CV028
              - CV029
              - CV031
              - CV033
              - CV034
