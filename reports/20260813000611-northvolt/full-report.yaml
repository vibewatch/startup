      - number: '7.2'
        title: Legal, regulatory, environmental, and safety risk
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory risk did not disappear when Northvolt failed financially; in several cases it became
              more complicated. The bankruptcy processes split across jurisdictions, with the U.S. case handling
              temporary creditor protection and Swedish proceedings handling the core estate and sales process. At the
              same time, workplace-safety investigations around fatal incidents continued, and Swedish prosecutors
              indicated that personal responsibility could still be pursued even if corporate fines became harder to
              apply after bankruptcy. Outside Sweden, Northvolt's Quebec project accumulated environmental penalties
              tied to wastewater and wetland issues, showing that the compliance burden extended beyond factory yield to
              environmental execution and permitting discipline. None of these items alone explains the collapse.
              Together, they matter because they show Northvolt's distress was not just a financing event; it also left
              open-ended questions about process control, management accountability, and regulatory carryover around the
              surviving projects and assets.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
