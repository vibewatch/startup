            title: Northvolt had real customer proof, but most of it came from a very small set of strategic accounts
            body: >-
              BMW, Scania, Volkswagen, Volvo-linked entities, and Fluence are enough to prove demand. They are not
              enough to prove diversification. The customer base was meaningful and narrow at the same time.
