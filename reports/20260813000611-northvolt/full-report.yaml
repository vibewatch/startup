      - number: '2.3'
        title: Buyers, Chemistry, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Northvolt was selling into several linked but distinct buying centers. Passenger-car OEMs and
              commercial-vehicle manufacturers buy through long qualification cycles run by sourcing, engineering, and
              compliance teams; utilities, developers, and EPCs buy storage cells on a different logic centered on
              project economics, warranty, and financing. Chemistry choice now matters as much as buyer type. IEA data
              show LFP reached nearly half of the global EV battery market in 2024, grew to more than 10% of the EU EV
              market, and remained much cheaper than NMC, while the IEA's broader battery analysis says LFP already
              represented 80% of new storage applications in 2023. That shifts the market against a Europe-first thesis
              built mainly around higher-cost NMC ramping. Northvolt's own sodium-ion announcement reinforces this
              point: management was already positioning next-generation storage around abundant materials and
              value-chain independence, implying that the attractive storage market was also the segment where chemistry
              disruption and cost pressure were strongest.
