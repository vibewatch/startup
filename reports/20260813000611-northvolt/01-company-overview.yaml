company:
  name: Northvolt
chapter:
  number: 1
  title: Company Overview
  summary: Northvolt grew from a 2016 Stockholm battery start-up into Europe’s best-capitalized homegrown cell manufacturer, building audited industrial assets in Sweden and expansion projects in Germany and Canada while securing a $53 billion order book and $15 billion of financing by the end of 2023. The same public record then shows a rapid deterioration through the 2024 strategic review, U.S. Chapter 11 filing, and March 2025 Swedish bankruptcy, leaving the 2026 fact pattern defined less by an intact standalone company than by asset transfers to Lyten and unresolved recovery questions for legacy shareholders and creditors.
sections:
- id: identity-footprint-and-current-status
  title: Identity, Footprint, and Current Status
  body: >-
    Northvolt should be understood first as an industrial battery platform rather than a software-style growth company. Official materials consistently describe a business founded in Stockholm in 2016 to build sustainable lithium-ion batteries for automotive and energy-storage customers, with the production system anchored by Northvolt Ett in Skellefteå and Northvolt Labs in Västerås. By the end of 2023 the company had audited revenue, audited employee counts, installed production capacity, and a disclosed order book, which distinguishes it from many concept-stage battery ventures. It also had a wider footprint that stretched across battery systems in Poland and development projects in Germany and Quebec. But the 2026 “current status” is fundamentally different from the 2023 growth narrative: after Chapter 11 in late 2024 and Swedish bankruptcy in March 2025, public sources point to a broken-up asset platform, with Swedish assets moving under Lyten and the legacy Northvolt equity story no longer functioning as a normal going-concern underwriting case.
