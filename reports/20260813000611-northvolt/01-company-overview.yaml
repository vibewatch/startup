- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: >-
    The founder and governance record is clear enough to establish who built Northvolt, but not clear enough to underwrite post-bankruptcy control outcomes. Peter Carlsson is repeatedly identified in official materials as the co-founder who led the company from inception until the Chapter 11 filing, while Paolo Cerruti remained publicly important through the Northvolt Six launch in Quebec. Governance also became increasingly investor-shaped as Northvolt raised successive equity and debt rounds; the 2023 annual report shows Volkswagen as the largest shareholder at 21.0% and Goldman Sachs Asset Management funds at 19.2%, with the ten largest holders accounting for 75.5% of diluted ownership excluding convertible notes. During the restructuring, Peter Carlsson stepped aside, Tom Johnstone acted as interim chairman, and operational control shifted to CFO Pia Aaltonen-Forsell, Matthias Arleth, and CRO Scott Millar. What remains opaque is the current post-insolvency control map: public sources do not provide a clean readout of surviving equity value, creditor priority outcomes, or the governance terms attached to the asset transfers that followed bankruptcy.
