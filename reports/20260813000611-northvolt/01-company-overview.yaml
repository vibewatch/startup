- id: distress-restructuring-and-2026-position
  title: Distress, Restructuring, and the 2026 Position
  body: >-
    The negative chronology is now as important as the growth chronology. Northvolt’s September 2024 strategic review explicitly narrowed the company to large-scale cell manufacturing, put some upstream and cathode assets into care, opened partner processes around systems activities, and warned that major project timelines could move. Two months later the company entered Chapter 11 in Texas, saying it could access about $245 million of new liquidity through cash collateral and debtor-in-possession financing while keeping operations running. Official court and FAQ materials show that Germany and North America were outside that Chapter 11 perimeter, but the U.S. process did not solve the capital problem. In March 2025 Northvolt AB, Ett, Labs, Revolt, and Systems entered Swedish bankruptcy, with the company itself citing capital-cost pressure, demand shifts, supply-chain problems, and internal ramp-up difficulties. By 2026, the operative public evidence centers on Lyten’s takeover of major Swedish assets and the migration of operational value away from legacy Northvolt corporate equity.
