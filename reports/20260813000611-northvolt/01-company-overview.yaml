  enumerationScope:
    coverage: partial
    basis: Includes the most visible investors, customers, public lenders, and acquirers named in official or high-confidence public sources rather than a full creditor matrix or cap table waterfall.
  rows:
  - - Volkswagen Group
    - Strategic investor and former JV partner
    - 2019 release said about €900 million invested for about 20% and a board seat; 2023 annual report showed 21.0% ownership
    - Largest named shareholder in the audited 2023 cap-table snapshot
    - Clarify residual economic recovery after bankruptcy and any continuing supply dependence
  - - Goldman Sachs Asset Management funds
    - Major financial investor
    - 2023 annual report listed 19.2% ownership
    - Second-largest named shareholder in the audited public cap table
    - Recovery value after insolvency is not publicly visible
  - - BMW Group
    - Anchor automotive customer and minority investor
    - Official 2020 supply contract worth €2 billion from 2024; later public reporting linked BMW order cancellation to distress
    - Important for validating real automotive demand before the breakdown
    - Reconcile historic contract value with current status after insolvency
  - - Scania
    - Early partner, customer, and investor
    - 2018 partnership included €10 million investment and an off-take agreement
    - One of the clearest long-duration industrial relationships in the file
    - Confirm whether any DIP role or post-bankruptcy supply continuation was formalized
  - - European Investment Bank
    - Public-sector lender
    - Supported Labs in 2018, Ett in 2020, and provided over $1 billion in the 2024 expansion package
    - Validates institutional willingness to underwrite Northvolt's asset base
    - Map guarantees, ranking, and residual claims in insolvency
  - - Government of Canada and Government of Quebec
    - Project-support backers for Northvolt Six
    - Supported a 60 GWh Quebec factory with the first 30 GWh phase framed as a $5 billion investment
    - Critical to Northvolt’s North American expansion thesis
    - Current support obligations under a changed ownership or insolvency structure remain unclear
  - - Lyten
    - Asset acquirer
    - 2025 binding agreement and 2026 completion shifted major Swedish operating assets into new ownership
    - Now the clearest public holder of continuing operating value from the former Northvolt platform
    - Determine which liabilities, employees, contracts, and IP moved versus stayed in insolvency estates
  notes: This map is intentionally selective and does not attempt to reconstruct the full creditor waterfall, which is not publicly disclosed in a decision-useful form.
