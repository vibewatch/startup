callouts:
- calloutType: strength
  title: Northvolt built audited industrial scale before it failed financially
  body: The 2023 annual report and 2024 financing releases prove Northvolt was not a slideware battery thesis. It had revenue, installed capacity, a large order book, a disclosed shareholder base, and enough lender confidence to close a $5 billion project financing before the distress spiral overwhelmed the platform.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO011
  - CO012
  - CO013
- calloutType: risk
  title: The current governance and recovery picture is much less visible than the historical growth picture
  body: Public disclosures are strong on what Northvolt built and how it raised capital, but weak on what legacy shareholders or unsecured creditors will recover, what post-sale obligations remain, and how much of the original cross-border footprint remains economically relevant to the old corporate shell.
  claimRefs:
  - CO017
  - CO020
  - CO025
  - CO028
  - CO038
  - CO039
  - CO040
- calloutType: insight
  title: In 2026 Northvolt is best analyzed as a distressed asset and technology transfer case
  body: The right overview frame is no longer “Can Northvolt become Europe’s battery champion?” but “Which of Northvolt’s assets, people, customer relationships, and technologies survive under new ownership, and what is left in the insolvency estates?”
  claimRefs:
  - CO032
  - CO033
  - CO034
  - CO038
