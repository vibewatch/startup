- id: TO002
  title: Leadership and founder table
  columns:
  - Person
  - Public role
  - Why they matter
  - 2024-2026 transition signal
  - Diligence note
  enumerationScope:
    coverage: partial
    basis: Covers founders, restructuring leaders, and the Swedish bankruptcy trustee who are explicitly visible in the retained public source pack, rather than every historical board member or committee.
  rows:
  - - Peter Carlsson
    - Co-founder; CEO until November 2024; then board member and senior advisor
    - Founder most associated with strategy, fundraising, and industrial narrative
    - Stepped aside on the day of the Chapter 11 filing
    - Key-person dependence was obvious, but current influence after insolvency is unclear
  - - Paolo Cerruti
    - Co-founder; CEO of Northvolt North America in 2023
    - Public face of the Quebec buildout and cross-Atlantic expansion
    - Visible on the Northvolt Six launch but not central in later Swedish restructuring disclosures
    - Clarify any continuing role after bankruptcy and post-Lyten asset transfers
  - - Tom Johnstone
    - Interim chairman
    - Board-level spokesperson during restructuring and Swedish bankruptcy
    - Fronted the company’s 2025 bankruptcy message
    - Current board authority over disposed assets is not publicly clear
  - - Pia Aaltonen-Forsell
    - CFO; joint operational leader during Chapter 11
    - Central finance executive during liquidity crisis and restructuring
    - Elevated into day-to-day leadership after Carlsson stepped aside
    - Need post-sale role and authority confirmation
  - - Matthias Arleth
    - President of Cells, later COO and joint operational leader
    - Core manufacturing executive during ramp-up and restructuring
    - Publicly moved into a larger operating role during Chapter 11
    - Later appeared in Lyten Sweden leadership context, showing continuity of operating talent
  - - Scott Millar
    - Chief Restructuring Officer
    - Restructuring specialist supporting Chapter 11 process
    - Added specifically for financial and legal transition work
    - Role suggests operational distress had exceeded normal management capacity
  - - Mikael Kubu
    - Swedish bankruptcy trustee nominee / trustee office lead
    - Oversaw sale process and asset-disposition path after March 2025 filing
    - Shifted control from corporate management toward insolvency administration
    - Trustee-side process details remain more visible than equity-recovery outcomes
  notes: Public materials identify restructuring-era leaders and the trustee more clearly than they identify current board committees, reserved matters, or residual shareholder rights.
