  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: A court- or trustee-level statement on expected recoveries for legacy equity and unsecured creditors, or a transaction document showing how value was allocated across sold assets.
    whyItMatters: Without a recovery waterfall or surviving equity value marker, any 2026 standalone valuation claim for legacy Northvolt would be speculative.
    diligencePath: Review Swedish trustee updates, creditor communications, and any published sale agreements or court summaries tied to Lyten and other asset disposals.
    relatedQuestionRefs:
    - QO024
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A consolidated post-bankruptcy employee count by remaining entity and by transferred asset package.
    whyItMatters: The public record mixes audited 2023 group headcount, Sweden-only bankruptcy-era employment, and 2026 Lyten rehiring plans without a single comparable baseline.
    diligencePath: Pull trustee statements, labor-union disclosures, and acquirer updates that specify retained versus rehired staff by site.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: governance-waterfall
    missingEvidence: Current board composition, reserved matters, creditor ranking, and residual shareholder rights for the insolvency estates and transferred subsidiaries.
    whyItMatters: Governance visibility is central to understanding who still controls technology, litigation, and any remaining economic upside or downside.
    diligencePath: Collect trustee process documents, creditor committee materials, and jurisdiction-specific bankruptcy filings that describe governance and ranking mechanics.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: minor
    topic: germany-and-canada-end-state
    missingEvidence: Definitive 2026 status updates for Northvolt Drei and Northvolt Six after the Swedish asset transfers.
    whyItMatters: The overview can describe announced plans, but not every expansion project’s final legal and operating disposition.
    diligencePath: Monitor Lyten, trustee, German, and Quebec official announcements for confirmed ownership, construction, and subsidy continuity.
    relatedQuestionRefs:
    - QO003
    - QO023
