    - Cuberg recognized certification as a core commercialization dependency
    - No public final certification outcome by the run date
  - - Revolt recycling handling and recall services
    - Operational / offered
    - End-of-life batteries, scrap, recalls, transport, documentation
    - Northvolt built a serious handling and compliance posture around hazardous battery materials
    - Public audit metrics or incident history are not disclosed
  notes: Trust evidence exists, but it is uneven. Northvolt disclosed process controls and selected certifications more readily than product-wide performance records.
