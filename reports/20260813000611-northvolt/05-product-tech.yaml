- id: FE004
  title: Product maturity / capability map
  type: matrix
  layout: wide
  summary: Northvolt’s portfolio was not uniformly mature; the commercial core and the exploratory edge sat at very different readiness levels.
  data:
    columns:
    - Public maturity
    - Best-supported strength
    - Main open risk
    rows:
    - label: Lithium-ion NMC cells
      values:
      - Commercial / shipped historically
      - Low-carbon prismatic platform with real customer deliveries
      - Missing public reliability and margin-quality dossier
    - label: Systems products
      values:
      - Publicly marketed / partially evidenced
      - Extends cells into deployable industrial and grid use cases
      - Sparse public deployment and customer references
    - label: Revolt recycling
      values:
      - Operational / differentiated
      - Deepest public process detail and strongest circularity claim
      - Actual recovery economics and scale by chemistry still opaque
    - label: Sodium-ion
      values:
      - Sample / early commercialization
      - Strong sustainability and materials narrative plus 160 Wh/kg claim
      - No public industrial-scale manufacturing proof yet
    - label: Lithium-metal / Cuberg
      values:
      - Validation stage
      - Best energy-density claims and third-party module validation
      - Certification and scale-up remain the hard part
    - label: Portfolio under bankruptcy / post-Lyten transition
      values:
      - Distressed-transition stage
      - Assets and IP retained strategic value for acquirers
      - Independent Northvolt roadmap continuity broke before full monetization
  approximationNotes: The matrix ranks public maturity, not intrinsic scientific promise. It reflects what the sources actually substantiate by the run date.
