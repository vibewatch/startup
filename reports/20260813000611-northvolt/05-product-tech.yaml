- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Evidence posture
  - Dependency
  - Risk if weak
  rows:
  - - Cell design and sample workflow at Labs
    - Converts customer requirements into validated cell designs
    - Officially documented
    - Depends on R&D, sample production, and on-site test facilities
    - Weak validation would undermine the transfer to Ett
  - - Ett production scale-up
    - Turns qualified designs into commercial volumes
    - Officially documented and historically delivered
    - Depends on stable process control, automation, and workforce ramp
    - Low yield would destroy cost absorption
  - - Advanced chemistry branch (sodium-ion)
    - Builds lower-cost storage chemistry around Prussian White cathode
    - Official plus partner corroboration
    - Depends on Altris materials and commercialization scale-up
    - Could remain a lab success without manufacturing transfer
  - - Advanced chemistry branch (lithium-metal)
    - Pursues ultra-high-energy cells for aviation and future mobility
    - Official product and validation evidence
    - Depends on certification, safety, and manufacturability
    - Validation success may still fail to translate into mass production
  - - Recycling loop
    - Returns metals and production waste into the battery supply chain
    - Officially documented in depth
    - Depends on logistics, safe handling, and hydromet performance
    - If recovery economics disappoint, circularity moat narrows
  - - Automation and manufacturing engineering layer
    - Runs controls, material flow, robotics, commissioning, and loss reduction
    - Developer-signal via careers and role descriptions
    - Depends on scarce industrial talent and strong supplier handoff
    - Slow commissioning or unstable lines would stall product maturity
  notes: Northvolt’s public architecture is broader than cell chemistry alone; it is an operating system connecting design, pilot production, manufacturing, systems, and recycling.
  enumerationScope:
    coverage: partial
    basis: The rows reflect the persistent architectural layers visible across official pages, partner evidence, and developer-signal sources.
