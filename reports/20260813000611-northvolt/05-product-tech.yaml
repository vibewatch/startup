- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Northvolt solution
  - Public proof
  - Key limitation
  rows:
  - - Automotive battery sourcing
    - OEM needs qualified, lower-carbon European cells
    - Prismatic NMC cells developed at Labs and produced at Ett
    - BMW contract, first-cell, first-delivery, lithium-ion product pages
    - Public customer breadth and quality metrics remain limited
  - - Heavy commercial vehicle electrification
    - Truck OEM wants sustainable cells with recycling story
    - Lithium-ion cells plus recycling/circularity narrative
    - Scania partnership and official product positioning
    - Public pack lacks a broad heavy-vehicle product-performance dossier
  - - Grid / stationary storage deployment
    - Buyer needs low-cost, long-life cells or packaged systems
    - Sodium-ion roadmap plus Voltpack / Voltrack systems
    - Products page, sodium-ion pages, Voltrack listing
    - Sodium-ion scaling and system-install base remain only partly disclosed
  - - Electric aviation / advanced mobility
    - Operator needs extremely high specific energy and safety validation
    - Cuberg lithium-metal cells and validated module
    - Lithium-metal product page and Cuberg/TÜV validation article
    - Certification and scaled commercialization still in progress
  - - Battery end-of-life and scrap handling
    - Producer or owner needs compliant, high-yield recycling
    - Revolt collection, discharging, dismantling, black-mass recovery, hydromet
    - Revolt pages and recycling partners page
    - Public economics by chemistry and actual yield disclosure remain incomplete
  notes: The product story is strongest when mapped to concrete user jobs. Northvolt’s offerings make sense in workflow terms even where the public record remains thin on deployment metrics.
