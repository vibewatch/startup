callouts:
- calloutType: insight
  title: Northvolt’s deepest technical moat was industrialization plus recycling, not a fully public core-cell datasheet
  body: >-
    Public sources give significant detail on Labs, Ett, and Revolt, but much
    less on cycle-life curves or customer-wide field-performance data for the
    mainstream lithium-ion line. That pattern suggests Northvolt’s strongest
    disclosed differentiation sat in process integration and circularity.
  claimRefs:
  - CE009
  - CE010
  - CE029
- calloutType: insight
  title: Advanced chemistry was real, but clearly less mature than the lithium-ion base business
  body: >-
    Sodium-ion had validated energy-density claims and sample availability, and
    Cuberg lithium-metal had striking validation numbers, but both programs were
    still on future-facing roadmaps rather than proven high-volume commercial
    earnings engines.
  claimRefs:
  - CE014
  - CE017
  - CE024
  - CE028
- calloutType: risk
  title: Portfolio breadth became a liability when financing tightened
  body: >-
    By late 2024 Northvolt was still supporting cells, systems, recycling,
    sodium-ion, and Cuberg lithium-metal, then had to narrow scope sharply in
    the strategic review. Product ambition was real; financial capacity to carry
    it all at once was not.
  claimRefs:
  - CE020
  - CE034
  - CE035
- calloutType: assumption
  title: Later asset sales imply enduring technology value without proving standalone business viability
  body: >-
    Lyten’s willingness to acquire Ett, Labs, Dwa, Cuberg, and remaining IP is
    strong evidence that Northvolt built valuable technical assets. It is not
    evidence that Northvolt itself had already converted those assets into a
    stable, independent product platform.
  claimRefs:
  - CE039
  - CE040
