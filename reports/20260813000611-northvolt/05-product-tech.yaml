tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation or role
  - Main diligence gap
  rows:
  - - Lithium-ion NMC cells
    - Automotive, trucks & buses, energy storage customers
    - Commercial platform; public product and delivery evidence exists
    - Low-carbon prismatic NMC cells with common architecture and customized design
    - No public core-cell cycle-life, fast-charge, or warranty dataset
  - - Sodium-ion cells
    - Energy storage now; mobility later
    - Sample-stage / early commercialization
    - No critical metals, 160 Wh/kg class, cost and safety angle
    - No public scaled manufacturing cadence or broad customer list
  - - Lithium-metal cells
    - Aviation, UAV, advanced mobility
    - Validation-stage / advanced development
    - 395 Wh/kg cell claim and third-party validated module path
    - No public mass-production or automotive qualification proof
  - - Voltpack Core / Mobile / Voltrack systems
    - Industrial, mobile power, grid operators
    - Publicly marketed systems layer
    - Extends Northvolt from cells into usable storage products; Voltrack cites UL 1973
    - Limited public shipment, field-performance, and customer references
  - - Northvolt Labs
    - Internal R&D, customer validation, factory transfer
    - Operational industrialization platform
    - Design-sample-validation bridge between R&D and gigafactory mass manufacturing
    - Public throughput and yield at sample stage remain limited
  - - Revolt recycling platform
    - Northvolt and external recycling customers
    - Operational and expanding
    - Closed-loop recovery, battery-grade metals, integrated hydromet process
    - Actual large-scale recovery economics and throughput per chemistry remain sparse
  notes: The matrix separates currently commercialized lithium-ion and recycling assets from the more developmental sodium-ion and lithium-metal programs.
