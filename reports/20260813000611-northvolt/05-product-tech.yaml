company:
  name: Northvolt
chapter:
  number: 5
  title: Product & Technology
  summary: 'Northvolt’s public technology story is broader than its bankruptcy headlines suggest. The company built a real product stack spanning commercial lithium-ion NMC cells, energy-storage systems, battery recycling, sodium-ion cells, and Cuberg lithium-metal development, with Northvolt Labs acting as the industrialization bridge from cell design to customer validation and factory transfer. The strongest public differentiation is not a fully disclosed core-cell datasheet but an integrated manufacturing-and-recycling system: prismatic low-carbon lithium-ion production, an in-house R&D campus, and Revolt’s recycling loop. The weakest area is maturity disclosure. Northvolt published meaningful product and process proof, but many decisive metrics—cycle life for core NMC cells, field reliability, customer qualification breadth, and post-bankruptcy roadmap continuity—remained only partially visible.'
sections:
- id: portfolio-chemistries-and-public-product-definition
  title: Portfolio, chemistries, and public product definition
  body: >-
    Northvolt’s public product surface is unusually broad for a company most
    often described simply as a European EV-battery startup. Its products page
    presents three cell-chemistry families—lithium-ion, sodium-ion, and
    lithium-metal—plus system-level offerings including Voltpack Core,
    Voltpack Mobile System, and Voltrack. The core commercial platform remains
    lithium-ion: official cell pages describe NMC chemistry, prismatic cell
    formats, customized designs, and a common architecture intended to cover
    multiple applications. Northvolt’s own product pages also separate maturity
    clearly. Lithium-ion is the present production platform; sodium-ion is a
    lower-cost, non-critical-metals technology aimed first at energy storage;
    and lithium-metal remains an advanced-mobility option associated with
    Cuberg. This means the diligence-safe interpretation is not that Northvolt
    had one battery product with optional adjacencies, but that it was building
    a layered portfolio with one relatively mature chemistry, one sample-stage
    storage chemistry, one validation-stage aviation/high-performance
    chemistry, and several system-level packaging products around them.
