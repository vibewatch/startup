- id: public-comp-sanity-check-and-range-discipline
  title: Public comp sanity check and range discipline
  body: >-
    Public battery-equity comps do not value Northvolt directly, but they are useful for disciplining the range. As of 12 August 2026, StockAnalysis and related market-data pages show QuantumScape near $3.9-4.0 billion of market capitalization, Enovix near $1.0 billion, Solid Power around $0.54 billion, and SES AI around $0.21 billion. Those are live, liquid public securities with cleaner cap-table visibility than bankrupt Northvolt ever offers now. The implication is not that Northvolt should trade exactly alongside any one of them. It is that even the public market's option value for battery technology platforms occupies a fairly bounded range, and that a distressed private asset platform should not casually be marked above that range without stronger restart proof. The Lyten and asset-transfer headlines can justify keeping Northvolt's surviving industrial base on the radar. They do not justify treating the old company as a hidden bargain. Scenario discipline therefore matters more than nostalgia for past headline funding.
  claimRefs:
