tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Why it matters
  - Decision implication
  rows:
  - - Recommendation
    - avoid / no legacy common-equity exposure
    - Bankruptcy, filings, and asset transfers point to a broken legacy equity story
    - Do not underwrite upside in pre-bankruptcy common
  - - Confidence
    - medium
    - The negative legacy-equity case is strong, but exact recovery waterfalls and successor economics are still partly private
    - Use wide ranges and avoid false precision
  - - Risk rating
    - critical
    - Secured claims, bankruptcy control, and restart uncertainty dominate
    - Treat the old equity as structurally impaired
  - - Valuation stance
    - legacy equity effectively impaired; successor assets strategic optionality only
    - Asset value survived, but not in a way that clearly benefits old common holders
    - Separate old-cap-table and new-asset underwriting
  - - What supports continued attention
    - Real factories, Labs, land, IP, and strategic buyer interest
    - Surviving industrial assets may justify fresh underwriting in new vehicles
    - Stay curious about successor opportunities, not the original stock story
  - - What would improve the call
    - A fresh security with clean seniority plus restart proof
    - Structure matters more than historical headlines now
    - Revisit only with title clarity, customer proof, and economic ramp evidence
  notes: >-
    This table is a view on public evidence as of 2026-08-13 and distinguishes legacy common equity from successor asset-platform exposure.
