  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Legacy recovery waterfall
    - Creditor ranking, estate costs, and any residual treatment of old equity
    - Determines whether legacy common is merely impaired or functionally worthless
    - Obtain trustee, court, and claims documents across U.S. and Swedish processes
  - - Restart economics
    - Yield, scrap, utilization, working capital, and restart capex under successor control
    - These variables determine whether successor asset value is real or theatrical
    - Request restart operating model and first commercial KPI pack
  - - Customer re-contracting
    - Named customer volumes, pricing, and qualification status after insolvency
    - Demand headlines are not enough for value without monetizable contracts
    - Seek successor customer pipeline and shipment commitments
  - - Liability carryover
    - Safety, environmental, labor, and public-funding obligations attached to each asset
    - Clean title is essential to convert strategic interest into investable value
    - Reconcile estate sale docs, regulator files, and government support conditions
  - - New-security terms
    - Exact seniority, collateral package, preference stack, governance rights, and exit mechanics
    - Good assets can still make bad investments when the instrument is wrong
    - Underwrite only after a full term-sheet and waterfall review
  notes: >-
    The diligence list is intentionally instrument-specific because the next investable object, if any, is a fresh security around surviving assets rather than legacy Northvolt equity.
