- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Hidden senior claims or liabilities dominate value
    - New documents show old or successor claims absorb asset value ahead of fresh capital
    - Asset optionality stops being investable for new money
    - Walk away unless priced as near-liquidation
  - - Restart fails to show economic yield
    - No credible evidence of stable output at acceptable cost
    - Successor story becomes another narrative-only battery turnaround
    - Value using distressed plant assets only
  - - Customer continuity remains symbolic
    - No real re-contracted shipments beyond legacy headlines
    - Strategic relevance does not convert into monetizable value
    - Reduce scenario ranges and demand a deep discount
  - - Public-money conditions or legal liabilities widen
    - New penalties, clawbacks, or contested title reduce clean saleability
    - Recovery value shifts further toward creditors and legal reserves
    - Increase downside weighting materially
  - - New financing repeats emergency bridge logic
    - Fresh money arrives only with punitive terms or opaque priorities
    - Upside is captured by senior capital rather than by equity-like holders
    - Avoid unless security is explicitly senior and asset-backed
  notes: >-
    These triggers are analytical thresholds inferred from retained public evidence and are meant to test whether any fresh security improves on the failed legacy setup.
