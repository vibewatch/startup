schemaVersion: report-v2
artifact: valuation
slug: northvolt
runDate: '2026-08-13'
company:
  name: Northvolt
chapter:
  number: 8
  letter: V
  title: Valuation
  summary: >-
    Northvolt's valuation chapter is best read as a distinction between a failed legacy equity story and a surviving industrial asset platform. Public evidence does not support paying anything for pre-bankruptcy common equity: the company entered Chapter 11, then Swedish bankruptcy, while creditors, trustees, and asset buyers took control of the outcome. What the public record does support is that some of the factories, R&D capabilities, land, people, and customer relevance retained strategic value in distressed sales. Recommendation: avoid / no legacy common-equity exposure; only evaluate successor asset or restart opportunities under a fresh security, with medium confidence and critical risk.
sections:
- id: recommendation-and-valuation-framing
  title: Recommendation and valuation framing
  body: >-
    Northvolt is no longer a normal private-company valuation exercise. The core question is not whether the company once deserved a unicorn multiple; it is whether anything in the old capital structure still supports recoverable common equity after U.S. Chapter 11, Swedish bankruptcy, DIP financing, creditor controls, and trustee-led asset transfers. Public evidence points strongly toward no. The filing package, the later bankruptcy process, and the transfer of key assets to Lyten show that strategic industrial value survived, but in a way captured by creditors, trustees, and successor buyers rather than by the original growth-equity narrative. That distinction drives the recommendation. Investors should avoid legacy Northvolt common equity and treat any new exposure as a separate underwriting problem tied to successor ownership, restart economics, and asset-specific security. In other words, the right valuation object today is not “Northvolt the unicorn,” but “which surviving assets still merit fresh capital, at what seniority, and under what proof conditions.”
  claimRefs:
