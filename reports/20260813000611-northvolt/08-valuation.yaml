  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact waterfall and old-common recovery remain partly opaque
    missingEvidence: Public filings and legal summaries show claims, asset transfers, and bankruptcy control, but they do not provide a complete diligence-ready waterfall proving every layer of creditor recovery and the final treatment of old common across jurisdictions.
    whyItMatters: That waterfall is the difference between “effectively impaired” and “formally worthless,” and it determines whether any tail optionality exists.
    diligencePath: Obtain full estate claim schedules, trustee reports, dismissal mechanics, and jurisdiction-by-jurisdiction distribution waterfall analysis.
    relatedQuestionRefs:
    - QV003
    - QV025
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: successor restart economics are not yet public enough for precision
    missingEvidence: Public sources describe transfers, plans, and asset scale, but not a complete restart model for yield, scrap, utilization, capex, working capital, or target customer pricing under successor ownership.
    whyItMatters: Those variables determine whether successor asset value belongs nearer the base case or the bull case.
    diligencePath: Request restart budgets, first-customer qualification plans, capex schedules, and post-transfer operating KPIs from the new owner.
    relatedQuestionRefs:
    - QV021
    - QV022
    - QV028
    relatedTableRefs:
    - TV003
    - TV004
    - TV005
  - type: private-evidence-only
    severity: material
    topic: public-money and liability carryover by asset is not fully reconciled
    missingEvidence: Public sources show German repayment, Quebec regulatory issues, and Swedish bankruptcy administration, but do not provide one clean matrix allocating public-money obligations, safety/environmental liabilities, and title conditions across each surviving asset.
    whyItMatters: Asset value can erode quickly if buyers or new financiers inherit hidden clawbacks, remediation costs, or title constraints.
    diligencePath: Reconcile regulator files, government support agreements, sale documents, and estate representations for every major site.
    relatedQuestionRefs:
