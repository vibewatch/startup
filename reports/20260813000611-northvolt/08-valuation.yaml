- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Strategic relevance
    - Northvolt built assets important enough for buyers and governments to preserve
    - Strategic relevance did not protect legacy common equity from insolvency
    - A new security with first-priority access to those assets
  - - Asset value
    - Lyten, DLA Piper, and Noerr show that factories, Labs, land, and projects retained value
    - Asset value can accrue entirely to creditors, trustees, or successor owners
    - Verified purchase economics and waterfall allocation for new capital
  - - Customer proof
    - BMW, Scania, Volkswagen, and others prove Northvolt was not a fake-demand story
    - Demand proof did not overcome poor manufacturing economics and concentration risk
    - Multi-customer restart shipments at acceptable cost
  - - Financing headlines
    - Northvolt raised huge sums and secured major public backing
    - Bridge liquidity and project finance did not translate into durable equity value
    - Clear evidence that new capital sits ahead of hidden legacy claims
  - - Public comp read-through
    - Battery public comps show markets still pay for option-like battery platforms
    - Those comps are cleaner and more liquid than a bankrupt private cap table
    - Successor vehicle priced at a real discount to comparable public optionality
  - - Recovery path
    - Assets can restart under new ownership
    - Restart optionality is not the same as old-equity recovery
    - Asset restart proof plus transparent ownership and liability mapping
  notes: >-
    The anti-thesis is not that Northvolt lacked technical relevance; it is that relevance and recoverable legacy equity became disconnected once insolvency took over.
