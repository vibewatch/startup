  - type: conflicting-data
    severity: minor
    topic: post-bankruptcy continuity versus transferred demand
    missingEvidence: >-
      Public reporting shows some anchor demand survived through Lyten or Volvo/NOVO restructuring, but it does not
      reconcile which relationships remained with Northvolt, transferred to buyers, or effectively restarted from zero.
    whyItMatters: >-
      Recovery of strategic demand is not equivalent to retention of a functioning customer book, and that distinction
      shapes how much value should be attributed to the pre-bankruptcy roster.
    diligencePath: >-
      Reconcile estate-sale documents, successor supply agreements, and customer communications to map each major
      account before and after insolvency.
