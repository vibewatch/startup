evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A court- or trustee-level statement on expected recoveries for legacy equity and unsecured creditors, or a
      transaction document showing how value was allocated across sold assets.
    whyItMatters: >-
      Without a recovery waterfall or surviving equity value marker, any 2026 standalone valuation claim for legacy
      Northvolt would be speculative.
    diligencePath: >-
      Review Swedish trustee updates, creditor communications, and any published sale agreements or court summaries tied
      to Lyten and other asset disposals.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A consolidated post-bankruptcy employee count by remaining entity and by transferred asset package.
    whyItMatters: >-
      The public record mixes audited 2023 group headcount, Sweden-only bankruptcy-era employment, and 2026 Lyten
      rehiring plans without a single comparable baseline.
    diligencePath: >-
      Pull trustee statements, labor-union disclosures, and acquirer updates that specify retained versus rehired staff
      by site.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: governance-waterfall
    missingEvidence: >-
      Current board composition, reserved matters, creditor ranking, and residual shareholder rights for the insolvency
      estates and transferred subsidiaries.
    whyItMatters: >-
      Governance visibility is central to understanding who still controls technology, litigation, and any remaining
      economic upside or downside.
    diligencePath: >-
      Collect trustee process documents, creditor committee materials, and jurisdiction-specific bankruptcy filings that
      describe governance and ranking mechanics.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: minor
    topic: germany-and-canada-end-state
    missingEvidence: Definitive 2026 status updates for Northvolt Drei and Northvolt Six after the Swedish asset transfers.
    whyItMatters: >-
      The overview can describe announced plans, but not every expansion project’s final legal and operating
      disposition.
    diligencePath: >-
      Monitor Lyten, trustee, German, and Quebec official announcements for confirmed ownership, construction, and
      subsidy continuity.
    relatedQuestionRefs:
      - QO003
      - QO023
  - type: private-evidence-only
    severity: material
    topic: local-supply-price-premium
    missingEvidence: >-
      Public evidence does not quantify what premium, if any, automotive or storage buyers were willing to pay for
      localized European cells over imported alternatives.
    whyItMatters: >-
      That premium determines whether Europe-first battery manufacturing can earn acceptable returns instead of merely
      winning politically symbolic demand.
    diligencePath: >-
      Collect customer procurement records, term sheets, and internal sourcing memos comparing local-cell bids with
      Asian import alternatives.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: material
    topic: realized-vs-announced-domestic-share
    missingEvidence: >-
      Public sources do not provide a clean, reconciled forecast for what share of 2030 European battery demand will be
      met by realized domestic production rather than imports.
    whyItMatters: >-
      Northvolt's long-term opportunity depends on realized utilization and import substitution, not on announced
      gigafactory nameplate alone.
    diligencePath: >-
      Reconcile plant-by-plant timelines, import data, and OEM sourcing plans against demand scenarios from ACEA, IEA,
      and public project trackers.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: orderbook-segmentation
    missingEvidence: >-
      Northvolt's public materials do not provide a clean split of the more-than-$55 billion order backlog between
      passenger EVs, heavy vehicles, and stationary storage.
    whyItMatters: >-
      The mix matters because each segment has different qualification cycles, chemistry economics, and margin
      structures.
    diligencePath: >-
      Seek customer-by-customer contract schedules, product-mix disclosures, or bankruptcy materials that segment
      backlog by program and geography.
    relatedQuestionRefs:
      - QM011
      - QM019
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: battery-pricing-visibility
    missingEvidence: >-
      Public sources do not disclose realized battery-cell ASPs, transfer prices, or discount structures for the major
      competitors in this chapter.
    whyItMatters: >-
      Without price visibility, it is impossible to measure whether Northvolt lost on product quality alone or on an
      unbridgeable delivered-cost gap.
    diligencePath: >-
      Request term sheets, transfer-pricing benchmarks, or procurement comparisons across Northvolt, CATL,
      PowerCo-linked supply, and Korean incumbents.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: post-bankruptcy-customer-migration
    missingEvidence: >-
      Public reporting does not fully map which former Northvolt customer programs or contracted volumes definitively
      migrated to named rivals by 2026.
    whyItMatters: >-
      That migration map is the cleanest way to identify who actually captured Northvolt's competitive position after
      collapse.
    diligencePath: >-
      Gather OEM sourcing updates, trustee materials, and supplier qualification disclosures showing where former
      Northvolt programs were re-awarded.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: stale
    severity: minor
    topic: northvolt-ip-and-talent-transfer
    missingEvidence: >-
