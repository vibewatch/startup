  - type: private-evidence-only
    severity: material
    topic: durability metrics needed for QU025 remain private
    missingEvidence: >-
      Public materials do not disclose NRR, GRR, churn, repeat-order rates, contract renewal rates, customer
      satisfaction, warranty escapes by account, or a customer-by-customer backlog burn-down.
    whyItMatters: >-
      These are the metrics required to distinguish one-time strategic validation from durable customer resilience in a
      long-cycle industrial account base.
    diligencePath: >-
      Obtain customer cohort reporting, contract amendments, renewal history, account quality dashboards, and backlog
      conversion data before rendering a hard durability verdict.
    relatedQuestionRefs:
      - QU011
      - QU012
      - QU025
    relatedTableRefs:
