    title: Segment / buyer map
    columns:
      - Segment
      - Primary Buyer
      - Primary User
      - Payer Entity
      - Core Workflow
      - Budget Owner
      - Adoption Trigger
    rows:
      - - Digital Startups & D2C Brands
        - Founder / CTO
        - Full-Stack Software Engineers
        - Merchant Commercial Entity
        - Payment checkout integration, webhook processing, subscription billing
        - VP Engineering / Product Lead
        - Rapid self-serve API onboarding and high initial payment success rates.
      - - Mid-Market Enterprises & SaaS
        - VP Finance / Controller
        - Finance & Accounting Ops
        - Enterprise Operating Entity
        - Vendor payout automation, tax payments, employee payroll disbursements
        - Chief Financial Officer (CFO)
        - Manual payout bottleneck or multi-bank reconciliation failures.
      - - Large Enterprises & Conglomerates
        - Chief Information Officer / Treasury
        - Corporate Treasury Team
        - Corporate Parent / Operating Units
        - Custom payment gateway routing, high-volume settlement, ERP ledger sync
        - Head of Corporate Treasury
        - Need for dedicated account management, multi-gateway failover, and strict SLAs.
      - - Global Multinationals Entering India
        - Global Head of Payments
        - Regional APAC Ops Lead
        - International Merchant Entity
        - Cross-border acceptance, currency conversion, data localization compliance
        - Global Digital Revenue Lead
        - Failing domestic transaction completion rates (30% baseline) without local integration.
