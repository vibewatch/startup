callouts:
  - calloutType: insight
    title: The Zero-MDR Dilemma in Payment Aggregation
    body: While UPI accounts for the vast majority of consumer transaction volume, the zero-MDR mandate on transactions under ₹2,000 forces payment aggregators to cross-subsidize payment processing through higher-margin business banking (RazorpayX), merchant working capital (Capital), and cross-border enterprise gateway contracts.
    claimRefs:
      - CM006
      - CM008
      - CM010
      - CM011
      - CM013
  - calloutType: risk
    title: Regulatory Headwinds and Gross Margin Compression
    body: Intense competitive pressure from bank gateways and domestic fintechs, coupled with partner bank revenue-sharing splits and increasing compliance requirements (100% data localization, transaction failure limits under 0.5%), compressed Razorpay's gross margins from 39.4% in FY24 to 33.8% in FY25.
    claimRefs:
      - CM009
      - CM010
      - CM011
