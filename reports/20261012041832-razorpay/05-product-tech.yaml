chapter:
  number: 5
  title: "Product & Technology"
  summary: "Razorpay operates a full-stack financial technology platform spanning payment gateway, merchant acquiring, POS infrastructure, and business banking APIs. Built on AWS Kubernetes microservices with AI-driven dynamic routing, the platform delivers high transaction throughput across India and Southeast Asia while navigating margin compression and regulatory compliance on partner banking rails."
sections:
  - id: "core-platform-and-workflow"
    title: "Product Definition and Full-Stack Merchant Workflow"
    body: "Razorpay delivers a comprehensive financial technology stack designed to simplify the entire lifecycle of money movement for digital and physical merchants. The core offering encompasses multi-channel payment acceptance via online payment gateways, payment links, and subscription management, supporting over one hundred payment methods across UPI, card networks, and netbanking. Beyond basic digital checkout, Razorpay addresses broader merchant operating workflows through RazorpayX business banking accounts, automated payroll compliance, and cross-border currency collection. The platform integrates physical and digital commerce touchpoints through Razorpay POS, deploying smart Android EDC terminals that bridge offline retail counters with unified cloud reporting and digital invoice tracking."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
  - id: "workflow-integration-and-developer-experience"
    title: "Developer Integration, API Protocols, and Omnichannel Surfaces"
    body: "The platform's competitive advantage in merchant onboarding stems from its developer-centric integration framework, characterized by standardized REST APIs, automated webhooks, and comprehensive software development kits across major programming languages. Merchant applications interact with the payment engine through a two-step authorization and capture lifecycle, with automated settlement reporting pushed via event-driven HTTP webhooks to eliminate manual reconciliation. To streamline enterprise and agentic adoption, Razorpay introduced an MCP server based on the Model Context Protocol, enabling artificial intelligence assistants to interface directly with payment backend services. Omnichannel merchant expansion is supported by strategic platform acquisitions, including Ezetap for offline point-of-sale hardware and Curlec for Southeast Asian recurring subscription billing."
    claimRefs:
      - "CE002"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE013"
    tableRefs:
      - "TE002"
  - id: "technical-architecture-and-operating-stack"
    title: "Cloud Infrastructure, Microservices, and Container Orchestration"
    body: "Razorpay's operating architecture employs a hybrid cloud model anchored by Amazon Web Services infrastructure, containerized microservices, and automated orchestration. Microservices handling payment routing, checkout state, order creation, and refund processing run across AWS Elastic Kubernetes Service clusters, utilizing Docker containers to facilitate standardized deployment pipelines and continuous delivery. Real-time observability and performance telemetry are managed through Prometheus 2 time-series monitoring paired with Grafana visualization, tracking pod health, API response latency, and system error rates. At the network boundary, an AI-powered smart routing system dynamically evaluates bank gateway performance to optimize transaction success rates; however, independent benchmark data verifying packet-level failover latency during nationwide banking outages remains unavailable."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "resilience-compliance-and-technical-risks"
    title: "Regulatory Compliance, Bank Dependencies, and Systemic Vulnerabilities"
    body: "Operating as a licensed payment aggregator requires strict adherence to Reserve Bank of India frameworks and data localization mandates, creating substantial technical and operating overhead. The central bank's temporary embargo on onboarding new merchants between December 2022 and December 2023 demonstrated the acute vulnerability of payment aggregator infrastructure to supervisory interventions. Furthermore, because government policy caps merchant discount rates at zero on most consumer UPI transactions, Razorpay faces structural gross margin compression on high-volume payments, necessitating diversification into higher-margin software services like Thirdwatch AI fraud detection and cross-border collections. Despite sophisticated multi-cloud architecture, the service remains fundamentally dependent on the uptime and legacy batch constraints of partner banks and the national UPI switch."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE014"
