figures:
  - id: "FE001"
    title: "Product Architecture Map"
    type: "stack"
    summary: "Layered view of Razorpay's operating stack spanning developer interfaces, payment microservices, banking engines, down to cloud infrastructure and partner banking rails."
    data:
      layers:
        - label: "Client & Developer Interaction Surfaces"
          detail: "Hosted checkout pages, mobile SDKs, REST APIs, webhooks, Postman collections, and Model Context Protocol (MCP) server."
        - label: "Payment Acceptance & Smart Routing Core"
          detail: "AI-driven dynamic routing engine, multi-network tokenization (TokenHQ), and automated two-step authorization and capture flows."
        - label: "In-Store & Omnichannel Terminal Stack"
          detail: "Razorpay POS device orchestration across 600,000+ touchpoints with digital invoicing (BillMe) and loyalty platforms (PoshVine)."
        - label: "Banking Plus, Payouts & Disbursals"
          detail: "RazorpayX current accounts, automated vendor payouts, Smart Collect virtual accounts, and tax/payroll compliance engines."
        - label: "Risk, Fraud & Security Intelligence"
          detail: "Real-time transaction anomaly detection, Thirdwatch RTO risk assessment, and PCI DSS Level 1 data protection controls."
        - label: "Container Orchestration & Cloud Infrastructure"
          detail: "AWS Kubernetes (EKS) microservices, Docker containerization, AWS API Gateway, and Prometheus 2/Grafana observability."
        - label: "Banking Partner Rails & Regulatory Settlement Switches"
          detail: "NPCI UPI switches, RBI-regulated Payment Aggregator escrow accounts, card networks (Visa, Mastercard, RuPay), and bank partner APIs."
    approximationNotes: "Architecture layers synthesized from engineering analysis, developer documentation, and public cloud deployment specifications."
