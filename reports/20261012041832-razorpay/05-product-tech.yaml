callouts:
  - calloutType: "insight"
    title: "Full-Stack Convergence from Gateway to Financial Operating System"
    body: "Razorpay's strategic evolution from a pure-play payment gateway into an integrated fintech suite encompassing POS hardware, RazorpayX business banking, payroll, cross-border payments, and AI interfaces creates deep software lock-in, insulating the business against commoditization in low-margin UPI transaction routing."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
  - calloutType: "risk"
    title: "Upstream Banking Dependencies and Aggregator Compliance Burden"
    body: "Despite cloud-native Kubernetes orchestration and smart routing microservices, Razorpay remains structurally dependent on partner bank core APIs and NPCI payment switches. Regulatory embargoes and zero-MDR UPI policies impose high compliance costs alongside compressed processing margins."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE014"
