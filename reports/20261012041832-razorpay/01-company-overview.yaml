callouts:
  - calloutType: "risk"
    title: "Regulatory Friction and Zero-MDR Margin Compression"
    body: "Razorpay's rapid top-line transaction volume growth masks significant structural margin compression inherent in the domestic payments landscape. With UPI accounting for the vast majority of consumer transaction volumes and statutory rules enforcing zero MDR on transactions below ₹2,000, core payment aggregator profitability remains heavily constrained. Combined with recurrent compliance interventions—such as the RBI's 2022–2023 onboarding freeze and ongoing physical merchant audit mandates—Razorpay must continually generate higher-margin revenue from business banking, software tools, POS hardware, and cross-border corridors."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO016"
  - calloutType: "insight"
    title: "Pre-IPO Valuation Realism and Capital Structure Re-domiciling"
    body: "Razorpay's June 2026 confidential DRHP filing reveals an expected valuation range of $5–6 billion, representing a practical discount from its peak $7.5 billion Series F private mark established during the 2021 liquidity cycle. Having absorbed substantial tax charges to complete its reverse-flip relocation from the United States back to Bengaluru, Razorpay's impending public listing will test public institutional appetite for scaled Indian fintech infrastructure facing domestic compliance headwinds."
    claimRefs:
      - "CO012"
      - "CO014"
      - "CO015"
