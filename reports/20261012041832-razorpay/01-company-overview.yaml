company:
  name: "Razorpay"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2014 by Harshil Mathur and Shashank Kumar, Razorpay has evolved from an Indian developer-focused payment gateway into a full-stack business fintech platform spanning payment processing, RazorpayX business banking, automated payroll, POS infrastructure, and cross-border commerce. Having raised approximately $741.5 million from marquee investors including Y Combinator, Peak XV Partners, GIC, and Tiger Global, the Bengaluru-headquartered unicorn reached a peak private valuation of $7.5 billion before filing a confidential DRHP in June 2026 targeting a $600 million public issue at an expected $5–6 billion valuation."
sections:
  - id: "corporate-identity-and-founding-mission"
    title: "Corporate Identity and Founding Mission"
    body: "Razorpay (operating through its parent corporate entity Razorpay Software Limited and licensed entity Razorpay Payments Private Limited) is headquartered in Bengaluru, Karnataka, India. Founded in 2014 by IIT Roorkee alumni Harshil Mathur and Shashank Kumar, the company was established to address friction and lack of modern digital infrastructure in Indian merchant payment processing, particularly for startups and small-to-medium enterprises (SMEs). Accepted into Silicon Valley accelerator Y Combinator as part of its Winter 2015 batch—becoming YC's second Indian cohort member and later its first Indian unicorn—Razorpay initially pioneered frictionless digital onboarding, developer-friendly APIs, and early native support for India's Unified Payments Interface (UPI). Over twelve years of continuous product development and strategic acquisitions, Razorpay expanded its scope from a transactional payment gateway into an integrated financial operating system for digital businesses. Today, Razorpay's unified technology infrastructure enables merchants to accept payments across more than 100 payment methods, automate vendor and payroll disbursements, manage current accounts via partner banks, operate offline point-of-sale (POS) terminals, and execute cross-border commercial transactions."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Corporate Governance"
    body: "Razorpay's executive leadership and strategic direction continue to be guided by its founding team, with Harshil Mathur serving as Chief Executive Officer (CEO) and Shashank Kumar as Managing Director (MD). The two founders established Razorpay after previously founding SDS Labs at IIT Roorkee and working at Schlumberger and Microsoft respectively. While Mathur leads overall corporate strategy, regulatory engagement, and capital allocation, Kumar oversees technology architecture, engineering, and platform initiatives, including recent developments such as Model Context Protocol (MCP) servers and AI-assisted agentic payment protocols. Over its growth lifecycle, the company has supplemented founder leadership with functional executives across payments, banking, compliance, and international expansion, though strategic authority remains tightly concentrated among the co-founders. A critical operational reality for Razorpay is operating within India's rigorously supervised fintech regulatory landscape. Regulatory oversight from the Reserve Bank of India (RBI) and National Payments Corporation of India (NPCI) imposes stringent compliance obligations, including physical merchant verification standards, escrow reconciliation mandates, and strict licensing parameters for payment aggregator (PA) activities."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-investors-and-public-listing-preparations"
    title: "Capitalization, Investor Base, and Public Listing Roadmap"
    body: "Razorpay has accumulated total equity financing of approximately $741.5 million across multiple funding rounds spanning Seed through Series F. Its institutional capitalization table features prominent global venture capital firms, growth equity funds, and sovereign wealth institutions, including Y Combinator, Peak XV Partners (formerly Sequoia Capital India), Tiger Global Management, GIC (Singapore's sovereign wealth fund), Lone Pine Capital, Alkeon Capital Management, Technology Crossover Ventures (TCV), Lightspeed Venture Partners, Ribbit Capital, Matrix Partners, Salesforce Ventures, and MasterCard. Following a Series F round in December 2021 that priced the company at a post-money valuation of $7.5 billion, Razorpay initiated internal corporate restructuring to prepare for an Indian public listing, including a complex reverse-flip redomiciling process from the United States to India that incurred substantial one-time tax outlays. On June 12, 2026, Razorpay Software Limited confidentially filed its Draft Red Herring Prospectus (DRHP) with SEBI and MainBoard stock exchanges, engaging a lead investment banking syndicate comprising Axis Capital, J.P. Morgan, Citigroup, and Kotak Mahindra Capital. Market disclosures and unlisted share indications report an anticipated issue size of approximately $600 million (₹5,000–6,000 crore) targeting an IPO valuation of $5–6 billion in late 2026, reflecting moderate multiple compression relative to peak private marks."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "operational-scale-and-adverse-margin-realities"
    title: "Operational Scale and Adverse Margin Realities"
    body: "Razorpay operates at extensive commercial scale within the Indian internet economy, processing over $150 billion in total payment volume (TPV)—with annualized run-rate figures reported above $180 billion—and powering payment acceptance for over 100 Indian unicorn startups and millions of registered businesses. However, this payment aggregation scale is counterbalanced by structurally thin unit economics and intense regulatory friction. Because UPI commands the vast majority of Indian consumer digital payment volumes while statutory regulations mandate zero Merchant Discount Rate (MDR) on standard merchant transactions under ₹2,000, core payment aggregators generate minimal margins on primary transaction flow. Furthermore, between December 2022 and December 2023, the RBI imposed a 12-month moratorium prohibiting Razorpay and several peers from onboarding new merchants pending final payment aggregator licensing. While full PA authorization was granted in December 2023, escalating compliance burdens—including mandatory merchant physical verification, tighter KYC, and proposed GST levies—continue to compress net contribution margins, compelling Razorpay to diversify aggressively into software-adjacent banking, payroll, POS, and cross-border corridors."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs: []
