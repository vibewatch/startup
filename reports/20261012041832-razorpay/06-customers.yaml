company:
  name: "Razorpay"
chapter:
  number: 6
  title: "Customers"
  summary: "Razorpay serves over 10 million to 12 million merchants and powers online payments for 70% to 76% of Indian unicorns, processing over $180 billion in annualized volume. While developer-first onboarding and multi-product expansion sustain high reported retention, wafer-thin margins on zero-MDR UPI transactions and enterprise routing competition present structural monetization limits."
sections:
  - id: "merchant-segmentation"
    title: "Merchant Base Segmentation & Developer-Led Adoption"
    body: "Razorpay's merchant adoption began with a developer-first focus that addressed the severe friction of legacy payment gateways in India. Rather than requiring weeks of bank approvals, cumbersome physical paperwork, and archaic integration documentation, Razorpay introduced clean self-serve APIs, transparent pricing, and rapid ten-minute onboarding. This approach enabled early-stage founders and software engineers to integrate payment processing with minimal overhead, driving rapid word-of-mouth adoption where roughly 70% of early customer acquisition was generated through developer referrals rather than direct sales teams. Over time, this initial beachhead of small businesses and venture-backed startups expanded into a tiered merchant base spanning over 10 million to 12 million businesses. Today, Razorpay's customer profile extends from individual micro-merchants and D2C brands to mid-market platforms and high-growth technology unicorns, where the company powers online payments for an estimated 70% to 76% of Indian unicorns. Enterprise and institutional clients, including Tata Consultancy Services, Airtel, Meta, and Indian Oil, now rely on Razorpay for high-throughput payment aggregation, automated disbursement workflows, and cross-border settlement."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU006"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-retention"
    title: "Growth Trajectory, Volume Scale & Retention Dynamics"
    body: "The commercial scale of Razorpay's merchant franchise has compounded into a central piece of India's digital payments infrastructure. The company processes an annualized total payment volume exceeding $180 billion across its platform, representing approximately 55% market share in India's online payment gateway sector and processing roughly 35 million daily UPI transactions. Merchant retention is reported at 94%, supported by deep operational embedding where core payment gateway processing is linked to business banking accounts, vendor payouts, and payroll via RazorpayX. However, external verification of cohort durability faces meaningful disclosure gaps. While headline merchant retention is high, detailed cohort curves, gross revenue retention (GRR), and net revenue retention (NRR) remain private. Given the natural mortality rate of early-stage Indian SMEs and micro-merchants, overall volume durability is heavily anchored by the compounding payment volume of maturing unicorn and mid-market cohorts rather than static account preservation alone."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU007"
      - "CU008"
      - "CU015"
    tableRefs:
      - "TU002"
  - id: "enterprise-proof-concentration-risks"
    title: "Enterprise Proof, Multi-Product Expansion & Concentration Risks"
    body: "Enterprise customer acquisition has diversified Razorpay's volume base beyond venture-funded startups into resilient corporate and consumer tech giants, including Swiggy, Zomato, BookMyShow, and CRED. For these large enterprise clients, Razorpay generally deploys customized pricing structures based on quarterly or annual revenue-share models with commission rates ranging between 0.5% and 1%. However, high enterprise scale introduces structural margin and concentration pressures. Payment aggregators operate under intense competitive pressure where large corporate clients frequently implement multi-gateway routing redundancy or explore in-house payment aggregator systems to compress processing fees. Furthermore, regulatory dynamics heavily constrain merchant unit economics: UPI transactions under INR 2,000 carry zero merchant discount rate (MDR), and payment aggregators must split fees 50:50 with partner banks on higher-value transactions. Compliance overhead also escalated following the RBI's 14-month merchant onboarding embargo between December 2022 and December 2023, requiring rigorous in-house merchant risk profiling and continuous transaction monitoring across all empanelled businesses."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU003"
