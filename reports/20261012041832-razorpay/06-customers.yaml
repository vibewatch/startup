callouts:
  - calloutType: "strength"
    title: "Dominant Footprint Across Indian Unicorns and Digital Pioneers"
    body: "Razorpay has established an uncommonly strong position in Indian technology commerce, powering payments for 70% to 76% of Indian unicorns and processing over $180 billion in annualized volume. This developer-first origin creates natural ecosystem advocacy that protects core gateway adoption."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
  - calloutType: "risk"
    title: "Margin Compression from Zero-MDR UPI and Enterprise In-Housing"
    body: "While volume scale is massive at 35 million daily UPI transactions, regulatory caps setting MDR to zero on UPI sub-INR 2,000 transactions severely squeeze aggregator economics. In parallel, large enterprises frequently multi-home or build internal routing to negotiate fees down to 0.5%-1%, capping take-rate upside."
    claimRefs:
      - "CU008"
      - "CU010"
      - "CU012"
      - "CU013"
