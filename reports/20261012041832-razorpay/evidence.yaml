evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: statutory-board-composition
    missingEvidence: >-
      Full statutory board of directors roster, independent director appointments, audit committee charters, and formal
      voting control rights post-reverse-flip.
    whyItMatters: >-
      Pre-IPO governance diligence requires understanding minority investor rights, independent board oversight, and
      founder voting power distribution ahead of public listing.
    diligencePath: >-
      Review final Red Herring Prospectus (RHP) governance schedules and SEBI public filing exhibits once confidential
      DRHP review concludes.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investor-map-enumeration
    missingEvidence: >-
      Granular cap table percentage ownership stakes, primary versus secondary share sale allotments in the IPO OFS, and
      preference share liquidation waterfalls.
    whyItMatters: >-
      Evaluating existing investor return thresholds and post-IPO overhang requires precise cap table ownership data not
      disclosed in pre-IPO summaries.
    diligencePath: Inspect Capital Structure and History chapter in full DRHP/RHP filing upon official SEBI public release.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: merchant-tier-take-rates
    missingEvidence: >-
      Audited merchant-level take rates and blended gross margins segmented by enterprise versus SME cohorts across
      payment methods.
    whyItMatters: >-
      Blended gross margins fell to 33.8% in FY25, and zero-MDR UPI flows obscure whether high TPV growth translates
      into sustainable operating contribution.
    diligencePath: >-
      Review confidential IPO draft prospectus disclosures reconciling unit economics across gateway, neobanking, and
      hardware lines.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: independent-cross-border-benchmarks
    missingEvidence: >-
      Third-party audited benchmarks measuring comparative transaction success rates between Razorpay and global
      processors on international cards.
    whyItMatters: >-
      Claims of 30% baseline completion for non-localized gateways rely on company statements rather than arms-length
      technical telemetry.
    diligencePath: Obtain multi-homed merchant payment routing telemetry comparing cross-border authorization rates across gateways.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-take-rates
    missingEvidence: >-
      Audited merchant discount rate (MDR) realizations and net take-rate breakdowns between Razorpay, PayU India, and
      Cashfree by payment method.
    whyItMatters: Reported headline MDRs of 1.5% to 2% mask aggressive bilateral enterprise discounting and zero-MDR UPI volume mix.
    diligencePath: >-
      Review merchant pricing schedules, interchange pass-through agreements, and regulatory filings from the Payments
      Council of India.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: merchant-multi-homing-rates
    missingEvidence: >-
      Empirical merchant multi-homing rates and volume distribution across smart routers (e.g., Juspay) between Razorpay
      and secondary gateways.
    whyItMatters: >-
      High multi-homing penetration reduces effective merchant switching costs and leaves gateway volume vulnerable to
      dynamic routing shifts.
    diligencePath: >-
      Analyze payment routing SDK data and enterprise merchant checkout configurations across major Indian e-commerce
      merchants.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: merchant-cohort-retention
    missingEvidence: >-
      Audited merchant retention, net revenue retention (NRR), and cohort churn metrics across standalone payment
      gateway versus multi-product RazorpayX users.
    whyItMatters: >-
      Without cohort disclosures, it is impossible to verify whether revenue expansion is driven by genuine organic
      merchant retention or continuous high-volume merchant onboarding.
    diligencePath: >-
      Request historical cohort retention curves and net dollar retention schedules segmented by customer tier during
      management diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: product-contribution-margins
    missingEvidence: >-
      Segmented financial accounting breaking down gross margin and EBITDA contribution by product line across core
      payment gateway, RazorpayX, POS hardware, and lending.
    whyItMatters: >-
      High top-line GMV and consolidated revenue figures obscure whether newer capital-intensive products like offline
      POS terminals are margin-accretive or subsidised by gateway cash flows.
    diligencePath: >-
      Require management to provide divisional P&L schedules separating payment aggregation from SaaS subscription and
      credit-origination income.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: redomiciling-tax-liability
    missingEvidence: >-
      Final audited tax outlay and balance-sheet impact of the corporate reverse-flip from Delaware to India ahead of
      domestic IPO filing.
    whyItMatters: >-
      One-off tax liabilities from redomiciling could significantly reduce net liquid cash reserves prior to public
      listing liquidity.
    diligencePath: >-
      Inspect the draft red herring prospectus tax disclosures and escrow holdback arrangements once formally filed with
      SEBI.
  - type: missing-source
    severity: material
    topic: upstream-bank-failover-metrics
    missingEvidence: >-
      Audited transaction failure logs, packet-level failover latency benchmarks, and independent uptime telemetry
      during nationwide partner bank and NPCI UPI core banking switch outages.
    whyItMatters: >-
      While Razorpay claims high success rates through dynamic smart routing, merchants experience elevated drop-offs
      during bank core outages; independent technical verification is required to assess whether routing automation
      mitigates or merely buffers partner-bank failures.
    diligencePath: >-
      Request historical synthetic transaction test logs, SLA credit records, and third-party penetration/stress testing
      audit reports during technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: Merchant Retention Cohorts and Unit Economics
    missingEvidence: >-
      Audited cohort disclosures detailing gross revenue retention (GRR), net revenue retention (NRR), and merchant
      churn across small vs large enterprise tiers.
    whyItMatters: >-
      While headline merchant retention is reported at 94%, the lack of net revenue retention data makes it difficult to
      assess whether expansion revenue from maturing cohorts offsets SME mortality and transaction fee discounting.
    diligencePath: >-
      Request historical cohort revenue retention tables and NDR metrics broken out by customer segment in confidential
      IPO pre-filing diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: Enterprise Customer Contract Terms and Volume Share
    missingEvidence: >-
      Comprehensive listing of contract lengths, volume commitments, and exclusive vs redundant gateway allocations for
      named enterprise accounts.
    whyItMatters: >-
      Named marquee customers such as Swiggy, TCS, Airtel, and Meta establish credibility, but multi-gateway redundancy
      means Razorpay may capture only a fraction of their total payment flow.
    diligencePath: >-
      Review merchant service agreements and wallet-share splits for top 20 enterprise accounts during management
      diligence meetings.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-and-legal-inventory
    missingEvidence: >-
      Primary licence conditions, regulator inspection findings, litigation records, privacy enforcement history, and
      corridor-level cross-border approvals.
    whyItMatters: >-
      The assigned pool establishes several material obligations but cannot support an exhaustive legal and regulatory
      inventory.
    diligencePath: >-
      Obtain regulator correspondence, licence schedules, board compliance reports, outside-counsel litigation letters,
      and jurisdiction-by-jurisdiction approval maps.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: lending-credit-risk
    missingEvidence: >-
      Razorpay Capital originations, delinquency vintages, net credit losses, recoveries, partner-NBFC allocation, and
      first-loss or guarantee terms.
    whyItMatters: >-
      The public record identifies opacity but does not quantify probability of default, loss severity, or Razorpay's
      direct economic exposure.
    diligencePath: >-
      Review audited lending schedules, partner contracts, vintage curves, underwriting policy changes, and stressed
      loss scenarios.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: platform-reliability
    missingEvidence: >-
      Independent uptime history, severity-one incident logs, mean recovery time, authentication failure rates, and
      payment success rates by rail.
    whyItMatters: Company performance targets cannot establish actual reliability or the frequency and economic impact of outages.
    diligencePath: >-
      Reconcile status-page history, internal incident postmortems, bank and merchant SLA reports, support-ticket
      spikes, and service credits.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-and-customer-concentration
    missingEvidence: >-
      Payment volume, revenue, gross profit, escrow balances, and contract exposure by bank, merchant, payment rail,
      geography, and product.
    whyItMatters: >-
      Partner breadth and total scale do not reveal concentration, portability, or the economic cost of losing a major
      relationship.
    diligencePath: >-
      Request top-counterparty schedules, partner termination clauses, migration timelines, customer cohorts, and
      concentration stress tests.
    relatedQuestionRefs:
      - QR006
      - QR009
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: >-
      Audited post-Series F cap table detailing liquidation preference stacks, secondary discount terms, and founder
      super-voting rights.
    whyItMatters: >-
      Preference overhang and secondary transaction prices dictate the net proceeds available to common shareholders in
      an IPO below $7.5B.
    diligencePath: Review formal Draft Red Herring Prospectus (DRHP) capital structure schedules upon public filing with SEBI.
    relatedQuestionRefs: []
  - type: conflicting-data
    severity: material
    topic: normalized-ebitda
    missingEvidence: Reconciliation of normalized FY25 EBITDA excluding non-recurring domicile flip taxes and restructuring provisions.
    whyItMatters: >-
      A net loss of Rs 1,209 crore distorts underlying operational cash flow and unit economics of the core payment
      aggregator engine.
    diligencePath: Inspect restated consolidated audited financial statements and auditor notes in pre-IPO filings.
    relatedQuestionRefs: []
