  topStrengths:
    - 在印度商户金融科技领域规模领先，覆盖广泛的企业客户和中小企业客户。
    - 产品组合多元，覆盖支付、银行工作流、POS、薪资管理和跨境服务。
    - 保密提交的 DRHP 文件及持续扩大的业务规模，为可见的增长和 IPO 前势头提供支撑。
  topRisks:
    - 零 MDR 的 UPI 经济模式和与银行的收入分成，压缩了国内支付业务的利润率。
    - 监管许可可能打断客户接入，并限制增长。
    - 在重组后的队列质量、单位经济性和正常化盈利能力方面，公开披露仍存在缺口。
  unresolvedGaps:
    - 经审计的合并财务文件，能够勾稽法律实体结构、FY25 经济数据和 IPO 就绪披露。
    - 商户留存、队列质量、集中度，以及产品层面的变现能力或贡献利润率。
    - 当前股权结构表的运作机制、优先股悬置、老股交易与新股的构成，以及 IPO 的最终时间和条款。
    - 剔除反向迁册、ESOP 和重组影响后的正常化盈利能力。
