tables:
  - id: TP001
    title: Competitive Profile and Scale Comparison Table
    columns:
      - Competitor
      - Primary Category
      - Scale and Capital Profile
      - Target Market Segment
      - Core Differentiation
      - Strategic Limitation
    rows:
      - - Razorpay
        - Full-Stack B2B Payment Gateway & Banking
        - 12M+ businesses, ~$180B annualized TPV, ₹3,783 Cr FY25 revenue, $741.5M+ raised
        - Startups, mid-market SaaS/D2C, digital enterprises, and exporters
        - Unified financial OS (Payments, RazorpayX banking, Capital credit, Payroll, Curlec)
        - Thin take-rates on zero-MDR UPI volume; group net loss from reverse-flip taxes
      - - PayU India (Prosus)
        - Enterprise Payment Aggregator & Consumer Credit
        - 5M+ merchants, multi-billion dollar volume backed by Prosus/Naspers
        - Large enterprises, e-commerce conglomerates, and airline/travel portals
        - Deep corporate relationships, enterprise custom routing, and LazyPay BNPL consumer credit
        - Slower developer-led innovation; abandoned $4.7B BillDesk merger; past RBI regulatory pauses
      - - Cashfree Payments
        - Developer-First Gateway & Payout Engine
        - ~3M businesses, backed by YC, Apis Partners, and SBI
        - Marketplaces, gig economy platforms, and API-first software businesses
        - Industry-leading bulk payouts, instant beneficiary verification, and clean developer documentation
        - Roughly 20% of Razorpay's TPV scale; narrower banking, payroll, and merchant credit stack
      - - Paytm Payment Gateway
        - Consumer Ecosystem & Offline Merchant Acquirer
        - 3M+ online merchants, vast QR soundbox network, One97 Communications
        - Mass retail, small kiranas, utilities, and consumer internet services
        - Integrated Paytm consumer wallet, massive QR distribution, and consumer soundbox presence
        - Severe RBI regulatory curbs on Paytm Payments Bank in 2024 damaged enterprise merchant trust
      - - PhonePe Payment Gateway
        - UPI Network Leader & Digital Distribution
        - ~48% share of UPI volume, backed by Walmart, 500M+ registered users
        - Consumer-facing mobile merchants, D2C retail, and offline QR merchants
        - Overwhelming UPI consumer brand equity, deep consumer wallet share, and low-cost onboarding
        - Very low monetization on zero-MDR UPI rails; payment gateway lacks B2B banking/lending suite
      - - Stripe / Adyen
        - Global Cross-Border Payment Infrastructure
        - Global payment giants (Stripe ~$5.8B net rev; Adyen public in Europe)
        - Cross-border software exporters, multinational brands, and global platforms
        - World-class developer APIs, global settlement across 100+ currencies, advanced fraud tooling
        - Premium pricing (2.9% + 30¢); shallow domestic Indian bank and UPI rails; no local B2B lending
    notes: Benchmarks key competitors across scale, capitalization, market positioning, and core strategic constraints.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP007
      - CP008
      - CP009
  - id: TP002
    title: Feature and Capability Matrix Across Payment Competitors
    columns:
      - Capability / Feature Domain
      - Razorpay
      - PayU India
      - Cashfree Payments
      - PhonePe / Paytm
      - Stripe / Adyen
    rows:
      - - Online Payment Gateway & Checkouts
        - Comprehensive (100+ payment methods, instant activation, smart routing)
        - High (Strong enterprise card and netbanking checkout engine)
        - High (Full online checkout suite with customizable drop-in UI)
        - High (Strong UPI auto-flow and wallet integration, basic cards)
        - Exceptional (Global standard in hosted checkout and elements)
      - - Developer Documentation & SDKs
        - Exceptional (API playground, MCP server, 10+ SDKs, detailed guides)
        - Moderate (Legacy enterprise documentation, slower API iteration)
        - High (Detailed API references, sandbox environments, and webhooks)
        - Moderate (Basic developer documentation focused primarily on UPI)
        - Exceptional (Industry benchmark in interactive documentation and tooling)
      - - Automated Payouts & Disbursals
        - High (RazorpayX automated vendor, tax, and payroll payouts)
        - Moderate (PayU Payouts suite for corporate settlement)
        - Exceptional (Core heritage in marketplace disbursements and bank account verification)
        - Moderate (Basic wallet and merchant balance settlement transfers)
        - High (Stripe Connect for global marketplace payout routing)
      - - Neo-Banking & Current Accounts
        - High (RazorpayX virtual accounts, partner current accounts, corporate cards)
        - Unsupported / Unknown (Lacks integrated B2B merchant neo-banking stack)
        - Low (Basic virtual collection accounts without full neo-banking OS)
        - Unsupported / Unknown (No dedicated B2B software banking operating system)
        - Moderate (Stripe Treasury and Issuing, unavailable for domestic India)
      - - Merchant Working Capital Lending
        - High (Razorpay Capital data-driven merchant loans and cash advances)
        - High (LazyPay and partner merchant credit programs via Prosus)
        - Low (Limited third-party merchant loan integration)
        - Moderate (Merchant cash advances tied to daily QR soundbox collections)
        - Low (Stripe Capital unavailable for domestic Indian merchant base)
      - - Cross-Border & Foreign Currency
        - High (RBI PA-Cross Border license, MoneySaver Exporter Account, Curlec SE Asia)
        - Moderate (Standard inward cross-border merchant processing)
        - Moderate (International card processing and export payment collection)
        - Unsupported / Unknown (Domestic India focus; no dedicated exporter account suite)
        - Exceptional (Native multi-currency acquiring and settlement in 100+ countries)
      - - Offline POS & In-Store Payments
        - Moderate (Ezetap POS acquisition, growing omnichannel terminal presence)
        - Low (Primarily online gateway, limited proprietary POS footprint)
        - Low (SoftPOS and QR solutions, minimal physical terminal presence)
        - Exceptional (Dominant soundbox and QR network across tens of millions of stores)
        - Moderate (Stripe Terminal available in select international markets)
    notes: Compares functional depth across merchant workflow domains; unsupported or unavailable regional modules marked clearly.
