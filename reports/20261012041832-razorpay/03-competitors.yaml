  - id: TP003
    title: Pricing Models, Economic Take-Rates, and Switching Cost Assessment
    columns:
      - Competitor
      - Domestic Card & Netbanking MDR
      - UPI Transaction Fee Structure
      - International & Cross-Border Fee
      - Ancillary Software & Service Fees
      - Merchant Switching Friction
    rows:
      - - Razorpay
        - Standard 2.0% flat rate; discounted to 0.5%-1.0% for enterprise tiers
        - 0.0% (Zero-MDR under INR 2,000; sharing on high-value/P2PM rules)
        - 2.0% - 3.0% plus foreign currency conversion spread
        - SaaS pricing for payroll, premium dashboards, credit interest spreads
        - High (Deep integration with RazorpayX banking, ERPs, and automated workflows)
      - - PayU India
        - Standard 1.8% - 2.0%; custom negotiated enterprise volume tiers
        - 0.0% standard domestic UPI processing
        - 3.0% - 3.5% for international card acceptance
        - Corporate payout charges and LazyPay consumer credit revenue share
        - Moderate (Primarily gateway processing; easily multi-homed via routing layers)
      - - Cashfree Payments
        - Standard 1.75% - 1.90% across domestic payment methods
        - 0.0% standard domestic UPI processing
        - 2.5% - 3.5% for cross-border e-commerce collection
        - Per-transaction API fees on verification checks and bulk disbursals
        - Moderate to High (Embedded payout APIs and marketplace settlement rules)
      - - PhonePe / Paytm
        - Standard 1.8% - 1.9% for card transactions
        - 0.0% on standard consumer UPI payments
        - Unavailable / Unsupported (Limited focus on global cross-border payments)
        - Monthly rental subscriptions for offline QR soundbox hardware devices
        - Low to Moderate (Easy to swap online checkout button or display alternative QR)
      - - Stripe
        - 2.0% for domestic India cards; 2.9% + 30¢ international benchmark
        - Limited zero-MDR UPI focus; standard fee schedule applies
        - 3.0% - 4.3% including cross-border scheme and currency conversion fees
        - Add-on fees for Radar fraud prevention, Billing, and Tax automation
        - Low to Moderate (Standardized APIs allow straightforward migration to rivals)
    notes: Outlines list pricing schedules, regulatory zero-MDR constraints, and operational switching barriers across major processors.
    claimRefs:
      - CP001
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
