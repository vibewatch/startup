callouts:
  - calloutType: "risk"
    title: "Zero-MDR Drag and Bank Revenue Sharing Constrain Organic Take Rates"
    body: "Because roughly 80% of digital transactions in India occur over UPI where transactions below ₹2,000 yield zero merchant discount rate, Razorpay faces structural pressure on payment gateway gross take rates. High-value transactions require a 50:50 interchange split with partner banks, forcing the business to rely heavily on value-added software and cross-border margins."
    claimRefs:
      - "CI005"
      - "CI008"
      - "CI010"
  - calloutType: "strength"
    title: "Multi-Product Expansion Generates Compounding Expansion Revenue"
    body: "Razorpay's evolution beyond standalone payment gateway processing into business banking, automated payroll, and in-store POS creates multiple monetization touchpoints across existing merchants. By layering RazorpayX payouts and working capital lending onto core transaction flows, the company expands customer lifetime value without incurring duplicate customer acquisition costs."
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI007"
      - "CI014"
  - calloutType: "insight"
    title: "Reverse-Flip Tax Liabilities and Compliance Realities Ahead of Listing"
    body: "While Razorpay demonstrated operating profitability in FY25 with gross profit crossing ₹1,200 crore, substantial cash outlays related to corporate redomiciling to India and increased compliance costs for in-person merchant verification represent critical non-operating drains that underwriters must model ahead of the prospective IPO."
    claimRefs:
      - "CI002"
      - "CI009"
      - "CI010"
      - "CI013"
