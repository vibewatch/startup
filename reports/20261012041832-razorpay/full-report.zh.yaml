        - 历史上的 $7.5B Series F 估值高于当前 $5B 至 $6B 的机密 IPO 目标区间
        - 将新增承诺定价在 $5.0B 基准或以下，以抵御国内上市后金融科技估值压缩
    notes: 建议与信心评级综合了截至 2026 年 10 月披露的 IPO 目标、已核实财务报告及监管约束。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
  - id: TV002
    title: 投资正反论点
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 哪些因素会改变判断
    rows:
      - - 看多论点
        - 在印度企业金融科技及新兴跨境通道中，规模无可匹敌，生态锁定效应强
        - 年化 TPV 超过 $180B，为 100 多家印度独角兽及 Airbnb 等全球领先品牌提供支付支持
        - 企业交易量增长放缓，或头部数字商务商户关系流失至竞争网关
      - - 反方论点
        - 在 RBI 严格监管和零 MDR 强制要求下，支付聚合商利润率面临结构性压缩
        - Rs 2000 以下的 UPI 交易不产生 MDR，较大金额交易则被迫与合作银行五五分成
        - 监管改革允许所有 UPI 档位向商户收取 MDR，显著提升聚合商毛利率
      - - 重组拖累
        - 注册地迁回印度带来巨额税费支出，压低法定口径报告利润
        - FY25 净亏损达到 Rs 1,209 crore，主要源于总部重组和税务负债
        - 在 SEBI 申报文件中快速、经审计地证明经营现金流为正，且重组后税务事项已最终确定
    notes: 核心论点反映出头部商户市场份额与印度支付系统监管下利润率受压之间的张力。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
  - id: TV003
    title: 情景估值与敏感性
    columns:
      - 情景
      - 隐含估值
      - 关键运营假设
      - 下行 / 上行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - $7.5B - $8.5B
        - 跨境与软件服务将毛利率提升至 50%；UPI 商业化获批；FY27 收入超过 Rs 6,500 Cr
        - 东南亚 Curlec 通道快速落地，收入端 CAGR 持续超过 50%，且经营利润率健康
        - 低（20%）
      - - 基准情景
        - $5.0B - $6.0B
        - 支付聚合商收入增长 30-35%；综合费率趋稳；IPO 后法定税务逆风正常化
        - SEBI 机密 IPO 上市顺利完成，在目标价格发现区间内募资 $600M-$700M
        - 高（60%）
      - - 悲观情景
        - $3.5B - $4.5B
        - 零 MDR 拖累持续；实体 KYC 商户合规成本上升；企业定价竞争加剧
        - 监管执法行动、二级市场清算压力，或公开市场科技股长期抛售
        - 中（20%）
    notes: 情景估值反映当前 SEBI 机密申报指引、历史融资估值及同行反向迁册税务折损。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Razorpay 从 2014 年成立并获 YC 加速器支持，到多产品规模化、收购及 2026 年机密 DRHP 申报的发展历程。
    data:
      items:
        - label: 2014 年成立
          detail: Harshil Mathur 和 Shashank Kumar 在班加罗尔创立 Razorpay，简化印度初创公司和中小企业的在线收款。
          date: '2014'
          tone: neutral
        - label: YC Winter 2015 批次
          detail: 入选硅谷 Y Combinator W15 批次，成为 YC 的第二笔印度投资，并获得奠基性种子资金。
          date: '2015'
          tone: positive
        - label: UPI 与数字化扩张
          detail: 为初创公司推出首个全数字化准入流程，并较早接入印度统一支付接口（UPI）。
          date: '2016'
          tone: positive
        - label: RazorpayX 与新银行业务
          detail: 推出 RazorpayX 企业银行套件和 Razorpay Capital 贷款流程，管理企业全套资金流转。
          date: '2019'
          tone: positive
        - label: Series F $7.5B 独角兽估值
          detail: 完成 Series F 融资，累计募资达到 $741.5 million，最高私人估值为 $7.5 billion。
          date: '2021'
          tone: positive
        - label: 全渠道 POS 与东南亚扩张
          detail: 在印度收购线下 POS 龙头 Ezetap，在马来西亚收购经常性支付平台 Curlec，扩大国际布局。
          date: '2022'
          tone: positive
        - label: RBI 商户准入暂停
          detail: RBI 禁止 Razorpay 及同业支付聚合商新增商户，等待最终许可审批，持续一年。
          date: 2022-12
          tone: negative
        - label: 获得完整 PA 许可
          detail: 印度储备银行授予支付聚合业务最终授权，解除新增商户准入限制。
          date: 2023-12
          tone: positive
        - label: 机密 DRHP IPO 申报
          detail: Razorpay Software Limited 向 SEBI 和 MainBoard 交易所提交机密 DRHP，目标发行规模为 $600M，估值为 $5–6B。
          date: 2026-06
          tone: neutral
    approximationNotes: 里程碑日期和事件摘要汇编自公司官方披露、Y Combinator 公司历史记录及监管报告。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO010
      - CO011
      - CO012
      - CO014
      - CO015
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 分层呈现可触达的数字支付规模、商户金融科技 TAM 及 Razorpay 的 TPV 运行率。
    data:
      items:
        - label: SOM：Razorpay 净收入运行率
          value: 483
          unit: USD M
          detail: 报告显示 FY25 网关、企业银行和 POS 净收入为 ₹3,783 Cr（约 $450M-$483M）。
        - label: SAM：Razorpay 年化 TPV 规模
          value: 180
          unit: USD B
          detail: 覆盖 12M+ 个已准入商户的已处理支付量，约占在线网关交易量的 55%。
        - label: 2030 年目标处理量
          value: 400
          unit: USD B
          detail: 管理层提出的目标：到 2030 年，印度和东南亚业务的年化交易量达到目标水平。
        - label: 印度数字商户金融科技机会
