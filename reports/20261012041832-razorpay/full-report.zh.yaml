      - number: '8.2'
        title: 资本结构、历史融资与上市动态
        blocks:
          - type: paragraph
            body: >-
              Razorpay 已在 12 轮融资中累计筹资 $742 million，投资方包括 Peak XV Partners、Y Combinator、Tiger Global Management、Lone Pine
              Capital 和 TCV（CV001、CV008）。其 Series E 轮于 2021 年 9 月确立了 $7.5 billion
              的投后估值，但二级股份出售和近期注册地迁移显示，印度金融科技独角兽普遍面临显著的估值倍数压缩 （CV001、CV002、CV008）。值得注意的是，同业金融科技公司 Groww
              在从美国迁回印度注册地期间，为应对法定税费， 接受了超过 30% 的估值折价，这为 Razorpay 自身的重组估值提供了直接市场先例（CV002）。Razorpay 最近向印度证券交易委员会提交的保密文件计划
              IPO 募资 $600 million 至 $700 million，预期估值为 $5 billion 至 $6 billion，由 Axis Capital、Kotak Mahindra、Citigroup 和
              JPMorgan 负责承办 （CV002、CV005）。这一计划定价意味着估值将有序回归公开市场可比公司水平，同时承认其国内收入规模和 监管导致的利润率压缩。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.3'
        title: 财务画像、盈利障碍与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              Razorpay 在 FY25 的收入同比增长 65%，达到 Rs 3,783 crore；支付、POS 硬件、客户忠诚度和国际子公司业务的 毛利润增长 41%，达到 Rs 1,277
              crore（CV003）。尽管收入端加速，公司 FY25 仍录得 Rs 1,209 crore 的合并 净亏损，主要受到将集团母公司迁至印度所产生的重组支出和税务负债拖累（CV003）。此前几个财年，支付网关收入
              增长 24% 至 Rs 2,068 crore，总收入增长 9% 至 Rs 2,501 crore，FY24 的单体利润则仅为 Rs 34 crore
              （CV004）。长期股权回报的核心障碍在于，跨境外汇处理、企业结账和薪资等非聚合支付软件业务，能否足够快地
              提升毛利率，以抵消国内支付合规和验证成本（CV004、CV006）。下行论点的失效触发因素包括：没有国家补贴却长期 延续零 MDR 政策、印度储备银行出台新的监管接入暂停措施，或 IPO 后远期净收入倍数跌破 8
              倍。
            claimRefs:
              - CV003
              - CV004
              - CV006
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 估值重置与零 MDR 利润率拖累
            body: >-
              $5.0B 至 $6.0B 的上市目标表明，Razorpay 在公开市场无法维持此前 $7.5B 的私募估值峰值。高昂的监管合规 负担，以及对 Rs 2,000 以下零售 UPI 交易实施的零 MDR
              限制，会压低净费率；如果软件变现落后，就会形成下行风险。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV005
          - type: callout
            title: 入场纪律与 IPO 前尽调要求
            body: >-
              在 Razorpay 发布经审计的招股书披露、将正常化经营现金流与一次性反向迁册税务项目分开之前，继续保持 “继续研究”的立场。投资判断须设定低于 $5.5B
              的严格估值上限，以相对公开市场金融科技可比公司保留安全边际。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV009
