      - number: '7.2'
        title: 高支付量无法消除利润率、信贷或可靠性不确定性
        blocks:
          - type: paragraph
            body: >-
              支付聚合存在结构性变现约束。Inc42 报道称，大多数小额 UPI 交易 MDR 为零，而大额交易经济性要与银行分成 [CR005, CR006]。独立分析还指出 Razorpay
              不公开产品层面盈利能力，使投资者无法把支付基础设施成本与高利润率软件或金融产品对账 [CR007]。同一来源称，公开贷款信贷质量指标以及流失或 cohort 终身价值数据都不透明 [CR008,
              CR009]。这些是缺口，不是表现不佳的证明。可靠性证据同样不对称：Razorpay 宣称 UPI Switch uptime 为 99.99%、吞吐量为 10,000-plus
              TPS，但指定资料池没有独立事故历史、SLA 达成序列或渠道成功率 [CR012]。因此剩余风险不是已知损失金额，而是无法从公开证据量化贡献利润、信贷损失、留存和服务韧性。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
