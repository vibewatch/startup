chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立使命
        blocks:
          - type: paragraph
            body: >-
              Razorpay 依托母公司 Razorpay Software Limited 和持牌实体 Razorpay Payments Private Limited 运营，总部位于印度卡纳塔克邦班加罗尔。公司由
              IIT Roorkee 校友 Harshil Mathur 和 Shashank Kumar 于 2014
              年创立，旨在解决印度商户支付处理，尤其是初创企业和中小企业面临的摩擦与现代数字基础设施短缺。Razorpay 入选硅谷加速器 Y Combinator 的 Winter 2015 批次，成为 YC 第二家印度
              cohort 成员，后来又成为其首家印度独角兽；早期主打无摩擦数字开户、开发者友好 API，以及对印度 Unified Payments Interface（UPI）的原生支持。经过 12
              年持续产品开发和战略收购，Razorpay 从交易型支付网关扩展成数字企业的综合金融操作系统。如今，其统一技术基础设施支持商户接入 100
              多种支付方式、自动处理供应商和薪资付款、借助合作银行管理往来账户、运营线下 POS 终端，并执行跨境商业交易。
