  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与决策框架
        blocks:
          - type: paragraph
            body: >-
              Razorpay 是印度领先的商业金融科技平台，在网上支付网关、新银行工作流、POS 系统和跨境通道中处理超过 $180 billion 年化交易量（CV006）。看多论点的核心，是 Razorpay
              已牢牢占据市场位置，为 100 多家印度独角兽及 Airbnb、Swiggy 等跨国企业提供支付，并迅速拓展高利润率跨境结算和代理式商业集成（CV005, CV006,
              CV007）。但审慎估值立场认为价格偏高，因此总体建议为继续研究，风险高、信心中等（CV009）。结构性约束在于：RBI 对 Rs 2,000 以下 UPI 交易实行零
              MDR，使国内支付聚合商在交易量最高的轨道上利润极薄，只能高度依赖银行收入分成、合规开销和非支付软件费（CV004）。投资者应避免按历史私募峰值做投资判断，并要求经审计的合并财务报表，把经常性经营收益与一次性注册地迁移重组费用拆开。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
