      - number: '3.3'
        title: 定价经济、切换动态、护城河持久性与不利脆弱点
        blocks:
          - type: paragraph
            body: >-
              印度支付聚合的定价结构反映了国内支付监管造成的严重经济扭曲 [CP009, CP010]。在银行卡和网银类别，聚合商收取约 1.5% 至 2.0% 的标准商户折扣率；对处理量巨大的超级企业，通常折扣至 0.5%
              至 1.0% [CP001, CP010]。但占交易量绝大多数的国内 UPI 支付，政府规定 INR 2,000 以下交易 MDR 为零，使处理商无法从高频交易获取交换费 [CP009, CP010]。因此
              Razorpay 依靠全栈软件锁定保护毛利率，通过 RazorpayX 新银行账户费和浮存金、Razorpay Capital 商户营运资金利差、薪资订阅及跨境货币兑换费变现 [CP002, CP007,
              CP011]。商户使用 Juspay 等多宿主智能路由器时，核心支付网关的切换成本中等；但一旦采用 RazorpayX 处理供应商付款、税款和员工薪资，切换摩擦会大幅提高 [CP001, CP011,
              CP012]。尽管有这层多产品防御，Razorpay 仍面临持久不利风险：监管牌照冻结可立即阻断商户获取，拟议 GST 可能冲击 sub-INR 2,000 银行卡交易，企业商户经常威胁自建聚合系统，而即将到来的
              UPI 费用重构可能改变竞争经济性 [CP004, CP010, CP013]。
