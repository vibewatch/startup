      - - 风险评级
        - 高
        - RBI 严格监管、UPI 零 MDR 规则及高额一次性注册地迁移税费带来严重压力
        - 要求超过 25% IRR 的高回报门槛，以补偿金融科技监管和合规暴露
      - - 估值立场
