      - number: '7.3'
        title: 多元化扩大触达，也扩大控制面
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的银行和商业金融产品依赖受监管交易对手。其网站明确称 RazorpayX 往来账户和企业卡由持牌合作银行提供，RazorpayX 本身不是银行 [CR010]。公司还称新银行栈与 15
              多家合作银行及专门银行工程团队合作 [CR011]。多银行参与是一种缓解措施，但也扩大了集成和治理界面。独立分析将六家被收购公司、多个地域、受监管银行网络和广泛产品套件的集成描述为执行挑战 [CR013]；Y
              Combinator 资料列出截至 2023 年的八项收购 [CR014]。公司发布的跨境职位描述还显示其正在覆盖印度、新加坡和马来西亚的出口、进口及 LRS [CR015]。因此 kill criteria
              必须可监控：再次出现重大开户限制、持续无法披露贷款损失 cohort，或支付 take rate 无法供养扩大的控制面，都会击穿多元化论点 [CR016]。
