              企业客户获取让 Razorpay 的交易量基础从风险投资支持的初创企业扩展到更有韧性的企业和消费科技巨头，包括 Swiggy、Zomato、BookMyShow 和
              CRED。面对这些大型企业客户，Razorpay 通常按季度或年度收入分成模式定制定价，佣金率在 0.5% 至 1%
              之间。然而，企业规模越大，结构性利润率和集中度压力越明显。支付聚合商竞争激烈，大企业客户经常部署多网关冗余路由或探索自建系统来压低处理费。监管也严重制约商户单位经济：INR 2,000 以下 UPI 交易 MDR
              为零，大额交易支付聚合商必须与合作银行 50:50 分成。2022 年 12 月至 2023 年 12 月 RBI 实施 14
              个月商户开户禁令后，合规开销进一步上升，所有签约企业都需要严格的内部商户风险画像和持续交易监控。
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU012
              - CU013
              - CU014
