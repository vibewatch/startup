      - number: '1.4'
        title: 运营规模与不利的利润率现实
        blocks:
          - type: paragraph
            body: >-
              Razorpay 在印度互联网经济中已达到很大商业规模，处理超过 $150 billion 的总支付额（TPV），报道的年化运行额已超过 $180 billion，并为 100
              多家印度独角兽和数百万注册企业提供支付受理。可是，支付聚合规模被结构性偏薄的单位经济和强监管摩擦抵消。UPI 占印度消费者数字支付量绝大多数，而法规规定 ₹2,000 以下的标准商户交易 MDR
              为零，因此核心支付聚合商在主要交易流上的利润极低。2022 年 12 月至 2023 年 12 月，RBI 又实施了 12 个月禁令，在支付聚合商牌照最终获批前禁止 Razorpay
              及数家同业招揽新商户。2023 年 12 月获完整 PA 授权后，商户现场核验、更严格的 KYC 和拟议 GST 等合规负担仍在压缩净贡献利润率，迫使 Razorpay 大力拓展软件邻近的银行、薪资、POS
              和跨境业务。
            claimRefs:
              - CO010
              - CO011
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管摩擦与零 MDR 利润压缩
            body: >-
              Razorpay 快速增长的交易额掩盖了印度国内支付市场固有的结构性利润压缩。UPI 占消费者交易量绝大多数，法规又要求 ₹2,000 以下交易 MDR 为零，因此核心支付聚合商的盈利空间受到严重限制。再叠加
              RBI 2022–2023 年冻结开户及持续的商户现场审计要求，Razorpay 必须不断从商业银行、软件工具、POS 硬件和跨境通道获取更高利润率的收入。
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
              - CO016
          - type: callout
            title: IPO 前估值现实与资本结构迁移
            body: >-
              Razorpay 2026 年 6 月保密提交的 DRHP 显示预期估值区间为 $5–6 billion，较 2021 年流动性周期中 Series F 确立的 $7.5 billion
              私募估值峰值有实际折价。公司承担了将注册地从美国 reverse-flip 迁回班加罗尔的大额税费后，临近的公开上市将检验机构投资者对面临印度国内合规压力的成熟金融科技基础设施的兴趣。
            calloutType: insight
            claimRefs:
              - CO012
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出定义
        blocks:
          - type: paragraph
            body: >-
              评估 Razorpay 的可服务市场，首先要把商户支付处理总量与实际捕获的软件费池拆开。在支付处理层，绝大部分交换费向上游流向发卡行和 Visa、Mastercard 等支付网络，支付聚合商在银行卡上的国内有效
              take rate 约为 2%，而 UPI 流量的净利润率更低。为获取更多商户经济租金，可服务边界已扩展至 B2B 银行软件、供应商付款、薪资自动化和营运资金评估。RazorpayX 新银行套件每年处理 $30
              billion 交易额，非支付收入目前约占公司总收入 25%。与此同时，线下 POS 设备销售及硬件相关订阅在 FY25 创造 ₹442 crore，巩固了连接线上数字商业与实体门店结账流程的全渠道边界。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM009
      - number: '2.2'
        title: TAM、SAM 与受约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              印度数字支付市场的 headline 数字惊人，但严谨尽调必须把总吞吐量和变现能力分开。印度数字支付总额预计到 FY2026 达到 $10 trillion，较 FY2023 约 $3 trillion
              增长三倍；现有年度数字支付流量为 $3 trillion 至 $4 trillion，每月 UPI 交易超过 12 billion
              笔。然而，若评估商户金融科技软件，支付、企业银行、信贷和薪资的现实可服务市场合计约 ₹25 至 ₹30 lakh crore（$300B 至 $360B）。在这片市场中，Razorpay
              以领先独立平台占据强势位置：覆盖 12 million 家商户，年化 TPV 超过 $180 billion，约占国内线上支付网关市场 55%。管理层提出长期目标，要依靠拓展东南亚和深化国内渗透，到 2030
              年把处理量提升至 $400 billion。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
