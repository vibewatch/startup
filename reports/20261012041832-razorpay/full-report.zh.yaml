      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 覆盖印度独角兽与数字先行者的主导足迹
            body: Razorpay 在印度科技商业中建立了罕见的强势地位，为 70% 至 76% 的印度独角兽提供支付，年化交易量超过 $180 billion。开发者优先的起点带来自然的生态拥护，保护了核心网关采用。
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU004
          - type: callout
            title: UPI 零 MDR 与企业自建造成利润率压缩
            body: >-
              每日 35 million 笔 UPI 交易规模庞大，但把 UPI sub-INR 2,000 交易 MDR 设为零的监管上限，严重挤压聚合商经济性。同时，大型企业经常多宿主或自建路由，把费用压到
              0.5%-1%，限制 take rate 上行空间。
            calloutType: risk
            claimRefs:
              - CU008
              - CU010
              - CU012
