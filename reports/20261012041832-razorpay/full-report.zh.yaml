  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管许可既是护城河，也是单点增长约束
        blocks:
          - type: paragraph
            body: >-
              Razorpay 最明确的已证实下行风险是监管中断。Inc42 报道称，RBI 于 2022 年 12 月暂停 Razorpay 和其他支付聚合商招揽新用户，等待完整批准；Razorpay 于 2023 年 12
              月获准恢复 [CR001, CR002]。Razorpay 当前网站称，Razorpay Payments Private Limited 自 2026 年 1 月 1 日起是 RBI 授权的 Payment
              Aggregator [CR003]，这降低了眼前牌照不确定性，却没有抹去监管行动能够中断获客的先例。持续负担包括交易监控、商户风险限额和现场核验要求 [CR004]。跨境扩张增加
              FEMA、LRS、开户及银行合作伙伴复杂性，并未消除对印度监管的依赖 [CR015]。投资上应把许可视为运营依赖：若再次限制开户、检查结果不利，或无法证明商户控制质量，应暂停投资判断，直到审阅一手记录。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
