      - number: '1.2'
        title: 高管领导与公司治理
        blocks:
          - type: paragraph
            body: >-
              Razorpay 的创始团队仍负责公司领导和战略方向：Harshil Mathur 任首席执行官（CEO），Shashank Kumar 任董事总经理（MD）。两人此前在 IIT Roorkee 创办 SDS
              Labs，并分别在 Schlumberger 和 Microsoft 工作。Mathur 负责整体公司战略、监管沟通和资本配置；Kumar 负责技术架构、工程和平台计划，包括近期的 Model Context
              Protocol（MCP）服务器及 AI 辅助代理式支付协议。随着公司成长，支付、银行、合规和国际扩张等职能引入了专业高管，但战略权力仍高度集中于两位联合创始人。Razorpay
              的关键运营现实，是必须在印度严格监管的金融科技环境中经营。Reserve Bank of India（RBI）和 National Payments Corporation of
              India（NPCI）的监管要求带来严格合规义务，包括商户现场核验标准、托管账户对账要求，以及支付聚合商（PA）活动的严格牌照边界。
            claimRefs:
