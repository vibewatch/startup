      - number: '1.3'
        title: 资本化、投资者基础与上市路线
        blocks:
          - type: paragraph
            body: >-
              Razorpay 在 Seed 至 Series F 的多轮融资中累计获得约 $741.5 million 股权融资。其机构股东包括 Y Combinator、Peak XV Partners（前 Sequoia
              Capital India）、Tiger Global Management、GIC（新加坡主权财富基金）、Lone Pine Capital、Alkeon Capital
              Management、Technology Crossover Ventures（TCV）、Lightspeed Venture Partners、Ribbit Capital、Matrix
              Partners、Salesforce Ventures 和 MasterCard 等全球创投、成长型股权及主权财富机构。2021 年 12 月 Series F 将公司投后估值定为 $7.5
              billion；随后公司启动内部重组，为印度上市做准备，其中包括从美国迁回印度的复杂 reverse-flip 注册地迁移，并承担了高额一次性税费。2026 年 6 月 12 日，Razorpay
              Software Limited 向 SEBI 和 MainBoard 证券交易所秘密提交 Draft Red Herring Prospectus（DRHP），并聘请 Axis Capital、J.P.
              Morgan、Citigroup 和 Kotak Mahindra Capital 组成牵头投行团。市场披露和非上市股指示显示，预计发行规模约 $600 million（₹5,000–6,000
              crore），目标是在 2026 年末实现 $5–6 billion IPO 估值，较私募估值峰值出现温和倍数压缩。
            claimRefs:
