  - id: FE001
    title: 产品架构图
    type: stack
    summary: 分层展示 Razorpay 的运营栈，从开发者界面、支付微服务、银行引擎一直到底层云基础设施和合作银行通道。
    data:
      layers:
        - label: 客户与开发者交互界面
          detail: 托管结账页面、移动 SDK、REST API、webhook、Postman 集合及 Model Context Protocol（MCP）服务器。
        - label: 支付受理与智能路由核心
          detail: AI 驱动的动态路由引擎、多网络令牌化（TokenHQ），以及自动化两步授权与扣款流程。
        - label: 店内与全渠道终端栈
          detail: Razorpay POS 设备编排覆盖 600,000+ 个触点，并配有数字开票（BillMe）和忠诚度平台（PoshVine）。
        - label: 银行增值、付款与放款
          detail: RazorpayX 活期账户、自动化供应商付款、Smart Collect 虚拟账户，以及税务 / 薪资合规引擎。
        - label: 风险、欺诈与安全智能
          detail: 实时交易异常检测、Thirdwatch RTO 风险评估及 PCI DSS Level 1 数据保护控制。
        - label: 容器编排与云基础设施
          detail: AWS Kubernetes（EKS）微服务、Docker 容器化、AWS API Gateway 及 Prometheus 2/Grafana 可观测性。
        - label: 银行合作通道与监管结算交换机
          detail: NPCI UPI 交换机、受 RBI 监管的支付聚合商托管账户、银行卡组织（Visa、Mastercard、RuPay）及合作银行 API。
    approximationNotes: 架构层次综合自工程分析、开发者文档及公开云部署规格。
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 商户关系从开发者准入，逐步演进到多产品银行服务和企业锁定。
    data:
      items:
        - label: 探索与开发者沙盒
          touchpoints:
            - 自助查看 API 文档
            - 用示例代码即时测试沙盒
            - 开发者口碑推荐
        - label: 网关启用与首次支付
          touchpoints:
            - 10 分钟数字化准入与 KYC
            - 用 3 行代码简单接入结账流程
            - 处理首笔真实客户支付
        - label: 交易规模化与风险监控
          touchpoints:
            - 大规模 UPI 与银行卡支付路由
            - 通过 Agent Studio 自动处理争议
            - 拒付保护与欺诈筛查
        - label: 跨境与全渠道扩张
          touchpoints:
            - 使用 MoneySaver Exporter Account 进行国际支付
            - 通过 Ezetap POS 终端拓展线下零售
            - 多币种结算与自动化 FIRC
        - label: 全栈财务与银行整合
          touchpoints:
            - RazorpayX 企业银行与资金管理
            - 自动化供应商付款与税费计算
            - RazorpayX 为员工发放薪资
        - label: 企业定制与长期锁定
          touchpoints:
            - 专属客户管理与定制收入分成
            - 直接整合 ERP 会计系统并自动记账
            - 整合 Agentic MCP 服务器，支持 AI 商务
    approximationNotes: 代表从公司案例研究和产品文档推导出的标准产品采用与扩张生命周期。
