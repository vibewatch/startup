      - number: '2.3'
        title: 买方分层与采购流程
        blocks:
          - type: paragraph
            body: >-
              Razorpay 客户群的采购动态反映出不同组织规模下利益相关者的差异。早期初创企业和 D2C 数字品牌的主要买方是技术创始人或工程负责人，他们看重完整 API 文档、自助开发者开户和即时 sandbox
              环境，可把集成周期从数周缩短到数小时。中端市场和大型企业则涉及财务控制人、公司财务主管和 CIO，需求是高吞吐多银行路由、自动对账以及严格的 uptime 服务级别协议。对
              Airbnb、Decathlon、Replit 和 McDonald's 等在印度经营的全球品牌，本地化集成是关键任务；通用全球网关受本地 recurring mandate 规则和卡 tokenization
              标准影响，交易完成率可能低至 30%。商户越深地嵌入 Razorpay 覆盖网关、付款和薪资的整合栈，累计切换成本越高，商户留存率约达 94%。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 结构性增长驱动与监管约束
        blocks:
          - type: paragraph
            body: >-
              印度数字经济扩张带来强劲结构性顺风，但监管干预和单位经济现实构成严重运营约束。首要驱动是 MSME 快速正规化，以及消费者普遍采用即时 UPI 结算。可是，₹2,000 以下 UPI 交易的零 MDR 政策覆盖近
              80% 的 UPI 交易量，严重限制了网关在全国最普及数字支付轨道上的收费能力。支付聚合商还要在大额交易上与合作商业银行强制 50:50 分成，可能承担 18% GST，并遵守 RBI 要求交易失败率低于
              0.5% 的运营韧性标准。这些合规和成本负担叠加，使 Razorpay 毛利率从 FY24 的 39.4% 降至 FY25 的
              33.8%，也说明扩大高利润率跨境处理和收费型软件工作流不是可选增长方向，而是生存所需。
            claimRefs:
              - CM004
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 支付聚合的零 MDR 困局
            body: UPI 占消费者交易量绝大多数，而 ₹2,000 以下交易的零 MDR 要求迫使支付聚合商用高利润率的商业银行（RazorpayX）、商户营运资金（Capital）和跨境企业网关合同交叉补贴支付处理。
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM013
          - type: callout
            title: 监管逆风与毛利率压缩
            body: >-
              银行网关和国内金融科技公司的激烈竞争，加上合作银行收入分成和不断增加的合规要求（100% 数据本地化、交易失败率低于 0.5%），使 Razorpay 毛利率从 FY24 的 39.4% 降至 FY25 的
              33.8%。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局、类别分类与市场架构
        blocks:
          - type: paragraph
            body: >-
              印度商业支付和金融科技生态分为五个竞争层级，争夺商户交易、流动性和软件触点 [CP001]。在主要线上支付聚合市场，Razorpay 以估计 55% 的份额保持领先，每日处理约 $495 million
              TPV（年化约 $180 billion），覆盖 12 million 多家企业 [CP002, CP003]。其直接同业包括 Prosus 旗下 PayU India 和 Cashfree Payments
              等专业支付聚合商；两者均持有 RBI 授权的支付聚合牌照，并积极争夺中端市场和企业线上交易量 [CP001, CP004]。CCAvenue（Infibeam
              Avenues）和直接银行聚合商等传统银行及商户收单机构，在政府、公用事业和保守型企业客户中仍有根深蒂固的关系，但高增长数字原生交易量已转向开发者平台 [CP001, CP005]。与此同时，PhonePe 和
              Paytm 等消费者 UPI 平台依靠庞大用户分发和线下商户二维码网络挑战线上结账；Pine Labs 等 POS 终端专业厂商则守住企业实体零售 [CP001,
              CP006]。对跨境和跨国商户，Stripe、Adyen 等全球平台提供顺畅的多币种受理，但本地银行集成较浅且没有国内商户贷款，限制了其国内覆盖 [CP001, CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: 竞争者画像、核心能力与功能比较
        blocks:
          - type: paragraph
            body: >-
              比较竞争者架构，可以看出规模、分发和产品广度上的不同运营策略 [CP001]。PayU India 兼具深厚企业关系、Prosus 资本和 LazyPay 消费信贷基础设施，但计划中的 $4.7 billion
              BillDesk 收购取消，历史 RBI 开户限制也拖慢了竞争势头 [CP001, CP004]。Cashfree Payments 在自动付款、平台分账结算和身份核验 API
              上形成了公认的领导力，技术文档和开发者工具也成熟；不过其处理规模约为 Razorpay 的五分之一，商业银行覆盖更窄 [CP001, CP008]。消费者平台各有强项：PhonePe 在 Walmart
              支持下处理约 48% 的印度 UPI 量，但零 MDR UPI 的变现仍是持续的商业难题，限制其相较 Razorpay 卡和信贷组合创造高 take rate 的能力 [CP001, CP009]。Paytm
              Payment Gateway 拥有巨大的消费者品牌资产和 soundbox 二维码分发，但 RBI 在 2024 年对 Paytm Payments Bank 施加的广泛监管限制损害机构信任，促使商户重新评估
              [CP001, CP004]。在国际化和开发者能力上，Stripe 提供世界级文档、全球合规和覆盖 46+ 个国家的统一 API，但其 2.9% 加固定费用的溢价定价限制了对利润敏感的印度国内商户的采用
