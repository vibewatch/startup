      - number: '2.2'
        title: TAM, SAM, and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              India's digital payments landscape exhibits astronomical headline figures, but disciplined diligence
              requires segmenting gross throughput from monetization capacity. Total digital payments in India are
              projected to reach $10 trillion by FY2026, tripling from approximately $3 trillion in FY2023, while
              existing annual digital payment flows span between $3 trillion and $4 trillion driven by more than 12
              billion monthly UPI transactions. However, when evaluating merchant fintech software, the realistic
              addressable market across payments, corporate banking, credit, and payroll aggregates to ₹25 to ₹30 lakh
              crore ($300B to $360B). Within this addressable arena, Razorpay occupies a formidable position as the
              leading independent platform, processing over $180 billion in annualized total payment volume across 12
              million merchants and commanding roughly 55% of the domestic online payment gateway market. Management has
              articulated a long-term goal of scaling processed volume to $400 billion by 2030 through Southeast Asian
              expansion and deeper domestic penetration.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
