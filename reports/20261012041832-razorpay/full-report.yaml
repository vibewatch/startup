      - number: '1.3'
        title: Capitalization, Investor Base, and Public Listing Roadmap
        blocks:
          - type: paragraph
            body: >-
              Razorpay has accumulated total equity financing of approximately $741.5 million across multiple funding
              rounds spanning Seed through Series F. Its institutional capitalization table features prominent global
              venture capital firms, growth equity funds, and sovereign wealth institutions, including Y Combinator,
              Peak XV Partners (formerly Sequoia Capital India), Tiger Global Management, GIC (Singapore's sovereign
              wealth fund), Lone Pine Capital, Alkeon Capital Management, Technology Crossover Ventures (TCV),
              Lightspeed Venture Partners, Ribbit Capital, Matrix Partners, Salesforce Ventures, and MasterCard.
              Following a Series F round in December 2021 that priced the company at a post-money valuation of $7.5
              billion, Razorpay initiated internal corporate restructuring to prepare for an Indian public listing,
              including a complex reverse-flip redomiciling process from the United States to India that incurred
              substantial one-time tax outlays. On June 12, 2026, Razorpay Software Limited confidentially filed its
              Draft Red Herring Prospectus (DRHP) with SEBI and MainBoard stock exchanges, engaging a lead investment
              banking syndicate comprising Axis Capital, J.P. Morgan, Citigroup, and Kotak Mahindra Capital. Market
              disclosures and unlisted share indications report an anticipated issue size of approximately $600 million
              (₹5,000–6,000 crore) targeting an IPO valuation of $5–6 billion in late 2026, reflecting moderate multiple
              compression relative to peak private marks.
