      - number: '3.3'
        title: Pricing Economics, Switching Dynamics, Moat Durability, and Adverse Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Pricing structures across Indian payment aggregation reflect the profound economic distortions of domestic
              payment regulation [CP009, CP010]. In the card and netbanking categories, aggregators charge a standard
              merchant discount rate (MDR) of roughly 1.5% to 2.0%, often discounted to 0.5% to 1.0% for
              mega-enterprises processing large volumes [CP001, CP010]. However, domestic UPI payments—which represent
              the overwhelming majority of transaction volume—carry a government-mandated zero-MDR policy for
              transactions under INR 2,000, depriving processors of interchange revenue on high-frequency transactions
              [CP009, CP010]. In response, Razorpay relies on full-stack software lock-in to insulate gross margins,
              monetizing through RazorpayX neo-banking account fees and float, Razorpay Capital merchant working capital
              spreads, payroll subscriptions, and cross-border currency conversion fees [CP002, CP007, CP011]. Switching
              costs for core payment gateways are moderate when merchants utilize multi-homing smart routers like
              Juspay, but switching friction increases substantially once businesses adopt RazorpayX for automated
              vendor payouts, tax payments, and employee payroll [CP001, CP011, CP012]. Despite this defensive
              multi-product moat, Razorpay faces durable adverse risks: regulatory licensing freezes can instantly stall
              merchant acquisition, prospective GST impositions threaten sub-INR 2,000 card transactions, enterprise
              merchants frequently threaten in-house aggregator builds, and upcoming UPI fee restructuring may alter
              competitive economics [CP004, CP010, CP013].
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
