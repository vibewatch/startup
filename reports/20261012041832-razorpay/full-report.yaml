      - number: '2.4'
        title: Structural Growth Drivers and Regulatory Constraints
        blocks:
          - type: paragraph
            body: >-
              The expansion of India's digital economy provides robust structural tailwinds, yet regulatory
              interventions and unit economic realities impose severe operational constraints. The flagship driver
              remains the rapid formalization of MSMEs and ubiquitous consumer adoption of instant UPI settlements.
              However, the regulatory zero-MDR policy on UPI transactions under ₹2,000—which comprise nearly 80% of all
              UPI transaction volumes—severely limits gateway fee capture on the country's most popular digital payment
              rail. Furthermore, payment aggregators face mandatory 50:50 revenue share arrangements with partner
              commercial banks on larger transactions, potential 18% GST levies, and stringent Reserve Bank of India
              operational resilience mandates requiring transaction failure rates below 0.5%. These compounding
              compliance and cost burdens compressed Razorpay's gross margins from 39.4% in FY24 to 33.8% in FY25,
              highlighting why scaling high-margin cross-border processing and fee-based software workflows represents a
              survival necessity rather than merely an optional growth vector.
            claimRefs:
              - CM004
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Zero-MDR Dilemma in Payment Aggregation
            body: >-
              While UPI accounts for the vast majority of consumer transaction volume, the zero-MDR mandate on
              transactions under ₹2,000 forces payment aggregators to cross-subsidize payment processing through
              higher-margin business banking (RazorpayX), merchant working capital (Capital), and cross-border
              enterprise gateway contracts.
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM013
          - type: callout
            title: Regulatory Headwinds and Gross Margin Compression
            body: >-
              Intense competitive pressure from bank gateways and domestic fintechs, coupled with partner bank
              revenue-sharing splits and increasing compliance requirements (100% data localization, transaction failure
              limits under 0.5%), compressed Razorpay's gross margins from 39.4% in FY24 to 33.8% in FY25.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape, Category Taxonomy, and Market Architecture
        blocks:
          - type: paragraph
            body: >-
              India's business payments and fintech ecosystem spans five distinct competitive tiers that compete for
              merchant transactions, liquidity, and software touchpoints [CP001]. In the primary online payment
              aggregator segment, Razorpay maintains market leadership with an estimated 55% market share, processing
              roughly $495 million in daily total payment volume (~$180 billion annualized) across more than 12 million
              businesses [CP002, CP003]. Razorpay’s direct peer group comprises specialized payment aggregators such as
              Prosus-owned PayU India and Cashfree Payments, both of which operate RBI-authorized payment aggregator
              licenses and compete aggressively for mid-market and enterprise online transaction volume [CP001, CP004].
              Legacy banking and merchant acquirer incumbents, including CCAvenue (Infibeam Avenues) and direct bank
              aggregators, retain entrenched relationships across government, utility, and conservative corporate
              accounts, but have ceded high-growth digital native volume to developer-centric platforms [CP001, CP005].
              Meanwhile, consumer UPI platforms PhonePe and Paytm leverage massive user distribution and offline
              merchant QR networks to challenge online checkout flows, while point-of-sale terminal specialists like
              Pine Labs defend enterprise physical retail [CP001, CP006]. For cross-border and multinational merchants,
              global platforms such as Stripe and Adyen provide seamless multi-currency acceptance, though their
              domestic footprint remains constrained by shallow local banking integrations and the absence of domestic
              merchant lending [CP001, CP007].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
