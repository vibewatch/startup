      - number: '1.2'
        title: Executive Leadership and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Razorpay's executive leadership and strategic direction continue to be guided by its founding team, with
              Harshil Mathur serving as Chief Executive Officer (CEO) and Shashank Kumar as Managing Director (MD). The
              two founders established Razorpay after previously founding SDS Labs at IIT Roorkee and working at
              Schlumberger and Microsoft respectively. While Mathur leads overall corporate strategy, regulatory
              engagement, and capital allocation, Kumar oversees technology architecture, engineering, and platform
              initiatives, including recent developments such as Model Context Protocol (MCP) servers and AI-assisted
              agentic payment protocols. Over its growth lifecycle, the company has supplemented founder leadership with
              functional executives across payments, banking, compliance, and international expansion, though strategic
              authority remains tightly concentrated among the co-founders. A critical operational reality for Razorpay
              is operating within India's rigorously supervised fintech regulatory landscape. Regulatory oversight from
              the Reserve Bank of India (RBI) and National Payments Corporation of India (NPCI) imposes stringent
              compliance obligations, including physical merchant verification standards, escrow reconciliation
              mandates, and strict licensing parameters for payment aggregator (PA) activities.
            claimRefs:
