      - number: '4.2'
        title: Go-to-Market Motion, Developer Distribution, and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Razorpay's distribution model operates on a developer-first, product-led growth strategy supplemented by
              enterprise direct sales. From its inception in Y Combinator's Winter 2015 batch, Razorpay differentiated
              its offering through developer-friendly APIs, comprehensive SDKs, and automated onboarding that reduced
              go-live integration timelines from weeks to days. This developer-centric approach minimized merchant
              acquisition friction across Indian startups, enabling the platform to secure payment processing
              relationships with over 100 Indian unicorns and millions of SMBs. List pricing for standard card and
              netbanking transactions is structured at 2% to 3% plus GST per transaction. For mid-market and large
              enterprise merchants, custom pricing tiers and volume discounts are negotiated based on quarterly GMV
              commitments. Sales efficiency is reinforced by high switching costs; once a merchant embeds Razorpay for
              collections, automated payouts, GST invoicing, and payroll, displacing the platform introduces substantial
              operational disruption, driving high organic retention without incremental acquisition expenditure.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI011
      - number: '4.3'
        title: Cost Structure, MDR Headwinds, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The economics of digital payments aggregation in India are shaped by intense regulatory intervention and
              bank interchange cost structures. Over 80% of digital payment transactions occur via UPI, where regulatory
              mandates enforce a zero Merchant Discount Rate on transactions under ₹2,000. Consequently, payment
              aggregators cannot levy processing fees on small-ticket UPI transactions while still absorbing network
              infrastructure, customer verification, and routing overhead. On higher-ticket transactions, aggregators
              share interchange revenue with partner banks on an approximate 50:50 basis. Additionally, compliance
              burdens have grown significantly following RBI guidelines requiring physical merchant verification and
              strict risk limits, alongside proposed 18% GST levies on sub-₹2,000 card transactions. Despite these
              margin headwinds, Razorpay achieved ₹34 crore in profit after tax for FY24, expanding 4.7-fold from ₹7
              crore in FY23, and generated over ₹1,200 crore in gross profit in FY25 as higher-margin software and
              cross-border streams scaled.
            claimRefs:
              - CI002
              - CI005
              - CI008
              - CI009
              - CI010
