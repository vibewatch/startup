  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Core Streams, and Monetization Mix
        blocks:
          - type: paragraph
            body: >-
              Razorpay's revenue architecture has evolved from a standalone online payment gateway into an integrated
              B2B financial operating platform. The company's core monetization engine remains payment processing fees,
              which scale directly with Total Payment Volume. Having surpassed $150 billion in annualized TPV in FY24
              and scaling beyond $180 billion by FY25, processing fees generated ₹2,068 crore of the company's ₹2,501
              crore operating revenue in FY24. To diversify beyond linear transaction commissions, Razorpay layers
              higher-margin software and banking solutions across its merchant base. RazorpayX provides automated
              payroll, vendor disbursements, and business banking workflows on current accounts with partner
              institutions. Concurrently, Razorpay POS delivers omnichannel payment terminals contributing 10% of total
              revenue in FY24 with management targeting 20% to 30%, while Razorpay Capital leverages transaction history
              to originate working capital lines up to ₹50 lakh at roughly 1.5% monthly interest. International payments
              via Curlec and the RBI cross-border license contribute higher-margin FX spreads of 1% to 4%.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI007
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
