      - number: '3.2'
        title: Competitor Profiling, Core Capabilities, and Feature Comparison
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitor architectures highlights distinct operational strategies across scale, distribution,
              and product breadth [CP001]. PayU India combines deep enterprise relationships with Prosus capital and
              LazyPay consumer credit infrastructure, though the cancellation of its planned $4.7 billion BillDesk
              acquisition and historical RBI onboarding curbs slowed its competitive momentum [CP001, CP004]. Cashfree
              Payments has carved out recognized leadership in automated payouts, marketplace split-settlements, and
              identity verification APIs, offering sophisticated technical documentation and developer tooling, yet it
              operates at approximately one-fifth of Razorpay's processing scale and maintains a narrower business
              banking footprint [CP001, CP008]. Consumer platforms exhibit divergent strengths: PhonePe processes
              approximately 48% of Indian UPI volume with Walmart backing, but monetizing zero-MDR UPI transactions
              remains a persistent commercial hurdle, limiting its ability to generate high take-rates relative to
              Razorpay's card and credit mix [CP001, CP009]. Paytm Payment Gateway possesses vast consumer brand equity
              and soundbox QR distribution, but extensive regulatory curbs imposed on Paytm Payments Bank by the Reserve
              Bank of India in 2024 damaged institutional trust and triggered merchant reassessment [CP001, CP004]. On
              international and developer capability, Stripe offers world-class documentation, global compliance, and
              unified APIs across 46+ countries, but charges premium 2.9% plus fixed fees that limit adoption among
              margin-sensitive domestic Indian merchants [CP001, CP007].
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
