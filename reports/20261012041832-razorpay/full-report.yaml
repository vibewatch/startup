figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of Razorpay from 2014 founding and YC accelerator backing to multi-product scale,
      acquisitions, and 2026 confidential DRHP filing.
    data:
      items:
        - label: 2014 Founding
          detail: >-
            Harshil Mathur and Shashank Kumar establish Razorpay in Bengaluru to simplify online payment acceptance for
            Indian startups and SMEs.
          date: '2014'
          tone: neutral
        - label: YC Winter 2015 Batch
          detail: >-
            Selected for Y Combinator W15 cohort in Silicon Valley as YC's second Indian investment, securing
            foundational seed funding.
          date: '2015'
          tone: positive
        - label: UPI & Digital Expansion
          detail: >-
            Introduces first completely digital onboarding for startups and early platform integration for India's
            Unified Payments Interface (UPI).
          date: '2016'
          tone: positive
        - label: RazorpayX & Neo-Banking
          detail: >-
            Launches RazorpayX business banking suite and Razorpay Capital lending workflow to manage full corporate
            money movement.
          date: '2019'
          tone: positive
        - label: Series F $7.5B Unicorn Valuation
          detail: >-
            Secures Series F financing bringing total cumulative capital raised to $741.5 million at a peak private
            valuation of $7.5 billion.
          date: '2021'
          tone: positive
        - label: Omnichannel POS & SEA Expansion
          detail: >-
            Acquires offline POS leader Ezetap in India and recurring payments platform Curlec in Malaysia to expand
            international presence.
          date: '2022'
          tone: positive
        - label: RBI Onboarding Moratorium
          detail: >-
            RBI bars Razorpay and peer payment aggregators from onboarding new merchants pending final license
            approvals, lasting one year.
          date: 2022-12
          tone: negative
        - label: Full PA License Granted
          detail: >-
            Reserve Bank of India grants final authorization for payment aggregator operations, lifting new merchant
            onboarding restrictions.
          date: 2023-12
          tone: positive
        - label: Confidential DRHP IPO Filing
          detail: >-
            Razorpay Software Limited files confidential DRHP with SEBI and MainBoard exchanges targeting $600M issue at
            $5–6B valuation.
          date: 2026-06
          tone: neutral
    approximationNotes: >-
      Milestone dates and event summaries are compiled from official corporate disclosures, Y Combinator company history
      records, and regulatory reporting.
