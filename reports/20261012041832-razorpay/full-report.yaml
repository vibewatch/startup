      - number: '2.3'
        title: Buyer Segmentation and Procurement Workflows
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics across Razorpay's customer base reflect distinct stakeholder priorities across
              organizational scales. For early-stage startups and direct-to-consumer digital brands, the primary buyer
              is the technical founder or engineering lead, who prioritizes comprehensive API documentation, self-serve
              developer onboarding, and instant sandbox environments that reduce integration cycles from weeks to hours.
              Conversely, mid-market and large enterprise buyers involve finance controllers, corporate treasurers, and
              CIOs seeking high-throughput multi-bank routing, automated reconciliation, and strict uptime service level
              agreements. For global multinational brands operating in India, such as Airbnb, Decathlon, Replit, and
              McDonald's, localized integration is a mission-critical imperative; generic global gateways suffer from
              transaction completion rates as low as 30% due to local recurring mandate rules and card tokenization
              standards. As merchants embed deeper into Razorpay's integrated stack spanning gateway, payouts, and
              payroll, cumulative switching costs yield high operational stickiness with merchant retention rates
              reaching approximately 94%.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
