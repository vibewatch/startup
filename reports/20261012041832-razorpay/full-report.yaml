  - id: TV002
    title: Investment Thesis and Anti-Thesis
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Bull Thesis
        - Unmatched scale and ecosystem lock-in across Indian enterprise fintech and emerging cross-border rails
        - Processes $180B+ annualized TPV powering over 100 Indian unicorns and leading global brands like Airbnb
        - >-
          Deceleration in enterprise volume growth or loss of top digital commerce merchant relationships to rival
          gateways
      - - Anti-Thesis
        - Structural payment aggregator margin compression under strict RBI oversight and zero-MDR mandates
        - >-
          UPI transactions below Rs 2000 yield zero MDR, forcing 50:50 revenue sharing on larger tickets with partner
          banks
        - >-
          Regulatory reform allowing merchant MDR charges across all UPI tiers, materially lifting aggregator gross
          margins
      - - Restructuring Drag
        - Domicile relocation to India imposes massive tax outlays and depresses reported statutory earnings
        - FY25 net loss reached Rs 1,209 crore primarily due to headquarters restructuring and tax liabilities
        - >-
          Rapid audited demonstration of positive operating cash flow and post-reorganization tax finality in SEBI
          filings
    notes: >-
      Core thesis dynamics reflect tension between top-tier merchant market share and margin suppression under Indian
      payment system regulations.
