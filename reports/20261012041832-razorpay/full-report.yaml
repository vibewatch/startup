chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Founding Mission
        blocks:
          - type: paragraph
            body: >-
              Razorpay (operating through its parent corporate entity Razorpay Software Limited and licensed entity
              Razorpay Payments Private Limited) is headquartered in Bengaluru, Karnataka, India. Founded in 2014 by IIT
              Roorkee alumni Harshil Mathur and Shashank Kumar, the company was established to address friction and lack
              of modern digital infrastructure in Indian merchant payment processing, particularly for startups and
              small-to-medium enterprises (SMEs). Accepted into Silicon Valley accelerator Y Combinator as part of its
              Winter 2015 batch—becoming YC's second Indian cohort member and later its first Indian unicorn—Razorpay
              initially pioneered frictionless digital onboarding, developer-friendly APIs, and early native support for
              India's Unified Payments Interface (UPI). Over twelve years of continuous product development and
              strategic acquisitions, Razorpay expanded its scope from a transactional payment gateway into an
              integrated financial operating system for digital businesses. Today, Razorpay's unified technology
              infrastructure enables merchants to accept payments across more than 100 payment methods, automate vendor
              and payroll disbursements, manage current accounts via partner banks, operate offline point-of-sale (POS)
              terminals, and execute cross-border commercial transactions.
            claimRefs:
