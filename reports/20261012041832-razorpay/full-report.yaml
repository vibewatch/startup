      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-Stack Financial Operating System Defense
            body: >-
              Razorpay’s primary competitive moat is not transaction processing speed, but its comprehensive workflow
              ecosystem. By intertwining payment acceptance with RazorpayX neo-banking, automated payroll, working
              capital credit, and international exporter accounts, Razorpay converts commoditized payment pipes into a
              sticky corporate operating system that merchants find costly to displace.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP012
          - type: callout
            title: The Zero-MDR UPI Margin Dilemma
            body: >-
              While UPI volume drives impressive top-line processing metrics exceeding $180 billion in annualized TPV,
              the regulatory mandate enforcing zero MDR on transactions under INR 2,000 limits transaction-fee
              monetization. Aggressive competition from well-funded consumer networks like PhonePe and enterprise price
              discounting from PayU and Cashfree exert ongoing pressure on processor net margins.
            calloutType: risk
            claimRefs:
