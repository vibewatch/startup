callouts:
  - calloutType: risk
    title: Licence status does not eliminate supervisory interruption risk
    body: Razorpay's stated current authorization is positive, but the 2022-2023 onboarding interruption demonstrates that permissioning can directly constrain customer acquisition.
    claimRefs:
      - CR001
      - CR002
      - CR003
  - calloutType: recommendation
    title: Underwrite disclosures, not transaction volume
    body: Require product-level contribution margins, lending vintages, bank concentration, and independently evidenced reliability before treating scale or product breadth as risk reduction.
    claimRefs:
      - CR005
      - CR007
      - CR008
      - CR009
      - CR012
