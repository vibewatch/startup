companyProfile:
  summary: >-
    Razorpay is an Indian full-stack merchant-fintech platform that combines payment acceptance, business banking,
    payouts, payroll, POS, lending-adjacent workflows, and cross-border commerce for startups, SMEs, and larger
    enterprises. The company has grown from a developer-friendly payment gateway into a late-stage private platform with
    broad product breadth, a large merchant base, and a visible path toward an Indian IPO, but it still operates inside
    a tightly regulated payments stack with structurally thin core payment margins.
