  topStrengths:
    - Category-leading merchant-fintech scale across India with a broad enterprise and SMB footprint.
    - Diversified product stack spanning payments, banking workflows, POS, payroll, and cross-border services.
    - Visible growth and pre-IPO momentum supported by a confidential DRHP filing and continued operating expansion.
  topRisks:
    - Zero-MDR UPI economics and bank revenue splits compress domestic payment margins.
    - Regulatory permissioning can interrupt onboarding and constrain growth.
    - >-
      Public disclosure gaps remain around cohort quality, unit economics, and normalized profitability after
      restructuring.
  unresolvedGaps:
    - Audited consolidated filings that reconcile the legal-entity structure, FY25 economics, and IPO-ready disclosures.
    - Merchant retention, cohort quality, concentration, and product-level monetization or contribution margins.
    - Current cap-table mechanics, preference overhang, secondary mix, and final IPO timing/terms.
    - Normalized profitability after stripping reverse-flip, ESOP, and restructuring effects.
