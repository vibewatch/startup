company:
  name: CMBlu Energy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CMBlu Energy has progressed from a 2014-founded German battery developer into a
    unicorn-valued long-duration storage company with a live 1 GWh Alzenau site,
    strategic backing from STRABAG and Samsung Ventures, and a commercial roadmap
    tied to utility and data-center deployments. The same source set still leaves
    core diligence gaps around audited financial performance, customer concentration,
    and how quickly the company can translate pilots and framework agreements into
    delivered, revenue-bearing volume.
sections:
  - id: identity-and-offering
    title: Identity, positioning, and current scale
    body: >-
      CMBlu traces its roots to organic flow-battery research that began in 2011 and
      was formalized into a company in 2014 in Alzenau, Germany. Current sources place
      the headquarters and operational center in Alzenau while also describing activity
      in Greece and the United States, which matters because later manufacturing and
      deployment claims rely on this three-country footprint rather than a single-site
      lab operation. The product narrative is consistent across company and independent
      sources: SolidFlow is positioned as a non-lithium, long-duration storage
      architecture using water-based materials for 10+ hour applications. The business
      model described in the assigned pool centers on selling long-duration storage into
      grid, utility, industrial, and data-center use cases that need renewable energy
      shifting over multi-hour windows rather than short-duration lithium-ion peaking.
      Scale claims are meaningful but still mostly operational rather than financial:
      the company says it has more than 250 employees, including over 150 scientists and
      engineers, yet the source pack does not provide audited revenue, customer count,
      or cash-burn disclosures that would independently validate commercial maturity.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership continuity, governance signals, and stakeholder map
    body: >-
      The strongest leadership change visible in the current evidence is March 2024,
      when Constantin Eis became CEO and founder Dr. Peter Geigle moved to the
      supervisory board, preserving founder continuity while shifting day-to-day
      execution to a scaling operator. Publicly named executives in the assigned pool
      also cover U.S. expansion, technology, finance, and go-to-market functions
      through Giovanni Damato, Dr. Nastaran Krawczyk, Olaf Althaus, and Markus Geigle.
      That is enough to show functional breadth, but not enough to fully underwrite
      governance quality because the assigned sources do not publish a full board roster
      or a detailed cap-table waterfall. The stakeholder map is therefore more concrete
      than the governance map: STRABAG is the clearest strategic capital backer from the
      2023 investment, Samsung Ventures anchors the 2026 Series C signal, Uniper is the
      most important disclosed utility counterparty, and the WEC Energy Group/EPRI pilot
      remains one of the clearest named North American validation relationships.
    claimRefs: [CO005, CO006, CO007, CO010, CO011, CO015]
    tableRefs: [TO002, TO003]
  - id: financing-scale-and-milestones
    title: Financing, industrialization roadmap, and execution test
    body: >-
      The funding narrative is strongest in two visible steps: STRABAG's 2023 growth
      investment and the €50 million initial Series C close announced on 2026-04-30,
      which CMBlu linked to a valuation above €1 billion and to manufacturing scale-up
      plus early deployments in Europe and the United States. The industrialization
      roadmap is equally ambitious. Official and independent sources agree that Alzenau
      has operated since 2024 with 1 GWh current capacity and a 4 GWh site ceiling,
      while Greece is under construction and the U.S. plant remains planned for 2029 as
      part of a >10 GWh three-site footprint. The most material commercialization proof
      in this pool is the February 2026 Uniper framework agreement covering 5 GWh over a
      multi-year horizon, but the same evidence still frames it as conditional framework
      demand rather than disclosed delivered revenue. That distinction matters because an
      independent profile explicitly identifies cross-continent manufacturing ramp as the
      central execution test after the unicorn round, making operational conversion—not
      just fundraising—the key diligence hinge for later chapters.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
