companyProfile:
  summary: >-
    CMBlu Energy develops SolidFlow, a non-lithium long-duration storage system for grid, utility, industrial, and
    data-center use cases. The company traces its roots to 2011 research and was formally founded in 2014 in Alzenau,
    where it now reports an operational 1 GWh site and a broader multi-site manufacturing roadmap that extends into
    Greece and the United States.
