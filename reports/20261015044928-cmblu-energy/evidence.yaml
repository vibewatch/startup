evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial statements or management accounts showing revenue, gross margin, burn, runway, and
      working-capital needs.
    whyItMatters: >-
      Public valuation and factory claims cannot be converted into an investable unit-economics view without verified
      financial performance.
    diligencePath: >-
      Request the latest management accounts, budget-versus-actuals, and current cash runway bridge from finance
      leadership.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Detailed board roster, governance rights, and post-Series C cap-table waterfall including major investor ownership
      and control terms.
    whyItMatters: >-
      Governance concentration and investor protections affect downside control, future financings, and strategic
      optionality.
    diligencePath: >-
      Obtain the board list, current cap table, shareholder agreement summary, and any side-letter rights tied to
      STRABAG or Samsung Ventures.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Signed order backlog, framework call-off conditions, pilot performance readouts, and customer concentration by
      geography or segment.
    whyItMatters: >-
      The company can look de-risked on funding while still being commercially early if pilots and framework agreements
      do not convert into revenue-bearing deliveries.
    diligencePath: >-
      Request Uniper framework schedules, Mercedes and WEC pilot KPIs, and a booked-versus-pipeline customer table by
      site and application.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Independent TAM/SAM/SOM work for non-lithium long-duration storage in CMBlu's target geographies and use cases.
    whyItMatters: >-
      Broad battery-growth data does not prove how much of the market is actually addressable for 10+ hour organic-flow
      systems.
    diligencePath: >-
      Obtain analyst or utility-procurement market work that isolates duration, chemistry, and buyer segment, or rebuild
      the model from disclosed pipeline and procurement data.
    relatedQuestionRefs:
      - QM002
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Disclosed budget owners, procurement-cycle details, and framework-to-order conversion evidence for utility and
      data-center deployments.
    whyItMatters: >-
      The current market case is stronger on technical relevance than on who signs, funds, and repeats deployments at
      scale.
    diligencePath: >-
      Request Uniper call-off detail, SRP commercial structure, and any public or private data-center procurement
      documentation before underwriting share capture assumptions.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Named-vendor list pricing, realized contract pricing, or procurement-side bid comparisons for CMBlu, lithium-ion
      incumbents, and metal-based flow battery vendors.
    whyItMatters: >-
      Without comparable pricing data, the chapter can assess positioning and example economics but cannot quantify
      whether CMBlu wins on delivered cost or contract terms.
    diligencePath: >-
      Request current customer proposals, bid tabs, or signed commercial schedules that show price per MWh, duration,
      warranty, and integration scope across alternatives.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-depth
    missingEvidence: >-
      A customer-by-customer deployment list with commissioned project dates, system sizes, and renewal or expansion
      behavior.
    whyItMatters: >-
      Moat durability depends on repeatable field performance and customer conversion, but the assigned evidence is
      still concentrated in pilots, validation projects, and framework announcements.
    diligencePath: >-
      Ask management for a deployment ledger, signed backlog by stage, and reference calls with buyers that moved from
      pilot qualification into multi-site rollouts.
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, runway model, and any debt or covenant schedule.
    whyItMatters: >-
      Without cash and burn data, investors cannot judge whether the current financing is sufficient to reach 2027
      deliveries and later factory milestones.
    diligencePath: Request the latest monthly management accounts, cash bridge, board package, and debt schedule.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited or management-account revenue, realized ASPs, discounting policy, and revenue recognition treatment for
      framework versus delivered systems.
    whyItMatters: Revenue quality cannot be underwritten from scenario economics or framework announcements alone.
    diligencePath: >-
      Obtain customer contracts, billing schedules, and revenue-recognition memos tied to delivered or contracted
      projects.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin, BOM, manufacturing yield, service costs, and installation or commissioning cost detail.
    whyItMatters: Public project economics do not show whether customer value translates into attractive company margins.
    diligencePath: >-
      Request a plant-level costed BOM, gross-margin bridge, and post-install support cost assumptions by product
      configuration.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: backlog-conversion
    missingEvidence: >-
      Full Uniper framework conditions precedent, batch call-off schedule, cancellation rights, and the expected revenue
      timing for first deliveries.
    whyItMatters: >-
      The framework is the clearest public demand signal, but its financial value depends on actual call-offs and
      delivery timing.
    diligencePath: Review the signed framework agreement and management's probability-weighted backlog model.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: safety-and-quality-controls
    missingEvidence: >-
      Public safety certifications, quality-system documentation, cybersecurity controls, and field-failure disclosures
      for SolidFlow installations.
    whyItMatters: >-
      Readers can underwrite the chemistry narrative, but not the control environment or bankability of utility-scale
      deployment without third-party validation.
    diligencePath: >-
      Request UL/IEC certification records, quality manuals, cyber architecture documentation, and independent
      commissioning or reliability reports for deployed systems.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-concentration-metrics
    missingEvidence: >-
      Public disclosure of customer count, NRR or GRR, churn, renewal rates, contract length, and top-customer
      concentration.
