  evidenceGaps:
    - type: missing-source
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited or management-account revenue, gross margin, cash burn, runway, and booked-order metrics for 2026.
      whyItMatters: Without operating economics, the current financing price cannot be stress-tested against commercialization reality.
      diligencePath: Request the latest management accounts, order book, and board reporting package under NDA.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: cap-table
      missingEvidence: The current cap-table waterfall, liquidation preferences, investor rights, and any structure attached to the Series C close.
      whyItMatters: Entry discipline depends on where new money sits in the stack, not just on the headline valuation.
      diligencePath: Obtain the term sheet, updated cap table, and full preference schedule from counsel or finance.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: order-conversion
      missingEvidence: Signed call-off orders, pricing, acceptance criteria, and milestone timing under the Uniper framework.
      whyItMatters: A conditional framework can signal demand without proving revenue timing, margin, or bankability.
      diligencePath: Review the Uniper framework, signed schedules, and first deployment commercial terms.
      relatedQuestionRefs: [QV002]
