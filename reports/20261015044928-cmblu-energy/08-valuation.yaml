    title: Recommendation logic
    type: flow
    summary: >-
      Demand and product differentiation matter, but conditional commercialization
      and disclosure gaps keep the recommendation at research-more.
    data:
      nodes:
        - id: sector-demand
          label: Sector demand exists
          detail: Fluence reported a USD 5.6 billion backlog and a 147 GWh pipeline.
        - id: product-claim
          label: Product differentiation claim
          detail: CMBlu positions SolidFlow as non-lithium, non-flammable, and 10-plus-hour storage.
        - id: scale-plan
          label: Scale-up plan
          detail: Series C proceeds and the manufacturing roadmap target multi-GWh capacity.
        - id: commercial-proof
          label: Commercial proof remains conditional
          detail: The Uniper framework is long-dated but still conditional and tranche-based.
        - id: economics-friction
          label: Economics face friction
          detail: Germany's BESS connection and tariff reforms can pressure project returns.
        - id: valuation-mark
          label: Price is already high
          detail: Public sources place the latest round above the EUR 1 billion threshold.
        - id: recommendation
          label: Recommendation
          detail: Research more; wait for order conversion, economics, or better entry terms.
      edges:
        - from: sector-demand
          to: product-claim
        - from: product-claim
          to: scale-plan
        - from: scale-plan
          to: commercial-proof
        - from: commercial-proof
          to: valuation-mark
        - from: economics-friction
          to: valuation-mark
        - from: valuation-mark
          to: recommendation
    approximationNotes: >-
      The flow is qualitative; it explains the judgment path and does not imply
      weighted probabilities.
    claimRefs: [CV002, CV004, CV006, CV009, CV011, CV016]
