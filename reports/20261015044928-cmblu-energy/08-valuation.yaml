      judgments rather than management guidance.
    claimRefs: [CV002, CV007, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Lens, Argument, What would change the view]
    rows:
      - ["Thesis", "CMBlu claims a differentiated non-lithium 10-plus-hour platform with safety and supply-chain advantages.", "Independent field-performance or cost evidence validating the product claims would strengthen the premium case."]
      - ["Thesis", "Fresh capital and a stated multi-site manufacturing plan could create scarce long-duration capacity if deployments convert.", "Verified ramp output and repeat customer deployments would move this from narrative to proof."]
      - ["Anti-thesis", "The reviewed public record still lacks audited revenue, gross margin, cash burn, and liquidation-preference detail.", "A disclosed KPI package and cap-table waterfall would materially reduce underwriting uncertainty."]
      - ["Anti-thesis", "The best-public commercial signal is a conditional framework while sector history shows long-duration players can still fail commercially.", "Firm call-offs with pricing plus multi-customer references would reduce down-round risk."]
    notes: >-
      Thesis rows mix company-issued and independent sources and should be read
      as diligence priorities, not as stand-alone valuation proof.
    claimRefs: [CV004, CV005, CV008, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Uniper converts to priced orders, manufacturing ramps on schedule, and independent data validates lifetime and cost claims.", "The current private mark could work if CMBlu becomes a scarce long-duration platform before public multiple compression bites.", "Ramp delays and missing economics still cap conviction.", "Signed call-offs, customer references, and disclosed unit economics."]
      - ["Base", "Technology promise remains intact but order conversion and margins stay only partly disclosed.", "Current price is an option on scale-up rather than proof-backed fair value so new money needs milestone gating or downside protection.", "Commercial timing and preference-stack opacity.", "Mixed evidence: strong financing support but incomplete operating disclosure."]
      - ["Bear", "Conditional orders do not convert fast enough, German economics worsen, or commercialization slips while peers keep scaling.", "Down-round or flat-round risk rises because the story looks like technology optionality rather than de-risked infrastructure cash flow.", "Execution slippage and sector competition.", "Delayed 2027 readiness, no audited revenue disclosure, and weaker customer proof."]
    notes: >-
      Scenario language is directional because retained public evidence does not
      support a precise revenue forecast or exit-multiple model.
    claimRefs: [CV006, CV007, CV009, CV010, CV012, CV013, CV014, CV015]
