              covering 5 GWh over a multi-year horizon, but the same evidence still frames it as conditional framework
              demand rather than disclosed delivered revenue. That distinction matters because an independent profile
              explicitly identifies cross-continent manufacturing ramp as the central execution test after the unicorn
              round, making operational conversion—not just fundraising—the key diligence hinge for later chapters.
