        title: Leadership continuity, governance signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The strongest leadership change visible in the current evidence is March 2024, when Constantin Eis became
              CEO and founder Dr. Peter Geigle moved to the supervisory board, preserving founder continuity while
              shifting day-to-day execution to a scaling operator. Publicly named executives in the assigned pool also
              cover U.S. expansion, technology, finance, and go-to-market functions through Giovanni Damato, Dr.
              Nastaran Krawczyk, Olaf Althaus, and Markus Geigle. That is enough to show functional breadth, but not
              enough to fully underwrite governance quality because the assigned sources do not publish a full board
              roster or a detailed cap-table waterfall. The stakeholder map is therefore more concrete than the
              governance map: STRABAG is the clearest strategic capital backer from the 2023 investment, Samsung
              Ventures anchors the 2026 Series C signal, Uniper is the most important disclosed utility counterparty,
              and the WEC Energy Group/EPRI pilot remains one of the clearest named North American validation
