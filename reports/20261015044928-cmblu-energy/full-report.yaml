              - CU005
              - CU006
              - CU007
              - CU013
      - number: '6.3'
        title: Adoption trajectory is directional rather than denominated
        blocks:
          - type: paragraph
            body: >-
              CMBlu's adoption trajectory can be described qualitatively, but not yet with the usual SaaS- or
              project-finance-style denominators investors would want. The company and third-party summaries say new
              funding will support manufacturing scale-up and early commercial deployments in Europe and the U.S., which
              fits a business moving from validation into initial rollout. SourceRegister's Germany market analysis also
              supports why utility buyers matter: incumbent energy companies with legacy grid connections are the most
              active large-scale battery buyers, and interconnection access itself has become a scarce asset. The result
              is a plausible adoption story anchored on real projects, but one that still depends on external deployment
              bottlenecks and lacks a disclosed installed-base denominator.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU014
          - type: table
            tableRef: TU002
