              - CV007
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV011
              - CV016
      - number: '8.2'
        title: The upside case is real, but still company-led
        blocks:
          - type: paragraph
            body: >-
              CMBlu does have ingredients that can earn a premium if they translate into repeatable deployments. Its
              materials describe a non-lithium, non-flammable, 10-plus-hour architecture, and the company claims an
              unusually low lifecycle cost profile, long asset life, and a manufacturing footprint that starts with 1
              GWh in Alzenau and is intended to support more than 10 GWh globally by 2029. Independent market context is
              also directionally helpful: Fluence reported a multi-billion-dollar backlog and a 147 GWh pipeline,
              showing that storage demand is not hypothetical. Even so, the premium case is still driven more by company
              claims and market potential than by independently disclosed CMBlu unit economics or contracted revenue, so
              the upside belongs in a milestone-gated thesis, not in an underwritten today-case.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.3'
        title: Downside is execution, regulation, and commercialization slippage
        blocks:
          - type: paragraph
            body: >-
              The downside case is concrete rather than abstract. Germany's evolving battery-storage framework can add
              connection fees, deposits, and eventual network tariffs that alter project economics, while CMBlu's
              best-public commercial signal remains a conditional framework rather than disclosed priced orders. Sector
              history also argues against paying for inevitability: VoltStorage wound down before ESS acquired its IP,
              showing that technical differentiation alone does not guarantee durable commercialization. The practical
              diligence path is therefore straightforward: get management accounts, a cap-table waterfall, and
              signed-order conversion evidence before underwriting hold or exit cases. Thesis-break triggers are another
              year without revenue and margin disclosure, a slip in 2027 delivery readiness, or regulatory changes that
              erode project returns enough to make the unicorn mark look like a financing headline rather than a durable
              valuation floor.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
              - CV016
