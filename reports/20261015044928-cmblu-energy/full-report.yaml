      - number: '1.3'
        title: Financing, industrialization roadmap, and execution test
        blocks:
          - type: paragraph
            body: >-
              The funding narrative is strongest in two visible steps: STRABAG's 2023 growth investment and the €50
              million initial Series C close announced on 2026-04-30, which CMBlu linked to a valuation above €1 billion
              and to manufacturing scale-up plus early deployments in Europe and the United States. The
              industrialization roadmap is equally ambitious. Official and independent sources agree that Alzenau has
              operated since 2024 with 1 GWh current capacity and a 4 GWh site ceiling, while Greece is under
              construction and the U.S. plant remains planned for 2029 as part of a >10 GWh three-site footprint. The
