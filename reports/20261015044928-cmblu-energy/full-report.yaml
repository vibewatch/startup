              - CU013
              - CU014
      - number: '6.4'
        title: Durability, expansion economics, and concentration remain the main diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest weakness in the public customer record is not the absence of logos, but the absence of
              durability metrics. None of the retained public sources disclose customer count, net or gross retention,
              churn, renewal rates, contract length, or top-customer concentration. That makes it hard to separate a
              promising pilot-to-framework pipeline from a durable recurring customer base. It also leaves expansion
              economics under-specified: the data-center thesis appears strategically important, yet the retained pool
              does not identify a named hyperscale operator in production, and the Uniper framework agreement still
              lacks public call-off timing or binding volume detail. Until those gaps close, customer quality should be
              viewed as encouraging but not yet fully de-risked.
            claimRefs:
              - CU009
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a clear ranking: manufacturing scale-up, large-framework conversion, and capital
              intensity are the risks most capable of breaking the current investment case. CMBlu has fresh April 2026
              financing and a disclosed live German gigafactory, so this is not a zero-to-one science experiment. But
              the same record also shows a greater than EUR1 billion valuation, a flagship 5 GWh Uniper agreement that
              still needs visible call-off conversion, and a stated ambition to support more than 10 GWh by 2029. That
              combination means the market is already paying for commercial execution that is only partly proven in the
              public record. If site ramps slip, if anchor agreements remain framework headlines rather than delivered
              assets, or if project economics only work inside optimistic spread-and-cycle assumptions, residual
              downside remains high.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
