      - number: '3.2'
        title: Commercial proof points exist, but buyer switching still runs through validation
        blocks:
          - type: paragraph
            body: >
              The strongest non-company proof points in the pool are still validation-heavy: Argonne and Idaho National
              Laboratories are running a DOE-backed demonstration, and Utility Dive also reports a Salt River Project
              pilot, while CMBlu cites a 5 GWh Uniper framework and Energy-Storage.news says that agreement is
              conditional and starts deliveries in 2027 in at least 100 MWh batches. Together, those signals show a
              route into utility and large-load procurement, but they are not the same as broad installed-base evidence.
              Buyers can therefore compare CMBlu not only against rival chemistries but also against a phased adoption
              path: pilot first, qualify the technology, and defer fleet-scale commitment until reliability,
              integration, and supply execution are clearer.
            claimRefs:
              - CP003
