              - CR014
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The cleanest external adverse signal in the assigned pool is not a lawsuit or recall; it is policy
              volatility in the markets CMBlu wants to serve. IndexBox describes a German storage regime that was still
              changing in early 2026 across privileged-infrastructure treatment, grid-connection procedure, and grid-fee
              design. That matters because CMBlu's own commercial story is built around large utility and data-center
              deployments, where project timing and merchant economics are highly sensitive to interconnection rules and
              cost-allocation policy. The company also pitches a U.S. supply-chain advantage by saying SolidFlow avoids
              foreign-entity-of-concern exposure, but the same public record shows U.S. manufacturing is still
              future-dated. That leaves a meaningful legal-and-regulatory execution dependency: public positioning is
              already policy-linked, while the supporting localization footprint is still being built.
            claimRefs:
              - CR002
              - CR009
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR009
              - CR015
      - number: '7.3'
        title: Operating and monitoring triggers
        blocks:
          - type: paragraph
            body: >-
              The best way to monitor risk here is through observable milestones rather than broad technology
              narratives. Evidence of Greek production beginning in 2027, a U.S. plant remaining on track for 2029,
              disclosed commissioning of named projects such as the Mercedes-Benz site, and visible conversion
              milestones on the Uniper relationship would all reduce residual risk. By contrast, slippage on plant ramp,
              no updated operating proof from named deployments, or continuing reliance on company-authored economics
              and safety messaging would push the thesis toward "valuation ahead of proof." The company does have
              mitigants - fresh capital earmarked for scale-up, a disclosed live 1 GWh site, and named pilot/customer
              relationships - but investors still need independent operating data, framework conversion evidence, and
              tighter project-level economics before treating those mitigants as complete de-risking.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Top thesis-break triggers
            body: >-
              The risk case worsens quickly if Greece slips beyond 2027, the U.S. plant remains only a planning story
              into 2028, or the Uniper agreement stays publicized as framework scale without visible call-off orders or
              commissioning milestones. In that scenario, the April 2026 unicorn valuation would be resting further
              ahead of de-risked commercial proof than the current public record supports.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR014
          - type: callout
            title: Real mitigants exist, but they are incomplete
            body: >-
              CMBlu can point to a live 1 GWh Alzenau site, fresh Series C capital, and named counterparties rather than
              just lab claims. Those facts reduce basic existence risk, but they do not eliminate the harder questions
              around multi-site ramp, partner conversion, and whether marketed project economics hold outside a
              favorable spread-and-cycles scenario.
            calloutType: insight
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price has moved ahead of disclosed proof
        blocks:
          - type: paragraph
            body: >-
              The clearest current valuation fact is that CMBlu announced a EUR 50 million initial close of its Series C
              and said the round crossed the EUR 1 billion threshold, a mark repeated by independent trade coverage.
              That is meaningful financing support, but the strongest public commercial proof cited alongside it is
              still a conditional Uniper framework that runs through 2037 and begins with option-style tranches from
              2027 rather than a disclosed firm backlog with pricing and margin conversion. The retained source set
              reviewed for this chapter also does not disclose audited revenue, gross margin, cash burn, runway, or the
              preference stack behind the latest round, so public evidence can justify interest in the company but not a
              conviction buy at the announced unicorn price. That combination supports a stretched valuation stance and
              a research-more recommendation until either the entry price resets or proof catches up.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
