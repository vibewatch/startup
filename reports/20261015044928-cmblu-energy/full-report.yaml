      - number: '3.3'
        title: Differentiation is credible, but moat durability remains execution-led
        blocks:
          - type: paragraph
            body: >
              CMBlu's differentiation thesis is coherent: company and third-party coverage repeatedly emphasize
              non-flammable, water-based materials, avoidance of FEOC-linked supply chains, and long-duration use cases
              where flow batteries may outperform lithium-ion economics. Funding scale also gives CMBlu more strategic
              room than an early-seed entrant. Even so, the assigned evidence does not provide standardized list
              pricing, realized contract economics, or a broad set of named live customer deployments. Utility Dive
              quotes management saying integration and manufacturing scale-up with high-quality standards are the next
              major challenge, and that matters because incumbent chemistries and large utility buyers can wait for
              proof rather than switch on thesis alone. The moat today is therefore best described as promising but
              still conditional on execution, bankability, and repeat deployments.
            claimRefs:
              - CP005
              - CP006
              - CP012
              - CP013
              - CP014
              - CP015
