      - number: '4.3'
        title: Capital adequacy, financing dependency, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The external evidence supports the view that CMBlu has attracted serious capital and strategic backing,
              but not that its capital adequacy is underwritten. Mercom reports a €100 million STRABAG equity investment
              in 2023, and multiple 2026 sources corroborate a €50 million initial Series C close at a valuation above
              €1 billion. At the same time, ESS News says the financing round remained open and management was still in
              contact with additional investors, while the manufacturing roadmap and Uniper timing suggest the main
              revenue ramp sits ahead of the current financing event. The result is a company with credible demand
              signals and a plausible path to commercialization, but public evidence still lacks the core underwriting
              inputs: audited or management-account revenue, realized ASPs and discounting, gross margin, service costs,
              customer concentration, cash on hand, debt or project-finance obligations, and monthly burn. The financial
              verdict is therefore directionally positive on strategic relevance but incomplete on revenue quality,
              margin path, and runway.
            claimRefs:
              - CI001
              - CI007
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Best public proof is still scenario economics
            body: >-
              The strongest customer-economics evidence is a company-published grid example with spread, cycles, annual
              revenue, and payback assumptions; it is useful for framing value capture but it is not the same as
              disclosed realized pricing, gross margin, or booked revenue.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: callout
            title: Capital needs arrive before revenue quality is visible
            body: >-
              The company is scaling from a live 1 GWh site toward a multi-site footprint while independent reporting
              says the latest financing round remains open and major framework deliveries start in 2027, leaving
              financing dependency as a core underwriting risk.
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI011
          - type: callout
            title: Financial diligence must start with management accounts
            body: >-
              A credible next step is to request monthly management accounts, plant-level capex plans, gross-margin
              detail, and the full Uniper framework so investors can separate technical promise from financeable revenue
              and runway.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and target workflows
        blocks:
          - type: paragraph
            body: >-
              CMBlu is not selling a short-duration peak-shaving battery or a general software platform; it is
              positioning SolidFlow as long-duration storage for buyers that need multi-hour energy shifting and
              dispatchability. Company materials describe the system as non-lithium storage engineered for ten hours or
              more, aimed at turning intermittent renewable generation into schedulable power and supporting data-center
              or industrial loads that must run through the night. Independent coverage is directionally consistent:
              Energy-Storage.news describes CMBlu as targeting the 8-10 hour range for hyperscaler demand, while
              Datacenter Knowledge shows why that pitch matters operationally by noting that conventional BESS
              deployments in data centers are often designed for only two to four hours of discharge. The result is a
              clear workflow fit—renewable firming, congestion management, and diesel displacement for critical
              loads—but still mostly at the stage of design wins, frameworks, and first commercial projects rather than
              a broad installed base of proven operating assets.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE012
