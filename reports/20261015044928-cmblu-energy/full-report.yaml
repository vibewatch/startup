  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public monetization evidence
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a project-led hardware revenue model rather than a disclosed recurring
              software or services base. CMBlu and its company-issued listing position SolidFlow systems for utilities,
              data centers, and large commercial applications, while the grid-utilities page frames value in project
              terms such as storing excess renewable power, discharging into peak periods, and reducing curtailment or
              grid upgrade needs. Public monetization evidence remains mostly scenario-based: the company markets a 100
              MW / 1,000 MWh system as capable of up to €20 million annual revenue with a 5-8 year payback at a
              €40–80/MWh spread and roughly 250 cycles per year, but that is an illustrative economics case rather than
              disclosed realized pricing or recognized revenue. The clearest commercial signal is the Uniper framework,
              yet independent coverage makes clear it is conditional and starts with batch deliveries from 2027, so the
              current public record supports pipeline quality more than near-term booked revenue quality.
            claimRefs:
              - CI001
