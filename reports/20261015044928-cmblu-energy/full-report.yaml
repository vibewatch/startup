chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and current scale
        blocks:
          - type: paragraph
            body: >-
              CMBlu traces its roots to organic flow-battery research that began in 2011 and was formalized into a
              company in 2014 in Alzenau, Germany. Current sources place the headquarters and operational center in
              Alzenau while also describing activity in Greece and the United States, which matters because later
              manufacturing and deployment claims rely on this three-country footprint rather than a single-site lab
              operation. The product narrative is consistent across company and independent sources: SolidFlow is
              positioned as a non-lithium, long-duration storage architecture using water-based materials for 10+ hour
              applications. The business model described in the assigned pool centers on selling long-duration storage
              into grid, utility, industrial, and data-center use cases that need renewable energy shifting over
              multi-hour windows rather than short-duration lithium-ion peaking. Scale claims are meaningful but still
              mostly operational rather than financial: the company says it has more than 250 employees, including over
              150 scientists and engineers, yet the source pack does not provide audited revenue, customer count, or
              cash-burn disclosures that would independently validate commercial maturity.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
