      - CP003
      - CP005
      - CP006
      - CP008
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a bridge from targeted customer applications to scenario economics and then back to the
      capital needed to scale manufacturing before broad deliveries begin.
    data:
      nodes:
        - id: target-markets
          label: Target markets
          detail: >-
            Utilities, data centers, and large commercial users are the public buyer classes named across company-issued
            materials.
        - id: storage-asset
          label: Storage asset
          detail: SolidFlow is marketed as 10+ hour, multi-hour dispatchable storage for grid and critical-load applications.
        - id: operating-use
          label: Operating use
          detail: >-
            The published use case is to store oversupplied renewable energy, discharge during peak demand, and reduce
            curtailment or grid expansion needs.
        - id: monetization
          label: Monetization example
          detail: >-
            The grid example cites up to €20M annual revenue on a 100 MW / 1,000 MWh system at €40–80/MWh spreads and
            about 250 cycles per year.
        - id: project-return
          label: Project return
          detail: >-
            The same example cites a 5-8 year payback, so customer economics depend on site-specific spreads and
            utilization.
        - id: scale-funding
          label: Scale funding loop
          detail: >-
            Series C proceeds are earmarked for manufacturing scale-up and early deployments while independent coverage
            says deliveries under the Uniper framework start in 2027.
      edges:
        - from: target-markets
          to: storage-asset
          label: buyer demand
        - from: storage-asset
          to: operating-use
          label: asset used for
        - from: operating-use
          to: monetization
          label: drives
        - from: monetization
          to: project-return
          label: supports
        - from: project-return
          to: scale-funding
          label: must justify
    approximationNotes: The revenue and payback nodes are company scenarios, not realized portfolio averages.
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      CMBlu's public architecture links customer workflows, hybrid chemistry, and manufacturing scale-up into a single
      operating stack.
    data:
      layers:
        - label: Customer workflows
          detail: Grid firming, renewable shifting, and data-center continuity are the public demand anchors.
          modules:
            - Grid and utility renewable firming
            - Overnight power shifting
            - Diesel-reduction backup for critical loads
        - label: System outcome
          detail: The company positions the platform for 8-10+ hour dispatchable storage rather than short-duration buffering.
          outputs:
            - 10+ hour dispatchable energy
            - Peak and overnight delivery
            - Lower reliance on critical-mineral supply chains
        - label: Core architecture
          detail: Public descriptions combine flow-battery layout with proprietary solid storage media.
          modules:
            - Water-based electrolytes
            - Stationary solid storage materials
            - Separate scaling of power and energy capacity
        - label: Safety and permitting thesis
          detail: Safety claims are central to the pitch but remain mostly company-described in the assigned pool.
          outputs:
            - Non-flammable system
            - No thermal runaway claim
            - Streamlined permitting pathway claim
        - label: Manufacturing system
          detail: Scale-up depends on automotive-style production rather than lithium clean-room processes.
          modules:
            - Live Alzenau site
            - Greece expansion under construction
            - Planned U.S. plant
        - label: Execution dependencies
          detail: Commercial proof still depends on project delivery, grid access, and quality-system evidence.
          outputs:
            - End-2027 Arizona first commercial-scale project target
            - German interconnection bottlenecks
            - Need external quality and reliability proof
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE014
      - CE016
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public proof still follows a utility-led path from pain point to pilot, then toward framework expansion.
    data:
      nodes:
        - label: Grid pain recognized
          actor: Utilities and grid operators
          phase: Problem definition
          touchpoints:
            - Curtailment, price volatility, and congestion make 10+ hour storage economically relevant.
        - label: Technical evaluation
          actor: Utilities, industrial operators, and data-center energy teams
          phase: Solution screening
          touchpoints:
            - CMBlu positions safety, duration, and scalable power-versus-energy sizing as the core buying hooks.
        - label: German utility reference pilot
          actor: Uniper
          phase: Pilot
          touchpoints:
            - BR24 reported an initial 1 MW / 1 MWh test with 36 battery units at Staudinger.
        - label: Framework-based expansion signal
          actor: Uniper
          phase: Expansion option
          touchpoints:
            - CMBlu says it secured a 5 GWh framework agreement beginning in 2027.
        - label: U.S. utility proof point
          actor: Salt River Project
          phase: New geography pilot
          touchpoints:
            - ABC15 described a Copper Crossing pilot sized to serve about 1,125 homes for 10 hours.
        - label: Conversion risk for larger segments
          actor: Hyperscale data centers and industrial buyers
          phase: Scale-up hurdle
          touchpoints:
            - Named production operators, retention metrics, and concentration data remain undisclosed.
    approximationNotes: null
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual risk sits in manufacturing ramp, framework conversion, and capital intensity rather than basic
      technology existence.
    data:
      columns:
        - label: Likelihood
          detail: 1 is low and 5 is high.
        - label: Impact
          detail: 1 is low and 5 is high.
        - label: Mitigation maturity
          detail: 1 is nascent and 5 is proven.
        - label: Residual exposure
          detail: 1 is low and 5 is high after current mitigants.
      rows:
        - label: Manufacturing scale-up and capex
          note: Live capacity exists, but most disclosed network growth still sits ahead.
          values:
            - label: 4/5
              note: Multi-site ramp remains future-dated outside Alzenau.
            - label: 5/5
              note: A delayed ramp would directly hit delivery credibility and financing needs.
            - label: 3/5
              note: Fresh capital and a live site help, but future plants are not yet operating.
            - label: 4/5
              note: Residual exposure stays high until commissioning and yield data become public.
        - label: Uniper framework conversion
          note: The headline volume is large relative to current public delivery detail.
          values:
            - label: 4/5
              note: The public record still lacks call-off cadence and delivered-volume proof.
            - label: 5/5
              note: Visible slippage would weaken the clearest commercial proof point.
            - label: 3/5
              note: Manufacturing build-out is a real mitigant, but not proof of order conversion.
            - label: 4/5
              note: Risk remains elevated until schedule and shipment data are visible.
        - label: Germany and EU market-design volatility
          note: Grid-connection, storage status, and fee rules were still moving in 2026 reporting.
          values:
            - label: 3/5
              note: Policy changes are external and already observable in the market.
            - label: 4/5
              note: Interconnection and fee rules can delay or impair storage project economics.
            - label: 2/5
              note: Geographic diversification helps but does not remove domestic policy exposure.
            - label: 4/5
              note: Residual exposure remains meaningful for utility-scale deployments.
        - label: Independent field-validation gap
          note: Company safety and economics claims are stronger than the independent operating evidence in the pool.
          values:
            - label: 3/5
              note: The gap narrows if named projects publish data, but that proof is still sparse here.
            - label: 4/5
              note: Validation weakness can slow bankability, insurance, and customer adoption.
            - label: 2/5
              note: Named pilots and customer projects provide a path, but not full independent proof yet.
            - label: 4/5
              note: Residual exposure stays high until operating, warranty, and certification data are public.
        - label: Merchant-economics downside
          note: Public economics are marketed from one assumption set rather than a disclosed portfolio of realized returns.
          values:
            - label: 3/5
              note: Spread and utilization volatility are common in storage markets.
            - label: 4/5
              note: Underperformance would weaken customer ROI and project-finance appetite.
            - label: 2/5
              note: The company discloses the assumption set, but not independent realized outcomes.
            - label: 4/5
              note: Residual exposure remains high until operating assets publish realized economics.
        - label: Commercial-reference concentration
          note: Public proof is clustered around a few named projects rather than a wide reference fleet.
          values:
            - label: 3/5
              note: Named projects exist, but public fleet breadth is still limited in this pool.
            - label: 4/5
              note: A small proof base magnifies the impact of any single project delay.
            - label: 3/5
              note: Each successful commissioning can improve the reference base materially.
            - label: 3/5
              note: Residual exposure is moderate-high until a broader operating fleet is visible.
    approximationNotes: Ordinal scores synthesize cited evidence into relative ranking; they are not probabilistic forecasts.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR009
      - CR012
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Demand and product differentiation matter, but conditional commercialization and disclosure gaps keep the
      recommendation at research-more.
    data:
      nodes:
        - id: sector-demand
          label: Sector demand exists
          detail: Fluence reported a USD 5.6 billion backlog and a 147 GWh pipeline.
        - id: product-claim
          label: Product differentiation claim
          detail: CMBlu positions SolidFlow as non-lithium, non-flammable, and 10-plus-hour storage.
        - id: scale-plan
          label: Scale-up plan
          detail: Series C proceeds and the manufacturing roadmap target multi-GWh capacity.
        - id: commercial-proof
          label: Commercial proof remains conditional
          detail: The Uniper framework is long-dated but still conditional and tranche-based.
        - id: economics-friction
          label: Economics face friction
          detail: Germany's BESS connection and tariff reforms can pressure project returns.
        - id: valuation-mark
          label: Price is already high
          detail: Public sources place the latest round above the EUR 1 billion threshold.
        - id: recommendation
          label: Recommendation
          detail: Research more; wait for order conversion, economics, or better entry terms.
      edges:
        - from: sector-demand
          to: product-claim
        - from: product-claim
          to: scale-plan
        - from: scale-plan
          to: commercial-proof
        - from: commercial-proof
          to: valuation-mark
        - from: economics-friction
          to: valuation-mark
        - from: valuation-mark
          to: recommendation
    approximationNotes: The flow is qualitative; it explains the judgment path and does not imply weighted probabilities.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV009
      - CV011
      - CV016
