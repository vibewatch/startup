      - number: '6.2'
        title: Named customer proof exists, but most public references are still pilot-or-framework stage
        blocks:
          - type: paragraph
            body: >-
              Publicly named customer evidence is strongest where a concrete utility counterparty is visible. CMBlu says
              it secured a 5 GWh framework agreement from Uniper, and trade coverage repeats that agreement as a major
              commercial milestone beginning in 2027. At the same time, BR24's August 2025 reporting shows the German
              utility proof point was still being tested at Staudinger, with an initial 1 MW / 1 MWh installation and 36
              battery units. The U.S. reference is even earlier-stage: ABC15 describes the Salt River Project
              collaboration in Arizona as a pilot project. That means the company can show credible named references
              across Europe and the U.S., but the public record still stops short of a broad list of operating
              production deployments with measured customer outcomes.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU013
          - type: table
            tableRef: TU003
