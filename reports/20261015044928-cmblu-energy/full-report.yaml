  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained evidence defines CMBlu's market boundary much more narrowly than "battery storage." Company
              and third-party materials consistently place SolidFlow in long-duration applications that need 10+ hours,
              multi-hour to multi-day shifting, and dispatchable overnight power rather than short ancillary-service
              balancing. The strongest use cases are grid utilities, renewable-firming sites, and critical-load
              infrastructure such as data centers. That means the practical substitutes are four-hour lithium-ion
              systems, curtailment, grid expansion, and fossil backup, not consumer batteries or generic stationary
              storage. This boundary matters because it narrows the relevant demand pool while keeping the economic
              problem definition tied to reliability, congestion, and value capture.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM011
              - CM013
              - CM016
      - number: '2.2'
        title: Sizing lenses and demand anchors
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a lens-based sizing approach rather than a clean TAM/SAM/SOM stack. At the
              broadest level, IEA-reported data shows the global battery market still growing rapidly, with
              utility-scale deployments doing most of the work. Narrower lenses come from CMBlu's own disclosed demand
              anchors: a 5 GWh Uniper framework and the Arizona SRP pilot. Those anchors show that the company is
              pursuing large, infrastructure-style projects, but they are not the same as contracted recurring revenue
              or a discrete market share model. The result is enough evidence to show meaningful demand direction, but
              not enough to claim a source-backed non-lithium LDES market capture range.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer evidence is utility-led. SRP's announcement shows a utility procurement path that
              starts with an RFP, proceeds through a pilot, and adds third-party performance monitoring before scaled
              adoption. CMBlu's own grid-utilities page frames the core economic sale around curtailment reduction,
              arbitrage, and congestion relief, which fits utility planners and asset operators more clearly than a
              mass-market power product. Data centers appear in the company narrative as a high-value critical-load
              segment, but the retained evidence does not disclose who owns the budget or whether the purchase would sit
              with the customer, the utility, or a project developer. That makes adoption-path evidence stronger than
              payer visibility.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: Adoption constraints and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The main constraint is not whether long-duration storage is interesting; it is whether CMBlu can move from
              credible pilots and frameworks into repeatable commercial deployments fast enough to justify premium
              valuation expectations. Market-wide growth does not isolate the 10+ hour segment: the 108 GW of additions
              reported for 2025 spans battery durations and chemistries, so it cannot establish CMBlu's addressable
              share. Meanwhile, some of the strongest upside claims on capital efficiency and manufacturing scale remain
              company-issued, and ExoMatter's case study implies the chemistry and materials workflow is still an active
              optimization problem. The market case is therefore plausible but still under-specified on discrete segment
              size, procurement ownership, and conversion from announced frameworks to operating fleets.
            claimRefs:
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Where the demand signal is strongest
            body: >-
              The strongest non-company demand evidence is utility-led: SRP's RFP-based pilot and IEA's shift toward
              utility-scale energy shifting show why longer duration matters. By contrast, the data-center opportunity
              is strategically important but still disclosed mainly through company framing rather than independent
              buyer-budget evidence.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM016
          - type: callout
            title: What still needs proof for a full market-underwrite
            body: >-
              A stronger market case would require independent TAM/SAM work, disclosed budget ownership, and evidence
              that frameworks such as Uniper convert into firm call-offs or repeat deployments. Without that, the market
              opportunity is directionally credible but still too under-specified for hard share or revenue capture
              assumptions.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: chemistry classes, incumbents, and the status quo'
        blocks:
          - type: paragraph
            body: >
              The assigned evidence frames CMBlu's battlefield as a solution-class competition rather than a clean list
              of one-for-one organic-flow peers. CMBlu's own materials pitch SolidFlow for 10+ hour renewable shifting,
              utility resilience, and data-center backup windows, while Utility Dive places its initial
              commercialization focus in the five-to-10-hour range. That means the real comparison set includes
              lithium-ion systems that remain the default storage baseline, metal-based flow batteries that address
              similar long-duration jobs, and the operational status quo of absorbing curtailment, congestion, and
              peak-price exposure rather than buying new storage. In that framing, CMBlu is trying to sell a
              longer-duration architecture for buyers who need multi-hour dispatch and who view chemistry choice, fire
              risk, and permitting friction as procurement variables rather than as purely technical details.
