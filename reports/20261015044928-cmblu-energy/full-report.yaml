      The broad battery market is large and growing, but the retained evidence narrows from sector growth into a small
      set of company-specific utility and critical-load anchors rather than a closed TAM/SAM/SOM stack.
    data:
      items:
        - label: Global battery additions
          displayValue: 108 GW in 2025
          detail: Broadest market-growth lens across all battery segments.
          note: IEA data reported by ESS News; not specific to long-duration or non-lithium storage.
          claimRefs:
            - CM008
        - label: Utility-scale additions
          displayValue: 87 GW in 2025
          detail: Utility-scale share of the 2025 battery-additions market.
          note: Narrower than total additions, but still chemistry-agnostic.
          claimRefs:
            - CM008
        - label: Co-located renewables slice
          displayValue: 24 GW in 2025
          detail: Utility-scale additions paired with renewables.
          note: Indicates firming demand, not CMBlu's directly addressable share.
          claimRefs:
            - CM008
        - label: Uniper framework anchor
          displayValue: 5 GWh
          detail: Company-cited framework agreement with Uniper.
          note: Anchor is a framework, not disclosed revenue backlog or installed fleet.
          claimRefs:
            - CM006
        - label: Critical-load equivalence
          displayValue: 1 GW for 5h / 500 MW for 10h
          detail: Company's published equivalence for the Uniper framework.
          note: Published as application framing, not an independent TAM calculation.
          claimRefs:
            - CM007
        - label: SRP pilot anchor
          displayValue: 5 MW / 10 hours
          detail: Arizona pilot designed for 10-hour operation and targeted for 2027.
          note: Pilot-scale proof point rather than repeat-deployment evidence.
          claimRefs:
            - CM004
            - CM005
    approximationNotes: >-
      Layers intentionally combine broad market, framework, and pilot values as directional demand lenses; they are not
      mathematically nested TAM/SAM/SOM conversions or unit-normalized market shares.
    claimRefs:
      - CM001
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring highlights that CMBlu's strongest public edge is deployment-oriented differentiation for
      multi-hour use cases, while buyers can still slow switching through validation and deferral paths.
    data:
      xAxis:
        label: Fit for CMBlu's target 5-10+ hour use case (1=low, 5=high)
        min: 1
        max: 5
        low: Low fit
        high: High fit
        scale: ordinal
        description: Ordinal synthesis from assigned public evidence; not a benchmark test.
      yAxis:
        label: Deployment resilience from safety, supply, and validation signals (1=weaker, 5=stronger)
        min: 1
        max: 5
        low: Weaker
        high: Stronger
        scale: ordinal
        description: >-
          Higher scores reflect the cited evidence on non-flammability, supply-chain positioning, and validation
          pathways.
      points:
        - label: CMBlu SolidFlow
          x: 5
          'y': 5
          note: >-
            Scores highest because the assigned evidence centers on 10+ hour positioning, non-flammability, and
            FEOC-safe supply chains.
          claimRefs:
            - CP001
            - CP005
            - CP006
            - CP015
        - label: Metal-based flow batteries
          x: 4
          'y': 3
          note: >-
            The pool treats this as the closest chemistry class for the same long-duration job, but it does not assign
            vendor-specific scale or deployment proof.
          claimRefs:
            - CP004
            - CP012
        - label: Lithium-ion BESS
          x: 2
          'y': 2
          note: >-
            The evidence treats lithium-ion as the incumbent baseline but frames it as weaker for fire-risk optics and
            some long-duration economics.
          claimRefs:
            - CP005
            - CP012
        - label: Grid expansion / curtailment status quo
          x: 1
          'y': 3
          note: >-
            This path avoids new-vendor adoption risk, but it does not capture the multi-hour shifting value that the
            company models.
          claimRefs:
            - CP011
        - label: Pilot-first qualification path
          x: 3
          'y': 4
          note: Pilots and national-lab validation improve confidence but delay broad conversion into repeat contracts.
          claimRefs:
            - CP003
            - CP013
        - label: Large-utility framework path
          x: 4
          'y': 4
          note: >-
            Framework-style procurement can scale once validated, but the key disclosed example remains conditional
            rather than fully delivered.
          claimRefs:
            - CP007
            - CP008
    approximationNotes: >-
      The map uses ordinal scores derived from the assigned evidence because the pool does not provide source-backed
      numeric benchmark axes for all alternatives.
    claimRefs:
