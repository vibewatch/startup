      - number: '4.2'
        title: Cost structure, capacity build-out, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              CMBlu's own materials describe a manufacturing model that is simpler than lithium-ion and avoids clean
              rooms, but they still imply meaningful upfront capital needs. The manufacturing page claims approximately
              $15 million of capex per GWh for SolidFlow versus roughly $100 million per GWh for lithium-ion, while also
              stating that the Alzenau site is live with 1 GWh current capacity, Greece is under construction for 2027,
              the U.S. plant is planned for 2029, and the network is intended to support more than 10 GWh by 2029. That
              supports a view that CMBlu may be structurally less capex-heavy than incumbent battery manufacturing, but
              it does not make the business asset-light; scaling to multi-GWh output still requires facilities, working
              capital, and commercialization execution ahead of public gross-margin disclosure. The more than 250
              employees disclosed in April 2026 also point to a substantial fixed-cost base that investors cannot
              currently reconcile to burn or runway from public evidence alone.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI010
              - CI012
          - type: table
            tableRef: TI003
