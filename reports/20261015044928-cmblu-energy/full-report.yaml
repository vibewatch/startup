      - number: '5.3'
        title: Maturity, controls, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests CMBlu has advanced beyond pure laboratory work but has not yet provided the level
              of independent operating proof that would fully de-risk a multi-GWh scale-up story. The company cites a 5
              GWh Uniper framework and independent reporting points to a first commercial-scale 5 MW / 50 MWh Arizona
              project expected at the end of 2027, which is more credible than a pre-revenue concept slide but still
              leaves a gap between roadmap and long-term fleet performance. Internal execution signals also deserve
              attention: a kununu snapshot shows middling employee sentiment and explicit complaints about communication
              and turnover, which matters because process discipline and cross-functional coordination become more
              important as the company moves from chemistry R&D into manufacturing and field delivery. Separately, the
              assigned evidence pool does not provide public safety certifications, cybersecurity controls, or detailed
              quality-system evidence, so those areas remain diligence asks rather than underwritten strengths.
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are clearest in utilities, with data-center demand still mostly a target segment
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to utilities and grid operators as CMBlu's clearest current buyer category.
              The company's grid-and-utilities page is explicit that the product is positioned to make renewable energy
              dispatchable with 10+ hour storage, while LeadIQ broadens the stated addressable customer set to
              utilities, grid operators, and commercial and industrial users. In 2026, CMBlu also sharpened its message
              toward hyperscale data centers: the April financing announcement ties commercial validation to utilities
              and data centers, and the CERAWeek session title frames the company around hyperscale demand and grid
              load. That mix shows a widening go-to-market narrative, but named proof remains concentrated in utility
              use cases rather than in disclosed data-center or industrial operators.
            claimRefs:
