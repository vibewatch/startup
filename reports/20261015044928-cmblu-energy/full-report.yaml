      - number: '5.2'
        title: Architecture and manufacturing model
        blocks:
          - type: paragraph
            body: >-
              The technical differentiation CMBlu repeats across company and independent sources is consistent enough to
              treat as the core architecture hypothesis: SolidFlow combines water-based electrolytes with proprietary
              solid energy storage materials, so the company can claim higher energy density than a conventional aqueous
              flow design while keeping the benefits of decoupled power and energy sizing. Public materials also frame
              the system as safer and easier to permit than lithium-ion because it is non-flammable and avoids thermal
              runaway, while manufacturing is described as closer to automotive production than clean-room cell
              manufacturing. On the hardware side, the company now presents Alzenau as a live 1 GWh
              commercialization-ready site, with Greece under construction and a U.S. plant still in planning. That
              footprint is meaningful because it links chemistry, module assembly, and scale-up into one integrated
              operating model, but most of the cost and throughput claims still come from the company rather than an
              external benchmark or certification dossier.
            claimRefs:
