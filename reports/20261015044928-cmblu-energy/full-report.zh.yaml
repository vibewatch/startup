  - id: TV002
    title: 正论 / 反论表
    columns:
      - 视角
      - 论点
      - 哪些变化会改变判断
    rows:
      - - Thesis
        - CMBlu 声称其拥有差异化的非锂、10 小时以上平台，并具备安全与供应链优势。
        - 能验证产品主张的独立现场性能或成本证据，将强化溢价逻辑。
      - - Thesis
        - 新增资本和已公布的多地制造计划若能转化为部署，可能打造稀缺的长时产能。
        - 经核实的爬坡产量和客户重复部署，会把叙事推进为证据。
      - - Anti-thesis
        - 经审阅的公开记录仍缺少经审计收入、毛利率、现金消耗和清算优先权细节。
        - 披露 KPI 组合和资本结构瀑布表，将显著降低投资判断的不确定性。
      - - Anti-thesis
        - 最好的公开商业信号仍是有条件的框架协议，而行业历史表明长时储能企业仍可能商业化失败。
        - 有定价的确定提货，加上多个客户参考案例，将降低下轮融资风险。
    notes: 正论行混合了公司发布和独立来源，应理解为尽调重点，而非独立的估值证明。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Uniper 转化为有定价订单，制造按计划爬坡，且独立数据验证寿命和成本主张。
        - 如果 CMBlu 在公开市场倍数压缩生效前成为稀缺的长时平台，当前私募估值可能成立。
        - 爬坡延迟和经济性缺失仍会限制信心。
        - 已签署的提货、客户参考案例和披露的单位经济性。
      - - 基准
        - 技术承诺仍然成立，但订单转化和利润率仍只部分披露。
        - 当前价格是押注扩张的期权，而非有证据支撑的公允价值，因此新增资金需要里程碑闸门或下行保护。
        - 商业化时点和优先权层级不透明。
        - 证据参差：融资支持强劲，但运营披露不完整。
      - - 悲观
        - 有条件订单转化不够快，德国经济性恶化，或同行持续扩张时商业化进度落后。
        - 下轮融资或平轮风险上升，因为这个故事看起来更像技术期权，而非已去风险的基础设施现金流。
        - 执行延误和行业竞争。
        - 2027 年准备工作延迟、没有经审计收入披露，且客户证明更弱。
    notes: 情景表述是方向性的，因为留存的公开证据不足以支持精确收入预测或退出倍数模型。
    claimRefs:
