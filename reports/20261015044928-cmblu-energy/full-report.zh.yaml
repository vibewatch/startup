      - number: '3.3'
        title: 差异化可信，但护城河持久性仍取决于执行
        blocks:
          - type: paragraph
            body: >
              CMBlu 的差异化逻辑一致：公司和第三方报道反复强调不可燃、水基材料、避开 FEOC
              相关供应链，以及液流电池可能在长时场景中优于锂电经济性的应用。融资规模也给它比早期种子公司更大的战略空间。但资料没有提供标准价目、实际合同经济性或大量具名的在运营客户部署。Utility Dive
              引述管理层称，集成和高质量标准下的制造扩产是下一项重大挑战；由于传统化学体系和大型公用事业买方可以等待证据，未必会仅凭叙事切换。当前护城河可描述为有前景，但仍取决于执行、可融资性和重复部署。
            claimRefs:
