          detail: 1 为低，5 为高。
        - label: 影响
          detail: 1 为低，5 为高。
        - label: 缓释成熟度
          detail: 1 为起步阶段，5 为已验证。
        - label: 剩余暴露
          detail: 在现有缓释措施之后，1 为低，5 为高。
      rows:
        - label: 制造扩张与资本开支
          note: 已有在运营产能，但已披露的大部分网络扩张仍在未来。
          values:
            - label: 4/5
              note: Alzenau 以外的多地点爬坡仍在未来。
            - label: 5/5
              note: 爬坡延迟会直接打击交付可信度并增加融资需求。
            - label: 3/5
              note: 新资本和在运营工厂有所帮助，但未来工厂尚未投产。
            - label: 4/5
              note: 在投产和良率数据公开前，剩余暴露仍处于高位。
        - label: Uniper 框架协议转化
          note: 相比当前公开的交付细节，标题所示规模很大。
          values:
            - label: 4/5
              note: 公开记录仍缺少按订单提货节奏和已交付量证明。
            - label: 5/5
              note: 可见的进度落后会削弱最清晰的商业验证点。
            - label: 3/5
              note: 制造建设是真正的缓释因素，但不能证明订单已经转化。
            - label: 4/5
              note: 在进度和发货数据可见前，风险仍然偏高。
        - label: 德国及欧盟市场设计波动
          note: 2026 年报道中，并网、储能地位和收费规则仍在变化。
          values:
            - label: 3/5
              note: 政策变化属于外部因素，且市场已经能够观察到。
            - label: 4/5
              note: 并网和收费规则可能延迟储能项目，或损害其经济性。
            - label: 2/5
              note: 地域多元化有所帮助，但无法消除国内政策暴露。
            - label: 4/5
              note: 对公用事业级部署而言，剩余暴露仍然明显。
        - label: 独立现场验证缺口
          note: 资料中，公司的安全和经济性主张强于独立运营证据。
          values:
            - label: 3/5
              note: 如果具名项目公布数据，缺口会缩小，但目前这类证明仍很少。
            - label: 4/5
              note: 验证不足会拖慢可融资性、保险承保和客户采用。
            - label: 2/5
              note: 具名试点和客户项目提供了路径，但尚未形成完整的独立证明。
            - label: 4/5
              note: 在运营、质保和认证数据公开前，剩余暴露仍处于高位。
        - label: 商业化经济性下行
          note: 公开经济性基于一组假设进行宣传，而非一套已实现回报的披露组合。
          values:
            - label: 3/5
              note: 价差和利用率波动在储能市场很常见。
            - label: 4/5
              note: 表现不及预期会削弱客户 ROI 和项目融资意愿。
            - label: 2/5
              note: 公司披露了假设，但没有披露独立的已实现结果。
            - label: 4/5
              note: 在运营资产公布实际经济性前，剩余暴露仍处于高位。
        - label: 商业参考项目集中
          note: 公开证明集中在少数具名项目，而不是广泛的参考机队。
          values:
            - label: 3/5
              note: 具名项目确实存在，但现有资料中的公开机队广度仍有限。
            - label: 4/5
              note: 证明基础较小，会放大任何单个项目延期的影响。
            - label: 3/5
              note: 每个成功投产的项目都能显著扩大参考基础。
            - label: 3/5
              note: 在更广泛的运营机队可见前，剩余暴露为中高水平。
