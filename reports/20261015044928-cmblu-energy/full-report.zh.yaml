              批次交付。这些信号说明它能进入公用事业和大负载采购，但不等于广泛安装基础。买方因此不仅要比较不同化学体系，还会按阶段采用：先试点，再验证技术，待可靠性、集成和供应执行更清晰后才做车队级承诺。
