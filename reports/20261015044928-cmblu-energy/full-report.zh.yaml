  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              留存证据将 CMBlu 的市场边界定义得远窄于“电池储能”。公司和第三方资料都将 SolidFlow 放在需要 10+
              小时、多小时至多日移峰和可调度过夜供电的长时场景，而非短时辅助服务平衡。主要场景是电网公用事业、可再生能源稳供和数据中心等关键负载基础设施。因此，实际替代方案是四小时锂电、弃电、电网扩容和化石燃料备用，而不是消费电池或泛化的固定式储能。这个边界缩小了相关需求池，也把经济问题锁定在可靠性、拥塞和价值捕获上。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM011
              - CM013
              - CM016
      - number: '2.2'
        title: 规模测算视角与需求锚点
        blocks:
          - type: paragraph
            body: >-
              留存资料支持按不同视角测算，而不是套用完整的 TAM/SAM/SOM。最宽口径下，IEA 数据显示全球电池市场仍在快速增长，增量主要来自公用事业级部署。更窄的视角来自 CMBlu 自己披露的需求锚点：5 GWh
              的 Uniper 框架协议和亚利桑那 SRP 试点。这些锚点说明公司在争取大型基础设施项目，但不等于已签约的经常性收入，也不能直接构成市场份额模型。证据足以说明需求方向，但还不足以据此宣称存在有来源支撑的非锂
              LDES 市占区间。
