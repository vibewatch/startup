              外部证据说明 CMBlu 获得了重要资本和战略支持，但不足以支撑资本充足性判断。Mercom 报道 STRABAG 2023 年投入 €100 million 股权，多家 2026 年资料确认首轮 Series
              C 为 €50 million、估值超过 €1 billion。同时，ESS News 称融资仍在开放，管理层仍与其他投资者接触；制造路线和 Uniper
              时点也表明主要收入爬坡在当前融资之后。公司有可信需求信号和可行商业化路径，但公开证据仍缺少核心判断输入：经审计或管理账收入、实际 ASP
              和折扣、毛利率、服务成本、客户集中度、现金、债务或项目融资义务及月度现金消耗。因此，财务结论对战略相关性方向偏正面，但收入质量、利润路径和现金跑道仍不完整。
            claimRefs:
              - CI001
              - CI007
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 图表
        blocks:
          - type: callout
            title: 最好的公开验证仍是情景经济性
            body: 最强的客户经济性证据是公司发布的电网案例，包含价差、循环次数、年收入和回收期假设；它有助于框定价值捕获，但不等于已披露的实际定价、毛利率或已确认收入。
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: callout
            title: 收入质量尚未清晰，资本需求已先到
            body: 公司正从运营中的 1 GWh 基地扩向多基地布局；独立报道称最新融资仍在开放，主要框架交付 2027 年开始，因此融资依赖是核心投资判断风险。
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI011
          - type: callout
            title: 财务尽调必须从管理账开始
            body: 下一步应索取月度管理账、工厂层面的资本开支计划、毛利率细节和完整 Uniper 框架协议，让投资者把技术潜力与可融资收入及现金跑道区分开。
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与目标工作流
        blocks:
          - type: paragraph
            body: >-
              CMBlu 卖的不是短时削峰电池或通用软件平台，而是把 SolidFlow
              定位为面向需要多小时移峰和可调度能力买方的长时储能。公司称系统是可运行十小时以上的非锂储能，可将间歇性可再生能源变成可调度电力，并支撑必须运行过夜的数据中心或工业负载。独立报道方向一致：Energy-Storage.news
              称其面向超大规模客户的 8-10 小时需求；Datacenter Knowledge 指出，数据中心传统 BESS
              往往只设计为放电两至四小时。工作流匹配很清晰：可再生能源稳供、拥塞管理和关键负载的柴油替代；但目前仍主要处于设计赢单、框架协议和首批商业项目阶段，尚非拥有大量经验证运营资产的安装基础。
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE012
