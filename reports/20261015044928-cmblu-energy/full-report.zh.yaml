      - number: '8.3'
        title: 下行来自执行、监管与商业化延期
        blocks:
          - type: paragraph
            body: >-
              下行情景具体而非抽象。德国不断变化的电池储能制度可能增加并网费、保证金和未来网络费，改变项目经济性；CMBlu
              最好的公开商业信号仍是有条件框架，而非已披露定价订单。行业历史也说明不能为必然性付费：VoltStorage 在 ESS 收购其 IP
              前停止运营，证明技术差异化本身不保证持久商业化。实际尽调路径很直接：在判断持有或退出情景前，先取得管理账、股权瀑布和签单转化证据。若再过一年仍没有收入和利润披露、2027
