  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格已跑在公开验证之前
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的估值事实是，CMBlu 宣布 Series C 首轮融资 EUR 50 million，并称该轮跨过 EUR 1 billion
              门槛，独立行业报道也重复了这一估值。融资支持有分量，但同时引用的最强公开商业证据仍是延续至 2037 年、2027 年起以期权式批次启动的有条件 Uniper 框架，而不是已披露定价和利润转化的确定
              订单储备。本章审阅的资料还没有披露经审计收入、毛利率、现金消耗、现金跑道
              或最新一轮的清算优先权结构。因此，公开证据足以支持关注公司，但不足以在宣布的独角兽价格上做出坚定买入判断。估值偏高，除非入场价格回调或验证追上来，否则应继续研究。
            claimRefs:
              - CV001
              - CV002
              - CV006
