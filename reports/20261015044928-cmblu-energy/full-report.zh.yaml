            body: >-
              当前证据中最明确的管理层变化发生在 2024 年 3 月：Constantin Eis 出任 CEO，创始人 Dr. Peter Geigle 转任监事会，创始人仍在但日常执行交给了规模化运营者。资料还公开提到
              Giovanni Damato、Dr. Nastaran Krawczyk、Olaf Althaus 和 Markus
              Geigle，分别覆盖美国拓展、技术、财务和市场进入。职能覆盖面已经清晰，但治理质量仍无法充分评估，因为资料没有完整董事会名单或详细股权瀑布图。因此，利益相关方图比治理图更具体：STRABAG 是 2023
