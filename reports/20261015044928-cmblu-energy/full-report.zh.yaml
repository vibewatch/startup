        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              证据给出了清晰排序：制造扩产、大型框架协议转化和资本强度最可能击穿当前投资逻辑。CMBlu 刚在 2026 年 4 月融资，且公开披露德国工厂已运营，因此不是从零到一的科学实验。但记录也显示估值超过 EUR1
              billion，旗舰 5 GWh Uniper 协议仍需转化为实际调用，并计划到 2029 年支持超过 10
              GWh。市场已经在为仅得到部分公开验证的商业执行买单。若工厂爬坡延期、锚定协议停留在框架新闻而非交付资产，或项目经济性只在乐观价差与循环假设下成立，剩余下行仍高。
