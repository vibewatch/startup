      - number: '8.2'
        title: 上行情景真实，但仍由公司主导
        blocks:
          - type: paragraph
            body: >-
              如果能转化为可重复部署，CMBlu 确实具备获得溢价的要素。公司资料描述了非锂、不可燃、10-plus-hour 架构，并宣称生命周期成本异常低、资产寿命长；制造布局从 Alzenau 的 1 GWh
              起步，目标到 2029 年全球超过 10 GWh。独立市场背景也提供方向支持：Fluence 报告了数十亿美元订单储备和 147 GWh
              管线，说明储能需求并非假设。但溢价逻辑仍更多由公司主张和市场潜力驱动，而非独立披露的 CMBlu 单位经济性或合同收入，因此上行应放在里程碑驱动的判断中，而不是今天就把它计入投资判断。
            claimRefs:
