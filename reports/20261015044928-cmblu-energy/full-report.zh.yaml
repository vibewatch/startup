      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方证据来自公用事业。SRP 公告显示，采购路径从 RFP 开始，经过试点，再由第三方监测性能，最后才扩大采用。CMBlu
              的电网公用事业页面把核心经济价值放在减少弃电、套利和缓解拥塞上，这更贴合公用事业规划者和资产运营商，而非大众电力产品。数据中心是公司叙事中的高价值关键负载
              сегмент，但资料没有披露预算归属，也不清楚采购由客户、公用事业还是项目开发商承担。因此，采用路径证据强于付款方可见度。
