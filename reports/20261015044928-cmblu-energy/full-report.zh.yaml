  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据展示了一条路径：从目标客户应用走向情景经济模型，再回到大规模交付前扩充制造所需的资本。
    data:
      nodes:
        - id: target-markets
          label: 目标市场
          detail: 公司发布的材料中，点名的公开买方类别包括公用事业、数据中心和大型商业用户。
        - id: storage-asset
          label: 储能资产
          detail: SolidFlow 的定位是面向电网和关键负荷应用、可持续 10+ 小时运行的多小时可调度储能。
        - id: operating-use
          label: 运行用途
          detail: 已公布的应用场景是储存过剩的可再生能源，在需求高峰放电，并减少弃电或扩建电网的需要。
        - id: monetization
          label: 变现示例
          detail: 电网示例称，一个 100 MW / 1,000 MWh 系统在 €40–80/MWh 的价差、每年约 250 次循环下，年收入最高可达 €20M。
        - id: project-return
          label: 项目回报
          detail: 同一示例给出的回本期为 5-8 年，因此客户经济性取决于具体地点的价差和利用率。
        - id: scale-funding
          label: 规模化融资循环
          detail: C 轮融资所得将用于制造规模扩张和早期部署；独立报道称，Uniper 框架下的交付将于 2027 年开始。
      edges:
        - from: target-markets
          to: storage-asset
          label: 买方需求
        - from: storage-asset
          to: operating-use
          label: 资产用于
        - from: operating-use
          to: monetization
          label: 驱动
        - from: monetization
          to: project-return
          label: 支撑
        - from: project-return
          to: scale-funding
          label: 必须证明合理
    approximationNotes: 收入和回本期节点是公司情景假设，不是已实现的投资组合平均值。
