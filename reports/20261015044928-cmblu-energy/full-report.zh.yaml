      - number: '5.3'
        title: 成熟度、控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              公开证据表明 CMBlu 已超越纯实验室阶段，但尚未提供足够独立运营验证，无法完全解除多 GWh 扩产风险。公司引用 5 GWh Uniper 框架，独立报道则称亚利桑那首个商业规模 5 MW / 50 MWh
              项目预计 2027 年底投产；这比尚无收入的概念页可信，但路线图与长期车队表现之间仍有缺口。内部执行信号也需关注：kununu
              快照显示员工满意度一般，并明确抱怨沟通和人员流失；公司从化学研发转向制造和现场交付后，流程纪律和跨职能协作更重要。此外，资料池没有公开安全认证、网络安全控制或详细质量体系证据，这些仍是尽调问题，而非已被投资判断认可的优势。
            claimRefs:
