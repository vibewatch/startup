  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群在公用事业最清晰，数据中心需求仍主要是目标市场
        blocks:
          - type: paragraph
            body: >-
              留存证据将公用事业和电网运营商指向 CMBlu 当前最清晰的买方类别。公司电网与公用事业页面明确称，产品通过 10+ 小时储能让可再生能源可调度；LeadIQ
              则把目标客户扩展到公用事业、电网运营商及工商用户。2026 年 CMBlu 进一步面向超大规模数据中心强化叙事：4 月融资公告把商业验证与公用事业和数据中心联系起来，CERAWeek
              议程标题也围绕超大规模需求与电网负载。市场进入叙事在扩大，但具名验证仍集中于公用事业，而非已披露的数据中心或工业运营商。
