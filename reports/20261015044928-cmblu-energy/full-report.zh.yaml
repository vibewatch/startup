        title: 已有具名客户验证，但多数公开参考仍处于试点或框架阶段
        blocks:
          - type: paragraph
            body: >-
              当具名公用事业交易对手出现时，公开客户证据最强。CMBlu 称已获得 Uniper 5 GWh 框架协议，行业报道也将其称为 2027 年开始的重大商业里程碑。同时，BR24 2025 年 8
              月报道显示，德国公用事业验证仍在 Staudinger 测试，初始部署为 1 MW / 1 MWh、36 个电池单元。美国参考更早期：ABC15 将亚利桑那 Salt River Project
              合作描述为试点。公司因此能展示横跨欧美的可信具名参考，但公开记录仍没有大量已运营生产部署及客户结果。
