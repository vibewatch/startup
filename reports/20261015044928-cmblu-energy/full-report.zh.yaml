      - number: '2.4'
        title: 采用约束与未解决的规模缺口
        blocks:
          - type: paragraph
            body: >-
              主要约束不是长时储能是否有吸引力，而是 CMBlu 能否足够快地从可信试点和框架协议走向可重复的商业部署，以支撑溢价估值。全市场增长没有拆出 10+ 小时细分市场：2025 年报道的 108 GW
              增量涵盖不同储能时长和化学体系，不能据此确定 CMBlu 的可服务份额。资本效率和制造规模的强劲上行主张仍主要来自公司，ExoMatter
              案例也暗示化学与材料流程仍在持续优化。市场逻辑因此合理，但细分市场规模、采购归属以及框架协议转化为运营资产的程度仍未充分说明。
            claimRefs:
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 需求信号最强的地方
            body: 最强的非公司需求证据来自公用事业：SRP 基于 RFP 的试点，以及 IEA 所记录的公用事业级移峰，都说明更长时长的重要性。相比之下，数据中心机会具有战略意义，但目前主要由公司叙事披露，缺少独立的买方预算证据。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM016
          - type: callout
            title: 完整市场判断仍需哪些验证
            body: 更强的市场判断需要独立 TAM/SAM 测算、公开的预算归属，以及 Uniper 等框架协议转化为确定调用或重复部署的证据。在此之前，市场机会方向上可信，但仍不足以支撑明确的份额或收入捕获假设。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合：化学体系、传统厂商与现状
        blocks:
          - type: paragraph
            body: >
              资料显示，CMBlu 面对的是解决方案类别竞争，而不是一份一对一的有机液流电池同行名单。CMBlu 宣称 SolidFlow 可用于 10+ 小时可再生能源移峰、公用事业韧性和数据中心备用；Utility
              Dive 则称其初期商业化聚焦五至十小时。真正的比较集合包括仍是默认基准的锂电、解决类似长时任务的金属液流电池，以及靠承受弃电、拥塞和峰价暴露来替代新增储能的现状方案。CMBlu
              要卖的是更长时的架构，面向需要多小时调度、并把化学体系、消防风险和许可摩擦视为采购变量的买方。
