  - id: FE001
    title: 产品架构图
    type: stack
    summary: CMBlu 的公开架构把客户工作流、混合化学体系和制造扩张串成一套运营链路。
    data:
      layers:
        - label: 客户工作流
          detail: 电网调峰、可再生能源移峰和数据中心连续供电，是公开资料中的需求锚点。
          modules:
            - 电网及公用事业可再生能源调峰
            - 隔夜电力移峰
            - 关键负荷柴油发电替代备电
        - label: 系统结果
          detail: 公司将平台定位为 8-10+ 小时可调度储能，而不是短时缓冲。
          outputs:
            - 10+ 小时可调度能源
            - 高峰及隔夜供电
            - 降低对关键矿产供应链的依赖
        - label: 核心架构
          detail: 公开描述将液流电池布局与专有固态储能介质结合起来。
          modules:
            - 水基电解液
            - 固定式固态储能材料
            - 功率和能量容量分别扩展
        - label: 安全与许可论点
          detail: 安全主张是推介的核心，但在现有资料中大多仍由公司自行描述。
          outputs:
            - 不可燃系统
            - 无热失控主张
            - 简化许可流程主张
        - label: 制造体系
          detail: 规模扩张依靠汽车工业式生产，而不是锂电池洁净室工艺。
          modules:
            - 正在运营的 Alzenau 工厂
            - 在建的希腊扩建项目
            - 规划中的美国工厂
        - label: 执行依赖
          detail: 商业化证明仍取决于项目交付、电网接入和质量体系证据。
          outputs:
            - 2027 年底前完成亚利桑那州首个商业规模项目的目标
            - 德国并网瓶颈
            - 需要外部质量和可靠性证明
