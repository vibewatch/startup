            body: >-
              融资叙事最清晰的两步是 STRABAG 2023 年的增长投资，以及 2026-04-30 宣布的 €50 million 首轮 Series C。CMBlu 将这轮融资与超过 €1 billion
              的估值、制造扩产和欧美早期部署联系起来。工业化路线图同样激进：官方和独立资料都称 Alzenau 自 2024 年起运营，当前产能 1 GWh、基地上限 4 GWh；希腊工厂在建，美国工厂计划 2029
