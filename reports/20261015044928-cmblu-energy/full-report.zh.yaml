  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 需求和产品差异化确实重要，但商业化仍有条件且存在披露缺口，因此建议仍为继续研究。
    data:
      nodes:
        - id: sector-demand
          label: 行业需求存在
          detail: Fluence 报告称，其积压订单为 USD 5.6 billion，管线为 147 GWh。
        - id: product-claim
          label: 产品差异化主张
          detail: CMBlu 将 SolidFlow 定位为非锂、不可燃、可持续 10 多小时的储能产品。
        - id: scale-plan
          label: 扩张计划
          detail: C 轮融资所得和制造路线图的目标是实现多 GWh 产能。
        - id: commercial-proof
          label: 商业验证仍有条件
          detail: Uniper 框架协议期限较长，但仍是有条件、分批次的安排。
        - id: economics-friction
          label: 经济性面临阻力
          detail: 德国 BESS 并网和费率改革可能挤压项目回报。
        - id: valuation-mark
          label: 价格已经偏高
          detail: 公开来源显示，最近一轮融资估值已超过 EUR 1 billion。
        - id: recommendation
          label: 建议
          detail: 继续研究；等待订单转化、经济性改善或更好的入场条件。
      edges:
        - from: sector-demand
          to: product-claim
        - from: product-claim
          to: scale-plan
        - from: scale-plan
          to: commercial-proof
        - from: commercial-proof
          to: valuation-mark
        - from: economics-friction
          to: valuation-mark
        - from: valuation-mark
          to: recommendation
    approximationNotes: 该流程是定性的，用于解释判断路径，不代表加权概率。
