chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与当前规模
        blocks:
          - type: paragraph
            body: >-
              CMBlu 源于 2011 年启动的有机液流电池研究，2014 年在德国 Alzenau 正式成立。当前资料将总部和运营中心定位在
              Alzenau，同时提到希腊和美国的业务；后续制造与部署主张依赖这三个国家的布局，而不是单一实验室。公司与独立资料对产品的描述一致：SolidFlow 使用水基材料，是面向 10+
              小时场景的非锂长时储能架构。公司计划把长时储能卖给电网、公用事业、工业和数据中心客户，解决多小时可再生能源调度，而非短时锂电削峰。规模主张有分量，但目前主要是运营层面的：公司称员工超过 250
              人，其中科学家和工程师超过 150 人；然而资料没有披露经审计收入、客户数量或现金消耗，无法独立验证商业成熟度。
