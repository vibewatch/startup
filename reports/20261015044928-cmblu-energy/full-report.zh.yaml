        title: 收入模式与公开变现证据
        blocks:
          - type: paragraph
            body: >-
              资料支持项目驱动的硬件收入模式，而非已披露的经常性软件或服务收入。CMBlu 将 SolidFlow
              定位于公用事业、数据中心和大型商业应用；其公用事业页面用储存多余可再生电力、在高峰放电和减少弃电或电网升级来说明项目价值。公开变现证据主要是情景测算：公司称 100 MW / 1,000 MWh 系统在
              €40–80/MWh 价差、每年约 250 次循环下，年收入最高可达 €20 million、回收期 5-8 年；这只是示例经济性，不是实际定价或已确认收入。最清晰的商业信号是 Uniper
              框架，但独立报道确认它有条件且 2027 年才开始分批交付，因此当前公开记录更能支持管线质量，而非近期已确认收入质量。
