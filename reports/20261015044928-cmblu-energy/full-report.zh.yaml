        title: 持久性、扩张经济性和集中度仍是主要尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开客户记录最大的弱点不是缺少
              logo，而是缺少持久性指标。留存资料没有披露客户数、净留存或毛留存、流失、续约率、合同期限或头部客户集中度，因此难以区分有前景的“试点到框架”管线与持久的经常性客户基础。扩张经济性也不完整：数据中心逻辑战略上重要，但资料没有指出已投产的具名超大规模运营商，Uniper
              框架也没有公开调用时间或约束性数量。缺口填补前，客户质量只能评价为令人鼓舞，尚未完全去风险。
