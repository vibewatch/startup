      - number: '5.2'
        title: 架构与制造模式
        blocks:
          - type: paragraph
            body: >-
              公司和独立资料反复提到的技术差异化足以构成核心架构假设：SolidFlow
              将水基电解质与专有固态储能材料结合，因此公司称其能量密度高于传统水系液流设计，同时保留功率和能量解耦配置的优势。公开资料还称系统不可燃、避免热失控，因此比锂电更安全、更易获批；制造方式也更接近汽车生产，而非洁净室电芯制造。硬件方面，Alzenau
              已被公司定位为具备商业化条件的 1 GWh 运营基地，希腊在建，美国仍在规划。这一布局把化学体系、模块组装和扩产连成一套运营模式，但成本和吞吐量主张大多仍来自公司，缺少外部基准或认证文件。
