        blocks:
          - type: paragraph
            body: >-
              这里应通过可观察里程碑而非宽泛技术叙事监测风险。2027 年希腊开始生产、美国工厂按计划在 2029 年推进、Mercedes-Benz 等具名项目完成投产，以及 Uniper
              关系出现清晰转化里程碑，都能降低剩余风险。相反，工厂爬坡延期、具名部署没有更新运营验证，或继续依赖公司自述经济性与安全信息，都会把逻辑推向“估值领先于验证”。公司有缓释因素——用于扩产的新资本、已运营的 1
              GWh 基地和具名试点/客户关系——但投资者仍需独立运营数据、框架转化证据和更紧的项目经济性，才能视其为已完全去风险。
