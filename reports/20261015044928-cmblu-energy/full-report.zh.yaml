        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              资料池中最清晰的外部不利信号不是诉讼或召回，而是 CMBlu 目标市场的政策波动。IndexBox 称德国储能制度在 2026 年初仍在变化，涉及特许基础设施待遇、并网流程和电网费设计。CMBlu
              的商业叙事依赖大型公用事业和数据中心部署，而项目时点和商用经济性高度受并网规则及成本分摊政策影响。公司还称 SolidFlow
              可规避外国实体关注供应链风险，但美国制造仍要到未来才落地。因此存在实质的法律与监管执行依赖：公开定位已与政策挂钩，本地化制造基础却仍在建设。
