figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Highest residual risk sits in manufacturing ramp, framework conversion, and capital intensity rather than basic technology existence.
    data:
      columns:
        - label: Likelihood
          detail: 1 is low and 5 is high.
        - label: Impact
          detail: 1 is low and 5 is high.
        - label: Mitigation maturity
          detail: 1 is nascent and 5 is proven.
        - label: Residual exposure
          detail: 1 is low and 5 is high after current mitigants.
      rows:
        - label: Manufacturing scale-up and capex
          note: Live capacity exists, but most disclosed network growth still sits ahead.
          values:
            - { label: "4/5", note: "Multi-site ramp remains future-dated outside Alzenau." }
            - { label: "5/5", note: "A delayed ramp would directly hit delivery credibility and financing needs." }
            - { label: "3/5", note: "Fresh capital and a live site help, but future plants are not yet operating." }
            - { label: "4/5", note: "Residual exposure stays high until commissioning and yield data become public." }
        - label: Uniper framework conversion
          note: The headline volume is large relative to current public delivery detail.
          values:
            - { label: "4/5", note: "The public record still lacks call-off cadence and delivered-volume proof." }
            - { label: "5/5", note: "Visible slippage would weaken the clearest commercial proof point." }
            - { label: "3/5", note: "Manufacturing build-out is a real mitigant, but not proof of order conversion." }
            - { label: "4/5", note: "Risk remains elevated until schedule and shipment data are visible." }
        - label: Germany and EU market-design volatility
          note: Grid-connection, storage status, and fee rules were still moving in 2026 reporting.
          values:
            - { label: "3/5", note: "Policy changes are external and already observable in the market." }
            - { label: "4/5", note: "Interconnection and fee rules can delay or impair storage project economics." }
            - { label: "2/5", note: "Geographic diversification helps but does not remove domestic policy exposure." }
            - { label: "4/5", note: "Residual exposure remains meaningful for utility-scale deployments." }
        - label: Independent field-validation gap
          note: Company safety and economics claims are stronger than the independent operating evidence in the pool.
          values:
            - { label: "3/5", note: "The gap narrows if named projects publish data, but that proof is still sparse here." }
            - { label: "4/5", note: "Validation weakness can slow bankability, insurance, and customer adoption." }
            - { label: "2/5", note: "Named pilots and customer projects provide a path, but not full independent proof yet." }
            - { label: "4/5", note: "Residual exposure stays high until operating, warranty, and certification data are public." }
        - label: Merchant-economics downside
          note: Public economics are marketed from one assumption set rather than a disclosed portfolio of realized returns.
          values:
            - { label: "3/5", note: "Spread and utilization volatility are common in storage markets." }
            - { label: "4/5", note: "Underperformance would weaken customer ROI and project-finance appetite." }
            - { label: "2/5", note: "The company discloses the assumption set, but not independent realized outcomes." }
            - { label: "4/5", note: "Residual exposure remains high until operating assets publish realized economics." }
        - label: Commercial-reference concentration
          note: Public proof is clustered around a few named projects rather than a wide reference fleet.
          values:
            - { label: "3/5", note: "Named projects exist, but public fleet breadth is still limited in this pool." }
            - { label: "4/5", note: "A small proof base magnifies the impact of any single project delay." }
            - { label: "3/5", note: "Each successful commissioning can improve the reference base materially." }
            - { label: "3/5", note: "Residual exposure is moderate-high until a broader operating fleet is visible." }
    approximationNotes: Ordinal scores synthesize cited evidence into relative ranking; they are not probabilistic forecasts.
    claimRefs: [CR001, CR003, CR005, CR009, CR012, CR014]
