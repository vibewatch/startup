company:
  name: CMBlu Energy
chapter:
  number: 7
  title: Risks
  summary: >-
    CMBlu's biggest investable risks are not basic technology existence but the gap between a unicorn valuation and still-emerging proof on plant ramp, framework-to-order conversion, and independently validated field performance. The assigned evidence shows real mitigants - fresh capital, a live 1 GWh German site, and named counterparties - but it still leaves material execution, regulatory, and capital-intensity questions open.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The evidence supports a clear ranking: manufacturing scale-up, large-framework conversion, and capital intensity are the risks most capable of breaking the current investment case. CMBlu has fresh April 2026 financing and a disclosed live German gigafactory, so this is not a zero-to-one science experiment. But the same record also shows a greater than EUR1 billion valuation, a flagship 5 GWh Uniper agreement that still needs visible call-off conversion, and a stated ambition to support more than 10 GWh by 2029. That combination means the market is already paying for commercial execution that is only partly proven in the public record. If site ramps slip, if anchor agreements remain framework headlines rather than delivered assets, or if project economics only work inside optimistic spread-and-cycle assumptions, residual downside remains high.
    claimRefs: [CR001, CR005, CR006, CR012, CR013, CR014]
    tableRefs: [TR002, TR003]
    figureRefs: [FR001]
  - id: regulatory-and-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      The cleanest external adverse signal in the assigned pool is not a lawsuit or recall; it is policy volatility in the markets CMBlu wants to serve. IndexBox describes a German storage regime that was still changing in early 2026 across privileged-infrastructure treatment, grid-connection procedure, and grid-fee design. That matters because CMBlu's own commercial story is built around large utility and data-center deployments, where project timing and merchant economics are highly sensitive to interconnection rules and cost-allocation policy. The company also pitches a U.S. supply-chain advantage by saying SolidFlow avoids foreign-entity-of-concern exposure, but the same public record shows U.S. manufacturing is still future-dated. That leaves a meaningful legal-and-regulatory execution dependency: public positioning is already policy-linked, while the supporting localization footprint is still being built.
    claimRefs: [CR002, CR009, CR015]
    tableRefs: [TR001]
  - id: operating-and-monitoring-triggers
    title: Operating and monitoring triggers
    body: >-
      The best way to monitor risk here is through observable milestones rather than broad technology narratives. Evidence of Greek production beginning in 2027, a U.S. plant remaining on track for 2029, disclosed commissioning of named projects such as the Mercedes-Benz site, and visible conversion milestones on the Uniper relationship would all reduce residual risk. By contrast, slippage on plant ramp, no updated operating proof from named deployments, or continuing reliance on company-authored economics and safety messaging would push the thesis toward "valuation ahead of proof." The company does have mitigants - fresh capital earmarked for scale-up, a disclosed live 1 GWh site, and named pilot/customer relationships - but investors still need independent operating data, framework conversion evidence, and tighter project-level economics before treating those mitigants as complete de-risking.
    claimRefs: [CR001, CR003, CR006, CR007, CR008, CR010, CR011, CR014]
callouts:
  - calloutType: risk
    title: Top thesis-break triggers
    body: >-
      The risk case worsens quickly if Greece slips beyond 2027, the U.S. plant remains only a planning story into 2028, or the Uniper agreement stays publicized as framework scale without visible call-off orders or commissioning milestones. In that scenario, the April 2026 unicorn valuation would be resting further ahead of de-risked commercial proof than the current public record supports.
    claimRefs: [CR003, CR005, CR014]
  - calloutType: insight
    title: Real mitigants exist, but they are incomplete
    body: >-
      CMBlu can point to a live 1 GWh Alzenau site, fresh Series C capital, and named counterparties rather than just lab claims. Those facts reduce basic existence risk, but they do not eliminate the harder questions around multi-site ramp, partner conversion, and whether marketed project economics hold outside a favorable spread-and-cycles scenario.
    claimRefs: [CR001, CR006, CR007, CR012]
