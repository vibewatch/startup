      - ["Project economics sensitivity", "The marketed utility case assumes a EUR40-80/MWh spread and about 250 cycles per year for a 10-hour asset, then quotes up to EUR20M annual revenue and 5-8 year payback.", "Medium", "High", "Medium", "Medium-High", "Stress-test economics under lower spreads, lower utilization, higher financing costs, and delayed revenue ramp."]
