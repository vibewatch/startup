  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-and-concentration-metrics
      missingEvidence: Public disclosure of customer count, NRR or GRR, churn, renewal rates, contract length, and top-customer concentration.
      whyItMatters: Without durability metrics, pilots and framework agreements cannot be distinguished from a repeatable retained customer base.
      diligencePath: Request the current customer dashboard, cohort or renewal schedule, and top-customer revenue concentration from management.
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table coverage
      missingEvidence: A fuller list of named production deployments and pilots, including named data-center or industrial operators and measured outcomes.
      whyItMatters: The retained public pool supports only a partial sample of named customer proof, which limits conclusions about breadth of adoption.
      diligencePath: Obtain the live customer reference list, site status by project, and permissioned case studies with deployment dates and outcome metrics.
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: uniper-call-off-and-contract-economics
      missingEvidence: The binding volume profile, call-off timing, pricing mechanics, and realized revenue from the Uniper framework agreement.
      whyItMatters: The framework agreement is the chapter's strongest public proof point, but without economics and timing it does not prove near-term customer durability.
      diligencePath: Review the signed framework, any call-off schedules, and board or investor materials that bridge framework value to booked revenue.
