  evidenceGaps:
    - type: missing-source
      severity: material
      topic: safety-and-quality-controls
      missingEvidence: Public safety certifications, quality-system documentation, cybersecurity controls, and field-failure disclosures for SolidFlow installations.
      whyItMatters: Readers can underwrite the chemistry narrative, but not the control environment or bankability of utility-scale deployment without third-party validation.
      diligencePath: Request UL/IEC certification records, quality manuals, cyber architecture documentation, and independent commissioning or reliability reports for deployed systems.
      relatedQuestionRefs: [QE008]
