      - [Proprietary solid storage materials in tanks, Raises energy density versus conventional aqueous-only flow designs, Proprietary material performance at scale, Independent long-term durability data is not public in the assigned pool]
      - [Decoupled power and energy sizing, Allows storage duration to scale by enlarging tanks rather than duplicating full power electronics, "Tank, stack, and pumping integration", Economic advantage is plausible but not independently benchmarked by the assigned sources]
