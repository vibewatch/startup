chapter:
  number: 5
  title: Product & Technology
  summary: >-
    CMBlu's product story is a specific one: a non-lithium, long-duration storage
    system that combines flow-battery architecture with stationary solid storage
    media and is being sold into grid, utility, and data-center workflows that
    need roughly overnight-duration energy shifting. Public evidence supports the
    core chemistry, manufacturing footprint, and target use cases, but third-party
    proof of safety certifications, cyber/quality controls, and field reliability
    remains thin relative to the scale implied by the company's multi-GWh roadmap.
sections:
  - id: product-scope-and-workflows
    title: Product scope and target workflows
    body: >-
      CMBlu is not selling a short-duration peak-shaving battery or a general
      software platform; it is positioning SolidFlow as long-duration storage for
      buyers that need multi-hour energy shifting and dispatchability. Company
      materials describe the system as non-lithium storage engineered for ten
      hours or more, aimed at turning intermittent renewable generation into
      schedulable power and supporting data-center or industrial loads that must
      run through the night. Independent coverage is directionally consistent:
      Energy-Storage.news describes CMBlu as targeting the 8-10 hour range for
      hyperscaler demand, while Datacenter Knowledge shows why that pitch matters
      operationally by noting that conventional BESS deployments in data centers
      are often designed for only two to four hours of discharge. The result is a
      clear workflow fit—renewable firming, congestion management, and diesel
      displacement for critical loads—but still mostly at the stage of design wins,
      frameworks, and first commercial projects rather than a broad installed base
      of proven operating assets.
    claimRefs: [CE001, CE002, CE011, CE012]
    tableRefs: [TE001, TE002]
  - id: architecture-and-manufacturing
    title: Architecture and manufacturing model
    body: >-
      The technical differentiation CMBlu repeats across company and independent
      sources is consistent enough to treat as the core architecture hypothesis:
      SolidFlow combines water-based electrolytes with proprietary solid energy
      storage materials, so the company can claim higher energy density than a
      conventional aqueous flow design while keeping the benefits of decoupled
      power and energy sizing. Public materials also frame the system as safer and
      easier to permit than lithium-ion because it is non-flammable and avoids
      thermal runaway, while manufacturing is described as closer to automotive
      production than clean-room cell manufacturing. On the hardware side, the
      company now presents Alzenau as a live 1 GWh commercialization-ready site,
      with Greece under construction and a U.S. plant still in planning. That
      footprint is meaningful because it links chemistry, module assembly, and
      scale-up into one integrated operating model, but most of the cost and
      throughput claims still come from the company rather than an external
      benchmark or certification dossier.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-controls-and-technical-risks
    title: Maturity, controls, and technical risks
    body: >-
      Public evidence suggests CMBlu has advanced beyond pure laboratory work but
      has not yet provided the level of independent operating proof that would
      fully de-risk a multi-GWh scale-up story. The company cites a 5 GWh Uniper
      framework and independent reporting points to a first commercial-scale
      5 MW / 50 MWh Arizona project expected at the end of 2027, which is more
      credible than a pre-revenue concept slide but still leaves a gap between
      roadmap and long-term fleet performance. Internal execution signals also
      deserve attention: a kununu snapshot shows middling employee sentiment and
      explicit complaints about communication and turnover, which matters because
      process discipline and cross-functional coordination become more important as
      the company moves from chemistry R&D into manufacturing and field delivery.
      Separately, the assigned evidence pool does not provide public safety
      certifications, cybersecurity controls, or detailed quality-system evidence,
      so those areas remain diligence asks rather than underwritten strengths.
    claimRefs: [CE010, CE012, CE013, CE014, CE016]
