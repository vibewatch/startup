      - Diligence ask
    rows:
      - ["Utility-scale long-duration storage systems", "Project/system sales for grid and renewable-firming use cases", "MWh / system", "Public use case and framework demand disclosed; no recognized revenue disclosed", "Pipeline evidence is stronger than realized revenue evidence", "Provide signed contracts, delivered MWh, revenue recognition policy, and backlog conversion history"]
      - ["Data-center power applications", "System deployments framed around overnight coverage and AI/data-center demand", "MW / MWh system", "Company positions SolidFlow for 1 GW for five hours or 500 MW for ten hours; no customer revenue disclosed", "Company-claimed application fit only", "Provide named customer deployments, pricing structure, and implementation timeline"]
      - ["Large commercial and industrial storage", "Company-issued exhibitor listing cites large commercial buyers alongside utilities and data centers", "System sale", "Target segment disclosed; no segment revenue mix disclosed", "Segment evidence exists but monetization is undisclosed", "Provide segment mix, sales pipeline, and channel economics by buyer class"]
      - ["Uniper framework demand", "Conditional framework with batch call-offs of at least 100 MWh", "GWh framework / 100 MWh batch", "5 GWh framework announced; deliveries start in 2027", "Important demand signal but not current booked revenue", "Provide conditions precedent, conversion timing, and revenue recognition triggers"]
    notes: Public evidence shows target revenue streams and one framework agreement, but not realized revenue, customer mix, or recognition policy; null-like status cells indicate disclosure gaps rather than zero activity.
    claimRefs: [CI003, CI004, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Metric
      - Price / unit / contract
      - List vs realized
      - Discounts / unknowns
      - Source
    rows:
      - ["Grid arbitrage value example", "Up to €20M annual revenue for a 100 MW / 1,000 MWh (10h) system", "Scenario, not realized pricing", "Assumes €40–80/MWh spread and ~250 cycles/year; customer-specific pricing undisclosed", "CMBlu grid-utilities page"]
      - ["Project payback example", "5-8 year payback", "Scenario, not realized", "Depends on spread capture, cycling, capex, and site conditions", "CMBlu grid-utilities page"]
      - ["Uniper commercial structure", "Framework valid to 2037 with procurements in batches of at least 100 MWh", "Contracted framework, not disclosed realized price", "Pricing and margin terms undisclosed; deliveries start in 2027", "Energy-Storage.news"]
      - ["Series C use of proceeds", "€50M initial close funds manufacturing scale-up and early deployments", "Financing input, not customer pricing", "Total round size and remaining capital needs not yet fully disclosed", "CMBlu press release / Mercom / ESS News"]
    notes: This table separates scenario economics, framework structure, and financing proceeds from realized customer pricing; public sources do not disclose ASPs, discounts, or revenue recognition terms.
    claimRefs: [CI002, CI005, CI006, CI007, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Manufacturing capex intensity", "~$15M per GWh for SolidFlow vs ~$100M per GWh for lithium-ion", "Medium", "Frames whether scale-up can be funded with equity plus project demand", "Provide plant budget, assumptions behind the comparison, and actual spend-to-date"]
      - ["Current production capacity", "1 GWh current capacity at Alzenau; 4 GWh max output", "Medium", "Sets the ceiling for early deliveries before newer sites ramp", "Provide current utilization, yield, and commercialization readiness by line"]
      - ["Expansion roadmap", "Greece under construction for 2027, U.S. planning for 2029, >10 GWh supported by 2029", "Medium", "Shows future revenue depends on successful capex execution", "Provide phasing, capex by site, and financing sources for each facility"]
      - ["Illustrative asset economics", "Up to €20M annual revenue and 5-8 year payback on the published 100 MW / 1,000 MWh example", "Medium", "Useful for customer value framing but not the same as CMBlu gross margin", "Provide realized project economics, gross margin bridge, and O&M assumptions"]
      - ["Gross margin", null, "Low", "Core to underwriting margin path and valuation", "Provide current and target gross margin with BOM, manufacturing yield, and service-cost detail"]
      - ["CAC / payback", null, "Low", "Needed to assess sales efficiency and channel viability", "Provide CAC, sales cycle, win rate, contribution margin, and channel/partner economics"]
      - ["Cash / burn / runway", null, "Low", "Determines financing dependency before scaled deliveries arrive", "Provide cash balance, monthly burn, covenant/debt schedule, and base-case runway"]
    notes: Public evidence is strongest on company-claimed manufacturing and scenario economics; null entries mark underwriting metrics that were not disclosed in the assigned source pool.
    claimRefs: [CI005, CI008, CI009, CI010, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows a bridge from targeted customer applications to scenario economics and then back to the capital needed to scale manufacturing before broad deliveries begin.
    data:
      nodes:
        - id: target-markets
          label: Target markets
          detail: Utilities, data centers, and large commercial users are the public buyer classes named across company-issued materials.
        - id: storage-asset
          label: Storage asset
          detail: SolidFlow is marketed as 10+ hour, multi-hour dispatchable storage for grid and critical-load applications.
        - id: operating-use
          label: Operating use
          detail: The published use case is to store oversupplied renewable energy, discharge during peak demand, and reduce curtailment or grid expansion needs.
        - id: monetization
          label: Monetization example
          detail: The grid example cites up to €20M annual revenue on a 100 MW / 1,000 MWh system at €40–80/MWh spreads and about 250 cycles per year.
        - id: project-return
          label: Project return
          detail: The same example cites a 5-8 year payback, so customer economics depend on site-specific spreads and utilization.
        - id: scale-funding
          label: Scale funding loop
          detail: Series C proceeds are earmarked for manufacturing scale-up and early deployments while independent coverage says deliveries under the Uniper framework start in 2027.
      edges:
        - { from: target-markets, to: storage-asset, label: "buyer demand" }
        - { from: storage-asset, to: operating-use, label: "asset used for" }
        - { from: operating-use, to: monetization, label: "drives" }
        - { from: monetization, to: project-return, label: "supports" }
        - { from: project-return, to: scale-funding, label: "must justify" }
    approximationNotes: The revenue and payback nodes are company scenarios, not realized portfolio averages.
    claimRefs: [CI002, CI003, CI005, CI006, CI007]
callouts:
  - calloutType: insight
    title: Best public proof is still scenario economics
    body: The strongest customer-economics evidence is a company-published grid example with spread, cycles, annual revenue, and payback assumptions; it is useful for framing value capture but it is not the same as disclosed realized pricing, gross margin, or booked revenue.
    claimRefs: [CI004, CI005, CI006]
  - calloutType: risk
    title: Capital needs arrive before revenue quality is visible
    body: The company is scaling from a live 1 GWh site toward a multi-site footprint while independent reporting says the latest financing round remains open and major framework deliveries start in 2027, leaving financing dependency as a core underwriting risk.
    claimRefs: [CI007, CI009, CI011]
  - calloutType: recommendation
    title: Financial diligence must start with management accounts
    body: A credible next step is to request monthly management accounts, plant-level capex plans, gross-margin detail, and the full Uniper framework so investors can separate technical promise from financeable revenue and runway.
    claimRefs: [CI012, CI013]
