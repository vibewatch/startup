callouts:
- calloutType: insight
  title: Scale proof is deployment-led, not disclosure-led
  body: The assigned pool makes Tekion look commercially real through dealer-group wins, OEM coverage, and financing history, but it does not offer the same clarity on current revenue, margin, or workforce efficiency. Later chapters should therefore separate adoption proof from unit-economics proof.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
- calloutType: risk
  title: Founder centrality and migration friction still shape downside risk
  body: Tekion has broadened its leadership bench, but the public narrative still centers heavily on Jay Vijayan and on execution versus entrenched incumbents. Third-party comparison reviews frame migration cost and specialty-workflow maturity as constraints, but they are directional reviews rather than independent operating benchmarks; VendorMotive separately records the litigation signal.
  claimRefs:
  - CO002
  - CO013
  - CO015
  - CO016
