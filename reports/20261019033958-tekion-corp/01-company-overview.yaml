company:
  name: Tekion Corp
chapter:
  number: 1
  title: Company Overview
  summary: 'Tekion is a late-stage private automotive retail software company founded in 2016 by former Tesla CIO Jay Vijayan, with a cloud-native dealer-management platform, conflicting secondary estimates of $640 million to approximately $665 million in cumulative funding, and roughly 3,000 dealership locations deployed by 2025-2026. Scale and deployment momentum are visible, but exact current revenue, headcount, governance, and capital-structure details remain only partially public.'
sections:
- id: identity-and-platform
  title: Identity and platform scope
  body: Tekion is a U.S.-based private software company in automotive retail, founded in 2016 and headquartered in Pleasanton, California. The assigned evidence consistently describes its core product as Automotive Retail Cloud (ARC), a cloud-native dealer-management platform intended to replace legacy on-premise systems. Tekion and independent marketplace profiles describe a unified workflow across sales, service, parts, accounting, CRM, and digital retail, with AI-native or agentic positioning layered on top. That framing matters because the company overview chapter should establish the product boundary that later market, customer, and risk chapters test rather than assume, including where current claims remain marketing-led instead of independently benchmarked.
  claimRefs:
  - CO001
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: leadership-capital-and-scale
  title: Leadership, capital base, and operating scale
  body: 'Public background on Tekion is still founder-centric. Jay Vijayan is the central identity anchor in the available evidence, with Guru Sankararaman disclosed as co-founder and COO and Binu Mathew added as CTO during the company''s AI expansion. Financing history is better documented than current economics: the assigned evidence shows a 2020 unicorn round, a 2021 Series D at a $3.5 billion valuation, and a 2024 Dragoneer round at roughly or above $4 billion. Secondary sources disagree on cumulative funding, reporting $640 million versus approximately $665 million. Public scale proof is deployment-led rather than disclosure-led: rooftops and OEM programs are visible, while exact revenue, margin, and headcount remain less cleanly supportable.'
  claimRefs:
  - CO002
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO013
  tableRefs:
  - TO002
  - TO003
- id: milestones-deployments-and-frictions
  title: Milestones, deployments, and competitive frictions
  body: 'Tekion''s recent milestones show both momentum and friction. The evidence records marquee dealer-group wins such as Asbury, Ken Garff, and Hartwell, plus 2025-2026 product and ecosystem updates around AI Agents, Automotive Partner Cloud growth claims, and new partner integrations. At the same time, competitive tension is not abstract: VendorMotive records a December 2024 antitrust lawsuit against CDK Global, and commercial comparison sources repeatedly warn that full-platform migration, workflow maturity in complex dealership environments, and installed-base disadvantage remain real adoption constraints. Those comparisons are directional reviews rather than independent operating benchmarks. Later chapters should therefore treat Tekion as a credible scaling challenger, but not as a fully de-risked incumbent replacement.'
  claimRefs:
  - CO005
  - CO006
  - CO012
  - CO014
  - CO015
  - CO016
  figureRefs:
  - FO001
