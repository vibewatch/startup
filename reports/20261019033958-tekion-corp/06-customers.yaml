artifact: customers
slug: tekion-corp
runDate: 2026-10-19
company:
  name: Tekion Corp
chapter:
  number: 6
  title: Customers
  summary: >-
    Tekion has credible public adoption proof beyond logo walls: multiple
    independent sources place the platform at roughly 3,000 dealership
    rooftops/locations and name large dealer groups such as Asbury, Ken Garff,
    and Hartwell as deployments or expansion references. The customer story is
    strongest in multi-rooftop franchise operations and workflow-heavy fixed
    operations, but durability still rests on deployment/review proxies because
    public NRR, churn, contract-mix, and customer concentration data are not
    disclosed in the assigned evidence pool.
sections:
  - id: customer-base-and-workflow-fit
    title: Customer base and workflow fit
    body: >-
      The public evidence points to Tekion selling primarily into franchised
      automotive retail operators rather than into a broad SMB horizontal
      software base. Tekion's own positioning is broad at the workflow level:
      it describes Automotive Retail Cloud as an end-to-end AI-native platform
      spanning DMS, CRM, digital retail, service, parts, and accounting
      workflows, while its AI-native DMS narrative emphasizes in-workflow
      agents rather than stand-alone copilots. Third-party marketplace evidence
      narrows the most visible user personas to dealership general management,
      fixed-ops leadership, service managers, and parts managers. That
      combination suggests the buying center is the dealer principal / GM or a
      group-level operations leader, with daily usage concentrated in
      department-level operators who benefit from fewer handoffs and unified
      data across service, parts, sales, and accounting.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-expansion
    title: Adoption proof and expansion
    body: >-
      Adoption proof is stronger than a simple customer-logo page but weaker
      than a full cohort disclosure. Independent comparison and review sources
      consistently place Tekion at about 3,000 dealership rooftops or
      locations, which is material scale for a post-2016 entrant attacking a
      legacy DMS duopoly. Publicly named proof is concentrated in large dealer
      groups and franchise ecosystems: external sources name Asbury and Ken
      Garff as deployments, point to Hartwell Automotive Group as a 2025 UK
      expansion reference, and describe Tekion as supporting 52 OEM brands or
      programs. Customer-review evidence is present but still shallow: the best
      structured public signal in the pool is an aggregated 40-review footprint
      on review sites, which is useful directional proof of live usage but not
      enough to infer broad satisfaction or renewal quality by segment.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration-risks
    title: Durability and concentration risks
    body: >-
      Durability remains the least-proven part of the customer story. The
      assigned evidence suggests DMS contracts are typically multi-year and
      that procurement must be scoped around rooftop count, modules, and
      migration work, which supports the idea that wins can be sticky once
      deployed. But the same pool also includes concrete adoption-friction
      signals: users reporting workflow regressions, pricing errors, unresolved
      support tickets, and rollout timelines that exceed initial estimates.
      That mix argues for a nuanced view: Tekion appears capable of landing
      large, complex dealership groups, yet the public proof does not disclose
      NRR, GRR, logo churn, top-customer share, or contract-length
      distribution. Until those denominators are produced in diligence, the
      customer base looks real and expanding, but concentration and renewal
      quality remain underwritten by proxies rather than hard retention data.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / evidence
      - Revenue or strategic value
      - Gap
    rows:
      - - Large franchise dealer groups
        - Group CIO / GM / dealer principal as buyer; departmental operators as users
        - Replace legacy DMS with a unified cloud platform across sales, service, parts, CRM, and accounting
        - External sources place Tekion near 3,000 rooftops / locations and name Asbury and Ken Garff
        - Largest visible proof base; supports enterprise land-and-expand thesis
        - No public customer-count split by group size, ARR, or contract value
      - - Service departments / fixed ops
        - GMs, Fixed Ops Directors, Service Managers
        - Appointment scheduling, repair approvals, advisor and technician workflow automation
        - Named by marketplace evidence and reinforced by Tekion AI workflow descriptions
        - Fixed ops can drive recurring usage and retention inside an account
        - No public utilization, renewal, or ROI denominators by department
      - - Parts departments
        - GMs, Fixed Ops Directors, Parts Managers
        - Inventory movement, back-counter workflow, wholesale e-commerce support
        - Named by marketplace evidence as a distinct operational audience
        - Broadens account footprint beyond front-office DMS replacement
        - No public attach-rate or departmental adoption data
      - - Multi-brand franchise ecosystems / OEM-aligned groups
        - Dealer groups paying for franchise-compliant workflows; operations teams as users
        - OEM-certified or OEM-compatible DMS / CRM deployment across multiple brands
        - External sources cite 52 OEM brands / programs supported
        - Expands TAM among complex, multi-brand operators
        - Brand- and region-level certification coverage is not fully disclosed in the pool
    notes: >-
      Mixes official positioning with marketplace and comparison-source
      segmentation; no public source in the assigned pool discloses revenue by
      segment, so strategic value is directional rather than quantified.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU008]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Deployment footprint
        - ~3,000 rooftops / locations
        - 2025-2026
        - VendorMotive and RFP.wiki
        - Medium
        - Confirms non-trivial installed base for a modern DMS entrant
        - No breakdown by active dealer groups, module mix, or paid accounts
      - - OEM / franchise program reach
        - 52 OEM brands / programs supported
        - 2025-2026 references
        - VendorMotive and Wikipedia
        - Medium
        - Supports expansion into multi-brand franchise groups
        - No split between certified live deployments and broader compatibility claims
      - - Public review footprint
        - 4.6 average across 40 total reviews; Capterra 4.2 across 39 reviews
        - Undated current snapshot
        - RFP.wiki
        - Medium
        - Indicates real user footprint beyond logos
        - Review volume is too small and too aggregated to infer GRR / NRR
      - - Named international expansion proof
        - Hartwell Automotive Group cited as UK expansion reference
        - Sep 2025
        - VendorMotive
        - Medium
        - Shows Tekion moving beyond North American deployment proof
        - No public store count, live date, or outcome metrics for the UK rollout
    notes: >-
      Values preserve source wording and time windows; none of these rows
      provide the retention, customer-concentration, or monetization
      denominators needed for a full durability model.
    claimRefs: [CU005, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / program
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / signal
      - Limitation
    rows:
      - - Asbury Automotive
        - Large public US dealer group
        - ARC deployment reference in external summaries
        - Production reference
        - Shows Tekion can win attention from scaled franchise operators
        - No public module footprint, renewal data, or quantified outcome in the assigned pool
      - - Ken Garff Automotive
        - Large multi-brand dealer group
        - ARC deployment reference across 27 brands / 70+ stores
        - Production reference
        - Indicates suitability for complex, multi-store operations
        - No public implementation timeline, ROI, or retention metrics
      - - Hartwell Automotive Group
        - UK dealer group / international expansion
        - 2025 UK deployment / expansion reference
        - Production reference
        - Demonstrates international expansion beyond North America
        - No public outcome or rollout-depth disclosure
    notes: >-
      This is a partial enumeration of named proof visible in the assigned pool,
      not an exhaustive customer list; it emphasizes publicly named accounts
      with some deployment context rather than raw logo pages.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates the named dealer groups explicitly visible in the assigned
        external sources for this chapter, limited to references that provide
        some deployment or expansion context rather than logos alone.
    claimRefs: [CU006, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Tekion's adoption path appears to start with executive DMS evaluation,
      spread through fixed operations and parts, and then get tested at renewal
      against rollout and support friction.
    data:
      nodes:
        - label: Executive DMS shortlist
          actor: Dealer principal / GM / group operations leader
          phase: Initial evaluation
          channel: Competitive DMS bake-off
          tone: neutral
          touchpoints:
            - Compare unified DMS, CRM, digital retail, service, and accounting scope
            - Check OEM program compatibility for a multi-brand store base
        - label: Service-department rollout
          actor: Fixed Ops Director / Service Manager
          phase: First operational adoption
          channel: Fixed operations
          tone: positive
          touchpoints:
            - Appointment scheduling and reminders
            - Advisor summaries and service recommendations
            - Faster repair approvals and retention-oriented service workflows
        - label: Technician workflow adoption
          actor: Technician / service lane leadership
          phase: AI workflow expansion
          channel: Service lane
          tone: positive
          touchpoints:
            - Inspection recommendations across the service lane
            - In-workflow AI actions rather than separate copilots
        - label: Parts workflow expansion
          actor: Parts Manager
          phase: Cross-department expansion
          channel: Parts operations
          tone: positive
          touchpoints:
            - Inventory movement and back-counter workflow
            - Wholesale e-commerce support for parts operations
        - label: Multi-rooftop standardization
          actor: Dealer-group leadership
          phase: Group-level scaling
          channel: Reporting and governance
          tone: positive
          touchpoints:
            - Centralized reporting and standardized workflows
            - OEM-program breadth that fits complex franchise groups
        - label: Renewal risk checkpoint
          actor: CIO / operations leadership
          phase: Post-go-live review
          channel: Support and contract renewal
          tone: adverse
          touchpoints:
            - Workflow regressions and pricing errors after migration
            - Unresolved support tickets and extended dual-run timelines
            - Renewal and exit terms need scrutiny because public retention metrics are absent
    approximationNotes: >-
      Journey stages are synthesized from role-based workflow evidence and
      adverse rollout commentary; the figure shows likely adoption sequence, not
      measured conversion rates between stages.
    claimRefs: [CU001, CU002, CU003, CU004, CU010, CU011, CU013]
callouts:
  - calloutType: strength
    title: Named-proof quality is stronger than a logo wall
    body: >-
      Tekion's public customer evidence clears a meaningful quality bar because
      the pool contains deployment-scale estimates, named dealer-group
      references, review-site footprints, and an international expansion
      reference rather than relying only on logo pages or self-asserted
      customer counts.
    claimRefs: [CU005, CU006, CU007, CU009]
  - calloutType: risk
    title: Durability is inferred, not directly disclosed
    body: >-
      Multi-year contracts and complex migration work imply stickiness, but the
      same evidence pool surfaces post-migration friction while omitting NRR,
      GRR, churn, concentration, and contract-distribution data. That means the
      renewal thesis still needs management-provided cohort evidence.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
