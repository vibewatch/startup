      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 架构是 Tekion 最清晰的胜点
            body: 保留的官方资料和 Vendormotive 证据一致将 Tekion 描述为统一的云原生运营模型，而不是托管式传统系统；因此，大多数独立比较都认为它在用户体验和数据流转上拥有最清晰的产品层优势。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
          - type: callout
            title: 真正的竞争者往往是迁移摩擦
            body: Tekion 不必在功能对比中落败才会输掉交易；只要 OEM、F&I、CRM 或报表依赖让经销商认为今年继续使用既有系统在经济上更安全，它就可能丢单。
            calloutType: risk
            claimRefs:
