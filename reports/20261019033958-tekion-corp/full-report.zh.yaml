  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据一致将 Tekion 描述为通过企业合同销售的云原生经销商运营系统，而非透明标价的软件。产品组合覆盖 DMS、CRM、售后、零部件、会计、支付和面向 OEM
              的产品，意味着存在多种变现杠杆，但只有部分杠杆被具体描述。最强的直接定价信号是负面的：Tekion 不公布 ARC
              的标准价格，第三方资料称报价取决于经销商数量、许可模块和合同条款。因此，标价不能用于投资判断；实际价格、折扣、合同期限、模块附加率和净收入留存率仍未披露。一份独立的创业公司资料将其模式描述为经常性软件订阅加按交易收费，这有助于勾勒收入机制，但不足以按产品线估算单位贡献或利润率。非官方市场讨论指向较宽的单店月度价格区间，说明客户经济性很可能会随门店规模、模块组合和服务范围显著变化，而不是落在单一
              SaaS 价格点上。
