chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台边界
        blocks:
          - type: paragraph
            body: >-
              Tekion 是一家总部位于美国、服务汽车零售行业的私营软件公司，成立于 2016 年，总部位于加州 Pleasanton。现有证据一致将其核心产品描述为 Automotive Retail
              Cloud（ARC），这是一套旨在替代传统本地部署系统的云原生经销商管理平台。Tekion 及独立市场资料将其描述为覆盖销售、售后、零部件、会计、CRM 和数字零售的统一工作流，并在其上叠加 AI
              原生或智能代理定位。这一界定很重要：公司概览应先明确产品边界，供后续市场、客户和风险章节检验，而不是预先假定；同时也要标出当前哪些说法仍由营销驱动、尚未经过独立基准验证。
