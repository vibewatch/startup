      - number: '3.2'
        title: 切换成本、定价不透明与合作伙伴力量决定真实竞争
        blocks:
          - type: paragraph
            body: >-
              公开价格过于不透明，无法构成单纯的标价竞争。保留的比较来源一致将 Tekion、CDK 和 Reynolds
              描述为以报价为主导的企业销售，只有估算的公开价格区间，没有适合投资判断的供应商计划矩阵。因此，真正的竞争转向转换经济性和合同结构。Tekion 保留的官方指引描述了约 120 天的实施路径，以及上线后进一步
              60-90 天的优化期；独立比较则称完整迁移仍需数月，且经常比销售承诺更久。CDK 和 Reynolds 带来另一种摩擦：买方已经依赖的深厚 OEM 与第三方覆盖，以及更重的正式锁定，Reynolds
              尤其如此。实际上，分销力量来自 DMS 周围既有的工作流网络，而不只是软件收费这一行。
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP011
              - CP016
      - number: '3.3'
        title: Tekion 的护城河来自架构，但既有厂商的深度仍限制份额获取
        blocks:
          - type: paragraph
            body: >-
              Tekion 的优势最集中在既有厂商较弱的地方：统一数据、云原生部署、现代化的服务车道体验，以及嵌入同一平台而非外挂的 AI 功能。保留的官方资料和 Vendormotive
              描述在核心判断上是一致的：Tekion 试图把 DMS、CRM、售后、零部件、会计和 AI 工作流压缩进同一个运营模型。这一差异化确实存在，但还不等于掌控市场。同一批称赞 Tekion
              架构的第三方比较资料，也警告其份额较小、连接器成熟度不均、部署时间长于承诺，以及上线后的支持质量存在波动。因此，竞争持久性不取决于 Tekion
              的产品是否现代，而取决于它能否为谨慎的多门店经销商集团消除足够多的迁移风险，让它们愿意切换。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP012
              - CP013
