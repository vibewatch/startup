      - number: '2.3'
        title: 采用驱动、规模代理指标与门槛约束
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个受约束的规模化判断：美国特许经销商仍运行在老旧的既有系统上，因此可触达机会足够大；但实施负担、迁移成本、OEM 与生态依赖，以及公开价格定制化且常面向企业客户，都会压缩可触达需求。2024 年
              CDK 宕机事件把韧性和供应商锁定变成明确采购标准，创造了新的评估触发点；Tekion 的统一架构和 API
              能力，则为寻求实时运营、减少中间件收费的经销商提供了清晰叙事。即便如此，现有证据没有按细分市场或地理区域提供可辩护的公开美元
              TAM/SAM/SOM。因此，本章可以支持市场人口、存量基础和转换成本三个视角，但无法给出 Tekion 可赢得市场的清晰收入池估算。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
