        blocks:
          - type: paragraph
            body: >-
              公开来源和第三方资料一致将 Tekion 的 Automotive Retail Cloud 描述为覆盖广泛的经销商运营系统，而非单点应用。产品在同一个云环境中覆盖
              DMS、CRM、数字零售、售后、零部件、会计、薪资、支付和分析，这是 Tekion 面向替换传统系统栈的特许经销商所作推介的核心。独立评测也收窄了买方匹配：Tekion
              似乎最适合愿意替换多个既有系统的特许经销商和多门店集团；评测者则反复表示，独立经销商在品类和价格上都不匹配。这一定位很重要，因为产品深度无法与实施范围分开；同样的广度既能形成工作流杠杆，也会让切换变成一次完整的运营事件。
            claimRefs:
