    title: 看涨、基准与看跌估值情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 看涨
        - 据报道 ARC 收入增长 60% 得以延续；企业部署保持，实施质量改善
        - 估值可能高于据报道的 $4B 融资估值，但仅凭公开信息无法支持溢价或目标回报
        - 只有在一手增长、留存和利润率得到验证后，信号才为正面
        - 尽管部署扩张，增长或留存仍未达标
      - - 基准
        - 采用率继续提升，但部署摩擦和披露不完整仍在
        - 没有可辩护的公允价值区间；仅将 $4B 作为历史融资参考
        - 中性，因为产品证据与估值证据并不匹配
        - 按当前要价，尚无经审计、能带来有吸引力回报的路径
      - - 看跌
        - 实施问题持续、CRM 替换成本上升，或诉讼和疲弱经济性限制增长
        - 低价轮融资，或估值低于据报道的 $4B；没有资本结构和现金数据，无法估算幅度
        - 如果客户参考或财务尽调与公开增长信号相矛盾，信号为负面
