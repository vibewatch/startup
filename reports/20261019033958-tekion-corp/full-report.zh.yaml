      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              保留的证据支持一个直接的融资历史判断，但不足以完成流动性评估。多份独立资料称 Tekion 累计融资约 $665 million，最近于 2024 年 7 月完成由 Dragoneer 领投、估值超过 $4
              billion 的 $200 million 轮融资。这些事实说明公司仍能获得成长资本，也说明投资者愿意为拥有 OEM
              关系和企业部署的品类挑战者提供资金。但它们无法证明当前现金余额、债务义务、烧钱、现金跑道、契约余量，或避免下一轮融资所需的收入增速。即使最详尽的第三方财务资料，也只提供估算收入和公司自报的增长片段，而不是经审计的当前期间报表。因此，仅从公开证据看，公司财务状态更像风险资本支持型而非自我造血型；近期资本可能降低了即时融资压力，但下一轮触发点和真实资本充足性仍属于私有数据问题。
            claimRefs:
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Tekion 的收入质量逻辑在公开信息中看似合理，但仍不完整。公司销售关键任务软件，采用私有企业合同，并拥有嵌入式支付和靠近集成环节的变现选项；经销商集团上线后，这些都可能支撑黏性收入。反面是，DMS
              迁移在运营上具有扰动性且成本高，因此实施质量、服务效率和合作伙伴准备度会直接影响毛利率和回本期。公开证据支持产品范围广、融资渠道可用的判断，却不足以构建清晰的投资模型。在判断利润率路径或估值支撑前，投资者需要管理层级别的披露，包括按产品拆分的
              ARR、实施/服务组合、支付抽成率、按业务线划分的毛利率、客户集中度、流失、烧钱和剩余现金跑道。在这些信息提供之前，合理的财务判断应是带有实质尽调阻碍的有条件信心，而不是精确结论。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI014
              - CI016
