          - type: callout
            title: 资本风险如今是证据问题，而非融资问题
            body: 公开来源暗示 Tekion 有能力继续融资，但保留的证据仍无法证明当前烧钱、现金跑道或已实现盈利。
            calloutType: assumption
            claimRefs:
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              当前建议是继续研究，信心中低、风险中高，且估值立场尚无证据支持。VendorMotive 报道 Tekion 五轮融资累计约 $665 million，其中包括 2024 年 7 月由 Dragoneer
              领投、估值 $4 billion 的 $200 million 轮融资；这只是融资定价，不代表今天可用的现金或当前公允价值。同一来源估算年收入为 $100 million 至 $200
              million，但保留的证据没有提供经审计的收入、ARR、毛利率、EBITDA、现金流或优先权条款。因此，不能仅凭公开输入负责任地判断目标回报或持有期。任何价格建议前，进入纪律都应要求原始财务数据和完全稀释后的优先权瀑布。
            claimRefs:
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是 Tekion 拥有可信的产品和采用信号：公司材料描述统一的实时数据模型，VendorMotive 报道截至 2025 年约有 3,000
              家经销商门店，独立市场资料也将其描述为统一的云原生平台。反论点是运营问题，而非概念问题。DealerRefresh 汇总 13 个社区讨论后称，实施质量不稳定、人员不足，部分经销商集团使用的 CRM
              不完整，路线图说法与生产准备度之间存在差距。同一评测称，一些切换客户的技术支出明显下降，但这些说法并非经审计的客户经济性。产品架构和客户需求因此改善了尽调逻辑，却没有解决部署质量或估值支撑。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              情景分析应保持方向性，因为保留的证据池没有一组可辩护的上市公司、并购或私募轮次倍数，能够匹配增长、利润率、留存和资本结构数据。乐观情景要求报告的 ARC 收入增长 60%
              得到验证并持续、企业部署保持韧性且实施改善；这可能支持重新测试高于已报告融资定价的价值，但没有量化溢价。基准情景只把 $4 billion
              视为上一轮已报告融资参考，不给出公允价值区间。悲观情景是估值低于该水平的下轮融资：如果部署摩擦、功能不完整、诉讼成本或薄弱的单位经济性损害增长，就可能发生。CDK 和 Reynolds
              是运营参考，而非本证据集中的独立估值基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 决策逻辑、退出准备度与打破论点的触发点
        blocks:
          - type: paragraph
            body: >-
              决策链从可信的品类颠覆和已报告采用开始，再对实施风险、法律不确定性、未披露定价和财务披露缺失进行折价。Law360 的案件时间线显示，Tekion 的垄断主张在 2025 年 7 月挺过了驳回请求，但法院后来在
              2026 年 8
              月拒绝了修改请求；这两件事都不能证明最终案情或财务结果。因此，退出准备度尚未得到证明。投资前，应取得经审计的客户群组留存、毛利率、现金烧钱、现金跑道、客户集中度、部署时间表、当前资本结构和清算优先权。打破论点的触发点包括经验证的增长放缓、持续的多门店实施失败、重大的
              CRM 替换成本，或使入场价格无法实现目标回报的优先权过剩。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
