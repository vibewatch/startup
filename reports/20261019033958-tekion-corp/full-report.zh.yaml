  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：三大阵营加一条替代路径
        blocks:
          - type: paragraph
            body: >-
              保留的证据支持美国特许经销商 DMS 市场存在三种主要企业选择：CDK Global 是规模型既有厂商，Reynolds & Reynolds 是高度锁定的高端既有厂商，Tekion
              则是云原生挑战者。Vendormotive 明确将 Tekion 与 CDK、Reynolds 对比，并列出 DealerBuilt、Dealertrack DMS、DealerSocket、Auto/Mate
              和 Quorum
              等其他挑战者；但相比前三者，保留的证据池对这些第二梯队选项的覆盖薄得多。这一点对尽调很重要：核心承保问题不是理论上有没有替代方案，而是替代方案能否在真实经销商环境中替换承重的既有系统栈。替代路径同样重要。USTech
              的比较认为，许多门店会理性地保留既有 DMS，再在其周围叠加定向工作流自动化，因为替换记录系统的风险可能超过更简洁界面或更快售后流程带来的收益。
            claimRefs:
              - CP005
              - CP007
              - CP012
              - CP014
              - CP015
