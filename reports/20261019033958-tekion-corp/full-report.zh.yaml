        title: 展示材料
        blocks:
          - type: callout
            title: 经济战场是替换，而不是新增软件支出
            body: Tekion 的市场逻辑依赖于说服经销商替换既有记录系统及其周边中间件，因此转换摩擦和月费同样重要。
            calloutType: insight
