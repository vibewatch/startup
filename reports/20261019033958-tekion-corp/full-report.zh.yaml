        title: 管理层、资本基础与运营规模
        blocks:
          - type: paragraph
            body: >-
              公开背景资料对 Tekion 的描述仍以创始人为中心。现有证据中，Jay Vijayan 是身份锚点；Guru Sankararaman 被披露为联合创始人兼 COO，Binu Mathew 则在公司扩展 AI
              业务期间加入并担任 CTO。融资历史比当前经营数据更完整：证据显示公司在 2020 年完成独角兽轮融资，2021 年完成估值 $3.5 billion 的 D 轮融资，2024 年完成估值约为或高于 $4
              billion 的 Dragoneer 轮融资。二手来源对累计融资额存在分歧，分别报道为 $640 million 和约 $665 million。公开规模证据主要来自部署而非披露：门店数和 OEM
