      - number: '1.3'
        title: 里程碑、部署与竞争摩擦
        blocks:
          - type: paragraph
            body: >-
              Tekion 近期的里程碑既体现动能，也暴露摩擦。证据记录了 Asbury、Ken Garff 和 Hartwell 等知名经销商集团的签约，以及围绕 AI Agents、Automotive Partner
              Cloud 增长说法和新合作伙伴集成的 2025-2026 年产品与生态更新。与此同时，竞争压力并非抽象概念：VendorMotive 记录了 2024 年 12 月针对 CDK Global
              的反垄断诉讼，商业比较资料也反复警告，整个平台迁移、复杂经销商环境中的工作流成熟度，以及既有客户基础劣势，仍是现实的采用约束。这些比较是方向性评测，而非独立运营基准。因此，后续章节应将 Tekion
              视为可信的规模化挑战者，但不能把它当成已经完全去风险的传统系统替代者。
