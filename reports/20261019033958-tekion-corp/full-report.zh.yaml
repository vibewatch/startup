        low: 封闭式传统技术栈
        high: 开放式云原生技术栈
        description: 1-5 ordinal score derived from retained evidence
        scale: ordinal
      yAxis:
        label: 当前对大型特许经销商的运营适配度
        min: 1
        max: 5
        low: 细分或辅助型
        high: 广泛的既有系统适配
        description: 1-5 ordinal score derived from retained evidence
        scale: ordinal
      points:
        - label: Tekion
          x: 5
          'y': 4
          summary: >-
            Open, unified architecture with lower formal lock-in, but fit still depends on connector diligence and
            migration execution.
          claimRefs:
            - CP002
            - CP010
            - CP011
            - CP013
        - label: CDK Global
          x: 2
          'y': 5
          summary: Incumbent breadth and OEM depth still make CDK the default fit for many complex franchise groups.
          claimRefs:
            - CP005
            - CP006
            - CP010
        - label: Reynolds & Reynolds
          x: 1
          'y': 4
          summary: Strong incumbent stability and field support are offset by the most restrictive ecosystem and exit path.
          claimRefs:
            - CP007
            - CP016
        - label: Dealertrack DMS
          x: 3
          'y': 3
          summary: >-
            Named in retained evidence as a real alternative, but the pool is shallower on deployment depth than for the
            top three.
          claimRefs:
            - CP014
        - label: DealerBuilt / Quorum 类
          x: 3
          'y': 2
          summary: Secondary challengers exist, yet the retained evidence is too thin to rate them as scale-equal incumbents.
          claimRefs:
            - CP014
        - label: 现状 + 工作流层
          x: 4
          'y': 1
          summary: >-
            Adjunct automation can improve follow-up and routing, but it does not replace the dealership system of
            record.
          claimRefs:
            - CP015
            - CP016
    approximationNotes: 1–5 的序数坐标综合了保留证据中关于架构开放性和当前企业适配度的信息；它们不是经过测量的市场份额或满意度分数。
    claimRefs:
      - CP010
      - CP011
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持企业报价、实施、经常性订阅和交易关联变现这一顺序，但不支持后续毛利计算。
    data:
      nodes:
        - id: n1
          label: 经销商屋顶门店与模块范围
          detail: 私人报价取决于屋顶门店数量、获授权模块和合同条款。
        - id: n2
          label: 实施与数据转换
          detail: 从启动到上线的方法论约需 120 天，且需要在上线前 90–100 天取得源数据。
        - id: n3
          label: 上线与采用爬坡
          detail: 团队可能需要经过 60–90 天的运营使用，Tekion 工作流才会变得熟练自然。
        - id: n4
          label: 经常性软件订阅
          detail: ARC 的核心变现基于订阅，但公开资料没有列出价格。
        - id: n5
          label: 交易与支付费用
          detail: 第三方公司简介称存在按交易收取的费用；支付处理的经济性仍未披露。
        - id: n6
          label: 毛利与现金创造
          detail: 公开来源没有披露当前毛利率、烧钱速度或现金续航。
    approximationNotes: 这是结构性流程图，不是量化瀑布图；公开证据不支持收入到毛利的数值转换。
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI008
      - CI009
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Tekion 的架构被呈现为分层的经销商运营技术栈，以统一核心为基础，而不是由彼此分离的部门系统组成。
    data:
      layers:
        - label: 面向经销商的渠道
          detail: 展厅、服务通道、支付和数字零售中的员工及客户互动。
          modules:
            - 销售
            - 服务通道
            - 零件柜台
            - F&I
            - 数字零售
          outputs:
            - 统一的经销商工作流
          note: Evidence comes from product descriptions and independent summaries.
          tone: positive
        - label: 部门工作流
          detail: 核心业务模块执行销售、CRM、服务、零件、会计、工资和支付流程。
          modules:
            - DMS
            - CRM
            - 服务
            - 零件
            - 会计
            - 工资
            - 支付
          outputs:
            - 跨部门执行
          tone: positive
        - label: 共享数据层
          detail: 独立来源反复描述单一数据库或单一实时数据模型，不需要批量同步。
          modules:
            - 客户记录
            - 维修工单
            - 库存
            - 财务历史
          outputs:
            - 实时可见性
          tone: positive
        - label: 嵌入式 AI 层
          detail: AI 智能体和 T1 Pro 的营销说法是，它们直接在工作流内运行，而不是在工作流旁边运行。
          modules:
            - Service Scheduler AI
            - Service Advisor AI
            - Technician AI
            - T1 Pro
          outputs:
            - 建议与任务执行
          tone: positive
        - label: 合作伙伴与 OEM 边界
          detail: APC 集成和 OEM 认证将核心平台延伸到经销商特有的生态系统。
          modules:
            - 高级 API
            - Webhook
            - FTP 数据流
            - OEM 项目
          outputs:
            - 外部系统连接
          tone: warning
        - label: 信任与控制边界
          detail: 安全和负责任 AI 资质是销售过程的一部分，但生产环境保障仍需尽调。
          modules:
            - ISO 42001
            - ISO 27001
            - SOC 2 Type II
            - SOC 1 Type II
            - ISO 27701
          outputs:
            - 受治理的 AI 与合规状态
          tone: warning
    approximationNotes: 概念性分层图综合了官方和独立来源；它展示的是产品结构与依赖关系，而不是披露的逐租户技术设计。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Tekion 的采用路径似乎从高管层 DMS 评估开始，扩展到固定运营和零件部门，随后在续约时接受上线与支持摩擦的检验。
    data:
      nodes:
        - label: 高管层 DMS 入围
          actor: Dealer principal / GM / group operations leader
          phase: Initial evaluation
          channel: Competitive DMS bake-off
          tone: neutral
          touchpoints:
            - Compare unified DMS, CRM, digital retail, service, and accounting scope
            - Check OEM program compatibility for a multi-brand store base
        - label: 服务部门上线
          actor: Fixed Ops Director / Service Manager
          phase: First operational adoption
          channel: Fixed operations
          tone: positive
          touchpoints:
            - Appointment scheduling and reminders
            - Advisor summaries and service recommendations
            - Faster repair approvals and retention-oriented service workflows
        - label: 技师工作流采用
          actor: Technician / service lane leadership
          phase: AI workflow expansion
          channel: Service lane
          tone: positive
          touchpoints:
            - Inspection recommendations across the service lane
            - In-workflow AI actions rather than separate copilots
        - label: 零件工作流扩展
          actor: Parts Manager
          phase: Cross-department expansion
          channel: Parts operations
          tone: positive
          touchpoints:
            - Inventory movement and back-counter workflow
            - Wholesale e-commerce support for parts operations
        - label: 多屋顶门店标准化
          actor: Dealer-group leadership
          phase: Group-level scaling
          channel: Reporting and governance
          tone: positive
          touchpoints:
            - Centralized reporting and standardized workflows
            - OEM-program breadth that fits complex franchise groups
        - label: 续约风险检查点
          actor: CIO / operations leadership
          phase: Post-go-live review
          channel: Support and contract renewal
          tone: adverse
          touchpoints:
            - Workflow regressions and pricing errors after migration
            - Unresolved support tickets and extended dual-run timelines
            - Renewal and exit terms need scrutiny because public retention metrics are absent
    approximationNotes: 旅程阶段综合了按角色划分的工作流证据和不利的上线评论；本图展示的是可能的采用顺序，不是各阶段之间经过测量的转化率。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 即使计入公开缓释因素，迁移与依赖风险仍是最高的剩余暴露。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重程度
      rows:
        - label: 迁移执行
          values:
            - label: 高
              tone: high
              note: 保留的对比资料反复出现六至九个月迁移周期和报价延迟。
            - label: 高
              tone: high
              note: 核心经销商工作流需要一起迁移，因此切换错误会影响销售、服务、零件和会计。
            - label: 中
              tone: medium
              note: 供应商称有迁移团队并采用分阶段上线，但公开证明仍只有零散个案。
            - label: 高
              tone: high
              note: 大型集团部署仍暴露于连接器遗漏和生产率拖累。
        - label: 集成依赖
          values:
            - label: 高
              tone: high
              note: 公开来源仍指出细分贷款方、F&I 和专业工具存在缺口。
            - label: 高
              tone: high
              note: 缺少一个必需连接器，就可能延迟收入获取，或迫使团队采用人工变通方案。
            - label: 中
              tone: medium
              note: 250+ 个合作伙伴和开放 API 有帮助，但不等于每个工作流都已证明实现功能对等。
            - label: 高
              tone: high
              note: 在评估部署风险前，仍需要买方特定的连接器证明。
        - label: OEM 与合规覆盖
          values:
            - label: 中
              tone: medium
              note: Tekion 展示了广泛的 OEM 覆盖，但公开对比仍指出地区和工作流例外。
            - label: 高
              tone: high
              note: 即使核心技术栈很强，认证缺口也可能阻碍目标特许经销商组合上线。
            - label: 中
              tone: medium
              note: 现有认证是真正的缓释因素，但不能替代工作流层面的验证。
            - label: 中
              tone: medium
              note: 只有在审阅特定品牌的证明和实际客户参考后，剩余暴露才会下降。
        - label: 安全与资本证明
          values:
            - label: 中
              tone: medium
              note: 保留证据中没有出现 Tekion 的重大公开事故，但未来规模化才是更难的考验。
            - label: 高
              tone: high
              note: 如果迁移期间发生严重宕机或资本紧缩，将直接损害经销商信任和上线速度。
            - label: 中
              tone: medium
              note: ISO 42001 定位和大额融资轮有帮助，但公开资料仍未披露烧钱速度和现金续航。
            - label: 中
              tone: medium
              note: 在管理层提供事故历史和当前财务证明前，剩余暴露仍然重要。
        - label: 支持耐久性
          values:
            - label: 中
              tone: medium
              note: 公开评价证据并非一律负面，但成熟部署的服务质量好坏不一。
            - label: 中
              tone: medium
              note: 上线后的支持疲弱会延长稳定期，并在迁移后稀释经销商 ROI。
            - label: 低
              tone: high
              note: 保留证据没有提供经过审计的 CSAT、留存或 SLA 达成指标。
            - label: 中
              tone: medium
              note: 在提供实际工单和续约证据前，剩余暴露仍有意义。
        - label: 资本效率可见性
          values:
            - label: 中
              tone: medium
              note: 公开融资历史清晰，但当前烧钱速度、毛利率和现金续航尚未披露。
            - label: 高
              tone: high
              note: 如果资本效率较弱，企业级上线可能受支持和实施强度限制。
            - label: 低
              tone: high
              note: 公开缓释因素只说明公司能获得资本，尚未证明其具备自筹资金的运营杠杆。
            - label: 中
              tone: medium
              note: 只有在管理层披露当前盈利能力和现金耐久性后，暴露才会下降。
    approximationNotes: 各单元格定性总结了保留的公开证据；它们不是从量化风险评分模型推导出来的。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议仍为继续研究，因为运营前景尚未与可据以作投资判断的入场价格衔接起来。
    data:
      nodes:
        - id: proof
          label: 产品证明
          detail: 统一的云原生架构被持续描述，但独立的生产环境基准测试仍然有限。
        - id: adoption
          label: 采用信号
          detail: 截至 2025 年，据报道约有 3,000 家屋顶门店。
        - id: momentum
          label: 增长信号
          detail: VendorMotive 报告称，公司宣布 2025 年 ARC 收入增长率为 60%。
        - id: execution
          label: 执行折价
          detail: 社区证据指出实施团队配置、CRM 完整性和路线图交付存在问题。
        - id: price
          label: 价格证据缺口
          detail: 存在据报道为 $4B 的融资估值，但没有经审计的经济性、当前条款或可比倍数。
        - id: decision
          label: 继续研究
          detail: 在评估回报前，要求提供一手财务数据、客户群组、资本表条款和价格保护。
    approximationNotes: 该有序流程是定性的，没有为各阶段分配权重、概率或价值贡献。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
