  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与既有厂商结构
        blocks:
          - type: paragraph
            body: >-
              Tekion 所攻击的市场，是作为特许经销商运营主干的经销商管理系统，而不是笼统的“汽车软件”类别。独立评测普遍认为，这条主干包括核心 DMS，以及与其紧密耦合的 CRM、数字零售、售后排程、零部件、F&I
              和会计工作流；这些环节共享或需要访问同一套运营数据。这个边界很关键，因为 Tekion 的卖点不只是更好的线索管理或排程，而是统一替代 CDK 和 Reynolds
              层层收购拼成的传统数据模型。公开市场结构仍由这两家既有厂商定义：当前来源将 CDK 和 Reynolds 描述为双寡头基线，拥有庞大的存量客户和深厚的生态惯性；Tekion
              更像最可信的云原生挑战者，而非定义品类的垄断者。因此，现有证据最适合用存量客户基础和经销商数量来衡量市场规模，而不是用自上而下的美元 TAM。
