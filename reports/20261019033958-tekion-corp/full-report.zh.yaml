      - number: '2.2'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              DMS 变更会同时触及所有部门，因此采购委员会分层明显。Tekion 的实施材料和第三方比较资料均指出，经销商负责人、总经理和运营负责人是承担多年系统决策的经济买方；会计、零售、固定运营、零部件和 CRM
              等部门的负责人，则会成为内部推动变革的翻译者。终端用户范围比高管赞助者更广：销售、售后、零部件、F&I、会计和数字零售团队都依赖同一工作流底座。这种广度解释了统一数据访问和开放集成为何能推动采用，也解释了预算讨论为何会超出许可费，延伸到培训时间、部门扰动，以及门店能否承受旧习惯被打破后数月的生产率下降。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM011
          - type: table
            tableRef: TM003
