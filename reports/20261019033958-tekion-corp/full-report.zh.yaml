              - CV013
              - CV015
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 约束来自价格证据，而非公司质量
            body: 不要从已报告的融资总额、门店数或 2025 年 ARC 收入增长中推断买入信号。只有当一级尽调证明单位经济性具有持久性，且入场结构能够满足投资者目标回报时，才应推进。
            calloutType: recommendation
            claimRefs:
