      - number: '4.2'
        title: 部署摩擦与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              Tekion 的公开材料更多揭示实施负担，而不是经典 SaaS 效率指标。公司自己的实施叙事称，标准部署从启动到上线约需 120 天；独立切换指南称，上线前 90 到 100
              天就需要源数据，历史数据转换最多可覆盖七年。Tekion 还表示，团队通常需要在线运营 60 到 90 天，工作流才会变得熟练。这些披露很重要，因为替换 DMS 不是轻量级软件
              onboarding；价值实现取决于数据转换、流程重设计、部门再培训和 OEM 认证工作流的连续性。因此，公开证据支持一种面向大型经销商集团的销售动作，因为这类客户能承担变革管理成本；但证据没有提供
              CAC、回本期、销售配额生产率、毛收入留存或服务毛利率。对于投资判断，最有用的公开代理信号是：实施强度足以延迟客户全面恢复生产率，并在爬坡期间增加服务、支持和迁移风险敞口。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
