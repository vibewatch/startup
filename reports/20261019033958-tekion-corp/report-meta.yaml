companyProfile:
  summary: >-
    Tekion builds a cloud-native automotive dealer management system (DMS) and Automotive Retail Cloud (ARC) platform
    that unifies sales, service, parts, accounting, CRM, digital retailing, and AI-assisted workflows for automotive
    dealerships. Founded in 2016 and headquartered in Pleasanton, California, the company has expanded from a startup
    challenger into a large enterprise vendor with OEM certifications, major dealer-group deployments, and strategic
    backing from automotive investors.
