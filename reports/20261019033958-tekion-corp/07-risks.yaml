company:
  name: Tekion Corp
chapter:
  number: 7
  title: Risks
  summary: >-
    Tekion's highest-probability downside is not product irrelevance but execution:
    multiple independent comparison sources describe incumbent-to-Tekion DMS
    migrations as multi-month programs with connector risk, post-go-live
    productivity drag, and uneven support. Official governance signals such as
    ISO 42001 certification and broad OEM coverage reduce some platform risk,
    but they do not eliminate unresolved exposure around workflow maturity,
    incident resilience at larger scale, and undisclosed capital efficiency.
sections:
  - id: ranked-risk-profile
    title: Ranked risk profile
    body: >-
      The dominant downside is migration execution. Public comparisons repeatedly
      frame a Tekion deployment as a six-to-nine-month operational change rather
      than a software swap, with reported productivity drag after cutover and
      real downside if a must-have F&I, OEM, or CRM connector is immature. The
      second tier of risk is dependency quality: Tekion's open-API posture and
      partner ecosystem are meaningful mitigants, but public sources still flag
      uneven depth in niche workflows, OEM edge cases, and post-implementation
      support. Legal and capital risks are material but more indirect. The CDK
      antitrust suit highlights switching friction and data-portability
      pressure, yet public sources do not suggest fast relief. Likewise, a
      $4B-plus valuation and $600M-plus funding base reduce immediate survival
      risk without closing the harder diligence question of burn, runway, and
      current profitability quality.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: execution-and-platform-readiness
    title: Execution and platform-readiness risks
    body: >-
      The evidence set supports a nuanced platform-risk view. Tekion's own
      materials and third-party vendor analysis consistently describe a unified,
      cloud-native stack and ISO 42001 AI governance, which are useful
      mitigation signals for data flow, model governance, and secure workflow
      design. Those positives do not close readiness risk for large live-store
      conversions. Independent comparisons still describe timeline slippage,
      training burden, support variability after implementation, and unresolved
      questions about whether reliability at Tekion's current scale can be
      extrapolated to a much larger installed base. The absence of a major
      public Tekion outage in this retained evidence set is directionally
      positive, but it is not the same thing as proven resilience under CDK-like
      scale or dealer concentration.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR009
      - CR010
      - CR011
    tableRefs:
      - TR002
  - id: dependency-financial-and-kill-criteria
    title: Dependency, financial, and kill criteria
    body: >-
      Tekion's most investment-relevant dependencies sit outside the headline
      product demo. Public comparisons still warn that lender coverage, niche
      fixed-ops tools, OEM-specific accounting and warranty workflows, and
      incumbent-controlled data extraction can each delay value realization even
      when the core ARC platform is stronger than legacy alternatives. Broad OEM
      certifications and a large partner count are real mitigants, but they are
      not substitutes for buyer-specific proof. The practical kill criteria are
      measurable: abandon or reprice the thesis if management cannot provide a
      signed connector inventory for must-keep workflows, a credible phased
      conversion plan with enterprise references, or hard evidence that current
      burn, cash runway, and support staffing can absorb a long migration cycle.
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR008
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR003
