callouts:
  - calloutType: risk
    title: Migration is the thesis-break risk
    body: >-
      Tekion's downside is execution concentration: if rollout timelines slip,
      must-have connectors fail, or productivity remains depressed beyond the
      first stabilization window, product strength will not rescue dealer ROI.
    claimRefs:
      - CR005
      - CR006
      - CR007
  - calloutType: risk
    title: Open APIs reduce but do not erase lock-in risk
    body: >-
      Public evidence supports Tekion's partner breadth, but not universal
      workflow parity; buyer-specific lender, OEM, and fixed-ops connectors must
      still be proven live before underwriting a switch.
    claimRefs:
      - CR003
      - CR004
      - CR008
  - calloutType: assumption
    title: Capital risk is now an evidence problem, not a fundraising problem
    body: >-
      Public sources imply Tekion can raise capital, but retained evidence still
      does not prove current burn, cash runway, or achieved profitability.
    claimRefs:
      - CR014
      - CR015
