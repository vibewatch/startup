schemaVersion: report-v2
artifact: market-analysis
slug: tekion-corp
runDate: 2026-10-19
company:
  name: Tekion Corp
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Tekion is selling into the dealership system-of-record market rather than a generic auto-software bucket:
    the relevant spend sits in replacing the DMS spine and the adjacent CRM, digital retail, service, parts,
    and accounting workflows that legacy incumbents stitched together over time. Public evidence supports a
    constrained adoption lens—roughly 16,990 U.S. franchised dealers, a duopoly still controlling about 70%
    of DMS rooftops, and migration programs that take months and meaningful retraining—while leaving a true
    public TAM/SAM/SOM in dollars unresolved.
sections:
  - id: market-boundary
    title: Market boundary and incumbent structure
    body: >-
      The market Tekion is attacking is the dealer management system as the operational
      spine of a franchise dealership, not a generic “automotive software” bucket.
      Across independent reviews, that spine includes the core DMS plus tightly
      coupled CRM, digital retail, service scheduling, parts, F&I, and accounting
      workflows that share or need access to the same operational data. That boundary
      matters because Tekion’s pitch is not merely better lead management or better
      scheduling; it is a unified replacement for the legacy data model that CDK and
      Reynolds built through layered acquisitions. Public market structure is still
      defined by those incumbents: current sources describe CDK and Reynolds as the
      duopoly baseline, with large installed bases and deep ecosystem inertia, while
      Tekion appears as the most credible cloud-native challenger rather than a
      category-defining monopoly. The best public size lens in the assigned evidence
      is therefore installed-base and dealer-population data, not a clean
      top-down dollar TAM.
    claimRefs: [CM001, CM002, CM003, CM004, CM013, CM014]
    tableRefs: [TM001, TM002]
    figureRefs: [FM001]
  - id: buyer-economics
    title: Buyer, user, and budget ownership
    body: >-
      The buying committee is multi-layered because a DMS change touches every
      department at once. Tekion’s own implementation material and third-party
      comparisons point to dealer principals, general managers, and operations leaders
      as the economic buyers who underwrite a multi-year system decision, while
      department champions across accounting, retail, fixed ops, parts, and CRM become
      the internal translators of the change. End users are broader than the executive
      sponsor set: sales, service, parts, F&I, accounting, and digital retail teams
      all depend on the same workflow substrate. That breadth helps explain why unified
      data access and open integrations show up as adoption drivers, but also why the
      budget conversation extends beyond license fees into training time, departmental
      disruption, and whether the store can tolerate months of lower productivity while
      old habits are unwound.
    claimRefs: [CM005, CM006, CM009, CM011]
    tableRefs: [TM003]
  - id: sizing-and-constraints
    title: Adoption drivers, sizing proxies, and gating constraints
    body: >-
      Public evidence supports a constrained sizing thesis: the addressable opportunity
      is large enough to matter because U.S. franchise dealerships still run on aging
      incumbent systems, but reachable demand is throttled by implementation burden,
      migration cost, OEM and ecosystem dependencies, and the fact that public pricing
      is custom and often enterprise-oriented. The 2024 CDK outage created a fresh
      evaluation trigger by turning resilience and vendor lock-in into explicit buying
      criteria, while Tekion’s unified architecture and API posture give it a clear
      narrative for dealers seeking real-time operations and fewer middleware tolls.
      Even so, the assigned evidence does not provide a defensible public TAM/SAM/SOM
      in dollars by segment or geography. The current chapter can therefore support a
      market-population lens, an installed-base lens, and a switching-cost lens, but
      not a clean revenue pool estimate for Tekion’s winnable market.
    claimRefs: [CM007, CM008, CM010, CM011, CM012, CM013, CM014]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend / workflow
      - Excluded spend / workflow
      - Buyer / payer
      - Relevance
    rows:
      - - Core franchise DMS replacement
        - Sales, service, parts, F&I, accounting, CRM, and digital retail on the same operating spine
        - Standalone point tools that do not replace the system of record
        - Dealer principal, GM, or group operations leader
        - Primary market where Tekion competes head-to-head with CDK and Reynolds
      - - Multi-store modernization
        - Unified data model, workflow standardization, APIs, and cross-rooftop operating consistency
        - Greenfield consumer apps that do not require DMS migration
        - Dealer group leadership with departmental champions
        - Highest-value segment for a single-platform architecture narrative
      - - Single-point or small-group decision
        - Base DMS, mobile service write-up, and required integrations for day-to-day operations
        - Bespoke enterprise transformation programs
        - Owner-operator or store GM
        - Segment most exposed to enterprise pricing and migration labor risk
      - - Adjacent workflow stack
        - CRM, scheduling, review, analytics, and integration layers connected to the DMS
        - Treating a communications or automation layer as a DMS substitute
        - Department head plus operations or IT lead
        - Explains why openness matters without redefining the core market boundary
    notes: Public evidence supports the workflow boundary and buyer map, but not a full spend taxonomy by segment; rows summarize the repeatable market frame visible across official and independent sources.
    claimRefs: [CM001, CM005, CM006, CM009, CM011, CM012]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Lens
      - Publisher / year
      - Geography
      - Value
      - CAGR / velocity
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - U.S. franchised dealer network
        - NADA DATA via US Tech Automations / 2024
        - United States
        - 16,990 dealers; 16.2M units
        - n/a
        - Population proxy for the broad franchise base evaluating DMS choices
        - Medium
        - Dealer count is not the same as cloud-DMS software spend
      - - Legacy duopoly installed base
        - Vendormotive / 2026
        - North America
        - CDK 15,000 rooftops; Reynolds 17,500 rooftops; roughly 70% market share
        - n/a
        - Installed-base lens for the incumbent market structure
        - Medium
        - Rooftops and share are directional and not a clean TAM denominator
      - - Tekion installed-base range
        - State of Automotive + Ringlead + Vendormotive / 2025-2026
        - Primarily North America
        - Roughly 2,500-3,000 dealerships or rooftops
        - n/a
        - Secondary-source range for challenger penetration
        - Medium
        - Sources disagree on the precise count and denominator
      - - Switching-cost constraint
        - State of Automotive + Tekion + US Tech Automations / 2025-2026
        - Franchise dealerships
        - $50k-$150k migration cost; ~120-day implementation plus 60-90-day adoption window
        - n/a
        - Reachability lens based on switching effort rather than market revenue
        - Medium
        - Constrains adoption but does not disclose a segment-level spend pool
    notes: Because the assigned evidence does not disclose a public dollar TAM/SAM/SOM, this table preserves population, installed-base, and switching-cost lenses instead of forcing a single broad estimate.
    claimRefs: [CM003, CM004, CM007, CM008, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Single-point franchise store
        - General manager or dealer principal
        - Sales, service, parts, F&I, and accounting staff
        - Store operating budget
        - Replace an aging incumbent DMS with a mobile and cloud-native stack
        - Dealer principal or GM
        - Renewal timing, outage risk, or frustration with legacy UX
      - - Small or mid-size dealer group (1-10 rooftops)
        - Group operations leader with store leadership input
        - Cross-rooftop departmental teams
        - Group software and implementation budget
        - Standardize data flows and cut middleware across rooftops
        - COO, CFO, or operations head
        - Need for unified reporting and workflow consistency
      - - Large auto group
        - CIO or enterprise operations sponsor
        - Store admins plus department leaders
        - Corporate technology budget
        - Pilot, then scale a multi-store migration with OEM and integration checks
        - Corporate IT and finance leadership
        - Greenfield program, major renewal, or strategic platform consolidation
      - - OEM-sensitive franchise operation
        - Dealer leadership with compliance owners
        - Department managers responsible for brand-program execution
        - Dealership or group budget
        - Preserve certified workflows while modernizing data and service operations
        - Dealer principal plus program owner
        - Confidence from OEM certifications or strategic OEM backing
    notes: Public sources consistently describe the buying unit as executive plus department-champion led; the exact budget owner varies by store scale and governance model.
    claimRefs: [CM005, CM006, CM009, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Public market sizing and adoption lens
    type: pyramid
    summary: Public evidence supports a constrained adoption stack rather than a clean dollar TAM, combining population, installed-base, and switching-friction layers.
    data:
      items:
        - label: U.S. franchised dealer network
          displayValue: 16,990 dealers / 16.2M units
          note: Broad market population lens from NADA DATA cited in the assigned pool.
          claimRefs: [CM004]
        - label: Incumbent duopoly baseline
          displayValue: CDK 15,000 + Reynolds 17,500 rooftops; ~70% share
          note: Installed-base proxy for the legacy market structure Tekion is attacking.
          claimRefs: [CM003]
        - label: Tekion footprint range
          displayValue: 2,500-3,000 rooftops
          note: Secondary sources disagree on the precise installed-base count.
          claimRefs: [CM014]
        - label: Official implementation window
          displayValue: ~120 days
          note: Tekion's published go-live methodology before steady-state adoption.
          claimRefs: [CM007]
        - label: Habit-formation window
          displayValue: 60-90 days post-launch
          note: Operational proficiency typically lags technical go-live.
          claimRefs: [CM007, CM008]
        - label: Migration cost lens
          displayValue: $50k-$150k
          note: Publicly cited switching cost before recurring subscription spend.
          claimRefs: [CM008]
    approximationNotes: Public sources do not isolate a defensible dollar TAM/SAM/SOM, so this figure deliberately combines population, installed-base, time-to-value, and switching-cost layers to show the reachable market constraints buyers actually underwrite.
    claimRefs: [CM003, CM004, CM007, CM008, CM014]
callouts:
  - calloutType: insight
    title: The economic battle is over replacement, not net-new software spend
    body: Tekion's market case depends on convincing dealers to replace an incumbent system of record and the middleware around it, which is why switching friction matters as much as monthly price.
    claimRefs: [CM001, CM008, CM011]
  - calloutType: risk
    title: Public sizing remains proxy-based
    body: The assigned evidence supports dealer-count, installed-base, and switching-cost lenses, but it does not disclose a clean public TAM/SAM/SOM in dollars by geography or segment.
    claimRefs: [CM013, CM014]
