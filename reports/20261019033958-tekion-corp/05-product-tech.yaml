    rows:
      - [ARC core DMS, Dealer principals and store operations, "Production / broadly marketed", "Single platform spanning sales, service, parts, accounting, payroll, and payments", "Need customer references by OEM and store complexity"]
      - [CRM and digital retail, Sales and BDC teams, "Production / integrated suite", "Shared data with desking, inventory, and downstream finance workflows", "Public sources do not quantify attach rate by dealer cohort"]
      - [Service AI agents and copilot surfaces, Service advisors and technicians, "Early but actively marketed", "AI acts inside service workflows instead of as a standalone assistant", "Need live customer proof beyond marketing and one-off case studies"]
      - [Tekion Pay and finance workflows, F&I and cashiering teams, "Production / reference-backed", "Unified checkout and faster approvals inside the same platform", "Need independent proof of scaled adoption and economics"]
      - [Automotive Partner Cloud integrations, Dealer IT and partner vendors, "Growing ecosystem", "Open APIs plus partner marketplace reduce need for custom middleware", "Need franchise-specific connector validation before underwriting migration"]
    notes: >-
      Sources mix official product surfaces, partner directories, and review coverage; maturity labels
      distinguish broadly marketed capabilities from features evidenced mainly through vendor or case-study claims.
    claimRefs: [CE001, CE003, CE005, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow problem
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Service scheduling and customer updates, "Legacy tools require manual handoffs and fragmented context", "Service Scheduler AI plus unified service records", "Official sources say AI handles scheduling and reminders; case study says pickup/payment flow improved", "No neutral benchmark on average advisor productivity gain"]
      - [F&I approval and checkout, "Approvals and payment collection are slow across separate systems", "Tekion Pay and integrated F&I workflows inside ARC", "McDonald case says approval time moved from 24 hours to 30 seconds", "Customer-story evidence is company-hosted and not independently audited"]
      - [Marketing segmentation and follow-up, "External agencies or disconnected CRM workflows add cost and lag", "ARC CRM campaign tooling tied to live dealer data", "McDonald case says campaigns can be built at zero incremental cost", "No public evidence on conversion lift or retention impact"]
      - [Cross-department visibility, "Legacy DMS plus bolt-ons create overnight syncs and duplicate entry", "Unified cloud-native platform with one data model", "Independent reviews repeatedly cite real-time data visibility and fewer silos", "No public architecture disclosure on tenant model, latency, or failure domains"]
    notes: >-
      Benefits are a mix of official product descriptions, company-hosted customer quotes, and external
      review synthesis; measurable outcomes are strongest for the McDonald case and weaker elsewhere.
    claimRefs: [CE003, CE004, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Unified ARC transaction core, "System of record across DMS, CRM, service, parts, accounting, and digital retail", "Dealer migration onto one platform and common workflows", "Public sources do not expose underlying tenant architecture or failure-domain boundaries"]
      - [Embedded AI workflow layer, "Service agents, copilots, and conversational interface act on unified dealership context", "High-quality dealership data plus trust controls", "Evidence is marketing-forward; live performance and guardrail effectiveness remain sparse"]
      - [APC / API integration layer, "Connects third-party vendors via APIs, webhooks, FTP, and partner programs", "Partner participation and franchise-specific connector maintenance", "A missing connector can block migration even if core product is strong"]
      - [OEM certification envelope, "Enables dealer workflows that depend on franchise program approval", "Brand-by-brand and geography-by-geography certification progress", "Coverage is expanding but external reviews still warn not all OEM paths are mature"]
      - [Security and AI governance controls, "Supports privacy, financial record handling, and responsible AI claims", "Certification scope plus dealer operational hygiene", "Certifications signal seriousness but do not prove uptime, support quality, or implementation success"]
    notes: >-
      This table summarizes operating layers inferred from product pages and independent directories;
      it is not a substitute for architecture review, security diligence, or OEM-by-OEM certification checks.
    claimRefs: [CE002, CE004, CE005, CE006, CE010, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Tekion's architecture is presented as a layered dealership operating stack built around a
      unified core rather than separate departmental systems.
    data:
      layers:
        - label: Dealer-facing channels
          detail: Staff and customer interactions across showroom, service drive, payments, and digital retail.
          modules: [Sales, Service lane, Parts counter, F&I, Digital retail]
          outputs: [Unified dealership workflow]
          note: "Evidence comes from product descriptions and independent summaries."
          tone: positive
        - label: Department workflows
          detail: Core business modules execute sales, CRM, service, parts, accounting, payroll, and payments.
          modules: [DMS, CRM, Service, Parts, Accounting, Payroll, Payments]
          outputs: [Cross-department execution]
          tone: positive
        - label: Shared data layer
          detail: Independent sources repeatedly describe one database or one real-time data model with no batch syncs.
          modules: [Customer record, Repair order, Inventory, Financial history]
          outputs: [Real-time visibility]
          tone: positive
        - label: Embedded AI layer
          detail: AI agents and T1 Pro are marketed as acting inside the workflow instead of beside it.
          modules: [Service Scheduler AI, Service Advisor AI, Technician AI, T1 Pro]
          outputs: [Recommendations and task execution]
          tone: positive
        - label: Partner and OEM perimeter
          detail: APC integrations and OEM certifications extend the core platform into dealer-specific ecosystems.
          modules: [Premium APIs, Webhooks, FTP feeds, OEM programs]
          outputs: [External system connectivity]
          tone: warning
        - label: Trust and control envelope
          detail: Security and responsible-AI credentials are part of the sales motion, but production assurance still needs diligence.
          modules: [ISO 42001, ISO 27001, SOC 2 Type II, SOC 1 Type II, ISO 27701]
          outputs: [Governed AI and compliance posture]
          tone: warning
    approximationNotes: >-
      Conceptual layer map synthesized from official and independent sources; it shows product structure
      and dependencies, not a disclosed tenant-by-tenant technical design.
    claimRefs: [CE002, CE003, CE004, CE005, CE010, CE012]
