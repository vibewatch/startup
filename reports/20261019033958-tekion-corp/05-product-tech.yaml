  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public practitioner-community or developer-signal evidence on API usage, release cadence, or ecosystem adoption outside vendor-controlled surfaces.
      whyItMatters: Product-tech diligence should test whether the platform's integration story is validated by an active external builder community rather than only by partner directories and marketing.
      diligencePath: Request API documentation access, changelog history, public or private partner metrics, and direct references from third-party integrators building on APC.
      relatedQuestionRefs: [QE003, QE006]
    - type: private-evidence-only
      severity: material
