evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Exact current revenue, ARR, gross margin, EBITDA, and cash-runway metrics.
    whyItMatters: >-
      These metrics determine whether deployment momentum is translating into durable software economics and financing
      need.
    diligencePath: >-
      Request the latest board package or lender deck with monthly recurring revenue, gross margin, burn, and liquidity
      bridge.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: material
    topic: headcount-confidence
    missingEvidence: A clean current headcount by geography and function as of the report run date.
    whyItMatters: >-
      Workforce scale is a proxy for operating leverage, support capacity, and execution burden in large dealer
      deployments.
    diligencePath: Request HR or finance-confirmed employee counts, contractor mix, and any 2025-2026 restructuring notes.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: governance-and-control
    missingEvidence: Current board composition, observer rights, and any governance rights tied to strategic investors.
    whyItMatters: >-
      Leadership concentration and strategic-investor influence affect control, succession, and platform roadmap
      independence.
    diligencePath: Obtain the current board list, financing documents, and governance summaries from counsel or the data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cap-table detail, preferred-equity terms, secondaries, debt facilities, and liquidation preferences.
    whyItMatters: >-
      Valuation headline alone does not show downside protection, dilution risk, or how much financing flexibility
      remains.
    diligencePath: Request the full cap table, latest term sheet summaries, debt schedules, and any secondary transaction history.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      Public or primary-source TAM, SAM, and SOM estimates for cloud DMS spend broken out by geography, dealership size,
      and workflow scope.
    whyItMatters: >-
      Without a real spend pool, this chapter can bound the market only through dealer counts, installed-base proxies,
      and switching-friction lenses, which weakens revenue-upside precision.
    diligencePath: >-
      Obtain analyst-market estimates or management disclosures that isolate DMS replacement spend by segment and
      geography, then reconcile them against dealer-count and installed-base evidence.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: installed-base-precision
    missingEvidence: >-
      Audited current Tekion active-rooftop count and a clear definition of whether public figures refer to dealerships,
      rooftops, or enabled stores.
    whyItMatters: >-
      Installed-base penetration is the most concrete public proxy for current market reach, but conflicting
      denominators make adoption pace easy to overstate.
    diligencePath: >-
      Request a current management disclosure, investor deck, or customer-reference breakdown that defines active
      rooftops by geography and store type.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Current written quotes, rate cards, escalation clauses, and termination schedules for Tekion, CDK, and Reynolds.
    whyItMatters: Public comparisons cannot underwrite TCO, renewal leverage, or exit friction at dealership-specific scale.
    diligencePath: >-
      Request current vendor proposals plus redlines from a live dealership process and reconcile them against the
      public estimates in TP003.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: partner-ecosystem
    missingEvidence: Store-specific proof that must-have F&I, CRM, OEM, and reporting connectors work live for the target rooftop mix.
    whyItMatters: >-
      Generic ecosystem size does not prove the exact integrations that determine switching feasibility for a real
      dealer group.
    diligencePath: >-
      Build a must-have connector checklist and require live sandbox demonstrations for each load-bearing workflow
      before procurement.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Current gross margin by software, services, payments, and OEM program revenue lines.
    whyItMatters: Margin mix determines whether enterprise deployment complexity expands or compresses long-term software economics.
    diligencePath: Request management P&L bridge with gross profit by revenue line and implementation cost absorption policy.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt/covenant schedule, and runway under base and downside plans.
    whyItMatters: Funding history alone does not establish whether Tekion can self-fund growth or when it may need another round.
    diligencePath: Request board-ready liquidity pack including cash, debt, burn, and next-round decision thresholds.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle by segment, quota attainment, and deployment staffing cost.
    whyItMatters: >-
      Without these metrics, implementation-heavy growth can look attractive on bookings while masking poor cash
      efficiency.
    diligencePath: Request go-to-market KPI dashboard and cohort analysis for CAC payback and gross retention.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Audited or management-certified disclosure on realized pricing, discounts, payment take rate, and revenue
      recognition across subscriptions, services, and payments.
    whyItMatters: Revenue quality cannot be judged from unpublished quotes and third-party estimates alone.
    diligencePath: Request sample contracts, price book, billing mechanics, and monthly revenue mix by product.
    relatedQuestionRefs:
      - QI001
      - QI002
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public practitioner-community or developer-signal evidence on API usage, release cadence, or ecosystem adoption
      outside vendor-controlled surfaces.
    whyItMatters: >-
      Product-tech diligence should test whether the platform's integration story is validated by an active external
      builder community rather than only by partner directories and marketing.
    diligencePath: >-
      Request API documentation access, changelog history, public or private partner metrics, and direct references from
      third-party integrators building on APC.
    relatedQuestionRefs:
      - QE003
      - QE006
  - type: private-evidence-only
    severity: material
    topic: tenant-architecture-and-reliability
    missingEvidence: >-
      Neutral architecture diagrams, uptime history, disaster-recovery posture, support SLAs, and incident metrics for
      the core platform.
    whyItMatters: >-
      A unified DMS creates concentrated operational dependency, so underwriting needs failure-domain and support
      evidence, not only product demos and certifications.
    diligencePath: >-
      Obtain architecture review materials, SOC bridge letters, uptime/SLA reports, and incident postmortems under NDA
      during technical diligence.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE007
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: franchise-specific-coverage
    missingEvidence: >-
      Franchise-by-franchise OEM certification detail and named references for complex accounting, parts, and
      multi-entity implementations.
    whyItMatters: >-
      A missing OEM path or edge-case workflow can block a migration even when the product's architecture is stronger
      than incumbent alternatives.
    diligencePath: >-
      Build an OEM and integration checklist for the target dealer cohort and validate each dependency with live demos
      plus customer references by brand and store complexity.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: retention-concentration
    missingEvidence: Public NRR, GRR, churn, contract-length distribution, and top-customer-share data for Tekion's installed base.
    whyItMatters: >-
      Without renewal and concentration denominators, durability has to be inferred from deployments, reviews, and
      switching-cost logic rather than measured account economics.
    diligencePath: >-
      Ask management for cohort retention, logo churn, top-10 customer share, contract-length mix, and renewal by
      dealer-group size, then reconcile it against named customer references in this chapter.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: missing-source
    severity: material
    topic: implementation-sla
    missingEvidence: Signed rollout SOW, phased cutover plan, and service-level commitments for enterprise dealer migrations.
    whyItMatters: >-
      Public comparisons confirm migration pain, but they do not show whether Tekion has standardized controls that fit
      this buyer's rooftop, OEM, and workflow mix.
    diligencePath: >-
      Request two mature enterprise references, named implementation owners, ticket-resolution metrics, and
      penalty-backed support commitments.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: capital-efficiency
    missingEvidence: Audited ARR, gross margin, burn, cash, debt, and achieved profitability or runway.
    whyItMatters: >-
      Funding history alone cannot test whether Tekion can absorb long enterprise sales cycles and service-heavy
      deployments without new capital.
    diligencePath: Obtain management accounts, cash bridge, board materials, and a 12-month operating plan.
    relatedQuestionRefs:
      - QR005
  - type: missing-source
    severity: material
    topic: integration-oem-proof
    missingEvidence: Brand-by-brand certification matrix plus live lender, F&I, CRM, and fixed-ops connector inventory.
    whyItMatters: >-
      A single missing connector or OEM workflow can turn an otherwise attractive migration into manual rework, delayed
      revenue capture, or customer disruption.
    diligencePath: Run sandbox demos against the buyer's must-keep tools and require signed integration coverage before contracting.
    relatedQuestionRefs:
      - QR003
      - QR006
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Current fully diluted capitalization, security classes, liquidation preferences, debt, cash balance, and financing
      rights.
    whyItMatters: >-
      Funding raised is not cash available, and preference overhang can materially change common-equity returns at the
      same headline valuation.
    diligencePath: >-
      Obtain the current cap table, charter, financing documents, debt schedule, cash statement, and a
      management-certified preference waterfall.
    relatedQuestionRefs:
      - QV007
      - QV009
  - type: missing-source
    severity: material
    topic: valuation-comparables
    missingEvidence: >-
      A matched set of public-company, private-round, or M&A valuations with revenue quality, growth, margin, retention,
      and capital-structure denominators.
    whyItMatters: >-
      The reported $4 billion financing mark cannot establish fair value or target return without comparable
      denominators and current operating results.
    diligencePath: >-
      Build a transaction and public-comparable set from primary filings, deal announcements, capitalization data, and
      management-verified Tekion metrics.
    relatedQuestionRefs:
      - QV010
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited revenue, ARR bridge, gross margin, EBITDA, cash burn, runway, retention, concentration, and cohort
      implementation economics.
    whyItMatters: >-
      Annual revenue is not ARR, accounting loss is not cash burn, and the retained estimates cannot support an entry
      multiple or downside model.
    diligencePath: >-
      Review audited statements, bank records, board reporting, customer cohorts, contracts, churn data, and
      implementation-level contribution margins.
    relatedQuestionRefs:
      - QV001
      - QV008
      - QV009
