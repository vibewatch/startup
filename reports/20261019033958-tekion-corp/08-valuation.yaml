        - id: momentum
          label: "Growth signal"
          detail: "VendorMotive reports a company-announced 60% ARC revenue growth rate for 2025."
        - id: execution
          label: "Execution discount"
          detail: "Community evidence flags implementation staffing, CRM completeness, and roadmap delivery."
        - id: price
          label: "Price evidence gap"
          detail: "A reported $4B financing mark exists, but audited economics, current terms, and comparable multiples do not."
        - id: decision
          label: "Research more"
          detail: "Require primary financials, customer cohorts, cap-table terms, and price protection before underwriting return."
    approximationNotes: "The ordered flow is qualitative and does not assign weights, probabilities, or value contribution to its stages."
    claimRefs: [CV004, CV009, CV010, CV012, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Price evidence, not company quality, is the binding constraint
    body: >-
      Do not infer a buy signal from the reported funding total, rooftop count, or 2025 ARC revenue
      growth. Advance only if primary diligence establishes durable unit economics and an entry
      structure capable of meeting the investor's target return.
    claimRefs: [CV009, CV010, CV011, CV012, CV013]
