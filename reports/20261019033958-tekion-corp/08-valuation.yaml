schemaVersion: "report-v2"
artifact: valuation
slug: tekion-corp
runDate: 2026-10-19
company:
  name: Tekion Corp
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Tekion as a credible cloud-native DMS challenger with reported
    operating momentum, but it does not support a defensible current fair-value range. The
    recommendation is research-more: treat the reported $4 billion July 2024 financing mark as
    a historical transaction reference, not intrinsic value, until financial, cap-table, and
    implementation evidence is verified.
sections:
  - id: recommendation-and-financing
    title: Recommendation and financing context
    body: >-
      The current recommendation is research-more, with medium-low confidence, medium-high risk,
      and an unsupported valuation stance. VendorMotive reports approximately $665 million raised
      across five rounds, including a $200 million July 2024 Dragoneer round at a $4 billion
      valuation; that is a financing mark, not evidence of cash available today or a current fair
      value. The same source estimates annual revenue at $100 million to $200 million, but the
      retained evidence does not provide audited revenue, ARR, gross margin, EBITDA, cash flow, or
      preference terms. Accordingly, neither a target return nor a hold period can be responsibly
      underwritten from public inputs. Entry discipline should require primary financials and a
      fully diluted preference waterfall before any price recommendation.
    claimRefs: [CV010, CV011, CV013]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Tekion has credible product and adoption signals: its own materials
      describe a unified real-time data model, VendorMotive reports approximately 3,000 dealership
      rooftops as of 2025, and an independent marketplace profile also describes a unified
      cloud-native platform. The anti-thesis is operational rather than conceptual. DealerRefresh's
      synthesis of 13 community threads reports inconsistent, understaffed implementations,
      an incomplete CRM for some dealer groups, and a gap between roadmap claims and production
      readiness. The same review reports meaningful technology-spend reductions for some switchers,
      but those reports are not audited customer economics. Product architecture and customer
      appetite therefore improve the diligence case without resolving deployment quality or
      valuation support.
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV009, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      Scenario analysis should remain directional because the retained pool contains no defensible
      public-company, M&A, or private-round multiple set with matched growth, margin, retention, and
      capital-structure data. The bull case requires verified continuation of the reported 60% ARC
      revenue growth, durable enterprise deployment, and implementation improvement; it could
      justify re-testing value above the reported financing mark, but no premium is quantified.
      The base case treats $4 billion only as the last reported round reference and withholds a
      fair-value range. The bear case is a down-round outcome below that mark if deployment friction,
      incomplete functionality, litigation costs, or weak unit economics impair growth. CDK and
      Reynolds are operating references, not independent valuation benchmarks in this evidence set.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV009, CV010, CV012]
    tableRefs: [TV003]
  - id: decision-logic-and-diligence
    title: Decision logic, exit readiness, and thesis-break triggers
    body: >-
      The decision chain starts with credible category disruption and reported adoption, then
      discounts those signals for implementation risk, legal uncertainty, undisclosed pricing, and
      missing financial disclosure. Law360's case chronology shows that Tekion's monopolization
      claims survived a dismissal attempt in July 2025, but the court later refused an amendment
      request in August 2026; neither event establishes the ultimate merits or financial outcome.
      Exit readiness is therefore unproven. Before investment, obtain audited cohort retention,
      gross margin, cash burn, runway, customer concentration, deployment timelines, current
      capitalization, and liquidation preferences. Thesis-break triggers are verified growth
      deceleration, persistent multi-rooftop implementation failures, material CRM replacement
      costs, or preference overhang that prevents a target return at the entry price.
    claimRefs: [CV002, CV003, CV005, CV006, CV013, CV014]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Current view
      - Evidence basis
      - What would change the view
    rows:
      - [Recommendation, "Research more; do not underwrite price yet", "Historical financing mark plus incomplete public economics", "Audited operating data and a priced fully diluted term sheet"]
      - [Confidence, "Medium-low", "Product and adoption signals are available, but financial support is secondary and incomplete", "Primary financial statements and verified cohort metrics"]
      - [Risk rating, "Medium-high", "Implementation complaints, legal uncertainty, migration burden, and private capital terms", "Repeatable deployments, resolved legal exposure, and transparent preferences"]
      - [Valuation stance, "Unsupported", "Reported $4B July 2024 round is not a current fair-value conclusion", "Matched revenue quality, margin, retention, and transaction comparables"]
      - [Decision implication, "Advance only to confirmatory diligence", "Public evidence supports company quality more than entry price", "Price protection and evidence sufficient to model target return"]
    notes: "Views are analytical judgments; $4B is a third-party-reported July 2024 financing valuation, while audited economics and preference terms remain unavailable."
    claimRefs: [CV002, CV005, CV006, CV009, CV010, CV011, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - [Market position, "Community and directory sources describe a credible challenger to the legacy DMS duopoly", "Credibility does not establish durable share or pricing power", "Verified wins, losses, retention, and rooftop cohorts"]
      - [Product architecture, "Tekion and third-party profiles describe a unified cloud-native data model", "Company claims do not independently prove reliability or workflow outcomes", "Customer-controlled production benchmarks and incident history"]
      - [Customer proof, "VendorMotive reports about 3,000 rooftops as of 2025", "A rooftop count is not retention, revenue, or same-store expansion", "Contracted ARR bridge by cohort and independently confirmed references"]
      - [Economics, "DealerRefresh reports meaningful cost savings for some switchers", "Annual revenue is only estimated and public pricing is undisclosed", "Audited revenue, gross margin, CAC payback, and implementation cost"]
      - [Competition and legal, "The antitrust case reflects material incumbent friction and survived a dismissal attempt", "The court later refused an amendment request and ultimate merits remain unresolved", "Case resolution plus evidence of portable dealer data and low switching friction"]
      - [Execution, "Reported ARC revenue growth and enterprise deployments indicate momentum", "Community reports cite understaffed rollouts, CRM gaps, and roadmap slippage", "On-time multi-rooftop rollouts with referenceable realized outcomes"]
    notes: "This table separates reported operating signals from unresolved counter-evidence; no row converts funding, rooftop count, or revenue estimates into ARR or cash availability."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV009, CV011, CV012, CV013, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Reported 60% ARC revenue growth persists; enterprise deployments retain; implementation quality improves", "Potentially above the reported $4B round mark, but no premium or target return is supportable from public inputs", "Positive only after primary growth, retention, and margin verification", "Growth or retention misses despite deployment expansion"]
      - [Base, "Adoption continues while deployment friction and incomplete disclosure persist", "No defensible fair-value range; use $4B only as a historical financing reference", "Neutral because product evidence and valuation evidence are mismatched", "No audited path to attractive return at the offered entry price"]
      - [Bear, "Implementation problems persist, CRM replacement costs rise, or litigation and weak economics constrain growth", "Down-round or value below the reported $4B mark; magnitude cannot be sized without capitalization and cash data", "Negative if customer references or financial diligence contradict public growth signals", "Preference overhang, cash pressure, or repeat multi-rooftop failures"]
    notes: "Directional scenarios use the reported July 2024 financing valuation as a reference only; no probability percentages, valuation multiples, exit dates, or cash-return figures are estimated."
    claimRefs: [CV002, CV003, CV005, CV006, CV009, CV010, CV011, CV012, CV013, CV014]
