company:
  name: Tekion Corp
chapter:
  number: 4
  title: Financials
  summary: Tekion appears to monetize as an enterprise automotive-retail platform sold through private rooftop-and-module contracts, with recurring software subscriptions and likely transaction-linked fees, but public evidence does not disclose realized pricing, gross margin, burn, or runway. The public record supports a well-funded scale-up with a roughly $665 million funding history and a $200 million 2024 growth round, yet underwriting still depends on management sharing private revenue-quality and cash-efficiency data.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: >-
      Public evidence consistently describes Tekion as a cloud-native dealership
      operating system sold through enterprise contracts rather than transparent
      list pricing. The product bundle spans DMS, CRM, service, parts,
      accounting, payments, and OEM-facing products, which implies multiple
      monetization levers, but only some of them are described with
      specificity. The strongest direct pricing signal is negative: Tekion does
      not publish standard ARC prices, and third-party profiles say quotes
      depend on dealership count, licensed modules, and contract terms. That
      means list pricing is unavailable for underwriting, while realized
      pricing, discounting, contract length, attach rates, and net revenue
      retention remain undisclosed. A separate third-party startup profile
      characterizes the model as recurring software subscriptions plus
      per-transaction fees, which is directionally useful for mapping revenue
      mechanics but not enough to size unit contribution or margin by product
      line. Unofficial market chatter points to a wide per-store monthly range,
      underscoring that customer economics likely vary meaningfully by rooftop
      scale, module mix, and services scope rather than fitting a single SaaS
      price point.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
      - CI010
      - CI013
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: deployment-friction-and-unit-economics-proxies
    title: Deployment friction and unit-economics proxies
    body: >-
      Tekion's public materials reveal more about implementation burden than
      about classic SaaS efficiency metrics. The company's own implementation
      narrative says a standard deployment spans roughly 120 days from kickoff
      to go-live, while an independent switching guide says source data is
      needed 90 to 100 days before go-live and historical conversion can cover
      up to seven years. Tekion also says teams typically need 60 to 90 days
      of live operational use before workflows become second nature. Those
      disclosures matter because DMS replacement is not light-touch software
      onboarding; value realization depends on data conversion, process
      redesign, department retraining, and OEM-certified workflow continuity.
      The public evidence therefore supports a sales motion aimed at larger
      dealer groups that can absorb change-management costs, but it does not
      provide CAC, payback, quota productivity, gross retention, or service
      gross margin. For underwriting, the most useful public proxy is that
      implementation intensity is high enough to delay full customer
      productivity and to increase services, support, and migration exposure
      during ramp.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI014
      - CI015
    tableRefs:
      - TI003
  - id: capital-adequacy-and-funding-dependency
    title: Capital adequacy and funding dependency
    body: >-
      The retained evidence supports a straightforward capital-history view but
      not a completed liquidity assessment. Multiple independent profiles say
      Tekion has raised about $665 million in aggregate and most recently added
      a $200 million Dragoneer-led round in July 2024 at a valuation above $4
      billion. Those facts imply continuing access to growth capital and
      investor willingness to fund a category challenger with OEM relationships
      and enterprise deployments. They do not, however, establish current cash
      on hand, debt obligations, burn, runway, covenant headroom, or the
      revenue pace required to avoid another raise. Even the most detailed
      third-party financial profile offers only estimated revenue and
      company-reported growth snippets rather than audited current-period
      statements. The financial posture therefore looks venture-backed rather
      than self-funding from public evidence alone; recent capital likely
      reduced immediate financing pressure, but the next-round trigger and true
      capital adequacy remain private-data questions.
    claimRefs:
      - CI011
      - CI012
      - CI016
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Tekion's revenue quality case is plausible but still incomplete in
      public. The company sells mission-critical software with private
      enterprise contracting, embedded payments, and integration-adjacent
      monetization options, which can support sticky revenue once a dealer
      group is live. The counterweight is that DMS migrations are operationally
      disruptive and costly enough that implementation quality, services
      efficiency, and partner readiness will directly influence gross margin
      and payback. Public evidence supports a thesis of strong product scope
      and financing access, not a clean underwriting model. Before taking a
      view on margin path or valuation support, an investor would need
      management-grade disclosure on ARR by product, implementation/services
      mix, payment take rate, gross margin by line, customer concentration,
      churn, burn, and remaining runway. Until those are produced, the right
      financial judgment is qualified conviction with material diligence
      blockers rather than precision.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI014
      - CI016
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - ARC software subscription
        - Private enterprise software subscription for the core ARC platform across DMS, CRM, service, parts, accounting, and related workflows
        - Per rooftop / licensed module / contract term
        - Pricing unpublished; sold through custom dealership quotes
        - Supported on contract structure, unsupported on realized pricing
        - Provide current price book, average contract value, term length, and discount bands by customer cohort
      - - Transaction and payments revenue
        - Per-transaction fees and embedded payment monetization tied to dealership workflows
        - Transaction volume / payment flow
        - Third-party profile says Tekion uses subscription plus transaction-based monetization; public rate card unavailable
        - Directional only
        - Provide payment take rate, transaction-fee schedule, gross margin, and penetration across the installed base
      - - Implementation and migration services
        - Project work tied to data conversion, configuration, training, and go-live support
        - Implementation project / milestone billing
        - Official implementation terms describe dated milestones, but no public fee schedule or revenue recognition detail
        - Partially supported
        - Provide services pricing, milestone billings, capitalization policy, and attachment rate per deployment
      - - OEM / manufacturer programs
        - Automotive Enterprise Cloud and OEM-certified programs sold alongside dealer workflows
        - Program contract / OEM deployment
        - Product line exists and GM is cited as a flagship deployment, but revenue contribution is undisclosed
        - Product supported, economics unavailable
        - Break out OEM-program revenue, margin profile, and dependence on specific manufacturer relationships
    notes: Public sources describe monetization architecture but not realized customer pricing, mix, or revenue recognition; null-equivalent gaps are converted into diligence asks.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI007
      - CI013
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs. realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - ARC core software quote
        - No public list price; quotes assembled per dealership, licensed modules, rooftop count, and contract terms
        - Realized price, contract length, and discounting undisclosed
        - ERP-Software profile
      - - 'Unofficial market estimate: $4,000-$16,000 per store per month'
        - Third-party estimate rather than company-published pricing
        - Configuration mix is wide; cited high-end quote may include non-core modules and services
        - VendorMotive switching guide
      - - Payment processing and integration fees
        - Explicitly flagged as separate line items that can change TCO versus incumbents
        - No public schedule for processing, API, or integration charges
        - ERP-Software profile
      - - Transaction-based monetization
        - Third-party startup profile says revenue includes per-transaction fees alongside subscriptions
        - No public disclosure on fee basis, attach rate, or take rate
        - Growth Engineer profile
    notes: Only one row contains a numeric estimate, and that figure is unofficial; official evidence supports quoting mechanics, not a published list price.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI013
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR / revenue by product
        - Not publicly disclosed in retained evidence; one third-party profile cites estimated revenue and historical growth snippets
        - Low
        - Without current recurring revenue by line, subscription quality and growth durability cannot be underwritten
        - Provide latest ARR, GAAP revenue, revenue mix by product, and cohort growth history
      - - Gross margin by line
        - Not publicly disclosed
        - Low
        - Software, services, payments, and OEM program margins likely differ materially
        - Provide gross margin for software, services, and payments plus implementation cost absorption policy
      - - Burn / cash / runway
        - Not publicly disclosed
        - Low
        - Capital adequacy cannot be assessed from fundraising history alone
        - Provide current cash balance, monthly burn, debt/covenant schedule, and base / downside runway
      - - Implementation burden proxy
        - Approx. 120-day methodology; 90-100 days of pre-go-live data readiness; 60-90 days for workflows to become second nature
        - Medium
        - Shows delayed productivity and likely services/support intensity even before CAC or payback is known
        - Provide implementation cost per rooftop, time-to-value, and post-go-live productivity curve
      - - Sales efficiency / CAC payback
        - No public CAC, payback, or quota-efficiency disclosure found in retained evidence
        - Low
        - Large-enterprise deployment motion can conceal expensive acquisition and support costs
        - Provide CAC, payback, sales cycle by segment, win rates, and fully loaded deployment staffing cost
    notes: Nulls indicate unavailable public evidence rather than zero values; the one populated proxy row combines official and independent implementation-timeline disclosures.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI011
      - CI014
      - CI016
