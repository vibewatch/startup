    summary: Public evidence supports the sequence of enterprise quoting, implementation, recurring subscriptions, and transaction-linked monetization, but not the downstream gross-profit math.
    data:
      nodes:
        - id: n1
          label: Dealer rooftops and module scope
          detail: Private quotes depend on rooftop count, licensed modules, and contract terms.
        - id: n2
          label: Implementation and data conversion
          detail: Kickoff-to-go-live methodology is about 120 days, with source data needed 90-100 days before launch.
        - id: n3
          label: Go-live and adoption ramp
          detail: Teams may need 60-90 days of operational use before Tekion workflows become second nature.
        - id: n4
          label: Recurring software subscription
          detail: Core ARC monetization is subscription-based but not publicly price-listed.
        - id: n5
          label: Transaction and payment fees
          detail: Third-party profile describes per-transaction fees; payment-processing economics remain undisclosed.
        - id: n6
          label: Gross profit and cash generation
          detail: Public sources do not disclose current gross margin, burn, or runway.
    approximationNotes: This is a structural flow, not a quantified waterfall; public evidence does not support numeric revenue-to-gross-profit conversion values.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI008
      - CI009
      - CI016
