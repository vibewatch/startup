  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: Current gross margin by software, services, payments, and OEM program revenue lines.
      whyItMatters: Margin mix determines whether enterprise deployment complexity expands or compresses long-term software economics.
      diligencePath: Request management P&L bridge with gross profit by revenue line and implementation cost absorption policy.
      relatedQuestionRefs:
        - QI005
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, debt/covenant schedule, and runway under base and downside plans.
      whyItMatters: Funding history alone does not establish whether Tekion can self-fund growth or when it may need another round.
      diligencePath: Request board-ready liquidity pack including cash, debt, burn, and next-round decision thresholds.
      relatedQuestionRefs:
        - QI007
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: CAC, payback, sales cycle by segment, quota attainment, and deployment staffing cost.
      whyItMatters: Without these metrics, implementation-heavy growth can look attractive on bookings while masking poor cash efficiency.
      diligencePath: Request go-to-market KPI dashboard and cohort analysis for CAC payback and gross retention.
      relatedQuestionRefs:
        - QI004
    - type: missing-source
      severity: material
      topic: revenue-recognition
      missingEvidence: Audited or management-certified disclosure on realized pricing, discounts, payment take rate, and revenue recognition across subscriptions, services, and payments.
      whyItMatters: Revenue quality cannot be judged from unpublished quotes and third-party estimates alone.
      diligencePath: Request sample contracts, price book, billing mechanics, and monthly revenue mix by product.
      relatedQuestionRefs:
        - QI001
        - QI002
