  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: three primary camps plus a substitute path'
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a market structure with three primary enterprise choices in U.S. franchise
              DMS: CDK Global as the scale incumbent, Reynolds & Reynolds as the locked-in premium incumbent, and Tekion
              as the cloud-native challenger. Vendormotive explicitly places Tekion against CDK and Reynolds and names
              DealerBuilt, Dealertrack DMS, DealerSocket, Auto/Mate, and Quorum as additional challengers, but the
              retained pool is much thinner on those second-tier options than on the top three. That matters for
              diligence: the core underwriting question is not whether alternatives exist in theory, but whether they
              can displace a load-bearing incumbent stack in a live dealership. The substitute path is also important.
              USTech's comparison argues that many stores will rationally keep the incumbent DMS and layer targeted
              workflow automation around it, because the system-of-record replacement risk can outweigh the benefit of a
              cleaner UI or faster service workflow.
            claimRefs:
              - CP005
              - CP007
              - CP012
              - CP014
              - CP015
              - CP016
