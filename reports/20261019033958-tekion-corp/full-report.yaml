        title: Exhibits
        blocks:
          - type: callout
            title: The economic battle is over replacement, not net-new software spend
            body: >-
              Tekion's market case depends on convincing dealers to replace an incumbent system of record and the
              middleware around it, which is why switching friction matters as much as monthly price.
