    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Tekion is a U.S.-based private software company in automotive retail, founded in 2016 and headquartered in
              Pleasanton, California. The assigned evidence consistently describes its core product as Automotive Retail
              Cloud (ARC), a cloud-native dealer-management platform intended to replace legacy on-premise systems.
              Tekion and independent marketplace profiles describe a unified workflow across sales, service, parts,
              accounting, CRM, and digital retail, with AI-native or agentic positioning layered on top. That framing
              matters because the company overview chapter should establish the product boundary that later market,
              customer, and risk chapters test rather than assume, including where current claims remain marketing-led
              instead of independently benchmarked.
