      - number: '4.2'
        title: Deployment friction and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Tekion's public materials reveal more about implementation burden than about classic SaaS efficiency
              metrics. The company's own implementation narrative says a standard deployment spans roughly 120 days from
              kickoff to go-live, while an independent switching guide says source data is needed 90 to 100 days before
              go-live and historical conversion can cover up to seven years. Tekion also says teams typically need 60 to
              90 days of live operational use before workflows become second nature. Those disclosures matter because
              DMS replacement is not light-touch software onboarding; value realization depends on data conversion,
              process redesign, department retraining, and OEM-certified workflow continuity. The public evidence
              therefore supports a sales motion aimed at larger dealer groups that can absorb change-management costs,
              but it does not provide CAC, payback, quota productivity, gross retention, or service gross margin. For
              underwriting, the most useful public proxy is that implementation intensity is high enough to delay full
              customer productivity and to increase services, support, and migration exposure during ramp.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy and funding dependency
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a straightforward capital-history view but not a completed liquidity
              assessment. Multiple independent profiles say Tekion has raised about $665 million in aggregate and most
              recently added a $200 million Dragoneer-led round in July 2024 at a valuation above $4 billion. Those
              facts imply continuing access to growth capital and investor willingness to fund a category challenger
              with OEM relationships and enterprise deployments. They do not, however, establish current cash on hand,
              debt obligations, burn, runway, covenant headroom, or the revenue pace required to avoid another raise.
              Even the most detailed third-party financial profile offers only estimated revenue and company-reported
              growth snippets rather than audited current-period statements. The financial posture therefore looks
              venture-backed rather than self-funding from public evidence alone; recent capital likely reduced
              immediate financing pressure, but the next-round trigger and true capital adequacy remain private-data
              questions.
            claimRefs:
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Tekion's revenue quality case is plausible but still incomplete in public. The company sells
              mission-critical software with private enterprise contracting, embedded payments, and integration-adjacent
              monetization options, which can support sticky revenue once a dealer group is live. The counterweight is
              that DMS migrations are operationally disruptive and costly enough that implementation quality, services
              efficiency, and partner readiness will directly influence gross margin and payback. Public evidence
              supports a thesis of strong product scope and financing access, not a clean underwriting model. Before
              taking a view on margin path or valuation support, an investor would need management-grade disclosure on
              ARR by product, implementation/services mix, payment take rate, gross margin by line, customer
              concentration, churn, burn, and remaining runway. Until those are produced, the right financial judgment
              is qualified conviction with material diligence blockers rather than precision.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core underwriting metrics are still private
            body: >-
              Funding history and deployment scale are public enough to frame the story, but current ARR, gross margin,
              cash, burn, and runway are still undisclosed in the retained evidence pool.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI016
          - type: callout
            title: This behaves like high-touch enterprise software, not transparent SaaS
            body: >-
              The public record emphasizes custom quotes, implementation milestones, data-conversion windows, and
              retraining, which implies that customer economics are shaped by deployment complexity as much as by seat
              or rooftop count.
            calloutType: insight
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI009
