      - number: '2.2'
        title: Buyer, user, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The buying committee is multi-layered because a DMS change touches every department at once. Tekion’s own
              implementation material and third-party comparisons point to dealer principals, general managers, and
              operations leaders as the economic buyers who underwrite a multi-year system decision, while department
              champions across accounting, retail, fixed ops, parts, and CRM become the internal translators of the
              change. End users are broader than the executive sponsor set: sales, service, parts, F&I, accounting, and
              digital retail teams all depend on the same workflow substrate. That breadth helps explain why unified
              data access and open integrations show up as adoption drivers, but also why the budget conversation
              extends beyond license fees into training time, departmental disruption, and whether the store can
              tolerate months of lower productivity while old habits are unwound.
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Adoption drivers, sizing proxies, and gating constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a constrained sizing thesis: the addressable opportunity is large enough to
              matter because U.S. franchise dealerships still run on aging incumbent systems, but reachable demand is
              throttled by implementation burden, migration cost, OEM and ecosystem dependencies, and the fact that
              public pricing is custom and often enterprise-oriented. The 2024 CDK outage created a fresh evaluation
              trigger by turning resilience and vendor lock-in into explicit buying criteria, while Tekion’s unified
              architecture and API posture give it a clear narrative for dealers seeking real-time operations and fewer
              middleware tolls. Even so, the assigned evidence does not provide a defensible public TAM/SAM/SOM in
              dollars by segment or geography. The current chapter can therefore support a market-population lens, an
              installed-base lens, and a switching-cost lens, but not a clean revenue pool estimate for Tekion’s
              winnable market.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
