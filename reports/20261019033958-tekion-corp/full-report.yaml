  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and incumbent structure
        blocks:
          - type: paragraph
            body: >-
              The market Tekion is attacking is the dealer management system as the operational spine of a franchise
              dealership, not a generic “automotive software” bucket. Across independent reviews, that spine includes
              the core DMS plus tightly coupled CRM, digital retail, service scheduling, parts, F&I, and accounting
              workflows that share or need access to the same operational data. That boundary matters because Tekion’s
              pitch is not merely better lead management or better scheduling; it is a unified replacement for the
              legacy data model that CDK and Reynolds built through layered acquisitions. Public market structure is
              still defined by those incumbents: current sources describe CDK and Reynolds as the duopoly baseline, with
              large installed bases and deep ecosystem inertia, while Tekion appears as the most credible cloud-native
              challenger rather than a category-defining monopoly. The best public size lens in the assigned evidence is
              therefore installed-base and dealer-population data, not a clean top-down dollar TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM014
