      - number: '3.2'
        title: Switching cost, pricing opacity, and partner power decide real competition
        blocks:
          - type: paragraph
            body: >-
              Public pricing is too opaque to make this a clean list-price contest. The retained comparison sources
              consistently describe Tekion, CDK, and Reynolds as quote-led enterprise sales, with only estimated public
              ranges and no vendor-published plan matrix suitable for underwriting. That shifts the real competition
              toward switching economics and contract structure. Tekion's retained official guidance describes a roughly
              120-day implementation path and a further 60-90 day post-go-live optimization period, while independent
              comparisons say full migrations still take months and often run longer than sales promises. CDK and
              Reynolds add a different form of friction: deep OEM and third-party coverage that buyers already depend
              on, plus heavier formal lock-in, especially at Reynolds. In practice, distribution power comes from the
              installed workflow graph around the DMS, not just the software fee line.
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP011
              - CP016
      - number: '3.3'
        title: Tekion's moat is architectural, but incumbent depth still limits share capture
        blocks:
          - type: paragraph
            body: >-
              Tekion's moat is strongest where incumbents are weakest: unified data, cloud-native deployment, a modern
              service-lane experience, and AI features that are embedded into the same platform rather than bolted on.
              The retained official and Vendormotive descriptions align on the same core point: Tekion is trying to
              collapse DMS, CRM, service, parts, accounting, and AI workflows into one operating model. That
              differentiator is real, but it is not yet synonymous with market control. The same third-party comparison
              sources that praise Tekion's architecture also warn about smaller share, uneven connector maturity,
              longer-than-promised deployments, and support variance after go-live. Competitive durability therefore
              depends less on whether Tekion's product is modern and more on whether it can remove enough migration risk
              for conservative multi-rooftop groups to switch.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture is the cleanest Tekion win
            body: >-
              The retained official and Vendormotive evidence consistently describe Tekion as a unified, cloud-native
              operating model rather than a hosted legacy stack, which is why most independent comparisons give it the
              clearest product-level advantage on UX and data flow.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
          - type: callout
            title: The real competitor is often migration friction
            body: >-
              Tekion does not need to lose a feature bake-off to lose a deal; it can lose because OEM, F&I, CRM, or
              reporting dependencies make staying with an incumbent economically safer than switching this year.
            calloutType: risk
            claimRefs:
