              - CP009
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently describes Tekion as a cloud-native dealership operating system sold through
              enterprise contracts rather than transparent list pricing. The product bundle spans DMS, CRM, service,
              parts, accounting, payments, and OEM-facing products, which implies multiple monetization levers, but only
              some of them are described with specificity. The strongest direct pricing signal is negative: Tekion does
              not publish standard ARC prices, and third-party profiles say quotes depend on dealership count, licensed
              modules, and contract terms. That means list pricing is unavailable for underwriting, while realized
              pricing, discounting, contract length, attach rates, and net revenue retention remain undisclosed. A
              separate third-party startup profile characterizes the model as recurring software subscriptions plus
              per-transaction fees, which is directionally useful for mapping revenue mechanics but not enough to size
              unit contribution or margin by product line. Unofficial market chatter points to a wide per-store monthly
              range, underscoring that customer economics likely vary meaningfully by rooftop scale, module mix, and
              services scope rather than fitting a single SaaS price point.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI010
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
