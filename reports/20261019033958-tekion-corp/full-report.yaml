  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and buyer fit
        blocks:
          - type: paragraph
            body: >-
              Public and third-party sources consistently describe Tekion's Automotive Retail Cloud as a broad
              dealership operating system rather than a point application. The product spans DMS, CRM, digital retail,
              service, parts, accounting, payroll, payments, and analytics in one cloud environment, which is the core
              of Tekion's pitch to franchise dealerships replacing legacy stacks. Independent reviews also narrow the
              buyer fit: Tekion appears strongest for franchise and multi-rooftop dealer groups willing to replace
              multiple incumbent systems, while reviewers repeatedly say independent dealers are a poor fit on both
              category and price point. That positioning matters because product depth is inseparable from
              implementation scope; the same breadth that creates workflow leverage also makes switching a full
              operational event.
            claimRefs:
              - CE001
              - CE007
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE011
      - number: '5.2'
        title: Architecture, AI layer, and ecosystem design
        blocks:
          - type: paragraph
            body: >-
              The clearest through-line across official and independent evidence is architecture. Tekion is positioned
              as cloud-native and unified from day one, with a shared data layer that lets sales, service, parts,
              accounting, and payments operate without nightly batch syncs or middleware handoffs. Tekion's newer AI
              narrative builds on that same premise: agents and copilots are useful because they act inside the same
              system of record instead of stitching together disconnected tools. The ecosystem story is also part of the
              architecture, not a side feature; Tekion markets open APIs and APC integrations as the bridge into
              dealer-specific tooling. Together, the evidence suggests a technically coherent stack, but one whose real
              advantage depends on how completely a dealer's OEM and third-party dependencies can be brought along.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE012
      - number: '5.3'
        title: Deployment proof, maturity, and measurable operating benefit
        blocks:
          - type: paragraph
            body: >-
              Product maturity is supported less by deep architectural disclosure than by deployment and workflow proof.
              External directories and comparison pages point to large dealer-group rollouts, broad partner listings,
              and expanding OEM certifications, while Tekion's own customer evidence emphasizes faster approvals,
              integrated payments, marketing execution, and higher CSI after consolidation onto one platform. That
              evidence is directionally useful: it shows the platform can run meaningful dealership operations and that
              unified workflows can improve staff and customer-facing execution. It is not enough, however, to validate
              every technical claim equally; public sources still leave uptime, rollout variance by OEM, and
              module-by-module adoption depth mostly opaque.
            claimRefs:
              - CE005
              - CE006
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE011
      - number: '5.4'
        title: Product and technical risks
        blocks:
          - type: paragraph
            body: >-
              The recurring product risk is not that Tekion lacks a compelling architecture; it is that the operational
              burden to realize that architecture is high. Independent review coverage repeats the same themes:
              implementations often run longer than quoted, support quality is mixed after go-live, edge-case workflows
              can still break, and not every OEM or integration path is fully mature. Those issues are especially
              important for dealer groups with complex parts, accounting, or franchise-specific processes, where a
              missing connector or certification can erase the benefit of a cleaner interface. The biggest remaining
              diligence gaps are also technical: there is little public evidence on developer/community adoption,
              tenant-level architecture, or neutral uptime and support-SLA data.
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural differentiation is data-model first
            body: >-
              Tekion's strongest product argument is not just a modern UI; it is the claim that DMS, CRM, service,
              parts, accounting, payments, and AI operate on one cloud-native data model.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: callout
            title: Migration risk can overwhelm product upside
            body: >-
              External reviews say implementation duration, connector maturity, OEM coverage, and support quality after
              go-live are the main reasons a technically better architecture can still be a poor operational decision
              for a dealership.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to Tekion selling primarily into franchised automotive retail operators rather
              than into a broad SMB horizontal software base. Tekion's own positioning is broad at the workflow level:
              it describes Automotive Retail Cloud as an end-to-end AI-native platform spanning DMS, CRM, digital
              retail, service, parts, and accounting workflows, while its AI-native DMS narrative emphasizes in-workflow
              agents rather than stand-alone copilots. Third-party marketplace evidence narrows the most visible user
              personas to dealership general management, fixed-ops leadership, service managers, and parts managers.
              That combination suggests the buying center is the dealer principal / GM or a group-level operations
              leader, with daily usage concentrated in department-level operators who benefit from fewer handoffs and
              unified data across service, parts, sales, and accounting.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
              - CU013
      - number: '6.2'
        title: Adoption proof and expansion
        blocks:
          - type: paragraph
            body: >-
              Adoption proof is stronger than a simple customer-logo page but weaker than a full cohort disclosure.
              Independent comparison and review sources consistently place Tekion at about 3,000 dealership rooftops or
              locations, which is material scale for a post-2016 entrant attacking a legacy DMS duopoly. Publicly named
              proof is concentrated in large dealer groups and franchise ecosystems: external sources name Asbury and
              Ken Garff as deployments, point to Hartwell Automotive Group as a 2025 UK expansion reference, and
              describe Tekion as supporting 52 OEM brands or programs. Customer-review evidence is present but still
              shallow: the best structured public signal in the pool is an aggregated 40-review footprint on review
              sites, which is useful directional proof of live usage but not enough to infer broad satisfaction or
              renewal quality by segment.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Durability and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Durability remains the least-proven part of the customer story. The assigned evidence suggests DMS
              contracts are typically multi-year and that procurement must be scoped around rooftop count, modules, and
              migration work, which supports the idea that wins can be sticky once deployed. But the same pool also
              includes concrete adoption-friction signals: users reporting workflow regressions, pricing errors,
              unresolved support tickets, and rollout timelines that exceed initial estimates. That mix argues for a
              nuanced view: Tekion appears capable of landing large, complex dealership groups, yet the public proof
              does not disclose NRR, GRR, logo churn, top-customer share, or contract-length distribution. Until those
              denominators are produced in diligence, the customer base looks real and expanding, but concentration and
              renewal quality remain underwritten by proxies rather than hard retention data.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named-proof quality is stronger than a logo wall
            body: >-
              Tekion's public customer evidence clears a meaningful quality bar because the pool contains
              deployment-scale estimates, named dealer-group references, review-site footprints, and an international
              expansion reference rather than relying only on logo pages or self-asserted customer counts.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
          - type: callout
            title: Durability is inferred, not directly disclosed
            body: >-
              Multi-year contracts and complex migration work imply stickiness, but the same evidence pool surfaces
              post-migration friction while omitting NRR, GRR, churn, concentration, and contract-distribution data.
              That means the renewal thesis still needs management-provided cohort evidence.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The dominant downside is migration execution. Public comparisons repeatedly frame a Tekion deployment as a
              six-to-nine-month operational change rather than a software swap, with reported productivity drag after
              cutover and real downside if a must-have F&I, OEM, or CRM connector is immature. The second tier of risk
              is dependency quality: Tekion's open-API posture and partner ecosystem are meaningful mitigants, but
              public sources still flag uneven depth in niche workflows, OEM edge cases, and post-implementation
              support. Legal and capital risks are material but more indirect. The CDK antitrust suit highlights
              switching friction and data-portability pressure, yet public sources do not suggest fast relief. Likewise,
              a $4B-plus valuation and $600M-plus funding base reduce immediate survival risk without closing the harder
              diligence question of burn, runway, and current profitability quality.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
