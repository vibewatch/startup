  - id: FM001
    title: Public market sizing and adoption lens
    type: pyramid
    summary: >-
      Public evidence supports a constrained adoption stack rather than a clean dollar TAM, combining population,
      installed-base, and switching-friction layers.
    data:
      items:
        - label: U.S. franchised dealer network
          displayValue: 16,990 dealers / 16.2M units
          note: Broad market population lens from NADA DATA cited in the assigned pool.
          claimRefs:
            - CM004
        - label: Incumbent duopoly baseline
          displayValue: CDK 15,000 + Reynolds 17,500 rooftops; ~70% share
          note: Installed-base proxy for the legacy market structure Tekion is attacking.
          claimRefs:
            - CM003
        - label: Tekion footprint range
          displayValue: 2,500-3,000 rooftops
          note: Secondary sources disagree on the precise installed-base count.
          claimRefs:
            - CM014
        - label: Official implementation window
          displayValue: ~120 days
          note: Tekion's published go-live methodology before steady-state adoption.
          claimRefs:
            - CM007
        - label: Habit-formation window
          displayValue: 60-90 days post-launch
          note: Operational proficiency typically lags technical go-live.
          claimRefs:
            - CM007
            - CM008
        - label: Migration cost lens
          displayValue: $50k-$150k
          note: Publicly cited switching cost before recurring subscription spend.
          claimRefs:
            - CM008
    approximationNotes: >-
      Public sources do not isolate a defensible dollar TAM/SAM/SOM, so this figure deliberately combines population,
      installed-base, time-to-value, and switching-cost layers to show the reachable market constraints buyers actually
      underwrite.
    claimRefs:
      - CM003
      - CM004
      - CM007
      - CM008
      - CM014
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Tekion sits farthest toward architectural openness, while CDK and Reynolds still anchor the highest large-dealer
      operational fit because of ecosystem depth and incumbent embeddedness.
    data:
      xAxis:
        label: Architectural openness and workflow flexibility
        min: 1
        max: 5
        low: Closed legacy stack
        high: Open cloud-native stack
        description: 1-5 ordinal score derived from retained evidence
        scale: ordinal
      yAxis:
        label: Operational fit for large franchise dealers today
        min: 1
        max: 5
        low: Niche or adjunct
        high: Broad incumbent fit
        description: 1-5 ordinal score derived from retained evidence
        scale: ordinal
      points:
        - label: Tekion
          x: 5
          'y': 4
          summary: >-
            Open, unified architecture with lower formal lock-in, but fit still depends on connector diligence and
            migration execution.
          claimRefs:
            - CP002
            - CP010
            - CP011
            - CP013
        - label: CDK Global
          x: 2
          'y': 5
          summary: Incumbent breadth and OEM depth still make CDK the default fit for many complex franchise groups.
          claimRefs:
            - CP005
            - CP006
            - CP010
        - label: Reynolds & Reynolds
          x: 1
          'y': 4
          summary: Strong incumbent stability and field support are offset by the most restrictive ecosystem and exit path.
          claimRefs:
            - CP007
            - CP016
        - label: Dealertrack DMS
          x: 3
          'y': 3
          summary: >-
            Named in retained evidence as a real alternative, but the pool is shallower on deployment depth than for the
            top three.
          claimRefs:
            - CP014
        - label: DealerBuilt / Quorum class
          x: 3
          'y': 2
          summary: Secondary challengers exist, yet the retained evidence is too thin to rate them as scale-equal incumbents.
          claimRefs:
            - CP014
        - label: Status quo + workflow layer
          x: 4
          'y': 1
          summary: >-
            Adjunct automation can improve follow-up and routing, but it does not replace the dealership system of
            record.
          claimRefs:
            - CP015
            - CP016
    approximationNotes: >-
      Ordinal 1-5 coordinates synthesize retained evidence on architectural openness and present-day enterprise fit;
      they are not measured market-share or satisfaction scores.
