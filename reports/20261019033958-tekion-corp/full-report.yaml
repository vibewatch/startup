  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the sequence of enterprise quoting, implementation, recurring subscriptions, and
      transaction-linked monetization, but not the downstream gross-profit math.
    data:
      nodes:
        - id: n1
          label: Dealer rooftops and module scope
          detail: Private quotes depend on rooftop count, licensed modules, and contract terms.
        - id: n2
          label: Implementation and data conversion
          detail: Kickoff-to-go-live methodology is about 120 days, with source data needed 90-100 days before launch.
        - id: n3
          label: Go-live and adoption ramp
          detail: Teams may need 60-90 days of operational use before Tekion workflows become second nature.
        - id: n4
          label: Recurring software subscription
          detail: Core ARC monetization is subscription-based but not publicly price-listed.
        - id: n5
          label: Transaction and payment fees
          detail: Third-party profile describes per-transaction fees; payment-processing economics remain undisclosed.
        - id: n6
          label: Gross profit and cash generation
          detail: Public sources do not disclose current gross margin, burn, or runway.
    approximationNotes: >-
      This is a structural flow, not a quantified waterfall; public evidence does not support numeric
      revenue-to-gross-profit conversion values.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI008
      - CI009
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Tekion's architecture is presented as a layered dealership operating stack built around a unified core rather than
      separate departmental systems.
    data:
      layers:
        - label: Dealer-facing channels
          detail: Staff and customer interactions across showroom, service drive, payments, and digital retail.
          modules:
            - Sales
            - Service lane
            - Parts counter
            - F&I
            - Digital retail
          outputs:
            - Unified dealership workflow
          note: Evidence comes from product descriptions and independent summaries.
          tone: positive
        - label: Department workflows
          detail: Core business modules execute sales, CRM, service, parts, accounting, payroll, and payments.
          modules:
            - DMS
            - CRM
            - Service
            - Parts
            - Accounting
            - Payroll
            - Payments
          outputs:
            - Cross-department execution
          tone: positive
        - label: Shared data layer
          detail: Independent sources repeatedly describe one database or one real-time data model with no batch syncs.
          modules:
            - Customer record
            - Repair order
            - Inventory
            - Financial history
          outputs:
            - Real-time visibility
          tone: positive
        - label: Embedded AI layer
          detail: AI agents and T1 Pro are marketed as acting inside the workflow instead of beside it.
          modules:
            - Service Scheduler AI
            - Service Advisor AI
            - Technician AI
            - T1 Pro
          outputs:
            - Recommendations and task execution
          tone: positive
        - label: Partner and OEM perimeter
          detail: APC integrations and OEM certifications extend the core platform into dealer-specific ecosystems.
          modules:
            - Premium APIs
            - Webhooks
            - FTP feeds
            - OEM programs
          outputs:
            - External system connectivity
          tone: warning
        - label: Trust and control envelope
          detail: >-
            Security and responsible-AI credentials are part of the sales motion, but production assurance still needs
            diligence.
          modules:
            - ISO 42001
            - ISO 27001
            - SOC 2 Type II
            - SOC 1 Type II
            - ISO 27701
          outputs:
            - Governed AI and compliance posture
          tone: warning
    approximationNotes: >-
      Conceptual layer map synthesized from official and independent sources; it shows product structure and
      dependencies, not a disclosed tenant-by-tenant technical design.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Tekion's adoption path appears to start with executive DMS evaluation, spread through fixed operations and parts,
      and then get tested at renewal against rollout and support friction.
    data:
      nodes:
        - label: Executive DMS shortlist
          actor: Dealer principal / GM / group operations leader
          phase: Initial evaluation
          channel: Competitive DMS bake-off
          tone: neutral
          touchpoints:
            - Compare unified DMS, CRM, digital retail, service, and accounting scope
            - Check OEM program compatibility for a multi-brand store base
        - label: Service-department rollout
          actor: Fixed Ops Director / Service Manager
          phase: First operational adoption
          channel: Fixed operations
          tone: positive
          touchpoints:
            - Appointment scheduling and reminders
            - Advisor summaries and service recommendations
            - Faster repair approvals and retention-oriented service workflows
        - label: Technician workflow adoption
          actor: Technician / service lane leadership
          phase: AI workflow expansion
          channel: Service lane
          tone: positive
          touchpoints:
            - Inspection recommendations across the service lane
            - In-workflow AI actions rather than separate copilots
        - label: Parts workflow expansion
          actor: Parts Manager
          phase: Cross-department expansion
          channel: Parts operations
          tone: positive
          touchpoints:
            - Inventory movement and back-counter workflow
            - Wholesale e-commerce support for parts operations
        - label: Multi-rooftop standardization
          actor: Dealer-group leadership
          phase: Group-level scaling
          channel: Reporting and governance
          tone: positive
          touchpoints:
            - Centralized reporting and standardized workflows
            - OEM-program breadth that fits complex franchise groups
        - label: Renewal risk checkpoint
          actor: CIO / operations leadership
          phase: Post-go-live review
          channel: Support and contract renewal
          tone: adverse
          touchpoints:
            - Workflow regressions and pricing errors after migration
            - Unresolved support tickets and extended dual-run timelines
            - Renewal and exit terms need scrutiny because public retention metrics are absent
    approximationNotes: >-
      Journey stages are synthesized from role-based workflow evidence and adverse rollout commentary; the figure shows
      likely adoption sequence, not measured conversion rates between stages.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Migration and dependency risks remain the highest residual exposure even after public mitigants are credited.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Migration execution
          values:
            - label: High
              tone: high
              note: Six-to-nine-month migrations and quote slippage recur across retained comparisons.
            - label: High
              tone: high
              note: Core dealership workflows move together, so cutover errors hit sales, service, parts, and accounting.
            - label: Medium
              tone: medium
              note: Vendors describe migration teams and phased rollout, but public proof is still anecdotal.
            - label: High
              tone: high
              note: Large-group deployments remain exposed to connector misses and productivity drag.
        - label: Integration dependency
          values:
            - label: High
              tone: high
              note: Public sources still flag niche lender, F&I, and specialty-tool gaps.
            - label: High
              tone: high
              note: One missing must-have connector can delay revenue capture or force manual workarounds.
            - label: Medium
              tone: medium
              note: 250+ partners and open APIs help, but they are not equivalent to proven parity in every workflow.
            - label: High
              tone: high
              note: Buyer-specific connector proof is still required before underwriting deployment risk.
        - label: OEM and compliance coverage
          values:
            - label: Medium
              tone: medium
              note: Tekion shows broad OEM coverage, but public comparisons still call out regional and workflow exceptions.
            - label: High
              tone: high
              note: Certification gaps can block rollout for a target franchise mix even if the core stack is strong.
            - label: Medium
              tone: medium
              note: Existing certifications are a real mitigant, but not a substitute for workflow-level validation.
            - label: Medium
              tone: medium
              note: Residual exposure falls only after brand-specific proof and live references are reviewed.
        - label: Security and capital proof
          values:
            - label: Medium
              tone: medium
              note: No major public Tekion incident appears in the retained evidence, but future scale is the harder test.
            - label: High
              tone: high
              note: >-
                A serious outage or capital squeeze during migration would directly impair dealer trust and rollout
                pace.
            - label: Medium
              tone: medium
              note: ISO 42001 positioning and large funding rounds help, but burn and runway remain undisclosed publicly.
            - label: Medium
              tone: medium
              note: Residual exposure stays material until management supplies incident history and current financial proof.
        - label: Support durability
          values:
            - label: Medium
              tone: medium
              note: Public review evidence is not uniformly negative, but mature-deployment service quality is mixed.
            - label: Medium
              tone: medium
              note: Weak post-live support can lengthen stabilization and dilute dealer ROI after migration.
            - label: Low
              tone: high
              note: Retained evidence does not provide audited CSAT, retention, or SLA attainment metrics.
            - label: Medium
              tone: medium
              note: Residual exposure remains meaningful until live ticket and renewal evidence is produced.
        - label: Capital efficiency visibility
          values:
            - label: Medium
              tone: medium
              note: Public funding history is clear, but current burn, gross margin, and runway are not.
            - label: High
              tone: high
              note: >-
                If capital efficiency is weak, enterprise rollouts can be constrained by support and implementation
                intensity.
            - label: Low
              tone: high
              note: Public mitigants show access to capital, not proven self-funded operating leverage.
            - label: Medium
              tone: medium
              note: Exposure falls only after management discloses current profitability and cash durability.
    approximationNotes: Cells summarize retained public evidence qualitatively; they are not derived from a quantified risk-scoring model.
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation remains research-more because operating promise does not yet bridge to an underwritable entry
      price.
    data:
      nodes:
        - id: proof
          label: Product proof
          detail: >-
            Unified cloud-native architecture is consistently described, but independent production benchmarking is
            limited.
        - id: adoption
          label: Adoption signal
          detail: Approximately 3,000 rooftops are reported as of 2025.
        - id: momentum
          label: Growth signal
          detail: VendorMotive reports a company-announced 60% ARC revenue growth rate for 2025.
        - id: execution
          label: Execution discount
          detail: Community evidence flags implementation staffing, CRM completeness, and roadmap delivery.
        - id: price
          label: Price evidence gap
          detail: A reported $4B financing mark exists, but audited economics, current terms, and comparable multiples do not.
        - id: decision
          label: Research more
          detail: >-
            Require primary financials, customer cohorts, cap-table terms, and price protection before underwriting
            return.
    approximationNotes: The ordered flow is qualitative and does not assign weights, probabilities, or value contribution to its stages.
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
