              - CR007
              - CR008
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Execution and platform-readiness risks
        blocks:
          - type: paragraph
            body: >-
              The evidence set supports a nuanced platform-risk view. Tekion's own materials and third-party vendor
              analysis consistently describe a unified, cloud-native stack and ISO 42001 AI governance, which are useful
              mitigation signals for data flow, model governance, and secure workflow design. Those positives do not
              close readiness risk for large live-store conversions. Independent comparisons still describe timeline
              slippage, training burden, support variability after implementation, and unresolved questions about
              whether reliability at Tekion's current scale can be extrapolated to a much larger installed base. The
              absence of a major public Tekion outage in this retained evidence set is directionally positive, but it is
              not the same thing as proven resilience under CDK-like scale or dealer concentration.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Dependency, financial, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Tekion's most investment-relevant dependencies sit outside the headline product demo. Public comparisons
              still warn that lender coverage, niche fixed-ops tools, OEM-specific accounting and warranty workflows,
              and incumbent-controlled data extraction can each delay value realization even when the core ARC platform
              is stronger than legacy alternatives. Broad OEM certifications and a large partner count are real
              mitigants, but they are not substitutes for buyer-specific proof. The practical kill criteria are
              measurable: abandon or reprice the thesis if management cannot provide a signed connector inventory for
              must-keep workflows, a credible phased conversion plan with enterprise references, or hard evidence that
              current burn, cash runway, and support staffing can absorb a long migration cycle.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Migration is the thesis-break risk
            body: >-
              Tekion's downside is execution concentration: if rollout timelines slip, must-have connectors fail, or
              productivity remains depressed beyond the first stabilization window, product strength will not rescue
              dealer ROI.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: callout
            title: Open APIs reduce but do not erase lock-in risk
            body: >-
              Public evidence supports Tekion's partner breadth, but not universal workflow parity; buyer-specific
              lender, OEM, and fixed-ops connectors must still be proven live before underwriting a switch.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR008
          - type: callout
            title: Capital risk is now an evidence problem, not a fundraising problem
            body: >-
              Public sources imply Tekion can raise capital, but retained evidence still does not prove current burn,
              cash runway, or achieved profitability.
            calloutType: assumption
            claimRefs:
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and financing context
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more, with medium-low confidence, medium-high risk, and an
              unsupported valuation stance. VendorMotive reports approximately $665 million raised across five rounds,
              including a $200 million July 2024 Dragoneer round at a $4 billion valuation; that is a financing mark,
              not evidence of cash available today or a current fair value. The same source estimates annual revenue at
              $100 million to $200 million, but the retained evidence does not provide audited revenue, ARR, gross
              margin, EBITDA, cash flow, or preference terms. Accordingly, neither a target return nor a hold period can
              be responsibly underwritten from public inputs. Entry discipline should require primary financials and a
              fully diluted preference waterfall before any price recommendation.
            claimRefs:
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Tekion has credible product and adoption signals: its own materials describe a unified
              real-time data model, VendorMotive reports approximately 3,000 dealership rooftops as of 2025, and an
              independent marketplace profile also describes a unified cloud-native platform. The anti-thesis is
              operational rather than conceptual. DealerRefresh's synthesis of 13 community threads reports
              inconsistent, understaffed implementations, an incomplete CRM for some dealer groups, and a gap between
              roadmap claims and production readiness. The same review reports meaningful technology-spend reductions
              for some switchers, but those reports are not audited customer economics. Product architecture and
              customer appetite therefore improve the diligence case without resolving deployment quality or valuation
              support.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should remain directional because the retained pool contains no defensible
              public-company, M&A, or private-round multiple set with matched growth, margin, retention, and
              capital-structure data. The bull case requires verified continuation of the reported 60% ARC revenue
              growth, durable enterprise deployment, and implementation improvement; it could justify re-testing value
              above the reported financing mark, but no premium is quantified. The base case treats $4 billion only as
              the last reported round reference and withholds a fair-value range. The bear case is a down-round outcome
              below that mark if deployment friction, incomplete functionality, litigation costs, or weak unit economics
              impair growth. CDK and Reynolds are operating references, not independent valuation benchmarks in this
              evidence set.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Decision logic, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The decision chain starts with credible category disruption and reported adoption, then discounts those
              signals for implementation risk, legal uncertainty, undisclosed pricing, and missing financial disclosure.
              Law360's case chronology shows that Tekion's monopolization claims survived a dismissal attempt in July
              2025, but the court later refused an amendment request in August 2026; neither event establishes the
              ultimate merits or financial outcome. Exit readiness is therefore unproven. Before investment, obtain
              audited cohort retention, gross margin, cash burn, runway, customer concentration, deployment timelines,
              current capitalization, and liquidation preferences. Thesis-break triggers are verified growth
              deceleration, persistent multi-rooftop implementation failures, material CRM replacement costs, or
              preference overhang that prevents a target return at the entry price.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price evidence, not company quality, is the binding constraint
            body: >-
              Do not infer a buy signal from the reported funding total, rooftop count, or 2025 ARC revenue growth.
              Advance only if primary diligence establishes durable unit economics and an entry structure capable of
              meeting the investor's target return.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
