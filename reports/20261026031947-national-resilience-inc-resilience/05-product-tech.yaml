company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 5
  title: Product & Technology
  summary: Resilience describes a CDMO model spanning process development, biologics drug substance, and sterile drug product, with company-stated development and installed capacities from 3L through 2,000L. Its public technical case is strongest on service breadth and a Cincinnati–Toronto operating focus; independent evidence on site-level qualification, throughput, reliability, and quality outcomes remains limited.
sections:
  - id: product-scope
    title: Product scope and maturity
    body: >-
      Resilience sells manufacturing and development services rather than a single finished
      software product. Its official biotech FAQ describes support from preclinical and early
      phase through commercial tech transfer, while the drug-substance page presents biologics
      manufacturing as a program-specific service. The company says development uses single-use
      bioreactors from 3L to 500L and installed cGMP capacity ranges from 50L to 2,000L; those
      are company-reported capacity bands, not evidence of current utilization, validated
      throughput, or a customer's production outcome. The company's own pages also list process
      and analytical development, drug substance, and sterile fill/finish. Third-party directories
      describe broader cell, gene, RNA, and vaccine capabilities, but the assigned evidence does
      not independently establish current site-level readiness for each modality. The module
      matrix therefore separates documented service descriptions from listed-but-unverified
      platform breadth.
    claimRefs: [CE001, CE002, CE007, CE008]
    tableRefs: [TE001]
  - id: delivery-workflow
    title: Delivery workflow and operating footprint
    body: >-
      The described customer workflow begins with process and analytical development, proceeds
      through stage-gated technology transfer and validation, and can continue into drug-substance
      and sterile drug-product manufacturing. Resilience says drug substance is manufactured in
      Toronto or supplied by the customer, while sterile fill/finish is offered at both Cincinnati
      and Toronto; it also says the clinical-to-commercial programs use one integrated quality
      system. These are descriptions of the offered model, not independently verified evidence
      that every program traverses every site or stage. External trade coverage records a
      footprint reset: Pharma Manufacturing reported plans to wind down six underutilized sites
      while retaining production in four named locations, and BioProcess International later
      reported a Blue Ash headquarters move and West Chester fill/finish-line investment. This
      makes site-specific transfer, qualification, and capacity evidence important to diligence.
    claimRefs: [CE003, CE004, CE005, CE010, CE011, CE012, CE015]
    tableRefs: [TE002]
  - id: technical-architecture
    title: Architecture, quality controls, and operating risk
    body: >-
      The evidence supports a capability-layer view, not a detailed equipment, data, or process
      architecture. Public company material gives development and installed-volume ranges, names
      a common quality-system approach, and describes a Type V facility Drug Master File and
      regulatory support; FDA material separately explains the general cGMP requirements that
      apply to drug manufacturing. Neither establishes Resilience's current inspection results,
      deviation history, release performance, cybersecurity controls, or site-by-site qualified
      capacity. The announced network consolidation and planned sterile-injectable expansion
      create execution dependencies around transfer, validation, staffing, and line qualification,
      but are not evidence of a failure. Investors should treat the absence of company-specific
      operating metrics in this source pool as an evidence gap rather than infer either poor
      performance or proven reliability. The assigned pool also contains no relevant practitioner-
      community, public-engineer, or integration-partner technical signal; this is a gap in the
      available evidence, not proof that no such signal exists.
    claimRefs: [CE002, CE005, CE006, CE012, CE013, CE014, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
