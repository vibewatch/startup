      - ["Process development and technology transfer", "Programs moving from development or another CDMO toward GMP supply", "Company describes process/analytical development and stage-gated transfer", "Company says checkpoints include characterization and validation", "Request transfer timelines, success rates, and program-level references"]
    notes: >-
      Sources mix company descriptions with third-party directory listings. Capacity bands and
      service availability are company-reported; listed modalities do not establish site-level
      qualification, utilization, or completed customer outcomes.
    claimRefs: [CE001, CE002, CE003, CE004, CE007, CE008]
  - id: TE002
    title: Workflow and use-case evidence
    columns: [Customer job or stage, Current workflow or dependency, Resilience-described service, Measurable benefit in assigned evidence, Limitation]
    rows:
      - ["Early development", "Establish process and analytical methods before GMP scale-up", "Company says development runs in single-use bioreactors from 3L to 500L", "No validated cycle-time or yield benefit disclosed", "Program-specific method and transfer data unavailable"]
      - ["Technology transfer", "Transfer process knowledge and establish characterization and validation checkpoints", "Company describes a stage-gated transfer led through commercial supply", "No transfer success rate or duration disclosed", "Customer references and site-specific outcomes unavailable"]
      - ["Drug-substance production", "Manufacture biologics at clinical or commercial stages", "Company says drug substance runs at Toronto or is customer-supplied and installed cGMP capacity spans 50L–2,000L", "No current throughput or utilization disclosed", "Installed capacity is not equivalent to available capacity"]
      - ["Sterile drug-product supply", "Fill and finish injectable products across a multi-site network", "Company says fill/finish is available at Cincinnati and Toronto and describes Cincinnati expansion", "No qualified line output or on-time delivery data disclosed", "Expansion and line qualification status need verification"]
    notes: >-
      Workflow and capacity descriptions are from company materials; the assigned sources provide
      no independently measured customer outcome, cycle time, yield, utilization, or service level.
    claimRefs: [CE002, CE003, CE004, CE010, CE011, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or component, Role, Dependency, Principal diligence risk]
    rows:
      - ["Process and analytical development", "Develop and characterize a customer process before manufacturing", "Company-described development infrastructure and technical teams", "Confirm assay transfer, process comparability, and development-to-GMP timelines"]
      - ["Drug-substance manufacturing", "Biologics production in installed cGMP capacity", "Company says Toronto performs drug substance or customers supply it; capacity bands are 50L–2,000L", "Verify qualified suites, utilization, yields, and commercial campaign performance"]
      - ["Sterile drug-product operations", "Fill/finish and related injectable handling", "Company says fill/finish is offered in Cincinnati and Toronto; Cincinnati expansion is in progress", "Verify line qualification, validated output, device-assembly scope, and transfer dependencies"]
      - ["Quality and regulatory support", "Support GMP programs and regulatory submissions", "Company describes one integrated quality system, a Type V facility Drug Master File, and a Letter of Authorization", "Obtain current inspection, audit, CAPA, and site-specific regulatory records"]
    notes: >-
      This is an evidence-bounded operating model, not a verified process sequence or complete
      facility map. Company statements are not independent confirmation of qualification or
      performance; FDA material describes the general regulatory baseline.
    claimRefs: [CE002, CE003, CE005, CE006, CE014, CE016]
