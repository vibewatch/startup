schemaVersion: "report-v2"
artifact: valuation
slug: national-resilience-inc-resilience
runDate: 2026-10-26
company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 8
  title: Valuation
  summary: >-
    Resilience has disclosed meaningful manufacturing scale, Lilly-linked production,
    and substantial debt financing, but the retained evidence does not establish
    enterprise value, cash generation, or equity terms. The appropriate call is
    research-more with an unknown valuation stance until private financial and
    capitalization data support a price-sensitive model.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The evidence supports a research-more recommendation, low confidence, high
      risk, and an unknown valuation stance—not a price target. Resilience
      describes technical capabilities and a sizeable Ohio footprint, while
      company-issued sources report Lilly production milestones (CV001, CV002,
      CV004, CV010). The financing announcement is for debt of up to $825 million,
      not an equity valuation or proof of cash on hand (CV006). A funding
      aggregator's cumulative figure combines financing categories and is not
      deployable cash (CV008). Without current revenue, EBITDA, cash conversion,
      net debt, utilization, or a fully diluted capitalization, a DCF, EV/revenue
      multiple, or investor return range would be false precision (CV016). Entry
      discipline is therefore to defer a price decision until management supplies
      these inputs and the financing documents; the summary below records what
      evidence would change the call.
    claimRefs: [CV001, CV002, CV004, CV006, CV008, CV010, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is operational rather than financial: company materials
      describe commercial-scale biologics and sterile-product capabilities, a
      multi-year Lilly relationship, and reported production above 150 million
      doses (CV004, CV009, CV010). These are evidence of capabilities and
      execution claims, not of backlog, customer concentration, margin, or cash
      yield. The anti-thesis is that the company has used long-term debt to fund a
      business reset, while reporting from Pharma Manufacturing describes an earlier
      bridge financing and six underutilized sites being wound down (CV006, CV007,
      CV012). A later company-issued update describes another non-core asset
      divestiture (CV013). The bull case needs audited economics and line-level
      utilization; the bear case strengthens if debt service, site absorption, or
      Lilly ramp timing weakens.
    claimRefs: [CV004, CV005, CV006, CV007, CV009, CV010, CV012, CV013]
    tableRefs: [TV002]
  - id: valuation-method-and-scenarios
    title: Valuation frame and scenarios
    body: >-
      The available references do not produce a defensible company multiple. The
      OHA financing is a debt commitment, not a transaction valuation; Clay's
      funding total aggregates disclosed financing and other sources rather than
      measuring current cash or equity value (CV006, CV007, CV008). OXB's disclosed
      $4.5 million purchase was for a specific viral-vector facility and asset
      package, not Resilience's retained enterprise, so it is not a comparable
      company valuation (CV014). Lilly's reported market capitalization describes
      a customer/partner, not Resilience or a CDMO peer multiple (CV005). Lonza's
      investor-relations page links to public reports and share information, while
      a historical Thermo Fisher revenue series offers only scale context; neither
      provides a Resilience-specific CDMO multiple (CV015). Scenario values and probabilities
      are intentionally not numeric: no revenue base, margins, debt balance,
      dilution, or exit multiple is evidenced. The framework below uses only
      directional signals; the flow figure shows why those signals stop at
      research-more.
    claimRefs: [CV006, CV007, CV008, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-thesis-breaks
    title: Diligence gates and thesis breaks
    body: >-
      Before underwriting an entry, obtain audited statements and current management
      accounts, including revenue by site and customer, EBITDA and cash flow,
      working capital, capex, utilization, backlog, and contract duration. Reconcile
      the headline financing ceiling to funded amounts, current debt, maturity,
      pricing, collateral, covenants, and any preferred-equity or shareholder
      waterfall (CV007, CV008). Use SEC EDGAR search as a public-record check, not
      as evidence that no filing exists (CV003). Confirm the status and timing of the Lilly expansion
      against commissioning, qualification, and commercial-ramp milestones rather
      than treating planned jobs or early-2027 operations as realized (CV009,
      CV011). Thesis-break indicators are sustained utilization shortfalls, missed
      qualification or volume milestones, renewed facility exits, or debt terms
      that leave insufficient cash for the retained network. No target return,
      holding period, or exit value is supportable until those gaps close (CV012,
      CV013, CV016).
    claimRefs: [CV003, CV007, CV008, CV009, CV011, CV012, CV013, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: ["Decision dimension", "Evidence-based call", "Entry implication", "What would change the view"]
    rows:
      - ["Recommendation", "Research-more", "Do not price an investment from the financing ceiling or company scale claims alone.", "Review a price only after current operating and capitalization data reconcile."]
      - ["Confidence", "Low", "The retained public evidence is incomplete for equity underwriting.", "Increase confidence after audited financials, debt documents, and customer-level operating data."]
      - ["Risk rating", "High", "Debt-funded transformation and site-reset execution require downside protection.", "Reassess after debt service, utilization, and ramp milestones are verified."]
      - ["Valuation stance", "Unknown", "No supported valuation range, multiple, or target return.", "Set a range only after revenue, margins, net debt, dilution, and exit assumptions are evidenced."]
    notes: >-
      Qualitative decision summary only. No price, return, probability, or company
      financial metric is estimated because those inputs are not disclosed in the
      retained evidence.
    claimRefs: [CV006, CV007, CV008, CV012, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: ["Argument", "Evidence in retained sources", "Anti-thesis / what would change the view"]
    rows:
      - ["Integrated operating capability", "Company pages describe biologics drug substance, sterile drug product, device assembly, and single-use manufacturing trains from 50L to 2,000L.", "Capability does not establish utilization, yield, margins, or customer economics; verify by site and program."]
      - ["Customer execution signal", "Company materials report more than 150 million Lilly doses produced and a $750 million joint investment announcement.", "The material does not disclose contract economics, customer concentration, or realized incremental revenue."]
      - ["Capital to support the reset", "The OHA release describes financing of up to $825 million, with a $600 million first-lien commitment and staged funding.", "Debt is not equity value or cash already drawn; obtain the executed debt package and current balance."]
      - ["Focused footprint may improve returns", "Industry reporting describes a prior bridge financing and six site wind-downs; a later company update reports an East Norriton divestiture.", "Portfolio pruning can improve focus but also signals prior overcapacity; verify remaining-site utilization and costs."]
    notes: >-
      Company announcements are attributed as such; syndicated releases do not count
      as independent corroboration. The table distinguishes operational proof from
      financial proof.
    claimRefs: [CV004, CV006, CV007, CV009, CV010, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns: ["Case", "Assumptions", "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - ["Bull", "Lilly expansion commissions on schedule; retained facilities achieve sustained commercial utilization and diversified programs.", "Potentially higher value from recurring, profitable production, but no range is calculable without revenue, margin, capex, and debt data.", "Directional upside only; current evidence does not support a numeric probability.", "Delayed qualification, volume ramp, or customer diversification."]
      - ["Base", "The company executes a focused network but operating economics and debt terms remain private.", "Maintain unknown stance; wait for audited results and net-debt bridge before applying DCF or a peer multiple.", "Research-more is the only supportable present signal.", "No disclosure of cash conversion, site utilization, or current debt service."]
      - ["Bear", "Demand or qualification underperforms while debt service and retained-site costs remain material.", "Equity value could be impaired, but the loss or recovery amount cannot be estimated from the available sources.", "Material downside is plausible; no numeric probability is evidenced.", "Missed ramp milestones, additional exits, or restrictive debt terms."]
      - ["Decision gate", "Verify financial statements, financing documents, capitalization, and customer/site economics.", "Only then set entry price, target return, hold period, and exit cases.", "Re-rate after evidence review, not on funding headline.", "Failure to provide core diligence data keeps the stance unknown."]
    notes: >-
      Cases are qualitative and contain no invented valuation ranges or probabilities.
      The $825 million financing ceiling is not treated as cash, revenue, or equity
      value; all valuation outputs remain unavailable pending diligence.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported operating scale and customer production are offset by debt, reset
      execution risk, and missing valuation inputs, leading to research-more.
    data:
      nodes:
        - id: operating-scale
          label: "Operating scale"
          detail: "Company-reported 50L to 2,000L single-use trains and team expertise."
        - id: customer-proof
          label: "Customer proof"
          detail: "Company-reported Lilly production and expansion."
        - id: debt-financed-reset
          label: "Debt-financed reset"
          detail: "Up to $825 million announced; terms do not establish cash on hand."
        - id: execution-risk
          label: "Execution risk"
          detail: "Prior site wind-downs and a later non-core asset divestiture."
        - id: missing-economics
          label: "Missing economics"
          detail: "No supported current valuation, revenue, margins, net debt, or dilution."
        - id: recommendation
          label: "Research-more"
          detail: "Defer price and return targets until private financial and capital data are verified."
    claimRefs: [CV001, CV004, CV006, CV007, CV009, CV010, CV012, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: No price target from the financing headline
    body: >-
      Treat the OHA facility as debt financing with staged commitments, not as a
      valuation mark or cash balance. Keep valuation unknown until current
      financials, debt terms, and fully diluted capitalization are available.
    claimRefs: [CV006, CV007, CV008, CV016]
