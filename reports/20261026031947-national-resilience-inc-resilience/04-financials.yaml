runDate: 2026-10-26
company:
  name: "National Resilience, Inc. (Resilience)"
chapter:
  number: 4
  title: Financials
  summary: >-
    Resilience publicly describes a broad biologics and sterile drug-product
    CDMO service model and has reported large-scale Lilly production, but these
    disclosures do not establish realized revenue, price, margins, current
    liquidity, or utilization. A debt-financed operating reset and the absence
    of site- and customer-level economics leave underwriting conditional on
    private financial and contract evidence.
sections:
  - id: revenue-model
    title: Service scope is visible; monetization is not
    body: >-
      Resilience describes development and tech-transfer work from early-stage
      programs through commercial supply, plus biologics drug substance, sterile
      fill-finish, device assembly, and packaging. Its public capacity figures
      are equipment and site claims, not evidence of booked demand, annual
      throughput, recognized sales, or utilization. The operating model is
      therefore best understood as outsourced development and manufacturing
      services whose financial conversion depends on customer scope and
      contract terms that are not public. The revenue streams table separates
      company-described capabilities from reported financial performance. The
      flow is an illustrative service-to-economics path: customers may procure
      only selected stages, and no assigned source discloses billing units,
      realized price, or margin.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI013
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-and-capital
    title: Debt commitments and customer output are not revenue
    body: >-
      Resilience announced up to $825 million of long-term debt financing from
      Oak Hill Advisors, including a $600 million first-lien commitment and an
      initial $525 million tranche then expected in the fourth quarter of 2025,
      subject to customary conditions. This announcement does not establish
      current cash, the amount actually drawn, debt outstanding, or runway.
      Resilience and Lilly separately described a $750 million investment in
      expanded Ohio manufacturing and reported more than 150 million doses
      produced over their multi-year partnership; neither figure is Resilience
      revenue or a disclosed share of customer economics. The September 2026
      company announcement of an East Norriton divestiture, following earlier
      reported underutilized-site wind-downs, shows a continuing footprint
      reset, not proof that retained capacity is now fully absorbed.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI017
      - CI011
    tableRefs:
      - TI002
  - id: underwriting-gaps
    title: Private operating metrics still block unit-economics underwriting
    body: >-
      No assigned public source reports current service-line revenue, realized
      prices, gross margin, customer concentration, site utilization, or
      operating cash flow. The historical report that capacity expansion
      outpaced demand makes fixed-cost absorption and ramp timing especially
      material; it is not a current utilization measure. Competitor-issued
      industry commentary argues that manufacturing economics include quality,
      delay, and supply-interruption costs as well as batch price, but it is
      qualitative context rather than an independent Resilience benchmark. The
      financial verdict is that the service portfolio and customer output are
      commercially relevant, while margin path, capital intensity, debt
      service, and cash conversion remain unproven. Before underwriting, obtain
      site- and customer-level financials, executed contract terms, backlog,
      working-capital needs, and the current debt and cash schedule.
    claimRefs:
      - CI017
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI003
tables:
  - id: TI001
    title: Revenue streams and disclosed commercial status
    columns:
      - Service stream
      - Publicly described scope
      - Disclosed unit or scale
      - Public revenue or value
      - Evidence quality
      - Diligence ask
    rows:
      - - "Development and tech transfer"
        - "Company describes preclinical and early-phase development through commercial tech transfer."
        - "Development bioreactors are stated as 3L to 500L."
        - "No program volume, fee, or recognized revenue disclosed."
        - "Company website statement; not an independently verified operating metric."
        - "Obtain fees, milestone timing, active programs, and realized revenue by stage."
      - - "Biologics drug substance"
        - "Biologics drug-substance manufacturing is part of the public CDMO offer."
        - "Company states single-use trains span 50L to 2,000L; this is not annual capacity."
        - "No batches, utilization, revenue, or revenue mix disclosed."
        - "Company-described capability."
        - "Request batches, yield, utilization, price, and gross margin by site and modality."
      - - "Sterile drug product and fill-finish"
        - "Company materials describe aseptic manufacturing as part of the focused portfolio."
        - "Public materials describe fill-finish at Cincinnati and Toronto."
        - "No line-level throughput, booked backlog, or realized price disclosed."
        - "Company-described footprint and strategy; not proof of current utilization."
        - "Request validation status, commercial batches, line ramp, and fixed-cost absorption."
      - - "Device assembly and packaging"
        - "Company describes these as part of its integrated manufacturing offer."
        - "The Lilly expansion announcement identifies KwikPen production in Ohio."
        - "Customer attachment rate and related revenue are not disclosed."
        - "Company and partner announcement; planned operations are not realized financials."
        - "Request service attachment, per-unit economics, and release milestones."
      - - "End-to-end program delivery"
        - "Company describes a path from drug substance through sterile fill-finish and packaging."
        - "The public materials do not state how many customers use every stage."
        - "Contract scope and service-line mix are not reported."
        - "Company description, not a quantified revenue breakdown."
        - "Request contract-level scope, billing units, renewal terms, and revenue recognition."
    notes: >-
      Public service pages and company or partner announcements establish the
      described offer, not its completeness, customer uptake, revenue, or
      utilization. Missing values mean not disclosed in the assigned sources,
      not zero. Capacity figures are vessel or development scale, not annual
      production capacity.
    claimRefs:
      - CI001
      - CI002
      - CI003
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Commercial input
      - Public price, unit, or period
      - Disclosed terms
      - Why it matters
      - Specific diligence ask
    rows:
      - - "Development and tech transfer"
        - null
        - "No rate card, payment milestones, or cancellation terms disclosed."
        - "Development work can precede manufacturing revenue and may require customer-specific effort."
        - "Provide list and realized prices, milestone triggers, and scope-change history."
      - - "Drug-substance manufacturing"
        - null
        - "No price per batch, liter, or campaign and no minimum-volume terms disclosed."
        - "Capacity scale alone cannot establish sales or contribution margin."
        - "Provide executed pricing schedules and realized price by product and site."
      - - "Sterile fill-finish and device assembly"
        - null
        - "No unit pricing, minimum commitment, discount, or allocation of the Lilly investment disclosed."
        - "A customer expansion can support demand but not establish Resilience's economics."
        - "Provide customer contract economics, output pricing, and any pass-through costs."
      - - "Contract duration and recognition"
        - null
        - "Contract tenor, renewal, take-or-pay, recognition, and cash-collection terms not disclosed."
        - "Backlog quality and cash conversion depend on these terms."
        - "Reconcile contract liabilities, work in process, recognized revenue, invoices, and cash receipts."
    notes: >-
      Nulls denote prices or terms not present in the assigned evidence, not
      zero values. The joint Lilly investment and dose-production statements
      are not price, revenue, or margin disclosures.
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI013
      - CI016
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns:
      - Metric
      - Public value
      - Period or denominator
      - Underwriting implication
      - Specific diligence request
    rows:
      - - "Revenue and revenue mix"
        - null
        - "No period, service-line, site, or customer denominator disclosed."
        - "Scale, growth, revenue quality, and service mix cannot be assessed."
        - "Provide audited monthly revenue by site, customer, modality, and service line."
      - - "Realized price and gross margin"
        - null
        - "No billing unit, net price, cost allocation, or product denominator disclosed."
        - "No basis to test margin path or cross-subsidization."
        - "Provide realized price and gross-margin bridge by service, site, and customer, including labor, materials, quality, and rework."
      - - "Utilization and booked capacity"
        - null
        - "No current line-level utilization or backlog period disclosed."
        - "The 2025 underutilized-site reporting makes fixed-cost absorption and ramp risk material, but does not measure current use."
        - "Provide monthly available, qualified, scheduled, and utilized capacity by retained site."
      - - "Cash, burn, and runway"
        - null
        - "No current cash balance, operating cash flow, or burn period disclosed."
        - "A debt financing announcement does not establish liquidity or runway."
        - "Provide unrestricted cash, monthly operating cash flow, and downside runway."
      - - "Debt drawn, net debt, covenants, and maturities"
        - "Up to $825 million of long-term debt financing was announced; current drawn amount is not stated."
        - "Announcement terms include a $600 million first-lien commitment and a $525 million initial tranche expected in Q4 2025, subject to conditions."
        - "Leverage and debt-service capacity cannot be calculated from the announced ceiling."
        - "Provide actual drawdowns, interest, amortization, maturity, collateral, covenants, and headroom."
      - - "Capex and commissioning"
        - "Resilience and Lilly announced $750 million of investment in expanded Ohio manufacturing."
        - "The announcement describes joint investment; company contribution, amount spent, and project return are not disclosed."
        - "The investment figure is not Resilience cash available or revenue."
        - "Provide company-funded and partner-funded capex, spent and committed amounts, remaining cost, and return hurdles."
      - - "Working capital and cash conversion"
        - null
        - "No receivables, inventory, payables, or cash-conversion period disclosed."
        - "Batch duration and customer payment timing may create material funding needs."
        - "Provide monthly DSO, inventory and work-in-process, DPO, and cash conversion by service."
      - - "Customer concentration and contract duration"
        - "The company and Lilly reported more than 150 million doses produced across their multi-year partnership."
        - "Dose count is cumulative output as described in the announcement; revenue share, period, contract tenor, and margin are not disclosed."
        - "Production volume is not revenue or a measure of customer concentration."
        - "Provide top-10 revenue and gross profit, executed terms, renewal rates, and backlog coverage."
    notes: >-
      No unsupported financial value has been imputed. The debt amount is an
      announced financing ceiling, not cash raised, current cash, or the
      outstanding balance. The $750 million figure is a joint Resilience-Lilly
      investment announcement, not a disclosed Resilience-only contribution.
      Dose output is not revenue.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI017
      - CI011
      - CI014
      - CI015
      - CI016
