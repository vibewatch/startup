      - ["Price and contract flexibility", "No comparable public price, contract unit, or realized rate found in retained source texts", "Unknown", "Unknown", "Unknown", "Do not infer pricing power, discounts, or switching costs"]
    notes: "Unknown cells indicate that the assigned sources do not support a company-level comparison. Company statements remain attributed claims; the matrix does not verify quality, capacity, or commercial performance."
    claimRefs: [CP001, CP002, CP004, CP011, CP012, CP013]
  - id: TP003
    title: Pricing and packaging evidence status
    columns: [Pricing dimension, Resilience, Peer CDMOs, What can be concluded, Diligence implication]
    rows:
      - ["Published list price", "Not disclosed in the retained company pages", "No peer price list in the assigned pool", "No like-for-like price comparison is supportable", "Request current rate cards by modality, scale, and phase"]
      - ["Unit / contract model", "No price-per-batch, capacity reservation, or milestone schedule disclosed in retained evidence", "Not available", "Commercial terms remain unknown", "Obtain representative redacted contracts and change-order terms"]
      - ["Discounts / realized price", "No realized rates or discount data disclosed", "Not available", "List-to-net economics cannot be estimated", "Request booked-versus-realized pricing by service line"]
      - ["Switching and transfer costs", "No customer transfer-cost or renewal evidence in retained materials", "No peer comparison", "Lock-in and multi-homing are unresolved", "Interview current and former customers and review tech-transfer timelines"]
    notes: "This table records disclosure gaps in the assigned source set, not a finding that prices or terms are unavailable to customers."
    claimRefs: [CP011, CP012, CP014]
