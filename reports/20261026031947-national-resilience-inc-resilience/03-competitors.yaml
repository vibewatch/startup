      - ["Technical scale and support", "Company-hosted materials state 50 L–2,000 L installed single-use capacity and direct access to technical teams", "Unknown", "Unknown", "Buyer-specific and unknown", "Claimed scope is measurable; installed utilization and scale-up success are not"]
      - ["Commercial readiness", "Sources describe commercial licensing and planned Blue Ash / West Chester expansion; one line was expected to begin commercial production in early 2027 as of July 2026", "Unknown", "Unknown", "Unknown", "Plans and claimed licenses do not establish realized throughput or on-time launch"]
