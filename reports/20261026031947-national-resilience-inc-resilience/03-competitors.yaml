company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 3
  title: Competitors
  summary: Resilience's stated competitive proposition is an integrated North American biologics and sterile drug-product network, but its 2025 footprint reset and 2026 divestiture narrow the breadth of that story. The assigned evidence supports capability and public-peer context, not a named competitor ranking, comparable pricing, or proof of customer switching costs.
sections:
  - id: competitive-set
    title: Competitive set and strategic position
    body: >-
      The available evidence does not identify named direct CDMO peers or provide a
      peer-by-peer comparison of customer segments, revenues, utilization, or contract
      wins. It instead distinguishes broad public-market archetypes: larger scaled
      biologics manufacturers, smaller specialized platforms, and earlier-stage
      operators. Those categories are useful context, not a complete competitor
      enumeration. Resilience's own materials present a broad service offer from
      biologics drug substance through sterile fill/finish and downstream assembly,
      while reporting on its reset describes six site closures and a more concentrated
      operating footprint. The competitive thesis is therefore integration and
      investment in selected capabilities, not demonstrated superiority on price,
      share, or outcomes. Buyers can also compare an incumbent outsourced provider
      with a specialist provider or internal manufacturing, but the assigned sources
      do not establish which alternative wins a given program. A candidate CDMO
      directory page in the assigned evidence yielded only its publisher's
      registration line, so it did not resolve the missing named-peer roster.
    claimRefs: [CP001, CP003, CP004, CP008, CP009, CP011, CP014]
    tableRefs: [TP001]
  - id: capability-and-buyer-tradeoffs
    title: Capability, buyer fit, and commercial trade-offs
    body: >-
      Company-published material describes a single quality system spanning early
      development through commercial supply, direct access to technical teams, and
      installed single-use capacity from 50 L to 2,000 L. Those are company claims,
      not independently audited throughput or customer outcomes. The evidence also
      describes Blue Ash packaging and device-assembly investment alongside a
      West Chester fill/finish expansion; the cited first-line commercial timing was
      an expectation in a July 2026 article, not a verified operating result. This
      combination may suit buyers seeking fewer transfers across development and
      supply stages, but no source quantifies transfer savings, switching costs,
      delivery reliability, or realized pricing. The matrix therefore separates
      documented Resilience claims from unverified peer and in-house comparisons.
    claimRefs: [CP001, CP002, CP004, CP011, CP012, CP013]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: economics-and-market-context
    title: Public-market context is not a private-company benchmark
    body: >-
      An Alira Health market update reports forward EV/EBITDA multiples of
      approximately 6x to above 30x across public CDMO platforms and describes
      larger scaled biologics manufacturers as trading at structural premiums
      relative to smaller or earlier-stage platforms. The range is broad and the
      source does not provide a Resilience-specific multiple, customer-level
      economics, or enough detail here to match a private business to a public
      comparator. It should frame diligence on the importance investors place on
      scale and execution, not be applied as a valuation input for Resilience.
      No retained source discloses comparable list prices, contract units,
      discounting, or realized rates, leaving procurement economics and switching
      behavior unresolved.
    claimRefs: [CP007, CP008, CP012, CP015]
  - id: durability-and-evidence-gaps
    title: Differentiation durability and downside evidence
    body: >-
      The footprint reset is a material counterweight to a simple scale narrative:
      reporting describes six underutilized-site closures, and a September 2026
      company release says the East Norriton cell-therapy facility was acquired by
      Made Scientific. At the same time, current expansion plans concentrate
      investment in Blue Ash, West Chester, and Toronto. The sources do not establish
      whether those assets are utilized, whether commercial lines meet launch
      schedules, or how much customer demand is contracted. This creates execution
      and concentration questions alongside the potential benefit of an integrated
      network. Before underwriting a durable moat, diligence should compare
      customer-level quality and on-time delivery, capacity utilization, renewal
      terms, and the cost and time required to transfer a program to another CDMO or
      to an internal facility.
    claimRefs: [CP003, CP004, CP005, CP013, CP016]
    tableRefs: []
