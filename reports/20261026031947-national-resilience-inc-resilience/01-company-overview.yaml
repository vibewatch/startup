company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 1
  title: Company Overview
  summary: Resilience is repositioning a broad biomanufacturing network around a smaller North American CDMO footprint centered on biologics drug substance and sterile drug product. Public evidence supports an October 2025 debt commitment and subsequent Ohio investment plans, but does not establish current revenue, leverage, utilization, or companywide customer and employee counts.
sections:
  - id: identity-and-model
    title: Identity, footprint, and delivery model
    body: National Resilience, Inc. launched in 2020 as a biopharmaceutical manufacturing business and now describes itself as a North American contract development and manufacturing organization. Its current public positioning concentrates on biologics drug substance, sterile drug product, device assembly, and packaging rather than the broader modality portfolio in its launch-era materials. These are company descriptions, not independently audited measures of operating performance. The retained evidence does not establish a reconciled current site list, utilization, or facility-level capacity. Blue Ash, Ohio became the announced corporate headquarters in June 2026; that update should not be read as a disclosure of site-level output or workforce totals.
    claimRefs:
      - CO001
      - CO002
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-capital
    title: Leadership and capital structure
    body: 'The clearest leadership evidence identifies William S. Marth as president and chief executive officer in a Resilience-issued release carried by BioSpace, the October 2025 financing announcement, and independent reporting. Company materials describe his prior President/COO remit and earlier pharmaceutical leadership roles; the retained sources do not establish the current board roster, ownership rights, or succession depth. At launch, the company named Robert Nelsen as founder and chairman and Rahul Singhvi as founding CEO, but those launch-era titles do not establish present governance. Financing evidence must be separated by instrument and status: the company announced up to $825 million of long-term debt, including a $600 million first-lien commitment, with an initial $525 million tranche expected later in Q4 2025 subject to customary conditions. That is not equity raised or proof of cash currently available. Separate historical venture totals are publisher-attributed and cannot be combined with the debt commitment into a current cash balance. Private-company revenue, ARR, valuation, debt outstanding, and customer concentration remain unavailable in the assigned evidence.'
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO007
      - CO008
    tableRefs:
      - TO002
  - id: reset-and-milestones
    title: Portfolio reset and strategic milestones
    body: The operating footprint has changed materially. BioPharma Dive reported in June 2025 that Resilience planned to wind down six sites after management said capacity expansion had outpaced industry demand; later reporting and company-issued material describe additional asset transfers and a more focused operating model. That history makes the reported footprint and financing plans execution signals, not evidence of utilization, profitability, or demand conversion. More recent public signals include the Blue Ash headquarters relocation and anticipated local hiring, plus a reported Lilly investment to expand Ohio injectable production, with full operations expected in 2027. The Lilly project is a meaningful commercial validation signal, but the evidence does not disclose contract economics, customer concentration, or how much of the announced investment has been deployed. The dated timeline below distinguishes completed events from plans and forecasts; it does not treat announced debt as funded cash or projected jobs as current employees.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
    tableRefs:
      - TO003
    figureRefs:
      - FO001
