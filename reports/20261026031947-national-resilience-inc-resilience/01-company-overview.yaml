figures:
  - id: FO001
    title: Company milestones and operating reset
    type: timeline
    summary: The dated record shows an expansion-era launch followed by footprint consolidation, debt financing, and renewed Ohio investment plans.
    data:
      items:
        - date: 2020-11-23
          label: Company launch
          details: Resilience announced its launch and reported over $800 million of capital, including an approximately $750 million Series B.
          tone: neutral
          claimRefs:
            - CO001
            - CO004
        - date: '2021'
          label: Further venture rounds reported
          details: Fierce Pharma reported additional investment rounds of $625 million and $600 million by the end of 2021; these reported round amounts are not treated as current cash.
          tone: neutral
          claimRefs:
            - CO005
        - date: '2023'
          label: Lilly manufacturing relationship
          details: Fierce Pharma reported that the Ohio site had manufactured Lilly medicines since the companies teamed up in 2023.
          tone: positive
          claimRefs:
            - CO014
        - date: '2024'
          label: Ohio plant upgrade plan
          details: Fierce Pharma reported a 2024 plan to spend $225 million upgrading two plants, including the Ohio facility.
          tone: neutral
          claimRefs:
            - CO015
        - date: 2025-06-10
          label: Six-site wind-down plan
          details: BioPharma Dive reported that Resilience planned to wind down six facilities after management said capacity expansion had outpaced industry demand.
          tone: negative
          claimRefs:
            - CO010
        - date: 2025-10-29
          label: OHA debt financing announced
          details: Resilience announced up to $825 million in long-term debt financing, subject to customary conditions; the initial $525 million tranche was expected later in Q4.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2025-10
          label: Durham facility sale reported
          details: Fierce Pharma reported that OXB acquired Resilience’s Durham gene-therapy facility for $4.5 million.
          tone: negative
          claimRefs:
            - CO012
        - date: 2026-06-18
          label: Ohio headquarters relocation announced
          details: JobsOhio reported the relocation of Resilience’s corporate headquarters from San Diego to Blue Ash, Ohio.
          tone: positive
          claimRefs:
            - CO013
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO010
      - CO012
      - CO013
      - CO014
      - CO015
