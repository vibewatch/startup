        - Confirm present ownership and voting or board rights
      - - Eli Lilly
        - Reported manufacturing relationship and Ohio injectable-production expansion
        - Reported $750 million project; at least 400 jobs and 2027 operations were described as planned
        - Obtain contract duration, economics, concentration, and deployment milestones
      - - Made Scientific
        - Acquired Resilience’s East Norriton cell-therapy manufacturing facility
        - Portfolio divestiture; transaction consideration and date are not stated in retained text
        - Confirm proceeds, retained obligations, and transition commitments
      - - OXB
        - Fierce Pharma reported acquisition of Resilience’s Durham gene-therapy facility in October 2025 for $4.5 million
