artifact: risks
slug: national-resilience-inc-resilience
runDate: 2026-10-26
company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 7
  title: Risks
  summary: >-
    Resilience's disclosed shift toward a narrower biologics and sterile-product
    footprint is paired with substantial debt financing and a Lilly-linked
    expansion milestone, but public evidence does not establish current leverage,
    customer concentration, or site-level regulatory performance. The highest
    diligence priorities are execution and liquidity through the transition,
    contract concentration, and current quality and compliance records.
sections:
  - id: footprint-and-transition
    title: Footprint transition and operating concentration
    body: >-
      The most visible operating risk is execution through repeated footprint
      changes, not a documented failure event. A trade publication reported that
      Resilience was winding down six underutilized locations while maintaining
      production at four named sites; in September 2026, the company said its East
      Norriton cell-therapy facility had been acquired by Made Scientific and
      described a narrower biologics and sterile drug-product focus. The retained
      pool also includes a report that OXB acquired Resilience's former Research
      Triangle site. This is evidence of portfolio change, not proof of customer
      disruption or underperformance. Resilience says drug substance runs at
      Toronto or is customer-supplied, while sterile fill/finish runs at both
      Cincinnati and Toronto; site-level capacity, utilization, transfer plans,
      and qualified backup routes remain unverified.
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
    tableRefs: [TR002]
  - id: financing-and-commercial-execution
    title: Financing, partner dependence, and execution
    body: >-
      Resilience announced up to $825 million of long-term debt financing from Oak
      Hill Advisors, with a $600 million first-lien commitment and an initial
      $525 million tranche expected in the fourth quarter of 2025, subject to
      customary conditions. The announcement is not evidence that all financing
      was funded or remains available; neither current net debt, cash, covenants,
      amortization, nor the amount drawn is established by the assigned sources.
      Separately, a Resilience-Lilly release described a $750 million joint
      investment, more than 150 million cumulative doses produced, and full
      operations for the KwikPen expansion expected in early 2027. These are
      meaningful execution and counterparty signals, but not revenue, contracted
      volume, customer share, or cash available. A delay or cost overrun would
      matter most if it coincides with debt service or weak utilization.
    claimRefs: [CR005, CR006, CR007, CR008, CR015, CR016]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: regulatory-quality-and-legal
    title: Regulatory, quality, and legal exposure
    body: >-
      The sources describe quality controls but do not verify their operating
      effectiveness. Resilience's own pages describe an integrated quality
      system and commercially licensed Cincinnati and Toronto sites; a current
      investigator job repost specifies deviation investigations, root-cause
      work, and corrective and preventive action (CAPA) effectiveness checks.
      Those statements establish described controls and a hiring requirement,
      not the volume or closure quality of actual deviations, inspection
      outcomes, recalls, or remediation. HHS-OIG guidance and federal false-claims
      law provide relevant compliance context for healthcare-sector entities.
      The assigned record of BIOSECURE legislation is historical and does not
      establish its status in October 2026 or Resilience's supplier exposure.
      No claim is made that an enforcement action or incident did or did not
      occur.
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR001]
  - id: monitoring-and-diligence
    title: Monitoring priorities and thesis-break tests
    body: >-
      Diligence should tie the transition plan to operating evidence: obtain
      site-by-site utilization, qualified capacity, backlog and transfer status;
      current debt balances, draw conditions, covenants, and amortization; and
      customer-level revenue, contract duration, renewal, and volume commitments.
      For the Lilly expansion, compare the stated early-2027 start with validated
      qualification, hiring, and production milestones, while separating the
      historical dose count from future contracted demand. Obtain current
      inspection, audit, CAPA, recall, and litigation records directly from the
      company and relevant regulators. A missed ramp, material loss of a major
      program, unexpected debt restrictions, or a material quality finding
      would warrant reassessing the investment thesis; the sources do not
      quantify probabilities or establish thresholds for those events.
    claimRefs: [CR003, CR005, CR007, CR008, CR015, CR016]
tables:
