    type: matrix
    summary: >-
      Qualitative exposure map; the sources do not support numeric likelihoods,
      expected losses, or a calibrated severity score.
    data:
      columns: ["Evidence of likelihood", "Potential impact", "Control evidence", "Residual test"]
      rows:
        - label: "Portfolio transition"
          values: ["Six-site wind-down reported; further site divestitures disclosed.", "Customer continuity and qualified capacity could be affected.", "A focused operating model is company-stated; transfer evidence is absent.", "Review site utilization, transfers, backup routes, and customer notices."]
        - label: "Debt and liquidity"
          values: ["Up to $825 million debt financing announced; current drawn balance unknown.", "Debt service or restrictions may limit investment flexibility.", "Financing commitment and terms are partly described in a company release.", "Reconcile current debt, cash, covenants, amortization, and capex."]
        - label: "Lilly expansion"
          values: ["Joint investment and early-2027 full-operation target disclosed.", "Delay or lower demand may leave capacity underused.", "Partner investment and historic dose production are disclosed.", "Validate qualification, commissioning, hiring, and contracted demand."]
        - label: "Drug-substance concentration"
          values: ["Toronto is identified for drug-substance manufacturing.", "A site disruption could affect programs using that capability.", "Company describes customer supply as an alternative; backup qualification is unverified.", "Map programs to sites and test recovery/transfer plans."]
        - label: "Quality and compliance"
          values: ["A lead-investigator role and integrated quality system are described.", "An unresolved quality event could disrupt release or regulatory standing.", "Controls are described but inspection and CAPA outcomes are unavailable.", "Obtain inspection, deviation, CAPA, recall, and audit history."]
        - label: "Supplier exposure"
          values: ["Supplier identities and concentration are not established in the pool.", "A constrained input could delay manufacturing.", "No company-specific supplier mitigation evidence is available.", "Map critical inputs, origins, lead times, and qualified alternatives."]
    claimRefs: [CR001, CR003, CR005, CR007, CR008, CR009, CR010, CR015, CR016]
callouts:
  - calloutType: risk
    title: Announced debt is not evidence of current liquidity
    body: >-
      The financing announcement describes a maximum commitment and expected
      tranches, not current cash, funded balance, covenants, or repayment capacity.
      Those data are needed to judge whether the footprint reset and expansion are
      financeable through a delayed ramp.
    claimRefs: [CR005, CR006, CR015]
  - calloutType: risk
    title: Quality controls are described, not independently verified
    body: >-
      Company quality-system statements and an investigator job repost do not
      establish the absence of deviations or the effectiveness of remediation.
      Obtain current site-level inspection and CAPA records before treating the
      controls as validated.
    claimRefs: [CR009, CR010]
