    title: Regulatory / legal risk register
    columns:
      - Rule or exposure
      - Jurisdiction and status
      - Likelihood and severity
      - Mitigation maturity and residual exposure
      - Diligence path
    rows:
      - ["Federal healthcare fraud and abuse", "HHS-OIG describes general compliance guidance for healthcare entities; no company-specific allegation is established.", "Likelihood not assessed; consequences could be material if controls fail.", "Company-specific compliance program and testing evidence are not in the assigned sources.", "Review compliance oversight, audit findings, federal program exposure, and controls over submitted records."]
      - ["False-claims liability", "31 U.S.C. § 3729 is a federal statute; applicability depends on conduct and claims, not sector membership alone.", "Likelihood unknown; potentially severe if the statutory elements are met.", "No Resilience-specific claim, investigation, or settlement evidence is established.", "Request government-contract and reimbursement exposure, certifications, claims controls, and counsel's current matter list."]
      - ["BIOSECURE Act and restricted suppliers", "The assigned congressional record is H.R. 8333 in the 118th Congress; a trade article describes proposed restrictions, not current 2026 status.", "Current legal likelihood and company exposure unknown; impact depends on enacted rules and actual suppliers.", "No current supplier map or legal-status review is in the pool.", "Confirm current law and guidance with counsel; map suppliers, affiliates, equipment, and customer/federal-funding dependencies."]
      - ["Site-level cGMP and regulatory status", "Company pages say Cincinnati and Toronto are commercially licensed; current inspection status is not established.", "Potentially severe if a site cannot manufacture or release product; incident likelihood is unquantified.", "Company describes an integrated quality system and investigator responsibilities, but no effectiveness or inspection evidence.", "Obtain latest inspection records, audit observations, warning letters, recalls, deviations, CAPA aging, and effectiveness checks by site."]
    notes: >-
      Partial register of legal and regulatory exposure visible in the assigned
      sources, not a complete inventory of laws or company-specific proceedings.
      General guidance and historical legislation do not establish a violation,
      current BIOSECURE status, or absence of an incident.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly retrieved federal healthcare and supplier-policy materials plus
        disclosed quality controls; no company audit or regulator file was available.
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence bearing on likelihood
      - Potential severity
      - Mitigation maturity
      - Residual exposure or gap
    rows:
      - ["Portfolio transition disrupts transfers or service continuity", "A trade report described six site wind-downs; Resilience later announced the East Norriton sale, and NCBiotech reported transfer of the former Research Triangle facility.", "Material if a customer transfer or qualified-capacity loss interrupts supply.", "Company describes a focused footprint; no transfer, continuity, or site utilization records are available.", "Customer-level impacts, retained capacity, and qualified alternate routes are unknown."]
      - ["Drug-substance capacity is concentrated at Toronto", "Resilience says drug substance is run at Toronto or supplied by the customer; its drug-substance page says its full size range runs at one site.", "Potentially material for programs that depend on this capability; affected share is unknown.", "Company describes process and capacity planning; no independent redundancy or recovery evidence is available.", "Request product/site allocation, backup qualification, recovery time, and contingency inventory."]
      - ["Quality investigation or CAPA is ineffective or delayed", "The current investigator posting describes root-cause investigations and CAPA effectiveness checks; company pages describe an integrated quality system.", "Potentially severe for product release, compliance, and continuity.", "Controls are described, but actual deviation trends, CAPA closure, and inspection outcomes are unverified.", "Obtain site-specific quality metrics and recent inspection, audit, and recall records."]
      - ["Cincinnati expansion misses the planned operating milestone", "The Lilly release says site preparation was underway and full operations were expected in early 2027.", "Material if customer supply or planned economics depend on the ramp.", "The release describes joint investment and hiring plans; no independently verified qualification or commissioning milestone is available.", "Track validated qualification, hiring, line readiness, production release, and contracted volume against the disclosed timeline."]
    notes: >-
      Risk likelihood is described through observed disclosures, not assigned a
      numeric probability. Published transition plans and company-described
      controls do not establish actual service performance.
    claimRefs: [CR001, CR002, CR003, CR004, CR007, CR009, CR010, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Disclosed concentration
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - ["Commercial manufacturing expansion", "Eli Lilly; multi-year manufacturing partner", "More than 150 million historical doses and a $750 million joint investment are disclosed; revenue share, committed volume, and renewal terms are not.", "Delayed qualification, lower demand, or program changes could reduce planned utilization.", "Potentially material; economic concentration is not quantifiable from these sources.", "Monitor contract-level commitments and commissioning milestones; request top-customer revenue and backlog."]
      - ["Long-term financing", "Oak Hill Advisors", "Up to $825 million announced; amount currently drawn and outstanding is not established.", "Debt service, restricted covenants, or delayed availability could constrain investment and liquidity.", "Potentially material; leverage and debt-service capacity are unknown.", "Request current balance, draw conditions, covenants, maturity, amortization, and liquidity schedule."]
      - ["Drug-substance manufacturing", "Toronto site or customer-supplied material", "The company identifies Toronto as its drug-substance site; site-level volume and backup capacity are not disclosed.", "A site disruption or failed transfer could delay affected programs.", "Potentially material for exposed programs; scope is unknown.", "Request program-by-site allocation, qualified backups, recovery plans, and inventory coverage."]
      - ["Upstream materials and external services", "Suppliers and service providers not identified in the assigned sources", "Supplier concentration, country of origin, and single-source inputs are not disclosed.", "A shortage, quality issue, export restriction, or logistics interruption could affect production.", "Unknown; exposure cannot be sized.", "Obtain critical-material/vendor maps, qualification status, lead times, and tested alternatives."]
    notes: >-
      Funding raised or announced is not cash available, and cumulative dose
      production is not a measure of current revenue or customer concentration.
      Several dependency dimensions remain private or unverified.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR015, CR016]
