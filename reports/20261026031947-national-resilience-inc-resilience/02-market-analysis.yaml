  - id: TM001
    title: Market boundary and substitute map
    columns: [segment/category, included spend, excluded spend, buyer/payer, relevance]
    rows:
      - ["Biologics drug substance and development", "Process development and outsourced biologics drug-substance manufacturing", "Sterile finished-product filling, packaging, and unrelated modalities", "Pharma or biotech sponsor; specific internal budget owner is not identified", "Core service scope described on Resilience's official drug-substance page"]
      - ["Sterile drug product and fill-finish", "Aseptic filling of injectable products and related commercial manufacturing", "Upstream drug-substance manufacturing and non-CDMO product sales", "Pharmaceutical sponsor's manufacturing or CMC organization; allocation is not disclosed", "Adjacent core service line in company and trade coverage; do not combine with drug-substance spend"]
      - ["Device assembly and packaging", "Assembly, inspection, packaging, labeling, and associated product handling", "Drug discovery, API synthesis, and sponsor-owned product revenue", "Pharma sponsor; procurement and budget ownership are not disclosed", "Relevant to Resilience's described Cincinnati buildout, but site ramp and utilization are unverified"]
      - ["Cell and gene therapy manufacturing", "Specialized development and manufacturing for cell or gene therapies", "Not included in a biologics-only market estimate unless the publisher says so", "Biotech or pharma sponsor; evidence does not isolate buyer budgets", "Adjacent market lens; current fit with the post-reset footprint is uncertain"]
      - ["Sponsor-owned or in-house capacity", "No external CDMO revenue; sponsor-funded facilities and operating teams", "Third-party CDMO sales", "Sponsor operations and capital budgets", "Status-quo substitute; internal build can compete with outsourcing"]
    notes: >-
      Boundary is synthesized from the cited company and trade descriptions, not a
      publisher-defined market taxonomy. Buyer budget owners, revenue by service,
      and overlap between modalities are not publicly established in the retained
      evidence.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014]
  - id: TM002
    title: Published market-sizing lenses
    columns: [publisher / source, year, geography, reported value and period, reported CAGR, methodology available in reviewed text, confidence, limitation]
    rows:
      - ["Precedence Research, as summarized by Vision Life Sciences", "2025 estimate; 2034 forecast", "Global", "$197.4B (2025); $368.7B (2034)", "7.2%", "Not described in reviewed summary", "Low", "Broad CDMO estimate; Vision says publisher definitions differ"]
      - ["Grand View Research, as summarized by Vision Life Sciences", "2025 estimate; 2030 forecast", "Global", "Approximately $166B (2025); approximately $235.5B (2030)", "7.4%", "Not described in reviewed summary", "Low", "Broad estimate, not directly comparable with other publishers"]
      - ["BCC Research, as summarized by Vision Life Sciences", "2024 estimate; 2029 forecast", "Global", "$136.6B (2024); $191.6B (2029)", "7.0%", "Not described in reviewed summary", "Low", "Different vintage and scope from the other broad estimates"]
      - ["Alira Health, 2025 Biologics Contract Manufacturing Report preview", "2024", "Global", "$20.7B biologics CDMO market", "11% growth in 2024", "Full report is not present in reviewed text", "Low", "Biologics-only estimate; not a direct substitute for the broad CDMO totals"]
      - ["Alira Health, 2025 Biologics Contract Manufacturing Report preview", "2024", "Global", "$3.7B advanced therapies; 18% of total CDMO value (as reported)", "37% year-over-year growth", "Full report is not present in reviewed text", "Low", "Segment figure as reported in the preview; do not add to the biologics total"]
    notes: >-
      Vision Life Sciences relays estimates from three publishers and explicitly
      says their market definitions differ; its reviewed summary does not provide
      comparable methodology. Alira Health's values come from a report preview,
      not the full report. Values are reproduced with their source, scope, period,
      and uncertainty; they are not averaged, summed, or used to calculate
      Resilience's SAM or SOM.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM016]
  - id: TM003
    title: Sponsor segments, purchase needs, and adoption triggers
    columns: [segment, buyer / user, payer or budget evidence, workflow / service need, adoption trigger and limitation]
    rows:
      - ["Small and mid-sized biotech sponsors", "Biotech sponsor; development and CMC teams", "Company profile identifies small and mid-sized pharma and biotech clients; exact budget owner is not disclosed", "Development and clinical manufacturing, with phase-appropriate process support", "Avoid building specialist staff and capital internally; cited as a general industry mechanism, not a measured Resilience win"]
      - ["Large pharma and commercial-stage sponsors", "Pharmaceutical sponsor; manufacturing, quality, and CMC functions", "Operating budget ownership is not identified in the retained sources", "Qualified drug-substance or sterile-product capacity and transfer into commercial supply", "Capacity, quality-system continuity, and commercial readiness; customer-level economics are unknown"]
      - ["Sponsors of complex biologics", "Biopharma sponsor and molecule technical team", "No modality-level payer or contract value is disclosed", "Specialized biologics drug-substance process and manufacturing capacity", "Complexity may favor external expertise; source estimates do not quantify Resilience's addressable share"]
      - ["Sponsors of injectable medicines", "Pharma sponsor and finished-product manufacturing organization", "No named contract budget or customer concentration is disclosed", "Aseptic filling, device assembly, inspection, and packaging", "Demand for high-volume formats is reported by trade coverage; Resilience's ramp and booked utilization remain unverified"]
    notes: >-
      Segments describe buyer needs reported or marketed in the cited evidence, not
      an exhaustive customer enumeration. Internal budget owners, contract
      economics, conversion rates, and customer concentration remain gaps.
    claimRefs: [CM009, CM011, CM012, CM013, CM014]
figures:
  - id: FM001
    title: Sizing lenses narrow toward an unquantified Resilience market
    type: pyramid
    summary: Source-reported broad and biologics market lenses are shown in authored scope order, not as comparable or proportional TAM/SAM/SOM layers.
    data:
      items:
        - label: "Broad CDMO — Precedence estimate"
          value: "$197.4B (2025); $368.7B (2034 forecast)"
          note: "As summarized by Vision Life Sciences; different publisher scope"
        - label: "Broad CDMO — Grand View estimate"
          value: "Approximately $166B (2025); approximately $235.5B (2030 forecast)"
          note: "As summarized by Vision Life Sciences; not directly comparable"
        - label: "Broad CDMO — BCC estimate"
          value: "$136.6B (2024); $191.6B (2029 forecast)"
          note: "As summarized by Vision Life Sciences; different vintage and scope"
        - label: "Biologics CDMO"
          value: "$20.7B (2024)"
          note: "Alira Health report preview; its full methodology was not reviewed"
        - label: "Advanced therapies"
          value: "$3.7B (2024)"
          note: "Alira reports 18% of total CDMO value (its wording); do not add to other scope values"
        - label: "Resilience serviceable market"
          value: "Not isolated in retained evidence"
          note: "Officially described drug-substance capacity spans 50L–2,000L; no market share or obtainable spend is disclosed"
    approximationNotes: >-
      No estimate is derived, summed, averaged, or scaled. The first three values
      are alternative broad-CDMO estimates reported by Vision Life Sciences; the
      biologics and advanced-therapy values are from Alira Health and have
      different scope and vintage. The pyramid taper expresses authored order
      only, not numerical magnitude or validated nesting. Resilience's
      serviceable spend remains unknown.
    claimRefs: [CM002, CM003, CM005, CM006, CM007, CM008, CM013, CM016]
