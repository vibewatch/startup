evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-operating-metrics
    missingEvidence: >-
      Current revenue, ARR, EBITDA, cash generation, capex, working capital, valuation, debt outstanding, customer
      concentration, companywide headcount, and site utilization.
    whyItMatters: >-
      These metrics determine whether the focused manufacturing network can service debt and convert announced capacity
      and customer programs into durable returns.
    diligencePath: >-
      Request audited financial statements, a current debt and covenant schedule, customer concentration and contract
      data, site-level utilization, and a current operating plan from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: regulatory-compliance
    missingEvidence: Recent site-level inspection, audit, warning-letter, and CAPA history across the retained operating footprint.
    whyItMatters: >-
      Regulatory execution is essential to commercial drug manufacturing, and no retained source documents current site
      compliance.
    diligencePath: >-
      Obtain current FDA inspection classifications, customer audit findings, major CAPA aging, and facility-level
      quality metrics under confidentiality.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current directors, ownership and voting rights, board committee structure, and succession arrangements.
    whyItMatters: >-
      The company has undergone a strategic reset and relies on leadership and lender decisions, while launch-era
      governance does not establish current oversight.
    diligencePath: Request a current board roster, capitalization table, governance documents, and executive succession plan.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-coverage
    missingEvidence: >-
      A complete current list of investors, lenders, major customers, and material counterparties, with ownership stakes
      and contract economics.
    whyItMatters: >-
      The selected public disclosures identify only a subset of relationships and do not establish customer
      concentration or control rights.
    diligencePath: >-
      Request a current capitalization table, top-customer schedule, financing documents, and material counterparty
      list.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: resilience-serviceable-market
    missingEvidence: >-
      Resilience revenue, capacity utilization, backlog, contract duration, and obtainable spend by modality, service
      line, geography, and development stage.
    whyItMatters: >-
      Without company-level service mix and utilization, broad CDMO estimates cannot establish a Resilience-specific
      SAM, SOM, or market share.
