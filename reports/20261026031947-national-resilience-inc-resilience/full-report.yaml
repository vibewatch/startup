  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >-
              Resilience sells manufacturing and development services rather than a single finished software product.
              Its official biotech FAQ describes support from preclinical and early phase through commercial tech
              transfer, while the drug-substance page presents biologics manufacturing as a program-specific service.
              The company says development uses single-use bioreactors from 3L to 500L and installed cGMP capacity
              ranges from 50L to 2,000L; those are company-reported capacity bands, not evidence of current utilization,
              validated throughput, or a customer's production outcome. The company's own pages also list process and
              analytical development, drug substance, and sterile fill/finish. Third-party directories describe broader
              cell, gene, RNA, and vaccine capabilities, but the assigned evidence does not independently establish
              current site-level readiness for each modality. The module matrix therefore separates documented service
              descriptions from listed-but-unverified platform breadth.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
