      - number: '1.2'
        title: Leadership and capital structure
        blocks:
          - type: paragraph
            body: >-
              The clearest leadership evidence identifies William S. Marth as president and chief executive officer in a
              Resilience-issued release carried by BioSpace, the October 2025 financing announcement, and independent
              reporting. Company materials describe his prior President/COO remit and earlier pharmaceutical leadership
              roles; the retained sources do not establish the current board roster, ownership rights, or succession
              depth. At launch, the company named Robert Nelsen as founder and chairman and Rahul Singhvi as founding
              CEO, but those launch-era titles do not establish present governance. Financing evidence must be separated
              by instrument and status: the company announced up to $825 million of long-term debt, including a $600
              million first-lien commitment, with an initial $525 million tranche expected later in Q4 2025 subject to
              customary conditions. That is not equity raised or proof of cash currently available. Separate historical
              venture totals are publisher-attributed and cannot be combined with the debt commitment into a current
              cash balance. Private-company revenue, ARR, valuation, debt outstanding, and customer concentration remain
              unavailable in the assigned evidence.
