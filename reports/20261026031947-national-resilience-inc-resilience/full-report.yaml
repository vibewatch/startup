        - Capability does not establish utilization, yield, margins, or customer economics; verify by site and program.
      - - Customer execution signal
        - >-
          Company materials report more than 150 million Lilly doses produced and a $750 million joint investment
          announcement.
        - The material does not disclose contract economics, customer concentration, or realized incremental revenue.
      - - Capital to support the reset
        - >-
          The OHA release describes financing of up to $825 million, with a $600 million first-lien commitment and
          staged funding.
        - Debt is not equity value or cash already drawn; obtain the executed debt package and current balance.
      - - Focused footprint may improve returns
        - >-
          Industry reporting describes a prior bridge financing and six site wind-downs; a later company update reports
          an East Norriton divestiture.
        - >-
          Portfolio pruning can improve focus but also signals prior overcapacity; verify remaining-site utilization and
          costs.
    notes: >-
      Company announcements are attributed as such; syndicated releases do not count as independent corroboration. The
      table distinguishes operational proof from financial proof.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Lilly expansion commissions on schedule; retained facilities achieve sustained commercial utilization and
          diversified programs.
        - >-
          Potentially higher value from recurring, profitable production, but no range is calculable without revenue,
          margin, capex, and debt data.
        - Directional upside only; current evidence does not support a numeric probability.
        - Delayed qualification, volume ramp, or customer diversification.
      - - Base
        - The company executes a focused network but operating economics and debt terms remain private.
        - Maintain unknown stance; wait for audited results and net-debt bridge before applying DCF or a peer multiple.
        - Research-more is the only supportable present signal.
        - No disclosure of cash conversion, site utilization, or current debt service.
      - - Bear
        - Demand or qualification underperforms while debt service and retained-site costs remain material.
        - >-
          Equity value could be impaired, but the loss or recovery amount cannot be estimated from the available
          sources.
        - Material downside is plausible; no numeric probability is evidenced.
        - Missed ramp milestones, additional exits, or restrictive debt terms.
      - - Decision gate
        - Verify financial statements, financing documents, capitalization, and customer/site economics.
        - Only then set entry price, target return, hold period, and exit cases.
        - Re-rate after evidence review, not on funding headline.
        - Failure to provide core diligence data keeps the stance unknown.
    notes: >-
      Cases are qualitative and contain no invented valuation ranges or probabilities. The $825 million financing
      ceiling is not treated as cash, revenue, or equity value; all valuation outputs remain unavailable pending
      diligence.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestones and operating reset
    type: timeline
    summary: >-
      The dated record shows an expansion-era launch followed by footprint consolidation, debt financing, and renewed
      Ohio investment plans.
    data:
      items:
        - date: 2020-11-23T00:00:00.000Z
          label: Company launch
          details: >-
            Resilience announced its launch and reported over $800 million of capital, including an approximately $750
            million Series B.
          tone: neutral
          claimRefs:
            - CO001
            - CO004
        - date: '2021'
          label: Further venture rounds reported
          details: >-
            Fierce Pharma reported additional investment rounds of $625 million and $600 million by the end of 2021;
            these reported round amounts are not treated as current cash.
          tone: neutral
          claimRefs:
            - CO005
        - date: '2023'
          label: Lilly manufacturing relationship
          details: >-
            Fierce Pharma reported that the Ohio site had manufactured Lilly medicines since the companies teamed up in
            2023.
          tone: positive
          claimRefs:
            - CO014
        - date: '2024'
          label: Ohio plant upgrade plan
          details: Fierce Pharma reported a 2024 plan to spend $225 million upgrading two plants, including the Ohio facility.
          tone: neutral
          claimRefs:
            - CO015
        - date: 2025-06-10T00:00:00.000Z
          label: Six-site wind-down plan
          details: >-
            BioPharma Dive reported that Resilience planned to wind down six facilities after management said capacity
            expansion had outpaced industry demand.
          tone: negative
          claimRefs:
            - CO010
        - date: 2025-10-29T00:00:00.000Z
          label: OHA debt financing announced
          details: >-
            Resilience announced up to $825 million in long-term debt financing, subject to customary conditions; the
            initial $525 million tranche was expected later in Q4.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2025-10
          label: Durham facility sale reported
          details: Fierce Pharma reported that OXB acquired Resilience’s Durham gene-therapy facility for $4.5 million.
          tone: negative
          claimRefs:
            - CO012
        - date: 2026-06-18T00:00:00.000Z
          label: Ohio headquarters relocation announced
          details: JobsOhio reported the relocation of Resilience’s corporate headquarters from San Diego to Blue Ash, Ohio.
          tone: positive
          claimRefs:
            - CO013
