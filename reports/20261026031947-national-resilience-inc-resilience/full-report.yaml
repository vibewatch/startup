      - number: '3.3'
        title: Public-market context is not a private-company benchmark
        blocks:
          - type: paragraph
            body: >-
              An Alira Health market update reports forward EV/EBITDA multiples of approximately 6x to above 30x across
              public CDMO platforms and describes larger scaled biologics manufacturers as trading at structural
              premiums relative to smaller or earlier-stage platforms. The range is broad and the source does not
              provide a Resilience-specific multiple, customer-level economics, or enough detail here to match a private
              business to a public comparator. It should frame diligence on the importance investors place on scale and
              execution, not be applied as a valuation input for Resilience. No retained source discloses comparable
              list prices, contract units, discounting, or realized rates, leaving procurement economics and switching
              behavior unresolved.
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP015
      - number: '3.4'
        title: Differentiation durability and downside evidence
        blocks:
          - type: paragraph
            body: >-
              The footprint reset is a material counterweight to a simple scale narrative: reporting describes six
              underutilized-site closures, and a September 2026 company release says the East Norriton cell-therapy
              facility was acquired by Made Scientific. At the same time, current expansion plans concentrate investment
              in Blue Ash, West Chester, and Toronto. The sources do not establish whether those assets are utilized,
              whether commercial lines meet launch schedules, or how much customer demand is contracted. This creates
              execution and concentration questions alongside the potential benefit of an integrated network. Before
              underwriting a durable moat, diligence should compare customer-level quality and on-time delivery,
              capacity utilization, renewal terms, and the cost and time required to transfer a program to another CDMO
              or to an internal facility.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is a thesis, not yet a proven moat
            body: >-
              The retained evidence supports a claimed breadth of capabilities and a focused investment plan, but does
              not establish comparative pricing, utilization, reliability, customer retention, or switching costs.
            calloutType: insight
            claimRefs:
