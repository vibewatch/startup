      - number: '7.3'
        title: Regulatory, quality, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The sources describe quality controls but do not verify their operating effectiveness. Resilience's own
              pages describe an integrated quality system and commercially licensed Cincinnati and Toronto sites; a
              current investigator job repost specifies deviation investigations, root-cause work, and corrective and
              preventive action (CAPA) effectiveness checks. Those statements establish described controls and a hiring
              requirement, not the volume or closure quality of actual deviations, inspection outcomes, recalls, or
              remediation. HHS-OIG guidance and federal false-claims law provide relevant compliance context for
              healthcare-sector entities. The assigned record of BIOSECURE legislation is historical and does not
              establish its status in October 2026 or Resilience's supplier exposure. No claim is made that an
              enforcement action or incident did or did not occur.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring priorities and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              Diligence should tie the transition plan to operating evidence: obtain site-by-site utilization, qualified
              capacity, backlog and transfer status; current debt balances, draw conditions, covenants, and
              amortization; and customer-level revenue, contract duration, renewal, and volume commitments. For the
              Lilly expansion, compare the stated early-2027 start with validated qualification, hiring, and production
              milestones, while separating the historical dose count from future contracted demand. Obtain current
              inspection, audit, CAPA, recall, and litigation records directly from the company and relevant regulators.
              A missed ramp, material loss of a major program, unexpected debt restrictions, or a material quality
              finding would warrant reassessing the investment thesis; the sources do not quantify probabilities or
              establish thresholds for those events.
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR008
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Announced debt is not evidence of current liquidity
            body: >-
              The financing announcement describes a maximum commitment and expected tranches, not current cash, funded
              balance, covenants, or repayment capacity. Those data are needed to judge whether the footprint reset and
              expansion are financeable through a delayed ramp.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR015
          - type: callout
            title: Quality controls are described, not independently verified
            body: >-
              Company quality-system statements and an investigator job repost do not establish the absence of
              deviations or the effectiveness of remediation. Obtain current site-level inspection and CAPA records
              before treating the controls as validated.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation, low confidence, high risk, and an unknown valuation
              stance—not a price target. Resilience describes technical capabilities and a sizeable Ohio footprint,
              while company-issued sources report Lilly production milestones (CV001, CV002, CV004, CV010). The
              financing announcement is for debt of up to $825 million, not an equity valuation or proof of cash on hand
              (CV006). A funding aggregator's cumulative figure combines financing categories and is not deployable cash
              (CV008). Without current revenue, EBITDA, cash conversion, net debt, utilization, or a fully diluted
              capitalization, a DCF, EV/revenue multiple, or investor return range would be false precision (CV016).
              Entry discipline is therefore to defer a price decision until management supplies these inputs and the
              financing documents; the summary below records what evidence would change the call.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV016
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is operational rather than financial: company materials describe commercial-scale
              biologics and sterile-product capabilities, a multi-year Lilly relationship, and reported production above
              150 million doses (CV004, CV009, CV010). These are evidence of capabilities and execution claims, not of
              backlog, customer concentration, margin, or cash yield. The anti-thesis is that the company has used
              long-term debt to fund a business reset, while reporting from Pharma Manufacturing describes an earlier
              bridge financing and six underutilized sites being wound down (CV006, CV007, CV012). A later
              company-issued update describes another non-core asset divestiture (CV013). The bull case needs audited
              economics and line-level utilization; the bear case strengthens if debt service, site absorption, or Lilly
              ramp timing weakens.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Valuation frame and scenarios
        blocks:
          - type: paragraph
            body: >-
              The available references do not produce a defensible company multiple. The OHA financing is a debt
              commitment, not a transaction valuation; Clay's funding total aggregates disclosed financing and other
              sources rather than measuring current cash or equity value (CV006, CV007, CV008). OXB's disclosed $4.5
              million purchase was for a specific viral-vector facility and asset package, not Resilience's retained
              enterprise, so it is not a comparable company valuation (CV014). Lilly's reported market capitalization
              describes a customer/partner, not Resilience or a CDMO peer multiple (CV005). Lonza's investor-relations
              page links to public reports and share information, while a historical Thermo Fisher revenue series offers
              only scale context; neither provides a Resilience-specific CDMO multiple (CV015). Scenario values and
              probabilities are intentionally not numeric: no revenue base, margins, debt balance, dilution, or exit
              multiple is evidenced. The framework below uses only directional signals; the flow figure shows why those
              signals stop at research-more.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Diligence gates and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Before underwriting an entry, obtain audited statements and current management accounts, including revenue
              by site and customer, EBITDA and cash flow, working capital, capex, utilization, backlog, and contract
              duration. Reconcile the headline financing ceiling to funded amounts, current debt, maturity, pricing,
              collateral, covenants, and any preferred-equity or shareholder waterfall (CV007, CV008). Use SEC EDGAR
              search as a public-record check, not as evidence that no filing exists (CV003). Confirm the status and
              timing of the Lilly expansion against commissioning, qualification, and commercial-ramp milestones rather
              than treating planned jobs or early-2027 operations as realized (CV009, CV011). Thesis-break indicators
              are sustained utilization shortfalls, missed qualification or volume milestones, renewed facility exits,
              or debt terms that leave insufficient cash for the retained network. No target return, holding period, or
              exit value is supportable until those gaps close (CV012, CV013, CV016).
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No price target from the financing headline
            body: >-
              Treat the OHA facility as debt financing with staged commitments, not as a valuation mark or cash balance.
              Keep valuation unknown until current financials, debt terms, and fully diluted capitalization are
              available.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV016
