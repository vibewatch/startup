  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and program segments
        blocks:
          - type: paragraph
            body: >-
              Resilience markets manufacturing and development services to biopharma and       pharmaceutical sponsors,
              but the reviewed public materials do not identify the contracting buyer, payer, or account economics for
              individual programs. Its company pages describe biologics drug-substance work from the first clinical
              batch through commercial supply and list 50L to 2,000L manufacturing trains (CU001, CU003, CU004). A 2026
              company release describes an integrated path through sterile fill/finish, device assembly, and packaging
              (CU005). CSIS notes that pharmaceutical manufacturers may rely on long-term CDMO relationships and
              qualified supplier redundancy; that is sector context, not evidence of Resilience's own contract mix
              (CU002). BIO's 2026 program lists a Resilience presentation with a regional sales and business-development
              speaker, evidence of event presence rather than customer wins (CU013). The table maps the documented
              segments and leaves account scale open.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
