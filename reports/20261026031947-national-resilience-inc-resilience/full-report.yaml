  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market before sizing it
        blocks:
          - type: paragraph
            body: >-
              The broad CDMO category spans development and contract manufacturing across modalities; it is not a
              defensible proxy for Resilience's addressable market. Its current official materials emphasize biologics
              drug substance, while company materials and trade coverage also describe aseptic drug product,
              fill-finish, device assembly, and packaging. These are related but distinct service budgets and should not
              be collapsed into one spend pool. The company profile describes customers ranging from large
              pharmaceutical companies to small and mid-sized pharma and biotechnology firms, but that company-issued
              profile does not establish customer concentration or revenue by service. Cell-therapy manufacturing is an
              adjacent category in the reviewed evidence; recent footprint changes make its current relevance to the
              retained business uncertain. In-house capacity is a substitute for outsourced CDMO services, not part of
              external CDMO revenue. The market-definition table therefore separates the core service lines, adjacent
              modalities, and status quo rather than assigning every global CDMO dollar to Resilience.
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: Reported estimates show scale, not a company-specific TAM
        blocks:
          - type: paragraph
            body: >-
              The available estimates do not form a single consistent series. Vision Life Sciences relays three broad
              CDMO estimates from Precedence Research, Grand View Research, and BCC Research, but explicitly warns that
              the firms define the market differently and that the figures are not directly comparable. Alira Health's
              2025 report preview gives a separate biologics-CDMO estimate for 2024 and an advanced-therapies segment.
              Those figures offer an order-of- magnitude context, not a reconciled TAM/SAM calculation: the source
              methods and precise inclusion rules are not available in the reviewed text, and the estimates have
              different years and scopes. The chart preserves those source- attributed lenses in authored order, not as
              proportional or derived layers. A Resilience-specific SAM or SOM cannot be isolated without modality-level
              market definitions, site capacity and utilization, and company revenue or backlog by service. The
              numerical table keeps reported values and vintages distinct and records the uncertainty rather than
              averaging them.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
