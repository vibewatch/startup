        title: Portfolio reset and strategic milestones
        blocks:
          - type: paragraph
            body: >-
              The operating footprint has changed materially. BioPharma Dive reported in June 2025 that Resilience
              planned to wind down six sites after management said capacity expansion had outpaced industry demand;
              later reporting and company-issued material describe additional asset transfers and a more focused
              operating model. That history makes the reported footprint and financing plans execution signals, not
              evidence of utilization, profitability, or demand conversion. More recent public signals include the Blue
              Ash headquarters relocation and anticipated local hiring, plus a reported Lilly investment to expand Ohio
              injectable production, with full operations expected in 2027. The Lilly project is a meaningful commercial
              validation signal, but the evidence does not disclose contract economics, customer concentration, or how
              much of the announced investment has been deployed. The dated timeline below distinguishes completed
              events from plans and forecasts; it does not treat announced debt as funded cash or projected jobs as
