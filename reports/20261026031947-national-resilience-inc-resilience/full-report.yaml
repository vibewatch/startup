      - number: '5.2'
        title: Delivery workflow and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The described customer workflow begins with process and analytical development, proceeds through
              stage-gated technology transfer and validation, and can continue into drug-substance and sterile
              drug-product manufacturing. Resilience says drug substance is manufactured in Toronto or supplied by the
              customer, while sterile fill/finish is offered at both Cincinnati and Toronto; it also says the
              clinical-to-commercial programs use one integrated quality system. These are descriptions of the offered
              model, not independently verified evidence that every program traverses every site or stage. External
              trade coverage records a footprint reset: Pharma Manufacturing reported plans to wind down six
              underutilized sites while retaining production in four named locations, and BioProcess International later
              reported a Blue Ash headquarters move and West Chester fill/finish-line investment. This makes
              site-specific transfer, qualification, and capacity evidence important to diligence.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
              - CE015
