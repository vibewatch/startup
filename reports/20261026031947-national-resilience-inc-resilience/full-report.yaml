      - number: '2.3'
        title: Buyer need is strongest where internal capacity is costly or slow
        blocks:
          - type: paragraph
            body: >-
              The customer set described in the evidence includes large pharma and smaller pharmaceutical and
              biotechnology sponsors. Their likely buying problem differs by program stage: early-stage sponsors need
              development and clinical manufacturing without building a full internal operation, while later-stage
              sponsors need qualified capacity, process continuity, and a path to commercial supply. Resilience says it
              accepts preclinical and early-phase programs and can carry work through commercial tech transfer; these
              are company claims, not independent proof of program wins or customer economics. A historical Contract
              Pharma interview with another CDMO's chief executive describes outsourcing as a way to reduce time to
              clinic and avoid staffing and capital commitments. That is useful as an industry mechanism, not a neutral
              benchmark. Specific internal budget owners, contract economics, switching costs, and the share of sponsor
              work awarded to Resilience are not disclosed in the retained evidence.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Demand tailwinds coexist with capacity and policy risks
        blocks:
          - type: paragraph
            body: >-
              The market evidence points to biologics complexity and sponsor demand for outsourced expertise as
              structural demand drivers, but the Resilience coverage also documents the downside of building capacity
              ahead of demand: the company closed six underutilized facilities in 2025 after expansion outpaced industry
              demand. Its later focus on biologics and aseptic drug product is consistent with a narrower target market,
              but does not establish utilization or profitable growth. High facility cost and long build times can make
              outsourcing attractive, while qualification, technology transfer, quality systems, and schedule risk can
              slow adoption; the cited industry interview describes these commercial trade-offs rather than measuring
              them. Separately, Arnold & Porter explains that BIOSECURE Act implementation can constrain use of
              designated biotechnology suppliers in certain federal contracts and grant-funded procurement. This is a
              buyer-side compliance constraint and potential sourcing consideration, not evidence of a Resilience
              contract win or an automatic market-share benefit. A diligence case therefore needs evidence of program
              conversion, ramp timing, and customer-funded utilization alongside market growth.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad CDMO estimates overstate what can be assigned to Resilience
            body: >-
              The cited publishers use different market boundaries, and no retained source isolates Resilience's
              modality-level serviceable spend or obtainable share. Treat broad market values as context, not company
              TAM.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and strategic position
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not identify named direct CDMO peers or provide a peer-by-peer comparison of
              customer segments, revenues, utilization, or contract wins. It instead distinguishes broad public-market
              archetypes: larger scaled biologics manufacturers, smaller specialized platforms, and earlier-stage
              operators. Those categories are useful context, not a complete competitor enumeration. Resilience's own
              materials present a broad service offer from biologics drug substance through sterile fill/finish and
              downstream assembly, while reporting on its reset describes six site closures and a more concentrated
              operating footprint. The competitive thesis is therefore integration and investment in selected
              capabilities, not demonstrated superiority on price, share, or outcomes. Buyers can also compare an
              incumbent outsourced provider with a specialist provider or internal manufacturing, but the assigned
              sources do not establish which alternative wins a given program. A candidate CDMO directory page in the
              assigned evidence yielded only its publisher's registration line, so it did not resolve the missing
              named-peer roster.
