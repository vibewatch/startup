chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and delivery model
        blocks:
          - type: paragraph
            body: >-
              National Resilience, Inc. launched in 2020 as a biopharmaceutical manufacturing business and now describes
              itself as a North American contract development and manufacturing organization. Its current public
              positioning concentrates on biologics drug substance, sterile drug product, device assembly, and packaging
              rather than the broader modality portfolio in its launch-era materials. These are company descriptions,
              not independently audited measures of operating performance. The retained evidence does not establish a
              reconciled current site list, utilization, or facility-level capacity. Blue Ash, Ohio became the announced
              corporate headquarters in June 2026; that update should not be read as a disclosure of site-level output
              or workforce totals.
            claimRefs:
              - CO001
              - CO002
              - CO013
