        title: Private operating metrics still block unit-economics underwriting
        blocks:
          - type: paragraph
            body: >-
              No assigned public source reports current service-line revenue, realized prices, gross margin, customer
              concentration, site utilization, or operating cash flow. The historical report that capacity expansion
              outpaced demand makes fixed-cost absorption and ramp timing especially material; it is not a current
              utilization measure. Competitor-issued industry commentary argues that manufacturing economics include
              quality, delay, and supply-interruption costs as well as batch price, but it is qualitative context rather
              than an independent Resilience benchmark. The financial verdict is that the service portfolio and customer
              output are commercially relevant, while margin path, capital intensity, debt service, and cash conversion
              remain unproven. Before underwriting, obtain site- and customer-level financials, executed contract terms,
              backlog, working-capital needs, and the current debt and cash schedule.
