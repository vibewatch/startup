      - number: '6.3'
        title: Portfolio reset raises customer-continuity questions
        blocks:
          - type: paragraph
            body: >-
              Resilience announced in September 2026 that Made Scientific acquired its East Norriton cell-therapy
              facility and said it is now focused on biologics and sterile drug-product manufacturing (CU011). Earlier,
              BioPharma Dive reported the planned wind-down of six underutilized sites after capacity expansion outpaced
              industry demand and said the company would focus resources on Cincinnati and Toronto (CU012). The sequence
              shows a material footprint reset alongside a later Lilly-linked expansion, not a uniformly growing
              customer base. In a separate 2025 financing announcement, Resilience described up to $825 million of debt
              financing, including an initial tranche then expected later that quarter. It said financing would support
              go-forward operations and customer service, but this is a historical commitment announcement, not evidence
              of current cash available or customer retention (CU006, CU014). No reviewed source quantifies renewals,
              churn, customer concentration, booked backlog, or account-level economics, leaving durability and delivery
              risk unresolved.
            claimRefs:
              - CU006
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Offered service path, not a measured conversion funnel
        blocks:
          - type: paragraph
            body: >-
              Resilience describes a route from first clinical batch through commercial supply, with drug substance,
              sterile fill/finish, device assembly, and packaging in its offering (CU004, CU005). The figure translates
              that company-described capability chain into an ordered workflow; it does not assert that every customer
              enters at the same point, progresses through every stage, or expands at a measurable rate. The public
              evidence names Lilly as a production relationship but does not provide customer-cohort conversion,
              renewal, or expansion data. The workflow is therefore a diligence map of described handoffs, while actual
              stage-by-stage adoption and the economics of each transition remain private-evidence questions.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Footprint transition and operating concentration
        blocks:
          - type: paragraph
            body: >-
              The most visible operating risk is execution through repeated footprint changes, not a documented failure
              event. A trade publication reported that Resilience was winding down six underutilized locations while
              maintaining production at four named sites; in September 2026, the company said its East Norriton
              cell-therapy facility had been acquired by Made Scientific and described a narrower biologics and sterile
              drug-product focus. The retained pool also includes a report that OXB acquired Resilience's former
              Research Triangle site. This is evidence of portfolio change, not proof of customer disruption or
              underperformance. Resilience says drug substance runs at Toronto or is customer-supplied, while sterile
              fill/finish runs at both Cincinnati and Toronto; site-level capacity, utilization, transfer plans, and
              qualified backup routes remain unverified.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
