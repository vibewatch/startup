      - number: '7.2'
        title: Financing, partner dependence, and execution
        blocks:
          - type: paragraph
            body: >-
              Resilience announced up to $825 million of long-term debt financing from Oak Hill Advisors, with a $600
              million first-lien commitment and an initial $525 million tranche expected in the fourth quarter of 2025,
              subject to customary conditions. The announcement is not evidence that all financing was funded or remains
              available; neither current net debt, cash, covenants, amortization, nor the amount drawn is established by
              the assigned sources. Separately, a Resilience-Lilly release described a $750 million joint investment,
              more than 150 million cumulative doses produced, and full operations for the KwikPen expansion expected in
              early 2027. These are meaningful execution and counterparty signals, but not revenue, contracted volume,
              customer share, or cash available. A delay or cost overrun would matter most if it coincides with debt
              service or weak utilization.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
