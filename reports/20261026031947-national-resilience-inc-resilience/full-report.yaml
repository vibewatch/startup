      - number: '6.2'
        title: Adoption evidence is concentrated in Lilly
        blocks:
          - type: paragraph
            body: >-
              The clearest named production evidence is Lilly: Fierce Pharma reports that the companies teamed up in
              2023, that Resilience's Ohio site has manufactured Mounjaro and Zepbound, and that Resilience had produced
              150 million doses of Lilly medicines in vials and prefilled syringes (CU007, CU008). The same report
              describes a $750 million investment for Ohio upgrades focused on Lilly's KwikPen and at least 400 expected
              new jobs; full operations from the upgrade were expected to start in 2027 (CU009, CU010). Those are
              meaningful production and expansion signals, but they are not revenue, utilization, contract duration, or
              evidence that the planned capacity is already operating. Other named relationships in the 2025 reporting
              are described as a pact or alliances, without current-status or production-outcome detail (CU015, CU016).
              The trajectory table preserves each metric's stated unit and timing while flagging missing denominators.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
