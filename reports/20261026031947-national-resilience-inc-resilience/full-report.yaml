        title: Capability, buyer fit, and commercial trade-offs
        blocks:
          - type: paragraph
            body: >-
              Company-published material describes a single quality system spanning early development through commercial
              supply, direct access to technical teams, and installed single-use capacity from 50 L to 2,000 L. Those
              are company claims, not independently audited throughput or customer outcomes. The evidence also describes
              Blue Ash packaging and device-assembly investment alongside a West Chester fill/finish expansion; the
              cited first-line commercial timing was an expectation in a July 2026 article, not a verified operating
              result. This combination may suit buyers seeking fewer transfers across development and supply stages, but
              no source quantifies transfer savings, switching costs, delivery reliability, or realized pricing. The
