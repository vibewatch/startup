              - CE011
              - CE012
      - number: '5.3'
        title: Architecture, quality controls, and operating risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a capability-layer view, not a detailed equipment, data, or process architecture.
              Public company material gives development and installed-volume ranges, names a common quality-system
              approach, and describes a Type V facility Drug Master File and regulatory support; FDA material separately
              explains the general cGMP requirements that apply to drug manufacturing. Neither establishes Resilience's
              current inspection results, deviation history, release performance, cybersecurity controls, or
              site-by-site qualified capacity. The announced network consolidation and planned sterile-injectable
              expansion create execution dependencies around transfer, validation, staffing, and line qualification, but
              are not evidence of a failure. Investors should treat the absence of company-specific operating metrics in
              this source pool as an evidence gap rather than infer either poor performance or proven reliability. The
              assigned pool also contains no relevant practitioner- community, public-engineer, or integration-partner
              technical signal; this is a gap in the available evidence, not proof that no such signal exists.
