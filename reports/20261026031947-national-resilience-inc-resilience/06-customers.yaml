slug: national-resilience-inc-resilience
runDate: 2026-10-26
company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 6
  title: Customers
  summary: >-
    The strongest public adoption evidence is a reported Lilly manufacturing
    relationship, including 150 million doses produced and a further Ohio
    investment plan.     Resilience describes a clinical-to-commercial
    service model, but the available evidence does not establish customer
    concentration, retention, or post-reset utilization.
sections:
  - id: buyer-and-program-segments
    title: Buyers, users, and program segments
    body: >-
      Resilience markets manufacturing and development services to biopharma
      and       pharmaceutical sponsors, but the reviewed public materials do not identify the
      contracting buyer, payer, or account economics for individual programs.
      Its company pages describe biologics drug-substance work from the first
      clinical batch through commercial supply and list 50L to 2,000L
      manufacturing trains (CU001, CU003, CU004). A 2026 company release
      describes an integrated path through sterile fill/finish, device
      assembly, and packaging (CU005). CSIS notes that pharmaceutical
      manufacturers may rely on long-term CDMO relationships and qualified
      supplier redundancy; that is sector context, not evidence of Resilience's
      own contract mix (CU002). BIO's 2026 program lists a Resilience
      presentation with a regional sales and business-development speaker,
      evidence of event presence rather than customer wins (CU013). The table
      maps the documented segments and leaves account scale open.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU013]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption evidence is concentrated in Lilly
    body: >-
      The clearest named production evidence is Lilly: Fierce Pharma reports
      that the companies teamed up in 2023, that Resilience's Ohio site has
      manufactured Mounjaro and Zepbound, and that Resilience had produced 150
      million doses of Lilly medicines in vials and prefilled syringes
      (CU007, CU008). The same report describes a $750 million investment for
      Ohio upgrades focused on Lilly's KwikPen and at least 400 expected new
      jobs; full operations from the upgrade were expected to start in 2027
      (CU009, CU010). Those are meaningful production and expansion signals,
      but they are not revenue, utilization, contract duration, or evidence
      that the planned capacity is already operating. Other named relationships
      in the 2025 reporting are described as a pact or alliances, without
      current-status or production-outcome detail (CU015, CU016). The
      trajectory table preserves each metric's stated unit and timing while
      flagging missing denominators.
    claimRefs: [CU007, CU008, CU009, CU010, CU015, CU016]
    tableRefs: [TU002, TU003]
  - id: portfolio-reset-and-durability
    title: Portfolio reset raises customer-continuity questions
    body: >-
      Resilience announced in September 2026 that Made Scientific acquired its
      East Norriton cell-therapy facility and said it is now focused on
      biologics and sterile drug-product manufacturing (CU011). Earlier,
      BioPharma Dive reported the planned wind-down of six underutilized sites
      after capacity expansion outpaced industry demand and said the company
      would focus resources on Cincinnati and Toronto (CU012). The sequence
      shows a material footprint reset alongside a later Lilly-linked
      expansion, not a uniformly growing customer base. In a separate 2025
      financing announcement, Resilience described up to $825 million of debt
      financing, including an initial tranche then expected later that quarter.
      It said financing would support go-forward operations and customer
      service, but this is a historical commitment announcement, not evidence
      of current cash available or customer retention (CU006, CU014). No reviewed source
      quantifies renewals, churn, customer concentration, booked backlog, or
      account-level economics, leaving durability and delivery risk unresolved.
    claimRefs: [CU006, CU011, CU012, CU014]
  - id: offered-customer-journey
    title: Offered service path, not a measured conversion funnel
    body: >-
      Resilience describes a route from first clinical batch through
      commercial supply, with drug substance, sterile fill/finish, device
      assembly, and packaging in its offering (CU004, CU005). The figure
      translates that company-described capability chain into an ordered
      workflow; it does not assert that every customer enters at the same point,
      progresses through every stage, or expands at a measurable rate. The
      public evidence names Lilly as a production relationship but does not
      provide customer-cohort conversion, renewal, or expansion data. The
      workflow is therefore a diligence map of described handoffs, while
      actual stage-by-stage adoption and the economics of each transition
      remain private-evidence questions.
    claimRefs: [CU003, CU004, CU005, CU007]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by documented target program
    columns:
      - Program segment
      - Buyer / user / payer
      - Documented use case and scale
      - Strategic value
      - Diligence gap
    rows:
      - - Biotech / first clinical programs
        - Biotech sponsor is a stated target; contracting buyer, user, and payer are not identified
        - Company describes drug-substance work from first clinical batch to commercial supply
        - A commercial pathway is described, but no client-level progression is disclosed
        - Customer count, project revenue, and progression by cohort
      - - Clinical-stage innovators
        - Biopharma sponsor is a stated target; contracting buyer, user, and payer are not identified
        - Company lists single-use manufacturing trains from 50L to 2,000L
        - Supports a potential path from development into qualified production; actual program count is unknown
        - Active clinical programs, batch cadence, and share of capacity
      - - Commercial-stage biopharma
        - Pharmaceutical sponsor is the stated target; contracting buyer, user, and payer are not identified
        - Company describes drug substance, sterile fill/finish, device assembly, and packaging
        - Integrated supply can be strategically valuable, but account revenue and contract duration are not disclosed
        - Commercial customer mix, renewals, and margins by account
      - - Large pharmaceutical sponsors
        - Named example Lilly; specific contracting buyer, users, and payer are not identified
        - Fierce Pharma reports Lilly medicine production at Resilience's Ohio site
        - Production evidence is stronger than a logo or stated alliance; concentration and economics remain unknown
        - Lilly's share of sales, capacity, and backlog
    notes: >-
      Partial segment map based on company descriptions and the named reporting
      reviewed; it is not a census of active customers. Payer, segment revenue,
      customer counts, and program-level scale are not disclosed in these
      sources.
    claimRefs: [CU001, CU003, CU004, CU005, CU007]
  - id: TU002
    title: Customer growth and adoption indicators
    columns:
      - Metric
      - Reported value and period
      - Source basis
      - Confidence and implication
      - Missing denominator or qualification
    rows:
      - - Lilly relationship start
        - Companies first teamed up in 2023
        - Fierce Pharma reporting
        - Third-party-reported relationship history; not a renewal or contract-length measure
        - Contract term, current status, and revenue contribution
      - - Lilly medicine production
        - 150 million doses in vial and prefilled-syringe formats; date and measurement window not stated
        - Fierce Pharma reporting
        - Reported production milestone indicates real manufacturing activity
        - Product mix, time period, site utilization, and revenue per dose
      - - Ohio KwikPen investment
        - $750 million investment reported for upgrades focused on Lilly's KwikPen injectable device
        - Fierce Pharma reporting
        - Announced expansion plan; not booked revenue or completed capacity
        - Funding split, contract economics, and realized production
      - - Upgrade employment and start
        - At least 400 jobs expected; full operations expected to commence in 2027
        - Fierce Pharma reporting
        - Forward-looking site plan, not realized headcount or output
        - Baseline, hiring progress, line capacity, and actual start date
    notes: >-
      Reported quantities retain their original metric and status. The article
      does not expose its publication date or the production measurement window;
      no revenue denominator is supplied, and announced investment and expected
      jobs are not realized operating results.
    claimRefs: [CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named organization
      - Segment / reported relationship
      - Deployment or production evidence
      - Outcome reported
      - Limitation
    rows:
      - - Eli Lilly
        - Pharmaceutical sponsor; relationship reported from 2023
        - Ohio production of Mounjaro and Zepbound; 150 million Lilly medicine doses reported
        - Manufacturing milestone and a reported KwikPen upgrade plan
        - No contract value, customer concentration, renewal status, or margin
      - - Moderna
        - Biopharma; vaccine-focused pact reported in 2025
        - No current production deployment established in the reviewed source
        - No program outcome or volume specified
        - Status, scope, and current activity are unverified
      - - AstraZeneca
        - Pharmaceutical company; named among alliances in 2025 reporting
        - No program or production deployment specified
        - No customer outcome specified
        - Current status and commercial scale are unverified
      - - Cargo Therapeutics
        - Biotech company; named among alliances in 2025 reporting
        - No program or production deployment specified
        - No customer outcome specified
        - Current status and commercial scale are unverified
      - - BridgeBio Pharma
        - Biotech company; named among alliances in 2025 reporting
        - No program or production deployment specified
        - No customer outcome specified
        - Current status and commercial scale are unverified
    notes: >-
      Sample of named relationships found in the assigned evidence, not a
      complete customer list. Only Lilly has production detail in these
      sources; reported pacts and alliances are not treated as current
      production deployments.
    enumerationScope:
      coverage: sample
      basis: >-
        Selected named relationships reported in assigned sources; not a
        complete company-wide customer roster.
    claimRefs: [CU007, CU008, CU015, CU016]
