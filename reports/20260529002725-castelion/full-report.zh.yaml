      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              按历史收入口径，Castelion 的收入倍数在同业中最高，反映市场在下注尚未出现在披露数字中的量产收入。最有启发意义的可比对象，是最近在同一资本环境中融资的私营防务科技创业公司。Anduril
              Industries 于 2026 年 5 月完成 $5 billion Series H，估值 $61 billion——约为 2025 年 $2.2 billion 历史收入的
              27.7×——此前收入同比翻倍以上，并拿下 $20 billion Army enterprise contract。Shield AI 于 2026 年 3 月完成 $1.5 billion Series
              G，估值 $12.7 billion——约为预计 2026 年 $540 million+ 收入的 23.5×。Hermeus 作为直接高超音速技术同业，2026 年 4 月完成 $350 million
              Series C 后估值达到 $1 billion；Hermeus 没有生产收入，因此每次飞行测试隐含价值更适合作为 Castelion 生产前溢价的类比。上市公司中，Kratos Defense (KTOS)
              是最接近的公开可比对象——一家正在扩展无人系统和高超音速子系统的中型防务硬件公司——按 2025 年 $1.347 billion 收入计，EV/revenue 约 9–12×。大型防务主承包商（Lockheed
              Martin 1.8×、RTX 3.0×、Northrop Grumman 2.3×）是成熟期结构性地板可比，不适合作为生产前创业公司的目标。核心估值问题不是 Castelion 的收入倍数是否高于
              Anduril 或 Kratos——它确实更高——而是前瞻生产合同管线能否支撑当前溢价。如果 DoW 框架转化，且产能爬坡按计划推进，隐含 $2.8 billion 进入价在 Series B
              阶段可能有吸引力。若不能，任何可实现的近期收入基数都会让倍数严重压缩。
