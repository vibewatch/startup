chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              Castelion 是一家私营防务技术公司，总部位于加州 Torrance，另在洛杉矶县（加州）、Midland（Texas）、Allen（Texas）拥有工程、制造和测试业务，并在 Washington
              D.C. 设有政策办公室。公司还在新墨西哥州 Sandoval County 的 Rio Rancho 运营一座新的 1,000 英亩固体火箭发动机制造园区，名为 Project Ranger。Castelion
              由三名前 SpaceX 高管于 2022 年 11 月共同创立；他们一起离开
              SpaceX，是为了填补他们所说的美国常规威慑关键缺口：缺少低成本、可大规模生产的高超音速远程打击武器。公司的使命，是在面对中国和俄罗斯这两个已先于美国部署实战高超音速系统的对手时，重建美国的高超音速制造能力。Castelion
              是一家硬件密集、垂直整合的制造商，把 SpaceX「快速制造、频繁测试」的理念用到防务领域。公司的第一款也是核心产品，是 Blackbeard
              高超音速打击武器；它从立项起就按工业化产出和商业化单位成本来设计。Castelion 称，Project Ranger 完全投产后，目标是每年生产超过 1,000 枚 Blackbeard
              导弹，并最终扩到每年数千枚，为美国及其盟友提供有意义的弹药纵深。
