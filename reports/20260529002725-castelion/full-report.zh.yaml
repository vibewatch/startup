      - number: '4.4'
        title: 财务结论与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              按公开尽调可用标准看，Castelion 的收入质量较高：固定价格政府合同回款确定性强，SBIR Phase III 机制为近期授标提供竞争隔离，2026 年 5 月 DoW
              生产框架给出了可信的前瞻需求信号。核心未解问题是，该框架能否转化为有约束力的多年采购合同；截至 2025 年 12 月，Castelion 尚未赢得生产合同。支持 MACE 及相关 Blackbeard 开发的
              FY2026 联邦预算拨款合计约 $379M，覆盖基础拨款、国会追加和预算调和资金，说明政府承诺明确，但量产收入还没有合同确定性。客户集中度为绝对集中：美国 DoD
              是唯一买方，任何项目取消、测试失败或预算再分配都会重创收入，且没有商业收入可以对冲。$2.8B 估值意味着在部分兑现的合同基础上给出激进收入倍数，也重押生产框架转化。New Mexico 州 Sandoval
              County 的社区反对集中在高氯酸盐污染风险、潜在 PFAS 暴露和静态点火测试噪音上，为 Project Ranger
              制造扩张增加了投资者不应忽视的环境许可和政治风险。按当前估值承销前，必须完成的关键尽调包括：量产规模毛利率、实际烧钱速度和现金跑道、有约束力的生产合同条款，以及 Project Ranger 环境许可状态。
