        - 扩张驱动因素
        - MACE 目标要求规定 F-35A/C 内埋挂载 4 枚 All Up Rounds，增加美国空军和更多美国海军平台客户
        - 高 — 从 1 类平台扩至 3 类（F/A-18E/F、F-35A、F-35C）
