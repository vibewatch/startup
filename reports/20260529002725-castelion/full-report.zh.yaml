      - number: '7.3'
        title: 运营、制造与安全风险
        blocks:
          - type: paragraph
            body: >-
              固体火箭发动机制造天然高危。2025 年 4 月，Northrop Grumman 位于 Utah 州 Promontory 的推进剂原料设施发生爆炸，摧毁一栋建筑但未造成人员死亡；即便是美国最有经验的 SRM
              制造商运营的设施，AP 基推进剂生产的化学波动性也由此显现。Castelion 正在建设一座可比设施，但没有可比的机构安全历史。公司垂直整合路径——内部生产 SRM
              推进剂、壳体、导引头和控制系统——加速成本下降，也集中运营风险。该设施的消防在架构上很难处理，因为 AP 火灾不能用水；应急规程要求人员撤离并允许受控燃烧，限制了损害缓释选项。Rio Rancho 消防局长
              James Wenzel 对该设施高危分类及其对消防部门资源的要求提出担忧。静态点火测试会产生包括氯化氢在内的酸性气体和细小氧化铝颗粒物；如果不能完全捕集，这些物质可能随风下沉扩散，影响居民空气质量。GAO
              2024 年对美国高超音速项目的评估发现，多数项目没有使用现代数字工程工具，推高全行业成本和进度风险；Castelion
              的快速迭代模型部分缓释了这一点，但尚未在规模扩张上得到独立验证。资格测试失败仍是重大风险：Blackbeard 必须在 2026 年通过陆军集成和海军 F/A-18 平台测试，条件性生产框架才能转化为已拨款合同。
