      - number: '3.5'
        title: 护城河、切换成本与差异化耐久性
        blocks:
          - type: paragraph
            body: >
              Castelion 的护城河建立在四个相互强化的机制上：垂直整合、平台集成切换成本、生产规模投资，以及通过多年框架协议形成的早期采购锁定。


              推进（固体火箭发动机）、航电、热防护和制导系统的垂直整合——在 Project Ranger 这个位于新墨西哥州 Sandoval County、占地 1,000 英亩、拥有 21
              栋建筑的固体火箭发动机园区落地——让 Castelion 不必依赖传统一级供应商，就能控制成本、交期和质量。该设施预计到 2026 年底投入运营，并创造约 300
              个长期岗位。这是一项资本密集型基础设施投资，竞争对手很难快速复制。


              平台集成会不断累积切换成本。把一款武器集成并认证到军事平台（Castelion 的场景是 F/A-18）上，需要数千小时工程投入、资格测试、布线改动、软件更新和飞行员训练。一旦海军认证 Blackbeard 可在
              Super Hornet 上使用，若要在同一平台重新认证竞争武器，就需要等量投入——这会形成有利于先发者的机构惯性。陆军 Blackbeard GL 项目（从 HIMARS 地面发射）创造了第二条平台集成路径，使
              Castelion 的切换成本覆盖面翻倍。


              DoD 从传统成本加成转向固定价格、明确数量的框架协议，结构性有利于能在规模化产量下承诺单位成本确定性的供应商。Castelion 已签署此类框架；DoD 正积极寻求五年内 12,000+ 枚
              Blackbeard 的授权和拨款。这个信号对资本市场可见（支撑 Altimeter 和 Lightspeed 领投的 $350M Series B），也为 Castelion 的设施投资提供了明确需求后盾。


              耐久性风险包括：（1）ARRW 复活——Lockheed 保留机构关系，可能交付成本更低的 ARRW Increment 2 版本；（2）Raytheon HACM 若在 2027 年达到
              IOC，会为美国空军创造一个竞争性空射高超音速选项，并可能影响海军与空军协同；（3）新进入者——Anduril 明示的高超音速野心和日益上升的 defense-tech 机构地位，可能在 2028–2030
              年窗口催生竞争武器；（4）DoD 单一买方风险——如果国会削减高超音速预算或重新分配资金，Castelion 的 12,000 枚需求信号可能减弱。
