  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Castelion 位于高超音速武器开发与大批量防务制造的交叉点。相关市场定义为速度达到或超过 Mach 5
              的武器，主要包括空射和地射高超音速滑翔飞行器、高超音速巡航导弹，以及助推-滑翔系统。该定义排除了传统亚音速巡航导弹（如 Tomahawk）、战术弹道导弹，以及 Standard Missile
              系列等超音速但未达高超音速的弹药。

              在高超音速细分市场内，Castelion 具体瞄准一个新子类别：低成本、大批量、按工业化产出设计的高超音速打击武器，而不是精品式小批量生产。Blackbeard 导弹处于轻型 / 紧凑型空射高超音速类别；它与
              Navy Conventional Prompt Strike 或 Army LRHW 等更重系统的区别，在于低于 $400K 的单位目标成本和多平台兼容性。美国海军库存中的现状替代品是 AGM-158C
              LRASM (Long Range Anti-Ship Missile)，单价约 $3M；已取消的 HALO/OASuW Increment 2 项目留下采购空档，Blackbeard
              正试图填补这一空档。对美国陆军而言，在位方案是 Precision Strike Missile (PrSM)，其 Increment 4 版本瞄准类似能力，但成本显著更高。

              相邻领域包括：反高超音速防御系统（完全不同的市场）、超燃冲压推进开发、高超音速测试基础设施，以及下游平台集成服务。Castelion 当前尚无法覆盖这些相邻领域；随着公司推进 IP 成熟，它们可能成为未来扩张面。
