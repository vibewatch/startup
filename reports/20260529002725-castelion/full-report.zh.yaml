  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Castelion 竞争的市场分为三层：（1）既有主承包商的高超音速项目（Lockheed Martin ARRW、Raytheon HACM、Northrop Grumman 参与的 Conventional
              Prompt Strike/Dark Eagle）；（2）Pentagon Low-Cost Containerized Missile (LCCM)
              项目下的新进入巡航导弹公司（Anduril、Leidos、CoAspire、Zone 5 Technologies）；（3）现状替代品——JASSM-ER 和 Tomahawk
              等传统防区外弹药，它们仍是亚音速，但已经大批量列装。


              没有任何在位者处在 Castelion 的具体利基：从第一天起就为高产能生产设计的低成本、空射、Mach 5+ 战术高超音速导弹。Lockheed 的 ARRW 能达到高超音速，但每枚成本
              $15–18M，曾被取消，后又在 FY2026 预算中以 $387M 复活。Raytheon 的 HACM 是一款吸气式超燃冲压巡航导弹，处于原型阶段，首次飞行测试推迟到 FY2026，IOC 目标为 2027
              年，单枚成本未披露但为数百万美元级。Northrop/Lockheed Conventional Prompt Strike (CPS) 和 Army Long-Range Hypersonic Weapon
              (LRHW/Dark Eagle) 是舰射和地射滑翔体系统，瞄准战略远程打击，而不是 Blackbeard 所针对的空射战术出动。Castelion 与 LCCM 相邻的框架协议——DoD
              寻求在两年采购协议中每年至少购买 500 枚 Blackbeard，并积极寻求五年内 12,000+ 枚导弹的授权——截至 2026 年 5 月在同业中没有直接可比项。


              舰载航空打击的现状替代品是 AGM-154 JSOW 或 AGM-158 JASSM-ER（亚音速，约
              ~$1.4M/枚），它们缺少高超音速速度，也缺少对现代一体化防空系统的生存能力。国家实验室（Sandia、DARPA 项目）和 Dynetics（C-HGB 设计方）的 DoD
              内部开发是一条非商业并行路径，但不是 Castelion 的商业竞争对手。
