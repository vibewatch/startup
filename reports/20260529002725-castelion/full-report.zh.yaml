      - number: '1.5'
        title: 风险、反向信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Castelion 面临多项实质风险，覆盖社区反对、监管暴露、业务集中和规模化执行。Project Ranger 制造园区引发了 Rio Rancho 和 Sandoval County
              非建制地区居民的显著本地反对；居民担心静态火箭发动机点火测试噪声、过氯酸铵氧化剂和铝推进剂粉末带来的环境污染、地下水与冲沟径流影响、部落协商义务，以及火灾和事故响应能力。2025 年 12 月 9
              日的一场社区会议吸引了数十名居民，他们就安全和环境规程追问 Castelion CFO Andrew Kreitz；Sandoval County 批准了该项目 $125M 工业收入债。Rio Rancho
              消防局长 James Wenzel 另行提出担忧：设施的高危分类会给市政消防资源带来压力。截至 2025 年 12 月社区会议，Sandia National Laboratories
              的环境羽流研究仍在进行。从商业角度看，Castelion 是一家单一客户公司：美国联邦政府是唯一收入来源，且公司尚未获得生产合同（截至 2025 年 12
              月，仍处于演示阶段）。公司还没有生产数千枚导弹，必须从原型转向量产——这一阶段历来成本高、周期长。收入、烧钱速度和毛利率没有公开披露。三位联合创始人带来中等程度的关键人物集中风险。董事会结构和主要投资人的治理权不公开。防务采办项目经常出现延期、范围调整和预算削减，可能实质影响
              Castelion 的合同管线。
            claimRefs:
