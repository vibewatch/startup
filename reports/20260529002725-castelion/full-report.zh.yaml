      - - HIMARS → CAML 发射器过渡
        - 扩张驱动因素
        - CAML M 变体被设想为 Blackbeard 的主要美国陆军发射器，把现有 HIMARS 车队扩展到新型自主发射器
        - 中 — 扩大美国陆军弹药深度；取决于 CAML 开发时间表
        - 跟踪 CAML 项目里程碑时间表；发射器进度滑坡可能推迟美国陆军需求
      - - FMS / 盟国销售
        - 扩张驱动因素
        - 20+ 个美国盟国使用 HIMARS；Blackbeard 与 HIMARS 兼容，天然打开 FMS 路径；尚未确认 FMS
        - 中高（未来）— 需要 ITAR 许可和政府间协议
        - 请求 State Dept. 和 DSCA 的 FMS 资格审查时间表
      - - Castelion 第二条产品线
        - 扩张驱动因素
        - Series B（Dec 2025）资助“第二条高超音速产品线并行成熟”；可能增加新的客户关系
        - 低（近期）— 第二产品未有公开客户合同
        - 监测 Castelion 新闻稿中的第二产品客户公告
      - - 单一采购方集中度（DoD = 100% 收入）
        - 集中度风险
        - Castelion 没有商业或盟国客户；100% 收入来自美国 DoD；任何项目重组、预算撤销或测试失败都会清空收入
        - 关键 — 没有收入多元化缓冲
        - 要求提供合同积压、修改授权和未拨付余额的详细拆分
      - - DoD 内部美国海军主导
        - 集中度风险
        - $154.9M 美国海军合同对比 $25M 美国陆军 HX3 FY26；美国海军约占已执行合同价值 86%
        - 高 — 单一采购方政府内部又集中于单一军种
