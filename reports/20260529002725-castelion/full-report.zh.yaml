      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Castelion 自成立以来多轮融资约 $464M。公司的第一笔外部资本来自 Alex Poulin 的 Lavrock Ventures；2023 年 4 月，Lavrock Ventures
              看到创始人在洛杉矶地区仓库和机加工车间里早期自举运营的韧性后，投资 $2M。首笔投资后的一个月内，Castelion 首次提交方案就赢得一份 $5M 政府合同——这也是公司的第一份合同。2023 年 10
              月，公司宣布正式 Seed 轮 $14.2M，由 Andreessen Horowitz (a16z) 和 Lavrock Ventures 共同领投，First In、BlueYard Capital 和
              Champion Hill Ventures 参投。2025 年 1 月，Castelion 宣布 $100M 融资，其中 $70M 为 Lightspeed Venture Partners 领投的
              Series A 股权融资，a16z、Lavrock Ventures、Cantos、First In、BlueYard Capital 和 Interlagos 参投，另有来自 Silicon Valley
              Bank 的 $30M 风险债（2025 年 2 月最终交割）。2025 年 12 月 5 日，Castelion 宣布 $350M Series B，由 Altimeter Capital 和
              Lightspeed Venture Partners 领投，Lavrock Ventures、Andreessen Horowitz、General Catalyst、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。Series B 对 Castelion 的估值约为 $2.8B。累计融资约
              $464M（股权加债务）。从 2023 年 4 月获得第一笔外部资本，到 32 个月后达到 $2.8B
              估值，估值上行速度很快；背后反映的是政府合同动能、多轮成功飞行测试，以及机构投资者对公司技术和制造路径的广泛信心。
