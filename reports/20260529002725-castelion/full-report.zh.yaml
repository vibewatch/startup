          tone: positive
        - id: integration
          label: 平台集成合同
          detail: 中期收入：在 F/A-18 Super Hornet 和 HIMARS 平台上集成并实弹测试。$49.9M + $105M Navy 合同（Feb–Apr 2026）是当前主要收入事件。
