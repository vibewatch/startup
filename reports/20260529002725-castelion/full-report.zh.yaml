  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与政府合同结构
        blocks:
          - type: paragraph
            body: >-
              Castelion 是一家纯粹面向美国政府的防务承包商，没有商业收入。每一美元收入都来自 DoD 按固定总价条款授予的合同，主要通过 Small Business Innovation Research
              (SBIR) Phase III 合同工具执行；该工具允许非传统防务供应商以单一来源方式签约。公司披露的收入轨迹很陡：2023 年 5 月第一份 $5M 合同，到 2025 年 12 月已上升为累计超过
              $100M 的军事合同基础，到 2026 年 4 月已接近 $155M 的已执行海军合同价值。2026 年 2 月合同授予（N6833526F1022）金额为 $49,998,005，用于全尺寸
              Blackbeard 原型、飞行测试，以及海军 Multi-mission Affordable Capacity Effector (MACE) 项目下的早期作战能力。2026 年 4 月，同一合同执行了
              $104,998,566 的选择权修改，用于最终集成、印太司令部辖区内实弹测试，以及早期作战能力要求。第三方收入聚合数据商估计，截至 2025 年 9 月，Castelion 年收入约
              $51.5M，与正在放大的原型开发收入曲线一致。2026 年 5 月 Department of War 生产框架——一旦测试和验证完成，即保证每年至少 500 枚 Blackbeard
              导弹，并有选项在五年内购买超过 12,000 枚——是收入模型从开发转向生产合同的第一个节点。该框架尚未转成有约束力的多年采购合同；转换取决于正在进行的测试和集成时间表能否完成。
