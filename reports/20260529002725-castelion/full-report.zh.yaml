      - number: '3.2'
        title: 在位高超音速项目
        blocks:
          - type: paragraph
            body: >
              Lockheed Martin 主导 ARRW (AGM-183A) Air-launched Rapid Response Weapon，这是一款由 B-52/B-1B 携带的高超音速滑翔飞行器。该项目在
              2021 至 2023 年间至少经历三次飞行测试失败，导致空军取消。FY2026 国防预算以 $387M 将其复活，并规划到 2030 年投入 $1.7B。单枚成本估计为
              $15–18M（Congressional Budget Office 对 100–300 枚生产批次的分析），比 Castelion 的 Blackbeard 目标价格高 40× 以上。USAF
              现在计划将其集成到 B-52，并可能集成到 F-15E。Lockheed 还与 Northrop Grumman 一起，在海军 Conventional Prompt Strike (CPS) 和陆军 LRHW
              (Dark Eagle) 项目中担任主承包角色；陆军于 2026 年 4 月授予 $2.7B CPS/LRHW 合同。CPS 是舰射滑翔体系统，当前部署在 Zumwalt-class destroyers
              上，单枚成本约 ~$41M。


              Raytheon Technologies (RTX) 主导 Hypersonic Attack Cruise Missile (HACM)，这是美国开发管线中唯一的吸气式超燃冲压高超音速导弹。HACM 设计由
              F-15E（之后为 F/A-18）挂载，2022–2023 年从开发合同中获得约 $1.4B 资金。GAO 审查后的空军时间表因设计延误，将首次飞行测试从 FY2025 推迟到 FY2026。FY2027
              预算申请 $404M 生产资金，IOC 目标为 2027 年。总采购计划超过 $3B。Northrop Grumman 提供助推器、超燃冲压设施投资，以及另行获得的 Glide Phase Interceptor
              (GPI) 高超音速防御项目（2026 年 5 月 $475M 合同修改），还包括用于高超音速遥测的 RangeHawk 无人机合同。


              三家在位者都采用成本加成合同模式，采办周期以多年计，组织结构也不是为了生产 Castelion 所瞄准的每年 1,000s 枚批量。它们的机构优势包括数十年的 DoD
              关系、涉密项目准入和庞大工程团队；但它们的成本结构和官僚采办周期，正是 Castelion 模型要绕开的对象。
