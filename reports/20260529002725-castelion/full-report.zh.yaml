      - number: '3.4'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >
              对 Castelion 最重要的竞争维度，是单位成本与产量潜力的组合。Pentagon 预算文件确认，Blackbeard 的设计目标约为每枚 $384,000，用于海军采购；这比 ARRW（$15–18M）便宜
              40× 以上，比 CPS/C-HGB（约 ~$41M）便宜 100× 以上，并从根本上重塑了谁能大批量购买高超音速武器。这个成本差异不是边际的；它会改变库存规模、任务多样性，以及消耗武器时的风险计算。


              从能力看，Blackbeard 达到 Mach 5+，并在末段机动，比弹道轨迹更难跟踪和拦截。ARRW 是助推-滑翔飞行器，气动外形不同；HACM
              是吸气式超燃冲压，推进物理不同，射程更长但开发更慢。CPS/Dark Eagle 是舰射或地射战略滑翔体，不像 Blackbeard 那样跨平台。在战术空射角色中——从航母起飞打击设防目标——Blackbeard
              是目前唯一一个处于活跃采购中，同时结合高超音速、空射能力和规模化生产经济性的武器。


              相比在位者，关键能力缺口是射程：Blackbeard 的公开报道射程没有精确披露，而 CPS
              等更远程的高超音速滑翔飞行器可以在洲际防区外距离实施打击。不过，对海军舰载航空任务而言，战术射程叠加高弹药纵深，是海军已明确选择的一笔取舍；海军正把 MACE 项目导向 Blackbeard
              作为首个武器候选。LCCM 替代方案有数量但牺牲速度；在位者有射程和涉密能力，但牺牲低成本和生产节奏。
