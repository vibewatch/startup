  - id: TV005
    title: 投资逻辑破裂与止损触发器
    columns:
      - 触发器
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 实弹测试失败（MACE 项目）
        - 任何经公开确认的 Blackbeard 飞行测试失败，发生在 Navy MACE 或 Army HX3 项目，并归因于武器设计（而非靶场条件）。
        - 动摇三项乐观情景假设；触发生产框架重新评估；项目可能取消。
        - 立即复盘仓位；在下一轮融资价格发现前减仓或退出。
      - - DoW 框架未转为合同
        - 生产框架到 Q2 FY2027（June 2027）仍未转为有约束力的多年采购合同。
        - 基准情景收入路径崩塌；$2.8B 估值失去支撑；降估值融资情景成为最可能结果。
        - 除非提供合同延期而非取消的具体证据，并附修订时间表，否则按投资逻辑破裂处理。
      - - Project Ranger 施工延期
        - Project Ranger 首栋生产建筑未在 Q1 2027 投产（原计划 end-2026）。
        - 收入爬坡推迟；营运资本和资本开支包袱上升；Series C 更早到来，议价位置更弱。
        - 提高监控频率；评估是否已拿到桥接融资。
      - - 联合创始人离职
        - 三名联合创始人（Hargis、Pitt、Kreitz）中有两名或以上因任何原因离职。
        - 政府关系管理、技术执行和融资能力集中在联合创始人身上；公司员工数 100+ 且处早期阶段，接班风险很高。
        - 必须立即询问留任计划、董事会构成和领导层替代安排。
      - - FY2027 MACE 预算撤销
        - 国会在 FY2027 NDAA 或拨款法案中撤销 MACE 采购资金，或 DoD 发布正式列装项目取消通知。
        - 收入拐点消失；生产合同不再可能按公告规模转换。
        - 没有 MACE 项目，悲观情景下不存在高于 $500M–$1B 的可行底部；应全数退出仓位。
      - - Project Ranger 环评许可受阻
        - New Mexico Environment Department 或 EPA 发出停工令或同意协议，使 Project Ranger 设施建设延误超过 90 天。
        - 制造产能延后；MACE 交付承诺受威胁；投资人信心受损。
        - 提高法律和监管监控；评估备选厂址是否可行。
    notes: 止损触发器用于阈值化监控；并不构成具体价格目标或退出指令。投资人应独立设定自身仓位限制。
    claimRefs:
