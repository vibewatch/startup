        - AGM-158C LRASM（亚音速，>$2M/unit）、AGM-84D Harpoon（亚音速，射程有限），或没有高超音速选项
        - F/A-18E/F 上的 Blackbeard；Mach 5+ 速度；$300K–$442K 目标 AUR；EOC FY2027
        - 高超音速大幅压缩对手点防御反应时间；每次交战成本比 LRASM 低 5–7x
