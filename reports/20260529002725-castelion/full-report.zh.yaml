      - number: '7.5'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 的高管权力集中在三位联合创始人——CEO Bryon Hargis、COO Sean Pitt 和 CFO Andrew
              Kreitz——身上，构成有意义的关键人物风险。每位创始人都拥有独特且难以替代的能力：Hargis 负责政府关系管线和合同策略；Pitt 领导运营和大规模制造执行；Kreitz
              掌握资本结构、融资和财务建模。公司未公开接班计划、关键人物保险或指定副手。IPO Club 的二级市场分析指出，Castelion 的投资者信心和政府可信度，在很大程度上绑定于这支具体创始团队的 SpaceX
              背景和既有 DoD 关系。工程人才获取风险偏高：固体火箭发动机和高超音速系统工程师需要安全许可、专门材料科学能力和实践经验，广义科技人才市场难以轻易供给。2025–2026
              年防务科技招聘升温，多家资金充足的初创公司争夺同一批持证工程人才。财务侧，Castelion 未披露收入运行率、毛利率、烧钱速度或运营现金跑道。公司尚未产生量产收入，资金来自合同里程碑付款，以及 2022
              年以来募集的 $464 million 股权和债务。$30 million SVB 风险债务分期带有标准契约风险，可能需要再融资。Anduril Industries（2026 年 5 月以 $61
              billion 估值融资 $5 billion）以及既有主承包商在相邻低成本弹药项目上的竞争，都会增加资源和人才竞争压力。DoD 的 LCCM 项目于 2026 年 5 月与 Anduril、Leidos
              等签署框架协议，表明低成本弹药竞争正在加剧。
