  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与军种细分
        blocks:
          - type: paragraph
            body: >-
              Castelion 是只服务美国政府的防务承包商；截至报告日，每一美元收入都来自 DoD
              合同，没有商业、盟国或民用客户。因此，公司客户基础是买方垄断：美国战争部（原美国国防部）是唯一付款方，美国海军、美国陆军和美国空军作为运营买方和作战用户。海军是主要生产客户，已围绕一份由 Naval Air
              Warfare Center Aircraft Division（Lakehurst, New Jersey）管理的基本订购协议（N6833526G0006）执行 $154.9M 固定价格合同。陆军通过
              HX3/Blackbeard GL 项目成为次要客户，FY2026 预算拨款 $25M。空军是早期客户，2023 年通过主题 AF231-D026 下的 SBIR Phase II
              合同（$1.77M，FA2385-23-C-B007）孵化了 Blackbeard 项目。A 轮公告（2025 年 1 月）确认“由 US Navy、US Air Force、US Army
              资助的在执行合同”，说明在海军主导地位成形前，三军种已参与。地域上，所有工作均在美国国内执行（主要是 California 州 Torrance），实弹测试在 Mojave、Dugway Proving
              Ground 等政府靶场进行。截至 2026 年 5 月，尚无已公开确认的对外军售（FMS）或盟国采购；但 Blackbeard 设计目标兼容 HIMARS，而该平台由许多美国盟友操作，暗示未来可能具备 FMS
              资格。客户集中度在当前阶段极高且有意为之：公司整个战略都把 DoD 高超音速市场作为可触达收入基础。
