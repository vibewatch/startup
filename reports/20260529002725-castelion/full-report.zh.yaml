      - number: '6.4'
        title: 美国战争部生产框架与采购视野
        blocks:
          - type: paragraph
            body: >-
              Castelion 历史上最重要的客户信号出现在 2026 年 5 月 13 日，当时美国战争部宣布一项生产框架协议，把 Castelion 与四家巡航导弹公司一并纳入 Low-Cost
              Containerized Missiles 项目。DoW 表示，一旦 Castelion 完成测试和验证，部门将授予一份两年期多年采购合同，每年至少采购 500 枚 Blackbeard
              导弹，并可选择延长至最多五年。此外，DoW 宣称正“积极寻求必要授权和拨款，以在五年内采购超过 12,000 枚 Blackbeard
              导弹”。这是美国政府首次公开承诺以这种规模生产高超音速武器，但条件性非常强：没有下达有约束力的生产订单，没有执行采购订单，整个框架取决于正在进行的集成、测试和验证计划顺利完成。尽管如此，该框架确实为 2027 至
              2029 年生产批次设定了固定物料单价，在正式拨款前提供定价可预见性。空军最初的 SBIR 主题 AF231-D026 继续作为三军种共同的法律合同工具，在 SBIR Phase III
              下允许无需竞争性重新征集即可单一来源授标。DoW 的表述明确具有战略色彩：它把该安排描述为 Trump 总统和 Hegseth 部长的 “Arsenal of Freedom” 指令的一部分，并把
              Castelion 定位为不同于传统主承包商的新工业基础伙伴。评估留存风险时，这一背景很重要：对仍处于原型测试阶段的项目而言，Blackbeard
              采购背后的政治和机构动能异常高，但国会、政府换届或测试失败都可能逆转项目和预算承诺。
