      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >-
              Castelion 于 2025 年 12 月 5 日完成 $350 million Series B 融资，由 Altimeter Capital 和 Lightspeed Venture Partners
              共同领投，Andreessen Horowitz、General Catalyst、Lavrock Ventures、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。本轮隐含投后估值约 $2.8 billion。历轮累计融资约 $504 million，包括
              Lavrock Ventures 最初 $2 million 种子轮（2023 年 4 月）、$100 million Series A（2025 年 1 月；$70 million 股权加 SVB $30
              million 风险债）和 $350 million Series B。按现有证据，Series B 是截至当日美国高超音速武器创业公司募集的最大单轮融资。第三方收入聚合方 CompWorth、Growjo 和
              GetLatka 对 2025 年 9 月的年收入估计都接近 $51.5 million，与公司不断扩大的政府合同基础一致。按 100 多名员工估算，单员工收入为 $515,000。$2.8 billion
              估值隐含历史收入倍数约 54×，而当时 Anduril 和 Shield AI 的观察区间为
              23–28×。优先股堆叠、清算顺位和股权结构表均未公开披露，投资者无法相对普通股独立评估有效进入价格。截至报告日，公开来源未发现为 Castelion 估值提供第三方标记的老股交易或要约回购交易。
