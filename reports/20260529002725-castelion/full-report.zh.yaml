  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议和信心
        blocks:
          - type: paragraph
            body: >-
              Castelion 在 2025 年 12 月 Series B 约 $2.8 billion
              的进入价格上，得到观察建议。信心来自四个证据扎实的支柱：代际级且结构性获资支持的高超音速武器市场；在可负担价位上，目前没有空射同类产品的先发位置；具备 SpaceX 级执行 DNA 的运营团队；以及 2026 年
              5 月 DoW 生产框架这一政府需求信号——没有可比创业公司能在如此早期拿到。然而，以估计历史收入约 54× 的进入倍数看，相对于任何阶段的上市防务科技公司基准都偏激进。最接近的私营可比公司——Anduril
              Industries 按 2025 年 $2.2 billion 收入估值 $61 billion（27.7×），Shield AI 按预计 2026 年约 $540 million 收入估值 $12.7
              billion（23.5×）——尽管收入基数大得多、平台更多元、生产历史更长，倍数都明显更低。风险评级为高：DoW
              框架转成有约束力的多年合同、首个全速率生产批次按期交付、规模化毛利率得到确认，这三项必须同时兑现，投资者才有把握把 $2.8 billion
              进入价定为公允价值。估值立场为偏高。升为买入需要至少满足以下之一：签署有约束力的生产合同，披露毛利率数据并达到 ≥20%，或进入价格回落到历史收入 <35×。持有周期长、能进入运营 data room
              的防务科技投资者，应把这三个尽调触发器作为闸门条件。
