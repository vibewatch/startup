  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与投资概览
        blocks:
          - type: paragraph
            body: >-
              Castelion 的风险画像由四股相互咬合的力量塑造：作为含能材料制造新进入者，要面对技术和监管复杂性；几乎完全依赖单一政府客户；小型创始团队且未披露接班规划，执行风险偏高；$2.8 billion 估值则隐含
              DoW 非约束性生产框架成功转化为已拨款多年合同。公司在种子轮、A 轮和 B 轮中合计融资约 $464
              million，资本储备可观，但仍未产生量产收入，必须跨过多个资格关口后才能获得量产规模合同付款。本章按已知缓释后的剩余严重度排列风险：Project Ranger
              的监管和环境风险因社区反对活跃且环境审查未完成，近端不确定性最高；高氯酸铵供应链集中是整个 SRM
              行业共同的结构性脆弱点；关键人物和执行风险中等，但若有适当接班规划可管理；财务和竞争风险偏高，但框架协议和强投资人支持带来部分对冲。最后一节列出放弃标准和监控指标。
