      - number: '5.5'
        title: 技术差异化与专有地位
        blocks:
          - type: paragraph
            body: >-
              Castelion 的竞争差异化来自制造诀窍、供应链架构和开发方法的组合，而不是新物理。单个子系统没有技术上前所未有之处；差异在集成路径和生产经济性。源自 SpaceX
              的“快速建造、频繁测试”方法把从设计到发射的周期由数年压到数月，形成学习曲线优势；传统主承包商一年或两年一次的测试节奏，短期内难以复制。固体火箭发动机、导引头、CAS、飞控计算机和热防护系统的垂直整合，让
              Castelion 直接控制成本驱动项；多数防务公司已把这些环节交给专业分包商，而后者按防务溢价供应链定价。由全球 R&D 投资支撑的汽车级商业部件（电机、计算机、壳体）让 Castelion
              相对航天级等价部件拥有更好的成本和交付周期位置。SBIR Phase III 单一来源合同权限在当前原型阶段提供竞争隔离，政府买方无需重新竞争即可追加选项。但截至 2026 年 5 月，公开专利数据库未发现
              Castelion 已授权专利；其 IP 地位似乎建立在商业秘密制造诀窍上，尤其是固体火箭发动机处理配方、热防护铺层流程和 GNC 软件参数。制导栈受 ITAR Category IV
              管制，带来出口限制，也说明制导系统使用受控美国防务技术；任何 FMS 销售都需要出口许可。The War Zone 提出技术问题：Blackbeard 的飞行剖面可能是峰值超过 Mach 5
              的准弹道轨迹，而非持续高超音速助推-滑翔，因此按技术定义是否严格算“高超音速”仍有疑问；Castelion 澄清，社交媒体上的测试载具图像并不代表量产武器。
            claimRefs:
              - CE011
