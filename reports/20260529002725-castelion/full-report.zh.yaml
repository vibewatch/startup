  - id: FI002
    title: 单位经济桥接——Blackbeard 成本架构
    type: flow
    layout: wide
    summary: Castelion 的单位成本逻辑，是靠垂直整合、商业供应链和 Project Ranger 高量制造，把单枚 AUR 成本从传统高超音速水平（~$5M+）压到 $300K 以下。毛利率层仍未公开。
    data:
      nodes:
        - id: legacy-cost
          label: 传统高超音速基线
          detail: 传统高超音速武器单枚成本达数百万美元（PrSM Inc 2：每枚约 $5.35M；HACM 开发成本约 $2B，对应约 13 件测试弹）。
          tone: negative
        - id: design-choice
          label: 面向可制造性设计
          detail: Castelion 避开「精致设计」，垂直整合固体火箭发动机、导引头、控制作动和飞控计算机，同时压缩成本和进度。
          tone: positive
        - id: commercial-supply
          label: 非传统商业供应链
          detail: 金属壳体和橡胶部件来自汽车行业供应商，而非防务专用供应商，从而降低材料成本和交付周期。
          tone: positive
        - id: high-cadence
          label: 高节奏测试迭代
          detail: 2025 年完成 25+ 次飞行测试且间隔很短；测试—学习—修复循环压缩开发时间，也降低每轮改版成本。
          tone: positive
        - id: target-cost
          label: 目标单位成本：<$300K
          detail: Navy MACE 项目目标为生产速率 ≥500 AURs/year。FY2027 首批生产批次估计为 $442K/AUR；规模化后预计降至 $300K。
          tone: neutral
        - id: margin-gap
          label: 毛利率缺口（非公开）
          detail: 高于直接制造成本的每枚 AUR 贡献未披露。$300K–$442K 价格区间能否支撑可行毛利率，完全取决于实际生产成本；评估需要数据室。
          tone: negative
    approximationNotes: 所有成本数字要么是项目目标，要么是来自 DoD 预算文件的早期批次估计。实际制造成本、材料拆分和毛利率均未公开。传统成本基准（PrSM 定价）来自公开可得的 Army 预算提交文件。
