            title: 单一客户集中——美国 DoD 是唯一收入来源
            body: >-
              Castelion
              没有商业收入，也未披露盟国销售管线。每一美元收入都取决于美国政府防务采购决定。项目取消、实弹测试失败或预算再分配都会立刻损害收入，且没有商业收入可以抵消。除非进入盟国或商业市场，否则这种结构性脆弱性无法分散；而这些市场目前并不在已披露的公司战略中。
            calloutType: risk
            claimRefs:
              - CI009
              - CI028
          - type: callout
            title: 生产合同转化尚未确认；技术分类受到质疑
            body: >-
              截至 2025 年 12 月，Castelion 尚未获得有约束力的生产合同。2026 年 5 月 DoW 框架是意向协议，不是采购订单。The War Zone 对 Blackbeard
              的飞行剖面是否满足高超音速严格定义提出疑问；如果技术分类被成功挑战，可能影响项目预算线、单枚采购上限，以及相对既有主承包商的竞争定位。
            calloutType: risk
            claimRefs:
