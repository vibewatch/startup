  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 类型
      - 论点
      - 支撑证据
      - 改变观点的条件
    rows:
      - - 投资逻辑
        - 结构性且已有拨款的需求：DoD 库存中没有可负担、可量产的高超音速打击武器，形成任务关键缺口；Castelion 以独特位置补上这一环。
        - DoW 生产框架（May 2026）、MACE 奖项、FY2026 预算对 Blackbeard 项目承诺 $379M。
        - FY2027 NDAA 取消所有 MACE 及相关高超音速预算线。
      - - 投资逻辑
        - SpaceX 基因的执行力：三位前 SpaceX 高管不到三年完成 25+ 次飞行测试——对防务制造初创公司来说，这个速度没有行业先例。
        - Altimeter 合伙人引述确认 25+ 次飞行测试；Series B 新闻稿称仅 2025 年就有 20+ 次开发测试。
        - 两名或更多共同创始人离职，或出现系统性测试失败。
      - - 投资逻辑
        - 先发制造护城河：Project Ranger 打造 1,000 英亩固体火箭发动机产能；还没有同业初创公司为可比的专用制造基地破土。
        - Project Ranger early 2026 破土；私人投资 $220M；规划 21 栋建筑，目标 year-end 2026 全面投产。
        - 另一家供应商以可比成本拿到经济型高超音速的竞争性生产合同。
      - - 反向逻辑
        - 约 54× 收入倍数要求近乎零失误执行：当前估计收入约 $51.5M，只有生产框架迅速转化并按年扩至数亿美元，才能支撑 $2.8B 估值。
        - 第三方收入估计（CompWorth、Growjo）；可比非上市同业交易倍数为 23–28×。
        - 生产框架转化，收入爬升至 ≥$150M，把倍数压缩到可辩护区间。
      - - 反向逻辑
        - DoW 生产框架没有约束力：May 2026 框架是需求信号，不是采购订单；转化前还要完成实弹测试并宣布 EOC。
        - DoW 新闻稿措辞（“框架协议”）；财务章节对合同转化条件的分析。
        - 与 DoD 签署有约束力的多年生产合同。
      - - 反向逻辑
        - “高超音速”标签含糊带来项目风险：The War Zone 公开质疑 Blackbeard 的飞行剖面是否满足严格的 Mach 5+ 持续高超音速定义；这个标准决定它能否进入 DoD 预算线。
        - The War Zone 关于 Army 预算文件的报道（June 2025），其中指出“Blackbeard 究竟会如何达到高超音速尚不清楚”。
        - Castelion 发布经验证的飞行性能数据，确认作战测试弹实现持续 Mach 5+ 弹道。
    notes: 投资逻辑和反向逻辑各行仅基于公开证据。私有技术、财务和合同数据可能实质改变任何一行。
