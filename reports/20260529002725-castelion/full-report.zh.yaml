      - number: '3.6'
        title: 附录
        blocks:
          - type: callout
            title: 单枚价格的结构性优势是主要护城河
            body: >
              Castelion 对每枚 Blackbeard 导弹的目标价格约 ~$384,000，比 Lockheed Martin ARRW 便宜 40× 以上，比海军 Conventional Prompt
              Strike 滑翔体便宜 100× 以上。这不是边际成本优势——它从根本上改变了一个航母舰载机联队能携带多少导弹、一次交战中能消耗多少导弹，以及 DoD 预算如何分配到高超音速威慑。若 Castelion
              能以这个价格点实现量产，当前没有竞争对手能在不彻底重塑采办和制造模型的情况下匹配。
            calloutType: strength
            claimRefs:
              - CP002
              - CP006
              - CP011
              - CP024
          - type: callout
            title: 生产规模尚未在单位成本目标上得到验证
            body: >
              截至 2026 年 5 月，Project Ranger 仍在建设中，尚未以 $384,000 目标成本生产作战导弹。DoD 框架协议以 Castelion
              通过测试和验证为前提，之后采购交易才会正式化。若首批作战批次生产成本超过目标，或测试失败出现，12,000+ 枚导弹的需求信号可能延迟或缩小。在把 Castelion
              护城河视为耐久之前，这是必须监测的核心执行风险。
