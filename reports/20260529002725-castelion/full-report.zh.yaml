      - number: '3.3'
        title: 新进入者与相邻竞争对手
        blocks:
          - type: paragraph
            body: >
              Pentagon 2026 年 5 月的 Low-Cost Containerized Missile (LCCM) 项目，催生了一个新的巡航导弹创业公司竞争集群——Anduril、Leidos、CoAspire
              和 Zone 5 Technologies——目标是在三年内交付至少 10,000 枚低价亚音速巡航导弹。这些公司不是 Castelion
              的直接高超音速竞争对手；它们的武器以亚音速或低超音速飞行，设计目标是低成本可消耗的饱和打击，而不是靠抵达速度和突防能力穿透现代防空系统。不过，它们会争夺 DoD 预算、项目办公室注意力和工业基础产能。


              Anduril 的 Barracuda-500M 是一款为 LCCM 项目设计的地面发射巡航导弹；Anduril 计划把产能扩到每年 1,000 枚，并在 2027 年初交付第一批。Anduril
              已披露把其技术延展到高超音速飞行包线的野心，并在 2026 年发布过 R&D 岗位，但还没有确认进入项目的高超音速武器。Leidos 正在扩大其 Black Arrow (AGM-190A) LCCM
              变体产能，承诺 3,000 枚。CoAspire 提供其 GHOST 巡航导弹（RAACM-ER 变体）。Zone 5 Technologies 也参与其中，但尚未公开披露其 LCCM 武器。


              Castelion 本身出现在 DoD 更广泛的 LCCM 相邻公告中：Department 正在寻求授权和拨款，以在五年内通过单独框架协议购买 12,000+ 枚 Blackbeard 高超音速导弹。DoD
              明确表示，Castelion 的项目类别不同于 LCCM 参与者（高超音速 vs. 巡航）。Hermeus 和 Stratolaunch
              是高超音速试验台和可重复使用飞行器项目，不是进攻性打击武器；它们是高超音速技术生态的供应商，而不是竞争对手。Kratos Defense 获得过高超音速子系统合同，但截至 2026 年 5
              月，没有列装与之竞争的高超音速打击武器。
            claimRefs:
              - CP014
