      - - 陆军 HIMARS 旅：在 500–1,000 km 射程内精确打击时间敏感移动目标
        - PrSM Inc 1（射程 ~500 km，$1.6M/AUR）或 ATACMS（亚音速，射程有限）；没有可负担的高超音速选项
        - 从 HIMARS 发射舱发射 Blackbeard GL；射程约为 PrSM Inc 4 的 80%；末段 Mach 5+；估计原型 <$7M/AUR， 规模化目标 <$300K
        - 在 HIMARS 后勤足迹内提供高超音速速度；C-17 可装载 4 辆满载 HIMARS，而 LRHW 受拖车约束
        - Blackbeard GL 当前原型阶段单位成本显著高于 $300K；陆军列装不会早于 FY2028
      - - 海军 F-35C：内埋挂载隐身高超音速打击防御目标
        - 美国库存中没有适用于 F-35C 的内埋挂载高超音速选项
        - Blackbeard 设计为可在 F-35C/A 内部弹舱携带 4 枚 AUR；保留低可探测外形
        - F-35C 首款内埋挂载高超音速武器；支持对高价值目标隐身打击
        - 截至 2026 年 5 月，F-35C 内埋挂载仍是设计要求，不是已演示或已签约能力
