      - 状态（2026 年 5 月）
      - 范围
      - 缺口 / 尽调问题
    rows:
      - - NAVAIR NOSSA / WSESRB 安全认证（舰载航空）
        - 未完成；FY2026 预算调节资金中 $89M 专门用于认证成本
        - Blackbeard 获准在航母上存储、装载和飞行作业之前必须完成
        - 认证时间表和已识别失效模式未公开；这是 EOC 前最主要关口
      - - 飞行终止系统（FTS）认证（HIMARS）
        - 开发中；尚未取得 HIMARS 实弹发射所需靶场安全资质
        - DoD 靶场安全法规要求，任何测试中从 HIMARS 发射的火箭 / 导弹都必须具备该资质
        - FTS 认证位于美国陆军 Phase 2 MVP 飞行测试关键路径上
      - - ITAR 出口管制（Category IV）
        - 已生效；制导栈组件受 ITAR Category IV 管制
        - 适用于所有含 ITAR 管制技术的制导、导引头和航电组件
        - 任何 FMS 或盟国销售都需要 DTSA 审查；目前没有出口个案在办理
      - - 环境 / EHS 许可（Project Ranger）
        - 未完成；截至 May 2026，Sandoval County 许可流程仍在推进
        - 覆盖高氯酸铵处理、静态点火测试排放、地下水保护和 PFAS 泡沫使用
        - 社区反对和未决许可可能给 Project Ranger 投产带来进度风险
      - - 适航认证（F/A-18）
        - 进行中；April 2026 合同明确资助 F/A-18 的“系统安全评估和飞行试验”
        - 美国海军所有舰载空射武器在航母甲板作战部署前都必须取得该认证
        - 截至 May 2026，尚未完成舰载实弹测试
      - - MIL-SPEC / 生产资质认证
        - 未确认；项目仍处于原型（量产前）阶段
        - 根据 DoD 采办法规，原型转入生产状态前必须完成该认证
        - 没有公开文件披露 MIL-SPEC 认证流程或时间表
      - - 网络安全（RMF / CMMC）
        - 未公开披露或确认
        - 适用于所有处理受控非密信息的 DoD 承包商武器系统
        - 公开披露缺失是尽调缺口；需请求 DoD 网络安全评估状态
      - - 环境健康与安全（EHS）项目
        - Torrance, CA（总部）和 Rio Rancho, NM（建设中）均有运行中的 EHS 项目
        - 覆盖含能材料处理、复合纤维制造和消防协议
        - AP 灭火不使用水；CFO 在社区会议上确认采用疏散与围控策略
    notes: 所有合规状态评估均基于公开合同措辞、公司公告和政府预算文件。未审阅一手监管申报。未公开报道已确认安全事故。认证里程碑是合同交付项， 并非独立验证的成就。
