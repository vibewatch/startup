  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 Castelion 的影响
      - 尽调问题
    rows:
      - - 中国 DF-17 / DF-ZF 实战部署
        - 驱动
        - 当前生效
        - 美国高超音速采购紧迫性的核心政策依据；直接支撑项目优先级
        - 确认 DoD 威胁评估是否明确把 Blackbeard 级能力列为反制手段
      - - 俄罗斯 Kinzhal / Avangard / Zircon 作战系统
        - 驱动
        - 当前生效
        - 次要理由；强化国会两党对高超音速支出的共识
        - 核实俄罗斯威胁在多大程度上驱动大西洋与太平洋态势预算
      - - 伊朗冲突导致美国导弹库存消耗
        - 驱动
        - 2025–2026 紧迫性
        - 加快近端采购时间表；让 10,000+ 枚导弹计划具备政治可行性
        - 确认实际库存水平，以及 Blackbeard 是否符合补库存弹药资格
      - - Arsenal of Freedom / DoD 采办转型
        - 驱动
        - 2025–2028
        - 政策顺风；其他交易授权为新进入者拿掉传统采办障碍
        - 评估政治领导层更替后的持续性；OTA 合同可能遭到质疑
      - - 低成本量产要求（$384K 目标）
        - 驱动
        - 2026–2031
        - Castelion 相比传统厂商拥有结构性市场优势；后者沿用的成本结构高得多
        - 核实 $384K 目标是否为固定总价，生产阶段是否不受成本上涨影响
      - - 高超音速材料 / 热防护供应链约束
        - 约束
        - 2026–2028
        - 可能拖慢 Project Ranger 爬坡，并让产量低于需求；可获取市场（SOM）兑现面临关键风险
        - 审计热防护材料、SRM 推进剂和导引头组件供应商名单
      - - 高超音速试验靶场能力稀缺
        - 约束
        - 持续
        - 拖慢认证节奏；任何靶场排期失败都会推迟 EOC 和采购
        - 审查 Castelion 的试验靶场预留协议和备用靶场选项
      - - 海军适航认证流程
        - 约束
        - 2026–2027 关口
        - 最关键的近端单一关口；失败或异常可能让采购推迟 12–24 个月
        - 确认安全审查状态，以及 FY2026 测试活动中是否仍有未关闭异常
      - - 国会对 12,000 枚多年采购的授权
        - 约束
        - FY2027 NDAA 周期
        - 尚未解决；DoW 框架需要拨款，但尚未通过国会
        - 跟踪 NDAA FY2027 标记文本中 Blackbeard 多年采购措辞
      - - ITAR / 出口管制制度
        - 约束
        - 持续
        - 若无豁免，将限制供应商池多元化，也限制对盟友的潜在 FMS 销售
        - 评估是否有任何子系统来自受限司法辖区
      - - 军控 / 升级风险政策担忧
        - 约束
        - 初现
        - 未来可能形成政治逆风；军控倡议在 SASC 层面获得更多关注
        - 监测国会听证记录中反高超音速扩散情绪
      - - 传统主承包商适应低成本要求带来的竞争
        - 约束
        - 2027–2030
        - Lockheed、Raytheon 可能重组投标方案或收购新进入者，在下一轮类 MACE 项目周期竞争
        - 关注 Lockheed 或 Raytheon 是否收购高超音速初创公司，或提交新的低成本投标
    notes: 时点标签为定性判断。驱动/约束分类反映 Castelion 截至 2026 年 5 月的市场位置。尽调问题是仅靠公开来源无法解决的开放项。
