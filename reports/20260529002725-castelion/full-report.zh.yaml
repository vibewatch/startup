      - number: '4.3'
        title: 资本充足性与资金跑道
        blocks:
          - type: paragraph
            body: >-
              Castelion 自 2022 年 11 月成立以来，五轮融资累计约 $504M。2025 年 1 月完成的 A 轮约 $100M，其中 $70M 为股权融资，由 Lightspeed Venture
              Partners 领投，Andreessen Horowitz、Lavrock Ventures、Cantos、First In、BlueYard Capital、Interlagos 参投；另有 Silicon
              Valley Bank 提供的 $30M 风险债务。2025 年 12 月完成的 $350M B 轮由 Altimeter Capital 和 Lightspeed Venture Partners
              领投，Andreessen Horowitz、General Catalyst、Lavrock Ventures、First In、Space VC、Cantos、BlueYard、Avenir、Champion
              Hill、Interlagos 参投。B 轮后估值约 $2.8B。已披露最大资本投向是 Project Ranger：位于 New Mexico 州 Rio Rancho（Sandoval County）的
              1,000 英亩固体火箭发动机制造园区，私人投资 $220M。Project Ranger 于 2026 年初开工，首栋建筑计划 2026 年夏季交付，全部 21 栋建筑预计 2026
              年底完工并具备投产条件。该设施将创造 300 个高薪岗位，预计十年内带来 $650M 经济产出。每月烧钱速度、B 轮之外的账上现金、剩余项目融资需求均未公开，构成重大承销缺口。以 2026 年 5
              月报告日往前六个月完成的 $350M B 轮，加上海军和陆军合同带来的并行收入爬坡看，资本充足性足以支撑至少 12–18
              个月运营；但导弹制造和工厂调试资本开支重，下一轮融资事件或量产合同里程碑将决定长期现金跑道。
