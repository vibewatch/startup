      - number: '1.4'
        title: 产品、合同与里程碑
        blocks:
          - type: paragraph
            body: >-
              Castelion 的旗舰产品 Blackbeard 是一款带导引头的精确高超音速打击武器，从一开始就按大规模生产、低成本和快速部署来设计。该武器可集成到现有平台，包括 M142 HIMARS 与 MLRS
              弹药发射器家族（Blackbeard GL，地射型），也包括海上和空射配置。面向 F/A-18 Super Hornet 的空射型估计射程约 497 英里（800 km），速度超过 Mach
              5。该武器设计目标是以显著更低的单位成本，提供 Precision Strike Missile (PrSM) Increment 4 约 80% 的能力；陆军目标是每枚数百万美元个位数，而传统高超音速武器每枚为
              $40M 或更高。2025 年，Castelion 完成超过 20 次开发飞行测试，验证了内部制造的固体火箭发动机、控制作动系统、飞行计算机、导引头、热防护材料和任务软件。公司 2025 年生产了超过 50
              枚测试导弹。关键政府关系包括与美国海军、美国空军和美国陆军的活跃合同。2025 年 10 月，陆军和海军授予 Blackbeard 与作战平台集成的合同。2026 年 2 月，海军授予一份 $49.9M
              合同，用于 F/A-18 集成和原型开发，工作预计持续到 2027 年 11 月。2026 年 4 月 24 日，美国海军授予 $105M 合同，将 Blackbeard 集成到 F/A-18 Super
              Hornet，并在 2027 年过渡到 Early Operational Capability。美国陆军 FY2026 预算申请为 Blackbeard GL 项目（代号 HX3）分配 $25M，计划在
              FY2026 早期开展原型概念验证演示，随后交付 10 枚用于 HIMARS 飞行测试的最小可行产品原型。若成功，陆军最早可在 FY2028 开始接收量产 Blackbeard 导弹。截至 2025 年 12
              月，政府合同总额超过 $100M。Project Ranger 是公司位于新墨西哥州 Rio Rancho 的 1,000 英亩固体火箭发动机制造和总装园区，已于 2026 年 1 月 21
              日破土动工；项目代表超过 $220M 私人投资，预计创造 300+ 个高薪岗位，并在十年内为新墨西哥州带来约 $650M 经济影响。第一栋建筑预计 2026 年夏季完工，全部 21 栋园区建筑预计到 2026
              年底投入运营。
