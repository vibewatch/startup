        - 导引头分辨率、捕获距离和抗对抗能力未确认；受出口管制
      - - FPGA 航电（Vitis HLS）
        - 高速信号处理、传感器融合和实时控制执行；可重构硬件
        - AMD/Xilinx FPGA 硅片；Vitis HLS HLS 工作流（公司招聘信息）；Allen, TX 工程中心
        - 商用 FPGA 未抗辐射加固；高空 EMP/EMI 脆弱性未公开评估
      - - GNC 嵌入式软件
        - 惯性 + 天文中段导航；GNC 算法执行；HIL 仿真验证
        - 内部开发；实时嵌入式 OS；从固件到应用层的全栈
        - DO-178C（或 MIL 等同）软件资质未确认；GNC 模型保真度缺口未披露
      - - 热防护系统（TPS）
        - 保护鼻锥免受 2,400°C 以上气动热载荷；防止烧蚀导致制导漂移
        - 内部制造硅化碳-碳；热压罐来自火箭喷管工装积累
        - 当前良率 ~70%；Project Ranger 产率扩张未经验证；特种材料供应存在风险
      - - 飞行终止系统（FTS）
        - 飞行器偏离计划弹道时终止飞行；HIMARS 测试的靶场安全要求必须具备
        - 开发中；必须满足 DoD 针对 HIMARS 集成的靶场安全要求
        - FTS 资质是陆军 HIMARS 实弹测试的关键路径依赖
      - - 火控接口（开放架构）
        - 接收来自陆军 AFATDS、海军陆战队 MAGTF AFATDS 和 Joint Fires Network 的数字化火力呼叫
        - 开放接口按兼容性设计；据称已通过 Joint Fires Network 台架测试（基础 CFF 脚本）
        - 任何实弹环境中均未确认完整端到端集成和作战适用性测试
      - - 制造执行系统（MES）
        - 跟踪从子装配到最终集成的生产流、工艺路线和库存
        - NetSuite 库存管理；Manufacturo MES（或可比系统）；据招聘信息
        - MES 在 Project Ranger 产量下的规模成熟度未经验证；存在 ERP/MES 集成风险
    notes: >-
      架构条目来自公开公司材料、政府预算文件和 Castelion 招聘信息，后者作为开发者信号代理。 关键组件（推进剂、EO 探测器、FPGA 变体）的具体供应商名称未公开披露。截至 2026 年 5 月，所有架构元素均处于 EOC
      前原型阶段。
