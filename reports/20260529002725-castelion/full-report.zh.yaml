  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 阶段 / 描述
      - 收入 / 指标
      - 估值 / EV
      - 收入倍数
      - 与 Castelion 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Defense tech private and public comparables identified in May 2026 sources with known revenue and valuation;
        excludes undisclosed private rounds and non-hypersonic defense startups.
    rows:
      - - Anduril Industries
        - 后期私营公司（Series H，May 2026）；多域自主防务平台
        - $2.2B 2025 追踪收入；~110% 同比增长
        - $61B（Series H 轮）
        - ~27.7×
        - 最强的私营可比公司：SpaceX 背景创始人、硅谷 VC 联合领投（a16z）、合同规模快速放大；最接近 Castelion 投资人画像的估值基准。
        - Anduril 具备软件平台杠杆（Lattice）、多条产品线，以及 $20B Army 企业合同 —— 收入基数和护城河都明显大于当前阶段的 Castelion。
      - - Shield AI
        - 后期私营公司（Series G，March 2026）；面向军机和无人机的 AI 自主能力
        - $540M+ 预计 2026 收入；80%+ 同比增长
        - $12.7B（Series G 轮）
        - ~23.5× 预计收入
        - VC 投资人画像相近（Advent、JPMorgan）；最近一轮定价体现类似防务科技溢价；说明投资人愿意给硬件导向防务公司高倍数。
        - Shield AI 收入基数约为 Castelion 当前估计的 10×，客户覆盖多平台，还具备软件护城河（Hivemind AI pilot）；它不是单一武器制造商。
      - - Hermeus
        - 早期增长公司（Series C，April 2026）；高超音速飞机创业公司，收入前阶段
        - 收入前；$350M Series C；首次飞行测试 March 2026
        - $1B（Series C 轮）
        - N/A（收入前）
        - >-
          最直接的技术类比：高超音速飞行、SpaceX / 防务科技投资人基础（Khosla、Founders Fund、RTX Ventures）、量产前阶段。Hermeus 估值 $1B 说明高超音速原型溢价存在，但
          Castelion 相对 Hermeus 的 3× 溢价来自其政府合同管线。
        - 最终产品不同（可重复使用飞机 vs. 一次性导弹）；Hermeus 没有生产合同；估值并非基于收入。
      - - Kratos Defense & Security Solutions（KTOS，可比公司）
        - 上市中型防务公司；无人系统、火箭推进、高超音速子系统；硬件制造画像可比
        - $1.347B FY2025 收入；16.6% 有机增长；FY2026 指引 $1.595–1.675B
        - ~$12.6B EV（2026）
        - ~9.4×
        - 规模路径的最佳上市可比：同样是非传统防务承包商，按政府需求扩张硬件制造；9–12× EV/收入倍数为 Castelion 量产爬坡后作为上市公司可能交易的位置提供上限。
        - Kratos 已盈利（FY2025 调整后 EBITDA $119.9M），有多条产品线和完全投产的制造基地。Castelion 目前一项都没有；Kratos 倍数可能高估 Castelion 当前公开市场价值。
      - - Lockheed Martin (LMT)
        - 上市防务主承包商；高超音速武器在位者（ARRW、CPS、LRHW 项目）
        - $75–77B 年收入；~$75B 市值
        - $137–141B EV（2026）
        - ~1.8×
        - 底部可比：展示 Castelion 若最终成长为成熟、盈利、规模化防务制造商时可能交易的位置；当前阶段不适用。
        - 成熟业务增长稳定，政府关系经营数十年；ARRW 重启（FY2026 $387M）让 LMT 成为直接竞争威胁，而不只是可比公司。
      - - Raytheon Technologies (RTX)
        - 上市防务主承包商；HACM 高超音速巡航导弹开发方；Pratt & Whitney 航空发动机
        - $86.5–87B 年收入指引（2025）
        - ~$261B EV（2026）
        - ~3.0×
        - 大型防务主承包商的底部可比；HACM 项目是直接竞争的高超音速项目。
        - 集团含民用航空业务；不是纯防务科技创业公司可比对象；HACM 延迟显示在位者执行风险，Castelion 目前尚未承担同类风险。
      - - Northrop Grumman (NOC)
        - 上市防务主承包商；Conventional Prompt Strike（CPS/Dark Eagle）项目；B-21 轰炸机
        - ~$42B 年收入（2025）
        - ~$96B EV（2026）
        - ~2.3×
        - 底部可比；CPS/Dark Eagle 单价 $41M，是 Castelion 试图压低成本的战略替代方案。
        - CPS/Dark Eagle 是独立的战略射程项目，不是战术打击替代品；Northrop 倍数不适用于早期量产公司。
    notes: 私营公司收入倍数基于新闻和分析师来源报道或预测的数字；私营估值数据不包含优先权包袱或稀释后股权结构细节。上市公司倍数为 May 2026 的企业价值 / 过去或未来收入。
