      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              Castelion 由三名前 SpaceX 成员共同创立，三人的能力彼此互补。CEO 兼联合创始人 Bryon Hargis 此前任 SpaceX Government Sales
              Director，负责国家安全卫星项目，并搭建出数十亿美元规模的防务管线。他拥有 Johns Hopkins University 应用物理硕士和 Georgia Tech 机械工程学士学位。COO 兼联合创始人
              Sean Pitt 曾负责 SpaceX 欧洲商业发射和载人航天销售，执行过超过 $1.25B 的出口交易，对复杂国际防务销售和运营理解很深。CFO 兼联合创始人 Andrew Kreitz 曾负责 SpaceX
              发射预测和政府成本方案，此前任 Goldman Sachs Vice President，专注航空航天与防务并购，使公司罕见地同时具备财务纪律和防务项目经验。三人均于 2022 年 11 月离开
              SpaceX，共同创立 Castelion。此后，领导团队吸纳了来自 SpaceX Falcon 9 和 Dragon capsule 项目的资深工程师和运营人员，也包括 Lockheed
              Martin、Raytheon 等传统承包商的老兵。董事会结构没有公开披露。Castelion 的投资方——包括 Altimeter Capital、Lightspeed Venture Partners 和
              Andreessen Horowitz——可能按其投资份额拥有董事会观察员或董事席位，但公开来源尚未证实。考虑到创始团队在政府关系管理和公司早期运营成熟度中的核心作用，关键人物依赖偏高。
