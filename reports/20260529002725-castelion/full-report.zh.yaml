  - id: FV002
    title: 估值对收入倍数的敏感性
    type: bar
    layout: standard
    summary: >-
      以 $51.5M 过去十二个月收入估计为基准，套用不同收入倍数，得到 Castelion 的隐含企业价值；区间从 Kratos 水平（9.4×）到当前 Series B
      轮隐含倍数（~54×）。图中显示当前入场价高出同业基准多少。
    data:
      items:
        - label: 9.4×（Kratos/KTOS 上市）
          value: 484
        - label: 15×（保守防务科技）
          value: 773
        - label: 23.5×（Shield AI Series G 轮）
          value: 1210
        - label: 27.7×（Anduril Series H 轮）
          value: 1426
        - label: 35×（中档偏高）
          value: 1803
        - label: 54×（当前 Series B 轮隐含）
          value: 2781
    approximationNotes: >-
      所有数值均为 USD 百万美元；按列示倍数乘以 CompWorth、Growjo 和 GetLatka 聚合器给出的 $51.5M 过去十二个月收入估计得出。收入估计来自第三方，未经 Castelion 验证。同业倍数基于截至
      May 2026 的最近一轮融资或市值数据。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV027
  - id: FV003
    title: 估值与回报区间：乐观 / 基准 / 悲观
    type: range
    layout: wide
    summary: 三种情景路径下的退出估值区间，以及相对于 $2.8B Series B 入场价的隐含回报；退出窗口采用 2029–2030，收入倍数假设与可比公司组一致。
    data:
      items:
        - label: 悲观情景退出估值（USD 百万美元）
          low: 1000
          high: 2000
          mid: 1500
          detail: 测试失败或生产延迟；到 2027 仍没有生产合同收入；降价轮隐含估值 $1–2B。按 $2.8B 入场价计算，回报 (0.64×) 至 (0.36×)，即资本亏损 36–64%。
        - label: 基准情景退出估值（USD 百万美元）
          low: 5000
          high: 8000
          mid: 6500
          detail: >-
            DoW 框架转化；到 2027 爬坡至 500–1,000 枚导弹 / 年；需要 Series C 轮；2029–2031 IPO 或战略退出。按 $2.8B 入场价计算，回报 1.8× 至 2.9×（5–6 年隐含
            IRR ~13–22%）。
        - label: 乐观情景退出估值（USD 百万美元）
          low: 15000
          high: 37000
          mid: 22000
          detail: >-
            DoW 框架完全转化；到 2030 达到 3,000+ 枚导弹 / 年；基于 $1.5–2.5B 远期收入，以 10–15× 倍数 IPO。按 $2.8B 入场价计算，回报 5.4× 至 13.2×（4–6 年隐含
            IRR ~35–55%）。
    approximationNotes: >-
      所有估值都是情景模型估计，并非公司指引或分析师目标价。退出倍数基于截至 May 2026 的 Anduril/Shield AI/Kratos 可比公司组。Series C 轮（基准情景）带来的摊薄估计为
      15–25%，未计入上方隐含回报；实际回报会因摊薄幅度而下降。
    claimRefs:
      - CV019
      - CV031
      - CV032
      - CV035
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: compact
    summary: 投委会可用的八个投资维度评分（1–10 分），重点权衡市场验证、执行证据和风险调整后估值。评分仅基于公开证据做定性合成；如果拿到私有数据，财务健康度和生产经济性分数很可能上下调整。
    data:
      items:
        - label: 市场规模与资金支持
          value: 9/10
          description: $3.9B FY2026 DoD 高超音速预算；$8.6B 全球市场，CAGR >10%；DoD 寻求 5 年内获得 12,000+ 枚导弹。需求强、资金到位且持续性高。
        - label: 管理层质量
          value: 8/10
          description: 三名 SpaceX 老兵，在政府销售、国际交易和航天 M&A 上有执行履历。防务制造初创公司中，<3 年完成 25+ 次飞行测试几乎没有先例。
        - label: 客户验证
          value: 7/10
          description: 已执行海军合同 $155M+，另有 DoW 框架；陆军专项拨款 $25M；单一客户集中（100% DoD）是原始合同额没有体现的风险。
        - label: 竞争护城河
          value: 7/10
          description: 在低成本空射高超音速制造上先发；Project Ranger 构成持久产能壁垒；SBIR Phase III 奖项提供竞争隔离。ARRW 复活削弱独占性。
        - label: 产品成熟度
          value: 6/10
          description: 25+ 次开发飞行测试；已获 MACE 集成合同；印太战区实弹测试待完成。高超音速说法尚未获独立确认；生产代表性设计尚未最终定型。
        - label: 商业模式耐久性
          value: 5/10
          description: 生产跑通后，固定总价合同上的纯政府收入质量较高；但 100% 客户集中和未经验证的生产毛利率是实质风险。
        - label: 财务健康度
          value: 4/10
          description: 毛利率、烧钱速度和 P&L 均未披露。累计融资 $504M、估计收入 $51.5M，意味着近期自我造血能力有限。除运营烧钱外，Project Ranger 还需要约 $220M 资本开支。
        - label: 估值合理性
          value: 3/10
          description: ~54× 过去十二个月收入，而 Anduril 和 Shield AI 为 23–28×；需要非约束性生产框架零失误落地。可比公司组中最偏高的入场倍数。
    approximationNotes: 评分为定性判断（1–10 分），基于截至 May 2026 的公开证据；不是精算结果，也未经公司验证。不同报告或公司之间不可直接比较。拿到私有财务数据后，财务健康度和商业模式耐久性分数很可能大幅变化。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV023
      - CV026
      - CV040
      - CV041
