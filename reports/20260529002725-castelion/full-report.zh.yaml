      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              多个分析口径都指向一个结论：全球高超音速武器市场 2025 年约为 $7.82B，2026 年增至 $8.64B，复合年增长率 10.5%，预计到 2030 年达到 $12.76B（The Business
              Research Company）。Mordor Intelligence 给出的更宽口径把超音速和高超音速细分合并计算，认为 2026 年合计市场为
              $22.77B；这个数字方法不同，会高估纯高超音速机会。Fortune Business Insights 估计，高超音速导弹子细分（不含滑翔飞行器）2026 年为 $6.56B，并在 2030 年代早期前按
              13.3% CAGR 增长。

              美国是最大的单一国家市场。Market Research Future 估计，美国高超音速武器细分市场 2025 年约为 ~$2.8B，到 2035 年增至约 $8.5B，CAGR 约
              ~11.7%。北美整体约占全球高超音速采购的 50–60%，几乎完全由 DoD 支出支撑。FY2026 DoD 预算专门为陆军、海军和空军的高超音速项目分配约
              $3.9B，进一步确认美国作为买方的主导地位，也验证了总可用市场（TAM）区间。

              Castelion 的可服务市场（SAM）是 Blackbeard 在技术和项目层面有资格参与的 DoD 采购项目集合。最清晰的近端锚点是海军 MACE 项目：FY2027–2031 年采购 4,500
              枚空射高超音速导弹，平均单价约 ~$384,000，对应隐含约 ~$1.6B 的采购块。再叠加美国战争部框架协议（五年内 12,000 枚 Blackbeard 导弹，每年至少 500
              枚；价格尚未公开确认，但隐含接近 $350,000–$384,000/枚），若所有采购选项都执行，SAM 约为 $5.5–6.1B。陆军集成支出（FY2026 预算中用于 HX3/HIMARS 工作的
              $25M）规模更小，也更早期。Castelion 在 2026–2028 年窗口的可获取市场（SOM）受自身制造爬坡约束：Project Ranger（新墨西哥州 Sandoval County）目标到 2027
              年底每年生产数千枚导弹；若 FY2027 MACE 第一批 353 枚（$156M）执行，且 DoW 框架启动，则 2027 年 SOM 隐含约 $300–500M。这些数字来自公司暗示，无法用公开数据独立确认。
