      - number: '7.4'
        title: 合作伙伴、供应链与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 的供应链存在结构性单点故障：American Pacific Corporation（AMPAC）是美国国内唯一大规模航空航天级高氯酸铵供应商。截至 2026 年 5
              月，美国没有第二家达到规模的 AP 供应商。多个导弹项目并行拉动需求——HIMARS 补充、THAAD、Tomahawk、PAC-3，以及新的 DoW Arsenal of Freedom 倡议——已经拉紧 AP
              供应。美国战争部于 2026 年 1 月承认这一脆弱性，并向 L3Harris Missile Solutions（原 Aerojet Rocketdyne）进行 $1 billion
              直接股权投资，以扩充固体火箭发动机产能；但该投资解决的是 SRM 装配产能，而不是直接解决上游 AP 瓶颈。Castelion 垂直整合的 Project Ranger 旨在减少外部 SRM 采购，但仍依赖
              AMPAC 供应 AP 原料。客户侧，Castelion 收入几乎 100% 集中于美国政府合同，未披露商业或盟国分散化。公司与美国战争部的条件性生产框架协议要求在下达生产订单前另行获得国会拨款；预算封存、CR
              持续决议或 DoW 优先级转移，都可能延迟或减少订单量。DoD 飞行测试靶场也是进度依赖项，因为靶场可用性会拖延里程碑达成和合同转化时间线。
