      - number: '6.2'
        title: 美国海军：MACE 项目与舰载机联队采用
        blocks:
          - type: paragraph
            body: >-
              美国海军是 Castelion 的主导客户，也是近期合同收入的主要驱动。Naval Air Systems Command（NAVAIR）最早在 2024 年 2 月通过 Multi-mission
              Affordable Capacity Effector（MACE）项目信息征询释放需求，寻找一种价格可承受、可由 F/A-18E/F Super Hornet 空射的防区外高超音速武器，并把 F-35A/C
              内埋携带作为目标能力。2026 年 4 月，Castelion 的 Blackbeard 被确认成为 MACE 项目选中的第一种武器。采购节奏异常快：初始 $49,998,005 合同（基于 BOA
              N6833526G0006 的订单 N6833526F1022）于 2026 年 2 月 25 日授予，在 SBIR Phase III 条款下资助全尺寸 Blackbeard
              原型、飞行测试和早期作战能力。不到两个月后，2026 年 4 月 24 日，海军执行 $104,998,566 合同修改（P00001），资助最终集成要求、系统安全与适航认证，以及 Indo-Pacific
              Command 责任区内的实弹测试活动，确认海军的作战战区优先级和持续承诺。截至 2026 年 4 月，已执行海军合同累计达到 $154.9M。2026 年 4 月发布的 Pentagon
              预算文件显示，海军计划未来五年为 F/A-18E/F 机队采购 4,500 枚 Blackbeard 导弹，平均单价约 $384,000。FY2027 采购规划明确为首个生产批次 353 枚导弹拨出
              $156M。后续批次明显放大：FY2028 目标 691 枚 AUR，FY2029 目标 976 枚 AUR，FY2030 目标 1,115 枚 AUR，FY2031 目标 1,375 枚
              AUR——这意味着海军预期 Blackbeard 会成为舰载机联队库存中数量最多的高超音速打击弹药。MACE 项目偏离传统高超音速采购路径：它结合其他交易授权与 SBIR Phase III
              固定价格合同，压缩时间线并减少行政负担。
