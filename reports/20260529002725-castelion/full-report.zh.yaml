  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 从市场规模、产品验证、客户证据、财务图景、风险画像到估值评估，证据链最后落到「观察」建议。每个节点概括该维度的关键证据和结论。
    data:
      nodes:
        - id: market
          label: 市场机会
          detail: 2026 全球高超音速武器市场 $8.6B，CAGR >10%；美国 DoD FY2026 高超音速拨款 $3.9B；DoD 寻求 5 年内获得 12,000+ 枚 Blackbeard 导弹。结论：强。
          tone: positive
        - id: product
          label: 产品验证
          detail: <3 年完成 25+ 次飞行测试；仅 2025 就有 20+ 次，验证 SRM、导引头、CAS、飞控计算机、TPS 和任务软件。公开来源尚未独立确认其高超音速说法。结论：推进中，但风险未完全消除。
          tone: neutral
        - id: customers
          label: 客户验证
          detail: 已执行海军合同 $155M+；陆军专项拨款 $25M；DoW 生产框架（最低 500+ 枚导弹 / 年）；没有商业客户（100% 集中于 DoD）。结论：强，但客户单一。
          tone: positive
        - id: financials
          label: 财务图景
          detail: 估计收入约 $51.5M；累计融资 $504M；Series B 轮 $350M（Dec 2025）；毛利率、烧钱速度和单位经济完全未披露。结论：未披露——重大尽调缺口。
          tone: negative
        - id: risk
          label: 风险画像
          detail: 高：单一客户（DoD）、生产框架尚无约束力、$220M 资本开支承诺、Project Ranger 遭社区反对、关键人物集中、ARRW 竞争项目复活。结论：高风险。
          tone: negative
        - id: valuation
          label: 估值评估
          detail: $2.8B / ~$51.5M = ~54× 过去十二个月收入；Anduril 和 Shield AI 在更大收入基数上分别为 27.7×、23.5×；Kratos 上市可比公司为 9–12×。结论：偏高。
          tone: negative
        - id: recommendation
          label: 建议——观察
          detail: 买入条件：生产合同转化，或披露毛利率 ≥20%，或入场价回落至 <35× 过去十二个月收入。持续跟踪否决触发项。
          tone: neutral
      edges:
