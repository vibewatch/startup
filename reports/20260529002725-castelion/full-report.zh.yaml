      - number: '5.3'
        title: 制造技术与 Project Ranger
        blocks:
          - type: paragraph
            body: >-
              Castelion 的制造打法把关键子系统垂直整合与借鉴商用航空航天的先进生产方法结合起来。公司内部加工发动机壳体、缠绕复合材料罩体、组装导引头电路板，并用多激光粉末床增材制造（3D
              打印）制造飞控翼面和航电线束支撑托盘，使每轮部件迭代的传统供应提前期缩短约 10 周。金属壳体和橡胶部件来自汽车产业供应商，而非传统防务供应商，以降低材料成本。企业资源计划运行在 NetSuite
              上，生产跟踪使用 Manufacturo MES（或可比制造执行系统）。行业来源称，热防护系统（硅化碳-碳鼻锥铺层）的制造良率约 70%，量产目标为 90%+。Castelion
              已部署额外铺层管线，在政府合同资金之外推进良率改善。2025 日历年，公司生产了 50 多件导弹样件，在 Project Ranger 投产前验证了高频硬件迭代策略。Project Ranger 是 New
              Mexico 州 Sandoval County（Rio Rancho）一座 1,000 英亩高超音速制造园区，私人出资 $220M（Reuters 报道为
              $250M）。该设施面向固体火箭发动机（SRM）制造、SRM 静态测试和最终武器总装。规划的 21 栋建筑目标在 2026 年底前全部完工，首栋建筑预计 2026 年夏季交付。满产后，Project Ranger
              设计为每年生产数千枚 Blackbeard 导弹，远高于海军 MACE 合同要求的 500 AUR/年下限。公司还在 Torrance, CA（总部）、Allen, TX（FPGA 工程）和 Midland,
              TX（推进与环境测试）运营额外制造和工程设施。
