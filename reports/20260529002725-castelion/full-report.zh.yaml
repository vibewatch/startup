      - number: '4.2'
        title: 单位经济模型与成本架构
        blocks:
          - type: paragraph
            body: >-
              Castelion 的商业逻辑押在一个主张上：在能力相近的情况下，成本比传统高超音速武器低 10x。美国陆军 PrSM Increment 1 单枚约 $1.6M，带双模导引头的 Increment 2 约
              $5.35M。美国海军 MACE 项目要求在年产至少 500 枚 AUR 时，每枚全备弹（AUR）目标单价低于 $300,000；如果做到，Blackbeard
              将明显成为美国库存里最便宜的远程高超音速打击武器。FY2027 海军早期采购规划为 353 枚导弹拨出 $156M，折合初始批次约 $442K/枚；学习曲线把成本拉向 $300K
              目标之前，这会是起点。支撑这套成本结构的是固体火箭发动机、控制执行系统、导引头、飞控计算机、热防护系统的垂直整合，以及把金属壳体和橡胶部件交给商用汽车产业供应商，避开传统防务供应链溢价。第三方数据估计人均收入约
              $515K；对资本密集型硬件制造商而言偏高，但反映的是早期合同结构，不是成熟毛利信号。毛利率、运营费用，以及量产规模下真实单件经济性均未披露。公司没有可用的一手财务报表；收入只来自政府，也没有公开可比的私人防务初创毛利基准。The
              War Zone 报道称，Blackbeard 的飞行剖面是否满足高超音速的严格定义仍有不确定性；这会影响成本对标，因为“高超音速”标签决定项目预算线和单枚采购上限。
