      - number: '8.6'
        title: 展板
        blocks:
          - type: callout
            title: 结构性政府需求是乐观情景的基础
            body: >-
              DoD 现有库存或近期采购管线里，没有 Castelion 这一价位的可负担、大批量、空射高超音速打击武器。2026 年 5 月 DoW 生产框架、2026 年 4 月 $105M Navy MACE 集成合同和
              FY2026 DoD $3.9B 高超音速拨款，共同构成美国防务创业公司在 Castelion 阶段拿到的最具体需求验证。2025 年 $29B 涌入防务科技的 VC 融资潮，以及 Altimeter
              Capital 与 Lightspeed 共同领投本轮，都说明投资者普遍认可采购改革周期真实存在。对于能承受 5–7 年持有期的投资者，满产后的可寻址收入足够大，即便以当前 $2.8B 进入，也能产生可观回报。
            calloutType: strength
            claimRefs:
              - CV015
              - CV017
              - CV018
              - CV021
              - CV037
              - CV044
          - type: callout
            title: 54× 收入倍数计入了尚不存在的量产经济性
            body: >-
              $2.8B Series B 估值只靠约 54× 历史估计收入倍数支撑——超过 Anduril 和 Shield AI 23–28× 交易区间的两倍，也接近 Kratos 9–12×
              公开市场倍数的六倍。该溢价押注量产收入，但前提是非约束性框架转成生产合同、$220M 工厂建设按期完成，且毛利率在从未于量产规模验证过的价格点跑通。The War Zone 和 Army 预算文件分别指出
              Blackbeard 的高超音速资质存在不确定性，而这是支撑其预算科目的定义性属性。以当前价格进入的投资者承担这三项执行风险，却没有从可比组获得任何安全边际。
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV023
              - CV024
              - CV026
              - CV027
              - CV028
          - type: callout
            title: 观察——三项条件可上调为买入
            body: >-
              观察建议反映出对团队、市场和政府背书的高信心，同时被偏高的进入倍数和重大未解风险抵消。至少确认以下一项后，建议可上调为买入：（1）DoW
              生产框架转成附带已承诺资金的有约束力多年采购合同，（2）披露并确认量产毛利率达到 20% 或以上，（3）后续融资或老股交易中进入估值回落到低于历史收入 35×。如果拥有 data room
              权限的投资者能同时确认有利的毛利率和生产合同转化，今天作出买入决策的基础会显著更强。
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV036
          - type: callout
            title: 防务科技倍数膨胀带来全行业压缩风险
            body: >-
              2025–2026 年防务科技 VC 周期推高了全行业倍数：2025 年投资额 $29B，接近 2020 年三倍，使 Anduril 在 12 个月内从 $14B 升至 $61B，Shield AI 同期从
              $5.3B 升至 $12.7B。Castelion 的 54× 倍数正是这一环境的产物。若采购改革停滞、防务预算增速放缓，或某家领先防务创业公司错过收入里程碑，全行业倍数压缩会影响包括 Castelion
              在内的所有私营持仓。PwC 和 S&P Global 都将其标记为这批公司的结构性风险：随着量产阶段公司成熟、公开市场投资者施加 EBITDA 纪律，防务科技倍数会向 Kratos 式水平压缩。
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV044
