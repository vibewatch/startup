      - number: '2.3'
        title: 买方与平台分层
        blocks:
          - type: paragraph
            body: >-
              美国防务采购体系形成了分层买方结构：政策决策层（Secretary of War、Under Secretary for Research and Engineering）、项目发起方（NAVAIR、Army
              Program Executive Office for Missiles and Space），最终是提出需求的作战部队。Castelion
              的直接付款方是美国政府，通过项目合同付款；现阶段没有商业客户、国际买方或中介分销商。国会授权和拨款，是项目意图转化为有资金支持合同之间的一道门槛。

              海军是最直接的买方细分。MACE 项目正式选择 Blackbeard 作为海军主要空射高超音速打击弹药，以 F/A-18E/F Super Hornet 为主要发射平台，F-35C
              为具备隐身能力的次级载机（内部挂载四枚）。采用触发点是完成适航认证和实弹集成测试，目标是在 2027 年达到 Early Operational Capability。预算权归 Assistant
              Secretary of the Navy for Research, Development and Acquisition。

              陆军通过 HX3/HIMARS Blackbeard Ground Launch 项目构成一个规模更小、并行的买方渠道。FY2026 为 HIMARS 和 M270 发射器上的概念验证与集成测试分配
              $25M。陆军的理由是，用更具成本效率的方案补充 Long Range Hypersonic Weapon（LRHW/Dark Eagle），以 LRHW
              单位成本的一小部分实现更广泛分布。这里的采用触发点，是固定翼飞行测试和 HIMARS 发射演示成功。

              Department of War 作为「Arsenal of Freedom」框架下的企业级买方，代表天花板最高但不确定性也最大的渠道。框架协议承诺每年至少 500 枚导弹，并寻求五年总计 12,000
              枚的授权；但资金必须由国会拨付，且本分析查阅的公开 FY2027 预算文件中，尚未出现完整 12,000 枚规模的具体拨款科目。
