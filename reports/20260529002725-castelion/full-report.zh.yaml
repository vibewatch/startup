      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              Castelion 的三条情景路径取决于两个二元结果：（1）2026 年 5 月 DoW 生产框架是否会在 FY2027 初转成有约束力的多年采购合同；（2）Project Ranger 是否能按已宣布的
              2026 年时间表达到额定产能。乐观情景下，两项条件都兑现：FY2027 MACE 采购批次（353 枚导弹、$156 million）之后立刻扩产，DoW 框架在五年内行使 12,000+ 枚导弹、单价
              $350–$442K 的完整期权。以这一产速，到 2029 年年收入可能达到 $1.5–2.5 billion，IPO 或战略退出可按 10–15× 远期收入落在 $15–37 billion 区间，相当于相对
              $2.8 billion Series B 价格 5× 到 13× 回报。基准情景中，生产框架完成转化，但爬坡慢于计划：2027 年每年 500–1,000 枚，2029–2030 年每年 1,500–2,500
              枚。收入达到 $250–700 million，并且需要以 $5–8 billion 估值完成 Series C，才能支持 Project Ranger 完工；上市退出前会产生 15–25%
              稀释。该情景下，Series B 价格的回报有限：五到七年 1.5–2.5×，符合防务科技中档结果。悲观情景中，测试失败、项目延误或预算重新分配阻碍框架按时转化。生产收入推迟到
              FY2028–2029，Series B 价格相对低于 $100 million 的收入基数显得昂贵，以 $1.5–2.0 billion 估值下轮融资的概率上升。基于当前证据，基准情景是众数结果；DoW 框架和
              2026 年 4 月 MACE 集成合同确认政府意图，乐观情景概率在上升，但工厂投产和实弹测试的执行风险仍然重大。
