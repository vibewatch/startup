      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自地缘政治：中国和俄罗斯已经部署实战高超音速系统（中国的 DF-17/DF-ZF，俄罗斯的 Kinzhal、Avangard 和
              Zircon），而大多数美国项目仍停留在开发或测试阶段。这个「战略缺口」已成为两党共同的政治优先事项，压缩了典型 DoD 采办周期，并释放 Other Transaction Authority
              机制以加快签约。「Arsenal of Freedom」理论明确把规模和低成本定义为威慑支柱，直接为 Castelion 以制造优先的路径提供政策顺风。

              次级增长驱动包括：近期高强度行动（包括 Pentagon 文件提到的伊朗冲突）消耗了美国导弹库存，带来规模化补库的紧迫性；DoD 表示的目标是从 2027 年起三到五年内采购超过 10,000 枚低成本巡航导弹和
              12,000 枚高超音速导弹；以及国会对防务现代化支持上升，推动支出从传统平台转向先进弹药。

              采用约束很显著，不应低估。材料可得性是近端瓶颈：高超音速热防护系统和先进复合材料需要专门供应链，而全球供应受限。测试基础设施稀缺——高超音速试验场排期很满，飞行测试节奏直接决定认证节奏。ITAR
              制度限制供应链多元化。舰载机集成认证是高门槛监管关口：海军适航认证流程旨在消除航母作业中的灾难性故障，任何测试异常都可能让采购推迟 12–24 个月。12,000
              枚导弹多年采购尚未获得国会授权，构成政策风险。最后，军控倡议人士和部分战略研究学者警告，高超音速快速扩散会增加升级误判风险；这一担忧可能在未来预算周期中制造政治逆风。
