      - number: '7.6'
        title: 缓释因素、放弃标准与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              尽管存在上述风险，Castelion 仍有几项结构性缓释：已签署的 DoW 生产框架协议提供每年 500+ 枚导弹的条件性收入可见性；陆军和海军多军种集成分散项目集中度；Project Ranger
              的垂直整合降低外部 SRM 依赖；SpaceX 校友团队已有高速执行记录；$464 million 融资提供现金跑道缓冲。本投资的投资逻辑破坏事件，是 Blackbeard 在 2026
              年陆军或海军资格活动中出现无法在 12 个月内恢复的明确测试失败，或国会在两个预算周期内未能为 DoW 生产订单拨款。New Mexico 法院对 Project Ranger 下达施工禁令，也会把生产时间线延长
              12–24 个月，并对投资逻辑产生重大影响。投资者应监控：Blackbeard 2026 年资格测试结果、Project Ranger 环境许可状态、DoW 生产合同转化日期及国会拨款、AMPAC 向
              Castelion 分配 AP 供应，以及任何创始人离职公告。下方放弃标准表列出需要在 30 天内重新评估投资逻辑的具体触发点。
