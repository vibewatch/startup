      - number: '6.5'
        title: 集中度风险、反向证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Castelion 的客户画像带有极端集中度风险：单一买方（美国战争部）贡献 100% 收入。在这一单一客户内部，美国海军是主导合同买方（已执行
              $154.9M），陆军和空军为次要买方。这对早期防务初创公司并不罕见，但尽调含义重大。第一，DoD 高超音速项目优先级、国会拨款或采办政策出现任何不利变化，都可能在一个项目审查周期内消除或大幅削减
              Castelion 的收入基础。第二，没有 NRR、GRR、流失率、客户满意度评分或商业留存指标可用；防务合同模式用合同修改和后续授标替代这些指标。截至报告日，Castelion 的“留存”记录完全正向：从
              2023 年空军 $1.77M SBIR 到 2026 年海军 $154.9M，每个参与军种都扩大了关系。反向社区证据与客户集中度并不在同一维度：New Mexico 州 Sandoval County 的
              Project Ranger 场址因居民担忧高氯酸盐污染、噪音和地下水风险，已引发有组织反对。2025 年 10 月和 12 月，数百人参加社区会议。militarypoisons.org
              的环境活动文章把该设施描述为潜在公共健康危机。虽然这不会直接威胁现有客户合同——客户是 DoD，不是社区——但它会带来监管、许可和声誉风险，可能延迟制造爬坡，进而影响生产合同履约。公开记录中，截至 2026 年
              5 月没有合同抗议、GAO 投标挑战或竞争性采购争议证据。

              独立分析机构 IPO Club 把 AUKUS 伙伴——Australia 和 United Kingdom——列为未来可能通过对外军售（FMS）获得的出口客户，从而把收入基础延伸到当前唯一买方之外。传统 DoD
              项目长期依赖过时工程实践，项目经理寻求商业级效率时，Castelion 具备结构性需求优势。不过，New Mexico 州 Project Ranger 设施遭遇社区反对，理由包括有毒化学品和 PFAS
              污染风险；如果监管障碍兑现，这会成为不可忽视的供应链风险，限制产能扩张。
