  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - 关键假设
      - 收入路径（2026–2030）
      - 退出时隐含估值
      - 概率信号
      - 关键下行触发项
    rows:
      - - 乐观
        - >-
          DoW 框架在 Q1 FY2027 前转化为有约束力合同；Project Ranger 按时；2028 年达到 1,000+ missiles/yr，2030 年达到 3,000+/yr；Army 和 Navy
          行使全部期权量；第二产品线开始贡献。
        - $221M (2027) → $884M (2028) → $2.2B+ (2030)，按 $442K/unit 和 5,000/yr 计算
        - $15–37B IPO 估值（10–15× 前瞻收入）；以 $2.8B Series B 入场价计，回报 5–13×
        - DoW 框架条款、MACE 采购批量和国会 FY2027 拨款都表明这一情景可达成——但尚无任何一项签约。
        - 若 DoW 框架到 Q2 FY2027 仍未转化为有约束力采购订单。
      - - 基准
        - >-
          DoW 框架在 FY2027 转化，但爬坡较慢；Project Ranger 到 2027 只达部分产能；2027–2028 年达到 500–1,000 missiles/yr；需要 Series C
          完成工厂并为营运资本爬坡供血。
        - $110–221M (2027) → $250–500M (2028) → $500–700M (2030)，按 $350–442K/unit 计算
        - $5–8B Series C 入场或战略退出估值；以 $2.8B 入场价计，5–7 年回报 1.5–2.5×
        - 政府需求已确认；制造风险是主要不确定性。
        - Project Ranger 滑期或营运资本挤压，迫使以更低估值做过桥轮。
      - - 悲观
        - 实弹测试失败或项目预算重新分配；DoW 框架在 FY2027 不转化；Project Ranger 延迟到 2026 之后；2027 没有生产收入。
        - 2027 年低于 $100M；没有生产合同则停滞；现金需要紧急过桥。
        - $1.5–2.0B（降价轮）；相对 $2.8B Series B 入场价资本损失 30–46%
        - 截至 May 2026 尚无确认测试失败；在位项目复活（ARRW FY2026 $387M）增加预算竞争风险。
        - MACE 实弹项目任何确认测试失败，或 FY2027 MACE 预算撤销。
    notes: 所有估值估计均为情景建模，非公司提供；收入估计假设单价为 $300K–$442K/AUR，与 MACE 项目文件和 DoW 框架意图一致。
