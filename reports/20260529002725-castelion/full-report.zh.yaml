        - 2 个预算周期内（FY2027–FY2028）未拿到已拨款生产合同
        - 降低仓位；要求管理层说明恢复路径
      - - 环境诉讼禁令
        - NM DOJ 投诉状态；针对 Project Ranger 的法院文件
        - 法院禁令或许可撤销导致施工或运营停摆
        - 重评时间线；12–24 个月延误会实质削弱投资逻辑
      - - 资格测试失败
        - 2026 Army HX3 和 Navy MACE 资格结果
        - 连续三次或以上测试失败，且没有可信技术恢复路径
        - 降低确信度；下次检查前要求恢复计划和更新时间表
      - - AP 供应中断
        - AMPAC 交付时间表对比 Project Ranger 生产爬坡
        - AP 交付延误超过 30 天并影响生产时间表
        - 要求管理层 30 天内给出第二来源计划
      - - 创始人离职
        - SEC 或媒体公告；投资人更新；LinkedIn 变动
        - 任一共同创始人（Hargis、Pitt 或 Kreitz）离职
        - 立即重评；30 天内向董事会询问继任计划
      - - 现金跑道耗尽
        - 合同里程碑时间对比披露的烧钱速度
        - 未签署有约束力生产合同时，现金跑道降至 12 个月以下
        - 要求更新融资计划；视为重大负面信号
    notes: 触发阈值由作者基于公开项目和融资数据估计；实际管理层看板和财务披露会让阈值更精确。除创始人离职（需要投资人更新权限）和现金跑道（需要管理层披露）外，所有触发项都可通过公开来源监测。
