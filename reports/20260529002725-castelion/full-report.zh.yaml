      - number: '6.3'
        title: 美国陆军：HX3 地面发射项目与 HIMARS 集成
        blocks:
          - type: paragraph
            body: >-
              美国陆军是 Castelion 的次要活跃客户，也是地面发射 Blackbeard 变体（Blackbeard GL 或 HX3）的驱动方。2025 年 5 月，陆军高层批准 Blackbeard GL
              紧急需求，指示 Rapid Capabilities and Critical Technologies Office 在新的 Common Autonomous Multi-Domain
              Launcher（CAML）项目框架下推进。陆军在 FY2026 预算中为 Blackbeard GL 开发拨出 $25M，并把项目设计为固定价格其他交易授权下的两阶段中层采办快速原型工作。Phase I
              要求使用政府提供的 MFOM pod 交付一次概念验证飞行，目标是在 2026 年 1 月至 3 月之间演示。Phase II 要求提供十枚生产代表性弹体，用于 HIMARS 发射飞行测试，目标在 FY2026
              结束前完成。陆军公布的目标，是以显著更低成本达到未来 Precision Strike Missile Increment 4 80% 的能力，在陆军高低搭配远程火力组合中填补“低端”层。陆军预算文件预计
              FY2027-2029 还将增加 $120M HX3 支出；如果 Phase II 测试成功，军种预计 2028 年初开始接收 Blackbeard 导弹用于部署。Blackbeard GL 被设计为兼容
              HIMARS 的过渡方案，CAML 则是远期年度的主要发射器。陆军承诺也体现在 Lt. Gen. Frank Lozano（Portfolio Acquisition Executive Fires）出席
              2026 年 1 月 Project Ranger 奠基仪式——这是高层客户参与超出合同文件的信号。Defense Aerospace 估计 Blackbeard GL 小批量初始生产单枚成本低于 $7M，而
              Long Range Hypersonic Weapon 超过 $40M；这一 6-8x 成本下降，是陆军弹药库存深度逻辑的核心。
