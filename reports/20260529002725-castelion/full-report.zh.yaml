  - id: FE001
    title: Blackbeard 武器系统架构——技术栈
    type: stack
    layout: wide
    summary: Castelion 垂直整合 Blackbeard 武器系统的全部六个核心子系统。技术栈从物理推进到任务软件逐层展开，显示每一层的内部设计 / 制造角色，以及关键依赖或风险。
    data:
      layers:
        - id: propulsion
          label: 固体火箭发动机推进
          sublabel: 2-stage (GL); ammonium perchlorate / aluminum powder; manufactured in-house in Torrance and Project Ranger
          role: Boosts weapon to Mach 5+ and sustains hypersonic flight; eliminates propulsion supply-chain markup
          status: validated
          detail: 内部设计和制造；已静态点火测试 20+ 台发动机；Project Ranger 将扩至每年数千台 SRM；TPS 鼻锥良率约 ~70%；批产目标约 ~90%。
          dependency: Ammonium perchlorate (commercial chemical); Project Ranger commissioning for volume
          risk: Environmental permitting at Project Ranger; perchlorate yield scale-up
        - id: thermal-protection
          label: 热防护系统（TPS）
          sublabel: Siliconized carbon-carbon nose tip; >2,400°C tolerance; autoclave-cured in-house
          role: Protects guidance hardware from aerothermal loads during hypersonic flight; prevents ablation wander
          status: in-development
          detail: 在由火箭喷管工装改造的小型高压釜中固化；良率约 ~70%（行业来源）；批产前目标 >90%；Castelion 在部署额外铺层管以提高良率。
          dependency: Specialty carbon-carbon precursor materials; autoclave capacity at Project Ranger
          risk: Yield gap is single largest manufacturing scale-up risk
        - id: cas
          label: 控制作动系统（CAS）
          sublabel: In-house design; controls aerodynamic surfaces during boost and glide
          role: Provides precise attitude control throughout flight; interfaces with GNC for steering commands
          status: validated
          detail: 已在 25+ 次飞行测试中验证；具体作动器供应商和交付周期数据未公开。
          dependency: Commercial/defense actuator motors; electronics from domestic supply chain
          risk: Supplier concentration not disclosed
        - id: seeker-gnc
          label: 多模态 EO 导引头 + GNC 系统
          sublabel: Inertial + celestial mid-course; EO terminal seeker; in-flight re-targeting
          role: Navigation and terminal guidance for moving and hardened targets; ITAR Category IV
          status: validated
          detail: 中段：惯性 + 天文更新。末段：多模态 EO 导引头，可在飞行中更新目标。飞行测试已验证移动目标跟踪。
          dependency: EO detector from defense supply chain (ITAR IV); GPS augmentation optional
          risk: ITAR IV export control limits FMS; countermeasure resistance not confirmed
        - id: fpga-avionics
          label: FPGA 航电（Vitis HLS）
          sublabel: AMD/Xilinx FPGA; Vitis HLS workflow; Allen TX engineering hub
          role: Real-time sensor fusion, actuator command, and flight-critical computation
          status: in-development
          detail: 根据招聘信息，FPGA 设计使用 Vitis High-Level Synthesis（HLS）流程。商用硅片（非抗辐射加固）相对航天级器件降低成本和交付周期。HALT/HASS 可靠性测试已启动。
          dependency: AMD/Xilinx FPGA supply chain; Vitis HLS software toolchain
          risk: Commercial FPGA not radiation-hardened; EMP/EMI vulnerability unassessed in public
        - id: flight-software
          label: 嵌入式飞行软件 + 任务栈
          sublabel: Real-time embedded OS; firmware to application; HIL simulation; GNC algorithms
          role: Executes navigation, GNC, health monitoring, mission management, and FTS arming/safing
          status: validated
          detail: 完整软件栈内部开发：嵌入式微控制器上的底层固件、操作系统、GNC 算法层和任务软件。已通过硬件在环仿真和 25+ 次飞行测试验证。MIL-SPEC 软件资质（DO-178C 或等效）未确认。
          dependency: Internal team; real-time OS vendor; test infrastructure
          risk: DO-178C qualification status unknown; cybersecurity assessment not reported
    approximationNotes: 层级细节综合自公司招聘信息（FPGA、GNC、嵌入式 SW 岗位）、公开 Series B 公告、政府合同措辞和防务报道。具体组件供应商和性能参数仍属专有。
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE012
      - CE013
      - CE014
      - CE029
  - id: FE002
    title: 客户工作流——高超音速打击任务执行
    type: flow
    layout: wide
    summary: 从威胁识别到 Blackbeard 投送，梳理作战流程，显示 Castelion 武器在各阶段的作用，以及与现有军事系统的集成触点。
    data:
      nodes:
        - id: threat-detect
          label: 威胁探测 / 瞄准
          detail: 情报、监视与侦察（ISR）系统——卫星、UAV、JTARS——识别时敏移动目标或加固固定目标。目标坐标传给火控。
          tone: neutral
        - id: fire-control
          label: 火控授权
          detail: >-
            Army AFATDS、Marine MAGTF AFATDS 或 Joint Fires Network 接收含目标坐标的数字火力呼叫。Blackbeard 开放火控接口接受标准 CFF
            脚本，不需要定制中间件。Navy 变体通过航母打击群 LINK-16 协同。
          tone: neutral
        - id: weapon-load
          label: 武器挂载 / 平台准备
          detail: >-
            Navy：Blackbeard 挂载在 F/A-18E/F 翼站（或未来 F-35C 内部弹舱）。航母甲板作业需要 NAVAIR NOSSA/WSESRB 认证（尚未完成）。Army：Blackbeard GL 装入
            HIMARS MFOM 发射箱；设计换装时间等同标准 GMLRS 发射箱更换（<8 min 目标）。
          tone: neutral
        - id: launch
          label: 发射（空中或地面）
          detail: >-
            Navy F/A-18：从航母或陆基机场空射。Army HIMARS：齐射能力为每个发射箱 2 发、每辆发射车 4 发；一个 8 具发射器的连可齐射 32
            发高超音速弹。CAML-M（未来）：乘员撤离；在卫星中继控制下自主发射。
          tone: positive
        - id: boost-glide
          label: 助推 / 高超音速滑翔阶段
          detail: >-
            固体火箭发动机燃烧约 ~12 seconds，将飞行器推至 Mach 5 以上。级间分离后，气动外壳脱落，楔形滑翔体沿低于传统弹道弧线的压低弹道飞行。中段采用惯性 +
            天文导航。速度和弹道轮廓把对手从发现到反应的周期从数分钟压到数十秒。
          tone: positive
        - id: terminal
          label: 末段制导与打击
          detail: >-
            多模态 EO 末段导引头在最终阶段捕获并跟踪目标。飞行中重定向支持时敏移动目标（TELs、ships、C2 vehicles）。声称 CEP <2 m、射程 600 km（设计目标来自
            defense-aerospace.com；未独立验证）。战斗部：75 lb（Navy）或 220 lb 单一 / 侵彻（Army GL 设计目标）。
          tone: positive
        - id: battle-damage
          label: 战损评估
          detail: 打击后 BDA 通过 ISR 完成。没有 Castelion 专属 BDA 技术；依赖现有联合 ISR 架构。弹药补给取决于 Project Ranger 产能（每年数千枚目标）和来自 NM 的物流链。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE009
      - CE010
      - CE024
      - CE025
