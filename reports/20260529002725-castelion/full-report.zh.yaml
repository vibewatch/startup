      - number: '2.5'
        title: 竞争格局与替代品
        blocks:
          - type: paragraph
            body: >-
              高超音速武器市场有两个清晰的竞争层级。既有主承包商层级——Lockheed Martin、Raytheon/RTX 和 Northrop Grumman——占据历史 DoD
              高超音速合同价值的大部分。Lockheed 以 ARRW 和 LRHW 项目领先；Raytheon 是 Hypersonic Attack Cruise Missile (HACM) 的主承包商；Northrop
              为多个项目提供关键子系统。这些在位者的竞争优势，在于长期项目关系、集成经验和涉密项目准入。

              Castelion 所在的新进入者层级，核心变量是速度和成本。在 MACE 项目中，Castelion 的 Blackbeard 已经入选，取代了包括已取消 HALO/OASuW Increment 2
              在内的传统项目。在 LCCM 巡航导弹项目中，另有四家新进入者（Anduril、CoAspire、Leidos、Zone 5 Technologies）持有并行 DoW 框架协议；如果高超音速 /
              巡航导弹边界变模糊，或国会把类似 MACE 的项目扩展到巡航导弹替代品，它们可能成为未来竞争对手。Anduril 尤其有深厚 VC 支持和广泛防务产品组合，可能支撑竞争性交叉销售。

              对 Castelion 最有利的结构性竞争动态，是海军明确否定在位者路径：已取消的 HALO 项目和 MACE
              项目的成本上限（~$384K/枚），实际上让传统高超音速主承包商无法以同等批量竞争，因为它们按成本设计的传统完全不同。这并不排除既有主承包商调整模式，或通过收购进入低成本高超音速细分市场；这仍是一个未解决的尽调问题。
