      - number: '7.2'
        title: 监管、法律与环境风险
        blocks:
          - type: paragraph
            body: >-
              Project Ranger 是 Castelion 位于 New Mexico 州 Sandoval County 的 1,000
              英亩固体火箭发动机生产设施，也是近期最复杂的风险簇。该设施将使用高氯酸铵（AP）、铝粉和含能添加剂制造并测试固体火箭发动机；同类美国防务场址已有充分记录的地下水污染遗留问题。West Mesa 下方的 Santa
              Fe Group 含水层为 Albuquerque Basin 约 100 万人供应饮用水；一旦被 AP 污染，修复成本高到难以承受，实际操作上也可能几乎不可能，Maryland 州 Naval Surface
              Warfare Center Indian Head 数十年的污染案例已经说明这一点。社区倡议组织 Common Ground Rising 已向 New Mexico Department of Justice
              和 GAO 投诉，称 Sandoval County 在没有依法举行公开听证、也没有充分环境审查的情况下批准了 Project Ranger LEDA 补贴。截至 2025 年 12 月，与 Sandia
              National Laboratories 合作的环境羽流研究仍未完成。取消危险建筑内喷淋和消火栓的消防规范豁免，也招致额外审视。Castelion 对所有 Blackbeard 技术数据承担持续 ITAR
              合规义务；FY2026 NDAA 和 Outbound Investment Security Program 明确把高超音速系统列为 CFIUS
              审查下的敏感技术类别，给未来每轮融资都增加投资者尽调要求。截至报告日，公开记录未确认针对 Castelion 的诉讼，但 NM DOJ 投诉可能通向施工禁令或许可撤销，实质性推迟 Project Ranger
              2026 年目标投产时间线。
