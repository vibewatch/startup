      - number: '8.5'
        title: 退出准备度、投资逻辑击穿触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Castelion 的自然退出路径包括：被寻求垂直高超音速能力的防务主承包商或二级承包商战略收购；在生产合同产生可审计收入后直接上市或 IPO；或在后续风险轮中安排结构化老股交易。2026 年 PwC
              aerospace and defense M&A outlook 将弹药和防务科技列为主承包商补强收购和战略少数股权投资的主要目标，与 Castelion 的画像一致。IPO
              前老股交易需要可审计的生产级收入和正 EBITDA，这些条件尚未具备。战略收购风险双向存在：若 Castelion 证明 Project Ranger 吞吐量，主承包商可能给出高于 $2.8 billion
              的控制权溢价；若测试受挫，也可能收到低于市场价的报价。投资者应持续监控的投资逻辑击穿触发器包括：（1）实弹 MACE 项目中任何确认的测试失败，（2）DoW 生产框架未能在 FY2027 Q2
              前转成有约束力的采购合同，（3）Project Ranger 施工延迟超过 2026 年底投产目标，（4）两名或更多联合创始人离职，（5）Congress 撤销 MACE
              或相关高超音速项目资金。当前价格投入资本前，优先级最高的六项尽调事项是：（1）每枚 All Up Round 在量产规模下的毛利率，（2）Series B 后实际烧钱速度和现金跑道，（3）Project
              Ranger 资本支出计划和剩余义务，（4）股权结构表和优先股堆叠，（5）完整飞行测试结果记录，包括任何部分失败，（6）DoW 框架转化为生产合同的时间表。公开来源无法解决这些事项；全部需要 data room
              权限。
