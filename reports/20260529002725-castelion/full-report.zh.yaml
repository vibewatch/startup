              New Mexico DOJ 投诉仍在推进，Sandia 环境羽流研究尚未完成，消防喷淋系统还存在消防规范豁免；三者足以形成施工禁令或许可证撤销的现实路径，可能让 Project Ranger 延误 12 到
              24 个月。它直接卡住 DoW 框架协议转成有约束力收入流所需的生产时间表，因此是投资者眼前最高的风险。
