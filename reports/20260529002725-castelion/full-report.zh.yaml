  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与作战流程
        blocks:
          - type: paragraph
            body: >-
              Castelion 的核心产品是 Blackbeard，一种远程高超音速打击武器，设计用于以超过 Mach 5 的速度攻击时敏、机动或加固目标。从客户作战流程看，Blackbeard
              嵌入美军现有打击链，定位为价格可承受、发射节奏更高的替代品：一端替代单价数千万美元级的战略高超音速滑翔器，另一端替代常规亚音速防区外弹药，后者缺乏击穿现代一体化防空所需的速度和弹道不可预测性。该武器正以两个平台变体推进，底层子系统基础设施共用。空射海军型归入美国海军
              Multi-mission Affordable Capacity Effector（MACE）项目，由 F/A-18E/F Super Hornet 携带，并要求未来可在 F-35A/C 武器舱内挂载四枚
              AUR。海军 MACE 要求射程与 AGM-158C LRASM 互补（至少 370+ km）、75 lb 弹头（政府集成）、在年产至少 500 枚 AUR 时单价低于 $300,000，并在 FY2027
              具备早期作战能力。陆射陆军型是 HX3/Project CAML 项目下的 Blackbeard GL，目标是以一小部分成本达到 PrSM Increment 4 约 80% 的射程（估计 500–1,000+
              km），兼容现有 HIMARS MFOM pod 架构，并与自主 Common Autonomous Multi-Domain Launcher（CAML-M）并行开发。同时，Castelion
              已披露第二条高超音速产品线处于早期开发阶段，与 Blackbeard 共用低成本子系统基础设施，但尚未公开合同、项目名称或时间表。两个变体的买方都是美国战争部；不存在商业客户。
