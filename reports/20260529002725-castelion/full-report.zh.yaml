          label: DoW 生产框架（May 2026）
          detail: 预生产需求信号：DoW 框架覆盖每年 500+ 枚 Blackbeard 导弹；尚非有约束力合同。只有 EOC 宣告之后，才会转成生产收入，预计 FY2027。
          tone: neutral
