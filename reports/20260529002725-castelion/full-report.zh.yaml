              - CE040
      - number: '5.6'
        title: 信任、安全、质量与合规
        blocks:
          - type: paragraph
            body: >-
              Castelion 的合规义务主要由弹药安全认证、出口管制和环境许可决定。海军舰载航空路径下，主要关口是 NAVAIR NOSSA（Naval Ordnance Safety and Security
              Activity）审查和 WSESRB（Weapon Systems Explosives Safety Review Board）认证；Blackbeard
              获准上舰储存、装载和飞行作业前，这两项是强制要求。FY2026 预算调和法案文本明确拨出 $89M，用于“完成供应商开发、政府集成成本、NOSSA/WSESRB 认证，以及支持最低 EOC
              构型的靶场/飞行”，确认截至 2026 年 5 月这些审查尚未完成。陆军 HIMARS 集成方面，靶场安全允许实弹测试前，必须设计、制造并认证 Flight Termination
              System（FTS）；该系统正在开发中。Castelion 在 Torrance（总部）和 Rio Rancho（Project
              Ranger）运行环境、健康与安全（EHS）项目，覆盖高氯酸铵（AP）处理、铝粉燃料、复合纤维制造，以及含能材料灭火规程（AP/铝火灾不能用水）。在 Project Ranger，Castelion
              承认固体火箭发动机氧化剂高氯酸铵需要严格的高氯酸盐围堵和地下水监测，以保护供应 Rio Rancho 饮用水的 Santa Fe Group 含水层。2025 年 10 月和 12
              月社区会议上，数百名居民正式提出对高氯酸盐污染、静态点火测试噪音、消防泡沫 PFAS 风险和施工径流的担忧。截至 2026 年 5 月，Castelion 尚未取得 Project Ranger
              的全部环境许可。量产硬件的 MIL-SPEC 资格尚未公开确认；项目仍处于原型和 EOC 前阶段。尚无 DoD 或独立第三方网络安全审计的公开报告。公开信息中没有安全事故、造成人员受伤的测试失败或产品召回。
