      - CV026
      - CV028
      - CV033
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 量产规模毛利率
        - 在年产 500、1,000 和 5,000 枚 All Up Round 下的单枚毛利率；当前和预测的分系统物料清单。
        - 没有毛利率数据，$2.8B 估值无法做压力测试；若 $300K/AUR 下毛利接近零，投资逻辑完全押注产量和政府延续，而不是产品经济性。
        - 数据室：索取生产成本模型（FY2025 实际 + FY2026 估计 + 稳态预测）。负责人：CFO（Kreitz）。
      - - Series B 后烧钱速度与现金跑道
        - Q1 2026 月度现金消耗；Series B 交割后的现金余额；FY2026 现金流预测。
        - 判断 $350M Series B 是否足以支撑到 Project Ranger 投产和生产合同里程碑，还是收入拐点前的年中需要桥接轮。
        - 数据室：索取 January–April 2026 月度管理账和 24 个月现金流模型。负责人：CFO。
      - - Project Ranger 资本开支时间表与剩余义务
        - Project Ranger 已投入资本与待投入资本；与里程碑挂钩的提款计划。
        - 若 $350M Series B 所得中仍有全部 $220M 待投入，运营只剩 ~$130M —— 生产合同签署前可能不够。
        - 数据室：索取 Project Ranger 施工计划、已承诺采购订单和完工所需资本估计。负责人：COO（Pitt）。
      - - 股权结构表与优先股堆叠
        - 完全稀释股权结构表，包含所有期权池、认股权证、SAFEs 和可转债；各轮清算优先权条款。
        - 在 $2.8B 名义估值下，显著的优先权包袱可能意味着任何低于 2–3× 估值抬升的退出，普通股和期权持有人拿到的金额会远低于名义估值。
        - 数据室：索取最新股权结构表、投资者权利协议和公司注册证书。负责人：总法律顾问。
      - - 完整飞行测试记录
        - 完整 Blackbeard 测试活动结果，包括所有未达成飞行目标的测试弹；证明持续高超音速的飞行性能数据。
        - The War Zone 和 Army 预算文件都指出，Blackbeard 是否达到持续 Mach 5+ 仍不确定；未经确认的测试失败可能推翻 MACE 项目预算线和 DoW 框架。
        - 向 Navy 和 Army 项目办公室索取机密和非机密测试报告；或索取 Castelion 内部测试摘要及飞行测试数据。负责人：CEO（Hargis）及相关 项目执行办公室。
      - - 生产合同转换时间表
        - DoW 生产框架转为有约束力的多年采购合同所需的具体合同条件、里程碑和日期。
        - 框架不具约束力，是估值风险的最大单一来源；投 $2.8B 前，必须弄清转换关口，以及是否还有技术或政治条件未满足。
        - >-
          通过数据室索取完整 DoW 生产框架协议，包括所有先决条件。负责人：CEO（Hargis）；相关 DoD 对口方：Office of the Under Secretary of Defense for
          Acquisition。
      - - 国际销售与盟国采购潜力
        - 盟国政府（Australia、Japan、UK、ROK）围绕 Blackbeard 采购的任何沟通进展；影响国际销售的任何出口管制限制。
        - 盟国采购会成为美国 DoD SAM 之外的重大收入倍增器，并可能显著改善乐观情景回报路径。
        - 索取任何 ITAR/EAR 出口许可证申请，以及国际政府沟通记录。负责人：COO（Pitt）。
    notes: 截至 May 2026 报告日期，本清单所有事项都无法从公开来源解决；每一项都需要在适当 NDA 下进入安全数据室。
    claimRefs:
      - CV023
      - CV024
      - CV026
      - CV035
