            title: ARRW 在位者复活带来遥远但真实的替代威胁
            body: >
              空军以 FY2026 年 $387M 和到 2030 年 $1.7B 资金复活 ARRW 项目，说明即便项目曾被取消，机构惯性和既有关系仍能支撑更高成本项目。如果 ARRW Increment 2 借助
              Lockheed 的制造规模，实现有意义的单位成本下降，且空军能把影响力引向海军采购，Castelion 的空射窗口会收窄。考虑到 ARRW 的失败历史和不同平台（B-52 vs. 舰载
              F/A-18），近端概率较低，但仍值得跟踪。
