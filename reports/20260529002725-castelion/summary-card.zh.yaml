    Castelion 同时具备罕见的 DoD 需求拉动、可信的创始人-市场匹配，以及制造优先的投资逻辑；如果 Pentagon 真的把高超音速从精品项目转向规模采购，这家公司会很重要，但当前约 $2.8B
