  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Framework and Investment Overview
        blocks:
          - type: paragraph
            body: >-
              Castelion's risk profile is shaped by four interlocking forces: the technical and regulatory complexity of
              becoming a new entrant in energetic materials manufacturing, near-total dependence on a single government
              customer, elevated execution risk from a small founding team with no disclosed succession planning, and a
              valuation of $2.8 billion that implies successful conversion of the non-binding DoW production framework
              into an appropriated multi-year contract. The company has raised approximately $464 million across seed,
              Series A, and Series B rounds, giving it substantial capital reserves, but it remains
              pre-production-revenue and must clear multiple qualification gates before it earns production-scale
              contract payments. Risks are ordered in this chapter by residual severity after known mitigations:
              regulatory and environmental risks at Project Ranger carry the highest near-term uncertainty given active
              community opposition and incomplete environmental reviews; supply chain concentration in ammonium
              perchlorate is a structural vulnerability shared across the SRM industry; key-person and execution risk
              are moderate but manageable with proper succession planning; financial and competitive risks are elevated
              but partially offset by the framework agreement and strong investor backing. Kill criteria and monitoring
              indicators are catalogued in the final section.
