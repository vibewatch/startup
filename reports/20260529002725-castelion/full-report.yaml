  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Castelion operates at the intersection of hypersonic weapons development and high-volume defense
              manufacturing. The relevant market is defined as weapons traveling at or above Mach 5—primarily
              air-launched and ground-launched hypersonic glide vehicles, hypersonic cruise missiles, and boost-glide
              systems. This definition excludes conventional subsonic cruise missiles (e.g., Tomahawk), tactical
              ballistic missiles, and supersonic but sub-hypersonic munitions such as the Standard Missile family.

              Within the hypersonic segment, Castelion specifically targets a new sub-category: affordable, high-volume
              hypersonic strike weapons engineered for industrial-rate output rather than boutique, low-quantity
              production. The Blackbeard missile sits in the light/compact air-launched hypersonic class—distinguished
              from heavier systems like the Navy's Conventional Prompt Strike or Army LRHW by its sub-$400K unit target
              cost and multi-platform compatibility. The status-quo substitute in U.S. Navy inventory is the AGM-158C
              LRASM (Long Range Anti-Ship Missile) at approximately $3 million per unit, and the cancelled HALO/OASuW
              Increment 2 program leaves a procurement vacuum that Blackbeard is positioned to fill. For U.S. Army, the
              incumbent is the Precision Strike Missile (PrSM), whose Increment 4 variant targets similar capabilities
              at significantly higher cost.

              Adjacencies include: counter-hypersonic defense systems (an entirely separate market), scramjet propulsion
              development, hypersonic test infrastructure, and downstream platform integration services. These
              adjacencies are not currently addressable by Castelion but represent potential future expansion surfaces
              as the company's propulsion IP matures.
