          - type: callout
            title: Extreme Single-Customer Concentration with Conditional Production
            body: >-
              100% of Castelion's revenue derives from a single customer (the U.S. government) with no binding
              production contract in place as of May 2026. The DoW framework's "minimum 500/year" production commitment
              is explicitly contingent on completing testing and validation; any test failure, program restructure, or
              budget rescission would leave Castelion's Project Ranger manufacturing investment ($220-250M private
              capital) without committed offtake.
            calloutType: risk
            claimRefs:
