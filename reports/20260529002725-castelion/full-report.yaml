      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The most powerful growth driver is geopolitical: China and Russia have fielded operational hypersonic
              systems (China's DF-17/DF-ZF, Russia's Kinzhal, Avangard, and Zircon) while most U.S. programs have
              remained in development or testing. This "strategic gap" has become a bipartisan political priority,
              compressing the typical DoD acquisition cycle and unlocking Other Transaction Authority mechanisms that
              allow faster contracting. The "Arsenal of Freedom" doctrine—which explicitly frames scale and
              affordability as deterrence pillars—is a direct policy tailwind for Castelion's manufacturing-first
              approach.

              Secondary growth drivers include: the depletion of U.S. missile stockpiles from recent high-intensity
              operations (including the Iran conflict referenced in Pentagon documents), which has created urgency for
              replenishment at scale; the DoD's stated goal to procure over 10,000 low-cost cruise missiles and 12,000
              hypersonic missiles over three to five years starting in 2027; and rising congressional support for
              defense modernization that shifts spending from legacy platforms toward advanced munitions.

              Adoption constraints are significant and should not be minimized. Material availability is a near-term
              bottleneck: hypersonic thermal protection systems and advanced composites require specialized supply
              chains that are globally constrained. Testing infrastructure is scarce—hypersonic test ranges are heavily
              scheduled, and flight test cadence directly paces certification. The ITAR regime limits supply chain
              diversification. Integration certification for carrier-based aircraft is a high-bar regulatory gate: the
              Navy's airworthiness certification process is designed to eliminate catastrophic failures in carrier
              operations, and any anomaly in testing could delay procurement by 12–24 months. Congressional
              authorization for the multi-year procurement of 12,000 missiles is not yet secured and represents a policy
              risk. Finally, arms control advocates and some strategic studies academics warn that rapid hypersonic
              proliferation risks escalatory miscalculation—a concern that could generate political headwinds in future
