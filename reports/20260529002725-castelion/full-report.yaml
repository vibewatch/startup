      - number: '1.5'
        title: Risks, Adverse Signals, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Castelion faces several material risks spanning community opposition, regulatory exposure, business
              concentration, and execution at scale. The Project Ranger manufacturing campus has sparked significant
              local opposition from Rio Rancho and unincorporated Sandoval County residents who raised concerns about
              noise from static rocket motor fire tests, environmental contamination from ammonium perchlorate oxidizer
              and aluminum propellant powder, groundwater and arroyo runoff impacts, tribal consultation obligations,
              and fire and accident response capacity. A community meeting held December 9, 2025 drew dozens of
              residents pressing Castelion CFO Andrew Kreitz on safety and environmental protocols, and Sandoval County
              approved $125 million in industrial revenue bonds for the project. Rio Rancho Fire Chief James Wenzel
              separately raised concerns about the high-hazard classification of the facility and its implications for
              municipal fire service resources. The environmental plume study with Sandia National Laboratories was
              still underway as of the December 2025 community meeting. From a business perspective, Castelion is a
              single-customer company: the U.S. federal government is its only revenue source, and it has not yet
              secured a production contract (as of December 2025, it remains in demonstration phase). The company has
              yet to produce thousands of missiles and must transition from prototype-to-production—a historically
              costly and timeline-intensive phase. Revenue, burn rate, and gross margin are not publicly disclosed.
              There is moderate key-person concentration in the three co-founders. The board structure and governance
              rights of major investors are not public. Defense acquisition programs frequently experience delays, scope
              changes, and budget reductions that could materially affect Castelion's contract pipeline.
            claimRefs:
              - CO035
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
