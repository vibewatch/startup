      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The three scenario paths for Castelion turn on two binary outcomes: (1) whether the May 2026 DoW
              production framework converts to a binding multi-year procurement contract by early FY2027, and (2)
              whether Project Ranger achieves rated production capacity on the announced 2026 timeline. In the bull
              case, both conditions are met, the FY2027 MACE procurement lot (353 missiles at $156 million) is followed
              by immediate scale-up, and the DoW framework exercises its full option arm of 12,000+ missiles over five
              years at $350–$442K per unit. At that production rate, annual revenue could reach $1.5–2.5 billion by
              2029, positioning an IPO or strategic exit at 10–15× forward revenue in the $15–37 billion range — a 5× to
              13× return on the $2.8 billion Series B price. In the base case, the production framework converts but the
              ramp is slower than planned: 500–1,000 missiles per year by 2027 and 1,500–2,500 per year by 2029–2030.
              Revenue reaches $250–700 million, and a Series C at a $5–8 billion valuation is needed to fund Project
              Ranger completion, implying dilution of 15–25% before a public exit. Returns from the Series B price in
              this scenario are modest: 1.5–2.5× in five to seven years, consistent with a mid-range defense tech
              outcome. In the bear case, test failures, program delays, or a budget reallocation prevent timely
              framework conversion. Production revenue is deferred to FY2028–2029, the Series B price looks expensive
              against a sub-$100 million revenue base, and a down round at $1.5–2.0 billion becomes probable. The base
              case is the modal outcome given current evidence; bull case probability is rising as the DoW framework and
              April 2026 MACE integration contracts confirm government intent, but execution risk from factory
              commissioning and live-fire testing remains material.
