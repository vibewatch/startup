            body: >-
              Castelion has raised approximately $504M in total across five funding rounds since its founding in
              November 2022. The Series A, closed in January 2025, totaled approximately $100M—$70M in equity led by
              Lightspeed Venture Partners with participation from Andreessen Horowitz, Lavrock Ventures, Cantos, First
              In, BlueYard Capital, and Interlagos, plus $30M in venture debt from Silicon Valley Bank. The $350M Series
              B closed in December 2025, led by Altimeter Capital and Lightspeed Venture Partners, with participation
              from Andreessen Horowitz, General Catalyst, Lavrock Ventures, First In, Space VC, Cantos, BlueYard,
              Avenir, Champion Hill, and Interlagos. Post-Series B valuation is approximately $2.8B. The largest stated
              capital deployment is the $220M private investment in Project Ranger, a 1,000-acre solid rocket motor
              manufacturing campus in Rio Rancho, New Mexico (Sandoval County). Project Ranger broke ground in early
              2026, with the first building scheduled for summer 2026 and all 21 buildings expected to be complete and
              ready for production by year-end 2026. The facility will create 300 high-paying jobs and is projected to
              generate $650M in economic output over a decade. Monthly burn rate, cash on hand beyond the Series B, and
              remaining project financing requirements are not publicly disclosed, creating a material underwriting gap.
              With a $350M Series B closed six months before the May 2026 run date and a parallel revenue ramp through
              Navy and Army contracts, capital adequacy appears sufficient for at least 12–18 months of operations;
              however, the capital-intensive nature of missile manufacturing and factory commissioning means the next
