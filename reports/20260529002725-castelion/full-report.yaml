  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Live-fire test failure (MACE program)
        - >-
          Any confirmed public failure of a Blackbeard flight test in the Navy MACE or Army HX3 programs that is
          attributed to weapon design (not range conditions).
        - >-
          Undermines all three bull-case assumptions; triggers production framework re-evaluation; potential program
          cancellation.
        - Immediate position review; size down or exit before next funding round price discovery.
      - - DoW framework non-conversion
        - Production framework not converted to binding multi-year purchase contract by Q2 FY2027 (June 2027).
        - Base case revenue trajectory collapses; $2.8B valuation unsupported; down-round scenario becomes modal.
        - >-
          Treat as thesis break unless specific evidence of contract delay versus cancellation is provided with a
          revised timeline.
      - - Project Ranger construction delay
        - First production building at Project Ranger not commissioned by Q1 2027 (vs. end-2026 plan).
        - >-
          Revenue ramp deferred; working capital and capex overhang increases; Series C needed sooner and at lower
          bargaining position.
        - Elevate monitoring cadence; assess whether bridge financing has been secured.
      - - Co-founder departure
        - Departure of two or more of the three co-founders (Hargis, Pitt, Kreitz) for any reason.
        - >-
          Government relationship management, technical execution, and fundraising capability are
          co-founder-concentrated; succession risk is severe given 100-plus headcount and early stage.
        - Requires immediate inquiry into retention plan, board composition, and leadership replacement.
      - - FY2027 MACE budget rescission
        - >-
          Congressional rescission of MACE procurement funding in the FY2027 NDAA or Appropriations Act, or a DoD
          program of record cancellation notice.
        - Revenue inflection point eliminated; production contract conversion no longer possible at announced scale.
        - Full position exit; no viable bear-case floor above $500M–$1B without the MACE program.
      - - Environmental permitting block at Project Ranger
        - >-
          New Mexico Environment Department or EPA issues stop-work order or consent agreement delaying facility
          construction at Project Ranger beyond 90 days.
        - Manufacturing capacity delayed; MACE delivery commitments jeopardized; investor confidence damaged.
        - Elevate legal and regulatory monitoring; assess whether alternate facility sites are viable.
    notes: >-
      Kill triggers are defined for threshold-based monitoring; they do not constitute specific price targets or exit
      instructions. Investors should define individual position limits independently.
    claimRefs:
      - CV025
      - CV026
      - CV028
      - CV033
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Gross margin at production scale
        - >-
          Gross margin per All Up Round at 500, 1,000, and 5,000 units per year; current and projected bill-of-materials
          by subsystem.
        - >-
          Without gross margin data, the $2.8B valuation cannot be stress-tested; if margin is near zero at $300K/AUR,
          the thesis depends entirely on volume and government continuity, not product economics.
        - >-
          Data room: request production cost model (FY2025 actuals + FY2026 estimate + steady-state projection). Owner:
          CFO (Kreitz).
      - - Burn rate and cash runway post-Series B
        - Monthly cash burn as of Q1 2026; cash balance post-Series B close; FY2026 cash flow forecast.
        - >-
          Determines whether the $350M Series B is sufficient through Project Ranger commissioning and production
          contract milestone, or whether a bridge round is needed mid-year before revenue inflection.
        - >-
          Data room: request monthly management accounts from January–April 2026 and a 24-month cash flow model. Owner:
          CFO.
      - - Project Ranger capex schedule and remaining obligation
        - Capital already deployed into Project Ranger vs. remaining to spend; milestone-linked drawdown plan.
        - >-
          If all $220M remains to be spent from the $350M Series B proceeds, only ~$130M is available for operations —
          potentially insufficient before production contract execution.
        - >-
          Data room: request Project Ranger construction schedule, committed purchase orders, and capital-to-completion
          estimate. Owner: COO (Pitt).
      - - Cap table and preference stack
        - >-
          Fully-diluted cap table including all option pools, warrants, SAFEs, and convertibles; liquidation preference
          terms for each series.
        - >-
          At a $2.8B headline valuation, substantial preference overhang could mean common equity and option holders
          receive significantly less than the headline at any exit below a 2–3× step-up.
        - >-
          Data room: request the most recent capitalization table, investor rights agreement, and certificate of
          incorporation. Owner: General Counsel.
      - - Full flight test record
        - >-
          Complete Blackbeard test campaign results, including any test articles that did not achieve flight objectives;
          flight performance data establishing sustained hypersonic velocity.
        - >-
          The War Zone and Army budget documents both note uncertainty about whether Blackbeard achieves sustained Mach
          5+; unconfirmed test failures could invalidate the MACE program budget line and the DoW framework.
        - >-
          Request classified and unclassified test reports from the Navy and Army program offices; or request
          Castelion's internal test summary with flight-test data. Owner: CEO (Hargis) and relevant Program Executive
          Offices.
      - - Production contract conversion timeline
        - >-
          Specific contractual conditions, milestones, and dates for DoW production framework to convert to a binding
          multi-year procurement contract.
        - >-
          The framework's non-binding nature is the single largest source of valuation risk; understanding the
          conversion gate and whether any technical or political conditions are outstanding is essential before
          committing capital at $2.8B.
        - >-
          Request the full DoW production framework agreement, including all conditions precedent, through the data
          room. Owner: CEO (Hargis); relevant DoD counterpart: Office of the Under Secretary of Defense for Acquisition.
      - - International sales and allied procurement potential
        - >-
          Status of any allied government conversations (Australia, Japan, UK, ROK) about Blackbeard procurement; any
          export control restrictions affecting international sales.
        - >-
          Allied procurements would represent a material revenue multiplier beyond the U.S. DoD SAM and could materially
          improve the bull-case return trajectory.
        - >-
          Request any ITAR/EAR export license applications and records of international government discussions. Owner:
          COO (Pitt).
    notes: >-
      All items on this list are unresolvable from public sources as of the May 2026 report date; each requires secure
      data room access under an appropriate NDA.
    claimRefs:
      - CV023
      - CV024
      - CV026
      - CV035
