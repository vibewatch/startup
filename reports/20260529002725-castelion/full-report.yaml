            title: Multi-Service Contract Breadth with Rapid Escalation
            body: >-
              All three U.S. military services have funded Blackbeard at some point, and the Navy has escalated from a
              $49.9M contract to a $154.9M cumulative commitment in under 60 days. The DoW production framework
              projecting 12,000+ missiles over five years is the most explicit long-range demand signal any commercial
              hypersonic startup has received from a major military.
