              - CU034
              - CU040
          - type: callout
            title: Community and Environmental Friction at Project Ranger
            body: >-
              The Project Ranger manufacturing campus faces organized community opposition in Sandoval County over
              perchlorate contamination, noise, groundwater risk, and chemical handling. While the DoD as customer is
              unaffected, permit delays, environmental remediation requirements, or community lawsuits could delay
              manufacturing ramp, jeopardizing the production contract fulfillment timeline that the DoW framework
              depends on.
            calloutType: risk
            claimRefs:
              - CU025
              - CU026
          - type: callout
            title: SBIR Phase III as Strategic Contracting Vehicle
            body: >-
              The SBIR Phase III mechanism originated from a 2023 Air Force SBIR topic, yet has been used to sole-
              source both Navy ($154.9M executed) and Army ($25M+ planned) contracts without competitive
              re-solicitation. This legal pathway is a significant structural advantage, insulating Castelion from
              competitive protests while compressing acquisition timelines—but it also means a single GAO challenge to
              Phase III eligibility could disrupt the entire multi-service contracting approach.
