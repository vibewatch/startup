      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Castelion's natural exit pathways are strategic acquisition by a defense prime or second-tier contractor
              seeking vertical hypersonic capability, a direct listing or IPO once production contracts generate
              auditable revenue, or a structured secondary process in a later venture round. The 2026 PwC aerospace and
              defense M&A outlook identifies munitions and defense tech as the primary targets for prime-contractor
              tuck-ins and strategic minority stakes, consistent with Castelion's profile. A pre-IPO secondary would
              require auditable production-level revenue and positive EBITDA, conditions that are not yet in place.
              Strategic acquisition risk exists in both directions: a prime could offer a control premium above $2.8
              billion if Castelion demonstrates Project Ranger throughput, or a below-market offer if tests falter. The
              thesis-break triggers that investors should monitor continuously are: (1) any confirmed test failure in
              the live-fire MACE program, (2) delay in the DoW production framework converting to a binding purchase
              contract by Q2 FY2027, (3) Project Ranger construction delay beyond the end-of-2026 commissioning target,
              (4) departure of two or more co-founders, and (5) any Congressional rescission of MACE or related
              hypersonic program funding. The six highest-priority diligence items before committing capital at the
              current price are: (1) gross margin at production scale per All Up Round, (2) actual burn rate and cash
              runway post-Series B, (3) Project Ranger capital drawdown schedule and remaining obligation, (4) cap table
              and preference stack, (5) full-flight-test result record including any partial failures, and (6) timeline
              for production contract conversion from the DoW framework. None of these items are resolvable from public
              sources; all require data room access.
            claimRefs:
              - CV017
              - CV025
              - CV026
              - CV035
              - CV040
              - CV041
              - CV042
