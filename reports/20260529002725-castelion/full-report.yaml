  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Type
      - Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Thesis
        - >-
          Structural and funded demand: the DoD has no affordable, mass-producible hypersonic strike weapon in
          inventory, creating a mission-critical gap Castelion uniquely addresses.
        - DoW production framework (May 2026), MACE award, $379M FY2026 budget commitment to Blackbeard programs.
        - Cancellation of all MACE and related hypersonic budget lines in FY2027 NDAA.
      - - Thesis
        - >-
          SpaceX-DNA execution: three ex-SpaceX executives achieved 25+ flight tests in under three years — a pace with
          no industry precedent for a startup defense manufacturer.
        - >-
          Altimeter partner quote confirming 25+ flight tests; 20+ development tests in 2025 alone per Series B press
          release.
        - Departure of two or more co-founders or systematic test failures.
      - - Thesis
        - >-
          First-mover manufacturing moat: Project Ranger creates 1,000 acres of solid rocket motor capacity; no peer
          startup has broken ground on comparable dedicated manufacturing.
        - >-
          Project Ranger groundbreaking early 2026; $220M private investment; 21 buildings planned for full production
          by year-end 2026.
        - Another vendor secures a competing production contract for affordable hypersonics at comparable cost.
      - - Anti-thesis
        - >-
          Revenue multiple of ~54× requires near-flawless execution: current estimated revenue of ~$51.5M supports the
          $2.8B valuation only if the production framework converts rapidly and scales to hundreds of millions annually.
        - Third-party revenue estimates (CompWorth, Growjo); comparable private peers trade at 23–28×.
        - Production framework converts and revenue ramps to ≥$150M, compressing the multiple to a defensible range.
      - - Anti-thesis
        - >-
          DoW production framework is non-binding: the May 2026 framework is a demand signal, not a purchase order, and
          depends on completing live-fire testing and EOC declaration before conversion.
        - >-
          DoW press release language ('framework agreement'); financials chapter analysis of contract conversion
          conditions.
        - Binding multi-year production contract executed with DoD.
      - - Anti-thesis
        - >-
          Hypersonic label ambiguity creates program risk: The War Zone raised public skepticism about whether
          Blackbeard's flight profile meets the strict Mach 5+ sustained-hypersonic definition, which is the criterion
          that gates its DoD budget line.
        - >-
          The War Zone reporting (June 2025) on the Army's budget documents noting 'Exactly how Blackbeard is expected
          to be hypersonic is unclear'.
        - >-
          Castelion publishes validated flight performance data confirming sustained Mach 5+ trajectory on operational
          test shots.
    notes: >-
      Thesis and anti-thesis rows are based on publicly available evidence only. Private technical, financial, and
      contractual data could materially change any row.
    claimRefs:
      - CV018
      - CV023
      - CV024
      - CV026
      - CV037
      - CV038
      - CV040
  - id: TV003
    title: Bull / Base / Bear Scenario Analysis
    columns:
      - Scenario
      - Key Assumptions
      - Revenue Path (2026–2030)
      - Implied Valuation at Exit
      - Probability Signal
      - Key Downside Trigger
    rows:
      - - Bull
        - >-
          DoW framework converts to binding contract by Q1 FY2027; Project Ranger on time; 1,000+ missiles/yr by 2028,
          3,000+/yr by 2030; Army and Navy exercise full option volumes; second product line contribution begins.
        - $221M (2027) → $884M (2028) → $2.2B+ (2030) at $442K/unit and 5,000/yr
        - $15–37B at IPO (10–15× fwd rev); 5–13× return on $2.8B Series B entry
        - >-
          DoW framework terms, MACE procurement lot sizes, and congressional FY2027 appropriations all signal this is
          achievable — but none is yet contracted.
        - Failure to convert DoW framework to binding purchase order by Q2 FY2027.
      - - Base
        - >-
          DoW framework converts in FY2027 but ramp is slower; Project Ranger at partial capacity by 2027; 500–1,000
          missiles/yr in 2027–2028; Series C needed to complete factory and fund working capital ramp.
        - $110–221M (2027) → $250–500M (2028) → $500–700M (2030) at $350–442K/unit
        - $5–8B at Series C entry or strategic exit; 1.5–2.5× return on $2.8B entry over 5–7 years
        - Government demand is confirmed; manufacturing risk is the primary uncertainty.
        - Project Ranger slippage or working capital squeeze requiring bridge round at lower valuation.
      - - Bear
        - >-
          Live-fire test failures or program budget reallocation; DoW framework does not convert in FY2027; Project
          Ranger delayed beyond 2026; no production revenue in 2027.
        - Sub-$100M (2027); stagnant without production contract; cash requires emergency bridge.
        - $1.5–2.0B (down round); capital loss of 30–46% from $2.8B Series B entry
        - No confirmed test failures as of May 2026; incumbent revival (ARRW $387M FY2026) adds budget competition risk.
        - Any confirmed test failure in MACE live-fire program, or FY2027 MACE budget rescission.
    notes: >-
      All valuation estimates are scenario-modeled, not company-provided; revenue estimates assume unit pricing at
      $300K–$442K/AUR consistent with MACE program documentation and DoW framework intent.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV026
      - CV031
      - CV032
  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Company
      - Stage / Description
      - Revenue / Metric
      - Valuation / EV
      - Revenue Multiple
      - Relevance to Castelion
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Defense tech private and public comparables identified in May 2026 sources with known revenue and valuation;
        excludes undisclosed private rounds and non-hypersonic defense startups.
    rows:
      - - Anduril Industries
        - Late private (Series H, May 2026); multi-domain autonomous defense platform
        - $2.2B trailing 2025 revenue; ~110% YoY growth
        - $61B (Series H)
        - ~27.7×
        - >-
          Strongest private peer: SpaceX-connected founders, Silicon Valley VC co-leads (a16z), rapid contract scale-up;
          most comparable valuation benchmark for Castelion's investor profile.
        - >-
          Anduril has software platform leverage (Lattice), multiple product lines, and $20B Army enterprise contract —
          significantly larger revenue base and broader moat than Castelion at current stage.
      - - Shield AI
        - Late private (Series G, March 2026); AI autonomy for military aircraft and drones
        - $540M+ projected 2026 revenue; 80%+ YoY growth
        - $12.7B (Series G)
        - ~23.5× projected
        - >-
          Comparable VC investor profile (Advent, JPMorgan); recent round at similar defense tech premium; demonstrates
          investor appetite for hardware-forward defense at significant multiples.
        - >-
          Shield AI has a revenue base 10× larger than Castelion's current estimates, multi-platform customer base, and
          software moat (Hivemind AI pilot); not a single-weapon manufacturer.
      - - Hermeus
        - Early-growth (Series C, April 2026); hypersonic aircraft startup, pre-production revenue
        - Pre-production; $350M Series C; first flight test March 2026
        - $1B (Series C)
        - N/A (pre-revenue)
        - >-
          Most direct technology analog: hypersonic flight, SpaceX/defense-tech investor base (Khosla, Founders Fund,
          RTX Ventures), pre-production stage. Hermeus at $1B suggests hypersonic prototype premium exists but
          Castelion's 3× premium over Hermeus reflects its government contract pipeline.
        - >-
          Different end product (reusable aircraft vs. expendable missile); Hermeus has no production contracts;
          valuation not revenue-based.
      - - Kratos Defense & Security Solutions (KTOS)
        - >-
          Public mid-tier defense; unmanned systems, rocket propulsion, hypersonic subsystems; comparable hardware
          manufacturing profile
        - $1.347B FY2025 revenue; 16.6% organic growth; $1.595–1.675B FY2026 guidance
        - ~$12.6B EV (2026)
        - ~9.4×
        - >-
          Best public analog for scale trajectory: also a non-traditional defense contractor scaling hardware
          manufacturing at government direction; EV/revenue of 9–12× provides a ceiling for where Castelion could trade
          post-production ramp as a public company.
        - >-
          Kratos is profitable (FY2025 adj. EBITDA $119.9M), has multiple product lines, and a fully commissioned
          manufacturing base. Castelion has none of these yet; Kratos multiple may overstate current Castelion
          public-market value.
      - - Lockheed Martin (LMT)
        - Public defense prime; hypersonic weapons incumbent (ARRW, CPS, LRHW programs)
        - $75–77B annual revenue; ~$75B market cap
        - $137–141B EV (2026)
        - ~1.8×
        - >-
          Floor comparable: illustrates where Castelion would eventually trade as a mature, profitable defense
          manufacturer at scale; not applicable at current stage.
        - >-
          Mature business with stable growth, large government relationships built over decades; ARRW revival ($387M
          FY2026) makes LMT a direct competitive threat, not just a comp.
      - - Raytheon Technologies (RTX)
        - Public defense prime; HACM hypersonic cruise missile developer; Pratt & Whitney aerospace engines
        - $86.5–87B annual revenue guidance (2025)
        - ~$261B EV (2026)
        - ~3.0×
        - Floor comparable for large defense primes; HACM program is a direct competing hypersonic program.
        - >-
          Conglomerate with civilian aerospace; not a pure defense tech startup comparable; HACM delays signal incumbent
          execution risk Castelion is not yet subject to.
      - - Northrop Grumman (NOC)
        - Public defense prime; Conventional Prompt Strike (CPS/Dark Eagle) program; B-21 bomber
        - ~$42B annual revenue (2025)
        - ~$96B EV (2026)
        - ~2.3×
        - Floor comparable; CPS/Dark Eagle at $41M/unit is the strategic alternative Castelion is designed to undercut.
        - >-
          CPS/Dark Eagle is a separate strategic-range program, not a tactical strike substitute; Northrop's multiple
          does not apply to early-stage production companies.
    notes: >-
      Revenue multiples for private companies are based on reported or projected figures from news and analyst sources;
      private valuation data does not include preference overhang or diluted cap table details. Public company multiples
      are enterprise value to trailing or forward revenue as of May 2026.
    claimRefs:
