  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Service Segmentation
        blocks:
          - type: paragraph
            body: >-
              Castelion operates as an exclusive U.S. government defense contractor; every dollar of revenue flows from
              DoD contracts and no commercial, allied-nation, or civilian customers exist as of the run date. The
              company's customer base is therefore a monopsony: the U.S. Department of War (formerly the Department of
              Defense) is the singular payer, with the U.S. Navy, U.S. Army, and U.S. Air Force acting as the operating
              buyers and operational users. The Navy is the primary production customer, having executed $154.9M in
              firm-fixed-price contracts against a single Basic Ordering Agreement (N6833526G0006) managed by the Naval
              Air Warfare Center Aircraft Division, Lakehurst, New Jersey. The Army is a secondary customer via the
              HX3/Blackbeard GL program with $25M in FY2026 budget appropriations. The Air Force was an early-stage
              customer through a 2023 SBIR Phase II contract ($1.77M, FA2385-23-C-B007) under topic AF231-D026 that
              seeded the Blackbeard program. The Series A announcement (January 2025) confirmed "active contracts funded
              by the US Navy, US Air Force, and US Army," indicating tri-service engagement prior to the Navy's dominant
              position crystallizing. Geographically, all work is performed domestically in the United States (primarily
              Torrance, California), with live-fire testing occurring at government ranges such as Mojave and Dugway
              Proving Ground. No foreign military sales or allied-nation procurements have been publicly confirmed as of
              May 2026, though the Blackbeard design targets HIMARS compatibility— a platform operated by many U.S.
              allies—suggesting potential future FMS eligibility. Customer concentration is extreme and intentional at
              this stage: the company's entire strategy targets the DoD hypersonic market as its addressable revenue
              base.
