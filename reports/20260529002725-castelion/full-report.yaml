  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Chain from market scale through product validation, customer proof, financial picture, risk profile, and valuation
      assessment to the Track recommendation. Each node summarizes the key evidence and verdict for that dimension.
    data:
      nodes:
        - id: market
          label: Market Opportunity
          detail: >-
            Global hypersonic weapons market $8.6B in 2026, growing >10% CAGR; U.S. DoD FY2026 hypersonic allocation
            $3.9B; DoD seeking 12,000+ Blackbeard missiles over five years. Verdict: STRONG.
          tone: positive
        - id: product
          label: Product Validation
          detail: >-
            25+ flight tests in <3 years; 20+ in 2025 alone validating SRMs, seekers, CAS, flight computers, TPS, and
            mission software. Hypersonic label not independently confirmed in public sources. Verdict: ADVANCING but not
            fully de-risked.
          tone: neutral
        - id: customers
          label: Customer Proof
          detail: >-
            $155M+ in executed Navy contracts; $25M Army earmark; DoW production framework (500+ missiles/yr min); no
            commercial customers (100% DoD concentration). Verdict: STRONG but single-customer.
          tone: positive
        - id: financials
          label: Financial Picture
          detail: >-
            ~$51.5M estimated revenue; $504M total raised; $350M Series B (Dec 2025); gross margin, burn rate, and unit
            economics entirely undisclosed. Verdict: UNDISCLOSED — major diligence gap.
          tone: negative
        - id: risk
          label: Risk Profile
          detail: >-
            High: single customer (DoD), production framework not yet binding, $220M capex commitment, community
            opposition at Project Ranger, key-person concentration, ARRW competitor revival. Verdict: HIGH risk.
          tone: negative
        - id: valuation
          label: Valuation Assessment
          detail: >-
            $2.8B / ~$51.5M = ~54× trailing revenue; Anduril at 27.7×, Shield AI at 23.5× on much larger bases; Kratos
            public comp at 9–12×. Verdict: STRETCHED.
          tone: negative
        - id: recommendation
          label: Recommendation — Track
          detail: >-
            Buy when: production contract converts OR gross margin disclosed ≥20% OR entry price retreats to <35×
            trailing revenue. Monitor kill triggers continuously.
          tone: neutral
      edges:
        - from: market
          to: product
        - from: product
          to: customers
        - from: customers
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV008
      - CV023
      - CV029
      - CV034
  - id: FV002
    title: Valuation Sensitivity to Revenue Multiple
    type: bar
    layout: standard
    summary: >-
      Implied enterprise value for Castelion at different revenue multiples applied to the $51.5M trailing revenue
      estimate, ranging from Kratos-level (9.4×) to the current Series B implied multiple (~54×). Illustrates how far
      the current entry price is above peer benchmarks.
    data:
      items:
        - label: 9.4× (Kratos/KTOS public)
          value: 484
        - label: 15× (conservative defense tech)
          value: 773
        - label: 23.5× (Shield AI Series G)
          value: 1210
        - label: 27.7× (Anduril Series H)
          value: 1426
        - label: 35× (mid-range stretch)
          value: 1803
        - label: 54× (current Series B implied)
          value: 2781
    approximationNotes: >-
      All values in USD millions; derived by applying stated multiple to $51.5M trailing revenue estimate from
      CompWorth, Growjo, and GetLatka aggregators. Revenue estimate is third-party and unverified by Castelion. Peer
      multiples are based on most recent round or market cap data as of May 2026.
