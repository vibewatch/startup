      - number: '2.3'
        title: Buyer and Platform Segmentation
        blocks:
          - type: paragraph
            body: >-
              The U.S. defense procurement system creates a layered buyer structure: policy principals (Secretary of
              War, Under Secretary for Research and Engineering), program sponsors (NAVAIR, Army Program Executive
              Office for Missiles and Space), and ultimately the warfighter communities who specify requirements.
              Castelion's immediate payer is the U.S. government via program contracts; there are no commercial
              customers, international buyers, or intermediary distributors involved at this stage. Congressional
              authorization and appropriations form a gating step between programmatic intent and funded contract.

              The Navy is the most immediate buyer segment. The MACE program formally selects Blackbeard as the Navy's
              primary air-launched hypersonic strike munition, with the F/A-18E/F Super Hornet as the primary launch
              platform and F-35C as a stealth-capable secondary carrier (internal carriage of four rounds). The adoption
              trigger is completion of airworthiness certification and live-fire integration testing, targeted for Early
              Operational Capability in 2027. Budget authority rests with the Assistant Secretary of the Navy for
              Research, Development and Acquisition.

              The Army represents a smaller, parallel buyer channel via the HX3/HIMARS Blackbeard Ground Launch program.
              FY2026 allocates $25 million for proof-of-concept and integration testing on HIMARS and M270 launchers.
              The Army rationale is a cost-effective supplement to the Long Range Hypersonic Weapon (LRHW/Dark Eagle),
              offering broader distribution at a fraction of LRHW's per-unit cost. Adoption trigger here is successful
              fixed-fin flight test and HIMARS-launched demonstration.

              The Department of War—as an enterprise-level buyer under the "Arsenal of Freedom" framework—represents the
              highest-ceiling but most uncertain channel. The framework agreement commits to 500 missiles/year minimum
              and seeks authorization for 12,000 total over five years, but Congress must appropriate the funds, and no
              line-item appropriation for the full 12,000-unit volume yet exists in publicly available FY2027 budget
              documents reviewed for this analysis.
