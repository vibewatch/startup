  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Dependency / Supplier
      - Risk
    rows:
      - - Solid Rocket Motor (propulsion)
        - Provides boost to Mach 5+ via solid-fueled 2-stage configuration (GL variant); powers entire flight profile
        - >-
          Designed and manufactured in-house; ammonium perchlorate oxidizer from commercial chemical suppliers; aluminum
          powder fuel
        - Environmental permit risk at Project Ranger; AP supply concentration; static-test yield currently ~70%
      - - Control Actuation System (CAS)
        - Provides aerodynamic control during powered and glide flight phases; moves control surfaces
        - Internally designed; motors and actuators from commercial/defense supply chain
        - Specific supplier and lead-time data not publicly disclosed; failure mode not confirmed
      - - Multi-Mode EO Terminal Seeker
        - Provides terminal guidance for moving and stationary targets; enables mid-flight re-targeting
        - Internally integrated; EO detector from defense/commercial supply chain; ITAR Category IV
        - Seeker resolution, acquisition range, and countermeasure resistance not confirmed; export-controlled
      - - FPGA Avionics (Vitis HLS)
        - High-speed signal processing, sensor fusion, and real-time control execution; reconfigurable hardware
        - AMD/Xilinx FPGA silicon; Vitis HLS HLS workflow (company job postings); Allen, TX engineering hub
        - Commercial FPGA not radiation-hardened; EMP/EMI vulnerability at high altitude not publicly assessed
      - - GNC Embedded Software
        - Inertial + celestial mid-course navigation; GNC algorithm execution; HIL simulation for validation
        - Internally developed; real-time embedded OS; full-stack from firmware to application layer
        - DO-178C (or MIL-equivalent) software qualification not confirmed; GNC model fidelity gaps not disclosed
      - - Thermal Protection System (TPS)
        - Protects nose tip from aerothermal loads above 2,400°C; prevents ablation-induced guidance wander
        - Internally manufactured siliconized carbon-carbon; autoclave from rocket-nozzle tooling heritage
        - Yield currently ~70%; scale-up to Project Ranger production rate unvalidated; specialized materials supply
      - - Flight Termination System (FTS)
        - Terminates flight if vehicle deviates from planned trajectory; required for range-safety on HIMARS tests
        - In development; must qualify to DoD range safety requirements for HIMARS integration
        - FTS qualification is a critical-path dependency for Army HIMARS live-fire testing
      - - Fire Control Interface (Open Architecture)
        - Accepts digital call-for-fire from Army AFATDS, Marine MAGTF AFATDS, and Joint Fires Network
        - >-
          Open interface designed for compatibility; bench tests with Joint Fires Network reported passed (basic CFF
          script)
        - Full end-to-end integration and operational suitability testing not confirmed in any live-fire environment
      - - Manufacturing Execution System (MES)
        - Tracks production flow, routing, and inventory from subassembly through final integration
        - NetSuite inventory management; Manufacturo MES (or comparable system); per job postings
        - MES-to-production scale maturity at Project Ranger volumes is unvalidated; ERP/MES integration risk
    notes: >-
      Architecture entries are sourced from public company materials, government budget documents, and Castelion career
