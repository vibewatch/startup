      - number: '5.5'
        title: Technology Differentiation and Proprietary Position
        blocks:
          - type: paragraph
            body: >-
              Castelion's competitive differentiation rests on a combination of manufacturing know-how, supply-chain
              architecture, and development methodology rather than novel physics. No single subsystem is
              technologically unprecedented; the differentiation lies in the integration approach and production
              economics. The SpaceX-derived "build fast, test often" methodology compresses design-to-launch cycles from
              years to months, generating a learning-curve advantage that traditional prime contractors with annual or
              biennial test cadences cannot replicate in the near term. Vertical integration of solid rocket motors,
              seekers, CAS, flight computers, and thermal protection systems gives Castelion direct control over cost
              drivers that most defense firms have ceded to specialized subcontractors who price to a defense-premium
              supply chain. The use of automotive-grade commercial components (motors, computers, cases) backed by
              global R&D investment gives Castelion superior cost and lead-time positions relative to space-rated
              equivalents. SBIR Phase III sole-source contracting authority provides competitive insulation during the
              current prototype phase, as government buyers can add options without re-competing. However, no issued
              patents have been identified from public patent databases for Castelion as of May 2026; the IP position
              appears to rest on trade secret manufacturing know-how, particularly the solid rocket motor processing
              recipes, thermal protection layup procedures, and GNC software parameters. The guidance stack falls under
              ITAR Category IV controls, creating export constraints but also indicating the guidance system uses
              controlled U.S. defense technology that would require export licensing for any FMS sales. The War Zone has
              raised a technical question as to whether Blackbeard's flight profile—which may involve a quasi-ballistic
              trajectory peaking above Mach 5 rather than sustained hypersonic boost-glide— strictly qualifies as
              "hypersonic" under the technical definition; Castelion clarified that social-media test vehicle imagery is
              not representative of the production weapon.
            claimRefs:
              - CE011
              - CE031
              - CE033
              - CE035
