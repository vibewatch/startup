      - number: '7.4'
        title: Partner, Supply Chain, and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Castelion's supply chain carries a structural single point of failure: American Pacific Corporation
              (AMPAC) is the sole large-scale U.S. domestic supplier of aerospace-grade ammonium perchlorate. No
              secondary AP supplier exists at scale in the United States as of May 2026. Surging demand from multiple
              concurrent missile programs—HIMARS replenishment, THAAD, Tomahawk, PAC-3, and the new DoW Arsenal of
              Freedom initiative—has strained AP availability. The Department of War acknowledged this vulnerability in
              January 2026 with a $1 billion direct equity investment in L3Harris Missile Solutions (formerly Aerojet
              Rocketdyne) to expand solid rocket motor capacity, but this investment addresses SRM assembly capacity
              rather than the upstream AP bottleneck directly. Castelion's vertically integrated Project Ranger aims to
              reduce external SRM sourcing, but it still depends on AMPAC for AP feedstock. On the customer side,
              Castelion's revenue is near-100% concentrated on U.S. government contracts with no disclosed commercial or
              allied-nation diversification. The company's conditional production framework agreement with the
              Department of War requires separate Congressional appropriation before production orders can be placed;
              budget sequestration, CR continuing resolutions, or a DoW priority shift could delay or reduce order
              volumes. DoD flight test ranges represent another scheduling dependency, as range availability can delay
              milestone achievement and contract conversion timelines.
