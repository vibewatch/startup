  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Operational Workflow
        blocks:
          - type: paragraph
            body: >-
              Castelion's principal product is Blackbeard, a long-range hypersonic strike weapon designed to attack
              time-sensitive, mobile, or hardened targets at speeds exceeding Mach 5. From a customer workflow
              perspective, Blackbeard slots into existing U.S. military strike chains as an affordable, high-cadence
              replacement for both strategic hypersonic glide vehicles (priced in the tens of millions per unit) and
              conventional subsonic standoff munitions, which lack the speed and trajectory unpredictability needed to
              defeat modern integrated air defenses. The weapon is being fielded in two platform variants that share
              common subsystem infrastructure. The air-launched Naval variant—designated under the Navy's Multi-mission
              Affordable Capacity Effector (MACE) program—is carried on the F/A-18E/F Super Hornet, with a requirement
              for future internal carriage of four AURs in the F-35A/C weapons bays. The Navy MACE requirement specifies
              range complementary to the AGM-158C LRASM (at minimum 370+ km), a 75 lb warhead (government-integrated), a
              unit cost below $300,000 at minimum production of 500 AURs per year, and Early Operational Capability by
              FY2027. The ground-launched Army variant—Blackbeard GL under the HX3/Project CAML program—targets
              approximately 80% of PrSM Increment 4 range (estimated 500–1,000+ km) at a fraction of the cost, is
              compatible with existing HIMARS MFOM pod architecture, and is being co-developed alongside the autonomous
              Common Autonomous Multi-Domain Launcher (CAML-M). In parallel, Castelion has disclosed a second hypersonic
              product line in early development that shares common low-cost subsystem infrastructure with Blackbeard,
              but no contract, program name, or timeline has been publicly released. The buyer in both variants is the
              U.S. Department of War; there is no commercial customer.
