            body: >-
              Castelion's revenue quality is high by the standards available for public underwriting: firm-fixed-price
              government contracts carry strong collection certainty, the SBIR Phase III vehicle provides competitive
              insulation for near-term awards, and the May 2026 DoW production framework creates a credible forward
              demand signal. The critical open question is whether the framework converts to a binding multi-year
              procurement contract; as of December 2025 Castelion had not yet won a production contract. The total
              FY2026 federal budget allocation supporting MACE and related Blackbeard development is approximately $379M
              across base appropriations, congressional additions, and reconciliation funding, underscoring government
              commitment but not yet contractual certainty for production revenue. Customer concentration is total: the
              U.S. DoD is the sole buyer, and any program cancellation, test failure, or budget reallocation would
              materially disrupt revenue with no offsetting commercial stream. The $2.8B valuation implies an aggressive
              revenue multiple on a partially realized contract base and bets heavily on the production framework
              converting. Community opposition in Sandoval County, New Mexico—focused on perchlorate contamination risk,
              potential PFAS exposure, and noise from static fire tests—adds environmental permitting and political risk
              to the Project Ranger manufacturing scale-up that investors should not ignore. Key diligence actions
              required before underwriting at the current valuation are: gross margin at production scale, actual burn
              rate and cash runway, binding production contract terms, and Project Ranger environmental permitting
              status.
