  - id: FE001
    title: Blackbeard Weapon System Architecture — Technology Stack
    type: stack
    layout: wide
    summary: >-
      Castelion vertically integrates all six core subsystems of the Blackbeard weapon system. The stack maps each
      technical layer from physical propulsion through mission software, showing the in-house design/manufacturing role
      and the key dependency or risk for each layer.
    data:
      layers:
        - id: propulsion
          label: Solid Rocket Motor Propulsion
          sublabel: 2-stage (GL); ammonium perchlorate / aluminum powder; manufactured in-house in Torrance and Project Ranger
          role: Boosts weapon to Mach 5+ and sustains hypersonic flight; eliminates propulsion supply-chain markup
          status: validated
          detail: >-
            In-house design and manufacturing; 20+ motors test-fired; Project Ranger will scale to thousands of SRMs per
            year; yield ~70% for TPS nosecap; ~90% target for rate production.
          dependency: Ammonium perchlorate (commercial chemical); Project Ranger commissioning for volume
          risk: Environmental permitting at Project Ranger; perchlorate yield scale-up
        - id: thermal-protection
          label: Thermal Protection System (TPS)
          sublabel: Siliconized carbon-carbon nose tip; >2,400°C tolerance; autoclave-cured in-house
          role: Protects guidance hardware from aerothermal loads during hypersonic flight; prevents ablation wander
          status: in-development
          detail: >-
            Cured in small autoclave adapted from rocket-nozzle tooling; yield ~70% (industry sources); target >90%
            before rate production; Castelion deploying extra layup tubes to improve yield.
          dependency: Specialty carbon-carbon precursor materials; autoclave capacity at Project Ranger
          risk: Yield gap is single largest manufacturing scale-up risk
        - id: cas
          label: Control Actuation System (CAS)
          sublabel: In-house design; controls aerodynamic surfaces during boost and glide
          role: Provides precise attitude control throughout flight; interfaces with GNC for steering commands
          status: validated
          detail: Validated across 25+ flight tests; specific actuator supplier and lead-time data not public.
          dependency: Commercial/defense actuator motors; electronics from domestic supply chain
          risk: Supplier concentration not disclosed
        - id: seeker-gnc
          label: Multi-Mode EO Seeker + GNC System
          sublabel: Inertial + celestial mid-course; EO terminal seeker; in-flight re-targeting
          role: Navigation and terminal guidance for moving and hardened targets; ITAR Category IV
          status: validated
          detail: >-
            Mid-course: inertial + celestial updates. Terminal: multi-mode EO seeker capable of mid-flight target
            update. Validated in flight test for moving-target tracking.
          dependency: EO detector from defense supply chain (ITAR IV); GPS augmentation optional
          risk: ITAR IV export control limits FMS; countermeasure resistance not confirmed
        - id: fpga-avionics
          label: FPGA Avionics (Vitis HLS)
          sublabel: AMD/Xilinx FPGA; Vitis HLS workflow; Allen TX engineering hub
          role: Real-time sensor fusion, actuator command, and flight-critical computation
          status: in-development
          detail: >-
            FPGA design using Vitis High-Level Synthesis (HLS) workflow per job postings. Commercial silicon (not
            radiation-hardened) reduces cost and lead time vs. space-rated parts. HALT/HASS reliability testing
            underway.
          dependency: AMD/Xilinx FPGA supply chain; Vitis HLS software toolchain
          risk: Commercial FPGA not radiation-hardened; EMP/EMI vulnerability unassessed in public
        - id: flight-software
          label: Embedded Flight Software + Mission Stack
          sublabel: Real-time embedded OS; firmware to application; HIL simulation; GNC algorithms
          role: Executes navigation, GNC, health monitoring, mission management, and FTS arming/safing
          status: validated
          detail: >-
            Full software stack developed internally: low-level firmware on embedded microcontrollers, operating system,
            GNC algorithm layer, and mission software. Validated through hardware-in-the-loop simulation and 25+ flight
            tests. MIL-SPEC software qualification (DO-178C or equivalent) not confirmed.
          dependency: Internal team; real-time OS vendor; test infrastructure
          risk: DO-178C qualification status unknown; cybersecurity assessment not reported
    approximationNotes: >-
