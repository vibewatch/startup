      - number: '6.4'
        title: Department of War Production Framework and Procurement Horizon
        blocks:
          - type: paragraph
            body: >-
              The most consequential customer signal in Castelion's history arrived on May 13, 2026, when the Department
              of War announced a production framework agreement covering Castelion alongside four cruise missile
              companies under the Low-Cost Containerized Missiles program. The DoW stated that once Castelion achieves
              testing and validation, the department will award a two-year multi-year procurement contract for a minimum
              of 500 Blackbeard missiles annually, with options to extend up to five years. Additionally, the DoW
              declared it is "actively seeking the necessary authorizations and appropriations to purchase over 12,000
              Blackbeard missiles over five years." This is the first time the U.S. government has publicly committed to
              hypersonic production at this scale, and it is entirely conditional: no binding production order has been
              placed, no purchase order has been executed, and the entire framework depends on successful completion of
              the ongoing integration, testing, and validation schedule. Nevertheless, the framework does establish firm
              fixed material-unit costs for production lots in 2027 through 2029, providing pricing predictability ahead
              of formal appropriations. The Air Force's original SBIR topic AF231-D026 continues to serve as the legal
              contracting vehicle across all three services under SBIR Phase III, enabling sole-source awards without
              competitive re-solicitation. The DoW's framing is explicitly strategic: it describes this as part of the
              "Arsenal of Freedom" mandate from President Trump and Secretary Hegseth, and frames Castelion as a new
              industrial base partner distinct from legacy prime contractors. This is important context for evaluating
              retention risk: the political and institutional momentum behind Blackbeard procurement is unusually high
              for a program still in prototype testing, but programmatic and budgetary commitments can be reversed by
              Congress, administration changes, or testing failures.
