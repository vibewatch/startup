      - number: '7.6'
        title: Mitigations, Kill Criteria, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Despite the risk profile above, Castelion has several structural mitigations: a signed DoW production
              framework agreement provides conditional revenue visibility at 500+ missiles per year; multi-service
              integration (Army and Navy) diversifies program concentration; vertical integration at Project Ranger
              reduces external SRM dependency; the SpaceX-alumni team has a demonstrated record of executing at speed;
