  - id: FE002
    title: Customer Workflow — Hypersonic Strike Mission Execution
    type: flow
    layout: wide
    summary: >-
      Maps the operational workflow from threat identification through Blackbeard delivery, showing the role Castelion's
      weapon plays at each stage and the integration touchpoints with existing military systems.
    data:
      nodes:
        - id: threat-detect
          label: Threat Detection / Targeting
          detail: >-
            Intelligence, surveillance, and reconnaissance (ISR) systems—satellites, UAVs, JTARS—identify time-sensitive
            moving target or hardened fixed target. Target coordinates passed to fire-control.
          tone: neutral
        - id: fire-control
          label: Fire Control Authorization
          detail: >-
            Army AFATDS, Marine MAGTF AFATDS, or Joint Fires Network receives digital call-for-fire with target
            coordinates. Blackbeard's open fire-control interface accepts standard CFF script without bespoke
            middleware. Navy variant coordinated through carrier strike group LINK-16.
          tone: neutral
        - id: weapon-load
          label: Weapon Load / Platform Prep
          detail: >-
            Navy: Blackbeard loaded on F/A-18E/F wing station (or F-35C internal bay, future). Carrier deck operations
            require NAVAIR NOSSA/WSESRB certification (not yet complete). Army: Blackbeard GL loaded in HIMARS MFOM pod;
            designed for reload time equal to standard GMLRS pod swap (<8 min target).
          tone: neutral
        - id: launch
          label: Launch (Air or Ground)
          detail: >-
            Navy F/A-18: air-launched from carrier or land base. Army HIMARS: salvo capability of 2 rounds/pod, 4
            rounds/truck; a battery of 8 launchers could salvo 32 hypersonic shots. CAML-M (future): crew walks away;
            autonomous launch under satellite relay control.
          tone: positive
        - id: boost-glide
          label: Boost / Hypersonic Glide Phase
          detail: >-
            Solid rocket motor burns ~12 seconds to push vehicle above Mach 5. Post-stage separation, aeroshell sheds
            and wedge-shaped glide body follows depressed trajectory below traditional ballistic arc. Inertial +
            celestial navigation in mid-course. Speed and trajectory profile compress adversary detect-to-react cycle
            from minutes to tens of seconds.
          tone: positive
        - id: terminal
          label: Terminal Guidance and Strike
          detail: >-
            Multi-mode EO terminal seeker acquires and tracks target in final phase. Mid-flight re-targeting supports
            time-sensitive movers (TELs, ships, C2 vehicles). CEP <2 m at 600 km claimed (design target from
            defense-aerospace.com; not independently validated). Strike warhead: 75 lb (Navy) or 220 lb
            unitary/penetrator (Army GL design target).
          tone: positive
        - id: battle-damage
          label: Battle Damage Assessment
          detail: >-
            Post-strike BDA conducted via ISR. No Castelion-specific BDA technology; relies on existing joint ISR
            architecture. Magazine replenishment depends on Project Ranger production capacity (thousands/year target)
            and logistics chain from NM.
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE009
      - CE010
      - CE024
      - CE025
