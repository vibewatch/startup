      - number: '5.2'
        title: Weapon System Architecture and Subsystems
        blocks:
          - type: paragraph
            body: >-
              Blackbeard's weapon system architecture is defined by the vertical integration of six core subsystems that
              Castelion designs and manufactures in-house: solid rocket motor propulsion, control actuation systems
              (CAS), flight computers, multi-mode seekers, thermal protection materials, and mission software. This
              approach eliminates dependence on the traditional defense prime-subcontractor supply chain and is the
              primary mechanism by which Castelion compresses lead times and reduces per-unit cost relative to
              incumbents. The propulsion system is a solid-fueled rocket; the ground-launched variant uses a two-stage
              configuration with the launch motor burning for approximately 12 seconds to push the glide body above Mach
              5, after which aeroshell separation occurs and the wedge-shaped glide body follows a depressed trajectory
              that complicates radar tracking and shortens the reaction time available to point defense systems.
              Guidance, navigation, and control (GNC) uses inertial navigation with celestial updates in the mid-course
              phase, transitioning to a multi-mode electro-optical (EO) terminal seeker for final engagement of moving
              and hardened targets. The seeker is capable of mid-flight update to re-target against time-sensitive
              moving targets. Avionics are built around field-programmable gate array (FPGA) processing using the Vitis
              HLS (High-Level Synthesis) workflow from AMD/Xilinx, enabling high-performance, reconfigurable computing
              for sensor fusion, actuator control, and GNC algorithm execution. Embedded flight software spans the full
              stack from low-level firmware on microcontrollers to application-level GNC algorithms, validated through
              hardware-in-the-loop (HIL) simulation. Thermal protection for the nose tip uses a siliconized
              carbon-carbon layup material capable of surviving temperatures above 2,400°C, cured in a small autoclave
              adapted from rocket-engine nozzle manufacturing tooling. A Flight Termination System (FTS) is required for
              all HIMARS range operations and is in development to qualify the weapon for the Army's HIMARS fire control
              system. Automotive-grade components replace traditional space-rated hardware where feasible; the COO Sean
              Pitt has cited that this cuts component lead time from 52 weeks (space-rated) to weeks, with comparable
              reliability backed by tens of billions of dollars in commercial validation investment annually.
