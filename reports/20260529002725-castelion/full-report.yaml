  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Government Contract Structure
        blocks:
          - type: paragraph
            body: >-
              Castelion operates as a pure-play U.S. government defense contractor with no commercial revenue. Every
              dollar earned flows from DoD contracts awarded under firm-fixed-price terms, primarily through the Small
              Business Innovation Research (SBIR) Phase III contracting vehicle, which allows non-traditional defense
              vendors to contract on a sole-source basis. The company's disclosed revenue trajectory is steep: a first
              $5M contract in May 2023 has escalated to a cumulative military contract base exceeding $100M by December
              2025 and nearly $155M in executed Navy contract value by April 2026. The February 2026 contract award
              (N6833526F1022) totaled $49,998,005 for full-scale Blackbeard prototypes, flight testing, and early
              operational capability under the Navy's Multi-mission Affordable Capacity Effector (MACE) program. In
              April 2026, a $104,998,566 option modification to the same contract was executed for final integration,
              live-fire testing in the Indo-Pacific Command area, and early operational capability requirements.
              Third-party revenue aggregators estimate Castelion's annual revenue at approximately $51.5M as of
              September 2025, consistent with a scaling prototyping revenue profile. The May 2026 Department of War
              production framework—guaranteeing a minimum of 500 Blackbeard missiles per year once testing and
              validation is complete, with options to purchase over 12,000 missiles across five years—represents the
              first revenue-model transition event from development to production contracting. This framework has not
              yet converted to a binding multi-year procurement contract; that conversion is contingent on completing
              the ongoing test and integration schedule.
