      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Government Demand Is the Foundation of the Bull Case
            body: >-
              The DoD has no affordable, high-volume, air-launched hypersonic strike weapon in its current inventory or
              imminent acquisition pipeline at Castelion's price point. The May 2026 DoW production framework, the April
              2026 $105M Navy MACE integration contract, and the $3.9B FY2026 DoD hypersonic allocation together
              represent the most concrete demand validation any U.S. defense startup has secured at Castelion's stage.
              The VC funding surge of $29B into defense tech in 2025 — and Altimeter Capital's and Lightspeed's
              co-leadership of the round — reflects broad investor recognition that the procurement reform cycle is
              real. For investors who can sustain a 5–7 year hold, the addressable revenue at full production is large
              enough to generate significant returns even from the current $2.8B entry.
            calloutType: strength
            claimRefs:
              - CV015
              - CV017
              - CV018
              - CV021
              - CV037
              - CV044
          - type: callout
            title: 54× Revenue Multiple Prices In Production Economics That Do Not Yet Exist
            body: >-
              The $2.8B Series B valuation is justified only by a revenue multiple of approximately 54× trailing
              estimated revenue — more than double the 23–28× range at which Anduril and Shield AI trade, and nearly six
              times the 9–12× public market multiple for Kratos. This premium is a bet on production-scale revenue that
              is contingent on a non-binding framework converting to a production contract, a $220M factory build
              completing on schedule, and gross margins proving out at a price point that has never been validated at
              production scale. The War Zone and Army budget documents independently note uncertainty about Blackbeard's
              hypersonic credentials, which is the defining attribute underpinning its budget line. Investors entering
              at the current price bear all three of these execution risks with no margin of safety from the comparable
              set.
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV023
              - CV024
              - CV026
              - CV027
              - CV028
          - type: callout
            title: Track — Three Conditions Would Upgrade to Buy
            body: >-
              The Track recommendation reflects high conviction in the team, market, and government sponsorship, offset
              by a stretched entry multiple and material unresolved risks. The recommendation upgrades to Buy when at
              least one of the following is confirmed: (1) the DoW production framework converts to a binding multi-year
              purchase contract with committed funding, (2) gross margin at production scale is disclosed and confirmed
              at 20% or above, or (3) the entry valuation retreats to below 35× trailing revenue in a subsequent round
              or secondary market transaction. Investors with data room access who can confirm favorable gross margin
              and production contract conversion simultaneously would have a materially stronger basis for a Buy
              decision today.
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV036
          - type: callout
            title: Defense Tech Multiple Inflation Creates Sector-Wide Compression Risk
            body: >-
              The 2025–2026 defense tech VC cycle elevated multiples across the sector: $29B invested in 2025, nearly
              triple 2020 levels, drove Anduril from $14B to $61B in twelve months and Shield AI from $5.3B to $12.7B in
              the same period. Castelion's 54× multiple is the product of this environment. If procurement reform
              stalls, defense budget growth slows, or one of the leading defense startups misses a revenue milestone,
              the sector-wide multiple compression would affect all private holdings including Castelion. PwC and S&P
              Global both flag this as a structural risk for the cohort: defense tech multiples will compress toward
              Kratos-style levels as production-stage companies mature and public market investors apply EBITDA
              discipline.
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV044
