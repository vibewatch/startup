      - number: '5.6'
        title: Trust, Safety, Quality, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Castelion's compliance obligations are dominated by munitions safety certification, export control, and
              environmental permitting. For the Navy carrier-aviation pathway, the primary gates are NAVAIR NOSSA (Naval
              Ordnance Safety and Security Activity) review and WSESRB (Weapon Systems Explosives Safety Review Board)
              certification, which are mandatory before Blackbeard can be cleared for carrier storage, loading, and
              flight operations. FY2026 reconciliation bill language explicitly allocated $89M to "complete vendor
              development, government integration costs, NOSSA/WSESRB certifications and range/flights in support of
              minimum EOC configuration," confirming these reviews are incomplete as of May 2026. For the Army HIMARS
              integration, a Flight Termination System (FTS) must be designed, built, and qualified before range safety
              allows live-fire tests; this is in development. Castelion operates Environmental, Health, and Safety (EHS)
              programs at Torrance (HQ) and Rio Rancho (Project Ranger) covering ammonium perchlorate (AP) handling,
              aluminum powder fuel, composite-fiber manufacturing, and fire suppression protocols for energetic
              materials (water cannot be used on AP/aluminum fires). At Project Ranger, Castelion has acknowledged that
              ammonium perchlorate—the oxidizer for solid rocket motors—requires strict perchlorate containment and
              groundwater monitoring to protect the Santa Fe Group aquifer that supplies Rio Rancho drinking water.
              Hundreds of residents raised formal concerns at October and December 2025 community meetings about
              perchlorate contamination, noise from static-fire tests, PFAS risk in firefighting foam, and construction
              runoff. As of May 2026, Castelion has not obtained all Project Ranger environmental permits. MIL-SPEC
              qualification of production hardware has not been publicly confirmed; the program remains in prototype and
              pre-EOC status. No cybersecurity audit by DoD or independent party has been publicly reported. There are
              no publicly reported safety incidents, test failures with injuries, or product recalls.
