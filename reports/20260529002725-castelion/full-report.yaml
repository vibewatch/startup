  - id: FV003
    title: 'Valuation and Return Range: Bull / Base / Bear'
    type: range
    layout: wide
    summary: >-
      Exit valuation range and implied return on the $2.8B Series B entry price across the three scenario paths, using a
      2029–2030 exit horizon and revenue-multiple assumptions consistent with the comparable set.
    data:
      items:
        - label: Bear case exit valuation (USD millions)
          low: 1000
          high: 2000
          mid: 1500
          detail: >-
            Test failure or production delay; no production contract revenue by 2027; down round at $1–2B implied.
            Return on $2.8B entry: (0.64×) to (0.36×), i.e., 36–64% capital loss.
        - label: Base case exit valuation (USD millions)
          low: 5000
          high: 8000
          mid: 6500
          detail: >-
            DoW framework converts; ramp to 500–1,000 missiles/yr by 2027; Series C needed; IPO or strategic exit
            2029–2031. Return on $2.8B entry: 1.8× to 2.9× (implied IRR ~13–22% over 5–6 years).
        - label: Bull case exit valuation (USD millions)
          low: 15000
          high: 37000
          mid: 22000
          detail: >-
            Full DoW framework conversion; 3,000+ missiles/yr by 2030; IPO at 10–15× fwd revenue on $1.5–2.5B. Return on
            $2.8B entry: 5.4× to 13.2× (implied IRR ~35–55% over 4–6 years).
    approximationNotes: >-
      All valuations are scenario-modeled estimates, not company-provided guidance or analyst targets. Exit multiples
      are based on the Anduril/Shield AI/Kratos comparable set as of May 2026. Dilution from a Series C (base case) is
      estimated at 15–25% and not reflected in the implied returns shown above; actual returns will be lower by the
      dilution amount.
    claimRefs:
      - CV019
      - CV031
      - CV032
      - CV035
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring across eight investment dimensions (1–10 scale), weighting market proof, execution evidence, and
      risk-adjusted valuation. Scores are qualitative composites based on publicly available evidence only; private data
      access would likely move Financial Health and Production Economics scores in either direction.
    data:
      items:
        - label: Market Size and Funding
          value: 9/10
          description: >-
            $3.9B FY2026 DoD hypersonic budget; $8.6B global market growing >10% CAGR; DoD seeking 12,000+ missiles over
            5 years. Strong, funded, and durable demand.
        - label: Management Quality
          value: 8/10
          description: >-
            Three SpaceX veterans with execution pedigrees in government sales, international deals, and aerospace M&A.
            25+ flight tests in <3 years is unprecedented for a startup defense manufacturer.
        - label: Customer Proof
          value: 7/10
          description: >-
            $155M+ in executed Navy contracts plus DoW framework; Army $25M earmark; single-customer concentration (100%
            DoD) is a risk not reflected in the raw contract figure.
        - label: Competitive Moat
          value: 7/10
          description: >-
            First-mover in affordable air-launched hypersonic manufacturing; Project Ranger creates durable production
            capacity barrier; SBIR Phase III awards provide competitive insulation. ARRW revival reduces exclusivity.
        - label: Product Maturity
          value: 6/10
          description: >-
            25+ development flight tests; MACE integration contract awarded; live-fire test in Indo-Pacific theater
            pending. Hypersonic label not independently confirmed; production-representative design not yet finalized.
        - label: Business Model Durability
          value: 5/10
          description: >-
            Government-only revenue on firm-fixed-price contracts is high-quality once production is established, but
            100% customer concentration and unproven production margins are material risks.
        - label: Financial Health
          value: 4/10
          description: >-
            No disclosed gross margin, burn rate, or P&L. Estimated $51.5M revenue on $504M raised implies limited
            near-term self-funding capacity. Project Ranger requires ~$220M in capex on top of operational burn.
        - label: Valuation Reasonableness
          value: 3/10
          description: >-
            ~54× trailing revenue vs. 23–28× for Anduril and Shield AI; requires flawless execution of a non-binding
            production framework. Most stretched entry multiple in the comparable set.
    approximationNotes: >-
      Scores are qualitative (1–10 scale) based on publicly available evidence as of May 2026; not actuarial, not
      company-verified. Scores are not comparable across reports or companies. Private financial data access would most
      likely change Financial Health and Business Model Durability scores significantly.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV023
      - CV026
      - CV040
      - CV041
