      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Castelion was co-founded by three former SpaceX alumni, each bringing complementary expertise to the
              company. Bryon Hargis, CEO and co-founder, previously served as Government Sales Director at SpaceX,
              managing national security satellite programs and building a multi-billion-dollar defense pipeline. He
              holds an M.S. in Applied Physics from Johns Hopkins University and a B.S. in Mechanical Engineering from
              Georgia Tech. Sean Pitt, COO and co-founder, led SpaceX's European commercial launch and human spaceflight
              sales, executing over $1.25 billion in export deals, bringing deep knowledge of complex international
              defense sales and operations. Andrew Kreitz, CFO and co-founder, led launch forecasting and government
              cost proposals at SpaceX and was previously a Vice President at Goldman Sachs focusing on aerospace and
              defense mergers and acquisitions, giving the company an unusual combination of financial rigor and defense
              program expertise. All three departed SpaceX in November 2022 to co-found Castelion. The leadership team
              has since grown to include experienced engineers and operators from SpaceX's Falcon 9 and Dragon capsule
              programs as well as veterans from legacy contractors including Lockheed Martin and Raytheon. The board
              structure is not publicly disclosed. Castelion's investors—including Altimeter Capital, Lightspeed Venture
              Partners, and Andreessen Horowitz—likely hold board observer or director seats commensurate with their
              investment positions, but this has not been confirmed in public sources. Key-person dependence is elevated
              given the founding team's centrality to government relationship management and the company's early-stage
              operational maturity.
