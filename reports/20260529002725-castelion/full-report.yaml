      - number: '7.5'
        title: People, Execution, and Financial Risks
        blocks:
          - type: paragraph
            body: >-
              Castelion's executive concentration in three co-founders—CEO Bryon Hargis, COO Sean Pitt, and CFO Andrew
              Kreitz—constitutes a meaningful key-person risk. Each founder brings a unique and difficult-to-replace
              skill set: Hargis manages the government relationship pipeline and contract strategy; Pitt leads
              operations and large-scale manufacturing execution; Kreitz owns capital structure, fundraising, and
              financial modeling. No public succession plan, key-person insurance, or named deputies have been
              disclosed. IPO Club's secondary market analysis notes that Castelion's investor confidence and government
              credibility are substantially tied to this specific founder team's SpaceX pedigree and existing DoD
              relationships. Engineering talent acquisition risk is elevated: solid rocket motor and hypersonic systems
              engineers require security clearances, specialized materials-science expertise, and practical experience
              that the broader tech talent market cannot easily supply. Defense tech hiring surged in 2025–2026, with
              multiple well-funded startups competing for the same cleared engineering workforce. On the financial side,
              Castelion has not disclosed revenue run rate, gross margin, burn rate, or operating runway. The company is
              pre-production-revenue, funded by contract milestone payments and the $464 million in equity and debt
              raised since 2022. The $30 million SVB venture debt tranche carries standard covenant risks and may
              require refinancing. Competition from Anduril Industries (which raised $5 billion in May 2026 at a $61
              billion valuation) and from established primes on adjacent affordable-munitions programs adds resource and
              talent competition pressure. The DoD's LCCM program signed framework deals with Anduril, Leidos, and
              others in May 2026, signaling that affordable-munitions competition is intensifying.
