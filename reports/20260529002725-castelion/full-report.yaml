      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst lenses converge on a global hypersonic weapons market of approximately $7.82 billion in
              2025, growing to $8.64 billion in 2026 at a compound annual growth rate of 10.5%, and projected to reach
              $12.76 billion by 2030 (The Business Research Company). A broader estimate from Mordor Intelligence that
              bundles supersonic and hypersonic segments together puts the combined market at $22.77 billion in 2026—a
              methodologically distinct number that overstates the purely hypersonic opportunity. Fortune Business
              Insights estimates the hypersonic missiles sub-segment (excluding glide vehicles) at $6.56 billion in
              2026, growing at 13.3% CAGR through the early 2030s.

              The U.S. is the single largest national market. Market Research Future estimates the U.S. hypersonic
              weapons segment at ~$2.8 billion in 2025, growing to approximately $8.5 billion by 2035 at a CAGR of
              ~11.7%. North America as a whole accounts for an estimated 50–60% of global hypersonic procurement,
              anchored almost entirely by DoD spending. The FY2026 DoD budget allocates approximately $3.9 billion
              specifically for hypersonic programs across the Army, Navy, and Air Force—confirming U.S. dominance as the
              buyer and validating the TAM range.

              Castelion's serviceable addressable market (SAM) is the set of DoD procurement programs for which
              Blackbeard is technically and programmatically eligible. The clearest near-term anchor is the Navy's MACE
              program: 4,500 air-launched hypersonic missiles over FY2027–2031 at an average unit cost of ~$384,000,
              representing an implied ~$1.6 billion procurement block. Layering in the Department of War framework
              agreement (12,000 Blackbeard missiles over five years at a minimum of 500 units annually, at prices not
              yet publicly confirmed but implied near $350,000–$384,000/unit) yields a SAM of approximately $5.5–6.1
              billion if all procurement options are exercised. Army integration spending (FY2026 budget of $25 million
              for HX3/HIMARS work) is a smaller, more nascent channel. Castelion's SOM in the 2026–2028 horizon is
              constrained by its own manufacturing ramp: Project Ranger (Sandoval County, NM) targets thousands of
              missiles per year by end of 2027, implying a 2027 SOM of roughly $300–500 million if the FY2027 MACE lot
              of 353 units ($156 million) is executed and the DoW framework initiates. These are company-implied figures
              and cannot be independently confirmed from public data.
