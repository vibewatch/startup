      - number: '1.3'
        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >-
              Castelion has raised approximately $464 million across multiple rounds since its founding. The company's
              first external capital came from Alex Poulin's Lavrock Ventures, which invested $2 million in April 2023
              after witnessing the founders' persistence through early bootstrap operations in Los Angeles-area
              warehouses and machine shops. Within one month of that first investment, Castelion won a $5 million
              government contract—its first—on its initial submission. A formal Seed round of $14.2 million was
              announced in October 2023, co-led by Andreessen Horowitz (a16z) and Lavrock Ventures, with participation
              from First In, BlueYard Capital, and Champion Hill Ventures. In January 2025, Castelion announced a $100
              million financing comprising $70 million in Series A equity led by Lightspeed Venture Partners with
              participation from a16z, Lavrock Ventures, Cantos, First In, BlueYard Capital, and Interlagos, plus $30
              million in venture debt from Silicon Valley Bank (final close February 2025). On December 5, 2025,
              Castelion announced its Series B round of $350 million, led by Altimeter Capital and Lightspeed Venture
              Partners with participation from Lavrock Ventures, Andreessen Horowitz, General Catalyst, First In, Space
              VC, Cantos, BlueYard, Avenir, Champion Hill, and Interlagos. The Series B valued Castelion at
              approximately $2.8 billion. Total capital raised stands at approximately $464 million (equity plus debt).
              The rapid valuation trajectory—from first external capital in April 2023 to a $2.8 billion valuation 32
              months later— reflects strong government contract momentum, multiple successful flight test campaigns, and
              broad institutional investor confidence in the company's technical and manufacturing approach.
