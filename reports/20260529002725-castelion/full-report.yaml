  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Castelion
      - Diligence Ask
    rows:
      - - China DF-17 / DF-ZF operational deployment
        - Driver
        - Active now
        - Core policy rationale for U.S. hypersonic procurement urgency; directly supports program priority
        - Confirm whether DoD threat assessment explicitly cites Blackbeard-class capability as counter
      - - Russia Kinzhal / Avangard / Zircon operational systems
        - Driver
        - Active now
        - Secondary rationale; reinforces bipartisan Congressional consensus for hypersonic spending
        - Verify extent to which Russia threat drives Atlantic vs. Pacific posture budget
      - - U.S. missile stockpile depletion from Iran conflict
        - Driver
        - 2025–2026 urgency
        - Accelerates near-term procurement timelines; makes the 10,000+ missile plans politically viable
        - Confirm actual stockpile levels and whether Blackbeard qualifies as replenishment munition
      - - Arsenal of Freedom / DoD acquisition transformation
        - Driver
        - 2025–2028
        - Policy tailwind; Other Transaction Authority removes traditional acquisition barriers for new entrants
        - Assess durability if political leadership changes; OTA contracts can be contested
      - - Affordable mass production imperative ($384K target)
        - Driver
        - 2026–2031
        - Creates structural market advantage for Castelion vs. incumbents whose legacy cost architecture is far higher
        - Verify that $384K target is firm-fixed and not subject to cost growth in production
      - - Hypersonic materials / thermal protection supply chain constraints
        - Constraint
        - 2026–2028
        - Could delay Project Ranger ramp and limit production volumes below demand; key risk to SOM realization
        - Audit supplier list for thermal protection materials, SRM propellant, and seeker components
      - - Scarce hypersonic test range capacity
        - Constraint
        - Ongoing
        - Slows certification cadence; any range scheduling failure delays EOC and procurement
        - Review Castelion's test range reservation agreements and backup range options
      - - Navy airworthiness certification process
        - Constraint
        - 2026–2027 gate
        - Single most critical near-term gate; failure or anomaly could delay procurement by 12–24 months
        - Confirm status of safety review and any open test anomalies from FY2026 campaign
      - - Congressional authorization for 12,000-unit multi-year buy
        - Constraint
        - FY2027 NDAA cycle
        - Unresolved; DoW framework requires appropriations that have not yet cleared Congress
        - Track NDAA FY2027 markup for Blackbeard multi-year procurement language
      - - ITAR / export control regime
        - Constraint
        - Ongoing
        - Limits supplier pool diversification and potential FMS sales to allies without waivers
        - Assess whether any subsystem is sourced from restricted jurisdictions
      - - Arms control / escalation risk policy concerns
        - Constraint
        - Emerging
