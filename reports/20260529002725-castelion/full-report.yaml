chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Founding
        blocks:
          - type: paragraph
            body: >-
              Castelion is a privately held defense technology company headquartered in Torrance, California, with
              additional engineering, manufacturing, and test operations in Los Angeles County (California), Midland
              (Texas), Allen (Texas), and a Washington D.C. policy office. The company also operates a new 1,000-acre
              solid rocket motor manufacturing campus in Rio Rancho, Sandoval County, New Mexico, known as Project
              Ranger. Castelion was founded in November 2022 by three former SpaceX executives who left the company
              together to address what they describe as a critical gap in U.S. conventional deterrence: the absence of
              affordable, mass-producible hypersonic long-range strike weapons. The company's mission is to restore
              America's hypersonic manufacturing capacity against adversaries China and Russia, which have deployed
              operational hypersonic systems ahead of the United States. Castelion operates as a hardware-intensive,
              vertically integrated manufacturer, applying the SpaceX "build fast, test often" philosophy to the defense
              sector. The company's first and primary product is the Blackbeard hypersonic strike weapon, engineered
              from inception for industrial-rate output and commercial unit cost. Castelion's stated goal is to achieve
              production of more than 1,000 Blackbeard missiles per year once Project Ranger is fully operational, and
              eventually scale to thousands per year to provide the U.S. and its allies with meaningful magazine depth.
