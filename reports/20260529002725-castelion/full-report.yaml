      - number: '8.4'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              Castelion's revenue multiple is the highest among the peer set on a trailing-revenue basis, reflecting the
              market's forward bet on production-scale revenue that does not yet exist in reported figures. The most
              instructive comparables are private defense tech startups that have recently raised rounds in the same
              capital environment. Anduril Industries raised $5 billion in Series H in May 2026 at a $61 billion
              valuation — approximately 27.7× trailing 2025 revenue of $2.2 billion — after more than doubling revenue
              year-over-year and securing a $20 billion Army enterprise contract. Shield AI raised $1.5 billion Series G
              in March 2026 at $12.7 billion — approximately 23.5× projected 2026 revenue of $540 million-plus. Hermeus,
              a direct hypersonic technology peer, reached $1 billion in valuation in April 2026 after raising $350
              million Series C; Hermeus has no production revenue, making its per-flight-test implied value a better
              analog for Castelion's pre-production premium. Among public companies, Kratos Defense (KTOS), the nearest
              public comparable — a mid-tier defense hardware company scaling unmanned systems and hypersonic subsystems
              — trades at approximately 9–12× EV/revenue on $1.347 billion in 2025 revenue. Large defense primes
              (Lockheed Martin at 1.8×, RTX at 3.0×, Northrop Grumman at 2.3×) are structural floor comparables at
              maturity, not appropriate targets for a pre-production startup. The core valuation question is not whether
              Castelion's revenue multiple is higher than Anduril's or Kratos' — it is — but whether the forward
              production contract pipeline justifies the current premium. If the DoW framework converts and
              ramp-to-scale proceeds as outlined, the implied $2.8 billion entry price may look attractive at a Series B
              stage. If it does not, the multiple compresses severely against any achievable near-term revenue base.
