              a categorical test failure of Blackbeard during 2026 Army or Navy qualification campaigns that is not
              recoverable within 12 months, or a Congressional failure to appropriate the DoW production order within
              two budget cycles. A construction injunction on Project Ranger by New Mexico courts would also extend the
