      - number: '7.2'
        title: Regulatory, Legal, and Environmental Risks
        blocks:
          - type: paragraph
            body: >-
              Project Ranger, Castelion's 1,000-acre solid rocket motor production facility in Sandoval County, New
              Mexico, presents the most complex near-term risk cluster. The facility will manufacture and test solid
              rocket motors using ammonium perchlorate (AP), aluminum powder, and energetic additives— substances with
              well-documented groundwater contamination legacies at comparable U.S. defense sites. The Santa Fe Group
              aquifer beneath the West Mesa supplies drinking water to approximately one million people in the
              Albuquerque Basin; once contaminated with AP, remediation is prohibitively expensive and may be
              practically impossible, as illustrated by the decades-long contamination saga at Naval Surface Warfare
              Center Indian Head, Maryland. Community advocacy organization Common Ground Rising has filed complaints
              with the New Mexico Department of Justice and the GAO alleging that Sandoval County approved the Project
              Ranger LEDA subsidy without a legally required public hearing and without adequate environmental review.
              An environmental plume study with Sandia National Laboratories was still incomplete as of December 2025. A
              fire code variance removing sprinklers and hydrants inside hazardous buildings has drawn additional
              scrutiny. Castelion faces active ITAR compliance obligations on all Blackbeard technical data, and the
              FY2026 NDAA and Outbound Investment Security Program explicitly designate hypersonic systems as a
              sensitive technology category under CFIUS review, adding investor diligence requirements to every future
              financing round. No litigation against Castelion has been confirmed in public records as of the run date,
              but the NM DOJ complaints create a pathway to construction injunctions or permit revocations that could
              materially delay Project Ranger's 2026 target operational timeline.
