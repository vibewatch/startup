  - id: valuation-context
    title: Valuation Context and Financing Structure
    body: >-
      Castelion raised $350 million in Series B financing on December 5, 2025, co-led by Altimeter
      Capital and Lightspeed Venture Partners, with participation from Andreessen Horowitz, General
      Catalyst, Lavrock Ventures, First In, Space VC, Cantos, BlueYard, Avenir, Champion Hill, and
      Interlagos. The round establishes an implied post-money valuation of approximately $2.8 billion.
      Total capital raised across all rounds stands at approximately $504 million, encompassing the
      initial $2 million seed from Lavrock Ventures (April 2023), the $100 million Series A (January
      2025; $70 million equity plus $30 million venture debt from SVB), and the $350 million Series B.
      The Series B is, on available evidence, the largest single funding round raised by a U.S.
      hypersonic weapons startup at that date. Third-party revenue aggregators — CompWorth, Growjo,
      and GetLatka — converge on approximately $51.5 million in annual revenue as of September 2025,
      consistent with the company's scaling government contract base. Revenue per employee is estimated
      at $515,000 on a 100-plus employee base. The $2.8 billion valuation implies a trailing revenue
      multiple of approximately 54×, compared to the 23–28× range observed at the time for Anduril and
      Shield AI. Neither the preference stack, liquidation waterfall, nor cap table structure has been
      publicly disclosed, which means investors cannot independently assess the effective entry price
      relative to ordinary common. No secondary market or tender offer transactions providing a
      third-party mark on Castelion's valuation were identified in public sources as of the report date.
