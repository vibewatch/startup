figures:
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Chain from market scale through product validation, customer proof, financial picture, risk
      profile, and valuation assessment to the Track recommendation. Each node summarizes the
      key evidence and verdict for that dimension.
    data:
      nodes:
        - id: market
          label: Market Opportunity
          detail: >-
            Global hypersonic weapons market $8.6B in 2026, growing >10% CAGR; U.S. DoD
            FY2026 hypersonic allocation $3.9B; DoD seeking 12,000+ Blackbeard missiles
            over five years. Verdict: STRONG.
          tone: positive
        - id: product
          label: Product Validation
          detail: >-
            25+ flight tests in <3 years; 20+ in 2025 alone validating SRMs, seekers, CAS,
            flight computers, TPS, and mission software. Hypersonic label not independently
            confirmed in public sources. Verdict: ADVANCING but not fully de-risked.
          tone: neutral
        - id: customers
          label: Customer Proof
          detail: >-
            $155M+ in executed Navy contracts; $25M Army earmark; DoW production framework
            (500+ missiles/yr min); no commercial customers (100% DoD concentration).
            Verdict: STRONG but single-customer.
          tone: positive
        - id: financials
          label: Financial Picture
          detail: >-
            ~$51.5M estimated revenue; $504M total raised; $350M Series B (Dec 2025);
            gross margin, burn rate, and unit economics entirely undisclosed.
            Verdict: UNDISCLOSED — major diligence gap.
          tone: negative
        - id: risk
          label: Risk Profile
          detail: >-
            High: single customer (DoD), production framework not yet binding, $220M capex
            commitment, community opposition at Project Ranger, key-person concentration,
            ARRW competitor revival. Verdict: HIGH risk.
          tone: negative
        - id: valuation
          label: Valuation Assessment
          detail: >-
            $2.8B / ~$51.5M = ~54× trailing revenue; Anduril at 27.7×, Shield AI at 23.5×
            on much larger bases; Kratos public comp at 9–12×. Verdict: STRETCHED.
          tone: negative
        - id: recommendation
