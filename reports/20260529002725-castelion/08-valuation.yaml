chapter:
  number: 8
  title: Valuation
  summary: >-
    Castelion's December 2025 Series B implies a $2.8 billion valuation on approximately $51.5 million
    in estimated annual revenue — a ~54× trailing revenue multiple that sits materially above the 23–28×
    range observed for comparable private defense tech peers (Anduril, Shield AI) with larger revenue
    bases and more mature contracts. The investment thesis is supported by a structurally funded market,
    a documented first-mover position in affordable hypersonic production, and an exceptional SpaceX-
    derived team that has moved from founding to 25+ flight tests in under three years. The anti-thesis
    centers on the DoW production framework remaining a non-binding demand signal, absent production
    economics, a single-customer revenue model, and a headline multiple that builds in near-flawless
    execution through 2028. A "Track" recommendation is warranted; the call improves to "Buy" if the
    production framework converts to a binding contract, gross margin data is disclosed at ≥20%,
    or the entry valuation retreats below 35× trailing revenue.
sections:
  - id: investment-recommendation
    title: Investment Recommendation and Conviction
    body: >-
      Castelion earns a Track recommendation at the December 2025 Series B entry price of approximately
      $2.8 billion. The conviction rests on four pillars that are well-evidenced: a generational and
      structurally funded hypersonic weapons market, a first-mover position with no current air-launched
      peer at the affordable price point, an operator team with SpaceX-caliber execution DNA, and a
      government demand signal — the May 2026 DoW production framework — that no comparable startup
      has secured this early. However, the entry multiple of approximately 54× trailing estimated revenue
      is aggressive against all public benchmarks for defense technology companies at any stage. The
      nearest private analogs — Anduril Industries at $61 billion on $2.2 billion in 2025 revenue
      (27.7×) and Shield AI at $12.7 billion on ~$540 million projected 2026 revenue (23.5×) — both
      carry materially lower multiples despite commanding substantially larger revenue bases, broader
      platform diversification, and longer production histories. The risk rating is High: three
      conditions — DoW framework conversion to a binding multi-year contract, first full-rate production
      lot delivered on schedule, and gross margin confirmation at scale — must all materialize before
      investors can confidently price the $2.8 billion entry as fair value. The valuation stance is
      Stretched. A transition to Buy requires at least one of: binding production contract execution,
      gross margin data disclosed at ≥20%, or entry price retreating to <35× trailing revenue.
      Defense technology investors with a long hold horizon and access to the operational data room
      should prioritize those three diligence triggers as gating conditions.
