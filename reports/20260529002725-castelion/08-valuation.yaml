  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: >-
        Gross margin per All Up Round at production scale (500, 1,000, and 5,000 units per year);
        current and projected bill-of-materials by subsystem; operating margin and EBITDA.
      whyItMatters: >-
        Without gross margin data, the $2.8 billion valuation cannot be adequately stress-tested.
        If gross margin is near zero at the $300K MACE target price, the investment thesis depends
        almost entirely on volume scale and sustained government commitment rather than product economics.
      diligencePath: >-
        Request a detailed production cost model (FY2025 actuals and FY2026–2027 projections) in
        the data room, including materials, propellant, electronics, labor, overhead, and amortized
        tooling and factory costs per unit at multiple production rate scenarios.
      relatedQuestionRefs:
        - QV009
        - QV030

    - type: private-evidence-only
      severity: blocking
      topic: capex
      missingEvidence: >-
        Monthly cash burn as of Q1 2026; cash balance after Series B close; Project Ranger capital
        already deployed versus remaining to be spent; FY2026 cash flow forecast.
      whyItMatters: >-
        If all $220 million of Project Ranger capex remains to be spent from the $350 million Series B
        proceeds, only approximately $130 million would be available for operations — potentially
        insufficient before the production contract execution and revenue inflection in FY2027.
      diligencePath: >-
        Request monthly management accounts from January–April 2026, a 24-month cash flow model, and
        Project Ranger construction schedule with committed purchase orders and capital-to-completion
        estimate in the data room.
      relatedQuestionRefs:
        - QV013

    - type: private-evidence-only
      severity: material
      topic: valuation-risk
      missingEvidence: >-
        Fully-diluted cap table, liquidation preference terms and multiples for each series, and any
        weighted-average anti-dilution provisions that could affect common equity returns.
      whyItMatters: >-
        At a $2.8 billion headline valuation, substantial liquidation preference overhang could mean
        common equity holders receive significantly less than the headline at exits below a 2–3×
        step-up. Without this data, the effective entry price cannot be determined.
      diligencePath: >-
        Request the capitalization table, investor rights agreement, and certificate of incorporation
        through the data room.
      relatedQuestionRefs:
        - QV008

    - type: missing-source
      severity: material
      topic: valuation-risk
      missingEvidence: >-
        Any secondary market transaction or tender offer process that provides a third-party mark
        on Castelion's valuation outside the Series B formal round; any secondary trades of Castelion
        shares on platforms such as Forge Global or EquityZen.
      whyItMatters: >-
        A secondary market mark would provide independent price discovery and confirm whether
        the $2.8 billion Series B price reflects durable conviction or was driven by the Series B
        investor consortium's specific thesis. Its absence means the only available price reference
        is the co-led round price.
      diligencePath: >-
        Search secondary trading platforms (Forge Global, EquityZen, Nasdaq Private Market) and
        request any tender offer documentation from the company.
      relatedQuestionRefs:
        - QV026
      relatedTableRefs:
        - TV004

    - type: private-evidence-only
      severity: material
      topic: technical-risk
      missingEvidence: >-
        Validated flight performance data confirming sustained Mach 5+ hypersonic velocity across
        operational test shots; complete development test record including any tests that did not
        meet objectives.
      whyItMatters: >-
        The War Zone and Army budget documents both raise uncertainty about whether Blackbeard
        achieves the strict hypersonic threshold. If Blackbeard is reclassified as a fast subsonic
        or supersonic weapon, the MACE program budget line and DoW framework may be jeopardized.
      diligencePath: >-
        Request the complete Castelion test campaign summary from the CEO and corroborate with the
        Navy and Army program executive offices under appropriate classification handling.
      relatedQuestionRefs:
        - QV016

