      - CV026
      - CV028
      - CV033

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Gross margin at production scale
        - "Gross margin per All Up Round at 500, 1,000, and 5,000 units per year; current and projected bill-of-materials by subsystem."
        - "Without gross margin data, the $2.8B valuation cannot be stress-tested; if margin is near zero at $300K/AUR, the thesis depends entirely on volume and government continuity, not product economics."
        - "Data room: request production cost model (FY2025 actuals + FY2026 estimate + steady-state projection). Owner: CFO (Kreitz)."
      - - Burn rate and cash runway post-Series B
        - "Monthly cash burn as of Q1 2026; cash balance post-Series B close; FY2026 cash flow forecast."
        - "Determines whether the $350M Series B is sufficient through Project Ranger commissioning and production contract milestone, or whether a bridge round is needed mid-year before revenue inflection."
        - "Data room: request monthly management accounts from January–April 2026 and a 24-month cash flow model. Owner: CFO."
      - - Project Ranger capex schedule and remaining obligation
        - "Capital already deployed into Project Ranger vs. remaining to spend; milestone-linked drawdown plan."
        - "If all $220M remains to be spent from the $350M Series B proceeds, only ~$130M is available for operations — potentially insufficient before production contract execution."
        - "Data room: request Project Ranger construction schedule, committed purchase orders, and capital-to-completion estimate. Owner: COO (Pitt)."
      - - Cap table and preference stack
        - "Fully-diluted cap table including all option pools, warrants, SAFEs, and convertibles; liquidation preference terms for each series."
        - "At a $2.8B headline valuation, substantial preference overhang could mean common equity and option holders receive significantly less than the headline at any exit below a 2–3× step-up."
        - "Data room: request the most recent capitalization table, investor rights agreement, and certificate of incorporation. Owner: General Counsel."
      - - Full flight test record
        - "Complete Blackbeard test campaign results, including any test articles that did not achieve flight objectives; flight performance data establishing sustained hypersonic velocity."
        - "The War Zone and Army budget documents both note uncertainty about whether Blackbeard achieves sustained Mach 5+; unconfirmed test failures could invalidate the MACE program budget line and the DoW framework."
        - "Request classified and unclassified test reports from the Navy and Army program offices; or request Castelion's internal test summary with flight-test data. Owner: CEO (Hargis) and relevant Program Executive Offices."
      - - Production contract conversion timeline
        - "Specific contractual conditions, milestones, and dates for DoW production framework to convert to a binding multi-year procurement contract."
        - "The framework's non-binding nature is the single largest source of valuation risk; understanding the conversion gate and whether any technical or political conditions are outstanding is essential before committing capital at $2.8B."
        - "Request the full DoW production framework agreement, including all conditions precedent, through the data room. Owner: CEO (Hargis); relevant DoD counterpart: Office of the Under Secretary of Defense for Acquisition."
      - - International sales and allied procurement potential
        - "Status of any allied government conversations (Australia, Japan, UK, ROK) about Blackbeard procurement; any export control restrictions affecting international sales."
        - "Allied procurements would represent a material revenue multiplier beyond the U.S. DoD SAM and could materially improve the bull-case return trajectory."
        - "Request any ITAR/EAR export license applications and records of international government discussions. Owner: COO (Pitt)."
    notes: "All items on this list are unresolvable from public sources as of the May 2026 report date; each requires secure data room access under an appropriate NDA."
