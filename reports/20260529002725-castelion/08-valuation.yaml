  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Live-fire test failure (MACE program)
        - "Any confirmed public failure of a Blackbeard flight test in the Navy MACE or Army HX3 programs that is attributed to weapon design (not range conditions)."
        - "Undermines all three bull-case assumptions; triggers production framework re-evaluation; potential program cancellation."
        - "Immediate position review; size down or exit before next funding round price discovery."
      - - DoW framework non-conversion
        - "Production framework not converted to binding multi-year purchase contract by Q2 FY2027 (June 2027)."
        - "Base case revenue trajectory collapses; $2.8B valuation unsupported; down-round scenario becomes modal."
        - "Treat as thesis break unless specific evidence of contract delay versus cancellation is provided with a revised timeline."
      - - Project Ranger construction delay
        - "First production building at Project Ranger not commissioned by Q1 2027 (vs. end-2026 plan)."
        - "Revenue ramp deferred; working capital and capex overhang increases; Series C needed sooner and at lower bargaining position."
        - "Elevate monitoring cadence; assess whether bridge financing has been secured."
      - - Co-founder departure
        - "Departure of two or more of the three co-founders (Hargis, Pitt, Kreitz) for any reason."
        - "Government relationship management, technical execution, and fundraising capability are co-founder-concentrated; succession risk is severe given 100-plus headcount and early stage."
        - "Requires immediate inquiry into retention plan, board composition, and leadership replacement."
      - - FY2027 MACE budget rescission
        - "Congressional rescission of MACE procurement funding in the FY2027 NDAA or Appropriations Act, or a DoD program of record cancellation notice."
        - "Revenue inflection point eliminated; production contract conversion no longer possible at announced scale."
        - "Full position exit; no viable bear-case floor above $500M–$1B without the MACE program."
      - - Environmental permitting block at Project Ranger
        - "New Mexico Environment Department or EPA issues stop-work order or consent agreement delaying facility construction at Project Ranger beyond 90 days."
        - "Manufacturing capacity delayed; MACE delivery commitments jeopardized; investor confidence damaged."
        - "Elevate legal and regulatory monitoring; assess whether alternate facility sites are viable."
    notes: "Kill triggers are defined for threshold-based monitoring; they do not constitute specific price targets or exit instructions. Investors should define individual position limits independently."
    claimRefs:
