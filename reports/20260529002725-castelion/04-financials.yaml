  - id: FI002
    title: Unit Economics Bridge — Blackbeard Cost Architecture
    type: flow
    layout: wide
    summary: >-
      Castelion's unit cost thesis requires reducing per-AUR cost from legacy hypersonic levels
      (~$5M+) to under $300K through vertical integration, commercial supply chains, and high-volume
      manufacturing at Project Ranger. The gross margin layer remains private.
    data:
      nodes:
        - id: legacy-cost
          label: Legacy Hypersonic Baseline
          detail: >-
            Traditional hypersonic weapons cost several million dollars per unit (PrSM Inc 2:
            ~$5.35M per missile; HACM development cost ~$2B for ~13 test articles).
          tone: negative
        - id: design-choice
          label: Design-for-Manufacturability
          detail: >-
            Castelion avoids "exquisite designs" and vertically integrates solid rocket motors,
            seekers, control actuation, and flight computers to compress both cost and schedule.
          tone: positive
        - id: commercial-supply
          label: Non-Traditional Commercial Supply Chain
          detail: >-
            Metal cases and rubber components sourced from automotive-industry suppliers rather
            than defense-specific vendors, reducing material costs and lead times.
          tone: positive
        - id: high-cadence
          label: High-Cadence Test Iteration
          detail: >-
            25+ flight tests in 2025 at rapid intervals; test-learn-fix cycles compress
            development time and reduce redesign cost per iteration.
          tone: positive
        - id: target-cost
          label: "Target Unit Cost: <$300K"
          detail: >-
            Navy MACE program target at ≥500 AURs/year production rate. First production
            lot FY2027 estimated at $442K/AUR; expected to decline toward $300K at scale.
          tone: neutral
        - id: margin-gap
          label: Gross Margin Gap (Private)
          detail: >-
            Contribution per AUR above direct manufacturing cost is not disclosed. Whether
            the $300K–$442K price range supports a viable gross margin depends entirely
            on actual production costs, which require a data room to assess.
          tone: negative
    approximationNotes: >-
      All cost figures are either program targets or early-lot estimates derived from DoD budget
      documents. Actual manufacturing costs, materials breakdown, and gross margin are private.
      Legacy cost benchmarks (PrSM pricing) are from publicly available Army budget submissions.
    claimRefs:
      - CI016
      - CI017
      - CI020
      - CI021
      - CI022
      - CI033
      - CI037

