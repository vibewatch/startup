  - id: unit-economics
    title: Unit Economics and Cost Architecture
    body: >-
      Castelion's commercial thesis rests on a claimed 10x cost reduction versus legacy hypersonic weapons of
      comparable capability. The U.S. Army's PrSM Increment 1 costs approximately $1.6M per missile and Increment 2
      roughly $5.35M with its dual-mode seeker. The Navy's MACE program requirement sets a target unit cost of
      under $300,000 per All Up Round at a minimum production rate of 500 AURs per year—a threshold that, if met,
      would position Blackbeard as by far the most affordable long-range hypersonic strike weapon in the U.S.
      inventory. Early FY2027 Navy procurement planning allocates $156M for 353 missiles, implying approximately
      $442K per missile for the initial production lot, which would represent a starting point before learning-curve
      improvements bring costs toward the $300K target. This cost architecture is enabled by vertical integration
      of solid rocket motors, control actuation systems, seekers, flight computers, and thermal protection systems,
      and by using commercial automotive-industry suppliers for metal cases and rubber components that traditionally
      carry defense-sector premiums. Revenue per employee is estimated at approximately $515K based on third-party
      data—high for a capital-intensive hardware manufacturer—but this reflects the early-stage contract profile
      rather than a matured gross-profit signal. Gross margin, operating expenses, and realized unit economics at
      production volumes remain entirely undisclosed. No primary-source financial statements are available, and
      the government-only revenue base carries no publicly comparable private-defense-startup margin benchmarks.
      The War Zone reported uncertainty about whether Blackbeard's flight profile satisfies the strict definition
      of hypersonic, which matters to cost benchmarking because the hypersonic label drives the program's budget
      line and per-unit procurement ceiling.
    claimRefs:
      - CI011
      - CI012
