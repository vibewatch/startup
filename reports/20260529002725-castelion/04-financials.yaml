  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: >-
        Gross margin, operating expenses, burn rate, and cash runway — all standard underwriting
        inputs for a pre-production hardware company — are entirely private and unavailable
        from any public source.
      whyItMatters: >-
        Without gross margin and burn rate, an investor cannot model the path to profitability,
        validate that the $350M Series B provides adequate runway through Project Ranger
        commissioning, or stress-test the unit economics at the $300K target price.
      diligencePath: >-
        Request audited financials (FY2024–FY2025), management accounts for the most recent
        six months, and a forward cash-flow projection in the data room.
      relatedQuestionRefs:
        - QI017
        - QI020
        - QI026

    - type: private-evidence-only
      severity: material
      topic: capex
      missingEvidence: >-
        The amount of the $220M Project Ranger capex already deployed versus remaining to be
        spent in 2026 is not publicly available. No drawdown schedule or milestone-linked
        disbursement plan has been disclosed.
      whyItMatters: >-
        The remaining capex obligation affects runway materially. If $220M must be fully
        funded from the $350M Series B proceeds, only ~$130M would remain for operations,
        which at a reasonable burn rate may be insufficient before the next production
        contract or funding event.
      diligencePath: >-
        Request Project Ranger capital schedule, committed spend to date, and total projected
        capex through facility commissioning in the data room.
      relatedQuestionRefs:
        - QI021

    - type: private-evidence-only
      severity: material
      topic: financial-gaps
      missingEvidence: >-
        Gross margin at production scale for Blackbeard at the $300K–$442K price range cannot
        be estimated from public data. Whether this price range supports a viable margin
        for Castelion versus simply covering direct manufacturing costs depends on actual
        bill-of-materials and overhead structure.
      whyItMatters: >-
        A gross margin near zero at the $300K target would imply Castelion's valuation depends
        almost entirely on volume scale and government program continuity, not on the intrinsic
        profitability of the missile product. This materially affects the investment thesis.
      diligencePath: >-
        Request a detailed cost breakdown per AUR (materials, propellant, electronics, labor,
        overhead, amortized tooling, and Project Ranger amortization) for current and
        projected production volumes.
      relatedQuestionRefs:
        - QI026
