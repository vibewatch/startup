callouts:
  - calloutType: strength
    title: Largest hypersonic production framework awarded to a U.S. defense-tech startup
    body: >-
      The May 2026 Department of War production framework for a minimum of 500 Blackbeard missiles
      per year—with options for 12,000+ units over five years at a combined potential value in the
      billions—is the first production-oriented agreement of its kind for a low-cost hypersonic
      weapon. Combined with $155M+ in executed Navy contracts through April 2026 and approximately
      $379M in total FY2026 federal funding allocated to MACE and related Blackbeard programs, this
      represents the strongest visible government demand signal for any non-traditional hypersonic
      entrant as of the May 2026 run date.
    claimRefs:
      - CI007
      - CI008
      - CI025

  - calloutType: risk
    title: Single-customer concentration — U.S. DoD is the only revenue source
    body: >-
      Castelion has no commercial revenue and no disclosed allied-nation sales pipeline. Every dollar
      of revenue depends on U.S. government defense procurement decisions. A program cancellation,
      failed live-fire test, or budget reallocation would immediately impair top-line revenue with no
      offsetting commercial stream. This structural vulnerability cannot be diversified away without
      entering allied-nation or commercial markets, which are not currently part of the disclosed
      corporate strategy.
    claimRefs:
      - CI009
      - CI028

  - calloutType: risk
    title: Production contract conversion is not yet confirmed; technical classification questioned
    body: >-
      As of December 2025, Castelion had not yet won a binding production contract. The May 2026
      DoW framework is an agreement of intent, not a purchase order. The War Zone raised questions
      about whether Blackbeard's flight profile satisfies the strict definition of hypersonic; if
      the technical classification is successfully challenged, it could affect the program's budget
      line, per-unit procurement ceiling, and competitive positioning against established primes.
    claimRefs:
      - CI028
      - CI029

