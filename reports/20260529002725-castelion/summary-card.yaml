summary:
  headline: >-
    Castelion combines rare DoD demand pull, credible founder-market fit, and a manufacturing-first thesis that could
    matter if the Pentagon truly shifts hypersonics from boutique programs to mass procurement, but the current ~$2.8B
    valuation already prices in substantial execution and production success.
