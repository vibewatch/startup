chapter:
  number: 3
  title: Competitors
  summary: >
    Castelion occupies a structurally distinct position in the U.S. hypersonic weapons market: it is the only startup-scale vendor delivering an air-launched, affordable Mach 5+ strike weapon (Blackbeard) with a confirmed $105 million Navy F/A-18 integration contract and a DoD framework agreement targeting 12,000+ missiles over five years. Incumbents—Lockheed Martin (ARRW), Raytheon (HACM), and the Northrop-led Conventional Prompt Strike program—operate legacy cost-plus programs at $15–$41 million per unit, are years from mass production, and face GAO-documented delays. New-entrant cruise-missile rivals (Anduril, Leidos, CoAspire) compete in sub-sonic containerized munitions under the separate LCCM program and do not substitute for hypersonic speed. Castelion's price point (~$384,000/unit), production roadmap, and multi-service platform integrations create material switching costs that should hold through at least this procurement cycle, though incumbent revival spending and potential future entrants remain credible displacement threats.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: >
      Castelion competes across three distinct competitive layers: (1) incumbent prime-contractor hypersonic programs (Lockheed Martin ARRW, Raytheon HACM, Northrop Grumman-partnered Conventional Prompt Strike/Dark Eagle); (2) new-entrant cruise-missile startups operating under the Pentagon's Low-Cost Containerized Missile (LCCM) program (Anduril, Leidos, CoAspire, Zone 5 Technologies); and (3) status-quo alternatives—conventional standoff munitions such as the JASSM-ER and Tomahawk that remain sub-sonic but are already fielded in volume.


      No incumbent operates in Castelion's specific niche: an affordable, air-launched, Mach 5+ tactical hypersonic missile designed for high-rate production from day one. Lockheed's ARRW reaches hypersonic speed but costs $15–18 million per unit and was cancelled before being revived with $387 million in the FY2026 budget. Raytheon's HACM is an air-breathing scramjet cruise missile in prototype phase with first flight tests pushed to FY2026 and IOC targeting 2027, at an undisclosed but multi-million-dollar per-unit cost. The Northrop/Lockheed Conventional Prompt Strike (CPS) and Army Long-Range Hypersonic Weapon (LRHW/Dark Eagle) are ship-launched and ground-launched glide-body systems aimed at strategic long-range strike, not the air-launched tactical sorties Blackbeard targets. Castelion's LCCM-adjacent framework agreement—DoD seeking at least 500 Blackbeards per year in a two-year procurement deal and actively seeking authority for 12,000+ missiles over five years—has no direct comparable among peers as of May 2026.


      The status quo alternative for carrier-aviation strike is the AGM-154 JSOW or AGM-158 JASSM-ER (sub-sonic, ~$1.4 million/unit), which lack hypersonic speed and survivability against modern integrated air defenses. Internal DoD build through national laboratories (Sandia, DARPA programs) and Dynetics (C-HGB designer) represents a non-commercial parallel track but is not a commercial competitor to Castelion.
