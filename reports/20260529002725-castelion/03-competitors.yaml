  - id: incumbent-programs
    title: Incumbent Hypersonic Programs
    body: >
      Lockheed Martin leads the ARRW (AGM-183A) Air-launched Rapid Response Weapon, a B-52/B-1B-carried hypersonic glide vehicle. The program suffered at least three failed flight tests between 2021 and 2023, resulting in Air Force cancellation. The FY2026 defense budget revived it with $387 million and $1.7 billion in planned funding through 2030. Per-unit cost estimates range from $15–18 million (Congressional Budget Office analysis of 100–300 unit production runs), more than 40× Castelion's Blackbeard target price. The USAF now plans B-52 and potentially F-15E integration. Lockheed also holds a prime role in the Navy's Conventional Prompt Strike (CPS) and Army LRHW (Dark Eagle) programs alongside Northrop Grumman, with the Army awarding a $2.7 billion CPS/LRHW contract in April 2026. CPS is a ship-launched glide-body system with ~$41 million per-unit costs currently on Zumwalt-class destroyers.


      Raytheon Technologies (RTX) leads the Hypersonic Attack Cruise Missile (HACM), the only air-breathing scramjet hypersonic missile in the U.S. development pipeline. HACM is designed for F-15E (and later F/A-18) carriage and is funded with approximately $1.4 billion in development contracts from 2022–2023. The Air Force's GAO-reviewed schedule pushed first flight tests from FY2025 to FY2026 due to design delays. Production funding of $404 million was requested in the FY2027 budget, with IOC targeting 2027. The total procurement plan exceeds $3 billion. Northrop Grumman contributes boosters, scramjet facility investment, and the separately awarded Glide Phase Interceptor (GPI) program ($475 million contract modification, May 2026) for hypersonic defense, plus the RangeHawk drone contract for hypersonic telemetry.


      All three incumbents operate under cost-plus contracting models, have multi-year acquisition timelines, and are not structured to produce in the 1,000s-per-year volumes Castelion targets. Their institutional advantages include decades of DoD relationships, classified program access, and large engineering workforces, but their cost structures and bureaucratic acquisition cycles are directly what Castelion's model is designed to outmaneuver.
