callouts:
  - calloutType: strength
    title: Price-Per-Unit Structural Advantage Is the Primary Moat
    body: >
      Castelion's ~$384,000 target price per Blackbeard missile is more than 40× cheaper than the Lockheed Martin ARRW and more than 100× cheaper than the Navy's Conventional Prompt Strike glide body. This is not a marginal cost advantage—it fundamentally changes how many missiles a carrier air wing can carry, how many can be expended in a single engagement, and how the DoD's budget allocates to hypersonic deterrence. If Castelion achieves production at this price point, no current competitor can match it without a fundamental redesign of their acquisition and manufacturing model.
    claimRefs:
      - CP002
      - CP006
      - CP011
      - CP024

  - calloutType: risk
    title: Production Scale Has Not Yet Been Validated at Unit-Cost Target
    body: >
      Project Ranger is under construction as of May 2026 and has not yet produced operational missiles at the $384,000 target cost. The DoD's framework agreement is contingent on Castelion passing testing and validation before the procurement deal is formalized. If production costs in the first operational lots exceed the target, or if testing failures emerge, the demand signal for 12,000+ missiles could be delayed or reduced. This is the central execution risk that must be monitored before Castelion's moat can be treated as durable.
    claimRefs:
      - CP004
      - CP021
      - CP022

  - calloutType: insight
    title: Incumbent ARRW Revival Creates a Distant but Real Displacement Threat
    body: >
      The Air Force's revival of the ARRW program with $387 million in FY2026 and $1.7 billion through 2030 demonstrates that institutional inertia and established relationships can sustain a higher-cost program even after cancellation. If an ARRW Increment 2 achieves meaningful per-unit cost reductions via Lockheed's manufacturing scale, and if the Air Force can redirect influence over Navy procurement, Castelion's air-launched window narrows. The probability is low in the near term given ARRW's history of failures and different platform (B-52 vs. carrier-based F/A-18), but warrants tracking.
    claimRefs:
      - CP005
      - CP006
      - CP030

