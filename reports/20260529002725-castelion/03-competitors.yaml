  - id: startup-adjacent-competitors
    title: New-Entrant and Adjacent Competitors
    body: >
      The Pentagon's May 2026 Low-Cost Containerized Missile (LCCM) program created a new competitive cluster of cruise-missile startups—Anduril, Leidos, CoAspire, and Zone 5 Technologies—who are aiming to deliver at least 10,000 inexpensive, sub-sonic cruise missiles within three years. These companies are not direct hypersonic competitors to Castelion; their weapons travel at sub-sonic or low-supersonic speeds and are designed for cost-attritable saturation strike rather than speed-of-arrival and penetration against modern air defenses. However, they compete for DoD budget, program office attention, and industrial base capacity.


      Anduril's Barracuda-500M is a surface-launched cruise missile designed for the LCCM program, with Anduril planning to scale to 1,000 missiles per year with first batch delivery in early 2027. Anduril has disclosed ambitions to extend its technologies into hypersonic flight regimes and has posted relevant R&D job postings as of 2026, but no hypersonic weapon is in a confirmed program. Leidos is scaling production of its Black Arrow (AGM-190A) LCCM variant, committing to 3,000 units. CoAspire is providing its GHOST cruise missile (RAACM-ER variant). Zone 5 Technologies also participates but has yet to publicly disclose its LCCM weapon.


      Castelion itself is named in the DoD's broader LCCM-adjacent announcement: the Department is seeking authority and appropriations to buy 12,000+ Blackbeard hypersonic missiles over five years under a separate framework agreement. The DoD explicitly stated that Castelion's program is different in class (hypersonic vs. cruise) from the LCCM participants. Hermeus and Stratolaunch represent hypersonic testbed and reusable vehicle programs, not offensive strike weapons, and are suppliers to the hypersonic technology ecosystem rather than competitors. Kratos Defense has received hypersonic subsystem contracts but does not field a competing hypersonic strike weapon as of May 2026.
