  - id: capability-pricing-comparison
    title: Capability and Pricing Comparison
    body: >
      The most material competitive dimension for Castelion is cost per unit paired with production volume potential. Blackbeard's design target of approximately $384,000 per unit—confirmed in Pentagon budget documents for Navy procurement—is more than 40× cheaper than the ARRW ($15–18 million), more than 100× cheaper than the CPS/C-HGB (~$41 million), and fundamentally repositions who can afford to buy hypersonic weapons in volume. This cost difference is not marginal; it changes strategic calculus on stockpile size, mission diversity, and the risk calculus of expending weapons.


      Capability-wise, Blackbeard is Mach 5+ and maneuvers in its terminal phase, making it harder to track and intercept than ballistic trajectories. ARRW is a boost-glide vehicle with a different aerodynamic profile; HACM is an air-breathing scramjet with different propulsion physics and a longer-range but slower-to-develop profile. CPS/Dark Eagle is a ship- or ground-launched strategic glide body, not platform-agnostic like Blackbeard. In the tactical air-launched role—strike from a carrier against a defended target—Blackbeard is the only weapon currently under active procurement that combines hypersonic speed, air-launch capability, and mass-production economics.


      The key capability gap versus incumbents is range: Blackbeard's publicly reported range is not disclosed with precision, and longer-range hypersonic glide vehicles like CPS can strike at intercontinental standoff distances that a tactical hypersonic missile may not match. For the Navy's carrier aviation mission, however, tactical range with high-volume magazine depth is a direct trade the Navy has explicitly chosen in directing the MACE program toward Blackbeard as its first weapon candidate. LCCM alternatives offer volume but sacrifice speed; incumbents offer range and classification but sacrifice affordability and production rate.
