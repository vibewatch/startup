  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >
        Castelion's current employee headcount and hiring velocity as of May 2026; Project Ranger is expected to add 300 manufacturing jobs, but total company headcount across engineering, program management, and production is not publicly disclosed.
      whyItMatters: >
        Headcount and hiring rate are proxies for production readiness and burn rate; without this data, assessing whether Castelion can actually staff Project Ranger at scale is difficult.
      diligencePath: >
        Request headcount data in management meetings; cross-reference LinkedIn active job postings and media mentions of hiring milestones.
      relatedQuestionRefs:
        - QP012

    - type: missing-source
      severity: material
      topic: hacm-pricing
      missingEvidence: >
        A publicly confirmed per-unit production price or range for Raytheon HACM; no government budget document or public source as of May 2026 discloses a per-unit production cost for HACM (only development contract totals are available).
      whyItMatters: >
        Without HACM per-unit cost, a precise price-competitiveness comparison between Castelion and Raytheon on the air-launched hypersonic mission cannot be made, limiting the ability to assess if HACM could pivot to a more affordable segment.
      diligencePath: >
        Monitor FY2027 and FY2028 Pentagon budget documents for first unit cost data once production funding is appropriated; request analyst estimates from CSIS, CBO, or RAND.
      relatedQuestionRefs:
        - QP015

    - type: missing-source
      severity: material
      topic: test-setbacks
      missingEvidence: >
        No public evidence of Castelion test failures, technical setbacks, or negative DoD evaluator assessments as of May 2026; all public reporting is positive. The absence of adverse technical data in public sources does not confirm absence of setbacks—it may reflect early-stage opacity or classification.
      whyItMatters: >
        Lockheed ARRW's history demonstrates that hypersonic weapons development is technically hard even for experienced primes. Undetected technical risk at Castelion could delay or derail the Project Ranger production ramp and the Navy $105M integration program.
      diligencePath: >
        Request access to DoD test evaluation reports; conduct technical due diligence on missile aerodynamics, propulsion qualification, and thermal protection system validation; review any SBIR Phase II final reports.
      relatedQuestionRefs:
        - QP024

    - type: enumeration-incomplete
      severity: minor
      topic: capability-gaps
      missingEvidence: >
        A comprehensive enumeration of capability gaps across the competitive landscape, including classified programs and international allies' hypersonic developments, is not achievable from open sources alone.
      whyItMatters: >
        If a classified incumbent program or an allied nation's weapon fills a gap Castelion claims to own, the market opportunity may be narrower than public data suggests.
      diligencePath: >
        Request DoD program office briefings under NDA; review Congressional Research Service hypersonics reports; consult CSIS or RAND open-source hypersonics databases.
      relatedQuestionRefs:
        - QP018

    - type: private-evidence-only
      severity: material
      topic: supply-chain-risks
      missingEvidence: >
        Supply chain concentration and single-source dependency risks for Castelion's solid rocket motor production at Project Ranger, including sourcing of propellants, composite materials, and precision avionics components, are not publicly documented.
      whyItMatters: >
        A single-facility production strategy creates vulnerability to supply disruptions, regulatory actions, or industrial accidents; if Castelion's propellant or materials suppliers are themselves bottlenecked, the 500+ missiles/year procurement commitment may be at risk.
      diligencePath: >
        Request a bill-of-materials (BOM) overview and supplier concentration analysis in management meetings; assess OSHA safety record and environmental permits for the New Mexico site.
