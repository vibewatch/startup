  - id: moat-switching-costs
    title: Moat, Switching Costs, and Differentiation Durability
    body: >
      Castelion's moat rests on four reinforcing mechanisms: vertical integration, platform-integration switching costs, production-scale investment, and early procurement lock-in through multi-year framework agreements.


      Vertical integration of propulsion (solid rocket motors), avionics, thermal protection, and guidance systems—built at Project Ranger, Castelion's 1,000-acre, 21-building solid rocket motor campus in Sandoval County, New Mexico—gives Castelion control over cost, lead time, and quality without relying on legacy tier-1 suppliers. The facility is expected to be operational by end-2026 and create approximately 300 permanent jobs. This is a capital-intensive infrastructure investment that will be difficult for competitors to replicate quickly.


      Platform integration is a compounding switching cost. Integrating and certifying a weapon on a military platform (F/A-18 in Castelion's case) involves thousands of engineering hours, qualification testing, wiring changes, software updates, and pilot training. Once the Navy certifies Blackbeard on the Super Hornet, re-qualifying a competing weapon on that same platform requires an equivalent investment—creating institutional inertia that benefits the first mover. The Army Blackbeard GL program (ground-launch from HIMARS) creates a second platform integration path, doubling Castelion's switching-cost footprint.


      The DoD's shift to fixed-price, firm-volume framework agreements (vs. legacy cost-plus) structurally favors suppliers who can commit to unit-cost certainty at volume. Castelion has signed such a framework; the DoD is actively seeking authority and appropriations for 12,000+ Blackbeards over five years. This signal is visible to capital markets (supporting the $350 million Series B led by Altimeter and Lightspeed) and gives Castelion's facility investment a clear demand backstop.


      Durability risks include: (1) ARRW revival—Lockheed retains institutional relationships and could deliver a cheaper ARRW Increment 2 variant; (2) Raytheon HACM achieving IOC by 2027 creates a competing air-launched hypersonic option for the Air Force, which may influence Navy Air Force coordination; (3) new entrants—Anduril's stated hypersonic ambitions and its growing defense-tech institutional standing could produce a competing weapon in the 2028–2030 horizon; (4) DoD monopsony risk—if Congress cuts the hypersonics budget or redirects funds, Castelion's 12,000-unit demand signal could diminish.
