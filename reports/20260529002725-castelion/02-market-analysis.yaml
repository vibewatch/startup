chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Castelion competes in the U.S. defense hypersonic weapons market—a segment experiencing
    structural acceleration driven by peer-adversary pacing threats and a DoD shift toward
    affordable mass production. The global hypersonic weapons market reached an estimated
    $8.64 billion in 2026 (CAGR ~10.5% through 2030), with the U.S. government the dominant
    buyer. Castelion's immediately addressable opportunity is anchored by the Navy's MACE
    program (4,500 missiles, ~$1.6 billion, FY2027–2031) and a Department of War framework
    to procure 12,000+ Blackbeard missiles over five years—representing a realistic SAM in
    the low single-digit billions. Cost-competitiveness (~$384K per unit vs. $3–20M for
    incumbent hypersonics) is a structural driver, but industrial ramp risk, testing cadence
    constraints, and Congressional authorization uncertainty remain material adoption brakes.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >-
      Castelion operates at the intersection of hypersonic weapons development and high-volume
      defense manufacturing. The relevant market is defined as weapons traveling at or above
      Mach 5—primarily air-launched and ground-launched hypersonic glide vehicles, hypersonic
      cruise missiles, and boost-glide systems. This definition excludes conventional subsonic
      cruise missiles (e.g., Tomahawk), tactical ballistic missiles, and supersonic but
      sub-hypersonic munitions such as the Standard Missile family.

      Within the hypersonic segment, Castelion specifically targets a new sub-category:
      affordable, high-volume hypersonic strike weapons engineered for industrial-rate output
      rather than boutique, low-quantity production. The Blackbeard missile sits in the
      light/compact air-launched hypersonic class—distinguished from heavier systems like the
      Navy's Conventional Prompt Strike or Army LRHW by its sub-$400K unit target cost and
      multi-platform compatibility. The status-quo substitute in U.S. Navy inventory is the
      AGM-158C LRASM (Long Range Anti-Ship Missile) at approximately $3 million per unit, and
      the cancelled HALO/OASuW Increment 2 program leaves a procurement vacuum that Blackbeard
      is positioned to fill. For U.S. Army, the incumbent is the Precision Strike Missile
      (PrSM), whose Increment 4 variant targets similar capabilities at significantly higher cost.

      Adjacencies include: counter-hypersonic defense systems (an entirely separate market),
      scramjet propulsion development, hypersonic test infrastructure, and downstream platform
      integration services. These adjacencies are not currently addressable by Castelion but
      represent potential future expansion surfaces as the company's propulsion IP matures.
