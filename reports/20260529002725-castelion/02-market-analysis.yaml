  - id: competitive-landscape
    title: Competitive Landscape and Substitutes
    body: >-
      The hypersonic weapons market has two distinct competitive tiers. The established prime
      tier—Lockheed Martin, Raytheon/RTX, and Northrop Grumman—commands the majority of
      historical DoD hypersonic contract value. Lockheed leads with the ARRW and LRHW programs;
      Raytheon is primary contractor for the Hypersonic Attack Cruise Missile (HACM); Northrop
      provides key subsystems across programs. These incumbents' competitive advantage lies in
      long-standing program relationships, integration experience, and classified program access.

      The new-entrant tier—where Castelion competes—is defined by speed and cost. For the MACE
      program, Castelion's Blackbeard already won selection, displacing legacy programs including
      the cancelled HALO/OASuW Increment 2. For the LCCM cruise-missile program, four other
      new entrants (Anduril, CoAspire, Leidos, Zone 5 Technologies) hold parallel DoW framework
      agreements, positioning them as potential future competitors if the hypersonic/cruise-missile
      boundary blurs or if Congress broadens MACE-like programs to cruise-missile substitutes.
      Anduril in particular has deep VC backing and a broad defense product portfolio that could
      support competitive cross-selling.

      The most structurally favorable competitive dynamic for Castelion is the Navy's explicit
      rejection of the incumbent approach: the cancelled HALO program and the MACE program's
      cost cap (~$384K/unit) effectively disqualify traditional hypersonic primes from competing
      at equivalent volume, because their design-to-cost heritage is fundamentally different.
      This does not foreclose a scenario in which established primes adapt or acquire their way
      into the low-cost hypersonic segment; that remains an unresolved diligence question.
