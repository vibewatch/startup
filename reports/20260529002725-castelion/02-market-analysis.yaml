callouts:
  - calloutType: strength
    title: MACE Award De-risks SAM Entry
    body: >-
      Blackbeard's selection as the Navy's MACE weapon (4,500 missiles, ~$1.6B over five years)
      converts the addressable opportunity from aspirational to contracted. The $105M integration
      award provides a funded bridge to procurement authorization, and the $156M FY2027 lot-1
      budget submission signals DoD commitment beyond a framework agreement. This is a
      materially stronger market entry position than a mere solicitation response.
    claimRefs:
      - CM009
      - CM011
      - CM012
      - CM036

  - calloutType: risk
    title: Multi-Year DoW Volume Is Not Yet Appropriated
    body: >-
      The Department of War's framework agreement seeking 12,000 Blackbeard missiles over five
      years is the primary valuation driver in bull-case market sizing, but it requires
      Congressional authorization and multi-year appropriation that has not yet been secured.
      FY2027 NDAA markup is the critical monitoring gate. Investor models that capitalize this
      volume at full confidence materially overstate near-term revenue certainty.
    claimRefs:
      - CM010
      - CM043
      - CM030

  - calloutType: insight
    title: Cost Disruption Creates a Structurally Defensible Niche
    body: >-
      The traditional hypersonic market ($10–20M per unit for systems like ARRW) is not
      Castelion's competitive arena. Blackbeard's ~$384K target price point creates a
      distinct product category—mass-producible hypersonic strike—that incumbent primes cannot
      immediately replicate without abandoning their legacy cost architecture. This is the
      structural source of Castelion's near-term competitive protection.
    claimRefs:
      - CM031
      - CM035
      - CM038

  - calloutType: assumption
    title: SAM and SOM Estimates Are Author-Constructed
    body: >-
      No analyst firm publishes a Castelion-specific SAM or SOM. The $5.5–6.1B SAM and
      the $0.3–2.0B SOM range in this chapter are constructed from publicly available DoD
      budget documents, DoW press releases, and implied unit prices. They carry significant
      uncertainty and should be treated as analytical scaffolding, not investment-grade
      forecasts.
    claimRefs:
      - CM039
      - CM040

