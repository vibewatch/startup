sections:
- title: Valuation Framework and Comparable Analysis
  body: "Harvey AI's $11B valuation must be assessed against three reference points: its own ARR trajectory, comparable enterprise\
    \ SaaS companies in public markets, and comparable AI unicorn private market valuations. At an estimated $100-200M ARR,\
    \ Harvey trades at 55-110x trailing ARR \u2014 a multiple that has no direct equivalent in mature public markets (public\
    \ vertical SaaS companies like Veeva, ServiceNow, and Datadog trade at 8-16x ARR at similar growth phases) but does find\
    \ precedent in high-growth AI companies during their peak growth windows: Snowflake IPO'd at ~100x ARR on 124% growth.\n\
    The key valuation question is whether Harvey is currently in a Snowflake-like window where extraordinarily high ARR multiples\
    \ are justified by explosive growth, or whether the $11B represents an overshoot that will compress as growth moderates.\
    \ The available evidence \u2014 Sequoia co-leading three rounds with board-level ARR visibility, GIC institutional due\
    \ diligence, and The Information reporting Harvey is \"growing into its valuation\" \u2014 suggests the growth trajectory\
    \ is real but the multiple is at the high end of what is defensible. A fair value range, based on analyst ARR estimates\
    \ and high-growth SaaS comparable analysis, is approximately $6-15B for an informed outside investor without audited financial\
    \ access.\nComparable AI unicorn valuations reinforce the assessment: Harvey commands a 2-3x premium over Glean ($4.6B)\
    \ and Cohere ($5B), justified by Harvey's more specialized vertical focus, clearer per-attorney ROI, and superior enterprise\
    \ customer quality. The Thomson Reuters $650M acquisition of Casetext (2023) at ~3.25x ARR provides the strategic M&A\
    \ floor: at that multiple on Harvey's $150M ARR, a TR acquisition would value Harvey at ~$490M \u2014 demonstrating that\
    \ Harvey's $11B represents a 22x premium over strategic M&A comparable multiples, reflecting Harvey's higher growth rate\
    \ and platform breadth.\n"
