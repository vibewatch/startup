      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: Bloomberg Terminal 类比指向规模化后的 $2-4B ARR
            body: >
              Bloomberg Terminal（每席 $6,000-$25,000，$5-6B ARR，金融业 350,000+ 席位）是最接近 Harvey 市场机会的类比：高价值专业服务垂直、集中在精英机构，实时信息和
              AI 辅助工作流带来的生产率价值远高于软件订阅成本。如果 Harvey 在法律领域达到类似席位深度（目标细分市场全球 400,000+ 名律师，每席 $3,000-$15,000），隐含 ARR 区间为
              $1-6B，足以在成熟期支撑 $11B 估值。
            calloutType: insight
            claimRefs:
              - CM001
          - type: callout
            title: 结构性障碍真实存在，但 Harvey 架构正面回应
            body: >
              法律 AI 采用的三大核心障碍（保密特权泄露、幻觉责任、律师协会合规）不是泛泛的技术采用摩擦，而是法律行业独有的具体风险，需要具体产品方案。Harvey 的 SOC 2 Type II
              认证和不训练客户数据政策直接回应特权风险；引文溯源回答架构降低幻觉责任；企业定价模型和合规文档支持 ABA / 律师协会合规审查。这些不是锦上添花的功能，而是进入 Big Law 采购的门票；Harvey
              从第一天就围绕它们设计产品。
            calloutType: strength
            claimRefs:
              - CM001
          - type: callout
            title: LLM 商品化可能在 2027-2028 压缩 Harvey 的定价权
            body: >
              Harvey 当前定价权取决于其能否相对通用 LLM（ChatGPT、Claude）保持有意义的法律领域准确率优势。随着前沿模型提供商持续用法律数据训练，准确率差距可能收窄，Harvey 相对企业版
              ChatGPT 许可证收取溢价的能力也会下降。Harvey 必须用 2025-2027 这一窗口期，把工作流集成、数据网络效应和企业关系嵌深，形成不依赖原始模型表现的切换成本。
            calloutType: risk
            claimRefs:
              - CM001
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Harvey AI 所处竞争格局最好分为三层：既有法律数据提供商、AI 原生法律平台和通用 AI 替代方案。

              **第一层——既有厂商（最危险）**：Thomson Reuters（CoCounsel，由 Casetext 驱动）和 LexisNexis（Lexis+ AI）是 Harvey 最危险的竞争对手，因为它们把
              150+ 年法律数据库护城河、AI 叠加层和既有律所关系合在一起。Thomson Reuters 每年从 Westlaw 订阅获得 $1.8B+ 法律板块收入，自 2023 发布以来已把 CoCounsel
              部署到「数千家律所」。LexisNexis 的 Lexis+ AI 把 AI 与 250M+ 份法律文档集成在一起。不能把两家公司视为只会守旧的传统厂商——它们都在投入数十亿美元，直接竞争 AI 原生法律市场。

              **第二层——AI 原生竞争对手（细分专家）**：Luminance AI（合同审阅，约 $1B 估值）、Ironclad（合同生命周期管理，B2B 企业）、Spellbook（合同起草，聚焦 SMB）和
              Kira/Litera（文档审阅）在特定垂直竞争，Harvey 已覆盖但尚未完全统治这些场景。它们对 Harvey 的 Big Law 企业位置威胁较小，但可能成为收购标的或融资磁石，把更多资源带入这个领域。

              **第三层——通用 AI（颠覆性威胁）**：Microsoft 365 Copilot、ChatGPT Enterprise（OpenAI）和 Anthropic Claude for Enterprise
              提供宽泛的文档起草和分析能力，律师个人已经在使用。这些工具缺少 Harvey 的保密特权保护和法律领域准确率，但受益于 Microsoft 的企业分销（通过 M365 已进入每家律所）以及 OpenAI /
              Anthropic 持续改进模型。
            claimRefs:
              - CP001
