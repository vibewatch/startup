  - id: FV002
    title: Harvey AI 投资护城河强度评估
    type: kpi
    summary: |
      KPI 评分卡从不同维度评估 Harvey AI 竞争护城河的强度与耐久度，关系到长期估值逻辑。
    data:
      items:
        - label: Harvey Knowledge 的律所专属个性化
          value: 12-24 month switching cost per firm; grows with deployment age
          score: 8
        - label: 精英企业客户锚定基础
          value: Am Law 10, Magic Circle, Big 4; social proof flywheel active
          score: 9
        - label: 法律领域 AI 模型微调
          value: Current advantage; narrows as LLMs commoditize
          score: 6
        - label: 多模块平台宽度（6 个模块）
          value: 3-5x ACV expansion potential; cross-sell motion established
          score: 8
        - label: 数据网络效应（使用反馈）
          value: Early stage; significant potential as firm deployments mature
          score: 5
        - label: 生态系统集成深度（iManage、MS365）
          value: Embeds Harvey in law firm tech stack; reduces switching
          score: 7
    claimRefs:
      - CV001
  - id: FV003
    title: Harvey AI 投资质量 KPI 评分卡
    type: kpi
    summary: |
      截至 Q2 2026，投资质量评分卡评估机构投资人在 $11B 估值下看 Harvey 时最关键的维度。
    data:
      items:
        - label: 市场机会（$50-100B TAM）
          value: Massive underpenetrated legal AI TAM; Harvey <0.5% penetration
          score: 9
        - label: 客户质量（Am Law 10、Magic Circle、Big 4）
          value: Best available enterprise proof points; category-defining logos
          score: 10
        - label: 产品护城河（Harvey Knowledge 锁定）
          value: 12-24 month switching cost; grows with deployment age
          score: 7
        - label: 估值倍数（55-110x ARR）
          value: Aggressive; requires 100%+ CAGR to be defensible
          score: 4
        - label: 财务透明度（无经审计财务报表）
          value: Blocking due diligence gap; decision rests on insider trust
          score: 2
        - label: 回报画像（基准 / 乐观 1.4-2.7x）
          value: Institutional return profile; below VC threshold; appropriate for sovereigns
          score: 5
    claimRefs:
      - CV001
