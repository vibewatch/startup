      - number: '6.3'
        title: 客户质量、集中度与扩张风险
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的客户集中度本身就是结构性风险：前 5-10 个企业级账户可能贡献总 ARR 的 50-65%， 使收入高度依赖头部客户续约决策。失去两个前五大账户可能造成 ARR 下滑
              15-25%——对一家每年烧 $150-300M 运营费用来支撑增长的公司，这是实质性挫折。最脆弱的是那些在高风险交易中暴露准确性质疑的账户； 这些账户需要主动加码客户成功投入，才能守住留存。

              客户反馈呈现稳定分裂：热情采用者主要是 M&A 律师，他们用 Harvey 做合同审查和尽职调查，节省时间的 ROI
              清楚、可衡量；抵触用户主要是高级合伙人，他们更依赖法律判断和客户关系，而不是文档处理效率。律所内部的采用分化导致 Harvey 在已部署律所里的 DAU 渗透率差异很大——有的律所达到 80%+，有的仍停在
              20-30%—— 也因此留下了加深现有客户使用深度、扩大收入的空间。

              Harvey AI 的四大合作既是客户成功案例，也是尚未完全跑通的渠道分发机会。PwC 和 EY 已在自有全球法律与咨询团队部署 Harvey，自然下一步是在转型项目中向其律所和企业法务客户推荐
              Harvey。如果 Harvey 用分成安排把这些渠道关系正式化， 四大渠道可显著加快 Harvey 对中端市场和企业法务的渗透，速度会超过纯直销。
            claimRefs:
              - CU001
