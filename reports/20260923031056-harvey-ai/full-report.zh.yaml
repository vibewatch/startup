        title: 展品
        blocks:
          - type: callout
            title: A&O 和 Dentons 证明 Harvey 能在全球规模化
            body: >
              A&O Shearman（14 个办公室）和 Dentons（60+ 个国家）的部署，是 Harvey 客户组合中最重要的客户验证数据点： 它们证明 Harvey
              能在全球企业级规模运行，支撑多语言、多法域工作流，覆盖不同业务领域的数百名律师。 任何想在市场顶端竞争的法律 AI 对手，都需要类似的全球验证——而 Harvey 的竞品目前还没有同等规模的证明。
            calloutType: strength
            claimRefs:
              - CU001
          - type: callout
            title: M&A 周期性是被低估的收入风险
            body: >
              Harvey AI 最高 ACV 客户绝大多数是交易型律所（M&A、资本市场、私募股权）。M&A 下行期（如 2022-2023 年全球交易量下跌
              40%+），律所会大幅削减员工和可自由支配的技术支出。如果类似下行发生在 Harvey 仅渗透 20-30% Am Law 100、 尚未建立足以熬过收缩期的主导地位时，收入冲击可能很严重。Harvey
              向诉讼、合规和企业法务扩张，是正确的风险缓释路径。
            calloutType: risk
            claimRefs:
