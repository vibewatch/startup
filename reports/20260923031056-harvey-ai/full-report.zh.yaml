      - number: '1.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 13 个月估值增长 3.7x，显示品类定义者位置
            body: >
              Harvey AI 在约 13 个月内从 $3B 升至 $11B（February 2025 to March 2026），是企业软件史上最激进的估值跃升之一。与许多以膨胀倍数融资的 AI 初创不同，Harvey
              的老投资人持续加码（Sequoia 共同领投三轮），说明增长更可能建立在真实 ARR 动能之上。GIC 这类主权财富基金在 $11B
              估值共同投资尤其重要——这种机构资本通常需要收入表现足以支撑入场价格，而不只是看增长潜力。
            calloutType: strength
            claimRefs:
              - CO001
          - type: callout
            title: Winston Weinberg 的法律背景是核心护城河
            body: >
              多数做法律场景的 AI 公司由工程师或产品经理创立，再从外部学习法律领域。Winston Weinberg 曾在 Goldman Sachs 执业，这给 Harvey
              带来少见的创始人—市场匹配：他直接理解律师需要什么、害怕什么（执业过失、保密特权泄露），也理解法律工作流实际如何运转。这种内部视角塑造了 Harvey
              的特权保护架构和引文溯源回答系统；在一个以信任为首要购买标准的市场里，这些功能推动了企业信任。
            calloutType: strength
            claimRefs:
              - CO001
          - type: callout
            title: ABA 与监管不确定性是真实风险
            body: >
              法律 AI 市场面临实质监管风险：ABA Formal Opinion 512（2024）讨论了 AI 工具使用中的保密问题，但没有全面解决律师胜任义务、未获授权从事法律执业或幻觉责任等问题。随着 Harvey
              的智能体产品走向自动化法律工作成果（而不只是辅助起草），各州律师协会可能提出新要求，推高 Harvey 的合规成本，或限制某些自动化工作流。Harvard Law
              Review（2025）将幻觉责任和未获授权从事法律执业列为法律 AI 平台最大的两个监管暴露点。
            calloutType: risk
            claimRefs:
              - CO001
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 法律 AI 市场定义与规模
        blocks:
          - type: paragraph
            body: >
              法律 AI 市场覆盖一类软件工具：它们把人工智能用于法律专业人士执行的任务，包括法律研究、合同分析、文档起草、尽职调查、证据开示和工作流自动化。截至 2025，这个市场最好按三层范围理解。

              最宽口径下，全球法律服务市场每年约产生 $950B-$1T 收入，其中 US 代表 $350-400B。历史上，AI 软件工具通常能以软件订阅形式拿下服务市场收入的 0.5-1%；若捕获率达到 1-3%，法律
              AI 的总可用市场（TAM）将达到每年 $9-30B 软件收入。更保守的近期估计——只看当前 AI 专用工具类别——把法律 AI TAM 放在 2024 的 $1.4-2B，并按分析师方法不同，以 20-35%
              CAGR 增长到 2030 的 $7-15B。

              Harvey AI 的可服务市场（SAM）由三块构成：(1) Am Law 100/200 律所（合计收入约 $130B，60,000-80,000 名律师，计费费率最高）；(2) UK Magic Circle
              和 EU 全球律所（另外约 200-300 家律所）；(3) Fortune 500 企业内部法务部门（约 $50-100B 市场）。若按 50,000 个 Harvey 席位、每年 $5,000-$15,000
              计算，仅这些细分市场贡献的 SAM 就超过 $500M-$750M ARR——以当前增长率看，Harvey 完全有机会触达。
            claimRefs:
              - CM001
