      - number: '8.2'
        title: 投资逻辑、情景与回报分析
        blocks:
          - type: paragraph
            body: >
              以 $11B 投 Harvey AI 的投资逻辑，建立在一个巨大、渗透率很低的市场里拿到品类领导地位：全球法律服务 AI TAM 为 $50-100B+， Harvey 目前捕捉的理论 TAM 不到
              0.5%。精英客户锚点（Am Law 10、英国 Magic Circle、四大）、 包含六个独立产品模块的平台，以及随着时间提高切换成本的 Harvey Knowledge 层，使 Harvey
              成为当前最有吸引力的法律 AI 投资标的。 Andreessen Horowitz 认为 Harvey 10 年内可成为 $50-100B 公司，这一判断虽有投机性，但扎根于法律服务市场的规模。

              不过，与绝对机会相比，回报情景没有那么激动人心：基准情景下（2028-2029 年 ARR 为 $450-680M、退出倍数 20x）， Harvey 按 $15B 退出，只能从 $11B 入场价获得 1.4x
              回报——低于典型机构回报门槛。乐观情景（ARR $800M+、$30B 退出） 带来 2.7x 回报——对主权基金或大型机构尚可，但低于典型 VC 预期。悲观情景（ARR $300M、$8B M&A 退出）意味着
              30% 资本损失。概率加权期望值（1.7x）表明，Harvey 被定价为有一定上行的优质资产，而不是风投式彩票。

              GIC 联合投资的逻辑，是最清晰的机构信号：主权财富基金接受低于风投的预期回报，但投资周期更长；GIC 与 Sequoia 一起按 $11B 投资，说明两家机构对 Harvey 财务轨迹的综合信心，足以支撑以
              7-10 年周期配置长期机构资本，并预期 1.5-2.5x 回报——这与上文基准和乐观情景一致。
            claimRefs:
              - CV001
          - type: table
            tableRef: TV002
