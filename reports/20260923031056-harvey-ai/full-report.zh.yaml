      - number: '7.2'
        title: 运营、竞争与技术风险
        blocks:
          - type: paragraph
            body: >
              Harvey AI 最急迫的运营风险，是一次高曝光准确性失败：如果公开报道称 Harvey 生成内容在重大法律事项中造成实质错误， 整个客户群会同时重新评估 Harvey。Harvey 推出自主 Agents
              工作流后，这一风险被放大——多步骤自主工作流在每一步都没有律师输入， 却执行法律任务，失败模式比单次查询式 AI 辅助更复杂。Agents 产品必须配置极高质量护栏，才能避免这种情形。

              竞争风险有三层：（1）模型商品化——基础模型持续进步，Harvey 的微调优势会变窄；（2）巨头反击——Thomson Reuters 已承诺投入 $4.3B+ 做 AI 开发，LexisNexis
              也有同等级项目，两者都可利用庞大分发优势；（3）大科技捆绑——Microsoft Copilot for Legal 可把相近的法律 AI 能力与 Microsoft 365
              打包，以显著更低的增量成本销售。Harvey 对三类风险的防线是 Harvey Knowledge 层 （律所专属个性化），它创造的切换成本最难被商品化或捆绑式替代方案复制。

              Harvey AI 的网络安全态势是关键运营风险因素：律所越来越常被寻求法律情报的国家级行为体盯上（据 CrowdStrike 2025）， 如果存放在 Harvey 中的律师—客户特权通信遭泄露，对受影响客户和
              Harvey 声誉都是灾难。Harvey 的 SOC 2 Type II 认证和加密向量存储提供了有意义的基线保护，但威胁环境演进后，安全门槛必须持续抬高。
            claimRefs:
              - CR001
