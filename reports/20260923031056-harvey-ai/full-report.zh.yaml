      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 有条件买入：经审计财务是准入门槛
            body: >
              Harvey AI 在定性维度上很有吸引力——市场、产品、客户和投资者财团质量都非常出色。$11B 下的定量案例完全取决于 ARR 轨迹是否处在分析师估计的 $150-200M 区间，并以 100%+
              年增速增长。若确认 ARR 为 $150M+、毛利率 75%+， 按 $11B 投资虽然激进但可辩护；若 ARR 为 $100M、毛利率 60%，估值就明显偏高。任何成熟投资者都不应在未先获得经审计财务的情况下，
              按这一估值承诺资本——这是唯一不可谈判条件。
            calloutType: recommendation
            claimRefs:
              - CV001
          - type: callout
            title: Harvey 的定价像机构资产，不像 VC 赌注
            body: >
              按 $11B 入场价计算，概率加权回报为 1.7x，乐观情景中现实上限为 2.7-3x，这使 Harvey AI 更像一项机构投资—— 适合 GIC、成长股权基金或大型家族办公室，在 Harvey 精英客户群和
              Sequoia 董事会支持带来的下行保护下，获取法律 AI 品类敞口。 对于期望单笔仓位 10x+ 回报的传统 VC 基金，$11B 的 Harvey
              不是合适工具——估值已经吸收了大多数早期投资者曾拿到的投机性上行。
            calloutType: insight
            claimRefs:
              - CV001
          - type: callout
            title: OpenAI 竞争性入场构成概率加权折价
            body: >
              OpenAI 在 3 年内直接进入法律 AI 市场的概率为 40-50%，这是 Harvey 估值中最重要的风险折价。如果这一概率已经计入 Harvey 的 $11B（Sequoia 和 GIC
              等成熟投资者理应建模），就意味着内部人相信，即便 OpenAI 直接竞争，Harvey 的 Knowledge 护城河和平台广度仍足以支撑显著价值。外部投资者必须独立判断 Harvey
              的切换成本是否足够持久，能支撑这一判断。
            calloutType: risk
            claimRefs:
              - CV001
