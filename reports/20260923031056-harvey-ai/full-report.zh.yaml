      - number: '5.3'
        title: 产品质量、风险与竞争位置
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的质量框架包含引文核验、针对高风险法律结论的监督式审阅提示，以及 Agent
              动作审计轨迹日志——这些设计都是为了在平台处理越来越自主的法律任务时，仍保留律师问责。该设计与律师协会指引在结构上相符：AI 生成工作必须由律师监督。这会阻止 Harvey
              被当作完全自主的法律执业者使用，但适合受监管的专业服务语境。

              最大产品风险，是高风险复杂交易中的准确率。Reuters 在 May 2025 报道，部分律所在复杂跨境交易中遇到准确率问题，包括错误引文和对管辖法律条款的误述。Harvey
              以强化引文核验和人类在环确认提示回应，但在法律后果重大的输出中，LLM 幻觉风险仍是这项技术的根本限制，无法被工程完全消除。

              相比 Thomson Reuters CoCounsel 和 LexisNexis Lexis+ AI，Harvey AI 的差异化在于推理深度和 M&A 工作流强度（Harvey
              优势）；既有厂商则在实时判例法引文集成（Westlaw、LexisNexis 数据库）和受监管行业合规工作流上领先，后者需要深度数据库访问。Harvey
              缺少原生判例法数据库集成，这是相对既有厂商最大的产品缺口——可通过合作或收购解决，但需要投入。
            claimRefs:
