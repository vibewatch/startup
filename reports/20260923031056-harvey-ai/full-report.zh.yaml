      - number: '3.3'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的竞争护城河有三层可防守结构：(1) **数据飞轮**——来自 Big Law 律所的律师反馈循环，会随时间复利提升 Harvey 的法律领域模型质量；(2)
              **平台粘性**——多模块部署（Vault + Knowledge + Agents）形成集成成本，使从 Harvey 切换比从单一用途工具切换更痛；(3) **信任背书**——Big Law 参考客户（A&O
              Shearman、Davis Polk）制造可信度级联，加速新律所采用。

              关键竞争风险时间线是：近期（2025-2026）——Harvey 在产品深度和 Big Law 信任上领先，既有厂商追赶智能体能力；中期（2027-2028）——CoCounsel 和 Lexis+ AI
              做出可比智能体功能，竞争压力上升；长期（2029-2030）——如果通用模型达到法律领域准确率平价，前沿 LLM 商品化风险见顶。

              Bloomberg Intelligence 分析认为，市场可能形成共同主导格局：Thomson Reuters 赢下法律研究 / 先例板块（Westlaw 数据库本质上不可替代），Harvey
              赢下工作流自动化和智能体化法律工作板块。这个共同主导结果会验证 Harvey 在 $11B 的投资逻辑，同时也限制其完全取代 Westlaw 的能力。

              OpenAI 的利益冲突风险值得监控：OpenAI 既是 Harvey 的股权投资人，也是 Harvey 核心能力背后的模型提供商，理论上拥有对法律 AI
              数据的优先接触，可能为竞争产品提供信息——但目前没有证据显示存在这类计划。
            claimRefs:
              - CP001
