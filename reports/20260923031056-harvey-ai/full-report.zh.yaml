      - number: '7.3'
        title: 合作伙伴、人员与执行风险
        blocks:
          - type: paragraph
            body: >
              Harvey AI 对 OpenAI API 的依赖是最结构性的风险：约 60-70% 的模型推理经由 OpenAI，导致定价、 服务连续性和竞争风险都集中在单一供应商。Harvey
              的缓释路径——开发自研法律基础模型——是正确战略回应， 但距离形成有意义的模型独立性还需 2-4 年。在此之前，Harvey 高度暴露于 OpenAI 的商业决策，包括 OpenAI 可能直接进入法律 AI
              市场。

              Harvey AI 的关键人物风险显著但可控：CEO Winston Weinberg 和 CTO Gabriel Pereyra 是公司最关键人员， 但 Harvey 已建立足够团队纵深（150-250
              名工程师），创始人离开不会让公司立刻失效——更大的风险是失去创始人连续性带来的信心信号； 大型企业客户的合作决策，有一部分建立在对 Harvey 管理层的关系信任之上。

              Harvey 从 Big Law 交易业务向外扩张时，执行风险不小：产品为 Am Law 100 M&A 部署做了优化，而进入诉讼、政府、 企业法务和中小律所，需要明显的产品和 go-to-market
              调整。缓释 M&A 周期风险的路径（进入周期性更低的细分市场）在战略上正确， 但运营上复杂；Harvey 必须同时服务不同客户画像，应对不同工作流、IT 基础设施和价格敏感度。
            claimRefs:
              - CR001
