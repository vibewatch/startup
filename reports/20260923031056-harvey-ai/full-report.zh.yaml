      - number: '5.2'
        title: 技术架构与工程深度
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的技术架构是多模型系统：以 OpenAI 的 GPT-4 family 为主要推理引擎，辅以 Anthropic Claude 处理需要长上下文窗口的任务，并越来越多加入 Harvey
              自有、专为法律打造的基础模型。CTO Gabriel Pereyra（前 DeepMind、Google Brain）自 2024 起大力投入自研模型；The Information 在 August 2025
              报道，Harvey 正在构建法律领域基础模型，以降低 OpenAI API 依赖，并提升合同条款抽取、法律引文核验等专门任务的准确率。

              Harvey 用大规模法律语料（合同、判例法、监管文档）进行领域微调，在法律推理任务上的表现明显优于基础 GPT-4；Stanford 的 LegalBench 基准框架验证了这一点。律所级定制层（Harvey
              Knowledge）提供第二层个性化，随着更多律师使用系统并通过使用模式贡献隐性反馈，这一层会随时间复利。

              集成架构（Harvey Ecosystem）把 Harvey 嵌入企业法律技术栈：iManage 和 NetDocuments 集成确保 Harvey 可从律所 DMS
              访问文档，不需要手动上传；Microsoft Word 和 Outlook 插件让律师在主要工作环境中直接使用，降低采用摩擦。这种集成深度是通用 AI 工具缺少的产品优势，也为已把 Harvey
              接入工作流的律所形成切换成本。

              Harvey AI 的安全基础设施——SOC 2 Type II 认证、符合 GDPR 的 EU 数据驻留、Vault 加密向量存储，以及严格不使用客户数据训练的政策——回应了企业律所最初不愿采用 AI
              的核心担忧。公司部署在 AWS 和 Azure 上，并为 US、EU 和 UK 市场提供数据驻留选项；但没有完整本地部署，会限制 Harvey 面向政府法务部门以及部分数据驻留要求严格的欧洲律所的可服务市场。
