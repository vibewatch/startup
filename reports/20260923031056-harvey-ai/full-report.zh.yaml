      - number: '2.3'
        title: 增长驱动、障碍与竞争动态
        blocks:
          - type: paragraph
            body: >
              2024-2026 年，五个结构性力量正在加速法律 AI 采用，也为 Harvey 扩张创造了有利市场环境：

              1. **盈利压力**：Am Law 100 合伙人盈利在 2023-2024 仅增长 3-5%；律所需要效率工具，在不同比例增加人手的情况下提升律师助理产出。

              2. **同业竞争压力**：当 Kirkland、Davis Polk 和 A&O Shearman 公开部署 Harvey，同业律所会承受采购压力——被视为技术落后本身就是强 GTM 杠杆，制造由 FOMO
              驱动的交易紧迫感。

              3. **客户费用压力**：大型企业客户正在反推律所计费费率上调；能减少计费工时的 AI 工具，反而可以在维持或提高每案收入的同时提升客户满意度。

              4. **Gen AI 主流化**：个人使用 ChatGPT 的律师，正在推动律所采购授权工具，让专业工作既保留同样便利，又具备必要的保密特权保护。

              5. **监管清晰度浮现**：ABA Formal Opinion 512（2024）和 NYSBA 指引（2024）为 AI 工具使用提供了法律框架，降低了此前阻塞采购的合规不确定性。

              主要采用障碍包括：保密特权泄露风险（Harvey 的 SOC 2 认证和不训练客户数据政策直接回应这一点）、幻觉责任（Harvey 的引文溯源架构可缓解但不能消除）以及客户在特定事项上反对使用
              AI。若通用模型在法律领域准确率上追平 Harvey 的微调路径，LLM 商品化会成为中期风险；但即便底层模型质量趋同，Harvey 的工作流集成深度和企业信任关系仍会形成持久切换成本。
            claimRefs:
              - CM001
          - type: table
            tableRef: TM003
            claimRefs:
