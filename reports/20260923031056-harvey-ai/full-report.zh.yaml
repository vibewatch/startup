      - number: '4.3'
        title: 估值背景与财务缺口
        blocks:
          - type: paragraph
            body: >
              以 $11B 估值、估计 $100-200M ARR 计算，Harvey AI 的交易倍数约为 55-110x trailing ARR——远高于上市企业 AI SaaS 8-15x 的中位数，但仍在高确信度私募
              AI 估值（20-100x）区间内，适用于 ARR 年增 100%+ 的公司。乐观情景是 Harvey 在 3 年内达到 $400-600M ARR（50-60% CAGR 下可行），届时 $11B 估值对应
              18-28x forward ARR；对法律 AI 品类龙头而言，这一倍数可辩护。类似高增长阶段的企业 AI 公司也拿到过相近倍数：Snowflake IPO 时约 100x ARR，高增长垂直 SaaS
              公司在规模足够时也曾在公开市场维持 20-40x ARR 倍数。

              悲观情景是 ARR 增速降到 75% CAGR 以下，同时竞争对手追上来，把 Harvey 可实现的退出倍数压缩到 15-20x ARR；若 ARR 为 $300M、倍数 15x，退出价值约 $4.5B——相对
              $11B 入场价会是重大损失。The Wall Street Journal 曾把 Harvey 列入融资速度超过收入证据的 AI 初创，指出外部投资人对真实 ARR 轨迹能见度有限。收入集中在前 20-30 个
              Am Law 100 企业账户，是结构性脆弱点：即便少数最大账户流失或缩减范围，也会对 ARR 造成实质影响。

              最重大的财务缺口，是完全没有公开 GAAP 财务披露；Harvey 作为私营公司没有义务公布经审计财务，任何在这一估值下的投资决策，都高度依赖对投资人财团专有数据的信任。若未来 IPO
              面向公开市场投资者，Harvey 需要在一致的 GAAP 基础上证明可审计毛利率高于 65%、净收入留存高于 120%、ARR 增长高于
              60%，才能支撑有意义的公开市场估值溢价。在此之前，财务尽调必须依赖独立分析师估计和投资人信号，而不是一手来源。
            claimRefs:
              - CI001
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
          - type: figure
            figureRef: FI003
            claimRefs:
