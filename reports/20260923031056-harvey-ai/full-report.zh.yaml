  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Harvey AI 处在两个监管最重的领域交叉点：AI（欧盟、美国、英国监管都在加强）和法律执业（每个司法辖区都由律师协会监管）。 欧盟 AI Act 可能把法律 AI 工具归为「高风险 AI
              系统」，这是近期最重的监管负担：如果 Harvey 在所有欧盟部署中都必须满足强制合格评定、 技术文档要求和强制人工监督义务，合规成本会明显上升，也可能拖慢欧盟市场的产品发布。Harvey 的英国 Magic
              Circle 客户（A&O、Freshfields） 和全球网络客户（Dentons）同时受欧盟和英国监管框架约束。

              ABA Formal Opinion 512（2024）以及 California、New York 等主要法律市场的州律协指引，给出了清晰框架： 律师要对所有 AI 生成输出承担个人责任，并必须按照胜任义务监督
              AI 使用。Harvey 的设计与该框架一致（所有输出都要求律师审阅）， 但涉及 AI 幻觉的律师制裁案例越来越多，包括标志性的 Mata v. Avianca 案，给 Harvey 在内的所有法律 AI
              工具留下声誉阴影。 任何归因于 Harvey 输出、并发生在重大案件中的高曝光准确性事故，都可能触发行业对法律 AI 采用的全面重估。

              截至 2026 年 5 月，Harvey AI 没有披露重大法律程序。法律风险登记表基于法律 AI 行业的系统性风险——AI 训练数据版权敞口、 非律师场景中的未授权执业风险、全球部署下的 GDPR
              合规复杂性，以及未来 FTC 可能对法律服务中的 AI 加强监管。Harvey 来自训练数据的版权风险 （类似其他 AI 公司面临的案件）是更长期的敞口，取决于法院如何裁定仍在审理的 AI 训练数据版权争议。
            claimRefs:
              - CR001
