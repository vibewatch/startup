      - number: '2.2'
        title: 市场分层与买方分析
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的市场拓展覆盖四类买方，每类采购动态都不同：

              1. **Big Law（Am Law 100/200）**：价值最高的细分市场——400-500 家 US 律所，合计收入 $130-140B。律师助理每小时收费 $300-600，合伙人每小时
              $600-2,000+。ROI 达到 10:1 的 AI 工具能跨过任何合理采购门槛。委员会审批带来 3-9 个月销售周期，但也推动全所铺开，而不是个人许可证购买。Harvey 已借锚点客户（A&O
              Shearman、Davis Polk）在这里深度渗透。

              2. **UK/EU Magic Circle 律所**：声誉和计费经济性可比 US Big Law；全球规模律所 200-300 家。Harvey 与 A&O Shearman 的合作建立了 London 和
              EU 存在。Magic Circle 是自然扩张市场，采购画像与 US Big Law 相似。

              3. **企业内部法务部门**：拥有法务运营团队的 Fortune 500 公司。这个细分市场采用 AI 更早期（截至 2025，65% 预算已分配），但增长很快。Harvey 与 PwC、EY
              的合作，为触达大型企业法务买方提供了渠道分销。

              4. **专业服务网络**：Big 4 会计师事务所（PwC、EY、Deloitte、KPMG）和雇用法律专业人士的全球咨询公司。这类机构 AI 成熟度高、IT 采购基础设施强、规模全球化，使 Harvey
              能拿下覆盖国际网络数千席位的企业级交易。

              中端市场和小型律所代表更长期的扩张空间；Harvey 当前聚焦 Big Law，是有意的先落地再扩张策略：先用企业级参考客户积累可信度，再向下游市场层级推进。
            claimRefs:
              - CM001
