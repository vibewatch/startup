      - number: '4.2'
        title: 单位经济与财务结构
        blocks:
          - type: paragraph
            body: >
              Harvey AI 估计 55-75% 的毛利率，反映出成本结构主要由三块主导：OpenAI 模型 API 成本（约 COGS 的 10-20%）、AWS / Azure 云基础设施（约
              10-15%）以及工程支持和部署成本（约 10-15%）。规模化后，随着 OpenAI 对更高用量收取更低 token 价格，模型成本应会下降；Harvey
              对自研微调模型的投入，也可能随时间减少对第三方模型的依赖。Harvey 近期宣布首个专为法律打造的 AI 模型，释放出发展模型独立性的战略意图。

              可比的上市垂直 SaaS 公司（Veeva 72%、ServiceNow 78%、Atlassian 82%）毛利率比 Harvey 估计区间高 5-20
              个百分点，主要因为它们拥有自己的基础设施，不需要支付第三方模型 API 费用。相对既有厂商（Thomson Reuters 拥有自有基础设施），这是结构性劣势，也是 Harvey
              必须靠模型多元化或自研模型投入解决的中期风险。

              Harvey AI 的净收入留存估计为 115-130%，由三件事驱动：初始试点队列之外的律师被加入律所许可证，推动席位扩张；律所在 Assistant 订阅之上叠加 Vault 和
              Agents，推动模块加购；Harvey 向现有客户证明 ROI 后，续约 ACV 上调。这个扩张机制对长期财务逻辑至关重要：NDR 达到 120%+，意味着即便不新增客户，Harvey 也能从现有客户显著扩大
              ARR。

              Harvey AI 资本充足：累计融资 $1B+，即便按激进的 $200-300M 年运营开支估算，也提供约 2-4 年现金跑道。资本分配估计为 40-50% 投向 R&D（模型开发、产品工程）、30-35%
              投向销售与营销（企业销售团队、法律专家招聘）、15-20% 投向 G&A。最新一轮以 $11B 估值融资 $200M，进一步延长现金跑道；GIC 的机构共同投资也为未来如有需要的增长资本建立了关系。
            claimRefs:
              - CI001
