      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: Thomson Reuters CoCounsel 是 Harvey 最危险的竞争对手
            body: >
              Thomson Reuters 不是典型的沉睡既有厂商：公司花 $650M 收购 Casetext，数月内推出 CoCounsel，并正把 AI 部署到既有 Westlaw
              客户群（全球最大法律数据库安装基础）。CoCounsel 借 Westlaw 续约对话获得的分销优势结构性很强——它不需要新的企业销售，只是在现有订阅上升级功能。Harvey
              的防守不是在数据库深度上竞争（Westlaw 会长期获胜），而是占住智能体化工作流自动化品类；Thomson Reuters 在这里还没有做出可比能力。
            calloutType: risk
            claimRefs:
              - CP001
          - type: callout
            title: Harvey 的 Big Law 参考客户制造可信度级联
            body: >
              A&O Shearman、Davis Polk 和 Dentons 不只是客户——它们是 Harvey 整个竞争策略的背书机制。当 Skadden 或 Sullivan & Cromwell 的律所合伙人听说
              Davis Polk 正在规模化运行 Harvey，采购对话就会从「说服我」变成「什么时候开始」。这种参考效应是 Harvey 最持久的近期护城河，因为 Thomson Reuters 无法复制：Westlaw
              已经无处不在，但这种普及不会制造一家头部律所部署 AI 所带来的同等 FOMO。
            calloutType: strength
            claimRefs:
              - CP001
          - type: callout
            title: LLM 商品化风险真实存在，但并不迫近
            body: >
              Harvey 的风险不是 Claude 或 GPT-5 会立刻取代它，而是到 2028，通用前沿模型可能达到 Harvey 法律准确率优势的 90%+，只剩工作流、保密特权和集成是真正差异化。Harvey
              必须利用 2025-2027 窗口，把工作流和集成护城河做得足够深，即便模型准确率差距缩小后，也能形成持久切换成本。如果 Harvey 能在 LLM 平价到来前，拿下带深度工作流集成的 3-5
              年企业合同，它就能建立不依赖原始模型优势的可防守位置。
            calloutType: risk
            claimRefs:
              - CP001
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >
              Harvey AI 采用企业 SaaS 商业模式，按席位授权是主要收入来源。Am Law 100 律所的企业账户，估计每年为全所访问支付 $500K-$3M+；较小的专业服务账户 ACV 从 $50K-$500K
              起。模块加购（Harvey Vault、Knowledge、超出基础 Assistant 层的 Workflow Agents）和定制智能体开发的专业服务费，在核心授权之上提供扩张收入。Harvey
              也可能从希望把 Harvey 能力嵌入内部工具和工作流的律所那里获得一些 API 访问收入，但这一收入流仍属推测，现阶段可能规模有限。

              Harvey 的估计 ARR 已从 2022 的接近零，增长到 Q1 2026 分析师估计的 $100-200M。这代表 200-400% 年同比增长，主要由 Big Law 企业部署驱动。公司没有披露精确
              ARR，所有估计都是分析师根据投资人增长信号、不断抬高估值的融资公告（暗示基于 ARR 的承销）和匿名管理层评论三角测算得出。

              Sequoia 以快速抬升估值共同领投三轮——即便对 Sequoia 而言也不寻常——是现有最强信号，说明专有 ARR 数据（Sequoia 作为董事会层面投资人可见）正在验证增长轨迹。GIC 在 $11B
              的机构共同投资提供了额外信号，因为主权财富基金在这种规模上投资前，通常需要经审计的财务指标。公司的企业定价包含大型多席位承诺的数量折扣；Am Law 100 律所估计可获得相对小型账户 30-50%
              的单席折扣，交换条件是覆盖全所、期限 2-3 年的部署承诺。
            claimRefs:
              - CI001
