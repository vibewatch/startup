      - number: '4.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 没有经审计财务是核心尽调风险
            body: >
              Harvey AI 完全缺少公开财务披露，这是任何投资人或收购方最重要的风险因素：所有估值分析都建立在无法独立审计的投资人财团数据之上。$11B 数字由 Harvey 自身融资过程定出，而不是由市场力量或
              GAAP 收入倍数定价。任何严肃尽调都应要求先提供经审计 GAAP 财务，重点关注毛利率（验证模型 API 成本结构）和净收入留存（验证扩张收入主张）。
            calloutType: risk
            claimRefs:
              - CI001
          - type: callout
            title: Sequoia 第三次共同领投是现有最强收入验证
            body: >
              外部投资人无法查阅 Harvey 内部财务，Sequoia 共同领投三轮，因而成为 ARR 确实在加速增长的最可信公开信号。Sequoia
              能看到董事会掌握的实际收入指标，愿意把持仓加到三倍，连内部都承认这并不寻常。 Pat Grady 相当于用投资表态：这些数字撑得起这份信心。主权基金 GIC 以 $11B 估值参投，则提供了另一个机构验证信号。
            calloutType: insight
            claimRefs:
              - CI001
          - type: callout
            title: 支撑 $11B 需要以 70-90% CAGR 走向 IPO
            body: >
              Harvey AI 的 $11B 估值需要两种路径之一：(1) 在 3-5 年内以相当或更高倍数 IPO 或被收购；或 (2) 通过 ARR 扩张长进估值，达到 $400-600M 后，20-30x ARR
              对品类龙头而言可以自圆其说。这要求持续 70-90% CAGR——可以实现，但没有保证，尤其如果 LLM 商品化在 Harvey 达到关键 ARR 规模前压缩其定价权。$1B+ 现金位置给 Harvey
              留出了执行增长的时间，不需要近期外部资本，这是有意义的优势。
            calloutType: risk
            claimRefs:
              - CI001
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品平台与模块架构
        blocks:
          - type: paragraph
            body: >
              Harvey AI 已从单一 AI 法律助手，演进为覆盖六条核心产品线的多模块企业平台。Harvey Assistant 仍是入口：一个对话式 AI
              界面，可处理法律研究、文档摘要、合同起草、监管分析和诉讼准备，覆盖五个主要执业领域（M&A、诉讼、合规、公司和 IP）。律师可通过网页界面访问助手，也可通过直接嵌入文档起草的 Microsoft Word
              插件使用 AI 辅助，或通过 Outlook 集成处理基于邮件的法律查询。

              Harvey Vault 把平台延伸到文档审阅和尽职调查：律师可以上传交易资料室或事项文件，执行 AI 原生合同审阅、条款抽取、风险标记，并对照 Harvey 标准立场库跟踪条件。与传统 eDiscovery
              平台（Relativity、Everlaw）不同，Vault 专为交易工作流打造，而不是大规模文档生产；这种聚焦范围提升了 M&A 和资本市场语境下的准确率。

              Harvey Knowledge 增加了律所专属智能：它吸收一家律所的自有先例文档、内部备忘录和研究笔记，形成私有组织记忆层。因此，律师可以问「我们的 New York M&A
              团队过去在重大不利变化条款上接受过哪些立场？」——AI 输出不是只基于一般法律原则，而是扎根于律所自身机构知识。从竞争护城河看，这是 Harvey 最可防守的产品，因为每家律所的知识库都会变得独一无二。

              Harvey Agents（October 2025
              推出）是最重要的产品进展：它支持自主多步骤工作流，可以独立执行一系列法律任务——审阅一组协议并标记监管风险、抽取具体条款、与标准立场比对、生成摘要备忘录——不需要律师在每一步输入。Agents
              包含审计轨迹日志，记录每个动作；在法律上可问责的专业服务环境里，AI 动作必须可审计，这是一项关键功能。
