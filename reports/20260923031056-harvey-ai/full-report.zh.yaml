      - number: '3.2'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >
              Harvey AI 最强的竞争优势是工作流自动化与智能体任务执行。2025 年推出的 Harvey Agents 可以规划、调整并与用户互动，完成多步骤法律任务；Thomson Reuters CoCounsel
              和 LexisNexis Lexis+ AI 尚未达到同等水平。

              法律研究和数据库完整度却是结构性短板。Westlaw（Thomson Reuters）与 Lexis（LexisNexis）积累了 150+
              年的法律内容，包括注释、编辑撰写的裁判要旨和专有判例摘要。没有同样数十年的法律编辑投入，Harvey 无法单靠训练数据复制这些积累。高度依赖判例研究的律所不太可能用 Harvey 替代 Westlaw /
              Lexis，而是会同时使用两套工具（multi-homing）。

              Harvey 最能守住的差异有四项：（1）智能体工作流自动化（Harvey Agents）；（2）保护律师保密特权的数据架构，包括不使用客户数据训练的政策与 SOC 2 Type II；（3）整合 6
              个模块的完整平台，而非单任务工具；（4）律师满意度——独立律师调查中，Harvey 在复杂推理任务质量上持续获得最高评分。

              标准法律研究所需的数据库完整度，仍是 Harvey 最容易受到挑战的部分。律师要求「找出所有关于 X 的判例」时，Harvey 的回答可能不如 Westlaw 的注释检索结果；不过，对已找到的判例，Harvey
              用 AI 综合生成的回答可能提供更充分的背景。
            claimRefs:
              - CP001
