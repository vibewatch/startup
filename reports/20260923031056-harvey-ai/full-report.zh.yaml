      - number: '5.4'
        title: 展示材料
        blocks:
          - type: callout
            title: Harvey Knowledge 是最深的竞争护城河
            body: >
              Harvey 的律所画像个性化层（Knowledge）在结构上是最可防守的产品元素：一旦一家律所把多年自有先例、备忘录和内部研究吸收到 Harvey Knowledge 中，用竞争对手替代 Harvey
              就意味着要在别处重建那套机构记忆——切换成本会随每次查询增加而上升。目前没有竞争对手能在企业规模上提供同等的律所专属知识库定制，这给 Harvey 在这一维度带来潜在 2-3 年优势。
            calloutType: strength
            claimRefs:
              - CE001
          - type: callout
            title: OpenAI 依赖是首要技术风险
            body: >
              Harvey AI 估计有 60-70% 的模型推理通过 OpenAI APIs 路由，形成三维风险：(1) 定价风险——OpenAI 可以提高 API 价格，压缩 Harvey 毛利率；(2)
              竞争风险——OpenAI 正在构建自己的企业法律 AI 产品，最终可能直接与 Harvey 竞争；(3) 服务中断风险——一次重大 OpenAI 宕机会瘫痪 Harvey 核心产品。Harvey
              投入自研法律模型是正确的战略回应，但以当前开发速度看，模型独立仍需 2-4 年。
            calloutType: risk
            claimRefs:
              - CE001
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 已点名客户基础与市场渗透
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的企业客户基础横跨三个市场细分，且三类都有已确认客户标识。在 Big Law，Harvey 已与 Davis Polk & Wardwell（按收入排 US 前 10
              的律所之一，也是全球最负盛名的交易律所之一）、Freshfields Bruckhaus Deringer（UK Magic Circle）和 Gunderson Dettmer（头部创业公司与 VC
              律所）建立合作。Gunderson 关系在战略上值得注意：Harvey 的 VC 投资人（Sequoia、a16z）会用 Gunderson
              作为其组合公司的外部法律顾问，使投资人关系和客户关系之间形成少见的紧密对齐。

              Harvey 的全球法律网络版图由两个旗舰部署锚定：A&O Shearman 覆盖 14 个全球办公室，Dentons 覆盖全球 60+ 个国家办公室。这两段关系证明 Harvey
              有能力在多语言、多司法辖区的企业环境中运行，并能承受全球律所最高复杂度。A&O Shearman 披露的结果（每周节省 3-5 个律师小时、M&A 合同审阅时间减少 40-50%）是 Harvey
              企业价值主张最清晰的公开 ROI 证据。

              专业服务板块加入 PwC 和 EY，它们既是直接客户，也是潜在渠道分销伙伴：Big 4 部署把 Harvey 用于法律、税务和咨询工作流，超出了纯法律研究，证明 Harvey 可适应专业服务语境。Harvey
              声称截至 late 2025 拥有 100+ 家律所客户，不过通过新闻稿确认的点名客户标识只有 8-10 个——这符合典型企业软件市场拓展：公开锚点账户，长尾客户不逐一宣布。
