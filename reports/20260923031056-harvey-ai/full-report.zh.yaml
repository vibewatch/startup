      - number: '8.3'
        title: 尽调缺口、终止标准与最终建议
        blocks:
          - type: paragraph
            body: >
              Harvey AI 最大尽调缺口，是完全缺少经审计 GAAP 财务报表。本章所有估值分析都建立在分析师估计之上，误差带可能超过 50%。$11B 是 Harvey 融资流程中由知情内部投资者（Sequoia
              具备董事会层面的 ARR 能见度）形成的市场出清价格—— 但外部投资者若不把经审计财务作为前置条件，就无法独立验证 ARR 轨迹。这在私营公司语境下不是致命缺陷， 但意味着按 $11B
              做投资决策，需要高度信任投资财团的判断。

              终止标准是二元的：（1）OpenAI 在 Harvey 核心市场宣布直接推出法律 AI 企业产品——这会立即触发对 Harvey 模型依赖风险和竞争耐久性的重新评估；
              （2）发生重大数据泄露，暴露律师—客户特权通信——在一个保密性不可谈判的职业里，这会造成不可逆声誉损害； （3）ARR 增长连续两个季度被确认低于 50% CAGR——这将说明市场饱和论正在兑现。

              最终建议：对可要求并获得经审计财务的机构投资者（主权基金、大型成长股权基金），有条件买入。Harvey AI 是当前质量最高的企业级法律 AI 投资标的： 客户锚点出色、市场机会真实、平台叙事可信。若确认 ARR
              为 $150M+ 且年增长 100%+，$11B 估值激进但并非不可辩护。 有条件之处毫不含糊：没有经审计 GAAP 财务确认收入轨迹和毛利率结构，就不应承诺投资。若确认 ARR 为 $150M+、毛利率
              75%+， 投资案例很强；若确认 ARR 为 $100M、毛利率 60%，估值就明显偏高。
            claimRefs:
              - CV001
