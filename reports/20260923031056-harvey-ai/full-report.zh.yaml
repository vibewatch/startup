      - number: '1.2'
        title: 融资与投资方支持
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的融资节奏是企业软件中最激进的一档：约 13 个月内完成四轮主要融资，估值从 $3B（February 2025）升至 $11B（March 2026），增长 3.7x，背后是快速 ARR
              增长和企业部署扩张。到 March 2026，累计融资已超过 $1B；对任何法律科技公司而言，这都是里程碑，也强烈显示投资人看好法律 AI 品类。

              Sequoia Capital 是锚定投资方，自 Series A 以来共同领投了三轮。Sequoia 合伙人 Pat Grady 称这是「一次异常大手笔的信任投票」，反映出其对 Harvey
              品类领导地位的深度信念。March 2026 轮由 GIC（Singapore 主权财富基金）共同领投，为 Harvey 的国际扩张带来国际机构资本和 Asia-Pacific 分销触达。其他关键投资方包括
              Andreessen Horowitz（领投 $8B 轮）、Kleiner Perkins、Coatue、Conviction Partners、Elad Gil 和 OpenAI
              Fund——这是基础模型公司之外企业 AI 里最顶级的一组投资人。

              这组投资人带来三类战略价值：(1) 借 Sequoia、KP 和 a16z 的组合公司关系，触达大型律所和金融机构等企业分销网络；(2) 借 OpenAI Fund 的战略关系，获得 AI
              模型访问和可信度；(3) 借 GIC 的 Asia-Pacific 主权网络，补上国际扩张基础设施。
            claimRefs:
              - CO001
