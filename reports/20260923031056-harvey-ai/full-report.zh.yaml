      - number: '6.2'
        title: 客户获取、扩张与留存动态
        blocks:
          - type: paragraph
            body: >
              Harvey AI 按企业级 B2B 模式获客，特别之处是 Am Law 律所之间极强的同业推荐效应。Davis Polk 这样的美国前 10 律所，或 A&O Shearman 这样的 Magic Circle
              律所公开背书后，同业会立即面临评估 Harvey 的压力。管理合伙人密切关注竞争律所的技术优势；法律 AI 也已影响招聘和客户提案：年轻律师更愿意加入配备 AI
              工具的律所，要求较高的法律服务客户则会追问律所用了哪些 AI 工具。

              从试点转向全面部署，是判断产品实力最重要的信号。Dentons 从美国试点扩至 60+ 个国家，A&O Shearman 从一个办公室扩至全球 14 个办公室。Bloomberg Law 确认，多家 Am Law
              50 律所在 12-18 个月内从小范围试点走向全所部署。这样的扩张说明，试点用户满意度高，管理层也有把握决定是否全面上线；这正是企业级法律软件最难完成的转化。

              Harvey AI 的留存率估计为 85-90%，不及顶尖企业 SaaS，但作为新品类平台仍属合理。Reuters 和 Above the Law
              记录的负面反馈集中在复杂跨法域交易的准确性，已导致部分律所将使用范围从全所缩至特定业务组，但尚无已确认的全面取消案例。流失模式看来更接近缩减使用范围，而非彻底离开；即使边缘场景带来摩擦，核心价值似乎仍在。
              最大的留存风险是 M&A 交易量周期：最高 ACV 客户是交易型律所，一旦 M&A 活动像 2022-2023 年那样大幅下滑，Harvey 客户群的法律科技支出就会承压。
