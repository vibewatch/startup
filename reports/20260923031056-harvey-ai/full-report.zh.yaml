  - id: FR003
    title: Harvey 风险缓释 KPI 评分卡
    type: kpi
    summary: |
      风险缓释效果评分卡，评估 Harvey AI 目前对各主要风险类别的缓释程度。
    data:
      items:
        - label: 数据安全（SOC 2 Type II、加密向量）
          value: Strong enterprise baseline; nation-state threat escalating
          score: 7
        - label: 模型依赖缓释（Harvey-1 在开发中）
          value: Correct strategy; 2-4 years from meaningful independence
          score: 4
        - label: 客户锁定（Harvey Knowledge）
          value: Best current moat; 12-24 month migration barrier
          score: 7
        - label: 监管合规（SOC 2、GDPR、SRA）
          value: Proactive compliance posture; EU AI Act risk unresolved
          score: 6
        - label: 分散 M&A 周期性风险
          value: Work-in-progress; still 70%+ M&A/transactional revenue
          score: 4
        - label: 关键人物依赖（两位创始人）
          value: Strong team depth; founders remain critical for top accounts
          score: 5
