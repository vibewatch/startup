      - number: '7.4'
        title: 展品
        blocks:
          - type: callout
            title: OpenAI 入场是 Harvey 最大的生存风险
            body: >
              Harvey 最关键的风险，是 OpenAI 决定直接竞争企业级法律 AI——把与 Harvey 等效的产品打包进 OpenAI Enterprise， 价格显著更低。OpenAI 已经构建驱动 Harvey 的
              GPT 模型；一旦进入法律市场，Harvey 最大成本优势（优惠 API 接入）会消失， 而 OpenAI 还能利用既有企业销售关系。Harvey 的防线必须建立在 Harvey Knowledge
              个性化层上；没有同样的律所专属数据， OpenAI 无法复制这一层——但这条护城河在每个客户处都需要 12-24 个月才能建立。
            calloutType: risk
            claimRefs:
              - CR001
          - type: callout
            title: 数据泄露将是灾难性且不可逆的
            body: >
              不同于大多数 SaaS 安全事件，Harvey AI 如果泄露律师—客户特权通信，无法靠标准补救流程恢复。律师—客户特权是法律体系保密承诺的基础；
              法院和律师协会将别无选择，只能要求受影响客户向正在进行的诉讼对方披露泄露事件，从而让对手获得诉讼优势， 也让被泄露律所的律师面临职业不当行为调查。Harvey
              的安全投入必须把防止数据泄露视为绝对优先级，而不只是合规打勾。
            calloutType: risk
            claimRefs:
              - CR001
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与可比分析
        blocks:
          - type: paragraph
            body: >
              Harvey AI 的 $11B 估值必须放在三个参照点下评估：自身 ARR 轨迹、公开市场可比企业 SaaS 公司， 以及可比 AI 独角兽的私募市场估值。在估计 $100-200M ARR 下，Harvey
              对应 55-110x 最近 ARR—— 这个倍数在成熟公开市场没有直接对应物（Veeva、ServiceNow、Datadog 等公开垂直 SaaS 公司，在类似增长阶段交易在 8-16x ARR），但在高增长
              AI 公司最陡峭增长窗口里有先例：Snowflake IPO 时，在 124% 增长下约为 100x ARR。

              核心估值问题是：Harvey 是否正处在类似 Snowflake 的窗口，爆发式增长足以支撑异常高的 ARR 倍数；还是说 $11B 已经高估，增长放缓后会被压缩。现有证据——Sequoia
              连续三轮联合领投并拥有董事会层面的 ARR 能见度、GIC 做机构级尽调、 The Information 报道 Harvey
              正在「消化其估值」——说明增长轨迹真实，但倍数已在可辩护区间的高端。对没有经审计财务权限的知情外部投资者， 基于分析师 ARR 估计和高增长 SaaS 可比分析，公允价值区间约为 $6-15B。

              可比 AI 独角兽估值进一步支持这一判断：Harvey 相比 Glean（$4.6B）和 Cohere（$5B）享有 2-3x 溢价， 这可由更专注的垂直场景、更清晰的单律师 ROI
              和更优企业客户质量支撑。Thomson Reuters 2023 年以 $650M 收购 Casetext， 约为 3.25x ARR，给出了战略 M&A 底线：按该倍数乘以 Harvey 的 $150M
              ARR，TR 收购估值约为 $490M—— 这说明 Harvey 的 $11B 相比战略 M&A 可比倍数有 22x 溢价，反映出 Harvey 更高增长率和更宽平台广度。
            claimRefs:
              - CV001
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV004
            claimRefs:
