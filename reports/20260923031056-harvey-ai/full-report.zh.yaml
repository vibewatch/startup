chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与创立
        blocks:
          - type: paragraph
            body: >
              Harvey AI Corporation 是一家位于 San Francisco 的法律人工智能公司，由 Winston Weinberg 和 Gabriel Pereyra 在 late 2022
              创立。Weinberg 曾在 Goldman Sachs 执业，深懂法律工作流，具备罕见的创始人—市场匹配；Pereyra 来自 Google Brain 和 DeepMind，带来前沿 ML
              研究能力。两人形成一组履历高度互补的领导搭档，切入高风险法律环境：幻觉风险、保密特权保护和职业责任会抬高采购门槛，通用 AI 工具很难跨过去。

              Harvey 的产品是面向律所和专业服务机构的 AI 平台。平台包含六个核心模块：Harvey Assistant（处理法律任务的 AI 聊天）、Harvey Vault（安全文档存储和批量分析）、Harvey
              Knowledge（覆盖判例法、法规和税务领域的法律研究）、Harvey Workflow Agents（智能体化的多步骤任务自动化）、Harvey Mobile（移动访问）和 Harvey
              Ecosystem（与 iManage、Microsoft 365、Clio、HighQ、NetDocuments 集成）。公司在 2025 推出 Harvey Agents，标志着战略重心从问答式 AI
              转向完整的智能体化法律工作流自动化：系统可以规划任务、中途调整，并与律师互动完成复杂事项。

              Harvey AI 在 2023 获得 OpenAI Fund 早期支持，因此在 GPT-4 公开发布前拿到优先访问权。此后，Harvey
              搭建了自研法律领域训练栈和带引文溯源的回答架构，目标是达到律师级问责要求；这也把它同通用 LLM 区分开来，后者缺少专业法律工作所需的幻觉防护和保密特权保护。公司已获得 SOC 2 Type II
              认证，并承诺不使用客户数据训练模型。
            claimRefs:
