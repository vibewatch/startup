      - number: '1.3'
        title: 客户基础与市场位置
        blocks:
          - type: paragraph
            body: >
              截至 2025，Harvey AI 已凭借在 100+ 家律所（公司口径）部署，确立企业级法律 AI 平台龙头地位，其中包括多家 Am Law 100 律所，也就是全球收入最高的法律执业机构。已点名的锚点客户包括
              A&O Shearman（Allen & Overy 与 Shearman & Sterling 合并而成，是全球最大律所之一）、Davis Polk & Wardwell、Dentons、PwC 和
              EY。通过全球律所合作，其地理覆盖横跨 US、EU 和 Asia-Pacific。

              Harvey 在 Big Law 的渗透形成了强参考效应：当同类律所看到竞争对手部署 Harvey，切换成本论点会反过来——不采用 AI
              的律所，可能在效率、成本和客户服务质量上落后。这种同业压力驱动采用的机制，类似 Salesforce 拿下企业 CRM，或 GitHub 拿下企业工程。McKinsey 估计，AI 可自动化标准法律任务中
              20-40% 的律师工时，按 Big Law 计费费率，每名律师每年可创造 $50,000-$200,000 的生产率价值。

              法律行业的经济模型进一步放大了企业市场动力：合伙人每小时收费 $1,000-$2,000+，即便是温和生产率提升——每名律师每天节省两到三小时——也能为每名高级律师创造 $500K-$1M+
              的年度价值。因此，Harvey 的 ROI 主张在经济上足够有说服力，而且不需要大规模裁员，比传统降本技术更容易通过企业采购。
            claimRefs:
              - CO001
          - type: table
