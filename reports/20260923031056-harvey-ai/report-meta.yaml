  topStrengths:
    - >-
      Broad and fast-growing customer footprint — more than 100,000 lawyers across 1,500+ organizations — gives Harvey
      strong social proof and a credible enterprise standardization story.
    - >-
      The product stack now extends beyond assistant workflows into legal agents, agent building, and an in-house model,
      which broadens monetization and reduces pure assistant commoditization risk.
    - >-
      Legal AI remains structurally underserved, and Harvey appears to be the strongest brand in the category with a
      differentiated trust/compliance posture for regulated workflows.
  topRisks:
    - >-
      Harvey still lacks audited financials, so ARR, margin, and retention remain partially estimated and could
      materially differ from the market narrative.
    - >-
      Even after the latest growth, a $15.5B valuation implies a demanding multiple unless Harvey sustains very strong
      ARR expansion and margin improvement.
    - >-
      The company’s product and go-to-market momentum increasingly depend on its model stack, data rights, and ability
      to keep customers from treating legal agents as a replaceable workflow layer.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, net burn, and ARR growth rate remain non-public; current financials are still
      partly third-party estimates.
    - >-
      Full commercial terms of the model and infrastructure stack — pricing, exclusivity, model access rights, and any
      partner ROFRs — are not disclosed.
    - Preference stack, liquidation rights, ratchets, and secondary mechanics for the latest financing are not public.
    - >-
      Regulatory trajectory for generative AI in legal proceedings remains uncertain; several jurisdictions are still
      refining bar rules and AI-disclosure expectations.
