companyProfile:
  summary: >
    Harvey AI Corporation is an AI operating system for legal and professional services founded in late 2022 by Winston
    Weinberg (CEO, ex-Goldman Sachs attorney) and Gabriel Pereyra (CTO, ex-Google Brain / DeepMind). The company builds
    AI applications for complex knowledge work — beginning with legal and expanding into tax, finance, compliance, and
    other professional-services workflows. By September 2026, Harvey had announced a $550M round at a $15.5B valuation,
    claimed more than 100,000 lawyers and 1,500+ organizations on the platform, and expanded from assistant-style
    workflows into agent builders and an in-house model.
  foundedDate: '2022-11-01'
  founders:
    - name: Winston Weinberg
      role: CEO and Co-Founder
      background: Harvard Law JD, former Goldman Sachs attorney; brings legal domain depth and enterprise sales credibility.
      claimRefs: []
    - name: Gabriel Pereyra
      role: CTO and Co-Founder
      background: >-
        PhD-level ML researcher from Google Brain and DeepMind; leads model architecture, fine-tuning, and AI safety
        work.
      claimRefs: []
  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >
    Harvey's platform combines legal research, drafting, review, document analysis, and workflow automation with Agent
    Builder, purpose-built legal agents, and the Tenet open-weight legal model, plus integrations across common
    enterprise systems.
  customerFocus: >-
    Am Law 100 and Am Law 200 law firms, global firms, in-house legal teams, and large professional-services
    organizations seeking AI-assisted complex knowledge workflows.
  businessModel: >-
    Enterprise software and usage-based platform licensing with seat expansion and module adoption; larger deployments
    are driven by firmwide rollouts, custom agent programs, and enterprise integrations.
  stage: late-stage private
  fundingStatus: >
    $15.5B valuation (September 2026, Diffusion + Lightspeed co-led); $1.55B+ total raised across Seed through the
    latest priced round. Prior lead and follow investors include Sequoia, a16z, Kleiner Perkins, Coatue, Conviction,
    GIC, Goldman Sachs Alternatives, and the OpenAI Fund.
  disclosureProfile: private-undisclosed
  claimRefs: []
summary:
  headline: >-
    Harvey remains the category leader in legal AI, now backed by a $15.5B valuation and broad customer adoption, but
    the business still carries high disclosure risk, model-dependency risk, and a rich multiple versus its
    still-partially disclosed ARR.
