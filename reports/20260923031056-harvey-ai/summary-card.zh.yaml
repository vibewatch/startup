  topStrengths:
    - 客户覆盖广且增长快——超过 1,500 家机构、100,000 多名律师使用——为 Harvey 提供了强社会证明，也支撑其成为企业标准化平台的叙事。
    - 产品栈已从助手工作流延伸到法律智能体、智能体构建和自研模型，既拓宽变现面，也降低纯助手被商品化的风险。
    - 法律 AI 仍是结构性供给不足的市场；Harvey 看起来是品类中最强品牌，并在受监管工作流上建立了差异化的信任与合规姿态。
  topRisks:
    - Harvey 仍缺少审计财务，ARR、利润率和留存仍部分来自估计，可能与市场叙事存在重大差异。
    - 即便最近继续增长，$15.5B 估值也意味着很高要求；除非 Harvey 持续保持强劲 ARR 扩张并改善利润率，否则倍数压力很大。
    - 公司的产品和 go-to-market 动能越来越依赖模型栈、数据权利，以及阻止客户把法律智能体视为可替换工作流层的能力。
  unresolvedGaps:
    - 审计收入、毛利率、净烧钱和 ARR 增速仍未公开；当前财务数据仍部分依赖第三方估计。
    - 模型和基础设施栈的完整商业条款——定价、排他性、模型访问权以及任何合作伙伴 ROFR——尚未披露。
    - 最新融资的优先股堆叠、清算权、棘轮条款和老股交易机制尚未公开。
    - 生成式 AI 在法律程序中的监管路径仍不确定；多个司法辖区仍在细化律师协会规则和 AI 披露预期。
