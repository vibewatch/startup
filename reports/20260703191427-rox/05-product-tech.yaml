  evidenceGaps:
    - type: missing-source
      severity: material
      topic: self-hosting-and-resilience
      missingEvidence: >-
        A current architecture or trust document that states whether Rox offers self-hosted, VPC-isolated, or on-prem
        deployment modes plus disaster-recovery design.
      whyItMatters: Enterprise buyers often underwrite deployment risk and data-residency controls separately from feature fit.
      diligencePath: >-
        Request current architecture diagrams, hosting options, and DR/RTO-RPO commitments from the security or
        solutions team.
      relatedQuestionRefs:
        - QE023
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: material
      topic: public-roadmap-visibility
      missingEvidence: >-
        A dated roadmap or release-note stream after the March 2026 launch wave that shows what is committed, in
        preview, or generally available.
      whyItMatters: >-
        Without a forward roadmap, it is hard to judge whether current launches are the start of a durable platform
        cadence or isolated announcements.
      diligencePath: Request current product roadmap artifacts, recent changelogs, and GA/preview definitions by feature area.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE005
    - type: private-evidence-only
      severity: material
      topic: uptime-and-sla
      missingEvidence: >-
        Public SLA terms, uptime history, or incident metrics for enterprise customers are not present in the fetched
        corpus.
      whyItMatters: >-
        Reliability commitments matter if Rox is expected to sit in the seller's operating path or automate
        customer-facing work.
      diligencePath: >-
        Ask for standard MSA/SLA language, status-page history, and incident-postmortem summaries from the last twelve
        months.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: minor
      topic: subprocessor-and-ai-vendor-detail
      missingEvidence: >-
        The fetched pages mention subprocessors and zero-data-retention AI providers but do not include the current
        named subprocessor list or per-provider control detail.
      whyItMatters: Security diligence usually requires current vendor names, data flows, and opt-out or residency choices.
      diligencePath: Request the live subprocessor list, model-provider matrix, and any tenant-isolation or data-residency options.
      relatedQuestionRefs:
        - QE014
      relatedTableRefs:
        - TE004
