        - No public module-by-module attach-rate disclosure
      - - Microsoft 365 Copilot surface
        - Seller inside Word / Excel / PowerPoint / Outlook
        - Brings Rox context and outputs into existing Microsoft work surfaces
        - Launched Mar 2026
        - Meets users inside daily productivity tools
        - Marketplace timing and enterprise rollout depth are still lightly disclosed
      - - Databricks deployment path
        - Enterprise IT / data team
        - Runs Rox directly on the customer warehouse or lakehouse environment
        - Generally available Mar 2026
        - Warehouse-native posture aligns with enterprise data gravity
        - No public detail on deployment variants or DR architecture
      - - Usage-priced plans
        - Individual seller / team admin
        - Meters consumption via Agent Actions across Starter, Core, and Enterprise plans
        - Public pricing live
        - Outcome- and usage-oriented pricing instead of seats only
        - Enterprise pricing remains custom and opaque
      - - Trust and policy layer
        - Security / legal / admin
        - Sets encryption, audit, privacy, and review constraints for AI outputs
        - Public controls disclosed
        - More explicit trust posture than many early AI vendors
        - No fetched uptime SLA or public subprocessor matrix
    notes: >-
      This matrix combines product surfaces, packaging, and trust assets because Rox describes them as one operating
      layer rather than isolated SKUs.
