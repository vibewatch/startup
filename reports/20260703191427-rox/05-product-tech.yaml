callouts:
  - calloutType: strength
    title: Rox has a coherent workflow thesis, not just an AI feature bundle
    body: >-
      The product story is internally consistent across Microsoft, Databricks, investor, and pricing materials: context
      should be unified outside the CRM, agents should do the low-value work continuously, and sellers should act from
      richer context inside tools they already use. That coherence does not prove category leadership, but it does
      reduce the risk that Rox is merely relabeling a narrow point feature as an operating system.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE030
  - calloutType: insight
    title: Public trust controls are decent for a young vendor, but still not enough for final security diligence
    body: >-
      Encryption, SOC 2, no-generalized-training claims, DPA restrictions, and breach notice language are all positives.
      The missing pieces are the ones enterprise buyers usually request after the first call: current subprocessors,
      deployment variants, uptime commitments, incident history, and deeper operating controls.
    claimRefs:
      - CE019
      - CE020
      - CE022
      - CE023
      - CE025
  - calloutType: risk
    title: The roadmap is fresher on distribution than on long-term platform depth
    body: >-
      March 2026 gave Rox two notable launches through Databricks and Microsoft, and Ramp shows current category
      visibility. But the public record is much thinner on what comes next, how fast new capabilities move from preview
      to GA, and how the company will expose reliability commitments as deployments scale.
    claimRefs:
      - CE031
      - CE032
      - CE034
      - CE036
