  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-win-loss-data
    missingEvidence: A current enterprise win/loss breakdown showing how often Rox beats Salesforce, HubSpot, Clay, Gong, and other named rivals in live procurement.
    whyItMatters: Competitive narratives are much stronger when they are tied to actual evaluation outcomes rather than positioning claims.
    diligencePath: Request the last twelve months of competitive evaluation data by segment, deal size, and final disposition.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-realization
    missingEvidence: Actual enterprise contract values, discount bands, minimum commitments, and any overage or services terms for Rox and major peers.
    whyItMatters: List pricing understates real competitive economics, especially when incumbents can discount bundles.
    diligencePath: Request recent order forms or pricing sheets from Rox and triangulate against buyer references.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: competitor-security-proof
    missingEvidence: Fetched third-party or certification evidence for competitor security and compliance posture beyond headline marketing claims.
    whyItMatters: Trust posture is central in enterprise sales software, but the fetched comparison is still too marketing-led.
    diligencePath: Collect trust-center pages, SOC reports, or buyer security questionnaires for the major competitors.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: material
    topic: bundle-capability-parity
    missingEvidence: Independent evidence showing whether Salesforce or HubSpot already match Rox on context depth in real enterprise deployments.
    whyItMatters: Rox’s moat depends on bundle incumbents not being “good enough” for the buyer’s highest-value use cases.
    diligencePath: Run side-by-side pilot tests or secure buyer references that evaluated both Rox and CRM-native agents in the same workflow.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: stale
    severity: minor
    topic: new-entrant-watchlist
    missingEvidence: A current 2026 watchlist of newly launched agentic CRM or AI-GTM entrants beyond the vendors fetched for this chapter.
    whyItMatters: The likely-entrant field is moving quickly, so today’s competitor map may age fast.
    diligencePath: Refresh source discovery before the next report revision and add any newly launched vendors with direct fetched URLs.
