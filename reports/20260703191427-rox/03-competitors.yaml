- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk theme
  - Supporting evidence
  - Main threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Cross-system context layer
    - Rox positions across CRM, Microsoft, email, and other systems instead of one channel
    - CRM-native bundles can narrow the wedge with “good enough” context
    - High
    - If bundle depth catches up, Rox loses the procurement event
    - Request win/loss data versus Salesforce and HubSpot in complex enterprise deals
  - - Enterprise trust and governance
    - MongoDB case study and Microsoft security language support this wedge
    - One visible quality or security failure would be category-wide negative proof
    - High
    - AI-SDR categories lose buyers quickly when trust breaks
    - Ask for SOC 2 reports, incident history, and enterprise security review conversion rates
  - - Low-friction pilot pricing
    - Free and $50 entry tiers reduce first-try friction
    - Easy pilots also make multi-homing and fast churn easier
    - Medium
    - Low switching cost cuts both ways
    - Request conversion from starter/core into enterprise contracts and 90-day retention by tier
  - - Partner and workflow embedding
    - Microsoft 365 Copilot embed increases surface area where sellers already work
    - Salesforce and HubSpot have stronger default distribution
    - High
    - Distribution power often beats feature nuance in large software categories
    - Request sourced pipeline and expansion data from Microsoft or other partner channels
  - - Forward-deployed workflow tuning
    - Customer pages show role-specific deployment and training support
    - Services-heavy rollout can hurt gross margin and scalability
    - Medium
    - The moat may depend on people and process, not pure software
    - Ask for implementation time, services load, and customer-success headcount per deployment
  - - Category quality backlash
    - TechCrunch on Artisan shows churn, hallucinations, and fit failures
    - Negative category headlines raise buyer skepticism for everyone
    - High
    - Rox must differentiate on quality, not just automation claims
    - Ask for customer qualification filters, model QA process, and human-review defaults
  notes: Severity is an analytical judgment based on fetched evidence, not a management-provided risk score.
