- id: capability-pricing-and-distribution
  title: Capability, Pricing, Distribution, and Trust Comparison
  body: 'Capability breadth and monetization structure diverge sharply across the field. Rox''s public entry point is unusually low for an enterprise-facing product—free for 2,000 actions and $50 per month for 5,000 actions—yet the company discloses far less than Clay, Amplemarket, or Salesforce about how large deployments are packaged. Clay and Amplemarket make it easier to understand list pricing for data-, signal-, and workflow-heavy motions, while Salesforce and HubSpot can lean on installed distribution, native workflow context, and bundling leverage. Gong and Outreach sit between those poles: both already sell into large revenue organizations, so their AI expansion often looks like a contract extension rather than a new vendor approval. Trust posture matters almost as much as feature breadth. Rox''s own Microsoft and MongoDB materials emphasize governance, security, and human review; HubSpot and Salesforce emphasize built-in trust and controls; and the adverse evidence around Artisan
    shows how quickly quality problems can undermine even a compelling automation pitch. The buyer question is therefore not only who has the most features, but who can credibly deliver enough workflow depth, safety, and procurement simplicity to win budget without creating a new operational headache. Another practical difference is procurement path: bundles can be approved as extensions of existing CRM spend, while Rox and other standalones must justify both incremental budget and incremental security review.'
