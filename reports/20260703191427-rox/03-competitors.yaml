callouts:
- calloutType: insight
  title: Rox is competing on workflow depth, not just outbound automation
  body: The direct AI-SDR cohort sells a clear top-of-funnel ROI story, but Rox is trying to win a wider budget line by spanning prospecting, account monitoring, deal execution, and expansion workflows inside existing systems. That expands upside, but it also broadens the substitute set Rox must beat.
  claimRefs:
  - CP004
  - CP006
  - CP019
  - CP023
  - CP038
- calloutType: risk
  title: Installed-base distribution is the hardest moat to replicate
  body: Salesforce and HubSpot can turn AI agents into an extension of software that buyers already own, already trust, and already budget for. That means Rox has to prove meaningfully better workflow depth or time-to-value, not just parity on core agent features.
  claimRefs:
  - CP031
  - CP032
  - CP033
  - CP034
  - CP037
- calloutType: risk
  title: The strongest adverse evidence is category-quality risk
  body: TechCrunch’s reporting on Artisan shows that bad customer selection, low-quality outreach, and early hallucinations still create churn and reputational damage in this category. Rox cannot rely on AI novelty; it has to win on quality control and deployment fit.
  claimRefs:
  - CP021
  - CP022
  - CP040
