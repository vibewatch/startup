    - Less transparent public pricing and narrower customer-proof set in fetched sources
  - - Salesforce Agentforce
    - CRM-native incumbent bundle
    - Thousands of CRM customers and deep enterprise distribution
    - Existing Salesforce estates and enterprise admins
    - Agents across service, sales, employee workflows, voice, builder, guardrails
    - Free entry, flex credits, per-conversation, per-user, add-ons, and editions
    - Layer agentic AI into the existing CRM contract
