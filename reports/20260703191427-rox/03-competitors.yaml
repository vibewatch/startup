  - - 6sense
    - Incumbent GTM intelligence platform
    - Platform-scale positioning; no current revenue disclosure fetched
    - Enterprise GTM teams needing intent, orchestration, and AI execution
    - GTM intelligence, AI email agents, drag-and-drop workflows, context layer
    - Pricing not publicly disclosed in fetched source
