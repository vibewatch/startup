  - - HubSpot Breeze
    - CRM-native incumbent bundle
    - HubSpot says 299,000+ customers worldwide
    - SMB through mid-market teams, with expanding enterprise reach
    - Prospecting, data, customer, health, research, and closing agents
    - Outcome- and user-oriented bundle economics within HubSpot plans
    - Ship fast, built-in AI for the installed customer base
    - Least differentiated in the largest, most complex enterprise motions
