chapter:
  number: 2
  title: Market Analysis
  summary: 'Rox sits inside the rapidly expanding AI SDR / AI-first GTM software market, where external sources place 2026 spend between roughly $5.22 billion and $5.81 billion and long-range forecasts imply a multibillion-dollar expansion through 2030–2034. The buyer logic favors enterprise teams that already run complex revenue workflows across multiple systems, but the market is being pulled in two directions at once: broad demand for productivity and context automation, and rising substitution pressure from CRM-native bundles such as HubSpot Breeze and Salesforce Agentforce. Public data supports a large opportunity, but not a precise serviceable-market-share calculation for Rox because current company ARR remains undisclosed.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: The best-fit market boundary for Rox is not the entire CRM software market but the narrower AI SDR, AI-first GTM, and revenue-intelligence workflow layer that automates prospecting, research, outreach, and next-step execution. Analyst definitions explicitly include software and services delivered via cloud-native SaaS, browser extensions, and API-first embeds. That scope captures the operating layer Rox is trying to become. It excludes basic record-keeping CRMs when they are used only as systems of record, because Rox argues the CRM is no longer the place where live revenue work should happen. Within the surrounding landscape, there are four close substitute paths. First, revenue-intelligence and GTM-intelligence platforms such as Gong, 6sense, and Outreach cover overlapping budgets even when their product scope differs. Second, AI SDR specialists and low-end outbound tools such as Amplemarket, Artisan, and 11x compete for the same “do more outbound with fewer humans” spend pool.
    Third, CRM-native bundles from HubSpot and Salesforce embed prospecting and agentic features inside an already-purchased system of record, which can remove the procurement event that a standalone platform needs. Fourth, some teams still rely on manual research, spreadsheets, or internal builds. Rox only needs to win one of those budget line items to enter the stack, but it must remain differentiated against all four over time.
