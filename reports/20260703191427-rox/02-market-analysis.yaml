  evidenceGaps:
  - type: missing-source
    severity: material
    topic: rox-sam-share
    missingEvidence: A current, company-confirmed ARR or customer-spend base that would allow Rox's actual share of its serviceable market to be estimated.
    whyItMatters: TAM debates are less relevant than whether Rox is already taking a material share of the enterprise slice it targets.
    diligencePath: Request current ARR, average contract value, and customer-segment mix from management.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: 2026 market-size contradiction
    missingEvidence: A reconciliation for why cited 2026 market estimates differ between $5.22 billion and $5.81 billion.
    whyItMatters: The spread changes any market-share math and reflects definition variance across analyst firms.
    diligencePath: Pressure-test each analyst definition and confirm which one best matches Rox's actual deployment footprint.
    relatedQuestionRefs:
    - QM002
    - QM018
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise procurement decision chain
    missingEvidence: Named buyer interviews clarifying whether CROs, RevOps, CIOs, or line managers control budget in Rox's actual winning deals.
    whyItMatters: Buyer identity determines sales-cycle length, expansion potential, and whether bundling risk is existential.
    diligencePath: Review win-loss notes or interview three current Rox customers across pilot and scaled deployments.
    relatedQuestionRefs:
    - QM008
    - QM009
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: category formation speed
    missingEvidence: Longitudinal spend-share data beyond Ramp's current-category snapshot to show how quickly AI-first GTM is consolidating as a software budget line.
    whyItMatters: The category could still fragment back into CRM, engagement, and enrichment budget lines.
    diligencePath: Collect additional procurement or spend-data sources showing category momentum over multiple quarters.
    relatedQuestionRefs:
    - QM016
    relatedTableRefs:
    - TM001
