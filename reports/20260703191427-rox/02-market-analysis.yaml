callouts:
- calloutType: insight
  title: This category is becoming a real software budget line
  body: Ramp already classifies AI-First GTM as its own vendor category, and multiple public competitors now speak the language of agents, orchestration, and revenue operating systems rather than only point automation. That makes Rox easier to explain to buyers, but it also increases direct comparability.
  claimRefs:
  - CM014
  - CM023
  - CM024
  - CM036
- calloutType: risk
  title: Incumbent bundling is the structural adoption ceiling
  body: HubSpot and Salesforce now sell agentic prospecting and action layers within already-installed CRM estates. If those bundles become “good enough,” Rox could struggle to hold a standalone software budget except in the most complex enterprise environments.
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
- calloutType: assumption
  title: Rox's true SAM is narrower than the headline market
  body: The broad AI SDR category is useful for showing opportunity, but Rox is clearly biased toward larger, more complex, multi-system revenue teams. Underwriting should therefore focus on the enterprise automation slice, not on the entire AI SDR market number.
  claimRefs:
  - CM006
  - CM007
  - CM016
  - CM017
  - CM037
