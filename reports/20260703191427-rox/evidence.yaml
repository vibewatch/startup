evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting rights, and investor ownership percentages after the seed and Series A rounds.
    whyItMatters: >-
      Control rights and board influence can materially affect follow-on financing terms, founder autonomy, and exit
      optionality.
    diligencePath: Request the current cap table, board observer agreements, and side letters in the data room.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financing-round-size
    missingEvidence: The size and terms of the reported March 2026 financing round remain unconfirmed by the company.
    whyItMatters: Without the round size, security type, and investor mix, the $1.2 billion valuation cannot be fully underwritten.
    diligencePath: >-
      Obtain signed financing documents or management confirmation of round amount, instrument, and post-money
      structure.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: current-headcount
    missingEvidence: No recent public employee count was found after Sequoia's November 2024 “15 builders” description.
    whyItMatters: Hiring pace is a proxy for execution capacity, burn, and enterprise support readiness.
    diligencePath: Confirm current FTE count, open roles, and location mix directly from management or payroll/HRIS exports.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: >-
      No company-confirmed 2026 ARR, revenue, or burn metric is public beyond TechCrunch's sourced $8 million 2025 ARR
      projection.
    whyItMatters: The financing and valuation discussion cannot be evaluated rigorously without current ARR, growth, and burn.
    diligencePath: Request the 2025 monthly recurring revenue bridge, 2026 budget, and actuals versus plan.
    relatedQuestionRefs:
      - QO019
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: A complete chronology of board changes, customer launches, and any adverse events after March 2026.
    whyItMatters: >-
      The milestone table is intentionally partial and may omit later governance or adverse events that matter for
      diligence sequencing.
    diligencePath: >-
      Ask management for the internal company timeline covering financing, launch, governance, and customer milestones
      since founding.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: rox-sam-share
    missingEvidence: >-
      A current, company-confirmed ARR or customer-spend base that would allow Rox's actual share of its serviceable
      market to be estimated.
    whyItMatters: >-
      TAM debates are less relevant than whether Rox is already taking a material share of the enterprise slice it
      targets.
    diligencePath: Request current ARR, average contract value, and customer-segment mix from management.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: 2026 market-size contradiction
    missingEvidence: A reconciliation for why cited 2026 market estimates differ between $5.22 billion and $5.81 billion.
    whyItMatters: The spread changes any market-share math and reflects definition variance across analyst firms.
    diligencePath: Pressure-test each analyst definition and confirm which one best matches Rox's actual deployment footprint.
    relatedQuestionRefs:
      - QM002
      - QM018
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise procurement decision chain
    missingEvidence: >-
      Named buyer interviews clarifying whether CROs, RevOps, CIOs, or line managers control budget in Rox's actual
      winning deals.
    whyItMatters: Buyer identity determines sales-cycle length, expansion potential, and whether bundling risk is existential.
    diligencePath: Review win-loss notes or interview three current Rox customers across pilot and scaled deployments.
    relatedQuestionRefs:
      - QM008
      - QM009
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: category formation speed
    missingEvidence: >-
      Longitudinal spend-share data beyond Ramp's current-category snapshot to show how quickly AI-first GTM is
      consolidating as a software budget line.
    whyItMatters: The category could still fragment back into CRM, engagement, and enrichment budget lines.
    diligencePath: Collect additional procurement or spend-data sources showing category momentum over multiple quarters.
    relatedQuestionRefs:
      - QM016
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: material
    topic: enterprise-win-loss-data
    missingEvidence: >-
      A current enterprise win/loss breakdown showing how often Rox beats Salesforce, HubSpot, Clay, Gong, and other
      named rivals in live procurement.
    whyItMatters: >-
      Competitive narratives are much stronger when they are tied to actual evaluation outcomes rather than positioning
      claims.
    diligencePath: Request the last twelve months of competitive evaluation data by segment, deal size, and final disposition.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-realization
    missingEvidence: >-
      Actual enterprise contract values, discount bands, minimum commitments, and any overage or services terms for Rox
      and major peers.
    whyItMatters: List pricing understates real competitive economics, especially when incumbents can discount bundles.
    diligencePath: Request recent order forms or pricing sheets from Rox and triangulate against buyer references.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: competitor-security-proof
    missingEvidence: >-
      Fetched third-party or certification evidence for competitor security and compliance posture beyond headline
      marketing claims.
    whyItMatters: Trust posture is central in enterprise sales software, but the fetched comparison is still too marketing-led.
    diligencePath: Collect trust-center pages, SOC reports, or buyer security questionnaires for the major competitors.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: bundle-capability-parity
    missingEvidence: >-
      Independent evidence showing whether Salesforce or HubSpot already match Rox on context depth in real enterprise
      deployments.
    whyItMatters: Rox’s moat depends on bundle incumbents not being “good enough” for the buyer’s highest-value use cases.
    diligencePath: >-
      Run side-by-side pilot tests or secure buyer references that evaluated both Rox and CRM-native agents in the same
      workflow.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: stale
    severity: minor
    topic: new-entrant-watchlist
    missingEvidence: >-
      A current 2026 watchlist of newly launched agentic CRM or AI-GTM entrants beyond the vendors fetched for this
      chapter.
    whyItMatters: The likely-entrant field is moving quickly, so today’s competitor map may age fast.
    diligencePath: >-
      Refresh source discovery before the next report revision and add any newly launched vendors with direct fetched
      URLs.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: current-arr-bridge
    missingEvidence: A current monthly ARR bridge, booked-to-billed reconciliation, and customer-count trend for Rox.
    whyItMatters: >-
      Without current ARR and trend data, the public valuation multiple cannot be stress-tested or compared to current
      operating reality.
    diligencePath: Request monthly ARR, MRR, customer count, and expansion / churn bridge for at least the last 12 months.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
