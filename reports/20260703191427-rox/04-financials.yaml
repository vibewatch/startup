callouts:
- calloutType: risk
  title: The valuation runs far ahead of the public metric set
  body: A reported $1.2 billion valuation against projected 2025 ARR of $8 million is a powerful signal of investor belief, but it is not a substitute for current ARR, gross margin, retention, or cash disclosure. The multiple is the headline risk until private diligence closes those gaps.
  claimRefs:
  - CI008
  - CI009
  - CI036
  - CI040
- calloutType: insight
  title: Customer pages show the motion Rox wants to monetize
  body: The public case studies are strongest on workflow ROI proxies—less prep, faster ramp, more qualified meetings, and higher closed ARR for expansion users. That is useful directional evidence, but it still has to convert into auditable retention and margin outcomes before the story is fully finance-grade.
  claimRefs:
  - CI013
  - CI015
  - CI016
  - CI017
  - CI019
  - CI038
- calloutType: recommendation
  title: Do not underwrite capital adequacy from public data alone
  body: Public materials support a recurring-software thesis and strong product-market signal, but they do not disclose cash, burn, runway, debt, or current ARR. Those are not nice-to-have details at this valuation—they are the gating diligence items.
  claimRefs:
  - CI025
  - CI030
  - CI040
  - CI041
