  rows:
  - - Current ARR
    - Projected 2025 ARR of $8M at fundraise; current ARR undisclosed
    - medium
    - Anchors valuation and runway logic
    - Only a backward-looking projected figure is public
    - Request monthly ARR bridge from Jan 2025 to current run date
  - - Gross margin
    - Not public
    - low
    - Determines whether Rox behaves like software or services
    - Public-company comps suggest high long-run software margins are possible, but AI compute and services can delay them
    - Request GAAP and contribution gross margin by product and by customer segment
  - - Net revenue retention
    - Not public
    - low
    - Best test of expansion-led revenue quality
    - Customer stories imply expansion use cases, but no audited NRR exists
    - Request trailing twelve-month gross and net dollar retention by cohort
  - - CAC payback
    - Not public
    - low
    - Shows whether distribution motion is efficient
    - Published case studies imply strong ROI stories, but not acquisition cost
    - Request fully loaded CAC, payback, and channel split for self-serve versus enterprise
  - - Implementation load
    - Not public
    - low
    - Heavy services or tuning can suppress margins
    - Customer stories imply hands-on deployment and training
    - Request average implementation hours and customer-success staffing per live deployment
  - - Usage efficiency
    - Actions are metered, but customer-level utilization is private
    - low
    - Determines whether action-based pricing monetizes value or creates overage friction
    - No public utilization cohort data exists
    - Request monthly action-consumption distributions and upgrade triggers by plan
  - - Working-capital profile
    - Not public for Rox; advance billing helps comps
    - low
    - Collections timing affects cash burn
    - Comp filings show advance-billed software can fund growth through deferred revenue
    - Request billing cadence, payment terms, deferred revenue, and accounts-receivable aging
  notes: 'Null values are deliberate: this chapter distinguishes between what can be inferred from public evidence and what still requires private diligence.'
