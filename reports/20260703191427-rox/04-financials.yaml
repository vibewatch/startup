- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Public proxy available?
  - Why proxy is inadequate
  - Exact diligence path
  rows:
  - - Current ARR and monthly trend
    - Blocks revenue-quality and growth assessment
    - Projected 2025 ARR only
    - One projected data point cannot show present growth or seasonality
    - Request monthly ARR bridge and booked-versus-billed walk
  - - Gross margin by product / service mix
    - Blocks software-like margin thesis
    - Public-company comps only
    - Comparables do not reveal Rox compute load or services intensity
    - Request GAAP gross margin and cost-of-revenue split
  - - Net revenue retention and logo retention
    - Blocks stickiness and expansion thesis
    - Case studies imply expansion
    - Vendor-curated wins are not cohort evidence
    - Request gross / net retention by cohort and by segment
  - - Cash, burn, and runway
    - Blocks capital-adequacy judgment
    - Historical capital raised and valuation
    - Funding history cannot substitute for current liquidity
    - Request cash balance, burn, and 18-month runway model
  - - Customer concentration and ACV mix
    - Blocks downside scenario modeling
    - Named logos and use cases
    - Named customers do not reveal dependence or revenue skew
    - Request top-20 customer revenue share and ACV distribution
  - - Implementation and support load
    - Blocks margin and scaling analysis
    - Customer pages imply hands-on support
    - Narratives do not quantify services intensity
    - Request implementation time, CS ratios, and partner-delivery mix
  notes: Every gap listed here is material to valuation support, margin path, or capital adequacy; none can be closed with public marketing pages alone.
