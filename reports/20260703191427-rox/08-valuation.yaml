- id: final-diligence-gates
  title: Exit readiness and final diligence asks
  body: 'Rox is not ready for a conviction buy call on public evidence alone. The missing items are the ones that matter most
    for underwriting: current ARR, NRR, gross margin, customer concentration, round terms, and any preference or secondary
    structure that could make the headline valuation less meaningful for a new investor. That does not make the company uninteresting.
    It means the next diligence hour should be spent on economics and structure, not on debating whether the market exists.
    The public record already answers that question well enough. What it does not answer is whether Rox is merely early and
    expensive, or whether it is too early and too expensive. The call improves meaningfully only if management can show that
    current operating proof has caught up to the narrative velocity implied by a 2026 unicorn mark.'
  claimRefs:
