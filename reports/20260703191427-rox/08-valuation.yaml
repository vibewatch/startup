- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current ARR still close to the cited 2025 projection
    - Management evidence shows limited growth beyond the public $8M projection
    - The market narrative may still be true, but the reported price becomes much harder to defend
    - Pause or re-cut price expectations materially downward.
  - - Incumbent bundles win the workflow
    - Customers prefer Agentforce or Breeze for the same use cases Rox targets
    - Standalone wedge and pricing power compress
    - Lower upside assumptions and raise required margin of safety.
  - - Customer proof stays concentrated
    - A few flagship logos account for most revenue or referenceability
    - Durability and expansion quality become weaker than the public story suggests
    - Treat concentration as a pricing and diligence blocker.
  - - New financing arrives without better economics
    - Another round, tender, or secondary event appears before stronger ARR / retention evidence
    - Signals that narrative velocity is still outrunning disclosure quality
    - Assume weaker entry discipline and demand cap-table review before proceeding.
  notes: These triggers are observable from future company updates or diligence materials and directly change the investment
    call.
  claimRefs:
  - CV032
  - CV037
  - CV038
  - CV045
  - CV047
  - CV049
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR and retention
    - No retained public NRR, GRR, cohort expansion, or current ARR beyond the cited 2025 projection
    - These metrics decide whether the reported multiple is aggressive but plausible or simply unsupported
    - Finance diligence with management and board materials
  - - Customer concentration
    - No retained public top-customer or segment mix data
    - A small flagship set can make valuation far more fragile than the logo list suggests
    - Commercial diligence and reference calls
  - - Cap table and preferences
    - No retained public liquidation-preference, participation, or secondary-structure detail
    - Headline valuation can mislead on actual investor returns
    - Legal and financing diligence
  - - Services intensity and margin quality
    - No retained public services ratio, onboarding cost, or support burden data
    - A services-heavy motion can cap scalable software multiples
    - Operations and finance diligence
  - - Channel quality from Microsoft / Databricks
    - No retained public evidence on actual pipeline or ARR sourced by ecosystem partnerships
    - Partnership headlines only matter if they convert into repeatable distribution
    - Revenue-operations and partnerships diligence
  notes: These are the minimum diligence asks required to move from watchlist interest to a price-sensitive investment opinion.
