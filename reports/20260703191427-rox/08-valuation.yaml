- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Rox reported round
    - Reported valuation vs projected ARR
    - US$1.2B on projected US$8M ARR; ~150x implied ARR multiple
    - Latest public price-setting signal for the company itself
    - Round size, preferences, and current ARR were not publicly disclosed in retained sources
  - - Clay
    - Series C valuation and expected 2025 revenue
    - US$3.1B valuation on expected US$100M revenue; later Jan 2026 tender at US$5B and US$100M ARR
    - Closest high-velocity GTM workflow comp with much richer revenue disclosure
    - Different product breadth and stronger disclosed community/distribution moat
  - - 11x
    - Reported valuation vs ARR
    - ~US$350M valuation on ~US$10M ARR; ~35x implied ARR multiple
    - Useful AI SDR multiple anchor closer to Rox's scale than Gong or public incumbents
    - Single news report and limited public operating detail
  - - Artisan
    - ARR and financing status
    - US$25M Series A; US$5M ARR; 250 customers
    - Shows category traction can exist at lower scale and lower capital intensity
    - No retained public valuation multiple in the source set
  - - Gong
    - Mature category revenue scale
    - '>US$500M ARR with >55% YoY growth and 5,000+ customers'
    - Illustrates what category maturity looks like when scale is proven
    - No retained current valuation in the source set
  notes: The comp set mixes the company's own reported round, late-stage private comps, and a mature category leader because
    public AI revenue-agent valuation data is still patchy.
  enumerationScope:
    coverage: partial
    basis: 'This table intentionally covers only the most decision-useful public anchors retained on 2026-07-03: Rox''s own
      reported valuation event plus four disclosed private or mature category references with enough revenue or ARR context
