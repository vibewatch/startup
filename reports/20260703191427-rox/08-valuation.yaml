  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-retention
    missingEvidence: Current ARR, NRR, GRR, and cohort expansion metrics beyond the cited projected 2025 ARR number.
    whyItMatters: These are the core variables that would determine whether Rox's implied multiple is merely aggressive or
      fundamentally unsupported.
    diligencePath: Request current ARR, NRR, GRR, pipeline conversion, and cohort expansion metrics directly from finance
      and revenue leadership.
    relatedQuestionRefs:
    - QV025
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current post-money valuation terms, liquidation preferences, participation rights, and any secondary-sale
      structure.
    whyItMatters: Headline valuation can materially overstate actual investor attractiveness when preference stacks or side
      letters are opaque.
    diligencePath: Review the current cap table, stock-purchase agreements, and any tender or secondary documents.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by customer, segment, and partner-sourced channel.
    whyItMatters: A small number of flagship accounts could make the reported valuation much more fragile than the public
      logo list suggests.
    diligencePath: Request top-customer exposure, renewal cohorts, and segment-level expansion metrics.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: minor
    topic: comparable-set-limits
    missingEvidence: A more complete, apples-to-apples set of public or quasi-public AI revenue-agent valuation disclosures.
    whyItMatters: Private AI sales tooling still has patchy disclosure, so comparable ranges remain directional instead of
      exhaustive.
    diligencePath: Expand the comp set with any later public rounds, tender disclosures, or public-company multiple screens
      before pricing a transaction.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV004
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A fully exhaustive list of every relevant AI sales automation comp and every latest valuation event.
    whyItMatters: The comparable table intentionally focuses on the most decision-useful public anchors rather than pretending
      to exhaustive coverage from partial disclosure.
    diligencePath: Refresh the comp set before investment committee if new private rounds or public filing updates appear.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV013
    - QV014
    relatedTableRefs:
    - TV004
