- id: thesis-antithesis-and-comparables
  title: Thesis, anti-thesis, and comparable anchors
  body: The bull case for Rox is real. Sequoia, General Catalyst, and GV all describe a product that sits on top of fragmented
    seller systems and turns context into action, not just into analytics. Public customer proof from Ramp, MongoDB, New Relic,
    Bynder, and Together AI suggests there is genuine workflow value, and Ramp's own spend-data directory adds an external
    enterprise-adoption signal. The market itself is also large enough to matter, with top-down 2026 AI SDR estimates ranging
    from roughly $5.2 billion to $5.8 billion. The anti-thesis is just as important. Rework explicitly centers the 150x implied
    ARR multiple, while HubSpot and Salesforce are embedding agentic workflows into incumbent CRM platforms with far larger
    revenue bases and distribution. Comparable private-company evidence is also sobering. Clay's better-documented scale sits
    around $100 million revenue with a $3.1 billion round and a later $5 billion tender, while 11x was reported at roughly
    $350 million on about $10 million ARR. Those anchors do not prove Rox cannot be worth $1.2 billion, but they do show how
    much extra execution and disclosure support the current mark still requires.
