- id: scenario-range-and-recommendation
  title: Bull, base, and bear framing
  body: 'The best public-evidence call is research-more, not because Rox lacks product or market promise, but because current
    price sensitivity overwhelms current disclosure quality. A bull case exists if current ARR materially outgrew the cited
    2025 projection, if flagship logos continue expanding, and if the company can show retention and concentration metrics
    that justify a premium multiple over peers. The base case is less generous: Rox may be a real enterprise wedge with strong
    founder-market fit, yet still not be investable at the reported mark without better economics. The bear case is straightforward.
    If current ARR is only modestly above the cited 2025 level, if customer proof remains concentrated, or if incumbent bundles
    narrow the product wedge, then multiple compression toward lower private-comp bands becomes the more natural outcome.
    In that context, the reported price should be treated as a ceiling that still needs validation, not as a confirmed fair-value
    floor.'
  claimRefs:
