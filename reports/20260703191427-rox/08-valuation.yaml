- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Rox appears to solve a real cross-system seller workflow problem with recognizable enterprise logos and strong founder-market
      fit.
    - This thesis strengthens if current ARR, retention, and multi-account expansion are disclosed and show broad-based production
      use.
  - - Large category estimates and external Ramp adoption data support the idea that agentic GTM software can matter at enterprise
      scale.
    - If category growth slows or if spend data stops favoring Rox in enterprise accounts, the market-support case weakens.
  - - The anti-thesis is that the reported price is ahead of public economic proof, with a roughly 150x implied ARR multiple
      and little retained detail on NRR or margins.
    - If Rox shows that current ARR materially exceeds the cited projection and retention is strong, the multiple can compress
      into a more defensible forward frame.
  - - Incumbent bundles from Salesforce and HubSpot may compress Rox's wedge before standalone economics are proven.
    - If Rox can show that buyers choose it despite incumbent bundles because of superior context depth and expansion outcomes,
      competitive risk becomes less existential.
  notes: The anti-thesis is stronger than the thesis on price support, even though the underlying company case remains credible.
