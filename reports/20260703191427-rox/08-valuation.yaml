schemaVersion: report-v2
artifact: valuation
slug: rox
runDate: '2026-07-03'
company:
  name: Rox
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a constructive view on Rox's product ambition and category relevance, but not on the reported
    entry price. TechCrunch's sourced $1.2 billion March 2026 valuation against a projected $8 million 2025 ARR implies roughly
    150x ARR, far above the better-documented Clay and 11x private anchors retained in this run. The most defensible call
    is research-more with medium confidence, a high risk rating, and a stretched valuation stance until current ARR, retention,
    concentration, and preference terms are directly confirmed.
sections:
- id: entry-context-and-price-support
  title: Current entry context and public price support
  body: 'Rox has enough public momentum to justify serious diligence, but not enough to justify blind acceptance of the reported
    price. The available record is unusually lopsided: the valuation headline is strong, the customer and investor narrative
    is promising, and the underlying economics remain thin. TechCrunch reported a $1.2 billion March 2026 valuation and a
    projected 2025 ARR of $8 million, which implies a roughly 150x ARR multiple. That is the core valuation fact because it
    defines the burden of proof for everything else. Public pricing is transparent only at the low end, with a free Starter
    tier and a $50-per-month Core tier, while enterprise pricing remains custom. Investors therefore cannot infer actual enterprise
    ACV, gross margin, or retention quality from public materials. The right reading is not that Rox is obviously overvalued
    on every possible private metric; it is that the current public record does not yet support the headline mark with enough
    operating detail to call it attractive.'
  claimRefs:
