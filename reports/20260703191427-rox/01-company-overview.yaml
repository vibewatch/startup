callouts:
- calloutType: strength
  title: Founder-market fit is unusually strong for a two-year-old company
  body: Mukherjee has sold infrastructure software before and has directly owned enterprise growth operations, while the other founders add AI research and enterprise systems depth. That combination is unusually well matched to Rox's attempt to sell agentic workflow infrastructure into mature sales organizations.
  claimRefs:
  - CO019
  - CO020
  - CO021
- calloutType: risk
  title: The valuation is running far ahead of public financial disclosure
  body: The reported $1.2 billion mark sits on a sourced $8 million ARR projection and no public confirmation of round size, security type, burn, or current revenue. That does not make the price wrong, but it does mean the public record cannot yet justify it.
  claimRefs:
  - CO025
  - CO027
  - CO028
- calloutType: insight
  title: Rox is selling a new operating layer, not just another sales point solution
  body: Across investor, partner, and product materials, Rox consistently describes the data warehouse as the system of context and the agent layer as the place where work happens. That message is coherent across product, partnership, and pricing evidence, which increases confidence that the company has a clear product thesis even if the commercial outcome is still unproven.
  claimRefs:
  - CO004
  - CO008
  - CO009
  - CO034
  - CO035
