companyProfile:
  summary: >-
    Rox is a 2024-founded revenue-agent platform that aims to give enterprise sales teams one
    prebuilt agent per customer relationship. Its public thesis is that real revenue automation
    requires unified context across warehouse, CRM, communications, and external signals rather than
    isolated copilots inside a single tool.
