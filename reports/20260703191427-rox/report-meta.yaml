  topStrengths:
    - Rox's warehouse-native, context-rich revenue-agent thesis is differentiated and reinforced by Microsoft Copilot and Databricks launch evidence.
    - Named customer proof spans multiple enterprise workflows and logos including MongoDB, Ramp, New Relic, Bynder, LogicMonitor, Together AI, and Cloud Software Group.
    - Sequoia, General Catalyst, GV, and Ramp spend-data signals together suggest credible early enterprise adoption rather than purely speculative hype.
  topRisks:
    - The reported March 2026 valuation implies roughly 150x projected 2025 ARR on public evidence, which is difficult to justify without materially stronger current metrics.
    - Current ARR, retention, concentration, gross margin, burn, runway, and enterprise contract economics remain undisclosed.
    - Bundling by Salesforce and HubSpot, plus broader AI SDR quality and compliance risk, can compress Rox's standalone wedge.
  unresolvedGaps:
    - Current ARR, NRR, GRR, gross margin, and burn/runway remain private.
    - Enterprise ACV, services mix, channel contribution, and contract-duration evidence are not public.
    - Cap-table terms, liquidation preferences, and dilution overhang are not publicly documented.
    - Customer concentration, security incident history, and detailed DPA/subprocessor disclosures are not sufficiently public for underwriting.
