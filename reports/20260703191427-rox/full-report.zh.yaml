figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Rox 从 2024 年成立，到据报独角兽估值只用了约两年；期间还在 2026 年 3 月加入 Databricks 和 Microsoft 生态里程碑。
    data:
      items:
