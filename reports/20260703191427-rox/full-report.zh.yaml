      - number: '5.3'
        title: 信任控制、差异化与成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Rox 的信任姿态比许多年轻 AI 应用供应商更明确，但按企业软件标准仍不完整。安全、隐私、Microsoft 和 DPA 材料一致提到 AES-256 加密、不用客户数据训练通用模型的承诺、SOC 2 Type
              II、年度第三方安全审计、生成输出需人工审阅、按客户指令限制数据处理，以及违规通知义务。这些都是有意义的控制。与此同时，公司的公开差异化主张更多依赖架构和工作流范围，而不是独特披露的模型或基础设施细节。Salesforce
              Agentforce 和 HubSpot Breeze 描述的是既有套件内的广义智能体 AI 平台；Clay 描述 GTM 编排和数据层；Artisan 描述自主主动触达 BDR。Rox
              的主张是，把数据仓库原生上下文、多智能体工作流执行和跨生命周期营收用例合进一个操作层。最新鲜的信号是 2026 年 3 月 Databricks 与 Microsoft 发布公告，以及 2026 年 7 月
              Ramp 品类快照；但这些发布之后的公开路线图仍很稀疏，应视为尽调缺口，而不是已被证明的长期产品深度。竞争比较还暗示商业化风险。Rox 要求买方相信，统一营收操作层比拼装同类最佳工具或扩展既有 CRM
              套件更有价值。公开来源支持差异化故事，但还没有展示足够完整的采购证明、扩张经济性或可靠性指标，无法让最保守的企业客户也认为故事无懈可击。
