      - number: '5.2'
        title: 架构、部署模式与运行机制
        blocks:
          - type: paragraph
            body: >-
              Rox 公开材料里的架构主线是：上下文应在 CRM 外部统一，再通过智能体化工作流采取行动。Databricks 公告称，Rox
              运行在客户的数据仓库环境之上，并对齐既有数据模型、治理和性能标准。Microsoft 公告称，面向销售的体验随后可以借助邮件、会议和日历信号，在 Microsoft 365 Copilot
              内呈现这些上下文。Rox 自己关于框架和 primitives 的文章提供了更高层技术视角：公司把智能体系统解释为目标定义、上下文检索、推理、工具使用、决策、记忆和人工升级的组合，而不是单一的
              prompt-to-output 模型。公开文档也部分展示了部署和计量的运行模式。Rox
              称可在没有漫长配置周期的情况下部署，提供企业部署和培训，并为客户提供活动日志与管理员层面的用量汇总。公开来源仍未说明大型部署的确切托管拓扑、可用性姿态和灾难恢复承诺。该设计还有一个现实含义：Rox
              似乎依赖模型层之外的客户准备度。如果数据仓库不完整、CRM
              卫生差，或核心系统权限狭窄，公开框架文章暗示智能体质量会下降，因为上下文检索和工具执行是系统的一阶组成部分。这一点有用，因为它厘清了实施风险大概率在哪里：不在智能体 AI
              的抽象承诺里，而在企业数据准备、集成深度和上线期间的运营纪律里。
