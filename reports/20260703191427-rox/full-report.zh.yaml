      - number: '2.2'
        title: TAM、SAM 与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据方向上有吸引力，但并不精确。Market.us 估计 AI SDR 市场 2025 年为 $4.27B、2026 年为 $5.22B；The Business Research Company
              对同一品类的估计是 2025 年 $4.39B、2026 年 $5.81B。两份预测都显示陡峭增长曲线，但 2026 年近 $0.6B 的差距已经大到不能用简单平均抹平。长期预测更夸张：Market.us
              认为市场到 2034 年达到 $24.32B，TBRC 预计 2030 年达到 $17.58B。实际结论是，该品类已经大到足以让风险投资人和战略收购方在意；但只要公司披露缺失，任何计算 Rox
              实际份额的尝试都会卡住。更有用的视角，是从全球品类下沉到最适合 Rox 的切片。按 Market.us，北美一地就代表约 $2.02B 的 2026 年支出，企业细分也被描述为领先支出池。Rox 自己的信息更偏
              Global 2000 和跨系统，而不是 SMB 潜客开发，因此它真正可服务市场窄于宽泛的 AI SDR 标题市场，但仍然足够大。没有当前 ARR 或分细分市场
              ACV，公开证据只能支持一个可服务市场叙事，不能支持精确 SOM 数字。
