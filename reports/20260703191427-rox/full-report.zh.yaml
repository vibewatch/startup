        title: GTM 动作、效率代理指标和利润率路径
        blocks:
          - type: paragraph
            body: >-
              Rox 的公开证明集大多是运营性质，而非财务性质，但它仍然透露出 GTM 效率的重要信息。客户页面反复描述拿回时间、上手更快、更多合格会议、更好的打开率，以及每位销售或经理群组更高的已关闭
              ARR。这些不是经审计的 SaaS 指标，却展示了 Rox 想商业化的动作：更少人工准备、更多自动化调研，以及既有工作流中更深的上下文。这类模式如何成熟，最佳外部基准来自公开软件可比公司，而不是 Rox
              自身。HubSpot 文件显示，其 98% 收入来自订阅，多数合同期限一年或更短，递延收入加上账单时点会显著塑造报告增长。Salesforce 文件在更大规模上显示同一大体模式：约 95%
              经常性收入、预先开票、很大的剩余履约义务，以及复杂实施仍可能延迟收入确认的企业交易。这些文件不是 Rox，但清楚框定了取舍。Rox 如果能让软件收入保持主导，利润率可以变得有吸引力。如果前线部署服务、集成或 AI
              算力仍然过重，路径会比营销故事暗示的更慢、更资本密集。
