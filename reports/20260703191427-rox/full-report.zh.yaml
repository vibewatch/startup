      - number: '6.3'
        title: 耐久度、扩张、集中度与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Rox 还无法从已抓取的公开语料证明客户质量中最关乎投资判断的部分：耐久度和多元化。已审阅来源显示真实使用、可识别 logo 和一些习惯信号，但不披露
              NRR、GRR、流失、续约率、合同期限分布或头部客户集中度。即使公开伙伴界面也很薄：抓取集合中的 LeadIQ partner URL 没有提供实质性 co-sell 或渠道细节证据。这很重要，因为 Rox
              的客户证明正越来越多地从主动触达式潜客开发，延伸到续约、经理辅导、CRM
              卫生和扩张支持等生命周期更长的工作流。这些恰恰是合同经济性和续约行为最重要的用例。反向解读并不是客户故事是假的，而是多数正面证据仍由供应商托管，并且选择性量化。Rywalker
              明确指出，许多进展数字由供应商陈述，独立社区验证仍然薄弱。品类背景也仍处早期：Ramp 的品类页面称 AI-first GTM 整体渗透率仍低于 1%，因此不应把 Rox
              的相对排名误读为广泛市场成熟。合并来看，Rox 已经跨过 logo 证明门槛，也部分跨过生产证明门槛，但在公开证据中还没有跨过耐久度或集中度门槛。
