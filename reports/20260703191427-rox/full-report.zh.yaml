          label: Microsoft 触达面
          description: Copilot 和联合销售工作流分发。
        - id: d3
          label: Databricks 触达面
          description: 仓库原生部署可信度。
        - id: d4
          label: CRM / 通信技术栈
          description: Salesforce、HubSpot、Gmail、Outlook、Slack 及同类工具。
        - id: d5
          label: 旗舰客户标识
          description: 具名客户包括 Ramp、MongoDB、New Relic、Bynder、Together AI。
        - id: d6
          label: 既有厂商套件
          description: Agentforce 和 Breeze 能争夺同一预算。
      edges:
        - from: d2
          to: d1
        - from: d3
          to: d1
        - from: d4
          to: d1
        - from: d5
          to: d1
        - from: d6
          to: d5
        - from: d6
          to: d1
    approximationNotes: 这张依赖地图是方向性的，只突出已保留的公开来源中浮现出的最高信号关系。
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR033
      - CR034
      - CR049
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自真实市场和客户支持，但由于经济性披露仍过薄，价格支撑遇到硬停点。
    data:
      nodes:
        - label: 大市场 + 创始人-市场匹配
        - label: 真实客户证明 + Ramp 采用信号
        - label: 据报道的独角兽估值
        - label: 当前 ARR / NRR / 股权结构仍不透明
        - label: 估值立场 = 偏高
        - label: 建议 = 继续研究
    claimRefs:
      - CV014
      - CV020
      - CV039
      - CV040
      - CV041
      - CV049
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资判断最敏感的变量是实际 ARR、留存和集中度，而不是 TAM 讨论的增量变化。
    data:
      items:
        - label: 当前 ARR 证明
          value: 10
        - label: NRR / 队列留存
          value: 10
        - label: 客户集中度
          value: 9
        - label: 股权结构 / 优先权结构
          value: 8
        - label: 既有厂商套件执行
          value: 8
    approximationNotes: 0-10 的序数分数概括了新证据出现时，每个变量会在多大程度上改变投资判断。
    claimRefs:
      - CV032
      - CV037
      - CV044
      - CV045
      - CV046
      - CV051
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 最干净的公开区间不是公允价值美元目标，而是一个隐含 ARR 倍数带，范围从证据更充分的私营公司锚点 延伸到 Rox 据报道的估值标记。
    data:
      items:
        - label: Clay 远期倍数
          low: 31
          mid: 31
          high: 31
        - label: 11x 隐含 ARR 倍数
          low: 35
          mid: 35
          high: 35
        - label: Rox 据报道的隐含倍数
          low: 150
          mid: 150
          high: 150
    approximationNotes: 区间直接采用已保留的公开锚点，因此图表展示估值分布，而不是假装知道 Rox 当前以美元计的公允价值。
    claimRefs:
      - CV003
      - CV022
      - CV024
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Rox 在市场拉力和早期证明上得分高，但在证据完整性和估值支撑上较弱。
    data:
      items:
        - label: 市场拉力
          score: 8
        - label: 客户证明
          score: 7
        - label: 竞争护城河
          score: 5
        - label: 经济性可见度
          score: 2
        - label: 估值支撑
          score: 2
    approximationNotes: 分数是投资委员会的序数启发式判断，概括截至 2026-07-03 已保留的公开证据集。
    claimRefs:
      - CV012
      - CV014
      - CV018
      - CV032
      - CV039
      - CV050
      - CV054
