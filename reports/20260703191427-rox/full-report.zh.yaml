      - number: '7.4'
        title: 缓释因素、监测指标与打破投资假设的触发点
        blocks:
          - type: paragraph
            body: >-
              留存证据不足以支持看空产品需求，但足以要求更高的监测门槛。 最可执行的指标不是抽象 AI 风险，而是套件挤压、客户扩张质量、披露新鲜度和融资行为的可观察变化。 如果 Agentforce 或 Breeze 继续在
              Rox 瞄准的同一批销售工作流里扩张，套件威胁会上升。 如果具名旗舰客户停止扩张，公开法律材料持续陈旧，或 Rox 在披露更强经济性证据前又完成一轮融资，当前投资测算会进一步变弱。
              积极的一面是，其中几项风险可以监测：更新后的隐私材料、更广的生产部署、突破少数公开客户名单的扩张，以及 Microsoft 和 Databricks 关系转化为可重复分销而非一次性公告的证据。
              在这些证明出现前，正确姿态不是直接否定 Rox，而是把运营、治理和经济性细节缺失当成真正的尽调障碍，而不是表面瑕疵。
