  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与收入质量
        blocks:
          - type: paragraph
            body: >-
              Rox 公开商业化结构在入门层比在企业规模层更清楚。公司提供免费 Starter 档、每月 $50 的 Core 档，以及定制企业定价，全部绑定按量计费的 Agent
              Actions，而不是单纯按席位授权。该结构同时告诉投资人几件事。第一，Rox
              想要低摩擦的自下而上试用。第二，它试图把定价对齐已完成的工作，而不是原始用户数。第三，公开记录仍缺少投资判断最需要的细节：企业最低消费、超额费率、服务费、折扣区间、年度承诺和实际客户结构。Microsoft
              Copilot 材料也显示，Rox 正从潜客开发扩展到续约时间线、QBR 和 ROI
              文稿；这很重要，因为它暗示商业化可以扩展到账户管理和售后工作流，而不只依赖主动触达动作。即便如此，公司自己的法律和产品语言也提醒：结果会变化，必须人工审阅，成果不保证。因此，Rox
              公开标价有助于理解模式，但还不足以推断收入质量或客户经济性。
