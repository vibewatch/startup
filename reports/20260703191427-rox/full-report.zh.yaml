      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，Rox 还不足以支撑高确信买入判断。 缺失项正是投资测算最关键的部分：当前 ARR、NRR、毛利率、客户集中度、轮次条款，以及任何会让名义估值对新投资人意义变弱的优先权或老股结构。
              这不代表公司没有吸引力，而是下一小时尽调应该花在经济性和结构上，不是继续争论市场是否存在。 公开记录已经把这个问题回答得足够清楚。它没有回答的是，Rox 只是早且贵，还是太早且太贵。
              只有当管理层证明当前运营证据已经追上 2026 年独角兽估值所隐含的叙事速度时，判断才会明显改善。
