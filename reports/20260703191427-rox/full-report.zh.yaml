  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前入场语境与公开价格支撑
        blocks:
          - type: paragraph
            body: >-
              Rox 的公开动能足以支持认真尽调，但还不足以让投资人照单全收所称价格。 现有记录异常失衡：估值标题很强，客户和投资人叙事有吸引力，底层经济性却很薄。 TechCrunch 报道 Rox 2026 年 3
              月估值为 12 亿美元，预计 2025 年 ARR 为 800 万美元，隐含约 150 倍 ARR 倍数。 这是核心估值事实，因为它定义了其余所有事项的举证门槛。 公开定价只在低端透明，包括免费 Starter
              档和每月 $50 的 Core 档；企业定价仍为自定义。 因此，投资人无法从公开材料推断真实企业 ACV、毛利率或留存质量。 正确解读不是 Rox
              在所有可能的私有市场指标上显然被高估，而是当前公开记录还没有拿出足够运营细节来支撑这个名义估值，更谈不上称其有吸引力。
