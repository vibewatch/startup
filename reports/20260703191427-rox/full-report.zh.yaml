      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场增长逻辑很直接。外部研究把销售生产力压力、数字营销支出上升、云交付、全渠道销售和对话式 AI 列为主要需求驱动。Rox
              自己关于企业工作流和上下文层的文章，从实践者角度强化了同一诊断：营收团队被碎片化系统淹没，花太多时间找上下文，而不是基于上下文行动。因此，凡是能把碎片化数据变成工作流、而不只是仪表盘的供应商，都处在结构性有利的市场里。但反向力量也真实存在。隐私和合规在受监管环境里仍是硬约束；当
              AI 工具触及买方数据、消息和外部增补数据时，这一点尤其重要。质量风险是第二个主要约束。TechCrunch 对 Artisan
              的报道显示，该品类仍在应对低回复率、客户选择不匹配和早期幻觉问题。第三个、也是最具战略性的约束，是既有厂商打包。HubSpot 已经声称拥有数十万客户、原生潜客开发和数据智能体，以及清晰的按 resolution
              或按 lead 定价。Salesforce 同样把智能体化执行变成第一方平台，同时提供免费入口和按用量定价。这些既有厂商可能还没有完全匹配 Rox 的跨系统论点，但足以大幅收窄 Rox
              可切入的楔子。市场很大且在扩张，但也在快速汇合，这意味着 Rox 必须靠部署深度和上下文质量取胜，而不是只靠 AI 新鲜感。
