  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、工作流与包装
        blocks:
          - type: paragraph
            body: >-
              Rox 把产品描述为营收智能体平台，而不是简单助手或传统 CRM 替代品。在 Microsoft、Databricks、投资人和产品定位材料中，共同脉络是：Rox
              试图位于既有记录系统之上，运行营收团队原本手工完成的工作，包括潜客调研、账户监控、下一最佳行动生成、会议准备、交易支持和扩张动作。Microsoft 365 Copilot 材料尤其有用，因为它把卖点翻译成
              Word、Excel、PowerPoint 和 Outlook 内部的具体工作流；定价页面则显示，这些工作流按 Agent Actions 计量，而不是只按席位。这个包装很重要，因为它把 Rox
              定位成按用量定价的操作层，同时有入门自助计划和定制企业档。工作流证据在调研、简报、主动触达准备和销售执行支持上最强；对于公司“一个平台可以覆盖完整营收生命周期”的更大主张，它提供方向性支持，但还无法完全审计。
