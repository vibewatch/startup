      - number: '1.3'
        title: 融资基础、投资人和里程碑路径
        blocks:
          - type: paragraph
            body: >-
              Rox 的融资历史很短，但节奏已经很激进。公开报道和投资人文章显示，Rox 在 2024 年 11 月披露融资 $50M，包括 Sequoia 领投的种子轮，以及 General Catalyst 领投、GV
              参投的 Series A。Sequoia 将 Rox 描述为种子轮投资，并称自己也参与了 Series A；General Catalyst 明确称自己是 Series A 领投方；GV 称种子轮和 Series
              A 合计融资 $50M。下一个融资数据点则不那么干净：TechCrunch 2026 年 3 月报道 Rox 以 $1.2B 估值完成新一轮融资，General Catalyst
              再次参与，但公司没有确认规模、结构或条款。因此，头部估值强烈指向投资人信心，却不是完整的投资判断记录。里程碑上，Rox 借 2024 年融资公告从私密 beta 转向公开 beta；2026 年 3
              月下旬又发布两个增强企业生态可信度的消息：Built On Databricks 方案，以及具备 co-sell-ready 状态的 Microsoft 365 Copilot
              发布。合作伙伴里程碑重要，因为它既验证数据仓库原生技术论点，也验证 Rox 想在既有工作流里接触销售，而不是迫使客户推倒重来式迁移。
