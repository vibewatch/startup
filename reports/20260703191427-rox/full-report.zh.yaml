  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和信任界面风险
        blocks:
          - type: paragraph
            body: >-
              Rox 的公开合规语言足以通过初步企业筛查对话，但不足以消除尽调风险。最强正面证据来自它自己的安全和法律页面：Rox 称会加密客户数据，不用客户数据训练通用模型，接受年度第三方审计，并把
              CCPA、GDPR、分包商和跨境数据传输的隐私义务嵌入网站条款。主要问题不是公司披露了公开执法行动，而是相较于销售工作流数据、触达自动化和企业集成的敏感性，保留下来的公开界面仍然很窄。Rox
              还通过要求人工审阅、提醒客户结果会随配置和数据质量变化，收窄自己的营销主张。这是审慎的法律定位，但也意味着投资人不应把最强案例指标视为普遍可复现。没有保留下来的事故日志、无法单独获取的子处理方清单，也没有新的
              2026 年隐私政策修订；在风险可被称为低之前，法律和信任层仍需直接尽调。
