      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Rox 的创立故事与企业销售的一线痛点绑定很紧。TechCrunch 和 Rox 的投资人都把叙事聚焦在联合创始人兼 CEO Ishan Mukherjee 身上：他曾联合创办 Pixie，并在 Pixie
              出售后担任 New Relic 首席增长官。Rox 官方公司页面列出 Shriram Sridharan 为联合创始人兼 CTO，Diogo Ribeiro 为联合创始人兼首席增长官，Christopher Ré
              为专注研究的联合创始人。Sequoia 和 GV 也把 Avanika Narayan 归入创始团队，并强调团队在数据准备和 AI 上的技术血统。投资人材料把这支团队描绘成企业增长、基础设施和 AI
              研究之间罕见均衡的组合：Mukherjee 带来买方同理心和商业运营经验，Shriram 与 Diogo 的经历连接 AWS、Confluent、ThousandEyes 和 Lacework 的 GTM 与
              AI 系统，Chris Ré 和 Avanika 则强化 AI 与知识层叙事。明显风险是集中度。公开材料高度围绕创始人展开，对更宽的高管梯队、继任安排，或投资人参与之外的独立治理披露很少。因此，Rox
              的创始人-市场匹配既是优势，也是治理尽调项。
