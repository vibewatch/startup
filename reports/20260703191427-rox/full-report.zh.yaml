      - number: '1.4'
        title: 规模信号、第三方证明与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Rox 的公开证明集有吸引力，但仍然偏薄。投资人来源称，到 2024 年底，Rox 已在 beta 阶段帮助 35 个以上营收团队，具名客户包括 Ramp、MongoDB、Confluent、OpenAI 和
              Redis。TechCrunch 另行点名 Ramp、MongoDB 和 New Relic 为客户。Sequoia 称，用户每周拿回超过 8 小时，同时客户活动增加 35%
              以上；部分客户在销售认可管道上获得两倍回报。Ramp 自己的供应商目录在接近报告运行日期时给出一个外部数据点：2026 年 7 月，Rox 在 AI-First GTM 品类中排名第 3，该品类 14%
              的组织使用该产品，企业账户采用度最强。这些都是有意义的需求信号，但仍不能替代经审计的财务披露。最大缺口仍是从风险投资热情到经营现实之间的财务桥。TechCrunch 引述消息给出的 2025 年 ARR 预测为
              $8M，这意味着报道中的 $1.2B 估值对应异常高的倍数；Rework 正确地把该倍数视为核心尽调事实，而不是旁枝注脚。公司自己的法律页面也降低了部分营销主张的可靠性：Rox 称 AI
              输出应由人审阅，结果不保证，并在隐私政策中披露网站访客识别和 AI 子处理方共享。整体看，Rox 的信号足以支持严肃尽调，但公开披露还不足以让人有把握地承销该估值。
