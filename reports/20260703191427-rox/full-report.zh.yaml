        title: 格局：直接同业、邻近平台、既有厂商和潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Rox 周围的竞争集合比一张简单 AI-SDR 同业清单更宽。Artisan、11x
              等直接同业销售的是漏斗顶部自动化预算最清晰的替代品：能调研、发消息和预约会议的自主主动触达智能体。Clay、Amplemarket
              等邻近平台从相反方向切入同一工作流，把增补数据、信号、编排和序列化合在一起。Gong、Outreach、6sense 等营收智能既有厂商从既有营收技术栈内部接近这项工作，Salesforce Agentforce
              和 HubSpot Breeze 则从记录系统层发起进攻。Ramp 的 2026 年品类数据显示，Rox 已经进入同一场买方对话，但还不是主导供应商。关键投资判断差异在于，Rox 想比直接 AI-SDR
              阵营拥有更多完整营收工作流，同时又比 CRM 迁移更轻。这在复杂企业账户中创造了真实切入点，但也意味着，Rox 要防守的替代品类和进入者类型，比窄点工具更多。
