      - number: '7.3'
        title: 财务模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务风险之所以格外尖锐，是因为公开估值标题远比支撑它的运营数据链条扎实。 TechCrunch 报道 Rox 2026 年 3 月估值为 12 亿美元，预计 2025 年 ARR 为 800
              万美元；如果用该预测作分母，隐含约 150 倍 ARR 倍数。 对一家爆发式公司来说，这未必撑不住，但它几乎不给执行失误、留存疲软或客户集中留下缓冲。 Rox
              确实公开了透明的自助定价，但企业定价仍是自定义；公开记录看不出公司是在靠可持续的高 ACV 合约扩张，还是靠更吃人力的部署打法扩张。 执行风险也不低。Sequoia 在 2024 年末描述 35+ 个 beta
              团队、只有 15 名建设者，仍把公司框在一个小团队试图交付企业级产品且目标极高的状态里。 以创始人为中心的公开叙事有利于愿景和融资，但在更宽的运营厚度被直接证明前，也会提高关键人风险敞口。
