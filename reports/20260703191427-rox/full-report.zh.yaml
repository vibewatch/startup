      - number: '8.2'
        title: 正反假设与可比锚点
        blocks:
          - type: paragraph
            body: >-
              Rox 的多头逻辑真实存在。Sequoia、General Catalyst 和 GV 都把它描述成叠在碎片化销售系统之上的产品，把上下文转成动作，而不只是分析。 来自 Ramp、MongoDB、New
              Relic、Bynder 和 Together AI 的公开客户证明显示，产品确有工作流价值；Ramp 自身支出数据目录也提供了外部企业采用信号。 市场本身也足够大，自上而下的 2026 年 AI SDR
              估算约在 52 亿至 58 亿美元之间。 反面假设同样重要。Rework 明确把 150 倍隐含 ARR 倍数放在核心位置，而 HubSpot 和 Salesforce 正把智能体式工作流嵌入既有 CRM
              平台，收入基数和分销能力都大得多。 私有公司可比证据也让人冷静。Clay 披露更充分，收入约 1 亿美元，融资估值 31 亿美元，后续要约转让估值约 50 亿美元；11x 据报约 1000 万美元 ARR、估值约
              3.5 亿美元。 这些锚点不能证明 Rox 不可能值 12 亿美元，但确实显示，当前估值还需要更多执行和披露支撑。
