  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Rox 最适合落入的市场边界不是整个 CRM 软件市场，而是更窄的 AI SDR、AI-first GTM 和营收智能工作流层：它负责自动化潜客开发、调研、触达和下一步执行。分析师定义明确纳入通过云原生
              SaaS、浏览器扩展和 API-first 嵌入交付的软件与服务。这个范围能覆盖 Rox 想成为的操作层。只承担记录系统角色的基础 CRM 不在其中，因为 Rox 的论点是，实时营收工作不应再发生在 CRM
              里。周边格局里有四条近似替代路径。第一，Gong、6sense、Outreach 等营收智能和 GTM 智能平台覆盖重叠预算，即使产品范围不同。第二，Amplemarket、Artisan、11x 等 AI
              SDR 专家和低端主动触达工具，争夺同一个“用更少人做更多主动触达”的支出池。第三，HubSpot 和 Salesforce 的 CRM
              原生套件，把潜客开发和智能体功能嵌入客户已经购买的记录系统里，可能直接消除独立平台所需的采购事件。第四，部分团队仍依靠手工调研、电子表格或内部自建。Rox
              只要赢下其中一个预算项就能进入技术栈，但长期必须相对四类替代方案都保持差异化。
