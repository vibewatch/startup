              GTM 组织的 CIO 和 GTM 领导层级；New Relic 聚焦中端市场新业务团队，以及辅导这些代表的经理；LogicMonitor 聚焦一名横跨六位 AE 工作的 Senior BDR；Bynder 覆盖
