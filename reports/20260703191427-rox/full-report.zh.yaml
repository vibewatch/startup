chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Rox 是一家总部位于 San Francisco 的私营软件公司，成立于 2024 年。它把自己定位为面向 Global 2000 GTM 团队的营收智能体平台或智能营收操作系统，而不是传统
              CRM。核心卖点是架构：Rox 位于客户既有技术栈之上，把
              CRM、邮件、日历、支持系统、数据仓库和外部信号里的碎片化上下文拼起来，再部署一层常驻智能体，接手营收团队通常手工完成的工作。官方材料反复强调，每段客户关系配一个预置智能体，覆盖潜客开发、交易管理和扩张。商业模式已经公开，对一家面向企业的初创公司来说透明度并不常见：免费的
              Starter 档提供 2,000 次 Agent Actions，Core 档每月 $50 起、含 5,000 次 Agent Actions，企业定价定制。Rox
              称，收费依据是智能体交付的可衡量结果，而不只是底层算力或数据处理；每项调研任务、会议简报或管道动作都会消耗特定数量的 Agent
              Actions。该模式让试用成本很低，但企业合同经济性仍不透明，因为公司没有公布大规模部署价格，也没有给出大型部署的挂载率假设。
