      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，最合适的判断是继续研究；不是因为 Rox 缺少产品或市场想象力，而是因为当前价格敏感性压过了披露质量。 乐观情景成立的前提是当前 ARR 显著跑赢被引用的 2025
              年预测，旗舰客户继续扩张，并且公司能拿出留存和集中度指标，证明其相对同行应享有溢价倍数。 基准情景没那么慷慨：Rox
              可能确实是一个企业级切入点，创始人与市场高度匹配，但如果经济性不更清楚，在所称估值下仍未必可投。 悲观情景很直接。如果当前 ARR 只比引用的 2025
              年水平略高，客户证明仍然集中，或既有厂商套件压窄产品切口，那么倍数向更低的私有公司可比区间压缩会是更自然的结果。 在这个语境下，所称价格应被视为仍需验证的上限，而不是已确认的公允价值下限。
