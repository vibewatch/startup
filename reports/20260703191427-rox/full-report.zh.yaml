      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场的用户、买方和付款方角色分得很清楚。分析师来源按公司规模和部署模式切分品类，但更贴近运营的问题是：谁的痛点强到会购买 Rox 这样的系统。实践中，主要用户是客户经理、SDR、客户管理人员和 RevOps
              运营人员；他们把时间浪费在寻找上下文或维护触达工作流上。Rox 自己的材料描述了面向销售的界面，覆盖调研、监控、管道生成和会议准备。可能的预算所有者是 CRO、销售 VP、RevOps 负责人或
              CIO，尤其在数据仓库、CRM 和销售工作流同时重要的组织里。该定位把 Rox 推向复杂企业账户，而不是创始人驱动的 SMB 主动获客动作。Sequoia 明确把 Rox
              描述为面向严肃企业销售、专为基于账户的销售打造；Ramp 的品类数据也显示企业采用强于中端市场使用。另一方面，Rox
              公开的自助价格点说明它也想要自下而上的试验。结果是一条两步采用路径：轻量测试或团队试点先证明工作流 ROI，然后企业买方再决定公司是否需要在技术栈之上新增智能体层，还是只在既有 CRM 里加入更多 AI。
