      - number: '6.2'
        title: 具名客户证明、生产信号与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Rox 公开客户故事中最强的部分，是各个案例页面里的具体性。MongoDB 不只是提供 logo；它描述了在数据增补领导者、DIY 智能体平台和 Rox 之间的评估，并称上线在 45 天内从原型进入生产。New
              Relic 披露使用 Rox 前每通电话需要 45 分钟准备，然后声称调研时间效率提升 85%、新代表上手加快 50%。LogicMonitor 也提供工作流和结果细节：自动化前写邮件需要 20 到 25
              分钟，打开率 70% 以上，并在 30 分钟内执行了一场临时活动。Bynder 报告数月内活跃用户超过 100 名，使用 Rox 的战略客户经理每月净新增已关闭 ARR 提高 2.5 倍。Together AI
              提到更多合格会议、SDR 上手更快，以及前线部署赋能模式；Ramp 称代表准备更少、成交更多，并在每一次会议前使用
              Rox。贯穿这些例子的共同线索，是与真实日常工作绑定、带有生产意味的语言，而不是单一试点仪表盘。采用轨迹仍部分由投资人和市场界面拼接而成，但方向一致：2024 年底 35 个以上 beta 团队，2026 年 3
              月可见具名企业 logo，2026 年 7 月品类排名又把 Rox 放到仍很小的 AI-first GTM 细分市场前列。
