      - number: '4.3'
        title: 资本充足性、融资依赖与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              公开记录中的核心财务事实仍是估值缺口。TechCrunch 报道称，Rox 在 2026 年融资时预计 2025 年收官 ARR 为 $8M，但同一报道又称公司达到 $1.2B 估值。这意味着约 150x ARR
              倍数，远高于检索记录中其他私营 AI GTM 公司的披露参考点。Clay 公开的 2026 年材料指向 $100M ARR、部分现金流为正的时期，以及大得多的客户基础；11x 的 TechCrunch 画像指向约
              $10M ARR、约 35x ARR；Gong 作为更后期规模的既有厂商，ARR 已经超过 $500M。这些不是完全可比样本，但确实框定了 Rox
              头部价格中已经嵌入多少未来执行。公开证据太薄，无法回答下一个问题：Rox
              是否有足够现金、烧钱纪律和毛利率韧性，能在不进行另一轮制造依赖的融资情况下长进该估值。历史融资时间线存在，但当前手头现金、跑道、债务、客户集中度和留存都未公开。因此，正确结论应当谨慎。如果工作流扩张转化为粘性经常性收入，Rox
              仍可能证明溢价合理；但公开证据目前无法支持对资本充足性或利润率耐久度作出干净判断。这是今天决定性的公开数据限制。
