callouts:
  - calloutType: strength
    title: Rox has cleared logo proof and much of the workflow-proof hurdle
    body: >-
      The customer corpus is not just a logo wall. MongoDB, New Relic, LogicMonitor, Bynder, Together AI, Ramp, and
      Cloud Software Group all describe specific jobs, pains, and post-adoption workflow changes. That is materially
      stronger than vague enterprise-name dropping.
    claimRefs:
      - CU017
      - CU020
      - CU023
      - CU025
      - CU028
      - CU031
      - CU033
  - calloutType: risk
    title: Durability remains the central missing piece
    body: >-
      No public NRR, churn, contract-length, or concentration data appears in the reviewed set. That means the evidence
      can prove who uses Rox and how, but not how sticky or diversified the resulting revenue is.
    claimRefs:
      - CU040
      - CU041
      - CU050
  - calloutType: insight
    title: The product seems to be expanding from rep assistance toward a broader revenue operating layer
    body: >-
      Bynder, Cloud Software Group, Ramp, and the broader Rox workflow materials imply that the best customer stories
      now reach beyond prospecting into manager visibility, CRM hygiene, renewals, and expansion. That broadens value
      but also raises the bar for implementation and retention diligence.
    claimRefs:
      - CU006
      - CU031
      - CU033
      - CU037
      - CU048
