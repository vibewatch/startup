  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-math
      missingEvidence: Cohort-level NRR, GRR, logo churn, renewal rates, and contract-length distributions for Rox customers.
      whyItMatters: >-
        Named logos and workflow anecdotes do not answer whether the customer base is durable, expanding, or at risk at
        renewal.
      diligencePath: >-
        Request customer cohorts by segment and vintage, plus renewal, downgrade, and expansion bridges from RevOps or
        finance.
      relatedQuestionRefs:
        - QU018
        - QU023
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: concentration-exposure
      missingEvidence: Top-customer revenue share, top-10 concentration, and revenue mix by vertical, geography, and channel.
      whyItMatters: >-
        A few marquee logos can create a misleading picture of quality if revenue is concentrated or unevenly
        distributed.
      diligencePath: >-
        Request customer concentration schedules, logo-to-revenue mapping, and channel-mix disclosure for the current
        fiscal period.
      relatedQuestionRefs:
        - QU019
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: material
      topic: partner-channel-depth
      missingEvidence: >-
        Substantive public evidence on LeadIQ or other channel relationships, including sourced pipeline, referral
        economics, or co-sell depth.
      whyItMatters: If partner distribution matters, weak public channel evidence leaves a blind spot on dependency and margin.
      diligencePath: Request active partner list, sourced bookings, co-sell rules, and partner-renewal contribution by quarter.
      relatedQuestionRefs:
        - QU020
      relatedTableRefs:
        - TU005
        - TU003
    - type: private-evidence-only
      severity: material
      topic: pilot-to-production-and-economics
      missingEvidence: >-
        Customer-by-customer go-live dates, implementation effort, ACV, usage economics, and pilot-to-production
        conversion rates.
      whyItMatters: >-
        The public corpus shows several strong stories, but it does not reveal whether success is repeatable or
        economically attractive across the base.
      diligencePath: Request implementation timelines, pilot conversion rates, ACV ranges, and time-to-value data by segment.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU003
        - TU002
