  - id: durability-risk
    title: Durability, expansion, concentration, and evidence gaps
    body: >-
      What Rox cannot yet prove from the fetched public corpus is the part of customer quality that matters most for
      underwriting: durability and diversification. The reviewed sources show real usage, recognizable logos, and some
      habit signals, but they do not disclose NRR, GRR, churn, renewal rates, contract-length distributions, or
      top-customer concentration. Even the public partner surface is thin: the LeadIQ partner URL in the fetch set does
      not provide substantive co-sell or channel-detail evidence. That matters because Rox's customer proof increasingly
      extends beyond outbound prospecting and into longer-lived lifecycle workflows such as renewals, manager coaching,
      CRM hygiene, and expansion support. Those are precisely the use cases where contract economics and renewal
      behavior would matter most. The adverse reading is not that the customer story is fake; it is that most of the
      positive evidence is still vendor-hosted and selectively quantified. Rywalker explicitly notes that many traction
      figures are vendor-stated and that independent community validation remains weak. The category backdrop also stays
      early: Ramp's category page says AI-first GTM penetration remains below 1% overall, so Rox's relative rank should
      not be confused with broad market maturity. Netting it out, Rox has cleared the logo-proof hurdle and partly
      cleared the production-proof hurdle, but it has not yet cleared the durability or concentration hurdle in public
      evidence.
    claimRefs:
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
      - CU043
      - CU044
