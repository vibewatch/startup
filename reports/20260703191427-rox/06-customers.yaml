figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public customer stories show a recurring path from fragmented prep or context pain to guided execution, then to
      broader role adoption or lifecycle use cases.
    data:
      items:
        - label: Context pain
          detail: Manual research, tab switching, slow prep, and weak prioritization
          tone: warning
        - label: Data and workflow connection
          detail: Rox connects CRM, data sources, or account context into one view
          tone: neutral
        - label: Guided execution
          detail: Reps get briefs, plays, suggested actions, or automated sequence steps
          tone: positive
        - label: Manager or multi-role visibility
          detail: Leaders, SAMs, or adjacent roles start using the same workflow layer
          tone: positive
        - label: Expansion loop
          detail: Usage extends into renewals, expansion, or deeper account coverage
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CU019
      - CU022
      - CU031
      - CU033
      - CU037
