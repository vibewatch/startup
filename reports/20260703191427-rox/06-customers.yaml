  - id: named-proof
    title: Named customer proof, production signals, and adoption trajectory
    body: >-
      The strongest part of Rox's public customer story is the specificity inside the individual case pages. MongoDB
      does not just provide a logo; it describes an evaluation across data-enrichment leaders, DIY agent platforms, and
      Rox, then says the rollout moved from prototype to production in 45 days. New Relic discloses a 45-minute prep
      burden per call before Rox, then claims an 85% efficiency gain in research time and 50% faster new-rep ramp.
      LogicMonitor provides workflow and outcome detail as well: 20-to-25-minute email drafting before automation, 70%
      plus open rates, and a last-minute event campaign executed in 30 minutes. Bynder reports 100-plus active users
      within months and 2.5 times higher net-new closed ARR per month for Strategic Account Managers using Rox. Together
      AI cites more qualified meetings, faster SDR ramp, and a forward-deployed enablement model; Ramp says reps prep
      less, close more, and use Rox before every single meeting. Across these examples, the common thread is
      production-flavored language tied to real daily work rather than a single pilot dashboard. The adoption trajectory
      is still partly stitched together from investor and market surfaces, but it is directionally coherent: 35-plus
      beta teams in late 2024, named enterprise logos visible by March 2026, and a July 2026 category ranking that
      places Rox near the top of the still-small AI-first GTM segment.
    claimRefs:
