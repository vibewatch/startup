chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof for Rox is stronger than the company's public retention proof. Fetched case pages confirm
    recognizable users across MongoDB, New Relic, LogicMonitor, Bynder, Cloud Software Group, Together AI, and Ramp,
    with evidence spanning pipeline generation, call preparation, CRM hygiene, renewals, and expansion motions. What
    remains missing is the investor-grade durability layer: no public NRR, churn, contract-term, or concentration data
    appears in the reviewed corpus, and channel dependence is only weakly evidenced.
sections:
  - id: customer-base
    title: Customer base segmentation, users, and buyer profile
    body: >-
      The fetched customer set paints Rox as an enterprise-heavy revenue workflow product rather than an SMB self-serve
      tool. The named pages cluster around software, cloud, fintech, and enterprise-platform organizations: MongoDB, New
      Relic, LogicMonitor, Bynder, Cloud Software Group, Together AI, and Ramp. The user mix is also broader than a
      single SDR persona. MongoDB frames the evaluation at the CIO and GTM-leadership level for a 5.5K-plus go-to-market
      organization, New Relic centers a mid-market new-business team and managers who coach those reps, LogicMonitor
      centers a Senior BDR working across six AEs, Bynder spans BDRs through Strategic Account Managers and CRMs,
      Together AI speaks to AEs and SDRs, and Ramp emphasizes both rep execution and leader visibility. That pattern
      suggests a product whose practical buyer can sit with revenue leadership, operations, IT, or cross-functional
      platform owners while the day-to-day users sit inside seller and manager workflows. Third-party signals point in
      the same direction. Sequoia, GV, TechCrunch, and Ramp Rate all present Rox as a company selling into serious
      enterprise revenue motions rather than hobbyist automation. The category data is still early-market, but the
      customer proof is clearly more enterprise than mass-market.
    claimRefs:
