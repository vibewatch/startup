    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Multi-role deployment across GTM orgs
        - Could still be concentrated in a few marquee enterprise logos
        - A strong case-study set may overstate broad revenue diversity
        - Request top-10 revenue and seat concentration by customer
      - - Extension into renewals and expansion workflows
        - Lifecycle use cases may require longer implementation and tighter integrations
        - Could improve ACV and stickiness if real, or lengthen rollout risk if not
        - Request attach rates and module adoption by customer
      - - Manager and leadership visibility use cases
        - Value may depend on organizational discipline, not only rep usage
        - Could raise buyer breadth inside an account
        - Request champion map, admin usage, and leadership-dashboard retention
      - - Forward-deployed training and customization
        - High-touch enablement can drive adoption but reduce scalability if too manual
        - Could increase conversion and early outcomes while constraining margin
        - Request services effort, deployment staffing, and time-to-live metrics
      - - Channel / partner surface
        - LeadIQ evidence is too thin to evaluate partner leverage
        - Weak partner visibility obscures sourced-pipeline dependence
        - Request current partner list, sourced bookings, and renewal mix by channel
    notes: >-
