          detail: Customers compare Rox with incumbents or DIY options
          tone: neutral
        - id: deploy
          label: Deploy into workflow
          detail: Teams connect data and embed Rox in prep or execution flow
          tone: positive
        - id: habit
          label: Build usage habit
          detail: Reps or teams rely on Rox before meetings, campaigns, or account work
          tone: positive
        - id: expand
          label: Expand user roles
          detail: Managers, SAMs, or adjacent roles adopt the workflow layer
          tone: positive
        - id: lifecycle
          label: Broaden lifecycle coverage
          detail: Usage touches renewals, expansion, or CRM hygiene beyond prospecting
          tone: neutral
      edges:
        - from: evaluate
          to: deploy
          label: selection and setup
        - from: deploy
          to: habit
          label: daily workflow use
        - from: habit
          to: expand
          label: team adoption
        - from: expand
