  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and trust-surface risk
        blocks:
          - type: paragraph
            body: >-
              Rox has enough public compliance language to pass an initial enterprise-screening conversation, but not
              enough to remove diligence risk. The strongest positive evidence is on its own security and legal pages:
              Rox says it encrypts customer data, does not use customer data to train generalized models, undergoes
              annual third-party audits, and embeds privacy obligations for CCPA, GDPR, subcontractors, and cross-border
              data transfers into its website terms. The main problem is not that the company has disclosed a public
              enforcement action; it is that the retained public surface remains narrow relative to the sensitivity of
              seller workflow data, outreach automation, and enterprise integrations. Rox also narrows its own marketing
              claims by requiring human review and warning that customer outcomes vary with configuration and data
              quality. That is prudent legal positioning, but it also means investors should not treat the strongest
              case-study metrics as universally reproducible. With no retained incident log, no separately retrievable
              subprocessor list, and no fresh 2026 privacy-policy revision, the legal and trust layer still needs direct
              diligence before the risk can be called low.
