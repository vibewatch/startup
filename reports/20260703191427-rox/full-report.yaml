      - number: '5.3'
        title: Trust controls, differentiation, and maturity signals
        blocks:
          - type: paragraph
            body: >-
              Rox's trust posture is more explicit than many young AI application vendors but still not fully complete
              by enterprise-software standards. The security, privacy, Microsoft, and DPA materials consistently state
              AES-256 encryption, a no-generalized-training commitment on customer data, SOC 2 Type II, annual
              third-party security audits, human review expectations for generated outputs, customer-instruction limits
              on data processing, and breach-notice obligations. Those are meaningful controls. At the same time, the
              company's public differentiation claim relies more on architecture and workflow scope than on uniquely
              disclosed model or infrastructure details. Salesforce Agentforce and HubSpot Breeze describe broad agentic
              AI platforms inside existing suites, while Clay describes a GTM orchestration and data layer and Artisan
              describes an autonomous outbound BDR. Rox's claim is that it combines warehouse-native context,
              multi-agent workflow execution, and cross-lifecycle revenue use cases in one operating layer. The
              strongest freshness signals are the March 2026 Databricks and Microsoft launch announcements plus the July
              2026 Ramp category snapshot, but the public roadmap after those releases is still sparse and should be
              treated as a diligence gap rather than as proven long-term product depth. The competitive comparison also
              implies a commercialization risk. Rox is asking buyers to believe that a unified revenue operating layer
              is more valuable than assembling best-of-breed tools or extending an incumbent CRM suite. Public sources
              support the differentiation story, but they do not yet show the full procurement proof, expansion
              economics, or reliability metrics that would make that story airtight for the most conservative enterprise
              customer.
