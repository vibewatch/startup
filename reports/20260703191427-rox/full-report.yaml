      - number: '5.2'
        title: Architecture, deployment model, and operating mechanics
        blocks:
          - type: paragraph
            body: >-
              The architectural through-line in Rox's public materials is that context should be unified outside the CRM
              and then acted on through agentic workflows. The Databricks announcement says Rox runs on top of the
              customer's warehouse environment and aligns to existing data models, governance, and performance
              standards. The Microsoft announcement says the seller-facing experience can then surface that context
              inside Microsoft 365 Copilot using signals from email, meetings, and calendars. Rox's own framework and
              primitives articles add a higher-level technical lens: the company explains agentic systems as
              combinations of goal definition, context retrieval, reasoning, tool use, decisioning, memory, and human
              escalation rather than as a single prompt-to-output model. Public documentation also gives a partial view
              into the operating model around deployment and metering. Rox says it can deploy with no long configuration
              cycles, offers enterprise deployment and training, and gives customers an activity log plus admin
              aggregation for usage. What remains unclear from public sources is the exact hosting topology, uptime
              posture, and disaster-recovery commitment for large deployments. Another practical implication of this
              design is that Rox appears to depend on customer readiness outside the model layer itself. If the
              warehouse is incomplete, CRM hygiene is weak, or permissions to core systems are narrow, the public
              framework articles imply that agent quality will degrade because context retrieval and tool execution are
              first-order parts of the system. That is useful because it clarifies where implementation risk probably
              sits: less in the abstract promise of agentic AI, and more in enterprise data preparation, integration
              depth, and operating discipline during rollout.
