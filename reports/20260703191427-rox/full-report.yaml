  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Adjacent Platforms, Incumbents, and Likely Entrants'
        blocks:
          - type: paragraph
            body: >-
              The competitive set around Rox is broader than a simple AI-SDR peer list. Direct peers such as Artisan and
              11x sell the clearest substitute for a top-of-funnel automation budget: autonomous outbound agents that
              research, message, and book meetings. Adjacent platforms such as Clay and Amplemarket attack the same
              workflow from the opposite direction by combining enrichment, signals, orchestration, and sequencing.
              Revenue-intelligence incumbents such as Gong, Outreach, and 6sense approach the job from inside an
              existing revenue stack, while Salesforce Agentforce and HubSpot Breeze attack it from the system-of-record
              layer. Ramp's 2026 category data shows Rox already belongs in the same buyer conversation, but not as the
              dominant vendor. The key underwriting distinction is that Rox is trying to own more of the full revenue
              workflow than the direct AI-SDR cohort, while still staying lighter than a CRM migration. That creates a
              real wedge in complex enterprise accounts, but it also means Rox must defend itself against more
              categories of substitute and more classes of entrant than a narrower point solution would face.
