      - number: '7.3'
        title: Financial-model and execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk case is unusually sharp because the public valuation headline is far better documented
              than the underlying operating bridge. TechCrunch reported a $1.2 billion March 2026 valuation and a
              projected 2025 ARR of $8 million, which implies a roughly 150x ARR multiple if the projection is used as
              the denominator. That may be survivable for a breakout company, but it leaves little room for execution
              miss, retention weakness, or customer concentration. Rox does publish transparent self-serve pricing, yet
              enterprise pricing remains custom, so the public record does not show whether the company is scaling on
              durable high-ACV contracts or on a more labor-intensive deployment motion. Execution risk is also
              non-trivial. Sequoia's late-2024 description of 35-plus beta teams and only 15 builders still frames the
              company as a small team attempting enterprise-grade delivery at very high ambition. The founder-centric
              public narrative is a strength for vision and fundraising, but it increases key-person exposure until
              broader operating depth is evidenced directly.
