  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanics, and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Rox's public monetization stack is clearer at the entry tier than at enterprise scale. The company offers
              a free Starter tier, a $50-per-month Core tier, and custom enterprise pricing, all tied to metered Agent
              Actions rather than a plain seat-based license. That structure tells investors several things at once.
              First, Rox wants low-friction bottoms-up trials. Second, it is trying to align pricing to work completed
              instead of to raw user count. Third, the public record still stops short of the details that matter most
              for underwriting: enterprise minimums, overage rates, services fees, discount bands, annual commitments,
              and realized customer mix. The Microsoft Copilot materials also show Rox expanding beyond prospecting into
              renewal timelines, QBRs, and ROI writeups, which matters because it suggests monetization can expand into
              account management and post-sale workflows rather than depending only on outbound motion. Even so, the
              company’s own legal and product language warns that results vary, human review is required, and outcomes
              are not guaranteed. That makes Rox’s published list pricing helpful for understanding the model, but not
              yet sufficient for inferring revenue quality or customer economics.
