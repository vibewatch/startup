chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Rox is a San Francisco-headquartered private software company founded in 2024. The company presents itself
              as a revenue agents platform or intelligent revenue operating system for Global 2000 go-to-market teams
              rather than as a conventional CRM. The core pitch is architectural: Rox sits on top of the customer's
              existing stack, pulls together fragmented context from CRM, email, calendars, support systems, data
              warehouses, and external signals, and then deploys an always-on agent layer to do work that revenue teams
              normally complete manually. Official materials repeatedly emphasize one prebuilt agent per customer
              relationship, with coverage spanning prospecting, deal management, and expansion. The business model is
              published and unusually transparent for an enterprise-facing startup: a free Starter tier offers 2,000
              Agent Actions, the Core tier starts at $50 per month with 5,000 Agent Actions, and enterprise pricing is
              custom. Rox says it charges for measurable outcomes delivered by the agents rather than only for
              underlying compute or data processing, and that every research task, meeting brief, or pipeline action
              consumes a specific number of Agent Actions. This model makes the product cheap to test but still leaves
              enterprise contract economics opaque, because the company does not publish high-scale pricing or
              attach-rate assumptions for large deployments.
