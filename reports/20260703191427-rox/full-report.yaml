      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              The central financial fact in the public record is still the valuation gap. TechCrunch reported that Rox
              was projected to close 2025 with $8 million in ARR at the time of its 2026 financing, yet the same report
              said the company achieved a $1.2 billion valuation. That implies roughly a 150x ARR multiple—far above the
              reference points disclosed for other private AI GTM companies in the fetched record. Clay’s published 2026
              materials point to $100 million ARR, some cash-flow-positive periods, and a much larger customer base;
              11x’s TechCrunch profile pointed to roughly $10 million ARR at about 35x ARR; and Gong has already crossed
              $500 million ARR as a much later-scale incumbent. Those are not like-for-like comparables, but they do
              frame how much future execution is already embedded in Rox’s headline price. Public evidence is too thin
              to answer the next question: whether Rox has enough cash, burn discipline, and gross-margin resilience to
              grow into that valuation without another dependency-creating round. Historical financing chronology
              exists, but current cash on hand, runway, debt, customer concentration, and retention are all private. The
              right verdict is therefore cautious. Rox may yet justify a premium if workflow expansion converts into
              sticky recurring revenue, but public evidence does not currently support a clean judgment on capital
              adequacy or margin durability. That is the decisive public-data limitation today.
