            body: >-
              The customer corpus is not just a logo wall. MongoDB, New Relic, LogicMonitor, Bynder, Together AI, Ramp,
              and Cloud Software Group all describe specific jobs, pains, and post-adoption workflow changes. That is
              materially stronger than vague enterprise-name dropping.
