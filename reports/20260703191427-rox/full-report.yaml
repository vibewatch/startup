      The public record is rich in workflow ROI proxies but sparse in actual unit economics, so most bridge nodes are
      evidence-backed placeholders rather than calculated ratios.
    data:
      nodes:
        - id: costs
          label: Cost inputs
          detail: AI compute, integrations, support, and implementation load are not publicly quantified.
        - id: adoption
          label: Adoption inputs
          detail: Actions used, activated reps, and workflow breadth determine realized value.
        - id: roi
          label: ROI proxies
          detail: Time saved, more qualified meetings, faster ramp, and closed-ARR lift appear in customer pages.
        - id: retention
          label: Retention / expansion
          detail: The biggest unknown is whether pilots widen into sticky multi-workflow spend.
        - id: margin
          label: Margin outcome
          detail: Without retention and cost data, gross margin and payback remain private-evidence items.
      edges:
        - from: costs
          to: roi
          label: must be outweighed by
        - from: adoption
          to: roi
          label: drives
        - from: roi
          to: retention
          label: needs to convert into
        - from: retention
          to: margin
          label: supports
    approximationNotes: >-
      This bridge is qualitative because public Rox sources disclose outcomes and product mechanics but not CAC,
      payback, gross margin, or cohort retention.
