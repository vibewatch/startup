              Rox's customer proof increasingly extends beyond outbound prospecting and into longer-lived lifecycle
              workflows such as renewals, manager coaching, CRM hygiene, and expansion support. Those are precisely the
              use cases where contract economics and renewal behavior would matter most. The adverse reading is not that
