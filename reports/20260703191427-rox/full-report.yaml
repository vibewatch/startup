      - number: '1.4'
        title: Scale Signals, Third-Party Proof, and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              The public proof set on Rox is promising but still thin. Investor sources said Rox had already helped 35
              or more revenue teams in beta by late 2024, with named customers including Ramp, MongoDB, Confluent,
              OpenAI, and Redis. TechCrunch separately named Ramp, MongoDB, and New Relic as customers. Sequoia said
              users were reclaiming more than eight hours per week while increasing customer activity by more than 35%,
              and that some customers saw twofold payback in sales-accepted pipeline. Ramp's own vendor directory gives
              one external datapoint near the run date: Rox ranked #3 in the AI-First GTM category in July 2026, with
              14% of organizations in that category using the product and the strongest adoption in enterprise accounts.
              Those are meaningful demand signals, but they are still not substitutes for audited financial disclosure.
              The biggest gap remains the financial bridge from venture enthusiasm to operating reality. TechCrunch's
              sourced figure of projected 2025 ARR at $8 million means the reported $1.2 billion valuation implies an
              extraordinary multiple, and Rework correctly treats that multiple as the central diligence fact rather
              than a side note. The company also limits the reliability of some marketing claims in its own legal pages:
              Rox says AI outputs should be reviewed by humans, says results are not guaranteed, and discloses website
              visitor identification and AI subprocessor sharing in its privacy policy. Overall, Rox has enough signal
              to justify serious diligence, but not enough public disclosure to underwrite the valuation with
              confidence.
