      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The market splits cleanly between user, buyer, and payer roles. Analyst sources segment the category by
              company size and deployment model, but the more operational question is who feels the pain badly enough to
              buy a system like Rox. In practice, the primary users are account executives, SDRs, account managers, and
              RevOps operators who waste time hunting for context or maintaining outreach workflows. Rox's own materials
              describe a seller-facing surface for research, monitoring, pipeline generation, and meeting preparation.
              The likely budget owner is a CRO, VP Sales, RevOps leader, or CIO in organizations where the warehouse,
              CRM, and seller workflows all matter at once. That pushes Rox toward complex enterprise accounts rather
              than founder-led SMB outbound motions. Sequoia explicitly framed Rox as purpose-built for serious
              enterprise sellers doing account-based selling, and Ramp's category data also shows stronger enterprise
              adoption than mid-market usage. On the other hand, Rox's published self-serve price point proves it also
              wants bottoms-up experimentation. The result is a two-step adoption path: a lightweight test or team pilot
              proves workflow ROI, then an enterprise buyer decides whether the company wants a new agent layer on top
              of the stack or simply more AI inside the incumbent CRM.
