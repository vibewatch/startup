      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not support a bearish call on product demand, but it does support a high bar on
              monitoring. The most actionable indicators are not abstract AI risks; they are observable changes in
              bundle pressure, customer-expansion quality, disclosure freshness, and financing behavior. If Agentforce
              or Breeze continue expanding inside the same seller workflows Rox targets, the bundle threat rises. If
              named flagship customers stop expanding, if public legal materials remain stale, or if another financing
              event arrives before Rox discloses stronger economic evidence, the current underwriting case weakens
              further. The positive side is that several of these risks are monitorable: updated privacy materials,
              broader production deployments, expansion beyond a small public logo set, and evidence that Microsoft and
              Databricks relationships convert into repeatable distribution rather than one-off announcements. Until
              those proofs are available, the right posture is not to reject Rox outright, but to treat missing
              operating, governance, and economics detail as real diligence blockers rather than cosmetic gaps.
