      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Current ARR has moved well above the cited 2025 projection, flagship customers continue expanding, and
          retention metrics validate a premium enterprise wedge.
        - >-
          The reported price can begin to look less stretched if forward multiple compression happens via fast revenue
          growth rather than via price decline.
        - Customer concentration, services intensity, and incumbent bundle moves still cap upside.
        - Requires new evidence that is not yet public, so signal is currently low.
      - - Base
        - >-
          Rox has real product-market resonance, but public economics remain too thin to prove that the reported mark is
          fair today.
        - >-
          Treat the current price as monitorable but not underwritable; require a discount or more disclosure before
          investing.
        - Price risk, cap-table opacity, and concentration risk remain material.
        - Best fit for the retained public evidence set.
      - - Bear
        - >-
          Current ARR is only modestly above the cited projection, bundle pressure rises, or flagship-customer proof
          fails to generalize.
        - Multiple compression toward lower private-comp bands becomes more likely than growth into the current mark.
        - Execution miss, concentration, and financing need dominate.
