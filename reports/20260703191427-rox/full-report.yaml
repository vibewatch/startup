      - number: '1.3'
        title: Funding Base, Investors, and Milestone Path
        blocks:
          - type: paragraph
            body: >-
              Rox's capital history is short but already aggressive. Public reporting and investor posts indicate that
              Rox disclosed $50 million in funding in November 2024, made up of a Sequoia-led seed and a General
              Catalyst-led Series A with GV participating. Sequoia framed the company as a seed investment and said it
              also joined the Series A; General Catalyst explicitly called itself the Series A lead; GV described the
              total capital raised as $50 million across the seed and Series A rounds. The next funding datapoint is
              much less clean: TechCrunch reported in March 2026 that Rox had raised a new round at a $1.2 billion
              valuation, again with General Catalyst involved, but the company did not confirm the size, structure, or
              terms. That means the headline valuation is strong directional evidence of investor conviction but not a
              complete underwriting record. Milestone-wise, Rox used the 2024 funding announcement to move from private
              beta to a public beta, then added two credibility-building enterprise ecosystem announcements in late
              March 2026: a Built On Databricks solution and a Microsoft 365 Copilot launch with co-sell-ready status.
              These partner milestones matter because they validate both the warehouse-native technical thesis and Rox's
              attempt to meet sellers inside existing workflows instead of forcing a rip-and-replace migration.
