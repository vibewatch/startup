      - number: '2.2'
        title: TAM, SAM, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing evidence is directionally attractive but imprecise. Market.us values the AI SDR
              market at $5.22 billion in 2026 after $4.27 billion in 2025, while The Business Research Company places
              the same category at $5.81 billion in 2026 after $4.39 billion in 2025. Both forecasts show a steep growth
              curve, but the 2026 spread of nearly $0.6 billion is large enough that it should not be averaged away.
              Long-range projections are even more dramatic: Market.us sees the market reaching $24.32 billion by 2034,
              while TBRC projects $17.58 billion by 2030. The practical takeaway is that the category is already large
              enough to matter to venture investors and strategic acquirers, yet any attempt to compute Rox's actual
              share still breaks on missing company disclosure. A more useful lens is to step down from the global
              category to the slices that fit Rox best. North America alone represents around $2.02 billion of 2026
              spend in Market.us, and the enterprise segment is described as the leading spend pool. Rox's own messaging
              is much more Global 2000 and cross-system than SMB prospecting, so its true serviceable market is narrower
              than the broad AI SDR headline but still meaningfully large. Without current ARR or ACV by segment, public
              evidence supports only a serviceable-market narrative, not a precise SOM figure.
