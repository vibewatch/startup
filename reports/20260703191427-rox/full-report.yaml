      - number: '7.2'
        title: Operational, security, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Rox's best public proof comes from customer pages and ecosystem announcements, and those same assets
              expose how coupled the product is to customer data quality, deployment work, and partner surfaces.
              MongoDB, New Relic, Bynder, LogicMonitor, and Together AI all describe meaningful workflow gains, but
              those wins depend on fast implementation, tailored onboarding, and reliable operation across CRM,
              messaging, enrichment, and warehouse systems. MongoDB says Rox moved from prototype to production in 45
              days; Together AI highlights a forward-deployed model; and Rox itself says results vary with data quality
              and configuration. That combination suggests the product can create value quickly in the right account,
              but also that portability and support intensity remain live operational risks. Partner dependence
              compounds the issue. Rox wants distribution and workflow relevance through Microsoft, warehouse
              credibility through Databricks, and continued system access through Salesforce, HubSpot, email, and
              collaboration integrations. Any change in those upstream platforms can propagate directly into product
              quality, adoption, or go-to-market efficiency.
