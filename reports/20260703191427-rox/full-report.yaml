  - id: FI003
    title: Financial estimate range
    type: range
    layout: wide
    summary: >-
      The most defensible public range in Rox’s financial profile is valuation context rather than operating margin: the
      fetched record shows a very wide spread between Rox’s implied multiple and later-stage private AI GTM references.
    data:
      items:
        - label: Private AI GTM reference multiple range
          low: 31
          high: 35
          unit: x ARR
          detail: Clay at roughly 31x $100M revenue / $3.1B valuation and 11x at about 35x ARR per TechCrunch.
        - label: Rox implied multiple
          low: 150
          high: 150
          unit: x ARR
          detail: Reported $1.2B valuation over projected 2025 ARR of $8M.
        - label: Public-comp subscription mix range
          low: 95
          high: 98
          unit: '% recurring revenue'
          detail: Salesforce and HubSpot show the recurring-revenue mix a mature model can reach.
    approximationNotes: >-
      These are reference ranges, not like-for-like valuation comps; timing, maturity, and business-model differences
      are material.
