      - number: '3.3'
        title: Switching Costs, Multi-Homing, Distribution Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Rox's competitive durability is real but conditional. The product appears strongest where buyers already
              feel the pain of fragmented data, long account-prep loops, and multi-surface execution—especially when
              Microsoft, CRM, and warehouse context all matter at once. In that setting, Rox can present itself as a
              workflow layer on top of the stack rather than a rip-and-replace event, which lowers initial switching
              friction and makes pilots easier to justify. But the same architectural choice also makes multi-homing
              easy. A prospect can test Rox beside Clay, Amplemarket, or an incumbent CRM bundle without removing
              anything. That is useful for adoption, but bad for lock-in. The more enduring moat signals are
              deployment-specific: workflow tuning, embedded governance, trust with public-company buyers, and partner
              access such as Microsoft. Even those are contestable. Salesforce and HubSpot already have stronger default
              distribution, and the best adverse evidence in the category shows that AI-SDR products lose buyers when
