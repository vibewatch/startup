  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The best-fit market boundary for Rox is not the entire CRM software market but the narrower AI SDR,
              AI-first GTM, and revenue-intelligence workflow layer that automates prospecting, research, outreach, and
              next-step execution. Analyst definitions explicitly include software and services delivered via
              cloud-native SaaS, browser extensions, and API-first embeds. That scope captures the operating layer Rox
              is trying to become. It excludes basic record-keeping CRMs when they are used only as systems of record,
              because Rox argues the CRM is no longer the place where live revenue work should happen. Within the
              surrounding landscape, there are four close substitute paths. First, revenue-intelligence and
              GTM-intelligence platforms such as Gong, 6sense, and Outreach cover overlapping budgets even when their
              product scope differs. Second, AI SDR specialists and low-end outbound tools such as Amplemarket, Artisan,
              and 11x compete for the same “do more outbound with fewer humans” spend pool. Third, CRM-native bundles
              from HubSpot and Salesforce embed prospecting and agentic features inside an already-purchased system of
              record, which can remove the procurement event that a standalone platform needs. Fourth, some teams still
              rely on manual research, spreadsheets, or internal builds. Rox only needs to win one of those budget line
              items to enter the stack, but it must remain differentiated against all four over time.
            claimRefs:
              - CM013
              - CM014
