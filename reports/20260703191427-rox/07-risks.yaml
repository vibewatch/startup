  evidenceGaps:
  - type: missing-source
    severity: material
    topic: subprocessors-and-dpa-surface
    missingEvidence: A current public subprocessor list, a separately retrievable DPA, and any product-specific AI governance
      annexes.
    whyItMatters: Enterprise data-processing diligence remains incomplete without knowing which downstream vendors handle
      sensitive customer data and whether updated contractual terms exist.
    diligencePath: Request Rox's current DPA package, subprocessor list, and any AI-model governance disclosures shared in
      security review.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: A breach, enforcement, or incident log covering security, privacy, or material customer outages.
    whyItMatters: Without incident history, investors cannot separate a clean record from a lack of public transparency.
    diligencePath: Request security incident summaries, SOC exceptions, and any regulator or customer notices issued since
      launch.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: sla-and-reliability
    missingEvidence: Uptime, SLA, exception-rate, and support-response metrics for production deployments.
    whyItMatters: Operational-quality risk cannot be sized from public case studies alone.
    diligencePath: Ask for enterprise SLAs, incident postmortems, error-budget metrics, and support staffing ratios.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: governance-depth
    missingEvidence: A current org chart, succession plan, and operating-bench detail beyond the founders.
    whyItMatters: Key-person risk and execution capacity depend on whether leadership depth exists below the founding team.
    diligencePath: Review the current executive roster, management bios, and board-level succession materials.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-register
    missingEvidence: An exhaustive list of every jurisdiction, contract exception, and privacy addendum applicable to Rox.
    whyItMatters: The legal register is intentionally partial because public evidence only surfaces the highest-signal items,
      not the full contract and jurisdiction inventory.
    diligencePath: Use customer contract diligence and counsel review to expand the register before investment committee approval.
    relatedQuestionRefs:
    - QR006
    - QR022
    relatedTableRefs:
    - TR001
