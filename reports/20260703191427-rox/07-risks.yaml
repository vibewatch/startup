- id: TR001
  title: Regulatory / legal risk register
  columns:
  - rule / case / obligation
  - jurisdiction
  - status
  - likelihood
  - severity
  - mitigation
  - residual exposure
  - diligence path
  rows:
  - - Privacy-law compliance across enterprise data workflows
    - U.S. and EEA-facing enterprise accounts
    - Rox public terms reference CCPA, GDPR, subcontractor controls, and SCCs, but retained public materials remain narrow
    - medium
    - high
    - Rox publishes privacy-policy and DPA-style terms and lets users request deletion by email
    - medium-high
    - Obtain the current DPA package, subprocessor list, data-retention schedule, and any negotiated enterprise privacy addenda.
  - - Marketing and automation-claim risk
    - U.S. and global commercial claims
    - Rox markets autopilot and autonomy but simultaneously requires human review and disclaims guaranteed outcomes
    - medium
    - high
    - Rox narrows claims through review and results disclaimers
    - medium
    - Review customer contracts, sales collateral, and any regulated-industry objections to autonomous-outreach language.
  - - Cross-border transfer and subprocessors risk
    - EEA / UK data subjects
    - Terms mention SCCs and subcontractor obligations, but retained sources do not expose the full vendor chain
    - medium
    - high
    - Contract terms acknowledge SCC obligations and written downstream controls
    - medium-high
    - Request current SCC implementation, subprocessors, model providers, and geo-specific hosting architecture.
  - - Policy freshness and disclosure-surface risk
    - Public legal surface
    - Retained privacy policy was last updated in 2024, and no richer 2026 public legal refresh was retained
    - medium-high
    - moderate
    - Core privacy and security pages exist and provide contact routes
    - medium
    - Confirm whether later legal updates or trust-center materials exist outside the retained public cache.
  notes: Rows are ordered by residual severity using only retained public evidence and explicit diligence gaps.
