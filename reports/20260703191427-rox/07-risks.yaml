company:
  name: Rox
chapter:
  number: 7
  title: Risks
  summary: Rox's public risk profile is driven more by documentation gaps, dependency density, and valuation intensity than
    by any disclosed catastrophic incident. The company has credible enterprise-security claims and recognizable customer
    proof, but its own materials emphasize human review, non-guaranteed outcomes, and third-party integration dependence.
    The highest residual risks are privacy and claims governance, bundle pressure from incumbents, customer-proof portability,
    and a financing bar implied by the reported $1.2 billion valuation against only a sourced $8 million 2025 ARR projection.
sections:
- id: regulatory-legal-and-trust
  title: Regulatory, legal, and trust-surface risk
  body: 'Rox has enough public compliance language to pass an initial enterprise-screening conversation, but not enough to
    remove diligence risk. The strongest positive evidence is on its own security and legal pages: Rox says it encrypts customer
    data, does not use customer data to train generalized models, undergoes annual third-party audits, and embeds privacy
    obligations for CCPA, GDPR, subcontractors, and cross-border data transfers into its website terms. The main problem is
    not that the company has disclosed a public enforcement action; it is that the retained public surface remains narrow
    relative to the sensitivity of seller workflow data, outreach automation, and enterprise integrations. Rox also narrows
    its own marketing claims by requiring human review and warning that customer outcomes vary with configuration and data
    quality. That is prudent legal positioning, but it also means investors should not treat the strongest case-study metrics
    as universally reproducible. With no retained incident log, no separately retrievable subprocessor list, and no fresh
    2026 privacy-policy revision, the legal and trust layer still needs direct diligence before the risk can be called low.'
