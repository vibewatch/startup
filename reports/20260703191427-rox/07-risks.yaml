- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Privacy and claims-governance risk
    - Legal surface stays stale or a regulator/customer raises formal objections
    - No fresher legal package or a material privacy/process objection in enterprise diligence
    - Pause underwriting until updated legal and data-processing evidence is reviewed.
  - - Model-quality or portability risk
    - Named customers stop expanding or proof remains anecdotal
    - No broader deployment, weak reference calls, or evidence that results are highly configuration-specific
    - Cut growth and retention assumptions and treat public case studies as outliers.
  - - Bundle pressure
    - Agentforce or Breeze materially expands into the same seller workflows Rox targets
    - Incumbent product and pricing coverage narrow Rox's wedge at existing customer accounts
    - Reduce upside assumptions and demand stronger entry discipline.
  - - Financing risk
    - New capital event arrives before stronger economic disclosure
    - Another round, tender, or secondary process occurs without clearer ARR, retention, or concentration support
    - Assume price support is weak and require cap-table and preference diligence before proceeding.
  - - Execution and support-intensity risk
    - Implementation load outgrows team depth
    - Reference customers cite slow onboarding, support bottlenecks, or weak post-pilot expansion
    - Treat service delivery and margin structure as a thesis-breaker.
  notes: These kill criteria focus on observable events that would directly change underwriting rather than generic startup
    uncertainty.
