    coverage: partial
    basis: This register covers the highest-signal public legal and regulatory obligations visible in retained Rox legal pages
      and the California CCPA guidance page as of 2026-07-03; it is not exhaustive because private contracts, subprocessors,
      and any internal incident or enforcement history were not publicly available.
