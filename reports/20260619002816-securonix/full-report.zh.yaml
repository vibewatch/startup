        title: 融资历史、投资者基础与估值信号
        blocks:
          - type: paragraph
            body: >-
              Securonix 的资本故事由 2022 年 2 月 Vista 领投的增长投资主导。最强的公开锚点是 Vista 自身公告：公司获得超过 $1B 的增长资本，这笔交易足以把 Securonix
              从一家风投支持的专业厂商，重置为私募股权支持的品类规模平台。独立数据库随后把累计融资放在约 $1.06B，并列出一个广泛财团，包括 Vista、早期风投支持方，以及 Snowflake、Capital One
              等战略投资者。融资后的最干净正向估值信号，是公司 2024 年 1 月宣布进入 World Economic Forum
              独角兽社区，支撑其十亿美元级估值状态。反面证据是，第三方数据集仍然无法在精确估值上达成一致，数值分散在宽区间内，而非一个经审计数字。保留的公开来源均未披露当前股权比例、债务、清算优先权或 2022
              年后的新一轮融资。因此，Securonix 显然资金充足，但在经济层面仍像许多后期私营安全公司一样不透明。
