      - number: '8.3'
        title: 情景、敏感性与估值区间
        blocks:
          - type: paragraph
            body: >-
              估值情景把投资逻辑和可比公司转成区间。基准情形对约 $167 million 收入套用约 6-8x，对应 ~$1.0-1.5 billion 估值，反映品类领导地位被捆绑压力抵消；牛市情形在 AI
              动能和净留存加速时，对 $200 million 以上远期 ARR 套用约 8-10x，对应约 $2 billion；熊市情形在替代和执行拖累压缩倍数时，对 $167 million 套用约 3x，对应约
              $500 million。合理概率权重大约是 50% 基准、25% 牛市、25% 熊市，使概率加权价值略高于基准情形。因此，隐含估值区间约为 $0.5 billion 至 $2
              billion。敏感性分析显示，适用倍数是最主要的价值驱动，其次是 ARR 水平，再之后是增长与留存假设——以 ~$167 million 为基数，倍数每变动 1x，估值约变动 $167
              million。也正因为如此，收入质量和捆绑驱动的倍数风险，是定价前最值得确认的变量。
            claimRefs:
              - CV014
              - CV015
