      - number: '3.3'
        title: 定价、进入市场与分销
        blocks:
          - type: paragraph
            body: >-
              定价和分销是 Securonix 面临最大结构性劣势的地方。Microsoft 把 Sentinel 的消耗定价叠在 E5 套餐上，降低采用 Microsoft
              安全工具的边际成本，也让它常常成为默认选择。Splunk 借成熟生态和庞大装机基础发力，CrowdStrike 和 Palo Alto 则通过终端和平台特许权整合预算。Securonix 用基于授权的
              SaaS、据称接近每年 $67,000 的入门价，以及面向可预测经济性的 DPM Flex 弹性消耗来应对。不过，分销力量明显偏向超大市值公司和 Cisco，它们掌握企业协议和全球渠道网络。Securonix
              入选 CRN Security 100 说明渠道可信度存在，其 SaaS/BYOC/MSSP
              灵活性也支撑服务提供商打法，但它必须靠分析价值和总成本赢，而不是默认捆绑。买方常常多栖部署，这既打开进入点，也维持既有厂商存在。
