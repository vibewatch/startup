          - type: callout
            title: 倍数是最主要的价值驱动
            body: 估值对适用 EV/Revenue 倍数最敏感，而 Microsoft 捆绑最直接威胁的，正是把倍数压向熊市情形。
            calloutType: insight
            claimRefs:
