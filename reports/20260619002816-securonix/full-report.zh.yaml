            body: >-
              财务和治理风险围绕不透明与控制权展开。Securonix 是私营且 PE 支持的公司，不披露经审计财务，因此收入质量和利润率无法验证；烧钱和现金续航
              未披露，也让融资风险无法从公开数据量化。冲突估值标记——$1B+ 独角兽身份对上更低的二级市场指示——制造进入定价风险，必须与股权结构对账。Vista
              赞助集中治理和控制权，从而塑造战略，更重要的是塑造退出时点：投资者流动性取决于 Vista 最终出售或 IPO 的决定。依赖方面，Securonix 依赖 AWS 和 Snowflake
              提供基础设施和数据，尽管有共同责任控制，仍形成集中度和单点失效韧性风险；它还依赖 MSSP
              合作伙伴承担部分交付。这些风险会叠加：如传导图所示，捆绑压力会压缩定价、挤压利润率、削弱研发能力，并最终损害退出价值，把竞争、财务和治理线索连成一个相互关联的暴露面。
