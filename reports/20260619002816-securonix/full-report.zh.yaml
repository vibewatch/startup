      - number: '2.2'
        title: 用多重视角测算机会
        blocks:
          - type: paragraph
            body: >-
              没有一个已发表数字能完整概括 Securonix 的机会，因此本章用多个视角交叉校验。当年分析师估计把 2026 年全球 SIEM 市场放在约 $8.4B 至 $12.1B 的宽区间；最低与最高估计相差超过
              40%，因为方法论在范围和地理口径上不同。不同发布方给出的预测 CAGR 集中在 10% 到 12% 左右。套用邻接领域和买方过滤后，尽调估计为：扩展 TAM 约 $10-12B，集中在受监管和 SOC
              成熟企业的可服务市场为 $4-6B，合理的近期可获得市场约 $0.5-1.0B。关键是，没有保留来源发布 Securonix 专属 TAM、SAM 或
              SOM，因此公司层面的堆栈明确是尽调估计，不是有来源事实；任何单一头条数字都应按方向性读取。
