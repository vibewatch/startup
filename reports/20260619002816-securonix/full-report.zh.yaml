      - number: '8.4'
        title: 可比公司集合与退出路径
        blocks:
          - type: paragraph
            body: >-
              可比公司集合给估值划出上沿和下沿。溢价端，CrowdStrike 交易约 24.7x EV/Revenue，Palo Alto 接近 11x，SentinelOne 提供中位公共参照；下沿则是传统 SIEM
              厂商，约 1.7-5x。最相关的战略基准，是 Cisco 约 $28 billion 收购 Splunk，约 7-9x 收入；按 Windsor Drake 分析，下一代 SIEM 同行约处在 5-10x
              远期收入区间。2025 年网络安全 M&A 约达 $96 billion，战略收购是可信的近端退出路径；IPO 选择权则取决于规模和市场窗口。Securonix 不应拿到 CrowdStrike
              这种超大云安全公司的增长倍数，但它的领导地位、经常性收入和 AI 路线图，足以支撑其估值高于传统下沿，并落在下一代同行区间内——这支持 6-8x 基准情形。可比表本身明确是部分样本：它覆盖公共可比公司和一个战略
              M&A 基准，但无法纳入未披露的私募轮次，这仍是尽调确认项。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV023
              - CV030
