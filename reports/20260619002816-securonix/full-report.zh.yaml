      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Securonix 的融资历史锚定了估值讨论。2022 年 Vista 领投的投资超过 $1 billion，五轮累计融资约 $1.06 billion，公司又在 2024
              年被纳入网络安全独角兽群体，合起来构成了此前 $1 billion 以上估值的标记。与之相对，二级市场接近每股 $2.86
              的指示价，暗示估值低于头部独角兽叙事，因此入场价格存在真实张力，必须被调和。相应的入场纪律需要三件事：用约 $126-167 million
              的估算收入倍数校准独角兽标记；搞清任何清算优先权和控制条款是否改变少数投资者经济收益；避免相对已披露可比区间支付过高价格。独角兽身份与二级市场指示价相互冲突，并不直接否决交易，但清楚要求保守定价，并把优先权审查设为闸门式尽调项。公司仍是私有且由
              PE 支持，当前一级市场真实估值未披露，因此入场应锚定在基准情形区间或以下；在确认前，股权结构必须被视为重大未知数。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
