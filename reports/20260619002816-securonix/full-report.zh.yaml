  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻接领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              Securonix 销售切入的是现代安全运营预算，而不是狭窄的日志管理小众市场。公开产品材料把 SIEM、UEBA、SOAR 和威胁情报打包进一个 Unified Defense 平台，这让公司进入与
              Microsoft Sentinel、Splunk 以及 XDR 带动的整合厂商相同的采购动作。相关市场边界因此包括核心 SIEM 检测与留存，以及买方越来越一起评估的
              UEBA、自动化和安全数据邻接领域。边界之外是没有 SecOps 目的的通用 IT
              可观测性和工作流自动化。现状替代方案和直接竞争对手同样重要：托管检测与响应服务、内部检测工程，都可以用服务或人力替代额外平台席位，从而推迟或压缩软件捕获。这样定义边界能让市场规模更诚实，也为后文分析竞争和捆绑压力定框架。它还说明，Securonix
              借 ThreatQuotient 收购强化的威胁情报推进，是有意把边界延伸到外部情报支出，而这部分历来被传统 SIEM 定义排除在外。
