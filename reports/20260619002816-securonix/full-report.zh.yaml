    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Securonix 是一家经常性收入 SaaS 公司，主要收入来自 Unified Defense SIEM 平台的订阅访问。变现按授权而非纯消耗计费，据称入门价接近每年
              $67,000，锚定中大型企业交易经济性，而不是 SMB。核心订阅之外，收入组合还包括转售多租户部署的 MSSP 和 MDR 渠道、2025 年 ThreatQuotient
              收购强化的威胁情报收入流，以及用于上线和调优的配套专业服务。公司不发布分部收入拆分，因此组合是基于公开材料重建，并在必要处推断。授权定价的战略逻辑，加上 2025 年 DPM Flex
              弹性消耗选项，是用可预测经济性对抗买方认为消耗型竞争对手带来的成本不可预测性；这既支撑落地扩张，也通过模块、数据增长和 AI 附加项推动净扩张。由于授权 SaaS 的收入确认按合同期摊销，报告 ARR
              和已确认收入在预订快速增长期可能分离；将公司的新增 ARR 增长主张与第三方收入估计对账时，这一点很重要。
