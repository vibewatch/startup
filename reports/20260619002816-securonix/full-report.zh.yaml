              80%，但没有来源确认营业成本。成本结构由研发、云交付和进入市场支出主导，符合增长阶段安全软件厂商特征；2026 年继续投资 ThreatWatch 和 Threat Research
              Agent，也显示研发投入持续。2026 年约 645 至 658 名员工的估计，意味着相当大的固定成本基础。关键是，CAC、回本周期和净收入留存全部未披露，销售效率无法从公开证据测量。DPM Flex
