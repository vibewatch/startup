  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流视角看平台
        blocks:
          - type: paragraph
            body: >-
              Securonix 把自己定位为云原生 Unified Defense SIEM，在同一个安全运营平台内统一基于日志的检测、用户和实体行为分析、SOAR 自动化和威胁情报。按客户工作流看，平台覆盖完整 SOC
              生命周期：遥测接入、检测与风险评分、调查与案件管理，以及自动化响应。UEBA 能力是公司的历史差异点，它为用户和实体行为建立基线，浮现内部风险和凭证滥用；SOAR
              剧本自动化富化与响应，压缩平均响应时间。检测内容对齐 MITRE ATT&CK 框架，并通过 Autonomous Threat Sweeper 用更新内容回溯狩猎。模块化设计让买方先采用 SIEM，再扩展到
              UEBA、SOAR 和威胁情报，支撑落地扩张商业动作，也把平台塑造成碎片化点工具的整合目标。对企业 SOC
              而言，这套整合论点就是核心产品承诺：用一条带风险评分的流水线，替代分散的检测、分析和自动化工具拼盘，意在同时降低告警疲劳和检测工程师背负的集成负担。
