              - CV030
      - number: '8.5'
        title: 建议、触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议是有条件、守估值纪律的正面立场，置信度中等、风险评级中等：在 ~$1.0-1.5 billion
              基准区间或以下入场，牛熊价差提供有利不对称。推荐逻辑从品类领导地位和客户证明出发，穿过市场与执行风险，落到有纪律的估值结论；IC KPI
              视角中，市场和产品得分最高，证明与经济性居中，受财务不透明拖累，证据质量最低。最能推翻投资案例的 thesis-break 和 kill 触发点，是 ARR 增速低于市场、Microsoft
              替代加速、重大安全漏洞，或发现偏重优先权、侵蚀少数股东回报的股权结构。因此，最终尽调问题必须具体且设为闸门：经审计财务、当前准确 ARR
              与增速、毛利率和经营利润率、股权结构中的优先权与控制条款、客户集中度数据。确认这些事项，才能把有条件建议转为可投资建议；若无法确认，或答案不利，就应向熊市情形重新定价，或直接放弃。总体看，不对称性支持有纪律地参与。
