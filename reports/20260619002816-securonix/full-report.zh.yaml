companyProfile:
  summary: >-
    Securonix 是一家私营云原生网络安全公司，2008 年成立，总部位于 Texas 州 Addison。2022 年 2 月获得 Vista Equity Partners 领投的 $1B+ 增长投资后，公司如今定位为
    Unified Defense SIEM 厂商，把 SIEM 检测、UEBA、SOAR 和 AI 驱动的威胁情报整合进同一个安全运营平台。在 CEO Kash Shaikh 带领下，公司推进偏 AI 的 2026 路线图，核心包括
    Agentic Mesh、SAM 和 Threat Research Agent；2025 年 6 月收购 ThreatQuotient 后，外部威胁情报能力也得到加强。客户主要是大型受监管企业、金融服务公司、政府机构，以及
    MSSP/MDR 合作伙伴；2024 年 1 月，公司获 WEF 独角兽社区认可。
  foundedDate: '2008-01-01'
