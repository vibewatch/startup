    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与平台定位
        blocks:
          - type: paragraph
            body: >-
              Securonix 是一家 2008 年成立的私营网络安全公司，如今把自己讲成云原生安全运营平台，而不是单一分析点工具。保留的官方材料反复描述 Unified Defense 架构：把 SIEM、威胁检测和调查
              / 响应、UEBA、SOAR 以及 AI 分析师工作流整合起来。这一定位很关键，因为它把 Securonix 放进 Microsoft Sentinel、Splunk、Exabeam 以及以 XDR
              带动整合的平台同一类现代 SecOps 预算流里，而不只是公司早期建立认知的 UEBA 细分市场。公开公司资料和市场数据资料基本匹配官方定位，也指向 Texas 州 Addison 是当前总部锚点。2026
              年最稳妥的一句话描述是：一家私营云原生、 SIEM/XDR 风格的安全运营厂商，向大型企业和服务提供商销售 AI 辅助的检测、调查和响应能力。
