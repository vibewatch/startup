        blocks:
          - type: callout
            title: 有纪律入场下的有条件正面判断
            body: 在 ~$1.0-1.5B 基准区间或以下入场；若经审计财务和股权结构条款确认质量，~$0.5B-$2B 的价差提供有利不对称。
            calloutType: recommendation
