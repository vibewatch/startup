      - number: '2.3'
        title: 买方、细分市场与采用路径
        blocks:
          - type: paragraph
            body: >-
              平台的经济买方是拥有检测与响应预算的 CISO 或安全运营
              VP，检测工程和事件响应负责人提供需求输入。已服务市场集中在大型受监管企业、金融服务和政府机构；这些场景的工作流复杂度和合规义务足以支撑一套完整安全运营平台，而不是一个点工具。采用通常分阶段推进：先接入日志和摄取数据，再做检测工程，然后进入调查与案件管理，最后自动化响应。MSSP
              和 MDR 渠道通过把平台作为托管服务转售给无法配置成熟 SOC 的组织，显著扩大可触达买方基数。中端市场买方更价格敏感，也更常以托管服务优先的路径采用。这种细分解释了 Securonix
              能在哪里赢，也解释了预算归属和采购周期在哪里拖慢转化。政府和公共部门采购尤其会拉长销售周期，并增加主权和审计要求；这更有利于能够展示合规级证据和灵活部署选项的厂商。
