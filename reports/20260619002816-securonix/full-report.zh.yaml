      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              2026 年，几项耐久驱动支撑安全运营支出。Verizon DBIR 和 IBM 数据泄露成本研究量化了漏洞事件频率和成本上升，继续支撑检测与响应需求；漏洞利用持续发生，也让监控要求维持高位。SEC
              网络安全披露规则、NIST Cybersecurity Framework 和新兴 EU AI 规则等合规与披露制度，带来董事会层面对可审计检测的反复需求。AI
              驱动的自动化预期正在扩大可触达市场，也重塑买方如何衡量一套 SIEM 的价值，不再只看原始日志量；长期技能短缺则把买方推向自动化和托管服务。与这些驱动相对的是实质约束：Microsoft 将 Sentinel
              与广泛客户权益捆绑，压迫独立厂商经济性；集成和上手复杂度抬高转换成本，拖慢替换。DPM Flex 这类成本控制功能正是对预算周期压力的直接回应，但净市场仍然既在扩张，也竞争激烈。
