      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层是当前 Securonix 概览中最重要的变量，因为高调的 Vista 时代开启后，CEO 席位已经更换。Securonix 2022 年 12 月正式宣布 Nayaki Nayyar 出任 CEO，但到
              2024 年，独立报道和当前领导层页面均指向 Kash Shaikh 为总裁兼 CEO。可见高管班子还包括 CFO Marion Smith 和 COO Venkat
              Kotla，足以说明公司有一定运营纵深，但不足以细致描绘治理结构。公开来源没有实质披露董事会构成、投票控制、清算优先权，或 2022 年融资后 Vista 控制权的具体范围。这种不透明很重要，因为
              Securonix
              在最近一轮增长资本阶段已经经历过一次重大领导层交接，而私募股权支持的网络安全公司往往把战略、运营和退出决策压缩在一个由赞助方主导的小圈子里。评论中关于实施复杂度和支持质量的抱怨不足以推翻投资论点，但会强化一个判断：运营执行需要和产品叙事一样被重点检查。
