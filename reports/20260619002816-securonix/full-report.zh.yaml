  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              作为摄取并处理大量客户安全遥测的厂商，Securonix 位于密集的监管和法律边界内。SEC 网络安全披露规则既提高直接合规预期，也带来客户驱动的要求；GDPR 则施加处理者义务，且 EU
              执法行动和罚款表明数据保护失败会带来重大责任。EU DORA 制度增加 ICT 运营韧性义务，并传导到 Securonix 的金融服务客户和合同；EU AI Act 以及更广泛的 AI
              治理规则，则为公司的智能体式 AI 功能带来新兴合规暴露，包括可解释性义务。法律侧，数据处理协议和处理者责任风险、软件厂商赔偿与 SLA 暴露，以及 ThreatQuotient 收购带来的 IP
              集成风险，是主要线索。跨境数据传输规则进一步约束 EU 遥测处理。关键证据限制在于，任何保留来源都没有披露 Securonix 的具体诉讼和执法历史，因此本评估映射的是适用义务，而不是已观察到的违规。
