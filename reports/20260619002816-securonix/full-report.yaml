      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Bundling plus opacity is the core risk pairing
            body: >-
              Microsoft's bundling-driven market pressure and Securonix's financial opacity are the two
              highest-severity, highest-residual risks and should anchor any risk-adjusted view.
            calloutType: risk
