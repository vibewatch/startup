        title: Sizing the Opportunity Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single published figure captures the Securonix opportunity, so this chapter triangulates several
              lenses. Current-year analyst estimates put the 2026 global SIEM market in a wide band of roughly $8.4
              billion to $12.1 billion, with the dispersion between the lowest and highest estimates exceeding forty
              percent because methodologies differ on scope and geography. Across publishers the forecast compound
              annual growth rate clusters around ten to twelve percent. Applying an adjacency and buyer filter yields a
              diligence estimate of a roughly $10-12 billion expanded TAM, a $4-6 billion serviceable market
              concentrated in regulated and SOC-mature enterprises, and a plausible near-term obtainable market of about
              $0.5-1.0 billion. Importantly, no retained source publishes a Securonix-specific TAM, SAM, or SOM, so the
              company-level stack is explicitly a diligence estimate rather than a sourced fact, and any single headline
              figure should be read as directional.
