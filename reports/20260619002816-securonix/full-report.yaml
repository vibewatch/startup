      - number: '3.3'
        title: Pricing, Go-to-Market, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Pricing and distribution are where Securonix faces the steepest structural disadvantage. Microsoft sells
              Sentinel on consumption pricing layered onto E5 bundles, which lowers the marginal cost of adopting
              Microsoft security tooling and makes it a frequent default choice. Splunk leverages a mature ecosystem and
              large installed base, while CrowdStrike and Palo Alto consolidate budgets through endpoint and platform
              franchises. Securonix counters with entitlement-based SaaS, a reported entry point near $67,000 per year,
              and DPM Flex elastic consumption aimed at predictable economics. Distribution power, however, clearly
              favors the mega-caps and Cisco through enterprise agreements and global channel networks. Securonix's CRN
              Security 100 placement signals channel credibility, and its SaaS/BYOC/MSSP flexibility supports a
              service-provider motion, but it must win on analytics value and total cost rather than default bundling.
              Buyers commonly multi-home, which both opens entry points and sustains incumbent presence.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP017
              - CP021
              - CP024
              - CP030
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP009
              - CP024
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Securonix's moats are real but only moderately durable. UEBA heritage and analytics depth, 700+
              integrations, and the ThreatQuotient threat-intelligence stack create switching costs and breadth, yet
              each is at least partially replicable by better-resourced rivals. The dominant risks are Microsoft's
              bundling economics, which lower adoption cost industry-wide, and XDR convergence from CrowdStrike and Palo
              Alto that commoditizes standalone SIEM. A persistent brand-recognition deficit limits default selection
              even where analyst recognition is strong. No retained source publishes verified head-to-head win rates,
              competitor SIEM-specific revenue, or customer-overlap data, so competitive position remains directional.
              The net assessment is that Securonix holds a defensible but contested niche: strong enough to retain and
              expand within regulated enterprises and the MSSP channel, but exposed to consolidation and bundling that
              cap its share-capture ceiling absent continued differentiation and disciplined pricing. In short, the
              competitive verdict is conditional rather than decisive, and it hinges on sustained execution.
