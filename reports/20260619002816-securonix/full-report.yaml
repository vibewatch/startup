  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Consolidation
        blocks:
          - type: paragraph
            body: >-
              Securonix competes in a crowded and consolidating security-operations market. The competitive set spans
              platform incumbents such as Microsoft Sentinel and Cisco-owned Splunk, XDR-led entrants including
              CrowdStrike and Palo Alto's Cortex XSIAM, UEBA-centric peers in the merged Exabeam-LogRhythm, the legacy
              SIEM cohort represented by IBM QRadar, and open alternatives like Elastic. Two recent transactions
              reshaped the field: Cisco's $28 billion acquisition of Splunk and the Exabeam-LogRhythm merger, both of
              which concentrate scale and raise pressure on independents. Status-quo substitutes—managed detection
              services and in-house engineering—also compete for the same budget. Within this landscape Securonix
              positions itself as an independent best-of-breed Unified Defense SIEM, a stance that differentiates it on
              analytics depth but also exposes it to platform-bundling dynamics. The central competitive question is
              whether independent differentiation can outrun incumbent convergence. The answer increasingly depends on
              whether buyers continue to value best-of-breed analytics depth over the convenience and economics of a
              single consolidated platform, a preference that varies sharply by segment, regulatory exposure, and SOC
              maturity.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP026
              - CP027
              - CP035
          - type: table
            tableRef: TP001
            claimRefs:
