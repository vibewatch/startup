    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Platform Positioning
        blocks:
          - type: paragraph
            body: >-
              Securonix is a private cybersecurity company founded in 2008 that now presents itself as a cloud-native
              security-operations platform rather than as a narrow analytics point product. Retained official materials
              consistently describe a Unified Defense architecture that combines SIEM, threat detection and
              investigation/response, UEBA, SOAR, and AI analyst workflows. That positioning matters because it places
              Securonix in the same modern SecOps budget motion as Microsoft Sentinel, Splunk, Exabeam, and XDR-led
              consolidation platforms, not just in the earlier UEBA niche where the company first earned mindshare.
              Public company and market-data profiles broadly align with the official positioning and point to Addison,
              Texas as the current headquarters anchor. The safest one-line description in 2026 is: a private,
              cloud-native SIEM/XDR-style security-operations vendor selling AI-assisted detection, investigation, and
              response to large enterprises and service providers.
