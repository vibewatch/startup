companyProfile:
  summary: >-
    Securonix is a private, cloud-native cybersecurity company founded in 2008 and headquartered in Addison, Texas.
    Backed by Vista Equity Partners following a $1B+ growth investment in February 2022, it now positions as a Unified
    Defense SIEM vendor combining SIEM detection, UEBA, SOAR, and AI-driven threat intelligence in a single
    security-operations platform. Under CEO Kash Shaikh, the company pursues an AI-forward 2026 roadmap—headlined by
