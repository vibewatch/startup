  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              As a vendor that ingests and processes large volumes of customer security telemetry, Securonix sits inside
              a dense regulatory and legal perimeter. The SEC cybersecurity disclosure rule raises both direct
              compliance expectations and customer-driven requirements, while GDPR imposes processor obligations and
              meaningful liability for data-protection failures, as EU enforcement actions and fines demonstrate. The EU
              DORA regime adds ICT operational-resilience obligations that flow through to Securonix's
              financial-services customers and contracts, and the EU AI Act plus broader AI-governance rules create
              emerging compliance exposure for the company's agentic AI features, including explainability obligations.
              On the legal side, data-processing-agreement and processor-liability risk, software-vendor indemnification
              and SLA exposure, and IP-integration risk from the ThreatQuotient acquisition are the principal threads.
              Cross-border data-transfer rules further constrain EU telemetry handling. The critical evidence limitation
              is that Securonix's specific litigation and enforcement history is not disclosed in any retained source,
              so this assessment maps applicable obligations rather than observed violations.
            claimRefs:
