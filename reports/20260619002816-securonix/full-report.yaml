  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Securonix is a recurring-revenue SaaS business whose primary stream is subscription access to its Unified
              Defense SIEM platform. Monetization is entitlement-based rather than pure consumption, with a reported
              entry point near $67,000 per year that anchors mid-to-large enterprise deal economics rather than SMB.
              Beyond core subscriptions, the revenue mix spans an MSSP and MDR channel that resells multi-tenant
              deployments, a threat-intelligence stream strengthened by the 2025 ThreatQuotient acquisition, and
              attached professional services for onboarding and tuning. The company does not publish a segment revenue
              breakdown, so the mix is reconstructed from public materials and inferred where necessary. The strategic
              logic of entitlement pricing, reinforced by 2025's DPM Flex elastic-consumption option, is to offer
              predictable economics against the cost unpredictability buyers associate with consumption-based
              competitors, which supports both land-and-expand motion and net expansion through modules, data growth,
              and AI add-ons. Because revenue recognition for entitlement SaaS is ratable over the contract term,
              reported ARR and recognized revenue can diverge during periods of rapid bookings growth, a nuance that
              matters when reconciling the company's new-ARR growth claims with third-party revenue estimates.
