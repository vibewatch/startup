      - number: '2.3'
        title: Buyers, Segments, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for the platform is the CISO or VP of Security Operations who owns the
              detection-and-response budget, supported by detection-engineering and incident-response leaders who shape
              requirements. The served market concentrates in large regulated enterprises, financial services, and
              government, where workflow complexity and compliance obligations justify a full security-operations
              platform rather than a point tool. Adoption typically follows a phased path: log onboarding and ingestion,
              then detection engineering, then investigation and case management, and finally automated response. The
              MSSP and MDR channel materially widens the addressable buyer base by reselling the platform as a managed
              service to organizations that cannot staff a mature SOC. Mid-market buyers are more price-sensitive and
              frequently adopt through a managed-service-first route. This segmentation explains both where Securonix
              can win and where budget ownership and procurement cycles slow conversion. Government and public-sector
              procurement in particular extends sales cycles and adds sovereignty and audit requirements that favor
              vendors able to demonstrate compliance-grade evidence and flexible deployment options.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM036
