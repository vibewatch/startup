      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several durable drivers support security-operations spend in 2026. Rising breach frequency and cost,
              quantified by the Verizon DBIR and IBM breach-cost research, sustain detection-and-response demand, while
              continued vulnerability exploitation keeps monitoring requirements high. Compliance and disclosure
              regimes, including the SEC cybersecurity disclosure rule, the NIST Cybersecurity Framework, and emerging
              EU AI rules, create recurring board-level demand for auditable detection. AI-led automation expectations
              are expanding the addressable market and reshaping how buyers value a SIEM beyond raw log volume, and the
              persistent skills shortage pushes buyers toward automation and managed services. Against these drivers sit
              real constraints: Microsoft's bundling of Sentinel with broad customer benefits pressures
              independent-vendor economics, and integration and onboarding complexity raise switching costs that slow
              displacement. Cost-control features such as DPM Flex are a direct response to budget-cycle pressure, but
              the net market remains both expanding and contested.
