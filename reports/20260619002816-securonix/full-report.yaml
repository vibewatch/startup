          - type: figure
            figureRef: FV004
            claimRefs:
              - CV021
              - CV031
              - CV029
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional positive at a disciplined entry
            body: >-
              Enter at or below the ~$1.0-1.5B base range; the ~$0.5B-$2B spread offers favorable asymmetry if audited
              financials and cap-table terms confirm quality.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV041
              - CV018
          - type: callout
            title: The multiple is the dominant value driver
            body: >-
              Valuation is most sensitive to the applied EV/Revenue multiple, which Microsoft bundling most directly
              threatens to compress toward the bear case.
            calloutType: insight
            claimRefs:
