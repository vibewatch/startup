              ThreatQuotient acquisition across product, team, and roadmap, and absorbing that without distraction.
              Key-person risk is real: Securonix has experienced two CEO transitions during the Vista era, including the
              2024 handoff to Kash Shaikh, which tests strategic continuity. Talent retention and scaling within a
              roughly 645-to-658-person organization that is simultaneously integrating acquisitions add further
              execution exposure. As a security vendor, Securonix also carries breach-liability risk, where a compromise
              of its own platform could carry outsized reputational and legal cost. A further unresolved operational
