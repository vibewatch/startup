    {
      "id": "scale-milestones-and-open-gaps",
      "title": "Scale Markers, Milestones, and the Remaining Evidence Gaps",
      "body": "The public evidence set is strong enough to outline momentum but not strong enough to substitute for a data room. The most useful scale datapoints are directional: Securonix said fiscal 2024 new ARR sales rose 40% year over year; GetLatka estimates 2024 ARR at roughly $126 million; and several public profiles place headcount in the mid-600s during 2026. Customer-scale proof is stronger on quality than on count. Official materials emphasize enterprise and Fortune-class customers, while published customer stories such as NEC Asia Pacific and Maveric provide quantified operational outcomes including lower false positives and faster investigation or resolution. Milestone-wise, the 2024 unicorn-community announcement, 2025 ThreatQuotient acquisition, 2025 DPM Flex launch, 2025 Gartner six-time-Leader recognition, and May 2026 threat-research-agent launch collectively show a company still investing in breadth and AI productivity. The remaining gaps are exact ARR, exact customer count, board and sponsor-control detail, and cleanly corroborated valuation/current ownership data; those are material but not unusual for a late-stage private cybersecurity platform.",
