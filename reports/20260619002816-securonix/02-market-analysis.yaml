  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "The Securonix opportunity is best framed as modern security-operations platform spend spanning SIEM, UEBA, SOAR, and threat intelligence rather than standalone SIEM. Current-year analyst estimates put the 2026 SIEM market in a wide $8.4B-$12.1B band growing about 10-12% annually, and a diligence lens implies a ~$10-12B TAM, ~$4-6B SAM, and ~$0.5-1.0B near-term SOM. Demand is driven by breach cost, compliance, AI automation, and the skills shortage, while Microsoft bundling and integration complexity are the binding constraints."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market Boundary, Adjacencies, and Substitutes",
      "body": "Securonix sells into the modern security-operations budget rather than a narrow log-management niche. Public product materials package SIEM, UEBA, SOAR, and threat intelligence inside one Unified Defense platform, which places the company in the same buying motion as Microsoft Sentinel, Splunk, and XDR-led consolidators. The relevant market boundary therefore includes core SIEM detection and retention plus the UEBA, automation, and security-data adjacencies that buyers increasingly evaluate together. Excluded from the boundary is generic IT observability and workflow automation with no SecOps purpose. Status-quo substitutes matter just as much as direct competitors: managed detection and response services and in-house detection engineering can both delay or narrow software capture by substituting services or labor for additional platform seats. Defining the boundary this way keeps the sizing honest and frames the competitive and bundling pressures analyzed later. It also clarifies that the company's threat-intelligence push, reinforced by the ThreatQuotient acquisition, deliberately extends the boundary into external-intel spend that legacy SIEM definitions historically excluded.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM003",
        "CM020",
        "CM026",
        "CM034"
      ],
      "tableRefs": [
