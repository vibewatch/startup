    {
      "id": "buyer-segmentation",
      "title": "Buyers, Segments, and the Adoption Path",
      "body": "The economic buyer for the platform is the CISO or VP of Security Operations who owns the detection-and-response budget, supported by detection-engineering and incident-response leaders who shape requirements. The served market concentrates in large regulated enterprises, financial services, and government, where workflow complexity and compliance obligations justify a full security-operations platform rather than a point tool. Adoption typically follows a phased path: log onboarding and ingestion, then detection engineering, then investigation and case management, and finally automated response. The MSSP and MDR channel materially widens the addressable buyer base by reselling the platform as a managed service to organizations that cannot staff a mature SOC. Mid-market buyers are more price-sensitive and frequently adopt through a managed-service-first route. This segmentation explains both where Securonix can win and where budget ownership and procurement cycles slow conversion. Government and public-sector procurement in particular extends sales cycles and adds sovereignty and audit requirements that favor vendors able to demonstrate compliance-grade evidence and flexible deployment options.",
      "claimRefs": [
        "CM008",
        "CM009",
        "CM010",
        "CM011",
        "CM036",
        "CM024"
      ],
      "tableRefs": [
        "TM003"
      ],
      "figureRefs": [
        "FM004"
      ]
    },
    {
      "id": "drivers-constraints",
      "title": "Growth Drivers and Adoption Constraints",
      "body": "Several durable drivers support security-operations spend in 2026. Rising breach frequency and cost, quantified by the Verizon DBIR and IBM breach-cost research, sustain detection-and-response demand, while continued vulnerability exploitation keeps monitoring requirements high. Compliance and disclosure regimes, including the SEC cybersecurity disclosure rule, the NIST Cybersecurity Framework, and emerging EU AI rules, create recurring board-level demand for auditable detection. AI-led automation expectations are expanding the addressable market and reshaping how buyers value a SIEM beyond raw log volume, and the persistent skills shortage pushes buyers toward automation and managed services. Against these drivers sit real constraints: Microsoft's bundling of Sentinel with broad customer benefits pressures independent-vendor economics, and integration and onboarding complexity raise switching costs that slow displacement. Cost-control features such as DPM Flex are a direct response to budget-cycle pressure, but the net market remains both expanding and contested.",
