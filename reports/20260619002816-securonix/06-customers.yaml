    {
      "id": "retention-satisfaction",
      "title": "Retention, Satisfaction, and Advocacy",
      "body": "Customer satisfaction is Securonix's strongest customer-side evidence. It holds a 4.7 of 5 Gartner Peer Insights rating with roughly ninety percent willing to recommend, an 8.6 of 10 PeerSpot score with ninety-six percent willingness to recommend, and about nine of ten on TrustRadius, with G2 and Capterra corroborating generally positive sentiment. This consistent, cross-platform advocacy is a meaningful retention proxy in the absence of disclosed metrics. The counterweight is a minority but recurring stream of adverse reviews citing implementation complexity and support responsiveness, which can extend time-to-value and pressure early renewal sentiment. Crucially, no retained source discloses net revenue retention, gross retention, or churn, so durable retention cannot be measured directly; strong advocacy only partially offsets that gap. The retention cohort figure in this section is therefore an illustrative proxy derived from satisfaction signals, not actual disclosed cohort data, and should be treated accordingly.",
