    {
      "id": "expansion-concentration",
      "title": "Expansion and Concentration Risk",
      "body": "Securonix's expansion story is structurally sound: a land-and-expand motion drives module attach from SIEM into UEBA, SOAR, threat intelligence, and—newest—2026 AI add-ons such as the Threat Research Agent and ThreatWatch sold into the installed base. That expansion path supports net revenue growth even without new logos. The concentration picture, however, is opaque. Top-customer revenue share and total customer counts are undisclosed, leaving concentration risk unquantified, while reliance on the company-sourced Fortune 10 claim and on MSSP partners for delivery introduces both verification and dependency risk. Channel partners widen reach but concentrate some relationships through intermediaries. A minority churn signal tied to onboarding friction warrants monitoring of renewal rates. On balance, the customer evidence is favorable on satisfaction and expansion logic but materially incomplete on retention economics and concentration, which together form the key diligence asks for this chapter. A buyer or investor should weight the strong, independent advocacy signals against the unverifiable concentration picture, recognizing that both could move the customer-quality conclusion materially once private data is shared during confirmatory diligence.",
