    {
      "id": "named-proof",
      "title": "Named Customer Proof and Reference Quality",
      "body": "Securonix's strongest production proof comes from two recent, vendor-published case studies. NEC Asia Pacific consolidated its security operations onto the Securonix Unified Defense platform, and Maveric Systems strengthened its banking security posture with the same platform, both dated to mid-2025, which supports reference freshness. Beyond these, the company relies on aggregate proof: a Gartner Peer Insights cohort of roughly ninety-four verified reviews and its six-time Gartner Magic Quadrant Leader recognition. The candid assessment is that named proof is credible but thin relative to the claimed Fortune 10 footprint—only two named production references are public, supplemented by an unverified scale claim and independent review cohorts. For diligence, the priority is obtaining a broader, named reference list with measurable outcomes, ideally spanning multiple verticals and deployment models, to confirm that the two public case studies are representative rather than the exception.",
      "claimRefs": [
        "CU004",
