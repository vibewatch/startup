  "chapter": {
    "number": 6,
    "title": "Customer Analysis",
    "summary": "Securonix's customer base centers on large regulated enterprises, banking, government, and MSSP-served organizations, with NEC Asia Pacific and Maveric Systems as recent named production references and a company-sourced 'five of Global Fortune 10' claim. Satisfaction is the strongest evidence—4.7/5 on Gartner, 8.6/10 on PeerSpot, ~9/10 on TrustRadius, with 90-96% willingness to recommend—and a land-and-expand motion (now including 2026 AI add-ons) drives expansion. The key limitations are thin named proof, unverified concentration, and undisclosed retention economics."
  },
  "sections": [
    {
      "id": "base-overview",
      "title": "Customer Base and Segmentation",
      "body": "Securonix's customer base concentrates in large regulated enterprises, financial services and banking, government, and organizations served through MSSP and MDR partners. The company reaches customers through a combination of direct enterprise sales and a growing channel motion, the latter reinforced by its 2026 CRN Security 100 placement. Vertical concentration skews toward compliance-heavy industries, exemplified by the banking customer Maveric Systems, where regulatory pressure and audit requirements justify a full security-operations platform. Securonix also claims five of the Global Fortune 10 as customers, a scale signal that is company-sourced and unverified. Adoption typically follows a phased trajectory, beginning with SIEM onboarding and expanding into UEBA, SOAR, and threat intelligence. Because Securonix does not publish a segment breakdown, customer-count, or logo-growth data, the segmentation here is reconstructed from case studies, independent reviews, and company claims rather than disclosed figures, which is the first material evidence limitation in this chapter.",
