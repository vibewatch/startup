        "FR003"
      ]
    },
    {
      "id": "financial-model",
      "title": "Financial, Dependency, and Governance Risk",
      "body": "Financial and governance risks center on opacity and control. Because Securonix is private and PE-backed, it discloses no audited financials, so revenue quality and margins cannot be verified, and undisclosed burn and runway leave financing risk unquantifiable from public data. Conflicting valuation markers—a $1 billion-plus unicorn status against lower secondary-market indications—create entry-pricing risk that must be reconciled against the cap table. Vista's sponsorship concentrates governance and control, which shapes strategy and, importantly, exit timing: investor liquidity depends on Vista's eventual sale or IPO decision. On dependencies, Securonix relies on AWS and Snowflake for infrastructure and data, creating concentration and single-point-of-failure resilience risk despite shared-responsibility controls, and on MSSP partners for a share of delivery. These risks compound: as the transmission map shows, bundling pressure can compress pricing, strain margins, reduce R&D capacity, and ultimately impair exit value, linking the competitive, financial, and governance threads into one connected exposure.",
