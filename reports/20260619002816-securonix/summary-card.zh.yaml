  topStrengths:
    - 连续六次入选 Gartner Magic Quadrant SIEM 领导者，Peer Insights 评分 4.7/5，并声称服务五家 Global Fortune 10 客户，验证了市场地位和买方满意度
    - >-
      云原生 Unified Defense 平台（SIEM + UEBA + SOAR + 威胁情报）拥有 700+ 集成，2026 AI 路线图包括 Agentic Mesh 和 Threat Research Agent，支撑
      land-and-expand 经济模型和产品整合叙事
    - $1.06B 融资（2022 年 Vista 领投 $1B+）、独角兽身份，以及 $10–12B 且持续扩张的 SIEM/SecOps 市场里 40% YoY 新 ARR 增长信号，说明合规和 AI 自动化需求具备耐久驱动
    - 2025 年 6 月收购 ThreatQuotient 后，平台延伸到外部威胁情报，扩大了旧式 SIEM 之外的预算池，也强化了整合叙事
  topRisks:
    - Microsoft Sentinel 的 E5 捆绑经济模型带来结构性、高概率的定价和替换压力；独立 best-of-breed 厂商不容易抵消，最终可实现倍数可能被压向熊市情景
    - 财务结构性不透明——经审计 ARR、毛利 / 经营利润率、NRR、cap-table 优先权和当前现金状况均未公开——让证据质量偏低，也把建议从确定买入改成等待管理层披露后的条件性判断
    - Vista 时期两次 CEO 更替、客户提到的上手和支持复杂度，以及未披露的 Vista 控制权和治理条款，都把执行和关键人风险抬到同阶段平台基线之上
  unresolvedGaps:
    - 经审计收入、准确当前 ARR 和增长轨迹、毛利率与经营利润率、NRR 均未公开；$126–167M 收入估算区间必须由管理层确认，投资论点才可落地
    - Cap-table 优先权栈、清算瀑布、Vista 控制和治理条款、当前现金与烧钱速度均未公开，少数股东回报和现金跑道无法验证
    - 客户集中度、精确 logo 数和留存队列数据未披露；“五家 Global Fortune 10”说法来自公司，保留来源里没有独立验证
    - ThreatQuotient 收购后的财务整合、IP 风险，以及任何未结诉讼或监管执法历史，保留来源未披露
