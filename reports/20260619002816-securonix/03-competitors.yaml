    {
      "id": "pricing-gtm",
      "title": "Pricing, Go-to-Market, and Distribution",
      "body": "Pricing and distribution are where Securonix faces the steepest structural disadvantage. Microsoft sells Sentinel on consumption pricing layered onto E5 bundles, which lowers the marginal cost of adopting Microsoft security tooling and makes it a frequent default choice. Splunk leverages a mature ecosystem and large installed base, while CrowdStrike and Palo Alto consolidate budgets through endpoint and platform franchises. Securonix counters with entitlement-based SaaS, a reported entry point near $67,000 per year, and DPM Flex elastic consumption aimed at predictable economics. Distribution power, however, clearly favors the mega-caps and Cisco through enterprise agreements and global channel networks. Securonix's CRN Security 100 placement signals channel credibility, and its SaaS/BYOC/MSSP flexibility supports a service-provider motion, but it must win on analytics value and total cost rather than default bundling. Buyers commonly multi-home, which both opens entry points and sustains incumbent presence.",
      "claimRefs": [
        "CP005",
