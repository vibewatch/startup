  "chapter": {
    "number": 4,
    "title": "Financial Analysis",
    "summary": "Securonix is a private, Vista-backed SaaS business with recurring subscription revenue estimated between roughly $126 million (2024 ARR, GetLatka) and $167 million (2026 revenue, Compworth), and company-disclosed 40% year-over-year new-ARR growth in fiscal 2024. It has raised approximately $1.06 billion cumulatively, anchored by the 2022 $1B+ Vista-led investment, and holds unicorn-level valuation, though markers conflict. The central financial limitation is opacity: no audited revenue, margin, cash, burn, or retention data is public, making every judgment directional pending management access."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue Model and Monetization",
      "body": "Securonix is a recurring-revenue SaaS business whose primary stream is subscription access to its Unified Defense SIEM platform. Monetization is entitlement-based rather than pure consumption, with a reported entry point near $67,000 per year that anchors mid-to-large enterprise deal economics rather than SMB. Beyond core subscriptions, the revenue mix spans an MSSP and MDR channel that resells multi-tenant deployments, a threat-intelligence stream strengthened by the 2025 ThreatQuotient acquisition, and attached professional services for onboarding and tuning. The company does not publish a segment revenue breakdown, so the mix is reconstructed from public materials and inferred where necessary. The strategic logic of entitlement pricing, reinforced by 2025's DPM Flex elastic-consumption option, is to offer predictable economics against the cost unpredictability buyers associate with consumption-based competitors, which supports both land-and-expand motion and net expansion through modules, data growth, and AI add-ons. Because revenue recognition for entitlement SaaS is ratable over the contract term, reported ARR and recognized revenue can diverge during periods of rapid bookings growth, a nuance that matters when reconciling the company's new-ARR growth claims with third-party revenue estimates.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI003",
        "CI004",
        "CI018",
        "CI023",
        "CI032"
      ],
      "tableRefs": [
