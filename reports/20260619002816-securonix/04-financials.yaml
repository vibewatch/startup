    {
      "id": "capital-adequacy",
      "title": "Capital Adequacy and Financing Dependency",
      "body": "On raised capital, Securonix looks well-funded: Tracxn reports cumulative funding of roughly $1.06 billion across five rounds, anchored by the more-than-$1 billion Vista-led growth investment of February 2022 with participation from Volition Capital and Eight Roads Ventures. WEF's 2024 unicorn-community recognition implies a valuation above $1 billion, though some databases reference a lower roughly $775 million marker tied to an earlier round, and a secondary-market indication near $2.86 per share adds uncertainty about current direction. These conflicting valuation markers require reconciliation in diligence. The genuine financing risk is not a shortage of historical capital but the complete absence of disclosed net cash, burn, and runway, which makes current capital adequacy unverifiable. The June 2025 ThreatQuotient acquisition shows the company is still deploying capital into expansion. Exit liquidity remains uncertain with an IPO speculated but untimed, leaving investors dependent on Vista's eventual exit decision.",
