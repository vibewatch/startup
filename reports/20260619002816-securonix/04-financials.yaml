    {
      "id": "traction",
      "title": "Public Traction Versus Private Reality",
      "body": "Public traction figures bracket Securonix's scale but are not company-confirmed. GetLatka estimates 2024 ARR near $126 million, while Compworth estimates 2026 annual revenue around $167 million, and the company itself disclosed forty percent year-over-year growth in new ARR sales for fiscal 2024. Taken together these data points imply a mid-hundreds-of-millions revenue business growing at a healthy double-digit rate, consistent with its Gartner Leader positioning and unicorn status. However, every one of these figures is either a third-party estimate or a selectively disclosed company metric, not an audited number. The revenue-quality story therefore rests on the recurring nature of SaaS plus credible growth signals, tempered by the absence of audited statements. For diligence, the priority is converting the $126-167 million estimate band into a confirmed revenue figure with a verifiable growth trajectory and margin profile.",
      "claimRefs": [
        "CI007",
