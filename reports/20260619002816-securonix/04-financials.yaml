    },
    {
      "id": "unit-economics",
      "title": "Unit Economics and Cost Structure",
      "body": "Unit economics are the weakest-evidenced part of the Securonix financial picture because the company is private and discloses almost no margin data. Gross margins are inferred to be SaaS-typical, in a roughly seventy to eighty percent band, but no source confirms cost of goods sold. The cost structure is dominated by research and development, cloud-delivery, and go-to-market spend, consistent with a growth-stage security software vendor, and continued 2026 product investment in ThreatWatch and the Threat Research Agent signals sustained R&D. Headcount estimates of roughly 645 to 658 employees in 2026 imply a sizeable fixed cost base. Critically, CAC, payback period, and net revenue retention are all undisclosed, so sales efficiency cannot be measured from public evidence. DPM Flex is positioned to protect gross margin against data-volume spikes, but its actual margin impact is unverified. The honest read is that the economics look structurally healthy yet remain unproven without management data.",
      "claimRefs": [
        "CI005",
        "CI006",
