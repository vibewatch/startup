companyProfile:
  summary: "Securonix is a private, cloud-native cybersecurity company founded in 2008 and headquartered in Addison, Texas. Backed by Vista Equity Partners following a $1B+ growth investment in February 2022, it now positions as a Unified Defense SIEM vendor combining SIEM detection, UEBA, SOAR, and AI-driven threat intelligence in a single security-operations platform. Under CEO Kash Shaikh, the company pursues an AI-forward 2026 roadmap—headlined by Agentic Mesh, SAM, and a Threat Research Agent—and strengthened its external threat-intelligence capability through the June 2025 ThreatQuotient acquisition. Its customer base centers on large regulated enterprises, financial services firms, government agencies, and MSSP/MDR partners, with WEF unicorn-community recognition in January 2024."
  foundedDate: "2008-01-01"
  foundingLocation: null
  headquarters: "Addison, Texas"
  productSummary: "Cloud-native Unified Defense SIEM platform with SIEM detection, UEBA, SOAR, threat intelligence (ThreatQuotient-powered), and AI analyst workflows; 700+ integrations; MITRE ATT&CK-aligned; deployable via SaaS, BYOC, or MSSP; DPM Flex for elastic data-consumption cost control"
  customerFocus: "Large regulated enterprises, financial services and banking organizations, government agencies, and MSSP/MDR-served mid-market customers requiring compliance-grade security operations"
  businessModel: "SaaS subscription (entitlement-based) for the Unified Defense SIEM platform; augmented by MSSP/MDR channel resell, threat-intelligence modules, and attached professional services; DPM Flex provides an elastic add-on to manage data-volume costs"
  stage: "Late-stage private / PE-backed (Vista Equity Partners)"
  fundingStatus: "$1.06B total raised across five rounds; anchored by a February 2022 $1B+ Vista Equity Partners-led growth investment with Volition Capital and Eight Roads; WEF unicorn-community member since January 2024; no new disclosed round post-2022"
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO010, CO011, CO012, CO015, CI001, CI007]
