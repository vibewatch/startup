  topStrengths:
    - >-
      Six-time Gartner Magic Quadrant Leader for SIEM with a 4.7/5 Peer Insights rating and claimed five Global Fortune
      10 customers validate market standing and buyer satisfaction
    - >-
      Cloud-native Unified Defense platform (SIEM + UEBA + SOAR + threat intelligence) with 700+ integrations and an
      AI-forward 2026 roadmap—including Agentic Mesh and a Threat Research Agent—supports land-and-expand economics and
      product consolidation thesis
    - >-
      $1.06B raised (Vista-led $1B+ in 2022), unicorn status, and 40% YoY new-ARR growth signal in a $10–12B expanding
      SIEM/SecOps market with durable compliance and AI-automation demand drivers
    - >-
      ThreatQuotient acquisition (June 2025) extends the platform into external threat intelligence, widening the
      addressable budget beyond legacy SIEM and reinforcing the consolidation narrative
  topRisks:
    - >-
      Microsoft Sentinel E5 bundling economics create structural, high-likelihood pricing and displacement pressure that
      an independent best-of-breed vendor cannot easily offset and that could compress achievable multiples toward the
      bear case
    - >-
      Structural financial opacity—no audited ARR, gross/operating margins, NRR, cap-table preferences, or current cash
      position are public—keeps evidence quality low and converts the recommendation from committed to conditional
      pending management disclosure
    - >-
      Two CEO transitions during the Vista era, customer-cited onboarding and support complexity, and undisclosed Vista
      control and governance terms raise execution and key-person risk above the baseline for a platform at this stage
  unresolvedGaps:
    - >-
      Audited revenue, exact current ARR and growth trajectory, gross and operating margins, and NRR are not publicly
      disclosed; the $126–167M revenue estimate band must be confirmed from management before thesis is committable
    - >-
      Cap-table preference stack, liquidation waterfall, Vista control and governance terms, and current cash and burn
      rate are not public, making minority-return and runway calculations unverifiable
    - >-
      Customer concentration, exact logo count, and retention cohort data are not disclosed; the 'five of Global Fortune
      10' claim is company-sourced and unverified by any independent source in the retained set
    - >-
      Post-ThreatQuotient-acquisition financial integration, IP risk, and any outstanding litigation or regulatory
      enforcement history are not disclosed in retained sources
