    {
      "id": "scenarios",
      "title": "Scenarios, Sensitivity, and Valuation Range",
      "body": "The valuation scenarios translate the thesis and comps into ranges. The base case applies roughly 6-8x to about $167 million of revenue for a ~$1.0-1.5 billion valuation, reflecting category leadership offset by bundling pressure; the bull case applies roughly 8-10x to $200 million-plus forward ARR for about $2 billion if AI momentum and net retention accelerate; and the bear case applies roughly 3x to $167 million for about $500 million if displacement and execution drag compress the multiple. A reasonable probability weighting is approximately 50% base, 25% bull, and 25% bear, which centers probability-weighted value modestly above the base case. The implied valuation range therefore spans roughly $0.5 billion to $2 billion. Sensitivity analysis shows the applied multiple is the dominant value driver, followed by the ARR level and then growth and retention assumptions—each turn of the multiple on ~$167 million moves valuation by roughly $167 million. This sensitivity is precisely why revenue quality and the bundling-driven multiple risk are the variables that most warrant confirmation before pricing.",
