    {
      "id": "recommendation",
      "title": "Recommendation, Triggers, and Final Diligence Asks",
      "body": "The recommendation is a conditional, valuation-disciplined positive stance with medium confidence and a medium risk rating: enter at or below the ~$1.0-1.5 billion base range, where the bull/bear spread offers favorable asymmetry. The recommendation logic chains from category leadership and customer proof, through market and execution risk, to a disciplined valuation conclusion, and the IC KPI view scores market and product highest, proof and economics in the middle, and evidence quality lowest given financial opacity. The thesis-break and kill triggers that would most clearly invalidate the case are ARR deceleration below market, accelerating Microsoft displacement, a material security breach, or discovery of a preference-heavy cap table that erodes minority returns. Final diligence asks are therefore concrete and gating: audited financials, exact current ARR and growth, gross and operating margins, cap-table preference and control terms, and customer-concentration data. Confirming these converts the conditional recommendation into a committable one; failing to confirm them, or finding adverse answers, should trigger repricing toward the bear case or a pass. On balance, the asymmetry favors disciplined participation.",
