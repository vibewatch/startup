      "id": "comparables",
      "title": "Comparable Set and Exit Pathways",
      "body": "The comparable set bounds the valuation from premium to floor. At the premium end, CrowdStrike trades near 24.7x EV/Revenue and Palo Alto near 11x, while SentinelOne offers a mid-range public reference; at the floor, legacy SIEM vendors trade at roughly 1.7-5x. The most relevant strategic benchmark is Cisco's roughly $28 billion acquisition of Splunk at about 7-9x revenue, and next-gen SIEM peers trade in a roughly 5-10x forward-revenue band per the Windsor Drake analysis. With cybersecurity M&A reaching about $96 billion in 2025, a strategic acquisition is a credible near-term exit pathway, with IPO optionality dependent on scale and market windows. Securonix should not earn the hyperscaler-growth multiples of CrowdStrike, but its leadership, recurring revenue, and AI roadmap justify a position above the legacy floor and within the next-gen peer band—supporting the 6-8x base case. The comparable table is explicitly partial: it spans public comps and a strategic M&A benchmark but cannot incorporate undisclosed private rounds, which remains a confirmation item for diligence.",
