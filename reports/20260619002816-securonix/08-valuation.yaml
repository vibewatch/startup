    {
      "id": "financing-entry",
      "title": "Financing Context and Entry Discipline",
      "body": "Securonix's financing history anchors the valuation conversation. The 2022 Vista-led investment exceeded $1 billion, cumulative funding is about $1.06 billion across five rounds, and the company was recognized in the 2024 cybersecurity unicorn community, together establishing a $1 billion-plus prior valuation marker. Against that, secondary-market indications near $2.86 per share imply a softer mark than the headline unicorn figure, creating genuine entry-pricing tension that must be reconciled. Entry discipline accordingly requires three things: reconciling the unicorn marker against revenue multiples on roughly $126-167 million of estimated revenue, understanding any liquidation preferences and control terms that would alter minority-investor economics, and avoiding overpayment relative to the disclosed comparable band. The conflicting markers—unicorn status versus secondary indications—are not a disqualifier but a clear instruction to price conservatively and to make preference review a gating diligence item. Because the company is private and PE-backed, the actual current primary valuation is undisclosed, so the discipline is to anchor entry at or below the base-case range and to treat the cap table as a material unknown until confirmed.",
