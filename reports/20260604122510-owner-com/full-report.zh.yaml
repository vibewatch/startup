companyProfile:
  summary: |
    Owner.com 是一家创始人主导的私营餐厅软件公司，面向独立餐厅销售一套有明确主张的增长工具栈。平台把 AI 优化网站、一方在线点餐、
    会员、CRM、自动化营销、品牌移动应用、分析以及相邻运营工具打包成月度订阅产品，目标是降低餐厅对外卖平台和其他碎片化供应商的依赖。
    公开证据显示，公司 2018 年开始运营，2020 年完成法律实体化，目前位于加利福尼亚州 Palo Alto。到 2025-2026 年，公司和投资人公开材料称
    Owner 服务超过 10,000 家餐厅和数千万终端用户，2025 年 5 月 Series C 将公司估值推至 $1 billion。
