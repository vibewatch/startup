      - number: '4.3'
        title: 单位经济性、毛利驱动和公开基准区间
        blocks:
          - type: paragraph
            body: >-
              Owner 的案例研究展示了一个一致的经济模式：直接线上销售上升，客单价经常提高，Google 带来的需求改善，品牌 app 加深复购，第三方佣金流失下降。Metro Pizza、Township Line
              Pizza、Rig A’ Tony’s、Talkin’ Tacos、Mattenga’s、Ashley’s Cafe 和 Karv 都报告了销售提升、费用节省或更好流量捕获的某种组合。这是产品能创造餐厅层面
              ROI 的有用证据。但餐厅层面的 ROI 不等于 Owner 公司层面的单位经济性。公开层面仍没有披露 ARR、毛利率、CAC 回本、贡献利润率或烧钱速度。


              公开可比公司说明了为什么缺失的收入结构重要。Olo 展示了相对软件主导的餐厅平台经济性：53% GAAP 毛利率、115% NRR、三年以上合同，以及一个仍只有约 45.5% 订阅收入和 54.5%
              交易收入的结构。Toast 展示了更大集成平台的经济性，软件、金融科技和硬件仍能产生强经常性毛利和自由现金流，但前提是规模大得多。Owner 可能位于这两极之间。它的订阅定价、SEO
              引擎和内容驱动获客像软件，但配送支持、上手、拒付保护以及 POS / 店内扩张可能把毛利拉向更重服务的形态。因此，毛利路径仍是尽调事项，不是公开结论。
