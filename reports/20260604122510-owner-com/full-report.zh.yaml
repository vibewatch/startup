  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入分母
        - 已确认收入、ARR、增长率，以及按订阅、支付、营销和 AI 产品拆分的收入结构。
        - 核心估值问题是，当前分母更接近公开可比公司的支撑区间，还是远低于该区间。
        - CFO 材料包、董事会材料和经审计的收入桥。
      - - 留存和流失
        - NRR、总留存、客户流失，以及按队列和餐厅规模拆分的关店驱动流失。
        - Owner 的 SMB 暴露是可控还是致命，取决于留存质量。
        - 队列材料、流失瀑布图和按队列选取的客户访谈。
      - - 毛利率和抽成率
        - 按产品线拆分的毛利率、支付经济性，以及订单相关费用的混合抽成率。
        - 仅靠公开定价，无法判断增长是否转化为软件式经济性。
        - 财务尽调，叠加支付处理和单位经济性复查。
      - - 股权结构表和优先权
        - Series C 优先股堆叠、清算权、老股 / 普通股拆分，以及任何棘轮或 MFN 条款。
        - 名义上的独角兽价格可能掩盖新投资者弱得多的经济性。
        - 律师复查融资文件和股权结构表模型。
      - - 竞争持久性
        - 相对 Toast、Square、DoorDash、BentoBox、Popmenu 和 Olo 的赢单率，以及 POS 集成可靠性。
        - 如果 Owner 只在简单案例中赢，或输在实施上，投资逻辑会迅速走弱。
        - 销售赢 / 输分析、集成指标和参考客户访谈。
    notes: 如果这些问题不能被有说服力地回答，正确决策是继续跟踪公司，而不是在价格上硬撑。
    claimRefs:
      - CV007
      - CV009
      - CV010
