      - number: '7.3'
        title: 支持、集成和数据卫生是最快触发流失的运营失效点
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Owner 面临一体化垂直栈的典型扩张问题：每增加一个产品面，就能减少餐厅的供应商拼图，但也增加了支持和集成失败伤害留存的路径。独立评论网站对结果整体偏正面，但负面评论具体且相关。Capterra
              评论提到服务差、打印机 / POS 排障、意外产品变化，以及支持团队有时需要升级产品问题。Software Advice 评论提到 Stripe 欺诈防控漏判，以及与部分 POS 系统缺乏集成。Sauce
              的评论摘要标出 Clover 问题、受第三方网络约束的配送半径限制，以及多门店定制能力有限。单看这些问题并不致命，但它们很重要，因为 Owner
              合同按月执行，产品又承载面向客户的点餐流、营销、会员，以及部分情况下的配送和 POS。餐厅利润率很薄，不会长期消化上线摩擦或高峰期错误。Owner
              自己的产品设计还会放大运营负担：POS、网站、App、邮件、短信和配送数据流本应共享一份客户名单和一个营销引擎，所以脏数据、同步失败或同意管理失误可能跨多个渠道扩散，而不是停留在单点。
