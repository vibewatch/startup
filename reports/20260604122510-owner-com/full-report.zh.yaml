        title: 融资背景，以及公开证据是否支撑价格
        blocks:
          - type: paragraph
            body: >-
              公开证据清楚确认了融资头条事实：Owner 于 2025 年 5 月完成 $120 million Series C，估值 $1 billion，由 Meritech 和 Headline
              共同领投。公开证据没有确认的，恰恰是承保最关键的部分：当前收入分母、订阅费与交易挂钩费用的结构、毛利率结构，以及 Series C 后真实的股权结构经济性。这个缺口重要，因为保留下来的公开可比公司集合约以
              1.7x-5.6x TTM 收入交易，中位数接近 3.4x。按这个口径，即便套用最高的公开可比倍数，$1 billion 估值也意味着大约 $179 million 收入；按中位数则约为 $294
              million。Owner 自己公开的定价和餐厅数披露不能否定这些水平，但也没有证明它们。公司服务超过 10,000 家餐厅，公开价格卡为每月 $249 到
              $499，外加部分订单挂钩费用；投资人需要通过尽调证明，支付、营销、AI 和扩张收入已经足够大，能够补上这道缺口。
