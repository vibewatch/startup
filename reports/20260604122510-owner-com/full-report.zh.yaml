      - number: '5.2'
        title: 运营模式：发现、点餐、会员、app、营销和电话都回流到同一客人记录
        blocks:
          - type: paragraph
            body: >
              公开运营模式比底层技术架构更清楚。Owner 的工作流页面展示了一个漏斗：从 SEO 和网站流量开始，把流量转化为直接网页订单，再通过会员、客人列表增长、app 安装、邮件和 SMS 活动、推送通知以及 AI
              辅助电话点餐，把食客留在餐厅自有渠道内。各页面的逻辑一致：每个直接订单或来电都应变成结构化客人数据，每个已识别客人都应能通过多个自有渠道触达，每个渠道都应推动下一次复购，而不是把需求交还给 DoorDash 或
              Uber Eats。POS 页面把这个循环延伸到店内，声称可在结账时捕获客人电话、自动发送 app 邀请，并在店内、线上和外卖订单之间共享会员。帮助中心文档提供了具体证据，说明这不只是首页话术：Owner
              暴露了客人列表导入、特定会员默认设置、Clover 工作流拆分、DoorDash 平台映射、POS 支付方式和四种原生 POS 报表。Apple 和 Google
              应用列表进一步独立佐证，说明已有一款面向经营者的实时移动 app，用于订单、菜单编辑、营业时间变更、退款和提醒。
