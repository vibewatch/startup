  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 隐含股权价值
      - 相对 $1B 入场的含义
    rows:
      - - 乐观
        - 尽调证明 Owner 已有大约 $180M-$250M 收入支撑、强留存、健康毛利率，且股权结构条款给新资金留下真实经济收益。
        - 按 7x-10x 收入给溢价，前提是 SMB 商业领导地位可持续，AI / 增长工具继续被采用。
        - $1.3B-$2.5B
        - 大约 1.3x-2.5x 毛回报；公司不错，但除非执行极其出色，否则仍达不到经典顶级 VC 回报。
      - - 基准
        - 尽调支持有意义增长，但显示收入基数较小、SMB 流失正常，利润率也没有异常亮点。
        - 按 4x-6x 收入估值，遵循公开市场式餐饮科技 / 商业软件纪律。
        - $0.6B-$1.2B
        - 约 0.6x-1.2x 毛回报；只有入场条款显著改善时才可接受。
      - - 悲观
        - 收入远低于公开市场支撑阈值，流失维持高位，宏观压力伤害餐厅生存和点单量。
        - 倍数压缩且增长质量较低，按 2x-4x 收入估值。
        - $0.25B-$0.6B
        - 大约 0.25x-0.6x 毛回报；资本减值风险真实存在。
      - - 回报门槛
        - 若不计稀释，想从 $1B 入场价拿到 3x-5x 毛回报，Owner 最终必须以约 $3B-$5B+ 退出。
        - 简单的入场到退出桥，不含稀释和优先权。
        - $3.0B-$5.0B+
        - 今天的公开证据无法证明这条路径。
    notes: 情景有意写成取决于尽调的区间，因为公开记录没有披露当前收入分母。因此，假设聚焦私有尽调需要验证什么。
