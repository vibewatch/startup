      - number: '7.4'
        title: Owner 仍依赖那些它声称帮助餐厅摆脱的平台和更大对手
        blocks:
          - type: paragraph
            body: >-
              Owner 最强的商业叙事是帮餐厅拥有直接需求，而不是向平台租用需求；但这套叙事仍高度依赖第三方平台。Stripe 处理卡支付。Owner 的餐厅协议预设第三方支付处理商和 Delivery
              Partners，Sauce 的产品评论则描述了原生 Square/Clover 连接，以及通过 Otter 接入 Toast。获客发现绑在 Google Search 和 Maps 上。品牌 App 依赖
              Apple 和 Google 的分发规则。竞争者也很强。DoorDash 的 2024 10-K 称，其 Commerce Platform 帮助商户在自有渠道建立在线点餐、品牌移动 App 和客户支持——这与
              Owner 的价值主张直接重叠。Toast 的 2025 年报提示，餐厅软件市场竞争激烈，存在折扣定价、支付处理依赖，以及 SMB 餐厅在下行周期中特别脆弱。正因为如此，尽管 Owner
              卖给很多商户，客户集中度仍然重要：独立餐厅仍是市场中结构更弱的一端。Prime/Enigma 数据显示，10+ 门店的连锁拿走了行业 GPV 的多数，而单店经营者拿到的不到三分之一。如果 Google
              调整商家资料规则，App 审核延迟，Stripe 经济性收紧，集成伙伴出问题，或更大对手捆绑更多功能，Owner 很难绕开这些冲击，除非承担更高支持成本或利润率压力。
