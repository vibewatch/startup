  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图：Owner 卖的是闭环餐厅增长栈，不是单一在线点餐组件
        blocks:
          - type: paragraph
            body: >
              Owner 自己的顶层页面一直把公司定位为独立餐厅的数字运营栈。首页、定价页和 "how it works" 流程共同描述了一个系统：从 Google
              发现开始，把流量导入标准化餐厅网站和在线点餐体验，捕获客人身份，再把食客推入会员、app 和自动化营销循环，以增加直接复购订单。产品地图现在覆盖发现工具（网站、SEO、自动化 SEO
              页面）、交易触点（在线点餐、宴会餐、平台同步、Owner POS、平板）、客人留存层（会员、客人列表、品牌
              app、邮件、SMS、推送）以及经营者工具（报表、移动指挥中心、菜单和营业时间控制、退款、厨房工作流）。这种宽度重要，因为 Owner
              的主要承诺是经济性的，不是美观：替代断裂工具，减少第三方流失，同时把每个订单渠道都转化为餐厅的一方数据。公开证据还显示，Owner
              有意用广泛定制换取速度和可重复结果。网站产品明确说销售优先于设计自由，发布速度以天或周计，而不是定制构建周期。
