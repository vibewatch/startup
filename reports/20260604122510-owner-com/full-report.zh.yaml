              公开采用故事显示营收上限扩张清晰，但活跃使用分母偏薄。2023 年 10 月，Adam Guild 的 Restaurant Unstoppable 播客简介称 Owner 服务超过 1,000 家餐厅。到
              2024 年初，TechCrunch 称公司在前一年增长三倍后已有数千客户，Owner 的 Series B 备忘录称超过 2,000 家餐厅和超过 3 million 名餐厅顾客在过去三年使用过产品。到
              2025 年 Series C 备忘录和 Restaurant Business Online 报道，足迹已扩大到 10,000+ 家餐厅和 60 million+ 名消费者。经营者侧也有使用代理指标：Owner
              App 明确只面向当前客户，截至本运行日期，在 App Store 有 933 个评分、评分 4.8。问题在于分母质量。公开材料混用了餐厅、消费者、网站流量、app
