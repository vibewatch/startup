        - 减少第三方平台费用漏损，提升直接下单转化
        - Talkin Tacos、Metro Pizza、Gyro Concept、HillCrust、San Diego Kabob Shack 等餐厅
        - 未披露 QSR 相对全服务餐厅的 GMV 占比
      - - 全服务餐厅、咖啡馆和简餐店
        - 买方=老板或经理；用户=前厅员工和顾客
        - 可见，但不如 QSR 占主导
        - 捕获到店客流、简化下单、推动复购
        - Ashley’s Cafe、Doo-Dah Diner、Saffron、Rig A’ Tony’s 等餐厅
        - 公开材料未区分堂食为主和外卖为主的账户
