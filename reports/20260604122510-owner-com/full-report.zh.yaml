              耐久性是公开记录中最重要的未解问题。Owner 提供了清晰的复购机制：产品组合把餐厅推向自有域名点餐、品牌 app、会员、自动化邮件和短信活动，以及客人数据捕获。产品页面称，移动 app 带来约 2x 复购率或
              85% 更多复购订单；具名案例研究也反复提到会员注册、复购或更大可触达受众。独立评论表面方向上也正面，包括较强 Capterra 分数和有大量评分基础的经营者 app。一些评论还暗示任期不短：Capterra
              包含一位餐厅客户称自己已与 Owner 合作超过两年。尽管如此，已审阅公开来源没有披露 NRR、GRR、logo
              流失、续约率、合同期限分布或按细分市场划分的队列留存。因此，公开记录支持一个可信的耐久机制和健康满意度代理指标，但还不足以建立可投资的留存模型。做尽调时，缺失的续约数学比再多一条成功故事引语更重要。
