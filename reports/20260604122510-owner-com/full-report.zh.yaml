      - number: '3.3'
        title: 切换成本、多栖使用和分发权力
        blocks:
          - type: paragraph
            body: >-
              这个格局里的切换成本并不均匀。POS 和支付既有巨头拥有最深锁定，因为它们控制卡网络路径、硬件、线下运营、排班工作流和日常交易历史。这让 Toast、Square 和 SpotOn 拥有比 Owner.com
              网站和 CRM 层更强的楔子，即便 Owner 的前端体验有竞争力。与此同时，这个品类高度多栖。ChowNow 明确帮助餐厅整合一方和第三方订单；Square 让店内、线上和跨渠道订单保持连接；SpotOn
              同时支持一方点餐和主要平台聚合器。这些模式意味着，餐厅往往可以保留现有 POS，只替换增长层，从而让 Owner.com 的锁定更软，但也降低了采用门槛。分发权力甚至比切换成本更有决定性。Toast
              的装机基础、Square 的自助上手和透明定价、SpotOn 的支付驱动经济性、Olo 的集成伙伴网络，以及 DoorDash 的 Marketplace
              交叉销售，都能创造独立供应商很难匹配的更低获客成本。Owner.com 的迁移支持是有意义的制衡，但无法抵消已经拥有收银、支付或高流量需求渠道所带来的装机基础优势。
