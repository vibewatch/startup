      - number: '1.2'
        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              Owner 仍明显由创始人主导。Adam Guild 是联合创始人兼 CEO，Dean Bloembergen 是联合创始人兼 CTO，公司的公开叙事仍高度围绕 Guild
              的起源故事、产品理念和投资人关系展开。当前公开领导团队已经不止两位创始人：Rob Lehman 任 President and COO，Will Hauser 任 CFO，Kyle Norton 任
              CRO，Wyatt Ozmore 任 CMO，Quenton Cook 任 CPO，Tina Glickman 负责合作伙伴。治理也更职业化。Owner 的公开董事会现在包括 Guild，以及投资人 Jack
              Altman、Shalini Rao、Jason Lemkin、Alex Kurland 和 Alex
              Bard，说明董事会既包含创始人，也高度集中于投资人。没有公开的信息同样重要：已审阅来源没有披露委员会结构、观察员权利、投票控制或股权类别经济条款。公开材料还显示财务负责人发生过交接。2024 年 1 月
              Series B 备忘录称 Owner 刚聘请 Josh Brown 担任 CFO，而当前领导层页面列出 CFO 为 Will
              Hauser，暗示财务席位有一次重要但未充分解释的交接。这个组合让创始人连续性成为优势，但也让治理尽调仍未完成。
