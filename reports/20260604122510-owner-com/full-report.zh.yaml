  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Toast
        - 市值 / TTM 收入
        - 倍数：$14.54B / $6.44B = ~2.26x
        - 最大的餐饮软件基准，拥有 171K 个门店、$204B GPV，并披露 ARR / 收入机制。
        - 规模大得多、业务更多元且已上市；不是完全同类的 SMB 增长层业务。
      - - Olo
        - 市值 / TTM 收入
        - 倍数：$1.74B / $0.31B = ~5.61x
        - 保留可比组中最相关的纯数字点单 / 餐饮 SaaS 上市倍数。
        - 规模更小，客户组合不同；当前市值参考点是 2025 年 10 月，而非 2026 年 6 月。
      - - Block / Square
        - 市值 / TTM 收入
        - 倍数：$41.54B / $24.47B = ~1.70x
        - 对餐饮赋能商业、支付和卖家工具来说，是有用的下限可比对象。
        - Block 远比餐饮科技宽得多，因此该倍数混合了大量非餐饮业务。
      - - DoorDash
        - 市值 / TTM 收入
        - 倍数：$67.35B / $14.72B = ~4.58x
        - Commerce Platform 使其成为直营点单基础设施和商户商业工具的有用可比对象。
        - 市场平台经济性和全球规模与 Owner 聚焦 SMB 的 SaaS 模型存在实质差异。
      - - SevenRooms（被 DoorDash 收购）
        - 战略并购参考
        - 2025 年 6 月收购价值 $1.152B
        - 显示战略买家愿意为具备商户邻接性的餐饮 CRM / 预订 / 增长软件支付大额价格。
        - 并购价值包含协同和控制权溢价，因此不是干净的交易倍数。
      - - Popmenu
        - 私募融资里程碑
        - 2021 年 $65M Series C；披露 5,000+ 个餐厅门店
        - 相关的私有餐饮科技 SaaS 可比对象，定位是一体化点单和营销。
        - 本处保留的公开来源未披露估值，因此它是融资参考，而不是定价锚。
    notes: 本组有意限定在最能直接影响 Owner 承销判断的公开和准公开参考：规模化上市餐饮商业平台、一个邻近战略收购，以及一轮私有餐饮科技融资。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful public comps and transaction references that were fetchable in this
        run. It is not exhaustive because several private-company valuation databases were access-restricted.
    claimRefs:
