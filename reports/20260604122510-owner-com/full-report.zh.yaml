      - - 免佣金直营点餐经济性
        - DoorDash Online Ordering 和 GloriaFood 用免佣金或零费用替代品压缩价格伞
        - 高
        - 对照最便宜且可信的替代品，验证扣除支付、配送和支持成本后的 Owner.com 净经济性
      - - SEO + 品牌 App + AI 营销差异化
        - Popmenu、ChowNow、Square 和 SpotOn 都在推类似的顾客增长模块
        - 高
        - 索取队列级证据，证明 Owner.com 自动化带来的复购或 CAC 表现优于同行
      - - 代办式迁移和上线
        - Square 的自助上线和拼装式替代方案，降低了高接触切换的必要性
        - 中
        - 衡量迁移支持相对低接触竞争对手，是否实质提升成交率或留存
      - - 客户数据和复购闭环
        - 多归属让餐厅保留 POS、替换点餐层，限制硬锁定
        - 中
        - 按 POS 集成审查客户留存，并测试取消服务时顾客数据的可携带性
      - - 逐步进入更大型连锁
        - Olo 和 Lunchbox 已经占住企业级叙事，并有更强集成或渠道优势
        - 中
        - 厘清 Owner.com 是要继续聚焦 SMB，还是能在不牺牲简单性的前提下可信地上探市场
      - - 私营厂商敏捷性
        - 上市公司披露加上更大的邻近商业生态，可能让 Toast、Square、Olo、Block、DoorDash 或 Shift4 在大买家眼里更耐久
        - 中
        - 评估 Owner.com 能否用经营者背书、实施速度和可衡量 ROI，抵消披露和资产负债表差距
    enumerationScope:
