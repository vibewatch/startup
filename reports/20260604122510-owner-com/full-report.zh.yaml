      - number: '2.2'
        title: 买方分层、用户和预算归属
        blocks:
          - type: paragraph
            body: >-
              Owner.com 最清晰的买方，是希望拥有数字门店和客人关系、又不想承担企业连锁式技术栈的独立餐厅。公开竞品页面展示了分层地图。Square 明确瞄准单店和多门店餐厅；Toast
              覆盖点餐、支付和会员，构成更宽的餐厅操作系统；Olo 更偏高端市场，提供企业级点餐、支付和客人互动；Popmenu 和 BentoBox
              则更紧贴自有点餐、餐厅网站、营销和会员。对单店独立餐厅而言，买方和付款方通常是 owner-operator
              或总经理，员工和食客是主要用户。经营者增加门店后，预算权会分散到运营、营销和财务。公开定价也说明，这是适合 SMB 的软件预算，不是 ERP 级采购：Popmenu 发布的月度档位为 $179 到
              $499，Square 则主打易上手和免费试用，而不是沉重的前期承诺。采用路径通常从利润率或获客痛点开始，然后扩展到自有点餐、客人数据捕获、SMS 和邮件营销、会员，最终走向品牌 app
              或更深集成。这一分层很重要，因为 Owner.com 争夺的是同时带有运营属性、营销主导且对 ROI 敏感的预算。
