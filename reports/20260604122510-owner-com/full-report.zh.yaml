        - POS、集成支付、第一方点餐、忠诚度、营销、用工、仪表盘
        - 餐饮垂直套件，在线点餐免佣金
        - 全包方案把经济性绑在支付处理和最低期限上
      - - ChowNow
        - 直接同业
        - 私有公司；公开定价聚焦独立餐厅
        - 独立餐厅
        - 直接点餐、品牌 App、营销、忠诚度、聚合、配送管理
        - 主打免佣金直订，同时有发现 / 分发层
        - 仍收设置费和交易费；缺少深 POS 锁定
      - - Popmenu
        - 直接同业
        - 供应商页面显示 10,000+ 家餐厅
        - 独立餐厅和 SMB 多门店集团
        - 网站、在线点餐、AI 电话、邮件 / SMS 营销、评论、预订 / 候位
        - 规模化、营销牵引的竞争者，获客叙事强
        - POS / 支付不是原生控制点；忠诚度仍标注为即将上线
      - - BentoBox
        - 相邻直接同业
        - 私有公司；引用页面未披露当前规模 / 融资
        - 优先做网站商业化和面向客人模块的餐厅
        - 网站、外带和配送、活动、预订、食客数据采集
        - 商业化牵引的网站阵地，叠加模块化插件
        - 引用页面未披露公开定价
      - - Olo
