  - id: TV005
    title: 投资逻辑破裂与终止触发信号表
    columns:
      - 触发信号
      - 阈值
      - 传导到投资逻辑
      - 行动含义
    rows:
      - - 收入支撑失败
        - 尽调无法证明至少大约 $180M-$250M 收入支撑，或明显更优的利润率。
        - 公开可比公司桥始终无法闭合，因此 $1B 标记仍难以支撑。
        - 不按上一轮价格投资。
      - - 留存质量令人失望
        - NRR 和队列数据显示 SMB 流失压过扩张。
        - 客户流失抵消产品胜利，复利逻辑破裂。
        - 用更低倍数和更慢增长重新切估值。
      - - 餐厅关店持续
        - 到 2026 年，餐厅关店暴露仍是流失的重要驱动因素。
        - 终端市场脆弱，降低对长期现金流扩张的信心。
        - 下调情景权重，并要求更好条款。
      - - 竞争或法律压力加剧
        - 竞争对手主张、集成摩擦或竞争性 CAC 压力恶化。
        - Owner 作为最佳直营需求层的定位持久性变弱。
        - 暂停，直到市场份额或产品留存数据改善。
      - - 融资条款对投资者不友好
        - 优先权、棘轮或偏重老股的经济安排，削弱新资金的真实上行。
        - 名义估值不再匹配可投资经济性。
        - 等待更干净条款或重置后的入场点。
    notes: 这些是估值触发信号，不是通用公司风险。每一项都会直接降低 $1 billion 入场价复利成有吸引力结果的概率。
    claimRefs:
