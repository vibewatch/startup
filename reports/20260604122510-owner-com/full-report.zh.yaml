  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 投资逻辑
      - 哪些情况会改变判断
    rows:
      - - 结构性市场需求
        - 独立餐厅越来越需要自有数字需求工具，用来抵消配送费和连锁餐厅技术优势。
        - 如果直营点单采用停滞，或餐厅关店率维持高位，TAM 兑现会比本备忘录暗示的弱得多。
      - - 产品架构
        - Owner 把网站、忠诚度、SEO 和 AI 栈做成有主张的一体化方案，可能比碎片化单点工具更适合非技术经营者。
        - 如果经营者更看重定制而非效果，或集成持续脆弱，产品优势会收窄。
      - - 客户证明
        - 评论和案例研究显示，部分餐厅报告销售增长更快、第三方费用更低、复购活动更高。
        - 如果这些胜利高度筛选，而更广泛队列留存或 ROI 偏弱，增长故事就被夸大了。
      - - 竞争
        - Owner 可以作为增长层与 Toast、Square 和 Clover 共存，而不是完整替代 POS。
        - DoorDash、Olo、Toast、Square、Lightspeed、Popmenu、BentoBox 等都在争夺同一笔数字点单预算。
      - - 价格支撑
        - 稀缺的 SMB 商业赢家可以配得上溢价倍数。
        - 除非 Owner 实际收入已经远高于公开证据所示，否则公开可比公司仍集中在远低于 $1 billion 标记隐含支撑区间的位置。
    notes: 反向逻辑聚焦分母和持久性风险，而不是质疑产品是否解决真实问题。公司可以是好公司，但当前价格仍然难以辩护。
