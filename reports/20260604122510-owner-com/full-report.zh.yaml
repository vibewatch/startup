          description: 顾客通过会员、App 复购、已保存数据、推送通知和自动化营销活动，直接回到餐厅自有渠道。
          channels:
            - 会员
            - 品牌 App
            - 邮件 / SMS
            - 推送
        - id: expand
          label: 扩张
          actor: 餐厅业主集团
          description: 跑通后的客户会在整个餐厅集团内扩展到 POS、多门店部署、更多 SEO 内容，以及更多顾客营销自动化。
          channels:
            - POS
            - 多门店
            - SEO
            - 分析
    claimRefs:
      - CU002
      - CU003
      - CU018
      - CU020
      - CU023
      - CU028
      - CU038
      - CU042
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据在漏斗顶部的账户数量最强；到漏斗底部，本应出现活跃队列和留存，证据最弱。
    data:
      items:
        - label: 认知 / 入站需求
          value: 100
          description: Owner 称 70%+ 客户来自主动咨询，意味着漏斗顶部有较强的内容与品牌拉动。
        - label: 已签约餐厅账户
          value: 72
          description: 公开里程碑从 2023 年 1,000+ 家餐厅，提升到 2024 年初 2,000+ 家，再到 2025 年 10,000+ 家。
        - label: 消费者触达面
          value: 45
          description: 公开的消费者里程碑从此前 3 年 3,000,000 名餐厅顾客，提升到 Series C 备忘录中的 60,000,000+ 名消费者。
        - label: 复购行为加深
          value: 18
          description: 案例研究和产品页展示了再次下单、会员注册、App 安装和到店顾客捕获，但没有真正的留存队列。
        - label: 经审计的留存披露
          value: 4
          description: 公开资料基本没有 NRR、GRR、流失率和活跃账户分母。
    claimRefs:
      - CU008
      - CU009
      - CU011
      - CU012
      - CU013
      - CU031
      - CU037
      - CU044
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: Owner 的具名客户证据在同时包含生产部署、量化结果和多个模块时最强，而不是只有一行客户证言。
    data:
      columns:
        - 结果具体度
        - 生产部署深度
        - 扩张可见度
        - 时效性 / 佐证
      rows:
        - label: Metro Pizza
          values:
            - 高 — 披露直接销售额和 App 安装量
            - 高 — 直接点单和 App 已上线
            - 中 — 混合配送和评价
            - 中高 — 详细案例研究，加上列表页佐证
        - label: Talkin Tacos
          values:
            - 高 — 披露直接销售额、安装量、数据库和 Google 获客
            - 高 — App、会员、SEO、直接订单
            - 高 — <3 年内从一家扩至六家门店
            - 高 — 详细案例研究，加上目录佐证
        - label: Mattenga’s
          values:
            - 高 — 披露 30 天增长和订单提升
            - 高 — 七家门店一体化上线
            - 高 — 明确多门店运营
            - 中 — 官方案例研究和列表页
        - label: Saffron
          values:
            - 高 — 披露月度直接销售额和 Google 获客
            - 高 — App、会员、SEO、四家门店
            - 中高 — 多门店，但没有队列细节
            - 中 — 官方案例研究和列表页
        - label: Ashley’s Cafe 案例
          values:
            - 高 — 披露销售额和到店客捕获
            - 高 — POS 加 App 增长
            - 中 — 计划扩至七家门店
            - 中 — 仅官方案例研究
        - label: Karv / Gyro
          values:
            - 中高 — 披露线上销售额和直接订单改善
            - 高 — App、SEO、复购、费用下降
            - 中 — Gyro 提到未来开店
            - 中 — 官方案例研究，加上 Gyro 的目录佐证
