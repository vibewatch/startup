  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层和买方 / 用户 / 付款方地图
        blocks:
          - type: paragraph
            body: >-
              相比传统 SaaS 席位数，用所有权模式和运营需求更容易定义 Owner
              的客户基础。公开材料持续瞄准独立餐厅业主和经营者：他们需要连锁级数字工具，但不想招聘内部产品、营销或工程团队。经济买方和付款方是餐厅业务本身，通常由业主、经营者、总经理或 managing partner
              代表。终端用户被拆成两类：员工使用 POS、报表、订单管理和 Owner App 等运营触点；餐厅客人则使用 Owner 代表餐厅驱动的品牌网站、点餐流程、会员计划和移动 app。公开证据还显示 ICP
              内部规模差异不小。一些客户是单店独立餐厅，但也有 Saffron、Mattenga’s 和 Talkin Tacos 这类多门店集团。仍不透明的是按地理、收入带或账户规模划分的准确结构：Owner
              明确聚焦独立餐厅，并为多门店经营者提供特别价格，但没有发布活跃门店、ARR 区间或平均账户规模的清晰分层表。
