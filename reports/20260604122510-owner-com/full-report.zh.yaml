      - number: '1.3'
        title: 融资历史、估值和公开规模指标
        blocks:
          - type: paragraph
            body: >-
              公开融资证据从 2024 年起最强。Owner 在 2024 年 1 月完成 $33 million Series B，投后估值 $200 million，随后在 2025 年 5 月以 $1 billion
              估值完成 $120 million Series C，正式成为独角兽。Series B 由 Redpoint 和 Altman Capital 领投；Series C 由 Meritech 和 Headline
              领投，并引入餐饮和软件运营者作为战略支持者。公开来源对累计融资额说法不一。官方 Series B 备忘录称累计融资为 $58.7 million，加上 Series C 后意味着披露下限为 $178.7
              million，而 Sacra 和 Tracxn 将该数字汇总到约 $189 million。规模指标方向上很强，但仍有部分不透明。官方材料从 2024 年初 2,000 多家餐厅和 3 million
              名客人，推进到 2025-2026 年 10,000 多家餐厅和约 57 million 至 60 million 名已服务用户。当前员工数没有在官网正式发布；第三方来源将其放在 275 至 337
              区间。官方材料没有发布当前 ARR 或收入，尽管 Sacra 估计 2025 年约为 $80.56 million。相比财务披露，定价清晰得多：Owner 按月向餐厅销售订阅，价格为每月 $249 或
              $499，取决于方案结构。
