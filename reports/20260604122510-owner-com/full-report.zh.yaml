        - 直接对比的基准参考
      - - Toast
        - $0 Starter Kit；$69 POS 方案；定制方案
        - 硬件预付时 2.49% + 15¢，或随用随付费率更高；与合同绑定
        - POS / 支付套件，含硬件选项和插件经济性
        - 如果买方想要一套集成栈，可能压低软件价格
      - - Square for Restaurants 餐厅套件
        - $0 / $49 / $149 每门店
        - 线下刷卡费率大约 2.6% 至 2.4% + 15¢；线上更高
        - 包含免费在线点餐；可随时取消；大卖家适用高级定制价
        - 小型运营者里最透明、低摩擦的既有厂商
      - - SpotOn
        - $0/终端全包版，或 $55/终端核心版
        - 全包版为 2.79% + $0.20；基础版为 2.45% + $0.15；全包版有最低期限
        - 硬件、落地实施、支持和支付紧密打包
        - 支付打包方案前期看起来可能比单独购买 SaaS + 硬件更便宜
      - - ChowNow
        - $249 / $349 / $449/月
        - 每笔 2.95% + $0.29，另收设置费和可选配送费用
        - 面向独立餐厅的点餐、营销和 POS 集成
        - 公开定价中，与 Owner.com 直营点餐经济性最接近的对标公司
      - - Popmenu
        - $179 / $299 / $499/月
        - 引用的定价页未清楚披露支付经济性
        - 以网站和营销为核心的套餐，叠加在线点餐 / 餐饮外烩和 AI 工具
        - 入门价更低，但套餐重心不同
      - - GloriaFood
        - 核心功能免费；$49 POS 附加模块；$29 支付附加模块；$19 促销附加模块
        - 核心产品不收佣金；付费升级按模块购买
        - DIY / 免费增值打法，付费高级功能可选
        - 对只买数字化工具的客户，形成低端价格伞风险
      - - DoorDash Online Ordering
        - 免佣金直营点餐；引用页面未列明月费
        - 配送由 Dashers 履约；引用页面未完整披露详细经济性
        - 现有 DoorDash 商户可快速开通；提供品牌页，以及 Google / 社交点餐
        - 对已在 DoorDash 商户生态内的餐厅，是强替代方案
      - - Olo
        - 定制 / 按报价
        - 企业级定制
        - 在开放 SaaS 架构上，为品牌提供点餐、支付和顾客运营
        - 更多争夺连锁品牌，而不是 Owner.com 的 SMB 核心客群
      - - Lunchbox
