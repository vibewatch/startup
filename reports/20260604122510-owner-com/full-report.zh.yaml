      - number: '6.5'
        title: 扩张、集中度、渠道依赖和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              即便 Owner 不披露正式队列表，先落地再扩张的路径也已经看得见。同一家餐厅往往先上线网站和点餐流程，再叠加品牌 App、会员、自动化营销、POS
              集成和多门店铺开。这种套件深度有利于扩张收入和粘性。主要公开风险在别处。第一，集中度很难承保：尽管公司声称服务 10,000+ 家餐厅，已审阅来源没有披露头部客户收入占比、前 10 大 ARR
              集中度，或按规模分层的客户结构。第二，Owner 并不打算一夜之间取代第三方外卖；其定价 FAQ 明确称，多数客户会把平台 App
              继续当作营销渠道，再尝试把食客转成直接订单。第三，落地并非对每个经营者都无摩擦。独立评论反复提到 POS/菜单同步限制、定制能力有限，以及支持延迟或跟进不一致。好消息是，相比许多餐厅软件供应商，Owner
              按月定价、没有长期合同，采购摩擦较低。代价是设置费不可退，部分硬件或交易费用仍然重要，所以买方进入的不是零摩擦关系。
