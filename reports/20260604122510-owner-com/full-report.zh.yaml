chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              Owner.com 更适合被理解为面向独立餐厅的垂直 SaaS 平台，而不是通用物流或工业软件公司。官方页面称，餐厅用它靠 AI 优化网站、直接在线点餐、会员、营销自动化、CRM
              和品牌移动应用来增长线上业务。公开法律和公司地址证据都指向加利福尼亚州 Palo Alto，Owner.com, Inc. 将 530 Lytton Avenue 列为联系地址。最强的创立叙事指向 Adam
              Guild：他在帮助母亲的宠物美容店后，于 2018 年启动业务，随后从 PlacePull 转向 ProfitBoss，并在买下高级域名后于 2021 年更名为 Owner.com。一些数据库把创立年份规范为
              2019 年，公开公司记录显示法律实体更晚、在 2020 年成立，因此第 1 章最干净的表述是：2018 年运营起点，2020 年法律实体成立，当前运营身份为
              Owner.com。公司宣称的长期目标超出餐厅，延伸到更广泛的本地商家，但当前 go-to-market 和证据点仍以餐厅为先。
