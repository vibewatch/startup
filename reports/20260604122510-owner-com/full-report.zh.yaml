      - number: '4.2'
        title: GTM 动作和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开 GTM 信号不是员工数或 CAC 披露——Owner 没有发布这些——而是 Series C 备忘录和客户漏斗中可见的运营形态。管理层称，入站客户往往已被其内容预先教育，超过 90%
              的客户经理能在三个月内爬坡到配额，超过 1,000 名客户已从竞品切换而来。公司的月付合同也重要：它们减少了强制催收，说明产品必须在每个账单周期持续证明 ROI；同时案例研究反复把胜利归因于直接订单增长、SEO
              排名、更高客单价、app 采用和避免平台佣金。


              抵消因素是典型 SMB 暴露。Owner 自己说，logo 流失在结构上高于企业 SaaS 流失，且 2025 年 1
              月流失很大程度上由餐厅倒闭推动。这意味着收入质量取决于扩张能否跑赢倒闭。管理层声称，餐厅销售增长和新增门店会提高平台上的支付量，这会帮助在客户基础内部扩张收入，但没有公开
              CAC、回本周期、队列留存或净收入留存数字来证明这个飞轮有多耐久。因此，公开读数对需求生成和配额效率有利，但对真实销售效率仍不完整。
