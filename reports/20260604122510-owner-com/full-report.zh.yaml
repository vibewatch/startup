      - number: '2.4'
        title: 矛盾、规模缺口和估值含义
        blocks:
          - type: paragraph
            body: >-
              最大的尽调陷阱，是把所有公开餐饮科技数字都当成可互换。它们并不能互换。National Restaurant Association 的终端市场数字描述的是餐厅消费者支出，不是软件收入。Technavio
              衡量宽泛的餐饮科技类别，并发布增量市场增长。Precedence 同时发布餐厅 POS 终端估算和单独的全行业 POS 软件估算。James Beard 和 Toast
              说明了为什么这在战略上重要：独立经营者是利润率很薄的买方，但本证据集中没有任何公开来源干净地隔离出美国独立餐厅在 Owner.com 所售具体组合包上的支出规模。这意味着 TAM
              在方向上支持机会，但不足以决定估值。更有决策价值的问题都在私域：有多少买方能以有吸引力的回本周期获客，网站加点餐采用能在多大程度上扩展到会员或 app，迁移时对 Toast 和 Square
              有多痛，以及一方需求捕获是否能把留存改善到足以支撑打包平台。在这些证据披露前，市场论证支持相关性和增长，但不支持精确的公开 SAM 或已去风险的 SOM。
