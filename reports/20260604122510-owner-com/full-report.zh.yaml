  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层：直接同业、既有巨头、相邻平台和替代方案
        blocks:
          - type: paragraph
            body: >-
              Owner.com 处在宽泛的餐饮科技买方决策里，而不是狭窄的网站构建器小众市场。最接近的直接同业是 Popmenu 和
              ChowNow，因为三者都向独立餐厅销售前厅增长工具栈，核心围绕网站、直接点餐、客人数据和复购营销。BentoBox 位于同一条以商务为核心的网站赛道旁边。最强的既有巨头是 Toast、Square 和
              SpotOn，它们从更宽的操作系统角度切入同一需求：POS、支付、硬件、排班、报表和在线点餐。Olo 和 Lunchbox 更像相邻的企业平台，而不是正面 SMB
              对手，因为两者为餐厅品牌、开放集成和连锁规模订单管理优化。替代方案真实存在：GloriaFood 覆盖低端 DIY 直接点餐用例，DoorDash Online Ordering 则让现有 DoorDash
              商户获得一层一方点餐能力，而不必完整迁移到 Owner。维持现状也有意义：餐厅可以保留现有 POS，把在线点餐接入 GoDaddy、Shopify、WordPress 或 Wix
              类工具，接受拼接式技术栈，而不是购买打包平台。这就是为什么 Owner.com 不只是在和具名 SaaS 供应商竞争，也是在和经营者重新拿回直接订单和客人数据的所有可信方式竞争。
