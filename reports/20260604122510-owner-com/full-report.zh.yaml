        - 企业级餐厅品牌
        - 点餐、支付、客人互动、开放 SaaS 集成
        - 连锁级合作伙伴生态和企业级路由 / 数据能力
        - 不面向独立餐厅自助入驻
      - - Lunchbox
        - 相邻企业级平台 / 潜在进入者
        - 5,000+ 门店；2025 年获得 Shift4 支持的融资轮
        - 企业级和多门店品牌
        - App / 网页点餐、餐饮承办、聚合、CRM、开放 API
        - 开放、可扩展架构叠加 Shift4 渠道顺风
        - 定制报价和企业级重心削弱 SMB 适配度
      - - GloriaFood
        - 低成本替代品
        - 免费增值 / DIY 平台
        - 预算敏感型餐厅
        - 直接点餐、预订、促销、POS / 支付插件
        - 核心产品不收佣金，也不收月费
        - DIY 工作流，许多高级功能单独售卖
      - - DoorDash Online Ordering
        - 替代品 / 潜在进入者
        - DoorDash 商户加 Dasher 网络
        - 已使用 DoorDash Marketplace 或配送网络的餐厅
        - 免佣金第一方点餐、Google / 社交点餐、品牌页面、Dashers 配送
        - Marketplace 交叉销售和原生物流入口
        - 商户仍绑定在 DoorDash 轨道和关系里
