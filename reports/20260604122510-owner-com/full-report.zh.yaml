      - number: '8.4'
        title: 建议、退出准备度和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开记录，正确建议是继续研究 / 等待；置信度中等，风险高，估值立场偏充分至昂贵。这不是否定公司。Owner 看起来正在为独立餐厅搭建真实的增长层，邻近战略活动——例如 DoorDash 以 $1.152
              billion 收购 SevenRooms——也说明餐厅软件资产可以具备战略价值。但没有规模和披露，公开市场投资人不会为餐厅科技公司支付独角兽价格；当前记录也不足以假设 Owner
              已经达到该水平。因此，退出准备度尚未得到证明。若要证明按上一轮价格买入合理，尽调需要确认更大且高质量的收入基础、强留存、有韧性的毛利率，以及能给新资金留下真实上行空间的条款。如果这些检查结果强，价格可以重新讨论。如果不能，纪律性的做法是继续跟踪公司，而不是强行以拉伸价格入场。
