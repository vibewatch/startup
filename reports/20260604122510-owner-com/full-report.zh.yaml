  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 残余风险集中在脆弱的 SMB 需求、多渠道合规和第三方平台依赖的重叠处。
    data:
      columns:
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 配送伙伴约束
            - 支持或 ROI 偏弱导致商户流失
            - 独立餐厅脆弱性
        - label: 中等可能性
          values:
            - ADA / 费用披露争议
            - POS / 数据同步故障
            - SMS / 邮件合规失败
        - label: 低可能性
          values:
            - 截至目前可识别的公开执法行动
            - 大规模支付或安全事件
            - 竞争挤压后被迫重置融资
    approximationNotes: 单元格位置反映公开证据和作者对残余风险暴露的权重判断，而非已披露概率模型。
    claimRefs:
      - CR021
      - CR025
      - CR033
      - CR036
      - CR037
      - CR039
      - CR050
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行情景链条从合规或集成疏漏开始，传导到支持成本、商户流失、GMV 压力和估值风险。
    data:
      nodes:
        - id: n1
          label: 同意授权或数据同步错误
          detail: 名单清洗出错、客户数据过期，或屏蔽状态错误
          tone: negative
        - id: n2
          label: 消费者投诉 / 监管询问
          detail: FCC、FTC、州总检察长或原告关注
          tone: negative
        - id: n3
          label: 支持与补救负担
          detail: 退款、升级处理、商户陪跑、法律审查
          tone: warning
        - id: n4
          label: 商户信任削弱
          detail: 运营者对 ROI 和运营可靠性失去信心
          tone: negative
        - id: n5
          label: 流失 / 降级
          detail: 月付客户取消或减少模块使用
          tone: negative
        - id: n6
          label: GMV 和营销触达量下滑
          detail: 订单变少、消息量下降，削弱经济性
          tone: negative
        - id: n7
          label: 更高销售激励 / 定价压力
          detail: 竞争性折扣或额外支持抵消留存弱点
          tone: warning
        - id: n8
          label: 估值压力
          detail: 收入质量和下一轮支撑转弱
          tone: negative
        - id: n9
          label: 集成中断或伙伴宕机
          detail: POS、支付、App 或配送依赖失效
          tone: negative
        - id: n10
          label: 高峰期订单中断
          detail: 菜单不匹配、路由失败、延迟或扣款失败
          tone: negative
      edges:
        - from: n1
          to: n2
          label: 触发
        - from: n1
          to: n3
          label: 造成
        - from: n2
          to: n4
          label: 削弱
        - from: n3
          to: n4
          label: 加重
        - from: n4
          to: n5
          label: 导致
        - from: n5
          to: n6
          label: 拉低
        - from: n6
          to: n7
          label: 迫使
        - from: n7
          to: n8
          label: 挤压
        - from: n9
          to: n10
          label: 引发
        - from: n10
          to: n4
          label: 加速
    claimRefs:
      - CR004
      - CR011
      - CR017
      - CR024
      - CR043
      - CR044
      - CR045
      - CR049
      - CR050
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Owner 的规模化路径穿过一组紧密依赖：支付、应用商店、搜索、配送、POS 和客户基础；同时，更大竞争对手正在进攻相邻触面。
    data:
      nodes:
        - id: owner
          label: Owner.com
          detail: 面向餐厅的直接点单、CRM、POS、App 和营销平台
          tone: neutral
        - id: restaurants
          label: 独立餐厅
          detail: 核心商户队列和收入基础
          tone: warning
        - id: stripe
          label: Stripe
          detail: 隐私政策中点名的支付处理伙伴
          tone: warning
        - id: pos
          label: Square / Clover / Toast / Otter
          detail: POS 与中间件生态
          tone: warning
        - id: delivery
          label: 配送伙伴
          detail: 部分订单的第三方履约
          tone: warning
        - id: google
          label: Google Search / Maps
          detail: 发现入口和商家资料可见度
          tone: warning
        - id: appstores
          label: Apple / Google 应用商店
          detail: 品牌 App 的分发和政策闸口
          tone: warning
        - id: toast
          label: Toast
          detail: 资本充足的餐厅 OS 竞争对手
          tone: negative
        - id: doordash
          label: DoorDash
          detail: 商户自有渠道上的 Commerce Platform 竞争对手
          tone: negative
      edges:
        - from: stripe
          to: owner
          label: 支付通道
        - from: pos
          to: owner
          label: 集成链条
        - from: delivery
          to: owner
          label: 履约延伸
        - from: google
          to: owner
          label: 发现入口
        - from: appstores
          to: owner
          label: App 分发
        - from: owner
          to: restaurants
          label: 软件 + 数据层
        - from: toast
          to: owner
          label: 餐厅 OS 竞争
        - from: doordash
          to: owner
          label: 商务平台重叠
        - from: toast
          to: restaurants
          label: 一体化 POS / 支付捆绑
        - from: doordash
          to: restaurants
          label: 市场平台 + 白标点单
    claimRefs:
      - CR015
      - CR026
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
      - CR034
      - CR040
      - CR046
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议仍然谨慎：Owner 通过了市场需求和产品测试，但公开价格支撑测试还没通过。
    data:
      nodes:
        - id: market
          label: 真实需求
          detail: 配送费上涨、与连锁品牌的技术差距拉大、SEO 压力上升，独立餐厅需要直接获取数字需求的工具。
          tone: positive
        - id: product
          label: 产品契合度
          detail: Owner 的 SEO、点单、会员和 AI 堆栈有明确取舍，能给运营者带来可信价值。
          tone: positive
        - id: proof
          label: 公开证据缺口
          detail: 收入、留存、毛利率和股权结构条款仍未公开。
          tone: warning
        - id: comps
          label: 公开可比公司约束
          detail: 相关可比公司约以 1.7x-5.6x TTM 收入交易，意味着 $1B 标记需要很高收入门槛。
          tone: warning
        - id: call
          label: 决策
          detail: 当前价格下继续研究 / 等待，除非私下尽调补上分母缺口。
          tone: neutral
      edges:
        - from: market
          to: call
        - from: product
          to: call
        - from: proof
          to: call
        - from: comps
          to: call
    approximationNotes: null
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV033
      - CV037
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有 Owner 实际收入已经远高于公开材料披露水平，$1 billion 标记才看起来符合常规。
    data:
      items:
        - label: 2x 所需收入
          value: 500
          detail: 若 Owner 最终按较低倍数的商业可比公司定价，需要达到的收入（USD millions）。
          tone: negative
        - label: 3.4x 中位数所需收入
          value: 294
          detail: 按筛选后公开同业中位数所需收入（USD millions）。
          tone: warning
        - label: 5.6x 高位可比所需收入
          value: 179
          detail: 即使用筛选后公开可比公司中最高倍数，也需要达到的收入（USD millions）。
          tone: warning
        - label: 8x 溢价所需收入
          value: 125
          detail: 如果 Owner 证明增长质量异常强、软件经济性具备溢价，所需收入（USD millions）。
          tone: neutral
    approximationNotes: 柱状条用筛选后公开可比公司倍数，将简单估值除以收入门槛；不是管理层或投资人指引。
    claimRefs:
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开数据的承销给出很宽区间，大多低于上一轮价格，或只略高于上一轮。
    data:
      items:
        - label: 悲观情景
          low: 250
          mid: 400
          high: 600
          displayValue: $250M-$600M
          detail: 收入基数更小、流失拖累，并受 2x-4x 倍数约束。
          tone: negative
        - label: 基准情景
          low: 600
          mid: 900
          high: 1200
          displayValue: $600M-$1.2B
          detail: 增长合理，但经济性并不超常，只支撑持平到小幅上行结果。
          tone: warning
        - label: 乐观情景
          low: 1300
          mid: 1800
          high: 2500
          displayValue: $1.3B-$2.5B
          detail: 尽调验证收入基数远大且质量更高，条款也比公开证据显示的更干净。
          tone: positive
    approximationNotes: 这些区间是为投委会纪律设置的情景估值输出，不是预测；未计入可能压低投资人回报的稀释和优先权影响。
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV039
      - CV040
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Owner 在市场需求和产品差异化上得分较好，但在证据充分性和价格支撑上较弱。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: 独立餐厅明确需要直接拉动需求的软件和 AI 驱动的数字工具。
          tone: positive
        - label: 产品证据
          score: 7
          detail: 定价、案例研究和评价数据表明，平台可能改善直接点单和留存。
          tone: positive
        - label: 竞争差异化
          score: 7
          detail: 有明确取舍的增长层和 POS 互操作性撬出真实切入点。
          tone: positive
        - label: 证据质量
          score: 3
          detail: 公开披露缺少核心分母、利润率和留存输入。
          tone: negative
        - label: 估值支撑
          score: 3
          detail: 公开可比公司无法独立支撑 2025 年 5 月估值标记。
          tone: negative
        - label: 风险负担
          score: 4
          detail: SMB 流失、宏观敏感性和融资条款不透明都很关键。
          tone: warning
        - label: 退出准备度
          score: 4
          detail: 公开记录还无法证明数十亿美元退出的信心。
          tone: warning
    approximationNotes: 评分是基于筛选后公开证据的 0-10 序数型投资判断，不是公司提供的董事会 KPI 仪表盘。
    claimRefs:
      - CV004
      - CV007
      - CV009
      - CV010
      - CV033
      - CV037
      - CV038
      - CV042
