  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑是连贯的。独立餐厅确实承压，需要在线上看起来、运转起来更像连锁；外卖平台则继续抽走单位经济性并占有客户关系。Owner 把自己定位成面向本地商家的 Shopify
              式增长层，先从餐厅切入；公开产品包装也贴合这套叙事：网站、直接在线点餐、品牌 App、会员、营销自动化和 AI
              工具，打包在一个简单的月度方案里。公开客户评论也提供了足够证据，说明经营者确实能获得价值，让这个故事仍然成立。反向逻辑同样重要。Owner 服务的餐厅基数高度偏
              SMB，管理层自己也承认这类客户结构性流失更高，其中包括餐厅关店造成的流失。评论还暴露集成和欺诈控制投诉，竞争对手诉讼也显示，这个品类竞争强到营销打法会变成对抗。因此，正确的问题不是 Owner
              有没有产品市场匹配，而是这种匹配是否足够持久、足够赚钱，能支撑独角兽价格入场。
