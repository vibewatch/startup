      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景并非不可能，但需要具体证据。公开可比公司和 Owner 自己的价格卡都意味着，要承保当前估值，企业规模必须已经显著大于公开记录显示的水平，而且留存和利润率强到配得上溢价倍数。如果尽调证明 Owner
              的收入基础已经接近高端可比公司支撑区间，SMB 流失受控，融资条款干净，公司仍可能长成一个有意义的溢价结果。基准情景更克制：Owner
              是一款有真实市场拉力的好产品，但如果收入和留存只落在正常餐厅科技水平，当前价格只能给出持平到中等幅度的上行。悲观情景则是典型的私募估值标记问题——公司不错，分母太弱。如果收入远低于多头预期，或关店和流失持续侵蚀队列，公开可比公司估值桥会迅速压缩。回报数学也强化了这一点：$1
              billion 入场价要拿到 3 倍毛回报，退出至少需要 $3 billion；要拿到 5 倍毛回报，稀释前大约需要 $5 billion。在公开证据仍然如此稀薄时，这个门槛很高。
