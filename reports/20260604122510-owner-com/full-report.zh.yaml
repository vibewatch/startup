      - number: '7.2'
        title: 营销、隐私、无障碍和费用披露合规都是实质性法律风险
        blocks:
          - type: paragraph
            body: >-
              对一家面向餐厅 SMB 的 SaaS 而言，Owner 的法律和监管敞口层次异常多。Owner 会自动向餐厅客户发送邮件和短信，把 Web/App 客户加入营销名单，并在 POS 捕获食客手机号以推动 App
              下载和复购。这直接打开 TCPA 和 CAN-SPAM 风险面，而 Owner 的法律条款又把部分同意义务转给商户：其网站条款称，商户需要为自己的营销短信取得法律要求的同意；餐厅协议要求邮件 /
              短信推广遵守适用法律。监管基线并不宽松。FCC 指引称，商业短信需要书面同意和退订权；FTC 称 CAN-SPAM 适用于所有商业邮件，法律责任可同时落到推广方和发送方。隐私又叠加一层：Owner
              更新后的隐私政策称，公司收集食客联系 / 订单数据、商户税务和银行信息，甚至从录制演示中收集图像和语音数据；加州监管又赋予消费者知情、删除、更正和拒绝分享的权利。支付和消费者保护方面，Owner 称 Stripe
              处理卡数据，但餐厅协议要求商户承担退款、拒付和费用披露合规，包括类似 SB 478 的逐项列示。无障碍也是剩余风险：Owner 声称投入 ADA 相关工作，但协议明确说，商户的设计选择仍可能造成不合规。
