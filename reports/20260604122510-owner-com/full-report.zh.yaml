    title: 护城河耐久度 / 竞争风险清单
    notes: 严重程度反映对 Owner.com 长期定价权和赢单率的可能影响，不是对公司失败的预测。本清单强调抓取证据中可见的具体竞争机制：支付打包、存量客户分发、低成本替代品和功能商品化。
