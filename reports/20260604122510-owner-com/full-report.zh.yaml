  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价和收入质量
        blocks:
          - type: paragraph
            body: >-
              对一家私营餐饮科技公司而言，Owner 的变现异常透明：餐厅可以购买每月 $249、每单另收 5% 餐厅费的 Flex 方案，也可以购买每月 $499、无餐厅费的 Flat Rate 方案；两种方案下，客人都支付
              5% 订单支持费。公司明确建议，当餐厅月线上销售额超过约 $5,000 时转向
              Flat，这也符合两种方案之间的机械盈亏平衡点。核心收入引擎因此清晰可见：经常性订阅收入锚定模型，低量账户上的可变订单挂钩费用扩展变现，客人支持经济性再增加一层变现。


              质量问题不是 Owner
              是否向客户收费——它显然收费——而是经济性中有多少像软件，多少像服务。公开材料显示，这是一套大组合包，包含网站、点餐、app、SEO、会员、营销、迁移、拒付保护和全天候支持；案例研究也强调节省配送费和捕获直接订单。这些功能可以支撑强留存和增购，但也意味着不小的支持和实施成本。公开记录没有披露客人支持费、配送转付或
              Owner POS 与 AI Executives 等未来模块如何确认收入。因此，标价是变现的强证据，而实际收入结构和毛利仍是核心证据缺口。
