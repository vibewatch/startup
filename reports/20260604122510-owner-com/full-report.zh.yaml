      - number: '2.3'
        title: 增长驱动、替代方案和采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的需求信号是利润率压力。Toast 称盈利能力是经营者的首要目标，Hospitality Technology 称 42% 的多门店餐厅面临结构性盈利挑战，James Beard
              则认为，即便是中等程度技术采用，也能跑赢投入不足和过度碎片化的技术栈。这把餐厅推向自有渠道和更好的客人数据利用。店外需求同样真实：National Restaurant Association 报告称，82%
              的消费者对外卖表现出强烈兴趣。但替代集合仍很强。第三方平台聚合需求和物流，公开来源仍把 15% 到 30% 抽佣视为正常区间。DoorDash 自己发布 15%、25% 和 30% 的平台档位，而 New
              York City
              最新政策重置说明，监管格局仍会在边际上改变费用经济性。结果是一个一方点餐在战略上有吸引力、但落地并不顺滑的品类。餐厅仍需要配送执行、支付安全、隐私合规、菜单和支付集成，以及从既有技术栈迁移过来的可行路径。QSR
              的 2025 年报道抓住了运营现实：品牌正在优先推进一方点餐、技术栈整合和统一支付，因为数字增长现在必须转化为可持续盈利，而不只是更多渠道。
