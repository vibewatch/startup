      - number: '5.3'
        title: 部署、集成、支付和支持：公开证据最强的是快速上线和日常运营
        blocks:
          - type: paragraph
            body: >
              对一家私营餐厅软件供应商而言，Owner 的公开实施叙事异常明确。定价和 POS 页面称，平台按月订阅，包含设置和迁移，并由专属专家支持；POS
              页面称，大多数安装在硬件到达后几个工作日内完成，只需一次远程通话、自动导入菜单，无需 IT 专家。支持表面也可见：定价承诺 24/7 支持，帮助中心在 POS /
              平板、营销、移动、集成和订单等方面有大量文章，经营者 app 列表把用户引回 help.owner.com 和 support@owner.com。集成证据偏实践，而非开发者中心。公开页面强调原生支持
              Square 和 Clover，通过 Otter 等伙伴实现更广连接，基于仪表盘完成 DoorDash 映射和菜单同步，并把平台订单路由到一个 Owner
              屏幕。支付方面，公司披露少于营销或上线。隐私政策明确，在线订单支付信息由 Stripe 等第三方处理器处理，Owner 自身不收集、存储或处理该支付信息，但公开材料没有披露刷卡现场处理器、PCI 材料，或新
              POS 层正式的状态 / SLA 表面。这是强工作流证据与更深技术承销之间的主要缺口。
