      - number: '7.5'
        title: 缓释因素真实存在，但流失、合规或伙伴摩擦恶化时，投资逻辑会很快断裂
        blocks:
          - type: paragraph
            body: >-
              缓释因素确实存在，所以本章讨论的更像承保条件，而不是即时失败。Owner 看起来并不自行存储卡数据，而是把支付处理外包给
              Stripe；公司也更新了法律文件，至少承认仲裁、同意、隐私权、费用披露和无障碍责任。平台可以创造真实 ROI：相比支付 15-30% 的平台佣金，直接点餐对餐厅可能更便宜；Owner
              按月结构也降低了正式锁定效应。但同一组事实也给出了可监控的否决条件。如果关于支持、集成或欺诈的评论投诉上行，而餐厅又能无罚金离开，流失会很快移动。如果
              SMS/邮件同意控制或费用披露失效，公司和商户会面对与合同价值不成比例的集体诉讼或监管敞口。如果 Apple、Google、Stripe、DoorDash/Uber 配送网络或关键 POS
              集成不再支持，Owner 的功能广度就会从护城河变成依赖地图。因此，投资人应把流失队列、拒付和投诉率、10DLC/SMS 发送抑制控制、应用商店状态和集成 SLA 表现当成尽调门槛，而不是次要指标。在 $1
              billion 估值下，比起缺乏产品市场匹配，运营泄漏和 SMB 流失会更快击穿投资逻辑。
