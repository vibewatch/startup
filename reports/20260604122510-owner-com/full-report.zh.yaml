  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性集中在商户脆弱性、合规扩散和平台依赖
        blocks:
          - type: paragraph
            body: >-
              Owner.com 最大的剩余风险，不是餐厅对直接点餐的需求弱于第三方平台；公开证据反而指向相反方向。承保难点在于，Owner 把越来越宽的操作系统卖给独立餐厅——网站、点餐、CRM、POS、品牌
              App、配送、自动化邮件 / 短信和 AI 助手——而这类买方结构上脆弱。Restaurant Business 称，Owner 目前服务超过 10,000 家餐厅，并在 $120 million Series
              C 后估值 $1 billion。与此同时，Owner 自己的定价页和 POS 页面强调按月合同、无取消费，以及依赖在结账、App
              和网站中捕获客户数据的自动化营销流。这种组合会放大流失、支持负荷和合规失误的敏感度：如果 ROI 不及预期，经营者可以很快离开；如果系统跑通，Owner
              又会深度嵌入点餐、营销和一方数据。因此，风险登记表把商户脆弱性、营销合规敞口、平台依赖和集成 / 支持执行排在抽象市场需求风险之前。Popmenu 诉讼也提醒投资人，Owner
              的市场进入打法足够激进，吸引来的不只是被动竞争，还有直接竞争挑战。
