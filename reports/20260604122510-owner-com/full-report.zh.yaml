        title: 资本充足性、融资依赖和阻塞点
        blocks:
          - type: paragraph
            body: >-
              截至最新融资，公开资本故事很直接：Owner 在 2025 年 5 月以 $1 billion 估值宣布 $120 million Series C，此前在 2024 年 1 月完成 $33 million
              Series B。公司称资金用途是扩张——扩大平台、深化 AI
              能力、拓宽公司触达面。新资金是正面信号，因为没有公开证据显示困境融资，也没有披露叠加债务。但仅凭公开数据无法真正承销资本充足性，因为公司不发布现金、烧钱速度、现金跑道或杠杆。


              这带来一个分裂判断。收入质量看起来好于许多不透明的平台相邻公司，因为定价透明、合同按月，案例研究也持续指向真实商户 ROI。毛利路径的证明弱得多，因为没有公开来源披露 Owner
              自身毛利率，或支持、实施、配送运营、POS 扩张的真实成本。资本强度看起来中等而非极端——这不是硬件库存或项目融资型业务——但融资依赖仍重要，因为 $1 billion
              估值假设公司继续增长，却没有公开盈利能力或现金跑道证明。核心阻塞点是当前 ARR 和收入结构、各收入流毛利率、队列留存和当前流动性。
