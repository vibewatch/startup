      - number: '3.2'
        title: 能力、定价和 go-to-market 对比
        blocks:
          - type: paragraph
            body: >-
              能力重叠确实存在，但不同供应商类别的组合包形态差异很大。Owner.com、Popmenu 和 ChowNow 主要想解决直接数字增长：更好的网站、更多直接订单，以及通过
              CRM、会员或自动化营销带来更多复购需求。Toast、Square 和 SpotOn 销售相同结果，但把它们锚定在 POS、集成支付、硬件和劳动力工具里，因此能卖进更大的预算项，并围绕支付经济性打包软件。Olo
              和 Lunchbox 更偏高端市场，强调开放集成、订单管理、客人数据和企业级可扩展性，而不是简单的独立餐厅上手动作。公开定价凸显 Owner 赢在哪里、暴露在哪里。Owner 的标题价格很简单：$249 加 5%
              订单费，或 $499 包月。这个简单性受到 Square $0 或 $49 入门点、SpotOn 每台 $0 或每台 $55 表述、Popmenu $179 入门包、ChowNow 数百美元中段定价以及
              GloriaFood 免费核心产品的挑战。DoorDash 免佣金直接点餐的信息也缩短了平台分发与一方经济性的距离。实际含义是，Owner.com
              不能只靠功能清单取胜；它必须在集成执行质量、迁移帮助和独立餐厅可衡量增长结果上赢。
