  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算口径
        blocks:
          - type: paragraph
            body: >-
              承销 Owner.com 时，应对标餐厅软件预算，而不是餐厅消费者总支出。National Restaurant Association 数据显示，美国餐厅终端市场极大，预计 2026 年销售额为 $1.55
              trillion，但这个数字是餐厅交易额上限，不是 Owner.com 能触达的软件池。更相关的纳入口径，是帮助经营者获取并留住一方需求的软件：嵌入网站的点餐、自有网页和移动触点、客人
              CRM、营销自动化、会员，以及运行这些流程所需的支付或 POS 集成。排除项包括食材、人工、租金、通用平台抽佣，以及不会流向 Owner
              类供应商的更广泛硬件或基础设施预算。公开市场报告确认需求存在，但对范围看法不一。Technavio 预测到 2029 年餐饮科技市场增量为 $13.4 billion，Precedence 则估算 2025
              年餐厅 POS 终端为 $26.04 billion、更广义 POS 软件为 $16.37 billion。这些数字只能作为观察口径，因为它们测量的是技术栈的不同层。Owner.com 的实际 SAM
              因此窄于标题里的餐饮科技或餐厅支出数字，落在一方点餐加客人关系这一组合包内部。
