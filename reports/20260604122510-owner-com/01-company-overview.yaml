  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control
    missingEvidence: Board committee assignments, observer seats, voting control, and share-class economics for current investors.
    whyItMatters: These terms determine real governance power and downside protection, which public board-name disclosures cannot answer.
    diligencePath: Request the current cap table, investor-rights summary, board observer list, and committee charters from management or counsel.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: A company-confirmed financing ledger reconciling official round math with Sacra and Tracxn total-funding figures.
    whyItMatters: Exact lifetime capital raised affects dilution analysis and whether side financings, SAFE conversions, or small follow-ons were omitted publicly.
    diligencePath: Request a round-by-round financing table from management, board materials, or counsel that reconciles every primary capital event.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Any debt, warehouse, credit, or secondary-liquidity documentation associated with Owner's financing history.
    whyItMatters: A $1 billion valuation alone does not reveal senior claims, repayment obligations, or insider-liquidity dynamics that could affect underwriting.
    diligencePath: Request debt schedules, side letters, and any employee or investor secondary-sale history alongside the primary financing documents.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-offices
    missingEvidence: A current employee count, departmental mix, and office list verified by management rather than market-data providers.
    whyItMatters: Operating scale, burn, and execution capacity cannot be underwritten cleanly from conflicting third-party headcount estimates alone.
    diligencePath: Request a current org chart, active headcount report, and office census as of the run date.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
    - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: A management-confirmed current ARR, revenue run-rate, and gross-margin bridge.
    whyItMatters: Valuation diligence cannot be completed responsibly with only a single third-party estimate and no official revenue disclosure.
    diligencePath: Request the latest board deck or KPI pack showing ARR, revenue, net revenue retention, and margin trends.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public-leadership-enumeration
    missingEvidence: A full executive roster that confirms whether the current public leadership page omits any material operators or committee-level leaders.
    whyItMatters: The public roster is helpful but may not capture the complete management bench needed to assess succession and execution depth.
    diligencePath: Request an executive org chart and leadership offsite materials to verify reporting lines and role scope.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
