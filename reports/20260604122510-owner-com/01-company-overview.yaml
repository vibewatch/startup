- id: milestones-partnerships-and-adverse-events
  title: Milestones, Partnerships, Legal Surface, and Adverse Events
  body: 'The milestone record shows a startup that repeatedly repositioned itself as the market changed. Owner began as PlacePull, pivoted to ProfitBoss during COVID, rebranded to Owner.com in 2021, then accelerated through a 2024 Series B and a 2025 Series C that also introduced the AI Executives product line. That product launch matters because it reframes Owner from a website-and-ordering stack toward an AI-assisted operating system for restaurants. Channel expansion is also now visible: the Texas Restaurant Association partnership in January 2026 gives Owner a trade-association distribution route and validates the company''s partner strategy under Tina Glickman. The most material adverse public event is the Popmenu lawsuit, which alleges misleading website-grader results and false advertising; Owner denies the claims, but the dispute is a real signal that competitive conduct is under scrutiny in a crowded restaurant-tech category. Review sources add a softer but still relevant caution:
    pricing can feel premium for smaller operators, support can be uneven, and POS or update-management friction still appears in user feedback. The legal surface is maturing, with a January 2026 privacy-policy refresh and an existing arbitration-heavy platform-terms framework, but public data still leaves major diligence gaps around exact ARR, cap-table control terms, secondary liquidity, and debt.'
