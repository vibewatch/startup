- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: 'Owner remains visibly founder-led. Adam Guild is the co-founder and CEO and Dean Bloembergen is the co-founder and CTO, and public company narratives still revolve heavily around Guild''s origin story, product philosophy, and investor relations. The current public leadership bench is broader than a two-founder story: Rob Lehman is President and COO, Will Hauser is CFO, Kyle Norton is CRO, Wyatt Ozmore is CMO, Quenton Cook is CPO, and Tina Glickman runs partnerships. Governance has also professionalized. Owner''s public board now includes Guild plus investors Jack Altman, Shalini Rao, Jason Lemkin, Alex Kurland, and Alex Bard, which means the board is both founder-inclusive and investor-heavy. What is not publicly available is just as important: reviewed sources do not disclose committee structure, observer rights, voting control, or share-class economics. Public materials also show a finance-leadership transition. The January 2024 Series B memo said Owner had just brought on Josh
    Brown as CFO, while the current leadership page names Will Hauser as CFO, suggesting a meaningful but not fully explained handoff in the finance seat. That combination makes founder continuity a strength, but it also leaves governance diligence unfinished.'
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  tableRefs:
  - TO002
- id: capital-base-and-public-scale
  title: Funding History, Valuation, and Public Scale Metrics
  body: 'Public financing evidence is strongest from 2024 onward. Owner closed a $33 million Series B in January 2024 at a $200 million post-money valuation, then a $120 million Series C in May 2025 at a $1 billion valuation, officially making the company a unicorn. The Series B was led by Redpoint and Altman Capital; the Series C was led by Meritech and Headline and brought in restaurant and software operators as strategic backers. Public sources diverge on total capital raised. The official Series B memo said total capital raised stood at $58.7 million, which implies a disclosed minimum of $178.7 million after adding the Series C, while Sacra and Tracxn roll that figure up to roughly $189 million. Scale metrics are directionally strong but still partially opaque. Official materials moved from 2,000-plus restaurants and 3 million guests in early 2024 to 10,000-plus restaurants and roughly 57 million to 60 million served users by 2025-2026. Current headcount is not officially published on
    the website; third-party sources place it in the 275 to 337 range. Official materials do not publish current ARR or revenue, although Sacra estimates roughly $80.56 million for 2025. Pricing is much clearer than financial reporting: Owner sells month-to-month restaurant subscriptions at $249 or $499 per month, depending on plan structure.'
