companyProfile:
  summary: |
    Owner.com is a private, founder-led restaurant software company that sells an opinionated growth stack
    for independent restaurants. The platform bundles AI-optimized websites, first-party online ordering,
    loyalty, CRM, automated marketing, branded mobile apps, analytics, and adjacent operating tools into a
    monthly subscription product designed to reduce restaurant dependence on delivery marketplaces and other
    fragmented vendors. Public evidence suggests the business began operating in 2018, formalized its legal
    entity in 2020, and now operates from Palo Alto, California. By 2025-2026, public company and investor
    materials said Owner served more than 10,000 restaurants and tens of millions of end users, with a May
    2025 Series C elevating the company to a $1 billion valuation.
  foundedDate: '2018-01-01'
