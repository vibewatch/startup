summary:
  headline: >-
    Owner appears to have built a real and increasingly scaled restaurant-software platform for independent operators,
    but the public record still does not provide enough denominator detail on revenue quality, retention, margins, or
    financing terms to justify underwriting the May 2025 $1B valuation with conviction.
  overallScore: 6.2
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: expensive
