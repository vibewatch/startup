    headcount: null
  topStrengths:
    - >-
      Strong product-market fit around helping independent restaurants shift demand to first-party channels and bundled
      growth software
    - >-
      Public scale signals improved materially from roughly 2,000 restaurants in early 2024 to 10,000+ restaurants by
      2025-2026
    - >-
      Broad product bundle creates land-and-expand potential across websites, ordering, loyalty, CRM, apps, and
      POS-adjacent workflows
    - >-
      Founder-led narrative and recent backing from Meritech, Headline, Redpoint, and Y Combinator provide real
      signaling and capital support
    - >-
      Customer case studies and reviews show credible ROI for selected restaurants, especially on direct ordering, SEO,
      repeat purchase, and app adoption
  topRisks:
    - Public disclosure is still thin on ARR, recognized revenue, gross margin, NRR, cash, burn, and cap-table terms
    - >-
      Independent restaurant customers remain economically fragile, with closures and churn pressure amplified by food,
      labor, and delivery economics
    - >-
      Competition is intense across Toast, Square, DoorDash, Olo, Popmenu, BentoBox, SpotOn, and other
      restaurant-commerce stacks
    - >-
      Review evidence shows recurring integration, support, customization, and fraud-handling friction that could limit
      retention or expansion
    - >-
      The $1B May 2025 valuation looks expensive relative to public restaurant-tech multiples unless private diligence
      proves much stronger revenue quality than public evidence shows
  unresolvedGaps:
    - Current recognized revenue, ARR, and mix by subscriptions, payments, and newer AI products remain undisclosed
    - Gross margin, take-rate economics, and incremental support or implementation costs are not public
    - Net retention, logo churn, cohort behavior, and closure-adjusted customer durability are not publicly disclosed
    - Cash balance, monthly burn, runway, debt facilities, and covenant exposure after the Series C are not public
    - >-
      Preferred terms, liquidation stack, governance rights, and other cap-table economics from recent rounds remain
      private
