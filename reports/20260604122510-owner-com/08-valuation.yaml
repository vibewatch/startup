  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue support fails
        - Diligence cannot prove at least roughly $180M-$250M revenue support or a clearly superior margin profile.
        - The public comp bridge never closes, so the $1B mark stays hard to defend.
        - Do not invest at the last round price.
      - - Retention quality disappoints
        - NRR and cohort data show SMB churn overwhelms expansion.
        - The compounding thesis breaks because logo losses offset product wins.
        - Recut valuation on lower multiples and slower growth.
      - - Restaurant closures persist
        - Restaurant closure exposure remains a meaningful driver of churn into 2026.
        - End-market fragility reduces confidence in long-duration cash-flow scaling.
        - Lower scenario weights and demand better terms.
      - - Competition or legal pressure intensifies
        - Rival claims, integration friction, or competitive CAC pressure worsen.
        - Owner's positioning as the best direct-demand layer becomes less durable.
        - Pause until market-share or product-retention data improves.
      - - Financing terms are investor-unfriendly
        - Preferences, ratchets, or secondary-heavy economics reduce true upside for new money.
        - Headline valuation stops matching investable economics.
        - Wait for cleaner terms or a reset entry point.
    notes: >-
      These are valuation triggers, not generic company risks. Each one directly reduces the probability that a $1
      billion entry can compound into an attractive outcome.
