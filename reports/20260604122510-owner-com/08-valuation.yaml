company:
  name: Owner.com
chapter:
  number: 8
  title: Valuation
  summary: >-
    Owner.com's May 2025 $120 million Series C at a $1 billion valuation reflects a real product thesis around
    helping independent restaurants own direct demand, but the public record still does not show the revenue,
    margin, retention, or cap-table detail needed to prove that price. Public restaurant-tech comparables trade at
    roughly 1.7x-5.6x TTM revenue, so the current mark only becomes attractive if private diligence proves Owner is
    already much larger and higher quality than public evidence can verify.
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - dimension
      - value
      - rationale
    rows:
      - - Recommendation
        - research-more
        - Public evidence supports diligence, not price-taking, because revenue quality and cap-table economics remain opaque.
      - - Confidence
        - medium
        - The product and market case are credible, but the valuation bridge still depends on private data.
      - - Risk rating
        - high
        - SMB restaurant churn, macro pressure, and missing denominator data create real downside if growth quality is weaker than bulls assume.
      - - Valuation stance
        - full-to-expensive
        - Public comp multiples imply Owner needs a much larger verified revenue base before $1 billion looks disciplined.
      - - Decision implication
        - Stay engaged only if diligence can prove strong revenue, retention, and clean terms.
        - Without that proof, waiting for better evidence or better price is the rational posture.
    notes: >-
      Recommendation is explicitly price-sensitive. A stronger recommendation would require verified revenue,
      retention, gross margin, and financing-term data rather than more marketing evidence.
    claimRefs:
      - CV001
      - CV002
      - CV033
      - CV034
      - CV037
      - CV038
      - CV042
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - thesis
      - what would change the view
    rows:
      - - Structural market need
        - Independent restaurants increasingly need direct digital demand tools to offset delivery fees and chain-tech advantages.
        - If direct-ordering adoption stalls or restaurant closures stay elevated, TAM realization will look much weaker than the memo suggests.
      - - Product architecture
        - Owner's opinionated website, loyalty, SEO, and AI stack can outperform fragmented point solutions for non-technical operators.
        - If operators demand more customization than performance, or integrations remain brittle, the product advantage narrows.
      - - Customer proof
        - Reviews and case studies show some restaurants reporting faster sales growth, lower third-party fees, and higher reorder activity.
        - If those wins are highly selected and broader cohorts have weak retention or ROI, the growth story is overstated.
      - - Competition
        - Owner can coexist with Toast, Square, and Clover as a growth layer rather than a full POS replacement.
        - DoorDash, Olo, Toast, Square, Lightspeed, Popmenu, BentoBox, and others all compete for the same digital-ordering budget.
      - - Price support
        - A scarce SMB-commerce winner could deserve a premium multiple.
        - Public comps still cluster far below the implied support range for a $1 billion mark unless Owner's actual revenue is already much larger than public evidence shows.
    notes: >-
      The anti-thesis is about denominator and durability risk, not about whether the product solves a real problem.
      The company can be good while the current price is still too hard to defend.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV016
      - CV017
      - CV022
      - CV027
      - CV030
      - CV031
      - CV033
      - CV037
      - CV039
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation logic
      - implied equity value
      - implication vs $1B entry
    rows:
      - - Bull
        - >-
          Diligence proves Owner already has roughly $180M-$250M of revenue support, strong retention, healthy gross
          margin, and cap-table terms that leave real economics to new money.
        - Premium 7x-10x revenue on durable SMB commerce leadership and continued AI / growth-tool adoption.
        - $1.3B-$2.5B
        - Roughly 1.3x-2.5x gross; good company, but still short of classic top-tier venture return unless execution is exceptional.
      - - Base
        - >-
          Diligence supports meaningful growth but shows a smaller revenue base, normal SMB churn, and no extraordinary
          margin profile.
        - 4x-6x revenue on public-style restaurant-tech / commerce software discipline.
        - $0.6B-$1.2B
        - Around 0.6x-1.2x gross; acceptable only if entry terms improve materially.
      - - Bear
        - >-
          Revenue is well below public-support thresholds, churn stays elevated, and macro pressure hurts restaurant
          survival and ordering volume.
        - 2x-4x revenue on multiple compression and lower-quality growth.
        - $0.25B-$0.6B
        - Roughly 0.25x-0.6x gross; capital impairment risk is real.
      - - Return hurdle
        - To earn 3x-5x gross from a $1B entry before dilution, Owner must eventually exit around $3B-$5B+.
        - Simple entry-to-exit bridge, excluding dilution and preferences.
        - $3.0B-$5.0B+
        - Public evidence today does not prove that path.
    notes: >-
      Scenarios are deliberately framed as diligence-conditioned ranges because the public record does not reveal the
      current revenue denominator. The assumptions therefore focus on what private diligence would need to validate.
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV037
      - CV039
      - CV040
      - CV042
  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - metric
      - multiple / valuation / status
      - relevance
      - limitation
    rows:
      - - Toast
        - Market cap / TTM revenue
        - $14.54B / $6.44B = ~2.26x
        - Largest restaurant-software benchmark with 171K locations, $204B GPV, and disclosed ARR / revenue mechanics.
        - Much larger, more diversified, and already public; not a like-for-like SMB growth-layer business.
      - - Olo
        - Market cap / TTM revenue
        - $1.74B / $0.31B = ~5.61x
        - Most relevant pure-play public digital-ordering / restaurant-SaaS multiple in the retained comp set.
        - Smaller scale and different customer mix; current market cap reference is October 2025 rather than June 2026.
      - - Block / Square
        - Market cap / TTM revenue
        - $41.54B / $24.47B = ~1.70x
        - Useful lower-bound comp for restaurant-enabled commerce, payments, and seller tooling.
        - Block is far broader than restaurant tech, so the multiple blends many non-restaurant businesses.
      - - DoorDash
        - Market cap / TTM revenue
        - $67.35B / $14.72B = ~4.58x
        - Helpful comp for direct-ordering infrastructure and merchant commerce tooling through Commerce Platform.
        - Marketplace economics and global scale differ materially from Owner's SMB-focused SaaS model.
      - - SevenRooms (acquired by DoorDash)
        - Strategic M&A reference
        - $1.152B acquisition value in June 2025
        - Shows strategic buyers will pay large prices for restaurant CRM / reservations / growth software with merchant adjacency.
        - M&A value includes synergies and control premium, so it is not a clean trading multiple.
      - - Popmenu
        - Private funding milestone
        - $65M Series C in 2021; 5,000+ restaurant locations disclosed
        - Relevant private restaurant-tech SaaS comparator with all-in-one ordering and marketing positioning.
        - Public source retained here does not disclose valuation, so it is a funding reference rather than a pricing anchor.
    notes: >-
      This set is intentionally bounded to the public and quasi-public references that most directly inform Owner's
      underwriting: scaled public restaurant-commerce platforms, one adjacent strategic acquisition, and one private
      restaurant-tech round.
    enumerationScope:
