  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: recognized revenue denominator
      missingEvidence: Current recognized revenue, ARR, and revenue mix by subscription, payments, marketing, and AI products.
      whyItMatters: Without the denominator, public comp multiples cannot be mapped cleanly to the $1 billion mark.
      diligencePath: Obtain CFO revenue bridge, monthly recurring revenue deck, and audited financial statements.
      relatedQuestionRefs:
        - QV029
    - type: private-evidence-only
      severity: material
      topic: gross margin and take rate
      missingEvidence: Blended and product-level gross margin plus effective take rate on transaction-linked revenue.
      whyItMatters: Premium SaaS-like valuation requires evidence that growth converts into attractive incremental economics.
      diligencePath: Review payments economics, cloud costs, fulfillment cost pass-through, and gross margin by product line.
      relatedQuestionRefs:
        - QV030
    - type: private-evidence-only
      severity: material
      topic: retention quality
      missingEvidence: NRR, gross retention, churn drivers, and closure-adjusted cohort performance by customer segment.
      whyItMatters: SMB restaurant exposure can either be manageable or thesis-breaking depending on retention quality.
      diligencePath: Request cohort tables, churn waterfall, and customer-segment retention analysis.
      relatedQuestionRefs:
        - QV031
    - type: private-evidence-only
      severity: material
      topic: financing terms
      missingEvidence: Series C preference stack, liquidation rights, secondary/common split, and any ratchets or MFN terms.
      whyItMatters: Headline valuation may overstate the economics actually available to new investors.
      diligencePath: Review financing documents, cap table, and counsel memo.
      relatedQuestionRefs:
        - QV032
    - type: enumeration-incomplete
      severity: minor
      topic: comparable valuation table coverage
      missingEvidence: Additional private valuation references for restaurant-tech peers and more direct M&A multiples.
      whyItMatters: The comparable valuation table is decision-useful but still partial because several private-data sources were access-restricted.
      diligencePath: Pull PitchBook or Crunchbase Pro transaction records and add them to TV004 during a full-report pass.
      relatedTableRefs:
        - TV004
