sections:
  - id: thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The core investment thesis is coherent. Independent restaurants are under real pressure to look and behave online
      more like chains, while delivery marketplaces continue to tax unit economics and capture customer relationships.
      Owner positions itself as a Shopify-like growth layer for local businesses, starting with restaurants, and its
      public product packaging lines up with that story: websites, direct online ordering, branded apps, loyalty,
      marketing automation, and AI tools sold on a simple monthly plan. Public customer reviews also show enough
      evidence of genuine operator value to keep the story live. The anti-thesis is equally important. Owner serves an
      SMB-heavy restaurant base that management itself says has structurally higher churn, including churn tied to
      restaurant closures. Reviews also surface integration and fraud-control complaints, and a rival lawsuit shows the
      category is competitive enough for marketing tactics to become adversarial. So the right question is not whether
      Owner has product-market fit. It is whether that fit is durable and profitable enough to support a unicorn entry.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV016
      - CV017
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
      - FV004
  - id: financing-context-and-price-support
    title: Financing context and whether public evidence supports the price
    body: >-
      Public evidence cleanly confirms the headline financing facts: Owner raised a $120 million Series C in May 2025
      at a $1 billion valuation, co-led by Meritech and Headline. What public evidence does not confirm is the part that
      matters most for underwriting: the current revenue denominator, the mix between subscription and transaction-linked
      fees, the gross margin structure, and the true cap-table economics after the Series C. That gap matters because the
      retained public comp set trades around 1.7x-5.6x TTM revenue, with a midpoint near 3.4x. On that basis, a $1
      billion mark would imply something like $179 million of revenue even at the highest retained public comp and about
      $294 million at the median. Owner's own public pricing and restaurant-count disclosures do not disprove those
      levels, but they do not prove them either. With more than 10,000 restaurants and a public price card of $249 to
      $499 per month plus some order-linked fees, investors need diligence to show that payments, marketing, AI, and
      expansion revenue are already large enough to bridge the gap.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV018
      - CV021
      - CV023
      - CV026
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
    tableRefs:
      - TV004
    figureRefs:
      - FV002
  - id: scenarios-and-return-math
    title: Bull, base, and bear cases
    body: >-
      The bull case is not impossible, but it requires specific proof. Public comps and Owner's own price card imply
      that underwriting the current mark needs a business that is already materially larger than the public record
      reveals, with strong retention and margins that deserve a premium multiple. If diligence proves Owner already has a
      revenue base closer to the high-comp support band, with SMB churn contained and financing terms clean, then the
      company could still grow into a meaningful premium outcome. The base case is more modest: Owner is a good product
      with real market pull, but the current price only yields par-to-moderate upside if revenue and retention come in at
      normal restaurant-tech levels. The bear case is a classic private-mark problem—good company, weak denominator.
      If revenue is far lower than bulls expect, or closures and churn keep eroding cohorts, the public comp bridge can
      compress quickly. Return math reinforces the point: a $1 billion entry needs at least a $3 billion exit for a 3x
      gross and roughly $5 billion for a 5x gross before dilution. That is a high bar when public evidence is still this
      thin.
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV037
      - CV039
      - CV040
      - CV041
      - CV042
    tableRefs:
      - TV003
      - TV005
    figureRefs:
      - FV003
  - id: recommendation-exit-readiness-and-diligence
    title: Recommendation, exit readiness, and final diligence asks
    body: >-
      The correct recommendation on the public record is research-more / wait, with medium confidence, high risk, and a
      full-to-expensive valuation stance. That is not a dismissal of the company. Owner appears to be building a real
      growth layer for independent restaurants, and adjacent strategic activity—such as DoorDash paying $1.152 billion
      for SevenRooms—shows that restaurant-software assets can become strategically valuable. But public investors are
      not paying unicorn prices for restaurant-tech businesses without scale and disclosure, and the current record does
      not show enough to assume Owner is already there. Exit readiness is therefore not proven. To justify buying at the
      last round price, diligence would need to confirm a much larger high-quality revenue base, strong retention,
      resilient gross margins, and terms that leave real upside to new money. If those checks come back strong, the price
      can be revisited. If they do not, the disciplined move is to keep following the company rather than forcing a
      stretched entry.
    claimRefs:
      - CV029
      - CV032
      - CV037
      - CV038
      - CV040
      - CV042
    tableRefs:
      - TV006
