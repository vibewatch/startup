evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control
    missingEvidence: Board committee assignments, observer seats, voting control, and share-class economics for current investors.
    whyItMatters: >-
      These terms determine real governance power and downside protection, which public board-name disclosures cannot
      answer.
    diligencePath: >-
      Request the current cap table, investor-rights summary, board observer list, and committee charters from
      management or counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: A company-confirmed financing ledger reconciling official round math with Sacra and Tracxn total-funding figures.
    whyItMatters: >-
      Exact lifetime capital raised affects dilution analysis and whether side financings, SAFE conversions, or small
      follow-ons were omitted publicly.
    diligencePath: >-
      Request a round-by-round financing table from management, board materials, or counsel that reconciles every
      primary capital event.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Any debt, warehouse, credit, or secondary-liquidity documentation associated with Owner's financing history.
    whyItMatters: >-
      A $1 billion valuation alone does not reveal senior claims, repayment obligations, or insider-liquidity dynamics
      that could affect underwriting.
    diligencePath: >-
      Request debt schedules, side letters, and any employee or investor secondary-sale history alongside the primary
      financing documents.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-offices
    missingEvidence: >-
      A current employee count, departmental mix, and office list verified by management rather than market-data
      providers.
    whyItMatters: >-
      Operating scale, burn, and execution capacity cannot be underwritten cleanly from conflicting third-party
      headcount estimates alone.
    diligencePath: Request a current org chart, active headcount report, and office census as of the run date.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: A management-confirmed current ARR, revenue run-rate, and gross-margin bridge.
    whyItMatters: >-
      Valuation diligence cannot be completed responsibly with only a single third-party estimate and no official
      revenue disclosure.
    diligencePath: Request the latest board deck or KPI pack showing ARR, revenue, net revenue retention, and margin trends.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public-leadership-enumeration
    missingEvidence: >-
      A full executive roster that confirms whether the current public leadership page omits any material operators or
      committee-level leaders.
    whyItMatters: >-
      The public roster is helpful but may not capture the complete management bench needed to assess succession and
      execution depth.
    diligencePath: Request an executive org chart and leadership offsite materials to verify reporting lines and role scope.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market sizing
    missingEvidence: >-
      A public U.S. dataset that isolates independent-restaurant spend on first-party ordering, websites, CRM, and
      loyalty as one software bundle.
    whyItMatters: Without that segmentation, public TAM figures remain broad lenses rather than a clean Owner.com SAM or SOM.
    diligencePath: >-
      Request internal category sizing, win-loss coding, and an external third-party survey segmented by independent
      restaurants and software module spend.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: independent restaurants
    missingEvidence: >-
      A current split of independent versus chain restaurant locations that is directly tied to software adoption rates
      and budget levels.
    whyItMatters: >-
      Public industry reports discuss independents and chains, but they do not provide a clean, software-usable
      denominator for Owner.com sizing.
    diligencePath: >-
      Request management's customer mix assumptions, external panel data by restaurant ownership type, and attach-rate
      evidence by segment.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: >-
      A harmonized methodology that maps restaurant-tech, restaurant-POS, and general POS-software estimates into one
      comparable scope.
    whyItMatters: >-
      Public TAM claims currently mix incompatible categories, which can overstate or understate Owner.com's true
      addressable spend.
    diligencePath: >-
      Rebuild sizing bottom-up from restaurant count, segment mix, module adoption, and ACV rather than relying on one
      headline market report.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: valuation diligence
    missingEvidence: >-
      Owner.com's ACV, gross retention, net revenue retention, sales payback, and attach rates by segment and product
      module.
    whyItMatters: >-
      The market may be attractive while unit economics or retention are weak, and public sources cannot answer that
      underwriting question.
    diligencePath: >-
      Request cohort retention, sales efficiency, gross margin by product, and attach-rate bridges for ordering,
      websites, loyalty, and apps.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: minor
    topic: switching costs
    missingEvidence: Implementation duration, migration burden, and churn/win-back data versus Toast, Square, Popmenu, and BentoBox.
    whyItMatters: >-
      Public product pages show what vendors sell but do not reveal how costly it is for restaurants to rip and replace
      or add a bundle.
    diligencePath: >-
      Request implementation playbooks, migration timelines, churn reasons, and competitive displacement data by
      segment.
    relatedQuestionRefs:
      - QM020
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current contract-level pricing, implementation fees, processing economics, and negotiated discounts remain
      undisclosed for BentoBox, Olo, Lunchbox, and many enterprise or custom plans across the peer set.
    whyItMatters: >-
      Without real proposals or signed order forms, public-web pricing can misstate the true TCO gap between Owner.com
      and its most capable rivals, especially those that subsidize software through payments or enterprise bundles.
    diligencePath: >-
      Request current price books, sample MSAs, and recent signed proposals for Owner.com, Toast, Square, SpotOn, Olo,
      Lunchbox, BentoBox, and DoorDash merchant contracts; compare software, implementation, and effective payment take
      rates on a common transaction mix.
    relatedQuestionRefs:
      - QP011
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-win-loss-data
    missingEvidence: >-
      There is little public evidence showing actual restaurant win-loss rates, churn reasons, or migration flows
      specifically between Owner.com and named competitors.
    whyItMatters: >-
      Category overlap does not prove competitive intensity. Investment judgment improves materially if the team can
      show where Owner.com wins consistently, where it loses, and whether those results correlate with restaurant size,
      existing POS, or channel mix.
    diligencePath: >-
      Request a last-twelve-month competitive win-loss log, churn analysis by replacement vendor, and customer
      references that switched from Toast, Square, SpotOn, Popmenu, or ChowNow to Owner.com.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: data-portability-and-lock-in
    missingEvidence: >-
      The fetched public sources do not fully document guest-data portability, migration SLAs, or cancellation workflows
      for Owner.com versus rivals.
    whyItMatters: >-
      Lock-in is central to competitive durability. If customer data, SEO assets, menus, and marketing lists are more
      portable than vendors imply, the moat is weaker; if they are less portable, buyer friction is higher.
    diligencePath: >-
      Review export tools, API terms, offboarding process docs, and sample migration checklists for Owner.com, Square,
      SpotOn, ChowNow, and DoorDash Online Ordering.
    relatedQuestionRefs:
      - QP015
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition-and-mix
    missingEvidence: >-
      Current ARR, net revenue by stream, and the accounting treatment for guest-support fees, delivery pass-through,
      POS, and future AI modules.
    whyItMatters: >-
      Without stream-level revenue and recognition policy, it is impossible to separate recurring software revenue from
      service-like or pass-through economics.
    diligencePath: >-
      Request a monthly revenue waterfall, plan mix by active location, and the revenue-recognition memo used by finance
      and auditors.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-retention
    missingEvidence: CAC, CAC payback, sales-and-marketing spend, gross retention, and net revenue retention by cohort.
    whyItMatters: >-
      Owner’s GTM narrative is strong, but without cohort metrics the month-to-month contract model cannot be
      underwritten for durability.
    diligencePath: >-
      Request quarterly CAC, payback, AE productivity, gross retention, NRR, and churn split between closures and
      voluntary product churn.
    relatedQuestionRefs:
      - QI009
      - QI014
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-contribution-margin
    missingEvidence: >-
      Gross margin, contribution margin, and cost allocation across subscriptions, guest fees, support, delivery, POS,
      and chargeback protection.
    whyItMatters: This is the core unknown separating a high-quality software model from a lower-margin service-heavy operation.
    diligencePath: >-
      Request gross-profit bridge by stream, support headcount cost, delivery-support cost, implementation cost per
      site, and capex/hardware exposure.
    relatedQuestionRefs:
      - QI018
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: Current cash, monthly burn, runway scenarios, and any debt, leases, or covenant-bearing obligations.
    whyItMatters: >-
      A $120 million Series C is encouraging, but capital adequacy cannot be judged without liquidity and leverage
      disclosure.
    diligencePath: Request the latest board deck, balance sheet, cash-flow forecast, and debt schedule with covenant summary.
    relatedQuestionRefs:
      - QI024
      - QI025
  - type: missing-source
    severity: material
    topic: public-architecture-docs
    missingEvidence: >-
      A public API reference, developer portal, architecture diagram, or service-topology description for Owner’s
      ordering, POS, or marketplace stack.
    whyItMatters: >-
      Without technical documentation, diligence cannot assess extensibility, integration boundaries, data ownership
      controls, or likely failure domains beyond marketing copy and help-center steps.
    diligencePath: >-
      Request architecture diagrams, API documentation, integration inventory, and sample failure-handling runbooks from
      product or engineering leadership.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-sla
    missingEvidence: >-
      A public or diligence-room status page, uptime history, SLA commitments, incident-postmortem set, and support
      response metrics for Owner web, app, POS, and AI phone workflows.
    whyItMatters: >-
      Owner now touches live ordering, POS, marketplace sync, and phone channels, so availability and incident recovery
      matter directly to restaurant revenue and labor.
    diligencePath: >-
      Request uptime logs, support SLAs, incident reports, escalation procedures, and customer references focused on
      outages or recovery quality.
    relatedQuestionRefs:
      - QE027
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: ai-controls
    missingEvidence: >-
      Technical documentation on model providers, evaluation criteria, human-review rules, escalation thresholds, and
      quality controls for AI SEO, AI marketing, and AI phone ordering.
    whyItMatters: >-
      AI is one of Owner’s headline differentiators, but public marketing copy does not show whether the systems are
      accurate, safe, or operationally reliable enough for customer-facing use.
    diligencePath: >-
      Request an AI architecture brief, model/vendor list, call-escalation data, prompt/guardrail policy, and QA metrics
      for customer-facing AI features.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE003
      - TE005
  - type: private-evidence-only
    severity: minor
    topic: payments-compliance
    missingEvidence: >-
      Public PCI or payments-compliance artefacts, card-present processor details for Owner POS, and a documented
      chargeback-operations workflow.
    whyItMatters: >-
      Payments are central to the new POS layer, and public materials currently explain the online-order processor more
      clearly than the in-store payments control plane.
    diligencePath: >-
      Request processor agreements, compliance attestations, chargeback-loss data, and operational controls for Owner
      POS and Owner Tablet payments.
    relatedQuestionRefs:
      - QE013
      - QE017
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, and cohort retention by account vintage, segment, and location count.
    whyItMatters: >-
      Public proof today shows satisfaction and repeat-order mechanics, but not the SaaS durability math needed to
      underwrite long-term revenue quality.
    diligencePath: >-
      Request customer-cohort tables by start month, location count, and product bundle, plus renewal and churn
      definitions used internally.
    relatedQuestionRefs:
      - QU019
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Largest-customer share, top-10 ARR share, revenue by size band, and channel-partner contribution to signed ARR.
    whyItMatters: A 10,000+ logo count suggests breadth, but concentration risk is a revenue question, not a logo question.
    diligencePath: >-
      Request a concentration schedule, ARR by customer size bucket, and revenue split between single-location,
      multi-location, and strategic accounts.
    relatedQuestionRefs:
      - QU022
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: active-denominators
    missingEvidence: >-
      Active restaurants, active locations, monthly active consumers, and order-frequency denominators separate from
      cumulative counts, installs, or ratings.
    whyItMatters: >-
      Breadth claims can look stronger than actual usage if active accounts and active diners are not separated from
