  "title": "Market Analysis"
  "summary": "Owner.com sits inside the restaurant software stack that helps independents capture first-party demand, not inside the entire restaurant industry spend pool. Public evidence supports a large and growing restaurant-tech backdrop, but the directly relevant market is narrower: website-embedded ordering, marketing automation, loyalty, guest data, and adjacent restaurant-OS integrations sold to margin-constrained operators who are trying to reduce reliance on third-party delivery platforms."
"sections":
- "id": "market-boundary-and-sizing"
  "title": "Market boundary and sizing lenses"
  "body": "Owner.com should be underwritten against restaurant software budgets, not against total restaurant consumer spend. National Restaurant Association data shows the U.S. restaurant end-market is enormous at $1.55 trillion of projected 2026 sales, but that figure is the ceiling of restaurant commerce, not the software pool available to Owner.com. The more relevant included spend is software that helps an operator capture and retain first-party demand: website-embedded ordering, owned web and mobile touchpoints, guest CRM, marketing automation, loyalty, and the payment or POS integrations needed to run those workflows. Excluded spend includes food, labor, rent, generic marketplace take rates, and broader hardware or infrastructure budgets that do not flow to an Owner-like vendor. Public market reports confirm demand but disagree on scope. Technavio forecasts $13.4 billion of restaurant-technology market growth through 2029, while Precedence values restaurant POS terminals at $26.04\
    \ billion in 2025 and broader POS software at $16.37 billion in 2025. Those numbers are useful only as lenses because they measure different layers of the stack. The practical SAM for Owner.com is therefore narrower than the headline restaurant-tech or restaurant-spend numbers and sits inside the first-party ordering-plus-guest-relationship bundle."
