  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-economics
      missingEvidence: >-
        Owner does not publicly disclose merchant churn, gross retention, net retention, module
        attach rate by cohort, or same-store order growth after onboarding.
      whyItMatters: >-
        The month-to-month contract structure makes retention behavior more important than contract
        backlog, and public review evidence suggests support quality and integration success could
        move churn quickly.
      diligencePath: >-
        Request quarterly merchant logo churn, gross and net revenue retention, cohort-level same-
        store order growth, and churn reasons split by product bundle and restaurant size.
      relatedQuestionRefs:
        - QR013
        - QR023
      relatedTableRefs:
        - TR002
        - TR004
    - type: private-evidence-only
      severity: blocking
      topic: messaging-compliance
      missingEvidence: >-
        No public source confirms Owner's 10DLC registration status, consent-record architecture,
        suppression handling, or complaint and carrier-block history.
      whyItMatters: >-
        Automated text marketing is a core feature, and TCPA exposure can be disproportionate to
        contract value if consent or opt-out controls are weak.
      diligencePath: >-
        Obtain 10DLC campaign registrations, carrier approval records, opt-in capture flows,
        suppression logs, complaint rates, and outside-counsel compliance memo.
      relatedQuestionRefs:
        - QR006
        - QR029
      relatedTableRefs:
        - TR001
        - TR005
    - type: private-evidence-only
      severity: material
      topic: payments-losses
      missingEvidence: >-
        Public sources do not disclose chargeback rates, fraud-loss rates, reimbursement timelines,
        reserve policy, or the actual scope of Owner's chargeback-protection program.
      whyItMatters: >-
        The contract puts refunds and chargebacks on merchants even while marketing promises
        chargeback protection, so economics and merchant trust depend on the practical details.
      diligencePath: >-
        Request loss waterfalls, dispute-rate trends, Stripe program structure, merchant reimbursements,
        and any insurance or reserve arrangements tied to payments.
      relatedQuestionRefs:
        - QR005
        - QR020
      relatedTableRefs:
        - TR002
        - TR004
    - type: missing-source
      severity: material
      topic: public-incidents
      missingEvidence: >-
        The reviewed public source pack did not surface counsel-grade confirmation of litigation,
        security incidents, uptime history, or regulator inquiries beyond the Popmenu dispute.
      whyItMatters: >-
        Absence of a press hit is not evidence of absence, especially for a company operating payments,
        marketing communications, and restaurant websites at scale.
      diligencePath: >-
        Run PACER and state-court searches on the legal entity, review insurance claims, and request
        incident register, outage log, and regulator-complaint history for the prior 24 months.
      relatedQuestionRefs:
        - QR010
        - QR025
      relatedTableRefs:
        - TR001
        - TR002
    - type: private-evidence-only
      severity: material
      topic: integration-slas
      missingEvidence: >-
        No public source gives integration uptime, sync-failure rates, top-ticket categories, or peak-
        period incident counts across Square, Clover, Toast, Otter, delivery partners, and app launches.
      whyItMatters: >-
        Review complaints already show troubleshooting and compatibility friction; without telemetry it is
        impossible to determine whether those complaints are edge cases or a scaling pattern.
      diligencePath: >-
        Request integration-level uptime, incident severity history, queue-time metrics, and customer-
        support reopen rates for the top five merchant environments.
      relatedQuestionRefs:
        - QR012
        - QR022
      relatedTableRefs:
        - TR002
        - TR004
