  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - SMS / email compliance failure
        - Consumer complaints, opt-out failures, or carrier blocks
        - Any regulator inquiry, class action, or 10DLC suspension tied to live campaigns
        - Treat as thesis-break until consent capture and suppression controls are independently verified.
      - - Merchant churn acceleration
        - Review-site deterioration, rising cancellations, weaker same-store order growth
        - Churn or downgrades rise materially once POS/app/marketing bundles are live
        - Re-underwrite retention, CAC payback, and customer-support scale before investing more.
      - - Chargeback / fraud leakage
        - Rising dispute volume or delayed merchant reimbursement
        - Chargebacks exceed management targets or protection program is materially narrower than messaging implies
        - Demand reserve policy and dispute-loss economics before underwriting payments upside.
      - - App or search-platform policy shock
        - App review delays, removals, or profile-ownership conflicts
        - Branded app launch cadence slips or Google visibility declines for reference customers
        - Reduce confidence in mobile reordering and SEO-led acquisition moat.
      - - Integration instability
        - POS sync failures, menu drift, or printer/order-routing incidents
        - Repeated peak-hour disruptions among top integrations
        - Treat integration engineering as gating diligence, not a routine roadmap item.
      - - Restaurant macro stress
        - Higher closure rates, lower profitability, weaker delivery economics
        - SMB restaurant closures or non-profitability remain elevated while Owner keeps selling into independents
        - Expect correlated churn risk and slower upsell despite healthy product demand.
      - - Competitive bundling / valuation reset
        - Larger rivals discount or bundle direct-ordering, app, and payments products
        - Toast, DoorDash, or others narrow feature gaps while Owner still lacks public ARR and margin disclosure
        - Underwrite downside to pricing power and next-round valuation support.
    notes: >-
      These are underwriting triggers rather than predictions; each is monitorable from public
      evidence or private diligence requested directly from the company.
