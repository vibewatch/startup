- id: FU002
  title: Adoption / deployment funnel
  type: funnel
  layout: standard
  summary: Public evidence is strongest at top-of-funnel account counts and weakest at the bottom of the funnel where active cohorts and retention should appear.
  data:
    items:
    - label: Awareness / inbound demand
      value: 100
      description: Owner says 70%+ of customers came inbound, implying a strong content-and-brand-led top of funnel.
    - label: Signed restaurant accounts
      value: 72
      description: Public milestones moved from 1,000+ restaurants in 2023 to 2,000+ in early 2024 and 10,000+ by 2025.
    - label: Consumer surface
      value: 45
      description: Public consumer milestones moved from 3,000,000 restaurant customers in the prior 3 years to 60,000,000+ consumers in the Series C memo.
    - label: Deepened repeat behavior
      value: 18
      description: Case studies and product pages show reorders, loyalty enrollment, app installs, and walk-in capture, but not true retention cohorts.
    - label: Audited durability disclosure
      value: 4
      description: Public NRR, GRR, churn, and active-account denominators are largely absent.
