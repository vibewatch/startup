- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Factor
  - Public evidence
  - Upside
  - Risk / limitation
  - Diligence path
  rows:
  - - Module expansion inside an account
    - Website, ordering, app, loyalty, marketing, and POS are sold as one stack
    - Supports attach-rate growth and deeper workflow lock-in
    - No public attach-rate or module-level NRR disclosure
    - Request product penetration by customer cohort
  - - Multi-location rollout
    - Mattenga’s, Saffron, Ashley’s growth plan, and Talkin Tacos location expansion
    - Suggests Owner can follow customers into new stores
    - No data on cross-location adoption success or churn by store
    - Request location-level activation and retention curves
  - - Inbound-led customer acquisition
    - Series B memo says 70%+ of customers came inbound
    - Lower dependence on outbound sales or channel resellers
    - May imply dependence on SEO/content performance staying strong
    - Request CAC split by inbound, outbound, partner, and referral
  - - Large logo breadth
    - 10,000+ restaurants claimed by 2025
    - Logo base likely reduces extreme single-account concentration
    - No top-10 ARR share or largest-customer exposure disclosed
    - Request customer concentration schedule and revenue-by-size-band
  - - Third-party marketplace coexistence
    - Pricing FAQ says most customers keep third-party apps as a marketing channel
    - Owner can land without forcing a full channel reset
    - Customer economics still depend partly on marketplace behavior and fees
    - Request share of GMV that remains third-party versus direct after adoption
  notes: Public evidence supports a credible land-and-expand story, but concentration and post-adoption channel mix remain under-disclosed.
