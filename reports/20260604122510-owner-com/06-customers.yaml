tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Geography / size
  - Primary use case
  - Public proof
  - Key gap
  rows:
  - - Single-location independent restaurants
    - Buyer=payer=owner or operator; users=staff and guests
    - Primarily U.S.; often 1 location
    - Website, direct ordering, app, loyalty, marketing
    - Podcast, memos, reviews, and many case studies frame Owner around independents
    - No disclosed share of base by revenue band or cuisine
  - - Multi-location independent groups
    - Buyer=payer=owner group or GM; users=multi-store ops teams and guests
    - Examples range from 4 to 7+ locations
    - Standardize digital stack and grow direct sales across locations
    - Mattenga’s (7), Saffron (4), Talkin Tacos (6) and Ashley’s growth plan to 7
    - No public count of multi-location accounts or locations on platform
  - - Fast-casual and QSR concepts
    - Buyer=operator or founder; users=counter staff and off-premise guests
    - Highly visible in pizza, tacos, gyros, kebab, fried chicken
    - Reduce marketplace fee leakage and improve direct-order conversion
    - Talkin Tacos, Metro Pizza, Gyro Concept, HillCrust, San Diego Kabob Shack
    - No disclosed share of GMV from QSR versus full-service
  - - Full-service, cafes, and diners
    - Buyer=owner or manager; users=front-of-house staff and guests
    - Visible but less dominant than QSR
    - Capture walk-ins, simplify ordering, drive repeat business
    - Ashley’s Cafe, Doo-Dah Diner, Saffron, Rig A’ Tony’s
    - Public materials do not separate dine-in-heavy from delivery-heavy accounts
  - - Operational staff as internal users
    - Buyer=payer=restaurant; users=GMs, cashiers, kitchen and support staff
    - All sizes
    - Manage orders, menus, hours, alerts, and consolidated tablets
    - Owner App, POS pages, Ashley’s and Gyro case studies
    - No public seat-count or user-adoption disclosure
  - - Restaurant guests as product end users
    - Buyer=payer=restaurant, but user=guest ordering direct
    - Millions of consumers claimed
    - Order, re-order, join loyalty, download branded apps
    - Series C memo, app pages, and case studies with app-download metrics
    - Owner does not publish active guest cohorts or reorder by guest segment
  notes: Segments are derived from public positioning, named case studies, and contract language rather than a management-published customer-mix schedule.
