- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Public outcome
  - Limitation
  rows:
  - - Metro Pizza
    - Multi-unit independent pizza chain
    - Website, direct ordering, branded app, hybrid delivery
    - Production
    - $112K/month direct online sales and 11,000 app installs in 90 days
    - Owner-supplied case study; no third-party financial audit
  - - Talkin Tacos
    - Fast-growing taco concept
    - Direct ordering, branded app, loyalty, SEO acquisition
    - Production
    - $120K/month direct online sales, 10,000 app installs, 40,000-customer database
    - Highly curated success story; no cohort retention table
  - - Mattenga’s Pizzeria
    - Seven-location pizza group
    - On-domain ordering, app, SEO, loyalty, automated marketing
    - Production
    - $192K sales growth in 30 days and 15,000 more online orders
    - Growth window is short-term and company-selected
  - - Saffron Indian Kitchen
    - Four-location Indian restaurant group
    - Direct ordering, SEO, branded app, loyalty
    - Production
    - $175K/month direct online sales and 630+ new Google customers each month
    - No independent corroboration of Google-attributed conversion
  - - Ashley’s Cafe
    - Single-location cafe with expansion plan
    - Owner POS, walk-in capture, app-led repeat marketing
    - Production
    - ~$40K to ~$70K monthly sales and walk-in capture from ~21% to 65%
    - POS case study is still company-authored
  - - Karv Greek Kouzina / Gyro Concept
    - Independent Greek fast-casual operators
    - SEO, app ordering, loyalty, direct-order migration
    - Production
    - Karv reached $40K/month online sales; Gyro reached $194K/year and 270+ app reorders
    - Shows proof breadth, but still from Owner case studies
  notes: Rows enumerate publicly named production deployments with quantified outcomes. Coverage is partial because Owner does not publish a full customer ledger or failed / pilot deployments.
  enumerationScope:
    coverage: partial
    basis: Enumeration includes public named Owner restaurant case studies with accessible outcome detail plus third-party directory corroboration where available; it excludes undisclosed customers, logo-only references, and any customers without accessible evidence at this run date.
