  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, and cohort retention by account vintage, segment, and location count.
    whyItMatters: Public proof today shows satisfaction and repeat-order mechanics, but not the SaaS durability math needed to underwrite long-term revenue quality.
    diligencePath: Request customer-cohort tables by start month, location count, and product bundle, plus renewal and churn definitions used internally.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Largest-customer share, top-10 ARR share, revenue by size band, and channel-partner contribution to signed ARR.
    whyItMatters: A 10,000+ logo count suggests breadth, but concentration risk is a revenue question, not a logo question.
    diligencePath: Request a concentration schedule, ARR by customer size bucket, and revenue split between single-location, multi-location, and strategic accounts.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: active-denominators
    missingEvidence: Active restaurants, active locations, monthly active consumers, and order-frequency denominators separate from cumulative counts, installs, or ratings.
    whyItMatters: Breadth claims can look stronger than actual usage if active accounts and active diners are not separated from cumulative tallies.
    diligencePath: Request monthly active restaurant, location, and guest metrics together with definitions and the reconciliation between logos, consumers, and order volume.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-coverage
    missingEvidence: A public ledger of live customers including customers with modest outcomes, pilots, failed rollouts, and churned accounts.
    whyItMatters: The public evidence set is curated toward success stories, so named-customer proof may overstate average outcome quality if the full base looks less impressive.
    diligencePath: Ask management for a customer-reference list segmented by size, tenure, and outcome quality plus a balanced set of neutral and at-risk references.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU003
