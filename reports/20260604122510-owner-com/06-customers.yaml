- id: retention-and-durability-proxies
  title: Retention, repeat usage, and durability proxies
  body: 'Durability is the most important unanswered question in the public record. Owner provides a clear mechanism for repeat behavior: the product bundle pushes restaurants toward on-domain ordering, branded apps, loyalty, automated email and text campaigns, and guest-data capture. Product pages claim mobile apps produce about 2x reorder rates or 85% more repeat orders, and named case studies repeatedly mention loyalty enrollment, reorders, or larger captured audiences. Independent review surfaces are directionally positive as well, with strong Capterra scores and an operator app with a large rating base. Some reviews also imply non-trivial tenure: Capterra includes a restaurant customer who said it had been with Owner for over two years. Still, none of the reviewed public sources disclose NRR, GRR, logo churn, renewal rates, contract-length distribution, or cohort retention by segment. The public record therefore supports a plausible durability mechanism and healthy satisfaction proxies,
    but not an investable retention model. For diligence, the missing renewal math matters more than another success-story quote.'
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  tableRefs:
  - TU004
- id: expansion-concentration-and-friction
  title: Expansion, concentration, channel dependence, and procurement friction
  body: Owner’s land-and-expand motion is visible even if the company does not publish formal cohort tables. The same restaurant often starts with a website and ordering flow, then layers in branded apps, loyalty, automated marketing, POS integration, and multi-location rollout. That bundle depth is good for expansion revenue and stickiness. The main public risks are elsewhere. First, concentration is hard to underwrite because no reviewed source discloses top-customer revenue share, top-10 ARR concentration, or customer mix by size band despite the 10,000+ restaurant claim. Second, Owner is not trying to replace third-party delivery overnight; its pricing FAQ explicitly says most customers keep marketplace apps as a marketing channel and then try to convert those diners to direct orders. Third, implementation is not frictionless for every operator. Independent reviews repeatedly mention POS/menu-sync limitations, limited customization, and support delays or inconsistent follow-through.
    The good news is that procurement friction is lower than at many restaurant software vendors because Owner prices month-to-month with no long-term contracts. The tradeoff is that setup fees are non-refundable and some hardware or transaction fees can still matter, so buyers are not entering a zero-friction relationship.
