  - - 2024-01 TechCrunch
    - Customer base and processing scale
    - Thousands of customers; hundreds of millions processed annually
    - 'High: TechCrunch interview-based reporting'
    - Shows the platform had already become material in transaction flow
    - No exact restaurant count or average order volume per account
  - - 2024 Series B memo
    - Restaurant and consumer footprint
    - 2,000+ restaurants; 3,000,000+ restaurant customers in prior 3 years
    - 'High: official memo'
    - Provides the clearest early restaurant/consumer milestone pair
    - Still cumulative usage, not current active locations
  - - 2025 Series C memo
    - Current scale claim
    - 10,000+ restaurants; 60,000,000+ consumers
    - 'High: official memo'
    - Suggests a large SMB restaurant footprint by 2025
    - No active-location or MAU disclosure
  - - 2025 Restaurant Business Online
    - Current restaurant count
    - 10,000+ restaurants
    - 'High: trade press quoting company'
    - Independent corroboration for current logo breadth
    - No top-customer or cohort detail
  - - 2026 App Store surface
    - Operator-app adoption proxy
    - 4.8/5 from 933 ratings
    - 'High: App Store live surface'
    - Shows a meaningful operator-side usage footprint
    - Ratings are not the same as paid restaurants or active locations
  notes: The public trajectory is strongest on top-line breadth and weakest on active-use denominators such as MAU, order frequency, active locations, or churn-adjusted net adds.
