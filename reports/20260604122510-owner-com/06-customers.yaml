- id: TU006
  title: Procurement, implementation, and channel friction table
  columns:
  - Friction point
  - Public evidence
  - Customer impact
  - Confidence
  - Mitigant / counterpoint
  rows:
  - - Contract structure
    - Month-to-month with no long-term contracts or cancellation fees
    - Lowers buying resistance for SMB operators
    - High
    - Still not a zero-cost decision because setup and transaction economics matter
  - - Setup / fee complexity
    - RPA allows non-refundable setup fees plus transaction, delivery, tablet, and printer fees depending on configuration
    - Can complicate price comparison and early ROI
    - High
    - Flat-rate plan removes restaurant fee at higher direct-order volume
  - - POS integration coverage
    - Native with Square and Clover; broader support via Otter; tablet / printer fallback available
    - Integration fit can shape implementation speed
    - High
    - Officially included at no extra charge
  - - Menu sync / customization limits
    - Independent reviews cite POS sync gaps, limited customization, and missing features
    - Can slow rollout or create operator dissatisfaction
    - Medium
    - Many reviewers still praise ease of use and onboarding
  - - Support consistency
    - Independent reviews include support-delay and poor follow-through complaints
    - Could weaken renewals if issues persist
    - Medium
    - Capterra and official reviews still show many strong support comments
  notes: The procurement motion is easier than contract-heavy restaurant software, but implementation still depends on POS fit, feature needs, and support execution.
