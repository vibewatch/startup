artifact: customers
slug: owner-com
runDate: '2026-06-04'
company:
  name: Owner.com
chapter:
  number: 6
  title: Customers
  summary: 'Owner’s public customer evidence is unusually concrete for an SMB restaurant software vendor: official and third-party sources support a path from 1,000+ restaurants in 2023 to 2,000+ in early 2024 and 10,000+ by 2025, while multiple named restaurant case studies show live production outcomes. The blind spots are classic diligence gaps rather than lack of logos: public NRR/GRR/churn and concentration schedules are absent, and independent reviews still surface implementation, customization, and support friction.'
sections:
- id: segmentation-and-buyer-map
  title: Customer segmentation and buyer / user / payer map
  body: 'Owner’s customer base is easier to define by ownership model and operating need than by classic SaaS seat counts. Public materials consistently target independent restaurant owners and operators who need chain-like digital tools without hiring internal product, marketing, or engineering teams. The economic buyer and payer is the restaurant business itself, usually represented by an owner, operator, general manager, or managing partner. The end user is split: staff members use the operational surfaces such as POS, reporting, ordering management, and the Owner App, while restaurant guests use the branded website, ordering flow, loyalty program, and mobile app that Owner powers on the restaurant’s behalf. Public proof also shows meaningful size variation inside the ICP. Some customers are single-location independents, but others are already multi-location groups such as Saffron, Mattenga’s, and Talkin Tacos. What remains opaque is the exact mix by geography, revenue band, or account
    size: Owner is explicit about independent-restaurant focus and special rates for multi-location operators, but it does not publish a clean segmentation schedule of active locations, ARR bands, or average account size.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
