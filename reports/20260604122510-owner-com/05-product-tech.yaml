  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "public-architecture-docs"
      missingEvidence: "A public API reference, developer portal, architecture diagram, or service-topology description for Owner’s ordering, POS, or marketplace stack."
      whyItMatters: "Without technical documentation, diligence cannot assess extensibility, integration boundaries, data ownership controls, or likely failure domains beyond marketing copy and help-center steps."
      diligencePath: "Request architecture diagrams, API documentation, integration inventory, and sample failure-handling runbooks from product or engineering leadership."
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability-and-sla"
      missingEvidence: "A public or diligence-room status page, uptime history, SLA commitments, incident-postmortem set, and support response metrics for Owner web, app, POS, and AI phone workflows."
      whyItMatters: "Owner now touches live ordering, POS, marketplace sync, and phone channels, so availability and incident recovery matter directly to restaurant revenue and labor."
      diligencePath: "Request uptime logs, support SLAs, incident reports, escalation procedures, and customer references focused on outages or recovery quality."
      relatedQuestionRefs: [QE027]
      relatedTableRefs: [TE004]
    - type: "missing-source"
      severity: "material"
      topic: "ai-controls"
      missingEvidence: "Technical documentation on model providers, evaluation criteria, human-review rules, escalation thresholds, and quality controls for AI SEO, AI marketing, and AI phone ordering."
      whyItMatters: "AI is one of Owner’s headline differentiators, but public marketing copy does not show whether the systems are accurate, safe, or operationally reliable enough for customer-facing use."
      diligencePath: "Request an AI architecture brief, model/vendor list, call-escalation data, prompt/guardrail policy, and QA metrics for customer-facing AI features."
      relatedQuestionRefs: [QE026]
      relatedTableRefs: [TE003, TE005]
    - type: "private-evidence-only"
      severity: "minor"
      topic: "payments-compliance"
      missingEvidence: "Public PCI or payments-compliance artefacts, card-present processor details for Owner POS, and a documented chargeback-operations workflow."
      whyItMatters: "Payments are central to the new POS layer, and public materials currently explain the online-order processor more clearly than the in-store payments control plane."
      diligencePath: "Request processor agreements, compliance attestations, chargeback-loss data, and operational controls for Owner POS and Owner Tablet payments."
      relatedQuestionRefs: [QE013, QE017]
      relatedTableRefs: [TE004]
