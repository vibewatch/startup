  claims:
    - id: "CE001"
      statement: "Owner’s main product surface spans discovery tools, ordering, apps, loyalty, marketing, analytics, POS, and integrations rather than a single checkout widget."
      type: "observed"
      topic: "product-suite"
      sourceRefs: [SE001, SE002]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: [QE001, QE002]
    - id: "CE002"
      statement: "Owner publicly offers a $249 per month plan plus a 5% restaurant fee per order and a $499 per month flat-rate plan, and both are marketed as month-to-month with no long-term contracts."
      type: "observed"
      topic: "pricing"
      sourceRefs: [SE002, SE006]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: [QE003, QE016]
    - id: "CE003"
      statement: "Owner’s own workflow page describes a loop of Google discovery, direct online ordering, mobile app and rewards adoption, and automated remarketing."
      type: "observed"
      topic: "workflow"
      sourceRefs: [SE003, SE005]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE001, QE006]
    - id: "CE004"
      statement: "Owner says it replaces a restaurant’s existing website, redirects the domain, and often launches the new online presence within about one to two weeks."
      type: "company-claimed"
      topic: "website-implementation"
      sourceRefs: [SE004]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE004, QE005, QE016]
    - id: "CE005"
      statement: "Owner explicitly says restaurants seeking extensive design freedom are not a fit because it prioritizes a proven sales-oriented website design over open-ended customization."
      type: "company-claimed"
      topic: "standardization"
      sourceRefs: [SE004]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE004, QE023]
    - id: "CE006"
      statement: "Owner positions direct online ordering as a way to avoid marketplace fees while turning each direct order into first-party customer data that the restaurant can keep."
      type: "company-claimed"
      topic: "direct-ordering-economics"
      sourceRefs: [SE005, SE012]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE006]
    - id: "CE007"
      statement: "Owner says it has native POS integrations with Square and Clover and broader connectivity to other systems, with tablet or printer options for restaurants that prefer that setup."
      type: "company-claimed"
      topic: "integrations"
      sourceRefs: [SE005, SE006]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE014, QE016]
    - id: "CE008"
      statement: "Owner POS is marketed as one platform for in-store, online, and delivery orders with one menu, one customer list, and one dashboard."
      type: "company-claimed"
      topic: "pos-unification"
      sourceRefs: [SE006, SE011]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE001, QE012]
    - id: "CE009"
      statement: "Owner says POS checkout can capture guest phone numbers for loyalty, app download prompts, and automated marketing, extending the CRM loop to walk-in traffic."
      type: "company-claimed"
      topic: "pos-crm-loop"
      sourceRefs: [SE006, SE009]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE007, QE012]
    - id: "CE010"
      statement: "Owner says most POS customers can go live a few business days after hardware arrives through one remote call, automatic menu import, and no IT specialist requirement."
      type: "company-claimed"
      topic: "implementation-speed"
      sourceRefs: [SE006, SE002]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE016]
    - id: "CE011"
      statement: "Owner says its branded mobile app is included with the platform, personalized to the restaurant’s brand and rewards program, and launched in weeks rather than months."
      type: "company-claimed"
      topic: "branded-app"
      sourceRefs: [SE007, SE002]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE007, QE016]
    - id: "CE012"
      statement: "Owner says it automatically sends pre-built email and SMS campaigns, allows manual sends from the dashboard, and adds every website or app order to the restaurant’s marketing list automatically."
      type: "company-claimed"
      topic: "marketing-automation"
      sourceRefs: [SE008]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QE007, QE011]
    - id: "CE013"
      statement: "Owner says push notifications are delivered through the restaurant’s branded app, can be automated or manual, and are timed using analysis of guest interactions."
      type: "company-claimed"
      topic: "push-marketing"
      sourceRefs: [SE007, SE008]
      confidence: "medium"
      freshness: "current"
