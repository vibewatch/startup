  - id: "SE002"
    title: "Operating model: discovery, ordering, loyalty, app, marketing, and phone all feed the same guest record"
    body: |
      The public operating model is clearer than the low-level technical architecture. Owner’s workflow pages show a funnel that begins with SEO and website traffic, converts that traffic into direct web orders, then keeps diners inside restaurant-owned channels through loyalty, guest-list growth, app installs, email and SMS campaigns, push notifications, and AI-assisted phone ordering. The logic is consistent across pages: every direct order or call should become structured guest data, every identified guest should become reachable through multiple owned channels, and every channel should drive the next reorder rather than hand demand back to DoorDash or Uber Eats. The POS page extends that loop in-store by claiming guest phone capture at checkout, automatic app invitations, and shared loyalty across in-store, online, and delivery orders. Help-center documentation adds concrete proof that this is not just homepage language: Owner exposes guest-list imports, specific loyalty defaults, Clover workflow splits, DoorDash marketplace mapping, POS payment methods, and four native POS reports. The Apple and Google app listings add independent corroboration that there is a live operator mobile app for orders, menu edits, hours changes, refunds, and alerts.
