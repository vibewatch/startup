  - id: "SE003"
    title: "Deployment, integrations, payments, and support: public evidence is strongest on fast rollout and day-to-day operations"
    body: |
      Owner’s public implementation story is unusually explicit for a private restaurant-software vendor. Pricing and POS pages say the platform is month-to-month, includes setup and migration, and is backed by a dedicated specialist; the POS page says most installs happen a few business days after hardware arrives, with one remote call, automatic menu import, and no IT specialist required. The support surface is also visible: pricing promises 24/7 support, the Help Center exposes substantial article depth across POS/tablet, marketing, mobile, integrations, and orders, and the operator app listings route users back to help.owner.com and support@owner.com. Integration evidence is practical rather than developer-centric. Public pages emphasize native Square and Clover support, broader connectivity via partners such as Otter, dashboard-based DoorDash mapping and menu sync, and marketplace routing into one Owner screen. On payments, the company discloses less than on marketing or rollout. The privacy policy is clear that online-order payment information is processed by third-party processors such as Stripe and that Owner does not itself collect, store, or process that payment information, but public materials do not disclose the card-present processor, PCI artefacts, or a formal status/SLA surface for the new POS layer. That is the main gap between strong workflow proof and deeper technical underwriting.
