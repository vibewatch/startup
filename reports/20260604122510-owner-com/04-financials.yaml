    {
      "id": "unit-economics-and-margin-path",
      "title": "Unit economics, margin drivers, and public benchmark band",
      "body": "Owner’s case studies show a consistent economic pattern: direct online sales rise, average check often increases, Google-derived demand improves, branded apps deepen repeat ordering, and third-party commission leakage falls. Metro Pizza, Township Line Pizza, Rig A’ Tony’s, Talkin’ Tacos, Mattenga’s, Ashley’s Cafe, and Karv all report some combination of sales lift, fee savings, or better traffic capture. That is useful evidence that the product can create restaurant-level ROI. But restaurant-level ROI is not the same thing as Owner corporate unit economics. Publicly, there is still no disclosed ARR, gross margin, CAC payback, contribution margin, or burn.\n\nPublic comps show why the missing mix matters. Olo demonstrates the economics of a relatively software-led restaurant platform: 53% GAAP gross margin, 115% NRR, three-year-plus contracts, and a mix that is still only about 45.5% subscription revenue and 54.5% transaction revenue. Toast shows the economics of a larger integrated platform where software, fintech, and hardware can still produce strong recurring gross profit and free cash flow, but only with much greater scale. Owner likely sits somewhere between these poles. Its subscription pricing, SEO engine, and content-led acquisition are software-like, but delivery support, onboarding, chargeback protection, and POS/in-store expansion can pull margins toward a more service-heavy profile. That is why margin path is still a diligence item, not a public conclusion.",
