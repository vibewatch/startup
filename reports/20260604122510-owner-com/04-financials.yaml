    {
      "id": "capital-adequacy-and-verdict",
      "title": "Capital adequacy, financing dependency, and blockers",
      "body": "The public capital story is straightforward up to the latest raise: Owner announced a $120 million Series C in May 2025 at a $1 billion valuation, following a $33 million Series B in January 2024. The stated use of proceeds is expansion — scaling the platform, deepening AI capabilities, and broadening the company’s reach. That fresh capital is a positive signal because there is no public evidence of distress financing or disclosed debt layered on top. But adequacy cannot actually be underwritten from public data because the company does not publish cash, burn, runway, or leverage.\n\nThat creates a split verdict. Revenue quality looks better than many opaque marketplace-adjacent peers because pricing is transparent, contracts are month-to-month, and case studies consistently point to real merchant ROI. Margin path is much less proven because no public source discloses Owner’s own gross margin or the true cost of support, implementation, delivery operations, or POS expansion. Capital intensity appears moderate rather than extreme — this is not a hardware-inventory or project-finance business — but financing dependency is still material because the $1 billion valuation assumes continued growth without public proof of profitability or runway. The core blockers are current ARR and revenue mix, gross margin by stream, cohort retention, and current liquidity.",
