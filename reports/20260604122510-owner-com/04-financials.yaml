    {
      "id": "gtm-and-sales-efficiency",
      "title": "GTM motion and sales-efficiency proxies",
      "body": "The strongest public GTM signal is not headcount or CAC disclosure — Owner does not publish those — but the operating shape visible in the Series C memo and customer funnel. Management says inbound customers often arrive pre-educated by its content, that more than 90% of account executives ramp to quota within three months, and that more than 1,000 customers have switched from competing products. The company’s month-to-month contracts also matter: they reduce forced collections and suggest the product must keep proving ROI each billing cycle, while case studies repeatedly tie wins to direct-order growth, SEO ranking, higher average check, app adoption, and avoided marketplace commissions.\n\nThe offset is classic SMB exposure. Owner itself says logo churn is structurally higher than enterprise SaaS churn and that January 2025 churn was materially driven by restaurant closures. That means revenue quality depends on expansion outrunning closures. Management claims that restaurant sales growth and added locations increase payments volume on the platform, which would help expand revenue inside the base, but there is no public CAC, payback, cohort retention, or net revenue retention number to prove how durable that flywheel is. The public read-through is therefore favorable on demand generation and quota efficiency, but incomplete on true sales efficiency.",
