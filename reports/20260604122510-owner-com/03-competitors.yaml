  "callouts": [
    {
      "calloutType": "risk",
      "title": "Distribution beats feature parity in this category",
      "body": "Owner.com’s biggest vulnerability is that the strongest competitors already own a deeper control point. Toast, Square, and SpotOn own checkout, payments, and day-to-day operations; DoorDash owns a merchant demand channel plus logistics; Olo and Lunchbox own enterprise integrations. That means Owner.com’s path to durable advantage is not merely shipping more front-end features. It has to prove better outcomes for independents strongly enough that operators choose a specialist bundle over the convenience of a broader installed-base platform.",
      "claimRefs": [
        "CP031",
        "CP034",
        "CP035",
        "CP044"
      ]
    },
    {
      "calloutType": "insight",
      "title": "Incumbent pain is a wedge, not a moat",
      "body": "Public adverse evidence around Toast shows real operator frustration with contracts, fees, onboarding, refunds, and support. That creates a credible entry point for Owner.com in competitive sales cycles. But those complaints do not show that incumbents cannot match ordering, CRM, or loyalty features. They show service and economic dissatisfaction. Owner.com can exploit that wedge, but it should not mistake it for a structural moat unless it can turn better customer experience into a repeatable referral engine and measurable retention advantage.",
      "claimRefs": [
        "CP021",
        "CP022",
        "CP023",
        "CP043"
      ]
    }
  ],
