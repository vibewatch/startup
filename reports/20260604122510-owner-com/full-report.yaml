      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution beats feature parity in this category
            body: >-
              Owner.com’s biggest vulnerability is that the strongest competitors already own a deeper control point.
              Toast, Square, and SpotOn own checkout, payments, and day-to-day operations; DoorDash owns a merchant
              demand channel plus logistics; Olo and Lunchbox own enterprise integrations. That means Owner.com’s path
              to durable advantage is not merely shipping more front-end features. It has to prove better outcomes for
              independents strongly enough that operators choose a specialist bundle over the convenience of a broader
              installed-base platform.
            calloutType: risk
            claimRefs:
              - CP031
