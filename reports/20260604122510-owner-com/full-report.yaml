      - number: '8.4'
        title: Recommendation, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The correct recommendation on the public record is research-more / wait, with medium confidence, high
              risk, and a full-to-expensive valuation stance. That is not a dismissal of the company. Owner appears to
              be building a real growth layer for independent restaurants, and adjacent strategic activity—such as
              DoorDash paying $1.152 billion for SevenRooms—shows that restaurant-software assets can become
              strategically valuable. But public investors are not paying unicorn prices for restaurant-tech businesses
              without scale and disclosure, and the current record does not show enough to assume Owner is already
              there. Exit readiness is therefore not proven. To justify buying at the last round price, diligence would
              need to confirm a much larger high-quality revenue base, strong retention, resilient gross margins, and
              terms that leave real upside to new money. If those checks come back strong, the price can be revisited.
              If they do not, the disciplined move is to keep following the company rather than forcing a stretched
              entry.
            claimRefs:
