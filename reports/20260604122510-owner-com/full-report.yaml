    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Owner.com is best understood as a vertical SaaS platform for independent restaurants rather than a generic
              logistics or industrial software company. Official pages describe it as the system restaurants use to grow
              online through AI-optimized websites, direct online ordering, loyalty, marketing automation, CRM, and
              branded mobile apps. Public legal and corporate-address evidence centers the company in Palo Alto,
              California, with Owner.com, Inc. listing 530 Lytton Avenue as the contact address. The strongest founding
              narrative points to Adam Guild starting the business in 2018 after helping his mother's dog-grooming
              business, then pivoting through PlacePull and ProfitBoss before rebranding to Owner.com in 2021 after
              buying the premium domain. Some databases normalize the founded year to 2019 and public corporate records
              show the legal entity formed later, in 2020, so the cleanest chapter-1 framing is: operating origin in
              2018, legal entity formation in 2020, and current operating identity as Owner.com. The stated long-term
              ambition extends beyond restaurants to local businesses more broadly, but the present go-to-market and
              proof points remain restaurant-first.
