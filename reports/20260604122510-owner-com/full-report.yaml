      - number: '6.4'
        title: Retention, repeat usage, and durability proxies
        blocks:
          - type: paragraph
            body: >-
              Durability is the most important unanswered question in the public record. Owner provides a clear
              mechanism for repeat behavior: the product bundle pushes restaurants toward on-domain ordering, branded
              apps, loyalty, automated email and text campaigns, and guest-data capture. Product pages claim mobile apps
              produce about 2x reorder rates or 85% more repeat orders, and named case studies repeatedly mention
              loyalty enrollment, reorders, or larger captured audiences. Independent review surfaces are directionally
              positive as well, with strong Capterra scores and an operator app with a large rating base. Some reviews
              also imply non-trivial tenure: Capterra includes a restaurant customer who said it had been with Owner for
              over two years. Still, none of the reviewed public sources disclose NRR, GRR, logo churn, renewal rates,
              contract-length distribution, or cohort retention by segment. The public record therefore supports a
              plausible durability mechanism and healthy satisfaction proxies, but not an investable retention model.
              For diligence, the missing renewal math matters more than another success-story quote.
