      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Owner remains visibly founder-led. Adam Guild is the co-founder and CEO and Dean Bloembergen is the
              co-founder and CTO, and public company narratives still revolve heavily around Guild's origin story,
              product philosophy, and investor relations. The current public leadership bench is broader than a
              two-founder story: Rob Lehman is President and COO, Will Hauser is CFO, Kyle Norton is CRO, Wyatt Ozmore
              is CMO, Quenton Cook is CPO, and Tina Glickman runs partnerships. Governance has also professionalized.
              Owner's public board now includes Guild plus investors Jack Altman, Shalini Rao, Jason Lemkin, Alex
              Kurland, and Alex Bard, which means the board is both founder-inclusive and investor-heavy. What is not
              publicly available is just as important: reviewed sources do not disclose committee structure, observer
              rights, voting control, or share-class economics. Public materials also show a finance-leadership
              transition. The January 2024 Series B memo said Owner had just brought on Josh Brown as CFO, while the
              current leadership page names Will Hauser as CFO, suggesting a meaningful but not fully explained handoff
              in the finance seat. That combination makes founder continuity a strength, but it also leaves governance
              diligence unfinished.
