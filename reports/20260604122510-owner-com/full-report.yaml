            - Merchant churn from weak support or ROI
            - Independent-restaurant fragility
        - label: Medium likelihood
          values:
            - ADA / fee-disclosure disputes
            - POS / data-sync failures
            - SMS/email compliance failure
        - label: Low likelihood
          values:
            - Public enforcement action identified to date
            - Large-scale payment or security incident
            - Forced financing reset after competitive compression
