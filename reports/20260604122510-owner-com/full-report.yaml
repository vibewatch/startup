      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The bull case is not impossible, but it requires specific proof. Public comps and Owner's own price card
              imply that underwriting the current mark needs a business that is already materially larger than the
              public record reveals, with strong retention and margins that deserve a premium multiple. If diligence
              proves Owner already has a revenue base closer to the high-comp support band, with SMB churn contained and
              financing terms clean, then the company could still grow into a meaningful premium outcome. The base case
              is more modest: Owner is a good product with real market pull, but the current price only yields
              par-to-moderate upside if revenue and retention come in at normal restaurant-tech levels. The bear case is
              a classic private-mark problem—good company, weak denominator. If revenue is far lower than bulls expect,
              or closures and churn keep eroding cohorts, the public comp bridge can compress quickly. Return math
              reinforces the point: a $1 billion entry needs at least a $3 billion exit for a 3x gross and roughly $5
              billion for a 5x gross before dilution. That is a high bar when public evidence is still this thin.
            claimRefs:
