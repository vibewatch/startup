        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is narrower than restaurant spend
            body: >-
              Owner.com benefits from a large restaurant end-market, but the directly relevant budget is the software
              slice that captures and retains first-party demand. Treating $1.5T-plus restaurant sales as software TAM
              would materially overstate the opportunity.
            calloutType: insight
            claimRefs:
