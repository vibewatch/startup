              2023, podcast descriptions for Adam Guild’s Restaurant Unstoppable episode described Owner as serving over
              1,000 restaurants. By early 2024, TechCrunch said the company had thousands of customers after tripling in
              the prior year, and Owner’s Series B memo claimed more than 2,000 restaurants and more than 3 million
              restaurant customers had used the product in the prior three years. By the 2025 Series C memo and
              Restaurant Business Online coverage, the footprint had moved to 10,000+ restaurants and 60 million+
              consumers. Usage proxies also exist on the operator side: the Owner App is explicitly for current
              customers only and carried a 4.8 rating from 933 App Store ratings as of this run date. The problem is
              denominator quality. Public materials mix restaurants, consumers, website traffic, app ratings, installs,
              and case-study outcomes, but they do not disclose active restaurant counts, active locations, monthly
              order volume, MAU, or cohort frequency. The trajectory is therefore strong on breadth and weaker on
