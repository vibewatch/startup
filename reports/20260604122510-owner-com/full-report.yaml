      - number: '7.4'
        title: Owner still depends on the same platforms and bigger rivals it says it helps restaurants escape
        blocks:
          - type: paragraph
            body: >-
              Owner's strongest commercial pitch—helping restaurants own direct demand rather than rent it from
              marketplaces—still depends heavily on third-party platforms. Stripe processes card payments. Owner's
              restaurant agreement contemplates third-party payment processors and Delivery Partners, while Sauce's
              product review describes native Square/Clover connections and Toast connectivity through Otter. Discovery
              is tied to Google Search and Maps. Branded apps depend on Apple and Google distribution rules. And the
              competitive set is formidable. DoorDash's 2024 10-K says its Commerce Platform helps merchants establish
              online ordering, branded mobile apps, and customer support on their own channels—direct overlap with
              Owner's value proposition. Toast's 2025 annual report flags intensely competitive restaurant software
              markets, discounted pricing, payment-processing dependencies, and special vulnerability of SMB restaurants
              during downturns. This is why Owner's customer concentration matters even though it sells to many
              merchants: independent restaurants remain the structurally weaker side of the market. Prime/Enigma data
              show chains with 10+ locations capture a majority of industry GPV while single-location operators capture
              less than a third. If Google changes profile rules, an app is delayed in review, Stripe economics tighten,
              an integration partner breaks, or larger rivals bundle more features, Owner has limited ability to route
              around those shocks without higher support cost or margin pressure.
