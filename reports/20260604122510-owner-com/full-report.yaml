      - number: '6.3'
        title: Named customer proof and production depth
        blocks:
          - type: paragraph
            body: >-
              Owner’s strongest public customer evidence is unusually concrete for an SMB restaurant software vendor
              because the case studies show live operational outcomes instead of a logo wall alone. Metro Pizza, Talkin
              Tacos, Mattenga’s, Saffron, Ashley’s Cafe, Karv Greek Kouzina, and Gyro Concept all have named pages with
              before-and-after metrics, operational details, and owner quotes. Several also show expansion beyond a
              single tool. Ashley’s case is notable because it reaches into in-store POS and walk-in capture rather than
              just digital ordering. Mattenga’s describes one system across seven locations. Talkin Tacos combines
              direct-order growth, app adoption, loyalty enrollment, Google acquisition, and location expansion. Saffron
              and Karv tie sales growth to SEO and branded app usage. Independent directories such as FeaturedCustomers
              and CaseStudies.com do not verify the underlying metrics, but they do corroborate that Owner has built a
              sizable public library of named customer references and customer videos. The public proof still has a
              limitation: it is highly curated toward successful restaurants, and there is no balanced public ledger of
              pilots, failed launches, or logo churn.
