      - number: '3.3'
        title: Switching Costs, Multi-Homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Switching cost is not uniform across this landscape. POS and payments incumbents hold the deepest lock-in
              because they control card rails, hardware, offline operations, staffing workflows, and daily transaction
              history. That gives Toast, Square, and SpotOn a stronger wedge than Owner.com’s website and CRM layer,
              even when Owner’s front-end experience is competitive. At the same time, the category is highly
              multi-homed. ChowNow explicitly helps restaurants consolidate first- and third-party orders; Square keeps
              orders connected in-store, online, and across channels; SpotOn supports both first-party ordering and
              major marketplace aggregators. Those patterns mean a restaurant can often keep its existing POS while
              replacing only the growth layer, which makes Owner.com’s lock-in softer but also lowers the barrier to
              adoption. Distribution power is even more decisive than switching cost. Toast’s installed base, Square’s
              self-serve onboarding and transparent pricing, SpotOn’s payments-led economics, Olo’s integration-partner
              network, and DoorDash’s Marketplace cross-sell all create cheaper customer acquisition than a standalone
              vendor can easily match. Owner.com’s migration support is a meaningful counterweight, but it does not
              neutralize the installed-base advantage that comes from already owning checkout, payments, or a
              high-volume demand channel.
