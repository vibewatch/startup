  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Owner’s monetization is unusually transparent for a private restaurant-tech company: restaurants can buy a
              Flex plan at $249 per month plus a 5% restaurant fee per order or a Flat Rate plan at $499 per month with
              no restaurant fee, while guests pay a 5% order-support fee on both plans. The company explicitly
              recommends Flat once a restaurant exceeds roughly $5,000 in monthly online sales, which also matches the
              mechanical breakeven point between the two plans. That makes the core revenue engine legible: recurring
              subscription revenue anchors the model, variable order-linked fees expand monetization on lower-volume
              accounts, and guest-support economics add another monetization layer.


              The quality question is not whether Owner charges customers — it clearly does — but how much of the
              economics are software-like versus service-like. Public materials show a large bundle that includes
              website, ordering, app, SEO, loyalty, marketing, migration, chargeback protection, and always-on support,
              plus case studies that stress delivery-fee savings and direct-order capture. Those features can justify
              strong retention and upsell, but they also imply meaningful support and implementation cost. The public
              record does not disclose how guest-support fees, delivery pass-throughs, or future modules such as Owner
              POS and AI Executives are recognized in revenue. So list pricing is strong evidence of monetization, while
              realized revenue mix and gross profit remain the core evidence gap.
