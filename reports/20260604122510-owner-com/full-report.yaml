  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer / user / payer map
        blocks:
          - type: paragraph
            body: >-
              Owner’s customer base is easier to define by ownership model and operating need than by classic SaaS seat
              counts. Public materials consistently target independent restaurant owners and operators who need
              chain-like digital tools without hiring internal product, marketing, or engineering teams. The economic
              buyer and payer is the restaurant business itself, usually represented by an owner, operator, general
              manager, or managing partner. The end user is split: staff members use the operational surfaces such as
              POS, reporting, ordering management, and the Owner App, while restaurant guests use the branded website,
              ordering flow, loyalty program, and mobile app that Owner powers on the restaurant’s behalf. Public proof
              also shows meaningful size variation inside the ICP. Some customers are single-location independents, but
              others are already multi-location groups such as Saffron, Mattenga’s, and Talkin Tacos. What remains
              opaque is the exact mix by geography, revenue band, or account size: Owner is explicit about
              independent-restaurant focus and special rates for multi-location operators, but it does not publish a
              clean segmentation schedule of active locations, ARR bands, or average account size.
