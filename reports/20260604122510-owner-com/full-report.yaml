      - number: '1.3'
        title: Funding History, Valuation, and Public Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is strongest from 2024 onward. Owner closed a $33 million Series B in January
              2024 at a $200 million post-money valuation, then a $120 million Series C in May 2025 at a $1 billion
              valuation, officially making the company a unicorn. The Series B was led by Redpoint and Altman Capital;
              the Series C was led by Meritech and Headline and brought in restaurant and software operators as
              strategic backers. Public sources diverge on total capital raised. The official Series B memo said total
              capital raised stood at $58.7 million, which implies a disclosed minimum of $178.7 million after adding
              the Series C, while Sacra and Tracxn roll that figure up to roughly $189 million. Scale metrics are
              directionally strong but still partially opaque. Official materials moved from 2,000-plus restaurants and
              3 million guests in early 2024 to 10,000-plus restaurants and roughly 57 million to 60 million served
              users by 2025-2026. Current headcount is not officially published on the website; third-party sources
              place it in the 275 to 337 range. Official materials do not publish current ARR or revenue, although Sacra
              estimates roughly $80.56 million for 2025. Pricing is much clearer than financial reporting: Owner sells
              month-to-month restaurant subscriptions at $249 or $499 per month, depending on plan structure.
