        blocks:
          - type: paragraph
            body: >
              Owner’s own top-level surfaces consistently frame the company as the digital operating stack for
              independent restaurants. The homepage, pricing page, and "how it works" flow together describe one system
              that starts with Google discovery, routes traffic into a standardized restaurant website and
              online-ordering experience, captures guest identity, then pushes diners into a loyalty, app, and
              automated-marketing loop that is supposed to increase direct repeat orders. The product map now spans
              discovery tools (website, SEO, automated SEO pages), transaction surfaces (online ordering, catering,
              marketplace sync, Owner POS, tablet), guest-retention layers (loyalty, guest list, branded app, email,
              SMS, push), and operator tools (reporting, mobile command center, menu and hours controls, refunds,
              kitchen workflows). That breadth matters because Owner’s main promise is economic, not cosmetic: replace
              disconnected tools and reduce third-party leakage while turning every order channel into first-party
              restaurant data. Public evidence also shows Owner intentionally trades away broad customization for speed
              and repeatable outcomes. The website product openly says sales comes before design freedom, and launch
              speed is measured in days or weeks rather than bespoke build cycles.
