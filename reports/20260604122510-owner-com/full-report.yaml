          tone: warning
        - id: n8
          label: Valuation pressure
          detail: Revenue quality and next-round support weaken
          tone: negative
        - id: n9
          label: Integration break or partner outage
          detail: POS, payments, app, or delivery dependency fails
          tone: negative
        - id: n10
          label: Peak-period order disruption
          detail: Menu mismatch, routing failure, delay, or failed charge
