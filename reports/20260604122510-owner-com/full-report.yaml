  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Segmentation: Direct Peers, Incumbents, Adjacents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Owner.com sits inside a broad restaurant-tech buyer decision rather than a narrow website-builder niche.
              The closest direct peers are Popmenu and ChowNow because all three sell independent restaurants a
              front-of-house growth stack built around websites, direct ordering, guest data, and repeat-purchase
              marketing. BentoBox is adjacent in the same commerce-led website lane. The strongest incumbents are Toast,
              Square, and SpotOn, which approach the same demand from a wider operating-system angle: POS, payments,
              hardware, staffing, reporting, and online ordering. Olo and Lunchbox matter more as adjacent enterprise
              platforms than as head-on SMB rivals because both are optimized for restaurant brands, open integrations,
              and chain-scale order management. Substitutes are real: GloriaFood covers the low-end do-it-yourself
              direct-ordering use case, and DoorDash Online Ordering gives existing DoorDash merchants a first-party
              ordering layer without requiring a full Owner migration. The status quo alternative is also meaningful:
              restaurants can keep an existing POS, plug online ordering into GoDaddy, Shopify, WordPress, or Wix-like
              tools, and accept a patchwork stack instead of buying a bundled platform. That is why Owner.com is
              competing not just with named SaaS vendors but with every credible way an operator can reclaim direct
              orders and guest data.
