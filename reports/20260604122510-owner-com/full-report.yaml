      - number: '2.4'
        title: Contradictions, sizing gaps, and valuation implications
        blocks:
          - type: paragraph
            body: >-
              The biggest diligence trap is to treat every public restaurant-tech number as interchangeable. They are
              not. The end-market number from the National Restaurant Association describes consumer restaurant spend,
              not software revenue. Technavio measures a broad restaurant-technology category and publishes incremental
              market growth. Precedence publishes both a restaurant POS terminal estimate and a separate all-industry
              POS software estimate. James Beard and Toast show why this matters strategically: independent operators
              are thin-margin buyers, but no public source in this evidence set cleanly isolates how much U.S.
              independent restaurants spend on the specific bundle Owner.com sells. That means TAM is directionally
              supportive but not decisive for valuation. The more decision-useful questions are private: what share of
              buyers can be acquired at attractive payback, how much website-plus-ordering adoption expands into loyalty
              or apps, how painful migration is against Toast and Square, and whether first-party demand capture
              improves retention enough to justify a bundled platform. Until that evidence is disclosed, the market case
              supports relevance and growth, but not a precise public SAM or a de-risked SOM.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM029
              - CM046
              - CM047
              - CM048
              - CM049
              - CM050
