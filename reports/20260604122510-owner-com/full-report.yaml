      - number: '6.5'
        title: Expansion, concentration, channel dependence, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Owner’s land-and-expand motion is visible even if the company does not publish formal cohort tables. The
              same restaurant often starts with a website and ordering flow, then layers in branded apps, loyalty,
              automated marketing, POS integration, and multi-location rollout. That bundle depth is good for expansion
              revenue and stickiness. The main public risks are elsewhere. First, concentration is hard to underwrite
              because no reviewed source discloses top-customer revenue share, top-10 ARR concentration, or customer mix
              by size band despite the 10,000+ restaurant claim. Second, Owner is not trying to replace third-party
              delivery overnight; its pricing FAQ explicitly says most customers keep marketplace apps as a marketing
              channel and then try to convert those diners to direct orders. Third, implementation is not frictionless
              for every operator. Independent reviews repeatedly mention POS/menu-sync limitations, limited
              customization, and support delays or inconsistent follow-through. The good news is that procurement
              friction is lower than at many restaurant software vendors because Owner prices month-to-month with no
              long-term contracts. The tradeoff is that setup fees are non-refundable and some hardware or transaction
              fees can still matter, so buyers are not entering a zero-friction relationship.
