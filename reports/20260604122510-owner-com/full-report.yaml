            title: Owned demand is becoming a strategic priority
            body: >-
              Public vendor and trade evidence points in the same direction: operators increasingly want first-party
              ordering, unified payments, and guest-data tools that reduce dependence on marketplaces and make marketing
              spend more productive.
            calloutType: strength
            claimRefs:
