  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Owner’s public workflow converts search traffic and phone calls into first-party guest records, then reactivates
      those guests across app, loyalty, and messaging.
    data:
      nodes:
        - id: n1
          label: Show up in Google / local discovery
          detail: Restaurant website and SEO pages aim to pull intent away from marketplaces and into owned traffic.
        - id: n2
          label: Convert on web menu and ordering
          detail: Guests place direct orders, browse menus, and create first-party commerce data.
        - id: n3
          label: Capture guest identity
          detail: Orders, sign-ups, loyalty enrollment, and POS phone capture expand the restaurant’s customer list.
        - id: n4
          label: Route into repeat-order channels
          detail: Branded app, email, SMS, and push notifications keep customers reachable after the first order.
        - id: n5
          label: Convert phone and in-store traffic too
          detail: AI phone ordering and Owner POS extend the same loop beyond web-only orders.
        - id: n6
          label: Monitor and optimize
          detail: Dashboard, app alerts, and reports surface sales, order channels, reviews, and campaign performance.
      edges:
