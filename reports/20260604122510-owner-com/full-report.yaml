      - number: '2.2'
        title: Buyer segmentation, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The clearest Owner.com buyer is the independent restaurant that wants to own its digital storefront and
              guest relationship without taking on an enterprise chain-style stack. Public competitor pages show the
              segment map. Square explicitly targets single- and multi-location restaurants; Toast spans ordering,
              payments, and loyalty across a broad restaurant operating system; Olo sits further upmarket with
              enterprise ordering, payments, and guest engagement; and Popmenu and BentoBox focus more tightly on owned
              ordering, restaurant websites, marketing, and loyalty. For single-location independents, the buyer and
              payer are usually the owner-operator or general manager, while staff and diners are the primary users. As
              operators add locations, budget authority spreads across operations, marketing, and finance. Public
              pricing also suggests this is an SMB-friendly software budget, not an ERP-scale purchase: Popmenu
              publishes monthly tiers from $179 to $499, while Square markets easy onboarding and a free trial instead
              of a heavy upfront commitment. The adoption path usually starts with a pain point in margins or guest
              acquisition, then expands into owned ordering, guest-data capture, SMS and email marketing, loyalty, and
              eventually a branded app or deeper integration. That segmentation matters because Owner.com is competing
              for a budget that is operational, marketing-led, and ROI-sensitive at the same time.
