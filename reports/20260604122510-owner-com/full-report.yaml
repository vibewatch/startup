          - type: callout
            title: Incumbent pain is a wedge, not a moat
            body: >-
              Public adverse evidence around Toast shows real operator frustration with contracts, fees, onboarding,
              refunds, and support. That creates a credible entry point for Owner.com in competitive sales cycles. But
              those complaints do not show that incumbents cannot match ordering, CRM, or loyalty features. They show
              service and economic dissatisfaction. Owner.com can exploit that wedge, but it should not mistake it for a
              structural moat unless it can turn better customer experience into a repeatable referral engine and
              measurable retention advantage.
