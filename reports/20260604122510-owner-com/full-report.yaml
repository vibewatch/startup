  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation remains cautious because Owner clears the market-need and product tests, but not yet the public
      price-support test.
    data:
      nodes:
        - id: market
          label: Real demand
          detail: >-
            Independent restaurants need direct digital demand tools as delivery fees, chain-tech gaps, and SEO pressure
            rise.
          tone: positive
        - id: product
          label: Product fit
          detail: Owner's opinionated SEO, ordering, loyalty, and AI stack shows credible operator value.
          tone: positive
        - id: proof
          label: Public proof gap
          detail: Revenue, retention, gross margin, and cap-table terms are still missing publicly.
          tone: warning
        - id: comps
          label: Public comp discipline
          detail: Relevant comps trade around 1.7x-5.6x TTM revenue, implying a high revenue bar for a $1B mark.
          tone: warning
        - id: call
          label: Decision
          detail: Research-more / wait at the current price unless private diligence closes the denominator gap.
          tone: neutral
      edges:
        - from: market
          to: call
        - from: product
          to: call
        - from: proof
          to: call
        - from: comps
          to: call
    approximationNotes: null
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV033
      - CV037
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The $1 billion mark only looks conventional if Owner's actual revenue is already far above what public materials
      disclose.
    data:
      items:
        - label: Revenue needed at 2x
          value: 500
          detail: USD millions of revenue required if Owner eventually prices like a lower-multiple commerce comp.
          tone: negative
        - label: Revenue needed at 3.4x median
          value: 294
          detail: USD millions required at the retained public peer median.
          tone: warning
        - label: Revenue needed at 5.6x high comp
          value: 179
          detail: USD millions required even at the most generous retained public comp multiple.
          tone: warning
        - label: Revenue needed at 8x premium
          value: 125
          detail: USD millions required if Owner proves unusually strong growth quality and premium software economics.
          tone: neutral
    approximationNotes: >-
      Bars show simple valuation divided by revenue thresholds using retained public comp multiples, not management or
      investor guidance.
    claimRefs:
      - CV033
      - CV034
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Public-data underwriting produces a wide range that is mostly below or only modestly above the last round price.
    data:
      items:
        - label: Bear case
          low: 250
          mid: 400
          high: 600
          displayValue: $250M-$600M
          detail: Smaller revenue base, churn drag, and 2x-4x multiple discipline.
          tone: negative
        - label: Base case
          low: 600
          mid: 900
          high: 1200
          displayValue: $600M-$1.2B
          detail: Reasonable growth but no extraordinary economics, supporting only a par-to-modest-upside outcome.
          tone: warning
        - label: Bull case
          low: 1300
          mid: 1800
          high: 2500
          displayValue: $1.3B-$2.5B
          detail: Diligence validates a much larger high-quality revenue base and cleaner terms than public evidence shows.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based valuation outputs for investment-committee discipline. They are not forecasts and they
      exclude dilution and preference effects that could lower investor returns.
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV039
      - CV040
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Owner scores well on market need and product differentiation, but poorly on evidence sufficiency and price
      support.
    data:
      items:
        - label: Market need
          score: 8
          detail: Independent restaurants clearly need direct-demand software and AI-enabled digital tooling.
          tone: positive
        - label: Product proof
          score: 7
          detail: Pricing, case studies, and review data suggest the platform can improve direct ordering and retention.
          tone: positive
        - label: Competitive differentiation
          score: 7
          detail: Opinionated growth layer and POS interoperability create a real wedge.
          tone: positive
        - label: Evidence quality
          score: 3
          detail: Public disclosure is missing the core denominator, margin, and retention inputs.
          tone: negative
        - label: Valuation support
          score: 3
          detail: Public comps do not independently justify the May 2025 mark.
          tone: negative
        - label: Risk burden
          score: 4
          detail: SMB churn, macro sensitivity, and financing-term opacity all matter.
          tone: warning
        - label: Exit readiness
          score: 4
          detail: Multi-billion exit confidence is not yet evidenced by the public record.
          tone: warning
    approximationNotes: >-
      Scores are ordinal 0-10 investment judgments based on retained public evidence, not company-provided board KPI
      dashboards.
    claimRefs:
      - CV004
      - CV007
      - CV009
      - CV010
      - CV033
      - CV037
      - CV038
      - CV042
