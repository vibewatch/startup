  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Owner’s customer journey starts with an independent restaurant operator buying an all-in-one stack, then loops
      through guest reorder behavior and multi-location expansion.
    data:
      items:
        - id: evaluate
          label: Evaluate
          actor: Owner / GM / operator
          description: >-
            The buyer compares Owner against marketplace-heavy flows, generic website builders, or POS-native ordering
            and values month-to-month pricing plus performance-oriented templates.
          channels:
            - Content / SEO
            - Case studies
            - Review sites
            - Demo
        - id: launch
          label: Launch
          actor: Ops team
          description: >-
            Website, direct ordering, POS integration, and branded app go live. Operators start capturing guest data
            instead of losing traffic to off-domain checkouts.
          channels:
            - Website
            - POS
            - Owner App
            - Ordering
        - id: repeat
          label: Repeat
          actor: Restaurant guest
          description: >-
            Guests use loyalty, app reordering, saved data, push notifications, and automated campaigns that are
            designed to bring them back directly.
          channels:
            - Loyalty
            - Branded app
            - Email / SMS
            - Push
        - id: expand
          label: Expand
          actor: Owner group
          description: >-
            Successful accounts expand to POS, multi-location rollouts, more SEO content, and more guest-marketing
            automation across the restaurant group.
          channels:
            - POS
            - Multi-location
            - SEO
            - Analytics
