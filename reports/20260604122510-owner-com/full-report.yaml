      - number: '2.3'
        title: Growth drivers, substitutes, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand signal is margin pressure. Toast says profitability is operators' top goal,
              Hospitality Technology says 42% of multi-unit restaurants face structural profitability challenges, and
              James Beard says even moderate tech adoption can outperform both under-invested and over-fragmented
              stacks. That pushes restaurants toward owned channels and better use of guest data. Off-premises demand
              remains real as well: the National Restaurant Association reports that 82% of consumers express strong
              interest in delivery. Yet the substitute set remains powerful. Third-party marketplaces aggregate demand
              and logistics, and public sources still frame 15% to 30% commission as a normal range. DoorDash itself
              publishes 15%, 25%, and 30% marketplace tiers, while New York City's latest policy reset shows the
              regulatory landscape can still change fee economics at the margin. The result is a category where
              first-party ordering is strategically attractive but not frictionless. Restaurants still need delivery
              execution, payment security, privacy compliance, menu and payment integrations, and working migration
              paths from incumbent stacks. QSR's 2025 coverage captures the operational reality: brands are prioritizing
              first-party ordering, tech-stack consolidation, and unified payments because digital growth now has to
              translate into durable profitability rather than just more channels.
