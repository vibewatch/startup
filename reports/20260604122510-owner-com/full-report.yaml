      - number: '8.2'
        title: Financing context and whether public evidence supports the price
        blocks:
          - type: paragraph
            body: >-
              Public evidence cleanly confirms the headline financing facts: Owner raised a $120 million Series C in May
              2025 at a $1 billion valuation, co-led by Meritech and Headline. What public evidence does not confirm is
              the part that matters most for underwriting: the current revenue denominator, the mix between subscription
              and transaction-linked fees, the gross margin structure, and the true cap-table economics after the Series
              C. That gap matters because the retained public comp set trades around 1.7x-5.6x TTM revenue, with a
              midpoint near 3.4x. On that basis, a $1 billion mark would imply something like $179 million of revenue
              even at the highest retained public comp and about $294 million at the median. Owner's own public pricing
              and restaurant-count disclosures do not disprove those levels, but they do not prove them either. With
              more than 10,000 restaurants and a public price card of $249 to $499 per month plus some order-linked
              fees, investors need diligence to show that payments, marketing, AI, and expansion revenue are already
              large enough to bridge the gap.
