      - number: '7.2'
        title: Marketing, privacy, accessibility, and fee-disclosure compliance are material legal risks
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory exposure is unusually multi-layered for a restaurant SMB SaaS. Owner automatically
              sends emails and texts to restaurant customers, adds web/app customers to marketing lists, and captures
              guest phone numbers at POS to drive app downloads and reorders. That creates direct TCPA and CAN-SPAM risk
              surfaces, while Owner's legal terms shift part of the consent burden to merchants: its website terms say
              merchants are responsible for obtaining legally required consent for their own marketing texts, and the
              restaurant agreement requires email/SMS promotion in compliance with applicable law. The regulatory
              baseline is not forgiving. FCC guidance says commercial texts require written consent and opt-out rights;
              the FTC says CAN-SPAM applies to all commercial email and that legal responsibility can attach both to the
              promoter and the sender. Privacy adds another layer: Owner's updated privacy policy says it collects diner
              contact/order data, merchant tax and banking details, and even image and voice data from recorded demos,
              while California regulators give consumers rights to know, delete, correct, and opt out of sharing. On
              payments and consumer protection, Owner says Stripe processes card data, but the restaurant agreement
              makes merchants bear refunds, chargebacks, and fee-disclosure compliance, including SB 478-style
              itemization. Accessibility is another residual risk: Owner claims ADA-oriented effort, yet the agreement
              expressly says merchant design choices can still create noncompliance.
            claimRefs:
              - CR006
              - CR007
