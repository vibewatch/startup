  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Publicly visible stack: Owner layers discovery, ordering, retention, and restaurant operations into one
      growth-oriented system for independents.
    data:
      layers:
        - label: Discovery layer
          detail: >-
            AI-optimized website, restaurant SEO, listings-style discovery, and branded domain migration pull restaurant
            traffic into owned surfaces.
        - label: Conversion layer
          detail: >-
            Online ordering, catering, smart upsells, and marketplace sync convert traffic and route orders into
            restaurant-controlled workflows.
        - label: Retention layer
          detail: >-
            Guest CRM, loyalty, branded app, email, SMS, and push notifications convert one-time buyers into repeat
            customers.
        - label: Operations layer
          detail: >-
            Owner POS, Owner Tablet, Kitchen, mobile operator app, and reporting/analytics give staff one menu, one
            dashboard, and active-order controls.
        - label: Control layer
          detail: >-
            Partner integrations, online-payments delegation, privacy controls, support, and launch/migration services
            sit around the workflow core.
    approximationNotes: null
    claimRefs:
      - CE001
