      - number: '7.5'
        title: Mitigants are real, but the thesis breaks quickly if churn, compliance, or partner friction worsens
        blocks:
          - type: paragraph
            body: >-
              Mitigations exist, which is why the chapter is more about underwriting conditions than immediate failure.
              Owner does not appear to store card data itself, outsources payment processing to Stripe, and has updated
              legal documents that at least acknowledge arbitration, consent, privacy rights, fee disclosure, and
              accessibility responsibilities. The platform can create real ROI: direct ordering can be cheaper for
              restaurants than paying 15-30% marketplace commissions, and Owner's month-to- month structure lowers
              formal lock-in. But the same facts create monitorable kill criteria. If review complaints about support,
              integration, or fraud trend upward while restaurants can leave without penalty, churn can move quickly. If
              SMS/email consent controls or fee disclosures fail, the company and its merchants face class- action or
              regulatory exposure that is disproportionate to contract values. If Apple, Google, Stripe, DoorDash/Uber
              delivery networks, or key POS integrations become less supportive, Owner's feature breadth turns from moat
              into dependency map. Investors should therefore treat churn cohorts, chargeback and complaint rates,
              10DLC/SMS suppression controls, app-store status, and integration SLA performance as diligence gates
              rather than secondary metrics. At a $1 billion valuation, the thesis breaks faster from operational
              leakage and SMB churn than from a lack of product- market fit.
