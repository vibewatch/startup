  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual risk clusters where fragile SMB demand, multi-channel compliance, and third-party platform dependencies
      overlap.
    data:
      columns:
        - Medium impact
        - High impact
        - Critical impact
      rows:
        - label: High likelihood
          values:
