  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis is coherent. Independent restaurants are under real pressure to look and behave
              online more like chains, while delivery marketplaces continue to tax unit economics and capture customer
              relationships. Owner positions itself as a Shopify-like growth layer for local businesses, starting with
              restaurants, and its public product packaging lines up with that story: websites, direct online ordering,
              branded apps, loyalty, marketing automation, and AI tools sold on a simple monthly plan. Public customer
              reviews also show enough evidence of genuine operator value to keep the story live. The anti-thesis is
              equally important. Owner serves an SMB-heavy restaurant base that management itself says has structurally
              higher churn, including churn tied to restaurant closures. Reviews also surface integration and
              fraud-control complaints, and a rival lawsuit shows the category is competitive enough for marketing
              tactics to become adversarial. So the right question is not whether Owner has product-market fit. It is
              whether that fit is durable and profitable enough to support a unicorn entry.
            claimRefs:
