      - number: '7.3'
        title: Support, integrations, and data hygiene are the operational failure modes that can trigger churn fastest
        blocks:
          - type: paragraph
            body: >-
              Operationally, Owner faces the classic scaling problem of an all-in-one vertical stack: every new surface
              reduces restaurant vendor sprawl, but it also raises the number of ways support and integration failures
              can hurt retention. Independent review sites are directionally positive on outcomes, yet the negative
              comments are specific and relevant. Capterra reviews mention poor service, printer/POS troubleshooting,
              unexpected product changes, and support teams that sometimes need to escalate product questions. Software
              Advice reviews cite Stripe fraud-prevention misses and lack of integration with some POS systems. Sauce's
              review summary flags Clover issues, delivery radius limits tied to third-party networks, and limited
              multi-location customization. These are not existential on their own, but they matter because Owner's
              contracts are month to month and because the product handles customer-facing order flow, marketing,
              loyalty, and in some cases delivery and POS. When margins are thin, restaurants will not absorb prolonged
              onboarding friction or peak-period bugs. The operating burden is amplified by Owner's own product design:
              POS, website, app, email, text, and delivery feeds are meant to share one customer list and one marketing
              engine, so bad data, sync failures, or consent mistakes can propagate across multiple channels rather than
              remaining isolated.
            claimRefs:
              - CR004
