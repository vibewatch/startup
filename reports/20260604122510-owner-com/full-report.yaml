  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity concentrates in merchant fragility, compliance sprawl, and platform dependence
        blocks:
          - type: paragraph
            body: >-
              Owner.com's top residual risk is not that restaurants want direct ordering less than third-party
              marketplaces; public evidence suggests the opposite. The underwriting problem is that Owner sells an
              increasingly broad operating system—website, ordering, CRM, POS, branded app, delivery, automated
              email/SMS, and AI assistants—to independent restaurants, which are structurally fragile buyers. Restaurant
              Business says Owner now serves more than 10,000 restaurants and is valued at $1 billion after a $120
              million Series C. At the same time, Owner's own pricing and POS pages emphasize month-to-month contracts,
              no cancellation fees, and automatic marketing flows that depend on guest data capture across checkout,
              apps, and websites. That combination increases sensitivity to churn, support load, and compliance
              mistakes: if ROI disappoints, operators can leave quickly; if the system works, Owner becomes deeply
              embedded in ordering, marketing, and first-party data. The risk register therefore ranks merchant
              fragility, marketing-compliance exposure, platform dependence, and integration/support execution above
              abstract market-demand risk. The Popmenu suit is a useful reminder that Owner's go-to-market is aggressive
              enough to attract direct competitive challenge, not just passive competition.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR021
              - CR035
