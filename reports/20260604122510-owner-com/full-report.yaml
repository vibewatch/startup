  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue support fails
        - Diligence cannot prove at least roughly $180M-$250M revenue support or a clearly superior margin profile.
        - The public comp bridge never closes, so the $1B mark stays hard to defend.
        - Do not invest at the last round price.
      - - Retention quality disappoints
        - NRR and cohort data show SMB churn overwhelms expansion.
        - The compounding thesis breaks because logo losses offset product wins.
        - Recut valuation on lower multiples and slower growth.
      - - Restaurant closures persist
        - Restaurant closure exposure remains a meaningful driver of churn into 2026.
        - End-market fragility reduces confidence in long-duration cash-flow scaling.
        - Lower scenario weights and demand better terms.
      - - Competition or legal pressure intensifies
        - Rival claims, integration friction, or competitive CAC pressure worsen.
        - Owner's positioning as the best direct-demand layer becomes less durable.
        - Pause until market-share or product-retention data improves.
      - - Financing terms are investor-unfriendly
        - Preferences, ratchets, or secondary-heavy economics reduce true upside for new money.
        - Headline valuation stops matching investable economics.
        - Wait for cleaner terms or a reset entry point.
    notes: >-
      These are valuation triggers, not generic company risks. Each one directly reduces the probability that a $1
      billion entry can compound into an attractive outcome.
    claimRefs:
      - CV009
      - CV011
      - CV016
      - CV017
      - CV030
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Revenue denominator
        - Recognized revenue, ARR, growth rate, and revenue mix by subscription, payments, marketing, and AI products.
        - >-
          The core valuation question is whether the current denominator is closer to a public-comp support band or far
          below it.
        - CFO package, board materials, and audited revenue bridge.
      - - Retention and churn
        - NRR, gross retention, logo churn, and closure-driven churn by cohort and restaurant size.
        - Owner's SMB exposure can be either manageable or fatal depending on retention quality.
        - Cohort deck, churn waterfall, and cohort-based customer references.
      - - Gross margin and take rate
        - Gross margin by product line, payment economics, and blended take rate on order-linked fees.
        - Public pricing alone cannot show whether growth converts into software-like economics.
        - Finance diligence with payment-processing and unit-economics review.
      - - Cap table and preferences
        - Series C preference stack, liquidation rights, secondary/common split, and any ratchets or MFN terms.
        - A headline unicorn price can mask much weaker economics for new investors.
        - Counsel review of financing documents and cap-table model.
      - - Competitive durability
        - Win rates versus Toast, Square, DoorDash, BentoBox, Popmenu, and Olo plus POS integration reliability.
        - The thesis weakens quickly if Owner wins only in easy cases or loses on implementation.
        - Sales win/loss analysis, integration metrics, and reference calls.
    notes: >-
      If these asks cannot be answered convincingly, the correct decision is to keep following the company rather than
      to stretch on price.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV016
      - CV017
      - CV037
      - CV038
