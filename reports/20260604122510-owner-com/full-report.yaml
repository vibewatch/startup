      - number: '3.2'
        title: Capability, Pricing, and Go-to-Market Comparison
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is real, but the shape of the bundle differs sharply by vendor class. Owner.com,
              Popmenu, and ChowNow are primarily trying to solve direct digital growth: better websites, more direct
              orders, and more repeat demand via CRM, loyalty, or automated marketing. Toast, Square, and SpotOn sell
              those same outcomes but anchor them in POS, integrated payments, hardware, and labor tooling, which lets
              them sell a bigger budget line and bundle software around payment economics. Olo and Lunchbox sit further
              upmarket, emphasizing open integrations, order management, guest data, and enterprise scalability rather
              than a simple independent-restaurant onboarding motion. Public pricing highlights where Owner wins and
              where it is exposed. Owner’s headline is simple at $249 plus a 5% order fee or $499 flat. That simplicity
              is challenged by Square’s $0 or $49 entry points, SpotOn’s $0-per-station or $55-per-station framing,
              Popmenu’s $179 starter package, ChowNow’s mid-hundreds pricing, and GloriaFood’s free core product.
              DoorDash’s commission-free direct-ordering message also narrows the distance between marketplace
              distribution and first-party economics. The practical implication is that Owner.com cannot rely on feature
              checklists alone; it has to win on integrated execution quality, migration help, and measurable growth
              outcomes for independents.
