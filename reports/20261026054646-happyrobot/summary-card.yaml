  topStrengths:
    - >-
      The August 2026 Series C provides a substantial, recent financing signal, with the round and valuation reported by
      the company and independent outlets.
    - >-
      Public reporting describes more than 150 enterprise customers and named production deployments at DHL and WALTER
      Group, although outcomes and account economics are not independently audited.
    - >-
      The product spans workflow authoring, multi-channel agents, operational context, and enterprise integrations, with
      a detailed company-described technical overview.
  topRisks:
    - >-
      Revenue, ARR, gross margin, cash, burn, and runway are not established, preventing a company-specific valuation
      multiple or assessment of capital adequacy.
    - >-
      Customer growth, retention, satisfaction, and automation results are company-reported and lack disclosed cohorts,
      denominators, or independent verification.
    - >-
      Operational agents can affect customer systems; entity matching, authorization, exception handling, and recovery
      after failed writes require customer-specific testing.
    - >-
      Customer concentration, contract durability, investor rights, and current leadership or board coverage remain
      unresolved.
  unresolvedGaps:
    - >-
      Audited or investor-verified revenue and ARR, revenue recognition, gross margin, cash balance, burn, debt, and
      runway.
    - >-
      Reconciled total funding, fully diluted cap table, Series C preference and dilution terms, and any secondary
      transactions.
    - >-
      Customer-level active and paying account roster, concentration, renewals, churn, and the cohort and denominator
      behind reported retention and outcome metrics.
    - >-
      Independent evidence of deployment reliability, automation outcomes, and system-write controls across customer
      workflows.
    - >-
      Definitive principal headquarters and legal domicile, current board composition, succession coverage, and
      key-person dependence.
    - >-
      Reconcile the reported 2022 incorporation/founding and 2023 company-launch year; the assigned sources do not
      establish an exact founding date.
