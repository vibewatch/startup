  - id: TV002
    title: Investment thesis and anti-thesis
    columns:
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - 'Thesis: enterprise adoption'
        - FreightWaves reports more than 150 enterprise customers and five to ten live WALTER Group use cases.
        - Verify customer references and recurring revenue by cohort.
      - - 'Thesis: workflow expansion'
        - >-
          The reported WALTER Group use cases span several operational workflows; Microsoft describes Teams and
          infrastructure support.
        - Confirm implementation costs and whether expansion is repeatable without proportional services.
      - - 'Anti-thesis: financing mark'
        - >-
          A $1.2 billion post-money mark is reported, but the assigned sources do not disclose company revenue or gross
          margin.
        - Reconcile audited revenue and margins to the current round terms.
      - - 'Anti-thesis: ownership and exit'
        - Preference, dilution, cash runway, and liquidity terms are not established in the assigned evidence.
        - Obtain the fully diluted cap table, preference stack, cash/burn data, and a credible exit path.
    notes: >-
      Customer and partner signals are reported or attributed, not independent verification of company economics.
      Missing values remain diligence gaps rather than estimates.
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: Conditional bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation range and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Verified recurring revenue grows through customer expansion and multi-workflow deployments; gross margins
          remain attractive and Series C terms do not materially impair common ownership.
        - >-
          Above the reported $1.2 billion financing mark only if verified revenue and exit evidence support it; no
          numeric upper range or return is defensible from this evidence.
        - Deployment economics and customer concentration.
        - Uncalibrated; verify retention, margin, and customer-level expansion before assigning likelihood.
      - - Base
        - >-
          The reported $1.2 billion post-money round remains the only company-specific mark; financial performance and
          terms are not independently underwritten here.
        - >-
          Use $1.2 billion only as the reported financing reference, not fair value; no target return or fair-value
          interval can be calculated.
        - Missing revenue denominator, preference terms, and liquidity path.
        - No probability assigned; the mark is observable but fundamental support is incomplete.
      - - Bear
        - >-
          Customer expansion fails to convert to durable revenue, implementation costs constrain margins, or senior
          financing terms dilute common-equity outcomes.
        - >-
          Below the reported $1.2 billion mark; downside floor and magnitude cannot be estimated from the assigned
          evidence.
        - Down round, preference overhang, churn, and inability to reach profitable scale.
        - Uncalibrated; monitor verified churn, gross margin, cash runway, and subsequent financing terms.
    notes: >-
      Scenarios are directional and conditional, not forecasts. The only company-specific mark is the reported Series C
      post-money valuation; unsupported numeric ranges and probabilities are intentionally omitted.
    claimRefs:
      - CV001
      - CV002
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
