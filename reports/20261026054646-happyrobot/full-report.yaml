chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product
        blocks:
          - type: paragraph
            body: >-
              HappyRobot describes itself as an AI-native operating system for the “real economy,” using AI workers to
              automate operational work rather than selling physical robots (CO001). Its public descriptions center on
              agents that communicate across voice, email, documents, and web workflows and act within enterprise
              systems; this is a company-described product scope, not an independently tested capability (CO001).
              Microsoft for Startups described HappyRobot as a program participant and said its agents worked with
              Microsoft Teams for customer interactions (CO014). Profile publishers place the company in San Francisco,
              while Tracxn separately lists a Dallas registered address, so the reviewed sources do not establish legal
              domicile or a definitive principal office (CO002). The company’s 2025 Series B release describes the
              founders launching HappyRobot in 2023, while a data provider lists 2022 as the founding year (CO003,
              CO004).
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
      - number: '1.2'
        title: Financing and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              On August 4, 2026, HappyRobot announced a $150 million Series C at a $1.2 billion post-money valuation,
              led by Prysm Capital and co-led by Eurazeo (CO005). The company described total funding as around $200
              million, while Tracxn reports $210 million across four rounds; the difference is not reconciled in the
              assigned evidence (CO006, CO007). Tracxn and the 2025 company-issued Series B release also record the
              earlier Series A and Series B financing and their lead investors (CO008). HappyRobot and Tech.eu report
              more than 150 enterprise customers, but this remains a reported company scale metric rather than an
              independently audited customer count (CO010). Employee figures also differ: Tracxn reports 258 as of “Sep
              26” without specifying a year, while FundedIQ gives a 101–250 band (CO011, CO012). Neither revenue nor ARR
              should be inferred from funding or these operating disclosures.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
