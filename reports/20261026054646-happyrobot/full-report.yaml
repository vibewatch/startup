      - - Recommendation
        - Track
        - Do not underwrite a buy without company-specific financials and financing terms.
      - - Confidence
        - Medium
        - The financing mark is reported, but operating economics and ownership terms remain unverified here.
      - - Risk rating
        - High
        - >-
          Valuation and liquidity uncertainty create material underwriting risk; this is not a claim of financial
          distress.
      - - Valuation stance
        - Stretched
        - >-
          A $1.2 billion post-money mark is reported, but no verified revenue denominator supports an affordability
          test.
    notes: >-
      The valuation mark is a reported Series C post-money figure; no fair-value appraisal or company-specific valuation
      multiple is available in the assigned evidence.
