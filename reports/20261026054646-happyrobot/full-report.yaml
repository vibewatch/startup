        title: Milestones and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The dated public record supports seven milestones spanning founding, successive financing, a Microsoft for
              Startups feature, customer scale, and international office expansion (CO003, CO005, CO008, CO010, CO013,
              CO014). It does not supply a separately dated product launch, a documented regulatory milestone, or a
              company-specific adverse event suitable for an eighth timeline entry; the chronology therefore retains an
              explicit gap rather than inventing an event. Sequenced.ai’s September 2026 review states that it had not
              measured HappyRobot’s claimed automation rates, cost reductions, or voice performance (CO015). That is a
              limitation on independent verification, not evidence that the claims are false. The assigned sources also
              do not establish audited revenue or ARR, gross margin, cash balance, burn, runway, debt, or secondaries
