              - CO010
              - CO011
              - CO012
              - CO013
              - CO016
      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Tracxn identifies Pablo Palafox as co-founder and CEO, Luis Paarup as co-founder and CTO, and Javi Palafox
              as a co-founder; HappyRobot’s Series B release names Pablo Palafox, Luis Paarup, and Javier Palafox as
              co-founders (CO009). This supports a three-founder roster and two functional roles, but the assigned
              sources do not establish a complete current executive team, board composition, succession arrangements, or
              individual ownership. The investor disclosures identify round participants and leads, not their voting
              rights, preference terms, or economic stakes (CO005, CO008). The diligence implication is concentrated
              information risk: the public record is adequate to identify the founders and fundraising counterparties,
              but not to assess key-person dependence or investor control. Obtain the current organization chart, board
