  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-retention
      missingEvidence: Customer-level GRR, churn, renewal, contract-length and concentration data, plus the measurement period and cohort underlying the reported NDR above 150%.
      whyItMatters: Aggregate expansion claims cannot establish whether retention is broad-based or whether a small number of accounts dominate revenue and reported outcomes.
      diligencePath: Request a dated customer cohort schedule reconciling beginning and ending recurring revenue, churn, contraction and expansion, with customer concentration and contract renewal dates.
      relatedQuestionRefs: [QU004, QU005]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: Customer-level methods and denominators for reported work hours automated, satisfaction, autonomous resolution and deployment outcomes.
      whyItMatters: The reported values cannot be independently compared across customers or converted into verified productivity, service-quality or expansion conclusions without definitions and samples.
      diligencePath: Obtain anonymized deployment-level scorecards, metric definitions, time windows, sample sizes, baselines and customer-approved references.
      relatedQuestionRefs: [QU002, QU003]
    - type: missing-source
      severity: material
      topic: adverse-customer-evidence
      missingEvidence: Independent customer reviews, churn or non-renewal evidence, failed deployments, complaints and procurement-blocker records.
      whyItMatters: The assigned searches and retained articles do not establish whether adverse customer outcomes exist, so adoption durability cannot be assessed from positive coverage alone.
