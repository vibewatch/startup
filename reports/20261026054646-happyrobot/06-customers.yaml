      - [WALTER Group, "Logistics: dispatching, payment collections and customer support.", "Five to ten use cases reported live in FreightWaves/Yahoo Finance and TechTimes coverage.", "No quantified WALTER-specific outcome disclosed in these sources.", "Live-use claim is reported by media; exact deployment scope, locations and utilization are not disclosed."]
      - [Kuehne + Nagel, "Enterprise logistics / supply-chain customer named in coverage.", "The reviewed articles list the organization but do not specify pilot or production status.", "No customer-specific outcome or use case reported in the retained evidence.", "Roster inclusion is not proof of a live deployment, renewal or revenue contribution."]
