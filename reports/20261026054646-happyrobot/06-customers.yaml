chapter:
  number: 6
  title: Customers
  summary: Public reporting names more than 150 enterprise customers and describes production deployments at DHL and the WALTER Group, but the adoption and retention figures remain company-reported and lack customer-level denominators. The evidence supports real enterprise use while leaving account concentration, renewal durability, and independent outcome verification unresolved.
sections:
  - id: customer-segments
    title: Enterprise reach is clearer than buyer or payer mix
    body: >-
      August 2026 coverage reports that HappyRobot works with more than 150 enterprise customers, naming DHL, Kuehne + Nagel, Naturgy, Repsol and Uber; a September 2025 company-issued release had described 70+ enterprise supply-chain customers, including DHL, Ryder and Werner. Those dated figures have different stated scopes and should not be treated as a reconciled growth cohort: neither source defines active or paying status, and neither allocates accounts by industry, geography, size, buyer or payer. The clearest use-case detail is concentrated in logistics, particularly DHL and the WALTER Group. Insurance, energy and utilities, telecommunications, and airlines are described as expansion sectors, not as a verified roster of paying deployments. Request a customer-level roster tied to contracts, deployment status, buyer, revenue band and geography before extrapolating from logos.
    claimRefs: [CU001, CU002, CU003, CU004, CU011, CU014]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption signals are meaningful but company-reported
    body: >-
      Public coverage repeats several operating indicators attributed to HappyRobot: one customer is said to automate 28,000 work hours per month; customer-care agents are reported at 9.4/10 satisfaction and more than 70% autonomous resolution on average; and reported net dollar retention exceeds 150%. Reporting also gives an initial go-live window of four to twelve weeks and describes follow-on sprints that refine live agents and add new ones. These are useful evidence of claimed activity and expansion, not audited customer outcomes. The articles do not identify the 28,000-hour customer, define the work-hour calculation, disclose the satisfaction sample or period, or state the NDR cohort and measurement window. Preserve each metric as reported and require customer-level evidence before using it in a retention or unit-economics case.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named deployments provide proof, with uneven reference depth
    body: >-
      DHL is the most detailed public customer example in the assigned evidence. Sovereign Magazine describes production workflows for appointment scheduling, driver coordination and warehouse operations, quoting DHL Supply Chain leadership on an 18-month validation process; this is reported evidence, not an independently measured before-and-after result. FreightWaves reporting says five to ten WALTER Group use cases are live across dispatching, payment collections and customer support, while TechTimes also names that deployment. Kuehne + Nagel appears in multiple current customer lists, but the reviewed coverage does not tie it to a specific workflow, deployment stage or outcome. The named-customer table is therefore a sample of publicly named accounts rather than an exhaustive customer enumeration, and inclusion in a roster is not by itself proof of production use.
    claimRefs: [CU003, CU004, CU011]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain open diligence questions
    body: >-
      The Next Web explicitly frames cross-industry durability as unproven, noting that whether agents hold up in industries messier than logistics remains a test. That limitation matters because published customer counts and aggregate activity metrics do not reveal the distribution of revenue or usage across accounts. The reviewed sources do not disclose customer-level revenue concentration, gross retention, churn, renewal rates, contract lengths, or the cohort and period behind the reported NDR. Nor does this assigned evidence set surface customer complaints or failed deployments; that bounded absence is not evidence that none exist. Obtain a customer reference set spanning expansions and non-renewals, reconcile the reported NDR to a dated cohort, and request deployment-level outcome data with denominators before treating expansion as durable.
    claimRefs: [CU008, CU012, CU013]
