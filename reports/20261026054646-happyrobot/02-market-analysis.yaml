        - label: Digital freight brokerage
          value: "$5.62B (TBRC) / $9.1B (GVR) in 2026"
          unit: "USD; conflicting publisher estimates"
          note: "Freight-service revenue, not isolated agent-software spend."
        - label: Logistics workflow automation
          value: "Not separately sized"
          unit: "Public evidence gap"
          note: "Company product descriptions establish workflows, not market revenue."
        - label: HappyRobot serviceable market
          value: "Not disclosed"
          unit: "Public evidence gap"
          note: "No source provides a customer- and workflow-bounded SAM or SOM."
        - label: Buyer budget and contract unit
          value: "Not disclosed"
          unit: "Public evidence gap"
          note: "Payer, pricing unit, and conversion economics need customer or company diligence."
    approximationNotes: >-
      Qualitative scope ladder only; layers are not to scale, are not proven to be nested, and are not additive. Dollar values repeat source-reported figures in TM002; they do not define HappyRobot's TAM, SAM, SOM, market share, or valuation.
    claimRefs: [CM003, CM004, CM005, CM006, CM015]
