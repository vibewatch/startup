company:
  name: HappyRobot
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence points to strong company-reported expansion, including revenue growth above 5x since the Series B and net dollar retention above 150%, but does not establish absolute revenue, ARR, realized pricing, margins, cash, burn, or runway. A $150 million Series C and stated hiring priorities provide evidence of financing and intended deployment, not of cash available or capital adequacy.
sections:
  - id: revenue-quality
    title: Reported traction is promising but not underwritable
    body: >-
      Fortune reported that revenue had grown more than 5x since the Series B and that net dollar retention had topped 150%, attributing both figures to CEO Pablo Palafox. The report does not give an absolute revenue or ARR base, the measurement window for retention, cohort composition, or a reconciliation to recognized revenue (CI003, CI004). Fortune also reported that one large U.S. supply-chain customer expanded its contract 10x in a single year; that is a single customer example, not a representative expansion rate (CI005). The same article reported more than 150 enterprise customers as of its August 2026 coverage (CI006). These are useful signals of adoption and expansion, but they remain founder-attributed or reported operating metrics rather than audited financial statements. MasternodeAI repeats Fortune's financing and operating figures and explicitly attributes the story to Fortune, so it is not independent corroboration (CI001-CI005).
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI002]
  - id: monetization-and-delivery
    title: Monetization and delivery economics remain opaque
    body: >-
      The product is described as AI workers handling enterprise operational communications and connected tasks (CI016). Sacra characterizes the business as B2B SaaS and says pricing is "likely" tied to usage volume or active workers, but the page offers no verified tariff, contract minimum, realized discount, or revenue-recognition detail (CI013). Treat that pricing description as an analyst hypothesis, not a disclosed company term. HappyRobot's August 2026 funding announcement says proceeds will accelerate engineering, deployment, and go-to-market teams (CI007); its September 2025 company-issued Series B release also described investment in product engineering, forward-deployed engineering, and go-to-market staffing (CI008). This deployment emphasis makes implementation and human-support costs material diligence items, but neither source quantifies them. A Microsoft for Startups feature describes infrastructure and customer-connection support from the program, not a cash contribution or a quantified channel-economics benefit (CI015).
    claimRefs: [CI007, CI008, CI013, CI015, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: cost-structure-and-capital
    title: Capital raised does not establish runway or margin
    body: >-
      Fortune reported a $150 million Series C at a $1.2 billion valuation, and HappyRobot's own blog lists the Series C announcement and its intended expansion priorities (CI001, CI002, CI007). The round size is gross financing raised, not a reported current cash balance; no source in this assigned evidence states post-close cash, burn, debt obligations, or runway. Sacra flags model-cost inflation as a possible gross-margin pressure, but provides no company-specific inference-cost, telephony, implementation, support, or gross-margin data (CI014). Its fetched profile also displays a $500 million valuation and $62 million funding figure for 2025; those are historical page figures with no stated publication date or methodology and should not be treated as current financing totals (CI010, CI011). Caplight's page labels August 4, 2026 as the latest round date but its rendered valuation and total-funding fields contain no numeric values (CI012). Accordingly, the round is evidence of access to financing, not proof that capital is adequate for the planned expansion.
    claimRefs: [CI001, CI002, CI007, CI010, CI011, CI012, CI014]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting depends on private operating records
    body: >-
      Current public evidence supports a growth-and-retention narrative, but not a revenue multiple, gross-margin path, payback period, or cash runway. A 2025 company-issued release claimed returns exceeding 119x initial investment for collections; it did not state the calculation period, customer-level denominator, implementation cost, or independent verification in the fetched release (CI009). That claim should be treated as promotional and not used as a forecast or unit-economics benchmark. The underwriting case therefore depends on reconciling booked and recognized revenue with contracted usage, customer cohorts, churn and expansion, while separately measuring model and delivery costs. The map below is a conceptual diligence chain, not a measured revenue bridge: the public record does not quantify any of its price, cost, gross-profit, or cash-conversion steps. Until management supplies those records, margin and capital-adequacy conclusions remain open.
    claimRefs: [CI009, CI013, CI014]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns: [Stream or mechanism, Public evidence, Financial status, Diligence ask]
    rows:
      - ["Enterprise AI-worker deployments", "Company describes AI workers for operational workflows; Sacra characterizes the model as B2B SaaS", "Subscription structure is an analyst characterization; customer contracts and recognized revenue are unavailable", "Obtain executed order forms and revenue-recognition policy by product and customer"]
      - ["Usage or active-worker pricing", "Sacra says pricing is likely tied to usage volume or active workers", "Hypothesis only; no numerical tariff or realized price was found in the cited page", "Obtain price schedules, usage definitions, discounts, minimums, and invoice samples"]
      - ["Forward-deployed implementation and support", "Company releases describe forward-deployed engineering and deployment-team investment", "Service scope, fees, cost allocation, and recurring support burden are not quantified", "Separate implementation fees from recurring revenue and allocate delivery labor by deployment"]
      - ["Collections and other workflow outcomes", "A company-issued 2025 release claimed collections returns above 119x initial investment", "Promotional ROI claim; timeframe, denominator, costs, and independent verification are not stated", "Request the case-study calculation, baseline, customer approval, and all-in cost denominator"]
    notes: "Disclosure inventory from assigned fetched sources, not a complete product catalogue; company-reported ROI and Sacra's pricing hypothesis are not audited or independently established."
    claimRefs: [CI008, CI009, CI013, CI016]
  - id: TI002
    title: Reported traction and metric limitations
    columns: [Metric, Reported value, Attribution and period, Underwriting limitation]
    rows:
      - ["Revenue growth", "More than 5x", "Founder told Fortune; since the Series B", "No absolute revenue base, exact measurement dates, or accounting basis disclosed"]
      - ["Net dollar retention", "Above 150%", "Founder told Fortune; measurement period not specified", "No cohort definition, gross retention, churn, or calculation methodology disclosed"]
      - ["Contract expansion", "10x", "One large U.S. supply-chain customer; within a single year, per Fortune", "Single example; contract value, starting base, and representativeness are not disclosed"]
      - ["Enterprise customers", "More than 150", "Fortune coverage in August 2026", "Customer definition, revenue contribution, concentration, and active status are not disclosed"]
      - ["Collections return on investment", "Above 119x initial investment", "HappyRobot company-issued Series B release, September 2025", "Promotional claim without stated denominator, period, all-in costs, or third-party verification"]
    notes: "All reported values retain the source's metric name and period; founder and company claims are not audited. A blank or absent base is not zero."
    claimRefs: [CI003, CI004, CI005, CI006, CI009]
  - id: TI003
    title: Unit economics and capital adequacy checklist
    columns: [Input, Publicly supported status, Why it matters, Diligence evidence required]
    rows:
      - ["Realized price and contract terms", "No numerical tariff in cited sources; Sacra offers only a qualified usage-pricing hypothesis", "Determines revenue per workflow and expansion economics", "Customer contracts, usage schedules, discounts, minimums, and billed-versus-recognized reconciliation"]
      - ["Revenue base and quality", "Founder-reported growth above 5x since Series B; absolute revenue and ARR are not supplied in the cited coverage", "Needed to evaluate scale, revenue quality, and valuation", "Monthly income statements, revenue-recognition policy, backlog, churn, and customer cohorts"]
      - ["Gross margin and variable delivery cost", "No company gross margin or inference, telephony, support, or implementation cost is reported; Sacra flags model-cost inflation as a risk", "Required to test whether automation scales profitably", "Cost by workflow/customer, model and telephony invoices, forward-deployed labor, and support allocation"]
      - ["Cash, burn, runway, and debt", "Not established by the assigned sources", "Determines financing dependency and solvency buffer", "Latest balance sheet, monthly cash-flow statements, debt schedule, and board-approved runway plan"]
      - ["Financing proceeds", "$150 million Series C reported at a $1.2 billion valuation; company says it will support expansion", "Round proceeds are not equivalent to cash on hand or unrestricted cash", "Net proceeds after fees, closing statements, restrictions, and cash reconciliation"]
      - ["Historical comparison", "Sacra's fetched page displays $500 million valuation and $62 million raised for 2025; methodology and page publication date are unstated", "Useful only as a dated display, not as current valuation or total funding", "Dated source notes and a reconciled financing schedule"]
    notes: "Unknown means unavailable in the assigned evidence, not zero. Funding raised, valuation, revenue, accounting loss, cash burn, and cash available are distinct measures."
    claimRefs: [CI001, CI002, CI003, CI010, CI011, CI012, CI013, CI014]
