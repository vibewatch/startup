    type: flow
    summary: "A conceptual chain of underwriting inputs; the cited public evidence does not disclose realized prices, direct costs, gross profit, or cash conversion."
    data:
      nodes:
        - id: customer-need
          label: Customer operational need
          detail: "The cited sources describe high-volume operational communications but do not quantify customer workload."
        - id: customer-work
          label: Enterprise operational workflows
          detail: "AI workers are described for enterprise operations; workflow volume is not reported here."
        - id: contract-revenue
          label: Contract price and recognized revenue
          detail: "Pricing is only hypothesized by Sacra; no tariff or revenue-recognition data is supplied."
        - id: delivery-cost
          label: Model, telephony, deployment, and support cost
          detail: "Potential cost drivers are unquantified; Sacra flags model-cost inflation risk."
        - id: margin-cash
          label: Gross profit
          detail: "Company gross margin is not established."
        - id: cash-conversion
          label: Cash conversion and runway
          detail: "Cash balance, burn, and runway are not established."
      edges:
        - from: customer-need
          to: customer-work
        - from: customer-work
          to: contract-revenue
        - from: contract-revenue
          to: delivery-cost
        - from: delivery-cost
          to: margin-cash
        - from: margin-cash
          to: cash-conversion
    claimRefs: [CI013, CI014, CI016]
