summary:
  headline: >-
    HappyRobot has meaningful reported enterprise adoption and a $1.2 billion Series C mark, but opaque financials and
    unverified operating outcomes support a track recommendation at a stretched valuation.
  overallScore: 6.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
