companyProfile:
  summary: >-
    HappyRobot is a private enterprise software company building AI workers and workflow tools for operations-heavy
    businesses. Company materials describe agents that handle voice and text interactions, use shared operational
    context, and invoke enterprise integrations; public customer evidence is strongest in logistics and supply chain.
    Its August 2026 Series C established a reported $1.2 billion post-money financing mark, while revenue, margins,
    customer economics, and governance remain insufficiently disclosed for underwriting.
