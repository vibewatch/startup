company:
  name: HappyRobot
chapter:
  number: 1
  title: Company Overview
  summary: >-
    HappyRobot is an enterprise AI platform focused on operational workflows, with a
    reported $150 million Series C at a $1.2 billion post-money valuation. The funding
    and customer scale are supported by company disclosures and independent coverage,
    while total funding, founding year, headcount, financial performance, and governance
    remain incompletely reconciled or privately evidenced.
sections:
  - id: identity-and-product
    title: Identity and product
    body: >-
      HappyRobot describes itself as an AI-native operating system for the “real economy,”
      using AI workers to automate operational work rather than selling physical robots
      (CO001). Its public descriptions center on agents that communicate across voice,
      email, documents, and web workflows and act within enterprise systems; this is a
      company-described product scope, not an independently tested capability (CO001).
      Microsoft for Startups described HappyRobot as a program participant and said its
      agents worked with Microsoft Teams for customer interactions (CO014). Profile
      publishers place the company in San Francisco, while Tracxn separately lists a
      Dallas registered address, so the reviewed sources do not establish legal domicile
      or a definitive principal office (CO002). The company’s 2025 Series B release
      describes the founders launching HappyRobot in 2023, while a data provider lists
      2022 as the founding year (CO003, CO004).
    claimRefs: [CO001, CO002, CO003, CO004, CO014]
  - id: funding-and-scale
    title: Financing and disclosed scale
    body: >-
      On August 4, 2026, HappyRobot announced a $150 million Series C at a $1.2 billion
      post-money valuation, led by Prysm Capital and co-led by Eurazeo (CO005). The
      company described total funding as around $200 million, while Tracxn reports
      $210 million across four rounds; the difference is not reconciled in the assigned
      evidence (CO006, CO007). Tracxn and the 2025 company-issued Series B release also
      record the earlier Series A and Series B financing and their lead investors
      (CO008). HappyRobot and Tech.eu report more than 150 enterprise customers, but
      this remains a reported company scale metric rather than an independently audited
      customer count (CO010). Employee figures also differ: Tracxn reports 258 as of
      “Sep 26” without specifying a year, while FundedIQ gives a 101–250 band (CO011,
      CO012). Neither revenue nor ARR should be inferred from funding or these operating
      disclosures.
    claimRefs: [CO005, CO006, CO007, CO008, CO010, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Tracxn identifies Pablo Palafox as co-founder and CEO, Luis Paarup as co-founder
      and CTO, and Javi Palafox as a co-founder; HappyRobot’s Series B release names
      Pablo Palafox, Luis Paarup, and Javier Palafox as co-founders (CO009). This
      supports a three-founder roster and two functional roles, but the assigned
      sources do not establish a complete current executive team, board composition,
      succession arrangements, or individual ownership. The investor disclosures
      identify round participants and leads, not their voting rights, preference terms,
      or economic stakes (CO005, CO008). The diligence implication is concentrated
      information risk: the public record is adequate to identify the founders and
      fundraising counterparties, but not to assess key-person dependence or investor
      control. Obtain the current organization chart, board roster, cap table, and
      financing documents before drawing conclusions about governance.
    claimRefs: [CO005, CO008, CO009, CO016]
    tableRefs: [TO002, TO003]
  - id: milestones-and-evidence-limits
    title: Milestones and evidence limits
    body: >-
      The dated public record supports seven milestones spanning founding, successive
      financing, a Microsoft for Startups feature, customer scale, and international
      office expansion (CO003, CO005, CO008, CO010, CO013, CO014). It does not supply a
      separately dated product launch, a documented regulatory milestone, or a
      company-specific adverse event suitable for an eighth timeline entry; the
      chronology therefore retains an explicit gap rather than inventing an event.
      Sequenced.ai’s September 2026 review states that it had not measured HappyRobot’s
      claimed automation rates, cost reductions, or voice performance (CO015). That is
      a limitation on independent verification, not evidence that the claims are false.
      The assigned sources also do not establish audited revenue or ARR, gross margin,
      cash balance, burn, runway, debt, or secondaries (CO016). No recorded adverse
      event in this limited pool should be treated as proof that none occurred.
    claimRefs: [CO003, CO005, CO008, CO010, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
