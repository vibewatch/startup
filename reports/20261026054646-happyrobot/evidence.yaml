evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      A reconciled financing schedule explaining the company's approximately $200 million figure versus Tracxn's $210
      million total.
    whyItMatters: >-
      Total proceeds affect dilution and funding history, while published totals may differ by round coverage or
      treatment of non-equity financing.
    diligencePath: >-
      Obtain the dated cap table and signed financing schedule, reconcile each round and any credit facilities to cash
      proceeds.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: founding-and-headcount
    missingEvidence: A company-confirmed founding/operating-start date and a dated employee count with a consistent measurement basis.
    whyItMatters: >-
      The 2022–2023 founding discrepancy and 101–250 versus 258 headcount estimates affect company age, scale, and
      productivity comparisons.
    diligencePath: >-
      Confirm incorporation and commercial-launch dates with corporate records, then request the latest HR roster and
      contractor policy.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-capitalization
    missingEvidence: >-
      Current board roster, ownership percentages, voting and protective rights, liquidation preferences, secondary
      sales, and debt or credit agreements.
    whyItMatters: >-
      Investor names and round leadership do not establish control, dilution, founder dependence, or senior claims on
      proceeds.
    diligencePath: >-
      Review the fully diluted cap table, charter, investor rights agreements, board materials, and debt/secondary
      transaction schedule.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements and confirmed revenue/ARR, gross margin, cash, burn, and runway.
    whyItMatters: >-
      Funding raised and company-reported operating scale do not establish revenue quality, unit economics, liquidity,
      or solvency.
    diligencePath: >-
      Obtain audited or reviewed financial statements, monthly management accounts, bank/cash reconciliation, and a
      runway bridge.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: operating-performance-verification
    missingEvidence: Customer-level measurement of autonomous resolution, CSAT, ROI, reliability, and human escalation rates.
    whyItMatters: >-
      The assigned independent review did not measure the company's reported operating performance, limiting confidence
      in efficiency claims.
    diligencePath: >-
      Sample production logs and customer references; reconcile denominators, measurement windows, task mix, and human
      overrides.
    relatedQuestionRefs:
      - QO009
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-timeline
    missingEvidence: >-
      A separately dated product launch, leadership change, regulatory milestone, or company-specific adverse event to
      complete an eighth distinct entry.
    whyItMatters: >-
      The available dated record is weighted toward financing and company-reported scale rather than product and
      governance milestones.
    diligencePath: >-
      Request the dated product-release log, regulatory/legal chronology, board and leadership-change history, and
      incident register.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: company-specific-serviceable-market
    missingEvidence: >-
      A customer- and workflow-bounded estimate of HappyRobot's serviceable market, obtainable share, contract values,
      and buyer-owned budget.
    whyItMatters: >-
      Broad AI-agent spending and freight-brokerage revenue cannot establish the company's SAM, SOM, or potential
      penetration.
    diligencePath: >-
      Request management's segment-level TAM/SAM model, contract and pricing definitions, and customer-level workload
      and conversion data; reconcile every included revenue pool to avoid overlap.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: enterprise-agent-production-adoption
    missingEvidence: >-
      A primary, consistently defined survey or cohort dataset for pilot-to-production conversion, deployment period,
      and failure reasons.
    whyItMatters: >-
      The available publications report different production-scale ranges and do not expose a common denominator or
      underlying primary data.
    diligencePath: >-
      Obtain the cited primary research or a transparent enterprise cohort study and verify definitions of pilot,
      production, and production scale.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: competitor-financials
    missingEvidence: >-
      Comparable, independently sourced ARR or revenue, funding history, customer scale, and contract economics for
      HappyRobot's direct logistics-agent competitors and adjacent platforms.
    whyItMatters: >-
      Without comparable scale and commercial evidence, relative durability, financing capacity, and vendor economics
      cannot be underwritten against Sierra or named logistics-agent entrants.
    diligencePath: >-
      Request current financial and customer references from the vendors, then validate against filings, customer
      procurement records, or independent analyst coverage.
    relatedQuestionRefs:
      - QP002
  - type: missing-source
    severity: material
