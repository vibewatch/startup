schemaVersion: "report-v2"
artifact: valuation
slug: happyrobot
runDate: 2026-10-26
company:
  name: HappyRobot
chapter:
  number: 8
  title: Valuation
  summary: Public reporting puts HappyRobot's August 2026 Series C at $150 million and a $1.2 billion post-money valuation, but the assigned evidence does not provide a company-specific revenue denominator, audited margins, or financing terms. Broad AI multiple datasets are directional rather than direct comparables, so the evidence supports a conditional track recommendation, not a price-backed buy.
sections:
  - id: financing-mark
    title: The financing mark is visible; its fundamentals are not
    body: >-
      WilmerHale's announcement and FreightWaves reporting put the August 2026 Series C at
      $150 million and the post-money valuation at $1.2 billion; both describe a round led by
      Prysm Capital and co-led by Eurazeo (CV001, CV002). WilmerHale says total funding was
      around $200 million at that point (CV003). The disclosed round is evidence of a negotiated
      financing mark, not an independently assessed fair value or proof of cash available to
      the business. Earlier company-published round figures are $44 million for the Series B
      and $15.6 million for the Series A; the Series A post said cumulative funding then was
      $17.5 million (CV004-CV006). Caplight's public profile shows an August 4, 2026 last-round
      date, but its public page does not expose valuation or round amounts and directs users
      to request access for coverage (CV007). The Yahoo Finance and FreightWaves entries carry
      the same reporting text and are treated as one reporting account, not independent
      corroboration of one another.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Adoption signals support the thesis, but not a revenue multiple
    body: >-
      The investment thesis is that operational workflows can expand from a first deployment
      into a broader, repeatable platform: FreightWaves reports more than 150 enterprise
      customers and five to ten live use cases at the WALTER Group (CV008, CV009). Microsoft's
      October 2025 partner article describes Microsoft Teams collaboration and says Microsoft
      provided technical, infrastructure, and go-to-market support (CV014). Those signals
      indicate deployment and ecosystem access, but the material is a mix of third-party
      reporting, a partner profile, and company-related statements rather than verified
      customer economics. The counter-thesis is that the reported financing mark cannot be
      tested against company-specific revenue, gross margin, retention, cash needs, or the
      Series C's preference and dilution terms in this assigned evidence set (CV015). General
      AI valuation datasets show a wide range, but neither is a clean HappyRobot peer set:
      the Finro Q1 2026 Series C cohort spans multiple AI niches, while Aventis describes a
      broader AI sample that includes financing and M&A transactions (CV010-CV013). The
      resulting uncertainty is material to both entry price and exit readiness.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenario-discipline
    title: Scenarios remain conditional until company economics are verified
    body: >-
      At the reported $1.2 billion post-money mark, an investor cannot calculate a company-
      specific enterprise-value-to-revenue multiple or dilution-adjusted return from the
      retained evidence because no numeric HappyRobot revenue or ARR denominator and no
      financing preference terms are supplied here (CV002, CV015). Finro reports a 17.0x
      median EV/revenue multiple for 65 Series C AI companies in its Q1 2026 dataset, with a
      10.3x–34.2x interquartile range; Aventis reports a 24.2x median revenue multiple for an
      AI financing/M&A sample and cautions that it includes large, successful companies
      (CV010-CV013). These are orientation points, not a valuation formula for HappyRobot.
      The bull case therefore requires verified recurring revenue, durable expansion, and
      attractive gross margins; the base case treats the financing as the only disclosed
      mark; and the bear case is a value below that mark if deployment economics or financing
      terms disappoint. No numeric scenario range or probability is defensible without
      company-specific inputs. The recommendation logic is summarized in the flow exhibit.
    claimRefs: [CV002, CV010, CV011, CV012, CV013, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Track pending price and exit-readiness evidence
    body: >-
      The appropriate current stance is track, with high diligence risk and medium confidence:
      the financing mark and operating reach are meaningful signals, but the public evidence
      is not sufficient to establish affordability, ownership dilution, or expected return
      (CV001-CV003, CV008, CV009, CV015, CV016). Before underwriting, obtain audited or
      investor-verified revenue and ARR reconciliations, gross margin and contribution
      economics by workflow, retention/cohort definitions, cash and burn, and the fully
      diluted cap table with Series C preference and secondary-sale details. Test customer
      concentration and whether the reported use-case expansion converts into repeatable,
      profitable deployments. A thesis break would include material churn or contraction,
      deployment costs that prevent attractive margins, a down round or senior preference
      stack that impairs common equity, or failure to convert expansion into durable revenue.
      Exit readiness and a target return remain open until those inputs and a credible
      liquidity path are documented; do not substitute total funding raised for cash
      available or reported customer counts for revenue.
    claimRefs: [CV001, CV002, CV003, CV008, CV009, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: The reported $1.2 billion post-money mark is not testable against company-specific revenue or financing terms in this assigned evidence set.
    claimRefs: [CV002, CV015, CV016]
  - calloutType: risk
    title: Return range is unpriced
    body: Require verified revenue, margins, cash needs, and preference terms before assigning scenario values or an exit multiple.
    claimRefs: [CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
    - - 'Recommendation'
      - 'Track'
      - 'Do not underwrite a buy without company-specific financials and financing terms.'
    - - 'Confidence'
      - 'Medium'
      - 'The financing mark is reported, but operating economics and ownership terms remain unverified here.'
    - - 'Risk rating'
      - 'High'
      - 'Valuation and liquidity uncertainty create material underwriting risk; this is not a claim of financial distress.'
    - - 'Valuation stance'
      - 'Stretched'
      - 'A $1.2 billion post-money mark is reported, but no verified revenue denominator supports an affordability test.'
    notes: The valuation mark is a reported Series C post-money figure; no fair-value appraisal or company-specific valuation multiple is available in the assigned evidence.
    claimRefs: [CV001, CV002, CV015, CV016]
  - id: TV002
    title: Investment thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - - 'Thesis: enterprise adoption'
        - 'FreightWaves reports more than 150 enterprise customers and five to ten live WALTER Group use cases.'
        - 'Verify customer references and recurring revenue by cohort.'
      - - 'Thesis: workflow expansion'
        - 'The reported WALTER Group use cases span several operational workflows; Microsoft describes Teams and infrastructure support.'
        - 'Confirm implementation costs and whether expansion is repeatable without proportional services.'
      - - 'Anti-thesis: financing mark'
        - 'A $1.2 billion post-money mark is reported, but the assigned sources do not disclose company revenue or gross margin.'
        - 'Reconcile audited revenue and margins to the current round terms.'
      - - 'Anti-thesis: ownership and exit'
        - 'Preference, dilution, cash runway, and liquidity terms are not established in the assigned evidence.'
        - 'Obtain the fully diluted cap table, preference stack, cash/burn data, and a credible exit path.'
    notes: Customer and partner signals are reported or attributed, not independent verification of company economics. Missing values remain diligence gaps rather than estimates.
    claimRefs: [CV001, CV002, CV008, CV009, CV014, CV015, CV016]
  - id: TV003
    title: Conditional bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation range and return logic, Key risks, Probability signal]
    rows:
      - - 'Bull'
        - 'Verified recurring revenue grows through customer expansion and multi-workflow deployments; gross margins remain attractive and Series C terms do not materially impair common ownership.'
        - 'Above the reported $1.2 billion financing mark only if verified revenue and exit evidence support it; no numeric upper range or return is defensible from this evidence.'
        - 'Deployment economics and customer concentration.'
        - 'Uncalibrated; verify retention, margin, and customer-level expansion before assigning likelihood.'
      - - 'Base'
        - 'The reported $1.2 billion post-money round remains the only company-specific mark; financial performance and terms are not independently underwritten here.'
        - 'Use $1.2 billion only as the reported financing reference, not fair value; no target return or fair-value interval can be calculated.'
        - 'Missing revenue denominator, preference terms, and liquidity path.'
        - 'No probability assigned; the mark is observable but fundamental support is incomplete.'
      - - 'Bear'
        - 'Customer expansion fails to convert to durable revenue, implementation costs constrain margins, or senior financing terms dilute common-equity outcomes.'
        - 'Below the reported $1.2 billion mark; downside floor and magnitude cannot be estimated from the assigned evidence.'
        - 'Down round, preference overhang, churn, and inability to reach profitable scale.'
        - 'Uncalibrated; monitor verified churn, gross margin, cash runway, and subsequent financing terms.'
    notes: Scenarios are directional and conditional, not forecasts. The only company-specific mark is the reported Series C post-money valuation; unsupported numeric ranges and probabilities are intentionally omitted.
    claimRefs: [CV001, CV002, CV010, CV011, CV012, CV013, CV015, CV016]
