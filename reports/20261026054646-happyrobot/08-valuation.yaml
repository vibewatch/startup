  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-evidence-gap
      missingEvidence: Audited revenue and ARR, gross margin and workflow-level delivery cost, cash and burn, customer retention definitions, and the fully diluted cap table with Series C preference and secondary-sale terms.
      whyItMatters: Without these denominators and ownership terms, the reported post-money mark cannot be translated into a company-specific multiple, common-equity value, downside, or target return.
      diligencePath: Request audited statements, ARR/revenue reconciliation, cohort and margin schedules, current cash/runway, the financing documents, and a fully diluted cap table from management and lead investors.
      relatedQuestionRefs: [QV005, QV007, QV009]
      relatedTableRefs: [TV001, TV002, TV003]
    - type: missing-source
      severity: material
