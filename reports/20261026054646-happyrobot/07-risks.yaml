      Qualitative labels only; no probabilities, rankings, or measured control
      effectiveness are inferred from the available sources.
    claimRefs: [CR004, CR005, CR006, CR007, CR010, CR011, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Bound authority before expanding autonomy
    body: >-
      A wrong price or appointment can move from a conversational error into a
      commercial or operational commitment. Require operator confirmation for
      consequential actions until workflow-specific authority and recovery tests
      pass.
    claimRefs: [CR004, CR005, CR007]
  - calloutType: insight
    title: Advertised controls are not assurance
    body: >-
      Versioning, audits, and quality scores are described in vendor materials;
      independent measurements of reliability, security, and recovery were not
      present in this assigned evidence.
    claimRefs: [CR002, CR003, CR009, CR016]
  - calloutType: recommendation
    title: Diligence the denominators
    body: >-
      Tie claims of customer expansion and operating outcomes to audited
      performance cohorts, customer-level revenue, deployment cost, cash, and
      runway before treating them as evidence of durable economics.
    claimRefs: [CR008, CR009, CR010, CR014, CR016]
