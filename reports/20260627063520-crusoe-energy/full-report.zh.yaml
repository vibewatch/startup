      - number: '2.5'
        title: 采用约束与竞争风险
        blocks:
          - type: paragraph
            body: >
              供给扩张的结构性约束是电力。2025–2026 年进入电网并网队列的新数据中心项目，在美国主要市场通常要等待 4 到 10 年。 Northern
              Virginia——美国最大数据中心市场——拥堵严重，公用事业公司已警告区域电力短缺，迫使新项目转向二级电网区域的二级市场。 World Economic Forum（2026 年 5 月）把电网连接称为「the
              strategic bottleneck for AI」，并指出， AI 园区开发商如果把分阶段连接、现场储能和负载控制结合起来，就能在电网加固完成前开始运营。

              资本强度构成高门槛竞争护城河。吉瓦级 AI 数据中心每个园区需要超过 $1 billion 的建设和基础设施投资， 有效竞争集合被限制在资本充足玩家中。表后电源方案（Bloom Energy
              燃料电池、太阳能加储能、下一代核微反应堆） 正成为不能等待电网并网的运营商标配，但这些方案同样需要大量前期资本。

              客户迁移成本是中等但真实的进入和流失壁垒。生产 AI 负载在 GPU 云提供商之间迁移，需要数据迁移、应用重构、API 变更和合规重新认证。 这会形成锁定，尤其针对已投入集成的企业和主权买方。不过 AI
              原生创业公司通常更敏感于价格，也更愿意切换。

              NVIDIA 在 AI 加速器的主导地位，为所有 neocloud 玩家带来集中风险。NVIDIA 掌握约 95% 的 AI 训练加速器市场； Cerebras（wafer-scale
              engine）、Groq（近期通过团队收购被 NVIDIA 吸收）和 AMD MI 系列芯片等替代品存在， 但在大规模训练生产中的采用有限。可靠性担忧是 neocloud
              类别特有的结构性风险：企业买方期待超大规模云级 SLA 承诺（99.99%+）， 但早期 neocloud 在实践中难以匹配，Crusoe 自己 2025 年 3 月 45 小时中断和 2026 年 5
              月网络事件就是例子。
