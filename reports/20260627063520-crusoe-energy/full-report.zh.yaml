      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 电力才是市场决定性护城河——不是资本或 GPU
            body: >
              neocloud 市场已经发生结构性转变：获取电力（而不是 GPU 硬件或风险资本）成为长期竞争位置的首要决定因素。 4–10 年并网延迟意味着，任何在 2023–2024 年锁定电力的运营商，都拥有 2026
              年及以后容量。Crusoe 的能源优先传承—— 搁浅气捕获、可再生能源选址、表后发电——原本是气候策略，却在最关键的时点变成持久的结构性护城河。 We The Flywheel（2026）明确把这一点识别为
              Crusoe 相较 CoreWeave 和其他同行得分最高的差异化因素。
            calloutType: insight
            claimRefs:
