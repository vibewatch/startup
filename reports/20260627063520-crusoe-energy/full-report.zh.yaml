      - number: '7.5'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >
              2025 年 Crusoe 员工数增至 1,217 人，超过翻倍，已连续第二年翻倍。技术和建设管理岗位都以这种速度超高速招聘，带来组织风险：整合和文化压力、对联合创始人 Chase
              Lochmiller（CEO）和 Cully Cavness（COO）的关键人依赖，以及同时推进多个 GW 级建设组合时的执行质量风险。公司 2025 年债务工具总额约 $975 million，2025
              年中还从 Brookfield Asset Management 安排了额外 $750 million 信贷额度。各轮融资累计筹资约 $3.9 billion。对私营公司而言，资本深度异常突出；但偿债义务叠加
              GPU 采购和建设的激进资本开支，形成高烧钱动态：客户激活或收入确认出现任何实质延迟，都可能压迫资产负债表。Blue Owl 新闻稿对完整 Abilene 园区的成本估算约 $12 billion，意味着
              Crusoe 股权和债务合计覆盖不到已承诺建设价值的三分之一——余下部分需要项目融资或追加股权。近期 Wyoming 暂停说明，在收入锁定前，客户驱动的范围变化就能固化搁浅成本风险。最后，2025 年将
              Bitcoin mining 业务剥离给 NYDIG，移除了一条虽有周期性、但能产生现金的收入腿，而 AI 基础设施侧仍在爬坡至利用率。
