      - number: '8.6'
        title: 最终尽调要求
        blocks:
          - type: paragraph
            body: >
              以下尽调事项是以 $10B 或更高估值投资的前置条件。事项按重要性排序：高优先级事项涉及客户集中和财务验证；中优先级覆盖法律、技术和运营尽调；低优先级为信息性和确认性。所有事项都应在结构化 data room
              流程中审阅，并取得经审计财务、已签署客户合同和购电协议。投资者在出资前，应要求提供 xAI 已承诺容量 run-rate、按产品线拆分的毛利率，以及 DFM
              油田业务剥离当前状态的证据。尽调清单只是对本分析识别的最重大缺口的部分列举；在按二级或一级市场价格作出任何投资决定前，仍需完成完整的商业、法律、技术和财务尽调。
