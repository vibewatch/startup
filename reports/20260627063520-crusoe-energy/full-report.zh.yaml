      - number: '6.5'
        title: 采购模式、集中度风险与负面信号
        blocks:
          - type: paragraph
            body: >-
              Crusoe 的 hyperscale 数据中心采购遵循先落地、再扩张的模式，以分阶段园区承诺为锚。Oracle 和 OpenAI 承接 Abilene Phase
              1（200MW+）并成为建设催化剂；Microsoft 承接 Phase 2（900MW），把园区扩至总计 1.2GW。分阶段结构对双方都合理：客户不提前承诺完整阶段，以对冲建设风险；Crusoe
              在整个园区订满前拿到锚定客户，得以启动建设融资。风险在于，后续阶段需要同一租户再次承诺，或找到替代方；Wyoming 项目暂停说明 Crusoe 不能假设 Phase 2 会自然跟随 Phase 1。

              云采购有两条路径。自助买家通过 crusoe.ai/cloud 注册，初始试用后转入月度或年度 GPU 预留合约。企业买家与 Crusoe 直销团队沟通，获得定制集群配置、专用私有网络和谈判后的
              SLA。Managed Inference 用户采用 API-key 模式，不预留集群，因此是迁移性最强、也最容易流失的分群。客户集中度是 Crusoe
              客户画像中最重要的风险信号。园区层有三个已确认或报道的锚定租户（Oracle、Microsoft、Meta），各自规模在 200MW–900MW，另有 xAI
              1GW+。若其中任意两个未能从报道合约转成已执行合约，Crusoe 的签约容量指标会显著下降，园区建设融资也可能承压。

              Wyoming 项目暂停——未具名客户要求停止——是 hyperscale 管线客户能够且确实会退出的最清晰证据。Crusoe 对客户指标的公开披露很少：没有客户数量、收入拆分或 同期群
              NRR。Worldmetrics 汇总的统计暗示云客户有数百家，但引用的是二手来源，没有一手数据。根据 Crusoe 新闻室，Upstream Data 专利诉讼已于 2025
              年通过许可协议解决；blockspace.media 报道称裁决结果「有利有弊」，认定侵权但损害赔偿有争议。Crusoe Cloud 核心业务是软件和基础设施，不是 DFM 硬件，因此 Upstream Data
              案件带来的残余 IP 风险范围有限；但若遗留业务增长，它为 DFM 技术 IP 挑战留下了先例。
