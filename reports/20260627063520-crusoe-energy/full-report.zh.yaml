      - number: '7.6'
        title: 缓释措施、终止标准与尽调要求
        blocks:
          - type: paragraph
            body: >
              Crusoe 已实施多项有意义的风险缓释。监管侧，剥离 Digital Flare Mitigation 业务，移除了对 BLM 和 EPA 甲烷执法周期的直接敞口；Crusoe Cloud 100%
              可再生能源匹配（通过 VPPAs、energy attribute certificates，以及 Iceland/Norway 直接供电）部分回应了 ESG 关切。ISO 27001 + 42001
              双认证（首批同时持有两项认证的 AI 云提供商之一）覆盖信息安全和负责任 AI 治理风险。客户集中度方面，2026 年 3 月宣布的模块化「Crusoe Spark」产品线面向较小 AI
              运营商，在大型园区和模块化单元之间形成杠铃策略。通过 AMD MI355X 承诺实现 GPU 供应商多元化，也对 NVIDIA
              供应链事件形成部分对冲。即便如此，仍有几类风险未被缓释或监控不足。Crusoe/Chevron/Engine No. 1 天然气电厂计划采用的碳捕集技术，没有确认设计伙伴、没有部署实例，却有 2027
              年供电期限——解决时间表很紧。锚定园区的客户流失（Wyoming 暂停、Abilene 阶段变化）披露透明度不足，难以监控。油田计算 IP 版图中，Upstream Data 创始人还持有至少 13 项未被
              2025 年 11 月和解解决的额外专利。投资者在把任何 Series E 之后估值视为可支撑前，应坚持要求公司按季度报告签约利用率与已投运容量的对比。
