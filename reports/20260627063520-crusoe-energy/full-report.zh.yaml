              Crusoe 未发布经审计财务报表。本章引用的 $276M（FY2024）和 $998M（FY2025）收入数字，是 Sacra Research 和 Cheddar Flow
              分析师基于公开信号得出的估计，并非管理层指引或经审计账目。投资者必须在尽调中验证实际收入。本章中的估值倍数和 MOIC 计算是方向性情景，不是预测，且可能与实际情况存在重大差异。
