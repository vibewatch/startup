              每家分析机构对 AI 基础设施市场的定义都不同：IDC 的 $487 billion（2026）和 Gartner 的 $37.5 billion （2026，AI-optimized
              IaaS）衡量的是重叠但并不相同的群体。投资者应把所有头部 TAM 数字当作方向性定位， 而不是精确输入。Crusoe 的具体 SAM——它在 neocloud
              和超大规模工厂市场中能可信赢下的份额——未公开披露， 也无法仅靠已发布数据推导出来。$487 billion（IDC 的 AI 基础设施总额）和 $23 billion（neocloud 板块）
              之间的证据缺口，本身就是需要用内部收入和管线数据打通的尽调问题。
