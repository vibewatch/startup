      - number: '6.4'
        title: 留存与耐久性：SLA 表现、CSAT 与切换经济
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 在 IaaS 层以合约保证 99.98% 集群正常运行时间和低于 90 秒的 VM 启动时间。99.98% 正常运行时间换算下来，每个集群每年允许的非计划停机约 105
              分钟。Windsurf 12 个月生产期内未报告 SLA 违约，是对该保证最强的独立验证。SemiAnalysis ClusterMAX 评测提到支持响应快于平均水平，Crusoe 报告过去 12 个月 CSAT
              为 100%——但这些数字都是自报，未经过独立审计，也没有被 Windsurf 案例之外的具名客户确认。

              Crusoe 状态页记录，ICAT 区域在 2026 年 6 月 17 日发生负载均衡器故障，端点约两小时不可达。该事件符合 SLA 冗余空间（一次事件仍在 99.98% 容忍度内），但也说明 Crusoe
              不能免疫所有云服务商都会遭遇的运营问题。Iceland 设施在 2025 年也发生过大范围光纤污染事件（火山灰碎屑影响 20,000 个光纤端面），需要物理修复。两起事件似乎都没有触发已发布的 SLA
              赔付或报告的客户流失，这与自报 100% CSAT 一致。

              Crusoe Cloud 没有公开披露 Net Revenue Retention 和 Gross Revenue Retention。Cheddarflow 基于定性扩张信号，估计 2025 年前 cohort
              的 NRR 在 110–130% 区间。该估计无法独立验证。不同层级的合约期限差异显著：hyperscale 数据中心租户签署 10 到 20 年购电协议，创造极耐久的收入；云客户签署月度或年度 GPU
              预留，迁移性更强，但仍有适度切换成本（负载集成、SLA 熟悉度、网络配置）。Windsurf 从 GPU IaaS 扩展到 Managed Inference，展示了推动 Crusoe Cloud 估计高 NRR
              的自然加购模式。缺少公开 NPS、独立 CSAT 审计或披露流失率，是潜在企业买家评估长期承诺时的重大尽调缺口。
