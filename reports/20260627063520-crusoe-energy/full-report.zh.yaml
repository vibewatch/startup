  - id: FE002
    title: 客户工作流与云运营流程
    type: flow
    layout: standard
    summary: 端到端路径从识别计算需求，到资源开通、编排、工作负载执行、监控和扩容，展示 AI 团队如何接触 Crusoe Cloud 的产品界面。
    data:
      nodes:
        - id: need
          label: AI 团队识别计算需求
          detail: 团队确认训练、微调或推理需求；超大规模云厂商定价超出预算或供给不足；也可能因数据本地性约束，需要边缘 / 本地计算。
        - id: provision
          label: 开通 GPU 资源
          detail: 客户通过 Crusoe Cloud Console、CLI 或 REST API 选择 GPU SKU（H100/H200/B200/MI300X）；VM 或集群在 90 秒内启动；选择按需或预留定价。
        - id: orchestrate
          label: 配置编排层
          detail: 客户部署 Managed Kubernetes（CMK）、Managed Slurm 或 AutoClusters；配置 InfiniBand RDMA 织网和 VPC 网络；设置块 / 对象存储。
        - id: run
          label: 执行 AI 工作负载
          detail: 训练任务在多节点集群上运行，AutoClusters 自动容错；推理流量经 Managed Inference 路由，并用 MemoryAlloy KV 缓存优化 TTFT。
        - id: monitor
          label: 监控并优化
          detail: Crusoe Command Center 提供实时可观测性；7×24 小时企业支持，首次回复时间 <6 分钟；CSAT 分数连续 12+ 个月保持 100%。
        - id: scale
          label: 扩容或扩展
          detail: 追加开通 GPU；谈判预留容量；若存在持续本地部署需求，Crusoe Spark 单元可在下单后三个月内交付。
    approximationNotes: 流程代表典型云客户旅程；超大规模托管客户走另一套定制园区建设流程。
