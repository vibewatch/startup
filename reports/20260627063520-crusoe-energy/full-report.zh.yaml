      - number: '5.3'
        title: 物理基础设施 —— Crusoe Spark 与 Hyperscale 园区
        blocks:
          - type: paragraph
            body: >-
              Crusoe 的物理基础设施业务有两种产品形态：预制模块化 AI 工厂单元 Crusoe Spark，以及大规模 hyperscale 托管园区。Crusoe Spark
              是交钥匙、类似集装箱的模块化数据中心，提供约 1 MW 高密度算力，集成配电、液冷或风冷、消防，以及为最新加速器打造的 GPU 机架。模块来自 Crusoe 位于科罗拉多州 Brighton、面积 352,000
              平方英尺的 Spark Factory；这是一项超过 $200 million 的制造投资，年产能最高 100 个模块，工厂制造单元计划在 2026 年 Q3 首次生产交付。Crusoe Spark
              可接入多元能源：首个公开部署位于 Nevada 的 Redwood Materials Tahoe Campus，使用二次生命 EV 电池微电网和太阳能，展示了 99.2% 正常运行时间。与 Energy
              Vault 的合作使 Spark 可从 2026 年起在 Texas Snyder 按 25 MW 规模部署。Hyperscale 侧，Texas Abilene 旗舰 1.2 GW 园区建在 Lancium
              Clean Campus 土地上，是 Stargate 计划的主要场址；其前两栋楼（980,000 sq ft，200 MW+）已经上线，为 Oracle Cloud Infrastructure 承载
              OpenAI 算力需求。面向 Microsoft 的第二个 900 MW Abilene 园区于 2026 年动工。Crusoe 从一开始就共同开发电力和建设，并在
              Colorado、Oklahoma、Louisiana 的设施中制造长交期电气组件；这种纵向整合深度，相比传统顺序开发能压缩部署周期。截至 2026 年 6 月，Crusoe 已签约 4.9 GW AI
              基础设施，管线超过 40 GW。
