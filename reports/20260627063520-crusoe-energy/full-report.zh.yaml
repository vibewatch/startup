      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              Crusoe 由 Chase Lochmiller（CEO）和 Cully Cavness（总裁兼 COO）共同创立，两人带来互补的技术和能源行业经验。 Chase Lochmiller 拥有 MIT
              数学和物理学位，以及 Stanford 计算机科学硕士学位，方向为 AI。创立 Crusoe 前， 他曾任量化交易员，并在加密货币投资公司 Polychain Capital
              担任普通合伙人，因此深入接触过计算金融，以及孕育 Crusoe 原始概念的区块链 / 能源交叉地带。

              Cully Cavness 拥有 Middlebury College 地质学学位和 Oxford MBA，并有油气投行背景。他对能源行业和上游油气经济性的实操理解， 影响了 Crusoe 最初的 Digital
              Flare Mitigation 业务和监管推进策略，包括直接与 North Dakota 州议会合作， 推动为部署火炬气减排系统的公司通过税收优惠立法。

              领导团队已显著扩张。关键任命包括 Nadav Eiron 出任云工程 SVP、Erwan Menard 出任 Crusoe Cloud 产品 SVP， 以及 Nader Pakfar
              出任总法律顾问（房地产），后者于 2026 年 1 月获任。战略顾问包括 Bill Stein（Digital Realty 前 CEO）、 Peter Gross 和 Matt Field。鉴于
              Lochmiller 和 Cavness 同时承担联合创始人与运营角色，公司关键人集中度高； 继任或离任风险具有实质性。
