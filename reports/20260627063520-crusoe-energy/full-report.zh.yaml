      - number: '4.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 毛利率与单位经济完全不透明
            body: >
              Crusoe 没有披露任何时期的毛利率、EBITDA、现金余额、烧钱速度或 NRR。公司正从商品化挖矿（利润率结构性偏薄且波动）转向 AI
              云（利润率可能更高，但取决于合约组合），投资者无法验证收入增长是否转化为单位经济改善。这是最重大的单一尽调缺口，也是高置信度承销 Crusoe $10B 估值的首要障碍。
