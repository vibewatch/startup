      - number: '5.5'
        title: 信任、合规、可靠性与已知缺口
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 于 2023 年 12 月获得 SOC 2 Type I 鉴证，并在 2024 年 7 月完成 SOC 2 Type II；完整报告可通过 Crusoe Trust Center
              获取。平台符合 GDPR，99.98% 集群正常运行时间 SLA 由 AutoClusters 自动节点替换支撑。截至 2026 年 6 月的状态页历史显示，整体正常运行时间较强，但有明显例外：ICAT 区域在
              2026 年 6 月 17 日出现两小时负载均衡器故障。SemiAnalysis 的 ClusterMAX 评测指出 Slurm-on-Kubernetes 产品存在实质易用性缺口——login pods 缺少
              vim、nano、git 和 sudo；CMK 集群没有默认 ReadWriteMany StorageClass；容器化负载下可复现 NVML 驱动不匹配错误。Crusoe 的 Iceland
              设施中，20,000 个光纤端面因碎屑（归因于火山灰）需要物理清洁，碎屑导致大范围链路抖动和随机文件系统卸载——这是带有地理特征的可靠性风险，据报道 Crusoe 已解决。SemiAnalysis
              指出，由于云部门工程人员流动率高，Crusoe 的 Gold 评级存在风险。CCPA 合规状态尚未公开确认。公开记录中没有 MemoryAlloy 相对 AWS Inferentia、Azure AI 或 GCP
              TPU 的外部性能基准。Crusoe 任何设施的 power usage effectiveness（PUE）都未披露。
