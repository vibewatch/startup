      - number: '4.3'
        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >
              在 AI 基础设施领域的私营公司里，Crusoe 搭起了一套异常庞大且分层的资本结构。股权融资横跨六轮，总额约 $3.4B；最近两轮是 Series D（估值 $2.8B，融资 $600M；SEC Form D
              于 2024 年 11 月 21 日提交，精确金额 $817,744,542，70 名投资者）和 Series E（估值 $10B+，融资 $1.375B；SEC Form D 于 2025 年 10 月 23
              日提交，精确金额 $1,374,999,988，71 名投资者）。Series D 投资者包括 Founders Fund、NVIDIA、Fidelity、Mubadala、Ribbit Capital 和
              Valor。Series E 由 Valor Equity Partners 与 Mubadala Capital 共同领投。

              股权之外，Crusoe 还为 Abilene 数据中心建设拿到 Blue Owl Capital 的 $3.4B 合资安排；JPMorgan 正为同一园区安排约 $9.6B 项目融资。仅 Abilene
              园区，已承诺资本总额就超过 $15B。资本结构反映了 AI hyperscale 数据中心开发的底层经济学：每建设 1 GW 面向 AI 优化的容量，在安装第一架 GPU 机柜之前，就需要约 $10–15M/MW
              投入土建、电力基础设施和冷却系统。

              近端运营的资本充足性看起来较强：$1.375B Series E 股权加项目融资跑道，应能覆盖 Abilene Phase 1。Michael Gordon 于 2025 年 12 月出任 COO/CFO（前
              MongoDB CFO，曾在 MongoDB 收入约增长 50x 时主导 2017 年
              IPO），表明公司在主动为潜在资本市场动作做准备。关键风险包括项目融资契约敞口、资本开支集中在单一园区（Abilene），以及执行层面对 JPMorgan
              信贷额度提款节奏的依赖。公司没有公开披露现金余额或月度烧钱速度。

              资本充足性高度依赖 Microsoft 900 MW 与 Oracle Stargate 15 年合约收入流，用以支撑项目融资契约。任何一家 hyperscaler
              锚定客户修改承诺，项目融资结构都会在大规模层面面临再融资风险。
