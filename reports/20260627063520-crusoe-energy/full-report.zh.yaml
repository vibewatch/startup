            title: ESG 身份与资本准入
            body: >
              Crusoe 以 climate-tech 公司自居，吸引了 Lowercarbon、G2 Venture Partners 等可持续相关资本。但公司现在计划在 Abilene 消耗天然气，规模达 360
              MW（占 1.2 GW 容量的 30%）；Chevron/Engine No. 1 天然气机队的碳捕集技术也尚未确认设计伙伴，却要在 2027 年交付。一旦可持续相关投资者把 Crusoe 重新归类为传统 AI
              基础设施，公司隐含融资成本会上升，climate-tech 身份带来的估值溢价也会被侵蚀。
