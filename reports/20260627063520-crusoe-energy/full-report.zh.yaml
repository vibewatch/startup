      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              主要需求催化剂，是 AI 模型从批处理训练转向持续的智能体 AI 推理。到 2025 年末，推理负载消耗的 GPU 总计算量已超过训练负载， 反映出 AI 智能体正在企业软件、编码助手和消费应用中铺开。智能体
              AI 系统每个任务需要的推理计算量，比单轮模型高出数个数量级， 形成持久的指数级需求。NVIDIA CEO Jensen Huang 在 2026 财年 Q4 财报中指出，「useful AI agents
              have just begun to roll out」， 并且规模化后「token hungry」。

              企业 AI 采用在 2025–2026 年到达结构性拐点，从受控试点进入关键生产负载。neocloud 相对超大规模云厂商的成本套利， 提供了可量化驱动：领先 neocloud（Lambda
              Labs、CoreWeave）的按需 H100 GPU 价格为每 GPU 小时 $2.49 至 $4.25， AWS 为每 GPU 小时 $6.88，Azure 为 $12.29。下一代 B200 GPU
              的差距更大：AWS 约每 GPU 小时 $14.24， Lambda Labs 为 $4.99 至 $5.29。2–6x 成本差异可量化，并有 2026 年 Q1 公开定价数据记录。

              电力可得性已成为决定竞争定位的最关键驱动因素，2025–2026 年实际上取代 GPU 硬件可得性，成为首要约束。 2023–2024 年锁定电力容量的运营商，相较面对 4–10
              年并网队列的新进入者，拥有结构性多年优势。 NVIDIA 以 2025 年 Q3（2025 年 10 月）$57 billion 收入验证需求基本面，同比增长 62%；Amazon 的 $34.2
              billion、 Microsoft 的 $35 billion 和 Alphabet 的 $24 billion 2025 年 Q3 资本开支也形成印证——这些支出主要投向 AI 基础设施。 国家层面的主权
              AI 政策要求也在扩大总可服务市场，在美国市场之外创造新的需求口袋。
