      - number: '2.3'
        title: 买方分层
        blocks:
          - type: paragraph
            body: >
              AI 云买方格局分成五条赛道，每条赛道都有不同的预算归属、采购动态和 SLA 预期。超大规模锚定租户——Oracle、Microsoft、 Amazon 和 Google——是价值最高的账户，与 neocloud
              签署数十亿美元容量承诺，往往提前多年预留容量。 CoreWeave 截至 2026 年中期 $66 billion 至 $99.4 billion 的合同积压，主要由 Microsoft 和 Meta
              锚定合同驱动， 体现了这种动态。Crusoe 的 Oracle-Abilene 交易也符合这一模式：一份长期租约用超大规模级别的交易对手信用， 锚定 AI 工厂业务。

              AI 基础模型实验室和前沿 AI 公司（OpenAI、Anthropic、xAI、Mistral）构成第二层：这些公司的全部价值主张都高度依赖计算。 这些买方每年在训练和推理 GPU
              计算上消耗数亿美元到数十亿美元，通常采用预留集群安排。Abilene 的 xAI 擦肩而过， 以及 Crusoe 通过 Oracle Stargate 交易间接接入 OpenAI 需求，说明 Crusoe
              靠近这一层。

              AI 原生创业公司是量大但单客花费较小的买方：每客户每月 $5,000 至 $500,000，中型生产团队平均每月 $50,000 至 $500,000。 这一板块推动 Crusoe Cloud 利用率和按需
              GPU 产品收入。采用 GenAI 做业务应用的企业 IT 买方，是正在出现且战略重要的群体： 2025–2026 年 GenAI 从试点走向生产后，企业需要合规认证（SOC
              2、HIPAA、FedRAMP），目前这有利于超大规模云厂商。 Crusoe 的 ISO 27001 和 ISO 42001 认证是迈向企业就绪的步骤，但 SLA 历史仍令人担忧。

              主权 AI 项目——由国家政府建设本土 AI 基础设施并要求数据驻留——是快速出现的买方板块。Nebius 按 GDPR 条款从 Microsoft 和 Meta 获得 $46 billion
              欧洲容量承诺，说明了规模。Crusoe 于 2026 年 3 月推出的 Edge Zones 产品，正是瞄准这一用例： 用模块化、工厂制造集群服务主权部署和低延迟部署。
