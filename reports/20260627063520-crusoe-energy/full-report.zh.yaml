      - number: '7.4'
        title: 客户集中、伙伴依赖与竞争风险
        blocks:
          - type: paragraph
            body: >
              Crusoe 的需求集中度是领先风险指标。Abilene Stargate 园区是其旗舰收入项目，但 Oracle/OpenAI 已退出后续阶段，随后由 Microsoft 承接该容量。Wyoming 1.8
              GW Project Jade 因单一客户要求暂停，客户身份和原因都未披露。第二项重大安排据称是 Meta 与 Crusoe 签署 1.6 GW
              容量协议；这有利于多元化，但也强化了超大单一客户风险事件的模式。相比之下，云服务侧，Crusoe Cloud 具名客户包括 Cursor、Decart、Fireworks、Odyssey 和 Together
              AI——这些企业规模较小，单体集中度风险较低，尽管其合计 ARR 未披露。竞争侧，CoreWeave 2025 年 3 月以 $23 billion 市值（企业价值约 $30 billion）IPO，2024
              年收入 $1.9 billion（同比增长 730%），树立了清晰基准：Crusoe 按收入倍数相对 CoreWeave 折价交易，但缺少同等程度的公开可比性。AWS、Google Cloud 和 Azure
              仍在提高 AI GPU 容量，资产负债表也深得多。Lambda Labs 和其他 neo-cloud 仍是有价格竞争力的替代选择。伙伴依赖方面，Crusoe 与 Tallgrass 围绕 Wyoming
              电力供应的合作已实质暂停；Blue Owl Capital 为 Abilene 园区设立的 $3.4 billion 合资公司带来项目融资相互依赖；NVIDIA 的持股既带来供应链对齐，也在 NVIDIA
              开发竞争性云服务时带来潜在利益冲突。
