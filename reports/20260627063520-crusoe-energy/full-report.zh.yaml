      - number: '8.2'
        title: 融资背景与当前估值标记
        blocks:
          - type: paragraph
            body: >
              Crusoe 已累计募得约 $3.9 billion 股权和结构化融资。最近一轮定价股权融资是 2025 年 10 月的 Series E：融资 $1.375 billion，投后估值超过 $10
              billion，Valor Equity Partners 和 Mubadala Investment Company 等担任领投方。在此之前，2024 年 12 月完成 Series D：融资 $600
              million，投后估值 $2.8 billion，由 Founders Fund 领投，NVIDIA 等参投。十二个月内估值从 $2.8B 升至
              $10B+（3.6x），与同期达成的执行里程碑一致：Abilene 上线、4.9 GW 已签约、Meta 1.6 GW 容量协议宣布。

              债务侧，Crusoe 从 Brookfield Asset Management 获得 $500 million 信贷额度，用于电力基础设施开发；又与 Blue Owl Capital 达成 $450
              million 合资安排，用于 Abilene 园区二期。Reuters 2025 年 6 月报道称 NVIDIA 参与了一轮 $750 million 融资，这很可能指 Series D、Series E
              分批融资加结构化债务的组合，而非单独定价轮。计入债务后的总资本估计约 $5.5 billion。

              收入轨迹是估值的基本锚。Sacra Research 估计 FY2024 收入约 $276 million，意味着 $10B 企业价值 / 收入倍数约为 36x trailing，显著高于 CoreWeave
              IPO 时约 12x 的倍数。不过 Crusoe 的增长曲线正在大幅加速：Sacra 预计 FY2025 收入约 $998 million，若按 forward revenue 计算，EV / revenue
              将降至约 10x——大体与 CoreWeave IPO 时一致。只有在已签约 4.9 GW 按期转化为收入、且 xAI / Meta 关系贯穿 2025
              年时，这一前瞻倍数才可实现。本章始终把已观察事实与模型预测明确区分；凡第三方估计的收入或估值数字，均按估计标注。
