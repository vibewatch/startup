  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入来源
        blocks:
          - type: paragraph
            body: >
              Crusoe 的收入模式经历了有意的结构性转型。2024 年，公司总收入为 $276M，其中约 45% 来自 AI 云（$124M，同比增长 460%）， 55% 来自 Bitcoin
              和数字火炬挖矿（$152M）。2025 年 3 月，公司把挖矿业务——425+ 模块化数据中心、250+ MW、 以及约 135 名员工——出售给 NYDIG 后，转向纯 AI
              云和数据中心基础设施收入模式。Crusoe 披露 2025 年云 ARR 增长 150%， total contract value（TCV）增长 17x，但未公布绝对分母或基础 ARR 数字。分析师对 2025
              全年收入的估计介于 $500M 与 $1B 之间， 但这些是未经确认的估算，而不是公司披露数据。

              今天 Crusoe 的收入有三套不同机制。第一，Crusoe Cloud 通过按需小时计费（H100 SXM 为 $4.29/GPU-hour）和预留容量订阅提供 GPU 计算。
              第二，长期超大规模容量协议——尤其是 900 MW Microsoft Abilene 承诺（2026 年 3 月）以及 Oracle/Stargate 锚定关系—— 带来大额合同收入块，具备多年可见度和
              take-or-pay 经济性。第三，Crusoe Spark 模块化 AI 工厂产品创造潜在产品销售和托管服务收入线； Redwood Materials 合作从 4 个 Spark 单元扩展到 24
              个，显示初步商业牵引力，但收入规模未披露。

              NYDIG 交易后，收入质量实质改善：AI 云收入是经常性、订阅型收入，而旧 Bitcoin 挖矿收入本质上是商品挖矿， 受减半周期和算力竞争影响。不过，Microsoft 和 Oracle
              的超大规模客户集中度很高，带来客户依赖风险， 即便有标价溢价，也限制了现实定价权。Crusoe Cloud spot / 预留 GPU 租赁与超大规模容量租约之间的收入组合未公开披露， 因此无法精确评估收入质量。

              Redwood Materials 合作（从 4 个 Spark 单元扩展到 24 个）以及类似 Spark 部署合作结构说明，模块化 AI 工厂收入线可能变得重要；
              但经济模型——产品销售、租赁还是托管服务——仍是公司主张，尚未获得独立验证。
