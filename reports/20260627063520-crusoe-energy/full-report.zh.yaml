  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 六阶段旅程从 GPU 需求发现延伸到长期锚定租户，映射 Crusoe Cloud 关系各阶段的买方动作、摩擦点和价值增益。
    data:
      items:
        - label: 认知与发现
          who: AI startup founder or ML engineering lead
          actions:
            - Discovers Crusoe Cloud via Windsurf case study or NVIDIA NCP directory
            - Compares published GPU pricing to AWS p4d and Azure NDv4 instances
            - Reviews ClusterMAX Gold rating and SOC 2 Type II disclosure
          pain:
            - Hyperscaler GPU reservation scarcity and opaque pricing
            - Uncertainty about whether a new cloud provider can meet SLA requirements
          gains:
            - Transparent per-GPU pricing without reservation deposits
            - NVIDIA Cloud Partner certification as supply-reliability signal
        - label: 试用与技术评估
          who: ML engineer or infrastructure platform team
          actions:
            - Provisions a test GPU VM via crusoe.ai/cloud in under 90 seconds
            - Runs synthetic benchmark comparing throughput to prior hyperscaler baseline
            - Tests cluster networking latency and InfiniBand interconnect at small scale
          pain:
            - Slurm-on-Kubernetes login pods lack standard developer tooling out of the box
            - No default ReadWriteMany StorageClass for distributed training storage
            - NVML driver mismatches surface in containerized workloads per ClusterMAX review
          gains:
            - Sub-90-second VM provisioning versus minutes on major clouds
            - H100 at $3.90/hr reduces compute budget versus hyperscaler list price
        - label: 初始合同承诺
          who: Engineering lead or procurement manager
          actions:
            - Signs annual GPU reservation contract through direct Crusoe sales channel
            - Configures dedicated VPC and organizational networking
            - Negotiates SLA addendum for dedicated cluster guarantees
          pain:
            - Annual commitment creates lock-in before full workload migration is validated
            - RBAC and SSO not fully mature at initial contract date
            - FedRAMP absence limits access for regulated-industry buyers
          gains:
            - Crusoe support team response under 6 minutes average
            - 99.98% cluster uptime guarantee embedded in contract
            - SOC 2 Type II certification satisfies most enterprise security review requirements
        - label: 生产工作负载迁移
          who: ML platform team and DevOps
          actions:
            - Migrates full LLM training and inference workloads from prior cloud provider
            - Onboards additional GPU SKUs as workload types diversify
            - Integrates Crusoe infrastructure into CI/CD pipeline and monitoring stack
          pain:
            - Iceland fiber contamination incident exposed physical reliability risk in 2025
            - ICAT load-balancer outage in June 2026 impacted customers for approximately two hours
            - Multi-node training shows 8–15% overhead versus single-node in benchmarks
          gains:
            - Windsurf-class outcome achievable — 50% cost reduction versus prior cloud provider
            - Sub-200ms real-time inference demonstrated by Decart AI on Crusoe H100 clusters
        - label: 扩展到相邻产品
          who: VP Engineering or CTO
          actions:
            - Adds Managed Inference API tier for API-first inference consumption
            - Evaluates Crusoe Spark for distributed edge compute use case
            - Explores multi-region strategy spanning US and European Crusoe facilities
          pain:
            - Managed Inference is new (April 2026 launch) and lacks long production track record
            - CCPA compliance status unconfirmed; HIPAA readiness not certified
            - Total customer count and competitive displacement data not publicly available
          gains:
            - MemoryAlloy inference delivers 9.9x faster TTFT than vLLM on Llama 3.3 70B
            - European regions available for data-residency requirements
        - label: 长期锚定租户
          who: CFO or COO at hyperscale company
          actions:
            - Signs 10-to-20-year power purchase agreement for campus colocation capacity
            - Commits to phased expansion from 200MW to 900MW+ as Phase 1 delivers
            - Co-announces at industry events to signal AI infrastructure leadership
          pain:
            - Wyoming-style withdrawal risk if hyperscale demand forecast changes during construction
            - No independent NRR or contract-renewal data to validate campus stickiness
          gains:
            - Deterministic multi-gigawatt delivery timelines backed by in-house construction team
            - Energy-first siting provides power cost and carbon-intensity advantages
    claimRefs:
      - CU023
      - CU027
      - CU029
      - CU030
    approximationNotes: 旅程阶段由 Crusoe 营销材料、案例研究和 ClusterMAX 评测体验定性综合而成。不同买方的具体时点和痛点 / 收益幅度会有差异。
