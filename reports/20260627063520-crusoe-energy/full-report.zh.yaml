  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >
              Crusoe 从伴生气起家，如今已成为北美扩张最快的 AI 基础设施开发商之一。规模上来后，风险画像也发生质变：公司主要暴露不再是波动的油田准入和甲烷信用，而是能源许可的政治经济、小部分 hyperscale
              客户带来的需求集中，以及一条由 CEO
              本人形容为可能超过承诺方实际交付能力的管线能否落地。本章按残余严重性从高到低排序七类重大风险，用证据逐一检验，并以可监控的终止标准收尾。风险集群包括：（1）电力建设执行与电网监管风险；（2）客户集中度与
              hyperscale 依赖；（3）GPU 供应链与供应商集中；（4）甲烷和环境监管不确定性；（5）声誉与 ESG 矛盾；（6）IP 与法律遗留；（7）竞争替代。每类风险都有传导机制，会影响 Crusoe
              的收入、利润率和融资准入，投资者必须监控。
