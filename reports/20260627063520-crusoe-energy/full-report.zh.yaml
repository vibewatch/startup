      - number: '4.2'
        title: 单位经济与定价
        blocks:
          - type: paragraph
            body: >
              Crusoe 公开披露的价格只是标价；每 GPU-hour 的实际收入、预留容量的折扣结构、GPU 利用率都没有披露。H100 SXM 标价为 $4.29/GPU-hour，使 Crusoe 处在
              neocloud 现货供给的高价端。CPU 算力标价为 $0.04/vCPU-hour。GB200 NVL72 价格未披露。Crusoe 的托管推理产品 MemoryAlloy 采用按量付费模式，按每 100 万
              tokens 计费，缓存 tokens 费率更低；绝对 token 价格未公布。

              单位经济所处的市场环境很逆风：H100 现货价从 2023 年约 $8/hour 跌到 2024 年底 $2–3/hour，背后是供给回归正常、集群竞争加剧。价格被压缩后，Crusoe
              不能只靠现货定价取胜，必须靠基础设施效率、产品差异化和粘性企业合约竞争。Crusoe 的 PUE 为 1.2–1.3（行业平均约 1.8），意味着电力开销比典型数据中心低约 30–40%。按估算的混合电价
              $0.03–0.06/kWh、H100 TDP 约 700W 计算，每台 H100 每小时电力成本约 $0.02–0.04，只占 $4.29 标价的一小部分。真正主导成本的是 GPU 资本折旧：H100 单价约
              $25,000–30,000，按 3–5 年折旧、80% 利用率计算，每 GPU-hour 资本摊销约 $0.60–1.20；在标价下，毛利仍有相当空间。

              同业参照下，neocloud 公司披露的毛利率多在 20–40%；Crusoe 在能源和冷却上的效率优势，说明其云业务有机会处在区间高端，但公司没有公开披露任何毛利率数字。实际毛利还会受两个因素影响：Crusoe
              作为非 hyperscaler 买家采购 GPU 时支付的成本溢价（NVIDIA 折扣结构未披露），以及 Abilene 园区建设爬坡期的成本。

              Crusoe 报告 2024 年收入为 $276M，2025 年估计区间为 $600M–$1B。按 Crusoe $10B+ 的 Series E 估值计算，隐含收入倍数为 10x–17x（基于 2025
              年估计收入 $600M–$1B），与高端 neocloud 倍数相符，但高度依赖尚未验证的 2025 年收入基数。
