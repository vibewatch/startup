      - number: '1.5'
        title: 产品组合与运营
        blocks:
          - type: paragraph
            body: >
              Crusoe 运营三个产品层。第一层是实体 AI 工厂基础设施：公司获取土地，设计并建设吉瓦级数据中心园区， 向锚定租户（Oracle，以及潜在其他超大规模云厂商）提供长期租赁安排。Abilene 园区规划
              1.2 GW； Wyoming 的 1.8 GW 园区处于规划阶段；加拿大 Alberta 和挪威 Polar 站点也在开发中。第二层是 Crusoe Cloud， 一个多区域 AI
              云平台，覆盖四个区域（us-northcentral1-a、us-east1-a、us-southcentral1-a、eu-iceland1-a）。 Crusoe Cloud 提供 GPU 实例、Managed
              Kubernetes，以及由自有 MemoryAlloy™ 技术驱动的 Crusoe Managed Inference Service—— 这一集群级 KV
              缓存织构相较标准推理引擎，time-to-first-token 最高快 9.9x。第三层是 Crusoe Intelligence Foundry 和 Edge Zones：Crusoe Edge Zones
              于 2026 年 3 月推出，是模块化、工厂制造的集群，可用于主权 AI、低延迟推理和企业专用部署。

              截至 Series D 公告，公司在美国 9 个州和 3 个国家运营，客户数在此前 12 个月增长超过 7x。知名云客户包括 Decart （四天内扩展 5x、服务 200
              万用户）、Codeium/Windsurf（700,000+ 开发者、99.98% 集群正常运行时间）等。 Crusoe 也已剥离加密挖矿业务，完成向 AI 基础设施的全面转型。公司在 ESG 披露中称，DFM
              技术已避免超过 680,000 公吨 GHG 排放。分析师把能源优先策略——提前多年锁定搁浅气、风能、地热和可再生能源站点——描述为 neocloud 市场的核心护城河。
