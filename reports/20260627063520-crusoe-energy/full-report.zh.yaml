      - number: '7.3'
        title: 运营、技术与供应链风险
        blocks:
          - type: paragraph
            body: >
              Crusoe 的运营风险集中在三条线：GPU 可得性、建设执行和电力供应可靠性。GPU 供给方面，公司在 2025 年 6 月承诺投入 $400 million 采购 AMD MI355X 加速器（约
              13,000 台），以降低纯 NVIDIA 依赖；但 AMD 的 ROCm 软件栈仍不如 CUDA 成熟，给推理客户带来运行时风险。NVIDIA 持续参股（Series D 和 E
              投资者）带来供应链对齐，但也意味着 NVIDIA 的战略优先级会塑造 Crusoe 的硬件路线图。到 2025 年中，美国半导体关税平均为 18.2%，直接推高 GPU 采购成本并压缩利润率。建设执行方面，CEO
              自己公开表示「这个领域有很多承诺，我无法担保它们真的会发生」，说明 45 GW+ 管线带有相当大的投机性悬空。Wyoming 1.8 GW 园区因客户要求暂停，以及 Oracle/OpenAI 退出
              Abilene 后续阶段，是该风险正在显化的早期证据。公司被迫寻找替代租户（Microsoft 接手 Abilene），增加了时间表和收入确认的不确定性。Crusoe Cloud 实现 99.98%
              正常运行时间，并持有 ISO 27001 + ISO 42001 认证（2026 年 2 月），缓解了云平台运营风险。不过，依赖天然气备份运行的 GW 级绿地数据中心，会引入纯云玩家没有的能源供应单点故障。
