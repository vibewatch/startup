  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方格局：初创公司、企业与 Hyperscale 租户
        blocks:
          - type: paragraph
            body: >-
              Crusoe 服务两个结构上不同的客户群：交易规模、采购机制和风险画像都不一样。云层通过按需 GPU 算力或年度预留，服务 AI-native 初创公司和企业机器学习团队；它提供自助定价、90 秒内 VM
              开通，以及 SOC 2 Type II 合规姿态。数据中心园区层通过十年级别的购电协议和定制建设方案，服务 hyperscale
              运营商。这两个分群不是同一产品的大小版本；它们需要不同销售动作，带来不同流失动态，也让 Crusoe 暴露在根本不同的集中度风险下。

              云业务中，主导买方画像是拥有 10–200 名工程师的 AI 初创公司，需要高密度 GPU 访问，但不想承受 AWS、Azure 或 GCP 的预留摩擦。Crusoe
              对这一客群的竞争定位有三根支柱：公开透明定价（H100 $3.90/hr、H200 $4.29/hr、AMD MI300X $3.45/hr）、认证 NVIDIA Cloud Partner 身份带来的 GPU
              供给可靠性信号，以及能打动 ESG 取向投资者和被投公司的可持续叙事。企业 AI 客群——包括 Databricks、Sony 和 Together AI——通过直销使用 Crusoe Cloud，在标准
              IaaS 目录之上叠加定制 SLA 和专用集群选项。Managed Inference 于 2026 年 4 月推出，打开了新的 API-first 消费层，把可服务市场扩展到无法承诺预留集群合约的
              token-economy 买家。

              数据中心园区业务本质上是地产和电力经纪：Crusoe 找场址，从电网或替代来源锁定电力容量，建设园区设施，再把托管容量租给需要在压缩周期内获得确定性多 GW 交付的
              hyperscaler。Oracle、Microsoft 和 Meta 代表这一层级中已披露或报道的三大关系。第四个未具名客户（广泛报道称为 Google）在开发中途退出 Wyoming
              园区项目，暴露出从管线到合约之间的转化风险。xAI 是混合客户——既把 Crusoe 当作基础设施建设伙伴，也把它当作 Grok 训练和推理的 GPU 云提供商。

              云业务渠道以直接自助服务为主，并由 NVIDIA NCP 伙伴渠道补充。园区渠道完全是直销企业销售和定制谈判。没有转售商或市场平台
              分发层来分散管线风险。地理集中度以美国为主（Texas、Wyoming、Nevada、California），欧洲容量位于 Iceland 和 Norway，用于满足数据驻留需求。
            claimRefs: []
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 具名客户证据：云与园区均有生产级胜利
        blocks:
          - type: paragraph
            body: >-
              Crusoe Cloud 记录最完整的客户胜利是 Windsurf（前 Codeium），这是一家服务超过 800,000 名开发者的 AI 编码助手平台。根据 Crusoe 发布的案例研究，Windsurf
              将全部 GPU 推理负载迁移到 Crusoe Cloud，相比 AWS 和 Azure 基础设施成本下降 50%，并在 12 个月生产周期中维持 99.98% 集群正常运行时间。Windsurf
              的迁移覆盖训练和推理负载；2026 年 4 月 Managed Inference API 推出后，Windsurf 又扩展采用了该产品。这一引用构成 Crusoe
              最强的公开证据：客户被点名，结果被量化，生产时长被说明，且来自官方案例研究文件。

              Decart AI 和 BosonAI 是另外两个具名云客户。Decart 在 Crusoe Cloud H100 集群上为人类模拟应用运行实时 LLM 推理，并提到低于 200ms 的响应延迟。BosonAI
              使用 Crusoe Cloud 做多语言 LLM 预训练，理由是成本效益。两者都出现在 Crusoe 营销材料中，并由 Cheddarflow 分析佐证。其他具名云客户包括
              Wonderful.ai、Yutori、Oaklet、Sony、Databricks、Together AI、Luma AI 和 Codeium（现 Windsurf），覆盖训练与推理。

              Hyperscale 园区层面，Oracle 和 OpenAI 是 Texas Abilene 1.2GW 园区 Phase 1 的锚定租户，该园区于 2026 年 5 月上线。Oracle CEO Safra
              Catz 公开称 Crusoe 从破土到投运的 12 个月周期是「无可匹敌的执行力」。Microsoft 是剩余 900MW Phase 2 的锚定租户，截至 2026 年 6 月仍在建设。Data Center
              Dynamics 报道称，Meta 已签署一份 1.6GW 协议，横跨 Texas Childress 和 Missouri Warrenton，但双方均未正式确认。多家媒体将 xAI 的 Colossus 2
              扩展与 Crusoe 基础设施联系起来，使 Crusoe 成为 Grok 模型训练的建设和 GPU 云伙伴。

              SemiAnalysis ClusterMAX Gold 评级从网络、硬件质量、企业支持响应等八个评分维度提供第三方产品验证。ClusterMAX 评测者指出，首次支持响应低于 6 分钟，GPU
              可用性高于平均水平——这与 Windsurf 报告的 99.98% 正常运行时间一致。同一评测也指出 Slurm-on-Kubernetes 产品存在重大运营缺口（缺少开发者工具、没有默认 storage
              class），让这份原本强劲的背书多了一层保留。
