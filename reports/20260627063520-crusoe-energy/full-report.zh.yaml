        title: 市场规模：多镜头分析
        blocks:
          - type: paragraph
            body: >
              AI 基础设施市场的分析师预测，会随定义范围大幅变化；因此任何 SAM/SOM 推演都必须用多镜头三角校验。 最宽口径下，S&P Global Market Intelligence 估计 2025 年 AI
              基础设施支出为 $337 billion， 到 2030 年以 28% CAGR 增至 $1.2 trillion。IDC 预测 2026 年全球 AI 基础设施支出达到 $487 billion， 较 2025
              年增长 53%。ARK Investment Management 给出更高增长预期：从 2025 年 $500 billion 增至 2030 年约 $1.5
              trillion。这些宽口径估算同时涵盖超大规模云厂商和专业厂商的硬件、软件与服务； Crusoe 的直接暴露只占其中一部分。

              收窄镜头后，Gartner 预测 AI-optimized infrastructure-as-a-service（AI-optimized IaaS）——最接近 neocloud 和 Crusoe Cloud
              板块的代理指标——2025 年为 $18.3 billion，2026 年同比增长 105% 至 $37.5 billion。 这是 Crusoe 云业务最相关的单一 TAM 对比指标。S&P Global 还把
              AI-as-a-Cloud-Service（ACaaS） 识别为增长最快的 AI 基础设施子板块，2025 年 $20 billion，并以 48% CAGR 增至 2030 年 $145 billion。

              具体到 neocloud 板块，Synergy Research Group 估计 2025 年收入约 $23 billion；Forrester 对 2026 年的预测为 $20
              billion（尽管两者范围可能不同）。SRG 认为该板块到 2030 年将达到 $180 billion；IndexBox 预测到 2031 年以 46% CAGR 达到 $236
              billion。多项预测显著分歧，反映出口径不一致（有的包括超大规模云厂商专用 GPU 服务， 有的排除），这种分歧本身是尽调缺口，而不是模型错误。

              对 Crusoe 的 serviceable addressable market 来说，超大规模数据中心开发业务（AI 工厂）和 GPU 云（Crusoe Cloud） 必须分别测算。仅 Abilene
              园区全阶段建设和基础设施投资就超过 $10 billion，通过长期租约锚定 AI 工厂收入。 Crusoe 的云 SAM 更紧地落在 Gartner AI-optimized IaaS
              区间内。实际收入数据未公开披露。
