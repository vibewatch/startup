              ReadWriteMany StorageClass，缺少 RBAC 和 SSO 支持，容器中还可复现 NVML 驱动不匹配。这些缺口在云层带来客户流失风险，尤其是那些会把 Crusoe 与
              CoreWeave、Lambda 对比的成熟企业 AI 团队。
