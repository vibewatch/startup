  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Crusoe 的投资论点建立在三根结构性支柱上。第一，AI 基础设施需求长期激增：hyperscaler 和 AI 实验室面临算力容量短缺，而靠近电网电力、拥有专用 GPU
              集群的独立云服务商最适合填补缺口。第二，Crusoe 的电力—算力一体化模式构成差异化——公司把发电（Abilene 的天然气涡轮、规划中的可再生能源、储能合作）与 GPU
              集群放在一起，边际电力成本更低，部署速度也快于传统 colo-to-cloud 迁移。第三，公司锁定了 Microsoft、Meta、xAI 等一线 hyperscaler 锚定关系，并引入 NVIDIA
              这一战略股权伙伴，需求侧风险降低，供应链准入也更稳。三根支柱合在一起，支撑了 Series E 的 $10B+ 估值。

              反论点同样尖锐。客户集中风险很重：xAI 和 Meta 可能占已承诺容量的大部分。Oracle 和 OpenAI 退出 Abilene 后续阶段说明，即使是大客户，改计划的速度也可能快过 Crusoe
              重新部署资本的速度。CEO Chase Lochmiller 公开承认，很多管线可能不会落地。2026 年 6 月，Cheyenne Wyoming 1.8 GW Project Jade
              应一名未具名客户要求暂停——这是集中风险实时显化的直接证据。此外，天然气涡轮扩建（Abilene 360 MW）制造了 ESG 身份矛盾；若可持续相关 LP
              退出头寸，或新增贷款条件收紧，融资成本可能上升。债务栈（估计约 $975M）已约等于 FY2025 预计收入的 100%，限制自由现金流，也削弱公司抵御收入不及预期的韧性。

              建议立场有条件地偏建设性：对早期以 Series D $2.8B 进入的投资者可维持；以 $10B+ 进入的新资本，必须严格尽调合同条款、管线约束性承诺和毛利率确认。相对 CoreWeave IPO
              倍数的估值溢价，只有在 2025 年收入假设与 2026 年合约爬坡被证明准确时才站得住。
