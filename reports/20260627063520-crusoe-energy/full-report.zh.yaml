        - 没有绝对基数，150% YoY 增长无法解读；$1 增至 $2.50，与 $200M 增至 $500M 完全不是一回事
        - 索取 2024 年绝对云 ARR 和 2025 年估算云 ARR；与 2024 年总收入 $276M 对账
