      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              Crusoe 的融资历史体现了从气候科技种子期到大型 AI 基础设施投资的演进。公司 2018 年 12 月完成约 $30 million Series A 轮， 由 Founders Fund——Peter
              Thiel 的风投机构——领投；此后每一轮 Founders Fund 都继续担任主要投资方。 2021 年 5 月，公司在扩张 DFM 业务时又完成约 $50 million Series B 轮，投资方包括
              Bain Capital Ventures 等。

              真正改变公司轨迹的是 2024 年 12 月的一轮融资：2024 年 12 月 12 日，公司以 $2.8 billion 估值完成 $600 million Series D 轮。 Founders Fund
              再次领投，NVIDIA、Fidelity、Long Journey Ventures、Mubadala（阿布扎比主权财富基金）、 Ribbit Capital 和 Valor Equity Partners
              参投。Blue Owl Capital 参与股权轮，并另行帮助从 JPMorgan 安排 $2.3 billion 项目融资，用于 Abilene 园区一期。Peter Thiel 在公告中的评论——「The
              biggest risk with AI is that we don't go big enough. Crusoe is here to liberate us from the island of
              limited ambition」——凸显了战略意义。

              2025 年 10 月，Crusoe 完成超额认购的 $1.375 billion Series E 轮，估值超过 $10 billion，由 Valor Equity Partners 和 Mubadala
              Capital 共同领投，20 多家投资方参与，包括 NVIDIA、Fidelity、Founders Fund、T. Rowe Price、 Tiger Global Management、Altimeter
              Capital、Franklin Templeton、Salesforce Ventures、Lowercarbon Capital 和 Spark Capital。约 13 轮债务和股权融资合计融资约 $3.9
              billion。公司未公开员工数和私营收入数据； 虽然 CEO Lochmiller 曾表示公司最终会上市，但尚未公开承诺 IPO 时间表。
