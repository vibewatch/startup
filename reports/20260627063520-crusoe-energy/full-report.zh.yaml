      - number: '8.4'
        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >
              牛情景假设 Abilene 到 2026 年中完全爬坡至 1.2 GW，Project Jade（Wyoming）恢复并在 2026 年下半年交付初始容量，xAI 和 Meta 维持多年容量承诺，Crusoe
              Spark 模块化部署加速来自较小企业客户的收入。在这些假设下，FY2026 收入可达 $1.5–2.0 billion；按 10–13x forward multiple 计算，隐含企业价值为 $15–25
              billion。Series D 投资者（以 $2.8B 进入）可实现 5.4–8.9x MOIC；Series E 投资者（以 $10B 进入）可实现
              1.5–2.5x。该情景要求不再发生重大客户集中事件、ESG 重新定位成功，且 Texas 电网政策继续有利。

              基准情景假设 Project Jade 恢复施工但延迟 12 个月，Abilene 的 Oracle 和 OpenAI 容量由 Microsoft 及新企业客户替代但利用率下降，Crusoe Spark 额外增加
              200–300 MW。FY2026 收入约 $900M 至 $1.2B，按 8–12x EV/revenue 计算，意味着企业价值 $7–14B。Series D 投资者实现 2.5–5x MOIC；Series
              E 投资者在 2–3 年持有期内获得温和的 0.7–1.4x 回报。

              熊情景假设至少还有两个其他园区出现 Wyoming 式暂停，xAI 或 Meta 因自建转向或竞争替代方案而将已签约承诺削减 30–50%，毛利率因电力成本上升（天然气涡轮 + SB6 限电成本）压缩至 40%
              以下，且 2028 年前没有 IPO 窗口。若 FY2026 收入为 $400–600M、EV/revenue 为 6–8x，隐含企业价值为 $2.4– 4.8 billion——低于 Series E
              投后估值，Series E 投资者 MOIC 为 0.24–0.48x，Series D 为 0.86–1.71x。

              截至 2026 年 6 月，基于可得证据，三种情景的概率权重为：牛 25%、基准 50%、熊 25%。概率加权企业价值约为 $9.6–13.5B。该区间略高于当前 $10B+ 标记，说明 Series E
              估值大体有效，但对后进入者的下行保护有限。
