        - 重新评估 CEO 管线说法；要求独立建设进度审计
      - - GPU 供应链
        - AMD MI355X 交付晚于 Q4 2025 上线承诺，或 NVIDIA 关税升级 >25%
        - 任一事件发生
        - 量化资本开支通胀；核验算力容量延迟对客户 SLA 的影响
      - - ESG / 监管矛盾
        - 新气候披露规则、诉讼，或 ESG 投资者因天然气数据中心退出
        - 至少一只主要可持续挂钩债券或 ESG 基金因环境原因退出
        - 重估可持续挂钩资本获取能力，以及气候科技品牌是否站得住
      - - 财务 / 流动性
        - Series E + Brookfield 额度提款超过 80%，但签约收入不足以偿债
        - 未提款承诺口径下债务服务覆盖率 <1.2x
        - 论点破裂——要求立即披露实际利用率与预测利用率
      - - 法律 / IP
        - 新专利侵权诉讼主张 Upstream Data 剩余 13 项创始人专利
        - USPTO 申请或 EDTX 诉状引用 Barbour 剩余 13 项专利中的任何一项
        - 评估 2025 年 11 月和解的许可范围；取得专利律师意见
    notes: 阈值为示例，依据类似基础设施项目基准设定；实际触发值需要公司特定财务披露。
