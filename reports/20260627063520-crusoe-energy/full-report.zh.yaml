      - number: '3.3'
        title: 超大规模云厂商与云替代格局
        blocks:
          - type: paragraph
            body: >
              超大规模云厂商层——AWS、Azure、GCP 和 Oracle OCI——是 GPU 云市场的既有防守方，也是企业买方的默认采购路径。 AWS P5 实例提供 8×H100 SXM 配置和 3,200 Gbps
              EFA 网络，用于分布式训练；P5 也通过 AWS SageMaker HyperPod 提供托管 ML 集群部署。Azure Machine Learning 计算集群支持由 H100 支撑的 NDv5 GPU
              VM，用于大规模分布式训练。 Google Cloud 提供 H100 和 A100 GPU 实例，并配套承诺使用折扣计划。Oracle OCI SuperCluster 在单个裸金属集群中提供 400 个
              H100 GPU 和 RDMA 网络。

              超大规模云厂商的竞争优势是集成：已经在 AWS、Azure 或 GCP 上运行负载的企业，可受益于存储共置、IAM、网络、托管服务和合规框架； 独立 neocloud
              如果不进行大额投资，无法复制这些能力。这种集成护城河是 Crusoe 赢下企业替代交易必须跨过的首要障碍。

              不过，超大规模云厂商受 GPU 供给容量约束：Crusoe 的 Microsoft Abilene 900 MW 交易和 Oracle Stargate 关系之所以存在，
              正是因为超大规模云厂商无法足够快地建设基础设施来履行自身承诺。这一供给缺口是 Crusoe 的主要收入机会。 Crusoe
              向超大规模云厂商提供容量，而不只是与它们争夺终端用户。这种「既竞争又做容量伙伴」的双重角色， 在 neocloud 板块并不常见，并创造出差异化位置。

              Oracle OCI 的 SuperCluster 产品尤其相关，因为 Oracle 是 Crusoe 的 Stargate 锚定客户之一；Crusoe 在与 Oracle 和 Microsoft 的 15
              年容量协议下建设并运营 Abilene Phase 1 园区。这意味着 Crusoe 一边与 Oracle OCI 竞争企业 GPU 买方， 一边向 Oracle 供应原始容量。

              现状内部建设仍是重要竞争力量。大型 AI 实验室（Meta、xAI）和资源充足的企业，正在本地或托管设施建设自有 GPU 集群， 绕开超大规模云厂商和 neocloud。Bain Capital Ventures
              关于 Crusoe 创立论点的文章，明确把「在电源处托管」模式识别为对抗传统数据中心建设的楔子。
