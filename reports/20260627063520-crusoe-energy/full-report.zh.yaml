      - number: '7.7'
        title: 展示材料
        blocks:
          - type: callout
            title: Wyoming 园区暂停是金丝雀
            body: >
              Crusoe「应客户要求」暂停 1.8 GW Wyoming Project Jade，却没有披露客户、原因或时间表；这是 Crusoe 2026 年公开披露中最重要的风险信号。结合 Oracle/OpenAI
              退出 Abilene 后续阶段，可以确认 hyperscale 锚定租户会把大体量 AI 基础设施承诺视为临时性承诺。在投资者能独立验证签约利用率和客户 照付不议条款之前，所有已宣布管线数字都存在重大高估风险。
