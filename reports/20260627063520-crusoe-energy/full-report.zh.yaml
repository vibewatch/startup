  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Crusoe Energy 位于三个不同但重叠的市场交叉点。第一是 neocloud GPU 云：专为 GPU 加速而建的 IaaS， 可按需、通过预留实例或长期合同提供，主要面向 AI 训练和推理负载。第二是
              AI 工厂开发：获取绿地、建设并长期租赁吉瓦级数据中心园区， 服务超大规模锚定租户。第三个越来越具战略意义的市场，是面向计算的能源采购和发电：捕获搁浅气、可再生能源和替代电源， 支撑 AI
              数据中心；这个市场正从成本项快速演化为数千亿美元级战略投资类别。

              AI 计算基础设施市场边界包括 GPU 加速 IaaS、裸金属 HPC、AI 工厂托管，以及托管 GPU 云服务。 不包括通用云（广义 CPU-only IaaS）、AI 软件和应用层（SaaS、MLOps
              工具）以及实体 ASIC 设计。 相邻市场包括面向计算的能源基础设施（天然气、核能、数据中心太阳能）和 CPU-only 托管，后者是小型或非 GPU AI 负载的现状替代方案。 关键替代品还包括超大规模云厂商
              spot 实例、大学裸金属 HPC 和本地 GPU 集群；相较专用 neocloud 方案， 这些替代品在成本、可用性或可扩展性上都有明显限制。

              GPU-as-a-Service（GPUaaS）是一个独立且快速增长的子板块。Fortune Business Insights 数据显示， 该市场 2023 年为 $3.23 billion，预计复合年增长率
              36%，反映出从购买 GPU 转向租用 GPU 访问权的变化。 Synergy Research Group 称，广义 neocloud 类别——包括 CoreWeave、Lambda
              Labs、Nebius、Crusoe 和更小同行—— 2025 年收入约 $23 billion。
