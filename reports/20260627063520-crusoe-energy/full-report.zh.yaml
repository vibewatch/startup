    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Crusoe Energy Systems（以 Crusoe 名义运营）是一家垂直整合的 AI 基础设施公司，总部位于科罗拉多州丹佛。 公司成立于 2018
              年，起初把模块化数据中心部署到油气井口，捕获本会被燃烧浪费的天然气——这一自有方法注册为 Digital Flare Mitigation®（DFM）。DFM 把搁浅井口气转成电力，为现场计算供能；燃烧效率最高达
              99.89%， 标准火炬约为 93%，相较继续放空燃烧可减少约 63% 的 CO2 当量排放。每个 DFM 部署每年估计可消除 8,000 吨 CO2 当量。

              早期 Crusoe 把捕获的能源用于 Bitcoin 和加密货币挖矿；但 2023 年 GPU 计算需求激增后，业务根本转向 AI 云基础设施。 公司借入 $200 million 购买 NVIDIA H100
              GPU，并开始提供 Crusoe Cloud 这一高性能 AI 与机器学习平台。 到 2024 年 12 月 Series D 轮时，Crusoe 已把自己定义为「行业首个垂直整合 AI 基础设施提供商」，
              组合自有能源策略（搁浅气、可再生能源）、面向 AI 优化的数据中心建设和全栈云平台。公司当前使命是 「accelerate the abundance of energy and intelligence」。

              Crusoe 的收入主要来自长期数据中心租赁（由与超大规模客户签订的多年合同锚定）以及 Crusoe Cloud 订阅和用量费用。 德州 Abilene 的 1.2 GW 园区由长期 Oracle
              租约锚定，支撑近期收入可见度。Denver 和 Tulsa 的制造设施生产服务器机架， 在受控环境中完成 GPU 安装后，再用卡车运往数据中心现场。
