      - number: '6.3'
        title: 采用轨迹：ARR 增长、合约扩张与收入爬坡
        blocks:
          - type: paragraph
            body: >-
              2024 到 2025 年，Crusoe Cloud 的 ARR 同比增长 150%，同期平均合约价值扩大 17×——这组组合同时指向数量扩张和交易规模成熟。合约价值增长 17×，反映出业务从小型初创公司的月度
              GPU 预留，转向企业级年度集群承诺；一笔企业交易贡献的 ARR 可能超过数十个初创客户合约。2025 年新客户同比增长 70%，说明顶线 ARR 增长不只是来自现有客户扩张，也有相当的新客户成分。

              Sacra Research 预计 Crusoe 2026 年总收入约 $2 billion，而 2024 年为 $276 million。这一 7× 复合增长几乎完全由数据中心园区板块驱动——具体是
              Abilene 园区 Phase 1 和 Phase 2 租户协议。Cheddarflow 分析估计，截至 2026 年初，云平台独立 ARR 在 $150–200 million
              区间。这条轨迹值得注意，但必须放入语境：Crusoe 总收入仍包括遗留 Digital Flare Mitigation（DFM）能源收入和园区建设费用，经常性云 ARR 占比重要但仍是少数。

              Managed Inference 于 2026 年 4 月推出，打开了 token-economy 客户层：这类 API-first 买家需要推理容量，但不承诺预留 GPU 集群。该层服务的是此前由
              hyperscaler 推理 API（AWS Bedrock、Azure OpenAI）和推理专门初创公司覆盖的市场。若基准在生产负载多样性下仍成立，MemoryAlloy 的 9.9× TTFT
              优势会成为打动该客群的性能钩子。整体增长图景——云 ARR 增长 150%、合约价值 17×、新客户增长
              70%——对基础设施业务来说很强，也反映真实市场需求。关键尽调问题是，这条轨迹是否可持续，还是由两三个不可重复的 hyperscale 承诺前置拉动。
