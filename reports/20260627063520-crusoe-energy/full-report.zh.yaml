  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Crusoe 所在的 GPU 云市场至少跨越四个结构性层级，每一层都带来不同竞争挑战。第一层是纯 neocloud GPU 云运营商—— CoreWeave、Lambda Labs、Nebius AI 和
              Vast.ai——它们是 Crusoe 在开发者、AI 实验室和企业 GPU 容量买方面前最直接的收入竞争对手。 CoreWeave 于 2025 年 3 月在 NASDAQ 上市，是这些运营商中按估算
              ARR（2025 年初约 $5B）最大的玩家， 并拥有 NVIDIA 优先 GPU 分配地位，因此成为 neocloud 定价和可靠性的评价标尺。

              第二层是超大规模云厂商——AWS、Microsoft Azure、Google Cloud 和 Oracle OCI——它们是全球 GPU 计算最大总供应方。 AWS P5 实例在 96-GPU、EFA
              联网集群中部署 H100；Azure NDv5 VM 为分布式训练提供 H100；Google Cloud 提供 A100/H100 按需实例和承诺使用折扣； Oracle SuperCluster
              在单个裸金属集群中捆绑 400 个 H100 GPU。超大规模云厂商正在重金投入 AI 基础设施 （仅 Microsoft 就为 2025 年承诺 $80B+），也是企业采购团队的「安全默认」选择。

              第三层是与能源论点相邻的运营商，例如 Lancium 在 Texas 运营可再生能源供电的 HPC 基础设施，与 Crusoe 最初的市场定位重叠。 Lancium 的清洁园区已获 ERCOT
              批准，可接入吉瓦级电网电力，但 Lancium 不提供通用 GPU 云产品。

              第四层是现状方案：本地 HPC 集群、传统数据中心（Digital Realty、Equinix）托管，以及大型企业内部建设项目。 这一层最重要，因为它代表今天企业 GPU 支出的大部分，也是 Crusoe
              必须替代的基准。Crusoe 的 BYO Power 方法和 Spark 模块化工厂， 通过提供更快、更高功率密度的替代方案，直接切入本地 / 托管层。

              反向背景：GPU H100 spot 市场价格从 2023 年约 $8/hour 降至 2024 年末 neocloud 提供商的 $2–3/hour，
              压缩了最初吸引企业买方离开超大规模云厂商的套利机会。Crusoe 曾发生有记录的连接中断，影响 us-east1-a 区域计算实例， 暴露出可靠性风险，CoreWeave
              和超大规模云厂商会在竞争对话中强调这一点。
