      - number: '3.2'
        title: 直接 neocloud 同行画像
        blocks:
          - type: paragraph
            body: >
              CoreWeave 是最强大的直接竞争对手。CoreWeave 成立于 2017 年，总部位于 New Jersey 州 Roseland，拥有 NVIDIA 优先合作伙伴地位， 可优先分配 H100、H200
              和 Blackwell（B200/GB200）GPU。CoreWeave 2025 年 3 月 NASDAQ IPO 为 neocloud 板块建立了公开市场可比估值， 约为 5x
              revenue；其客户群偏向前沿 AI 实验室和企业 AI 平台公司，与 Crusoe 顶级买方群体直接重叠。 相较 Crusoe，CoreWeave
              的关键结构性限制在于它不拥有发电，也不自建园区级数据中心；它依赖第三方托管和电力合同， 因而在 AI 基础设施市场收紧时，更暴露于电力可得性约束。

              Lambda Labs（San Francisco，2012 年成立）面向开发者和研究型 GPU 云板块，提供按需 H100 SXM5 和 A100 实例、 快速开通、无最低消费，以及开发者友好工具。Lambda
              不垂直整合电力或数据中心建设。它的 go-to-market 偏自助服务和规模定价， 因此在较小负载上有竞争力，但对超大规模承诺或专用园区合同的相关性有限。

              Nebius AI（Amsterdam；NYSE: NBIS）于 2024 年 6 月从 Yandex 拆分，提供 GPU 云基础设施，目标是需要数据主权的 AI 公司， 尤其在欧盟市场。Nebius 2024
              年 9 月从包括 NVIDIA 在内的投资方处融资 $700M。Nebius 称其推理 TCO 相比 AWS 好 112%。 它对 Crusoe
              的主要竞争相关性在欧盟市场；美国重叠有限。作为上市公司，Nebius 提供了一些 Crusoe 等私营 neocloud 缺乏的财务透明度。

              Vast.ai 运营 spot GPU 市场模式，让买方以 spot 价格访问独立提供商的分布式 GPU 容量；它更像聚合器，而不是基础设施运营商。 Vast.ai 可按需扩展到 20,000 个
              GPU，因此可作为突发负载的可行替代品，但不适合专用预留容量合同。

              neocloud 板块正承受整合压力：wetheflywheel 2026 neocloud 指南指出，只靠 GPU 租赁价格差异化的提供商正在被挤压， 长期成功取决于向软件和编排层上移。
