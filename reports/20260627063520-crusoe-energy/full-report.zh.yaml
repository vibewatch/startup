              MemoryAlloy 的全集群 KV cache，是 Crusoe 在软件层最清晰的产品差异化。Llama 3.3 70B 上相对 vLLM 的 9.9× TTFT 基准，对实时 AI 应用是显著差距；向
              NVIDIA Dynamo 贡献开源 tokenizer，也让专有引擎之外增加了社区可信度。若能获得独立基准验证，这可能在 inference-as-a-service 领域变成持久护城河。
