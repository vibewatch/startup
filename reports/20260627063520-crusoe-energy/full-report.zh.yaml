            Materials 二次寿命 EV 电池微电网（Tahoe 站点 63 MWh，GWh 级管线）； Form Energy 12 GWh 铁空气（2027 年）；Energy Vault 多日储能。
    approximationNotes: 层级顺序按运营依赖自下而上排列。各层产品成熟度不一（Spark 工厂单元目标 2026 年 Q3；Vera/Rubin 部署在 2027 年）。能源结构因站点而异。
