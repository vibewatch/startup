      - number: '7.2'
        title: 监管、环境与 ESG 风险
        blocks:
          - type: paragraph
            body: >
              Crusoe 的法律与监管风险是多层的。甲烷侧，尽管 Crusoe 已在 2025 年剥离 Digital Flare Mitigation 业务，最初定义其身份的监管环境仍在变化。EPA 2023/2024
              OOOOb/OOOOc 规则禁止 2026 年 5 月 7 日之后新油气井常规放空燃烧；与此同时，Trump
              政府提出放松监管回滚，并停止执行现有规则——任何竞争定位依赖放空燃烧经济继续存在、以此降低成本的公司，都会面对政策急转风险。BLM Waste Prevention Rule 对部分放空燃烧计量和 LDAR
              条款的执行在 2025 年 11 月再次延后至 2026 年 12 月；2026 年 6 月发布的拟议修订还会回滚废弃最小化计划要求。五个州（North
              Dakota、Texas、Montana、Wyoming、Utah）已处在阻止 BLM 执法的初步禁令下。对 Crusoe 而言，今天最大的监管敞口在电力交付监管：Texas Senate Bill 6 由
              Governor Abbott 于 2025 年 6 月签署并立即生效，要求 ≥75 MW 数据中心在强制削减负荷事件中接受限电，强制 2025 年 12 月 31
              日之后的新接入具备远程断开能力，并把互联升级成本转嫁给大负载客户。ERCOT 预计到 2030 年电网上大负载达到 138 GW，而 2025 年中为 87 GW——维护季的可靠性风险重大。ESG
              侧，Heatmap News 记录 Crusoe 计划在 Abilene Stargate 园区部署 360 MW 场内天然气涡轮（占已宣布 1.2 GW 容量的 30%），并通过与 Engine No. 1 和
              Chevron 的合资公司获得 4.5 GW 新增天然气容量——这些动作与公司气候科技自我定位并不协调。EDF 报告称，Trump EPA 停止执行甲烷监管后的第一年，约 $4.2 billion
              天然气被浪费，凸显 Crusoe 原始模式所处监管环境的争议性。
