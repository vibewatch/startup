      - number: '8.5'
        title: 建议、信心与确信度框架
        blocks:
          - type: paragraph
            body: >
              立场：有条件 INVEST，且需完成重大尽调前置项。信心：中。风险评级：高。该建议适用于按 $10B+ Series E 标记进入的新资本。更早以 $2.8B Series D
              标记进入的投资者已有较强账面上调，应谨慎建模退出时点。

              确信度框架有三道门。Gate 1（客户合同）：投资者必须拿到前三大客户合同的脱敏版本，确认最低 take-or-pay 金额、取消通知期和罚则。Oracle/OpenAI 在短通知下退出 Abilene
              后续阶段——尽管据称由 Microsoft 替代——凸显非正式承诺的执行风险很高。Gate 2（毛利率）：投资者必须按客户、按园区确认毛利率轨迹超过 45%。Crusoe 的天然气涡轮和 SB6
              限电敞口带来电力成本不确定性，尚未反映在收入顶线预测中。Gate 3（施工控制）：投资者必须拿到至少两个非 Abilene 园区的详细项目管理计划，显示与施工进度里程碑和罚则挂钩的约束性客户承诺，以避免
              Cheyenne 暂停重演。

              Kill trigger 指无论当前估值标记如何，都会把建议转为 PASS 的事件：（1）xAI 或 Meta 作为客户流失，且代表超过 30% 已签约容量；（2）十二个月内出现第二次 Wyoming
              式、由客户驱动的暂停；（3）Brookfield 信贷额度触发债务契约违约；（4）发现 DFM 剥离让 Crusoe 留下重大的甲烷合规赔偿责任。

              从退出准备度看，Crusoe 尚未具备 IPO 条件，但若收入超过 $1B 且 EBITDA 利润率扩大，2026–2027 年正向 IPO 资格靠近。来自
              hyperscaler（Microsoft、Meta、Google）的战略并购是可行的替代退出路径，CoreWeave 的客户关系提供了先例。截至本文写作时，二级交易定价尚未获得独立确认。
