              本章将 2025 年 10 月 $10B+ 投后估值视为新投资者当前一级市场进入标记。该假设不考虑会导致有效进入价格下调的重大清算优先权、参与型优先股条款或反稀释条款。若 Series E
              存在显著优先权负担（例如 2x 清算优先权），普通股等价持有人的有效进入价格会更低，下行保护改善，但较低退出价值下的上行也会减少。尽调必须确认股权结构表和优先权条款。
