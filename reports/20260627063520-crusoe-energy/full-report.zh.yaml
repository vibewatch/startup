      - number: '8.3'
        title: 可比估值与同业组
        blocks:
          - type: paragraph
            body: >
              最相关的上市可比公司是 CoreWeave。CoreWeave 于 2025 年 3 月 26 日完成 IPO，企业价值 $23 billion。其向 SEC 提交的 S-1 披露，FY2024 收入为
              $1.92 billion（同比增长 737%），已承诺收入积压为 $8.7 billion。IPO 隐含约 12x trailing revenue 和 4–5x forward revenue。随后
              CoreWeave 市值在二级市场交易中一度低于 IPO 水平，反映市场对 AI 基础设施倍数及高度客户集中（申报时 Microsoft 约占收入 60%）的不确定。

              私有可比公司更不透明。Lambda Labs 是一家竞争性的推理优化云服务商，分析师覆盖中称其二级交易价格约为 4–7x ARR。Scale AI 是相邻 AI 基础设施公司，聚焦数据标注和模型评估，2025
              年初私募估值约 ~$14B，ARR 约 $1B——大约 14x ARR——但商业模式差异很大。Anthropic 是拥有重要基础设施的一线模型公司，据报道 ARR 约 ~$3B，估值约
              ~$18–25B，但其垂直一体化和护城河属性使其不可比。

              本分析中，Crusoe 的核心同业组是 infrastructure-as-a-service GPU 云公司。代表性样本包括 CoreWeave（上市）、Lambda Labs（私有）、Voltage
              Park（私有、规模较小）和 Nebius（原 Yandex
              Cloud，阿姆斯特丹上市）。下表列示该可比组。所有私有公司数字均为公开来源中的分析师估计，可能不同于未披露的实际财务；投资者应把这些数字视为方向性参考，而非精确值。
