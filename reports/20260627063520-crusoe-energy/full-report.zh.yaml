      - number: '5.4'
        title: NVIDIA 合作深度与开发者生态
        blocks:
          - type: paragraph
            body: >-
              Crusoe 最深的护城河，是纵向整合后的 NVIDIA 对齐。在 GTC 2026，Crusoe 宣布将成为 NVIDIA Vera CPU 的早期采用者；Vera CPU 专为 agentic AI
              后训练环境打造，单机架支持超过 22,500 个并发 CPU 沙盒环境。Crusoe 同时计划在 2026 年底和整个 2027 年部署 NVIDIA Rubin GPU 与 Vera Rubin NLV72
              系统。Crusoe 还在采用 NVIDIA Omniverse DSX Blueprint 和 Vera Rubin DSX Reference Design 来设计下一代 GW 级 AI
              工厂，用数字孪生做设施可视化，并用 AI 优化电力和冷却。这让 Crusoe 更像全栈、NVIDIA-native 的基础设施伙伴，而不只是 GPU 容量转售商。开发者侧，Crusoe 维护公开 GitHub
              组织（github.com/crusoecloud），仓库包括 Terraform provider、CLI、Go client library、Slurm 配置、Helm charts、solutions
              library，以及 fastokens Rust BPE tokenizer repo（截至 2026 年 6 月仍有活跃提交）。开发者中心托管六个在线 AI demo，覆盖 CMK 上的多节点 Llama
              预训练、Slurm 上的 PyTorch 分布式训练，以及用 vLLM 和 KubeRay 做 Ray 推理。Crusoe 没有运营一个可用社区采用指标（stars、contributors、fork
