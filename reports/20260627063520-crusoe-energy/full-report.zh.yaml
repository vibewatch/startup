      - number: '1.4'
        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >
              Crusoe 的轨迹分成三个清晰阶段：（1）火炬气加密挖矿阶段（2018–2022），（2）转型与 AI 云建设阶段（2023–2024）， （3）超大规模数据中心开发阶段（2024 年至今）。2020 年初
              COVID-19 封锁导致石油需求崩塌，公司遭遇近乎生死存亡的威胁， 被迫转向邻近可再生能源的站点。正是这次被动多元化，让公司最终站上 AI 转型的位置。

              关键战略节点出现在 2024 年第一季度，Crusoe 赢得德州 Abilene 的 Stargate AI 数据中心园区开发合同。 据报道，Elon Musk 的 xAI
              是该场地第一个潜在客户，但后来退出，转而在 Memphis 独立建设「Colossus」巨型集群。 随后 Oracle 签署长期租约，该设施设计为通过 Microsoft Azure 向 OpenAI 提供
              100,000+ NVIDIA GPU。 1.2 GW Abilene 园区一期于 2025 年 9 月上线，是有记录以来速度最快的绿地超大规模数据中心建设之一。 2025 年 3 月初一次 45
              小时中断引发客户投诉和行业质疑；随后 2026 年 5 月 us-east1-a 区域的网络事件说明， 运营可靠性仍是需要盯住的主要声誉风险。

              2026 年的产品里程碑包括 Crusoe Edge Zones 上线（2026 年 3 月）、Crusoe Command Center 统一运营平台上线 （2026 年 2 月），以及获得 ISO 27001
              / ISO 42001 认证（2026 年 2 月）。2026 年 3 月 NVIDIA GTC 上， Crusoe 宣布深化合作，范围包括成为 NVIDIA Vera CPU 和 Rubin GPU
              早期采用方，支持 NVIDIA Omniverse DSX Blueprint， 以及向 NVIDIA Dynamo 开源框架贡献自有 Rust BPE tokenizer。
