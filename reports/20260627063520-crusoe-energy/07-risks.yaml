  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: contracted-pipeline-binding-terms
      missingEvidence: "Number and identity of campuses with binding take-or-pay hyperscale contracts vs. letters of intent or soft commitments"
      whyItMatters: "Without this, the 45 GW pipeline figure cannot be used as a revenue proxy; the Wyoming pause indicates at least some commitments are non-binding"
      diligencePath: "Request deal-by-deal pipeline status with customer identity, contract type (LOI/binding/take-or-pay), and committed capacity"
      relatedQuestionRefs: [QR014, QR027]

    - type: private-evidence-only
      severity: blocking
      topic: debt-service-coverage
      missingEvidence: "Crusoe's actual debt covenants, interest rate, and minimum DSCR on $975M+ of debt facilities"
      whyItMatters: "At $276M 2024 revenue and ~$975M debt, modest revenue shortfalls could trigger covenant events"
      diligencePath: "Request debt facility terms; model DSCR under bear-case revenue assumptions"
      relatedQuestionRefs: [QR010, QR032]

    - type: missing-source
      severity: material
      topic: Wyoming-pause-customer-identity
      missingEvidence: "Identity of customer who requested Wyoming 1.8 GW project pause and commercial rationale"
      whyItMatters: "Without knowing whether this is a temporary pause or permanent cancellation, capital-allocation decisions are impaired"
      diligencePath: "Request customer identity from management; review press reports for any Cheyenne, Wyoming AI-infrastructure announcements in Q2-Q3 2026"
      relatedQuestionRefs: [QR004]

    - type: private-evidence-only
      severity: material
      topic: DFM-divestiture-scope
      missingEvidence: "Buyer identity, transaction terms, and any retained obligations or indemnities from DFM divestiture"
      whyItMatters: "If DFM buyer defaults or obligations revert, EPA/BLM compliance exposure could return to Crusoe"
      diligencePath: "Review M&A press release (if any) or request divestiture SPA summary"
      relatedQuestionRefs: [QR001, QR020]

    - type: missing-source
      severity: material
      topic: carbon-capture-plan
      missingEvidence: "Named design partner, engineering study, and cost estimate for post-combustion carbon capture at Engine No.1/Chevron gas plants"
      whyItMatters: "Plans that are 'to be determined' and need to deliver power by end-2027 carry high schedule risk; if abandoned, ESG narrative suffers"
      diligencePath: "Request engineering and permitting timeline for carbon-capture systems; identify any Carbon Capture Use and Storage project filings in Texas"
      relatedQuestionRefs: [QR009, QR016]

    - type: private-evidence-only
      severity: minor
      topic: successor-depth
      missingEvidence: "Depth of management bench below CEO/COO; succession plan documentation"
      whyItMatters: "Key-person risk at this growth velocity is material; no public disclosures of succession planning"
      diligencePath: "Org chart review; retention equity schedules; board governance documentation"
      relatedQuestionRefs: [QR030]

    - id: EGR007
      topic: "GPU-per-hour pricing differential between Crusoe and hyperscalers/CoreWeave"
      description: >
        Crusoe claims 30–81% cost advantage over hyperscalers, but independent third-party
        benchmarks comparing apples-to-apples GPU-hour pricing (H100 SXM5 at comparable SLAs)
        are not publicly available. The pricing advantage may reflect architectural differences
        (single-tenant bare metal vs virtualised clouds) rather than pure cost efficiency.
      relatedQuestionRefs: [QR011]

    - id: EGR008
      topic: "Construction and programme management controls at non-Abilene campuses"
      description: >
        Crusoe has disclosed the Wyoming pause and the Abilene live status but has not publicly
        described what programme management or customer-commitment controls prevent a repeat of
        the Cheyenne pause at future campuses under construction (Phoenix, Denver, Ohio, Georgia,
        Virginia). Detailed construction control documentation has not been located.
      relatedQuestionRefs: [QR013]

    - id: EGR009
      topic: "Community or environmental opposition groups targeting Crusoe Texas buildout"
      description: >
        No organised community opposition or environmental group litigation against Crusoe's
        Abilene data centre buildout was identified in public sources. Absence of evidence is
        not evidence of absence; local Abilene city council records and Texas Commission on
        Environmental Quality filings were not reviewed.
      relatedQuestionRefs: [QR019]

    - id: EGR010
      topic: "Crusoe competitive positioning vs Lambda Labs and neo-cloud inference providers"
      description: >
        Lambda Labs, CoreWeave, Voltage Park, and emerging inference-first providers have not
        published head-to-head benchmarks against Crusoe Cloud on inference latency, throughput,
        and per-token cost. The competitive comparison is inferential from individual pricing
        pages and limited analyst coverage.
      relatedQuestionRefs: [QR029]

    - id: EGR011
      topic: "SEC, CFTC, or voluntary carbon registry enforcement actions related to Crusoe DFM carbon credits"
      description: >
        No enforcement actions by the SEC, CFTC, EPA, or voluntary carbon registries (Gold Standard,
        Verra) against Crusoe's historical flare-gas carbon-credit claims were identified in court
        records or regulatory dockets. The DFM divestiture has shifted this exposure to the buyer,
        but the scope of representations and warranties to the buyer is undisclosed.
      relatedQuestionRefs: [QR031]

    - id: EGR012
      topic: "Completeness of the regulatory and legal risk register for Crusoe"
      description: >
        Table TR001 covers five identified material regulatory/legal risk categories but does not
        enumerate every jurisdiction (state PUC proceedings, international data protection laws,
        AI-specific regulation) or every counterparty in the vendor/IP chain. A full legal audit
        would require reviewing all material contracts, IP registrations, and regulatory
        correspondence not available in public disclosures.
      relatedQuestionRefs: [QR001, QR021]
      relatedTableRefs: [TR001]

