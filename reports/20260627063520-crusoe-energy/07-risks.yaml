callouts:
  - calloutType: risk
    title: Wyoming Campus Pause Is the Canary
    body: >
      Crusoe's pause of the 1.8 GW Wyoming Project Jade "at the request of our customer" — without disclosing the
      customer, the reason, or the timeline — is the most significant risk signal in Crusoe's 2026 public disclosures.
      Combined with Oracle/OpenAI's exit from later Abilene phases, it confirms that hyperscale anchor tenants treat
      large-format AI infrastructure commitments as provisional. Until investors can independently verify contracted
      utilisation rates and customer take-or-pay terms, all announced pipeline figures carry a material overstatement
      risk.
    claimRefs: [CR024, CR025, CR041]

  - calloutType: risk
    title: ESG Identity and Capital Access
    body: >
      Crusoe's framing as a climate-tech company has attracted sustainability-linked capital (Lowercarbon, G2 Venture
      Partners). But the company now plans to burn natural gas at 360 MW at Abilene (30% of 1.2 GW capacity), while
      carbon capture technology for the Chevron/Engine No. 1 gas fleet has no confirmed design partner and a 2027
      delivery deadline. If sustainability-linked investors re-categorise Crusoe as conventional AI infrastructure,
      the implied financing cost rises and the valuation premium associated with climate-tech status erodes.
    claimRefs: [CR013, CR014, CR015, CR038]

  - calloutType: assumption
    title: "Regulatory Assumption: DFM Divestiture Removes Methane Compliance Exposure"
    body: >
      This chapter assumes the DFM divestiture to an undisclosed buyer removes Crusoe's direct obligations under the
      EPA OOOOb/OOOOc rules and the BLM Waste Prevention Rule. If any residual obligations, indemnities, or
      representations remain attached to the sold business that could revert to Crusoe, this assumption is incorrect.
      Diligence should confirm the scope of the divestiture agreement and the identity and financial health of the buyer.
    claimRefs: [CR006, CR007]

