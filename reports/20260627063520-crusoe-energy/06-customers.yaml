company:
  name: Crusoe Energy Systems
chapter:
  number: 6
  letter: U
  title: Customers
  summary: >-
    Crusoe operates across two structurally distinct customer tiers. The cloud tier serves AI startups
    and enterprise ML teams on monthly-to-annual GPU reservations; the campus tier serves hyperscale
    operators on decade-long power purchase agreements. Windsurf's 12-month production relationship
    (50% cost savings, 800K developers, 99.98% uptime) is the highest-quality public reference.
    Additional named cloud customers include Decart AI, BosonAI, Databricks, Together AI, and Sony.
    At campus scale, Oracle and OpenAI anchor the live Abilene Phase 1, Microsoft anchors Phase 2,
    and Meta (1.6GW) and xAI (1GW+) are reported but unconfirmed. The Wyoming 1.8GW project pause —
    caused by an unnamed customer withdrawal — establishes that hyperscale pipeline conversion is not
    guaranteed. Cloud ARR grew 150% YoY in 2025 with 17× average contract value growth; Sacra projects
    $2B total revenue for 2026. Critical diligence gaps include total customer count opacity,
    undisclosed NRR/GRR, and unconfirmed Meta and xAI deal status.

sections:
  - id: customer-overview
    title: "Buyer Landscape: Startups, Enterprises, and Hyperscale Tenants"
    body: >-
      Crusoe serves two structurally distinct customer segments with different deal sizes, procurement
      mechanisms, and risk profiles. The cloud tier serves AI-native startups and enterprise machine
      learning teams via GPU compute on-demand or through annual reservations, with self-service pricing,
      sub-90-second VM provisioning, and a SOC 2 Type II compliance posture. The data-center campus tier
      serves hyperscale operators through decade-long power purchase agreements and bespoke construction
      programs. These two segments are not simply different sizes of the same product — they require
      different sales motions, carry different churn dynamics, and expose Crusoe to fundamentally different
      concentration risks.

      Within the cloud segment, the dominant buyer persona is the AI startup with 10–200 engineers that
      needs high-density GPU access without the reservation friction of AWS, Azure, or GCP. Crusoe's
      competitive positioning rests on three pillars for this cohort: published transparent pricing
      (H100 at $3.90/hr, H200 at $4.29/hr, AMD MI300X at $3.45/hr), a certified NVIDIA Cloud Partner
      stamp that signals GPU supply reliability, and a sustainability narrative that appeals to ESG-aligned
      investors and portfolio companies. The enterprise AI segment — including Databricks, Sony, and
      Together AI — accesses Crusoe Cloud through direct sales with custom SLAs and dedicated cluster
      options layered on top of the standard IaaS catalog. The launch of Managed Inference in April 2026
      opened a new API-first consumption tier that extends addressability to token-economy buyers who
      cannot commit to reserved cluster contracts.

      The data-center campus segment is a real estate and power brokerage play: Crusoe locates sites,
      secures power capacity from grid or alternative sources, constructs campus facilities, and leases
      colocation capacity to hyperscalers that need deterministic multi-gigawatt delivery with compressed
      timelines. Oracle, Microsoft, and Meta represent the three largest disclosed or reported relationships
      in this tier. A fourth unnamed customer (widely reported to be Google) withdrew from the Wyoming
      campus project mid-development, exposing the conversion risk inherent in a pipeline-to-contract gap.
      xAI represents a hybrid customer — using Crusoe as both infrastructure construction partner and
      GPU cloud provider for Grok training and inference.

      Channel for cloud is predominantly direct self-service, supplemented by the NVIDIA NCP partner
      channel. Campus channel is entirely direct enterprise sales with custom negotiations. No reseller or
      marketplace distribution layer exists that would diversify pipeline risk. Geographic concentration
      is US-primary (Texas, Wyoming, Nevada, California) with European capacity in Iceland and Norway
      serving data-residency requirements.
    tableRefs:
      - TU001
    figureRefs: []
    callouts:
      - calloutType: insight
        title: Two-Tier Architecture Creates Divergent Risk Profiles
        body: >-
          Crusoe's cloud segment has many small, diversified contracts that are individually low-risk.
          The campus tier has a handful of multi-gigawatt anchor tenants where a single withdrawal
          materially disrupts capex plans — as the Wyoming pause demonstrated. Investors must
          disaggregate these segments: cloud has diversity; campus has concentration.
        claimRefs:
          - CU031
          - CU032
          - CU037

  - id: named-customer-proof
    title: "Named Customer Proof: Production Wins Across Cloud and Campus"
    body: >-
      Crusoe Cloud's most thoroughly documented customer win is Windsurf (formerly Codeium), the
      AI-powered coding assistant platform serving over 800,000 developers. According to Crusoe's
      published case study, Windsurf migrated its full GPU inference workload to Crusoe Cloud and
      achieved a 50% reduction in infrastructure costs compared to AWS and Azure, while sustaining
      99.98% cluster uptime over a twelve-month production period. Windsurf's migration spanned both
      training and inference workloads and subsequently expanded to include Crusoe's Managed Inference
      API after that product launched in April 2026. This reference constitutes the strongest public
      evidence Crusoe has: it names the customer, quantifies the outcome, specifies the production
      duration, and comes from an official case study document.

      Decart AI and BosonAI are two additional named cloud customers. Decart runs real-time LLM
      inference for human simulation applications on Crusoe Cloud H100 clusters, citing sub-200ms
      response latency. BosonAI uses Crusoe Cloud for multilingual LLM pre-training runs, citing
      cost-effectiveness. Both are cited in Crusoe marketing materials corroborated by Cheddarflow
      analysis. Additional named cloud customers include Wonderful.ai, Yutori, Oaklet, Sony,
      Databricks, Together AI, Luma AI, and Codeium (now Windsurf) across training and inference.

      At the hyperscale campus tier, Oracle and OpenAI are the Phase 1 anchor tenants for the 1.2GW
      Abilene, Texas campus, which went live in May 2026. Oracle CEO Safra Catz publicly described
      Crusoe's twelve-month ground-break-to-operational timeline as "unmatched execution." Microsoft
      is the Phase 2 anchor tenant for the remaining 900MW, under construction as of June 2026. Meta
      has reportedly signed a 1.6GW agreement spanning Childress, Texas and Warrenton, Missouri,
      per Data Center Dynamics reporting, though neither party has officially confirmed this. xAI's
      Colossus 2 expansion is associated with Crusoe infrastructure through multiple outlets, positioning
      Crusoe as a construction and GPU-cloud partner for Grok model training.

      The SemiAnalysis ClusterMAX Gold rating provides third-party product validation across eight
      scored dimensions including networking, hardware quality, and enterprise support responsiveness.
      ClusterMAX reviewers noted sub-6-minute first support response and above-average GPU availability
      — consistent with Windsurf's reported 99.98% uptime. The same review identified material operational
      gaps in the Slurm-on-Kubernetes offering (missing developer tools, absent default storage class),
      introducing nuance into what is otherwise a strong endorsement.
    tableRefs:
      - TU003
    figureRefs:
      - FU001
    callouts:
      - calloutType: strength
        title: Windsurf as a Reference-Quality Anchor Customer
        body: >-
          Windsurf's 12-month production relationship, 50% cost-savings outcome,
          800K+ developer workload scale, and public advocacy constitutes an unusually
          strong reference. In a market where GPU cloud providers compete largely
          on price, a named reference with quantified outcomes and extended tenure
          is a durable differentiator for Crusoe's enterprise sales motion.
        claimRefs:
          - CU007
          - CU027
      - calloutType: risk
        title: Meta and xAI Deals Unconfirmed at Research Date
        body: >-
          The Meta 1.6GW deal and xAI Colossus 2 partnership are sourced from news
          reporting and have not been officially confirmed by either party as of June 2026.
          If smaller than reported or renegotiated, Crusoe's 4.9GW contracted figure
          could be materially overstated.
        claimRefs:
          - CU012
          - CU013

  - id: adoption-trajectory
    title: "Adoption Trajectory: ARR Growth, Contract Expansion, and Revenue Ramp"
    body: >-
      Crusoe Cloud's ARR grew 150% year-over-year from 2024 to 2025, while average contract value
      expanded 17× over the same period — a combination that signals both volume expansion and deal-size
      maturation. The 17× contract value growth reflects a shift from small-startup monthly GPU
      reservations to enterprise-scale annual cluster commitments; a single enterprise deal can represent
      more ARR than dozens of startup contracts. New customer growth ran at 70% year-over-year in 2025,
      indicating that top-line ARR growth is not purely from existing customer expansion but has a
      substantial new-logo component.

      Sacra Research projected Crusoe's total revenue at approximately $2 billion for 2026, compared to
      $276 million in 2024. This 7× compound growth is driven almost entirely by the data-center campus
      segment — specifically the Abilene campus Phase 1 and Phase 2 tenant agreements. The cloud
      platform's standalone ARR was estimated in the $150–200 million range as of early 2026 by
      Cheddarflow analysis. This trajectory is notable but must be contextualized: Crusoe's total
      revenue still includes legacy Digital Flare Mitigation (DFM) energy revenue and campus
      construction fees, with recurring cloud ARR representing a significant but minority share.

      The launch of Managed Inference in April 2026 opens a token-economy customer tier: API-first
      buyers who need inference capacity without committing to reserved GPU clusters. This tier
      addresses a market previously served by hyperscaler inference APIs (AWS Bedrock, Azure OpenAI)
      and inference-specialist startups. MemoryAlloy's 9.9× TTFT advantage creates a performance
      hook for this cohort, assuming benchmarks hold under production load diversity. The overall
      growth picture — 150% cloud ARR growth, 17× contract value, 70% new-logo growth — is strong
      for an infrastructure business and reflects genuine market demand. The key diligence question
      is whether this trajectory is sustainable or front-loaded by two or three hyperscale commitments
      that will not repeat.
    tableRefs:
      - TU002
    figureRefs:
      - FU002
    callouts:
      - calloutType: insight
        title: 17× Contract Value Growth Signals Enterprise Market Penetration
        body: >-
          A 17× growth in average contract value signals that Crusoe is winning enterprise-grade
          multi-cluster commitments, not just individual developer workloads. This metric is more
          significant than new-logo count for assessing whether Crusoe has crossed the credibility
          threshold for IT procurement.
        claimRefs:
          - CU018
          - CU019
      - calloutType: risk
        title: Cloud ARR Is a Minority of Total Reported Revenue
        body: >-
          Crusoe's headline revenue growth is dominated by data-center campus construction revenue,
          not recurring cloud ARR. The $276M to $2B growth trajectory captures multi-year campus
          build fees that do not recur annually. Cloud ARR of $150–200M represents the durable
          recurring base; campus revenue has a very different recurrence structure.
        claimRefs:
          - CU019
          - CU020

  - id: retention-durability
    title: "Retention and Durability: SLA Performance, CSAT, and Switching Economics"
    body: >-
      Crusoe Cloud contractually guarantees 99.98% cluster uptime and a sub-90-second VM boot time
      across its IaaS tier. The 99.98% uptime figure translates to approximately 105 minutes of
      permissible unplanned downtime per year per cluster. Windsurf's twelve-month production tenure
      without a reported SLA breach is the strongest independent validation of this guarantee. The
      SemiAnalysis ClusterMAX review noted faster-than-average support response times, and Crusoe
      reported 100% CSAT over the trailing twelve months — though all of these figures are self-reported
      and are not independently audited or confirmed by named customers outside the Windsurf case study.

      Crusoe's status page recorded a load-balancer outage in the ICAT region on June 17, 2026 that
      rendered endpoints unreachable for approximately two hours. This incident is consistent with
      the SLA headroom (one event within 99.98% tolerance) but demonstrates that Crusoe is not immune
      to the operational issues affecting all cloud providers. The Iceland facility also experienced a
      widespread fiber contamination event (volcanic ash debris affecting 20,000 fiber ends) in 2025
      requiring physical remediation. Neither event appears to have triggered published SLA credits
      or reported customer churn, consistent with the self-reported 100% CSAT figure.

      Net Revenue Retention and Gross Revenue Retention are not publicly disclosed for Crusoe Cloud.
      Cheddarflow estimated NRR in the 110–130% range for pre-2025 cohorts based on qualitative
      expansion signals. This estimate cannot be independently verified. Contract lengths differ
      significantly by tier: hyperscale data-center tenants sign 10-to-20-year power purchase
      agreements creating extremely durable revenue; cloud customers sign monthly or annual GPU
      reservations, which are more portable but benefit from modest switching costs (workload
      integration, SLA familiarity, networking configuration). The Windsurf expansion from GPU IaaS
      to Managed Inference illustrates the organic upsell pattern that drives Crusoe Cloud's estimated
      high NRR. The absence of a public NPS, independent CSAT audit, or disclosed churn rate is a
      material diligence gap for prospective enterprise buyers evaluating long-term commitments.
    tableRefs:
      - TU004
    figureRefs:
      - FU003
    callouts:
      - calloutType: risk
        title: No Independent Validation of 100% CSAT or NRR
        body: >-
          All retention-quality metrics cited by Crusoe — 100% CSAT, sub-6-minute first reply,
          99.98% uptime — are self-reported without independent audit. Prospective enterprise buyers
          should require third-party audit or at least two independent named reference calls
          before relying on these figures in procurement decisions.
        claimRefs:
          - CU025
          - CU036

  - id: procurement-deployment
    title: "Procurement Patterns, Concentration Risk, and Adverse Signals"
    body: >-
      Crusoe's hyperscale data-center procurement follows a land-and-expand pattern anchored on phased
      campus commitments. Oracle and OpenAI took Phase 1 (200MW+) at Abilene and served as the
      construction catalyst; Microsoft took Phase 2 (900MW), expanding the campus to 1.2GW total.
      This phased structure is rational from both sides: the customer hedges against construction risk
      by not committing the full phase upfront; Crusoe gets an anchor to begin construction financing
      before the full campus is subscribed. The risk is that subsequent phases require re-commitment
      from the same tenant or a replacement, and the Wyoming project pause shows that Crusoe cannot
      assume Phase 2 follows Phase 1.

      Cloud procurement follows two paths. Self-service buyers sign up via crusoe.ai/cloud and move
      to monthly or annual GPU reservation contracts after an initial trial. Enterprise buyers engage
      Crusoe's direct sales team for custom cluster configurations, dedicated private networking, and
      negotiated SLAs. Managed Inference users follow an API-key model without cluster reservations,
      making them the most portable and most churn-prone segment. Customer concentration is the most
      significant risk signal in Crusoe's customer profile. The campus tier has three confirmed or
      reported anchor tenants (Oracle, Microsoft, Meta) each at 200MW–900MW, plus xAI at 1GW+.
      If any two of these fail to convert from reported to executed contracts, Crusoe's contracted
      capacity metric would be materially reduced and campus construction financing could be at risk.

      The Wyoming project pause — where an unnamed customer requested a halt — is the clearest evidence
      that hyperscale pipeline customers can and do withdraw. Crusoe's public disclosure of customer
      metrics is sparse: no customer count, revenue breakdown, or cohort NRR is publicly available.
      Worldmetrics aggregates statistics suggesting hundreds of cloud customers but cites secondary
      sources without primary data. The Upstream Data patent litigation was resolved in 2025 via a
      licensing agreement, per Crusoe's newsroom; blockspace.media reported a "mixed ruling" where
      infringement was found but damages were contested. The core Crusoe Cloud business is software
      and infrastructure, not DFM hardware, so residual IP risk from the Upstream Data case is limited
      in scope but represents a precedent for DFM technology IP challenges if the legacy segment grows.
    tableRefs:
      - TU005
    figureRefs:
      - FU004
    callouts:
      - calloutType: risk
        title: Wyoming Pause Exposes Hyperscale Pipeline Conversion Risk
        body: >-
          The Cheyenne, Wyoming 1.8GW project was paused "at the request of our customer" —
          language indicating the customer drove the halt rather than Crusoe. This precedent shows
          megawatt-scale pipeline figures can shift materially within a quarter based on hyperscale
          customer decisions outside Crusoe's control. Pipeline-to-contract conversion is the most
          important operational risk for Crusoe's campus business.
        claimRefs:
          - CU031
          - CU032
      - calloutType: assumption
        title: Customer Count and NRR Are Analyst Estimates Only
        body: >-
          All quantitative claims about Crusoe Cloud's customer count, NRR, and GRR in this chapter
          are third-party analyst estimates (Sacra, Cheddarflow, Worldmetrics) not verified against
          Crusoe's internal data. The actual figures may differ materially. Primary data requests
          covering cloud ARR, customer count by cohort, and NRR by segment are required before
          finalizing diligence judgments on customer health.
        claimRefs:
          - CU019
          - CU025
          - CU026

