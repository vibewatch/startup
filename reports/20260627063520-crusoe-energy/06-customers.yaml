  - id: FU002
    title: Adoption / Deployment Funnel
    type: dag
    summary: >-
      Customer acquisition flow showing six stages from initial GPU demand signal through multi-product
      expansion, with connecting transitions illustrating how Crusoe converts market demand into
      production cloud customers.
    data:
      nodes:
        - label: GPU Demand Signal
          description: AI teams with GPU budget constraints seeking hyperscaler alternatives
        - label: Crusoe Discovery
          description: Reaches crusoe.ai/cloud via NVIDIA NCP directory or peer referral
        - label: Trial Activation
          description: First GPU VM provisioned within 90 seconds via self-service sign-up
        - label: Initial Contract
          description: Annual GPU reservation signed after successful evaluation
        - label: Production Deployment
          description: Continuous mission-critical inference or training on Crusoe Cloud
        - label: Multi-Product Expansion
          description: Adds Managed Inference API or second GPU type or second region
      edges:
        - from: GPU Demand Signal
          to: Crusoe Discovery
        - from: Crusoe Discovery
          to: Trial Activation
        - from: Trial Activation
          to: Initial Contract
        - from: Initial Contract
          to: Production Deployment
        - from: Production Deployment
          to: Multi-Product Expansion
    claimRefs:
      - CU001
      - CU004
      - CU016
      - CU022
    approximationNotes: >-
      Stage descriptions are derived from qualitative product and customer information; no funnel
      conversion rates are publicly disclosed by Crusoe.

  - id: FU003
    title: Customer Proof Matrix
    type: matrix
    summary: >-
      Cross-segment assessment of customer proof quality across five dimensions, highlighting
      where Crusoe has strong public evidence versus where primary data requests are required.
    data:
      columns:
        - AI Startups (Cloud)
        - Enterprise AI Teams
        - Hyperscale Tenants
        - Research / Other
      rows:
        - label: Named References Available
          values:
            - High (Windsurf, Decart, BosonAI documented)
            - Medium (Databricks, Together AI named)
            - High (Oracle, Microsoft confirmed)
            - Low (none publicly named)
        - label: Production-Grade Workload Confirmation
          values:
            - Confirmed (Windsurf 12-month production)
            - Partial (named but no production duration)
            - Confirmed (Abilene Phase 1 live May 2026)
            - Unknown
        - label: Quantified Outcome Documentation
          values:
            - Strong (50% cost savings; 99.98% uptime cited)
            - Weak (no outcome metrics publicly available)
            - Partial (capacity confirmed; revenue terms private)
            - None
        - label: Contract Concentration Risk
          values:
            - Low (many small diversified deals)
            - Low (individual deals small relative to campus)
            - Critical (1GW+ per tenant; Wyoming precedent)
            - Minimal
        - label: Expansion Velocity Signal
          values:
            - High (Windsurf added Managed Inference; 17x ACV growth)
            - Medium (no expansion data disclosed)
            - Very High (Phase 1 to Phase 2 at Abilene)
            - Unknown
