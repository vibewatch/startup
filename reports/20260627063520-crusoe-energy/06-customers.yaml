  evidenceGaps:
    - type: missing-source
      severity: critical
      topic: named cloud customer total count and enumeration
      missingEvidence: >-
        A complete or representative enumeration of Crusoe Cloud's total active customer count
        by contract tier (annual reservation, monthly, managed inference API), including customer
        count by cohort year and total ARR per cohort, is not available from any public source.
      whyItMatters: >-
        Without a disclosed customer count and cohort breakdown, it is impossible to assess customer
        concentration in the cloud tier, validate Crusoe's 70% new-customer growth claim, or determine
        whether the 150% ARR growth is driven by volume or expansion from a few large accounts.
        This is the central diligence gap for the cloud segment.
      diligencePath: >-
        Request from Crusoe a customer count by cohort year (pre-2024, 2024, 2025, 2026), ARR
        per cohort, top-10-customer revenue concentration, NRR and GRR by cohort, and a list of
        named reference customers willing to participate in diligence calls.
      relatedQuestionRefs:
        - QU023
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: meta and xai deal official confirmation
      missingEvidence: >-
        Official confirmation from Meta or Crusoe of the reported 1.6GW data-center capacity
        agreement; official confirmation from xAI or Crusoe of the reported 1GW+ Colossus 2
        infrastructure partnership. Both remain sourced from secondary news reporting only.
      whyItMatters: >-
        If the Meta 1.6GW and xAI 1GW+ deals are not executed or differ from reported figures,
        Crusoe's 4.9GW contracted figure and associated revenue projections could be overstated
        by 2GW+, representing a majority of the hyperscale pipeline.
      diligencePath: >-
        Request executed term sheets or power purchase agreement references for Meta and xAI;
        request confirmation from Crusoe of current legal status and contracted MW for each.
      relatedQuestionRefs:
        - QU024

    - type: missing-source
      severity: material
      topic: net revenue retention and gross churn disclosure
      missingEvidence: >-
        No public NRR, GRR, or customer-level churn metrics exist for Crusoe Cloud. The only
        available figure is the self-reported 100% CSAT, which is not a financial retention
        metric and lacks independent audit.
      whyItMatters: >-
        NRR and GRR are the most critical leading indicators of cloud business health. Without
        them, it is impossible to determine whether Crusoe Cloud's 150% ARR growth is sticky
        expansion-driven or churn-offset by new logos.
      diligencePath: >-
        Request cohort-level NRR, GRR, and gross churn for cloud customers by contract size band
        (monthly, annual, multi-year enterprise). Compare to industry benchmarks for GPU cloud.
      relatedQuestionRefs:
        - QU025
        - QU026

    - type: missing-source
      severity: material
      topic: hyperscale customer concentration breakdown
      missingEvidence: >-
        The contracted capacity breakdown by hyperscale tenant within Crusoe's 4.9GW figure
        is not publicly disclosed; the fraction that is signed versus LOI versus verbal commitment
        is unknown.
      whyItMatters: >-
        If top hyperscale tenants represent 70%+ of contracted capacity, a single withdrawal
        could reduce the contracted figure by over 1GW and trigger campus construction-finance
        covenant breaches.
      diligencePath: >-
        Request a capacity waterfall showing executed contracts, signed LOIs, and verbal
        commitments by tenant, phased by expected revenue start date and construction milestone.
      relatedQuestionRefs:
        - QU027

