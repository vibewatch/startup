callouts:
  - calloutType: risk
    title: Gross Margin and Unit Economics Are Completely Opaque
    body: >
      Crusoe has disclosed no gross margin, EBITDA, cash position, burn rate, or NRR for any period. As the company
      transitions from commodity mining (where margins are structurally thin and volatile) to AI cloud (where margins
      are potentially superior but depend on contract mix), investors cannot verify whether revenue growth translates
      into improving unit economics. This is the single most material diligence gap and the primary obstacle to
      underwriting Crusoe's $10B valuation with high confidence.
    claimRefs: [CI025, CI026, CI027, CI028]

  - calloutType: strength
    title: Hyperscaler Contracts Provide an Unusually Large and Visible Revenue Floor
    body: >
      The 15-year Microsoft Abilene capacity agreement (900 MW) and Oracle Stargate multi-year contract create a
      long-duration, take-or-pay revenue floor that virtually no other private neocloud can match. These agreements
      are the collateral underlying the $9.6B JPMorgan project financing and represent a structural revenue quality
      advantage relative to spot-dependent neoclouds like Lambda Labs and Vast.ai.
    claimRefs: [CI004, CI021, CI022]

  - calloutType: risk
    title: Project Finance at $9.6B Scale Creates Covenant Concentration Risk
    body: >
      With JPMorgan arranging approximately $9.6B in project financing secured by the Abilene campus assets and
      hyperscaler contracts, Crusoe is exposed to covenant compliance risk at a scale unusual for a private company.
      Any modification to Microsoft's or Oracle's commitments, or a construction delay at Abilene, could trigger
      covenant review or restrict management's operational flexibility. No covenant terms have been publicly disclosed.
    claimRefs: [CI020, CI021, CI022, CI031, CI032]

  - calloutType: assumption
    title: 2025 Revenue Is Estimated, Not Confirmed
    body: >
      Analyst estimates for 2025 full-year Crusoe revenue range from $500M to $1B, derived from applying Crusoe's
      disclosed 150% cloud ARR growth to the confirmed $124M 2024 AI cloud revenue base. These are estimates; Crusoe
      has not disclosed absolute 2025 revenue figures. All valuation and implied-multiple analyses in this chapter are
      contingent on the unverified 2025 revenue estimate.
    claimRefs: [CI001, CI002, CI033]

