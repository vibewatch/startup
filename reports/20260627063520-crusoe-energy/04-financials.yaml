  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin and EBITDA
      missingEvidence: "Crusoe's gross margin, EBITDA, and operating cash flow for any period. No public company comparable exists with identical vertical integration."
      whyItMatters: "Without gross margin, it is impossible to verify whether Crusoe's revenue growth is profitable or subsidized by the project financing stack. This is the single most material gap for underwriting the $10B valuation."
      diligencePath: "Request private financial statements as part of a formal investment process; compare to CoreWeave S-1 filings as the closest public benchmark."
      relatedQuestionRefs: [QI006]

    - type: private-evidence-only
      severity: material
      topic: GTM sales efficiency metrics (CAC, cycle, NRR)
      missingEvidence: "CAC, sales cycle length, NRR, and cohort retention data for Crusoe Cloud. These are not disclosed in SEC Form D filings or any public source."
      whyItMatters: "Without NRR and cohort data, the quality and durability of cloud ARR growth cannot be assessed; 150% growth driven by churn replacement vs net expansion are entirely different financial profiles."
      diligencePath: "Request cohort-level retention data and NRR from management; ask for customer references from AI lab and enterprise segments separately."
      relatedQuestionRefs: [QI007, QI018]

    - type: missing-source
      severity: material
      topic: revenue recognition methodology for long-term capacity agreements
      missingEvidence: "Crusoe's GAAP revenue recognition approach for multi-year hyperscaler capacity agreements (e.g., the Microsoft 900 MW deal). Is revenue recognized over the life of the contract or at delivery milestones?"
      whyItMatters: "Revenue recognition methodology affects reported revenue trajectory; back-loading recognition would suppress 2025 reported revenue vs economic value; front-loading would inflate early-year metrics."
      diligencePath: "Review accounting policy in any available financial statements; ask management or auditors directly about ASC 842/606 treatment for capacity agreements."
      relatedQuestionRefs: [QI019]

    - type: private-evidence-only
      severity: material
      topic: Crusoe Spark modular AI factory revenue contribution
      missingEvidence: "No public disclosure of revenue from Crusoe's Spark modular AI factory product line, its margin profile, or its percentage of total company revenue. Spark was first announced in 2024 and no financial breakdown is available."
      whyItMatters: "If Spark represents a high-margin product transition vs recurring cloud GPU rental, the financial trajectory and blended margin profile are materially different. This gap limits conviction on path to profitability."
      diligencePath: "Request product-line revenue and gross margin breakdown in a formal investment process; compare Spark order backlog vs cloud ARR ratio as an early proxy."
      relatedQuestionRefs: [QI026]
