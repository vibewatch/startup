company:
  name: Crusoe Energy Systems
chapter:
  number: 4
  title: Financials
  summary: >
    Crusoe generated $276M in total revenue in 2024 (AI cloud $124M at 460% YoY growth; Bitcoin/DFM mining $152M),
    sold its mining operations to NYDIG in March 2025 to pivot to pure AI cloud, and disclosed 150% cloud ARR growth
    and 17x TCV growth in 2025 without publishing the absolute base. Backed by a $1.375B Series E (October 2025,
    $10B+ valuation per SEC Form D), $3.4B Blue Owl JV, and approximately $9.6B JPMorgan project financing for the
    Abilene campus, the company's capital structure is unusually large for a private firm. Key financial underwriting
    gaps—gross margin, EBITDA, cash position, burn rate, and NRR—remain undisclosed; the financial verdict depends
    heavily on the mix between contracted hyperscaler revenue and exposure to compressing GPU spot pricing.

sections:
  - id: revenue-model
    title: Revenue Model and Streams
    body: >
      Crusoe's revenue model has undergone a deliberate structural transformation. In 2024, the company generated $276M
      in total revenue, split approximately 45% AI cloud ($124M, representing 460% year-over-year growth) and 55%
      Bitcoin and digital flare mining ($152M). Following the March 2025 sale of its mining operations—425+ modular data
      centers, 250+ MW, and approximately 135 employees—to NYDIG, Crusoe pivoted to a pure AI cloud and data center
      infrastructure revenue model. Crusoe disclosed 150% cloud ARR growth and 17x total contract value (TCV) growth in
      2025, though it has not published the absolute denominator or base ARR figures. Analyst estimates for full-year 2025
      revenue range between $500M and $1B, but these are unconfirmed estimates rather than company-disclosed figures.

      Today, Crusoe's revenue operates on three distinct mechanisms. First, Crusoe Cloud delivers GPU compute via on-demand
      hourly billing (H100 SXM at $4.29/GPU-hour) and reserved capacity subscriptions. Second, long-term hyperscaler
      capacity agreements—most notably the 900 MW Microsoft Abilene commitment (March 2026) and Oracle/Stargate anchor
      relationships—provide large, contracted revenue tranches with multi-year visibility and take-or-pay economics.
      Third, the Crusoe Spark modular AI factory product creates a potential product-sale and managed-service revenue
      line; the Redwood Materials partnership expanding from 4 to 24 Spark units demonstrates initial commercial traction
      but revenue quantum is undisclosed.

      Revenue quality has materially improved post-NYDIG: AI cloud revenue is recurring and subscription-based, while
      the old Bitcoin mining revenue was effectively commodity mining subject to halving cycles and hash-rate competition.
      However, heavy hyperscaler concentration in Microsoft and Oracle creates customer dependency risk that limits
      real-world pricing power even at list-price premium levels. The revenue mix between Crusoe Cloud spot/reserved
      GPU rental and hyperscaler capacity leases is not publicly disclosed, preventing precise revenue quality assessment.

      The Redwood Materials partnership (expanding from 4 to 24 Spark units) and a similar Spark deployment partnership
      structure suggest that the modular AI factory revenue line could become material, though the economic model—whether
      product sale, lease, or managed service—is company-claimed rather than independently verified.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]

  - id: unit-economics-pricing
    title: Unit Economics and Pricing
    body: >
      Crusoe's publicly disclosed pricing is list pricing only; realized revenue per GPU-hour, discount structures for
      reserved capacity, and GPU utilization rates are not disclosed. The H100 SXM is listed at $4.29/GPU-hour, positioning
      Crusoe at the premium end of neocloud spot offerings. CPU compute is listed at $0.04/vCPU-hour. The GB200 NVL72
      price is undisclosed. Crusoe's managed inference product (MemoryAlloy) uses a usage-based pay-as-you-go model
      billed per 1 million tokens, with cached tokens billed at a lower rate; absolute token prices are not published.

      The market context for unit economics is adversarial: H100 spot prices collapsed from approximately $8/hour in 2023
      to $2–3/hour by late 2024, driven by supply normalization and cluster competition. This compression forces Crusoe
      to compete on infrastructure efficiency, product differentiation, and enterprise sticky contracts rather than on
      spot pricing alone. Crusoe's PUE of 1.2–1.3 (versus the industry average of approximately 1.8) implies approximately
      30–40% lower power overhead than typical data centers. At an estimated blended energy cost of $0.03–0.06/kWh and
      H100 TDP of approximately 700W, power cost per H100 per hour is roughly $0.02–0.04—a small fraction of the $4.29
      list price. GPU capital depreciation is the dominant cost driver: H100 units cost approximately $25,000–30,000 each,
      and depreciated over 3–5 years at 80% utilization, the capital charge per GPU-hour is approximately $0.60–1.20,
      leaving meaningful headroom for gross margin at list prices.

      For peer comparison, neocloud companies have disclosed gross margins in the 20–40% range; Crusoe's efficiency
      advantages in energy and cooling suggest it could be at the high end of this range for its cloud segment, but no
      gross margin figure has been publicly disclosed. The actual margin is also affected by the GPU procurement cost
      premium Crusoe pays as a non-hyperscaler buyer (no disclosed NVIDIA discount structure) and by ramp costs during
      the Abilene campus build phase.

      Crusoe reported $276M in 2024 revenue with an estimated $600M–$1B range for 2025. The implied revenue multiple
      at Crusoe's $10B+ Series E valuation (10x–17x on estimated 2025 revenue of $600M–$1B) is consistent with premium
      neocloud multiples but depends heavily on the unverified 2025 revenue base.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI002, TI003]
    figureRefs: [FI002]

  - id: capital-structure
    title: Capital Structure and Adequacy
    body: >
      Crusoe has assembled an unusually large and layered capital structure for a private company in the AI infrastructure
      sector. The equity financing history spans six rounds totaling approximately $3.4B; the two most recent are the
      Series D ($600M at $2.8B valuation, SEC Form D filed November 21, 2024, exact amount $817,744,542 with 70 investors)
      and the Series E ($1.375B at $10B+ valuation, SEC Form D filed October 23, 2025, exact amount $1,374,999,988 with
      71 investors). Investors in Series D include Founders Fund, NVIDIA, Fidelity, Mubadala, Ribbit Capital, and Valor.
      Series E was co-led by Valor Equity Partners and Mubadala Capital.

      Beyond equity, Crusoe secured a $3.4B Blue Owl Capital joint venture for the Abilene data center buildout and
      JPMorgan is arranging approximately $9.6B in project financing for the same campus, bringing total committed capital
      above $15B for the Abilene campus alone. This capital structure reflects the fundamental economics of AI hyperscale
      data center development: each gigawatt of AI-optimized capacity requires approximately $10–15M/MW in civil engineering,
      power infrastructure, and cooling before a single GPU rack is installed.

      Capital adequacy for near-term operations appears robust: the $1.375B Series E equity plus project finance runway
      should cover Abilene Phase 1. Michael Gordon's appointment as COO/CFO in December 2025 (former MongoDB CFO who led
      the 2017 IPO at a time when MongoDB's revenue was growing approximately 50x) signals active preparation for potential
      capital markets activity. Key risks include project finance covenant exposure, concentration of capex in a single
      campus (Abilene), and the execution dependency on JPMorgan credit facility drawdown timing. No cash position or
      monthly burn rate has been publicly disclosed.

      The company's capital adequacy depends critically on the Microsoft 900 MW and Oracle Stargate 15-year contracted
      revenue stream to service project financing covenants. If either hyperscaler anchor modified its commitment,
      the project finance structure would face refinancing risk at scale.
    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: financial-gaps-verdict
    title: Financial Gaps, Risks, and Verdict
    body: >
      The most significant financial underwriting gaps for Crusoe are the absence of gross margin, EBITDA, cash position,
      burn rate, net revenue retention, and audited financial statements. As a private company not subject to SEC reporting
      obligations beyond Form D filings, Crusoe has no obligation to disclose these metrics. The appointment of MongoDB
      veteran Michael Gordon as COO/CFO signals improving financial governance and IPO preparation, but independent
      verification of financial performance remains unavailable.

      Four material adverse factors bear close scrutiny. First, GPU spot pricing compression—from approximately $8/hour
      to $2–3/hour for H100s—represents a structural pricing ceiling that constrains upside on on-demand cloud revenue.
      Crusoe's ability to lock customers into reserved capacity agreements at list pricing above spot is a critical value
      driver that is unverified. Second, the clean-energy financial risk: Crusoe's ESG brand may command pricing premium
      from sustainability-focused enterprises, but Heatmap News (March 2025) reported continued natural gas use including
      an Engine No. 1 joint venture for 4.5 GW of new gas capacity. If ESG-sensitive customers investigate the actual
      energy stack, attrition risk and reputational damage could compress realized pricing below list pricing.
      Third, customer concentration in Microsoft and Oracle creates revenue dependency risk: a contract modification or
      hyperscaler infrastructure insourcing decision could materially impact revenue. Fourth, the high-capex model with
      $9.6B project finance creates covenant and refinancing risk at JPMorgan's scale. No public covenant terms, LTV
      ratios, or debt service coverage requirements are available for diligence review.

      The company's 17x TCV growth in 2025 and 150% cloud ARR growth are encouraging signals, but the opacity of private
      financials—particularly gross margin trajectory as the company transitions from mining to cloud—means that revenue
      growth without margin visibility is difficult to underwrite. Crusoe's Spark manufacturing revenue stream is an
      interesting financial diversifier but is currently evidenced only by the Redwood Materials partnership expansion.
      The financial verdict is: attractive revenue growth trajectory with material concentration and margin opacity risks;
      not underwritable at the $10B valuation without private financial disclosure including gross margin, NRR, burn rate,
      and project finance covenant terms.
    claimRefs: [CI025, CI026, CI027, CI028, CI029, CI030, CI031, CI032, CI033]
    tableRefs: [TI005]
    figureRefs: [FI003]

