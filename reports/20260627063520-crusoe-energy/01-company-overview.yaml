  name: Crusoe Energy Systems

chapter:
  number: 1
  title: Company Overview
  summary: >
    Crusoe Energy Systems, founded in 2018 by Chase Lochmiller and Cully Cavness in Denver, Colorado,
    originated as a digital flare mitigation company converting stranded oilfield gas into computing power.
    After pivoting to AI cloud infrastructure in 2023, Crusoe closed a $600 million Series D at $2.8 billion
    in December 2024, followed by a $1.375 billion Series E at a $10 billion-plus valuation in October 2025,
    making it one of the most capitalized neocloud AI infrastructure companies globally.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      Crusoe Energy Systems (doing business as Crusoe) is a vertically integrated AI infrastructure company
      headquartered in Denver, Colorado. Founded in 2018, the company began by deploying modular data centers
      at oil and gas wellheads to capture natural gas that would otherwise be flared and wasted — a proprietary
      approach trademarked as Digital Flare Mitigation® (DFM). DFM converts stranded wellhead gas into
      electricity powering on-site compute, achieving up to 99.89% combustion efficiency compared to roughly
      93% for standard flares, reducing CO2-equivalent emissions by approximately 63% relative to continued
      flaring. Each DFM deployment eliminates an estimated 8,000 tons of CO2 equivalent annually.

      Initially Crusoe used the captured energy for Bitcoin and cryptocurrency mining, but the business
      fundamentally pivoted in 2023 toward AI cloud infrastructure as demand for GPU compute surged.
      The company borrowed $200 million to purchase NVIDIA H100 GPUs and began offering Crusoe Cloud,
      a high-performance AI and machine learning platform. By the time of its December 2024 Series D,
      Crusoe described itself as "the industry's first vertically integrated AI infrastructure provider,"
      combining proprietary energy strategy (stranded gas, renewables), AI-optimized data center construction,
      and a full-stack cloud platform. The company's current mission is to "accelerate the abundance of
      energy and intelligence."

      Crusoe generates revenue primarily through long-term data center leases (anchored by multi-year
      contracts with hyperscaler-tier customers) and through Crusoe Cloud subscription and consumption fees.
      The 1.2 GW Abilene, Texas campus anchored by a long-term Oracle lease underpins near-term revenue
      visibility. Manufacturing facilities in Denver and Tulsa produce server racks for controlled-environment
      GPU installation before trucking to data center sites.
