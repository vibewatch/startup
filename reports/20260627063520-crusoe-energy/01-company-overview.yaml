  - id: funding-history-and-investors
    title: Funding History and Investors
    body: >
      Crusoe's funding history reflects a progression from climate-tech seed to large-scale AI infrastructure
      investment. The company raised a Series A of approximately $30 million in December 2018, led by Founders
      Fund — Peter Thiel's venture firm — which has remained a lead investor through every subsequent round.
      A Series B of roughly $50 million followed in May 2021 from Bain Capital Ventures and other investors
      as the company expanded its DFM operations.

      The transformative round came in December 2024: a $600 million Series D closed at a $2.8 billion
      valuation on December 12, 2024. Founders Fund again led, joined by NVIDIA, Fidelity, Long Journey
      Ventures, Mubadala (the Abu Dhabi sovereign wealth fund), Ribbit Capital, and Valor Equity Partners.
      Blue Owl Capital contributed to the equity round and separately helped arrange $2.3 billion in project
      financing from JPMorgan for the first phases of the Abilene campus. Peter Thiel's comment at the
      announcement — "The biggest risk with AI is that we don't go big enough. Crusoe is here to liberate
      us from the island of limited ambition" — underscored the strategic significance.

      In October 2025, Crusoe closed its oversubscribed $1.375 billion Series E at a valuation exceeding
      $10 billion, co-led by Valor Equity Partners and Mubadala Capital, with participation from over 20
      investors including NVIDIA, Fidelity, Founders Fund, T. Rowe Price, Tiger Global Management,
      Altimeter Capital, Franklin Templeton, Salesforce Ventures, Lowercarbon Capital, and Spark Capital.
      Total capital raised across approximately 13 rounds of debt and equity financing stands at roughly
      $3.9 billion. Headcount and private revenue figures are not publicly disclosed; no IPO timeline
      has been publicly committed, though CEO Lochmiller has stated the company will eventually go public.
