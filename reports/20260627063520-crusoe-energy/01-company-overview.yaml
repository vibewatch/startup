  - id: founders-and-leadership
    title: Founders and Leadership
    body: >
      Crusoe was co-founded by Chase Lochmiller (CEO) and Cully Cavness (President and COO), who bring
      complementary technical and energy-industry expertise. Chase Lochmiller holds degrees in mathematics
      and physics from MIT and a master's degree in computer science with an AI specialization from Stanford.
      Before Crusoe, he worked as a quantitative trader and served as a general partner at Polychain Capital,
      a cryptocurrency investment firm, giving him deep exposure to both computational finance and the
      blockchain/energy intersection that seeded Crusoe's original concept.

      Cully Cavness has a geology degree from Middlebury College and an MBA from Oxford, combined with
      background in oil and gas investment banking. His practical knowledge of the energy sector and
      upstream oil and gas economics informed Crusoe's original Digital Flare Mitigation business and its
      regulatory navigation strategy, including working directly with the North Dakota state legislature to
      pass tax-break legislation for companies deploying flare mitigation systems.

      The leadership team has expanded significantly. Key appointments include Nadav Eiron as SVP of Cloud
      Engineering, Erwan Menard as SVP of Product for Crusoe Cloud, and Nader Pakfar as General Counsel
      (Real Estate), appointed January 2026. Strategic advisors include Bill Stein (former CEO of Digital
      Realty), Peter Gross, and Matt Field. The company has high key-person concentration in Lochmiller and
      Cavness given their dual co-founder and operating roles; succession or departure risk is material.
