  - id: product-portfolio-and-operations
    title: Product Portfolio and Operations
    body: >
      Crusoe operates across three product tiers. The first is physical AI factory infrastructure:
      the company acquires land, designs and constructs gigawatt-scale data center campuses, and provides
      long-term lease arrangements to anchor tenants (Oracle, potentially other hyperscalers). The Abilene
      campus plans 1.2 GW; a 1.8 GW campus in Wyoming is in planning; Alberta, Canada and Polar (Norway)
      sites are also in development. Second is Crusoe Cloud, a multi-region AI cloud platform with four
      regions (us-northcentral1-a, us-east1-a, us-southcentral1-a, eu-iceland1-a). Crusoe Cloud offers
      GPU instances, Managed Kubernetes, and the Crusoe Managed Inference Service powered by proprietary
      MemoryAlloy™ technology — a cluster-wide KV cache fabric delivering up to 9.9x faster time-to-first-
      token versus standard inference engines. Third is Crusoe Intelligence Foundry and Edge Zones:
      Crusoe Edge Zones, launched March 2026, are modular, factory-built clusters deployable for sovereign
      AI, low-latency inference, and dedicated enterprise deployments.

      The company operated in 9 US states and 3 countries as of the Series D announcement, with customer
      count growing more than 7x in the 12 months prior. Notable cloud customers include Decart (scaled
      5x to serve 2 million users in four days), Codeium/Windsurf (700,000+ developers, 99.98% cluster
      uptime), and others. Crusoe has also divested its crypto mining operations, completing the full pivot
      to AI infrastructure. The company averted over 680,000 metric tons of GHG emissions through DFM
      technology as reported in its ESG disclosures. Energy-first strategy — locking up stranded gas,
      wind, geothermal, and renewable sites years in advance — is described by analysts as the core moat
      in the neocloud market.
