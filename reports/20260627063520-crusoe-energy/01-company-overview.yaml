  - id: milestones-and-strategic-evolution
    title: Milestones and Strategic Evolution
    body: >
      Crusoe's trajectory follows three distinct phases: (1) a flare-gas crypto mining phase (2018–2022),
      (2) a pivot and AI cloud build-out phase (2023–2024), and (3) a hyperscale data center development
      phase (2024–present). The company weathered a near-existential threat in early 2020 when COVID-19
      lockdowns collapsed oil demand, forcing a reset toward renewables-adjacent sites. This forced
      diversification toward clean energy ultimately positioned the company for its AI pivot.

      A pivotal strategic moment came in the first quarter of 2024 when Crusoe won the development contract
      for what would become the Stargate AI data center campus in Abilene, Texas. Elon Musk's xAI was
      reportedly the first potential client for the site but pulled out to build the "Colossus" megacluster
      in Memphis independently. Oracle subsequently signed a long-term lease, with the facility designed
      to provide 100,000+ NVIDIA GPUs to OpenAI via Microsoft Azure. The first phase of the 1.2 GW Abilene
      campus went live in September 2025 — one of the fastest greenfield hyperscale data center builds on
      record. A 45-hour outage in early March 2025 drew customer complaints and industry skepticism; a
      subsequent May 2026 networking incident in the us-east1-a region indicated ongoing operational
      reliability as the main reputational risk to watch.

      Product milestones in 2026 include the launch of Crusoe Edge Zones (March 2026), the Crusoe Command
      Center unified operations platform (February 2026), and ISO 27001 / ISO 42001 certifications
      (February 2026). At NVIDIA GTC 2026 in March, Crusoe announced deepened collaboration spanning
      early adopter status for NVIDIA Vera CPU and Rubin GPU, support for NVIDIA Omniverse DSX Blueprint,
      and contribution of a proprietary Rust BPE tokenizer to NVIDIA Dynamo open-source framework.
