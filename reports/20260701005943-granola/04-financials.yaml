company:
  name: Granola
chapter:
  number: 4
  title: Financials
  summary: >-
    Granola shows fast, credible-looking commercial momentum -- a Bloomberg-reported 250% quarterly revenue growth rate, a concrete
    Business-to-Enterprise land-and-expand deal at Brex, and reference customers spanning Vanta, Brex, Zapier, and Vercel -- but carries
    almost no verifiable financial disclosure: no revenue, ARR, gross margin, CAC, retention, cash balance, or burn figure exists in any
    source reviewed, and Granola Labs Ltd’s UK small-company audit exemption means no ordinary future filing will close that gap.
sections:
  - id: revenue-model-pricing-mix
    title: Revenue model, pricing, and revenue mix
    body: >-
      Granola monetizes through a tiered per-seat SaaS subscription. Its own blog states the Business plan costs $14 per user per month and
      includes unlimited meeting history, CRM integrations, and folder-level queries across a team's conversations (CI001). SiliconANGLE's
      March 2026 Series C coverage adds a free tier and a $35-per-month Enterprise tier with expanded cybersecurity controls, though it
      never clarifies whether that Enterprise figure is a per-seat or flat organizational price (CI002) -- and Granola's own Enterprise page
      confirms the ambiguity by listing enterprise-only features without publishing any contract price at all (CI003). The Series C
      announcement adds two more monetization surfaces -- a personal API bundled into Business/Enterprise plans and an enterprise admin API
      bundled into Enterprise only -- with neither priced as a standalone line item today (CI004). No source reviewed discloses what share
      of revenue comes from Business versus Enterprise versus API usage (CI005).


      Against comp-set pricing, Granola's $14 list price sits inside a $10-$39 per-seat band shared with Fireflies, Otter, and Fathom
      (CI010, CI011, CI012), all of which also gate their own Enterprise tier behind a sales conversation. Granola's own sales buyer's guide
      explicitly cedes the much higher-ACV conversation-intelligence category to Gong, citing third-party estimates of $1,300-$1,600 per
      user per year plus a $5,000-$50,000 platform fee (CI008), a figure an independent CloudTalk analysis corroborates (CI009). Bloomberg
      reported, via SiliconANGLE, that Granola's revenue grew 250% in the quarter before the Series C, but neither outlet disclosed the
      absolute base that rate was measured against (CI006), leaving revenue quality directionally positive but financially unverifiable.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
      - CI011
      - CI012
      - CI008
      - CI009
      - CI006
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-motion-sales-efficiency
    title: GTM motion and sales efficiency proxies
    body: >-
      Granola's go-to-market motion is bottom-up and product-led rather than sales-led. Brex's published case study is the clearest
      evidence: implementation began as a trial on the Business plan with select teams and moved to a full Granola Enterprise deployment
      within weeks once usage spread organically (CI013), and Vercel's case study describes its entire GTM team adopting the product rather
      than a single champion (CI014). Index Ventures' own investment post frames this as the growth mechanism it backed: individual users
      becoming evangelists, with adoption spreading grassroots-style from individuals to teams to whole enterprises (CI017), a narrative
      Granola's careers page echoes by claiming the product "spreads quickly from leaders to entire organizations" while transcribing
      millions of minutes of conversation daily (CI018).


      None of this is denominated in dollars. No source -- company-published or third-party -- discloses a CAC, LTV, or CAC-payback figure
      for Granola (CI019). The closest available yardstick is external: a 2026 SaaS benchmark report puts median CAC payback for
      PLG/bottom-up SaaS companies at 12-15 months, with top-quartile companies near 9-12 months and anything above 24 months flagged as a
      warning sign for venture-funded SaaS (CI020), while the same report notes median sales-and-marketing spend as a share of revenue for
      venture-backed SaaS fell from over 50% in 2021 to roughly 35-40% in 2024-2026 (CI021). These are comp-set benchmarks only; they say
      nothing about whether Granola's own acquisition spend or efficiency sits above, at, or below that band, and the customer case studies
      quantify time saved (260-830+ hours), not cost saved or dollars paid (CI015, CI016).
    claimRefs:
      - CI013
      - CI014
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
      - CI015
      - CI016
    figureRefs:
      - FI002
  - id: cost-structure-margin-drivers
    title: Cost structure and margin drivers
    body: >-
      Granola's own security page is the single most important cost-structure disclosure in this chapter: it names Deepgram and AssemblyAI
      as third-party transcription providers and OpenAI and Anthropic as third-party AI providers used to transcribe and summarize meetings
      (CI022). Because both inputs are licensed rather than built on owned infrastructure, Granola's cost of revenue is likely usage-linked
      -- scaling with meeting volume and note length -- rather than a mostly fixed hosting cost typical of simpler SaaS products (CI023). On
      top of that, Granola requires enterprise buyers to adopt SSO/SAML, SCIM provisioning, an admin dashboard, and encryption, and states
      it holds SOC 2 Type II certification (CI026), all representing ongoing security-engineering investment layered on the core
      transcription/inference cost base. Its March 2026 decision to encrypt its local notes database, criticized publicly by an a16z partner
      for breaking third-party agent workflows, added further unquantified engineering and trust-remediation cost (CI031).


      No source discloses Granola's own gross margin, cost of revenue, or opex breakdown; TheNextWeb's Series C coverage states plainly that
      Granola has not disclosed revenue figures, user counts, or retention metrics publicly (CI027). External benchmarks put median SaaS
      subscription gross margin at roughly 76% (top-quartile 84%+) but explicitly flag that products with heavy compute or AI-inference
      costs often fall below 70% (CI024) -- a pattern squarely relevant to an AI-transcription product. Zoom's FY2026 10-K reports gross
      margin improved to 77.0% from 75.8% (CI025), useful only as a mature public-company collaboration-software comparison, not a Granola
      data point. Structurally, Companies House confirms Granola Labs Ltd filed "total exemption full accounts" for FY2024 and FY2025, a UK
      small-company exemption that removes any near-term statutory obligation to publish turnover or profit (CI028), which is why this
      opacity should be read as a structural filing status rather than company evasiveness.
    claimRefs:
      - CI022
      - CI023
      - CI026
      - CI031
      - CI027
      - CI024
      - CI025
      - CI028
    tableRefs:
      - TI003
  - id: traction-vs-private-metrics
    title: Public traction versus private-metric gaps
    body: >-
      Granola's public traction proxies are qualitative and reference-customer-based rather than quantitative. Its careers page claims the
      product transcribes millions of minutes of conversation daily (CI018), and its Series C post together with Kleiner Perkins' writeup
      names Asana, Vanta, Gusto, Thumbtack, Cursor, Lovable, Decagon, and Mistral AI as customers, alongside dedicated ROI case studies from
      Brex, Vanta, Zapier, and Vercel (CI036). None of those case studies discloses a seat count, contract value, or renewal/expansion rate.
      Historically, one 2026 report states Granola had roughly 5,000 weekly users at the time of its October 2024 Series A but has not
      disclosed a current user count as of mid-2026 (CI032), while the same report notes Fireflies.ai has independently surpassed 16 million
      users and a $1 billion valuation -- a scale comparison Granola's own disclosures cannot match or refute (CI033).


      Even third-party data vendors cannot close the gap: Tracxn's public profile estimates 116 employees as of May 2026 (CI034) but masks
      Granola's revenue and per-round valuation-multiple fields behind a paid-data paywall, meaning a dedicated research platform does not
      surface Granola's revenue or valuation multiple for free either (CI035). TheNextWeb states directly that Granola has not disclosed
      retention metrics publicly, and no source reviewed in this chapter discloses a net revenue retention, logo retention, or churn figure
      (CI037). The result is a traction picture built entirely on logo quality and anecdotal time-savings rather than any measurable usage,
      revenue, or retention trend.
    claimRefs:
      - CI018
      - CI036
      - CI032
      - CI033
      - CI034
      - CI035
      - CI037
    figureRefs:
      - FI003
  - id: capital-adequacy-financing
    title: Capital adequacy and financing dependency
    body: >-
      Granola's Company Overview chapter documents its full funding chronology; this chapter restates only the facts needed to assess
      forward capital adequacy. The company announced a $125 million Series C on 2026-03-25 led by Index Ventures, with Kleiner Perkins and
      returning investors Lightspeed, Spark, and NFDG participating, at a $1.5 billion post-money valuation (CI038). TechCrunch and The SaaS
      News both put total funding at $192 million after the round, while BusinessCloud instead reported roughly $188 million -- a
      small but real cross-publisher discrepancy on Granola's own cumulative total (CI040). Use of funds is only loosely specified:
      StartupRise's coverage offers just a generic "scale its product and support continued growth" line (CI041), while Granola's own Series
      C post frames the raise around shipping Spaces, APIs, an updated MCP server, and admin usage visibility rather than a numeric budget
      split (CI042); Bloomberg separately reported Granola plans to keep hiring, consistent with open roles on its careers page (CI043).


      No source discloses cash on hand, monthly burn, or runway (CI044), and as a UK private company filing exempt small-company accounts,
      Granola has no near-term legal obligation to publish any of them. The Companies House filing history reviewed lists confirmation
      statements, accounts, PSC, and officer filings but no registered secured-debt charge, consistent with an equity-only capital structure
      to date, though this reflects the filing-history summary rather than a dedicated charges-register pull (CI045). Neither Granola nor
      its investors state a public next-round trigger; Index Ventures' and Kleiner Perkins' posts instead frame the round around a
      multi-year context-layer build-out (CI046). That framing has not stopped public skepticism: TheNextWeb notes the valuation jumped
      sixfold in ten months without disclosed revenue, users, or retention (CI047), and a lower-reputation outlet, BritishWire, amplified
      dot-com-bubble comparisons questioning whether Granola's eventual revenue can justify a ten-figure valuation (CI048).
    claimRefs:
      - CI038
      - CI040
      - CI041
      - CI042
      - CI043
      - CI044
      - CI045
      - CI046
      - CI047
      - CI048
