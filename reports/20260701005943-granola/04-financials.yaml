      - TI004
      - TI005
    figureRefs:
      - FI004
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Taken together, Granola's financial picture is a company with real, fast-growing commercial traction and almost no verifiable
      financial disclosure to underwrite it. Revenue quality looks directionally strong -- 250% quarterly growth per Bloomberg and a
      concrete Business-to-Enterprise upgrade at Brex -- but is unverifiable in absolute terms because no dollar-denominated revenue, ARR,
      or seat count has been disclosed by the company, its investors, or any third-party data provider reviewed, including a paywalled
      Tracxn profile (CI050). Margin path is a genuine open question rather than a presumed SaaS outcome: Granola's reliance on third-party
      LLM-inference and transcription vendors mirrors the exact cost pattern that comp-set benchmarks associate with sub-70% gross margin,
      versus the 76%-84% median-to-top-quartile range for subscription SaaS and Zoom's 77.0% FY2026 comparable (CI051).


      Capital intensity looks low in the classic sense -- no disclosed debt, no capex-heavy infrastructure -- but capital dependency is
      high: four equity rounds in under three years, a $125 million round just closed, and no disclosed cash balance, burn, or runway to
      show how long that capital is expected to last (CI052). The core diligence blocker is structural rather than a matter of company
      reticence: Granola Labs Ltd's UK small-company audit exemption means no ordinary future Companies House filing will surface turnover,
      margin, or profit, so underwriting this business requires negotiated data-room access rather than waiting on a public filing (CI053).
      Until that access exists, any revenue, margin, or valuation-multiple figure attached to Granola should be treated as an estimate or a
      third-party claim, not a fact.
    claimRefs:
      - CI050
      - CI051
      - CI052
      - CI053
