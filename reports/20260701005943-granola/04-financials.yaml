callouts:
  - calloutType: risk
    title: No public revenue, margin, or burn figures exist
    body: >-
      Every core underwriting input -- revenue, ARR, gross margin, CAC, NRR, cash balance, and burn -- is undisclosed by Granola, its
      investors, and every third-party data source reviewed, including a paywalled Tracxn profile. This is a structural gap: Granola Labs
      Ltd files UK small-company exempt accounts, so no ordinary future statutory filing will close it.
    claimRefs:
      - CI027
      - CI044
      - CI028
      - CI035
  - calloutType: strength
    title: Concrete land-and-expand evidence at Brex
    body: >-
      Brex's own case study documents a real upgrade path: a Business-plan trial with select teams converted to a full Granola Enterprise
      deployment within weeks, the clearest dollar-relevant (if not dollar-disclosed) expansion signal in this chapter.
    claimRefs:
      - CI013
  - calloutType: insight
    title: Cost structure is a wrapper, not a platform, cost profile
    body: >-
      Granola's own security page confirms it licenses both transcription (Deepgram, AssemblyAI) and AI summarization (OpenAI, Anthropic)
      from third parties. That is a usage-linked, vendor-dependent cost structure -- the same pattern SaaS benchmarks associate with gross
      margins below the 70% floor most investors expect from software.
    claimRefs:
      - CI022
      - CI023
      - CI024
  - calloutType: risk
    title: Valuation multiple is unverifiable and publicly contested
    body: >-
      TheNextWeb and a lower-tier outlet (BritishWire) both flagged the same fact from different angles: Granola's valuation rose sixfold in
      under a year with zero disclosed revenue, and public commentary increasingly frames richly-valued, revenue-opaque AI startups as
      bubble risk.
    claimRefs:
      - CI047
      - CI048
