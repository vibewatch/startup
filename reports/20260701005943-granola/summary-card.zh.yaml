  topStrengths:
    - 融资历史和可比公司事实，至少由两个独立交叉核验来源一致印证，包括公司官方声明和高声誉新闻报道。
    - 无 bot、设备级架构真实存在，并被安全研究员拆解和逆向工程开源客户端独立印证；这支撑了大约三个月完成的 SOC 2 Type II 认证。
    - 独立 B2B 交易数据（YipitData Signals）显示 2026 年采用率出现真实拐点：中型市场客户环比增长 25%、六个月支出增长 3x、实测流失接近零，并且用户从竞品切换过来的方向不对称。
    - 四个公司发布的旗舰案例（Zapier、Vanta、Brex、Vercel）都显示，一个基层用户带动全组织 52-100% 采用，证明这种 land-and-expand 模式能在不同买方画像中重复。
    - AI 会议纪要品类有持久且文档充分的结构性需求驱动；我们审阅的每一种市场规模口径都指向 2030 年代初前的双位数增长。
  topRisks:
    - Granola、投资人或任何第三方数据商都没有披露收入、ARR、毛利率、现金余额或烧钱速度，因此 $1.5B 投后估值无法对照公司自身财务基底核验。
    - 针对 Otter.ai 合并联邦集体诉讼中的窃听和生物声纹同意法律先例正在推进，并非假设；法律评论也将其视为可能波及 Granola 的品类级风险。
    - 捆绑式巨头（Microsoft Teams/Copilot、Google Workspace/Gemini、Zoom AI Companion）把可比纪要功能放进买方已经付费的订阅里免费送，压住 Granola 独立定价权。
    - 一年内披露的三起安全事后复盘，以及 March 2026 本地数据库加密变更打断第三方 agent 工作流，削弱了 Granola 自己「默认私密」的营销说法；独立报道也与之相矛盾。
    - 资本充足性披露在结构上不透明：Granola Labs Ltd 享有英国小公司审计豁免，意味着未来普通法定文件不会披露营业额、毛利或现金烧钱。
  unresolvedGaps:
    - Granola 的绝对收入或 ARR 数字，以及按 Business/Enterprise/API 分层的收入拆分。
    - Granola 的账上现金、月度烧钱速度和以月计的现金跑道。
    - 按客户细分拆分的净收入留存、总收入留存、logo 流失率或合同价值数据。
    - 确认三篇已发布安全事后复盘是否覆盖全部重大事件，并提供 HIPAA 商业伙伴协议或 EU 托管路线图。
    - 确认 Granola 是否任命 CFO、General Counsel 或 Head of Compliance，以及公司是否涉及任何诉讼或监管行动。
