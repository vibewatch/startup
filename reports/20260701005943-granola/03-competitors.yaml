callouts:
- calloutType: strength
  title: >-
    Granola's context-layer bet is real, but it is now a shared bet, not a lonely one
  body: >-
    Granola's move from single-meeting notes into Spaces, APIs, and MCP is a credible strategic response to commoditizing
    transcription, but Otter.ai's own April 2026 relaunch and Fathom's account-wide "Ask Fathom" show at least two well-resourced
    rivals racing toward the same cross-meeting agent layer at the same time.
  claimRefs:
  - CP012
  - CP030
  - CP039
- calloutType: risk
  title: Bundled incumbents still cap standalone pricing power
  body: >-
    Microsoft, Google, and Zoom all give away a comparable notetaking feature inside subscriptions buyers already hold,
    and Microsoft's own $10/user/month Teams Premium add-on undercuts every standalone vendor's list price this chapter
    reviewed, including Granola's own $14 Business plan.
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
  - CP040
- calloutType: risk
  title: Granola's own trust marketing is contradicted by independent reporting
  body: >-
    Granola's own page states notes are "private by default," but independent 2026 reporting found notes are shared with
    anyone holding a link and used for model training by default unless a user opts out -- and a separate review scored
    Granola 3/10 on enterprise readiness for hosting and data residency.
  claimRefs:
  - CP044
  - CP045
  - CP046
  - CP047
- calloutType: insight
  title: >-
    The standalone notetaking layer is commoditizing faster than the agent layer
  body: >-
    Independent and vendor-published 2026 evidence agree that basic transcription has converged above 95% accuracy industry-wide;
    the more open competitive question is which vendor turns notes into durable cross-meeting knowledge and action fastest,
    not which one transcribes best.
  claimRefs:
  - CP041
  - CP042
  - CP043
- calloutType: assumption
  title: >-
    Every price comparison in this chapter uses list pricing, not realized ACV
  body: >-
    Granola's own $14 Business-plan figure and every competitor price in this chapter are list or estimated prices; none
    of the reviewed vendors, including Granola, discloses realized enterprise pricing, discount depth, or paid-seat counts
    publicly.
  claimRefs:
  - CP033
  - CP050
