- id: capability-pricing-gtm-trust
  title: Capability, pricing, GTM/distribution, and trust/privacy posture
  body: >-
    On raw capability, the basic single-meeting transcription layer looks commoditized. Otter.ai, Fathom, and Granola have
    each independently shipped a cross-meeting AI chat or agent layer in 2026 -- Otter's AI Chat Connectors, Fathom's account-wide
    "Ask Fathom," and Granola's own rebuilt agentic Chat (CP030) -- and Granola's May 2026 design post states it chose to
    have that Chat read up to 100 meetings at a high level rather than 10 meetings in full transcript detail, an architecture
    tradeoff it frames as central to its strategy (CP031). On trust, Granola's own security documentation requires enterprise
    buyers to request Trust Center access before seeing its SOC 2 report, while Fireflies and Otter both surface compliance
    claims (SOC 2/GDPR/HIPAA badges, a HIPAA add-on) more directly on public marketing and pricing pages (CP032).


    On pricing, list prices for standalone vendors cluster in a similar $0-$40 per user per month band -- Granola's own
    sales guide states its Business plan costs $14 per user per month (CP050), against Fathom's $15-$34, Fireflies' $10-$39,
    Otter's $17-$30, and Read AI's $15-$40 (CP033) -- while Microsoft's Teams Premium undercuts all of them at $10 per user
    per month and Gong sits an order of magnitude higher on a per-year basis (CP033). Otter's and Fireflies' own pricing
    pages both show steep promotional discounts off list price (CP036), evidence of active price competition that could
    pressure Granola's flat $14 list price over time. On distribution, Microsoft's, Google's, and Zoom's features all ride
    inside collaboration-suite subscriptions buyers already pay for, a channel advantage no standalone vendor, including
    Granola, can replicate without its own distribution motion (CP040).
