- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Bot-free local capture is Granola's core differentiator
    - >-
      Fathom and tl;dv both now ship bot-free or "no bot required" capture options, and Otter's bot-based workflow reflects
      a choice, not a technical limitation
    - high
    - >-
      Ask Granola for evidence of retention or win-rate advantage specifically attributable to bot-free capture versus bot-optional
      rivals
  - - >-
      Granola's agentic Chat and Spaces/API/MCP expansion create a durable context-layer moat
    - >-
      Otter's April 2026 relaunch ships an equivalent MCP client/server and AI Chat Connectors, and Fathom already offers
      account-wide "Ask Fathom" plus MCP support
    - high
    - >-
      Request usage/retention data on Granola's own Chat/Spaces adoption versus rival agent features to test whether the
      moat is architecture-based or execution-speed-based
  - - Bundled incumbent features cap standalone pricing power
    - >-
      Microsoft, Google, and Zoom all include meeting-notes AI in already-purchased subscriptions, and Zoom reports AI Companion
      MAUs more than tripled year over year
    - high
    - >-
      Quantify win/loss rate specifically against bundled incumbent features rather than against other standalone vendors
  - - Granola's trust posture supports enterprise sales
    - >-
      An independent review scored Granola 3/10 on enterprise readiness for hosting/data residency, and reporting shows
      a gap between its "private by default" marketing and its actual default settings
    - high
    - >-
      Request an updated, dated SOC 2 report and a direct written confirmation of current hosting regions and default sharing/training
      settings
  - - >-
      Switching cost is elevated by Granola's local-first, encrypted note storage
    - >-
      A prominent investor publicly criticized the March 2026 local-database encryption change as reducing data portability,
      and an independent blog argued it leaves the app with "zero value" for portability-focused users
    - medium
    - >-
      Confirm whether Granola offers a full-fidelity export path and monitor churn signals following the encryption change
  - - Standalone AI notetaking is a durable, separately monetizable category
    - >-
      A vendor-published 2026 market report frames transcription as commoditized at 95%+ accuracy industry-wide, and TechCrunch
      reports competitive value is shifting toward action-oriented workflows across several rivals simultaneously
    - medium
    - >-
      Track whether Granola's own action-oriented features (Briefs, Recipes, CRM push) show measurably faster adoption than
      Otter's, Fireflies', or Read AI's equivalent workflow features
  - - >-
      Granola can defend its SMB/founder-led segment against Gong-style upmarket competitors
    - >-
      Gong's cost structure only applies to large SDR organizations, but Fathom, Fireflies, and Otter all now ship coaching/analytics
      features that narrow this gap from below
