  title: Feature breadth / capability map
  type: matrix
  layout: wide
  summary: >-
    Among direct software peers, Fireflies and tl;dv publish the most compliance and integration signals directly, while
    Granola gates its own compliance documentation and faces an independent contradiction of its "private by default" marketing
    claim.
  data:
    columns:
    - Compliance badges published
    - Data residency disclosed
    - Local-first / bot-free capture
    - Native CRM automation
    - Litigation/regulatory exposure disclosed
    rows:
    - label: Granola
      values:
      - label: no (gated behind Trust Center request)
        tone: warning
        detail: >-
          SOC 2 report requires a Trust Center access request rather than a public badge.
      - label: partial (US-only AWS VPC)
        tone: warning
        detail: >-
          Granola's own security page states hosting is a US-hosted AWS Virtual Private Cloud; no EU region disclosed.
      - label: 'yes'
        tone: positive
        detail: Core bot-free local-capture positioning.
      - label: 'yes'
        tone: positive
        detail: >-
          Business plan references CRM integrations such as HubSpot, Affinity, Attio, and Zapier.
      - label: criticized, no litigation found
        tone: warning
        detail: >-
          Independent reporting contradicts its own "private by default" marketing claim; no lawsuit identified in reviewed
          sources.
    - label: Fathom
      values:
      - label: partial
        tone: neutral
        detail: >-
          SSO/SCIM at Enterprise tier; no explicit SOC 2 badge observed on reviewed pages.
      - label: unknown
        tone: warning
        detail: Data residency not stated on reviewed pricing/home pages.
      - label: yes (beta)
        tone: positive
        detail: Choice of bot-free-beta or bot capture.
      - label: 'yes'
        tone: positive
        detail: CRM field sync listed at the Business tier.
      - label: none found
        tone: neutral
        detail: No litigation or regulatory action identified in reviewed sources.
    - label: Fireflies.ai
      values:
      - label: 'yes'
        tone: positive
        detail: >-
          SOC 2 Type II, GDPR, and HIPAA badges published directly on the homepage.
      - label: partial
        tone: neutral
        detail: Advertises "Private Storage" without disclosing a specific region.
      - label: unknown
        tone: warning
        detail: No bot-free capture option observed in reviewed sources.
      - label: 'yes'
        tone: positive
        detail: CRM, project-management, ATS, and Slack integrations.
      - label: yes, adverse
        tone: warning
        detail: >-
          Independent reporting says similar consent-related litigation already targets Fireflies.ai.
    - label: Otter.ai
      values:
      - label: partial
        tone: neutral
        detail: >-
          HIPAA compliance listed as a pricing-page add-on; no prominent SOC 2 badge observed.
      - label: unknown
        tone: warning
        detail: Data residency not stated in reviewed sources.
      - label: no (bot-based)
        tone: warning
        detail: Core workflow relies on a calendar-connected meeting bot.
      - label: 'yes'
        tone: positive
        detail: Salesforce/HubSpot sync plus Zapier integration.
      - label: yes, adverse
        tone: warning
        detail: >-
          Facing a consolidated federal class action over consent and biometric-data claims.
    - label: tl;dv
      values:
      - label: 'yes'
        tone: positive
        detail: GDPR and SOC 2 badges published on its own homepage.
      - label: unknown
        tone: warning
        detail: Data residency not stated in reviewed sources.
      - label: 'yes'
        tone: positive
        detail: '"No bot required" capture option.'
      - label: 'yes'
        tone: positive
        detail: >-
          Claims 5,000+ Zapier-connected apps plus native HubSpot/Salesforce integrations, per its own comparison.
      - label: none found
        tone: neutral
        detail: >-
          No litigation or regulatory action naming tl;dv identified in reviewed sources.
    - label: Read AI
