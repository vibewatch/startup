callouts:
- calloutType: risk
  title: Every top risk category is prospective, structural, or comparable -- none is yet a realized event at Granola itself
  body: 'No source reviewed identifies litigation, a regulatory enforcement action, a disclosed cash-burn figure, or a named non-founder executive at Granola. That absence is itself the finding: the highest-severity items in this chapter''s ranking (wiretap/BIPA exposure, capital-adequacy opacity, vendor and platform-bundling concentration) are currently prospective, structural, or drawn from comparable competitor litigation rather than a confirmed event at Granola, which should temper -- but not eliminate -- their weight in an investment decision.'
  claimRefs:
  - CR017
  - CR041
  - CR052
  - CR018
- calloutType: risk
  title: Platform incumbents are bundling AI meeting-notes features at a lower incremental price than Granola charges
  body: Microsoft Teams Premium ($10/user/month), Zoom AI Companion, and Google Gemini in Meet all now offer AI meeting-notes functionality inside collaboration suites that Granola's own enterprise customers already pay for, at a price point below or bundled into Granola's $14 Business plan. Zoom alone reports AI Companion usage more than tripling year over year, and a competitor market report cites 510,000 accounts within five months of launch -- a substitution risk that does not require any Granola-specific failure to materialize.
  claimRefs:
  - CR031
  - CR032
  - CR033
  - CR034
- calloutType: risk
  title: Capital-adequacy disclosure is structurally, not just voluntarily, opaque
  body: Granola's UK parent filed total-exemption small-company accounts, meaning no ordinary future Companies House filing will surface cash balance, burn rate, revenue, or margin absent a statutory trigger such as insolvency or a size threshold breach. Underwriting Granola's financial risk therefore requires negotiated data-room access rather than waiting on a future public filing.
  claimRefs:
  - CR041
  - CR042
- calloutType: strength
  title: Granola's disclosed incident response is public and independently corroborated, even if reactive
  body: Granola published detailed post-mortems for all three of its disclosed 2025 security incidents, and independent researcher Tenable's finding matches the company's own account of the AssemblyAI key exposure. None of the three incidents exposed actual meeting audio or transcript content. The pattern is reactive -- researchers found the issues, not internal detection -- but the transparency itself is a positive signal relative to vendors that do not publish post-mortems at all.
  claimRefs:
  - CR019
  - CR020
  - CR023
  - CR027
- calloutType: recommendation
  title: Prioritize data-room financials, a named compliance owner, and consent-mechanism specifics in follow-on diligence
  body: 'Before any further capital commitment, diligence should request: (1) Granola''s actual cash balance, burn rate, and runway directly from the company; (2) confirmation of a named CFO, General Counsel, or Data Protection Officer; and (3) the specific in-app mechanism, if any, by which non-account-holder meeting participants are notified of and consent to Granola''s local audio capture in all-party-consent jurisdictions.'
  claimRefs:
  - CR041
  - CR052
  - CR014
