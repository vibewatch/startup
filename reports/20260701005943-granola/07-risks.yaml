  title: Risks
  summary: Weighing likelihood, severity, and mitigation maturity across primary regulatory sources, comparable-vendor litigation, and Granola's own disclosures, this chapter ranks partner/vendor concentration and platform-bundling substitution, financial and capital-adequacy disclosure opacity, and legal/regulatory consent exposure as Granola's highest-priority risks, ahead of recurring externally-discovered operational/security incidents and execution/governance disclosure gaps -- with every category carrying an identified monitorable diligence path but no company-disclosed quantitative threshold, since no source reviewed identifies litigation, a regulatory enforcement action, a disclosed cash-burn figure, or a named non-founder executive at Granola.
sections:
- id: risk-ranking-overview
  title: Risk Ranking Overview
  body: 'This chapter ranks Granola''s legal, regulatory, operational, technical, financial, partner, customer, and execution risks by likelihood, severity, mitigation maturity, and residual exposure, drawing on primary statutes and regulator guidance (UK ICO, the EU AI Act, California''s wiretap statute, Illinois''s biometric-privacy law, and HHS''s HIPAA Privacy Rule), litigation and law-firm analysis of comparable AI notetakers, Granola''s own security post-mortems and compliance pages, and independent financial, competitive, and headcount data gathered in earlier chapters. Weighed together, the highest-priority risk categories are: partner/vendor concentration and platform-bundling substitution, financial and capital-adequacy disclosure opacity, legal/regulatory consent and privacy exposure, recurring externally-discovered operational/security incidents, and execution/governance disclosure gaps (CR058). No source reviewed identifies litigation, a regulatory enforcement action, a disclosed
    cash/burn figure, or a named non-founder executive at Granola -- meaning several of the highest-severity items in this ranking are currently prospective or structural rather than realized, and every one of them has an identified monitorable diligence path but no company-disclosed quantitative threshold (CR059). The risk heatmap below plots likelihood, severity, mitigation maturity, and residual exposure across the eight risk categories developed in the sections that follow.'
  claimRefs:
  - CR058
  - CR059
  figureRefs:
  - FR001
- id: legal-regulatory-risk
  title: Legal and Regulatory Risk
  body: |-
    Granola's own legal documents establish only a baseline compliance posture: its Privacy Policy permits disclosure to government and law enforcement to meet legal requirements (CR001), its Data Processing Addendum commits to breach notification "without undue delay" (CR002), and its Terms of Service link to a public vulnerability-disclosure policy and three security post-mortems (CR003). Beyond those company documents, the applicable regulatory landscape is substantial. The UK ICO's monitoring-workers guidance requires a documented lawful basis, proportionality, and transparency for any employer-deployed recording or transcription tool (CR004), and its AI-specific guidance separately requires attention to fairness, accountability, and statistical accuracy (CR005). The EU AI Act's general-purpose-AI transparency rules -- directly relevant given Granola's reliance on OpenAI and Anthropic models -- became applicable in August 2025, with broader AI-system transparency obligations following in August 2026 (CR006). In the US, California's all-party-consent wiretap statute criminalizes recording a confidential communication without every participant's consent (CR007), and Illinois's Biometric Information Privacy Act requires written notice and consent before any entity collects a voiceprint (CR008); HHS's HIPAA Privacy Rule requires a written business-associate agreement before any AI vendor may process protected health information on a covered entity's behalf (CR009).

    None of this is hypothetical for the AI-notetaking category: a consolidated federal class action against Otter.ai alleges exactly these wiretap and biometric-privacy violations (CR010), Bloomberg Law reports that courts are split on whether an AI transcription vendor is a "tool" or an unauthorized eavesdropper -- a distinction that can expose the customer company to vicarious liability (CR011) -- and Goodwin Procter's April 2026 client alert quantifies California statutory damages at up to $5,000 per violation while flagging biometric and privilege risk separately (CR012). Nine US states require all-party consent (CR013). Granola's "bot-free," device-level capture design differs mechanically from Otter.ai's bot-based model, but independent legal commentary on vendor classification suggests it does not by itself resolve the underlying consent question for other meeting participants (CR014). Granola's Enterprise-plan SOC 2 Type II certification is marketed as "independently audited," but SOC 2 does not itself certify wiretap, UK GDPR, AI Act, or HIPAA compliance (CR015), and the company's own blog discloses it does not currently hold a HIPAA Business Associate Agreement (CR016). No source reviewed identifies litigation or a regulatory action naming Granola directly, so this category's realized risk to date is comparable and category-wide rather than company-specific (CR017, CR018).
