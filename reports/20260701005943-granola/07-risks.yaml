- id: partner-dependency-concentration-risk
  title: Partner, Dependency, and Concentration Risk
  body: |-
    Granola's own Security page confirms the product depends on four external AI vendors -- Deepgram and AssemblyAI for transcription, OpenAI and Anthropic for summarization -- with encrypted transcripts and notes stored solely in a US-hosted AWS Virtual Private Cloud (CR029, CR060). This is not a theoretical dependency: AssemblyAI was the direct vector for Granola's first disclosed 2025 security incident, showing vendor concentration risk has already materialized once (CR030). A second, arguably larger dependency risk is competitive rather than supplier-side: Microsoft's own documentation confirms Teams' AI meeting recap is available via a $10/user/month Teams Premium add-on or a Microsoft 365 Copilot license -- undercutting Granola's $14 Business-plan price by bundling a comparable feature into a suite most enterprise customers already pay for (CR031) -- while Google markets Gemini-powered notes natively inside Meet (CR033) and Zoom reports AI Companion usage more than tripling year over year, reaching 510,000 accounts within five months of launch per an independent market report (CR032, CR034). Physical hardware notetakers add a further, non-software substitute vector (CR035).

    Granola's capital-provider base shows its own concentration pattern: both Index Ventures and Kleiner Perkins publish investment posts naming existing Granola customers (Asana, Vanta, Gusto, Thumbtack, Cursor, Lovable) as proof points, meaning the same investor network is both capital provider and customer-reference amplifier (CR036). On the financing-structure side, Companies House filings show only equity-related records for Granola's UK parent with no registered charge (secured-debt) filing, consistent with an all-equity capital structure and no separate lender dependency (CR037). Finally, no source reviewed identifies a reseller, systems-integrator, or channel-partner agreement, meaning Granola's go-to-market currently depends on direct, self-serve, and organic-referral channels rather than a diversified distribution network (CR038).
