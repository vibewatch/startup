  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation-exposure-gap
    missingEvidence: Confirmation of whether any lawsuit, regulatory investigation, or enforcement action has been filed naming Granola directly, as opposed to comparable competitors such as Otter.ai.
    whyItMatters: The wiretap and biometric-privacy litigation risk documented in this chapter is currently comparable/category-wide; without confirming Granola's own litigation status, the true realized-versus-prospective balance of its legal risk cannot be assessed.
    diligencePath: Request Granola's litigation history and any regulatory correspondence directly from the company or its counsel ahead of any investment decision.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: minor
    topic: pentest-gap
    missingEvidence: Evidence of an independent penetration test or bug-bounty program at Granola beyond its public vulnerability-disclosure policy.
    whyItMatters: All three of Granola's disclosed 2025 security incidents were reported by external researchers rather than caught by internal testing, suggesting the company's proactive security-testing maturity cannot yet be verified from public sources.
    diligencePath: Request Granola's internal penetration-testing cadence, most recent report date, and any bug-bounty program details.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: minor
    topic: distribution-concentration
    missingEvidence: Confirmation of whether Granola has, or plans, a reseller, channel-partner, or systems-integrator distribution program.
    whyItMatters: A purely organic, self-serve growth motion is harder to forecast and accelerate deliberately than a documented multi-channel go-to-market strategy, and its absence concentrates growth risk in continued organic/viral referral.
    diligencePath: Ask Granola directly whether a partner or reseller program exists or is planned, and what share of new customers it is expected to drive.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: governance-staffing-gap
    missingEvidence: Confirmation of whether Granola has named a Chief Financial Officer, General Counsel, Head of Compliance, or Data Protection Officer beyond its two founders.
    whyItMatters: The regulatory and litigation-adjacent exposure documented throughout this chapter (wiretap consent, BIPA, HIPAA, EU AI Act) is normally owned by a named compliance or legal executive; the absence of one in public sources raises execution risk around how these exposures are being actively managed.
    diligencePath: Request Granola's current executive roster and confirm whether compliance, legal, or data-protection responsibilities are owned by a named individual or outsourced.
    relatedQuestionRefs:
    - QR037
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: Granola's actual cash balance, monthly burn rate, and runway in months.
    whyItMatters: Without these figures, it is impossible to independently assess how long the $125 million Series C is expected to last or whether Granola will need to raise again before demonstrating disclosed revenue -- a structural blocker created by its UK small-company audit exemption.
    diligencePath: Request cash balance, burn rate, and runway figures directly from Granola or from Series C data-room materials before finalizing any investment decision.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: certification-scope-gap
    missingEvidence: The precise scope, trust-services criteria, and auditor of Granola's SOC 2 Type II report.
    whyItMatters: A SOC 2 Type II report achieved in an unusually short observation window could reflect a narrowly scoped audit; without the underlying report, diligence cannot confirm which systems and controls it actually covers.
    diligencePath: Request a copy of (or auditor-verified summary of) Granola's SOC 2 Type II report, including its observation period and in-scope systems, under NDA.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR002
