    - Treat as a material adverse change to the trust/compliance narrative underpinning Enterprise sales
  - - Execution / governance
    - Departure of either named co-founder, or continued absence of a named CFO/General Counsel/DPO past the next funding round
    - Public departure announcement, or a second consecutive financing round with no named compliance or finance executive
    - Reassess key-person risk in deal terms (vesting acceleration, key-person insurance, board rights)
