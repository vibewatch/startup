companyProfile:
  summary: Granola is a London-headquartered, UK-incorporated AI meeting-notes company founded in March 2023 by Chris Pedregal and Sam Stephenson. Its bot-free notepad blends user-typed notes with real-time AI transcription (Deepgram, AssemblyAI) and OpenAI/Anthropic models into structured meeting recaps, and has expanded via Spaces, personal and enterprise APIs, MCP, and Briefs into a company-wide meeting context layer. Granola moved from a May 2024 public launch through a $20M Series A (Oct 2024), a $43M Series B at a $250M valuation (May 2025), to a $125M Series C led by Index Ventures at a $1.5B valuation (March 2026), with total disclosed funding of $192M. Public customer proof spans Vanta, Brex, Zapier, Vercel, Asana, Gusto, and other technology-sector accounts, but the company discloses no revenue, ARR, gross margin, headcount, or seat-count figures, and its UK small-company audit exemption means no near-term statutory filing will surface them.
  foundedDate: "2023-03-01"
  founders:
    - name: Chris Pedregal
      role: Co-Founder
      background: Previously founded Socratic, acquired by Google in 2018, then built Stack inside Google's Area 120 incubator before it was folded into Google Drive.
      claimRefs: [CO004, CO005, CO006]
    - name: Sam Stephenson
      role: Co-Founder
      background: Cofounder and product/design counterpart, publicly quoted in October 2024 Series A coverage.
      claimRefs: [CO004, CO007]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: Bot-free AI meeting notepad that captures microphone/system audio locally, transcribes via third-party ASR (Deepgram, AssemblyAI), and blends the transcript with the user's own notes using OpenAI/Anthropic models into structured, shareable meeting memory, extended by Spaces, personal/enterprise APIs, MCP, Recipes, and Briefs.
  customerFocus: Knowledge-worker professionals and technology/SaaS/AI-native teams, adopting individually before IT-led company-wide rollout (e.g., Vanta, Brex, Zapier, Vercel, Asana, Gusto, Thumbtack, Cursor).
  businessModel: Freemium SaaS subscription with a free tier plus a $14/user/month Business plan and a $35/user/month Enterprise plan; personal and enterprise APIs bundled into paid tiers; land-and-expand motion from individual users to company-wide licenses.
  stage: late-stage private (Series C, $1.5B valuation, March 2026)
  fundingStatus: $125M Series C led by Index Ventures on 2026-03-25 at a $1.5B valuation, with Kleiner Perkins and returning investors Lightspeed, Spark Capital, and NFDG participating; total disclosed funding reached $192M (TechCrunch, The SaaS News) after the Series C.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO012, CO021, CO023]
