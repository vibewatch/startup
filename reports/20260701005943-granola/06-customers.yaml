- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - Organic individual-to-enterprise land-and-expand (all four case studies)
    - 'Evidentiary concentration: the same four accounts supply nearly all quantified outcome proof'
    - If any flagship account's relationship lapses or its metrics are revised, most of this chapter's outcome evidence disappears
    - Request updated year-2 status and metrics directly from the Zapier, Vanta, Brex, and Vercel account teams
  - - Spaces/Folders cross-functional expansion
    - Segment concentration in tech/SaaS/AI-native buyers (Asana, Cursor, Lovable, Mistral AI, Decagon, Linear, Replit, Thumbtack, Gusto)
    - Growth may be capped once tech-sector penetration saturates, absent proven traction in regulated or non-tech verticals
    - Request the named-account list and segment mix directly from Granola's enterprise sales team
  - - Personal/Enterprise API and MCP agent-ecosystem lock-in
    - 'Vendor/platform concentration: expansion increasingly depends on external AI ecosystems (Claude, ChatGPT, Cursor) adopting MCP'
    - If MCP adoption stalls or a rival protocol wins, the API-based expansion thesis weakens
    - Track MCP client adoption and the enterprise MCP beta's graduation timeline
  - - Organic, word-of-mouth-led growth (no disclosed channel/reseller program)
    - 'Channel concentration: a single distribution motion with no documented partner, reseller, or systems-integrator network'
    - Limits the ability to accelerate enterprise expansion quickly relative to competitors with partner channels
    - Ask Granola directly whether a partner or reseller program exists or is planned
  - - Mid-market momentum per YipitData (25% month-over-month growth, near-zero churn)
    - 'Platform/competitive concentration risk: Microsoft Copilot and Google Gemini building native context aggregation into incumbent seats'
    - Could compress Granola's addressable expansion room even while current momentum looks strong
    - Monitor Microsoft's and Google's meeting-AI feature releases and their effect on YipitData's Granola displacement metric
  - - Vertical expansion beyond tech (finance, media, healthcare) implied by Granola's own marketing
    - 'Vertical concentration: current named proof is concentrated in non-regulated tech/SaaS; HIPAA and EU-hosting gaps (see product/technology chapter) block regulated or sovereignty-sensitive expansion'
    - Caps total addressable expansion until compliance gaps close
    - Request Granola's HIPAA BAA and EU-hosting roadmap timeline directly from enterprise sales
  notes: Concentration risks are analyst-synthesized from named-customer, channel, and competitive evidence gathered across this chapter; none is a company-disclosed risk factor.
