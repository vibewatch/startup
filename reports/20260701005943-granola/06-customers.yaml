callouts:
- calloutType: strength
  title: Independent transaction data shows a real 2026 adoption inflection, not just company claims
  body: YipitData's B2B spend panel -- drawn from real software transactions, not surveys or self-reported usage -- shows Granola's mid-market customer count growing 25% month-over-month in February 2026,
    with 3x spend growth over six months, near-zero measured churn, and an asymmetric switching pattern in which adopters drop rival tools far more often than the reverse. This is the strongest, most current
    adoption and retention evidence in this chapter, and it did not come from Granola itself.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU031
  - CU032
- calloutType: strength
  title: Four flagship case studies show a consistent, repeatable land-and-expand pattern across four distinct buyer personas
  body: Zapier (design/product), Vanta (customer success/compliance), Brex (IT/regulated fintech), and Vercel (sales engineering) each began with an individual pilot that leadership expanded into a 50-100%
    organization- or team-wide rollout, matching Granola's own stated land-and-expand go-to-market motion almost exactly.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU038
  - CU039
- calloutType: risk
  title: Customer evidence is concentrated in a handful of tech-sector accounts with investor ties
  body: Nearly all of Granola's quantified customer-outcome proof rests on four named accounts, all well-funded technology companies with ties to Granola's own investor network, and every other named logo
    in this chapter is also a technology or technology-adjacent company. No finance- or media-sector account has case-study-level detail anywhere reviewed, despite Granola's own marketing claiming those
    verticals.
  claimRefs:
  - CU041
  - CU044
  - CU029
- calloutType: risk
  title: A March 2026 product change visibly frustrated a segment of power users
  body: Encrypting the local notes database cut off third-party agent and automation workflows that power users had built on top of Granola, drawing a viral public complaint from a prominent a16z partner
    asking the community for alternatives. No source quantifies how many customers, if any, actually left as a result, but independent commentary describes months of quiet frustration behind the public
    flashpoint.
  claimRefs:
  - CU034
  - CU035
  - CU036
- calloutType: recommendation
  title: Request Granola's own NRR/GRR, seat count, and per-account renewal data directly
  body: Every quantified retention and adoption number in this chapter originates from a company case study, a self-selected review platform, or a third-party spend panel -- never from Granola's own retention
    disclosure. Diligence should request exact NRR, GRR, logo-churn, and renewal-rate figures, plus updated metrics for the four flagship accounts, before relying on any proxy in this chapter.
  claimRefs:
  - CU022
  - CU030
  - CU033
