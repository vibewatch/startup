figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How an individual Granola user's adoption typically evolves into a company-wide, agent-integrated enterprise deployment, based on the four published case studies and Granola's own product/expansion
    announcements.
  data:
    items:
    - id: individual-discovery
      label: 'Stage 1: Individual Organic Discovery'
      actor: Individual professional (recruiter, lawyer, consultant, salesperson)
      touchpoint: Free Basic-plan download after word-of-mouth referral or a Product Hunt / G2 review
      outcome: First bot-free meeting captured; no IT involvement
    - id: team-viral-spread
      label: 'Stage 2: Organic Team Spread'
      actor: Colleagues within the same function
      touchpoint: Shared notes and folders; teammates see summaries and adopt independently (per the Zapier and Brex case studies)
      outcome: Multiple individual users within one team or department
    - id: business-plan-upgrade
      label: 'Stage 3: Business-Plan Upgrade'
      actor: Team lead / department head
      touchpoint: $14-per-user-per-month Business plan for unlimited meeting history, CRM integrations, and shared folders
      outcome: Formal paid adoption at the team level
    - id: it-enterprise-rollout
      label: 'Stage 4: IT-Led Enterprise Rollout'
      actor: Head of IT / compliance leadership (e.g., Brex, Vanta)
      touchpoint: 'Enterprise plan: SSO/SCIM, admin dashboard, SOC 2 documentation, opt-out of model training'
      outcome: Company-wide licensing; 50-100% of the relevant teams adopt in named accounts
    - id: cross-functional-expansion
      label: 'Stage 5: Cross-Functional Expansion via Spaces'
      actor: Multiple departments (sales, product, customer success, recruiting)
      touchpoint: Shared Spaces/Folders queried across departments for competitive intel, customer feedback, and onboarding
      outcome: An organization-wide knowledge layer, not just individual notes
    - id: agent-ecosystem-lockin
      label: 'Stage 6: Agent / API Ecosystem Lock-In'
      actor: Developers and AI agents (Claude, ChatGPT, Cursor)
      touchpoint: Personal API, Enterprise Admin API, and Granola MCP
      outcome: Meeting context becomes infrastructure for external AI tools, raising switching cost
  approximationNotes: Stages are synthesized from the four published case studies, Granola's own Enterprise and Series B/C announcements, and its MCP documentation; no single official diagram depicts this
    journey, and not every account reaches every stage (e.g., Vercel's deployment remained team-wide, not company-wide).
