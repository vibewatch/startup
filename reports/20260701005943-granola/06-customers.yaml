company:
  name: Granola
chapter:
  number: 6
  title: Customers
  summary: 'Granola''s paying and free-tier customer base is overwhelmingly knowledge-worker professionals and technology-sector teams who adopt individually before an IT-led rollout formalizes company-wide
    licensing: four company-published case studies (Zapier, Vanta, Brex, Vercel) each report 52-100% organization-wide adoption after a single grassroots user, and additional named accounts (Daversa Partners,
    Asana, Gusto, Thumbtack, Cursor, Lovable, Decagon, Mistral AI, Intercom, Linear, Replit) corroborate a land-and-expand motion concentrated in tech, SaaS, and AI-native companies. Independent B2B transaction
    data from YipitData''s Signals panel shows a genuine 2026 inflection -- Granola''s observed mid-market customer count grew 25% month-over-month in February 2026 with 3x spend growth over six months,
    near-zero measured churn, and an asymmetric switching pattern in which adopters drop rival tools (Fathom, Fireflies.ai, Otter.ai) far more often than the reverse. Yet Granola itself discloses no NRR,
    GRR, renewal rate, seat count, contract value, or updated total customer count since a 5,000-weekly-user figure from its October 2024 Series A; its G2 rating (4.9/5, 19 reviews) diverges sharply from
    independent expert reviews (3.6-4.5/5), and a March 2026 local-database-encryption change publicly frustrated a segment of power users, drawing a viral investor complaint asking the community for alternatives.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Granola sells through three self-serve/enterprise plans that double as its buyer-segmentation ladder: a free Basic tier, a Business plan priced at $14 per user per month per Granola''s own sales
    guide, and an Enterprise plan (custom pricing, independently estimated around $35 per user per month) that adds SSO/SCIM, admin controls, and opt-out of model training (CU001). The company''s own Enterprise
    page states it is "trusted by teams in tech, finance, media, and more" (CU002), but the detailed, independently corroborated evidence in this chapter concentrates almost entirely in technology and technology-adjacent
    companies. G2 reviewers span Small-Business, Mid-Market, and Enterprise company sizes across Information Technology and Services, Financial Services, and clinical/healthcare-adjacent roles (CU003),
    and independent reviewers repeatedly single out recruiters, lawyers, consultants, VCs, sales engineers, and IT/customer-success leaders as Granola''s core user personas -- professionals whose meetings
    are frequent, high-stakes, and often confidentiality-sensitive (CU004).


    Granola''s four detailed, company-published case studies map cleanly onto distinct buyer/user functions: design/product/engineering (Zapier), customer-success leadership (Vanta), IT (Brex), and sales
    engineering/GTM (Vercel) (CU005). Beyond those four, executive search firm Daversa Partners'' president adopted Granola across 136 of its 150 employees specifically because bot-free, device-level capture
    felt less intrusive than visible-bot alternatives for confidential candidate and client conversations -- a vertical (executive search) with acute confidentiality needs that is otherwise unrepresented
    in the detailed evidence (CU006). Press and investor coverage additionally names Asana, Gusto, Thumbtack, Cursor, Lovable, Decagon, Mistral AI, Intercom, Linear, and Replit as customers, spanning work
    management, HR/payroll, marketplaces, developer tools, and AI-native startups (CU007) -- but every one of these ten logos is itself a technology or technology-adjacent company, reinforcing the sector
    concentration visible in the detailed accounts. No source reviewed discloses Granola''s per-customer revenue, seat count, contract value, or an official geographic breakdown of its customer base beyond
    its UK/US home markets, leaving revenue-band and geography as open diligence questions rather than answered segmentation dimensions (CU008).'
