- id: adoption-trajectory
  title: Adoption Trajectory
  body: 'Granola''s own disclosed adoption metrics are sparse and dated: the company reported 5,000 weekly users as of its October 2024 Series A (CU009), and independent analysis states plainly that Granola
    "has not disclosed its current user count" since that figure (CU010). The company''s careers page states only that it "transcribes millions of minutes of conversation" every day, with no exact figure
    or historical trend attached (CU011), and independent press reporting cites a company-stated 10% weekly user growth rate as of the March 2026 Series C, again without a disclosed base count against which
    that percentage applies (CU012).


    The most rigorous adoption evidence available comes not from the company but from YipitData''s Signals panel, which tracks real B2B software transactions across 900-plus mid-market companies. That panel
    shows Granola''s observed mid-market customer count grew 25% month-over-month in February 2026 (CU013), with gross new-customer additions up 9x from January to February 2026 and net-new customers in
    February reaching 4x the prior six-month average -- a step-change inflection rather than steady growth (CU014). Monetization is following adoption: observed mid-market spend reached approximately $6,000
    in February 2026, a 3x increase over the prior six months (CU015). Even so, YipitData notes that three named competitors -- Fireflies.ai, Otter.ai, and Fathom -- still maintain larger total mid-market
    customer bases than Granola (roughly 20-40% larger), though their growth is comparatively slowing while Granola''s accelerates (CU016). Headcount grew 49% over the same six-month window, consistent
    with a company scaling operations to match demand (CU017). Taken together, the strongest, most current adoption signal in this chapter is independent and transactional, not company-disclosed -- a distinction
    diligence should weight carefully.'
