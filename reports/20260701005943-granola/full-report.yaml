  - id: FV003
    title: Valuation and next-round outcome range
    type: range
    layout: standard
    summary: >-
      Low/base/high framing for Granola's next priced outcome given category-level down-round, valuation-inflation, and
      multiple-compression signals.
    data:
      items:
        - label: 'Bear: next round prices flat-to-down'
          low: 0.9
          mid: 1.3
          high: 1.5
          unit: USDbn
          displayValue: $0.9B-$1.5B
          tone: negative
          detail: >-
            Grounded in Carta's 11.4% Q1 2026 down-round rate and litigation precedent against a direct peer (CV023,
            CV042).
        - label: 'Base: next round holds-to-modestly-up'
          low: 1.5
          mid: 1.75
          high: 2
          unit: USDbn
          displayValue: $1.5B-$2.0B
          tone: neutral
          detail: >-
            Consistent with Carta's 12.5% YoY Series C valuation increase absent a disclosed financial base (CV022,
            CV025).
        - label: 'Bull: next round re-rates on confirmed growth'
          low: 2
          mid: 2.75
          high: 3.5
          unit: USDbn
          displayValue: $2.0B-$3.5B
          tone: positive
          detail: >-
            Requires disclosed ARR confirming the 250% growth signal persists; would still trail Notion's $11B
            adjacent-category ceiling (CV016, CV034).
        - label: 'Public-market reference point: Zoom P/S multiple applied'
          low: 25
          mid: 25.31
          high: 25.6
          unit: USDbn
          displayValue: ~$25.3B market cap (reference only, not a Granola forecast)
          tone: neutral
          detail: >-
            Zoom's actual mid-2026 market cap shown only as a mature, public, low-growth reference anchor, not a Granola
            projection (CV035).
    approximationNotes: >-
      Bear/base/bull rows are scenario framing tied to category benchmarks, not a discounted-cash-flow or ARR-multiple
      output, because Granola discloses no revenue base; the Zoom row is included only as a public-market scale anchor.
    claimRefs:
      - CV023
      - CV042
      - CV022
      - CV025
      - CV016
      - CV034
      - CV035
  - id: FV004
    title: Investment committee KPI scorecard
    type: kpi
    layout: standard
    summary: IC-ready scoring across market, proof, moat, economics, risk, valuation, and evidence quality.
    data:
      items:
        - label: Market momentum
          value: Positive
          tone: positive
          detail: Category-wide AI valuation premium and rising late-stage multiples per Carta (CV024, CV025).
        - label: Growth proof
          value: Unverified
          tone: warning
          detail: >-
            250% quarterly growth is third-party-reported (Bloomberg via SiliconANGLE), with no disclosed absolute base
            (CV011).
        - label: Competitive moat
          value: Weakening
          tone: warning
          detail: Bot-free capture no longer unique; Fathom and tl;dv match it; incumbents bundle AI notes for free (CV019).
        - label: Unit economics visibility
          value: None disclosed
          tone: negative
          detail: No revenue, gross margin, CAC, or NRR figure exists in any source reviewed (CV011, CV048).
        - label: Legal/regulatory risk
          value: Elevated
          tone: negative
          detail: Active wiretap/biometric litigation against the closest direct peer, Otter.ai (CV042, CV045).
        - label: Valuation support
          value: Stretched
          tone: warning
          detail: >-
            Sixfold re-rating in ~10 months without financial disclosure, against a compressing public 'Productivity
            Tools' comp set (CV008, CV026).
        - label: Evidence quality
          value: Medium
          tone: neutral
          detail: >-
            Funding history and comparables are well corroborated; the valuation-critical financial inputs remain
            entirely undisclosed (CV004, CV011).
