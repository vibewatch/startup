      - - Cap table and preference stack
        - Detail on liquidation-preference stacking across seed/Series A/B/C (CV013).
        - Preference overhang changes common/founder and later-investor downside protection and effective entry price.
        - Request a cap-table extract or confirmation-statement detail via the company or Companies House filings.
      - - Gross margin and unit economics
        - Cost of revenue, gross margin, CAC, and net-revenue-retention figures (CV048).
        - Determines whether Granola can sustain SaaS-typical 70%+ margins given LLM/transcription vendor dependency.
        - Request from the company under NDA, or monitor for the next investor-disclosed benchmark.
      - - Litigation exposure monitoring
        - Confirmation of whether any wiretap/CIPA/biometric complaint has been filed naming Granola (CV042, CV045).
        - Direct-peer litigation against Otter.ai shows this is an active, category-wide risk, not a hypothetical one.
        - Monitor court-filing trackers and legal-press coverage each quarter.
      - - Next-round trigger and runway
        - Disclosed runway, burn rate, or planned Series D timing (CV028).
        - Determines whether the $125M Series C buys 18 months or 4+ years of runway before the next repricing event.
        - Request runway/burn disclosure from the company or lead investor.
      - - Current user/customer count
        - >-
          Verified current seat or customer count beyond the 5,000-weekly-user figure disclosed at the Series A (CV031,
          CV030 provide competitor scale references).
        - Needed to sanity-check valuation-per-user against Fireflies (20M users) and Otter (35M+ users).
        - Request current MAU/paying-seat count from the company directly.
    notes: >-
      Ranked informally by potential to move the valuation verdict; diligence paths assume company or lead-investor
      cooperation, since none of these figures are publicly disclosed today.
    claimRefs:
      - CV011
      - CV013
      - CV048
