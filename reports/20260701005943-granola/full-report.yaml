      - number: '7.6'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Granola's primary disclosed mitigations against the risks catalogued in this chapter are its SOC 2 Type II
              certification, its Enterprise-tier default-off model training, and its DPA breach-notification commitment
              (CR053). None of these directly addresses the three regulatory categories with the least company-disclosed
              coverage identified in this chapter -- all-party wiretap consent, EU AI Act transparency obligations, and
              a HIPAA Business Associate Agreement -- leaving them without a stated company mitigation as of the run
              date (CR054). For each top risk category, this chapter defines a monitorable kill-criterion rather than
              relying on intuition: legal/regulatory risk would escalate on any litigation or enforcement action naming
              Granola directly, a bar already cleared against its closest bot-based competitor (CR055);
              financial/capital risk would escalate on a down round, a materially delayed Series D, or disclosed burn
              exceeding Series C proceeds -- an outcome two adverse commentators already flag as plausible given the
              unverified valuation jump (CR056); and partner/vendor risk would escalate on a documented price increase,
              outage, or policy change at a core AI/ASR vendor, or a demonstrated case of a named reference account
              substituting a bundled Teams/Zoom/Meet feature for Granola (CR057).


              Synthesizing the registers built in the preceding sections, this chapter's overall risk ranking places
              partner/vendor concentration and platform-bundling substitution, financial/capital-adequacy opacity, and
              legal/regulatory consent exposure ahead of operational/security and execution/governance risk, largely
              because the first three combine high severity with weak or absent company-disclosed mitigation (CR058).
              Every one of these top-five categories has an identified diligence path, but none has a company-disclosed
              quantitative threshold such as a stated burn-rate ceiling or litigation-cost reserve -- meaning ongoing
              monitoring depends on external indicators (litigation filings, financing announcements, vendor incident
              disclosures, and named-account churn) rather than company-reported metrics (CR059). The risk transmission
              map below traces how each risk category is expected to flow into customer retention, margin, financing,
              and ultimately the investment thesis.
