  - id: FV002
    title: Valuation sensitivity to an assumed ARR base
    type: bar
    layout: standard
    summary: >-
      Illustrative implied valuation at different assumed ARR levels across the 8x-20x Applied-AI multiple band cited by
      market analysts; Granola discloses no ARR, so these are scenario inputs, not a fitted model.
    data:
      items:
        - label: $20M ARR at 10x
          value: 200
          unit: USDm
          tone: neutral
