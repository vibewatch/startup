      - number: '5.4'
        title: Deployment, Integration, Reliability, Support, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Granola's public release history shows a near-monthly cadence of shipped features from its July 2024
              desktop launch onward: a $20M raise alongside the original notepad (November 2024), native iOS
              availability (May 2025), Windows availability paired with SOC 2 Type II completion (July 2025), Recipes
              (September 2025), Granola MCP (February 2026), a $125M Series C (March 2026), an agentic Chat rebuild
              (April 2026), and Briefs (May 2026) (CE028). Integration surface area grew alongside it: Slack posting
              (October 2024), Notion sharing (March 2025), and Zapier connecting Granola to 8,000+ apps alongside Attio
              and HubSpot (mid-to-late 2025), all documented in Granola's own changelog (CE029).


              Reliability visibility, however, is thin and largely third-party. An independent uptime-monitoring
              aggregator recorded four Granola incidents in the 90 days before the run date, with a median resolution
              time of about 2 hours 34 minutes, including an iOS transcription outage (June 25, 2026), a Granola Chat
              outage from a "broken deployment" (March 10, 2026), and -- notably -- a separate incident in which Claude
              users specifically could not connect to Granola MCP (March 9, 2026), the first direct evidence that the
              MCP integration layer has its own operational failure modes (CE030). No source reviewed discloses a
              Granola-published uptime SLA or a company-maintained public status page; the only incident visibility
              available comes from this unaffiliated third-party monitor (CE031). Two further roadmap gaps stand out on
              the deployment side: despite an Android-engineer role on the team roster, no Android app has shipped or
              been dated (CE032), and Granola's own MCP announcement explicitly flags "advanced access controls, usage
              monitoring and analytics, higher rate limits, and flexible pricing options" as still forthcoming rather
              than shipped Enterprise MCP capabilities (CE033). Platform rollout itself was sequential rather than
              simultaneous -- iOS in May 2025 (CE050) and Windows in July 2025 (CE051) -- and iOS distribution today
              depends entirely on Apple's App Store review and policy environment as the only identified public iOS
              channel (CE052).
