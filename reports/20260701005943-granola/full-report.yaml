      - number: '4.4'
        title: Public traction versus private-metric gaps
        blocks:
          - type: paragraph
            body: >-
              Granola's public traction proxies are qualitative and reference-customer-based rather than quantitative.
              Its careers page claims the product transcribes millions of minutes of conversation daily (CI018), and its
              Series C post together with Kleiner Perkins' writeup names Asana, Vanta, Gusto, Thumbtack, Cursor,
              Lovable, Decagon, and Mistral AI as customers, alongside dedicated ROI case studies from Brex, Vanta,
              Zapier, and Vercel (CI036). None of those case studies discloses a seat count, contract value, or
              renewal/expansion rate. Historically, one 2026 report states Granola had roughly 5,000 weekly users at the
              time of its October 2024 Series A but has not disclosed a current user count as of mid-2026 (CI032), while
              the same report notes Fireflies.ai has independently surpassed 16 million users and a $1 billion valuation
              -- a scale comparison Granola's own disclosures cannot match or refute (CI033).


              Even third-party data vendors cannot close the gap: Tracxn's public profile estimates 116 employees as of
              May 2026 (CI034) but masks Granola's revenue and per-round valuation-multiple fields behind a paid-data
              paywall, meaning a dedicated research platform does not surface Granola's revenue or valuation multiple
              for free either (CI035). TheNextWeb states directly that Granola has not disclosed retention metrics
              publicly, and no source reviewed in this chapter discloses a net revenue retention, logo retention, or
              churn figure (CI037). The result is a traction picture built entirely on logo quality and anecdotal
              time-savings rather than any measurable usage, revenue, or retention trend.
