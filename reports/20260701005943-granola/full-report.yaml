        - label: $40M ARR at 10x
          value: 400
          unit: USDm
          tone: neutral
          detail: Illustrative low-end multiple at higher assumed ARR.
        - label: $60M ARR at 15x
          value: 900
          unit: USDm
          tone: neutral
          detail: Mid-band Applied-AI multiple.
        - label: $80M ARR at 15x
          value: 1200
          unit: USDm
          tone: neutral
          detail: Mid-band multiple approaching the actual $1.5B mark.
        - label: $100M ARR at 15x
          value: 1500
          unit: USDm
          tone: warning
          detail: Matches the actual $1.5B Series C valuation if ARR were $100M (Otter's disclosed ARR level, CV031).
        - label: $100M ARR at 20x
          value: 2000
          unit: USDm
          tone: positive
          detail: High-end Applied-AI multiple at the same assumed ARR.
