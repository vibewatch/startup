        - >-
          A vendor-published 2026 market report frames transcription as commoditized at 95%+ accuracy industry-wide, and
          TechCrunch reports competitive value is shifting toward action-oriented workflows across several rivals
          simultaneously
        - medium
        - >-
          Track whether Granola's own action-oriented features (Briefs, Recipes, CRM push) show measurably faster
          adoption than Otter's, Fireflies', or Read AI's equivalent workflow features
      - - Granola can defend its SMB/founder-led segment against Gong-style upmarket competitors
        - >-
          Gong's cost structure only applies to large SDR organizations, but Fathom, Fireflies, and Otter all now ship
          coaching/analytics features that narrow this gap from below
        - medium
        - >-
          Assess whether Granola plans to add sales-coaching features of its own or intentionally cede that segment to
