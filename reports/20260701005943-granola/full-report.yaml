    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Stage
        blocks:
          - type: paragraph
            body: >-
              Granola is an AI meeting-notes startup built around a simple positioning statement: notes, actions, and
              memory without a meeting bot. The homepage, product pages, and investor writeups all describe the product
              as a human-in-the-loop notepad that combines what the user types with AI transcription and structuring
              rather than asking a bot to join the call and summarize everything autonomously. That design choice
              matters because it defines both product experience and market category: Granola wants to be closer to
              Apple Notes or Notion for conversations than to a visible Zoom copilot.


              As of the 2026-07-01 run date, the company is clearly in late-stage private startup territory. Official
              and independent March 2026 coverage place headquarters in London, note support for macOS, Windows, and
              iPhone, and frame the business as expanding from a prosumer note-taking utility into enterprise
              conversation infrastructure. By March 2026 Granola had reached a $1.5 billion valuation and was
              positioning Spaces, APIs, and connector surfaces as the operating system for company meeting context, not
              just a standalone transcription tool.
