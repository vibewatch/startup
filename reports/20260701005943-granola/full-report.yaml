      - number: '2.3'
        title: Buyer, User, and Payer Segmentation and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Granola's public customer case studies describe a consistent bottom-up adoption pattern across several
              distinct buyer segments rather than one uniform enterprise sale. At Brex, the Head of IT formalized
              company-wide access only after discovering organic, employee-led adoption already spanning sales,
              engineering, and support, and required SOC 2 Type 2 compliance, SSO, and SCIM before approving the
              rollout. At Vanta, the buyer was the VP of Customer Success, who needed a way to replace manual
              reconciliation of live notes and raw transcripts across daily 1:1s and cross-functional syncs. At Zapier,
              a Principal Designer adopted Granola to build a shared, searchable knowledge repository for a design team,
              while at Vercel a sales engineer needed faster, searchable call recaps to keep pace with prospect
              follow-ups. Granola's own use-case pages further segment Product Managers, Designers, and Product Leaders
              on one workflow (customer-research repositories feeding roadmap decisions) and Account Executives on
              another (CRM-synced call recaps into HubSpot, Affinity, Attio, or Zapier).


              A distinct discretion-sensitive segment also appears in the evidence: Granola's own blog on second-brain
              workflows highlights venture-capital partners using captured meeting context to accelerate
              investment-committee memo writing, and its hybrid-teams guide cites executive search firm Daversa
              Partners, which adopted bot-free capture across 136 of its 150 employees specifically because a visible
              bot participant was considered intrusive in confidential CEO searches. Company guidance itself draws a
              size-based segmentation line in sales: founders and SMB teams under 15 reps are pointed toward a
              lightweight AI notepad priced at $14 per user per month on the Business plan, while teams with 30-plus
              reps and a dedicated sales-enablement manager are pointed toward Gong-style conversation intelligence
              instead. Across these segments, the adoption path is remarkably consistent: an individual tries the
              bot-free capture model, usage spreads informally across a team, IT or security review introduces
              compliance requirements, and only then does a formal, budgeted enterprise rollout follow — after which
              some accounts expand further into APIs, Spaces, and agent integrations.
