      - number: '4.5'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Granola's Company Overview chapter documents its full funding chronology; this chapter restates only the
              facts needed to assess forward capital adequacy. The company announced a $125 million Series C on
              2026-03-25 led by Index Ventures, with Kleiner Perkins and returning investors Lightspeed, Spark, and NFDG
              participating, at a $1.5 billion post-money valuation (CI038). TechCrunch and The SaaS News both put total
              funding at $192 million after the round, while BusinessCloud instead reported roughly $188 million -- a
              small but real cross-publisher discrepancy on Granola's own cumulative total (CI040). Use of funds is only
              loosely specified: StartupRise's coverage offers just a generic "scale its product and support continued
              growth" line (CI041), while Granola's own Series C post frames the raise around shipping Spaces, APIs, an
              updated MCP server, and admin usage visibility rather than a numeric budget split (CI042); Bloomberg
              separately reported Granola plans to keep hiring, consistent with open roles on its careers page (CI043).


              No source discloses cash on hand, monthly burn, or runway (CI044), and as a UK private company filing
              exempt small-company accounts, Granola has no near-term legal obligation to publish any of them. The
              Companies House filing history reviewed lists confirmation statements, accounts, PSC, and officer filings
              but no registered secured-debt charge, consistent with an equity-only capital structure to date, though
              this reflects the filing-history summary rather than a dedicated charges-register pull (CI045). Neither
              Granola nor its investors state a public next-round trigger; Index Ventures' and Kleiner Perkins' posts
              instead frame the round around a multi-year context-layer build-out (CI046). That framing has not stopped
              public skepticism: TheNextWeb notes the valuation jumped sixfold in ten months without disclosed revenue,
              users, or retention (CI047), and a lower-reputation outlet, BritishWire, amplified dot-com-bubble
              comparisons questioning whether Granola's eventual revenue can justify a ten-figure valuation (CI048).
