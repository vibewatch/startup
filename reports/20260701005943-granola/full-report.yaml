companyProfile:
  summary: >-
    Granola is a London-headquartered, UK-incorporated AI meeting-notes company founded in March 2023 by Chris Pedregal
    and Sam Stephenson. Its bot-free notepad blends user-typed notes with real-time AI transcription (Deepgram,
    AssemblyAI) and OpenAI/Anthropic models into structured meeting recaps, and has expanded via Spaces, personal and
    enterprise APIs, MCP, and Briefs into a company-wide meeting context layer. Granola moved from a May 2024 public
    launch through a $20M Series A (Oct 2024), a $43M Series B at a $250M valuation (May 2025), to a $125M Series C led
    by Index Ventures at a $1.5B valuation (March 2026), with total disclosed funding of $192M. Public customer proof
    spans Vanta, Brex, Zapier, Vercel, Asana, Gusto, and other technology-sector accounts, but the company discloses no
    revenue, ARR, gross margin, headcount, or seat-count figures, and its UK small-company audit exemption means no
    near-term statutory filing will surface them.
