      - number: '6.5'
        title: Expansion and Concentration
        blocks:
          - type: paragraph
            body: >-
              Granola's own Enterprise marketing page frames its go-to-market motion explicitly as land-and-expand: "it
              starts with one person who loves Granola. It spreads because it makes every individual better at their
              job" (CU038). All four detailed case studies confirm this pattern in practice -- each began as an
              individual or small-team pilot that leadership later expanded into a company-wide Enterprise-plan rollout
              (CU039). Beyond per-seat growth, Granola has built deliberate expansion products: Spaces/Team Folders for
              cross-functional knowledge sharing, a Personal API, an Enterprise Admin API, and Granola MCP for
              third-party AI-agent integration, all designed to deepen an account's dependence on Granola as an
              organizational memory layer rather than an individual note-taking tool (CU040).


              Several concentration risks temper this expansion story. First, nearly all of Granola's quantified
              customer-outcome proof rests on just four named accounts, each a well-funded technology company with
              investor-network ties to Granola's own backers -- an evidentiary concentration risk distinct from, but
              related to, revenue concentration: if any flagship account's metrics were revised or the relationship
              lapsed, most of this chapter's outcome evidence would disappear (CU041). Second, independent reporting
              states Granola's growth has happened largely through word of mouth, with no disclosed reseller,
              channel-partner, or systems-integrator distribution documented in any source reviewed -- a single-channel
              dependency relative to competitors that may run multi-channel go-to-market motions (CU042). Third,
              independent analysis warns that Microsoft Copilot and Google Gemini are building the same
              conversational-context-aggregation capability natively into Teams and Workspace environments where most
              enterprise employees already have seats -- a platform-level concentration risk that could compress
              Granola's expansion runway even while YipitData's current momentum looks strong (CU043). Finally,
              Granola's own enterprise page claims it is trusted by teams in "tech, finance, media, and more," but every
              independently detailed named account in this chapter is a technology or technology-adjacent company; no
              finance- or media-sector account has case-study-level detail in any source reviewed, and known compliance
              gaps (no HIPAA BAA, no EU-hosted deployment, as established in the product/technology chapter) plausibly
              help explain why regulated-vertical expansion remains undemonstrated here (CU044).
            claimRefs:
              - CU038
              - CU039
              - CU040
              - CU041
              - CU042
              - CU043
              - CU044
