      Chain from disclosed scale/growth signals through unresolved proof gaps and risk transmission to the final
      recommendation.
    data:
      nodes:
        - id: n1
          label: Category momentum
          detail: Bloomberg-reported 250% quarterly growth; Brex-style land-and-expand; named enterprise roster (CV016).
          tone: positive
        - id: n2
          label: Unverified financial base
          detail: No revenue, ARR, gross margin, or burn disclosed by company, investors, or any data provider (CV011).
          tone: warning
        - id: n3
          label: Category-wide AI valuation premium
          detail: 'Carta: AI Series A median $300M vs $55M non-AI; Series C valuations up 12.5% YoY (CV024, CV025).'
          tone: neutral
        - id: n4
          label: Compressing public comps in adjacent category
          detail: 'Finro: public ''Productivity Tools'' multiples compressed in Q1 2026 even as private marks rose (CV026).'
          tone: warning
        - id: n5
          label: Transmissible legal/regulatory risk
          detail: Otter.ai wiretap/biometric class action; legal commentary treats the category as exposed (CV042, CV045).
          tone: negative
        - id: n6
          label: 'Recommendation: research-more'
          detail: Medium confidence, high risk rating, stretched valuation stance (CV049).
          tone: warning
      edges:
        - source: n1
          target: n6
          label: supports upside case
        - source: n2
          target: n6
          label: blocks independent pricing
        - source: n3
          target: n6
          label: contextualizes the price as within category norms
        - source: n4
          target: n6
          label: flags category-level repricing risk
        - source: n5
          target: n6
          label: adds downside-tail risk
