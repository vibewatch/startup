      - number: '6.4'
        title: Retention and Durability
        blocks:
          - type: paragraph
            body: >-
              Granola discloses no Net Revenue Retention, Gross Revenue Retention, logo-churn rate, or average contract
              renewal rate in any source reviewed (CU030). In the absence of company disclosure, the best available
              retention signal is again independent and transactional: YipitData's B2B spend-panel analysis found
              near-zero churn among Granola's observed mid-market customers between roughly August 2025 and February
              2026 (CU031), alongside an asymmetric switching pattern in which customers who adopt Granola frequently
              drop competing tools -- Fathom, Fireflies.ai, Otter.ai -- while the reverse is rare in the observed data,
              a pattern YipitData interprets as evidence of active displacement rather than mere trial usage (CU032).
              That said, "near-zero churn" is a qualitative descriptor from a single independent panel, not an exact
              percentage Granola or YipitData has published, and it covers only the mid-market segment of YipitData's
              tracked accounts.


              Satisfaction evidence tells a more divided story than either the case studies or the churn data alone
              suggest. Granola's G2 rating of 4.9/5 from 19 reviews sits well above the 3.6/5 and 4.5/5 scores from two
              independent expert reviewers testing the product against a standardized rubric, indicating that
              self-selected review-platform ratings and hands-on expert assessments do not agree on how satisfied
              Granola's customers actually are (CU033). Retention risk also has a documented flashpoint: a March 2026
              change encrypting Granola's local notes database triggered public criticism from a prominent a16z partner
              in a tweet viewed roughly 327,000 times, liked 630 times, bookmarked 577 times, and drawing 177 replies,
              in which the poster explicitly asked the community for alternative-product recommendations (CU034).
              Independent commentary frames the backlash as surfacing "a problem that had been quietly frustrating
              Granola users for months," tied to the loss of local file and API access that had underpinned personal
              automation and AI-agent workflows built on top of Granola (CU035), and TechCrunch reporting confirms the
              backlash extended beyond the a16z partner to other users, with Granola's co-founder responding by
              promising new personal and enterprise APIs to restore programmatic data access (CU036). No source
              quantifies how many customers, if any, actually left Granola over this episode -- the case-study adoption
              percentages (52%, 69%, over 50%, 100%) measure organization-wide usage depth at a point in time, not
              renewal or multi-period retention, and cannot answer that question either (CU037).
