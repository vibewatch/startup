      - number: '5.3'
        title: Technology and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Granola's desktop client is an Electron application packaged for macOS and Windows -- confirmed both by
              Granola's own engineering blog describing the difficulty of customizing the app's dock/taskbar icon, and
              independently by security research firm Tenable, which unpacked the macOS .asar archive to inspect the
              client's JavaScript (CE016). The core AI pipeline is entirely vendor-dependent: transcription runs on
              third-party ASR providers Deepgram and AssemblyAI, and note-enhancement, chat, and summarization run on
              third-party OpenAI and Anthropic LLM APIs, a company-stated architecture corroborated by Tenable's
              discovery of AssemblyAI references and a live API key inside the client (CE017). That same Tenable
              research found a concrete flaw: an unauthenticated api.granola.ai endpoint ("get-feature-flags") returned
              a live AssemblyAI key that could be used to pull meeting transcript IDs and content directly from
              AssemblyAI's own API (CE018), which Granola's own postmortem later confirmed affected roughly 300-333 iOS
              TestFlight beta testers between November 2024 and March 2025 with no evidence of exploitation beyond the
              researcher's own testing (CE019).


              On-device, Granola stores meeting metadata, transcripts, and AI summaries in a local application cache
              file (cache-v3.json) with a nested "double-JSON" structure that an independent open-source Python project
              reverse-engineered entirely offline, without calling Granola's own servers (CE020); the same project
              documents an alternative, undocumented path of extracting session tokens from a local supabase.json
              configuration file to call Granola's cloud API directly, which its maintainer chose not to implement for
              privacy and reliability reasons (CE021). In March 2026, Granola encrypted that local database, which a
              prominent a16z partner publicly criticized (in a tweet viewed roughly 327,000 times) for cutting off
              third-party agents that previously read the plaintext cache file directly (CE022); Granola's co-founder
              pointed to Granola MCP as the replacement path, but the critic countered that MCP requires MCP-specific
              client support rather than open file or API access, leaving the underlying complaint unresolved (CE023).
              Granola's own engineering blog frames a related tradeoff behind its April 2026 agentic Chat rebuild:
              reading full transcripts is roughly 10x more token-expensive than reading condensed notes, forcing an
              explicit depth-versus-cost choice for cross-meeting agent queries (CE024). Granola MCP itself, launched
              February 4, 2026, implements the open Model Context Protocol so tools like Claude, ChatGPT, Cursor, and
              Claude Code can query a user's notes as context, though enterprise MCP access remains an early-access beta
              that is off by default (CE025). Stored data -- transcripts, notes, AI summaries -- lives in an AWS-hosted,
              US-region Virtual Private Cloud, encrypted at rest and in transit and backed up daily, while raw audio is
              never stored at all (CE026); authentication runs through Google Workspace or Microsoft OAuth tied to the
              user's calendar (CE027).
