      - number: '3.2'
        title: 'Profile by competitor class: direct peers, bundled incumbents, and the adjacent conversation-intelligence tier'
        blocks:
          - type: paragraph
            body: >-
              Among direct standalone peers, Fathom's 2026 pricing page lists a free tier plus Team ($19/$15) and
              Business ($34/$25) per-user monthly/annual tiers with MCP and Claude/ChatGPT integrations (CP007, CP008).
              Fireflies.ai claims usage across more than 1 million companies and publishes SOC 2 Type II, GDPR, and
              HIPAA badges directly on its homepage alongside a "zero data retention" AI-training policy (CP009), with
              Pro, Business, and Enterprise tiers spanning roughly $10-$39 per seat per month (CP010). Otter.ai is the
              scale leader among reviewed peers: its April 2026 relaunch claims more than 35 million users, over 1
              billion meetings processed, and use by 86% of the Fortune 500 (CP011), alongside a new "Conversational
              Knowledge Engine" with an MCP server/client and an estimated $100 billion addressable opportunity (CP012)
              -- a strategy that mirrors Granola's own Spaces/API/ MCP expansion almost feature-for-feature. tl;dv
              reports more than 2 million users and a 4.7-out-of-5 rating (CP016), while Read AI pairs a "digital twin"
              assistant called Ada with official Zoom "Essential App" partner status (CP019).


              The bundled-incumbent and adjacent classes look different again. Microsoft's own support pages confirm
              intelligent Teams recap requires either a Teams Premium add-on license or a Microsoft 365 Copilot license
              (CP023), and Microsoft prices Teams Premium at $10.00 per user per month -- undercutting every standalone
              vendor's list price reviewed in this chapter (CP024). Google's "Take notes for me" and Zoom's AI Companion
              are both included in existing paid subscriptions at no separate line-item price (CP025, CP026), with Zoom
              reporting AI Companion Monthly Active Users more than tripled year over year in Q4 FY26 (CP026). Gong, by
              contrast, claims more than 5,000 customers on a Foundations plan independent research estimates at roughly
              $1,600 per user per year plus a mandatory $5,000-$50,000 annual platform fee (CP021, CP022) -- an order of
              magnitude above any standalone notepad and priced only for large SDR organizations, which is exactly the
              buyer Granola's own sales guide says does not need an AI notepad instead (CP034).
