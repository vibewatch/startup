      - number: '4.3'
        title: Cost structure and margin drivers
        blocks:
          - type: paragraph
            body: >-
              Granola's own security page is the single most important cost-structure disclosure in this chapter: it
              names Deepgram and AssemblyAI as third-party transcription providers and OpenAI and Anthropic as
              third-party AI providers used to transcribe and summarize meetings (CI022). Because both inputs are
              licensed rather than built on owned infrastructure, Granola's cost of revenue is likely usage-linked --
              scaling with meeting volume and note length -- rather than a mostly fixed hosting cost typical of simpler
              SaaS products (CI023). On top of that, Granola requires enterprise buyers to adopt SSO/SAML, SCIM
              provisioning, an admin dashboard, and encryption, and states it holds SOC 2 Type II certification (CI026),
              all representing ongoing security-engineering investment layered on the core transcription/inference cost
              base. Its March 2026 decision to encrypt its local notes database, criticized publicly by an a16z partner
              for breaking third-party agent workflows, added further unquantified engineering and trust-remediation
              cost (CI031).


              No source discloses Granola's own gross margin, cost of revenue, or opex breakdown; TheNextWeb's Series C
              coverage states plainly that Granola has not disclosed revenue figures, user counts, or retention metrics
              publicly (CI027). External benchmarks put median SaaS subscription gross margin at roughly 76%
              (top-quartile 84%+) but explicitly flag that products with heavy compute or AI-inference costs often fall
              below 70% (CI024) -- a pattern squarely relevant to an AI-transcription product. Zoom's FY2026 10-K
              reports gross margin improved to 77.0% from 75.8% (CI025), useful only as a mature public-company
              collaboration-software comparison, not a Granola data point. Structurally, Companies House confirms
              Granola Labs Ltd filed "total exemption full accounts" for FY2024 and FY2025, a UK small-company exemption
              that removes any near-term statutory obligation to publish turnover or profit (CI028), which is why this
              opacity should be read as a structural filing status rather than company evasiveness.
            claimRefs:
              - CI022
