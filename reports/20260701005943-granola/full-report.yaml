  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: >-
          Landscape: direct peers, bundled incumbents, adjacent conversation intelligence, hardware entrants, and
          status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Granola's own "AI Meeting Assistant - Without the Bot" page frames the whole competitive category around a
              single axis: whether a rival tool joins a call as a visible bot or captures audio locally without one
              (CP001), and claims Granola is the only listed option that keeps notes private by default while working
              without a visible bot (CP002). That framing was accurate when Granola launched, but it is no longer a
              clean differentiator in 2026. tl;dv now advertises a "NO BOT REQUIRED" option to more than 2 million users
              (CP003), and Fathom's own 2026 pricing page offers a "Choice of bot-free (in beta) or bot capture" across
              its individual tiers (CP004). Otter.ai, the largest standalone competitor by claimed user count, still
              defaults to a calendar-connected bot that auto-joins Zoom, Microsoft Teams, or Google Meet (CP005), so the
              bot-free/bot-based line increasingly separates products by choice rather than by category.


              Beyond direct software peers, Granola faces at least four other classes of alternative. Bundled incumbents
              -- Microsoft Teams/Copilot, Google Workspace/Gemini, and Zoom AI Companion -- ship a comparable notetaking
              feature inside subscriptions most buyers already pay for. Gong sits adjacent as a much higher-ACV
              conversation-intelligence platform built for large sales organizations rather than lightweight notetaking
              (CP021). TechCrunch's March 2026 hardware roundup names Granola directly alongside Read AI, Fireflies, and
              Fathom as digital competitors that a growing set of wearable and pocket AI notetaking devices can
              substitute for in-person capture (CP006, CP028). Finally, some privacy-sensitive users respond to any
              vendor's hosted note database -- including Granola's own -- by reverting to local markdown files or
              generic note apps, keeping "no dedicated tool" a persistent status-quo substitute (CP029). Taken together,
              this chapter treats the buyer's real choice set as five structurally different classes: direct
              bot-free/bot-optional peers, bundled incumbents, an adjacent higher-ACV category, likely hardware
              entrants, and an internal-build/status-quo option (CP048).
