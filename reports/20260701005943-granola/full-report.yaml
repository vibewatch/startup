      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Crunchbase's 2026 IPO-candidate methodology relies on disclosed funding, growth signals, investor mix, and
              market timing; its highlighted candidates, such as Databricks ($4.8 billion revenue run-rate, 55%+
              year-over-year growth, 140%+ net retention) and Canva ($3.3 billion annualized revenue, 240 million
              monthly users), show the scale and disclosure profile associated with near-term IPO readiness. Granola
              discloses none of the metrics that framework depends on, so its public-listing readiness cannot be
              assessed on the same basis, and no source establishes a specific next-financing trigger or timeline.
              Closing that gap is the single highest-value diligence action: a disclosed ARR or revenue figure would let
              this analysis compute an actual multiple against the $1.5 billion price rather than reason from category
              benchmarks alone. Beyond revenue disclosure, the highest-value remaining diligence asks are cap-table and
              preference-stack detail (to understand downside protection embedded across four rounds), gross-margin and
              unit-economics visibility (given dependency on third-party LLM-inference and transcription vendors),
              ongoing monitoring of wiretap/biometric litigation exposure given active precedent against the closest
              direct peer, clarity on runway and next-round timing, and a verified current user or customer count to
              sanity-check valuation-per-user against Fireflies' 20 million and Otter's 35 million-plus disclosed user
              bases.
            claimRefs:
              - CV039
              - CV040
              - CV011
              - CV013
              - CV048
              - CV042
              - CV028
              - CV030
              - CV031
          - type: table
