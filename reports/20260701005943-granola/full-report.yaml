      - number: '3.4'
        title: Switching cost, lock-in, multi-homing, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching cost and lock-in cut in more than one direction for Granola. Its March 2026 decision to encrypt
              its local notes database was publicly criticized by a prominent investor and covered by an independent
              blog arguing the change leaves the app with "zero value" for users who wanted local-first portability
              (CP037) -- a lock-in risk that sits awkwardly next to Granola's own "private by default" marketing claim
              (CP044), which independent 2026 reporting directly contradicts by finding Granola shares notes with anyone
              holding a link and trains on transcripts by default unless a user opts out (CP045). That same reporting
              extends the criticism to the broader category, noting Otter.ai, Fireflies.ai, and Fellow share a similar
              pattern of permissive default settings (CP046), and an independent enterprise-readiness review separately
              scored Granola 3 out of 10 for hosting/ data-residency, a gap Fireflies and Fathom partially close with
              dedicated storage and custom retention controls that Granola's own reviewed pages do not yet match
              (CP047). On multi-homing, Fathom, Fireflies, and Otter each publish native integrations into CRM,
              project-management, and automation tools that lower the cost of moving structured meeting data out of any
              single vendor (CP038), and Otter's own MCP client/server design explicitly mirrors Granola's MCP strategy,
              reducing "agent connectivity" as a standalone moat (CP039).


              On durability, a 2026 market report published by a competing AI-meeting-assistant vendor states
              transcription accuracy has converged industry-wide above 95% on clean audio and frames the market as
              stratified into platform-bundled, standalone, and vertical-specialist tiers, with Zoom AI Companion and
              Microsoft Teams Premium already leading by raw user count and Fathom holding the top reported G2 rating
              among standalone peers (CP041, CP042). TechCrunch separately observed that competitive value is shifting
              from transcription itself toward turning notes into actions, a shift it says Read AI, Fireflies, and Quill
              are pursuing alongside Granola (CP043). None of this is fatal to Granola's own moat, but it does mean the
              moat rests on continued execution speed across agent features, trust posture, and distribution
              simultaneously, rather than on any single durable technical advantage (CP048).
