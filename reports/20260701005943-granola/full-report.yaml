      - number: '5.2'
        title: Workflow and Use-Case Proof
        blocks:
          - type: paragraph
            body: >-
              Granola's own published customer case studies give the clearest picture of how the product is actually
              used inside organizations, spanning four distinct buyer/user contexts. Zapier's Principal Designer adopted
              Granola for a design/product/engineering organization after other AI transcription tools felt invasive,
              and the company-published case study reports 830+ hours saved per month and 52% organization-wide adoption
              (CE009). Vanta's VP of Customer Success adopted Granola for internal 1:1s, standups, and cross-functional
              syncs specifically because SOC 2 Type II certification, encryption, and notice-and-consent recording
              controls mattered for a security-and-compliance company, reporting 69% organization-wide adoption and a
              61% increase in meeting visibility (CE010). Brex's Head of IT rolled Granola out company-wide after
              employees had already adopted it organically, citing SSO/SCIM delivery and a no-public-model-training
              commitment inside a regulated fintech, with the case study reporting over 50% adoption across knowledge
              workers within six months and 427 hours saved per week (CE011). Vercel's sales-engineering team replaced a
              slower transcription tool with Granola and now uses its "chat with the transcript" feature to retrieve
              specific technical objections raised by prospects, reporting 100% GTM team adoption, 11 hours saved weekly
              per user, and a 25% GTM productivity increase (CE012).


              Beyond these four flagship accounts, Granola's own reporting names executive search firm Daversa Partners
              as deploying Granola across 136 of its 150 employees specifically because bot-free, device-level capture
              felt less intrusive than visible-bot tools for confidential candidate and client conversations (CE013),
              and an independent Product Hunt community thread cites in-person, multilingual conversation capture --
              translating a Japanese conversation into English notes, for example -- as a distinguishing real-world use
              case for the mobile app (CE014). None of the four flagship case studies, however, discloses a seat count,
              contract value, renewal rate, or churn figure; every quantified benefit is limited to adoption percentages
              and hours-saved estimates rather than revenue-linked proof (CE015), which is the central limitation of
              workflow evidence in this chapter.
