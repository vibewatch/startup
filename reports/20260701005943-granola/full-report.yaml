      - number: '1.4'
        title: Milestones, Controls, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving quickly from launch into platform expansion. Granola launched
              publicly in May 2024, raised its Series A in October 2024, launched the collaborative Granola 2.0
              workspace in May 2025, shipped Recipes for Granola Chat in September 2025, exposed meeting context through
              Granola MCP in February 2026, and then used the March 2026 Series C to push further into Spaces, folders,
              and APIs. In May 2026 it added Briefs so users could enter meetings with context about attendees and prior
              conversations already assembled.


              The trust and controls picture is mixed. On the positive side, Granola’s privacy policy says third parties
              such as OpenAI and Anthropic cannot train on customer personal data, while its DPA explicitly covers GDPR,
              UK GDPR, Swiss data protection, and U.S. state privacy laws. On the negative side, the same privacy policy
              allows training on de-identified data unless users opt out, and a March 2026 user backlash followed
              Granola’s decision to encrypt its local database and break early local-agent workflows. That episode does
              not negate product traction, but it does show that platform-control decisions can create adoption friction
              precisely among technical power users who helped seed the brand early.
