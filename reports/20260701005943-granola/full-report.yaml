      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Bot-free architecture is real and independently corroborated
            body: >-
              Granola's local-capture, zero-audio-retention design is not just marketing: an independent security
              researcher's teardown of the Mac client and a separate open-source project's reverse engineering of the
              local cache both confirm the architecture Granola describes, and the company credits that design for a
              three-month SOC 2 Type II certification versus a typical 12-18 months.
            calloutType: strength
            claimRefs:
              - CE016
              - CE017
              - CE034
          - type: callout
            title: Three disclosed postmortems in one year, two from the same root cause
            body: >-
              Granola has publicly disclosed an AssemblyAI API key exposure and two separate Google Workspace
              account-state gaps within about a year, all found by outside parties rather than proactively. That pattern
              -- particularly two distinct Google Workspace access-control failures -- raises the question of whether
              additional undisclosed issues exist in adjacent authentication flows.
            calloutType: risk
            claimRefs:
              - CE018
              - CE019
              - CE044
              - CE045
          - type: callout
            title: '"Private by default" is contested, and HIPAA/EU hosting gaps remain open'
            body: >-
              Independent reporting states notes are shareable via link by default unless a user changes the setting,
              directly at odds with Granola's own "private by default" messaging. Separately, Granola discloses it holds
              no HIPAA Business Associate Agreement and offers no EU-hosted or on-premise deployment option, closing off
              two regulated or sovereignty-sensitive buyer segments until those gaps close.
            calloutType: risk
            claimRefs:
              - CE038
              - CE041
          - type: callout
            title: The local-database-encryption controversy is a genuine security-vs-openness tradeoff, not a false alarm
            body: >-
              Encrypting the local notes database in March 2026 was a real security hardening step, but it also cut off
              third-party agents that previously read the plaintext cache file, and Granola's proposed MCP substitute
              requires MCP-specific client support rather than open file or API access. Both the company and its critics
              have a defensible position; the underlying data-portability question remains unresolved.
            calloutType: insight
            claimRefs:
              - CE022
              - CE023
              - CE047
          - type: callout
            title: Verify incident completeness and accuracy claims directly with the company
            body: >-
              Because no independent transcription-accuracy benchmark and no confirmation of complete incident-history
              disclosure exist in any source reviewed, diligence should request (1) Granola's internal security-incident
              log beyond the three public postmortems, and (2) a third-party, apples-to-apples accuracy benchmark before
              relying on either metric.
            calloutType: recommendation
            claimRefs:
              - CE048
              - CE043
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Granola sells through three self-serve/enterprise plans that double as its buyer-segmentation ladder: a
              free Basic tier, a Business plan priced at $14 per user per month per Granola's own sales guide, and an
              Enterprise plan (custom pricing, independently estimated around $35 per user per month) that adds
              SSO/SCIM, admin controls, and opt-out of model training (CU001). The company's own Enterprise page states
              it is "trusted by teams in tech, finance, media, and more" (CU002), but the detailed, independently
              corroborated evidence in this chapter concentrates almost entirely in technology and technology-adjacent
              companies. G2 reviewers span Small-Business, Mid-Market, and Enterprise company sizes across Information
              Technology and Services, Financial Services, and clinical/healthcare-adjacent roles (CU003), and
              independent reviewers repeatedly single out recruiters, lawyers, consultants, VCs, sales engineers, and
              IT/customer-success leaders as Granola's core user personas -- professionals whose meetings are frequent,
              high-stakes, and often confidentiality-sensitive (CU004).


              Granola's four detailed, company-published case studies map cleanly onto distinct buyer/user functions:
              design/product/engineering (Zapier), customer-success leadership (Vanta), IT (Brex), and sales
              engineering/GTM (Vercel) (CU005). Beyond those four, executive search firm Daversa Partners' president
              adopted Granola across 136 of its 150 employees specifically because bot-free, device-level capture felt
              less intrusive than visible-bot alternatives for confidential candidate and client conversations -- a
              vertical (executive search) with acute confidentiality needs that is otherwise unrepresented in the
              detailed evidence (CU006). Press and investor coverage additionally names Asana, Gusto, Thumbtack, Cursor,
              Lovable, Decagon, Mistral AI, Intercom, Linear, and Replit as customers, spanning work management,
              HR/payroll, marketplaces, developer tools, and AI-native startups (CU007) -- but every one of these ten
              logos is itself a technology or technology-adjacent company, reinforcing the sector concentration visible
              in the detailed accounts. No source reviewed discloses Granola's per-customer revenue, seat count,
              contract value, or an official geographic breakdown of its customer base beyond its UK/US home markets,
              leaving revenue-band and geography as open diligence questions rather than answered segmentation
              dimensions (CU008).
