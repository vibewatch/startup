      - number: '6.3'
        title: Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Granola's strongest customer evidence is four detailed, company-published case studies. Zapier's Principal
              Designer's individual trial spread virally through the design/product/engineering organization, and the
              published case study reports 830+ hours saved per month and 52% organization-wide adoption (CU018).
              Vanta's VP of Customer Success adopted Granola for internal 1:1s, standups, and cross-functional syncs
              specifically because SOC 2 Type II certification and consent-based recording mattered for a
              security-and-compliance company, with the case study reporting 260+ hours saved annually per user, 69%
              organization-wide adoption, and a 61% increase in meeting visibility (CU019). Brex's Head of IT formalized
              a company-wide rollout after employees had already adopted Granola organically, with the case study
              reporting over 50% adoption across knowledge workers within six months and 427 hours saved per week
              (CU020). Vercel's sales-engineering team replaced a slower transcription tool with Granola and now uses
              its "chat with the transcript" feature during discovery calls, reporting 100% GTM-team adoption, 11 hours
              saved weekly per user, and a 25% GTM productivity increase (CU021). Critically, none of these four case
              studies discloses a seat count, contract value, renewal rate, or churn figure -- every quantified benefit
              is an adoption percentage or an hours-saved estimate, not a revenue-linked metric (CU022).


              Independent, non-company-authored proof corroborates the pattern of genuine but unevenly measured
              satisfaction. Granola's G2 profile carries 19 reviews and an aggregate 4.9-out-of-5 rating as of a
              late-2025 snapshot, spanning Small-Business, Mid-Market, and Enterprise reviewers, several of whose
              identities were validated through business email, Google One Tap, or LinkedIn and labeled organic and
              unincentivized, while at least two others disclose receiving a nominal gift card for the review (CU023,
              CU024). Those same G2 reviewers recur on specific limitations: no audio/video playback, inconsistent
              speaker identification in larger meetings, no dedicated web app, and slow customer support on setup issues
              (CU025), and aggregated Product Hunt commentary echoes similar gaps -- no Android app, iPad/iOS capture
              limits, account setup friction, and requests for more integrations (CU026). Three independent expert
              reviews score Granola materially lower and more inconsistently than G2's self-selected rating:
              thebusinessdive.com gave it 3.6/5 citing thin collaboration and analytics features, nubiapage.com gave it
              4.5/5 citing the missing Android app and unclear free-tier limits, and bestreviews.net flagged missing
              language support and speaker-identification gaps without assigning a numeric score (CU027). A further,
              lower-confidence data point comes from an independent Product Hunt community thread citing in-person,
              multilingual conversation capture -- translating a Japanese conversation into English notes, for example
              -- as a distinguishing real-world use case for the mobile app (CU028). Beyond the four flagship accounts,
