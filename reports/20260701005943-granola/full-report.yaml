      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: No financial base exists to price the round
            body: >-
              No revenue, ARR, gross margin, cash balance, or burn figure has been disclosed by Granola, its investors,
              or any third-party data provider reviewed across this report. The $1.5 billion post-money valuation cannot
              be checked against a company-specific multiple; every valuation reference in this chapter is a category or
              comparable-company benchmark, not a Granola-specific calculation.
            calloutType: risk
            claimRefs:
              - CV011
              - CV010
          - type: callout
            title: Funding history and comparable facts are well corroborated
            body: >-
              Unlike Granola's financial disclosure, its funding history (seed, Series A/B/C amounts, dates, and lead
              investors) and the comparable-company facts in this chapter are each backed by at least two independent,
              cross-checked sources, including official company statements, high-reputation news coverage, and public
              filings.
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
          - type: callout
            title: Legal precedent against the closest direct peer is active, not hypothetical
            body: >-
              Otter.ai faces a consolidated federal class action alleging its tool records conversations and captures
              biometric voiceprint data without consent. Legal commentary from the National Law Review, Bloomberg Law,
              and Goodwin Procter treats the wiretap and biometric-privacy exposure as a category-wide risk that also
              applies to bot-free, less-visible capture tools such as Granola.
            calloutType: risk
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
          - type: callout
            title: Scenario valuation ranges are illustrative, not a fitted model
            body: >-
              Because Granola discloses no ARR or revenue figure, the bull/base/bear valuation ranges and the
              sensitivity figure in this chapter are built from category-level multiple and growth-rate benchmarks
              (Carta, Finro, SaaS-benchmark data), not a discounted-cash-flow or ARR-multiple calculation specific to
              Granola.
            calloutType: assumption
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV026
          - type: callout
            title: Research-more, not buy or avoid
            body: >-
              The evidence supports research-more with medium confidence, a high risk rating, and a stretched valuation
              stance. Growth and adoption signals are directionally positive but unverifiable; the recommendation should
              be revisited immediately if any of the six thesis-break triggers in this chapter fires.
            calloutType: recommendation
            claimRefs:
              - CV049
