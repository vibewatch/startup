        title: Funding History, Traction, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Granola’s funding arc is unusually compressed. Before October 2024, TechCrunch reported a $4.25M seed
              round led by Lightspeed. On 2024-10-23 the company announced a $20M Series A led by Spark Capital. On
              2025-05-14 it launched Granola 2.0 alongside a $43M Series B led by NFDG at a $250M valuation. Less than a
              year later, on 2026-03-25, Granola announced a $125M Series C led by Index Ventures at a $1.5B valuation,
              with Kleiner Perkins and returning investors also participating. TechCrunch and The SaaS News both state
              that total funding reached $192M after the Series C.


              Public traction signals are directionally strong even if incomplete. TechCrunch reported about 5,000
              weekly users by October 2024, 70% first-week repeat usage, and later 10% weekly user-base growth.
              BusinessWire and the jobs page say Granola transcribes millions of minutes of conversation each day.
              Customer proof is unusually concrete for a young software company: Vanta, Brex, Zapier, and Vercel each
              have public case studies with quantified time savings or clear workflow improvements. The cap-table story
              is also high quality — Index, Kleiner, Spark, Lightspeed, NFDG, and operator-angels from Vercel, Replit,
              Linear, Shopify, and others signal both capital support and strong distribution adjacency into technical
              teams.
