      - number: '7.3'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Granola disclosed three public security post-mortems in 2025 covering an AssemblyAI API key exposure, a
              legacy unmanaged Google-account workspace auto-join gap, and a Google Workspace session-logout
              vulnerability affecting 187 users (CR019). Independent security researcher Tenable corroborated the
              AssemblyAI key exposure from an outside technical vantage point, identifying the same unauthenticated
              endpoint (CR020). Notably, all three disclosed incidents were reported to Granola by external researchers
              rather than caught by internal detection (CR023), and no source reviewed identifies an independent
              penetration-test report or bug-bounty program beyond the company's public vulnerability-disclosure policy
              (CR025) -- though the one documented independent research finding shows the company's server-side API
              surface, not just its client apps, has already been probed and found exploitable at least once (CR026).
              None of the three disclosed incidents exposed actual meeting audio or transcript content, based on
              Granola's own descriptions, which is a meaningfully less severe pattern than a content-confidentiality
              breach would be (CR027).


              On reliability, an independent uptime tracker recorded four Granola incidents in a recent 90-day window
              with a median duration of roughly two-and-a-half hours (CR022), though Granola does not publish its own
              uptime SLA or incident log. Granola's Enterprise plan advertises SOC 2 Type II certification achieved in
              roughly three months -- fast relative to the multi-quarter observation periods typical of this
              certification -- and the company's own Security FAQs separately list HIPAA and FERPA as open compliance
              topics rather than settled certifications (CR021, CR024). A low-reputation-tier independent reviewer
              separately alleges Granola shares user notes by default via link and trains internal models on transcripts
              absent an opt-out, a claim that, if representative, would be a meaningful operational and trust risk but
              has not been independently verified by a technical audit (CR028).
            claimRefs:
