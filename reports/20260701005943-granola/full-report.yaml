        - high
        - >-
          Ask Granola for evidence of retention or win-rate advantage specifically attributable to bot-free capture
          versus bot-optional rivals
      - - Granola's agentic Chat and Spaces/API/MCP expansion create a durable context-layer moat
        - >-
          Otter's April 2026 relaunch ships an equivalent MCP client/server and AI Chat Connectors, and Fathom already
          offers account-wide "Ask Fathom" plus MCP support
        - high
        - >-
          Request usage/retention data on Granola's own Chat/Spaces adoption versus rival agent features to test whether
          the moat is architecture-based or execution-speed-based
      - - Bundled incumbent features cap standalone pricing power
        - >-
          Microsoft, Google, and Zoom all include meeting-notes AI in already-purchased subscriptions, and Zoom reports
          AI Companion MAUs more than tripled year over year
        - high
        - >-
          Quantify win/loss rate specifically against bundled incumbent features rather than against other standalone
          vendors
      - - Granola's trust posture supports enterprise sales
        - >-
          An independent review scored Granola 3/10 on enterprise readiness for hosting/data residency, and reporting
          shows a gap between its "private by default" marketing and its actual default settings
        - high
        - >-
          Request an updated, dated SOC 2 report and a direct written confirmation of current hosting regions and
          default sharing/training settings
      - - Switching cost is elevated by Granola's local-first, encrypted note storage
        - >-
