              - CV045
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case requires the reported 250% quarterly growth rate to persist near-term, the Brex-style
              land-and-expand pattern to generalize across the named enterprise roster, and the new personal/enterprise
              APIs and admin dashboard shipped with the Series C to drive real expansion revenue; if a $100 million ARR
              base were eventually disclosed, applying the 8x-20x Applied-AI multiple band analysts cite would support a
              $1.5-$2.0 billion-plus outcome, consistent with the actual Series C price. The base case assumes growth
              decelerates toward the 40-60% year-over-year band typical of post-hypergrowth SaaS, with the next round
              pricing flat to modestly up, consistent with Carta's Q1 2026 data showing Series C primary valuations up
              12.5% year-over-year industry-wide. The bear case assumes growth decelerates sharply while Carta's 11.4%
              industry-wide down-round rate and active wiretap-litigation precedent against the closest direct peer,
              Otter.ai, combine to push the next financing toward a flat or down outcome. Two category-level data points
              frame all three scenarios: Carta shows AI Series A companies pricing at a $300 million median versus $55
              million for non-AI peers, evidencing a broad AI premium Granola's round sits within, while Finro's Q1 2026
              data shows public 'Productivity Tools' multiples compressing even as private rounds in that same category
              continued to command a premium -- a divergence that matters precisely because Granola is still private.
            claimRefs:
              - CV016
              - CV019
