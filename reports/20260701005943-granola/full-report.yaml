      - number: '7.2'
        title: Legal and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Granola's own legal documents establish only a baseline compliance posture: its Privacy Policy permits
              disclosure to government and law enforcement to meet legal requirements (CR001), its Data Processing
              Addendum commits to breach notification "without undue delay" (CR002), and its Terms of Service link to a
              public vulnerability-disclosure policy and three security post-mortems (CR003). Beyond those company
              documents, the applicable regulatory landscape is substantial. The UK ICO's monitoring-workers guidance
              requires a documented lawful basis, proportionality, and transparency for any employer-deployed recording
              or transcription tool (CR004), and its AI-specific guidance separately requires attention to fairness,
              accountability, and statistical accuracy (CR005). The EU AI Act's general-purpose-AI transparency rules --
              directly relevant given Granola's reliance on OpenAI and Anthropic models -- became applicable in August
              2025, with broader AI-system transparency obligations following in August 2026 (CR006). In the US,
              California's all-party-consent wiretap statute criminalizes recording a confidential communication without
              every participant's consent (CR007), and Illinois's Biometric Information Privacy Act requires written
              notice and consent before any entity collects a voiceprint (CR008); HHS's HIPAA Privacy Rule requires a
              written business-associate agreement before any AI vendor may process protected health information on a
              covered entity's behalf (CR009).


              None of this is hypothetical for the AI-notetaking category: a consolidated federal class action against
              Otter.ai alleges exactly these wiretap and biometric-privacy violations (CR010), Bloomberg Law reports
              that courts are split on whether an AI transcription vendor is a "tool" or an unauthorized eavesdropper --
              a distinction that can expose the customer company to vicarious liability (CR011) -- and Goodwin Procter's
              April 2026 client alert quantifies California statutory damages at up to $5,000 per violation while
              flagging biometric and privilege risk separately (CR012). Nine US states require all-party consent
              (CR013). Granola's "bot-free," device-level capture design differs mechanically from Otter.ai's bot-based
              model, but independent legal commentary on vendor classification suggests it does not by itself resolve
              the underlying consent question for other meeting participants (CR014). Granola's Enterprise-plan SOC 2
              Type II certification is marketed as "independently audited," but SOC 2 does not itself certify wiretap,
              UK GDPR, AI Act, or HIPAA compliance (CR015), and the company's own blog discloses it does not currently
              hold a HIPAA Business Associate Agreement (CR016). No source reviewed identifies litigation or a
              regulatory action naming Granola directly, so this category's realized risk to date is comparable and
              category-wide rather than company-specific (CR017, CR018).
            claimRefs:
