      - number: '5.5'
        title: Differentiation
        blocks:
          - type: paragraph
            body: >-
              Granola's stated core differentiation is architectural rather than feature-based: bot-free, local capture
              with zero server-side audio storage and immediate audio deletion after transcription, which the company
              says is the direct reason it completed SOC 2 Type II certification in roughly three months rather than the
              typical 12-18 (CE034). Layered on top of that architecture, Granola frames its Chat product around a
              "CODE" framework (Capture, Organize, Distill, Express), arguing that keyword search over raw transcripts
              alone does not produce reusable organizational memory (CE035), and its Recipes feature differentiates the
              prompt-library approach by sourcing shareable templates from named external experts such as Lenny
              Rachitsky and Matt Mochary rather than only generic, company-authored prompts (CE036).


              These claims are only partially durable under independent scrutiny. A competitor-published review (tl;dv)
              estimates Granola's transcription accuracy at roughly 94-95% versus tl;dv's own claimed 97%+, and states
              Granola supports about 15 languages versus tl;dv's 30+ -- framing Granola's real differentiation as
              workflow and capture design rather than raw transcription performance, though the source itself carries an
              evident competitive bias (CE037). More materially, Granola's "bot-free" and "private by default"
              positioning has been publicly and independently contested on two separate fronts: one independent reviewer
              rates Granola's enterprise readiness at just 3 out of 10, citing weak default sharing settings and no EU
              or on-prem hosting option, while a separate outlet reports that notes are shareable via link to anyone who
              obtains it by default unless a user manually changes that setting (CE038). Taken together, Granola's
              differentiation is real at the architecture level but neither exclusive nor fully corroborated at the
              marketing-claim level -- a distinction that matters for how much pricing power and switching-cost
              durability that architecture can actually support.
            claimRefs:
              - CE034
              - CE035
              - CE036
              - CE037
              - CE038
