  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Granola's own product and blog pages describe the company as an AI notepad: a desktop and iPhone app that
              captures meeting audio and user-typed notes without adding a visible bot participant to the call, and that
              works with any videoconferencing platform (Zoom, Google Meet, Microsoft Teams). That framing matters for
              drawing the market boundary, because it separates Granola from two adjacent categories that are easy to
              conflate with it. The first is bundled incumbent notetaking: Microsoft 365 Copilot and Teams Recap, Google
              Meet's "Take notes for me" powered by Gemini, and Zoom AI Companion's Meeting Summary are all already
              included inside existing collaboration-suite subscriptions at no separate charge, which caps the price any
              standalone vendor can charge purely for basic transcription and summarization. The second is dedicated
              sales conversation-intelligence software such as Gong, which is priced for large SDR organizations at
              roughly $1,300-$1,600 per user per year plus a mandatory $5,000-$50,000 annual platform fee, a materially
              different job-to-be-done and price point than a lightweight notepad.


              Within the standalone notetaking category itself, Granola competes with bot-optional and bot-based
              products such as Fathom, Fireflies (which claims usage across more than 1 million companies), and Otter.ai
              (which markets calendar-based auto-join capture). The practical included market for underwriting purposes
              is therefore standalone, per-seat AI meeting-notes software plus the emerging "context layer" Granola
              launched with its March 2026 Series C round: Spaces for shared team context, personal and enterprise APIs,
              and an updated MCP connecting into third-party agent tools such as Claude, ChatGPT, and Replit. Excluded
              from that boundary are the underlying videoconferencing platform license fees themselves, dedicated
              conversation-intelligence platforms priced for large sales orgs, and generic company wikis or
              document-management suites that carry no meeting-derived context. A status-quo substitute worth noting is
              that some privacy-sensitive users have responded to Granola's own local-database encryption by reverting
              to plain local markdown files (paired with tools like Obsidian) rather than trusting any vendor-hosted
              database, a reminder that "no tool at all" remains a live alternative for the most portability-sensitive
              buyers.
            claimRefs:
