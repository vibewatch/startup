      - number: '4.2'
        title: GTM motion and sales efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Granola's go-to-market motion is bottom-up and product-led rather than sales-led. Brex's published case
              study is the clearest evidence: implementation began as a trial on the Business plan with select teams and
              moved to a full Granola Enterprise deployment within weeks once usage spread organically (CI013), and
              Vercel's case study describes its entire GTM team adopting the product rather than a single champion
              (CI014). Index Ventures' own investment post frames this as the growth mechanism it backed: individual
              users becoming evangelists, with adoption spreading grassroots-style from individuals to teams to whole
              enterprises (CI017), a narrative Granola's careers page echoes by claiming the product "spreads quickly
              from leaders to entire organizations" while transcribing millions of minutes of conversation daily
              (CI018).


              None of this is denominated in dollars. No source -- company-published or third-party -- discloses a CAC,
              LTV, or CAC-payback figure for Granola (CI019). The closest available yardstick is external: a 2026 SaaS
              benchmark report puts median CAC payback for PLG/bottom-up SaaS companies at 12-15 months, with
              top-quartile companies near 9-12 months and anything above 24 months flagged as a warning sign for
              venture-funded SaaS (CI020), while the same report notes median sales-and-marketing spend as a share of
              revenue for venture-backed SaaS fell from over 50% in 2021 to roughly 35-40% in 2024-2026 (CI021). These
              are comp-set benchmarks only; they say nothing about whether Granola's own acquisition spend or efficiency
              sits above, at, or below that band, and the customer case studies quantify time saved (260-830+ hours),
              not cost saved or dollars paid (CI015, CI016).
