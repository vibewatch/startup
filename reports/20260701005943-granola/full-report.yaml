  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking Overview
        blocks:
          - type: paragraph
            body: >-
              This chapter ranks Granola's legal, regulatory, operational, technical, financial, partner, customer, and
              execution risks by likelihood, severity, mitigation maturity, and residual exposure, drawing on primary
              statutes and regulator guidance (UK ICO, the EU AI Act, California's wiretap statute, Illinois's
              biometric-privacy law, and HHS's HIPAA Privacy Rule), litigation and law-firm analysis of comparable AI
              notetakers, Granola's own security post-mortems and compliance pages, and independent financial,
              competitive, and headcount data gathered in earlier chapters. Weighed together, the highest-priority risk
              categories are: partner/vendor concentration and platform-bundling substitution, financial and
              capital-adequacy disclosure opacity, legal/regulatory consent and privacy exposure, recurring
              externally-discovered operational/security incidents, and execution/governance disclosure gaps (CR058). No
              source reviewed identifies litigation, a regulatory enforcement action, a disclosed cash/burn figure, or a
              named non-founder executive at Granola -- meaning several of the highest-severity items in this ranking
              are currently prospective or structural rather than realized, and every one of them has an identified
              monitorable diligence path but no company-disclosed quantitative threshold (CR059). The risk heatmap below
              plots likelihood, severity, mitigation maturity, and residual exposure across the eight risk categories
              developed in the sections that follow.
            claimRefs:
              - CR058
              - CR059
