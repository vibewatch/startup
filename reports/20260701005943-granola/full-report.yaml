      - number: '8.4'
        title: 'Comparable set: public, private, and M&A'
        blocks:
          - type: paragraph
            body: >-
              No single comparable matches Granola on both category and stage, so this section triangulates across a
              curated set. Direct competitor Fireflies.ai reached a $1 billion-plus valuation in June 2025 via a tender
              offer rather than a primary round, while stating it has been profitable since 2023; direct competitor
              Otter.ai disclosed surpassing $100 million in annual recurring revenue in March 2025 but no corroborated
              current valuation exists in the evidence reviewed here. Adjacent AI-productivity company Notion was last
              valued at $11 billion in a December 2025 employee share sale, a much larger-scale ceiling reference.
              Public comparable Zoom Communications carried a $25.31 billion market capitalization against $4.93 billion
              trailing revenue (roughly 5.1x price-to-sales) and 77.0% gross margin as of mid-2026 -- a mature,
              low-growth, profitable profile that is structurally different from Granola's claimed hyper-growth private
              stage but useful as a margin and multiple anchor. On the M&A side, Salesforce's agreement to acquire AI
              customer-service platform Fin for approximately $3.6 billion in June 2026 shows the price a strategic
              acquirer will pay for a proven, enterprise-deployed AI-agent platform, in an adjacent though distinct
              vertical, against a backdrop CNBC describes as a record $4.9 trillion global M&A year in 2025 carrying
              AI-driven momentum into 2026. Across this set, Granola is the only company whose valuation rests on zero
              disclosed revenue or ARR figure.
            claimRefs:
              - CV029
              - CV030
