  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and revenue mix
        blocks:
          - type: paragraph
            body: >-
              Granola monetizes through a tiered per-seat SaaS subscription. Its own blog states the Business plan costs
              $14 per user per month and includes unlimited meeting history, CRM integrations, and folder-level queries
              across a team's conversations (CI001). SiliconANGLE's March 2026 Series C coverage adds a free tier and a
              $35-per-month Enterprise tier with expanded cybersecurity controls, though it never clarifies whether that
              Enterprise figure is a per-seat or flat organizational price (CI002) -- and Granola's own Enterprise page
              confirms the ambiguity by listing enterprise-only features without publishing any contract price at all
              (CI003). The Series C announcement adds two more monetization surfaces -- a personal API bundled into
              Business/Enterprise plans and an enterprise admin API bundled into Enterprise only -- with neither priced
              as a standalone line item today (CI004). No source reviewed discloses what share of revenue comes from
              Business versus Enterprise versus API usage (CI005).


              Against comp-set pricing, Granola's $14 list price sits inside a $10-$39 per-seat band shared with
              Fireflies, Otter, and Fathom (CI010, CI011, CI012), all of which also gate their own Enterprise tier
              behind a sales conversation. Granola's own sales buyer's guide explicitly cedes the much higher-ACV
              conversation-intelligence category to Gong, citing third-party estimates of $1,300-$1,600 per user per
              year plus a $5,000-$50,000 platform fee (CI008), a figure an independent CloudTalk analysis corroborates
              (CI009). Bloomberg reported, via SiliconANGLE, that Granola's revenue grew 250% in the quarter before the
              Series C, but neither outlet disclosed the absolute base that rate was measured against (CI006), leaving
              revenue quality directionally positive but financially unverifiable.
