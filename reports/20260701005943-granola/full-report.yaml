  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Granola has raised four disclosed rounds in under three years: roughly $4.25 million in seed funding, a
              $20 million Series A led by Spark Capital in October 2024, a $43 million Series B led by NFDG in May 2025
              at a $250 million valuation, and a $125 million Series C led by Index Ventures on 2026-03-25 at a $1.5
              billion post-money valuation, with Kleiner Perkins joining and Lightspeed, Spark, and NFDG returning.
              TechCrunch and The SaaS News both put total disclosed funding at $192 million after the Series C, while
              BusinessCloud separately reported roughly $188 million, a modest publisher-level discrepancy on the
              cumulative total. Forbes reported in January 2026 that Granola was in talks for at least $100 million at a
              valuation of over $1 billion -- the round that ultimately closed two months later at $125 million and $1.5
              billion, an escalation during the process itself. All disclosed capital is venture equity; no debt,
              venture-debt, or convertible instrument appears in any source reviewed, and a Companies House PSC filing
              shows a co-founder's dilution event in April 2023 consistent with the first institutional round rather
              than any departure. Entry discipline is difficult to assess on public evidence alone: Granola Labs Ltd's
              UK small-company audit exemption means its filed accounts disclose neither turnover nor profit, so the
              price cannot be checked against a company-specific financial base, and neither the company nor its
              investors state a public next-round trigger, runway figure, or exit timeline.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis Index Ventures backed is bottom-up: individual users become evangelists, and usage spreads from
              individuals to teams to entire enterprises, evidenced by the land-and-expand pattern at Brex and a named
              reference-customer roster spanning Vanta, Zapier, Vercel, Asana, Gusto, Thumbtack, Cursor, Lovable,
              Decagon, and Mistral AI, layered on Bloomberg-reported 250% quarterly revenue growth ahead of the Series
              C. The anti-thesis has three distinct strands. First, total financial opacity: no revenue, ARR, gross
              margin, cash balance, or burn figure exists anywhere in the evidence reviewed across this report, and the
              audit exemption forecloses near-term forced disclosure. Second, product commoditization: Fathom and tl;dv
              now match Granola's bot-free positioning, and Microsoft Teams, Google Meet, and Zoom AI Companion
              distribute meeting-notes AI inside suites buyers already own at no incremental cost, narrowing the
              differentiation window the thesis depends on. Third, transmissible legal risk: Otter.ai faces a
              consolidated federal class action over recording and voiceprint capture without consent, and legal
              commentary from the National Law Review, Bloomberg Law, and Goodwin Procter treats the entire
              AI-notetaking category -- including less-visible, bot-free tools -- as exposed to the same wiretap and
              biometric-privacy statutes. None of these three anti-thesis strands is disqualifying on its own, but
              together they mean the bull case rests on signals (growth rate, investor quality, adoption pattern) that
              are directionally positive but none of which is independently verifiable against Granola's own numbers.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV002
            claimRefs:
              - CV016
              - CV017
