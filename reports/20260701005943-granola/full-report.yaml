            body: >-
              The public founder record is consistent across recent news coverage: Granola was founded by Chris Pedregal
              and Sam Stephenson. Pedregal is the more visible operator in public materials and carries clear
              founder-market-fit credentials from previous AI-and-product work. BusinessCloud reports that he previously
              founded Socratic, sold it to Google in 2018, and later built Stack inside Google’s Area 120 incubator
              before that product was folded into Google Drive. Stephenson appears in reporting and company materials as
              cofounder and product/design counterpart, including as a quoted cofounder in the October 2024 Series A
              coverage.


              What is less visible is the broader executive and governance bench. The fetched company, investor, and
              press surfaces repeatedly spotlight the two founders, but they do not publish a full board roster, an
              independent director slate, or a clearly named CFO/COO structure. For diligence purposes, that leaves
              Granola looking founder-centric: charismatic, product-led, and likely fast-moving, but with real
              key-person concentration and limited public governance disclosure relative to its post-Series-C valuation.
