              Otter.ai 正面临一项合并联邦集体诉讼，被指其工具在未经同意情况下记录对话并采集生物识别声纹数据。National Law Review、Bloomberg Law 和 Goodwin Procter
              的法律评论把 wiretap 和生物隐私暴露视为类别级风险，也适用于 Granola 这类无机器人、较不显眼的捕获工具。
