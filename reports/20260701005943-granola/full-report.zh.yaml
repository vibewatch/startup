      - number: '7.2'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Granola 自己的法律文件只建立了基线合规姿态：Privacy Policy 允许为满足法律要求向政府和执法机构披露（CR001）；Data Processing Addendum
              承诺在泄露后“不得无故拖延”通知（CR002）；Terms of Service 链接到公开 Vulnerability Disclosure Policy
              和三份安全事后复盘（CR003）。公司文件之外，适用监管版图相当重。英国 ICO 的 monitoring-workers
              指南要求雇主部署任何录音或转写工具时，必须有记录在案的合法依据、比例原则和透明度（CR004）；其 AI 专项指南还要求关注公平性、问责和统计准确性（CR005）。考虑到 Granola 依赖 OpenAI 和
              Anthropic 模型，EU AI Act 的通用 AI 透明度规则直接相关，并已于 2025 年 8 月适用；更广泛的 AI 系统透明度义务将在 2026 年 8
              月跟进（CR006）。美国方面，California 的全方同意 wiretap statute 将未经每位参与者同意录制保密通信定为犯罪（CR007）；Illinois 的 Biometric
              Information Privacy Act 要求任何实体采集声纹前提供书面通知并取得同意（CR008）；HHS 的 HIPAA Privacy Rule 要求任何 AI 供应商在代表 covered
              entity 处理受保护健康信息前签署书面 business-associate agreement（CR009）。


              这对 AI 会议记录工具类别并非假设：针对 Otter.ai 的合并联邦集体诉讼指控的正是这些 wiretap 和 biometric-privacy 违规（CR010）；Bloomberg Law
              报道称，法院在 AI 转写供应商到底是“工具”还是未经授权的窃听者上存在分歧——这一区别可能让客户公司承担替代责任（CR011）；Goodwin Procter 2026 年 4 月客户提示把
              California 法定赔偿量化为每次违规最高 $5,000，并单独提示生物识别和特权风险（CR012）。九个美国州要求全方同意（CR013）。Granola “无机器人”、设备级采集设计在机械上不同于
              Otter.ai 的 bot-based 模式，但关于供应商分类的独立法律评论表明，这一差异本身不能解决其他会议参与者的底层同意问题（CR014）。Granola Enterprise 计划的 SOC 2
              Type II 认证被营销为“独立审计”，但 SOC 2 本身不认证 wiretap、UK GDPR、AI Act 或 HIPAA 合规（CR015）；公司自家博客还披露其目前没有 HIPAA Business
              Associate Agreement（CR016）。审阅过的来源没有发现直接点名 Granola 的诉讼或监管行动，因此该类别迄今已实现的风险是同类可比、行业范围风险，而非公司特定风险（CR017,
              CR018）。
