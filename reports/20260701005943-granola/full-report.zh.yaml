              - CR034
          - type: callout
            title: 资本充足度披露的不透明，源于结构而不只是自愿选择
            body: >-
              Granola 的英国母公司提交了 total-exemption 小公司账目，这意味着除非触发破产或规模门槛突破等法定事项，未来普通 Companies House
              文件不会呈现现金余额、烧钱速度、收入或利润率。承销 Granola 的财务风险，因此需要谈判取得 data room 访问权，而不能等待未来公开申报。
            calloutType: risk
            claimRefs:
              - CR041
