  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近类别与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Granola 自己的产品和博客页面把公司描述为 AI 记事本：一个桌面和 iPhone
              app，在不向通话加入可见机器人参与者的情况下采集会议音频和用户输入的笔记，并可配合任何视频会议平台（Zoom、Google Meet、Microsoft Teams）使用。这个框定对划分市场边界很重要，因为它把
              Granola 与两个容易混淆的相邻类别分开。第一类是既有协作套件内置的记笔记：Microsoft 365 Copilot 和 Teams Recap、由 Gemini 驱动的 Google Meet “Take
              notes for me”、Zoom AI Companion 的 Meeting Summary 都已经包含在现有协作套件订阅中，不另收费；这会限制任何独立厂商仅凭基础转写和总结能收取的价格。第二类是 Gong
              这类专用销售会话智能软件，面向大型 SDR 组织，定价约 $1,300-$1,600 每用户每年，另加 $5,000-$50,000 的强制年度平台费；它的使用场景和价格点都与轻量记事本本质不同。


              在独立记笔记类别内部，Granola 与 Fathom、Fireflies（声称覆盖超过 1 million 家公司）和
              Otter.ai（主打基于日历的自动入会采集）等可选机器人或基于机器人的产品竞争。因此，尽调用的实际纳入市场，是独立按席位计费的 AI 会议笔记软件，加上 Granola 在 2026 年 3 月 Series
              C 轮推出的新兴“上下文层”：用于共享团队上下文的 Spaces、个人和企业 API，以及连接 Claude、ChatGPT、Replit 等第三方智能体工具的新版
              MCP。排除在边界之外的是底层视频会议平台许可证本身、面向大型销售组织定价的专用会话智能平台，以及没有会议衍生上下文的通用公司 wiki 或文档管理套件。一个值得注意的现状替代品是，一些对隐私敏感的用户在
              Granola 加密本地数据库后，选择回到普通本地 markdown 文件（配合 Obsidian 等工具），而不是信任任何厂商托管数据库；这提醒我们，对于最重视可携带性的买方，“根本不用专门工具”仍是活选项。
