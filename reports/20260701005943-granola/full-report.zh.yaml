      - - 现金余额和现金续航
        - 无法判断 Series C 资金预计能撑多久，或是否急需追加融资。
        - 索取最新管理账和董事会批准的现金续航模型。
      - - 月度现金消耗率
        - 无法独立核对由招聘推动的成本增长是否匹配收入增长。
        - 索取过去各月实际运营支出。
