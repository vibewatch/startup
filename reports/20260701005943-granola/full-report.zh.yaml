      - number: '7.6'
        title: 缓释措施、监测与终止标准
        blocks:
          - type: paragraph
            body: >-
              Granola 已披露的主要风险缓释措施，是 SOC 2 Type II 认证、Enterprise 层级默认关闭模型训练，以及 DPA
              中的违规通知承诺（CR053）。这些措施都没有直接覆盖本章识别出的三类公司披露最少的监管问题：全方同意录音、EU AI Act 透明度义务，以及 HIPAA Business Associate
              Agreement；截至运行日，公司没有为这些风险给出明确缓释方案（CR054）。本章为每一类最高风险设定可监测的终止标准，而不是依赖直觉：若出现直接点名 Granola 的诉讼或执法行动，法律 /
              监管风险就升级；其最接近的机器人型竞争对手已经越过这一门槛（CR055）。若出现降价融资、Series D 明显延迟，或披露的烧钱额超过 Series C 融资额，财务 /
              资本风险就升级；已有两位负面评论者认为，鉴于估值跃升未经验证，这一结果可能发生（CR056）。若核心 AI/ASR 供应商出现有记录的涨价、宕机或政策变化，或有证据显示某个具名参考客户用打包的
              Teams/Zoom/Meet 功能替代 Granola，合作伙伴 / 供应商风险就升级（CR057）。


              综合前几节建立的风险登记，本章整体风险排序把合作伙伴 / 供应商集中与平台打包替代、财务 / 资本充足度不透明、法律 / 监管同意风险，排在运营 / 安全以及执行 /
              治理风险之前；主要原因是前三类风险严重度高，而公司披露的缓释措施薄弱或缺失（CR058）。这五大风险类别每一类都有明确尽调路径，但没有一类配有公司披露的量化阈值，例如烧钱上限或诉讼成本储备——因此持续监测要依靠外部信号（诉讼文件、融资公告、供应商事件披露、具名客户流失），而不是公司报告指标（CR059）。下方风险传导图追踪各类风险预计如何传导到客户留存、利润率、融资，并最终影响投资论点。
