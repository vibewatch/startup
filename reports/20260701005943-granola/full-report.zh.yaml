  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 250% 季度增长短期延续；Brex 式先落地再扩张能推广至具名企业客户名单；新 API / 管理后台带来扩张收入（CV016, CV021）。
        - 下一轮估值达到或高于 $1.5B-$2.5B；如果最终披露 $150M-$300M ARR 基数，这大致贴合市场分析师引用的 AI 应用倍数区间（8x-20x ARR）（CV021）。
        - 没有披露 ARR 可确认增长持续性；Fathom/tl;dv/捆绑既有厂商带来商品化（CV019）。
        - 与 Bloomberg 报道的增长延续一致，但这种超高增速通常会随时间减速；也没有第二个数据点确认。
      - - 基准
        - 增长放缓至后高增长 SaaS 常见的 40%-60% 同比区间；鉴于 Carta 显示 Series C 估值同比上涨 12.5%，下一轮价格持平至小幅上行（CV022, CV025）。
        - 下一次一级或二级交易中，估值守在 $1.5B-$2.0B 区间；公司到 2027-2028 年仍保持私有（CV022）。
        - 即使增长维持，功能商品化也会压缩定价权（CV019）。
        - 符合 Carta 覆盖的后期估值通胀大趋势，但不能证明 Granola 特有持久性（CV025）。
      - - 悲观
        - 增长急剧放缓；窃听 / 同意诉讼先例（Otter.ai）外溢至 Granola；审计豁免备案继续让任何机构后续尽调拿不到财务数据（CV023, CV042, CV010）。
        - 下一轮融资估值持平或下调，与 Carta 11.4% 的行业降价轮比例一致；低于 $1.5B 的二级市场标记变得可行（CV023）。
        - 在资本获取吃紧前，单位经济性可能始终得不到独立验证（CV011, CV028）。
        - 基于 Carta 的实时降价轮基准率，以及针对直接可比 bot 型同行的活跃诉讼先例（CV023, CV042）。
    notes: 估值区间是基于品类级倍数和增长率基准（Carta、Finro、SaaS 基准数据）搭出的情景框架；由于没有披露 ARR / 收入基数，它不是 Granola 特有的贴现模型。
