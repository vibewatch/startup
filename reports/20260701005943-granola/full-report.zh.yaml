      - number: '6.5'
        title: 扩张与集中
        blocks:
          - type: paragraph
            body: >-
              Granola 自己的 Enterprise 营销页面把其 GTM 动作明确表述为 land-and-expand：“先是一个人爱上
              Granola。它会扩散，因为它让每个人工作得更好”（CU038）。四个详细案例都在实践中确认了这种模式——每个都从个人或小团队试点开始，后来由领导层扩展成全公司 Enterprise 计划
              rollout（CU039）。除席位增长外，Granola 还打造了刻意用于扩张的产品：用于跨职能知识共享的 Spaces / Team Folders、Personal API、Enterprise Admin
              API，以及用于第三方 AI-agent 集成的 Granola MCP；这些都旨在加深客户对 Granola 作为组织记忆层的依赖，而不是只把它当个人记笔记工具（CU040）。


              几项集中风险削弱了这个扩张故事。第一，Granola 几乎所有量化客户结果证明都压在四个具名账户上，且每个都是资金充足、与 Granola
              自身投资方网络有关联的技术公司——这是证据集中风险，区别于但又相关于收入集中：如果任何旗舰账户的指标被修订，或关系终止，本章大多数结果证据都会消失（CU041）。第二，独立报道称 Granola
              增长主要靠口碑；审阅过的任何来源都没有记录已披露的 reseller、channel partner 或 systems integrator 分发——相对于可能运行多渠道 GTM
              的竞争对手，这是一种单渠道依赖（CU042）。第三，独立分析警告称，Microsoft Copilot 和 Google Gemini 正把相同的会话上下文聚合能力原生嵌入 Teams 和 Workspace
              环境，而多数企业员工本来就已有这些席位——这是平台层面的集中风险，即使 YipitData 当前动能很强，也可能压缩 Granola 的扩张跑道（CU043）。最后，Granola 自己的 enterprise
              页面称其受到“技术、金融、媒体等”团队信任，但本章每个经独立详细呈现的具名账户都是技术或技术相邻公司；审阅过的来源中没有任何金融或媒体行业账户达到案例研究级细节，已知合规缺口（无 HIPAA BAA、无 EU
              托管部署，见产品 / 技术章）也合理解释了为何受监管垂直扩张在此尚未得到证明（CU044）。
            claimRefs:
