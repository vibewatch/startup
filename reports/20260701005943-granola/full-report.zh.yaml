      - number: '3.4'
        title: 切换成本、锁定、多栖使用、分发权力与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              切换成本和锁定对 Granola 的影响不止一个方向。2026 年 3 月，Granola
              决定加密本地笔记数据库，遭到一位知名投资人公开批评；一个独立博客也认为，这一变化让想要本地优先可携带性的用户面对一个“zero value”（零价值）app（CP037）——这种锁定风险与 Granola
              自己“private by default”（默认私密）的营销主张并不协调（CP044）。独立 2026 年报道直接反驳了这一主张，发现 Granola
              会把笔记分享给任何持有链接的人，并默认用转写稿训练，除非用户退出（CP045）。同一报道把批评延伸到更宽的类别，指出 Otter.ai、Fireflies.ai 和 Fellow
              也有类似的宽松默认设置模式（CP046）；另一个独立企业就绪度评测则因托管 / 数据驻留给 Granola 打出 3/10，Fireflies 和 Fathom
              通过专用存储与自定义留存控制部分补上的缺口，Granola 已审阅页面尚未匹配（CP047）。多栖使用方面，Fathom、Fireflies 和 Otter 都发布了接入
              CRM、项目管理和自动化工具的原生集成，降低了把结构化会议数据迁出单一厂商的成本（CP038）；Otter 自己的 MCP client/server 设计也明确映射 Granola 的 MCP
              策略，削弱了“智能体连接性”作为单独护城河的力度（CP039）。


              耐久性方面，一份由竞争性 AI 会议助手厂商发布的 2026 年市场报告称，干净音频上的转写准确率已在全行业收敛到 95% 以上，并把市场分层为平台捆绑、独立和垂直专家三档；Zoom AI Companion 和
              Microsoft Teams Premium 已按原始用户数领先，Fathom 则在独立同行中拥有最高披露 G2 评分（CP041、CP042）。TechCrunch
              也另行观察到，竞争价值正从转写本身转向把笔记变成行动；其称 Read AI、Fireflies 和 Quill 正与 Granola 一起追逐这一方向（CP043）。这些都不致命，但意味着 Granola
              自己的护城河不靠任何单一持久技术优势，而是同时取决于智能体功能、信任姿态和分发上的持续执行速度（CP048）。
