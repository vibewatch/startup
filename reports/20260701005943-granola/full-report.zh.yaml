    rows:
      - - Granola
        - 直接同业 / 无 bot 品类开创者
        - $125M Series C（2026 年 3 月），估值 $1.5B；累计披露融资 $192M
        - 连续开会的个人与团队；正扩展到 IT 治理的企业铺开
        - 无 bot 本地采集、可跨数月笔记推理的智能体式 Granola Chat、持续扩展的 Spaces/API/MCP 上下文层
        - 其“默认私密”营销主张，被独立报道的默认链接分享和模型训练情况相矛盾
      - - Fathom
        - 直接同业（bot 可选）
        - 定价 / 规模只由自有产品页面披露；据一份独立 2026 年报告，G2 评分为独立品类最高
        - 个人到中端市场销售 / CS 团队
        - 免费无限层级、无 bot 测试版采集选项、公开 API/MCP 以及 Claude/ChatGPT 集成
        - 已审阅公开来源未披露公司层面融资或客户数
      - - Fireflies.ai
        - 直接同业（基于 bot、工作流重）
        - 据自有营销材料，覆盖 1M+ 家公司；已审阅来源未披露融资
        - 希望获得 CRM/ATS 自动化的 SMB 到企业团队
        - 200+ 项 AI Skills，广泛 CRM/PM/ATS/Slack 集成，明确零数据留存的 AI 训练政策
        - 据独立报道，因同意相关录音做法面临与 Otter.ai 类似诉讼
      - - Otter.ai
        - 直接同业（基于 bot、规模领先者）
        - 截至 2026 年 4 月重新发布，声称拥有 35M+ 用户、1B+ 场会议，并瞄准 >$100B 可触达市场
        - 从个人到大型企业；将自身定位为对标 CRM/ERP 规模的平台
        - MCP 客户端 / 服务器、AI Chat Connectors，在已审阅同业中声称用户基数最大
        - 因同意与生物识别数据主张面临合并后的联邦集体诉讼
      - - tl;dv
        - 直接同业（bot 可选）
        - 据自有首页，拥有 2M+ 用户，450 条评论综合评分 4.7/5
        - 需要 CRM 自动化和通用会议采集的销售与 CS 团队
        - “无需 bot”采集选项、多语言自定义摘要，声称接入 5,000+ 个 Zapier 集成
        - 其 Granola 对比内容由自己撰写，本研究会话无法访问其专用定价页
      - - Read AI
        - 直接同业（参与度分析）
        - 定价层级最高 $39.75/用户/月；已审阅来源未披露融资
        - 希望获得会议参与度指标和个人“数字孪生”助手的团队
        - Ada 数字孪生助手、官方 Zoom “Essential App” 合作伙伴身份
        - 独立报道点名其因同意担忧面临大学层面使用禁令
      - - Microsoft Teams / Copilot
        - 捆绑型既有厂商
        - Teams Premium 附加包 $10/用户/月；完整 Copilot 摘要需要单独 Microsoft 365 Copilot 许可证
        - 现有 Microsoft 365/Teams 企业订阅客户
        - 在已购买协作套件内几乎零摩擦采用
        - 据独立 2026 年市场评论，功能深度与跨平台覆盖落后于独立厂商
      - - Google Workspace / Gemini
        - 捆绑型既有厂商
        - 包含在 Google Workspace 订阅内；已审阅来源未披露单独价格
        - 现有 Google Workspace 订阅客户
        - 零增量成本，自动集成 Google Docs/Drive/Calendar
        - 仅限 Google Meet；不采集 Zoom 或 Teams 会议
      - - Zoom AI Companion
        - 捆绑型既有厂商
        - 包含在付费 Zoom Workplace 方案内，或单独提供；Q4 FY26 月活跃用户同比增长超过三倍
        - 现有 Zoom Workplace Pro/Business/Enterprise 许可证客户
        - 声称不使用客户数据训练模型，采用增长迅速
        - 绑定 Zoom 会议平台；不采集 Teams/Meet 通话
      - - Gong
        - 邻近品类（更高 ACV 的会话智能）
        - 声称 5,000+ 客户；Foundations 方案估计约 $1,600/用户/年，另加 $5,000-$50,000 强制年度平台费
        - 拥有专门赋能资源的大型 SDR / 销售组织
        - 深度辅导、预测与营收分析工具，超出基础记笔记
        - 成本结构只适合大型团队；Gong 不直接公布定价
      - - 硬件可穿戴设备（Plaud、Mobvoi、Omi、Viaim、Anker、Pocket）
        - 潜在进入者 / 替代品
        - 设备价格大约 $89-$200，可选 $15-$20/月订阅；已审阅来源中多数厂商未披露融资
        - 纯软件工具无法采集的线下会议和对话
        - 用专用硬件形态采集离线 / 线下内容
        - 除任何软件订阅之外，或作为软件订阅替代，还需购买实体设备
      - - 内部自建 / 现状（无专用工具）
        - 替代品 / 现状
        - 无厂商关系；成本是内部工程与流程时间
        - 最重视控制或可移植性的团队，包括部分对本地数据库反弹作出反应的团队
        - 完全数据控制且零厂商锁定
        - 没有重大内部工程投入，就没有 AI 摘要、搜索或跨会议记忆
    notes: 各行覆盖本章公开证据中，2026 年 Granola 买家可见的最重要直接、既有、邻近、硬件进入者和现状替代方案；规模 / 融资数字按相应主张标注，混合了公司声称与独立估计。
