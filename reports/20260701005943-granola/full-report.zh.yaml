      - number: '3.2'
        title: 按竞品类别拆解：直接同行、捆绑式既有厂商，以及相邻会话智能层
        blocks:
          - type: paragraph
            body: >-
              在直接独立同行中，Fathom 的 2026 年定价页列出免费层，以及 Team（$19/$15）和 Business（$34/$25）按用户月付 / 年付层级，并包含 MCP 与 Claude/ChatGPT
              集成（CP007、CP008）。Fireflies.ai 声称覆盖超过 1 million 家公司，并在首页直接展示 SOC 2 Type II、GDPR 和 HIPAA 徽章，同时给出“零数据留存”AI
              训练政策（CP009）；其 Pro、Business、Enterprise 层级大致覆盖 $10-$39 每席位每月（CP010）。Otter.ai 是审阅同行中的规模领导者：2026 年 4
              月重启发布称拥有超过 35 million 用户、处理超过 1 billion 场会议，并被 Fortune 500 的 86% 使用（CP011）；同时推出新的 “Conversational
              Knowledge Engine”，带 MCP server/client，并声称可触达机会约 $100 billion（CP012）——这一策略几乎逐项映射 Granola 自己的 Spaces/API/MCP
              扩展。tl;dv 报告超过 2 million 用户和 4.7/5 评分（CP016），Read AI 则把名为 Ada 的 “digital twin” 助手与官方 Zoom “Essential App”
              合作伙伴身份绑定（CP019）。


              捆绑式既有厂商和相邻类别又是另一种形态。Microsoft 自己的支持页面确认，智能 Teams recap 需要 Teams Premium 附加许可证或 Microsoft 365 Copilot
              许可证（CP023），而 Microsoft 将 Teams Premium 定价为 $10.00 每用户每月——低于本章审阅的所有独立厂商标价（CP024）。Google 的 “Take notes for
              me” 与 Zoom 的 AI Companion 都包含在现有付费订阅中，不另列单独价格（CP025、CP026）；Zoom 报告称，AI Companion 月活用户在 FY26 Q4
              同比增长超过三倍（CP026）。相比之下，Gong 声称拥有超过 5,000 家客户；独立研究估计其 Foundations 计划约 $1,600 每用户每年，另加强制 $5,000-$50,000
              年平台费（CP021、CP022）——比任何独立记事本高一个数量级，并且只面向大型 SDR 组织；这恰好也是 Granola 自己销售指南所说不需要 AI 记事本的买方（CP034）。
