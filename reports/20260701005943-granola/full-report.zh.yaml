            title: 没有可用于定价本轮的财务基础
            body: >-
              Granola、其投资人，或本报告审阅的任何第三方数据提供商，都没有披露收入、ARR、毛利率、现金余额或烧钱数字。$1.5B 投后估值无法对照公司自身倍数核验；本章所有估值参照都是类别或可比公司基准，而不是
              Granola 专属计算。
            calloutType: risk
