      - number: '6.2'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Granola 自己披露的采用指标稀少且已经过时：公司在 2024 年 10 月 Series A 时报告每周 5,000 名用户（CU009）；独立分析明确指出，Granola
              自那之后“未披露当前用户数”（CU010）。公司招聘页面只称其每天“转写数百万分钟对话”，没有精确数字，也没有历史趋势（CU011）；独立媒体报道引用公司称截至 2026 年 3 月 Series C
              时每周用户增长率为 10%，同样没有披露适用该百分比的基数（CU012）。


              最严谨的采用证据并非来自公司，而是 YipitData 的 Signals 面板；该面板追踪 900 多家中型市场公司的真实 B2B 软件交易。面板显示，Granola 被观察到的中型市场客户数在 2026 年
              2 月环比增长 25%（CU013），新增总客户数从 2026 年 1 月到 2 月增长 9x，2 月净新增客户达到此前六个月均值的
              4x——这是阶跃式拐点，而非平稳增长（CU014）。货币化正在跟随采用：2026 年 2 月观察到的中型市场支出约 $6,000，较前六个月增长 3x（CU015）。即便如此，YipitData
              提示，三家具名竞争对手——Fireflies.ai、Otter.ai 和 Fathom——中型市场总客户基础仍大于 Granola（约大 20-40%），只是其增长相对放缓，而 Granola
              在加速（CU016）。同一六个月窗口内，员工人数增长 49%，与公司扩张运营以匹配需求相一致（CU017）。合在一起，本章最强、最新的采用信号是独立交易数据，而非公司披露；尽调应谨慎加权这一区别。
