        - 在签署 NDA 的数据室中索取过去 12 个月收入和月度 ARR 桥接表。
      - - 毛利率 / 收入成本拆分
        - 无法判断 LLM 推理和转写供应商成本是否会把利润率压到 SaaS 中位数以下。
        - 索取过去四个季度按供应商拆分的收入成本明细（Deepgram/AssemblyAI、OpenAI/Anthropic 支出）。
      - - CAC / LTV / 回收期
        - 无法验证自下而上 GTM 是资本高效，还是只是增长快。
        - 索取付费营销支出、新增客户数和队列收入曲线。
      - - 净收入留存 / 流失
        - 无法确认 ROI 案例是否会转化为耐久的扩张收入。
        - 索取过去四个季度的队列级留存和扩张数据。
      - - 按层级拆分的付费席位数
        - 无法把标价换算成实际收入估算。
