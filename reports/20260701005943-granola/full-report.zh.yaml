      - number: '3.3'
        title: 能力、定价、GTM / 分发，以及信任 / 隐私姿态
        blocks:
          - type: paragraph
            body: >-
              从原始能力看，单场会议转写这一基础层已经商品化。Otter.ai、Fathom 和 Granola 都在 2026 年各自推出跨会议 AI 聊天或智能体层——Otter 的 AI Chat
              Connectors、Fathom 的全账户 “Ask Fathom”、Granola 自己重建的智能体式 Chat（CP030）；Granola 2026 年 5 月设计文章称，它选择让 Chat 高层读取最多
              100 场会议，而不是完整读取 10 场会议的转写细节，并把这个架构取舍视为战略核心（CP031）。在信任上，Granola 自己的安全文档要求企业买方先申请 Trust Center 访问，才能看到 SOC 2
              报告；Fireflies 和 Otter 则更直接地在公开营销和定价页展示合规声明（SOC 2/GDPR/HIPAA 徽章、HIPAA add-on）（CP032）。


              在定价上，独立厂商标价集中在相似的 $0-$40 每用户每月区间——Granola 自己的销售指南称 Business 计划为 $14 每用户每月（CP050），对比 Fathom 的
              $15-$34、Fireflies 的 $10-$39、Otter 的 $17-$30、Read AI 的 $15-$40（CP033）——而 Microsoft Teams Premium 以 $10
              每用户每月压低所有厂商价格，Gong 按年计则高出一个数量级（CP033）。Otter 和 Fireflies 自己的定价页都显示相对标价有大幅促销折扣（CP036），说明价格竞争活跃，可能长期挤压
              Granola 平直的 $14 标价。分发上，Microsoft、Google 和 Zoom 的功能都搭载在买方已经付费的协作套件订阅里；没有任何独立厂商，包括
              Granola，可以在没有自身分发动作的情况下复制这种渠道优势（CP040）。
