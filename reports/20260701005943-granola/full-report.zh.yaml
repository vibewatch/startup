chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              Granola 是一家 AI 会议笔记创业公司，围绕一句简单定位搭建：没有会议机器人，也能留下笔记、行动项和记忆。官网、产品页和投资人文章都把它描述成有人参与的记事本：产品结合用户输入、AI
              转写和结构化处理，而不是让机器人加入通话并自主总结一切。这个设计选择很关键，因为它同时界定了产品体验和市场类别：Granola 想更接近面向对话的 Apple Notes 或 Notion，而不是一个显眼的
              Zoom copilot。


              截至 2026-07-01 运行日，公司显然已经进入后期私营创业公司阶段。官方和独立的 2026 年 3 月报道都显示，总部在伦敦，支持 macOS、Windows 和
              iPhone，并把业务描述为从个人专业用户记笔记工具扩展到企业会话基础设施。到 2026 年 3 月，Granola 估值已达 $1.5 billion，并把 Spaces、API
              和连接器界面定位为公司会议上下文的操作系统，而不只是独立转写工具。
