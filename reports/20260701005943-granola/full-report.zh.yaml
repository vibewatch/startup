        - 在 NDA 下直接向公司或领投方索取当前 ARR 和同期群收入。
      - - 股权结构和清算优先权堆栈
        - seed / Series A / B / C 各轮清算优先权叠加细节（CV013）。
        - 优先权悬挂会改变普通股 / 创始人和后续投资人的下行保护与有效入场价。
        - 通过公司或 Companies House 文件索取股权结构表摘要或确认声明细节。
      - - 毛利率和单位经济
        - 收入成本、毛利率、CAC 和净收入留存数据（CV048）。
        - 判断 Granola 在依赖 LLM / 转录供应商时，能否守住 SaaS 常见的 70%+ 毛利率。
        - 在 NDA 下向公司索取，或跟踪下一次投资人披露的基准。
      - - 诉讼敞口监控
        - 确认是否已有将 Granola 列名的窃听 / CIPA / 生物识别投诉（CV042、CV045）。
        - Otter.ai 面临的直接同业诉讼说明，风险已在品类层面活跃，并非假设。
        - 每季度跟踪法院文件检索和法律媒体报道。
      - - 下一轮触发点和现金跑道
        - 已披露现金跑道、烧钱率或计划中的 Series D 时间（CV028）。
        - 判断 $125M Series C 能在下一次重估前买来 18 个月，还是 4+ 年跑道。
        - 向公司或领投方索取跑道 / 烧钱披露。
      - - 当前用户 / 客户数
        - 经过验证的当前席位或客户数，需超过 Series A 时披露的 5,000 周活用户数字（CV031、CV030 提供竞争对手规模参照）。
        - 需要用它和 Fireflies（20M 用户）及 Otter（35M+ 用户）对照，校验每用户估值是否合理。
        - 直接向公司索取当前 MAU / 付费席位数。
    notes: 按可能改变估值结论的程度做非正式排序；尽调路径假设公司或领投方配合，因为这些数据今天都未公开披露。
    claimRefs:
      - CV011
      - CV013
      - CV048
      - CV042
      - CV045
      - CV028
      - CV031
      - CV030
