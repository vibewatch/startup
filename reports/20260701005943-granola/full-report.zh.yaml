      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Granola 的市场进入动作是自下而上、产品驱动，而不是销售驱动。Brex 的公开案例最能说明：实施先从部分团队试用 Business 计划开始，随着使用自发扩散，数周内转为完整 Granola
              Enterprise 部署（CI013）；Vercel 案例则描述了整个 GTM 团队采用产品，而不是只有一名内部倡导者（CI014）。Index Ventures
              自己的投资文章把这写成其支持的增长机制：个人用户变成传播者，采用以草根方式从个人扩散到团队，再扩到整个企业（CI017）；Granola
              招聘页也呼应这一叙事，称产品“从领导者快速扩散到整个组织”，同时每天转写数百万分钟对话（CI018）。


              这些信号没有一个以美元计量。无论公司发布还是第三方来源，都没有披露 Granola 的 CAC、LTV 或 CAC 回本周期（CI019）。最接近的标尺来自外部：一份 2026 年 SaaS 基准报告称，PLG
              / 自下而上 SaaS 公司的 CAC 回本周期中位数为 12-15 个月，头部四分位约 9-12 个月，超过 24 个月则被标为风险信号（CI020）；同一报告还指出，风投支持 SaaS
              的销售与营销开支占收入比例中位数，已从 2021 年超过 50% 降至 2024-2026 年约 35-40%（CI021）。这些只是竞品组合基准；它们并不能说明 Granola
              自身获客支出或效率在该区间之上、之内还是之下。客户案例量化的是节省时间（260-830+ 小时），不是节省成本或支付金额（CI015、CI016）。
