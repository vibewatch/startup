          detail: Zoom 2026 年中实际市值只作为成熟、上市、低增长参照锚，不是 Granola 预测（CV035）。
    approximationNotes: 由于 Granola 未披露收入基数，悲观 / 基准 / 乐观三行只是与品类基准挂钩的情景框架，不是折现现金流或 ARR 倍数输出；Zoom 行仅作为公开市场规模锚。
    claimRefs:
      - CV023
      - CV042
      - CV022
      - CV025
      - CV016
      - CV034
      - CV035
  - id: FV004
    title: 投委会 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的评分，覆盖市场、验证、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场动能
          value: Positive
          tone: positive
          detail: Carta 显示，全品类 AI 估值溢价存在，后期倍数也在上行（CV024、CV025）。
        - label: 增长证据
          value: Unverified
          tone: warning
          detail: 季度增长 250% 来自第三方报道（Bloomberg，经 SiliconANGLE 转述），但绝对基数未披露（CV011）。
        - label: 竞争护城河
          value: Weakening
          tone: warning
          detail: 无机器人采集已不再独特；Fathom 和 tl;dv 都能做到；既有厂商把 AI 笔记打包免费提供（CV019）。
        - label: 单位经济性可见度
          value: None disclosed
          tone: negative
          detail: 已审阅来源中没有任何收入、毛利率、CAC 或 NRR 数字（CV011、CV048）。
        - label: 法律 / 监管风险
          value: Elevated
          tone: negative
          detail: 最接近的直接竞品 Otter.ai 正面临窃听 / 生物识别集体诉讼（CV042、CV045）。
        - label: 估值支撑
          value: Stretched
          tone: warning
          detail: 在没有财务披露的情况下，约 10 个月内估值重估 6 倍；与此同时，上市「Productivity Tools」可比组倍数在收缩（CV008、CV026）。
        - label: 证据质量
          value: Medium
          tone: neutral
          detail: 融资历史和可比公司有充分交叉印证；决定估值的关键财务输入仍完全未披露（CV004、CV011）。
    approximationNotes: null
