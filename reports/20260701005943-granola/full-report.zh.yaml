      - number: '6.3'
        title: 具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Granola 最强客户证据是四份公司发布的详细案例研究。Zapier 的 Principal Designer 从个人试用开始，在设计 / 产品 / 工程组织内病毒式扩散，案例称每月节省 830+
              小时，组织级采用率 52%（CU018）。Vanta 的 VP of Customer Success 将 Granola 用于内部 1:1、站会和跨职能同步，明确因为 SOC 2 Type II
              认证和基于同意的录音对安全与合规公司很重要；案例称每位用户每年节省 260+ 小时，组织级采用率 69%，会议可见性提升 61%（CU019）。Brex 的 Head of IT 在员工已自发采用 Granola
              后，把它正式推向全公司；案例称六个月内知识员工采用率超过 50%，每周节省 427 小时（CU020）。Vercel 的销售工程团队用 Granola 替换了更慢的转写工具，并在 discovery calls
              中使用其 “chat with the transcript” 功能；案例称 GTM 团队采用率 100%，每位用户每周节省 11 小时，GTM 生产力提升
              25%（CU021）。关键是，这四个案例都没有披露席位数、合同金额、续约率或流失数据——所有量化收益都是采用率或节省小时数估算，不是与收入挂钩的指标（CU022）。


              独立、非公司撰写的证据佐证了真实但衡量不均的满意度。Granola 的 G2 档案在 2025 年末快照时有 19 条评价、综合评分 4.9/5，评测者覆盖小型企业、中型市场和企业；其中几人的身份通过
              business email、Google One Tap 或 LinkedIn 验证，并标记为 organic、unincentivized，另至少两人披露为评价收到了象征性礼品卡（CU023,
              CU024）。同一批 G2 评测者反复提到具体限制：没有音频 / 视频回放，大型会议里说话人识别不稳定，没有专用 Web 应用，设置问题上的客户支持较慢（CU025）。汇总后的 Product Hunt
              评论也呼应了类似缺口——没有 Android 应用、iPad / iOS 采集限制、账户设置摩擦，以及希望更多集成（CU026）。三份独立专家评测给 Granola 的分数明显低于 G2
              的自选评分，且彼此更不一致：thebusinessdive.com 给 3.6/5，理由是协作和分析功能薄；nubiapage.com 给 4.5/5，提到缺少 Android
              应用、免费层限制不清；bestreviews.net 指出语言支持和说话人识别缺口，但没有给数字评分（CU027）。另一个置信度较低的数据点来自独立 Product Hunt
              社区帖，称面对面、多语言对话采集——例如把日语对话转成英文笔记——是移动端应用一个突出的真实用例（CU028）。四个旗舰账户之外，媒体和投资人报道还点名十个客户标识（Asana、Gusto、Thumbtack、Cursor、Lovable、Decagon、Mistral
              AI、Intercom、Linear、Replit），但没有任何一个附带经独立验证的使用深度、合同或结果细节（CU029）。
