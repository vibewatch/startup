      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Granola 在 2025 年公开披露了三份安全事后复盘，涵盖 AssemblyAI API key 暴露、遗留未托管 Google 账户 workspace auto-join 缺口，以及影响 187
              名用户的 Google Workspace session-logout 漏洞（CR019）。独立安全研究者 Tenable 从外部技术视角佐证了 AssemblyAI key
              暴露，识别出同一个未经认证的端点（CR020）。值得注意的是，三起披露事故全部由外部研究者报告给 Granola，而不是由内部检测捕捉（CR023）；审阅过的来源也没有发现公开 Vulnerability
              Disclosure Policy 之外的独立 penetration-test 报告或 bug-bounty 项目（CR025）——不过，唯一有记录的独立研究发现已经表明，公司服务器端 API
              表面，而不只是客户端应用，至少被探测并利用过一次（CR026）。根据 Granola 自己的描述，三起披露事故都没有暴露实际会议音频或转写内容；这比内容保密性泄露的严重程度明显更低（CR027）。


              可靠性方面，一家独立 uptime 跟踪器在最近 90 天窗口内记录了 4 起 Granola 事故，中位时长约 2.5 小时（CR022），但 Granola 没有发布自己的 uptime SLA
              或事故日志。Granola Enterprise 计划宣传其约三个月拿到 SOC 2 Type II 认证——相较该认证通常需要多季度观察期，这个速度很快——而公司自己的 Security FAQs 又把
              HIPAA 和 FERPA 列为开放合规主题，而非已落定认证（CR021, CR024）。一名低声誉层级的独立评测者另称，Granola 默认通过链接分享用户笔记，且在未 opt-out
              时用转写训练内部模型；如果这一说法具有代表性，会构成有意义的运营和信任风险，但尚未由技术审计独立验证（CR028）。
