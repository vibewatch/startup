  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Granola 通过三个自助 / 企业计划销售，它们同时构成买方分层阶梯：免费 Basic 层；Business 计划，按 Granola 自家销售指南为每用户每月 $14；Enterprise
              计划（定制定价，独立估计约每用户每月 $35），增加 SSO/SCIM、管理员控制和模型训练 opt-out（CU001）。公司 Enterprise
              页面称其“受到技术、金融、媒体等团队信任”（CU002），但本章详细且经独立佐证的证据几乎全部集中在技术和技术相邻公司。G2 评测者覆盖小型企业、中型市场和企业公司规模，行业包括信息技术与服务、金融服务，以及临床
              / 医疗相邻角色（CU003）。独立评测者也反复点名招聘人员、律师、顾问、VC、销售工程师和 IT / 客户成功负责人是 Granola
              核心用户画像——这些专业人士会议频繁、风险高，且常常对保密敏感（CU004）。


              Granola 四个公司发布的详细案例研究可清晰映射到不同买方 / 用户职能：设计 / 产品 / 工程（Zapier）、客户成功领导层（Vanta）、IT（Brex）和销售工程 /
              GTM（Vercel）（CU005）。四家之外，高管猎头公司 Daversa Partners 总裁在 150 名员工中的 136 人部署
              Granola，明确因为无机器人、设备级采集比可见机器人替代品更适合保密候选人与客户对话，侵入感更低——这是一个保密需求尖锐、但在详细证据中尚未被代表的垂直领域（高管猎头）（CU006）。媒体和投资人报道还点名
              Asana、Gusto、Thumbtack、Cursor、Lovable、Decagon、Mistral AI、Intercom、Linear、Replit 为客户，横跨工作管理、人力 /
              薪酬、市场平台、开发者工具和 AI-native 初创公司（CU007）——但这十个客户标识本身也全部是技术或技术相邻公司，进一步强化了详细案例中可见的行业集中。审阅过的来源没有披露 Granola
              的单客户收入、席位数、合同金额，也没有披露其客户基础在英国 / 美国本土市场之外的官方地理拆分；收入区间和地理区域仍是开放尽调问题，而非已回答的分层维度（CU008）。
