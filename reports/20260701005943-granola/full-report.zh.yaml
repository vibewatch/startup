      - number: '1.3'
        title: 融资历史、牵引力与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Granola 的融资弧线压缩得异乎寻常。2024 年 10 月之前，TechCrunch 报道其完成由 Lightspeed 领投的 $4.25M 种子轮。2024-10-23，公司宣布完成 Spark
              Capital 领投的 $20M Series A。2025-05-14，公司发布 Granola 2.0，并同步完成 NFDG 领投、估值 $250M 的 $43M Series
              B。不到一年后，2026-03-25，Granola 宣布完成 Index Ventures 领投、估值 $1.5B 的 $125M Series C，Kleiner Perkins
              和老股东也参与。TechCrunch 与 The SaaS News 均称，Series C 后累计融资达到 $192M。


              公开牵引力信号方向上很强，尽管并不完整。TechCrunch 报道称，到 2024 年 10 月，Granola 约有 5,000 名周活用户，首周复用率 70%，后来周用户基数增长
              10%。BusinessWire 和招聘页称，Granola 每天转写数百万分钟对话。对于一家年轻软件公司，客户佐证异常具体：Vanta、Brex、Zapier、Vercel
              都有公开案例，披露了量化节省时间或清晰的流程改善。股权结构表质量也高——Index、Kleiner、Spark、Lightspeed、NFDG，以及来自 Vercel、Replit、Linear、Shopify
              等公司的运营型天使，既代表资本支持，也带来进入技术团队的强分发邻近性。
