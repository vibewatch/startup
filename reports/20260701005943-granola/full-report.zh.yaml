      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 所有最高风险类别都仍是前瞻性、结构性或可比事件；Granola 自身尚无已兑现事件
            body: >-
              已审阅来源没有发现 Granola 涉诉、遭遇监管执法、披露现金消耗数字，或出现具名非创始人高管。这个缺位本身就是结论：本章排名中严重度最高的事项（wiretap/BIPA
              暴露、资本充足度不透明、供应商与平台打包集中）目前仍属前瞻性、结构性，或来自可比竞争对手诉讼，而不是 Granola 已确认事件。投资决策应因此调低其权重，但不应把它们排除。
            calloutType: risk
            claimRefs:
              - CR017
              - CR041
              - CR052
              - CR018
          - type: callout
            title: 平台巨头正以低于 Granola 收费的增量价格打包 AI 会议笔记功能
            body: >-
              Microsoft Teams Premium（每用户每月 $10）、Zoom AI Companion、以及 Meet 中的 Google Gemini，如今都在 Granola
              自身企业客户已经付费的协作套件内提供 AI 会议笔记功能；其价格低于 Granola $14 Business 计划，或已被打包进去。仅 Zoom 就称 AI Companion
              使用量同比增长超过三倍，竞争对手市场报告还引用其上线五个月内达到 510,000 个账户——这类替代风险不需要 Granola 自身犯错也会兑现。
            calloutType: risk
