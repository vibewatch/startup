          - type: callout
            title: Granola 披露的事件响应是公开且经独立印证的，即便它偏被动
            body: >-
              Granola 为其披露的三起 2025 年安全事件都发布了详细复盘，独立研究机构 Tenable 的发现也与公司对 AssemblyAI
              密钥暴露的说法一致。三起事件都没有暴露实际会议音频或转写内容。模式偏被动——问题是研究人员发现的，而不是内部检测出来的——但这种透明度本身，相比完全不发布复盘的供应商，是一个正面信号。
