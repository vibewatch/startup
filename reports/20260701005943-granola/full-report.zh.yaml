      - number: '5.6'
        title: 信任、安全、隐私、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              Granola 称其已获得 SOC 2 Type II 认证（首次于 2025 年 7 月 7 日宣布）并符合 GDPR，企业采购团队可通过 Trust Center 获取独立审计文档（CE039）。其 Data
              Processing Addendum 将 Granola 定义为客户提交个人数据的数据处理者，并要求在 Personal Data Breach 后“不得无故拖延”通知；同时，Granola
              对自身业务联系人和使用数据另行作为独立控制者（CE040）。一个具体合规缺口仍未关闭：Granola 目前没有 HIPAA Business Associate Agreement。即便其帮助中心另有专门的
              Healthcare & HIPAA FAQ，公司仍在自家博客直接披露这一缺口（CE041）。模型训练方面，Granola Enterprise 计划默认关闭训练，并在合同上禁止 OpenAI 和
              Anthropic 用客户数据训练；免费和标准消费者账户则默认加入匿名化训练，需手动 opt-out（CE042）。


              Granola 维护公开 Vulnerability Disclosure Policy，自 2025 年中以来发布了三份详细安全事后复盘（CE043）。第一起由独立安全公司 Tenable 发现，涉及未经认证的
              API 端点泄露实时 AssemblyAI 转写 key（CE018, CE019）。第二起披露称，在 2025 年 5 月 23 日修复前，workspace auto-join 只检查用户 Google
              邮箱域名是否匹配 workspace 域名，可能让未托管的个人账户自动加入企业 workspace；不过 Granola 自查数据库后称没有 workspace 实际受影响（CE044）。第三起披露称，187
              名从关联 Google Workspace 中移除、暂停或删除的用户仍保留活跃 Granola session，可继续访问历史笔记和转写，直到 2025 年 5 月 28 日至 6 月 2 日部署
              session-validity 检查（CE045）。正面看，Granola 的安全页面和 local-first
              架构博客都称会议音频本身从不存储在任何服务器上——只保留生成的文本——这把未来泄露的爆炸半径收窄到文本，而不是已存音频或生物识别语音数据（CE046）。一个独立开源项目也确认，本地缓存可完全离线读取，无需联系
              Granola 服务器；但 2026 年 3 月本地数据库加密上线后，这条路径已部分被封闭（CE047）。审阅过的来源没有发布 Granola 的独立转写准确率基准；唯一可用数字（约
              94-95%）来自单一竞争对手撰写的评测，只能作为方向性参考（CE048）。Enterprise
              透明度控制——可选的屏幕录制水印，以及转写开始时自动发送的会中聊天通知——补齐了管理员可配置的信任层（CE049）。
