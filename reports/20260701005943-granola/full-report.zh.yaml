      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Index Ventures 支持的论点是自下而上的：个人用户成为布道者，使用从个人扩散到团队，再到整个企业。证据包括 Brex 的 land-and-expand 模式，以及横跨
              Vanta、Zapier、Vercel、Asana、Gusto、Thumbtack、Cursor、Lovable、Decagon、Mistral AI 的具名参考客户名单，再叠加 Bloomberg 报道的
              Series C 前季度收入增长
              250%。反论点有三条彼此不同的线。第一，财务完全不透明：本报告审阅的证据中没有任何收入、ARR、毛利率、现金余额或烧钱数字，审计豁免也封住了近期被动披露的路径。第二，产品商品化：Fathom 和 tl;dv
              已经匹配 Granola 的无机器人定位，Microsoft Teams、Google Meet 和 Zoom AI Companion 又把会议笔记 AI
              分发到买方已经拥有的套件里，且没有增量成本，压窄了论点依赖的差异化窗口。第三，可传导的法律风险：Otter.ai 正面临一项合并联邦集体诉讼，被指在未经同意情况下录音并采集声纹；National Law
              Review、Bloomberg Law、Goodwin Procter 的法律评论把整个 AI 记事类别——包括更不显眼、无机器人的工具——都视为暴露于相同 wiretap
              和生物隐私法规之下。三条反论点单独看都不足以否决投资，但合在一起意味着多头案例依赖的信号（增长率、投资人质量、采用模式）方向上为正，却没有任何一项能对照 Granola 自己的数字独立验证。
