      - number: '6.4'
        title: 留存与韧性
        blocks:
          - type: paragraph
            body: >-
              审阅过的任何来源都没有披露 Granola 的 Net Revenue Retention、Gross Revenue Retention、logo-churn rate
              或平均合同续约率（CU030）。缺少公司披露时，最佳可用留存信号仍是独立交易数据：YipitData 的 B2B 支出面板分析发现，在约 2025 年 8 月至 2026 年 2 月间，Granola
              被观察到的中型市场客户几乎零流失（CU031）。同时，切换模式不对称：采用 Granola 的客户常常放弃 Fathom、Fireflies.ai、Otter.ai
              等竞争工具，反向则很少出现在观察数据中；YipitData 将此解读为主动替代的证据，而不只是试用（CU032）。不过，“近零流失”是单一独立面板给出的定性描述，不是 Granola 或 YipitData
              发布的精确百分比，而且只覆盖 YipitData 跟踪账户中的中型市场细分。


              满意度证据比案例研究或流失数据单独呈现的故事更分裂。Granola 19 条评价得出的 G2 评分为 4.9/5，明显高于两位独立专家评测者按标准化框架测试产品后给出的 3.6/5 和
              4.5/5，说明自选式评价平台评分与上手专家评估，对 Granola 客户到底有多满意并不一致（CU033）。留存风险也有一个有记录的爆点：2026 年 3 月，Granola 加密本地笔记数据库，引发一位知名
              a16z 合伙人公开批评；该 tweet 约 327,000 次浏览、630 次点赞、577 次收藏、177 条回复，发帖人明确向社区征求替代产品推荐（CU034）。独立评论认为，这次反弹暴露了“一个已让
              Granola 用户暗中沮丧数月的问题”，问题源于失去本地文件和 API 访问，而这些访问此前支撑了构建在 Granola 之上的个人自动化和 AI-agent 工作流（CU035）。TechCrunch
              报道确认，反弹不止来自这位 a16z 合伙人，也包括其他用户；Granola 联合创始人的回应是承诺推出新的 personal 和 enterprise
              API，恢复程序化数据访问（CU036）。没有来源量化有多少客户（如有）因此实际离开 Granola——案例研究中的采用率（52%、69%、超过
              50%、100%）只衡量某一时点的组织级使用深度，不衡量续约或多周期留存，也无法回答这个问题（CU037）。
