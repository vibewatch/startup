  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 无 bot 本地采集是 Granola 核心差异化
        - Fathom 和 tl;dv 现在都已推出无 bot 或“无需 bot”采集选项，Otter 基于 bot 的工作流反映的是选择，而非技术限制
        - 高
        - 要求 Granola 提供证据，证明无 bot 采集相较 bot 可选竞争对手，具体带来留存或赢单率优势
      - - Granola 的智能体式 Chat 和 Spaces/API/MCP 扩展，构成耐久的上下文层护城河
        - Otter 2026 年 4 月重新发布已推出等价 MCP 客户端 / 服务器和 AI Chat Connectors，Fathom 也已提供账户范围“Ask Fathom”和 MCP 支持
        - 高
        - 索取 Granola 自身 Chat/Spaces 采用率与留存数据，并与对手智能体功能对比，检验护城河来自架构还是执行速度
      - - 既有厂商捆绑功能压住独立定价权
        - Microsoft、Google、Zoom 都在已购买订阅中包含会议笔记 AI，且 Zoom 报告 AI Companion MAU 同比增长超过三倍
        - 高
        - 专门量化与捆绑式在位功能竞争时的胜负率，而不是只对比其他独立厂商
      - - Granola 的信任基础能撑住企业销售
        - 一份独立评测将 Granola 在托管 / 数据驻留等企业就绪度上评为 3/10；报道显示，它「默认私密」的营销说法与实际默认设置之间存在落差
        - 高
        - 索取更新且注明日期的 SOC 2 报告，并要求其直接书面确认当前托管区域以及默认分享 / 训练设置
      - - Granola 的本地优先、加密笔记存储抬高了切换成本
        - 一位知名投资人公开批评 2026 年 3 月本地数据库加密调整降低了数据可携性；独立博客也认为，这让这款应用对重视可携性的用户「价值归零」
        - 中
        - 确认 Granola 是否提供完整保真的导出路径，并跟踪加密调整后的流失信号
      - - 独立 AI 笔记是一个耐久、可单独收费的品类
        - 一份厂商发布的 2026 年市场报告称，转写在全行业已以 95%+ 准确率商品化；TechCrunch 报道，多家竞争对手的竞争重心正在同时转向行动导向工作流
        - 中
        - 跟踪 Granola 自身的行动导向功能（Briefs、Recipes、CRM 推送）采用速度是否可衡量地快于 Otter、Fireflies 或 Read AI 的同类工作流功能
      - - Granola 能守住由 SMB / 创始人主导的客群，不被 Gong 式上市场竞争者挤压
        - Gong 的成本结构只适用于大型 SDR 组织，但 Fathom、Fireflies、Otter 都已推出销售辅导 / 分析功能，从低端收窄这道差距
        - 中
        - 评估 Granola 是否计划自行加入销售辅导功能，还是有意把这一客群让给 Fathom/Fireflies/Otter
    notes: 本登记表聚焦最可能改变承销假设的耐久性问题，而不是逐项罗列所有战术层面的功能对战。
