companyProfile:
  summary: >-
    Granola 是一家总部位于伦敦、在英国注册的 AI 会议笔记公司，由 Chris Pedregal 和 Sam Stephenson 于 2023 年 3 月创立。它的无机器人记事本把用户输入的笔记、实时 AI
    转写（Deepgram、AssemblyAI）以及 OpenAI/Anthropic 模型融合成结构化会议回顾，并通过 Spaces、个人和企业 API、MCP 与 Briefs 扩展为全公司的会议上下文层。Granola 从
    2024 年 5 月公开发布，到 2024 年 10 月完成 $20M Series A、2025 年 5 月以 $250M 估值完成 $43M Series B，再到 2026 年 3 月由 Index Ventures
    领投、估值 $1.5B 的 $125M Series C；累计披露融资 $192M。公开客户佐证覆盖 Vanta、Brex、Zapier、Vercel、Asana、Gusto
    等技术行业客户，但公司没有披露收入、ARR、毛利率、员工数或席位数；英国小公司审计豁免意味着近期法定文件也不会披露这些指标。
  foundedDate: '2023-03-01'
  founders:
    - name: Chris Pedregal
      role: 联合创始人
      background: 此前创办 Socratic，2018 年被 Google 收购；随后在 Google 的 Area 120 孵化器内部打造 Stack，之后该产品并入 Google Drive。
