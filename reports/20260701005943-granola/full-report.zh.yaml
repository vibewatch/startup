  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、捆绑式既有厂商、相邻会话智能、硬件进入者与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Granola 自己的 “AI Meeting Assistant - Without the Bot”
              页面围绕一个轴线定义整个竞争类别：竞品工具是否以可见机器人身份加入通话，还是在本地无机器人采集音频（CP001）；该页面还声称，在列出的选项中，Granola
              是唯一默认保持笔记私密且无需可见机器人的产品（CP002）。这个框定在 Granola 发布时是准确的，但到 2026 年已经不再是清晰差异点。tl;dv 现在向超过 2 million 用户宣传 “NO BOT
              REQUIRED”（无需机器人）选项（CP003），Fathom 自己的 2026 年定价页也在个人层级中提供“无机器人（beta）或机器人采集二选一”（CP004）。按声称用户数看，Otter.ai
              是最大的独立竞品，仍默认使用连接日历的机器人，自动加入 Zoom、Microsoft Teams 或 Google Meet（CP005）；因此，无机器人 /
              基于机器人的分界越来越是在区分产品选择，而不是区分类别。


              除了直接软件同行，Granola 至少还面对另外四类替代。捆绑式既有厂商——Microsoft Teams/Copilot、Google Workspace/Gemini 和 Zoom AI
              Companion——在大多数买方已经付费的订阅里提供可比的记笔记功能。Gong 相邻但不同，是为大型销售组织打造的高得多 ACV 会话智能平台，而不是轻量记笔记（CP021）。TechCrunch 2026 年
              3 月的硬件综述直接把 Granola 与 Read AI、Fireflies、Fathom 并列，称一批增长中的可穿戴和口袋式 AI
              记笔记设备可以替代这些数字竞品，用于线下采集（CP006、CP028）。最后，一些对隐私敏感的用户面对任何厂商托管的笔记数据库——包括 Granola 自己的数据库——都会回到本地 markdown
              文件或通用笔记 app，让“没有专用工具”持续成为现状替代品（CP029）。合在一起，本章把买方的真实选择集视为五个结构不同的类别：直接无机器人 / 可选机器人同行、捆绑式既有厂商、相邻高 ACV
              类别、可能的硬件进入者，以及内部自建 / 维持现状选项（CP048）。
