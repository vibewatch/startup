        - 预计 Series D 窗口（约 2027）之前仍零财务披露
        - 当前投资判断所依赖的增长说法无法独立核验（CV011、CV028）。
        - 维持 research-more/track；不要上调到 buy。
      - - 竞争对手以更低价格推出明显更强的无 bot + 企业 API 组合
        - Fathom、tl;dv、Otter 或捆绑型既有厂商在两个价格档内达到功能平价
        - 核心价值主张沦为商品，任何溢价倍数都难以支撑（CV019）。
        - 下调估值立场；重估竞争护城河。
      - - 首份审计或投资人披露财务显示毛利或烧钱承压
        - 首份披露财务显示毛利率显著低于约 70% SaaS 下限，或现金跑道偏短
        - 把今天的不透明风险变成硬数据点，且可能为负面（CV010、CV048）。
        - 用真实财务重新跑估值模型；建议可能上下调整。
      - - 战略收购接洽报价低于上一轮一级市场融资
