      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Crunchbase 的 2026 年 IPO 候选方法依赖已披露融资、增长信号、投资人组合和市场时机；其重点候选公司，例如 Databricks（收入 run-rate $4.8B、同比增长 55%+、净留存
              140%+）和 Canva（年化收入 $3.3B、月活用户 240M），展示了接近 IPO 准备度所需的规模与披露画像。Granola
              没有披露这一框架依赖的任何指标，因此无法按同一基准评估其公开上市准备度，也没有来源证明具体的下一轮融资触发条件或时间线。补上这一缺口，是单项价值最高的尽调动作：一旦披露 ARR 或收入数字，本分析就能用
              $1.5B 价格计算实际倍数，而不是只从类别基准推理。除收入披露外，剩余高价值尽调问题还包括 cap table 与 preference stack
              细节（理解四轮融资中嵌入的下行保护）、毛利率和单位经济可见度（鉴于依赖第三方 LLM 推理与转写供应商）、持续监测 wiretap/生物识别诉讼暴露（最接近直接同业已有活跃先例）、runway
              与下一轮时间的清晰度，以及经验证的当前用户数或客户数，用来把每用户估值与 Fireflies 披露的 20M 用户和 Otter 披露的 35M+ 用户基础做合理性校验。
