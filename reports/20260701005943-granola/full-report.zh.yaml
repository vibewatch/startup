      - number: '4.3'
        title: 成本结构与毛利驱动
        blocks:
          - type: paragraph
            body: >-
              Granola 自己的安全页面是本章最重要的成本结构披露：它点名 Deepgram 和 AssemblyAI 为第三方转写提供商，OpenAI 和 Anthropic 为用于转写和总结会议的第三方 AI
              提供商（CI022）。由于这两类输入是授权采购，而不是建立在自有基础设施上，Granola 的收入成本很可能随使用量联动——跟着会议量和笔记长度增长——而不是像更简单 SaaS
              产品那样主要是固定托管成本（CI023）。除此之外，Granola 要求企业买方采用 SSO/SAML、SCIM 账号配置、管理员仪表盘和加密，并称自己持有 SOC 2 Type II
              认证（CI026）；这些都代表持续的安全工程投入，叠加在核心转写 / 推理成本基础上。2026 年 3 月，Granola 加密本地笔记数据库的决定因打断第三方智能体工作流而遭 a16z
              合伙人公开批评，又增加了尚未量化的工程和信任修复成本（CI031）。


              没有来源披露 Granola 自己的毛利率、收入成本或运营费用拆分；TheNextWeb 的 Series C 报道直接称，Granola
              没有公开披露收入数字、用户数或留存指标（CI027）。外部基准显示，SaaS 订阅毛利率中位数约 76%（头部四分位 84%+），但也明确提示，计算或 AI 推理成本重的产品常低于
              70%（CI024）——这正切中 AI 转写产品的结构。Zoom FY2026 10-K 报告毛利率从 75.8% 提升到 77.0%（CI025），只能作为成熟上市协作软件对比，而不是 Granola
              数据点。结构上，Companies House 确认 Granola Labs Ltd 已为 FY2024 和 FY2025 提交 “total exemption full
              accounts”，这是英国小公司豁免，取消了近期发布营业额或利润的任何法定义务（CI028）；因此，这种不透明应被理解为结构性申报状态，而不是公司刻意回避。
