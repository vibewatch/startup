      - number: '8.6'
        title: 建议、风险评级与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              一边是 $1.5B 估值却零收入披露，一边是私募市场仍普遍支撑 AI 倍数上行，但 Granola 相邻的公开市场「Productivity Tools」类别倍数已经开始压缩，同时全行业 down-round
              比例仍有 11.4%。权衡后，证据支持继续研究建议：中等信心、高风险评级、估值偏紧——不是买入，也不是回避，因为增长和采用信号方向上真实，尽管无法验证。六个论点破裂触发器会迫使立即重估：直接点名 Granola
              的 wiretap 或生物隐私投诉；披露 down round 或低于 $1.5B 的二级交易；下一轮融资周期仍然零 ARR/收入披露；竞争对手以更低价格推出显著更强的无机器人 + API
              技术栈；首份审计财务显示利润率或烧钱承压；或战略收购报价低于上一轮一级融资价格。截至本次运行的证据，这些触发器都尚未触发；但每一项都可以独立监测，一旦任一发生，建议应立刻重审。
