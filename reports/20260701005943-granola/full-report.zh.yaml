      - - Fireflies.ai（直接竞争对手）
        - 要约收购，2025-06-12
        - 估值 $1B+；自 2023 年起盈利；2021 年以来未再募集一级资本（CV029, CV030）。
        - 能力最接近的可比公司；通过二级流动性而非一级融资轮达到独角兽估值。
        - 估值依据是要约收购，不是公平交易的一级融资；未披露 ARR 倍数。
      - - Otter.ai（直接竞争对手）
        - ARR 披露，2025 年 3 月
        - 已披露 $100M+ ARR；本轮研究未能佐证当前估值（CV031、CV033）。
        - 直接同业中披露收入数据最强的品类龙头。
        - 没有估值数字，无法计算倍数；最后一次已知估值标记来自 2021 年，本次未确认。
      - - Notion（相邻 AI 生产力）
        - 员工股份出售，Dec 2025
        - $11B 估值（CV034）。
        - 相邻 AI 生产力赛道里规模大得多的可比私营公司，可作为品类估值上限参照。
        - 产品更宽，覆盖工作区 / 数据库，不是可一一对应的点解决方案；规模差距约一个数量级。
      - - Zoom Communications（上市可比公司）
        - 市值 / TTM 收入，mid-2026
        - $25.31B 市值对应 $4.93B 收入（约 5.1x P/S）；毛利率 77.0%（CV035、CV036）。
        - 成熟上市协作软件公司，已打包 AI 会议功能。
        - 低增长（约 5% YoY）、盈利、上市公司画像，与 Granola 声称的私营阶段超高增长不具可比性。
      - - Salesforce / Fin（M&A 先例）
        - 收购，2026-06-15
        - 服务 30,000+ 家企业的 AI 客服智能体平台，收购价约 $3.6B（CV037）。
        - 说明在相邻品类中，已验证且已部署到企业的 AI 智能体平台，战略买家愿意出到什么价格。
        - 垂直领域不同（客服 vs. 会议笔记）；未披露收购价 / 收入倍数。
      - - Applied AI / Productivity Tools 品类（分析师基准）
        - Q1 2026 倍数分散度
        - 同一品类上市公司倍数压缩时，私营「Productivity Tools」估值仍在上升（CV026、CV027）。
