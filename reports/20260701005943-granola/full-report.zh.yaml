  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排名概览
        blocks:
          - type: paragraph
            body: >-
              本章按发生可能性、严重性、缓解成熟度和剩余暴露，对 Granola 的法律、监管、运营、技术、财务、合作伙伴、客户和执行风险排序。依据包括主要法规与监管指南（英国 ICO、EU AI Act、California
              wiretap statute、Illinois biometric-privacy law、HHS HIPAA Privacy Rule）、同类 AI 会议记录工具的诉讼与律所分析、Granola
              自身安全事后复盘和合规页面，以及前文收集的独立财务、竞争和员工数据。综合权衡后，优先级最高的风险类别是：合作伙伴 / 供应商集中与平台捆绑替代、财务和资本充足性披露不透明、法律 /
              监管同意与隐私暴露、反复由外部发现的运营 / 安全事故，以及执行 / 治理披露缺口（CR058）。审阅过的来源没有发现 Granola 涉诉、监管执法行动、已披露现金 / burn
              数字，或具名非创始高管——这意味着本排名中几个最严重项目目前仍是前瞻性或结构性风险，而非已经发生；每项都有可监测的尽调路径，但没有公司披露的量化阈值（CR059）。下方风险热力图绘制了后续各节展开的八类风险在发生可能性、严重性、缓解成熟度和剩余暴露上的位置。
