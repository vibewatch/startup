      - number: '2.2'
        title: 规模测算：用一组估算取代一个宽泛数字
        blocks:
          - type: paragraph
            body: >-
              没有单个 TAM 数字能公平代表 Granola 的机会，因为发布方对类别边界本身就有分歧。宽口径“AI meeting assistant”视角把转写、日程安排和分析打包在一起，将 2025 年全球市场估为约
              $3.14 billion（The Business Research Company）、$3.47 billion（Grand View Research；由于原始报告被机器人挑战拦住，此处来自 GII
              Research 摘要）和 $3.50 billion（Statifacts）；各发布方分别预计市场到 2030 年达 $9.33 billion、到 2032 年达 $17.55 billion、到 2033
              年达 $21.48 billion，CAGR 为 24.3% 到 25.9%。更窄、专门隔离独立“AI note-taking”软件的视角小五到七倍：Congruence Market Insights
              将该类别规模估为 2024 年 $450.7 million，到 2032 年增至 $1.80 billion（18.9% CAGR）；Precedence Research 估为 2025 年 $623.5
              million，到 2035 年增至约 $3.48 billion（18.75% CAGR）。Startup Fortune 引用的第三个独立来源估算称，PitchBook 将“AI transcription
              and meeting intelligence”2024 年估值定为 $3.5 billion，到 2030 年增至 $11.8 billion；这个数字更接近宽口径而非窄口径。


              审阅到的每个视角都指向持久的两位数增长，但没有一个隔离出 Granola 自己可服务的市场。本研究集中没有公开来源披露 Granola 的收入、ARR 或付费席位数，因此无法推导公司特定的 SAM 或
              SOM；这里将其保留为开放尽调问题，而不是猜一个数字。承销时的实际结论是：把宽口径视为类别顺风的外边界，把窄口径视为独立记笔记软件需求的更近似（但仍通用）代理，再按既有厂商捆绑功能已经免费满足的未知需求份额，对两者都打折。
