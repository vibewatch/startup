      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Granola 的上下文层押注是真实的，但已经不是孤注一掷
            body: >-
              Granola 从单场会议笔记转向 Spaces、API 和 MCP，是对转写商品化的可信战略回应；但 Otter.ai 自己 2026 年 4 月的重启和 Fathom 的全账户 “Ask Fathom”
              显示，至少两个资源充足的对手也在同时冲向同一跨会议智能体层。
