      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景要求已报道的 250% 季度增长率在近期延续，Brex 式 land-and-expand 模式能推广到具名企业客户名单，并且 Series C 同步推出的个人 / 企业 API
              和管理后台能带来真实扩张收入；如果公司最终披露 $100M ARR 基础，套用分析师引用的 8x-20x Applied-AI 倍数区间，将支持 $1.5B-$2.0B 以上结果，与实际 Series C
              价格相符。基准情景假设增长放缓到后高速增长 SaaS 常见的 40-60% 同比区间，下一轮定价持平到小幅上行；这与 Carta 2026 年 Q1 数据所示 Series C 一级估值全行业同比上涨 12.5%
              相一致。熊市情景假设增长急剧放缓，同时 Carta 显示的 11.4% 全行业 down-round 比例，以及针对最接近直接同业 Otter.ai 的现行 wiretap
              诉讼先例，共同把下一轮融资推向持平或下行。两组类别层面数据框定三种情景：Carta 显示 AI Series A 公司定价中位数为 $300M，非 AI 同业为 $55M，证明 Granola 所处轮次内有广泛
              AI 溢价；Finro 2026 年 Q1 数据则显示，公开市场「Productivity Tools」倍数在压缩，同一类别的私募轮仍继续拿到溢价——这种背离之所以重要，正因为 Granola 仍是私营公司。
