      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Granola 的公开客户案例显示，多个不同买方细分里都出现了相似的自下而上采用模式，而不是一套统一的企业销售。在 Brex，IT
              负责人是在发现销售、工程和支持团队已由员工自发采用之后，才把全公司访问正式化；批准推广前，还要求 SOC 2 Type 2 合规、SSO 和 SCIM。在 Vanta，买方是客户成功副总裁，需要替代每天 1:1
              和跨职能同步中人工对齐现场笔记与原始转写稿的工作。在 Zapier，一名 Principal Designer 采用 Granola，为设计团队搭建共享、可搜索的知识库；在
              Vercel，一名销售工程师需要更快、可搜索的通话回顾，以跟上潜在客户跟进节奏。Granola 自己的用例页面进一步把 Product Managers、Designers 和 Product Leaders
              放在一类工作流里（客户研究库反哺路线图决策），把 Account Executives 放在另一类工作流里（通话回顾同步到 HubSpot、Affinity、Attio 或 Zapier 等 CRM）。


              证据中还出现了一个高度重视私密性的细分：Granola 自己关于 second-brain 工作流的博客强调，风投合伙人用捕捉到的会议上下文加速投资委员会备忘录写作；混合团队指南则引用高管猎头公司 Daversa
              Partners，该公司在 150 名员工中有 136 人采用无机器人采集，原因正是在保密 CEO 搜索中，可见机器人参与者会显得唐突。公司自己的指引也在销售场景中按规模划线：15 名销售代表以下的创始人与
              SMB 团队，被引向 $14 每用户每月的 Business 计划中的轻量 AI 记事本；30 名以上销售代表且有专职销售赋能经理的团队，则被引向 Gong
              式会话智能。横跨这些细分，采用路径相当一致：个人先试用无机器人采集模式，使用在团队内非正式扩散，IT 或安全审查引入合规要求，之后才形成正式、有预算的企业部署；部分账户随后进一步扩展到 API、Spaces
              和智能体集成。
