  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Granola 的技术栈从本地设备采集出发，经第三方 ASR/LLM 推理，到加密云存储和代理集成层，外面包着企业管理 / 控制层。
    data:
      layers:
        - id: capture
          label: 采集层
          detail: 在 macOS/Windows（Electron）和原生 iOS 上采集本地麦克风 + 系统音频；手动启动，没有自动入会机器人。
        - id: transcription
          label: 转录层
          detail: 通过第三方 Deepgram 和 AssemblyAI ASR 供应商做实时语音转文字。
        - id: reasoning
          label: AI 推理层
          detail: OpenAI 和 Anthropic LLM API 支撑笔记增强、代理式 Chat、Briefs 和 Recipes；完整转录稿与压缩笔记上下文之间的取舍是明确的设计权衡。
        - id: storage
          label: 存储层
          detail: AWS 托管的美国 VPC（加密转录稿 / 笔记、每日备份、不存储音频）加上加密的本地设备缓存（cache-v3.json）。
        - id: integration
          label: 集成 / 代理层
          detail: >-
            Granola MCP（Model Context Protocol）、Zapier（8,000+ 个应用）、原生 Slack/Notion/CRM 连接器、Personal 和 Enterprise Admin
            API。
        - id: admin
          label: 企业管理 / 控制层
          detail: SSO/SAML、SCIM 配置、域名管理、留存政策、管理后台、参与者通知和水印控制。
    approximationNotes: 各层综合自 Granola 自有安全 / 企业页面、工程博客、独立安全研究拆解和第三方开源客户端，并非来自单一官方架构图。
