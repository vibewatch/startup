      - number: '5.3'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              Granola 桌面客户端是为 macOS 和 Windows 打包的 Electron 应用——这一点既有 Granola 自家工程博客谈到定制 dock / taskbar 图标的难度，也有安全研究公司
              Tenable 拆包 macOS .asar 档案查看客户端 JavaScript 的独立确认（CE016）。核心 AI 管线完全依赖供应商：转写由第三方 ASR 提供商 Deepgram 和
              AssemblyAI 执行，笔记增强、聊天和摘要则调用第三方 OpenAI 和 Anthropic LLM API；这是公司公开说明的架构，也得到 Tenable 在客户端中发现 AssemblyAI 引用和实时
              API key 的佐证（CE017）。同一份 Tenable 研究发现了具体漏洞：一个未经认证的 api.granola.ai 端点（“get-feature-flags”）返回实时 AssemblyAI
              key，可被用来直接从 AssemblyAI 自己的 API 拉取会议转写 ID 和内容（CE018）；Granola 后来的事后复盘确认，2024 年 11 月至 2025 年 3 月期间约 300-333 名
              iOS TestFlight beta 测试者受影响，除研究者测试外没有被利用的证据（CE019）。


              在设备端，Granola 将会议元数据、转写文本和 AI 摘要存入本地应用缓存文件（cache-v3.json），内部是嵌套的 “double-JSON” 结构；一个独立开源 Python
              项目完全离线逆向了该结构，没有调用 Granola 自家服务器（CE020）。同一项目还记录了另一条非公开路径：从本地 supabase.json 配置文件提取 session token，直接调用
              Granola 云端 API；维护者出于隐私和可靠性考虑没有实现（CE021）。2026 年 3 月，Granola 加密了本地数据库，一位知名 a16z 合伙人公开批评（该 tweet 约 327,000
              次浏览）此举切断了此前可直接读取明文缓存文件的第三方 agent（CE022）；Granola 联合创始人指向 Granola MCP 作为替代路径，但批评者反驳称 MCP 需要支持 MCP
              的特定客户端，而不是开放文件或 API 访问，底层争议仍未解决（CE023）。Granola 自家工程博客用 2026 年 4 月 agentic Chat
              重构背后的取舍说明了同类问题：读取完整转写比读取压缩笔记大约多消耗 10x token，跨会议 agent 查询必须在深度和成本之间明确取舍（CE024）。Granola MCP 于 2026 年 2 月 4
              日发布，实现开放的 Model Context Protocol，让 Claude、ChatGPT、Cursor、Claude Code 等工具能把用户笔记作为上下文查询；但 Enterprise MCP
              访问仍是默认关闭的 early-access beta（CE025）。已存储数据——转写、笔记、AI 摘要——位于 AWS 托管、美国区域的 Virtual Private
              Cloud，静态和传输中加密，每日备份；原始音频完全不存储（CE026）。认证通过绑定用户日历的 Google Workspace 或 Microsoft OAuth 完成（CE027）。
