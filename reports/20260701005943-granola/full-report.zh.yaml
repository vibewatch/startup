      - number: '5.4'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              Granola 的公开发布历史显示，自 2024 年 7 月桌面端上线后，功能交付几乎按月推进：伴随原始 notepad 的 $20M 融资（2024 年 11 月）、原生 iOS 可用（2025 年 5
              月）、Windows 可用并完成 SOC 2 Type II（2025 年 7 月）、Recipes（2025 年 9 月）、Granola MCP（2026 年 2 月）、$125M Series C（2026
              年 3 月）、agentic Chat 重构（2026 年 4 月）以及 Briefs（2026 年 5 月）（CE028）。集成表面同步扩张：Slack 发帖（2024 年 10 月）、Notion
              分享（2025 年 3 月），以及 Zapier 将 Granola 连接到 8,000+ 个应用并接入 Attio 和 HubSpot（2025 年中后期）；这些都记录在 Granola 自己的
              changelog 中（CE029）。


              但可靠性可见度很薄，且主要来自第三方。一个独立 uptime 监控聚合器记录了运行日前 90 天内 Granola 的 4 起事故，中位解决时间约 2 小时 34 分钟，包括一次 iOS 转写中断（2026 年
              6 月 25 日）、一次因 “broken deployment” 导致的 Granola Chat 中断（2026 年 3 月 10 日），以及——值得注意的是——一次 Claude 用户无法连接
              Granola MCP 的独立事故（2026 年 3 月 9 日）。这是 MCP 集成层存在自身运营故障模式的第一条直接证据（CE030）。审阅过的来源没有披露 Granola 发布的 uptime SLA
              或公司维护的公开状态页；目前唯一事故可见性来自这个非关联第三方监控器（CE031）。部署侧还存在两个路线图缺口：尽管团队名册中有 Android Engineer，Android
              应用仍未发布，也没有日期（CE032）；Granola 自己的 MCP 公告明确把“高级访问控制、使用监控与分析、更高速率限制、灵活定价选项”标为待推出，而不是已交付的 Enterprise MCP
              能力（CE033）。平台推出本身也是顺序推进而非同步——iOS 于 2025 年 5 月（CE050）、Windows 于 2025 年 7 月（CE051）——当下 iOS 分发完全依赖 Apple App
              Store 审核和政策环境，这是识别出的唯一公开 iOS 渠道（CE052）。
