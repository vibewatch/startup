    rows:
      - - 正向论点：自下而上的病毒式采用转化为持久企业收入
        - Index Ventures 将有机、内部布道者主导的采用描述为核心增长驱动；Brex 式先落地再扩张模式在多个章节被引用（CV016, CV017）。
        - 披露 logo 级留存或扩张收入数据，确认该模式能从少数具名账户推广到更广客户。
      - - 正向论点：品类级 AI 估值溢价支撑偏高的私募估值
        - Carta 数据显示，同阶段 AI 初创公司相较非 AI 同行普遍享有大幅估值溢价（CV024, CV025）。
        - 有证据表明该溢价属于 Granola 特有，而不是可能退潮的品类大潮。
      - - 反向论点：财务完全不透明
        - 本报告任何位置都未披露收入、ARR、利润率或烧钱数字；英国小公司审计豁免封死了短期强制披露路径（CV010, CV011, CV018）。
        - 披露 ARR、经审计账目，或投资者来源的收入估计。
      - - 反向论点：产品商品化
        - Fathom 和 tl;dv 已匹配 Granola 的无 bot 定位；Microsoft、Google、Zoom 把会议笔记 AI 捆进买家已拥有的套件（CV019）。
        - 有证据表明 Granola 的上下文 / API 层能制造转换成本，且这种成本不是单靠无 bot 采集就能形成。
      - - 反向论点：可传导的法律 / 监管风险
        - Otter.ai 面临合并审理的窃听 / 生物识别集体诉讼；法律评论认为整个笔记品类都有敞口，包括不那么显眼的无 bot 工具（CV020, CV042, CV045）。
        - 在明确监控窗口（如 12 个月）后，仍没有直接点名 Granola 的窃听 / 同意投诉。
    notes: 每行把正向或反向论点、背后的具体证据，以及需要跟踪的证实 / 证伪信号配对。
