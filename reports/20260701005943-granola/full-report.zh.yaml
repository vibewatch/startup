        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概况章节记录了 Granola 的完整融资时间线；本章只重述评估未来资本充足性所需的事实。公司于 2026-03-25 宣布完成 $125 million Series C，由 Index Ventures
              领投，Kleiner Perkins 与老股东 Lightspeed、Spark、NFDG 参投，投后估值 $1.5 billion（CI038）。TechCrunch 和 The SaaS News
              都称融资后累计融资 $192 million，而 BusinessCloud 报道的则约为 $188 million——这是发布方之间围绕 Granola
              自身累计总额的小但真实差异（CI040）。资金用途只被宽泛说明：StartupRise 报道只给出“扩展产品并支撑持续增长”这类通用表述（CI041）；Granola 自己的 Series C 文章则围绕发布
              Spaces、API、更新版 MCP server 和管理员使用可见性来描述融资，而不是给出数字化预算拆分（CI042）；Bloomberg 另报道称 Granola
              计划继续招聘，这与招聘页开放职位一致（CI043）。


              没有来源披露现金余额、月度烧钱速度或现金跑道（CI044）。作为一家提交豁免小公司账目的英国私人公司，Granola 近期没有法律义务公开这些指标。审阅到的 Companies House
              申报历史列出确认声明、账目、PSC 和高管申报，但没有登记的有担保债务押记；这与迄今为止全股权资本结构一致，尽管这反映的是申报历史摘要，而非专门调取押记登记册（CI045）。Granola
              及其投资人都没有公开下一轮触发条件；Index Ventures 和 Kleiner Perkins 的文章转而把本轮描述为多年上下文层建设（CI046）。这种表述并没有阻止公开质疑：TheNextWeb
              指出，在没有披露收入、用户或留存的情况下，估值十个月内跳升六倍（CI047）；一家声誉较低的媒体 BritishWire 又放大了互联网泡沫类比，质疑 Granola 最终收入能否支撑十位数估值（CI048）。
