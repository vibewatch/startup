      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              AI 会议笔记软件的结构性需求驱动看起来持久。Microsoft Work Trend Index 遥测显示，平均 Microsoft 365 用户在核心工作时段每两分钟就被会议、邮件或聊天打断一次（每天 275
              次），57-60% 的会议是临时或 ad hoc 会议，近三分之一会议现在跨越多个时区，比 2021 年上升 35%。Granola 自己的混合团队指南引用 Gallup 调查数据称，美国可远程办公员工中，52%
              现在采用混合安排，26% 完全远程，持续支撑对可靠捕捉现场和远程音频工具的需求。Granola 引用的一项来自 IDC 的估算认为，Fortune 500 公司每年因机构知识流失付出 $31.5 billion
              成本；这强化了 Granola 2026 年 3 月从个人记事本扩展到 Spaces、API 和 MCP 连接器的商业逻辑：目标是捕捉并复用组织上下文，而不只是单次会议。


              约束也同样具体。Microsoft、Google 和 Zoom 都把免费的 AI 会议笔记功能直接捆绑进许多买方已经付费的订阅中，这压低了独立厂商仅凭记笔记能收取的价格，并推动 Granola
              这类公司转向差异化上下文和智能体工作流，以证明单独预算项合理。公开记录中也能看到信任和监管摩擦：Startup Fortune（引用此前 The Verge 报道）发现，Granola
              默认向任何持有分享链接的人暴露笔记，并在用户未退出时用转写稿训练；BuildBetter 的独立评测给 Granola 企业就绪度打出 3/10，理由是只用美国 AWS 托管，没有欧盟区域或本地部署选项；2026
              年 3 月，Granola 加密本地笔记数据库的决定在一个广泛传播的社交帖子中遭到 a16z 合伙人 Guido Appenzeller 公开批评，促使一些用户考虑基于 markdown
              的替代方案。单看任何一项约束都不致命，但合在一起说明，Granola
              的增长取决于同时补上信任、数据驻留和锁定缺口；与此同时，捆绑式既有厂商正在把基础记笔记功能商品化。两个规模问题仍真正开放，因此保留而不估算：宽口径分析师估算市场中，有多少已被既有厂商捆绑功能而非独立厂商捕获；以及
              Granola 自己的 SAM/SOM 会更接近宽口径还是窄口径分析师视角。
