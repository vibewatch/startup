      - number: '5.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 无机器人架构真实存在，并得到独立佐证
            body: >-
              Granola 的本地采集、零音频留存设计不只是营销：一名独立安全研究者对 Mac 客户端的拆解，以及另一个开源项目对本地缓存的逆向工程，都确认了 Granola 所描述的架构；公司也把三个月完成 SOC 2
              Type II 认证、而不是通常 12-18 个月，归功于这套设计。
            calloutType: strength
            claimRefs:
              - CE016
              - CE017
              - CE034
          - type: callout
            title: 一年三份公开事后复盘，两起来自同一根因
            body: >-
              Granola 约一年内公开披露了一次 AssemblyAI API key 暴露，以及两起独立 Google Workspace 账户状态缺口，且全由外部发现，而非公司主动发现。这一模式——尤其两起不同的
              Google Workspace 访问控制失败——提出了一个问题：相邻认证流程中是否还有未披露问题。
            calloutType: risk
            claimRefs:
              - CE018
              - CE019
              - CE044
              - CE045
          - type: callout
            title: “默认私密”遭到质疑，HIPAA / EU 托管缺口仍未补上
            body: >-
              独立报道称，默认情况下笔记可通过链接分享给任何拿到链接的人，除非用户更改设置，这与 Granola 自己“默认私密”的信息直接相冲突。另一个缺口是，Granola 披露其没有 HIPAA Business
              Associate Agreement，也不提供 EU 托管或本地部署选项；在这些缺口补上之前，两个受监管或对数据主权敏感的买方细分会被关在门外。
            calloutType: risk
            claimRefs:
              - CE038
              - CE041
          - type: callout
            title: 本地数据库加密争议是真实的安全与开放取舍，不是虚惊一场
            body: >-
              2026 年 3 月加密本地笔记数据库，确实加强了安全，但也切断了此前读取明文缓存文件的第三方 agent；Granola 提出的 MCP 替代方案需要支持 MCP 的特定客户端，而不是开放文件或 API
              访问。公司和批评者的立场都有道理，底层数据可携性问题仍未解决。
            calloutType: insight
            claimRefs:
              - CE022
              - CE023
              - CE047
          - type: callout
            title: 直接向公司核验事故完整性和准确率主张
            body: 审阅过的所有来源都没有独立转写准确率基准，也没有确认事故历史已完整披露；因此，尽调在依赖任何一项指标前，应要求（1）Granola 三份公开事后复盘之外的内部安全事故日志，以及（2）第三方、同口径准确率基准。
            calloutType: recommendation
