      - number: '5.2'
        title: 工作流与用例证明
        blocks:
          - type: paragraph
            body: >-
              Granola 自己发布的客户案例最清楚地展示产品在组织内的真实用法，覆盖四类不同买方 / 用户场景。Zapier 的 Principal Designer 在设计 / 产品 / 工程组织中采用
              Granola，原因是其他 AI 转写工具显得侵入感强；公司发布的案例称每月节省 830+ 小时，组织级采用率 52%（CE009）。Vanta 的 VP of Customer Success 将
              Granola 用于内部 1:1、站会和跨职能同步，明确因为 SOC 2 Type II 认证、加密和通知同意式录音控制对安全与合规公司很重要；案例称组织级采用率 69%，会议可见性提升
              61%（CE010）。Brex 的 Head of IT 在员工已自发采用后把 Granola 推向全公司，强调受监管 fintech 场景里的 SSO/SCIM
              交付和不用于公开模型训练的承诺；案例称六个月内知识员工采用率超过 50%，每周节省 427 小时（CE011）。Vercel 的销售工程团队用 Granola 替换了更慢的转写工具，现在用其 “chat with
              the transcript” 功能检索潜在客户提出的具体技术异议；案例称 GTM 团队采用率 100%，每位用户每周节省 11 小时，GTM 生产力提升 25%（CE012）。


              除这四个旗舰客户外，Granola 自己的报道点名高管猎头公司 Daversa Partners 在 150 名员工中的 136 人部署
              Granola，原因是无机器人、设备级采集比可见机器人工具更适合保密候选人与客户对话，侵入感更低（CE013）；独立 Product Hunt
              社区帖还提到面对面、多语言对话采集——例如把日语对话转成英文笔记——是移动端应用一个突出的真实用例（CE014）。不过，四个旗舰案例都没有披露席位数、合同金额、续约率或流失数据；所有量化收益都停留在采用率和节省小时数估算，而不是与收入挂钩的证明（CE015）。这是本章工作流证据的核心限制。
