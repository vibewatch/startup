  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概览与核心模块 / SKU 图谱
        blocks:
          - type: paragraph
            body: >-
              Granola 是一款会议记忆应用，差异化集中在一个机制：它在用户自己的设备上本地采集麦克风和系统音频，而不是以可见机器人身份加入通话；会议开始前，用户必须手动启动应用（CE001,
              CE002）。这层采集能力如今支撑的是更宽的产品线，而不再只是单一记笔记工具。AI Notepad 本体覆盖 macOS、Windows 和 iOS；其上叠加了可在用户完整会议历史中答问的 agentic
              Granola Chat、自动生成会前准备的 Briefs、Recipes（可复用 AI 提示词模板）、用于共享组织记忆的 Team Spaces/Folders、Personal API 和独立的
              Enterprise Admin API，以及 Granola MCP——一个把会议上下文暴露给外部 AI 工具的集成层（CE003）。Granola for Enterprise
              在核心产品之上增加的是治理层：SSO/SAML、SCIM 配置、管理员仪表盘、域名管理、灵活数据留存窗口和 SOC 2 Type II 文档，而不是另一套产品架构（CE004）。


              商业化上，Granola 以免费层加付费 Business、Enterprise 计划分发，主要靠会议历史深度、CRM 集成、管理员控制等功能权限区分（CE006）；Personal API 随 Business
              和 Enterprise 捆绑，Enterprise Admin API 仅 Enterprise 可用，二者都未作为独立项目定价（CE007）。模块图谱里有两个明显缺口。第一，Granola
              自己的招聘页面列出了 Android Engineer，但截至本次报告运行日，Granola 的站点地图和所有公开应用商店都看不到 Android
              应用——这是清晰路线图信号，却没有承诺发布日期（CE005）。第二，评审时 Granola 自己的 /integrations 营销 URL 返回 HTTP
              404，因此没有一个官方、最新页面能完整列出公司的集成表面（CE008）。
