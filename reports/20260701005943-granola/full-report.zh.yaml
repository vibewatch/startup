      - number: '7.4'
        title: 合作伙伴、依赖与集中风险
        blocks:
          - type: paragraph
            body: >-
              Granola 自己的安全页面确认，产品依赖四家外部 AI 供应商：Deepgram 和 AssemblyAI 负责转写，OpenAI 和 Anthropic 负责摘要；转写稿和笔记只存放在美国托管的 AWS
              Virtual Private Cloud，且全程加密（CR029，CR060）。这不是理论依赖：AssemblyAI 正是 Granola 2025
              年首次披露安全事件的直接入口，说明供应商集中风险已经兑现过一次（CR030）。第二个、规模可能更大的依赖风险来自竞争，而非供应侧：Microsoft 自己的文档确认，Teams 的 AI 会议回顾可通过每用户每月
              $10 的 Teams Premium 附加包或 Microsoft 365 Copilot 许可证获得——它把相近功能打包进多数企业客户已经付费的套件，压低了 Granola $14 Business
              计划的价格锚（CR031）；与此同时，Google 在 Meet 内原生营销 Gemini 驱动的笔记（CR033），Zoom 则称 AI Companion
              使用量同比增长超过三倍，独立市场报告显示其上线五个月内达到 510,000 个账户（CR032，CR034）。实体硬件记事设备又提供了一个非软件替代路径（CR035）。


              Granola 的资本提供方也呈现集中模式：Index Ventures 和 Kleiner Perkins 的投资文章都点名现有 Granola
              客户（Asana、Vanta、Gusto、Thumbtack、Cursor、Lovable）作为证明点，这意味着同一投资人网络既提供资本，也放大客户背书（CR036）。融资结构上，Companies House
              文件显示 Granola 的英国母公司只有股权相关记录，没有登记押记（担保债务）文件；这与全股权资本结构、且不存在单独贷款方依赖相一致（CR037）。最后，已审阅来源没有发现经销商、系统集成商或渠道合作协议，因此
              Granola 当前的市场进入依赖直销、自助和自然推荐渠道，而不是多元化分销网络（CR038）。
