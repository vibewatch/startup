  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与收入结构
        blocks:
          - type: paragraph
            body: >-
              Granola 通过分层按席位 SaaS 订阅变现。其博客称，Business 计划价格为 $14 每用户每月，包含无限会议历史、CRM 集成，以及跨团队对话的文件夹级查询（CI001）。SiliconANGLE
              对 2026 年 3 月 Series C 的报道还补充了免费层和 $35 每月的 Enterprise 层，后者带有更扩展的网络安全控制；但报道从未说明 Enterprise
              数字是按席位还是组织整体价格（CI002）——Granola 自己的 Enterprise 页面也印证了这种模糊性：它列出企业专属功能，却没有发布任何合同价格（CI003）。Series C
              公告又增加了两个变现入口——打包进 Business/Enterprise 计划的个人 API，以及只打包进 Enterprise 的企业管理员
              API——目前都未作为独立项目定价（CI004）。没有审阅来源披露收入中有多少来自 Business、Enterprise 或 API 使用（CI005）。


              对比竞品组合定价，Granola 的 $14 标价处在 Fireflies、Otter 和 Fathom 共同覆盖的 $10-$39 每席位区间内（CI010、CI011、CI012），这些公司也都把自己的
              Enterprise 层放在销售沟通之后。Granola 自己的销售买方指南明确把 ACV 高得多的会话智能类别让给 Gong，并引用第三方估算：Gong 每用户每年 $1,300-$1,600，另加
              $5,000-$50,000 平台费（CI008）；独立 CloudTalk 分析也佐证了这一数字（CI009）。Bloomberg 经 SiliconANGLE 报道称，Granola 在 Series C
              前一个季度收入增长 250%，但两家媒体都没有披露这一增速对应的绝对基数（CI006）；因此，收入质量方向上积极，却无法财务核验。
