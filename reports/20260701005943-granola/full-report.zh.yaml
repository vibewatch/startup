        title: 公开牵引力与私人指标缺口
        blocks:
          - type: paragraph
            body: >-
              Granola 的公开牵引力代理指标偏定性、基于参考客户，而不是量化。招聘页称产品每天转写数百万分钟对话（CI018）；Series C 文章和 Kleiner Perkins 文章共同点名
              Asana、Vanta、Gusto、Thumbtack、Cursor、Lovable、Decagon 和 Mistral AI 为客户，并有 Brex、Vanta、Zapier、Vercel 的专门 ROI
              案例（CI036）。这些案例都没有披露席位数、合同金额或续约 / 扩张率。历史上，一份 2026 年报告称，Granola 在 2024 年 10 月 Series A 时约有 5,000 名周活用户，但截至
              2026 年中没有披露当前用户数（CI032）；同一报告还指出，Fireflies.ai 已独立超过 16 million 用户和 $1 billion 估值——这是一个 Granola
              自身披露既无法匹配也无法反驳的规模对比（CI033）。


              即使第三方数据供应商也补不上缺口：Tracxn 公开资料估计，截至 2026 年 5 月公司有 116 名员工（CI034），但把 Granola
              的收入和逐轮估值倍数字段挡在付费数据墙后，意味着专门研究平台也没有免费露出 Granola 的收入或估值倍数（CI035）。TheNextWeb 直接称 Granola
              没有公开披露留存指标；本章审阅来源中，也没有任何来源披露净收入留存、logo 留存或流失率（CI037）。结果是，牵引力图景完全建立在 logo 质量和节省时间的轶事上，而不是任何可测量的使用、收入或留存趋势。
