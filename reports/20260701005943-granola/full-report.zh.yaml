      - number: '8.4'
        title: 可比公司集：上市、私营与 M&A
        blocks:
          - type: paragraph
            body: >-
              没有单一可比公司能同时匹配 Granola 的类别和阶段，因此本节用一组精选对象三角定位。直接竞争对手 Fireflies.ai 在 2025 年 6 月通过 tender offer 达到 $1B
              以上估值，而非一级融资；同时称其自 2023 年以来一直盈利。直接竞争对手 Otter.ai 在 2025 年 3 月披露 ARR 超过 $100M，但本节审阅证据中没有可印证的当前估值。相邻 AI 生产力公司
              Notion 在 2025 年 12 月员工股票出售中最新估值 $11B，是一个规模大得多的上限参照。上市可比公司 Zoom Communications 截至 2026 年中市值
              $25.31B、过去十二个月收入 $4.93B（约 5.1x 市销率）、毛利率 77.0%——成熟、低增长、盈利的画像与 Granola 所称高速增长私营阶段在结构上不同，但可作为利润率和倍数锚点。M&A
              方面，Salesforce 在 2026 年 6 月同意以约 $3.6B 收购 AI 客服平台 Fin，显示战略买家愿意为已验证、已企业部署的 AI agent 平台支付的价格；虽属相邻但不同垂直领域，背景则是
              CNBC 所称 2025 年全球 M&A 创下 $4.9T 纪录，并把 AI 驱动的动能带入 2026 年。在这组对象中，Granola 是唯一一家估值建立在零披露收入或 ARR 数字之上的公司。
