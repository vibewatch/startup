      - number: '1.4'
        title: 里程碑、控制与负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司从发布到平台扩展走得很快。Granola 于 2024 年 5 月公开发布，2024 年 10 月完成 Series A，2025 年 5 月推出协作式 Granola 2.0
              工作区，2025 年 9 月发布 Granola Chat 的 Recipes，2026 年 2 月通过 Granola MCP 暴露会议上下文，随后借 2026 年 3 月 Series C 继续推进
              Spaces、文件夹和 API。2026 年 5 月，公司又加入 Briefs，让用户开会前就能拿到已整理的参会者和历史对话上下文。


              信任与控制图景有好有坏。正面看，Granola 的隐私政策称 OpenAI、Anthropic 等第三方不能用客户个人数据训练模型，DPA 也明确覆盖 GDPR、UK
              GDPR、瑞士数据保护和美国州隐私法。负面看，同一隐私政策允许在用户未退出时使用去标识化数据训练；2026 年 3 月，Granola
              决定加密本地数据库，打断早期本地智能体工作流，引发用户反弹。这个事件不否定产品牵引力，但确实说明，平台控制决策会在早期帮助品牌发酵的技术重度用户中制造采用摩擦。
