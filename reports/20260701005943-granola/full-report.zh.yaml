      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              近期新闻中的公开创始人记录保持一致：Granola 由 Chris Pedregal 和 Sam Stephenson 创立。Pedregal 在公开材料中更可见，也有更清晰的创始人-市场匹配履历，来自此前 AI
              与产品工作的积累。BusinessCloud 报道称，他曾创办 Socratic，2018 年出售给 Google，之后在 Google 的 Area 120 孵化器内部打造 Stack，直到该产品并入
              Google Drive。Stephenson 在报道和公司材料中作为联合创始人与产品 / 设计搭档出现，包括在 2024 年 10 月 Series A 报道中以联合创始人身份被引用。


              更不透明的是更宽的高管和治理班底。抓取到的公司、投资人和媒体页面反复聚焦两位创始人，但没有公布完整董事会名单、独立董事阵容，或清晰具名的 CFO/COO 架构。从尽调角度看，Granola
              仍显得以创始人为中心：有号召力、产品驱动、可能行动很快，但相对其 Series C 后估值，关键人集中和公开治理披露不足是真问题。
