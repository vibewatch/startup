      - number: '5.5'
        title: 差异化
        blocks:
          - type: paragraph
            body: >-
              Granola 对核心差异化的表述不是功能，而是架构：无机器人、本地采集、服务器端零音频留存，转写后立即删除音频；公司称这正是其约三个月完成 SOC 2 Type II 认证、而不是通常 12-18
              个月的直接原因（CE034）。在这套架构之上，Granola 用 “CODE” 框架（Capture、Organize、Distill、Express）定义 Chat
              产品，认为只对原始转写做关键词搜索，无法沉淀可复用的组织记忆（CE035）。Recipes 则用来自 Lenny Rachitsky、Matt Mochary
              等具名外部专家的可分享模板，而不只提供公司自写的通用提示词，借此区分提示词库路线（CE036）。


              独立审视下，这些主张只有部分耐久性。竞争对手发布的评测（tl;dv）估计 Granola 转写准确率约 94-95%，低于 tl;dv 自称的 97%+；又称 Granola 支持约 15 种语言，而 tl;dv
              支持 30+。这把 Granola 的真实差异化界定为工作流和采集设计，而不是原始转写性能，不过该来源本身带有明显竞争偏见（CE037）。更实质的是，Granola “bot-free” 和 “private
              by default” 的定位已在两个战线遭到公开、独立质疑：一名独立评测者将 Granola 企业就绪度只评为 3/10，理由是默认分享设置弱、没有 EU
              或本地部署选项；另一家媒体称，默认情况下，任何拿到链接的人都可访问笔记，除非用户手动更改设置（CE038）。合在一起看，Granola
              的差异化在架构层面真实存在，但既非独占，也未在营销主张层面得到完全佐证；这一区分直接影响该架构究竟能支撑多少定价权和转换成本韧性。
            claimRefs:
              - CE034
              - CE035
              - CE036
              - CE037
              - CE038
