  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Granola 在不到三年内披露了四轮融资：约 $4.25M 种子轮；2024 年 10 月由 Spark Capital 领投的 $20M Series A；2025 年 5 月由 NFDG 领投、估值
              $250M 的 $43M Series B；以及 2026-03-25 由 Index Ventures 领投、投后估值 $1.5B 的 $125M Series C，Kleiner Perkins
              加入，Lightspeed、Spark 和 NFDG 回投。Series C 之后，TechCrunch 和 The SaaS News 都把已披露总融资额列为 $192M，BusinessCloud 另报约
              $188M，累计融资额在发布方层面存在小幅差异。Forbes 在 2026 年 1 月报道称，Granola 正洽谈至少 $100M、估值超过 $1B 的融资；这轮最终两个月后以 $125M、$1.5B
              估值完成，说明流程中估值和金额都有上调。所有已披露资本都是风险股权；已审阅来源没有出现债务、venture debt 或可转工具。Companies House 的 PSC 文件显示，一位联合创始人在 2023
              年 4 月发生稀释事件，更像第一轮机构融资，而非任何离任。仅凭公开证据很难评估入场纪律：Granola Labs Ltd
              的英国小公司审计豁免使其申报账目既不披露营业额，也不披露利润，因此价格无法对照公司自身财务基础核验；公司和投资人也没有公开给出下一轮触发条件、runway 数字或退出时间表。
