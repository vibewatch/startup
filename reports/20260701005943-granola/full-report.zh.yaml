      - number: '7.5'
        title: 财务、模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              Granola 于 2026-03-25 宣布完成 $125M Series C，投后估值 $1.5B，公司与独立来源相互印证（CR039）；TechCrunch 和 Tracxn 又分别收敛到 $192M
              的已披露总融资额（CR040）。但除融资总额外，已审阅来源没有披露 Granola 的现金余额、烧钱速度或现金续航（CR041）；作为一家英国私营公司，Granola 在 Companies House
              提交了截至 2025 年 3 月 31 日年度的「total exemption full accounts」，近期没有法定普通申报义务去披露营业额、利润率或利润（CR042）。唯一可得的独立员工数是
              Tracxn 截至 2026 年 5 月 26 日给出的 116 人（CR043）；另有独立 B2B 支出面板称其六个月员工数增长
              49%，但没有已披露收入，就无法把这一增速与人均收入基准相对照（CR044）。公开 SaaS 基准数据把订阅业务毛利率中位数放在约 76%，并提示沉重的 AI 推理算力成本常常把毛利率压到 70%
              以下——Granola 每场会议要调用四家付费第三方 ASR/LLM 供应商，这一描述有理由适用（CR045）。相比之下，同一类别中更成熟的上市可比公司 Zoom 在 FY2026 Form 10-K 中直接披露
              77.0% 毛利率，显示 Granola 作为私营公司还未达到的透明度基准（CR046）。Granola
              及其投资人都没有披露未来融资轮的具体收入或使用量触发条件；投资人文章只是把本轮融资定位为支持多年产品建设（CR047）。


              执行层面，BusinessCloud 和 TechCrunch 只识别出两位联合创始人 Chris Pedregal 和 Sam Stephenson，没有披露独立董事会名单（CR048）；Pedregal
              过往履历包括 Socratic（2018 年被 Google 收购）以及在 Google Area 120 内部搭建的 Stack（CR049）。Granola
              招聘页确认公司仍在招聘，但没有披露当前总员工数（CR050）；快速扩员叠加缺少独立确认的组织架构图，意味着公司面临的扩张复杂度，本章来源尚无法验证是否已有足够管理深度匹配（CR051）。没有任何来源显示
              Granola 设有首席财务官、总法律顾问、合规负责人或数据保护官；考虑到本章前文记录的监管与诉讼邻近风险，这一缺口格外醒目（CR052）。
