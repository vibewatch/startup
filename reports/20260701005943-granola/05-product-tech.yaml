figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Granola's stack runs from local device capture through third-party ASR/LLM inference to encrypted cloud storage and an agent-integration layer, wrapped in an enterprise admin/control layer.
  data:
    layers:
    - id: capture
      label: Capture layer
      detail: Local microphone + system audio capture on macOS/Windows (Electron) and native iOS; manual start, no auto-join bot.
    - id: transcription
      label: Transcription layer
      detail: Real-time speech-to-text via third-party Deepgram and AssemblyAI ASR vendors.
    - id: reasoning
      label: AI reasoning layer
      detail: OpenAI and Anthropic LLM APIs power note enhancement, agentic Chat, Briefs, and Recipes; full-transcript vs condensed-notes context is an explicit design tradeoff.
    - id: storage
      label: Storage layer
      detail: AWS-hosted US VPC (encrypted transcripts/notes, daily backups, no stored audio) plus an encrypted local on-device cache (cache-v3.json).
    - id: integration
      label: Integration / agent layer
      detail: Granola MCP (Model Context Protocol), Zapier (8,000+ apps), native Slack/Notion/CRM connectors, Personal and Enterprise Admin APIs.
    - id: admin
      label: Enterprise admin / control layer
      detail: SSO/SAML, SCIM provisioning, domain management, retention policy, admin dashboard, participant-notification and watermark controls.
