  evidenceGaps:
  - type: missing-source
    severity: material
    topic: compliance-hipaa
    missingEvidence: A HIPAA Business Associate Agreement, or a stated timeline for offering one.
    whyItMatters: Without a BAA, healthcare or health-adjacent enterprise buyers cannot legally use Granola for conversations involving protected health information, closing off an entire regulated-buyer
      segment.
    diligencePath: Request Granola's current HIPAA/BAA roadmap and timeline directly from the enterprise sales team as part of any healthcare-sector diligence.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: material
    topic: quality-benchmark
    missingEvidence: An independent or company-run transcription-accuracy benchmark (e.g., word error rate) for Granola across languages and audio conditions.
    whyItMatters: The only accuracy figure in any source reviewed is a single competitor-authored estimate (~94-95%), which may be biased and is not independently reproducible.
    diligencePath: Commission or request a third-party, apples-to-apples transcription-accuracy benchmark across Granola and named competitors on a shared audio test set.
    relatedQuestionRefs:
    - QE028
  - type: missing-source
    severity: minor
    topic: reliability-sla
    missingEvidence: A Granola-published uptime SLA or a first-party status page with historical incident data.
    whyItMatters: Enterprise buyers evaluating Granola for mission-critical workflows cannot verify committed uptime without relying on an unaffiliated third-party monitor.
    diligencePath: Ask Granola's enterprise sales team directly for an SLA and any first-party incident-history page before signing an enterprise contract.
    relatedQuestionRefs:
    - QE022
  - type: enumeration-incomplete
    severity: minor
    topic: roadmap-android
    missingEvidence: A confirmed Android release date or public roadmap commitment.
    whyItMatters: An Android-engineer role signals investment but does not establish scope or timing; sales cycles involving Android-only buyer organizations cannot be sized without a date.
    diligencePath: Ask Granola directly for its Android release timeline and beta-access process.
    relatedQuestionRefs:
    - QE005
  - type: stale
    severity: minor
    topic: integrations-catalog
    missingEvidence: A working, current version of Granola's official /integrations marketing page.
    whyItMatters: A broken official integrations page makes it harder for a prospective enterprise buyer to verify Granola's full current integration surface from primary sources alone.
    diligencePath: Request an up-to-date integration list directly from Granola's sales or partnerships team, or verify the page has been restored before relying on it.
    relatedQuestionRefs:
    - QE007
  - type: enumeration-incomplete
    severity: material
    topic: security-incident-disclosure
    missingEvidence: Confirmation of whether the three published postmortems represent the complete set of material security incidents since Granola's founding, or only the subset the company chose to disclose.
    whyItMatters: A pattern of two disclosed Google Workspace access-control gaps in the same year raises the question of whether additional, undisclosed access-control issues exist in adjacent authentication
      flows.
    diligencePath: Request Granola's internal incident log and remediation history as part of a security due-diligence data-room review, not just the public postmortem page.
    relatedQuestionRefs:
    - QE014
    - QE026
  - type: missing-source
    severity: material
    topic: data-residency
    missingEvidence: A Granola-specific EU-hosted or on-premise/VPC deployment option, or a stated roadmap for one.
    whyItMatters: Granola's own security page confirms US-only AWS VPC hosting; competitors named in Granola's own deployment-models blog (tl;dv, Jamie, Leexi, Voicegain) already offer EU-hosted or on-premise
      options, which could block EU-data-sovereignty-constrained buyers from adopting Granola at all.
    diligencePath: Ask Granola's enterprise sales team directly whether an EU-hosted or on-premise deployment is available or planned, and on what timeline.
    relatedQuestionRefs:
    - QE027
  - type: conflicting-data
    severity: minor
    topic: data-portability
    missingEvidence: A resolution of whether Granola's MCP integration functionally replaces the open local-file/API access that existed before the March 2026 local-database encryption change.
    whyItMatters: The company and its most vocal public critic disagree on whether MCP is a sufficient substitute for direct file or API access, which matters for any buyer relying on third-party agents
      or automation built against Granola's local cache.
    diligencePath: Test whether a representative sample of the buyer's existing third-party agent/automation tooling can still access Granola data post-encryption via MCP before committing to a rollout.
