company:
  name: Granola
chapter:
  number: 5
  title: Product & Technology
  summary: 'Granola''s product is a bot-free, device-level AI meeting notepad: it captures microphone and system audio locally, transcribes it in real time via third-party ASR vendors (Deepgram, AssemblyAI),
    and uses OpenAI and Anthropic models to blend the transcript with a user''s own notes into structured, shareable meeting memory, now extended by an agentic Chat, Briefs, Recipes, and a Model Context
    Protocol (MCP) integration layer. The architecture -- Electron desktop client, native iOS app, AWS-hosted US VPC storage, zero audio retention -- is independently corroborated by a security researcher''s
    teardown of the Mac app and by a reverse-engineered open-source client, and it is the direct reason Granola states it completed SOC 2 Type II certification in roughly three months. That same architecture
    has produced three disclosed public postmortems (an AssemblyAI API key exposure and two Google Workspace access-control gaps), a still-unresolved HIPAA gap, no EU-hosted or on-premise deployment option,
    no independent accuracy benchmark, and a March 2026 local-database-encryption change that a prominent investor publicly criticized for breaking third-party agent access -- undercutting the "private
    by default" and open-data claims central to Granola''s own marketing.'
sections:
- id: product-overview-module-map
  title: Product Overview and Core Module / SKU Map
  body: 'Granola is a meeting-memory application built around a single differentiated mechanism: it captures microphone and system audio locally on the user''s own device rather than joining a call as a
    visible bot participant, and the user must manually start the app before a meeting begins (CE001, CE002). That capture layer now underwrites a wider product line rather than a single note-taking tool.
    The AI Notepad itself ships on macOS, Windows, and iOS; on top of it sit an agentic Granola Chat that can answer questions across a user''s entire meeting history, Briefs that auto-generate pre-meeting
    prep, Recipes (reusable AI prompt templates), Team Spaces/Folders for shared organizational memory, a Personal API and a separate Enterprise Admin API, and Granola MCP, an integration layer that exposes
    meeting context to external AI tools (CE003). Granola for Enterprise adds a distinct governance layer on top of that core product -- SSO/SAML, SCIM provisioning, an admin dashboard, domain management,
    flexible data-retention windows, and SOC 2 Type II documentation -- rather than a different product architecture (CE004).


    Commercially, Granola is distributed as a free tier plus paid Business and Enterprise plans that are differentiated mainly by feature access such as meeting-history depth, CRM integrations, and admin
    controls (CE006); the Personal API is bundled into Business and Enterprise, while the Enterprise Admin API is Enterprise-only, and neither is priced as a standalone line item (CE007). Two gaps stand
    out in the module map itself. First, Granola''s own careers page lists an Android Engineer among current team members, yet no Android app appears on Granola''s sitemap or any public app store as of
    the run date -- a clear roadmap signal without a committed ship date (CE005). Second, Granola''s own /integrations marketing URL returned an HTTP 404 at the time of this review, so no single official,
    current page catalogues the company''s full integration surface (CE008).'
