- id: trust-safety-security-compliance
  title: Trust, Safety, Security, Privacy, Compliance, and Quality Controls
  body: 'Granola states it is SOC 2 Type II certified (first announced July 7, 2025) and GDPR compliant, with independent audit documentation available to enterprise procurement teams through a Trust Center
    (CE039), and its Data Processing Addendum designates Granola as a data processor for customer-submitted personal data with a Personal Data Breach notification duty "without undue delay," while separately
    designating Granola an independent controller for its own business-contact and usage data (CE040). A concrete compliance gap remains open: Granola does not currently hold a HIPAA Business Associate
    Agreement, a gap the company discloses directly on its own blog even though its help center separately maintains a dedicated Healthcare & HIPAA FAQ section (CE041). On model training, Granola''s Enterprise
    plan turns training off by default and contractually bars OpenAI and Anthropic from training on customer data, while free and standard consumer accounts are opted into anonymized training by default
    with a manual opt-out (CE042).


    Granola maintains a public Vulnerability Disclosure Policy and has published three detailed security postmortems since mid-2025 (CE043). The first, identified by independent security firm Tenable, involved
    an unauthenticated API endpoint leaking a live AssemblyAI transcription key (CE018, CE019). The second disclosed that, until a fix on May 23, 2025, workspace auto-join checked only whether a user''s
    Google email domain matched the workspace domain, which could let an unmanaged personal account auto-join an enterprise workspace, though Granola''s own database check found no workspace had actually
    been affected (CE044). The third disclosed that 187 users removed, suspended, or deleted from their linked Google Workspace retained active Granola sessions and could keep accessing historical notes
    and transcripts until session-validity checks were deployed between May 28 and June 2, 2025 (CE045). On the positive side of the ledger, both Granola''s security page and its local-first architecture
    blog state that meeting audio itself is never stored on any server -- only the resulting text persists -- which narrows the blast radius of any future breach to text rather than stored audio or biometric
    voice data (CE046), and an independent open-source project confirms the local cache can be read entirely offline without contacting Granola''s servers, though that path was partially foreclosed once
    local-database encryption shipped in March 2026 (CE047). No source reviewed publishes an independent transcription-accuracy benchmark for Granola; the only figure available (~94-95%) comes from a single
    competitor-authored review and should be read as directional only (CE048). Enterprise transparency controls -- an optional on-screen recording watermark and an automatic in-meeting chat notification
    when transcription starts -- round out the admin-configurable trust layer (CE049).'
