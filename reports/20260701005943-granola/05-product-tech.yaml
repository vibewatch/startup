callouts:
- calloutType: strength
  title: Bot-free architecture is real and independently corroborated
  body: 'Granola''s local-capture, zero-audio-retention design is not just marketing: an independent security researcher''s teardown of the Mac client and a separate open-source project''s reverse engineering
    of the local cache both confirm the architecture Granola describes, and the company credits that design for a three-month SOC 2 Type II certification versus a typical 12-18 months.'
  claimRefs:
  - CE016
  - CE017
  - CE034
- calloutType: risk
  title: Three disclosed postmortems in one year, two from the same root cause
  body: Granola has publicly disclosed an AssemblyAI API key exposure and two separate Google Workspace account-state gaps within about a year, all found by outside parties rather than proactively. That
    pattern -- particularly two distinct Google Workspace access-control failures -- raises the question of whether additional undisclosed issues exist in adjacent authentication flows.
  claimRefs:
  - CE018
  - CE019
  - CE044
  - CE045
- calloutType: risk
  title: '"Private by default" is contested, and HIPAA/EU hosting gaps remain open'
  body: Independent reporting states notes are shareable via link by default unless a user changes the setting, directly at odds with Granola's own "private by default" messaging. Separately, Granola discloses
    it holds no HIPAA Business Associate Agreement and offers no EU-hosted or on-premise deployment option, closing off two regulated or sovereignty-sensitive buyer segments until those gaps close.
  claimRefs:
  - CE038
  - CE041
- calloutType: insight
  title: The local-database-encryption controversy is a genuine security-vs-openness tradeoff, not a false alarm
  body: Encrypting the local notes database in March 2026 was a real security hardening step, but it also cut off third-party agents that previously read the plaintext cache file, and Granola's proposed
    MCP substitute requires MCP-specific client support rather than open file or API access. Both the company and its critics have a defensible position; the underlying data-portability question remains
    unresolved.
  claimRefs:
  - CE022
  - CE023
  - CE047
- calloutType: recommendation
  title: Verify incident completeness and accuracy claims directly with the company
  body: Because no independent transcription-accuracy benchmark and no confirmation of complete incident-history disclosure exist in any source reviewed, diligence should request (1) Granola's internal
    security-incident log beyond the three public postmortems, and (2) a third-party, apples-to-apples accuracy benchmark before relying on either metric.
  claimRefs:
  - CE048
  - CE043
