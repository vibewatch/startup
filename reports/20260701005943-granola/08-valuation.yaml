  rows:
  - - Granola (subject company)
    - $125M Series C, 2026-03-25
    - $1.5B post-money; no ARR/revenue disclosed so no multiple is computable (CV004, CV011).
    - Subject of this report; actual transacted price.
    - No financial base exists to sanity-check the price; valuation rests on growth-rate signal and investor quality alone.
  - - Fireflies.ai (direct competitor)
    - Tender offer, 2025-06-12
    - $1B+ valuation; profitable since 2023; no primary capital raised since 2021 (CV029, CV030).
    - Closest capability comparable; reached unicorn status via secondary liquidity rather than a primary round.
    - Valuation basis is a tender offer, not an arm's-length primary financing; no disclosed ARR multiple.
  - - Otter.ai (direct competitor)
    - ARR disclosure, March 2025
    - $100M+ ARR disclosed; no current valuation corroborated in this run (CV031, CV033).
    - Category leader with the strongest disclosed revenue data point among direct peers.
    - No valuation figure to compute a multiple against; last known mark is from 2021 and unconfirmed here.
  - - Notion (adjacent AI-productivity)
    - Employee share sale, Dec 2025
    - $11B valuation (CV034).
    - Adjacent AI-productivity comparable at much larger scale, useful as a category ceiling reference.
    - Broader workspace/database product, not a like-for-like point solution; scale gap is an order of magnitude.
  - - Zoom Communications (public comp)
    - Market cap / TTM revenue, mid-2026
    - $25.31B market cap on $4.93B revenue (~5.1x P/S); 77.0% gross margin (CV035, CV036).
    - Public, mature collaboration-software comp bundling AI meeting features.
    - Low-growth (~5% YoY), profitable, public-market profile is not comparable to Granola's claimed hyper-growth private stage.
  - - Salesforce / Fin (M&A precedent)
    - Acquisition, 2026-06-15
    - ~$3.6B purchase price for an AI customer-service agent platform serving 30,000+ businesses (CV037).
    - Shows the scale of price a strategic acquirer will pay for a proven, enterprise-deployed AI-agent platform in an adjacent category.
    - Different vertical (customer service vs. meeting notes); purchase-price-to-revenue multiple not disclosed.
  - - Applied AI / Productivity Tools category (analyst benchmark)
    - Q1 2026 multiple dispersion
    - Private 'Productivity Tools' valuations rose even as public multiples in the same category compressed (CV026, CV027).
    - Category-level context showing private capital still pays a premium for productivity-AI even where public markets have started repricing down.
    - Aggregate category data, not a company-specific multiple; cannot be mapped onto Granola without a disclosed ARR base.
  notes: Coverage is a curated, non-exhaustive comparable set spanning direct competitors, an adjacent private comp, a public comp, an M&A precedent, and a category-level analyst benchmark; selection basis is direct-peer relevance plus data availability across sources reviewed in this and prior chapters.
