    - research-more
    - No revenue, ARR, gross margin, or burn figure has been disclosed by Granola, its investors, or any third-party data provider; the $1.5B mark cannot be independently priced against a Granola-specific financial base (CV004, CV011).
  - - Confidence
    - medium
    - Funding history and comparable-company facts are well corroborated by multiple independent sources, but the core valuation-supporting inputs (revenue, growth base, margin) remain entirely undisclosed (CV004, CV011).
  - - Risk rating
    - high
    - Legal precedent against direct/adjacent peers (Otter.ai wiretap litigation), a live 11.4% industry down-round rate, and total financial opacity combine into a high-risk profile (CV023, CV042, CV045).
  - - Valuation stance
    - stretched
    - A sixfold valuation increase in about ten months with zero revenue disclosure, set against compressing public 'Productivity Tools' multiples, reads as aggressive relative to available comparables (CV008, CV026, CV049).
  - - Decision implication
    - Track; do not commit new primary capital until ARR/gross-margin disclosure or a priced follow-on round narrows the valuation-support gap.
    - Revisit at the next disclosed financing event or upon any audited-accounts filing (CV010, CV028, CV049).
