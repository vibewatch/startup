chapter:
  number: 8
  title: Valuation
  summary: Granola's $1.5 billion Series C valuation (2026-03-25, $125M raised, $192M total disclosed funding) rests on directionally positive but entirely unverifiable growth and adoption signals, since no revenue, ARR, gross margin, or burn figure has been disclosed by the company, its investors, or any third-party data provider reviewed; against a comparable set spanning Fireflies, Otter.ai, Notion, Zoom, and the Salesforce/Fin acquisition, and against active down-round and litigation risk in the category, the evidence supports research-more with medium confidence, a high risk rating, and a stretched valuation stance.
sections:
- id: financing-valuation-context
  title: Financing and valuation context
  body: 'Granola has raised four disclosed rounds in under three years: roughly $4.25 million in seed funding, a $20 million Series A led by Spark Capital in October 2024, a $43 million Series B led by NFDG in May 2025 at a $250 million valuation, and a $125 million Series C led by Index Ventures on 2026-03-25 at a $1.5 billion post-money valuation, with Kleiner Perkins joining and Lightspeed, Spark, and NFDG returning. TechCrunch and The SaaS News both put total disclosed funding at $192 million after the Series C, while BusinessCloud separately reported roughly $188 million, a modest publisher-level discrepancy on the cumulative total. Forbes reported in January 2026 that Granola was in talks for at least $100 million at a valuation of over $1 billion -- the round that ultimately closed two months later at $125 million and $1.5 billion, an escalation during the process itself. All disclosed capital is venture equity; no debt, venture-debt, or convertible instrument appears in any source reviewed, and a Companies House PSC filing shows a co-founder''s dilution event in April 2023 consistent with the first institutional round rather than any departure. Entry discipline is difficult to assess on public evidence alone: Granola Labs Ltd''s UK small-company audit exemption means its filed accounts disclose neither turnover nor profit, so the price cannot be checked against a company-specific financial base, and neither the company nor its investors state a public next-round trigger, runway figure, or exit timeline.'
