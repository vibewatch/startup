- id: TV002
  title: Thesis vs. anti-thesis
  columns:
  - Argument
  - Supporting/undermining evidence
  - What would change the view
  rows:
  - - 'Thesis: bottom-up viral adoption converts into durable enterprise revenue'
    - Index Ventures frames organic evangelist-led adoption as the core growth driver; Brex-style land-and-expand pattern cited across chapters (CV016, CV017).
    - Disclosed logo-level retention or expansion-revenue data confirming the pattern generalizes beyond a handful of named accounts.
  - - 'Thesis: category-wide AI valuation premium justifies a rich private mark'
    - Carta data shows AI startups broadly command large valuation premiums over non-AI peers at the same stage (CV024, CV025).
    - Evidence the premium is Granola-specific rather than a category-wide tide that could recede.
  - - 'Anti-thesis: total financial opacity'
    - No revenue, ARR, margin, or burn figure disclosed anywhere in this report; UK small-company audit exemption forecloses near-term forced disclosure (CV010, CV011, CV018).
    - A disclosed ARR figure, an audited account, or an investor-sourced revenue estimate.
  - - 'Anti-thesis: product commoditization'
    - Fathom and tl;dv now match Granola's bot-free positioning; Microsoft, Google, and Zoom bundle meeting-notes AI into suites buyers already own (CV019).
    - Evidence Granola's context/API layer creates switching costs that bot-free capture alone does not.
  - - 'Anti-thesis: transmissible legal/regulatory risk'
    - Otter.ai faces a consolidated wiretap/biometric class action; legal commentary treats the whole notetaking category, including less-visible bot-free tools, as exposed (CV020, CV042, CV045).
    - No wiretap/consent complaint naming Granola directly after a defined monitoring window (e.g., 12 months).
  notes: Each row pairs a thesis or anti-thesis argument with the specific evidence behind it and a concrete disconfirming/confirming signal to watch for.
