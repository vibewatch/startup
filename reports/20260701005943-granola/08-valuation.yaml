- id: TV005
  title: Thesis-break and kill triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Wiretap/CIPA or biometric-privacy complaint naming Granola directly
    - Any complaint filed naming Granola as a defendant
    - Erodes the bot-free trust positioning central to differentiation; precedent shows comparable litigation against Otter.ai (CV042, CV045).
    - Downgrade risk rating to critical; reassess recommendation immediately.
  - - Disclosed down round or verifiable secondary trade below $1.5B
    - Any priced round or corroborated secondary transaction below the Series C mark
    - Invalidates the growth narrative behind the Series C price; confirms bear-case repricing (CV023).
    - Re-underwrite valuation stance to expensive/avoid.
  - - No disclosed ARR/revenue by the next financing cycle
    - Continued zero financial disclosure through an estimated Series D window (~2027)
    - Prevents any independent verification of the growth claim underpinning the current thesis (CV011, CV028).
    - Maintain research-more/track; do not upgrade to buy.
  - - Competitor ships materially superior bot-free plus enterprise-API stack at a lower price
    - Feature parity within two pricing tiers from Fathom, tl;dv, Otter, or a bundled incumbent
    - Commoditizes the core value proposition and undermines any premium multiple (CV019).
    - Downgrade valuation stance; reassess competitive moat.
  - - First audited or investor-disclosed financials reveal margin or burn distress
    - First disclosed set of financials showing gross margin materially below the ~70% SaaS floor or a short runway
    - Converts today's opacity risk into a hard, potentially negative data point (CV010, CV048).
    - Re-run the valuation model against real financials; recommendation may move in either direction.
  - - Strategic-acquisition approach priced below the last primary round
    - Any credibly reported acquisition approach under $1.5B
    - Signals the market's true clearing price is below the private mark (CV037 provides the scale reference for what strategics will pay when proof exists).
    - Treat as external confirmation of the bear case.
  notes: Triggers are monitorable, forward-looking conditions, not events that have occurred as of this run; thresholds are qualitative judgment calls, not contractual covenants.
