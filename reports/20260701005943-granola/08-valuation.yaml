- id: TV003
  title: Bull / base / bear scenarios
  columns:
  - Scenario
  - Key assumptions
  - Valuation/return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - 250% quarterly growth persists near-term; Brex-style land-and-expand generalizes across the named enterprise roster; new APIs/admin dashboard drive expansion revenue (CV016, CV021).
    - Next round prices at or above $1.5B-$2.5B, roughly tracking the AI-application multiple band (8x-20x ARR) cited by market analysts if a $150M-$300M ARR base were eventually disclosed (CV021).
    - No disclosed ARR to confirm growth persistence; commoditization from Fathom/tl;dv/bundled incumbents (CV019).
    - Consistent with Bloomberg-reported growth continuing, but such hyper-growth rates typically decelerate over time; unconfirmed by any second data point.
  - - Base
    - Growth decelerates toward a 40%-60% YoY band typical of post-hypergrowth SaaS; next round prices flat to modestly up given Carta's 12.5% YoY Series C valuation increase (CV022, CV025).
    - Valuation holds in the $1.5B-$2.0B range at the next primary or secondary event; company remains private through 2027-2028 (CV022).
    - Feature commoditization compresses pricing power even if growth holds up (CV019).
    - Matches Carta's broad late-stage valuation-inflation trend but does not confirm Granola-specific durability (CV025).
  - - Bear
    - Growth decelerates sharply; wiretap/consent litigation precedent (Otter.ai) extends to Granola; audit-exemption filings continue to withhold financials from any institutional follow-on diligence (CV023, CV042, CV010).
    - Next financing prices flat or down, consistent with Carta's 11.4% industry down-round rate; a secondary mark below $1.5B becomes plausible (CV023).
    - No independent verification of unit economics may ever surface before a capital-access crunch (CV011, CV028).
    - Grounded in Carta's live down-round base rate and active litigation precedent against a directly comparable bot-based peer (CV023, CV042).
  notes: Valuation ranges are illustrative scenario framing built from category-level multiple and growth-rate benchmarks (Carta, Finro, SaaS benchmark data), not a Granola-specific discounted model, because no ARR/revenue base is disclosed.
