  - id: sizing-lenses
    title: "Sizing Lenses: A Range of Estimates Instead of One Broad Number"
    body: >-
      No single TAM figure fairly represents Granola's opportunity, because publishers disagree on the category boundary itself. Broad "AI meeting assistant"
      lenses that bundle transcription, scheduling, and analytics put the 2025 global market at roughly $3.14 billion (The Business Research Company), $3.47
      billion (Grand View Research, via a GII Research summary since the primary report was blocked behind a bot challenge), and $3.50 billion (Statifacts),
      with each publisher projecting the market to $9.33 billion by 2030, $17.55 billion by 2032, or $21.48 billion by 2033 respectively at CAGRs of 24.3% to
      25.9%. Narrower lenses that isolate standalone "AI note-taking" software specifically are five to seven times smaller: Congruence Market Insights sizes
      the category at $450.7 million in 2024 growing to $1.80 billion by 2032 (18.9% CAGR), and Precedence Research sizes it at $623.5 million in 2025 growing
      to roughly $3.48 billion by 2035 (18.75% CAGR). A third, independently sourced estimate cited by Startup Fortune attributes to PitchBook a $3.5 billion
      2024 valuation for "AI transcription and meeting intelligence," growing to $11.8 billion by 2030, which sits closer to the broad lens than the narrow one.


      Every lens reviewed points to durable double-digit growth, but none of them isolates Granola's own serviceable market. No public source in this research
      set discloses Granola's revenue, ARR, or paid-seat count, so a company-specific SAM or SOM cannot be derived and is preserved here as an open diligence
      question rather than guessed. The practical takeaway for underwriting is to treat the broad lens as the outer boundary of category tailwind, the narrow
      lens as a closer (but still generic) proxy for standalone notetaking software demand, and to discount both by the unknown share of demand that bundled
      incumbent features already satisfy for free.
