  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: market sizing
      missingEvidence: Granola's own ARR, ACV, or paid-seat count.
      whyItMatters: >-
        Without a company-specific revenue or seat baseline, no analyst market-sizing lens can be converted into a defensible SAM/SOM or penetration-rate
        estimate for Granola specifically.
      diligencePath: Request a signed-NDA data-room disclosure of Granola's revenue, seat count, and ACV by buyer segment during the next diligence round.
      relatedQuestionRefs:
        - QM027
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: market sizing
      missingEvidence: >-
        A reconciled category definition that separates transcription-only note-taking software revenue from full conversation-intelligence and
        meeting-assistant platform revenue.
      whyItMatters: >-
        Broad and narrow analyst lenses differ by five to seven times for what is nominally the same market, making any single headline TAM figure potentially
        misleading without the category boundary attached.
      diligencePath: >-
        Commission or license a primary analyst report (e.g., a paid Grand View Research or Gartner license) that explicitly separates notetaking-only revenue
        from adjacent conversation-intelligence revenue.
      relatedQuestionRefs:
        - QM008
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: adoption constraint
      missingEvidence: >-
        Vendor-level market-share or revenue-split data between bundled incumbent features (Teams, Meet, Zoom) and standalone paid vendors such as Granola,
        Fathom, Fireflies, and Otter.
      whyItMatters: >-
        Without this split, it is impossible to size the truly available "standalone paid" wedge of the market versus demand that bundled incumbents already
        satisfy for free.
      diligencePath: >-
        Seek analyst or survey data on buyer tool-selection behavior (e.g., a Gartner or Forrester adoption survey) that explicitly asks whether buyers use a
        bundled or standalone AI meeting-notes tool.
      relatedQuestionRefs:
        - QM028
      relatedTableRefs:
        - TM004
    - type: access-blocked
      severity: minor
      topic: market sizing
      missingEvidence: Grand View Research's full primary AI Meeting Assistant Market report.
      whyItMatters: >-
        The chapter relies on a syndicated GII Research summary rather than the primary report, which could omit methodology detail or regional/segment
        breakdowns useful for underwriting.
      diligencePath: Purchase or request licensed access to the primary Grand View Research report directly rather than relying on the syndicated summary.
      relatedQuestionRefs:
        - QM004
      relatedTableRefs:
        - TM002
    - type: stale
      severity: material
      topic: adoption constraint
      missingEvidence: A 2026-dated re-verification of Granola's data-residency and enterprise-readiness posture (EU hosting, on-prem/VPC options).
      whyItMatters: >-
        BuildBetter's enterprise-readiness review predates the March 2026 Series C and local-database change; Granola's current hosting and compliance posture
        may have moved since that review was published.
      diligencePath: >-
        Request an updated SOC 2 report and a direct written confirmation of Granola's current data-hosting regions from the company's enterprise sales or trust
        team.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM004
