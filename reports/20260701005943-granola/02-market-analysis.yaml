  - id: drivers-constraints-and-gaps
    title: Growth Drivers, Adoption Constraints, and Diligence Gaps
    body: >-
      Structural demand drivers for AI meeting-notes software look durable. Microsoft's Work Trend Index telemetry finds that the average Microsoft 365 user is
      interrupted every two minutes during core work hours (275 times a day) by meetings, emails, or chats, that 57-60% of meetings are unscheduled or ad hoc,
      and that nearly a third of meetings now span multiple time zones, up 35% since 2021. Gallup survey data cited in Granola's own hybrid-teams guide shows
      52% of US remote-capable employees now work in a hybrid arrangement and 26% work fully remote, sustaining demand for tools that capture both in-room and
      remote audio reliably. An IDC-sourced estimate that Granola cites attributes a $31.5 billion annual cost to lost institutional knowledge across Fortune
      500 companies, reinforcing the commercial logic behind Granola's March 2026 expansion from a personal notepad into Spaces, APIs, and MCP connectors aimed
      at capturing and reusing organizational context rather than single meetings.


      The constraints are just as concrete. Microsoft, Google, and Zoom each bundle a free AI meeting-notes feature directly into subscriptions many buyers
      already pay for, which caps the price standalone vendors can charge for notetaking alone and pushes companies like Granola toward differentiated context
      and agent workflows to justify a separate line item. Trust and regulatory friction are also visible in the public record: Startup Fortune (citing a prior
      Verge report) found that Granola exposes notes to anyone holding a share link by default and trains on transcripts unless a user opts out, BuildBetter's
      independent review scored Granola 3 out of 10 on enterprise readiness citing US-only AWS hosting with no EU region or on-premises option, and in March
      2026 Granola's decision to encrypt its local notes database drew public criticism from a16z partner Guido Appenzeller in a widely viewed social thread,
      prompting some users to consider markdown-based alternatives. None of these constraints is fatal on its own, but together they show that Granola's growth
      depends on closing trust, data-residency, and lock-in gaps at the same time bundled incumbents are commoditizing the basic notetaking feature. Two sizing
      questions remain genuinely open and are preserved rather than estimated: how much of the broad analyst-estimated market is already captured by bundled
      incumbent features rather than standalone vendors, and whether Granola's own SAM/SOM would sit closer to the broad or the narrow analyst lens.
