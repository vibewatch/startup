company:
  name: Granola
chapter:
  number: 1
  title: Company Overview
  summary: Granola is a London-founded AI meeting-notes company that moved from a May 2024 launch to a $1.5B March 2026 unicorn valuation in roughly two years of public operating history. The company differentiates
    with a bot-free, human-in-the-loop note-taking workflow, has expanded from a personal notepad into a team context layer with Spaces, APIs, MCP, and Briefs, and shows strong public customer proof — but
    key underwriting metrics such as revenue, seat count, and headcount remain undisclosed, while a March 2026 local-database backlash highlights early governance and platform-control risk.
sections:
- id: identity-product-stage
  title: Identity, Product, and Stage
  body: 'Granola is an AI meeting-notes startup built around a simple positioning statement: notes, actions, and memory without a meeting bot. The homepage, product pages, and investor writeups all describe
    the product as a human-in-the-loop notepad that combines what the user types with AI transcription and structuring rather than asking a bot to join the call and summarize everything autonomously. That
    design choice matters because it defines both product experience and market category: Granola wants to be closer to Apple Notes or Notion for conversations than to a visible Zoom copilot.


    As of the 2026-07-01 run date, the company is clearly in late-stage private startup territory. Official and independent March 2026 coverage place headquarters in London, note support for macOS, Windows,
    and iPhone, and frame the business as expanding from a prosumer note-taking utility into enterprise conversation infrastructure. By March 2026 Granola had reached a $1.5 billion valuation and was positioning
    Spaces, APIs, and connector surfaces as the operating system for company meeting context, not just a standalone transcription tool.'
