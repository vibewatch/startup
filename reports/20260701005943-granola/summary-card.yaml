  topStrengths:
    - >-
      Funding history and comparable-company facts are consistently corroborated by at least two independent,
      cross-checked sources, including official company statements and high-reputation news coverage.
    - >-
      Bot-free, device-level architecture is real and independently corroborated by a security researcher's teardown and
      a reverse-engineered open-source client, underpinning a SOC 2 Type II certification completed in roughly three
      months.
    - >-
      Independent B2B transaction data (YipitData Signals) shows a genuine 2026 adoption inflection: 25%
      month-over-month mid-market customer growth, 3x six-month spend growth, near-zero measured churn, and asymmetric
      switching away from rival tools.
    - >-
      Four flagship company-published case studies (Zapier, Vanta, Brex, Vercel) each report 52-100% organization-wide
      adoption after a single grassroots user, showing a consistent, repeatable land-and-expand pattern across distinct
      buyer personas.
    - >-
      Durable, well-documented structural demand drivers position the AI meeting-notes category for double-digit growth
      through the early 2030s across every market-sizing lens reviewed.
  topRisks:
    - >-
      No revenue, ARR, gross margin, cash balance, or burn figure has been disclosed by Granola, its investors, or any
      third-party data provider, so the $1.5B post-money valuation cannot be checked against a company-specific
      financial base.
    - >-
      Legal precedent against Otter.ai's consolidated federal class action over wiretap and biometric-voiceprint consent
      is active, not hypothetical, and is treated by legal commentary as a category-wide risk that could reach Granola.
    - >-
      Bundled incumbents (Microsoft Teams/Copilot, Google Workspace/Gemini, Zoom AI Companion) give away comparable
      notetaking features inside subscriptions buyers already pay for, capping Granola's standalone pricing power.
    - >-
      Three disclosed security postmortems in one year and a March 2026 local-database-encryption change that broke
      third-party agent workflows undercut Granola's own 'private by default' marketing claim, which independent
      reporting also contradicts.
    - >-
      Capital-adequacy disclosure is structurally opaque: Granola Labs Ltd's UK small-company audit exemption means no
      ordinary future statutory filing will surface turnover, margin, or cash burn.
  unresolvedGaps:
    - An absolute revenue or ARR figure and a tier-by-tier (Business/Enterprise/API) revenue split for Granola.
    - Cash on hand, monthly burn rate, and runway in months for Granola.
    - >-
      Net revenue retention, gross revenue retention, logo-churn rate, or contract-value data broken out by customer
      segment.
    - >-
      Confirmation of whether the three published security postmortems represent the complete set of material incidents,
      plus a HIPAA Business Associate Agreement or EU-hosting roadmap.
    - >-
      Confirmation of whether Granola has named a CFO, General Counsel, or Head of Compliance, and whether any
      litigation or regulatory action has been filed against the company.
