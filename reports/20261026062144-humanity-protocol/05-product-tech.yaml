schemaVersion: "report-v2"
artifact: product-tech
slug: humanity-protocol
runDate: "2026-10-26"
company:
  name: Humanity Protocol
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Humanity Protocol is presenting a palm-based human-identity product alongside a
    mainnet credential layer that its launch materials describe as using zkTLS.
    First-party pages and industry coverage establish a product narrative and
    announced integrations, but do not establish independent security assurance,
    production adoption, or measurable service performance.
sections:
  - id: product-workflow
    title: Product surface and user workflow
    body: >-
      Biometric Update's launch coverage and Humanity's LayerZero announcement
      describe a palm-based proof-of-humanity model with zero-knowledge
      verification (CE001). A founder interview describes mobile palm capture,
      but does not establish independently tested enrollment performance
      (CE002). Later mainnet-release coverage describes a broader
      credential proposition: zkTLS proofs over existing Web2 records, with
      loyalty, financial, educational, and professional examples (CE004,
      CE005). These are product and launch claims, not independent deployment
      or outcome measurements. A product guide published by XT Exchange also
      presents Human ID and H-token functions, but does not independently
      validate implementation or adoption (CE014).
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE014
    tableRefs:
      - TE001
      - TE002
  - id: technical-architecture
    title: Architecture and maturity
    body: >-
      The available descriptions span biometric enrollment, privacy-preserving
      credential proofs, a Humanity mainnet, and a reported zkTLS capability.
      Biometric Update describes the early palm-and-ZK proposal, while Humanity's LayerZero
      post says zkProofers handle verifiable credentials and zero-knowledge
      presentations without directly accessing user information (CE001,
      CE013). The GitHub organization page lists mainnet and testnet chain IDs,
      a Developer API link, and 31 repositories, which establishes a visible
      developer surface but not its usage or code quality (CE007). A mainnet
      launch article says zkTLS moved to the foreground and palm scans became
      optional; that is a reported product-positioning change, not measured
      biometric performance (CE008). The 2024 launch coverage documents the
      earlier palm-and-ZK framing (CE009). The architecture figure is therefore
      a map of attributed product descriptions, not a verified system diagram.
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE013
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: integrations-and-differentiation
    title: Integrations and differentiation
    body: >-
      Humanity announced LayerZero Labs as a zkProofer and described a potential
      integration context spanning more than 95 dApps and 70 chains (CE006).
      The mainnet-release page also lists airline and hotel loyalty accounts and
      financial, educational, and professional credentials as use cases
      (CE005). These announcements suggest a strategy of combining a reusable
      human credential with proofs of selected attributes, rather than making
      the palm scan the only ongoing interaction. However, the assigned
      evidence does not identify an independently verified production
      deployment, usage denominator, contract, or measured benefit for the
      named integration examples (CE005, CE006, CE012). Do not interpret an
      announced partner, a listed dApp universe, or a credential example as
      evidence of active customer adoption.
    claimRefs:
      - CE005
      - CE006
      - CE012
  - id: trust-and-operational-risk
    title: Trust, security, and operating evidence
    body: >-
      The privacy proposition depends on biometric handling, proof generation,
      credential control, and network/key operations, but the assigned
      first-party product and developer pages provide no independent audit
      scope, biometric error rates, uptime or service-level results, or
      production-use denominators (CE012). Biometric Update's company profile
      lists a February 23, 2026 headline attributing a major token breach to a
      key-storage error and malware infection; the profile excerpt does not
      establish incident scope or any compromise of palm biometrics (CE011).
      A Crypto Briefing interview records the founder's description of
      biometric information being held across multiple network nodes and
      user-deletable; this remains a company statement, not an independent
      control assessment (CE015).
      This is a material diligence signal, not proof that the identity
      verification mechanism failed. Investors should request the incident
      postmortem, current key-management and privileged-access controls,
      independent security assessments, and evidence distinguishing reserved
      IDs from verified and active credentials.
    claimRefs:
      - CE011
      - CE012
tables:
  - id: TE001
    title: Product module and asset map
    columns:
      - Module or asset
      - User or role
      - Reported status or maturity
      - Differentiation described
      - Diligence gap
    rows:
      - - Human ID
        - End user and integrating application
        - Described as a reusable identity credential
        - Portable human and attribute proofs are the stated product concept
        - No assigned source quantifies active credentials or repeat use
      - - Palm recognition
        - User enrolling in proof of humanity
        - Founder interview describes mobile palm capture; independent test evidence not supplied
        - Palm-based enrollment is positioned as an alternative biometric input
        - No false-accept, false-reject, liveness, or demographic performance data
      - - Zero-knowledge proof layer
        - Credential holder, verifier, and zkProofer
        - Described in first-party product and integration materials
        - Verify a claim without directly exposing the underlying identity information
        - No assigned independent audit or implementation benchmark
      - - zkTLS credential proofs
        - User bringing an existing Web2 credential to an application
        - Mainnet launch materials describe this capability
        - Prove selected facts without disclosing the source page
        - No independent end-to-end test or named production outcome in the pool
      - - Humanity mainnet and developer surface
        - Application developers and network participants
        - GitHub organization lists mainnet and testnet chain IDs and a Developer API link
        - Provides a network and developer entry point for the credential proposition
        - Repository page alone does not establish code maturity, uptime, or developer adoption
    notes: >-
      Status and differentiation summarize company pages, company-issued launch
      materials, and cited industry coverage; they are not independent validation.
      “No assigned source” means the reviewed chapter pool did not establish the
      metric, not that the metric or evidence does not exist.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE009
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current or proposed workflow
      - Humanity solution described
      - Measurable benefit in assigned evidence
      - Limitation
    rows:
      - - Establish a reusable human credential
        - Reserve or create Human ID, then use the described palm-based proof flow
        - Palm recognition and zero-knowledge verification
        - No independent active-use or completed-verification metric supplied
        - Assigned evidence does not distinguish reservations from active credentials
      - - Prove an attribute to an application
        - Present a selected proof instead of the underlying identity or record
        - Human ID and zkTLS or zero-knowledge credential proofs
        - No conversion, completion-time, or privacy-outcome metric supplied
        - Product pages and launch materials are not independent deployment tests
      - - Reuse loyalty or professional credentials
        - Link a Web2 credential to Human ID and prove selected facts
        - Mainnet release materials list travel loyalty, finance, education, and professional examples
        - No verified active account, customer outcome, or contract metric supplied
        - The page is a company-issued launch announcement
      - - Add human verification to cross-chain applications
        - Use a zkProofer integration in a partner's application context
        - Humanity announced LayerZero Labs as a zkProofer
        - Announcement cites more than 95 dApps and 70 chains as integration context
        - Scope does not establish live integrations, transactions, or reduced fraud
    notes: >-
      Workflow and benefit descriptions preserve the issuer's framing. Counts and
      integration scope are not independently verified adoption metrics; no
      benefit is inferred where the assigned sources provide none.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE014
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role described in sources
      - Dependency or boundary
      - Risk or diligence question
    rows:
      - - Identity input
        - Palm scan is described as a proof-of-humanity input
        - Founder interview describes mobile capture; implementation details are not independently documented
        - Request sensor, liveness, enrollment, and deletion specifications
      - - Credential representation
        - Human ID is described as a reusable credential
        - User control and portability are claims in interview and company materials
        - Verify recovery, revocation, account linking, and credential lifecycle
      - - Proof generation and verification
        - Zero-knowledge proofs and zkProofers are described as protecting claims
        - No assigned independent implementation review or performance test
        - Obtain threat model, audit scope, and proof-generation latency
      - - Web2 credential proving
        - Mainnet materials describe zkTLS for proving facts from existing records
        - Depends on supported source services and a reliable proof flow
        - Test source coverage, replay resistance, and failure handling
      - - Network
        - GitHub organization lists Humanity mainnet and testnet chain IDs
        - Repository listing is not an uptime or decentralization measurement
        - Request validator distribution, incident controls, and service history
      - - Application integration
        - LayerZero zkProofer role and travel or credential examples are announced
        - Partner and use-case announcements are not deployment proof
        - Confirm production scope, active users, and measured outcomes
    notes: >-
      This is an evidence-bounded operating map assembled from source descriptions,
      not a complete or independently verified architecture specification.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
