    type: stack
    summary: >-
      Attributed product descriptions place identity and Web2 credential inputs
      above proof, network, and application layers; the sequence is not an
      independently verified system design.
    data:
      layers:
        - label: Identity input
          detail: Palm-based proof-of-humanity input described in industry coverage and a founder interview.
        - label: Credential input
          detail: Existing Web2 records used as zkTLS credential inputs in mainnet launch materials.
        - label: Reusable identity
          detail: Human ID is described as a reusable credential for applications.
        - label: Privacy proofs
          detail: Zero-knowledge proofs and zkProofers are described in company materials.
        - label: Network
          detail: GitHub lists Humanity mainnet and testnet chain IDs and a Developer API link.
        - label: Applications
          detail: LayerZero integration and travel or credential use cases are announced, not independently verified deployments.
    approximationNotes: >-
      Company-described components and launch claims only; layer ordering is a
      conceptual grouping, not a verified dependency or execution sequence.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE013
