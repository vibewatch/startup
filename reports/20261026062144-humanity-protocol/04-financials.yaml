company:
  name: Humanity Protocol
chapter:
  number: 4
  title: Financials
  summary: Public evidence describes Humanity Protocol's identity services and the intended utility of its H token, but does not establish recurring service revenue, realized pricing, margins, or current liquidity. The $20 million round reported in January 2025 is a historical financing event, not evidence of cash still available; token-market activity and the June 2026 exploit add substantial volatility without resolving company-level economics.
sections:
  - id: commercial-model
    title: Product activity is visible; monetization is not
    body: >-
      Humanity's current public description presents a privacy-preserving identity and credential network, with APIs for integrating identity services; earlier reporting described its palm-based Proof-of-Humanity launch. The company later framed the product as expanding from uniqueness checks toward broader trust credentials. These materials describe what the network is intended to do, not the number of paying customers or the revenue earned per verification. The company's 2025 post also described more than five million Human IDs on its testnet, a company-reported activity measure rather than paid users, revenue, or retention. No reviewed source supplies a fee schedule, contract value, billing basis, revenue recognition policy, or customer-level conversion data. Financial underwriting should therefore treat service monetization as unproven, not infer revenue from product availability or testnet registrations.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI013
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: token-economics
    title: H utility is described, while token value is not company revenue
    body: >-
      Humanity's company materials describe H as supporting rewards, governance, and participation; Wealthsimple identifies staking and ecosystem participation as uses. Its page is marked updated September 22, 2026, while the H update section is dated June 19, making the token-supply snapshot date unclear. Those descriptions establish intended token functions, not fee capture, treasury proceeds, or recurring fiat revenue. External token snapshots report different circulating-supply figures and market values, and their timestamps and methodologies do not reconcile cleanly. The June 2026 incident was followed by a reported sharp token-price decline and allegations of unauthorized token activity. These are material indicators of market and operational risk, but they are not a measure of the company's accounting loss, cash burn, or remaining assets. Treat token-market metrics as volatile external observations, separate from company operating performance.
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
  - id: capital-and-unit-economics
    title: Historical financing does not answer present capital adequacy
    body: >-
      Verdict and Biometric Update reported a $20 million round at a $1.1 billion fully diluted valuation in January 2025. This is useful historical financing context, but neither the round nor its valuation establishes proceeds still on hand, current liabilities, or available runway. The assigned public materials do not provide company revenue, gross margin, service-delivery costs, CAC, payback, working capital, capex, burn, debt, or current cash. The distinction is decisive: a funding announcement is not a balance sheet, a token price is not revenue, and an incident's reported token-market impact is not accounting loss or cash burn. Until management provides current financial statements and operating metrics, neither unit economics nor financing dependency can be underwritten quantitatively.
    claimRefs:
      - CI006
      - CI013
      - CI014
      - CI015
    tableRefs:
      - TI003
  - id: underwriting-verdict
    title: Underwriting remains blocked by private operating data
    body: >-
      The public record supports a product and token ecosystem with reported testnet activity, a historical financing round, and a live secondary-market token; it does not demonstrate a repeatable paid workflow or cash-generative operating model. The five-million-Human-ID figure is company-claimed testnet activity, and should not be substituted for paying accounts or customers. Token supply and market-price snapshots also differ across the sources and dates reviewed. The appropriate financial conclusion is a material evidence gap rather than a forecast: request audited or management-prepared income statements, cash and debt schedules, fee and contract data, customer cohorts, and post-incident treasury reconciliation. Revenue quality, margin trajectory, capital intensity, and runway remain unverified pending that evidence.
    claimRefs:
      - CI004
      - CI006
      - CI012
      - CI013
      - CI014
      - CI015
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Stream
      - Mechanism described
      - Unit
      - Current value or status
      - Evidence quality
      - Diligence ask
    rows:
      - - Identity and credential verification
        - Palm-based human verification and reusable privacy-preserving credentials are described as protocol capabilities.
        - Verification or credential event
        - No paid volume or service revenue disclosed in reviewed sources.
        - Product description; no customer or revenue corroboration.
        - Obtain paid and unpaid event volumes, customer contracts, and revenue-recognition policy.
      - - Developer/API integrations
        - The company says organizations can integrate its APIs; no rate card is shown.
        - API call or contract
        - Pricing and realized revenue not disclosed.
        - Company description only.
        - Request API pricing, usage tiers, discounts, and executed contract examples.
      - - H token ecosystem
        - Company and platform materials describe staking, governance, rewards, and ecosystem participation.
        - H token and on-chain activity
        - Token utility is described; company fee capture and cash proceeds are not established.
        - Intended utility, not verified operating revenue.
        - Reconcile protocol fee flows, treasury receipts, and token-incentive costs.
      - - Enterprise or institutional deployments
        - Public reporting describes integrations and identity use cases, but not customer economics.
        - Customer contract or deployment
        - Customer count, contract value, and recurring share not disclosed.
        - No named contract economics in assigned evidence.
        - Obtain customer-level deployment, renewal, concentration, and payment data.
    notes: "Partial public-source review: rows summarize described mechanisms, not an exhaustive revenue catalogue; null economics mean no value was disclosed in the assigned evidence."
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI013
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Item
      - Price or monetization basis
      - List versus realized
      - Evidence status
      - Underwriting implication
    rows:
      - - Verification/API services
        - No public unit price or fee schedule in reviewed official materials.
        - Neither list nor realized price available.
        - Company describes APIs and identity services, without prices.
        - Service revenue cannot be modeled from public pricing.
      - - H token secondary market
        - External snapshot reported $0.06932 per H on September 30, 2026.
        - Market quote, not company-recognized revenue or realized service pricing.
        - StealthEX price-prediction page; date-specific snapshot.
        - Token price is volatile and does not establish protocol fee capture.
      - - Enterprise contracts
        - Contract terms, minimums, discounts, and payment schedules not disclosed.
        - Not available.
        - No customer contract or pricing sheet in assigned evidence.
        - Do not infer ARR, recurring revenue, or customer willingness to pay.
    notes: "The token quote is a secondary-market observation from September 30, 2026; it is not an issuer price list, a company valuation, or service revenue."
    claimRefs:
      - CI001
      - CI011
      - CI013
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Historical financing
        - $20 million round at a reported $1.1 billion fully diluted valuation; January 2025.
        - Third-party reported; historical.
        - Establishes a financing event, not current liquidity or cash available.
        - Obtain closing documents, proceeds by entity, and subsequent use of funds.
      - - Revenue, ARR, and revenue mix
        - Not disclosed in assigned public sources.
        - Unavailable.
        - Recurrence and revenue quality cannot be assessed.
        - Provide audited revenue bridge by product, customer, and contract term.
      - - Gross margin and delivery cost
        - Not disclosed in assigned public sources.
        - Unavailable.
        - Cost to verify, store, and support credentials is unknown.
        - Provide gross-margin definition and cost allocation by service.
      - - CAC, sales cycle, and payback
        - Not disclosed in assigned public sources.
        - Unavailable.
        - Sales efficiency and channel economics cannot be underwritten.
        - Provide cohort-level acquisition spend, conversion, cycle, and payback.
      - - Cash, burn, runway, debt, and capex
        - Current figures not disclosed; historical funding alone cannot establish them.
        - Unavailable.
        - Capital adequacy and financing dependency remain unknown.
        - Provide current balance sheet, monthly cash flow, debt schedule, and forecast.
    notes: "Historical funding is reported by external outlets; all undisclosed operating and balance-sheet metrics remain gaps rather than zeroes or estimates."
    claimRefs:
      - CI006
      - CI013
      - CI014
      - CI015
