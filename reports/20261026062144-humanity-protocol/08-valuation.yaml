artifact: valuation
slug: humanity-protocol
runDate: 2026-10-26
company:
  name: Humanity Protocol
chapter:
  number: 8
  title: Valuation
  summary: The available pool supports a reported January 2025 $1.1bn fully diluted financing mark and a volatile, separately valued H token, but not a current private-company equity valuation or operating multiple. A June 2026 key-compromise incident and token migration increase the evidence burden; recommend research-more with high risk and an unknown company valuation stance.
sections:
  - id: valuation-evidence
    title: What the public price evidence does—and does not—value
    body: >-
      Two distinct valuation objects must not be conflated. News reports place a
      January 2025 $20m financing at a $1.1bn fully diluted valuation, while an
      earlier 2024 report described a $30m seed round at a $1bn valuation
      (CV001, CV002). These are historical reported financing marks, not a
      current October 2026 share price or verified enterprise value. CryptoRank
      displayed H at $0.05213 in the prefetched page (CV004); Wealthsimple's
      September 22, 2026 update gave a 10bn total supply and approximately
      2.62bn H in circulation (CV005). Multiplying those inputs yields an
      estimated token FDV of about $521m and circulating capitalization of
      about $137m (CV006). The calculations are token-market measures: they do
      not establish company revenue, equity value, treasury backing, or
      investor proceeds. The displayed quote is a page snapshot without an
      explicit observation time in its text, and the circulating count is
      approximate. Do not use the token figures as a substitute for a current
      financing term sheet, cap table, or revenue-based valuation.
      The separate Worldcoin product comparisons are not financial
      comparables: the retained articles provide no matched operating metrics
      or valuation multiples for Humanity Protocol (CV016).
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV012, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: value-creation-and-risk
    title: Thesis and anti-thesis
    body: >-
      The upside case is a company-positioned identity product: Humanity's own
      materials describe palm-based proof of humanity and reusable credentials,
      and its 2025 blog presented $H as a way to participate in the ecosystem
      (CV007, CV008). The blog also reported more than five million Human IDs,
      but that is a company-reported scale indicator, not verified active
      users, paying customers, retention, or revenue (CV009). The valuation
      bridge therefore depends on converting claimed identity activity into
      durable demand and monetizable workflows; this source pool provides no
      unit economics with which to underwrite that bridge. The anti-thesis is
      unusually material: Wealthsimple reported that Humanity disclosed a
      June 9, 2026 private-key compromise and a June 16 full token migration
      with a 1:1 airdrop (CV010). Crypto Times separately reported that
      on-chain investigator ZachXBT disputed the account; those allegations
      remain allegations, not established findings (CV011). The incident and
      migration make independent evidence on recovery, controls, supply
      reconciliation, and post-incident usage central to any valuation.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV013]
    tableRefs: [TV002]
  - id: decision-and-diligence
    title: Price-sensitive decision and diligence
    body: >-
      The recommendation is research-more, with high risk and an unknown
      valuation stance—not a buy or an assertion that the token is cheap. The
      reported private mark is stale and fully diluted, while the observed H
      token price and supply produce only token-capitalization estimates
      (CV001, CV006, CV012). No probability-weighted company-equity value,
      target return, or exit multiple is supportable without current audited
      financials, an updated capitalization and preference schedule, and
      evidence that users or counterparties pay for the product (CV014,
      CV015). Scenario values below are explicitly token-FDV sensitivities,
      not forecasts or company valuations. Before reconsidering the call,
      obtain current financing documents and the cap table; revenue, gross
      margin, cash flow and paid-customer/retention data; token treasury,
      unlock and migration reconciliation; and independent post-incident
      security-control evidence. A verified paid customer base and successful
      independent control review would improve the case; unresolved
      privileged-key weaknesses, further dilution, or no demonstrated
      monetization would break it.
    claimRefs: [CV001, CV006, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary and valuation evidence
    columns: [Decision item, Observed evidence, Underwriting treatment, Implication]
    rows:
      - [Recommendation, "Research-more; high risk; valuation stance unknown", "Require current equity and commercial evidence", "No buy conclusion"]
      - [Historical private financing, "$20m at $1.1bn fully diluted valuation reported in January 2025", "Historical financing mark; not a current equity price", "Update with primary financing documents"]
      - [H token market snapshot, "$0.05213 displayed price; 10bn total supply; approximately 2.62bn circulating", "Inputs are from CryptoRank's page snapshot and Wealthsimple's September 22, 2026 update", "Token measures only"]
      - [Derived H token capitalization, "Approximately $137m circulating capitalization and $521m fully diluted value", "Price multiplied by reported approximate circulating and total supply", "Not company revenue, enterprise value, or equity value"]
      - [Company valuation inputs, "Current revenue, margins, cash flow, equity terms, and preferences are not established in this pool", "No defensible company-equity multiple or target return", "Request audited financials and cap-table materials"]
    notes: >-
      Funding marks are third-party reports of different dated rounds and are
      not reconciled as equivalent instruments. Token capitalization is
      calculated from a page-displayed H price and a third-party platform's
      approximate supply figures; it is not a company valuation. The $0.05213
      page text does not state an observation timestamp.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV012, CV014]
  - id: TV002
    title: Thesis versus anti-thesis
    columns: [Argument, Evidence in this pool, What would change the view]
    rows:
      - ["Thesis: identity utility could scale", "Company materials market palm-based proof of humanity and reusable credentials", "Independent paid-use, retention, and workflow-conversion evidence"]
      - ["Thesis: token participation could support an ecosystem", "Company and Wealthsimple describe ecosystem, governance, or reward functions for H", "Evidence of sustained utility, demand, and sound treasury/unlock design"]
      - ["Anti-thesis: commercial value is unproven", "No assigned source provides verified revenue, margin, cash-flow, or paid-customer economics", "Audited financials and customer-level contract and retention data"]
      - ["Anti-thesis: control and token risk are elevated", "Wealthsimple reports the June 2026 key incident and migration; Crypto Times reports disputed allegations", "Independent forensic conclusions, control redesign, and reconciled token supply"]
      - ["Comparable set: product competitors are not valuation benchmarks", "Worldcoin comparisons lack matched operating metrics or a valuation multiple", "A same-model transaction or public benchmark with comparable metrics"]
    notes: >-
      Product and token utility statements from the company describe positioning
      or intended functionality, not demonstrated monetization. The public
      incident account and third-party allegations are attributed separately;
      allegations are not treated as verified misconduct.
    claimRefs: [CV007, CV008, CV010, CV011, CV013, CV015, CV016]
  - id: TV003
    title: Illustrative H-token FDV sensitivity, not a company valuation
    columns: [Case, Explicit scenario assumption, Illustrative token FDV, Probability signal, Trigger or disconfirming evidence]
    rows:
      - [Bear, "0.5x the approximately $521m token FDV implied by the captured price and 10bn total supply", "Approximately $261m", "Downside is material; probability is not quantifiable from this evidence", "Further security/control failures, supply dilution, or weak demand"]
      - [Base, "1.0x the same implied token FDV; no growth or discount assumed", "Approximately $521m", "Reference sensitivity only; not a forecast or expected value", "Requires stable post-migration supply and independently evidenced utility"]
      - [Bull, "2.0x the same implied token FDV", "Approximately $1.043bn", "Upside is conditional; probability is not quantifiable from this evidence", "Verified paying use, retention, and credible post-incident controls"]
    notes: >-
      The 0.5x, 1.0x, and 2.0x multiples are transparent analyst stress-test
      assumptions, not observed market benchmarks or probability-weighted
      forecasts. Values are rounded arithmetic on the token FDV estimate in
      CV006 and apply only to H token supply. They do not estimate Humanity
      Protocol's equity or enterprise value; probability weights and a
      company-equity return range remain unsupported.
    claimRefs: [CV004, CV005, CV006, CV010, CV013, CV015]
