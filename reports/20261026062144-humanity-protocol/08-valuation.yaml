callouts:
  - calloutType: recommendation
    title: Do not equate token FDV with company value
    body: The observed token price and supply support an approximate token-market sensitivity only; current company equity value, revenue multiples, and target return remain unproven.
    claimRefs: [CV004, CV005, CV006, CV012, CV014]
  - calloutType: risk
    title: Post-incident verification is a gating diligence item
    body: A reported Foundation-member key compromise and full token migration make independent evidence on control redesign and supply reconciliation necessary before underwriting.
    claimRefs: [CV010, CV011, CV013]
