evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current revenue, ARR, gross margin, paid-customer count, headcount, debt, reconciled cumulative funding, and cash
      available.
    whyItMatters: >-
      Without period-defined operating and financing data, issued Human IDs and announced funding cannot establish
      commercial traction, burn, runway, or ability to fund the recovery.
    diligencePath: >-
      Request audited financial statements, current management accounts, revenue by customer and product, dated
      headcount, debt schedule, financing instruments, and bank or treasury statements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      The legal headquarters, operating entities, incorporation jurisdictions, and current group structure that
      reconcile the Hong Kong-based description and San Francisco address listing.
    whyItMatters: >-
      Entity location and structure affect governing law, regulatory exposure, contracting counterparty, and
      accountability for user data and token controls.
    diligencePath: >-
      Obtain current corporate registry extracts, entity chart, principal operating address, and counsel-confirmed
      jurisdictional disclosures.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A current executive and board roster, biographies, decision rights, ownership, and the relationship between
      Humanity Protocol and Humanity Foundation.
    whyItMatters: >-
      The evidence identifies the founder and an incident-linked foundation member but cannot establish oversight,
      succession coverage, or privileged-control concentration.
    diligencePath: >-
      Request the current organization chart, board and committee records, cap table, foundation charter, signing
      policy, and post-incident access review.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: company-market-sizing
    missingEvidence: >-
      A transparent, independently corroborated bridge from broad identity verification spend to paid proof-of-humanity,
      palm-biometric, and reusable credential workflows, including buyer counts, volumes, and pricing.
    whyItMatters: >-
      Without an isolated addressable segment, the broad Mordor estimate and biometric share cannot support a Humanity
      Protocol TAM, SAM, SOM, or valuation case.
    diligencePath: >-
      Request market-study definitions and a company-level paid-volume and pricing bridge, then triangulate it against
      independent analyst work and public procurement evidence.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: post-incident-security
    missingEvidence: >-
      Substantive independent evidence on post-incident key management, signer policy, privileged access, and controls;
      the assigned Halborn text contains no technical findings.
    whyItMatters: >-
      Assurance and trust affect regulated and platform adoption, but a page title or absence of technical detail cannot
      establish whether controls improved or whether an incident has recurred.
    diligencePath: >-
      Obtain an independent post-incident assessment and validate remediation with enterprise security reviewers and
      buyer references.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: buyer-adoption
    missingEvidence: >-
      Named customer contracts, paid transaction volumes, realized pricing, conversion and retention cohorts, and
      verified budget owners for the claimed workflows.
    whyItMatters: >-
      Company use-case descriptions and category-wide market data do not prove that Humanity Protocol has customers
      allocating recurring operating budgets to the product.
    diligencePath: >-
      Request redacted contracts, cohort-level paid usage and retention, unit economics, and buyer references across
      financial-services and platform deployments.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitor-scale-pricing
    missingEvidence: >-
      Comparable, dated competitor disclosures for active and unique users, customer conversion, revenue or funding,
      pricing, contract terms, and the definitions behind any registered-ID totals.
    whyItMatters: >-
      Without common definitions and commercial terms, apparent user scale cannot establish adoption quality,
      monetization, relative economics, or a durable competitive lead.
    diligencePath: >-
      Obtain current competitor pricing and contract materials, dated operating metrics with active-versus-created
      definitions, and customer references that confirm paid use and deployment scope.
    relatedQuestionRefs:
      - QP003
