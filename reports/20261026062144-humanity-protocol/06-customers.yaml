chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence shows substantial but company-reported Human ID creation and announced integrations, not verified active customers, paid deployments, retention, or outcomes. The Mastercard and Moongate examples indicate possible financial-services and event channels, while a June 2026 security incident adds a material trust question without quantified customer effects."
sections:
  - id: "named-customer-evidence"
    title: "Named relationships show routes to market, not proven deployments"
    body: >-
      The strongest named commercial evidence is a November 2025 report that Humanity Protocol
      was teaming with Mastercard on Human ID-based financial-attribute verification. The article
      describes an initial U.S. availability plan and a lender credit-approval example, but does
      not quantify completed verifications, active lenders, conversion, or customer outcomes
      (CU006, CU007). A separate Biometric Update listing records Humanity Protocol's acquisition
      of Moongate for ticketing, credentialing, and access, while Gate Learn describes physical
      access scenarios; neither source identifies a live customer deployment or measured result
      (CU009, CU010). The available proof therefore supports named ecosystem relationships and
      proposed use cases, not a verified customer roster or production adoption. The journey
      exhibit keeps those evidence states separate from outcomes that remain undisclosed.
    claimRefs: [CU006, CU007, CU009, CU010, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: "segments-and-adoption"
    title: "Reported identity counts do not establish active or paying users"
    body: >-
      The plausible user groups span individuals registering Human IDs, developers or
      applications that consume identity credentials, financial-service providers seeking
      reusable eligibility proofs, and event or physical-access operators. Public material
      describes these segments unevenly: company material discusses developers and testnet
      registrations, while the Mastercard article describes a financial-services use case and
      Moongate points toward ticketing (CU001, CU006, CU009, CU016). The available counts use
      different labels and periods: a January 2025 interview reported 3.2 million digital IDs
      created over the prior four months; a company blog claimed over 5 million Human IDs after
      a testnet launch; and a profile repeats undated homepage figures of more than 8 million
      Human IDs and 25 global-brand integrations (CU001-CU005). These figures are not a
      consistent active-user series, and neither brand integrations nor created IDs reveal
      unique active users, paying accounts, or repeat usage.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU016]
    tableRefs: [TU001, TU002]
  - id: "durability-and-trust-gaps"
    title: "Retention, payer economics, and security-related customer effects remain open"
    body: >-
      None of the assigned sources supplies customer-level retention, renewal, repeat-use,
      contract-value, revenue, or concentration data; nor do they provide a named production
      deployment with a quantified outcome (CU014, CU015). These are material underwriting
      gaps: the reported identity counts cannot distinguish registrations from durable use, and
      the announced integration examples do not show whether a buyer pays for repeated
      verification. The Crypto Times reported a June 2026 exploit and quoted the project's
      statement that a Foundation member's private keys had been compromised; it also reported
      precautionary user guidance while investigation continued (CU012, CU013). The article
      includes contested allegations about the incident, which are not independently established
      here. The event makes customer trust and continued usage diligence relevant, but the
      assigned evidence does not quantify customer losses, churn, or service discontinuity.
    claimRefs: [CU012, CU013, CU014, CU015]
