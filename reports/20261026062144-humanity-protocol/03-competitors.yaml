company:
  name: Humanity Protocol
chapter:
  number: 3
  title: Competitors
  summary: Humanity Protocol competes in a fragmented identity landscape spanning biometric proof-of-personhood, social-graph identity, and conventional identity checks. Its palm-based and portable-credential positioning is distinct in the reviewed materials, but evidence does not establish relative adoption, pricing, security performance, or switching-cost advantages.
sections:
  - id: competitive-set
    title: Competitive set and evidence coverage
    body: >-
      The assigned evidence identifies World ID as the closest biometric comparison: World uses
      Orb-based verification, while Humanity describes palm-based identity credentials. BrightID
      represents a different architecture, using a social graph rather than biometric enrollment.
      Biometric Update also names Civic and Rarimo as proof-of-personhood contenders, but the
      available article does not profile their products, scale, or commercial terms. Conventional
      KYC appears as a substitute with a different privacy and decentralization trade-off; the
      assigned sources do not document a specific provider, price, or customer workflow.

      This is a sourced sample of alternatives, not an exhaustive market census.
      Platform-level account controls, internal builds, and unnamed entrants have no comparable
      profile in the assigned pool. Humanity's reported ID totals are not directly comparable:
      sources use different periods and do not establish active-user or paying-customer counts.
      Biometric Update also reported a $30 million seed round at a $1 billion valuation in 2024;
      that historical financing report does not establish current cash or valuation.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP007, CP009, CP016]
    tableRefs: [TP001]
  - id: proof-models
    title: Product models and claimed differentiation
    body: >-
      The clearest difference in the source set is the enrollment anchor: Humanity's materials
      describe palm biometrics, World ID describes Orb verification, and BrightID describes
      identity derived from social relationships. Their privacy and portability statements are
      issuer claims, not like-for-like independent tests. World says a verified proof is encrypted
      to the user's phone and deleted from the Orb; BrightID says its social graph does not record
      personally identifying information. Humanity promotes selective credential sharing and
      cross-service use, while the third-party mainnet announcement lists loyalty and other
      credentials. Neither those feature descriptions nor the interview establish comparative
      biometric accuracy, privacy outcomes, or regulatory acceptance.

      The map below scores only how specifically the assigned texts describe each feature and how
      many independent descriptions appear in this source set. It is not a product-quality,
      privacy, security, or performance ranking. The feature matrix preserves unknowns where the
      source pool does not support a comparison.
    claimRefs: [CP001, CP002, CP003, CP004, CP006, CP008, CP010, CP011, CP012]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability-and-gaps
    title: Distribution, durability, and adverse evidence
    body: >-
      Humanity's materials describe a portable identity layer, while World ID lists supported
      apps and developer resources and BrightID describes application-facing one-account
      verification. These are distribution signals, not proof of contracted channels or durable
      lock-in. No assigned source supplies comparable pricing, contract structures, customer
      conversion, retention, multi-homing, or switching-cost evidence. Claims of portability could
      enable use across services, but the evidence does not show that users or developers cannot
      substitute another identity method.

      Trust is a material competitive constraint. ProofHuman attributes a June 2026 private-key
      compromise affecting Foundation-member wallet access to reporting by CoinDesk; it
      distinguishes that incident from a disclosed failure of palm or zero-knowledge
      verification. Biometric Update likewise says there was no indication that the verification
      biometrics failed in the reported incident. This distinction limits the technical inference
      but does not resolve governance, key-management, or control redesign. The sources also do
      not provide independent biometric accuracy studies or a comparable account of current
      security controls.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015, CP016]
    tableRefs: [TP003]
tables:
