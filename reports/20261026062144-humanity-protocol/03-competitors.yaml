    title: Competitor and substitute profile
    columns: [Alternative, Category, Disclosed mechanism or scope, Target/use context, Scale/funding/pricing evidence, Limitation in assigned evidence]
    rows:
      - [Humanity Protocol, Direct biometric identity peer, Palm-based proof-of-humanity and selectively shared credentials, Web3 identity and cross-service credentials, "ProofHuman says >8 million Human IDs without a defined period; Cryptonews reported >3.2 million digital IDs created in the prior four months in Jan 2025; Biometric Update reported a $30 million seed round at a $1 billion valuation in 2024; no comparable pricing", "ID definitions, active users, paid adoption, and current funding are not established"]
      - [World ID, Direct biometric identity peer, Orb verification; proof stored on phone and data deleted from Orb per World, Supported apps and services, "No comparable user count, funding, or price in assigned sources", "Official product descriptions are not independent performance or adoption benchmarks"]
      - [BrightID, Adjacent non-biometric identity peer, Social-graph-based uniqueness and open-source identity, Apps seeking one-account participation, "No comparable scale, funding, or pricing in assigned sources", "The about page does not establish security audits, adoption, or commercial terms"]
      - [Civic, Adjacent proof-of-personhood contender, Named by Biometric Update; mechanism not profiled in assigned text, Not specified in assigned text, "No scale, funding, pricing, or customer evidence in assigned sources", "Mention alone is insufficient for a product comparison"]
      - [Rarimo, Adjacent proof-of-personhood contender, Named by Biometric Update; mechanism not profiled in assigned text, Not specified in assigned text, "No scale, funding, pricing, or customer evidence in assigned sources", "Mention alone is insufficient for a product comparison"]
      - [Conventional KYC or centralized identity, Incumbent/substitute category, Gate-hosted company content describes conventional KYC as a privacy/decentralization trade-off, Identity checks and compliance use cases, "No provider, buyer budget, price, or contract is documented", "The source describes a category rather than a named competitor"]
      - [Platform account controls or internal build, Status quo/internal-build alternative, No implementation described in assigned sources, Platform-specific bot and account controls are unprofiled, "No scale, cost, or deployment evidence in assigned sources", "A relevant alternative category, not a sourced competitor profile"]
      - [Unnamed future entrants, Potential entrants, Biometric Update says additional contenders may emerge, Not established in assigned sources, "No named entrant, scale, funding, or pricing", "A forecast is not an identified competitor"]
    notes: Assigned-source sample, not an exhaustive market census; “not in assigned sources” means unverified here, not absent in the market. ID totals retain their source definitions and periods and are not directly comparable.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP009, CP016]
  - id: TP002
    title: Product and capability evidence matrix
    columns: [Buying criterion, Humanity Protocol, World ID, BrightID, Evidence limitation]
    rows:
      - [Identity anchor, "Palm biometrics in company materials and independent descriptions", "Orb verification; World describes a unique-human proof", "Social graph and relationship-based uniqueness", "Product mechanisms are described, but comparative accuracy and spoof resistance are not independently measured"]
      - [Privacy/data handling, "Company claims selective sharing and data minimization", "World says proof is encrypted to phone and deleted from Orb", "BrightID says its graph does not record personally identifying information", "Issuer claims; no independent privacy assessment in assigned sources"]
      - [Portability/integration, "Company promotes cross-service credentials; launch copy names airline and hotel loyalty accounts", "World lists supported apps, SDK, and developer resources", "BrightID describes application-facing verification", "No comparable integration usage, uptime, conversion, or partner economics"]
      - [Enrollment/distribution, "Palm-scan rollout described by Humanity; a 2025 interview described registration before biometrics were collected", "Orb verification is described on the official page", "Social-graph identity rather than biometric device enrollment", "The Humanity interview is historical and does not establish the current operating flow"]
      - [Trust and governance, "2026 reporting describes a Foundation-member key compromise; biometric verification failure was not indicated", "Official page describes product controls but no independent audit in assigned sources", "Open-source status is self-described; no third-party audit in assigned sources", "Post-incident controls, certifications, and regulatory outcomes remain unverified"]
    notes: Matrix cells distinguish issuer-described features from independent validation; unsupported or unmeasured comparisons are stated as limitations, not scored as failures.
    claimRefs: [CP001, CP002, CP003, CP004, CP008, CP010, CP011, CP012, CP014, CP015]
  - id: TP003
    title: Commercial, distribution, and durability evidence
    columns: [Dimension, Evidence in assigned sources, What it supports, What remains unknown]
    rows:
      - [Adoption counts, "ProofHuman says >8 million Human IDs without a period or active-status definition; Cryptonews reported >3.2 million digital IDs created over the prior four months in Jan 2025", "The sources report two differently labeled Humanity ID measures", "Comparable periods, definitions, active or unique users, methodology, paid adoption, and competitor figures"]
      - [Historical funding and valuation, "Biometric Update reported a $30 million seed round at a $1 billion valuation in 2024", "A historical financing announcement", "Current cash, current valuation, and comparable competitor financing"]
      - [Distribution and integrations, "Humanity product and launch materials describe portable credentials and named airline/hotel account connections; World lists apps/SDK; BrightID describes app-facing use", "Multiple distribution routes are claimed or documented in product descriptions", "Paid contracts, active integrations, customer conversion, partner contribution, and renewal economics"]
      - [Pricing and contracting, "No comparable price list, contract model, or discount information appears in assigned sources", "No price comparison can be made from this pool", "Price per verification, buyer, minimum commitment, implementation cost, and realized contract value"]
      - [Switching and multi-homing, "Portability is a stated product goal; no source reports user migration cost, retention, exclusivity, or multi-homing rates", "Portability may reduce repeated verification friction as a product proposition", "No evidence that portability creates lock-in, durable distribution, or a defensible switching-cost advantage"]
    notes: Adoption and financing figures preserve the original source labels and periods; absence of pricing or retention evidence is a coverage gap, not a zero or a claim that no commercial activity exists.
    claimRefs: [CP007, CP009, CP011, CP012, CP016]
figures:
  - id: FP001
    title: Competitive feature evidence map
    type: quadrant
    summary: Ordinal positions describe only feature-specific disclosure and independent description within the assigned source set, not product quality or market performance.
    data:
      xAxis:
        label: Assigned-text feature detail (ordinal)
        min: 1
        max: 3
        lowLabel: One general feature
        highLabel: Multiple explicit details
        description: "1 = one general feature; 2 = mechanism plus a use or control; 3 = multiple technical or operational details in assigned texts. Analyst-coded disclosure depth, not a product score."
        scale: Ordinal source-set coding
      yAxis:
        label: Independent descriptions in assigned sources (ordinal)
        min: 0
        max: 2
        lowLabel: None
        highLabel: Two or more
        description: "0 = only issuer material; 1 = one independent description; 2 = two or more independent descriptions. This measures source coverage, not independent validation."
        scale: Ordinal source-set coding
      points:
        - label: Humanity — palm/ZK anchor
          x: 3
          y: 2
          detail: Company material describes palm scanning and privacy architecture; Biometric Update independently describes the palm-based identity approach in multiple articles.
        - label: Humanity — reusable credentials
          x: 3
          y: 1
          detail: Company pages describe cross-service credentials; Biometric Update coverage discusses integrations and credential expansion without validating performance.
        - label: World ID — Orb proof
          x: 2
          y: 1
          detail: World describes Orb verification and phone-held proof; Biometric Update independently compares its iris-based model with Humanity's palm model.
        - label: World ID — app and SDK
          x: 2
          y: 0
          detail: World lists supported apps and developer resources; no independent implementation description is included in the assigned sources.
        - label: BrightID — social-graph uniqueness
          x: 2
          y: 0
          detail: BrightID's own about page describes graph-based identity and fair one-account access; no independent description appears in the assigned sources.
        - label: BrightID — open-source availability
          x: 1
          y: 0
          detail: BrightID self-describes as open-source and decentralized; the assigned source set contains no independent validation.
    approximationNotes: Coordinates are analyst-assigned ordinal categories using only the stated source-set rules; these positions are not a product ranking and imply no performance, adoption, privacy, or security score.
    claimRefs: [CP001, CP002, CP003, CP004, CP006, CP011]

