  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-scale-pricing
      missingEvidence: Comparable, dated competitor disclosures for active and unique users, customer conversion, revenue or funding, pricing, contract terms, and the definitions behind any registered-ID totals.
      whyItMatters: Without common definitions and commercial terms, apparent user scale cannot establish adoption quality, monetization, relative economics, or a durable competitive lead.
      diligencePath: Obtain current competitor pricing and contract materials, dated operating metrics with active-versus-created definitions, and customer references that confirm paid use and deployment scope.
      relatedQuestionRefs: [QP003]
      relatedTableRefs: [TP001, TP003]
    - type: missing-source
      severity: material
      topic: switching-and-channel-durability
      missingEvidence: Customer and developer evidence on multi-homing, retention, switching costs, partner contract economics, and whether integrations generate repeat paid use.
      whyItMatters: Product portability and integration announcements do not show that Humanity controls distribution or that a buyer cannot substitute another identity method.
      diligencePath: Interview named developers and customers, review partner agreements and renewal data, and compare a live implementation's migration effort against World ID, BrightID, and conventional identity providers.
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: independent-biometric-validation
      missingEvidence: Independent biometric accuracy, liveness, privacy, security, and regulatory assessments plus current post-incident key-management controls.
      whyItMatters: Issuer claims and a distinction between wallet compromise and biometric verification failure do not establish that the product is secure, accurate, compliant, or resilient to governance failures.
      diligencePath: Request third-party test reports, certification scope, incident postmortem, signer-policy documentation, and an independent review of the revised control environment.
      relatedTableRefs: [TP002, TP003]