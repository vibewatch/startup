company:
  name: Humanity Protocol
chapter:
  number: 1
  title: Company Overview
  summary: Humanity Protocol is developing a palm-biometric identity and credential network, with a reported shift from proof-of-personhood toward reusable proof-of-trust credentials. Public evidence documents two financing rounds, early product milestones, a reported scale of more than eight million Human IDs, and a June 2026 key-compromise incident; current revenue, customer conversion, corporate structure, and governance remain unverified.
sections:
  - id: identity-and-business
    title: Identity, product, and corporate perimeter
    body: >-
      Humanity Protocol presents itself as an identity infrastructure project that uses palm recognition and zero-knowledge proofs to let users demonstrate identity-related attributes without broadly exposing personal data. Founder Terence Kwok described the product as a privacy-preserving biometric alternative for Web3; 2026 reporting says the company is broadening the earlier proof-of-personhood proposition into reusable verifiable credentials under the Proof-of-Trust label. That is a reported positioning change, not evidence that all earlier products have been replaced or that the credential network has achieved commercial adoption. The source record does not establish a current legal headquarters: one article calls the company Hong Kong-based, while its publisher's company profile lists a San Francisco address. Neither description alone resolves the operating entity or incorporation jurisdiction.
    claimRefs: [CO001, CO002, CO003, CO012, CO013]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, investors, and governance visibility
    body: >-
      Terence Kwok is the only executive identified consistently in the retained source set: an August 2024 interview has him identify himself as founder and CEO, and 2026 coverage quotes him on the protocol's direction. Funding coverage names Kingsway Capital in the 2024 seed financing and Pantera Capital and Jump Crypto as co-leads of a January 2025 round. Humanity's early materials also describe Animoca Brands and Polygon Labs as launch collaborators; this does not establish current contractual status, equity ownership, board seats, or control rights. A reported June 2026 compromise of a Humanity Foundation member's private keys makes the relationship between the company, foundation, privileged access, and token administration a material diligence question. The available sources do not provide a complete executive roster, board list, cap table, or governance-rights map.
    claimRefs: [CO003, CO004, CO007, CO008, CO014, CO016]
    tableRefs: [TO002, TO003]
  - id: funding-and-scale
    title: Funding, scale, and financial disclosure
    body: >-
      Public reporting describes a roughly $30 million 2024 seed round led by Kingsway Capital and a separate $20 million January 2025 round co-led by Pantera Capital and Jump Crypto. The latter was reported at a $1.1 billion fully diluted valuation; that historical token-related valuation is not a current equity valuation, and the two round amounts should not be presented as audited cumulative proceeds or available cash. Biometric Update reported that the company said it had issued more than eight million Human IDs by February 2026. Issued IDs are not equivalent to monthly active people, paying customers, retained users, or revenue. The assigned evidence does not establish current ARR, revenue, margins, customer count, headcount, debt, or total raised after reconciling all financing events.
    claimRefs: [CO006, CO007, CO008]
  - id: milestones-and-risk
    title: Milestones and execution risk
    body: >-
      The public chronology runs from a palm-biometric Web3 debut and 2024 testnet through reported 2025 mainnet, ticketing, and Mastercard-related milestones, followed by the 2026 Proof-of-Trust repositioning. Those announcements show product activity and intended integrations, but the source set does not establish contract depth, customer conversion, or recurring economics. In June 2026, Humanity disclosed a security incident involving private keys associated with a Humanity Foundation member; Wealthsimple's updated asset statement records the incident and subsequent migration plan. CryptoTimes also relays ZachXBT's public allegation that the incident was “possibly staged”; that is a contested allegation, not a verified finding. Recovery progress, independent post-incident controls testing, and the status of privileged access remain open diligence items.
    claimRefs: [CO004, CO005, CO010, CO011, CO014, CO015, CO016]
    figureRefs: [FO001]
