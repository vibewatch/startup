      - number: '3.2'
        title: Product models and claimed differentiation
        blocks:
          - type: paragraph
            body: >-
              The clearest difference in the source set is the enrollment anchor: Humanity's materials describe palm
              biometrics, World ID describes Orb verification, and BrightID describes identity derived from social
              relationships. Their privacy and portability statements are issuer claims, not like-for-like independent
              tests. World says a verified proof is encrypted to the user's phone and deleted from the Orb; BrightID
              says its social graph does not record personally identifying information. Humanity promotes selective
              credential sharing and cross-service use, while the third-party mainnet announcement lists loyalty and
              other credentials. Neither those feature descriptions nor the interview establish comparative biometric
              accuracy, privacy outcomes, or regulatory acceptance.

              The map below scores only how specifically the assigned texts describe each feature and how many
              independent descriptions appear in this source set. It is not a product-quality, privacy, security, or
              performance ranking. The feature matrix preserves unknowns where the source pool does not support a
