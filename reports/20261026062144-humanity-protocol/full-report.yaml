  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Product activity is visible; monetization is not
        blocks:
          - type: paragraph
            body: >-
              Humanity's current public description presents a privacy-preserving identity and credential network, with
              APIs for integrating identity services; earlier reporting described its palm-based Proof-of-Humanity
              launch. The company later framed the product as expanding from uniqueness checks toward broader trust
              credentials. These materials describe what the network is intended to do, not the number of paying
              customers or the revenue earned per verification. The company's 2025 post also described more than five
              million Human IDs on its testnet, a company-reported activity measure rather than paid users, revenue, or
              retention. No reviewed source supplies a fee schedule, contract value, billing basis, revenue recognition
              policy, or customer-level conversion data. Financial underwriting should therefore treat service
              monetization as unproven, not infer revenue from product availability or testnet registrations.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
