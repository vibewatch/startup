      - number: '3.3'
        title: Distribution, durability, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Humanity's materials describe a portable identity layer, while World ID lists supported apps and developer
              resources and BrightID describes application-facing one-account verification. These are distribution
              signals, not proof of contracted channels or durable lock-in. No assigned source supplies comparable
              pricing, contract structures, customer conversion, retention, multi-homing, or switching-cost evidence.
              Claims of portability could enable use across services, but the evidence does not show that users or
              developers cannot substitute another identity method.

              Trust is a material competitive constraint. ProofHuman attributes a June 2026 private-key compromise
              affecting Foundation-member wallet access to reporting by CoinDesk; it distinguishes that incident from a
              disclosed failure of palm or zero-knowledge verification. Biometric Update likewise says there was no
              indication that the verification biometrics failed in the reported incident. This distinction limits the
              technical inference but does not resolve governance, key-management, or control redesign. The sources also
              do not provide independent biometric accuracy studies or a comparable account of current security
              controls.
