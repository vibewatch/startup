              - CE013
      - number: '5.3'
        title: Integrations and differentiation
        blocks:
          - type: paragraph
            body: >-
              Humanity announced LayerZero Labs as a zkProofer and described a potential integration context spanning
              more than 95 dApps and 70 chains (CE006). The mainnet-release page also lists airline and hotel loyalty
              accounts and financial, educational, and professional credentials as use cases (CE005). These
              announcements suggest a strategy of combining a reusable human credential with proofs of selected
              attributes, rather than making the palm scan the only ongoing interaction. However, the assigned evidence
              does not identify an independently verified production deployment, usage denominator, contract, or
              measured benefit for the named integration examples (CE005, CE006, CE012). Do not interpret an announced
              partner, a listed dApp universe, or a credential example as evidence of active customer adoption.
            claimRefs:
              - CE005
              - CE006
              - CE012
      - number: '5.4'
        title: Trust, security, and operating evidence
        blocks:
          - type: paragraph
            body: >-
              The privacy proposition depends on biometric handling, proof generation, credential control, and
              network/key operations, but the assigned first-party product and developer pages provide no independent
              audit scope, biometric error rates, uptime or service-level results, or production-use denominators
              (CE012). Biometric Update's company profile lists a February 23, 2026 headline attributing a major token
              breach to a key-storage error and malware infection; the profile excerpt does not establish incident scope
              or any compromise of palm biometrics (CE011). A Crypto Briefing interview records the founder's
              description of biometric information being held across multiple network nodes and user-deletable; this
              remains a company statement, not an independent control assessment (CE015). This is a material diligence
              signal, not proof that the identity verification mechanism failed. Investors should request the incident
              postmortem, current key-management and privileged-access controls, independent security assessments, and
              evidence distinguishing reserved IDs from verified and active credentials.
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named relationships show routes to market, not proven deployments
        blocks:
          - type: paragraph
            body: >-
              The strongest named commercial evidence is a November 2025 report that Humanity Protocol was teaming with
              Mastercard on Human ID-based financial-attribute verification. The article describes an initial U.S.
              availability plan and a lender credit-approval example, but does not quantify completed verifications,
              active lenders, conversion, or customer outcomes (CU006, CU007). A separate Biometric Update listing
              records Humanity Protocol's acquisition of Moongate for ticketing, credentialing, and access, while Gate
              Learn describes physical access scenarios; neither source identifies a live customer deployment or
              measured result (CU009, CU010). The available proof therefore supports named ecosystem relationships and
              proposed use cases, not a verified customer roster or production adoption. The journey exhibit keeps those
              evidence states separate from outcomes that remain undisclosed.
