chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and corporate perimeter
        blocks:
          - type: paragraph
            body: >-
              Humanity Protocol presents itself as an identity infrastructure project that uses palm recognition and
              zero-knowledge proofs to let users demonstrate identity-related attributes without broadly exposing
              personal data. Founder Terence Kwok described the product as a privacy-preserving biometric alternative
              for Web3; 2026 reporting says the company is broadening the earlier proof-of-personhood proposition into
              reusable verifiable credentials under the Proof-of-Trust label. That is a reported positioning change, not
              evidence that all earlier products have been replaced or that the credential network has achieved
              commercial adoption. The source record does not establish a current legal headquarters: one article calls
              the company Hong Kong-based, while its publisher's company profile lists a San Francisco address. Neither
              description alone resolves the operating entity or incorporation jurisdiction.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO008
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, investors, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Terence Kwok is the only executive identified consistently in the retained source set: an August 2024
              interview has him identify himself as founder and CEO, and 2026 coverage quotes him on the protocol's
              direction. Funding coverage names Kingsway Capital in the 2024 seed financing and Pantera Capital and Jump
              Crypto as co-leads of a January 2025 round. Humanity's early materials also describe Animoca Brands and
              Polygon Labs as launch collaborators; this does not establish current contractual status, equity
              ownership, board seats, or control rights. A reported June 2026 compromise of a Humanity Foundation
              member's private keys makes the relationship between the company, foundation, privileged access, and token
              administration a material diligence question. The available sources do not provide a complete executive
              roster, board list, cap table, or governance-rights map.
            claimRefs:
              - CO003
