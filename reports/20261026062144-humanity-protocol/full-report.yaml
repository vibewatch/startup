      - number: '5.2'
        title: Architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The available descriptions span biometric enrollment, privacy-preserving credential proofs, a Humanity
              mainnet, and a reported zkTLS capability. Biometric Update describes the early palm-and-ZK proposal, while
              Humanity's LayerZero post says zkProofers handle verifiable credentials and zero-knowledge presentations
              without directly accessing user information (CE001, CE013). The GitHub organization page lists mainnet and
              testnet chain IDs, a Developer API link, and 31 repositories, which establishes a visible developer
              surface but not its usage or code quality (CE007). A mainnet launch article says zkTLS moved to the
              foreground and palm scans became optional; that is a reported product-positioning change, not measured
              biometric performance (CE008). The 2024 launch coverage documents the earlier palm-and-ZK framing (CE009).
              The architecture figure is therefore a map of attributed product descriptions, not a verified system
              diagram.
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE009
              - CE013
