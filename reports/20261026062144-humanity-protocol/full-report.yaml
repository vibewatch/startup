  - id: FM001
    title: Broad identity verification market to unsized Humanity segment
    type: pyramid
    summary: >-
      The broad market estimate and biometric share do not quantify the narrower palm, proof-of-humanity, or
      reusable-credential opportunity.
    data:
      items:
        - label: Broad identity verification
          value: USD 15.78B (2026 estimate); USD 26.8B (2031 forecast)
          detail: Mordor's proprietary estimate spans multiple verification methods.
        - label: Biometric verification
          value: 35.84% of category revenue share (2025)
          detail: Category-level share, not a palm-only market.
        - label: Palm biometric checks
          value: Not separately sized
          detail: No retained estimate isolates this modality.
        - label: Proof of humanity or unique-human checks
          value: Not separately sized
          detail: No retained estimate isolates paid unique-human workflows.
        - label: Reusable credential verification
          value: No discrete spending estimate
          detail: Wallet and credential spend may overlap with verification.
        - label: Humanity Protocol addressable market
          value: TAM, SAM, and SOM not established
          detail: No buyer, paid-volume, pricing, or market-share bridge is retained.
    approximationNotes: >-
      Conceptual boundary schematic, not to scale. The layers may overlap; the biometric share is not multiplied by the
      broad estimate and does not imply palm or proof-of-humanity market share.
    claimRefs:
      - CM002
      - CM004
      - CM005
  - id: FP001
    title: Competitive feature evidence map
    type: quadrant
    summary: >-
      Ordinal positions describe only feature-specific disclosure and independent description within the assigned source
      set, not product quality or market performance.
    data:
      xAxis:
        label: Assigned-text feature detail (ordinal)
        min: 1
        max: 3
        lowLabel: One general feature
        highLabel: Multiple explicit details
        description: >-
          1 = one general feature; 2 = mechanism plus a use or control; 3 = multiple technical or operational details in
          assigned texts. Analyst-coded disclosure depth, not a product score.
        scale: Ordinal source-set coding
      yAxis:
        label: Independent descriptions in assigned sources (ordinal)
        min: 0
        max: 2
        lowLabel: None
        highLabel: Two or more
        description: >-
          0 = only issuer material; 1 = one independent description; 2 = two or more independent descriptions. This
          measures source coverage, not independent validation.
        scale: Ordinal source-set coding
      points:
        - label: Humanity — palm/ZK anchor
          x: 3
          'y': 2
          detail: >-
            Company material describes palm scanning and privacy architecture; Biometric Update independently describes
            the palm-based identity approach in multiple articles.
        - label: Humanity — reusable credentials
          x: 3
          'y': 1
          detail: >-
            Company pages describe cross-service credentials; Biometric Update coverage discusses integrations and
            credential expansion without validating performance.
        - label: World ID — Orb proof
          x: 2
          'y': 1
          detail: >-
            World describes Orb verification and phone-held proof; Biometric Update independently compares its
            iris-based model with Humanity's palm model.
        - label: World ID — app and SDK
          x: 2
          'y': 0
          detail: >-
            World lists supported apps and developer resources; no independent implementation description is included in
            the assigned sources.
        - label: BrightID — social-graph uniqueness
          x: 2
          'y': 0
          detail: >-
            BrightID's own about page describes graph-based identity and fair one-account access; no independent
            description appears in the assigned sources.
        - label: BrightID — open-source availability
          x: 1
          'y': 0
          detail: >-
            BrightID self-describes as open-source and decentralized; the assigned source set contains no independent
            validation.
    approximationNotes: >-
      Coordinates are analyst-assigned ordinal categories using only the stated source-set rules; these positions are
      not a product ranking and imply no performance, adoption, privacy, or security score.
