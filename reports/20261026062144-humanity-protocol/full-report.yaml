      - number: '1.3'
        title: Funding, scale, and financial disclosure
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes a roughly $30 million 2024 seed round led by Kingsway Capital and a separate
              $20 million January 2025 round co-led by Pantera Capital and Jump Crypto. The latter was reported at a
              $1.1 billion fully diluted valuation; that historical token-related valuation is not a current equity
              valuation, and the two round amounts should not be presented as audited cumulative proceeds or available
              cash. Biometric Update reported that the company said it had issued more than eight million Human IDs by
              February 2026. Issued IDs are not equivalent to monthly active people, paying customers, retained users,
              or revenue. The assigned evidence does not establish current ARR, revenue, margins, customer count,
              headcount, debt, or total raised after reconciling all financing events.
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: Milestones and execution risk
        blocks:
          - type: paragraph
            body: >-
              The public chronology runs from a palm-biometric Web3 debut and 2024 testnet through reported 2025
              mainnet, ticketing, and Mastercard-related milestones, followed by the 2026 Proof-of-Trust repositioning.
              Those announcements show product activity and intended integrations, but the source set does not establish
              contract depth, customer conversion, or recurring economics. In June 2026, Humanity disclosed a security
              incident involving private keys associated with a Humanity Foundation member; Wealthsimple's updated asset
              statement records the incident and subsequent migration plan. CryptoTimes also relays ZachXBT's public
              allegation that the incident was “possibly staged”; that is a contested allegation, not a verified
              finding. Recovery progress, independent post-incident controls testing, and the status of privileged
              access remain open diligence items.
