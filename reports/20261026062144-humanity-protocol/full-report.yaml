      - number: '6.2'
        title: Reported identity counts do not establish active or paying users
        blocks:
          - type: paragraph
            body: >-
              The plausible user groups span individuals registering Human IDs, developers or applications that consume
              identity credentials, financial-service providers seeking reusable eligibility proofs, and event or
              physical-access operators. Public material describes these segments unevenly: company material discusses
              developers and testnet registrations, while the Mastercard article describes a financial-services use case
              and Moongate points toward ticketing (CU001, CU006, CU009, CU016). The available counts use different
              labels and periods: a January 2025 interview reported 3.2 million digital IDs created over the prior four
              months; a company blog claimed over 5 million Human IDs after a testnet launch; and a profile repeats
              undated homepage figures of more than 8 million Human IDs and 25 global-brand integrations (CU001-CU005).
              These figures are not a consistent active-user series, and neither brand integrations nor created IDs
              reveal unique active users, paying accounts, or repeat usage.
