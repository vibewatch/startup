      - number: '2.3'
        title: Buyer, user, and payer differ by workflow
        blocks:
          - type: paragraph
            body: >-
              Potential buyers have distinct jobs and budget lines. Financial institutions assess identity for customer
              due diligence; public-sector programs specify proofing, authentication, federation, and wallet functions;
              online platforms may seek human or account-integrity checks. Mordor's category estimates point to
              financial services and large enterprises as important identity-verification segments, while LexisNexis
              reports fraud signals in ecommerce and gaming-related activity. Humanity's own page names banks, games,
              DAOs, and cities as credential use cases, but this is company positioning rather than verified customer
              demand. The assigned sources do not disclose Humanity contracts, paid verification volumes, pricing,
              renewals, or budget owners; the segment map is therefore a diligence hypothesis, not a customer roster.
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Fraud creates a driver, while assurance and trust constrain adoption
        blocks:
          - type: paragraph
            body: >-
              LexisNexis Risk Solutions reports fraud and synthetic-identity trends from its own Digital Identity
              Network, and says agentic traffic rose 450% between January and December 2025; it also states there was no
              indication of malicious intent for that agent traffic. Those measures indicate a changing verification
              environment, not Humanity Protocol usage or total market demand. NIST and FATF guidance make assurance,
              governance, and reliability relevant to deployment, while the World Economic Forum warns that policy,
              regulation, and technology affect decentralized identity's social impact. A CoinMarketCap digest relays a
              scheduled H-token unlock, which is a supply-side token event, not evidence of identity-service revenue.
              Halborn's fetched page body contains only a newsletter prompt despite its hack-explainer title, so it
              supplies no technical findings about controls or adoption impact.
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and evidence coverage
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies World ID as the closest biometric comparison: World uses Orb-based
              verification, while Humanity describes palm-based identity credentials. BrightID represents a different
              architecture, using a social graph rather than biometric enrollment. Biometric Update also names Civic and
              Rarimo as proof-of-personhood contenders, but the available article does not profile their products,
              scale, or commercial terms. Conventional KYC appears as a substitute with a different privacy and
              decentralization trade-off; the assigned sources do not document a specific provider, price, or customer
              workflow.

              This is a sourced sample of alternatives, not an exhaustive market census. Platform-level account
              controls, internal builds, and unnamed entrants have no comparable profile in the assigned pool.
              Humanity's reported ID totals are not directly comparable: sources use different periods and do not
              establish active-user or paying-customer counts. Biometric Update also reported a $30 million seed round
              at a $1 billion valuation in 2024; that historical financing report does not establish current cash or
              valuation.
            claimRefs:
