  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market before sizing it
        blocks:
          - type: paragraph
            body: >-
              Mordor Intelligence defines identity verification as tools and services that confirm a person or business
              during onboarding and ongoing access, using document checks, biometric matching, and database validations
              across digital and physical channels. That is the defensible outer market boundary in the assigned
              evidence. General identity platforms, access management, fraud software, wallet infrastructure, and
              biometric hardware should not be added unless a paid verification workflow and its spend are isolated.
              Humanity Protocol describes a narrower palm-based proof-of-humanity anchor with selective credentials;
              that positioning can overlap with verification but does not make every digital identity deployment
              addressable. Public identity standards and wallet functions establish adjacent scope, not incremental
              company revenue.
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
      - number: '2.2'
        title: One broad estimate is context, not a Humanity TAM
        blocks:
          - type: paragraph
            body: >-
              Mordor's only retained dollar estimate is USD 15.78 billion for 2026, with a USD 26.8 billion forecast for
              2031 and an 11.18% CAGR over 2026-2031; it identifies its method as proprietary. Its 2025 biometric share
              is not palm-specific, while its enterprise and financial-services shares describe the whole
              identity-verification category. The World Economic Forum's legal-ID count and FATF's 2020 unbanked-adult
              count are population lenses, not spend, paying buyers, or current serviceable accounts. No retained source
              bridges these broad measures to Humanity's proof-of-humanity or reusable-credential product. The pyramid
              is an unscaled boundary schematic: its layers overlap and do not support a calculated TAM, SAM, or SOM.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
