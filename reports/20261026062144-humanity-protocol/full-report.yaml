      - number: '4.2'
        title: H utility is described, while token value is not company revenue
        blocks:
          - type: paragraph
            body: >-
              Humanity's company materials describe H as supporting rewards, governance, and participation; Wealthsimple
              identifies staking and ecosystem participation as uses. Its page is marked updated September 22, 2026,
              while the H update section is dated June 19, making the token-supply snapshot date unclear. Those
              descriptions establish intended token functions, not fee capture, treasury proceeds, or recurring fiat
              revenue. External token snapshots report different circulating-supply figures and market values, and their
              timestamps and methodologies do not reconcile cleanly. The June 2026 incident was followed by a reported
              sharp token-price decline and allegations of unauthorized token activity. These are material indicators of
              market and operational risk, but they are not a measure of the company's accounting loss, cash burn, or
              remaining assets. Treat token-market metrics as volatile external observations, separate from company
              operating performance.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Historical financing does not answer present capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Verdict and Biometric Update reported a $20 million round at a $1.1 billion fully diluted valuation in
              January 2025. This is useful historical financing context, but neither the round nor its valuation
              establishes proceeds still on hand, current liabilities, or available runway. The assigned public
              materials do not provide company revenue, gross margin, service-delivery costs, CAC, payback, working
              capital, capex, burn, debt, or current cash. The distinction is decisive: a funding announcement is not a
              balance sheet, a token price is not revenue, and an incident's reported token-market impact is not
              accounting loss or cash burn. Until management provides current financial statements and operating
              metrics, neither unit economics nor financing dependency can be underwritten quantitatively.
            claimRefs:
              - CI006
              - CI013
              - CI014
              - CI015
