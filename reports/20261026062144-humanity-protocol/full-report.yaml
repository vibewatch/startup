      - number: '6.3'
        title: Retention, payer economics, and security-related customer effects remain open
        blocks:
          - type: paragraph
            body: >-
              None of the assigned sources supplies customer-level retention, renewal, repeat-use, contract-value,
              revenue, or concentration data; nor do they provide a named production deployment with a quantified
              outcome (CU014, CU015). These are material underwriting gaps: the reported identity counts cannot
              distinguish registrations from durable use, and the announced integration examples do not show whether a
              buyer pays for repeated verification. The Crypto Times reported a June 2026 exploit and quoted the
              project's statement that a Foundation member's private keys had been compromised; it also reported
              precautionary user guidance while investigation continued (CU012, CU013). The article includes contested
              allegations about the incident, which are not independently established here. The event makes customer
              trust and continued usage diligence relevant, but the assigned evidence does not quantify customer losses,
              churn, or service discontinuity.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security event and recovery
        blocks:
          - type: paragraph
            body: >-
              BSC News reported that the June 8, 2026 H-token exploit followed malware on a developer machine and
              exposure of seven private keys, including administrative and Safe-owner keys; its account says attackers
              used legitimate keys rather than exploiting a smart-contract defect (CR001, CR002, CR003). CoinAlert also
              described a token replacement and 1:1 recovery airdrop, while BSC News said migration required
              coordination with exchanges, bridge providers, and liquidity partners (CR004, CR005). The incident is
              direct evidence that operational key custody can defeat otherwise audited code. The pool does not
              establish that token migration completed or that post-incident access controls were independently tested.
              Until those controls are evidenced, treat any privileged upgrade, bridge reopening, or recovery-contract
              administration as a high-impact residual exposure rather than assuming migration itself removed the access
              risk (CR014).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
      - number: '7.2'
        title: Biometric privacy and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Humanity Protocol's product page claims a palm scan can establish proof of humanity without storing
              sensitive data on a central server (CR006). That is a company representation, not independent evidence of
              collection boundaries, template reversibility, deletion, retention, or access controls. GDPR Article 9
              treats biometric data used to uniquely identify a person as special-category data subject to a prohibition
              and specified exceptions; FTC guidance separately says businesses must honor privacy promises and maintain
              security appropriate to the data they hold (CR007, CR008, CR009). These sources define diligence
              questions, not a finding that Humanity Protocol is subject to or violates either regime. The applicable
              controller, jurisdictions, consent basis, processor chain, and breach-notification duties remain
              unverified; obtain the data-flow map and jurisdiction-by-jurisdiction legal assessment before treating the
              privacy architecture as a mitigant.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Partner and commercial dependencies
        blocks:
          - type: paragraph
            body: >-
              Biometric Update described a Mastercard open-finance integration intended to let users prove financial
              credentials and link bank-account ownership through Human ID, with an initial U.S. rollout planned
              (CR010). The article reports an announced plan, not production deployment, customer conversion, or
              revenue. Separately, BSC News described the token migration as requiring coordination with centralized
              exchanges, bridge providers, and liquidity partners (CR005). These dependencies expose execution to
              counterparties and operational readiness outside the protocol's own code. The available record does not
              quantify partner concentration, contractual remedies, implementation ownership, or fallback paths. Request
              signed integration scope, launch acceptance criteria, active usage and service-level evidence, and
              migration confirmations from each relevant exchange and bridge before underwriting broad distribution or
              durable partner access.
            claimRefs:
              - CR005
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Token-market and financial visibility
        blocks:
          - type: paragraph
            body: >-
              BeInCrypto reported a January 2025 $20 million financing at a $1.1 billion fully diluted valuation, led by
              Pantera Capital and Jump Crypto; this is a historical financing report, not current valuation, runway, or
              cash available (CR011). BingX Learn described a roughly 69.5% H-token increase over 24 hours in a 2025
              market episode, followed by a pullback, illustrating historical market volatility rather than current
              trading conditions (CR012). Humanity's own 2025 blog still described palm-scan verification as an upcoming
              rollout phase, which should not be read as evidence of present deployment (CR013). Current treasury
              composition, token unlocks, operating runway, and customer revenue are not established here. The
              investment case should remain gated on current cash and token-liability disclosures, independently
              verified recovery completion, and measurable evidence that integrations progressed from announcement to
              sustained use.
            claimRefs:
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not treat token migration as control remediation
            body: >-
              The reported incident involved compromised private keys rather than a smart-contract vulnerability. A
              replacement token and contract do not by themselves demonstrate safer endpoints, separated signers, or
              resilient bridge administration; require independent evidence of those controls before treating the
              incident as contained.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the public price evidence does—and does not—value
        blocks:
          - type: paragraph
            body: >-
              Two distinct valuation objects must not be conflated. News reports place a January 2025 $20m financing at
              a $1.1bn fully diluted valuation, while an earlier 2024 report described a $30m seed round at a $1bn
              valuation (CV001, CV002). These are historical reported financing marks, not a current October 2026 share
              price or verified enterprise value. CryptoRank displayed H at $0.05213 in the prefetched page (CV004);
              Wealthsimple's September 22, 2026 update gave a 10bn total supply and approximately 2.62bn H in
              circulation (CV005). Multiplying those inputs yields an estimated token FDV of about $521m and circulating
              capitalization of about $137m (CV006). The calculations are token-market measures: they do not establish
              company revenue, equity value, treasury backing, or investor proceeds. The displayed quote is a page
              snapshot without an explicit observation time in its text, and the circulating count is approximate. Do
              not use the token figures as a substitute for a current financing term sheet, cap table, or revenue-based
              valuation. The separate Worldcoin product comparisons are not financial comparables: the retained articles
              provide no matched operating metrics or valuation multiples for Humanity Protocol (CV016).
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The upside case is a company-positioned identity product: Humanity's own materials describe palm-based
              proof of humanity and reusable credentials, and its 2025 blog presented $H as a way to participate in the
              ecosystem (CV007, CV008). The blog also reported more than five million Human IDs, but that is a
              company-reported scale indicator, not verified active users, paying customers, retention, or revenue
              (CV009). The valuation bridge therefore depends on converting claimed identity activity into durable
              demand and monetizable workflows; this source pool provides no unit economics with which to underwrite
              that bridge. The anti-thesis is unusually material: Wealthsimple reported that Humanity disclosed a June
              9, 2026 private-key compromise and a June 16 full token migration with a 1:1 airdrop (CV010). Crypto Times
              separately reported that on-chain investigator ZachXBT disputed the account; those allegations remain
              allegations, not established findings (CV011). The incident and migration make independent evidence on
              recovery, controls, supply reconciliation, and post-incident usage central to any valuation.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Price-sensitive decision and diligence
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with high risk and an unknown valuation stance—not a buy or an
              assertion that the token is cheap. The reported private mark is stale and fully diluted, while the
              observed H token price and supply produce only token-capitalization estimates (CV001, CV006, CV012). No
              probability-weighted company-equity value, target return, or exit multiple is supportable without current
              audited financials, an updated capitalization and preference schedule, and evidence that users or
              counterparties pay for the product (CV014, CV015). Scenario values below are explicitly token-FDV
              sensitivities, not forecasts or company valuations. Before reconsidering the call, obtain current
              financing documents and the cap table; revenue, gross margin, cash flow and paid-customer/retention data;
              token treasury, unlock and migration reconciliation; and independent post-incident security-control
              evidence. A verified paid customer base and successful independent control review would improve the case;
              unresolved privileged-key weaknesses, further dilution, or no demonstrated monetization would break it.
            claimRefs:
              - CV001
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate token FDV with company value
            body: >-
              The observed token price and supply support an approximate token-market sensitivity only; current company
              equity value, revenue multiples, and target return remain unproven.
            calloutType: recommendation
            claimRefs:
              - CV004
