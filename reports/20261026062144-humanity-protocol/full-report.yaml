      - number: '4.4'
        title: Underwriting remains blocked by private operating data
        blocks:
          - type: paragraph
            body: >-
              The public record supports a product and token ecosystem with reported testnet activity, a historical
              financing round, and a live secondary-market token; it does not demonstrate a repeatable paid workflow or
              cash-generative operating model. The five-million-Human-ID figure is company-claimed testnet activity, and
              should not be substituted for paying accounts or customers. Token supply and market-price snapshots also
              differ across the sources and dates reviewed. The appropriate financial conclusion is a material evidence
              gap rather than a forecast: request audited or management-prepared income statements, cash and debt
              schedules, fee and contract data, customer cohorts, and post-incident treasury reconciliation. Revenue
              quality, margin trajectory, capital intensity, and runway remain unverified pending that evidence.
            claimRefs:
              - CI004
              - CI006
              - CI012
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Biometric Update's launch coverage and Humanity's LayerZero announcement describe a palm-based
              proof-of-humanity model with zero-knowledge verification (CE001). A founder interview describes mobile
              palm capture, but does not establish independently tested enrollment performance (CE002). Later
              mainnet-release coverage describes a broader credential proposition: zkTLS proofs over existing Web2
              records, with loyalty, financial, educational, and professional examples (CE004, CE005). These are product
              and launch claims, not independent deployment or outcome measurements. A product guide published by XT
              Exchange also presents Human ID and H-token functions, but does not independently validate implementation
              or adoption (CE014).
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE014
