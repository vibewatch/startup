companyProfile:
  summary: >-
    Humanity Protocol is developing a palm-biometric identity and credential network that combines palm recognition with
    zero-knowledge proofs. Its public positioning has broadened from proof-of-personhood toward reusable Proof-of-Trust
    credentials, while reported product milestones and issued-ID counts do not establish paying adoption or recurring
    revenue. A June 2026 private-key compromise and token migration leave recovery execution and privileged-access
    controls as material diligence questions.
  founders:
    - name: Terence Kwok
      role: Founder and CEO, as identified in an August 2024 interview
      claimRefs:
        - CO003
  foundingLocation: null
  headquarters: null
  productSummary: >-
    Palm-based identity verification and reusable credentials designed to support privacy-preserving proof-of-humanity
    and proof-of-trust workflows using zero-knowledge proofs.
  customerFocus: >-
    The product is positioned for individuals and organizations that need identity or credential verification; a paying
    customer base and conversion data are not established.
  businessModel: >-
