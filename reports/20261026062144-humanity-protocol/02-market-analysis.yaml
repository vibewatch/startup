schemaVersion: "report-v2"
artifact: market-analysis
slug: humanity-protocol
runDate: 2026-10-26
company:
  name: Humanity Protocol
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a broad identity-verification market shaped by fraud,
    assurance requirements, and digital-identity programs, but it does not isolate
    spending on palm-based proof of humanity or reusable credentials. Humanity
    Protocol's buyer set, paid adoption, and serviceable market therefore remain
    unquantified; the broad market estimate is context, not company TAM.
sections:
  - id: market-boundary
    title: Define the market before sizing it
    body: >-
      Mordor Intelligence defines identity verification as tools and services that
      confirm a person or business during onboarding and ongoing access, using
      document checks, biometric matching, and database validations across digital
      and physical channels. That is the defensible outer market boundary in the
      assigned evidence. General identity platforms, access management, fraud
      software, wallet infrastructure, and biometric hardware should not be added
      unless a paid verification workflow and its spend are isolated. Humanity
      Protocol describes a narrower palm-based proof-of-humanity anchor with
      selective credentials; that positioning can overlap with verification but
      does not make every digital identity deployment addressable. Public identity
      standards and wallet functions establish adjacent scope, not incremental
      company revenue.
    claimRefs: [CM001, CM002, CM009]
    tableRefs: [TM001]
  - id: market-sizing
    title: One broad estimate is context, not a Humanity TAM
    body: >-
      Mordor's only retained dollar estimate is USD 15.78 billion for 2026, with a
      USD 26.8 billion forecast for 2031 and an 11.18% CAGR over 2026-2031; it
      identifies its method as proprietary. Its 2025 biometric share is not
      palm-specific, while its enterprise and financial-services shares describe
      the whole identity-verification category. The World Economic Forum's legal-ID
      count and FATF's 2020 unbanked-adult count are population lenses, not spend,
      paying buyers, or current serviceable accounts. No retained source bridges
      these broad measures to Humanity's proof-of-humanity or reusable-credential
      product. The pyramid is an unscaled boundary schematic: its layers overlap
      and do not support a calculated TAM, SAM, or SOM.
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyer, user, and payer differ by workflow
    body: >-
      Potential buyers have distinct jobs and budget lines. Financial institutions
      assess identity for customer due diligence; public-sector programs specify
      proofing, authentication, federation, and wallet functions; online platforms
      may seek human or account-integrity checks. Mordor's category estimates point
      to financial services and large enterprises as important identity-verification
      segments, while LexisNexis reports fraud signals in ecommerce and
      gaming-related activity. Humanity's own page names banks, games, DAOs, and
      cities as credential use cases, but this is company positioning rather than
      verified customer demand. The assigned sources do not disclose Humanity
      contracts, paid verification volumes, pricing, renewals, or budget owners;
      the segment map is therefore a diligence hypothesis, not a customer roster.
    claimRefs: [CM006, CM009, CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: adoption-drivers-and-constraints
    title: Fraud creates a driver, while assurance and trust constrain adoption
    body: >-
      LexisNexis Risk Solutions reports fraud and synthetic-identity trends from
      its own Digital Identity Network, and says agentic traffic rose 450% between
      January and December 2025; it also states there was no indication of
      malicious intent for that agent traffic. Those measures indicate a changing
      verification environment, not Humanity Protocol usage or total market demand.
      NIST and FATF guidance make assurance, governance, and reliability relevant
      to deployment, while the World Economic Forum warns that policy, regulation,
      and technology affect decentralized identity's social impact. A CoinMarketCap
      digest relays a scheduled H-token unlock, which is a supply-side token event,
      not evidence of identity-service revenue. Halborn's fetched page body contains
      only a newsletter prompt despite its hack-explainer title, so it supplies no
      technical findings about controls or adoption impact.
    claimRefs: [CM003, CM011, CM012, CM013, CM014, CM015, CM016]
tables:
  - id: TM001
    title: Working market boundary and substitutes
    columns:
      - Market layer
      - Included spend for this analysis
      - Excluded or not counted
      - Potential buyer or payer
      - Relevance to Humanity Protocol
    rows:
      - ["Identity verification", "Paid person or business verification during onboarding or ongoing access", "General identity-platform, access-management, or fraud-software spend without an attributable verification purchase", "Financial-services, public-sector, or platform buyer; specific budget owner is not established", "Broad category context, not a company-specific addressable share"]
      - ["Biometric verification", "Biometric matching within an identity-verification workflow", "Biometric hardware and palm checks not sold as verification services", "Enterprise risk, compliance, or product team; payer varies by deployment", "Mordor's biometric share is not specific to palm biometrics"]
      - ["Proof of humanity or uniqueness", "A paid unique-human or Sybil-resistance check when a buyer requires that workflow", "Generic KYC or biometric checks that do not establish unique-human status; token trading", "Online application or platform is a possible buyer; paid demand is unverified", "Narrower proposed use case; no standalone market value retained"]
      - ["Reusable credentials and digital wallets", "Credential issuance or validation spend only when separately purchased and measurable", "Entire wallet programs, public digital-ID infrastructure, or broad identity-platform budgets", "Issuer, relying party, public body, or platform; Humanity-specific payer is unknown", "Adjacent market; do not add the whole wallet category to verification spend"]
      - ["Status quo and substitutes", "Existing document checks, centralized ID providers, national eID, and in-house checks when they solve the same verification job", "Unrelated login, access-control, and fraud budgets absent a workflow-level link", "Existing bank, government, or platform teams", "Competing approaches can satisfy the same job without proof-of-humanity"]
    notes: >-
      Analyst-defined boundary, not a published market taxonomy. Potential buyers
      and exclusions are not verified purchase data; overlapping category layers
      must not be summed.
    claimRefs: [CM001, CM002, CM009, CM010]
  - id: TM002
    title: Market sizing lenses and source limitations
    columns:
      - Lens or metric
      - Publisher and period
      - Geography
      - Value or rate
      - Method and unit
      - Limitation for Humanity Protocol
    rows:
      - ["Identity-verification market", "Mordor Intelligence; 2025-2026 estimate and 2031 forecast", "Not specified in retained excerpt", "USD 14.19B (2025); USD 15.78B (2026); USD 26.8B (2031); 11.18% CAGR (2026-2031)", "Publisher's proprietary market-sizing framework; market-value estimate and forecast", "Broad identity-verification scope; not decentralized-identity or Humanity TAM"]
      - ["Biometric verification share", "Mordor Intelligence; 2025", "Not specified in retained excerpt", "35.84% of identity-verification market revenue share", "Publisher-reported category segment share", "Does not isolate palm biometrics, proof of humanity, or company share"]
      - ["Large-enterprise segment", "Mordor Intelligence; 2025", "Not specified in retained excerpt", "72.56% of identity-verification market share", "Publisher-reported organization-size segment", "Broad category measure, not Humanity's buyer mix"]
      - ["Financial-services segment", "Mordor Intelligence; 2025", "Not specified in retained excerpt", "30.72% of identity-verification market share", "Publisher-reported end-user segment", "Does not establish a Humanity customer or budget"]
      - ["People without legal ID", "World Economic Forum; publication vintage not visible in fetched text", "Global", "Roughly 850 million people", "Population-access estimate; not spend or a current count", "Cannot be treated as potential paying users or a serviceable market"]
      - ["Unbanked adults and documentation barrier", "FATF; 2020-03-06 guidance", "Global", "1.7 billion unbanked adults; 26% cited lack of documentation as the primary barrier", "Historical population and survey-context figures", "Not current population, unique customers, or market value"]
      - ["Fraud telemetry, not market size", "LexisNexis Risk Solutions; transactions analyzed in 2025, report dated 2026-03-26", "Global report; regional rates vary", "More than 116 billion network transactions; reported 8% rise in global fraud rates", "Publisher's own Digital Identity Network analysis", "A vendor dataset and fraud signal, not total transaction coverage or Humanity demand"]
    notes: >-
      Mordor labels its market estimates proprietary and notes that scope, base
      year, and pricing logic differ across publishers. Estimates, segment shares,
      population counts, and fraud telemetry are unlike measures and are not
      additive; no source isolates Humanity-specific TAM, SAM, or SOM.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM011]
  - id: TM003
    title: Illustrative buyer, user, payer, and adoption map
    columns:
      - Segment or workflow
      - Buyer and user
      - Potential payer or budget owner
      - Adoption trigger
      - Evidence and unresolved question
    rows:
      - ["Financial services", "KYC, compliance, and fraud teams; account applicants and existing customers", "Bank, payment provider, or regulated institution; specific Humanity payer unknown", "Customer due diligence, assurance requirements, and synthetic-identity risk", "NIST and FATF describe identity controls; no Humanity contract, price, or deployment is retained"]
      - ["Public-sector identity services", "Government identity or digital-service owner; residents and service users", "Government or relying party; procurement budget not identified", "Proofing, authentication, federation, and digital-identity wallet functions", "NIST and European Commission define use contexts; no Humanity procurement or mandate is established"]
      - ["Ecommerce and online platforms", "Platform risk or identity team; merchants and account holders", "Platform or merchant; buyer and pricing are unverified", "Account fraud, synthetic identities, and bot pressure", "LexisNexis reports network and sector fraud trends; no company-specific adoption evidence"]
      - ["Gaming and gambling", "Operator trust, safety, or fraud team; players and account holders", "Operator or platform; budget owner unknown", "Identity checks around logins and payments amid automation and fraud", "LexisNexis reports agentic traffic and attack-rate changes, while noting no malicious intent indication for agentic traffic"]
      - ["Web3 applications, DAOs, and credential issuers", "Application or protocol team; wallet holders and credential subjects", "Developer, protocol, or relying party is only a possible payer", "Unique-human checks and portable credentials", "Humanity names these as use cases; the assigned sources do not establish paid customer activity"]
      - ["Large enterprises", "Enterprise identity, security, or compliance teams; employees or consumers", "Enterprise buyer; Humanity-specific budget ownership unknown", "Scale, compliance, and integration requirements", "Mordor estimates large enterprises at 72.56% of broad category share in 2025; this is not company customer mix"]
    notes: >-
      Potential budget owners are analytical hypotheses, not verified Humanity
      buyers. This map separates broad category demand from paid customer,
      conversion, retention, and contract evidence.
    claimRefs: [CM006, CM009, CM010, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Broad identity verification market to unsized Humanity segment
    type: pyramid
    summary: >-
      The broad market estimate and biometric share do not quantify the narrower
      palm, proof-of-humanity, or reusable-credential opportunity.
    data:
      items:
        - label: Broad identity verification
          value: "USD 15.78B (2026 estimate); USD 26.8B (2031 forecast)"
          detail: Mordor's proprietary estimate spans multiple verification methods.
        - label: Biometric verification
          value: "35.84% of category revenue share (2025)"
          detail: Category-level share, not a palm-only market.
        - label: Palm biometric checks
          value: Not separately sized
          detail: No retained estimate isolates this modality.
        - label: Proof of humanity or unique-human checks
          value: Not separately sized
          detail: No retained estimate isolates paid unique-human workflows.
        - label: Reusable credential verification
          value: No discrete spending estimate
          detail: Wallet and credential spend may overlap with verification.
        - label: Humanity Protocol addressable market
          value: TAM, SAM, and SOM not established
          detail: No buyer, paid-volume, pricing, or market-share bridge is retained.
    approximationNotes: >-
      Conceptual boundary schematic, not to scale. The layers may overlap; the
      biometric share is not multiplied by the broad estimate and does not imply
      palm or proof-of-humanity market share.
    claimRefs: [CM002, CM004, CM005]
