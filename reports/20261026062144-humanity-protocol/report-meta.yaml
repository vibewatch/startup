  topStrengths:
    - >-
      The product combines palm-based identity verification and zero-knowledge proofs, with reported mainnet activity
      and a 2026 shift toward reusable credentials.
    - >-
      Public reporting records more than eight million issued Human IDs by February 2026, an activity signal that merits
      follow-up but is not a measure of active or paying users.
  topRisks:
    - >-
      A June 2026 private-key compromise and token migration leave privileged access, recovery execution, and
      independent control testing unresolved.
    - Public evidence does not establish paid customer conversion, recurring revenue, margins, current cash, or runway.
    - Biometric-data handling, applicable jurisdictions, and the legal basis for processing remain unverified.
    - >-
      Token-market valuations and historical financing marks do not establish current company equity value or token
      treasury backing.
  unresolvedGaps:
    - >-
      Current revenue, gross margin, cash flow, and whether enterprise or institutional workflows generate recurring
      cash revenue.
    - >-
      Independent post-incident evidence on key management, signer policy, privileged-access hardening, and completion
      of recovery.
    - >-
      Treasury composition, unlock policy, token migration reconciliation, and any reserves or liabilities related to
      the June 2026 incident.
    - >-
      Paying-customer conversion, retention, contract depth, and production usage behind named partner and integration
      announcements.
    - >-
      Verified legal-entity structure, current capitalization, leadership, governance rights, and operating
      headquarters.
