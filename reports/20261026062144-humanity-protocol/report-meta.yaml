summary:
  headline: >-
    Humanity Protocol has product activity and identity-market optionality, but the 2026 key compromise, unproven
    commercial conversion, and absent current financial disclosure keep the recommendation at research-more.
  overallScore: 4.8
  recommendation: research-more
