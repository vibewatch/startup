  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-remediation
      missingEvidence: Independent post-incident forensic findings, documented endpoint and key-custody redesign, signer and bridge-admin controls, and verification that token migration and recovery are complete.
      whyItMatters: The reported exploit arose from compromised privileged keys, so a token replacement alone does not establish that the access path or recovery risk has been removed.
      diligencePath: Obtain the full postmortem, named external audit and penetration-test reports, key inventory and signer-policy evidence, bridge-admin change records, recovery-drill results, and final exchange/bridge migration reconciliations.
      relatedQuestionRefs:
        - QR009
      relatedTableRefs:
        - TR002
    - type: missing-source
      severity: material
      topic: partner-and-financial-concentration
      missingEvidence: Current counterparty concentration, signed partner terms and fallback rights, treasury composition, token unlocks and liabilities, operating cash and runway, and customer revenue.
      whyItMatters: Without these denominators, the investment risk from partner dependence, token-market stress, or financing needs cannot be quantified.
      diligencePath: Request current management accounts, treasury and token schedules, partner contracts and service-level terms, active integration metrics, and a counterparty-by-counterparty concentration analysis.
      relatedQuestionRefs:
        - QR010
      relatedTableRefs:
        - TR003
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: A complete jurisdiction and data-flow inventory identifying users, biometric processing locations, controller and processor roles, applicable privacy regimes, and cross-border transfers.
      whyItMatters: The GDPR and FTC materials establish conditional legal diligence questions but do not determine which laws apply to Humanity Protocol or whether its controls satisfy them.
      diligencePath: Obtain the current privacy notice, data-protection impact assessment, vendor and transfer map, retention/deletion schedule, consent flows, and legal analysis for each operating and target market.
      relatedTableRefs:
        - TR001
