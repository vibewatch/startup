callouts:
  - calloutType: risk
    title: Do not treat token migration as control remediation
    body: >-
      The reported incident involved compromised private keys rather than a
      smart-contract vulnerability. A replacement token and contract do not by
      themselves demonstrate safer endpoints, separated signers, or resilient
      bridge administration; require independent evidence of those controls before
      treating the incident as contained.
    claimRefs:
      - CR002
      - CR003
      - CR014
