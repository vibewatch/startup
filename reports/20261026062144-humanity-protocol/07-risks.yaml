schemaVersion: "report-v2"
artifact: risks
slug: humanity-protocol
runDate: 2026-10-26
company:
  name: Humanity Protocol
chapter:
  number: 7
  title: Risks
  summary: A June 2026 token exploit makes privileged-key custody and recovery execution the clearest evidenced risk; reporting attributes it to compromised developer-device key backups rather than a smart-contract flaw. Biometric privacy, partner rollout, and token-market exposure remain material, while current remediation, commercial conversion, and financial capacity are not established by the assigned evidence.
sections:
  - id: security-event-and-recovery
    title: Security event and recovery
    body: >-
      BSC News reported that the June 8, 2026 H-token exploit followed malware on a
      developer machine and exposure of seven private keys, including administrative
      and Safe-owner keys; its account says attackers used legitimate keys rather
      than exploiting a smart-contract defect (CR001, CR002, CR003). CoinAlert also
      described a token replacement and 1:1 recovery airdrop, while BSC News said
      migration required coordination with exchanges, bridge providers, and
      liquidity partners (CR004, CR005). The incident is direct evidence that
      operational key custody can defeat otherwise audited code. The pool does not
      establish that token migration completed or that post-incident access controls
      were independently tested. Until those controls are evidenced, treat any
      privileged upgrade, bridge reopening, or recovery-contract administration
      as a high-impact residual exposure rather than assuming migration itself
      removed the access risk (CR014).
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR014
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: biometric-privacy-and-regulation
    title: Biometric privacy and regulatory exposure
    body: >-
      Humanity Protocol's product page claims a palm scan can establish proof of
      humanity without storing sensitive data on a central server (CR006). That is
      a company representation, not independent evidence of collection boundaries,
      template reversibility, deletion, retention, or access controls. GDPR Article
      9 treats biometric data used to uniquely identify a person as special-category
      data subject to a prohibition and specified exceptions; FTC guidance separately
      says businesses must honor privacy promises and maintain security appropriate
      to the data they hold (CR007, CR008, CR009). These sources define diligence
      questions, not a finding that Humanity Protocol is subject to or violates
      either regime. The applicable controller, jurisdictions, consent basis,
      processor chain, and breach-notification duties remain unverified; obtain
      the data-flow map and jurisdiction-by-jurisdiction legal assessment before
      treating the privacy architecture as a mitigant.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
    tableRefs:
      - TR001
  - id: partner-and-commercial-dependencies
    title: Partner and commercial dependencies
    body: >-
      Biometric Update described a Mastercard open-finance integration intended to
      let users prove financial credentials and link bank-account ownership through
      Human ID, with an initial U.S. rollout planned (CR010). The article reports
      an announced plan, not production deployment, customer conversion, or revenue.
      Separately, BSC News described the token migration as requiring coordination
      with centralized exchanges, bridge providers, and liquidity partners (CR005).
      These dependencies expose execution to counterparties and operational
      readiness outside the protocol's own code. The available record does not
      quantify partner concentration, contractual remedies, implementation
      ownership, or fallback paths. Request signed integration scope, launch
      acceptance criteria, active usage and service-level evidence, and migration
      confirmations from each relevant exchange and bridge before underwriting
      broad distribution or durable partner access.
    claimRefs:
      - CR005
      - CR010
    tableRefs:
      - TR003
  - id: token-market, funding, and monitoring
    title: Token-market and financial visibility
    body: >-
      BeInCrypto reported a January 2025 $20 million financing at a $1.1 billion
      fully diluted valuation, led by Pantera Capital and Jump Crypto; this is a
      historical financing report, not current valuation, runway, or cash available
      (CR011). BingX Learn described a roughly 69.5% H-token increase over 24 hours
      in a 2025 market episode, followed by a pullback, illustrating historical
      market volatility rather than current trading conditions (CR012). Humanity's
      own 2025 blog still described palm-scan verification as an upcoming rollout
      phase, which should not be read as evidence of present deployment (CR013).
      Current treasury composition, token unlocks, operating runway, and customer
      revenue are not established here. The investment case should remain gated
      on current cash and token-liability disclosures, independently verified
      recovery completion, and measurable evidence that integrations progressed
      from announcement to sustained use.
    claimRefs:
      - CR011
      - CR012
      - CR013
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Issue or rule
      - Applicability evidence
      - Likelihood / severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - GDPR special-category biometric data
        - Article 9 restricts biometric processing for unique identification, subject to specified exceptions; Humanity's applicability is not established.
        - Applicability unknown; potentially high impact if relevant processing lacks a valid basis.
        - No jurisdictional or processing assessment in the assigned evidence.
        - Obtain controller/processor roles, purpose and consent basis, data-flow and retention maps, and counsel's market-by-market assessment.
      - - U.S. privacy representations and data security
        - FTC guidance addresses truthful privacy promises and safeguards appropriate to sensitive data; no finding about this company's U.S. legal status is available.
        - Applicability unknown; impact could be material if actual practice diverges from promises or required safeguards.
        - Company privacy assertion is not independently tested.
        - Reconcile public claims with technical architecture, vendor controls, incident response, and any breach-notification duties.
      - - Cross-border, age, and consumer-protection requirements
        - The assigned material does not map users, biometric processing locations, age groups, or service-provider roles.
        - Likelihood cannot be rated without jurisdiction and population data; impact may be high.
        - No complete jurisdictional inventory is available.
        - Commission a jurisdiction-by-jurisdiction obligations matrix and document age, consent, transfer, deletion, and complaint handling.
    notes: >-
      Partial register of the legal texts and regulator guidance in the assigned pool,
      not a complete jurisdictional survey or a conclusion that a law applies or was
      breached. Unknown applicability is not evidence of compliance.
    enumerationScope:
      coverage: partial
      basis: Public legal text and regulator guidance retained for this chapter; markets, data flows, and company legal roles are not fully enumerated.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity / impact
      - Mitigation maturity
      - Residual exposure and diligence ask
    rows:
      - - Developer-device compromise and key backup exposure
        - Observed once in June 2026 reporting; recurrence likelihood unknown.
        - "High: reporting describes unauthorized token activity and a $36 million exploit."
        - Token replacement and recovery were reported; independent confirmation of endpoint, key-generation, storage, and signer-policy changes is absent.
        - Review the postmortem, key inventory, hardware-backed custody, signer separation, privileged access logs, and independent retest.
      - - Bridge and administrator privilege abuse
        - Unknown after the reported incident.
        - "High: BSC News describes compromised administrator and Safe-owner keys used to authorize transactions."
        - New token and contract migration were reported; bridge-admin redesign and recovery testing are not independently evidenced.
        - Require bridge architecture, upgrade authority map, timelocks, emergency pause and recovery drills, and external review before resuming privileged operations.
      - - Recovery contract or token migration execution failure
        - Unknown; migration completion is not confirmed in the assigned evidence.
        - High for affected holders and ecosystem continuity.
        - CoinAlert reported a 1:1 replacement plan and BSC News described a new audited ERC-20 token; no audit report or completion evidence is included.
        - Obtain the named audit, deployment verification, eligibility and exception reconciliation, exchange support, and final migration status.
      - - Biometric privacy assurance exceeds verified controls
        - Unknown; the source set contains a company assertion, not a technical assessment.
        - High if biometric identifiers or linkable templates are exposed or misused.
        - Company states sensitive data is not stored on a central server; retention, encryption, template protection, deletion, and access controls remain unverified.
        - Validate threat model, data minimization, revocation/deletion, processor controls, and independent privacy/security testing.
    notes: >-
      Qualitative likelihood and impact are analyst assessments based on the cited
      incident and explicitly identified evidence gaps; no recurrence probability
      or loss estimate is inferred. The reported $36 million figure is not treated
      as cash burn or company loss.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario and severity
      - Mitigation and residual exposure
    rows:
      - - Open-finance identity integration
        - Mastercard integration described by Biometric Update; links account ownership and identity attributes.
        - No deployment share, contract terms, customer count, or revenue contribution disclosed in the assigned material.
        - Delayed or limited rollout could prevent the announced financial-services use case; commercial impact is unquantified.
        - Verify production status, data responsibilities, consent and exception paths, service levels, and independent customer usage.
      - - Token migration and distribution
        - Centralized exchanges, bridge providers, and liquidity partners, according to BSC News.
        - Partner-by-partner reliance and fallback arrangements are not quantified.
        - Delayed exchange support or bridge/liquidity interruption could impair recovery and market access.
        - Obtain written migration confirmation, named escalation owners, reconciliation results, and tested alternative routes.
      - - Funding and token-market access
        - BeInCrypto reported a 2025 financing led by Pantera Capital and Jump Crypto; BingX Learn reported a historical H-token price swing.
        - Current investor concentration, treasury, unlocks, liquidity depth, and operating runway are unknown.
        - Financing or token-market stress could constrain execution; current exposure cannot be quantified.
        - Request current cash and liabilities, token allocation/unlock schedule, financing rights, and audited operating metrics.
    notes: >-
      This is a partial dependency register, not an exhaustive counterparty inventory.
      A reported announcement or financing does not establish a live contract, current
      cash balance, revenue, or dependency concentration.
    claimRefs:
      - CR005
      - CR010
      - CR011
      - CR012
