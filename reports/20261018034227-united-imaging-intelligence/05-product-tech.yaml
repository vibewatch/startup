      - ["Shared hardware/software R&D platform", "Supports cross-modality product integration and iteration", "Parent annual report says common underlying architecture and shared designs are reused across product lines", "Cross-product coupling can accelerate releases but also concentrates technical and organizational dependencies"]
      - ["Clinical application layer", "Delivers triage tools, portal software, and broader application libraries to end users", "Named product maturity is visible only for a subset of the portfolio", "Portfolio breadth exceeds the app-level public clearance and implementation evidence in the assigned pool"]
      - ["Foundation-model and agent layer", "Adds multimodal reasoning, reporting, and hospital-operations orchestration on top of existing workflows", "Depends on clinical collaboration, multimodal models, and parent distribution to move from showcase to production", "Roadmap visibility is better than commercial readiness; not all features are documented as cleared or available globally"]
      - ["Trust, privacy, and compliance controls", "Provides baseline information-security and privacy process coverage", "Publicly visible controls are mostly reported at the parent-group level", "UII-specific status, incident, model-governance, and procurement-security documentation are not surfaced in the assigned pool"]
    notes: >-
      This architecture view synthesizes explicit source statements about hardware integration,
      shared R&D platforms, and named AI products; the assigned pool does not disclose a
      deeper standalone software architecture for UII.
    claimRefs: [CE007, CE008, CE011, CE012, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      UII's public product story layers application and agent software on top of the parent's
      installed imaging and compliance substrate.
    data:
      layers:
        - label: Installed imaging substrate
          detail: Parent hardware, cloud platforms, imaging centers, and installed systems create the deployment and data foundation.
          modules:
            - UIH imaging modalities and radiotherapy equipment
            - Cloud platforms and imaging centers for data acquisition
            - Global installed base and hospital footprint
          outputs:
            - Embedded deployment path
            - Modality-specific data streams
        - label: Clinical application layer
          detail: Named workflow tools cover triage, CT angiography analysis, and broader application libraries.
          modules:
            - uAI Easy Triage ICH
            - uAI EasyTriage-Rib
            - uAI Portal
            - uAI Clinical Portal / >100 application library
          outputs:
            - Worklist prioritization
            - Segmentation and structured analysis
        - label: Research and quality layer
          detail: Portal products extend the software surface into research workflows, image-quality review, and equipment analytics.
          modules:
            - uAI Research Portal
            - uAI Quality Control Portal
            - uMetaGenesis equipment analytics
          outputs:
            - Zero-code research workflows
            - Imaging-quality and maintenance insights
        - label: Foundation-model and agent layer
          detail: Newer roadmap items use multimodal models to generate reports, guide clinicians, and monitor operations.
          modules:
            - uAI Insight imaging-to-report agent
            - uAI Avatar medical assistant
            - Hospital-management agent
            - uAI NEXUS multimodal foundation models
          outputs:
            - Structured reporting
            - Natural-language workflow assistance
            - Operational analytics
        - label: Service and lifecycle layer
          detail: Parent-group installation, maintenance, upgrade, training, and remote-support capabilities provide the operational wrapper for deployed systems.
          modules:
            - Installation and configuration
            - Hardware and software upgrades
            - Clinical application support
            - Remote training and service
          outputs:
            - Deployment support
            - Lifecycle maintenance
        - label: Governance and market-access layer
          detail: Clearances and certifications create a partial trust shell, but product-level availability remains unevenly documented.
          modules:
            - Named FDA-linked directory entries
            - Country-specific product availability constraints
            - ISO 27001 / 27701 / 27017 at group level
            - Product-level certification-scope diligence
          outputs:
            - Regulatory market access
            - Procurement trust baseline
            - Country-by-country availability constraints
    claimRefs: [CE003, CE006, CE007, CE008, CE011, CE012, CE013]
callouts:
  - calloutType: strength
    title: Embedded deployment is the main technical moat
    body: >-
      The assigned pool consistently points to group-level integration as UII's core advantage:
      it can push AI into United Imaging Healthcare modalities, data pipelines, and hospital
      relationships instead of distributing only standalone algorithms.
    claimRefs: [CE011, CE012]
  - calloutType: risk
    title: Public roadmap breadth exceeds public implementation proof
    body: >-
      UII can show named products and meaningful regulatory counts, but the newest
      agent-centric layer still looks more like showcase material than a fully documented,
      country-by-country production catalog.
    claimRefs: [CE007, CE008]
