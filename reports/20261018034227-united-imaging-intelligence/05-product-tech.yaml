      - ["Prioritize trauma chest CT studies", "Manual review of possible rib-fracture trauma scans", "uAI EasyTriage-Rib flags suspected multiple acute rib fractures for workflow triage", "Earlier prioritization of trauma studies with suspected critical findings", "Tool assists triage rather than diagnosis; public accuracy disclosures are sparse"]
      - ["Interpret and plan vascular CT angiography", "Manual vessel review, measurement, and surgical planning", "uAI Portal provides CT angiography viewing, manipulation, evaluation, and AI-based segmentation", "Facilitates clinical decision-making and preoperative analysis across multiple vascular beds", "No public implementation detail on workflow handoff, integration depth, or specialty adoption by site"]
      - ["Develop and operationalize new imaging AI workflows", "Separate research tooling and manual model translation into practice", "UII combines research tooling, multimodal models, and collaboration programs such as the MGH project", "Research-to-clinic loop is presented as faster because data, algorithms, and installed systems sit within one group", "Public benchmarks and external reproducibility evidence remain limited in the assigned pool"]
    notes: >-
      Benefits are phrased at the level stated in the retained sources; the assigned pool does
