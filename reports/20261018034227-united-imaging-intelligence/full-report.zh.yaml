      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高优先级风险集中在临床 AI 推进和集团依赖；营运资金与渠道风险同样重要，但更容易通过运营监测。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高影响：模型安全
          values:
            - null
            - null
            - text: AI 安全 / 审批范围
              note: UII 正在放缓推广，而且并非所有展示的应用都已获批。
        - label: 高影响：结构性依赖
          values:
            - null
            - text: 母公司 / 渠道依赖
              note: UII 仍受集团控制，并嵌入设备体系。
            - null
        - label: 高影响：融资
          values:
            - null
            - text: 独立经济性不透明
              note: 公开估值没有披露实体层面的收入或现金链路。
            - null
        - label: 中等影响：知识产权
          values:
            - text: IP / 商业秘密泄露
              note: 母公司年报称，核心技术泄露会损害盈利能力。
            - null
            - null
        - label: 中等影响：商业执行
          values:
            - null
            - text: 经销商和应收账款控制
              note: 母公司披露指出渠道合规和回款风险。
            - null
        - label: 中等影响：海外准入
          values:
            - null
            - text: 审批与渠道爬坡
              note: 注册周期和贸易摩擦可能拖慢地域扩张。
            - null
    approximationNotes: 点位是定性且基于来源的判断；矩阵表达相对优先级，而非统计概率模型。
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR007
      - CR008
      - CR010
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据支持其战略质量，但价格信号已经跑在公开经济数据之前。
    data:
      nodes:
        - id: scale
          label: 产品与审批广度
          detail: 截至 2024 年末已有 100 多个产品，且跨司法辖区审批仍在增加。
        - id: validation
          label: 临床与技术验证
          detail: 对外合作历史及公司自称的报告智能体表现，显示其具备真实能力。
        - id: financing
          label: 最近一轮融资存在
          detail: 公开数据库和报道指向一笔 2025 年约 $139M / RMB1B 的融资，估值为 $1.4B。
        - id: structure
          label: 融资轮次结构模糊
          detail: 公开记录对时间存在分歧，并显示关联方参与程度不低。
        - id: economics
          label: 独立经济性仍不透明
          detail: 没有公开收入、利润率、留存或股权结构表条款来支撑明确的经营倍数。
        - id: recommendation
          label: 继续研究 / 估值偏高
          detail: 在把上行空间计入投资判断前，应等待可审计 KPI，或等待明显更好的入场条款。
      edges:
        - from: scale
          to: validation
          context: Quality signals
        - from: validation
          to: financing
          context: Supports fundability
        - from: financing
          to: structure
          context: But round signal is not clean
        - from: structure
          to: economics
          context: Missing terms and metrics
        - from: economics
          to: recommendation
          context: Prevents conviction at price
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
