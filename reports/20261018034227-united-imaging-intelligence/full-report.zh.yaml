              监管和法律风险在于产品面扩张快于各模块获批、可报销和生产安全的公开证明。RSNA 明确称并非所有展示应用都带 CE 标志或 FDA 批准；母集团还面临审批壁垒、知识产权争议和技术秘密泄露。关键问题是 UII
              是否有逐产品证据、上市后监测和知识产权规范，能在不发生监管或质量重置的情况下扩张。
