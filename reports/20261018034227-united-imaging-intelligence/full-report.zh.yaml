            body: >-
              需求时点同时受影像资本开支周期和医院工作流压力影响。2025 年年报称中国设备更新政策释放高端影像、放疗和基层诊疗需求；RSNA 2025 推进报告和医院管理智能体，WHX 2026
              增加科研、质控和设备运营门户。但在定价、付费站点数或软件收入分部披露前，估值仍基于采用潜力，而非已证明的市场占有。
