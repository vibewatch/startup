      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: UII 的公开产品叙事是在母公司的影像装机和合规底座之上，逐层叠加应用软件与智能体软件。
    data:
      layers:
        - label: 影像装机底座
          detail: 母公司硬件、云平台、影像中心和已部署系统共同构成部署与数据基础。
          modules:
            - UIH 影像设备及放疗设备
            - 用于采集数据的云平台和影像中心
            - 全球装机基础和医院覆盖
          outputs:
            - 嵌入式部署路径
            - 特定设备的数据流
        - label: 临床应用层
          detail: 已命名的工作流工具覆盖分诊、CT 血管造影分析及更广泛的应用库。
          modules:
            - uAI Easy Triage ICH 工具
            - uAI EasyTriage-Rib
            - uAI Portal
            - uAI Clinical Portal / 超过 100 个应用的应用库
          outputs:
            - 工作列表优先级排序
            - 分割与结构化分析
        - label: 研究与质量层
          detail: Portal 产品将软件能力延伸至研究工作流、影像质量审查和设备分析。
          modules:
            - uAI Research Portal 研究门户
            - uAI Quality Control Portal 质控门户
            - uMetaGenesis 设备分析
          outputs:
            - 零代码研究工作流
            - 影像质量和维护洞察
        - label: 基础模型与智能体层
          detail: 较新的路线图项目使用多模态模型生成报告、指导临床医生并监测运营。
          modules:
            - uAI Insight 影像转报告智能体
            - uAI Avatar 医疗助手
            - 医院管理智能体
            - uAI NEXUS 多模态基础模型
          outputs:
            - 结构化报告
            - 自然语言工作流辅助
            - 运营分析
        - label: 服务与生命周期层
          detail: 母集团的安装、维护、升级、培训和远程支持能力，为已部署系统提供运营外壳。
          modules:
            - 安装与配置
            - 硬件和软件升级
            - 临床应用支持
            - 远程培训与服务
          outputs:
            - 部署支持
            - 生命周期维护
        - label: 治理与市场准入层
          detail: 许可和认证构成了部分信任外壳，但产品层面的可用性仍缺乏完整、一致的记录。
          modules:
            - 已命名的 FDA 关联目录条目
            - 各国特定的产品可用性限制
            - 集团层面的 ISO 27001 / 27701 / 27017
            - 产品层面的认证范围尽调
          outputs:
            - 监管市场准入
            - 采购信任基线
            - 各国可用性限制
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE008
      - CE011
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: UII 似乎先靠研究合作和标杆客户建立可引用性，再扩展到医院各类工作流。
    data:
      nodes:
        - label: 进入母公司生态
          detail: United Imaging 集团关系和已装设备似乎为许多首次接触打开了入口。
          touchpoints:
            - Group subsidiary positioning
            - Hardware-plus-software procurement path
        - label: 研究可信度
          detail: 学术合作和挑战赛曝光度有助于在大规模临床推广前验证 AI 技术栈。
          touchpoints:
            - MGH joint research
            - fastMRI / radiologist-reviewed research credibility
        - label: 科室部署
          detail: 初始使用通常从单个临床或运营工作流开始。
          touchpoints:
            - Radiology reporting
            - Radiotherapy planning
            - Quality control
        - label: 工作流嵌入
          detail: 初始使用获认可后，多项模块会部署到同一机构内部。
          touchpoints:
            - uAI Clinical Portal
            - Imaging modalities plus disease-area modules
        - label: 跨科室扩张
          detail: 已命名案例从放射科延伸到外科、EMR、客服和运营。
          touchpoints:
            - Zhongshan multi-scenario agents
            - Renji cloud hub and CT-linac workflow
        - label: 不透明的续约层
          detail: 公开证据未披露续约、NRR、流失率或直接付费站点的深度。
          touchpoints:
            - No contract-length disclosure
            - No active-user or paid-site denominator
    approximationNotes: 这条路径反映的是保留的来源叙事，而非实测转化率或分阶段客户数。
