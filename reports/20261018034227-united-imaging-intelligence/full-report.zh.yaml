  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持一条由母公司赋能、从资本和共享资产通向三条商业路径的链路，但这条链路在经审计的独立收入和毛利之前就中断了。
    data:
      nodes:
        - id: capital-support
          label: 母公司及关联方资本
          value: $45M founding investment; later RMB70M planned UIH participation
          note: 融资事件显示公司可以获得协同资本，但不代表当前流动性。
        - id: shared-assets
          label: 集团数据和部署资产
          value: Imaging products, cloud, imaging centers, software, and hardware resources
          note: 官方及第三方来源将其描述为 UII 的投入和渠道。
        - id: ai-portfolio
          label: 医疗 AI 产品组合
          value: More than 100 products or applications reported
          note: 不同来源的统计口径各异，不能据此确认付费使用。
        - id: commercial-lanes
          label: 三条已披露商业路径
          value: Clinical 60-70%; research about 20%; equipment about 10%
          note: 来自一份分析师笔记的 2024 年末近似构成。
        - id: customer-activity
          label: 医院和设备部署
          value: Deployment breadth reported; paid usage and retention unavailable
          note: 公司及低等级画像证据提供了业务活动代理指标，而非经审计收入。
        - id: financial-output
          label: 独立财务产出
          value: Revenue, gross margin, cash burn, and runway undisclosed
          note: 需要私有记录才能补完整条链路。
      edges:
        - from: capital-support
          to: shared-assets
          label: 提供资金并支持
        - from: shared-assets
          to: ai-portfolio
          label: 提供数据、基础设施和渠道
        - from: ai-portfolio
          to: commercial-lanes
          label: 组织成
        - from: commercial-lanes
          to: customer-activity
          label: 通过……部署
        - from: customer-activity
          to: financial-output
          label: 公开证据无法量化转化为
    approximationNotes: 分部占比为近似值且来自单一来源；部署指标不视为付费客户数、收入或利润率数据。
    claimRefs:
