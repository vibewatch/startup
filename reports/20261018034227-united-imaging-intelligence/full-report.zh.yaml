              公开证据不足以支持独立口径的清晰美元 TAM、SAM 或 SOM。手册称有超过 40 项 AI 技术和 50 多个 AI 辅助应用；分析师报告称截至 2024 年底有超过 100 个医疗 AI 产品，包括 12
