            body: >-
              财务逻辑在战略上合理，但公开证据不足以量化评估。产品广度、医院部署、患者体验参考和母集团渠道集成不能替代付费客户、使用率、留存或收入披露。Reuters 及 Yahoo 联合转载称管理层因技术尚不成熟而抵制激进
              AI 推广；重复转载是一份报道，不是独立佐证。尽调应把分部组合与经审计独立收入对账，拆分关联方经济性，核验各业务流毛利率，并测试现金和融资能力是否覆盖经营路径。
