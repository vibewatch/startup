    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 付费采用在已安装基础上证明具有黏性，更多获批转化为可报销工作流，战略渠道加速国际化推出
        - 只有审计证据证明可重复的软件经济性，而非战略稀缺性，才能支撑此前 14 亿美元的估值
        - 执行仍取决于证明独立利润率和可出口的监管转化能力
        - 需要经审计的 KPI 披露，以及软件变现独立于捆绑硬件销售的证据
      - - 基准
        - 产品和监管广度真实存在，但变现仍有一部分与母公司设备捆绑，融资条款也只部分可见
        - 不支持任何内在价值区间；要求入场价低于此前估值，或取得里程碑、优先权和信息权保护
        - 投资者可能在收入质量尚未显现前，为平台期权价值支付过高价格
        - 符合当前证据组合：真实的牵引信号、尚未解决的经济性，以及相互冲突的融资记录。
      - - 悲观
        - 部署广度未转化为付费使用深度，按地区划分的获批范围比营销暗示的更窄，下一轮融资在更弱市场中进行
        - 低于此前估值的大幅重置是可能的，但公开证据不足以支持精确的下行底线
        - 若战略内部人士仍是主要资金来源，下一轮下行风险上升
        - 收入、股权结构表或客户转化持续不透明即可触发
    notes: 这些是锚定最近一次披露私募融资的条件性决策规则，不是预测。由于缺乏 UII 独立财务及证券层面的输入，未赋予数值内在价值区间或概率。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
