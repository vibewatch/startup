        title: 扩张逻辑合理，但持久性证据仍缺失
        blocks:
          - type: paragraph
            body: >-
              扩张靠工作流深度推进。WHX 2026 称 uAI Clinical Portal 覆盖 60 多个应用，案例延伸至手术、EMR、质控、放疗规划和运营分析，像是医院科室内的落地扩展。但没有披露
              NRR、GRR、流失、续约、合同期限或直接付费站点数，也很少量化授权模块、使用频率或从试点到软件标准的转化。
