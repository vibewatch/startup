  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断与价格纪律
        blocks:
          - type: paragraph
            body: >-
              本章结论是 **继续研究**。问题不在于产品可信度缺少证据，而在于公开材料对估值的支撑只到上一轮融资标题。Multiples 记录了一笔 June 2025 A 轮融资：估值 $1.4 billion，募资
              $139 million；FLCube 则印证 RMB 1 billion 的融资金额及投资者兴趣。但两者都没有披露独立收入、毛利率、留存率或付费装机转化率。Preqin 将同一笔 CNY 1 billion
              融资描述为 October 2025
              的风险投资，令融资时间和投资者名单更加模糊。因此，投资者只能确认公司融到资金、技术覆盖面广，仍没有足够证据把上一轮估值换算成站得住脚的经营倍数，也无法论证按当前估值入场的目标回报。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
