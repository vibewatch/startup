      - number: '1.2'
        title: 领导层、资本与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据很少：2020 年公告称 Terrence Chen 任 UII America CEO，当前交易画像称 Shen Dinggang
              教授负责部分数据算法和临床应用工作。资料没有完整管理团队、董事会、投票结构或继任方案。Multiples 报道 June 2025 E Fund 和 Shangguo Investment Management
              领投 $139 million A 轮，估值 $1.4 billion；另一份 2024 年 12 月报告称 United Imaging Healthcare 将投资 RMB 28.4872 million
              取得 0.2849%，投前估值为 RMB 9 billion。不同日期和交易口径在缺少底层股权结构表时不应视为估值矛盾。
