              - CV011
              - CV013
      - number: '8.2'
        title: 融资背景与可比锚点
        blocks:
          - type: paragraph
            body: >-
              融资记录更像有生态赞助的战略轮，而非独立基准验证的市场价格。第一财经称 United Imaging Healthcare 以 RMB 70 million 取得 0.70% 新股、累计
              0.9849%，United Imaging Group 和 Shanghai Lianhe 也参与；分析师报告称业务以临床赋能为主，Multiples 将其放在约 $1.3 billion–$1.4
              billion AI 医疗可比公司附近。没有独立财务数据时，这些可比公司只是方向性的情绪锚点。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 情景框架与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              区间应理解为围绕上一轮的决策带，而非精确 DCF。乐观情景要求变现装机基础并形成高端软件经济性；基准情景假设质量真实但变现部分捆绑母集团；悲观情景假设披露追不上价格且市场准入更慢。年报还警告海外审批周期长，GE
              Healthcare、Siemens Healthineers 和 Philips 可能挤压份额和定价。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              建议只有在尽调填补三项缺口后才会改变：独立收入、毛利率和付费客户群；2025
              年融资的股权表与优先权条款；以及独立软件预算与母集团硬件导流的采用拆分。若能证明广泛部署和监管广度转化为可重复的软件经济性，当前价格可能站得住；否则估值偏高，容易出现降价轮或平轮。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 阻碍因素来自价格，而非公司质量
            body: UII 在战略上重要、技术上可信，但公开证据仍止步于产品广度和 headline 私募估值。在能检验独立经济性和融资条款前，合理姿态是继续研究，而不是把上一轮估值当作公平价格。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV013
