  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序图景
        blocks:
          - type: paragraph
            body: >-
              最高严重度风险不是笼统 AI 不确定性，而是 UII
              承认临床部署应谨慎，因为技术可能产生有害副作用。公司同时营销广泛智能体、质控工具和工作流软件，但公开证据没有逐模块商业化、获批和事故图谱。其他风险包括依赖集团渠道、硬件嵌入和数据访问，以及缺少支撑最后估值的独立收入和利润率基础；营运资金、分销控制和海外审批摩擦相对更可监测。
