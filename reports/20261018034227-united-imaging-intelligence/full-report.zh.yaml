companyProfile:
  summary: >-
    United Imaging Intelligence 是一家总部位于上海、2017 年成立的医学影像 AI 子公司，其分销、产品集成和研发能力与 United Imaging Group 紧密相连。公开证据支持其于 June
    2025 完成 $139 million A 轮融资，据报道估值为 $1.4 billion；但当前独立收入、ARR、员工数、付费客户数、股权结构表和董事会构成仍不可得。
  headquarters: Shanghai, China
  productSummary: 覆盖诊断工作流、临床研究及设备嵌入式智能的医学影像 AI 软件，贯穿 United Imaging 的产品线。
  customerFocus: 医院、放射科以及临床/科研工作流
  businessModel: B2B 医疗 AI 软件与工作流集成，收入来自 United Imaging 集团生态内的临床赋能、科研工具和设备嵌入式 部署。
  stage: Series A private
  fundingStatus: 据报道，June 2025 A 轮融资 1.39 亿美元，估值 $1.4 billion。
