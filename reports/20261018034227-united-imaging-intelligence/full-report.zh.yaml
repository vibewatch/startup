      - number: '7.3'
        title: 运营与合作伙伴执行风险
        blocks:
          - type: paragraph
            body: >-
              运营风险因 UII
              同时覆盖扫描仪运行、质控、报告工作流和医院运营而放大，采购延迟、分销执行失误、应收拖延或质量故障都可能拖慢商业化。母集团强调供应商审计、安全库存、保密控制、分销商培训和回款纪律；公开采用证据仍偏向明星站点和演示，尽调应验证旗舰案例能否推广为可靠日常部署。
