      - number: '6.4'
        title: 客户集中风险更多来自渠道依赖，而非单一医院
        blocks:
          - type: paragraph
            body: >-
              主要集中风险来自母集团生态的商业角色，而非单一医院。UII 的软件强化 United Imaging 硬件和工作流方案；第一财经和 Multiples.vc 更多提及母集团融资而非客户变现。Reuters
              称管理层因技术尚不够成熟而抵制极端 AI 推广。技术尚未成熟不代表需求疲弱，但意味着商业化曲线可能更克制。披露直接与捆绑销售、头部客户和续约前，收入持久性仍不透明且可能与集团采购关系交织。
