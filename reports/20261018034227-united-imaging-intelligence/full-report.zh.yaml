            body: >-
              结构性风险是 UII 更像 United Imaging 设备战略中的 AI 赋能部门，而非透明独立软件公司。唯一公开估值是 June 2025 $1.4 billion A
              轮，没有独立收入、利润率或现金桥接；若审批落后、旗舰医院无法转化为付费群组、转移定价或渠道依赖限制独立经济性，或回款和海外准入拖慢下一轮融资，投资论点会迅速失效。
