      - number: '4.3'
        title: 资本支持已披露，但充足性与单位经济性未知
        blocks:
          - type: paragraph
            body: >-
              资本记录说明 UII 能获得关联方支持，却不能证明财务自立。United Imaging 表示，其曾投入 $45 million 设立这家 AI 子公司。第一财经随后报道，United Imaging
              Healthcare 计划投资 RMB70 million，交易后持股 0.70%，累计持股将达 0.9849%；报道还将 United Imaging Group 和 Shanghai Lianhe
              列为参与方。这些交易说明 UII
              可调动战略协同资本，但留存的八份资料均未披露当前现金、账面亏损、经营现金消耗、债务、担保、现金跑道或下一轮融资触发条件，也没有独立收入、ARR、毛利率、服务交付成本、营运资金、资本开支和获客经济性。因此，已募集资金不能视为当前可用现金。
