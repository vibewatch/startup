          - type: paragraph
            body: >-
              最成熟的是具名监管关联产品：肋骨骨折分诊、颅内出血分诊和 uAI Portal 均有 FDA 关联条目。Physician AI Tools 估计 15 个获批产品，但资料池没有监管登记核实总数。RSNA
              2025 的 uAI Insight、uAI Avatar 和医院管理智能体是从任务自动化走向人机协作的路线图，可信但不等于广泛临床可用。
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: 存在技术验证，但安全与实施尽调仍未完成
        blocks:
          - type: paragraph
            body: >-
              外部技术验证包括与 Massachusetts General Hospital 合作，利用美国以外数千名患者经验构建 COVID 期间影像算法；母集团还有 ISO 27001、ISO 27701、ISO
              27017 和 NIST CSF 2.0 评估。RSNA 同时警告并非所有 AI 应用都在每国获批或可用；资料没有独立 UII 信任中心或状态页，母集团披露的软件验收周期也很长。
            claimRefs:
              - CE008
              - CE010
              - CE013
              - CE014
      - number: '5.5'
        title: 展品
        blocks:
          - type: callout
            title: 嵌入式部署是主要技术护城河
            body: 集团级集成是 UII 的核心技术优势：它能把 AI 推入 United Imaging Healthcare 的模态、数据管线和医院关系，而不是只分发独立算法。
            calloutType: strength
            claimRefs:
              - CE011
              - CE012
          - type: callout
            title: 公开路线图广度超过公开实施证据
            body: UII 有具名产品和监管数量，但最新智能体层仍更像展示材料，而非按国家完整记录的生产目录。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分为三条渠道，母集团生态仍居核心
        blocks:
