              真实使用证据存在但不均衡：Massachusetts General Hospital 用于联合 AI 研究，Zhongshan Hospital 用于多场景 AI 智能体，Renji Hospital 用于
              AI 放疗工作流。资料称截至 2024 年底有超过 100 个医疗 AI 产品和多项许可，第三方称在 3,000 多家医院部署超过 100 个 AI 应用；这支持商业广度，却不是经审计的活跃客户分母。
