            body: >-
              产品广度的证据强于商业质量。CMB 称截至 2024 年底有超过 100 个医疗 AI 产品，覆盖 NMPA、CE 和 FDA；RSNA 2025 和 WHX 2026 的发布展示多模态智能体及 60
              多应用的临床门户，但不等于采用、定价或各地获批。2024 年前九个月收入为 RMB 166 million、净亏损为 RMB 82.9218 million；2023 年收入为 RMB 254
