  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              资料将市场边界定义为附着于诊断和治疗工作流的医学影像 AI，而非泛医院软件。纳入支出包括扫描仪内嵌 AI、AI 辅助阅片和报告、科研工具及影像质控层；除非明确回连影像工作流，否则排除
              HIS/ERP、支付方分析、消费者健康和非影像行政系统。主要现状替代方案是人工放射科工作流、模态原生软件及无 AI 层的传统设备升级。
