              公开细分为临床赋能、科研赋能和设备赋能，对应医院放射科和治疗科室、学术或临床研究用户，以及 United Imaging 装机基础。官方 FAQ 将 UII 描述为推进集团 AI 计划的 AI
              决策支持子公司；客户触达和部署相当一部分似乎通过集团设备及医院渠道完成，而非直接软件销售。
