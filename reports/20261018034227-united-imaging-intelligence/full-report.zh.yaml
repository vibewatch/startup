        title: UII 以工作流广度和母集团分销实现差异化
        blocks:
          - type: paragraph
            body: >-
              UII 的差异化主要是覆盖广度：CT、MR、PET、X-ray、诊断、治疗规划、科研和医院运营均有涉及。产品包括肋骨骨折检测、肺栓塞分诊、CCTA、CT-FFR、钙化评分、PET 摄取分析和神经分诊；RSNA
              2024/2025 进一步强调基础模型、结构化报告智能体、医院管理智能体和工作流助手。据母集团关联分析师报告，AI 已全面采用到 United Imaging 产品线；2026
