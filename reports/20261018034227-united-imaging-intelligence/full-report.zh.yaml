chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 成立于 2017 年、总部在上海，是 United Imaging Group 旗下医疗 AI 子公司，而非独立硬件厂商。CMB International
              称临床赋能约占收入 60%–70%、科研工具约 20%、设备赋能约 10%；UII 的 AI 已覆盖母集团产品线。结合母集团 2024 年 CNY 2.26 billion
              研发投入，公司能获得资本、数据、分销和工程支持，但独立经济性与公平交易商业 traction 难以拆分。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO008
