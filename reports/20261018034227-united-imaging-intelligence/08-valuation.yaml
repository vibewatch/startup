  title: Price, not company quality, drives the holdback
  body: UII looks strategically relevant and technically credible, but public evidence still stops at product breadth plus a headline private mark. Until investors can test standalone economics and round terms, the rational posture is research-more rather than underwriting the last valuation as fair.
