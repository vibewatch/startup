- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What would change the view
  rows:
  - - UII shows real product breadth and a broad certification base across NMPA, CE, and FDA pathways.
    - thesis
    - Validate how much of the catalog is active, paid, and renewed at account level.
  - - United Imaging ecosystem support improves distribution reach and strategic resilience.
    - thesis
    - Confirm related-party pricing, IP ownership, and whether channel access is contractual or discretionary.
  - - The last round demonstrates outside-investor willingness to fund the asset at scale.
    - thesis
    - Reconcile the conflicting public records on round timing, participant mix, and post-money terms.
  - - Public sources do not disclose standalone revenue, gross margin, or retention, so the $1.4B mark cannot be tied to operating multiples.
    - anti-thesis
    - Obtain audited subsidiary financials or board-quality KPI packs covering revenue, margin, and cohort behavior.
  - - Related-party and state-linked capital appear material enough to blur the market-clearing signal of the round.
    - anti-thesis
    - Review the cap table, liquidation preferences, and any strategic rights granted to parent or affiliated investors.
  - - Commercialization risk remains high because market access cycles are long and incumbents can pressure pricing.
    - anti-thesis
    - Show multi-region paid deployments and proof that software monetization is not merely bundled with hardware placements.
  notes: Arguments are synthesized from retained sources and framed as diligence tests rather than stand-alone facts; each row names the specific evidence needed to move the recommendation.
