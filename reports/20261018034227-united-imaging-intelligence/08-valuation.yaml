- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Paid adoption proves sticky across the installed base, more approvals convert into reimbursable workflows, and strategic channels accelerate international rollout.
    - The prior $1.4B mark becomes supportable only if auditable evidence proves repeatable software economics rather than strategic scarcity.
    - Execution still depends on proving standalone margins and exportable regulatory conversion.
    - Requires audited KPI disclosure plus evidence that software monetization is independent of bundled hardware sales.
  - - Base
    - Product and regulatory breadth are real, but monetization remains partly bundled with parent equipment and round terms stay only partially visible.
    - No intrinsic-value range is supportable; require entry below the prior mark or milestone, preference, and information-right protection.
    - Investors may overpay for platform optionality before seeing revenue quality.
    - 'Fits the current evidence mix: real traction signals, unresolved economics, and conflicting financing records.'
  - - Bear
    - Deployment breadth does not translate into paid usage depth, approvals stay narrower by region than marketing implies, and the next round occurs in a weaker market.
    - A material reset below the prior mark is plausible, but public evidence does not support a precise downside floor.
    - Down-round risk rises if strategic insiders remain the primary source of capital.
    - Triggered by continued opacity on revenue, cap table, or customer conversion.
  notes: These are conditional decision rules anchored to the last disclosed private round, not forecasts. No numerical intrinsic-value range or probability is assigned because UII standalone financial and security-level inputs are absent.
