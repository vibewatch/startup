company:
  name: United Imaging Intelligence
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports that United Imaging Intelligence has real product breadth, regulatory traction, and strategic backing from the broader United Imaging ecosystem, but it does not support underwriting the last disclosed private mark with standalone operating metrics. The most defensible call is research-more with a stretched valuation stance until investors can test paid deployment depth, economics, and cap-table terms against the June/October 2025 financing record.
sections:
- id: investment-call-and-price-discipline
  title: Investment call and price discipline
  body: The chapter-level call is **research-more**, not because United Imaging Intelligence lacks evidence of product credibility, but because public valuation support stops at the last round headline. Multiples lists a $1.4 billion June 2025 Series A and $139 million raised, while FLCube corroborates the RMB 1 billion funding amount and investor interest. But neither source discloses standalone revenue, gross margin, retention, or paid-install conversion, and Preqin introduces timing and investor-list ambiguity by describing the same CNY 1 billion financing as October 2025 venture funding. That leaves investors with proof of financing and technical breadth, but not enough evidence to convert the round into a defendable operating multiple or target return at the current mark.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV013
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: financing-context-and-comparable-anchors
  title: Financing context and comparable anchors
  body: The financing record suggests a strategic round with meaningful ecosystem sponsorship rather than a clean, independently benchmarked market-clearing mark. Yicai reports that listed parent United Imaging Healthcare committed RMB 70 million for 0.70% new equity and would hold 0.9849% cumulatively after the capital increase, while United Imaging Group and Shanghai Lianhe also participated. Meanwhile, a Sina Finance analyst note frames UII's business mix as majority clinical-empowerment revenue with smaller research and equipment-enablement lines, and Multiples positions the company near $1.3 billion-$1.4 billion private/public AI-health comparables such as Viz and above several listed imaging-software peers on disclosed revenue multiples. Without UII standalone financials, those comps are directional sentiment anchors, not underwriting-grade valuation evidence.
  claimRefs:
  - CV001
  - CV004
  - CV005
  - CV006
  - CV013
  - CV014
  tableRefs:
  - TV002
- id: scenario-frame-and-downside-triggers
  title: Scenario frame and downside triggers
  body: 'The range should be read as decision bands around the last round, not a precision DCF. The bull case requires proof that UII can monetize its installed base and turn its product and clearance breadth into premium software economics; the base case assumes product quality is real but monetization remains partially bundled with the parent ecosystem; the bear case assumes the current mark gets de-rated because disclosures never catch up to price and market access remains slower than the company narrative implies. The downside is not theoretical: United Imaging''s annual report explicitly warns that overseas approval cycles are long and that GE Healthcare, Siemens Healthineers, and Philips can pressure share and pricing.'
  claimRefs:
  - CV007
  - CV008
  - CV010
  - CV011
  - CV012
  - CV013
  tableRefs:
  - TV003
- id: final-diligence-asks-and-thesis-breaks
  title: Final diligence asks and thesis-breaks
  body: 'The recommendation can move only if diligence closes three specific gaps: first, standalone revenue, gross margin, and paid-customer cohort data; second, cap-table and preference terms from the 2025 round, including any strategic or related-party protections; third, evidence on how much of UII''s adoption is independent software budget versus parent-hardware pull-through. If management proves conversion from broad deployment and regulatory breadth into repeatable software economics, the current mark may be defensible. If those disclosures remain private, or if commercialization is narrower than the product catalog suggests, the current valuation should be treated as stretched and vulnerable to a down-round or flat-round outcome.'
  claimRefs:
  - CV006
  - CV007
  - CV009
  - CV011
  - CV012
  - CV013
