  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow coverage is broad and clinically oriented
        blocks:
          - type: paragraph
            body: >-
              Public materials describe UII as the AI-focused subsidiary of the wider United Imaging group, with
              products aimed at screening, triage, image analysis, treatment planning, research, and hospital operations
              rather than a single narrow algorithm. The most concrete named products in the assigned pool are workflow
              tools: uAI EasyTriage-Rib and uAI Easy Triage ICH prioritize suspected critical findings for radiologists,
              while uAI Portal supports CT angiography review and preoperative analysis. Third-party profiles also
              describe a larger portfolio with more than 100 AI applications and a uAI Clinical Portal with more than 60
              applications, implying that UII's commercial pitch is a department- or hospital-level software layer
              embedded across multiple imaging modalities.
