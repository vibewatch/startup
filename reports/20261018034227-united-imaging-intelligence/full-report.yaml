  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The source set defines UII's market boundary as medical-imaging AI attached to diagnosis and treatment
              workflows, not a broad catch-all for hospital software. UII's own brochure says the company provides
              "total solutions to clinical workflow from screening and diagnosis to treatment and follow-up assessment,"
              while also enabling smart equipment and biomedical research. That means the included spend is
              imaging-adjacent software and workflow augmentation: embedded AI inside scanners, AI-assisted reading and
              reporting, research tooling, and operational quality-control layers around imaging. It excludes generic
              HIS/ERP software, payer analytics, consumer wellness apps, and non-imaging administrative systems unless
              they are explicitly tied back to imaging workflow. In practice, the main status-quo substitutes are manual
              radiologist workflows, modality-native vendor software, and conventional equipment upgrades without
              AI-enabled workflow layers rather than a single monolithic hospital-IT budget line.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
              - CM011
              - CM013
              - CM016
      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-layered. A sell-side note says UII's largest segment is Clinical Empowerment and
              that it is "primarily deployed in radiology departments," which points to radiology chairs,
              imaging-service-line leaders, and modality administrators as the closest day-one buyers. The brochure's
              quality-control workflow expands the aperture beyond a single department by describing a model in which a
              "main or tertiary hospital" supervises image quality across satellite and primary or secondary hospitals,
              implying regional-network administrators and centralized imaging-quality teams also matter. Research
              buyers are distinct again: UII and third-party materials both describe dedicated research portals and
              no-code development workflows aimed at academic and clinical-research users. Finally, adoption is not
              purely software-led; official U.S. launch materials say UII is meant to embed AI in United Imaging
              Healthcare's core software across modalities, so payer approval often sits inside capital-equipment, IT,
              and procurement processes rather than a stand-alone AI line item.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
              - CM011
              - CM013
              - CM015
          - type: table
            tableRef: TM003
