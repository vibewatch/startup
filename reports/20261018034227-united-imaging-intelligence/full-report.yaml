              - CO010
              - CO011
              - CO013
      - number: '1.2'
        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is thin. A 2020 United Imaging release identified Terrence Chen as CEO of UII
              America, while a current deal-data profile says Professor Shen Dinggang leads aspects of the subsidiary's
              data-driven algorithm and clinical-application work. Neither source establishes a complete current
              executive team, board roster, voting structure, or key-person succession plan. Capital evidence is more
              concrete but still database-led: Multiples reports a $139 million Series A in June 2025, led by E Fund and
              Shangguo Investment Management, at a $1.4 billion valuation. A separate December 2024 transaction report
              said United Imaging Healthcare would invest RMB 28.4872 million for 0.2849% after the capital increase
              against a RMB 9 billion pre-investment valuation. The different dates and transaction bases should not be
              treated as a valuation contradiction without the underlying cap tables.
