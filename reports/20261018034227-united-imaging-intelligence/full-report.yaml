  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is visible, but revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to three commercial lanes rather than a single pure-software model. A Sina-hosted
              analyst note attributes roughly 60-70% of business by revenue to clinical empowerment, about 20% to
              research empowerment, and about 10% to equipment empowerment. United Imaging's own account says the parent
              group's imaging products, cloud, and imaging centers provide both data and deployment channels, while
              Baidu describes UII as a strategic group subsidiary using shared software, hardware, and other resources.
              That architecture can improve distribution and product integration, but it also makes standalone revenue
              quality difficult to judge: no retained source separates third-party software sales from equipment
              bundling, parent-supported projects, implementation work, or other related-party activity.
            claimRefs:
