chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence was founded in 2017 and is headquartered in Shanghai. It operates as the
              medical-AI subsidiary within United Imaging Group rather than as a visibly independent hardware vendor.
              The disclosed product mix is broad: CMB International described clinical-empowerment software as roughly
              60%–70% of revenue, research tools as about 20%, and equipment-empowerment work as about 10%. That mix
              places the company across diagnostic workflow, clinical research, and embedded-device intelligence. CMB
              also reported that UII's AI had been adopted across United Imaging's product lines. Combined with the
              parent's CNY 2.26 billion of 2024 R&D spending, this suggests meaningful access to capital, data,
              distribution, and engineering infrastructure, but also makes standalone economics and arm's-length
              commercial traction difficult to isolate.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
