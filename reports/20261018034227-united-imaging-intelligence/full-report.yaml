      - number: '3.2'
        title: UII differentiates through workflow breadth and parent-linked distribution
        blocks:
          - type: paragraph
            body: >-
              UII's strongest source-backed differentiation is breadth. Third-party profiles and official releases
              consistently describe coverage across CT, MR, PET, X-ray, diagnosis, treatment planning, research, and
              hospital operations rather than a single-algorithm wedge. Health AI Register's product listings show
              disease- and modality-specific applications such as rib-fracture detection, pulmonary-embolism triage,
              CCTA, CT-FFR, calcium scoring, PET uptake analysis, and neuro triage, while UII's own RSNA 2024 and 2025
              materials move the narrative further toward foundation models, structured reporting agents,
              hospital-management agents, and workflow assistants. The more distinctive strategic advantage, however,
              appears to be channel leverage: a parent-linked analyst note says UII's AI applications were already fully
              adopted across United Imaging's product lines, and both the analyst note and a 2026 Yicai report frame UII
              as strengthening the hardware group's competitiveness in the high-end market.
