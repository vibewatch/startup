      - number: '4.2'
        title: Pricing and go-to-market economics remain private
        blocks:
          - type: paragraph
            body: >-
              The likely go-to-market advantage is access to United Imaging's equipment and hospital relationships
              rather than a disclosed standalone sales engine. The official founding interview presents parent devices,
              intelligent imaging cloud, and imaging centers as natural landing scenarios for UII algorithms, and the
              analyst note says AI applications had been adopted across the parent's product lines. Those facts support
              an equipment-attach and enterprise-deployment route, but they do not disclose contract units, list prices,
              realized prices, discounts, sales cycles, channel fees, or renewal terms. The retained sources therefore
              cannot establish whether UII earns recurring software revenue, project revenue, bundled hardware uplift,
              internal transfer revenue, or a mix of those mechanisms, and they cannot quantify CAC or payback.
