      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strategically plausible but not quantitatively underwritable from public evidence.
              Product breadth, hospital-deployment claims, patient-experience references, and parent-channel integration
              suggest real commercialization activity, yet none is a substitute for paid-customer, utilization,
              retention, or revenue disclosure. Reuters and its Yahoo syndication also report management's deliberate
              resistance to an aggressive AI rollout because the technology remained insufficiently mature; the
              duplicate syndication is one report, not independent corroboration. That caution may be appropriate in
              healthcare, but it weakens any unsupported assumption of rapid near-term monetization. The decisive
              diligence work is therefore private: reconcile reported segment mix to audited standalone revenue, isolate
              related-party economics, verify gross margin by stream, and test whether current cash and financing
              capacity cover the planned operating path.
            claimRefs:
              - CI007
              - CI009
              - CI010
