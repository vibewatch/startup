      - number: '4.3'
        title: Capital support is disclosed; adequacy and unit economics are not
        blocks:
          - type: paragraph
            body: >-
              The capital record demonstrates access to related-party support, not financial self-sufficiency. United
              Imaging said it invested $45 million to establish the AI subsidiary. Yicai later reported a planned RMB70
              million investment by United Imaging Healthcare for 0.70% post-transaction ownership, with its cumulative
              stake reaching 0.9849%; United Imaging Group and Shanghai Lianhe were also described as participants.
              These events show that UII can draw on strategically aligned capital, but the eight retained sources do
              not disclose current cash, accounting losses, operating cash burn, debt, guarantees, runway, or a
              next-round trigger. They also omit standalone revenue, ARR, gross margin, service-delivery cost, working
              capital, capex, and customer-acquisition economics, so funding raised cannot be treated as cash presently
              available.
