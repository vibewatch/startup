      - number: '1.3'
        title: Scale, milestones, and diligence read-through
        blocks:
          - type: paragraph
            body: >-
              Product breadth is better documented than commercial quality. CMB reported more than 100 medical-AI
              products by year-end 2024 and a regulatory portfolio spanning NMPA, CE, and FDA certifications.
              Company-issued releases then shifted the narrative toward multimodal AI agents at RSNA 2025 and a clinical
              portal with more than 60 applications at WHX 2026; those launches demonstrate roadmap activity, not
              adoption, pricing, or regulatory clearance in every geography. The strongest adverse financial evidence is
              older: a December 2024 report gave RMB 166 million of revenue and an RMB 82.9218 million net loss for the
              first nine months of 2024, after RMB 254 million of revenue and an RMB 136 million net loss in 2023.
              Current revenue, ARR, margins, cash, headcount, verified paid institutions, retention, and customer
              concentration therefore remain material diligence gaps despite visible product and financing milestones.
