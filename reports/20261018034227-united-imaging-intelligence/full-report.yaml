              - CU009
              - CU010
              - CU013
              - CU014
      - number: '6.3'
        title: Expansion logic is plausible; durability evidence is still missing
        blocks:
          - type: paragraph
            body: >-
              The available material points to an expansion story built around workflow depth. WHX 2026 described UII's
              uAI Clinical Portal as spanning more than 60 applications, and the named references extend from radiology
              into surgery, EMR, quality control, radiotherapy planning, and operational analytics. That looks like a
              land-and-expand motion inside hospital departments once an account is active. But public evidence stops
              short of the metrics investors usually need to underwrite durability: there is no disclosed NRR, GRR,
              churn, renewal schedule, contract length, or direct paid-site count in the retained sources. Even where
              the use cases sound production-like, the sources rarely quantify how many modules are actually licensed,
              how frequently they are used, or whether a first deployment turned into a broad software standard.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU013
      - number: '6.4'
        title: Customer concentration risk is less about one hospital and more about channel dependence
        blocks:
          - type: paragraph
            body: >-
              The primary concentration concern is not a single named customer but the commercial role of the parent
              ecosystem. UII is publicly framed as a group subsidiary whose software strengthens United Imaging's
              hardware and workflow proposition, and both Yicai and Multiples.vc surface parent-backed financing more
              readily than customer monetization. Reuters adds a useful caution signal: management said it was resisting
              an extreme AI rollout because the technology was still not mature enough for medicine. That does not imply
              weak demand, but it does imply a more measured commercialization curve than the conference-stage narrative
              alone might suggest. Until management discloses direct-vs-bundled sales mix, top-customer exposure, and
              renewal behavior, the prudent view is that UII's revenue durability is still partially opaque and likely
              intertwined with United Imaging's broader procurement relationships.
            claimRefs:
              - CU011
              - CU012
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Named institutional proof is strongest in China flagship hospitals and academic medicine
            body: >-
              Zhongshan and Renji are the best public signs of workflow-level deployment, while MGH gives UII an
              international research-validation reference.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: The missing retention stack is the central diligence gap
            body: >-
              Public sources still do not disclose churn, renewals, NRR, contract length, or module-level paid-site
              counts, so durability remains largely unproven.
            calloutType: risk
            claimRefs:
              - CU013
              - CU015
          - type: callout
            title: Distribution strength and concentration risk likely come from the same parent relationship
            body: >-
              UII's group positioning appears to accelerate hospital access, but it also obscures how much traction is
              standalone software demand versus parent-mediated channel pull.
            calloutType: insight
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk is not generic "AI uncertainty" but UII's own admission that clinical deployment
              should proceed cautiously because the technology can create harmful side effects and medicine does not
              reward reckless first-mover behavior. That caution matters because UII is simultaneously marketing a broad
              portfolio of agents, quality tools, and workflow software while public evidence still stops short of a
              module-level commercialization, clearance, and incident map. The next tier of risk comes from dependence
              on the United Imaging group for channels, hardware embedding, and data access, plus the absence of a
              public standalone revenue or margin base that would justify the last disclosed valuation. Working-capital,
              distributor-control, and overseas approval frictions are meaningful but look more monitorable than the
              model-safety and structural-dependence questions.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR011
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR010
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and model-safety risks
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal stack is material because UII's product surface is widening faster than the
              public evidence that each module is cleared, reimbursable, and safe in production workflows. Company
              materials now market multimodal reporting agents, hospital-management tooling, and a 60-plus-application
              platform, but the same RSNA disclosure explicitly says not every showcased AI application is CE-marked or
              FDA-cleared. The parent annual report also frames the group as exposed to approval barriers,
              intellectual-property disputes, and technical-secret leakage. That combination makes the legal question
              less about a single known case and more about whether UII has enough product-by-product evidence,
              post-market monitoring, and IP hygiene to scale without a regulatory or quality reset.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR016
      - number: '7.3'
        title: Operational and partner execution risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk is amplified by the fact that UII is not just selling a point algorithm; its public
              narrative spans scanner uptime, quality control, reporting workflows, and hospital operations. That
              breadth creates more surfaces where procurement delays, distributor mis-execution, receivables slippage,
              or workflow-quality failures can slow commercialization. The parent annual report's emphasis on supplier
              audits, safety stock, confidentiality controls, distributor training, and collections discipline is useful
              mitigation evidence, but it also reveals where management expects failure modes. Public proof of adoption
              still skews to marquee sites and demonstrations rather than disclosed renewal cohorts or incident
              statistics, so diligence should test whether flagship references generalize into reliable everyday
              deployment.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR009
              - CR013
      - number: '7.4'
        title: Group dependence, capital risk, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The structural investment risk is that UII still looks easier to understand as an AI-enablement arm inside
              United Imaging's broader equipment strategy than as a transparently standalone software company. Official
              and analyst materials repeatedly describe the business in group-synergy terms, while the one public
              valuation marker is a single June 2025 Series A at $1.4 billion with no disclosed standalone revenue,
              margin, or cash-generation bridge. That means the investment case breaks quickly if module-level approvals
              lag marketed breadth, if flagship hospital proofs fail to convert into durable paid cohorts, if group
              transfer-pricing or channel dependence limits standalone economics, or if collections and overseas market
              access stretch the next financing timeline harder than investors expect.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and price discipline
        blocks:
          - type: paragraph
            body: >-
              The chapter-level call is **research-more**, not because United Imaging Intelligence lacks evidence of
              product credibility, but because public valuation support stops at the last round headline. Multiples
              lists a $1.4 billion June 2025 Series A and $139 million raised, while FLCube corroborates the RMB 1
              billion funding amount and investor interest. But neither source discloses standalone revenue, gross
              margin, retention, or paid-install conversion, and Preqin introduces timing and investor-list ambiguity by
              describing the same CNY 1 billion financing as October 2025 venture funding. That leaves investors with
              proof of financing and technical breadth, but not enough evidence to convert the round into a defendable
              operating multiple or target return at the current mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Financing context and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The financing record suggests a strategic round with meaningful ecosystem sponsorship rather than a clean,
              independently benchmarked market-clearing mark. Yicai reports that listed parent United Imaging Healthcare
              committed RMB 70 million for 0.70% new equity and would hold 0.9849% cumulatively after the capital
              increase, while United Imaging Group and Shanghai Lianhe also participated. Meanwhile, a Sina Finance
              analyst note frames UII's business mix as majority clinical-empowerment revenue with smaller research and
              equipment-enablement lines, and Multiples positions the company near $1.3 billion-$1.4 billion
              private/public AI-health comparables such as Viz and above several listed imaging-software peers on
              disclosed revenue multiples. Without UII standalone financials, those comps are directional sentiment
              anchors, not underwriting-grade valuation evidence.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario frame and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The range should be read as decision bands around the last round, not a precision DCF. The bull case
              requires proof that UII can monetize its installed base and turn its product and clearance breadth into
              premium software economics; the base case assumes product quality is real but monetization remains
              partially bundled with the parent ecosystem; the bear case assumes the current mark gets de-rated because
              disclosures never catch up to price and market access remains slower than the company narrative implies.
              The downside is not theoretical: United Imaging's annual report explicitly warns that overseas approval
              cycles are long and that GE Healthcare, Siemens Healthineers, and Philips can pressure share and pricing.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The recommendation can move only if diligence closes three specific gaps: first, standalone revenue, gross
              margin, and paid-customer cohort data; second, cap-table and preference terms from the 2025 round,
              including any strategic or related-party protections; third, evidence on how much of UII's adoption is
              independent software budget versus parent-hardware pull-through. If management proves conversion from
              broad deployment and regulatory breadth into repeatable software economics, the current mark may be
              defensible. If those disclosures remain private, or if commercialization is narrower than the product
              catalog suggests, the current valuation should be treated as stretched and vulnerable to a down-round or
              flat-round outcome.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price, not company quality, drives the holdback
            body: >-
              UII looks strategically relevant and technically credible, but public evidence still stops at product
              breadth plus a headline private mark. Until investors can test standalone economics and round terms, the
              rational posture is research-more rather than underwriting the last valuation as fair.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV013
