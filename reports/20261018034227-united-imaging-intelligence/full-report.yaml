  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments run through three channels, with the parent ecosystem still central
        blocks:
          - type: paragraph
            body: >-
              The clearest public segmentation comes from an analyst note that splits UII into clinical empowerment,
              research empowerment, and equipment empowerment. That framing matters because it implies three different
              buying centers: hospital radiology and treatment departments, academic or clinician-research users, and
              the United Imaging installed base that can absorb AI into scanners and workflow products. The official FAQ
              is directionally consistent, describing UII as an AI-driven decision-support subsidiary that advances the
              group's AI initiatives. Taken together, the evidence suggests UII is not a pure standalone SaaS vendor; a
              meaningful part of customer access and deployment appears to be mediated through the broader United
              Imaging equipment and hospital channel rather than direct software-only sales.
            claimRefs:
