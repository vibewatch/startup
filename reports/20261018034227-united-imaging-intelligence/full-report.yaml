      - number: '3.3'
        title: Moat durability is plausible but not independently benchmarked
        blocks:
          - type: paragraph
            body: >-
              The moat case in the assigned pool is therefore plausible but incomplete. UII can point to product
              breadth, regulatory clearances, academic collaborations, and the ability to bundle AI into United Imaging
              hardware and hospital workflows. What the chapter cannot verify from the assigned evidence is whether
              those strengths convert into superior standalone software pricing, higher win rates, lower churn, or
              better clinical outcomes than direct specialists or incumbent alternatives. That means the current
              evidence supports a channel-and-scope advantage, but not a fully underwritten claim that UII has already
              locked in durable competitive superiority.
