      - number: '2.3'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a clean dollar TAM, SAM, or SOM for UII on a stand-alone basis, but it
              does provide several operational sizing lenses. The strongest hard numbers are supply-side and deployment
              proxies: the brochure says UII has more than 40 AI technologies and 50-plus AI-assisted applications,
              while the analyst note says UII had launched more than 100 medical AI products by the end of 2024 with 12
              NMPA Class III, 21 NMPA Class II, 13 CE, and 15 FDA certifications. A lower-confidence third-party profile
              adds a broader footprint proxy by claiming more than 100 AI applications across more than 3,000 hospitals
              globally, but that figure is explicitly AI-generated and not corroborated elsewhere in this pool. Taken
              together, these sources support a conclusion that the addressable market is broad across modalities and
              workflows, but they still do not let an investor isolate UII's paid institution count, monetized software
              attach rate, or stand-alone revenue base.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM014
              - CM016
