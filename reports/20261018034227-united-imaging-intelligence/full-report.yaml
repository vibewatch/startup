  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence supports strategic quality, but the price signal outruns the public economics.
    data:
      nodes:
        - id: scale
          label: Product and approval breadth
          detail: 100+ products by end-2024 and expanding multi-jurisdiction clearances.
        - id: validation
          label: Clinical and technical proof
          detail: External collaboration history and company-claimed reporting-agent performance suggest real capability.
        - id: financing
          label: Last round exists
          detail: Public databases and coverage point to a 2025 ~$139M / RMB1B financing with a $1.4B mark.
        - id: structure
          label: Round structure is blurry
          detail: Public records disagree on timing and indicate meaningful related-party participation.
        - id: economics
          label: Standalone economics remain opaque
          detail: No public revenue, margin, retention, or cap-table terms support a hard operating multiple.
        - id: recommendation
          label: Research-more / stretched
          detail: Wait for auditable KPIs or materially better entry terms before underwriting upside.
      edges:
        - from: scale
          to: validation
          context: Quality signals
        - from: validation
          to: financing
          context: Supports fundability
        - from: financing
          to: structure
          context: But round signal is not clean
        - from: structure
          to: economics
          context: Missing terms and metrics
        - from: economics
          to: recommendation
          context: Prevents conviction at price
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
