      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand timing appears linked to both imaging-capex cycles and workflow pressure inside hospitals. United
              Imaging Healthcare's 2025 annual report says China's large-scale medical-equipment renewal policy released
              demand for high-end imaging, radiotherapy, and primary-level diagnostic capacity building, and the analyst
              note extends that thesis by arguing that increasing AI adoption in clinical practice strengthens the
              "Equipment + AI" model. Product-roadmap sources reinforce that expansion vector: the RSNA 2025 release
              moves from point algorithms toward reporting agents, hospital-management agents, and wider care-pathway
              automation, while WHX 2026 materials add portals for research, quality control, and equipment-operations
              insight. The constraint is that public evidence still stops short of monetization clarity. UII's
              addressable opportunity may be large in workflow terms, but without disclosed pricing, paid-site counts,
              or software revenue segmentation, valuation still rests on adoption potential rather than demonstrated
              market capture.
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial wedge is attached to imaging infrastructure
            body: >-
              The evidence points to an "equipment plus workflow AI" market entry rather than a pure stand-alone
              software motion. That matters because installed-base access and renewal cycles can accelerate adoption,
              but they also tie software upside to capital-equipment timing.
            calloutType: insight
            claimRefs:
              - CM004
              - CM011
              - CM015
          - type: callout
            title: Public TAM remains proxy-based
            body: >-
              Product counts, certification counts, and deployment claims show breadth, but they are not a substitute
              for disclosed pricing, paid penetration, or software revenue by product family. Until those numbers
              surface, any SAM or SOM framing remains indicative rather than underwritten.
            calloutType: risk
            claimRefs:
              - CM006
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is fragmented across specialists, substitutes, and the status quo
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not surface one dominant software rival that cleanly benchmarks against UII on
              every dimension. Instead, independent directories point to multiple clusters: Dealroom's closest matches
              include Pixyl, Quibim, Nucs AI, and Radiobotics, while IntuitionLabs lists MaxQ AI, JLK, Neurocareai, and
              Heuron as competitors. That pattern matters because it suggests buyers can assemble alternatives from
              focused imaging-AI tools rather than facing only one like-for-like platform rival. The same evidence also
              implies that status-quo manual radiology workflows and internal hospital development remain substitutes,
              because UII markets automation across reporting, research, and quality-control tasks that otherwise stay
              inside provider workflows.
            claimRefs:
