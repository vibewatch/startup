      - number: '6.2'
        title: Adoption proof exists, but breadth claims still outpace audited operating detail
        blocks:
          - type: paragraph
            body: >-
              UII has credible evidence of real-world use, but the proof is uneven. The strongest items are named
              institutional references: Massachusetts General Hospital for joint AI research, Zhongshan Hospital for
              multi-scenario AI agents, and Renji Hospital for an AI-enabled radiotherapy workflow. A separate analyst
              note says UII had over 100 medical AI products and multiple regulatory clearances by the end of 2024,
              while a third-party directory says the company had deployed over 100 AI applications across more than
              3,000 hospitals. That supports commercial breadth, but not an audited live-customer denominator. Public
              evidence shows deployment and workflow embedding, yet it still leaves the classic diligence question
              unanswered: how many institutions are paying, active, and expanding rather than piloting or co-developing.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
