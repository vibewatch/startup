  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Eight dated milestones trace formation, research collaboration, financing, product scale, and the shift toward
      medical-AI agents.
    data:
      items:
        - date: '2017'
          label: Company founded
          detail: Independent profiles date United Imaging Intelligence's formation to 2017.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2020-09-08'
          label: MGH research collaboration announced
          detail: >-
            Boston and Shanghai AI teams began a COVID-19 imaging research collaboration with Massachusetts General
            Hospital.
          tone: positive
          claimRefs:
            - CO009
        - date: 2024 Q1-Q3
          label: Standalone loss remained material
          detail: A transaction report cited RMB 166 million revenue and an RMB 82.9218 million net loss.
          tone: negative
          claimRefs:
            - CO013
        - date: '2024-12-21'
          label: Parent capital increase disclosed
          detail: United Imaging Healthcare planned RMB 28.4872 million for 0.2849% after the increase.
          tone: neutral
          claimRefs:
            - CO012
        - date: '2025-02-24'
          label: Product and certification scale profiled
          detail: CMB reported more than 100 products and certifications across NMPA, CE, and FDA regimes.
          tone: positive
          claimRefs:
            - CO006
            - CO007
        - date: 2025-06
          label: Series A completed
          detail: Multiples reports $139 million raised at a $1.4 billion valuation.
          tone: positive
          claimRefs:
            - CO010
            - CO011
        - date: '2025-12-12'
