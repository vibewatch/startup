      - number: '5.3'
        title: Maturity is uneven across cleared workflow tools and agent roadmap items
        blocks:
          - type: paragraph
            body: >-
              The most mature surfaces are the named, regulator-linked products that show up in independent directories:
              UII's rib-fracture triage tool, intracranial-hemorrhage triage tool, and uAI Portal all have explicit
              FDA-linked entries. Physician AI Tools separately estimates 15 cleared products, but the assigned pool
              does not include a regulator-issued portfolio register that verifies that aggregate. By contrast, the
              newest roadmap items are agentic and multimodal: UII's RSNA 2025 materials position uAI Insight, uAI
              Avatar, and hospital-management agents as the next step from task automation toward human-AI
              collaboration. That roadmap is credible as a direction of travel, but it is not the same thing as broad
              clinical availability.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Technical proof exists, but security and implementation diligence remain open
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does contain evidence of external technical validation: the company disclosed a
              Massachusetts General Hospital collaboration that used experience from thousands of patients outside the
              U.S. to build COVID-era imaging algorithms, which is stronger proof than a generic customer-logo page.
              Group-level trust controls are also visible through the parent annual report's ISO 27001, ISO 27701, and
              ISO 27017 certifications plus a NIST CSF 2.0 assessment at United Imaging America. Even so, the
              product-tech diligence file is incomplete. The RSNA release explicitly warns that not all showcased AI
              applications are cleared or available in every country, the assigned pool does not expose a standalone UII
              trust center or status page, and the parent disclosed long acceptance cycles for software projects, which
              is a reminder that deployment friction may matter as much as model quality.
            claimRefs:
