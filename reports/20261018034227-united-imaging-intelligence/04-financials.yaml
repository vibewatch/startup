      - ["Gross margin and service-delivery cost", null, "Low", "Software, implementation, compute, support, and equipment-bundle economics may differ materially", "Request gross-margin bridge by stream, including compute, implementation, support, and channel costs"]
      - ["CAC, sales cycle, and payback", null, "Low", "Parent distribution may lower acquisition cost, but public evidence does not quantify the benefit", "Request funnel conversion, sales expense, cycle length, attach rate, and payback by channel"]
      - ["Cash, burn, runway, debt, and next-round trigger", null, "Low", "Historical funding access does not reveal present liquidity or financing dependency", "Request current balance sheet, monthly cash burn, debt and guarantees, approved budget, and financing plan"]
    notes: Null means unavailable in the eight retained chapter sources; founding investment and later capital participation are financing events, not measures of current cash or runway.
