figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a parent-enabled route from capital and shared assets to three commercial lanes, but the bridge stops before audited standalone revenue and gross profit.
    data:
      nodes:
        - id: capital-support
          label: Parent and related-party capital
          value: "$45M founding investment; later RMB70M planned UIH participation"
          note: Financing events show access to aligned capital, not current liquidity.
        - id: shared-assets
          label: Group data and deployment assets
          value: "Imaging products, cloud, imaging centers, software, and hardware resources"
          note: Official and third-party sources describe these as UII inputs and channels.
        - id: ai-portfolio
          label: Medical AI portfolio
          value: "More than 100 products or applications reported"
          note: Counts vary by source framing and do not establish paid use.
        - id: commercial-lanes
          label: Three reported commercial lanes
          value: "Clinical 60-70%; research about 20%; equipment about 10%"
          note: Approximate end-2024 mix from one analyst note.
        - id: customer-activity
          label: Hospital and equipment deployment
          value: "Deployment breadth reported; paid usage and retention unavailable"
          note: Company and low-tier profile evidence provide activity proxies, not audited revenue.
        - id: financial-output
          label: Standalone financial output
          value: "Revenue, gross margin, cash burn, and runway undisclosed"
          note: Private records are required to complete the bridge.
      edges:
        - from: capital-support
          to: shared-assets
          label: funds and supports
        - from: shared-assets
          to: ai-portfolio
          label: supplies data, infrastructure, and channels
        - from: ai-portfolio
          to: commercial-lanes
          label: organized into
        - from: commercial-lanes
          to: customer-activity
          label: deployed through
        - from: customer-activity
          to: financial-output
          label: public evidence does not quantify conversion into
    approximationNotes: Segment shares are approximate and single-source; deployment indicators are not treated as paid-customer, revenue, or margin figures.
    claimRefs:
