    title: The public record does not support a standalone financial model
    body: Funding events, product counts, and deployment claims cannot substitute for revenue recognition, realized pricing, gross margin, cash burn, or runway. Underwriting requires company records and related-party agreements.
    claimRefs:
      - CI013
      - CI014
      - CI015
