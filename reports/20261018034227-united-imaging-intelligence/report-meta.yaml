companyProfile:
  summary: >-
    United Imaging Intelligence is a Shanghai-based medical-imaging AI subsidiary founded in 2017 whose distribution,
    product integration, and research capacity are closely tied to United Imaging Group. Public evidence supports a June
    2025 $139 million Series A at a reported $1.4 billion valuation, but current standalone revenue, ARR, headcount,
    paid-customer count, cap table, and board composition remain unavailable.
  headquarters: Shanghai, China
  productSummary: >-
    Medical-imaging AI software spanning diagnostic workflow, clinical research, and equipment-embedded intelligence
    across United Imaging's product lines.
