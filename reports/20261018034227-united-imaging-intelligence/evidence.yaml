evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current standalone revenue, ARR, margin, cash, headcount, paid-customer count, retention, and
      customer-concentration records.
    whyItMatters: >-
      Without current standalone operating metrics, financing value and parent-backed product scale cannot be translated
      into software quality or capital efficiency.
    diligencePath: >-
      Request audited standalone statements, monthly ARR bridge, cash ledger, payroll roster, paid-site export,
      retention cohorts, and top-customer schedule.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A current executive roster, board composition, reporting lines, founder status, succession coverage, and
      departures since 2020.
    whyItMatters: >-
      The available named leaders do not establish who controls technical, commercial, regulatory, and financial
      execution today.
    diligencePath: >-
      Obtain the current organization chart, board minutes and appointment records, employment histories, and departure
      log.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      The full post-Series-A cap table, security terms, investor rights, related-party agreements, and current ownership
      percentages.
    whyItMatters: >-
      Ownership and related-party terms determine control, economic leakage, governance protections, and the
      interpretation of the reported valuation.
    diligencePath: >-
      Request the financing documents, shareholder register, articles, side letters, board-observer rights, and
      parent-service agreements.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent or company-disclosed stand-alone software revenue, pricing, and addressable-customer segmentation for
      UII by product family or geography.
    whyItMatters: >-
      Without these numbers, valuation has to rely on portfolio breadth and deployment proxies instead of underwritten
      TAM, SAM, or SOM economics.
    diligencePath: >-
      Request a revenue bridge by segment, geography, and monetization model from management or investors and reconcile
      it to disclosed parent-company filings.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: >-
      Named budget owners, contract structure, ASPs, and whether UII is sold as bundled scanner software, stand-alone
      subscriptions, or project-based deployments.
    whyItMatters: >-
      Buyer and payer logic affects sales-cycle length, gross-margin structure, and the repeatability of expansion
      revenue.
    diligencePath: >-
      Obtain sample proposals, procurement documents, or customer contracts that separate capital-equipment, service,
      and AI-software economics.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: deployment-footprint
    missingEvidence: >-
      An official and current disclosure of paid institutions, active deployments, and usage depth that either confirms
      or replaces the low-confidence third-party 3,000-hospital claim.
    whyItMatters: Footprint quality matters more than raw product count for assessing commercial penetration and software attach.
    diligencePath: >-
      Ask for cohort data on paid institutions, live applications per site, and retention or expansion behavior by
      region.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: regulatory-availability
    missingEvidence: >-
      A current region-by-region product availability map showing which showcased AI agents and portals are commercially
      available, cleared, piloting, or only demonstrated.
    whyItMatters: >-
      Roadmap breadth can overstate near-term market capture if high-profile products are not yet cleared or saleable in
      key geographies.
    diligencePath: >-
      Build a SKU-by-geography regulatory matrix from management disclosures, customer references, and local regulatory
      records before underwriting international expansion.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Standalone price cards, module packaging, realized pricing, discounting, and contract duration for UII and
      comparable rivals.
    whyItMatters: >-
      Without transaction-level commercial evidence, the chapter cannot test whether UII's product breadth converts into
      pricing power or lower competitive pressure.
    diligencePath: >-
      Request customer contracts, sales decks, procurement records, and side-by-side commercial proposals covering UII
      and shortlisted alternatives.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: head-to-head-proof
    missingEvidence: >-
      Independent win-loss data, benchmark studies, or customer references comparing UII directly against specialist
      imaging-AI vendors and incumbent alternatives.
    whyItMatters: >-
      The current moat case relies on scope and channel clues rather than proof that buyers choose UII over named rivals
