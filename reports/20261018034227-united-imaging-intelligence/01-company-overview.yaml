company:
  name: United Imaging Intelligence
chapter:
  number: 1
  title: Company Overview
  summary: United Imaging Intelligence is a Shanghai-based medical-imaging AI subsidiary founded in 2017 whose distribution, product integration, and research capacity are closely tied to United Imaging Group. Public evidence supports a June 2025 $139 million Series A at a reported $1.4 billion valuation, but current standalone revenue, ARR, headcount, paid-customer count, cap table, and board composition remain unavailable.
sections:
- id: identity-and-operating-model
  title: Identity and operating model
  body: 'United Imaging Intelligence was founded in 2017 and is headquartered in Shanghai. It operates as the medical-AI subsidiary within United Imaging Group rather than as a visibly independent hardware vendor. The disclosed product mix is broad: CMB International described clinical-empowerment software as roughly 60%–70% of revenue, research tools as about 20%, and equipment-empowerment work as about 10%. That mix places the company across diagnostic workflow, clinical research, and embedded-device intelligence. CMB also reported that UII''s AI had been adopted across United Imaging''s product lines. Combined with the parent''s CNY 2.26 billion of 2024 R&D spending, this suggests meaningful access to capital, data, distribution, and engineering infrastructure, but also makes standalone economics and arm''s-length commercial traction difficult to isolate.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO008
  tableRefs:
  - TO001
- id: leadership-capital-and-governance
  title: Leadership, capital, and governance
  body: 'Public leadership evidence is thin. A 2020 United Imaging release identified Terrence Chen as CEO of UII America, while a current deal-data profile says Professor Shen Dinggang leads aspects of the subsidiary''s data-driven algorithm and clinical-application work. Neither source establishes a complete current executive team, board roster, voting structure, or key-person succession plan. Capital evidence is more concrete but still database-led: Multiples reports a $139 million Series A in June 2025, led by E Fund and Shangguo Investment Management, at a $1.4 billion valuation. A separate December 2024 transaction report said United Imaging Healthcare would invest RMB 28.4872 million for 0.2849% after the capital increase against a RMB 9 billion pre-investment valuation. The different dates and transaction bases should not be treated as a valuation contradiction without the underlying cap tables.'
  claimRefs:
  - CO004
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
  - TO003
- id: scale-milestones-and-diligence-readthrough
  title: Scale, milestones, and diligence read-through
  body: 'Product breadth is better documented than commercial quality. CMB reported more than 100 medical-AI products by year-end 2024 and a regulatory portfolio spanning NMPA, CE, and FDA certifications. Company-issued releases then shifted the narrative toward multimodal AI agents at RSNA 2025 and a clinical portal with more than 60 applications at WHX 2026; those launches demonstrate roadmap activity, not adoption, pricing, or regulatory clearance in every geography. The strongest adverse financial evidence is older: a December 2024 report gave RMB 166 million of revenue and an RMB 82.9218 million net loss for the first nine months of 2024, after RMB 254 million of revenue and an RMB 136 million net loss in 2023. Current revenue, ARR, margins, cash, headcount, verified paid institutions, retention, and customer concentration therefore remain material diligence gaps despite visible product and financing milestones.'
  claimRefs:
  - CO006
  - CO007
  - CO013
  - CO014
  - CO015
  - CO016
  figureRefs:
  - FO001
