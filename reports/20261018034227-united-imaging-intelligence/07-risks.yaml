  - - IP infringement or technical-secret leakage
    - Parent annual report explicitly warns that leakage of key core technologies would hurt R&D effectiveness and profitability.
    - Medium
    - Medium-high
    - Patent layout, confidentiality agreements, and formal IP protection system.
    - Embedded model, data, and workflow know-how remain hard to defend if control fails.
    - Request patent map, prior disputes, employee exit controls, and partner IP terms.
