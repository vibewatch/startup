  rows:
  - - Premature generative-AI rollout into clinical workflows
    - High
    - High
    - Medium; management is deliberately slowing rollout and explicitly rejecting "extreme" adoption pressure.
    - Diagnostic or workflow errors would land in high-stakes care settings.
    - Need module-level QA thresholds, override rules, and post-market incident rates.
  - - Workflow-quality and uptime dependence across reporting and scanner operations
    - Medium
    - High
    - Medium; UII markets uQP, hospital-management tooling, and uMetaGenesis as quality-control and uptime mitigants.
    - Public evidence does not quantify uptime, false-alert rates, or operational savings.
    - Request SLA history, downtime logs, and quality-control outcome baselines by site.
  - - Distributor and channel-control failure
    - Medium
    - Medium-high
    - Medium-high; the parent cites a distributor management system, sales training, compliance guidance, and annual assessments.
    - Distribution intensity still leaves growth exposed to compliance and collection failures.
    - Review distributor concentration, churn, collections history, and enforcement incidents.
  - - Receivables and procurement-cycle slippage
    - Medium
    - Medium-high
    - Medium; management describes credit review, collections supervision, supplier audits, safety stock, and confidentiality controls.
    - Hospital budget timing and customer credit deterioration remain external constraints.
    - Request subsidiary AR aging, DSO, inventory turns, and backlog conversion by region.
  notes: Security-specific public incident evidence was not present in the assigned pool, so this table captures the operational controls and exposed failure surfaces the sources do reveal.
