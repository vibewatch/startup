    title: "Feature / capability comparison from assigned evidence"
    columns:
      - "Buying criterion"
      - "UII"
      - "Specialist imaging-AI peers"
      - "Status quo / internal build"
      - "Implication"
    rows:
      - ["Workflow breadth", "Source-backed coverage across CT, MR, PET, X-ray, diagnosis, treatment planning, research, and hospital operations", "Assigned sources list peer names but do not show equivalent breadth", "Typically limited to existing local workflow scope", "UII's breadth is the clearest disclosed differentiator"]
      - ["Disease / modality depth", "Health AI Register lists multiple modality-specific applications including rib fracture, PE triage, CCTA, CT-FFR, PET, and neuro triage", "Some peers likely have deep point-solution focus, but the assigned pool does not document it consistently", "Depth depends on local clinician and data-science resources", "UII appears broad; peer specialization may still win narrow workflows"]
