      - ["Software-only imaging-AI peers", "Pixyl, Quibim, Nucs AI, Radiobotics (Dealroom)", "Startup-style peer set; no common funding or revenue detail for direct comparison in the assigned pool", "Radiology teams seeking focused imaging-AI tools", "More focused software positioning than UII's full-workflow narrative", "Peer depth in the assigned pool is shallow and not head-to-head"]
      - ["Triage / diagnostic AI peers", "MaxQ AI, JLK, Neurocareai, Heuron (IntuitionLabs)", "Competitor names only in an AI-generated directory profile", "Buyers comparing targeted diagnostic algorithms", "Likely narrower disease- or task-level competition", "Assigned evidence does not provide product, pricing, or customer depth for these rivals"]
      - ["Status quo and internal build", "Manual reporting, local hospital AI projects, workflow-specific tools", "Existing provider labor and hospital IT budgets rather than vendor funding", "Providers keeping more work inside clinical and research teams", "No new vendor approval needed; can absorb narrow use cases without a platform purchase", "Substitute class is inferred from the workflow steps UII is automating rather than named vendor disclosures"]
    notes: "Rows mix named peers and substitute classes because the assigned pool surfaces fragmented competitor sets rather than one complete vendor census. Unknowns are preserved instead of guessed."
