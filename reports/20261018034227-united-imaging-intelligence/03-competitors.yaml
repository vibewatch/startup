      - ["Workflow-agent roadmap", "RSNA 2024/2025 materials describe foundation models, reporting agents, hospital-management agents, and workflow assistants", "No equivalent roadmap detail appears in the assigned peer listings", "Manual or bespoke tools can cover pieces of the workflow without a unified agent layer", "UII is trying to move competition from point tools toward platform control"]
      - ["Distribution leverage", "Parent-installed-base and equipment-bundling evidence is explicit", "No equivalent channel advantage is documented in the assigned peer sources", "Hospitals control internal prioritization but scale locally", "UII's strongest moat claim is channel leverage, not transparent commercial proof"]
