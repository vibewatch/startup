      - ["Packaging", "Evidence points to platform modules, workflow portals, and parent hardware integration rather than a simple self-serve SKU", "Peer evidence is limited to names or narrower application examples", "Bundling and solution scope likely matter more than sticker price"]
      - ["Go-to-market proof", "Official releases emphasize RSNA launches, academic collaboration, and parent-market integration", "Assigned pool does not provide comparable GTM detail for listed peers", "UII likely sells through enterprise references and channel leverage"]
      - ["Switching-cost proof", "No public retention, renewal, attach-rate, or module-penetration metrics are disclosed in the assigned sources", "No peer-side switching-cost metrics are disclosed either", "Moat durability remains under-evidenced despite plausible product breadth"]
    notes: "This table preserves an evidence gap instead of manufacturing a pricing comparison. Commercial conclusions should be read as packaging clues, not verified contract economics."
    claimRefs: ["CP005", "CP011", "CP012", "CP013"]
