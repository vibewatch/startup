  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Independent or company-disclosed stand-alone software revenue, pricing, and addressable-customer segmentation for UII by product family or geography.
      whyItMatters: Without these numbers, valuation has to rely on portfolio breadth and deployment proxies instead of underwritten TAM, SAM, or SOM economics.
      diligencePath: Request a revenue bridge by segment, geography, and monetization model from management or investors and reconcile it to disclosed parent-company filings.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-budgets
      missingEvidence: Named budget owners, contract structure, ASPs, and whether UII is sold as bundled scanner software, stand-alone subscriptions, or project-based deployments.
      whyItMatters: Buyer and payer logic affects sales-cycle length, gross-margin structure, and the repeatability of expansion revenue.
      diligencePath: Obtain sample proposals, procurement documents, or customer contracts that separate capital-equipment, service, and AI-software economics.
      relatedQuestionRefs: [QM004, QM007]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: deployment-footprint
      missingEvidence: An official and current disclosure of paid institutions, active deployments, and usage depth that either confirms or replaces the low-confidence third-party 3,000-hospital claim.
      whyItMatters: Footprint quality matters more than raw product count for assessing commercial penetration and software attach.
      diligencePath: Ask for cohort data on paid institutions, live applications per site, and retention or expansion behavior by region.
      relatedQuestionRefs: [QM005, QM007]
      relatedTableRefs: [TM002]
    - type: stale
      severity: material
      topic: regulatory-availability
      missingEvidence: A current region-by-region product availability map showing which showcased AI agents and portals are commercially available, cleared, piloting, or only demonstrated.
      whyItMatters: Roadmap breadth can overstate near-term market capture if high-profile products are not yet cleared or saleable in key geographies.
      diligencePath: Build a SKU-by-geography regulatory matrix from management disclosures, customer references, and local regulatory records before underwriting international expansion.
      relatedQuestionRefs: [QM007, QM008]
