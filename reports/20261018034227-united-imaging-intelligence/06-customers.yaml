company:
  name: "United Imaging Intelligence"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence supports real usage with flagship hospitals and academic centers,
    but it does not support a clean read on paid-site count, retention, or standalone
    customer economics. The strongest proof is named workflow deployment at Zhongshan
    and Renji plus a documented MGH collaboration; the weakest link is that most
    evidence remains company-issued or financing-led rather than independent renewal data.
sections:
  - id: "customer-segments"
    title: "Customer segments run through three channels, with the parent ecosystem still central"
    body: >-
      The clearest public segmentation comes from an analyst note that splits UII into
      clinical empowerment, research empowerment, and equipment empowerment. That framing
      matters because it implies three different buying centers: hospital radiology and
      treatment departments, academic or clinician-research users, and the United Imaging
      installed base that can absorb AI into scanners and workflow products. The official
      FAQ is directionally consistent, describing UII as an AI-driven decision-support
      subsidiary that advances the group's AI initiatives. Taken together, the evidence
      suggests UII is not a pure standalone SaaS vendor; a meaningful part of customer
      access and deployment appears to be mediated through the broader United Imaging
      equipment and hospital channel rather than direct software-only sales.
    claimRefs: ["CU001", "CU002", "CU003", "CU012", "CU016"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-proof"
    title: "Adoption proof exists, but breadth claims still outpace audited operating detail"
    body: >-
      UII has credible evidence of real-world use, but the proof is uneven. The strongest
      items are named institutional references: Massachusetts General Hospital for joint
      AI research, Zhongshan Hospital for multi-scenario AI agents, and Renji Hospital
      for an AI-enabled radiotherapy workflow. A separate analyst note says UII had over
      100 medical AI products and multiple regulatory clearances by the end of 2024,
      while a third-party directory says the company had deployed over 100 AI applications
      across more than 3,000 hospitals. That supports commercial breadth, but not an
      audited live-customer denominator. Public evidence shows deployment and workflow
      embedding, yet it still leaves the classic diligence question unanswered: how many
      institutions are paying, active, and expanding rather than piloting or co-developing.
    claimRefs: ["CU004", "CU005", "CU006", "CU007", "CU008", "CU010", "CU014"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion"
    title: "Expansion logic is plausible; durability evidence is still missing"
    body: >-
      The available material points to an expansion story built around workflow depth.
      WHX 2026 described UII's uAI Clinical Portal as spanning more than 60 applications,
      and the named references extend from radiology into surgery, EMR, quality control,
      radiotherapy planning, and operational analytics. That looks like a land-and-expand
      motion inside hospital departments once an account is active. But public evidence
      stops short of the metrics investors usually need to underwrite durability: there
      is no disclosed NRR, GRR, churn, renewal schedule, contract length, or direct
      paid-site count in the retained sources. Even where the use cases sound production-like,
      the sources rarely quantify how many modules are actually licensed, how frequently
      they are used, or whether a first deployment turned into a broad software standard.
    claimRefs: ["CU007", "CU008", "CU009", "CU010", "CU013"]
  - id: "concentration-risk"
    title: "Customer concentration risk is less about one hospital and more about channel dependence"
    body: >-
      The primary concentration concern is not a single named customer but the commercial
      role of the parent ecosystem. UII is publicly framed as a group subsidiary whose
      software strengthens United Imaging's hardware and workflow proposition, and both
      Yicai and Multiples.vc surface parent-backed financing more readily than customer
      monetization. Reuters adds a useful caution signal: management said it was resisting
      an extreme AI rollout because the technology was still not mature enough for medicine.
      That does not imply weak demand, but it does imply a more measured commercialization
      curve than the conference-stage narrative alone might suggest. Until management
      discloses direct-vs-bundled sales mix, top-customer exposure, and renewal behavior,
      the prudent view is that UII's revenue durability is still partially opaque and
      likely intertwined with United Imaging's broader procurement relationships.
    claimRefs: ["CU011", "CU012", "CU015", "CU016"]
