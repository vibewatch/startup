callouts:
  - calloutType: "strength"
    title: "Named institutional proof is strongest in China flagship hospitals and academic medicine"
    body: >-
      Zhongshan and Renji are the best public signs of workflow-level deployment, while
      MGH gives UII an international research-validation reference.
    claimRefs: ["CU006", "CU007", "CU008"]
  - calloutType: "risk"
    title: "The missing retention stack is the central diligence gap"
    body: >-
      Public sources still do not disclose churn, renewals, NRR, contract length, or
      module-level paid-site counts, so durability remains largely unproven.
    claimRefs: ["CU013", "CU015"]
  - calloutType: "insight"
    title: "Distribution strength and concentration risk likely come from the same parent relationship"
    body: >-
      UII's group positioning appears to accelerate hospital access, but it also obscures
      how much traction is standalone software demand versus parent-mediated channel pull.
    claimRefs: ["CU012", "CU015", "CU016"]
