- id: TU004
  title: Retention / Repeat Usage / Satisfaction Table
  columns:
  - Retention Signal
  - Evidence
  - Quality
  - Interpretation
  rows:
  - - No public contract exits
    - No corporate customer has announced exit from Climeworks deal
    - Low confidence – may reflect NDA obligations, not genuine satisfaction
    - Absence of adverse evidence is necessary but not sufficient for retention confirmation
  - - Investor-buyer alignment (Swiss Re, Partners Group)
    - Both invest in and purchase from Climeworks
    - High – strategic exit would harm both investment and supply chain
    - Strongest retention signal; aligned interests prevent exit
  - - BCG deal duration (17 years)
    - 80,000 t through 2040 = structural commitment
    - High – longest disclosed duration in DAC market
    - Duration signals high confidence in Climeworks' long-term viability
  - - Frontier AMC no exits (3+ years)
    - Microsoft, Stripe, Shopify, Alphabet still in Frontier; no reported exits
    - High – Frontier requires continuous evaluation of suppliers
    - Retention of highest-scrutiny buyers is strong proof
  - - Individual subscriber count stable or growing
    - 18,000+ subscribers as of 2025 with no publicly reported decline
    - Low confidence – no historical comparison provided
    - Subscriber stability is a positive signal; churn unknown
  - - Positive public statements from named customers
    - BCG, Morgan Stanley, SAP, Swiss Re all made positive press statements
    - Low – these are at deal announcement, not renewal; typical PR language
    - 'Required diligence caveat: public statements don''t confirm satisfaction at delivery'
  notes: 'Retention data for Climeworks is inherently limited: multi-year forward contracts do not

    test retention until renewal points. The 2026–2028 period will be the first true retention

    test for Orca-era customers. The Mammoth delivery gap may surface as retention risk

    at that time.

    '
  claimRefs:
  - CU004
  - CU005
- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Risk Dimension
  - Evidence
  - Severity
  - Mitigation
  rows:
  - - Anchor customer concentration (BCG + Morgan Stanley)
    - 120,000 t = 2% of 6M contracted; spread across 13-17 years
    - Low-medium – by volume, not concentrated; but near-term delivery focused on these accounts
    - Diversify into more accounts with shorter delivery horizons
  - - Vertical concentration (tech + financial services)
    - Majority of known volume in 3 verticals; maritime and aviation are small
    - Medium – if ESG budgets compress in these sectors, demand could fall
    - Maritime + aviation expansion diversifies sector exposure
  - - Geographic concentration (Europe + North America)
    - 160+ customers but EU/NA dominant; APAC growing
    - Medium – Asian CDR market is nascent but growing
    - MOL, NYK, TikTok deals represent early APAC diversification
  - - Channel concentration (direct sales dominant)
    - Carbonfuture is secondary channel; Frontier AMC is limited program
    - Medium – direct sales has higher margin but slower scale
    - Carbonfuture marketplace and new AMC programs can accelerate
  - - Individual subscriber churn risk
    - 18,000+ subscribers; no disclosed churn rate; climate sentiment may shift
    - Low-medium – climate consciousness is growing but economic pressure can reduce VCM spending
    - Monthly subscription pricing and social community features reduce churn
  - - Delivery failure concentration (Mammoth dependency)
    - All Gen2 storage delivery flows through Mammoth + Orca; Mammoth at 0.3% capacity
    - High – if Mammoth fix fails, no material CDR delivery is possible until Gen3
    - Mammoth fix urgency + Gen3 acceleration are critical mitigations
  notes: 'Concentration risk figures are based on publicly disclosed deal information. The actual

    distribution of contracted tonnes across all 160+ customers is unknown; the disclosed

    BCG/Morgan Stanley/SAP deals likely represent a small fraction of total contracted tonnage.

    '
  claimRefs:
  - CU001
  - CU002
