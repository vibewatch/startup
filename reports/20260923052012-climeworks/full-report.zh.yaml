        - Climeworks 与 Carbfix
        - CO2 经压缩后与水混合溶解，通过管道泵送至 Carbfix 地下注入井场
        - 待注入地下的富含 CO2 水溶液
        - 质量流量计量仪；输送管线传感器
      - - 5. 深层地下注入
        - Carbfix
        - 将富含 CO2 的溶解水注入地下 400–800m 深处的玄武岩地层
        - CO2 开启矿化反应转化为方解石
        - 注入压力与注入体积读数；地球化学示踪剂
      - - 6. 矿化成果核验
        - Carbfix 与独立地质学专家团队
        - 监测地球化学环境动态；确认 CO2 在 1–2 年内彻底矿化转为方解石晶体
        - 永久封存属性得到证实
        - 示踪剂测定结果；第三方独立地球化学分析报告
      - - 7. 签发碳信用（CORC）
        - Puro.earth
        - 为核验合格的碳去除吨数签发二氧化碳去除证书（CORC）
        - 买方注册登记簿账户中的 CORC 资产
        - Puro Standard 审核标准；工厂运营与地质监测底表数据
      - - 8. 接入 ESG 披露报表
        - 企业买方
        - 将 CORC 纳入 CDP、SBTi 以及温室气体核算体系（GHG Protocol）范围三（Scope 3）报告
        - 包含权威核验 CDR 数据的已发布 ESG 披露报告
        - 第三方独立 ESG 审计机构
    notes: >
      本业务流程适用于 DAC 与地下封存一体化产品（Orca 和 Mammoth 工厂）。针对组合式产品包，环节 2 至 6 因具体技术路径（如生物炭、强化岩石风化）而异。面向个人订阅客户，环节 1 和环节 8 均经由
      Climeworks 官网线上界面简化办理。
