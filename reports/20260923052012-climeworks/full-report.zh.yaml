      - number: '7.2'
        title: 监管、法律与政治风险
        blocks:
          - type: paragraph
            body: >
              Climeworks 面临的跨司法管辖区监管风险，其复杂程度远超绝大多数气候科技同行。在美国：路易斯安那州的 Project Cypress 项目需要美国能源部（DOE）酌情审批、EPA UIC Class VI
              注入井许可（审批通常耗时 2–5 年），以及路易斯安那州环境质量部（DEQ）环境许可。随着 Trump 政府对清洁能源支持政策发起审查，Project Cypress 获得的高达 $500M+
              能源部拨款面临暂缓、缩减或取消的风险。这是 Climeworks 在美扩张的核心载体；一旦失去官方资金扶持，公司必须转向条款苛刻得多的民间资本来填补缺口。


              在欧盟：碳移除认证框架（CRCF）已于 2024 年生效，目前正通过授权法案敲定具体细则。Climeworks 必须确保自身 MRV 方案（Puro.earth/CORC 认证）符合 CRCF
              在持久性、额外性及监测机制上的要求。若后续授权法案提出了现行方案无法达标的条款（例如要求 1,000 年（1,000-year）封存持久性而非 100
              年（100-year），或执行更严苛的额外性审核），Climeworks 便需调整认证方案，甚至重新核验已交付的碳信用。


              《巴黎协定》第 6.4 条（Article 6.4）给跨境碳去除信用流转增添了变数：「相应调整」机制可能限制 Climeworks 碳信用的结算市场。冰岛关于扩大 CO2 注入体量的环保审批形成监管依赖，可能拖累
              Mammoth 恢复满产进度。知识产权风险客观存在但偏长期：核心专利 EP3034149B1 将于约 2034 年到期；Gen3 规整吸附剂在欧美、日本等不同专利法系下的自由运营（FTO）权，仍需保持动态排查。
            claimRefs:
              - CR001
              - CR002
              - CR003
