      - number: '7.3'
        title: 财务、合作伙伴与执行风险
        blocks:
          - type: paragraph
            body: >
              Climeworks 的财务风险，集中体现在现有资金储备与 Gen3 规模化投产所需的巨额资本开支之间的断层。2025 年 1 月到账的 $162M 融资，在每年 $80–150M/yr 的烧钱速度下，能支撑
              12–24 个月（12–24 months）的现金跑道；但 Gen3 单座商业工厂建设成本需 $300–500M，意味着到 2030 年达成 1 Mt/yr 产能累计需要 $8–14B 的
              CapEx。若无法撬动项目融资（绿色债券、政策性开发银行贷款、税收抵免），单靠股权融资根本无法覆盖这一资金缺口。一旦融资遇阻或估值缩水，Gen3 建设步伐将大幅放缓。


              合作伙伴风险高度集中且短期难以替代：Carbfix 是冰岛基地唯一的 CO2 封存伙伴，其运营一旦中断，全部 CDR 交付旋即停摆。Swiss Re
              身兼投资方、买家与承保商三重身份，埋下了关联共振风险：倘若因气候巨灾索赔主张（catastrophic claims）承压，导致外界声称其财务可能受损，其提供履约担保保险的能力可能在 DAC
              需求高峰期大打折扣。此外，Avantium 负责吸附剂筛选测试，带来了一定程度的研发依附。


              股权集中于 Partners Group 与 GIC，意味着只要这两家机构调整清洁能源资产配置策略，Climeworks 在下一轮融资中就可能面临领投方缺位的困境。在旗舰工厂产能拉胯的关口裁减 22%
              员工，向外界释放了经营承压信号，恐令引入新的机构投资人更加艰难。核心管理层执行风险加剧：联合创始人 Christoph Gebald 与 Jan Wurzbacher
              正共同掌舵顶住工厂停滞、裁员风波与政策阻力，此时任何一位创始人离职都将带来致命打击。目前没有公开披露任何接班计划。
