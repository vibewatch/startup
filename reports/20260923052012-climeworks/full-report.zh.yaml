      - number: '5.3'
        title: 运营成熟度、技术反向事实与工程化落地路线图
        blocks:
          - type: paragraph
            body: >
              Climeworks 的技术运营成熟度严重割裂：同属 Gen2 代际的 Orca 已达技术就绪度最高级 TRL 9，积累了 3+ 年商业连续运行实绩；但同为 Gen2 架构的 Mammoth 虽名义定在 TRL
              8，实际却陷入严重瘫痪（规划的 72 个集装箱中仅有 12 个勉强工作）。全新的 Gen3 则处于 TRL 6–7 阶段（已完成工业全尺寸样机验证，但尚未正式商业化投产）。


              技术尽调中最具冲击力的反向事实在于 Mammoth 惊人的集装箱故障率：在坐拥 Orca 工厂 3+ 年运营经验累积、且冰岛具备高度受控外部环境的理想条件下，72 个模块化收集单元中竟有 60
              个无法正常工作；这一灾难性表现直接拷问着未来 Gen3
              立方体部署在路易斯安那州时的胜算（面临截然不同的热电供给、迥异的气候湿度以及全新的地质封存层）。该核心疑问至今尚无公开答案，构成了本次尽调中严重级别最高的技术风险。


              规划中的路易斯安那州 Gen3 工厂（Project Cypress）计划于 2026 年动工，将成为 Gen3 技术的首个商业化落地阵地——这是检验 Basel
              实验室验证数据能否转化为工业级商业可靠性的试金石。位于挪威、肯尼亚与加拿大的储备基地尚处更早期阶段，均需因地制宜完成能源供应与地质储库的适配再造。Orca 则继续以稳态基准设施运行。


              2025 年 Q1 与 Avantium 达成的吸附材料高通量筛选战略合作，旨在提前物色 Gen3 之后的下一代吸附介质候选，缩短基础研发试错周期。公司持有的核心专利组合（包括 EP3034149B1
              等核心专利）严密覆盖了核心吸附配方与工艺系统拓扑，为后来者筑起了一道长达 5–10 年的技术仿制壁垒。
            claimRefs:
