      - number: '2.4'
        title: 增长驱动因素与规模化采买制约
        blocks:
          - type: paragraph
            body: >
              近期最核心的增长驱动力来自监管政策：美国 2022 年《通胀削减法案》（IRA）将带永久封存的 DAC 项目 45Q 税收抵免大幅上调至 USD 180/tonne，从根本上改写了美国本土 DAC
              项目的经济模型。欧盟《碳去除认证框架》（CRCF，2024 年 2 月达成临时协议）确立了欧盟对 DAC 信用的通用核准准则。英国规模达 GBP 20 billion 的 CCUS 揽子支持计划，以及日本将
              DAC 纳入碳排放交易体系，也为政策需求提供了坚实支点。


              《巴黎协定》与科学碳目标倡议（SBTi）框架下的企业净零承诺，激发出强烈的机构采购意愿。2023–2024
              年自愿碳市场（VCM）爆发信任危机，买方普遍抛弃备受质疑的传统自然碳汇抵消额度，转而拥抱具备独立第三方核验的永久、可量化工程化碳去除，使 CDR 市场直接受益。


              核心的采买制约在于高昂成本：个人端高达 USD 1,000/tonne、企业端在 USD 400–600/tonne 的定价，使 DAC
              沦为仅有极高意愿且资金雄厚的头部客户才能负担的奢侈品。在当前价位下，估计全球潜在企业买方仅有数百家大型跨国巨头。高达 1,500–2,000 kWh/tonne
              的能耗强度，意味着低成本绿电或地热资源禀赋成为项目生存的先决条件。Climeworks 的冰岛工厂充分利用了廉价地热，但在未发生根本性工艺突破前，该模式很难在全球各区域复制推广。


              最直接的近期待解逆风是美国政策的骤变隐忧。特朗普政府在 2025 年重新审查并可能终止美国能源部（DOE）的 DAC Hub 专项资助，威胁到原定 USD 3.5 billion
              联邦扶持资金的落地——而这正是全美 DAC 规模化扩张的战略支柱。政策波动直接波及 Climeworks 牵头的路易斯安那州 Project Cypress
              项目，既构成眼前迫切的财务断流风险，也向企业买方传递出美国 DAC 扶持政策难言稳定的危险信号。
