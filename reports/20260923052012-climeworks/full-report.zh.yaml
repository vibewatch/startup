  productSummary: >
    Climeworks 的核心产品是经核证的永久 CO2 去除信用（CORC），由自研 DAC 加矿化系统交付：(1) 固体胺吸附滤芯捕集环境空气中的 CO2；(2) 低温热源脱附释放高纯度 CO2；(3) 经 Carbfix
    注入玄武岩层完成永久矿化封存。Gen2 工厂（Orca、Mammoth）采用集装箱式模块化收集单元；Gen3 技术升级为大型立方体架构（26×26×22.5m），搭载结构化吸附材料，目标相比 Gen2 达成 2× 通量并将能耗降至
    0.5×。信用签发遵循 Puro.earth（CORC 标准），Climeworks 也是全球首家获得 Puro 认证的 DAC 企业。个人用户按月订阅 CORC，企业客户则签订多年期远期采购协议。
