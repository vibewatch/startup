      - number: '8.2'
        title: 乐观/基准/悲观情景与投资逻辑
        blocks:
          - type: paragraph
            body: >
              Climeworks 的估值高度取决于情景演变，结果区间离散度极大：


              **乐观情景（发生概率 20%，合理估值 $2–5B）：** 截至 2025 年 Q4（Q4 2025），Mammoth 运转模块达到 >50/72；2026 年 Gen3 商业工厂奠基动工；Project
              Cypress 正式锁定能源部拨款；Series D 轮以 $2B+ 投后估值斩获 >$500M。2028 年收入达 $30M+（Gen3 部分投产交付），并在 2031–2032 年攀升至 $300M+。按
              2032 年收入的 5–8× 倍数估算，2028 年合理估值为 $1.5–2.4B，2032 年达 $6–12B；按 30% 折现率折至当下，对应合理估值为 $2–5B。核心的 45Q 税收抵免（在 36,000
              t/yr 产能下，单厂每年贡献 $6.5M/yr/plant）将贡献可观的非稀释性现金。


              **基准情景（发生概率 50%，合理估值 $800M–$1.5B）：** Mammoth 运转集装箱达 30–50/72 个，Gen3 延宕至 2028–2029 年启动，Project Cypress
              进度受阻。已签待履约订单（面值 $2.4B，按 60% 交付折价计为现值 $960M PV）加上专利期权价值（参考 Carbon Engineering 对标，计
              $500–800M），分类加总估值（SOTP）得出的价值为 $1.4–1.8B；但计入股权稀释及现金跑道缺口折价后，合理估值收敛至 $800M–$1.5B。


              **悲观情景（发生概率 30%，合理估值 $200–500M）：** Mammoth 无法修复，Project Cypress 项目下马，2026 年被迫降价融资。不良资产清算价值（专利资产 + 在手合同 +
              人才团队）成为价值兜底主因；既有 Series C 轮投资人面临 75–80% 的本金减计。由石油巨头以低估值（$200–500M）出手接盘并购，是这一情景下的主要资金回收途径。


              核心投资逻辑在于，Climeworks 坐拥 DAC 赛道极具价值的看涨期权——没有任何竞争对手能在耗资数亿美元、耗时 5 年以上（5+
              years）摸索运营经验之前复制这份积累。即便沦入悲观情景，其自研技术与客户底盘对潜在收购方而言依然保有可观的战略价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
