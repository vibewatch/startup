      - number: '1.3'
        title: 运营工厂与实际产能表现
        blocks:
          - type: paragraph
            body: >
              Climeworks 的运营重心集中在冰岛两座大型工厂，二者均毗邻 Hellisheiði 地热发电厂，依托其提供的可再生地热能驱动 DAC 捕集流程。


              Orca 工厂（名称源自冰岛语“能源”一词）于 2021 年 9 月投运，设计年铭牌产能为 4,000 吨 CO2。尽管 Orca 创造了全球首座大型商业化 DAC
              叠加永久封存工厂的行业里程碑，但其任何单一自然年的实际捕集量从未突破 1,000 吨。2024 年，Orca 的有效运行时间约 65%，停机主要归因于供能地热电厂的计划性检修。联合 CEO 曾将 4,000
              吨产能比作“汽车的最高时速，即理论极限值”。鉴于初代捕集技术目前已属过时，Climeworks 已决定不再对 Orca 进行大规模追加投资。


              2024 年 5 月落成的 Mammoth 工厂规模跃升十倍，规划年铭牌产能达 36,000 吨。然而在投运后的前约 10 个月里，Mammoth 实际捕集量仅约 105 吨 CO2，不及设计产能的
              1%。核心症结在于滤芯性能缺陷——早在 2023 年 Orca 原型机测试时该问题就已暴露。Climeworks 当时未停工等待彻底根治方案，而是采取了 COO
              所称的“打补丁”策略强行推进建设；进入工业化放大后，相同的滤芯故障再次全面爆发。截至 2025 年初，规划的 72 个收集集装箱中仅有 12 个能完全运转。公司表示，Mammoth
              预计将经历为期三年的产能爬坡，要到 2020 年代末才可能达产。


              产能严重受阻引发了外界高度关注与负面报道。冰岛媒体 Heimildin 与彭博社相继披露，Climeworks 旗下工厂的实际捕集量仅占宣称产能的一小部分，甚至尚未冲抵工厂自身在建设与运营过程中产生的 CO2
              排放。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: figure
            figureRef: FO002
            claimRefs:
              - CO007
              - CO008
      - number: '1.4'
        title: 商业模式、客户群体与商业化进展
        blocks:
          - type: paragraph
            body: >
              Climeworks 围绕经核证的永久 CO2 去除服务，搭建了面向 B2B 客户的长期采购与订阅模式。企业客户按地下永久封存的 CO2 吨数付费；个人订阅单价约 USD
              1,000/t。该定价较欧洲合规碳配额价格高出约 13x，使 Climeworks 牢牢占据高品质自愿性高端碳去除市场生态位。


              公司客群涵盖科技、金融、航空、咨询与保险等领域的 160+ 家企业。具有标杆意义的多年期长协包括：BCG 签订的 15 年期、80,000 吨订单（2023 年 12 月，为迄今企业最大单笔采购）；Morgan
              Stanley 持续至 2037 年的 40,000 吨长协（2024 年 10 月，也是该机构首笔 DAC 信用采购）；以及与 JPMorgan Chase 签订的未公开规模协议。2024 年 9
              月，British Airways 签约成为其航空领域首位客户。Frontier Climate（由 Stripe、Shopify、Alphabet 和 McKinsey
              等发起的前瞻性市场承诺基金）则聚合科技巨头的先锋采购需求，持续注入 Climeworks 等高潜力 DAC 供应商。


              据 CDR.fyi 统计，截至 2025 年中，Climeworks 在手客户合同总量已突破 380,000 吨，累计斩获 421 笔采购订单，订单数量领跑所有 DAC 供应商。在全球实际交付的 DAC
              碳去除量中，Climeworks 贡献了约 81%。然而，在手合同量与实际交付量之间存在巨大鸿沟：截至 2025 年上半年，全行业累计交付总量仅 1,186 吨，仅占总签约采购量的
              0.05%。Climeworks 现亦推出 Climeworks Solutions 综合组合包，将自研工程化去除与基于自然的解决方案及第三方技术掺配，在纯 DAC 产能爬坡期满足企业客户的近期减排履约需求。
            claimRefs:
