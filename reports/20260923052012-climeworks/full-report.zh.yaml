              - CP003
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史、投资者背景与资本结构
        blocks:
          - type: paragraph
            body: >
              Climeworks 历经两轮主要大额融资与若干早期小轮次，累计斩获股权融资超过 USD 1 billion。其中最具里程碑意义的当属 2022 年 4 月完成的 Series C 轮，融资总额达 CHF 600
              million（约 USD 650 million），由 Partners Group 与 GIC 联合领投，Baillie Gifford、M&G、Swiss Re、Carbon Removal
              Partners、Global Founders Capital 以及著名风险投资家 John Doerr 等顶尖机构和气候科技投资领袖悉数入局。2025 年规模为 USD 162 million
              的新一轮融资由瑞士亿万富翁 Martin Haefner 的家族投资载体兼锚定股东 BigPoint Holding AG 携手 Partners Group 领投，释放出股东在面对 Mammoth
              严重运营波折时仍选择全力支持的信号。


              其股东结构兼具高度特色化的长周期属性：Partners Group 管理着投资周期长达 10+ 年的基建类私募股权；GIC 作为主权财富基金几乎无短期退出变现压力；BigPoint Holding
              扮演拥有超长存续期的锚定长线股东；Swiss Re 兼具投资方与下游采购客户双重身份，利益深度捆绑；Baillie Gifford
              则以长周期重注颠覆性技术创新的耐心资本著称。这种股权结构表特征赋予了极高的资本耐心，大幅降低了近期被逼空退场或被动接受低估值困境融资（Distress Financing）的概率；但另一方面，这也可能压低要求加速
              IPO 上市或启动并购退出的常规商业回报诉求。


              截至本报告发布日，Climeworks
              没有公开披露的债务融资，未曾公开募股，亦未落实任何确定性的项目融资贷款。作为一家瑞士非上市股份公司（Aktiengesellschaft），其虽在瑞士商业登记处备案，但无需对外公开披露经审计的财务报表。因此，本章所有财务分析结论均基于测算模型推演。
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.2'
        title: 收入模式、定价机制与收入质量
        blocks:
          - type: paragraph
            body: >
              Climeworks 的营收由三大渠道构成：(1) 个人端订阅制，折合单价约 USD 1,000/tonne（按去除量分档月付 CHF 7–50/month）；(2) 企业端多年期长协长单，估算单价在 USD
              400–600/tonne；(3) 混合型 CDR 资产包销售，将昂贵 DAC 与低成本路径（生物炭、自然碳汇、加速风化）进行混搭。2025 年签署的 SAP 订单（到 2034 年交付 37,000
              吨，采用混合路径）正是这一策略的标杆案例。


              其会计收入确认严格以履约交付为前提：只有当 CO2 实际完成物理捕集且注入封存经第三方核验后，方能确认为真实营业收入。因此，尽管 6 million
              吨在手订单展现出充沛的商业动能，但在资产负债表视角下仅代表未来的远期交付义务，绝非当期现成营收。在缺失公开资产负债表的前提下，企业预付款项所衍生的递延收入负债规模成为关键未知数。


              个人订阅业务估算每年贡献 USD 3.2–5.4M/year 的经常性收入（18,000+ 名订阅用户，估算户均年消费 USD 180–300/year）。企业端长单交付节奏则呈现明显脉冲性：BCG 到 2040
              年的 80,000 吨订单按当前极低交付速度折算仅有约 USD 5,000–8,000/year 进账；Morgan Stanley 到 2037 年的 40,000 吨长单亦大致相当。Mammoth 投产前
              10 个月产生的实际交付确认营收（约 105 吨 × USD 400–600/t = 约 USD 42,000–63,000），对照庞大的运营成本盘子几乎可以忽略不计。


              向混合资产包模式倾斜虽提升了财务资本利用效率（平摊单位成本后能向客户交付更大吨数），但也埋下了信用质量被稀释的隐患：随着国际 MRV 监测核证标准的收紧，买方极可能严格盘查其实际抵扣份额中究竟有多少是纯
              DAC，又有多少掺杂了廉价替代碳汇。
