      - number: '4.3'
        title: 单吨经济模型、资本密度与盈利路径
        blocks:
          - type: paragraph
            body: >
              Climeworks 当前的成本结构对照其售价极度倒挂：其综合全流程成本约 USD 1,000/tonne，而企业端售价仅为 USD
              400–600/tonne，绝大部分出货实质处于负毛利率运转状态——本质上是在自掏腰包补贴换取工程交付经验与客情绑定，而非创造商业利润。在现有成本模型下，仅有个人订阅端定价（约 USD
              1,000/tonne）能够勉强使毛利率接近盈亏平衡线。


              公司规划的 Gen3 降本路线图设定了到 2030 年将成本压降至 USD 250–350/tonne 的目标，核心依托三大抓手：(1) 单模块通量提升至 2×；(2) 单吨能耗削减 50%；(3)
              吸附滤芯物理寿命延长至 3×（大幅压低耗材折旧成本）。一旦目标达成，按 USD 400–600/tonne 的企业端售价测算，将释放出 14–58% 的毛利率空间——足以在达到约 1 million
              吨/年的产能规模时全面覆盖日常运营开支。但基于 Mammoth 隐含的投资测算（36,000 t/yr 产能耗资 USD 200–400M），将产能拉升至 1 million t/yr 估计需要追加 USD
              500M–2B 的重资产工厂投资。


              DAC 的重资产属性显著超越风光绿电（新能源装机成本为 USD 0.5–2M/MW，而 Climeworks 现有工厂每吨年产能对应 CAPEX 估计高达 USD
              5,000–11,000）。即便在最乐观的假设情景下，实现真正盈利也要等到 2030 年以后，漫长的爬坡期需要巨量股权再融资或项目贷款托底。2025 年 5 月推行的 22%
              裁员虽在边际上削减了烧钱速度（估计每年可节省 USD 12–15M 薪酬支出），却无法从根本上扭转极端沉重的资本密度方程。
