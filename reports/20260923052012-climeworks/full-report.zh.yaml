      - 研判结论
    rows:
      - - 技术
        - Gen3 已在巴塞尔完成验证：通量达 2×，能耗仅 0.5×；结构化吸附剂确属实质创新
        - Gen3 从未投入商业化部署；Mammoth 的故障可能折射出 Gen2 的设计缺陷，预示 Gen3 同样面临潜在风险
        - 有条件认可：巴塞尔验证确凿，但商业化规模落地的不确定性极大
      - - 市场
        - DAC 是唯一兼具永久性与可规模化扩展的 CDR 路径；达到平价时拥有 $1T 的潜在市场空间
        - 若按 Gen3 的 $250–350/t 目标成本测算，目标市场仅占理论上限的 5–10%（大众化普及需降至 $100–150/t）
        - 有条件认可：高端溢价市场真实存在；大众化市场则有赖于尚未提上日程的 Gen4 成本水平
      - - 客户
        - 拥有 160+ 家企业客户，已签约锁定 6M 吨指标，BCG、Morgan Stanley、SAP 为锚定客户
        - 所谓「背书」多为远期承购承诺；完成实际交付的客户仅数十家，远非数百家
        - 喜忧参半：商业合作真实成立；但实际交付成色偏弱
      - - 运营
        - Orca 持续稳定运行 3+ 年；团队具备全球经验最丰富的 DAC 实际操盘积累
        - Mammoth 实际出力仅为额定产能的 0.3%；事故根因尚未公开披露；裁员后团队减员 22%
        - 偏向负面：Mammoth 故障是近期最主要的信号
      - - 财务
        - '>$1B 累计融资；拥有 EIB、45Q 税收抵免、DOE 项目融资等多元融资渠道'
        - 现金跑道仅剩 12–24 个月；2030 年前 Gen3 建设需 $8–14B CapEx；2026 年面临流血轮下调估值风险
        - 偏向负面：现有资金储备与商业化 Gen3 落地所需资本之间存在巨大鸿沟
      - - 政策
        - CRCF、SBTi、CORSIA、IMO 2050 均催生出对 CDR 的结构性刚需
        - DOE 对 Cypress 的资助面临变数；特朗普政府削减清洁能源支持优先级；CRCF 授权法案细则尚未明确
        - 喜忧参半：欧盟与国际政策顺风强劲；美国政治风险实质存在
    notes: |
      正反逻辑研判结论反映截至 2025 年年中的综合证据权衡。多数维度呈现「喜忧参半」或「有条件认可」的评定，这与「有条件观望」的投资建议相吻合，而非给出明确的买入或卖出指令。
    claimRefs:
      - CV002
      - CV003
