      - number: '6.4'
        title: 扩张潜力、个人订阅渠道与客户维度尽调结论
        blocks:
          - type: paragraph
            body: >
              Climeworks 的客群扩张空间相当广阔：航空业（CORSIA 合规要求撬动了永久性碳去除信用需求）、航运业（IMO 2050
              净零目标）、金融服务业（欧洲央行及美联储对持牌机构的净零减排要求），以及科技业（数字企业对永久性 CDR 的支付意愿最高）。各细分行业都在迎来监管政策助推，推动 CDR
              从自愿性「锦上添花」转向准合规级「硬性刚需」。


              个人订阅渠道（18,000+ 名用户，估计平均每月贡献 CHF 20/month，折合约 $4.5M
              ARR）提供了可预测的经常性收入并放大了品牌效应。相较于企业级长协采购，该渠道绝对金额有限，却撬动了公众社群参与，并向评估 DAC 补贴政策的监管层提供了重要佐证：公众愿意为永久性 CDR 支付 $1,000/t
              的溢价。


              转向混合型 CDR 资产组合（如 SAP 订单），将 Climeworks 的目标客群拓宽到了无力承担纯 DAC 报价的中端市场。将低成本碳去除与高价 DAC 打包，Climeworks 得以把综合吨价拉低至
              $200–400，覆盖的企业买家规模有望扩大 3–5x。


              客户维度尽调结论：Climeworks 展现出拿下并维系跨行业顶级企业客户的实力，并手握 Frontier AMC 严谨买家给出的高质量技术背书。眼下核心隐忧在于交付落差埋下了潜在客户风险；赶在
              2026–2028 年续约潮来临前，公司必须把远期承诺兑现为履约成果。
            claimRefs:
              - CU001
              - CU002
              - CU003
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Climeworks 当下最紧迫的是运营风险：Mammoth 装置中 72 个捕集集装箱模块有 60 个未能启用，产能兑现率较标称产能缺口达约 90%。商业化运营前 10 个月仅产出约 105 tonnes，与
              36,000 t/yr 的规划相去甚远。根本原因尚未公开披露，业内推测潜在症结包括：吸附剂在冰岛特定温湿度条件下快速衰减；捕集风机或热交换器出现机械故障；过程控制软件缺陷；或是 Gen2
              模块设计存在硬伤，需要大动干戈回厂改造。各种推测对应的修复概率与修复周期大相径庭。


              Gen3 技术的工程化落地风险让局面雪上加霜：Climeworks 整体降本规划完全押注于 Gen3 规整吸附剂，指望它在商业化规模下比 Gen2 实现 2× 通量并压降能耗至 0.5×。Gen3 虽已在
              Basel 完成 5,000 次循环（5,000-cycle）、15,000 小时（15,000-hour）的中试验证，但工业级规整吸附材料从未在 DAC
              实体工厂中运转过。吸附材料必须扛住工业级的冷热循环、湿度骤变、机械震动和化学污染，这些与中试实验室环境存在量级与本质差异。精细化工领域放大生产的失败率居高不下；在缺乏对工业级性能数据展开独立技术审查的前提下，这项风险仍无法彻底摸清。


              从 Gen2 向 Gen3 换代的管理过渡风险同样不容忽视：经历 22% 裁员后，Climeworks 仅剩约 377 名员工，团队需要同时推进 Mammoth 故障排查、Gen3
              商业化工程设计以及多地选址筹建。内部资源与优先级冲突难以避免；22% 的人员精简固然降低了烧钱速度，却也削弱了团队多线作战的执行力。能源成本风险则是结构性的：按照 Gen2 水平的 1,500–2,000
              kWh/tonne 测算，电价上涨 20% 就会给 OPEX 增加 $50–100/tonne。眼下冰岛地热电网正遭遇全球数据中心运营商抢夺绿电，负荷日趋紧张。
