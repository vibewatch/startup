  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景：直接 DAC 竞对与相邻替代路径
        blocks:
          - type: paragraph
            body: >
              据世界资源研究所（WRI）统计，截至 2025 年初全球涉足直接空气捕集（DAC）的企业约 150 家，但真正迈入商业化运营的梯队极窄：仅有 Climeworks 以及潜在竞对 1PointFive
              曾在大规模下跑通连续的商业化“DAC+封存”运转。市场整体分化为三大竞争梯队：(1) 商业规模运营商（Climeworks、1PointFive）；(2) 资金充裕的规模化进阶玩家（Heirloom）；(3)
              商业化前期的科研/初创企业（Global Thermostat、CarbonCapture Inc. 及数十家高校衍生团队）。


              在直接 DAC 同行之外，Climeworks 还要承受来自基于自然碳汇抵消（REDD+、造林、土壤固碳）的替代竞争。后者价格仅在 USD 5–30/tonne，相较 Climeworks 个人端 USD
              1,000/tonne 的定价便宜了 30–200x。尽管 2023–2024 年自愿碳市场的公信力崩塌驱使部分高端买家倒向永久 CDR，但按交易总量计，自然碳汇依然吃下了自愿碳市场的绝大部分份额。BECCS
              与工业点源 CCS 在特定应用场景下亦构成替代选项；不过在 SBTi 与 VCMI 严苛规范下，监管界定正显著偏向大气净去除（Climeworks 主阵地），而非传统烟气捕集减排（CCS 主战场）。


              当前竞争态势的底色是宏大远景与普遍交付惨淡形成的强烈反差：1PointFive 宣称到 2030 年实现 55,300 kt/yr 的远期产能目标，远超 Climeworks 的 1,300 kt/yr
              规划；然而两家领头羊现有工厂的实际捕集量均仅占铭牌产能的极小零头。这一共同遭遇的工程落地断层，衍生出异乎寻常的竞争景象——双方都在狂热兜售远期规模蓝图，实则都在极为单薄的当下交付基底上艰难对决。
