      - number: '6.2'
        title: 标杆客户背书、订单质量与行业扩张
        blocks:
          - type: paragraph
            body: >
              Climeworks 公开披露的核心客户阵容兼具广度与含金量。BCG（截至 2040 年锁定 80,000 t）与 Morgan Stanley（截至 2037 年锁定 40,000
              t）是压舱石客户：这两家全球专业服务与金融机构配备了成熟的 ESG 团队，愿以业内最高吨价签下最长合作期限。这类大单直接印证，具备专门碳市场研判能力的挑剔买家认可了 Climeworks 的产品品质。


              与 SAP 的合作（截至 2034 年采购 37,000 t，混合资产组合并打通 ERP 系统）代表着截然不同的合作结构：它把碳去除采购与产品联合开发绑在一起，跳出单纯碳信用交付，构筑起业务壁垒。2025
              年签约的 MOL 航运订单（13,400 t）敲开了远洋海运大门，该领域正面临 IMO 2050 合规减排重压；携手 British Airways 让 Climeworks 卡位民航业（直面 CORSIA
              合规考核）；TikTok 签下 6,000+ t 订单，则印证了数字消费类企业的采购意愿。


              Frontier Climate 阵营（Stripe、Shopify、Alphabet/Google、McKinsey、Meta）构成了质量最高的早期背书：Frontier 技术咨询小组依据持久性、额外性及
              MRV 严密性严审 DAC 供应商，Climeworks 顺利过关。至今没有 Frontier 采购方公开退出。2021–2024 年间，Orca 装置累计向 Frontier 关联买家交付了约 1,081
              tonnes 经核验的 CDR，提供了实打实的交付后履约证据。


              相比之下，Mammoth 客户的证据质量要薄弱得多：面对 36,000 t/yr 的标称产能，投产 10 个月仅出产约 105 t，Climeworks 口中的「160+
              家客户」实际上多数停留在交付前承诺阶段。这种商业背书与真正经受检验的客户交付成果有着本质区别。
