      - number: '5.2'
        title: 技术架构：Generation 2、Generation 3 与地质封存层
        blocks:
          - type: paragraph
            body: >
              Climeworks 的技术栈垂直划分为三大物理层：(1) 自研固体胺吸附系统；(2) 模块化硬件设备平台（集装箱/立方体、轴流风机、换热器）；(3) CO2 封存体系（与 Carbfix
              战略合作）。三大技术层环环相扣，任何一层的工况失效都将直接导致碳去除凭证无法交付。


              底层核心化学反应为变温吸附（TSA）：胺功能化固体吸附剂在常温下捕集空气中的 CO2，随后通入水蒸气加热至约 100°C 完成脱附，释放高纯度 CO2。低热再生是其对照液体 L-DAC（Carbon
              Engineering 煅烧炉高达 900°C）最核心的相对优势。Gen2 沿用传统填充颗粒滤床；Gen3 则彻底重构为规整结构化吸附材料，大幅增大比表面积，使吸附脱附循环耗时缩短一半，单模块通量直接翻倍。


              2024 年 6 月，Gen3 在 Climeworks 的 Basel 测试基地跑通实证测试：公司 180 人的庞大研发梯队中，由 50 位专项专家耗费 15,000 个工时，完成了多达 5,000
              次完整的捕集-释放极限循环。Gen3 采用的工业立方体结构（底面 26×26m、高 22.5m）是对硬件形态的彻底革新，显著改善了 Gen2 早期拼装集装箱在标准化制造与装配维保上的痛点。


              在冰岛由 Carbfix 承接的地质封存层提供了永久且严谨可测量的终局储库：富含 CO2 的水溶液被高压注水注入地下 400–800m 的玄武岩深层，在地球化学示踪剂全程监测下，于 1–2
              年内与矿物反应彻底转化为方解石。这使得 Climeworks 的“捕集+封存”联立产品具备了任何自然碳汇或碳利用项目根本无法比拟的独立可验证性。
