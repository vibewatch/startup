      - number: '3.2'
        title: 核心竞对画像与技术路径对比
        blocks:
          - type: paragraph
            body: >
              1PointFive 采用 Carbon Engineering 的液体 DAC（L-DAC）路线：通过两步法流程，先让空气穿过氢氧化钾（KOH）洗涤塔，随后将富集溶液送入约 900°C
              的高温煅烧炉中脱附，释放高纯 CO2。西方石油（Oxy）于 2023 年斥资约 USD 1.1 billion 全资收购 Carbon Engineering，赋予 1PointFive 极其雄厚的资金后盾、长达
              50+ 年的 CO2 井下注入实操经验（源于其油田提高采收率业务），以及多达 6 billion 吨的已锁定地质封存容量。位于西得克萨斯的 Stratos 是其旗舰 L-DAC 示范项目，设计年产能达
              500,000 t/yr——相当于 Mammoth 铭牌产能的 14×。


              Heirloom Carbon 采取截然不同的成矿机制：通过高温煅烧石灰石（碳酸钙）驱除原矿中的 CO2，再将高活性的氧化钙铺在空气中，使其在数天内自然重吸收环境中的 CO2。Heirloom
              声称其能耗显著低于传统吸附系统，因为整套系统仰赖石灰石自身的化学热力学循环，无需自研复杂的吸附剂再生工艺。其加州商业化设施已投产运转；规划中的两座路易斯安那工厂合计设计产能约 320,000
              t/yr，计划全部采用 100% 增量可再生能源。


              从技术对比看，Climeworks 在多个维度占据优势：S-DAC 解吸温度较低（约 100°C，远低于 L-DAC 煅烧炉所需的
              900°C），更容易与工业地热直连；模块化立方体架构有助于通过单元批量制造沿着学习曲线快速降本；且固体吸附材料可保持高频迭代。但在天然气储量丰富、便于为煅烧炉提供热源的地区，L-DAC
              可能展现出更强的规模化扩展能力；而 Heirloom 的石灰石路线则彻底绕开了自研专用吸附剂的供应链依赖。


              三大技术路线共同面临着本质考验：至今尚无任何一家在商业规模下稳定跑出预设的铭牌产能。面对共同存在的工程落地缺口，眼下的竞争赛跑不仅是技术路线优劣的比拼，更是组织管理与运营执行硬实力的全面较量。
            claimRefs:
              - CP001
              - CP002
              - CP003
