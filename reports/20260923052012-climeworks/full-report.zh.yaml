  - id: TV006
    title: 最终尽调问询清单
    columns:
      - 尽调问询要点
      - 核心关切逻辑
      - 预期披露深度
      - 重大警示信号
    rows:
      - - Mammoth 收集仓激活失败的根本原因是什么？
        - 直接决定产能恢复概率与 Gen3 设计风险
        - 在签署 NDA 前提下，应向 Series D 投资人披露
        - 表述含糊或拒绝解释根本原因；缺乏清晰排障路径
      - - Project Cypress 现状如何，一旦 DOE 取消资助有何 Plan B？
        - 决定公司在美国规模化落地的资金韧性
        - 管理层应当备有应急预案
        - 缺乏备用方案；完全依附 DOE 资金；没有备选资本渠道
      - - Series D 进场时的完整股权结构表、优先股堆叠与投资人权益为何？
        - 决定回报空间与退出清算顺位
        - 属于常规尽调应披露范畴
        - 优先清算负担 >3× 投资额；附带复杂的反稀释条款
      - - 是否有客户流露缩减采购或退出意向？现有全部合同的不可抗力条款现状如何？
        - 决定客户留存风险与合同违约敞口
        - 管理层应掌握全部客户现状；部分细节或涉保密限制
        - 存在任何未披露的客户纠纷或合同重签情况
      - - Gen3 商业化工厂的 CapEx 预估多少，目前在推进哪些融资结构（债权、绿色债券、45Q 税收抵免）？
        - 决定 Gen3 资本效率与股权稀释风险
        - 应对 Gen3 财务模型具备初步测算数据
        - 缺乏非股权融资方案；推进 Gen3 完全依赖股权融资
      - - 裁员后的主动离职率是多少，核心技术骨干包含哪些人员？
        - 决定工程落地能力与关键人员风险
        - 人力数据通常不予全盘披露，但应同步趋势走势
        - Mammoth 抢修团队出现严重人员流失；释放联合创始人离职信号
    notes: |
      上述尽调问询要点应在 Series D 尽职调查中提出。相关问题的解答，
      将直接决定投资建议能否从有条件观察（CONDITIONAL WATCH）上调为买入（BUY），或下调为回避（AVOID）。
    claimRefs:
      - CV002
      - CV003
