  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户全流程履约工作流
        blocks:
          - type: paragraph
            body: >
              Climeworks 的核心可交付物为经认证的二氧化碳去除凭证（CORC），每张凭证严格对应从大气中净去除并永久注入地下封存数千年的一吨 CO2。客户全流程履约工作流包含五个环节：(1)
              签订碳去除远期采购协议；(2) Climeworks 依托固体吸附系统自环境空气中捕集 CO2；(3) 由 Carbfix 将 CO2 溶水后高压打入冰岛玄武岩层，并在 1–2 年内完成成矿矿化；(4)
              Puro.earth 进行全流程独立核查并签发 CORC；(5) 客户正式获得 CORC 凭证，用于 CDP 填报、SBTi 审核与《温室气体核算体系》Scope 3 价值链核算。


              该产品具备四大核心质量支柱：(1) 永久性——玄武岩矿化可将 CO2 锁死数千年乃至数百万年，成矿状态由地球化学示踪剂独立核证；(2)
              精准可测量性——工厂级传感器连续时序数据与地质注入档案紧密结合，做到吨级计量追溯；(3) 额外性——每吨 CORC 均代表纯粹的大气净新增去除，而非碳减排避让或保护现有自然碳库；(4)
              低碳足迹——整套系统在冰岛完全依托近零碳的地热能源运转。


              Climeworks 目前已将产品版图拓展至混合型 CDR 资产包（DAC + 生物炭 + 强化岩石风化），使企业买方能在更低加权平均成本下锁定更大采购规模，同时在组合中保留纯 DAC
              份额以维系高品质公信力。2025 年与商船三井（Mitsui O.S.K. Lines）签署的 13,400 吨订单，印证了其产品方案加速渗透至全新垂直行业脱碳战略中的适配能力。
            claimRefs:
