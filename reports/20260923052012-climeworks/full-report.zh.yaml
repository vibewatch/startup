      - number: '8.3'
        title: 入场纪律、退出就绪度与投资建议
        blocks:
          - type: paragraph
            body: >
              Climeworks 的投资建议是「有条件观察（CONDITIONAL WATCH）」。核心考量：鉴于 Mammoth 能否复产具有高度非黑即白的二元属性，在当前 $1–2B
              的隐含估值下，对新进投资人而言其风险调整后回报欠缺吸引力。若能以 Series C 隐含定价折让 30%（即 $700M–$1.4B 的估值区间）入场，在乐观情景下可斩获 3–4×
              回报，下行风险也处在可承受范围。在投后估值高于 $700M 的情况下，新投资人应坚守纪律，静待 2025 年 Q4（Q4 2025）Mammoth 的运营数据出炉再做定夺。


              既有投资人（Series C 轮及更早批次）建议维持「持有（HOLD）」。当下因缺乏流动性被迫在老股交易中折价割肉，代价远大于继续持有并跟踪 Mammoth 复产进度。2025 年 1
              月到账的资金将现金跑道拉长到了 2026–2027 年初，为核心逻辑的验证（即 Mammoth 集装箱投运情况）预留了充裕观察期。


              退出就绪度评级为「低（LOW）」：由于实质上尚未形成规模化商业收入，未来 3–5 年（3–5 years）内没有清晰的 IPO 上市路径。战略并购（由石油巨头或大型工业集团接盘）是可行路径，基准情景下对应估值为
              $800M–$2B，悲观情景下约为 $200–500M。老股转让是老股东在短期内获取流动性的唯一途径。在敲定任何新一轮投资决策前，必须彻底弄清五大关键尽调问题（Mammoth 停摆根因、Cypress
              替代方案、股权结构表（cap table）、客户留存实况，以及 Gen3 资本开支筹资规划）。
            claimRefs:
              - CV001
              - CV002
              - CV003
