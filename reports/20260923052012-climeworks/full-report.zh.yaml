        - 生效中（2022 年至今）
        - 改善美国项目经济模型；对 Project Cypress 至关重要
        - 评估 Trump 政府调整 45Q 政策的风险；核验 Gen3 技术下的税收抵免资格
      - - 欧盟碳清除认证框架（CRCF）
        - 驱动因素
        - 生效中（2024 年临时通过）
        - 建立 Climeworks 碳信用的欧盟标准；为欧洲政府采购铺平道路
        - 跟进 CRCF 最终定稿时间表；确认 Climeworks 获得 CRCF 认证的合规路径
      - - 英国 CCUS 专项扶持计划（£20B）
        - 驱动因素
        - 生效中（2023 年至今）
        - 开拓英国潜在市场
        - 评估 Climeworks 是否正在布局英国本土项目或争取当地买方
      - - 企业净零排放承诺（SBTi/TCFD）
        - 驱动因素
        - 持续生效且加速扩容
        - 随着 2030 年阶段目标临近，企业买方基数持续扩大
        - 测算做出 SBTi 承诺的企业中 Climeworks 的潜在买方管线规模
      - - 自愿碳市场信任危机促使买方转向工程碳清除（CDR）
        - 驱动因素
        - 生效中（2023 年至今）
        - 形成对 Climeworks 这类产品的采购拉动
        - 监测买方替代采购行为；跟踪 ICVCM 标准制定进展
      - - Trump 政府审查能源部（DOE）氢能与直接空气捕集中心
        - 制约因素
        - 生效中（2025 年至今）
        - 直接威胁 Project Cypress 资金到位；打击美国市场信心
        - 跟踪 DOE 终止资助的具体进展；评估损失 $500M+ 资助的情景预案
      - - DAC 成本高企：个人约 $1,000/t，企业约 $400–600/t
        - 制约因素
        - 持续存在；随时间逐步下降
        - 限制潜在买方范围；必须依靠 Gen3 削减成本以打开 SAM 空间
        - 核实 Gen3 降本目标；评估下探至 $400/t 目标的时间进度风险
      - - 高能耗强度（1,500–2,000 kWh/t CO2）
        - 制约因素
        - 持续存在；随时间逐步下降
        - 冰岛地热资源形成结构性优势，但限制了全球异地复制能力
        - 评估未来选址的能源供应链；论证肯尼亚与挪威建厂可行性
      - - 缺乏标准化的 DAC 碳信用核证体系
        - 制约因素
        - 持续存在；ICVCM 推进制定中
        - 带来采购摩擦；阻碍部分企业会计及财税团队入场
        - 跟踪 ICVCM/Verra 的 DAC 标准编制；核验 Climeworks 当前采用的第三方认证机构
      - - 自愿碳市场上廉价基于自然的碳抵消额度形成价格竞争
        - 制约因素
        - 持续存在；随着质量标准收紧或将缓解
        - 压低买方价格预期，远低于 DAC 实际成本
        - 密切监测基于自然的抵消市场；评估 VCM 整顿改革后买方回流的潜在风险
    notes: |
      时间维度反映截至 2026-05-09 报告出具日的现状。驱动因素与制约因素的相对权重，将高度取决于美国政策走向以及 Gen3 商业落地的成败。
