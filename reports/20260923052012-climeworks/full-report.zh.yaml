      - number: '1.2'
        title: 融资历程、估值与投资者结构
        blocks:
          - type: paragraph
            body: >
              自成立以来，Climeworks 累计股权融资超过 USD 1 billion，是全球资金储备最充裕的纯碳去除企业。公司的融资节奏与气候科技投资生态的成熟演进高度吻合。


              最具里程碑意义的融资事件是 2022 年 4 月完成的 CHF 600 million（约 USD 650 million）Series C 轮融资，由 Partners Group 与新加坡主权财富基金 GIC
              联合领投，Baillie Gifford、Carbon Removal Partners、Global Founders Capital、M&G Investments 及 Swiss Re 跟投。该轮融资将
              Climeworks 推上独角兽地位（估值超过 USD 1 billion），这在碳去除赛道极为罕见。此笔资金专项用于将 DAC 产能推向数百万吨量级，并支持公司在冰岛建设第二座工厂 Mammoth。


              2025 年，Climeworks 再次斩获 USD 162 million 融资——创下当年全球碳去除领域最大单笔投资纪录。本轮仍由 BigPoint Holding 与 Partners Group
              领投，老股东悉数跟投。这笔资金使公司累计融资突破 USD 1 billion。公司官方表示，该笔资金对推进 Generation 3
              技术研发、扩充碳去除产品组合及压低单吨成本至关重要。但在获得资金注入的同时，公司在 2025 年 5 月宣布大幅裁员，反映出此轮融资重心在于延长奔向盈利的现金跑道，而非继续扩张人员编制。


              联合 CEO Jan Wurzbacher 曾公开表态，公司仍在持续物色未能完成后续融资的早期 DAC 初创团队并寻求收购机会，展现出在 DAC 领域顺势推进行业整合的意图。
            claimRefs:
              - CO001
              - CO002
              - CO003
