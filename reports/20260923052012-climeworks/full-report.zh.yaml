      - number: '2.3'
        title: 买方画像细分与客户采买动态
        blocks:
          - type: paragraph
            body: >
              当前的 DAC 买方市场高度集中于少数受 ESG 驱动的大型企业巨头。Microsoft 一家便买下了全球已签发碳去除信用的 80% 以上，带来极端的买方集中度风险。由
              Stripe、Shopify、Alphabet 与 McKinsey 等支持的 Frontier Climate 承诺到 2030 年投入 USD 1 billion 采购永久 CDR，为 Climeworks
              及其同行构筑了结构化确定性需求底座。


              核心买方典型画像为大型科技或金融机构，具备以下四项特征：(1) 拥有公开的 2030 或 2040 净零承诺；(2) 设有拥有独立预算审批权的专职可持续发展或环境事务团队；(3) 面临 TCFD 或欧盟 CSRD
              框架下的董事会 ESG 披露考核；(4) 明确倾向可测量、可验证的真实碳去除，而非减排抵消额度。BCG（到 2040 年采购 80,000 吨）与 Morgan Stanley（到 2037 年采购 40,000
              吨）是这一画像的标杆代表。受碳核算金融联盟（PCAF）投资组合碳排放核算标准驱动，金融行业买方群体迅速扩大。


              航空业成为崛起中的增量板块：British Airways 于 2024 年与 Climeworks 达成合作，用于满足 CORSIA 履约与自愿碳减排承诺。欧盟 ReFuelEU 法规与 CSRD
              披露准则预计将进一步推高航司对永久碳去除凭证的刚性需求。


              主权国家买方构成了体量诱人的新兴客群，依托《巴黎协定》第六条（Article 6）机制，各国可跨国转移碳去除配额以兑现自主贡献（NDC）目标。瑞士与挪威已就 DACS
              信用跨境交易建立双边合作框架。一旦第六条国际交易机制放量，政府采购可能演变为 DAC 最大的需求来源——但截至 2025 年该机制推进仍伴随极高不确定性。


              个人订阅用户（Climeworks 拥有 18,000+ 名个人付费散客，月费约 USD
              7–50/month）在财务贡献上较为边缘，却输送了品牌知名度、早期尝鲜者背书，以及在市场公关与政策游说中不可或缺的公众触点。
