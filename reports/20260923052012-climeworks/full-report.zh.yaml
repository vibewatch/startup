      - number: '3.4'
        title: 切换成本、销售网络与反向竞争证据
        blocks:
          - type: paragraph
            body: >
              在签约之前，DAC 市场的切换成本极低，但签约完成后切换成本跃升至中等水平。一旦企业买方在年度 ESG 报告或 CDP 问卷中公开披露采购了 Climeworks
              的碳信用，中途改换竞对将带来叙事口径不一致的瑕疵，极易引来 ESG 审计团队与投资者的严格质询。这种心理与合规惯性为 Climeworks 筑起了软性客户留存壁垒，即便竞对开出更低报价也难以轻易撬动。


              Climeworks 的销售渠道优势体现在：服务于 160+ 家企业客户的直销团队；接入 Carbonfuture 碳交易平台生态（覆盖 Microsoft、Swiss Re、先行者联盟 First Movers
              Coalition 等）；以及拥有 18,000+ 散客的个人按月订阅网络。相比之下，1PointFive 的直销体系尚在起步且完全缺失零售个人端；Heirloom 的销售则深度倚重美国政府关系（DOE Hub
              计划）与 Frontier Climate 的前瞻采购基金。


              对 Climeworks 而言，最具杀伤力的反向竞争证据集中在三点：(1) Mammoth 实际运转严重不及铭牌产能（投产前 10 个月实际捕集仅约 105 吨，远低于 36,000 t/yr
              目标），直接动摇了公司宣称自己为“全球经验最丰富”DAC 运营商的核心说法；(2) 2025 年 5 月高达 22% 的大幅裁员暴露出其面临的财务承压，很可能波及研发与 Gen3 的既定投产排期；(3) 若
              1PointFive 旗下的 Stratos 在 2025–2026 年实现哪怕 100,000 t/yr 的年产出，也将瞬间超越 Climeworks 成立以来的全部历史交付总量（按 CDR.fyi 统计累计仅
              1,186 吨），彻底颠覆行业对谁是领头羊的既有认知。
            claimRefs:
              - CP001
