      - number: '1.5'
        title: 附图与核心洞察
        blocks:
          - type: callout
            title: DAC 领域交付领跑者
            body: >
              Climeworks 是直接空气捕集领域当之无愧的交付领跑者，截至 2025 年 H1 约占全球已交付 DAC 碳去除总吨数的 81%。凭借 421 笔采购订单（超过其他任何 DAC
              供应商），公司在尚处起步阶段的新兴赛道中展现出无可比拟的商业落地与执行力。
            calloutType: strength
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: callout
            title: 工厂实际产出严重不及预期
            body: >
              Orca 与 Mammoth 实际捕集量均大幅跌破铭牌产能。Mammoth 投产前 10 个月实际捕集仅约 105 吨，对比 36,000 t/yr 的设计目标完成率不足
              1%——这不仅对滤芯技术在工业化规模下的可靠性打上巨大问号，也动摇了公司能否如期交付在手签约信用的能力。
            calloutType: risk
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: callout
            title: 遭遇挫折仍逆势拿下 $1B+ 融资
            body: >
              尽管实际运营严重受挫，Climeworks 仍在 2025 年凭一笔由机构投资者领投的 $162M 融资，正式跨过累计融资 $1 billion 门槛；资方仍坚定押注 DAC
              技术的长期前景。这释放出清晰信号：资本供给并未断裂，但市场迫切要求公司交出降本与实际运营的有力证据。
            calloutType: insight
            claimRefs:
              - CO001
