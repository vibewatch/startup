  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定与业务边界
        blocks:
          - type: paragraph
            body: >
              Climeworks
              所处的直接目标市场是自愿碳去除（CDR）市场，尤其由直接空气捕集（DAC）主导的长效/永久工程化碳去除细分赛道。该领域显著有别于更宽泛的自愿碳市场（VCM）：后者主要涵盖基于自然的抵消类项目（如植树造林、REDD+、土壤固碳），交易价格在
              USD 5–30/t，质量保障体系较弱。长效工程化 CDR 凭借地下封存数千年乃至更久的永久性、精准可测量性与无可争议的额外性，在市场上享有 USD 200–2,000/t 的高昂溢价。


              在 DAC 细分市场内部，主要存在两大技术流派：一是以固体胺类吸附剂为主的固体 DAC（S-DAC），以 Climeworks 为典型代表；二是以氢氧化钾溶液为主的液体 DAC（L-DAC），代表企业为
              Carbon Engineering（现已并入西方石油旗下子公司 1PointFive）。得益于 Climeworks 早期商业化落地的先发优势，S-DAC 在 2024 年斩获了 DAC 市场约 56.73%
              的收入份额。下游应用场景由碳捕集与永久地质封存占据绝对主导（占市场 78.27%），即捕集的 CO2 永久注入地下，而非用于工业产品制造。


              该市场的边界严格排除了几类相邻领域：工业点源碳捕集与封存（CCS，针对电厂或工厂烟气）、生物能源碳捕集与封存（BECCS）以及碳利用（CCU，转化为燃料或化工原料）。上述替代品虽同在争夺企业 ESG
              预算，却无法提供同等品质的大气净去除效果。Climeworks 聚焦大气碳去除核心赛道，其主营业务不涉足碳减排/碳避让或碳利用类产品。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: 市场规模测算：多视角下的 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              相较于远大愿景，如今 DAC 实际市场体量极小。Grand View Research 测算，2024 年全球 DAC 市场规模仅为 USD 97.56 million，预计将以 61.15%
              的复合年增长率（CAGR）在 2030 年达到 USD 1.699 billion。MarketsandMarkets 给出的预测几乎一致：到 2030 年达 USD 1.727 billion，CAGR 为
              60.9%。这类券商与机构预测反映了资金流向与规划产能，但均建立在面临巨大履约执行风险的已公布项目之上。


              国际能源署（IEA）提供了更为清醒的评估视角：截至 2024 年，全球投运的全部 27 座 DAC 工厂年捕集总量不足 0.01 Mt CO2——距离 2050 净零排放（NZE）情景所要求的 80 Mt
              CO2/yr 相去甚远。即便规划中的 130+ 个 DAC 项目到 2030 年均如期以全额铭牌产能运转，全球实际 DAC 年产出也仅约 3 Mt CO2/yr，占气候目标的比例不足
              4%。这一产能履约断层，是透视 DAC 市场近期现实最关键的事实。


              从买方需求侧看，CDR.fyi 数据显示，截至 2026 年全球所有长效 CDR 供应商累计交付量为 1.36 million 吨，对应已承诺市场总价值 USD 12 billion——折合实际平均单价约 USD
              8,800/t。这一加权均价被早期高价订单推高，未来将随着供应放量回落。Frontier 承诺到 2030 年完成 USD 1 billion 采购，为近期确定性需求提供了锚点。Climeworks 拥有的
              380,000+ 吨在手订单在当前初生市场中占据可观份额，但对照气候目标依然微不足道。


              Climeworks 在 2025–2030 年的可获取市场（SOM）受到实体工厂产能的硬性约束：Mammoth 铭牌产能仅为 36,000 t/yr（且 Gen2 架构前 10 个月实际仅交付约 105
              吨），而 Gen3 的工业级扩产尚需 USD 1–2 billion 的追加资金。到 2030 年，Climeworks 相对现实的 SOM 为 50,000–200,000 吨实际交付去除量，对应 USD
              50–200 million 营收——在 USD 1.7 billion 的市场远期预测中占比不足 1%。
