chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 创立历程、历史沿革与公司架构
        blocks:
          - type: paragraph
            body: >
              机械工程师 Christoph Gebald 与 Jan Wurzbacher 在 ETH Zurich 攻读博士期间相识，并于 2009 年共同创立 Climeworks
              AG。两人的博士课题专注于直接空气捕集技术（直接从大气中提取 CO2），奠定了公司的科研基石。Climeworks 作为高校衍生初创企业自 ETH Zurich
              分拆独立，这一起点为其赢得了学术背书与早期机构支持。


              2011 年，公司获得首笔外部融资，用于研制模块化原型机。到 2014 年，Climeworks 造出可运行的模块化 CO2 收集器，验证了从实验室台架走向工业工程化的可行性。2017 年 5
              月，公司首座商业化设施在瑞士 Hinwil 一处垃圾焚烧厂房顶落成，配置 18 个收集集装箱，年捕集能力约 900 吨 CO2。捕集的 CO2 销往周边温室大棚种植商，并供 Coca-Cola HBC 用于灌装
              Valser 气泡水。2017 年 10 月，Climeworks 携手合作伙伴 Carbfix 在冰岛启动 CarbFix2 示范项目，探索 CO2 地下矿化技术。这场关键试验决定了 Climeworks
              日后的战略转向：从 CO2 资源化利用全面转向地下永久封存。随着公司坚定走向“封存优先”，Hinwil 设施于 2022 年 10 月正式停运。


              公司总部设在瑞士苏黎世，并在德国科隆设立子公司。董事会成员包括联合创始人 Dr. Gebald 与 Mr. Wurzbacher（联合 CEO）、Alfred Gantner（Partners Group
              联合创始人）、Dr. Ulf Berg、Dr. Martin Burkhardt、Syrie Crouch 以及 Dr. Maurits van Tol。经历 2025 年 5 月裁员 106
              人（22%）后，截至 2025 年初 Climeworks 全职员工约 377 人。
            claimRefs:
              - CO001
              - CO002
              - CO003
