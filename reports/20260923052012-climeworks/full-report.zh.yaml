      - number: '7.4'
        title: 风险缓解措施、核心监测指标与逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >
              Climeworks 的主要风险对冲手段包括：（1）寄望 Gen3 摆脱 Gen2 在成本和可靠性上的瓶颈；（2）2025 年 1 月获得的 $162M 融资延长了现金跑道，能撑过 Gen3
              的关键验证期；（3）引入 Swiss Re 的履约保险兜底，稳定客户对交付品质的信心；（4）推动地域与客群多元化（在 5+ 个国家布局 Gen3 选址，覆盖 7 大行业的 160+
              家客户）。这些缓解举措切实有效，但若遭遇 Mammoth 彻底停摆与 Project Cypress 被撤销拨款的双重极端打击，仍显单薄。


              投资人需要紧盯的核心监测指标：（1）Mammoth 投入运转的集装箱模块数量（目标是截至 2025 年底达到 72/72）；（2）Project Cypress
              能源部拨款动向（紧密跟踪官方暂停或撤资通告）；（3）Climeworks 下一轮融资表现（募资条款与估值水平将直接反映市场是否买单 Gen3 叙事）；（4）Gen3
              商业工厂奠基动工时间；（5）裁员后核心技术团队的主动流失率；（6）任何涉及合同调整的客户公开表态。


              投资逻辑破裂触发点：首要的逻辑破裂点在于，若截至 2025 年 Q4（Q4 2025）Mammoth 的运转集装箱数量仍无实质改善，即证实 Gen2 架构存在硬伤，Gen3
              势必因此延期以规避同类设计缺陷。第二重破裂点是 Project Cypress 失去能源部资助，且在 6 个月（6
              months）内未能落实替代资金。第三重破裂点是有客户公开削减或退出采购承诺，宣示「你下单我就建厂」的商业共识破裂。
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、隐含定价与可比交易
        blocks:
          - type: paragraph
            body: >
              参照当年媒体将 2022 年 4 月 Series C 轮（$650M）称为「独角兽」级融资的报道，Climeworks 该轮对应的投后估值估计在 $1–2B。2025 年 1 月的 $162M
              融资规模显著收缩（单轮募资额缩水 75%），且未公开披露新估值；结合 Mammoth
              投产不顺的大背景，本轮规模收窄既可能是出于团队控制资本开支的主动收缩，也可能反映出机构投资意愿降温——无论哪种情况，均指向平价或降价融资（down round）。


              公开市场上最具参考价值的并购标杆，是 Occidental 于 2023 年 8 月出资 $1.1B 收购 Carbon Engineering；后者当时属于商业化前的 DAC
              技术公司，交付量为零，仅完成中试验证。理论上，在运转顺畅的并购市场中，Climeworks 拥有长达 4 年（4-year）的商业化交付记录（Orca）、更庞大的客户订单簿以及获得验证的 Gen3
              技术，估值理应较 Carbon Engineering 享受溢价。然而，Mammoth 的停摆带来了巨大的折价风险。


              目前尚无专注于 DAC 的纯正上市公司，导致估值倍数缺乏直接可比坐标。在乐观情景下，硬科技气候基础设施公司的交易倍数通常落在预期收入（而非当期收入）的 5–15×；而按照 Climeworks 当前约 $2M
              的实际履约收入运行率，哪怕按 10× 估算，对应的企业价值也只有 $20M——这直接说明其当前估值全然取决于未来期权价值，而非当期财务指标。Heirloom Carbon（2022 年融资 $50M，估值约
              $200–300M）与 Sustaera（未公开种子轮）体量更小且运营积淀浅于 Climeworks，从侧面佐证了 Climeworks 的溢价龙头地位。
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: table
