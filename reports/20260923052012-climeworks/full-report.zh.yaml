              - CO003
          - type: callout
            title: 下一轮注资前须锁定运营达标硬证据
            body: |
              潜在投资方在推进下一轮出资前，应要求公司拿出针对 Mammoth 滤芯技术的明确运营修复计划、提供关于已交付与在手合同信用的独立第三方审计报告，并明确 Mammoth 达到至少 50% 铭牌产能的可信达成路径。
            calloutType: recommendation
