      - number: '4.4'
        title: 资金充裕度、极端压力情景与财务尽调终审
        blocks:
          - type: paragraph
            body: >
              Climeworks 估计年均烧钱规模在 USD 80–150 million，折算下来 2025 年获得的 USD 162M 融资仅能提供约 12–24 个月的现金跑道。这使得 2026 年中至 2026
              年末成为决定其生死存亡的关键财务窗口期：届时公司必须满足以下三选一条件：(1) 拿出足以支撑下一轮 Series D 大额股权融资的 Mammoth 产能修复数据；(2)
              成功敲定美国能源部（DOE）后续补贴或欧洲官方公共资金支持；(3) 凭借锁定的长协现金流撬动银行认可的项目融资贷款。


              路易斯安那州 Project Cypress 的 DOE 补贴风险是最为重大的单点资本事件：一旦特朗普政府叫停逾 USD 500M+ 的联邦非稀释性拨款，Climeworks
              将被迫转向纯股权融资填补资金缺口——在当前运营故障缠身背景下，融资条款大概率更为苛刻。这不仅将迫使下一轮融资大幅提前，更潜在引爆估值倒挂（Down-round）的严峻风险。


              极端悲观情景极为残酷：若 Mammoth 产能利用率直至 2026 年始终卡在 5% 以下，叠加 Project Cypress 资助被撤，以及来自 Stratos 与 Heirloom
              的步步紧逼，公司极可能被迫以低于上一轮隐含 $1B+ 的惨淡估值接受困境救助融资。而乐观情景同样存在实现空间：若 Mammoth 在 2025 年将有效产能拉升至 30%，Gen3 于 2026
              年顺利启动商业化部署，公司便有望依托回暖的实际运营数据以 $300M+ 的体量完成 Series D 轮融资。


              财务尽调终审：Climeworks
              的收入模式在底层逻辑上完全成立（长周期订单驱动、按月订阅底盘稳健、高端企业客户付费意愿强烈），但对照其庞大的刚性成本基底，当前业务在实质上仍处于“商业化前营收”（Pre-revenue）阶段；在交付断层彻底弥合之前，持续的高速失血将严重削弱后续资本追加投入的合理性。开展独立的深度财务尽调，必须要求获取完整的全套虚拟数据室（Data
              Room）底稿权限。
