  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像全景、细分客群结构与获客渠道拓展
        blocks:
          - type: paragraph
            body: >
              截至 2025 年，Climeworks 的客户群体覆盖 60+ 个国家，拥有 160+ 家企业客户与 18,000+
              名个人订阅用户。企业客群横跨七大主流行业：专业服务与咨询（BCG、Capgemini，以及经由 Frontier 采购的 McKinsey）；金融服务（Morgan Stanley、Swiss
              Re）；科技与软件（Microsoft、SAP、TikTok，以及经由 Frontier 采购的 Stripe、Shopify、Alphabet）；航空（British
              Airways）；航运（MOL、NYK）；零售与消费品（Coca-Cola HBC）；以及工业制造。按合同金额看，科技与金融服务业占了签约采购量的大头。


              客户拓展历经三个阶段：（1）2017–2021 年：靠直销拿下早期尝鲜客户，并吸纳温室种植、饮料等 CO2 利用类买家；（2）2021–2023 年：切入 Frontier AMC
              采购联盟（Microsoft、Stripe、Shopify、Alphabet、McKinsey），启动早期专注 CDR 的企业直销；（3）2023–2025 年：凭借标杆大单加速跑量（BCG 80,000
              t、Morgan Stanley 40,000 t、SAP 37,000 t），并打入航运与数字消费等新领域。Frontier AMC 是关键转折点：Stripe、Shopify 与 Alphabet
              的早期注资，经受住了 CDR 市场最为严苛的质检检验，确立了 Climeworks 的交付品质，随之撬动了下一批采购方。


              获客渠道主要有四类：B2B 企业直销（主力渠道）、Carbonfuture 交易市场（辅助渠道）、Frontier AMC 履约交付，以及面向个人的线上订阅。大型企业客户的成单周期预计在 6–18
              个月，需要对接可持续发展、采购、法务和财务多方团队。个人订阅渠道几乎不需要销售人力投入，既提供了可预测的经常性现金流，又沉淀了品牌口碑。
