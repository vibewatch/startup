companyProfile:
  summary: >
    Climeworks 是全球实际运行经验最丰富的直接空气捕集（DAC）企业，由工程师 Christoph Gebald 与 Jan Wurzbacher 于 2009 年创立，脱胎于 ETH Zurich。公司在冰岛
    Hellisheiði 地热田先后建成并运营 Orca（4,000 t/yr，2021 年）与 Mammoth（铭牌产能 36,000 t/yr，2024 年）两座工厂，凭自研固体胺吸附剂技术捕集大气中的 CO2，并交由
    Carbfix 永久矿化封存于玄武岩中。截至 2025 年，Climeworks 拥有 160+ 家企业客户与 18,000+ 名个人订阅用户，锁定 6M 吨（600 万吨）在手合同；但公司眼下陷入严峻运营危机——Mammoth
    投产前 10 个月实际仅捕集约 105 吨，远低于 36,000 t/yr 的铭牌产能。公司未来的破局点押注在 Gen3 技术上（2024 年 6 月在 Basel 完成验证）：目标是在 2027–2028
    年商业化规模下，将捕集成本压至 $250–350/t，同时把单模块通量提升至 2×。
