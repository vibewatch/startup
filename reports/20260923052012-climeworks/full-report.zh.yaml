      - number: '6.3'
        title: 客户留存、流失、反向信号与合同结构
        blocks:
          - type: paragraph
            body: >
              Climeworks 具备天然的客户留存结构：长达 5–15 年的远期采购协议带来合同锁定，而 ESG 披露的一致性要求带来了软性留存（更换 CDR 供应商必须向外部审计与投资人解释原因）。Swiss
              Re、Partners Group 及 Microsoft 等深度捆绑关系（既是股东又是客户，或兼具买方与生态伙伴身份），让解约退出在财务与声誉上面临极高代价。


              目前没有企业客户公开宣布解除或削减合同。但缺乏公开负面事件并不等于客户必然满意：买方往往负有保密义务，且首批多年期合同签署仅 3–5 年，多数尚未触及续约决策节点。真正的留存考验将在 2026–2028
              年的续约周期到来。


              最具杀伤力的反向信号处于潜伏状态：Mammoth 产能兑现严重脱节（10 个月仅出产 105 t，远低于 36,000 t/yr
              的标称产能），导致当初指望每年入账数百至数千吨碳信用的签约企业，实际拿到手的额度微乎其微。尽管不可抗力条款很可能在法律上保护
              Climeworks，但连年交付欠收必然会在续约时引发买家不满。目前尚无客户公开援引不可抗力条款或发起纠纷。


              客户集中度风险处于中等水平：BCG、Morgan Stanley 与 SAP 合计采购约 157,000 t，仅占全部 6M 签约吨数的约
              2.6%，总量上的客户集中度并不高；但短期内可供交付的额度，可能高度向这几家主力大客户倾斜。
