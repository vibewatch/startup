  topStrengths:
    - 全球运营经验最丰富的 DAC 厂商：Orca 运转逾 3 年、Mammoth 达 1 年，累计交付 1,081 吨经核证的 CDR。
    - Gen3 技术在 Basel 完成验证：较 Gen2 通量翻倍、能耗减半、滤芯寿命增至 3 倍——若商业化规模部署顺利，将走出一条通往 $250–350/t 的可行路径。
    - 高质量客户群：BCG（80,000 t）、Morgan Stanley（40,000 t）、SAP（37,000 t）、Swiss Re（集投资方、买家、承保方于一身）——构成 DAC 领域最硬核的企业客户背书。
    - 已锁定 600 万吨合同，对应 $2.4B 面值订单储备，证明即便在当前溢价水平下，长期买家需求依然明确。
    - 结构性监管红利护航：EU CRCF、SBTi、CORSIA、IMO 2050 以及 IRA 45Q（$180/t）共同拉动 Climeworks 客户垂直领域的长期 CDR 需求。
  topRisks:
    - Mammoth 实际产出仅为 36,000 t/yr 设计产能的 0.3%（72 个捕集舱仅 12 个运行，10 个月仅捕集约 105 t）——根本原因未见公开，修复时间表亦不明朗。
    - Project Cypress（DOE Hub，最高获 $500M+ 资助）面临 Trump 政府审查；若失去政府资金支持，美国规模化进程或推迟 3–5 年甚至取消。
    - 现金跑道仅余 12–24 个月（2025 年 1 月融资 $162M，年烧钱速度 $80–150M），而 Gen3 商业化部署需要 $8–14B 的 CapEx 资本开支。
    - Gen3 结构化吸附剂技术从未在商业规模下部署；规模化一旦遇挫，其 2030 年成本平价路线图将不复成立。
    - 裁员 22%（483 名员工中裁减 106 人）带来关键人才流失风险，且在最需要人手的关键节点制约了 Mammoth 的抢修能力。
  unresolvedGaps:
    - Mammoth 72 个捕集舱中 60 个停摆的根本原因未见公开披露——这是整个尽职调查中最重要的信息缺失。
    - 股权结构表、优先股堆叠及 2025 年融资估值均未公开披露；新投资方承担的稀释风险无法量化。
    - Project Cypress 的 DOE 资助状态变化迅速，且自本报告撰写以来或有新变动；投资方应直接核实最新进展。
    - Gen3 商业化工厂的资本支出预算、融资结构（债权对股权及 45Q）以及具体场址的封存地质证实情况均未公开。
