- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk Factor
  - Thesis-Break Trigger
  - Monitoring Indicator
  - Action if Triggered
  rows:
  - - Mammoth recovery
    - Container count <30/72 by end of 2025
    - Monthly operational update from Climeworks
    - Escalate diligence; model Gen3-only scenario; re-price
  - - Project Cypress DOE funding
    - Official pause or cancellation notice issued
    - DOE OCED public notices; Congressional appropriations
    - Model Gen3 US delay of 3–5 years; assess LP impact
  - - Financial runway
    - No Series D announced by Q3 2026
    - Cash balance disclosure; next round announcement
    - Assess distressed financing risk; reduce position
  - - Customer defection
    - Named customer announces contract reduction or exit
    - Press monitoring; CDR.fyi delivery data
    - Assess reputational contagion; customer churn model
  - - Gen3 commercial scale failure
    - Gen3 cost exceeds $500/t at first commercial plant
    - First Gen3 plant operational data disclosure
    - Model alternative cost scenarios; consider exit
  - - Key person departure
    - Gebald or Wurzbacher announces departure
    - Public LinkedIn/company announcement
    - Immediate leadership team assessment; hold investment
  notes: 'Thesis-break triggers are defined as conditions that would, in isolation, require a material

    reassessment of the investment case. Multiple triggers simultaneously would constitute a

    strong thesis-break signal.

    '
  claimRefs:
  - CR001
  - CR002
