claims:
  - id: CO001
    statement: |
      Climeworks was founded in 2009 by mechanical engineers Christoph Gebald and Jan Wurzbacher,
      who conducted PhD research on direct air capture technology at ETH Zurich and spun out
      the company as a university spin-off.
    type: third-party-reported
    topic: founding history
    confidence: high
    freshness: historical
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO001
  - id: CO002
    statement: |
      Climeworks operates a dual business model: proprietary solid sorbent Direct Air Capture
      (DAC) technology that extracts CO2 from ambient air, and Climeworks Solutions that designs
      and manages blended carbon removal portfolios combining engineered and nature-based removals.
    type: company-claimed
    topic: business model
    confidence: high
    freshness: current
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO002
  - id: CO003
    statement: |
      Climeworks AG is headquartered in Zurich, Switzerland, with a German subsidiary in Cologne
      opened in 2019. Its two major commercial plants are located near the Hellisheiði geothermal
      power station in Iceland.
    type: third-party-reported
    topic: headquarters and locations
    confidence: high
    freshness: current
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO003
  - id: CO004
    statement: |
      In April 2022, Climeworks raised CHF 600 million (approximately USD 650 million) in a
      Series C equity round led by Partners Group and GIC (Singapore sovereign wealth fund),
      with additional investors including Baillie Gifford, Carbon Removal Partners, Global
      Founders Capital, M&G, and Swiss Re.
    type: third-party-reported
    topic: funding history
    confidence: high
    freshness: historical
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO004
  - id: CO005
    statement: |
      In 2025, Climeworks secured USD 162 million in additional equity funding—the largest
      carbon removal investment of 2025 globally—led by BigPoint Holding and Partners Group,
      with participation from existing investors, bringing total funding since inception to
      over USD 1 billion.
    type: third-party-reported
    topic: funding history
    confidence: high
    freshness: current
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO005
  - id: CO006
    statement: |
      In May 2025, Climeworks laid off 106 employees, representing 22% of its 483-person
      pre-layoff workforce, citing unfavorable market conditions, shifting US climate policy,
      and the need to cut costs toward profitability.
    type: third-party-reported
    topic: workforce and headcount
    confidence: high
    freshness: current
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO006
  - id: CO007
    statement: |
      Climeworks launched Orca, the world's first large-scale commercial Direct Air Capture
      and permanent storage facility, in Iceland in September 2021 near the Hellisheiði
      geothermal power station. The plant's nameplate capacity is up to 4,000 tonnes of CO2
      per year.
    type: third-party-reported
    topic: operational plants
    confidence: high
    freshness: historical
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO007
  - id: CO008
    statement: |
      Climeworks inaugurated Mammoth, the world's largest direct air capture and storage facility,
      in Iceland in May 2024. The plant has a nameplate capacity of up to 36,000 tonnes of CO2
      per year and is built on a 72-container modular design.
    type: third-party-reported
    topic: operational plants
    confidence: high
    freshness: recent
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO008
  - id: CO009
    statement: |
      Mammoth captured approximately 105 tonnes of CO2 in its first ~10 months of operation,
      representing less than 1% of its 36,000-tonne annual nameplate capacity. This underperformance
      was caused by filter performance issues and delays in installing additional collector containers.
    type: third-party-reported
    topic: plant performance
    confidence: high
    freshness: current
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO009
  - id: CO010
    statement: |
      As of early 2025, only 12 of Mammoth's planned 72 collector containers were fully
      operational, as Climeworks halted further installations after discovering the Gen2 filter
      design was performing worse than expected in field conditions.
    type: third-party-reported
    topic: plant performance
    confidence: high
    freshness: current
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO010
  - id: CO011
    statement: |
      Climeworks' Generation 3 DAC technology, validated at full scale in June 2024 at its
      Basel, Switzerland testing facility, doubles CO2 capture capacity per module, halves
      energy consumption, and extends filter material lifetime by approximately 3x compared
      to prior generations.
    type: company-claimed
    topic: technology development
    confidence: high
    freshness: recent
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO001
  - id: CO012
    statement: |
      Climeworks' Generation 3 technology targets overall cost reduction of up to 50%, with
      goals of USD 250–350 per tonne captured and USD 400–600 per tonne net removal by 2030,
      compared to current individual-subscriber pricing of approximately USD 1,000 per tonne.
    type: company-claimed
    topic: cost targets
    confidence: high
    freshness: recent
    sourceRefs:
      - SO001
      - SO004
    answersQuestionRefs:
      - QO002
  - id: CM001
    statement: |
      The global direct air capture (DAC) market was estimated at USD 97.56 million in 2024
      by Grand View Research, with a projected CAGR of 61.15% from 2025 to 2030, reaching
      USD 1,699.33 million by 2030, driven primarily by corporate net-zero commitments and
      government policy incentives.
    type: third-party-reported
    topic: market sizing
    confidence: medium
    freshness: current
    sourceRefs:
      - SM001
    answersQuestionRefs:
      - QM001
  - id: CM002
    statement: |
      MarketsandMarkets published a concurrent forecast projecting the global DAC market to
      reach USD 1,727 million by 2030 at a 60.9% CAGR, closely aligned with the Grand View
      Research estimate and confirming broad analyst consensus on the trajectory.
    type: third-party-reported
    topic: market sizing
    confidence: medium
    freshness: current
    sourceRefs:
      - SM002
    answersQuestionRefs:
      - QM002
  - id: CM003
    statement: |
      The International Energy Agency (IEA) identifies direct air capture as one of few
      technologies capable of removing CO2 from the atmosphere at scale and views it as
      essential for achieving the 2050 net-zero scenario, which requires removing roughly
      980 Mt CO2/yr from the atmosphere by mid-century.
    type: third-party-reported
    topic: market drivers
    confidence: high
    freshness: recent
    sourceRefs:
      - SM001
      - SM004
    answersQuestionRefs:
      - QM003
  - id: CM004
    statement: |
      As of late 2024, the IEA counted 27 DAC plants commissioned globally across Europe,
      North America, Japan, and the Middle East. Only three of those plants were capturing
      1,000 tonnes of CO2 per year or more: Climeworks' Orca in Iceland, the Global
      Thermostat headquarters plant in Colorado, and Heirloom's first large-scale facility
      in California.
    type: third-party-reported
    topic: competitive landscape
    confidence: high
    freshness: current
    sourceRefs:
      - SM001
      - SM004
    answersQuestionRefs:
      - QM004
  - id: CM005
    statement: |
      The IEA projects that if all currently planned DAC projects proceed and achieve full
      nameplate capacity, global DAC capture would reach approximately 3 Mt CO2 per year
      by 2030. This is more than 500 times the current capture rate but less than 5% of
      the 80 Mt CO2/yr needed to align with the IEA's Net Zero by 2050 scenario.
    type: third-party-reported
    topic: market sizing
    confidence: medium
    freshness: current
    sourceRefs:
      - SM005
    answersQuestionRefs:
      - QM005
  - id: CM006
    statement: |
      North America accounted for the largest regional revenue share of the DAC market in
      2024 at 46.79%, driven by the US 45Q tax credit, the Bipartisan Infrastructure Law's
      $3.5 billion DAC Hub program, and a high concentration of early-adopter corporate buyers.
    type: third-party-reported
    topic: geography
    confidence: medium
    freshness: current
    sourceRefs:
      - SM006
    answersQuestionRefs:
      - QM006
  - id: CM007
    statement: |
      Solid-DAC (S-DAC), the technology category used by Climeworks (solid sorbents),
      held the largest revenue share of 56.73% in the DAC market in 2024, while
      liquid-DAC (L-DAC), used by Carbon Engineering/1PointFive, held the remaining ~43%.
    type: third-party-reported
    topic: technology segmentation
    confidence: medium
    freshness: current
    sourceRefs:
      - SM007
    answersQuestionRefs:
      - QM007
  - id: CM008
    statement: |
      Carbon capture and storage (CCS/DACS) is the dominant end-use application, holding
      78.27% of the DAC market in 2024. Carbon utilization—converting captured CO2 into
      fuels, chemicals, or materials—accounted for the remaining ~22% and represents an
      alternate revenue pathway that Climeworks has historically deprioritized in favor
      of permanent storage.
    type: third-party-reported
    topic: market segmentation
    confidence: medium
    freshness: current
    sourceRefs:
      - SM008
    answersQuestionRefs:
      - QM008
  - id: CM009
    statement: |
      The World Resources Institute (WRI) estimated that approximately 150 DAC companies
      existed globally as of early 2025, up from just a handful a decade prior, and that
      around 36 operational DAC plants existed worldwide, with hundreds more in development
      or early planning stages.
    type: third-party-reported
    topic: competitive landscape
    confidence: medium
    freshness: current
    sourceRefs:
      - SM001
    answersQuestionRefs:
      - QM009
  - id: CM010
    statement: |
      Microsoft has purchased more than 80% of all carbon removal credits issued to date as
      tracked by CDR.fyi and WRI, making it by far the single largest buyer in the durable
      carbon removal market and creating a structural concentration risk for the nascent
      DAC industry.
    type: third-party-reported
    topic: buyer concentration
    confidence: medium
    freshness: current
    sourceRefs:
      - SM002
    answersQuestionRefs:
      - QM010
  - id: CM011
    statement: |
      Frontier Climate, an advance market commitment (AMC) backed by Stripe, Shopify,
      Alphabet, McKinsey, and others, has committed more than USD 1 billion to purchase
      high-quality permanent carbon removal credits including DAC through 2030, with
      Climeworks as a named supplier.
    type: third-party-reported
    topic: buyer segments
    confidence: high
    freshness: current
    sourceRefs:
      - SM001
      - SM004
    answersQuestionRefs:
      - QM001
  - id: CM012
    statement: |
