  - id: CV010
    statement: |
      Climeworks' dilution overhang is significant but not fully quantifiable from public
      information. Total equity raised to date (>$1B) at various valuation points has created
      a complex preferred share stack. Future capital raises required for Gen3 commercial
      deployment ($300–500M per plant) will be dilutive. If done as equity, each Gen3 plant
