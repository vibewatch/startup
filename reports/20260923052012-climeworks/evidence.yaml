      bonds, dilution is lower but operational guarantees and debt service add complexity.
      The preference overhang from prior rounds (Partners Group, GIC have likely negotiated
      liquidation preferences) means common equity holders face dilution before preference
      holders exit.
    type: inferred
    topic: dilution and preference overhang
