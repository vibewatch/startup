  - id: CV005
    statement: |
      In the base case (probability: 50%), Mammoth achieves partial recovery (30–50 containers
      online by end of 2025), Gen3 commercial deployment begins 2028–2029, Project Cypress
      is delayed but not cancelled, and Climeworks raises a follow-on round in 2026 at
      approximately flat or modest premium to 2025. Revenue at 2028 is approximately $5–15M/yr
      (Mammoth at 30–50% capacity + Orca); Gen3 first commercial revenue begins 2029. At
      3–5× revenue with heavy risk discount, fair value is $400M–$1B today. This implies
      a potential down round from the implied $1–2B Series C valuation—negative for existing
      investors but representing an entry opportunity for new investors at Series D pricing.
    type: inferred
