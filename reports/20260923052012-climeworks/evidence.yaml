  - id: CV002
    statement: |
      Occidental's acquisition of Carbon Engineering (CE) in 2023 for approximately $1.1B
      provides the most directly comparable M&A transaction. Carbon Engineering had not yet
      built a commercial DAC plant; it had completed feasibility engineering for 1PointFive's
      Stratos and had a multi-tonne pilot. CE's acquisition at ~$1.1B values a DAC technology
      company with no commercial plant and no delivered tonnes at approximately what Climeworks
      was implied to be worth post-Series C. The Stratos plant (now operational) potentially
      justifies a higher valuation for OXY's DAC division, but CE's pre-commercial acquisition
