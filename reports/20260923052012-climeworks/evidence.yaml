  - id: CV001
    statement: |
      Climeworks' implied post-money valuation from the April 2022 Series C ($650M raise led
      by Partners Group and GIC) is estimated at $1–2B. This was based on industry reporting
      suggesting the raise was at a "unicorn" valuation (>$1B). No official valuation disclosure
