    statement: |
      The IPO exit scenario for Climeworks is likely 5–8 years away at the earliest. A
      successful IPO would require: (1) 2+ commercial Gen3 plants delivering 100,000+
      t/yr; (2) revenue >$100M/yr; (3) visible path to EBITDA break-even; and (4) stable
      policy environment. Alternatively, strategic acquisition (by an oil major, industrial
      gas company, or energy transition fund) is possible at any point if the acquirer values
      technology, contracts, and team. M&A comps suggest a $1–3B acquisition price in 2026–2028
      if Climeworks demonstrates partial Mammoth recovery and Gen3 progress.
    type: inferred
    topic: exit strategy
