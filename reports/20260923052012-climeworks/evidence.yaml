  - id: CV004
    statement: |
      In the bull case (probability: 20%), Climeworks resolves Mammoth underperformance by
      Q4 2025, completes Gen3 commercial deployment at one location by late 2027, secures
      Project Cypress or equivalent US capital, and achieves 100,000+ t/yr delivery by 2028.
      In this scenario, Climeworks' revenue at $300/t × 100,000 t = $30M/yr at 2028
      (still loss-making) growing to $300M at $300/t × 1M t/yr by 2031–2032. At 5–8× revenue
      multiple (appropriate for a high-growth infrastructure company), fair value is $1.5–2.4B
      at 2028 and $6–12B at 2032. Discounted at 30% to today, the present value is $2–5B.
    type: inferred
    topic: bull case valuation
    confidence: low
    freshness: current
    sourceRefs:
