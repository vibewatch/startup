    statement: |
      Climeworks' most important comparable for revenue-based valuation is difficult to
      identify because no pure-play public DAC company exists. The closest public comparables
      are: (1) carbon capture infrastructure companies (NET Power, acquired; Carbon Clean,
      private); (2) renewable energy infrastructure (NextEra, Orsted) at 3–8× EBITDA (not
      applicable to pre-revenue DAC); and (3) deep-tech private companies at 10–20× projected
      revenue (applicable for early-stage, high-growth). At >$1B implied valuation with <$5M
      delivered revenue, Climeworks is valued on option value and future cash flows, not
      current metrics.
    type: inferred
    topic: valuation methodology
