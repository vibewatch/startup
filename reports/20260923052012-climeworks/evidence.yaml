    statement: |
      A key adverse valuation signal: the January 2025 $162M raise was notably smaller than
      the 2022 $650M Series C. This 75% reduction in round size is consistent with either:
      (1) Climeworks being selective about dilution (positive interpretation: company is
      confident); or (2) Climeworks being unable to raise the full amount it sought (negative
