  - id: CV003
    statement: |
      BloombergNEF's DAC market forecast suggests CDR credit prices could reach $200–400/tonne
      at commercial scale by 2030, falling from the current ~$1,000/t individual and $400–600/t
      enterprise pricing. This price trajectory is the foundation of Climeworks' bull case:
      as prices fall, total addressable market expands exponentially (lower prices → more buyers
      → more volume sold). The revenue-at-scale depends on whether Climeworks achieves Gen3's
      $250–350/t cost by 2030 and captures 10–30% of a 1 Mt/yr commercial DAC market.
