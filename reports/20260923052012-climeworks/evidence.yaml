  - id: CV007
    statement: |
      Climeworks' investment thesis rests on five pillars: (1) largest operational DAC fleet
      globally (Orca + Mammoth); (2) most comprehensive corporate customer base (160+ customers,
      6M contracted tonnes); (3) Gen3 technology with validated 2× throughput and 0.5× energy
      in Basel; (4) geographic diversification pipeline (5+ countries for Gen3); and (5) first
      permanent CDR delivery at commercial scale (Orca's ~1,081 tonnes of CORCs). Each pillar
      is real but currently under stress: Mammoth's performance undermines pillar 1, and the
      delivery gap undermines the customer proof quality of pillar 2.
    type: inferred
    topic: investment thesis
    confidence: medium
    freshness: current
    sourceRefs:
      - SV007
    answersQuestionRefs:
      - QV007
  - id: CV008
    statement: |
      The investment anti-thesis: Climeworks is a high-burn, pre-profitability climate
      infrastructure company that has not yet demonstrated the ability to operate its flagship
      plant at scale, faces potential defunding of its primary US growth vehicle, and must
      raise several billion dollars of capital before reaching cash flow break-even. The DAC
      market may be smaller and slower than projected if SBTi, CDP, or regulatory standards
      evolve in ways that reduce buyer willingness to pay premium prices for high-cost CDR.
      Competitors with lower-cost approaches (Heirloom's lime, Sustaera's low-temperature
      monolith) could capture market share before Climeworks achieves Gen3 cost parity.
    type: inferred
    topic: investment anti-thesis
