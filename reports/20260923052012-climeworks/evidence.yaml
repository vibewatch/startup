    statement: |
      In the bear case (probability: 30%), Mammoth cannot be repaired (structural Gen2 design
      flaw), Project Cypress is officially cancelled, and Climeworks' 2026 fundraise fails
      or is a down round at <$400M post-money. In this scenario, Climeworks may be forced into
      restructuring, asset sale (technology + customer contracts), or merger with a competitor.
      The technology and customer base would have significant value to an acquirer (Occidental,
      Microsoft-backed DAC SPV, or a sovereign energy company), but existing equity holders
      would face severe dilution or wipeout. Asset value in a distressed sale: $200–500M
