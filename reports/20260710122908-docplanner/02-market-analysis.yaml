- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation by region and product layer
  body: |-
    The strongest public signal on who uses the product versus who pays for it comes from Docplanner's own portfolio pages. Patients book for free across the consumer brands in Spain, Poland, Turkey, and Italy, so patients are clearly the user on the demand side but not usually the payer. Doctors, clinics, and provider groups are the more likely economic buyers because the pro products emphasize no-show reduction, visibility, messaging, AI notes, patient intake, finance, and clinic operations. That fits the independent market evidence as well: Mordor's Europe telehealth services report says providers held 55.34% of 2025 revenue, while Grand View says providers held 53.7% of Latin America telehealth revenue in 2023. Payers matter, but more as reimbursement and platform-shaping actors than as the direct customer in the retained Docplanner evidence.

    Segmentation also differs by geography. Germany looks discovery-plus-video heavy from Jameda's current page, while Brazil and Latin America in general look more favorable to ambulatory cloud, private-provider modernization, and clinic-management cross-sell. Black Book and its Newswire release emphasize that Spanish-speaking Latin America is not one buyer environment at all: Mexico, Chile, Colombia, Peru, and Argentina have stronger private-enterprise modernization logic, while other markets are more constrained or more shaped by public rails. In Europe, the EU-level interoperability agenda, cloud adoption, and teleconsult normalization matter more, but country procurement still differs. The practical implication is that Docplanner is selling into multiple buyer archetypes at once: solo doctors and small practices, multisite clinics, private-provider groups, and in some cases larger institutions through assets such as TuoTempo or Feegow.
