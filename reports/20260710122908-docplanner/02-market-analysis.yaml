  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-sam-model
    missingEvidence: Country-level monetized provider counts, country revenue mix, ARPU, and attach rates between marketplace and workflow products.
    whyItMatters: Without those inputs, public evidence can support TAM and growth logic but not a clean bottom-up SAM or SOM for Docplanner.
    diligencePath: Request country revenue mix, paid doctor counts, clinic count, and attach rates for pro / clinic-management modules.
    relatedQuestionRefs:
