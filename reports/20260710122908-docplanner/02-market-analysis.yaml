  - type: missing-source
    severity: material
    topic: payer-and-public-mix
    missingEvidence: Public evidence on what share of revenue or deployments depend on public systems, insurers, or payer-linked contracts.
    whyItMatters: The payer role is strategically important to adoption but underdisclosed in the retained company-specific source set.
    diligencePath: Request a segment map of private-practice, clinic-group, hospital, and payer/public revenue contribution by region.
