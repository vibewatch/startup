callouts:
- calloutType: insight
  title: The market is large, but the monetizable wedge is narrower than the headline TAMs
  body: Top-down digital-health and telehealth estimates show abundant category growth, but Docplanner only captures a subset where patient demand, provider workflow, and local-market execution can be sold together. That is a stronger thesis than a generic “big market” slide, but it is also more operationally demanding.
  claimRefs:
  - CM004
  - CM007
  - CM012
  - CM031
- calloutType: risk
  title: Country fit and implementation realism matter more than one-size-fits-all European or Latin American narratives
  body: The retained sources repeatedly warn that reimbursement, public digital rails, privacy cost, and implementation capacity vary by country. That means later underwriting should treat localization and workflow integration as core go-to-market risks, not secondary execution details.
