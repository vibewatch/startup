  topStrengths:
    - >-
      Large multi-country doctor and patient network with clear evidence of real booking volume and provider workflow
      usage.
    - >-
      Product has moved beyond marketplace discovery into integrations, practice software, and early AI documentation
      adoption.
    - >-
