    - Reduce growth and synergy assumptions
  - - Support / retention quality
    - Complaints intensify without retention proof
    - Support backlog or review sentiment worsens while NRR remains undisclosed
    - Assume lower revenue quality and higher churn risk
  notes: These triggers translate the public risk picture into observable diligence checkpoints or thesis-break events.
