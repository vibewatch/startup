- id: regulatory-and-health-data-risk
  title: Regulatory, privacy, and AI-health-data risk
  body: |-
    This company operates in one of the hardest regulatory intersections in software: health data, marketplace trust, and now AI-generated clinical documentation. Public materials make clear that Noa Notes touches consultation workflows directly, requires patient consent, and processes content that is functionally very close to the clinical record. GDPR already makes that a high-stakes compliance surface, and the risk does not stop with the baseline regulation. The EHDS regime raises expectations around cross-border health-data governance, while legal commentary on AI training highlights harder questions around lawful basis, data minimization, contractual permissions, and downstream model use.

    The key diligence point is not that Docplanner lacks controls; there is visible evidence of controls. The issue is that the compliance burden is moving upward while the product is moving deeper into sensitive workflows. ISO and GDPR statements on the Chrome listing, published integration requirements, and risk governance in the filing all help. But any investor underwriting significant upside from AI-enabled products should expect more scrutiny, more documentation, and potentially slower rollout than a consumer-SaaS playbook would imply. In that sense, regulation is not just a downside risk; it is a scaling constraint that could shape product velocity and margin.
