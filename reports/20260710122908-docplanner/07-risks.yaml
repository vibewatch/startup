    - Material breach, regulator inquiry, or consent-control failure
    - Any significant health-data breach or AI recording controversy
    - Reassess compliance capability and incident-containment maturity
  - - AI governance execution
    - Noa growth narrative outruns controls
    - AI product expands without clear lawful-basis, model governance, or attach-rate evidence
    - Haircut AI upside and demand stricter diligence conditions
