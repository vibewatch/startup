- id: people-execution-and-investment-verdict
  title: People, narrative, and residual-risk verdict
  body: |-
    Leadership and narrative risk are real, even if they are less immediately quantifiable than privacy or debt. Public investor pages still frame Docplanner as a founder-led growth story, which is often a strength in healthcare software, but the public record does not offer deep succession or bench detail. External trackers and acquisition history imply a large, increasingly complex organization, and customer-review complaints suggest that support quality and integration smoothness could come under strain as the product surface expands. Public enterprise advocacy is also thin, which limits confidence that the upper end of the customer base is as sticky as the SMB doctor base appears to be.

    Overall, the risk picture is serious but not disqualifying. The most important risks are not existential-market risks; they are executional and regulatory risks that can compress valuation, lengthen implementation cycles, or force additional capital. That distinction matters. It means the thesis can still work if management proves tighter cash discipline, clean AI governance, and continued operational reliability. It also means investors should not accept a simple growth narrative without requesting evidence on incident history, lender terms, AI governance, German integration milestones, and retention at the clinic or enterprise tier.
