      - number: '5.2'
        title: Architecture, integrations, and AI operating model
        blocks:
          - type: paragraph
            body: >-
              The technical surface that Docplanner exposes publicly is more concrete than most private healthcare SaaS
              companies. The integrations API is locale-aware, REST-based, and explicitly designed for third-party
              applications to connect to brand-specific country instances. The Noa Notes integration adds a second
              layer: PMS vendors can call a widget from their own UI, receive structured visit summaries, and push those
              outputs into the local record. That tells an investor two important things. First, Docplanner is trying to
              live inside other clinic systems rather than forcing full rip-and-replace. Second, the company is willing
              to expose enough of its workflow to become middleware inside partner stacks.


              The best outside proof comes from partners solving adjacent technical problems. Cronofy describes
              real-time two-way sync with Google Calendar, Office 365, Outlook.com, Apple, and Exchange so that patient
              booking reflects true physician availability. Flobotics shows the harder side of the architecture: many
              clinics still run old EHRs, so Docplanner has used RPA to bridge systems when native APIs are not enough.
              That is a scalable architecture choice only in a pragmatic sense, but it is exactly the kind of
              operational compromise that lets a marketplace-plus-SaaS product penetrate fragmented healthcare IT.
