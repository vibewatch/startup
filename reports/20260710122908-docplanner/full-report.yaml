      - number: '8.3'
        title: Bull, base, and bear scenarios plus downside triggers
        blocks:
          - type: paragraph
            body: >-
              A useful scenario frame starts with revenue multiples rather than pretending to know an internal DCF. The
              bear case values Docplanner like a good but pressured healthtech platform: 4x to 5x revenue, implying
              roughly €0.75 billion to €0.94 billion of value if leverage, regulation, and multiple compression
              dominate. The base case values it as a scaled vertical-SaaS leader with real workflow depth but incomplete
              premium proof: 5x to 6x revenue, or roughly €0.94 billion to €1.13 billion. The bull case assumes
              Docplanner can prove AI-enabled ARPU expansion, narrowing losses, and stronger enterprise retention,
              supporting a 7x to 8x range or about €1.32 billion to €1.51 billion.


              What moves the call is not the math; it is whether management can defend the assumptions underneath the
              math. The biggest downside triggers are the same ones identified in the risk chapter: capital needs before
              profitability, material privacy or AI-governance missteps, or evidence that integration cost remains too
              services-heavy. The biggest upside unlocks are equally clear: a clean debt story, strong retention, and a
              credible proof set that Noa is not just a feature but an economically meaningful product layer.
            claimRefs:
              - CV031
