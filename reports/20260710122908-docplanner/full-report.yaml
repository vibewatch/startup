      - number: '3.2'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              The retained official pages show that competitors package the same broad job in very different ways.
              Docplanner and its brand portfolio emphasize free patient booking plus doctor and clinic tools. Jameda
              publishes a clear bundle that escalates from a free listing to paid visibility, online appointment
              management, calendar software and certified video consultation, while Zocdoc publishes almost the opposite
              commercial posture: free provider tools plus pay-only-for-new-patient marketplace bookings. Practo splits
              its stack into Ray, a subscription clinic-management product, and Prime, a visibility and booking product
              for clinics and hospitals using platform-fee mechanics. Doctena positions itself around integrated agenda,
              patient portal, reminders, EMR connectivity and a voice assistant. Maiia similarly presents integrated
              agenda, teleconsultation, secure messaging and cabinet software, reinforced by Cegedim’s installed base.
              CGM’s CLICKDOC adds compliant video consultation from the incumbent-software side.


              This matters because competitors are not just feature checklists; they encode different economic
              commitments. Fixed-price annual packages such as Jameda make the competitive benchmark explicit.
              Low-commitment pricing such as Zocdoc lowers adoption friction but may resemble marketing spend more than
              sticky software. Subscription clinic software such as Practo Ray speaks to workflow depth, while
              enterprise extensions such as TuoTempo and CGM raise the comparison set toward heavier operational
              systems. In short, Docplanner is not only competing on who can attract patients; it is also competing on
              how much of the provider’s daily workflow each rival can capture, bundle and monetize.
