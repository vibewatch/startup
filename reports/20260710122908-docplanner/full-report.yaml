      - number: '1.2'
        title: Founding, funding, and expansion milestones
        blocks:
          - type: paragraph
            body: >-
              The historical record supports a company that scaled unusually quickly through a mix of capital raises,
              cross-border brand building, and acquisitions. TechCrunch reported a $1 million Series A in December 2012
              to take Docplanner from five operating European markets into five more. EU-Startups then documented a $10
              million Series B in 2015, by which point the platform was already reported in 25 markets with more than
              seven million monthly visitors and over 100,000 appointments booked each month. The 2017 financing round
              broadened the story from directory traffic to platform consolidation: EU-Startups said Docplanner had
              merged with Doctoralia, raised €15 million only ten months after a prior Series C, and would use the money
              to deepen SaaS capabilities and open Brazil and Mexico offices.


              The best-corroborated large round in the retained set remains the May 2019 Series E. TechCrunch, tech.eu,
              One Peak, and pharmaphorum all align on an €80 million round led by One Peak Partners and Goldman Sachs
              Private Capital that brought total funding to roughly €130 million. Those same sources describe Docplanner
              as increasingly hybrid by then: 1.5 million monthly bookings, around 30 million patients, more than 1,000
              employees, and clear intent to keep acquiring software assets. In November 2021, EU-Startups reported that
              Docplanner acquired Jameda and explicitly called the business a Polish unicorn, while Tracxn now records
              later acquisitions including Feegow Clinic in 2022 and MyDr in 2023. A 2024 Signalbase funding item adds a
              possible newer €140 million round, but because the retained evidence set did not surface a matching
              primary announcement from the company or named lead investors, that item is best treated as low-confidence
              context rather than canonical fact.
