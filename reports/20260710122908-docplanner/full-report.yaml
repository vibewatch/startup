  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The wrong way to size Docplanner is to call it a “digital health” company and stop there. Public evidence
              supports a much narrower practical market boundary. Docplanner's current and historical materials
              consistently show a combination of patient discovery and online booking on one side and provider-facing
              workflow software on the other. The company and its acquired assets do not sit squarely inside one classic
              category such as teleconsultation-only, hospital IT, or pure listing media. Instead, the monetizable core
              appears to be provider-paid ambulatory access and workflow software, with patient demand capture acting as
              the top-of-funnel advantage. That means very broad digital-health TAMs are directionally useful, but not
              directly equivalent to the spend pool Docplanner can realistically monetize today.


              Even so, the adjacent pools are undeniably large. Mordor estimates Europe digital health at USD 113.94
              billion in 2026 and Europe telehealth services at USD 37.94 billion in 2026, while MarketsandMarkets puts
              Europe telehealth and telemedicine at US$24.76 billion in 2025 on a path to US$42.04 billion by 2030.
              Grand View values Latin America telehealth at USD 6.21 billion in 2024 on a path to USD 22.83 billion by
              2030. Those numbers describe addressable terrain around Docplanner, but not its exact SAM. The retained
              public record does not provide monetized provider counts by country, country-level ARPU, or a breakdown
              between marketplace, pro-doctor, and enterprise-clinic revenue. The right conclusion is that the market is
              large and still growing, but Docplanner's actual capture opportunity sits inside a narrower wedge where
              patient demand capture and provider workflow software can be sold together.
            claimRefs:
              - CM001
              - CM004
              - CM007
