  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and feature depth by persona
        blocks:
          - type: paragraph
            body: >-
              Docplanner is not a single booking widget anymore; the public product surface clearly spans patients,
              individual doctors, and larger clinics. On the patient side, the marketplace still starts with
              find-a-doctor, instant booking, reminders, and opinion discovery. On the provider side, the company frames
              the value much more broadly: doctors get schedule management, online reputation, automated reminders,
              patient communication, digital records extensions, online payments, video visits, and now AI-assisted
              documentation. The clinic pitch is different again. Rather than selling only visibility, the group
              increasingly presents a workflow layer for patient experience, operations, and integration with existing
              systems.


              The strongest evidence that this is real product depth rather than marketing copy comes from how many
              adjacent surfaces now sit around the core agenda. Noa Notes can run inside Doctoralia or through a
              standalone workflow; the browser extension overlays browser-based EHRs; the PMS integration docs let third
              parties launch the widget and receive structured summaries; and Doctoralia Pro review pages tie the
              day-to-day value to reminders, records, visibility, and fewer no-shows. That combination matters for
              diligence because it pushes Docplanner toward a workflow operating system for ambulatory care, not just a
              paid directory.
