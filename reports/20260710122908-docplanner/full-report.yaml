            title: The market is large, but the monetizable wedge is narrower than the headline TAMs
            body: >-
              Top-down digital-health and telehealth estimates show abundant category growth, but Docplanner only
              captures a subset where patient demand, provider workflow, and local-market execution can be sold
              together. That is a stronger thesis than a generic “big market” slide, but it is also more operationally
              demanding.
