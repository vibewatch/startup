      - number: '2.4'
        title: Constraints, substitutes, and why country fit matters more than generic TAM
        blocks:
          - type: paragraph
            body: >-
              The market case is positive, but it is not frictionless. Europe still imposes GDPR complexity, fragmented
              reimbursement, AI-compliance costs, and digital-skill gaps; Latin America still requires
              country-by-country localization, uneven public digital infrastructure, and careful implementation
              planning. Those frictions matter because Docplanner's most plausible customers are often small or
              mid-sized providers that do not have unlimited budget or change-management capacity. That is why Mordor
              explicitly warns about high upfront digitization costs for SMEs and why Black Book stresses localization,
              implementation realism, and measurable operating value instead of monolithic platform pitches.


              Substitutes are also broader than direct competitors. For many providers, the outside option is still
              receptionist labor, telephone booking, legacy scheduling or EHR software, or public rails that absorb part
              of referral and record exchange. That means Docplanner's share gains depend on workflow compression,
              convenience, and integration more than on awareness alone. The underwriting implication is therefore
              disciplined: public sources support a large and expanding adjacent market, but they do not justify lazy
              TAM inflation. Later financial and valuation work should treat the opportunity as real, yet contingent on
              provider conversion economics, country fit, and higher-ARPU workflow upsell into clinics and enterprise
              settings.
            claimRefs:
              - CM018
              - CM019
              - CM029
              - CM030
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
