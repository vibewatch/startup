            body: >-
              Docplanner’s customer base is easiest to understand from the outside as a ladder. The entry point is
              patient demand. Consumers arrive through local doctor-discovery brands, search specialist pages, compare
              reviews, and book online for free. That traffic then turns into doctor acquisition: providers pay to
              improve visibility, manage agendas, reduce no-shows, and handle patient communication. Public pricing
              pages in Spain reinforce this doctor-first motion. The company exposes named plans with monthly
              subscription prices low enough to support a high-volume SMB sales model rather than a purely bespoke
              enterprise motion.


              The next step in the ladder is expansion. Public materials show add-ons such as Noa Notes, which uses the
              same Doctoralia credentials and adds AI documentation to an existing workflow. Reviews on Software Advice
              and GetApp repeatedly describe new-patient acquisition, reminders, and reputation management as the
              purchase trigger, which is exactly what one would expect from a marketplace-adjacent SaaS product. The
              harder part of the segment story is enterprise clinics and hospitals. They are clearly addressed in the
              product narrative, but the public evidence remains thinner than it is for individual doctors, suggesting
              the customer surface is still most transparent at the long-tail provider level.
