  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Docplanner does not face one neat peer set. The most direct competitors are other two-sided
              patient-booking and provider-workflow platforms, especially in Europe: Doctolib in France, Jameda in
              Germany, and local or regional booking brands such as Top Doctors and Doctena. Zocdoc is the clearest U.S.
              analog because it combines patient search, provider selection and booking, but its provider economics in
              the retained source set lean more heavily toward new-patient acquisition than full clinic operating
              software. Practo is another useful comparator because it sells both practice software and listing-led
              acquisition products, which is close to the mixed model Docplanner increasingly represents. At the other
              end of the field are incumbent software companies such as Cegedim and CompuGroup Medical that can add
              scheduling, messaging and teleconsultation to established clinical software estates without needing to own
              all consumer demand.


              The practical consequence is that competitive pressure changes by workflow. For patient discovery, the
              rivals are booking marketplaces and specialist directories. For doctor workflow, the rivals are
              scheduling, teleconsultation and practice-management vendors. For clinics and larger providers, the
              competition broadens again to enterprise workflow tools such as TuoTempo, Maiia and CGM products.
              Status-quo substitutes remain meaningful too: phone booking, front-desk staff, existing local software,
              and public or insurer rails can satisfy part of the job without adopting a branded marketplace. That means
              later underwriting should not ask whether Docplanner wins “the market”; it should ask which workflow
              layers are sticky, which are multi-homeable, and where local execution beats abstract feature breadth.
            claimRefs:
