      - Scenario
      - Core assumptions
      - Revenue multiple / logic
      - Implied valuation
      - Probability signal
      - Key downside / upside hook
    rows:
      - - Bear
        - Debt, losses, regulation, or AI skepticism dominate; growth quality disappoints
        - 4x to 5x revenue
        - €0.75B to €0.94B
        - Plausible if financing or compliance pressure rises
        - Downside driven by leverage, multiple compression, or execution drag
      - - Base
        - Scale, workflow depth, and category leadership hold, but AI premium remains only partly earned
        - 5x to 6x revenue
        - €0.94B to €1.13B
        - Most defensible from public evidence
        - Requires continued booking scale and stable execution without heroic assumptions
      - - Bull
        - Noa proves monetization, losses narrow, and clinic retention supports premium vertical-SaaS quality
        - 7x to 8x revenue
        - €1.32B to €1.51B
        - Possible but not yet evidenced publicly
        - Upside depends on AI ARPU, better margins, and cleaner financing story
    notes: Implied valuations are based on 2024 reported revenue of €188.688M and rounded for readability.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV036
      - CV037
      - CV038
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This table covers the full bear, base, and bull scenario set used for the chapter recommendation as of
        2026-07-10.
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric or status
      - Multiple / valuation / scale signal
      - Relevance to Docplanner
      - Limitation
    rows:
      - - Zocdoc
        - Marketplace-plus-booking reference
        - Growjo cites ~$240.8M revenue, ~$1.8B valuation, ~$375.9M funding
        - Closest marketplace-style premium anchor in the retained set
        - Third-party estimates; no primary current valuation filing
      - - Practo
        - Marketplace plus clinic-software workflow
        - Officially 10k+ clinics on Ray and 500+ Insta clients; Inc42 cites FY24 revenue and funding history
        - Useful regional comp for workflow-plus-discovery blend
        - Smaller scale and India-heavy model reduce direct comparability
      - - HealthTap
        - Digital-health / telehealth consumer brand
        - Officially 90k doctors and 109k+ reviews; Growjo estimates much smaller revenue scale
        - Helps bound consumer-health platform valuations below Docplanner scale
        - Business mix differs materially from booking + practice SaaS
      - - Infermedica
        - AI-health specialist benchmark
        - Official certifications and 30+ countries, but much smaller estimated revenue
        - Useful for AI-quality premium discussion
        - Not a marketplace and far smaller commercially
      - - Docplanner current context
        - Target company
        - Official €188.688M revenue; secondary ~$1B mark and reported €140M round
        - Direct anchor for scenarios
        - Round terms, preferences, and exact current price remain unclear
