      - number: '2.3'
        title: Growth drivers are real, but they work through interoperability, cloud, and chronic-care economics
        blocks:
          - type: paragraph
            body: >-
              The growth drivers behind Docplanner's market are not speculative. Europe has strong structural support
              from aging populations, chronic-care demand, reimbursement normalization, and formal interoperability
              policy. The EHDS is especially important because it is not just a generic digitization slogan; it is a
              single-market and interoperability framework with a published implementation path through 2029 and 2031.
              OECD data also shows that teleconsultation volumes stabilized above pre-pandemic baselines rather than
              returning all the way to 2019 levels. That means digital access is no longer a temporary exception. At the
              same time, IQVIA argues that provider-facing tools such as diagnostics, remote monitoring, decision
              support, and AI-informed platforms are maturing even after a rough funding cycle. That shift favors
              companies that embed into real workflows instead of selling only consumer wellness narratives.


              Latin America has a different but complementary logic. Grand View describes strong telehealth growth from
              smartphone penetration, chronic disease, and digitalization of care, while Black Book says buyers in
              Spanish-speaking markets increasingly want ROI-led ambulatory, interoperability, and administrative
              control rather than vague transformation narratives. That matters to Docplanner because its cross-sell
              path is increasingly workflow-led: patient acquisition can open the door, but retained value likely comes
              from software layers that reduce friction inside practices and clinics. Cloud matters here too. Europe
              digital health and telehealth reports both show cloud as the dominant or fastest-growing delivery mode,
              and the global healthcare SaaS report says appointment scheduling, telemedicine, patient portals, and
              billing are all part of a rapidly expanding healthcare SaaS stack. In other words, Docplanner benefits not
              only from more online care, but from a broader migration of administrative healthcare workflows into
              recurring software.
