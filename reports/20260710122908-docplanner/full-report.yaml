      - number: '4.2'
        title: Public traction, growth and operating performance
        blocks:
          - type: paragraph
            body: >-
              Unlike most private-company public packs, Docplanner now has a filing-based revenue line. Consolidated
              2024 sales reached EUR 188.7 million, up from EUR 150.9 million in 2023. Operating loss improved from EUR
              57.6 million to EUR 33.6 million, net loss improved from EUR 75.1 million to EUR 48.5 million, and
              operating cash burn narrowed sharply. The filing’s EBITDA and EBIT margins also improved, which is the
              clearest available sign that operating leverage is beginning to appear. This is not profitability yet, but
              it is far more informative than generic unicorn-era rhetoric. The filing also shows that Poland is already
              profitable while several international subsidiaries remain loss-making, which is consistent with a roll-up
              still balancing mature and investment markets.


              Recent media adds color rather than replacing the filing. Wirtualnemedia says the company saw growth in 13
              markets, with every country except Colombia positive on an EBITDA basis before management-cost allocation,
              and it quotes a roughly USD 300 million near-term revenue forecast. It also says 15,000 doctors have
              purchased Noa. Those are useful indicators of monetization depth and cross-sell potential, but they remain
              management-reported context rather than audited segment disclosure. The right interpretation is therefore
              balanced: Docplanner has real revenue scale and improving losses, but headline traction numbers still need
              to be separated into audited results, management forecasts and third-party estimates.
