  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Financing need before quality improves
        - New capital required before losses narrow or debt headroom is clarified
        - Turns fair valuation into a dilution / terms problem
        - Assume downside multiple and require stronger protections
      - - Privacy / AI-governance miss
        - Material incident, regulator action, or weak lawful-basis answer for Noa
        - Undercuts premium narrative and slows product rollout
        - Haircut AI upside and reassess risk rating
      - - Retention evidence disappoints
        - Clinic or enterprise retention proves weaker than expected
        - Breaks workflow-depth valuation thesis
        - Shift toward bear-case multiple
      - - AI attach rate is de minimis
        - Noa remains a feature rather than a monetized product layer
        - Removes reason to pay premium vertical-SaaS / AI band
        - Cap valuation at base-to-bear range
      - - Germany integration slips
        - German execution or Jameda synergies miss plan
        - Hurts scale, margin, and exit-readiness narrative
        - Reduce growth and synergy assumptions
      - - Macro multiple compression persists
        - Healthtech / SaaS bands keep falling in 2026-2027
        - Even good execution may not hold current mark
        - Demand greater entry discount
    notes: These triggers convert valuation uncertainty into observable events that should change the investment call.
    claimRefs:
      - CV008
      - CV014
      - CV036
      - CV038
      - CV044
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current financing terms
        - Primary round documents, price, preferences, and investor rights
        - Needed to know the true entry price and downside overhang
        - Request management data room or lead investor materials
      - - Debt profile
        - Covenants, maturity ladder, lender terms, and refinancing options
        - Needed to price leverage risk into valuation
        - Review debt agreements and downside liquidity model
      - - Retention and expansion
        - NRR, churn, clinic retention, enterprise renewal, ACV mix
        - Needed to know if workflow depth translates into premium revenue quality
        - Request cohort deck by segment and country
      - - Noa economics
        - Attach rate, paid conversion, ARPU lift, margin per note, and clinical QA
        - Needed to justify any AI premium
        - Request product P&L and adoption funnel
      - - Germany / Jameda execution
        - Integration milestones, local churn, and cost-to-serve changes
        - Needed to test whether Germany adds value or complexity
        - Request market-by-market operating review
      - - Exit readiness
        - Audit quality, governance maturity, and IPO / secondary-readiness workstreams
        - Needed to judge if scale can convert into a premium liquidity event
        - Request board materials and readiness workplan
    notes: >-
      These asks are the shortest path to converting the current research-more call into either a disciplined invest or
      a pass.
    claimRefs:
      - CV039
      - CV043
      - CV044
      - CV045
      - CV046
