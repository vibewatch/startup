      - number: '3.3'
        title: Distribution power, lock-in and multi-homing
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive wedge in this category is not pure feature breadth; it is distribution plus
              workflow depth. Docplanner’s local brands create a country-by-country acquisition surface, which matters
              because patients search in local language and providers buy from locally legible brands. That is a real
              advantage versus global products that rely on one brand or one national market. But the retained evidence
              also shows why the moat is incomplete. Providers can often keep an existing agenda or practice system
              while activating a marketplace listing or an add-on teleconsultation module elsewhere. Zocdoc’s free
              tools, Doctena’s interoperability, and Maiia’s “activate only the services you need” posture all imply
              that multi-homing or modular replacement is feasible in many settings.


              Lock-in rises only when a platform becomes operational infrastructure. The daily agenda, reminders,
              patient messaging, notes, billing, secure messaging, or teleconsultation workflows create habit and staff
              dependency. Incumbents such as Cegedim and CGM can exploit this because they already sit inside provider
              software estates; Docplanner’s response is to extend upward through assets such as TuoTempo rather than
              remain only a discovery portal. The implication is nuanced: discovery marketplaces can be vulnerable to
              commoditization, but hybrid players that convert patient demand into workflow control can still build
              defensible positions. Later diligence should therefore prioritize attach-rate questions: how many
              providers only list on Docplanner, how many use practice software, and how many run meaningful clinic
              operations through the stack.
            claimRefs:
