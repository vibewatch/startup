  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              The 2024 consolidated filing finally makes Docplanner’s public business model unusually clear for a
              private company. It is not merely a lead-generation directory. The group describes itself as a SaaS-based
              software solution delivered through websites that bring together doctors and patients. Patients search,
              review and book, while doctors and clinics are the paying customers for calendar and patient-flow
              software. That framing is materially stronger than the typical startup profile page because it comes from
              a consolidated filing rather than marketing copy alone. The older 2019 financing coverage and the current
              product/review pages align with it: Docplanner has long operated as a two-sided marketplace supported by
              provider-facing workflow software.


              The monetization story still has several layers. The Polish-entity coverage says premium platform packages
              remain the main direct revenue source, while consulting to related companies and adjacent services add
              additional income. TuoTempo and Feegow indicate more clinic-oriented monetization through check-in,
              payments, finance and operations. Noa suggests a newer AI workflow upsell. What is still missing is the
              precise weighting between marketplace visibility, recurring software subscriptions, clinic modules, AI
              attach, and any transaction-linked revenue. That missing segmentation is crucial because the quality of
              Docplanner’s future cash flows depends on whether revenue is anchored in sticky workflow software or in
              more replaceable demand generation.
