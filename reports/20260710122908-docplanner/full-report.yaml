      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this chapter cuts both ways. The French competition case against Doctolib proves
              that strong network effects and distribution power are real in online medical booking, because regulators
              only bring this kind of abuse-of-dominance case against a platform with genuine gatekeeper behavior. But
              it also proves that apparent winner-take-all dynamics are not a free pass: exclusivity clauses, tied
              selling and acquisitions can trigger intervention, reputational damage and remedial pressure. Just as
              important, the rest of the source pack shows a live menu of alternatives for providers. Jameda publishes
              transparent packages. Zocdoc lowers switching cost with free tools and variable marketplace pricing.
              Practo splits software from demand generation. Doctena and Maiia emphasize interoperability and migration.
              CGM brings far larger software scale than Docplanner. Top Doctors differentiates through specialist trust
              rather than mass-market scheduling. None of that looks like an uncontested field.


              The most defensible reading is that Docplanner has a real but conditional moat. It is stronger where local
              demand, provider reputation and workflow tools reinforce one another, and weaker where the product behaves
              like replaceable lead generation or a thin booking layer. That is the competitive verdict later chapters
              should carry forward. A high-quality Docplanner would look increasingly like a workflow and
              clinic-operations platform monetizing embedded demand. A lower-quality Docplanner would look like a
              booking marketplace facing transparent pricing benchmarks, multi-homing and incumbent encroachment. The
              next steps in diligence are therefore empirical: win-loss data, attach rates, retention by module, and
              country-level proof that software depth, not just traffic scale, sustains the business.
