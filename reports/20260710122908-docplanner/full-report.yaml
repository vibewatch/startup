  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial model, leverage, and funding risk
        blocks:
          - type: paragraph
            body: >-
              Docplanner is large enough that the risk debate is not about whether there is demand; it is about whether
              the operating model can convert that demand into durable, well-financed growth. The 2024 filing shows a
              business with substantial scale, but it also shows losses, leverage, and working-capital pressure. Cash of
              roughly €39 million against loan balances above €109 million is not an immediate insolvency signal on
              management’s own runway view, yet it does mean the company is not operating with the balance-sheet margin
              of error that the strongest software businesses enjoy. In other words, the company may still be
              investable, but capital structure matters.


              This is especially relevant because product expansion now includes acquisitions, AI features, and
              country-level complexity. If customer growth stalls, enterprise implementations run long, or AI adds cost
              without proportional ARPU uplift, leverage can amplify the downside faster than a simple marketplace story
              would suggest. The filing’s explicit risk-management language is a positive offset, but not a substitute
              for future evidence on margin improvement, refinancing terms, and cash conversion. For investors, the
              right framing is not ‘is there runway today?’ but ‘how exposed is the next financing or debt conversation
              to execution misses over the next six quarters?’
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR036
              - CR037
          - type: table
