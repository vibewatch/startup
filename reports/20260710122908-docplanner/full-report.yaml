        title: Engineering capacity, public developer signals, and moat quality
        blocks:
          - type: paragraph
            body: >-
              Public engineering evidence is partial but still informative. Docplanner keeps the commercial core
              private, yet its GitHub organization is not empty window dressing. Multiple repositories were updated in
              2026 across infrastructure, CLI tooling, analytics, access management, and API clients. The PHP
              integrations SDK alone has 100-plus commits and documents OAuth2, webhook notifications, and production
              API objects. The securityhub-to-Jira integration shows a concrete security operations pattern, while
              smaller repositories like gatekeeper-bundle suggest selected internal utilities are open-sourced even when
              the product logic stays closed. This is the profile of a real engineering organization with enough
              maturity to expose tooling selectively without opening its crown jewels.


              The moat is therefore less about patents and more about workflow depth plus localized healthcare data.
              Trust-report evidence shows millions of opinions, hundreds of thousands of bookable doctors, and
              moderation processes that enrich the discovery layer. The installed product surface then sits close to
              scheduling, reminders, records, and AI-generated visit notes. That combination is not impossible to
              replicate in pieces, but it is hard to reproduce quickly across many countries, languages, review systems,
              and legacy-clinic integrations. The main caveat is transparency: public sources do not reveal the true
              engineering split, platform architecture, or how much RPA versus native APIs still carries the
              interoperability burden.
