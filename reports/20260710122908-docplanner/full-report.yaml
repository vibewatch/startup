  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from real scale and product proof through risk-adjusted valuation discipline rather than
      from headline unicorn status.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: €188.7M revenue, 25M monthly bookings, 300k active doctors
          tone: positive
        - id: product
          label: Workflow + AI proof
          detail: Marketplace, SaaS, Jameda, Noa adoption
          tone: positive
        - id: risk
          label: Risk overhang
          detail: Debt, losses, compliance, integration complexity
          tone: warning
        - id: pricing
          label: Valuation context
          detail: ~4x-8x revenue bands; ~$1B mark appears fair not cheap
          tone: neutral
        - id: call
          label: Recommendation
          detail: Research more until terms and retention quality are validated
          tone: warning
      edges:
        - from: scale
          to: product
          label: supports software-like thesis
        - from: product
          to: risk
          label: AI and workflow deepen both upside and burden
        - from: risk
          to: pricing
          label: requires discount or discipline
        - from: pricing
          to: call
          label: fair price + missing terms = no clean buy
    approximationNotes: This logic chain compresses the full report into the smallest set of variables that move the investment call.
