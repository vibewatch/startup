chapter:
  number: 5
  title: Product & Technology
  summary: Docplanner has evolved from a booking marketplace into a multi-surface workflow platform spanning doctor scheduling, clinic operations, APIs, and AI note-taking. Public evidence shows real product depth, live integrations, strong uptime, and enough engineering surface to support scale, but it also shows continued dependence on legacy-EHR workarounds and limited disclosure on AI economics or core architecture.
sections:
- id: product-surface-and-persona-fit
  title: Product surface and feature depth by persona
  body: |-
    Docplanner is not a single booking widget anymore; the public product surface clearly spans patients, individual doctors, and larger clinics. On the patient side, the marketplace still starts with find-a-doctor, instant booking, reminders, and opinion discovery. On the provider side, the company frames the value much more broadly: doctors get schedule management, online reputation, automated reminders, patient communication, digital records extensions, online payments, video visits, and now AI-assisted documentation. The clinic pitch is different again. Rather than selling only visibility, the group increasingly presents a workflow layer for patient experience, operations, and integration with existing systems.

    The strongest evidence that this is real product depth rather than marketing copy comes from how many adjacent surfaces now sit around the core agenda. Noa Notes can run inside Doctoralia or through a standalone workflow; the browser extension overlays browser-based EHRs; the PMS integration docs let third parties launch the widget and receive structured summaries; and Doctoralia Pro review pages tie the day-to-day value to reminders, records, visibility, and fewer no-shows. That combination matters for diligence because it pushes Docplanner toward a workflow operating system for ambulatory care, not just a paid directory.
  claimRefs:
