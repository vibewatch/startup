- id: security-scalability-and-product-tech-verdict
  title: Scalability, security posture, and product-tech verdict
  body: |-
    Scalability looks credible but not frictionless. The status page shows high uptime across SaaS, marketplace, SSO, Noa, and integration services, which is a stronger operational disclosure than many private peers provide. The trust report adds a second layer around review moderation, confidentiality, and the policy of not removing negative opinions simply because a provider pays. On the Noa side, the help and extension materials show consent prompts, browser permissions, security disclosure, and a documented path to structured summaries. Together these signals support a view that the company is taking operational reliability and data stewardship seriously.

    The harder question is whether the system scales cleanly enough across fragmented clinic software. Public docs show dynamic IP whitelisting, locale-specific APIs, and structured widgets, but the Flobotics case also shows that old EHRs remain a real obstacle. That does not invalidate the product; it actually explains why Docplanner has survived in messy ambulatory environments. The product-tech verdict is therefore positive with caveats: Docplanner has moved beyond marketplace simplicity into a multi-surface workflow platform with AI, interoperability, and real reliability discipline, but the last mile of clinic integration still appears operationally heavy and deserves direct diligence before underwriting very high software-like margins.
  claimRefs:
  - CE015
  - CE018
