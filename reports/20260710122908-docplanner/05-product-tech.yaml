  evidenceGaps:
  - type: missing-source
    severity: material
    topic: engineering-split
    missingEvidence: A clean breakdown of engineering headcount, R&D spend, and platform-team structure by country or product line.
    whyItMatters: Public headcount trackers show scale but cannot prove how much capacity actually sits in core engineering versus sales, support, or operations.
    diligencePath: Request an org-level engineering headcount bridge by function, geography, and platform domain, plus current hiring plan and attrition.
    relatedQuestionRefs:
    - QE018
  - type: private-evidence-only
    severity: material
    topic: ai-unit-economics
    missingEvidence: Adoption, attach rate, price realization, and gross-margin data for Noa Notes.
    whyItMatters: The AI layer is central to the differentiation narrative, but investors cannot yet test whether it is a meaningful high-margin revenue stream or just a feature subsidy.
    diligencePath: Request active Noa clinician count by country, monthly note volume, conversion from trial to paid, and infrastructure cost per note.
    relatedQuestionRefs:
    - QE014
    - QE024
  - type: private-evidence-only
    severity: material
    topic: interop-maintenance-cost
    missingEvidence: Relative share of native API integrations versus RPA/ops-heavy workarounds and the associated maintenance burden.
    whyItMatters: If a large share of enterprise scaling still depends on customized RPA, the business may carry more services-like cost and implementation risk than the product story implies.
    diligencePath: Request integration mix by method, average implementation time, annual maintenance load, and error rates for native versus RPA-connected clinics.
    relatedQuestionRefs:
    - QE012
    - QE019
  - type: missing-source
    severity: minor
    topic: patents-and-certifications
    missingEvidence: A verifiable public list of patents, SOC reports, or architecture/security certifications beyond the Noa ISO claim.
    whyItMatters: The absence does not break the thesis, but it limits certainty around how much of the moat is technical IP versus execution and distribution.
    diligencePath: Request the internal IP register, certification inventory, and any third-party assurance reports used in enterprise sales.
    relatedQuestionRefs:
    - QE023
    - QE025
