- id: TP006
  title: Status-quo and internal-build substitute map
  columns:
  - substitute
  - where it works
  - where it fails
  - why Docplanner still matters
  rows:
  - - Phone booking and reception staff
    - Low-volume practices with simple calendars
    - High call burden, weak reminders, poor after-hours conversion
    - Online booking, reminders and demand capture automate the bottleneck.
  - - Existing local PMS / EHR only
    - Practices already satisfied with workflow software
    - Usually weak on consumer discovery and external demand capture
    - Docplanner can sit on top of or replace parts of that stack.
  - - Public or insurer portals
    - Specific reimbursement or public-system contexts
    - Narrow scope and weak cross-specialty marketplace dynamics
    - Docplanner addresses private-provider acquisition and workflow needs.
  - - Internal build by hospital group
    - Large institutions with IT budgets and patient base
    - Slow product iteration and poor local-market demand acquisition
    - Docplanner or TuoTempo may shorten deployment and add marketplace reach.
  - - Specialist directory only
    - Premium expert-search journeys
    - Limited practice operating workflow
    - Docplanner has broader booking and workflow scope.
  notes: Internal build is most credible for organizations that already control both software and patient flow; it is much less credible for fragmented ambulatory providers.
