  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Realized ARPU, discounting, contract lengths and package mix for Docplanner versus key rivals.
    whyItMatters: List prices and variable-fee descriptions do not reveal revenue quality, gross retention or how much pricing power Docplanner truly has.
    diligencePath: Request current price books, discount policy, realized ARPU by country and module, and competitor win-loss pricing notes.
    relatedQuestionRefs:
    - QP005
    - QP019
    - QP024
  - type: missing-source
    severity: material
    topic: multi-homing-and-switching-data
    missingEvidence: Provider-level evidence on how often clinics list on multiple platforms or keep incumbent software while using Docplanner.
    whyItMatters: Without multi-homing data, public evidence can only infer switching costs from product depth, not measure them.
    diligencePath: Request churn cohorts, multi-product attach by customer type, migration reasons, and competitive displacement examples.
    relatedQuestionRefs:
    - QP015
    - QP016
    - QP025
  - type: missing-source
    severity: material
    topic: country-level-competitive-share
    missingEvidence: Country-level win rates, market shares, and direct head-to-head conversion against Doctolib, Jameda, local directories and incumbent software vendors.
    whyItMatters: Public pages establish capability overlap but not whether Docplanner is winning the most valuable provider segments.
    diligencePath: Request market-by-market competitor scorecards, sales win-loss logs and provider retention by segment.
    relatedQuestionRefs:
    - QP007
    - QP017
    - QP023
  - type: missing-source
    severity: minor
    topic: vendor-authored-proof-bias
    missingEvidence: Independent benchmarks validating vendor-authored claims on reminder impact, security posture, workflow efficiency and patient conversion across rivals.
    whyItMatters: Many retained product claims are self-authored and should not be treated as measured comparative performance.
    diligencePath: Request customer references, third-party reviews, implementation studies and procurement evaluations.
    relatedQuestionRefs:
    - QP022
  - type: missing-source
    severity: material
    topic: enterprise-module-economics
    missingEvidence: Public evidence on revenue contribution, retention and pricing for TuoTempo and other clinic-workflow extensions inside Docplanner.
    whyItMatters: Those modules likely determine whether the business looks like sticky software or replaceable lead generation.
    diligencePath: Request product-line ARR, gross retention, NRR and customer counts for enterprise and clinic-management modules.
