companyProfile:
  summary: >-
    Docplanner is a late-stage private healthcare software company founded in Poland and now formally headquartered in
    both Barcelona and Warsaw. The company operates a multi-country marketplace and workflow platform that helps patients
    find and book doctors while selling providers subscription software for agendas, reminders, communication, and clinic
    operations; it has also expanded into AI-assisted medical note generation through Noa Notes. Public filings show a
    real scaled business with €188.688M of 2024 revenue, but underwriting still depends on management disclosure for
    current financing terms, retention quality, and AI monetization economics.
  foundedDate: '2012-01-01'
  founders:
    - name: Mariusz Gralewski
      role: Founder and CEO
      background: Former founder of GoldenLine.pl and the public face of Docplanner across historical and current sources.
      claimRefs: [CO008, CO034]
  foundingLocation: Warsaw, Poland
  headquarters: Barcelona, Spain / Warsaw, Poland
  productSummary: >-
    Marketplace, booking, practice-management, payments, patient-communication, and AI-note-taking software delivered
    across localized healthcare brands including Doctoralia, MioDottore, ZnanyLekarz, DoktorTakvimi, and Jameda.
  customerFocus: Individual doctors, clinics, clinic groups, and the patients who discover and book them through local brands.
  businessModel: >-
    Subscription software sold to providers and clinics, augmented by marketplace demand generation, booking-related
    monetization, and expansion products such as Noa Notes.
  stage: late-stage private unicorn
  fundingStatus: >-
    Public evidence clearly supports the 2019 €80M Series E and investor base led by One Peak and Goldman Sachs Private
    Capital; secondary databases and media-like trackers suggest a later ~$1B valuation context and reported 2024
    financing, but current round terms remain unverified in primary materials.
  disclosureProfile: private-disclosed
  claimRefs: [CO006, CO008, CO015, CO033, CO034, CI004, CV005, CV039]
summary:
  headline: >-
    Docplanner has enough scale, workflow depth, and geographic breadth to merit continued diligence, but current public
    evidence supports a research-more stance because leverage, compliance burden, and opaque financing / retention details
    keep the valuation from looking clearly attractive.
