  topStrengths:
    - Large multi-country doctor and patient network with clear evidence of real booking volume and provider workflow usage.
    - Product has moved beyond marketplace discovery into integrations, practice software, and early AI documentation adoption.
    - Official 2024 filing provides unusual financial visibility for a private company and supports a real late-stage platform thesis.
  topRisks:
    - Debt, losses, and working-capital pressure reduce room for execution misses and raise the importance of financing terms.
    - GDPR, EHDS, and AI-health-data governance can slow rollout or compress margins just as Noa becomes strategically important.
    - Retention, enterprise mix, and Noa monetization remain too opaque to justify a premium AI multiple from public evidence alone.
    - Germany / Jameda integration and legacy-EHR interoperability can keep the business more operationally heavy than the software narrative implies.
  unresolvedGaps:
    - Current financing documents, liquidation preferences, and full debt covenant / maturity details are not public.
    - Net revenue retention, clinic and enterprise churn, and segment-level expansion data remain undisclosed.
    - Noa attach rate, paid conversion, ARPU uplift, and incremental margins are not publicly available.
    - A fully comparable private-peer set with reliable, current valuation marks remains incomplete.
