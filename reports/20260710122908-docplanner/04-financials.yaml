- id: SI003
  title: Capital adequacy, balance-sheet pressure and funding dependency
  body: |-
    The capital picture is more nuanced than the simple “unicorn” label suggests. The filing shows Docplanner ended 2024 with negative working capital of EUR 84.2 million, equity of only EUR 19.7 million, and current liabilities of EUR 146.5 million. Those numbers are not fatal by themselves because the company also raised new equity capital through the F2 tranche and then added a January 2025 loan, but they do mean capital structure matters. Management states there is at least 18 months of runway from the balance-sheet date at the current burn rate, supported by EUR 39.1 million of March 2025 cash and the liability maturity profile. That is reassuring, but it does not eliminate dependency on continued execution and financing discipline.

    The public source pack also illustrates why source hierarchy matters. A low-confidence Signalbase item describes a EUR 140 million 2024 round, yet the filing only discloses a EUR 31.93 million F2 tranche. Those numbers may describe different parts of a broader transaction, but they are not safely interchangeable. Until a primary company or investor announcement corroborates the larger figure, the filing should anchor underwriting. The broader lesson is that Docplanner is no longer a business with purely speculative capital needs: it has material revenues and improved cash burn, but it still carries debt, negative working capital and multiple loss-making geographies. Any slowdown in growth, step-up in compliance cost, or acquisition push could bring financing dependency back into focus.
