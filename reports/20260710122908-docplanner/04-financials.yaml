callouts:
- calloutType: insight
  title: The filing materially upgrades the quality of Docplanner's financial discussion
  body: Unlike most private startup reports, this chapter can anchor on a recent consolidated filing with revenue, losses, margins, cash burn and runway. That is enough to move the discussion from narrative to underwriting-relevant evidence, even though unit economics remain missing.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI014
- calloutType: risk
  title: Runway is visible, but financing dependency is not gone
  body: Negative working capital, a meaningful debt balance, and multiple loss-making geographies mean Docplanner still depends on disciplined execution and clean access to capital. The business looks more mature than a typical unicorn, but not yet self-evidently self-funding.
  claimRefs:
  - CI010
  - CI012
  - CI013
  - CI014
  - CI017
