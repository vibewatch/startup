- id: SI004
  title: Unit economics gaps and financial verdict
  body: |-
    The biggest remaining weakness is not headline scale; it is missing unit economics. Public sources still do not disclose gross margin, CAC, payback, logo churn, NRR, realized ARPU, or revenue split by marketplace versus software versus clinic modules. That absence matters because Docplanner’s strategic quality depends on exactly those distinctions. If most revenue comes from sticky calendar, clinic-operations and AI tools, then the business deserves better durability assumptions. If a large portion behaves like provider marketing or pay-for-visibility spend, then competitive pricing pressure from Jameda, Zocdoc or other alternatives should compress confidence. The competitor pricing pages are valuable precisely because they show how many monetization models coexist in this category.

    The appropriate verdict is therefore constructive but incomplete. Public evidence now supports a company with nearly EUR 189 million of revenue, materially improving losses, filing-backed runway and several credible software extensions. It also supports a company still funding growth through external capital, carrying negative working capital, and leaving critical unit economics undisclosed. Later valuation work should use the filing as the base case, apply a discount for opacity around retention and margin structure, and treat any private upside case as contingent on management proving that software attach, not just traffic scale, is driving the economics.
