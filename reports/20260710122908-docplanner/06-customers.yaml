- id: satisfaction-retention-and-revenue-quality
  title: Retention, satisfaction, and revenue-quality signals
  body: |-
    Docplanner does not publish the standard SaaS metrics an investor would really want here—NRR, gross retention, logo churn, payback, or contract duration—but it does leave usable proxies. The review surface is meaningfully broad on Software Advice and GetApp, where Doctoralia for Specialists holds a 4.7 out of 5 rating across 409 reviews. The reasons doctors give for liking the product are highly consistent with a strong marketplace-software bundle: more patients, simpler reminders, better visibility, and smoother schedule management. That consistency is helpful because it shows the product is not solving an abstract workflow problem; it is solving a problem practitioners are already willing to review publicly.

    The public negatives matter too. GetApp complaints point to pricing, support responsiveness, limited mobile behavior, and integration depth. GoodFirms provides only a listing and no review base, while TrustRadius offers almost no enterprise advocacy. Those gaps weaken confidence in large-account retention and high-end product love, even if SMB doctor satisfaction looks solid. The Noa Notes add-on is a useful offset because it shows at least one expansion path into higher-value revenue per clinician, but the company still does not disclose attach rates or how many users convert from core Doctoralia Pro into AI products.
  claimRefs:
  - CU004
