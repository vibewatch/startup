- id: customer-verdict-and-open-diligence-items
  title: Customer verdict and open diligence items
  body: |-
    The customer picture is good enough to support a real commercial platform thesis. There is clear evidence of scale, broad geographic diversification, dense patient-review inventory, and a doctor-facing paid product that earns high ratings on major software review sites. In particular, the platform appears to benefit from a self-reinforcing flywheel: patient traffic and opinions attract doctors; doctor subscriptions improve availability and responsiveness; better supply attracts more patient activity. That is a stronger customer-quality pattern than a standalone SaaS product or a directory with weak transactional depth would show.

    The unresolved issue is revenue quality at the upper end. Public evidence heavily favors the SMB and marketplace surface. It does not answer how sticky large clinics are, whether AI add-ons materially lift ARPU, or whether certain countries dominate revenue and cash generation. The right underwriting stance is therefore constructive but incomplete: Docplanner appears to have broad customer breadth, workable satisfaction, and low count-based concentration, but retention, enterprise mix, and cohort economics still require management disclosure before treating the revenue base as fully premium-quality recurring software revenue.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU033
  - CU034
  - CU036
  - CU037
