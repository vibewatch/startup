  - - Small and mid-size clinics
    - Marketplace + workflow cross-sell
    - Official clinic positioning and workflow pages, but limited contract detail
    - Subscription plus integration or setup support
    - Multi-user scheduling, payments, records, coordination
    - Meaningful but less transparent than doctor SMB
  - - Larger clinic groups / hospital-like accounts
    - Relationship sales + integration-led motion
