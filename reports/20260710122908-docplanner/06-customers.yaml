- id: geographic-footprint-and-concentration
  title: Geographic footprint and concentration risk by customer count
  body: |-
    The strongest customer-quality signal is the breadth of Docplanner’s local-market footprint. Official brand homepages show six-figure or even seven-figure provider inventories in Spain, Brazil, Mexico, Italy, Poland, Turkey, and Germany, with additional visible density in Colombia and Peru. This does not prove that all listed professionals are paying subscribers, but it does show a very broad top-of-funnel and brand presence across multiple healthcare markets. Germany deserves special attention: Jameda’s official homepage still advertises more than 411,000 professionals, 1 million bookable appointments, and 3.1 million experience reports, which supports the idea that the Jameda acquisition materially deepened the German demand-and-supply base.

    From a concentration standpoint, the public evidence is reassuring on customer count and frustrating on customer revenue. Reassuring, because a network spread across hundreds of thousands of doctors and dozens of country brands is unlikely to depend on a handful of individual providers. Frustrating, because the company does not publicly disclose what share of revenue comes from Spain versus Brazil, from SMB doctors versus clinics, or from the largest clinic groups. Investors can therefore conclude that count-based concentration looks low while revenue concentration remains unproven.
