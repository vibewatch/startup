  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net revenue retention, gross retention, logo churn, contract duration, and payback by segment.
    whyItMatters: High review ratings do not substitute for cohort economics; without retention metrics, the quality of recurring revenue cannot be fully underwritten.
    diligencePath: Request three-year cohort retention by doctor, clinic, and enterprise segment, plus GRR/NRR and contract-length distribution.
    relatedQuestionRefs:
    - QU016
    - QU025
  - type: private-evidence-only
    severity: material
    topic: revenue-concentration
    missingEvidence: Revenue split by country, segment, and largest customer cohorts.
    whyItMatters: Public doctor counts imply low concentration by headcount but say nothing about where actual cash generation is concentrated.
    diligencePath: Request revenue, gross margin, and churn by country and by customer archetype, plus top-20 account exposure if enterprise deals are meaningful.
    relatedQuestionRefs:
    - QU018
    - QU025
  - type: missing-source
    severity: material
    topic: named customer proof table / named-enterprise-customers
    missingEvidence: A meaningful public roster of clinic chains, hospital groups, or enterprise case studies.
    whyItMatters: Enterprise customer proof is too thin to assess sales complexity, implementation burden, or referenceability at the upper end of the market.
    diligencePath: Request the current enterprise logo list, ACV bands, case studies, and implementation timelines for the largest clinic deployments.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: medium
    topic: noa-attach-rate
    missingEvidence: Conversion from core Doctoralia Pro users into Noa Notes and resulting ARPU uplift.
    whyItMatters: AI cross-sell could materially improve customer quality and valuation, but the public record only proves usage, not monetization depth.
    diligencePath: Request Noa trial-to-paid conversion, attach rate by country, and churn differential between Noa users and non-users.
    relatedQuestionRefs:
    - QU013
    - QU025
