    - Likely bespoke or higher-touch commercial terms
    - Interoperability, operations, enterprise controls
    - Potentially valuable but thinly disclosed
  - - AI-add-on users
    - Expansion from installed provider base
    - 12k+ clinicians on Noa according to Chrome listing
    - Add-on monthly fee or bundle uplift
    - Faster documentation and better consultation focus
    - Promising ARPU expansion but attach rate undisclosed
