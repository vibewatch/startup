      - number: '6.4'
        title: 客户侧结论与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              客户图景已经足以支撑一个真实商业平台论点。有清楚证据显示，公司具备规模、广泛地理分散、密集患者评价库存，以及面向医生的付费产品，且在主要软件评价站点获得高评分。尤其是，这个平台似乎受益于自我强化飞轮：患者流量和评价吸引医生；医生订阅提升可预约性和响应速度；更好的供给又吸引更多患者活动。这种客户质量格局，比独立
              SaaS 产品或交易深度薄弱的目录更强。


              悬而未决的问题在高端收入质量。公开证据明显偏向 SMB 和市场平台侧。它没有回答大型诊所粘性如何、AI 插件是否实质抬升
              ARPU，或者某些国家是否主导收入和现金生成。因此，合适的承销立场是建设性但不完整：Docplanner
              似乎拥有很宽的客户覆盖、可用的满意度和较低的基于数量的集中度；但在把收入基础视为完全高质量的经常性软件收入前，留存、企业客户占比和队列经济性仍需要管理层披露。
            claimRefs:
              - CU028
              - CU029
              - CU030
              - CU033
              - CU034
              - CU036
              - CU037
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 财务模型、杠杆与融资风险
        blocks:
          - type: paragraph
            body: >-
              Docplanner 已经足够大，风险争论不在有没有需求，而在运营模型能否把需求转成持久、资金充足的增长。2024
              年报显示这是一家有相当规模的公司，但也同时显示亏损、杠杆和营运资金压力。按管理层自己的现金续航期判断，约 €39 million 现金对上超过 €109 million
              的贷款余额，并不构成即时破产信号；但它确实意味着，公司没有最强软件公司那种资产负债表容错空间。换句话说，公司仍可能值得投资，但资本结构必须纳入定价。


              这一点尤其重要，因为产品扩张如今包括收购、AI 功能和国家级复杂度。若客户增长停滞、企业实施拉长，或 AI 增加成本却没有成比例抬升
              ARPU，杠杆会比简单市场平台故事暗示的更快放大下行。年报里明确的风险管理表述是正面抵消项，但不能替代未来关于利润率改善、再融资条款和现金转化的证据。投资人该问的不是「今天有没有现金续航期？」而是「未来六个季度的执行偏差，会让下一次融资或债务谈判暴露多少风险？」
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR036
              - CR037
