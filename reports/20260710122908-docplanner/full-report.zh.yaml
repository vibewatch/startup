chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营版图
        blocks:
          - type: paragraph
            body: >-
              Docplanner
              已不再只是起源于波兰的预约目录；当前集团官网把它描述为更大的医疗生态：连接患者与医生，并在发现和预约之上叠加工作流软件。公司仍公开营销双边平台里的患者端——找医生、预约就诊、解决健康疑问——但它也把医生和诊所产品定位为减少爽约、自动化沟通、帮助医疗服务方管理诊所运营的工具。这种商业模式的双重性，在保留的来源中反复出现：2019
              年融资报道把公司描述为消费者市场平台和面向医疗服务方的云软件两根支柱；当前西班牙、巴西、波兰、土耳其、意大利、墨西哥和德国的本地品牌页面，也同时提供患者预约入口和 Doctoralia
              Pro、ZnanyLekarz Pro、Noa Notes 等专业端加购路径。


              官方当前规模口径很大，但措辞需要精准。集团官网和智利首页称，Docplanner 在 13 个国家领先，每月预约 2500 万次，每月患者访问量 1 亿，服务 300,000
              名活跃医生。这些是公司口径，不是经审计披露；但广泛的本地品牌版图仍在欧洲和拉丁美洲活跃，给这些口径提供了侧面支撑。2026 年 4 月隐私通知还补充了一个身份信息点：Docplanner
              正式把自己描述为一个国际公司集团，总部位于巴塞罗那和华沙，而不只是一个拥有海外办公室的单一国家初创公司。这个双中心表述，把早期强调华沙的文章和后期运营材料越来越频繁提到巴塞罗那及波兰的事实对上了。
