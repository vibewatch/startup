companyProfile:
  summary: >-
    Docplanner 是一家后期私营医疗软件公司，创立于波兰，现在正式将总部设在巴塞罗那和华沙两地。公司运营多国市场平台和工作流平台，帮助患者寻找并预约医生，同时向医疗服务方销售日程、提醒、沟通和诊所运营订阅软件；公司还通过 Noa
    Notes 扩展到 AI 辅助病历记录生成。公开申报文件显示，这是一家真正具备规模的业务，2024 年收入为 €188.688M；但当前融资条款、留存质量和 AI 变现经济性，仍需要管理层披露才能承销判断。
  foundedDate: '2012-01-01'
  founders:
    - name: Mariusz Gralewski
      role: 创始人兼 CEO
      background: GoldenLine.pl 前创始人，也是历史和当前资料中 Docplanner 的公开代表人物。
      claimRefs:
        - CO008
        - CO034
  foundingLocation: Warsaw, Poland
  headquarters: Barcelona, Spain / Warsaw, Poland
  productSummary: 面向市场平台、预约、诊所管理、支付、患者沟通和 AI 笔记的软件，覆盖 Doctoralia、MioDottore、ZnanyLekarz、DoktorTakvimi 和 Jameda 等本地化医疗品牌。
  customerFocus: 个体医生、诊所、诊所集团，以及通过本地品牌发现并预约医生的患者。
  businessModel: 向医疗服务方和诊所销售订阅软件，并叠加市场平台获客、预约相关变现，以及 Noa Notes 等扩展产品。
  stage: late-stage private unicorn
