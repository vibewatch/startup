      - number: '6.2'
        title: 按客户数量划分的地域版图与集中风险
        blocks:
          - type: paragraph
            body: >-
              Docplanner
              最强的客户质量信号，是它在本地市场铺开的宽度。官方品牌主页显示，西班牙、巴西、墨西哥、意大利、波兰、土耳其和德国的供给库存达到六位数甚至七位数；哥伦比亚和秘鲁也有可见密度。这不能证明所有列出的专业人士都是付费订阅者，但足以说明，公司在多个医疗市场拥有很宽的获客漏斗和品牌存在感。德国尤其值得单看：Jameda
              官方主页仍标称超过 411,000 名专业人士、1 million 个可预约号源和 3.1 million 条体验报告，支撑了这样一个判断：Jameda 收购实质性加深了德国的需求与供给基础。


              从集中度看，公开证据在客户数量上让人放心，在客户收入上却让人挫败。放心的是，一个覆盖数十万医生和数十个国家品牌的网络，不太可能依赖少数个体医生。挫败的是，公司没有公开披露收入在西班牙与巴西之间如何分布、SMB
              医生与诊所之间如何分布，也没有披露最大诊所集团贡献多少。因此，投资人只能判断基于数量的集中度看起来较低，收入集中度仍未得到证明。
