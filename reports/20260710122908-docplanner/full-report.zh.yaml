      - number: '6.3'
        title: 留存、满意度与收入质量信号
        blocks:
          - type: paragraph
            body: >-
              Docplanner 没有公布投资人真正想看的标准 SaaS 指标——NRR、总留存、logo 流失、回收期或合同期限——但留下了可用的代理指标。Software Advice 和 GetApp
              上的评价面足够宽，Doctoralia for Specialists 在 409 条评价中拿到
              4.7/5。医生喜欢这款产品的理由高度一致：带来更多患者、提醒更简单、曝光更好、排班管理更顺。这种一致性有价值，因为它说明产品解决的不是抽象工作流问题，而是执业者已经愿意公开评价的真实痛点。


              公开负面信号也重要。GetApp 投诉指向定价、支持响应、移动端体验有限和集成深度。GoodFirms 只有条目、没有评价基础；TrustRadius 几乎没有企业客户背书。即便 SMB
              医生满意度看起来稳，这些缺口也削弱了对大客户留存和高端产品喜爱度的信心。Noa Notes
              插件提供了有用抵消，因为它至少展示了一条提高单个临床医生收入价值的扩展路径；但公司仍未披露附加率，也未披露有多少用户从核心 Doctoralia Pro 转向 AI 产品。
