      - number: '2.4'
        title: 约束、替代品，以及为什么国家适配比泛化 TAM 更重要
        blocks:
          - type: paragraph
            body: >-
              市场论证偏正面，但并非没有摩擦。欧洲仍有 GDPR 复杂度、碎片化报销、AI 合规成本和数字技能缺口；拉丁美洲仍需要逐国本地化、面对不均衡的公共数字基础设施，并谨慎规划实施。这些摩擦重要，因为
              Docplanner 最可能服务的客户，往往是预算和变革管理能力都不无限的小型或中型医疗服务方。这也是为什么 Mordor 明确提醒 SME 前期数字化成本高，Black Book
              强调本地化、实施现实和可衡量运营价值，而不是单体平台式推销。


              替代品也比直接竞争对手更宽。对许多医疗服务方来说，外部选项仍是前台人力、电话预约、传统排班或 EHR 软件，或由公共轨道吸收部分转诊和记录交换。因此，Docplanner
              份额提升更依赖工作流压缩、便利性和集成，而不只是知名度。承销含义也就更克制：公开来源支撑一个庞大且扩张中的相邻市场，但不支持懒惰地抬高
              TAM。后续财务和估值工作应把机会视为真实存在，但取决于服务方转化经济性、国家适配，以及向诊所和企业场景加售更高 ARPU 工作流的能力。
            claimRefs:
              - CM018
