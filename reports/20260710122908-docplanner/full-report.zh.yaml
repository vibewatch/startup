  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按角色划分的产品表面与功能深度
        blocks:
          - type: paragraph
            body: >-
              Docplanner
              已不再是一个单一预约插件；公开产品触点清楚覆盖患者、个体医生和更大型诊所。在患者侧，市场平台仍从找医生、即时预约、提醒和评价发现开始。在服务方侧，公司把价值讲得更宽：医生可以获得排班管理、在线声誉、自动提醒、患者沟通、数字病历扩展、在线支付、视频就诊，以及现在的
              AI 辅助文档。诊所端话术又不同。集团越来越强调的不是只卖可见度，而是面向患者体验、运营以及与现有系统集成的工作流层。


              最强证据来自核心日程周围已经有多少相邻触点，这说明产品深度真实存在，而不只是营销文案。Noa Notes 可以在 Doctoralia 内运行，也可以通过独立工作流运行；浏览器扩展覆盖基于浏览器的 EHR；PMS
              集成文档允许第三方启动小组件，并接收结构化摘要；Doctoralia Pro 评价页面把日常价值和提醒、记录、可见度、减少爽约绑定在一起。这个组合对尽调重要，因为它把 Docplanner
              推向门诊医疗的工作流操作系统，而不只是付费目录。
