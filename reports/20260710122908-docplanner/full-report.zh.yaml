      - number: '4.4'
        title: 单位经济性缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              最大的剩余弱点不是标题规模，而是缺失单位经济性。公开来源仍没有披露毛利率、CAC、回本期、客户流失、NRR、实际 ARPU，或按市场平台、软件和诊所模块划分的收入拆分。这种缺失重要，因为 Docplanner
              的战略质量恰恰取决于这些区别。如果大部分收入来自高黏性的日历、诊所运营和 AI 工具，业务就值得更好的持久性假设。如果很大一部分更像服务方营销或付费可见度支出，那么来自 Jameda、Zocdoc
              或其他替代选项的竞争性定价压力，就应压低置信度。竞争对手定价页面之所以有价值，正因为它们展示了这个品类中并存的多种变现模型。


              因此，合适的判断是建设性但不完整。公开证据现在支撑这样一家公司：收入接近 EUR
              189M，亏损显著改善，资金续航有申报文件支撑，并有多个可信的软件扩展。证据也支撑另一个事实：公司仍在靠外部资本资助增长，背负负营运资本，并把关键单位经济性留在黑箱里。后续估值工作应以申报文件为基本情形，对留存和利润率结构的不透明打折，并把任何私募上行情景都系于一个前提：管理层能证明驱动经济性的，是软件附加，而不只是流量规模。
