      - number: '8.3'
        title: 牛市、基准、熊市情景与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              有用的情景框架，应从收入倍数开始，而不是假装知道内部 DCF。熊市情景把 Docplanner 按一家不错但承压的医疗科技平台估值：4x 到 5x 收入；若杠杆、监管和倍数压缩占主导，价值约 €0.75
              billion 到 €0.94 billion。基准情景把它视为有真实工作流深度、但高溢价证据还不完整的规模化垂直 SaaS 领导者：5x 到 6x 收入，即约 €0.94 billion 到 €1.13
              billion。牛市情景假设 Docplanner 能证明 AI 带来的 ARPU 扩张、亏损收窄和更强企业留存，支撑 7x 到 8x 区间，约 €1.32 billion 到 €1.51 billion。


              真正推动结论变化的不是数学，而是管理层能否捍卫数学背后的假设。最大下行触发因素，就是风险章节识别的那些：盈利前需要资本、隐私或 AI
              治理出现重大失误，或证据显示集成成本仍过度依赖服务。最大上行解锁同样清楚：干净的债务故事、强留存，以及一组可信证据证明 Noa 不只是功能，而是有经济意义的产品层。
