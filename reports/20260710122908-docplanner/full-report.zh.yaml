      - number: '5.2'
        title: 架构、集成与 AI 运营模型
        blocks:
          - type: paragraph
            body: >-
              Docplanner 公开暴露的技术表面，比多数私营医疗 SaaS 公司更具体。集成 API 支持本地化区域设置，基于 REST，并明确设计为让第三方应用连接到各品牌的特定国家实例。Noa Notes
              集成又增加了第二层：PMS 厂商可以从自家 UI 调用小组件，接收结构化就诊摘要，并把这些输出推送到本地病历。这告诉投资人两个重要事实。第一，Docplanner
              试图活在其他诊所系统内部，而不是强迫客户整套替换。第二，公司愿意把足够多的工作流暴露出来，在合作伙伴栈里成为中间件。


              最好的外部证明，来自解决相邻技术问题的合作伙伴。Cronofy 描述了与 Google Calendar、Office 365、Outlook.com、Apple 和 Exchange
              的实时双向同步，让患者预约反映医生真实可用时间。Flobotics 展示了架构更难的一面：许多诊所仍运行老旧 EHR，因此当原生 API 不够时，Docplanner 会用 RPA
              桥接系统。严格说，这只是在务实意义上的可扩展架构选择，但正是这种运营妥协，让市场平台加 SaaS 产品能穿透碎片化的医疗 IT。
