  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议不是由独角兽头衔决定，而是从真实规模和产品证据出发，再落到风险调整后的估值纪律。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: €188.7M 收入、每月 25M 次预约、300k 名活跃医生
          tone: positive
