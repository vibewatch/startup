      - number: '7.3'
        title: 运营可靠性、集成负担与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              运营上，Docplanner 看起来比典型私有创业公司更稳健；但同一批公开披露在建立信心的同时，也暴露复杂度。状态页显示，平台被拆成市场平台、SaaS、SSO、AI
              和集成等不同组件，这意味着本地化故障仍可能影响预约、信任或工作流连续性。集成栈也有自己的负担：客户端凭证、webhook、浏览器端触点和动态 IP 白名单，都会在第三方实施中增加故障点。对一个规模化 SaaS
              平台来说，这些是正常设计选择；但要让它们稳定运转，合作伙伴运营必须有纪律。


              最深的运营风险来自传统医疗 IT。Flobotics 案例异常有信息量，因为它显示 Docplanner 仍必须跨多个国家连接许多旧 EHR，并靠自动化处理数千条工作流，而不是干净的原生
              API。孤立看，这不是弱点；它是在碎片化门诊市场进入客户的现实打法。但这也意味着，运营杠杆可能没有软件故事暗示得那么纯。再加上 Jameda
              集成和德国特定扩张需求，公司执行挑战变成同时协调许多本地系统、团队和信任界面。
