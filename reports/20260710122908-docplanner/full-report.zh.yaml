      - number: '1.3'
        title: 组合架构：本地品牌加诊所管理收购
        blocks:
          - type: paragraph
            body: >-
              到 2026 年最突出的点是，Docplanner 并没有把所有业务压成一个统一的全球消费者品牌。它看起来更像是在运营一个品牌组合。ZnanyLekarz 仍是波兰的公开门面，Doctoralia
              继续覆盖多个西班牙语和葡萄牙语市场，MioDottore 仍活跃于意大利，Jameda 仍活跃于德国，DoktorTakvimi
              仍是土耳其的前端。这些页面不是装饰性的遗迹：每个页面仍展示实时患者流程、专科搜索、预约、提醒和专业端加购模块。本地化规模数字并不一致，但足够大，说明集团仍靠国家特定的分发和语言适配取胜，而不是靠一个单一的全球入口。


              第二层组合是诊所和执业软件。TuoTempo 主打企业级患者流运营，包含在线签到、语音助手、视频问诊和支付。Feegow 则补充排班、AI 辅助记录、财务工作流和保险方模块。这对后续章节重要，因为它意味着
              Docplanner 的产品版图不止是声誉或预约市场平台：公司正在逐步拼出一个多 SKU
              栈，覆盖消费者发现、诊所工作流和更大型机构运营。收购历史也显示，管理层更倾向于买入强本地或强功能资产——Doctoralia、Jameda、TuoTempo、Feegow、MyDr——而不是只靠从零进入市场。
