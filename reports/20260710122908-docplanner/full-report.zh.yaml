        - 2026-2027 年医疗科技 / SaaS 区间继续下行
        - 即便执行良好，也未必守住当前估值标记
        - 要求更大入场折扣
    notes: 这些触发项把估值不确定性转成可观察事件，应该改变投资判断。
    claimRefs:
      - CV008
      - CV014
      - CV036
      - CV038
      - CV044
      - CV046
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前融资条款
        - 一手轮次文件、价格、优先权和投资人权利
        - 需要用来确认真实入场价和下行包袱
        - 向管理层索取数据室，或向领投方索取材料
      - - 债务结构
        - 契约、到期梯次、贷款方条款和再融资选项
        - 需要把杠杆风险计入估值
        - 审阅债务协议和下行情形流动性模型
      - - 留存与扩张
        - NRR、流失、诊所留存、企业续约、ACV 组合
        - 需要判断工作流深度能否转成溢价收入质量
        - 按细分和国家索取队列材料
      - - Noa 经济性
        - 附加率、付费转化、ARPU 提升、单条笔记毛利和临床 QA
        - 需要用来支撑任何 AI 溢价
        - 索取产品 P&L 和采用漏斗
      - - 德国 / Jameda 执行
        - 整合里程碑、本地流失和服务成本变化
        - 需要检验德国是在增值还是增加复杂度
        - 索取逐市场运营复盘
      - - 退出准备
        - 审计质量、治理成熟度，以及 IPO / 二级交易准备工作流
        - 需要判断规模能否转成溢价流动性事件
        - 索取董事会材料和准备工作计划
    notes: 这些问题是把当前“继续研究”结论转成有纪律投资或放弃的最短路径。
    claimRefs:
      - CV039
      - CV043
      - CV044
      - CV045
      - CV046
