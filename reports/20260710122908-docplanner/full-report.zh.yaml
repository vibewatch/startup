  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              给 Docplanner 测算市场规模，错误做法是把它叫成一家「数字健康」公司然后到此为止。公开证据支撑的是一个窄得多的实际市场边界。Docplanner
              当前和历史材料始终显示：一边是患者发现与在线预约，另一边是面向医疗服务方的工作流软件。公司及其收购资产，并不整齐落在远程问诊、医院 IT
              或纯列表媒体等经典单一类别里。可变现核心更像是由服务方付费的门诊访问和工作流软件，患者需求捕获则提供漏斗顶部优势。这意味着很宽泛的数字健康 TAM 有方向参考价值，但并不等同于 Docplanner
              今天能现实变现的支出池。


              即便如此，相邻市场池无疑很大。Mordor 估计，欧洲数字健康 2026 年为 USD 113.94B，欧洲远程医疗服务 2026 年为 USD 37.94B；MarketsandMarkets
              则把欧洲远程健康和远程医疗 2025 年规模列为 US$24.76B，并预计到 2030 年达 US$42.04B。Grand View 估算拉丁美洲远程医疗 2024 年为 USD 6.21B，到 2030
              年将达 USD 22.83B。这些数字描述的是 Docplanner 周边可触达的市场版图，不是它精确的 SAM。保留公开记录没有提供按国家划分的已变现服务方数量、国家级
              ARPU，也没有拆分市场平台、专业医生产品和企业诊所收入。正确结论是：市场很大且仍在增长，但 Docplanner 的实际捕获机会位于更窄的楔形地带，前提是患者需求捕获和服务方工作流软件能够一起销售。
