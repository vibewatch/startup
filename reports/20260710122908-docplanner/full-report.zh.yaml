      - number: '7.4'
        title: 人员、叙事与剩余风险结论
        blocks:
          - type: paragraph
            body: >-
              领导层和叙事风险真实存在，哪怕它们不如隐私或债务那样立刻可量化。公开投资人页面仍把 Docplanner
              描绘成创始人主导的增长故事，这在医疗软件里往往是优势；但公开记录没有提供深入的继任或管理梯队细节。外部追踪器和收购历史暗示，公司规模很大且越来越复杂；客户评价投诉则提示，随着产品面扩大，支持质量和集成顺滑度可能承压。公开企业客户背书也偏薄，这限制了投资人对高端客户基础粘性是否像
              SMB 医生基础那样强的信心。


              整体看，风险严肃但不构成一票否决。最重要的风险不是市场是否存在的生死问题，而是会压缩估值、拉长实施周期或迫使额外融资的执行和监管风险。这个区分很重要。它意味着，只要管理层证明更紧的现金纪律、干净的 AI
              治理和持续的运营可靠性，投资论点仍能成立。它也意味着，投资人不应接受简单增长叙事，而要索取事件历史、贷款方条款、AI 治理、德国整合里程碑以及诊所或企业层留存的证据。
