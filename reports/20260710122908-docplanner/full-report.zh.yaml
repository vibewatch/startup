      - number: '3.3'
        title: 分发力、锁定与多平台并用
        blocks:
          - type: paragraph
            body: >-
              这个品类最强的竞争楔子不是单纯功能宽度，而是分发加工作流深度。Docplanner
              的本地品牌形成逐国获客入口，这很重要，因为患者用本地语言搜索，医疗服务方也从本地可信品牌购买。相比依赖单一品牌或单一全国市场的全球产品，这是实打实的优势。但保留证据也说明护城河并不完整。医疗服务方往往可以保留现有日程或执业系统，同时在别处启用市场平台列表或外加远程问诊模块。Zocdoc
              的免费工具、Doctena 的互操作性，以及 Maiia「只启用你需要的服务」的姿态，都意味着许多场景下多平台并用或模块化替换可行。


              平台只有变成运营基础设施后，锁定才会上升。日常日程、提醒、患者消息、笔记、账单、安全消息或远程问诊工作流，会形成习惯和员工依赖。Cegedim 和 CGM
              等既有厂商可以利用这一点，因为它们已经坐在医疗服务方的软件资产里；Docplanner 的回应是通过 TuoTempo
              等资产向上延伸，而不是只停留在发现门户。含义是有层次的：发现型市场平台可能容易商品化，但能把患者需求转化为工作流控制的混合玩家，仍可以建立可防守位置。因此，后续尽调应优先问附加率问题：多少医疗服务方只是挂在
              Docplanner 上，多少使用执业软件，多少通过这个栈运行有意义的诊所运营。
