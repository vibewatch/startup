      - number: '8.4'
        title: 最终尽调问题与退出准备度
        blocks:
          - type: paragraph
            body: >-
              Docplanner 已经大到具备可信退出路径。它有可观收入、跨国市场领导地位、知名投资人，产品栈也延伸到 AI 和诊所工作流。这是好消息。坏消息是，公开信息仍达不到后期估值下明确投「是」所需的标准。关于据称
              2024 年融资，没有清晰公开的条款清单视图。NRR、诊所留存或企业扩张证据没有披露。Noa 采用率如何转成 AI 经济性，也没有公开桥接。


              这组信息支持的是有纪律的好奇，而不是本能式兴奋。如果管理层能打开债务、优先权、留存和 AI
              附加率的账本，估值可能证明合理。否则，公开记录留下太多空间，让估值由叙事支撑，而不是由可承销经济性支撑。因此，退出准备度在品类位置上可信，但在财务质量和披露质量上仍不完整。
