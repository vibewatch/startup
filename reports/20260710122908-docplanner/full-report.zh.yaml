      - number: '5.3'
        title: 工程能力、公开开发者信号与护城河质量
        blocks:
          - type: paragraph
            body: >-
              公开工程证据不完整，但仍有信息量。Docplanner 把商业核心保持私有，但它的 GitHub 组织并不是空橱窗。2026 年，多个仓库在基础设施、CLI 工具、分析、访问管理和 API 客户端方向有更新。仅
              PHP integrations SDK 就有 100 多次提交，并记录了 OAuth2、webhook 通知和生产 API 对象。securityhub-to-Jira
              集成展示了具体的安全运营模式，gatekeeper-bundle
              等小型仓库则说明，即使产品逻辑保持封闭，公司也会选择性开源内部工具。这是一家真实工程组织的画像：足够成熟，可以选择性暴露工具，而不打开自己的核心资产。


              因此，护城河更少来自专利，更多来自工作流深度加本地化医疗数据。信任报告证据显示，公司拥有数百万条评价、数十万名可预约医生和丰富发现层的审核流程。已安装的产品触点随后贴近日程、提醒、记录和 AI
              生成就诊笔记。这个组合并非不能分块复制，但要在多个国家、语言、评价体系和传统诊所集成中快速重建，并不容易。主要保留意见是透明度：公开来源没有揭示真实工程人员拆分、平台架构，也没有说明互操作负担中仍有多少由 RPA
              承担、多少由原生 API 承担。
