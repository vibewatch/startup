      - number: '4.3'
        title: 资本充足性、资产负债表压力与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本图景比简单的「独角兽」标签更复杂。申报文件显示，Docplanner 2024 年末营运资本为负 EUR 84.2M，权益仅 EUR 19.7M，流动负债为 EUR
              146.5M。这些数字本身并不致命，因为公司也通过 F2 批次筹得新股本，并在 2025 年 1 月新增贷款；但它们确实说明资本结构很重要。管理层称，从资产负债表日期起，在当前消耗率下至少有 18
              个月资金续航，由 2025 年 3 月 EUR 39.1M 现金和负债到期结构支撑。这个说法令人安心，但并不消除对持续执行和融资纪律的依赖。


              公开来源包也说明了为什么来源层级重要。低置信度的 Signalbase 条目描述了一笔 2024 年 EUR 140M 融资，但申报文件只披露了 EUR 31.93M F2
              批次。这些数字可能描述同一更大交易的不同部分，但不能安全互换。在公司或投资人一手公告佐证更大金额之前，申报文件应成为承销锚点。更广的结论是，Docplanner
              已不再是一家只有投机性资本需求的公司：它有实质收入、现金消耗改善，但也背负债务、负营运资本和多个亏损地区。增长放缓、合规成本上台阶或继续推动收购，都可能让融资依赖重新成为焦点。
