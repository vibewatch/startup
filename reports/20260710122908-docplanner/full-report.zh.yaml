      - number: '1.4'
        title: 披露冲突、不利信号与仍需尽调的问题
        blocks:
          - type: paragraph
            body: >-
              概览层面，战略方向证据强，但几个投资人关键事实仍缺乏精确度。创始人身份就是一个好例子：TechCrunch、tech.eu、EU-Startups 和当前公司面向外部的材料，都把 Mariusz
              Gralewski 置于创始人兼 CEO 的中心位置；但 Tracxn 列出的创始人是 Luca Puccioni 和 Lucjan Samulowski。创立年份同样嘈杂：部分来源称 2012
              年，tech.eu 称 2010 年，Tracxn 则指向一个 2011 年末的波兰法律实体。当前运营规模也只部分对齐。官方页面使用活跃医生、预约和患者访问量；2021 年 Jameda
              文章使用客户、医生和月度患者；2024 年融资条目使用客户加团队规模；Tracxn 则给出高得多的 2026
              年员工估算。这些不匹配并不推翻核心故事，但如果没有管理层确认，直接复用当前员工数、客户数或最新轮融资事实会有风险。


              公开材料中最清楚的近期不利事件，是 Cyber Arts 根据监管披露总结的 2026 年 1 月土耳其数据泄露通知。事件涉及 Docplanner 的土耳其实体、人力资源和内部沟通软件，可能影响 525
              名现任或前任员工的姓名和联系数据。2026 年 4 月集团隐私通知不是整改报告，但它显示出成熟的法律实体图谱，并明确解释集团如何在招聘中使用 AI
              驱动工具，同时称决策不会完全由自动化完成。即便如此，保留下来的公开材料仍缺少董事会名单、经审计收入、2021 年后详细估值条款，以及对报道中 2024 年 10
              月融资的一手确认。这些是实质性尽调缺口，不是小脚注。
