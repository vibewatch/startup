  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有厂商与替代品
        blocks:
          - type: paragraph
            body: >-
              Docplanner 面对的并不是一个整齐的同业集合。最直接的竞争对手是其他双边患者预约和服务方工作流平台，尤其在欧洲：法国的 Doctolib、德国的 Jameda，以及 Top Doctors、Doctena
              等本地或区域预约品牌。Zocdoc 是最清楚的美国参照，因为它结合了患者搜索、服务方选择和预约；但在保留来源中，它的服务方经济性更偏新患者获取，而不是完整诊所运营软件。Practo
              也是有用对标，因为它同时销售执业软件和由列表带动的获客产品，接近 Docplanner 越来越代表的混合模型。另一端则是 Cegedim 和 CompuGroup Medical
              等既有软件公司，它们可以在既有临床软件资产上增加排班、消息和远程问诊，而不需要拥有全部消费者需求。


              实际结果是，竞争压力会随工作流变化。患者发现层面的对手是预约市场平台和专科目录。医生工作流层面的对手是排班、远程问诊和执业管理厂商。对诊所和更大型服务方而言，竞争再次扩展到 TuoTempo、Maiia 和
              CGM 产品等企业工作流工具。现状替代品同样有意义：电话预约、前台员工、现有本地软件，以及公共或保险方轨道，都能在不采用品牌市场平台的情况下完成部分任务。因此，后续承销不应问 Docplanner
              是否赢下「市场」；而应问哪些工作流层黏性强、哪些容易多平台并用，以及本地执行在哪里胜过抽象功能宽度。
            claimRefs:
