      - number: '7.2'
        title: 监管、隐私与 AI 健康数据风险
        blocks:
          - type: paragraph
            body: >-
              这家公司踩在软件里最难的监管交叉点之一：健康数据、市场平台信任，以及如今由 AI 生成的临床文书。公开材料清楚显示，Noa Notes
              直接触及问诊工作流，需要患者同意，并处理功能上非常接近临床记录的内容。GDPR 已经让这个合规面变成高风险；风险也不止于基线监管。EHDS 制度抬高了跨境健康数据治理预期，关于 AI
              训练的法律评论则提出更难的问题：合法性基础、数据最小化、合同许可和下游模型使用。


              尽调关键点不是 Docplanner 缺少控制；可见证据显示它有控制。问题在于，合规负担正在上移，而产品正在更深地进入敏感工作流。Chrome 条目上的 ISO 与 GDPR
              声明、公开的集成要求、年报中的风险治理都有帮助。但任何押注 AI 产品显著上行的投资人，都应预期比消费者 SaaS
              打法更严格的审查、更多文档，以及潜在更慢的推出节奏。从这个意义上说，监管不只是下行风险；它也是可能塑造产品速度和利润率的扩张约束。
            claimRefs:
