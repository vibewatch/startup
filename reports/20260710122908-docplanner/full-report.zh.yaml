      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              保留的官方页面显示，竞争对手用非常不同的方式打包同一类大任务。Docplanner 及其品牌组合强调免费患者预约，再叠加医生和诊所工具。Jameda
              发布了清楚的套餐路径，从免费列表升级到付费可见度、在线预约管理、日历软件和认证视频问诊；Zocdoc 则发布几乎相反的商业姿态：免费服务方工具，加上只为新患者市场平台预约付费。Practo 把栈拆成 Ray 和
              Prime，前者是订阅式诊所管理产品，后者是面向诊所和医院、使用平台费机制的可见度与预约产品。Doctena 围绕集成日程、患者门户、提醒、EMR 连接和语音助手定位。Maiia
              同样展示集成日程、远程问诊、安全消息和诊室软件，并由 Cegedim 的装机基础强化。CGM 的 CLICKDOC 则从既有软件一侧增加合规视频问诊。


              这重要，因为竞争对手不只是功能清单；它们也编码了不同的经济承诺。Jameda 这类固定年费套餐，把竞争基准摆得很明白。Zocdoc 这类低承诺定价降低采用摩擦，但可能更像营销支出，而不是高黏性软件。Practo
              Ray 这类订阅诊所软件指向工作流深度；TuoTempo 和 CGM 这类企业扩展，则把比较对象推向更重的运营系统。简言之，Docplanner
              不只在竞争谁能吸引患者，也在竞争每个对手能捕获、打包并变现多少医疗服务方的日常工作流。
