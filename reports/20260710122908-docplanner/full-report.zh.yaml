  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与获客动作
        blocks:
          - type: paragraph
            body: >-
              从外部看，Docplanner
              的客户基础最容易理解成一把梯子。入口是患者需求。消费者通过本地医生发现品牌进入，搜索专科页面、比较评价，并免费在线预约。这些流量随后转化为医生获取：服务方付费提升可见度、管理日程、减少爽约并处理患者沟通。西班牙的公开定价页面强化了这种医生优先动作。公司展示了带名称的套餐，月度订阅价格足够低，支撑的是高容量
              SMB 销售模型，而不是纯定制企业销售动作。


              梯子的下一步是扩张。公开材料显示 Noa Notes 等加购项会使用同一套 Doctoralia 凭据，并把 AI 文档加入现有工作流。Software Advice 和 GetApp
              上的评价反复把新患者获取、提醒和声誉管理描述为购买触发点，这正符合市场平台相邻 SaaS
              产品的预期。客户细分故事中更难的部分，是企业诊所和医院。它们显然出现在产品叙事中，但公开证据比个体医生薄，说明客户表面在长尾医疗服务方层面仍最透明。
