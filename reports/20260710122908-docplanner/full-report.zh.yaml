  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与可比背景
        blocks:
          - type: paragraph
            body: >-
              公开记录里最干净的锚点很简单：Docplanner 2024 年收入为 €188.688 million。这很重要，因为几乎所有其他当前价格信号要么是二手，要么已经过时，或两者兼有。Tracxn 和
              Signalbase 指向约 $1 billion 的历史估值和一笔据称 €140 million 的 2024
              年融资事件；但没有一手公告、条款清单或优先权细节，这些标记不能当作精确进入价格。它们适合作为参照点，不是投资级事实。


              放在这条收入基线上，2026 年估值环境区间很宽，但并不宽松。医疗科技和垂直 SaaS 的参考区间，对「不错但不完美」的资产大致集中在 4x 到 6x 收入；更高区间留给增长更快、利润率更高或真正 AI
              原生的公司。这也是为什么可比公司集合重要。Zocdoc 提供最接近市场平台模式的溢价锚点；Practo、HealthTap 和 Infermedica 则帮助显示更小、更区域化或 AI
              专项公司的位置。没有一个完全匹配。正确解读是：凭借工作流深度和规模，Docplanner 值得一个真正的软件倍数；但公开证据还不足以支持支付完整 AI 光环。
