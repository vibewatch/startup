          label: 工作流 + AI 证明
          detail: 市场平台、SaaS、Jameda、Noa 采用情况
          tone: positive
        - id: risk
          label: 风险压顶
          detail: 债务、亏损、合规、集成复杂度
          tone: warning
        - id: pricing
          label: 估值背景
          detail: ~4x-8x 收入倍数区间；~$1B 估值看起来公允，但不便宜
          tone: neutral
        - id: call
          label: 建议
          detail: 在条款和留存质量得到验证前，继续研究
          tone: warning
      edges:
