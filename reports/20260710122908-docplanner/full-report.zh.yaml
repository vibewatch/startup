      - number: '3.4'
        title: 护城河持久性与不利证据
        blocks:
          - type: paragraph
            body: >-
              本章的不利证据有两面性。法国针对 Doctolib
              的竞争案证明，在线医疗预约里的强网络效应和分发力是真实存在的，因为监管机构只会对具备真实看门人行为的平台发起这类滥用支配地位案件。但它也证明，看似赢家通吃的动态并不是免死金牌：排他条款、搭售和收购都可能触发干预、声誉损害和整改压力。同样重要的是，其余来源包展示了医疗服务方仍有一串活跃替代选项。Jameda
              发布透明套餐。Zocdoc 用免费工具和可变市场平台定价降低转换成本。Practo 把软件和需求生成拆开。Doctena 和 Maiia 强调互操作和迁移。CGM 的软件规模远大于 Docplanner。Top
              Doctors 则通过专科信任而不是大众排班差异化。这些都不像一个无人竞争的市场。


              最可防守的解读是，Docplanner
              拥有真实但有条件的护城河。当本地需求、服务方声誉和工作流工具彼此强化时，护城河更强；当产品表现得像可替换的线索生成或轻薄预约层时，护城河更弱。这就是后续章节应带入的竞争结论。高质量的
              Docplanner，会越来越像一个工作流和诊所运营平台，在嵌入式需求上变现。低质量的 Docplanner，则会像一个预约市场平台，面对透明定价基准、多平台并用和既有厂商侵蚀。下一步尽调因此应落到实证：赢单 /
              输单数据、附加率、按模块留存，以及按国家证明支撑业务的是软件深度，而不只是流量规模。
