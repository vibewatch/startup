      - number: '8.2'
        title: 投资论点、反向论点与建议逻辑
        blocks:
          - type: paragraph
            body: >-
              多头论点很直接。Docplanner 有品类规模、本地化品牌深度、真实交易量，产品面也从预约延伸到诊所工作流和 AI 文书。这正是支撑高溢价垂直 SaaS 结果所需的材料，前提是留存、利润率和 AI
              交叉销售表现良好。官方和半官方证据已经足以说明这里有一门真实生意，而不是虚荣指标驱动的市场平台。


              反向论点同样重要。公司仍在亏损，背负有意义的债务，也没有公开披露融资条款或留存指标；这些信息本可让投资人判断当前估值是否已经计入故事里最好的部分。AI 叙事有希望，但公开量化很轻。因此，正确建议是继续研究。在约
              €1 billion 风格估值附近，Docplanner 看起来公允，而不是明显错价。如果 AI
              附加率、企业粘性和利润率改善强于公开记录显示，上行存在；但如果债务、监管或集成复杂度先吃掉这些上行，下行也真实存在。
