      - number: '4.2'
        title: 公开牵引力、增长与经营表现
        blocks:
          - type: paragraph
            body: >-
              与多数私营公司公开材料不同，Docplanner 现在有了基于申报文件的收入线。2024 年合并销售额达到 EUR 188.7M，高于 2023 年的 EUR 150.9M。经营亏损从 EUR 57.6M 改善至
              EUR 33.6M，净亏损从 EUR 75.1M 改善至 EUR 48.5M，经营现金消耗大幅收窄。申报文件中的 EBITDA 和 EBIT
              利润率也有所改善，这是目前最清楚的信号，说明经营杠杆开始出现。这还不是盈利，但比泛泛的独角兽时代叙事有信息量得多。申报文件还显示，波兰已经盈利，而几家国际子公司仍在亏损，这符合一个整合型业务仍在平衡成熟市场和投入市场的状态。


              近期媒体补充的是细节，而不是替代申报文件。Wirtualnemedia 称，公司在 13 个市场实现增长，除哥伦比亚外每个国家在分摊管理成本前 EBITDA 口径为正，并引用了约 USD 300M
              的近期收入预测。它还称 15,000 名医生购买了 Noa。这些是变现深度和交叉销售潜力的有用指标，但仍是管理层报告的背景，不是经审计分部披露。因此，正确解读应保持平衡：Docplanner
              有真实收入规模，亏损也在改善；但标题式牵引力数字仍需要拆成经审计结果、管理层预测和第三方估算。
