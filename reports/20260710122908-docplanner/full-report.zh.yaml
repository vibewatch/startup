      - number: '2.2'
        title: 按区域与产品层划分的买方、用户和付款方
        blocks:
          - type: paragraph
            body: >-
              关于谁使用产品、谁为产品付费，最强公开信号来自 Docplanner
              自己的组合页面。患者在西班牙、波兰、土耳其和意大利的消费者品牌上免费预约，因此患者显然是需求侧用户，但通常不是付款方。医生、诊所和医疗服务集团更可能是经济买方，因为专业端产品强调减少爽约、提升可见度、消息沟通、AI
              笔记、患者接诊、财务和诊所运营。这也符合独立市场证据：Mordor 的欧洲远程医疗服务报告称，服务方占 2025 年收入的 55.34%；Grand View 称，服务方占拉丁美洲 2023 年远程医疗收入的
              53.7%。支付方重要，但在保留的 Docplanner 证据中，它们更多是报销和平台形态的塑造者，而不是直接客户。


              细分也随地区变化。Jameda 当前页面显示，德国更偏患者发现加视频问诊；巴西以及整体拉丁美洲则更利于门诊云化、私营服务方现代化和诊所管理交叉销售。Black Book 及其 Newswire
              发布强调，西班牙语拉丁美洲根本不是一个统一买方环境：墨西哥、智利、哥伦比亚、秘鲁和阿根廷的私营企业现代化逻辑更强，其他市场则限制更多，或更受公共轨道影响。在欧洲，欧盟层面的互操作议程、云采用和远程问诊常态化更重要，但各国采购仍有差异。实际含义是，Docplanner
              同时卖给多种买方原型：个体医生和小型诊所、多点诊所、私营服务方集团，以及在某些情况下通过 TuoTempo 或 Feegow 等资产触达更大机构。
