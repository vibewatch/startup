      - number: '1.2'
        title: 创立、融资与扩张里程碑
        blocks:
          - type: paragraph
            body: >-
              历史记录支撑这样一家公司：它靠融资、跨境品牌建设和收购的组合，扩张速度异常快。TechCrunch 报道，2012 年 12 月 Docplanner 完成 $1M Series A，计划从 5
              个欧洲运营市场进入另外 5 个市场。随后 EU-Startups 记录了 2015 年 $10M Series B；当时平台据称已经覆盖 25 个市场，月访问者超过 700 万，每月预约超过 100,000
              次。2017 年融资把故事从目录流量推进到平台整合：EU-Startups 称 Docplanner 已与 Doctoralia 合并，在上一轮 Series C 后仅 10 个月又融资
              €15M，并将用这笔资金加深 SaaS 能力、开设巴西和墨西哥办公室。


              保留材料中佐证最充分的大额融资，仍是 2019 年 5 月 Series E。TechCrunch、tech.eu、One Peak 和 pharmaphorum 均指向同一笔 €80M 融资，由 One
              Peak Partners 和 Goldman Sachs Private Capital 领投，使累计融资达到约 €130M。这些来源也把当时的 Docplanner 描述为越来越混合的形态：每月 150
              万次预约、约 3000 万患者、超过 1,000 名员工，并明确打算继续收购软件资产。2021 年 11 月，EU-Startups 报道 Docplanner 收购
              Jameda，并明确称其为波兰独角兽；Tracxn 现在记录的后续收购还包括 2022 年 Feegow Clinic 和 2023 年 MyDr。2024 年 Signalbase 融资条目增加了一笔可能的
              €140M 新轮融资，但保留证据集没有找到公司或具名领投方的一手公告匹配，因此这条最好只作为低置信度背景，而不是权威事实。
