      - number: '2.3'
        title: 增长驱动真实存在，但要靠互操作、云和慢病经济传导
        blocks:
          - type: paragraph
            body: >-
              Docplanner 所处市场的增长驱动并非猜想。欧洲有老龄化人口、慢病照护需求、报销常态化和正式互操作政策提供强结构支撑。EHDS
              尤其重要，因为它不是一句泛泛的数字化口号；它是单一市场和互操作框架，并公布了通往 2029 年和 2031 年的实施路径。OECD 数据也显示，远程问诊量稳定在疫情前基线之上，没有完全回到 2019
              年水平。这意味着数字化访问不再是临时例外。与此同时，IQVIA 认为，即使经历了艰难融资周期，诊断、远程监测、决策支持和 AI
              支撑平台等面向服务方的工具仍在成熟。这个转变利好嵌入真实工作流的公司，而不是只卖消费者健康叙事的公司。


              拉丁美洲的逻辑不同，但可以互补。Grand View 认为，智能手机渗透、慢性病和医疗数字化推动远程医疗强劲增长；Black Book 则称，西班牙语市场买方越来越想要以 ROI
              为导向的门诊、互操作和行政控制，而不是空泛的转型叙事。这对 Docplanner
              重要，因为它的交叉销售路径越来越由工作流牵引：患者获客可以打开门，但留存价值更可能来自降低诊所和执业内部摩擦的软件层。云在这里同样重要。欧洲数字健康和远程医疗报告都显示，云是主导或增长最快的交付模式；全球医疗
              SaaS 报告则称，预约排班、远程医疗、患者门户和账单都是快速扩张的医疗 SaaS 栈的一部分。换句话说，Docplanner 受益的不只是更多线上医疗，还受益于医疗行政工作流向经常性软件的更广泛迁移。
