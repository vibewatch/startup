  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现表面
        blocks:
          - type: paragraph
            body: >-
              2024 年合并申报文件终于让 Docplanner 的公开商业模式，对一家私营公司而言异常清楚。它不只是线索生成目录。集团把自己描述为一种基于 SaaS
              的软件解决方案，通过网站把医生和患者聚在一起。患者搜索、评价和预约；医生和诊所则为日历和患者流软件付费。这个表述比典型初创公司简介页强得多，因为它来自合并申报文件，而不只是营销文案。更早的 2019
              年融资报道和当前产品 / 评价页面也与此一致：Docplanner 长期以来就是一个由面向服务方的工作流软件支撑的双边市场平台。


              变现故事仍有几层。波兰实体报道称，高级平台套餐仍是主要直接收入来源，对关联公司的咨询和相邻服务贡献额外收入。TuoTempo 和 Feegow 指向更偏诊所的变现，包括签到、支付、财务和运营。Noa
              则暗示了更新的 AI 工作流加售。仍然缺失的是市场平台可见度、经常性软件订阅、诊所模块、AI 附加，以及任何交易挂钩收入之间的精确权重。这个缺失的分拆至关重要，因为 Docplanner
              未来现金流质量，取决于收入究竟锚定在高黏性工作流软件，还是更可替换的需求生成。
            claimRefs:
              - CI001
