evidenceGaps:
  - type: missing-source
    severity: material
    topic: latest-funding-terms
    missingEvidence: >-
      Primary company or investor announcement, valuation, ownership, and use-of-proceeds detail for the reported
      October 2024 round.
    whyItMatters: >-
      Without primary confirmation, the latest capital stack and current valuation context cannot be treated as
      canonical in later underwriting.
    diligencePath: Request the latest financing deck, cap-table summary, and legal closing memo from management or lead investors.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO002
      - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, independent directors, reserved-matter rights, and post-acquisition control structure.
    whyItMatters: >-
      Board composition and control terms influence both governance quality and refresh risk around strategic
      acquisitions.
    diligencePath: Request board observer list, governance chart, and shareholder agreement summary.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO005
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: >-
      A management-confirmed current employee count and country split that reconciles 2021, 2024, and 2026 third-party
      estimates.
    whyItMatters: Headcount is a key scale, burn, and operating-complexity input for later financial and risk analysis.
    diligencePath: Request current HR headcount by legal entity and functional area as of the run date.
    relatedQuestionRefs:
      - QO015
      - QO025
  - type: conflicting-data
    severity: minor
    topic: founder-and-origin-record
    missingEvidence: >-
      A canonical company history note clarifying the founding date, early legal entity setup, and which individuals are
      treated as founders.
    whyItMatters: >-
      The conflict is not thesis-breaking, but it weakens confidence in auto-aggregated company-history fields and later
      cross-chapter reuse.
    diligencePath: Request official company-history language or Articles/incorporation summary from legal or investor relations.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: missing-source
    severity: material
    topic: audited-financial-disclosure
    missingEvidence: Public revenue, ARR, margin, or audited financial statements.
    whyItMatters: >-
      Company Overview can tolerate null metrics, but later financial and valuation chapters cannot underwrite quality
      of revenue without more evidence.
    diligencePath: Request 2024 and trailing-2025 management accounts or audited statements.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: public-sam-model
    missingEvidence: >-
      Country-level monetized provider counts, country revenue mix, ARPU, and attach rates between marketplace and
      workflow products.
    whyItMatters: >-
      Without those inputs, public evidence can support TAM and growth logic but not a clean bottom-up SAM or SOM for
      Docplanner.
    diligencePath: >-
      Request country revenue mix, paid doctor counts, clinic count, and attach rates for pro / clinic-management
      modules.
    relatedQuestionRefs:
