- id: final-diligence-and-exit-readiness
  title: Final diligence asks and exit readiness
  body: |-
    Docplanner is already large enough to have plausible exit pathways. It has meaningful revenue, cross-country market leadership, recognized investors, and a product stack that extends into AI and clinic workflows. That is the good news. The bad news is that public information still stops short of the standard required for a clean yes at a late-stage valuation. There is no clear public term-sheet view on the reported 2024 financing. There is no disclosed NRR, clinic retention, or enterprise expansion evidence. There is no public bridge from Noa adoption to AI economics.

    That combination argues for disciplined curiosity instead of reflexive enthusiasm. If management can open the books on debt, preferences, retention, and AI attach rates, the valuation may prove reasonable. If not, the public record leaves too much room for valuation to be supported by narrative rather than by underwritable economics. Exit readiness is therefore credible on category position, but still incomplete on financial quality and disclosure quality.
