company:
  name: Docplanner
chapter:
  number: 8
  title: Valuation
  summary: Docplanner’s public valuation picture points to a real late-stage healthcare software asset, but not to an obvious bargain. Using the official 2024 revenue base and 2026 healthtech/SaaS multiple bands, a fair-value range centers roughly around €0.94 billion to €1.13 billion, with upside above that only if AI monetization, retention quality, and financing terms prove stronger than the public record currently shows; accordingly, the call is research-more with medium confidence and high risk.
sections:
- id: valuation-anchors-and-comparable-context
  title: Valuation anchors and comparable context
  body: |-
    The cleanest anchor in the public record is simple: Docplanner generated €188.688 million of revenue in 2024. That matters because almost every other current price signal is either secondhand, stale, or both. Tracxn and Signalbase point to a roughly $1 billion historical valuation and a reported €140 million 2024 financing event, but without a primary announcement, term sheet, or preference detail, those marks cannot be treated as precise entry prices. They are useful as reference points, not as investment-grade facts.

    Against that revenue base, the 2026 valuation environment looks broad but not permissive. Healthtech and vertical SaaS reference bands cluster around 4x to 6x revenue for good but not pristine assets, with higher bands reserved for faster-growth, higher-margin, or genuinely AI-native businesses. That is why the comparator set matters. Zocdoc provides the closest marketplace-style premium anchor, while Practo, HealthTap, and Infermedica help show where smaller, more regional, or AI-specialist peers sit. None is a perfect match. The right read is that Docplanner deserves a real software multiple for workflow depth and scale, but public evidence does not yet support paying a full AI halo.
