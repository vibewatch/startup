- id: thesis-anti-thesis-and-recommendation
  title: Thesis, anti-thesis, and recommendation logic
  body: |-
    The bullish thesis is straightforward. Docplanner has category scale, localized brand depth, real transaction volume, and a product surface that now extends beyond booking into clinic workflow and AI documentation. Those are exactly the ingredients that can support a premium vertical-SaaS outcome if retention, margins, and AI cross-sell behave well. The official and semi-official evidence base is strong enough to show there is a real business here, not a vanity marketplace.

    The anti-thesis is just as important. The company is still loss-making, carries meaningful debt, and has not publicly disclosed the financing terms or retention metrics that would let investors judge whether the current valuation already assumes the best parts of the story. The AI narrative is promising but only lightly quantified in public. That is why the right call is research-more. At around a €1 billion-style mark, Docplanner screens as fair rather than obviously mispriced. There is upside if AI attach rates, enterprise stickiness, and margin improvement are stronger than the public record shows, but there is also real downside if debt, regulation, or integration complexity consume that upside first.
