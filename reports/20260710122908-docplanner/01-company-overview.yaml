- id: conflicts-adverse-signals-and-open-diligence
  title: Disclosure conflicts, adverse signals, and what still needs diligence
  body: 'The overview is strong on strategic direction and weak on precision around several investor-critical facts. Founder identity is a good example: TechCrunch, tech.eu, EU-Startups, and current company-facing materials all center Mariusz Gralewski as founder and CEO, yet Tracxn lists Luca Puccioni and Lucjan Samulowski as founders. The founding year is similarly noisy: some sources say 2012, tech.eu says 2010, and Tracxn points to a late-2011 Polish legal entity. Current operating scale is also only partially harmonized. Official pages speak in active doctors, appointments, and patient visits; the 2021 Jameda article uses customers, doctors, and monthly patients; the 2024 funding item uses customers plus team size; and Tracxn offers a much higher 2026 employee estimate. Those mismatches do not negate the core story, but they do make exact reuse of current headcount, customer count, or latest-round facts risky without management confirmation.


    The clearest recent adverse event in the public set is the January 2026 Turkish breach notice summarized by Cyber Arts from the authority disclosure. It involved Docplanner''s Turkish entity, human-resources and internal-communications software, and potentially 525 current or former employees'' name and contact data. The April 2026 group privacy notice is not a remediation report, but it does show a mature legal-entity map and explicitly explains how the group uses AI-powered tools in recruiting while saying decisions are not made solely by automation. Even so, the retained public package still lacks a board roster, audited revenue, detailed post-2021 valuation terms, and primary confirmation for the reported October 2024 financing. Those are material diligence gaps, not minor footnotes.'
