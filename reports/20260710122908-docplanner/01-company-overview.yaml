- id: portfolio-architecture-and-local-brands
  title: 'Portfolio architecture: local brands plus clinic-management acquisitions'
  body: 'What stands out in 2026 is that Docplanner has not collapsed everything into one universal global consumer brand. Instead, it appears to run a portfolio. ZnanyLekarz remains the public face in Poland, Doctoralia continues across multiple Spanish-speaking and Portuguese-speaking markets, MioDottore remains active in Italy, Jameda remains active in Germany, and DoktorTakvimi remains the Turkish front end. Those pages are not decorative relics: each still shows live patient flows, specialty search, appointment booking, reminders, and professional upsell modules. The localized scale numbers are uneven, but they are large enough to show that the group still wins through country-specific distribution and language adaptation rather than through one monolithic front door.


    The second portfolio layer is practice and clinic software. TuoTempo pushes enterprise patient-flow operations with online check-in, voice assistant, video consultation, and payments. Feegow adds scheduling, AI-assisted records, financial workflows, and insurer modules. That matters for later chapters because it means Docplanner''s product footprint is broader than a reputation or booking marketplace: it is progressively assembling a multi-SKU stack for consumer discovery, practice workflow, and larger institutional operations. The acquisition history also suggests management prefers buying strong local or functional assets—Doctoralia, Jameda, TuoTempo, Feegow, MyDr—rather than relying only on greenfield launches.'
