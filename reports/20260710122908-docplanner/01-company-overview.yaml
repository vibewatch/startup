company:
  name: Docplanner
chapter:
  number: 1
  title: Company Overview
  summary: Docplanner has credible public evidence of being a large multi-brand healthcare-booking and practice-software platform spanning Europe and Latin America, with official 2026 claims of 13 countries, 25 million monthly appointments, 100 million patient visits, and 300,000 active doctors. The best-corroborated capital history still runs through the 2019 €80 million Series E and 2021 unicorn-era Jameda acquisition, while a reported October 2024 €140 million raise remains only low-confidence context absent a matching primary announcement. The business looks broader than a directory thanks to TuoTempo, Feegow, and other workflow assets, but current headcount, exact customer definitions, governance, and latest valuation terms remain only partially disclosed.
sections:
- id: identity-and-operating-footprint
  title: Identity, mission, and operating footprint
  body: 'Docplanner is no longer just a Poland-origin appointment-booking directory; the current official group site describes a broader healthcare ecosystem that connects patients with doctors and layers workflow software on top of discovery and booking. The company still markets the two-sided patient side openly—find a doctor, book a visit, solve a health-related doubt—but it also frames its doctor and clinic products as tools to cut no-shows, automate communication, and help providers manage practice operations. That business-model duality shows up repeatedly across the retained source set: 2019 funding coverage described two pillars of a consumer marketplace and cloud software for providers, while current local brand pages in Spain, Brazil, Poland, Turkey, Italy, Mexico, and Germany all carry both patient-booking surfaces and professional upsell paths such as Doctoralia Pro, ZnanyLekarz Pro, or Noa Notes.


    Official current scale claims are large but require precise wording. The group site and Chile homepage say Docplanner leads in 13 countries, books 25 million appointments per month, draws 100 million patient visits monthly, and serves 300,000 active doctors. Those are company claims rather than audited disclosures, but they are reinforced by a wide local-brand footprint that still appears active across Europe and Latin America. The April 2026 privacy notice adds another useful identity datapoint: Docplanner formally describes itself as an international group of companies with headquarters in both Barcelona and Warsaw, not merely a single-country startup that happens to have satellite offices. That dual-center description reconciles older articles that emphasized Warsaw with later operating materials that increasingly reference Barcelona alongside Poland.'
