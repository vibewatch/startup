callouts:
- calloutType: strength
  title: The company appears to compound through local brands plus workflow software, not just SEO traffic
  body: The retained source set supports a deeper operating model than a simple doctor directory. Docplanner still keeps country-native consumer brands alive, but it also layers doctor software, clinic-management acquisitions, and AI workflow tools on top of that demand surface. That combination is why the company has stayed strategically relevant beyond early booking-marketplace hype.
  claimRefs:
  - CO016
  - CO027
  - CO030
  - CO031
- calloutType: risk
  title: The most important overview risk is disclosure quality, not lack of momentum
  body: Docplanner's public package proves broad scale and a long acquisition history, but it does not cleanly settle current headcount, customer definitions, latest funding terms, board composition, or post-2021 valuation. The January 2026 Turkish breach notice adds a real control-risk datapoint that later chapters should treat seriously.
  claimRefs:
  - CO037
  - CO038
  - CO039
  - CO040
  - CO042
