      - number: '2.3'
        title: 买方地图、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              买方高度分散，既是机会，也会拖慢采用速度。Terminus
              自身的表述指向企业、公共管理者和其他公共领域参与方，而不是一个单独的预算负责人。相邻智慧城市厂商面向市政、机场、体育场、工业运营商和设施所有者，价值主张包括交通优化、占用率、安全、排放和运营效率。这与公共服务提效、基础设施数字化、低成本部署
              AI
              以及人机协同运营工作流等市场驱动因素一致。约束在于预算通常由项目、合作伙伴和具体工作流驱动，因此扩张要跨过采购、较长实施周期和本地生态关系。公开披露尚未按地区和业务分开软件、硬件与服务经济性；买方证据足以支持分层，却不足以高置信度搭建
              SAM/SOM。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
