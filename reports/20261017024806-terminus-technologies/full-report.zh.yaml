      - number: '1.3'
        title: 融资、规模与数据可靠性
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这是一家确实已规模化的私营公司，但无法支持一个干净的单一估值故事。Tracxn 称 Terminus 已通过五轮披露融资筹得 $899 million，包括 2017 年 7 月 $73.7
              million 的 Series A、2019 年 8 月 $283 million 的 Series C、2021 年 9 月 $93 million 的 Series D 和 2023 年 12 月 $277
              million 的 Series D。China Economic Review 另报 2024 年 4 月由 AL Capital 与 Yuyao Yangming 领投的 RMB 2 billion（$276
              million）融资，China Everbright 和 SenseTime 也参与其中。较新的招股书衍生报道显示其运营规模可观：KR Asia 报告 2024 年收入 RMB 1.843
              billion、同比增长 83.2%、342 个客户、覆盖 160 座城市的 800 多个客户，以及约 1,300 个合作伙伴。弱点在于画像一致性而非规模：Tracxn 显示当前估值 $1 billion，而
              Silicon Valley Invest Club 的资料页显示 2023 年 12 月估值 $4 billion、总部在美国且仅有一轮融资，因此在拿到主要轮次文件或完整 IPO
              文件前，估值、总部和股权结构结论都应明确保持暂定。
            claimRefs:
              - CO006
