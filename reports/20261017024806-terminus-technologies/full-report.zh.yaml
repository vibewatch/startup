        title: 广度和部署证明支持转换成本，但不透明与执行负担压低护城河信心
        blocks:
          - type: paragraph
            body: >-
              资料池中最强的持久性信号来自产品广度和真实部署。KR Asia 报告截至 2024 年底覆盖 160 座城市的 800 多个客户、约 1,300 家机构的合作伙伴网络，以及高频率的 Expo 2020 Dubai
              机器人运营；更新后的文件摘要则称截至 2025 年中部署足迹已超过 172 座城市的 900 个客户。这说明 Terminus
              能把一体化平台卖进大型运营环境，并在软件、硬件和项目服务嵌入后制造替换摩擦。反面是，公开记录仍未公开定价，还显示此前两次提交失效后反复向 HKEX 重新申报。因此，公司看起来是可信的规模化 AIoT
              竞争者，但相较资本更强的现有龙头或由采购驱动的替代方案，尚难被判断为护城河明确且持久的赢家。
