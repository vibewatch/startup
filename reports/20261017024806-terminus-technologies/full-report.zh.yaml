              - CM010
      - number: '2.2'
        title: 规模测算视角与已观察到的市场获取
        blocks:
          - type: paragraph
            body: >-
              公开来源没有拆出干净的 Terminus 专属 TAM、SAM 或 SOM，因此本章必须采用分层视角，而不能假装一个泛化估算足以支持决策。KrASIA 从类别角度将 AIoT 描述为 AI、5G
              和空间计算的融合层，预计 2025 年全球联网设备超过 30 billion，类别价值达到数千亿元人民币。这说明市场方向和广度，却不是 Terminus 的可寻址支出。更紧的视角是公司变现：2024 年收入
              RMB 1.843 billion、工业数字化收入 RMB 1.64 billion、2024 年 342 个客户、覆盖 150–160 座城市的 800 多个客户，以及 RMB 2.3 billion
              的当前订单。这些指标比自上而下的 TAM 叙事更有决策价值，但第三方数据库连估值和分类都意见不一，因此仅凭画像网站构建的市场规模结论仍缺乏信心。
