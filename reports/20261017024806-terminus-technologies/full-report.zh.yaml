            body: >-
              乐观情景不是 Terminus 没有规模，而是规模加第三次 HKEX
              申报最终能带来透明定价、更好的融资选择和更窄的亏损轮廓。基准情景更保守：这是一家有客户证明和战略支持者的真实企业，但关于当前资本栈的公开细节太少，经营亏损强度太高，无法捍卫明确估值区间。悲观情景很直接：如果上市时间再次延后、经审计
              FY2025 经济性显示利润率或现金消耗差于预期，或市场定价条款低于历史私募估值，路径就会从延迟的上行转为估值重置。因此，本章的情景分析只能用于定方向，而不能假装精确。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调问题与论文破坏因素
        blocks:
          - type: paragraph
            body: >-
              收尾有两个主导问题。第一，投资者仍需要实时定价证据：最终 HKEX 估值、基石需求、募资用途，以及 2025 年申报后任何更新的优先权或稀释结构。第二，需要超越收入和净亏损标题的经济数据，包括经审计 FY2025
              毛利率、现金流、客户集中度和续约数据。证据环境本身还藏着流程风险：只按英文名称检索 “Terminus Technologies” 会出现无关的英国/美国和新西兰公司，若分析师不围绕 Terminus Group
              和 HKEX 发行人记录归一化，就可能污染自动可比公司筛选或数据库抓取。论文破坏事件会是另一次流动性流程失败，或当前条款相较历史私募估值叙事出现明显下调。
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
