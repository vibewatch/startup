  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与结构
        blocks:
          - type: paragraph
            body: >-
              Terminus 更适合被理解为通过项目和捆绑部署变现的全栈 AIoT 厂商，而不是拥有公开披露、边界清晰的经常性软件合同池。Multiples 称公司通过 TacOS 销售软件、硬件、算力和服务；2025 年
              11 月 IPO 摘要称收入来自包含软件、硬件和项目服务的全栈 AIoT 产品。KRASIA 基于招股书的报道进一步显示这些商业化落在四个应用垂直领域，其中工业数字化是 2024
              年的主要收入引擎。这个结构对尽调很关键：已报告的规模可能由不均匀的项目部署、硬件内容和服务交付驱动，而不是由公开、清晰披露的 ARR 基础驱动。
