        title: 展示
        blocks:
          - type: callout
            title: 已观察到的变现比标题式 TAM 叙事更可靠
            body: 最有决策价值的规模证据是 Terminus 披露的 2024 年收入、业务组合、客户数和订单簿，而不是公开来源无法对应到明确买方群体的泛化“智慧城市”或“AIoT”TAM 说法。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
          - type: callout
            title: 买方分散与画像漂移压低规模测算信心
            body: 公开证据识别出真实买方类型，但预算归属仍由项目驱动且分散；第三方数据库对估值、类别乃至公司画像细节都存在分歧。因此，公开市场规模测算可以用于确定方向，却不足以高置信度支持 SAM/SOM 或估值倍数。
            calloutType: risk
