      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - HKEX 流程转化为可信定价，客户和收入规模持续扩大，亏损显著收窄。
        - 如果公开条款验证历史估值标记且摊薄保持可控，旧的私募估值标记会更有说服力。
        - IPO 条款令人失望；利润率改善没有实现。
        - 可能发生，但在实时定价出现前缺乏支持。
      - - 基准
        - 业务真实且已具规模，但公开证据仍未完整覆盖股权结构表、定价和 FY2025 经济数据。
        - 保持观察名单姿态；新资金入场不要锚定过时的 $4b 式估值标记。
        - 投资者没有新的条款清单，却继续外推旧估值标记。
        - 最受当前证据支持。
      - - 看跌
        - 如果再次延迟、簿记建档疲弱或财务数据更新，说明公司质量或最终定价可能低于历史叙事所暗示的水平。
        - 回报画像下移，因为下行风险来自价格压缩，而不只是增长放缓。
        - 流动性兑现时间再次延后；亏损仍处于高位。
        - 如果条款透明度没有改善，下行风险具有可信度。
    notes: 由于当前公开来源没有披露实时 IPO 定价、优先权安排或完整的 FY2025 经审计现金流画像，情景概率仅作定性判断。
