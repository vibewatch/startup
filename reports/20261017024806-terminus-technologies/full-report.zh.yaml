chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与公开画像
        blocks:
          - type: paragraph
            body: >-
              最一致的身份判断是：Terminus 是 AIoT 平台和智慧城市基础设施公司，而不是单一产品 SaaS 厂商。官网称 Terminus Group 是专注于 AI 城市、可持续发展和机器人领域的“国际领先 AI
              智能服务提供商”；Tracxn 则将其描述为一家 2015 年成立、总部位于北京的 Series D 公司，开发端到端 IoT
              智慧城市方案，包括联网门禁、停车管理和云端分析。之后源自招股书的报道显示，其工业和城市级运营规模明显大于早期产品简介所暗示的水平。尽调中还要注意身份清洁：法律名称 “Terminus Technologies”
              也会检索出一家无关的 Essex/Indianapolis 智慧城市初创公司和一家新西兰定制软件公司，因此后续研究应优先使用 Terminus Group URL 和经交叉验证的融资历史，而非单独名称的网页结果。
            claimRefs:
              - CO001
