      - number: '3.2'
        title: 公开基准更能说明规模和定位，难以透明比较同业
        blocks:
          - type: paragraph
            body: >-
              可获得的可比公司证据并不对称。EquityZen、Silicon Valley Invest Club
              以及投资者和新闻报道提供了类别、估值和融资背景，却没有公布目录价格、标准化打包或明确的输赢对比。即使最强的独立运营信息，也更强调收入增长、客户足迹、旗舰部署或资本市场活动，而不是合同结构。因此，尽调仍缺少逐笔交易的竞争信息：市场看得出公司规模已足够重要，却看不出买方在价格、功能或实施风险上多频繁选择它而非现有龙头厂商套件、集成商或内部团队。资料池还表明，简单网页检索会混入同名无关厂商，进一步干扰外部基准比较。
