            body: >-
              新融资证据确认 Terminus 仍能融资，但尚不能证明资本充足。Multiples 记录 2024 年 4 月 $276 million 的 Series D，以及 2024 年 8 月约 $2.9
              billion 估值下 $7 million 的战略轮；Verdict 对 Investcorp 的公告则未披露投资金额。最新 IPO 相关来源更谨慎：Ryanben Capital 的 2025 年 11
              月香港上市摘要称，这是公司第三次向 HKEX 申报，此前两次申报已失效。              没有现金余额、经营现金流、债务额度或募资用途细节，融资栈只能看到轮次概要，无法看到投资者进行投资判断所需的跑道。
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              前瞻财务结论喜忧参半。相较上一轮报告，公司现在有明显更好的公开规模证据，应收账款改善也方向正确，但盈利能力和披露质量仍落后于增长故事。Ryanben Capital 的 IPO 摘要报告 2024 年净亏损
              RMB 2.10 billion、经调整净亏损 RMB 973
              million，说明增长尚未转化为公开盈利。同时，第三方市场数据提供商对累计融资或估值历史并不一致，且一个广泛可访问的收入画像明确称其来源未记录。在管理层提供经审计 FY2025
              报表、按收入流拆分的毛利率、实际定价、客户集中度、续约行为及现金/跑道细节前，本章只能支持“继续研究”立场。
            claimRefs:
              - CI010
