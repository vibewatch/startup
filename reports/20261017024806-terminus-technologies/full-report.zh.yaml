  - id: FE001
    title: 产品架构图
    type: stack
    summary: 保留来源描述了一套分层技术栈：从场景专属模型和基础设施出发，经 TacOS 编排，落到已部署的智能体和项目化智慧城市工作流。
    data:
      layers:
        - label: 应用场景
          detail: 公开描述的终端市场包括 AI 驱动的城市、工业智能化、智慧生活和能源智能。
          modules:
            - AI 驱动的城市
            - 工业智能化
            - 智慧生活
            - 能源智能
          outputs:
            - 项目化智慧城市与园区部署
            - 现场运营工作流
        - label: 智能体与终端
          detail: 机器人、可穿戴设备和交互式硬件构成现场部署中可见的用户界面层。
          modules:
            - Titan / 服务机器人部署
            - 可穿戴设备与交互式入口硬件
          outputs:
            - 人机交互
            - 现场数据采集
        - label: TacOS 编排
          detail: TacOS 和 TacOS 3.0 被描述为连接数据、资源以及云—边—端协同的操作层。
          modules:
            - 城市级 AIoT 操作系统
            - 云—边—端管理
            - 跨场景资源调度
          outputs:
            - 跨域数据互联
            - 实时协同
        - label: 交付与集成
          detail: 业务还通过面向城市和企业的项目实施、系统集成及场景化运营服务交付。
          modules:
            - 系统集成
            - 场景实施
            - 运营服务
          outputs:
            - 实际项目部署
            - 客户工作流适配
        - label: 空间智能与基础设施
          detail: 近期报道描述了平台底层的基础设施产品，包括硬件集群，以及针对新一代 AI 技术栈优化的软件平台。
          modules:
            - 领域模型
            - 绿色高性能计算单元
            - 硬件集群
            - 融合芯片、网络、云和 AI 的软件平台
          outputs:
            - 部署所需的算力基础
            - 面向空间智能的平台现代化
        - label: 信任与控制缺口
          detail: 相对于其声称的技术栈广度，公开证据对安全、隐私、开发者和正常运行时间控制的记录仍然不足。
          modules:
            - 安全文档
            - 隐私架构
            - API 与开发者工具
          outputs:
            - 在分享内部材料前构成尽调阻碍
            - 受监管应用场景的验证负担更重
    approximationNotes: 分层边界综合自公开描述，不代表已有完整记录的参考架构。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，客户路径可能由合作伙伴协助，从场景筛选走向标杆部署，但续约经济性仍不确定。
    data:
      nodes:
        - label: 场景筛选
          actor: Municipal, venue, enterprise, and public-facility buyers
          phase: Initial commercial targeting
          channels:
            - Direct business development
            - Ecosystem partner introductions
          touchpoints:
            - Buildings, communities, parks, cities, and carbon-neutrality scenarios
            - Global smart-city and industrial-digitalization positioning
        - label: 方案界定
          actor: Buyer operations teams and implementation partners
          phase: Use-case design
          channels:
            - AIoT platform and smart-service proposals
            - Localized deployment planning
          touchpoints:
            - Industrial operations
            - Smart venues
            - Public facilities
        - label: 部署启动
          actor: Terminus plus delivery partners
          phase: Initial rollout
          channels:
            - Site integration
            - Hardware plus platform activation
          touchpoints:
            - Robots at Expo 2020 Dubai
            - Park and city deployments
        - label: 日常运营验证
          actor: Front-line operators and visitors
          phase: Live usage
          channels:
            - Operational monitoring
            - Service interaction
          touchpoints:
            - More than 650,000 Expo robot interactions
            - More than 84,000 operating hours reported at Expo
        - label: 扩张与客户背书
          actor: Existing customers, partners, and new buyer prospects
          phase: Reference-led growth
          channels:
            - Public customer stories
            - Partner network
          touchpoints:
            - More than 800 clients across 160 cities
            - About 1,300 partner organizations
        - label: 续约与集中度检验
          actor: CFO, procurement, compliance, and investor diligence teams
          phase: Durability checkpoint
          channels:
            - Renewal review
            - Regulatory and procurement diligence
          touchpoints:
            - No public NRR, GRR, churn, or top-customer-share disclosure
            - Additional cross-border and U.S. public-procurement friction for some Chinese-entity relationships
