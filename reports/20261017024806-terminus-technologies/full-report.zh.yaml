        title: 展示
        blocks:
          - type: callout
            title: 等待实时条款，而不是只看历史估值标记
            body: 公开来源显示规模和融资历史，但仍未提供当前、由市场出清的价格，也没有足够股权结构细节来有信心评估入场回报。
            calloutType: recommendation
