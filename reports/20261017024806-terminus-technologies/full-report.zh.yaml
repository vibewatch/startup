  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐仍然谨慎，因为真实规模证据被高额亏损、过时的估值标记、尚未定价的申报流程以及嘈杂的同名数据集抵消。
    data:
      nodes:
        - id: scale-proof
          label: 客户与收入规模得到验证
          detail: 覆盖 172 座城市的 900+ 客户；2024 年收入 RMB 1.843bn
        - id: profitability-gap
          label: 报告亏损仍然严重
          detail: 2024 年净亏损 RMB 2.100bn
        - id: valuation-marks
          label: 二级市场估值标记，而非实时定价
          detail: 2019 年 Dealroom 估值和 2023 年简报估值都不是当前最终成交价
        - id: listing-readthrough
          label: 第三次港交所申报仍未定价
          detail: 2025 年申报之前已有两次申报失效
        - id: diligence-noise
          label: 同名数据集需要标准化
          detail: 其他同名公司可能污染自动化筛选结果
        - id: recommendation
          label: 继续研究 / 高风险 / 估值偏高
          detail: 等待实时条款和更新后的经审计经营数据，再判断是否入场
      edges:
        - from: scale-proof
          to: recommendation
          detail: 规模使公司仍具投资价值
        - from: profitability-gap
          to: recommendation
          detail: 亏损限制投资判断的信心
        - from: valuation-marks
          to: recommendation
          detail: 历史估值标记不能决定今天的入场价
        - from: listing-readthrough
          to: recommendation
          detail: 流动性路径仍不完整
        - from: diligence-noise
          to: recommendation
          detail: 做可比公司分析前，先统一实体身份
    approximationNotes: 这条逻辑链是定性的；它展示推荐背后的证据链，而不是隐含的评分或概率模型。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
