      - number: '1.2'
        title: 管理层、业务足迹与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              Victor Ai 是公司持续对外的核心人物，也是当前证据集里最明显的关键人依赖。官网和 Tracxn 都将他列为创始人兼 CEO；官方档案还提到首席科学家 Ling Shao 和 CTO Hua
              Xiansheng，使 Terminus 在创始人之外也具备可见的科学与技术领导力，尽管资料池没有呈现同等详细的董事会或财务团队名单。地域足迹看起来真实，但应准确表述：Tracxn
              将公司定位为北京企业，China Economic Review 称其创立于重庆，公司及独立证据都指向 2021
              年随迪拜扩张而来的中东和北非总部布局。因此，里程碑更像持续国际化、产品迭代和曝光活动，而非一次性的智慧城市试点。
            claimRefs:
