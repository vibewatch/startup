  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争首先取决于范围，而不是单一功能清单
        blocks:
          - type: paragraph
            body: >-
              现有资料持续将 Terminus 描述为城市和公共空间 AIoT 平台，而非窄型工作流应用。2025 年 HKEX 文件摘要称 TacOS
              向企业、公共管理者和其他公共空间参与方销售软件、硬件和服务的全栈组合；KR Asia 及投资者材料显示业务覆盖工业数字化、AI
              城市、智慧生活和能源智能。这种广度意味着买方比较的不只是点方案，还包括更广泛的城市数字化项目、系统集成商和内部自建路径。公开来源支持其类别相关性和部署规模，但尚未给出边界一致、可直接比较的明确同业名单。
