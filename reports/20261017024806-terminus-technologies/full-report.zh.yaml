  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              做市场规模前，首先要界定 Terminus 实际销售什么。第三方画像和公司材料都把业务放在
              AIoT，但反复出现的更窄边界是公共领域基础设施：智慧社区、办公楼、园区、能源管理、城市管理和机器人部署，处在企业软件、基础设施硬件与项目交付之间。这个边界很重要，因为泛化的智慧城市叙事会夸大可直接变现的机会。最相关的替代集合也不是单一软件类别，而是城市运营平台、工业数字化栈，以及卖给市政、交通、场馆和设施工作流的窄型感知系统。换言之，智慧城市只是更广泛基础设施运营市场中的一组用例，不足以单独定义市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
