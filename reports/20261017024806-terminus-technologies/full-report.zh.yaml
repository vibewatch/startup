        title: 产品定义与公开可见的模块范围
        blocks:
          - type: paragraph
            body: >-
              现有来源将 Terminus 描述为覆盖软件、硬件和项目交付的 AIoT 平台提供商，而不是单一设备。Baidu 公司简介称 Terminus
              以全生命周期服务覆盖社区园区、公用事业、电力能源、零售和文化博物馆，同时独立开发 TacOS 作为城市级 AIoT
              操作系统。该简介还描述了横跨云、边和设备的全栈产品族，明显宽于一些外部公司画像数据库仍在使用的“机器人”简称。就尽调而言，关键判断是把 Terminus
              按带嵌入式硬件端点的系统集成商和平台运营商来评估，而不只是机器人供应商。公开可见的差异化不在某一个终端，而在公司如何把运营软件、基础设施和场景化交付绑成一套栈。
