callouts:
  - calloutType: risk
    title: The public-listing path is still a risk event, not a finished catalyst
    body: >-
      Refiling is evidence of persistence, not closure. Another slip in the HKEX process would keep both liquidity and valuation support harder to verify from public sources.
    claimRefs: [CR002, CR006, CR007, CR016]
  - calloutType: insight
    title: Showcase density should not be mistaken for resilience proof
    body: >-
      Public references show wide deployment ambition, but the underwritten risk really sits in compliance ownership, incident response, and whether marquee projects convert into repeatable profitable work.
    claimRefs: [CR001, CR011, CR012, CR014]
