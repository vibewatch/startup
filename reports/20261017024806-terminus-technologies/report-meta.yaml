companyProfile:
  summary: >-
    Terminus Technologies is a private Chinese AIoT platform company founded in 2015 with a Beijing operating base and
    founder-led control under Victor Ai. It sells a full-stack smart-city and industrial digitalization offering
    spanning software, hardware, cloud-edge-device orchestration, and project delivery. Public sources support real
    deployment breadth and a meaningful customer base, but they also show conflicting valuation marks, limited
    disclosure on margins and runway, and a noisy public name footprint that requires issuer-level normalization.
