company:
  name: Terminus Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a real scaled AIoT business with meaningful customer deployment and prior
    institutional financing, but the latest valuation support is still indirect: a stale 2019 Dealroom estimate,
    a 2023 third-party tear sheet, and an unpriced 2025 HKEX filing after two prior lapses. Given heavy reported
    2024 losses, missing live price-setting terms, and noisy name-matched datasets, the supportable stance remains
    research-more, high risk, and stretched rather than an underwrite-now buy.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The strongest public evidence cuts in opposite directions. Tencent's November 2025 IPO coverage gives
      Terminus real operating scale, reporting more than 900 customer deployments across 172 cities and 2024 revenue
      of RMB 1.843 billion, which keeps a credible growth thesis alive. The same source also reports a 2024 net loss
      of RMB 2.100 billion, while third-party valuation evidence remains indirect rather than market-clearing. A 2023
      tear sheet lists a $4 billion latest valuation without EV/revenue disclosure, and 2025 public filing coverage
      still does not provide final IPO pricing or book quality. That mix is sufficient to keep Terminus on the
      diligence list, but not sufficient to justify a buy recommendation at an assumed private mark. The supportable
      call is research-more with a stretched valuation stance and a high risk rating until live pricing and updated
      audited economics are available.
    claimRefs: [CV006, CV007, CV008, CV009, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context-and-evidence-quality
    title: Valuation context and evidence quality
    body: >-
      The financing record proves sustained investor access, but it does not provide enough current price discovery.
      Dealroom lists a 2017 Series A, 2018 Series B, and 2019 Series C, with a Dealroom estimate of €1.0-1.5 billion
      as of August 2019. Independent 2020 reporting from PrivSource and Verdict confirms Investcorp made a strategic
      growth investment, yet both note the transaction amount was undisclosed. A separate Silicon Valley Invest Club
      tear sheet compiled as of December 2023 lists a $4 billion latest valuation and a Series D label, but it also
      says EV/revenue and stage are not disclosed for any round. For a late-stage company contemplating liquidity,
      that means the public market can observe valuation direction but not enough term detail to underwrite dilution,
      preference overhang, or return math from today's entry point.
    claimRefs: [CV002, CV003, CV004, CV008, CV009]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Bull, base, and bear framing
    body: >-
      The bull case is not that Terminus lacks scale; it is that scale plus a third HKEX filing can eventually
      translate into transparent pricing, better financing optionality, and a narrower loss profile. The base case is
      more conservative: a real business with customer proof and strategic backers, but with too little public detail
      on the current capital stack and too much operating-loss intensity to defend a firm valuation range. The bear
      case is straightforward. If listing timing slips again, if audited FY2025 economics show margins or cash burn
      worse than investors expect, or if market-clearing terms come in below legacy private marks, the path shifts
      from delayed upside to valuation reset. That is why scenario work here is directional rather than falsely
      precise.
    claimRefs: [CV005, CV007, CV008, CV013, CV014]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      Two diligence issues dominate the close. First, investors still need live price-setting evidence: final HKEX
      valuation, cornerstone demand, use of proceeds, and any updated preference or dilution structure after the 2025
      filing. Second, they need economics that go beyond revenue and net loss headlines, including audited FY2025
      margin, cash-flow, customer concentration, and renewal data. There is also a process risk hidden in the
      evidence environment itself: English-language name-only searches for "Terminus Technologies" surface unrelated
      UK/US and New Zealand companies, which can pollute automated comp screens or database pulls unless the analyst
      normalizes around Terminus Group and the HKEX issuer record. A thesis-break event would be another failed
      liquidity process or current terms that imply a clear step-down from the legacy private-valuation narrative.
    claimRefs: [CV005, CV010, CV011, CV012, CV013]
callouts:
  - calloutType: recommendation
    title: Wait for live terms, not just legacy marks
    body: >-
      Public sources show scale and financing history, but they still do not provide a current, market-clearing price
      or enough cap-table detail to underwrite entry returns with confidence.
    claimRefs: [CV008, CV009, CV013, CV014]
