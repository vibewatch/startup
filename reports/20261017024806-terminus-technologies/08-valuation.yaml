      - [Anti-thesis, "2024 net losses remain large relative to disclosed revenue, and the latest HKEX process still does not reveal final pricing or a clean return setup.", "Transparent listing terms plus materially improved profitability would reduce downside concern."]
      - [Entry discipline, "Historical rounds and third-party marks show financing access, but public sources do not yet support precise current valuation underwriting.", "A priced IPO or new arm's-length financing round with disclosed terms would convert direction into actionable valuation evidence."]
    notes: >-
      Pairs the core upside and downside arguments with the specific missing evidence that would move the recommendation.
    claimRefs: [CV002, CV003, CV004, CV005, CV007, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "HKEX process converts into credible pricing, customer/revenue scale continues, and losses narrow materially.", "Legacy private marks become more defensible if public terms validate them and dilution stays manageable.", "IPO terms disappoint; margin improvement does not materialize.", "Possible but unsupported until live pricing appears."]
      - [Base, "Business is real and scaled, but current public evidence remains incomplete on cap table, pricing, and FY2025 economics.", "Maintain watchlist posture; do not anchor on stale $4b-style marks for new money entry.", "Investors extrapolate old marks without fresh term sheets.", "Most supported by current evidence."]
      - [Bear, "Another delay, weak book-building, or updated financials imply weaker quality or lower clearing price than legacy narratives suggest.", "Return profile resets lower because downside comes from price compression, not just slower growth.", "Liquidity timing slips again; losses stay elevated.", "Credible downside if term transparency does not improve."]
    notes: >-
      Scenario probabilities are qualitative because current public sources do not disclose live IPO pricing, preferences, or a full FY2025 audited cash-flow profile.
    claimRefs: [CV005, CV007, CV008, CV009, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays cautious because real scale evidence is offset by heavy losses, stale valuation marks, an unpriced filing process, and noisy name-matched datasets.
    data:
      nodes:
        - id: scale-proof
          label: Scaled customer and revenue proof
          detail: 900+ customers in 172 cities; 2024 revenue RMB 1.843bn
        - id: profitability-gap
          label: Reported losses remain heavy
          detail: 2024 net loss RMB 2.100bn
        - id: valuation-marks
          label: Secondary marks, not live pricing
          detail: 2019 Dealroom estimate and 2023 tear-sheet mark are not current clearing prices
        - id: listing-readthrough
          label: Third HKEX filing still unpriced
          detail: 2025 filing followed two lapsed submissions
        - id: diligence-noise
          label: Name-matched datasets need normalization
          detail: Other same-name companies can pollute automated screens
        - id: recommendation
          label: Research-more / high risk / stretched
          detail: Wait for live terms and updated audited economics before underwriting entry
      edges:
        - from: scale-proof
          to: recommendation
          detail: Scale keeps the company investable
        - from: profitability-gap
          to: recommendation
          detail: Losses cap underwriting confidence
        - from: valuation-marks
          to: recommendation
          detail: Legacy marks do not set today's entry
        - from: listing-readthrough
          to: recommendation
          detail: Liquidity path is still incomplete
        - from: diligence-noise
          to: recommendation
          detail: Normalize entity identity before comp work
    approximationNotes: >-
      Logic flow is qualitative; it shows the evidence chain behind the recommendation rather than an implied score or probability model.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV014]
