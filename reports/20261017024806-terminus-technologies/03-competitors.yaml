    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of the alternative classes visible in the assigned pool, balancing deployment breadth against how transparently public sources expose apples-to-apples comparisons.
    data:
      xAxis:
        label: Deployment breadth
        min: 0
        max: 5
        low: Narrow workflow
        high: Multi-scenario platform
        description: Ordinal estimate from retained public evidence
        scale: ordinal
      yAxis:
        label: Public comparison transparency
        min: 0
        max: 5
        low: Opaque
        high: Transparent
        description: Ordinal estimate from retained public evidence
        scale: ordinal
      points:
        - label: Terminus
          x: 4.5
          y: 1.5
          note: Broad stack and real deployments are visible; public pricing is not
          claimRefs: [CP001, CP003, CP012, CP013, CP014]
        - label: Full-stack incumbent suites
          x: 4.0
          y: 2.5
          note: Likely broad substitutes, but the assigned pool lacks retained named benchmarks
          claimRefs: [CP013, CP014]
        - label: System integrators
          x: 3.5
          y: 1.0
          note: High customization potential, but low standard-product transparency
          claimRefs: [CP013, CP014]
        - label: Internal build programs
          x: 3.0
          y: 0.5
          note: Buyers can tailor scope internally, but no off-the-shelf public comparison exists
          claimRefs: [CP013, CP014]
        - label: Point-solution vendors
          x: 2.0
          y: 3.5
          note: Easier to compare when scope is narrow, but they do not match Terminus breadth
          claimRefs: [CP003, CP013]
        - label: Same-name smart-city entrants
          x: 1.5
          y: 2.0
          note: Visible in web discovery, but not evidence of equal scale or direct substitution
          claimRefs: [CP011]
    approximationNotes: >-
      Coordinates are ordinal analytical estimates based on retained source descriptions of scope, deployment evidence, and disclosure quality. The assigned pool does not contain a
      measured third-party benchmark that would justify precise quantitative scoring.
    claimRefs: [CP011, CP013, CP014]
callouts:
  - calloutType: insight
    title: Terminus competes against bundle buyers, not only app buyers
    body: >-
      Retained sources make Terminus look more like a public-space AIoT stack than a single application, so the real alternative set includes integrators and internal build paths in
      addition to narrower vendors.
    claimRefs: [CP001, CP003, CP013]
  - calloutType: risk
    title: Public opacity keeps the moat from looking fully durable
    body: >-
      The assigned pool supports category credibility and deployment scale, but not transparent pricing, standardized packaging, or direct win-loss evidence, so replacement risk
      versus incumbents is still harder to underwrite than the growth story.
    claimRefs: [CP010, CP012, CP013, CP014, CP015]
