  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Customer contracts, pricing sheets, or procurement documents showing how TacOS, hardware, and services are packaged and priced.
      whyItMatters: Without price and contract structure, it is hard to judge whether Terminus wins on product value, bundling, or bespoke project discounting.
      diligencePath: Request current price books, sample SOWs, and the last ten competitive deal sheets with quoted alternatives and discount levels.
    - type: enumeration-incomplete
      severity: material
      topic: competitive-set
      missingEvidence: A named peer roster with feature, deployment, and win-loss comparisons across China's public-space AIoT and smart-city alternatives.
      whyItMatters: The current pool supports category breadth but not a robust apples-to-apples map of which vendors or substitute paths displace Terminus in live deals.
      diligencePath: Request the internal competitor tracker, recent bid lists, and customer references discussing why they chose Terminus over specific alternatives.
