evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, CFO or finance-lead disclosure, and formal governance rights for late-stage investors.
    whyItMatters: >-
      Founder concentration is visible, but governance depth and decision rights remain under-documented for a company
      at this scale.
    diligencePath: >-
      Request the latest board materials, org chart, and financing documents that show reserved matters and observer /
      board seats.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Primary round documents or the full IPO filing pages that reconcile current valuation, headquarters wording, and
      disclosed round count.
    whyItMatters: >-
      Private-market valuation and corporate-profile inconsistencies directly affect return underwriting and credibility
      of later cover facts.
    diligencePath: >-
      Obtain the latest prospectus, round term sheet, and cap table, then reconcile them against Tracxn and Silicon
      Valley Invest Club summaries.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-cash-flow
    missingEvidence: FY2025 audited P&L, EBITDA, operating cash flow, runway, and a management-certified headcount figure.
    whyItMatters: >-
      Revenue growth is public, but efficiency, burn, and operating leverage remain underconstrained without audited
      financial and workforce data.
    diligencePath: >-
      Request the FY2025 audit package or IPO working files and a contemporaneous HR headcount export tied to legal
      entities.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Public disclosure that isolates addressable spend, repeatable contract size, and geography-specific SAM/SOM for
      Terminus's industrial-digitalization and AI CITY businesses.
    whyItMatters: >-
      Without a bottom-up spend boundary, valuation work has to lean on company traction proxies instead of a durable
      view of remaining headroom.
    diligencePath: >-
      Request the IPO prospectus market section, management segmentation by geography and workflow, and any disclosed
      pipeline or win-rate data that separates software, hardware, and services.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owners
    missingEvidence: >-
      Named budget owners, ACVs, renewal patterns, and procurement pathways for city, park, campus, and industrial
      deployments.
    whyItMatters: >-
      Buyer and payer fragmentation affects sales cycles, capital intensity, and the repeatability of any go-to-market
      motion.
    diligencePath: >-
      Obtain customer references, sample contracts, and segment-level pipeline disclosures that identify who signs,
      pays, renews, and expands each workflow.
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: third-party-market-databases
    missingEvidence: >-
      Management-validated valuation history and a reconciled category taxonomy that explains why third-party profiles
      disagree on valuation, headquarters, and market label.
    whyItMatters: >-
      Contradictory profile data can contaminate external market sizing and peer benchmarking if it is treated as a
      factual anchor rather than as noisy secondary evidence.
    diligencePath: >-
      Use the underlying filing history and company-provided financing timeline to reconcile profile databases before
      relying on any one market-data card.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Customer contracts, pricing sheets, or procurement documents showing how TacOS, hardware, and services are
      packaged and priced.
    whyItMatters: >-
      Without price and contract structure, it is hard to judge whether Terminus wins on product value, bundling, or
      bespoke project discounting.
    diligencePath: >-
      Request current price books, sample SOWs, and the last ten competitive deal sheets with quoted alternatives and
      discount levels.
  - type: enumeration-incomplete
    severity: material
    topic: competitive-set
    missingEvidence: >-
      A named peer roster with feature, deployment, and win-loss comparisons across China's public-space AIoT and
      smart-city alternatives.
    whyItMatters: >-
      The current pool supports category breadth but not a robust apples-to-apples map of which vendors or substitute
      paths displace Terminus in live deals.
    diligencePath: >-
      Request the internal competitor tracker, recent bid lists, and customer references discussing why they chose
      Terminus over specific alternatives.
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash-on-hand, debt facilities, covenant headroom, operating cash flow, and management runway plan.
    whyItMatters: >-
      Without liquidity detail, financing headlines cannot be converted into an underwriting view on survival, dilution
      risk, or next-round timing.
    diligencePath: >-
      Request the latest board pack or IPO draft financial section covering cash, debt, burn, and planned use of
      proceeds.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized pricing, discounts, contract duration, and revenue-recognition policy by software, hardware, and project
      services.
    whyItMatters: Revenue quality cannot be assessed from topline growth alone when the mix may be project-led and hardware-heavy.
    diligencePath: >-
      Request signed customer contracts, SKU-level price books, and an accounting memo that bridges bookings to
      recognized revenue.
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, top-customer concentration, renewal, and NRR metrics.
    whyItMatters: These are the core inputs needed to judge whether growth is durable and efficiently acquired.
    diligencePath: Request cohort retention, pipeline conversion, and customer concentration schedules for 2024 and 1H25.
  - type: access-blocked
    severity: minor
    topic: external-profile
    missingEvidence: A usable external company-profile page with directly readable financial detail.
    whyItMatters: >-
      The assigned EqualOcean page did not yield usable financial content in this run, which limits cross-checking
      against other market-data summaries.
    diligencePath: >-
      Use the original external profile only if a readable archived or non-JavaScript version becomes available in a
      future source pool.
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, API or SDK documentation, practitioner forum traffic, package telemetry, or another
      verified developer-signal proxy for TacOS, BitInfra, or intelligent-agent tooling.
    whyItMatters: >-
      Without a developer or practitioner signal, it is hard to validate ecosystem pull, implementation friction, or
      whether the platform has repeatable external integration usage beyond project delivery.
    diligencePath: >-
      Request product documentation, public or private API references, partner implementation artifacts, and any
      practitioner-community metrics that demonstrate external usage.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: trust-gap
    missingEvidence: >-
      Security, privacy, compliance, and reliability documentation for TacOS and the newer spatial-intelligence stack,
      including any certifications, architecture controls, incident reporting, or public status artifacts.
    whyItMatters: >-
      Product ambition is broad, but public trust evidence is too thin to underwrite regulated or mission-critical
      deployments on deployment stories alone.
    diligencePath: >-
      Request security white papers, privacy architecture, certification schedules, uptime reporting, and customer
      security review materials tied to production deployments.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: implementation-economics
    missingEvidence: >-
      Module-level deployment timelines, pricing structure, and maintenance or fleet-service requirements by product
      layer.
    whyItMatters: >-
      The available evidence shows what Terminus claims to deploy, but not how repeatable or margin-accretive each layer
      is.
    diligencePath: >-
      Request implementation plans, hardware BOM or servicing assumptions, pricing sheets, and case-study economics for
      representative smart-city or industrial projects.
    relatedQuestionRefs:
      - QE003
      - QE004
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Public disclosure of NRR, GRR, churn, renewal rates, contract duration, or cohort-level customer retention.
    whyItMatters: Customer growth counts and project references do not prove recurring revenue durability or successful renewals.
    diligencePath: >-
      Request cohort retention, renewal, and contract-tenure data for 2023-2025, plus top-decile account expansion
      behavior.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-customer share, top-10 customer concentration, channel-partner revenue share, and government exposure by
      revenue.
    whyItMatters: >-
      Without concentration data, investors cannot judge whether growth is diversified or driven by a small number of
      public projects or channel relationships.
    diligencePath: >-
      Ask management for customer concentration tables, partner-channel mix, and public-sector revenue exposure by
      geography and segment.
    relatedQuestionRefs:
      - QU005
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: >-
      A complete named-customer list with deployment status, contract scope, and dates for the full public reference
      set.
    whyItMatters: >-
      The current named-customer table is a representative sample, so it cannot prove how many references are pilots,
      scaled production accounts, or one-off showcase projects.
    diligencePath: >-
      Reconcile every public reference and customer story into a master list with contract stage, go-live date, and
      latest renewal status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: liquidity-runway
    missingEvidence: Audited FY2025 cash flow, net cash, debt stack, covenant package, and post-IPO proceeds bridge.
    whyItMatters: Persistent net losses are visible publicly, but the financing runway behind those losses is not.
    diligencePath: >-
      Request the latest audited financial package and compare it with the most recent prospectus cash and proceeds
      disclosure.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-compliance
    missingEvidence: >-
      MLPS or CIIO classification work, certifications, regulator correspondence, and the incident-response playbook for
      live deployments.
    whyItMatters: The public legal framework is clear, but the company's actual control maturity is not.
    diligencePath: >-
      Ask for the internal compliance map, security ownership matrix, tabletop-drill history, and any material regulator
      interactions.
    relatedQuestionRefs:
      - QR004
      - QR005
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Customer, project, geography, and partner concentration by revenue, backlog, and renewal value.
    whyItMatters: >-
      Marquee projects and ecosystem partners are highly visible in public materials, but concentration is not
      quantified.
    diligencePath: Request the top-customer, top-project, and top-partner revenue breakdown plus contract tenure and renewal data.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register
    missingEvidence: >-
      Deployment-level licenses, approvals, and case-specific regulatory findings for each major geography or
      public-sector scenario.
    whyItMatters: The register can rank visible risks, but not every jurisdiction-specific control is public.
    diligencePath: >-
      Build a jurisdiction-by-jurisdiction compliance matrix from the latest prospectus, regulator notices, and customer
      deployment records.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: live-pricing
    missingEvidence: >-
      Final HKEX pricing, cornerstone demand, current use-of-proceeds detail, and any updated dilution or preference
      stack.
    whyItMatters: >-
      Without live terms, valuation stance rests on stale or secondary marks rather than a contemporaneous
      market-clearing price.
    diligencePath: Obtain the latest HKEX deal materials, investor presentation, and any board-approved financing term sheet.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Audited FY2025 gross margin, EBITDA, operating cash flow, customer concentration, renewal, and NRR disclosure.
    whyItMatters: >-
      Revenue and net loss alone do not let investors assign scenario probabilities or downside protection with
      confidence.
    diligencePath: Request audited FY2025 financials plus cohort and top-customer schedules from management or listing materials.
    relatedQuestionRefs:
      - QV001
      - QV005
