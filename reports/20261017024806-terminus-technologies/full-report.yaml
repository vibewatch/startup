  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competition starts with scope, not a single feature list
        blocks:
          - type: paragraph
            body: >-
              The retained pool consistently describes Terminus as a city- and public-space AIoT platform rather than a
              narrow workflow application. The 2025 HKEX filing summary says TacOS sells a full-stack mix of software,
              hardware, and services to enterprises, public managers, and other public-space participants, while KR Asia
              and investor materials show the business spanning industrial digitalization, AI-powered cities, smart
              living, and energy intelligence. That breadth matters competitively: buyers can compare Terminus not only
              against point solutions, but also against broader city digitization programs, system integrators, and
              internal-build paths that can assemble multiple vendors. Public sources do support category relevance and
              deployment scale, but they do not yet give a clean named-peer roster with consistent apples-to-apples
              product boundaries.
