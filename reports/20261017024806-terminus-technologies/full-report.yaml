      - number: '4.3'
        title: Capital needs and financing visibility
        blocks:
          - type: paragraph
            body: >-
              Fresh financing evidence confirms that Terminus can still raise capital, but it does not yet prove capital
              adequacy. Multiples records a $276 million Series D in April 2024 and a $7 million strategic round in
              August 2024 at about a $2.9 billion valuation, while Verdict's Investcorp announcement withholds the
              amount invested. The latest IPO-related source is more cautionary than comforting: Ryanben Capital's
              November 2025 Hong Kong listing summary says this was the company's third HKEX filing after two earlier
              submissions lapsed. Without cash-on-hand, operating-cash-flow, debt-facility, or use-of-proceeds detail,
              the financing stack is visible only at the headline round level rather than at the runway level an
              investor would need for underwriting.
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The forward financial verdict is mixed. The company now has materially better public scale evidence than
              in the prior report cycle, and receivables improvement points in the right direction, but profitability
              and disclosure quality still lag the growth story. Ryanben Capital's IPO summary reports a 2024 net loss
              of RMB 2.10 billion and adjusted net loss of RMB 973 million, which implies growth did not convert into
              public profitability. At the same time, third-party market-data providers do not agree on total funding or
              valuation history, and one widely accessible revenue profile explicitly says its source is not recorded.
              Until management provides audited FY2025 statements, gross margin by revenue stream, realized pricing,
              customer concentration, renewal behavior, and cash/runway detail, this chapter supports only a
              research-more stance.
            claimRefs:
              - CI010
              - CI011
              - CI013
              - CI014
