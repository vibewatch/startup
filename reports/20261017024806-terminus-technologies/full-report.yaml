      - number: '5.3'
        title: Maturity signals, trust gaps, and technical diligence risks
        blocks:
          - type: paragraph
            body: >
              Product maturity is visible in deployment breadth, patents, and continuing funding, but the public proof
              remains uneven. Baidu attributes hundreds of patents and thousands of implemented projects to Terminus,
              and China Economic Review says the 2024 financing was earmarked for AIoT R&D and multimodal LLM
              commercialization, both of which support ongoing product investment. Even so, the assigned pool does not
              provide auditable uptime reporting, security certifications, privacy architecture, public API
              documentation, or open developer telemetry for TacOS or the newer BitInfra/spatial-intelligence stack. A
              second diligence problem is source ambiguity: the same search pool also surfaced a separate
              UK/U.S.-focused company called Terminus Technologies plus a supplier case study for its SafeSight sensor
              platform. That noise does not negate Terminus Group's AIoT story, but it does mean product claims require
              issuer-level verification before they are treated as evidence about this company.
