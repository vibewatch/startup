      - number: '2.3'
        title: Buyer map, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is fragmented, which is both an opportunity and a drag on adoption speed. Terminus’s own
              profile language points to enterprises, public administrators, and other public-domain participants rather
              than one budget owner. Adjacent smart-city vendors sell into municipalities, airports, stadiums,
              industrial operators, and facility owners with value propositions around traffic optimization, occupancy,
              safety, emissions, and operational efficiency. That lines up with market drivers such as public-service
              efficiency, infrastructure digitization, lower-cost AI deployment, and demand for human-machine
              operational workflows. The constraint is that these budgets are usually project-led, partner-led, and
              workflow-specific, so scaling depends on navigating procurement, long implementation cycles, and local
              ecosystem relationships. Until public disclosures separate software, hardware, and services economics by
              segment and geography, buyer evidence is strong enough for segmentation but still too weak for a
              high-confidence SAM/SOM build.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM003
