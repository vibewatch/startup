  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and listing risk remains open
        blocks:
          - type: paragraph
            body: >-
              Public evidence still frames Terminus's financing and regulatory path as unresolved rather than cleared.
              Ryanben Capital reported that the company filed a third HKEX application on 2025-11-25 after the
              2024-09-26 and 2025-04-30 applications both lapsed, so approval, pricing, and cornerstone demand should be
              treated as pending dependencies instead of an accomplished catalyst. The same article shows 2024 revenue
              reached RMB 1.843 billion while 2024 net loss still ran to RMB 2.100 billion, which means scale has not
              yet translated into public profitability. Chambers also says China's amended Cybersecurity Law took effect
              on 2026-01-01 and raised the severity of penalties for network operators and CIIOs, increasing the
              downside of compliance misses as the company keeps selling into city and infrastructure settings.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
