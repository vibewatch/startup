      - number: '1.3'
        title: Funding, scale, and data reliability
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a genuinely scaled private company, but not a clean single-number valuation
              story. Tracxn says Terminus has raised $899 million across five disclosed rounds, with a $73.7 million
              Series A in July 2017, a $283 million Series C in August 2019, a $93 million Series D in September 2021,
              and a $277 million Series D in December 2023. China Economic Review separately reports an April 2024 RMB 2
              billion ($276 million) financing led by AL Capital and Yuyao Yangming, with China Everbright and SenseTime
              also participating. Operating scale in the newer prospectus-derived coverage is substantial: KR Asia
              reports RMB 1.843 billion of 2024 revenue, 83.2% annual growth, 342 customers, over 800 clients across 160
              cities, and roughly 1,300 partners. The weak point is profile consistency, not scale: Tracxn shows a
              current $1 billion valuation, while a Silicon Valley Invest Club tear sheet shows a December 2023 $4
              billion valuation, US headquarters, and one funding round, so valuation, HQ, and cap-table conclusions
              should remain explicitly provisional pending primary round documents or the full IPO filing set.
            claimRefs:
