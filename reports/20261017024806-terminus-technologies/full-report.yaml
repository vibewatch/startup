chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and public profile
        blocks:
          - type: paragraph
            body: >-
              The most consistent identity picture is that Terminus operates as an AIoT platform and smart-city
              infrastructure company rather than a single-product SaaS vendor. The official homepage calls Terminus
              Group "an international leading AI smart service provider" focused on AI cities, sustainable development,
              and robotics, while Tracxn describes a Beijing-based Series D company founded in 2015 that develops
              end-to-end IoT smart-city solutions, including connected access control, parking management, and
              cloud-based analytics. Later prospectus-derived coverage then points to materially larger industrial and
              city-scale operations than those older product summaries imply. One practical diligence point is identity
              hygiene: the legal-name string "Terminus Technologies" also retrieves an unrelated Essex/Indianapolis
              smart-city startup and a separate New Zealand custom-software firm, so later chapter research should
              privilege Terminus Group URLs and corroborated financing history over bare-name web hits.
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO017
