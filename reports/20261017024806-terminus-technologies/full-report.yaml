              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Operational resilience risk is structural
        blocks:
          - type: paragraph
            body: >-
              Execution risk is broad because Terminus is not presented as a single narrow software vendor. Ryanben says
              it sells software, hardware, and project services across industrial, city, living, and energy scenarios,
              while the official site keeps highlighting Dubai libraries, Expo-linked robotics, and Intel-linked
              industrial park work as flagship evidence. That breadth widens deployment surfaces, implementation modes,
              and counterparties at the same time. Chambers says operators in critical infrastructure settings may need
              dedicated security management, annual assessments, disaster recovery backups, vendor security agreements,
              and rapid incident reporting. If even part of Terminus's public-space estate is treated as regulated
              infrastructure, outages or data events can become regulatory events quickly rather than ordinary service
              tickets.
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
