  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is defining what Terminus actually sells before attempting any market sizing.
              Third-party profiles and company materials place the business in AIoT, but the narrower recurring pattern
              is public-domain infrastructure: smart community, office-building, campus, energy-management,
              urban-management, and robotics deployments that sit between enterprise software, infrastructure hardware,
              and project delivery. That boundary matters because broad smart-city rhetoric overstates the directly
              monetizable opportunity. The most relevant substitute set is not a single software category; it spans city
              operations platforms, industrial-digitalization stacks, and narrower perception systems sold into
              municipal, transport, venue, and facility workflows. In other words, smart city is one use case family
              inside a wider infrastructure-operations market, not a sufficient stand-alone market definition.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: Sizing lenses and observed market capture
        blocks:
          - type: paragraph
            body: >-
              Public sources do not isolate a clean Terminus-specific TAM, SAM, or SOM, so the chapter has to use
              layered lenses instead of pretending one generic estimate is decision-grade. At the category level, KrASIA
              describes AIoT as a convergence layer for AI, 5G, and spatial computing, with more than 30 billion
              connected devices expected globally in 2025 and category value in the hundreds of billions of RMB. That
              establishes directional market breadth, but not addressable spend for Terminus. The tighter lens is
              company monetization: 2024 revenue of RMB 1.843 billion, industrial-digitalization revenue of RMB 1.64
              billion, 342 customers in 2024, over 800 clients across 150–160 cities, and RMB 2.3 billion of current
              orders. Those are far more decision-useful than top-down TAM rhetoric, yet even here third-party databases
              disagree on valuation and categorization, which lowers confidence in any market-size conclusion built on
              profile sites alone.
            claimRefs:
              - CM004
