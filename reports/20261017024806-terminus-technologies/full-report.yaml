      - number: '3.2'
        title: Public benchmarking is stronger on scale and positioning than on transparent peer comparison
        blocks:
          - type: paragraph
            body: >-
              Publicly available comparator evidence is asymmetrical. EquityZen, Silicon Valley Invest Club, and the
              investor/news coverage provide category, valuation, and funding context, but they stop short of publishing
              list pricing, standardized packaging, or named win-loss comparisons. Even the strongest independent
              operating read-throughs emphasize revenue growth, customer footprint, flagship deployments, or
              capital-market activity rather than contract structure. That leaves a diligence gap around how Terminus
              competes deal by deal: the market can see that the company is large enough to matter, but not how
              frequently buyers choose it over incumbent suites, integrators, or internal teams on price, functionality,
              or implementation risk. The assigned pool also shows simple web discovery can mix in unrelated same-name
              vendors, complicating casual external benchmarking.
