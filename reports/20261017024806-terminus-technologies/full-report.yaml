        title: Architecture, deployment model, and current roadmap direction
        blocks:
          - type: paragraph
            body: >
              The architecture narrative across retained 2024-2025 sources points to a layered operating model. Baidu
              says TacOS was built to connect cloud, edge, and device assets and to coordinate data across urban
              scenarios, while KrASIA reports that the current stack has been reorganized into domain models,
              infrastructure, and intelligent agents around spatial intelligence. The same KrASIA coverage describes
              infrastructure products that integrate chips, networks, cloud, and AI, and frames robots and wearables as
              application-layer interfaces rather than standalone offerings. Older company-issued and independent
              coverage from PRNewswire and Verdict shows that Terminus's deployment pattern has long centered on
              projectized smart-city implementations such as Chongqing and Dubai, including smart parking, intelligent
              security, energy, and district-scale R&D build-outs. The product is therefore best understood as a layered
              operating environment deployed through large projects, with terminals and robots serving as visible
              endpoints rather than the whole offering.
