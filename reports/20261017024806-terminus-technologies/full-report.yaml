      - number: '3.3'
        title: Breadth and deployment proof support switching costs, but opacity and execution burden cap moat confidence
        blocks:
          - type: paragraph
            body: >-
              The strongest durability signals in the assigned pool come from breadth and real-world deployment. KR Asia
              reports more than 800 clients across 160 cities at year-end 2024, a partner network of roughly 1,300
              organizations, and high-volume Expo 2020 Dubai robot operations, while the refreshed filing summary pushes
              the deployment footprint above 900 customers in 172 cities by mid-2025. Those facts suggest Terminus can
              sell an integrated platform into large operational environments and create replacement friction once
              software, hardware, and project services are embedded. The counterweight is that the same public record
              still leaves pricing opaque and shows repeated HKEX refilings after two earlier submissions lapsed. That
              combination makes the company look credible as a scaled AIoT contender, but harder to underwrite as a
              clearly durable moat winner against better-capitalized incumbents or procurement-led substitutes.
