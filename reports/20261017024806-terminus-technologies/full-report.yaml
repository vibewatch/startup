      - number: '1.2'
        title: Leadership, footprint, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              Victor Ai is the constant public face of the company and the strongest visible key-person dependency in
              the assigned evidence set. The official site and Tracxn both identify him as founder and CEO, while the
              official archive also names Ling Shao as chief scientist and Hua Xiansheng as CTO, giving Terminus visible
              scientific and technical leadership beyond the founder even though this source pool does not surface a
              comparably detailed board or finance roster. Geographic footprint also looks real but should be described
              precisely: Tracxn frames the company as Beijing-based, China Economic Review says it was founded in
              Chongqing, and both company/independent evidence point to a Middle East and North Africa headquarters step
              in 2021 tied to Dubai expansion. The milestone pattern is therefore one of repeated internationalization,
              product refreshes, and visibility campaigns rather than a one-off smart-city pilot.
