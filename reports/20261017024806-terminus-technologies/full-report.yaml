  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and publicly visible module set
        blocks:
          - type: paragraph
            body: >
              The retained sources describe Terminus as an AIoT platform provider whose product surface spans software,
              hardware, and project delivery rather than a single appliance. Baidu's company profile says Terminus
              serves community parks, public utilities, power and energy, retail, and cultural museums with
              full-lifecycle services, while also independently developing TacOS as a city-wide AIoT operating system.
              That same profile describes a full-stack family across cloud, edge, and device, which is materially
              broader than the "robotics" shorthand still used by some external company-profile databases. For diligence
              purposes, the important conclusion is that Terminus should be underwritten as a systems integrator and
              platform operator with embedded hardware endpoints, not merely as a robot vendor. Publicly visible
              differentiation therefore rests less on any one terminal and more on how the company ties operating
              software, infrastructure, and scenario-specific delivery into one stack.
