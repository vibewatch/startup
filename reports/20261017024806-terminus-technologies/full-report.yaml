              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Partner, capital, and discovery dependencies stay material
        blocks:
          - type: paragraph
            body: >-
              Partner and financing dependence still looks meaningful. Verdict disclosed Investcorp's investment without
              check size or valuation, then framed the story around Chongqing AI city construction and a smart-city
              network spanning Dubai and Shenyang, which implies that marquee projects and high-profile backers still
              carry a lot of the external proof burden. The December 2023 tear sheet likewise provides a $4 billion
              valuation marker but little underwriting detail beyond one disclosed round and six institutional
              investors. Public materials reviewed here also do not disclose runway, debt terms, IPO proceeds, or
              customer concentration in enough detail to clear residual underwriting risk. Even basic discovery can be
              noisy, because unrelated UK and New Zealand businesses are using the same English Terminus Technologies
              name in public-facing materials.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
      - number: '7.4'
        title: Thesis-break triggers should be concrete and fast
        blocks:
          - type: paragraph
            body: >-
              The risk posture only improves if management converts showcase breadth into repeatable, auditable
              operating proof. The near-term kill criteria are another failed or withdrawn IPO cycle, a disclosed
              cybersecurity or availability event touching regulated systems, evidence that marquee deployments are not
              converting into profitable repeat work, or audited liquidity data that shows the loss profile is harder to
              finance than the valuation narrative implies. Until public evidence closes those gaps, diligence should
              focus on the current prospectus, the cash and covenant bridge, deployment-level compliance ownership, and
              whether 2025-2026 reference customers can show live production outcomes beyond historical Expo-era proof
              points.
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The public-listing path is still a risk event, not a finished catalyst
            body: >-
              Refiling is evidence of persistence, not closure. Another slip in the HKEX process would keep both
              liquidity and valuation support harder to verify from public sources.
            calloutType: risk
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR016
          - type: callout
            title: Showcase density should not be mistaken for resilience proof
            body: >-
              Public references show wide deployment ambition, but the underwritten risk really sits in compliance
              ownership, incident response, and whether marquee projects convert into repeatable profitable work.
            calloutType: insight
            claimRefs:
              - CR001
              - CR011
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence cuts in opposite directions. Tencent's November 2025 IPO coverage gives
              Terminus real operating scale, reporting more than 900 customer deployments across 172 cities and 2024
              revenue of RMB 1.843 billion, which keeps a credible growth thesis alive. The same source also reports a
              2024 net loss of RMB 2.100 billion, while third-party valuation evidence remains indirect rather than
              market-clearing. A 2023 tear sheet lists a $4 billion latest valuation without EV/revenue disclosure, and
              2025 public filing coverage still does not provide final IPO pricing or book quality. That mix is
              sufficient to keep Terminus on the diligence list, but not sufficient to justify a buy recommendation at
              an assumed private mark. The supportable call is research-more with a stretched valuation stance and a
              high risk rating until live pricing and updated audited economics are available.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Valuation context and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The financing record proves sustained investor access, but it does not provide enough current price
              discovery. Dealroom lists a 2017 Series A, 2018 Series B, and 2019 Series C, with a Dealroom estimate of
              €1.0-1.5 billion as of August 2019. Independent 2020 reporting from PrivSource and Verdict confirms
              Investcorp made a strategic growth investment, yet both note the transaction amount was undisclosed. A
              separate Silicon Valley Invest Club tear sheet compiled as of December 2023 lists a $4 billion latest
              valuation and a Series D label, but it also says EV/revenue and stage are not disclosed for any round. For
              a late-stage company contemplating liquidity, that means the public market can observe valuation direction
              but not enough term detail to underwrite dilution, preference overhang, or return math from today's entry
              point.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is not that Terminus lacks scale; it is that scale plus a third HKEX filing can eventually
              translate into transparent pricing, better financing optionality, and a narrower loss profile. The base
              case is more conservative: a real business with customer proof and strategic backers, but with too little
              public detail on the current capital stack and too much operating-loss intensity to defend a firm
              valuation range. The bear case is straightforward. If listing timing slips again, if audited FY2025
              economics show margins or cash burn worse than investors expect, or if market-clearing terms come in below
              legacy private marks, the path shifts from delayed upside to valuation reset. That is why scenario work
              here is directional rather than falsely precise.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Two diligence issues dominate the close. First, investors still need live price-setting evidence: final
              HKEX valuation, cornerstone demand, use of proceeds, and any updated preference or dilution structure
              after the 2025 filing. Second, they need economics that go beyond revenue and net loss headlines,
              including audited FY2025 margin, cash-flow, customer concentration, and renewal data. There is also a
              process risk hidden in the evidence environment itself: English-language name-only searches for "Terminus
              Technologies" surface unrelated UK/US and New Zealand companies, which can pollute automated comp screens
              or database pulls unless the analyst normalizes around Terminus Group and the HKEX issuer record. A
              thesis-break event would be another failed liquidity process or current terms that imply a clear step-down
              from the legacy private-valuation narrative.
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Wait for live terms, not just legacy marks
            body: >-
              Public sources show scale and financing history, but they still do not provide a current, market-clearing
              price or enough cap-table detail to underwrite entry returns with confidence.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV013
              - CV014
