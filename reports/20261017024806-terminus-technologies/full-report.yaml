            body: >-
              Terminus is best understood as a full-stack AIoT vendor that appears to monetize projects and bundled
              deployments rather than a narrowly disclosed recurring-software contract base. Multiples describes the
              company as selling software, hardware, computing power, and services through TacOS, while the November
