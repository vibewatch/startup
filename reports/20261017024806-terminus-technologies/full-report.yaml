        title: Public traction and working-capital signals
        blocks:
          - type: paragraph
            body: >-
              The strongest fresh public traction datapoint is revenue growth: KRASIA reports 2024 revenue of RMB 1.843
              billion, up 83.2% year over year, with a three-year path from RMB 738 million in 2022 to RMB 1.006 billion
              in 2023 and RMB 1.843 billion in 2024. The same coverage says industrial digitalization reached RMB 1.64
              billion in 2024, making the company look increasingly concentrated in one vertical even as it advertises
              four. Working-capital quality improved on the surface because receivables days fell from 238 to 180 to 104
              across 2022-2024, but this is still only a proxy. Public sources do not disclose gross margin, deferred
              revenue, contract duration, or realized software-versus-hardware mix, so the revenue-quality conclusion
