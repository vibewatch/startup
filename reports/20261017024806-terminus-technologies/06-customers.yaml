  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Public disclosure of NRR, GRR, churn, renewal rates, contract duration, or cohort-level customer retention.
      whyItMatters: Customer growth counts and project references do not prove recurring revenue durability or successful renewals.
      diligencePath: Request cohort retention, renewal, and contract-tenure data for 2023-2025, plus top-decile account expansion behavior.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Top-customer share, top-10 customer concentration, channel-partner revenue share, and government exposure by revenue.
      whyItMatters: Without concentration data, investors cannot judge whether growth is diversified or driven by a small number of public projects or channel relationships.
      diligencePath: Ask management for customer concentration tables, partner-channel mix, and public-sector revenue exposure by geography and segment.
      relatedQuestionRefs: [QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table coverage
      missingEvidence: A complete named-customer list with deployment status, contract scope, and dates for the full public reference set.
      whyItMatters: The current named-customer table is a representative sample, so it cannot prove how many references are pilots, scaled production accounts, or one-off showcase projects.
      diligencePath: Reconcile every public reference and customer story into a master list with contract stage, go-live date, and latest renewal status.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
