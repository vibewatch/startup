schemaVersion: "report-v2"
artifact: customers
slug: terminus-technologies
runDate: 2026-10-17
company:
  name: Terminus Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Terminus shows real customer adoption, but the proof is stronger on public deployment references
    and 2024 customer-count disclosures than on renewal economics. The clearest traction is in
    industrial digitalization and high-visibility smart-city or venue deployments, while retention,
    contract duration, and concentration remain material diligence gaps.
sections:
  - id: customer-footprint
    title: Customer footprint is broad, but disclosed buyer definitions are mixed
    body: |-
      Public evidence supports a real, multi-segment customer base rather than a pure concept-stage
      pipeline. Terminus's own surfaces show named references across schools, museums, libraries,
      sports venues, industrial parks, and Expo-linked robotics projects, while independent coverage
      says the company served more than 800 clients across 160 cities worldwide as of December 31,
      2024. The same independent update says industrial digitalization became the largest revenue
      contributor in 2024, which points to enterprise and infrastructure buyers being more important
      than one-off showcase installations. That said, the disclosure set uses several overlapping
      relationship labels: more than 800 clients, 342 customers, and about 1,300 partners. That mix
      is directionally positive for reach, but it also means outsiders cannot yet cleanly separate
      paying accounts, project entities, and ecosystem partners from the public record alone.
    claimRefs: [CU001, CU003, CU004, CU005, CU015]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named proof is strongest around flagship deployments and public-space references
    body: |-
      The most credible public proof comes from deployments tied to Expo 2020 Dubai and other named
      public environments. KR-Asia reports that Terminus's Titan robots logged more than 650,000
      interactions, 322,000 kilometers, and 84,000 hours while serving about 12.5 million visitors
      at Expo 2020 Dubai without major service interruptions. Terminus's own site also keeps a long
      list of named references that includes Expo City Dubai, Zayed Sports City, Mohammed Bin Rashid
      Library, Xiangyang Museum, a South China Normal University-affiliated high school, and
      Zhengzhou Kineer Smart Park. That is materially better than a simple logo wall because the
      evidence points to real sites and use cases. Even so, most public proof still describes
      deployments and partnerships rather than disclosing contract value, software attach, renewal
      status, or whether each reference expanded after the initial rollout.
    claimRefs: [CU001, CU008, CU009, CU010]
    tableRefs: [TU003]
  - id: durability-and-friction
    title: Durability and procurement friction are still the main unresolved customer risks
    body: |-
      The 2024 disclosure package supports adoption growth but not customer durability. KR-Asia says
      customer count rose from 224 in 2022 to 330 in 2023 and 342 in 2024, and it also cites RMB
      2.3 billion of current order value and a partner network of about 1,300 organizations. Those
      datapoints suggest active commercial expansion, but none of the retained sources disclose NRR,
      GRR, churn, contract duration, renewal cohorts, or top-customer concentration. That omission
      matters because Terminus sells into regulated and public-space settings where buying cycles can
      be shaped by data-governance and procurement rules. The retained 2025-2026 legal sources show
      tighter cross-border data controls in China and additional U.S. government-contractor
      restrictions for certain Chinese-entity relationships beginning in 2026 and 2027, which raises
      the likelihood of longer diligence cycles and narrower addressable buyer pools in some public
      or defense-adjacent channels.
    claimRefs: [CU006, CU007, CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Industrial digitalization
        - Enterprise operators and park managers buy; site operations teams use; payer mix not disclosed
        - Smart retail, intelligent operations, commercial platforms, and digital industrial parks
        - KR-Asia says this segment generated RMB 1.64 billion in 2024
        - Largest disclosed revenue contributor in 2024
        - No segment customer count, average contract size, or renewal rate disclosed
      - - City, district, and public-space infrastructure
        - Municipal or district authorities, site operators, and public-facility managers
        - AI city, smart park, community, building, and carbon-neutrality deployments
        - Official references span schools, museums, parks, libraries, and city venues
        - Core scenario set for the AIoT operating model
        - Public evidence does not separate pilots from scaled multi-year contracts
      - - Venue, event, and hospitality operations
        - Venue operators and hospitality partners buy; visitors and front-line staff use
        - Robots, smart services, and site operations during major events
        - Expo 2020 Dubai proof plus Talabat and HMH Hotel Group headlines
        - High-visibility references for international credibility
        - Economics after flagship events are not disclosed
      - - Partner-led ecosystem channels
        - Ecosystem partners, integrators, and channel allies help source or deliver business
        - Local implementation, commercialization, and scenario expansion
        - About 1,300 partner organizations by end-2024
        - Supports land-and-expand and overseas execution capacity
        - No revenue share by partner channel or partner concentration data disclosed
    notes: Public sources support segment direction and named scenarios, but not a clean segment-by-revenue or segment-by-account denominator.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Customer count, "224", "2022", "KR-Asia", medium, Early disclosed base for reported customer growth, Definition of customer not disclosed]
      - [Customer count, "330", "2023", "KR-Asia", medium, Strong year-over-year expansion before the 2024 IPO update, No cohort or retention breakout]
      - [Customer count, "342", "2024", "KR-Asia", medium, Growth continued into 2024, No production-versus-pilot split]
      - [Client footprint, "More than 800 clients across 160 cities worldwide", "2024-12-31", "KR-Asia", medium, Shows broad deployment reach and international spread, Relationship between clients and paying customers is not defined]
      - [Partner network, "About 1,300 organizations", "2024-12-31", "KR-Asia", medium, Suggests a large ecosystem and partner-assisted GTM, Revenue contribution by partner channel not disclosed]
      - [Current order value, "RMB 2.3 billion", "2024-12-31", "KR-Asia", medium, Supports visible booked demand, Conversion timing and cancellation risk not disclosed]
      - [Industrial digitalization revenue, "RMB 1.64 billion", "2024", "KR-Asia", medium, Signals customer demand is concentrated in enterprise and infrastructure use cases, No segment-level customer count]
    notes: Metrics come from one 2025 IPO-update summary; values are useful traction signals but the company does not publish matching retention, cohort, or contract-denominator detail.
    claimRefs: [CU004, CU005, CU006, CU007, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / site
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - Expo 2020 Dubai / Expo City Dubai
        - Event venue / smart-city showcase
        - Titan robots and smart-service operations
        - Production deployment
        - KR-Asia reports about 12.5 million visitors served, more than 650,000 interactions, 84,000 hours, and 322,000 kilometers without major service interruptions
        - Public sources do not disclose recurring software revenue or renewal terms after the event
      - - Zayed Sports City
        - Sports venue
        - Digital smart transformation reference on official site
        - Status not disclosed
        - Named official reference indicates a live customer story rather than an anonymous logo
        - No rollout size, duration, or outcome metric disclosed
      - - Mohammed Bin Rashid Library
        - Public library
        - Smart operations enabled with AIoT technologies
        - Status not disclosed
        - Named official reference extends proof into a non-event public-facility setting
        - No contract scope or user-adoption metric disclosed
      - - Affiliated High School of South China Normal University
        - Education facility
        - AIoT-based LLMs-system-integration technology for green and smart campus development
        - Status not disclosed
        - Named official reference supports scenario breadth beyond city control rooms and venues
        - No deployment size or repeat-purchase evidence disclosed
      - - Xiangyang Museum / Zhengzhou Kineer Smart Park
        - Culture and industrial park operations
        - Digital upgrade and AIoT-based operations references
        - Status not disclosed
        - Named official references support multi-scenario public-site adoption
        - Public evidence is still sample-based and mostly headline-level
    notes: This is a partial sample of named public references from the assigned pool; rows marked "status not disclosed" have a named deployment signal but not enough evidence to classify pilot versus scaled recurring production economics.
    enumerationScope:
      coverage: partial
      basis: Sample compiled from retained official reference headlines and independent Expo coverage in the assigned customers source pool.
    claimRefs: [CU001, CU008, CU009, CU010]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence suggests a partner-assisted path from scenario qualification to flagship deployment, then uncertain renewal economics.
    data:
      nodes:
        - label: Scenario qualification
          actor: Municipal, venue, enterprise, and public-facility buyers
          phase: Initial commercial targeting
          channels:
            - Direct business development
            - Ecosystem partner introductions
          touchpoints:
            - Buildings, communities, parks, cities, and carbon-neutrality scenarios
            - Global smart-city and industrial-digitalization positioning
        - label: Solution scoping
          actor: Buyer operations teams and implementation partners
          phase: Use-case design
          channels:
            - AIoT platform and smart-service proposals
            - Localized deployment planning
          touchpoints:
            - Industrial operations
            - Smart venues
            - Public facilities
        - label: Deployment launch
          actor: Terminus plus delivery partners
          phase: Initial rollout
          channels:
            - Site integration
            - Hardware plus platform activation
          touchpoints:
            - Robots at Expo 2020 Dubai
            - Park and city deployments
        - label: Daily operations proof
          actor: Front-line operators and visitors
          phase: Live usage
          channels:
            - Operational monitoring
            - Service interaction
          touchpoints:
            - More than 650,000 Expo robot interactions
            - More than 84,000 operating hours reported at Expo
        - label: Expansion and references
          actor: Existing customers, partners, and new buyer prospects
          phase: Reference-led growth
          channels:
            - Public customer stories
            - Partner network
          touchpoints:
            - More than 800 clients across 160 cities
            - About 1,300 partner organizations
        - label: Renewal and concentration test
          actor: CFO, procurement, compliance, and investor diligence teams
          phase: Durability checkpoint
          channels:
            - Renewal review
            - Regulatory and procurement diligence
          touchpoints:
            - No public NRR, GRR, churn, or top-customer-share disclosure
            - Additional cross-border and U.S. public-procurement friction for some Chinese-entity relationships
    claimRefs: [CU002, CU005, CU007, CU011, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Real deployment proof exists
    body: Expo 2020 Dubai metrics and multiple named public-site references are stronger evidence than a generic logo page.
    claimRefs: [CU001, CU008, CU009]
  - calloutType: risk
    title: Durability is still under-disclosed
    body: Public materials support growth and deployment breadth, but they do not disclose retention, renewal, contract-duration, or concentration metrics.
    claimRefs: [CU006, CU007, CU011, CU012]
  - calloutType: insight
    title: Expansion likely depends on partners and regulated-buyer navigation
    body: The disclosed partner network is large, but cross-border data and public-procurement rules can still slow expansion in regulated channels.
    claimRefs: [CU007, CU013, CU014]
