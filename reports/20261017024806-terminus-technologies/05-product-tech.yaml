      - ["Infrastructure", "Compute, hardware clusters, and software platforms integrating chips, networks, cloud, and AI", "Capital-intensive deployment plus external hardware and network partners", "No public capacity, cost, or resilience metrics in assigned pool"]
      - ["TacOS / orchestration platform", "Cross-domain data interconnection and resource coordination across cloud-edge-device stack", "Integration into customer assets, sensors, and operational workflows", "No public developer telemetry, interface docs, or migration detail from TacOS to newer spatial stack"]
