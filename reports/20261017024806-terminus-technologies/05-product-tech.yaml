  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public repository activity, API or SDK documentation, practitioner forum traffic, package telemetry, or another verified developer-signal proxy for TacOS, BitInfra, or intelligent-agent tooling.
      whyItMatters: Without a developer or practitioner signal, it is hard to validate ecosystem pull, implementation friction, or whether the platform has repeatable external integration usage beyond project delivery.
      diligencePath: Request product documentation, public or private API references, partner implementation artifacts, and any practitioner-community metrics that demonstrate external usage.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: trust-gap
      missingEvidence: Security, privacy, compliance, and reliability documentation for TacOS and the newer spatial-intelligence stack, including any certifications, architecture controls, incident reporting, or public status artifacts.
      whyItMatters: Product ambition is broad, but public trust evidence is too thin to underwrite regulated or mission-critical deployments on deployment stories alone.
      diligencePath: Request security white papers, privacy architecture, certification schedules, uptime reporting, and customer security review materials tied to production deployments.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: implementation-economics
      missingEvidence: Module-level deployment timelines, pricing structure, and maintenance or fleet-service requirements by product layer.
      whyItMatters: The available evidence shows what Terminus claims to deploy, but not how repeatable or margin-accretive each layer is.
      diligencePath: Request implementation plans, hardware BOM or servicing assumptions, pricing sheets, and case-study economics for representative smart-city or industrial projects.
      relatedQuestionRefs: [QE003, QE004]
