figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Retained sources describe a layered stack moving from scenario-specific models and infrastructure through TacOS orchestration to deployed agents and projectized smart-city workflows.
    data:
      layers:
        - label: Application scenarios
          detail: Publicly described end markets include AI-powered cities, smart industrial digitalization, smart living, and energy intelligence.
          modules:
            - AI-powered cities
            - Smart industrial digitalization
            - Smart living
            - Energy intelligence
          outputs:
            - Projectized smart-city and park deployments
            - On-site operational workflows
        - label: Intelligent agents and terminals
          detail: Robots, wearables, and interactive hardware act as the visible user interface layer in field deployments.
          modules:
            - Titan / service robot deployments
            - Wearables and interactive entry hardware
          outputs:
            - Human-machine interaction
            - Site data capture
        - label: TacOS orchestration
          detail: TacOS and TacOS 3.0 are described as the operating layer that links data, resources, and cloud-edge-device coordination.
          modules:
            - City-wide AIoT operating system
            - Cloud-edge-device management
            - Resource scheduling across scenarios
          outputs:
            - Cross-domain data interconnection
            - Real-time coordination
        - label: Delivery and integration
          detail: The business is also delivered through project implementation, systems integration, and scenario-specific operating services for cities and enterprises.
          modules:
            - System integration
            - Scenario implementation
            - Operating services
          outputs:
            - Live project deployment
            - Customer workflow adaptation
        - label: Spatial intelligence and infrastructure
          detail: Recent reporting describes infrastructure products underneath the platform, including hardware clusters and software platforms optimized for newer AI stacks.
          modules:
            - Domain models
            - Green high-performance computing units
            - Hardware clusters
            - Software platforms integrating chips, networks, cloud, and AI
          outputs:
            - Compute foundation for deployments
            - Platform modernization toward spatial intelligence
        - label: Trust and control gaps
          detail: Public evidence still leaves security, privacy, developer, and uptime controls under-documented relative to the breadth of the claimed stack.
          modules:
            - Security documentation
            - Privacy architecture
            - API and developer tooling
          outputs:
            - Diligence blocker until internal materials are shared
            - Higher verification burden for regulated use cases
    approximationNotes: "Layer boundaries are synthesized from public descriptions and do not imply a fully documented reference architecture."
    claimRefs: [CE002, CE004, CE005, CE006, CE007, CE010]
callouts:
  - calloutType: strength
    title: Platform breadth is broader than the robotics label
    body: Terminus's retained product evidence is strongest when framed as an AIoT platform and systems-delivery stack, with robots and terminals acting as one interface layer rather than the full business.
    claimRefs: [CE001, CE002, CE004, CE005, CE011]
  - calloutType: risk
    title: Public trust and developer proof trail is still thin
    body: The assigned pool supports deployment breadth and product ambition, but it does not surface auditable uptime, security, privacy, API, or practitioner-community evidence strong enough to underwrite product reliability without further diligence.
    claimRefs: [CE013]
