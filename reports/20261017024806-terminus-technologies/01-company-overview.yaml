      - [Total funding, "$899M across 5 disclosed rounds (Tracxn)", "through 2023-12-30", medium, "Round totals depend on private database methodology."]
      - [Latest financing, "RMB 2B ($276M) round reported in April 2024", "2024-04-12", medium, "Need primary round documents to reconcile precisely with Tracxn's $277M 2023-12-30 entry."]
      - [Revenue, "RMB 1.843B ($258M) in 2024", "2024", medium, "Derived from prospectus coverage in KR Asia, not the filing text itself."]
      - [Customers / clients, "342 customers; 800+ clients across 160 cities; ~1,300 partners", "2024", medium, "Customer, client, and partner counts may use different denominators."]
      - [Valuation, "Conflicting public summaries: $1B vs $4B", "2023-2026", low, "Leave provisional until IPO / round documents confirm valuation basis."]
      - [Headcount, null, "2026-10-17", low, "No supportable headcount in assigned evidence; Tracxn's '1 employees as of Sep 26' is not diligence-grade."]
    notes: Public web sources support scale and financing direction, but not a single clean valuation or headcount figure; null means the assigned pool did not support a diligence-grade number.
    claimRefs: [CO003, CO004, CO006, CO007, CO008, CO009, CO010, CO014, CO015]
