      - ["Ling Shao", "Chief Scientist", "The official archive highlights Ling Shao's appointment and later recognition in scientist rankings.", "Provides externally visible AI research credibility and scientific leadership beyond the founder.", "Medium: visible technical authority, but the pool does not show formal governance rights."]
      - ["Hua Xiansheng", "CTO", "The official archive names Hua Xiansheng as CTO in Terminus coverage.", "Adds product / engineering coverage to the public leadership bench.", "Medium: technical depth is visible, but succession and organization design remain under-disclosed."]
    notes: This is a partial public roster drawn from assigned official and independent sources, not an exhaustive management or board list.
    enumerationScope:
      coverage: partial
      basis: Publicly named leadership surfaces from the retained official archive and corroborating profile sources; the assigned pool does not include a full board register or complete executive page.
    claimRefs: [CO002, CO003, CO012, CO013]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
