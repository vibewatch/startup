    rows:
      - ["Victor Ai", "Founder / CEO", "De facto strategic control of brand, product narrative, and external relationships is highly visible in the retained sources.", "Clarify board composition, reserved matters, and how much decision-making is delegated below the founder."]
      - ["AL Capital", "Lead investor in latest reported RMB 2B round", "Signals fresh capital support for the 2024 financing and likely influence on terms.", "Request exact round documents, ownership percentage, board rights, and liquidation preferences."]
      - ["Yuyao Yangming Equity Investment Fund", "Co-lead in latest reported RMB 2B round", "Important local-capital sponsor in the newest reported financing.", "Confirm whether support is purely financial or tied to regional industrial policy / project pipelines."]
      - ["Warburg Pincus", "Lead investor in 2021 Series D", "Brings global growth-equity signaling to the cap table.", "Verify current ownership after later financings and any continuing governance rights."]
      - ["China Everbright / SenseTime", "Repeat or strategic investors cited across 2019-2024 financing summaries", "Suggests strategic-network and capital-market value beyond pure cash contribution.", "Map whether these investors remain active shareholders, commercial partners, or both."]
    notes: This is a partial stakeholder map built from public funding summaries rather than an audited cap table; control terms and ownership percentages remain open diligence items.
    enumerationScope:
      coverage: partial
      basis: Rows include the founder and the most visible investors named in retained 2021-2024 funding summaries; the assigned pool does not contain a complete shareholder ledger.
    claimRefs: [CO002, CO007, CO008, CO009]
