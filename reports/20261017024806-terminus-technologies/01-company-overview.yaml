    data:
      items:
        - year: "2015"
          label: Company founded
          detail: Tracxn dates Terminus to 2015, while China Economic Review says the company started in Chongqing before later expanding internationally.
          claimRefs: [CO003, CO004]
        - date: 2017-07-04
          label: First disclosed private round
          detail: Tracxn lists a $73.7M Series A as the first disclosed funding round.
          claimRefs: [CO007]
        - date: 2019-08-12
          label: Series C scale-up
          detail: Tracxn's round history includes a $283M Series C, showing the company had reached large late-stage financing before the Dubai push.
          claimRefs: [CO006]
        - year: "2021"
          label: Dubai / MENA headquarters step
          detail: Company and independent coverage both point to a Middle East and North Africa headquarters move tied to Dubai expansion.
          claimRefs: [CO004, CO012]
        - date: 2023-12-30
          label: Latest Tracxn-listed Series D
          detail: Tracxn records a $277M Series D as the latest disclosed round in its profile chronology.
          claimRefs: [CO007]
        - date: 2024-04-12
          label: RMB 2B round reported
          detail: China Economic Review reports a RMB 2B ($276M) financing led by AL Capital and Yuyao Yangming.
          claimRefs: [CO008]
        - year: "2024"
          label: Prospectus-backed growth snapshot
          detail: KR Asia says 2024 revenue reached RMB 1.843B with 83.2% annual growth and 342 customers.
          claimRefs: [CO009, CO010]
        - year: "2025"
          label: Product refreshes and unicorn-list visibility
          detail: The official archive highlights the BitInfra large-model platform refresh, the SPACE habitat-solution launch, and a 2025 global unicorn ranking mention.
          claimRefs: [CO013]
    approximationNotes: Milestones mix exact dates from funding summaries with year-level dates inferred from company archive titles when the assigned pool did not provide a full dated article body.
    claimRefs: [CO003, CO004, CO006, CO007, CO008, CO009, CO010, CO012, CO013]
