  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Public-domain AIoT / AI CITY platforms
    - Software, hardware, and services for smart community, office building, campus, energy management, urban management, and robotics
    - Pure consumer apps and generic foundation-model spend without deployment ownership
    - Public administrators, city operators, campus / park operators, enterprises
    - Best-supported core market boundary from Terminus-specific sources
  - - Smart industrial digitalization
    - Smart retail, intelligent operations, commercial platforms, and digitally upgraded industrial parks
    - General-purpose ERP or cloud spend not tied to physical-site operations
    - Industrial operators, property / park owners, enterprise operations teams
    - Strongest disclosed monetized wedge in 2024
  - - Smart-city perception and municipal analytics adjacencies
    - Traffic, occupancy, safety, emissions, and environmental analytics sold into city workflows
    - Full city operating systems or broad infrastructure-service contracts
    - Municipal departments, airports, stadiums, transport operators
    - Represents substitute or adjacent budget lines rather than the full Terminus stack
  - - Spatial-intelligence / embodied-agent layer
    - Domain models, infrastructure, intelligent agents, service robots, and wearables
    - Generic AI experimentation without field deployment
    - Enterprise infrastructure sponsors and public-service program owners
    - Expands the market narrative, but public evidence still ties monetization to specific operational scenarios
  notes: Market-boundary rows mix official framing, third-party profiles, and adjacent-vendor evidence; they define included and excluded spend rather than implying one uniform software category.
