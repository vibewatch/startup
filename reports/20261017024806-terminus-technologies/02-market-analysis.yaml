callouts:
- calloutType: insight
  title: Observed monetization is more reliable than headline TAM rhetoric
  body: The most decision-useful sizing evidence is Terminus’s disclosed 2024 revenue, segment mix, customer count, and order book, not the generic “smart city” or “AIoT” TAM claims that public sources cannot connect to a clean buying population.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM014
- calloutType: risk
  title: Buyer fragmentation and profile drift cap sizing confidence
  body: Public evidence identifies real buyer archetypes, but budget ownership remains project-led and fragmented, while third-party databases disagree on valuation, category, and even company profile details. That combination makes public-market sizing adequate for direction-setting but too weak for high-confidence SAM/SOM or valuation multiple work.
  claimRefs:
  - CM009
  - CM011
  - CM012
  - CM013
  - CM015
