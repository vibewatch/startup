      - ["Smart living", "Residential/community and convenience-oriented AIoT deployments", "Bundled product/service revenue", "Offered publicly; no standalone public revenue disclosed", "Directional only", "Disclose customer count, renewal terms, and recurring software share"]
      - ["Energy intelligence", "Energy-management and clean-energy AIoT solutions", "Solution revenue", "Offered publicly; no standalone public revenue disclosed", "Directional only", "Disclose revenue, hardware content, and working-capital profile"]
    notes: "Public sources identify the revenue streams, but only industrial digitalization has a disclosed 2024 value; null-like descriptions mean the public record does not break out the line."
