  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / unit
      - Public price signal
      - Realized pricing
      - Evidence quality
      - Source lens
    rows:
      - ["Full-stack AIoT deployment", "No customer price card disclosed", "Unknown", "Public sources describe a bundled software/hardware/services model but not net realized pricing", "Multiples; Ryanben/Tencent"]
      - ["Industrial digitalization program", "No public per-site or per-contract pricing", "Unknown", "Segment revenue is disclosed, but unit monetization is not", "KRASIA"]
      - ["City / public-domain platform deployment", "No public price card disclosed", "Unknown", "Offerings are visible, but award size and revenue-recognition terms are not public", "Official site; Ryanben/Tencent"]
      - ["August 2024 financing round", "HKD 20 per share financing price", "Not customer pricing", "Useful for valuation context only, not monetization", "Multiples"]
    notes: "This table separates financing price from customer price and treats undisclosed realized pricing as unknown rather than inferring SaaS-style monetization."
    claimRefs: [CI001, CI003, CI008, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2024 revenue growth", "+83.2% YoY to RMB 1.843b", "Medium", "Confirms real top-line scale, but not revenue quality", "Reconcile to audited FY2025 and split organic demand from project timing"]
      - ["Receivables cycle", "104 days in 2024 vs 180 in 2023 and 238 in 2022", "Medium", "Best public proxy for cash conversion and collections discipline", "Provide DSO, overdue buckets, and customer-type mix"]
      - ["2024 net loss margin", "Approx. -114% (RMB 2.10b net loss on RMB 1.843b revenue)", "Medium", "Shows growth still consumed heavy operating investment", "Provide gross margin, opex mix, capex, and operating cash flow"]
      - ["2024 adjusted net loss", "RMB 973m", "Medium", "Losses remain large even after adjustments", "Bridge adjusted net loss to EBITDA and explain recurring vs non-recurring items"]
      - ["CAC / payback / NRR / concentration", "Not publicly disclosed", "Low", "Prevents underwriting sales efficiency and durability", "Provide sales cycle, CAC, payback, top-10 customer mix, renewal, and NRR"]
    notes: "Values are public metrics or simple arithmetic from public metrics; 'Not publicly disclosed' means the chapter found no usable number in the assigned source pool."
    claimRefs: [CI003, CI007, CI010, CI011, CI015]
