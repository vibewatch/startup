  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash-on-hand, debt facilities, covenant headroom, operating cash flow, and management runway plan.
      whyItMatters: Without liquidity detail, financing headlines cannot be converted into an underwriting view on survival, dilution risk, or next-round timing.
      diligencePath: Request the latest board pack or IPO draft financial section covering cash, debt, burn, and planned use of proceeds.
      relatedQuestionRefs: [QI007]
    - type: missing-source
      severity: material
      topic: pricing-realization
      missingEvidence: Realized pricing, discounts, contract duration, and revenue-recognition policy by software, hardware, and project services.
      whyItMatters: Revenue quality cannot be assessed from topline growth alone when the mix may be project-led and hardware-heavy.
      diligencePath: Request signed customer contracts, SKU-level price books, and an accounting memo that bridges bookings to recognized revenue.
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: CAC, payback, sales cycle, top-customer concentration, renewal, and NRR metrics.
      whyItMatters: These are the core inputs needed to judge whether growth is durable and efficiently acquired.
      diligencePath: Request cohort retention, pipeline conversion, and customer concentration schedules for 2024 and 1H25.
    - type: access-blocked
      severity: minor
      topic: external-profile
      missingEvidence: A usable external company-profile page with directly readable financial detail.
      whyItMatters: The assigned EqualOcean page did not yield usable financial content in this run, which limits cross-checking against other market-data summaries.
      diligencePath: Use the original external profile only if a readable archived or non-JavaScript version becomes available in a future source pool.
