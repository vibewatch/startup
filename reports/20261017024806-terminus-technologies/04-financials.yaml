schemaVersion: "report-v2"
artifact: financials
slug: terminus-technologies
runDate: 2026-10-17
company:
  name: Terminus Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence now supports a much larger business than the prior refresh,
    with 2024 revenue of RMB 1.843 billion and industrial digitalization as the
    dominant segment, but the model still looks deployment-heavy rather than
    clean SaaS. The underwriting problem is not top-line existence; it is the
    lack of public gross-margin, realized-pricing, cash-on-hand, and customer
    concentration disclosure alongside continued large losses and another IPO
    filing attempt.
sections:
  - id: revenue-model-and-mix
    title: Revenue model and mix
    body: >-
      Terminus is best understood as a full-stack AIoT vendor that appears to
      monetize projects and bundled deployments rather than a narrowly disclosed
      recurring-software contract base. Multiples describes the company as
      selling software, hardware, computing power, and services through TacOS,
      while the November 2025 IPO summary says revenue comes from full-stack
      AIoT products that include software, hardware, and project-related
      services. KRASIA's prospectus-based coverage then shows where that
      commercialization is landing: four application verticals, with industrial
      digitalization the dominant revenue engine in 2024. That mix matters for
      diligence because it suggests reported scale may be driven by lumpy
      deployments, hardware content, and service delivery rather than a public,
      cleanly disclosed ARR base.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-working-capital
    title: Public traction and working-capital signals
    body: >-
      The strongest fresh public traction datapoint is revenue growth: KRASIA
      reports 2024 revenue of RMB 1.843 billion, up 83.2% year over year, with
      a three-year path from RMB 738 million in 2022 to RMB 1.006 billion in
      2023 and RMB 1.843 billion in 2024. The same coverage says industrial
      digitalization reached RMB 1.64 billion in 2024, making the company look
      increasingly concentrated in one vertical even as it advertises four.
      Working-capital quality improved on the surface because receivables days
      fell from 238 to 180 to 104 across 2022-2024, but this is still only a
      proxy. Public sources do not disclose gross margin, deferred revenue,
      contract duration, or realized software-versus-hardware mix, so the
      revenue-quality conclusion remains incomplete.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI015]
    tableRefs: [TI003]
  - id: capital-needs-and-financing
    title: Capital needs and financing visibility
    body: >-
      Fresh financing evidence confirms that Terminus can still raise capital,
      but it does not yet prove capital adequacy. Multiples records a $276
      million Series D in April 2024 and a $7 million strategic round in August
      2024 at about a $2.9 billion valuation, while Verdict's Investcorp
      announcement withholds the amount invested. The latest IPO-related source
      is more cautionary than comforting: Ryanben Capital's November 2025 Hong
      Kong listing summary says this was the company's third HKEX filing after
      two earlier submissions lapsed. Without cash-on-hand, operating-cash-flow,
      debt-facility, or use-of-proceeds detail, the financing stack is visible
      only at the headline round level rather than at the runway level an
      investor would need for underwriting.
    claimRefs: [CI009, CI012, CI013, CI014]
  - id: financial-verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The forward financial verdict is mixed. The company now has materially
      better public scale evidence than in the prior report cycle, and
      receivables improvement points in the right direction, but profitability
      and disclosure quality still lag the growth story. Ryanben Capital's IPO
      summary reports a 2024 net loss of RMB 2.10 billion and adjusted net loss
      of RMB 973 million, which implies growth did not convert into public
      profitability. At the same time, third-party market-data providers do not
      agree on total funding or valuation history, and one widely accessible
      revenue profile explicitly says its source is not recorded. Until
      management provides audited FY2025 statements, gross margin by revenue
      stream, realized pricing, customer concentration, renewal behavior, and
      cash/runway detail, this chapter supports only a research-more stance.
    claimRefs: [CI010, CI011, CI013, CI014, CI015]
