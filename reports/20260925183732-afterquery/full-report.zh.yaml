            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU011
      - number: '6.3'
        title: 标杆客户印证与企业级落地
        blocks:
          - type: paragraph
            body: >-
              公开披露与独立科技媒体的报道证实了公司在硬件系统和基础模型研发领域的数个重磅客户关系。半导体与 AI 算力巨头 Nvidia 已被证实为正式付费客户，采用 AfterQuery 的推理数据赋能企业级 Agent
              开发。同样，企业软件平台 Legora 与韩国知名顶尖基础模型实验室 Motif Technologies 也已完成经过验证的生产环境部署。除技术类客户外，AfterQuery
              还在金融咨询领域建立起商业战略合作，例如与 The Raine Group
              持续合作诊断内部金融交易工作流，并搭建针对该机构的专用评测环境。尽管斩获了上述标杆客户，更广泛的客户名录仍受制于严格的商业保密协议。公开证据尚未披露公司与前沿实验室的合作究竟属于企业级主服务协议（MSA），还是仅为孤立的、按项目计费的功能突击开发。由于缺少包含量化投资回报率（ROI）指标且由客户背书的案例研究，实际生产工作流的渗透深度与后续使用率仍是核心尽调焦点。
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU009
              - CU014
      - number: '6.4'
        title: 业务持久度、扩张机制与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              AfterQuery
              客户关系的长期持久度，取决于其能否从咨询式项目交付商转型为深度嵌入的经常性基础设施层。当前，商业变现主要依托基于项目的定价机制，范围取决于专业领域难度、专家薪酬、环境复杂度及交付数据集规模。这一定价模式虽然造就了庞大的初期合同体量，却也使公司面临极高的收入集中度。公司的营收高度依赖少数资金充裕的前沿
              AI 实验室，这些机构既具备支撑八位数美元合同的资金实力，也拥有将数据策划流程自研收编的技术储备。一旦主要基础模型实验室选择自主开发后训练数据策划，或转向混合合成数据管道，AfterQuery
              将面临严峻的客户流失风险。此外，Scale AI 等平台型老牌企业，以及 Mercor、Surge AI 和 Labelbox 等灵活的专家网络，也正在加剧竞争压力。为抵御对前沿实验室的依赖，AfterQuery
              必须系统推进其「拓展渗透（land-and-expand）」战略，将初期的基准评测套件逐步转化为永久性、多领域的深度工作流模拟环境，进而深度融入企业工程技术体系。
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU012
      - number: '6.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 前沿 AI 实验室客户集中度风险
            body: >-
              AfterQuery 迈向 $100M+ 收入运行率的超高速增长高度依赖少数前沿模型实验室。若头部实验室将专家后训练收归自研，或转向混合合成数据流，除非企业级客户能够迅速放量，否则 AfterQuery
              将面临剧烈的收入波动。
            calloutType: risk
            claimRefs:
              - CU005
              - CU009
          - type: callout
            title: 咨询式合作与经常性 SaaS 业务持久度的对比
            body: >-
              与传统按席位付费的 SaaS 不同，AfterQuery 的变现主要按项目界定并以结果为导向。这一架构虽然带来了庞大的初期客单价，但长期持久性需要公司不断将范围拓宽至相邻专业领域，或将经常性评测环境直接嵌入客户的
              CI/CD 循环之中。
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险登记册
        blocks:
          - type: paragraph
            body: >-
              AfterQuery
              处于行业专业知识与生成式模型后训练的交汇处，这在知识产权、数据保护及专业执业规范边界上带来了独特的法律与监管风险。在公司法、证券和医疗健康等敏感垂直领域，公司必须确保严格的引用完整性与司法管辖权准确性，防范生成式模型产生看似言之凿凿的幻觉。随着企业级客户规模不断扩大，保持
              SOC 2 Type II 与 ISO 27001
              认证已成为不可或缺的准入门槛，而非可有可无的常规合规。此外，管理分布于全球的专家贡献者网络，要求公司持续符合独立承包商分类规范，并建立清晰的知识产权转让框架，以确保所有交付的数据集与评测套件拥有完整无可争议的权属链（chain-of-title）。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营失效模式、机器人硬件与质量保障
        blocks:
          - type: paragraph
            body: >-
              运营稳健性是 AfterQuery 科研驱动型定位的核心基石。在认知智能领域，主要失效模式集中于标注评分噪声，即细微的专业差异逃脱了人工审核者的捕捉，进而损害了模型奖励信号。在方兴未艾的具身智能与物理 AI
              产品中，由于对机器人硬件、遥控操作台和摄像机配置等物理设备存在依赖，运营复杂度成倍增加。AfterQuery
              开源机器人研究的工程文档列举了常见的故障点，包括菊花链接线故障、伺服电机过载以及电源电压不匹配，这些故障会直接中断数据集录制流程。与此同时，仅靠约 30
              名员工的精干核心团队运作，在统筹数以万计的分布式贡献者以及管理用于强化学习评测的独立 Docker 沙盒时，容易引发潜在的协调摩擦。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 客户集中度、利润率承压与平台依赖
        blocks:
          - type: paragraph
            body: >-
              商业变现表现亮眼，但客户高度集中于前沿 AI 实验室构成重大战略风险点。由于头部前沿实验室既是 AfterQuery
              的主要收入来源，又是具备自研数据流程实力的成熟实体，一两家标杆客户一旦决定收回后训练业务自研，或将合同打包给老牌数据供应商，都将严重挫伤其商业增长动能。此外，AfterQuery
              坚持采用经认证的行业专家与定制自研软件，相比依赖劳动力套利的众包交易平台竞争对手，承担着明显更高的成本结构。若要拉升毛利率，必须将定制的程序化合作项目转化为可复用的标准化现成基准套件，并在更广阔的企业工作流中完成规模化部署。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 剩余风险热力图、应对成熟度与逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >-
              综合战略、运营与财务各项风险敞口来看，前沿实验室客户集中度高企与高估值压力构成了最大的剩余投资风险。A 轮融资后仅 5 个月估值据报道便膨胀至
              $3.2B，极大压缩了运营容错空间，倒逼公司必须迅速突破核心基础模型实验室圈子向企业级客户扩张。对投资者而言，核心逻辑破损的触发条件包括：任何主要前沿实验室将后训练流程收归自研并导致实质性客户流失；专家承包商薪酬上涨导致毛利率持续受到侵蚀；或者发生重大数据安全泄露事故，危及
              SOC 2 合规地位与企业数据共享协议。
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 前沿实验室自研与打包平台替代风险
            body: >-
              AfterQuery 迅速迈向据报道的 $100M 收入运行率，在极大程度上锚定在前沿 AI 实验室。鉴于这些前沿实验室既是其核心收入源，又是潜在竞争对手，任何转向自研后训练数据业务或签订平台捆绑协议（例如与
              Scale AI 合作）的战略转变，都构成实质性的下行脆弱点。
            calloutType: risk
            claimRefs:
              - CR009
              - CR013
          - type: callout
            title: 估值飙升与运营杠杆承压
            body: >-
              估值据报道从 2026 年 4 月的 $300M 飙升至 2026 年 9 月的 $3.2B，AfterQuery 面临巨大压力，既要维持三位数的高速营收增长，又要仅凭约 30 名员工的精干核心团队，统筹估计达
              100,000 名的外部专家贡献者。
            calloutType: risk
            claimRefs:
              - CR007
              - CR012
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与融资背景
        blocks:
          - type: paragraph
            body: >-
              AfterQuery
              抓住基础模型后训练（post-training）瓶颈，成为人工智能领域扩张最快的基础设施供应商之一。基础模型开发商越发需要特定垂直领域的推理数据和复杂工作流轨迹，而这类高阶数据无法靠公开网络抓取获得。对此，AfterQuery
              开发了定制化强化学习环境，并组织起覆盖法律、金融、软件和医疗等领域且经过认证的在职专业人士网络，负责精选高信号训练数据。凭这一价值主张，公司于 2026 年 4 月宣布完成由 Altos Ventures 领投的
              $30M Series A 轮融资，估值达 $300M；随后披露在成立 14 个月内，年化收入运行率已突破 $100M。2026 年 9 月，老股交易与媒体报道显示，AfterQuery 敲定由
              Andreessen Horowitz 和 Sequoia Capital 领投的 Series B 轮融资，估值达
              $3.2B。不过，尽管营收端增速亮眼，核心反向逻辑依然在于客户高度集中于少数前沿模型开发商；这些客户既有能力、也有动力自建后训练数据管线。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV014
      - number: '8.2'
        title: 可比估值与倍数动态
        blocks:
          - type: paragraph
            body: >-
              按 $100M 年化运行率收入对应 $3.2B 账面估值计算，AfterQuery 隐含市销率达到 32.0x。相较五个月前 Series A 轮确立的 $300M 估值，该估值扩张超过
              10x。对照更广泛的软件与数据基础设施板块，AfterQuery 享有极高的稀缺性溢价。成熟企业级软件可比公司如 Ncino 的市销率约 4.0x，而 Motive 等成熟基础设施平台为
              6.1x。即便在快速增长的生成式 AI 模型与基础设施同业中（如 Black Forest Labs 市销率为 33.9x），也能看出市场只对公认拥有结构性护城河的前沿 AI 公司给出 30x
              以上倍数。市场分析师在行业评述中强调，鉴于官方未公开披露实际募集的新股金额，$3.2B 账面数字反映的是交易定价，而非真正打入资产负债表的现金。有分析博客援引 30x 至 50x
              的主流估值区间，凸显出一级市场对该轮融资的追捧，但也导致其几乎没有缓冲空间来抵御宏观倍数收缩。
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析与下行保护
        blocks:
          - type: paragraph
            body: >-
              为评估当前定价下投资回报的非对称性，结合商业化推进与估值倍数坚挺度，测算 2027 年的三种远期情景。在乐观情景下，AfterQuery 成功将客户群扩展到 Fortune 500
              强企业的智能体部署，并做大标准化基准测试包的复用规模，2027 年年化收入运行率增至 $300M。若维持坚挺的 25.0x 远期倍数，公司估值将达 $7.50B，对应 2.3x
              投资回报。在基准情景下，前沿实验室需求持续，收入增至 $220M，但估值倍数向高增长软件基础设施基准回落至 18.0x，对应企业价值 $3.96B，稀释前仅带来 24%
              的温和回报。在悲观情景下，前沿实验室自建专家评估管线，企业端落地迟滞，收入增长停留在 $150M。估值倍数收缩至 10.0x，对应估值仅为 $1.50B，后期资金面临 53%
              的严重回撤。鉴于超额收益高度集中在乐观情景、且下行风险敞口巨大，当前的风险收益比要求投资者坚守严格的入场条款。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV011
              - CV012
      - number: '8.4'
        title: 投资建议与尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              综合各项实证依据，对 AfterQuery
              给出继续研究（research-more）建议，估值态度为偏高（stretched），风险评级为高（high）。尽管多家独立行业信源证实了公司的产品市场契合度与营收提速，但在 32.0x
              市销率高位投入成长期资金，仍须验证公开披露未包含的关键内部运营指标。确认性尽调须把住三道关口：第一，核实 Series B
              轮中真正注入公司的新股现金与老股套现金额；第二，查验经审计的边际贡献率，判断专业专家网络成本是否呈线性扩张，还是保留了类似软件的高毛利率扩张空间；第三，评估头部 AI
              实验室的客户集中度及续约承诺。可量化的投资逻辑破坏触发条件包括：任一顶级 AI 实验室宣布自建专家网络、单一大客户集中度超过 60%，或老股交易出现估值下调（down-round）。
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.5'
        title: 附图与附表
        blocks:
          - type: callout
            title: 估值倍数高悬与实验室依赖
            body: AfterQuery 达 32.0x 的市销率未留任何缓冲空间，难以抵御倍数收缩或顶级基础模型实验室客户流失的冲击。
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV008
          - type: callout
            title: 后期轮次参与的尽调前提
            body: 投资方应以核实经审计的新股入账现金、毛利率坚挺度以及企业级客户群扩张为参与投资的前提条件。
            calloutType: recommendation
            claimRefs:
              - CV008
