        title: 重点图表
        blocks:
          - type: callout
            title: 推理轨迹构筑核心壁垒
            body: AfterQuery 的战略壁垒建立在捕捉人类逐步推理、中间工具调用及错误恢复轨迹之上，而非静态的输入-输出对。这种专业数据结构解决了前沿模型在标准预训练语料上遭遇的性能瓶颈。
