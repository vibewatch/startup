        - 前 3 大实验室宣布全面自研后训练数据。
      - - 单体经济模型与利润率
        - 软件化管理的工作流支撑起近 100,000 名专家的高效编排。
        - 高额专家薪酬压缩毛利率，使其低于标准 SaaS 水平。
        - 借助可复用数据包，毛利率证明能够扩张至 65% 以上。
      - - 商业势头
        - 从成立到据报道达到 $100M ARR 运行率，仅用时 14 个月。
        - 客户高度集中；一旦单家实验室流失，将引发单点故障式的收入风险。
        - 向企业垂直行业成功扩张，占 ARR 比例超过 40%。
      - - 估值与退出
        - Altos、a16z 与 Sequoia 等顶级机构支持，为公司争取溢价退出铺平道路。
        - 32.0x 收入倍数没有给执行失误或倍数收缩留出任何容错空间。
        - 市场向可比公司倍数（10x-15x）重估，或出现保持 100%+ 持续增长的证据。
    notes: 正向论据与反向风险综合自公司陈述、Sacra 分析以及据报道的融资参数。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV014
  - id: TV003
    title: 情景分析：乐观、基准与悲观情景
    columns:
      - 情景
      - 2027E ARR（$M）
      - 退出 / 远期倍数
      - 隐含估值（$B）
      - 下行触发条件与核心假设
      - 概率信号
    rows:
      - - 乐观情景
        - $300M
        - 25.0x
        - $7.50B
        - 企业级智能体扩张成功；可复用的标准化数据推动毛利率扩张。
        - 25%
      - - 基准情景
        - $220M
        - 18.0x
        - $3.96B
        - 实验室支出持续增长，但倍数从 32.0x 回落至高增长基础设施常态。
        - 50%
      - - 悲观情景
        - $150M
        - 10.0x
        - $1.50B
        - 实验室集中度导致收入见顶；合成数据削弱专家人工需求；存在下调轮次风险。
        - 25%
    notes: 远期估值预测假设达成 2027 年收入运行率目标，且倍数自当前 32.0x 进入水平收缩。测算未计入未来股权稀释。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV011
      - CV012
