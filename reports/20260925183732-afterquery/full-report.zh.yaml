  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户从识别能力短板、部署定制强化学习环境到多领域拓展的推进路径。
    approximationNotes: 综合了公司披露与 Sacra 分析中所述的客户导入工作流。
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU012
    data:
      items:
        - label: 能力短板识别
          actor: 后训练与评估团队
          action: Identify where foundation models fail in real-world professional workflows
          touchpoints:
            - 公开基准测试失败分析
            - 特定领域评估任务
        - label: 咨询式工作流范围界定
          actor: AfterQuery 领域负责人与客户
          action: Scope domain difficulty, expert qualifications, and target reasoning behaviors
          touchpoints:
            - 客户痛点诊断与需求挖掘会议
            - 项目定价与交付物规格说明
        - label: 专家网络清洗与组织
          actor: 经认证的专业贡献者
          action: Deploy vetted practitioners (doctors, lawyers, quants) to generate ground-truth traces
          touchpoints:
            - 定制软件数据创建工具链
            - 内部质量审计与校验
        - label: 环境工程开发
          actor: AfterQuery 研究工程师
          action: Construct custom sandboxes with APIs, tools, and execution harnesses
          touchpoints:
            - Docker 容器化交互式执行环境
            - RL 奖励信号集成
        - label: 模型微调与验证
          actor: 客户后训练工程师
          action: Fine-tune models on curated traces and test against rigorous domain rubrics
          touchpoints:
            - 自动化基准测试评分
            - 错误恢复与行为验证
        - label: 客户账户增购拓展
          actor: 企业 AI 决策层
          action: Expand dataset contracts from single tasks to adjacent professional verticals
          touchpoints:
            - 跨多领域项目拓展
            - 企业级安全与 SOC 2 接入合规
