  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价体系
        blocks:
          - type: paragraph
            body: >-
              AfterQuery 采用 B2B 商业模式，主要服务于前沿基础模型机构内部的后训练团队、评测工程师及企业 AI
              部门。公司不提供原始网络抓取数据或自动化粗标，而是将复杂的人类推理轨迹与专用沙盒环境打包交付。独立行业研究机构 Sacra 的报告显示，AfterQuery
              的收入来源细分为四大产品层：定制强化学习环境、定制监督微调（SFT）推理数据集、标准化评测套件以及企业诊断咨询。定制强化学习环境启动容器化软件栈（如终端沙盒和浏览器界面），供基础模型依据自动化奖励信号执行工具调用序列。由于这些项目针对金融、法律和医疗等领域的复杂失效模式，合同变现主要采取基于项目的程序化收费，而非纯粹按席位计费的
              SaaS 模式。业务范围涵盖专业难度、所需专家资历、环境复杂度以及交付 token 数量，促成了高客单价的定制化交付。
