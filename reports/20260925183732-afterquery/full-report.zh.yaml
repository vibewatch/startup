chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、创立渊源与核心使命
        blocks:
          - type: paragraph
            body: >-
              AfterQuery 是一家应用人工智能研究实验室兼专业训练数据提供商，成立于 2024
              年，总部位于加利福尼亚州旧金山。公司旨在解决前沿基础模型开发者面临的核心运营瓶颈：尽管最先进的大语言模型在标准基准测试中表现优异，但在执行需要复杂多步推理、语境权衡和工具调度的专业工作流时仍显吃力。AfterQuery
              并不依赖公开互联网抓取或通用众包标注，而是紧扣经过认证的从业人员如何做出专业决策，构建专有数据集与强化学习环境。公司核心产品涵盖监督微调（SFT）提示-响应轨迹、将定性专业判断转化为可扩展奖励函数的强化学习评分准则，以及依托模型上下文协议（MCP）服务器与桌面环境构建的模拟
              Agent 沙盒。
            claimRefs:
              - CO001
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
              - CO011
              - CO012
      - number: '1.2'
        title: 创始团队、领导架构与关键人风险
        blocks:
          - type: paragraph
            body: >-
              AfterQuery 由首席执行官 Spencer Mateega、Carlos Georgescu 与 Danny Tang 联合创立。创始人在入读 University of Pennsylvania 的
              Wharton School 本科之前，便在早期技术项目与高中创业中建立了合作关系。Spencer Mateega 取得计算机科学与金融双学位，其间曾在 Google、Meta、Morgan Stanley 及
              Silver Lake 完成软件与私募股权实习。Carlos Georgescu 带来 Citadel Securities 的量化软件工程经验及过往软件创业经历，Danny Tang
              则拥有机器学习神经科学研究与商业地产资本市场背景。由于 AfterQuery 仅保留约 30
              名全职员工的精干核心团队，运营与研发领导权高度集中于三位创始人手中。技术架构、前沿实验室客户关系以及平台专家网络管理均存在明显的关键人依赖。
            claimRefs:
              - CO001
              - CO009
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO009
      - number: '1.3'
        title: 融资历史、估值演进与股权架构
        blocks:
          - type: paragraph
            body: >-
              AfterQuery 作为 Y Combinator 2025 年冬季批次成员启动商业运营，最初筹得 $500,000 种子前轮投资。2026 年 4 月，公司完成 $300M 投后估值的 $30M A
              轮融资。该轮融资由 Altos Ventures 领投，The Raine Group、Y Combinator、BoxGroup、Latitude Capital，以及来自 Google
              DeepMind、OpenAI、Anthropic 和 Microsoft AI 等顶尖 AI 实验室的知名天使投资人跟投。各项已确认轮次累计披露的风投融资金额达 $30.5M。2026 年 9 月，包括
              Forbes 和 TechCrunch 在内的全国性科技媒体报道称，AfterQuery 完成新一轮融资，公司估值达 $3.2B，相当于 5 个月内估值跃升十倍，创下 Y Combinator
              史上据报道最快晋升独角兽的纪录。然而，有关交割条款、领投方及保护性条款的正式文件目前仍未公开。
            claimRefs:
              - CO002
              - CO004
              - CO008
              - CO010
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO010
              - CO012
      - number: '1.4'
        title: 业务演进、产品发展路径与尽调风险
        blocks:
          - type: paragraph
            body: >-
              AfterQuery 自 2025 年初上线后商业变现迅速提速，收入运行率从 2025 年 9 月预估的 $6.5M 增长至 2026 年 4 月年化收入运行率突破
              $100M。这一发展势头源于顶尖基础模型开发者对软件工程、企业金融及法律分析等专业领域人工策划推理数据与评测基准的爆发式需求。该平台统筹近 100,000
              名认证专业贡献者，负责生成示范轨迹、代码重构轨迹及奖励模型评分准则。尽管账面增速亮眼，尽职调查仍揭示出重大运营风险。AfterQuery 的客户收入高度集中于少数前沿 AI
              实验室，这些实验室可能将数据策划转向自研，或转向 Scale AI 等平台型老牌厂商。此外，管理定制化专业工作流相较初级标注交易市场带来了更高的成本结构，必须大幅借助标准化现成数据目录才能拉升毛利率。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO013
              - CO014
