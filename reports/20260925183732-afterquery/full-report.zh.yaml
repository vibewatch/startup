  - id: FM001
    title: 市场规模透镜
    type: pyramid
    summary: 多层目标市场规模测算，对比泛 IT 与 AI 支出以及前沿后训练数据可触达预算。
    data:
      items:
        - label: 全球企业 IT 与软件支出
