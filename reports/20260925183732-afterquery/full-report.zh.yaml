  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与业务边界
        blocks:
          - type: paragraph
            body: >-
              人工智能训练数据市场正在经历结构性转型，从低成本众包数据标注转向高置信度专家推理与交互式强化学习环境。在深度学习落地的初期，数据供应商主要比拼计算机视觉与对话文本的单位标注吞吐量。然而，前沿基础模型开发者已基本耗尽通用网络抓取与浅层标注所能带来的性能红利。为攻克关键任务应用中的模型推理瓶颈与幻觉问题，前沿实验室正将大量资金投向持证医师、执业企业律师、金融分析师及资深软件架构师等经认证的行业专家，由其生成逐步推理轨迹与严格评测准则。AfterQuery
              正好卡位这一分水岭：其产品涵盖监督微调数据、定制强化学习沙盒及特定领域评测基础设施，同时明确排除同质化的基础标注与通用基础设施运维。
            claimRefs:
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM007
              - CM013
      - number: '2.2'
        title: 市场规模测算视角及自上而下与自下而上的分歧
        blocks:
          - type: paragraph
            body: >-
              测算专家后训练数据的潜在市场空间，揭示出传统自上而下分析师预测与自下而上实际商业表现之间的显著脱节。Grand View Research 与 Fortune Business Insights
              发布的权威市场研究报告将 2026 年全球 AI 训练数据集市场规模预计为约 $3.9B 至 $4.4B，Mordor Intelligence 更宽泛的分类口径则延伸至
              $11.9B。然而，这些自上而下的市场测算模型普遍低估了前沿人工智能实验室预算转移的速度。对 Scale AI、Mercor、Handshake、Micro1、Surge AI 和 AfterQuery
              等核心商业供应商披露的年化收入运行率进行自下而上梳理后发现，全行业累计开票金额每年已达 $6B 至
              $8B。随着基础模型开发者展开白热化的能力角逐，此前投向通用算力集群或内部启发式数据流的预算，正被大规模调往外部高置信度人类数据生成与专用强化学习训练场（gym）。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
      - number: '2.3'
        title: 买家细分、采购动态与业务工作流
        blocks:
          - type: paragraph
            body: >-
              后训练生态中的采购动态具有鲜明的客群两极化格局，买家涵盖前沿 AI
              科研实验室与前瞻性企业机构。在基础模型实验室中，核心决策者是研究科学家、评测负责人与后训练主管，其核心职责在于攻坚核心推理基准指标并防范灾难性模型失效模式。此类技术买家采用咨询式、结果导向的采购流程，合同金额取决于专业领域难度、验证复杂度及数据集规模，而非可预测的按席位软件许可模式。与此同时，第二条企业级应用渠道正在萌芽。行业调查显示，尽管超过
              60% 的大型企业正在积极试验自主 AI Agent，但将规模化 Agent
              工作流成功部署至生产环境的企业不足四分之一。弥合这一企业落地鸿沟，需要将现成基础模型与企业专属专有数据、合规边界及确定性工具调用环境深度结合，这也为 AfterQuery 打开了不断扩大的第二增长曲线市场机遇。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动因素、结构性制约与证据缺失
        blocks:
          - type: paragraph
            body: >-
              AfterQuery 目标市场的扩张受到多重结构性顺风的叠加驱动，但也受到重大运营与商业落地瓶颈的制约。从增长驱动力来看，基础模型预训练架构迅速同质化，促使后训练数据与评测环境成为差异化竞争的核心支点。公司与
              Nvidia 在 Nemotron 3 Ultra
              训练数据集上达成的战略合作印证了这一点：硬件生态与模型开发者正日益依赖专业数据合作伙伴。然而，潜在的结构性风险同样突出。商业需求目前高度集中于极少数顶尖前沿实验室，导致单笔合同体量庞大且交付节奏不均，加剧了营运资金波动。此外，针对数据出口的潜在地缘政治与监管限制（例如据推算来自中国
              AI 科研实验室的经常性收入）可能冲击国际收入线。尤为关键的是，AfterQuery 的真实毛利率概况与承包商转包分成机制在现有商业报道中均未公开，留下了重大的分析空白。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 自上而下测算与前沿实验室实际支出的脱节
            body: >-
              传统分析师报告预计全球 AI 数据集市场规模在 $3.9B 至 $4.4B 之间，然而领先前沿数据供应商的开票总额已逼近 $6B 至 $8B+。这种脱节突显出传统研究框架仍将 AI
              训练数据视为初级众包标注，未能捕捉到大量资本涌向专家推理轨迹与强化学习环境的爆发式投入。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM012
          - type: callout
            title: 收入集中度与资本依赖
            body: >-
              尽管 AfterQuery 营收增长迅速，运行率已突破 $100M+，但其市场空间仍高度集中于少数前沿 AI
              实验室。合同交付节奏不均以及面临实验室自研数据工程的替代威胁，构成了实质性的业务拓展瓶颈，亟需主动向企业垂直工作流推进多元化布局。
            calloutType: risk
            claimRefs:
              - CM001
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与直接同行
        blocks:
          - type: paragraph
            body: >-
              前沿 AI 训练数据市场已分化为走量型数据工厂与专业化专家数据平台两大阵营。Scale AI 等老牌数据供应商依托覆盖广泛的多模态标注业务、深厚的联邦政府及商业企业客户关系，以及超过 $1.6B
              的庞大融资规模牢牢占据市场底座。2026 年初，Scale AI 推出专用强化学习环境，印证了全行业从静态提示-响应标注向交互式工作流执行的转变。与此同时，Mercor 与 Surge AI 等专业挑战者作为
              AfterQuery 的直接同行迅速崛起，直接向顶尖人工智能实验室输送顶尖专业人才及特定领域评测环境。Mercor
              据报已渗透多数顶级基础模型开发者，将自身定位为承接复杂推理任务的核心专家数据集供应商。此外，Labelbox 等更广泛的平台依托 Alignerr 等专业人才分支加速拓展，Turing
              等人才交易平台亦提供庞大的开发者资源池与合成数据生成流程。Tracxn 的综合市场情报显示，数据及数据集领域活跃的竞争对手超过 240 家，既反映出旺盛的商业需求，也表明基础标注服务准入门槛极低。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP010
      - number: '3.2'
        title: 能力差异化与定价机制
        blocks:
          - type: paragraph
            body: >-
              区别于传统数据供应商，AfterQuery 将业务重心放在专业过程推理与多轮工作流执行上，而非简单的文本分类或事实问答。传统供应商依赖宽泛的众包标注，AfterQuery
              则依托自研软件基础设施，将经过认证的执业医生、企业律师及量化工程师等专业人员组织进模拟运行环境。公司公布的研究成果强调，若缺乏特定领域的行为约束，标准基础模型在 FinanceQA
              等评测的真实专业工作流中，失误率最高可达 60%。公司平台借助 Docker 容器、浏览器界面与开发者 API 构建沙盒环境，供模型学习工具调用时序、输入验证及错误恢复。与按席位计费的标准 SaaS
              模式不同，专家数据行业的商业变现主要以程序化与项目制为主。合同定价由专业领域复杂度、专家资历深浅以及环境模拟要求共同决定。尽管这种机制为来自 Nvidia、Legora 及 Motif Technologies
              等客户贡献了可观的单笔合同金额，但相比纯软件授权，也带来了高昂的实际交付成本与收入不稳定性。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
