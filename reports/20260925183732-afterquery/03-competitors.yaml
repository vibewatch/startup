callouts:
  - calloutType: "risk"
    title: "Frontier Lab Insourcing Threat"
    body: "The primary strategic risk to AfterQuery's commercial durability is the potential for major frontier labs to internalize specialized post-training data operations. Because revenue is heavily concentrated among elite model builders, any decision by key labs to bring expert RL environments in-house would compress industry margins and directly impact contract volumes."
    claimRefs:
      - "CP005"
      - "CP011"
  - calloutType: "insight"
    title: "Workflow Grounding as a Defensibility Barrier"
    body: "By capturing end-to-end professional decisions across terminal interactions, multi-step tool calls, and error recovery rather than static text labels, AfterQuery creates higher switching costs. Models fine-tuned on realistic execution sandboxes exhibit behavioral corrections that standard synthetic generation cannot easily duplicate."
    claimRefs:
      - "CP004"
      - "CP006"
      - "CP014"
