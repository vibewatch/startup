callouts:
  - calloutType: "insight"
    title: "Top-Down Sizing Disconnect from Frontier Lab Spend"
    body: "Traditional analyst reports project the global AI dataset market between $3.9B and $4.4B, yet aggregated billings from leading frontier data providers already approach $6B to $8B+. This divergence highlights that legacy research frameworks treat AI training data as simple crowdsourced labeling, failing to capture the explosive capital allocation into expert reasoning traces and reinforcement learning environments."
    claimRefs:
      - "CM003"
      - "CM005"
      - "CM012"
  - calloutType: "risk"
    title: "Revenue Concentration and Capital Dependence"
    body: "While AfterQuery achieved rapid top-line growth to a $100M+ run rate, its market opportunity remains concentrated among a small number of frontier AI laboratories. Contract lumpiness and vulnerability to lab-internalized data engineering represent material adoption constraints that require proactive diversification into enterprise vertical workflows."
    claimRefs:
      - "CM001"
      - "CM010"
      - "CM011"
