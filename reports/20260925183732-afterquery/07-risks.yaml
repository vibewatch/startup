chapter:
  number: 7
  title: Risks
  summary: Comprehensive risk appraisal of AfterQuery analyzing frontier AI lab customer concentration, expert contractor quality overhead, margin sensitivity versus low-cost marketplaces, physical robotics teleoperation dependencies, and legal liability in high-stakes domain training.
sections:
  - id: sec-regulatory-legal
    title: Regulatory, Legal, and Compliance Risk Registers
    body: AfterQuery operates at the intersection of professional domain expertise and generative model post-training, introducing distinct legal and regulatory exposure across intellectual property, data protection, and professional practice boundaries. In sensitive verticals such as corporate law, securities, and healthcare, the company must guarantee rigorous citation integrity and jurisdictional precision to prevent generative models from adopting confident-sounding hallucinations. As enterprise accounts scale, maintaining SOC 2 Type II and ISO 27001 certifications serves as an essential procurement gate rather than discretionary hygiene. In addition, managing a globally distributed network of expert contributors requires continuous compliance with independent contractor classifications and clear intellectual property assignment frameworks to ensure clean chain-of-title for all delivered datasets and evaluation suites.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    tableRefs:
      - TR001
  - id: sec-operational-quality
    title: Operational Failure Modes, Robotics Hardware, and Quality Assurance
    body: Operational durability is central to AfterQuery's research-driven positioning. In cognitive domains, the primary failure mode centers on annotation grading noise where nuanced domain nuances escape human reviewers and compromise model reward signals. In emerging embodied and physical AI offerings, operational complexity multiplies due to physical dependencies on robotics hardware, teleoperation rigs, and camera setups. Engineering documentation from AfterQuery's open-source robotics research highlights frequent failure points including daisy-chain wiring faults, servo motor overloads, and power supply voltage mismatches that interrupt dataset recording pipelines. Simultaneously, operating a lean core team of approximately thirty employees creates potential coordination friction when overseeing tens of thousands of distributed contributors and managing isolated Docker sandboxes for reinforcement learning evaluations.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
    tableRefs:
      - TR002
  - id: sec-counterparty-concentration
    title: Customer Concentration, Margin Pressures, and Platform Dependencies
    body: Commercial traction has been exceptional, but customer concentration in frontier AI laboratories represents a significant strategic risk factor. Because top frontier labs represent both AfterQuery's primary source of revenue and sophisticated entities capable of developing internal data pipelines, any decision by one or two flagship clients to in-source post-training operations or bundle contracts with incumbent data vendors would severely impact commercial momentum. Furthermore, AfterQuery's commitment to verified human professionals and custom in-house software incurs a significantly higher cost structure than crowdsourced marketplace competitors that rely on labor arbitrage. Expanding gross margins requires transitioning bespoke programmatic engagements into reusable, off-the-shelf benchmark packages and broader enterprise workflow deployments.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR003
  - id: sec-risk-synthesis-heatmap
    title: Residual Risk Heatmap, Mitigation Maturity, and Thesis-Break Triggers
    body: 'Synthesizing strategic, operational, and financial exposures reveals that frontier lab customer concentration and high valuation overhang present the highest residual investment risks. A reported valuation expansion to $3.2 billion within five months of its Series A round compresses the margin for operational error and demands rapid enterprise expansion beyond core foundation labs. Core thesis-break triggers for investors include: any major frontier lab in-sourcing post-training pipelines resulting in material account churn; persistent gross margin erosion driven by rising expert contractor compensation; or significant data security breaches that jeopardize SOC 2 compliance and enterprise data sharing agreements.'
    claimRefs:
      - CR013
      - CR014
      - CR015
    figureRefs:
      - FR001
