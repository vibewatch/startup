callouts:
  - calloutType: risk
    title: Frontier Lab Insourcing and Bundled Platform Displacement
    body: AfterQuery's rapid scaling to a reported $100M revenue run rate is heavily anchored in frontier AI labs. Because these frontier labs represent both its primary revenue source and potential competitors, any strategic shift toward in-house post-training data operations or bundled platform agreements (e.g. with Scale AI) represents a material downside vulnerability.
    claimRefs:
      - CR009
      - CR013
  - calloutType: risk
    title: Valuation Escalation and Operational Leverage Strain
    body: With a reported valuation escalation from $300M in April 2026 to $3.2B in September 2026, AfterQuery faces intense pressure to maintain triple-digit revenue growth while coordinating an estimated 100,000 external expert contributors with a lean core team of approximately 30 employees.
    claimRefs:
      - CR007
      - CR012
      - CR014
