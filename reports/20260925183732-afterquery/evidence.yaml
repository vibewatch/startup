evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: September 2026 Valuation Financing Terms
    missingEvidence: >-
      Confirmed regulatory filings, definitive closing term sheets, lead investor identity, and share price for the
      reported $3.2B valuation round.
    whyItMatters: >-
      A 10x valuation step-up within five months materially alters dilution, liquidation preferences, and capital
      structure assumptions for follow-on investors.
    diligencePath: >-
      Request Certificate of Incorporation amendments, Series B financing agreements, or board minutes directly from
      company counsel.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: Customer Revenue Concentration Breakdown
    missingEvidence: >-
      Audited customer revenue concentration disclosures, contract duration, and gross dollar retention among frontier
      lab accounts.
    whyItMatters: >-
      High reliance on a handful of frontier model developers exposes revenue stability to lab internalization and
      insourcing shifts.
    diligencePath: Obtain management-prepared customer concentration schedule and top-10 customer cohort renewal metrics under NDA.
    relatedTableRefs:
      - TO001
