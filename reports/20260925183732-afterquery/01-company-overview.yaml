chapter:
  number: 1
  title: "Company Overview"
  summary: "AfterQuery is a San Francisco-based AI training data lab founded in 2024 that curates expert reasoning datasets and simulation environments for frontier foundation models. Backed by Altos Ventures, Y Combinator, and The Raine Group, the company reached a reported $100M revenue run rate in April 2026 before entering discussions for a reported $3.2B valuation round in September 2026."
sections:
  - id: "identity-and-mission"
    title: "Company Identity, Origin, and Mission"
    body: >-
      AfterQuery is an applied artificial intelligence research lab and specialized training data provider founded in 2024 and headquartered in San Francisco, California. The company addresses a fundamental operational bottleneck encountered by frontier foundation model developers: while state-of-the-art large language models demonstrate proficiency at standard benchmarks, they struggle to execute nuanced professional workflows that demand complex multi-step reasoning, contextual trade-offs, and tool orchestration. Rather than relying on public internet scraping or generic crowdsourced labelers, AfterQuery structures proprietary datasets and reinforcement learning environments around how verified practitioners make professional decisions. The company's core offering spans supervised fine-tuning prompt-response traces, reinforcement learning rubrics that transform qualitative professional judgment into scalable reward functions, and simulated agent sandboxes built with Model Context Protocol (MCP) servers and desktop environments.
    claimRefs:
      - "CO001"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "founding-and-leadership"
    title: "Founding Team, Leadership Structure, and Key-Person Risk"
    body: >-
      AfterQuery was founded by Chief Executive Officer Spencer Mateega, Carlos Georgescu, and Danny Tang. The founders established initial working relationships through early technical programs and high school ventures before pursuing undergraduate studies at the University of Pennsylvania's Wharton School. Spencer Mateega completed degrees in computer science and finance while completing software and private equity internships at Google, Meta, Morgan Stanley, and Silver Lake. Carlos Georgescu contributed quantitative software engineering experience from Citadel Securities alongside prior software ventures, while Danny Tang brought background in machine learning neuroscience research and commercial real estate capital markets. Because AfterQuery maintains an agile full-time core team of approximately 30 employees, operational and research leadership remains highly concentrated in its founding triumvirate. Key-person dependency is pronounced across technical architecture, frontier lab customer relationships, and platform expert network management.
    claimRefs:
      - "CO001"
      - "CO009"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investors"
    title: "Capitalization History, Valuation Progression, and Ownership Structure"
    body: >-
      AfterQuery initiated commercial operations as part of Y Combinator's Winter 2025 batch, raising an initial $500,000 pre-seed investment. In April 2026, the company closed a $30 million Series A financing round at a $300 million post-money valuation. The round was led by Altos Ventures with participation from The Raine Group, Y Combinator, BoxGroup, Latitude Capital, and prominent angel investors from leading AI laboratories including Google DeepMind, OpenAI, Anthropic, and Microsoft AI. Cumulative disclosed venture funding totals $30.5 million across confirmed rounds. In September 2026, national technology publications including Forbes and TechCrunch reported that AfterQuery raised a subsequent investment round valuing the company at $3.2 billion, representing a ten-fold valuation increase in five months and establishing AfterQuery as Y Combinator's fastest-ever reported unicorn. However, formal documentation regarding closing terms, lead investors, and protective covenants remains private.
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO008"
      - "CO010"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-milestones"
    title: "Operational Evolution, Product Trajectory, and Diligence Risks"
    body: >-
      AfterQuery demonstrated rapid commercial acceleration following its early 2025 launch, growing from an estimated $6.5 million run rate in September 2025 to over $100 million in annualized revenue run rate by April 2026. This trajectory was fueled by surging demand among leading foundation model developers seeking human-curated reasoning data and evaluation benchmarks across specialized domains such as software engineering, corporate finance, and legal analysis. The platform coordinates nearly 100,000 verified professional contributors who generate demonstration trajectories, code refactoring traces, and reward model rubrics. Despite exceptional headline growth, diligence highlights significant operational risks. AfterQuery exhibits heavy customer revenue concentration among a small consortium of frontier AI labs that could internalize data curation or shift to platform incumbents like Scale AI. Furthermore, managing bespoke professional workflows creates a higher cost structure than commodity labeling marketplaces, requiring substantial off-the-shelf catalog leverage to expand gross margins.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
