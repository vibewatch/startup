callouts:
  - calloutType: "insight"
    title: "Reasoning Traces as Core Defensibility"
    body: "AfterQuery's strategic defensibility rests on capturing step-by-step human reasoning, intermediate tool calls, and error recovery trajectories rather than static input-output pairs. This specialized data structure addresses frontier model plateauing on standard pre-training corpora."
    claimRefs:
      - "CO001"
      - "CO007"
  - calloutType: "risk"
    title: "Frontier Lab Customer Concentration and Disintermediation"
    body: "Substantially all current revenue originates from top-tier foundation model labs that possess immense financial resources and internal research talent. Any strategic decision by frontier labs to internalize specialized post-training environments represents a material threat to revenue continuity."
    claimRefs:
      - "CO005"
      - "CO013"
      - "CO014"
