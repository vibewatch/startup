      - number: '5.3'
        title: Technical Infrastructure, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Delivering high-fidelity data solutions requires a resilient technical infrastructure bridging a global
              expert contributor network with multi-tenant model laboratory deployments. AfterQuery coordinates an
              expert network of nearly 100,000 verified professionals across medicine, law, software engineering, and
              investment banking via its dedicated expert portal. The internal engineering stack leverages Python, Go,
              TypeScript, and modern container orchestration on AWS and Google Cloud Platform to manage data pipelines
              and human-in-the-loop annotation workflows. Because model lab engagements involve highly confidential
              client codebases, proprietary trading strategies, and unreleased frontier model architectures, security
              represents an existential procurement gate. The company maintains SOC 2 Type II and ISO 27001
              certifications while deploying programmatic identity and access management, strict network boundaries, and
              automated vulnerability monitoring to ensure complete data isolation across enterprise engagements.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE014
          - type: table
