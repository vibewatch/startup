              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple Overhang and Lab Dependency
            body: >-
              AfterQuery's 32.0x revenue multiple leaves no buffer against multiple contraction or customer churn among
              top-tier foundation model labs.
            calloutType: risk
