      - number: '7.2'
        title: Operational Failure Modes, Robotics Hardware, and Quality Assurance
        blocks:
          - type: paragraph
            body: >-
              Operational durability is central to AfterQuery's research-driven positioning. In cognitive domains, the
              primary failure mode centers on annotation grading noise where nuanced domain nuances escape human
              reviewers and compromise model reward signals. In emerging embodied and physical AI offerings, operational
              complexity multiplies due to physical dependencies on robotics hardware, teleoperation rigs, and camera
              setups. Engineering documentation from AfterQuery's open-source robotics research highlights frequent
              failure points including daisy-chain wiring faults, servo motor overloads, and power supply voltage
              mismatches that interrupt dataset recording pipelines. Simultaneously, operating a lean core team of
              approximately thirty employees creates potential coordination friction when overseeing tens of thousands
              of distributed contributors and managing isolated Docker sandboxes for reinforcement learning evaluations.
            claimRefs:
