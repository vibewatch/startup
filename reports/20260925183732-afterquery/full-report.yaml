      - number: '7.3'
        title: Customer Concentration, Margin Pressures, and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              Commercial traction has been exceptional, but customer concentration in frontier AI laboratories
              represents a significant strategic risk factor. Because top frontier labs represent both AfterQuery's
              primary source of revenue and sophisticated entities capable of developing internal data pipelines, any
              decision by one or two flagship clients to in-source post-training operations or bundle contracts with
              incumbent data vendors would severely impact commercial momentum. Furthermore, AfterQuery's commitment to
              verified human professionals and custom in-house software incurs a significantly higher cost structure
              than crowdsourced marketplace competitors that rely on labor arbitrage. Expanding gross margins requires
              transitioning bespoke programmatic engagements into reusable, off-the-shelf benchmark packages and broader
              enterprise workflow deployments.
            claimRefs:
              - CR009
