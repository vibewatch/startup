              - CP005
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Frontier Lab Insourcing Threat
            body: >-
              The primary strategic risk to AfterQuery's commercial durability is the potential for major frontier labs
              to internalize specialized post-training data operations. Because revenue is heavily concentrated among
              elite model builders, any decision by key labs to bring expert RL environments in-house would compress
              industry margins and directly impact contract volumes.
            calloutType: risk
            claimRefs:
              - CP005
              - CP011
          - type: callout
            title: Workflow Grounding as a Defensibility Barrier
            body: >-
              By capturing end-to-end professional decisions across terminal interactions, multi-step tool calls, and
              error recovery rather than static text labels, AfterQuery creates higher switching costs. Models
              fine-tuned on realistic execution sandboxes exhibit behavioral corrections that standard synthetic
              generation cannot easily duplicate.
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              AfterQuery operates a business-to-business commercial model catering primarily to post-training teams,
              evaluation engineers, and enterprise AI groups within frontier foundation model organizations. Rather than
              delivering raw web scrape data or automated labeling, the company packages complex human reasoning traces
              and specialized sandbox environments. According to independent industry research from Sacra, AfterQuery's
              revenue streams divide into four distinct product layers: bespoke reinforcement learning environments,
              customized supervised fine-tuning (SFT) reasoning datasets, standardized evaluation packages, and
              enterprise diagnostic consulting. Custom RL environments boot containerized software stacks (such as
              terminal sandboxes and browser interfaces) where foundation models execute tool-calling sequences against
              automated reward signals. Because these engagements target nuanced failure modes in fields like finance,
              law, and medicine, contract monetization is project-based and programmatic rather than pure seat-license
              software-as-a-service. Engagements are scoped around domain difficulty, required expert credentials,
              environment complexity, and delivered token volume, yielding high contract values with custom
              deliverables.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI012
      - number: '4.2'
        title: Go-to-Market Motion and Contract Economics
        blocks:
          - type: paragraph
            body: >-
              AfterQuery's go-to-market motion departs significantly from conventional enterprise software sales and
              commodity data labeling platforms. Demand generation is anchored in empirical AI research publications and
              public benchmark evaluation suites such as FinanceQA, IDE-Bench, and Terminal-Bench. By publishing
              rigorous technical studies demonstrating that leading commercial foundation models fail upward of 60% of
              complex, realistic professional workflow tasks, AfterQuery establishes technical credibility directly with
              research scientists and post-training leads at frontier AI labs. This research-led sales motion compresses
              procurement friction by presenting dataset acquisitions as quantifiable hill-climbing solutions to known
              benchmark deficiencies. Enterprise delivery is enabled by an internal roster of nearly 100,000 verified
              practicing professionals across software engineering, medicine, and legal practice. Crucially, AfterQuery
              deploys internal research personnel to pre-validate all human-curated datasets through model fine-tuning
              and benchmark verification before delivery. This software-first validation loop guarantees that training
              data falls within a strict difficulty band that frontier models can absorb without destabilizing existing
              reasoning capabilities.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
