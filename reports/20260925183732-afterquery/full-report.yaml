        - Software-managed workflows allow efficient orchestration of nearly 100,000 experts.
        - High expert compensation fees compress gross margins below standard SaaS levels.
        - Gross margins demonstrating expansion above 65% via reusable data packages.
      - - Commercial Momentum
        - Rapid scaling from launch to reported $100M ARR run-rate within 14 months.
        - Customer concentration creates single-point-of-failure revenue risk if one lab churns.
        - Successful expansion into enterprise verticals representing over 40% of ARR.
      - - Valuation & Exit
        - Tier-1 backing from Altos, a16z, and Sequoia positions company for premium exit.
        - 32.0x revenue multiple leaves no room for execution missteps or multiple compression.
        - Market re-rating towards peer multiples (10x-15x) or evidence of 100%+ sustained growth.
    notes: >-
      Thesis arguments and anti-thesis risks compiled from company statements, Sacra analysis, and reported financing
      parameters.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV014
