              - CU007
              - CU008
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer Concentration at Frontier AI Labs
            body: >-
              AfterQuery's hyper-velocity growth to a $100M+ revenue run rate is heavily reliant on a small cohort of
              frontier model labs. If major labs internalize expert post-training or shift toward hybrid synthetic data
              pipelines, AfterQuery faces severe revenue volatility unless enterprise accounts scale rapidly.
            calloutType: risk
            claimRefs:
              - CU005
              - CU009
          - type: callout
            title: Consultative Engagements vs Recurring SaaS Durability
            body: >-
              Unlike traditional seat-based SaaS, AfterQuery's monetization is largely project-scoped and
              outcome-driven. While this structure enables massive initial contract sizes, long-term durability requires
              continuous re-scoping into adjacent professional domains or embedding recurring evaluation environments
              directly into customer CI/CD loops.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk Registers
        blocks:
          - type: paragraph
            body: >-
              AfterQuery operates at the intersection of professional domain expertise and generative model
              post-training, introducing distinct legal and regulatory exposure across intellectual property, data
              protection, and professional practice boundaries. In sensitive verticals such as corporate law,
              securities, and healthcare, the company must guarantee rigorous citation integrity and jurisdictional
              precision to prevent generative models from adopting confident-sounding hallucinations. As enterprise
              accounts scale, maintaining SOC 2 Type II and ISO 27001 certifications serves as an essential procurement
              gate rather than discretionary hygiene. In addition, managing a globally distributed network of expert
              contributors requires continuous compliance with independent contractor classifications and clear
              intellectual property assignment frameworks to ensure clean chain-of-title for all delivered datasets and
              evaluation suites.
            claimRefs:
