  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope Boundaries
        blocks:
          - type: paragraph
            body: >-
              The market for artificial intelligence training data is undergoing a structural transition from low-cost,
              crowdsourced data annotation toward high-assurance expert reasoning and interactive reinforcement learning
              environments. In the initial waves of deep learning deployment, data vendors primarily competed on
              per-unit labeling throughput for computer vision and conversational text. However, frontier foundation
              model developers have largely exhausted the performance gains achievable through generic web scrapes and
              surface-level labeling. To overcome model reasoning plateaus and hallucinations in mission-critical
              applications, frontier labs now allocate substantial capital toward verified domain
              practitioners—including licensed physicians, corporate attorneys, financial analysts, and senior software
              architects—who can generate step-by-step reasoning trajectories and rigorous evaluation rubrics.
              AfterQuery positions itself precisely at this boundary: its offerings encompass supervised fine-tuning
              data, custom reinforcement learning sandboxes, and domain-specific evaluation infrastructure, while
              explicitly excluding commoditized basic annotation and generic infrastructure management.
            claimRefs:
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM007
              - CM013
      - number: '2.2'
        title: Market Sizing Lenses and Top-Down vs. Bottom-Up Divergence
        blocks:
          - type: paragraph
            body: >-
              Estimating the addressable market for expert post-training data reveals a stark disconnect between
              conventional top-down analyst projections and actual bottom-up commercial traction. Established market
              research reports from Grand View Research and Fortune Business Insights model the 2026 global AI training
              dataset market at approximately $3.9 billion to $4.4 billion, while broader taxonomies from Mordor
              Intelligence extend toward $11.9 billion. However, these top-down market sizing models systematically
              undercount rapid budget shifts at frontier artificial intelligence laboratories. A bottom-up examination
              of annualized revenue run rates reported across key commercial vendors—such as Scale AI, Mercor,
              Handshake, Micro1, Surge AI, and AfterQuery—indicates that cumulative industry billings already reach
              between $6 billion and $8 billion annually. As foundation model developers engage in intense capability
              competition, budgets previously allocated to generic computing clusters or internal heuristic pipelines
              are being aggressively redirected into external, high-assurance human data generation and specialized
              reinforcement learning gyms.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
      - number: '2.3'
        title: Buyer Segmentation, Procurement Dynamics, and Workflows
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics within the post-training ecosystem are characterized by a bifurcated buyer landscape
              spanning frontier AI research laboratories and forward-leaning enterprise organizations. At foundation
              model labs, the primary decision-makers are research scientists, evaluation leads, and heads of
              post-training whose primary mandate is hillclimbing core reasoning benchmarks and preventing catastrophic
              model failure modes. These technical buyers operate consultative, outcome-oriented procurement processes
              where contract size is determined by domain difficulty, verification complexity, and dataset volume rather
              than predictable per-seat software licensing. Concurrently, a secondary enterprise adoption channel is
              beginning to emerge. While industry surveys indicate that over 60% of corporate enterprises are actively
              experimenting with autonomous AI agents, fewer than a quarter have successfully deployed scaled agent
              workflows into production. Closing this enterprise deployment gap requires grounding off-the-shelf
              foundation models in firm-specific proprietary data, regulatory guardrails, and deterministic tool-calling
              environments, creating an expanding second-wave addressable opportunity for AfterQuery.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption Drivers, Structural Constraints, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The expansion of AfterQuery's addressable market is driven by several compounding structural tailwinds,
              yet it remains tempered by significant operational and commercial adoption constraints. On the growth
              side, the rapid commoditization of foundation model pre-training architectures has elevated post-training
              data and evaluation environments into the primary lever for competitive differentiation. Strategic
              partnerships, such as AfterQuery's collaboration with Nvidia on Nemotron 3 Ultra training datasets,
              demonstrate that hardware ecosystems and model developers increasingly depend on specialized data
              partners. Conversely, substantial structural risks exist. Commercial demand is currently concentrated
              within a small handful of elite frontier labs, resulting in large, lumpy contract cycles that introduce
              working-capital volatility. Furthermore, potential geopolitical and regulatory constraints on data
              exports—exemplified by estimated recurring revenue derived from Chinese AI research laboratories—could
              disrupt international revenue streams. Crucially, a major analytical gap persists regarding AfterQuery's
              true gross margin profile and contractor pass-through economics, which remain undisclosed in available
              commercial reporting.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top-Down Sizing Disconnect from Frontier Lab Spend
            body: >-
              Traditional analyst reports project the global AI dataset market between $3.9B and $4.4B, yet aggregated
              billings from leading frontier data providers already approach $6B to $8B+. This divergence highlights
              that legacy research frameworks treat AI training data as simple crowdsourced labeling, failing to capture
              the explosive capital allocation into expert reasoning traces and reinforcement learning environments.
            calloutType: insight
            claimRefs:
