      - number: '6.2'
        title: Adoption Trajectory and Revenue Velocity
        blocks:
          - type: paragraph
            body: >-
              AfterQuery has recorded an unprecedented commercial growth trajectory since graduating from Y Combinator's
              Winter 2025 cohort. The company announced that it surpassed an annualized revenue run rate of $100 million
              in April 2026, representing less than fourteen months of commercial operation since its founding. This
              extraordinary scaling velocity was rewarded by the venture capital market in September 2026, when
              AfterQuery reportedly secured private financing valuing the business at $3.2 billion. This transaction
              established AfterQuery as the fastest startup in Y Combinator history to reach unicorn status from launch,
              compressing traditional enterprise scaling timelines by an order of magnitude. However, this headline
              revenue trajectory must be interpreted with analytical caution. Financial analysts and tracking services
              emphasize that an annualized revenue run rate is an extrapolated management projection rather than audited
              historical GAAP revenue. Crucially, public commercial tracking platforms confirm that AfterQuery has
              disclosed no audited customer count data, active enterprise logo totals, or average contract values,
              leaving the exact volume of paying accounts supporting this $100 million run rate unverified.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
