              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP012
      - number: '3.3'
        title: Moat Durability & Strategic Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              The sustainability of AfterQuery's competitive advantage hinges on the durability of its expert network
              and the technical complexity of its reinforcement learning sandboxes. Because domain experts are
              non-exclusive knowledge workers who can multi-home across platforms like Mercor, Surge AI, or Scale AI,
              contributor access alone does not constitute an unassailable moat. Instead, defensibility stems from the
              proprietary software tooling, workflow instrumentation, and verification rubrics that structure how expert
              reasoning is converted into high-signal reward models. Nevertheless, AfterQuery faces two structural
              displacement risks. First, frontier artificial intelligence laboratories represent both the company's
              primary customer base and its greatest disintermediation threat; leading research labs possess the
              technical capability to internalize expert annotation pipelines if external vendor margins appear
              excessive. Second, the rapid maturation of synthetic data generation and agentic evaluation frameworks
              allows competitors to produce high-volume training instances at lower marginal cost. Navigating these
              pressures requires AfterQuery to continuously hill-climb into more complex, regulated professional domains
              where synthetic approximations fail to replicate authentic professional judgment.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
