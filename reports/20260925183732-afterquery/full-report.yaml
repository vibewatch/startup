              - CU014
      - number: '6.4'
        title: Durability, Expansion Mechanics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of AfterQuery's customer relationships hinges on its ability to evolve from a
              consultative project provider into an embedded, recurring infrastructure layer. Currently, monetization is
              structured around project-based pricing scoped to domain difficulty, expert compensation, environment
              complexity, and delivered dataset volume. While this enables massive initial contract values, it exposes
              the business to severe revenue concentration. The company's revenue base is heavily weighted toward a
              handful of well-capitalized frontier AI labs that possess both the financial capacity to sponsor
              eight-figure contracts and the technical capability to internalize data curation operations. If major
              foundation labs elect to insource post-training data curation or migrate to hybrid synthetic data
              pipelines, AfterQuery faces acute churn exposure. Furthermore, competitive pressure is mounting from
              platform incumbents such as Scale AI and agile expert networks like Mercor, Surge AI, and Labelbox. To
              insulate against lab concentration, AfterQuery must systematically execute its land-and-expand journey,
              transitioning initial benchmark evaluation packages into permanent, multi-domain workflow simulation
              environments deeply integrated into enterprise engineering stacks.
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
