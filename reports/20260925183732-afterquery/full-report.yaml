  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Direct Peers
        blocks:
          - type: paragraph
            body: >-
              The market for frontier AI training data has bifurcated between high-volume data factories and specialized
              expert data platforms. Incumbent data providers such as Scale AI anchor the market with broad multi-modal
              annotation operations, extensive federal and commercial enterprise relationships, and significant
              capitalization exceeding 1.6 billion dollars raised. In early 2026, Scale AI launched dedicated
              reinforcement learning environments, reflecting the industry-wide transition from static prompt-response
              labeling to interactive workflow execution. Concurrently, specialized challengers such as Mercor and Surge
              AI have emerged as direct peers to AfterQuery, supplying elite human experts and domain-specific
              evaluation environments directly to leading artificial intelligence laboratories. Mercor reports
              penetration across top foundation model developers, positioning itself as a core provider of expert
              datasets for complex reasoning tasks. Furthermore, broader platforms such as Labelbox have expanded
              through dedicated specialist talent divisions like Alignerr, while talent marketplaces including Turing
              offer large developer pools and synthetic data generation pipelines. Overall market intelligence from
              Tracxn indicates over 240 active competitors in the data and dataset category, underscoring both
              substantial commercial demand and low barriers to entry for basic annotation services.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP010
      - number: '3.2'
        title: Capability Differentiation & Pricing Structure
        blocks:
          - type: paragraph
            body: >-
              AfterQuery differentiates its offering from traditional data vendors by focusing on procedural expert
              reasoning and multi-turn workflow execution rather than simple classification or factual
              question-answering. While legacy providers rely on broad crowd-sourced labeling, AfterQuery emphasizes
              in-house software infrastructure that orchestrates verified professionals—including physicians, corporate
              attorneys, and quantitative engineers—into simulated operating environments. Research disclosures by the
              company emphasize that standard foundational models fail up to 60 percent of realistic professional
              workflows, such as those evaluated in FinanceQA, without domain-specific behavioral grounding. The
              company's platform provides sandboxed environments using Docker containers, browser interfaces, and
              developer APIs where models learn tool sequencing, input verification, and error recovery. In contrast to
              standard seat-based software-as-a-service models, commercial monetization across the expert data industry
              is predominantly programmatic and project-based. Contract pricing is determined by domain complexity,
              expert seniority, and environment simulation requirements. While this structure yields substantial
              contract values from customers like Nvidia, Legora, and Motif Technologies, it also introduces significant
              operational delivery expense and revenue lumpiness compared to pure software licensing.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
