      - number: '6.3'
        title: Named Customer Proof and Enterprise Deployments
        blocks:
          - type: paragraph
            body: >-
              Public disclosures and independent technology journalism corroborate several high-profile customer
              relationships across both hardware systems and foundation model research. Leading semiconductor and AI
              infrastructure titan Nvidia has been confirmed as an active customer utilizing AfterQuery's reasoning data
              to support enterprise agent development. Similarly, enterprise software platform Legora and prominent
              Korean frontier foundation model laboratory Motif Technologies represent verified production deployments.
              In addition to technical clients, AfterQuery has established strategic commercial partnerships in
              financial advisory services, exemplified by ongoing engagements with The Raine Group to diagnose internal
              financial deal workflows and build firm-specific evaluation environments. Despite these prominent customer
              wins, the broader customer roster remains cloaked under strict commercial non-disclosure agreements.
              Public evidence does not yet disclose whether engagements with frontier labs represent enterprise-wide
              master services agreements or isolated, project-based capability sprints. The absence of customer-authored
              case studies with quantified return on investment metrics leaves production workflow depth and ongoing
              utilization rates as key diligence items.
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
