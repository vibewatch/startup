      - number: '5.2'
        title: Modular Architecture and Sandbox Design
        blocks:
          - type: paragraph
            body: >-
              The core product offering is organized into three complementary structural tiers: supervised fine-tuning
              (SFT) reasoning datasets, reinforcement learning (RL) execution sandboxes, and domain-specific evaluation
              benchmarks. The SFT layer delivers dense prompt-response pairs paired with explicit step-by-step reasoning
              traces that instill baseline professional standards prior to reinforcement learning. The RL tier
              constitutes AfterQuery's primary technical moat, consisting of dynamic, isolated sandboxes built atop real
              operating system interfaces, developer utilities, browsers, external APIs, and Model Context Protocol
              (MCP) servers. Rather than relying on synthetic simulations, these environments spin up fresh Docker
              containers where models execute terminal commands and compile code against live unit test harnesses,
              converting actual execution results into deterministic reward signals. Finally, the evaluation tier
              introduces proprietary benchmarks—such as FinanceQA and IDE-Bench—that diagnose model failure patterns on
              authentic enterprise tasks.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
