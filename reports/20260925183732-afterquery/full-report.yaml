              - CE010
              - CE012
      - number: '5.4'
        title: Competitive Differentiation and Technical Moats
        blocks:
          - type: paragraph
            body: >-
              AfterQuery differentiates itself from conventional data labeling platforms by rejecting commoditized
              offshore crowdsourcing in favor of an in-house, software-first approach powered by verified elite
              practitioners. While competitors often rely on labor arbitrage and generic crowd pools, AfterQuery
              constructs bespoke internal tooling to capture tacit professional judgment and complex domain reasoning
              that cannot be replicated through pure synthetic generation. However, this positioning entails notable
              strategic and technical risks. The company's customer base is heavily concentrated among frontier AI
              laboratories that possess substantial compute resources and internal post-training research teams. Should
              frontier labs internalize sandbox engineering or shift toward self-play synthetic data pipelines,
              AfterQuery must prove that human-in-the-loop expert grounding remains an irreplaceable bottleneck for
              high-stakes enterprise agent deployment.
            claimRefs:
              - CE011
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Shift from Knowledge Autocomplete to Procedural Execution
            body: >-
              AfterQuery's core technical insight is that frontier models have largely solved general text generation
              and public benchmark recall, but systematically fail at procedural judgment under ambiguity. By embedding
              live execution environments such as Docker containers and API sandboxes directly into the reinforcement
              learning loop, the platform generates verifiable reward signals based on working compilers and test
              results rather than subjective human ranking.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: Customer Co-Opetition and Post-Training Insourcing
            body: >-
              Because AfterQuery primarily serves frontier foundation model laboratories that also invest heavily in
              internal alignment and post-training data operations, the company faces inherent co-opetition risk. If key
              lab clients decide to internalize proprietary environment development or transition to commoditized
              synthetic data generators, contract renewals could experience volatility.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              AfterQuery organizes its commercial engagement model around two principal tiers: frontier artificial
              intelligence foundation model laboratories and large enterprise software organizations deploying
              domain-specific agents. At the frontier foundation model layer, buyers are specialized post-training
              teams, reinforcement learning research groups, and model evaluation units. These buyers demand dense,
              high-caliber professional reasoning traces to overcome the fundamental limits of web-scraped pre-training
              corpora. Rather than procuring generic data labeling services, frontier research buyers require bespoke
              task completion data and simulated reinforcement learning environments in complex verticals such as
              quantitative finance, software engineering, medicine, and corporate law. At the enterprise tier, buyers
              are Chief Technology Officers and product engineering heads building internal developer copilots and
              workflow automation tools. Commercial engagements within this segment focus on reducing domain-specific
              hallucination and enforcing multi-step tool invocation discipline. While enterprise interest is growing
              rapidly, enterprise buyers exhibit greater procurement friction, demanding stringent SOC 2 Type II and ISO
              27001 data compliance protections before exposing proprietary internal workflows to external expert
              evaluators.
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU014
          - type: table
