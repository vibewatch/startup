      - number: '7.4'
        title: Residual Risk Heatmap, Mitigation Maturity, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Synthesizing strategic, operational, and financial exposures reveals that frontier lab customer
              concentration and high valuation overhang present the highest residual investment risks. A reported
              valuation expansion to $3.2 billion within five months of its Series A round compresses the margin for
              operational error and demands rapid enterprise expansion beyond core foundation labs. Core thesis-break
              triggers for investors include: any major frontier lab in-sourcing post-training pipelines resulting in
              material account churn; persistent gross margin erosion driven by rising expert contractor compensation;
              or significant data security breaches that jeopardize SOC 2 compliance and enterprise data sharing
              agreements.
            claimRefs:
