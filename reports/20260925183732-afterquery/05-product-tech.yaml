callouts:
  - calloutType: "insight"
    title: "The Shift from Knowledge Autocomplete to Procedural Execution"
    body: "AfterQuery's core technical insight is that frontier models have largely solved general text generation and public benchmark recall, but systematically fail at procedural judgment under ambiguity. By embedding live execution environments such as Docker containers and API sandboxes directly into the reinforcement learning loop, the platform generates verifiable reward signals based on working compilers and test results rather than subjective human ranking."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "Customer Co-Opetition and Post-Training Insourcing"
    body: "Because AfterQuery primarily serves frontier foundation model laboratories that also invest heavily in internal alignment and post-training data operations, the company faces inherent co-opetition risk. If key lab clients decide to internalize proprietary environment development or transition to commoditized synthetic data generators, contract renewals could experience volatility."
    claimRefs:
      - "CE011"
      - "CE013"
