company:
  name: "AfterQuery"
chapter:
  number: 4
  title: "Financials"
  summary: "AfterQuery reached a reported $100 million annualized revenue run rate within fourteen months of founding by delivering high-complexity reasoning datasets and reinforcement learning environments to frontier AI labs. While rapid commercial adoption supported a $30 million Series A at a $300 million valuation in April 2026 and a reported $3.2 billion valuation in September 2026, gross margin expansion remains constrained by verified expert labor costs and heavy customer concentration among frontier labs."

sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Pricing Architecture"
    body: "AfterQuery operates a business-to-business commercial model catering primarily to post-training teams, evaluation engineers, and enterprise AI groups within frontier foundation model organizations. Rather than delivering raw web scrape data or automated labeling, the company packages complex human reasoning traces and specialized sandbox environments. According to independent industry research from Sacra, AfterQuery's revenue streams divide into four distinct product layers: bespoke reinforcement learning environments, customized supervised fine-tuning (SFT) reasoning datasets, standardized evaluation packages, and enterprise diagnostic consulting. Custom RL environments boot containerized software stacks (such as terminal sandboxes and browser interfaces) where foundation models execute tool-calling sequences against automated reward signals. Because these engagements target nuanced failure modes in fields like finance, law, and medicine, contract monetization is project-based and programmatic rather than pure seat-license software-as-a-service. Engagements are scoped around domain difficulty, required expert credentials, environment complexity, and delivered token volume, yielding high contract values with custom deliverables."
    claimRefs:
      - "CI002"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI001"

  - id: "gtm-motion-and-contract-mechanics"
    title: "Go-to-Market Motion and Contract Economics"
    body: "AfterQuery's go-to-market motion departs significantly from conventional enterprise software sales and commodity data labeling platforms. Demand generation is anchored in empirical AI research publications and public benchmark evaluation suites such as FinanceQA, IDE-Bench, and Terminal-Bench. By publishing rigorous technical studies demonstrating that leading commercial foundation models fail upward of 60% of complex, realistic professional workflow tasks, AfterQuery establishes technical credibility directly with research scientists and post-training leads at frontier AI labs. This research-led sales motion compresses procurement friction by presenting dataset acquisitions as quantifiable hill-climbing solutions to known benchmark deficiencies. Enterprise delivery is enabled by an internal roster of nearly 100,000 verified practicing professionals across software engineering, medicine, and legal practice. Crucially, AfterQuery deploys internal research personnel to pre-validate all human-curated datasets through model fine-tuning and benchmark verification before delivery. This software-first validation loop guarantees that training data falls within a strict difficulty band that frontier models can absorb without destabilizing existing reasoning capabilities."
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI008"
      - "CI014"
    tableRefs:
      - "TI002"

  - id: "workflow-conversion-and-service-delivery"
    title: "Commercial Conversion Workflow and Delivery Bridge"
    body: "The transformation of customer demand into commercial revenue and gross profit follows a multistage technical workflow. Customer engagements initiate with diagnostic failure-mode analysis, where AfterQuery and lab researchers identify specific reasoning bottlenecks in target professional domains. Once technical parameters are defined, the company matches workflow requirements to verified domain practitioners, who author structured reasoning traces and multi-step decision sequences. Sandboxed reinforcement learning environments execute automated verifiers and test suites to ensure that generated data adheres to professional standards and provides clear reward signals. Once validated, datasets and environments are delivered either as dedicated proprietary packages or incorporated into reusable evaluation benchmarks. Billing milestones trigger upon data delivery and benchmark verification, generating immediate cash flow against recognized delivery milestones. However, the direct compensation paid to highly credentialed subject-matter experts—such as practicing attorneys, financial analysts, and specialist physicians—creates a direct cost-of-goods-sold component that scales proportionally with contract scope."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI011"
    figureRefs:
      - "FI001"

  - id: "capital-adequacy-and-unit-economics"
    title: "Capital Adequacy, Unit Economics, and Diligence Verdict"
    body: "AfterQuery demonstrates exceptional headline capital efficiency, scaling from its early 2025 launch to a reported $100 million annual revenue run rate while raising just $30.5 million in total primary venture funding through its Series A. The company closed a $30 million Series A led by Altos Ventures with participation from The Raine Group, Y Combinator, and BoxGroup on April 9, 2026, at a $300 million post-money valuation. Five months later, in September 2026, reports indicated a subsequent financing round valuing the business at $3.2 billion, supported by claims from co-founder Spencer Mateega that recurring revenue had accelerated into the hundreds of millions alongside positive operating cash flow. Despite this extraordinary growth trajectory, underwriting AfterQuery requires addressing material unit-economic and structural vulnerabilities. Chief among these is cost structure: unlike crowdsourced data labeling platforms that benefit from global labor arbitrage, AfterQuery's reliance on elite domain specialists imposes substantial marginal delivery costs that constrain gross margin expansion. Furthermore, revenue remains concentrated among a handful of frontier model laboratories, creating severe dependency on lab training budgets and insourcing decisions."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI003"

