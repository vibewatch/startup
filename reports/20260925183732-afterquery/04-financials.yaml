callouts:
  - calloutType: "insight"
    title: "Consultative Scoping Obscures Underlying Expert Labor Expense"
    body: "AfterQuery's project-based contract packaging yields exceptionally large deal sizes with frontier model developers, supporting its rapid ascent to a $100 million revenue run rate. However, because each custom dataset requires verified human experts to generate professional reasoning traces, gross margins remain fundamentally tied to professional service compensation rather than pure software economics."
    claimRefs:
      - "CI005"
      - "CI008"
  - calloutType: "risk"
    title: "Concentrated Exposure to Frontier Lab In-Sourcing and Platform Shifts"
    body: "AfterQuery's commercial base is heavily concentrated among the top tier of AI foundation model builders. Should one or two key frontier labs transition to internal data curation infrastructure or shift toward hybrid synthetic validation pipelines, AfterQuery would face substantial revenue volatility that enterprise consulting channels could not immediately replace."
    claimRefs:
      - "CI011"
      - "CI012"

