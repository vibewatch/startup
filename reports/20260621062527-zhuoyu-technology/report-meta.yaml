companyProfile:
  summary: >-
    Zhuoyu Technology (ZYT) is a Shenzhen-based autonomous driving technology company that traces
    its origins to DJI's automotive project team formed in 2016. After operating as DJI Automotive
    from 2021, it was spun out as an independent entity in 2022–2023 via a Hong Kong holding
    company (New Territory Technology) and officially rebranded as ZYT in June 2024. The company
    sells the ClixPilot product suite—a scalable ADAS stack supporting 32 TOPS to 100+ TOPS
    configurations—to OEM customers including Volkswagen joint ventures, SAIC-GM-Wuling, Chery,
    FAW Group, Dongfeng, Great Wall, and BAIC. By end-2025 it had 34 customers or ecosystem
    partners, 130+ nomination collaborations, 20+ mass-produced models, and >1,800 employees. FAW
    Group became the largest single shareholder (35.80%) via a SAMR-filed stake acquisition in
    September 2025, supported by a strategic investment announcement of >RMB 3.6 billion. ZYT's
    key technical differentiation is binocular stereo vision and inertial fusion enabling low-cost
    city NOA at 32 TOPS—without lidar or HD maps—plus a scalable end-to-end platform across TI
    and Qualcomm compute environments.
  foundedDate: "2016-01-01"
  founders:
    - name: DJI (internal automotive team)
      role: Founding parent organization
      background: World's leading consumer drone manufacturer, leveraging stereo-vision and compute heritage
      claimRefs: [CO001, CO002]
  foundingLocation: Shenzhen, China
  headquarters: Nanshan District, Shenzhen, China
  productSummary: >-
    ZYT sells the ClixPilot ADAS suite covering active safety (FCW, AEB, LDW, BSD), parking
    assist, highway NOA, and city NOA without HD maps or lidar at 32 TOPS (TI TDA4VH) up to
    100 TOPS+ configurations (Qualcomm SA8650P / SA8775P), plus GenDrive generative driving and
    a vehicle-mounted drone system. Core technology includes inertial-aided stereo cameras,
    tri-stereo sensing, LiDAR-Stereo OneBOX, and a proprietary end-to-end E2E world model.
  customerFocus: >-
    OEM automakers in the RMB 100,000–300,000 vehicle price segment seeking cost-effective
    high-order ADAS without full in-house R&D—primarily Chinese domestic OEMs and foreign JVs
    (VW, SAIC-VW, FAW-VW) operating in China.
  businessModel: >-
    B2B Tier 1 supplier model: ZYT sells integrated ADAS controller hardware (domain control unit)
    plus embedded software and OTA update services to OEM customers. Revenue comes from per-unit
    hardware margin, software licensing, and aftermarket OTA feature unlocks. The company
    manufactures its own stereo camera sensors for vertical integration.
  stage: growth-stage private
  fundingStatus: >-
    Valued at ~RMB 10 billion in January 2024 per media reports. FAW Group invested >RMB 3.6
    billion (2025 official announcement) and acquired 35.80% to become the largest shareholder,
    with New Territory Technology (DJI-linked holding company) retaining 34.85%. Joint control
    structure post-deal per September 2025 SAMR filing.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO018, CO022, CO026, CO028, CO029, CO038, CO046, CE001, CU001]
summary:
  headline: >-
    ZYT is a credible, production-proven ADAS supplier with a defensible compute-efficiency
    advantage and growing OEM base, but geopolitical lineage from DJI, financial opacity, and
    intensifying cost competition make the risk/reward compelling only with additional diligence
    on standalone economics.
