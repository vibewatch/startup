    - Medium negative
    - Medium
    - Not a direct product ban today, but enough to increase discount rates and overseas onboarding friction.
  - - OEM concentration plus regulatory burden
    - Medium negative
    - Medium
    - VW and FAW are both value drivers and concentration vectors while MIIT/SAMR raise compliance cost.
