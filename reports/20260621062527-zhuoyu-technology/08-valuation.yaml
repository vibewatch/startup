- id: exit-paths-and-liquidity-considerations
  title: Exit paths exist, but the cleanest one today is strategic rather than public-market
  body: >-
    ZYT has several theoretical exit paths, but they are not equally realistic. The most plausible near-term route is deeper strategic consolidation by FAW or a FAW-led capital event, because FAW already has ownership, product overlap, and incentives to secure smart-driving capability for its own brands. That route could support a control premium if nomination conversion and production performance remain strong, though it may also cap competitive auction tension if outside buyers view the asset as politically or commercially tied up. An IPO is conceivable over a longer horizon because listed peers such as Horizon Robotics and Black Sesame prove the market accepts smart-driving stories with imperfect profitability, but ZYT would still need much better disclosure on revenue, margins, and governance to command a healthy public multiple. A pre-IPO round anchored by strategic OEMs or supply-chain partners is another possibility, especially if Europe expansion broadens the customer story. The least attractive path is simply remaining private while chasing growth without upgraded disclosure, because that would keep investors relying on stale valuation marks and proxy metrics. In other words, liquidity is possible, but the market will likely reward ZYT only after it converts nominations into transparent economics or turns FAW alignment into a more explicit strategic-buyout case.
