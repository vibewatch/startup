- id: TV005
  title: Precedent transaction anchor table
  columns:
  - Anchor event
  - Date
  - Public value signal
  - What it proves
  - Why it is not enough alone
  rows:
  - - DJI Automotive financing talk
    - 2024-01
    - ~RMB10bn valuation ask
    - Establishes a real outside-market price discussion for the asset before FAW control
    - Media-reported, negotiable, and still pre-FAW
  - - Avatr investment in Huawei Yinwang
    - 2024-08
    - CNY11.5bn for 10%, implying ~CNY115bn
    - Shows how strategic OEM capital can value a smart-driving platform at a very high premium
    - Yinwang has a much broader ecosystem and stronger brand power than ZYT
  - - FAW acquisition of 35.80%
    - 2025-09
    - Control shift confirmed by SAMR
    - Proves strategic buyer seriousness and governance change
    - Filing does not disclose cash proceeds, enterprise value, or primary-versus-secondary split
  - - Black Sesame Hong Kong listing data point
    - 2023-06 prospectus / 2024 listing path
    - Public equity route despite modest revenue and large losses
    - Shows public markets can price smart-driving assets before profitability
    - Black Sesame is a chip-centric peer, not a finished integrated ZYT analog
  notes: Precedents are used here as boundary markers rather than apples-to-apples pricing comps; each anchor informs one part of the range while leaving material gaps elsewhere.
