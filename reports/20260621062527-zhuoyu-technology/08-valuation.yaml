- id: TV004
  title: Exit path analysis
  columns:
  - Path
  - Likelihood
  - Timing
  - Key conditions
  - Precedent / implication
  rows:
  - - Deeper FAW strategic consolidation
    - Medium-high
    - 12-36 months
    - Continued Hongqi / FAW platform success, clearer value from supply security, and willingness to pay a control premium
    - Best aligned with today's ownership and commercial structure; could price strategy above pure financial multiples.
  - - Domestic IPO
    - Medium
    - 24-48 months
    - Revenue, margin, governance, and concentration disclosure must improve materially
    - Listed peers such as Horizon Robotics and Black Sesame show market appetite, but ZYT needs far cleaner reporting first.
  - - Pre-IPO strategic round
    - Medium
    - 12-24 months
    - More OEMs or supply-chain partners want exposure to China's smart-driving supply base
    - Could reset valuation above the 2024 mark without forcing full public-market scrutiny immediately.
  - - Long private hold / secondary transfers
    - Medium
    - Current to 24 months
    - Management prioritizes execution over disclosure and strategic holders remain patient
    - Preserves flexibility but leaves investors benchmarking value off proxy metrics and stale media marks.
  notes: Exit likelihood reflects the current public record, not management guidance. Strategic sale ranks highest because capital structure and customer overlap already point in that direction.
