- id: TV002
  title: ZYT valuation scenario table
  columns:
  - Scenario
  - Core assumptions
  - Implied EV
  - Probability weight
  - Commentary
  rows:
  - - Downside / stale-mark case
    - 2024 ~RMB10bn mark remains the best usable anchor; nominations convert slower; no new disclosure closes the opacity gap
    - RMB8-10bn
    - 20%
    - Appropriate if FAW support proves more strategic than financial and if mainstream price pressure compresses supplier value capture.
  - - Base / triangulated case
    - 2024 mark uplifted for 34 customers, 130+ nominations, 20+ mass-produced models, FAW co-control, and Europe option value, then discounted for opacity and DJI overhang
    - RMB10-20bn
    - 50%
    - This is the most defensible current range on public evidence because it balances real scale against missing economics.
  - - Upside / execution case
    - Nomination pipeline converts into visible revenue growth, FAW accelerates platform wins, and ZYT keeps technology credibility in the RMB100k-200k segment
    - RMB18-25bn
    - 20%
    - Achievable only if more transparent operating evidence emerges; public data today are not enough to underwrite this as the central case.
  - - Strategic-control case
    - FAW or another strategic party values ZYT for capability control, OEM alignment, and supply-chain security rather than short-term standalone multiples
    - RMB20-30bn
    - 10%
    - Possible in a buyout or tightly strategic round, but the public record does not yet show an active competitive process.
  notes: These ranges are heuristic enterprise-value bands built from disclosed marks, peer relative scale, and risk discounts; they are not a DCF because public revenue, margin, and cash data are missing.
