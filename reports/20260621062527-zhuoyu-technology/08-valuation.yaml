company:
  name: Zhuoyu Technology
chapter:
  number: 8
  title: Valuation
  summary: >-
    ZYT has one credible public valuation anchor—roughly RMB10bn in January
    2024—plus a later FAW control transaction and a >RMB3.6bn
    strategic-investment headline, but no standalone revenue or margin
    disclosure. The fairest current view is therefore triangulated rather than
    precisely priced: roughly RMB10-20bn on a base case, with upside beyond
    that requiring clearer revenue conversion, broader OEM diversification, or
    explicit strategic-control bidding.
sections:
- id: valuation-anchor-and-framework
  title: Known mark, transaction context, and valuation framework
  body: >-
    ZYT's valuation case starts with a real but incomplete anchor. In January 2024, 36Kr reported that DJI Automotive was marketing financing around a roughly RMB10bn valuation and preferred strategic investors able to bring orders and customer resources rather than passive capital. CnEVPost repeated the same framing and added that the valuation could be lower if a carmaker arrived with order leverage. That matters because the initial mark was not a software-only story; it was already being priced as a capital-intensive smart-driving supplier whose worth depended on OEM access and scale conversion. The 2025 evidence then improves the capital narrative but still does not turn it into a clean post-money datapoint. SAMR confirmed that FAW would acquire 35.80% while New Territory would retain 34.85%, creating joint control, and ZYT's own site later said it had secured strategic investment of over RMB3.6bn from FAW Group. Publicly, however, those disclosures do not break out how much value was fresh primary capital into ZYT, how much was secondary share transfer from New Territory, or how much represented broader strategic cooperation. That leaves valuation to be triangulated across three lenses: the stale-but-real 2024 precedent mark, public-company and strategic-peer comparisons, and pipeline-based revenue potential discounted for opacity.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV031
  - CV032
  - CV037
  tableRefs:
  - TV005
  figureRefs:
  - FV002
- id: comparable-company-discounting
  title: Comparable companies imply upside to the old mark but not parity with leaders
  body: >-
    The comparable set is useful mainly as a discounting exercise. Huawei's Yinwang is the obvious ceiling reference: Yicai reported Avatr paying CNY11.5bn for 10%, implying about CNY115bn equity value for a platform that spans intelligent driving, cockpit, vehicle control, cloud, lighting, and vehicle-mounted equipment, with other OEM investors also expected. ZYT does not deserve anything close to that platform premium because it lacks Huawei's ecosystem breadth, branding power, and strategic centrality. Horizon Robotics provides a second benchmark: it is already a listed domestic smart-driving player moving from chips into integrated hardware-software solutions while co-developing China-specific silicon with Volkswagen through Carizon. Mobileye represents the opposite end of the trust spectrum, with global ADAS credibility and an existing FAW relationship, but with a higher-cost, premium-oriented architecture. Momenta is the closest software-led private peer on OEM breadth, already claiming over 130 contracted models and hundreds of thousands of vehicles on road. Black Sesame and the Nullmax/DeepRoute alliances show what a smaller or more cost-aggressive peer can look like: public market access or strong commercialization narratives can coexist with modest current revenue, heavy losses, or single-chip mass-market strategies. Relative to all of them, ZYT merits credit for real production proof and customer breadth, but it still deserves sharp discounts for financial opacity, DJI geopolitical baggage, and concentration around a few OEM families.
