- id: TV006
  title: Disclosure blocker checklist
  columns:
  - Missing disclosure
  - Why valuation is impaired
  - Best public proxy today
  - Upgrade needed for tighter range
  rows:
  - - Standalone revenue
    - No sales base exists for EV / revenue-multiple calibration
    - 34 customers and 130+ nominations
    - Reported annual revenue plus growth split by hardware and software
  - - Gross margin by product line
    - Public comps cannot reveal controller, camera, software, and warranty economics
    - TI / Qualcomm stack and in-house manufacturing narrative
    - Gross margin bridge by controller, sensing, software, and support
  - - Backlog or nomination conversion
    - Nominations are not the same as committed, monetizable backlog
    - 20+ mass-produced models and visible OEM set
    - SOP cadence, cancel-rate history, and contracted backlog disclosure
  - - Cash balance and burn
    - Strategic-investment headlines do not show runway or capital efficiency
    - '>RMB3.6bn FAW headline and joint-control filing'
    - Cash, debt, capex, and burn disclosures before or during the next fundraise
  - - Customer concentration by revenue
    - VW and FAW may dominate value more than the logo wall suggests
    - Public partner list and visible JV-model concentration
    - Revenue share by top customers and pipeline concentration metrics
  notes: This table records the specific gaps preventing a tighter valuation range; none of these blockers is solved by strategic narrative alone.
