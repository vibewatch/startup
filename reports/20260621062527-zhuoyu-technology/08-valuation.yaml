tables:
- id: TV001
  title: Comparable valuation table
  columns:
  - Company
  - Listing / funding status
  - Valuation / market-cap anchor
  - Scale proxy
  - Key difference vs ZYT
  - Implied read-through for ZYT
  rows:
  - - ZYT
    - Private; FAW now largest shareholder
    - ~RMB10bn public financing mark in Jan 2024; >RMB3.6bn FAW strategic-investment headline in 2025
    - 34 customers / partners, 130+ nominations, 20+ mass-produced models, 1,800+ staff
    - Real production proof but no standalone revenue or margin disclosure
    - Supports a base range above pure early-stage startups but below transparent listed peers
  - - Huawei Yinwang
    - Private strategic platform with OEM equity investors
    - CNY11.5bn for 10% implies ~CNY115bn equity value
    - Multi-stack platform spanning driving, cockpit, controls, cloud, lighting, and vehicle-mounted equipment
    - Much broader ecosystem lock-in and brand power than ZYT
    - Ceiling reference only; ZYT should trade at a steep discount to this platform premium
  - - Momenta
    - Private full-stack supplier
    - Valuation undisclosed in retained pack; clearly unicorn-scale private peer
    - 130+ contracted models; 300,000 cars expected on road by end-May 2025
    - Stronger software breadth and map-light scale story, but no public strategic-control transaction like FAW's
    - Suggests ZYT can justify a meaningful private-tech premium if nomination conversion continues
  - - Horizon Robotics
    - HK-listed domestic smart-driving player
    - Public-market benchmark; materially larger than ZYT's last disclosed mark
    - J7 roadmap, integrated hardware-software push, VW Carizon custom-chip partnership
    - Has public-market liquidity, stronger chip leverage, and broader disclosure than ZYT
    - Implies ZYT belongs at a substantial discount despite strategic relevance
  - - Mobileye
    - NASDAQ-listed global ADAS incumbent
    - Public-market benchmark with global trust premium
    - Existing FAW production roadmap for SuperVision and Chauffeur
    - Higher-certification, global, premium-oriented architecture versus ZYT's China cost-efficiency story
    - Useful trust multiple reference, but ZYT's local cost/fit advantage should narrow part of the gap
  - - Black Sesame Technologies
    - HK-listed automotive SoC vendor
    - Listed smaller-scale China peer; prospectus disclosed revenue but heavy losses pre-IPO
    - 2022 revenue RMB165m; adjusted net loss RMB700m; 15 model intent orders and 30+ OEM / Tier-1 partners
    - More transparent financially but narrower than ZYT in integrated controller-sensor Tier-1 execution
    - Shows that public markets can value smart-driving assets before profitability, but transparency matters
  - - Nullmax / Black Sesame mainstream stack
    - Private software + chip alliance
    - No disclosed headline valuation in retained pack
    - Single-chip C1236 mass-market solution; production-ready ADAS for RMB80k-150k vehicles
    - Closer to ZYT's mass-market battlefield and explicitly cost-down oriented
    - Caps how much multiple expansion ZYT can win in the mainstream segment without better economics
