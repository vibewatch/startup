  title: BYD-style mainstream cost compression is the most immediate structural threat
  body: ZYT does not only need to outperform Huawei and Tesla on capability; it must also preserve gross-value perception while BYD, Nullmax, and DeepRoute train the market to expect lower-cost city NOA and parking bundles.
