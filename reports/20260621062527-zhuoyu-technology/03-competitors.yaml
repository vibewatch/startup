- id: TP003
  title: OEM partner overlap matrix
  columns:
  - OEM / cluster
  - ZYT status
  - Competitor alternatives chosen or likely
  - Why the overlap matters
  rows:
  - - Volkswagen China / FAW-VW / SAIC VW
    - Existing named ZYT programs and first OEM project dates back to 2019
    - Momenta counts SAIC-Volkswagen; Horizon/VW Carizon is the clearest strategic alternative
    - Volkswagen is both proof of ZYT credibility and the most exposed account to alternative-stack substitution
  - - FAW / Hongqi
    - Strategic investor, customer, and multi-model deployment route for SA8650P-based ZYT systems
    - Mobileye already has SuperVision / Chauffeur tie-up; Huawei also courts state-backed OEMs
    - FAW is where ZYT has upside from ownership alignment but also the most visible overlap risk
  - - SAIC-GM-Wuling
    - Early launch partner and production proof point for lower-compute city NOA
    - Huawei deepened Huajing cooperation in 2026; Nullmax / Black Sesame target the same affordable segment
    - Wuling validates ZYT’s mass-market thesis but is also a frontline for price competition
  - - Chery / iCar
    - Publicly listed among ZYT partners and used DJI-era low-cost NOA proof points
    - Huawei ecosystem and Momenta both court large domestic OEMs; Black Sesame also has OEM reach
    - Chery shows whether ZYT can convert early low-cost proof points into durable platform wins
  - - Dongfeng and GWM style traditional OEMs
    - Named on ZYT’s official partnership surface
    - Huawei, Horizon/ZF, and DeepRoute-style domestic stacks all compete for these industrial OEM groups
    - These accounts value integration discipline and cost, which is ZYT’s best battlefield
  - - Europe-facing OEM and exporter programs
    - ZYT is building a Germany base and pitching cost-effective stacks abroad
    - Mobileye keeps trust advantage; Huawei faces geopolitics; Tesla sets benchmark expectations
    - Internationalization can widen ZYT’s market, but it also raises scrutiny and certification demands
  notes: This is not an exhaustive customer list; it highlights the OEM clusters where retained sources show both a ZYT foothold and at least one plausible competitor alternative.
