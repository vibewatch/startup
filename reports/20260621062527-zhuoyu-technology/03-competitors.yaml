- id: zyt-positioning-vs-rivals
  title: Where ZYT is strongest relative to peers
  body: 'ZYT''s public evidence points to a narrower but credible positioning wedge. Unlike premium-centric stacks that assume large sensor bills and 500-plus TOPS from the start, ZYT advertises city and highway navigation on 32 TOPS and scales upward into 100 TOPS and 1500-plus controller configurations, with deployment across TI mid-compute and Qualcomm high-compute platforms. That matters because the fastest-growing installation band in China is not the ultra-premium segment but the RMB100k-200k band where OEMs want visible capability gains without open-ended compute inflation. ZYT also keeps more sensor optionality than pure-vision narratives imply: its stereo, stereo-plus-tele, and lidar-stereo products let an OEM trade cost, redundancy, and perception density by platform. Compared with Momenta or Mobileye, ZYT looks less global and less famous, but compared with chip-led challengers it looks more like an integrated Tier 1 with controller, sensor, calibration, and manufacturing depth
    already proven on Volkswagen, Wuling, Hongqi, and other traditional-OEM programs.'
