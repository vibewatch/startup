- id: advantages-vulnerabilities-and-overlap
  title: Advantages, vulnerabilities, and OEM overlap
  body: 'ZYT''s clearest advantages are compute efficiency, platform flexibility, and fit with legacy or joint-venture OEMs that need China-specific intelligent-driving upgrades without surrendering the whole vehicle narrative to one super-brand. Its public customer base already spans Volkswagen-related programs, SAIC-GM-Wuling, Chery, FAW, Dongfeng, and Great Wall, so the company has breadth across exactly the customer pool that Huawei, Horizon, Mobileye, and Momenta are also trying to influence. But ZYT also has real vulnerabilities. Huawei can sell brand uplift and a broader digital ecosystem that ZYT cannot match. Tesla still owns the highest consumer mindshare for end-to-end autonomy even though China approval remains constrained. And mainstream-market challengers such as DeepRoute, Nullmax, and Black Sesame are converging on the same value proposition ZYT wants to defend: good-enough city and highway NOA on domestic chips, fewer sensors, and production-ready pricing. In other words,
    ZYT''s strengths are tangible, but they are easiest to monetize only if it keeps winning the traditional OEM overlap matrix faster than the market commoditizes around it.'
