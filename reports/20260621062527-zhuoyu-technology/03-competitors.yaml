- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - Moat claim or threat
  - Mechanism
  - Primary rival(s)
  - Severity
  - ZYT mitigation / evidence today
  rows:
  - - Efficient compute is a moat
    - Lower TOPS entry points can broaden OEM fit and cut BOM
    - BYD, Nullmax, DeepRoute
    - high
    - Works if ZYT keeps feature quality ahead of cheaper imitators
  - - Stereo-derived dense 3D perception differentiates ZYT
    - Offers a path between pure vision and lidar-heavy stacks
    - Tesla, Huawei
    - medium
    - Useful for OEMs wanting redundancy without full premium lidar cost
  - - Traditional-OEM relationships are an asset
    - Legacy OEMs need China-specific upgrades and supplier discipline
    - Momenta, Horizon, Mobileye, Huawei
    - high
    - ZYT already names VW, Wuling, FAW, Chery, Dongfeng, and GWM on its public surface
  - - Huawei ecosystem lock-in can erase feature-level wins
    - Driving, cockpit, cloud, and vehicle control are sold together
    - Huawei / Yinwang
    - critical
    - ZYT needs openness and lower complexity to remain the alternative
  - - BYD-led cost compression can commoditize mainstream NOA
    - Huge in-house scale resets reference pricing for hardware and software
    - BYD, Nullmax, DeepRoute
    - critical
    - ZYT must keep “value for price paid” improving faster than BOM deflation
  - - Tesla benchmark pressure can raise expectation ceilings
    - Consumer mindshare can make OEMs ask every supplier for Tesla-like trajectories
    - Tesla
    - medium
    - So far China status remains supervised and approval-sensitive, buying ZYT some time
  - - DJI heritage can complicate overseas trust narratives
    - Policy scrutiny around Chinese tech supply chains can spill into diligence
    - Mobileye / Bosch benefit indirectly
    - medium
    - Germany localization and automotive certifications help, but the issue does not disappear
  notes: Severity is an analytic judgment based on the evidence pack rather than a disclosed company metric. The table separates execution moats from structural market threats so durability is not confused with today’s feature list.
