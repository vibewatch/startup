  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor-matrix-coverage
    missingEvidence: A complete public roster of every active third-party China urban-NOA supplier, together with program counts and production attach rates by OEM, is not available in the retained pack.
    whyItMatters: Without a full roster, the competitor matrix captures the most important rivals but cannot prove that no smaller entrant is gaining faster share in a narrow segment.
    diligencePath: Request sell-side or OEM procurement mapping that lists active supplier awards by program and attach rate, then expand TP001 into an exhaustive competitive ledger.
    relatedQuestionRefs:
    - QP001
    - QP024
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: supplier-pricing-and-win-rate
    missingEvidence: Exact supplier ASPs, software take-rates, gross margins, and head-to-head win rates for ZYT versus Huawei, Momenta, and Horizon are not public.
    whyItMatters: Those data would determine whether ZYT's compute-efficiency story actually converts into durable economics rather than just technical relevance.
    diligencePath: Ask management for program-level pricing bands, BOM delta by configuration, and recent lost-bid or won-bid examples against named rivals.
