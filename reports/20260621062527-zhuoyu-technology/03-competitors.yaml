tables:
- id: TP001
  title: Competitor comparison matrix
  columns:
  - Competitor
  - Backers / status
  - Chip strategy
  - Sensor approach
  - Key OEM customers
  - Compute range / platform
  - City NOA status
  - ZYT competitive position
  rows:
  - - Huawei / Yinwang (Qiankun)
    - Huawei-controlled open platform; Avatr and Seres each buying 10% stakes
    - Full-stack proprietary ecosystem plus partner capital
    - Lidar-rich premium stack plus broader cockpit / cloud / vehicle-control integration
    - Avatr, Seres, SAIC-GM-Wuling Huajing, wider traditional OEM ecosystem
    - Premium full-stack platform; public pack does not disclose single comparable TOPS number
    - Commercial and expanding; Wuling Huajing S standard with ADS Pro and OTA path to ADS 5 Pro
    - Strongest lock-in rival; ZYT can only win where OEMs prioritize flexibility and lower system complexity
  - - Momenta
    - Independent full-stack supplier with broad OEM contract base
    - Software-led stack that works across partner hardware
    - Mapless / end-to-end emphasis after reducing reliance on expensive HD maps
    - GM, SAIC-Volkswagen, Toyota, Honda; broader 130-model contract base
    - Partner-platform dependent; not disclosed as one fixed public compute tier in retained pack
    - Commercial on highway and urban navigation, with full-scenario assisted-driving roadmap
    - Most comparable broad software rival; ZYT competes via Tier-1 integration and lower-compute storytelling
  - - Horizon Robotics
    - HK-listed domestic chip and stack player
    - Journey family plus move into integrated chip+software and custom VW SoC
    - Open to multiple OEM algorithms; chip-centric architecture with partner stacks
    - VW Carizon, ZF-linked China programs, Firefly and wider OEM set
    - J6P at 560 TOPS, Carizon custom chip target 500-700 TOPS, future J7 beyond Thor-X
    - Urban NOA capable through partner systems and 2026 production plans
    - Hard rival on domestic chip economics; ZYT offsets with finished controller-plus-sensor execution
  - - DeepRoute.ai
    - Software-led autonomous-driving company tied to Black Sesame alliance
    - Integrated chip-plus-software with Black Sesame next-gen platforms
    - Vision-heavy urban NOA and fleet-learning orientation
    - Multiple automakers, more than a dozen launched models
    - Partner-chip based; not one public fixed TOPS figure in retained pack
    - 200,000 urban NOA vehicles delivered and nearly 40% third-party share in Oct 2025
    - Closest threat to ZYT in cost-optimized mainstream city NOA for mass models
  - - Nullmax
    - Full-stack ADAS software company with new OEM wins
    - Single-chip C1236 mass-market solution with Black Sesame; scalable across compute tiers
    - Vision-focused mainstream ADAS with city-memory, highway navigation, memory parking
    - Leading Chinese OEM project win; broader mass-production portfolio
    - Single Black Sesame Wudang C1236 for core mainstream solution
    - Mainstream production push rather than premium halo positioning
    - Very close rival in RMB80k-150k segment where ZYT must defend value-for-money
  - - Black Sesame Technologies
    - Domestic automotive SoC vendor; HK-listed in 2024 per EqualOcean summary
    - Huashan and Wudang chip families, expanding into chip-based solutions
    - Provides compute base for partner software rather than consumer-facing full stack alone
    - 30+ OEM / Tier-1 partners; DeepRoute and Nullmax alliances
    - A2000 next-gen chip, C1236 cross-domain chip, broader Huashan line
    - Indirect via partners rather than standalone NOA brand
    - More enabler than direct head-to-head brand rival, but it lowers entry barriers for ZYT challengers
  - - Mobileye
    - Global listed ADAS incumbent with premium OEM credibility
    - SuperVision and Chauffeur platform stack with richer sensor set
    - Mature camera + radar + lidar-forward premium architecture
    - FAW Hongqi and global OEM base
    - Platform-level; public retained pack does not state a single comparable TOPS number
    - Mass production in FAW from 2024/2025 timetable
    - Stronger certification and trust than ZYT, but cost and complexity skew toward premium programs
  - - Tesla FSD China
    - OEM in-house benchmark and consumer mindshare leader
    - Tesla proprietary end-to-end stack
    - Pure-vision supervised driving stack
    - Tesla only, but benchmark pressure reaches all suppliers
    - Not disclosed in retained pack for China comparison table
    - Launched as FSD (Supervised) in China in 2026, still Level 2 and approval-sensitive
    - Not a direct OEM supplier rival, but the aspirational benchmark that can reset buyer expectations
  notes: 'Coverage is partial rather than exhaustive: this matrix focuses on the most relevant rivals for ZYT’s traditional-OEM and mass-market ADAS bids as evidenced in the retained 2025-2026 source pack. Where a single public compute figure is unavailable, the cell is described qualitatively rather than guessed.'
  enumerationScope:
    coverage: partial
    basis: Rows were limited to the eight competitor classes most repeatedly evidenced across the retained 2025-2026 official, news, and market-data pack for ZYT’s OEM bid set and disruptive threat list.
