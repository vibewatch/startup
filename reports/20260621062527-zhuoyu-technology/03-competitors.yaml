chapter:
  number: 3
  title: Competitors
  summary: Zhuoyu Technology competes in a crowded but still fragmenting China ADAS field where Huawei/Yinwang owns the strongest ecosystem lock-in, Momenta and Horizon are broadening OEM reach, and DeepRoute/Nullmax/Black Sesame push lower-cost mainstream NOA stacks. ZYT's best relative position is as a flexible Tier-1-style supplier for traditional OEMs that want map-light city NOA, stereo-derived perception, and chip flexibility across TI and Qualcomm rather than a single closed stack. The biggest risks are BYD-led price compression, Huawei brand pull, and Tesla's still-uncertain China FSD rollout if it moves from supervised novelty to broad local acceptance.
sections:
- id: competitive-landscape
  title: Competitive landscape by rival class
  body: The most useful way to map ZYT's rival set is by control point rather than by headline valuation. Huawei/Yinwang sits at the ecosystem end of the market, combining intelligent driving, cockpit, vehicle control, cloud services, and investor-backed OEM alignment that can lock customers into a broader product architecture. Momenta and Mobileye are the most established software-led full-stack alternatives for large OEM programs, while Horizon Robotics and Black Sesame represent the chip-plus-stack route that helps carmakers localize compute economics and keep more architectural control. DeepRoute.ai and Nullmax are the sharpest mainstream-price challengers because both are pairing end-to-end or vision-heavy software with domestic chips and production-minded partners. ZYT therefore is not fighting one single rival; it is competing for the same OEM budgets against ecosystem vendors, chip coalitions, global incumbents, and OEM self-build efforts that are all chasing the same transition
    from basic ADAS into city NOA and parking-rich L2+ systems.
