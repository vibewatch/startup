- id: disruptive-threats-and-durability
  title: Disruptive threats and moat durability
  body: 'The disruptive threat list is short but serious. First, BYD''s ultra-low-cost God''s Eye strategy changes the pricing umbrella for everybody, because once mainstream vehicles normalize assisted-driving hardware at roughly RMB4,500 and deploy it at huge scale, external suppliers lose room to price premium hardware bundles. Second, Huawei''s Qiankun/Yinwang system raises switching costs not only through ADAS performance but through cloud, cockpit, and joint go-to-market integration, which can make a supplier change feel like a platform reset. Third, Tesla''s China FSD rollout still sits in a supervised and partly ambiguous regulatory state, but if Tesla turns that beachhead into broader consumer trust and better localization, software suppliers will face renewed pressure from an aspirational benchmark. Finally, ZYT carries a subtler vulnerability from its DJI heritage: while that heritage helped build stereo-vision and hardware-execution credibility, it can also invite overseas policy
    scrutiny around Chinese technology supply chains. ZYT therefore still has a defendable niche, but its moat is executional rather than absolute.'
