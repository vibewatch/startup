  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Known mark, transaction context, and valuation framework
        blocks:
          - type: paragraph
            body: >-
              ZYT's valuation case starts with a real but incomplete anchor. In January 2024, 36Kr reported that DJI
              Automotive was marketing financing around a roughly RMB10bn valuation and preferred strategic investors
              able to bring orders and customer resources rather than passive capital. CnEVPost repeated the same
              framing and added that the valuation could be lower if a carmaker arrived with order leverage. That
              matters because the initial mark was not a software-only story; it was already being priced as a
              capital-intensive smart-driving supplier whose worth depended on OEM access and scale conversion. The 2025
              evidence then improves the capital narrative but still does not turn it into a clean post-money datapoint.
              SAMR confirmed that FAW would acquire 35.80% while New Territory would retain 34.85%, creating joint
              control, and ZYT's own site later said it had secured strategic investment of over RMB3.6bn from FAW
              Group. Publicly, however, those disclosures do not break out how much value was fresh primary capital into
              ZYT, how much was secondary share transfer from New Territory, or how much represented broader strategic
              cooperation. That leaves valuation to be triangulated across three lenses: the stale-but-real 2024
              precedent mark, public-company and strategic-peer comparisons, and pipeline-based revenue potential
              discounted for opacity.
            claimRefs:
              - CV001
              - CV002
              - CV003
