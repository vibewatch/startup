            body: >-
              Public sources consistently describe ZYT as a business-to-business intelligent-driving supplier selling
              hardware, software, and integrated systems to OEMs rather than a consumer subscription platform. The
              earliest CnEVPost launch coverage said DJI Automotive would provide hardware solutions, software
              solutions, and packaged hard-software solutions; the current solution and technology pages show the same
              logic in more mature form through ADAS controllers, stereo and tri-camera perception, lidar-stereo onebox
              products, city and highway navigation features, parking stacks, HMI software, and OTA capability. Revenue
              therefore should come from program awards, controller and sensor shipments, software-enablement content,
              and engineering integration embedded in OEM launches. Visibility is better than for a greenfield start-up
              because ZYT now discloses 34 customers and ecosystem partners, more than 130 model nominations, and over
              20 mass-produced models in customer programs. Even so, nomination count is only a pipeline proxy. It does
              not reveal take rate, bill-of-material content, software attach, launch cadence, or how many nominations
              sit on low-volume trims. Financially, nominations reduce existential demand risk, but they do not
