  productSummary: >-
    ZYT sells the ClixPilot ADAS suite covering active safety (FCW, AEB, LDW, BSD), parking assist, highway NOA, and
    city NOA without HD maps or lidar at 32 TOPS (TI TDA4VH) up to 100 TOPS+ configurations (Qualcomm SA8650P /
    SA8775P), plus GenDrive generative driving and a vehicle-mounted drone system. Core technology includes
    inertial-aided stereo cameras, tri-stereo sensing, LiDAR-Stereo OneBOX, and a proprietary end-to-end E2E world
    model.
  customerFocus: >-
    OEM automakers in the RMB 100,000–300,000 vehicle price segment seeking cost-effective high-order ADAS without full
    in-house R&D—primarily Chinese domestic OEMs and foreign JVs (VW, SAIC-VW, FAW-VW) operating in China.
  businessModel: >-
    B2B Tier 1 supplier model: ZYT sells integrated ADAS controller hardware (domain control unit) plus embedded
    software and OTA update services to OEM customers. Revenue comes from per-unit hardware margin, software licensing,
    and aftermarket OTA feature unlocks. The company manufactures its own stereo camera sensors for vertical
    integration.
  stage: growth-stage private
  fundingStatus: >-
    Valued at ~RMB 10 billion in January 2024 per media reports. FAW Group invested >RMB 3.6 billion (2025 official
    announcement) and acquired 35.80% to become the largest shareholder, with New Territory Technology (DJI-linked
    holding company) retaining 34.85%. Joint control structure post-deal per September 2025 SAMR filing.
