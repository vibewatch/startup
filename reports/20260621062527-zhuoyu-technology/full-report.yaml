      - number: '1.5'
        title: Milestones, certifications, Europe push, and preserved risk context
        blocks:
          - type: paragraph
            body: >-
              ZYT's chronology shows a company that spent years de-risking automotive-grade execution before telling a
              broader global story. The official milestone page records the 2018 Shenzhen road-test permit, the 2019
              first automotive-grade factory and first Volkswagen Group China OEM project, 2021 laboratory and
              functional-safety certifications, 2022 first ADAS SOP, and 2023 shift to independent operations under the
              Shenzhen Zhuoyu entity while launching ClixPilot. By 2025, the company was presenting end-to-end city NOA
              across multiple platforms, GenDrive, an in-vehicle drone system, and a European strategy anchored by a
              Braunschweig subsidiary and IAA Mobility debut. The certification record is also unusually extensive for a
              private supplier, spanning TISAX, A-SPICE, ISO 9001, 14001, 45001, 27001, ISO 26262 ASIL-D process, IATF
              16949, ISO 21448 SOTIF, and ASIL-C product certification. The risks worth preserving are different from
              pure technical immaturity. First, ZYT remains financially opaque because no standalone public financial
              statements were found. Second, the company inherits adjacency risk from DJI, whose parent entity remains
              exposed to U.S. policy actions even though DJI's own court statement stresses that the court found no
              government control or direct military ties. Third, OEM and capital concentration may become material if
              Volkswagen-linked programs and FAW governance influence dominate commercial outcomes.
