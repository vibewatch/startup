      - number: '4.3'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              ZYT looks operationally heavier than a pure software ADAS vendor. Official materials say the company had
              more than 1,800 employees by the end of 2025, including more than 1,000 R&D personnel and more than 500
              intelligent-manufacturing and quality engineers, while its timeline points back to a 2019 automotive-grade
              factory. Sina/Jiemian adds that ZYT also has its own hardware factory and calibration system, an uncommon
              capability set outside very large Tier 1 peers. That combination supports a plausible long-term cost
              advantage in stereo-camera production, calibration, and system integration, but it also implies a
              fixed-cost base that needs volume to absorb. The hardware bill should vary materially by stack:
              Sina/Jiemian describes a TI TDA4VH mid-compute path, while higher-compute solutions use Qualcomm SA8650P
              and can extend into richer 10V or lidar-stereo configurations. 36Kr separately argued that DJI’s
              historical TI relationship could support the lowest chip pricing in the market. The likely economic
              picture is therefore mid-teens hardware margin pressure offset by better platform reuse, lower compute
              cost on mass-market trims, and some software-like retention through OTA improvements. Public sources still
              do not disclose ZYT’s realized ASP, attach rate, warranty reserve, or gross margin, so unit economics
              remain a proxy exercise rather than an audited conclusion.
