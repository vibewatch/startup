  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital structure, strategic investors, and valuation marks
        blocks:
          - type: paragraph
            body: >-
              The capital picture is unusually important because ZYT does not publish standalone revenue, margin, or
              cash figures. The best public valuation anchor remains the January 2024 reporting from 36Kr, later
              repeated by CnEVPost, that DJI Automotive was seeking financing around a roughly RMB10bn valuation and
              preferred strategic investors that could add orders rather than passive money. That framing matters
              because the company was not presenting itself as a software-only start-up chasing vanity marks; it was
              positioning itself as a capital-intensive Tier-1-style supplier whose value rises with OEM access and
              production nominations. The formal 2025 FAW transaction then turned that strategic-intent story into a
              governance event: CnEVPost, citing the SAMR filing, reported that New Territory moved from sole control at
              70.65% to joint control with FAW holding 35.80% and New Territory 34.85%. Official ZYT materials
              separately claim a strategic investment from FAW of more than RMB3.6bn. Taken together, the public record
              supports a stronger balance-sheet thesis than ZYT had in early 2024, but it still leaves ambiguity about
              how much of the announced value was immediate cash, how much reflected strategic commitments, and whether
              any secondary share transfer diluted operating cash proceeds to the business.
