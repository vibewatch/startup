      - number: '1.2'
        title: Product scope, technical stack, and scale signals
        blocks:
          - type: paragraph
            body: >-
              The official product pages show a company trying to cover a full ADAS stack instead of only one module.
              ClixPilot is positioned as the core smart-driving suite, with functions spanning active safety, parking,
              highway NOA, city NOA, and cockpit-driving integration. The solution and technology pages also disclose
              the architecture logic behind that positioning: ZYT supports stereo-vision-first configurations, optional
              LiDAR fusion, controller configurations starting at 32 TOPS and extending to higher-compute platforms, and
              a broader computing roadmap stretching to 1,500+ TOPS for higher-end systems. This is consistent with
              third-party reporting that Chengxing Platform, the predecessor naming used before ClixPilot, emphasized
              binocular vision and cost-effective deployment rather than mandatory lidar. Scale signals are strong but
              still mostly company-reported. ZYT says it had more than 1,800 employees by end-2025, including more than
              1,000 core R&D staff and more than 500 engineering and manufacturing personnel, alongside 34 customers or
              ecosystem partners and over 130 nominated models. Independent articles corroborate earlier waypoints of
              700-plus staff in April 2021 and nearly 1,000 by December 2021, which makes the later headcount claim
              directionally credible even though no payroll or revenue disclosure is public.
