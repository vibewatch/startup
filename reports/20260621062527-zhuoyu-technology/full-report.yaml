      - number: '8.2'
        title: Comparable companies imply upside to the old mark but not parity with leaders
        blocks:
          - type: paragraph
            body: >-
              The comparable set is useful mainly as a discounting exercise. Huawei's Yinwang is the obvious ceiling
              reference: Yicai reported Avatr paying CNY11.5bn for 10%, implying about CNY115bn equity value for a
              platform that spans intelligent driving, cockpit, vehicle control, cloud, lighting, and vehicle-mounted
              equipment, with other OEM investors also expected. ZYT does not deserve anything close to that platform
              premium because it lacks Huawei's ecosystem breadth, branding power, and strategic centrality. Horizon
              Robotics provides a second benchmark: it is already a listed domestic smart-driving player moving from
              chips into integrated hardware-software solutions while co-developing China-specific silicon with
              Volkswagen through Carizon. Mobileye represents the opposite end of the trust spectrum, with global ADAS
              credibility and an existing FAW relationship, but with a higher-cost, premium-oriented architecture.
              Momenta is the closest software-led private peer on OEM breadth, already claiming over 130 contracted
              models and hundreds of thousands of vehicles on road. Black Sesame and the Nullmax/DeepRoute alliances
              show what a smaller or more cost-aggressive peer can look like: public market access or strong
              commercialization narratives can coexist with modest current revenue, heavy losses, or single-chip
              mass-market strategies. Relative to all of them, ZYT merits credit for real production proof and customer
              breadth, but it still deserves sharp discounts for financial opacity, DJI geopolitical baggage, and
              concentration around a few OEM families.
