        - Official site, Sina Jiemian, and ZOL coverage show 32 TOPS, 100 TOPS, and 1500+ controller range
        - ZYT can bid down-market without abandoning upper-mid programs
      - - Sensor strategy
        - Stereo-first, stereo-plus-tele, and lidar-stereo options keep redundancy choices open
        - Tesla on pure vision simplicity; Huawei on lidar-rich premium redundancy
        - ZYT technology and solution pages emphasize dense 3D point clouds and configurable sensors
        - ZYT can tailor BOM by platform instead of forcing one sensor doctrine
      - - OEM breadth
        - Strong in traditional OEM and JV channels but still narrower than Huawei and Momenta
        - Huawei and Momenta
        - >-
          ZYT lists VW, Wuling, Chery, FAW, Dongfeng, GWM; Momenta touts 130 models; Huawei deepens Wuling plus partner
          capital network
        - Breadth is good enough to matter, but not yet enough to create category leadership
      - - Brand pull
        - Known inside the industry but weaker to end-consumers than Huawei and Tesla
        - Huawei / Tesla
        - Sina explicitly says ZYT lacks Huawei’s brand advantage while Tesla remains the reference name for FSD
        - OEMs may still use rival branding to sell smart-driving upgrades
      - - Platform openness
        - Supports multiple chips, sensors, ICE and EV, and future cockpit-driving fusion
        - Horizon on chip ecosystem; Huawei on end-to-end stack ownership
        - Official and Sina/ZOL materials show TI, SA8650P, SA8775P, and multiple hardware configurations
        - This openness is valuable where OEMs want reuse across trims and vehicle lines
