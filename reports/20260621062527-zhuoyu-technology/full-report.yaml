      - number: '2.3'
        title: Regulatory tailwinds and headwinds for market access
        blocks:
          - type: paragraph
            body: >-
              Regulation is no longer a background variable in China's smart-driving market; it is now part of market
              access itself. The decisive step was the February 28, 2025 MIIT and SAMR notice and related technical
              guidelines on intelligent connected vehicle product access, recall, and OTA management. The retained
              regulatory, TUV, CnEVPost, and APA materials converge on three practical consequences: safety-affecting
              OTA changes are treated as recalls, companies must validate and document updates before release, and
              marketing must not blur driver assistance into self-driving or imply unsupported capabilities. Electrive's
              April 2025 report adds that beta-style rollout practices and careless terminology were becoming policy
              targets after a fatal accident. For ZYT, this is both a headwind and a selective tailwind. It increases
              approval, documentation, and post-launch liability costs for every supplier trying to scale NOA or parking
              features. At the same time, it favors vendors that can show automotive-grade controllers,
              functional-safety process discipline, and OEM-ready validation rather than consumer-style feature hype. In
              other words, the rules may slow the market's most aggressive claims, but they also raise the barrier
              against undisciplined low-quality entrants.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
