    sections:
      - number: '1.1'
        title: Identity, origin, and operating model
        blocks:
          - type: paragraph
            body: >-
              ZYT's current public identity is clearer than its early corporate history. The company's own
              English-language About, Solution, and Technology pages identify the business as Shenzhen Zhuoyu Technology
              Co., Ltd. (ZYT), headquartered in Nanshan District, Shenzhen, with the mission "Safe and Effortless
              Mobility for All." Those same pages describe a supplier that sells ClixPilot branded ADAS systems,
              associated controllers and sensors, and adjacent features such as vehicle-mounted drone systems rather
              than consumer vehicles. Independent reporting fills in the transition story: the operation began as DJI's
              automotive project team in 2016, was publicly presented as DJI Automotive at Auto Shanghai 2021, started
              operating as Shenzhen Zhuoyu Technology Co., Ltd. in 2023, and formally adopted the Zhuoyu brand on June
              21, 2024. The safest framing for later chapters is therefore not "startup founded from scratch in 2023,"
              but a DJI-incubated automotive stack that became a separately branded Tier 1 smart-driving supplier with a
              formal legal and brand separation path over 2022 to 2024.
