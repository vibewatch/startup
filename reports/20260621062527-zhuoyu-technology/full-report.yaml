companyProfile:
  summary: >-
    Zhuoyu Technology (ZYT) is a Shenzhen-based autonomous driving technology company that traces its origins to DJI's
    automotive project team formed in 2016. After operating as DJI Automotive from 2021, it was spun out as an
    independent entity in 2022–2023 via a Hong Kong holding company (New Territory Technology) and officially rebranded
    as ZYT in June 2024. The company sells the ClixPilot product suite—a scalable ADAS stack supporting 32 TOPS to 100+
    TOPS configurations—to OEM customers including Volkswagen joint ventures, SAIC-GM-Wuling, Chery, FAW Group,
    Dongfeng, Great Wall, and BAIC. By end-2025 it had 34 customers or ecosystem partners, 130+ nomination
    collaborations, 20+ mass-produced models, and >1,800 employees. FAW Group became the largest single shareholder
    (35.80%) via a SAMR-filed stake acquisition in September 2025, supported by a strategic investment announcement of
    >RMB 3.6 billion. ZYT's key technical differentiation is binocular stereo vision and inertial fusion enabling
    low-cost city NOA at 32 TOPS—without lidar or HD maps—plus a scalable end-to-end platform across TI and Qualcomm
    compute environments.
  foundedDate: '2016-01-01'
  founders:
    - name: DJI (internal automotive team)
      role: Founding parent organization
      background: World's leading consumer drone manufacturer, leveraging stereo-vision and compute heritage
