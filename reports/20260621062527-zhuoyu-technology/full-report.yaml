      - number: '6.4'
        title: Adverse signals, self-development risk, and the remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main adverse customer signal is BYD. In April 2023, local-media reporting carried by CnEVPost said DJI
              Automotive would supply BYD’s Sea Lion with a city-NOA solution, which would have made BYD a major
              validation point for ZYT’s mass-market thesis. But later public reporting did not convert that headline
              into a confirmed SOP relationship. By January 2024, the company was being discussed with BYD as an
              investor-intent party, while the cited live deployments were still Wuling and Chery. That does not
              conclusively prove a break, yet it does show why nomination headlines should not be underwritten like
              durable customer revenue. More broadly, the public set does not disclose revenue by OEM, contract term,
              renewal rates, or take rates. Even the best-evidenced customers remain automotive accounts with
              substantial bargaining power and credible self-development options. The customer story is therefore
              investable only if diligence can confirm that VW, SGMW, and FAW/Hongqi are translating visible model proof
              into recurring platform share rather than one-cycle launches.
