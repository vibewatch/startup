      - number: '6.2'
        title: Mass-production evidence, nomination funnel, and customer economics
        blocks:
          - type: paragraph
            body: >-
              The public customer story is best understood as a funnel from partner logos to nominations to SOP models.
              Official materials say ZYT has more than 130 nominations, while the homepage claims mass production across
              50-plus vehicle models and a later CnEVPost article narrows the currently evidenced base to more than 20
              mass-produced models with named current clients. Those statements are directionally consistent: not every
              nomination becomes revenue, and only a subset is visible in named public programs. Economically, the
              business looks like a classic automotive land-expand model. Winning a nomination is necessary but not
              sufficient; the real switching-cost step comes after validation, calibration, integration, and safety
              sign-off on a specific vehicle platform. That is why Volkswagen, SGMW, and FAW/Hongqi deserve more weight
              than one-off headlines. It also explains why OEM bargaining power still remains high. Large automakers can
              self-develop, dual-source, or use volume leverage in negotiations, so ZYT’s pricing power is probably
              program-specific rather than ecosystem-wide. Public evidence also suggests non-exclusivity is the default,
              meaning ZYT must keep earning each new platform rather than relying on permanent OEM lock-in.
