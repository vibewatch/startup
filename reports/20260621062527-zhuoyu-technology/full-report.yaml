      - number: '8.3'
        title: Reasonable valuation range today is wide because scale signals are strong but economics are hidden
        blocks:
          - type: paragraph
            body: >-
              The central analytical question is how far above the January 2024 mark ZYT should trade before audited
              economics appear. The bullish case is easy to understand: official materials now show 34 customers and
              ecosystem partners, more than 130 nomination collaborations, more than 20 mass-produced models, a team
              exceeding 1,800 people, and ongoing Europe buildout. Those facts support the view that ZYT is not a
              concept-stage ADAS start-up; it is already operating like a scaled Tier-1-style smart-driving supplier
              with meaningful program depth. The discount case is just as important. Public sources still do not
              disclose standalone revenue, gross margin, cash balance, backlog, or customer concentration by revenue, so
              investors cannot test whether nominations convert into healthy cash generation. The market backdrop is
              also harsher than in 2024: XEPS shows L2+ penetration and highway NOA are scaling fast in the RMB100k-200k
              band, but Sina/Jiemian says BYD has pushed high-order smart-driving hardware cost down to about RMB4,500,
              while Nullmax and Black Sesame are targeting mainstream vehicles with single-chip solutions. Add
              DJI-linked geopolitical scrutiny, stricter OTA and ADAS regulation, and visible Volkswagen/FAW
              concentration, and the right conclusion is a wide but disciplined range. On today's public evidence,
              roughly RMB10-20bn is defensible, about RMB8-10bn is a credible downside if conversion disappoints, and
              values above roughly RMB20bn require new proof rather than narrative alone.
