  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape by rival class
        blocks:
          - type: paragraph
            body: >-
              The most useful way to map ZYT's rival set is by control point rather than by headline valuation.
              Huawei/Yinwang sits at the ecosystem end of the market, combining intelligent driving, cockpit, vehicle
              control, cloud services, and investor-backed OEM alignment that can lock customers into a broader product
              architecture. Momenta and Mobileye are the most established software-led full-stack alternatives for large
              OEM programs, while Horizon Robotics and Black Sesame represent the chip-plus-stack route that helps
              carmakers localize compute economics and keep more architectural control. DeepRoute.ai and Nullmax are the
              sharpest mainstream-price challengers because both are pairing end-to-end or vision-heavy software with
              domestic chips and production-minded partners. ZYT therefore is not fighting one single rival; it is
              competing for the same OEM budgets against ecosystem vendors, chip coalitions, global incumbents, and OEM
              self-build efforts that are all chasing the same transition from basic ADAS into city NOA and parking-rich
              L2+ systems.
