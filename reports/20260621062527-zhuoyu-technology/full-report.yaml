  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing logic
        blocks:
          - type: paragraph
            body: >-
              ZYT should be underwritten against the automotive supplier market for production ADAS and
              intelligent-driving systems, not the entire autonomy or robotaxi universe. Its public solution and
              technology pages place the company inside the spend bucket for active safety, parking, highway NOA, city
              NOA, domain controllers, perception sensors, validation, and software deployment across both EV and ICE
              passenger vehicles. That boundary matters because the Chinese market is already large enough on a unit
              basis without assuming L4 robotaxi economics. XEPS says L2+ penetration in China passenger vehicles
              reached 56.1% in H1 2025, L2++ reached 17%, and ADAS camera installations reached 44.668 million units at
              4.2 cameras per vehicle, which implies roughly 10.6 million passenger vehicles in just the first half
              already carried meaningful ADAS content. The best-supported China TAM therefore sits in mass-produced
              passenger vehicles with multi-sensor ADAS and navigation functions rather than in rare robotaxi fleets.
              Global TAM is directionally larger because ZYT is already localizing for Europe and positioning L2-L4
              capable products, but the retained source pack does not provide a clean global revenue total for ZYT's
              exact category, so the chapter preserves global sizing as a bounded diligence gap rather than fabricating
              one broad headline number.
