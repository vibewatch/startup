      - number: '1.4'
        title: Ownership transition, valuation markers, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              The ownership story is one of the chapter's strongest verified areas because it is anchored by a Chinese
              antitrust filing as well as secondary reporting. SAMR's 2025 notice and CnEVPost's follow-up article state
              that New Territory Technology Company Limited, a Hong Kong holding vehicle incorporated on October 3,
              2022, held 70.65% of ZYT before the proposed transaction and exercised sole control. After the deal, FAW
              would hold 35.80% and New Territory 34.85%, leaving the two in joint control and making FAW the largest
              single shareholder. That matters strategically because it converts FAW from customer or partner into a
              governance-critical backer and aligns with ZYT's own statement that it secured more than RMB3.6 billion of
              strategic investment from FAW in 2025. The valuation evidence is weaker but still directionally useful:
              36Kr reported in January 2024 that DJI Automotive was being marketed at about RMB10 billion and that BYD
              and FAW had shown investment interest. Public sources do not reconcile that 2024 valuation marker with the
              later FAW transaction terms, so valuation should be treated as an indicative private-market signal rather
              than a current fair-value fact.
