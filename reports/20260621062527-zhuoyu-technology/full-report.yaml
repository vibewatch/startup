      - number: '2.2'
        title: Adoption drivers and demand composition
        blocks:
          - type: paragraph
            body: >-
              The strongest demand signal is that intelligent-driving features have moved from showcase options into a
              mainstream purchasing criterion above the budget segment. XEPS says NEVs reached 67% L2+ penetration in H1
              2025, vehicles above RMB150k are close to standard on L2+, and the RMB100k-200k band contributed 45.3% of
              all NOA installations. ResearchAndMarkets adds that 2025 is the year highway NOA entered standardization,
              with the path now extending from highway NOA to commute NOA, mapless city NOA, and eventually broader L3+
              capability. That composition suits ZYT because its ClixPilot stack is positioned for exactly the functions
              that are scaling first, while its public customer set spans Volkswagen-related programs, SAIC-GM-Wuling,
              FAW, Dongfeng, and other OEM relationships. The opportunity is not uniform, however. Below RMB100k,
              adoption is still thin; in the mainstream RMB80k-150k range, suppliers such as Nullmax and Black Sesame
              are already launching cost-optimized ADAS stacks; and BYD's cost-down play has reset buyer expectations
              for hardware economics. The practical buyer map is therefore OEM-centric: JV and legacy OEMs need
              China-specific upgrade paths, domestic NEV brands chase volume and feature parity, exporters need overseas
              localization, and the lowest-price segment remains a later wave rather than today's core SAM.
