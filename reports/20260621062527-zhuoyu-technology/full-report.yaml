      - number: '6.3'
        title: Customer concentration, dependency, and account-quality assessment
        blocks:
          - type: paragraph
            body: >-
              The central underwriting issue is concentration. ZYT’s official partner count is broad, but the proof
              stack that really matters is narrow: Volkswagen has the largest visible model cluster, SGMW supplies the
              earliest repeatable SOP evidence, and FAW is now both a customer family and the largest shareholder. Chery
              strengthens the roster, yet the company still appears heavily concentrated in Chinese passenger-car OEMs,
              with Europe positioned as pipeline diversification rather than current revenue relief. This concentration
              can be good and bad at once. On the positive side, repeated platform wins inside a large OEM group can
              raise renewal odds because each additional model reuses validation work and makes engineering handoff more
              efficient. On the negative side, a handful of buyer groups can dominate commercial terms, slow nomination
              conversion, or shift roadmaps toward their own in-house stacks. Volkswagen is the clearest example: it is
              currently ZYT’s richest visible account, but it is also investing in a China-specific smart-driving stack
              with Horizon. That means account depth and dependency are arriving together, not separately.
