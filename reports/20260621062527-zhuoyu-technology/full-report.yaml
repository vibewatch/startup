  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: DJI overhang remains the single hardest-to-hedge risk
        blocks:
          - type: paragraph
            body: >-
              The highest-severity non-product risk is the company's inherited DJI overhang. ZYT is legally a separate
              Shenzhen entity and now has its own terms, privacy policies, and customer-facing brand, but the public
              ownership trail still runs through New Territory, the DJI-linked shareholder that controlled 70.65% before
              the FAW transaction. The September 2025 SAMR filing and CnEVPost coverage show FAW moving to 35.80% and
              New Territory falling to 34.85%, which is a real governance change because it ends sole control and gives
              ZYT a state-owned automotive counterweight. But it does not erase the parent risk. The U.S. Department of
              Defense published DJI on its Chinese military companies notice in January 2025, a federal court later
              allowed that designation to stand, and DJI itself appealed in October 2025 after losing in district court.
              The FCC's covered-list regime is not a direct ban on ZYT ADAS controllers, yet the broad UAS and affiliate
              scrutiny means European OEMs and any US-facing counterparties still have to ask whether a DJI-linked
              supplier can become a procurement or reputational problem later. FAW is therefore a buffer, not a cure.
            claimRefs:
