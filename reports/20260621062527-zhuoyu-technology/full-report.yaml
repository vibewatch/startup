        - DJI heritage adds technical credibility but can carry policy scrutiny in some markets
        - Mobileye or Bosch avoid this exact baggage
        - DJI statement and FCC policy context show scrutiny around Chinese technology supply chains
        - Europe or other overseas expansion may require extra trust and compliance work
