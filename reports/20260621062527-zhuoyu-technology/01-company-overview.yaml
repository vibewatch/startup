  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: leadership and founder table coverage gap
      missingEvidence: Full board roster, CFO or finance leadership identity, committee structure, and executive reporting lines for the standalone ZYT entity.
      whyItMatters: Governance quality and key-person dependence cannot be underwritten from public sources alone.
      diligencePath: Request an org chart, board deck, and the latest shareholder and board materials from management.
      relatedQuestionRefs: [QO012]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: financial disclosure
      missingEvidence: Standalone audited financial statements, revenue by customer, gross margin by product line, and cash runway disclosures.
      whyItMatters: Public traction and valuation markers cannot be converted into investment-grade unit economics or solvency views without primary financial data.
      diligencePath: Obtain audited or management-certified financials, customer concentration schedules, and backlog conversion data during diligence.
      relatedQuestionRefs: [QO022]
    - type: private-evidence-only
      severity: material
      topic: stakeholder or investor map coverage gap
      missingEvidence: Shareholder agreement, closing status for the FAW transaction, board-seat allocation, reserved matters, and beneficial ownership chain behind New Territory.
      whyItMatters: Equity percentages alone do not reveal effective control, veto rights, or future dilution constraints.
      diligencePath: Review transaction documents, cap table, and governance rights matrix with counsel and management.
      relatedQuestionRefs: [QO012, QO025]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: Revenue concentration by OEM, nomination-to-SOP conversion rates, warranty reserves, and dependence on Volkswagen-related platforms versus FAW-linked programs.
      whyItMatters: Public customer names show relevance but not whether one or two OEM groups dominate revenue and roadmap leverage.
      diligencePath: Request customer revenue bridge, signed program pipeline, and gross-profit contribution by OEM family.
      relatedQuestionRefs: [QO025]
    - type: missing-source
      severity: minor
      topic: valuation refresh
      missingEvidence: A current 2025 or 2026 financing document showing post-money valuation and security terms after the FAW strategic investment.
      whyItMatters: The widely cited RMB10 billion figure comes from January 2024 reporting and may not represent today's capitalization.
      diligencePath: Request the latest financing summary, board approvals, and any third-party fairness or valuation materials.
      relatedQuestionRefs: [QO014]
