artifact: company-overview
slug: zhuoyu-technology
runDate: "2026-06-21"
company:
  name: Zhuoyu Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Zhuoyu Technology (ZYT) is the Shenzhen-based smart-driving supplier spun out of DJI's automotive effort and rebranded from DJI Automotive in June 2024. Public evidence supports a 2016 origin, a B2B Tier 1 ADAS business model, rapid scale to more than 1,800 employees by end-2025, and a 2025 control transition in which FAW agreed to become the largest shareholder. The main underwriting caveats are the absence of standalone financial statements, incomplete public board disclosure, and likely concentration around large OEM relationships led by Volkswagen programs and FAW.
sections:
  - id: identity-and-origin
    title: Identity, origin, and operating model
    body: >-
      ZYT's current public identity is clearer than its early corporate history. The company's own English-language About, Solution, and Technology pages identify the business as Shenzhen Zhuoyu Technology Co., Ltd. (ZYT), headquartered in Nanshan District, Shenzhen, with the mission "Safe and Effortless Mobility for All." Those same pages describe a supplier that sells ClixPilot branded ADAS systems, associated controllers and sensors, and adjacent features such as vehicle-mounted drone systems rather than consumer vehicles. Independent reporting fills in the transition story: the operation began as DJI's automotive project team in 2016, was publicly presented as DJI Automotive at Auto Shanghai 2021, started operating as Shenzhen Zhuoyu Technology Co., Ltd. in 2023, and formally adopted the Zhuoyu brand on June 21, 2024. The safest framing for later chapters is therefore not "startup founded from scratch in 2023," but a DJI-incubated automotive stack that became a separately branded Tier 1 smart-driving supplier with a formal legal and brand separation path over 2022 to 2024.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: products-scale-and-customer-footprint
    title: Product scope, technical stack, and scale signals
    body: >-
      The official product pages show a company trying to cover a full ADAS stack instead of only one module. ClixPilot is positioned as the core smart-driving suite, with functions spanning active safety, parking, highway NOA, city NOA, and cockpit-driving integration. The solution and technology pages also disclose the architecture logic behind that positioning: ZYT supports stereo-vision-first configurations, optional LiDAR fusion, controller configurations starting at 32 TOPS and extending to higher-compute platforms, and a broader computing roadmap stretching to 1,500+ TOPS for higher-end systems. This is consistent with third-party reporting that Chengxing Platform, the predecessor naming used before ClixPilot, emphasized binocular vision and cost-effective deployment rather than mandatory lidar. Scale signals are strong but still mostly company-reported. ZYT says it had more than 1,800 employees by end-2025, including more than 1,000 core R&D staff and more than 500 engineering and manufacturing personnel, alongside 34 customers or ecosystem partners and over 130 nominated models. Independent articles corroborate earlier waypoints of 700-plus staff in April 2021 and nearly 1,000 by December 2021, which makes the later headcount claim directionally credible even though no payroll or revenue disclosure is public.
    claimRefs: [CO009, CO010, CO011, CO012, CO019, CO020, CO021, CO022, CO023, CO024, CO039, CO040, CO045, CO046]
    figureRefs: [FO003]
  - id: leadership-and-governance
    title: Public leadership bench and governance visibility
    body: >-
      Public leadership visibility is meaningful but incomplete. Sina and Gasgoo coverage name Shen Shaojie as the CEO or head of ZYT, Ma Lu as CTO, Ma Jianyun as a vice president or deputy general manager, and Qi Guibao as general manager of the controller business unit. The European expansion materials add Nils Oldemeyer as head of Europe, which indicates at least one regionally accountable executive as the company internationalizes. These disclosures are useful because they show ZYT is no longer presented as an anonymous DJI business unit; it has a recognizable operating bench across executive, technical, controller, and European commercial functions. Even so, the public record still does not provide a full board roster, CFO identity, formal governance charter, or shareholder-rights summary beyond the FAW and New Territory stake disclosures. That makes key-person and governance diligence unfinished work. Later chapters can rely on the existence of a real executive team, but they should not infer public-company-style governance maturity from the current source pack.
    claimRefs: [CO027, CO028, CO029, CO030, CO031, CO032]
    tableRefs: [TO002]
  - id: ownership-capital-and-stakeholders
    title: Ownership transition, valuation markers, and strategic stakeholders
    body: >-
      The ownership story is one of the chapter's strongest verified areas because it is anchored by a Chinese antitrust filing as well as secondary reporting. SAMR's 2025 notice and CnEVPost's follow-up article state that New Territory Technology Company Limited, a Hong Kong holding vehicle incorporated on October 3, 2022, held 70.65% of ZYT before the proposed transaction and exercised sole control. After the deal, FAW would hold 35.80% and New Territory 34.85%, leaving the two in joint control and making FAW the largest single shareholder. That matters strategically because it converts FAW from customer or partner into a governance-critical backer and aligns with ZYT's own statement that it secured more than RMB3.6 billion of strategic investment from FAW in 2025. The valuation evidence is weaker but still directionally useful: 36Kr reported in January 2024 that DJI Automotive was being marketed at about RMB10 billion and that BYD and FAW had shown investment interest. Public sources do not reconcile that 2024 valuation marker with the later FAW transaction terms, so valuation should be treated as an indicative private-market signal rather than a current fair-value fact.
    claimRefs: [CO033, CO034, CO035, CO036, CO037, CO038]
    tableRefs: [TO003]
  - id: milestones-certifications-and-risk-context
    title: Milestones, certifications, Europe push, and preserved risk context
    body: >-
      ZYT's chronology shows a company that spent years de-risking automotive-grade execution before telling a broader global story. The official milestone page records the 2018 Shenzhen road-test permit, the 2019 first automotive-grade factory and first Volkswagen Group China OEM project, 2021 laboratory and functional-safety certifications, 2022 first ADAS SOP, and 2023 shift to independent operations under the Shenzhen Zhuoyu entity while launching ClixPilot. By 2025, the company was presenting end-to-end city NOA across multiple platforms, GenDrive, an in-vehicle drone system, and a European strategy anchored by a Braunschweig subsidiary and IAA Mobility debut. The certification record is also unusually extensive for a private supplier, spanning TISAX, A-SPICE, ISO 9001, 14001, 45001, 27001, ISO 26262 ASIL-D process, IATF 16949, ISO 21448 SOTIF, and ASIL-C product certification. The risks worth preserving are different from pure technical immaturity. First, ZYT remains financially opaque because no standalone public financial statements were found. Second, the company inherits adjacency risk from DJI, whose parent entity remains exposed to U.S. policy actions even though DJI's own court statement stresses that the court found no government control or direct military ties. Third, OEM and capital concentration may become material if Volkswagen-linked programs and FAW governance influence dominate commercial outcomes.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO025, CO026, CO027, CO028, CO041, CO042, CO043, CO044, CO045, CO046]
    tableRefs: [TO004]
    figureRefs: [FO001]
callouts:
  - calloutType: insight
    title: ZYT should be underwritten as a Tier 1 platform supplier, not a branded automaker
    body: >-
      The official product stack, customer list, and Volkswagen or SGMW program references all point to a B2B Tier 1 model built around supplying ADAS systems, controllers, sensing, and integration services to OEMs rather than launching consumer car brands.
    claimRefs: [CO005, CO009, CO025, CO026]
  - calloutType: risk
    title: Ownership clarity improved in 2025, but financial transparency did not
    body: >-
      The FAW transaction provides unusually clear public evidence on control percentages, yet the same source pack does not surface revenue, margins, cash burn, or audited standalone statements, so commercial scale remains far less verified than cap-table direction.
    claimRefs: [CO034, CO035, CO036, CO041]
  - calloutType: risk
    title: Customer and governance concentration may rise together
    body: >-
      Public evidence repeatedly centers on Volkswagen programs and FAW relationships; if the same counterparties become both major customers and major controllers, ZYT's bargaining power and roadmap neutrality could narrow without being visible in public disclosures.
    claimRefs: [CO014, CO025, CO035, CO044]
