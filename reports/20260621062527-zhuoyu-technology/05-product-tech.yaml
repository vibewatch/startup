chapter:
  number: 5
  title: Product & Technology
  summary: Zhuoyu Technology's current product story is a scalable ClixPilot / Chengxing ADAS stack that starts at TI-based 32 TOPS vision-first configurations and scales through Qualcomm 100 TOPS and SA8775P cockpit-drive fusion, while reusing one end-to-end software architecture across parking, highway NOA, city NOA, and newer Door-to-Door / GenDrive functions. The best-evidenced differentiation is low-compute stereo-based city driving and vertically integrated sensor-controller manufacturing; the biggest technical risks are limited public disclosure on field reliability, L3-grade product approval, and how much of the competitive moat now depends on server-side training scale rather than in-vehicle hardware alone.
sections:
- id: product-stack-and-configuration-map
  title: ClixPilot / Chengxing product stack and configuration ladder
  body: 'Public materials now describe ZYT less as a single ADAS box and more as a configurable product ladder branded around ClixPilot and the Chengxing Platform. The official solution page lists five current configuration families: 7V + 32 TOPS, 7V + 100 TOPS, 10V + 100 TOPS, LiDAR-Stereo Onebox + 100 TOPS, and a flagship cockpit-driving fusion path. Across those configurations, the feature envelope is intentionally broad rather than trim-specific: active safety, standard parking assist, intelligent summon, remote parking, multi-floor memory parking, highway navigation, city navigation, and newer 2025 functions such as Door-to-Door driving, GenDrive, and the vehicle-mounted drone system. The important underwriting point is that ZYT is selling OEMs a reusable architecture that can scale from budget-sensitive map-free city NOA to premium redundancy and single-SoC cockpit-drive integration, instead of forcing every customer into a lidar-heavy or ultra-high-compute starting point.'
