- id: sensor-and-algorithm-architecture
  title: Sensor approach and algorithm architecture
  body: 'The sensor and software stack is the core of ZYT''s differentiation story. Official technology materials emphasize inertial-aided stereo as the baseline 3D perception method, then extend upward into inertial stereo plus telephoto tri-stereo and finally LiDAR-Stereo Onebox for higher redundancy use cases. That narrative is corroborated by independent technical coverage: Baojun Yunhai is presented as a 32 TOPS end-to-end city-NOA deployment, while Hongqi Tiangong 05 is described as the first mass-produced inertial tri-stereo system with telephoto plus binocular vision, denser point clouds than mainstream lidar, and longer detection range. On the software side, ZYT publicly claims a modern end-to-end stack trained from large-scale trajectory pretraining, reinforcement learning on expert data, multimodal prompting at inference time, and a next-generation world model that feeds personalized driving behavior and GenDrive. The public pack clearly supports occupancy-style perception through
    ZYT''s Stereo Occupancy Network, but it does not expose a separate BEV model card or detailed latency / failure-rate benchmarks, so technical transparency still trails the ambition of the narrative.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE021
