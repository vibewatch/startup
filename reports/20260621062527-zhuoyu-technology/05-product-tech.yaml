- id: compute-manufacturing-and-compliance-controls
  title: Compute platform, manufacturing depth, and compliance controls
  body: 'ZYT''s product stack matters because it is coupled to unusual vertical control for a private ADAS supplier. The official technology and homepage surfaces describe controller design, sensor production, manufacturing, safety OS support, and automotive-grade quality systems as in-house capabilities rather than outsourced modules. Public milestone disclosures add the timing: a first automotive-grade factory in 2019, TISAX and A-SPICE in 2020, ISO 26262 ASIL-D process certification in 2021, IATF 16949 in 2022, SOTIF and ASIL-C product certification in 2023, then 2025 mass-production claims across more vehicle platforms. The privacy and legal pages also make ZYT''s trust posture more concrete than a normal brochure site by spelling out visualization-data collection, location and external-environment image processing, cookie/security controls, and DPO contact. Even so, China''s 2025 MIIT/SAMR rules make OTA, driver-assist marketing, and event reporting much more tightly governed, which
    means the company still needs disciplined release management and careful feature naming if it wants the software-defined upgrade story to remain an advantage rather than a compliance drag.'
  claimRefs:
