- id: differentiation-competitive-edge-and-technical-risks
  title: Differentiation versus peers and the main technical risks
  body: 'The best-supported bullish case is that ZYT can deliver a cost-competitive, stereo-first ADAS stack that uses less compute and fewer premium sensors than many headline rivals while still spanning both ICE and EV programs. The 32 TOPS city-NOA proof point, DJI-era binocular know-how, TI procurement relationship, and self-owned sensor/controller manufacturing all reinforce that thesis. Market context also helps: NOA penetration is moving rapidly into the RMB100k-200k band, where OEMs care more about deployable compute efficiency than maximum-spec silicon. But the risk list is real. Competitors such as Nullmax, DeepRoute, and Black Sesame are converging on the same mainstream value proposition with domestic chips and mass-market positioning. Huawei still owns the strongest brand pull and broader ecosystem lock-in. Public sources do not establish field disengagement rates, warranty performance, or product-level L3 approval, and even ZYT''s own technical allies increasingly frame the
    decisive competition as cloud training scale rather than controller configuration alone. That means ZYT''s moat is credible, but it is executional, not absolute.'
