  evidenceGaps:
  - type: missing-source
    severity: material
    topic: bev-transparency
    missingEvidence: A public technical paper or product note that explicitly explains whether ZYT uses a separate BEV representation in production, beyond the disclosed Stereo Occupancy Network language.
    whyItMatters: The public pack supports OCC terminology but not a full model-card view of perception architecture, which limits technical diligence on architecture novelty versus industry norms.
    diligencePath: Request product-architecture documentation or engineering presentation for the production stack, including perception representation, latency budgets, and fallback logic.
    relatedQuestionRefs:
    - QE012
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Field reliability metrics such as disengagements, intervention rates, false-brake rates, warranty reserves, and recall / incident statistics by controller or vehicle program.
    whyItMatters: Without field-performance metrics, public launch evidence says more about commercialization than about robustness or lifecycle cost.
    diligencePath: Request OEM program scorecards, safety KPIs, warranty and recall data, and incident review processes for each major configuration.
    relatedQuestionRefs:
    - QE027
  - type: private-evidence-only
    severity: material
    topic: l3-commercial-proof
    missingEvidence: Product-level evidence that any ZYT configuration has cleared a commercial L3 approval or entered commercial L3 operation rather than being described as L3/L4-ready.
    whyItMatters: Investors should separate readiness marketing from actual higher-level autonomous commercialization, because the regulatory and liability profile changes materially.
    diligencePath: Request homologation records, customer SOP documentation, and regulator or OEM confirmation for any claimed L3-capable deployment.
    relatedQuestionRefs:
    - QE026
acknowledgedWarnings:
- dimension: figureType
  reason: The retained evidence is strongest as operational flows, a chronology, and KPI snapshots; forcing stack, dag, or matrix visuals would add synthetic structure without adding verifiable evidence.
