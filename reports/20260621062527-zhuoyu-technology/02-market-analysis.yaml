- id: market-risks-and-valuation-implications
  title: Market risks and valuation implications
  body: 'The market is attractive, but it is not a simple straight-line volume story. First, adoption timing risk remains real below the RMB100k band and in full city-NOA deployment, where capability, compute, and validation costs still outpace what entry vehicles can economically bear. Second, price compression is intensifying: BYD has reportedly pushed high-order smart-driving hardware cost down to about RMB4,500, and mainstream-oriented competitors now target CNY80k-150k vehicles with single-chip stacks. Third, technology substitution risk is growing as OEMs and Tier 1s pursue alternatives to buying a full external stack. FAW has a Mobileye path, Volkswagen is co-developing China-specific chips with Horizon, Horizon and ZF already have 2026 orders, and Black Sesame plus DeepRoute are pushing integrated chip-plus-software offerings. Finally, regulatory reversal is no longer theoretical: electrive reports a broader 2025 crackdown on marketing and OTA behavior, and 2026 reporting on the
    Baidu outage shows authorities can suspend expansion after safety incidents. These pressures do not remove the market, but they argue for underwriting ZYT on execution quality, OEM access, and cost competitiveness rather than on a generic “China ADAS TAM is huge” narrative.'
