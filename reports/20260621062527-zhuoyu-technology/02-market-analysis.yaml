  evidenceGaps:
  - type: missing-source
    severity: material
    topic: global-tam
    missingEvidence: A source-backed global revenue or unit market total for production ADAS and intelligent-driving supplier spend that matches ZYT's product scope.
    whyItMatters: Without a comparable global category total, upside outside China can only be treated directionally and not as a valuation-grade TAM number.
    diligencePath: Pull one or more global ADAS supplier market estimates plus global light-vehicle production lenses and reconcile them against ZYT's scope exclusions.
    relatedQuestionRefs:
    - QM014
  - type: private-evidence-only
    severity: material
    topic: som-and-pricing
    missingEvidence: Customer-level volumes, ASPs, take rates, and program mix needed to calculate ZYT's precise SAM-to-SOM bridge.
    whyItMatters: Public market adoption data can show demand, but cannot convert that demand into revenue capture or defendable share for ZYT without private commercial disclosures.
    diligencePath: Request SOP model list, per-program shipment forecasts, customer concentration, and blended hardware or software ASP ranges from management.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
    - TM005
