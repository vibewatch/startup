- id: TM004
  title: Demand composition table
  columns:
  - OEM tier / price segment
  - ADAS adoption level
  - ZYT addressable share
  - Evidence
  - Implication
  rows:
  - - JV and legacy OEMs above RMB150k
    - Near-standard L2+ adoption in the >RMB150k band
    - High
    - Volkswagen-related cooperation, FAW links, and China-specific smart-driving upgrades are all in the retained pack
    - This is a core market because these OEMs need local adaptation but still buy from suppliers
  - - Domestic NEV mainstream RMB100k-200k
    - 45.3% of total NOA installations; NEVs reached 67% L2+ penetration
    - High but contested
    - The volume center of NOA already sits in the RMB100k-200k band
    - This is where ZYT can scale, but where price pressure is strongest
  - - Entry segment below RMB100k
    - Low ADAS penetration today
    - Low near term
    - XEPS says lower-priced vehicles still have low ADAS adoption
    - This delays mass profitability from the lowest-price tier
  - - Export-oriented and Europe-bound programs
    - Growing localization need rather than disclosed volume
    - Medium and rising
    - ZYT has established a German base and is targeting European OEMs plus Chinese exporters
    - This is the clearest pathway from China SAM into global TAM
  - - OEMs pursuing in-house or co-developed stacks
    - High feature ambition but lower external stack spend per vehicle
    - Selective and at risk
    - FAW-Mobileye, Volkswagen-Horizon, Horizon-ZF, and chip-plus-software partnerships all show alternate sourcing paths
    - The more control OEMs seek, the smaller the spend pool left for independent full-stack suppliers
  notes: Addressable share is directional rather than a disclosed market-share statistic because public sources do not reveal ZYT pricing, contracted volumes, or OEM revenue concentration.
