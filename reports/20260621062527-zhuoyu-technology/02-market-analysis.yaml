- id: TM005
  title: Market risk table
  columns:
  - Risk
  - Severity
  - Timeline
  - Evidence
  - Mitigation or offset
  rows:
  - - Adoption timing below RMB100k and in full city NOA
    - High
    - 2025-2027
    - Low penetration persists below RMB100k and city functions still trail highway NOA standardization
    - Stay concentrated on higher-attach OEM programs before forcing full mass-market downshift
  - - Regulatory reversal after safety incidents
    - High
    - Immediate and recurring
    - 2025 marketing and OTA crackdown plus 2026 robotaxi permit suspension after the Baidu outage
    - Build stronger validation, clearer HMI, and disciplined incident-response capabilities
  - - Price compression from BYD-style cost down
    - High
    - 2025 onward
    - BYD reportedly cut high-order hardware cost to about RMB4,500 and competitors target mainstream price bands
    - Compete on cost-effective architecture and OEM integration efficiency rather than only feature breadth
  - - Technology substitution by OEM in-house chips or chip-partner stacks
    - High
    - 2025-2027
    - FAW-Mobileye, Volkswagen-Horizon, Horizon-ZF, and Black Sesame-DeepRoute all compress the stand-alone supplier role
    - Protect position through system integration, validation know-how, and customer-specific tuning
  - - Insufficient data for precise SOM or global TAM
    - Medium
    - Current diligence cycle
    - Public sources do not disclose ZYT pricing, program volumes, or a directly comparable global category total
    - Request customer-level volume, ASP, and program-mix data before relying on revenue-driven TAM multiples
  notes: Severity reflects likely effect on ZYT market access and pricing power, not a probabilistic forecast; the final row is a diligence limitation rather than an operating defect.
