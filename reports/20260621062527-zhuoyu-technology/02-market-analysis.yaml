- id: TM001
  title: Market definition and boundary table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - ZYT relevance
  rows:
  - - Base ADAS and active safety
    - AEB, ACC, LKA software, controllers, cameras, radar, validation
    - Conventional non-ADAS body electronics
    - OEM E/E platform and procurement teams
    - High because these features are already mass-market and create attach points for higher-order stacks
  - - Highway NOA and memory driving
    - Navigation-assist software, domain controller, perception stack, OTA and validation work
    - Pure L4 robotaxi operations and unmanned fleet services
    - OEM smart-driving program owner
    - Very high because 2025 standardization is happening first on highway NOA
  - - City or commute NOA
    - Mapless city navigation, perception, planning, training, testing, functional-safety work
    - General-purpose AI features unrelated to vehicle driving
    - Flagship program teams at OEMs
    - High ASP but more regulation and slower deployment than highway NOA
  - - Parking and low-speed autonomy
    - APA, memory parking, valet-style parking functions, parking sensors and software
    - Aftermarket parking accessories
    - OEM body, parking, and UX teams
    - Useful as adjacent attach revenue and part of integrated driving-parking bundles
  - - Overseas localization
    - Homologation, validation, testing, local customer support, cockpit-driving integration
    - Ride-hailing platforms and consumer map subscriptions
    - European OEMs and Chinese exporters
    - Relevant because ZYT is localizing in Germany for Europe-facing programs
  notes: This table defines the addressable market as production passenger-vehicle ADAS and intelligent-driving spend sold into OEM programs; it excludes robotaxi operations and unrelated consumer software.
