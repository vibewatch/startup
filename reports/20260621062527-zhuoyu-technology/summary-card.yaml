  topStrengths:
    - >-
      Production-proven at scale: 20+ mass-produced models across Volkswagen JVs, SGMW, Chery, FAW Hongqi, and others
      prove ZYT can execute automotive-grade mass production, not just demos.
    - >-
      Low-compute city NOA advantage: achieving full end-to-end city navigation on 32 TOPS (TI TDA4VH) without HD maps
      or lidar is a genuine cost-efficiency moat validated across multiple production vehicles.
    - >-
      Strong OEM breadth and 130+ nomination pipeline: 34 customers and 130+ model nominations provide durable revenue
      visibility across the RMB 100k–300k mainstream segment.
    - >-
      DJI stereo-vision heritage and TI chip pricing priority give ZYT structural cost advantages in binocular camera
      manufacturing yield rates and chip procurement economics.
    - >-
      FAW Group's strategic alignment as both top customer and largest shareholder (35.80%) de-risks the largest single
      revenue stream while providing state-enterprise backing.
  topRisks:
    - >-
      DJI geopolitical overhang: DJI parent is on the US DoD Chinese Military Company list and FCC covered list; ZYT's
      legal separation exists but beneficial ownership chain creates headline risk that could limit European OEM
      adoption and technology access.
    - >-
      Financial opacity: no standalone audited revenue, gross margin, cash balance, or customer-level concentration
      disclosed; the RMB 10bn valuation mark is now two years old and cannot be cleanly reconciled against current
      fundamentals.
    - >-
      VW customer concentration and Carizon chip risk: VW-related programs appear to dominate ZYT's current model
      portfolio while VW is simultaneously building a custom SoC via Carizon (Horizon Robotics JV), potentially
      internalizing ZYT's core function over 3–5 years.
    - >-
      Escalating low-cost competition from BYD Dipper Eye (RMB 4,500 hardware), Nullmax, and DeepRoute narrows ZYT's
      pricing power in the mass-market segment.
    - >-
      Regulatory tightening on OTA, ADAS marketing, and driver-assist naming in both China (MIIT/ SAMR Feb 2025) and
      Europe increases compliance cost and may slow feature monetization.
  unresolvedGaps:
    - Audited standalone ZYT revenue, gross margin, cash position, and burn rate.
    - Customer-level revenue concentration breakdown — share from VW programs vs. FAW vs. others.
    - Updated valuation mark reflecting the FAW >RMB 3.6bn investment and any post-2024 dilution.
    - Full shareholder agreement terms — reserved matters, drag/tag rights, FAW board rights.
    - Evidence on European OEM traction — any signed EU OEM contracts or nominations post-IAA 2025.
    - Chip supply contingency plan if US export controls restrict TI/Qualcomm to ZYT.
