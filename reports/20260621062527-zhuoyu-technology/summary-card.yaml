summary:
  headline: >-
    ZYT is a credible, production-proven ADAS supplier with a defensible compute-efficiency advantage and growing OEM
    base, but geopolitical lineage from DJI, financial opacity, and intensifying cost competition make the risk/reward
    compelling only with additional diligence on standalone economics.
