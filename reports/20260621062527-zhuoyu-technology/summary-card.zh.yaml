summary:
  headline: ZYT 是一家可信、已跑通量产的 ADAS 供应商，算力效率优势有防守性，OEM 客户也在增加；但 DJI 渊源带来的地缘政治风险、财务不透明，以及成本竞争升温，意味着只有进一步核清独立经济性之后，风险回报才够有吸引力。
