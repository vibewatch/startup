  topStrengths:
    - 规模量产已验证：Volkswagen 合资公司、SGMW、Chery、FAW Hongqi 等 20 多款量产车型，证明 ZYT 跑通的是车规级量产，不只是 Demo。
    - 低算力城市 NOA 有优势：不用高精地图或激光雷达，靠 32 TOPS（TI TDA4VH）跑通端到端城市导航，这条成本效率护城河已经在多款量产车上验证。
    - OEM 覆盖面宽，定点管线超过 130 个：34 家客户、130 多个车型定点，让 RMB 100k–300k 主流价格带的收入可见度更稳。
    - DJI 双目视觉积累和 TI 芯片价格优先权，让 ZYT 在双目摄像头制造良率和芯片采购经济性上有结构性成本优势。
    - FAW Group 既是最大客户也是最大股东（35.80%），战略一致性降低了最大单一收入来源的风险，也带来国企背书。
  topRisks:
    - >-
      DJI 地缘政治阴影仍在：DJI 母公司列入美国 DoD Chinese Military Company 名单和 FCC covered list；ZYT 虽已法律切分，但受益所有权链条仍会制造舆论风险，可能限制欧洲 OEM
      采用和技术获取。
    - 财务不透明：公司未披露独立审计收入、毛利率、现金余额或客户级集中度；RMB 10bn 估值标记已过去两年，无法与当前基本面清晰对账。
    - >-
      VW 客户集中和 Carizon 芯片风险：VW 相关项目似乎主导 ZYT 现有车型组合，而 VW 又在通过 Carizon（Horizon Robotics 合资公司）自研定制 SoC，3–5 年内可能把 ZYT
      的核心功能内化。
    - BYD Dipper Eye（RMB 4,500 硬件）、Nullmax、DeepRoute 等低成本竞争加剧，正在挤压 ZYT 在大众市场的定价权。
    - 中国（MIIT / SAMR 2025 年 2 月）和欧洲都在收紧 OTA、ADAS 营销、辅助驾驶命名监管，合规成本会上升，功能变现也可能放慢。
  unresolvedGaps:
    - 经审计的 ZYT 独立收入、毛利率、现金状况和烧钱速度。
    - 客户级收入集中度拆分——VW 项目、FAW 与其他客户各占多少。
    - 反映 FAW 超过 RMB 3.6bn 投资及 2024 年后任何稀释的最新估值标记。
    - 完整股东协议条款——保留事项、拖售 / 跟售权、FAW 董事会权利。
    - 欧洲 OEM 进展证据——IAA 2025 之后是否签署任何欧盟 OEM 合同或拿到定点。
    - 如果美国出口管制限制 TI / Qualcomm 供货给 ZYT，芯片供应应急方案是什么。
