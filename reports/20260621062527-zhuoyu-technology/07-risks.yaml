  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fcc-and-sanctions-scope
    missingEvidence: A jurisdiction-specific legal memo showing whether any current U.S. restrictions reach ZYT automotive products, distributors, or European OEM procurement flows rather than only DJI/UAS activity.
    whyItMatters: The difference between lineage risk and direct restriction risk changes both severity and timing of the geopolitical thesis.
    diligencePath: Request external sanctions/export-control counsel analysis plus any customer compliance questionnaires or procurement exceptions tied to DJI lineage.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: chip-fallback-plan
    missingEvidence: A disclosed alternate-compute roadmap or qualified domestic replacement path for TI and Qualcomm tiers.
    whyItMatters: Without a verified fallback, export-control or supplier disruption could force redesign, revalidation, and customer delay simultaneously.
    diligencePath: Ask management for chip second-source policy, qualification timing, software portability proof, and any domestic-chip pilot programs.
    relatedQuestionRefs:
    - QR016
  - type: private-evidence-only
    severity: material
    topic: leadership-bench-depth
    missingEvidence: An org chart for commercial, manufacturing, safety, and Europe leadership plus succession coverage beyond Shen Shaojie.
    whyItMatters: A shallow management bench raises execution and continuity risk precisely when the company is scaling customers, regulation, and geography at once.
    diligencePath: Request executive roster, tenure data, reporting lines, and contingency plan for key-person departure.
    relatedQuestionRefs:
    - QR019
  - type: private-evidence-only
    severity: material
    topic: manufacturing-redundancy
    missingEvidence: Evidence of a second qualified manufacturing site or a tested disaster-recovery plan for controller and camera output.
    whyItMatters: Single-site concentration turns quality or operational interruption into a customer-delivery and recall risk.
    diligencePath: Request plant list, backup tooling locations, disaster-recovery SOPs, and business-continuity test results.
    relatedQuestionRefs:
    - QR021
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Standalone revenue, gross margin, customer concentration, cash, and burn data for ZYT after the FAW transaction.
    whyItMatters: Investors cannot distinguish strategic momentum from economic quality without core financial disclosures.
    diligencePath: Request management P&L, customer mix, cash runway, and scenario bridge showing how FAW capital changes funding needs.
    relatedQuestionRefs:
    - QR017
    - QR018
