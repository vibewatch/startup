- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - DJI overhang
    - New restriction or procurement exclusion tied to DJI affiliation
    - Any new US or EU action that reaches affiliates, automotive electronics, or customer procurement policy
    - Reprice downside immediately; require management plan for ring-fencing customers and supply chain.
  - - VW / FAW concentration
    - Loss of major visible model family or delayed follow-on wins
    - A visible VW-family pullback, Carizon substitution, or FAW share gains without broader customer diversification
    - Treat concentration as thesis-break rather than scaling benefit.
  - - Regulatory tightening
    - Recall-class OTA or reported ADAS incident tied to ZYT programs
    - Emergency OTA, production stop, regulator investigation, or mandatory functionality rollback
    - Assume slower commercialization and higher warranty / compliance costs.
  - - Chip supply dependency
    - Evidence of TI / Qualcomm disruption or redesign away from current stack
    - Export-control limitation, qualification delay, or disclosed forced migration to a new compute base
    - Pressure-test schedule slip, revalidation cost, and customer retention impact.
  - - Financial opacity
    - Capital raise without improved disclosure
    - Another financing or strategic transaction before public margin / revenue visibility improves
    - Assume weaker bargaining power and potentially punitive funding terms.
  - - Leadership / execution
    - Senior departure or missed Europe / manufacturing milestones
    - Loss of Shen Shaojie or Europe lead, or failure to show manufacturing redundancy and new OEM wins
    - Move the case from track to avoid until bench depth and execution recover.
  notes: These are investor monitoring rules, not company-reported KPIs; they translate qualitative risk into observable evidence thresholds.
