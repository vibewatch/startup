company:
  name: Zhuoyu Technology
chapter:
  number: 7
  title: Risks
  summary: Zhuoyu Technology's risk profile is dominated by a still-material DJI geopolitical overhang, concentration around Volkswagen- and FAW-linked demand, faster Chinese regulatory tightening after 2025, and brutal cost compression in mainstream ADAS. FAW's entry reduces sole-control optics and gives ZYT strategic backing, but it does not remove US-linked sanctions, chip-supply, or concentration risks. The public record still supports a track rather than underwrite posture because financial opacity, leadership depth, and manufacturing redundancy remain only partially disclosed.
sections:
- id: geopolitical-and-governance-overhang
  title: DJI overhang remains the single hardest-to-hedge risk
  body: The highest-severity non-product risk is the company's inherited DJI overhang. ZYT is legally a separate Shenzhen entity and now has its own terms, privacy policies, and customer-facing brand, but the public ownership trail still runs through New Territory, the DJI-linked shareholder that controlled 70.65% before the FAW transaction. The September 2025 SAMR filing and CnEVPost coverage show FAW moving to 35.80% and New Territory falling to 34.85%, which is a real governance change because it ends sole control and gives ZYT a state-owned automotive counterweight. But it does not erase the parent risk. The U.S. Department of Defense published DJI on its Chinese military companies notice in January 2025, a federal court later allowed that designation to stand, and DJI itself appealed in October 2025 after losing in district court. The FCC's covered-list regime is not a direct ban on ZYT ADAS controllers, yet the broad UAS and affiliate scrutiny means European OEMs and any US-facing
    counterparties still have to ask whether a DJI-linked supplier can become a procurement or reputational problem later. FAW is therefore a buffer, not a cure.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
