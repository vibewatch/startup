- id: customer-and-regulatory-risk-cluster
  title: Customer concentration and regulatory tightening can compound each other
  body: 'ZYT''s commercial proof is real, but the visible revenue base still looks narrower than the logo wall. Official materials now claim 34 customers and ecosystem partners plus more than 130 nominations, yet the strongest production proof still clusters in Volkswagen JV programs, SGMW, Chery, and FAW/Hongqi. That makes concentration, not demand existence, the core underwriting problem. Volkswagen is the clearest example: it is the largest visible model family on ZYT''s official site, while also building China-specific chips through Carizon with Horizon. FAW creates a second concentration layer because it is now both a capital provider and a customer family. At the same time, China''s post-2025 rule set is getting materially stricter. MIIT and SAMR now require fuller validation, filings, event reporting, and tighter OTA governance; public guidance and subsequent reporting also show marketing language and emergency updates being pulled into a far more recall-like compliance frame. The
    Baidu robotaxi outage in 2026 matters even though ZYT is not a robotaxi vendor because it proves that one high-profile systems incident can change licensing and safety supervision quickly across the wider smart-driving sector.'
  claimRefs:
