- id: opacity-leadership-and-execution
  title: Financial opacity and scale execution keep residual risk elevated
  body: 'The remaining risks are the ones public diligence still cannot fully clear. ZYT has scale signals: the company says the team exceeded 1,800 by end-2025, with more than 1,000 R&D staff and more than 500 intelligent-manufacturing and quality engineers. That scale supports execution, but it also implies a heavy fixed-cost base that cannot be underwritten because ZYT does not disclose standalone revenue, gross margin, cash balance, burn, or OEM revenue concentration. The best visible valuation mark remains 36Kr''s January 2024 report of a roughly RMB10 billion fundraising ask, which is directionally useful but clearly stale after the FAW deal. Leadership disclosure is also thin relative to the company''s ambition. Shen Shaojie is the most visible public spokesperson in the retained source set, while Europe only gained a named regional head, Nils Oldemeyer, in September 2025. Manufacturing concentration is similarly unresolved: public materials highlight the first automotive-grade factory
    in 2019 and point to Shenzhen as the operating base, but they do not disclose a second automotive production site. Investors can therefore identify mitigations, yet still cannot dismiss key-person, single-site, or capital-efficiency risk as solved.'
