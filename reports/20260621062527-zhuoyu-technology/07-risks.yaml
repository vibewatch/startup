- id: TR003
  title: Regulatory risk timeline
  columns:
  - Regulation / event
  - Issuer
  - Effective date
  - Requirement
  - ZYT exposure
  rows:
  - - Intelligent connected vehicle admission / recall / OTA notice
    - MIIT + SAMR
    - '2025-02-25'
    - Requires stronger testing, parameter filing, event reporting, and coordinated admission / recall governance.
    - Raises launch-compliance burden for every assisted-driving release.
  - - Driver-assist marketing and setup guidelines
    - Chinese industry regulators reported by CnEVPost
    - '2025-02-28'
    - Bars implying self-driving, requires exit strategies, and tightens driver-monitoring expectations.
    - Constrains product naming, HMI, and OEM marketing claims.
  - - Stricter OTA and autonomous-driving implementation summary
    - APA Engineering summary of MIIT/SAMR changes
    - '2025-04-16'
    - Frames OTA changes and autonomous-driving functions as needing stricter process control and approvals.
    - Makes fast feature rollout more operationally expensive.
  - - Misleading autonomous-driving ad ban / beta-test clampdown
    - MIIT meeting reported by electrive
    - '2025-04-17'
    - Bans terms like autonomous driving or intelligent driving in marketing and discourages public beta testing.
    - Forces conservative messaging and slower validation-to-launch cycles.
  - - Robotaxi permit suspension after Baidu outage
    - Chinese regulators reported by multiple outlets
    - '2026-04-29'
    - Paused new autonomous-vehicle permits and ordered stronger safety self-inspection after a mass outage.
    - Shows that one sector incident can tighten oversight even outside ZYT-specific deployments.
  notes: The timeline mixes primary notices with well-corroborated contemporaneous reporting when closed-door implementation details were not published as standalone official texts.
