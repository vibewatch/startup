- id: TR002
  title: Regulatory / legal risk register
  columns:
  - Risk dimension
  - Current status
  - Mitigation
  - Monitoring signal
  rows:
  - - DoD Chinese military company designation
    - DJI remained on the list after the September 2025 court ruling and appealed in October 2025.
    - FAW now co-controls ZYT and DJI statements emphasize lack of state or military control.
    - Any new US list action, OEM compliance screening, or distributor contract carve-out.
  - - FCC / US procurement spillover
    - The FCC covered-list regime captures foreign-produced UAS and affiliate-style scrutiny but does not publicly name ZYT ADAS products.
    - ZYT sells automotive ADAS rather than US telecom or public-safety drone gear.
    - Language extending affiliate scope, procurement exclusions, or automotive electronics scrutiny.
  - - European OEM perception risk
    - Europe is only now being entered through Braunschweig, so procurement teams can still decide the DJI lineage is too noisy.
    - Local German entity, FAW counterweight, and independent ZYT branding can help with reassurance.
    - Delay in Europe JV wins, extra diligence requests, or public sanctions-related customer questions.
  - - Control and beneficial-owner complexity
    - New Territory remains a large shareholder at 34.85% even after FAW becomes the largest single shareholder at 35.80%.
    - Joint control lowers sole-owner optics and may create governance balance.
    - Board control terms, future equity transfers, or any shift that restores one-sided control.
  notes: This table separates legal status from practical commercial exposure; the key question is not only whether ZYT is restricted today, but whether counterparties decide it is harder to onboard tomorrow.
