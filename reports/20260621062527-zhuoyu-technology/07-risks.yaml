- id: price-chip-and-technology-disruption
  title: Price compression, US-chip exposure, and end-to-end disruption pressure the moat
  body: 'The next risk cluster is strategic rather than legal: ZYT has to defend a cost-efficient ADAS position while the whole category standardizes downward. BYD has already pushed high-order smart-driving hardware cost to roughly RMB4,500 in the most aggressive mass-market case, while Nullmax, Black Sesame, and DeepRoute are all framing advanced ADAS as something that can move into RMB80,000 to RMB150,000 vehicles. Independent market trackers show why that matters: L2 and above penetration in China passed 56% in H1 2025, and highway NOA penetration accelerated sharply through 2025, which means intelligent-driving features are becoming table stakes faster than suppliers can preserve premium pricing. ZYT still has a real response because it built low-compute stereo capability and in-house controller and sensor manufacturing. But its compute ladder remains visibly dependent on US-origin silicon. TI''s TDA4VH-Q1 anchors the low-compute proposition, while ZYT''s Qualcomm summit disclosures
    tie higher tiers to SA8650P and SA8775P. No public domestic fallback is disclosed in the retained source set. That makes chip access, E2E data scale, and fast model iteration central to whether today''s edge becomes tomorrow''s commodity.'
