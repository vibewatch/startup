  title: Customers
  summary: Zhuoyu Technology has real customer proof with Volkswagen, SGMW, Chery, and FAW/Hongqi, but the public evidence still collapses 34 official partners into a much smaller set of named, production-proven accounts. That makes customer quality credible, yet also implies concentration risk around a few Chinese OEM groups, with BYD illustrating how nomination headlines can fail to mature into durable SOP revenue.
sections:
- id: named-customer-roster-and-proof
  title: Named customer roster and the strength of public adoption proof
  body: 'ZYT does have real customer proof, but the quality of that proof is uneven across the roster. Official surfaces now claim 34 customers and ecosystem partners, more than 130 model nominations, and a large model gallery led by Volkswagen joint-venture programs. That matters because it moves the company beyond a generic logo wall: the official about page names multiple SAIC-VW and FAW-VW production vehicles, while third-party reporting independently confirms that current clients include Volkswagen, SGMW, Chery, FAW Group, Dongfeng, and GWM. The strongest public evidence is concentrated in four accounts. Volkswagen is the deepest visible account by model count, SGMW has the clearest chronology from first OEM announcement to first SOP, Chery provides proof that ZYT can win outside its earliest partner set, and FAW/Hongqi demonstrates upward movement into premium and state-owned programs. By contrast, Dongfeng, GWM, and BAIC remain public-relationship names with thinner model-level proof
    in the retained source set. The right reading is not that those logos are false, but that investors should underwrite the customer base based on production-proven accounts rather than raw partner count alone.'
