  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: Direct model-level or case-study evidence for the unnamed portion of the 34-partner roster, especially Dongfeng, GWM, BAIC, and any ecosystem partners beyond OEM logos.
    whyItMatters: Without model-level proof, the published logo wall can overstate diversification and understate reliance on a few anchor accounts.
    diligencePath: Request a full customer roster with nomination status, SOP status, and model names, then reconcile it against the official logo wall and recent launch press materials.
    relatedQuestionRefs:
    - QU014
    - QU024
    - QU025
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: revenue-concentration
    missingEvidence: Customer-level revenue mix, top-customer share, and platform share by OEM group.
    whyItMatters: The investability of the customer base depends on whether visible model depth at VW, SGMW, or FAW translates into outsized revenue dependence.
    diligencePath: Request management cohort data showing revenue by top five OEM groups, nomination conversion by customer, and gross-margin differences between anchor and tail accounts.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU025
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-and-contracts
    missingEvidence: Contract length, renewal mechanics, NRR/GRR, warranty obligations, and platform carryover rates by OEM.
    whyItMatters: Repeated model launches are a helpful proxy for stickiness, but they do not prove contractual durability or downstream economics.
    diligencePath: Ask for sample commercial terms, renewal history, post-SOP support obligations, and evidence of share retention across generation changes within the same OEM family.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU006
  - type: conflicting-data
    severity: minor
    topic: byd-durability
    missingEvidence: A confirmed OEM or supplier disclosure showing whether the reported BYD Sea Lion program reached SOP, was replaced, or was canceled.
    whyItMatters: BYD is the cleanest available test case for whether ZYT can hold a top-tier OEM after early nomination headlines.
    diligencePath: Obtain supplier nomination records, SOP confirmation, or BYD-side configuration disclosures for Sea Lion and successor smart-driving programs.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU004
