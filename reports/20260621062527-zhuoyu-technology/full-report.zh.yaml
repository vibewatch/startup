              证据最扎实的乐观论点是：ZYT 能交付一套成本有竞争力、立体视觉优先的 ADAS 栈，相比许多头部对手，用更少算力和更少高端传感器，同时覆盖 ICE 和 EV 项目。32 TOPS 城市 NOA 证明点、DJI
