      - number: '8.2'
        title: 可比公司暗示相对旧标记存在上行空间，但不足以与领军者平起平坐
        blocks:
          - type: paragraph
            body: >-
              这组可比对象主要作为一次折价练习有用。华为的引望是显而易见的上限参照：第一财经报道阿维塔以人民币 115 亿元收购 10%， 意味着约人民币 1,150
              亿元的股权价值，对应一个横跨智能驾驶、座舱、车控、云、车灯和车载设备的平台，且预期还会有其他 OEM 投资者加入。卓驭不配享有任何接近该平台溢价的估值，因为它缺乏华为的生态广度、品牌力和战略中心性。地平线提供了
              第二个基准：它已是一家上市的国内智能驾驶玩家，正从芯片走向软硬件一体化方案，同时通过 Carizon 与大众共同开发 中国专属芯片。Mobileye 代表信任谱系的另一端，拥有全球 ADAS
              公信力和现有的一汽关系，但采用更高成本、面向高端的架构。 Momenta 是在 OEM 广度上最接近的软件主导型私有同业，已声称拥有超过 130 个签约车型和数十万辆上路车辆。黑芝麻以及
              Nullmax/DeepRoute 联盟则展示了一个更小或更激进于成本的同业会是什么样子：公开市场渠道或强劲的商业化叙事，可以与
              当下温和的收入、沉重的亏损或单芯片大众市场战略并存。相对于所有这些对象，卓驭因真实的量产证据和客户广度而值得加分， 但仍应因财务不透明、大疆地缘政治包袱以及围绕少数 OEM 家族的集中度而被大幅折价。
