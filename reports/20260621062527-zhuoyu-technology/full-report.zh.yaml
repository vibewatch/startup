      - number: '4.4'
        title: 资本充足性论点和披露阻碍
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是 ZYT 有没有市场相关性；公开证据已经很清楚。真正难的问题是，公司是否有足够资本，支撑一个劳动力密集、合规密集、依赖芯片的 Tier 1 模式，直到定点管线转化为可持续现金流。FAW
              交易是最强的正面信号，因为它把资本与一线国有 OEM 对齐，降低未来定点中的交易对手风险，也可能提升供应商采购信用。但公开披露仍低于投资者检验偿付能力或利润率轨迹所需的水平。没有独立
              P&L、没有披露现金余额、没有 burn rate、没有债务表、没有客户集中度表、没有单车 ASP 披露，也没有把立体硬件、域控制器、软件和上市后支持拆开的毛利桥。即便 >RMB3.6bn
              这个头条方向上有帮助，也没有完全拆分为新进一级资本、二级转让价值或战略合作承诺。结果是一个建设性但不完整的资本充足性论点：如果 FAW 支持是真实运营资本加订单流，ZYT
              看起来具备融资性；但没有管理层尽调，公开记录不足以承销跑道、现金转化或利润率质量。
