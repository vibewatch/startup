  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 大疆（DJI）的阴影仍是最难对冲的单一风险
        blocks:
          - type: paragraph
            body: >-
              严重程度最高的非产品风险，是公司继承自大疆的阴影。卓驭在法律上是一家独立的深圳实体，如今拥有自己的条款、隐私政策和 面向客户的品牌，但公开的所有权链条仍然贯穿新疆域（New
              Territory）——这家与大疆关联的股东在一汽交易前持股 70.65%。 2025 年 9 月的市场监管总局（SAMR）备案以及 CnEVPost 的报道显示，一汽升至 35.80%，新疆域降至
              34.85%，这是一项实质性 的治理变化，因为它终结了单一控制，并为卓驭引入了一个国有汽车制衡力量。但这并未消除母公司风险。美国国防部于 2025 年 1
              月将大疆列入其中国军事企业名单，一家联邦法院其后允许该认定成立，大疆本身在地区法院败诉后于 2025 年 10 月提起上诉。 FCC 的清单（covered-list）机制并非对卓驭 ADAS
              控制器的直接禁令，但广泛的无人机系统（UAS）及关联方审查意味着欧洲 OEM 以及任何面向美国的交易对手，仍不得不考量一家与大疆关联的供应商日后是否会成为采购或声誉问题。因此一汽是缓冲， 而非解药。
