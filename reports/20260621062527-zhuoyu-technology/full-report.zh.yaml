    type: matrix
    layout: wide
    summary: 剩余风险分布显示，集中度和监管收紧落在最高可能性 / 最高影响的格子里，地缘政治外溢风险紧随其后。
    approximationNotes: 风险位置是定性判断，依据来源支持的剩余敞口，不是建模后的概率分布。
    claimRefs:
      - CR003
      - CR007
      - CR012
      - CR017
      - CR020
      - CR022
      - CR028
      - CR034
      - CR039
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - label: n/a
              tone: neutral
            - label: 领导层梯队不透明
              tone: warning
            - label: 财务不透明
              tone: warning
            - label: 监管收紧；主机厂集中；价格压缩
              tone: negative
        - label: 中等可能性
          values:
            - label: 欧洲商业化摩擦
              tone: neutral
            - label: 单一地点执行风险
              tone: warning
            - label: 美国芯片依赖；端到端冲击
              tone: warning
            - label: DJI 地缘政治阴影
              tone: negative
        - label: 低可能性
          values:
            - label: n/a
              tone: neutral
            - label: n/a
              tone: neutral
            - label: Tesla 对标冲击
              tone: warning
            - label: n/a
              tone: neutral
        - label: 极低可能性
          values:
            - label: n/a
              tone: neutral
            - label: n/a
              tone: neutral
            - label: n/a
              tone: neutral
            - label: n/a
              tone: neutral
  - id: FR002
    title: 监管时间线
    type: timeline
    layout: wide
    summary: 2025 年 2 月到 2026 年 4 月，中国监管从收紧准入和营销规则，推进到由事故触发的许可冻结。
    approximationNotes: 时间线同时纳入一手通知，以及同期报道中来自闭门监管会议的执行细节。
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR045
    data:
      items:
        - date: '2025-02-25'
          label: MIIT/SAMR 正式通知
          detail: 智能网联汽车的准入、召回、OTA 和事件报告责任收紧。
          tone: warning
          claimRefs:
            - CR016
            - CR017
        - date: '2025-02-28'
          label: 辅助驾驶指南发布
          detail: 营销不得再混淆辅助驾驶和自动驾驶，并且必须支持更安全的驾驶员监督。
          tone: warning
          claimRefs:
            - CR018
        - date: '2025-04-17'
          label: 据报道，广告禁令和 beta 测试收紧
          detail: 行业报道称，中国正在禁止误导性的自动驾驶话术，并减少面向公众的 beta 式发布。
          tone: warning
          claimRefs:
            - CR019
        - date: '2026-04-29'
          label: Baidu 故障触发许可冻结
          detail: 一次大规模中断后，监管机构暂停新的 robotaxi / AV 许可，并要求更强的安全自查。
          tone: negative
          claimRefs:
            - CR020
            - CR021
  - id: FR003
    title: 风险 KPI 摘要
    type: kpi
    layout: compact
    summary: 商业相关性确实存在，但集中度、监管和披露深度上的敞口仍然偏高。
    approximationNotes: 分数是基于留存公开证据集得出的 0-10 序数判断，不是管理层报告的 KPI。
    claimRefs:
      - CR007
      - CR015
      - CR022
      - CR028
      - CR034
      - CR039
      - CR041
    data:
      items:
        - label: 地缘政治风险
          score: 8
        - label: 客户集中度
          score: 8
        - label: 监管负担
          score: 8
        - label: 成本 / 芯片压力
          score: 7
        - label: 披露质量
          score: 3
  - id: FV001
    title: 可比公司定位 KPI 快照
    type: kpi
    layout: standard
    summary: ZYT 的规模已足以跨过创业公司门槛，但相较头部战略可比公司和上市可比公司，体量仍小得多，透明度也低得多。
    approximationNotes: 上市公司数值只作为方向性锚点，不是实时交易报价；留存本地资料包不是市场数据终端。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV010
    data:
      items:
        - label: ZYT 最近一次披露融资估值
          value: 10
          unit: RMB bn
          note: 媒体报道的 2024 年 1 月融资锚点
        - label: FAW 战略投资标题
          value: 3.6+
          unit: RMB bn
          note: ZYT 官方声明，并非拆解后的股权价格
        - label: 客户 / 生态合作伙伴
          value: 34
          unit: count
          note: 2025 年官方里程碑表述
        - label: 定点合作
          value: 130+
          unit: models
          note: 2025 年官方里程碑表述
        - label: 量产车型
          value: 20+
          unit: models
          note: CnEVPost 对现有客户组合的披露
        - label: Yinwang 隐含估值
          value: 115
          unit: RMB bn
          note: Avatr 以 CNY11.5bn 购买 10% 股权
  - id: FV002
    title: 估值区间瀑布逻辑
    type: flow
    layout: wide
    summary: 公开估值逻辑从一个过时但可信的 2024 年估值标记出发，因规模和战略背书上调，再因不透明和风险折价回落。
    approximationNotes: 这张瀑布图是概念性的，不是算术公式；它解释调整方向，而不是给出单一确定公式。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV031
      - CV032
      - CV036
      - CV037
    data:
      nodes:
        - id: mark2024
          label: 2024 年 1 月约 RMB10bn 估值标记
        - id: scale
          label: + 量产规模和 130+ 个定点
        - id: faw
          label: + FAW 资本和控制权支持
        - id: europe
          label: + 欧洲期权价值
        - id: opacity
          label: '- 收入和利润率不透明'
        - id: geo
          label: '- DJI / 监管折价'
        - id: range
          label: 基准区间 RMB10-20bn
      edges:
        - from: mark2024
          to: scale
          label: 官方规模已显著高于 2024 年初
        - from: scale
          to: faw
          label: 战略背书增强转化可信度
        - from: faw
          to: europe
          label: 可选性拓宽叙事，但还没有转化为经济性
        - from: europe
          to: opacity
          label: 缺失 P&L 和积压订单，仍无法精确定价
        - from: opacity
          to: geo
          label: 加入制裁 / 合规 / 集中度折价
        - from: geo
          to: range
          label: 当前站得住脚的公开区间
  - id: FV003
    title: 价值驱动因素与流动性时间线
    type: timeline
    layout: wide
    summary: ZYT 的价值叙事已从早期主机厂验证，推进到量产证据和战略资本；但清晰的流动性路径仍取决于更充分的披露。
    approximationNotes: 时间线只标示本地证据包中留存的、与估值相关的里程碑。
    claimRefs:
      - CV007
      - CV009
      - CV028
      - CV033
      - CV037
    data:
      items:
        - date: '2019'
          label: 首个 Volkswagen Group China 主机厂项目
          detail: 早期主机厂验证确立了 ZYT 在合资和传统主机厂渠道中的长跑道。
          tone: positive
          claimRefs:
            - CV007
        - date: '2022'
          label: 首个 ADAS 量产 SOP
          detail: ZYT 从开发项目跨入商业量产现实。
          tone: positive
          claimRefs:
            - CV007
        - date: '2024-01-24'
          label: 约 RMB10bn 融资估值公开
          detail: 36Kr 和 CnEVPost 将 ZYT 描述为战略性智驾融资标的，而不是普通风险投资轮次。
          tone: neutral
          claimRefs:
            - CV001
            - CV002
        - date: '2025-09-08'
          label: 欧洲战略和德国分支发布
          detail: Braunschweig 布局增加了可选性，但尚未证明多元化或流动性。
          tone: positive
          claimRefs:
            - CV009
            - CV033
        - date: '2025-09-22'
          label: FAW 持股 35.80%，共同控制获确认
          detail: 战略资本支持改善上行情景，同时也提高了退出走向战略交易、而非纯公开市场的概率。
          tone: positive
          claimRefs:
            - CV003
            - CV032
  - id: FV004
    title: 估值折价评分卡
    type: kpi
    layout: compact
    summary: 量产证据和战略背书都很强，但透明度和地缘政治洁净度仍是 ZYT 无法被视作优质上市可比公司的两大原因。
    approximationNotes: 分数是基于留存公开证据得出的 0-10 序数判断，不是管理层报告的 KPI。
    claimRefs:
      - CV005
      - CV023
      - CV025
      - CV031
      - CV036
    data:
      items:
        - label: 量产证据
          score: 8
        - label: 战略资本支持
          score: 8
        - label: 技术广度
          score: 7
        - label: 披露质量
          score: 3
        - label: 地缘政治洁净度
          score: 4
        - label: 多元化质量
          score: 4
