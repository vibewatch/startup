companyProfile:
  summary: >-
    Zhuoyu Technology（ZYT）是一家总部位于深圳的自动驾驶技术公司，源自 DJI 2016 年组建的汽车项目团队。2021 年以 DJI Automotive 身份运营后，公司在 2022–2023 年通过香港控股公司
    New Territory Technology 拆分为独立主体，并在 2024 年 6 月正式更名为 ZYT。公司向 OEM 客户销售 ClixPilot 产品套件——一套可扩展的 ADAS 栈，覆盖 32 TOPS 到 100+
    TOPS 配置——客户包括 Volkswagen 合资公司、SAIC-GM-Wuling、Chery、FAW Group、Dongfeng、Great Wall 和 BAIC。到 2025 年末，公司拥有 34
    个客户或生态合作伙伴、130+ 个定点合作、20+ 款量产车型和超过 1,800 名员工。FAW Group 通过 2025 年 9 月向 SAMR 申报的股权收购成为最大单一股东（35.80%），背后对应官方披露的超过 RMB
    36 亿元战略投资。ZYT 的核心技术差异化在于双目立体视觉与惯性融合，能在 32 TOPS 上跑低成本城市 NOA——不依赖激光雷达或高精地图——并在 TI 和 Qualcomm 计算环境上提供可扩展的端到端平台。
  foundedDate: '2016-01-01'
