  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              ZYT 应放在量产 ADAS 和智能驾驶系统的汽车供应商市场中承销，而不是放进整个自动驾驶或 robotaxi 宇宙。公开 Solution 和 Technology 页面把公司放在主动安全、泊车、高速
              NOA、城市 NOA、域控制器、感知传感器、验证和软件部署的支出桶里，覆盖 EV 和 ICE 乘用车。这个边界重要，因为即使不假设 L4 robotaxi 经济性，中国市场按车辆数也已经足够大。XEPS
              称，2025 年上半年中国乘用车 L2+ 渗透率达到 56.1%，L2++ 达到 17%，ADAS 摄像头装机 4,466.8 万颗，平均每车 4.2 颗，意味着仅上半年就约有 1,060
              万辆乘用车搭载了有意义的 ADAS 内容。因此，证据最扎实的中国 TAM 落在带多传感器 ADAS 和导航功能的量产乘用车，而不是稀少的 robotaxi 车队。全球 TAM 方向上更大，因为 ZYT
              已在欧洲本地化，并定位 L2-L4 能力产品；但保留的资料包没有给出 ZYT 精确品类的干净全球收入总量，所以本章把全球规模保留为有边界的尽调缺口，而不是编造一个宏大总数。
