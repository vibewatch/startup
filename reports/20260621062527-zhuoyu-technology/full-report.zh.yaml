            body: >-
              核心承销问题是集中度。ZYT 的官方合作伙伴数量很广，但真正重要的证据栈很窄：Volkswagen 拥有最大的可见车型集群，SGMW 提供最早的可复制 SOP 证据，FAW
              现在既是客户家族也是最大股东。Chery 强化了名单，但公司看起来仍高度集中在中国乘用车 OEM，欧洲更多是管线多元化，而不是当前收入缓冲。这种集中度好坏并存。正面看，在大型 OEM
              集团内部反复拿下平台，可以提高续约概率，因为每增加一款车型都能复用验证工作，并让工程交接更高效。负面看，少数买方集团可能主导商业条款、拖慢定点转化，或把路线图推向它们自己的内部栈。Volkswagen
              是最清楚的例子：它目前是 ZYT 最丰富的可见账户，但它也在与 Horizon 投资开发中国特定智能驾驶栈。这意味着账户深度和依赖性是同时到来的，不是分开到来的。
