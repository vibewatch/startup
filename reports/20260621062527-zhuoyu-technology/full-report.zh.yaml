      - number: '1.2'
        title: 产品范围、技术栈和规模信号
        blocks:
          - type: paragraph
            body: >-
              官方产品页显示，公司试图覆盖完整 ADAS 栈，而不是只做单一模块。ClixPilot 被定位为核心智能驾驶套件，功能横跨主动安全、泊车、高速 NOA、城市 NOA，以及座舱与驾驶融合。Solution 和
              Technology 页面也披露了这种定位背后的架构逻辑：ZYT 支持以立体视觉为先的配置、可选 LiDAR 融合、从 32 TOPS 起步并延伸到更高算力平台的控制器配置，以及面向高端系统、扩展至 1,500+
              TOPS 的更大计算路线图。这与第三方报道一致：ClixPilot 之前使用的“成行平台”命名强调双目视觉和高性价比落地，而不是强制配置激光雷达。规模信号很强，但仍主要来自公司口径。ZYT 称，截至 2025
              年末员工超过 1,800 人，其中核心研发超过 1,000 人，工程和制造人员超过 500 人，同时拥有 34 个客户或生态合作伙伴、超过 130 款定点车型。独立文章印证了更早节点：2021 年 4 月员工超过
              700 人，2021 年 12 月接近 1,000 人。虽然没有公开薪酬或收入披露，后续员工数说法在方向上仍可信。
