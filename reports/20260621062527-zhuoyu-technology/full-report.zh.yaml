        title: 传感器路线和算法架构
        blocks:
          - type: paragraph
            body: >-
              传感器和软件栈是 ZYT 差异化故事的核心。官方技术材料强调以惯性辅助立体视觉作为基础 3D 感知方法，再向上扩展到惯性立体加长焦三目立体，最终到面向更高冗余场景的 LiDAR-Stereo
              Onebox。独立技术报道也印证了这一叙事：Baojun Yunhai 被呈现为 32 TOPS 端到端城市 NOA 落地案例，Hongqi Tiangong 05
              则被称为首个量产惯性三目立体系统，结合长焦和双目视觉，点云密度高于主流激光雷达，探测距离更长。软件侧，ZYT
              公开声称拥有现代端到端栈，训练来自大规模轨迹预训练、专家数据上的强化学习、推理时多模态提示，以及为个性化驾驶行为和 GenDrive 供给的新一代世界模型。公开资料包明确支持 ZYT 通过 Stereo
              Occupancy Network 实现占用式感知，但没有披露单独 BEV 模型卡或详细时延 / 失效率基准，因此技术透明度仍落后于叙事雄心。
