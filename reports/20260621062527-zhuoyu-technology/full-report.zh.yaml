      - - Avatr 投资 Huawei Yinwang
        - 2024-08
        - CNY11.5bn 买 10%，隐含约 CNY115bn
        - 说明战略 OEM 资本可以用极高溢价给智能驾驶平台定价
        - Yinwang 生态宽得多，品牌势能也强于 ZYT
      - - FAW 收购 35.80%
        - 2025-09
        - SAMR 确认控制权转移
        - 证明战略买方认真出手，治理也发生变化
        - 备案未披露现金对价、企业价值，或新股与老股比例
