              想要看得见的能力提升，但不想接受没有上限的算力膨胀。ZYT 也保留了比纯视觉叙事更多的传感器可选性：立体、立体加长焦，以及激光雷达-立体产品，让 OEM 能按平台在成本、冗余和感知密度之间取舍。相比
