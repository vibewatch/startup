      - number: '1.4'
        title: 股权转型、估值标记和战略股东
        blocks:
          - type: paragraph
            body: >-
              股权故事是本章验证最扎实的部分之一，因为它同时有中国反垄断申报和二级报道支撑。SAMR 2025 年公告以及 CnEVPost 后续文章显示，2022 年 10 月 3 日成立于香港的控股主体 New
              Territory Technology Company Limited，在拟议交易前持有 ZYT 70.65% 股权并实施单独控制。交易后，FAW 将持有 35.80%，New Territory 持有
              34.85%，二者共同控制，公司最大单一股东变为 FAW。这在战略上重要，因为 FAW 从客户或合作伙伴转为治理关键的支持方，也与 ZYT 自称 2025 年获得 FAW 超过 RMB 36
              亿元战略投资相吻合。估值证据更弱，但方向上仍有用：36Kr 2024 年 1 月报道称 DJI Automotive 正以约 RMB 100 亿元估值融资，BYD 和 FAW 表达过投资兴趣。公开资料没有把
              2024 年估值标记与后续 FAW 交易条款对齐，因此估值应被视为私募市场的指示性信号，而不是当前公允价值事实。
