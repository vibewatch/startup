        title: 优势、脆弱点和 OEM 重叠
        blocks:
          - type: paragraph
            body: >-
              ZYT 最清楚的优势，是算力效率、平台灵活性，以及适配传统或合资 OEM：这些车企需要中国特定智能驾驶升级，却不想把整车叙事交给一个超级品牌。公司公开客户基础已经覆盖 Volkswagen
