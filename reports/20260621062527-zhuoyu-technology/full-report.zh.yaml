      - number: '8.3'
        title: 当下合理的估值区间很宽，因为规模信号强劲但经济数据被隐藏
        blocks:
          - type: paragraph
            body: >-
              核心分析问题是，在经审计的经济数据出现之前，卓驭应在 2024 年 1 月标记之上交易多少。看多论点很容易理解：官方资料如今 显示 34 家客户及生态伙伴、超过 130 个定点合作、超过 20 款量产车型、超过
              1,800 人的团队，以及持续推进的欧洲建设。这些 事实支持这样的观点：卓驭并非概念阶段的 ADAS 初创公司；它已经像一家规模化的 Tier-1 式智能驾驶供应商那样运营，拥有
              可观的项目深度。折价论点同样重要。公开来源仍未披露独立收入、毛利率、现金余额、在手订单或按收入计的客户集中度，因此 投资者无法检验定点是否能转化为健康的现金生成。市场大背景也比 2024 年更严酷：XEPS 显示
              L2+ 渗透率和高速 NOA 正在 人民币 10 万至 20 万元价位带快速放量，但新浪/界面称比亚迪已将高阶智能驾驶硬件成本压低至约人民币 4,500 元，而 Nullmax
              和黑芝麻正以单芯片方案瞄准主流车型。再加上与大疆关联的地缘政治审查、更严格的 OTA 和 ADAS 监管，以及可见的 大众/一汽集中度，恰当的结论是一个宽但有纪律的区间。基于当下的公开证据，约人民币 100 至
              200 亿元是站得住脚的，若转化 令人失望，约人民币 80 至 100 亿元是可信的下行，而高于约人民币 200 亿元的估值则需要新证据而非仅靠叙事。
