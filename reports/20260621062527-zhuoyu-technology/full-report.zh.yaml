  - id: TP002
    title: ZYT 竞争优势与脆弱性
    columns:
      - 维度
      - ZYT 位置
      - 最强对手
      - 证据
      - 含义
    rows:
      - - 算力效率
        - 导航功能可从 32 TOPS 起运行，并可跨 TI 与 Qualcomm 扩展
        - 高端是 Huawei；国内芯片经济性上是 Horizon
        - 官方网站、Sina Jiemian 与 ZOL 报道显示 32 TOPS、100 TOPS 和 1500+ 控制器范围
        - ZYT 可以向下竞标市场，同时不放弃中高端项目
      - - 传感器策略
        - 双目优先、双目加长焦、激光雷达双目选项，让冗余选择保持开放
        - Tesla 强在纯视觉简洁；Huawei 强在激光雷达丰富的高端冗余
        - ZYT 技术与方案页面强调密集 3D 点云和可配置传感器
        - ZYT 可以按平台定制 BOM，而不是强推一种传感器教义
      - - OEM 广度
        - 在传统 OEM 与合资渠道强，但仍窄于 Huawei 和 Momenta
        - Huawei 和 Momenta
        - ZYT 列出 VW、Wuling、Chery、FAW、Dongfeng、GWM；Momenta 宣传 130 款车型；Huawei 深化 Wuling 合作并扩展伙伴资本网络
        - 广度已经足以产生影响，但还不足以建立品类领导地位
      - - 品牌拉力
        - 行业内有知名度，但面对终端消费者弱于 Huawei 和 Tesla
        - Huawei / Tesla
        - Sina 明确称 ZYT 缺少 Huawei 的品牌优势，而 Tesla 仍是 FSD 的参考名
        - OEM 仍可能借竞争对手品牌销售智能驾驶升级
      - - 平台开放性
        - 支持多种芯片、传感器、ICE 与 EV，并支持未来座舱驾驶融合
        - 芯片生态上是 Horizon；端到端技术栈所有权上是 Huawei
        - 官方与 Sina/ZOL 材料显示 TI、SA8650P、SA8775P 以及多种硬件配置
        - OEM 希望跨配置和车型复用时，这种开放性有价值
      - - 海外叙事风险
        - DJI 背景增加技术可信度，但在部分市场可能带来政策审查
        - Mobileye 或 Bosch 没有这类包袱
        - DJI 声明与 FCC 政策背景显示，中国技术供应链会受到审查
        - 欧洲或其他海外扩张可能需要额外的信任与合规工作
    notes: 该表混合了直接事实和有证据支撑的综合判断；最强对手列指每个维度上最能利用该点的竞争者，并不意味着存在单一通用赢家。
