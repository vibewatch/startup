      - number: '6.2'
        title: 量产证据、定点漏斗和客户经济性
        blocks:
          - type: paragraph
            body: >-
              公开客户故事最好理解为一个从合作伙伴 logo 到定点、再到 SOP 车型的漏斗。官方材料称 ZYT 有超过 130 个定点；首页声称已在 50+ 款车型上量产；后续一篇 CnEVPost
              文章则把目前有证据支撑的基础收窄到超过 20
              款量产车型和具名当前客户。这些说法方向一致：不是每个定点都会变成收入，只有一部分会出现在具名公开项目中。经济上，这门生意像典型汽车先落地、再扩张模式。拿到定点是必要条件，但不充分；真正的切换成本发生在特定车型平台完成验证、标定、集成和安全签核之后。因此，Volkswagen、SGMW
              和 FAW/Hongqi 应该比一次性头条获得更高权重。这也解释了为什么 OEM 议价能力仍然很高。大型车企可以自研、双供，或在谈判中使用规模杠杆，因此 ZYT
              的定价权很可能是项目特定的，而不是生态范围内的。公开证据还显示，非独家很可能是默认状态，意味着 ZYT 必须持续赢下每个新平台，而不能依赖永久 OEM 锁定。
