      - number: '7.3'
        title: 价格压缩、美国芯片依赖与端到端颠覆挤压护城河
        blocks:
          - type: paragraph
            body: >-
              下一组风险是战略性而非法律性的：卓驭必须在整个品类向下标准化的同时，捍卫一个具成本效率的 ADAS 定位。在最激进的 大众市场情形下，比亚迪已将高阶智能驾驶硬件成本压低至约人民币 4,500 元，而
              Nullmax、黑芝麻和 DeepRoute 都将高阶 ADAS 定位为可以下探到人民币 8 万至 15 万元车型的方案。独立市场追踪机构说明了这一点为何重要：2025 年上半年中国 L2 及以上 渗透率超过
              56%，高速 NOA 渗透率在 2025 年全年急剧加速，这意味着智能驾驶功能正以快于供应商维持溢价定价的速度成为
              标配。卓驭仍有真实的应对手段，因为它构建了低算力立体视觉能力以及自有的控制器和传感器制造。但其算力梯队仍明显依赖 美国来源的芯片。TI 的 TDA4VH-Q1
              支撑低算力方案，而卓驭在高通峰会上的披露则将更高阶位与 SA8650P 和 SA8775P 绑定。
              在保留的来源集合中并未披露任何公开的国产替代方案。这使芯片获取、端到端（E2E）数据规模以及快速模型迭代，成为决定 今日优势是否会沦为明日大宗商品的关键。
