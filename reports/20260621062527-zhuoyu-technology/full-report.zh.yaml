        title: 按竞争者类型划分的竞争格局
        blocks:
          - type: paragraph
            body: >-
              画 ZYT 竞争版图，最有用的维度不是表面估值，而是控制点。Huawei/Yinwang 位于市场的生态系统一端，把智能驾驶、座舱、车控、云服务和投资方支持的 OEM
              绑定组合在一起，可能把客户锁进更大的产品架构。Momenta 和 Mobileye 是大型 OEM 项目中最成熟的软件主导全栈替代者；Horizon Robotics 和 Black Sesame
              代表芯片加栈路线，帮助车企本地化算力经济性，并保留更多架构控制权。DeepRoute.ai 和 Nullmax
              是最尖锐的主流价位挑战者，因为二者都把端到端或重视觉软件与国产芯片、量产导向伙伴配在一起。因此，ZYT 不是在打一家单一对手；它在同一笔 OEM 预算里，与生态厂商、芯片联盟、全球老牌公司和 OEM
              自研努力竞争，而这些玩家都在追逐从基础 ADAS 向城市 NOA 和重泊车 L2+ 系统的同一轮迁移。
