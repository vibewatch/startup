      - number: '1.5'
        title: 里程碑、认证、欧洲推进和保留的风险背景
        blocks:
          - type: paragraph
            body: >-
              ZYT 的时间线显示，公司先花多年降低车规级执行风险，再讲更大的全球化故事。官方里程碑页记录了 2018 年深圳道路测试许可、2019 年首个车规级工厂和首个 Volkswagen Group China OEM
              项目、2021 年实验室和功能安全认证、2022 年首个 ADAS SOP，以及 2023 年在深圳卓驭主体下转向独立运营并推出 ClixPilot。到 2025 年，公司开始展示跨多平台的端到端城市
              NOA、GenDrive、车载无人机系统，以及以布伦瑞克子公司和 IAA Mobility 首秀为锚点的欧洲战略。对一家私营供应商来说，认证记录也罕见地广：覆盖 TISAX、A-SPICE、ISO
              9001、14001、45001、27001、ISO 26262 ASIL-D 流程、IATF 16949、ISO 21448 SOTIF 和 ASIL-C
              产品认证。需要保留的风险，不是单纯技术不成熟。第一，ZYT 没有找到独立公开财报，财务仍不透明。第二，公司继承了 DJI 的相邻风险；尽管 DJI
              自身法院声明强调法院未发现政府控制或直接军事关联，其母体仍暴露于美国政策行动。第三，如果 Volkswagen 相关项目和 FAW 治理影响主导商业结果，OEM 和资本集中度可能变得重要。
