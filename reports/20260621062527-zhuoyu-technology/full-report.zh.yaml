  - id: TP001
    title: 竞品对比矩阵
    columns:
      - 竞品
      - 支持方 / 状态
      - 芯片策略
      - 传感器方案
      - 主要 OEM 客户
      - 算力范围 / 平台
      - 城市 NOA 状态
      - ZYT 竞争位置
    rows:
      - - Huawei / Yinwang（Qiankun）
        - Huawei 控制的开放平台；Avatr 和 Seres 各购买 10% 股权
        - 全栈自有生态，加上伙伴资本
        - 激光雷达丰富的高端技术栈，并整合更广的座舱 / 云 / 车控能力
        - Avatr、Seres、SAIC-GM-Wuling Huajing、更广的传统 OEM 生态
        - 高端全栈平台；公开材料包没有披露单一可比 TOPS 数字
        - 已商业化并扩张；Wuling Huajing S 标配 ADS Pro，并可通过 OTA 升级到 ADS 5 Pro
        - 锁定效应最强的对手；只有 OEM 优先看重灵活性和更低系统复杂度时，ZYT 才能赢
      - - Momenta
        - 拥有广泛 OEM 合同基础的独立全栈供应商
        - 软件主导技术栈，可跨伙伴硬件运行
        - 降低对昂贵高精地图依赖之后，强调无图 / 端到端
        - GM、SAIC-Volkswagen、Toyota、Honda；更广泛的 130 款车型合同基础
        - 依赖伙伴平台；保留材料包没有披露为一个固定公开算力层级
        - 高速与城市导航均已商业化，并有全场景辅助驾驶路线图
        - 最可比的广谱软件对手；ZYT 靠 Tier-1 集成和低算力叙事竞争
      - - Horizon Robotics
        - 港股上市的国内芯片与技术栈玩家
        - Journey 系列，并推进芯片 + 软件一体化与 VW 定制 SoC
        - 向多家 OEM 算法开放；以芯片为中心，搭配伙伴技术栈
        - VW Carizon、ZF 相关中国项目、Firefly 以及更广 OEM 群体
        - J6P 为 560 TOPS，Carizon 定制芯片目标 500-700 TOPS，未来 J7 超过 Thor-X
        - 可通过伙伴系统实现城市 NOA，并计划 2026 年量产
        - 国内芯片经济性上的强劲对手；ZYT 用成品控制器加传感器落地能力抵消
      - - DeepRoute.ai
        - 与 Black Sesame 联盟绑定的软件主导自动驾驶公司
        - 与 Black Sesame 下一代平台一体化的芯片加软件方案
        - 偏视觉的城市 NOA 与车队学习取向
        - 多家车企，已上市车型超过十款
        - 基于伙伴芯片；保留材料包中没有一个公开固定 TOPS 数字
        - 已交付 200,000 辆城市 NOA 车辆，并在 2025 年 10 月拿到近 40% 第三方份额
        - 在面向大众车型的低成本主流城市 NOA 上，是 ZYT 最接近的威胁
      - - Nullmax
        - 拿到新 OEM 定点的全栈 ADAS 软件公司
        - 与 Black Sesame 合作的单芯片 C1236 大众市场方案；可跨算力层级扩展
        - 面向主流 ADAS 的视觉方案，覆盖城市记忆、高速导航、记忆泊车
        - 头部中国 OEM 项目定点；更广的量产组合
        - 核心主流方案使用单颗 Black Sesame Wudang C1236
        - 主推主流量产，而不是高端光环定位
        - 在 RMB80k-150k 区间非常接近，ZYT 必须守住性价比
      - - Black Sesame Technologies
        - 国内汽车 SoC 供应商；据 EqualOcean 摘要，2024 年在港股上市
        - Huashan 与 Wudang 芯片家族，正在扩展到基于芯片的解决方案
        - 为伙伴软件提供算力底座，而不是单独面向消费者的全栈品牌
        - 30+ OEM / Tier-1 伙伴；DeepRoute 和 Nullmax 联盟
        - A2000 下一代芯片、C1236 跨域芯片、更广的 Huashan 产品线
        - 通过伙伴间接进入，而不是独立 NOA 品牌
        - 更像赋能者，不是直接正面竞争的品牌对手，但它降低了 ZYT 挑战者的进入门槛
      - - Mobileye
        - 全球上市 ADAS 老牌公司，具备高端 OEM 可信度
        - SuperVision 与 Chauffeur 平台技术栈，传感器组合更丰富
        - 成熟的摄像头 + 雷达 + 偏激光雷达高端架构
        - FAW Hongqi 与全球 OEM 基础
        - 平台级；公开保留材料包没有给出单一可比 TOPS 数字
        - 按 2024/2025 时间表在 FAW 量产
        - 认证与信任强于 ZYT，但成本和复杂度更偏高端项目
      - - Tesla FSD China
        - OEM 自研标杆，也是消费者心智领导者
        - Tesla 自有端到端技术栈
        - 纯视觉监督驾驶技术栈
        - 仅 Tesla，但标杆压力会传导给所有供应商
        - 保留材料包没有披露可用于中国对比表的数据
        - 2026 年在中国以 FSD（Supervised）推出，仍是 Level 2，且对审批敏感
        - 不是直接的 OEM 供应商竞争者，但它是可能重设买方预期的目标标杆
    notes: 覆盖范围是局部而非穷尽：该矩阵聚焦保留的 2025-2026 来源材料中，对 ZYT 传统 OEM 与大众市场 ADAS 投标最相关的对手。若没有单一公开算力数字，单元格以定性描述呈现，而不猜测。
