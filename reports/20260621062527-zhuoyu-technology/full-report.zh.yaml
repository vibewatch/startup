        - 用户数据和车内 HMI 界面
        - 说明 ZYT 知道 ADAS UX 中的隐私义务
        - 未公开按车型项目划分的数据留存周期
      - - OTA 和召回治理
        - MIIT/SAMR 规则要求重大变更备案、审批，并处理修复缺陷 OTA 的召回
        - 功能部署和安全修复
        - ZYT 主打软件定义升级和 OTA，因此这一点重要
        - 公开记录看不到 ZYT 内部 OTA 治理指标
      - - 驾驶辅助营销边界
        - MIIT 指引称，企业不得暗示驾驶辅助就是自动驾驶
        - 命名、主张和 HMI 文案
        - 压缩夸大消费者传播的空间
        - 未披露公开命名政策或车型级防护措施
      - - 产品 / 合作联系入口
        - 联系页面支持产品信息和合作方案提交
        - OEM 和合作伙伴支持流程
        - 暗示公司有正式前台承接部署支持
        - 未公开 SLA 或集成操作手册
      - - 公开招聘入口
        - 社招、校招和实习招聘 URL 仍单独在线
        - 开发者 / 从业者信号
        - 支撑持续人才漏斗和工程招聘意图的证据
        - 保留抓取输出中，可访问页面暴露的职位细节文本很少
    notes: 这张矩阵把公司自身触点和监管叠加层放在一起，因为部署风险既来自内部控制，也来自外部合规要求。
