    title: 可比估值表
    columns:
      - 公司
      - 上市 / 融资状态
      - 估值 / 市值锚点
      - 规模代理指标
      - 与 ZYT 的关键差异
      - 对 ZYT 的隐含参照
    rows:
      - - ZYT
        - 私有；FAW 现为最大股东
        - 2024 年 1 月公开融资标记约 RMB10bn；2025 年 FAW 战略投资标题金额 >RMB3.6bn
        - 34 个客户 / 合作伙伴、130+ 个定点、20+ 款量产车型、1,800+ 名员工
        - 有真实量产证明，但没有独立收入或利润率披露
        - 支撑其基础区间高于纯早期初创公司，但低于披露透明的上市同业
      - - Huawei Yinwang
        - 有 OEM 股权投资者的私有战略平台
        - CNY11.5bn 买 10%，隐含股权价值约 CNY115bn
        - 覆盖驾驶、座舱、控制、云、照明和车载设备的多栈平台
        - 生态锁定和品牌势能远强于 ZYT
        - 只能作为上限参照；ZYT 相对这种平台溢价应大幅折价
      - - Momenta
        - 私有全栈供应商
        - 留存资料包未披露估值；显然是独角兽规模私有同业
        - 130+ 款签约车型；预计到 2025 年 5 月底有 300,000 辆车上路
        - 软件宽度和轻地图规模叙事更强，但没有 FAW 这类公开战略控制权交易
        - 如果定点转化持续，ZYT 可证明有意义的私有科技溢价
      - - Horizon Robotics
        - 香港上市的本土智能驾驶玩家
        - 公开市场基准；规模明显大于 ZYT 上次披露标记
        - J7 路线图、软硬一体推进、VW Carizon 定制芯片合作
        - 拥有公开市场流动性、更强芯片杠杆和更充分披露，优于 ZYT
        - 尽管 ZYT 有战略相关性，仍应大幅折价
      - - Mobileye
        - NASDAQ 上市的全球 ADAS 既有龙头
        - 带全球信任溢价的公开市场基准
        - FAW 既有 SuperVision 和 Chauffeur 量产路线图
        - 相比 ZYT 的中国成本效率故事，其架构认证更高、全球化、更偏高端
        - 可作为信任倍数参照，但 ZYT 的本地成本 / 适配优势应缩小部分差距
      - - Black Sesame Technologies
        - 香港上市的汽车 SoC 供应商
        - 上市的中国小规模同业；招股书披露收入，但 IPO 前亏损很重
        - 2022 年收入 RMB165m；调整后净亏损 RMB700m；15 个车型意向订单和 30+ 个 OEM / Tier-1 合作伙伴
        - 财务更透明，但在控制器-传感器一体化 Tier-1 执行上窄于 ZYT
        - 说明公开市场可以在盈利前给智能驾驶资产定价，但透明度很重要
      - - Nullmax / Black Sesame 主流栈
        - 私有软件 + 芯片联盟
        - 留存资料包未披露标题估值
        - 单芯片 C1236 大众市场方案；面向 RMB80k-150k 车型、可量产的 ADAS
        - 更接近 ZYT 的大众市场战场，并明确以降本为导向
        - 如果 ZYT 拿不出更好的经济性，主流市场的倍数扩张空间会被封顶
