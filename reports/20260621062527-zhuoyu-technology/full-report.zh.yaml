      - number: '4.2'
        title: 收入模式和定点带来的可见度
        blocks:
          - type: paragraph
            body: >-
              公开资料一致将 ZYT 描述为面向 OEM 销售硬件、软件和集成系统的 B2B 智能驾驶供应商，而不是消费者订阅平台。最早的 CnEVPost 发布报道称，DJI Automotive
              将提供硬件方案、软件方案和软硬件打包方案；当前 Solution 和 Technology 页面通过 ADAS 控制器、立体与三目相机感知、激光雷达-立体 onebox 产品、城市和高速导航功能、泊车栈、HMI
              软件和 OTA 能力，把同一逻辑呈现得更成熟。因此，收入应来自项目定点、控制器和传感器出货、软件使能内容，以及嵌入 OEM 上市流程中的工程集成。相比从零起步的创业公司，ZYT 的可见度更好，因为公司现在披露
              34 个客户和生态合作伙伴、超过 130 个车型定点，以及客户项目中超过 20 款量产车型。即便如此，定点数量只是管线代理指标。它不揭示装配率、BOM
              内容、软件附加、上市节奏，或有多少定点落在低销量配置上。财务上，定点降低了生存性需求风险，但不能替代积压订单、已签收入或已确认毛利。
