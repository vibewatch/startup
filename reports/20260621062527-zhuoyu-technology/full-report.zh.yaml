      - number: '2.3'
        title: 市场准入的监管顺风与逆风
        blocks:
          - type: paragraph
            body: >-
              在中国智能驾驶市场，监管不再是背景变量，而是市场准入本身的一部分。关键一步是 2025 年 2 月 28 日 MIIT 与 SAMR 发布的通知，以及智能网联汽车产品准入、召回和 OTA
              管理相关技术指引。保留的监管、TUV、CnEVPost 和 APA 材料都指向三项实际后果：影响安全的 OTA
              变更按召回处理，企业必须在发布前验证并记录更新，营销不能把驾驶辅助模糊成自动驾驶，也不能暗示不受支持的能力。electrive 2025 年 4 月报道补充称，在一起致命事故后，beta
              式推送和草率术语正成为政策目标。对 ZYT 而言，这既是逆风，也是选择性顺风。它提高了所有试图放量 NOA 或泊车功能供应商的审批、文档和上市后责任成本。同时，它也偏向能拿出车规级控制器、功能安全流程纪律和
              OEM 级验证能力的厂商，而不是靠消费级功能噱头卖货的厂商。换句话说，规则可能放慢市场中最激进的宣传，但也抬高了低质量、无纪律进入者的门槛。
