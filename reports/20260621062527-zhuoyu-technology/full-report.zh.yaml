  productSummary: >-
    ZYT 销售 ClixPilot ADAS 套件，覆盖主动安全（FCW、AEB、LDW、BSD）、泊车辅助、高速 NOA，以及在 32 TOPS（TI TDA4VH）上不依赖高精地图或激光雷达的城市 NOA，并可上探至 100
    TOPS+ 配置（Qualcomm SA8650P / SA8775P）；此外还有 GenDrive 生成式驾驶和车载无人机系统。核心技术包括惯性辅助立体相机、三目立体感知、LiDAR-Stereo OneBOX，以及自研端到端
    E2E 世界模型。
  customerFocus: 面向 RMB 100,000–300,000 价位段、希望以较低成本获得高阶 ADAS 且不完全自研的 OEM 车企，主要是中国本土 OEM 和在华外资合资公司（VW、SAIC-VW、FAW-VW）。
  businessModel: >-
    B2B Tier 1 供应商模式：ZYT 向 OEM 客户销售集成式 ADAS 控制器硬件（域控制单元）、嵌入式软件和 OTA 更新服务。收入来自单车硬件毛利、软件授权以及售后 OTA
    功能解锁。公司自制立体相机传感器，以实现垂直整合。
  stage: growth-stage private
  fundingStatus: >-
    媒体报道显示，2024 年 1 月公司估值约 RMB 100 亿元。FAW Group 投资超过 RMB 36 亿元（2025 年官方公告），并收购 35.80% 股权成为最大股东；New Territory
    Technology（与 DJI 相关的控股公司）保留 34.85%。2025 年 9 月 SAMR 申报显示，交易后为共同控制结构。
