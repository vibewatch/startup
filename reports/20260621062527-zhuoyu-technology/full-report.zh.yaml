      - number: '2.4'
        title: 市场风险和估值含义
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但不是一条简单的直线放量故事。第一，RMB100k 以下价格带和完整城市 NOA 部署仍有真实采用时点风险；能力、算力和验证成本仍高于入门车型能经济承受的水平。第二，价格压缩正在加剧：据报道，BYD
              已把高阶智能驾驶硬件成本压到约 RMB4,500，面向主流市场的竞争者也开始用单芯片栈瞄准 CNY80k-150k 车型。第三，技术替代风险在上升，因为 OEM 和 Tier 1
              都在寻找不购买完整外部栈的替代路径。FAW 有 Mobileye 路线，Volkswagen 正与 Horizon 共同开发中国专属芯片，Horizon 和 ZF 已拿到 2026 年订单，Black
              Sesame 加 DeepRoute 也在推进芯片加软件一体化方案。最后，监管反转不再只是理论风险：electrive 报道 2025 年对营销和 OTA 行为的更广泛整治，2026 年关于 Baidu
              事故的报道也显示，安全事件后监管可以暂停扩张。这些压力不会消灭市场，但它们要求按执行质量、OEM 准入和成本竞争力来承销 ZYT，而不是按“China ADAS TAM 很大”的通用叙事来承销。
