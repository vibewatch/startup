      - number: '2.2'
        title: 采用驱动因素和需求结构
        blocks:
          - type: paragraph
            body: >-
              最强需求信号是：智能驾驶功能已经从展示型选装，变成预算车型以上的主流购买标准。XEPS 称，2025 年上半年 NEV 的 L2+ 渗透率达到 67%，RMB150k 以上车型接近标配
              L2+，RMB100k-200k 价格带贡献了全部 NOA 装机的 45.3%。ResearchAndMarkets 还称，2025 年是高速 NOA 进入标准化的一年，路径正从高速 NOA 延伸到通勤
              NOA、无图城市 NOA，并最终走向更广泛的 L3+ 能力。这种结构适合 ZYT，因为 ClixPilot 栈正是面向最先放量的功能，公司公开客户也覆盖 Volkswagen
              相关项目、SAIC-GM-Wuling、FAW、Dongfeng 和其他 OEM 关系。不过机会并不均匀。RMB100k 以下采用仍薄；RMB80k-150k 主流区间里，Nullmax、Black Sesame
              等供应商已经推出成本优化 ADAS 栈；BYD 的降本打法也重置了买方对硬件经济性的预期。因此，实际买方地图以 OEM 为中心：合资和传统 OEM 需要中国特定升级路径，本土 NEV
              品牌追求规模和功能平价，出口商需要海外本地化，最低价位段则是后续波次，而不是今天的核心 SAM。
