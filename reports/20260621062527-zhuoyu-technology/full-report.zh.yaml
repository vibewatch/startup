chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源和运营模式
        blocks:
          - type: paragraph
            body: >-
              ZYT 现在的公开身份，比早期公司历史清晰得多。公司英文 About、Solution 和 Technology
              页面将业务主体标识为深圳卓驭科技有限公司（ZYT），总部位于深圳南山区，使命是“让每个人都安全、轻松出行”。这些页面呈现的是一家供应商：销售 ClixPilot 品牌 ADAS
              系统、相关控制器和传感器，以及车载无人机系统等相邻功能，而不是面向消费者造车。独立报道补齐了转型路径：业务始于 DJI 2016 年的汽车项目团队，2021 年在上海车展以 DJI Automotive
              公开亮相，2023 年开始以深圳卓驭科技有限公司运营，并在 2024 年 6 月 21 日正式启用卓驭品牌。因此，后续章节最稳妥的表述不是“2023 年从零创立的创业公司”，而是 DJI 孵化出的汽车技术栈，在
              2022–2024 年通过正式法律和品牌分离路径，成为单独品牌的 Tier 1 智驾供应商。
