        - 34 家客户和 130+ 个定点
        - 披露年收入，并按硬件和软件拆分增长
      - - 分产品线毛利率
        - 公开可比公司看不出控制器、摄像头、软件和质保经济性
        - TI / Qualcomm 技术栈和自有制造叙事
        - 按控制器、感知、软件和支持拆分的毛利率桥
      - - 在手订单或定点转化
        - 定点不等于已承诺、可变现的在手订单
        - 20+ 款量产车型和可见 OEM 集合
        - SOP 节奏、取消率历史和合同在手订单披露
      - - 现金余额和烧钱速度
        - 战略投资标题看不出现金续航期或资本效率
        - '>RMB3.6bn FAW 标题和共同控制申报'
        - 下次融资前或融资期间披露现金、债务、资本开支和烧钱速度
      - - 按收入计的客户集中度
        - VW 和 FAW 贡献的价值可能高于品牌墙暗示
        - 公开伙伴名单和可见合资车型集中度
        - 头部客户收入占比和管线集中度指标
    notes: 本表记录阻碍估值区间收窄的具体缺口；单靠战略叙事，无法解决任何一个卡点。
