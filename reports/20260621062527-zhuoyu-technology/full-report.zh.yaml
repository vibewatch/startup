            body: >-
              ZYT 的公开证据指向一个更窄但可信的定位楔子。不同于一开始就假设大额传感器账单和 500+ TOPS 的高端栈，ZYT 宣传其城市和高速导航可在 32 TOPS 上运行，并向上扩展到 100 TOPS 和
