      - number: '1.3'
        title: 公开管理层梯队和治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开管理层可见度有意义，但不完整。新浪和盖世汽车报道中，沈劭劼被称为 ZYT CEO 或负责人，马路为 CTO，马建云为副总裁或副总经理，齐贵宝为控制器事业部总经理。欧洲扩张材料还加入了欧洲负责人 Nils
              Oldemeyer，说明公司国际化时至少配置了一名区域负责人。这些披露有价值，因为它们显示 ZYT 已不再以匿名 DJI
              业务单元出现，而是在高管、技术、控制器和欧洲商业职能上有可识别的运营班底。即便如此，公开记录仍没有完整董事会名单、CFO 身份、正式治理章程，或除 FAW 和 New Territory
              持股披露以外的股东权利摘要。因此，关键人和治理尽调仍未完成。后续章节可以基于公司确有真实管理团队这一事实，但不能从当前资料包推断其已具备上市公司式治理成熟度。
