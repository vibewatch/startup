      - number: '8.4'
        title: 退出路径存在，但当下最干净的一条是战略性而非公开市场
        blocks:
          - type: paragraph
            body: >-
              卓驭有若干理论上的退出路径，但它们的现实性并不相同。最可信的近期路线是一汽更深度的战略整合或由一汽主导的资本事件，
              因为一汽已拥有所有权、产品重叠以及为自有品牌锁定智能驾驶能力的动机。若定点转化和量产表现保持强劲，该路线可能支撑
              控制权溢价，但如果外部买家认为该资产在政治或商业上已被捆绑，它也可能压制竞争性竞拍的张力。在更长的视野下 IPO 是
              可以设想的，因为地平线和黑芝麻等上市同业证明了市场接受盈利不完美的智能驾驶故事，但卓驭仍需要在收入、利润率和治理上 提供好得多的披露，才能赢得健康的公开市场倍数。由战略 OEM 或供应链伙伴锚定的 Pre-IPO
              轮是另一种可能，尤其是如果欧洲 扩张拓宽了客户故事。最不具吸引力的路径，就是在不升级披露的情况下单纯保持私有并追逐增长，因为那会让投资者继续依赖
              陈旧的估值标记和代理指标。换言之，流动性是可能的，但市场很可能只有在卓驭将定点转化为透明的经济数据、或将一汽协同 转化为更明确的战略收购情形之后，才会给予其回报。
