  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已知标记、交易背景与估值框架
        blocks:
          - type: paragraph
            body: >-
              卓驭的估值论证始于一个真实但不完整的锚点。2024 年 1 月，36 氪报道大疆车载正以约人民币 100 亿元的估值进行融资营销， 并偏好能够带来订单和客户资源的战略投资者，而非被动资本。CnEVPost
              重复了同样的表述，并补充称若有车企携订单筹码加入， 估值可能更低。这一点之所以重要，是因为最初的标记并非一个纯软件故事；它当时已被定价为一家资本密集型的智能驾驶供应商， 其价值取决于 OEM 渠道与规模转化。随后
              2025 年的证据改善了资本叙事，但仍未将其转化为一个干净的投后数据点。市场监管 总局确认一汽将收购 35.80% 而新疆域将保留 34.85%，从而形成共同控制，卓驭自己的网站其后表示已获得一汽集团超过人民币
              36 亿元的战略投资。然而在公开层面，这些披露并未拆分出有多少价值是注入卓驭的全新一级资本、有多少是来自新疆域的二级 股份转让、又有多少代表更广泛的战略合作。这使估值只能通过三个视角进行三角测算：陈旧但真实的
              2024 年先例标记、与上市 公司及战略同业的对比，以及为不透明性折价后的基于管线的收入潜力。
