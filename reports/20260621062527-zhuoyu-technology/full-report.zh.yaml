  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本结构、战略投资者和估值标记
        blocks:
          - type: paragraph
            body: >-
              资本图景格外重要，因为 ZYT 不披露独立收入、利润率或现金数字。最好的公开估值锚点仍是 36Kr 2024 年 1 月报道，并被 CnEVPost 后续转载：DJI Automotive 正以约 RMB 100
              亿元估值融资，并偏好能带来订单而非被动资金的战略投资者。这个框架重要，因为公司当时并没有把自己包装成追求虚高估值的软件创业公司；它把自己定位为资本密集型、Tier 1 风格的供应商，价值随 OEM
              准入和量产定点上升。2025 年正式 FAW 交易随后把这一战略意图故事变成治理事件：CnEVPost 引述 SAMR 申报称，New Territory 从 70.65% 单独控制转为与 FAW
              共同控制，FAW 持有 35.80%，New Territory 持有 34.85%。ZYT 官方材料另称，来自 FAW 的战略投资超过 RMB 36 亿元。合在一起，公开记录支持比 2024
              年初更强的资产负债表论点，但仍留下不确定性：公告价值中有多少是即时现金、多少反映战略承诺，以及是否有二级股权转让稀释了进入公司的运营现金。
