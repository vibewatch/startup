              人民币 100 亿元融资意向，这在方向上有用，但在一汽交易后显然已经过时。相对于公司的雄心，领导层披露也偏薄。在保留的 来源集合中，沈劭劼是最显眼的公开发言人，而欧洲直到 2025 年 9
              月才有了一位具名的区域负责人 Nils Oldemeyer。制造集中度 同样悬而未决：公开资料突出其 2019 年的首座车规级工厂，并指向深圳为运营基地，但并未披露第二个汽车生产基地。因此投资者
