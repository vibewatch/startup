      - number: '6.4'
        title: 负面信号、自研风险和剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最主要的负面客户信号是 BYD。2023 年 4 月，CnEVPost 转引的本地媒体报道称 DJI Automotive 将为 BYD Sea Lion 提供城市 NOA 方案，这本可成为 ZYT
              大众市场论点的重要验证点。但后续公开报道没有把这个头条转化为已确认 SOP 关系。到 2024 年 1 月，公司与 BYD 的讨论仍停留在投资意向方语境，而被引用的实际落地仍是 Wuling 和
              Chery。这不能最终证明关系破裂，但说明定点头条不能按持久客户收入来承销。更广泛地看，公开资料没有披露按 OEM
              划分的收入、合同期限、续约率或装配率。即便证据最扎实的客户，也仍是拥有强议价能力和可信自研选项的汽车账户。因此，只有在尽调能确认 VW、SGMW 和 FAW/Hongqi
              正把可见车型证明转化为反复出现的平台份额，而不是一次性车型周期时，客户故事才具备投资性。
