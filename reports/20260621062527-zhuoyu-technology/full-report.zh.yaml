            body: >-
              颠覆性威胁清单不长，但很严肃。第一，BYD 的超低成本 God's Eye 策略改变了所有人的价格伞；一旦主流车型把辅助驾驶硬件在约 RMB4,500
              的成本上常态化，并以巨大规模部署，外部供应商就失去为高价硬件包定价的空间。第二，Huawei 的 Qiankun/Yinwang 系统不仅靠 ADAS
              性能抬高切换成本，还靠云、座舱和联合上市整合抬高切换成本，让更换供应商像一次平台重置。第三，Tesla 在中国的 FSD 推出仍处于受监督且部分模糊的监管状态；但如果 Tesla
              把这个滩头阵地转化为更广泛的消费者信任和更好的本地化，软件供应商将再次面对来自愿景标杆的压力。最后，ZYT 还带有 DJI
              血统带来的更隐性脆弱点：这段历史帮助其建立了立体视觉和硬件执行可信度，但也可能在海外引发围绕中国技术供应链的政策审查。因此，ZYT 仍有可防守的细分位置，但护城河来自执行，而不是绝对壁垒。
