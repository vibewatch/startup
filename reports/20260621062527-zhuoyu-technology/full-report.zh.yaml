      - number: '4.3'
        title: 成本结构和单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              ZYT 的运营比纯软件 ADAS 厂商更重。官方材料称，截至 2025 年末公司员工超过 1,800 人，其中研发人员超过 1,000 人，智能制造和质量工程师超过 500 人；其时间线还追溯到 2019
              年的车规级工厂。新浪 / 界面补充称，ZYT 还拥有自己的硬件工厂和标定系统，这是除超大型 Tier 1
              同行外并不常见的能力组合。这个组合支撑了一个可信的长期成本优势：立体相机生产、标定和系统集成可能更便宜；但它也意味着需要销量吸收固定成本。不同栈的硬件账单差异应很大：新浪 / 界面描述了 TI TDA4VH
              中算力路径，而更高算力方案使用 Qualcomm SA8650P，并可延伸到更丰富的 10V 或激光雷达-立体配置。36Kr 另称，DJI 历史上的 TI
              关系可能支撑市场最低芯片价格。因此，最可能的经济图景是：硬件毛利承压在十几个百分点附近，但更高平台复用、主流车型更低算力成本，以及通过 OTA 改进带来的部分类软件留存可形成抵消。公开资料仍未披露 ZYT 已实现
              ASP、附加率、保修准备或毛利率，因此单位经济性仍是代理指标推演，而不是审计结论。
