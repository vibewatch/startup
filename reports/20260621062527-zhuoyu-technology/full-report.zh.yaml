      - number: '7.2'
        title: 客户集中度与监管收紧可能相互叠加
        blocks:
          - type: paragraph
            body: >-
              卓驭的商业证据是真实的，但可见的收入基础看起来仍比 logo 墙更窄。官方资料如今声称拥有 34 家客户及生态伙伴，外加超过 130
              个定点，但最强的量产证据仍集中在大众合资项目、上汽通用五菱、奇瑞以及一汽/红旗。这使集中度——而非需求是否存在—— 成为核心承保问题。大众是最明显的例子：它是卓驭官网上最大的可见车型家族，同时还通过与地平线合资的
              Carizon 打造 中国专属芯片。一汽则形成了第二层集中，因为它如今既是资本提供方又是客户家族。与此同时，中国 2025 年后的规则体系正变得
              明显更严格。工信部和市场监管总局如今要求更充分的验证、备案、事件报告以及更严格的 OTA 治理；公开指引及后续报道还显示， 营销话术和紧急更新正被纳入一个远更接近召回的合规框架。2026 年百度 robotaxi
              的宕机事件之所以重要——尽管卓驭并非 robotaxi 供应商——是因为它证明了一起高知名度的系统事件能够迅速改变整个智能驾驶行业更广泛的牌照与安全监管。
