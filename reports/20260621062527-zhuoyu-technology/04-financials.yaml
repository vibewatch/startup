- id: capital-adequacy-and-disclosure-blockers
  title: Capital adequacy thesis and disclosure blockers
  body: 'The central underwriting question is not whether ZYT has market relevance; public evidence makes that clear. The hard question is whether the company has enough capital to keep funding a labor-heavy, compliance-heavy, chip-dependent Tier-1 model until nomination pipeline converts into durable cash flow. The FAW transaction is the single strongest positive signal because it aligns capital with a top-tier state-owned OEM, reduces counterparty risk around future nominations, and may improve purchasing credibility with suppliers. But public disclosure stops short of what an investor needs to test solvency or margin trajectory. There is no standalone P&L, no disclosed cash balance, no burn rate, no debt schedule, no customer concentration table, no unit ASP disclosure, and no gross-margin bridge between stereo hardware, domain controllers, software, and after-launch support. Even the >RMB3.6bn headline is directionally helpful but not fully decomposed into fresh primary capital, secondary
    transfer value, or strategic cooperation commitments. The result is a constructive but incomplete capital-adequacy thesis: ZYT appears financeable if FAW support is real operating capital plus order flow, yet the public record is not sufficient to underwrite runway, cash conversion, or margin quality without management diligence.'
