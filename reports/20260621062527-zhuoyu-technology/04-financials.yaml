- id: TI002
  title: Revenue model anatomy
  columns:
  - Revenue Stream
  - Description
  - Unit Economics Signal
  - Confidence
  - Evidence
  rows:
  - - ADAS controller hardware
    - Domain-control compute sold into OEM programs across 32, 100, and 1500+ TOPS configurations.
    - Hardware ASP likely scales with compute tier and sensor count; margin sensitive to chip costs and warranty burden.
    - Medium
    - Official solution and technology pages; Sina/Jiemian chip-stack discussion.
  - - Stereo / tri-camera / lidar-stereo sensors
    - Perception hardware including inertial-aided stereo camera, stereo+tele, and LiDAR-Stereo Onebox.
    - Vertical integration can protect BOM and calibration economics versus buying third-party sensors.
    - Medium
    - Official technology page; KiWi, Lingxi, and Hongqi descriptions in news coverage.
  - - Integrated ADAS software package
    - City/highway navigation, parking, active safety, and route-memory functions bundled with hardware programs.
    - Software is not publicly priced separately, but integrated packaging can widen attach and reduce OEM switching.
    - Medium
    - Launch article plus current solution page.
  - - OTA feature improvement and lifecycle support
    - Fleet learning and OTA updates extend capability after SOP.
    - Creates retention and upgrade value, but no public evidence yet of per-vehicle software revenue or subscription take rate.
    - Medium
    - Official technology and solution pages; OTA regulation sources.
  - - HMI / drone / innovative adjunct modules
    - ADAS HMI visualization and vehicle-mounted drone system broaden content per vehicle on selected trims.
    - Optional modules can lift per-program revenue, but likely apply only to narrower premium or showcase programs.
    - Low
    - Official solution page and CnEV shareholder article.
  notes: Descriptions are evidence-backed, but realized monetization mix is inferred because ZYT does not disclose contract structure, list prices, or software-revenue split.
