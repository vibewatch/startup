  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Product-line gross margin by controller, sensor, software, and post-sale support.
    whyItMatters: Without margin detail, investors cannot judge whether nomination growth will translate into attractive unit economics.
    diligencePath: Request management P&L bridge, BOM waterfall, warranty reserves, and software-support cost by major product family.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, debt obligations, covenant package, and runway months.
    whyItMatters: The FAW headline does not prove current solvency or self-funding capacity for a labor-heavy Tier-1 model.
    diligencePath: Request latest balance sheet, monthly cash bridge, debt schedule, and board-approved operating plan.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: asp-and-attach
    missingEvidence: Realized OEM ASP by controller tier, sensor package, software attach, and take rate by trim.
    whyItMatters: Vehicle sticker prices only loosely proxy supplier economics and can overstate ZYT's actual revenue capture.
    diligencePath: Request signed customer pricing schedules and revenue mix by program, trim, and feature package.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: faw-proceeds-structure
    missingEvidence: Breakdown of the >RMB3.6bn FAW announcement into primary cash, secondary share transfer value, and strategic commitments.
    whyItMatters: Capital adequacy changes materially depending on whether ZYT itself received most of the cash or whether the transaction largely repriced ownership.
    diligencePath: Request share purchase agreement, board approval materials, and cap-table waterfall showing uses and recipients of funds.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI001
    - TI006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by OEM, model family, and launch phase, plus cancellation and payment terms.
    whyItMatters: A broad customer list can still mask concentration or working-capital risk if a few OEM programs dominate volume and receivables.
    diligencePath: Request top-10 customer revenue share, backlog by SOP status, receivable aging, and contract termination rights.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
