callouts:
- calloutType: strength
  title: FAW is more important as an operating backer than as a vanity valuation signal
  body: The public evidence suggests ZYT wanted investors that brought orders and customer access. FAW moving from investor-intent chatter into joint control therefore strengthens both capital credibility and future nomination conversion.
  claimRefs:
  - CI012
  - CI013
  - CI016
  - CI018
- calloutType: risk
  title: Public disclosure is still too thin for margin or runway underwriting
  body: ZYT discloses customers, nominations, and workforce scale, but not standalone revenue, gross margin, cash balance, or burn. That means the core investment question remains unresolved even after the FAW headline.
  claimRefs:
  - CI006
  - CI037
  - CI038
  - CI040
- calloutType: risk
  title: Mass-market smart-driving economics will be pressured by OEM cost targets
  body: BYD’s reported RMB4,500 high-order smart-driving hardware cost benchmark and Huawei’s brand premium both compress the value capture available to third-party suppliers like ZYT, especially in the RMB100k-300k vehicle band it targets.
  claimRefs:
  - CI026
  - CI028
  - CI039
