  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand ceiling
        blocks:
          - type: paragraph
            body: >-
              OriCell's relevant market is narrower than oncology overall. Its disclosed lead programs focus on
              GPC3-targeted autologous CAR-T for advanced hepatocellular carcinoma and GPRC5D-targeted CAR-T for
              relapsed or refractory multiple myeloma. IARC and the American Cancer Society estimate 20.6 million new
              cancer cases and 9.8 million cancer deaths worldwide in 2024, but that denominator spans 34 cancer types
              in 186 countries and cannot be treated as OriCell's addressable population. The applicable pool must be
              filtered by indication, target expression, line of therapy, clinical eligibility, geography, referral
              access, and payer coverage. Status-quo substitutes include approved systemic therapies, transplant and
              other cell therapies, clinical trials, and supportive care; non-target cancers and patients unable to
              reach specialist centers are outside the practical boundary.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM014
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Three lenses are supportable, but none is a revenue TAM. First, IARC's epidemiology gives a global demand
              ceiling: 20.6 million new cases in 2024, with incidence projected to reach 34.4 million by 2050, a 67%
              increase. Second, indication proxies narrow the lens: liver cancer represented 7.5% of global cancer
              deaths in the 2024 estimate, while the American Cancer Society expects about 36,000 new multiple-myeloma
              cases in the United States in 2026. Third, CARsgen's reported Chinese approval of satri-cel for a
              biomarker-defined, later-line gastric or gastroesophageal-junction population demonstrates a solid-tumor
              CAR-T regulatory precedent. It does not establish OriCell's efficacy, eligible population, price,
              reimbursement, capacity, or share. A bottom-up SAM and SOM remain unavailable because the allocated
              evidence supplies none of those company-specific denominators.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The patient is the beneficiary and the oncologist or hematologist is the clinical decision maker, but
              treatment delivery depends on specialist hospitals, trial networks, cell-therapy operations, and payers.
              Autologous CAR-T requires referral, patient selection, cell collection, manufacturing, release testing,
              lymphodepletion, infusion, and monitoring, making hospital capacity and reimbursement as important as
              physician demand. OriCell says its OnGo platform is intended for rapid, scalable manufacturing, yet the
              public evidence does not disclose cycle-time distributions, release success, remanufacture rates, site
              throughput, cost of goods, product price, or coverage. Positive pivotal data, approval, center readiness,
              and a reimbursed pathway would trigger adoption. Tumor heterogeneity, poor T-cell infiltration, the
              immunosuppressive microenvironment, toxicity management, logistics, and durability requirements can delay
              or restrict it.
            claimRefs:
              - CM010
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The opportunity has real demand and financing signals: global cancer incidence is projected to rise, a
              solid-tumor CAR-T has reportedly secured a defined approval, and OriCell's April 2026 financing exceeded
              $110 million for clinical expansion and platform development. These signals indicate capital availability
              and sector interest, not product demand or commercial validation. The principal disconfirming evidence is
              technological and operational. Independent technical literature describes trafficking, infiltration,
              immunosuppression, and safety as persistent HCC CAR-T barriers, while BioPharm International characterizes
              in-vivo CAR-T as largely preclinical across the industry. Underwriting should therefore require
              target-positive epidemiology by geography, protocol-to-label filters, center capacity, manufacturing
              yields and cycle times, payer coverage, pricing, and competitive-share sensitivities. Until those inputs
              exist, market size should contribute option value rather than a precise revenue or valuation bridge.
            claimRefs:
              - CM002
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand exists, but only as a ceiling
            body: >-
              Cancer incidence and indication-specific burden establish substantial unmet need, while a reported
              solid-tumor CAR-T approval shows that the modality can reach a defined commercial label.
            calloutType: strength
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
          - type: callout
            title: Commercial conversion remains unproven
            body: >-
              Target-positive prevalence, price, reimbursement, manufacturing yield, site capacity, and annual treatment
              volume are unavailable, so a precise company SAM, SOM, or revenue bridge would be speculative.
            calloutType: risk
            claimRefs:
              - CM014
              - CM016
          - type: callout
            title: Require a bottom-up market model
            body: >-
              Link eligible patients by geography to referral rates, activated centers, manufacturing capacity, payer
              coverage, price, and competitive share before assigning market-based value.
            calloutType: recommendation
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              OriCell's lead position is in a difficult frontier rather than an uncontested niche. MedCity News
              describes Ori-C101 as an autologous GPC3 CAR-T for advanced hepatocellular carcinoma and notes that solid
              tumors remain difficult because the tumor microenvironment is immunosuppressive. The same account
              identifies Eureka Therapeutics, AstraZeneca's AZD7003, and Zymeworks' ZW251 as competing GPC3 approaches,
              while Bristol Myers Squibb is pursuing a dual-targeting GPRC5D/BCMA CAR-T in multiple myeloma. This means
              OriCell faces direct target competition in liver cancer, modality substitution from antibody-drug
              conjugates, and better-capitalized incumbents in hematology. The relevant status quo is continued standard
              systemic oncology treatment or later-line hematology therapy, not simply another CAR-T vendor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
