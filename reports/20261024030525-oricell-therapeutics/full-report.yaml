  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and development stage
        blocks:
          - type: paragraph
            body: >-
              OriCell is described by company and independent sources as a Shanghai-based clinical-stage biotechnology
              company developing cell therapies for cancer. The business remains a development-stage model rather than a
              demonstrated recurring-revenue operation: retained evidence identifies no approved product, recognized
              revenue, or verified customer count. The lead program is Ori-C101, a GPC3-targeted autologous CAR-T
              candidate for advanced hepatocellular carcinoma, while OriCAR-017 targets GPRC5D in relapsed or refractory
              multiple myeloma. Public descriptions also identify antibody discovery, CAR engineering, and manufacturing
              capabilities. These assets support a coherent platform narrative, but clinical, regulatory, manufacturing,
              and financing execution still determine enterprise value.
