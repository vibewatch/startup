              - CP010
              - CP011
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, distribution, and switching comparison
        blocks:
          - type: paragraph
            body: >-
              The public comparison is strongest on target, modality, stage, and manufacturing approach, and weakest on
              realized price, customer access, and comparative quality. OriCell describes platforms spanning antibody
              discovery, T-cell enhancement, and rapid manufacturing; MedCity News reports that the company is also
              developing in-vivo cell therapies intended to avoid the multiple steps of autologous treatment.
              Established products illustrate the buyer's operational tradeoff: CARVYKTI is a one-time infusion but its
              manufacturer describes a five-step process taking around two to three months, while ABECMA describes blood
              collection, cell creation, administration, and monitoring. OriCell may differentiate through solid-tumor
              biology and faster manufacturing, but public evidence does not establish release rates, turnaround
              distributions, site breadth, reimbursement, or a switching cost that would protect it after competing
              products become available.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              OriCell's potential moat is a combination of target-specific clinical data, integrated
              discovery-to-manufacturing capabilities, and a pipeline spanning solid tumors, hematologic malignancies,
              and in-vivo approaches. Its durability is still conditional. A 2026 competitive landscape review
              characterizes autologous manufacturing bottlenecks, antigen escape, allogeneic persistence, solid-tumor
              biology, and treatment price as structural risks across the field; it also reports that no allogeneic
              CAR-T product had been approved in its review. For OriCell, the key displacement tests are whether GPC3
              responses reproduce in pivotal testing, whether competitors with global development and manufacturing
              infrastructure move faster, and whether off-the-shelf or rapid-production products reduce the burden of
              patient-specific manufacturing. The evidence supports a research-more posture rather than a conclusion
              that the moat is established.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is real but not yet durable
            body: >-
              OriCell has a credible differentiation thesis in GPC3 solid tumors, GPRC5D hematology, and next-generation
              manufacturing, but each leg remains exposed to direct target peers, approved hematology products, and
              unresolved manufacturing or durability questions.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP011
          - type: callout
            title: Comparative proof is the gating issue
            body: >-
              The assigned evidence does not disclose OriCell's realized price, release rate, site breadth,
              reimbursement, or comparative pivotal outcomes. Those gaps can materially change the competitive
              conclusion.
            calloutType: risk
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP014
          - type: callout
            title: Track inflection points rather than assume a moat
            body: >-
              Reassess when Ori-C101 reports pivotal data, manufacturing turnaround and release distributions, and price
              or reimbursement terms; separately test whether OriCAR-017 can compete with approved or later-stage GPRC5D
              options.
            calloutType: recommendation
            claimRefs:
              - CP002
              - CP007
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              OriCell's public materials describe a clinical-stage oncology and immunology biotechnology company
              developing autologous CAR-T therapies, rather than a commercial product company with disclosed recurring
              revenue. The official site identifies Ori-C101 and OriCAR-017 as clinical programs and describes platform
              capabilities, but it does not provide list prices, contracts, product sales, revenue, or realized
              reimbursement. A third-party private-company profile labels the revenue model as licensing, while another
              profile describes the company as B2B; neither provides a contract, royalty rate, milestone schedule, or
              recognized revenue. The financially supportable conclusion is therefore not that licensing revenue exists,
              but that a licensing pathway is plausible and unverified. The model is currently dependent on financing
              and future clinical or partnering milestones, not public operating cash flow.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: GTM motion, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              The assigned sources provide no customer acquisition cost, sales cycle, payback, gross margin,
              contribution margin, cost of goods sold, working-capital schedule, or capex disclosure. That absence is
              material because autologous cell therapy economics depend on patient acquisition, treatment-center access,
              manufacturing release, logistics, and quality-control costs; platform descriptions alone do not quantify
              any of those drivers. OriCell says proceeds are intended for global clinical development,
              manufacturing-capability expansion, and capital-market milestones, while earlier financing was directed
              toward U.S. clinical development. Those uses indicate a research, clinical, and manufacturing cost base,
              but they do not establish burn or unit economics. Any scenario should keep realized pricing, treatment
              cost, batch failure or remanufacture rates, and site economics as unavailable inputs rather than
              substituting public list prices or peer-company margins.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Financing is the clearest public financial signal. The assigned sources report an April 2026 pre-IPO round
              in excess of $110 million, a January 2026 Series C1 initial closing of $70 million, a February 2023 Series
              B1 round of $45 million, and a July or August 2022 Series B reported at more than $120 million or $125
              million depending on the source. These are financing proceeds, not cash on hand, and the sources do not
              disclose post-money valuation, current balance, monthly burn, runway, debt, or liquidation preferences.
              The proceeds are described as supporting global clinical development and manufacturing expansion, so
              capital needs remain milestone-dependent. The round chronology supports improved funding capacity but
              cannot establish solvency through the next value-creating milestone without management accounts and a cash
              forecast.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI010
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: Financial underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              OriCell's financial profile is investable only as a private, clinical-stage financing case rather than as
              an operating-revenue underwriting. Evidence supports a substantial investor syndicate and continued
              pipeline progression, including a confirmatory Phase II path for Ori-C101 and global development for
              OriCAR-017, but those milestones are not revenue recognition events. The strongest positive is access to
              fresh capital; the strongest negative is that public sources do not provide the cash bridge needed to map
              that capital to runway, manufacturing scale, or commercialization readiness. The evidence also contains
              inconsistent aggregate-funding and round labels across data vendors, and one source reports a 25-person
              employee count while other sources do not provide a current headcount. Before underwriting price or
              return, diligence should obtain audited or management financials, the current cap table and terms, cash
              and burn by function, manufacturing cost and release data, and any licensing or commercial contracts.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and clinical maturity
        blocks:
          - type: paragraph
            body: >-
              OriCell's product is an oncology cell-therapy portfolio rather than a single commercial SKU. Independent
              profile material describes CAR-T, cell-therapy, and gene-therapy modalities, while Synapse lists 19 CAR-T
              programs and projects spanning discovery through Phase 2. The most visible assets are Ori-C101/ORIC-101
              for GPC3-positive hepatocellular carcinoma and OriCAR-017 for multiple myeloma. OriCAR-017 is described by
              an investor source as a GPRC5D CAR-T program at the IND-enabling stage in the United States and China,
              whereas later coverage describes it as a Phase 1/2 China trial; the differing descriptions reinforce the
              need to verify the current registry and readout. An NCI registry record provides an external GPC3-targeted
              CAR-T workflow benchmark in advanced GPC3-expressing solid tumors, but it is not an OriCell-sponsored
              study and does not establish OriCell efficacy or commercialization readiness.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
      - number: '5.2'
        title: Technology and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is an integrated discovery-to-manufacturing workflow. Gosset identifies OriAb,
              OriCAR, OriTIL, and OriUCAR as proprietary platforms intended to engineer next-generation CAR-T therapies,
              and says the company has capabilities spanning discovery, clinical development, and GMP-compliant
              manufacturing. A financing announcement gives a more specific three-part description: OriAb for antibody
              screening and engineering, OriArmoring for functional enhancement, and OnGo for rapid CMC manufacturing.
              These descriptions indicate where value may accrue—target selection, activity in the solid-tumor
              microenvironment, and production speed—but they do not provide release-rate distributions, batch-failure
              rates, turnaround times, persistence data, or head-to-head comparisons. The engineering and manufacturing
              claims should therefore be treated as company-issued or secondary summaries until supported by technical
              protocols and audited quality data.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Clinical workflow and differentiation
        blocks:
          - type: paragraph
            body: >-
              The customer-facing workflow is a high-risk clinical development process: identify a tumor antigen, design
              and manufacture an autologous cell product, administer it to eligible patients, and generate controlled
              evidence through staged trials. Ori-C101 is aimed at GPC3, a target emphasized for liver cancer, while
              OriCAR-017 is aimed at GPRC5D in multiple myeloma. The differentiator is consequently a combination of
              target selection, cell engineering, immune-microenvironment functionality, and manufacturing execution
              rather than a proven software-like distribution advantage. Coverage reports a small 2025 ASCO study in
              which the company said six of ten treated patients responded and nine achieved disease control; that is a
              company statement reported by BioPharma Dive, not an independently verified efficacy benchmark. Public
              materials also mention secreted, rapid-production, and in-vivo CAR-T modalities, but do not disclose their
              clinical maturity.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Maturity, controls, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Technical maturity is uneven across the portfolio. Clinical-stage programs and a registered GPC3 study
              show that OriCell has moved beyond discovery, while Synapse also lists discovery, preclinical, IND, and
              early clinical projects. Regulatory and quality controls are not fully visible in the assigned public
              evidence: the sources mention IND clearances or approvals and GMP-compliant manufacturing, but do not
              disclose inspection outcomes, comparability packages, validated release specifications, cybersecurity or
              privacy controls, or post-treatment safety monitoring. The patent evidence is similarly incomplete. RTW
              reports more than 100 invention patent applications and 10 granted patents, while WIPO PATENTSCOPE
              confirms a searchable global collection but does not identify an OriCell portfolio in the fetched landing
              page. The key technical diligence work is to reconcile asset names and phases, inspect trial-level safety
              and durability, validate CMC reproducibility, and complete freedom-to-operate analysis around GPC3,
              GPRC5D, armored constructs, and in-vivo extensions.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Target-plus-platform coherence
            body: >-
              OriCell has a coherent disclosed link between named oncology targets, engineered-cell platforms, and
              manufacturing capabilities, but the public evidence is still mostly stage and description evidence rather
              than reproducible performance evidence.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE007
          - type: callout
            title: Technical underwriting remains evidence-limited
            body: >-
              The principal blockers are trial-level safety and durability, CMC release and turnaround data, phase
              reconciliation, and a patent freedom-to-operate analysis that goes beyond a disclosed application count.
            calloutType: risk
            claimRefs:
              - CE003
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              OriCell is a clinical-stage biotechnology company, so its current “customer” system is primarily a
              clinical-development network: patients are treatment users, investigators and hospitals are deployment
              sites, and the company and its investors fund development. A public company profile describes the business
              as B2B with a licensing revenue model, but that profile is not a financial filing and does not identify a
              signed licensee or payer. The public record instead names a multi-center OriCAR-017 study in China and a
              separate United States study described as the first U.S. clinical study for the company. This supports a
              site-and-patient adoption map, not proof of product sales. Geographic expansion is visible in the
              company's global-development statements, while the commercial channel, reimbursement path, contract
              economics, and customer decision maker remain unresolved.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU014
      - number: '6.2'
        title: Adoption and clinical proof trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest measurable adoption proxies are trial enrollment, study status, clinical readouts, and
              progression from investigator-initiated work to registrational development. The OriCAR-017 registry
              reports a recruiting Phase I/II, open-label, multi-center study with estimated enrollment of 83 adults,
              while the U.S. registry description identifies a first U.S. study evaluating safety, pharmacokinetics,
              pharmacodynamics, and preliminary efficacy. For Ori-C101, a June 2026 evidence record reports 18
              efficacy-evaluable late-line HCC patients and an overall response rate of 50%, rising to 66.7% at the
              recommended Phase 2 dose; these are clinical endpoints, not customer retention or commercial utilization.
              The 2026 financing release says both Phase I IIT and Phase I IND studies were completed and pivotal work
              was next, indicating development progression but not launch readiness.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named-site proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Named clinical sites provide stronger evidence than an undifferentiated logo list, but they still
              represent trial participation rather than paid production deployment. The OriCAR-017 registry lists
              Beijing GoBroad Hospital, The First Affiliated Hospital with Nanjing Medical University, Tongji Hospital
              of Tongji University, Union Hospital Tongji Medical College, and The First Affiliated Hospital of Zhejiang
              University; the registry marks some sites recruiting and others not yet recruiting. The U.S. study record
              separately identifies a first U.S. clinical study but does not disclose a commercial customer or outcome.
              OriCell's financing and investor communications describe global expansion and partnerships as objectives,
              while the available evidence does not disclose site contracts, paid-access terms, repeat utilization, or
              patient-level follow-up by site. Reference quality is therefore medium for clinical-network breadth and
              low for commercial durability.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Retention, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              No assigned source reports net revenue retention, gross retention, churn, renewal rates, contract
              duration, revenue by customer, or concentration of active sites. The clinical registry's recruiting and
              not-yet-recruiting labels show that the network is still operationally developing, but they cannot
              establish repeat purchase or expansion. The public evidence also does not quantify manufacturing
              turnaround by site, referral conversion, reimbursement, or the share of enrollment supplied by any one
              investigator, hospital, geography, or partner. Consequently, customer durability should be treated as
              unproven and concentration as an open diligence risk rather than as absent risk. The next diligence step
              is a site-level schedule showing contracted sites, activated sites, screened and dosed patients,
              manufacturing failures, follow-up completion, and economics by program and geography.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical-network breadth is visible
            body: >-
              OriCAR-017 is registered as a recruiting Phase I/II multi-center study with an estimated 83 participants
              and multiple named Chinese hospitals.
            calloutType: strength
            claimRefs:
              - CU005
              - CU010
              - CU011
          - type: callout
            title: Commercial customer durability is unproven
            body: >-
              The assigned evidence does not disclose paying customers, revenue, retention, renewal, site concentration,
              or signed licensing terms.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
          - type: callout
            title: Request site-level operating evidence
            body: >-
              Before underwriting customer traction, obtain activated-site contracts, screened and dosed patient counts,
              follow-up completion, manufacturing failure rates, reimbursement assumptions, and program-level economics.
            calloutType: recommendation
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high-risk underwriting posture rather than a conclusion that an adverse event has
              occurred. Ori-C101 is still moving from investigator-led and early registrational work toward pivotal
              development, while a financing article explicitly warns that clinical timelines and regulatory outcomes
              remain uncertain. The company also must turn claimed rapid manufacturing and integrated GMP capability
              into repeatable release performance at larger scale. Capital risk ranks alongside these technical risks
              because three current databases report materially different cumulative funding totals, and none reports
              cash, monthly burn, or milestone-adjusted runway. The heatmap therefore scores residual exposure from
              disclosed stage and evidence gaps, not from an assumption that a failure or incident has already happened.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR011
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, clinical, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The core legal-regulatory issue is transition risk. Independent summaries report that Ori-C101 has
              completed investigator-initiated work and a registrational Phase I study, with pivotal trials still ahead.
              OriCAR-017 has useful regulatory signals, including US orphan and Fast Track designations and IND
              permissions in China and the United States, but those statuses are not approvals to market. The public
              record also describes more than 100 patent applications but only 10 grants as of 2023; application volume
              does not establish claim quality or freedom to operate. The USPTO provides a public PTAB search route, yet
              a company-specific docket, patent-family map, licensing schedule, and counsel opinion remain necessary
              before underwriting defensibility.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
      - number: '7.3'
        title: Manufacturing, quality, and portfolio execution
        blocks:
          - type: paragraph
            body: >-
              Manufacturing is both a claimed differentiator and an unverified operational dependency. Sources describe
              integrated GMP-compliant manufacturing, planned expansion of manufacturing capability, and a claimed
              process of under seven days. None of the retained evidence reports batch-release success, vein-to-vein
              turnaround distributions, remanufacture frequency, capacity utilization, comparability results, or named
              critical suppliers. Those omissions matter because pivotal execution requires consistent CMC performance,
              not merely platform descriptions. A third-party pipeline snapshot also shows programs spread across
              discovery, preclinical, IND, and clinical categories, increasing prioritization demands. There is likewise
              no retained security or privacy-control evidence; this is a diligence gap, not proof that a breach or
              compliance failure occurred.
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR012
              - CR015
      - number: '7.4'
        title: Capital and dependency kill criteria
        blocks:
          - type: paragraph
            body: >-
              The April 2026 round was reported at more than $110 million and was earmarked for clinical development,
              manufacturing expansion, global activity, and capital-markets preparation. That funding is supportive, but
              capital raised is not cash available. Indexed, Tracxn, and Multiples report cumulative totals of $364
              million, $350 million, and $419 million respectively, with different round counts, so the aggregate cannot
              be used as a precise liquidity proxy. The investment thesis should break if audited cash and committed
              capital do not cover the next clinical and CMC milestones with a reasonable contingency, if pivotal timing
              slips without a funded recovery plan, if release performance misses agreed thresholds, or if FTO diligence
              reveals blocking claims without a credible license or design-around.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              Treat the April 2026 round as financing activity, not as current liquidity. The investment committee needs
              cash, burn, committed capital, milestone budgets, and financing terms before it can judge whether OriCell
              can reach the next value-inflecting clinical and CMC milestones.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and entry discipline
        blocks:
          - type: paragraph
            body: >-
              OriCell's investable case is a financing-supported clinical platform rather than a revenue-underwritten
              business. FinSMEs and AllSci describe a $110M pre-IPO financing announced in April 2026, while QuotedData
              documents a prior $45M Series B-1 round and Multiples reports an April 2026 $110M round plus an earlier
              $70M round. That sequence indicates access to specialist and strategic capital, but it does not disclose
              the price, post-money valuation, security, dilution, or preferences. The operating proof is also
              pre-commercial: the pipeline is led by Ori-C101 in hepatocellular carcinoma and OriCAR-017 in multiple
              myeloma, with other programs at early phases. Accordingly, a research-more recommendation is
              price-sensitive: a disclosed round at a disciplined valuation could improve the call, while a high implied
              value without pivotal efficacy, manufacturing release data, or runway evidence would weaken it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on three observable signals: repeated institutional financing, a diversified CAR-T
              pipeline, and a sector exit environment that can reward differentiated oncology assets. Gosset describes
              Ori-C101 as a GPC3-targeted lead program and an integrated discovery-to-manufacturing model; Synapse lists
              31 pipeline assets across discovery through Phase 2; and EY reports that late-stage VC and oncology M&A
              remained active in 2025 and early 2026. The anti-thesis is equally concrete. Public datasets disagree on
              cumulative funding ($350M across four rounds at Tracxn versus $419M across eight rounds at Multiples), and
              no assigned source provides OriCell's revenue, cash, burn, ownership, or price-bearing terms. Gracell's
              $1.2B acquisition is a useful transaction reference for a public clinical-stage cell-therapy company with
              specified consideration and a milestone-linked contingent value right, not a directly comparable OriCell
              valuation. These signals support optionality, not a precise mark.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Scenario ranges should be treated as decision rules, not forecasts, because the assigned evidence lacks a
              company valuation and commercial financials. The bull case requires pivotal clinical evidence,
              reproducible manufacturing, a price-bearing financing at a supportable step-up, and credible IPO or
              strategic-partner readiness. The base case is continued private financing while Ori-C101 and OriCAR-017
              generate additional clinical evidence, with valuation held at unknown until terms and runway are
              disclosed. The bear case is a down-round or extended private period caused by weak efficacy, manufacturing
              constraints, regulatory delay, or capital-market compression. EY's finding that the IPO market declined
              about 47% in 2025 and that many biotechs faced a liquidity trap supports using financing access as a
              monitored risk rather than assuming an exit. The next diligence package should include the signed
              financing term sheet, fully diluted cap table, preference stack, cash and monthly burn, runway to the next
              milestone, program budgets, manufacturing release and turnaround metrics, and updated clinical readouts.
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Decision rule
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more with low-to-medium confidence in the valuation conclusion and
              high risk. The evidence is sufficient to establish financing momentum and a potentially valuable pipeline,
              but not sufficient to establish investor returns, a target entry price, or downside protection. An
              investor should advance only if terms-level diligence closes the valuation and liquidity gaps and if the
              next clinical milestone improves the probability of a strategic or public-market exit. A thesis-break
              trigger is a financing that materially dilutes existing holders without a corresponding clinical or
              regulatory step-up, a failure to reproduce lead-program efficacy, or a runway shortfall before the next
              value-creating milestone.
            claimRefs:
              - CV003
              - CV009
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline
            body: >-
              Do not convert the $110M financing amount into a company valuation or return estimate; the retained
              sources do not disclose price, post-money valuation, security, or dilution.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
          - type: callout
            title: Thesis-break triggers
            body: >-
              Re-underwrite immediately after a failed or materially delayed lead-program milestone, a financing with
              severe dilution, or evidence that cash runway ends before the next value-creating clinical event.
            calloutType: risk
            claimRefs:
              - CV012
              - CV014
