      - number: '1.4'
        title: Milestones and underwriting limits
        blocks:
          - type: paragraph
            body: >-
              The 2026 record shows execution momentum: OriCell announced Series C1 and pre-IPO financings, reported
              Ori-C101 clinical data, received company-reported NMPA clearance for a confirmatory Phase II trial, and
              changed chief executive leadership. Those events strengthen the case that the company is active and
              advancing, but they do not substitute for primary regulatory letters, audited accounts, or independently
              verified trial records. The solid-tumor modality also carries category-level constraints. A 2026 technical
