        - Preserve optionality and re-underwrite at the next price-bearing round.
        - Dilution, burn, runway, and delayed commercialization.
        - Most defensible on current evidence.
      - - Bear
        - Weak readouts, capital-market compression, or a runway gap forces a down-round or prolonged private period.
        - Capital impairment risk is material; avoid assuming recovery or exit timing.
        - Down-round dilution, liquidity trap, failed commercialization.
        - Material downside; no probability estimate is justified.
    notes: >-
      Scenario labels are qualitative decision cases, not probabilistic forecasts; no numeric valuation or return is
      presented because company price, revenue, cash, burn, and cap-table inputs are unavailable.
    claimRefs:
      - CV012
      - CV013
      - CV014
