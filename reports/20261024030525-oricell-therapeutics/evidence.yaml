evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-finance
    missingEvidence: Current valuation, cap table, security terms, cash balance, monthly burn, runway, revenue, and customer count.
    whyItMatters: Financing size does not show capital remaining, dilution, preference structure, or commercial traction.
    diligencePath: >-
      Obtain audited accounts, bank statements, the capitalization table, financing agreements, and a milestone-linked
      cash forecast.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: leadership-identity
    missingEvidence: >-
      Documentary confirmation of the identities, legal names, current titles, and authority of Helen Yang and Huanfeng
      Yang.
    whyItMatters: >-
      The 2026 chief executive transition cannot be evaluated reliably while founder and chair naming remains
      unresolved.
    diligencePath: >-
      Request the legal entity register, current organizational chart, board resolutions, employment agreements, and
      succession plan.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, executive, scientific-advisory, committee, and succession records.
    whyItMatters: Authority, oversight, and key-person exposure are material for a private clinical-stage company.
    diligencePath: Obtain the board roster, committee charters, reserved matters, minutes, and management succession materials.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: financing-total
    missingEvidence: >-
      A reconciled financing ledger with closing dates, currencies, gross proceeds, secondary components, and security
      types.
    whyItMatters: >-
      Database totals and round announcements use different disclosure bases, so cumulative funding cannot be treated as
      cash available.
    diligencePath: Reconcile signed term sheets, closing statements, investor confirmations, and audited equity accounts.
    relatedQuestionRefs:
