artifact: customers
slug: oricell-therapeutics
runDate: 2026-10-24
company:
  name: OriCell Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    OriCell's public evidence describes clinical investigators and trial participants as the
    current adoption surface rather than a commercial customer base. The company has broadened
    global development and named multi-center trial activity, but public sources do not establish
    paying customers, commercial revenue, retention, or customer concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      OriCell is a clinical-stage biotechnology company, so its current “customer” system is
      primarily a clinical-development network: patients are treatment users, investigators and
      hospitals are deployment sites, and the company and its investors fund development. A
      public company profile describes the business as B2B with a licensing revenue model, but
      that profile is not a financial filing and does not identify a signed licensee or payer.
      The public record instead names a multi-center OriCAR-017 study in China and a separate
      United States study described as the first U.S. clinical study for the company. This
      supports a site-and-patient adoption map, not proof of product sales. Geographic expansion
      is visible in the company's global-development statements, while the commercial channel,
      reimbursement path, contract economics, and customer decision maker remain unresolved.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption and clinical proof trajectory
    body: >-
      The strongest measurable adoption proxies are trial enrollment, study status, clinical
      readouts, and progression from investigator-initiated work to registrational development.
      The OriCAR-017 registry reports a recruiting Phase I/II, open-label, multi-center study
      with estimated enrollment of 83 adults, while the U.S. registry description identifies a
      first U.S. study evaluating safety, pharmacokinetics, pharmacodynamics, and preliminary
      efficacy. For Ori-C101, a June 2026 evidence record reports 18 efficacy-evaluable
      late-line HCC patients and an overall response rate of 50%, rising to 66.7% at the
      recommended Phase 2 dose; these are clinical endpoints, not customer retention or
      commercial utilization. The 2026 financing release says both Phase I IIT and Phase I IND
      studies were completed and pivotal work was next, indicating development progression but
      not launch readiness.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof
    title: Named-site proof and reference quality
    body: >-
      Named clinical sites provide stronger evidence than an undifferentiated logo list, but
      they still represent trial participation rather than paid production deployment. The
      OriCAR-017 registry lists Beijing GoBroad Hospital, The First Affiliated Hospital with
      Nanjing Medical University, Tongji Hospital of Tongji University, Union Hospital Tongji
      Medical College, and The First Affiliated Hospital of Zhejiang University; the registry
      marks some sites recruiting and others not yet recruiting. The U.S. study record separately
      identifies a first U.S. clinical study but does not disclose a commercial customer or
      outcome. OriCell's financing and investor communications describe global expansion and
      partnerships as objectives, while the available evidence does not disclose site contracts,
      paid-access terms, repeat utilization, or patient-level follow-up by site. Reference quality
      is therefore medium for clinical-network breadth and low for commercial durability.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Retention, expansion, and concentration risks
    body: >-
      No assigned source reports net revenue retention, gross retention, churn, renewal rates,
      contract duration, revenue by customer, or concentration of active sites. The clinical
      registry's recruiting and not-yet-recruiting labels show that the network is still
      operationally developing, but they cannot establish repeat purchase or expansion. The
      public evidence also does not quantify manufacturing turnaround by site, referral
      conversion, reimbursement, or the share of enrollment supplied by any one investigator,
      hospital, geography, or partner. Consequently, customer durability should be treated as
      unproven and concentration as an open diligence risk rather than as absent risk. The next
      diligence step is a site-level schedule showing contracted sites, activated sites,
      screened and dosed patients, manufacturing failures, follow-up completion, and economics
      by program and geography.
    claimRefs: [CU014, CU015, CU016]
    tableRefs: []
tables:
