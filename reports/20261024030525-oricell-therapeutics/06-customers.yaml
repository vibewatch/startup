          title: Trial users
          touchpoints: ["Adults with relapsed/refractory multiple myeloma", "Ori-C101 HCC efficacy-evaluable cohort"]
          detail: "Clinical users are not paying customers."
        - id: clinical-readout
          label: Clinical readout
          title: Evidence generation
          touchpoints: ["ORR and safety readouts", "Phase progression and follow-up"]
          detail: "Readouts support development decisions, not retention."
        - id: regulatory-path
          label: Regulatory path
          title: IND and pivotal development
          touchpoints: ["China and U.S. development", "Pivotal work described as next step"]
          detail: "Regulatory progress is not commercial approval."
        - id: licensing
          label: Licensing
          title: Potential partner channel
          touchpoints: ["Licensing model reported by a market-data profile", "No named licensee in assigned evidence"]
          detail: "Commercial conversion remains unverified."
        - id: commercial-treatment
          label: Commercial treatment
          title: Future payer and patient access
          touchpoints: ["Reimbursement", "Repeat utilization", "Site expansion"]
          detail: "No public revenue or retention evidence is available."
    claimRefs: [CU002, CU003, CU005, CU014]
callouts:
  - calloutType: strength
    title: Clinical-network breadth is visible
    body: "OriCAR-017 is registered as a recruiting Phase I/II multi-center study with an estimated 83 participants and multiple named Chinese hospitals."
    claimRefs: [CU005, CU010, CU011]
  - calloutType: risk
    title: Commercial customer durability is unproven
    body: "The assigned evidence does not disclose paying customers, revenue, retention, renewal, site concentration, or signed licensing terms."
    claimRefs: [CU014, CU015, CU016]
  - calloutType: recommendation
    title: Request site-level operating evidence
    body: "Before underwriting customer traction, obtain activated-site contracts, screened and dosed patient counts, follow-up completion, manufacturing failure rates, reimbursement assumptions, and program-level economics."
    claimRefs: [CU014, CU015, CU016]
