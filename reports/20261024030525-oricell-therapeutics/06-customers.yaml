      - ["Ori-C101 efficacy-evaluable population", 18, "As of 2026-04-03", "Company-issued ASCO 2026 release", medium, "Provides a measurable clinical adoption proxy", "Screened, treated, and follow-up populations"]
      - ["Ori-C101 overall response rate", "50% overall; 66.7% at RP2D", "As of 2026-04-03", "Company-issued ASCO 2026 release", medium, "Supports clinical proof, not commercial demand", "Comparator, confidence interval, and denominator by cohort"]
      - ["Ori-C101 early HCC trial", "P1 N=11; 9 evaluable; ORR 44.4%; DCR 77.8%", "2021 ASCO record", "Clinical evidence digest quoting PRNewswire", medium, "Shows earlier proof-of-concept progression", "Longitudinal patient and site-level retention"]
    notes: "Values are clinical-development proxies with different populations and time periods; they must not be read as customer counts, revenue, ARR, or retention metrics."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Named organization or cohort, Segment, Deployment or use case, Production vs pilot, Outcome or status, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named clinical sites and cohorts in assigned registry and company evidence through 2026-10-24"
    rows:
      - ["Beijing GoBroad Hospital", "Investigator hospital", "OriCAR-017 R/R multiple myeloma study", "Clinical trial, not production", "Listed as not yet recruiting", "No contract, enrolled count, or outcome disclosed"]
      - ["The First Affiliated Hospital, Zhejiang University", "Investigator hospital", "OriCAR-017 R/R multiple myeloma study", "Clinical trial, not production", "Listed as recruiting", "No site-level enrollment or economics disclosed"]
      - ["Union Hospital Tongji Medical College", "Investigator hospital", "OriCAR-017 R/R multiple myeloma study", "Clinical trial, not production", "Listed as recruiting", "No site-level enrollment or outcome disclosed"]
      - ["18 efficacy-evaluable advanced HCC patients", "Clinical user cohort", "Ori-C101 BEACON study", "Investigational treatment", "50% ORR overall; 66.7% at RP2D", "Company-issued release; not a paid customer cohort"]
    notes: "This is a partial enumeration of named public clinical proof, not a customer reference list; registry status and clinical outcomes are kept separate from production deployment."
    claimRefs: [CU010, CU011, CU012, CU013]
