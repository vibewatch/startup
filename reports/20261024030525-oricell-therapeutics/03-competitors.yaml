      - [GPRC5D hematology targeting, "OriCAR-017 targets GPRC5D", "Talvey validates GPRC5D clinically; BMS is pursuing a dual-targeting CAR-T", "Target validation helps, but incumbent and alternative modalities raise the proof bar"]
      - [Autologous manufacturing, "Company describes rapid manufacturing platform", "CARVYKTI and ABECMA use patient-specific cell processes", "Turnaround and release evidence are needed to establish an operating advantage"]
      - [In-vivo or next-generation modality, "Company is developing in-vivo cell therapies", "Allogeneic and iPSC approaches are described in the landscape review", "Potential step-change, but clinical durability and approval remain unproven"]
      - [Global development and distribution, "2026 financing was described as supporting global expansion", "AstraZeneca, Janssen, BMS, and other incumbents have broader disclosed infrastructure", "Capital is an enabler, not proof of channel access or launch execution"]
      - [Pricing and access, "No public realized price or reimbursement evidence in assigned sources", "US product list-price and payer evidence are not established in the retained product pages", "Pricing power, payer coverage, and patient affordability remain unknown"]
    notes: >-
      Cells summarize the assigned source set and intentionally avoid scores where direct comparability, period, or population was not disclosed. Product pages describe treatment processes, not a complete cost or access benchmark.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010, CP015, CP016]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Price or contract model, Included capabilities or process, Discount or unknowns, Strategic implication]
    rows:
      - [OriCell Ori-C101, "Not publicly disclosed", "Autologous GPC3 CAR-T in Phase 1; company describes rapid manufacturing capabilities", "Realized price, reimbursement, and manufacturing cost unknown", "No underwriting credit for pricing power until terms and delivery economics are disclosed"]
      - [OriCell OriCAR-017, "Not publicly disclosed", "Autologous GPRC5D CAR-T; US and China development described by company-related sources", "Price, eligibility, and site economics unknown", "Commercial positioning cannot yet be compared with approved MM products"]
      - [CARVYKTI, "Not stated on retained official page", "One-time infusion within a five-step process taking around two to three months", "Payer terms, patient cost, and manufacturing capacity not stated", "Operational burden remains a switching and scale consideration"]
      - [ABECMA, "Not stated on retained official page", "Blood collection, CAR-T creation, administration, and side-effect monitoring", "Payer terms and realized price not stated", "Established process may reduce buyer uncertainty even without a disclosed price here"]
      - [Talvey, "Not stated on retained official page", "GPRC5D-targeted multiple-myeloma therapy information is provided", "Price, dosing economics, and comparative outcomes not stated", "A non-CAR-T option can compete for the same clinical decision"]
    notes: >-
      No retained source supplied comparable list prices, realized prices, contract terms, or discounts. The table therefore treats price as unknown rather than converting funding or clinical claims into revenue or pricing evidence.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: OriCell sits in an early-stage, differentiated-target position while approved incumbents combine stronger commercialization evidence with less solid-tumor novelty.
    data:
      points:
        - {label: OriCell, x: 2, y: 4, detail: "Early-stage evidence; GPC3 solid-tumor and GPRC5D programs"}
        - {label: Eureka, x: 2, y: 3, detail: "GPC3 direct peer; Phase 1/2 ECT204"}
        - {label: AZD7003, x: 3, y: 3, detail: "GPC3 program in Phase 1 with large-pharma sponsor"}
        - {label: CARVYKTI, x: 5, y: 2, detail: "Approved BCMA CAR-T; established treatment process"}
        - {label: ABECMA, x: 4, y: 2, detail: "Approved autologous BCMA CAR-T"}
        - {label: Allogeneic field, x: 3, y: 4, detail: "Potential manufacturing advantage; no approved product in reviewed landscape"}
    approximationNotes: >-
      Ordinal coordinates are analyst synthesis from disclosed stage, approval status, target overlap, and manufacturing descriptions; they are not a clinical efficacy score, market share estimate, or independent benchmark.
    claimRefs: [CP001, CP002, CP003, CP005, CP010, CP011, CP015, CP016]
callouts:
  - calloutType: insight
    title: Differentiation is real but not yet durable
    body: >-
      OriCell has a credible differentiation thesis in GPC3 solid tumors, GPRC5D hematology, and next-generation manufacturing, but each leg remains exposed to direct target peers, approved hematology products, and unresolved manufacturing or durability questions.
    claimRefs: [CP001, CP002, CP010, CP011]
  - calloutType: risk
    title: Comparative proof is the gating issue
    body: >-
      The assigned evidence does not disclose OriCell's realized price, release rate, site breadth, reimbursement, or comparative pivotal outcomes. Those gaps can materially change the competitive conclusion.
    claimRefs: [CP008, CP012, CP013, CP014]
  - calloutType: recommendation
    title: Track inflection points rather than assume a moat
    body: >-
      Reassess when Ori-C101 reports pivotal data, manufacturing turnaround and release distributions, and price or reimbursement terms; separately test whether OriCAR-017 can compete with approved or later-stage GPRC5D options.
    claimRefs: [CP002, CP007, CP012, CP013]
