    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP010, CP011, CP016]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, OriCell, Direct or adjacent alternatives, Evidence-backed implication]
    rows:
