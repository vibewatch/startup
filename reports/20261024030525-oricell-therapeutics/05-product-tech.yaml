callouts:
  - calloutType: strength
    title: Target-plus-platform coherence
    body: OriCell has a coherent disclosed link between named oncology targets, engineered-cell platforms, and manufacturing capabilities, but the public evidence is still mostly stage and description evidence rather than reproducible performance evidence.
    claimRefs: [CE001, CE005, CE007]
  - calloutType: risk
    title: Technical underwriting remains evidence-limited
    body: The principal blockers are trial-level safety and durability, CMC release and turnaround data, phase reconciliation, and a patent freedom-to-operate analysis that goes beyond a disclosed application count.
    claimRefs: [CE003, CE013, CE014, CE016]

