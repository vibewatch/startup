    title: Product module / asset matrix
    columns: [Asset or module, User or indication, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Ori-C101 / ORIC-101", "Patients with GPC3-positive or advanced hepatocellular carcinoma", "Early clinical; Phase 1 or early Phase 1 descriptions differ by source", "GPC3-targeted autologous CAR-T", "Reconcile registry, protocol, cohort size, durability, and current phase"]
      - ["OriCAR-017", "Patients with relapsed/refractory multiple myeloma", "Phase 1/2 reported by BioPharma Dive; earlier IND-enabling description also exists", "GPRC5D-targeted CAR-T", "Verify current trial status, comparative efficacy, and safety dataset"]
      - ["OriAb / antibody engineering", "Internal discovery and candidate-design teams", "Platform described; maturity not independently quantified", "Antibody screening and engineering", "Obtain target-selection, affinity, specificity, and validation data"]
      - ["OriArmoring / OnGo", "Clinical manufacturing and development operations", "Functional-enhancement and rapid-CMC platforms described", "Solid-tumor functionality and production workflow", "Obtain release metrics, batch failures, turnaround, and GMP evidence"]
    notes: "Rows combine company-issued descriptions and secondary profiles; status labels preserve source disagreement, and a gap identifies evidence needed rather than implying absence."
    claimRefs: [CE001, CE003, CE005, CE007]
  - id: TE002
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Technical risk]
    rows:
      - ["Target and antibody discovery", "Select and engineer tumor-binding components", "Validated antigen expression and antibody datasets", "Off-target binding, antigen heterogeneity, and freedom to operate"]
      - ["CAR-T engineering", "Create autologous or next-generation cellular products", "Vector, construct, cell-quality, and patient-material controls", "Persistence, exhaustion, toxicity, and patient-to-patient variability"]
      - ["Immune-microenvironment enhancement", "Support activity against solid-tumor barriers", "Armoring design and translational validation", "Preclinical effects may not translate to human tumors"]
      - ["Clinical and GMP manufacturing", "Produce and release investigational therapy", "Qualified facilities, assays, logistics, and batch records", "Release failures, turnaround variance, scalability, and comparability"]
    notes: "Architecture is synthesized only from disclosed platform roles; the sources do not provide a complete validated process map or quantitative operating KPIs."
    claimRefs: [CE006, CE007, CE008, CE013]
  - id: TE003
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Treat advanced liver cancer", "Select patients with a relevant tumor antigen and administer investigational therapy", "GPC3-targeted Ori-C101/ORIC-101", "Six of ten patients reportedly responded in a small 2025 ASCO study", "Company-reported early result; denominator and follow-up need primary readout"]
      - ["Treat relapsed/refractory multiple myeloma", "Develop and administer a target-specific cell therapy in staged trials", "GPRC5D-targeted OriCAR-017", "Clinical development has progressed to a reported Phase 1/2 China trial", "Current phase, safety, durability, and comparator evidence need verification"]
      - ["Develop additional solid-tumor candidates", "Screen targets and iterate engineered-cell constructs", "OriAb, OriCAR, OriTIL, and OriUCAR platform family", "Portfolio breadth across CAR-T and related cell/gene modalities", "Platform-level breadth does not establish candidate success or economics"]
      - ["Manufacture investigational products", "Run discovery, clinical development, and GMP production as an integrated operation", "OnGo rapid CMC system and integrated capabilities", "Potentially faster or more controlled development cycle", "No public release-rate, failure-rate, or turnaround distribution"]
    notes: "Benefits are source-reported or qualitative, not independently validated operating outcomes; null quantitative fields are diligence requests."
    claimRefs: [CE009, CE010, CE011, CE012]

