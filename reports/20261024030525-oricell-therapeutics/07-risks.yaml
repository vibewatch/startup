  evidenceGaps:
    - type: "conflicting-data"
      severity: "material"
      topic: "runway"
      missingEvidence: "Current cash, restricted cash, monthly burn, committed capital, milestone budget, and financing terms."
      whyItMatters: "Cumulative funding totals conflict and cannot establish liquidity or survival to the next value-creating milestone."
      diligencePath: "Reconcile audited bank balances, management accounts, financing documents, cap table, liquidation preferences, and a board-approved 24-month cash forecast."
      relatedQuestionRefs: [QR005]
    - type: "private-evidence-only"
      severity: "material"
      topic: "manufacturing"
      missingEvidence: "Batch release rates, deviations, remanufacture frequency, turnaround distribution, capacity, comparability, and regulator CMC correspondence."
      whyItMatters: "Manufacturing execution can gate pivotal enrollment, product consistency, approval timing, and gross-margin potential."
      diligencePath: "Conduct a CMC data-room review with quality leadership and inspect batch history, assay validation, site readiness, vendor qualification, and regulator questions."
      relatedQuestionRefs: [QR003, QR006]
      relatedTableRefs: [TR002]
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "patents"
      missingEvidence: "Complete patent-family, license, litigation, opposition, inventorship, encumbrance, and freedom-to-operate records by jurisdiction."
      whyItMatters: "Application and grant counts do not show claim breadth, ownership, blocking rights, or design-around feasibility."
      diligencePath: "Obtain external-counsel FTO and chain-of-title opinions, then reconcile company entities and key targets against USPTO, CNIPA, WIPO, PTAB, and court records."
      relatedQuestionRefs: [QR002, QR007]
      relatedTableRefs: [TR001]
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "dependencies"
      missingEvidence: "Named critical suppliers, CDMOs, clinical sites, investigators, licenses, data vendors, concentration metrics, and fallback arrangements."
      whyItMatters: "An undisclosed single point of failure could interrupt dosing, enrollment, regulatory work, or platform rights."
      diligencePath: "Build a dependency schedule from contracts and spend data, quantify concentration, test termination and change-of-control clauses, and verify funded fallback plans."
      relatedQuestionRefs: [QR004, QR009]
      relatedTableRefs: [TR003]
    - type: "missing-source"
      severity: "material"
      topic: "security-privacy"
      missingEvidence: "Security architecture, independent assessments, privacy governance, incident history, vendor controls, and clinical-data remediation records."
      whyItMatters: "Clinical and patient data exposure could create operational, regulatory, and reputational harm, while source silence cannot establish incident absence."
      diligencePath: "Commission a security and privacy review covering systems, trial data flows, vendors, access controls, incident response, and jurisdiction-specific obligations."
