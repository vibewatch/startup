callouts:
  - calloutType: recommendation
    title: Price discipline
    body: "Do not convert the $110M financing amount into a company valuation or return estimate; the retained sources do not disclose price, post-money valuation, security, or dilution."
    claimRefs: [CV001, CV003]
  - calloutType: risk
    title: Thesis-break triggers
    body: "Re-underwrite immediately after a failed or materially delayed lead-program milestone, a financing with severe dilution, or evidence that cash runway ends before the next value-creating clinical event."
    claimRefs: [CV012, CV014]

