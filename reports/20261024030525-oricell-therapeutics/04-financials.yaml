      - [Cash burn, null, low, "Converts capital raised into runway", "Provide monthly cash burn by R&D, clinical, manufacturing, and G&A"]
    notes: "All values are unavailable in the assigned evidence; nulls are explicit diligence blockers rather than zero estimates."
