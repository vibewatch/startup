company:
  name: OriCell Therapeutics
chapter:
  number: 4
  title: Financials
  summary: OriCell has a clinical-stage, financing-led model with no public revenue, margin, cash, burn, or runway disclosure in the assigned evidence. The April 2026 financing improves near-term capital capacity, but underwriting remains constrained by private-company opacity, unresolved realized pricing, manufacturing economics, and the absence of audited operating metrics.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: OriCell's public materials describe a clinical-stage oncology and immunology biotechnology company developing autologous CAR-T therapies, rather than a commercial product company with disclosed recurring revenue. The official site identifies Ori-C101 and OriCAR-017 as clinical programs and describes platform capabilities, but it does not provide list prices, contracts, product sales, revenue, or realized reimbursement. A third-party private-company profile labels the revenue model as licensing, while another profile describes the company as B2B; neither provides a contract, royalty rate, milestone schedule, or recognized revenue. The financially supportable conclusion is therefore not that licensing revenue exists, but that a licensing pathway is plausible and unverified. The model is currently dependent on financing and future clinical or partnering milestones, not public operating cash flow.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: go-to-market-and-costs
    title: GTM motion, cost structure, and unit economics
    body: The assigned sources provide no customer acquisition cost, sales cycle, payback, gross margin, contribution margin, cost of goods sold, working-capital schedule, or capex disclosure. That absence is material because autologous cell therapy economics depend on patient acquisition, treatment-center access, manufacturing release, logistics, and quality-control costs; platform descriptions alone do not quantify any of those drivers. OriCell says proceeds are intended for global clinical development, manufacturing-capability expansion, and capital-market milestones, while earlier financing was directed toward U.S. clinical development. Those uses indicate a research, clinical, and manufacturing cost base, but they do not establish burn or unit economics. Any scenario should keep realized pricing, treatment cost, batch failure or remanufacture rates, and site economics as unavailable inputs rather than substituting public list prices or peer-company margins.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: Financing is the clearest public financial signal. The assigned sources report an April 2026 pre-IPO round in excess of $110 million, a January 2026 Series C1 initial closing of $70 million, a February 2023 Series B1 round of $45 million, and a July or August 2022 Series B reported at more than $120 million or $125 million depending on the source. These are financing proceeds, not cash on hand, and the sources do not disclose post-money valuation, current balance, monthly burn, runway, debt, or liquidation preferences. The proceeds are described as supporting global clinical development and manufacturing expansion, so capital needs remain milestone-dependent. The round chronology supports improved funding capacity but cannot establish solvency through the next value-creating milestone without management accounts and a cash forecast.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: underwriting-verdict
    title: Financial underwriting verdict and diligence blockers
    body: OriCell's financial profile is investable only as a private, clinical-stage financing case rather than as an operating-revenue underwriting. Evidence supports a substantial investor syndicate and continued pipeline progression, including a confirmatory Phase II path for Ori-C101 and global development for OriCAR-017, but those milestones are not revenue recognition events. The strongest positive is access to fresh capital; the strongest negative is that public sources do not provide the cash bridge needed to map that capital to runway, manufacturing scale, or commercialization readiness. The evidence also contains inconsistent aggregate-funding and round labels across data vendors, and one source reports a 25-person employee count while other sources do not provide a current headcount. Before underwriting price or return, diligence should obtain audited or management financials, the current cap table and terms, cash and burn by function, manufacturing cost and release data, and any licensing or commercial contracts.
    claimRefs: [CI013, CI014, CI015, CI016]
    callouts:
      - calloutType: risk
        title: Runway is not established
        body: The April 2026 financing is a funding event, not evidence of cash available or months of runway; current cash, burn, debt, and milestone spend remain undisclosed.
        claimRefs: [CI010, CI012, CI015]
      - calloutType: recommendation
        title: Require terms-level financial diligence
        body: Proceed only after receiving a cash forecast tied to clinical and manufacturing milestones, realized pricing or partnering economics, and the full financing terms.
        claimRefs: [CI012, CI015, CI016]
