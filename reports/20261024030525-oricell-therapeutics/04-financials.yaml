      - ["2026-01", "Series C1 initial closing", "$70M", "Global development and solid-tumor CAR-T work", "Initial closing does not establish total capital available"]
      - ["2026-04", "Pre-IPO financing", "> $110M", "Global clinical development, manufacturing expansion, and capital-market milestones", "No valuation, terms, cash balance, or debt disclosure"]
    notes: "Amounts are reported financing proceeds, not revenue or cash on hand; the 2022 amount is shown as a source-reported range because assigned sources differ."
    claimRefs: [CI009, CI010, CI011, CI012]
