company:
  name: OriCell Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: OriCell Therapeutics is a Shanghai-based, clinical-stage cell-therapy company founded in 2015 and focused on CAR-T programs for solid tumors and hematologic malignancies. Its 2026 financing, clinical, regulatory, and leadership milestones are material, but valuation, cash runway, commercial scale, and a complete governance record remain unavailable.
sections:
  - id: identity-and-stage
    title: Identity, business model, and development stage
    body: >-
      OriCell is described by company and independent sources as a Shanghai-based clinical-stage biotechnology company developing cell therapies for cancer. The business remains a development-stage model rather than a demonstrated recurring-revenue operation: retained evidence identifies no approved product, recognized revenue, or verified customer count. The lead program is Ori-C101, a GPC3-targeted autologous CAR-T candidate for advanced hepatocellular carcinoma, while OriCAR-017 targets GPRC5D in relapsed or refractory multiple myeloma. Public descriptions also identify antibody discovery, CAR engineering, and manufacturing capabilities. These assets support a coherent platform narrative, but clinical, regulatory, manufacturing, and financing execution still determine enterprise value.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      A 2026 PharmaBoardroom interview identifies Helen Yang and Peter He as founders and describes Peter He as chief scientific officer. OriCell's September 2026 media-center notice instead identifies Huanfeng Yang as co-founder, chairman, and former chief executive, and says Feng Guo became chief executive for group business and operations while Huanfeng Yang remained chairperson and president. The retained sources do not establish whether Helen Yang and Huanfeng Yang are alternative names for the same person. That ambiguity should not be resolved by assumption. The public record also lacks a complete board roster, voting structure, committee mandates, and succession plan, making leadership identity, authority boundaries, and key-person dependence priority diligence items.
    claimRefs: [CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing history and stakeholder map
    body: >-
      OriCell announced a pre-IPO financing above $110 million in April 2026 after earlier reported rounds, including a $125 million Series B in 2022, a $45 million B1 in 2023, and a $70 million Series C1 closing in January 2026. The latest syndicate included Vivo Capital, Beijing Medical and Health Care Industry Investment Fund, Qiming Venture Partners, E-Town Capital, Luxin Venture Capital, NGS Super, Elikon Investment, and Talon Capital. Tracxn reports $350 million in total funding across four rounds, but AllSci notes that the April announcement did not disclose previous funding totals. The figures therefore describe financing activity, not cash currently available, and do not establish valuation, dilution, liquidation preferences, burn, or runway.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: milestones-and-underwriting-limit
    title: Milestones and underwriting limits
    body: >-
      The 2026 record shows execution momentum: OriCell announced Series C1 and pre-IPO financings, reported Ori-C101 clinical data, received company-reported NMPA clearance for a confirmatory Phase II trial, and changed chief executive leadership. Those events strengthen the case that the company is active and advancing, but they do not substitute for primary regulatory letters, audited accounts, or independently verified trial records. The solid-tumor modality also carries category-level constraints. A 2026 technical review identifies inadequate tumor infiltration, immunosuppressive microenvironments, and metabolic obstacles as barriers to CAR-T efficacy in solid tumors. The appropriate underwriting posture is evidence-positive but conditional on primary clinical, regulatory, governance, and cash documentation.
    claimRefs: [CO005, CO008, CO010, CO012, CO016]
callouts:
  - calloutType: strength
    title: Financing and clinical momentum
    body: OriCell disclosed sizeable 2026 financings and company-reported progress of Ori-C101 into a confirmatory Phase II program.
    claimRefs: [CO005, CO010, CO012]
  - calloutType: risk
    title: Private-company opacity
    body: Valuation, security terms, cap table, cash runway, revenue, customer count, and complete governance records remain unavailable.
    claimRefs: [CO009, CO015]
  - calloutType: recommendation
    title: Diligence priority
    body: Treat funding raised as financing history, not cash available or equity value; request the cap table, financing documents, audited accounts, regulatory letters, and trial records.
    claimRefs: [CO013, CO015]
