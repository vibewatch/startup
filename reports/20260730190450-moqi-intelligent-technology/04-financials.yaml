- id: valuation-mechanics
  title: Valuation Mechanics Depend on Investor Conviction More Than Financial Output
  body: 'The July 2026 valuation framing should be handled with discipline. Public reports consistently describe a post-money valuation above RMB 7 billion. Using contemporaneous FX conventions, that translates to roughly US$963 million to US$970 million. That is close enough to attract unicorn-style language but not cleanly above the US$1 billion threshold, so the report should keep RMB as the canonical denomination and treat the USD number as an approximation. More importantly, the valuation is not being defended by visible revenue or delivery metrics. The best-supported adverse interpretation comes from 36Kr, which explicitly asks how a company that has not publicly disclosed customers, orders, revenue, or even a fully launched first product reached such a mark.


    That critique is financially important because Morphi already sits in the part of the valuation curve where ownership math, downside protection, and exit path matter more than narrative scarcity. Comparable humanoid companies help frame the issue. Figure AI and Unitree both show that the sector can sustain aggressive prices, but their marks come with either published deployment data, clearer financing history, or at least far wider product visibility. Morphi''s current mark therefore looks less like a priced operating business and more like a call option on founder quality, architecture transfer from autonomous driving, and the belief that the company can compress time-to-commercialization faster than other entrants. That can still work, but it is a stretched underwriting basis, not an evidenced cash-flow basis.'
  claimRefs:
  - CI002
  - CI010
  - CI015
