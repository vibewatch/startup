- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric or document
  - Impact on underwriting
  - Why missing is material
  - Exact diligence path
  rows:
  - - Current revenue / ARR / bookings
    - Cannot test whether valuation has any operating support
    - A pre-commercial business should be valued on milestones, but zero commercial transparency increases downside risk
    - Request monthly bookings, recognized revenue, and pilot-to-production conversion view
  - - Pricing and contract structure
    - Cannot judge monetization quality or service burden
    - Hardware sale versus robot-as-a-service versus support subscriptions would produce different margin paths
    - Request customer proposals, pilot contracts, and standard commercial terms
  - - Gross margin / BOM / service cost
    - Cannot judge scalability or whether service deployments are loss-leading
    - Humanoid robotics can fail financially even with demand if support costs stay too high
    - Request BOM, field-service model, warranty assumptions, and spare-parts plan
  - - Cash, burn, and runway
    - Cannot assess financing dependency or urgency of next round
    - A large initial round can still evaporate quickly under chip, compute, and manufacturing spend
    - Request cash ledger, monthly burn by function, and 18-month runway model
  - - Cap table and liquidation preferences
    - Cannot judge return profile or dilution risk at a stretched entry price
    - Near-US$1B headline value may hide investor-friendly structures that subordinate new money
    - Request full cap table, financing docs, and preference summary
  notes: These are the minimum public-to-private handoff items needed to convert the current narrative into a true financial-underwriting file.
