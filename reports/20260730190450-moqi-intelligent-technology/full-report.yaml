  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Price Anchor Is Real but Still Mostly Narrative-Backed
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor for Morphi is straightforward: multiple outlets reported that the
              company completed its angel-series financing at a cumulative total above RMB 1 billion and a post-money
              valuation above RMB 7 billion in July 2026. On foreign-exchange translation, that is roughly US$963
              million to US$970 million, which is near-unicorn territory but not a clean US$1 billion mark. That
              distinction matters because the company is already being discussed with late-seed or early-growth pricing
              optics even though public evidence still shows a prototype-stage robotics company.


              The missing offset is commercial proof. Public materials do not yet disclose revenue, shipment volume,
              named customers, production-unit output, or field reliability metrics. As a result, the price is less an
              operating mark than a future-capability mark. Investors are effectively paying now for the expectation
              that Morphi can convert founder pedigree, embodied-AI architecture, and a top-tier syndicate into
              deployment evidence later. 36Kr's skepticism is relevant for exactly that reason: the tension is not
              whether the company is talented, but whether the valuation moved ahead of disclosure and proof.
            claimRefs:
              - CV001
