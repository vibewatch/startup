            body: >-
              Public sources are consistent on the big picture: Morphi is building a general-purpose humanoid robot
              platform, not a narrow delivery bot or an AI-software layer for other OEMs. Baidu and founder-facing
              profiles describe a first prototype already launched, with the company aiming eventually at home service
              but starting from commercial scenarios where workflows are narrower and data can be collected faster. That
              product definition matters because it sets the bar much higher than a single-purpose service robot. A
              general-purpose humanoid must combine locomotion, perception, grasping, language understanding, and
              long-horizon task execution inside human-built spaces.


              What is still missing is almost everything a buyer or engineer would normally want in a technical
              snapshot. Public evidence does not disclose a clean module map, payload, battery life, onboard compute, or
              explicit manipulation performance. As a result, diligence should think of Morphi today as one prototype
              platform with a broad ambition, not as a mature multi-SKU product line. The company's visible
              differentiation is therefore architectural and strategic: the choice to build a humanoid around a Native
              Visual-Action Model plus World Model, and the choice to chase commercial-service data first before
              household breadth. Those choices are coherent. They are not yet equivalent to a fully benchmarked product
