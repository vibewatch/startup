              Morphi's stated product path already narrows the customer universe. Public sources repeatedly describe a
              commercial-first deployment strategy, with hotels, service environments, and last-mile logistics mentioned
              before household use. That means the real near-term customer is not a mass consumer. It is a venue
              operator, service company, logistics manager, or automation buyer willing to test a humanoid in a
              semi-structured workflow. MarketsNXT and broader China-humanoid analysis reinforce why that makes sense:
              factories, warehouses, logistics nodes, and operational service environments are where budgets, labor
              pain, and data density can support early deployment economics.


              This also shapes the buyer-user-payer split. The user may be a frontline operations team or service staff.
              The buyer is more likely an operations leader, automation team, facility manager, or innovation office.
              The payer is likely a capex or operations budget owner. For Morphi, the strongest inference is therefore
              segment plausibility rather than segment proof. The company has chosen the right side of the market in
              theory—commercial environments first—but it has not yet shown which exact persona is prepared to sign,
