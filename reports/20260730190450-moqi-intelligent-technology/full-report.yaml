      - number: '2.3'
        title: Buyer, User, and Budget Structure Favors Factories and Service Pilots First
        blocks:
          - type: paragraph
            body: >-
              The buyer map matters because humanoid-robot demand is not monolithic. Manufacturing and warehouse buyers
              usually purchase against automation or capex budgets and judge the robot against throughput, reliability,
              and labor substitution economics. These are the most important buyers for any startup that wants to prove
              industrial relevance. Commercial-service buyers—hotels, retail environments, public-facing venues, and
              similar operators—care more about safe interaction, service coverage, and incremental labor efficiency.
              Research and developer buyers sit between them: they are often the earliest adopters because they can
              tolerate imperfection and pay from lab, innovation, or R&D budgets rather than insisting on immediate
              site-level ROI.


              This segmentation maps well onto Morphi’s declared path. The company’s public positioning toward hotels
              and commercial service makes sense as a first wedge because those environments create repeatable data
              while remaining less punishing than automotive or electronics manufacturing. But the broader market
              evidence says factories and warehouses may still become the dominant volume buyers first. Official product
              pages reinforce the segmentation logic: Unitree leans into accessible humanoids and developer kits, UBTECH
              highlights enterprise and consumer service robotics, 1X markets household safety and chores, while Boston
              Dynamics and Agility frame industrial automation more directly. The implication for Morphi is clear: its
              first buyers may be service-oriented, but the market’s biggest long-run spending pools still skew
              industrial.
