      - number: '1.5'
        title: Why Investors Leaned In, and What Remains Open
        blocks:
          - type: paragraph
            body: >-
              The broader 2026 China embodied-AI backdrop helps explain why Morphi could raise so much so quickly.
              EmbodiedGlobal, AInChina, TrendForce, and trade-market publications all describe a sector where capital
              has shifted from pure-model enthusiasm toward physical-world deployment. China already has a dense
              humanoid field, while Q1 and H1 2026 funding totals rose sharply. In other words, Morphi raised into a
              moment when investors were prepared to back credible teams attempting to build data flywheels and real
              robots rather than software demos. That context matters because Morphi’s public pitch — transfer
              end-to-end vehicle-AI lessons into general-purpose embodied robotics — is aligned with the dominant
              industry narrative, not fighting it.


              But the same context makes the open questions harsher, not softer. TrendForce and TechTimes both show that
              Unitree and AgiBot are already driving shipment concentration. Morphi therefore does not enter a blank
              market; it enters a market where scaled leaders are already accumulating data, supply-chain leverage, and
              deployment experience. This is why the 36Kr critique is important. The company may be promising, and the
              founder pair may deserve close tracking, but today’s public record still describes a high-valuation
              pre-commercial startup with limited disclosure. For later chapters, this chapter should be treated as the
              canonical baseline: impressive founder-market fit, extraordinary early financing, credible prototype
              progress, and still-unproven commercial execution.
            claimRefs:
              - CO035
              - CO036
              - CO039
              - CO040
              - CO041
