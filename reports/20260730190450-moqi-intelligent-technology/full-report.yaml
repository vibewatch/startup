      - number: '8.2'
        title: The Bull Thesis Exists, but the Anti-Thesis Is Equally Concrete
        blocks:
          - type: paragraph
            body: >-
              The bull case is not imaginary. China remains the deepest near-term humanoid-robotics market, funding has
              continued to flow into embodied-AI leaders, and Morphi assembled one of the stronger founder-plus-investor
              stories in the newest cohort. Alibaba, Tencent, Legend Capital, BlueRun and other backers reduce
              financing-risk in the narrow sense that the company is unlikely to be ignored if early technical proof
              appears. If Morphi can show repeatable service-scenario deployments, safety KPIs, and a credible data
              loop, today's valuation could become a bridge to a much larger commercial platform.


              The anti-thesis is just as concrete. Unitree and AGIBOT already show shipment or deployment scale, Figure
              has BMW production proof and a much larger capital base, and even Western peers such as Physical
              Intelligence and 1X have clearer public narratives around what their money is buying. Morphi therefore
              sits in the least forgiving part of the curve: expensive enough to require exceptional outcomes, but early
              enough that core diligence items remain undisclosed. That combination keeps the recommendation from moving
              above track.
