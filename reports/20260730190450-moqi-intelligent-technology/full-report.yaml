    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Registration, and What the Company Actually Is
        blocks:
          - type: paragraph
            body: >-
              Morphi Intelligence is the English-facing brand for Shenzhen Moqi Intelligent Technology Co., Ltd., a
              company registered on 2025-08-27 in the Qianhai Shenzhen-Hong Kong Cooperation Zone. Across Baidu
              Encyclopedia, Preqin, and CB Insights, the core identity is consistent: this is a Shenzhen-based embodied
              robotics startup founded in 2025, not an older industrial automation incumbent or an offshoot of a listed
              parent. The company is still early enough that legal-domicile and operating-location evidence are not
              perfectly aligned. Baidu anchors the registration story in Qianhai, while CB Insights lists a public
              operating address in Shenzhen Bay Eco-Tech Park in Nanshan District. That looks more like a typical
              China-startup split between registration venue and working office than a contradiction, but it is still a
              diligence item worth cleaning up before site visits or employment checks.


              What the company says it is also matters because the valuation is already too large to tolerate fuzzy
              category definitions. Public profiles describe Morphi as an embodied-intelligence or general-purpose
              humanoid robotics company. Founder materials and later news coverage converge on a hardware-plus-software
              thesis: Morphi is trying to build robots, data systems, and action-oriented models together, not simply
              supply AI software to third-party hardware. The public business-model story is still more directional than
              operational. Morphi says it wants to start with commercial-service scenarios, use real deployments to
              collect data, and eventually extend into home use; that is plausible, but the exact product packaging,
              pricing, and deployment model are still undisclosed. The most defensible classification for this chapter
              is therefore seed / pre-product embodied robotics platform, with identity well supported and operating
              specifics still partial.
