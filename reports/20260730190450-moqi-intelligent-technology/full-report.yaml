  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and the Real Substitute Set
        blocks:
          - type: paragraph
            body: >-
              Morphi is not entering the whole “automation market,” and treating it that way would overstate both
              valuation support and practical demand. The most defensible boundary is the China humanoid-robot market
              plus the adjacent embodied-AI service stack needed to deploy those machines: hardware, actuators,
              perception and reasoning software, integration, maintenance, and related manufacturing services.
              MarketsNXT explicitly uses this broader definition, which matters because a company like Morphi is not
              just selling a body or a model. It is trying to combine action models, world models, embodied data
              collection, and robot deployment into one product system.


              What should stay outside the boundary is equally important. Fixed industrial arms, AMRs without
              manipulation, kiosks, software-only copilots, and many legacy service robots remain substitutes, not part
              of the same addressable spend by default. The humanoid wedge appears only when a buyer needs flexible
              operation in human-built spaces, some degree of 3D manipulation, and less facility redesign than legacy
              automation requires. For Morphi, that means the strongest near-term adjacency is not the abstract “home
              robot market” but the narrower set of service and industrial scenarios where embodied AI can replace or
              augment semi-structured human labor. This chapter therefore treats hotels, retail-service settings,
              logistics-adjacent workflows, and light industrial deployments as the most relevant near-term segments,
              while preserving homes as a longer-dated adjacency rather than a 2026 revenue assumption.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
