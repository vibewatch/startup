      - number: '6.4'
        title: Durability, Expansion, and Concentration Risk Stay Open Until the First Few Accounts Land
        blocks:
          - type: paragraph
            body: >-
              The lack of customer disclosure has a second-order effect: it makes every durability question
              unanswerable. There is no public NRR, GRR, churn, renewal rate, satisfaction score, contract length, or
              cross-site expansion pattern. As a result, the chapter cannot tell whether Morphi's first
              deployment—whenever it happens—would be a one-off showcase or the start of a genuine land-and-expand
              motion. The only reasonable conclusion is that concentration risk is maximal until the first accounts are
              disclosed, because a single anchor site could dominate the company's learning curve, commercial narrative,
              and future fundraising posture.


              Peer evidence again clarifies the standard. The market already rewards companies that can point to
              reference customers, repeat deployments, and scenario breadth. That means Morphi's first named customer
              will matter disproportionately, not only for revenue but also for signaling. Investors should therefore
              treat the next phase as a commercial-proof phase, not a scaling phase. Until Morphi can show at least one
              named reference account, one defined use case, and one set of repeatable outcome metrics, the
              recommendation should remain cautious.
            claimRefs:
