      - number: '7.3'
        title: Operational, Quality, and People Risk Remain Underdisclosed
        blocks:
          - type: paragraph
            body: >-
              The operational risk picture is underdisclosed rather than obviously poor, but that itself is a risk. In
              humanoid robotics, buyers eventually care about hardware reliability, intervention frequency, support
              burden, safety incidents, and upgrade discipline. Figure's BMW deployment shows how far the market has
              already moved toward KPI-based trust. Morphi has not published equivalent numbers, so no outsider can say
              whether the company is merely private or genuinely behind. Service-scenario starting points should reduce
              some environmental complexity versus homes, but they do not remove the challenge of long-duration
              operation around humans and changing physical conditions. Every missing field KPI widens uncertainty on
              failure rates, maintenance costs, and deployability.


              People risk is equally important. The public case remains tightly concentrated on Gao Wenli and Huang
              Qingqiu. Their strengths are real, but so is the key-person dependency. Baidu's sub-50-headcount signal
              also suggests that Morphi still needs to build depth across manufacturing, safety, field service, and
              customer-success functions if it wants to scale. That does not mean the bench is weak; it means the bench
              is still largely invisible. For investors, that translates into a simple rule: until the company shows
              field-ready operational systems and a broader leadership layer, people risk and operational risk should be
              treated as coupled rather than separate categories.
