    description: Conditions that would materially weaken the case for paying or holding the current private-market mark.
    columns:
      - Trigger
      - Threshold
      - Why it matters
      - Action implication
    rows:
      - - No named pilot or deployment proof
        - Next major financing arrives without public commercial evidence
        - Suggests valuation advanced ahead of customer adoption
        - Downgrade from track toward pass
      - - Reliability metrics stay undisclosed
        - Management still avoids uptime / intervention / safety KPI disclosure after pilot claims
        - Prevents proof-adjusted underwriting
        - Require major discount or stop process
      - - Flat or down round with heavy preferences
        - New money needs economic protection despite strong headline narrative
        - Indicates current common-equity upside was overstated
        - Rework return expectations using liquidation stack
      - - China leaders widen scale gap further
        - Unitree / AGIBOT continue shipping while Morphi remains prototype-stage
        - Raises data and commercialization disadvantage
        - Increase discount rate and lower scenario range
      - - Governance remains opaque
        - Board, controls, and budget ownership stay undisclosed
        - Makes capital-efficiency and downside governance harder to trust
        - Escalate diligence before any term-sheet engagement
    notes: These are practical investment-committee triggers, not operational predictions.
    claimRefs:
      - CV014
      - CV018
      - CV022
      - CV028
      - CV029
      - CV030
      - CV038
  - id: TV006
    title: Final diligence asks table
    description: Public-to-private diligence items required before underwriting Morphi beyond watchlist status.
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Commercial proof
        - Named pilots, deployment scope, customer references
        - Shows whether the product is actually crossing from prototype to workflow
        - Management presentation and customer calls
      - - Operating KPIs
        - Uptime, intervention rate, task success, safety incidents
        - Converts technical narrative into investable proof
        - Engineering review and site visit
      - - Cash and burn
        - Cash on hand, monthly burn, runway, budget by function
        - Determines financing urgency and dilution risk
        - Finance room / board pack
      - - Cap table and terms
        - Liquidation preferences, option pool, board rights, pro rata terms
        - Determines true common-equity economics at current headline mark
        - Legal diligence on financing docs
      - - Unit economics
        - BOM, service cost, warranty burden, target pricing
        - Determines whether growth can eventually create margins
        - Ops diligence and manufacturing review
      - - Regulatory / safety controls
        - Standards path, safety testing, privacy and data handling
        - Important for customer adoption and downstream liability
        - Compliance review
    notes: >-
      If these requests cannot be answered cleanly, the recommendation should remain track regardless of market
      excitement.
    claimRefs:
      - CV019
      - CV029
      - CV030
      - CV031
      - CV040
