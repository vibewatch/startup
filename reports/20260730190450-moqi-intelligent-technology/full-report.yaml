      - number: '4.3'
        title: Capital Adequacy Is Better Than Typical Seed Robotics, but Runway Is Still a Proxy Estimate
        blocks:
          - type: paragraph
            body: >-
              Morphi's large round does provide one real advantage: it reduces near-term fundraising pressure relative
              to most pre-product robotics startups. Category economics explain why investors may have wanted to
              front-load that advantage. Embodied AI requires parallel investment in robot hardware, sensors, compute,
              model training, data collection, testing environments, and pre-production quality systems. Several
              reviewed sources stress that this is not a software-only scaling problem. TMTPost and WeDoAny both frame
              the category as one that must fund physical machines and real-world feedback loops at the same time.
              Embodied Global adds a further capital requirement if Morphi really pursues an embodied-native chip. That
              is strategically interesting, but it also expands the future financing envelope.


              Because the company does not disclose cash, burn, or debt, any runway view must be treated as an estimate
              rather than a fact. A sub-50-person robotics startup with prototype development, edge-model training, and
              early manufacturing preparation could plausibly burn high-single-digit to low-double-digit RMB millions
              per month before true production scale. On that crude outside-in basis, the reported financing is large
              enough to support meaningful iteration time. But the range is wide: aggressive chip work, supply-chain
              commitments, or heavier field operations could compress runway quickly, while disciplined prototype pacing
              could extend it. The practical investment conclusion is that Morphi looks better capitalized than a normal
              seed company but still cannot be judged cash-secure without internal financials.
