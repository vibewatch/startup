- id: founders-governance
  title: Founders, Leadership Concentration, and Governance Signals
  body: 'The investment case is visibly founder-led. Gao Wenli is consistently identified as founder and CEO, while Huang Qingqiu is the co-founder and CTO. Gao brings the commercialization half of the story: public profiles say he spent about eleven years at Huawei across R&D, product, and overseas leadership roles before co-founding iMile, the cross-border logistics company that scaled across China and Middle East delivery markets. Even if iMile is not a robotics business, it is relevant evidence for Morphi because it implies experience in supply chains, cross-border operations, and execution under messy real-world conditions rather than a purely laboratory background.


    Huang provides the technical premium. Baidu, News18A, and his own public profile all describe him as a 2020 Huawei Genius Youth recruit who rose to lead intelligent-driving AI work and pushed end-to-end methods into production scale. He explicitly argues that autonomous driving is a subset of embodied intelligence and that closed-loop data and systems engineering transfer naturally into robotics. That logic helps explain why investors were willing to underwrite Morphi before launch. The governance side, however, is much thinner than the biographies. Baidu records February 2026 director additions and capital-structure changes, but public materials still do not disclose a full board roster, investor rights, or post-round ownership map. The result is a high-concentration leadership structure: the company’s main differentiation is tightly linked to two people whose technical and operating reputations are doing most of the valuation work today.'
