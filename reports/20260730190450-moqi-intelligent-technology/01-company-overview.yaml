- id: capital-valuation
  title: Funding History, Investor Base, and Valuation Framing
  body: 'Morphi’s financing path is unusually aggressive for a company that has not yet launched a commercial robot. The first disclosed anchor is a roughly RMB 900 million angel round completed on 2025-12-29, with Legend Capital and BlueRun Ventures named among investors. Public materials then point to a February 2026 Pre-A round, described as an exclusive investment by Shenqi Capital / 58 Industrial Fund. By 2026-07-07, Morphi and its media ecosystem were saying cumulative angel-series financing exceeded RMB 1 billion, or about US$137-140 million depending on the translation and FX assumption used. Alibaba and Tencent were named as co-leads for the later cumulative announcement, alongside a long list of domestic VC and hard-tech investors.


    The valuation framing is where the chapter must stay careful. Reports consistently say post-money valuation exceeded RMB 7 billion. At July 2026 exchange rates, that is roughly US$963-970 million — near unicorn level, but not cleanly above it unless one uses a round-number shortcut. The report should therefore preserve the RMB denomination as primary and describe the USD figure as a near-US$1 billion equivalent rather than a hard-dollar unicorn fact. Public use-of-proceeds explanations also remain high level: expand technical talent, grow research infrastructure, and accelerate physical foundation model training. That is directionally sensible for embodied AI, but the absence of revenue, customer, or delivery evidence means investors are paying mostly for team credibility, sector timing, and the possibility that Morphi can compress time-to-product relative to slower, more traditional robotics entrants.'
