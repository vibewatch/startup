  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current shareholder register, board roster, and financing terms after the July 2026 angel-series close.
    whyItMatters: Ownership concentration, investor rights, and board control are central to judging whether the valuation is a pure reputation premium or part of a tighter governance architecture.
    diligencePath: Request the latest cap table, shareholder agreement summary, and board composition directly from the company or investors.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-readiness
    missingEvidence: Signed customers, pilots, pricing sheets, and projected H2 2026 deployment commitments.
    whyItMatters: Without customer or order evidence, Morphi remains a pre-commercial team bet despite its large financing round.
    diligencePath: Ask management for LOIs, pilot contracts, pipeline stages, and deployment economics for the first service robot.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: product-specs
    missingEvidence: Detailed robot specifications, safety stack, certification path, and benchmark results for the first service-oriented product.
    whyItMatters: Current public descriptions are too high level to assess whether the platform is technically differentiated or deployment-ready.
    diligencePath: Request a product data sheet, certification roadmap, demo logs, and customer-use-case validation package.
    relatedQuestionRefs:
    - QO014
    - QO024
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: A direct company statement clarifying whether Shenzhen Bay Eco-Tech Park is the operating HQ while Qianhai remains the registered legal domicile.
    whyItMatters: The discrepancy is not thesis-breaking, but it affects how later diligence records addresses, employee concentration, and site visits.
    diligencePath: Confirm the main office, registered office, and key R&D/manufacturing locations with management.
    relatedQuestionRefs:
    - QO023
