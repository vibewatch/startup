- id: proof-gap
  title: The Main Customer Fact Is the Absence of Morphi-Specific Customer Proof
  body: 'The clearest diligence finding in this chapter is negative: reviewed public sources do not confirm named Morphi customers, disclosed production pilots, or public deployment KPIs. Baidu says the prototype has already begun multiple collaborations, which is directionally helpful because it implies external engagement rather than closed-lab isolation. But without names, stage definitions, or measurable outcomes, those collaborations cannot be translated into customer proof. 36Kr is explicit on the stronger version of that critique, noting the absence of customers, orders, deliveries, or revenue despite the valuation.


    The easiest way to understand the gap is by comparison. Figure names BMW and publishes hours, parts handled, and task KPIs. Wandercraft names Renault as Calvin-40''s first commercial customer. UBTECH names industrial customers and public order values. AGIBOT publicizes hospitality, logistics, showroom, and manufacturing scenarios at scale. Morphi does none of that yet. This does not mean there is no demand. It means demand is still unverified in the public record. For a company at Morphi''s valuation, that distinction is material.'
