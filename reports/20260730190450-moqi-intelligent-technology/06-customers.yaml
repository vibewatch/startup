  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / budget logic
  - Revenue or strategic value
  - Gap
  rows:
  - - Hotels and hospitality venues
    - 'Buyer: operations or guest-services leader; user: onsite staff; payer: operations budget'
    - Room service, item delivery, navigation assistance
    - Structured environment with repeat tasks and service budgets
    - High strategic value as data-rich first wedge
    - No public Morphi pilot or KPI
  - - Commercial service venues
    - 'Buyer: facility manager or innovation lead; user: service staff; payer: operations / automation budget'
    - Routine transport and interaction tasks in malls, offices, or venues
    - Moderate budgets but good visibility and data density
    - Useful for iteration and branding
    - Named customers absent
  - - Logistics-adjacent workflows
    - 'Buyer: logistics or warehouse manager; user: floor operations; payer: automation budget'
    - Short-range handling, transport, or sorting support
    - Higher utilization potential than hospitality
    - Could create stronger ROI if tasks are repeatable
    - No disclosed deployments
  - - Manufacturing / smart factories
    - 'Buyer: automation or plant operations; user: line teams; payer: capex / automation budget'
    - Flexible manipulation in existing human-designed lines
    - Largest long-run budgets in the sector
    - Potential future scale segment
    - Not the first named Morphi wedge today
  - - Households (long-term)
    - Buyer, user, payer all consumer / family unit
    - Chores, assistance, domestic service
    - Huge TAM but hardest environment
    - Long-run upside only
    - Public roadmap implies this is later, not current
  notes: Segments distinguish strategic relevance from proof. Morphi has a plausible near-term wedge, but public evidence does not yet show customer conversion in any segment.
