chapter:
  number: 7
  title: Risks
  summary: 'Morphi''s risk profile is critical because several major risk buckets stack at the same time: pre-commercial execution risk, intense competitive pressure from scaled Chinese leaders, high capital intensity at a stretched entry price, and non-trivial geopolitical and safety exposure. The company may still succeed, but today''s public evidence supports a milestone-sensitive venture case, not a broadly de-risked robotics platform.'
sections:
- id: headline-risks
  title: Execution and Competition Are the Dominant Risks
  body: 'Morphi''s largest risk is not a single legal or regulatory issue; it is the combination of being pre-commercial in a market that is already moving quickly toward visible scale. Public evidence still shows a prototype-stage company with no disclosed customer KPIs, no public revenue, and limited product transparency. That would already be enough to justify caution. It becomes more serious when placed beside market leaders that are publishing orders, runtime, deployments, or shipment scale. TrendForce and Humanoids Daily show a field where Unitree and AGIBOT are not just raising capital but compounding data, manufacturing, and customer credibility. In that context, even a technically promising Morphi product could still lose if it arrives later, costs more to support, or proves slower to adapt to real workflows.


    This is why the 36Kr critique matters. The article is not just skeptical journalism; it isolates the core underwriting risk. Morphi has already achieved a valuation that assumes it will convert founder pedigree and architecture thesis into operating proof. If that proof arrives, the risk picture can compress quickly. If it does not, the downside is sharp because the next rounds would still be funding capability-building rather than profitable scale. The rest of the chapter should therefore be read as transmission channels into that main risk: what can prevent first deployment success, and what can make a later correction harder to recover from.'
