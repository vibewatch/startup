- id: market-sizing
  title: Sizing the Market Without Pretending There Is One Clean Number
  body: 'The public market-size picture is strong enough to show genuine scale, but too contradictory to justify false precision. MarketsNXT provides the cleanest China revenue lens: about US$0.72 billion in 2024 rising to US$16.6 billion in 2032 at 51.4% CAGR. TrendForce adds a production lens, saying China’s humanoid output should jump 94% in 2026 as commercialization accelerates. Tianxia Gongchang adds shipment context, with 2025 global units around 17,000 to 18,000 depending on methodology and China contributing the vast majority. Embodied Global, by contrast, measures financing and planned capacity rather than robot revenue, showing a sector that is capital-rich even if it is still operationally immature.


    Those lenses are not interchangeable. A funding pool is not a hardware market. A shipment figure is not revenue. A 2032 China market forecast is not the same thing as a 2026 obtainable segment for a pre-product startup. That is especially important for Morphi because no public source gives a real company-specific SAM or SOM. We can say with confidence that the market is growing, capital is concentrating, and China is leading global share. We cannot say with confidence how much of that spend Morphi can reach before leaders entrench. The proper valuation takeaway is therefore evidence-constrained: the broad market is large enough to matter, but Morphi’s accessible slice remains a diligence question rather than a published fact.'
