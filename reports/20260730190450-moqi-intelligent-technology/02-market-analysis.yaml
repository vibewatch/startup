tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Relevance to Morphi
  rows:
  - - Industrial manufacturing humanoids
    - Robot hardware, embodied AI software, integration, maintenance
    - Fixed arms already doing single-station tasks; facility redesign spend
    - Plant operations / automation capex
    - Long-run high-value segment once reliability is proven
  - - Warehouse and logistics humanoids
    - Humanoid hardware, control stack, workflow integration
    - Traditional AMRs, conveyor rebuilds, non-manipulation systems
    - Operations budget / automation capex
    - Relevant if Morphi extends beyond service into material handling
  - - Commercial service and hospitality
    - Robot hardware or service package, interaction software, maintenance
    - Simple kiosks, pure software assistants, venue redesign
    - Operations plus guest-service budgets
    - Most aligned with Morphi’s publicly stated initial wedge
  - - Retail and public interaction
    - Robot hardware, branding/service content, monitoring
    - Digital signage only, human greeters, narrow demo bots
    - Store/venue operations and brand budgets
    - Useful for data collection and early visibility, but may be low-volume
  - - Research and developer platforms
    - Robot hardware, SDKs, experimentation budget, accessories
    - Software-only simulation and non-legged robotics
    - University or R&D budgets
    - Bridge segment for testing, data, and ecosystem-building
  - - Excluded adjacent automation
    - None—this row marks exclusions
    - Fixed industrial arms, cobots, kiosks, software-only AI
    - Existing automation buyers
    - Do not count as addressable spend without a workflow-specific substitution case
  notes: 'Boundary follows MarketsNXT and trade analysis: spend includes embodied-software and manufacturing services, but excludes adjacent automation that does not require a humanoid form factor.'
