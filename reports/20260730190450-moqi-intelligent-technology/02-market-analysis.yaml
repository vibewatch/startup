- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - China funding surge
    - positive
    - current
    - Sector can finance aggressive build-out and talent competition
    - Separate sustainable company economics from capital abundance
  - - National standards for humanoids and embodied AI
    - positive
    - current
    - Should reduce buyer uncertainty and shape procurement expectations
    - Track how quickly standards become procurement requirements
  - - Supply-chain localization
    - positive
    - current to medium term
    - Component cost declines can widen robot ROI windows
    - Monitor whether savings translate into deployable system prices
  - - World-model and embodied-data race
    - mixed
    - current
    - Software/data quality will increasingly separate winners from demo-stage entrants
    - Assess Morphi’s data acquisition and closed-loop training plan
  - - Open-source data scarcity
    - negative
    - current
    - Companies without real deployment data risk lagging in manipulation capability
    - Measure access to real-world teleoperation or customer task data
  - - Advanced-chip export controls
    - negative
    - current
    - Compute scarcity can slow training or raise costs for Chinese teams
    - Quantify Morphi’s access to domestic or alternative AI compute
  - - Market concentration around leaders
    - negative
    - current
    - Late entrants may face shrinking buyer attention and supply-chain leverage
    - Benchmark Morphi versus Unitree/AgiBot on timing and differentiation
  - - Home-market adoption lag
    - negative
    - medium term
    - Household robotics remains a longer-dated revenue pool than service or industrial sites
    - Do not underwrite consumer TAM into near-term forecasts
  notes: The table mixes structural tailwinds and binding constraints because both are central to valuation. Timing is approximate and reflects public 2026 evidence rather than disclosed Morphi plans.
