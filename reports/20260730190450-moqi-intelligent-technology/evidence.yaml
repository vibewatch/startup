evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current shareholder register, board roster, and financing terms after the July 2026 angel-series close.
    whyItMatters: >-
      Ownership concentration, investor rights, and board control are central to judging whether the valuation is a pure
      reputation premium or part of a tighter governance architecture.
    diligencePath: >-
      Request the latest cap table, shareholder agreement summary, and board composition directly from the company or
      investors.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-readiness
    missingEvidence: Signed customers, pilots, pricing sheets, and projected H2 2026 deployment commitments.
    whyItMatters: Without customer or order evidence, Morphi remains a pre-commercial team bet despite its large financing round.
    diligencePath: Ask management for LOIs, pilot contracts, pipeline stages, and deployment economics for the first service robot.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: product-specs
    missingEvidence: >-
      Detailed robot specifications, safety stack, certification path, and benchmark results for the first
      service-oriented product.
    whyItMatters: >-
      Current public descriptions are too high level to assess whether the platform is technically differentiated or
      deployment-ready.
    diligencePath: Request a product data sheet, certification roadmap, demo logs, and customer-use-case validation package.
    relatedQuestionRefs:
      - QO014
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A direct company statement clarifying whether Shenzhen Bay Eco-Tech Park is the operating HQ while Qianhai remains
      the registered legal domicile.
    whyItMatters: >-
      The discrepancy is not thesis-breaking, but it affects how later diligence records addresses, employee
      concentration, and site visits.
    diligencePath: Confirm the main office, registered office, and key R&D/manufacturing locations with management.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Workflow-level pricing, utilization, and budget-conversion data for Morphi’s intended hotel and commercial-service
      deployments.
    whyItMatters: >-
      Without real buyer budgets or target ASPs, any Morphi-specific SAM or SOM remains illustrative rather than
      investable.
    diligencePath: >-
      Request target customer profiles, deployment pricing, expected attach software revenue, and expected unit
      economics from management.
    relatedQuestionRefs:
      - QM005
      - QM024
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: A reconciled 2025-2026 shipment dataset using one methodology across global and China markets.
    whyItMatters: >-
      Current market narratives mix shipment estimates, funding pools, and revenue projections from different scopes,
      which can overstate certainty.
    diligencePath: Normalize one vendor dataset or analyst source through direct access to the underlying methodology notes.
    relatedQuestionRefs:
      - QM003
      - QM016
  - type: access-blocked
    severity: minor
    topic: buyer-budgets
    missingEvidence: >-
      Primary procurement or case-study documents showing actual budget authority and approval thresholds for hotel or
      manufacturing humanoid purchases.
    whyItMatters: >-
      Buyer mapping is defensible, but actual budget thresholds remain mostly inferred from industry structure rather
      than disclosed purchase orders.
    diligencePath: Collect procurement records, customer case studies, or public tender documents from early adopters.
    relatedQuestionRefs:
      - QM009
      - QM022
  - type: stale
    severity: minor
    topic: export-controls
    missingEvidence: >-
      A 2026 robot-specific assessment of how chip restrictions translate into embodied-AI training throughput and
      hardware BOM constraints.
    whyItMatters: >-
      Current evidence addresses AI chips generally, but the robotics-specific compute burden and substitution path
      remain under-documented.
    diligencePath: >-
      Interview suppliers or training-infrastructure leads and model how compute substitution affects robot training
      cadence.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: morphi-competitive-proof
    missingEvidence: >-
      Customer pilots, product specs, pricing, and benchmark results for Morphi’s first robot versus specific
      competitors.
    whyItMatters: >-
      Without direct product and customer evidence, Morphi cannot be compared on more than founder pedigree and
      announced launch intent.
    diligencePath: Request product datasheets, pilot KPIs, pricing sheets, and side-by-side task benchmarks from management.
    relatedQuestionRefs:
      - QP005
      - QP024
  - type: missing-source
    severity: material
    topic: pricing-gaps
    missingEvidence: Public contract models and pricing details for AgiBot, UBTECH, Leju, Figure, and Boston across target workflows.
    whyItMatters: Pricing comparison is currently anchored by Unitree and order disclosures rather than a full market price map.
    diligencePath: Collect tender data, public price sheets, or channel quotes for leading humanoid products.
    relatedQuestionRefs:
      - QP004
      - QP024
  - type: private-evidence-only
    severity: material
    topic: feature-unknowns
    missingEvidence: >-
      Consistent public task-performance benchmarks covering manipulation, uptime, safety incidents, and deployment
      integration across competitors.
    whyItMatters: Feature matrices overstate precision if they treat vendor marketing copy as equivalent to benchmarked performance.
    diligencePath: Normalize one benchmark set or demand customer-reference evidence per capability cell.
    relatedQuestionRefs:
      - QP017
  - type: stale
    severity: minor
    topic: market-concentration
    missingEvidence: >-
      Updated second-half 2026 shipment and order data for Unitree, AgiBot, and UBTECH after commercialization
      accelerates.
    whyItMatters: Competitive concentration in this market can change quickly once a few vendors start shipping at scale.
    diligencePath: Refresh shipment and order trackers after Q3 and Q4 2026 disclosures.
    relatedQuestionRefs:
      - QP020
      - QP025
  - type: private-evidence-only
    severity: material
    topic: cash-balance
    missingEvidence: Current cash balance, restricted cash, and any committed capex budget.
    whyItMatters: Without cash and budget detail, runway cannot be underwritten from round size alone.
    diligencePath: Request latest balance sheet, 12-month cash forecast, and board-approved operating plan.
    relatedQuestionRefs:
      - QI012
      - QI029
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: List pricing, pilot pricing, and any hardware-versus-service contract split.
    whyItMatters: Revenue quality and eventual gross margin depend on commercial packaging, discounting, and service burden.
    diligencePath: Request customer proposals, commercial term sheets, and pricing policy by segment.
    relatedQuestionRefs:
      - QI008
      - QI021
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Post-round cap table, liquidation preferences, board rights, and any investor protections.
    whyItMatters: >-
      Near-US$1B entry pricing can still be unattractive if preference overhang or dilution terms are
      investor-unfriendly.
    diligencePath: Request financing documents, cap table, and shareholder rights summary.
    relatedQuestionRefs:
      - QI013
