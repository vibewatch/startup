companyProfile:
  summary: Shenzhen Moqi Intelligent Technology Co., Ltd. was registered in Qianhai on 2025-08-27 and operates under the Morphi Intelligence brand from Shenzhen. The company is positioning itself as a general-purpose humanoid robotics platform combining hardware, software, algorithms, and data around a native visual-action-model plus world-model thesis. Public materials indicate a first prototype, an intended commercial-service-first rollout path, and a data-collection arc that later extends toward home use. By July 2026 Morphi had attracted an unusually strong investor group for a company this young, including Legend Capital, BlueRun Ventures, Alibaba, Tencent, and other major Chinese hard-tech funds, but it still had no publicly disclosed revenue, shipment scale, or named customer proof.
  foundedDate: '2025-08-27'
  founders:
  - name: Gao Wenli
    role: Founder and CEO
    background: Former Huawei operator with roughly 11 years across R&D, product, and overseas roles; later co-founded cross-border logistics company iMile.
