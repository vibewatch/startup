  shortDescription: Morphi Intelligence (Shenzhen Moqi Intelligent Technology Co., Ltd.) is a Shenzhen-based humanoid robotics startup founded in August 2025 by former Huawei and iMile operator Gao Wenli and former Huawei autonomous-driving AI leader Huang Qingqiu. The company is building general-purpose humanoids around a visual-language-action plus world-model architecture and had disclosed more than RMB 1 billion of cumulative angel-series financing at a post-money valuation above RMB 7 billion by July 2026.
subtitle: Morphi has one of the stronger founder-and-investor stories in China's newest humanoid cohort, but its near-unicorn price still sits materially ahead of public commercial proof.
coverageNotes: Public evidence as of 2026-07-30 is strong on founder backgrounds, company registration, funding history, investor quality, and category context. It remains weak on commercial proof, operating KPIs, cap-table terms, burn, unit economics, and prototype specifications. This is a private, pre-commercial company; investors should treat valuation as milestone-based rather than formula-driven until customer and reliability data are disclosed.
