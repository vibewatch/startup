  topStrengths:
  - Morphi has an unusually strong founder pair for a new humanoid startup, combining Huawei operating experience, logistics exposure, and high-end autonomous-driving AI pedigree.
  - The investor syndicate is materially stronger than that of many companies at a similar age, improving financing access and strategic signaling.
  - China's humanoid-robotics market remains large, fast-growing, and strategically important, giving Morphi a meaningful domestic opportunity set if execution lands.
  - The company is pursuing a commercially sensible service-first roadmap before attempting home deployment.
  topRisks:
  - No public revenue, shipment, or named-customer proof exists yet despite a valuation above RMB 7B.
  - 'Competition is severe: Unitree and AGIBOT already show much stronger scale and proof, while Figure and other global peers set a high bar for capital and commercialization.'
  - Hardware-plus-model businesses are capital intensive, so weak milestone conversion could turn today's headline value into later dilution pressure.
  - Governance, cap-table terms, burn, and unit economics remain underdisclosed.
  unresolvedGaps:
  - Named commercial pilots, customers, and deployment KPIs remain undisclosed.
  - Cash on hand, burn, runway, and use-of-proceeds detail remain undisclosed.
  - Cap table, liquidation preferences, board composition, and investor rights remain undisclosed.
  - Prototype specifications, safety metrics, and unit economics remain undisclosed.
disclaimer: This report is based on public and cached source material available as of 2026-07-30. Morphi is a private company with limited disclosure, and no valuation conclusion here should substitute for management diligence, customer reference checks, legal review of financing terms, or direct technical validation.
