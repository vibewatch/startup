  productSummary: Morphi is developing general-purpose humanoid robots for commercial-service and industrial scenarios first, with the public architecture centered on a native visual-action model and a world model that learn from real embodied interaction. The company has disclosed a prototype and a commercial-service-to-home roadmap, but has not yet published detailed hardware specs, pricing, reliability data, or field performance metrics.
  customerFocus: Near-term target customers appear to be commercial-service, logistics, and industrial users in China that can provide real-world task data under narrower operating conditions than home deployment.
  businessModel: Expected business model is a combination of robot hardware, embodied-AI software, deployment services, and possibly later recurring support or robotics-as-a-service structures, but public pricing and contract details are not yet disclosed.
  stage: Seed / pre-commercial
