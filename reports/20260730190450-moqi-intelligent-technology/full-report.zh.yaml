      - number: '5.3'
        title: 商业优先部署其实是数据策略，也是成熟度策略
        blocks:
          - type: paragraph
            body: >-
              Morphi 短期的产品落地策略，本质上是数据策略。36Kr 和 Embodied Global 描述的是同一套逻辑：先进入相对可重复的商业服务环境，
              把机器人部署到真实工作流中，采集失败模式和成功案例数据，再用这些数据改进模型，之后再攻克结构松散得多的家庭场景。 这个做法并非 Morphi
              独有，但很理性。家庭是最难的具身智能场景，因为布局、物体、人和安全预期差异极大。酒店、 服务场馆和最后一公里物流任务仍然不容易，但它们提供更高可重复性和更好的运营仪表化。


              竞争证据说明了为什么这一点重要。Figure 的 Project Go-Big 是一次明确尝试，用大规模人类视频解决数据稀缺；BMW 部署则显示，真实产品成熟度如今要用周期时间、放置精度和人工介入来判断。1X
              选择相反方向，强力推进家庭测试；Agility 则把设施中的工作流 ROI 放在前台。Morphi 尚未发布同等 KPI 面，但战略结论清楚：无论哪种架构胜出，
              数据质量和成熟度指标都会决定机器人是成为产品，还是停留在原型。对 Morphi 来说，最强的未解问题已经不再是论点是否有趣， 而是公司能否足够快地产生专有数据循环，把论点转成持久性能。
