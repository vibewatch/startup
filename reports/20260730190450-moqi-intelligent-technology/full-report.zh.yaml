      - number: '5.2'
        title: 核心论点是 VLA 动作生成加世界模型预测，并形成闭环
        blocks:
          - type: paragraph
            body: >-
              Morphi 的公开技术语言正落在当前具身 AI 前沿。外部资料把视觉-语言-动作模型定义为一种系统：它接收视觉和语言输入， 并直接输出用于机器人控制的动作 token。RT-2
              是最清晰的公开参照点：它说明模型如何把感知和语言转化为泛化机器人动作， 而不只是给场景分类。世界模型增加的是另一种能力：预测物理环境可能如何演化。合在一起看，这套组合说明 Morphi
              想避开感知、规划和控制连接过松的脆弱流水线。


              这也是自动驾驶背景重要的原因。Huang Qingqiu 过去的工作不只是图像识别。公开材料描述了他在感知、端到端驾驶、 VLM/VLA 和 AI 基础设施上的系统级经验；Huawei ADS
              材料也强调传感器融合、安全和复杂环境中的反复闭环更新。Morphi 的公开主张是，这种系统纪律可以迁移到人形机器人。这个押注有合理性，因为真实机器人和真实车辆一样，都需要在混乱环境中具备稳健边缘行为。
              限制同样明显：与汽车不同，人形机器人必须操作物体、处理接触密集任务，并在极其多样的室内空间里围绕人工作。架构可以缩小差距， 但不能抹掉差距。
