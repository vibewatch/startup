      - number: '2.3'
        title: 买方、用户与预算结构支持先从工厂和服务试点做起
        blocks:
          - type: paragraph
            body: >-
              买方地图重要，因为人形机器人需求并非铁板一块。制造和仓储买家通常从自动化或资本开支预算中采购，并用吞吐量、可靠性和劳动替代经济性衡量机器人。
              这些是任何想证明工业场景价值的创业公司最重要的买家。商业服务买家——酒店、零售环境、面向公众的场馆和类似运营方——更关心安全交互、
              服务覆盖和增量劳动效率。科研与开发者买家介于两者之间：他们往往是最早采用者，因为他们能容忍不完美，也能从实验室、 创新或研发预算付费，而不是坚持马上看到单点 ROI。


              这个切分与 Morphi 宣称的路径匹配。公司公开指向酒店和商业服务，作为第一个楔子说得通，因为这些环境能产生可重复数据，
              又不像汽车或电子制造那样严苛。但更广的市场证据显示，工厂和仓库仍可能先成为主导销量买家。官方产品页面强化了这个切分逻辑： Unitree 倾向易获得的人形机器人和开发者套件，UBTECH
              强调企业和消费者服务机器人，1X 主打家庭安全和家务场景，Boston Dynamics 与 Agility 则更直接地定位工业自动化。对 Morphi 的含义很清楚：第一批买家可能偏服务，
              但市场长期最大支出池仍偏工业。
