      - number: '2.4'
        title: 中国顺风很强，但数据、算力和集中度仍会卡住公司
        blocks:
          - type: paragraph
            body: >-
              中国的顺风是真实的。融资激增，政策体系越来越具体，零部件供应链本地化足够快，已经能实质性压低机器人成本。SCIO 对首个国家人形机器人与具身 AI
              标准体系的描述表明，中国正从热情转向成文的运营预期，覆盖数据、模型训练、应用和安全。 这个变化重要，因为监管不只是成本；在早期市场，它也为制造商、供应商和买家降低不确定性。同时，AInChina 和 AI
              Robotic Daily 都认为，真正瓶颈正在转向数据和世界模型能力。能收集真实具身数据并转化为可靠闭环行为的公司， 越来越被投资人视为赢家。


              约束同样实质。AI Robotic Daily 对融资集中和开源数据不足的警告，指向赢家拿走大部分的轨迹。Brookings、Harvard 和 CSET 补充了第二个约束：中国获取前沿 AI
              芯片仍受限制，即便国内替代方案在持续改善。这意味着市场不只是硬件竞赛； 它也是由地缘政治塑形的算力和软件系统竞赛。最后，商业化已经开始集中。TrendForce 和 TechTimes 显示 Unitree 与
              AgiBot 占据 2026 年销量主导份额。因此，Morphi 受益于中国市场的有利背景，但它是作为一个较晚、产品前进入者，
              进入一个领导者已有数据、制造和资本规模的领域。这个市场有足够吸引力，值得跟踪；但它没有宽容到可以原谅执行失误。
