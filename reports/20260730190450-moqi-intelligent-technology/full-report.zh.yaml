      - number: '7.3'
        title: 运营、质量和人员风险仍披露不足
        blocks:
          - type: paragraph
            body: >-
              运营风险不是明显糟糕，而是披露不足；但披露不足本身就是风险。在人形机器人领域，买家最终会关心硬件可靠性、人工干预频率、支持负担、安全事故和升级纪律。Figure 的 BMW 部署说明，市场已经明显转向 KPI
              驱动的信任机制。Morphi 没有发布同等数字，外部人因此无法判断公司只是低调，还是确实落后。以服务场景切入，相比家庭场景应能降低一部分环境复杂度，但不能消除在人类周围、动态物理条件下长期运行的挑战。每缺一个现场
              KPI，故障率、维护成本和可部署性的不确定性就会更大。


              人员风险同样重要。公开叙事仍高度集中在 Gao Wenli 和 Huang Qingqiu 身上。他们的优势真实存在，关键人依赖也同样真实。Baidu 显示员工少于 50 人的信号还意味着，如果 Morphi
              想规模化，仍需要在制造、安全、现场服务和客户成功职能上补深度。这不代表团队梯队弱，而是梯队仍大多不可见。对投资者来说，规则很简单：在公司拿出可现场交付的运营系统和更宽的领导层之前，人员风险和运营风险应被合并看待，而不是拆成两类。
