  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 中国领导者已用规模、价格和产品宽度锚定市场
        blocks:
          - type: paragraph
            body: >-
              Morphi 面临的最强即时竞争压力，来自已经在规模上可见的中国玩家。Unitree 兼具产品宽度、可识别定价和生态信号： 官方材料显示，公司覆盖四足机器人、人形机器人、机械臂和自研组件；Humanoid
              Index 及更广泛市场跟踪则把它列为 2025 年出货领导者，并指向 IPO 路径。G1 的价格锚很重要，因为它把“通用人形机器人”从抽象品类变成买家面前的具体选项。 Unitree
              自己的页面也提醒，这个品类仍早、仍面向二次开发；但这反而强化了它的位置：它已经在卖给后进入者仍需说服的早期采用者市场。


              AgiBot 是另一个明显标杆。它的官网和 PR 报道呈现出比 Morphi 目前公开信息更宽的生产和企业故事。Humanoid Index 与 Humanoids Daily 强调其 2025 年出货规模，以及
              2026 年 10,000 台门槛。结合 TrendForce 和 TechTimes，信息很清楚：中国赛场并非抽象意义上的“开放”市场，而是越来越由已有产品家族、部署叙事和运营节奏的公司主导。 这不会消灭
              Morphi 的空间，但意味着 Morphi 首款产品要进入的是已有可见领导者的市场，而不是进入真空。
