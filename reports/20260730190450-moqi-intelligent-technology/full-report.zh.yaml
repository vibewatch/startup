      - number: '8.4'
        title: 入场纪律应聚焦里程碑、稀释和下轮降价风险
        blocks:
          - type: paragraph
            body: >-
              由于公开经济数据缺失，估值纪律必须来自里程碑逻辑。下一个决定性问题不是 Morphi
              能否吸引关注，而是能否在下一次重大融资事件前拿出部署证据。若公司触达具名商业试点，发布可靠性和利用率数据，并把团队从两位创始人向外拓宽，今天的估值虽早，但仍可融资。若这些里程碑滑坡，当前估值就会从护城河变成稀释风险来源。


              因此，股权结构表里的盲区非常重要。公开来源没有披露清算优先权、董事会结构、期权池规模、资金用途细节或现金消耗。在一家「硬件 +
              模型」公司里，这些未知项不是装饰。它们决定平轮是否仍会痛、战略投资人是否拥有隐藏权利，以及新闻口径里的估值能否转化为普通股真实上行。在这些尽调项披露之前，正确姿态是跟踪并要求证据，而不是精确承销。
