      - number: '4.3'
        title: 资本充足度好过典型种子期机器人公司，但跑道仍只是代理估算
        blocks:
          - type: paragraph
            body: >-
              Morphi 的大额融资确实带来一个优势：相比大多数产品前机器人创业公司，它降低了短期再融资压力。品类经济性解释了投资人为什么可能想把这个优势前置。 具身 AI
              需要同时投入机器人硬件、传感器、算力、模型训练、数据采集、测试环境和量产前质量体系。多份审阅来源强调， 这不是一个纯软件扩张问题。TMTPost 和 WeDoAny
              都把这个品类描述为必须同时为实体机器和真实世界反馈循环付费的领域。 Embodied Global 还补充了另一项资本需求：如果 Morphi 真的追求具身原生芯片，融资需求还会增加。这个方向有战略吸引力，
              但也会扩大未来融资区间。


              由于公司不披露现金、烧钱速度或债务，任何跑道判断都必须被视为估算，而不是事实。一个少于 50 人的机器人创业公司， 在原型开发、边缘模型训练和早期制造准备阶段，每月烧掉高个位数到低双位数 RMB
              百万级资金是合理可能。按这个粗略的外部视角， 已报道融资足以支持有意义的迭代时间。但区间很宽：激进芯片工作、供应链承诺或更重的现场运营，都可能快速压缩跑道；
              有纪律的原型节奏则可能拉长跑道。实际投资结论是，Morphi 看起来比普通种子期公司资本更充足，但没有内部财务前， 不能判定为现金安全。
