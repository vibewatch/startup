            body: >-
              赛场重要，不只是因为中国同行，也因为全球玩家正在选择不同商业化路径。Boston Dynamics 明确把 Atlas 定位为企业级工业自动化，强调物料搬运、集成和可靠性。Agility
              围绕工业自动化做类似表达。Figure 则有不同转向： 它仍使用通用人形机器人语言，但公司叙事已同时覆盖劳动力测试和面向家庭的重新设计。1X 是公开资料中最清晰的家庭优先路径样本。 NEO 和 NEO Gamma
              材料围绕家务、温和交互、被动安全、内部家庭测试，以及家庭环境才是智能增长正确数据源的信念展开。


              这些战略分化与 Morphi 有关，因为 Morphi 公开表示想从商业服务起步，最终扩展到家庭。这把它放在工业优先和家庭优先两极之间， 而不是完全落在任何一端。Leju
              还强化了第三条轴线：中国本土市场中的产业化纪律。合起来看，竞争格局说明 Morphi 不只是在选择一个产品，也是在选择要模仿或挑战哪种商业化哲学。最重要的结论是，几家对手已经公开清楚表达自己的楔子， 而
