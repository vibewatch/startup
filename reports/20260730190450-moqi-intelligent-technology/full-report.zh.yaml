  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 财务可见面主要是融资，不是经营表现
        blocks:
          - type: paragraph
            body: >-
              Morphi 的财务记录对这么年轻的公司来说异常偏科。公开可得证据在融资头条上很丰富，但在成长型投资人通常要验证的几乎所有核心运营指标上都很薄。 截至 2026 年 7 月，公司公开把自己与超过 RMB 1
              billion 的天使系列累计融资、超过 RMB 7 billion 的投后估值联系在一起。对一家 2025 年 8 月成立的创业公司，这是相当惊人的资本量。但同一公开记录仍未披露收入、
              客户数、交付、利用率、订单额、积压订单、毛利率或现金余额。实际含义是，本章无法分析一家常规运营公司，只能分析融资基础质量、 变现路径可信度，以及这个品类暗含的资本依赖程度。


              这个区分重要，因为早期大额融资会制造财务成熟的幻觉。Morphi 这里没有。公开记录中，Morphi 仍处于商业化前：
              来源描述了原型机、首款服务型机器人，以及先进入商业场景再走向家庭使用的路线图，但没有已出货收入线。即便 Preqin
              预览级的商业模式表述，也应被读作方向，而不是变现证明。因此，最有力的结论很窄但重要：Morphi 已按战略品类竞争者的姿态完成融资，但公开证据仍描述的是一家刚开始商业验证的公司，而不是已有可观察收入引擎的公司。
