      - number: '8.3'
        title: 可比分析显示，以当前证据阶段看 Morphi 并不便宜
        blocks:
          - type: paragraph
            body: >-
              由于 Morphi 没有披露收入基数，可比公司组必须按里程碑看，而不是套公式。最有用的比较不是倍数调整，而是证据调整。Figure 2024 年融资时 US$2.6 billion
              的估值以及之后的私募市场标记，反映的是一家已经发布客户部署更新和制造野心的公司。Physical Intelligence 围绕研究和平台论点，在顶级投资人和大额融资支持下达到 US$2.4 billion
              估值。相比之下，Unitree 被引用的估值约 US$1.6 billion，同时已经带着出货规模、收入引用和 IPO 准备信号。AGIBOT 则说明，一旦商业闭环跑通，规模可以多快出现。


              放在这个赛场里，Morphi 接近 US$1 billion 的定价并非明显荒谬，但很难称得上保守。投资者买的不是当前规模，而是在提前买 Morphi
              跻身第一梯队的可能性。因此，正确框架应是带有显著证据折价的期权估值，而不是品类领导者定价。
