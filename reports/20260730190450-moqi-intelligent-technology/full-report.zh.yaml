  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式评分卡聚焦当前价格下是否值得投，而不是公司的绝对质量。
    data:
      items:
        - label: 市场机会
          score: 8
          detail: 中国人形机器人需求和政策支持真实存在
        - label: 创始人 / 团队质量
          score: 8
          detail: 相比新进入者，创始人罕见地可信
        - label: 商业证明
          score: 2
          detail: 未披露公开收入、出货量或具名客户
        - label: 护城河可见度
          score: 4
          detail: 架构论点有意思，但尚无证据支撑
        - label: 经济性可见度
          score: 2
          detail: 未公开披露毛利率、BOM 或烧钱情况
        - label: 融资支持
          score: 8
          detail: 投资团质量强，可能会有帮助
        - label: 估值支撑
          score: 3
          detail: 公开估值跑在当前披露证据前面
        - label: 证据质量
          score: 4
          detail: 足以支持跟踪，不足以支持激进投资立项
    approximationNotes: 评分为 0-10 分，反映在报道价格下的投资就绪度。
    claimRefs:
      - CV014
      - CV015
      - CV019
      - CV020
      - CV025
      - CV036
      - CV037
      - CV038
      - CV039
