      - CV032
  - id: TV003
    title: 可比估值表
    description: >-
      Proof-adjusted comp set for Morphi using disclosed or reported private-market anchors and visible
      commercialization progress.
    columns:
      - 可比公司
      - 估值 / 标记
      - 已验证事项
      - 为何可比
      - 局限
    rows:
      - - Morphi
        - 估值 >RMB 7B（约 US$963M-US$970M）
        - 已发布原型；无公开收入、出货或具名客户证据
        - 当前审查中的估值标记
        - 运营披露稀疏
      - - Unitree
        - ~US$1.6B-US$1.7B 参考值
        - IPO 准备信号、出货规模、收入参考值、组织规模更大
        - 商业化成熟度上，按验证程度调整后的最佳中国可比
        - 公司年龄和产品宽度不同
      - - Figure AI
        - 2024 年一轮融资 US$2.6B；后续追踪值更高
        - 大额融资基础，加上 BMW 生产验证和制造野心
        - 说明更强证据能支撑怎样的估值
        - 美国地域和异常强的资本触达
      - - Physical Intelligence
        - 据报道 2024 年估值 US$2.4B
        - 大额平台型融资和精英投资人阵容
        - 有用的前沿具身 AI 叙事可比
        - 比 Morphi 当前披露更偏研究平台
      - - 1X
        - 已披露 US$100M 融资；所审来源未公开估值
        - 家庭机器人投资逻辑和持续产品叙事
        - 说明带消费场景的人形机器人同业仍能融资
        - 估值不透明限制可比性
      - - AGIBOT
        - 私募估值不如规模信号重要；10,000+ 部署和 2025 年 39% 份额参考值
        - 大规模部署量和中国规模领先地位
        - 头部公司能多快拉大差距的最佳证据
        - 不是干净的已披露估值可比
    notes: 这些可比对象用于判断验证状态和投资人预期，不用于推导单一公式化公允价值。
    claimRefs:
