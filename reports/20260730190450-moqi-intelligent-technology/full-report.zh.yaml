  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    description: Maps the strongest reasons to keep Morphi in scope against the strongest reasons to resist paying up today.
    columns:
      - 论点
      - 为什么有利
      - 什么会改变判断
    rows:
      - - 作为一家 2025 年机器人创业公司，创始人履历异常强
        - 可能改善招聘、技术整合和投资人触达
        - 需要转化成产品和客户证据，而不只是声誉
      - - 顶级投资团降低融资摩擦
        - 支撑后续融资触达和战略引介
        - 如果资金仍充裕但里程碑落后，单靠投资人质量守不住回报
      - - 中国人形机器人市场增长很快
        - 国内市场够大，可以吸收早期商业服务试验
        - 市场快涨也会先强化已有规模的头部玩家
      - - 具身 AI / VLA 投资逻辑具备战略吸引力
        - 如果部署跑通，可能支撑差异化数据闭环
        - 没有公开 KPI，投资人无法判断架构是否跑赢同业
      - - 当前估值可能仍低于后期头部公司估值
        - 绝对价格低于 Figure 和 Physical Intelligence
        - 这些同业有更多公开验证；Morphi 更便宜，但风险释放更少
      - - 如果 Morphi 成为品类赢家，早期进入能抓住上行空间
        - 在赢者拿走大多数的平台市场，选择权真实存在
        - 按当前定价，上行大多取决于后续融资和执行继续强劲
    notes: 表格刻意不对称：每个看多点仍依赖尚未公开的证据。
