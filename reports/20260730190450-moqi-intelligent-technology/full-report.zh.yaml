      - number: '1.5'
        title: 投资人为何跟进，以及仍待回答的问题
        blocks:
          - type: paragraph
            body: >-
              更大的 2026 年中国具身 AI 背景解释了 Morphi 为何能快速融到这么多钱。EmbodiedGlobal、AInChina、TrendForce
              和行业市场出版物都描述了一个资本从纯模型热情转向物理世界部署的赛道。中国已有密集的人形机器人阵营，2026 年 Q1 和 H1 融资总额也大幅上升。换句话说，Morphi
              融资时，投资人已经准备支持可信团队去搭数据飞轮和真实机器人，而不是软件演示。 这个背景重要，因为 Morphi 的公开叙事——把端到端汽车 AI 经验迁移到通用具身机器人——贴合行业主线，而不是逆着它走。


              但同一背景让未解问题更尖锐，而不是更宽松。TrendForce 和 TechTimes 都显示，Unitree 和 AgiBot 已经在推动出货集中。Morphi
              进入的不是空白市场；它进入的是一个规模领导者已经在积累数据、供应链杠杆和部署经验的市场。 这也是 36Kr
              批评重要的原因。公司可能有前景，创始人组合也值得密切跟踪，但今天的公开记录仍指向一家高估值、商业化前且披露有限的创业公司。
              后续章节应把本章作为基准：创始人与市场匹配度亮眼、早期融资异常强、原型进展可信，但商业执行仍未验证。
