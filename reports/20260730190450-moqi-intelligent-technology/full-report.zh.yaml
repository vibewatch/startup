  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与真正的替代方案集合
        blocks:
          - type: paragraph
            body: >-
              Morphi 进入的不是整个“自动化市场”；若按这个口径看，会高估估值支撑和实际需求。最稳妥的边界是中国人形机器人市场， 加上部署这些机器所需的相邻具身 AI
              服务栈：硬件、执行器、感知与推理软件、集成、维护以及配套制造服务。MarketsNXT 明确采用这个更宽定义；这很关键，因为 Morphi 这样的公司不只是卖一个机身或一个模型。它试图把动作模型、世界模型、
              具身数据采集和机器人部署组合成一个产品系统。


              同样重要的是哪些不该放进边界。固定工业机械臂、没有操作能力的 AMR、自助终端、纯软件副驾驶 以及许多传统服务机器人，默认仍是替代品，不是同一可服务支出的一部分。只有当买家需要在为人类建造的空间里灵活作业、
              需要一定程度的 3D 操作，并希望比传统自动化少改造设施时，人形机器人的楔子才出现。对 Morphi 来说，
              最强的短期相邻市场不是抽象的“家庭机器人市场”，而是服务和工业场景中那些能替代或增强半结构化人力的窄集合。因此，
              本章把酒店、零售服务场景、物流相邻流程和轻工业部署视为最贴近的短期细分市场，同时把家庭保留为更远期的相邻机会， 而非 2026 年收入假设。
