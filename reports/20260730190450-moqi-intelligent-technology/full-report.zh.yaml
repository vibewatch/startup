      - number: '7.2'
        title: 监管、法律和地缘政治风险随品类一起抬升
        blocks:
          - type: paragraph
            body: >-
              人形机器人已经不再是纯实验品类，这对 Morphi 有利也有弊。积极的一面是，中国的标准体系正在变清晰；消极的一面是，合规预期正好在初创公司还缺公开安全记录时变得更正式。Robotics & Automation
              News 将 2026
              年国家标准框架描述为一次把行业从碎片化原型推向可部署工业基础设施的尝试，并明确关注安全、伦理、网络安全和互操作性。长期看，这应当帮助严肃玩家；短期看，它提高了落地门槛，尤其是那些还要证明机器人能在公共或工业环境稳定运行的公司。


              地缘政治层又加重了这件事。Brookings、Harvard HKS 和 CSET 都显示，AI 芯片出口管制仍是中国 AI 系统的实质约束。Morphi 现在或许还不是算力巨头，但具身 AI
              仍依赖模型训练、边缘优化和高性能芯片获取。如果公司试图借定制芯片路线图加深纵向整合，这些依赖会更重要，而不是更不重要。国际扩张还带来第二条地缘政治风险通道：美国政治层面对中国机器人的审查报道显示，即便在国内成功的公司，出海也可能遇到采购或信任壁垒。Morphi
              还没走到这一步，但董事会仍应把地缘政治视为上游战略风险，而不是遥远问题。
