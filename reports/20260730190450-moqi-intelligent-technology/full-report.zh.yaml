          detail: 需要执行器、传感器、电池和安全工程
        - id: d3
          label: 真实部署环境
          detail: 酒店与服务场所产生数据和失败案例
        - id: d4
          label: 具身数据闭环
          detail: 把现场运营转成再训练材料
        - id: d5
          label: VLA + 世界模型栈
          detail: 泛化能力的核心软件假设
        - id: d6
          label: 潜在芯片 / 边缘算力路径
          detail: 可能提升垂直整合，但会增加执行负担
      edges:
        - from: d1
          to: d5
          label: 系统知识
        - from: d2
          to: d3
          label: 可现场部署机器人
        - from: d3
          to: d4
          label: 收集数据
        - from: d4
          to: d5
          label: 改进模型
        - from: d5
          to: d2
          label: 更好控制
        - from: d6
          to: d5
          label: 未来算力所有权
    approximationNotes: 依赖图来自公开表述和可比技术披露。
    claimRefs:
      - CE008
      - CE009
      - CE016
      - CE017
      - CE033
      - CE035
  - id: FE004
    title: 产品成熟度 / 能力图谱
    type: matrix
    layout: wide
    summary: 公开证据支持强架构雄心，但在几个决定运营成败的维度上公开验证偏弱。
    data:
      columns:
        - 公开可见度
        - 技术雄心
        - 成熟度证据
        - 评论
      rows:
        - label: 架构逻辑
          values:
            - label: 高
              tone: positive
              detail: VLA + 世界模型被多次公开描述
            - label: 高
              tone: positive
              detail: 通用人形机器人雄心明确
            - label: 中
              tone: neutral
              detail: 逻辑自洽，但未做基准验证
            - label: 架构比硬件输出指标更清晰
        - label: 硬件规格透明度
          values:
            - label: 低
              tone: warning
              detail: 规格大多未披露
            - label: 中
              tone: neutral
              detail: 原型机明确存在
            - label: 低
              tone: warning
              detail: 没有公开载重或续航数据
            - label: 规格表是当前最大的技术缺口
        - label: 数据策略
          values:
            - label: 中
              tone: neutral
              detail: 商业优先的数据闭环已有公开描述
            - label: 高
              tone: positive
              detail: 数据护城河是投资逻辑核心
            - label: 低-中
              tone: warning
              detail: 尚无公开部署指标
            - label: 策略不错，但证据有限
        - label: 安全 / 质量控制
          values:
            - label: 低
              tone: warning
              detail: 公开的具体控制措施很少
            - label: 高
              tone: positive
              detail: 要进入家庭场景，控制措施必须足够强
            - label: 低
              tone: warning
              detail: 没有公开认证或可靠性看板
            - label: 重大尽调障碍
    approximationNotes: 定性矩阵仅基于公开证据，不基于内部测试报告。
    claimRefs:
      - CE019
      - CE022
      - CE028
      - CE029
      - CE033
      - CE036
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Morphi 可能的客户旅程先从一个狭窄的运营痛点切入；只有首个部署跑通，才会逐步扩展到更多站点。
    data:
      nodes:
        - label: 识别高摩擦流程
          detail: 场馆或运营负责人挑出一个劳动力痛点明显的重复任务
        - label: 原型评估
          detail: Morphi 在结构化商业场景中展示匹配度
        - label: 试点或首次部署
          detail: 机器人进入单一站点，验证安全性、在线率和任务匹配度
        - label: 用现场数据改进模型
          detail: 部署数据改善机器人行为和可靠性
        - label: 扩展决策
          detail: 客户决定续约、扩点还是停止
    approximationNotes: 旅程由 Morphi 公开的商业优先路线图，以及可比机器人公司的销售路径推断而来。
    claimRefs:
      - CU001
      - CU005
      - CU013
      - CU027
      - CU030
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: wide
    summary: Morphi 漏斗里最大的流失风险，出现在概念兴趣到具名、可背书部署证明之间。
    data:
      items:
        - label: 市场兴趣
          value: 100
          detail: 2026 年，具身智能和人形机器人吸引买家强烈好奇
          tone: positive
        - label: 评估沟通
          value: 60
          detail: 创始人背景和估值大概率能打开客户大门，但公开数量不可得
          tone: neutral
        - label: 具名试点
          value: 20
          detail: 证据缺口从这里开始
          tone: warning
        - label: 可背书部署
          value: 5
          detail: 还没有公开 KPI 包或客户 logo
          tone: critical
        - label: 多站点扩展
          value: 1
          detail: 目前记录无法推断“落地后扩张”是否成立
          tone: critical
    approximationNotes: 阶段为定性判断，因为 Morphi 未披露漏斗数量。
    claimRefs:
      - CU002
      - CU004
      - CU026
      - CU027
      - CU029
      - CU035
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 与同业基准相比，Morphi 叙事匹配度强，但公开客户证明弱。
    data:
      columns:
        - 具名客户
        - 结果具体度
        - 可重复性信号
        - 公开可信度
      rows:
        - label: Morphi
          values:
            - label: 否
              tone: critical
              detail: 尚无公开客户名称
            - label: 低
              tone: warning
              detail: 没有公开 KPI 包
            - label: 低
              tone: warning
              detail: 没有公开扩张证据
            - label: 低
              tone: warning
              detail: 本章主要靠推断支撑
        - label: Figure / BMW
          values:
            - label: 是
              tone: positive
              detail: BMW 已公开具名
            - label: 高
              tone: positive
              detail: 工时、零部件和车辆数已披露
            - label: 中
              tone: neutral
              detail: 任务证明强，但环境较窄
            - label: 中-高
