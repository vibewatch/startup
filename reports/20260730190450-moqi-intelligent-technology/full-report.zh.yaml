  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标或文件
      - 对投资测算的影响
      - 缺失为何重要
      - 具体尽调路径
    rows:
      - - 当前收入 / ARR / 订单
        - 无法检验估值是否有经营支撑
        - 商业化前公司应按里程碑定价，但商业透明度为零会放大下行风险
        - 索取月度订单、确认收入，以及试点转生产的转化视图
      - - 定价和合同结构
        - 无法判断变现质量或服务负担
        - 硬件销售、机器人即服务或支持订阅，会导向不同利润率路径
        - 索取客户方案、试点合同和标准商业条款
      - - 毛利率 / BOM / 服务成本
        - 无法判断可扩展性，也无法判断服务部署是否赔钱换市场
        - 人形机器人即使有需求，支持成本过高也可能在财务上失败
        - 索取 BOM、现场服务模型、质保假设和备件计划
      - - 现金、烧钱速度和资金续航
        - 无法评估融资依赖度或下一轮紧迫性
        - 芯片、算力和制造支出压上来，大额首轮融资也会很快烧光
        - 索取现金台账、分职能月度烧钱和 18 个月资金续航模型
      - - 股权结构和清算优先权
        - 无法判断回报结构或高价进入后的稀释风险
        - 接近 US$1B 的名义估值可能藏着偏向投资人的结构，压低新资金顺位
        - 索取完整股权结构、融资文件和优先权摘要
    notes: 这些是把当前叙事转成真正财务投资测算文件所需的最低公开到私有交接项。
