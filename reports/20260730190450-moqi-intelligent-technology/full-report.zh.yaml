      - number: '6.2'
        title: 最重要的客户事实，是缺少 Morphi 自身客户验证
        blocks:
          - type: paragraph
            body: >-
              本章最清晰的尽调发现是负面的：已审阅公开来源没有确认具名 Morphi 客户、已披露量产试点或公开部署 KPI。Baidu
              称原型机已经开始多个合作，这在方向上有帮助，因为它暗示外部接触，而不是封闭实验室。但没有名称、阶段定义或可衡量结果， 这些合作不能转化成客户验证。36Kr
              对这个批评给出了更强版本：它指出，尽管估值已到这个水平，公司仍缺少客户、订单、交付或收入。


              理解这个缺口最简单的方法是比较。Figure 点名 BMW，并发布工时、处理部件和任务 KPI。Wandercraft 点名 Renault 是 Calvin-40 的首个商业客户。UBTECH
              点名工业客户和公开订单金额。AGIBOT 大规模公布酒店、物流、展厅和制造场景。 Morphi 暂时没有做到这些。这不意味着没有需求，而是意味着需求在公开记录中仍未验证。对 Morphi 这个估值水平的公司来说，
              这个区分很重要。
