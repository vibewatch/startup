      - number: '1.2'
        title: 创始人、领导集中度与治理信号
        blocks:
          - type: paragraph
            body: >-
              投资逻辑明显由创始人牵引。Gao Wenli 一直被识别为创始人兼 CEO，Huang Qingqiu 是联合创始人兼 CTO。Gao 补上商业化半边：公开资料称，他曾在 Huawei 度过约 11
              年，覆盖研发、产品和海外领导岗位；之后共同创办跨境物流公司 iMile，业务扩展到中国和中东配送市场。即便 iMile 不是机器人公司，它仍能为 Morphi 提供证据，因为这意味着他有供应链、
              跨境运营和复杂真实场景执行经验，而不是纯实验室背景。


              Huang 提供技术溢价。Baidu、News18A 和他自己的公开资料都称，他是 2020 年 Huawei Genius Youth 入选者， 后来主导智能驾驶 AI
              工作，并把端到端方法推到量产规模。他明确主张自动驾驶是具身智能的子集，闭环数据和系统工程可以自然迁移到机器人。 这个逻辑解释了投资人为什么愿意在 Morphi 发布产品前下注。但治理面远比履历薄。Baidu
              记录了 2026 年 2 月的董事新增和资本结构变更，公开材料仍未披露完整董事会名单、投资人权利或融资后股权图。结果是一个高度集中的领导结构：
              公司的主要差异化紧扣两个人，今天的估值大部分由他们的技术和运营声誉支撑。
