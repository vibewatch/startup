      - number: '1.4'
        title: 里程碑、产品成熟度与商业路径
        blocks:
          - type: paragraph
            body: >-
              公开可定年的里程碑很短，但因为 Morphi 极年轻，这些记录仍有分量。2025 年 8 月注册后，公司在 2025-09-01 增设一家全资上海子公司，随后是 2025 年 12 月天使融资、2026 年 1
              月和 2 月资本化变更、2026 年 2 月 Pre-A 披露，以及 2026 年春季覆盖视觉、制造和北京运营的更多子公司。公开来源还称首台原型机已在 2026 年初或 2026 年 4
              月完成，且多个合作已经启动。这些事实说明，公司不是为融资临时拼出来的空壳；它在并行搭法律结构、产品和合作。


              不过，产品成熟度不等于商业验证。公开来源称，首款服务型机器人目标在 H2 2026 发布，商业化将先从酒店或物流相邻流程等商业服务环境启动，
              再进入家庭。这个顺序有战略合理性，因为这些环境数据更密、运行边界更窄，对早期迭代的容忍度也高于家庭部署。但「路径从酒店开始」
              和「证明一个可重复产品能在酒店安全、经济、规模化部署」之间仍有很大距离。已审阅来源没有披露机器人规格、客户承诺、现场 KPI 或安全认证里程碑。因此，里程碑时间线支持的是速度，不是商业必然性。
