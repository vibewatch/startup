  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    description: Conditions that would materially weaken the case for paying or holding the current private-market mark.
    columns:
      - 触发项
      - 阈值
      - 重要性
      - 行动含义
    rows:
      - - 没有具名试点或部署证据
        - 下一次重大融资到来时仍没有公开商业证据
        - 暗示估值跑在客户采用之前
        - 从观察下调，接近放弃
      - - 可靠性指标持续不披露
        - 管理层声称试点后仍回避正常运行时间 / 干预率 / 安全 KPI 披露
        - 阻碍按证据调整后的投资测算
        - 要求大幅折价，或停止流程
      - - 平轮或下轮，附带重度优先权
        - 叙事看起来很强，但新资金仍需要经济保护
        - 表明当前普通股上行被高估
        - 按清算优先权堆叠重算回报预期
      - - 中国头部公司进一步拉大规模差距
        - Unitree / AGIBOT 持续出货，而 Morphi 仍停留在原型阶段
        - 放大数据和商业化劣势
        - 提高折现率，下调情景区间
      - - 治理仍不透明
        - 董事会、内控和预算归属仍未披露
        - 让资本效率和下行情景治理更难信任
        - 在任何条款清单接触前升级尽调
    notes: 这些是投资委员会可用的实际触发项，不是运营预测。
    claimRefs:
      - CV014
      - CV018
      - CV022
      - CV028
      - CV029
      - CV030
      - CV038
  - id: TV006
    title: 最终尽调问题表
    description: Public-to-private diligence items required before underwriting Morphi beyond watchlist status.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 商业验证
        - 具名试点、部署范围、客户背书
        - 说明产品是否真的从原型跨入工作流
        - 管理层陈述和客户访谈
      - - 运营 KPI
        - 正常运行时间、干预率、任务成功率、安全事件
        - 把技术叙事转成可投资证据
        - 工程审查和现场走访
      - - 现金和烧钱速度
        - 账上现金、月度烧钱、现金跑道、按职能划分的预算
        - 决定融资紧迫性和稀释风险
        - 财务资料室 / 董事会材料包
      - - 股权结构表和条款
        - 清算优先权、期权池、董事会权利、按比例跟投权
        - 决定当前名义估值下真实普通股经济性
        - 融资文件法律尽调
      - - 单位经济性
        - BOM、服务成本、保修负担、目标定价
        - 决定增长最终能否带来利润率
        - 运营尽调和制造审查
      - - 监管 / 安全控制
        - 标准路径、安全测试、隐私和数据处理
        - 关系到客户采用和下游责任
        - 合规审查
    notes: 如果这些问题无法清楚回答，无论市场多兴奋，建议都应维持观察。
    claimRefs:
      - CV019
      - CV029
      - CV030
      - CV031
      - CV040
