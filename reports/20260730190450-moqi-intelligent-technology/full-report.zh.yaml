  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是通用人形机器人平台，还不是完整披露的 SKU 家族
        blocks:
          - type: paragraph
            body: >-
              公开来源在大图景上一致：Morphi 构建的是通用人形机器人平台，不是窄场景配送机器人，也不是卖给其他 OEM 的 AI 软件层。 Baidu
              和面向创始人的资料描述，公司已推出首台原型机，最终目标是家庭服务，但起点是工作流更窄、数据收集更快的商业场景。
              这个产品定义重要，因为它把门槛抬得远高于单一用途服务机器人。通用人形机器人必须在为人类建造的空间内，把移动、感知、抓取、 语言理解和长周期任务执行组合起来。


              仍然缺失的，是买家或工程师通常想在技术快照里看到的几乎所有内容。公开证据没有披露清晰模块图、负载、续航、板载算力或明确的操作性能。 因此，今天做尽调时，应把 Morphi
              看成一个有宏大目标的原型平台，而不是成熟的多 SKU 产品线。公司的可见差异化更多在架构和战略： 选择围绕原生视觉-动作模型加世界模型构建人形机器人，并选择先追商业服务数据，再追家庭广度。这些选择是连贯的，
              但还不等同于一个完成充分基准测试的产品面。
