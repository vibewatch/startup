      - number: '6.3'
        title: 最可能的 GTM 路径是创始人主导、直销切入锚定场景
        blocks:
          - type: paragraph
            body: >-
              因为 Morphi 没有公开客户名单，GTM
              只能从产品路径和创始人履历倒推。短期最可能的打法，是创始人亲自卖给少数锚点商业场景：部署范围可控，数据也能快速收集。这个判断符合公司的公开资产结构——创始人的运营信誉、投资人阵容和系统设计论点是最强筹码。难做的硬件品类也通常这么起步：产品要跟第一个客户一起安装、监控、迭代，而不是一开始就靠广泛渠道铺开。


              但创始人主导销售解决不了规模化问题。人形机器人部署需要场景集成、维护、支持、培训，常常还要按工作流改造。Alibaba、Tencent
              等战略投资人未来可能打开更多场景入口，但公开证据还没显示这种资源已经转化成获客。分销商、转售商或现场服务伙伴也看不见。现实含义是：Morphi
              大概率能靠叙事和投资人信号拿到早期会面，但要声称拥有可复制渠道，仍需要先搭出部署和服务的操作系统。
