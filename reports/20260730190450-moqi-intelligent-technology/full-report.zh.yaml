      - number: '3.3'
        title: Morphi 的当前位置：故事强，公开商业面稀薄
        blocks:
          - type: paragraph
            body: >-
              相对同业，Morphi 最适合被描述为履历强、公开面窄。公开来源支持原型机存在，首款商用机器人目标在 H2 2026 推出，但还没有给出产品单页、定价、客户背书或订单簿，无法把 Morphi 与
              Unitree、AgiBot 或 UBTECH 直接比较。 这个缺口就是核心竞争事实。它意味着 Morphi 仍可以围绕原生视觉-动作加世界模型架构，以及创始人的自动驾驶经验主张新意；
              但市场还无法检验这个论点是否优于已有替代方案。


              这个问题会落到定价、包装和分销上。Unitree 已经给出公开低价锚和开发者友好姿态。AgiBot 与 UBTECH 已经展示出货规模或企业订单。1X、Boston 和 Figure 已经讲清差异化的信任或
              GTM 故事。因此，Morphi 最强的公开资产不是当前市场验证，而是可选性。如果首发产品真的能压缩服务机器人实用性与通用具身 AI 之间的差距， 公司仍可能找到楔子。但在发布前，Morphi
