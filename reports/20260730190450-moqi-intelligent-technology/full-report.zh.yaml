  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚点真实存在，但仍主要由叙事支撑
        blocks:
          - type: paragraph
            body: >-
              Morphi 最强的公开估值锚点很直接：多家媒体报道，公司在 2026 年 7 月完成天使轮系列融资，累计金额超过 RMB 1 billion，投后估值超过 RMB 7 billion。按外汇折算，约为
              US$963 million 至 US$970 million，已经接近独角兽区间，但还不是清晰的 US$1 billion
              节点。这个差别重要，因为公开证据仍显示它是一家原型阶段机器人公司，市场却已经在用后种子轮或早成长期定价视角讨论它。


              缺失的抵消项是商业证明。公开材料尚未披露收入、出货量、具名客户、量产单位产出或现场可靠性指标。因此，这个价格更像未来能力标记，而不是运营标记。投资者现在实际买入的是一种预期：Morphi
              能在之后把创始人履历、具身 AI 架构和一线投资人阵容转化成部署证据。36Kr 的怀疑正是因此有分量：问题不在于公司是否有才华，而在于估值是否已经跑在披露和证据之前。
