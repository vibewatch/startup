        title: 估值机制更依赖投资人信念，而不是财务产出
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月的估值框架需要克制处理。公开报道一致描述投后估值超过 RMB 7 billion。按同期汇率惯例，约合 US$963 million 到 US$970
              million。这个水平足够接近，容易引来独角兽式表述，但没有干净越过 US$1 billion 门槛，因此报告应把 RMB 保留为标准口径，并把美元数视为估算。更重要的是，可见收入或交付指标并没有支撑这个估值。
              最有证据的反向解读来自 36Kr：它明确追问，一家公司尚未公开披露客户、订单、收入，甚至还没有完全发布首款产品， 为什么能达到这个估值。


              这个批评在财务上重要，因为 Morphi 已经处在估值曲线中更需要关注持股数学、下行保护和退出路径的位置，而不只是叙事稀缺。 可比人形机器人公司有助于框定问题。Figure AI 和 Unitree
              都说明赛道可以承受激进定价，但它们的估值带有公开部署数据、 更清晰的融资历史，或至少更宽的产品可见度。Morphi 现在的估值因此不像一个已定价的运营业务，更像一份看涨期权，
              押注创始人质量、自动驾驶架构迁移，以及公司能比其他进入者更快压缩商业化时间。这个押注仍可能成立，但它是被拉长的投资依据， 不是有证据支撑的现金流依据。
