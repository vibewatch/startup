      - number: '1.3'
        title: 融资历史、投资人阵容与估值框架
        blocks:
          - type: paragraph
            body: >-
              Morphi 的融资节奏对一家尚未发布商用机器人的公司来说异常激进。第一个公开锚点是 2025-12-29 完成的约 RMB 900 million 天使轮，Legend Capital 和 BlueRun
              Ventures 位列投资方。公开材料随后指向 2026 年 2 月 Pre-A 轮，描述为 Shenqi Capital / 58 Industrial Fund 独家投资。到
              2026-07-07，Morphi 及其媒体生态称天使系列累计融资超过 RMB 1 billion，按翻译和汇率假设不同约合 US$137-140 million。Alibaba 和 Tencent
              被点名为后续累计公告的共同领投方，名单还包括一长串国内 VC 和硬科技投资人。


              估值框架是本章必须谨慎处理的地方。报道一致称投后估值超过 RMB 7 billion。按 2026 年 7 月汇率，这大约是 US$963-970
              million——接近独角兽，但除非用粗略取整，否则不能干净地说已超过独角兽线。因此，报告应保留 RMB 口径为主，把美元数描述为接近 US$1 billion
              的等值估算，而不是硬美元口径的独角兽事实。公开募资用途也仍停留在高层级： 扩充技术人才、扩大研究基础设施、加速物理基础模型训练。对具身 AI 来说，这个方向合理；但缺少收入、客户或交付证据，
              意味着投资人主要在为团队可信度、赛道时点，以及 Morphi 相对更传统、速度更慢的机器人公司压缩产品化时间的可能性买单。
