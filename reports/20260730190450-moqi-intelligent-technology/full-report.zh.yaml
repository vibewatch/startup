  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Morphi 最重的剩余风险集中在执行、竞争、稀释和关键人物依赖。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 执行 / 首次部署
          values:
            - label: 高
              tone: critical
              detail: 尚无公开部署证明
            - label: 高
              tone: critical
              detail: 直接支撑整个投资论点
            - label: 低
              tone: warning
              detail: 缓释措施尚未公开
            - label: 危急
              tone: critical
              detail: 当前首要风险
        - label: 竞争 / 时机
          values:
            - label: 高
              tone: warning
              detail: 头部玩家已经在扩张
            - label: 高
              tone: critical
              detail: 上线前就可能抹掉差异化
            - label: 低-中
              tone: warning
              detail: 只有速度和聚焦能抵消
            - label: 高
              tone: critical
              detail: 非常严峻
        - label: 资本 / 稀释
          values:
            - label: 中-高
              tone: warning
              detail: 硬件烧钱和估值拉伸并存
            - label: 高
              tone: critical
              detail: 拿到证明前就可能削弱回报结构
            - label: 低-中
              tone: warning
              detail: 没有公开资金续航细节
            - label: 高
              tone: critical
              detail: 剩余风险高
        - label: 地缘政治 / 出口管制
          values:
            - label: 中
              tone: neutral
              detail: 已经存在，可能加剧
            - label: 中-高
              tone: warning
              detail: 影响成本、速度和扩张
            - label: 低-中
              tone: warning
              detail: 公司层面的缓释措施未公开
            - label: 中-高
              tone: warning
              detail: 战略阴影
        - label: 关键人物 / 梯队深度
          values:
            - label: 中-高
              tone: warning
              detail: 叙事高度集中在创始人
            - label: 高
              tone: critical
              detail: 同时影响产品和 GTM
            - label: 低
              tone: warning
              detail: 梯队深度未公开
            - label: 高
              tone: critical
              detail: 仍然尖锐
    approximationNotes: 评分只是基于公开证据的定性判断。
    claimRefs:
      - CR001
      - CR005
      - CR013
      - CR026
      - CR037
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Morphi 的多数风险最终会传导为验证变慢、融资杠杆变弱，或商业可信度受损。
    data:
      nodes:
        - id: r1
          label: 执行延误
          detail: 原型未能变成可靠部署
        - id: r2
          label: 竞争差距扩大
          detail: 头部玩家继续增加数据、客户和规模
        - id: r3
          label: 融资杠杆减弱
          detail: 未来资本变得更贵或更稀释
        - id: r4
          label: 商业证明延迟
          detail: 客户信任和可重复性仍未被验证
        - id: r5
          label: 估值支撑削弱
          detail: 当前估值更难守住
        - id: r6
          label: 建议下调
          detail: 如果多条路径同时恶化，跟踪可能降为避开
      edges:
        - from: r1
          to: r4
          label: 没有现场证明
        - from: r2
          to: r4
          label: 证明门槛抬高
        - from: r4
          to: r3
          label: 融资更难
        - from: r3
          to: r5
          label: 稀释 / 重定价
        - from: r4
          to: r5
          label: 叙事变弱
        - from: r5
          to: r6
          label: 投资逻辑恶化
    approximationNotes: 展示因果流，而非概率。
    claimRefs:
      - CR013
      - CR014
      - CR020
      - CR023
      - CR032
      - CR034
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 公司对创始人、供应商、算力和早期商业站点的依赖，会放大剩余风险。
    data:
      nodes:
        - id: d1
          label: 创始人
          detail: 产品和 GTM 可信度集中在创始人身上
        - id: d2
          label: 算力 / 芯片
          detail: 支撑训练和端侧部署
        - id: d3
          label: 零部件供应商
          detail: 影响可靠性和制造质量
        - id: d4
          label: 早期客户 / 站点
          detail: 提供数据和证明
        - id: d5
          label: 机器人可靠性
          detail: 决定部署能否留存
        - id: d6
          label: 融资通道
          detail: 把资金续航撑到拿出证明
      edges:
        - from: d1
          to: d5
          label: 设计和执行
        - from: d2
          to: d5
          label: 模型表现
        - from: d3
          to: d5
          label: 硬件质量
        - from: d4
          to: d5
          label: 真实世界学习
        - from: d5
          to: d6
          label: 证明解锁资本
        - from: d6
          to: d2
          label: 资金支持继续迭代
    approximationNotes: 循环很重要：一个依赖失败，其他依赖也可能断粮。
    claimRefs:
      - CR021
      - CR026
      - CR028
      - CR031
      - CR032
      - CR034
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 决策链串联 Morphi 的市场上行空间、商业证明缺口、价格锚和尽调姿态，导向“跟踪”建议。
    data:
      nodes:
        - id: f1
          label: 中国人形机器人市场大
          detail: 品类顺风真实存在
        - id: f2
          label: 强创始人 + 强投资团
          detail: 提升融资可信度
        - id: f3
          label: 无公开收入或客户证明
          detail: 运营验证缺位
        - id: f4
          label: '>RMB 7B / ~US$963M-US$970M 价格'
          detail: 已接近独角兽区间
        - id: f5
          label: 股权结构 / 烧钱不透明
          detail: 回报测算仍不确定
        - id: f6
          label: 只能按里程碑投资立项
          detail: 需要试点和 KPI 证据
        - id: f7
          label: 建议 = 跟踪
          detail: 密切观察，但避免激进入场
      edges:
        - from: f1
          to: f6
        - from: f2
          to: f6
        - from: f3
          to: f6
        - from: f4
          to: f6
        - from: f5
          to: f6
        - from: f6
          to: f7
    approximationNotes: 流程反映分析师对前面各章的综合判断，不是评分算法。
    claimRefs:
      - CV006
      - CV014
      - CV018
      - CV021
      - CV025
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
