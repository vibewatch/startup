    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、注册，以及公司到底是什么
        blocks:
          - type: paragraph
            body: >-
              Morphi Intelligence 是 Shenzhen Moqi Intelligent Technology Co., Ltd. 面向英文语境的品牌，公司于 2025-08-27
              在前海深港合作区注册。Baidu Encyclopedia、Preqin 和 CB Insights 给出的核心身份一致： 这是一家 2025
              年成立、位于深圳的具身机器人创业公司，不是存量工业自动化公司，也不是上市母公司的拆分业务。 公司仍足够早，法律注册地和实际经营地的证据还不能完全对齐。Baidu 把注册故事锚定在前海，CB Insights
              则列出南山区深圳湾生态科技园的公开办公地址。这更像中国创业公司常见的注册地与办公地分离，不像矛盾；但在实地走访或雇佣核查前， 仍是一个值得厘清的尽调项。


              公司自我定义同样重要，因为估值已经大到不能容忍模糊赛道标签。公开资料把 Morphi 描述为具身智能或通用人形机器人公司。 创始人材料与后续报道都指向一个软硬一体判断：Morphi
              试图同时搭建机器人、数据系统和面向动作的模型，而不是只把 AI 软件卖给第三方硬件。公开商业模式仍更像方向，而非运营事实。Morphi 称计划从商业服务场景起步，用真实部署收集数据，
              最终延伸到家庭使用；这个路径合理，但具体产品包装、定价和部署模式仍未披露。因此，本章最稳妥的归类是种子期 / 产品前具身机器人平台：身份证据充分，运营细节仍不完整。
