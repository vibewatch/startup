  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    description: Milestone-driven valuation scenarios for Morphi over the next financing window.
    columns:
      - 情景
      - 假设
      - 示例性估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 具名服务部署、可靠性 KPI、清晰资金用途、下一轮融资估值上调
        - ~US$1.2B-US$1.6B 等值；证据弥合了相对头部私募同业的一部分折价
        - 当前低至中
        - 执行仍未经验证
      - - 基准
        - 原型成熟、试点启动，但商业规模和单位经济性仍有限
        - ~US$850M-US$1.1B 等值；估值大致守在当前区间，并保留温和上修选择权
        - 按现有证据最可能
        - 证据落地慢于叙事
      - - 悲观
        - 下一轮融资前没有公开客户证据；竞争对手拉大领先；市场倍数降温
        - ~US$500M-US$800M 等值；出现平轮 / 下轮动态或投资人友好条款
        - 不可忽视
        - 稀释和优先权压力
    notes: 这些是判断区间，不是模型输出。它们反映验证状态、融资议价力和可比公司筛选纪律，而不是收入倍数。
