companyProfile:
  summary: >-
    Shenzhen Moqi Intelligent Technology Co., Ltd. 于 2025-08-27 在前海注册，并以 Morphi Intelligence
    品牌在深圳运营。公司把自己定位为通用人形机器人平台，围绕原生视觉-动作模型与世界模型，把硬件、软件、算法和数据拼在一起。 公开材料显示，公司已有首台原型机，计划先从商业服务落地，再把数据采集链条延伸到家庭场景。截至 2026 年 7
    月，Morphi 已获得与其年龄不相称的强投资人组合，包括 Legend Capital、BlueRun Ventures、Alibaba、Tencent 以及其他中国主要硬科技基金；但公司仍未公开披露收入、出货规模或具名客户验证。
