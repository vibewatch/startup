        - label: UBTECH 工业客户
          values:
            - label: 是
              tone: positive
              detail: 新闻稿列出多个具名客户 logo
            - label: 中
              tone: neutral
              detail: 订单金额和品类已披露
            - label: 中
              tone: neutral
              detail: 暗示有规模和可重复的工业场景
            - label: 中
              tone: neutral
              detail: 公司发布，未审计
        - label: Wandercraft / Renault
          values:
            - label: 是
              tone: positive
              detail: 首个商业客户已具名
            - label: 中
              tone: neutral
              detail: 商业路径明确，但 KPI 深度较薄
            - label: 中
              tone: neutral
              detail: 制造业扩展逻辑可见
            - label: 中
              tone: neutral
              detail: 独立媒体报道
    approximationNotes: 矩阵评分看可见度和证据质量，不评估任何厂商的绝对技术优越性。
