      - number: '4.4'
        title: 财务结论：战略可选性高，经营可观察性低
        blocks:
          - type: paragraph
            body: >-
              从财务尽调看，Morphi 同时强也弱。强在狭义层面：一线投资人已经给了足够资本，让公司有真实窗口去建设。弱在更广义层面： 几乎所有本应支撑接近 US$1 billion
              入场价的运营变量仍是私有或缺失。没有可信的公开收入质量分析，因为没有公开收入。 没有毛利路径，因为没有公开成本结构。没有销售效率分析，因为没有转化漏斗。因此，本章不应假装轮次规模本身就是业务质量证明。


              最干净的结论是，Morphi 的财务故事目前是里程碑投资故事。如果公司能从原型阶段走到可重复商业部署，这轮融资日后可能显得有先见之明。
              如果它无法证明定价权、安全现场可靠性，以及从服务场景走向更大出货部署的可信路径，当前估值可能在任何公开退出市场出现前很久就显得昂贵。
              因此，投资人应把资本充足视为暂时优势，而不是验证替代品。直接的尽调阻断点很清楚：现金位置、烧钱模型、定价、股权结构和首批客户经济性。 在这些可见之前，仅靠公开证据看，估值仍显拉伸。
