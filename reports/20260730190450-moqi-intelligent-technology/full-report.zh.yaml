      - number: '8.2'
        title: 多头逻辑存在，反方逻辑也同样具体
        blocks:
          - type: paragraph
            body: >-
              正向逻辑并非凭空想象。中国仍是短期内最深的人形机器人市场，资金继续流向具身 AI 头部公司，Morphi 也拼出了新一批公司里更强的「创始人 + 投资人」故事。Alibaba、Tencent、Legend
              Capital、BlueRun 及其他投资方，在狭义上降低了融资风险：一旦早期技术证据出现，公司不太可能被市场忽视。若 Morphi 能展示可重复的服务场景部署、安全 KPI
              和可信的数据闭环，今天的估值可能成为通往更大商业平台的一座桥。


              反方逻辑同样具体。Unitree 和 AGIBOT 已经展示出货或部署规模，Figure 有 BMW 产线证明和大得多的资本基础，即便是 Physical Intelligence、1X
              等西方同业，也更清楚地说明资金买的是什么。Morphi 因此处在曲线中最不宽容的位置：估值已经高到要求极佳结果，但阶段又早到核心尽调项仍未披露。这个组合让建议停在「继续跟踪」，无法上调。
