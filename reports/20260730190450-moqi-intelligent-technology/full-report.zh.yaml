      - number: '8.5'
        title: 建议：继续跟踪，只有出现运营证据后才上调
        blocks:
          - type: paragraph
            body: >-
              因此，投资判断同时对价格和证据敏感。Morphi
              太有实质内容，不能直接排除：公司处在正确市场，新人形机器人创业公司里少见地拥有强创始人履历，也已经吸引中国一线投资人联合体。但这些优势都不能抵消一个事实：在估值已经接近独角兽区间时，公司仍处商业化前阶段，披露也不足。


              最可辩护的建议是以中等置信度继续跟踪，并给出关键风险评级。中等置信度成立，因为正向场景可信，但公共证据在最影响估值迁移的变量上仍然薄：客户采用、产品可靠性、现金效率和融资条款。关键风险也成立，因为如果
              Morphi 不能在下一个重置点前把叙事转成部署，下行可能同时来自执行落空和倍数压缩。公司有机会长进估值里；但它还没有证明自己已经做到。
