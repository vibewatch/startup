  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 最可能的早期客户是企业运营方，不是消费者
        blocks:
          - type: paragraph
            body: >-
              Morphi 宣称的产品路径已经收窄了客户宇宙。公开来源反复描述商业优先部署策略，酒店、服务环境和最后一公里物流都排在家庭使用之前。
              这意味着真实短期客户不是大众消费者，而是愿意在半结构化工作流中测试人形机器人的场馆运营方、服务公司、物流经理或自动化买家。 MarketsNXT
              和更广泛的中国人形机器人分析也解释了为什么这说得通：工厂、仓库、物流节点和运营服务环境里，预算、 用工痛点和数据密度能支撑早期部署经济性。


              这也塑造了买方-用户-付款方切分。用户可能是一线运营团队或服务员工。买方更可能是运营负责人、自动化团队、设施经理或创新办公室。 付款方大概率是资本开支或运营预算负责人。对 Morphi
              来说，最强推断因此是细分市场合理，而不是细分市场已被证明。 公司理论上选对了市场一侧——商业环境优先——但还没有展示哪个具体角色准备签约、部署并续约。
