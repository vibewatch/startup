  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行和竞争是主导风险
        blocks:
          - type: paragraph
            body: >-
              Morphi 最大的风险不是单一法律或监管问题，而是公司仍处商业化前阶段，却身处一个已经快速走向可见规模的市场。公开证据仍显示，它是一家原型阶段公司：没有披露客户
              KPI，没有公开收入，产品透明度也有限。单凭这些就足以支撑谨慎态度。若放到已经发布订单、运行时长、部署或出货规模的市场领导者旁边，问题更重。TrendForce 和 Humanoids Daily
              展示的赛场里，Unitree 和 AGIBOT 不只是融资，还在复合积累数据、制造能力和客户信用。在这种背景下，即便 Morphi
              的产品技术上有希望，只要来得更晚、支持成本更高，或适应真实工作流更慢，仍可能输掉。


              这也是 36Kr 批评重要的原因。那篇文章不只是质疑式报道，而是切中了核心承销风险。Morphi
              已经拿到一个默认其能把创始人履历和架构论点转化为运营证据的估值。如果证据到位，风险图景会很快收敛；如果证据不到位，下行会很尖锐，因为下一轮融资仍会在买单能力建设，而不是买单有利润的规模。因此，本章其余部分都应看作这条主风险的传导渠道：什么会阻止首次部署成功，什么会让之后的估值修正更难恢复。
