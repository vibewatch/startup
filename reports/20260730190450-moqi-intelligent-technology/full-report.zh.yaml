      - number: '2.2'
        title: 给市场定量时，不要假装只有一个干净数字
        blocks:
          - type: paragraph
            body: >-
              公开市场规模图景足以证明赛道确有规模，但彼此矛盾到不能支撑伪精确。MarketsNXT 给出最干净的中国收入口径：2024 年约 US$0.72 billion，2032 年增至 US$16.6
              billion，CAGR 为 51.4%。TrendForce 补充产量口径，称商业化加速下，中国人形机器人产出将在 2026 年跳升 94%。Tianxia Gongchang 补充出货背景，
              按方法不同，2025 年全球出货约 17,000 到 18,000 台，中国贡献绝大多数。相比之下，Embodied Global 衡量的是融资和规划产能，而不是机器人收入，呈现的是资本充裕但运营仍不成熟的赛道。


              这些口径不能互换。融资池不是硬件市场。出货量不是收入。2032 年中国市场预测也不等于一家产品前创业公司在 2026 年可触达的细分市场。对 Morphi 尤其如此，因为没有公开来源给出真正的公司级 SAM 或
              SOM。我们可以有把握地说， 市场在增长，资本在集中，中国占据全球领先份额。我们不能有把握地说，在领导者卡位之前，Morphi 能触达多少支出。因此， 合理的估值结论必须受证据约束：大市场足够大，值得关注；但
              Morphi 可拿到的份额仍是尽调问题，不是已发布事实。
