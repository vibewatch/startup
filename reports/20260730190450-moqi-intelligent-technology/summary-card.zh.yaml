  topStrengths:
    - 作为新成立的人形机器人公司，Morphi 的两位创始人组合少见地强：既有 Huawei 运营经验和物流场景积累，也有高端自动驾驶 AI 背景。
    - 投资人组合明显强于许多同阶段公司，融资通道和战略信号都因此加分。
    - 中国人形机器人市场仍然大、增长快且战略重要；只要执行落地，Morphi 在国内就有可观机会。
    - 公司先做服务场景、再尝试家庭部署，这条商业化路线更务实。
  topRisks:
    - 估值已超过 RMB 7B，但公开层面还没有收入、出货量或具名客户证据。
    - 竞争很硬：Unitree 和 AGIBOT 已经拿出更强规模和证明，Figure 等全球同行也把资本与商业化门槛抬得很高。
    - 硬件加模型业务很吃资本，若里程碑转化弱，今天的高估值日后可能变成稀释压力。
    - 治理、股权结构表条款、烧钱速度和单位经济仍披露不足。
  unresolvedGaps:
    - 具名商业试点、客户和部署 KPI 仍未披露。
    - 账上现金、烧钱速度、现金跑道和募资用途细节仍未披露。
    - 股权结构表、清算优先权、董事会构成和投资人权利仍未披露。
    - 原型机规格、安全指标和单位经济仍未披露。
