- id: TV006
  title: Final diligence asks table
  description: Public-to-private diligence items required before underwriting Morphi beyond watchlist status.
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Commercial proof
    - Named pilots, deployment scope, customer references
    - Shows whether the product is actually crossing from prototype to workflow
    - Management presentation and customer calls
  - - Operating KPIs
    - Uptime, intervention rate, task success, safety incidents
    - Converts technical narrative into investable proof
    - Engineering review and site visit
  - - Cash and burn
    - Cash on hand, monthly burn, runway, budget by function
    - Determines financing urgency and dilution risk
    - Finance room / board pack
  - - Cap table and terms
    - Liquidation preferences, option pool, board rights, pro rata terms
    - Determines true common-equity economics at current headline mark
    - Legal diligence on financing docs
  - - Unit economics
    - BOM, service cost, warranty burden, target pricing
    - Determines whether growth can eventually create margins
    - Ops diligence and manufacturing review
  - - Regulatory / safety controls
    - Standards path, safety testing, privacy and data handling
    - Important for customer adoption and downstream liability
    - Compliance review
  notes: If these requests cannot be answered cleanly, the recommendation should remain track regardless of market excitement.
