- id: entry-discipline
  title: Entry Discipline Should Focus on Milestones, Dilution, and Down-Round Risk
  body: 'Because public economics are absent, valuation discipline has to come from milestone logic. The next decisive question is not whether Morphi can raise attention, but whether it can generate deployment evidence before another major financing event. If the company reaches named commercial pilots, publishes reliability and utilization data, and broadens the team beyond the two founders, today''s mark could look like an early but financeable price. If those milestones slip, the current valuation becomes a source of dilution risk rather than a moat.


    That is why the cap-table blind spots matter so much. Public sources do not disclose liquidation preferences, board structure, option-pool sizing, use-of-proceeds detail, or cash burn. In a hardware-plus-model company, those unknowns are not cosmetic. They determine whether a flat round would still be painful, whether a strategic investor has hidden rights, and whether apparent headline value translates into real common-equity upside. Until those diligence items are disclosed, the correct posture is to track and demand evidence, not underwrite precision.'
