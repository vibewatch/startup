- id: comparable-set
  title: Comparable Analysis Says Morphi Is Not Cheap for Its Proof State
  body: 'The comparable set has to be milestone-based rather than formulaic because Morphi has no disclosed revenue base. The most useful comparison is therefore proof-adjusted rather than multiple-adjusted. Figure''s 2024 financing at a US$2.6 billion valuation and later private-market marks reflect a company already publishing customer deployment updates and manufacturing ambitions. Physical Intelligence reached a US$2.4 billion valuation around a research-and-platform thesis with elite backers and a large financing round. Unitree, by contrast, is referenced around US$1.6 billion while already carrying shipment scale, revenue references, and IPO-preparation signaling. AGIBOT demonstrates how quickly scale can emerge once the commercial loop starts working.


    Against that field, Morphi''s near-US$1 billion pricing is not obviously absurd, but it is hard to call conservative. Investors are not paying for current scale; they are paying in advance for the possibility that Morphi will join the top tier. That means the right frame is optionality valuation with a meaningful proof discount, not category-leader pricing.'
