  - - Top-tier investor syndicate reduces financing friction
    - Supports follow-on access and strategic introductions
    - If capital remains abundant but milestones lag, investor quality alone will not defend returns
  - - China humanoid market is growing quickly
    - Large domestic market can absorb early commercial-service experiments
    - Fast market growth also strengthens scaled incumbents first
  - - Embodied-AI / VLA thesis is strategically attractive
    - Could support a differentiated data loop if deployments start working
    - Without public KPIs, investors cannot tell whether the architecture is outperforming peers
  - - Current valuation may still be below late-leader marks
    - Absolute price is below Figure and Physical Intelligence
    - Those peers have more public proof; Morphi is cheaper but less de-risked
  - - Early entry could capture upside if Morphi becomes a category winner
    - Optionality is real in a winner-take-most platform market
    - At current pricing, much of the upside depends on future rounds and execution staying strong
