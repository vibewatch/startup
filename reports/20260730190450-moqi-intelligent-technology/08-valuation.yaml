- id: final-call
  title: 'Recommendation: Track, with Upgrade Only After Operating Proof'
  body: 'The investment call is therefore price-sensitive and evidence-sensitive. Morphi is too substantive to dismiss outright: the company sits in the right market, has unusually strong founder biographies for a new humanoid startup, and has already attracted a tier-one Chinese syndicate. But none of those strengths cancels the fact that the company remains pre-commercial and underdisclosed at a valuation already approaching unicorn territory.


    The most defensible recommendation is track with medium confidence and a critical risk rating. Medium confidence fits because the positive scenario is credible, but public evidence is still thin on the variables that matter most to valuation migration: customer adoption, product reliability, cash efficiency, and financing terms. Critical risk fits because if Morphi fails to convert narrative into deployments before the next reset point, downside can come from both execution miss and multiple compression at the same time. The company can grow into the valuation; it has not yet proven that it has.'
