- id: TV005
  title: Thesis-break and kill triggers table
  description: Conditions that would materially weaken the case for paying or holding the current private-market mark.
  columns:
  - Trigger
  - Threshold
  - Why it matters
  - Action implication
  rows:
  - - No named pilot or deployment proof
    - Next major financing arrives without public commercial evidence
    - Suggests valuation advanced ahead of customer adoption
    - Downgrade from track toward pass
  - - Reliability metrics stay undisclosed
    - Management still avoids uptime / intervention / safety KPI disclosure after pilot claims
    - Prevents proof-adjusted underwriting
    - Require major discount or stop process
  - - Flat or down round with heavy preferences
    - New money needs economic protection despite strong headline narrative
    - Indicates current common-equity upside was overstated
    - Rework return expectations using liquidation stack
  - - China leaders widen scale gap further
    - Unitree / AGIBOT continue shipping while Morphi remains prototype-stage
    - Raises data and commercialization disadvantage
    - Increase discount rate and lower scenario range
  - - Governance remains opaque
    - Board, controls, and budget ownership stay undisclosed
    - Makes capital-efficiency and downside governance harder to trust
    - Escalate diligence before any term-sheet engagement
  notes: These are practical investment-committee triggers, not operational predictions.
