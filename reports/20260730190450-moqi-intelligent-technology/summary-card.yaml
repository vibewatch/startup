  topStrengths:
    - >-
      Morphi has an unusually strong founder pair for a new humanoid startup, combining Huawei operating experience,
      logistics exposure, and high-end autonomous-driving AI pedigree.
    - >-
      The investor syndicate is materially stronger than that of many companies at a similar age, improving financing
      access and strategic signaling.
    - >-
      China's humanoid-robotics market remains large, fast-growing, and strategically important, giving Morphi a
      meaningful domestic opportunity set if execution lands.
    - The company is pursuing a commercially sensible service-first roadmap before attempting home deployment.
  topRisks:
    - No public revenue, shipment, or named-customer proof exists yet despite a valuation above RMB 7B.
    - >-
      Competition is severe: Unitree and AGIBOT already show much stronger scale and proof, while Figure and other
      global peers set a high bar for capital and commercialization.
    - >-
      Hardware-plus-model businesses are capital intensive, so weak milestone conversion could turn today's headline
      value into later dilution pressure.
    - Governance, cap-table terms, burn, and unit economics remain underdisclosed.
