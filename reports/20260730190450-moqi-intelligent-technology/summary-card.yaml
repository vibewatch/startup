  shortDescription: >-
    Morphi Intelligence (Shenzhen Moqi Intelligent Technology Co., Ltd.) is a Shenzhen-based humanoid robotics startup
    founded in August 2025 by former Huawei and iMile operator Gao Wenli and former Huawei autonomous-driving AI leader
    Huang Qingqiu. The company is building general-purpose humanoids around a visual-language-action plus world-model
    architecture and had disclosed more than RMB 1 billion of cumulative angel-series financing at a post-money
    valuation above RMB 7 billion by July 2026.
