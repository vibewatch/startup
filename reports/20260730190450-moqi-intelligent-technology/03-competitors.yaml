chapter:
  number: 3
  title: Competitors
  summary: Morphi enters a field where several competitors already have public product breadth, pricing anchors, orders, or shipment scale. Unitree and AgiBot dominate China’s near-term share; UBTECH has industrial orders; 1X, Figure, Boston Dynamics, and Agility frame distinct global strategies; and Leju reinforces China’s depth. Relative to that field, Morphi’s current differentiation is mainly founder pedigree and architecture thesis, not yet visible commercial proof.
sections:
- id: china-leaders
  title: Chinese Leaders Already Anchor the Market on Scale, Price, and Product Breadth
  body: 'The strongest immediate competitive pressure on Morphi comes from Chinese players that are already visible on scale. Unitree combines breadth, recognizable pricing, and ecosystem cues: its official materials show a company spanning quadrupeds, humanoids, manipulators, and self-developed components, while Humanoid Index and broader market trackers position it as a 2025 shipment leader with an IPO path. The G1 price anchor matters because it turns “general-purpose humanoid” from an abstract product category into a concrete buyer option. Unitree’s own pages also warn that the category is still early and oriented toward secondary development, which paradoxically strengthens its position: it is already selling into the exact early-adopter market that later entrants still need to convince.


    AgiBot is the other obvious benchmark. Its official site and PR coverage show a broader production and enterprise story than Morphi currently has in public. Humanoid Index and Humanoids Daily emphasize 2025 shipment scale and the 10,000-unit threshold in 2026. Taken together with TrendForce and TechTimes, the message is that the Chinese field is not “open” in the abstract—it is increasingly led by companies that already have product families, deployment narratives, and operating cadence. That does not eliminate room for Morphi, but it does mean Morphi’s first product is launching into a market with visible leaders, not into a vacuum.'
