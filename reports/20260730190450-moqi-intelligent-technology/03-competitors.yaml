- id: global-and-adjacent
  title: Global and Adjacent Rivals Show Strategy Splits Morphi Will Also Face
  body: 'The field matters not only because of Chinese peers, but because global players are choosing different commercialization paths. Boston Dynamics frames Atlas explicitly as enterprise-grade industrial automation, emphasizing material handling, integrations, and reliability. Agility does something similar around industrial automation. Figure adds a different twist: it still speaks in general-purpose humanoid terms, but its company narrative now spans both workforce testing and home-oriented redesign. 1X is the cleanest public example of the home-first path. Its NEO and NEO Gamma materials center chores, gentle interaction, passive safety, internal home testing, and the belief that domestic environments are the right data source for intelligence growth.


    These strategy splits are relevant because Morphi publicly wants to start in commercial service and eventually expand toward the home. That puts it between the industrial-first and home-first poles rather than squarely inside either. Leju reinforces a third axis: industrialization discipline inside China’s local market. In aggregate, the competitive field shows that Morphi is not only choosing a product, but also choosing which commercialization philosophy to imitate or challenge. The most important takeaway is that several rivals already express their wedge clearly in public, while Morphi still expresses its wedge mainly through founder narrative and sector thesis.'
