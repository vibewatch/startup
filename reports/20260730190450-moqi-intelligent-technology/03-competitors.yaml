  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: morphi-competitive-proof
    missingEvidence: Customer pilots, product specs, pricing, and benchmark results for Morphi’s first robot versus specific competitors.
    whyItMatters: Without direct product and customer evidence, Morphi cannot be compared on more than founder pedigree and announced launch intent.
    diligencePath: Request product datasheets, pilot KPIs, pricing sheets, and side-by-side task benchmarks from management.
    relatedQuestionRefs:
    - QP005
    - QP024
  - type: missing-source
    severity: material
    topic: pricing-gaps
    missingEvidence: Public contract models and pricing details for AgiBot, UBTECH, Leju, Figure, and Boston across target workflows.
    whyItMatters: Pricing comparison is currently anchored by Unitree and order disclosures rather than a full market price map.
    diligencePath: Collect tender data, public price sheets, or channel quotes for leading humanoid products.
    relatedQuestionRefs:
    - QP004
    - QP024
  - type: private-evidence-only
    severity: material
    topic: feature-unknowns
    missingEvidence: Consistent public task-performance benchmarks covering manipulation, uptime, safety incidents, and deployment integration across competitors.
    whyItMatters: Feature matrices overstate precision if they treat vendor marketing copy as equivalent to benchmarked performance.
    diligencePath: Normalize one benchmark set or demand customer-reference evidence per capability cell.
    relatedQuestionRefs:
    - QP017
  - type: stale
    severity: minor
    topic: market-concentration
    missingEvidence: Updated second-half 2026 shipment and order data for Unitree, AgiBot, and UBTECH after commercialization accelerates.
    whyItMatters: Competitive concentration in this market can change quickly once a few vendors start shipping at scale.
    diligencePath: Refresh shipment and order trackers after Q3 and Q4 2026 disclosures.
    relatedQuestionRefs:
    - QP020
    - QP025
