- id: verdict
  title: 'Technology Verdict: Credible Systems Thinking, Limited Public Verification'
  body: 'On product and technology, Morphi deserves more credit than a generic stealth startup and less credit than a mature robotics product company. The public record is coherent: the company has a prototype, a commercial-first deployment plan, a clear VLA-plus-world-model narrative, and a founder whose prior work maps directly onto end-to-end embodied-system problems. It also sits in a field where those ideas are taken seriously by external technical communities. That is enough to make the architecture thesis worth tracking.


    But the same public record is too thin to justify a strong claim of technical superiority today. The company does not publicly provide the specification table, reliability dashboard, safety controls, or field outcomes that would let outsiders test whether its architecture translates into better manipulation, uptime, cost, or adaptation speed. That is the central diligence posture for this chapter. Morphi may prove to be right on architecture. Yet based on public evidence alone, investors are still underwriting a technical hypothesis plus a team, not a fully evidenced product lead.'
