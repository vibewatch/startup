- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Primary risk
  rows:
  - - VLA control layer
    - Translates visual and language inputs into actions
    - Large-scale robot and/or human-video training data
    - Generalization may look better in demos than in field use
  - - World-model layer
    - Predicts physical state and consequences
    - High-quality sequential embodied data
    - May be expensive and hard to validate publicly
  - - Sensor fusion and edge inference
    - Maintains stable closed-loop control on robot hardware
    - Camera, depth, tactile, and onboard compute integration
    - Latency, occlusion, and compute limits can degrade performance
  - - Hardware platform
    - Provides locomotion, manipulation, and physical interaction envelope
    - Mechanical design, actuators, batteries, and safety engineering
    - No public evidence yet on reliability, MTBF, or field service burden
  - - Data loop and fleet telemetry
    - Collects failure cases and success trajectories for retraining
    - Real customer deployments and data rights
    - Without deployments the data moat stays theoretical
  - - Evaluation and quality system
    - Turns iteration into reliable product improvement
    - Testing protocols and release discipline
    - No public KPI dashboard or certification package disclosed
