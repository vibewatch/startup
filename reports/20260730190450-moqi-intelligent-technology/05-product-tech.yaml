  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hardware-specifications
    missingEvidence: Detailed robot specs covering payload, DOF, battery life, onboard compute, and safety architecture.
    whyItMatters: Without specs, diligence cannot compare Morphi directly against the technical tradeoffs already visible at competitors.
    diligencePath: Request engineering spec sheet, BOM summary, and performance targets by scenario.
    relatedQuestionRefs:
    - QE003
    - QE032
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Task-success rates, MTBF, intervention frequency, and field uptime from prototype testing.
    whyItMatters: Humanoid robotics maturity is increasingly judged on repeatability and reliability, not only on demonstrations.
    diligencePath: Request field-test KPI dashboards and validation protocols.
    relatedQuestionRefs:
    - QE020
    - QE026
    - QE034
  - type: private-evidence-only
    severity: material
    topic: trust-and-safety-controls
    missingEvidence: Formal safety controls, software update process, privacy model, and incident handling.
    whyItMatters: Commercial deployments in service environments require more than architecture claims; they require control systems and liability discipline.
    diligencePath: Request safety case, software-release SOPs, and privacy / data-governance documents.
    relatedQuestionRefs:
    - QE026
    - QE027
  - type: missing-source
    severity: minor
    topic: chip-roadmap
    missingEvidence: Independent technical corroboration for any embodied-native chip program.
    whyItMatters: Vertical integration can be strategically valuable but also distract from near-term launch execution.
    diligencePath: Request silicon roadmap, partner list, and rationale for in-house versus merchant silicon.
    relatedQuestionRefs:
    - QE033
