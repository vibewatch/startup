company:
  name: Dash0
chapter:
  number: 1
  title: Company Overview
  summary: Dash0 is a 2023-founded, Germany-origin observability company now headquartered in New York and positioned around
    OpenTelemetry-native telemetry plus Agent0 autonomous operations. Public sources support a $110M March 2026 Series B at
    a $1B valuation, $155M total funding, and 600+ paying customers, while ARR, margins, exact headcount, customer concentration,
    and full governance remain private diligence gaps.
sections:
- id: identity-product-stage
  title: Identity, Product, and Stage
  body: 'Dash0’s public identity is unusually clear for a young infrastructure company: it sells an OpenTelemetry-native observability
    platform that brings logs, metrics, traces, dashboards, alerts, service maps, and AI SRE agents into one commercial product.
    The company’s own materials describe the product as built for developers, SREs, and platform engineers who want telemetry
    in open standards rather than proprietary agents and unpredictable packaging. That matters for later diligence because
    Dash0 is not just claiming another dashboard layer; its point of differentiation is that the data model starts from OpenTelemetry
    and then uses Agent0 to turn telemetry into investigation and action. Current funding materials place the company as founded
    in 2023 in Germany and headquartered in New York, with a private-undisclosed profile: public capital and customer metrics
    are available, but revenue, margins, exact headcount, and customer concentration are not. Additional underwriting work
    should therefore treat this chapter as a factual spine: the identity, funding, valuation, and customer-count claims are
    public, while financial quality and governance depth must be proven directly with management materials before valuation
    work relies on them.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO013
