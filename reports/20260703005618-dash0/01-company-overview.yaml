- id: funding-traction-and-stakeholders
  title: Funding, Traction, and Stakeholders
  body: 'Dash0’s capital formation has moved quickly. The company announced a $9.5M Accel-led seed round in November 2024,
    a $35M Series A co-led by Accel and Cherry Ventures in October 2025, and a $110M Series B led by Balderton in March 2026.
    The latest round valued Dash0 at $1B and brought disclosed funding to $155M, which independent tech coverage corroborated.
    The traction story accelerated in parallel: the company said it had more than 270 customers at Series A and more than
    600 paying customers by Series B. Public proof includes case studies for The Telegraph, Zalando, Bonhams, Understory,
    and Digibee, plus earlier references to catchHR, ChargeTrip, and Porsche Digital. That evidence supports real adoption,
    but it does not disclose ARR, retention, logo concentration, or the paid-to-free mix behind the customer count.'
