      - number: '3.2'
        title: Incumbent scale and suite breadth
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is incumbent breadth and scale. Datadog reported $3.43 billion of fiscal
              2025 revenue, $4.47 billion of cash and marketable securities, 603 customers above $1 million ARR, and
              more than 400 new features and capabilities during 2025. Its product and pricing pages show a wide module
              catalog across infrastructure, APM, logs, synthetics, networks, security, and digital experience.
              Dynatrace, Splunk, and Elastic similarly frame their platforms as AI-enabled, enterprise-grade systems
              with broad telemetry, automation, and security claims. Dash0 can still win focused displacement deals, but
              the evidence does not support claiming broader suite coverage than incumbents. The implication for
              diligence is practical: test Dash0 where the buyer values simpler telemetry economics and portability, but
              do not assume it can replace every adjacent incumbent module without a scoped migration plan and explicit
              unsupported-cell review.
