            body: >-
              Dash0's unit economics remain mostly private. Gross margin should be driven by telemetry ingest, retained
              storage, query compute, AI-agent costs, support, and cloud infrastructure efficiency, but none of those
              inputs are disclosed. Datadog provides the clearest public bar: $3.43 billion of 2025 revenue, 28% growth,
              $1.05 billion of operating cash flow, $915 million of free cash flow, $4.47 billion of cash and marketable
              securities, and 603 customers above $1 million ARR. That contrast is adverse for underwriting because
              Dash0 has strong funding and customer proof but not public ARR, NRR, gross margin, CAC payback, burn, or
              runway. The comparison is not meant to imply Dash0 should look like Datadog today. It sets the economic
