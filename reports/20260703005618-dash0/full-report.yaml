      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Growth drivers are strong: digitalization, global applications, e-commerce, microservices, Kubernetes,
              hybrid cloud, security-sensitive operations, and AI workloads all increase the need to understand
              distributed systems from telemetry. Market research also supports Dash0’s AI thesis, because AI and
              machine learning are repeatedly described as ways to detect anomalies, predict issues, and automate
              root-cause analysis. The constraints are equally concrete. Dimension flags implementation complexity,
              integration cost, data overload, and alert fatigue. Grand View’s deployment data shows on-premise still
              mattered in 2023, reflecting privacy and control concerns that can slow pure SaaS adoption. G2 review
              evidence adds Dash0-specific friction: missing trace sampling and SRE patterns, UI limits for very large
              microservice estates, a learning curve for Grafana users, and paid/not-open-source status. Incumbents are
              not standing still either; Datadog has multi-billion-dollar revenue scale and its own AI SRE agent. The
              market is therefore large and growing, but Dash0’s valuation case depends on proving adoption speed,
              enterprise completeness, and differentiated AI outcomes.
