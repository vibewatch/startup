  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR below implied premium band
        - ARR materially below the level needed for a credible premium multiple
        - Reported $1B mark becomes narrative-led
        - Pass or demand major price reset
      - - NRR or churn weakness
        - NRR below premium infrastructure software expectations or logo churn in core segments
        - Customer proof no longer implies durable growth
        - Move from track to avoid
      - - Margin pressure
        - Telemetry cost-to-serve or support cost compresses gross margin
        - Usage-based pricing loses quality
        - Lower multiple and require margin plan
      - - Agent0 weak monetization
        - Low attach, low credit usage, or high intervention burden
        - Agentic premium weakens
        - Underwrite as ordinary observability vendor
      - - Security / AI governance issue
        - Material incident, weak audit controls, or unreviewed production action
        - Enterprise trust and sales cycle degrade
        - Treat as thesis-breaking
      - - Incumbent price war
        - Datadog/Dynatrace/Grafana/New Relic materially discount or bundle comparable AI features
        - Win rate or ASP declines
        - Reduce valuation band
    notes: >-
      Triggers are practical underwriting thresholds; exact numeric levels require private company metrics and investor
      return targets.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV024
      - CV025
      - CV026
      - CV033
      - CV034
      - CV041
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - ARR / growth
        - Current ARR, quarterly growth, pipeline conversion, sales productivity
        - Determines whether $1B mark has revenue support
        - Review data room, board deck, CRM export, and cohort bridge
      - - Retention
        - NRR, GRR, churn, expansion, logo cohorts
        - Validates customer durability and premium multiple
        - Inspect cohort tables and top-20 customer renewals
      - - Unit economics
        - Gross margin, telemetry cost-to-serve, support cost, Agent0 credit margin
        - Shows usage-based model quality
        - Request margin by product and customer size
      - - Cap table / terms
        - Dilution, preferences, option pool, pro-rata, secondary, debt
        - Determines investor entry economics
        - Review financing documents and liquidation stack
      - - Agent0 adoption
        - Attach rate, credit usage, conversion, audit logs, production-action controls
        - Tests the agentic premium case
        - Review product analytics, logs, customer demos, and governance controls
      - - Risk evidence
        - Security reports, incident history, AI governance, Lumigo integration milestones
        - Protects enterprise readiness and downside case
        - Request SOC 2, pen tests, incident log, and integration dashboard
    notes: >-
      Diligence asks are prioritized by variables that would most change recommendation, valuation stance, and
      confidence.
    claimRefs:
      - CV008
      - CV009
