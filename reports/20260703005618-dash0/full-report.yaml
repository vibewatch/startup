  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Dash0's public financial model is usage-based SaaS rather than seat-based SaaS. The official pricing page
              says customers pay for telemetry they send and store, with units for metrics, spans, log records, web
              events, and synthetic checks. Dash0 also lists no per-seat fee, no base platform charge, no hidden fees,
              and a single plan that includes the core observability modules. Agent0 adds an expansion vector through
              task-based credits at $0.60 per credit. The terms page matters because it confirms paid subscriptions,
              usage limits, trials, overages, and orders are contractual mechanics rather than just marketing language.
              This creates a cleaner revenue bridge than many observability vendors, because the billable event is tied
              to telemetry and AI work rather than named users. The public evidence still stops at list mechanics, so
              the chapter treats price architecture as a revenue-quality signal rather than proof of actual ARR,
              discounting, or margin.
