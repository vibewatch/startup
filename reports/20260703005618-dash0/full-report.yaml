companyProfile:
  summary: >-
    Dash0 is a venture-backed observability software company founded in 2023 in Germany and now presented publicly as
    headquartered in New York. Its platform is built around OpenTelemetry-native logs, metrics, traces, dashboards,
    alerting, service maps, and the newer Agent0 workflow layer for autonomous investigation and remediation. The
    company has scaled quickly from seed financing in late 2024 to a March 2026 Series B at unicorn valuation, with
    public traction claims of more than 600 paying customers and named references including Zalando, Taco Bell, and The
    Telegraph.
  foundedDate: '2023-01-01'
  founders:
