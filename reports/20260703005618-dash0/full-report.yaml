  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk View
        blocks:
          - type: paragraph
            body: >-
              Dash0 is not a high-risk company because the public file shows no fetched lawsuit, enforcement action,
              sanctions item, or breach notice, but the investment still carries medium-high residual risk because the
              product sits inside sensitive production telemetry workflows and now promises more autonomous action. The
              clearest thesis risk is a trust failure: a customer sends restricted data, an AI output is over-trusted,
              or a production action causes operational fallout. The second risk is execution pressure after the 2026
              Series B: Dash0 is valued as a fast-scaling agentic observability platform, so delays in Agent0, support
              quality, acquisition integration, or US enterprise expansion could compress the story quickly. The third
              is competitive response from Datadog, Dynatrace, Grafana, New Relic, and open-source-oriented
              alternatives. The upside evidence is real, but the risk register should be managed as a
              trust-and-execution investment rather than as simple SaaS growth exposure. This makes evidence discipline
              important: the chapter treats absent public negatives as a diligence prompt, not as proof that legal,
              operational, or customer risks are solved.
