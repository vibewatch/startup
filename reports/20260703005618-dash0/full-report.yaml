      - number: '8.3'
        title: Scenarios and Return Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Because ARR is undisclosed, valuation work should use scenario math rather than false precision. At a $1
              billion value, a 20x revenue multiple requires about $50 million of ARR, an 8x multiple requires about
              $125 million, and a 5x multiple requires about $200 million. Those are illustrative bands, not claims
              about Dash0’s actual ARR. The bull case is that customer growth, Agent0 GA, security posture, market
              expansion, and Lumigo capabilities produce a premium AI-infrastructure multiple. The base case is that the
              $1 billion mark is plausible but not obviously cheap because economics are opaque. The bear case is that
              Dash0’s ARR or retention is below the threshold needed for the multiple, while incumbents narrow feature
              gaps or discount aggressively. Investors should therefore price the round only after receiving private
              metrics and should demand downside protection if the revenue base is materially below premium-multiple
              thresholds. The scenario table intentionally keeps valuation math explicit so a future data-room refresh
              can replace assumptions with actual ARR and retention data.
