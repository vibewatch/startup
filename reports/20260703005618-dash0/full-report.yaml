  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Dash0 sells a developer- and SRE-facing observability platform rather than a single APM widget. The public
              product surface is framed around OpenTelemetry-native ingestion of metrics, logs, traces, resources,
              dashboards, alerts, website monitoring, synthetic monitoring, and Agent0. In customer workflow terms, the
              job is to replace tool switching during incidents with one resource-centric place to search telemetry,
              follow traces, inspect related logs and metrics, create alerts, and hand off fixes. The strongest product
              evidence is official and technical: the docs name the modules and developer tools, while the product pages
              explain how the workflow moves from instrumentation to triage and configuration-as-code. The underwriting
              caveat is that much of the workflow evidence remains company-authored, with customer stories and reviews
              corroborating ease of use but not all scale limits. This makes the product legible as a workflow system,
              not merely a storage backend.
