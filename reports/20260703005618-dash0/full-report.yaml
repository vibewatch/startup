        - label: Dashboards and alerts
          values:
            - High
            - Current
            - Migration parity and alert-noise proof
        - label: Kubernetes onboarding
          values:
            - Medium-high
            - Current
            - Operator lifecycle diligence
        - label: Vercel integration
          values:
            - Medium
            - Launched
            - Production reference depth
        - label: Agent0 AI remediation
          values:
            - Medium
            - Newer strategic surface
