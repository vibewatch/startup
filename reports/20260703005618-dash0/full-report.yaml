      - number: '8.4'
        title: Final Diligence Asks and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              The final diligence list is narrow and decisive. Dash0 must disclose current ARR, ARR growth, gross
              margin, NRR, churn, logo retention, cohort expansion, customer concentration, support burden, telemetry
              cost-to-serve, Agent0 attach and credit usage, security evidence, incident history, burn, runway, Series B
              dilution, and preference terms. It should also show whether Lumigo integration has created attach,
              pipeline, or retention benefits. The recommendation can move to buy if those data show high-quality
              growth, durable retention, efficient usage-based economics, and monetized Agent0 adoption at a price that
              leaves room for venture returns. It should move to avoid if ARR is far below implied thresholds, if
              retention or concentration is weak, if telemetry infrastructure costs compress margin, if security or
              AI-governance evidence disappoints, or if incumbent pricing pressure erodes conversion. Until then,
              valuation is a disciplined watchlist case, not an IC-ready conviction buy. The burden of proof therefore
              sits with the company and lead investors: public momentum earns a meeting, while private metrics determine
              price.
            claimRefs:
              - CV033
