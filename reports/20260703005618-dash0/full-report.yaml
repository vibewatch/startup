      - CR003
      - CR022
      - CR026
      - CR027
      - CR037
      - CR038
      - CR039
      - CR041
  - id: FR003
    title: Dependency Map
    type: dag
    layout: wide
    summary: >-
      Dash0 depends on legal controls, customer instrumentation, cloud marketplaces, standards, acquired assets, and
      competitive differentiation to scale safely.
    data:
      nodes:
        - id: contracts
          label: Terms / Privacy / DPA
          detail: Define data, processor, usage, and liability boundaries
        - id: customer
          label: Customer Instrumentation
          detail: Determines data quality, restricted data, and deployment success
        - id: marketplaces
          label: Cloud Marketplaces
          detail: Procurement and committed-spend paths
        - id: standards
          label: OpenTelemetry / Open Source
          detail: Interoperability and differentiation base
        - id: lumigo
          label: Lumigo Integration
          detail: Serverless and AWS capability expansion
        - id: incumbents
          label: Incumbents
          detail: Platform breadth, capital, and discounting power
      edges:
        - from: contracts
          to: customer
          label: sets obligations for
        - from: customer
          to: standards
          label: uses
        - from: marketplaces
          to: customer
          label: helps acquire
        - from: lumigo
          to: customer
          label: expands use cases for
        - from: incumbents
          to: customer
          label: compete for
        - from: standards
          to: incumbents
          label: can be adopted by
    claimRefs:
