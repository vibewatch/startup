      - number: '2.2'
        title: Sizing Lenses and Evidence-Constrained SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence is attractive but inconsistent because the sources use different boundaries. Grand
              View’s narrower APM lens starts at $7.52B in 2023 and reaches $19.62B by 2030 at 15.1% CAGR. Dimension’s
              APM lens is more aggressive, projecting $11.8B in 2026 and $45.0B by 2035 at 16.1% CAGR. Dash0’s own
              bottom-up observability estimate is broader: about $12B in 2024 growing around 20% annually, with a much
              larger potential implied if observability spend approached 15-20% of cloud infrastructure. For
              underwriting, the right answer is not to average these numbers mechanically. A conservative near-term low
              lens is 2026 APM at $11.8B; a broader observability lens grown from Dash0’s $12B 2024 estimate is roughly
              $17.3B in 2026; and a medium-term APM anchor is $19.62B in 2030. Public evidence does not isolate Dash0’s
              SAM or SOM, so actual pipeline, ACV, paid-customer mix, and retention data are required. The diligence
              stance should therefore keep two models side by side: a published market-size range for category
              attractiveness and a bottoms-up account model for what Dash0 can actually win.
