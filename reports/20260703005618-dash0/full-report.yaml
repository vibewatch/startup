chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Stage
        blocks:
          - type: paragraph
            body: >-
              Dash0’s public identity is unusually clear for a young infrastructure company: it sells an
              OpenTelemetry-native observability platform that brings logs, metrics, traces, dashboards, alerts, service
              maps, and AI SRE agents into one commercial product. The company’s own materials describe the product as
              built for developers, SREs, and platform engineers who want telemetry in open standards rather than
              proprietary agents and unpredictable packaging. That matters for later diligence because Dash0 is not just
              claiming another dashboard layer; its point of differentiation is that the data model starts from
              OpenTelemetry and then uses Agent0 to turn telemetry into investigation and action. Current funding
              materials place the company as founded in 2023 in Germany and headquartered in New York, with a
              private-undisclosed profile: public capital and customer metrics are available, but revenue, margins,
              exact headcount, and customer concentration are not. Additional underwriting work should therefore treat
              this chapter as a factual spine: the identity, funding, valuation, and customer-count claims are public,
              while financial quality and governance depth must be proven directly with management materials before
              valuation work relies on them.
