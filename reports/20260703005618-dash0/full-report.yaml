        title: Trust, security, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              The trust surface is adequate for many software buyers but still has enterprise diligence work. Dash0
              publicly states SOC 2 Type II, GDPR, ISO 27001, TLS 1.3, AES-256, RBAC, SSO/SAML, MFA, audit logs, and
              EU/US data residency. The DPA and privacy materials support the presence of contractual data-processing
              controls. However, the same public materials say HIPAA and PCI DSS are coming in 2026, and the terms put
              responsibility on customers to keep restricted data out unless a separate order or written agreement
              authorizes it. Because observability data can include logs, traces, credentials, personal data, and
              business events, investors should test redaction, retention, incident history, status-page evidence, and
              controls for AI-assisted code access before treating the trust story as fully de-risked.
