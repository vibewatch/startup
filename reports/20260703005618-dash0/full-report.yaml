  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      Legal, AI, security, and competition risks transmit through customer trust into retention, margin, financing
      confidence, and valuation.
    data:
      nodes:
        - id: data
          label: Telemetry / Restricted Data
          detail: Personal data, secrets, logs, traces, and configuration enter observability workflows
        - id: ai
          label: Agent0 Output / Action
          detail: Automated output or delegated action requires customer review
        - id: trust
          label: Customer Trust
          detail: Security, compliance, and reliability confidence
        - id: comp
          label: Incumbent Competition
          detail: Large platforms can bundle AI, security, and pricing responses
        - id: retention
          label: Retention / Expansion
          detail: Churn, NRR, and concentration determine growth quality
        - id: valuation
          label: Valuation Resilience
          detail: Private mark depends on durable growth and trust
      edges:
        - from: data
          to: trust
          label: can undermine
        - from: ai
          to: trust
          label: requires controls for
        - from: comp
          to: retention
          label: pressures
        - from: trust
          to: retention
          label: supports
        - from: retention
          to: valuation
          label: drives
        - from: comp
          to: valuation
          label: compresses
