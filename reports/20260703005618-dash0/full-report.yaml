      - number: '2.3'
        title: Buyers, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-persona. Developers and SREs feel incident-response and debugging pain; platform
              engineering owns OpenTelemetry collectors, standards, and internal developer experience; DevOps and
              cloud-infrastructure leaders care about uptime, complexity, and telemetry cost; and finance or engineering
              leadership approves budget when observability bills become unpredictable. Dash0’s no-per-seat model,
              consumption pricing, free trial, and all-features-included packaging aim directly at buyer frustration
              with fragmented modules and hidden charges. Adoption likely starts with a painful service, noisy telemetry
              pipeline, or incumbent-cost review, then expands if OpenTelemetry migration reduces lock-in and Agent0
              improves resolution speed. Large enterprises are the cleanest initial target because market research says
              they lead APM spending, but SMEs remain relevant because cloud APM and self-serve pricing reduce
              implementation friction. The adoption path still needs careful proof: switching is not just a procurement
              decision but a telemetry architecture migration. This also means customer references should be sampled by
              buyer persona, because a successful SRE pilot does not automatically prove finance-led cost governance or
              enterprise-wide standardization.
            claimRefs:
