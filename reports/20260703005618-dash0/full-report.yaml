    type: matrix
    layout: wide
    summary: Core observability surfaces look more mature than AI remediation and regulated-workload compliance.
    data:
      columns:
        - Public evidence depth
        - Maturity read
        - Key gap
      rows:
        - label: Core logs/metrics/traces
          values:
            - High
            - Current
