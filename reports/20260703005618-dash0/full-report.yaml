      - number: '1.2'
        title: Leadership, Governance, and Founder Fit
        blocks:
          - type: paragraph
            body: >-
              The founder-market-fit signal is strong. Dash0’s public team page lists Mirko Novakovic as CEO, Ben
              Blackmore as CTO, and founding engineers Miel Donkers, Marcel Birkner, and Michele Mancioppi, while the
              seed and Series A materials connect Novakovic to Instana, the observability company IBM acquired in 2020.
              That background is directly relevant to Dash0’s category because the team is attacking the same
              operational telemetry pain with a standards-first and AI-native angle. Governance visibility is thinner.
              The Series B announcement says Balderton partner Rana Yared joined the board, but Dash0 does not publish a
              current board roster, committee structure, CFO/COO bench, or observer-rights map. The appropriate
              conclusion is founder-led strength with key-person and governance-disclosure diligence, not a claim that
              governance is weak. This separation also prevents later chapters from converting absence of evidence into
              a negative conclusion; the public record is strong on founder-market fit but incomplete on institutional
              governance details.
