  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Dash0 adoption appears to start with developer pain, move through OpenTelemetry onboarding, then expand into team
      workflows and procurement.
    data:
      nodes:
        - id: pain
          label: 'Pain: fragmented tools, cost, low APM coverage'
        - id: trial
          label: 'Trial: OTel collector, operator, or Vercel marketplace'
        - id: production
          label: 'Production: logs, metrics, traces, dashboards, alerts'
        - id: outcome
          label: 'Outcome: faster triage, more coverage, lower cost'
        - id: expansion
          label: 'Expansion: all teams, more services, Agent0/serverless'
        - id: procurement
          label: 'Procurement: SOC 2, DPA, SSO, data residency'
    approximationNotes: >-
      Journey is synthesized from fetched public case studies and procurement documents; it is not a funnel metric from
      Dash0.
    claimRefs:
      - CU006
      - CU008
      - CU014
      - CU017
      - CU020
      - CU034
  - id: FU002
    title: Adoption and deployment funnel
    type: funnel
    layout: wide
    summary: >-
      Public proof narrows from broad technical pain to named production outcomes, but stops before retention and ARR
      disclosure.
    data:
      items:
        - label: Problem-aware technical teams
          value: 8
          note: Named segments and review cohorts
        - label: Standards-fit evaluation
          value: 7
          note: OpenTelemetry and Kubernetes/Vercel paths
        - label: Production deployment evidence
          value: 5
          note: Telegraph, Bonhams, Understory, Digibee, Porsche
        - label: Quantified public outcome
          value: 5
          note: Traffic, cost, migration, visibility, investigation time
        - label: Public retention disclosure
          value: 0
          note: No NRR/GRR/churn disclosed
    approximationNotes: Values are counts or zero-disclosure markers from public evidence, not Dash0 internal funnel conversion rates.
