      - CR023
      - CR024
      - CR025
      - CR026
      - CR032
      - CR033
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The logic moves from credible financing and market evidence to track / research-more because private financials
      remain missing.
    data:
      nodes:
        - id: financing
          label: Credible 2026 Financing
          detail: $110M Series B at $1B and $155M total funding
        - id: market
          label: Growing APM Market
          detail: Analyst sources show cloud-native and AI-driven demand
        - id: product
          label: Agent0 / Pricing Wedge
          detail: Transparent pricing plus agentic observability narrative
        - id: opacity
          label: Private Financial Opacity
          detail: ARR, margin, NRR, burn, dilution, and terms undisclosed
        - id: competition
          label: Scaled Incumbents
          detail: Datadog, Dynatrace, Grafana, New Relic, and others
        - id: stance
          label: Track / Research More
          detail: Do not buy without data-room proof
      edges:
        - from: financing
          to: market
          label: supported by
        - from: market
          to: product
          label: enables
        - from: product
          to: opacity
          label: must overcome
        - from: competition
          to: opacity
          label: raises bar for
        - from: opacity
          to: stance
          label: drives
    claimRefs:
      - CV001
      - CV008
      - CV015
      - CV017
      - CV018
      - CV031
      - CV032
      - CV038
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: wide
    summary: >-
      The same $1B valuation implies radically different required ARR depending on the revenue multiple the market
      assigns.
    data:
      items:
        - label: 20x premium AI-infra multiple
          value: 50
        - label: 12x high-growth infrastructure multiple
          value: 83.3
        - label: 8x solid software multiple
          value: 125
        - label: 5x compressed software multiple
          value: 200
      yAxis:
        label: Implied ARR required for $1B value (USD M)
    approximationNotes: >-
      Illustrative reverse math only: implied ARR equals $1,000M valuation divided by selected revenue multiple bands;
      Dash0 actual ARR is not disclosed.
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV032
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: Illustrative valuation range shows why undisclosed ARR is the central diligence blocker.
    data:
      items:
        - label: If ARR is $25M
          low: 125
          mid: 300
          high: 500
        - label: If ARR is $50M
          low: 250
          mid: 600
          high: 1000
        - label: If ARR is $100M
          low: 500
          mid: 1200
          high: 2000
    approximationNotes: >-
      Low/mid/high use 5x, 12x, and 20x illustrative revenue multiples; figures are sensitivity outputs, not observed
      Dash0 valuation marks.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: Dash0 scores strongest on market and product momentum and weakest on valuation evidence and private disclosure.
    data:
      items:
        - label: Reported valuation
          value: '1000'
          unit: USD M
        - label: Total funding
          value: '155'
          unit: USD M
        - label: Paying customers
          value: 600+
          unit: accounts
        - label: APM 2026 market forecast
          value: '11.8'
          unit: USD B
        - label: Financial disclosure quality
          value: Low
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV012
      - CV039
      - CV042
