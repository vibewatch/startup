      - number: '7.2'
        title: Legal, Privacy, and AI Governance Risk
        blocks:
          - type: paragraph
            body: >-
              The legal documents are more useful for risk analysis than ordinary website copy because they define the
              boundaries of customer responsibility. Dash0 Terms define Customer Data broadly, including telemetry,
              logs, traces, configuration, inputs, and outputs, while the DPA places Dash0 in a processor role for
              personal data submitted through the platform. Those provisions are expected for enterprise observability,
              but they make privacy controls, data minimization, SCCs, and customer instrumentation decisions material.
              The biggest AI-specific risk is that Agent0 is marketed as moving toward action, yet the Terms state that
              AI outputs are automated, unverified, and require independent customer review. That combination is
              manageable if buyer controls, audit trails, and human-in-the-loop processes are robust. It becomes
              thesis-breaking if Dash0 cannot show customers exactly how agent authorization, restricted-data
              prevention, output review, and incident response work in regulated environments. The remaining work is to
              test those controls against real enterprise deployments, not merely confirm that the documents exist.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
