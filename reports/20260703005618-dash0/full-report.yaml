  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Dash0’s market boundary should start with observability and application performance monitoring, then
              narrow to the workflows where OpenTelemetry-native ingestion and AI-operated production matter. Included
              spend covers APM, infrastructure monitoring, log management, distributed tracing, dashboards, alerting,
              service maps, synthetic and website monitoring, Kubernetes monitoring, and AI SRE agents. Excluded spend
              should be raw cloud infrastructure, data warehouse storage, SIEM-only security budgets, generic
              application development tools, and homegrown Prometheus or OpenTelemetry deployments that do not buy a
              commercial observability outcome. The substitute set is broad: incumbents such as Datadog, Dynatrace, New
              Relic, Splunk, Elastic, Grafana, Honeycomb, Coralogix, Chronosphere, SigNoz, and Better Stack; open-source
              plus internal platform engineering; and status-quo tool sprawl. That breadth makes the market real, but it
              also means Dash0’s SAM is the subset of observability spend willing to standardize on OpenTelemetry and
              trust an AI-assisted operator.
            claimRefs:
