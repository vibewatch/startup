      - number: '1.4'
        title: Milestones, Controls, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The public milestone line shows a coherent shift from OpenTelemetry-native launch to AI-operated
              production. Seed materials emphasized open standards, transparent pricing, and early beta customers;
              Series A materials added Agent0 and hundreds of customers; Series B materials repositioned the platform as
              an autonomous nervous system for production and highlighted U.S. go-to-market, acquisitions, and Agent0
              investment. Controls and diligence signals are mixed. Dash0 publishes security, privacy, terms, and
              vulnerability-disclosure materials, and the seed announcement claimed SOC 2 Type 2 and GDPR compliance.
              The adverse public evidence is not legal or regulatory; it is product-maturity criticism from G2 users who
              cite missing trace sampling, SRE patterns, UI limits for very large microservice estates,
              paid/not-open-source status, and normal early-product rough edges. Those issues are manageable but
              important because Dash0’s $1B valuation assumes rapid enterprise-grade completeness. Reference calls
              should test whether these gaps are shrinking quickly enough for enterprise-scale standardization.
