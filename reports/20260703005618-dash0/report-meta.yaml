companyProfile:
  summary: Dash0 is a venture-backed observability software company founded in 2023 in Germany and now presented publicly as headquartered in New York. Its platform is built around OpenTelemetry-native logs, metrics, traces, dashboards, alerting, service maps, and the newer Agent0 workflow layer for autonomous investigation and remediation. The company has scaled quickly from seed financing in late 2024 to a March 2026 Series B at unicorn valuation, with public traction claims of more than 600 paying customers and named references including Zalando, Taco Bell, and The Telegraph.
  foundedDate: "2023-01-01"
  founders:
    - name: Mirko Novakovic
      role: CEO & Co-founder
      background: Previously founded Instana, the observability company IBM acquired in 2020, giving Dash0 unusually strong category founder-market fit.
      claimRefs: [CO004, CO005]
    - name: Ben Blackmore
      role: CTO & Co-founder
      background: Listed publicly by Dash0 as CTO and identified in early financing materials as part of the founding team behind the telemetry platform.
      claimRefs: [CO004]
  foundingLocation: Germany
  headquarters: New York, USA
  productSummary: OpenTelemetry-native distributed tracing, metrics, logging, dashboards, alerting, service maps, and Agent0-powered observability workflows for cloud-native applications.
  customerFocus: Developers, SREs, and platform engineering teams running cloud-native and microservice-heavy software estates
  businessModel: Consumption-based SaaS pricing for telemetry ingestion, retention, and agent usage
