- id: diligence-verdict
  title: Customer diligence verdict
  body: Customer proof supports a positive adoption thesis but not a complete revenue-quality thesis. The strongest signals are named production outcomes, cost savings against incumbents, technical buyer enthusiasm, and a standards-based implementation story that lowers switching fear. The main risk is not absence of demand; it is lack of disclosed durability metrics and the possibility that feature gaps slow expansion into larger, more demanding accounts. Diligence should request customer lists by segment and ARR band, top-ten customer concentration, logo-to-production conversion, renewal cohorts, NRR/GRR, implementation time distribution, support-ticket themes, lost-deal reasons against Datadog/New Relic/Grafana, and reference calls that include both champions and skeptical users.
