  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Dash0 NRR, GRR, churn, renewal rates, renewal cohort tables, and logo/ARR retention by customer segment.
    whyItMatters: Retention is the difference between early developer enthusiasm and durable SaaS revenue quality.
    diligencePath: Request cohort retention exports, renewal pipeline, customer-success health scores, and at least six renewal reference calls.
    relatedQuestionRefs:
    - QU013
    - QU025
  - type: missing-source
    severity: material
    topic: customer-count-gap
    missingEvidence: Total paying customers, active deployed accounts, logo count by segment, and production versus pilot classification.
    whyItMatters: Public case studies show quality but not breadth of adoption or repeatable acquisition.
    diligencePath: Request CRM/customer ledger by ARR band, deployment status, acquisition source, and first-production date.
    relatedQuestionRefs:
    - QU014
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-ten customer ARR share, largest customer ACV, expansion ARR by module, and channel concentration from Vercel or partners.
    whyItMatters: A few strong references could overstate broad customer-market fit if concentration is high.
    diligencePath: Review ARR by account, top-customer contracts, marketplace pipeline, and renewal/expansion plan.
    relatedQuestionRefs:
    - QU018
    - QU025
  - type: missing-source
    severity: minor
    topic: lost-deal-gap
    missingEvidence: Structured lost-deal and churn reasons against Datadog, New Relic, Grafana Cloud, Chronosphere, and open-source self-hosted alternatives.
    whyItMatters: Adverse G2 reviews identify feature gaps but do not quantify their commercial impact.
    diligencePath: Request win/loss notes, roadmap commitments in enterprise deals, and support-ticket themes tied to missing features.
    relatedQuestionRefs:
    - QU012
    - QU024
