  - TU002
  figureRefs:
  - FU002
  - FU004
- id: retention-and-satisfaction
  title: Retention, satisfaction, and adverse signals
  body: 'Satisfaction evidence is real but incomplete. G2’s fetched snapshot shows 24 reviews, a 4.8 rating, reviewer cohorts across small business, mid-market, and enterprise, and a concentration of European reviewers with North American representation. Review text praises OpenTelemetry-native workflows, Kubernetes setup, support responsiveness, transparent pricing, and developer-oriented UX. The same source is also the required adverse evidence: reviewers say Dash0 is still new, still missing trace sampling, SRE patterns, Synthetics, RUM, SLOs, advanced features, and deeper documentation, and one reviewer warns scaling can become costly. Because public sources do not disclose churn, NRR, GRR, renewals, cohort retention, or customer count, the report should treat satisfaction as positive but durability as unproven. These omissions are material because observability platforms can be adopted enthusiastically before budget owners standardize on a long-term vendor.'
  claimRefs:
  - CU003
  - CU011
  - CU013
  - CU024
  - CU025
  - CU028
  - CU029
  - CU030
  - CU031
  - CU039
