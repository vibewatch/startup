- id: expansion-and-procurement
  title: Expansion loops, procurement, and concentration risk
  body: 'Dash0’s expansion loops are plausible: start with developer-led OpenTelemetry adoption, expand through Kubernetes operator coverage, add dashboards and alerts, use marketplace billing for Vercel customers, and widen into serverless/AWS through Lumigo. The Vercel Marketplace path is meaningful because it reduces billing and setup friction for an ecosystem of frontend and full-stack teams. Procurement risk is also visible. Observability data can contain sensitive telemetry, so enterprise buyers will review SOC 2, ISO 27001, SSO/SAML, MFA, data residency, DPA terms, and restricted-data obligations. Concentration risk cannot be quantified from public evidence. Named case studies are impressive, but without ACV mix, top-customer share, retention, and expansion ARR, diligence cannot distinguish a broad repeatable base from a small number of highly successful references. Additional public APM, Kubernetes, observability-as-code, and privacy guidance sources sharpen the segment and procurement
    diligence paths.'
