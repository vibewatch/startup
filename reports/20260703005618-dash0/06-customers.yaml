chapter:
  number: 6
  title: Customers
  summary: 'Dash0 has credible named customer proof with quantified outcomes across media, auctions, hospitality software, iPaaS, automotive digital services, and developer-review channels. The main underwriting gap is durability: public evidence shows adoption and satisfaction, but not customer count, retention, NRR, churn, ACV mix, or concentration.'
sections:
- id: segments-and-proof
  title: Customer segments and proof quality
  body: 'Dash0’s public customer evidence points to a technically led buyer base: platform teams, SREs, developers, engineering directors, cloud architects, CTOs, and solution architects. The visible segments span online media, auctions, hospitality software, integration platform infrastructure, automotive digital services, ecommerce/fashion infrastructure, Vercel users, and smaller developer-led companies represented in G2. The proof is stronger than logo-only evidence because multiple named stories include before/after operating context and quantified outcomes. However, it remains a partial public sample, not a customer census. The underwriting read is that Dash0 has early proof across both mid-market and enterprise-like environments, but the investor still needs the actual paying customer count, ARR concentration, deployment status by account, and reference-call confirmation. This breadth supports segmentation work but still requires account-level data.'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU027
  - CU038
  - CU040
  tableRefs:
  - TU001
  - TU003
  figureRefs:
  - FU001
- id: adoption-outcomes
  title: Adoption trajectory and quantified outcomes
  body: The most compelling adoption evidence comes from customer-reported operating metrics. The Telegraph reports moving to 100% website traffic capture and faster diagnosis. Bonhams reports 50% cost reduction, one-month migration, 100% trace visibility from ingress to database, and broad developer access. Understory reports a four-to-five-day investigation compressed to one day. Digibee reports moving from 10% to 100% APM coverage across an environment with more than 18,000 pods and at one third of Datadog cost. Porsche Digital reports adoption across four teams, more than 50 services, and roughly 40% savings compared with per-host models. These metrics show tangible pain relief, but they do not yet provide retention cohorts, renewal rates, or standardized usage denominators. The pattern is especially strong where cost pressure and telemetry coverage gaps were explicit.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU012
  - CU014
  - CU015
  - CU017
  - CU018
  - CU026
