- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - OpenTelemetry portability
    - Adoption may be easy to trial but also easier to switch
    - Could pressure renewal if product gaps persist
    - Compare renewal cohorts by OTel maturity and switching alternatives
  - - Kubernetes operator
    - Heavy Kubernetes customers may dominate early ACV
    - Product priorities could skew to platform teams
    - Request ARR by deployment environment and service count
  - - Vercel marketplace
    - Channel could create many small accounts but uncertain expansion
    - Billing convenience may not equal durable enterprise ARR
    - Request marketplace conversion, activation, and expansion metrics
  - - Cost savings vs incumbents
    - Savings references may cluster in high-cost Datadog/New Relic replacements
    - Thesis weakens if incumbents discount aggressively
    - Review win/loss versus Datadog, New Relic, Grafana, Chronosphere
  - - Agent0 and Lumigo/serverless
    - New surfaces may not yet have repeatable adoption
    - Expansion ARR may lag roadmap narrative
    - Request attach rate and active usage by module
  - - Named enterprise references
    - A few large logos could overstate broad-market fit
    - Top-customer concentration could be material
    - Request top-ten ARR share and logo cohort analysis
  - - Security and compliance controls
    - Regulated buyers may wait for HIPAA/PCI or deeper controls
    - Can delay healthcare/payment expansion
    - Review pipeline stage losses tied to compliance gaps
  - - Developer enthusiasm
    - Bottom-up love may not convert to procurement-standard deals
    - Usage may remain team-level without exec budget
    - Request account-level seat, usage, and budget-owner progression
  notes: Risk rows convert positive adoption mechanisms into concentration and durability diligence questions.
