- id: execution-financial-and-kill-criteria
  title: Execution, Financial, and Kill Criteria
  body: The financial and execution risk is asymmetric because Dash0 has raised enough money to pursue a broad plan but has not disclosed the private metrics that would prove operating leverage. Public claims show more than 600 paying customers, named enterprise proof, a $1 billion valuation, and $155 million of total funding. They do not disclose ARR, net revenue retention, gross margin, customer concentration, support burden, incident history, or AI-action audit outcomes. That is acceptable for a private company but not sufficient for high-conviction underwriting. The monitoring plan should therefore be explicit. Diligence must request current ARR, NRR, gross margin, churn cohorts, top-customer exposure, support metrics, security attestations, breach and incident history, AI-action logs, and Lumigo integration milestones. The thesis should break if security evidence weakens, restricted-data controls fail, customer expansion stalls, or incumbent pricing pressure erodes the value 
    proposition. These asks should be treated as gating items before any stronger recommendation is attached to the valuation case.
