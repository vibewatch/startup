  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Dash0 customer-facing incident history, breach history, severity register, and postmortem evidence.
    whyItMatters: Security or reliability incidents would directly affect enterprise trust and valuation resilience.
    diligencePath: Request SOC 2 report, bridge letter, pen-test summary, incident log, and customer-notification history.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: Net revenue retention, gross retention, churn, top-customer concentration, and expansion cohorts.
    whyItMatters: Customer durability determines whether funding-led growth is sustainable or fragile.
    diligencePath: Review cohort retention, top-20 customer revenue, renewal pipeline, and support escalations.
    relatedQuestionRefs:
    - QR027
    - QR030
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: Operational audit logs proving Agent0 actions, approvals, rollback controls, and human-review policy.
    whyItMatters: Agentic observability risk depends on how automated recommendations become production changes.
    diligencePath: Obtain product demo, audit-log export, customer policy controls, and examples of rejected or corrected actions.
    relatedQuestionRefs:
    - QR026
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: minor
    topic: runway-and-hiring
    missingEvidence: Current burn, runway, headcount plan, sales productivity, and integration budget after Series B.
    whyItMatters: The Series B plan is broad, and over-hiring or acquisition distraction could create execution risk.
    diligencePath: Request board plan, hiring plan, spend by function, pipeline conversion, and Lumigo integration dashboard.
    relatedQuestionRefs:
    - QR030
