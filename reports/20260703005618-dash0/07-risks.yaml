- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / restricted data
    - Customer telemetry includes prohibited sensitive data
    - Any material incident or repeated audit exceptions
    - Pause investment or require remediation covenant
  - - AI output / autonomous action
    - Agent0 action taken without appropriate customer review
    - Unreviewed production change or material false remediation
    - Raise risk rating to high and require governance controls
  - - Security posture
    - SOC 2/ISO evidence, VDP response, or encryption/access claims weaken
    - Expired report, unresolved critical vulnerability, or breach
    - Treat as thesis-breaking for enterprise segment
  - - Competitive pricing
    - Incumbents discount or match transparent pricing and AI features
    - Win-rate decline or gross margin pressure appears
    - Reduce valuation multiple and monitor churn
  - - Customer durability
    - NRR, churn, or concentration disappoints
    - NRR below premium SaaS expectations or top-customer shock
    - Move from track to avoid unless price resets
  - - Execution scope
    - Agent0, US GTM, or Lumigo milestones slip materially
    - Missed roadmap milestones across two quarters
    - Lower confidence and require budget / hiring evidence
  notes: Kill criteria convert public-risk evidence into diligence triggers; thresholds require private customer, security, and financial data to calibrate precisely.
