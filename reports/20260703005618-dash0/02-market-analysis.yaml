tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Dash0
  rows:
  - - APM and application observability
    - Tracing, error diagnosis, latency, service health, user experience monitoring
    - Generic application development tools and code repositories
    - SRE, DevOps, application engineering
    - Core current category and narrow analyst lens
  - - Infrastructure and Kubernetes monitoring
    - Hosts, containers, Kubernetes, cloud resource health, service maps
    - Raw cloud compute, storage, and network spend
    - Platform engineering, cloud infrastructure
    - Supports OpenTelemetry-native platform adoption
  - - Log management and distributed tracing
    - Logs, spans, trace search, correlation, retention, troubleshooting workflows
    - General-purpose data lake storage without observability workflow
    - SRE, observability team, platform engineering
    - Primary telemetry workload and cost-control pain point
  - - Dashboards, alerting, and SLO operations
    - Dashboards, alerts, templates, SLOs, incident artifacts
    - Manual spreadsheets and project-management tools
    - DevOps, reliability leadership
    - Workflow layer where Agent0 can create and maintain artifacts
  - - AI SRE and autonomous operations
    - Root-cause analysis, recommendations, generated fixes, migration and cost agents
    - Generic GenAI productivity tools outside production telemetry
    - Engineering leadership, platform, SRE
    - Dash0’s differentiation wedge and future expansion area
  - - Status-quo substitutes
    - Open-source Prometheus/Grafana stacks, incumbent bundles, internal observability platforms
    - Unobserved workloads and unsupported homegrown scripts
    - Engineering and finance
    - Defines the competitive and switching-cost baseline
  notes: 'Boundary is evidence-constrained: it includes spend tied to observability outcomes and excludes adjacent IT spend
    without telemetry or incident-response value.'
