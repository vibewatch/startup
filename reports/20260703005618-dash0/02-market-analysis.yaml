company:
  name: Dash0
chapter:
  number: 2
  title: Market Analysis
  summary: Dash0 should be analyzed in the observability and APM market, with an OpenTelemetry-native and AI-operations wedge
    rather than as generic infrastructure software. Published sizing spans from $7.52B APM in 2023 to $11.8B APM in 2026,
    $19.62B by 2030, $45B by 2035, and Dash0’s own broader $12B 2024 observability estimate, so the market is attractive but
    requires disciplined boundary and SOM diligence.
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary and Status-Quo Substitutes
  body: 'Dash0’s market boundary should start with observability and application performance monitoring, then narrow to the
    workflows where OpenTelemetry-native ingestion and AI-operated production matter. Included spend covers APM, infrastructure
    monitoring, log management, distributed tracing, dashboards, alerting, service maps, synthetic and website monitoring,
    Kubernetes monitoring, and AI SRE agents. Excluded spend should be raw cloud infrastructure, data warehouse storage, SIEM-only
    security budgets, generic application development tools, and homegrown Prometheus or OpenTelemetry deployments that do
    not buy a commercial observability outcome. The substitute set is broad: incumbents such as Datadog, Dynatrace, New Relic,
    Splunk, Elastic, Grafana, Honeycomb, Coralogix, Chronosphere, SigNoz, and Better Stack; open-source plus internal platform
    engineering; and status-quo tool sprawl. That breadth makes the market real, but it also means Dash0’s SAM is the subset
    of observability spend willing to standardize on OpenTelemetry and trust an AI-assisted operator.'
  claimRefs:
  - CM001
  - CM002
  - CM006
  - CM020
  - CM026
  - CM029
  - CM030
  - CM031
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses-and-sam-som
  title: Sizing Lenses and Evidence-Constrained SAM/SOM
  body: 'The sizing evidence is attractive but inconsistent because the sources use different boundaries. Grand View’s narrower
    APM lens starts at $7.52B in 2023 and reaches $19.62B by 2030 at 15.1% CAGR. Dimension’s APM lens is more aggressive,
    projecting $11.8B in 2026 and $45.0B by 2035 at 16.1% CAGR. Dash0’s own bottom-up observability estimate is broader: about
    $12B in 2024 growing around 20% annually, with a much larger potential implied if observability spend approached 15-20%
    of cloud infrastructure. For underwriting, the right answer is not to average these numbers mechanically. A conservative
    near-term low lens is 2026 APM at $11.8B; a broader observability lens grown from Dash0’s $12B 2024 estimate is roughly
    $17.3B in 2026; and a medium-term APM anchor is $19.62B in 2030. Public evidence does not isolate Dash0’s SAM or SOM,
    so actual pipeline, ACV, paid-customer mix, and retention data are required. The diligence stance should therefore keep
    two models side by side: a published market-size range for category attractiveness and a bottoms-up account model for
    what Dash0 can actually win.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM010
  - CM011
  - CM012
  - CM032
  - CM033
  - CM045
  - CM046
