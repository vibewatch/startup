company:
  name: Dash0
chapter:
  number: 8
  title: Valuation
  summary: Dash0 merits a track / research-more stance rather than a buy on public evidence. The $110 million Series B at a $1 billion valuation is well supported, and the market, product, customer, and investor signals are attractive; however, ARR, NRR, gross margin, burn, runway, concentration, dilution, and preference terms are not disclosed, so the reported mark is credible but not independently underwritten.
sections:
- id: recommendation-and-valuation-context
  title: Recommendation and Valuation Context
  body: 'Dash0 is investable enough to track closely, but public evidence does not support a clean buy at the reported $1 billion valuation. The strongest facts are current and well corroborated: a 2026 $110 million Series B, a $1 billion valuation, $155 million of total funding, more than 600 paying customers, strong investor sponsorship, and a product strategy aimed at agentic operations rather than ordinary dashboards. The weakness is equally clear. No fetched source discloses current ARR, gross margin, NRR, burn, runway, customer concentration, Series B dilution, or preference terms. That makes the reported mark credible as a financing fact but not fully underwritten as an entry price. The right stance is track / research-more: stay engaged, request private metrics, and reserve a buy recommendation for evidence that Dash0 has premium ARR scale, retention, and Agent0 monetization rather than only premium narrative. This is especially important because late-stage private infrastructure
    rounds can look attractive on logo velocity while still being expensive on revenue quality.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
