- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Case
  - Assumptions
  - Illustrative valuation logic
  - Probability signal
  - Key risk
  rows:
  - - Bull
    - ARR already near premium threshold; Agent0 monetizes; NRR strong; security trust holds
    - $1B can be justified around premium AI-infrastructure revenue multiple
    - Would require high ARR growth, attach, and retention proof
    - Incumbents copy AI workflow and compress pricing
  - - Base
    - Customer growth is real but ARR, NRR, and margins remain undisclosed
    - $1B is plausible but not obviously cheap
    - Public evidence supports track, not buy
    - Private metrics may not support premium multiple
  - - Bear
    - ARR is below threshold; usage costs or churn weaken; competition narrows differentiation
    - Down-round or flat-round risk if multiple reverts toward ordinary software
    - Would be signaled by poor retention or discounting
    - Valuation compression and confidence loss
  - - Strategic upside
    - Lumigo and Agent0 expand use cases and acquisition optionality
    - Could raise exit relevance to Datadog/Dynatrace/IBM-style buyers
    - Attach-rate and cross-sell evidence
    - Integration distraction or low monetization
  - - No-deal discipline
    - No access to ARR, terms, or retention
    - Cannot underwrite entry price
    - Missing data remains after diligence
    - Research-more or pass
  notes: Scenarios use public facts plus explicit multiple math; they do not assert Dash0 actual ARR.
