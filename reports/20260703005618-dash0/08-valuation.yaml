- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'Thesis: category growth'
    - Analyst-market-data sources show APM demand expanding through cloud-native, AI, and microservices complexity
    - More proof that Dash0 converts category growth into efficient ARR
  - - 'Thesis: product wedge'
    - OpenTelemetry-native positioning, transparent pricing, Agent0, and customer proof create differentiation
    - Agent0 attach, usage, and win-rate data by segment
  - - 'Thesis: investor and founder quality'
    - Balderton, Accel, Cherry, DIG, DTCP, and founder Instana history are strong signals
    - Board materials showing operational cadence and hiring quality
  - - 'Anti-thesis: financial opacity'
    - ARR, margin, NRR, burn, runway, dilution, and preference terms are undisclosed
    - Data-room metrics above premium SaaS thresholds
  - - 'Anti-thesis: incumbent response'
    - Datadog, Dynatrace, Grafana, New Relic, and others can bundle or discount
    - Evidence of sustained win rates against incumbents
  notes: Rows balance thesis and anti-thesis; private financial and sales metrics are required to resolve them.
