- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable / source
  - Metric or evidence
  - Relevance
  - Limitation
  rows:
  - - Datadog filing
    - FY2025 revenue $3.43B, 28% growth, $915M FCF, 603 $1M+ ARR customers
    - Best public scaled observability comp and adverse competitive reference
    - Public maturity is far beyond Dash0 stage
  - - Dynatrace platform
    - AI-powered observability and agentic operations positioning
    - Shows incumbents already market agentic AI concepts
    - No direct private multiple for Dash0
  - - Grafana pricing
    - Free, usage-based, and enterprise commit model
    - Open-source-influenced pricing pressure
    - Different business model and community base
  - - New Relic / Honeycomb / SigNoz
    - Published pricing alternatives
    - Shows buyers have many cost comparison points
    - Pricing pages do not reveal win/loss rates
  - - Chronosphere / Coralogix / Elastic
    - Broad observability platform alternatives
    - Confirms crowded enterprise platform landscape
    - Private and public economics differ
  - - Research and Markets
    - APM market $11.8B in 2026 and $45B by 2035
    - Supports market-growth thesis
    - Market size does not prove Dash0 share
  - - Grand View Research
    - APM market $7.52B in 2023 and $19.62B by 2030
    - Independent growth cross-check
    - Different methodology and vintage
  - - Dimension Market Research
    - 2026 global, US, and Europe APM forecasts
    - Regional demand support
    - Forecast page is market-level, not company-specific
  notes: Enumeration covers representative public, private, pricing, and analyst-market-data references available in fetched sources.
