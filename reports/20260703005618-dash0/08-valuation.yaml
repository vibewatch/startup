  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: private-financials
    missingEvidence: Current ARR, quarterly growth, gross margin, NRR, churn, burn, runway, customer concentration, and sales productivity.
    whyItMatters: These inputs determine whether the $1 billion valuation is fair, stretched, or attractive.
    diligencePath: Request data-room metrics, board deck, financial model, CRM export, cohort tables, and customer concentration schedule.
    relatedQuestionRefs:
    - QV029
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Series B post-money calculation, dilution, preferences, pro-rata, option pool, secondary component, debt, and governance terms.
    whyItMatters: Entry economics and downside protection can change recommendation even if company quality is strong.
    diligencePath: Review financing documents, cap table, liquidation stack, and investor rights agreement.
    relatedQuestionRefs:
    - QV029
  - type: missing-source
    severity: material
    topic: agent0-monetization
    missingEvidence: Agent0 attach rate, credit usage, conversion uplift, AI-action audit logs, and customer case studies with paid adoption.
    whyItMatters: The valuation premium depends on Agent0 becoming monetized production infrastructure, not just product narrative.
    diligencePath: Request product analytics, cohort attach data, customer references, and demo of governance controls.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Logo and net retention by cohort plus top-customer and top-vertical revenue concentration.
    whyItMatters: Named logos and customer counts do not prove durable revenue or expansion quality.
    diligencePath: Review renewal cohorts, top-20 customer schedule, churn notes, and win/loss records.
    relatedQuestionRefs:
    - QV030
