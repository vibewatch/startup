- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - ARR / growth
    - Current ARR, quarterly growth, pipeline conversion, sales productivity
    - Determines whether $1B mark has revenue support
    - Review data room, board deck, CRM export, and cohort bridge
  - - Retention
    - NRR, GRR, churn, expansion, logo cohorts
    - Validates customer durability and premium multiple
    - Inspect cohort tables and top-20 customer renewals
  - - Unit economics
    - Gross margin, telemetry cost-to-serve, support cost, Agent0 credit margin
    - Shows usage-based model quality
    - Request margin by product and customer size
  - - Cap table / terms
    - Dilution, preferences, option pool, pro-rata, secondary, debt
    - Determines investor entry economics
    - Review financing documents and liquidation stack
  - - Agent0 adoption
    - Attach rate, credit usage, conversion, audit logs, production-action controls
    - Tests the agentic premium case
    - Review product analytics, logs, customer demos, and governance controls
  - - Risk evidence
    - Security reports, incident history, AI governance, Lumigo integration milestones
    - Protects enterprise readiness and downside case
    - Request SOC 2, pen tests, incident log, and integration dashboard
  notes: Diligence asks are prioritized by variables that would most change recommendation, valuation stance, and confidence.
