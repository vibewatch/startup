      - number: '8.4'
        title: 最终尽调清单与投资假设破裂点
        blocks:
          - type: paragraph
            body: >-
              最终尽调清单很窄，也足以决定结论。Dash0 必须披露当前 ARR、ARR 增长、毛利率、NRR、流失率、客户 logo 留存、队列扩张、客户集中度、支持负担、遥测服务成本、Agent0 附加销售和额度
              使用量、安全证据、事故历史、烧钱、现金续航期、Series B 稀释和优先条款。公司还应说明 Lumigo 整合是否带来附加销售、销售管线或留存收益。若数据证明增长质量高、留存耐久、用量经济性高效、Agent0
              采用已货币化，且价格仍给风险投资回报留空间，建议可上调为买入。若 ARR 远低于隐含门槛，或留存 / 集中度偏弱，或遥测基础设施成本挤压毛利，或安全与 AI
              治理证据不及预期，或既有厂商定价压力侵蚀转化，建议应转为回避。在那之前，估值只能放在纪律性观察名单，不是可提交 IC 的坚定买入。举证责任在公司和领投方一侧：公开动能足以争取一次会，私有指标才决定价格。
