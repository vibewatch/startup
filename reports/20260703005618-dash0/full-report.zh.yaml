      - number: '1.4'
        title: 里程碑、控制与负面信号
        blocks:
          - type: paragraph
            body: >-
              公开里程碑线索显示，公司从 OpenTelemetry 原生发布，连贯转向 AI 运维生产环境。种子轮材料强调开放标准、透明定价和早期 beta 客户；Series A 材料加入 Agent0
              和数百个客户；Series B 材料把平台重新定位为生产环境的自主神经系统，并突出美国 GTM、收购和 Agent0 投入。控制与尽调信号好坏参半。Dash0
              发布了安全、隐私、条款和漏洞披露材料，种子轮公告还声称符合 SOC 2 Type 2 和 GDPR。公开负面证据不是法律或监管问题，而是 G2 用户对产品成熟度的批评：缺少链路采样、SRE
              模式，面对超大规模微服务资产时 UI 受限，产品付费且非开源，以及早期产品常见的粗糙边缘。这些问题可管理，但很重要，因为 Dash0 的 $1B
              估值假设它能快速补齐企业级完整度。客户访谈应检验这些缺口是否缩小得足够快，足以支撑企业级标准化。
