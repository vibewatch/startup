  - id: FU004
    title: 可见客户结果区间
    type: bar
    layout: wide
    summary: 公开量化结果强调覆盖、迁移速度、降本和调查时间缩短，而不是收入留存。
    data:
      items:
        - label: The Telegraph 流量捕获
          value: 100
          unit: percent
        - label: Bonhams 成本降低
          value: 50
          unit: percent
        - label: Bonhams 链路追踪可见性
          value: 100
          unit: percent
        - label: Understory 调查时间缩短
          value: 80
          unit: percent
        - label: Digibee 使用 Dash0 后的 APM 覆盖
          value: 100
          unit: percent
        - label: Porsche 约略节省额
          value: 40
          unit: percent
    approximationNotes: Understory 80% 来自抓取到的故事标题，以及从 4-5 天降到一天；其他百分比是客户故事中的说法。
    claimRefs:
      - CU006
      - CU008
      - CU009
      - CU012
      - CU014
      - CU018
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 残余暴露最高的地方，是敏感遥测、智能体行动、客户信任和存量竞争交叠处。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余暴露
      rows:
        - label: 受限数据 / 隐私错配
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: AI 输出或委托行动失误
          values:
            - 中
