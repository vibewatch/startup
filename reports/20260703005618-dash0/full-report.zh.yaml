  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Dash0 的市场边界应先从可观测性和应用性能监控（APM）切入，再收窄到 OpenTelemetry 原生采集和 AI 运营生产环境真正重要的工作流。纳入的支出包括
              APM、基础设施监控、日志管理、分布式追踪、仪表盘、告警、服务地图、合成与网站监控、Kubernetes 监控，以及 AI SRE Agent。排除项应包括原始云基础设施、数据仓库存储、仅面向 SIEM
              的安全预算、通用应用开发工具，以及不购买商业可观测性结果的自建 Prometheus 或 OpenTelemetry 部署。替代品集合很宽：Datadog、Dynatrace、New
              Relic、Splunk、Elastic、Grafana、Honeycomb、Coralogix、Chronosphere、SigNoz 和 Better Stack
              等既有厂商；开源加内部平台工程；以及维持现有工具蔓延。这个宽度证明市场真实存在，但也意味着 Dash0 的 SAM 是可观测性支出中的一个子集：买方愿意围绕 OpenTelemetry 标准化，并信任 AI
              辅助运维人员。
