      - number: '7.3'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险来自 Dash0 差异化的同一个来源：深层遥测上下文、OpenTelemetry 原生定位，以及能从生产信号生成有用工件或建议的 AI Agent。Dash0 安全页面列出 SOC 2 Type
              II、GDPR、ISO 27001、加密、RBAC、SSO/SAML、MFA、审计日志和欧盟 / 美国数据驻留，这些都是有意义的缓释项。漏洞披露政策也给研究人员提供了负责任渠道。不过，Security 页面把
              HIPAA 和 PCI DSS 标为 2026 年上线，所以受监管扩张在公开证据里仍未完成。依赖项会叠加风险。Dash0 依赖云 marketplace、开放标准、客户埋点质量，以及与 Lumigo
              的收购整合。它还面对产品套件更宽、财务资源大得多的成熟既有厂商。这些风险并不证明 Dash0
              会失败；它们定义了在把增长视为持久之前必须完成的运营检查。只有公司在产品界面扩宽时仍能保持部署、告警和文档体验可靠，集成深度才有价值。客户采用的产品界面越多，投资者越应要求更多支持、文档和变更管理证据。
