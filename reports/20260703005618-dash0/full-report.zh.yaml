      - number: '8.3'
        title: 情景与回报敏感性
        blocks:
          - type: paragraph
            body: >-
              ARR 未披露，估值应做情景测算，不要追求伪精确。按 $1 billion 估值，20x 收入倍数需要约 $50 million ARR，8x 倍数需要约 $125 million，5x 倍数需要约 $200
              million。上述只是示例区间，不是对 Dash0 实际 ARR 的判断。乐观情景是客户增长、Agent0 GA、安全状态、市场扩张和 Lumigo 能力共同撑出 AI 基础设施溢价倍数。基准情景是 $1
              billion 标尺说得通，但经济性不透明，并不显然便宜。悲观情景是 Dash0 的 ARR
              或留存低于支撑该倍数的门槛，同时既有厂商缩小功能差距或激进打折。因此，投资人只能在拿到私有指标后给本轮定价；如果收入基数明显低于溢价倍数门槛，应要求下行保护。情景表刻意把估值测算写清楚，方便未来
              资料室更新后用实际 ARR 和留存数据替换假设。
