            body: >-
              财务与执行风险是不对称的，因为 Dash0 已筹到足够资金去推进一个宽计划，但没有披露能证明经营杠杆的私有指标。公开主张显示，公司拥有 600 多个付费客户、具名企业证据、$1 billion 估值和 $155
              million 总融资。它们没有披露 ARR、净收入留存、毛利率、客户集中度、支持负担、事故历史或 AI
              动作审计结果。私营公司可以不披露这些指标，但这不足以支撑高确信度投资判断。监控计划因此必须明确。尽调必须索取当前 ARR、NRR、毛利率、churn
              cohort、头部客户敞口、支持指标、安全证明、泄露与事故历史、AI 动作日志和 Lumigo
              整合里程碑。若安全证据变弱、受限数据控制失效、客户扩张停滞，或既有厂商定价压力侵蚀价值主张，投资论点应失效。这些问题应被视为任何更强建议绑定估值案例之前的门槛项。
