      - number: '7.2'
        title: 法律、隐私与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              法律文件比普通网站文案更适合风险分析，因为它们界定了客户责任边界。Dash0 条款广泛定义 Customer Data，包括遥测、日志、链路追踪、配置、输入和输出；DPA 则把 Dash0
              定位为通过平台提交的个人数据处理者。这些条款符合企业可观测性预期，但它们让隐私控制、数据最小化、SCCs 和客户埋点决策变得重要。最大的 AI 特有风险是，Agent0 的营销正在走向动作，但条款说明 AI
              输出是自动化、未验证的，并要求客户独立审查。如果买方控制、审计轨迹和人在回路流程足够强，这个组合可管理。若 Dash0 不能向客户清楚展示，在受监管环境里 Agent
              授权、受限数据防范、输出审查和事故响应如何运作，它就会破坏投资论点。剩余工作是用真实企业部署测试这些控制，而不只是确认文件存在。
