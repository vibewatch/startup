  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              Dash0
              不是高风险公司，因为公开资料未显示诉讼、执法行动、制裁条目或泄露通知；但这笔投资仍有中高剩余风险，因为产品位于敏感生产遥测工作流中，现在又承诺更多自主动作。最清晰的论点风险是信任失败：客户发送受限数据、AI
              输出被过度信任，或生产动作造成运营后果。第二个风险是 2026 年 Series B 后的执行压力：Dash0 被按快速扩张的智能体式可观测性平台估值，所以
              Agent0、支持质量、收购整合或美国企业扩张一旦延迟，故事可能很快压缩。第三个风险来自 Datadog、Dynatrace、Grafana、New Relic
              和开源导向替代品的竞争反应。上行证据真实存在，但风险登记册应按信任与执行投资来管理，而不是简单的 SaaS 增长敞口。这让证据纪律很重要：本章把公开负面缺失视为尽调提示，而不是法律、运营或客户风险已经解决的证明。
