  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律、AI、安全和竞争风险经由客户信任，传导到留存、利润率、融资信心和估值。
    data:
      nodes:
        - id: data
          label: 遥测 / 受限数据
          detail: 个人数据、密钥、日志、链路追踪和配置进入可观测性工作流
        - id: ai
          label: Agent0 输出 / 行动
          detail: 自动输出或委托行动需要客户复核
        - id: trust
          label: 客户信任
          detail: 安全、合规和可靠性信心
        - id: comp
          label: 存量厂商竞争
          detail: 大平台可以打包 AI、安全和价格反击
        - id: retention
          label: 留存 / 扩张
          detail: 流失率、NRR 和集中度决定增长质量
        - id: valuation
          label: 估值韧性
          detail: 私人市场估值取决于可持续增长和信任
      edges:
        - from: data
          to: trust
          label: 可能削弱
        - from: ai
          to: trust
          label: 需要控制
        - from: comp
          to: retention
          label: 施压
        - from: trust
          to: retention
          label: 支撑
        - from: retention
          to: valuation
          label: 驱动
        - from: comp
          to: valuation
          label: 压缩
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR022
      - CR026
      - CR027
      - CR037
      - CR038
      - CR039
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Dash0 要安全扩张，依赖法律控制、客户埋点、云市场、标准、收购资产和竞争差异化。
    data:
      nodes:
        - id: contracts
          label: 条款 / 隐私 / DPA
          detail: 界定数据、处理者、使用和责任边界
        - id: customer
          label: 客户埋点
          detail: 决定数据质量、受限数据和部署成败
        - id: marketplaces
          label: 云市场
          detail: 采购与承诺消费路径
        - id: standards
          label: OpenTelemetry / 开源
          detail: 互操作性和差异化基础
        - id: lumigo
          label: Lumigo 集成
          detail: 无服务器和 AWS 能力扩张
        - id: incumbents
          label: 存量厂商
          detail: 平台广度、资本和折扣能力
      edges:
        - from: contracts
          to: customer
          label: 设定义务
        - from: customer
          to: standards
          label: 使用
        - from: marketplaces
          to: customer
          label: 帮助获取
        - from: lumigo
          to: customer
          label: 扩展用例
        - from: incumbents
          to: customer
          label: 争夺
        - from: standards
          to: incumbents
          label: 可被采用
    claimRefs:
      - CR006
      - CR007
      - CR021
      - CR023
      - CR024
      - CR025
      - CR026
      - CR032
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 判断链条从可信融资和市场证据出发，最终落到「跟踪 / 继续研究」：私有财务数据仍然缺失。
    data:
      nodes:
        - id: financing
          label: 可信的 2026 年融资
          detail: 以 $1B 估值完成 $110M Series B，总融资 $155M
        - id: market
          label: 增长中的 APM 市场
          detail: 分析师来源显示，云原生和 AI 驱动需求在增长
        - id: product
          label: Agent0 / 定价楔子
          detail: 透明定价加智能体式可观测性叙事
        - id: opacity
          label: 私有财务不透明
          detail: ARR、利润率、NRR、现金消耗、稀释和条款未披露
        - id: competition
          label: 已规模化存量厂商
          detail: Datadog、Dynatrace、Grafana、New Relic 等
        - id: stance
          label: 跟踪 / 继续研究
          detail: 没有数据室证据就不要买入
      edges:
        - from: financing
          to: market
          label: 获得支撑
        - from: market
          to: product
          label: 促成
        - from: product
          to: opacity
          label: 必须跨过
        - from: competition
          to: opacity
          label: 抬高门槛
        - from: opacity
          to: stance
          label: 推动
    claimRefs:
      - CV001
      - CV008
      - CV015
      - CV017
      - CV018
      - CV031
      - CV032
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 同样 $1B 估值，在不同市场收入倍数下，对应的 ARR 要求差异极大。
    data:
      items:
        - label: 20x 高端 AI 基础设施倍数
          value: 50
        - label: 12x 高增长基础设施倍数
          value: 83.3
        - label: 8x 稳健软件倍数
          value: 125
        - label: 5x 压缩后软件估值倍数
          value: 200
      yAxis:
        label: 支撑 $1B 估值所需的隐含 ARR（USD M）
    approximationNotes: 仅为示意性倒推：隐含 ARR 等于 $1,000M 估值除以所选收入倍数区间；Dash0 实际 ARR 未披露。
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 示意估值区间说明：ARR 未披露，是尽调最大的卡点。
    data:
      items:
        - label: 若 ARR 为 $25M
          low: 125
          mid: 300
          high: 500
        - label: 若 ARR 为 $50M
          low: 250
          mid: 600
          high: 1000
        - label: 若 ARR 为 $100M
          low: 500
          mid: 1200
          high: 2000
    approximationNotes: 低 / 中 / 高情景采用 5x、12x 和 20x 示意收入倍数；图中数值是敏感性测算结果，不是已观察到的 Dash0 估值标记。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Dash0 在市场和产品势能上得分最高，估值证据和非公开披露最弱。
    data:
      items:
        - label: 已披露估值
          value: '1000'
          unit: USD M
        - label: 累计融资
          value: '155'
          unit: USD M
        - label: 付费客户
          value: 600+
          unit: accounts
        - label: APM 2026 年市场预测
          value: '11.8'
          unit: USD B
        - label: 财务披露质量
          value: Low
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV012
      - CV039
      - CV042
