  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              Dash0 不是在打一场狭窄的点状解决方案之战。本次证据支持一个更宽的格局：全套件可观测性既有厂商、OpenTelemetry 原生挑战者、按用量计费的开发者工具，以及维持现状的内部技术栈。直接替换既有厂商意味着
              Datadog、Dynatrace、New Relic、Splunk 和 Elastic；开发者主导的替代品包括 Grafana
              Cloud、Honeycomb、SigNoz、Chronosphere、Coralogix、Better Stack，以及自管 OpenTelemetry 或基于 Prometheus
