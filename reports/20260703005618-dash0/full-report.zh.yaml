              还列明不收每席费用、不收基础平台费、没有隐藏费用，并用单一计划包含核心可观测性模块。Agent0 通过按任务计费的 credit 带来扩张向量，单价为每个 credit
              $0.60。条款页很重要，因为它确认付费订阅、用量限制、试用、超额和订单是合同机制，而不只是营销话术。这比许多可观测性厂商给出了更清晰的收入桥梁，因为可计费事件绑定在遥测和 AI
              工作上，而不是具名用户。公开证据仍停在价目机制层面，所以本章把价格架构当作收入质量信号，而不是实际 ARR、折扣或利润率的证明。
