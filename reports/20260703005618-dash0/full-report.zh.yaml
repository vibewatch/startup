  - id: TV002
    title: 投资逻辑 / 反投资逻辑表
    columns:
      - 论点
      - 证据
      - 改变判断的条件
    rows:
      - - 投资逻辑：品类增长
        - 分析师和市场数据来源显示，云原生、AI 和微服务复杂度推动 APM 需求扩张
        - 更多证据证明 Dash0 能把品类增长转成高效 ARR
      - - 投资逻辑：产品楔子
        - OpenTelemetry 原生定位、透明定价、Agent0 和客户证据构成差异化
        - 按细分市场拆分的 Agent0 附加率、使用和赢单率数据
      - - 投资逻辑：投资人与创始人质量
        - Balderton、Accel、Cherry、DIG、DTCP 以及创始人的 Instana 经历都是强信号
        - 能显示运营节奏和招聘质量的董事会材料
      - - 反投资逻辑：财务不透明
        - ARR、利润率、NRR、烧钱、现金跑道、稀释和清算优先条款均未披露
        - 资料室指标高于优质 SaaS 门槛
      - - 反投资逻辑：老牌厂商反击
        - Datadog、Dynatrace、Grafana、New Relic 等可以捆绑或打折
        - 对老牌厂商维持赢单率的证据
    notes: 各行平衡投资逻辑和反投资逻辑；需要私有财务和销售指标来定论。
    claimRefs:
      - CV003
      - CV008
      - CV012
      - CV015
      - CV016
      - CV017
      - CV018
      - CV036
      - CV037
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 示例估值逻辑
      - 概率信号
      - 核心风险
    rows:
      - - 乐观
        - ARR 已接近优质门槛；Agent0 能变现；NRR 强；安全信任守得住
        - 按优质 AI 基础设施收入倍数，$1B 可以解释
        - 需要高 ARR 增长、附加率和留存证据
        - 老牌厂商复制 AI 工作流并压低价格
      - - 基准
        - 客户增长真实，但 ARR、NRR 和利润率仍未披露
        - $1B 合理但并不明显便宜
        - 公开证据支持跟踪，不支持买入
        - 私有指标可能撑不起高端倍数
      - - 悲观
        - ARR 低于门槛；使用成本或流失走弱；竞争压窄差异化
        - 若倍数回归普通软件，存在降估值轮或平轮风险
        - 留存差或折扣会发出信号
        - 估值压缩和信心流失
      - - 战略上行
        - Lumigo 和 Agent0 扩展用例及被收购可选性
        - 可能提高对 Datadog / Dynatrace / IBM 式买家的退出相关性
        - 附加率和交叉销售证据
        - 整合分心或变现不足
      - - 不交易纪律
        - 无法获取 ARR、条款或留存
        - 无法支撑入场价格
        - 尽调后数据仍缺失
        - 继续研究或放弃
    notes: 情景使用公开事实和明确倍数测算；不声称 Dash0 的实际 ARR。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV031
      - CV032
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 来源
      - 指标或证据
      - 相关性
      - 局限
    rows:
      - - Datadog 申报文件
        - FY2025 收入 $3.43B，增长 28%，FCF $915M，603 个 $1M+ ARR 客户
        - 最佳公开规模化可观测性可比公司，也是反向竞争参照
        - 公开市场成熟度远高于 Dash0 阶段
      - - Dynatrace 平台
        - AI 驱动的可观测性与智能体式运维定位
        - 显示老牌厂商已在营销智能体式 AI 概念
        - 没有 Dash0 的直接私有倍数
      - - Grafana 定价
        - 免费、按用量计费和企业承诺消费模式
        - 开源影响下的定价压力
        - 商业模式和社区基础不同
      - - New Relic / Honeycomb / SigNoz
        - 已发布的定价替代方案
        - 显示买方有很多成本比较锚点
        - 定价页不披露赢单 / 输单率
      - - Chronosphere / Coralogix / Elastic
        - 广谱可观测性平台替代方案
        - 印证企业平台赛道拥挤
        - 私有公司与上市公司的经济模型不同
      - - Research and Markets 口径
        - APM 市场 2026 年 $11.8B，2035 年达 $45B
        - 支撑市场增长判断
        - 市场规模不能证明 Dash0 份额
      - - Grand View Research
        - APM 市场 2023 年 $7.52B，2030 年达 $19.62B
        - 独立交叉验证增长
        - 方法与数据年份不同
      - - Dimension Market Research 口径
        - 2026 年全球、美国和欧洲 APM 预测
        - 支撑区域需求
        - 预测页是市场层级，不针对公司
    notes: 清单覆盖抓取来源中可见的代表性公开公司、私有公司、定价页和分析师市场数据引用。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV030
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set is a representative sample of fetched public-company, competitor pricing/platform, and
        analyst-market-data evidence relevant to Dash0 valuation.
  - id: TV005
    title: 推翻论点与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 低于隐含溢价区间
        - ARR 明显低于支撑可信溢价倍数所需水平
        - 披露的 $1B 标记转为叙事驱动
        - 放弃，或要求大幅重定价
      - - NRR 或流失疲弱
        - NRR 低于高溢价基础设施软件预期，或核心客群 logo 流失
        - 客户证据不再指向持久增长
        - 从跟踪转为回避
      - - 利润率压力
        - 遥测服务成本或支持成本挤压毛利率
        - 用量计费质量下降
        - 下调倍数，并要求利润率计划
      - - Agent0 变现偏弱
        - 附加率低、积分使用少，或人工介入负担高
        - 智能体溢价削弱
        - 按普通可观测性厂商承销
      - - 安全 / AI 治理问题
        - 重大事故、审计控制薄弱，或生产动作未经审查
        - 企业信任和销售周期恶化
        - 视为推翻论点
      - - 现有厂商价格战
        - Datadog/Dynatrace/Grafana/New Relic 大幅降价或打包同类 AI 功能
        - 赢单率或 ASP 下滑
        - 下调估值区间
    notes: 触发因素是实务承销阈值；确切数值需要私有公司指标和投资人回报目标。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV024
      - CV025
      - CV026
      - CV033
      - CV034
      - CV041
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR / 增长
        - 当前 ARR、季度增长、管道转化、销售生产率
        - 判断 $1B 标记是否有收入支撑
        - 审阅资料室、董事会材料、CRM 导出和分群桥接
      - - 留存
        - NRR、GRR、流失、扩张、客户 logo 分群
        - 验证客户耐久性和溢价倍数
        - 检查分群表和前 20 大客户续约
      - - 单位经济
        - 毛利率、遥测服务成本、支持成本、Agent0 积分毛利
        - 判断用量计费模型质量
        - 按产品和客户规模索取利润率
      - - 股权结构 / 条款
        - 稀释、优先权、期权池、按比例认购权、老股转让、债务
        - 决定投资人进入经济性
        - 审阅融资文件和清算顺位
      - - Agent0 采用
        - 附加率、积分使用、转化、审计日志、生产动作控制
        - 检验智能体溢价逻辑
        - 审阅产品分析、日志、客户演示和治理控制
      - - 风险证据
        - 安全报告、事故历史、AI 治理、Lumigo 集成里程碑
        - 守住企业级就绪度和下行情景
        - 索取 SOC 2、渗透测试、事故日志和集成仪表盘
    notes: 尽调问题按最可能改变推荐、估值立场和信心的变量排序。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
