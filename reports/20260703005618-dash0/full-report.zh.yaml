  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              年轻基础设施公司的定位常常含混，Dash0 的公开定位却很清楚：它销售一个 OpenTelemetry 原生可观测性平台，把日志、指标、链路追踪、仪表盘、告警、服务地图和 AI SRE Agent
              收进同一款商业产品。公司材料称，产品面向开发者、SRE 和平台工程师，他们需要开放标准里的遥测，而不是专有 Agent 和不可预测的打包方式。这个点会影响后续尽调：Dash0
              不只是再做一层仪表盘；它的差异化在于数据模型从 OpenTelemetry 出发，再用 Agent0 把遥测转成排查和动作。当前融资材料显示，公司 2023
              年创立于德国、总部位于纽约；公开形象是私营且信息未完全披露：资本和客户指标可查，但收入、毛利、准确员工数和客户集中度没有公开。因此，后续投资判断应把本章当作事实主干：身份、融资、估值和客户数是公开事实，财务质量和治理深度必须先用管理层材料直接验证，再拿来支撑估值工作。
