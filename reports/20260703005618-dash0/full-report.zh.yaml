      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是多角色的。开发者和 SRE 直接承受事故响应和调试痛点；平台工程负责 OpenTelemetry collector、标准和内部开发者体验；DevOps
              和云基础设施负责人关心正常运行时间、复杂度和遥测成本；当可观测性账单变得不可预测时，财务或工程领导批准预算。Dash0
              的无按席位计费、消费定价、免费试用和全功能打包，正对买方对碎片化模块和隐藏收费的不满。采用很可能从一个痛苦服务、嘈杂的遥测管线或既有厂商成本复盘开始；如果 OpenTelemetry 迁移降低锁定、Agent0
              提高问题解决速度，再继续扩张。大企业是最干净的初始目标，因为市场研究显示它们主导 APM 支出；但 SME 仍有相关性，因为云 APM
              和自助定价降低了实施摩擦。采用路径仍需谨慎验证：切换不只是采购决定，更是遥测架构迁移。因此，客户引用也应按买方角色抽样，因为一次成功的 SRE 试点并不能自动证明财务主导的成本治理或全企业标准化。
