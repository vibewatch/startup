  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 受限数据
        - 客户遥测包含被禁止的敏感数据
        - 任何重大事件或反复出现的审计例外
        - 暂停投资，或要求整改契约
      - - AI 输出 / 自主动作
        - Agent0 动作未经过适当客户审查即执行
        - 未审查的生产变更，或重大错误补救
        - 将风险评级上调至高，并要求治理控制
      - - 安全态势
        - SOC 2 / ISO 证据、VDP 响应或加密 / 访问声明变弱
        - 报告过期、关键漏洞未解决或发生数据泄露
        - 视为企业客户投资逻辑破裂
      - - 竞争性定价
        - 老牌厂商打折，或追平透明定价与 AI 功能
        - 赢单率下滑或毛利率压力出现
        - 下调估值倍数并监控流失
      - - 客户持久性
        - NRR、流失或集中度不达预期
        - NRR 低于优质 SaaS 预期，或头部客户出现冲击
        - 除非价格重置，否则从跟踪转为规避
      - - 执行范围
        - Agent0、美国 GTM 或 Lumigo 里程碑明显延误
        - 连续两个季度错过路线图里程碑
        - 降低信心，并要求预算 / 招聘证据
    notes: 否决标准把公开风险证据转成尽调触发项；阈值需要私有客户、安全和财务数据才能精确校准。
    claimRefs:
      - CR005
      - CR008
      - CR010
      - CR016
      - CR020
      - CR021
      - CR027
      - CR028
      - CR039
      - CR040
      - CR041
      - CR042
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 跟踪 / 继续研究
        - 当前融资和客户信号强，但缺少私有财务数据
        - 只有能进资料室且价格纪律足够时才推进
      - - 信心
        - 中低
        - 关键估值输入仍是私有数据
        - 不要包装成已完整承销的买入
      - - 风险评级
        - 中高
        - AI 治理、竞争和披露缺口仍然关键
        - 要求下行保护或按里程碑进入
      - - 估值立场
        - 合理到偏高
        - 据报 $1B 标记可信，但 ARR 支撑未知
        - 只有确认优质 ARR 和留存后才有吸引力
      - - 核心摇摆因素
        - 当前 ARR 和 NRR
        - 收入质量会大幅改变倍数测算
        - 只有私有指标强劲时才上调
    notes: 这张表是基于公开证据得出的投资结论；不是已定价的投资意向书模型。
    claimRefs:
      - CV001
      - CV005
      - CV008
