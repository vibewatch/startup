        title: 领导层、治理与创始人匹配度
        blocks:
          - type: paragraph
            body: >-
              创始人-市场匹配信号强。Dash0 的公开团队页列出 Mirko Novakovic 担任 CEO、Ben Blackmore 担任 CTO，以及创始工程师 Miel Donkers、Marcel Birkner
              和 Michele Mancioppi；种子轮和 Series A 材料则把 Novakovic 与 Instana 联系起来，Instana 是 2020 年被 IBM 收购的可观测性公司。这段经历与
              Dash0 所在品类直接相关：团队在攻同一类运营遥测痛点，只是切入点变成标准优先和 AI 原生。治理能见度更弱。Series B 公告称 Balderton 合伙人 Rana Yared 加入董事会，但
              Dash0 未公布当前董事会名单、委员会结构、CFO/COO
              梯队或观察员权利图谱。合理结论是创始人驱动能力强，同时需要做关键人物和治理披露尽调，而不是断言治理薄弱。这样拆开，也能避免后续章节把“没有证据”转换成负面结论；公开记录对创始人-市场匹配很强，对机构化治理细节则不完整。
