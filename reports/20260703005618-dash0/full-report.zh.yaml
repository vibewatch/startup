      - number: '2.2'
        title: 规模测算口径与证据约束下的 SAM / SOM
        blocks:
          - type: paragraph
            body: >-
              规模证据很有吸引力，但并不一致，因为各来源使用的边界不同。Grand View 较窄的 APM 口径从 2023 年的 $7.52B 起步，到 2030 年达到 $19.62B，CAGR 为
              15.1%。Dimension 的 APM 口径更激进，预计 2026 年为 $11.8B，2035 年达到 $45.0B，CAGR 为 16.1%。Dash0 自己的自下而上可观测性估算更宽：2024 年约
              $12B，年增长约 20%；如果可观测性支出接近云基础设施支出的 15-20%，潜在空间还会大得多。投资判断不应机械平均这些数字。保守的近端低位口径是 2026 年 APM $11.8B；从 Dash0 的
              2024 年 $12B 估算滚动得出的更宽可观测性口径约为 2026 年 $17.3B；中期 APM 锚点则是 2030 年 $19.62B。公开证据无法拆出 Dash0 的 SAM 或 SOM，因此还需要实际
              pipeline、ACV、付费客户结构和留存数据。尽调立场应并行保留两个模型：一个用公开市场规模区间判断品类吸引力，另一个用自下而上的账户模型判断 Dash0 实际能赢下什么。
