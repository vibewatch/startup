              $155M，并得到独立科技媒体印证。业务进展同步加速：公司称 Series A 时客户超过 270 个，到 Series B 时付费客户超过 600 个。公开证据包括 The
              Telegraph、Zalando、Bonhams、Understory 和 Digibee 的案例研究，以及此前提到的 catchHR、ChargeTrip 和 Porsche
              Digital。这些证据支持真实采用，但没有披露客户数背后的 ARR、留存、logo 集中度或付费 / 免费混合结构。
