              1.3、AES-256、RBAC、SSO/SAML、MFA、审计日志，以及欧盟 / 美国数据驻留。DPA 和隐私材料支持存在合同化数据处理控制。不过，同一批公开材料称 HIPAA 和 PCI DSS 将在
              2026
              年上线；条款也把责任放在客户身上，要求除非单独订单或书面协议授权，否则不得放入受限数据。由于可观测性数据可能包含日志、链路追踪、凭据、个人数据和业务事件，投资者在把信任故事视为充分去风险之前，应测试脱敏、保留、事故历史、状态页证据，以及
