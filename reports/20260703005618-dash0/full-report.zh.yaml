      - number: '8.2'
        title: 市场、可比公司与竞争
        blocks:
          - type: paragraph
            body: >-
              这个赛道支撑 VC 兴趣。Research and Markets、Grand View Research 和 Dimension Market Research 都认为，APM
              市场在增长，动力来自云原生架构、AI、微服务、混合环境和告警疲劳。这支撑 Dash0 的叙事，但不消除可比风险。最相关的可比证据不是某个单一倍数，而是倍数分化。Datadog
              的申报文件显示，一个规模化上市既有厂商已有数十亿美元收入、高增长、自由现金流，以及数百个 ARR 超百万美元客户。Dynatrace 也在主打智能体 AI 和广义可观测性。Grafana、New
              Relic、Honeycomb、SigNoz、Chronosphere、Coralogix 和 Elastic 说明，买方可以比较大量平台、开源和定价替代方案。Dash0 的透明定价和
              OpenTelemetry-native
              叙事有机会赢，但估值需要压入既有厂商反击和倍数压缩的敏感性，不能假定它自然享受无争议溢价。因此，正确的可比方法是把市场增长、上市既有厂商强度和定价压力三角校准，而不是套用某个单一标称倍数。Dash0
              自己的替代方案页面也说明，公司直接对标既有可观测性品牌，所以竞争证明必须拿出赢单 / 输单证据，不能只做赛道比较。
