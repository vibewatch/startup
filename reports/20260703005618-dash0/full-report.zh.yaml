companyProfile:
  summary: >-
    Dash0 是一家有风投支持的可观测性软件公司，2023 年创立于德国，现在公开资料显示总部位于纽约。平台围绕 OpenTelemetry 原生日志、指标、链路追踪、仪表盘、告警、服务地图，以及较新的 Agent0
    工作流层构建，用于自主排查和修复。公司从 2024 年底种子轮快速推进到 2026 年 3 月以独角兽估值完成 Series B 轮，公开业务进展声称拥有 600 多个付费客户，具名客户包括 Zalando、Taco Bell 和
    The Telegraph。
