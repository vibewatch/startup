  figureRefs:
  - FE002
  - FE003
- id: deployment-roadmap
  title: Deployment, integrations, and roadmap maturity
  body: 'Deployment evidence is strongest in Kubernetes and Vercel paths. Dash0 documents one-click integration concepts, OpenTelemetry collector configuration, a Kubernetes operator, APIs, CLI tooling, Terraform provider support, and a Vercel Marketplace integration that handles log drains and OpenTelemetry environment variables. Agent0 is the newest and most strategic surface: the site now describes an assistant that connects telemetry and repositories, investigates incidents, and drafts pull requests. Launch and general-availability posts make Agent0 more than vaporware, while the Lumigo acquisition points to serverless ambitions. The main product-risk interpretation is maturity segmentation: core telemetry exploration, dashboards, alerting, and Kubernetes onboarding look more mature than advanced AI remediation, serverless coverage, and deep enterprise feature parity.'
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE031
  - CE038
  - CE041
