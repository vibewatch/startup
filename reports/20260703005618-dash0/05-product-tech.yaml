  figureRefs: []
- id: differentiation-and-gaps
  title: Differentiation, customer technical proof, and gaps
  body: 'Dash0’s differentiation is a bundle: standards-native instrumentation, transparent telemetry-based pricing, Perses dashboard portability, PromQL reuse, resource-centric UX, and AI-assisted triage. Porsche Digital provides unusually useful technical proof because it names four adopted teams, Kubernetes backend use, more than 50 services, and roughly 40% savings. G2 reviews and other customer quotes corroborate developer experience and fast setup, but they also reveal the adverse side of the product story: missing trace sampling or SRE patterns, limited value-added services, smaller ecosystem depth, and learning curves for dashboard users coming from Grafana. For diligence, the key question is not whether the product exists; it is whether Dash0 can close feature gaps quickly while preserving the simplicity and cost control that make early adopters switch. Those gaps define the private demo agenda.'
  claimRefs:
  - CE024
  - CE028
  - CE029
  - CE030
  - CE032
  - CE034
  - CE035
  - CE039
  tableRefs: []
  figureRefs:
  - FE004
- id: trust-security-and-quality
  title: Trust, security, privacy, and quality controls
  body: The trust surface is adequate for many software buyers but still has enterprise diligence work. Dash0 publicly states SOC 2 Type II, GDPR, ISO 27001, TLS 1.3, AES-256, RBAC, SSO/SAML, MFA, audit logs, and EU/US data residency. The DPA and privacy materials support the presence of contractual data-processing controls. However, the same public materials say HIPAA and PCI DSS are coming in 2026, and the terms put responsibility on customers to keep restricted data out unless a separate order or written agreement authorizes it. Because observability data can include logs, traces, credentials, personal data, and business events, investors should test redaction, retention, incident history, status-page evidence, and controls for AI-assisted code access before treating the trust story as fully de-risked.
  claimRefs:
  - CE023
  - CE025
  - CE026
  - CE027
  - CE040
  tableRefs:
  - TE004
  figureRefs: []
