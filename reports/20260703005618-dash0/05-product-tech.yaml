chapter:
  number: 5
  title: Product & Technology
  summary: 'Dash0 is a real, standards-native observability platform with a broad public product surface across logs, metrics, traces, dashboards, alerting, integrations, and Agent0. The diligence focus is maturity segmentation: core OpenTelemetry workflows and Kubernetes onboarding are best evidenced, while AI remediation, independent scale benchmarks, and regulated-workload controls need private validation.'
sections:
- id: product-scope
  title: Product scope and workflow fit
  body: 'Dash0 sells a developer- and SRE-facing observability platform rather than a single APM widget. The public product surface is framed around OpenTelemetry-native ingestion of metrics, logs, traces, resources, dashboards, alerts, website monitoring, synthetic monitoring, and Agent0. In customer workflow terms, the job is to replace tool switching during incidents with one resource-centric place to search telemetry, follow traces, inspect related logs and metrics, create alerts, and hand off fixes. The strongest product evidence is official and technical: the docs name the modules and developer tools, while the product pages explain how the workflow moves from instrumentation to triage and configuration-as-code. The underwriting caveat is that much of the workflow evidence remains company-authored, with customer stories and reviews corroborating ease of use but not all scale limits. This makes the product legible as a workflow system, not merely a storage backend.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE006
  - CE007
  - CE036
  - CE037
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-dependencies
  title: Architecture, standards, and implementation dependencies
  body: 'The architecture thesis is unusually concrete for a private observability vendor because Dash0 leans on named open standards. OTLP, OpenTelemetry, PromQL, and Perses anchor ingestion, querying, alert portability, and dashboard portability. The Service Map and tracing pages describe resource-centric correlation across services, spans, logs, metrics, alerts, cloud context, and Kubernetes context. That is differentiated against proprietary-agent models, but it also creates a diligence dependency: Dash0’s product quality is tied to the maturity of OpenTelemetry instrumentation, collector pipelines, semantic conventions, and customer ability to maintain those pipelines. Public developer-signal exists through Dash0’s GitHub organization, otelbin, and a Vercel demo repository, which supports implementation credibility but does not by itself prove enterprise-scale reliability.'
  claimRefs:
  - CE004
  - CE005
  - CE008
  - CE010
  - CE011
  - CE020
  - CE021
  - CE022
  - CE033
  tableRefs:
