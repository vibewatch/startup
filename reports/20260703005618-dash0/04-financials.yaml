  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - ARR / revenue run-rate
    - Cannot calculate revenue multiple or quality of $1B valuation
    - Request monthly ARR bridge, bookings, revenue recognition policy, and deferred revenue
  - - Gross margin and COGS
    - Cannot assess telemetry and AI-agent scalability
    - Request cloud COGS by signal, storage tier, query load, AI token/tool costs, support allocation
  - - NRR / GRR / churn
    - Cannot prove usage expansion offsets churn
    - Request cohort retention by start month, customer size, product stream, and geography
  - - CAC payback and sales-cycle
    - Cannot underwrite US GTM expansion efficiency
    - Request pipeline, win/loss, marketplace conversion, sales headcount productivity, and payback
  - - Burn, cash, runway, debt
    - Cannot assess financing dependency after Series B
    - Request bank cash, monthly burn, hiring plan, commitments, debt, and runway sensitivity
  - - Customer concentration
    - Cannot assess revenue durability from more than 600 customers alone
    - Request top-10 customer share, ACV distribution, renewal dates, and logo churn
  notes: This table is intentionally gap-heavy because public sources do not disclose private financial statements or cohort metrics.
