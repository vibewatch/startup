- id: traction-and-go-to-market-proxies
  title: Traction and go-to-market proxies
  body: 'The strongest public traction data is customer count and customer ROI, not revenue. Dash0 disclosed more than 600 paying customers in its Series B announcement and named recognizable customers including Zalando, Taco Bell, and The Telegraph. Customer stories give concrete value signals: Bonhams cites 50% observability cost reduction, Digibee says Dash0 was one third of Datadog''s cost while expanding APM coverage, Understory cites a four-to-five-day investigation becoming a one-day fix, and The Telegraph describes unified visibility and 100% website traffic capture. These stories support willingness to pay, but they are company-published and cannot replace cohort retention or expansion data. Marketplace procurement is likewise only a proxy. It can reduce friction and let buyers use committed cloud spend, but without conversion rates, sales-cycle duration, win rates, and channel fees, it cannot prove CAC efficiency. The right interpretation is positive top-of-funnel evidence plus
    unresolved sales-productivity diligence.'
  claimRefs:
  - CI011
  - CI012
  - CI017
  - CI018
  - CI019
  - CI020
