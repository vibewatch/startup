- id: unit-economics-and-public-comps
  title: Unit economics and public comp pressure
  body: 'Dash0''s unit economics remain mostly private. Gross margin should be driven by telemetry ingest, retained storage, query compute, AI-agent costs, support, and cloud infrastructure efficiency, but none of those inputs are disclosed. Datadog provides the clearest public bar: $3.43 billion of 2025 revenue, 28% growth, $1.05 billion of operating cash flow, $915 million of free cash flow, $4.47 billion of cash and marketable securities, and 603 customers above $1 million ARR. That contrast is adverse for underwriting because Dash0 has strong funding and customer proof but not public ARR, NRR, gross margin, CAC payback, burn, or runway. The comparison is not meant to imply Dash0 should look like Datadog today. It sets the economic destination for a scaled observability company: durable growth, high cash conversion, large enterprise expansion, and enough balance-sheet strength to keep investing through pricing pressure.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI031
  - CI036
  - CI040
  - CI041
  - CI045
  - CI053
  tableRefs:
  - TI004
  figureRefs:
  - FI003
- id: capital-adequacy-and-financial-verdict
  title: Capital adequacy and financial verdict
  body: 'The March 2026 Series B is a meaningful capital adequacy signal: Dash0 announced $110 million of new capital, a $1 billion valuation, and $155 million total funding, with independent coverage from SiliconANGLE and TNW. The proceeds are earmarked for Agent0, engineering roadmap work, US go-to-market expansion, and targeted acquisitions. However, capital adequacy cannot be fully underwritten because cash on hand, monthly burn, runway months, and debt obligations are not public. The investable public thesis is revenue quality potential from usage pricing plus ROI proof; the blocker is that no complete financial model is supportable until private metrics are obtained. Investors should therefore model at least two cases: a strong case where Series B capital funds efficient ARR expansion and Agent0 attach, and a downside case where GTM spend rises before retention, margins, and AI economics are proven. Only private data can choose between those cases. The remaining financial evidence
    should be converted into a data-room request list rather than padded with estimates, because fabricated ARR or burn would be more misleading than an explicit gap.'
