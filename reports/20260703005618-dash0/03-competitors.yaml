- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'Dash0''s moat should be underwritten as an execution race, not as a static feature moat. OpenTelemetry-native positioning reduces lock-in for customers, yet OpenTelemetry itself is an independent standard and competitors also claim OpenTelemetry or Prometheus compatibility. Agent0 is strategically relevant, but Datadog, Dynatrace, Splunk, and Elastic all publish AI or agentic observability claims. Public customer and review evidence is promising, but G2 also surfaces maturity concerns: missing expected features such as trace sampling and SRE patterns, early-stage fit gaps, and dashboard learning-curve comments. The risk register therefore treats pricing transparency and portability as real wedges while preserving diligence asks around enterprise breadth, roadmap delivery, and procurement trust. For now, the moat is most credible when the buyer is actively escaping an incumbent cost curve and already accepts OpenTelemetry instrumentation. It is least proven when the buyer requires
    broad enterprise governance, mature feature parity, or a procurement-safe incumbent bundle.'
