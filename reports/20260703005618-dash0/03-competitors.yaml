chapter:
  number: 3
  title: Competitors
  summary: Dash0 competes in a crowded observability market where transparent usage pricing and OpenTelemetry-native portability are real wedges, but incumbents retain scale, breadth, and increasingly similar AI messaging. The underwriting question is whether Dash0 can convert cost and portability into displacement before Datadog, Dynatrace, Grafana, Splunk, Elastic, and open-source-adjacent alternatives neutralize the wedge.
sections:
- id: landscape-and-substitutes
  title: Landscape and alternatives
  body: 'Dash0 is not fighting a narrow point-solution market. The fetched evidence supports a landscape that includes full-suite observability incumbents, OpenTelemetry-native challengers, usage-based developer tools, and status-quo internal stacks. Direct incumbent displacement means Datadog, Dynatrace, New Relic, Splunk, and Elastic; developer-led substitution includes Grafana Cloud, Honeycomb, SigNoz, Chronosphere, Coralogix, Better Stack, and self-managed OpenTelemetry or Prometheus-based pipelines. The practical buyer choice is therefore not simply whether Dash0 has logs, metrics, and traces; it is whether its OpenTelemetry-native product, no-seat pricing, marketplace access, and Agent0 workflows lower switching friction enough to displace tools with broader proof, richer enterprise procurement muscle, and deeper module catalogs. This framing also prevents over-crediting vendor-authored comparison pages: they are useful for identifying named rivals, but the table keeps independent
    and competitor evidence separate from Dash0 positioning so the reader can see which claims are proven and which remain buyer diligence items. The source set is intentionally diverse across official, filing, review, market-data, and technical documentation evidence so the competitive conclusion does not depend on a single vendor narrative or one generic comparison page. This matters. The conclusion remains evidence bounded and buyer specific.'
  claimRefs:
