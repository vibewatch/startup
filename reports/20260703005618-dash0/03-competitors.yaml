- id: pricing-packaging-and-procurement
  title: Pricing, packaging, and procurement pressure
  body: 'Dash0''s pricing wedge is unusually crisp: telemetry consumption, no per-seat fees, no base platform charge, no hidden fees, a 14-day unlimited trial, 13-month metric retention, 30-day logs/spans retention, Agent0 credits at $0.60, and marketplace availability across AWS, GCP, Azure, and Vercel. That is a powerful buying argument against products with platform fees, enterprise commitments, host pricing, or multiple SKU meters. The caveat is that peers also compete aggressively on cost language: Grafana has a free tier and $19/month plus usage Pro plan, SigNoz starts at $49/month, Coralogix includes unlimited users and hosts, Chronosphere sells cost-control, and Splunk claims predictable host-based pricing. The underwriting work is therefore workload normalization, not headline price comparison. A fair test needs the same event volume, retention period, user population, incident workflow, AI usage, marketplace fee treatment, and committed-spend assumptions across every vendor quote.'
