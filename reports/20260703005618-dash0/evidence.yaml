    whyItMatters: Averaging inconsistent estimates would overstate precision and could mislead valuation work.
    diligencePath: Build a bottoms-up account model and reconcile it to one selected market definition before valuation.
    relatedQuestionRefs:
      - QM006
      - QM023
    relatedTableRefs:
      - TM002
