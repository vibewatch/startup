evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: ARR, revenue run rate, gross margin, burn, runway, NRR, and GRR are not public.
    whyItMatters: >-
      These metrics determine whether the $1B valuation is supported by durable SaaS economics or only by customer-count
      momentum.
    diligencePath: Request management KPI pack, board materials, audited/unaudited financials, and cohort retention schedules.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count by function and geography is not publicly disclosed in fetched sources.
    whyItMatters: Headcount mix is needed to evaluate product velocity, GTM efficiency, and burn after the Series B.
    diligencePath: Request current HRIS export or investor headcount schedule by function, geography, and start date.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full board roster, committees, observer rights, and executive operating bench are not published.
    whyItMatters: Governance depth matters for a founder-led infrastructure company raising at unicorn valuation.
    diligencePath: Request cap table, board deck, investor rights agreement, and current executive org chart.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholders
    missingEvidence: >-
      Investor and stakeholder map excludes undisclosed angels, employees, option holders, commercial contracts, and
      non-public customers.
    whyItMatters: The public map is sufficient for narrative but not for control, ownership, or concentration diligence.
    diligencePath: Reconcile public investor list to the financing documents and customer contract register.
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Dash0-specific SAM, SOM, ACV mix, pipeline conversion, and market-share data are not public.
    whyItMatters: Market size alone cannot support valuation without proof that Dash0 can capture a measurable wedge.
    diligencePath: Request pipeline export, ARR by segment, ACV distribution, win/loss analysis, and expansion cohorts.
