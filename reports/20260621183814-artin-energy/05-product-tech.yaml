- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Site control and interconnection
    - Creates the physical basis for each project
    - Land rights, transmission queues, permitting
    - Development delays can stall the whole platform
  - - Solar PV generation block
    - Supplies low-cost electricity
    - Modules, inverters, EPC, irradiance
    - Commodity supply, curtailment, and performance variance
  - - Battery storage block
    - Adds dispatchability and grid services
    - Cells, PCS, EMS, safety controls
    - Thermal, fire, and dispatch-control risk
  - - Electrolysis and hydrogen handling
    - Converts power into hydrogen molecules
    - Electrolyzers, water, compression, storage
    - Utilization and cost risk remain high
  - - E-methanol synthesis
    - Combines hydrogen with carbon source for fuel output
    - CO2 source, reactors, storage, logistics
    - Adds feedstock and downstream offtake complexity
  - - Commercial and finance layer
    - Binds counterparties, contracts, and capital
    - Offtakers, lenders, tax-credit monetization
    - Opaque counterparties can break bankability
  notes: This is an inferred operating architecture built from public market evidence and company solution descriptions, not a disclosed ArtIn engineering diagram.
