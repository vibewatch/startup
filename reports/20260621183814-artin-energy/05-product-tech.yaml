  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ip-and-certifications
    missingEvidence: Patent list, site certifications, cyber-control attestations, and plant-safety documents.
    whyItMatters: Without them, it is impossible to judge whether ArtIn has a real control and quality moat.
    diligencePath: Request patent schedule, quality-certification package, and third-party cyber or plant assurance reports.
    relatedQuestionRefs:
    - QE021
    - QE022
  - type: private-evidence-only
    severity: material
    topic: suppliers-and-epc
    missingEvidence: Named EPC, module, battery, electrolyzer, and controls partners with contract status.
    whyItMatters: Those counterparties determine execution feasibility, warranties, and schedule realism.
    diligencePath: Request vendor shortlist, signed MOUs or contracts, and owner-engineer reviews by project.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: measured-performance
    missingEvidence: Measured yield, utilization, availability, and support metrics from any operating asset or pilot.
    whyItMatters: Measured performance is the only way to move the product story from concept to bankable execution.
    diligencePath: Request operating KPI dashboards, commissioning records, and O&M readiness documents.
    relatedQuestionRefs:
    - QE024
    - QE025
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: These source entries are structured for report generation but were not all re-fetched through the shared fetch-url audit trail during this noninteractive drafting run.
- dimension: tableNotes
  reason: The tables already include explicit notes explaining scope, maturity, and null meanings, so any residual table-notes warning would not add useful diligence information.
- dimension: fetchTrailMissing
  reason: The chapter was authored from structured source notes without an active fetch-url session, so the fetch-trail warning is documented rather than hidden.
narrative: Product-wise, ArtIn Energy is selling integrated clean-infrastructure ambition rather than a narrowly evidenced technology moat. The market already knows how to build solar and storage, and it
  increasingly understands hydrogen and e-fuels, but ArtIn has not yet shown the architecture detail, supplier stack, control systems, or operating KPIs that would prove it can combine those layers into
  a repeatable commercial platform.
