callouts:
- calloutType: insight
  title: Breadth is not the same as technical moat
  body: ArtIn's cross-vector product breadth is strategically interesting, but the public record still does not show whether the company owns a repeatable engineering method, supplier advantage, or operating-control
    layer that turns breadth into defensible execution.
  claimRefs:
  - CE001
  - CE017
  - CE021
- calloutType: risk
  title: Proof threshold remains operational
  body: The next real technology milestone is not a broader product claim; it is visible evidence that one flagship asset can be built, controlled, and operated at commercial scale with documented performance
    and safety controls.
  claimRefs:
  - CE024
  - CE028
  - CE035
