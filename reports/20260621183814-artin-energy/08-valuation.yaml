- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - NextEra Energy and major public renewable developers
    - Market value with operating asset base
    - Large public operating scale
    - Shows what proven asset cash flow can command
    - Not a direct comp for a private pre-operational platform
  - - Public hydrogen and transition names
    - Market value with public disclosure
    - Often volatile and sentiment-sensitive
    - Highlights how early-stage energy-transition narratives are repriced publicly
    - Many are technology or OEM names, not project developers
  - - Private infrastructure development logic
    - Milestone-based value creation
    - Depends on asset de-risking stage
    - Most relevant framework for ArtIn's stage
    - Private marks are often opaque and deal-specific
  - - Probability-weighted project option value
    - Value assigned before cash flow exists
    - Usually below fully de-risked infrastructure value
    - Best fit when contracts and permits are incomplete
    - Requires assumptions the public record cannot fully support
  - - Headline implied ArtIn mark
    - 2026 company-linked valuation
    - $14.58B implied
    - Sets current reference price
    - Public evidence does not yet support it
  notes: This is an enumeration of frameworks and benchmark classes rather than a
    false-precision multiple set, because ArtIn lacks the disclosures needed for tight
    comparable math.
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant public and conceptual benchmark classes for a
      private, pre-operational clean-infrastructure platform with a headline valuation
      claim.
