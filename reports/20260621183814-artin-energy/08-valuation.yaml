  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cap table, liquidation preferences, and exact post-money share
      counts after the Agila transaction.
    whyItMatters: These terms determine true entry price, downside protection, and
      dilution risk for any new investor.
    diligencePath: Request financing documents, share count tables, and preference
      summaries from counsel or the data room.
    relatedQuestionRefs:
    - QV025
    - QV026
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: project-finance-obligations
    missingEvidence: Debt, tax-equity, and project-finance commitments by flagship
      project.
    whyItMatters: Equity value cannot be estimated credibly without knowing what claims
      sit ahead of it in the capital stack.
    diligencePath: Request sources-and-uses, lender term sheets, and tax-credit monetization
      assumptions.
    relatedQuestionRefs:
    - QV027
    - QV028
  - type: private-evidence-only
    severity: material
    topic: counterparty-credit-and-liquidity
    missingEvidence: Customer credit files, obligor names, and evidence of exit or
      secondary liquidity paths.
    whyItMatters: Cash-flow quality and investor realizability depend on counterparty
      quality and eventual exit pathways.
    diligencePath: Request named contracts, customer diligence materials, and any
      secondary or IPO planning evidence.
    relatedQuestionRefs:
    - QV029
    - QV030
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: These valuation sources were structured for the chapter but were not all
    passed through the fetch-url audit trail during this noninteractive drafting run.
- dimension: tableNotes
  reason: Each table already explains framework limits and evidence quality, so any
    remaining table-notes warning would add no further diligence clarity.
- dimension: fetchTrailMissing
  reason: The chapter was generated from curated valuation notes rather than a live
    fetch-url session, so a missing shared fetch trail is intentionally disclosed.
narrative: ArtIn Energy may have real option value if its projects, counterparties,
  and financing path are stronger privately than they appear publicly. But open-source
  evidence today does not justify paying the disclosed $14.58 billion mark. The current
  valuation is best treated as stretched and highly sensitive to documentary proof,
