- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Counterparties remain opaque, financing drags, and no flagship asset commissions
      soon
    - Supportable value closer to early-stage development option value
    - Down-round, delays, or claim retrenchment
    - Meaningful given current public opacity
  - - Base
    - Some project and counterparty proof emerges but operating cash flow is still
      not visible
    - Value could sit materially below the disclosed mark but above pure option value
    - Execution, financing, and concentration still dominate
    - Most supportable from current public evidence
  - - Bull
    - Named offtakers, funded milestones, permits, and one or more flagship assets
      de-risk quickly
    - Platform could justify materially higher value than a normal early-stage developer
    - Hydrogen and scale claims must prove real
    - Requires evidence not yet public
  - - Market-upside overlay
    - Sector demand and tax-credit support remain favorable
    - Helps the upside case but does not replace company-specific proof
    - Macro rate and policy shifts remain relevant
    - Secondary signal only
  - - Governance-reset overlay
    - If gaps remain open, the mark may be re-rated on trust rather than on asset
      economics
    - Could drive sharper downside than ordinary execution misses
    - Opacity and narrative dependence
    - Non-trivial
  notes: Scenarios are evidence-weighted rather than management-guidance-weighted
    because public financial and customer data remain sparse.
