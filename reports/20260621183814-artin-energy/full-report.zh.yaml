            body: >-
              已披露信息指向极高资本强度。ArtIn 将当前融资叙事绑定到一个约 $1.4B 资本开支的 Texas 项目，以及一个约 $2.6B 资本开支的 Nebraska 项目。仅这两个项目就意味着约 $4.0B
              支出，远高于已宣布的 $255M 战略投资。如果声称的 $34B
              管线代表拟议项目总价值，那么今天可见已融资金额只覆盖营销口径资本需求的一小部分。这并不自动否定模型，因为基础设施开发商通常会叠加发起人股权、项目债、税务股权、设备融资和里程碑资本。但这意味着，故事要转化为运营现金流之前，ArtIn
              高度依赖贷款方尽调、交易对手质量、并网进展和项目可融资性。Agila 交易的公开描述也指向里程碑拨款和项目资产担保，这更接近结构化基础设施融资，而不是不受限制的成长股权。因此，财务问题是 ArtIn
              能否足够快地降低旗舰资产风险，从而撬动大得多的第三方资本池。因此，本章把披露缺失本身视为证据：缺少报表、交易对手和现金指标并非中性遗漏，而是核心风险因素；在管理层开放一手文件之前，任何估值或信用判断都只能保持暂定。
