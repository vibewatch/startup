        title: 运营与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              运营上，ArtIn 把成熟和不成熟技术放在同一个平台。太阳能和储能在商业上已经熟悉，但仍依赖队列时间、EPC 执行、熟练劳动力供给和安全运营控制。氢能和 e-methanol
              进一步提高复杂度，因为它们在本已资本密集的电力基础设施之上，又加入水、压缩、工艺安全、原料和利用率风险。公司没有公开披露足够的供应商、EPC
              合作方、安全系统、网络控制或工厂控制架构，无法降低这些担忧。合作伙伴风险同样高，因为商业故事依赖未具名投资级承购方、未具名氢能交易对手，以及看起来按里程碑释放资金的结构化融资伙伴。任何一个节点变弱，都可能传导为进度延误、融资缺口或估值压缩。公开证据也没有显示，一旦设备交付周期变化、电解槽经济性恶化或某个旗舰交易对手表现不及预期，公司有什么应急计划。实践中，投资者应把每一份缺失文件视为仍然活跃的风险放大器：当队列状态、许可范围、供应商义务或交易对手信用无法测试时，下行情景就应该比在披露更充分的平台中获得更高权重。
