        - 宏观利率和政策变化仍有关
        - 仅为次级信号
      - - 治理重置情景叠加
        - 若缺口持续存在，估值可能按信任而非资产经济性重估
        - 可能带来比普通执行失误更陡的下行
        - 不透明和叙事依赖
        - 不可忽视
    notes: 情景按证据加权，而不是按管理层指引加权，因为公开财务和客户数据仍稀疏。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV024
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - NextEra Energy 和大型上市可再生能源开发商
        - 拥有运营资产基础的市场价值
        - 大型上市运营规模
        - 显示已验证资产现金流能获得怎样的估值
        - 不是私有、运营前平台的直接可比对象
      - - 上市氢能和能源转型公司
        - 伴随公开披露的市场价值
        - 通常波动较大，且受情绪影响
        - 说明早期能源转型叙事在公开市场如何被重定价
        - 很多是技术或 OEM 公司，不是项目开发商
      - - 私募基础设施开发逻辑
        - 基于里程碑的价值创造
        - 取决于资产去风险阶段
        - 最适合 ArtIn 当前阶段的框架
        - 私募估值往往不透明，且高度取决于具体交易
      - - 概率加权项目期权价值
        - 现金流出现前赋予的价值
        - 通常低于完全去风险后的基础设施价值
        - 合同和许可尚未完备时最合适
        - 需要假设，公开记录无法充分支撑
      - - ArtIn 标题隐含估值
        - 2026 年公司相关估值
        - 隐含 $14.58B
        - 设定当前参考价
        - 公开证据尚不能支撑
    notes: 这里列举的是估值框架和基准类别，而不是给出带有伪精确感的倍数表；ArtIn 缺少足以做严密可比公司测算的披露。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public and conceptual benchmark classes for a private, pre-operational
        clean-infrastructure platform with a headline valuation claim.
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV017
      - CV022
  - id: TV005
    title: 论点失效和放弃触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 仍无具名交易对手
        - 尽调后仍没有核实到客户名称
        - 打断投资论点中的商业验证支柱
        - 放弃，或大幅压低定价
      - - 融资里程碑落空
        - 资金释放延后，或附带条件超过预期
        - 削弱偿付能力和执行假设
        - 假设会出现惩罚性稀释或建设放缓
      - - 没有旗舰项目运营验证
        - 预期时间内没有已投运资产出现
        - 无法从叙事价值切换到基础设施价值
        - 仍按期权价值看待公司
      - - 项目级文件与标题说法对不上
        - 资金来源与用途、许可或合同出现重大偏差
        - 损害信任和可融资性
        - 将披露估值视为缺乏支撑
      - - 行业宏观明显恶化
        - 利率、政策或电价走弱
        - 压缩所有资本密集型清洁基础设施估值
        - 提高折现率，下调情景区间
    notes: 这些触发器把定性的反方论点转成决策规则，可快速改变估值判断。
    claimRefs:
      - CV024
      - CV023
      - CV022
      - CV026
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 利润表、资产负债表、现金流
        - 用实际经济性检验估值必须依赖这些材料
        - 管理层、审计师和数据室请求
      - - 交易对手
        - 具名承购方，以及签有条款的氢气买方
        - 验证收入叙事必须依赖这些材料
        - 商业尽调和客户访谈
      - - 项目文件
        - 并网排队位置、许可、EPC、资金来源与用途
        - 准确定价去风险阶段必须依赖这些材料
        - 项目尽调和律师审阅
      - - 资本结构
        - 已到位资金、债务条款、优先权栈
        - 评估稀释和下行风险必须依赖这些材料
        - 财务尽调和法律文件审阅
      - - 运营验证
        - 调试、产量和 KPI 数据
        - 从期权价值转向基础设施价值必须依赖这些材料
        - 现场走访、业主工程师审阅和 KPI 包
    notes: 这些要求是最低文件集；拿到之后，分析才能从公开叙事转为有文件支撑的承销判断。
    claimRefs:
      - CV026
      - CV023
      - CV040
