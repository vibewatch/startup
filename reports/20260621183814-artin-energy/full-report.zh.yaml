              领导。投资采用里程碑拨款结构，配有董事会层面监督、已验证财务模型，以及项目资产上的担保包。此前融资历史未公开；Crunchbase（返回 403 访问拦截）或其他数据库中没有出现此前 VC 轮次、Series
