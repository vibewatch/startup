      - number: '3.3'
        title: 技术与市场定位
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy 的差异化来自其声称的纵向一体化平台，把太阳能、BESS、绿色氢能和 e-methanol
              组合在一起——如此宽的技术覆盖，少有开发商试图规模化推进。多数成熟开发商只聚焦一到两类技术：NextEra 聚焦风电和太阳能，Invenergy 聚焦风电 / 太阳能 / 储能，Cypress Creek
              只做太阳能。理论上，绿色氢能和 e-methanol 让 ArtIn 与众不同，因为少数美国开发商拥有规模化运营的绿色氢能设施。但缺少任何已证明技术能力，削弱了这种理论差异化。Plug Power、Air
              Products 和 Nel ASA 等公司在绿色氢能领域已建立地位，但主要是技术供应商，而不是按 ArtIn
              声称规模开展项目开发的公司。如果能够执行，把四类技术放在一个开发商平台内会形成独特市场位置；但执行完全未经证明，且声称的 $25.4B 氢能合同没有披露任何交易对手或项目细节。
