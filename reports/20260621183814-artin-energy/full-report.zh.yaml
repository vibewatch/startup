  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 这条逻辑显示，在已披露估值下，行业上行空间和融资新闻不敌收入、交易对手和运营资产证据缺口。
    data:
      nodes:
        - id: n1
          label: 巨大的可触达市场
          detail: 太阳能、储能、氢和 e-methanol 都是大型机会池。
        - id: n2
          label: 外部资本信号
          detail: $255M 的融资标题显示投资人有所参与。
        - id: n3
          label: 证据缺口
          detail: 公开信息没有收入、经审计财务、具名交易对手或运营资产。
        - id: n4
          label: 估值标记
          detail: $14.58B 的隐含估值，要求投资人在证据公开前先付钱。
        - id: n5
          label: 建议
          detail: 当前估值下回避；只有拿到数据室权限才继续研究。
