          detail: 承购或项目合同必须签署，并包含真实义务。
        - id: n4
          label: 建设和并网
          detail: 项目必须完成融资和建设。
        - id: n5
          label: 运营和续约
          detail: 只有到这一步，留存和扩张指标才会出现。
      edges:
