  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy 横跨三个不同但相互连接的可再生能源市场：公用事业级太阳能光伏发电、电池储能系统（BESS），以及绿色氢能 / e-methanol
              生产。公用事业级太阳能板块包括地面光伏电站，向电网和企业买家按长期 PPA 供电，不含住宅和小型商业屋顶装机。BESS
              板块覆盖电网级锂离子和其他电池装置，用于可再生能源移峰、调频和电网稳定服务。绿色氢能板块覆盖以可再生电力为原料、基于电解的制氢；e-methanol 是下游产品，由绿色氢气与捕集 CO2
              结合生成。相邻但不纳入的市场包括住宅太阳能、分布式发电、海上风电、核能，以及不含氢能的碳捕集。现状替代方案包括 BESS
              对应的天然气调峰电厂、绿色氢能对应的蒸汽甲烷重整灰氢，以及公用事业级太阳能对应的化石燃料基荷发电。e-methanol 市场——由绿色氢气和捕集二氧化碳合成——正在成为下游细分市场，尤其与
              International Maritime Organization 规则下的航运脱碳相关。每个板块都有不同买家画像、资本强度和监管依赖，都会影响开发时间表与风险。
            claimRefs:
              - CM001
              - CM012
              - CM016
