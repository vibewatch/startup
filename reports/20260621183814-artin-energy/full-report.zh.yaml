      - number: '2.3'
        title: 买家 / 用户 / 付款方分层
        blocks:
          - type: paragraph
            body: >-
              公用事业级可再生能源买家可分为几类：投资者持有的公用事业公司（最大板块，在受监管采购要求下采购）、管理电网可靠性的独立系统运营商、企业 PPA 买家（如 Microsoft、Google、Amazon
              等追求碳中和运营的科技巨头）、需要基荷电力的工业承购方，以及政府 / 军事设施。BESS
              买家包括需要调频的电网运营商、将储能与太阳能共址以提升可调度性的可再生能源开发商，以及管理峰值需求的公用事业公司。绿色氢能买家主要是工业用户（氨 /
              化肥生产、钢铁制造、石油炼制），再加上新兴的交通和发电应用。ArtIn Energy
              声称拥有投资级承购方，但没有披露其名称或类别。预算所有权通常由公用事业采购部门、企业可持续发展负责人或拥有数十年资本开支权限的工业厂长掌握。这类采购的预算权限通常涉及多年资本规划周期，超过 $100M
              的大型基础设施收购还需要董事会层面批准。
            claimRefs:
              - CM023
