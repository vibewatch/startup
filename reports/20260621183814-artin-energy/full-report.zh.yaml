  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              美国公用事业级可再生能源开发市场由少数大型开发商主导，这些公司拥有深厚运营记录。NextEra Energy Resources 以约 40 GW 已安装可再生能源容量领先，其后是 Constellation
              Energy 的 32.4 GW 和 Invenergy 的 13.8 GW。这些公司拥有数十年运营历史、数千名员工、公开审计财务报表，并在数百个项目上证明过执行能力。ArtIn Energy 声称拥有 $34B
              管线，试图把自己放进这一竞争场，但它没有确认的运营容量、没有公开财务报表，也没有出现在任何独立市场排名或行业数据库中。ArtIn
              与成熟开发商之间的竞争差距，在规模、记录和市场验证上相差几个数量级。因此，传统竞争分析——市场份额、赢单率、技术差异化——无法有意义地展开。
