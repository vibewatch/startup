  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              ArtIn
              所处的能源系统环节，每一步都受监管影响。公用事业级发电、储能、氢气处理、输电接入、与税收抵免挂钩的劳工标准，以及环境许可，都会引入可能实质性改变项目时间和经济性的条件。公司不透明进一步放大风险，因为公开记录没有显示具名许可、队列位置、项目公司备案或客户侧确认，无法收窄结果区间。FERC
              和 GAO 材料仍在描述并网拥堵和漫长项目淘汰周期；Treasury 指引把关键税收抵免价值绑定到合规要求；EPA 和其他环境框架塑造建设和工业运营义务。在这一背景下，ArtIn
              缺少可见公开备案记录，并不证明存在不当行为，但意味着外部投资者无法独立把公司主张与底层监管路径对齐。当前法律风险更多来自未知义务和不完整公开证据，而不是已知诉讼或执法行动。实践中，投资者应把每一份缺失文件视为仍然活跃的风险放大器：当队列状态、许可范围、供应商义务或交易对手信用无法测试时，下行情景就应该比在披露更充分的平台中获得更高权重。
