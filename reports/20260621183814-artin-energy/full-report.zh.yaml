  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 现有公开证据只能支撑很宽的估值区间，因为这个故事更像依赖里程碑兑现的期权价值，而不是已验证的基础设施现金流。
    approximationNotes: 区间是基于公开证据的护栏，单位为百万美元，不是管理层指引，也不是对内在价值精度的声称。
    data:
      items:
        - label: 熊市情景
          low: 250
          mid: 500
          high: 900
          detail: 如果交易对手和运营验证仍不透明，只能按早期期权价值看。
        - label: 基准情景
          low: 900
          mid: 1500
          high: 2500
          detail: 已有一些去风险和真实项目，但公开证据仍跟不上披露估值。
        - label: 牛市情景
          low: 2500
          mid: 4500
          high: 7000
          detail: 旗舰项目、具名承购方和已获资金支持的里程碑迅速证明真实进展。
        - label: 已披露隐含估值
          low: 14580
          mid: 14580
          high: 14580
          detail: 公司关联的 2026 年 3 月估值标题。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV001
      - CV008
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投资评分卡对市场机会的评分，高于估值支撑、证据质量和下行保护。
    approximationNotes: 评分是基于留存公开证据形成的尽调启发式判断，不是投资委员会产出。
    data:
      items:
        - label: 市场机会
          score: 7.5
          detail: 大型终端市场存在。
        - label: 商业验证
          score: 2
          detail: 客户、收入和运营验证仍然稀少。
        - label: 证据质量
          score: 1.5
          detail: 经审计且有交易对手背书的证据有限。
        - label: 估值支撑
          score: 1
          detail: 公开证据支撑不了披露估值。
        - label: 下行保护
          score: 1.5
          detail: 优先权结构、债务条款和资产价值在公开信息中不可见。
    claimRefs:
      - CV009
      - CV026
      - CV022
      - CV040
