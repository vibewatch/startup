  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: ArtIn Energy 声称交付什么
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy 的公开材料描述的是一个开发平台，而非单一窄产品公司。其产品覆盖公用事业级太阳能光伏项目、电网级电池储能、绿色氢气生产，以及作为下游合成燃料路径的
              e-methanol。放到客户工作流里，ArtIn 承诺的是发起场址、拼出并网和许可、锁定承购、为建设融资，并向机构或工业买家交付已签约清洁能源电量或清洁分子。因此，产品不是大众市场硬件
              SKU，而是一组项目开发能力、已签约资产交付和多技术集成能力。这个组合具备战略吸引力，因为它同时覆盖电子和分子；但证明门槛也更高，因为每一层的技术成熟度、供应链依赖和可融资性要求都不同。太阳能 PV
              和锂离子储能是成熟技术，绿色氢能和 e-methanol
              仍依赖低成本电力、电解槽经济性和下游采用。公开材料没有展示经验证的运营吞吐、工厂图纸、转化率或调度数据，无法证明执行深度，而只能看到平台宽度。尽调结论很直接：ArtIn
              也许描述了一个可信的多路径脱碳方案，但没有工厂层面运营细节、控制证据和供应商披露，技术故事仍是由外部推断出的架构，而不是经验证的架构。
            claimRefs:
