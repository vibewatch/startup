      - number: '3.2'
        title: 同业开发商对比
        blocks:
          - type: paragraph
            body: >-
              NextEra Energy Resources（NextEra Energy 子公司，NYSE: NEE）是美国可再生能源开发无可争议的市场领导者，市值超过
              $90B，业务覆盖几乎所有美国州。公司拥有纵向一体化模式，覆盖开发、建设和长期持有 / 运营。总部位于 Chicago 的 Invenergy 是美国最大的私人持有可再生能源开发商，在风电、太阳能和储能领域拥有
              13.8 GW。Constellation Energy（NYSE: CEG）聚焦核能和可再生发电，容量为 32.4 GW。Enel Green Power North America 在美国运营 12.5
              GW。Cypress Creek Renewables 专注公用事业级太阳能开发。这些竞争对手均有公开可验证的运营资产、具名客户关系和成熟融资记录。ArtIn Energy
              仍处于尚未产生收入、尚未开工状态，无法在任何运营指标上进行有意义比较。AES Corporation 通过 AES Clean Energy 部门运营约 3,600 MW 美国可再生能源容量，同时依靠包括火电和
              LNG 基础设施在内的全球多元业务维持 $10B 市值。
