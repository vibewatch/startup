            body: >-
              承销问题不在于可再生基础设施是否有价值，而在于 ArtIn 是否拿出了足够公司特定证据，来支撑当前估值标记和其中隐含的执行风险。行业层面的支撑确实存在：Section 48E
              可显著改善合格公用事业级资产的项目经济性，贷款方仍愿意支持已签约清洁能源项目，大型终端市场仍在扩张。但这些只是通用顺风，不是公司证据的替代品。ArtIn
              仍没有公开收入、没有单位经济桥、没有披露债务承诺、没有具名承购方定价条款，也没有经审计运营资产现金流。融资叙事还通过付费分发式渠道传播，单独看并不能有力证明财务质量。因此，最稳妥的财务结论是：ArtIn
              可能已经拼出一个开发叙事，但公开信息仍不足以按披露估值承销收入质量、利润率路径或资本充足性。眼前卡点是经审计报表、项目层面的资金来源与用途、具名交易对手，以及已拨付里程碑细节。因此，本章把披露缺失本身视为证据：缺少报表、交易对手和现金指标并非中性遗漏，而是核心风险因素；在管理层开放一手文件之前，任何估值或信用判断都只能保持暂定。
