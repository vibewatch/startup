              ArtIn Energy 由 CEO 兼创始人 Jhon Cohen 领导。他声称在可再生能源行业拥有 13 年国际经验，重点覆盖美洲和亚洲的太阳能与可持续技术。根据公司高管团队页面，Cohen 拥有
