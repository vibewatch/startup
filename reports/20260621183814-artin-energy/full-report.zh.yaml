          - type: callout
            title: 什么会让价格值得重新评估
            body: 重新评估需要具名交易对手、经审计财务、项目级资金来源与用途、已获资金支持的里程碑证明，以及至少一个可见运营资产；缺少这些，当前估值更像一个愿景式标题，而不是可防守的估值锚。
