      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动包括太阳能 LCOE 下降，使太阳能可与化石燃料竞争；联邦税收激励（Section 48E ITC 到 2032 年为公用事业级储能提供最高
              30%）；数据中心和电气化推高电力需求；以及州层面的可再生能源组合标准。美国预计在 2026 年新增 86 GW 公用事业级容量。但约束也很重：并网队列积压超过 2,000 GW，只有 10-19%
              项目最终投运；OBBBA 终止住宅税收抵免；利率上升推高项目融资成本；绿色氢能在没有补贴时仍面临经济性挑战。对 ArtIn 而言，Texas（ERCOT）的并网队列短于沿海
              ISO，但公司缺少运营记录，且声称规模过大，会给要求可融资性证据的贷款方和承购方增加采用门槛。
