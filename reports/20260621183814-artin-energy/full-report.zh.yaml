      - number: '3.4'
        title: 竞争壁垒与护城河
        blocks:
          - type: paragraph
            body: >-
              在公用事业级可再生能源开发中，竞争护城河来自土地控制（适合场址的长期租约）、并网队列位置（通常需要 3-5
              年拿到）、与有信用公用事业公司的成熟承购关系、通过成熟项目融资记录获得低成本资本，以及降低执行风险的运营经验。NextEra 靠数十年运营数据和客户关系建立了难以逾越的领先优势。Invenergy
              也通过数百个项目的持续执行建立了自身位置。ArtIn Energy 声称拥有部分壁垒——尤其是与投资级交易对手的长期承购协议和并网推进——但没有提供可验证证据。Agila
              的里程碑式投资带来董事会层面监督，但本身不构成竞争壁垒。没有具名承购方、确认的并网位置或运营记录，ArtIn
              尚未证明相对成熟开发商有任何可持续竞争优势。公司面临新基础设施开发商常见的鸡生蛋问题：需要证明可融资性才能吸引资本，又需要资本才能证明可融资性。
