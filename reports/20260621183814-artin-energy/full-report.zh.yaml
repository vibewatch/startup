      - number: '8.2'
        title: 可比参照与情景框架
        blocks:
          - type: paragraph
            body: >-
              ArtIn 既不是上市运营型公用事业公司，也不是风投支持的软件公司，任何可比分析都必须谨慎。最相关的参照是按里程碑推进的清洁基础设施开发逻辑、已有资产验证的上市可再生能源开发商，以及
              Damodaran、Stern、Lazard 和大型银行研究所强调的一般估值纪律。这些参照一致指向一个结论：收入、资产和交易对手越可观察，估值质量越高。ArtIn
              目前还没有向公众提供这些可观察项。因此，情景分析应落在宽区间，而不是追求单点精度。熊市情景下，公司公开证据可能只支持围绕早期开发项目和赞助式叙事的期权价值。基准情景下，融资信号、两个旗舰项目，以及交易对手真实但尚未披露的可能性，可以给一部分价值。牛市情景下，如果后续文件能证明风险已被逐步拆除，氢气合同、项目管线和一体化平台可能支撑高得多的价值。但即便是牛市情景，也取决于公司能否把宣传规模转成运营证明；公开层面目前还没看到这种转换。换句话说，估值争议的核心并不是乐观还是悲观，而是有多少证据能把宣传级叙事转成可承销的投资案例；就目前公开信息看，这个证据门槛仍远未满足。
