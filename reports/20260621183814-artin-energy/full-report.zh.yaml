  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买家分层与需求形态
        blocks:
          - type: paragraph
            body: >-
              对 ArtIn Energy
              最可信的客户判断，首先要看项目推进后谁会合理购买其产品：负荷服务型公用事业公司、大型企业可再生能源买家、依赖储能调度能力的电网运营商，以及需要氢气或下游低碳燃料的工业客户。ERCOT、SPP
              和公用事业资源规划材料都支持这样的判断：这些客户类别正在积极采购清洁电力容量、储能灵活性和具备输电条件的项目。但市场需求不等于 ArtIn 特定采用。ArtIn
              公开材料提到投资级承购方和大型氢能交易对手，却没有披露这些买家的名称、地区、合同结构或部署结果。因此，客户群可以从市场结构推断，却无法在账户层面验证。尽调中，ArtIn 可以合理指向真实需求池，尤其在 Texas
              和 Nebraska
              相关电力系统中；但它尚未拿出具名客户证据，证明市场机会已经转化为持久账户。这个区别很关键，因为这些市场中的机构客户通常需要漫长的采购、信用和绩效审查周期。今天缺少具名交易对手，投资者只能判断可触达需求，而不是已证明的客户承诺。
