        blocks:
          - type: paragraph
            body: >-
              财务风险是投资论点最快失效的路径。已披露项目 CAPEX 负担远大于已确认股权标题，公开收入仍未披露，而估值在运营证据出现前已经嵌入了雄心很大的预期。Federal Reserve、Treasury
              和基础设施融资材料都支持一个判断：更高利率和与合规挂钩的税收抵免价值，可能剧烈改变项目经济性。商品和市场结构风险也重要：储能价值可能取决于现货价格价差，氢能经济性取决于电力成本和利用率，建设通胀或劳动力短缺可能在
              COD
              前侵蚀回报。治理风险不等于欺诈风险，但围绕经审计报表、客户名称和项目层面义务的不透明，会提高投资者把愿景误读为已降风险价值的概率。因此，正确的风险框架是追问哪些事件会迫使估值重置：融资里程碑延迟、队列推进失败、许可缺失、客户不履约事件，或可见的
              down-round。在这些触发因素被收窄之前，剩余风险仍高。实践中，投资者应把每一份缺失文件视为仍然活跃的风险放大器：当队列状态、许可范围、供应商义务或交易对手信用无法测试时，下行情景就应该比在披露更充分的平台中获得更高权重。这也是为什么，即便不考虑正常市场波动，剩余风险仍然很高。
