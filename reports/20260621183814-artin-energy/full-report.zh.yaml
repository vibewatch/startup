      - number: '2.2'
        title: TAM/SAM/SOM 规模测算
        blocks:
          - type: paragraph
            body: >-
              到 2030 年，ArtIn Energy 三个产品板块合计全球 TAM 超过 $350B。公用事业级太阳能最成熟，2025 年为 $170.78B，2030 年增至 $212.72B，CAGR 为
              4.49%。BESS 增速更快，CAGR 为 17-25%，2026 年当前估计为 $55-90B。绿色氢能增速最高，2030 年预测区间为 $86-135B，CAGR 为 42-57%，但 2025
              年基数小得多，仅 $3.8-12B。对 ArtIn 而言，SAM 应限制在公司已宣布项目所在地的美国公用事业级太阳能和储能（Texas 与 Nebraska），再加上任何已锁定合同的绿色氢能机会。但 ArtIn
              没有确认的运营容量，也没有任何排名中的市场份额数据支持，因此无法用现有证据估算公司实际 SOM。绿色氢能预测差异很大，反映了技术采用率、电解槽成本和政策支持连续性上的不确定。
