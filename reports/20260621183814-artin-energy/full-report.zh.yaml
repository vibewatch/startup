          - type: paragraph
            body: >-
              基于当前公开证据，最站得住脚的建议不是把披露估值承销为公允价值。正确立场要么是在当前隐含估值下回避，要么只有在管理层愿意在尽调中提供缺失材料时，才继续研究。入场纪律很重要，因为下行风险不只是增长放慢；更大的风险在于，估值故事建立在比标题显示更不成熟的交易对手、许可或融资假设之上。因此，价格敏感度极高。今天的公开证据支持这样一种判断：ArtIn
              可能拼出了一些有意思的项目期权，但还不足以让投资者按这些项目已经融资、签约并投运来付价。若要转向更建设性的立场，需要看到具名客户证据、项目级资金来源与用途、经审计财务、已获资金支持的里程碑进展，以及至少一个已投运且可见的旗舰资产。在这些标志出现之前，投资者应把当前估值视为偏高，把风险评级视为高，把任何上行兑现的信心视为低到中等。换句话说，估值争议的核心并不是乐观还是悲观，而是有多少证据能把宣传级叙事转成可承销的投资案例；就目前公开信息看，这个证据门槛仍远未满足。
