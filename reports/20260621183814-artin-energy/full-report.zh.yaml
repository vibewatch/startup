  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论与反论
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy
              的牛市叙事在概念上并不难讲。公司站在多个大型脱碳市场的交汇处，声称能拿到项目级太阳能和储能机会，还抛出了一个可能改写局面的氢气承购大单；如果该合同能完整签署并落地，确实可能让私人资本异常关注。Agila
              的结构化出资承诺至少说明外部投资者有所参与。但从今天的公开证据看，反论强得多。ArtIn 没有披露收入，没有经审计财务，没有可见的 SEC
              申报轨迹，最大几项主张没有具名交易对手，也没有确认投运资产。换句话说，公司要求投资者在公开记录尚未证明经营性现金生成或法律与商业细节之前，先接受一个很高的估值。因此，合适的估值框架应是按概率加权的里程碑价值，而不是稳态现金流价值。在客户名称、许可状态、已到账资金和资产投运变得可见之前，反论压过正论。再说直白些，估值争议的核心并不是乐观还是悲观，而是有多少证据能把宣传级叙事转成可承销的投资案例；就目前公开信息看，这个证据门槛仍远未满足。
