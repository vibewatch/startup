  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 披露画像与收入可见度
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy 的公开财务图景，与其说由披露构成，不如说由缺失定义。公司突出 2026 年 3
              月的大额融资标题、数十亿美元管线和大型单体项目资本预算，但不发布经审计损益表、资产负债表、现金流量表、收入运行率、毛利率、积压订单转化或营运资本细节。本章查阅的 SEC
              检索面，没有显示可让外部投资者核对法律实体、资本结构或历史经营结果的公开备案轨迹。因此，基本承销问题仍无答案：今天是否有收入、是否有任何项目在产生现金、开发成本是否资本化、负债是否已经位于项目公司层面。结果是，ArtIn
              更不像透明运营平台，更像一个私人开发叙事，其财务价值取决于未来项目里程碑和融资转化。尽调中，缺失报表比标题数字大小更重要，因为它阻断了对收入质量、现金生成和偿付能力的直接测试。因此，本章把披露缺失本身视为证据：缺少报表、交易对手和现金指标并非中性遗漏，而是核心风险因素；在管理层开放一手文件之前，任何估值或信用判断都只能保持暂定。
