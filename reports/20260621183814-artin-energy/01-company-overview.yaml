- id: funding-and-valuation
  title: Funding History, Valuation, and Investor Relationships
  body: 'In March 2026, ArtIn Energy announced a definitive agreement for a USD 255 million strategic investment from Agila Investments LLC at an implied enterprise valuation of approximately USD 14.58
    billion. The announcement was disseminated via BusinessWire on March 21, 2026, and separately via EINPresswire on March 9, 2026, suggesting staged press release distribution. Agila Investments LLC is
    described as a private investment platform focused on structured capital deployment across energy and infrastructure projects, led by President and CEO Rachel Lucero. The investment is structured as
    milestone-based funding with board-level oversight, validated financial models, and security packages over project assets. Total prior funding history is not publicly disclosed; no prior venture capital
    rounds, Series letters, or institutional fundraising history appears in Crunchbase (which returned a 403 access block) or other databases. The $14.58 billion valuation is implied from the combined CAPEX
    of the Texas ($1.4B) and Nebraska ($2.6B) projects, collectively referred to as "the Transactions." This represents a 57:1 ratio of valuation to capital raised, which is exceptional for a pre-revenue
    infrastructure developer.

    '
  claimRefs:
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  tableRefs:
  - TO003
- id: milestones-and-pipeline
  title: Milestones and Development Pipeline
  body: 'ArtIn Energy''s publicly traceable milestones center on two major announcements: a $25.4 billion green hydrogen contract for 876 megawatts of production capacity (described as the largest in America''s
    history) and the March 2026 $255 million investment from Agila Investments. The green hydrogen contract claims a 25.5 million ton CO2 reduction over 25 years. The company states an overall pipeline
    of $34 billion in renewable energy projects. Beyond these announcements, no independent evidence of project completion, revenue generation, grid connection, or operational facilities was located. The
    founding date is not explicitly disclosed in any source. No regulatory filings (SEC, FERC, state public utility commissions) were identified. The absence of verifiable operational milestones—such as
    megawatts installed, PPAs executed with named counterparties, or construction permits obtained—is a material diligence gap for a company claiming a $14.58 billion valuation.

    '
  claimRefs:
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: adverse-findings
  title: Adverse Indicators and Credibility Assessment
  body: 'Several aspects of ArtIn Energy''s public profile raise significant concerns for institutional due diligence. First, the claimed $538 billion in PPA assets on the balance sheet is implausible for
    any private company and exceeds the combined market capitalization of NextEra Energy, ExxonMobil, and several other major energy companies. If this figure is accurate, it would make ArtIn one of the
    largest asset holders globally, yet no independent confirmation exists. Second, all press coverage identified originates from paid distribution channels (BusinessWire, EINPresswire, MarketerMedia) rather
    than independent investigative journalism. Third, the company''s listed website (artinpower.com) displays a completely different entity—"ArtIn Research"—focused on AI and cybersecurity, suggesting possible
    domain confusion or rebranding. Fourth, the $25.4 billion green hydrogen contract lacks any identified counterparty, project location, timeline, or regulatory approval documentation. Fifth, no evidence
    of completed construction, operating revenues, customer testimonials, or third-party audited financials was found. These factors collectively present a risk profile consistent with either very early-stage
    aspiration or potential misrepresentation of project status and financial position.

    '
  claimRefs:
  - CO030
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
