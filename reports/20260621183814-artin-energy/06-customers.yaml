chapter:
  number: 6
  title: Customers
  summary: ArtIn Energy appears aimed at utilities, grid operators, and industrial
    molecule buyers, but the public record contains no named ArtIn customer roster,
    no disclosed customer count, and no verified production deployments, so current
    customer proof is best described as target-buyer logic rather than demonstrated
    adoption.
sections:
- id: buyer-segments-and-demand-shape
  title: Buyer Segments and Demand Shape
  body: 'The most credible customer view for ArtIn Energy starts with who would logically
    buy its products if the projects advance: load-serving utilities, large corporate
    renewable buyers, grid operators relying on storage-enabled dispatch, and industrial
    customers that need hydrogen or downstream low-carbon fuels. ERCOT, SPP, and utility
    resource-planning materials all support the idea that these customer classes actively
    procure clean-power capacity, storage flexibility, and transmission-ready projects.
    But that market demand should not be confused with ArtIn-specific adoption. Public
    ArtIn materials reference investment-grade offtakers and a large hydrogen counterparty,
    yet they do not identify the names, geographies, contract structures, or deployment
    outcomes of those buyers. As a result, the customer base is inferable by market
    structure but not verifiable at account level. In diligence terms, ArtIn can plausibly
    point to real demand pools, especially in Texas and Nebraska-linked power systems,
    but it has not shown the named customer evidence needed to prove conversion from
    market opportunity into durable accounts. That distinction matters because institutional
    customers in these markets usually require long procurement, credit, and performance
    review cycles, so the absence of named counterparties today leaves investors judging
    addressable demand rather than demonstrated customer commitment.'
  claimRefs:
