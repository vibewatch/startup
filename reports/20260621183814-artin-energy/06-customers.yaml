  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: counterparty-identity
    missingEvidence: Named offtaker and hydrogen buyer identities with signed contract
      copies or customer-side confirmation.
    whyItMatters: Without names, customer quality and concentration cannot be verified.
    diligencePath: Request executed offtake agreements, customer reference calls,
      and any regulatory filings naming counterparties.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: contract-durability
    missingEvidence: Contract tenor, renewal options, take-or-pay provisions, and
      termination rights.
    whyItMatters: These details determine whether the customer narrative represents
      durable recurring value or only preliminary commercial interest.
    diligencePath: Request term sheets or final contracts plus account-history summaries
      for any flagship customers.
    relatedQuestionRefs:
    - QU022
    - QU024
  - type: missing-source
    severity: material
    topic: delivered-output
    missingEvidence: Delivered MWh, hydrogen kilograms, methanol tons, or project
      COD evidence tied to named customers.
    whyItMatters: Operational output is the clearest line between market demand and
      real customer adoption.
    diligencePath: Request commissioning certificates, invoice samples, or customer-side
      case studies with measured outcomes.
    relatedQuestionRefs:
    - QU023
