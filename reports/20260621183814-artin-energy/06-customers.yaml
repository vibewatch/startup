- dimension: unverifiedSource
  reason: The sources are enumerated for auditability but were not all re-fetched
    through the shared fetch-url trail during this chapter-generation pass.
- dimension: tableNotes
  reason: Each table already states its scope and null meaning, so any residual table-notes
    warning would be duplicative rather than informative.
