- id: proof-of-adoption-and-reference-quality
  title: Proof of Adoption and Reference Quality
  body: The central customer problem for ArtIn is that no named roster has been independently
    validated in public materials. The company says investment-grade offtakers support
    its projects, and it publicizes a $25.4 billion hydrogen contract, but the absence
    of named customers means the reader cannot test buyer credit quality, contract
    duration, operational status, or renewal propensity. That creates a major difference
    between a real customer-proof chapter and a target-customer chapter. The highest-quality
    proof would be named buyer references, production-status case studies, regulatory
    filings tying a project to a procurement process, or customer-side confirmations.
    Instead, the public record mainly supports buyer-segment logic, procurement complexity,
    and account-level opacity. Even if ArtIn has signed serious counterparties privately,
    public evidence does not yet show whether projects are still in pilot, still in
    pre-construction contracting, or already in production delivery. The reference
    quality is therefore low to medium despite potentially large headline contract
    claims because names, volumes, and outcomes remain hidden. That distinction matters
    because institutional customers in these markets usually require long procurement,
    credit, and performance review cycles, so the absence of named counterparties
    today leaves investors judging addressable demand rather than demonstrated customer
    commitment.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU020
  - CU023
  - CU024
  - CU025
