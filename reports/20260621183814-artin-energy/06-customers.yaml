- id: durability-expansion-and-concentration-risk
  title: Durability, Expansion, and Concentration Risk
  body: 'Because the roster is unnamed, durability has to be judged by structure rather
    than by disclosed renewal cohorts. Utility and industrial procurement cycles are
    long, highly documented, and usually conservative. That can create durable contracts
    once awarded, but it also means ArtIn faces heavy friction before a project becomes
    an operating customer relationship. Concentration risk is also likely high: if
    the hydrogen headline or a small number of project counterparties accounts for
    most of the commercial story, then any slippage in one flagship buyer could materially
    damage the platform narrative. No public NRR, churn, customer count, or repeat-purchase
    metrics are available. There is also no account-expansion history showing a buyer
    progressing from a pilot to a broader contracted relationship. The most supportable
    customer verdict is therefore that ArtIn probably addresses real buyer segments,
    but public evidence does not yet prove adoption durability or diversification.
    To become investment-grade from a customer-proof standpoint, the company would
    need to name counterparties, show delivered outcomes, and disclose at least one
    concrete renewal or expansion path. That distinction matters because institutional
    customers in these markets usually require long procurement, credit, and performance
    review cycles, so the absence of named counterparties today leaves investors judging
    addressable demand rather than demonstrated customer commitment. Until that happens,
    customer quality must be treated as an open diligence question rather than a closed
    proof point.'
