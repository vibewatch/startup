- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Large utility-scale project awards
    - A small number of project counterparties could dominate the story
    - High upside if real, high downside if delayed
    - Request account concentration by contracted MW and revenue share
  - - Hydrogen contract conversion
    - One large unnamed buyer may account for most molecule narrative
    - Could determine whether hydrogen thesis is real or promotional
    - Request signed contract, obligor credit, and milestone schedule
  - - Regional grid relationships
    - Texas or Nebraska-specific execution may not generalize
    - Customer base may remain geographically narrow
    - Request pipeline by region and buyer type
  - - Cross-sell from power to molecules
    - Broader platform claims may not translate into wallet share
    - Could cap expansion despite broad product set
    - Request account-level product attach rates
  - - Institutional capital relationships
    - Capital support can be mistaken for customer diversification
    - May inflate confidence without true end-market adoption
    - Separate financing counterparties from paying end customers in diligence
  notes: Expansion possibilities are real, but concentration cannot be measured publicly
    because no denominator or account list is disclosed.
