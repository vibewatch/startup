  - - E-methanol sales
    - Downstream sale of synthesized green molecules
    - USD per ton
    - null
    - Low
    - Request plant scope, customer list, and commodity pricing assumptions
  notes: Public materials identify possible monetization paths, but no reviewed source discloses realized revenue, volume, timing, or revenue-recognition policy.
