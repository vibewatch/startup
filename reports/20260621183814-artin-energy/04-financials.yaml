- id: TI002
  title: Pricing / monetization table
  columns:
  - Item
  - Price / contract basis
  - List vs realized
  - What is known
  - Implication
  rows:
  - - Solar offtake pricing
    - Usually long-term PPA or hedge
    - Realized pricing unknown
    - No public PPA price or tenor disclosed
    - Cannot model project cash yield
  - - BESS monetization
    - Energy arbitrage, capacity, ancillary services
    - Realized pricing unknown
    - No merchant or contracted split disclosed
    - Merchant exposure may be material
  - - Green hydrogen contract
    - Contract headline only
    - Realized pricing unknown
    - $25.4B value is disclosed without formula or buyer identity
    - Headline value cannot be converted into margin or NPV
  - - E-methanol output
    - Commodity-linked industrial sale
    - Unknown
    - No public product pricing assumptions
    - Adds execution and commodity basis risk
  - - Agila funding
    - Milestone-based structured capital
    - Not a customer price
    - Funding linked to asset security and validation steps
    - More constrained than unrestricted cash equity
  notes: This table separates sector-standard pricing mechanics from ArtIn-specific realized pricing, which remains undisclosed in public evidence.
