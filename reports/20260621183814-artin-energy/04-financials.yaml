- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: The commercial path runs from development rights and interconnection through offtake, financing, construction, and only then to recurring energy or molecule revenue.
  data:
    nodes:
    - id: n1
      label: Site and permits
      detail: Land control, permitting, and queue progress create the initial asset.
    - id: n2
      label: Offtake
      detail: PPA or industrial molecule contract is needed to prove demand and lender bankability.
    - id: n3
      label: Structured capital
      detail: Sponsor capital plus debt, tax equity, or equipment finance funds build-out.
    - id: n4
      label: Construction
      detail: EPC execution converts development claims into operating assets.
    - id: n5
      label: Operations / sales
      detail: Only operating assets generate electricity, storage, hydrogen, or e-methanol revenue.
    - id: n6
      label: Cash yield
      detail: Gross margin and debt service depend on realized price, utilization, and tax-credit capture.
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
