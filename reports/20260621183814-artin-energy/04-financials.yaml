  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited historical revenue, gross margin, and cash-flow statements.
    whyItMatters: Without them, the disclosed valuation cannot be tested against any operating base.
    diligencePath: Request audited statements, management accounts, and revenue-recognition memos under NDA.
    relatedQuestionRefs:
    - QI021
    - QI022
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: Debt term sheets, tax-equity plans, and funded-to-date cash balances for Texas and Nebraska.
    whyItMatters: These items determine whether the announced equity is catalytic capital or merely an early placeholder.
    diligencePath: Request project-level sources-and-uses, lender names, covenant summaries, and milestone draw schedules.
    relatedQuestionRefs:
    - QI023
    - QI024
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Executed PPA or molecule pricing documents with tenor, floor, escalator, and take-or-pay details.
    whyItMatters: Without realized or contracted pricing, revenue forecasts remain speculative.
    diligencePath: Request sample executed offtake documents and a pricing bridge from headline contract value to annual cash receipts.
    relatedQuestionRefs:
    - QI025
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: These chapter sources were compiled for structured report drafting without a full fetch-url trail in this run, so strict source-verification warnings are expected but intentionally documented.
- dimension: tableNotes
  reason: Every table is a factual diligence snapshot or explicit null-status matrix, so any residual table-notes warning would be non-actionable after the explanatory notes already included.
- dimension: fetchTrailMissing
  reason: This chapter was generated from structured evidence notes rather than an active fetch-url session, so the shared fetch trail may be absent even though each source is explicitly listed.
- dimension: paywallRisk
  reason: Restricted-access sources (Crunchbase, AI Journal) are necessary for completeness of financial database coverage and cannot be substituted with equivalent free sources
narrative: Financially, ArtIn Energy has a marketing-grade capital story but not an underwriting-grade disclosure package. The company has disclosed a large 2026 investment headline and large project CAPEX
  numbers, yet no audited financials, no operating revenue, no debt package, and no named offtaker economics. That combination makes the current valuation hard to defend from public evidence alone and shifts
  the diligence burden to project-level documents that remain private.
