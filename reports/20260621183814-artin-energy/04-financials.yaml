- id: underwriting-view-and-diligence-blockers
  title: Underwriting View and Diligence Blockers
  body: 'The underwriting problem is not whether renewable infrastructure can be valuable; it is whether ArtIn has shown enough company-specific evidence to justify the current mark and the execution risk
    embedded in it. Sector supports do exist in the abstract: Section 48E can materially improve project economics for eligible utility-scale assets, lender appetite still exists for contracted clean-energy
    projects, and large end markets continue to expand. But those are generic tailwinds, not substitutes for company proof. ArtIn still has no public revenue, no unit-economics bridge, no disclosed debt
    commitments, no named offtaker pricing terms, and no audited operating asset cash flows. The financing narrative is also circulated through paid-distribution style channels, which is weak evidence for
    financial quality on its own. As a result, the most defensible financial verdict is that ArtIn may have assembled a development narrative, but public information is not yet sufficient to underwrite
    revenue quality, margin path, or capital adequacy at the disclosed valuation. The immediate blockers are audited statements, project-level sources-and-uses, named counterparties, and funded milestone
    detail. This chapter therefore treats missing disclosure itself as evidence: absent statements, counterparties, and cash metrics are not neutral omissions but central risk factors that force any valuation
    or credit view to stay provisional until management opens primary documents.'
