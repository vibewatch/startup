- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited financial statements
    - Prevents verification of revenue, liabilities, capitalization, and going-concern profile
    - Request audited 2024-2025 financial statements and audit opinion
  - - Named offtakers and contract terms
    - Prevents credit analysis and revenue-quality testing
    - Request executed PPAs and hydrogen offtake term sheets with obligor names
  - - Cash and debt schedule
    - Prevents runway and capital-stack modeling
    - Request cash waterfall, debt maturities, security package, and covenant terms
  - - Project-level operating model
    - Prevents capex-to-cash-flow conversion testing
    - Request per-project IRR, COD, and utilization assumptions
  - - Historical conversion from pipeline to NTP/COD
    - Prevents judgment on management execution
    - Request cohort history by project stage, wins, losses, and delays
  notes: Every row names a missing item that blocks valuation and credit underwriting; none of these gaps can be resolved from current public materials alone.
