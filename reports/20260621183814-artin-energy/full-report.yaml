      - number: '1.5'
        title: Adverse Indicators and Credibility Assessment
        blocks:
          - type: paragraph
            body: >
              Several aspects of ArtIn Energy's public profile raise significant concerns for institutional due
              diligence. First, the claimed $538 billion in PPA assets on the balance sheet is implausible for any
              private company and exceeds the combined market capitalization of NextEra Energy, ExxonMobil, and several
              other major energy companies. If this figure is accurate, it would make ArtIn one of the largest asset
              holders globally, yet no independent confirmation exists. Second, all press coverage identified originates
              from paid distribution channels (BusinessWire, EINPresswire, MarketerMedia) rather than independent
              investigative journalism. Third, the company's listed website (artinpower.com) displays a completely
              different entity—"ArtIn Research"—focused on AI and cybersecurity, suggesting possible domain confusion or
              rebranding. Fourth, the $25.4 billion green hydrogen contract lacks any identified counterparty, project
              location, timeline, or regulatory approval documentation. Fifth, no evidence of completed construction,
              operating revenues, customer testimonials, or third-party audited financials was found. These factors
              collectively present a risk profile consistent with either very early-stage aspiration or potential
              misrepresentation of project status and financial position.
            claimRefs:
              - CO030
              - CO031
              - CO032
              - CO033
              - CO034
              - CO035
