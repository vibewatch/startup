            body: >-
              Any comparable analysis has to be done carefully because ArtIn is neither a public operating utility nor a
              venture-backed software company. The most relevant reference points are milestone-based
              clean-infrastructure development logic, public renewable developers with proven assets, and the general
              valuation discipline taught by practitioners such as Damodaran, Stern, Lazard, and major bank research.
              Those sources consistently imply that valuation quality improves as revenues, assets, and counterparties
              become observable. ArtIn does not yet offer those observables publicly. That pushes scenario analysis
              toward wide ranges rather than point precision. In a bear case, the company's public evidence may support
              only option value around early-stage developments and sponsored narrative. In a base case, some value can
              be assigned to the financing signal, two flagship projects, and the possibility that counterparties are
              real but undisclosed. In a bull case, the hydrogen contract, project pipeline, and integrated platform
              could justify substantially higher value if de-risking milestones are later documented. But even the bull
              case depends on a conversion from promotional scale to operating proof that has not yet been seen
              publicly. Said differently, the valuation debate is not mainly about optimism versus pessimism; it is
              about how much evidence is available to convert a promotional-scale narrative into a defensible
              underwriting case, and today that evidence burden is still largely unmet in public.
            claimRefs:
              - CV013
              - CV014
