      - number: '3.2'
        title: Peer Developer Comparison
        blocks:
          - type: paragraph
            body: >-
              NextEra Energy Resources (subsidiary of NextEra Energy, NYSE: NEE) is the undisputed market leader in US
              renewable development with over $90 billion in market capitalization and operations across nearly every US
              state. The company has a vertically integrated model spanning development, construction, and long-term
              ownership/operation. Invenergy, headquartered in Chicago, is the largest privately held renewable
              developer in the US with 13.8 GW across wind, solar, and storage. Constellation Energy (NYSE: CEG) focuses
              on nuclear and renewable generation at 32.4 GW. Enel Green Power North America operates 12.5 GW in the US.
              Cypress Creek Renewables focuses specifically on utility-scale solar development. Each of these
              competitors has publicly verifiable operational assets, named customer relationships, and established
              financing track records. ArtIn Energy cannot be meaningfully compared on any operational metric given its
              pre-revenue, pre-construction status. AES Corporation, with its AES Clean Energy division, operates
              approximately 3,600 MW of US renewable capacity while maintaining a $10 billion market cap through
              diversified global operations including thermal generation and LNG infrastructure.
