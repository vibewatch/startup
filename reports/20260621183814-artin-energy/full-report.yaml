      - number: '1.3'
        title: Funding History, Valuation, and Investor Relationships
        blocks:
          - type: paragraph
            body: >
              In March 2026, ArtIn Energy announced a definitive agreement for a USD 255 million strategic investment
              from Agila Investments LLC at an implied enterprise valuation of approximately USD 14.58 billion. The
              announcement was disseminated via BusinessWire on March 21, 2026, and separately via EINPresswire on March
              9, 2026, suggesting staged press release distribution. Agila Investments LLC is described as a private
              investment platform focused on structured capital deployment across energy and infrastructure projects,
              led by President and CEO Rachel Lucero. The investment is structured as milestone-based funding with
              board-level oversight, validated financial models, and security packages over project assets. Total prior
              funding history is not publicly disclosed; no prior venture capital rounds, Series letters, or
              institutional fundraising history appears in Crunchbase (which returned a 403 access block) or other
              databases. The $14.58 billion valuation is implied from the combined CAPEX of the Texas ($1.4B) and
              Nebraska ($2.6B) projects, collectively referred to as "the Transactions." This represents a 57:1 ratio of
              valuation to capital raised, which is exceptional for a pre-revenue infrastructure developer.
