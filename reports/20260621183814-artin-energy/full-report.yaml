        title: Capital Intensity and Funding Dependency
        blocks:
          - type: paragraph
            body: >-
              What is disclosed points to extreme capital intensity. ArtIn ties its current financing narrative to a
              Texas project with about $1.4 billion of capital expenditure and a Nebraska project with about $2.6
              billion of capital expenditure. Those two projects alone imply around $4.0 billion of spend, far above the
              announced $255 million strategic investment. If the claimed $34 billion pipeline represents total
              contemplated project value, only a small fraction of the marketed capital requirement is visibly funded
              today. That does not automatically invalidate the model because infrastructure developers often layer
              sponsor equity, project debt, tax equity, equipment finance, and milestone-based capital. It does mean
              that ArtIn is highly dependent on lender diligence, counterparty quality, interconnection progress, and
              project bankability before the story can convert into operational cash flow. Public descriptions of the
              Agila deal also point to milestone-based funding and security over project assets, which is much more
              consistent with structured infrastructure finance than with unrestricted growth equity. The financial
              question is therefore whether ArtIn can de-risk its flagship assets fast enough to unlock much larger
              pools of third-party capital. This chapter therefore treats missing disclosure itself as evidence: absent
              statements, counterparties, and cash metrics are not neutral omissions but central risk factors that force
              any valuation or credit view to stay provisional until management opens primary documents.
