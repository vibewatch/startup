      - number: '2.3'
        title: Buyer/User/Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Utility-scale renewable energy buyers divide into several categories: investor-owned utilities (the
              largest segment, purchasing under regulated procurement mandates), independent system operators managing
              grid reliability, corporate PPA buyers (tech giants like Microsoft, Google, Amazon seeking carbon-neutral
              operations), industrial offtakers needing baseload power, and government/military installations. For BESS,
              buyers include grid operators needing frequency regulation, renewable developers co-locating storage with
              solar for dispatchability, and utilities managing peak demand. Green hydrogen buyers are primarily
              industrial users (ammonia/fertilizer production, steel manufacturing, petroleum refining) plus emerging
              mobility and power generation applications. ArtIn Energy claims investment-grade offtakers but has not
              identified them by name or category. Budget ownership typically sits with utility procurement departments,
              corporate sustainability officers, or industrial plant managers with multi-decade capital expenditure
              authority. The budget authority for these purchases typically involves multi-year capital planning cycles
              with board-level approval for large infrastructure acquisitions exceeding $100 million.
            claimRefs:
              - CM023
              - CM033
              - CM028
          - type: table
            tableRef: TM003
            claimRefs:
              - CM023
              - CM028
          - type: figure
            figureRef: FM004
            claimRefs:
              - CM009
