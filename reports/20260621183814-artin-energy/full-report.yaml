  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The US utility-scale renewable energy development market is dominated by a small number of large-scale
              developers with extensive operational track records. NextEra Energy Resources leads with approximately 40
              GW of installed renewable capacity, followed by Constellation Energy at 32.4 GW and Invenergy at 13.8 GW.
              These companies have decades of operational history, thousands of employees, publicly audited financials,
              and demonstrated execution across hundreds of projects. ArtIn Energy positions itself as competing in this
              space with a claimed $34 billion pipeline, but it has zero confirmed operational capacity, no public
              financial statements, and does not appear in any independent market ranking or industry database. The
              competitive gap between ArtIn and established developers represents orders of magnitude in scale, track
              record, and market validation. This makes traditional competitive analysis—market share, win rates,
              technology differentiation—impossible to conduct meaningfully.
