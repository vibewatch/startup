      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Key growth drivers include declining solar LCOE making solar competitive with fossil fuels, federal tax
              incentives (Section 48E ITC providing up to 30% for utility-scale storage through 2032), rising
              electricity demand from data centers and electrification, and state-level renewable portfolio standards.
              The US is expected to add 86 GW of new utility-scale capacity in 2026. However, significant constraints
              exist: the interconnection queue backlog exceeds 2,000 GW with only 10-19% of projects reaching operation,
              the OBBBA terminated residential credits, rising interest rates increase project financing costs, and
              green hydrogen remains economics-challenged without subsidies. For ArtIn specifically, Texas (ERCOT)
              offers shorter interconnection queues than coastal ISOs, but the companys lack of operational track record
              and the scale of its claims create additional adoption barriers with lenders and offtakers requiring
              bankability evidence.
