      - number: '8.3'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Given the current public evidence, the most defensible recommendation is not to underwrite the disclosed
              mark as fair value. The correct stance is either avoid at the current implied valuation or move to
              research-more only if management is willing to provide the missing materials under diligence. Entry
              discipline matters because the downside is not simply slower growth; it is the possibility that the
              valuation story was built on counterparties, permits, or financing assumptions that are less mature than
              the headline suggests. Price sensitivity is therefore extreme. Public evidence today supports a view that
              ArtIn may have assembled interesting project optionality, but not one that justifies paying as though
              those projects are already financed, contracted, and operational. A more constructive stance would require
              named customer evidence, project-level sources-and-uses, audited financials, funded milestone progress,
              and at least one commissioned flagship asset. Without those markers, investors should treat the current
              valuation as stretched, the risk rating as high, and the confidence level in any upside realization as low
              to medium. Said differently, the valuation debate is not mainly about optimism versus pessimism; it is
              about how much evidence is available to convert a promotional-scale narrative into a defensible
              underwriting case, and today that evidence burden is still largely unmet in public.
