            title: What would justify revisiting the price
            body: >-
              A revisit would require named counterparties, audited financials, project-level sources-and-uses, funded
              milestone proof, and at least one visible operating asset; without those, the current mark behaves more
              like an aspirational headline than a defensible valuation anchor.
