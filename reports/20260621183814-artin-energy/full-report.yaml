      - number: '2.2'
        title: TAM/SAM/SOM Sizing Analysis
        blocks:
          - type: paragraph
            body: >-
              The combined global TAM across ArtIn Energys three product segments exceeds $350 billion by 2030.
              Utility-scale solar is the most mature at $170.78 billion (2025) growing to $212.72 billion (2030) at
              4.49% CAGR. BESS is growing faster at 17-25% CAGR, currently estimated at $55-90 billion in 2026. Green
              hydrogen is the highest-growth segment with forecasts ranging from $86-135 billion by 2030 at 42-57% CAGR,
              though starting from a much smaller base of $3.8-12 billion in 2025. For ArtIn specifically, the SAM would
              be limited to US utility-scale solar and storage where the company has announced projects (Texas and
              Nebraska), plus any green hydrogen opportunities where contracts are secured. However, with zero confirmed
              operational capacity and no market share data supporting ArtIn in any rankings, the companys actual SOM
              cannot be estimated with available evidence. The wide variance in green hydrogen estimates reflects
              uncertainty about technology adoption rates, electrolyzer costs, and policy support continuity.
            claimRefs:
