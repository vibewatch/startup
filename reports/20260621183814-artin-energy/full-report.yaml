        - Many are technology or OEM names, not project developers
      - - Private infrastructure development logic
        - Milestone-based value creation
        - Depends on asset de-risking stage
        - Most relevant framework for ArtIn's stage
        - Private marks are often opaque and deal-specific
      - - Probability-weighted project option value
        - Value assigned before cash flow exists
        - Usually below fully de-risked infrastructure value
        - Best fit when contracts and permits are incomplete
        - Requires assumptions the public record cannot fully support
      - - Headline implied ArtIn mark
        - 2026 company-linked valuation
        - $14.58B implied
        - Sets current reference price
        - Public evidence does not yet support it
    notes: >-
      This is an enumeration of frameworks and benchmark classes rather than a false-precision multiple set, because
      ArtIn lacks the disclosures needed for tight comparable math.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public and conceptual benchmark classes for a private, pre-operational
        clean-infrastructure platform with a headline valuation claim.
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV017
      - CV022
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Named counterparties still absent
        - No verified customer names after diligence access
        - Breaks the commercial-proof leg of the thesis
        - Decline or reprice sharply lower
      - - Funding milestones fail
        - Capital release slips or proves conditional beyond expectations
        - Weakens solvency and execution assumptions
        - Assume punitive dilution or slower build-out
      - - No flagship operating proof
        - No commissioned asset emerges in expected timeframe
        - Prevents transition from narrative to infrastructure value
        - Keep the company in option-value territory
      - - Project-level docs do not reconcile to headline claims
        - Sources-and-uses, permits, or contracts diverge materially
        - Damages trust and bankability
        - Treat disclosed mark as unsupported
      - - Sector macro worsens materially
        - Rates, policy, or power pricing deteriorate
        - Compresses all capital-intensive clean-infra valuations
        - Increase discount rate and reduce scenario ranges
    notes: These triggers convert the qualitative anti-thesis into decision rules that can change the valuation view quickly.
    claimRefs:
      - CV024
      - CV023
      - CV022
      - CV026
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials
        - Income statement, balance sheet, cash flow
        - Required to test valuation against actual economics
        - Management, auditor, and data-room request
      - - Counterparties
        - Named offtakers and hydrogen buyer with signed terms
        - Required to validate the revenue story
        - Commercial diligence and customer references
      - - Project files
        - Queue position, permits, EPC, and sources-and-uses
        - Required to value de-risking stage accurately
        - Project diligence and counsel review
      - - Capital structure
        - Funded-to-date cash, debt terms, preference stack
        - Required to assess dilution and downside
        - Finance diligence and legal document review
      - - Operating proof
        - Commissioning, production, and KPI data
        - Required to move from option value to infrastructure value
        - Site visit, owner-engineer review, and KPI package
    notes: >-
      These asks represent the minimum document set needed to replace public narrative analysis with document-backed
      underwriting.
    claimRefs:
      - CV026
      - CV023
      - CV040
