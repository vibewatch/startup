        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              ArtIn Energy is led by CEO and founder Jhon Cohen, who claims 13 years of international experience in the
              renewable energy industry with a focus on solar energy and sustainable technologies in America and Asia.
              According to the company's executive team page, Cohen holds a Corporate Strategist degree from Harvard
              University, an MBA from Hult International Business School, and a Bachelor of Science in Economics from
              Externado University. Under his leadership, the company claims to have amassed USD $538 billion in PPA
              assets on its balance sheet—a figure that exceeds the market capitalization of the world's largest energy
              companies and raises serious credibility questions if interpreted literally. The CFO is identified as
              Lucia, with 32 years of financial experience including roles at Louis Dreyfus, IC Power, and Cofco
              International, focusing on large-scale photovoltaic and green hydrogen plants. The board includes
              Cristhian Andrews (Board Director and Chairman of Initiative Equity Partners) and Oscar Felipe (Board
              Director). Business development is led by Oscar Rodriguez (30+ years in energy industrial sales, former
              National Sales Director at Bavaria/Anheuser-Busch InBev) and Ancizar (Director of Business Development, 37
              years in financial sector, former General Treasurer at Banco Santander and Banco Caldas). No independent
              verification of these credentials was available through SEC filings, LinkedIn profiles, or third-party
