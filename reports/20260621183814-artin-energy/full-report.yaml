    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Current Stage
        blocks:
          - type: paragraph
            body: >
              ArtIn Energy presents itself as a global renewable energy infrastructure platform specializing in
              utility-scale solar photovoltaic generation, battery energy storage systems (BESS), green hydrogen, and
              e-methanol production. The company is headquartered in Tampa, Florida, USA, and maintains development
              activities in the United States with stated ambitions in Europe and Asia Pacific. It describes its
              business model as developing, financing, and delivering contracted infrastructure-grade clean energy
              assets designed for long-term value creation, partnering with industrial offtakers, utilities, and
              institutional investors. The company's primary website appears to be artinenergy.com, while artinpower.com
              (previously listed) currently displays an unrelated entity labeled "ArtIn Research" focused on AI and
              cybersecurity R&D. This domain discrepancy represents a due diligence concern. The company currently
              operates at a late-stage development phase, with projects advancing toward notice-to-proceed and
              construction financing rather than operating commercially generating assets. No evidence of completed,
              operating projects was identified in public sources.
