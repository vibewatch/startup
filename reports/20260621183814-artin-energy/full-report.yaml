  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy operates across three distinct but interconnected renewable energy markets: utility-scale
              solar photovoltaic generation, battery energy storage systems (BESS), and green hydrogen/e-methanol
              production. The utility-scale solar segment includes ground-mounted solar farms providing electricity to
              grids and corporate buyers under long-term PPAs, excluding residential and small commercial rooftop
              installations. The BESS segment encompasses grid-scale lithium-ion and other battery installations that
              store renewable energy for time-shifting, frequency regulation, and grid stability services. The green
              hydrogen segment covers electrolysis-based hydrogen production using renewable electricity as feedstock,
              with e-methanol as a downstream product combining green hydrogen with captured CO2. Adjacent but excluded
              markets include residential solar, distributed generation, offshore wind, nuclear, and carbon capture
              without hydrogen. The status-quo substitutes are natural gas peaker plants for BESS, gray hydrogen from
              steam methane reforming for green hydrogen, and fossil fuel baseload generation for utility-scale solar.
              The market for e-methanol—produced by combining green hydrogen with captured carbon dioxide—is emerging as
              a downstream segment particularly relevant to maritime decarbonization under International Maritime
              Organization regulations. Each segment has distinct buyer profiles, capital intensity, and regulatory
              dependencies that affect development timelines and risk.
            claimRefs:
              - CM001
              - CM012
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM012
              - CM016
          - type: figure
