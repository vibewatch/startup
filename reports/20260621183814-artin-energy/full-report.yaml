  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              ArtIn operates in a part of the energy system where regulation matters at every stage. Utility-scale
              generation, storage, hydrogen handling, transmission access, labor standards tied to tax credits, and
              environmental permitting all introduce conditions that can alter project timing or economics materially.
              The company's opacity increases that risk because the public record does not show named permits, queue
              positions, project-company filings, or customer-side confirmations that would narrow the range of
              outcomes. FERC and GAO materials continue to describe interconnection congestion and long project
              attrition cycles; Treasury guidance ties key tax-credit value to compliance requirements; EPA and other
              environmental frameworks shape construction and industrial operating obligations. Against that backdrop,
              ArtIn's absence of a visible public filing record is not proof of wrongdoing, but it does mean outside
              investors cannot independently reconcile claims to the underlying regulatory pathway. Legal risk is
              currently more about unknown obligations and incomplete public evidence than about a known lawsuit or
              enforcement action. In practice, that means investors should treat every missing document as a live risk
              amplifier: when queue status, permit scope, supplier obligations, or counterparty credit cannot be tested,
              downside scenarios deserve more weight than they would in a better-documented platform.
            claimRefs:
