  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What ArtIn Energy Says It Delivers
        blocks:
          - type: paragraph
            body: >-
              ArtIn Energy's public materials describe a development platform rather than a narrow single-product
              company. The offering spans utility-scale solar photovoltaic projects, grid-scale battery energy storage,
              green hydrogen production, and e-methanol as a downstream synthetic-fuel pathway. In customer workflow
              terms, that means ArtIn is promising to originate sites, assemble interconnection and permits, secure
              offtake, finance construction, and deliver contracted clean-energy output or clean molecules to
              institutional or industrial buyers. The product is therefore not a mass-market hardware SKU; it is a
              bundle of project-development capability, contracted asset delivery, and multi-technology integration.
              That bundle can be strategically attractive because it addresses both electrons and molecules, yet it also
              raises the burden of proof because each layer has different technology maturity, supply-chain dependence,
              and bankability requirements. Solar PV and lithium-ion storage are established technologies, while green
              hydrogen and e-methanol still depend on low-cost power, electrolyzer economics, and downstream adoption.
              Public materials do not show verified operating throughput, plant schematics, conversion yields, or
              dispatch data that would demonstrate execution depth rather than platform breadth. The diligence
              implication is straightforward: ArtIn may describe a credible multi-vector decarbonization solution, but
              without plant-level operating detail, controls evidence, and supplier disclosure, the technology story
              remains architecture by inference instead of architecture by verification.
