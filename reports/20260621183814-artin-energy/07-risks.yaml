acknowledgedWarnings:
- dimension: unverifiedSource
  reason: The risk chapter cites structured public sources but was authored without
    a complete fetch-url verification trail for every retained URL in this run.
- dimension: tableNotes
  reason: Risk-register tables already include scope notes and explicit residual-exposure
    framing, so any remaining table-notes warning would be redundant.
- dimension: fetchTrailMissing
  reason: This noninteractive chapter build used curated source notes rather than
    a live fetch-url session, so a missing shared fetch trail is transparently acknowledged.
- dimension: figureType
  reason: Where dependency-style risk flows are rendered as supported flow or bar
    figures instead of dag-specific shapes, the substitution is intentional to stay
    within the requested figure-type set.
narrative: ArtIn Energy carries the kinds of risks common to large clean-infrastructure
  development, but they are amplified by limited public substantiation. Queue timing,
  permits, tax-credit compliance, supplier and counterparty opacity, and milestone-based
  financing are all individually serious; together they create a high residual-risk
  profile that can reprice the story quickly if even one flagship assumption fails.
