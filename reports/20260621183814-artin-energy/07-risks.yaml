  title: Opacity amplifies every other risk
  body: ArtIn's problem is not only that utility-scale clean-infrastructure projects
    are complex; it is that public evidence does too little to narrow where ArtIn
    sits inside that complexity on permits, counterparties, safety systems, and funding
    readiness.
  claimRefs:
