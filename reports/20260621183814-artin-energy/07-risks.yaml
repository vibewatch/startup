- id: financial-and-thesis-break-risk
  title: Financial and Thesis-Break Risk
  body: 'Financial risk is the fastest way the thesis can break. The disclosed project
    CAPEX burden is much larger than the confirmed equity headline, public revenue
    remains undisclosed, and the valuation already embeds ambitious expectations before
    operating proof appears. Federal Reserve, Treasury, and infrastructure-finance
    materials all support the idea that higher rates and compliance-linked tax-credit
    value can shift project economics sharply. Commodity and market-structure risk
    also matter: storage value can depend on merchant-price spreads, hydrogen economics
    depend on power cost and utilization, and construction inflation or labor scarcity
    can erode returns before COD. Governance risk is not the same as fraud risk, but
    opacity around audited statements, customer names, and project-level obligations
    increases the chance that investors misread aspiration as de-risked value. The
    right risk framework is therefore to ask what events would force a reset: a delayed
    financing milestone, a failed queue progression, a missing permit, a customer
    non-performance event, or a visible down-round. Until these triggers are narrowed,
    the residual risk profile remains high. In practice, that means investors should
    treat every missing document as a live risk amplifier: when queue status, permit
    scope, supplier obligations, or counterparty credit cannot be tested, downside
    scenarios deserve more weight than they would in a better-documented platform.
    That is why residual risk remains high even before considering normal market volatility.'
  claimRefs:
