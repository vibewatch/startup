    topic: insurance-and-risk-transfer
    missingEvidence: Insurance towers, surety bonds, and risk-transfer instruments
      for flagship projects.
    whyItMatters: These tools materially affect loss severity and lender comfort during
      construction and operations.
    diligencePath: Request insurance schedules, broker summaries, and surety coverage
      by project phase.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
