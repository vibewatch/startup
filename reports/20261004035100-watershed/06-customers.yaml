callouts:
  - calloutType: "insight"
    title: "Time-Savings vs Strategic Action Disconnect"
    body: "While enterprise clients such as Smiths Group and Royal Mail document significant operational time-savings—cutting monthly data consolidation from a week to a single day—reclaimed time does not automatically translate into rapid corporate decarbonization. Diligence requires verifying whether client operations teams possess capital budgets and corporate mandates to execute the emission reductions identified by the software [CU004, CU005, CU008]."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU008"
  - calloutType: "risk"
    title: "Opaque Retention Dynamics and Regulation Dependency"
    body: "Watershed's enterprise expansion has been heavily accelerated by impending regulatory frameworks such as Europe's CSRD. With public disclosures omitting net revenue retention and renewal cohort figures, a critical downside risk is that enterprise buyers treat emissions software as a non-essential administrative cost center if enforcement timetables slip or reporting rules are simplified [CU001, CU003, CU011, CU012]."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU011"
      - "CU012"
