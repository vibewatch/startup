figures:
  - id: "FU001"
    title: "Enterprise Customer Journey and Platform Expansion Stages"
    type: "journey-map"
    summary: "Illustrates the structured transition of enterprise clients from initial compliance-driven data ingestion to advanced supply chain Scope 3 automation."
    data:
      items:
        - label: "Stage 1: Compliance Scoping"
          stage: "Regulatory Intake & Scoping"
          actor: "Chief Sustainability Officer / ESG Lead"
          objective: "Establish audit-ready emissions baseline for CSRD and CDP reporting"
          touchpoints:
            - "Executive compliance discovery"
            - "ERP and utility record scoping"
            - "Watershed platform kickoff"
        - label: "Stage 2: Data Ingestion"
          stage: "Automated Data Ingestion & Cleaning"
          actor: "Sustainability Manager & Data Analysts"
          objective: "Ingest unstructured energy invoices and utility data via AI agents"
          touchpoints:
            - "PDF utility scanner ingestion"
            - "Emissions factor database mapping"
            - "Anomaly flagging and review"
        - label: "Stage 3: Executive Reporting"
          stage: "Executive Disclosure & Reporting"
          actor: "VP Sustainability & Financial Controllers"
          objective: "Generate external regulatory reports with defensible audit trails"
          touchpoints:
            - "CSRD disclosure module review"
            - "Board-level KPI dashboards"
            - "External auditor read-access"
        - label: "Stage 4: Scope 3 Supplier Engagement"
          stage: "Scope 3 Supplier Decarbonization"
          actor: "Corporate Procurement Directors & Key Suppliers"
          objective: "Replace spend-based estimates with supplier-specific carbon metrics"
          touchpoints:
            - "EcoVadis primary data sync"
            - "Supplier portal onboarding"
            - "Procurement scorecard integration"
        - label: "Stage 5: Marketplace Decarbonization"
          stage: "Active Decarbonization Execution"
          actor: "Operations Leads & Energy Managers"
          objective: "Procure verified carbon removals and implement site energy reductions"
          touchpoints:
            - "Watershed Marketplace offset access"
            - "Site energy efficiency projects"
            - "Quarterly emissions reduction audits"
        - label: "Stage 6: Enterprise Expansion"
          stage: "Enterprise Expansion & Multi-Site Rollout"
          actor: "Global Sustainability Steering Committee"
          objective: "Standardize emissions accounting and AI agents across all global subsidiaries"
          touchpoints:
            - "Multi-site rollouts across international facilities"
            - "AI fellowship training for internal champions"
            - "Continuous audit verification"
    approximationNotes: "Journey stages synthesized from Watershed platform architecture, product documentation, and documented customer deployment sequences."
