callouts:
  - calloutType: "risk"
    title: "Opaque Financial Metrics and Forward Valuation Vulnerability"
    body: "Watershed's $1.8B valuation mark established in February 2024 was secured during peak corporate ESG enthusiasm preceding significant regulatory pushback in the US. With recognized ARR, growth rates, gross margins, and cash burn rate withheld from public markets, prospective investors cannot verify whether current enterprise cash generation justifies its post-Series C valuation premium without private financial disclosures."
    claimRefs:
      - "CI008"
      - "CI011"
      - "CI013"
      - "CI015"
  - calloutType: "insight"
    title: "Marketplace Facilitation as a Scalable Non-Linear Revenue Driver"
    body: "Beyond pure software seat licenses, Watershed's carbon removal RFP mechanism aggregates corporate purchasing power across more than 800 buyers. Facilitating over $120M in decarbonization commitments creates a transaction-based revenue pathway that scales with voluntary climate capital expenditure rather than software headcount seats alone."
    claimRefs:
      - "CI003"
      - "CI004"
