  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Enterprise Module Map
        blocks:
          - type: paragraph
            body: >-
              Watershed positions its platform as an enterprise sustainability AI system engineered to transition
              corporate sustainability programs from manual spreadsheet accounting to continuous, audit-ready
              operational workflows. The platform addresses core corporate carbon management across five distinct
              functional modules: Data Collection, Data Cleaning & Standardization, Mapping & Measurement, Analysis, and
              Reporting. Data Collection ingests enterprise records across Scope 1, Scope 2, and Scope 3 activity
              streams using built-in optical character recognition (OCR), enterprise resource planning (ERP) data
              connections, and structured project management features. Data Cleaning & Standardization delegates raw
              data transformation to purpose-built AI agents, which Watershed claims accelerate data processing by up to
              80% to 93% compared to manual preparation. Mapping & Measurement applies expert climate accounting
              methodologies and automated emissions factor matching, anchored by Watershed's acquisition of the
              Comprehensive Environmental Data Archive (CEDA) multi-region emissions database. The Analysis module
              allows corporate sustainability and finance leads to query footprint data, model decarbonization
              trajectories, and evaluate the emissions implications of strategic business decisions. Finally, the
              Reporting module automates draft generation for mandatory and voluntary disclosure frameworks, including
              the European Union Corporate Sustainability Reporting Directive (CSRD), the Carbon Disclosure Project
              (CDP), and related global standards, while maintaining calculation audit trails and configurable
              human-in-the-loop review controls.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
