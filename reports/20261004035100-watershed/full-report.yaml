              - CU004
              - CU005
              - CU006
              - CU008
      - number: '6.2'
        title: Production Deployments and Operational Proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence at Watershed reflects a dual dynamic of substantial aggregate emissions coverage
              alongside uneven technical depth across user accounts [CU001, CU002]. Corporate marketing documents cite
              over 479 million tonnes of carbon dioxide equivalent under management across global accounts as of early
              2024, expanding toward broader platform coverage in 2026 [CU001, CU002]. Production deployment case
              studies illustrate concrete workflow automation: Royal Mail deployed Watershed's specialized capabilities
              across an operating fleet of roughly 40,000 vehicles to automate complex refrigerant and corporate travel
              emissions ingestion [CU004]. Concurrently, Smiths Group implemented automated data pipelines across more
              than 250 global sites to streamline monthly Scope 1 and Scope 2 reporting routines [CU005]. Despite these
              operational reference points, broader platform-wide adoption metrics such as active seat utilization and
              non-executive engagement remain unverified [CU002, CU008].
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
