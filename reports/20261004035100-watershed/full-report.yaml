          - type: paragraph
            body: >
              Public leadership coverage in the assigned evidence is narrow. StartupFundraising lists Christian Anderson
              as a founder, and a Watershed product announcement identifies Yubing Zhang as Head of AI Products. The
              source set does not provide a current, complete executive roster, board membership, voting rights,
              succession plan, or biographies sufficient to assess founder-market fit. As a result, the leadership table
              is intentionally a sample rather than an exhaustive management census, and key-person dependence remains a
              diligence question rather than a quantified risk.


              Capital-provider visibility is stronger than governance visibility. Company and third-party sources name
              Greenoaks, Kleiner Perkins, Sequoia Capital, and Lowercarbon Capital among investors. Watershed also says
              it established Policy and Science advisory boards, but the assigned sources do not establish those bodies'
              current membership, authority, independence, or formal board relationship. No public cap table in the
              source set shows ownership percentages, liquidation preferences, board seats, or control rights, so
              investor prominence should not be conflated with verified governance control.
