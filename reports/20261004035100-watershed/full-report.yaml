              - CR009
              - CR012
              - CR014
      - number: '7.3'
        title: Partner, Leadership, and Financial-Model Dependencies
        blocks:
          - type: paragraph
            body: >-
              Watershed's 2026 carbon RFP reportedly aggregates more than 800 corporate buyers and places supplier
              diligence, contracting, and delivery inside its procurement model. Scale strengthens network utility but
              also raises the consequence of project under-delivery or integrity disputes. Financing evidence is
              similarly incomplete: the company announced a $100 million Series C at a $1.8 billion valuation in 2024,
              Multiples reports a separate $15 million round in January 2026, and GetLatka estimates 2025 annual revenue
              at $108.3 million. Funding raised is not cash available, and estimated revenue is not audited revenue or
              ARR. The public leadership directory shows a broader functional bench, but it does not establish decision
              rights, succession, or key-person redundancy.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring Indicators and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The investment case should break or pause if diligence shows repeated material reporting errors, missed
              disclosure deadlines, a significant security event without timely remediation, carbon-project delivery
              failures, or customer agreements that override the public liability protections without compensating
              controls. Financial escalation triggers are runway below an agreed board threshold, materially weaker
              renewal economics, or financing terms that subordinate new capital; none can be measured from the public
              source set. Near-term monitoring should therefore require quarterly uptime and incident reporting,
              calculation-error sampling, project-delivery cohorts, customer and supplier concentration, audited revenue
              quality, burn and runway, and named succession coverage. Absence of a search result for litigation,
              breach, or outage is recorded as an evidence gap, not evidence that no event occurred.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR010
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract protection is not operational mitigation
            body: >-
              Liability limits and warranty disclaimers may reduce recoverable damages, but they do not establish
              uptime, security, calculation accuracy, or customer retention after a failure.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: Financing and revenue require private reconciliation
            body: >-
              The 2024 financing is funding raised rather than cash available, while the 2025 revenue figure is a
              third-party estimate rather than disclosed ARR or audited accounting revenue.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is enterprise reach rather than demonstrated economics. ESG News reports more than
              800 business customers, including 90 Fortune 500 companies, while Watershed claims 4.1 gigatonnes of
              emissions under management. ESG News also reports that customers, not Watershed itself, committed more
              than $120M to decarbonization projects; that figure is marketplace activity and must not be treated as
              revenue. These signals indicate workflow breadth and a sizable corporate network, but they do not disclose
              contracted recurring revenue, retention, gross margin, cash use, or customer concentration. The
              anti-thesis is therefore an evidence mismatch: visible operating scale and product activity are being
              compared with a private-company price without the audited financial bridge needed to judge whether
              adoption converts into durable equity value.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Watershed announced a $100M Series C at a $1.8B valuation in February 2024, independently repeated by ESG
              Dive. Forge displays a December 2025 Series C record of $114.96M at a $1.85B post-money valuation and
              $9.76 per share, but explains that post-money valuation is estimated from company-submitted incorporation
              records. Forge also labels market activity low and provides neither a Forge Price nor a last matched
              price. The public evidence therefore supplies financing reference points, not an executable entry price.
              Forge lists a 1.0x non-participating liquidation preference and a 6% non-cumulative dividend for the
              displayed Series C terms; investors still need the complete capitalization table, debt, cash, option pool,
              and preference waterfall before translating headline post-money value into common-equity economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.3'
        title: Valuation Method and Scenario Boundaries
        blocks:
          - type: paragraph
            body: >-
              GetLatka estimates $108.3M of annual revenue for 2025; the fetched page does not establish that the figure
              is audited or that it is ARR. Dividing the $1.8B-$1.85B post-money references by that estimate produces a
              rough 16.6x-17.1x valuation-to-estimated-annual-revenue proxy, not an enterprise-value-to-revenue multiple
              because net debt and cash are unknown. Multiples offers a comparator set spanning companies such as C3.ai,
              Feedzai, Persona, and Quantexa, but those business models do not establish a like-for-like
              sustainability-software benchmark. Accordingly, bull, base, and bear cases are framed as diligence
              conditions rather than invented forecasts. No probability, fair-value range, target return, hold period,
              or exit multiple is supportable until audited revenue quality, retention, margins, capitalization, and a
              defensible comparable set are available.
            claimRefs:
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: Recommendation, Exit Readiness, and Thesis-Break Tests
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high underwriting risk, and a stretched
              public- evidence valuation stance. This is not a judgment that the company lacks operating quality; it
              reflects the absence of a verified financial denominator and observable liquidity at the cited financing
              marks. EquityZen describes a channel through which existing stockholders may sell interests via its funds,
              but its public page does not disclose a current Watershed price. Forge similarly reports low activity and
              no available matched price, so neither page proves exit readiness or price discovery. A buy case would
              require audited financials, cohort retention, gross-margin and services-mix data, current cash and burn, a
              fully diluted cap table and preference waterfall, recent arm's-length secondary transactions, and a
              documented exit pathway. Failure on those tests is the thesis-break condition; a lower headline price
              alone would not cure weak economics.
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-Sensitive Recommendation
            body: >-
              The public record supports research-more, not buy: a financing mark is available, but audited economics,
              executable price discovery, and the preference-adjusted ownership bridge are not.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV016
          - type: callout
            title: Funding Raised Is Not Cash Available
            body: >-
              Published funding totals conflict and none of the retained sources establishes current cash, burn, debt,
              or runway. The totals cannot be used as a liquidity balance.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
