      - number: '1.3'
        title: Capitalization, Scale Signals, and Evidence Limits
        blocks:
          - type: paragraph
            body: >
              Watershed announced a $100M Series C in February 2024, led by Greenoaks and including Kleiner Perkins,
              Sequoia, and other existing investors. The company described the round as valuing Watershed at $1.8B.
              StartupFundraising reports $239M in total disclosed funding and says its round record contains nothing
              later than February 2024; this is a funding-history observation, not evidence that $239M remains available
              as cash. The assigned sources contain no supportable debt, secondary-sale, revenue, ARR, gross-margin,
              retention, burn, or runway figure.


              Scale signals are substantial but mix company claims and third-party reporting. ESG News reports that the
              2026 Carbon RFP addressed a network of more than 800 businesses, including 90 Fortune 500 companies, and
              that the prior RFP led to more than 100 corporate credit purchases. Watershed separately said in 2024 that
              customer-managed emissions had grown from an estimated 20 million tonnes of CO2e at Series B to 479
              million tonnes; emissions under management are not revenue or customer count.


              Workforce evidence is not reconcilable as a numeric range. Watershed says its team is nearly 400, whereas
              Revelio Labs reports 570 people but identifies the entity as an Ann Arbor-based
              information-technology-services company. An assigned government result for an unrelated “NYC WATERSHED”
              conference further shows that the generic company name creates search collisions. The 570 figure is
              therefore flagged as an entity-resolution conflict, not treated as a verified company headcount.
