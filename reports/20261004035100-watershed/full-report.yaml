      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Implementation Capacity Gap in Enterprise Climate Software
            body: >
              A critical structural challenge in the enterprise sustainability software market is that advanced tooling
              does not solve human coordination problems. Industry surveys reveal that over 77% of finance and
              sustainability leaders experience severe difficulty gathering primary Scope 3 emissions data from
              decentralized suppliers. Self-service software platforms like Watershed and Persefoni require dedicated
              internal program managers across sustainability, finance, and procurement to configure data pipelines and
              enforce supplier compliance. Without sustained internal operating capacity, enterprise deployments
              frequently stall, driving frustrated teams back to manual spreadsheet workarounds or toward fully managed
              compliance models.
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
              - CP007
          - type: callout
            title: Non-Climate ESG Breadth and Regulatory Compliance Exposure
            body: >
              While Watershed has built an industry-leading position in greenhouse gas accounting and climate
              disclosures (ESRS E1), corporate compliance under the EU Corporate Sustainability Reporting Directive
              (CSRD) mandates extensive reporting across social standards (ESRS S1–S4) and governance metrics (ESRS G1).
              Pure-play climate platforms that focus exclusively on emissions leave major compliance gaps that corporate
              buyers must bridge using secondary software solutions or manual consulting engagements, creating an
              opening for broader ESG platform incumbents and managed compliance providers.
            calloutType: risk
            claimRefs:
              - CP001
              - CP004
              - CP005
