  - id: TV003
    title: Bull, Base, and Bear Diligence Scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Audited recurring revenue exceeds the third-party annual-revenue estimate; retention and gross margin
          demonstrate software-quality economics; enterprise breadth converts to expansion.
        - >-
          A fair-value range and target return require a verified net-debt bridge, preference-adjusted fully diluted
          ownership, and business-model-matched revenue multiples.
        - >-
          Customer breadth and marketplace activity are positive signals, but public evidence cannot support a numerical
          probability.
        - Retention, margin, or services-mix diligence fails to confirm scalable software economics.
      - - Base
        - >-
          The $108.3M estimate is directionally useful but unverified; the latest displayed financing marks remain
          reference points rather than clearing prices.
        - The rough 16.6x-17.1x post-money-to-estimated-revenue proxy supports research-more, not a target valuation.
        - Conflicting funding totals and absent matched-price data prevent a defensible numerical probability.
        - No current secondary transactions or capitalization evidence is produced during diligence.
      - - Bear
        - >-
          Revenue quality is weaker than the estimate implies, liquidity stays low, and preferred rights absorb more
          exit value than common holders expect.
        - >-
          Downside cannot be quantified without the current cap table and waterfall; a down round or discounted
          secondary is plausible but not established.
        - >-
          Forge's low-activity label and the lack of a published matched price are cautionary, not proof of a future
          loss.
        - >-
          Audited KPIs miss management's plan, financing requires senior terms, or recent common-share trades clear
          materially below the financing reference.
    notes: >-
      These are conditional diligence cases, not forecasts; no unsupported valuation ranges, probabilities, ARR figures,
      exit multiples, or return targets are assigned.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV016
