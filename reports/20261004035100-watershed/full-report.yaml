  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Evidence dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Enterprise reach
        - ESG News reports more than 800 businesses and 90 Fortune 500 customers.
        - The count is not an audited active-customer or revenue-concentration schedule.
        - Contract-level active-customer counts, cohort revenue, and concentration by top accounts.
      - - Platform footprint
        - Watershed claims 4.1Gt of emissions under management.
        - Emissions managed is not revenue, retention, or monetized transaction volume.
        - A reconciliation from managed emissions to paid modules, contract value, and renewal behavior.
      - - Marketplace activity
        - ESG News reports more than $120M committed by Watershed customers to climate projects.
        - Customer project commitments are not Watershed revenue or assets.
        - Recognized marketplace revenue, take rate, gross margin, and supplier-performance data.
      - - Financing validation
        - Company and independent reporting align on the February 2024 $100M round and $1.8B valuation.
        - A financing valuation is not evidence of an executable current price.
        - Recent arm's-length transactions with price, volume, security class, and rights.
      - - Capital protections
        - Forge exposes selected Series C preference terms.
        - The complete waterfall, debt, cash, option pool, and all senior rights remain unavailable.
        - Current charter, capitalization table, debt schedule, and modeled exit waterfall.
      - - Liquidity pathway
        - EquityZen describes access to existing-shareholder liquidity.
        - Forge reports low activity and no available matched price.
        - Completed secondary trades and a documented IPO or strategic-exit readiness plan.
    notes: >-
      Coverage is limited to the successful prefetched sources; company metrics are labeled as claims, and marketplace
      commitments are kept separate from revenue.
