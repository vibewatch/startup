      - number: '4.3'
        title: Cost Structure and Unit Economics Analysis
        blocks:
          - type: paragraph
            body: >-
              Watershed's structural cost profile combines pure cloud software infrastructure with domain-intensive
              climate advisory overhead. Delivering audit-ready greenhouse gas inventories requires recurring cloud
              computing for processing enterprise ERP and supply chain records, external emissions dataset licensing,
              and in-house climate science and policy support to validate calculation methodologies. Furthermore,
              initial baseline setups require dedicated solutions engineering and customer success personnel to assist
              corporate sustainability teams in resolving disparate supplier data feeds. Consequently, true software
              gross margins are compressed by implementation advisory overhead, though exact gross margins, net revenue
              retention rates, and customer acquisition payback periods remain private, creating significant uncertainty
              regarding long-term operating leverage.
