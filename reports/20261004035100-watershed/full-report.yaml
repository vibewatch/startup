    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Operating Footprint
        blocks:
          - type: paragraph
            body: >
              Watershed presents itself as an enterprise sustainability AI platform, with workflows spanning data
              collection, data cleaning, emissions-factor mapping, analysis, and reporting. The company says it started
              in 2019; an independent funding database identifies San Francisco as its base. Its about page reports
              offices in San Francisco, London, New York, Sydney, Paris, Berlin, and Mexico City and describes a team of
              nearly 400 people. Those statements establish the target entity and its broad product surface, but the
              assigned evidence does not disclose pricing, contract structure, implementation-services mix, or the legal
              headquarters entity.


              Product-positioning evidence is mainly company-issued. Watershed's 2026 announcement says IDC named it a
              Leader in carbon accounting and management applications, while the homepage describes additional
              recognition from Verdantix and Forrester. Because the underlying analyst reports are not in the assigned
              source pool, these are retained as company claims rather than independent benchmark verification. The
              evidence supports a broad enterprise platform description, not a conclusion about customer-level adoption
              depth or software economics.
