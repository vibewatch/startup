              - CU005
              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Account Durability and Concentration Exposures
        blocks:
          - type: paragraph
            body: >-
              A critical diligence consideration for Watershed is customer durability in the face of shifting global
              climate disclosure standards and enterprise budget scrutiny [CU003, CU011]. Watershed's customer expansion
              relies on cross-selling automated modules such as supply chain Scope 3 data integrations and AI data
              preparation agents [CU006, CU009]. However, enterprise surveys indicate that only 43% of sustainability
              professionals actively use AI in their corporate workflows, pointing to potential change-management
              friction and adoption inertia across conservative enterprise accounts [CU003, CU010]. Furthermore,
              Watershed does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), annual
              churn rates, or customer concentration thresholds for its top ten corporate accounts [CU011, CU012]. This
              opacity creates analytical uncertainty regarding whether recurring contract renewals are durably insulated
              from regulatory pushbacks or potential corporate cost reductions [CU003, CU012].
            claimRefs:
              - CU003
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Time-Savings vs Strategic Action Disconnect
            body: >-
              While enterprise clients such as Smiths Group and Royal Mail document significant operational
              time-savings—cutting monthly data consolidation from a week to a single day—reclaimed time does not
              automatically translate into rapid corporate decarbonization. Diligence requires verifying whether client
              operations teams possess capital budgets and corporate mandates to execute the emission reductions
              identified by the software [CU004, CU005, CU008].
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU008
          - type: callout
            title: Opaque Retention Dynamics and Regulation Dependency
            body: >-
              Watershed's enterprise expansion has been heavily accelerated by impending regulatory frameworks such as
              Europe's CSRD. With public disclosures omitting net revenue retention and renewal cohort figures, a
              critical downside risk is that enterprise buyers treat emissions software as a non-essential
              administrative cost center if enforcement timetables slip or reporting rules are simplified [CU001, CU003,
              CU011, CU012].
            calloutType: risk
            claimRefs:
              - CU001
              - CU003
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest primary evidence in the allocated source set is Watershed's data-portal contract, not a
              regulator or court record. The live terms permit service changes or suspension, require users to secure
              data rights and consents, send personal information to the United States, impose individual arbitration,
              and limit specified liability. Those provisions can reduce contractual exposure, but they do not
              demonstrate operating resilience, regulatory compliance, or enforceability in every customer agreement.
              Carbon-market activity adds another legal-quality surface because Watershed reportedly handles supplier
              diligence, contracting, and delivery for participating buyers. The resulting priority is to inspect
              enterprise MSAs, DPAs, regulatory correspondence, and project-quality representations rather than treat
              public boilerplate as a complete mitigation.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR014
      - number: '7.2'
        title: Operational, Quality, and Security Exposure
        blocks:
          - type: paragraph
            body: >-
              Watershed's outputs depend on customer-supplied data, while its terms disclaim assurances that content is
              accurate or that the service is uninterrupted or secure. This allocation of responsibility is commercially
              important: a reporting error or outage near a disclosure deadline could still damage renewals even when
              contract language limits recovery. The company markets built-in human review and transparent calculations
              as controls, but the source set contains no control audit, error-rate series, uptime history,
              penetration-test result, or incident register. A historical Verdantix assessment also identified
              category-level gaps in internal carbon pricing, project portfolio management, and Scope 3 analysis beyond
              standard methodologies, making current capability verification a diligence requirement rather than a
              settled weakness.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR015
