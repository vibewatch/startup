  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape, Peer Categories, and Status Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              The enterprise carbon accounting and sustainability software sector exhibits distinct segmentation across
              multiple competitive archetypes. Rather than a unified market served by identical products, enterprise
              buyers choose between climate-native SaaS specialists, broader ESG compliance and disclosure platforms,
              incumbent enterprise resource planning suites, managed advisory services, and internal spreadsheet status
              quo workflows.


              Direct climate-first peers such as Persefoni and Sweep contest core enterprise emissions management.
              Persefoni focuses on investor-grade greenhouse gas accounting with specialized alignment to the
              Partnership for Carbon Accounting Financials (PCAF) for financed emissions and capital markets. Sweep
              emphasizes flexible, rules-based sustainability intelligence covering carbon alongside broader non-climate
              ESG frameworks across decentralized operational business units. Concurrently, legacy reporting suites like
              Workiva and enterprise data aggregators like IBM Envizi address corporate disclosure and environmental
              health and safety requirements across complex multi-entity architectures.


              Beyond commercial software peers, the dominant status quo competitor remains internal spreadsheet models
              and ad-hoc business intelligence tooling (such as Microsoft Power BI and Tableau). While manual
              spreadsheet pipelines carry zero incremental software licensing expenditure, they suffer from brittle
              version control, lack of defensible data lineage, and failure under third-party audit scrutiny.
              Conversely, managed sustainability compliance services (such as Hydrus) package specialized software with
              fractional operating capacity, directly challenging pure software platforms in resource-constrained
              organizations.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
