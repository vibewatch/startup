company:
  name: "Watershed"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Watershed says it began in 2019 and now operates an enterprise sustainability AI platform from a global office footprint. Its last disclosed financing was a $100M Series C announced in February 2024 at a company-stated $1.8B valuation; an independent database reports $239M of total disclosed funding, while current revenue, ARR, margins, liquidity, and retention remain public-evidence gaps."
sections:
  - id: "identity-and-platform"
    title: "Identity, Product Scope, and Operating Footprint"
    body: |
      Watershed presents itself as an enterprise sustainability AI platform, with workflows spanning data collection, data cleaning, emissions-factor mapping, analysis, and reporting. The company says it started in 2019; an independent funding database identifies San Francisco as its base. Its about page reports offices in San Francisco, London, New York, Sydney, Paris, Berlin, and Mexico City and describes a team of nearly 400 people. Those statements establish the target entity and its broad product surface, but the assigned evidence does not disclose pricing, contract structure, implementation-services mix, or the legal headquarters entity.

      Product-positioning evidence is mainly company-issued. Watershed's 2026 announcement says IDC named it a Leader in carbon accounting and management applications, while the homepage describes additional recognition from Verdantix and Forrester. Because the underlying analyst reports are not in the assigned source pool, these are retained as company claims rather than independent benchmark verification. The evidence supports a broad enterprise platform description, not a conclusion about customer-level adoption depth or software economics.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Investors, and Governance Visibility"
    body: |
      Public leadership coverage in the assigned evidence is narrow. StartupFundraising lists Christian Anderson as a founder, and a Watershed product announcement identifies Yubing Zhang as Head of AI Products. The source set does not provide a current, complete executive roster, board membership, voting rights, succession plan, or biographies sufficient to assess founder-market fit. As a result, the leadership table is intentionally a sample rather than an exhaustive management census, and key-person dependence remains a diligence question rather than a quantified risk.

      Capital-provider visibility is stronger than governance visibility. Company and third-party sources name Greenoaks, Kleiner Perkins, Sequoia Capital, and Lowercarbon Capital among investors. Watershed also says it established Policy and Science advisory boards, but the assigned sources do not establish those bodies' current membership, authority, independence, or formal board relationship. No public cap table in the source set shows ownership percentages, liquidation preferences, board seats, or control rights, so investor prominence should not be conflated with verified governance control.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capitalization-and-scale"
    title: "Capitalization, Scale Signals, and Evidence Limits"
    body: |
      Watershed announced a $100M Series C in February 2024, led by Greenoaks and including Kleiner Perkins, Sequoia, and other existing investors. The company described the round as valuing Watershed at $1.8B. StartupFundraising reports $239M in total disclosed funding and says its round record contains nothing later than February 2024; this is a funding-history observation, not evidence that $239M remains available as cash. The assigned sources contain no supportable debt, secondary-sale, revenue, ARR, gross-margin, retention, burn, or runway figure.

      Scale signals are substantial but mix company claims and third-party reporting. ESG News reports that the 2026 Carbon RFP addressed a network of more than 800 businesses, including 90 Fortune 500 companies, and that the prior RFP led to more than 100 corporate credit purchases. Watershed separately said in 2024 that customer-managed emissions had grown from an estimated 20 million tonnes of CO2e at Series B to 479 million tonnes; emissions under management are not revenue or customer count.

      Workforce evidence is not reconcilable as a numeric range. Watershed says its team is nearly 400, whereas Revelio Labs reports 570 people but identifies the entity as an Ann Arbor-based information-technology-services company. An assigned government result for an unrelated “NYC WATERSHED” conference further shows that the generic company name creates search collisions. The 570 figure is therefore flagged as an entity-resolution conflict, not treated as a verified company headcount.
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
