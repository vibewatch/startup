evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Current recognized revenue, ARR, gross margin, services mix, NRR or GRR, cash balance, burn, runway, debt, and
      secondary-sale terms.
    whyItMatters: >-
      The 2024 financing valuation cannot be assessed against current operating economics or liquidity without these
      measures.
    diligencePath: >-
      Request audited statements, monthly management accounts, cohort retention schedules, cash and debt statements, and
      the current cap table under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      A current executive roster, biographies, legal board membership, ownership percentages, voting rights, succession
      coverage, and advisory-board charters.
    whyItMatters: >-
      The available sample cannot establish founder-market fit, key-person dependence, formal control, or preference
      economics.
    diligencePath: >-
      Request the organization chart, executive biographies, board minutes and consents, charter documents, cap table,
      voting agreements, and financing documents.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: entity-resolution
    missingEvidence: A reconciled, legal-entity-level employee roster with payroll geography and contractor treatment.
    whyItMatters: >-
      The third-party 570-person record appears to resolve to a different Watershed entity and cannot validate the
      target company's headcount.
    diligencePath: >-
      Match the legal company name and domains in the cap table to payroll records, then reconcile employees and
      contractors by geography.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: milestone-timeline
    missingEvidence: >-
      Source-dated evidence for early financing rounds, incorporation, legal or regulatory events, acquisitions, and
      material leadership changes.
    whyItMatters: >-
      The assigned pool supports seven timeline points, below the chapter quality bar of eight unless the missing
      history is documented.
    diligencePath: >-
      Review incorporation records, archived company announcements, financing filings, acquisition documentation, and
      dated leadership releases in full diligence.
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      An independent category study with a reproducible enterprise sustainability software boundary, base year,
      geography, revenue denominator, services treatment, and forecast method.
    whyItMatters: >-
      Without transparent methodology, the nearly $1.2 billion 2028 category estimate cannot anchor valuation or
      company-level penetration.
    diligencePath: >-
      Obtain the underlying analyst dataset and reconcile its vendor, product, geography, and revenue definitions to
      Watershed's actual offering.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Contract pricing, ACV distribution, payer, budget owner, sales-cycle duration, implementation effort, renewal
      authority, retention, and paid-module penetration by segment.
    whyItMatters: Buyer need does not establish willingness to pay, durable budget ownership, or an attainable serviceable market.
    diligencePath: >-
      Review CRM cohorts, executed contracts, renewal records, implementation logs, and customer references segmented by
      geography, size, and workflow.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent evidence on policy sensitivity, failed or delayed deployments, switching costs, procurement friction,
      and realized customer ROI.
    whyItMatters: >-
      Company-issued demand signals cannot by themselves establish adoption timing, conversion, or resilience if
      reporting mandates change.
    diligencePath: >-
      Interview customers and lost prospects, inspect implementation and churn cohorts, and compare pipeline conversion
      before and after material policy changes.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: private-evidence-only
    severity: material
    topic: competitor-win-loss-rates
    missingEvidence: >-
      Granular direct win-loss rates, competitive displacement statistics, and head-to-head renewal churn percentages
      against Persefoni, Sweep, and Workiva.
    whyItMatters: >-
      Without competitive renewal retention data, investors cannot verify whether Watershed's premium pricing is
      defensible against lower-cost or bundled alternatives.
    diligencePath: >-
      Request customer cohort displacement logs, procurement bake-off win rates, and third-party contract renewal
      records during management diligence.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: incumbent-erp-market-share
    missingEvidence: >-
      Quantitative market share and adoption velocity of native greenhouse gas ledgers released by ERP incumbents such
      as SAP and Microsoft.
    whyItMatters: >-
      Direct ERP embedded modules represent the primary long-term threat of platform commoditization and margin
      compression for standalone carbon SaaS vendors.
    diligencePath: >-
      Review enterprise technology procurement surveys and customer case studies tracking SAP and Microsoft
      sustainability ledger implementations.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited financial statements detailing recognized annual revenue, GAAP gross margins, and customer cohort Net
      Revenue Retention (NRR).
    whyItMatters: >-
      Without verified GAAP revenue and retention metrics, underwriting the durability of Watershed's $1.8B valuation is
      fundamentally unsupportable from public data.
    diligencePath: >-
      Obtain confidential management presentation, historical audited income statements, and SaaS cohort retention
      schedules under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: balance-sheet-and-burn
    missingEvidence: >-
      Current cash on hand, operating cash burn rate, capital expenditure commitments, and debt or line-of-credit
      obligations.
    whyItMatters: >-
      Determines whether Watershed is operating cash-flow positive or requires another financing round under tightened
      venture capital conditions.
    diligencePath: >-
      Request monthly cash flow statements, bank statements, and forward 24-month operating budget models from company
      leadership.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      Audited system uptime SLAs, latency benchmarks for transaction ingestion, proprietary prompt templates for AI
      agents, and complete technical specifications for ERP connectors.
    whyItMatters: >-
      Without public technical benchmarks or open-source connectors, enterprise IT diligence cannot independently verify
      data pipeline scalability, API availability, or algorithmic factor mapping precision.
    diligencePath: >-
      Request architecture whitepapers, third-party SOC 2 Type II audit reports, API latency metrics, and sample
      integration connector scripts in an NDA-governed technical data room.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive census of enterprise production deployments, contract renewal outcomes, and usage metrics across the
      broader customer base beyond the sample in TU003.
    whyItMatters: >-
      Public case studies highlight favorable operational outcomes at reference accounts, but full-base deployment
      success and contract satisfaction cannot be evaluated from a sample.
    diligencePath: Review full customer account roster and deployment status logs in company dataroom.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates segmented by annual
      contract value (ACV) tiers.
    whyItMatters: >-
      Essential to determine whether customer expansion is driven by recurring software adoption or temporary
      consulting-heavy reporting projects.
    diligencePath: Request confidential historical cohort retention tables and renewal bridge documentation from company management.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Percentage of Annual Recurring Revenue (ARR) generated by the top 5, 10, and 20 enterprise customer accounts.
    whyItMatters: >-
      High account concentration in early tech enterprise accounts or private equity sponsors could expose revenue to
      sudden client attrition.
    diligencePath: Inspect audited customer concentration tables in confidential dataroom documentation.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: incidents-and-disputes
    missingEvidence: >-
      Primary court, regulator, incident, outage, and arbitration records covering Watershed and its carbon-project
      activity.
    whyItMatters: >-
      Search-result absence cannot establish that no private dispute, enforcement action, security event, or material
      outage occurred.
    diligencePath: >-
      Obtain litigation and claims schedules, regulator correspondence, incident and outage registers, insurance
      notices, and outside-counsel confirmation.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Audited revenue, ARR bridge, gross margin, burn, cash, debt, runway, preferences, and customer concentration.
    whyItMatters: >-
      Funding raised and a third-party revenue estimate do not measure liquidity, loss rate, financing need, or downside
      protection.
    diligencePath: >-
      Review monthly financial statements, bank balances, capitalization table, debt and preference documents, cohort
      retention, and board-approved operating plan.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-and-contractual-register
    missingEvidence: >-
      Complete jurisdictional obligations, enterprise contract deviations, privacy addenda, and carbon-project claims
      requirements.
    whyItMatters: >-
      The public terms and one RFP article cannot establish the full legal population or rank all exposures
      conclusively.
    diligencePath: >-
      Have privacy, product, and climate counsel map applicable rules and sample executed customer and supplier
      agreements by jurisdiction.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: governance-and-succession
    missingEvidence: >-
      Board composition, executive decision rights, key-person retention, succession plans, and specialist-team
      attrition.
    whyItMatters: >-
      A public leadership directory does not establish governance quality, redundancy, or capacity to remediate
      operating failures.
    diligencePath: >-
      Interview board and functional leaders; inspect org charts, succession plans, regretted attrition, vacancy aging,
      and roadmap ownership.
    relatedQuestionRefs:
      - QR004
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: scenario-inputs
    missingEvidence: >-
      Audited revenue and ARR definitions, recurring mix, gross margin, services mix, retention, concentration, cash,
      debt, burn, and operating plan.
    whyItMatters: These inputs are required to build supportable bull, base, and bear valuation ranges and target returns.
    diligencePath: >-
      Review audited statements, revenue-recognition policies, customer cohorts, the operating model, bank statements,
      and the debt schedule in the data room.
    relatedQuestionRefs:
      - QV006
    relatedTableRefs:
      - TV003
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A company-confirmed financing history reconciling $185M, $254M, $295M, and the securities included by each data
      provider.
    whyItMatters: Funding raised is not cash available, and inconsistent round definitions prevent a reliable capitalization bridge.
    diligencePath: >-
      Reconcile board-approved financing documents, stock-purchase agreements, capitalization records, debt, grants, and
      extension rounds.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Recent arm's-length secondary trades, current fully diluted ownership, the complete preference waterfall, and a
      documented IPO or strategic-exit plan.
    whyItMatters: >-
      Low displayed activity and an unavailable matched price do not establish liquidity, executable value, or exit
      timing.
    diligencePath: >-
      Obtain completed-trade records by security class, current charter and cap table, banker materials, board exit
      planning, and buyer or IPO-readiness evidence.
    relatedQuestionRefs:
      - QV009
