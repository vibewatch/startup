company:
  name: "Watershed"
chapter:
  number: 7
  title: "Risks"
  summary: "Watershed's clearest public risks are data-and-service accountability shifted toward users, execution across third-party carbon projects, and product/talent demands that remain only partly mitigated in public evidence. Contractual protections, reported financing, supplier diligence, and human-review controls reduce some exposure, but public sources do not establish incident history, cash runway, customer concentration, control effectiveness, or succession readiness."
sections:
  - id: "legal-and-regulatory-exposure"
    title: "Legal and Regulatory Exposure"
    body: >-
      The strongest primary evidence in the allocated source set is Watershed's data-portal contract, not a regulator or court record. The live terms permit service changes or suspension, require users to secure data rights and consents, send personal information to the United States, impose individual arbitration, and limit specified liability. Those provisions can reduce contractual exposure, but they do not demonstrate operating resilience, regulatory compliance, or enforceability in every customer agreement. Carbon-market activity adds another legal-quality surface because Watershed reportedly handles supplier diligence, contracting, and delivery for participating buyers. The resulting priority is to inspect enterprise MSAs, DPAs, regulatory correspondence, and project-quality representations rather than treat public boilerplate as a complete mitigation.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR005"
      - "CR007"
      - "CR014"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-security"
    title: "Operational, Quality, and Security Exposure"
    body: >-
      Watershed's outputs depend on customer-supplied data, while its terms disclaim assurances that content is accurate or that the service is uninterrupted or secure. This allocation of responsibility is commercially important: a reporting error or outage near a disclosure deadline could still damage renewals even when contract language limits recovery. The company markets built-in human review and transparent calculations as controls, but the source set contains no control audit, error-rate series, uptime history, penetration-test result, or incident register. A historical Verdantix assessment also identified category-level gaps in internal carbon pricing, project portfolio management, and Scope 3 analysis beyond standard methodologies, making current capability verification a diligence requirement rather than a settled weakness.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR008"
      - "CR009"
      - "CR015"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "dependencies-and-financial-model"
    title: "Partner, Leadership, and Financial-Model Dependencies"
    body: >-
      Watershed's 2026 carbon RFP reportedly aggregates more than 800 corporate buyers and places supplier diligence, contracting, and delivery inside its procurement model. Scale strengthens network utility but also raises the consequence of project under-delivery or integrity disputes. Financing evidence is similarly incomplete: the company announced a $100 million Series C at a $1.8 billion valuation in 2024, Multiples reports a separate $15 million round in January 2026, and GetLatka estimates 2025 annual revenue at $108.3 million. Funding raised is not cash available, and estimated revenue is not audited revenue or ARR. The public leadership directory shows a broader functional bench, but it does not establish decision rights, succession, or key-person redundancy.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "monitoring-and-thesis-breaks"
    title: "Monitoring Indicators and Thesis-Break Triggers"
    body: >-
      The investment case should break or pause if diligence shows repeated material reporting errors, missed disclosure deadlines, a significant security event without timely remediation, carbon-project delivery failures, or customer agreements that override the public liability protections without compensating controls. Financial escalation triggers are runway below an agreed board threshold, materially weaker renewal economics, or financing terms that subordinate new capital; none can be measured from the public source set. Near-term monitoring should therefore require quarterly uptime and incident reporting, calculation-error sampling, project-delivery cohorts, customer and supplier concentration, audited revenue quality, burn and runway, and named succession coverage. Absence of a search result for litigation, breach, or outage is recorded as an evidence gap, not evidence that no event occurred.
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR005"
      - "CR008"
      - "CR010"
      - "CR012"
      - "CR014"
      - "CR016"
