chapter:
  number: 2
  title: "Market Analysis"
  summary: "Watershed addresses enterprise sustainability data, emissions measurement, disclosure, and selected decarbonization workflows rather than the unrelated water-monitoring markets surfaced by its name. Public evidence supports regulatory and Scope 3 demand signals, but it does not support a defensible standalone TAM, SAM, or SOM."
sections:
  - id: "market-boundary"
    title: "A narrow enterprise-software boundary"
    body: >-
      The investable market boundary is enterprise sustainability software: data ingestion and
      cleaning, emissions-factor mapping, carbon measurement, analysis, and reporting for complex
      organizations. Watershed also extends into carbon and clean-power procurement, but those
      transactions are adjacent to the core software workflow rather than proof that all climate
      spending belongs in its addressable market. CEDA sits inside the measurement data layer,
      with Watershed publishing coverage of 60,000 emission factors, 400 industries, and 148
      countries or regions. Conservation services, physical watershed sensors, water-quality
      auctions, and a freight-rail geography called the Carload Watershed Market are excluded.
      Treating those homonyms as Watershed's TAM would combine different buyers, units, budgets,
      and products.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM001"
  - id: "sizing-evidence"
    title: "Sizing evidence is directional, not investable"
    body: >-
      The assigned evidence contains one secondary estimate that the carbon management software
      sector could reach nearly $1.2 billion by 2028, but the page does not disclose geography,
      base year, methodology, CAGR, or whether services and transaction revenue are included.
      That figure is therefore a low-confidence category signal, not a company TAM. Other numbers
      in the pool are not substitutes: Dataintelo's $1.42 billion 2024 estimate and 8.7% 2025-2033
      CAGR concern physical watershed sensor data platforms, while CEDA's factor, industry, and
      country counts describe product breadth rather than spend. The evidence supports a layered
      category map and adoption proxies, but not a precise TAM, SAM, SOM, or attainable revenue
      share for Watershed.
    claimRefs:
      - "CM002"
      - "CM004"
      - "CM008"
      - "CM009"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers emerge from workflow complexity"
    body: >-
      Public evidence points to sustainability teams as the primary users and to complex global
      enterprises as the customer context. Watershed's 2024 financing announcement described use
      across financial institutions, consumer brands, and professional-services companies, with
      workflows spanning portfolio decarbonization, supplier and material decisions, and net-zero
      execution. Multiples separately describes a B2B subscription model and more than 500
      corporate customers, but its methodology is not shown. The adoption path appears to start
      with fragmented enterprise data, proceed through measurement and disclosure, and expand
      toward procurement or decarbonization. The reviewed sources do not identify contract values,
      economic payers, budget owners, implementation duration, or renewal authority, so those
      fields remain explicit diligence gaps rather than inferred facts.
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Regulation helps, but evidence quality constrains the forecast"
    body: >-
      Demand is plausibly supported by disclosure obligations, Scope 3 complexity, annual
      emissions-factor updates, and enterprise pressure to connect measurement with action. In
      2024, Watershed said more than 10,000 companies were required to file under the EU's CSRD
      and that more than two-thirds of the Fortune 500 had significant climate pledges. Those are
      company-issued demand indicators, not an independent forecast of software budgets or
      conversion. Free Open CEDA also creates a low-cost measurement entry point, while the paid
      CEDA package adds data breakdowns, support, and services; public pricing is absent. The main
      constraints are therefore not a demonstrated lack of workflow need, but uncertain budget
      ownership, unknown willingness to pay, policy sensitivity, implementation friction, and the
      absence of independently reproducible category sizing.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM007"
      - "CM015"
      - "CM016"
