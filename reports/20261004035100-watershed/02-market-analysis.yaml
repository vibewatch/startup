callouts:
  - calloutType: "risk"
    title: "Do not turn homonyms into TAM"
    body: "The assigned pool contains water-quality auctions, water-sensor platforms, conservation services, and a freight-rail market that use the word watershed but do not measure demand for Watershed's enterprise sustainability software."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
  - calloutType: "recommendation"
    title: "Underwrite from private cohort evidence"
    body: "A credible SAM and SOM require target-account counts, pricing, paid-module penetration, implementation capacity, conversion, retention, and policy-sensitivity data that are absent from the reviewed public evidence."
    claimRefs:
      - "CM015"
      - "CM016"
