figures:
  - id: "FM001"
    title: "Evidence-constrained addressability ladder"
    type: "pyramid"
    summary: "A qualitative narrowing from broad category demand to Watershed's unquantified reachable market without mixing incompatible market values."
    data:
      items:
        - label: "Enterprise sustainability and climate workflows"
          value: "Unquantified"
          detail: "Broad category that includes measurement, reporting, analysis, and action; no reproducible total-spend estimate was retained."
        - label: "Carbon management software"
          value: "Nearly $1.2B by 2028"
          detail: "Secondary category estimate from Multiples; geography, base year, CAGR, methodology, and service boundary are not disclosed."
        - label: "Complex organizations with sustainability data needs"
          value: "Unquantified"
          detail: "Regulation and climate pledges indicate workflow need but do not establish software budget or conversion."
        - label: "Scope 3 and disclosure users"
          value: "Unquantified"
          detail: "Watershed targets data-intensive measurement and reporting users; public sources do not isolate the serviceable population."
        - label: "Watershed corporate customer context"
          value: "More than 500 reported"
          detail: "Multiples-reported customer proxy with no disclosed active-module, paid-seat, or revenue denominator."
        - label: "Defensible SAM and SOM"
          value: "Gap"
          detail: "Pricing, win rates, target-account count, retention, implementation capacity, and geographic eligibility are unavailable."
    approximationNotes: "Not to scale. The layers mix one low-transparency category forecast with nonfinancial adoption proxies; no conversion rate or proportional area is implied."
    claimRefs:
