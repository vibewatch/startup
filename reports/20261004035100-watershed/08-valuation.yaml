    title: "Recommendation Logic"
    type: "flow"
    summary: "The public-evidence chain moves from financing references through an unverified denominator and weak price discovery to a research-more conclusion."
    data:
      nodes:
        - id: "financing-mark"
          label: "$1.8B company-announced post-money valuation in February 2024"
        - id: "later-reference"
          label: "$1.85B Forge incorporation-record-derived post-money reference in December 2025"
        - id: "revenue-denominator"
          label: "$108.3M estimated 2025 annual revenue; not verified ARR"
        - id: "proxy-multiple"
          label: "16.6x-17.1x post-money-to-estimated-revenue proxy; not EV/revenue"
        - id: "secondary-channel"
          label: "EquityZen describes existing-shareholder access"
        - id: "liquidity-check"
          label: "Forge activity low; no available matched price"
        - id: "decision"
          label: "Research more before setting price, return, hold, or exit assumptions"
      edges:
        - from: "financing-mark"
          to: "later-reference"
        - from: "later-reference"
          to: "revenue-denominator"
        - from: "revenue-denominator"
          to: "proxy-multiple"
        - from: "proxy-multiple"
          to: "secondary-channel"
        - from: "secondary-channel"
          to: "liquidity-check"
        - from: "liquidity-check"
          to: "decision"
    approximationNotes: "The multiple is arithmetic on post-money valuation and a third-party annual-revenue estimate; it is not an enterprise-value multiple or a fair-value estimate."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV014"
      - "CV016"
