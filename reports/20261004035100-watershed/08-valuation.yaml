schemaVersion: "report-v2"
artifact: "valuation"
slug: "watershed"
runDate: "2026-10-04"
company:
  name: "Watershed"
chapter:
  number: 8
  title: "Valuation"
  summary: "Watershed's last company-announced financing set a $1.8B post-money valuation in February 2024, while Forge displays a later $1.85B incorporation-record-derived mark but no available matched price. Public evidence supports a research-more recommendation: the only revenue figure is an unverified third-party estimate, funding totals conflict, and the evidence does not support a fair-value range or target return."
sections:
  - id: "thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: >-
      The investable thesis is enterprise reach rather than demonstrated economics. ESG News reports more than
      800 business customers, including 90 Fortune 500 companies, while Watershed claims 4.1 gigatonnes of
      emissions under management. ESG News also reports that customers, not Watershed itself, committed more than
      $120M to decarbonization projects; that figure is marketplace activity and must not be treated as revenue.
      These signals indicate workflow breadth and a sizable corporate network, but they do not disclose contracted
      recurring revenue, retention, gross margin, cash use, or customer concentration. The anti-thesis is therefore
      an evidence mismatch: visible operating scale and product activity are being compared with a private-company
      price without the audited financial bridge needed to judge whether adoption converts into durable equity value.
    claimRefs:
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "financing-and-entry-discipline"
    title: "Financing Context and Entry Discipline"
    body: >-
      Watershed announced a $100M Series C at a $1.8B valuation in February 2024, independently repeated by ESG
      Dive. Forge displays a December 2025 Series C record of $114.96M at a $1.85B post-money valuation and $9.76
      per share, but explains that post-money valuation is estimated from company-submitted incorporation records.
      Forge also labels market activity low and provides neither a Forge Price nor a last matched price. The public
      evidence therefore supplies financing reference points, not an executable entry price. Forge lists a 1.0x
      non-participating liquidation preference and a 6% non-cumulative dividend for the displayed Series C terms;
      investors still need the complete capitalization table, debt, cash, option pool, and preference waterfall
      before translating headline post-money value into common-equity economics.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "valuation-method-and-scenarios"
    title: "Valuation Method and Scenario Boundaries"
    body: >-
      GetLatka estimates $108.3M of annual revenue for 2025; the fetched page does not establish that the figure is
      audited or that it is ARR. Dividing the $1.8B-$1.85B post-money references by that estimate produces a rough
      16.6x-17.1x valuation-to-estimated-annual-revenue proxy, not an enterprise-value-to-revenue multiple because
      net debt and cash are unknown. Multiples offers a comparator set spanning companies such as C3.ai, Feedzai,
      Persona, and Quantexa, but those business models do not establish a like-for-like sustainability-software
      benchmark. Accordingly, bull, base, and bear cases are framed as diligence conditions rather than invented
      forecasts. No probability, fair-value range, target return, hold period, or exit multiple is supportable until
      audited revenue quality, retention, margins, capitalization, and a defensible comparable set are available.
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-exit-readiness"
    title: "Recommendation, Exit Readiness, and Thesis-Break Tests"
    body: >-
      The recommendation is research-more with medium confidence, high underwriting risk, and a stretched public-
      evidence valuation stance. This is not a judgment that the company lacks operating quality; it reflects the
      absence of a verified financial denominator and observable liquidity at the cited financing marks. EquityZen
      describes a channel through which existing stockholders may sell interests via its funds, but its public page
      does not disclose a current Watershed price. Forge similarly reports low activity and no available matched
      price, so neither page proves exit readiness or price discovery. A buy case would require audited financials,
      cohort retention, gross-margin and services-mix data, current cash and burn, a fully diluted cap table and
      preference waterfall, recent arm's-length secondary transactions, and a documented exit pathway. Failure on
      those tests is the thesis-break condition; a lower headline price alone would not cure weak economics.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV014"
      - "CV016"
