    title: "Recommendation Summary"
    columns:
      - "Recommendation"
      - "Confidence"
      - "Risk rating"
      - "Valuation stance"
      - "Decision implication"
    rows:
      - - "research-more"
        - "medium"
        - "high"
        - "stretched on public evidence"
        - "Do not underwrite at the $1.8B-$1.85B financing references without audited operating data, a fully diluted capitalization table, and executable price evidence."
    notes: "The $1.8B and $1.85B figures are post-money financing references, not verified current market-clearing prices; the recommendation does not assign a fair-value range."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV010"
      - "CV016"
  - id: "TV002"
    title: "Thesis and Anti-Thesis"
    columns:
      - "Evidence dimension"
      - "Thesis"
      - "Anti-thesis"
      - "What would change the view"
    rows:
      - - "Enterprise reach"
        - "ESG News reports more than 800 businesses and 90 Fortune 500 customers."
        - "The count is not an audited active-customer or revenue-concentration schedule."
        - "Contract-level active-customer counts, cohort revenue, and concentration by top accounts."
      - - "Platform footprint"
        - "Watershed claims 4.1Gt of emissions under management."
        - "Emissions managed is not revenue, retention, or monetized transaction volume."
        - "A reconciliation from managed emissions to paid modules, contract value, and renewal behavior."
      - - "Marketplace activity"
        - "ESG News reports more than $120M committed by Watershed customers to climate projects."
        - "Customer project commitments are not Watershed revenue or assets."
        - "Recognized marketplace revenue, take rate, gross margin, and supplier-performance data."
      - - "Financing validation"
        - "Company and independent reporting align on the February 2024 $100M round and $1.8B valuation."
        - "A financing valuation is not evidence of an executable current price."
        - "Recent arm's-length transactions with price, volume, security class, and rights."
      - - "Capital protections"
        - "Forge exposes selected Series C preference terms."
        - "The complete waterfall, debt, cash, option pool, and all senior rights remain unavailable."
        - "Current charter, capitalization table, debt schedule, and modeled exit waterfall."
      - - "Liquidity pathway"
        - "EquityZen describes access to existing-shareholder liquidity."
        - "Forge reports low activity and no available matched price."
        - "Completed secondary trades and a documented IPO or strategic-exit readiness plan."
    notes: "Coverage is limited to the successful prefetched sources; company metrics are labeled as claims, and marketplace commitments are kept separate from revenue."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
  - id: "TV003"
    title: "Bull, Base, and Bear Diligence Scenarios"
    columns:
      - "Case"
      - "Explicit assumptions"
      - "Valuation and return logic"
      - "Probability signal"
      - "Downside trigger"
    rows:
      - - "Bull"
        - "Audited recurring revenue exceeds the third-party annual-revenue estimate; retention and gross margin demonstrate software-quality economics; enterprise breadth converts to expansion."
        - "A fair-value range and target return require a verified net-debt bridge, preference-adjusted fully diluted ownership, and business-model-matched revenue multiples."
        - "Customer breadth and marketplace activity are positive signals, but public evidence cannot support a numerical probability."
        - "Retention, margin, or services-mix diligence fails to confirm scalable software economics."
      - - "Base"
        - "The $108.3M estimate is directionally useful but unverified; the latest displayed financing marks remain reference points rather than clearing prices."
        - "The rough 16.6x-17.1x post-money-to-estimated-revenue proxy supports research-more, not a target valuation."
        - "Conflicting funding totals and absent matched-price data prevent a defensible numerical probability."
        - "No current secondary transactions or capitalization evidence is produced during diligence."
      - - "Bear"
        - "Revenue quality is weaker than the estimate implies, liquidity stays low, and preferred rights absorb more exit value than common holders expect."
        - "Downside cannot be quantified without the current cap table and waterfall; a down round or discounted secondary is plausible but not established."
        - "Forge's low-activity label and the lack of a published matched price are cautionary, not proof of a future loss."
        - "Audited KPIs miss management's plan, financing requires senior terms, or recent common-share trades clear materially below the financing reference."
    notes: "These are conditional diligence cases, not forecasts; no unsupported valuation ranges, probabilities, ARR figures, exit multiples, or return targets are assigned."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV016"
figures:
