        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Watershed 主要通过多层级年度订阅变现气候企业软件，而不是自助式目录交易。商业合作会围绕客户规模、实体层级、数据摄取复杂度，以及 CSRD 和 CDP
              等所需报告框架的广度定制。除核心软件席位和自动化温室气体核算外，公司还从 Scope 3 供应链参与活动、CEDA 排放因子等数据模块授权，以及碳信用采购市场的交易撮合中获得收入。但由于 Watershed
              没有公开正式价目表，也没有披露软件授权与专业上线服务之间的实际收入结构，要判断合同稳定性和利润率持久性，仍需深入审查客户群经济性。
