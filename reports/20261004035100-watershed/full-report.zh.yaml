      - number: '7.3'
        title: 合作伙伴、管理层与财务模型依赖
        blocks:
          - type: paragraph
            body: >-
              Watershed 的 2026 年碳 RFP 据报道聚合了 800 多个企业买方，并把供应商尽调、签约和交付纳入其采购模式。规模增强网络效用，但也放大了项目交付不足或完整性争议的后果。融资证据同样不完整：公司在
              2024 年宣布以 $1.8B 估值完成 $100 million C 轮，Multiples 报告称 2026 年 1 月另有 $15 million 融资，GetLatka 估算 2025 年年度收入为
              $108.3 million。融资额不等于可用现金，估算收入也不等于经审计收入或 ARR。公开管理层目录显示职能团队更完整，但无法确认决策权、继任安排或关键人物冗余。
