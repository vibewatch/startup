  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资论点在于企业触达，而不是已证明的经济性。ESG News 报道有超过 800 家企业客户，其中包括 90 家财富 500 强公司；Watershed 声称管理中的排放量为 4.1
              gigatonnes。ESG News 还报道，超过 $120M 的脱碳项目承诺来自客户，而非 Watershed
              本身；该数字代表市场活动，不能当作收入。这些信号显示工作流广度和规模可观的企业网络，但没有披露签约经常性收入、留存、毛利率、现金使用或客户集中度。因此，反论点是证据错配：可见的运营规模和产品活动正在与一家私营公司的价格比较，但缺少审计财务桥梁，无法判断采用是否转化为持久的股权价值。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
