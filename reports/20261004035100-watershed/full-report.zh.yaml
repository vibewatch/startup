      - number: '4.3'
        title: 成本结构与单位经济性分析
        blocks:
          - type: paragraph
            body: >-
              Watershed 的结构性成本由纯云软件基础设施和高领域密度的气候顾问开销构成。要交付可审计的温室气体清单，需要持续用云计算处理企业 ERP
              和供应链记录、获得外部排放数据集授权，还要由内部气候科学和政策团队验证计算方法。此外，初始基线设置需要解决方案工程和客户成功人员，帮助企业可持续发展团队处理分散的供应商数据流。因此，实施顾问开销会压低真正的软件毛利率；但确切毛利率、净收入留存率和获客回本周期仍属私有信息，长期经营杠杆存在很大不确定性。
