            body: 除纯软件席位授权外，Watershed 的碳移除 RFP 机制把 800 多个买方的企业采购力聚合起来。撮合超过 $120M 的脱碳承诺，形成了随自愿气候资本支出扩张的交易型收入路径，而不是只随软件席位数增长。
