              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.3'
        title: 估值方法与情景边界
        blocks:
          - type: paragraph
            body: >-
              GetLatka 估算 2025 年年度收入为 $108.3M；抓取页面没有证明该数字经过审计，也没有证明它是 ARR。用该估算除以 $1.8B—$1.85B 投后估值参考值，可得到约 16.6x—17.1x
              的估算年度收入估值代理，而不是企业价值倍数，因为净债务和现金未知。Multiples 提供了包括 C3.ai、Feedzai、Persona 和 Quantexa
              在内的可比公司集合，但这些公司的商业模式不能构成同类可比的可持续发展软件基准。因此，乐观、基准和悲观情景应被表述为尽调条件，而不是捏造的预测。在获得经审计的收入质量、留存、利润率、资本结构和可辩护的可比公司集合前，任何概率、合理价值区间、目标回报、持有期或退出倍数都无法得到支撑。
            claimRefs:
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: 建议、退出准备度与论点破坏测试
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，置信度中等、投资判断风险高，公开证据下的估值立场偏高。这不是判断公司运营质量欠佳，而是因为引用的融资定价没有经验证的财务分母，也看不到可观察的流动性。EquityZen
              描述了现有股东可通过其基金出售权益的渠道，但其公开页面没有披露当前 Watershed 价格。Forge
              同样报告市场活跃度低且没有可用撮合价格，因此两者都不能证明退出准备度或价格发现。买入论点需要经审计财务报表、客户群留存、毛利率和服务收入占比、当前现金和消耗、完全摊薄资本结构表及优先权瀑布、近期公平交易的二级市场交易，以及有记录的退出路径。未通过这些测试就是论点被破坏的条件；仅仅降低账面价格不能修复薄弱的经济性。
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 公开记录支持继续研究，而不是买入：融资定价可见，但经审计的经济性、可执行的价格发现和经优先权调整的持股桥梁均不可见。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV016
          - type: callout
            title: 筹资额不等于可用现金
            body: 已发布的融资总额互相冲突，保留来源中没有任何一个能证明当前现金、消耗、债务或跑道。不能把这些总额当作流动性余额。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
