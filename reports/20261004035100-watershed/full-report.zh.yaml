  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、同行类别与现状替代方案
        blocks:
          - type: paragraph
            body: >
              企业碳核算和可持续发展软件行业明显分成多个竞争类型。企业买方面对的不是由同类产品服务的统一市场，而是在气候原生 SaaS 专业公司、更广泛的 ESG
              合规与披露平台、传统企业资源规划套件、托管式顾问服务，以及内部电子表格现状工作流之间做选择。


              Persefoni 和 Sweep 等直接的气候优先同行争夺核心企业排放管理业务。Persefoni 专注于投资级温室气体核算，并针对融资排放和资本市场深度对接 Partnership for Carbon
              Accounting Financials（PCAF）。Sweep 强调灵活、基于规则的可持续发展情报，在分散的运营业务单元中覆盖碳排放以及更广泛的非气候 ESG 框架。与此同时，Workiva 等传统报告套件和
              IBM Envizi 等企业数据聚合商，面向复杂的多实体架构处理企业披露以及环境、健康与安全要求。


              在商业软件同行之外，最主要的现状竞争者仍是内部电子表格模型和临时商业智能工具，例如 Microsoft Power BI 和
              Tableau。手工电子表格流程没有增量软件许可支出，但版本控制脆弱、缺乏可辩护的数据血缘，也难以经受第三方审计。相反，Hydrus
              等托管式可持续发展合规服务把专业软件和部分运营能力打包，直接挑战资源受限组织中的纯软件平台。
            claimRefs:
