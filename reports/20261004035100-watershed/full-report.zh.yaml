  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管暴露
        blocks:
          - type: paragraph
            body: >-
              分配来源集中最强的一手证据是 Watershed
              的数据门户合同，而不是监管机构或法院记录。现行条款允许变更或暂停服务，要求用户取得数据权利和同意，将个人信息发送到美国，规定个别仲裁，并限制特定责任。这些条款可以降低合同暴露，但不能证明运营韧性、监管合规或每份客户协议都可执行。碳市场活动又增加了法律质量风险面，因为据报道
              Watershed 为参与买方处理供应商尽调、签约和交付。因此，优先事项应是检查企业 MSA、DPA、监管往来和项目质量陈述，而不是把公开通用条款视为完整缓释措施。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR014
