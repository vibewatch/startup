            body: >-
              公开证据显示，可持续发展团队是主要用户，复杂的全球企业是客户场景。Watershed 的 2024
              年融资公告称，其应用覆盖金融机构、消费品牌和专业服务公司，工作流涉及投资组合脱碳、供应商与材料决策以及净零执行。Multiples 另称其采用 B2B 订阅模式，拥有超过 500
              家企业客户，但未展示其方法。采用路径似乎从碎片化企业数据开始，经由测量和披露，最终扩展到采购或脱碳。已审阅来源没有识别合同金额、实际付费方、预算负责人、实施周期或续约决策权，因此这些字段应保留为明确的尽调缺口，不能推断为事实。
