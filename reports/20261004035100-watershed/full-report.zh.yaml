      - number: '3.3'
        title: 定价结构、切换摩擦与竞争壁垒持久性
        blocks:
          - type: paragraph
            body: >
              商业合作模式和产品打包方式强化了行业分层。Watershed 采用不透明、销售驱动的企业订阅模式，不公开价目表；把模块扩展和实施顾问服务计入后，大型企业客户的年度合同金额可达六位数。相比之下，Persefoni
              等竞争者提供透明的免费增值层级（包括免费的 Pro 计划和报价制 Advanced 层级），降低了中型市场进入者的采用摩擦。


              企业碳管理的切换成本主要来自历史数据血缘、定制 ERP 摄取连接器和组织工作流，而非技术锁定。客户一旦采用 Watershed
              的活动数据模式和审计轨迹，把历史基准排放迁移到其他平台，就可能与外部鉴证机构的审计结果出现差异。此外，Watershed 的市场机制把 800
              多个买方的企业采购聚合起来，形成单点碳核算工具难以复制的双边网络流动性。


              不过，Watershed 仍面临长期商品化和替代风险。随着 SAP 和 Microsoft
              等基础企业资源规划供应商把原生温室气体台账直接嵌入通用交易核算系统，独立碳核算引擎可能承受利润率压缩。同时，托管式合规服务的出现，可能让缺少专职内部可持续发展工程团队的企业放弃自助式软件模式。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
