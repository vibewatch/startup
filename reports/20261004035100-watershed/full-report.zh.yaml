chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >
              Watershed 将自己定位为企业可持续发展 AI 平台，工作流覆盖数据采集、数据清洗、排放因子映射、分析和报告。公司称其于 2019
              年起步；独立融资数据库将旧金山列为其所在地。其关于页面列出旧金山、伦敦、纽约、悉尼、巴黎、柏林和墨西哥城办公室，并称团队接近 400
              人。这些陈述确认了目标实体及其广泛的产品覆盖面，但指定证据没有披露定价、合同结构、实施服务占比或法定总部实体。


              产品定位证据主要来自公司自身。Watershed 在 2026 年的公告称，IDC 将其评为碳核算和管理应用领域的领导者；官网还描述了 Verdantix 和 Forrester
              的其他认可。由于指定来源池不包含底层分析师报告，这些内容应保留为公司口径，而非独立基准验证。证据支持其广泛的企业平台描述，但不足以推断客户层面的采用深度或软件经济性。
