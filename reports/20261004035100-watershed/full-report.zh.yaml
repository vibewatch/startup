      - number: '3.2'
        title: 能力分析、功能矩阵与平台权衡
        blocks:
          - type: paragraph
            body: >
              平台比较显示，领先产品在架构深度、排放因子集成和自动化范围上存在实质差异。Watershed 主要靠自动化数据摄取引擎、包括其收购的 CEDA
              数据库在内的专有排放因子库，以及产品碳足迹（PCF）拆解工具实现差异化。


              在第三方软件评估中，Watershed 入选 Verdantix 企业碳管理软件 Green Quadrant 和 Forrester 可持续发展管理软件 Wave 的领导者。             
              不过，能力评估也显示了取舍：Watershed 对运营碳足迹和整合式自愿脱碳市场挖得较深；至于更广泛的非气候 Corporate Sustainability Reporting
              Directive（CSRD）议题，尤其是社会和治理标准（ESRS S1–S4 和 G1），覆盖度不如统一治理套件成熟。


              同行还保有本地化优势。Persefoni 通过专门的 PCAF 计算引擎，在银行和私募股权投资组合上提供更强的原生深度；Watershed
              的金融投资组合工作流则需要定制数据映射。对于需要大量跨部门人工协作的全球企业，用户反馈显示，自助式气候平台可能带来沉重的管理配置负担：在产出可审计披露前，可持续发展、财务和企业资源规划系统往往需要数月配置。
            claimRefs:
