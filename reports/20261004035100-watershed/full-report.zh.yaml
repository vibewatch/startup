              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Watershed 于 2024 年 2 月宣布以 $1.8B 估值完成 $100M C 轮，ESG Dive 也独立重复了这一信息。Forge 显示一笔 2025 年 12 月的 C 轮记录：融资额
              $114.96M，投后估值 $1.85B，每股 $9.76；但它解释称，投后估值是根据公司提交的注册记录估算的。Forge 还将市场活跃度标为低，既没有提供 Forge
              Price，也没有提供最近一次撮合价格。因此，公开证据只能提供融资参考点，不是可执行的入场价格。Forge 列出所显示 C 轮条款为 1.0x 不参与型清算优先权和 6%
              非累积股息；投资者仍需完整资本结构表、债务、现金、期权池和优先权分配瀑布，才能把账面投后价值转换为普通股经济性。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
