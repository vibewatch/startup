      - CV014
  - id: TV003
    title: 乐观、基准与悲观尽调情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计经常性收入高于第三方年度收入估算；留存和毛利率若能证明软件级经济性，企业覆盖就能转化为扩张。
        - 公允价值区间和目标回报需要经验证的净债务桥接、按优先权调整的完全稀释持股，以及匹配商业模式的收入倍数。
        - 客户覆盖和市场活动是积极信号，但公开证据不足以支持数值概率。
        - 留存、利润率或服务收入占比尽调无法确认可扩张的软件经济性。
      - - 基准
        - $108.3M 估算在方向上有参考价值但未经验证；最新展示的融资估值仍是参考点，而非出清价格。
        - 粗略的 16.6x-17.1x 融资后估值 / 估算收入代理指标支持“继续研究”，但不支持目标估值。
        - 相互矛盾的融资总额和缺失的撮合价格数据，使可辩护的数值概率无法建立。
        - 尽调期间没有提供当前二级交易或资本结构证据。
      - - 悲观
        - 收入质量弱于估算所暗示的水平，流动性持续偏低，优先权吞噬的退出价值高于普通股股东预期。
        - 没有当前股权结构表和瀑布分配无法量化下行；下轮融资或折价二级交易虽有可能，但尚未证实。
        - Forge 的低活动标签和缺少公开撮合价格属于警示信号，不是未来亏损的证明。
        - 经审计 KPI 未达到管理层计划，融资需要优先级更高的条款，或近期普通股交易以显著低于融资参考值的价格成交。
    notes: 这些是有条件的尽调情景，不是预测；未赋予没有依据的估值区间、概率、ARR 数字、退出倍数或回报目标。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV016
