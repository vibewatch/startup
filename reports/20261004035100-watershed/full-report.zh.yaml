      - number: '1.2'
        title: 管理层、投资者与治理透明度
        blocks:
          - type: paragraph
            body: >
              指定证据中的公开管理层信息很有限。StartupFundraising 将 Christian Anderson 列为创始人，Watershed 的一则产品公告则称 Yubing Zhang 负责 AI
              产品。来源集没有提供当前且完整的高管名单、董事会成员、投票权、继任计划或足以评估创始人与市场匹配度的履历。因此，管理层表格只是样本，不是完整的人事清单；关键人物依赖仍是待尽调问题，而不是已量化的风险。


              资本提供方的透明度高于治理透明度。公司和第三方来源将 Greenoaks、Kleiner Perkins、Sequoia Capital 和 Lowercarbon Capital 列为投资者。Watershed
              还称其成立了政策和科学顾问委员会，但指定来源无法确认这些机构当前的成员、权限、独立性或与正式董事会的关系。来源集没有公开股权结构表显示持股比例、清算优先权、董事席位或控制权，因此不能把投资者的知名度等同于已验证的治理控制。
