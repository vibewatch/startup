              - CP011
              - CP012
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 企业气候软件的实施能力缺口
            body: >
              企业可持续发展软件市场面临一个关键结构性挑战：先进工具解决不了人的协作问题。行业调查显示，超过 77% 的财务和可持续发展负责人在从分散供应商收集 Scope 3 原始排放数据时遇到严重困难。Watershed
              和 Persefoni
              等自助式软件平台需要企业在可持续发展、财务和采购部门配置专职项目经理，搭建数据管道并推动供应商合规。没有持续的内部运营能力，企业部署往往会停滞，团队又回到手工电子表格变通方案，或转向全托管合规模式。
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
              - CP007
          - type: callout
            title: 非气候 ESG 广度与监管合规暴露
            body: >
              Watershed 已在温室气体核算和气候披露（ESRS E1）上建立行业领先地位，但欧盟 Corporate Sustainability Reporting
              Directive（CSRD）要求企业广泛报告社会标准（ESRS S1–S4）和治理指标（ESRS G1）。只专注排放的气候平台会留下重大合规缺口，企业买方必须用第二套软件或人工顾问服务补齐，这为更广泛的 ESG
              平台老牌厂商和托管式合规服务商留下了机会。
            calloutType: risk
            claimRefs:
              - CP001
              - CP004
              - CP005
