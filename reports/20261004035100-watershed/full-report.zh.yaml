      - number: '1.3'
        title: 资本结构、规模信号与证据边界
        blocks:
          - type: paragraph
            body: >
              Watershed 于 2024 年 2 月宣布完成由 Greenoaks 领投的 $100M C 轮，Kleiner Perkins、Sequoia 及其他现有投资者跟投。公司称此轮融资对 Watershed
              的估值为 $1.8B。StartupFundraising 报告累计披露融资额为 $239M，并称其轮次记录没有晚于 2024 年 2 月的融资；这只是融资历史观察，不代表 $239M
              仍可作为现金使用。指定来源没有可支撑的债务、二级出售、收入、ARR、毛利率、留存、消耗或跑道数据。


              规模信号很强，但混合了公司口径和第三方报道。ESG News 报道，2026 年 Carbon RFP 覆盖了一个超过 800 家企业的网络，其中包括 90 家财富 500 强公司；此前的 RFP 促成了超过
              100 笔企业信用购买。Watershed 另称，客户管理的排放量从 C 轮时估计的 2,000 万吨 CO2e 增至 4.79 亿吨；管理中的排放量不等于收入或客户数。


              员工规模证据无法归并成一个数字区间。Watershed 称团队接近 400 人，而 Revelio Labs 报告有 570
              人，但将该实体认定为总部位于安娜堡的信息技术服务公司。指定政府搜索结果还显示，一个无关的“NYC WATERSHED”会议会造成同名搜索碰撞。因此，570 人应标记为实体识别冲突，不能视为已验证的公司员工数。
