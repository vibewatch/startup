  - id: FE001
    title: Watershed 企业产品与技术架构栈
    type: stack
    summary: 分层展示 Watershed 从客户数据摄取到合规报告和市场执行的软件架构。
    data:
      layers:
        - label: 合规与报告层
          detail: 自动完成 CSRD、CDP 和 SEC 披露申报，并保留审计轨迹和人工复核
          modules:
            - CSRD 报告模块
            - CDP 披露引擎
        - label: 脱碳与市场层
          detail: 协调企业采购碳移除、清洁电力和可持续航空燃料
          modules:
            - Watershed Marketplace
            - 年度碳 RFP
        - label: 分析与智能层
          detail: 执行足迹分析、热点识别和同比排放差异建模
          modules:
            - AI 数据清洗代理
            - 热点检测引擎
        - label: 碳核算与因子逻辑
          detail: 将运营活动映射至经验证的多区域投入产出排放因子
          modules:
            - CEDA 排放数据库
            - 统一碳数据 API
        - label: 企业摄取与数据管道
          detail: 摄取原始业务交易、公用事业账单、出行记录和 ERP 导出数据
          modules:
            - 文档 OCR 引擎
            - SAP ERP 连接器
        - label: 金融机构与投资组合层
          detail: 按照 PCAF 标准整合跨投资组合排放追踪
          modules:
            - 投资组合数据聚合器
            - 基金排放报告
    approximationNotes: 架构层代表根据工程招聘需求和产品发布文档综合出的功能性软件抽象。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE008
      - CE009
