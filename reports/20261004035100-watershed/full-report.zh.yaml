        title: 展示项
        blocks:
          - type: callout
            title: 合同保护不是运营缓释
            body: 责任上限和保证免责声明可能减少可追回损失，但不能证明正常运行时间、安全性、计算准确性或故障后的客户留存。
            calloutType: risk
            claimRefs:
