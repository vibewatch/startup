      - number: '7.4'
        title: 监测指标与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              如果尽调显示持续出现重大报告错误、错过披露期限、发生安全事件却未及时修复、碳项目交付失败，或客户协议绕过公开责任保护且没有补偿性控制措施，投资论点就应被推翻或暂停。财务升级触发器包括跑道低于约定的董事会阈值、续约经济性明显恶化，或融资条款使新资本处于次级；公开来源集无法测量其中任何一项。因此，近期监测应要求季度正常运行时间和事件报告、计算错误抽样、项目交付客户群、客户和供应商集中度、经审计的收入质量、消耗与跑道，以及具名继任覆盖。检索不到诉讼、数据泄露或中断的结果应记录为证据缺口，而不是证明没有发生事件。
