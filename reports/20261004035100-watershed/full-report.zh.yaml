  - id: FU001
    title: 企业客户旅程与平台扩展阶段
    type: journey-map
    summary: 展示企业客户如何从最初由合规驱动的数据摄取，逐步过渡到先进的供应链 Scope 3 自动化。
    data:
      items:
        - label: 阶段 1：合规范围界定
          stage: 监管信息收集与范围界定
          actor: 首席可持续发展官 / ESG 负责人
          objective: Establish audit-ready emissions baseline for CSRD and CDP reporting
          touchpoints:
            - 高管合规需求梳理
            - ERP 和公用事业记录范围界定
            - Watershed 平台启动
        - label: 阶段 2：数据摄取
          stage: 自动数据摄取与清洗
          actor: 可持续发展经理与数据分析师
          objective: Ingest unstructured energy invoices and utility data via AI agents
          touchpoints:
            - PDF 公用事业扫描件摄取
            - 排放因子数据库映射
            - 异常标记与复核
        - label: 阶段 3：高管报告
          stage: 高管披露与报告
          actor: 可持续发展副总裁与财务控制负责人
          objective: Generate external regulatory reports with defensible audit trails
          touchpoints:
            - 审阅 CSRD 披露模块
            - 董事会层面的 KPI 仪表盘
            - 外部审计师只读访问
        - label: 阶段 4：Scope 3 供应商参与
          stage: Scope 3 供应商脱碳
          actor: 企业采购负责人及重点供应商
          objective: Replace spend-based estimates with supplier-specific carbon metrics
          touchpoints:
            - EcoVadis 原始数据同步
            - 供应商门户接入
            - 采购评分卡集成
        - label: 阶段 5：市场脱碳
          stage: 脱碳执行中
          actor: 运营负责人及能源经理
          objective: Procure verified carbon removals and implement site energy reductions
          touchpoints:
            - 访问 Watershed Marketplace 抵消额度
            - 现场能源效率项目
            - 季度减排审计
        - label: 阶段 6：企业扩张
          stage: 企业扩张及多站点推广
          actor: 全球可持续发展指导委员会
          objective: Standardize emissions accounting and AI agents across all global subsidiaries
          touchpoints:
            - 在国际设施开展多站点推广
            - 为内部倡导者提供 AI 研修
            - 持续审计验证
    approximationNotes: 旅程阶段综合自 Watershed 平台架构、产品文档及有记录的客户部署顺序。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
