      - number: '7.2'
        title: 运营、质量与安全暴露
        blocks:
          - type: paragraph
            body: >-
              Watershed
              的输出依赖客户提供的数据，而其条款不保证内容准确，也不保证服务不中断或安全。这种责任分配具有商业重要性：即使合同语言限制了赔偿，披露截止日前出现报告错误或服务中断仍可能损害续约。公司把内置人工审核和透明计算作为控制措施进行宣传，但来源集没有控制审计、错误率序列、正常运行时间历史、渗透测试结果或事件登记。Verdantix
              的历史评估还指出，内部碳定价、项目组合管理和超出标准方法的 Scope 3 分析存在品类级缺口，因此验证当前能力仍是尽调要求，而不是已定论的弱点。
            claimRefs:
