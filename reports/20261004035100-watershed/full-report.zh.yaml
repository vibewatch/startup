            body: >-
              指定证据包含一项二手估算，称碳管理软件行业到 2028 年可能接近 $1.2B，但页面没有披露地域、基准年、方法、CAGR，也没有说明是否包含服务和交易收入。因此，这只是低置信度的品类信号，不是公司的
