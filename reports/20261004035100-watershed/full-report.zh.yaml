        title: 定价动态与获客效率
        blocks:
          - type: paragraph
            body: >-
              在企业可持续发展市场，Watershed 采用直销模式，目标客户是财富 500 强跨国公司和金融机构。RFP.wiki 的独立采购基准和已观察到的 Vendr 交易显示，年度合同金额中位数约为
              $70,031；根据全球实体数量和 Scope 3 供应商整合深度，整体企业部署每年约 $50,000 至超过 $250,000。初始上线、基准排放数据映射和 ERP 系统集成通常还会在第一年增加 $10,000
              至超过 $50,000 的五位数专业服务合同。高 ACV 带来了企业账户扩张机会，但高端定价和服务密集型部署可能限制中端市场渗透，并拉长企业销售周期。
