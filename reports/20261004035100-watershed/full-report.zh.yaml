      - number: '2.4'
        title: 监管有帮助，但证据质量限制预测
        blocks:
          - type: paragraph
            body: >-
              披露义务、Scope 3 复杂度、排放因子年度更新，以及企业将测量连接到行动的压力，都可能支撑需求。Watershed 在 2024 年称，超过 10,000 家公司需要按欧盟 CSRD 进行申报，财富 500
              强中超过三分之二有重大的气候承诺。这些是公司口径的需求指标，不是软件预算或转化率的独立预测。Free Open CEDA 也提供了低成本的测量入口，而付费 CEDA
              套餐增加数据拆分、支持和服务；公开价格缺失。因此，主要限制不是已证明缺乏工作流需求，而是预算归属不明、付费意愿未知、政策敏感性、实施摩擦，以及缺少可独立复现的品类规模估算。
