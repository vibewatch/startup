          detail: Watershed 称客户管理的 CO2e 达 4.79 亿吨，而 Series B 时估计为 2,000 万吨。
          tone: positive
        - label: 2026-03 — 第二次 Carbon RFP
          detail: ESG News 报道了一项覆盖 800 多家企业和 90 家《财富》500 强公司的采购计划。
