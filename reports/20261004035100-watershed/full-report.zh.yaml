            body: >-
              Watershed 的资本化历史显示其获得强大的一级风险投资支持，包括 Greenoaks 于 2024 年 2 月领投的 $100M C 轮，投后估值 $1.8B。第三方数据库汇总显示，公司五轮融资累计获得
              $185M 至 $254M 的私募股权和风险投资。尽管账面融资额很高，公司仍严格保密当前现金、运营现金消耗、净消耗倍数和跑道。EquityZen 等平台上的非官方二级市场流动性交易反映的是 IPO
              前员工出售股份，而非公司直接获得一级资本。对于机构投资者，要评估未来资本充足性，需要核实当前现金储备能否支撑公司在宏观逆风和企业披露监管时间表变化下自我维持运营。
