  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据链从融资参考出发，经由未经验证的分母和薄弱的价格发现，最终指向“继续研究”的结论。
    data:
      nodes:
        - id: financing-mark
          label: 2024 年 2 月公司宣布的 $1.8B 投后估值
        - id: later-reference
          label: 2025 年 12 月基于 Forge 注册记录推导的 $1.85B 投后估值参考
        - id: revenue-denominator
          label: 预计 2025 年年收入 $108.3M；并非经验证的 ARR
        - id: proxy-multiple
          label: 投后估值与预计收入之比的 16.6x-17.1x 代理值；并非 EV / 收入
        - id: secondary-channel
          label: EquityZen 描述了现有股东的转让渠道
        - id: liquidity-check
          label: Forge 活跃度低；没有可用的匹配价格
        - id: decision
          label: 在设定价格、回报、持有或退出假设前继续研究
      edges:
        - from: financing-mark
          to: later-reference
        - from: later-reference
          to: revenue-denominator
        - from: revenue-denominator
          to: proxy-multiple
        - from: proxy-multiple
          to: secondary-channel
        - from: secondary-channel
          to: liquidity-check
        - from: liquidity-check
          to: decision
    approximationNotes: 该倍数由投后估值和第三方年收入估计值计算得出；它不是企业价值倍数，也不是公允价值估计。
    claimRefs:
      - CV002
