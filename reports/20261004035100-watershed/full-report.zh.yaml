  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与企业模块图
        blocks:
          - type: paragraph
            body: >-
              Watershed 将平台定位为企业可持续发展 AI
              系统，目标是把企业可持续发展项目从手工电子表格核算转成持续、可审计的运营工作流。平台通过五个独立功能模块处理企业碳管理：数据采集、数据清洗与标准化、映射与测量、分析和报告。数据采集使用内置光学字符识别（OCR）、企业资源规划（ERP）数据连接和结构化项目管理功能，摄取
              Scope 1、Scope 2 和 Scope 3 活动数据。数据清洗与标准化由专用 AI 代理处理原始数据转换；Watershed 声称，相比人工准备，该功能可将数据处理提速 80% 至
              93%。映射与测量采用专业气候核算方法和自动排放因子匹配，并以 Watershed 收购的多区域排放数据库 Comprehensive Environmental Data
              Archive（CEDA）为基础。分析模块让企业可持续发展和财务负责人查询排放足迹数据、建模脱碳路径，并评估战略业务决策的排放影响。最后，报告模块自动生成强制和自愿披露框架的草稿，包括欧盟 Corporate
              Sustainability Reporting Directive（CSRD）、Carbon Disclosure Project（CDP）及相关全球标准，同时保留计算审计轨迹和可配置的人在回路审核控制。
