  topStrengths:
    - >-
      $255M Series A at $1.4B valuation with top-tier investors (Oak HC/FT, Battery Ventures, Salesforce Ventures) and
      named angel validators from Perplexity, Brex, and Datadog confirms thesis-level conviction and multi-year runway.
    - >-
      AWS SageMaker JumpStart and SAP Business AI distribution give NEXUS direct access to Fortune 100 procurement
      channels without cold-start sales friction; AWS CEO and VP endorsements amplify enterprise credibility.
    - >-
      NEXUS confidential-computing architecture (hardware TEE, cryptographic attestation, customer-owned VPC deployment)
      removes the primary enterprise data-security objection that typically blocks AI adoption in regulated verticals.
    - >-
      DeepMind-alumni scientific team (Marta Garnelo as CSO, Wojciech Czarnecki as Founding Advisor) and Gaël Varoquaux
      (scikit-learn co-creator, 4B+ downloads) provide credible model differentiation and academic credibility.
  topRisks:
    - >-
      All unit economics — ARR, NRR, gross margin, customer count — are undisclosed; the $1.4B valuation implies
      $47M–$93M of ARR at 15x–30x multiples that may not be supportable at current stage.
    - >-
      Open-source competition from TabPFN (free tier) and independent critics (Mindful Modeler explicitly does not
      recommend NEXUS; NEXUS absent from TabArena leaderboard) undermine pricing power before category lock-in.
    - >-
      FDE-heavy go-to-market scales revenue with headcount rather than software; customer count is likely concentrated
      in 3–5 Fortune 100 accounts, creating material revenue concentration and renewal risk (earliest renewals Q1–Q2
      2027).
    - >-
      AWS-exclusive cloud delivery concentrates platform, packaging, and distribution risk in a single relationship; a
      native AWS tabular model would remove both discovery channel and strategic scarcity simultaneously.
  unresolvedGaps:
    - >-
      ARR, revenue growth cadence, and share of recurring vs. deployment-assisted revenue are undisclosed and required
      to underwrite the $1.4B valuation on any financial basis.
    - >-
      Customer count, logo concentration, expansion behavior, and NRR/renewal terms are unavailable; earliest renewal
      data point is Q1–Q2 2027 for contracts signed at February 2026 launch.
    - >-
      Round economics — liquidation preferences, secondary participation, option-pool changes, and effective dilution —
      are not publicly disclosed, making the $1.4B post-money mark difficult to interpret in terms of actual investor
      economics.
    - >-
      NEXUS is absent from independent benchmark platforms (TabArena); the company relies entirely on self-published
      benchmarks and the World Cup soccer demo as public performance evidence.
