companyProfile:
  summary: >-
    Fundamental Technologies, Inc. (fundamental.tech) emerged from stealth on
    February 5, 2026, raising $255 million at a $1.4 billion post-money
    valuation to commercialise NEXUS, its Large Tabular Model for enterprise
    structured-data prediction. NEXUS is a non-transformer, deterministic
    foundation model pre-trained on more than 10 billion enterprise tables that
    runs inside a customer's own VPC using hardware Trusted Execution
    Environments, eliminating the most common enterprise data-security
    objection. The company targets Fortune 100 buyers across financial services,
    healthcare, manufacturing, retail, and energy via a Palantir-style Forward
    Deployed Engineer go-to-market and AWS SageMaker / SAP Business AI
    distribution channels. The scientific team is anchored by DeepMind alumni,
    including Chief Science Officer Marta Garnelo, with Gaël Varoquaux
    (scikit-learn co-creator) and Wojciech Czarnecki as Founding Advisors.
  foundedDate: "2024-10-01"
  founders:
    - name: Jeremy Fraenkel
      role: CEO and Co-founder
      background: >-
        Confirmed CEO and co-founder across TechCrunch, the company website,
        and the official AWS press release; prior serial-entrepreneur background
        not publicly detailed. Additional co-founders not publicly named.
      claimRefs: [CO010, CO016]
  foundingLocation: "Menlo Park, CA"
  headquarters: "San Francisco, CA (go-to-market); Menlo Park, CA (legal address)"
  productSummary: >-
    NEXUS: a Large Tabular Model (LTM) for deterministic predictions from
    structured enterprise data. Core use cases include demand forecasting, fraud
    detection, price prediction, and customer churn. Delivered via a
    scikit-learn-compatible SDK (pip install fundamental-client) with
    NEXUSClassifier / NEXUSRegressor interfaces. Runs inside the customer's VPC
    using hardware TEE and cryptographic attestation to protect model IP and
    customer data simultaneously. Available on AWS SageMaker JumpStart, AWS
    Marketplace, and SAP Business AI genAI Hub.
  customerFocus: >-
    Fortune 100 enterprises in financial services, insurance, healthcare,
    manufacturing, retail, energy, and gaming/e-commerce; targeted through
    FDE-led sales with seven-figure ACV deals and CDO/CAIO-level buyer personas.
  businessModel: >-
    Enterprise B2B subscription: customers bear AWS compute costs
    (ml.p5en.48xlarge, 8x NVIDIA H200 GPUs) plus a Fundamental license fee.
    Distribution through direct FDE-led sales, AWS Marketplace, and SAP
    Business AI genAI Hub. No public list price; all engagements are sales-led.
  stage: Series A
  fundingStatus: >-
    $255M total raised ($225M Series A, ~$30M pre-Series A seed) at a $1.4B
    post-money valuation as of February 5, 2026. Investors: Oak HC/FT (lead),
    Valor Equity Partners, Battery Ventures, Salesforce Ventures, Hetz
    Ventures. Angel investors include Aravind Srinivas (Perplexity AI CEO),
    Henrique Dubugras (Brex co-founder), and Olivier Pomel (Datadog CEO). No
    subsequent funding round announced through June 27, 2026.
