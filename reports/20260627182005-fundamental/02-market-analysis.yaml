  evidenceGaps:
  - type: missing-source
    severity: material
    topic: analyst-TAM
    missingEvidence: >-
      Primary analyst market-sizing report (Gartner, IDC, or MarketsandMarkets) providing a
      confirmed dollar TAM and CAGR for enterprise analytics AI / analytics copilot market as
      a distinct segment.
    whyItMatters: >-
      Without a confirmed analyst TAM, all sizing estimates are bottom-up proxies that cannot
      be triangulated against independent market research. This limits confidence in
      market-opportunity claims made to investors.
    diligencePath: >-
      Purchase Gartner Magic Quadrant for Analytics and BI Platforms 2026 and IDC Intelligent
      Analytics Software report; confirm addressable dollar value for predictive analytics
      overlay on cloud warehouse platforms.
    relatedQuestionRefs: [QM001, QM004, QM025]

