- id: buyers-users-and-budget-owners
  title: Buyers, Users, and Budget Owners
  body: >-
    Enterprise analytics AI is inherently cross-functional, meaning the buyer map is not a
    single budget line. ThoughtSpot's resource architecture identifies at least six buyer
    personas: data leader, business leader, product leader, data analyst, analytics engineer,
    and developer — each with different job-to-be-done and procurement access. Fundamental's
    go-to-market emphasizes data scientists and chief data/AI officers as primary personas,
    with the company's "data science" product page positioning NEXUS as a drop-in replacement
    for classical ML workflows. The enterprise account management job posting explicitly names
    Fortune 100 company portfolios as the target, with $1M–$10M+ ACV deals per the energy
    vertical posting — signaling a top-down, IT-budget-driven buying motion rather than
    product-led growth. Tableau Pulse introduced a proactive metrics layer ("automatically
    detects drivers, trends, and outliers") for the business-user persona — indicating that
    the business user is also an important endpoint, even if IT/data owns the procurement.
    Budget ownership in this market bifurcates: predictive analytics and ML tooling typically
    sit in central data platform budgets (data engineering, ML platform, or CTO/CIO functions),
    while business intelligence and reporting spend often lives in business unit or finance budgets.
    Fundamental's FDE (Forward Deployed Engineer) go-to-market model — inherited from Palantir
    and described explicitly in its own hiring materials — maps to top-down enterprise sales with
    high human-capital cost per customer. The ROI narrative anchors on analyst retention and
    business-user empowerment, per ThoughtSpot's CarTrawler evidence. For Fundamental
    specifically, use cases target enterprise verticals with large structured datasets: financial
    services (credit scoring, fraud), insurance (claims), healthcare (clinical analytics),
    manufacturing (demand forecasting), energy (production optimization), and retail (churn/pricing).
  claimRefs:
