    severity: material
    topic: Fundamental-customer-traction
    missingEvidence: >-
      Named customer logos, ARR metrics, net revenue retention, and customer count for
      Fundamental. Current evidence is limited to an unverifiable CEO claim of "seven-figure
      Fortune 100 contracts."
    whyItMatters: >-
      Customer traction evidence is the primary market-validation signal for a pre-revenue
      or early-revenue analytics AI vendor; without it, SAM and SOM estimates cannot be anchored.
