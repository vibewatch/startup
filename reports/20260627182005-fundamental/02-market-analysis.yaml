- id: sizing-lenses-and-constrained-sam
  title: Sizing Lenses and Evidence-Constrained Opportunity
  body: >-
    No clean analyst TAM for enterprise tabular AI / analytics copilots was accessible in this
    research pass — Gartner, IDC, and MarketsandMarkets reports were blocked behind paywalls.
    The most credible proxy is a bottom-up estimate from accessible primary evidence. Databricks
    serves 20,000+ organizations including 70% of the Fortune 500 and 1,200+ global partners;
    if even 10% of those organizations eventually pay for a tabular AI overlay, that implies
    2,000+ enterprise accounts. Snowflake's AT&T case study documents 84% annual cost savings
    and sub-second query response — quantifying the value delivered by analytics AI investment.
    On the demand-side validation front, Databricks' own 2026 Financial Services research found
    that 94% of FSI firms are piloting or deploying generative AI within core functions, with
    AI-driven automation expected to reduce operating costs by up to 20%; this implies strong
    executive-level budget allocation. The pricing signal is instructive: Databricks moved Genie
    analytics AI to pay-as-you-go in July 2026 (150 DBU free/user/month ≈ $10.50, DBU-priced
    beyond that), while Google Looker adopted token-based billing ($3.00/M input, $20.00/M output
    tokens effective October 2026), establishing a per-query unit economics reference for the
    analytics AI market. At Looker's token pricing, a 1,000-user enterprise processing 10 queries
    per user per day would incur roughly $1–3M annually in pure analytics-AI token costs — validating
    enterprise-scale contract values. The "more pilots than production deployments" pattern
    documented by Databricks suggests the current market is undersized relative to its potential:
    the platform infrastructure for analytics AI exists, but deployment bottlenecks (data
    heterogeneity, governance gaps, integration complexity) throttle conversion. That bottleneck
    is precisely Fundamental's wedge claim.
