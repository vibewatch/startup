callouts:
- calloutType: strength
  title: Tier-1 Investor Conviction at $1.4B Unicorn Valuation
  body: >-
    Four co-lead investors — Oak HC/FT, Valor Equity Partners, Battery Ventures, and
    Salesforce Ventures — plus strategic angel investors (Perplexity CEO, Brex co-founder,
    Datadog CEO) signal high-conviction institutional backing unusual for a pre-revenue
    unicorn. Battery Ventures and Salesforce Ventures are especially relevant validators:
    Battery brings deep data-infrastructure SaaS experience, and Salesforce Ventures creates a
    credible strategic acquisition thesis via Salesforce Data Cloud.
  claimRefs:
  - CI028
  - CI029
  - CI030
  - CI031

- calloutType: risk
  title: Revenue Quality Cannot Be Verified — Seven-Figure Claim Is Sole Financial Signal
  body: >-
    The only quantitative revenue evidence is CEO Jeremy Fraenkel's statement at launch that
    Fundamental has "seven-figure contracts with Fortune 100 clients." This is consistent with
    $1M to $20M in ARR but is unverifiable. No independent source corroborates specific
    customer names, contract values, or retention metrics. At a $1.4B valuation, even the
    optimistic ARR scenario implies a >50x revenue multiple — a ratio that requires exceptionally
    rapid growth to justify and leaves almost no financial margin of safety.
  claimRefs:
  - CI023
  - CI024
  - CI025

- calloutType: risk
  title: Structural Regulatory Exposure in Core Verticals
  body: >-
    GDPR Article 22 restricts fully automated decisions with legal or significant effects (credit
    scoring, fraud), adding human-review requirements that reduce NEXUS's full-automation value
    proposition in EU deployments. The EU AI Act classifies credit scoring as high-risk AI with
    mandatory compliance obligations from December 2, 2027. These regulations directly target
    Fundamental's most valuable verticals and impose compliance costs on enterprise customers,
    creating deployment friction at exactly the point the company needs rapid enterprise adoption
    to justify its valuation.
  claimRefs:
  - CI026
  - CI027

