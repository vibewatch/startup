company:
  name: Fundamental Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Fundamental Technologies has raised $255 million total ($225 million Series A at a $1.4
    billion post-money valuation, plus an estimated $30 million in prior seed funding), but
    discloses no ARR, burn rate, gross margin, or customer count. The only revenue signal is
    CEO-stated seven-figure contracts with Fortune 100 clients, which is consistent with very
    early enterprise traction but insufficient for underwriting. The revenue model is enterprise
    B2B SaaS via AWS Marketplace and SAP channels, with a Palantir-style FDE cost structure
    that implies high cost-to-serve. Capital adequacy appears solid in the near term, but
    compliance obligations (GDPR Article 22, EU AI Act high-risk classification) and an
    extreme AWS infrastructure dependency create structural financial risks that grow as
    the company scales.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Architecture
  body: >-
    Fundamental's revenue mechanism is enterprise B2B subscription. The primary monetization
    vectors are AWS Marketplace subscriptions (customers subscribe to NEXUS as a SageMaker
    model package, paying AWS infrastructure costs for the ml.p5en.48xlarge instance plus a
    Fundamental SDK license) and the SAP Business AI open model ecosystem. No official list
    pricing has been published; the company has not disclosed a public price card, trial terms,
    or usage-tier structure as of June 2026. The AWS Marketplace subscription model effectively
    passes the GPU infrastructure cost (ml.p5en.48xlarge, eight NVIDIA H200 GPUs per endpoint)
    to the customer, which suggests Fundamental captures a license margin on top of customer
    compute spend. The SAP channel provides access to SAP's enterprise installed base via
    SAP's genAI Hub, but SAP's open model ecosystem positions NEXUS in direct competition
    with any other model SAP adds — including free or cheaper alternatives — reducing pricing
    power within that channel. Revenue recognition likely follows a SaaS subscription pattern,
    but without disclosed contract terms, ACV, or renewal mechanics, all revenue-quality
    judgments remain low-confidence. A Global Head of Energy role in Houston targeting
    $1 million to $10 million ACV deals confirms that the company is pursuing large individual
    contracts, consistent with a high-touch, Palantir-style go-to-market model rather than a
    PLG or low-touch SaaS motion.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001

- id: unit-economics
  title: Unit Economics and Cost Structure
  body: >-
    All standard unit economics metrics — CAC, LTV, payback period, NRR, gross margin, and
    churn — are private and not disclosed in any reviewed source. The cost structure is
    directionally high because the FDE (Forward Deployed Engineer) go-to-market model
    requires expensive human capital per customer: each FDE is embedded directly in an
    enterprise customer's environment, performing hands-on model integration, benchmarking
    against customer baselines (XGBoost, LightGBM), and delivering POC-to-production
    transitions. This mirrors Palantir's historically high cost-to-serve structure, which
    suppressed Palantir's gross margins until it achieved scale. NEXUS's compute cost is
    passed to customers via AWS Marketplace, which partially offloads infrastructure cost;
    however, the company still bears R&D, model maintenance, and FDE personnel costs.
    Academic open-source competitors (PriorLabs TabPFN, TabICL, and TabDPT) impose pricing
    pressure because enterprise buyers can deploy them for free or at minimal cost, compressing
    Fundamental's ability to charge premium rates without demonstrating clear ROI superiority.
    Published job descriptions for FDE Data Scientists confirm head-to-head benchmarking as
    the standard sales-cycle mechanism, implying that sales cycles involve significant
    solution-engineering effort per customer — a strong predictor of CAC that is
    structurally difficult to reduce without PLG instrumentation.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  tableRefs:
  - TI003
  figureRefs:
  - FI002

- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: >-
    The $225 million Series A raised on February 5, 2026, combined with the estimated $30
    million in prior seed funding, provides an apparent total cash endowment of $255 million.
    Using benchmark AI startup burn rates — typically $2 million to $8 million per month for
    a company at Fundamental's stage and headcount (estimated 50 to 150 employees, 25 open
    roles) — the implied runway range spans roughly 2.5 to 10-plus years. That range is too
    wide to be useful, and the actual burn depends heavily on: (1) headcount and FDE staffing
    costs, (2) the pace of enterprise sales hiring (9 commercial open roles suggest active
    scaling), (3) AWS infrastructure costs for running the NEXUS model in customer environments
    during pilots, and (4) any R&D-intensive model retraining or fine-tuning costs. The
    company's event schedule through January 2027 (Dreamforce, Money20/20, WEF Davos) implies
    material conference marketing spend. No debt, project finance, or credit facility is
    mentioned in any reviewed source; the company appears fully equity-financed. The next
    financing trigger is unknown — the company is 16 months from Series A as of run date and
    has no disclosed revenue milestone that would drive a Series B timeline. Financing
    dependency is primarily on continuing investor confidence in the LTM thesis; the
    Salesforce Ventures co-investment creates a potential strategic acquisition path that
    could reduce financing risk if ARR does not scale rapidly.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  tableRefs:
  - TI004
  figureRefs:
  - FI003
  - FI004

- id: gtm-and-sales-efficiency
  title: Go-to-Market Motion and Sales Efficiency Proxies
  body: >-
    Fundamental's GTM motion combines two distinct channels. The direct channel relies on
    Forward Deployed Engineers embedded with enterprise accounts, executing head-to-head
    benchmarking against incumbent baselines before committing to a production deployment.
    The indirect channels are the AWS Marketplace listing (subscribe via SageMaker) and SAP
    Business AI integration (accessible through SAP's genAI Hub), which reduce the cold-start
    problem for enterprise discovery. The AWS channel benefits from AWS CEO Matt Garman's
    public endorsement and the formal SageMaker JumpStart listing, both of which provide
    enterprise sales credibility. The SAP channel reaches SAP's installed base but places NEXUS
    in an open-competition shelf alongside any model SAP adds; the platform advantage may erode
    as other vendors integrate. GTM hiring signals as of June 2026 include nine commercial open
    roles (Enterprise Account Manager, Global Head of Energy, FDE Full-Stack, FDE Data
    Scientist), which collectively confirm an active sales ramp. The Global Head of Energy
    position targets $1 million to $10 million ACV deals in oil-and-gas — a high-value but
    long-cycle vertical that could skew average contract values materially if won. Sales
    efficiency proxies such as win rate, cycle length, and CAC payback are entirely private;
    the benchmark evidence suggests customer engagement is intense and manual, consistent
    with a very high ACV and correspondingly high sales cost.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  tableRefs: []
  figureRefs: []

- id: financial-verdict
  title: Financial Verdict, Diligence Blockers, and Regulatory Exposure
  body: >-
    The financial verdict is that Fundamental Technologies has strong capital adequacy in the
    near term and a plausible enterprise revenue mechanism, but the public financial file is
    insufficient for underwriting. The seven-figure Fortune 100 contract claim — the only
    quantitative revenue signal — is unverifiable and consistent with anything from $1 million
    to $20 million or more in ARR depending on contract count and size. Without ARR, NRR,
    gross margin, or customer count, the company cannot be valued on a revenue multiple, and
    the $1.4 billion post-money represents a thesis bet on the LTM category rather than a
    revenue-anchored valuation. Regulatory exposure is a structural financial risk: GDPR
    Article 22 requires human review for automated decisions with legal effects (credit
    scoring, fraud, underwriting), and the EU AI Act classifies credit scoring as high-risk AI
    with mandatory compliance obligations from December 2, 2027. These obligations add
    customer deployment friction and compliance cost in Fundamental's most valuable verticals.
    The UK ICO provides an additional layer of post-Brexit AI governance obligations for UK
    deployments. Combined with the total dependence on AWS SageMaker as the delivery
    infrastructure and the SAP open-model platform's competitive dynamics, the financial model
    carries multiple structural dependencies that must be resolved before the business reaches
    scale.
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  tableRefs:
  - TI005
  figureRefs: []

