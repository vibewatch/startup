- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / path
  rows:
  - - ARR and growth bridge
    - Current ARR, quarterly growth, and mix of recurring versus deployment revenue
    - Needed to know whether any public multiple can support the entry price.
    - CFO deck and board materials
  - - Customer quality
    - Logo concentration, ACV distribution, renewals, and expansion by cohort
    - Needed to test whether seven-figure contracts are repeatable or exceptional.
    - Sales ops exports and cohort dashboard
  - - Gross margin profile
    - Subscription margin, services margin, cloud inference cost, and blended gross margin
    - Needed to know whether the company deserves software or services-adjacent multiples.
    - Finance model and cost-accounting review
  - - Round terms
    - Liquidation preferences, participation, option-pool changes, secondary mix, and dilution
    - Needed to translate headline valuation into actual security quality.
    - Term sheet, cap table, and counsel memo
  - - Competitive proof
    - Third-party benchmarks and win-loss data versus TabPFN and Snowflake alternatives
    - Needed to defend pricing power and product differentiation.
    - Field engineering package and customer references
  - - Exit readiness
    - Governance maturity, audit status, forecast discipline, and public-company readiness plan
    - Needed to assess whether a markup or exit path is realistic in the next 24-36 months.
    - CEO/CFO diligence session
  notes: These asks define the minimum package required to move the recommendation from track to investable.
