- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Indicative range (USD M)
  - Probability signal
  rows:
  - - Bull
    - AWS and SAP distribution unlock repeatable Fortune 100 deployments; ARR reaches $30M-$50M by end-2026.
    - 30x ARR on a perceived category leader with premium AI scarcity.
    - $900-$1,500
    - Possible, but requires unusually fast proof from a company just out of stealth
  - - Base
    - ARR reaches only $10M-$20M because FDE-led implementation slows scaling and buyers test free alternatives first.
    - 15x ARR on a promising but still unproven enterprise AI software company.
    - $150-$300
    - Most consistent with today’s public evidence
  - - Bear
    - Revenue remains below $5M, benchmark gaps persist, and platform-native alternatives compress willingness to pay.
    - 5x-10x ARR or a distressed private reset if the story de-rates.
    - $25-$75
    - A real downside if category lock-in does not appear quickly
  notes: Ranges are illustrative scenario outputs derived from simple ARR-times-multiple logic because no public ARR, NRR, or margin series exists.
