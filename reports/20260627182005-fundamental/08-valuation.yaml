- id: final-diligence-asks
  title: Final Diligence Asks
  body: 'A final investment view requires a short but non-negotiable diligence list. First, management needs to disclose current ARR, growth cadence, and the share of revenue that is recurring versus deployment-assisted. Second, investors need a customer-quality view: logo concentration, expansion behavior, renewal terms, and whether the seven-figure contracts are repeatable or exceptional. Third, the round economics matter as much as the headline: liquidation preferences, secondary participation, option-pool changes, and dilution can materially change what the $1.4 billion mark really means. Fourth, the company must show why it beats or coexists with TabPFN, Snowflake, and warehouse-native alternatives on benchmarks that customers actually trust. Finally, exit readiness is still low, so any near-term upside case depends on future proof rather than current disclosure. Until these asks are answered, the prudent posture is monitor, re-check at first ARR disclosure, and preserve entry discipline.'
