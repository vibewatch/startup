- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission
  - Action
  rows:
  - - Revenue proof fails to appear
    - ARR still below $10M or still undisclosed after initial deployments
    - Current valuation loses its main bull-case support.
    - Pause investment and reset value on a much lower revenue base
  - - AWS channel concentration turns negative
    - Exclusive path weakens or becomes non-preferential
    - Distribution leverage and strategic scarcity both compress.
    - Re-underwrite GTM as stand-alone enterprise selling
  - - Benchmark credibility stays weak
    - Independent tests still favor TabPFN-class alternatives
    - Pricing power erodes before lock-in forms.
    - Demand third-party benchmark package before proceeding
  - - FDE mix overwhelms software mix
    - Gross margin or subscription share looks services-heavy
    - Multiple should move toward services or implementation-heavy software bands.
    - Cut target entry price and require margin path
  - - Customer proof stays narrow
    - A few bespoke Fortune 100 projects do not convert into repeatable expansion
    - Reference wins stop supporting a platform thesis.
    - Treat story as specialty consulting-enabled tooling
  - - Capital-stack terms are investor-protective
    - Heavy preferences, large secondary, or reset-friendly rights emerge
    - Headline valuation overstates common-equity quality.
    - Adjust effective entry price or decline
  notes: These are the specific triggers that can most quickly collapse the current stretched-but-plausible valuation narrative.
