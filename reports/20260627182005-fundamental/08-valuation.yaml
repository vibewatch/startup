- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would decide it
  rows:
  - - Market
    - Tabular AI could become a durable enterprise category with room for a standard-setter.
    - The category may stay niche or get absorbed by warehouse-native tooling.
    - Independent customer adoption and budget-line evidence
  - - Product
    - Deterministic non-transformer positioning could offer meaningful differentiation on enterprise tables.
    - Benchmarking opacity means the product claim is not yet externally validated.
    - Third-party benchmark wins on trusted datasets
  - - Customers
    - Seven-figure Fortune 100 contracts suggest willingness to pay for high-value use cases.
    - Public revenue proof is too shallow to know whether those wins are repeatable or one-off.
    - ARR bridge, renewal data, and cohort expansion
  - - Economics
    - Early FDE support can unlock strategic deployments before software standardizes.
    - FDE-heavy delivery can cap margins and slow scaling if productization lags.
    - Gross margin and deployment-to-subscription mix
  - - Competition
    - Team pedigree and AWS distribution can create a temporary scarcity premium.
    - TabPFN and Snowflake can compress pricing before Fundamental has lock-in.
    - Win-loss data and benchmarked ROI versus substitutes
  notes: The anti-thesis is less about fraud or product failure than about whether the company reaches software economics before competition closes the gap.
