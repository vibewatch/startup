- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Valuation anchor
  - Why it matters
  - Public evidence used here
  - Key caveat
  rows:
  - - Dataiku
    - $10B valuation on roughly $100M ARR before IBM acquisition
    - Shows how premium enterprise AI/ML infrastructure can be priced at scarcity peaks.
    - Private-round context referenced in 2026 AI valuation discussion
    - Private-company metrics and timing are less verifiable here than public comps
  - - DataRobot
    - Peak $6.3B in 2021, later written down near $1.5B
    - Demonstrates how fast enterprise AI valuations can compress when expectations outrun realized economics.
    - Used as a cautionary private-AI precedent in comp framing
    - Valuation path spans multiple years and capital cycles
  - - Snowflake
    - Public EV/NTM revenue context around 10x-15x in 2025-2026
    - Best filing-backed anchor for enterprise data-platform valuation discipline.
    - Investor relations and public-filing context
    - Broader platform with much more scale than Fundamental
  - - Prior Labs / TabPFN
    - No public unicorn valuation; free OSS plus commercial licensing model
    - Sets a direct competitive floor on pricing and customer-evaluation friction.
    - GitHub repo, arXiv technical report, and product page
    - Competitive threat is clearer than valuation comparability
  - - ElevenLabs
    - $11B valuation and $500M raise in the same week
    - Shows how hot 2026 AI financing could get for stronger traction stories.
    - Same-period AI round context in TechCrunch and cohort coverage
    - Different category and much stronger visible adoption curve
  - - Alteryx
    - Taken private around a much lower equity outcome after stagnation
    - Reminds investors that analytics point solutions can de-rate sharply.
    - Public company website and take-private context
    - Mature company with different growth stage and product mix
  notes: 'This is a partial enumeration of the comp set most useful for underwriting discipline: it mixes public benchmarks, private-round reference points, and direct competitive substitutes because no single perfect Fundamental analog exists.'
  enumerationScope:
