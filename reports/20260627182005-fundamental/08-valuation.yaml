  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-proof
    missingEvidence: Current ARR, NRR, churn, gross margin, and the share of revenue tied to repeatable software versus FDE delivery.
    whyItMatters: Without these metrics, the current valuation cannot be mapped onto a defensible public or private multiple band.
    diligencePath: Request a finance pack with monthly ARR history, cohort retention, and contribution margin by product line.
    relatedQuestionRefs:
    - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: Liquidation preferences, participation terms, option-pool changes, secondary allocation, and dilution from the Series A.
    whyItMatters: Headline post-money valuation can materially overstate the quality of the security being purchased.
    diligencePath: Review the signed term sheet, updated cap table, and counsel summary before underwriting entry price.
    relatedQuestionRefs:
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage for private AI and tabular-model references
    missingEvidence: A fuller comp sheet with standardized ARR, growth, and multiple data for private AI-platform and tabular-model peers.
    whyItMatters: The current table is directionally useful but mixes public, private, and substitute references because no single clean peer set exists.
    diligencePath: Build a private-market comp appendix from direct investor materials, broker data, and current public filings.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Audit status, forecast accuracy, customer concentration, and a concrete 24-36 month exit-readiness plan.
    whyItMatters: Exit timing and markup potential are central to venture returns, but current public evidence only supports a low-readiness view.
    diligencePath: Run CEO and CFO diligence focused on governance maturity, reporting controls, and likely next financing or exit path.
