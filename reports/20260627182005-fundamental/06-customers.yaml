callouts:
  - calloutType: risk
    title: Zero Named Customers Is the Single Largest Diligence Blocker
    body: >
      As of June 27, 2026, no enterprise customer names, logos, case studies, testimonials, or
      third-party reviews appear anywhere in Fundamental's public materials. The "seven-figure Fortune
      100 contracts" claim rests entirely on a February 2026 AWS press release and TechCrunch
      corroboration — both credible, but nearly five months stale with no update. For an investment
      thesis dependent on customer traction, this is a blocking gap. No secondary market data (G2,
      Gartner Peer Insights, government tenders) exists. Primary diligence must produce at least five
      named production references before any underwriting decision.
    claimRefs:
      - CU013
      - CU014
      - CU031

  - calloutType: insight
    title: AWS and SAP Channels Provide Credible Enterprise Reach Without Named References
    body: >
      The AWS SageMaker JumpStart listing (GA June 2026) and SAP Business AI Hub integration (May 2026)
      give NEXUS passive enterprise discovery through two of the world's most trusted enterprise software
      channels. AWS Marketplace listings require compliance vetting and represent a form of partner
      endorsement. SAP's inclusion of NEXUS in its genAI Hub — accompanied by the SAP CAO's public
      quote — signals genuine strategic partnership rather than a directory listing. These channel
      placements provide structural top-of-funnel for enterprise acquisition even absent published
      customer references.
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU009

  - calloutType: risk
    title: Customer Concentration Risk Is Structurally Underinvestigated
    body: >
      Job postings targeting $1M–$10M+ ACV energy deals and an Enterprise Account Manager role
      described as owning "a portfolio of strategic Fortune 100 accounts" suggest that very few
      contracts may make up the bulk of current ARR. At Series A stage with seven-figure contracts,
      three to five customers could represent 80–90% of revenue. If one customer delays renewal or
      exits, the ARR impact would be outsized. No public disclosure of customer count, ARR
      concentration, or top-customer dependence exists. This is not a diligence finding of actual
      concentration — it is a finding of concentration risk that cannot be assessed without primary
      access.
    claimRefs:
      - CU026
      - CU027
      - CU028

