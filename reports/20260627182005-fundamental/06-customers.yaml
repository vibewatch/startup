  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: named customer proof
      missingEvidence: >
        Named production enterprise customers, customer logos, case studies with attributed outcomes,
        or any third-party customer reference for NEXUS; no G2/Capterra/Gartner Peer Insights review exists
      whyItMatters: >
        Without named customer references, the seven-figure contracts claim cannot be independently verified;
        customer concentration, retention, and expansion trajectory are all unassessable
      diligencePath: >
        Request minimum 5 named production customer references from Fundamental; obtain customer consent
        for reference calls; ask for ARR and NRR breakdown alongside reference list
      relatedQuestionRefs:
        - QU007
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >
        Net revenue retention rate, gross revenue retention rate, average contract length, churn rate,
        renewal data, or any customer satisfaction metric (NPS, CSAT, G2 score)
      whyItMatters: >
        Retention metrics are the primary proxy for product-market fit in enterprise SaaS; without them,
        the durability of the claimed Fortune 100 contracts is unverifiable
      diligencePath: >
        Request NRR and GRR as of Q2 2026; if too early for renewal, ask for leading retention indicators
        such as expansion ACV, QBR attendance, and FDE re-engagement rates
      relatedQuestionRefs:
        - QU010

    - type: missing-source
      severity: material
      topic: customer count
      missingEvidence: >
        Total active customer count, paying customer count vs pilot count, and breakdown by ARR band or
        deal size; needed to assess concentration risk and pipeline maturity
      whyItMatters: >
        Deal sizes of $1M–$10M+ ACV mean three to five customers could dominate ARR; concentration
        assessment is impossible without a customer count
      diligencePath: >
        Request signed customer count and ARR breakdown from Fundamental; triangulate with job posting
        signals (one Enterprise Account Manager per 5–10 Fortune 100 accounts as benchmark)
      relatedQuestionRefs:
        - QU004

    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >
        Published pricing tiers, Marketplace pricing, contract pricing structure, or any indication of
        whether pricing is consumption-based, seat-based, or usage-based
      whyItMatters: >
        Pricing opacity prevents competitive benchmarking, sales cycle analysis, and ARR modelling;
        all-sales-led engagement implies long procurement cycles that may constrain growth velocity
      diligencePath: >
        Request indicative pricing structure or pricing principles from Fundamental; compare to competitor
        TabPFN (free) and typical enterprise ML platform pricing ($50K–$2M/year range)
      relatedQuestionRefs:
        - QU011

    - type: missing-source
      severity: minor
      topic: third-party corroboration
      missingEvidence: >
        Any independent third-party source corroborating customer adoption beyond the February 2026 press
        release: government tender records, Gartner analyst citations, industry analyst mentions, or
        incremental press coverage of Fundamental customer wins in 2026
      whyItMatters: >
        The Fortune 100 contracts claim is now five months old with no update; independent corroboration
        would validate ongoing customer acquisition and pipeline growth
      diligencePath: >
        Search government procurement portals (SAM.gov, Contracts Finder, GovSpend) for Fundamental;
        track Gartner and Forrester analyst coverage in 2026; monitor press for customer announcements
      relatedQuestionRefs:
        - QU026

acknowledgedWarnings:
  - dimension: figureType
    reason: >
      FU004 substitutes a bar figure for the planned retention/repeat cohort figure because no retention
      data (NRR, GRR, churn, cohort periods) is publicly available for Fundamental; the company launched
      in February 2026 and has disclosed no retention metrics whatsoever. A retention cohort cannot be
      constructed without actual cohort data, and inventing values would violate the no-invented-facts
      rule. The bar figure uses hiring-signal and channel-launch data as the best available proxy for
      customer segment adoption traction.
  - dimension: paywallRisk
    reason: >
      Bloomberg TV interview (SU021) is behind a Bloomberg paywall and is cited only for confirming
      CEO media presence at Founders Forum in June 2026, not for any substantive customer or financial
      claim. LinkedIn (SU020) is js-only and is cited only for confirming company social presence.
      Both restricted sources are corroborative only; all material claims rest on non-paywalled sources.
      The combined restricted share is 2 of 27 sources (7.4%), well below the 30% ceiling.
