schemaVersion: "report-v2"
artifact: customers
slug: fundamental
runDate: "2026-06-27"
company:
  name: Fundamental Technologies
chapter:
  number: 6
  title: Customers
  summary: >
    Fundamental's customer story is structurally thin at the public level: seven-figure Fortune 100 contracts
    were claimed at the February 2026 launch in an authoritative AWS press release and confirmed by TechCrunch,
    but no named enterprise customers, case studies, logos, retention metrics, or customer-reported outcomes
    are publicly available as of June 27, 2026. The AWS SageMaker and SAP Business AI distribution channels
    provide credible reach into enterprise buying centres, and hiring signals confirm active energy, financial
    services, and Japan pipeline. The customers chapter therefore rests primarily on use-case proof, channel
    logic, and hiring-signal inference rather than independent customer validation — a material gap investors
    must close in primary diligence.

sections:
  - id: customer-segments-and-verticals
    title: Customer Segments and Target Verticals
    body: >
      Fundamental targets mid-to-large enterprises whose core business decisions depend on structured tabular
      data — particularly in verticals where predictive accuracy translates directly to financial outcomes.
      The primary buyer personas are Chief Data Officers, Chief AI Officers, and VP-level data engineering
      leaders who can authorize seven-figure enterprise software contracts. Data scientists and ML engineers
      are the primary user personas who evaluate and deploy the product. The secondary buyer is enterprise
      IT and security, who must approve the VPC deployment and data residency architecture. Per the AWS press
      release and product pages, key verticals include financial services (fraud detection, credit scoring),
      insurance (risk modelling), healthcare (clinical decision support), manufacturing (predictive maintenance),
      retail and supply chain (demand forecasting, pricing), energy (production optimisation, asset
      maintenance), and gaming and e-commerce. The Global Head of Energy job posting (Houston, June 2026)
      targets oil and gas supermajors, NOCs, and large independents with stated deal sizes of $1M–$10M+ ACV,
      confirming that energy is an active enterprise vertical with named target accounts. Japan expansion is
      confirmed by two open FDE roles posted on-site in Tokyo (June 2026). The SAP Business AI integration
      broadens the target to any SAP ERP or CRM enterprise customer globally without requiring a direct
      Fundamental sales engagement. Conference presence confirms additional verticals in focus: financial
      services (Money20/20, Mastercard panel), enterprise software (Dreamforce 2026), and global enterprise
      (WEF Davos January 2027). No customer segmentation by revenue band, geography share, or ARR
      contribution is publicly disclosed, making revenue concentration assessment impossible without
      primary access.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-proof-and-trajectory
    title: Adoption Proof and Trajectory
    body: >
      The strongest public proof of customer adoption is the February 5, 2026 AWS press release, which
      states that Fundamental "has already secured seven-figure contracts with Fortune 100 enterprises
      for use cases including demand forecasting, price prediction, and customer churn." This claim is
      corroborated by TechCrunch's independent reporting on the same date. Both sources are credible:
      the AWS press release was authored by Amazon, not Fundamental, and TechCrunch is a tier-1 tech
      media outlet. However, the claim is nearly five months old as of June 2026 and no incremental
      update has been published. No customer names, logos, case study URLs, or customer-reported
      outcomes appear on fundamental.tech. The website has no testimonials section, no customer
      logos bar, and no success story pages. The FDE blog post by ex-Palantir FDE Ionut Farcas (March
      2026) describes Fortune 100 customer calls where "the first conversation goes straight to POC"
      and active benchmarking sessions — plausible evidence of enterprise pipeline but from an internal
      source. The world cup prediction tool (soccer.fundamental.tech) demonstrates live NEXUS inference
      accuracy on public tabular data (81% recall on group-stage games) and provides independent
      verifiable evidence of model quality, though it is a marketing demo rather than an enterprise
      deployment. No G2, Capterra, Gartner Peer Insights, or equivalent third-party reviews exist for
      NEXUS as of June 27, 2026. No government procurement records or tender documents have been found.
      The most recent adoption signal is the World Cup demo (June 19, 2026) and the AWS ML blog
      announcement (June 9, 2026) — both product/marketing signals, not customer proof.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002

  - id: retention-durability-and-gaps
    title: Retention, Durability, and Metric Gaps
    body: >
      No retention metrics — NRR, GRR, churn rate, renewal rate, cohort data, contract length distribution,
      or customer satisfaction scores — are publicly available for Fundamental. The company launched in
      February 2026, which means its oldest customers have been in production for at most four to five
      months as of the June 2026 run date. First-contract renewal cycles in enterprise seven-figure software
      deals typically run 12–36 months, so no renewal data is plausible yet. The AWS press release states
      that contracts have been "secured" — consistent with either signed SOWs or multi-year agreements.
      The confidential computing architecture and single-tenant VPC deployment model are natural retention
      anchors once production data pipelines are built on NEXUS: switching costs are high because the
      enterprise data team's ML workflow is coupled to the SDK API and the deployment infrastructure.
      The FDE model (forward deployed engineers embedded with customer data teams) is explicitly designed
      to accelerate time-to-production and deepen the integration footprint, both of which increase
      stickiness. However, all retention logic is structural inference — no empirical data on actual churn
      or renewal has been published. The presence of Reddit r/dataengineering skepticism (February 2026)
      about schema heterogeneity and production data quality suggests that at least some enterprise
      evaluators may encounter implementation friction that could delay or block production deployment.
      This is not evidence of churn but a risk signal that could affect early-cohort retention rates.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
    tableRefs:
      - TU004
    figureRefs:
      - FU003

  - id: expansion-and-concentration-risk
    title: Expansion and Concentration Risk
    body: >
      Fundamental's land-and-expand model relies on the observation that a single NEXUS SageMaker endpoint
      can host multiple trained models simultaneously, enabling an enterprise that starts with fraud detection
      to add demand forecasting and customer churn without additional infrastructure. The FDE model is
      explicitly designed to expand within accounts by identifying adjacent prediction use cases at each
      customer site. This is a structurally sound expansion path in enterprises with many tabular prediction
      workflows, but it depends on the customer having multiple high-value prediction problems addressable
      by tabular data — which is nearly universal in Fortune 100 financial services but more variable in
      other verticals. The AWS and SAP distribution channels each provide access to thousands of enterprise
      customers, creating substantial top-of-funnel without requiring direct Fundamental sales for initial
      discovery. Concentration risk is the most critical unanswered question in this chapter. If seven-figure
      contracts represent three to five large customers, the early ARR base is highly concentrated. A single
      Fortune 100 non-renewal or delayed POC could represent material ARR risk at this stage. No customer
      count, ARR breakdown, or top-customer revenue share is publicly disclosed. The $1M–$10M+ ACV signal
      from the Global Head of Energy job posting implies very few contracts are needed to reach significant
      ARR, which amplifies concentration risk. The Salesforce Ventures Series A participation creates a
      potential future CRM integration opportunity, but there is no published product roadmap or Salesforce
      ecosystem deployment as of June 2026.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
    tableRefs:
      - TU005

  - id: customer-evidence-quality-and-outlook
    title: Customer Evidence Quality and Diligence Outlook
    body: >
      Fundamental's customer evidence as of June 2026 is at the "Series A launch-day claim" stage:
      authoritative enough to justify a $1.4B valuation and a $225M Series A, but insufficient for
      independent underwriting of customer durability, concentration, or expansion trajectory. The
      credible elements are: (1) an AWS-authored press release confirming Fortune 100 contracts and
      use cases — AWS has independent commercial reasons to ensure accuracy; (2) TechCrunch independent
      corroboration; (3) job postings consistent with active enterprise pipeline in energy, financial
      services, and Japan; (4) the FDE model (ex-Palantir architecture) which scales forward-deployed
      customer success and is a proven enterprise AI GTM pattern. The gaps are systematic: no named
      customers, no case studies, no third-party reviews, no retention data, no ARR breakdown, no
      customer count, no pricing page. An investor or acquirer should request: (a) a customer reference
      list with at least 5 named production customers; (b) ARR and NRR figures as of Q2 2026; (c)
      top-customer revenue concentration (what % of ARR comes from the top 3 customers); (d) a
      signed customer pipeline report showing POC-to-production conversion rate; and (e) confirmation
      of renewal status for any contracts approaching their first anniversary (likely mid-2027 for the
      earliest February 2026 contracts). Until then, the customer story must be treated as "claimed
      but not independently verifiable" for the purposes of this diligence.
    claimRefs:
      - CU030
      - CU031
      - CU032
    figureRefs:
      - FU004

