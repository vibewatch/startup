    data:
      columns:
        - 可获得证据
        - 质量等级
        - 主要来源
        - 缺口 / 风险
      rows:
        - label: 具名企业客户
          values:
            - 公开未披露
            - 零
            - 所有公开材料均确认缺失
            - 关键——无法独立验证牵引力
        - label: 客户数量
          values:
            - 未披露
            - 零
            - 缺失：未公布客户数量
            - 集中度风险未知
        - label: 生产部署状态
          values:
            - AWS 新闻稿：'合同'（深度未验证）
            - 低
            - AWS 新闻稿 + TechCrunch（2026 年 2 月）
            - 试点与生产状态未知
        - label: 客户报告结果
          values:
            - 未发布
            - 零
            - 官网无案例研究或 ROI 指标
            - 无法验证声称的价值主张
        - label: 留存指标（NRR / GRR）
          values:
            - 未披露
            - 零
            - 没有任何形式披露
            - 耐久度和扩张率未知
        - label: 独立第三方评论
          values:
            - 截至 2026 年 6 月，G2 / Capterra / Gartner 上无记录
            - 零
            - 已确认评论平台缺失
            - 没有来自用户社区的社会证明
    approximationNotes: |
      质量等级是基于截至 2026 年 6 月 27 日公开记录中可获得证据范围与独立性的定性判断。
    claimRefs:
      - CU013
      - CU014
      - CU031
  - id: FU004
