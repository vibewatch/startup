  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Fundamental 的含义
      - 尽调问题
    rows:
      - - 企业 AI 采用正从试点跨向生产（2026 年 94% FSI 试点生成式 AI）
        - 加速因素
        - 当前 / 活跃
        - 大量企业无法把试点推进到生产，未满足需求很大
        - 确认 NEXUS POC 从试点转生产的转化率
      - - 按消耗计价降低准入门槛（Databricks Genie、Looker token 计费）
        - 加速因素
        - 活跃（2026 年 7–10 月）
        - 按量付费移除前置许可门槛；利好低摩擦切入
        - 明确 Fundamental 定价模型；验证是否符合客户对消耗计费的预期
      - - EU AI Act 将信用评分列为高风险（2027 年 12 月生效）
        - 加速因素（治理需求）+ 约束（合规负担）
        - 贯穿 2027 年逐步增强
        - 客户需要可审计、确定性的模型 — LTM 架构在技术路线上匹配
        - 验证 Fundamental 面向 EU 客户的合规文档准备度
      - - Agentic / API-first 架构迁移（Databricks Genie Agents、ThoughtSpot Spotter、Tableau Next）
        - 加速因素
        - 2026 年活跃
        - 扩大用例表面；在 agentic 工作流中拉动模型 API 需求
        - 评估 NEXUS API 与 agentic 编排框架的兼容性
      - - 既有平台锁定（Databricks Unity Catalog、Snowflake 治理边界）
        - 约束
        - 持续
        - 已投入 Databricks 或 Snowflake 的企业客户采用外部 ML 会遇到治理摩擦
        - 量化 Databricks / Snowflake 原生栈客户的 POC 到成交率
      - - 演示惊艳但落地失效的生产准确率缺口
        - 约束
        - 持续（Databricks 2026 年有记录）
        - 企业要看自己数据环境中的基准证据，而不是供应商基准
        - 获取 NEXUS 第三方基准结果或客户验证研究
