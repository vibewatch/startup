      - number: '6.4'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              Fundamental 的 land-and-expand 模型依赖一个观察：单个 NEXUS SageMaker
              端点可以同时承载多个已训练模型，因此企业从欺诈检测起步后，可以在不增加基础设施的情况下加入需求预测和客户流失。FDE
              模型明确设计为在每个客户现场识别相邻预测用例，从而在账户内扩张。对拥有大量表格预测工作流的企业而言，这是一条结构合理的扩张路径；但它取决于客户是否有多个可由表格数据解决的高价值预测问题——这在 Fortune
              100 金融服务中几乎普遍存在，在其他垂直则更不稳定。AWS 和 SAP 分发渠道各自触达数千家企业客户，为初始发现带来大量 top-of-funnel，且不需要 Fundamental
              直接销售。集中度风险是本章最关键的未回答问题。如果七位数合同代表三到五个大客户，早期 ARR 基础就高度集中。单个 Fortune 100 客户不续约或 POC 延迟，在当前阶段都可能带来实质 ARR
              风险。公司没有公开客户数量、ARR 拆分或头部客户收入占比。Global Head of Energy 岗位中的 $1M–$10M+ ACV 信号意味着，只需很少合同就能达到可观
              ARR，也会放大集中度风险。Salesforce Ventures 参与 Series A 创造了未来 CRM 集成机会，但截至 2026 年 6 月，没有公开产品路线图或 Salesforce 生态部署。
