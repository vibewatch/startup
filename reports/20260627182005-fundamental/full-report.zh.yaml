      - number: '8.2'
        title: 估值背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              解读 $1.4B 标记最干净的方法，是先把它看作市场事件，其次才是经过承销的财务结果。TechCrunch、AWS 和 Crunchbase 共同让价格和时点可信，而 2026 年 2
              月的独角兽浪潮解释了投资者为何愿意为主题性 AI 暴露拉伸估值。这一浪潮并非凭空出现：TechCrunch 2026 年 1 月数据表明，2025 年有 49 家美国 AI 初创公司融资 $100M
              或更多，同年诞生 36 家新科技独角兽，确认 Fundamental 这一轮处在持续多个季度的 AI 融资制度中。记录没有显示的是，Fundamental 是否拥有足以仅凭 fundamentals
              支撑溢价倍数的 ARR 基础、利润率画像或留存。因此，可比公司很重要。Snowflake 是最有用的、由申报文件支持的锚点，因为它反映了公开市场如何给具备 AI 邻近功能的企业数据平台定价。Alteryx
              则是警示：当扩张放缓时，point-solution 分析故事可能会剧烈压缩。ThoughtSpot 和 Tableau（Salesforce 旗下）把可比集进一步延伸到企业分析领域，展示 incumbent
              如何在规模上定价和分发结构化数据工具；BigQuery 的消费型定价模型则展示了另一种买家可与 NEXUS 对照的成本架构。TabPFN 和 Snowflake Cortex Analyst
              的重要性不同：它们框定的是竞争和定价压力，而不只是退出估值。合在一起，可比集支持的是纪律，而不是以当前价格兴奋追入。
