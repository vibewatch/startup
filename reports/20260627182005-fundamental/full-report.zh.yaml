      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              企业 analytics AI 的需求论据由四个结构性驱动同时支撑。第一，AI 采用已从实验跨入主流：94% 的金融服务公司正在试点或部署 gen AI，成本削减目标最高达运营成本的
              20%。第二，定价模型被打破——Databricks 和 Looker 的用量计费移除了前期席位许可门槛，这一门槛过去常阻碍分析工具大范围部署。第三，治理和合规压力正在加速：EU AI Act
              针对信贷评分系统的高风险规则将于 2027 年 12 月生效，给部署自动预测的企业制造合规紧迫感。第四，agentic 架构迁移正在把 analytics AI 拉向自动化工作流执行：Databricks 于
              2026 年 7 月将 Genie Spaces 更名为 Genie Agents，ThoughtSpot 将 Spotter 定位为「agentic
              analytics」平台，基础模型的用例表面因此扩大。约束侧有三个实质摩擦点。Databricks 自有产品文档承认，带 AI assistant 的传统 BI 工具「frequently struggle
              with real-world data complexities, providing impressive demos but failing in practice」——demo
              环境表现与生产准确率之间的落差是真实采用障碍。第二个约束是在位平台锁定：Databricks 的 Unity Catalog 跨云治理数据、模型和 AI app，形成治理飞轮，惩罚采用外部 AI
              工具的客户。第三是资本密集度：Databricks 收购 Neon（$1B，2025 年 5 月）、Tecton、Mooncake Labs 和 Quotient AI，体现平台整合正在压缩独立
              analytics AI 产品的空白地带。Fundamental 的战略回应——机密计算、单租户 VPC 部署、硬件证明安全——直接处理治理摩擦，但不能移除在位分发护城河。
