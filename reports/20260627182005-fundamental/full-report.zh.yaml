      - number: '3.3'
        title: 开源竞争威胁与负面证据
        blocks:
          - type: paragraph
            body: >-
              Fundamental 最被低估的竞争风险，是开源表格基础模型生态。PriorLabs 的 TabPFN（Bernhard Schölkopf、Yann LeCun 和 Max Welling
              背书）是一个免费的、发表于 Nature 的表格基础模型。TabPFN-3（2026 年 6 月 arXiv）是最新版本；TabPFN-2.5（2025 年 11 月）展示了持续性能提升。TabPFN-2
              Nature 论文（2025 年 12 月，priorlabs.ai 技术报告）记录了可扩展到 10M+ 行且无固定上限，直接削弱 Fundamental 的规模差异化主张。PriorLabs
              提供免费非商业使用（TabPFN v3 non-commercial license）、TabPFN v2 的 Apache 2.0，以及从 sales@priorlabs.ai
              获取的商业企业许可——形成直接定价压力点。2025–2026 年发表的相邻开源模型（TabICL、TabDPT、RocketPFN）进一步商品化表格基础模型范式。Reddit r/dataengineering
              社区帖子（2026 年 2 月）对 NEXUS 可行性提出实质担忧：schema 标准化挑战、杂乱真实数据上的 zero-shot 表现，以及「NEXUS 声称要消除的 ETL
              要求」实践中仍然需要。Fundamental 自家 advisory board 成员 Gaël Varoquaux（scikit-learn 共同创建者、TabPFN 学术谱系共同开发者）表示，「some
              models that look great on standard tests fall apart when you evaluate them the way enterprise data
              actually breaks」——这一警示直接适用于 NEXUS 自报基准。Hacker News 讨论（2026 年 3 月）直白指出，「the bottleneck in tabular AI has
              always been the data graph, not the model」，且企业表格 ML 80–90% 的工作是多表数据准备，NEXUS
              并未消除这一点。这些负面信号合在一起，构成真实的护城河侵蚀风险；投资人和运营者必须把它与 Fundamental 的专有模型主张一起权衡。
