  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Fundamental 位于四类重叠竞争类别的交叉处，买家可以在这些类别之间替代，而不必完全绑定任何单一供应商。第一类、也是资本最密集的竞争者，是把 analytics AI
              打包进既有订阅的在位数据平台厂商：Databricks（Genie Agents、Unity Catalog governance）、Snowflake（Cortex Analyst、Cortex AI
              SQL）、Google（Gemini in BigQuery、Looker Conversational Analytics）和 Salesforce（Tableau AI、Tableau
              Pulse、Tableau Next）。这些厂商都拥有既有企业合同的分发优势，可以用接近零的增量切换成本为买家增加 analytics AI。仅 Databricks 就覆盖 20,000+ 家组织，包括 70%
              的 Fortune 500；这些客户无需签新供应商合同即可采用 Genie。第二类是专用 analytics copilot：ThoughtSpot 的 Spotter（agentic
              analytics、governed data architecture、automated workflows）在架构上最相似，但它工作在 NL-to-SQL 查询层，而非表格预测层。第三类是企业 AI
              决策平台：Palantir AIP 集成成本更高（AIP Bootcamp、Ontology 构建）、价格层级也更高，但它用受监管行业的生产 AI 用例服务同一批 Fortune 100
              买家。第四类——也是结构性威胁最大的一类——是开源表格基础模型：PriorLabs 的 TabPFN（Yann LeCun 和 Bernhard Schölkopf 背书、免费、发表于 Nature、可扩展到
              10M+ 行）以及相邻学术模型（TabICL、TabDPT、RocketPFN）直接挑战 Fundamental 的专有模型护城河。现状替代方案包括：（1）dbt Semantic Layer 搭配 BI
              工具（内部自建，避免任何模型许可），以及（2）XGBoost/LightGBM scikit-learn pipeline；后者仍是多数企业数据科学团队的默认选择。
