            title: 架构不透明是受监管企业销售的单点故障
            body: >
              NEXUS 的核心架构没有披露。受监管行业买家（SR 11-7 下的银行监管、HIPAA 下的医疗、CRD V
              下的欧盟金融服务）需要可解释性和审计轨迹，这是硬要求，不是可选项。get_feature_importance() 函数提供特征级归因，但不等同于监管签核所需的完整模型可解释性。如果 NEXUS
              无法通过内部模型风险管理评审，企业试点无论 POC 表现多好，都会卡在生产签核。
