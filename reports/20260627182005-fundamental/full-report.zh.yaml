        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月 5 日募集的 $225M Series A，加上估算的 $30M 早期 seed 资金，给公司带来表面上 $255M 的总现金储备。按 AI 创业公司 burn rate
              基准——Fundamental 当前阶段和人数（估算 50–150 名员工、25 个开放岗位）通常每月 $2M–$8M——隐含 runway 约为 2.5 年到 10 年以上。这个区间太宽，实用性有限；实际
              burn 高度取决于：（1）员工数和 FDE 人员成本，（2）企业销售招聘节奏（9 个商业开放岗位显示正在主动扩张），（3）试点期间在客户环境运行 NEXUS 模型的 AWS 基础设施成本，以及（4）任何 R&D
              密集型模型再训练或微调成本。公司截至 2027 年 1 月的活动日程（Dreamforce、Money20/20、WEF
              Davos）意味着实质会议营销支出。任何已审阅来源都未提及债务、项目融资或信贷额度；公司看起来完全由股权融资支持。下一次融资触发点未知——截至报告日期，公司距 Series A 已 16 个月，且没有披露可推动
