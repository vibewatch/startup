              截至 2026 年 6 月，Fundamental 的客户证据处在「Series A 发布日主张」阶段：权威性足以支撑 $1.4B 估值和 $225M Series
              A，但不足以独立承销客户耐久性、集中度或扩张轨迹。可信部分包括：（1）AWS 撰写的新闻稿确认 Fortune 100 合同和用例——AWS 有独立商业理由保证准确；（2）TechCrunch
              独立佐证；（3）招聘信息与能源、金融服务和 Japan 的活跃企业管线一致；（4）FDE 模型（前 Palantir 架构），它能扩展 forward-deployed 客户成功，也是已被验证的企业 AI GTM
              模式。缺口是系统性的：没有具名客户、没有案例研究、没有第三方评价、没有留存数据、没有 ARR 拆分、没有客户数量、没有定价页。投资者或收购方应要求：（a）至少 5 个具名生产客户的客户 reference
