  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，NEXUS 是 Fundamental 唯一已商业化的产品。它被归类为 Large Tabular Model（LTM）——一种基础模型，预训练数据来自超过 100
              亿个真实企业表格数据集，可直接在结构化数据上完成监督预测任务（分类和回归），客户无需工程化特征，也无需从零重新训练。公司明确把产品定位为 AI 的「左脑」：处理确定性、结构化预测负载，而这类负载常因
              tokenization 伪影、精度损失和上下文窗口限制，让 LLM 表现不佳。NEXUS 暴露两个主要类：NEXUSClassifier（用于二分类和多分类）与
              NEXUSRegressor（用于连续值预测），二者都遵循 scikit-learn 的 fit/predict/predict_proba
              API。时间序列模块会按数据集特征在五种架构中自动选择。用例包括欺诈检测、预测性维护、需求预测、价格预测、客户流失和信用评分。soccer.fundamental.tech 上的公开实时 demo 展示
              NEXUS 预测 2026 年世界杯结果，在决定性小组赛上的召回率为 81%，为模型在表格数据上的推理质量提供了可独立验证的证据。产品以「Power to Predict」商标营销。CSO Marta
              Garnelo 与创始顾问 Wojciech Czarnecki（均曾任职 DeepMind）撰写的研究白皮书奠定理论基础，把 NEXUS 描述为一种通过上下文学习运作、并绕开 transformer
              局限的通用预测器。
