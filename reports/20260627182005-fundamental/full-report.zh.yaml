      - number: '4.4'
        title: GTM 动作与销售效率 proxy
        blocks:
          - type: paragraph
            body: >-
              Fundamental 的 GTM 动作结合了两个不同渠道。直接渠道依赖 Forward Deployed Engineers 嵌入企业账户，在承诺生产部署前，与在位基线做 head-to-head
              benchmarking。间接渠道包括 AWS Marketplace 上架（通过 SageMaker 订阅）和 SAP Business AI 集成（通过 SAP 的 genAI Hub
              访问），它们降低了企业发现的冷启动问题。AWS 渠道受益于 AWS CEO Matt Garman 的公开背书和正式 SageMaker JumpStart 上架，两者都提供企业销售信用。SAP 渠道触达 SAP
              装机基础，但把 NEXUS 放在开放竞争货架上，与 SAP 加入的任何模型并列；随着其他厂商集成，平台优势可能削弱。截至 2026 年 6 月，GTM 招聘信号包括 9 个商业开放岗位（Enterprise
              Account Manager、Global Head of Energy、FDE Full-Stack、FDE Data Scientist），共同确认销售正在主动爬坡。Global Head of
              Energy 岗位瞄准油气行业 $1M–$10M ACV 合同；这是高价值但长周期垂直行业，若拿下，可能显著拉高平均合同价值。胜率、周期长度和 CAC 回本等销售效率 proxy
              完全未公开；基准证据显示客户参与强度高且手工化，符合很高 ACV 与相应高销售成本的组合。
