              公司的里程碑弧线从 2024 年创立延伸到 2026 年初非常密集的产品发布。2024 年 10 月创立为推断，依据是 product-customers pack 中的引用；2026 年 2 月 4 日
              Terms of Use 生效日期确认，发布时公司法定实体已完整运转。隐身到发布的切换很快：Series A 和公开产品首发在 2026 年 2 月 5 日同步宣布，同时声称已与 Fortune 100
              客户签下七位数合同。2026 年春季和初夏的后续里程碑包括 SAP Business AI 集成、AWS SageMaker JumpStart 上架（2026 年 6 月 8–9 日正式发布），以及 2026
              年 6 月 19 日上线的 soccer.fundamental.tech 世界杯 demo；该 demo 在决定性小组赛上展示了 81% 准确率。截至 2026 年 6
              月下旬，公司在商业（9）、工程（9）、研究（4）、市场（2）和运营（1）职能共列出 25 个开放岗位；这一招聘信号与约 50–150 人团队向企业 GTM 执行扩张相符。负面观察：Christoph Molnar
