        title: 留存、耐久性与指标缺口
        blocks:
          - type: paragraph
            body: >
              Fundamental 没有公开任何留存指标——NRR、GRR、流失率、续约率、cohort 数据、合同期限分布或客户满意度分数都不可得。公司于 2026 年 2 月发布，意味着截至 2026 年 6
              月运行日，最早客户最多投产四到五个月。企业七位数软件交易的首份合同续约周期通常为 12–36 个月，因此现在没有续约数据是合理的。AWS 新闻稿称合同已「secured」——这既可能是已签
              SOW，也可能是多年协议。机密计算架构和单租户 VPC 部署模型，一旦生产数据管道建在 NEXUS 上，就会自然形成留存锚：切换成本高，因为企业数据团队的 ML 工作流与 SDK API
              和部署基础设施耦合。FDE 模型（forward deployed engineers
              嵌入客户数据团队）明确用于加速投产并加深集成足迹，两者都会提高粘性。但所有留存逻辑都是结构性推断——公司没有发布关于实际流失或续约的经验证据。Reddit r/dataengineering 上关于 schema
              异质性和生产数据质量的质疑（2026 年 2 月）说明，至少部分企业评估者可能会遇到实施摩擦，进而延迟或阻断生产部署。这不是流失证据，但确实是可能影响早期 cohort 留存率的风险信号。
