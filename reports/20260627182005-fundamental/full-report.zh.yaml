  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按严重度排序，展示 Fundamental 在模型质量、监管、依赖和执行上的主要公开风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 基准不透明
