      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Fundamental 作为独立软件卖方，目前并不明显受监管；但让 NEXUS 具备商业吸引力的许多用例，都处在高度受监管的决策流中。EU AI Act 将信用worthiness
              评估和某些保险风险用途列为高风险 AI，随之带来风险管理、日志、技术文档、数据集治理、准确性和人工监督要求。GDPR Article 22
              还通过限制对个人产生法律或类似重大影响的完全自动化决策，加入了另一层约束。实践中，客户若在 Europe 用 NEXUS 做承保、欺诈控制或信用评分，可能会迫使 Fundamental
              比一般分析软件供应商更早支持可解释性、可审计性和人工 override 工作流。


              UK 暴露相似但不完全相同。ICO 的 AI 指南把公平性、透明度、可争议性和偏差缓解明确纳入 UK GDPR 合规。Fundamental
              的公开隐私和条款页面有用但很轻；它们没有披露客户特定部署控制、受监管用途 carve-out
              或企业责任姿态。所提供来源中没有识别出公开诉讼或执法行动，但这只能提供很弱的安慰，因为公司公开运营才几个月，还没有积累长期运营记录。
