  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 基准不透明与护城河风险
        blocks:
          - type: paragraph
            body: >-
              Fundamental 的核心产品主张很激进：NEXUS 被描述为一个确定性的非 transformer Large Tabular Model，在超过 100
              亿张企业表上预训练。尽调问题在于，最强的基准证据仍由公司控制。产品页和白皮书给出了性能叙事，但所提供的证据集没有显示第三方复现、公开排行榜名次或客户级 scorecard。因此产品质量很难承销，因为令人印象深刻的
              demo 与稳健企业模型之间的差异，往往只有在表格混乱、稀疏、缺列或被流程漂移打断时才会显现。


              公司自己也放大了该风险：它发布了 Gael Varoquaux
              的警告，即一些模型在标准测试上看起来很好，但当企业数据以真实方式损坏时会崩掉。这句话有价值，因为它直接指向投资者应关注的运营失效模式。基准不透明也削弱护城河论证：如果性能证据一直停留在自发发布，而开源研究和仓库原生替代品快速改善，买家可能会把
              NEXUS 视为昂贵的评估项目，而不是耐久的平台标准。
