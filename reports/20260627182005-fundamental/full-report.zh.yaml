      - number: '7.3'
        title: 合作伙伴与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，Fundamental 的商业栈很窄。AWS 是具名云和分发伙伴，2026 年 6 月的 SageMaker 公告同时承担产品验证和集中度信号。这有助于企业可信度，但也意味着单一
              hyperscaler 可以影响托管经济性、采购摩擦、marketplace 可见性，以及更广渠道扩张的节奏。如果 AWS 改变 marketplace
              规则、推出自有竞争性表格能力，或降低共同销售支持优先级，Fundamental 的公开 go-to-market 故事会明显变弱。


              SAP 是另一个可见的企业依赖。Fundamental 的数据科学定位把 NEXUS 绑定到 SAP Business AI
              场景，这能加速进入既有企业工作流，但也把集成杠杆留给更大的平台所有者。剩下的依赖问题是客户不透明。公司指向七位数 Fortune 100 合同，但公开材料没有披露收入是多元化的，还是集中在少数 pilot
              中。因此，渠道风险和关键账户风险比合作伙伴标题显示的更难分开。AWS Marketplace 对 Fundamental AI 的搜索也显示，在具名共同销售安排之外产品发现能力有限，进一步强化了集中度风险。
