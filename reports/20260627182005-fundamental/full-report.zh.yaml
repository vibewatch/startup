  foundingLocation: Menlo Park, CA
  headquarters: San Francisco, CA (go-to-market); Menlo Park, CA (legal address)
  productSummary: >-
    NEXUS：一个 Large Tabular Model（LTM），用于从企业结构化数据中做确定性预测。核心用例包括需求预测、欺诈检测、价格预测和客户流失预测。产品通过兼容 scikit-learn 的 SDK（pip
    install fundamental-client）交付，提供 NEXUSClassifier / NEXUSRegressor 接口。它借助硬件 TEE 和密码学证明在客户 VPC 内运行，同时保护模型 IP
    和客户数据。产品已登陆 AWS SageMaker JumpStart、AWS Marketplace 和 SAP Business AI genAI Hub。
  customerFocus: 金融服务、保险、医疗、制造、零售、能源和游戏 / 电商领域的 Fortune 100 企业；销售由 FDE 牵头，目标是七位数 ACV 合同和 CDO/CAIO 级买家。
  businessModel: >-
