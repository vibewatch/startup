    rows:
      - - ARR 和 ARR 增速
        - 无法计算收入倍数；无法评估增长质量；估值基于投资论点而非收入
        - 索取产品发布以来每个季度的 ARR；索取同比增长轨迹
      - - 客户数量与客户名称
        - 无法评估集中度风险；无法验证 Fortune 100 合同主张；NRR 无法计算
        - 索取带 ACV 的已签客户名单；用具名客户证明验证 Fortune 100 说法
      - - 毛利率
