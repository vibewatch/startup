      - number: '2.2'
        title: 规模测算视角与证据约束下的机会
        blocks:
          - type: paragraph
            body: >-
              本轮研究未能取得企业表格 AI / analytics copilot 的干净分析师 TAM——Gartner、IDC 和 MarketsandMarkets
              报告均被付费墙挡住。最可信的替代方法是基于可访问一手证据做自下而上估算。Databricks 服务 20,000+ 家组织，包括 70% 的 Fortune 500 和 1,200+ 全球合作伙伴；即便其中只有
              10% 最终为表格 AI overlay 付费，也意味着 2,000+ 个企业账户。Snowflake 的 AT&T 案例记录了 84% 年度成本节省和亚秒级查询响应，量化了 analytics AI
              投资交付的价值。需求侧验证方面，Databricks 自有 2026 Financial Services 研究发现，94% 的 FSI 公司正在核心职能中试点或部署生成式 AI，AI 驱动自动化预计最多可降低
              20% 运营成本；这意味着高管层预算分配很强。定价信号也有启发：Databricks 于 2026 年 7 月将 Genie analytics AI 转为按量付费（每用户每月 150 DBU 免费 ≈
              $10.50，超出部分按 DBU 计价），Google Looker 则采用 token 计费（2026 年 10 月生效，输入 $3.00/M、输出 $20.00/M），为 analytics AI
              市场建立了按查询单位经济学参照。按 Looker token 价格，一个 1,000 用户企业、每用户每天处理 10 次查询，纯 analytics-AI token 成本每年约
              $1–3M，验证了企业级合同价值。Databricks 记录的「试点多于生产部署」模式表明，当前市场规模低于潜力：analytics AI
              的平台基础设施已经存在，但部署瓶颈（数据异质性、治理缺口、集成复杂度）压住了转化。这个瓶颈正是 Fundamental 的切入主张。
