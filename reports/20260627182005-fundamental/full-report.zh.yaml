              2026 年 3 月 HN ML 社区提出、并由 Gaël Varoquaux（Fundamental 自家 advisory board 成员）佐证的一项实质负面技术担忧是：企业表格 ML 80–90%
              的工作是多表数据准备，而不是模型选择。如果真正瓶颈是「the data graph, not the model」，那么即便 NEXUS 是同类最佳表格基础模型，也只能捕获企业 ML 价值栈的
              10–20%。这是竞争分析中结构性最不利的主张，应在任何尽调请求中被直接追问。
