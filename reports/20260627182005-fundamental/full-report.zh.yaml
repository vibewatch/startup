      - number: '7.4'
        title: 竞争与开源风险
        blocks:
          - type: paragraph
            body: >-
              Fundamental 并非在真空中竞争。PriorLabs 拥有活跃的 TabPFN 仓库、近期技术报告，以及围绕同一大类表格模型机会的商业包装。独立评论也并不一致看好 NEXUS：Christoph
              Molnar 2026 年 2 月的评测称他不推荐 NEXUS，而更偏好 TabICL v2。即便这些判断并不完美，它们仍然重要，因为企业买家在承诺漫长 POC
              之前，常用开源动能、基准可见度和分析师讨论作为供应商可信度捷径。


              竞争不止来自表格模型初创公司。Snowflake Cortex 和 Databricks AI 产品把 AI
              能力直接带入许多企业已经付费的仓库关系中。这很重要，因为买家可能更偏好「足够好」的仓库原生路径，而不是仍需要部署帮助和基准解释的新模型供应商。Snowflake 的 Cortex Search
              产品如今把该平台延伸到 AI 驱动检索用例，而 Databricks Lakehouse 定价让买家可以对照透明的分层消费计费。Google Cloud 的 BigQuery Gemini 集成增加了一条 GCP
              原生的结构化数据 AI 路径。Palantir Foundry 从另一个角度补足 incumbent 威胁：它在金融服务和保险领域拥有长期企业 AI 部署历史。Reddit 社区质疑和某期 Hacker News
              摘要中的低讨论热度不是决定性证据，但它们确实强化了更大的结论：Fundamental 仍需在一个开源研究和 incumbent 数据平台都快速推进的市场中赢得心智份额。
