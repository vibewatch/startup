  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Thesis 与 Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              投资 thesis 始于真实的品类野心信号。Fundamental 走出 stealth 时完成了 2026 年最大规模的 Series A
              之一，围绕确定性表格建模构建了技术上有差异的叙事，团队履历强到足以敲开大企业会议室。轮次构成也重要：顶级软件和数据投资者，加上 AWS 邻近的发布支持，构成了快速进入企业的可信路径。TechCrunch 关于
              2025 年 AI 融资 cohort 的数据，以及当年诞生 36 家以上独角兽的背景，说明这不是孤立事件，而是一波持续大型 AI 融资的一部分，也让 $1.4B 标记更合理。反 thesis
              在于，几乎所有经济证明点都还藏着。公开收入证据停留在公司关于七位数 Fortune 100 合同的说法，而交付模型依赖 forward deployed engineers，不是可见的 product-led
              软件扩张。独立批评者也不含蓄：Mindful Modeler 不推荐 NEXUS，TabPFN
              则提供了免费或摩擦更低、买家可以先测试的替代品。结果是一个有真实人才和分发上行的品类创造故事，但定价跑在公开证明之前。
