      - number: '3.4'
        title: 护城河耐久性、切换成本与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Fundamental 的护城河主张立在三根支柱上：（1）专有非 transformer 表格架构，在数十亿张企业表上预训练，声称在架构上不同于且优于 LLM 和经典 ML
              pipeline；（2）机密计算安全（硬件 TEE、密码学启动指纹、由架构而非政策实现 HIPAA/GDPR 合规），提供真正企业级数据保护；（3）与 AWS（SageMaker Marketplace）和
              SAP（Business AI 开放模型生态）的分发合作，缩短进入企业的时间。切换成本目前低到中等：NEXUS 使用兼容 scikit-learn 的
              API（fit/predict/predict_proba），可与开源替代品互换；客户可以用 TabPFN 或 XGBoost pipeline 替换
              NEXUS，无需重大集成返工。锁定机制主要来自合同（企业协议、FDE 关系），而非架构。多栖风险真实存在：客户可以在一个用例使用 NEXUS，在另一个用例使用 Databricks
              Genie，并不冲突。分发能力是最可防守的元素：AWS Marketplace 位置和 SAP 开放模型生态确实为企业买家提供发现优势。不过，SAP 的「open model ecosystem」意味着
              NEXUS 与 SAP 加入的任何模型平等竞争，包括免费模型。商品化风险方面，Databricks 的收购节奏（12 个月内 Neon、Tecton、Mooncake Labs、Quotient AI）和
              $100M+ OpenAI 合作显示，平台厂商正在把完整模型能力内建进自己的数据栈。PriorLabs 的 TabPFN-3（开源、Yann LeCun 背书、发表于 Nature）证明，表格基础模型范式无需
              Fundamental 正投入的专有训练基础设施也可复制。机密计算架构（硬件 TEE、密码学证明）是最可防守的护城河元素——没有开源竞争者提供等价的
              security-by-architecture——但即便如此，也需要 Fundamental 截至研究日尚未发布的第三方审计认证（SOC 2 Type II、ISO
              27001）。总体护城河评估：尚早、取决于执行，且商品化速度可能快于 $1.4B 估值所隐含的节奏。
