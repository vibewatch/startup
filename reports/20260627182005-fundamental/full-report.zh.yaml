      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              所有标准单位经济指标——CAC、LTV、回本期、NRR、毛利率和流失——均为私有，未在任何已审阅来源中披露。成本结构方向上偏高，因为 FDE（Forward Deployed Engineer）GTM
              要求每个客户投入昂贵人力资本：每名 FDE 直接嵌入企业客户环境，动手做模型集成、对标客户基线（XGBoost、LightGBM），并推动 POC 到生产的转换。这与 Palantir
              历史上高服务成本结构相似；在 Palantir 达到规模前，该结构曾压低其毛利率。NEXUS 的计算成本通过 AWS Marketplace 转嫁给客户，部分卸下基础设施成本；不过公司仍承担 R&D、模型维护和
              FDE 人员成本。学术开源竞争者（PriorLabs TabPFN、TabICL、TabDPT）带来定价压力，因为企业买家可免费或以极低成本部署它们，压缩 Fundamental 在未证明清晰 ROI
              优势前收取溢价的能力。FDE Data Scientist 岗位描述确认，逐项对标是标准销售周期机制，意味着每个客户销售周期都需要大量 solution-engineering 投入——这是 CAC
              的强预测变量，且没有 PLG 仪表化时结构上很难降低。
