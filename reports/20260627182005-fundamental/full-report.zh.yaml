  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 基准与监管弱点如何传导为客户摩擦、销售放缓和估值压力。
    data:
      nodes:
        - id: benchmark_opacity
          label: 基准不透明
        - id: poor_real_world_fit
          label: 真实世界拟合差
        - id: regulated_use_case
          label: 受监管用例
        - id: compliance_gap
          label: 合规缺口
        - id: customer_trust
          label: 客户信任流失
        - id: slower_expansion
          label: 扩张放缓
        - id: revenue_opacity
          label: 收入不透明持续
        - id: valuation_reset
          label: 估值重估风险
      edges:
        - from: benchmark_opacity
          to: poor_real_world_fit
          label: 自发布证明漏掉边缘案例
        - from: poor_real_world_fit
          to: customer_trust
          label: 试点暴露输出脆弱
        - from: regulated_use_case
          to: compliance_gap
          label: 法律义务随之落地
        - from: compliance_gap
          to: customer_trust
          label: 买方要求控制与人工覆盖
        - from: customer_trust
          to: slower_expansion
          label: 采购和部署放慢
        - from: slower_expansion
          to: revenue_opacity
          label: 试点难以顺畅转化
        - from: revenue_opacity
          to: valuation_reset
          label: 投资人无法验证质量假设
        - from: compliance_gap
          to: valuation_reset
          label: 受监管场景上行被打折
    approximationNotes: 节点和边只是把风险叙事做成因果简化，并非完整系统模型。它突出从产品主张传导到投资结果的最直接公开下行路径。
