      - number: '5.3'
        title: 差异化与竞争定位
        blocks:
          - type: paragraph
            body: >
              Fundamental 的主要差异化来自三件事的组合：专门构建的 LTM 架构（不同于 transformer）、企业安全封装（机密计算），以及通过 AWS 和 SAP 生态分发。三者合在一起，瞄准企业采用 AI
              最常见的三个阻碍：数据驻留、集成复杂度和模型可审计性。scikit-learn API 把现有数据科学团队的集成负担降到接近于零。但竞争位置存在明显弱点。最直接的竞争对手 PriorLabs 的 TabPFN
              开源、免费，2025 年 1 月发表在 Nature，并且截至 2025 年 12 月已在 Scaling Mode 中扩展到 1000 万+ 行且没有固定上限——以零成本在同一范式上正面竞争。TabPFN
              也提供私有云和 API 部署选项（priorlabs.ai）。Fundamental 没有发表同行评议论文；白皮书在公司材料中被称为「research
              manifesto」，不是基准研究。fundamental.tech/nexus 的基准对比部分展示了性能比较，但没有公布原始数字、方法或可复现实验集。r/dataengineering 上的社区讨论（2026
              年 2 月 15 日）质疑 schema 异质性、在混乱生产企业数据上的 zero-shot 表现，以及「无需特征工程」这一主张能否在没有定制 ETL 管道的真实脏数据上成立。Gaël
              Varoquaux（scikit-learn 共同创建者、Probabl 的 CSO）的顾问履历提供了可信度，但 Varoquaux 本人也是竞争性表格 AI 学术工作的共同开发者。University of
              Hong Kong 关于关系数据库基础模型的相邻学术预印本（arXiv 2602.13697，2026 年 2 月）确认，该研究空间正在迅速拥挤。因此，Fundamental
              的护城河更依赖企业安全封装、合作伙伴分发（AWS + SAP）和执行速度，而不是独占的技术新颖性。
