      - number: '3.2'
        title: 竞争者画像、能力与定价
        blocks:
          - type: paragraph
            body: >-
              Databricks 是最完整的 analytics AI 竞争威胁。其 Genie 产品套件——Genie Agents（支持多轮对话的 NL-to-SQL）、Genie One（带移动 app
              的业务用户消费层）和 Genie Code（AI coding assistant）——提供由 Unity Catalog 治理的完整 analytics AI stack，且不需要单独 BI seat
              许可。Databricks 于 2026 年 7 月将 Genie 转为按量付费（每用户每月 150 DBU 免费 ≈ $10.50），管理员可设置单用户支出预算，OpenAI GPT-5 集成（最低 $100M
              合作）则给它一流模型访问。其对 Neon（$1B，2025 年 5 月）、Tecton、Mooncake Labs 和 Quotient AI 的收购，把平台延伸到实时事务型
              AI，直接压缩了独立表格预测厂商的空白。Snowflake Cortex Analyst 以 Semantic Views 差异化：原生基于 YAML 的 schema 对象定义业务实体、维度、事实和指标，使带
              RBAC、共享和内置治理的多轮 text-to-SQL 成为可能。Cortex AI SQL 提供 13 个 AI 函数（AI_COMPLETE、AI_CLASSIFY、AI_AGG、AI_SENTIMENT
              等），由 OpenAI、Anthropic、Meta、Mistral 和 DeepSeek 模型驱动。Snowflake 的 AT&T 案例记录了 84%
              年度成本节省和亚秒级查询响应。Looker（Google）在 conversational analytics 层竞争：Standard tier 每月免费提供 60M 输入 / 1.2M 输出
              token，Enterprise tier 为 300M/6M，超额按输入 $3.00/M、输出 $20.00/M 计费（2026 年 10 月生效）。Tableau Next（Salesforce）定位为
              API-first agentic analytics：可组合架构、可信语义、个性化洞察。ThoughtSpot 的 Spotter 结合「agentic analytics, governed data
              architecture, and automated workflows」，是 Fundamental analytics-AI 定位最直接的同类产品，尽管 Spotter 聚焦查询 /
              洞察生成，而非表格预测。Palantir AIP 及其 Ontology（「decision-centric system integrating AI with enterprise data, logic,
              and action」）通过 AIP Bootcamps（几天内从零到用例）瞄准同一批 Fortune 100 受监管买家；这种高接触 GTM 模型直接争夺 Fundamental FDE 驱动销售的同一预算。
