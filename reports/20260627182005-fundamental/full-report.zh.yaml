      - number: '7.5'
        title: 财务、执行与 go-to-market 风险
        blocks:
          - type: paragraph
            body: >-
              融资标题很强：Fundamental 以 $1.4B post-money 估值融资 $255M，投资人阵容为
              blue-chip，且有知名运营者支持该轮。问题在于，相对这一估值，公开运营披露仍很薄。管理层提到七位数 Fortune 100 合同，但所提供证据集仍未披露
              ARR、NRR、流失、毛利率或经审计财务报表。因此，投资者无法判断公司拥有多个扩张中的企业关系，还是只有少数高接触 pilot；这些 pilot 绝对金额看起来大，但经常性软件质量弱。


              执行风险直接绑定 go-to-market 设计。Fundamental 自己的 FDE 文章认为 wrapper 式部署会失败，真正价值需要深度现场执行。这可能正确，但也意味着交付依赖人头、onboarding
              更慢；若每次扩张都依赖稀缺技术人才，还可能压低利润率。当前在研究、工程和商业 hub 的招聘显示动能，但也说明部署质量、团队留存和服务经济性仍在实时搭建，而不是已经在规模上被证明。
