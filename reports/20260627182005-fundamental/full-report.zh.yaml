  - id: FE001
    title: NEXUS 产品架构栈
    type: stack
    layout: standard
    summary: |
      五层架构：从客户数据摄取，到 LTM 核心引擎、模型组合、API 集成层，再到安全 / 部署层。
    data:
      layers:
        - label: 客户数据层
          detail: S3 / 客户云存储、本地数据库、SageMaker 异步推理输入；数据不传输给 Fundamental
          modules:
            - S3 / 云存储
            - 本地数据库（隔离环境）
            - SageMaker 异步推理输入
            - 数据托管：留在客户环境
        - label: NEXUS 核心 LTM 引擎
          detail: 非 transformer 架构，已在 >10B 行表格数据上预训练；通过 in-context learning 输出确定性推理
          modules:
            - 非 transformer 架构（专有）
            - 在 >10B 行真实世界表格数据上预训练
            - 确定性推理输出
            - 面向表格数据的 in-context learning
        - label: 模型组合（时间序列模块）
          detail: 根据数据集特征，在五种时间序列架构中自动选择
          modules:
            - 标准全局模型
            - 按性能聚类的模型
            - 分层-时间分解
            - 残差栈（基础预测器校正）
            - 频率-严重度拆分（零膨胀目标）
        - label: API 与集成层
          detail: 兼容 scikit-learn 的 Python SDK，加上 AWS SageMaker JumpStart 与 SAP generative AI Hub 分销
          modules:
            - Python SDK 安装：pip install fundamental-client
            - NEXUSClassifier / NEXUSRegressor
            - scikit-learn 接口：fit / predict / predict_proba
            - AWS SageMaker JumpStart 包
            - SAP Business AI generative AI Hub 分发入口
        - label: 安全与部署层
          detail: SageMaker 上的单租户客户 VPC；带加密启动指纹的机密计算 TEE；支持 air-gapped
          modules:
            - 单租户客户 VPC（SageMaker）
            - 机密计算 TEE（硬件强制）
            - 加密启动指纹；无主密钥
            - 隔离环境 / 本地支持
    approximationNotes: |
      架构来自公司官方博客和 AWS ML 博客；Fundamental 仅把核心 LTM 架构描述为「不是 transformer」——内部实现细节为专有信息。
