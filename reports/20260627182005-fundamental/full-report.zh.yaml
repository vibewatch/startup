      - number: '8.4'
        title: Thesis-Break 与 Kill Trigger
        blocks:
          - type: paragraph
            body: >-
              如果缺失指标低于价格隐含水平，thesis 会迅速破裂。第一个也是最明显的触发器是收入：如果 ARR 相对独角兽标记仍处于小规模，这一轮就是主题性融资，而不是 fundamental 支撑。第二，AWS
              独占渠道可以带来触达，也可能带来依赖；如果该关系变弱，或 AWS 推出具备实质替代性的原生产品路径，Fundamental 会同时失去分发杠杆和战略稀缺性。第三，如果独立基准持续偏向 TabPFN
              等免费替代品，公司可能难以守住溢价定价。第四，如果 Fortune 100 合同仍是定制 FDE
              engagement，而不是可重复的软件部署，利润结构会更像服务而不是软件。这些不是边缘风险，而是今天被拉伸的估值可能快速压缩的主要传导通道。
