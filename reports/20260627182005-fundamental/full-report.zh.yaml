      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Fundamental 的信任架构在设计上很复杂，但公开层面的认证为空。机密计算部署声称通过硬件 TEE、密码学启动指纹和要求二进制完全一致的密钥释放策略，同时保护模型 IP
              与客户数据——这对受监管行业客户是强设计。Fundamental 表示，SageMaker 部署在架构上兼容 HIPAA、GDPR 数据驻留、PCI-DSS
              和财务报告框架，原因是数据从不离开客户云账户，网络隔离容器在推理期间没有出站调用。但公开可见的 SOC 2 Type II、ISO 27001、FedRAMP 或同等认证都不存在。企业 Data
              Processing Agreement（DPA）没有公开版本，隐私政策只覆盖网站访客数据，企业条款很少。Terms of Use（2026 年 2 月 4
              日生效）要求有约束力的仲裁并排除所有保证，这是早期公司常见做法，但也意味着没有承诺 SLA。对医疗和金融服务买家而言，架构合规论证大概率足以进入 POC，但生产签核通常还需要正式认证。Terms of Use
              中的法律实体地址为 2160 Manzanita Avenue, Menlo Park, CA 94025，与新闻稿和营销中使用的「San Francisco HQ」信息不一致。该差异对尽调影响较小，但应与
              Delaware 设立记录核对。
