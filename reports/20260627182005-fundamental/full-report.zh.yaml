      - number: '1.2'
        title: 创始人、领导层与研究履历
        blocks:
          - type: paragraph
            body: >-
              Fundamental Technologies 由一批 DeepMind 校友搭起核心班底；对一家成立不到两年的创业公司而言，这种机器学习研究背书很少见。TechCrunch、公司官网和 2026 年 2 月
              5 日 AWS 官方新闻稿均公开确认 Jeremy Fraenkel 为 CEO 兼联合创始人；其他联合创始人未公开具名。Marta Garnelo 担任 Chief Science Officer，她在
              DeepMind 期间发表过 neural processes、meta-learning、多智能体强化学习和生成式建模研究；其 Google Scholar 主页独立佐证了这一背景。Wojciech
              Marian Czarnecki 担任 Founding Advisor；他被独立验证为 DeepMind 研究员，其共同署名的 StarCraft II 多智能体 RL 工作是该领域标志性成果。Gaël
              Varoquaux 是 scikit-learn 共同创建者（下载量超过 40 亿次），也担任 Founding Advisor，并在 2026 年 6 月现身公司 Ground Truth
              视频系列。除这些核心人物外，已发表博客作者还确认了更多高级员工：Alexandre Gerbeaux（Head of Applied AI，前 Mistral AI、前 DataRobot）、Yuval
              Azoulay（Founding Engineer，前 AI21 Labs）、Neil Leiser（Applied AI，前 Iwoca）、Ionut Farcas（FDE，前 Palantir）、Bryan
              D'Aversa（AI Product Lead）、Oleg Zarakhani（Lead Data Scientist）和 Arpit Jain（Applied AI）。团队横跨企业软件操盘手（来自
              Palantir 的 FDE 模型）、信用风险从业者（Iwoco）和有公开学术成果支撑的研究梯队。Fraenkel（CEO）和 Garnelo（CSO）分别是公司主要公开声音和技术锚点，关键人风险实质存在。
