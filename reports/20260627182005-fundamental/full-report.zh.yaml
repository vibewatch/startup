      - 相比 Fundamental 的关键局限
    rows:
      - - Databricks（Genie Agents）
        - 既有数据平台 — 分析 AI 套件
        - 私营；Series J 估值约 $62B；20,000+ 企业客户；覆盖 70% Fortune 500
        - 数据平台团队、数据科学家、业务分析师
        - 完整分析 AI 栈（NL-to-SQL、编码、BI 仪表盘）由 Unity Catalog 治理；无需单独许可
        - NL-to-SQL copilot，不是表格预测基础模型；架构基于 LLM；不提供确定性结构化推理
      - - Snowflake（Cortex Analyst + Cortex AI，数据平台）
        - 既有数据平台 — 仓库原生 AI
        - '上市公司（NYSE: SNOW）；最大云数据仓库；10,000+ 企业客户'
        - FSI、零售、医疗健康中的云数据仓库客户
        - Semantic Views（原生 YAML schema 对象）；多轮 NL-to-SQL；13 个 AI SQL 函数；多模型（OpenAI、 Anthropic、Meta、Mistral、DeepSeek）
        - 查询 / BI 层，不是预测；数据必须留在 Snowflake；基于 LLM；重度用户成本高
      - - Google BigQuery + Looker（Gemini AI，数据平台）
        - 既有云平台 — AI 分析功能
        - Alphabet 旗下（市值 $2T+）；Looker 按 token 消耗计价
        - GCP 企业客户；BI 消费者；数据工程师
        - BigQuery 中的 Gemini 用于 SQL 生成；Looker Conversational Analytics（$3/M tokens）；GCP 客户切换成本近乎为零
        - 不是预测模型；仅面向 GCP 客户；重度使用受配额限制；只提供基于 LLM 的 text-to-SQL
      - - Salesforce / Tableau（Tableau AI、Pulse、Next，BI 平台）
        - 既有 BI 厂商 — agentic 分析
        - Salesforce 旗下（市值 $250B+）；约 100K 组织使用 Tableau
        - 业务分析师、高管、BI 消费者
        - Tableau Pulse（主动指标层）；Tableau Next（API-first agentic 分析）；Salesforce CRM 数据集成
        - BI 可视化层，不是企业预测；没有结构化表格基础模型；依赖 Salesforce / Tableau 生态
      - - ThoughtSpot（Spotter）
        - 专用分析 AI — agentic BI
        - 私营；Series F；估值约 $4.2B（2021 年峰值）；Salesforce Ventures 为投资方
        - 数据驱动型企业；业务负责人；寻求自助式自然语言分析的分析师
        - Spotter：agentic 分析 + 受治理数据架构 + 自动化工作流；SpotterViz：自动生成 Liveboards
