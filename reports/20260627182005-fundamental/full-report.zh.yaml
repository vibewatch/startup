      - number: '8.5'
        title: 最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终投资判断需要一份短但不可让步的尽调清单。第一，管理层需要披露当前 ARR、增长节奏，以及收入中经常性部分与部署辅助部分的占比。第二，投资者需要客户质量视图：logo
              集中度、扩张行为、续约条款，以及七位数合同是可重复还是例外。第三，轮次经济性与标题同样重要：清算优先权、secondary 参与、option-pool 变化和稀释，都可能实质改变 $1.4B
              标记的真实含义。第四，公司必须展示它为何能在客户真正信任的基准上胜过或与 TabPFN、Snowflake
              和仓库原生替代品共存。最后，退出准备度仍低，因此任何近期上行案例都依赖未来证明，而不是当前披露。在这些要求被回答之前，审慎姿态是保持观察，在首次 ARR 披露时重新检查，并守住入场纪律。
