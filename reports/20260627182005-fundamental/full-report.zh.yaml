companyProfile:
  summary: >-
    Fundamental Technologies, Inc.（fundamental.tech）于 2026 年 2 月 5 日走出隐身模式，以 $1.4B 投后估值融资 $255M，用于商业化 NEXUS。NEXUS
    是面向企业结构化数据预测的 Large Tabular Model。NEXUS 不是 transformer，而是一个确定性基础模型，预训练数据超过 100 亿张企业表；它部署在客户自有 VPC 内，借助硬件 Trusted
    Execution Environments 运行，直接消除企业最常见的数据安全顾虑。公司面向金融服务、医疗、制造、零售、能源等行业的 Fortune 100 买家，采用 Palantir 式 Forward Deployed
    Engineer GTM，并借 AWS SageMaker / SAP Business AI 分发。科研团队以 DeepMind 校友为核心，包括 Chief Science Officer Marta Garnelo；Gaël
    Varoquaux（scikit-learn 共同创建者）和 Wojciech Czarnecki 担任 Founding Advisors。
  foundedDate: '2024-10-01'
  founders:
    - name: Jeremy Fraenkel
      role: CEO 兼联合创始人
      background: TechCrunch、公司官网和 AWS 官方新闻稿均确认其为 CEO 兼联合创始人；此前连续创业者背景未公开详述。其他联合创始人尚未公开具名。
      claimRefs:
        - CO010
