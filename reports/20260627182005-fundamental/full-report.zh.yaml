        - label: 乐观高位：$50M ARR @ 30x
          value: 1500
        - label: 基准低位：$10M ARR @ 15x
          value: 150
        - label: 基准高位：$20M ARR @ 15x
          value: 300
        - label: 悲观：$5M ARR @ 5x
