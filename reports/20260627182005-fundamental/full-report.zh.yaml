        - IBM 收购前估值 $10B，ARR 约 $100M
        - 稀缺性峰值时，高端企业 AI/ML 基础设施可以拿到怎样的定价。
        - 2026 年 AI 估值讨论中引用的私募轮背景
        - 私营公司指标和时点不如上市可比公司可验证
      - - DataRobot
        - 2021 年峰值 $6.3B，之后减记至接近 $1.5B
        - 企业 AI 预期跑在实际经济性前面时，估值会多快压缩。
        - 作为私营 AI 警示案例纳入可比框架
        - 估值路径跨越多年和多个资本周期
      - - Snowflake
        - 2025-2026 年公开 EV/NTM 收入约 10x-15x
        - 最适合用申报文件约束企业数据平台估值纪律。
        - 投资者关系和公开申报背景
        - 平台更宽，规模也远高于 Fundamental
      - - Prior Labs / TabPFN
        - 没有公开独角兽估值；免费 OSS 加商业授权模式
        - 给定价和客户评估摩擦划出直接竞争底线。
        - GitHub 仓库、arXiv 技术报告和产品页
        - 竞争威胁比估值可比性更清楚
      - - ElevenLabs
        - 同一周披露 $11B 估值和 $500M 融资
        - 牵引力更强的叙事在 2026 年 AI 融资热潮中能有多热。
        - TechCrunch 和同期 cohort 覆盖中的同阶段 AI 融资背景
        - 类别不同，可见采用曲线也强得多
      - - Alteryx
        - 增长停滞后以低得多的股权结果私有化
        - 提醒投资者，分析类点解决方案可能急剧降级。
        - 公司官网和私有化背景
        - 成熟公司，增长阶段和产品组合不同
    notes: 这是对承销纪律最有用的可比集合的部分列举：混合了公开基准、私募轮参照点和直接竞争替代品，因为没有一个完美的 Fundamental 对标对象。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the main valuation-reference buckets visible in 2026 public reporting: premium private AI comps,
        filing-backed public data-platform comps, and direct tabular-model substitutes.
