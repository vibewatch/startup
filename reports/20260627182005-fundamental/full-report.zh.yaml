  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Fundamental 进入的市场位于三类相邻支出的交叉处：企业结构化数据 AI（面向表格数据集的专用预测模型）、分析 copilot 和 text-to-SQL 层（云数据仓库上的 NL-to-SQL
              接口），以及语义层（跨 BI 工具、agent 和应用共享的受治理指标定义）。最宽边界是所有用 AI
              回答结构化数据问题的企业分析软件；最窄边界是面向表格预测的专用基础模型。两个边界都不干净，因为在位厂商会按自己销售的东西定义市场。Snowflake 的 Cortex Analyst 文档明确称，「generic
              AI solutions often struggle when given only a database schema」，原因是 schema
              缺少业务流程定义、指标逻辑和组织术语——这说明具备语义层感知的方案占据一个更可防守的子赛道。Google 的 BigQuery data canvas 也公开承认它「isn't intended for
              direct use by business users」，暴露了专用 analytics AI 产品要填补的最后一公里分析缺口。现状替代方案主要包括：（1）dbt Semantic Layer（基于
              MetricFlow 的受治理指标，可通过 API 和 MCP Server 访问，Bilt Rewards 用它将分析成本削减 80%），（2）Sigma Computing 面向不信任 AI 查询生成团队的
              warehouse-native spreadsheet SQL，（3）叠加 AI assistant 的传统 BI 工具（Tableau Desktop/Cloud、Looker、Power
              BI），以及（4）用 XGBoost、LightGBM 或 scikit-learn 搭建的自定义 ML pipeline，用于表格预测任务。市场边界直接决定可服务机会：Fundamental 的 LTM 不是
              BI copilot——它是一个预训练表格预测模型，在结构化数据自动企业预测这一特定用例上，同时与在位数据平台 AI 功能和 PriorLabs TabPFN 等开源替代品竞争。
