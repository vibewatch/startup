      - number: '8.3'
        title: 情景与建议
        blocks:
          - type: paragraph
            body: >-
              情景分析必须保持简单，因为公开文件太薄。牛市情景下，Fundamental 把发布优势转化为企业表格 AI 的新标准，AWS 和 SAP 显著加速采购，Fortune 100 部署迅速复合到 $30M–$50M
              ARR，足以支撑当前估值。基准情景下，公司赢得 pilot 和部分付费部署，但扩张速度受 FDE 可用性约束，同时客户会在承诺前把 NEXUS 与低成本替代品比较。按普通企业软件数学，这会让价值远低于
              $1.4B。熊市情景下，开源商品化和平台竞争快于品类锁定。由于当前证据集更符合基准情景而非牛市情景，正确建议不是买入或回避，而是跟踪。置信度只有中等，因为多个决定性指标仍是私有；风险高，因为估值已经假设了很多。
