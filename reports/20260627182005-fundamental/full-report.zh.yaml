      - number: '5.2'
        title: 架构与部署模型
        blocks:
          - type: paragraph
            body: >
              NEXUS 在 Amazon SageMaker HyperPod 上训练，使用配备 8× NVIDIA H200 GPU 的 ml.p5en.48xlarge 实例，完整训练运行消耗了 AWS
              规模的算力。除公司称其「不是 transformer」之外，模型核心架构并未公开，实际神经网络设计仍不透明。推理通过三条生产路径交付：（1）通过 AWS Marketplace 订阅 SageMaker
              JumpStart 模型包，作为单租户异步推理端点部署在客户自己的 AWS VPC 中，数据集留在客户 S3，推理期间没有出站调用；（2）在 SAP Business AI generative AI Hub
              中，NEXUS 可与其他 SAP 生态 AI 产品并列选择；（3）通过 Fundamental 的机密计算架构，支持本地或气隙部署。SageMaker
              部署允许单个端点同时服务多个已训练模型——欺诈检测、客户流失和需求预测可以共用一个端点。Python SDK（pip install fundamental-client）暴露 scikit-learn
              接口，并额外提供 get_feature_importance() 方法。机密计算路径使用硬件强制的 Trusted Execution
              Environments（TEE）：模型和软件栈被编译成带密码学指纹的镜像；运行时，硬件会用该指纹校验启动状态，任何二进制被修改都不会释放密钥。该架构同时保护模型 IP 不被客户获取，也保护客户数据不被
              Fundamental 接触——没有人工主密钥，也不存在基于策略的绕过。
