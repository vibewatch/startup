        title: 附录
        blocks:
          - type: callout
            title: 开源 TabPFN 是 Fundamental 模型护城河最清晰的近期威胁
            body: >-
              PriorLabs 的 TabPFN-3（开源、免费、Yann LeCun 和 Bernhard Schölkopf 背书、发表于 Nature、可扩展到 10M+ 行）与 NEXUS 运行在同一个
              in-context 表格预测范式上。它使用兼容 scikit-learn 的 API（fit/predict）。PriorLabs 还提供商业企业许可。Fundamental 相对 TabPFN
              保留的唯一结构性优势，是机密计算安全架构（硬件 TEE）和 AWS/SAP 分发合作。如果 PriorLabs 增加硬件 TEE 部署选项和 Marketplace 上架，Fundamental
              的定价权会被直接挑战。缺少一项在企业数据集上比较 NEXUS 和 TabPFN 性能的独立基准研究，是实质尽调缺口。
