  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              根据 2026 年 2 月 4 日生效的 Terms of Use，Fundamental Technologies, Inc. 是一家私人 AI 公司，法定注册地址为 2160 Manzanita
              Avenue, Menlo Park, California 94025。公司对外呈现的 GTM 总部在 San Francisco，研究中心在 Barcelona，商业扩张基地在 Japan。截至 2026 年
              6 月下旬，三地均有活跃招聘，验证了这组三中心地理布局。公司使用 fundamental.tech 域名，而非 fundamental.ai（后者是不相关实体），并将 NEXUS 定位为首个面向企业预测的
              Large Tabular Model（LTM）。NEXUS 明确不基于
              transformer；它以确定性方式处理结构化和表格数据，在欺诈检测、预测性维护、需求预测，以及任何由行列结构化数据驱动的企业流程中预测结果。商业模式是企业 B2B：客户可通过 AWS
              Marketplace（SageMaker JumpStart 单租户部署）订阅 NEXUS，也可通过 SAP Business AI 开放模型生态访问。公司面向金融服务、医疗、制造、零售和能源等垂直行业的
              Fortune 100 企业，采用 Palantir 式 Forward Deployed
              Engineer（FDE）GTM，需要与客户深度共创。公开隐私和法律文件确认了法定实体名称和有效上线日期；即使董事会结构和股权表机制仍未公开，公司基本身份已有充分记录。
