  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 路径
    rows:
      - - ARR 与增长桥
        - 当前 ARR、季度增长，以及经常性收入与部署收入的组合
        - 需要判断任何公开市场倍数能否支撑入场价格。
        - CFO 材料和董事会材料
      - - 客户质量
        - 客户 Logo 集中度、ACV 分布、续约，以及按队列的扩张
        - 需要检验七位数合同是可重复，还是例外。
        - 销售运营导出和队列看板
      - - 毛利率画像
        - 订阅毛利率、服务毛利率、云推理成本和综合毛利率
        - 需要判断公司应拿软件倍数，还是贴近服务的倍数。
        - 财务模型和成本核算复核
      - - 融资轮条款
        - 清算优先权、参与权、期权池变化、老股比例和稀释
        - 需要把账面估值翻译成真实证券质量。
        - 条款清单、股权结构表和律师备忘录
      - - 竞争证明
        - 第三方基准，以及相对 TabPFN 和 Snowflake 替代方案的赢单 / 输单数据
        - 需要捍卫定价权和产品差异化。
        - 现场工程包和客户访谈
      - - 退出准备度
        - 治理成熟度、审计状态、预测纪律和上市公司准备计划
        - 需要评估未来 24-36 个月内加价轮或退出路径是否现实。
        - CEO/CFO 尽调会议
    notes: 这些问题定义了把建议从跟踪推进到可投资所需的最低材料包。
