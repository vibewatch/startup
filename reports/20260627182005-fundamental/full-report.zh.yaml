        title: 买家、用户与预算所有者
        blocks:
          - type: paragraph
            body: >-
              企业 analytics AI 天然跨职能，买家地图不是单一预算线。ThoughtSpot
              的资源架构识别出至少六类买家画像：数据负责人、业务负责人、产品负责人、数据分析师、分析工程师和开发者；每类人的待办任务和采购入口都不同。Fundamental 的 GTM 强调数据科学家和 chief
              data/AI officers 是主要画像，公司「data science」产品页将 NEXUS 定位为经典 ML 工作流的即插即用替代品。企业客户管理岗位明确把 Fortune 100
              公司组合列为目标，能源垂直岗位还写明 $1M–$10M+ ACV 合同——这说明购买动作是自上而下、由 IT 预算驱动，而不是产品驱动增长。Tableau Pulse
              面向业务用户画像推出主动指标层（「automatically detects drivers, trends, and outliers」），说明业务用户也是重要端点，即便采购由
              IT/数据团队拥有。这个市场的预算所有权分叉：预测分析和 ML 工具通常落在中央数据平台预算（数据工程、ML 平台或 CTO/CIO 职能）里，商业智能和报表支出则常在业务单元或财务预算中。Fundamental
              的 FDE（Forward Deployed Engineer）GTM——继承自 Palantir，并在其招聘材料中明确描述——对应自上而下的企业销售，每个客户都要消耗高人力资本。ROI 叙事根据
              ThoughtSpot 的 CarTrawler 证据，锚定分析师留存和业务用户赋能。就 Fundamental
              而言，用例瞄准拥有大型结构化数据集的企业垂直行业：金融服务（信贷评分、欺诈）、保险（理赔）、医疗（临床分析）、制造（需求预测）、能源（产量优化）和零售（流失 / 定价）。
