      - number: '1.3'
        title: 融资历史、估值与投资人构成
        blocks:
          - type: paragraph
            body: >-
              Fundamental 的公开融资记录集中在一轮规模很大的 Series A。截至本报告日期，公司累计融资 $255M；其中约 $225M 是 2026 年 2 月 5 日宣布的 Series A，剩余约
              $30M 指向一轮未单独宣布的 pre-seed 或 seed。$1.4B 投后估值来自 TechCrunch 当时报道，并由 AWS 官方新闻稿确认。有一家新闻聚合器存档了 $1.2B
              版本，形成轻微冲突，可能是投前 / 投后混淆，也可能是 TechCrunch 早期稿件；考虑到一手来源权重，应以 $1.4B 为准。Series A 由 Oak HC/FT
              领投，这是一家专注医疗和金融科技的成长期基金，投 Fundamental 意味着其典型 thesis 明显延伸到企业 AI 基础设施。共同领投方包括 Valor Equity Partners、Battery
              Ventures（其 portfolio 页面列出 Fundamental）和 Salesforce Ventures（其 portfolio 页面标题为「Why we're backing
              Fundamental」）。以色列背景的数据与 AI 基础设施 VC Hetz Ventures 也参投。天使投资人包括 Aravind Srinivas（Perplexity AI CEO）、Henrique
              Dubugras（Brex 联合创始人）和 Olivier Pomel（Datadog CEO），这张信号网络有助于导入企业客户。未发现 SEC 文件、EDGAR 记录或 Delaware
              公开注册数据；治理文件、董事会构成和优先权堆栈机制完全未公开。
