      - CV014
      - CV022
      - CV023
      - CV024
      - CV030
      - CV036
  - id: TV005
    title: 论点破裂与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 传导机制
      - 动作
    rows:
      - - 收入证明迟迟不出现
        - 初始部署后 ARR 仍低于 $10M，或仍未披露
        - 当前估值失去主要牛市支撑。
        - 暂停投资，并基于低得多的收入底座重估价值
      - - AWS 渠道集中度转负
        - 独家路径变弱，或不再具备优先性
        - 分发杠杆和战略稀缺性都会压缩。
        - 按独立企业销售重新承销 GTM
      - - 基准可信度仍弱
        - 独立测试仍偏向 TabPFN 类替代品
        - 锁定形成前，定价权先被侵蚀。
        - 继续推进前要求第三方基准包
      - - FDE 占比压过软件占比
        - 毛利率或订阅占比看起来偏服务
        - 倍数应转向服务或实施偏重型软件区间。
        - 下调目标入场价格，并要求给出利润率路径
      - - 客户证明仍窄
        - 少数定制化 Fortune 100 项目没有转化为可重复扩张
        - 标杆胜利不再支撑平台论点。
        - 把故事视为由专业咨询带动的工具
      - - 资本结构条款保护投资人
        - 出现高额优先权、大额老股转让，或利于重估的权利
        - 账面估值高估了普通股质量。
        - 调整有效入场价格，或放弃
    notes: 这些触发项最可能迅速击穿当前虽被拉伸但仍可成立的估值叙事。
