  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议沿着一条简单链条展开：融资事实和差异化定位真实存在，但经济性薄、竞争可信，且估值已经把成功计入价格。
    data:
      nodes:
        - id: n1
          label: 融资事实
          detail: $225M Series A、投后估值 $1.4B 证据充分
        - id: n2
          label: 产品主张
          detail: NEXUS 对外定位为确定性大型表格模型
        - id: n3
          label: 客户验证
          detail: 公开信号只有 Fortune 100 的七位数合同
        - id: n4
          label: GTM 摩擦
          detail: FDE 重交付可能拖慢软件式扩张
        - id: n5
          label: 竞争压力
          detail: TabPFN 和 Snowflake 替代方案限制定价确定性
        - id: n6
          label: 结论
          detail: 跟踪；高风险；估值先于验证而拉伸
      edges:
        - from: n1
          to: n2
          label: 支撑关注
        - from: n2
          to: n3
          label: 仍需
        - from: n3
          to: n4
          label: 受制于
        - from: n4
          to: n5
          label: 遇到压力会恶化
        - from: n5
          to: n6
          label: 推动
    claimRefs:
      - CV001
      - CV007
      - CV011
      - CV021
      - CV022
      - CV029
      - CV041
