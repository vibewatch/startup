      - number: '2.5'
        title: 附录
        blocks:
          - type: callout
            title: 真正的差异化是语义上下文，不是模型架构
            body: >-
              Snowflake 自家 Cortex Analyst 文档称，「generic AI solutions often struggle when given only a database
              schema」——这意味着胜出的 analytics AI
              产品必须提供具备语义层感知的上下文，而不只是更好的模型。将基础模型与企业特定训练或语义元数据结合的厂商因此有结构性优势：差异化不主要来自原始模型性能，而来自模型与企业自身数据结构、术语和业务逻辑之间的桥。
            calloutType: insight
            claimRefs:
              - CM002
              - CM027
          - type: callout
            title: 从试点到生产的落差是全品类主要收入瓶颈
            body: >-
              Databricks 自有 2026 Financial Services 研究记录，企业 AI 被「more pilots than production deployments」主导。这并非
              Fundamental 独有，而是全品类约束。企业买家已经批准 AI 预算，也在跑 POC，但生产部署需要治理文档、安全认证、与既有数据栈集成，以及 SLA 承诺；多数早期 analytics AI
              厂商还给不出这些。对 Fundamental 而言，瓶颈在于把当前 Fortune 100 POC pipeline 转成多年期生产合同。
