  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Fundamental 的收入机制是企业 B2B 订阅。主要变现向量包括 AWS Marketplace 订阅（客户将 NEXUS 作为 SageMaker model package 订阅，支付
              ml.p5en.48xlarge 实例的 AWS 基础设施成本，另付 Fundamental SDK 许可）和 SAP Business AI 开放模型生态。公司未发布官方标价；截至 2026 年 6
              月，公司没有披露公开 price card、试用条款或用量分层结构。AWS Marketplace 订阅模型实际把 GPU 基础设施成本（ml.p5en.48xlarge，每个 endpoint 八块
              NVIDIA H200 GPU）转嫁给客户，说明 Fundamental 在客户计算支出之上赚取许可利润。SAP 渠道通过 SAP 的 genAI Hub 接触 SAP 企业装机基础，但 SAP 的开放模型生态让
              NEXUS 与 SAP 加入的任何其他模型直接竞争——包括免费或更便宜的替代品——从而削弱该渠道内的定价权。收入确认很可能遵循 SaaS 订阅模式，但合同条款、ACV
