              2026、Money20/20、TechCrunch Disrupt 和 WEF Davos 2027 发言，说明企业营销日历至少延续到 2027 年初。招聘页面显示，截至 2026 年 6 月 26 日，San
              Francisco、Barcelona 和 Japan 共有 9 个工程岗位与 4
              个研究岗位在招，表明产品、基础设施和扩张工作并行推进。公司没有发布正式产品路线图。需要尽调的关键技术缺口包括：（1）核心架构不透明——没有模型卡、没有权重、没有架构论文；（2）基准方法透明度不足——没有可复现实验集或第三方复现；（3）缺少合规认证——HIPAA/GDPR
              合规通过架构声称，但未经验证；（4）规模主张验证不足——「数十亿行」主张除 AWS 新闻稿和 Fundamental 自有营销外未被验证；（5）模型卡 /
              公平性文档——这对医疗和金融服务中的受监管部署至关重要。世界杯 demo 是 LTM 推理质量的有力公开证明，但在真实企业数据质量条件下的生产准确率和延迟，仍未被第三方验证。
            claimRefs:
              - CE040
      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: AWS 与 SAP 分发显著降低获客成本
            body: >
              NEXUS 与 AWS SageMaker JumpStart（2026 年 6 月 GA）和 SAP Business AI（2026 年 5 月）集成，使其进入全球最大的两个企业软件采购渠道。AWS
              客户可以通过 Marketplace 订阅，并一键部署到自己的账户。SAP 客户可以从 generative AI Hub 选择 NEXUS，无需重做工作流。两个渠道都拥有深厚的企业 IT 关系，否则
              Fundamental 需要 12–18 个月的独立销售周期才能建立这些关系。AWS 合作尤其有力：AWS 解决方案架构师发布的 AWS ML 博客公告，传递的是共同销售关系，而不只是一个上架列表。
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
              - CE033
          - type: callout
            title: 没有公开基准、没有同行评议论文——竞争可信度风险
            body: >
              Fundamental 的白皮书自称「research manifesto」——不是同行评议出版物。nexus 产品页展示基准对比，但没有公布原始数字、测试集或方法。竞争对手 TabPFN 发表在
              Nature，且可完整复现。企业采购中，技术买家会跑自己的 POC 基准，但缺少公开验证会拉长销售周期，削弱数据科学买家的信任，并相对学术级竞争对手形成实质可信度缺口。
