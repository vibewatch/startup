  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitoring indicator
      - Thesis-break threshold
      - Current mitigation
      - Investment implication
    rows:
      - - Benchmark opacity
        - Independent benchmark replication, public leaderboard participation, and named customer validation cases
        - No third-party benchmark pack or customer scorecard by the next major financing event
        - Company whitepaper and product materials provide an initial claims baseline
        - Treat as a core diligence blocker until external proof arrives
      - - EU and UK regulated-use exposure
        - Release of compliance pack for high-risk AI, override tooling, logs, and governance procedures
        - Customer evidence of regulated deployments without documented human oversight or auditability
        - The relevant regulations are already knowable and can be designed against early
        - Haircut European upside and require legal readiness before underwriting expansion
      - - AWS concentration
        - Marketplace visibility, co-sell support, pricing terms, and multi-cloud or private deployment options
        - AWS term change, channel pullback, or inability to show a credible contingency path
        - Strategic partner validation exists through the SageMaker launch
        - Discount channel durability and attach a partner-concentration penalty
      - - FDE economics
        - Deployment headcount growth versus recurring software metrics and gross-margin progression
        - Headcount and services spend rise materially faster than contracted recurring revenue
        - Management clearly understands that delivery quality matters
        - Reframe the company as a services-heavy integrator rather than software-scale model vendor
      - - Financial visibility
        - ARR, NRR, churn, gross margin, and concentration schedules in the next diligence pack
        - Next financing or major customer push occurs without a KPI package that proves repeatability
        - Blue-chip investors and customer logos provide some signaling value
        - Limit conviction until the operating model is shown rather than narrated
    notes: >-
      Kill criteria are framed for investment diligence rather than product
      management. Each row translates a public risk narrative into a monitorable
      condition that should either unlock confidence or break the thesis.
