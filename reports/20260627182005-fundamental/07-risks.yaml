  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent benchmark validation
      missingEvidence: An independent leaderboard entry, third-party replication package, or customer benchmark scorecard for NEXUS was not available in the supplied evidence set.
      whyItMatters: Without external validation, investors cannot tell whether benchmark leadership is durable or mostly an artifact of company-chosen tests.
      diligencePath: Request raw benchmark methodology, third-party replication results, and at least two customer evaluation packs that include failure cases and rollback criteria.
      relatedQuestionRefs:
        - QR006
      relatedTableRefs:
        - TR002
    - type: enumeration-incomplete
      severity: material
      topic: public regulatory perimeter
      missingEvidence: A customer-by-use-case jurisdiction matrix, legal docket, and audited-financial-status confirmation were not publicly available.
      whyItMatters: The legal register can only cover visible regulatory pathways, so undisclosed deployments or disputes could change the real exposure materially.
      diligencePath: Request an internal deployment map by jurisdiction and use case, outside-counsel summaries, legal claims register, and confirmation of audit status from finance leadership.
      relatedQuestionRefs:
        - QR013
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: high
      topic: financial visibility
      missingEvidence: ARR, NRR, churn, gross margin, CAC efficiency, and customer concentration schedules were not disclosed publicly.
      whyItMatters: A $1.4 billion valuation is difficult to underwrite when investors cannot distinguish repeatable software revenue from a handful of bespoke high-touch contracts.
      diligencePath: Request a board-style KPI pack with customer cohorts, renewal history, gross-margin waterfalls, deployment staffing by account, and audited management reporting.
      relatedQuestionRefs:
        - QR029
      relatedTableRefs:
        - TR004
        - TR005
    - type: private-evidence-only
      severity: high
      topic: model performance and reliability
      missingEvidence: Independent benchmark replication, customer-by-customer acceptance metrics, uptime history, and incident logs were not disclosed publicly.
      whyItMatters: Model quality and reliability are the main product risks, so missing operating evidence blocks conviction on moat, retention, and safety in sensitive workflows.
      diligencePath: Request pilot scorecards, red-team results, incident reviews, model-governance artifacts, and references from customers that ran side-by-side bakeoffs.
      relatedQuestionRefs:
        - QR030
      relatedTableRefs:
        - TR002
        - TR005
