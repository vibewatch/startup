  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Fundamental-competitor-benchmark
    missingEvidence: >-
      Independent third-party benchmark comparison of NEXUS against TabPFN-3, XGBoost, and
      LightGBM on enterprise use cases (credit scoring, demand forecasting, fraud detection)
      using held-out datasets not controlled by either vendor.
    whyItMatters: >-
      Without an independent benchmark, all NEXUS performance claims are self-reported and
      unverifiable. The "win rate" graphic on the NEXUS product page shows 0% win rate for
      Classic ML Algorithms with no disclosed methodology — this cannot be used as evidence
      of performance superiority.
    diligencePath: >-
      Commission an independent ML benchmarking study (e.g., via a university research group
      or ML Ops consultancy) comparing NEXUS, TabPFN-3, and XGBoost on at least 3 enterprise
      use cases with Fundamental's participation. Require reproducible evaluation protocol.
    relatedQuestionRefs: [QP008]

  - type: missing-source
    severity: material
    topic: SAP-distribution-terms
    missingEvidence: >-
      Contract terms for Fundamental's SAP Business AI open model ecosystem integration,
      including revenue share, exclusivity (if any), competitive-model exclusion clauses, and
      Fundamental's tier in the SAP partner hierarchy.
    whyItMatters: >-
      If the SAP channel is non-exclusive and subject to competitive displacement, the
      distribution moat is weaker than presented. Confirmation of revenue-sharing terms
