  rows:
  - - Databricks (Genie Agents)
    - Incumbent data platform — analytics AI bundle
    - 'Private; Series J at ~$62B valuation; 20,000+ enterprise customers; 70% Fortune 500'
    - Data platform teams, data scientists, business analysts
    - Full analytics AI stack (NL-to-SQL, coding, BI dashboards) governed by Unity Catalog; no separate license
    - NL-to-SQL copilot, not tabular prediction foundation model; architecture is LLM-based; no deterministic structured inference
  - - Snowflake (Cortex Analyst + Cortex AI)
    - Incumbent data platform — warehouse-native AI
    - 'Public (NYSE: SNOW); largest cloud data warehouse; 10,000+ enterprise customers'
    - Cloud-data-warehouse customers in FSI, retail, healthcare
    - Semantic Views (native YAML schema objects); multi-turn NL-to-SQL; 13 AI SQL functions; multi-model (OpenAI, Anthropic, Meta, Mistral, DeepSeek)
    - Query/BI layer, not prediction; data must live in Snowflake; LLM-based; high cost for heavy users
  - - Google BigQuery + Looker (Gemini AI)
    - Incumbent cloud platform — AI analytics features
    - 'Part of Alphabet ($2T+ market cap); Looker priced at token consumption'
    - GCP enterprise customers; BI consumers; data engineers
    - Gemini in BigQuery for SQL generation; Looker Conversational Analytics ($3/M tokens); near-zero switching cost for GCP customers
    - Not a prediction model; only for GCP customers; quota-limited for heavy use; LLM-based text-to-SQL only
  - - Salesforce / Tableau (Tableau AI, Pulse, Next)
    - Incumbent BI vendor — agentic analytics
    - 'Part of Salesforce ($250B+ market cap); Tableau used by ~100K organizations'
    - Business analysts, executives, BI consumers
    - Tableau Pulse (proactive metrics layer); Tableau Next (API-first agentic analytics); Salesforce CRM data integration
    - BI visualization layer, not enterprise prediction; no structured tabular foundation model; requires Salesforce/Tableau ecosystem
  - - ThoughtSpot (Spotter)
    - Purpose-built analytics AI — agentic BI
    - 'Private; Series F; ~$4.2B valuation (2021 peak); Salesforce Ventures investor'
    - Data-driven enterprises; business leaders; analysts seeking self-service NL analytics
    - 'Spotter: agentic analytics + governed data architecture + automated workflows; SpotterViz: auto-generated Liveboards'
    - Query and insight generation layer, not tabular prediction; limited to BI use cases; pricing JS-rendered (unconfirmed)
  - - Palantir (AIP + Ontology)
    - Enterprise AI decisioning platform
    - 'Public (NYSE: PLTR); $30B+ market cap; 54% government / 46% commercial revenue'
    - Fortune 100 in regulated industries (defense, FSI, healthcare, energy)
    - Ontology (decision-centric semantic model); AIP Bootcamp (zero to production in days); government-grade security
    - Very high implementation cost and complexity; FDE concierge model limits scalability; government-security pricing premium
  - - PriorLabs TabPFN
    - Open-source tabular foundation model
    - Non-commercial free (v3); Apache 2.0 (v2); commercial license from sales@priorlabs.ai; Yann LeCun and Bernhard Schölkopf affiliated
    - Data scientists and researchers; enterprises via commercial license
    - Free, open-source, Nature-published, scales to 10M+ rows; scikit-learn API; continuously improved (v2 → v2.5 → v3)
    - No enterprise security architecture (no TEE, no hardware attestation); no SAP/AWS Marketplace distribution; requires self-hosting for enterprise privacy
  - - Internal build (XGBoost/LightGBM + dbt + BI)
    - Status-quo substitute
    - Zero incremental cost; existing data science team investment
    - Enterprises with data science teams; Fortune 500 with ML platforms
    - No vendor dependency; full interpretability; integrates with MLflow/MLOps stack; data scientists already know scikit-learn
    - Requires significant feature engineering; slower iteration; no pre-trained scale; each model trained from scratch per use case
  notes: >-
    Scale/funding figures sourced from Sacra Research, Yahoo Finance, and TechCrunch reporting as
    of H1 2026. Private company valuations (Databricks ~$62B from Sacra; ThoughtSpot ~$4.2B from
    2021 funding round) are secondary sources, not confirmed current figures. Palantir commercial
    vs government revenue split from Yahoo Finance as of June 2026.
