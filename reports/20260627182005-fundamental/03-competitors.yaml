- id: competitor-profiles-and-capabilities
  title: Competitor Profiles, Capabilities, and Pricing
  body: >-
    Databricks is the most comprehensive analytics AI competitive threat. Its Genie product
    suite — Genie Agents (NL-to-SQL with multi-turn conversation), Genie One (business-user
    consumption layer with mobile app), and Genie Code (AI coding assistant) — provides a
    full analytics AI stack governed by Unity Catalog, with no separate BI seat license required.
    Databricks moved Genie to pay-as-you-go pricing in July 2026 (150 DBU free/user/month ≈
    $10.50), admins can set per-user spend budgets, and the OpenAI GPT-5 integration (minimum
    $100M partnership) gives it best-in-class model access. Its acquisition of Neon ($1B, May
    2025), Tecton, Mooncake Labs, and Quotient AI has extended the platform into real-time
    transactional AI — directly reducing the whitespace for standalone tabular prediction
    vendors. Snowflake Cortex Analyst differentiates on Semantic Views: native YAML-based
    schema objects that define business entities, dimensions, facts, and metrics — enabling
    multi-turn text-to-SQL with RBAC, sharing, and governance baked in. Cortex AI SQL provides
    13 AI functions (AI_COMPLETE, AI_CLASSIFY, AI_AGG, AI_SENTIMENT, and more) powered by
    OpenAI, Anthropic, Meta, Mistral, and DeepSeek models. Snowflake's AT&T case study
    documents 84% annual cost savings and sub-second query response. Looker (Google) competes
    at the conversational analytics layer: Standard tier provides 60M input/1.2M output tokens/month
    free, Enterprise tier 300M/6M, with overage at $3.00/M input, $20.00/M output (effective
    October 2026). Tableau Next (Salesforce) positions as API-first agentic analytics: composable
    architecture, trusted semantics, personalized insights. ThoughtSpot's Spotter combines
    "agentic analytics, governed data architecture, and automated workflows" — the most direct
    peer to Fundamental's analytics-AI positioning, though Spotter focuses on query/insight
    generation rather than tabular prediction. Palantir AIP with its Ontology ("decision-centric
    system integrating AI with enterprise data, logic, and action") targets the same Fortune 100
    regulated buyers through AIP Bootcamps (from zero to use case in days) — a high-touch GTM
    model that directly competes for the same budget as Fundamental's FDE-driven sales.
