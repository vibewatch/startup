    diligencePath: >-
      Request SAP partnership agreement or term sheet from Fundamental management; verify
      Fundamental's tier in SAP's partner ecosystem (Gold/Platinum/Open-Model) and confirm
      any contractual rights that would prevent SAP from adding competing models.
    relatedQuestionRefs: [QP021]

  - type: missing-source
    severity: material
    topic: tabpfn-enterprise-commercial-pricing
    missingEvidence: >-
      PriorLabs commercial enterprise pricing for TabPFN — the sales@priorlabs.ai commercial
      license terms were not publicly accessible. The gap means the pricing pressure from the
      open-source alternative cannot be precisely quantified.
    whyItMatters: >-
      If PriorLabs commercial enterprise TabPFN licenses at $50K–$200K/year, it would directly
      undercut Fundamental's $1M+ ACV model for the same technical capability, materially
      affecting NEXUS's pricing power in the data-science buyer segment.
    diligencePath: >-
      Contact PriorLabs (sales@priorlabs.ai) to request commercial pricing; compare against
      Fundamental's known ACV range for equivalent use-case deployment.
    relatedQuestionRefs: [QP025]

