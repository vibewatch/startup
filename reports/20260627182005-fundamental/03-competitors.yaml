    - High
    - TabPFN technical report (Dec 2025 Nature); TabPFN-3 arXiv (Jun 2026); PriorLabs.ai
    - Request independent third-party benchmark of NEXUS vs TabPFN on enterprise use cases; publish model card
  - - Pre-training on billions of enterprise tables confers accuracy advantage
