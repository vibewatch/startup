callouts:
- calloutType: risk
  title: Open-Source TabPFN Is the Clearest Near-Term Threat to Fundamental's Model Moat
  body: >-
    PriorLabs' TabPFN-3 (open-source, free, backed by Yann LeCun and Bernhard Schölkopf,
    Nature-published, scaling to 10M+ rows) operates on the same in-context tabular prediction
    paradigm as NEXUS. It uses a scikit-learn-compatible API (fit/predict). PriorLabs also
    offers commercial enterprise licensing. The only structural advantage Fundamental maintains
    over TabPFN is its confidential-computing security architecture (hardware TEE) and its
    AWS/SAP distribution partnerships. If PriorLabs adds a hardware-TEE deployment option and
    Marketplace listing, Fundamental's pricing power is directly challenged. The absence of an
    independent benchmark study comparing NEXUS and TabPFN performance on enterprise datasets
    is a material diligence gap.
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
  - CP035

- calloutType: risk
  title: Data-Prep Bottleneck Limits All Tabular Foundation Model Claims
  body: >-
    A materially adverse technical concern — raised in the HN ML community in March 2026 and
    corroborated by Gaël Varoquaux (Fundamental's own advisory board member) — is that 80–90%
    of enterprise tabular ML effort is multi-table data preparation, not model selection. If
    the real bottleneck is "the data graph, not the model," then a best-in-class tabular
    foundation model like NEXUS captures only 10–20% of the enterprise ML value stack. This is
    the most structurally adverse claim in the competitive analysis and should be directly
    addressed in any diligence request.
  claimRefs:
  - CP027
  - CP028
  - CP029
  - CP030

- calloutType: strength
  title: Confidential Computing Architecture Is a Defensible and Unique Enterprise Moat
  body: >-
    No open-source tabular model (TabPFN, TabICL, TabDPT) offers hardware TEE-based deployment
    with cryptographic attestation and mathematical proof that neither the vendor nor the customer
    can access the other's IP during inference. Fundamental's confidential computing architecture
    — described in detail in a technical blog post by Founding Engineer Yuval Azoulay — is
    architecturally verifiable (not policy-based) and directly addresses the data-sovereignty
    concerns that block AI adoption in regulated industries (FSI, healthcare, energy). This is
    the most differentiated element of Fundamental's competitive position, assuming third-party
    certification confirms the implementation.
  claimRefs:
  - CP031
  - CP032
  - CP033

