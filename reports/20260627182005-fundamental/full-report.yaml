  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission
      - Action
    rows:
      - - Revenue proof fails to appear
        - ARR still below $10M or still undisclosed after initial deployments
        - Current valuation loses its main bull-case support.
        - Pause investment and reset value on a much lower revenue base
      - - AWS channel concentration turns negative
        - Exclusive path weakens or becomes non-preferential
        - Distribution leverage and strategic scarcity both compress.
        - Re-underwrite GTM as stand-alone enterprise selling
      - - Benchmark credibility stays weak
        - Independent tests still favor TabPFN-class alternatives
        - Pricing power erodes before lock-in forms.
        - Demand third-party benchmark package before proceeding
      - - FDE mix overwhelms software mix
        - Gross margin or subscription share looks services-heavy
        - Multiple should move toward services or implementation-heavy software bands.
        - Cut target entry price and require margin path
      - - Customer proof stays narrow
        - A few bespoke Fortune 100 projects do not convert into repeatable expansion
        - Reference wins stop supporting a platform thesis.
        - Treat story as specialty consulting-enabled tooling
      - - Capital-stack terms are investor-protective
        - Heavy preferences, large secondary, or reset-friendly rights emerge
        - Headline valuation overstates common-equity quality.
        - Adjust effective entry price or decline
    notes: >-
      These are the specific triggers that can most quickly collapse the current stretched-but-plausible valuation
      narrative.
    claimRefs:
      - CV020
      - CV028
      - CV029
      - CV037
      - CV038
      - CV042
      - CV043
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / path
    rows:
      - - ARR and growth bridge
        - Current ARR, quarterly growth, and mix of recurring versus deployment revenue
        - Needed to know whether any public multiple can support the entry price.
        - CFO deck and board materials
      - - Customer quality
        - Logo concentration, ACV distribution, renewals, and expansion by cohort
        - Needed to test whether seven-figure contracts are repeatable or exceptional.
        - Sales ops exports and cohort dashboard
      - - Gross margin profile
        - Subscription margin, services margin, cloud inference cost, and blended gross margin
        - Needed to know whether the company deserves software or services-adjacent multiples.
        - Finance model and cost-accounting review
      - - Round terms
        - Liquidation preferences, participation, option-pool changes, secondary mix, and dilution
        - Needed to translate headline valuation into actual security quality.
        - Term sheet, cap table, and counsel memo
      - - Competitive proof
        - Third-party benchmarks and win-loss data versus TabPFN and Snowflake alternatives
        - Needed to defend pricing power and product differentiation.
        - Field engineering package and customer references
      - - Exit readiness
        - Governance maturity, audit status, forecast discipline, and public-company readiness plan
        - Needed to assess whether a markup or exit path is realistic in the next 24-36 months.
        - CEO/CFO diligence session
    notes: These asks define the minimum package required to move the recommendation from track to investable.
    claimRefs:
      - CV011
      - CV021
      - CV022
      - CV037
