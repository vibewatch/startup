      - number: '8.3'
        title: Scenarios and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Scenario work is necessarily simple because the public file is so thin. In the bull case, Fundamental
              turns its launch advantage into a new enterprise standard for tabular AI, AWS and SAP materially
              accelerate procurement, and Fortune 100 deployments compound into $30 million to $50 million of ARR
              quickly enough to support the current valuation. In the base case, the company wins pilots and some paid
              deployments but scales at the pace of FDE availability, while customers compare NEXUS against lower-cost
              alternatives before committing. That leaves value far below $1.4 billion on ordinary enterprise-software
              math. In the bear case, open-source commoditization and platform competition arrive faster than category
              lock-in. Because the current evidence set fits the base case more than the bull case, the right
              recommendation is not buy or avoid; it is track. Confidence is only medium because several decisive
              metrics remain private, and risk is high because valuation already assumes a lot.
            claimRefs:
              - CV016
