  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Fundamental operates at the intersection of four overlapping competitive categories, and buyers can
              substitute across these categories without fully committing to any single vendor. The first and most
              capital-intensive competitor class is the incumbent data-platform vendor that bundles analytics AI as a
              feature of an existing subscription: Databricks (Genie Agents, Unity Catalog governance), Snowflake
              (Cortex Analyst, Cortex AI SQL), Google (Gemini in BigQuery, Looker Conversational Analytics), and
              Salesforce (Tableau AI, Tableau Pulse, Tableau Next). Each of these vendors has the distribution advantage
              of an existing enterprise contract and can add analytics AI with near-zero incremental switching cost for
              the buyer. Databricks alone reaches 20,000+ organizations including 70% of the Fortune 500; any of those
              customers could adopt Genie without signing a new vendor contract. The second competitor class is
              purpose-built analytics copilots: ThoughtSpot's Spotter (agentic analytics, governed data architecture,
              automated workflows) is the most architecturally similar product, but it operates at the NL-to-SQL query
              layer rather than the tabular prediction layer. The third class is enterprise AI decisioning platforms:
              Palantir AIP operates at a higher integration cost (AIP Bootcamp, Ontology construction) and higher
              pricing tier, but serves the same Fortune 100 buyers with production AI use cases in regulated industries.
              The fourth class — and the most structurally threatening — is open-source tabular foundation models:
              PriorLabs' TabPFN (backed by Yann LeCun and Bernhard Schölkopf, free, Nature-published, scaling to 10M+
              rows) and adjacent academic models (TabICL, TabDPT, RocketPFN) challenge Fundamental's proprietary-model
              moat directly. The status-quo substitutes include: (1) dbt Semantic Layer with a BI tool (internal build
              that avoids any model license), and (2) XGBoost/LightGBM scikit-learn pipelines, which remain the default
              for most enterprise data science teams.
