  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Target Verticals
        blocks:
          - type: paragraph
            body: >
              Fundamental targets mid-to-large enterprises whose core business decisions depend on structured tabular
              data — particularly in verticals where predictive accuracy translates directly to financial outcomes. The
              primary buyer personas are Chief Data Officers, Chief AI Officers, and VP-level data engineering leaders
              who can authorize seven-figure enterprise software contracts. Data scientists and ML engineers are the
              primary user personas who evaluate and deploy the product. The secondary buyer is enterprise IT and
              security, who must approve the VPC deployment and data residency architecture. Per the AWS press release
              and product pages, key verticals include financial services (fraud detection, credit scoring), insurance
              (risk modelling), healthcare (clinical decision support), manufacturing (predictive maintenance), retail
              and supply chain (demand forecasting, pricing), energy (production optimisation, asset maintenance), and
              gaming and e-commerce. The Global Head of Energy job posting (Houston, June 2026) targets oil and gas
              supermajors, NOCs, and large independents with stated deal sizes of $1M–$10M+ ACV, confirming that energy
              is an active enterprise vertical with named target accounts. Japan expansion is confirmed by two open FDE
              roles posted on-site in Tokyo (June 2026). The SAP Business AI integration broadens the target to any SAP
              ERP or CRM enterprise customer globally without requiring a direct Fundamental sales engagement.
              Conference presence confirms additional verticals in focus: financial services (Money20/20, Mastercard
              panel), enterprise software (Dreamforce 2026), and global enterprise (WEF Davos January 2027). No customer
              segmentation by revenue band, geography share, or ARR contribution is publicly disclosed, making revenue
              concentration assessment impossible without primary access.
