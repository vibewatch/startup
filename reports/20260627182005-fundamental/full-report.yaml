companyProfile:
  summary: >-
    Fundamental Technologies, Inc. (fundamental.tech) emerged from stealth on February 5, 2026, raising $255 million at
    a $1.4 billion post-money valuation to commercialise NEXUS, its Large Tabular Model for enterprise structured-data
    prediction. NEXUS is a non-transformer, deterministic foundation model pre-trained on more than 10 billion
    enterprise tables that runs inside a customer's own VPC using hardware Trusted Execution Environments, eliminating
    the most common enterprise data-security objection. The company targets Fortune 100 buyers across financial
    services, healthcare, manufacturing, retail, and energy via a Palantir-style Forward Deployed Engineer go-to-market
    and AWS SageMaker / SAP Business AI distribution channels. The scientific team is anchored by DeepMind alumni,
    including Chief Science Officer Marta Garnelo, with Gaël Varoquaux (scikit-learn co-creator) and Wojciech Czarnecki
    as Founding Advisors.
