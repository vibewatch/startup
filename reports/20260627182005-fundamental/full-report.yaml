  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >
              NEXUS is Fundamental's sole commercially available product as of June 2026. It is classified as a Large
              Tabular Model (LTM) — a foundation model pre-trained on more than 10 billion real-world enterprise tabular
              datasets to perform supervised prediction tasks (classification and regression) directly on structured
              data without requiring customers to engineer features or retrain from scratch. The product is explicitly
              positioned as the "left brain of AI" that handles deterministic, structured prediction workloads that LLMs
              handle poorly due to tokenization artifacts, precision loss, and context-window limits. NEXUS exposes two
              primary classes: NEXUSClassifier (for binary and multi-class classification) and NEXUSRegressor (for
              continuous value prediction), both following the scikit-learn fit/predict/predict_proba API. A time series
              module auto-selects among five architectures depending on dataset characteristics. Use cases include fraud
              detection, predictive maintenance, demand forecasting, price prediction, customer churn, and credit
              scoring. A live public demo at soccer.fundamental.tech shows NEXUS predicting 2026 World Cup outcomes with
              81% recall on decisive group-stage games, providing independent verifiable evidence of the model's
              inference quality on tabular data. The product is marketed under the trademark "Power to Predict." A
              research whitepaper by CSO Marta Garnelo and founding advisor Wojciech Czarnecki (both ex-DeepMind)
              establishes the theoretical foundations, framing NEXUS as a universal predictor via in-context learning
              that avoids transformer limitations.
