      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Fundamental is not obviously regulated today as a standalone software seller, but many of the use cases
              that make NEXUS commercially interesting sit inside heavily regulated decision flows. The EU AI Act makes
              creditworthiness evaluation and certain insurance risk uses high-risk AI, which brings requirements around
              risk management, logging, technical documentation, dataset governance, accuracy, and human oversight. GDPR
              Article 22 adds a separate constraint by limiting solely automated decisions that have legal or similarly
              significant effects on individuals. In practice, a customer using NEXUS for underwriting, fraud controls,
              or credit scoring in Europe could force Fundamental to support explainability, auditability, and override
              workflows much earlier than a general analytics vendor would prefer.


              UK exposure is similar rather than identical. The ICO's AI guidance keeps fairness, transparency,
              contestability, and bias mitigation squarely inside UK GDPR compliance. Fundamental's public privacy and
              terms pages are useful but lightweight; they do not disclose customer-specific deployment controls,
              regulated-use carve-outs, or enterprise liability posture. No public litigation or enforcement action was
              identified in the supplied sources, but that is only weak comfort because the company has been public for
              just a few months and has not yet accumulated a long operating record.
            claimRefs:
