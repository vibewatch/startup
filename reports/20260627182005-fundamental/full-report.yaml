      - number: '6.4'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Fundamental's land-and-expand model relies on the observation that a single NEXUS SageMaker endpoint can
              host multiple trained models simultaneously, enabling an enterprise that starts with fraud detection to
              add demand forecasting and customer churn without additional infrastructure. The FDE model is explicitly
              designed to expand within accounts by identifying adjacent prediction use cases at each customer site.
              This is a structurally sound expansion path in enterprises with many tabular prediction workflows, but it
              depends on the customer having multiple high-value prediction problems addressable by tabular data — which
              is nearly universal in Fortune 100 financial services but more variable in other verticals. The AWS and
              SAP distribution channels each provide access to thousands of enterprise customers, creating substantial
              top-of-funnel without requiring direct Fundamental sales for initial discovery. Concentration risk is the
              most critical unanswered question in this chapter. If seven-figure contracts represent three to five large
              customers, the early ARR base is highly concentrated. A single Fortune 100 non-renewal or delayed POC
              could represent material ARR risk at this stage. No customer count, ARR breakdown, or top-customer revenue
              share is publicly disclosed. The $1M–$10M+ ACV signal from the Global Head of Energy job posting implies
              very few contracts are needed to reach significant ARR, which amplifies concentration risk. The Salesforce
              Ventures Series A participation creates a potential future CRM integration opportunity, but there is no
              published product roadmap or Salesforce ecosystem deployment as of June 2026.
            claimRefs:
