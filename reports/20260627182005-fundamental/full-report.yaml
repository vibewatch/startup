      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case for enterprise analytics AI has four structural drivers operating simultaneously. First,
              AI adoption has crossed from experimental to mainstream: 94% of financial services firms are now piloting
              or deploying gen AI, with cost-reduction targets of up to 20% of operating costs. Second, pricing model
              disruption — consumption-based billing at Databricks and Looker — removes the upfront seat-license barrier
              that historically blocked broad analytics tool deployment. Third, governance and compliance pressure is
              accelerating: EU AI Act high-risk rules for credit-scoring systems take effect in December 2027, creating
              compliance urgency for enterprises deploying automated prediction. Fourth, the agentic architecture shift
              — Databricks renaming Genie Spaces to Genie Agents in July 2026, ThoughtSpot positioning Spotter as an
              "agentic analytics" platform — is pulling analytics AI toward automated workflow execution, expanding the
              use-case surface for foundation models. On the constraint side, three friction points are material.
              Databricks' own product documentation admits that traditional BI tools with AI assistants "frequently
              struggle with real-world data complexities, providing impressive demos but failing in practice" — meaning
              the gap between demo-environment performance and production accuracy is a real adoption barrier. Incumbent
              platform lock-in is the second constraint: Databricks' Unity Catalog governs data, models, and AI apps
              across clouds, creating a governance flywheel that penalizes customers who adopt external AI tools. The
              third is capital intensity: Databricks' acquisition of Neon ($1B, May 2025), Tecton, Mooncake Labs, and
              Quotient AI reflects a platform consolidation that reduces whitespace for standalone analytics AI
              products. Fundamental's strategic response — confidential computing, single-tenant VPC deployment,
              hardware-attested security — addresses governance friction directly but does not remove the incumbent
              distribution moat.
            claimRefs:
              - CM003
