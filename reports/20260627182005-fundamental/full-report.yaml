  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis starts with legitimate signals of category ambition. Fundamental emerged from
              stealth with one of the largest Series A rounds in 2026, a technically distinctive narrative around
              deterministic tabular modeling, and a team whose resumes are strong enough to win meetings inside large
              enterprises. The round composition also matters: top-tier software and data investors plus AWS-adjacent
              launch support create a plausible path to rapid enterprise access. Context from TechCrunch data on 2025 AI
              funding cohorts and the 36-plus unicorns minted that year shows this is not an isolated event but part of
              a sustained wave of large AI financings that made the $1.4 billion mark more plausible. The anti-thesis is
              that almost every economic proof point remains hidden. Public revenue evidence stops at company language
              about seven-figure Fortune 100 contracts, while the delivery model leans on forward deployed engineers
              rather than visibly product-led software expansion. Independent critics are also not subtle: Mindful
              Modeler does not recommend NEXUS, and TabPFN offers a free or lower-friction substitute that buyers can
              test first. The result is a category-creation story with real talent and distribution upside, but one
              priced ahead of public proof.
            claimRefs:
              - CV001
              - CV003
