      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Semantic Context Is the Real Differentiator, Not Model Architecture
            body: >-
              Snowflake's own Cortex Analyst documentation states that "generic AI solutions often struggle when given
              only a database schema" — implying that the winning analytics AI product must provide semantic-layer-aware
              context, not just a better model. This is a structural advantage for vendors that combine a foundation
              model with enterprise-specific training or semantic metadata: the differentiation is less about raw model
              performance than about the bridge between the model and the enterprise's specific data structure,
              terminology, and business logic.
            calloutType: insight
            claimRefs:
              - CM002
              - CM027
          - type: callout
            title: Pilot-to-Production Gap Is the Primary Revenue Bottleneck for the Entire Category
            body: >-
              Databricks' own 2026 Financial Services research documents that enterprise AI is dominated by "more pilots
              than production deployments." This is not specific to Fundamental — it is a category-wide constraint.
              Enterprise buyers have approved AI budgets and are running POCs, but production deployment requires
              governance documentation, security certification, integration with existing data stacks, and SLA
              commitments that most early-stage analytics AI vendors cannot yet provide. For Fundamental, the bottleneck
              is converting its current Fortune 100 POC pipeline into multi-year production contracts.
            calloutType: risk
            claimRefs:
              - CM004
              - CM025
              - CM031
          - type: callout
            title: Market Sizing Relies on Bottom-Up Proxies — No Confirmed Analyst TAM Available
            body: >-
              This chapter does not carry a confirmed analyst TAM because Gartner, IDC, and MarketsandMarkets reports
              were blocked by paywall in this research run. All sizing evidence is derived from Databricks
              customer-count disclosures, pricing benchmarks, and vendor case studies. Investors and operators should
              seek primary analyst access before accepting any market-size figures for "enterprise tabular AI" or
              "analytics copilot" as an isolated addressable segment.
