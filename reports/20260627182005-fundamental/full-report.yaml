      - number: '5.4'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >
              Fundamental's trust architecture is architecturally sophisticated but certification-empty at the public
              level. The confidential computing deployment claims simultaneous protection of model IP and customer data
              via hardware TEE, cryptographic boot fingerprint, and key-release policies that require binary exactness —
              a strong design for regulated industry customers. Fundamental has stated that the SageMaker deployment is
              architecturally compatible with HIPAA, GDPR data residency, PCI-DSS, and financial reporting frameworks,
              specifically because data never leaves the customer's cloud account and the network-isolated container has
              no outbound calls during inference. However, no SOC 2 Type II, ISO 27001, FedRAMP, or equivalent published
              certification is available. No enterprise Data Processing Agreement (DPA) is publicly accessible, and the
              privacy policy covers only website visitor data with minimal enterprise language. The Terms of Use
              (effective February 4, 2026) require binding arbitration and disclaim all warranties, which is standard
              early-stage practice but signals no committed SLA. For healthcare and financial services buyers, the
              architectural compliance argument is likely sufficient for POC entry, but production sign-off will
              typically require formal certifications. The legal entity address in the Terms of Use is 2160 Manzanita
              Avenue, Menlo Park, CA 94025 — inconsistent with the "San Francisco HQ" messaging used in press releases
              and marketing. This discrepancy is minor for diligence purposes but should be verified against Delaware
              formation records.
