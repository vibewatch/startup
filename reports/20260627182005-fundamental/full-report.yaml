  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Benchmark opacity and moat risk
        blocks:
          - type: paragraph
            body: >-
              Fundamental's central product claim is ambitious: NEXUS is described as a deterministic non-transformer
              Large Tabular Model pre-trained on more than 10 billion enterprise tables. The problem for diligence is
              that the strongest benchmark evidence is still company-controlled. The product page and whitepaper present
              performance framing, but the supplied evidence set does not show third-party replication, a public
              leaderboard placement, or customer-level scorecards. That makes product-quality underwriting difficult
              because the difference between an impressive demo and a robust enterprise model often appears only when
              tables are messy, sparse, missing columns, or broken by process drift.


              The company itself amplified that risk by publishing Gael Varoquaux's warning that some models that look
              great on standard tests fall apart when enterprise data breaks in real ways. That quote is valuable
              because it points directly at the operational failure mode investors should care about. Benchmark opacity
              also weakens moat arguments: if performance evidence stays self-published while open-source research and
              warehouse-native substitutes improve quickly, buyers may treat NEXUS as an expensive evaluation project
              rather than a durable platform standard.
