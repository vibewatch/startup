      - number: '6.3'
        title: Retention, Durability, and Metric Gaps
        blocks:
          - type: paragraph
            body: >
              No retention metrics — NRR, GRR, churn rate, renewal rate, cohort data, contract length distribution, or
              customer satisfaction scores — are publicly available for Fundamental. The company launched in February
              2026, which means its oldest customers have been in production for at most four to five months as of the
              June 2026 run date. First-contract renewal cycles in enterprise seven-figure software deals typically run
              12–36 months, so no renewal data is plausible yet. The AWS press release states that contracts have been
              "secured" — consistent with either signed SOWs or multi-year agreements. The confidential computing
              architecture and single-tenant VPC deployment model are natural retention anchors once production data
              pipelines are built on NEXUS: switching costs are high because the enterprise data team's ML workflow is
              coupled to the SDK API and the deployment infrastructure. The FDE model (forward deployed engineers
              embedded with customer data teams) is explicitly designed to accelerate time-to-production and deepen the
              integration footprint, both of which increase stickiness. However, all retention logic is structural
              inference — no empirical data on actual churn or renewal has been published. The presence of Reddit
              r/dataengineering skepticism (February 2026) about schema heterogeneity and production data quality
              suggests that at least some enterprise evaluators may encounter implementation friction that could delay
              or block production deployment. This is not evidence of churn but a risk signal that could affect
              early-cohort retention rates.
