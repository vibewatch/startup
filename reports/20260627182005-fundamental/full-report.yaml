  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market Fundamental enters sits at the intersection of three adjacent spend categories: enterprise
              structured-data AI (purpose-built predictive models on tabular datasets), analytics copilots and
              text-to-SQL layers (NL-to-SQL interfaces on cloud warehouses), and semantic layers (governed metric
              definitions shared across BI tools, agents, and applications). The broadest boundary is all enterprise
              analytics software that uses AI to answer structured-data questions; the narrowest is purpose-built
              foundation models for tabular prediction. Neither boundary is clean, because incumbents define the market
              by what they sell. Snowflake's Cortex Analyst documentation explicitly states that "generic AI solutions
              often struggle when given only a database schema" because schemas lack business-process definitions,
              metric logic, and organizational terminology — establishing that semantic-layer-aware solutions occupy a
              distinct, more defensible sub-segment. Google's BigQuery data canvas openly acknowledges it "isn't
              intended for direct use by business users," revealing a last-mile analytics gap that purpose-built
              analytics AI products fill. On the status-quo side, the primary substitutes are: (1) dbt Semantic Layer
              (MetricFlow-based governed metrics accessible via API and MCP Server, used by Bilt Rewards to cut
              analytics costs by 80%), (2) Sigma Computing's warehouse-native spreadsheet SQL for teams that distrust AI
              query generation, (3) traditional BI tools (Tableau Desktop/Cloud, Looker, Power BI) with AI assistants
              bolted on, and (4) custom-built ML pipelines using XGBoost, LightGBM, or scikit-learn for tabular
              prediction tasks. The market boundary directly determines addressable opportunity: Fundamental's LTM is
              not a BI copilot — it is a pre-trained tabular prediction model that competes with both incumbent
              data-platform AI features and open-source alternatives like PriorLabs TabPFN for the specific use case of
              automated enterprise prediction on structured data.
