              - CV043
      - number: '8.4'
        title: Thesis-Breaks and Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              The thesis breaks quickly if the missing metrics come in below what the price implies. The first and most
              obvious trigger is revenue: if ARR is still subscale relative to a unicorn mark, the round was thematic
              rather than fundamental. Second, the AWS-exclusive channel can be a source of reach or a source of
              dependency; if that relationship weakens or if AWS ships a meaningfully substitutive native product path,
              Fundamental loses both distribution leverage and strategic scarcity. Third, if independent benchmarks
              continue to favor free alternatives like TabPFN, the company may struggle to defend premium pricing.
              Fourth, if Fortune 100 contracts remain bespoke FDE engagements rather than repeatable software
              deployments, the margin structure will look more services-like than software-like. These are not edge-case
              risks. They are the main transmission channels through which today’s stretched valuation can compress
              quickly.
            claimRefs:
              - CV020
              - CV022
              - CV028
              - CV029
              - CV037
              - CV038
              - CV042
              - CV043
