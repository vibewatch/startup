      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Fundamental Technologies, Inc. is a private AI company legally domiciled at 2160 Manzanita Avenue, Menlo
              Park, California 94025, per Terms of Use effective February 4, 2026. The company presents its go-to-market
              headquarters as San Francisco, its research hub as Barcelona, and its commercial expansion base as Japan.
              This three-hub geographic footprint is confirmed by active job listings across all three locations as of
              late June 2026. The company operates under the domain fundamental.tech — not fundamental.ai, which is an
              unrelated entity — and positions NEXUS as the first Large Tabular Model (LTM) for enterprise prediction.
              NEXUS is explicitly not transformer-based; it processes structured and tabular data deterministically,
              predicting outcomes across fraud detection, predictive maintenance, demand forecasting, and any enterprise
              workflow driven by row-and-column structured data. The business model is enterprise B2B: customers
              subscribe to NEXUS via AWS Marketplace (SageMaker JumpStart single-tenant deployment) or access it through
              the SAP Business AI open model ecosystem. The company targets Fortune 100 enterprises in financial
              services, healthcare, manufacturing, retail, and energy verticals and deploys a Palantir-style Forward
              Deployed Engineer (FDE) go-to-market model requiring close customer engagement. Public privacy and legal
              documents confirm the legal entity name and effective launch date, making the corporate identity
              well-documented at the fundamental level even if exact board structure and cap-table mechanics remain
              private.
