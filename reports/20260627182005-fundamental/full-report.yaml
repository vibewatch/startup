  - id: FE001
    title: NEXUS Product Architecture Stack
    type: stack
    layout: standard
    summary: >
      Five-layer architecture from customer data ingestion through the LTM core engine, model portfolio, API integration
      layer, and security/deployment layer.
    data:
      layers:
        - label: Customer Data Layer
          detail: >-
            S3 / customer cloud storage, on-premises databases, SageMaker async inference input; no data transmitted to
            Fundamental
          modules:
            - S3 / cloud storage
            - On-premises databases (air-gapped)
            - SageMaker async inference input
            - 'Data custody: stays in customer environment'
        - label: NEXUS Core LTM Engine
          detail: >-
            Non-transformer architecture pre-trained on >10B tabular rows; deterministic inference via in-context
            learning
          modules:
            - Non-transformer architecture (proprietary)
            - Pre-trained on >10B real-world tabular rows
            - Deterministic inference output
            - In-context learning for tabular data
        - label: Model Portfolio (Time Series Module)
          detail: Auto-selects among five time series architectures based on dataset characteristics
          modules:
            - Standard global model
            - Performance-clustered model
            - Hierarchical-temporal decomposition
            - Residual stack (base predictor correction)
            - Frequency-severity split (zero-inflated targets)
        - label: API and Integration Layer
          detail: scikit-learn-compatible Python SDK plus AWS SageMaker JumpStart and SAP generative AI Hub distribution
          modules:
            - 'Python SDK: pip install fundamental-client'
            - NEXUSClassifier / NEXUSRegressor
            - scikit-learn fit / predict / predict_proba
            - AWS SageMaker JumpStart package
            - SAP Business AI generative AI Hub
        - label: Security and Deployment Layer
          detail: >-
            Single-tenant customer VPC on SageMaker; confidential computing TEE with cryptographic boot fingerprint;
            air-gapped support
          modules:
            - Single-tenant customer VPC (SageMaker)
            - Confidential computing TEE (hardware-enforced)
            - Cryptographic boot fingerprint; no master key
            - Air-gapped / on-premises support
    approximationNotes: >
      Architecture derived from official company blog posts and AWS ML blog; core LTM architecture is described by
      Fundamental only as 'not a transformer' — internal implementation details are proprietary.
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE008
      - CE014
