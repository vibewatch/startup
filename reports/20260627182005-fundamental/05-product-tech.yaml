  - id: architecture-and-deployment-model
    title: Architecture and Deployment Model
    body: >
      NEXUS was trained on Amazon SageMaker HyperPod using ml.p5en.48xlarge instances with 8× NVIDIA H200
      GPUs, consuming the full training run at AWS scale. The model's core architecture is not publicly
      specified beyond the statement that it is "not a transformer," leaving the actual neural network design
      opaque. Inference is delivered via three production pathways: (1) AWS Marketplace subscription to a
      SageMaker JumpStart model package, deployed as a single-tenant asynchronous inference endpoint inside
      the customer's own AWS VPC with datasets remaining in customer S3 and no outbound calls during
      inference; (2) SAP Business AI generative AI Hub, where NEXUS is available as a selectable model
      alongside other SAP ecosystem AI offerings; and (3) on-premises or air-gapped deployment via
      Fundamental's confidential computing architecture. The SageMaker deployment allows a single endpoint
      to serve multiple trained models simultaneously — fraud detection, customer churn, and demand
      forecasting can share one endpoint. The Python SDK (pip install fundamental-client) exposes the
      scikit-learn interface with an additional get_feature_importance() method. The confidential computing
      path uses hardware-enforced Trusted Execution Environments (TEEs), where the model and software stack
      are compiled into a cryptographically fingerprinted image; at runtime, the hardware measures the boot
      state against the fingerprint, and keys are never released if any binary has been modified. This
      architecture simultaneously protects model IP from the customer and customer data from Fundamental —
      with no human master key and no policy-based override possible.
    claimRefs:
      - CE003
      - CE008
      - CE009
      - CE010
      - CE012
      - CE013
