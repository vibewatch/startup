callouts:
  - calloutType: strength
    title: AWS and SAP Distribution Dramatically Lower Customer Acquisition Cost
    body: >
      NEXUS's integration with AWS SageMaker JumpStart (GA June 2026) and SAP Business AI (May 2026)
      positions it inside two of the largest enterprise software procurement channels in the world.
      AWS customers can subscribe via Marketplace and deploy in their own account with a single click.
      SAP customers can select NEXUS from the generative AI Hub without redesigning workflows. Both
      channels have entrenched enterprise IT relationships that would otherwise require 12–18 month
      independent sales cycles. The AWS partnership is particularly powerful: the AWS ML blog announcement
      by AWS solution architects signals a co-sell relationship, not just a listing.
    claimRefs:
      - CE009
      - CE010
      - CE033

  - calloutType: risk
    title: No Published Benchmark, No Peer-Reviewed Paper — Competitive Credibility Risk
    body: >
      Fundamental's whitepaper is a self-described "research manifesto" — not a peer-reviewed publication.
      The nexus product page shows benchmark comparisons but publishes no raw numbers, test sets, or
      methodology. Competitor TabPFN is published in Nature with full reproducibility. In enterprise
      procurement, technical buyers will run their own POC benchmarks, but the absence of published
      validation lengthens sales cycles, reduces trust with data science buyers, and creates a material
      credibility gap versus academic-grade competitors.
    claimRefs:
      - CE015
      - CE017
      - CE018
      - CE031

  - calloutType: risk
    title: Architecture Opacity Is a Single Point of Failure for Regulated Enterprise Sales
    body: >
      NEXUS's core architecture is undisclosed. For regulated industry buyers (banking regulators under
      SR 11-7, healthcare under HIPAA, and EU financial services under CRD V), explainability and audit
      trails are mandatory, not optional. The get_feature_importance() function provides feature-level
      attribution, but is not equivalent to full model explainability required for regulatory sign-off.
      If NEXUS cannot pass an internal model risk management review, enterprise pilots will stall at
      production sign-off regardless of POC performance.
    claimRefs:
      - CE025
      - CE032
      - CE037

