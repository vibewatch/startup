  - id: trust-security-and-compliance
    title: Trust, Security, and Compliance
    body: >
      Fundamental's trust architecture is architecturally sophisticated but certification-empty at the
      public level. The confidential computing deployment claims simultaneous protection of model IP and
      customer data via hardware TEE, cryptographic boot fingerprint, and key-release policies that require
      binary exactness — a strong design for regulated industry customers. Fundamental has stated that the
      SageMaker deployment is architecturally compatible with HIPAA, GDPR data residency, PCI-DSS, and
      financial reporting frameworks, specifically because data never leaves the customer's cloud account
      and the network-isolated container has no outbound calls during inference. However, no SOC 2 Type II,
      ISO 27001, FedRAMP, or equivalent published certification is available. No enterprise Data Processing
      Agreement (DPA) is publicly accessible, and the privacy policy covers only website visitor data with
      minimal enterprise language. The Terms of Use (effective February 4, 2026) require binding arbitration
      and disclaim all warranties, which is standard early-stage practice but signals no committed SLA.
      For healthcare and financial services buyers, the architectural compliance argument is likely
      sufficient for POC entry, but production sign-off will typically require formal certifications.
      The legal entity address in the Terms of Use is 2160 Manzanita Avenue, Menlo Park, CA 94025 —
      inconsistent with the "San Francisco HQ" messaging used in press releases and marketing. This
      discrepancy is minor for diligence purposes but should be verified against Delaware formation records.
    claimRefs:
      - CE011
      - CE025
      - CE026
      - CE032
    tableRefs:
      - TE004
    figureRefs:
      - FE004

  - id: roadmap-and-technical-gaps
    title: Roadmap and Technical Gaps
    body: >
      Fundamental's product roadmap as of June 2026 is visible only through indirect signals: the SageMaker
      JumpStart availability (announced June 8–9, 2026) represents the most recent GA milestone; the SAP
      generative AI Hub integration preceded this by approximately four to six weeks; the Ground Truth video
      series (launched June 18, 2026) signals a content-driven developer awareness push. The company has
      announced speaking slots at Dreamforce 2026, Money20/20, TechCrunch Disrupt, and WEF Davos 2027,
      suggesting a sustained enterprise marketing calendar through early 2027. The careers page lists 9
      engineering roles and 4 research roles actively open as of June 26, 2026 across San Francisco,
      Barcelona, and Japan, indicating concurrent product, infrastructure, and expansion work. No formal
      product roadmap has been published. Key technical gaps requiring diligence include: (1) core
      architecture opacity — no model card, no weights, no architecture paper; (2) benchmark methodology
      transparency — no reproducible test set or third-party replication; (3) compliance certification
      absence — HIPAA/GDPR compliance is claimed via architecture but unverified; (4) scale claim
      verification — the "billions of rows" claim is unverified outside of the AWS press release and
      Fundamental's own marketing; and (5) model card / fairness documentation — critical for healthcare
      and financial services regulated deployment. The world cup demo is a strong public proof of LTM
      inference quality, but production enterprise accuracy and latency under real enterprise data quality
      conditions remain unverified by third parties.
    claimRefs:
      - CE040

