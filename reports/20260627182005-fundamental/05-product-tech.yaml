acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >
      Bloomberg TV interview (SE029) is behind a Bloomberg paywall; it is cited only for confirming
      CEO media presence at Founders Forum and not for any substantive technical or financial claim.
      All material claims are backed by non-paywalled sources. The restricted source share is well
      below 30% of chapter sources (1 of 30 = 3.3%).
  - dimension: tableNotes
    reason: >
      TE002 (Workflow / Use-Case Table) contains structured factual rows with company-stated benefits
      clearly marked as claimed; each row has a Limitation column making caveats explicit without a
      separate notes field. Similarly TE003 and TE005 are factual records where all caveats are
      captured in dedicated columns (Gap, Implication). Notes are provided on all tables that contain
      estimates or partial coverage.
