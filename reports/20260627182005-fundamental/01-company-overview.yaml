- id: milestones-and-traction
  title: Milestones, Traction Signals, and Adverse Observations
  body: >-
    The company's milestone arc runs from a 2024 founding through a very active early-2026
    product launch. Inferred founding in October 2024 is based on the product-customers pack
    reference; the Terms of Use effective date of February 4, 2026, confirms a fully operational
    legal entity by launch. The stealth-to-launch transition was compressed: the Series A and
    public product debut were announced simultaneously on February 5, 2026, alongside
    claims of seven-figure contracts with Fortune 100 clients. Subsequent milestones in
    spring and early summer 2026 include the SAP Business AI integration, the AWS SageMaker
    JumpStart listing (formally published June 8-9, 2026), and the soccer.fundamental.tech
    World Cup demo launched June 19, 2026, which demonstrated 81 percent accuracy on decisive
    group-stage matches. As of late June 2026, 25 open roles are listed across commercial
    (9), engineering (9), research (4), marketing (2), and operations (1) functions — a hiring
    signal consistent with a team of roughly 50 to 150 employees scaling toward enterprise
    GTM execution. Adverse observations: Christoph Molnar's independent Mindful Modeler
    newsletter (February 17, 2026) does not recommend NEXUS, instead recommending free
    open-source TabICL v2, citing benchmarking opacity (NEXUS is absent from the TabArena
    independent leaderboard) and risks of proprietary model licensing. A competitive landscape
    note also identifies at least ten LTM startups and hyperscaler efforts (Microsoft
    Mothernet, Amazon Mitra, SAP ContextTab) as active competitors. The Hacker News post on
    the raise attracted minimal developer community engagement — four upvotes and one comment —
    suggesting limited bottom-up adoption traction at launch.
  claimRefs:
  - CO029
  - CO030
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
  - CO036
  - CO037
