  figureRefs:
  - FO002

- id: founders-and-leadership
  title: Founders, Leadership, and Research Pedigree
  body: >-
    Fundamental Technologies was built around a core of DeepMind alumni who bring machine
    learning research credibility rare for a sub-two-year-old startup. Jeremy Fraenkel is
    publicly confirmed as CEO and co-founder across TechCrunch, the company website, and the
    official AWS press release from February 5, 2026; no other co-founders are publicly named.
    Marta Garnelo is Chief Science Officer, with published research in neural processes,
    meta-learning, multi-agent reinforcement learning, and generative modeling at DeepMind;
    her Google Scholar profile independently corroborates this background. Wojciech Marian
    Czarnecki serves as Founding Advisor; he is independently verified as a DeepMind researcher
    whose co-authored work on StarCraft II multi-agent RL is a landmark in the field.
    Gaël Varoquaux, co-creator of scikit-learn (used in more than four billion downloads),
    also serves as Founding Advisor and appeared in the company's Ground Truth video series in
    June 2026. Beyond these central figures, published blog authors confirm additional senior
    hires: Alexandre Gerbeaux (Head of Applied AI, ex-Mistral AI, ex-DataRobot), Yuval Azoulay
    (Founding Engineer, ex-AI21 Labs), Neil Leiser (Applied AI, ex-Iwoca), Ionut Farcas
    (FDE, ex-Palantir), Bryan D'Aversa (AI Product Lead), Oleg Zarakhani (Lead Data Scientist),
    and Arpit Jain (Applied AI). The team spans enterprise software operators (FDE model from
    Palantir), credit risk practitioners (Iwoco), and a research bench backed by published
    academic work. Key-person risk on Fraenkel (CEO) and Garnelo (CSO) is material given
    their public roles as primary company voice and technical anchor respectively.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  tableRefs:
  - TO002

- id: funding-and-investors
  title: Funding History, Valuation, and Investor Composition
  body: >-
    Fundamental's public financing record is concentrated in a single, very large Series A.
    Total capital raised as of the run date is $255 million; approximately $225 million
    represents the Series A announced February 5, 2026, and the remaining approximately $30
    million implies a pre-seed or seed round that has not been separately announced. The $1.4
    billion post-money valuation figure is attributed to TechCrunch's contemporaneous reporting
    and confirmed by the official AWS press release. One news aggregator archived a version
    reporting $1.2 billion, raising a minor conflict that may reflect pre-money / post-money
    confusion or an early draft of the TechCrunch article; $1.4 billion should be treated as
    canonical given the primary source weight. The Series A was led by Oak HC/FT, a
    healthcare and fintech specialist growth-stage fund that represents a notable extension of
    its typical thesis into enterprise AI infrastructure. Co-leads were Valor Equity Partners,
    Battery Ventures (which lists Fundamental on its portfolio page), and Salesforce Ventures
    (whose portfolio page is titled "Why we're backing Fundamental"). Hetz Ventures, an
    Israeli-origin data-and-AI infrastructure VC, also participated. Angel investors include
    Aravind Srinivas (Perplexity AI CEO), Henrique Dubugras (Brex co-founder), and Olivier
    Pomel (Datadog CEO) — a signal network valuable for enterprise customer introductions.
    No SEC filings, EDGAR presence, or Delaware public registry data were found; governance
    documents, board composition, and preference-stack mechanics are fully private.
  claimRefs:
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
