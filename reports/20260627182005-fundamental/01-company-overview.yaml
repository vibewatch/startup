    severity: minor
    topic: milestones
    missingEvidence: >-
      Founding date is estimated at approximately October 2024 and has not been officially
      confirmed; pre-launch milestones before February 5, 2026 are incompletely documented
      in public sources
    whyItMatters: Accurate founding date affects age-at-valuation comparisons and fundraising narrative; the early development timeline and seed funding events are opaque
    diligencePath: Request official incorporation documents and pre-launch milestone log; verify founding date against Delaware SOS records or directly with management
    relatedQuestionRefs:
