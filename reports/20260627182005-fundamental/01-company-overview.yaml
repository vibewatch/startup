company:
  name: Fundamental Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fundamental Technologies, Inc. (fundamental.tech) emerged from stealth on February 5, 2026,
    with a $225 million Series A and $1.4 billion post-money valuation, led by Oak HC/FT, Valor
    Equity Partners, Battery Ventures, Salesforce Ventures, and Hetz Ventures. Its sole product
    is NEXUS, a Large Tabular Model (LTM) pre-trained on more than 10 billion enterprise tables
    for deterministic enterprise prediction. Strategic distribution via AWS SageMaker JumpStart
    and SAP Business AI provides early enterprise reach, though revenue quality, headcount, and
    founding date remain partially disclosed.
sections:
- id: identity-and-business-overview
  title: Identity, Headquarters, and Business Model
  body: >-
    Fundamental Technologies, Inc. is a private AI company legally domiciled at 2160 Manzanita
    Avenue, Menlo Park, California 94025, per Terms of Use effective February 4, 2026. The
    company presents its go-to-market headquarters as San Francisco, its research hub as
    Barcelona, and its commercial expansion base as Japan. This three-hub geographic footprint
    is confirmed by active job listings across all three locations as of late June 2026. The
    company operates under the domain fundamental.tech — not fundamental.ai, which is an
    unrelated entity — and positions NEXUS as the first Large Tabular Model (LTM) for
    enterprise prediction. NEXUS is explicitly not transformer-based; it processes structured
    and tabular data deterministically, predicting outcomes across fraud detection, predictive
    maintenance, demand forecasting, and any enterprise workflow driven by row-and-column
    structured data. The business model is enterprise B2B: customers subscribe to NEXUS via
    AWS Marketplace (SageMaker JumpStart single-tenant deployment) or access it through the
    SAP Business AI open model ecosystem. The company targets Fortune 100 enterprises in
    financial services, healthcare, manufacturing, retail, and energy verticals and deploys a
    Palantir-style Forward Deployed Engineer (FDE) go-to-market model requiring close
    customer engagement. Public privacy and legal documents confirm the legal entity name
    and effective launch date, making the corporate identity well-documented at the
    fundamental level even if exact board structure and cap-table mechanics remain private.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
