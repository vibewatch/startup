    missingEvidence: Co-founder(s) beyond Jeremy Fraenkel have not been publicly named
    whyItMatters: Governance risk, key-person dependency, and IP ownership are partially determined by co-founder identity; departure of an unnamed co-founder could affect moat and team stability
    diligencePath: Review Delaware corporate filings, LinkedIn, and Fundamental's company page for co-founder disclosures; ask directly in diligence sessions
    relatedQuestionRefs:
    - QO001
    - QO023
    relatedTableRefs:
