callouts:
- calloutType: strength
  title: World-Class Research Pedigree Anchored at Founding
  body: >-
    The combination of Marta Garnelo (DeepMind CSO), Wojciech Czarnecki (DeepMind advisor),
    and Gaël Varoquaux (scikit-learn co-creator) at the founding level is unusually strong for
    a company less than two years old. This pedigree directly supports the credibility of the
    LTM architecture thesis and reduces the risk that product claims are purely marketing.
  claimRefs:
  - CO011
  - CO012
  - CO013

- calloutType: risk
  title: Benchmarking Opacity and Open-Source Competition
  body: >-
    NEXUS performance claims are entirely self-reported; the product is absent from TabArena,
    the only independent LTM benchmarking leaderboard. Christoph Molnar's Mindful Modeler
    newsletter explicitly recommends free open-source TabICL v2 over NEXUS and warns about
    proprietary licensing risks. At least ten LTM startups and three hyperscaler efforts
    compete in the same space, making competitive differentiation fragile without independent
    validation.
  claimRefs:
  - CO035
  - CO036
  - CO039
  - CO040

- calloutType: insight
  title: HQ Discrepancy — Menlo Park Legal Address vs. San Francisco Brand
  body: >-
    The company brands itself as headquartered in San Francisco, but its Terms of Use
    identifies 2160 Manzanita Avenue, Menlo Park, CA 94025 as the legal address. This is
    likely a registered-agent or legal fiction arrangement, but diligence should confirm
    physical presence before relying on any SF-HQ claim in investment materials.
  claimRefs:
  - CO002
  - CO003

