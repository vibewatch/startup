  topStrengths:
    - >-
      $255M Series A 轮对应 $1.4B 估值，Oak HC/FT、Battery Ventures、Salesforce Ventures 等顶级机构入局，Perplexity、Brex、Datadog
      的具名天使也背书，说明投资逻辑级别的信心和多年现金跑道都在。
    - AWS SageMaker JumpStart 和 SAP Business AI 分发让 NEXUS 直接进入 Fortune 100 采购渠道，不必从冷启动销售磨起；AWS CEO 和 VP 背书进一步抬高了企业可信度。
    - NEXUS 的机密计算架构（hardware TEE、cryptographic attestation、客户自有 VPC 部署）拆掉了受监管行业采用 AI 时最常见的数据安全阻力。
    - >-
      DeepMind 背景科学团队（Marta Garnelo 任 CSO、Wojciech Czarnecki 任 Founding Advisor）加上 Gaël Varoquaux（scikit-learn 共同创建者，4B+
      下载）撑起了可信的模型差异化和学术信誉。
  topRisks:
    - 所有单位经济指标——ARR、NRR、毛利率、客户数——都未披露；按 15x–30x 倍数倒推，$1.4B 估值隐含 $47M–$93M ARR，当前阶段未必撑得住。
    - TabPFN（免费层）的开源竞争和独立批评者削弱了定价权：Mindful Modeler 明确不推荐 NEXUS，TabArena 排行榜也没有 NEXUS；在品类锁定前压力已经出现。
    - 偏 FDE 的上市打法让收入随人头扩张，而不是随软件自然扩张；客户数很可能集中在 3–5 个 Fortune 100 账户，带来实质性收入集中和续约风险（最早续约点在 Q1–Q2 2027）。
    - 云交付独家押在 AWS 上，把平台、打包和分发风险集中到一段关系里；如果 AWS 推出原生表格模型，发现渠道和战略稀缺性会同时被拿走。
  unresolvedGaps:
    - ARR、收入增长节奏，以及经常性收入与部署辅助收入的占比均未披露；没有这些数据，任何财务口径都无法支撑 $1.4B 估值。
    - 客户数、logo 集中度、扩张行为和 NRR / 续约条款都拿不到；2026 年 2 月发布时签下的合同，最早续约数据点在 Q1–Q2 2027。
    - 本轮经济条款——清算优先权、老股参与、期权池调整和实际稀释——没有公开披露，因此 $1.4B 投后估值很难换算成真实投资者经济账。
    - 独立基准平台 TabArena 没有 NEXUS；公司公开性能证据完全依赖自发布基准和 World Cup 足球演示。
