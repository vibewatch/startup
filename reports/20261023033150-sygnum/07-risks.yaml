    title: Residual risk heatmap
    type: matrix
    summary: "Qualitative evidence map separating observed obligations and mitigations from likelihoods that remain unquantified."
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: "Multi-jurisdiction regulation"
          values:
            - {label: "High / ongoing", detail: "Licensing and MiCA obligations continue after authorization."}
            - {label: "High", detail: "Restrictions could constrain products and distribution."}
            - {label: "Established", detail: "Multiple licences are disclosed, but control testing is not public."}
            - {label: "Medium-high", detail: "Execution spans several regulatory regimes."}
        - label: "Custody and key security"
          values:
            - {label: "Unknown", detail: "No incident-rate or test-result denominator is public in the pool."}
            - {label: "Critical", detail: "A compromise could affect client assets and licences."}
            - {label: "Disclosed controls", detail: "Hardware, software, governance, audits, and segregation are company-described."}
            - {label: "High uncertainty", detail: "Control effectiveness is not independently evidenced here."}
        - label: "B2B API availability"
          values:
            - {label: "Unknown", detail: "Automatic execution is disclosed; uptime is not."}
            - {label: "High", detail: "Partner-bank trading depends on integrated services."}
            - {label: "Operating at scale", detail: "The 2024 report relayed 1,000+ daily trades."}
