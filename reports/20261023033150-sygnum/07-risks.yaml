            - {label: "High", detail: "A thesis-critical partner loss could impair distribution."}
            - {label: "25+ network", detail: "The count indicates breadth, not economic diversification."}
            - {label: "Medium-high", detail: "Concentration cannot be quantified."}
        - label: "Financial execution"
          values:
            - {label: "Medium", detail: "Expansion and compliance require continuing investment."}
            - {label: "High", detail: "Capital or liquidity pressure could limit regulated growth."}
            - {label: "Fresh funding", detail: "$58 million was raised in January 2025."}
            - {label: "Medium-high", detail: "Current cash, audited margins, and stress outcomes are unavailable."}
        - label: "Tokenization scaling"
          values:
            - {label: "Documented", detail: "The SBA explicitly says scaling needs further adjustments and cooperation."}
            - {label: "Medium", detail: "Failure would weaken a product-expansion thesis rather than core custody immediately."}
            - {label: "Proof of concept", detail: "Technical and legal feasibility was demonstrated."}
            - {label: "Medium", detail: "Production adoption and governance remain to be proven."}
    approximationNotes: "Qualitative categories are evidence-based analyst judgments, not measured probabilities; unknown values remain unknown rather than being scored as low risk."
    claimRefs: [CR003, CR006, CR007, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Public control evidence is not control assurance
    body: >-
      Licences, disclosed audits, automation rates, and asset segregation are meaningful mitigants, but the pool does not contain current audit opinions, penetration-test results, incident histories, concentration schedules, or capital stress tests. Those missing records should gate any reduction from a medium-high residual risk assessment.
    claimRefs: [CR003, CR007, CR013, CR014, CR015]
