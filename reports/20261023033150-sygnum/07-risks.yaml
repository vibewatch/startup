schemaVersion: "report-v2"
artifact: risks
slug: sygnum
runDate: 2026-10-23
company:
  name: Sygnum
chapter:
  number: 7
  title: Risks
  summary: >-
    Sygnum's licensing footprint and disclosed custody controls reduce some regulatory and client-asset risks, but they do not remove the high-impact exposure created by multi-jurisdiction compliance, custody, API availability, partner dependence, and crypto-market cyclicality. Public evidence supports a medium-high residual risk view because audited operating, concentration, incident, and capital-stress evidence remains unavailable.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Sygnum operates through licences and regulated entities across Switzerland, Singapore, Liechtenstein, Abu Dhabi, and Luxembourg, making regulatory permission a core asset and a continuing execution burden. The June 2026 Liechtenstein CASP licence expands EU access, while ESMA's MiCA framework imposes authorization, disclosure, transaction-record, and supervisory requirements rather than a one-time approval test. This creates high-impact compliance risk: a scope breach, control failure, or adverse supervisory finding could constrain products or cross-border distribution. Current licences are a meaningful mitigation, not evidence that every product, jurisdiction, or control has been tested. The assigned evidence contains no regulator enforcement search result or legal docket establishing either an incident or its absence, so the register remains intentionally partial and calls for direct regulator and counsel confirmation.
    claimRefs: [CR001, CR002, CR003, CR013]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, custody, and security exposure
    body: >-
      Operational risk is concentrated where digital-asset custody, transaction controls, and partner-bank APIs meet. Sygnum states that BancaStato assets use multi-layer custody, governance controls, external audits, and off-balance-sheet treatment; a 2024 partner-platform report also relayed more than 1,000 daily B2B trades with 99.9% executed automatically within seconds. These facts describe control design and automation, not uptime, loss experience, penetration-test results, recovery performance, or an independently verified incident history. The impact of a custody compromise or sustained API disruption would therefore be high even though likelihood cannot be estimated from the pool. The risk heatmap preserves that distinction: "unknown" likelihood reflects missing evidence and must not be read as proof of safety or evidence of an incident.
    claimRefs: [CR004, CR006, CR007, CR014, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partner-financial
    title: Partner, funding, and business-model dependencies
    body: >-
      The B2B model broadens distribution but also creates dependencies on partner banks, core-banking integrations, and Sygnum's own API and custody stack. Sygnum reported more than 25 partner institutions in July 2026, up from the 20-plus network described in 2024, but the public pool does not disclose traffic, assets, or revenue by partner. The January 2025 financing supplied $58 million at a reported $1 billion-or-more valuation and was earmarked partly for expansion, infrastructure, compliance, and resilience. That funding supports mitigation, yet funding raised is not cash currently available. Public profitability and trading-growth statements remain management-reported and do not provide audited revenue, margin, liquidity, loss, or capital-stress data, leaving medium-high financial execution risk.
    claimRefs: [CR005, CR008, CR009, CR010, CR011, CR012, CR015]
    tableRefs: [TR003]
  - id: monitoring-kill-criteria
    title: Monitoring indicators, diligence, and thesis-break triggers
    body: >-
      The investment case should be monitored against observable control and concentration evidence rather than the absence of reported problems. Regulatory kill criteria are a licence restriction, material enforcement action, or inability to evidence MiCA and AML control effectiveness. Operational kill criteria are a client-asset loss, prolonged partner API outage, failed recovery test, or audit qualification affecting custody. Commercial and financial kill criteria are a disclosed partner concentration that makes one relationship thesis-critical, deterioration in regulatory capital, inability to fund compliance and infrastructure, or audited economics that contradict management's profitability narrative. For tokenization, the Swiss deposit-token proof of concept is promising but not scaled; failure to progress from technical and legal feasibility to repeatable multi-bank deployment would weaken the execution thesis.
    claimRefs: [CR003, CR007, CR013, CR014, CR015, CR016]
