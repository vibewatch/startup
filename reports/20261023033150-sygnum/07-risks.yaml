      - ["AML or transaction-control failure", "Digital-asset and cross-border activity requires continuing compliance controls", "Unknown", "High", "Regulated posture stated; operating effectiveness not public", "High uncertainty", "Alert volumes, false-positive rates, backlog, escalations, model validation, and regulatory findings"]
