  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enforcement-litigation
      missingEvidence: "Current regulator records, court searches, enforcement history, licence restrictions, and management's open legal-matter schedule."
      whyItMatters: "A material action could impair licences, products, capital, or distribution, while the absence of an allocated result cannot establish the absence of an event."
      diligencePath: "Search FINMA, MAS, FMA Liechtenstein, FSRA, CSSF, sanctions, and court records, then reconcile results to a counsel letter and board litigation schedule."
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: operational-security
      missingEvidence: "Independent custody audit opinions, penetration tests, incident and loss history, insurance limits, uptime, recovery objectives, and disaster-recovery test results."
      whyItMatters: "Disclosed control design and automatic execution do not establish operating effectiveness, availability, or loss severity."
      diligencePath: "Review SOC or ISAE reports, audit exceptions, red-team findings, incident postmortems, insurance policies, SLO history, and witnessed recovery tests."
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: "Revenue, assets, volumes, and contribution margin by the top customers, partner banks, channels, and products."
      whyItMatters: "A broad logo count cannot show whether one relationship or activity is economically thesis-critical."
      diligencePath: "Obtain top-10 concentration schedules for revenue, assets, volume, gross profit, contract term, renewal, and partner termination rights."
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-resilience
      missingEvidence: "Audited current revenue, gross margin, cash flow, liquidity, regulatory capital, loss exposure, and downside stress scenarios."
      whyItMatters: "Funding raised is not cash available, and management-reported profitability does not quantify resilience through a crypto-volume or price downturn."
      diligencePath: "Review audited entity and consolidated statements, monthly management accounts, capital returns, liquidity runway, and regulatory and internal stress-test results."
      relatedQuestionRefs: [QR005, QR010]
      relatedTableRefs: [TR003]
