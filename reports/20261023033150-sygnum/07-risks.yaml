      - ["Crypto trading activity and asset-cycle exposure", "Institutional clients and partner-bank users", "Trading revenue growth was reported, but revenue mix and downside sensitivity are not public", "Lower volumes, prices, or spreads compress revenue and operating leverage", "High", "Product and geographic breadth", "Medium-high without audited segment economics"]
    notes: "Partner counts and funding are point-in-time disclosed facts; concentration, current liquidity, and downside sensitivity are gaps rather than estimated quantities."
