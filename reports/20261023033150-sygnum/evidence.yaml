evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-gaps
    missingEvidence: Audited revenue, gross margin, operating loss or profit, cash flow, liquidity, and capital-adequacy history.
    whyItMatters: Funding and valuation do not show whether the regulated platform is economically durable or cash-generative.
    diligencePath: >-
      Request audited group and entity-level financial statements, management accounts, liquidity runway, and
      capital-adequacy reporting under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Current fully diluted cap table, voting rights, investor preferences, and board appointment rights after the 2025
      round.
    whyItMatters: Reported majority insider ownership does not establish actual control, dilution, or economic seniority.
    diligencePath: Obtain the latest cap table, financing documents, shareholder agreements, and board materials.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: operating-scale
    missingEvidence: >-
      A reconciled current schedule for clients, assets, AuA, AuC, headcount, and partner-bank counts with definitions
      and periods.
    whyItMatters: >-
      Public metrics span 2023-2026 and use different denominators, so apparent growth cannot be treated as a verified
      time series.
    diligencePath: >-
      Request monthly KPI definitions and reconciliations from 2023 through the latest quarter, including active versus
      registered clients.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete current board, executive, committee, and succession roster.
    whyItMatters: Founder biographies alone cannot test key-person dependence or control-function independence.
    diligencePath: Review current governance chart, committee charters, fit-and-proper files, and succession plans.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sector-risk
    missingEvidence: Independent evidence on regulatory findings, outages, losses, litigation, and partner or customer attrition.
    whyItMatters: >-
      The crypto-sector downturn and FTX-related shock demonstrate that market and trust events can affect institutional
      demand and valuation.
    diligencePath: >-
      Request regulatory examination summaries, incident logs, legal schedules, complaints, and partner-renewal or
      termination data.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing
    missingEvidence: >-
      A company-specific fee-pool model covering eligible geographies, product pricing, addressable institutions,
      expected wallet share and conversion.
    whyItMatters: >-
      Asset-value forecasts, protocol activity and allocation intent cannot be converted into Sygnum TAM, SAM, SOM or
      revenue without these denominators.
    diligencePath: >-
      Request management's market-sizing workbook and reconcile every assumption to product-level revenue, active
      clients and partner activation.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level implementation fees, custody pricing, transaction take rates, procurement owner, sales cycle,
      retention and partner activation.
    whyItMatters: >-
      The buyer map identifies plausible roles and workflows but cannot establish budget availability, sales efficiency
      or recurring monetization.
    diligencePath: >-
      Obtain representative contracts, pipeline-stage data and direct-versus-B2B cohort economics by buyer segment and
      geography.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: Partner-level revenue, volumes, take rates, renewal, churn, and attach rates by product line.
    whyItMatters: The platform thesis could be strategically credible while still failing to convert into durable unit economics.
    diligencePath: >-
      Request audited segment revenue, cohort retention, partner contracts, volume reports, and product-level
      gross-margin bridges.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competition
    missingEvidence: >-
      A current, comparable inventory of regulated banks, custody providers, tokenization platforms, and incumbent bank
      offerings by jurisdiction.
    whyItMatters: The landscape table is decision-useful but cannot support a market-share or complete competitor-ranking claim.
    diligencePath: >-
      Build a jurisdiction-by-jurisdiction competitor census using current licences, product pages, pricing, and
      procurement references.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer evidence quantifying implementation time, migration effort, service-level performance, and replacement
      attempts.
    whyItMatters: Integrated workflows imply switching friction, but no retained source measures the friction or proves exclusivity.
    diligencePath: >-
      Interview former and current customers and review implementation statements of work, uptime reports, and
      termination provisions.
    relatedQuestionRefs:
      - QP007
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-gaps
    missingEvidence: >-
      Current audited revenue by product and geography, gross margin, operating expense, cash balance, burn, runway,
      capital ratios, debt obligations, and concentration and retention schedules.
    whyItMatters: >-
      Without these inputs, the reported traction and financing cannot be translated into revenue quality, operating
      leverage, or downside resilience.
    diligencePath: >-
      Request audited management accounts, product revenue bridge, liquidity schedule, capital-adequacy stress tests,
      debt schedule, customer concentration, and cohort retention data.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
      - QI006
      - QI009
  - type: stale
    severity: material
    topic: historical-financials
    missingEvidence: >-
      A current reconciliation of the historical USD100 million-plus revenue run rate and 2024 trading growth to 2026
      recognized revenue.
    whyItMatters: Historical revenue and volume milestones may not represent the current run rate, mix, or margin profile.
    diligencePath: Obtain monthly 2025-2026 management reporting with accounting definitions and product-level reconciliation.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: enumeration-incomplete
    severity: material
    topic: B2B
    missingEvidence: Complete B2B partner list, contract status, contribution, implementation cost, and concentration.
    whyItMatters: A growing partner count can mask concentration, low monetization, or costly integrations.
    diligencePath: Request the current B2B pipeline and partner cohort schedule with revenue, margin, activation, and renewal fields.
    relatedQuestionRefs:
      - QI003
      - QI004
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent uptime, incident, recovery-time and recovery-point metrics for custody, trading, APIs and partner
      channels.
    whyItMatters: Regulated status and feature breadth do not establish operational resilience or customer-loss exposure.
    diligencePath: >-
      Request current assurance reports, incident registers, resilience test results and service-level history by
      product and legal entity.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Current component architecture, supported-chain controls and ownership boundaries across Sygnum and integration
      partners.
    whyItMatters: External dependencies determine concentration, failure propagation and practical scalability.
    diligencePath: Obtain system diagrams, dependency registers, change-management controls and third-party risk assessments.
    relatedQuestionRefs:
      - QE003
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: practitioner-signal
    missingEvidence: Independent evidence of API usage, release activity, package adoption or practitioner-community support.
    whyItMatters: A recruiting post establishes operating roles but not developer adoption or implementation quality.
    diligencePath: Request anonymized API volumes, documentation analytics, release history and support-ticket metrics.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Current cohort-level renewal, churn, GRR, NRR, contract length, and repeat-use data by product and customer
      segment.
    whyItMatters: Named deployments and point-in-time client counts do not establish durable revenue or customer economics.
    diligencePath: >-
      Request a dated cohort bridge from opening customers to renewals, churn, expansion, and contraction, reconciled to
      revenue.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer and top-partner shares of revenue, assets, and transaction volume, including direct versus B2B
      channels.
    whyItMatters: Partner-led scale can mask counterparty concentration and dependency on a small number of financial institutions.
    diligencePath: >-
      Obtain the latest concentration schedule, largest-account contracts, renewal dates, and counterparty replacement
      plans.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: active-usage
    missingEvidence: >-
      Current active-account, utilization, conversion, and product attach data, separated from onboarded or distributor
      users.
    whyItMatters: Reported clients, assets, and platform users use different denominators and cannot be combined into a growth rate.
    diligencePath: >-
      Request monthly active customers, assets under custody versus managed, transaction volume, and product attach by
      cohort.
    relatedQuestionRefs:
      - QU002
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: enforcement-litigation
    missingEvidence: >-
      Current regulator records, court searches, enforcement history, licence restrictions, and management's open
      legal-matter schedule.
    whyItMatters: >-
      A material action could impair licences, products, capital, or distribution, while the absence of an allocated
      result cannot establish the absence of an event.
    diligencePath: >-
      Search FINMA, MAS, FMA Liechtenstein, FSRA, CSSF, sanctions, and court records, then reconcile results to a
      counsel letter and board litigation schedule.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-security
    missingEvidence: >-
      Independent custody audit opinions, penetration tests, incident and loss history, insurance limits, uptime,
      recovery objectives, and disaster-recovery test results.
    whyItMatters: >-
      Disclosed control design and automatic execution do not establish operating effectiveness, availability, or loss
      severity.
    diligencePath: >-
      Review SOC or ISAE reports, audit exceptions, red-team findings, incident postmortems, insurance policies, SLO
      history, and witnessed recovery tests.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue, assets, volumes, and contribution margin by the top customers, partner banks, channels, and products.
    whyItMatters: A broad logo count cannot show whether one relationship or activity is economically thesis-critical.
    diligencePath: >-
      Obtain top-10 concentration schedules for revenue, assets, volume, gross profit, contract term, renewal, and
      partner termination rights.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: >-
      Audited current revenue, gross margin, cash flow, liquidity, regulatory capital, loss exposure, and downside
      stress scenarios.
    whyItMatters: >-
      Funding raised is not cash available, and management-reported profitability does not quantify resilience through a
      crypto-volume or price downturn.
    diligencePath: >-
      Review audited entity and consolidated statements, monthly management accounts, capital returns, liquidity runway,
      and regulatory and internal stress-test results.
    relatedQuestionRefs:
      - QR005
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current fully diluted cap table, option pool, liquidation preferences, anti-dilution rights, debt, and latest
      financing mark.
    whyItMatters: >-
      These terms determine ownership, downside allocation, and whether the reported headline valuation is economically
      relevant to new money.
    diligencePath: >-
      Obtain the capitalization table, charter, shareholder agreements, debt schedule, option grants, and round
      documents under NDA.
    relatedQuestionRefs:
      - QV002
      - QV004
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Audited revenue, product-level gross margin, cash flow, cash availability, retention, concentration, and cohort
      economics.
    whyItMatters: >-
      Without these metrics, neither a valuation multiple nor an investment return can be underwritten without false
      precision.
    diligencePath: >-
      Review audited statements, current management accounts, regulatory capital schedules, revenue cohorts, customer
      concentration, and cash forecasts.
    relatedQuestionRefs:
      - QV004
  - type: missing-source
    severity: material
    topic: comparable-reference
    missingEvidence: >-
      Like-for-like transaction multiples for regulated digital-asset banks with normalized revenue, capital
      requirements, growth, and ownership terms.
    whyItMatters: >-
      Competitor-issued financing figures, a strategic acquisition, and a public exchange market cap do not
      independently benchmark Sygnum.
    diligencePath: >-
      Commission a transaction-comps study and normalize private data-room metrics for date, business mix, regulatory
      capital, recurring revenue, and dilution.
    relatedQuestionRefs:
      - QV005
      - QV006
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: >-
      Current independent reporting or regulator records that test Sygnum-specific losses, complaints, enforcement,
      outages, or failed commercialization.
    whyItMatters: >-
      The assigned evidence pool contains a commercialization caveat but no strong current company-specific adverse
      record, limiting downside confidence.
    diligencePath: >-
      Obtain regulator correspondence, incident and complaint logs, loss history, audit findings, and independent
      customer references in diligence.
    relatedQuestionRefs:
      - QV007
      - QV008
