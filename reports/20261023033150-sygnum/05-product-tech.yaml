    title: Workflow and use-case table
    columns:
      - User job
      - Current workflow
      - Sygnum solution
      - Evidenced benefit
      - Limitation
    rows:
      - ["Buy, hold and sell digital assets", "Use an existing bank web or mobile channel", "B2B API connected to Avaloq", "No separate OMS in the BancaStato implementation", "One integration does not establish repeatability across bank cores"]
      - ["Move a custodied asset", "Withdraw from Sygnum e-banking to an owned wallet", "First-use destination screening", "Adds a control before an external transfer", "Screening accuracy and escalation outcomes are undisclosed"]
      - ["Safeguard client assets", "Place assets in institutional custody", "Multi-layer custody and governance controls", "Company says assets are off balance sheet", "Audit scope, exceptions and recovery performance are unavailable"]
      - ["Settle tokenized transactions", "Coordinate cash and asset legs across banks", "Deposit-token payment instructions and smart contracts", "PoC showed technical and legal feasibility", "SBA says scaling still needs design changes and cooperation"]
      - ["Issue or service tokenized products", "Operate securities or funds on digital rails", "Tokenization platform and regulated service layer", "Public launches span a bond and money-market fund", "Volumes, distribution depth and lifecycle incidents are not public"]
    notes: >-
      The rows mix production services, company-reported launches and one
      feasibility study; benefits must not be read as measured customer outcomes.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE012, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Key dependency
      - Principal risk
    rows:
      - ["Client and partner channels", "Expose digital-asset services in bank interfaces", "Partner UX and core-banking environment", "Channel outage or integration change"]
      - ["B2B API and execution", "Route purchases, sales and service requests", "Avaloq or another core, liquidity and execution venues", "Latency, reconciliation or counterparty failure"]
      - ["Custody and key controls", "Safeguard assets and authorize transfers", "Hardware and software controls, governance and assurance", "Key compromise, control exception or failed recovery"]
      - ["Compliance and onboarding", "Screen destinations and govern client acceptance", "AML/KYC processes, proprietary tooling and operations staff", "False positives, missed risk or sanctions exposure"]
      - ["Tokenization and settlement", "Represent assets and encode conditional transfers", "Smart contracts, chain availability, legal framework and counterparties", "Contract defect, interoperability or legal mismatch"]
      - ["Regulated operating perimeter", "Book and supervise services across jurisdictions", "Licences, regulators and cross-border permissions", "Rule change or service-perimeter restriction"]
    notes: >-
      This operating model is synthesized from disclosed workflows and
      integration evidence; it is not Sygnum's internal component diagram.
    claimRefs: [CE004, CE006, CE010, CE011, CE012, CE013, CE015, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Disclosed customer, integration, control and settlement layers form a
      regulated service stack, with material dependencies outside Sygnum.
    data:
      layers:
        - label: Customer channels
          modules: [Partner-bank web and mobile, Institutional e-banking]
        - label: Product modules
          modules: [Brokerage and trading, Staking and lending, Asset management]
        - label: B2B integration
          modules: [Sygnum API, Partner core banking, Order routing]
        - label: Custody and compliance
          modules: [Key controls, Destination screening, Governance and assurance]
        - label: Tokenization and settlement
          modules: [Token lifecycle, Smart-contract instructions, Deposit-token PoC]
        - label: External dependencies
          modules: [Partner banks, Liquidity venues, Public blockchains, Regulators]
    approximationNotes: >-
      Evidence-based operating view only; internal topology, ownership boundaries
      and performance characteristics are not publicly disclosed.
    claimRefs: [CE004, CE005, CE006, CE008, CE012]
