schemaVersion: "report-v2"
artifact: product-tech
slug: sygnum
runDate: 2026-10-23
company:
  name: Sygnum
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Sygnum delivers a regulated digital-asset banking stack spanning custody,
    brokerage, staking, lending, tokenization, asset management and bank
    enablement. Production partner integrations and a cross-bank deposit-token
    proof of concept show implementation capability, but public evidence does
    not quantify platform reliability, audit results or developer adoption.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Sygnum is best understood as a regulated financial-infrastructure
      provider rather than a single-purpose crypto application. Hubbis describes
      the operating surface as brokerage, staking, accounts and custody,
      tokenization, asset management, credit and lending, and B2B banking.
      Sygnum's own service page adds a concrete retail-to-institutional workflow:
      clients can deposit and withdraw every crypto asset supported for custody,
      and the first transfer to an external wallet must pass a proprietary
      destination-screening step. The product therefore combines transaction
      access with custody and compliance controls. Public evidence supports the
      breadth of the catalog and selected live workflows, but it does not show
      product-level revenue, attach rates, realized customer outcomes or a
      common maturity standard across every module.
    claimRefs: [CE001, CE002, CE003, CE007, CE008, CE009]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Integration and operating architecture
    body: >-
      The strongest current architecture evidence is the July 2026 BancaStato
      launch. Sygnum says its B2B API connects to Avaloq's core and digital
      banking channels, permits native purchase and sale from existing bank
      interfaces, and avoids a separate order-management system. This indicates
      an integration model in which the partner owns the customer channel and
      core while Sygnum supplies regulated execution and custody services.
      Separately, the Swiss Bankers Association documented a proof of concept in
      which Sygnum, UBS and PostFinance used tokenized payment instructions on a
      public blockchain for interbank payment and an escrow-like exchange. That
      study supports technical and legal feasibility, not production scale: the
      association explicitly says design adjustments and broader cooperation
      remain necessary.
    claimRefs: [CE004, CE005, CE006, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-maturity
    title: Differentiation and maturity signals
    body: >-
      Sygnum's differentiation appears to be the combination of regulated
      operating entities, institutional custody, bank distribution and
      tokenization experience rather than a publicly disclosed proprietary
      blockchain. Hubbis reported more than 15 enabled financial institutions
      in 2023, while Sygnum's 2026 BancaStato announcement says its B2B network
      exceeds 25 institutions; the direction is consistent with expansion, but
      the later count remains company-issued. Sygnum's timeline and Fintech News
      also point to Connect, Protect, a tokenized corporate bond, a tokenized
      money-market fund and AI-agent transactions. These are useful breadth and
      launch signals, not substitutes for volumes, uptime or economics. An
      independent profile describes Desygnate as modular and multi-chain, while
      older Hubbis reporting attributes parts of custody infrastructure to
      Swisscom; neither source provides a current independent architecture audit.
    claimRefs: [CE007, CE008, CE009, CE010, CE011]
  - id: controls-and-diligence
    title: Trust, resilience and diligence priorities
    body: >-
      Company materials say custody uses hardware and software controls, strict
      governance, independent external audits and off-balance-sheet treatment.
      Those are relevant control claims, but the public release does not provide
      audit scope, findings, uptime, recovery objectives, loss history or
      incident statistics. The broader tokenization benchmark reinforces the
      diligence burden: McKinsey identifies fragmentation, interoperability
      risk, limited institutional custody and wallet flexibility, high
      transition costs, constrained distribution and uneven regulation as
      recurring barriers. Public practitioner evidence for Sygnum is also
      indirect. A company-issued recruiting post shows cross-functional work
      among custody, lending, trading, asset management, Compliance and
      Operations, but it is not evidence of API usage or engineering-community
      adoption. Underwriting should therefore prioritize assurance reports,
      dependency ownership, service-level history, incident records, supported
      chain controls and production usage by module.
    claimRefs: [CE006, CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Distribution is embedded in the product
    body: >-
      BancaStato's Avaloq integration and the growth in reported B2B institutions
      indicate that Sygnum can distribute services through incumbent-bank
      channels rather than requiring every end user to adopt a separate venue.
    claimRefs: [CE004, CE005, CE007]
  - calloutType: risk
    title: Controls are described, not independently quantified
    body: >-
      Public sources identify custody and governance controls but do not disclose
      assurance scope, availability, recovery performance, incident frequency or
      developer-scale adoption.
    claimRefs: [CE006, CE015, CE016]
