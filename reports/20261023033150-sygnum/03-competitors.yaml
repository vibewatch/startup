  - id: TP002
    title: Feature and capability comparison
    columns: [Buying criterion, Sygnum, Regulated bank peer, Incumbent bank, Internal build]
    rows:
      - [Regulated banking platform, "Swiss banking licence and Singapore regulated entities", "Not compared in retained evidence", "Usually existing banking controls", "Requires licensing and governance"]
      - [Custody and wallet controls, "Integrated multi-custody, segregated wallets, and screening", "Not compared in retained evidence", "May offer custody through internal or partner stack", "Must build controls, operations, and monitoring"]
      - [Trading / staking / lending, "Documented as offered across banking pages", "Not compared in retained evidence", "Selected products may be available", "Separate integrations and risk approval required"]
      - [Tokenization and settlement, "Desygnate supports registry, settlement, stablecoin subscriptions, and 24/7 flows", "Not compared in retained evidence", "Possible through partnerships or projects", "Requires technical, legal, and distribution stack"]
      - [B2B distribution, "Partner banks can use a regulated platform and API-oriented services", "Not compared in retained evidence", "Strong incumbent distribution but scope varies", "No external distribution advantage"]
      - [Pricing / realized economics, "Unknown from assigned sources", "Unknown", "Unknown", "Internal cost estimate required"]
    notes: "Unknown means the assigned successful sources did not establish a comparable fact; it is not a claim that the capability is absent. Company-authored capability descriptions are not independent performance benchmarks."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer, Public price / unit, Documented packaging, Discount or unknown, Competitive implication]
    rows:
      - [Custody and accounts, unknown, "Integrated fiat and crypto accounts plus multi-custody", "No assigned source publishes realized fees or volume discounts", "Breadth may reduce vendor count, but price competitiveness is unproven"]
      - [Trading, unknown, "24/7 execution through platform, desk, or API", "No comparable spread, commission, or minimum is disclosed", "Execution quality and total cost require transaction-level testing"]
      - [Staking, unknown, "Offered for selected proof-of-stake assets", "Validator share, pass-through yield, and negotiated terms are unknown", "Specialists may compete on economics even if Sygnum integrates custody"]
      - [Crypto-backed lending, unknown, "Credit line against crypto collateral", "Rates, loan-to-value terms, and margin-call policy are not public here", "Banking integration is useful, but underwriting economics cannot be compared"]
      - [B2B bank enablement, unknown, "Regulated services delivered to partner institutions and via API", "Contract minimums, revenue share, exclusivity, and renewal terms are unknown", "Distribution can create workflow friction without proving contractual lock-in"]
      - [Tokenization, unknown, "Desygnate packages registry, settlement, stablecoin subscription, and continuous flows", "Implementation and servicing fees are not published", "Integrated issuance infrastructure differentiates scope; realized monetization remains private"]
    notes: "No assigned successful source provides comparable list or realized pricing. Unknown means unavailable in this evidence set, not zero cost; procurement, negotiated discounts, and contract terms require direct diligence."
    claimRefs: [CP002, CP007, CP008, CP010, CP013, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Sygnum appears relatively broad in regulated digital-asset scope and institution-facing integration, while alternatives retain plausible advantages in incumbent distribution or specialist focus.
    data:
      xAxis: "Institution-facing integration breadth (ordinal 1-5)"
      yAxis: "Regulated digital-asset scope (ordinal 1-5)"
      points:
        - {label: "Sygnum", x: 5, y: 5, note: "Banking, custody, trading, staking, lending, tokenization, asset management, and B2B are documented across assigned sources."}
        - {label: "Regulated bank peer", x: 4, y: 4, note: "Ordinal placeholder for a direct regulated-bank peer; current comparable evidence was not retained."}
        - {label: "Bitcoin Suisse", x: 3, y: 4, note: "Named as a competitive alternative; current comparable capability detail was not retained."}
        - {label: "Large incumbent bank", x: 5, y: 2, note: "Incumbent distribution and controls are strong, but assigned evidence does not establish equivalent digital-asset breadth."}
        - {label: "Specialist custodian", x: 3, y: 3, note: "Custody focus can be strong, but adjacent banking, lending, and tokenization scope is not established."}
        - {label: "Internal build / status quo", x: 1, y: 1, note: "Avoidance or internal build does not provide an external integrated platform in the retained evidence."}
    approximationNotes: "Ordinal coordinates are analyst assessments from the cited capability evidence, not market-share or revenue measurements. Unknown competitor detail is explicitly preserved."
    claimRefs: [CP001, CP005, CP007, CP010]
