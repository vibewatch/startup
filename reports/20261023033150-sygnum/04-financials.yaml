schemaVersion: "report-v2"
artifact: financials
slug: sygnum
runDate: 2026-10-23
company:
  name: Sygnum
chapter:
  number: 4
  title: Financials
  summary: Sygnum has a multi-product regulated digital-asset banking model with visible institutional traction and substantial recent financing, but public materials do not disclose the revenue mix, margin profile, cash runway, or customer concentration needed for a full underwriting judgment.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Sygnum's public materials describe several monetizable activities rather than a single
      software subscription: brokerage and trading, custody, staking, accounts, tokenization,
      asset management, credit and lending, and B2B banking. The Singapore business also describes
      brokerage, securities dealing, fund management, corporate-finance advice, and custodial
      services in the MAS directory. This supports a diversified fee and spread model, but the
      public record does not separate transaction fees, custody fees, net interest, lending income,
      asset-management fees, or B2B platform economics. A reported trading-revenue milestone is
      directional rather than a complete income statement, and official list/service descriptions
      are not realized pricing or gross-margin evidence.
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      The strongest public traction signals are institutional rather than consumer metrics. A
      Reuters-republished report says trading-product revenues had exceeded the prior year's total
      by the third quarter of 2024, while another report attributes more than 1,000% annual trade
      volume growth to PostFinance and more than 20 bank relationships. Hubbis reports approximately
      USD4 billion in total assets, while a July 2026 company announcement says the B2B network
      included more than 25 banks and international financial institutions. These figures use
      different dates, definitions, and issuers, so they should not be combined into a growth rate.
      No public source here provides CAC, payback, conversion, renewal, churn, attach rate, realized
      take rate, or sales-cycle data.
    claimRefs: [CI005, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: capital-and-cost-structure
    title: Capital adequacy and cost structure
    body: >-
      Sygnum's financing history shows repeated capital support, but funding raised is not cash
      available and does not establish runway. The January 2025 round was reported as USD58 million
      at a valuation above USD1 billion, with proceeds intended for geographic expansion,
      infrastructure, products, compliance, risk management, and resilience. A prior USD40 million
      round was described as oversubscribed at a USD900 million post-money valuation, and one
      source reported more than USD100 million of revenue run rate; that figure is historical,
      is not ARR, and is not a current audited statement. Public materials do not show cash,
      burn, capital ratios, debt maturities,
      working-capital needs, servicing costs, or capex. Regulatory and custody infrastructure
      should therefore be treated as potentially material fixed-cost and control investments,
      not as evidence of a particular margin.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The business has credible institutional distribution and a regulated operating perimeter:
      the MAS directory identifies Sygnum Pte. Ltd. as a Capital Markets Services licensee and
      Major Payment Institution, while partner reporting describes PostFinance using Sygnum's B2B
      platform to add digital-asset services. Those facts improve the plausibility of enterprise
      monetization but do not prove profitability. The main underwriting limitation is
      missing financial disclosure: revenue by product and geography, realized pricing, gross
      margin, operating expense, cash and burn, capital adequacy under stress, customer and partner
      concentration, and cohort retention are not established by the assigned public evidence. The
      appropriate stance is research-more: institutional demand is visible, but revenue quality,
      operating leverage, and financing dependency remain unresolved.
    claimRefs: [CI015, CI017, CI018, CI019]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or basis, Current public status, Quality, Diligence ask]
    rows:
      - [Brokerage and trading, "Execution and trading across digital assets and other products", "Transaction / spread", "Trading-product revenues reportedly exceeded the prior year's total by Q3 2024", "Third-party reported; period-specific", "Obtain audited revenue split, realized take rate, and volume-to-revenue bridge"]
      - [Custody and staking, "Safekeeping and staking of client digital assets", "Assets / service fees", "Services are described publicly; fee schedule and margin are not disclosed", "Company-claimed service availability", "Obtain fee schedule, custody cost, staking economics, and client-asset reconciliation"]
      - [B2B banking, "API-enabled regulated digital-asset services for partner banks", "Partner institution / transaction", "More than 20 or 25 institutions are reported across different dates", "Company-linked and partner-reported; not directly comparable", "Obtain contracts, recurring versus variable fees, implementation cost, and partner concentration"]
      - [Asset management and tokenization, "Funds, indices, tokenization, and related products", "AUM / product / transaction", "Products and sector-index methodology are described; revenue is not disclosed", "Official product description", "Obtain fee-bearing AUM, net flows, redemption, and product-level profitability"]
    notes: "Public descriptions establish mechanisms, not recognized revenue, realized pricing, or margin; values with different dates and issuers are not additive."
    claimRefs: [CI001, CI002, CI003, CI005]
  - id: TI002
    title: Pricing and monetization transparency
    columns: [Offering, List or contract signal, Realized pricing, Discount or unknown, Implication]
    rows:
      - [Digital-asset brokerage, "Competitive pricing and liquidity are described for the regulated DPT service", null, "Realized spread, rebates, and customer-level discounts undisclosed", "Cannot estimate revenue per trade"]
      - [Custody and staking, "Institutional-grade custody and staking are offered", null, "Fee schedule and pass-through economics undisclosed", "Cannot estimate gross margin or attach rate"]
      - [B2B API platform, "API access is integrated into partner-bank infrastructure", null, "Implementation fees, recurring fees, and minimums undisclosed", "Partner economics and payback remain unverified"]
      - [Asset management, "Funds, indices, and tokenization products are marketed", null, "Management, performance, distribution, and redemption fees undisclosed", "Fee-bearing AUM and net revenue are unknown"]
    notes: "The assigned evidence contains service descriptions and qualitative pricing language but no public realized-price schedule; nulls are deliberate diligence gaps."
    claimRefs: [CI002, CI003, CI008]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue run rate, ">USD100m in a historical report", "Low; historical third-party report", "Provides scale context but is not current audited revenue or ARR", "Reconcile monthly revenue by product and accounting basis"]
      - [Trading revenue growth, "Exceeded prior-year total by Q3 2024", "Medium; Reuters-republished report", "Suggests momentum but omits base, mix, and profitability", "Obtain quarterly volume, revenue, spread, and contribution margin"]
      - [CAC and payback, null, "Unavailable", "Determines whether institutional growth is capital efficient", "Provide fully loaded acquisition cost, sales cycle, implementation cost, and payback by channel"]
      - [Gross margin, null, "Unavailable", "Separates scalable fee income from custody, compliance, and trading costs", "Provide audited gross-profit bridge by product and entity"]
      - [Cash burn and runway, null, "Unavailable", "Determines financing dependency and next-round trigger", "Provide current cash, monthly burn, liquidity policy, and stress runway"]
    notes: "Unavailable metrics are not estimated from funding, assets, clients, or trading volume; revenue is not ARR and funding raised is not cash available."
    claimRefs: [CI009, CI011, CI013, CI014, CI018]

