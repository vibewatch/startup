    claimRefs: [CI001, CI002, CI003, CI018]

callouts:
  - calloutType: strength
    title: Institutional distribution is visible
    body: "Sygnum has public evidence of bank distribution, regulated entities, and multiple product lines; this is stronger than a pure product narrative, although it does not establish unit economics."
    claimRefs: [CI005, CI007, CI015]
  - calloutType: risk
    title: Financial disclosure is the binding gap
    body: "Current revenue quality, gross margin, cash burn, runway, retention, concentration, and capital-stress data remain unavailable in the assigned public evidence."
    claimRefs: [CI009, CI013, CI014, CI017, CI018]
  - calloutType: recommendation
    title: Underwrite only after private financial diligence
    body: "Use a research-more stance until Sygnum supplies product-level revenue, contribution margin, liquidity, capital adequacy, and cohort evidence."
    claimRefs: [CI017, CI018, CI019]

