company:
  name: Sygnum
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Sygnum is a Swiss-Singapore digital asset banking group built around regulated
    custody, trading, tokenization, asset management, lending, and B2B bank
    infrastructure. Public evidence supports a multi-jurisdiction regulated
    platform and recent institutional expansion, but audited revenue, profitability,
    ownership detail, and customer concentration remain unavailable.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Sygnum presents itself as a global digital asset banking group founded on
      Swiss and Singaporean heritage. Its operating model combines regulated
      banking and capital-markets permissions with institutional digital-asset
      services rather than a retail crypto proposition. The company describes
      services spanning banking, asset management, tokenization, and B2B
      enablement; independent coverage also describes brokerage, staking,
      custody, lending, and tokenization as core operations. The current
      positioning is therefore best understood as regulated infrastructure and
      distribution for professional and institutional users, with partner banks
      extending reach into their existing channels. Public sources support Zurich
      and Singapore as headquarters, while 2023 coverage also reported regulated
      operations in Abu Dhabi and Luxembourg.
      Reported scale varies by date and source, so the snapshot below keeps those
      periods distinct rather than normalizing them into a single current metric.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      Sygnum was founded in 2018 by four founders. Public profiles identify Mathias
      Imbach and Gerald Goh as operating leaders, although their titles vary by
      source date between Group CEO, co-CEO, and Singapore or APAC CEO. The
      available leadership evidence is strongest for those two founders: Imbach brought prior
      investment and Bain experience, while Goh previously worked in alternative
      investments and private-markets advisory. The company also identifies Luka
      Müller as a co-founder and chairman in its leadership description. This
      founder-led structure appears aligned with a regulated, cross-border
      business, but public material does not provide a complete board roster,
      committee structure, succession plan, or fully diluted ownership schedule.
      The 2025 financing report says founders, board members, and employees
      participated and continued to hold a majority, which supports meaningful
      insider alignment but does not establish exact control percentages.
    claimRefs: [CO005, CO006, CO008]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Funding, valuation, and operating scale
    body: >-
      Sygnum completed a January 2025 strategic growth round of US$58 million at
      a valuation above US$1 billion, while its company timeline records a
      US$90 million Series B in January 2022. Reuters reported that the 2025 round
      was backed by Fulgur Ventures and existing and new investors, including
      employees. The funding is capital raised, not
      revenue or cash available for operations, and the sources do not disclose
      the fully diluted cap table or cash balance. Public operating indicators
      include more than 2,000 institutional clients in 70 countries in the 2025
      funding coverage, while earlier 2023 interview coverage reported
      approximately US$4 billion in assets and more than 1,700 clients across
      more than 60 countries. The mismatch is a dated-source issue, not proof of
      an exact growth rate. Reuters reported that trading-product revenue through
      Q3 2024 exceeded the full-year 2023 total but did not disclose an absolute
      amount. Audited revenue, margin, cash flow, net retention,
      customer concentration, and headcount beyond selected company disclosures
      remain diligence gaps.
    claimRefs: [CO004, CO009, CO010, CO012, CO015, CO018]
    tableRefs: [TO003]
  - id: milestones-and-current-footprint
    title: Milestones and current footprint
    body: >-
      The milestone record shows a progression from incorporation and licensing
      into regulated products, partner-bank distribution, and institutional
      infrastructure. Sygnum's own timeline records incorporation in Switzerland
      and Singapore in 2018, a Swiss FINMA banking licence in 2019, a first B2B
      partner in 2021, a US$90 million Series B in 2022, and a Singapore MAS
      Major Payment Institution licence in 2023. The 2025-2026 evidence adds
      unicorn financing and a July 2026 BancaStato integration. These milestones support
      product and distribution progression, but several are company-reported and
      do not substitute for audited financial performance or independent
      verification of every operating metric.
    claimRefs: [CO014, CO015, CO016, CO017, CO018]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Regulatory infrastructure is the core differentiator
    body: >-
      Sygnum has built its identity around banking, payments, and capital-markets
      permissions across multiple jurisdictions, then embedded those capabilities
      in partner-bank channels.
    claimRefs: [CO002, CO014, CO015, CO017]
  - calloutType: risk
    title: Scale is visible but financial quality is not
    body: >-
      Funding, valuation, client counts, and assets are publicly reported, but
      audited revenue, margins, cash flow, concentration, and ownership detail
      remain unresolved.
    claimRefs: [CO004, CO009, CO012]
  - calloutType: recommendation
    title: Underwrite regulated distribution and request private financials
    body: >-
      The next diligence step is to reconcile the dated scale metrics and obtain
      audited financial statements, a current cap table, liquidity data, and
      customer concentration schedules before relying on the valuation.
    claimRefs: [CO004, CO010, CO012]
