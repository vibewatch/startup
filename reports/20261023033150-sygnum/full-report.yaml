              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI018
      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are institutional rather than consumer metrics. A
              Reuters-republished report says trading-product revenues had exceeded the prior year's total by the third
              quarter of 2024, while another report attributes more than 1,000% annual trade volume growth to
              PostFinance and more than 20 bank relationships. Hubbis reports approximately USD4 billion in total
              assets, while a July 2026 company announcement says the B2B network included more than 25 banks and
              international financial institutions. These figures use different dates, definitions, and issuers, so they
              should not be combined into a growth rate. No public source here provides CAC, payback, conversion,
              renewal, churn, attach rate, realized take rate, or sales-cycle data.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI011
              - CI013
              - CI014
              - CI018
      - number: '4.3'
        title: Capital adequacy and cost structure
        blocks:
          - type: paragraph
            body: >-
              Sygnum's financing history shows repeated capital support, but funding raised is not cash available and
              does not establish runway. The January 2025 round was reported as USD58 million at a valuation above USD1
              billion, with proceeds intended for geographic expansion, infrastructure, products, compliance, risk
              management, and resilience. A prior USD40 million round was described as oversubscribed at a USD900
              million post-money valuation, and one source reported more than USD100 million of revenue run rate; that
              figure is historical, is not ARR, and is not a current audited statement. Public materials do not show
              cash, burn, capital ratios, debt maturities, working-capital needs, servicing costs, or capex. Regulatory
              and custody infrastructure should therefore be treated as potentially material fixed-cost and control
              investments, not as evidence of a particular margin.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The business has credible institutional distribution and a regulated operating perimeter: the MAS
              directory identifies Sygnum Pte. Ltd. as a Capital Markets Services licensee and Major Payment
              Institution, while partner reporting describes PostFinance using Sygnum's B2B platform to add
              digital-asset services. Those facts improve the plausibility of enterprise monetization but do not prove
              profitability. The main underwriting limitation is missing financial disclosure: revenue by product and
              geography, realized pricing, gross margin, operating expense, cash and burn, capital adequacy under
              stress, customer and partner concentration, and cohort retention are not established by the assigned
              public evidence. The appropriate stance is research-more: institutional demand is visible, but revenue
              quality, operating leverage, and financing dependency remain unresolved.
            claimRefs:
              - CI015
              - CI017
              - CI018
              - CI019
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional distribution is visible
            body: >-
              Sygnum has public evidence of bank distribution, regulated entities, and multiple product lines; this is
              stronger than a pure product narrative, although it does not establish unit economics.
            calloutType: strength
            claimRefs:
              - CI005
              - CI007
              - CI015
          - type: callout
            title: Financial disclosure is the binding gap
            body: >-
              Current revenue quality, gross margin, cash burn, runway, retention, concentration, and capital-stress
              data remain unavailable in the assigned public evidence.
            calloutType: risk
            claimRefs:
              - CI009
              - CI013
              - CI014
              - CI017
              - CI018
          - type: callout
            title: Underwrite only after private financial diligence
            body: >-
              Use a research-more stance until Sygnum supplies product-level revenue, contribution margin, liquidity,
              capital adequacy, and cohort evidence.
            calloutType: recommendation
            claimRefs:
              - CI017
              - CI018
              - CI019
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Sygnum is best understood as a regulated financial-infrastructure provider rather than a single-purpose
              crypto application. Hubbis describes the operating surface as brokerage, staking, accounts and custody,
              tokenization, asset management, credit and lending, and B2B banking. Sygnum's own service page adds a
              concrete retail-to-institutional workflow: clients can deposit and withdraw every crypto asset supported
              for custody, and the first transfer to an external wallet must pass a proprietary destination-screening
              step. The product therefore combines transaction access with custody and compliance controls. Public
              evidence supports the breadth of the catalog and selected live workflows, but it does not show
              product-level revenue, attach rates, realized customer outcomes or a common maturity standard across every
              module.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
