          Bank network expands and custody, settlement, and tokenization produce audited recurring growth with
          attractive margins
        - >-
          A premium to the 2025 mark becomes discussable only after return math incorporates dilution and a credible
          exit
        - Requires private evidence; public partner momentum is supportive
        - Partner rollout or licence expansion stalls
      - - Base
        - Strategic relevance persists but revenue conversion and digital-asset activity remain uneven
        - Use the >US$1bn 2025 mark as a ceiling for diligence, not a fair-value conclusion; seek protection
        - Most defensible public-evidence case
        - Audited economics do not support the historical mark
      - - Bear
        - >-
          Crypto activity contracts, integrations monetize slowly, regulation tightens, or preferences transfer downside
          to new money
        - A down round or preference-adjusted loss is possible and cannot be bounded publicly
        - Material because the public-market reference fell sharply in 2026
        - Financing reset, licence impairment, capital stress, or network contraction
    notes: >-
      No precise valuation range or target return is shown because Sygnum revenue, cash flow, cap table, preference
      stack, and current financing terms are absent; competitor financing and market-cap figures are non-comparable
      reference points.
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV010
      - CV011
      - CV012
