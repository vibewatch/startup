chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Sygnum presents itself as a global digital asset banking group founded on Swiss and Singaporean heritage.
              Its operating model combines regulated banking and capital-markets permissions with institutional
              digital-asset services rather than a retail crypto proposition. The company describes services spanning
              banking, asset management, tokenization, and B2B enablement; independent coverage also describes
              brokerage, staking, custody, lending, and tokenization as core operations. The current positioning is
              therefore best understood as regulated infrastructure and distribution for professional and institutional
              users, with partner banks extending reach into their existing channels. Public sources support Zurich and
              Singapore as headquarters, while 2023 coverage also reported regulated operations in Abu Dhabi and
              Luxembourg. Reported scale varies by date and source, so the snapshot below keeps those periods distinct
              rather than normalizing them into a single current metric.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO009
              - CO010
              - CO012
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              Sygnum was founded in 2018 by four founders. Public profiles identify Mathias Imbach and Gerald Goh as
              operating leaders, although their titles vary by source date between Group CEO, co-CEO, and Singapore or
              APAC CEO. The available leadership evidence is strongest for those two founders: Imbach brought prior
              investment and Bain experience, while Goh previously worked in alternative investments and private-markets
              advisory. The company also identifies Luka Müller as a co-founder and chairman in its leadership
              description. This founder-led structure appears aligned with a regulated, cross-border business, but
              public material does not provide a complete board roster, committee structure, succession plan, or fully
              diluted ownership schedule. The 2025 financing report says founders, board members, and employees
              participated and continued to hold a majority, which supports meaningful insider alignment but does not
              establish exact control percentages.
            claimRefs:
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO008
      - number: '1.3'
        title: Funding, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Sygnum completed a January 2025 strategic growth round of US$58 million at a valuation above US$1 billion,
              while its company timeline records a US$90 million Series B in January 2022. Reuters reported that the
              2025 round was backed by Fulgur Ventures and existing and new investors, including employees. The funding
              is capital raised, not revenue or cash available for operations, and the sources do not disclose the fully
              diluted cap table or cash balance. Public operating indicators include more than 2,000 institutional
              clients in 70 countries in the 2025 funding coverage, while earlier 2023 interview coverage reported
              approximately US$4 billion in assets and more than 1,700 clients across more than 60 countries. The
              mismatch is a dated-source issue, not proof of an exact growth rate. Reuters reported that trading-product
              revenue through Q3 2024 exceeded the full-year 2023 total but did not disclose an absolute amount. Audited
              revenue, margin, cash flow, net retention, customer concentration, and headcount beyond selected company
              disclosures remain diligence gaps.
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO012
              - CO015
              - CO018
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
