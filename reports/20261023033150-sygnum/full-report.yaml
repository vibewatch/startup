  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is regulated digital-asset financial infrastructure for institutions and qualified
              investors, not the full cryptocurrency economy. Included spend pools are custody and safeguarding,
              execution and brokerage, staking and lending, tokenization and settlement support, and API-based
              enablement for banks and wealth intermediaries. Sygnum's service page also shows that these products
              connect to established payment rails, including SIC, euroSIC, SEPA and SWIFT, rather than replacing every
              part of the incumbent stack. Excluded pools are retail exchange speculation, self-custody software and
              token market capitalization. Those substitutes may compete for users, but their buyers, risk controls and
              economics differ; one independent profile explicitly characterizes bank-level pricing as more expensive
              than exchanges and neobanks.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM014
              - CM016
      - number: '2.2'
        title: Sizing lenses and denominator discipline
        blocks:
          - type: paragraph
            body: >-
              Public estimates illuminate adjacent demand without producing a defensible company TAM. Ripple and BCG
              project tokenized real-world assets to rise from USD 0.6 trillion in 2025 to USD 18.9 trillion in 2033 in
              a midpoint scenario, a 53% compound annual growth rate. That forecast excludes cryptocurrencies, CBDCs,
              China and Russia and measures asset value, not service revenue. Galaxy supplies a different lens: Aave's
              total value locked averaged about USD 57 billion in January 2026 and cumulative lending reached USD 1
              trillion in February. EY-Parthenon and Coinbase provide demand intent rather than spend, with 73% of more
              than 350 institutional respondents planning to increase allocations in 2026. These denominators must
              remain separate.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, users, payers and adoption path
        blocks:
          - type: paragraph
            body: >-
              The direct buyer set includes accredited investors, family offices, investment firms and other
              institutions, while the embedded route targets banks and wealth intermediaries. In the latter route,
              Sygnum's executive describes the institution retaining its client relationship and distribution while
              using Sygnum's product shelf. The BancaStato launch demonstrates the workflow: Sygnum's API connected to
              the bank's Avaloq environment so end clients could trade selected assets inside existing web and mobile
              channels. Sygnum reported more than 25 banks and international financial institutions on the platform. The
              economic payer is therefore segment-specific, but public evidence does not disclose implementation fees,
              custody pricing, transaction take rates or which partner budget owns the purchase.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.4'
        title: Drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption has three visible drivers: institutional allocation intent, regulatory permission for
              professional channels, and integration that avoids a full internal build. Chainalysis also treats
              regulation, inflation and access to financial infrastructure as influences on adoption, while Galaxy
              describes institutional credit moving toward structures with portfolio-level risk management, audited
              protocols and qualified custody. Constraints remain material. Galaxy says existing DeFi lending can be
              capital-intensive and fragmented; CoinDesk cites unclear regulation, missing standardization and market
              fragmentation; and the BCG forecast itself omits major geographies and speculative crypto assets. The
              valuation relevance is therefore a platform-option thesis around regulated distribution, not proof of
              Sygnum's market share. Pricing, conversion, retention, geography and revenue mix are still required to
              translate market activity into enterprise value.
            claimRefs:
              - CM008
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Asset value is not addressable revenue
            body: >-
              The USD 18.9 trillion tokenization forecast is a projected stock of assets under a defined scenario; it is
              not ARR, custody fees, transaction revenue or Sygnum's serviceable market.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: Distribution proof does not establish monetization
            body: >-
              A live bank integration and a company-reported network of more than 25 institutions demonstrate a route to
              market, but public evidence does not reveal activation, volume, retention or unit economics.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and customer alternatives
        blocks:
          - type: paragraph
            body: >-
              Sygnum's relevant competitive set is broader than other crypto banks. Direct peers include regulated
              digital-asset banks such as AMINA and Bitcoin Suisse, while incumbent private banks and large custodians
              can add selected digital-asset capabilities through their existing balance sheets and control
              environments. Adjacent alternatives include specialist custody providers, tokenization platforms, asset
              managers, and infrastructure networks. The status quo for a bank, fund, or corporate is to avoid the
              exposure, keep assets off-chain, or build controls and integrations internally. Sygnum's own fund-facing
              page describes an integrated proposition spanning fiat and crypto accounts, loans, custody, trading, and
              staking under a regulated Swiss-bank framework (SP007), while Hubbis identifies institutional and private
              qualified investors, corporates, banks, and other financial institutions as target users (SP003). Reuters
              reported a $58 million round at a $1 billion valuation in January 2025 and said the service did not cater
              to retail users (SP011). That breadth gives Sygnum more jobs to win, but also creates more operational and
              regulatory surfaces to maintain. The landscape therefore favors providers that can make compliance,
              custody, settlement, and distribution work together rather than providers with only a compelling trading
              interface.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, distribution, and trust differentiation
        blocks:
          - type: paragraph
            body: >-
              Sygnum's differentiation is most credible where the buyer values regulated access and integrated
              workflows. Hubbis reports that Sygnum operates through a Swiss banking licence and Singapore licences and
              describes core operations including brokerage, staking, accounts and custody, tokenisation, asset
              management, credit and lending, and B2B banking (SP003). The official custody page adds a risk-assessment
              funnel for eligible digital assets and support for custody, staking, trading, and lending (SP006). The B2B
              model matters because a partner can distribute services under its own brand instead of recreating
              regulated infrastructure. That is a distribution advantage, but it is not the same as proof of recurring
              revenue or customer retention. Sygnum's tokenization proposition is also more specific than a generic
              blockchain claim: its 2026 Fidelity release says Desygnate supports an on-chain fund registry,
              smart-contract-enabled settlement, stablecoin subscriptions, and 24/7 subscriptions and redemptions
              (SP014). The comparison should consequently distinguish documented capability from unsupported claims
              about scale, pricing, or moat durability.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP010
      - number: '3.3'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Switching costs are likely to be workflow and control costs rather than simple software lock-in. A client
              or partner would need to change custody arrangements, wallet permissions, compliance reviews, settlement
              processes, reporting, and customer-facing integrations. The Swiss Bankers Association's deposit-token
              proof of concept shows the type of ecosystem dependency involved: PostFinance, Sygnum, and UBS tested
              interbank payment and escrow-like exchange of deposit tokens for tokenized assets, but the association
              explicitly says scaling requires additional design adjustments and cooperation (SP017). This is evidence
              of ecosystem participation, not proof that Sygnum owns a closed network. Competitive pressure remains
              material: independent coverage of the $40 million round said Sygnum competes with SEBA Bank and Bitcoin
              Suisse, called the valuation toward the top end of the range, and noted that the commentator lacked full
              revenue information (SP009). The 2025 funding coverage also ties growth to EU/EEA and Hong Kong expansion,
              institutional infrastructure, and Bitcoin products (SP010), which creates execution and regulatory
              dependencies. Sygnum's moat is therefore plausible but conditional on service reliability, partner
              conversion, and evidence that activity remains valuable when trading volumes normalize.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP010
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The strongest edge is regulated integration
            body: >-
              Sygnum's most defensible position is the combination of regulated banking infrastructure, custody,
              tokenization, and partner distribution; individual features are easier for incumbents or specialists to
              replicate.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Scale and economics remain partly unproven
            body: >-
              Public evidence describes capability, funding, and partnerships more clearly than realized pricing,
              retention, customer concentration, or normalized profitability; the competitive thesis should remain
              conditional.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: callout
            title: Underwrite the platform, not the narrative
            body: >-
              Diligence should test partner-level volumes, custody and tokenization revenue, renewal and attach rates,
              service-level performance, and the cost of replacing Sygnum in each workflow.
            calloutType: recommendation
            claimRefs:
              - CP008
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Sygnum's public materials describe several monetizable activities rather than a single software
              subscription: brokerage and trading, custody, staking, accounts, tokenization, asset management, credit
              and lending, and B2B banking. The Singapore business also describes brokerage, securities dealing, fund
              management, corporate-finance advice, and custodial services in the MAS directory. This supports a
              diversified fee and spread model, but the public record does not separate transaction fees, custody fees,
              net interest, lending income, asset-management fees, or B2B platform economics. A reported trading-revenue
              milestone is directional rather than a complete income statement, and official list/service descriptions
              are not realized pricing or gross-margin evidence.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
          - type: table
