        title: Milestones and current footprint
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a progression from incorporation and licensing into regulated products,
              partner-bank distribution, and institutional infrastructure. Sygnum's own timeline records incorporation
              in Switzerland and Singapore in 2018, a Swiss FINMA banking licence in 2019, a first B2B partner in 2021,
