    type: flow
    summary: >-
      Evidence of scale and strategic positioning is offset by commercialization, comparability, and capital-structure
      gaps.
    data:
      nodes:
        - id: financing-mark
          label: 2025 financing mark
          detail: US$58m round at a reported valuation above US$1bn
        - id: operating-proof
          label: Operating proof
          detail: Reported trading momentum, client scale, and bank integrations
        - id: current-distribution
          label: Current distribution
          detail: Company-reported B2B network above 25 institutions in July 2026
        - id: execution-risk
          label: Execution risk
          detail: Monetization remains opaque and ecosystem scaling needs further work
        - id: valuation-gap
          label: Valuation gap
          detail: No audited economics, current cap table, preference stack, or comparable multiple
        - id: decision
          label: Research-more
          detail: Require price-sensitive diligence and downside protection
      edges:
        - from: financing-mark
          to: operating-proof
        - from: operating-proof
          to: current-distribution
        - from: current-distribution
          to: execution-risk
        - from: execution-risk
          to: valuation-gap
        - from: valuation-gap
          to: decision
    approximationNotes: The flow is a decision sequence, not a quantified valuation model or probability estimate.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
