  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative evidence map separating observed obligations and mitigations from likelihoods that remain
      unquantified.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Multi-jurisdiction regulation
          values:
            - label: High / ongoing
              detail: Licensing and MiCA obligations continue after authorization.
            - label: High
              detail: Restrictions could constrain products and distribution.
            - label: Established
              detail: Multiple licences are disclosed, but control testing is not public.
            - label: Medium-high
              detail: Execution spans several regulatory regimes.
        - label: Custody and key security
          values:
            - label: Unknown
              detail: No incident-rate or test-result denominator is public in the pool.
            - label: Critical
              detail: A compromise could affect client assets and licences.
            - label: Disclosed controls
              detail: Hardware, software, governance, audits, and segregation are company-described.
            - label: High uncertainty
              detail: Control effectiveness is not independently evidenced here.
        - label: B2B API availability
          values:
            - label: Unknown
              detail: Automatic execution is disclosed; uptime is not.
            - label: High
              detail: Partner-bank trading depends on integrated services.
            - label: Operating at scale
              detail: The 2024 report relayed 1,000+ daily trades.
            - label: Medium-high
              detail: Recovery and outage evidence is missing.
        - label: Partner concentration
          values:
            - label: Unknown
              detail: No partner-level revenue, asset, or volume shares are public.
            - label: High
              detail: A thesis-critical partner loss could impair distribution.
            - label: 25+ network
              detail: The count indicates breadth, not economic diversification.
            - label: Medium-high
              detail: Concentration cannot be quantified.
        - label: Financial execution
          values:
            - label: Medium
              detail: Expansion and compliance require continuing investment.
            - label: High
              detail: Capital or liquidity pressure could limit regulated growth.
            - label: Fresh funding
              detail: $58 million was raised in January 2025.
            - label: Medium-high
              detail: Current cash, audited margins, and stress outcomes are unavailable.
        - label: Tokenization scaling
          values:
            - label: Documented
              detail: The SBA explicitly says scaling needs further adjustments and cooperation.
            - label: Medium
              detail: Failure would weaken a product-expansion thesis rather than core custody immediately.
            - label: Proof of concept
              detail: Technical and legal feasibility was demonstrated.
            - label: Medium
              detail: Production adoption and governance remain to be proven.
    approximationNotes: >-
      Qualitative categories are evidence-based analyst judgments, not measured probabilities; unknown values remain
      unknown rather than being scored as low risk.
    claimRefs:
