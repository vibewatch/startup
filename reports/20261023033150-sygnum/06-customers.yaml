company:
  name: Sygnum
chapter:
  number: 6
  title: Customers
  summary: Sygnum's public customer evidence points to an institutional, private-bank, family-office, and accredited-investor model rather than retail distribution. Named partnerships show real channel and product adoption, but public sources do not disclose renewal, churn, net retention, or customer concentration metrics.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Sygnum addresses several related but distinct customer groups. Its private-client surface targets private clients and family offices, while the company's institutional proposition also covers institutional investors, corporates, banks, and other financial institutions. The operating model separates direct users from channel customers: a bank or platform can use Sygnum's B2B infrastructure while retaining the end-customer relationship. The evidence therefore supports a regulated institutional and qualified-investor segment strategy, not a mass-retail one. Preqin describes service reach across high-net-worth individuals, institutional investors, and corporate clients in more than 80 countries, while Hubbis reports more than 1,700 clients in over 60 countries at the time of its interview. These counts use different dates and denominators and should not be combined. Sygnum's own page says clients must be onboarded before trading, and its Singapore licensing discussion explicitly excludes retail access. The commercial implication is potentially high wallet depth per account, but onboarding friction and accreditation requirements narrow the addressable customer pool.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
    tableRefs: [TU001]
  - id: adoption-and-trajectory
    title: Adoption signals and durability
    body: >-
      Public evidence shows adoption through clients, regulated distribution partners, and product access rather than through a disclosed recurring-revenue cohort. Hubbis reports approximately USD4 billion in total assets and more than 1,700 clients in over 60 countries, and describes Sygnum's B2B platform as enabling more than 15 banks and international financial institutions. FinanceFeeds provides a concrete channel example: PostFinance integrated Sygnum's B2B platform so its customers could access cryptocurrencies and future services such as staking. A separate Moomoo announcement describes distribution of Sygnum's Digital Asset Multi-Manager Fund to accredited investors via relationship managers, with Moomoo serving over 1 million Singapore users. These are meaningful adoption and distribution signals, but they do not establish active users, conversion, utilization, repeat purchase, renewal, or revenue contribution. The public record also lacks a consistent cohort time series, so durability remains an unresolved underwriting question rather than a demonstrated strength.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named deployments, expansion, and concentration
    body: >-
      Named customer proof is strongest where a counterparty identifies a concrete deployment or distribution use case. PostFinance uses the B2B platform to offer regulated digital-asset services to its customers; Bordier & Cie was described by Hubbis as Sygnum Singapore's first B2B partner bank after the Singapore approval; and Moomoo distributed the DAMMF to accredited investors. FinanceFeeds also identifies Bison Digital Assets as powered by Sygnum's B2B platform. These examples demonstrate channel-enabled expansion across a Swiss retail bank, a private-bank relationship, a digital-investment platform, and a bank-owned virtual-asset subsidiary. They do not prove that each relationship is still active at the run date, nor do they disclose contract length, fees, renewal, customer-level assets, or concentration. Sygnum's multi-service platform may create expansion opportunities across custody, trading, staking, lending, tokenization, and asset management, but attach rates and the share of revenue from any counterparty are not public. Concentration diligence should therefore focus on the largest direct and B2B accounts, partner dependency, and migration or renewal evidence.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: diligence-conclusion
    title: Customer-quality judgment
    body: >-
      The customer evidence is credible enough to establish institutional demand and several real distribution pathways, but not enough to underwrite durable net retention or low concentration. Independent and partner-reported evidence corroborates named relationships, while company pages describe the product breadth and onboarding mechanics. The strongest positive signal is the repeated use of Sygnum as regulated infrastructure by banks and investment platforms, which can lower direct customer-acquisition cost and expand reach. The principal limitation is measurement: disclosed client and asset counts are point-in-time or publication-specific, and no public source in this pool supplies churn, GRR, NRR, renewal rates, cohort retention, average revenue per account, or top-customer share. Investors should treat adoption as demonstrated but durability as unproven. A current data room should reconcile direct versus channel accounts, active versus onboarded clients, assets under custody versus assets managed, and customer-level economics before assigning a higher customer-quality score.
    claimRefs: [CU005, CU006, CU014]
    figureRefs: [FU001]
