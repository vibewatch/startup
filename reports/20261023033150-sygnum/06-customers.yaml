    type: journey-map
    summary: Sygnum's public customer path runs from qualified onboarding through regulated product use and partner-led expansion.
    data:
      items:
        - label: "1. Qualified onboarding"
          title: "Institutional, private-client, or accredited-investor eligibility"
          touchpoints: ["KYC and onboarding", "Accreditation or institutional qualification"]
          note: "Retail access is excluded in the cited Singapore discussion."
        - label: "2. Regulated access"
          title: "Banking platform and custody"
          touchpoints: ["Swiss banking framework", "Digital-asset custody", "E-banking or API access"]
          note: "Access requires becoming a Sygnum client."
        - label: "3. Core usage"
          title: "Trade, stake, lend, or manage assets"
          touchpoints: ["Trading", "Staking", "Lending", "Asset management"]
          note: "Public sources do not disclose utilization by product."
        - label: "4. Product expansion"
          title: "Tokenization and additional services"
          touchpoints: ["Tokenization", "Additional supported assets", "Portfolio diversification"]
          note: "Attach rates and cross-sell are not public."
        - label: "5. Channel distribution"
          title: "Banks and platforms reach end customers"
          touchpoints: ["PostFinance", "Bordier", "Moomoo"]
          note: "Partner relationships provide named expansion evidence."
        - label: "6. Durability test"
          title: "Renewal, repeat use, and concentration"
          touchpoints: ["Renewal", "Active utilization", "Customer concentration"]
          note: "No public cohort or retention metrics were found in the assigned evidence."
    approximationNotes: "Conceptual sequence only; stages do not imply measured conversion rates or elapsed time."
    claimRefs: [CU004, CU007, CU008, CU012, CU013, CU015]
