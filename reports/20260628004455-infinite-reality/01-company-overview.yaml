callouts:
  - calloutType: risk
    title: "$3 Billion Fundraise Collapse and Active Federal Scrutiny"
    body: >-
      The centerpiece capital event announced in January 2025—a $3 billion raise from an anonymous private
      investor—was publicly abandoned by the company in November 2025. The CEO described the company as a
      victim of misconduct, and the SEC and DOJ have open investigations. This calls into question the
      integrity of all prior valuation claims and creates material going-concern risk.
    claimRefs:
      - CO018
      - CO022
      - CO023
      - CO024

  - calloutType: risk
    title: "Key-Person Risk and Unverified CEO Credentials"
    body: >-
      John Acunto controls all strategic, capital, and M&A decisions. Forbes could not verify his claimed
      doctorate (University of Florida) or master's degree (Harvard). His prior businesses generated lawsuits
      in at least six states for unpaid bills, two of which were settled in 2025 for $1.18 million combined.
      This profile creates existential key-person and reputational risk for the company.
    claimRefs:
      - CO002
      - CO033
      - CO034

  - calloutType: insight
    title: "All-Stock Acquisition Strategy Creates Self-Referential Valuation"
    body: >-
      Virtually every acquisition (DRL, LandVault, Ethereal Engine, ReKTGlobal, Napster, Touchcast) was
      executed in all-stock, priced at the company's own self-reported valuation at the time. Each deal
      therefore simultaneously served as a new valuation benchmark without any independent cash-market
      evidence. Named institutional investors (RSE Ventures, Lux Capital, etc.) entered as iR shareholders
      through their pre-existing DRL stakes, not through direct investment.
    claimRefs:
      - CO015
      - CO016
      - CO036
      - CO035

