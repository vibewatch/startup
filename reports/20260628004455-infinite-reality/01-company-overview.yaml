  - id: leadership-governance
    title: Leadership, Founders, and Governance
    body: >-
      Infinite Reality has four co-founders. John Acunto (CEO) is the public face of the company and its most
      prominent spokesperson; Forbes reporting raised questions about fabricated academic credentials (a claimed
      doctorate from the University of Florida and a master's degree from Harvard, neither confirmed by the
      respective universities) and a history of unpaid-vendor lawsuits in at least six states. Rodric David serves
      as President and Co-Founder. Amish Shah is Co-Founder and Chief Business Officer, frequently cited in
      acquisition announcements. Sean Cross is Co-Founder and President of Sales and Business Development (Americas).

      The company expanded its executive bench with notable hires from established tech and gaming firms in 2024:
      Brian Chu (Chief Product Officer, former Epic Games Director overseeing Fortnite and Rocket League) and
      Danielle Korins (Chief Human Resources Officer, former Fortune 500 HR executive) joined in September 2024.
      Nicholas Horbaczewski, founder of the Drone Racing League, became Global President following the DRL
      acquisition. Rachel Jacobson (former DRL President) became Chief Revenue Officer and President of Business
      Ventures. Jon Vlassopulos, CEO of Napster and former VP Global Head of Music at Roblox, assumed a broader
      iR role after the Napster acquisition.

      A material governance risk is extreme key-person concentration in John Acunto, who drove all major capital
      raises, acquisition decisions, and strategic pivots. Board composition is not publicly disclosed; no
      independent director names have been confirmed in media reporting. CFO Brian Effrain and CLO Jennifer Pepin
      both departed the company in September 2025, increasing governance fragility at a critical period for the
      SEC and DOJ investigations.
