  - id: milestones-timeline
    title: Corporate Milestones and Chronological History
    body: >-
      Infinite Reality's corporate history spans seven years of continuous M&A-driven transformation. The company
      originated from the 2019 acquisition of Tsu, a bankrupt peer-to-peer social media platform, which was
      renamed Display Social. From 2022 onward, Acunto leveraged all-stock acquisitions priced at ever-increasing
      self-reported valuations to build out a diversified immersive technology portfolio: Thunder Studios (Hollywood
      production, January 2022), ReKTGlobal esports (July 2022), Ethereal Engine 3D web engine (February 2024),
      Stakes social sports (April 2024), Drone Racing League (April 2024), LandVault metaverse infrastructure
      (July 2024), Napster music brand (March 2025), and Touchcast agentic AI (April 2025). The Touchcast deal
      was announced while the $3 billion investor was still being represented as genuine.

      Adverse events have accelerated. Two SPAC go-public attempts failed (December 2022 and 2024). The Forbes
      investigation published in April 2025 raised systemic questions about credentials, funding, and partner
      claims. The $3 billion raise collapsed in November 2025, followed by significant layoffs and C-suite
      departures. Napster's music streaming service was abruptly shut down in January 2026, alienating subscribers
      and leaving performance-rights obligations unresolved. The SEC and DOJ investigations remain ongoing as of
      the report run date.
