  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: >-
        Net Revenue Retention (NRR), Gross Revenue Retention (GRR), average contract length, and cohort-level
        churn data for iR Enterprise (LandVault) and iR Studio product lines.
      whyItMatters: >-
        Without NRR/GRR data, it is impossible to determine whether iR's enterprise customer relationships are
        expanding or contracting. For a company anchoring its $15.5B valuation on recurring SaaS revenues, the
        absence of this data is the most critical diligence gap in the customer chapter.
      diligencePath: >-
        Request management presentation with NRR/GRR by product line; obtain customer reference calls from
        independently sourced enterprise clients not listed on the company's own website.
      relatedQuestionRefs:
        - QU004

    - type: private-evidence-only
      severity: material
      topic: google-cloud-partnership
      missingEvidence: >-
        The commercial terms of the 5-year Google Cloud partnership — specifically whether Google Cloud pays iR
        for platform services or iR pays Google for cloud infrastructure, and whether the partnership generates
        third-party enterprise customer revenue for iR.
      whyItMatters: >-
        If the Google Cloud deal is a standard cloud-services contract (iR buys cloud compute at scale), it is
        an infrastructure cost rather than a revenue relationship. Forbes reporting raised questions about whether
        Google considered iR an ordinary cloud customer; this materially affects iR's enterprise partnership
        narrative.
      diligencePath: >-
        Obtain the Google Cloud partnership term sheet or independent confirmation from a Google spokesperson;
        request iR's cloud-cost as a percentage of revenue as a corroborating proxy.
      relatedQuestionRefs:
        - QU007

    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: >-
        Revenue breakdown by subsidiary (iR Studio, DRL, Thunder Studios, Obsess, LandVault/iR Enterprise,
        Napster AI, TalentX) and by revenue type (recurring SaaS vs. one-time project services vs. sponsorships
        vs. media rights).
      whyItMatters: >-
        Without segment-level revenue data, it is impossible to determine whether iR's customer base is
        concentrated in a handful of large projects or distributed across a durable recurring subscription base.
        The $75M self-reported 2024 revenue figure is meaningless without a breakdown.
      diligencePath: >-
        Request audited or management-reported revenue schedule by subsidiary; push for at least a high-level
        split between services/project revenue and recurring subscriptions.
      relatedQuestionRefs:
        - QU022

    - type: enumeration-incomplete
      severity: minor
      topic: ir-studio-customers
      missingEvidence: >-
        A named customer list or even an aggregated count for iR Studio self-serve users, including churn,
        activation rate, and average revenue per user (ARPU).
      whyItMatters: >-
        iR positions iR Studio as the democratization play that extends Obsess/LandVault enterprise technology
        to the SMB market. Without any adoption signal, the self-serve tier thesis is unverifiable.
      diligencePath: >-
        Request iR Studio customer count and trial-to-paid conversion rate; check for emerging reviews on G2
        or Capterra quarterly; request case studies from SMB customers.
      relatedTableRefs:
        - TU001

    - type: stale
      severity: minor
      topic: enterprise-client-post-fraud
      missingEvidence: >-
        Confirmation of enterprise client relationship status (Mastercard, Heineken, Warner Bros. Discovery,
        Vodafone, UAE Ministry of Finance) following the November 2025 fraud announcement and June 2026 SEC/DOJ
        charges.
      whyItMatters: >-
        Enterprise procurement risk programs frequently trigger hold or review of vendor relationships under
        active regulatory investigation. The absence of any named client confirming continued engagement
        post-fraud creates a meaningful unknown about near-term revenue durability.
      diligencePath: >-
        Contact named enterprise clients directly; track public procurement databases (especially for UAE
        government contracts); monitor for iR/Napster press releases naming new engagements with existing
        clients post-June 2026.

    - type: missing-source
      severity: material
      topic: active-enterprise-client-count
      missingEvidence: >-
        A verified total count of active paying enterprise customers across iR Enterprise (LandVault), iR Studio,
        Obsess, and Napster AI product lines as of mid-2026. The "200+ LandVault clients" and "400+ Obsess
        brands" figures predate the acquisitions; no post-integration count has been publicly disclosed.
      whyItMatters: >-
        Without a current active-client count, it is impossible to size iR's revenue base or assess how
        effectively the company has retained the pre-acquisition client rosters of its acquired subsidiaries.
        The total could be anywhere from 100 to 600+ unique clients with significant overlap.
      diligencePath: >-
        Request a current active-account list (even anonymized by vertical and ARR tier) from management;
        cross-check the iR Studio product listing on G2 and Capterra for review counts that proxy user adoption.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: metaverse-spending-pullback
      missingEvidence: >-
        Public evidence of brand customers reducing or cancelling immersive experience spending with Obsess
        or LandVault in 2024–2026 in response to broader metaverse fatigue and tightened brand marketing budgets.
      whyItMatters: >-
        Post-2023 metaverse spending pullbacks by retail brands were widely reported; if iR's Obsess portfolio
        has experienced elevated churn in this environment, the 400+ brand claim may overstate current
        engagement. No churn or cancellation data has been publicly disclosed.
      diligencePath: >-
        Interview former LandVault/Obsess clients; check for case study removals from iR/Obsess websites;
        request cohort retention data by year of first engagement.
      relatedQuestionRefs:
        - QU025

    - type: missing-source
      severity: minor
      topic: geographic-concentration
      missingEvidence: >-
        A breakdown of iR's enterprise customer base by geography — particularly the share derived from US/
        North America vs. MENA (UAE government contracts) vs. Europe vs. APAC — including DRL's geographic
        sponsorship revenue distribution.
      whyItMatters: >-
        iR's MENA government-client exposure (UAE Ministry of Finance) and DRL's international broadcast
        footprint suggest geographic diversification, but the actual revenue or client-count distribution
        has not been disclosed. Concentration in a single region or currency could amplify macro shocks.
      diligencePath: >-
        Request management's geographic revenue or client breakdown; review DRL broadcast rights agreements
        for geographic sponsorship tier distribution; obtain UAE government procurement contract details.
      relatedQuestionRefs:
        - QU026

    - type: missing-source
      severity: minor
      topic: drl-audience-demographics
      missingEvidence: >-
        A verified demographic breakdown of DRL's claimed ~100 million global fan audience by geography,
        age cohort, gender, and media platform (linear TV, streaming, YouTube, social), including sponsor
        demographic alignment data.
      whyItMatters: >-
        The quality of DRL's sponsor relationships depends on audience demographics matching target advertiser
        segments (e.g., T-Mobile targets 25–40 tech adopters; U.S. Air Force targets 18–25 recruits). Without
        a verified audience profile, the $250M DRL acquisition's strategic rationale for sponsor revenue
        durability cannot be independently assessed.
      diligencePath: >-
        Obtain DRL's media-kit audience research or third-party Nielsen/Comscore sponsorship valuation;
        review publicly available DRL broadcast ratings and YouTube analytics.
      relatedQuestionRefs:
        - QU027

