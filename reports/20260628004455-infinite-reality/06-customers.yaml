company:
  name: Infinite Reality

chapter:
  number: 6
  title: Customers
  summary: >-
    Infinite Reality's customer base is broad in brand names but thin in independent validation: the company
    counts Heineken, Warner Bros. Discovery, Mastercard, e.l.f. Cosmetics, Crate & Barrel, the UAE Ministry
    of Finance, and six-plus DRL blue-chip sponsors as verified named deployments via acquired subsidiaries
    LandVault and Obsess, while claiming 150 million consumer interactions across ~500 immersive experiences
    as of April 2025. Retention metrics — NRR, GRR, churn rate, and contract length — are entirely undisclosed
    for enterprise SaaS and services customers, the Napster streaming subscriber base was completely wiped in
    January 2026 when the service shut down abruptly, and iR Studio's self-serve tier shows zero third-party
    user reviews. The Charles Cole fraud scandal and ongoing SEC/DOJ investigation materially increase
    enterprise customer attrition risk.

sections:
  - id: customer-segments-overview
    title: Customer Base Segmentation and Ecosystem Overview
    body: >-
      Infinite Reality's customer ecosystem is best understood as a portfolio of inherited client bases rather than
      a single organically built customer list. Through its acquisition program — LandVault ($450M, July 2024),
      Obsess ($207M terms undisclosed, January 2025), and the Drone Racing League ($250M, April 2024) — iR absorbed
      hundreds of enterprise brand relationships simultaneously rather than winning them individually.

      The enterprise brand segment is the most prominent: retail and fashion brands including Crate & Barrel,
      e.l.f. Cosmetics, L'Oréal, J.Crew, Ralph Lauren, Benefit, Disney Music Group, and Swarovski have all used
      platforms now under iR's umbrella to build 3D virtual stores or immersive brand activations. Consumer goods
      names such as Heineken and Hershey, financial institutions including Mastercard and Standard Chartered, and
      media companies such as Warner Bros. Discovery and Universal Music Group round out the core enterprise brand
      segment. Government and public-sector clients, led by the UAE Ministry of Finance and the Abu Dhabi
      government, represent a distinct geography-specific segment pursued primarily through LandVault's MENA
      operations.

      The sports/media/entertainment segment is anchored by the Drone Racing League's existing sponsor and
      broadcast ecosystem, which included T-Mobile, the U.S. Air Force, Vodafone (via Pairpoint), WarnerMedia,
      and Universal Music Group as named partners at acquisition. A nascent enterprise AI segment emerged in late
      2025 through the Napster Spaces and agentic AI product line, with Cooper Parry (a UK accountancy firm) as
      the first publicly disclosed pilot customer via the Microsoft Azure Agentic AI partnership. The self-serve
      SMB/creator tier is served by iR Studio, a no-code/low-code SaaS platform priced from $49/month, though
      no published customer count or revenue contribution has been disclosed for this channel as of mid-2026.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
