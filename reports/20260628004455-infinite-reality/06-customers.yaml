callouts:
  - calloutType: strength
    title: Acquisition-Assembled Blue-Chip Brand Portfolio
    body: >-
      Through LandVault and Obsess, iR inherited a genuinely prestigious customer roster — Heineken's Cannes
      Lion-winning campaign, Warner Bros. Discovery Sports, Mastercard, Crate & Barrel, and the UAE Ministry
      of Finance — that most purpose-built immersive-tech startups could not have assembled organically in the
      same timeframe. The Heineken-LandVault campaign is the strongest independently validated proof point in
      the portfolio, providing creative-industry corroboration that the technology can deliver premium-brand-quality
      outcomes.
    claimRefs:
      - CU014
      - CU022

  - calloutType: risk
    title: Retention Infrastructure Is Essentially Absent
    body: >-
      iR discloses no NRR, GRR, churn rate, contract length, or renewal data for any product segment. The only
      quantified retention event in the observable record is entirely negative: the complete elimination of
      Napster's streaming subscriber base in January 2026. For a company with a $15.5 billion claimed valuation
      anchored on recurring-revenue SaaS narratives, the total absence of retention proof is the most structurally
      significant gap in the customer evidence base.
    claimRefs:
      - CU023
      - CU024
      - CU040

  - calloutType: risk
    title: SEC/DOJ Investigation Introduces Enterprise Procurement Risk
    body: >-
      The SEC civil complaint (Case No. 1:26-cv-4945, filed June 11, 2026) and parallel DOJ criminal charges
      against Charles Cole for securities fraud, wire fraud conspiracy, and deception of Infinite Reality/Napster
      establish that the company's capital base was fraudulently constructed. Enterprise procurement officers at
      named brand clients and government agencies have access to this information; several Fortune 500 brands
      operate strict third-party risk programs that would flag a vendor under active SEC investigation. Near-term
      contract renewals represent an elevated execution risk.
    claimRefs:
      - CU032
      - CU033

  - calloutType: insight
    title: Napster Streaming Shutdown as a Leading Indicator of Platform Pivot Risk
    body: >-
      The abrupt elimination of Napster's music streaming service — with zero advance notice to active subscribers,
      unresolved artist payment obligations, and outstanding performance-rights organization claims — is the most
      observable expression of iR's willingness to abandon customer cohorts in service of strategic pivots. This
      pattern, if repeated in the enterprise immersive-commerce segment, would represent a material customer-attrition
      risk for brands that have invested in integration with iR's platform (Shopify, SAP, Salesforce Commerce Cloud
      connectors). Diligence should assess whether enterprise contracts include platform-continuity provisions.
    claimRefs:
      - CU024
      - CU026
      - CU027

