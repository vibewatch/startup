  - id: channel-partner-reach
    title: Channel, Partner, and Distribution Reach
    body: >-
      iR's distribution surface spans six distinct channels: direct enterprise sales (iR Enterprise services
      serving Fortune 500 and government clients), self-serve SaaS (iR Studio for SMBs and creators), third-party
      platform distribution (Roblox-deployed experiences via Obsess), sports broadcast (DRL's 320-million-household
      network and streaming agreements), influencer-led brand deals (TalentX's 200M+ follower creator network
      facilitating brand campaign placements), and enterprise AI reseller/consultancy partners (Microsoft partner
      channel, as illustrated by the Leading Results consultancy that delivered the Cooper Parry pilot).

      The Microsoft Azure Agentic AI partnership, announced November 2025, represents the most credible validation
      of iR's enterprise AI distribution strategy: Napster was positioned as "among the first Microsoft partners" to
      deploy Azure Agentic AI for enterprise customers, with Microsoft's regional GM Myladie Stoumbou quoted directly
      endorsing the partnership. This partner-channel position — combining proprietary AI personas with Azure's
      enterprise compliance and global infrastructure — is the sharpest articulation of iR's land-and-expand thesis
      for the Napster AI product line. However, only a single named commercial pilot (Cooper Parry) has been publicly
      confirmed in this channel, and the commercial conversion rate from pilot to recurring contract is unknown.

      TalentX's influencer network, while described as representing creators with 200+ million combined followers,
      has not been independently verified, and no disclosure of active creator count, deal flow, or revenue
      contribution has been made. DRL's broadcast footprint reaches an estimated 320 million global households via
      sports network distribution deals, making it the highest-reach distribution asset in iR's portfolio —
      but whether that audience translates to enterprise sponsorship revenue durably is untested post-acquisition.
    claimRefs:
      - CU035
      - CU036
      - CU037
      - CU039
      - CU040

