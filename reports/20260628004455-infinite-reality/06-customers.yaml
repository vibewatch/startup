figures:
  - id: FU001
    title: Infinite Reality Customer Journey — Acquisition Stages and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      Five-stage customer journey from brand discovery through enterprise expansion, mapped across iR's three primary
      customer tiers (enterprise brand, sports/media, and enterprise AI), highlighting where the funnel thins and
      evidence weakens.
    data:
      items:
        - stage: discover
          label: "Primary discovery channels"
          detail: "Press coverage of $3B raise and acquisitions; DRL broadcast reach of 320M households; TalentX 200M+ creator following; GITEX Global 2024 showcase"
        - stage: evaluate
          label: "Proof points presented"
          detail: "Obsess 400+ brand deployments; LandVault Cannes Lion (Heineken); iR case study metrics (75% conversion uplift); Featured Customers 4.8/5 composite"
        - stage: pilot
          label: "Pilot conversion gap"
          detail: "Friction: 2–3 month enterprise launch timeline (Obsess CEO cited); high-touch production process; unclear SMB self-serve pipeline from iR Studio"
        - stage: deploy
          label: "Production evidence"
          detail: "Crate & Barrel, e.l.f., UAE Ministry of Finance, FIM SGP-VERSE confirmed production; Cooper Parry pilot confirmed but not yet at production scale"
        - stage: expand
          label: "Expansion evidence gap"
          detail: "No NRR/GRR, contract renewal data, or multi-year expansion evidence publicly disclosed; fraud scandal introduces renewal-decision risk for enterprise clients"
    approximationNotes: >-
      Stage boundaries are inferred from public case studies and iR product descriptions; no conversion-rate
      or pipeline-velocity data has been publicly disclosed by iR. The model represents the intended journey,
      not confirmed funnel metrics.
