  - id: named-customer-deployments
    title: Named Customer Proof — Deployments, Outcomes, and Evidence Quality
    body: >-
      iR's best-evidenced named deployments span five verticals: consumer goods (Heineken's Cannes Lion-winning
      virtual bar campaign via LandVault and Dentsu in Decentraland), media/sports (Warner Bros. Discovery Sports'
      FIM SGP-VERSE interactive speedway app, described as the world's first fully immersive speedway experience),
      retail/beauty (e.l.f. Cosmetics' gamified virtual loyalty lounge via Obsess, cited as a flagship gamification
      case study), home goods (Crate & Barrel immersive 3D store via Obsess), and government/public sector (UAE
      Ministry of Finance digital twins for training and safety demonstrations via LandVault).

      Enterprise AI deployments are nascent. The most specific named pilot is Cooper Parry, a UK accountancy firm
      described as a "rebel of accountancy," which partnered with the consultancy Leading Results to deploy
      Napster's AI coaching platform powered by Microsoft Azure OpenAI. Cooper Parry employees — including Claire
      Davis (Head of Performance, Growth & Excellence) and Sarah Holland (Lead Coach) — are quoted by name in
      Napster's November 2025 press release, representing the clearest independent customer voice in iR's public
      record. A second pilot customer — a major paints-and-coatings manufacturer operating in Mexico and 70+
      countries — is mentioned in Napster's September 2025 Azure AI Foundry announcement but not named publicly.

      The aggregate signal from the Featured Customers B2B review aggregator — 17 case studies and a 4.8/5.0
      composite score across 573 reference ratings — is directionally positive but methodologically weak: the
      platform compiles vendor-submitted references rather than independently sourced reviews, and the ratings may
      reflect pre-iR acquisition performance by Obsess, LandVault, and DRL rather than iR-orchestrated deployments.
      iR Studio itself, the company's primary SaaS self-serve product for SMB customers, has zero published user
      reviews on SourceForge and no meaningful G2 or Capterra presence as of mid-2026.
    claimRefs:
