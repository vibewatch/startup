  - id: retention-durability-churn
    title: Retention, Durability, and Churn Signals
    body: >-
      Retention transparency at iR is critically poor. No net revenue retention (NRR), gross revenue retention
      (GRR), churn rate, average contract length, or customer cohort data has been publicly disclosed for any of
      the company's SaaS or enterprise service segments. For a company that describes itself as a recurring-revenue
      platform business and has cited a $15.5 billion valuation, this absence of standard SaaS retention metrics
      is a material due-diligence gap.

      The most observable retention event in the period is negative: the abrupt shutdown of Napster's music
      streaming service on January 3, 2026. Active subscribers lost access mid-session, with Napster's splash
      screen announcing "Napster is no longer a music streaming service." Playlist export was available only via
      a third-party tool (TuneMyMusic), deployed after service termination rather than in advance. Multiple
      subscribers with 14+ years on the platform publicly stated they had already migrated to competitors — notably
      Tidal — months earlier, after Napster stopped paying artists and artists began withdrawing catalogs. Performance
      rights organizations had outstanding non-payment allegations at shutdown; those obligations remain unresolved.

      The Google Cloud 5-year deal (January 2025) and Microsoft Azure multi-year partnership (November 2025) represent
      binding infrastructure commitments that function as de facto retention anchors on iR's side — but they are
      partnership agreements with technology vendors, not evidence of enterprise brand customer retention. iR Studio's
      absence from major third-party review platforms (G2, Capterra, Trustpilot) after its 2025 launch indicates
      either very limited self-serve adoption or insufficient time for review-platform presence to develop.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
