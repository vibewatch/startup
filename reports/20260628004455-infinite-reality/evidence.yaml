evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Audited financial statements or independently verified revenue figures for Infinite Reality / Napster Corp. for FY
      2024 and FY 2025.
    whyItMatters: >-
      The $75M revenue claim (2024) is company-reported with no independent audit; the entire valuation and investment
      thesis depends on financial credibility that cannot be established without verified financials.
    diligencePath: >-
      Request audited financial statements directly from management; obtain copies from any investor rights to audit;
      review any SEC filings or court-submitted financial records in pending litigation.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Names of board members, independent directors, and details of governance structure including any audit or
      compensation committee.
    whyItMatters: >-
      Without knowing the board composition, it is impossible to assess whether adequate oversight exists over
      management decisions, capital allocation, or the CEO's behavior; this is especially critical given active SEC/DOJ
      investigations.
    diligencePath: >-
      Request corporate governance documents from the company; review any SEC filings or court filings that name
      directors; check Delaware or Florida corporate registrations.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-breakdown
    missingEvidence: >-
      Revenue breakdown by subsidiary or product line: iR Studio SaaS ARR, DRL media/sponsorship revenue, Thunder
      Studios production revenue, Napster legacy and AI revenue.
    whyItMatters: >-
      Without a segment breakdown, it is impossible to assess which, if any, parts of the business are generating
      sustainable organic revenue versus short-term acquired revenue that may decline post-integration.
    diligencePath: >-
      Request management accounts or CIM with revenue by business unit; review any pitch deck materials; examine
      acquired-company filings from before acquisition.
    relatedQuestionRefs:
