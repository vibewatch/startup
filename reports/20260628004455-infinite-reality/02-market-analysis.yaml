  - id: growth-drivers
    title: "Growth Drivers and Market Catalysts"
    body: >
      Five structural forces are compressing the adoption cycle for immersive platforms.

      AI-driven content creation: Obsess reported that generative AI has cut initial virtual store concepting time by half; the broader expectation is that AI will eventually automate the full 3D store design-to-launch pipeline, reducing the current 2–3 month project lead time to days. This directly addresses the highest-friction barrier in enterprise deployment.

      5G and edge computing: Ultra-low latency removes the millisecond latency barriers that make live-event XR impractical at scale. Factory floors, surgical suites, and sports venues are the primary beneficiaries. XR hardware on edge-compute backends enables real-time 60fps experiences on lightweight clients.

      Hardware diversification: Smart glasses now represent approximately half of all XR device shipments—up from 25% in 2024—expanding the accessible consumer device base beyond heavy headsets. This widens the addressable audience for iR's web-based 3D experiences without requiring Meta Quest or Apple Vision Pro ownership.

      Enterprise ROI validation: VR learners complete training 4× faster with 275% higher confidence to act (PwC), Boeing reported 25% faster wire harness assembly using AR guidance, and Walmart cut one training module from eight hours to fifteen minutes. These case studies establish budget justification templates that accelerate downstream sales cycles. More than 50% of enterprise XR deployers plan to expand usage within 12–24 months.

      EaaS model emergence: The immersive entertainment and platform market is shifting toward subscription and Experience-as-a-Service revenue structures, with sponsorship and brand partnerships within immersive entertainment growing at 12.34% CAGR through 2031. This structural shift supports recurring revenue for platforms like iR rather than episodic project fees.
