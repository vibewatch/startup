  - id: sizing-gaps
    title: "Sizing Diligence Gaps and Contradictory Estimates"
    body: >
      Three material gaps limit the precision of any market analysis for iR. First, analyst definitions of 'XR market' span a 30× range in 2026—from $10.64B (Mordor Intelligence, narrow platform software) to $346B (Fortune Business Insights, broad immersive ecosystem including hardware and infrastructure)—driven by inconsistent inclusion of hardware, content, infrastructure, and adjacent enabling-technology layers. A TAM cited without a precise scope definition is analytically unreliable for iR valuation purposes.

      Second, iR does not disclose revenue, ARR, or pricing data, making it impossible to validate market penetration or reverse-engineer a bottom-up SAM from customer economics. The 150M consumer interaction milestone, while notable, is an engagement metric rather than a revenue figure, and the company's all-stock acquisition strategy means portfolio pricing is further obscured.

      Third, the addressable market categories iR straddles (immersive entertainment, virtual commerce, enterprise spatial computing, and sports fan engagement) are each tracked by different analysts under different methodologies. Combining them requires assumptions about iR's revenue share within each segment—assumptions that cannot be validated without financial disclosure. The $0.7B immersive sports viewing market is a useful bound for one vertical but significantly understates the full fan-experience opportunity when sponsorship revenue, brand activations, and gamification monetization are included.
