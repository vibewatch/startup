  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gaps
      missingEvidence: "iR's disclosed revenue, ARR, average contract value, and client count per segment needed to construct a bottom-up SAM and validate market penetration claims."
      whyItMatters: "Without financial disclosure, the SAM/SOM estimates in this chapter remain analytical proxies; iR's $15.5B self-declared valuation cannot be validated against revenue metrics."
      diligencePath: "Request audited financials, cohort ARR data, and segment-level revenue breakdown through a formal due-diligence data room; cross-reference against Obsess and Landvault portfolio disclosed figures where available."
      relatedQuestionRefs:
        - QM027

    - type: missing-source
      severity: material
      topic: enterprise-adoption
      missingEvidence: "Independent audit or third-party verification of the 150M consumer interaction milestone and the quality of those interactions (conversion rates, revenue attribution) beyond iR's self-reported press release."
      whyItMatters: "The 150M interactions is the primary public evidence of iR's platform traction; if the metric is padded with low-intent or incomplete interactions it overstates commercial validation."
      diligencePath: "Request session-level interaction data from Obsess and Landvault enterprise clients; seek third-party attestation through client references or an independent analytics audit."
      relatedQuestionRefs:
        - QM015

    - type: enumeration-incomplete
      severity: minor
      topic: market-sizing
      missingEvidence: "Geographic segmentation of iR's addressable SAM by region, particularly North America vs. EMEA vs. Asia-Pacific, to align with where iR has active sales capacity."
      whyItMatters: "iR's known deployments span US, MENA, and Europe; the SAM opportunity and competitive intensity differ materially by region."
      diligencePath: "Analyze client geography from Obsess, Landvault, and Drone Racing League deal disclosures; cross-reference with iR's hiring data and office footprint."
      relatedQuestionRefs:
        - QM026

    - type: missing-source
      severity: minor
      topic: adoption-constraints
      missingEvidence: "No independent investor survey or enterprise procurement study specifically measures how the consumer metaverse's collapse has lengthened B2B sales cycles or increased skepticism for immersive platform vendors in 2026."
      whyItMatters: "iR's positioning away from the 'metaverse' brand is partly reactive; without data on actual enterprise buyer sentiment shifts, the magnitude of the reputational overhang and its impact on iR's sales motion remains unquantified."
      diligencePath: "Conduct structured reference calls with iR enterprise customers and lost-deal post-mortems; monitor iR's use of 'metaverse' vs. 'immersive platform' terminology in 2026 marketing materials as a proxy indicator."
      relatedQuestionRefs:
        - QM020

    - type: missing-source
      severity: minor
      topic: sizing-gaps
      missingEvidence: "Grand View Research enterprise metaverse and spatial computing reports were inaccessible (HTTP 403) at time of research and would provide an additional high-reputation corroboration point for SAM sizing."
