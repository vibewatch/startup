callouts:
  - calloutType: risk
    title: "Consumer Metaverse Collapse Creates Enterprise Narrative Overhang"
    body: >
      Meta's $73B+ Reality Labs losses and the failure of Horizon Worlds to attract consumer traction has branded 'metaverse' as a cautionary narrative in enterprise boardrooms. iR must continuously distinguish its enterprise-focused platform from the consumer metaverse experiments that failed. Without clear, brand-safe ROI case studies and a positioning that avoids the metaverse label, iR risks longer sales cycles and budget skepticism even among buyers who would otherwise be natural prospects for immersive commerce and training solutions.
    claimRefs:
      - CM036
      - CM037
      - CM043

  - calloutType: strength
    title: "Enterprise XR Adoption Infrastructure Is Already Built"
    body: >
      The hard work of enterprise XR budget establishment has largely been done by early adopters: 75% of Fortune 500 companies have deployed XR in some capacity, and 23% maintain dedicated metaverse/immersive budgets averaging $2.7M annually. This means iR enters a market with proven procurement pathways, established budget line items, and a large installed base of enterprise clients familiar with XR projects—reducing the cold-start sales barrier materially versus a greenfield market.
    claimRefs:
      - CM026
      - CM027
      - CM024

  - calloutType: assumption
    title: "SAM Construction Requires Bottom-Up Validation"
    body: >
      The $50–60B SAM range in this chapter is an author-constructed cross-segment estimate, not a direct analyst figure. It is derived by summing relevant sub-segments of three separately tracked markets and then adjusting for iR's scope. Because iR does not disclose revenue or ARR, and because no analyst tracks the specific 'multi-vertical enterprise immersive platform' category that iR occupies, this estimate should be treated as a directional proxy and updated when iR releases revenue data or a qualified third-party benchmarks its market share.
    claimRefs:
      - CM014
      - CM044
      - CM046

