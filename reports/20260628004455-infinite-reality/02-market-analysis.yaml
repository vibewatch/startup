  - id: buyer-segmentation
    title: "Buyer Segmentation and Adoption Path"
    body: >
      iR's primary payers are enterprise organizations, not individual consumers. Three buyer segments emerge from the company's acquisition portfolio and partnership history.

      First, brand and retail marketing organizations: CMOs and digital experience leads own budgets for virtual storefronts, 3D product launches, and immersive loyalty programs. Through the Obsess acquisition, iR gained 400+ deployed virtual store projects for brands including Ralph Lauren, L'Oréal, Crate & Barrel, J.Crew, and Disney Music Group. The adoption trigger for this segment is rising e-commerce return rates and declining engagement from flat 2D product pages; ROI evidence includes 25–30% higher conversion rates with immersive product visualization.

      Second, sports properties, entertainment rights holders, and leagues: Fan engagement monetization and new sponsorship inventory are the primary triggers. iR's Drone Racing League acquisition and the Warner Bros. Discovery Sports FIM SGP-VERSE speedway experience illustrate deployments in this segment. The immersive sports viewing market is projected at $0.7B in 2026, growing to $8.0B by 2036 at a 27.6% CAGR—a narrow subset of the full fan-experience opportunity.

      Third, government and real-estate enterprises, particularly in MENA: Landvault (now iR Enterprise) has built digital twins for the UAE Ministry of Finance and the DMCC Crypto Centre, and iR has articulated a pipeline across Saudi Arabia, Qatar, and associated government entities. Budget ownership spans digital transformation programs and innovation offices rather than pure marketing budgets in this segment.

      By 2026, 23% of Fortune 500 companies are allocating dedicated metaverse or immersive platform budgets averaging $2.7M annually, and more than 75% have deployed XR in some form, indicating a maturing procurement pathway for enterprise immersive platforms.
