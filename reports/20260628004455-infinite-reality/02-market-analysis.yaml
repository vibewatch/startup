  - id: adoption-constraints
    title: "Adoption Constraints and Structural Headwinds"
    body: >
      The consumer metaverse model has failed at scale, creating a headwind for any company operating in immersive technology. Meta accumulated approximately $73B in cumulative Reality Labs losses since 2021—$17.7B in 2024 alone—with Horizon Worlds failing to attract sustained engagement and Horizon Workrooms slated for discontinuation. Gartner's 2022 prediction that 25% of people would spend one hour daily in the metaverse by 2026 did not materialize for leisure use; enterprise productivity applications captured the growth. For iR, this failure narrative creates reputational overhang when marketing to enterprise buyers who conflate consumer metaverse collapse with the broader immersive platform opportunity.

      Four structural barriers remain specific to enterprise XR adoption. First, content creation is still expensive and slow: Obsess requires 2–3 months per virtual store project, and 3D content development is the largest single cost in enterprise deployments. Second, platform fragmentation—across Meta Quest, Apple Vision Pro, WebXR, and emerging Android XR implementations—requires multi-environment deployment that multiplies development cost and QA burden. The immersive entertainment market cites fragmentation as its primary restraint on scalability. Third, standalone VR headset shipments declined 15% to 4.7M units in 2026 (Omdia, June 2026), constraining the installed base for high-fidelity headset-dependent experiences. Fourth, switching costs are high: custom 3D brand experiences require near-complete redesign if an enterprise client moves between immersive platform vendors, creating both a retention moat and a barrier to initial procurement.
