              月作出的缺席判决，说明欺诈崩盘前就存在结构性现金流失灵。这一模式在十年间、六个州、十余起诉讼中均有记录，并非一次性事件。流媒体服务关闭不是战略转向，而是授权终止后无授权运营的结果。投资者应把权利人诉讼堆栈视为隐藏资产负债表负债的先行指标，而非历史遗留问题。
