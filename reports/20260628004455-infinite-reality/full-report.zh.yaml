  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与定价架构
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的收入模型并表了被收购实体组合中的四类主要收入流：企业专业服务（品牌为 iR Enterprise）、软件授权（iR Studio SaaS 订阅）、内容和媒体变现（主要来自
              Drone Racing League 与 Napster 品牌），以及虚拟环境中的数字资产或 NFT 销售。企业服务——为公司客户定制设计、部署和管理沉浸式 3D Web 体验——贡献了已披露收入的大部分。截至
              2025 年 4 月，公司 iR Enterprise 业务披露已向 Crate & Barrel、e.l.f. Cosmetics、J.Crew 和 Swarovski 等客户交付超过 500
              个定制体验，并通过 LandVault 子公司服务 Middle East 政府实体。

              iR Studio 是公司的自助式无代码平台，理论上可通过订阅路径产生经常性软件授权收入。但公司没有披露 ARR、订阅层级或用户数。企业合同按项目定制报价，未公开列价。Google Cloud
              Marketplace 上架（2025 年 4 月）扩大了触达 Google 企业伙伴生态的分发入口，不过 Google 本身把 iR 定性为普通客户，而非战略伙伴。Drone Racing League
              子公司于 2024 年以 $250 million 被收购，但截至 Forbes 2025 年 4 月调查时，已超过两年没有举办竞赛活动，内容业务的收入贡献因此存疑。Napster 于 2025 年 3 月以
              $207 million 被收购；其授权流媒体服务关闭后，于 2026 年 1 月作为 AI-first 生成式音频平台重新推出，相关收入切换仍在进行且未披露。

              Infinite Reality 几乎全部并表收入都来自 2022 年以来的收购活动。Forbes 2025 年 4 月报道称，「Infinite Reality 几乎全部收入都可归因于其自 2022
              年以来收购的十来家初创公司。」这意味着不含收购的内生收入——即 iR 自有产品收入——未被单独披露，作为独立数字可能并不重要。公司截至 2025 年 4 月完成 10 起收购，其中 8 起发生在 2024 年 4
              月以后；没有分部披露，跨期收入比较在结构上并不可靠。
