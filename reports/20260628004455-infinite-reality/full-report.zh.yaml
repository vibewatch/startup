      - number: '8.3'
        title: Cole 欺诈、法律悬顶与治理失败
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 11 日，SEC 对 Charles J. Cole（57 岁，Mooresville, NC）及其律师 Torben M. Welch 提起民事诉讼
              LR-26563，指控其通过虚假声称控制至少 $55 billion 资产，并承诺一笔从未实际支付的 $3.36 billion 投资，欺诈性取得 239 million 股——约 iR 已发行股本的
              25%。DOJ Southern District of New York 同日以电信欺诈和共谋起诉 Cole，每项最高刑期 20 年。

              该骗局设计复杂：Cole 架设离岸服务器，托管一个仿冒外国银行网站的假网站，让 iR 高管登录后看到伪造的已到账余额。Cole 的律师 Welch 向第三方贷款人提供伪造银行文件；Cole 将约 45
              million 股 iR 股份质押给该贷款人作为贷款抵押，随后违约。欺诈被揭露后，Infinite Reality 于 2026 年 3 月撤销向 Cole 及其实体发行的全部股份。美国检察官 Jay
              Clayton 表示：「As alleged, Charles Cole built a fiction of wealth using fake bank records, sham
              correspondence, and a fraudulent bank website, then used that fiction to obtain hundreds of millions of
              shares with no intention of paying for them.」

              iR 一直称自己是 misconduct 的受害者，并正配合执法。截至 2026 年 6 月，联邦当局尚未将 iR
              领导层列为刑事目标。但这场欺诈暴露出的治理失败——在没有独立核验的情况下，仅凭伪造文件就向未知私人投资者发行公司 25% 股权——本身已足以让 iR 无法以其声称估值通过机构尽调。

              其他法律悬顶还包括：SEC 有一项活跃 subpoena（最初于 2025 年 2 月申请强制执行，涉及 2022 年 SPAC），DOJ 对 $3 billion 崩盘的调查仍在继续。Sony Music 已就
              $9.2 million 未付版税取得缺席证明，另有最高 $37.5 million 的索赔。CFO Brian Effrain 和 CLO Jennifer Pepin 于 2025 年 9
              月双双离职，在最关键的治理阶段削弱了高级财务和法律监督。

              SEC 的 FY2025 执法结果报告（2026 年 3 月）提到 583 起执法行动，并强调将持续审查私营公司披露和投资者欺诈。监管环境已经明显收紧，尤其针对引用膨胀估值的未注册私募配售。
