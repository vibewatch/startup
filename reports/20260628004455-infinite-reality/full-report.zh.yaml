      - number: '1.4'
        title: 封面指标与运营规模
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 披露的经审计财务数据极少。公司自报 2023 年收入 $50 million、2024 年收入 $75 million，并称多数收入来自 2022
              年以来完成的十余起收购。没有独立审计报告，也没有包含实质财务报表的 SEC 文件公开。Forbes 调查指出，2025 年初一场免费产品演示只有两名参与者。公司自报 $15.5 billion 估值意味着约
              200x 追踪收入倍数——远高于同期估值最激进的 AI 初创公司。

              2024 年末裁员前，ZoomInfo 和 RocketReach 对员工数的估计在 250 至 276 人之间。2025 年 7 月公司裁减约 100 个职位（公司称源于收购后的岗位冗余）后，估计员工数在
              150 至 200 人之间。已知运营地点包括 Connecticut（原总部 Norwalk）、Florida Boca Raton 与 Fort Lauderdale（运营基地和规划中的全球总部园区）、Los
              Angeles（Thunder Studios）以及 MENA 地区（LandVault 企业业务）。公司已宣布与开发商 Sterling Bay 在 Fort Lauderdale 建设 60
              英亩旗舰园区，目标 2026 年初动工，预计新增 1,000+ 个岗位；但截至本报告运行日，尚无施工进展得到确认。
