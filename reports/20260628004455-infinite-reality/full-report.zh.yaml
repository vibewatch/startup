  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与运营结构
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的商业产品套件分为 4 个功能层。第一层是自助工具：iR Studio，一个用于构建 3D 互动店面的无代码 / 低代码 SaaS 浏览器平台；以及 iR Engine
              空间网络框架（由 Ethereal Engine 更名而来，2024 年 2 月以 $75 million 收购），负责渲染层。iR Studio 的拖拽界面支持可定制模板、道具、头像、Shopify
              商品目录导入、多人视频 / 音频聊天和分析仪表盘。第二层是 iR Enterprise，即托管服务机构，据称已为 Crate & Barrel、e.l.f. Cosmetics、J.Crew、Swarovski
              等客户交付超过 500 个定制沉浸式体验；它还吸收了 LandVault 的企业元宇宙基础设施（2024 年 7 月以 $450 million 收购），新增 Mastercard、L'Oreal 和 UAE
              政府实体等超过 200 家企业客户。第三层是源自 Touchcast 收购（2025 年 4 月宣布，金额 $500 million）的 AI agent 产品家族：Napster
              Spaces（面向网站转化的自主式 AI 视频聊天，2025 年 5 月 beta）、Napster 26（全息 AI 伴侣平台，Mac app 2025 年 10 月）、Napster Station（面向
              B2B 场所的 AI kiosk，CES 2026 年 1 月）、Omniagent API（2026 年 5 月，每分钟 $0.01）以及 NV2——2026 年 6 月发布的 Full HD 30 FPS
              实时对话视频模型。第四层是媒体：Thunder Studios（150,000 sq ft、获 Emmy 奖的制作设施）、Drone Racing League 体育 / 媒体资产，以及 TalentX
              网红管理。Obsess 收购（2025 年 1 月宣布）带来 400+ 品牌 3D 虚拟商店和面向 Ralph Lauren、L'Oreal、Disney Music Group 等品牌的专有 CMS
              技术，并直接整合进 iR Studio。每个产品层服务不同买方群体——自助 SMB、Fortune 500 企业、开发者 / API
              集成方和媒体版权买方——但组合主要靠全股票收购拼出，而非有机开发，整合风险显著。
