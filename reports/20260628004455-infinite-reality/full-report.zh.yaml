      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的财务画像是：公司确有 $75–85 million 区间的企业 XR 收入，但几乎全部来自收购；背后只有一笔确认到账的 $350 million 现金融资，其中大部分很可能已在
              2024 年中至 2025 年中被运营、整合和部分现金收购消耗。$3.36 billion
              融资崩塌大幅压缩了公司的流动性和战略跑道。没有经审计财务报表，就无法核验现金头寸、毛利率、分部盈利能力、债务水平，或收购潮带来的商誉摊销负担。

              收入质量存在根本缺陷：几乎所有收入来自控股公司模式下的被收购子公司，有机增长未披露且可能很低，毛利率未知。公司的全股票收购策略在没有投入真实资本的情况下推高了报告估值，自报 $15.5 billion
              估值没有独立依据。Cole 欺诈调查、未决诉讼、治理担忧、CFO 和 CLO 离职以及缺少经审计财务报表叠加，将严重限制未来融资。Napster 停止流媒体后转向
              AI-first，也增加了执行风险和收入模型再转换负担。              在经审计财报、分部收入、毛利率以及可信的欺诈后资本充足性评估出现之前，若不能深度接触管理层并完整审阅资料室，Infinite
              Reality 的财务画像基本不具备可投资性。
            claimRefs:
              - CI047
              - CI048
              - CI049
              - CI050
      - number: '4.7'
        title: 图表与证据
        blocks:
          - type: callout
            title: $3.36B 欺诈摧毁了资本计划
            body: >-
              公司整个 2025 年扩张战略——收购 Napster、收购 Touchcast、Fort Lauderdale 总部、国际扩张——都建立在从未到账的 $3.36 billion 之上。SEC 和 DOJ 于
              2026 年 6 月 11 日提起指控，确认 Charles Cole 欺诈。Infinite Reality 只剩约 $350 million
              确认真实资本（其中大部分已投入），且因声誉、治理和法律损伤面临严重融资障碍。
