      - number: '5.4'
        title: 差异化、IP 与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 声称的差异化建立在 5 根支柱上：（1）通过 iR Engine 实现设备无关、浏览器原生交付，绕开 app-store 抽成，并让 web、移动端和 XR 形成「build
              once, run everywhere」分发；（2）Touchcast AI 专利组合（27 项专利）覆盖视频 AI 交互和智能虚拟助理，构成可触摸的 IP 防御；（3）Obsess
              平台在奢侈品和大众零售中已有 400+ 生产部署，提供经过验证的品牌参考和 CMS 工具链；（4）源自 LandVault 的企业履历，覆盖 MENA 和欧洲 200+ 政府及 Fortune 500
              客户；（5）Napster 品牌，承载 1999 年 P2P 音乐颠覆时代的历史认知，并声称拥有内置受众。

              但每根差异化支柱都经不起完全免检。iR Engine 的开源核心模式是真实技术资产，但其 GitHub 仓库活跃度与 Unity、Unreal 或 Three.js 生态相比偏弱；开发者社区批评 iR
              Studio 的封闭 SDK 和有限可扩展性。Touchcast AI agents 直接面对资金充足的既有厂商（Synthesia、HeyGen、D-ID），后者模型库和开发者生态更大。Obsess
              部署数量由公司声称，未经独立审计。「Napster」品牌认知是一把双刃剑：The Register 和 Gizmodo 都把此次转型描述为重塑品牌的第三次失败尝试，并指出
              MelodyVR（Web3，2020–2023）和 Hivemind / Algorand（blockchain，2022）旗下的平行失败。「build once, run everywhere」说法并不覆盖
              Napster 26 平台；该平台发布时仅支持 Mac，PC 支持推迟到 2026 年。
