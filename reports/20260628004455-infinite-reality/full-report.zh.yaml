      - number: '2.5'
        title: 采用约束与结构性逆风
        blocks:
          - type: paragraph
            body: >
              消费级 metaverse 模式未能规模化跑通，给所有沉浸式技术公司带来逆风。自 2021 年以来，Meta 的 Reality Labs 累计亏损约 $73B，仅 2024 年就亏损
              $17.7B；Horizon Worlds 未能吸引持续互动，Horizon Workrooms 也计划停运。Gartner 2022 年预测，到 2026 年 25% 的人每天会在 metaverse
              中花一小时；休闲使用并未兑现，增长被企业生产力应用拿走。对 iR 而言，企业买方常把消费 metaverse 的失败与更广泛沉浸式平台机会混为一谈，这一失败叙事带来声誉包袱。

              企业 XR 采用仍有四个结构性障碍。第一，内容创作依然昂贵且缓慢：Obsess 每个虚拟门店项目需要 2–3 个月，3D 内容开发也是企业部署中最大的单项成本。第二，平台碎片化——Meta Quest、Apple
              Vision Pro、WebXR 和新兴 Android XR 实现并存——要求跨环境部署，放大开发成本和 QA 负担。沉浸式娱乐市场把碎片化列为规模化的主要约束。第三，独立 VR 头显出货量在 2026 年下降
              15% 至 4.7M 台（Omdia，2026 年 6 月），限制了依赖头显的高保真体验装机基础。第四，切换成本高：如果企业客户在沉浸式平台供应商之间迁移，定制 3D
              品牌体验几乎需要完全重做；这既形成留存护城河，也抬高初始采购门槛。
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
      - number: '2.6'
        title: 规模测算尽调缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              三个重大缺口限制了任何 iR 市场分析的精度。第一，分析师对「XR 市场」的定义在 2026 年横跨 30× 区间——从 $10.64B（Mordor Intelligence，窄平台软件）到
              $346B（Fortune Business Insights，包含硬件和基础设施的宽沉浸式生态）——差异源于硬件、内容、基础设施和相邻使能技术层是否纳入并不一致。若 TAM 缺少精确范围定义，用来给 iR
              估值并不可靠。

              第二，iR 不披露收入、ARR 或定价数据，因此无法验证市场渗透率，也无法从客户经济性反推自下而上的 SAM。150M
              消费者互动里程碑值得注意，但它是互动指标，不是收入数字；公司的全股票收购策略也进一步遮蔽了资产组合定价。

              第三，iR 横跨的可服务市场类别（沉浸式娱乐、虚拟商业、企业空间计算、体育粉丝互动）分别由不同分析师用不同方法跟踪。把它们合并，需要假设 iR 在各细分中的收入份额；没有财务披露，这些假设无法验证。$0.7B
              沉浸式体育观赛市场可作为一个垂直的有用边界，但若纳入赞助收入、品牌激活和游戏化变现，它会显著低估完整粉丝体验机会。
            claimRefs:
              - CM044
              - CM045
              - CM046
              - CM047
              - CM048
              - CM049
              - CM050
      - number: '2.7'
        title: 图表证据
        blocks:
          - type: callout
            title: 消费级 Metaverse 崩塌造成企业叙事包袱
            body: >
              Meta 的 $73B+ Reality Labs 亏损，以及 Horizon Worlds 未能吸引消费者牵引，让「metaverse」在企业董事会中变成警示叙事。iR 必须持续把自身企业平台与失败的消费级
              metaverse 实验切开。若没有清晰、品牌安全的 ROI 案例研究，也没有避开 metaverse 标签的定位，哪怕买方本来天然适合沉浸式商业和培训方案，iR 也可能面对更长销售周期和预算怀疑。
            calloutType: risk
            claimRefs:
              - CM036
              - CM037
              - CM043
          - type: callout
            title: 企业 XR 采用基础设施已经搭好
            body: >
              企业 XR 预算建立这件难事，基本已由早期采用者完成：75% 的 Fortune 500 公司已在某种程度部署 XR，23% 保有专门的 metaverse / 沉浸式预算，年均 $2.7M。这意味着 iR
              进入的是一个采购路径已验证、预算科目已建立、且大量企业客户熟悉 XR 项目的市场；相比绿地市场，冷启动销售门槛大幅降低。
            calloutType: strength
            claimRefs:
              - CM026
              - CM027
              - CM024
          - type: callout
            title: SAM 构建需要自下而上验证
            body: >
              本章 $50–60B 的 SAM 区间是作者构建的跨细分估计，不是直接分析师数字。它来自对三个分别跟踪市场中相关子细分的求和，再按 iR 范围调整。由于 iR 不披露收入或 ARR，也没有分析师跟踪 iR
              所处的具体「多垂直企业沉浸式平台」类别，这一估计应被视为方向性代理；待 iR 发布收入数据，或合格第三方基准测算其市场份额后，应更新。
            calloutType: assumption
            claimRefs:
