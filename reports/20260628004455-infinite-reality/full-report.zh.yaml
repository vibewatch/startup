  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与生态概览
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的客户生态更像一组继承来的客户基础，而不是一张有机建立的单一客户名单。通过收购计划——LandVault（$450M，2024 年 7
              月）、Obsess（$207M，条款未披露，2025 年 1 月）和 Drone Racing League（$250M，2024 年 4 月）——iR 一次性吸收了数百个企业品牌关系，而不是逐个赢下。

              企业品牌是最突出的客群：Crate & Barrel、e.l.f. Cosmetics、L'Oréal、J.Crew、Ralph Lauren、Benefit、Disney Music Group 和
              Swarovski 等零售与时尚品牌，都曾使用如今归入 iR 旗下的平台搭建 3D 虚拟商店或沉浸式品牌活动。Heineken、Hershey 等消费品公司，Mastercard、Standard
              Chartered 等金融机构，以及 Warner Bros. Discovery、Universal Music Group 等媒体公司，共同构成核心企业品牌客群。以 UAE Ministry of
              Finance 和 Abu Dhabi 政府为代表的政府及公共部门客户，则是一个地理属性明显的独立分层，主要由 LandVault 的 MENA 业务推动。

              体育 / 媒体 / 娱乐分层由 Drone Racing League 既有赞助和转播生态支撑；收购时命名合作伙伴包括 T-Mobile、U.S. Air Force、Vodafone（通过
              Pairpoint）、WarnerMedia 和 Universal Music Group。2025 年末，Napster Spaces 和 agentic AI 产品线带来早期企业 AI 分层；Cooper
              Parry（一家英国会计事务所）是通过 Microsoft Azure Agentic AI 合作公开披露的首个试点客户。自助 SMB / creator 层由 iR Studio 服务，这是一款无代码 /
              低代码 SaaS 平台，起价 $49/month；但截至 2026 年中，该渠道没有公布客户数量或收入贡献。
