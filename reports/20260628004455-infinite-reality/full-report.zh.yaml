        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              iR 的主要付款方是企业组织，不是个人消费者。公司的收购组合和伙伴关系历史显示出三类买方。

              第一类是品牌和零售营销组织：CMO 与数字体验负责人掌握虚拟店面、3D 产品发布和沉浸式忠诚度项目预算。通过收购 Obsess，iR 获得了 400+ 个已部署虚拟门店项目，客户包括 Ralph
              Lauren、L'Oréal、Crate & Barrel、J.Crew 和 Disney Music Group。该客群的采用触发点，是电商退货率上升以及扁平 2D 产品页互动下滑；ROI
              证据包括沉浸式产品可视化带来的 25–30% 更高转化率。

              第二类是体育资产方、娱乐版权持有人和联盟：粉丝互动变现与新增赞助库存是主要触发因素。iR 收购 Drone Racing League，以及 Warner Bros. Discovery Sports FIM
              SGP-VERSE 赛道体验，展示了这一细分的部署。沉浸式体育观赛市场预计 2026 年为 $0.7B，到 2036 年以 27.6% CAGR 增至 $8.0B——这是完整粉丝体验机会中的一个狭窄子集。

              第三类是政府和房地产企业，尤其在 MENA：Landvault（现 iR Enterprise）已为 UAE Ministry of Finance 和 DMCC Crypto Centre 建设数字孪生，iR
              也描述过覆盖 Saudi Arabia、Qatar 及相关政府实体的管线。该细分的预算归属更偏数字化转型项目和创新办公室，而非纯营销预算。

              到 2026 年，23% 的 Fortune 500 公司正在配置专门的 metaverse 或沉浸式平台预算，年均 $2.7M；超过 75% 已以某种形式部署 XR，说明企业沉浸式平台的采购路径正在成熟。
