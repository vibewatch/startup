            title: SEC/DOJ 调查引入企业采购风险
            body: >-
              SEC 民事起诉书（Case No. 1:26-cv-4945，2026 年 6 月 11 日提交）以及 DOJ 对 Charles Cole 证券欺诈、电汇欺诈共谋和欺骗 Infinite Reality /
              Napster 的并行刑事指控，确认公司的资本基础是欺诈性构建的。具名品牌客户和政府机构的企业采购负责人都能看到这些信息；多家 Fortune 500 品牌执行严格第三方风险管理，会标记处于 SEC
              主动调查中的供应商。近期合同续约构成更高执行风险。
