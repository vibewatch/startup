      - number: '5.3'
        title: 客户工作流与部署模式
        blocks:
          - type: paragraph
            body: >-
              iR Studio 面向希望在没有工程资源的情况下做沉浸式 3D 体验的品牌营销人员和电商运营者。部署流程从创建账号和选择模板开始，随后拖拽搭建场景、导入 Shopify
              商品目录、定制头像与交互，并一键发布到自定义 URL。体验可直接在网页浏览器访问——无需安装 app——并支持多人、视频聊天和 AI 助手交互。公司提供 3 种部署形式：用于活动的全页面品牌
              URL、嵌入现有页面的 embed snippet，以及仅 agent 的浮动 widget。Starter Plan 品牌每月支付 $49，可使用最多 50 小时 AI 视频聊天；Enterprise
              plan（据称每月 $3,000）面向需要沉浸式 3D 店面和 AI personal shopper 的 Shopify 零售商。

              iR Enterprise 采用专业服务 agency 模式：品牌向 iR 团队 brief，团队设计、构建并部署定制沉浸式环境。产品包括现实环境的 digital twin、与 Shopify 和
              Salesforce 集成的虚拟展厅、AI 驱动助手、从 2D 照片生成的 3D 商品数字化，以及面向 Meta Quest 和 Apple Vision Pro 的 XR 应用。LandVault
              为中东、欧洲和北美的政府及企业用例贡献了企业级托管服务能力。

              对 Napster AI 产品线，Napster 26 Mac 应用和网页浏览器版本允许用户通过视频对话与超过 15,000 个 AI 伴侣 persona 互动。创建 digital twin 需要自拍、上传
              LinkedIn 资料、语音样本和同意录音。Omniagent API 支持开发者以每分钟 $0.01 集成；Solgari 合作使其可部署在 Microsoft Teams 和 Dynamics 365
              内部。Napster Station B2B kiosk 面向企业实体场所，使用 Azure OpenAI，并配备专有 VoiceField 麦克风阵列，在公共场所做噪声隔离。
