      - number: '4.5'
        title: 负面财务证据与风险信号
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的财务叙事已积累一组负面信号，远超普通创业公司的信息不透明。最根本的问题是，公司的头部估值与收入结构性脱节。Forbes 2025 年 4 月报道称，按 $15.5
              billion 估值和 $75 million 收入计算，Infinite Reality 隐含 207x 收入倍数，远高于当时估值最高的私营科技公司 Anthropic（约 44x）和 OpenAI（约
              24x）。一位 Yale 金融学教授称，如果属实，$3 billion 投资将是当年最大单一投资人风险轮之一；但它并不属实。

              公司的估值方法完全自我参照：每笔收购都按公司自行确定的 Infinite Reality 股票估值定价，持续抬高申报估值，记录中没有任何独立评估或投行 fairness
              opinion。被收购公司前高管把该估值称为「fake imaginary numbers」，并称许多员工觉得运营像「a scam」。联合创始人 Rodric David 2024 年 12
              月起诉，要求取得财务文件以理解公司估值和治理，包括 Acunto 曾向股东展示的两笔 $1 billion 和 $2.5 billion 债券细节。

              SEC 早在 2025 年 2 月就提起既有诉讼，要求公司配合与 2022 年 SPAC 估值相关的传票，说明监管审查早于 Cole 欺诈案。SEC 于 2026 年 6 月 11 日提起的民事诉讼和 DOJ 对
              Cole 的刑事行动，是公司历史上最直接的金融欺诈事件。Cole 使用伪造银行对账单、仿冒合法金融机构的网站，并在 Infinite Reality 分文未收的情况下，把 45 million 股作为 $1
              million 贷款抵押品；无论法律结果如何，这都会留下严重声誉和治理伤痕，未来融资将更难推进。
