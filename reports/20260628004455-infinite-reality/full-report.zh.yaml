              Infinite Reality 声称自己是 Cole 欺诈案的受害者。但 2025 年 3 月，公司发言人告诉 Forbes，资金「in an Infinite Reality account and
              available to us」，公司也在「actively leveraging」这笔资金——而按 DOJ 起诉书，当时没有任何资金到账。这究竟是对 Cole
