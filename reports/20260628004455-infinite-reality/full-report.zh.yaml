      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 走的是非常规融资路径，核心资金来自个人投资者和 family office，而非机构 VC。已披露融资包括：Display Social 到 2021 年在 SEC
              文件中声称融资 $44 million（未获独立验证）；2024 年 7 月来自一家未披露 family office 的 $350 million 轮融资，公司估值 $5.1 billion；以及 2025 年
              1 月声称来自匿名私人投资者的 $3 billion 融资，据称将估值推至 $12.25 billion。2025 年 4 月，公司又在宣布 Touchcast 收购时把自报估值上调至 $15.5
              billion。

              2025 年 1 月宣布的 $3 billion 融资在 2025 年 11 月公开崩塌，当时 CEO John Acunto
              在股东会上承认投资不会落地。公司随后发出书面沟通，称自己是「不当行为的受害者」，并宣布正配合执法部门。SEC 此前已于 2025 年 2 月提起诉讼，要求公司遵守一项传票；该传票涉及 2022 年已取消 SPAC
              交易中的早前 $1.85 billion 估值。DOJ 也单独启动调查，追查所谓 $3 billion 发生了什么。多起供应商诉讼指向现金流问题：TD Cowen 赢得 $3.3 million 判决（2024
              年 12 月），Summit Partners 要求返还 $27 million 股份，Sony 则因 $9.2 million 未付版税取得违约证明。

              公司原投资者关系页面列出的几乎所有投资者（RSE Ventures、Lux Capital、Liberty Media、T-Mobile Ventures、Lerer Hippeau、Exor）都是通过此前持有
              Drone Racing League 股权而成为 Infinite Reality 股东，并非直接投资 iR。Forbes 开始就此询问后，公司网站移除了该投资者页面。
