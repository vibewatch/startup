      - number: '4.3'
        title: 成本结构、单位经济与毛利率
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 尚未公开披露毛利率、销售成本或服务成本数据。公司的混合收入模型把企业专业服务、软件订阅、内容 /
              媒体版权和数字资产放在一起，每一类业务的利润率结构差异很大。企业服务和定制体验制作通常吃人力和基础设施，参照可比 agency，毛利率一般在 20–40%。SaaS 订阅如果跑出规模，毛利率可能达到
              60–80%。实际混合毛利率仍未知。

              GamesBeat 2024 年 7 月报道称，收购 LandVault 前 Infinite Reality 约有 140 名员工，LandVault 又带来 36 人。The Founders
              Magazine 2025 年报道称，2025 年中约三分之一员工被裁，由此推算截至 2025 年末公司约有 100–175
              名员工，也说明公司承受了明显的人力成本压力。公司没有披露薪酬基准、云基础设施成本、媒体版权费用或整合成本。单位经济模型——获客成本（CAC）、生命周期价值（LTV）、回本周期或净收入留存——从未由公司披露，也没有可信第三方给出估算。

              由于集团式组合横跨音乐、eSports、制作、XR 软件和企业咨询，成本结构相当复杂。12 个月内整合 8 笔收购，通常会带来大量一次性重组和冗余成本；2025
              年中裁员也确认整合开销不小。营运资本管理同样公开承压：多家供应商因欠款起诉，公司 CMO 也承认 2023 年和 2024 年存在现金流问题。
