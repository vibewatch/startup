  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 最紧迫的近期风险，是 $3.36 billion 融资崩塌引发的联邦执法行动。2026 年 6 月 11 日，U.S. Attorney's Office for the
              Southern District of New York 解封刑事起诉书，指控北卡罗来纳州 Mooresville 57 岁的 Charles J. Cole
              涉嫌电汇欺诈、共谋实施电汇欺诈、共谋实施证券欺诈——最高刑期分别为 20 年、20 年和 5 年。同日提交的并行民事诉讼中，SEC 指控 Cole、其律师 Torben M. Welch，以及 3 家由 Cole
              控制的壳实体（Beacon Heart LLC、Heart of Humanity LLC、Avranoc LLC）违反 Securities Act 和 Exchange Act
              反欺诈条款。两份文件称，Cole 和 Welch 使用伪造银行记录、虚假通信和仿冒外国银行网站，诱使 Infinite Reality 在 2024 年末至 2025 年初发行 239 million
              股，却没有收到任何对价。Infinite Reality 最终在 2026 年 3 月撤销全部向 Cole 发行的股份，并以受害者身份配合执法机构。

              SEC 对 Infinite Reality 的关注早于 Cole 欺诈案。围绕公司在 2022 年反向合并尝试中向 SEC 提交的 $1.85 billion 估值说法，调查仍在进行；此前为强制 CEO
              Acunto 遵守 SEC 传票而提起的联邦诉讼已提交，后被驳回。

              知识产权方面，Sony Music Entertainment 2025 年 8 月在 SDNY 起诉，要求 Napster 支付 $9.2 million 未付版税，并就许可终止后继续播放 Sony
              内容主张最高 $37.5 million 法定版权损害赔偿，涉及 240 首曲目——包括 Justin Timberlake、Britney Spears 和 Miley Cyrus 的作品。Napster
              未提交答辩后，书记员于 2025 年 10 月录入缺席判决。SoundExchange 2025 年 6 月另行起诉，要求支付与 Sonos Radio 流媒体服务相关的 $3.4 million
              未付版税。其他债权人和收购交易对手诉讼——包括 Frenkel v. Acunto（Nevada，2025）和 Obsess 收购反诉争议——进一步把法律敞口压到已经紧张的资产负债表上。
