      - number: '6.5'
        title: 扩张动力、集中风险与结构性缺口
        blocks:
          - type: paragraph
            body: >-
              iR 声称的 land-and-expand 策略分两层运作：iR Enterprise（基于 LandVault 的端到端 agency 服务部门）通过定制沉浸式体验建设拿下 Fortune 500
              和政府客户；iR Studio 为 SMB 和 creators 提供起价 $49/month 的自助、无代码入口。理论上，iR Studio 漏斗流量会把合格品牌线索送入 iR Enterprise
              项目——类似 B2B SaaS PLG（product-led growth）漏斗。但公司没有披露任何证据表明 iR Studio 确实被用作 SMB 通向企业合同的入口。

              多个维度的集中风险偏高。第一，Google Cloud 5 年战略合作把 iR 的云和 AI 基础设施集中在单一供应商关系中，其商业条款（以及 Google 是补偿 iR，还是仅向 iR
              收取云服务费）尚未公开澄清——Forbes 报道称，Google 把该关系描述为普通商业安排，而非从 Google 一侧产生战略收入的合作。第二，DRL
              赞助基础依赖少数具名蓝筹赞助商；单个赞助商续约率未披露。第三，iR 从未公开分拆子公司（iR Studio、DRL、Thunder Studios、Obsess、LandVault、Napster
              AI、TalentX）的收入，无法判断是否有单一产品线或客户贡献了 $75 million 自报 2024 年收入中的过高比例。

              Charles Cole 欺诈丑闻加入了一项 SaaS 客户分析中通常不存在的结构性集中风险：SEC 民事起诉书（2026 年 6 月 11 日提交，Case No. 1:26-cv-4945，SDNY）和
              DOJ 并行提出的电汇欺诈、证券欺诈共谋刑事指控，确认 iR 的资本基础是欺诈性构建的。具名品牌客户和政府机构的企业采购团队都能看到这条新闻；在 SEC / DOJ
              结案前，续约和新的企业投标可能面临更高审查或暂停。
