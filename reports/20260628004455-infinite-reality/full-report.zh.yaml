      - number: '6.3'
        title: 具名客户证明——部署、结果与证据质量
        blocks:
          - type: paragraph
            body: >-
              iR 证据最充分的具名部署横跨 5 个垂直领域：消费品（Heineken 通过 LandVault 和 Dentsu 在 Decentraland 发起并赢得 Cannes Lion 的虚拟酒吧活动）、媒体 /
              体育（Warner Bros. Discovery Sports 的 FIM SGP-VERSE 互动 speedway app，被描述为全球首个全沉浸式 speedway 体验）、零售 / 美妆（e.l.f.
              Cosmetics 通过 Obsess 打造的游戏化虚拟 loyalty lounge，被列为旗舰 gamification 案例）、家居（Crate & Barrel 通过 Obsess 打造的沉浸式 3D
              商店）以及政府 / 公共部门（UAE Ministry of Finance 通过 LandVault 用于培训和安全演示的 digital twins）。

              企业 AI 部署仍处早期。最具体的具名试点是 Cooper Parry，一家被称为「rebel of accountancy」的英国会计事务所；它与咨询公司 Leading Results 合作，部署了由
              Microsoft Azure OpenAI 驱动的 Napster AI coaching platform。Napster 2025 年 11 月新闻稿按姓名引用了 Cooper Parry 员工——包括
              Claire Davis（Head of Performance, Growth & Excellence）和 Sarah Holland（Lead Coach）——这是 iR
              公开记录中最清晰的独立客户声音。第二个试点客户是一家在墨西哥和 70+ 国家运营的大型 paints-and-coatings 制造商；Napster 2025 年 9 月 Azure AI Foundry
              公告提到该客户，但未公开姓名。

              Featured Customers B2B 评价聚合平台给出的整体信号——17 个案例研究、573 个参考评分合成
              4.8/5.0——方向上偏正面，但方法论较弱：该平台汇总供应商提交的参考，而非独立来源评论；评分可能反映 Obsess、LandVault 和 DRL 在被 iR 收购前的表现，而不是 iR 协调的部署。截至
              2026 年中，iR Studio 作为公司面向 SMB 客户的主要 SaaS 自助产品，在 SourceForge 上没有任何公开用户评价，在 G2 或 Capterra 上也没有有意义的存在感。
