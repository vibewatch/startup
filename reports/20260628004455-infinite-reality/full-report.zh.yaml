      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 有四位联合创始人。John Acunto（CEO）是公司的公开面孔，也是最突出的发言人；Forbes 报道质疑其编造学历，包括声称拥有 University of Florida
              博士学位和 Harvard 硕士学位，但两所大学均未确认，并指出他过往企业在至少六个州涉及未付供应商款项诉讼。Rodric David 担任总裁兼联合创始人。Amish Shah
              是联合创始人兼首席商务官，常见于收购公告。Sean Cross 是联合创始人兼美洲销售与业务发展总裁。

              2024 年，公司从成熟科技和游戏公司引入若干高管，扩充管理层：Brian Chu（首席产品官，曾任 Epic Games 主管 Fortnite 和 Rocket League 的总监）以及 Danielle
              Korins（首席人力资源官，曾任 Fortune 500 人力高管）于 2024 年 9 月加入。Drone Racing League 创始人 Nicholas Horbaczewski 在 DRL
              收购后成为全球总裁。Rachel Jacobson（前 DRL 总裁）成为首席营收官兼商业事业总裁。Napster CEO、前 Roblox 全球音乐负责人 Jon Vlassopulos 在 Napster
              收购后承担更广泛的 iR 职责。

              重大治理风险在于 John Acunto 的极端关键人集中度：所有主要融资、收购决策和战略转向均由他推动。董事会构成未公开披露；媒体报道中没有确认任何独立董事姓名。CFO Brian Effrain 和 CLO
              Jennifer Pepin 均于 2025 年 9 月离职，发生时点正值 SEC 和 DOJ 调查的关键阶段，进一步削弱治理韧性。
