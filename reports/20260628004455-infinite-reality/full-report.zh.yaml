  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality（Napster Corporation）的正式投资论点建立在三根支柱上：（1）公司自报 $15.5 billion 估值，代表其在新兴 spatial web 和
              AI-commerce 市场的先发溢价；公司已拼出一个差异化资产组合，包括 Drone Racing League、Thunder Studios 和 Napster 品牌；（2）2024 年 $75
              million 收入被低估，因为企业沉浸式合同 pipeline 尚未确认；（3）Cole 欺诈事件是外部受害事件，不是公司结构性失灵的信号。

              三根支柱逐一经不起审视。估值上，可比上市 spatial/XR 公司在 2.7–27x 收入区间交易，且有透明、经审计的财务；iR 的 207x 倍数甚至高于估值最激进的 AI 超高增长公司在 2025–2026
              年高点时的水平。收入上，没有独立审计；Forbes 在一次产品演示中只发现两名参加者，且都是记者；Improbable、Animoca Brands 等行业同业从未遇到 iR 作为客户、供应商或合作伙伴；公司自家
              CMO 还在 2025 年表示，iR 不再把自己视为 metaverse 公司。欺诈上，虚构的 $55 billion 资产声明和假银行网站骗得 iR 向 Cole 发行 239 million 股（约公司
              25%）且没有获得任何对价，这要么显示故意不当行为，要么显示灾难性治理失败——两者都不符合一家寻求以 $15 billion 估值获得机构资本的公司应有的 stewardship。

              反论点进一步得到强化：没有具名机构 VC（没有 a16z、Sequoia、SoftBank 或同类机构）曾直接投资 iR；所有具名投资者（RSE Ventures、Lux Capital、Liberty
              Media）均通过 DRL 收购持股，而非直接投资 iR；Forbes 开始询问后，投资者关系页面被移除；CEO 学历被虚构；2022 至 2025 年间四次 SPAC / 要约收购退出分别失败；Sony
              Music 已就 $9.2 million 未付版税取得违约证明，另有最高 $37.5 million 的索赔待决。
