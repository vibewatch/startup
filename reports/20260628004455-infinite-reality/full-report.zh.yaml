      - number: '6.2'
        title: 采用轨迹与互动数据
        blocks:
          - type: paragraph
            body: >-
              iR 公开披露的最突出采用指标，是 2025 年 4 月宣布的约 500 个沉浸式 3D 体验累计 150 million
              次消费者互动。公司描述的互动类型包括商品图片点击、场景内玩法、电商购物车活动、会员注册、AI chatbot
              会话、视频观看、社交分享和导航热点点击——这是一个异质篮子，把高意向购买动作和被动参与事件混在一起，限制了该指标与标准电商转化基准的可比性。

              关键在于，iR 明确表示该数字不包括当时新推出的 iR Studio、Napster 平台，以及 Roblox 上的第三方平台互动，因此它不代表公司总可触达平台足迹。LandVault 收购增加了跨 200+
              客户的 1.2 million square feet 虚拟体验基础设施；Obsess 贡献了 400+ 虚拟店部署。iR 发布了内部案例研究基准：一个未具名奢侈时尚品牌称转化率比其标准电商网站高
              75%、平均订单价值高 19%；一家未具名全球玩具公司称加购率高 25%；一家未具名音乐娱乐公司在上线首周把 merchandise conversion 提高 39%。这些都由公司引用，未经审计。

              DRL 带来一组独立受众指标：收购时年度数字视频观看超过 1 billion 次、全球转播覆盖 320 million 户家庭，并拥有 15 million 社交媒体粉丝，其中 TikTok 5.4
              million。这说明 iR 确实运营一项有真实粉丝触达的资产，与其企业品牌平台不同。Obsess 收购后，截至 2025 年 1 月员工约 319 人；该数字随后因 2025 年 5
              月与收购重叠冗余相关的未披露裁员而下降。
