      - number: '3.4'
        title: 替代品、现状方案与相邻进入者
        blocks:
          - type: paragraph
            body: >-
              现状方案——基于 Shopify、Salesforce Commerce Cloud、Magento 或定制技术栈搭建的传统 2D 电商——仍是品牌评估 iR Studio
              时的默认选择。这些方案没有平台迁移风险，第三方集成广，转化基准已验证，服务生态庞大。对评估 3D 沉浸式店面的企业品牌而言，2026 年 2 月 8th Wall
              开源后，用开放工具自建已比此前更便宜。Three.js、Babylon.js（Amazon Sumerian 开源继任者中提及）和 WebGPU-native 框架都可免费使用；具备开发资源的品牌无需购买 iR
              Studio，也能搭建有能力的网页端 3D 体验，抬高了商品化天花板。

              Amazon Sumerian（AWS）虽处于维护模式，但代表着已在 AWS 生态内品牌可选的托管云替代方案。iR 转向 Napster / AI companion 层后，将面对
              HeyGen、ElevenLabs 和 Synthesia 的商品化压力；这些公司均以更低价格提供 AI 数字人格和 avatar 能力，企业集成更广，履历更成熟。Decentraland 和 The
              Sandbox（web3 metaverse 平台）仍在运营，但尚未获得实质企业采用，其区块链原生架构也限制了广泛品牌部署。使用 Unreal 或 Unity 的独立 XR 机构和定制工作室，在 iR
              可服务市场的更高价值层争夺定制企业部署。这些替代品单独看都无法匹配 iR 声称的全栈广度；但合在一起，它们覆盖了 iR 产品的每一层，且不要求客户绑定单一供应商。
