              Napster 音乐流媒体服务突然被清除——对活跃订阅者没有提前通知，艺术家付款义务未解决，表演权组织索赔仍悬而未决——是 iR
              为战略转型放弃客户群的最可观察表现。如果这种模式在企业沉浸式商务分部重演，对已经投入并接入 iR 平台（Shopify、SAP、Salesforce Commerce Cloud
