      - number: '6.4'
        title: 留存、耐久性与流失信号
        blocks:
          - type: paragraph
            body: >-
              iR 的留存透明度极差。公司没有公开披露任何 SaaS 或企业服务分部的净收入留存（NRR）、总收入留存（GRR）、流失率、平均合同期限或客户 cohort 数据。公司一边自称 recurring-revenue
              platform business，一边引用 $15.5 billion 估值，却缺少标准 SaaS 留存指标；这是重大尽调缺口。

              期内最可观察的留存事件是负面的：Napster 音乐流媒体服务于 2026 年 1 月 3 日突然关闭。活跃订阅者在会话中途失去访问权限，Napster 启动画面宣布「Napster is no longer a
              music streaming service.」Playlist 导出只能通过第三方工具 TuneMyMusic 完成，而且是在服务终止后才部署，而非提前准备。多名在平台使用 14+
              年的订阅者公开表示，几个月前在 Napster 停止向艺术家付款、艺术家开始撤回曲库后，他们已经迁移到竞争对手——尤其是 Tidal。关闭时，performance rights organizations
              仍有未付费指控；这些义务仍未解决。

              Google Cloud 5 年期协议（2025 年 1 月）和 Microsoft Azure 多年合作（2025 年 11 月）是约束 iR
              一侧的基础设施承诺，事实上起到留存锚点作用——但它们是与技术供应商的合作协议，不是企业品牌客户留存证据。iR Studio 2025
              年发布后仍缺席主要第三方评价平台（G2、Capterra、Trustpilot），说明自助采用非常有限，或尚不足以形成评价平台存在感。
