      - number: '8.2'
        title: 融资背景、倍数与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的融资历史不寻常，主要依赖匿名且未经核验的投资者。唯一得到独立佐证的融资，是 2024 年 7 月一笔来自未披露 family office 的 $350 million
              轮，投后估值 $5.1 billion。按当时披露的 2023 年收入 $50 million 计算，该轮约为 102x 收入，本身已远高于行业常态。2025 年 1 月来自 Cole 的 $3.36
              billion 融资从未到账；欺诈被揭露后，iR 于 2026 年 3 月撤销已发行的全部 239 million 股。

              2025–2026 年 spatial/XR/AI 生态的可比估值基准：

              相比周期高点估值，上市 spatial 和 XR 公司倍数已被压缩。Unity Technologies 报告 FY2025 收入约 $1.1 billion，2026 年初市值接近 $3 billion，对应约
              2.7x 收入——反映定价争议和开发者流失带来的结构性挑战。Roblox 约 27x 收入，享有平台溢价；支撑来自网络效应游戏生态、清晰变现、9000 万日活用户和经审计财务。

              私有市场 M&A 可比：CoStar Group 以约 $1.6 billion 收购 Matterport，后者是领先的 3D 沉浸式数字孪生 SaaS 公司，年收入 $158–170 million——约
              9–10x。对已有企业采用记录的沉浸式 SaaS 来说，这是合理的企业价值倍数。Magic Leap 虽然从 Google、Saudi PIF、Alibaba 等投资者处累计融资超过 $4.5
              billion，但仍面临 2026 年临近的现金缺口，并持续依赖 PIF 资金，说明 XR 硬件溢价自 2018 年以来已经坍塌。

              2025–2026 年私有市场 XR / spatial computing VC 数据显示，中腰部平台为 7–12x 收入倍数，拥有强企业 ARR 的品类领导者为 10–20x。AI
              基础模型公司（Anthropic、OpenAI）在 2025–2026 年获得 20–35x ARR 倍数，理由是经核验年收入达到 $14–47 billion 且增长异常强劲。这些溢价不适用于 iR；iR
              缺少经审计财务、经核验企业 ARR 和独立投资者背书。

              更广泛的 VC 市场背景是：down round 占 2025–2026 年全部 venture financing 的 18–22%（2008 年以来持续高位），面向 metaverse 公司的 VC 融资从
              2022 年 $5.6 billion 跌至 2024 年 $1.4 billion。iR 若要以高于 2024 年 7 月估值的价格完成新的机构轮，需要极强理由；现有证据并不支持。
