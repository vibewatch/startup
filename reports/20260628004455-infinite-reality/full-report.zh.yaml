      - number: '7.3'
        title: 合作伙伴与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的产品基础设施压在两家 hyperscaler 上，商业条款与公司公开说法差异很大。五年期 Google Cloud 合作（2024–2029）提供基础设施和 Gemini AI
              模型访问；2025 年 11 月的合作伙伴公告还显示，Napster View 运行在 Microsoft Azure OpenAI 上。尽管 CEO Acunto 在 2025 年 2
              月投资者活动中称公司在「supercharging Gemini」，Google 对 Forbes 的说法只是，Infinite Reality 是一个普通云客户。对一家现金紧张的公司来说，技术伙伴既有
              hyperscaler 定价权，又能按合同随时改 API 条款，这是高严重度依赖。

              最灾难性的依赖断裂发生在音乐版权。Sony Music 原本可在 Infinite Reality 入主后终止四份授权协议，但选择放弃该权利，换取一项四期付款安排。Napster 没有付款。Sony 在 2025
              年 6–7 月终止全部授权，并在 2025 年 8 月起诉。授权终止后，Napster 仍未经授权继续串流 Sony 内容，合同违约之外又叠加故意版权侵权责任。SoundExchange
              数周后也提起平行诉讼。两起权利人诉讼合计索赔 $46.7 million，尚未计入利息。Napster 对 Sony 诉讼的回应是没有提交任何文件；2025 年 10 月，法院作出缺席判决。

              资本依赖方面，Infinite Reality 的融资管线穿过一个 broker-dealer 网络，其中包括 Cova Capital；该机构有 FINRA
              处罚记录，原因是向散户推荐私募股份销售时尽调不足，且未核实发行人股份合法性。没有机构 VC 或 PE 背书，却依赖不透明中介网络，资本获取存在极端集中风险。
