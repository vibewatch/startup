      - number: '2.4'
        title: 增长驱动与市场催化
        blocks:
          - type: paragraph
            body: >
              五股结构性力量正在压缩沉浸式平台的采用周期。

              AI 驱动内容创作：Obsess 报告称，生成式 AI 已把虚拟门店初始概念设计时间减半；更广泛预期是，AI 最终会自动化完整的 3D 门店从设计到上线流程，把当前 2–3
              个月的项目周期压缩到数天。这直接击中企业部署中摩擦最高的障碍。

              5G 与边缘计算：超低延迟消除了让现场活动 XR 难以规模化的毫秒级延迟障碍。工厂车间、手术室和体育场馆是主要受益者。接入边缘计算后端的 XR 硬件，可在轻量客户端上支持实时 60fps 体验。

              硬件多元化：智能眼镜目前约占所有 XR 设备出货量的一半，高于 2024 年的 25%，把可触达的消费者设备基础从笨重头显扩展出去。这扩大了 iR 网页端 3D 体验的可服务受众，且不要求用户拥有 Meta
              Quest 或 Apple Vision Pro。

              企业 ROI 验证：VR 学习者完成培训速度快 4×，行动信心高 275%（PwC）；Boeing 报告称用 AR 指引后线束装配快 25%；Walmart
              把一个培训模块从八小时压缩到十五分钟。这些案例研究建立了预算论证模板，能加速下游销售周期。超过 50% 的企业 XR 部署方计划在 12–24 个月内扩大使用。

              EaaS 模式出现：沉浸式娱乐和平台市场正转向订阅与 Experience-as-a-Service 收入结构，沉浸式娱乐中的赞助和品牌合作到 2031 年以 12.34% CAGR 增长。这一结构性转变支持
              iR 这类平台获得经常性收入，而非一次性项目费用。
