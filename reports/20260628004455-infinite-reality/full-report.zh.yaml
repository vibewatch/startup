      - number: '7.5'
        title: 人员、执行风险与否决标准
        blocks:
          - type: paragraph
            body: >-
              CEO John Acunto 的关键人集中，是最高等级的结构性治理风险。Forbes 2025 年 4 月调查发现，Acunto 声称拥有 University of Florida 博士学位和 Harvard
              硕士学位，但两所学校均未确认；他也拒绝说明自己在哪里——或是否——读过大学。他的运营历史包括至少六个州的诉讼，以及 2024 年和解的两项大额个人判决，合计 $1.18 million。Infinite
              Reality 董事会没有公开确认任何独立董事。2025 年 9 月，CFO Brian Effrain 和 CLO Jennifer Pepin 双双离职——SEC 和 DOJ
              调查正加速之际，公司失去了财务治理和法律合规的两名关键高管。

              2024 年 12 月，联合创始人 Rodric David 起诉要求查阅公司财务文件，称自己试图「understand the valuation」并「evaluate the Company's
              adherence to proper corporate governance standards」。该案于 2025 年 3 月被驳回。前员工和收购交易对手公开把公司的产品公告称为「ChatGPT word
              salad」，并称合同实践中存在「very serious cash flow issues」。这些负面内部人说法，是执行文化的重大信号。

              本投资的否决标准可执行且有明确时限。DOJ 或 SEC 程序若升级并将 Infinite Reality 或 Acunto 列为被告，投资逻辑立即破裂。若自本 runDate 起 12
              个月内不能完成一轮干净的机构融资（非 broker 撮合，来自经核验机构来源），则说明资本获取能力已永久受损。Sony Music 缺席判决若被执行，或更多 major-label 版权诉讼被提起，将损害
              Napster 剩余品牌价值。表 TR004 和 TR005 用可衡量阈值列出了这些触发条件。
