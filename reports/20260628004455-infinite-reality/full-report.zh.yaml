      - number: '3.2'
        title: 直接沉浸式商业与 3D Web 平台竞争对手
        blocks:
          - type: paragraph
            body: >-
              在直接 3D 商业和沉浸式 Web 平台层，截至 2026 年中仍存活、最可信的独立竞争对手是 Emperia（London，2019 年成立），它用虚拟零售 SaaS 平台服务奢侈品和时尚品牌。Emperia
              累计融资约 $10.9 million，包括 2023 年 1 月由 Base10 Partners 和 Sony Innovation Fund 领投的 Series A，Daphni、Background
              Capital 和 Stanford Capital Partners 也参与。客户包括 Bloomingdale's、Dior、Burberry、Lacoste、Tommy Hilfiger、Harrods 和
              Giorgio Armani。2025 年估计年收入约 $5.5 million，估值约 $16.5 million，员工约 50 人。Emperia 报告称，相比传统 2D 电商，品牌伙伴平均转化率提升
              73%、平均 ROI 达 750%，提供了 iR 尚未用独立验证指标匹配的、有记录的 ROI 叙事。这直接挑战 iR 在同一奢侈品和时尚买方细分中的定位。

              VNTANA（Los Angeles）聚焦企业零售、时尚和制造业的 3D 产品可视化与数字资产管理。截至 2026 年，VNTANA 累计融资约 $18.1 million，估计年收入约 $5
              million，员工 28–37 人，所处的是相邻层——3D 资产优化和 AR / VR 交付——而非完整门店创建。ByondXR（Tel Aviv，2015 年成立）完成 $7 million 种子轮融资，在
              2025 年 9 月停运前曾为 P&G、LEGO、Lancôme 和 Kraft Heinz 提供沉浸式商业体验。ByondXR 退出，加上 iR 收购 Obsess 和
              LandVault，意味着供应商格局明显整合，品牌评估 3D 商业平台时，可选的可信独立替代品更少。Emperia 和 VNTANA 合计累计融资约 $29 million，而 iR 自报估值为 $15.5
              billion；即便 iR 实际资本状况严重受损，这一对比仍显示出规模差距。
