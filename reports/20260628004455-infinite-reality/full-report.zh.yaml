              Mac（2025 年 10 月）以及移动 app 改版（2026 年 1 月）构成 AI 伴侣产品弧线。Omniagent API（2026 年 5 月）和 NV2 视频模型（2026 年 6 月）确认了企业
              API 变现方向。

              Thunder Studios Originals 部门（2026 年 5 月成立）说明公司借助 AI 工具重新加码内容制作。由合作伙伴驱动的部署——Formula 1 Spa Grand Prix AI
              concierge（2026 年 6 月）、ITB Berlin AI visitor experience（2026 年 3 月）和 EuroShop 2026 retail showcase（2026 年 2
              月）——展示了围绕活动绑定 B2B 试点的获客模式。Solgari 与 Microsoft Teams / Dynamics 365 的集成（2026 年 2 月）是迄今最深的企业工作流集成。Napster 26
              的 PC 支持，以及更广泛的 Android 和 iOS 可用性，均宣布将于 2026 年推出，但截至报告生成日仍未交付。截至 2026 年 6 月，Touchcast
