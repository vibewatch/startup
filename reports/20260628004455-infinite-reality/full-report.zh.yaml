      - number: '3.5'
        title: 差异化、切换成本与分发能力
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 声称的差异化集中在三根支柱：（1）数据所有权——品牌保留全部第一方互动数据，而不是交给平台；（2）设备无关——iR Studio 体验可在主流浏览器中渲染，无需下载 App
              或使用头显；（3）全栈整合——把无代码创作（iR Studio）、企业服务（iR Enterprise）、3D 引擎（iR Engine）以及被收购的垂直能力（Obsess 虚拟门店、LandVault
              数字孪生、Touchcast AI agents）组合起来。全栈叙事同样是主要整合风险：把五个或更多分别构建的系统统一到共同平台上，是未经验证的执行假设；公司尚未拿出跨产品的独立客户证据。

              企业沉浸式 Web 的切换成本最多只能算中等。基于某一平台自有工具链搭建的虚拟门店体验，迁移到任何替代平台都需要重建，从而形成一定资产级锁定。但由于缺少标准化 3D
              内容交换格式，大多数定制资产无法移植；这把锁定推向两边：品牌有一定锁定，iR 留住客户时也被锁住，因为竞争者要替换它就必须完整重建资产。相比 Roblox 和 Fortnite，iR
              的分发护城河很薄：它完全依赖品牌为托管体验自行导流。多归属很容易——品牌可同时为一个地区运营 Emperia 门店、为另一个地区部署 iR Studio——限制了独占捕获。LandVault 的 MENA
              网络（UAE 和 Saudi 政府旅游局、房地产）、Google Cloud 企业 RFP 伙伴关系，以及 Obsess 超过 400
              个全球品牌客户名单，是公司的主要分发优势。三者都依赖关系，并可能受到正在进行的法律程序冲击。
            claimRefs:
              - CP019
              - CP030
              - CP031
