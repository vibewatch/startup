      - number: '1.5'
        title: 公司里程碑与时间线
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的公司史，是七年连续 M&A 驱动的转型。公司源于 2019 年收购破产的点对点社交媒体平台 Tsu，随后更名为 Display Social。自 2022 年起，Acunto
              利用按不断上升的自报估值定价的全股票收购，搭建多元化沉浸式技术资产组合：Thunder Studios（Hollywood 制作，2022 年 1 月）、ReKTGlobal esports（2022 年 7
              月）、Ethereal Engine 3D Web 引擎（2024 年 2 月）、Stakes 社交体育（2024 年 4 月）、Drone Racing League（2024 年 4 月）、LandVault
              metaverse 基础设施（2024 年 7 月）、Napster 音乐品牌（2025 年 3 月）以及 Touchcast agentic AI（2025 年 4 月）。Touchcast
              交易公告发布时，$3 billion 投资者仍被描述为真实存在。

              负面事件正在加速。两次 SPAC 上市尝试失败（2022 年 12 月和 2024 年）。Forbes 2025 年 4 月发布的调查，对学历、融资和伙伴关系声明提出系统性质疑。$3 billion 融资在
              2025 年 11 月崩塌，随后出现大规模裁员和 C-suite 离职。Napster 音乐流媒体服务于 2026 年 1 月突然关闭，引发订户反感，并留下未解决的表演权义务。截至本报告运行日，SEC 和 DOJ
              调查仍在继续。
