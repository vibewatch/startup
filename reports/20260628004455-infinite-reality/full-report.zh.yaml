      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的运营风险画像，反映出它在没有公开整合路线图或统一技术架构的情况下，快速以全股票方式收购十多家子公司的后果。2025 年 7 月，合并后员工中约三分之一——估计 100
              名开发者——被裁，管理层称这是清理收购带来的冗余。在执行重大 AI 平台转型的同时压缩工程团队，这显著放大了执行风险。

              2026 年 1 月初，Napster 在活跃订阅者会话中途突然关闭音乐流媒体服务，显示启动画面称「Napster is no longer a music streaming
              service.」迁移工具引导受影响用户通过 TuneMyMusic 导出 playlist；多名用户称已完全放弃该平台，其中一人提到 14+
              年历史就此断裂。该运营事件造成可衡量的品牌伤害，也说明没有客户迁移规划的商业模式转换十分脆弱。

              公司的新 AI 产品 Napster View 目前仅在 Mac 硬件运行，需要 $99 专有硬件单元，或软件版每月至少 $20 订阅。独立评测提到对话延迟、迎合式 AI
              回复和恐怖谷动画同步失败，说明产品成熟度仍处早期。安全侧，Napster 声称拥有 SOC 2 Type II 认证（年度独立审计）、GDPR 和 CCPA 合规、静态 AES-256 加密、传输中 TLS
              1.2+、年度渗透测试，并明确禁止用用户数据训练 AI 模型。这些认证由公司声称；独立审计报告仅在 NDA 下向企业客户提供。Agentic AI 产品扩张会处理摄像头画面、LinkedIn 资料和用于创建
              digital twin 的语音样本，由此产生的企业级数据隐私责任尚未量化。
