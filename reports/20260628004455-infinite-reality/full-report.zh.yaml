      - number: '5.2'
        title: 核心技术栈与基础设施
        blocks:
          - type: paragraph
            body: >-
              iR Engine 是基础渲染层。它最初是 Ethereal Engine（Liam Broza、Kyle Baran 及团队于 2020 年创立），基于 JavaScript
              框架构建，完全浏览器原生运行，不需要下载客户端。它支持可扩展多人体验，包含语音、视频、表情丰富的头像和可视化编辑器，可在桌面、移动端和 Apple Vision Pro、Meta Quest 2
              等可穿戴设备访问。开源核心模式意味着代码库可在
              GitHub（ir-engine/etherealengine-archive）公开获取，但与成熟游戏引擎生态相比，该仓库释放出的开发者社区信号有限。Ethereal
              过往客户名单（T-Mobile、Johnson & Johnson、Ripple、LAX）提供了企业参考基础，收购后转移至 iR。

              Touchcast 的 AI agent 层基于 Microsoft Azure 构建，据称依托 $50 million 战略合作，并使用 OpenAI 模型。Touchcast 的 cognitive
              caching 技术据称可把 AI 能耗最多降低 50%，并通过在终端用户设备而非云 GPU 上渲染 AI 视频，把响应速度最多提升 100 倍。Touchcast 持有 27 项专利，覆盖协同 AI
              群组演示、视频会议增强和智能虚拟助理系统。这些专利是 IP 组合中最有防御性的部分，并获得 ClimaTech Great Global Innovation Challenge 奖和 Accenture
              V360 Customer Award。Microsoft、HSBC、Pfizer 和 Imperial Business School 都曾信任 Touchcast。

              基础设施层面，iR 拥有一项 5 年期 Google Cloud 合作（2024 年 9 月签署），为 3D web 体验提供 Gemini AI 模型访问和云基础设施。iR Studio 自 2025 年 4
              月起通过 Google Cloud Marketplace 分发。Azure（AI agents）与 Google Cloud（3D / 空间体验）的组合形成多云依赖，增加运营复杂度和供应商集中风险。
