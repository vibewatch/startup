      - number: '5.5'
        title: 信任、安全、信息安全与合规
        blocks:
          - type: paragraph
            body: >-
              Napster 平台的安全姿态记录在 napster.com/security 页面和 Touchcast 收购公告中。公司持有 SOC 2 Type II 认证，每年 4 / 5
              月由独立审计机构审计。基础设施运行在 Microsoft Azure 上，静态数据采用 AES-256 加密，传输中采用 TLS 1.2+。多租户逻辑隔离将客户数据隔开，并保留基于角色的访问控制和 6
              个月审计日志。企业客户可索取年度 SOC 2 报告、渗透测试报告和安全问卷回复。公司明确表示绝不会用客户数据训练 AI 模型，并对第三方 AI 伙伴施加合同要求。

              隐私合规覆盖 GDPR、CCPA，并明确覆盖 2026 年 1 月 1 日生效的 California AI agent chatbot regulation；该法规要求披露用户正在与 AI 互动。Napster
              在所有 agent prompt 中内置情境化 AI 披露，要求 digital twin 显示「Verified Agent」徽章，并为有风险用户维护危机转介协议（988 Suicide and Crisis
              Lifeline、Crisis Text Line）。Digital twin 创建仅限 18
              岁及以上用户，要求身份验证，并用人脸数据库筛查已知公众人物，防止未经授权的肖像。企业客户可将区域数据驻留作为高级能力。Napster View 硬件设备缺少公开披露的 FCC
              认证文件，也没有针对该设备隐私或安全合规的独立审计，形成缺口。
