      - number: '8.4'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              没有经审计财务时，可辩护的估值必须锚定情景，并明确假设法律悬顶、收入质量和管理层可信度如何解决。

              熊市情景（$25–75 million）：SEC 调查扩大至 iR 领导层，债权人加速追加违约行动，或公司无法获得新资本。在这一情景下，诉讼准备金、债权人索赔和运营现金消耗会吃掉股权，剩余价值接近于零。2024
              年 7 月轮的 $350 million 优先清算权，将在任何现实退出价格下消灭普通股权益。

              基准情景（$100–250 million）：SEC / DOJ 调查以 Cole 为唯一被告结束，iR 重组管理层和治理，并完成特定组合资产的战略出售。按 $75 million 未审计收入，以及符合行业的
              1.5–3x 收入倍数（因未审计财务、法律悬顶和市场压缩而折价），企业价值将落在该区间。所有收益会先满足 $350 million 优先清算权，几乎任何退出情景下普通股股东都拿不到钱。

              牛市情景（$300–600 million）：战略买家看重 Drone Racing League 媒体版权和 Thunder Studios 制作能力，重组后的管理团队在 24 个月内跑出经验证的
              $100–150 million ARR run-rate，法律问题全部解决。按 3–4x 收入计算，企业价值为 $300–600 million——相较 $15.5 billion 自报峰值仍折价
              89–97%，且多数结构下仍低于 $350 million 优先股悬顶。

              没有任何情景支持 $12.25 billion–$15.5 billion 的自报区间。即便在法律问题完全解决、收入基础得到验证的慷慨牛市情景下，可比公司组（Matterport 9–10x、Unity
              2.7x、XR 行业 7–12x）也无法提供通往 >$1 billion 退出的路径，除非公司已拥有规模化且经证明的企业 ARR、经审计财务和机构背书——iR 目前三者皆无。
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
