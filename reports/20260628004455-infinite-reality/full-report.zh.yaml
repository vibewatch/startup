  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality（iR）在三个松散耦合的市场细分中竞争，每个细分都有不同对手。核心细分——沉浸式 Web 与 3D 商业平台——在 2024 年仍是早期、碎片化市场，没有主导型在位者。买方若不用
              iR Studio，最大的替代选择就是现状：传统 2D 电商网站（Shopify、Salesforce Commerce Cloud、定制搭建），它们没有平台迁移风险，第三方集成广，SaaS
              生态大。第二个细分是企业 agentic AI，iR 通过 2025 年 4 月收购 Touchcast 进入该领域；这里由资本雄厚的在位者主导，包括 Salesforce
              Agentforce、Microsoft Copilot Studio、Google Vertex AI Agent Builder 和 AWS Bedrock。第三个细分是体育和娱乐媒体，由 Drone
              Racing League 代表，竞争替代品包括 MultiGP 和成熟赛车转播商。

              2024 年至 2026 年中，沉浸式 3D 商业的竞争动态发生实质变化。两个能力最强的直接竞争对手——Obsess（为 Ralph Lauren、L'Oréal、J.Crew、Disney Music
              Group 建设 400+ 个虚拟门店）和 LandVault（为 Fortune 500 客户建设 1.2 million sq ft 虚拟体验）——都通过全股票收购并入 iR 资产组合。最可见的平台级威胁
              Meta Horizon Worlds，在 Reality Labs 自 2020 年以来估计亏损 $70–80 billion 后，于 2026 年 6 月 15 日关闭 VR 版本。Niantic 的 8th
              Wall 是按项目每月收费 $700–$3,000 的付费 WebAR 工具，2026 年 2 月开源，商业产品完全退出。服务 P&G、LEGO 和 Lancôme 的种子轮沉浸式商业平台 ByondXR 于
              2025 年 9 月倒闭。净效果是：iR 最有能力的对手要么被收购、要么撤退、要么失败，剩下的独立层级碎片化且整体规模不足。
