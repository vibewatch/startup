      - number: '8.5'
        title: 建议、尽调要求与退出准备度
        blocks:
          - type: paragraph
            body: >-
              建议：AVOID。基于 iR 自报 $12.25–$15.5 billion 估值的任何公开价格点，在当前证据基础下都无法支撑。入场纪律要求：（1）独立审计财务，确认收入质量和分部拆分；（2）SEC 和 DOJ
              调查完全解决；（3）建立独立治理结构并具名董事会成员；（4）按市场合理倍数重定价估值（1.5–10x 经核验收入）；（5）有可信机构共同投资者，身份披露且承诺资本经核验。

              退出准备度低。自 2022 年以来，公司已有四次独立的要约收购或 SPAC 退出失败。在当前监管条件下，IPO 路径不可行。最可能的退出仍是困境资产战略收购，针对特定组合资产——DRL 媒体版权、Thunder
              Studios 制作能力或 LandVault 企业 IP——价格将远低于优先清算权。

              若未来启动尽调流程，任何接触前的最低要求应以 Final Diligence Asks 表列项为准。无论其他条件如何，若出现会立即推翻投资案例的 thesis-break 触发因素，均列入
              Thesis-Break Triggers 表。
