chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality Inc.（iR）正式沿用 2022 年后的公司名称，其公司源头可追溯到 2019 年：联合创始人兼 CEO John Acunto 收购了 Connecticut
              破产社交媒体公司 Tsu，并将其更名为 Display Social。2022 年 1 月，公司把 Display Social 与另一家同样名为 Infinite Reality、聚焦 metaverse
              的实体合并，交易为 $235 million 全股票交易，合并后估值 $1 billion；Infinite Reality 品牌由此确立，也开启了激进收购。到 2024 年，运营总部已迁至 Florida
              Boca Raton；直到 2025 年 4 月 Touchcast 交易公告，新闻稿仍持续引用该地址。

              公司的核心产品是 iR Studio，一个无代码和低代码 SaaS 平台，让品牌和创作者把传统 2D 网站转成沉浸式、三维虚拟店面，并可直接通过网页浏览器访问。补充产品包括 iR Engine（自有 3D Web
              引擎）、iR Enterprise（面向大客户的定制沉浸式方案）、Thunder Studios（获 Emmy 奖的制作与播出业务）、TalentX（影响者经纪管理，声称覆盖 200+ million
              粉丝）、Drone Racing League，以及 2025 年 5 月后纳入的 Napster 品牌；Napster 的流媒体服务已于 2026 年 1 月关停，品牌被重新部署为 AI
              驱动的数字体验平台。商业模式把 SaaS 订阅、专业服务、媒体权益和被收购子公司的赞助收入拼在一起，但公司从未公开披露按分部拆分的经审计收入。
