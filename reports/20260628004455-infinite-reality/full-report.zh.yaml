  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              为 Infinite Reality 做任何市场规模测算，首先要划清边界：公司是平台和服务运营商，不是硬件制造商；其可服务支出不包括流向 Meta、Apple、Sony 和头显 OEM 的 VR / AR
              设备收入。iR 的竞争面横跨三层不同的软件与服务：（1）面向品牌的沉浸式平台工具（虚拟店面、3D 商业界面、AI
              辅助内容创作）；（2）体育和娱乐场馆体验（粉丝互动、现场活动叠加层、品牌激活）；（3）企业空间计算服务（数字孪生、培训模拟、政府和房地产数字复制体）。Roblox 和 Fortnite 等纯消费游戏生态不属于
              iR 的直接可服务市场，因为 iR 的模式是 B2B——它向品牌或企业收费，而不是向终端消费者收费。

              不同垂直的现状替代品并不相同。品牌商业的既有方案是 2D 电商网站和数字广告活动。体育和娱乐的替代品是传统转播、场馆内赞助激活和标准移动应用。企业培训的替代品是讲师主导课程和 LMS
              平台。对估值最关键的边界结论是：常被称为「真实 TAM」的 $225B 空间计算生态，包含大量硬件和基础设施层，iR 既不控制，也无法从中获取经济收益；因此只有收窄到 SAM 视角，分析才有用。
