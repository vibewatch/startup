      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >
              没有单一分析师估计能可靠刻画 iR 的可服务市场，因为公司横跨多个被分别跟踪的类别。最窄的相关层——XR 平台软件——Mordor Intelligence 估计 2026 年为 $10.64B，2031 年增至
              $59.18B，CAGR 为 40.95%。另一个极端是 Fortune Business Insights 对更宽泛「extended reality」市场的估计：2026 年 $346B，2034 年以
              25.5% CAGR 增至 $2.13T；该口径包含 iR 并不销售的硬件、基础设施和相邻使能技术。

              沉浸式娱乐市场——涵盖品牌体验、现场活动场馆和数字粉丝互动——2026 年规模位于 $146.92B（Mordor，12.16% CAGR）至 $185.7B（Fortune Business
              Insights，26.7% CAGR）之间。Obsess 和 iR Studio 所在的 3D 电商细分市场，2026 年价值为 $10.54B，CAGR 为 23.6%。按硬件加软件口径计算，AR / VR
              市场 2026 年估计为 $41.8B，CAGR 为 29.1%（Coherent Market Insights）。把 XR 平台层、沉浸式娱乐中的品牌 / 沉浸式商业切片，以及 3D
              电商市场合并，可得到一个受证据约束的 SAM 估计：在 iR 有实际部署的软件与服务层，约为 $50–60B。该数字仍只是粗略代理：iR 不披露收入或 ARR，也没有分析师报告专门拆出 iR
              所处的多垂直沉浸式平台即服务细分。
