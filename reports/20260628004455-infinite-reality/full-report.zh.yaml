      - number: '7.4'
        title: 财务、资本结构与欺诈风险
        blocks:
          - type: paragraph
            body: >-
              $3.36 billion 融资彻底失败，是 Infinite Reality 历史上最关键的财务事件。2025 年 1 月至 11 月，公司向股东、收购标的和交易对手表示，这笔资本已经承诺或可动用。2025 年
              3 月，公司 CMO 告诉 Forbes，资金「in an Infinite Reality account and available to us」，公司也在「actively
              leveraging」这笔资金。实际没有任何资金到账。DOJ 起诉书把 Cole 定性为作案人；但 Infinite Reality
              知道什么、何时知道，仍是判断欺诈风险仅来自第三方，还是延伸到公司自身陈述的核心问题。

              在这一背景下，公司公开宣称的 $15.5 billion 估值，对应其自报 2024 年收入 $75 million，约为 207x 收入倍数；相比之下，Anthropic 和 OpenAI 近期融资约为 44x
              和 24x。Infinite Reality 运营至今，从未披露对收入、收购估值或资产负债表的独立审计。所有收购——票面价值合计超过 $2
              billion——均完全以公司股票完成，而股票价值来自这个无法核验的估值。风险因此层层放大：股价一旦受损，过去和未来交易中的交易对手信任会同时松动。

              既有现金流缺口证据充分。债权人以未付款为由提起的诉讼覆盖至少六个州，可追溯到 2022 年。2024 年 12 月，TD Cowen 获得 $3.25 million 判决。股东要约收购被取消——这是 2022
              年以来第四次取消——也堵死了现有投资者剩余的流动性路径。Sacra 估计，若计入有争议轮次，Infinite Reality 累计融资约 $3.4 billion；实际可用现金仍未披露。公司有 200+
              名员工，没有经审计收入，还背着 $46.7 million 诉讼责任悬顶，外部投资者几乎看不清其 runway。
