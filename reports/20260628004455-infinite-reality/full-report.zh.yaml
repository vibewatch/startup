      - number: '3.6'
        title: 护城河耐久性与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              除直接产品竞争外，Infinite Reality 的竞争耐久性还面对四个结构性威胁。第一，$3 billion Cole 投资崩塌，摧毁了 iR 竞争战略核心的资本部署论点。SEC
              民事案件（LR-26563）和 DOJ 刑事起诉均于 2026 年 6 月 11 日解封，确认 iR 在未收到任何对价的情况下发行了 239 million
              股。上市公司或受监管公司的企业采购团队，通常会筛查供应商是否有未结诉讼和监管敞口；iR 作为被点名发行人卷入活跃 SEC 执法行动和 DOJ
              起诉，会出现在常规供应商尽调中，使其在对比任何没有此类敞口的对手时面临重大逆风。

              第二，Napster 品牌转向在内容创作者和权利持有人群体中造成声誉损伤。表演权组织指控原流媒体服务未付款；平台在 2026 年 1 月用户仍在收听时突然关闭，也损害了 iR 想用 AI
              产品捕获的数字原生受众信任。第三，商品化正在加速：8th Wall 开源和 WebGPU-native 3D 框架可用，抬高了品牌内部开发团队无需供应商即可搭建体验的质量天花板，直接压缩 iR
              的定价权。第四，在通过 Touchcast 收购进入的 agentic AI 细分，iR 要对抗 Salesforce（市值 $270-plus billion）、Microsoft、Google 和
              AWS——这些在位者的分发、R&D 预算和客户信任高出数个数量级。没有独立证据显示 Touchcast 在竞争性企业评估中胜过这些替代方案。
            claimRefs:
              - CP001
