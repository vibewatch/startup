      - number: '3.3'
        title: 平台在位者与消费级 Metaverse 对手
        blocks:
          - type: paragraph
            body: >-
              iR 沉浸式 Web 愿景面临的最大潜在竞争威胁，来自拥有分发规模的平台在位者：Meta（Horizon Worlds）、Epic Games（Fortnite UEFN）和 Roblox。到 2026
              年中，在位者威胁画像已显著变化。Meta 确认于 2026 年 6 月 15 日关闭 Horizon Worlds 的 VR 版本，此前 Reality Labs 自 2020 年以来估计运营亏损 $70–80
              billion，用户数据多年令人失望（月活仅低数十万），2024 年 Reality Labs 亏损 $17.7 billion。Meta 同时于 2026 年 2 月停运企业 VR 协作工具 Horizon
              Workrooms。公司已完全转向移动、AI 和 AR 智能眼镜，退出企业沉浸式商业细分。对 iR 而言，这是双刃剑：它移除了资源最强的在位者，也验证了该市场规模化的结构性困难。

              Epic Games 的 Unreal Editor for Fortnite（UEFN）面向大规模品牌虚拟体验部署和活动，可动用数亿 Fortnite 用户。Roblox
              同样向品牌提供持久虚拟世界，服务数亿月活用户，估计年收入超过 $3 billion。两者都提供 iR 完全缺失的发现式分发：Roblox 或 Fortnite
              上的品牌体验可触达庞大既有受众，无需品牌自行导流。iR 的反向定位是数据所有权和品牌主权：Roblox 或 Fortnite 上的体验受平台规则、估计 30–50% 的收入分成和算法发现机制约束。Unity 和
              Unreal Engine 作为底层创作工具不是直接竞争对手，但它们设定了衡量 iR 自有 iR Engine 能力的基准。在 agentic AI 细分，Salesforce
              Agentforce、Microsoft Copilot Studio 和 Google Vertex AI Agent Builder 均在 2025–2026 年显著扩张，构成 iR Touchcast
              层的企业 agentic AI 竞争集合。
