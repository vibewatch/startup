      - number: '4.4'
        title: 资本充足性、融资依赖与流动性
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 历史上唯一确认到账的真实现金融资，是 2024 年 7 月完成的 $350 million 股权投资，投资方为一家私人 multi-family office；Newbury
              Street Acquisition Corporation 在 SEC EDGAR 文件中记录了该交易。该轮被描述为全股权融资（非债务），独立于 SPAC
              合并，并指定立即投入以加速增长。按合理运营成本和收购整合开支估算，到 2025 年 11 月 $3.36 billion 欺诈性投资崩塌时，这笔资金可能已经大部分或全部投入使用。

              2025 年 1 月宣布的 $3.36 billion 投资，后来被确认是 Charles J. Cole 策划的欺诈计划。Cole 虚称拥有 $55 billion 资产，但从未汇入任何资金。Infinite
              Reality 向 Cole 及其实体发行了 239 million 股，随后在 2026 年 3 月撤销。公司在 2025 年 11 月 20 日股东会上公开承认该投资不会落地，约 700 名参会者出席。从
              2025 年 1 月宣布融资到 2025 年 11 月崩塌，iR 继续以 $207 million 收购 Napster、宣布以 $500 million 收购 Touchcast，并公开规划 Fort
              Lauderdale 60 英亩总部园区——这些计划都建立在并不存在的资本之上。

              未偿财务义务进一步加剧流动性担忧。TD Cowen 2024 年 12 月因 ReKT 收购相关未付费用赢得 $3.3 million 判决。Summit Partners 要求返还 2022 年协议下超过
              $27 million 的股份。Sony 就 Napster 未付版税取得 $9.2 million 缺席证明。2023–2024 年另有 4 起承包商 / 供应商欠款诉讼。与 NBST（Newbury
              Street Acquisition Corporation）的 SPAC 合并截至 run date 仍待完成，且 2024 年 9 月延期截止后，公司没有公开更新 Nasdaq
              合规状态。公司未披露债务或授信安排信息。
