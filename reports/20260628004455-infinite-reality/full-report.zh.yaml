      - number: '4.2'
        title: 公开财务牵引与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的公开财务披露很稀疏。公司自报 2024 年收入 $75 million（高于 2023 年的 $50
              million），但没有独立审计师确认这些数字。运营公司没有提交或公开发布损益表、资产负债表或现金流量表。EDGAR 中可访问的 SEC 财务文件只与 Newbury Street Acquisition
              Corporation（SPAC 壳）有关，不涉及作为运营实体的 Infinite Reality。Growjo 基于员工和公开信号代理估计年收入为 $84.4
              million——与公司自身披露一致，但并不能验证它。

              缺少经审计财务，意味着无法独立核验收入确认政策、递延收入处理、子公司之间的内部抵销，或与 2024 年 $800 million-plus 收购活动相关的商誉和无形资产摊销。Infinite Reality
              的投资者关系网站此前列出 RSE Ventures、Lux Capital、Lerer Hippeau 和 Agnelli 家族的 Exor 等知名投资者；这些机构都是通过此前持有 Drone Racing
              League 股权而成为 Infinite Reality 股东，因为 iR 收购了 DRL。没有证据确认它们直接投资 Infinite Reality；Forbes 开始询问该不一致后，投资者页面被移除。

              两项具体伙伴和客户声明已被公开否认。Google 向 Forbes 表示，Infinite Reality 只是普通 Google Cloud 客户；而公司此前声称与 Google
              有「五年战略伙伴关系」。Manchester City Football Club 否认自己是官方伙伴或供应商，仅表示一家第三方承包商曾在一个多伙伴项目的「一小部分」中使用 iR 的 Thunder
              Studios 子公司。这些具体否认动摇了其他客户和伙伴披露的可信度。公司没有公开披露 ARR、净收入留存、毛利率、客户数或流失率。
