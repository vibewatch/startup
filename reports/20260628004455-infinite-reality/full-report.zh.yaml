      - number: '6.6'
        title: 渠道、伙伴与分发触达
        blocks:
          - type: paragraph
            body: >-
              iR 的分发表面横跨 6 个不同渠道：直接企业销售（服务 Fortune 500 和政府客户的 iR Enterprise 服务）、自助 SaaS（面向 SMB 和 creators 的 iR
              Studio）、第三方平台分发（通过 Obsess 部署在 Roblox 的体验）、体育转播（DRL 的 320 million 户家庭网络和流媒体协议）、网红驱动的品牌交易（TalentX 的 200M+
              follower creator network，促成品牌活动投放），以及企业 AI 经销 / 咨询伙伴（Microsoft 伙伴渠道，Cooper Parry 试点由 Leading Results
              咨询公司交付就是例子）。

              2025 年 11 月宣布的 Microsoft Azure Agentic AI 合作，是 iR 企业 AI 分发策略最可信的验证：Napster 被定位为「among the first Microsoft
              partners」，为企业客户部署 Azure Agentic AI；Microsoft 区域 GM Myladie Stoumbou 也被直接引用，为合作背书。该伙伴渠道位置——把专有 AI personas
              与 Azure 的企业合规和全球基础设施结合——是 iR 对 Napster AI 产品线 land-and-expand 逻辑最清晰的表达。不过，该渠道目前只有一个具名商业试点（Cooper
              Parry）被公开确认，试点转为经常性合同的商业转化率未知。

              TalentX 的网红网络被描述为代表合计 200+ million 粉丝的 creators，但未经独立验证，公司也未披露活跃 creator 数、交易流或收入贡献。DRL 的转播足迹通过体育网络分发协议触达约
              320 million 全球家庭，是 iR 组合中触达最高的分发资产——但收购后，该受众能否持续转化为企业赞助收入尚未验证。
