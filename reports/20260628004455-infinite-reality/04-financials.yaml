  - id: cost-structure-unit-economics
    title: Cost Structure, Unit Economics, and Gross Margin
    body: >-
      No gross margin, cost of goods sold, or cost-of-service data has been publicly disclosed for Infinite Reality. The
      company's blended revenue model combines enterprise professional services, software subscriptions, content/media rights,
      and digital assets—each with vastly different margin profiles. Enterprise services and custom experience production are
      labor- and infrastructure-intensive and typically yield gross margins of 20–40% for comparable agencies. SaaS
      subscriptions, if they scale, could reach 60–80% gross margins. The actual blended figure is unknown.

      GamesBeat reported in July 2024 that Infinite Reality had approximately 140 employees before the LandVault acquisition,
      with LandVault adding 36. The Founders Magazine reported in 2025 that approximately one-third of staff were laid off
      in mid-2025, which suggests a workforce of approximately 100–175 as of late 2025 and indicates the company was under
      meaningful labor cost pressure. No compensation benchmarks, cloud infrastructure costs, media-rights fees, or
      integration-cost disclosures have been made. Unit economics—customer acquisition cost (CAC), lifetime value (LTV),
      payback period, or net revenue retention—have never been disclosed or estimated by a credible third party.

      The cost structure has material complexity due to the conglomerate-style portfolio spanning music, eSports, production,
      XR software, and enterprise consulting. Integration of eight acquisitions in a twelve-month period would typically
      generate substantial one-time restructuring and redundancy costs, and the mid-2025 workforce reduction confirms that
      integration overhead was significant. Working capital management has also been publicly strained: multiple vendors
      filed lawsuits for non-payment, and the company's CMO acknowledged cash flow problems in 2023 and 2024.
    claimRefs:
      - CI023
