      Revenue multiple computed from $75M revenue vs. the two valuation endpoints. Total acquisition value range:
      low ($1.614B) = 2024 confirmed deals only (DRL $250M + LandVault $450M + Ethereal $75M + Action Face $10M + Stakes $8M +
      Zappar $45M + Napster $207M + Touchcast $500M minus double-counting = $1.545B, add $100M est. cash); high ($2.115B)
      includes full stated values. Most acquisitions were all-stock.
    claimRefs:
      - CI001
      - CI014
      - CI035
      - CI013
      - CI041

  - id: FI004
    title: Capital Intensity and Cash-Flow Map — Confirmed vs. Claimed
    type: waterfall
    layout: standard
    summary: >-
      Waterfall showing confirmed cash inflows against estimated deployment and obligation outflows, anchored on the only
      verified real equity raise and contrasting with the fraudulent $3.36B that never arrived.
    data:
      items:
        - label: "Confirmed equity raise (Jul 2024)"
          value: 350
        - label: "Estimated operating burn 2024–mid-2025 (12 mo × ~$5M/mo)"
          value: -60
        - label: "Cash portion of acquisitions (est.; mostly all-stock)"
          value: -40
        - label: "Vendor judgments and legal settlements (known)"
          value: -40
        - label: "Estimated remaining cash (mid-2026, before undisclosed sources)"
          value: 210
    approximationNotes: >-
      All outflow figures are estimates only; no audited cash-flow statement exists. Monthly burn of ~$5M is a rough
      midpoint estimate for a ~140-175 headcount company in enterprise XR; actual burn is unknown. Cash portion of
      acquisitions is estimated at ~$40M because the disclosed major transactions (LandVault $450M, DRL $250M, Napster
      $207M, Touchcast $500M) were predominantly all-stock; some cash consideration in Napster and Touchcast deals is
      possible but unconfirmed. Vendor judgments include $3.3M TD Cowen, $9.2M Sony default, and ~$27M Summit Partners
      claim but are not all confirmed as paid. The $3.36B fraudulent raise is excluded as it was never received.
      Remaining cash estimate is highly speculative and not validated.
    claimRefs:
      - CI031
      - CI035
      - CI036
      - CI048

callouts:
  - calloutType: risk
    title: "$3.36B Fraud Destroyed the Capital Plan"
    body: >-
      The company's entire 2025 expansion strategy—Napster acquisition, Touchcast acquisition, Fort Lauderdale headquarters,
      international expansion—was predicated on $3.36 billion that was never received. The fraud by Charles Cole, confirmed
      by SEC and DOJ charges filed June 11, 2026, leaves Infinite Reality with approximately $350 million in confirmed real
      capital (most already deployed) and a severe fundraising handicap due to reputational, governance, and legal damage.
    claimRefs:
      - CI032
      - CI034
      - CI045

  - calloutType: risk
    title: Revenue Quality Is Low — Inorganic, Unaudited, and Concentrated
    body: >-
      Nearly all of Infinite Reality's disclosed revenue derives from acquired subsidiaries, not from organic product growth.
      No independent audit has verified the $75 million figure. The company's two most high-profile partnership claims
      (Google strategic partner, Manchester City official partner) have been publicly denied by the supposed partners.
      Without an audited segment breakdown, the reported revenue number cannot be relied upon for valuation or diligence
      purposes.
    claimRefs:
      - CI003
      - CI015
      - CI018
      - CI019

  - calloutType: recommendation
    title: Full Data Room Required Before Any Investment Decision
    body: >-
      No investment decision can be responsibly underwritten without: (1) audited financial statements from inception,
      (2) segment-level revenue and gross margin, (3) current cap table certified post-Cole-rescission, (4) confirmed
      cash balance and credit facility terms, and (5) a legal opinion on outstanding litigation exposure. All five items
      are currently unavailable in the public domain.
    claimRefs:
      - CI047
      - CI049
      - CI050

