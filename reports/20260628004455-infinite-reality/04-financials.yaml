  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Private Metric
      - Impact on Analysis
      - Exact Diligence Path
    rows:
      - - Audited financial statements (income statement, balance sheet, cash flow)
        - Without an audit, all revenue, margin, and asset figures are unverifiable company claims; prevents any reliable valuation or underwriting
        - Request full audited P&L, balance sheet, and cash flow statement from inception through current period; require independent auditor sign-off
      - - Segment-level revenue breakdown by subsidiary and product line
        - Cannot assess organic vs. inorganic revenue, growth trajectory, or which subsidiaries are viable
        - Require management accounts showing revenue, gross profit, and EBITDA by business unit (iR Enterprise, iR Studio, DRL, Napster, LandVault, etc.)
      - - Gross margin by revenue segment
        - Cannot assess unit economics, pricing adequacy, or path to profitability
        - Request COGS by segment; distinguish labor, infrastructure, media-rights, and revenue-share costs
      - - Customer count, ARR, churn rate, and NRR for iR Studio
        - Without SaaS metrics, impossible to assess scalability or durability of subscription revenue
        - Request cohort-level ARR, gross churn, net churn, and expansion revenue data for iR Studio
      - - Cash on hand and debt/credit facility position (June 2026)
        - Cannot determine runway, survival probability, or next-round need without current liquidity data
        - Request audited balance sheet or board-level treasurer report with cash position, credit facilities, and covenant status
      - - Cap table post-Cole-share rescission
        - Cannot determine dilution exposure, liquidation waterfall, or investor rights without confirmed cap table
        - Request current cap table certified by outside counsel, confirming shares issued, rescinded, and outstanding
    notes: >-
      This table enumerates only the most material financial disclosures not publicly available. All six items represent
      blocking diligence gaps that must be resolved before any investment decision can be underwritten. Coverage is
      partial—additional gaps may exist in areas not yet directly investigated.
