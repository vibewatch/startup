  - id: adverse-financial-evidence
    title: Adverse Financial Evidence and Risk Signals
    body: >-
      Infinite Reality's financial story has accumulated a constellation of adverse signals that go well beyond ordinary
      startup opacity. At the most fundamental level, the company's headline valuation is structurally detached from its
      revenue. Forbes reported in April 2025 that at $15.5 billion valuation and $75 million revenue, Infinite Reality implied
      a 207x revenue multiple—far exceeding Anthropic (~44x) and OpenAI (~24x), the most richly valued private technology
      companies of the period. A Yale finance professor described the $3 billion investment as one of the largest single-investor
      venture rounds of the year, if real; it was not real.

      The company's valuation methodology is entirely self-referential: each acquisition was priced in Infinite Reality stock
      at a company-determined valuation, incrementing the stated figure without any independent appraisal or investment-bank
      fairness opinion on record. Former executives at acquired companies described the valuation as "fake imaginary numbers"
      and expressed that many employees felt operations resembled "a scam." Co-founder Rodric David filed suit in December
      2024 seeking financial documents to understand the company's valuation and corporate governance, including details on
      two bonds of $1 billion and $2.5 billion that Acunto had presented to shareholders.

      The SEC filed a pre-existing lawsuit in February 2025 to enforce compliance with a subpoena related to the 2022 SPAC
      valuation, demonstrating that regulatory scrutiny predated the Cole fraud. The June 11, 2026 SEC civil and DOJ criminal
      actions against Cole represent the most direct financial-fraud action in the company's history. Cole's use of forged
      bank statements, fabricated websites mimicking legitimate financial institutions, and pledging 45 million shares as
      collateral for a $1 million loan—while Infinite Reality received nothing—leaves a severe reputational and governance
      scar that will complicate future fundraising regardless of legal outcome.
    claimRefs:
      - CI039
      - CI040
      - CI041
      - CI042
      - CI043
      - CI044
      - CI045
      - CI046
    figureRefs:
      - FI003

  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: >-
      Infinite Reality's financials present a picture of a company with legitimate enterprise XR revenue in the $75–85 million
      range, almost entirely from acquisitions, backed by a single confirmed cash raise of $350 million—most of which was
      likely consumed by operations, integration, and partially cash-funded acquisitions between mid-2024 and mid-2025. The
      collapse of the $3.36 billion raise dramatically reduced the company's liquidity and strategic runway. Without audited
      financial statements, there is no way to verify cash position, gross margin, segment profitability, debt levels, or
      goodwill amortization burden from the acquisition spree.

      The revenue quality is fundamentally impaired: nearly all revenue came from acquired subsidiaries operating under a
      holding-company model, organic growth is undisclosed and likely minimal, and gross margin is unknown. The company's
      all-stock acquisition strategy inflated reported valuation without deploying real capital, and the self-reported $15.5
      billion valuation has no independent basis. Future fundraising will be severely constrained by the combination of the
      Cole fraud investigation, outstanding litigation, governance concerns, departures of CFO and CLO, and the absence of
      audited financials. The Napster AI-first pivot post-streaming-shutdown adds execution risk and a further revenue-model
      transition burden. Until audited financials, segment-level revenue, gross margin, and a credible post-fraud capital
      adequacy assessment are available, Infinite Reality's financial profile is effectively uninvestable without deep
      access to management and a full data-room review.
    claimRefs:
      - CI047
      - CI048
      - CI049
      - CI050

