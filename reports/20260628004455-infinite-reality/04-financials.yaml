  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: >-
        Gross margin, cost of goods sold, and gross profit figures for each revenue segment (enterprise services, iR Studio
        SaaS, content, and digital assets).
      whyItMatters: >-
        Without gross margin data, it is impossible to assess whether any revenue stream is economically viable, to model
        profitability paths, or to underwrite valuation multiples.
      diligencePath: >-
        Request audited P&L with full COGS breakdown; require auditors to provide segment-level gross profit attestations.
      relatedQuestionRefs:
        - QI004
        - QI020

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Confirmed current cash on hand, credit facility or debt terms, and covenant status for Infinite Reality as of June 2026.
      whyItMatters: >-
        Without knowing remaining cash and available credit, runway cannot be estimated and the risk of operational failure
        before a rescue round cannot be assessed.
      diligencePath: >-
        Request audited balance sheet or interim treasurer report as of June 30, 2026; require outside counsel certification
        of all credit facilities, covenants, and outstanding debt.
      relatedQuestionRefs:
        - QI024
        - QI005

    - type: missing-source
      severity: blocking
      topic: financial-disclosure
      missingEvidence: >-
        Independent audited financial statements (income statement, balance sheet, and cash flow) covering all fiscal years
        from 2019 through 2025.
      whyItMatters: >-
        Without audited financials, no revenue, margin, or asset figure can be relied upon; the company's self-reported $75M
        revenue and all valuation conclusions remain entirely unverifiable.
      diligencePath: >-
        Require production of GAAP-audited financials from a registered audit firm for all periods since 2019; specifically
        request disclosure of intercompany eliminations and goodwill amortization from 2022 forward.
      relatedQuestionRefs:
        - QI030

    - type: missing-source
      severity: material
      topic: investors
      missingEvidence: >-
        A certified, current cap table showing all shares issued, rescinded (re: Cole), outstanding, and subject to conversion
        or warrant, signed off by outside counsel.
      whyItMatters: >-
        The Cole fraud resulted in the issuance and subsequent rescission of 239 million shares; without a clean post-rescission
        cap table, the dilution profile, option pool, and investor rights are unknown.
      diligencePath: >-
        Request cap table certified by outside counsel as of March 2026 (post rescission); require confirmation of all series,
        SAFEs, warrants, and convertible instruments outstanding.

    - type: stale
      severity: material
      topic: capital-markets
      missingEvidence: >-
        Current status of the SPAC merger with Newbury Street Acquisition Corporation (NBST), including whether the merger
        has been formally terminated or extended beyond the September 2024 Nasdaq deadline.
      whyItMatters: >-
        A terminated SPAC removes a potential public-equity funding path; unresolved SPAC status keeps the company in a
        regulatory gray zone and may affect future capital raises.
      diligencePath: >-
        Search SEC EDGAR for NBST filings subsequent to September 2024; contact Newbury Street Acquisition Corp management
        for a formal status statement.
      relatedQuestionRefs:
        - QI025

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        Segment-level revenue breakdown separating organic iR product revenue from acquisition-driven consolidated revenue
        across all subsidiaries.
      whyItMatters: >-
        Without a segment breakdown, the $75M figure conflates highly different businesses (SaaS, professional services,
        media, eSports) and obscures whether any individual unit is growing, stagnant, or declining.
      diligencePath: >-
        Request management accounts by subsidiary for 2022–2025; require reconciliation to consolidated revenue figure
        with explicit separation of organic vs. inorganic growth contribution.

