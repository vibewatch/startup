  - id: public-traction-gaps
    title: Public Financial Traction and Private-Metric Gaps
    body: >-
      Infinite Reality's public financial disclosures are sparse. The company self-reported $75 million in revenue for 2024
      (up from $50 million in 2023), but no independent auditor has confirmed these figures. No income statement, balance sheet,
      or cash flow statement has been filed or released publicly for the operating company. The only SEC-filed financial
      documents accessible in EDGAR relate to Newbury Street Acquisition Corporation (the SPAC shell), not to Infinite Reality
      as an operating entity. Growjo estimated annual revenue at $84.4 million based on employee and public signal proxies—
      consistent with but not validating the company's own disclosure.

      The absence of audited financials means there is no ability to independently verify revenue recognition policies, deferred
      revenue treatment, intercompany eliminations across subsidiaries, or goodwill and intangibles amortization associated with
      the $800 million-plus in 2024 acquisition activity. Infinite Reality's investor-relations website previously listed
      prominent investors including RSE Ventures, Lux Capital, Lerer Hippeau, and the Agnelli family's Exor; all of these
      became Infinite Reality shareholders exclusively through their prior stakes in the Drone Racing League, which iR acquired.
      None are confirmed to have invested directly in Infinite Reality, and the investor page was removed after Forbes began
      inquiring about this discrepancy.

      Two specific partnership and customer claims have been publicly denied. Google described Infinite Reality to Forbes as
      merely an ordinary Google Cloud customer; the company had claimed a "five-year strategic partnership" with Google.
      Manchester City Football Club denied being an official partner or supplier, stating only that a third-party contractor
      had used iR's Thunder Studios subsidiary for "a small part" of a multi-partner project. These specific denials call into
      question the reliability of other customer and partner disclosures. No ARR, net revenue retention, gross margin,
      customer count, or churn figures have been disclosed publicly.
    claimRefs:
