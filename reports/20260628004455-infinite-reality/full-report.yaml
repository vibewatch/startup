chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality Inc. (iR), formally incorporated under the name used from 2022, traces its corporate
              origin to 2019 when co-founder and CEO John Acunto acquired Tsu, a bankrupt Connecticut-based social media
              company, and renamed it Display Social. The company combined Display Social with a metaverse-focused
              entity also called Infinite Reality in January 2022 in a $235 million all-stock deal that valued the
              combined company at $1 billion, establishing the Infinite Reality brand and beginning an aggressive
              acquisition spree. By 2024 the operational headquarters had migrated to Boca Raton, Florida, with press
              releases consistently citing that address through the Touchcast deal announcement in April 2025.

              The company's principal product is iR Studio, a no-code and low-code SaaS platform that enables brands and
              creators to transform conventional 2D websites into immersive, three-dimensional virtual storefronts
              accessible directly through a web browser. Supplementary offerings include iR Engine (a proprietary 3D web
              engine), iR Enterprise (custom immersive solutions for large clients), Thunder Studios (Emmy-award-winning
              production and broadcasting), TalentX (influencer talent management with a claimed 200+ million follower
              reach), the Drone Racing League, and since May 2025 the Napster brand, redeployed as an AI-powered
              digital-experience platform after the streaming service was shut down in January 2026. The business model
              combines SaaS subscriptions, professional services, media rights, and sponsorship revenue across acquired
              subsidiaries, though no audited revenue breakdown by segment has been publicly disclosed.
