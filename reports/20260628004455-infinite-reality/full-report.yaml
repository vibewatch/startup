      - number: '6.2'
        title: Adoption Trajectory and Interaction Data
        blocks:
          - type: paragraph
            body: >-
              The most prominent adoption metric iR has publicly disclosed is 150 million cumulative consumer
              interactions across approximately 500 immersive 3D experiences, announced in April 2025. The company
              described interaction types including product image clicks, in-world gameplay, e-commerce cart activity,
              loyalty sign-ups, AI chatbot sessions, video views, social shares, and navigation hotspot clicks — a
              heterogeneous basket that conflates high-intent purchase actions with passive engagement events, limiting
              the metric's comparability to standard e-commerce conversion benchmarks.

              Crucially, iR explicitly stated that this figure excludes iR Studio (newly launched at the time), the
              Napster platform, and third-party platform interactions on Roblox, meaning the number does not represent
              the company's total addressable platform footprint. The LandVault acquisition had added 1.2 million square
              feet of virtual experience infrastructure across 200+ clients; Obsess contributed 400+ virtual store
              deployments. iR published internal case study benchmarks: a luxury fashion brand (unnamed) claimed 75%
              higher conversion and 19% higher average order value than its standard e-commerce site; a global toy
              company (unnamed) cited 25% higher add-to-cart rates; a music and entertainment company (unnamed) drove a
              39% increase in merchandise conversion in the first week of launch. All of these are company-cited and
              unaudited.

              DRL brought a separate audience metric: over one billion annual digital video views and a global broadcast
              footprint of 320 million households at acquisition, with 15 million social media followers including 5.4
              million on TikTok — establishing iR as an operator with genuine fan reach distinct from its enterprise
              brand platform. The post-Obsess headcount stood at approximately 319 employees as of January 2025, a
              figure subsequently reduced by undisclosed layoffs tied to acquisition-overlap redundancies in May 2025.
