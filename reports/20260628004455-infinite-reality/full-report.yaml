  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The formal investment thesis for Infinite Reality (Napster Corporation) rests on three pillars: (1) the
              $15.5 billion self-reported valuation represents a first-mover premium in the emerging spatial web and
              AI-commerce market where the company has assembled a differentiated asset portfolio including the Drone
              Racing League, Thunder Studios, and the Napster brand; (2) the $75 million 2024 revenue is understated
              given the pipeline of enterprise immersive contracts not yet recognized; and (3) the Cole fraud episode is
              an external victimization event, not an indicator of structural company dysfunction.

              Each pillar collapses under scrutiny. On valuation: comparable public spatial/XR companies trade at
              2.7–27x revenue with transparent audited financials; at 207x iR's multiple exceeds even the most richly
              valued AI hypergrowth companies at their 2025–2026 peaks. On revenue: no independent audit exists; Forbes
              found only two attendees at a product demo, both journalists; industry peers including Improbable and
              Animoca Brands had never encountered iR as a customer, vendor, or partner; and the company's own CMO
              stated in 2025 that iR no longer considers itself a metaverse company. On the fraud: the fabricated $55
              billion asset declaration and fake bank website that tricked iR into issuing 239 million shares (≈25% of
              the company) to Cole for zero consideration reveal either willful misconduct or catastrophic governance
              failure — neither is consistent with the stewardship required of a company seeking institutional capital
              at $15 billion.

              The anti-thesis is reinforced by: no named institutional VC (no a16z, Sequoia, SoftBank, or equivalent)
              has ever made a direct investment in iR; all named investors (RSE Ventures, Lux Capital, Liberty Media)
              hold equity via the DRL acquisition, not direct iR investment; the investor-relations page was removed
              after Forbes began inquiring; CEO credentials were fabricated; four separate SPAC/tender-offer exits
              failed between 2022 and 2025; and Sony Music obtained a certificate of default for $9.2 million in unpaid
              royalties, with additional claims up to $37.5 million pending.
