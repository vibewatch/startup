  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Defining the market boundary is a prerequisite for any sizing work on Infinite Reality: the company is a
              platform and services operator, not a hardware manufacturer, and its addressable spend excludes VR and AR
              device revenues that accrue to Meta, Apple, Sony, and headset OEMs. iR's competitive surface spans three
              distinct software and services layers: (1) immersive platform tools for brands (virtual storefronts, 3D
              commerce interfaces, AI-assisted content creation); (2) sports and entertainment venue experiences (fan
              engagement, live-event overlays, branded activations); and (3) enterprise spatial-computing services
              (digital twins, training simulations, government and real-estate digital replicas). Pure consumer gaming
              ecosystems such as Roblox and Fortnite lie outside iR's direct addressable market because iR's model is
              B2B—it charges the brand or enterprise, not the end consumer.

              Status-quo substitutes differ by vertical. For brand commerce, the incumbent is the 2D e-commerce website
              and digital advertising campaign. For sports and entertainment, substitutes are conventional broadcast,
              in-venue sponsor activations, and standard mobile apps. For enterprise training, substitutes are
              instructor-led programs and LMS platforms. The critical boundary implication for valuation is that the
              $225B spatial computing ecosystem—frequently cited as the 'true TAM'—includes large hardware and
              infrastructure layers that iR neither controls nor captures economically, requiring a narrowed SAM lens to
              be analytically useful.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
