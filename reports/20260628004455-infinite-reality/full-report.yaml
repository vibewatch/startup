          - type: callout
            title: Enterprise XR Adoption Infrastructure Is Already Built
            body: >
              The hard work of enterprise XR budget establishment has largely been done by early adopters: 75% of
              Fortune 500 companies have deployed XR in some capacity, and 23% maintain dedicated metaverse/immersive
              budgets averaging $2.7M annually. This means iR enters a market with proven procurement pathways,
              established budget line items, and a large installed base of enterprise clients familiar with XR
