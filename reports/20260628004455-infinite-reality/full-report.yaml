      - number: '3.4'
        title: Substitutes, Status Quo, and Adjacent Entrants
        blocks:
          - type: paragraph
            body: >-
              The status quo—conventional 2D e-commerce built on Shopify, Salesforce Commerce Cloud, Magento, or custom
              stacks—remains the default buyer choice for brands evaluating iR Studio. These carry zero platform
              migration risk, broad third-party integrations, proven conversion benchmarks, and large service
              ecosystems. For enterprise brands evaluating 3D immersive storefronts, the build-it-yourself path using
              open tools is now cheaper than it was before 8th Wall's open-source release in February 2026. Three.js,
              Babylon.js (referenced in Amazon Sumerian's open-source successor), and WebGPU-native frameworks are
              freely available; a brand with developer resources can construct a capable web-based 3D experience without
              purchasing iR Studio, raising the commodity ceiling.

              Amazon Sumerian (AWS), while in maintenance mode, represents a managed-cloud alternative for brands
              already within the AWS ecosystem. For the Napster/AI-companion layer iR has pivoted toward, it faces
              commoditization from HeyGen, ElevenLabs, and Synthesia, all of which offer AI digital-persona and avatar
              capabilities at lower price points, with broader enterprise integrations and established track records.
              Decentraland and The Sandbox (web3 metaverse platforms) remain active but have not achieved material
              enterprise adoption, and their blockchain-native architecture limits broad brand deployment. Independent
              XR agencies and custom shops using Unreal or Unity compete for bespoke enterprise deployments in the
              higher-value tier of iR's addressable market. None of these substitutes individually match iR's stated
              full-stack breadth; together they cover every layer of iR's offering without requiring a single vendor
              relationship.
