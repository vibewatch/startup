            body: >-
              Infinite Reality's financials present a picture of a company with legitimate enterprise XR revenue in the
              $75–85 million range, almost entirely from acquisitions, backed by a single confirmed cash raise of $350
              million—most of which was likely consumed by operations, integration, and partially cash-funded
              acquisitions between mid-2024 and mid-2025. The collapse of the $3.36 billion raise dramatically reduced
              the company's liquidity and strategic runway. Without audited financial statements, there is no way to
              verify cash position, gross margin, segment profitability, debt levels, or goodwill amortization burden
              from the acquisition spree.

              The revenue quality is fundamentally impaired: nearly all revenue came from acquired subsidiaries
              operating under a holding-company model, organic growth is undisclosed and likely minimal, and gross
              margin is unknown. The company's all-stock acquisition strategy inflated reported valuation without
              deploying real capital, and the self-reported $15.5 billion valuation has no independent basis. Future
              fundraising will be severely constrained by the combination of the Cole fraud investigation, outstanding
              litigation, governance concerns, departures of CFO and CLO, and the absence of audited financials. The
              Napster AI-first pivot post-streaming-shutdown adds execution risk and a further revenue-model transition
              burden. Until audited financials, segment-level revenue, gross margin, and a credible post-fraud capital
              adequacy assessment are available, Infinite Reality's financial profile is effectively uninvestable
              without deep access to management and a full data-room review.
            claimRefs:
