      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Liquidity
        blocks:
          - type: paragraph
            body: >-
              The only confirmed real cash capital raise in Infinite Reality's history is the $350 million equity
              investment closed in July 2024 from a private multi-family office, documented in an SEC EDGAR filing by
              Newbury Street Acquisition Corporation. That round was described as entirely equity (not debt), separate
              from the SPAC merger, and earmarked for immediate deployment to accelerate growth. Assuming reasonable
              operating costs and acquisition integration, much or all of this capital would have been deployed by the
              time the $3.36 billion fraudulent investment collapsed in November 2025.

              The $3.36 billion investment announced in January 2025 was subsequently confirmed as a fraud scheme
              orchestrated by Charles J. Cole, who falsely represented $55 billion in assets and never wired any funds.
              Infinite Reality issued 239 million shares to Cole and his entities, then rescinded them in March 2026.
              The company acknowledged publicly at a November 20, 2025 shareholder meeting (attended by approximately
              700 participants) that the investment would not materialize. Between the announcement in January 2025 and
              the collapse in November 2025, iR proceeded to acquire Napster for $207 million, announce the Touchcast
              acquisition for $500 million, and publicly plan a 60-acre headquarters campus in Fort Lauderdale—all
              predicated on capital that never existed.

              Outstanding financial obligations add to the liquidity concern. TD Cowen won a $3.3 million judgment in
              December 2024 for unpaid fees related to the ReKT acquisition. Summit Partners sought return of over $27
              million in shares from a 2022 agreement. Sony obtained a certificate of default for $9.2 million in unpaid
              Napster royalties. Four other contractor/vendor non-payment lawsuits were filed in 2023–2024. The SPAC
              merger with NBST (Newbury Street Acquisition Corporation) remains pending as of the run date, with no
              public update on Nasdaq compliance post the September 2024 extension deadline. Debt or credit facility
              information has not been disclosed.
