      - number: '6.6'
        title: Channel, Partner, and Distribution Reach
        blocks:
          - type: paragraph
            body: >-
              iR's distribution surface spans six distinct channels: direct enterprise sales (iR Enterprise services
              serving Fortune 500 and government clients), self-serve SaaS (iR Studio for SMBs and creators),
              third-party platform distribution (Roblox-deployed experiences via Obsess), sports broadcast (DRL's
              320-million-household network and streaming agreements), influencer-led brand deals (TalentX's 200M+
              follower creator network facilitating brand campaign placements), and enterprise AI reseller/consultancy
              partners (Microsoft partner channel, as illustrated by the Leading Results consultancy that delivered the
              Cooper Parry pilot).

              The Microsoft Azure Agentic AI partnership, announced November 2025, represents the most credible
              validation of iR's enterprise AI distribution strategy: Napster was positioned as "among the first
              Microsoft partners" to deploy Azure Agentic AI for enterprise customers, with Microsoft's regional GM
              Myladie Stoumbou quoted directly endorsing the partnership. This partner-channel position — combining
              proprietary AI personas with Azure's enterprise compliance and global infrastructure — is the sharpest
              articulation of iR's land-and-expand thesis for the Napster AI product line. However, only a single named
              commercial pilot (Cooper Parry) has been publicly confirmed in this channel, and the commercial conversion
              rate from pilot to recurring contract is unknown.

              TalentX's influencer network, while described as representing creators with 200+ million combined
              followers, has not been independently verified, and no disclosure of active creator count, deal flow, or
              revenue contribution has been made. DRL's broadcast footprint reaches an estimated 320 million global
              households via sports network distribution deals, making it the highest-reach distribution asset in iR's
              portfolio — but whether that audience translates to enterprise sponsorship revenue durably is untested
              post-acquisition.
            claimRefs:
              - CU035
              - CU036
              - CU037
              - CU039
              - CU040
      - number: '6.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Acquisition-Assembled Blue-Chip Brand Portfolio
            body: >-
              Through LandVault and Obsess, iR inherited a genuinely prestigious customer roster — Heineken's Cannes
              Lion-winning campaign, Warner Bros. Discovery Sports, Mastercard, Crate & Barrel, and the UAE Ministry of
              Finance — that most purpose-built immersive-tech startups could not have assembled organically in the same
              timeframe. The Heineken-LandVault campaign is the strongest independently validated proof point in the
              portfolio, providing creative-industry corroboration that the technology can deliver premium-brand-quality
              outcomes.
            calloutType: strength
            claimRefs:
              - CU014
              - CU022
          - type: callout
            title: Retention Infrastructure Is Essentially Absent
            body: >-
              iR discloses no NRR, GRR, churn rate, contract length, or renewal data for any product segment. The only
              quantified retention event in the observable record is entirely negative: the complete elimination of
              Napster's streaming subscriber base in January 2026. For a company with a $15.5 billion claimed valuation
              anchored on recurring-revenue SaaS narratives, the total absence of retention proof is the most
              structurally significant gap in the customer evidence base.
            calloutType: risk
            claimRefs:
              - CU023
              - CU024
              - CU040
          - type: callout
            title: SEC/DOJ Investigation Introduces Enterprise Procurement Risk
            body: >-
              The SEC civil complaint (Case No. 1:26-cv-4945, filed June 11, 2026) and parallel DOJ criminal charges
              against Charles Cole for securities fraud, wire fraud conspiracy, and deception of Infinite
              Reality/Napster establish that the company's capital base was fraudulently constructed. Enterprise
              procurement officers at named brand clients and government agencies have access to this information;
              several Fortune 500 brands operate strict third-party risk programs that would flag a vendor under active
              SEC investigation. Near-term contract renewals represent an elevated execution risk.
            calloutType: risk
            claimRefs:
              - CU032
              - CU033
          - type: callout
            title: Napster Streaming Shutdown as a Leading Indicator of Platform Pivot Risk
            body: >-
              The abrupt elimination of Napster's music streaming service — with zero advance notice to active
              subscribers, unresolved artist payment obligations, and outstanding performance-rights organization claims
              — is the most observable expression of iR's willingness to abandon customer cohorts in service of
              strategic pivots. This pattern, if repeated in the enterprise immersive-commerce segment, would represent
              a material customer-attrition risk for brands that have invested in integration with iR's platform
              (Shopify, SAP, Salesforce Commerce Cloud connectors). Diligence should assess whether enterprise contracts
              include platform-continuity provisions.
            calloutType: insight
