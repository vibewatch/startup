  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and IP Risks
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's most acute near-term risk is active federal enforcement stemming from the collapse of
              its $3.36 billion fundraise. On June 11, 2026, the U.S. Attorney's Office for the Southern District of New
              York unsealed a criminal indictment charging Charles J. Cole, 57, of Mooresville, North Carolina, with
              wire fraud, conspiracy to commit wire fraud, and conspiracy to commit securities fraud — each carrying
              maximum sentences of 20, 20, and 5 years respectively. In a parallel civil action filed the same day, the
              SEC charged Cole, his attorney Torben M. Welch, and three Cole-controlled shell entities (Beacon Heart
              LLC, Heart of Humanity LLC, Avranoc LLC) with violating the Securities Act and Exchange Act antifraud
              provisions. According to both filings, Cole and Welch used fabricated bank records, sham correspondence,
              and a counterfeit foreign bank website to induce Infinite Reality into issuing 239 million shares between
              late 2024 and early 2025 without receiving any consideration. Infinite Reality ultimately rescinded all
              shares issued to Cole in March 2026 and is cooperating with law enforcement as a victim.

              The SEC's interest in Infinite Reality predates the Cole fraud. A probe into the company's $1.85 billion
              valuation claim filed with the SEC in connection with its 2022 reverse-merger attempt is ongoing; a
              federal lawsuit to enforce compliance with an SEC subpoena against CEO Acunto was filed but later
              dismissed.

              On the intellectual property front, Sony Music Entertainment filed suit in August 2025 in the SDNY seeking
              $9.2 million in unpaid royalties and up to $37.5 million in statutory copyright damages for willful
              infringement across 240 tracks — including works by Justin Timberlake, Britney Spears, and Miley Cyrus —
              after Napster continued streaming Sony content post-license termination. A clerk entered default judgment
              in October 2025 after Napster filed no response. SoundExchange filed a separate suit in June 2025 for $3.4
              million in unpaid royalties tied to the Sonos Radio streaming service. Additional creditor and acquisition
              counterparty litigation — including Frenkel v. Acunto (Nevada, 2025) and the Obsess acquisition
              counterclaim dispute — layer additional legal exposure onto an already strained balance sheet.
