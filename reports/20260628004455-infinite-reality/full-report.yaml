            body: >-
              On June 11, 2026, both the SEC and DOJ filed formal proceedings against the perpetrator of Infinite
              Reality's fraudulent $3.36 billion fundraise. Infinite Reality is currently positioned as a victim, not a
              defendant; however, an SEC investigation into the company's own 2022 valuation and reverse-merger claims
