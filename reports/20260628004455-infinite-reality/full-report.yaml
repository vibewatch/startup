      - number: '2.5'
        title: Adoption Constraints and Structural Headwinds
        blocks:
          - type: paragraph
            body: >
              The consumer metaverse model has failed at scale, creating a headwind for any company operating in
              immersive technology. Meta accumulated approximately $73B in cumulative Reality Labs losses since
              2021—$17.7B in 2024 alone—with Horizon Worlds failing to attract sustained engagement and Horizon
              Workrooms slated for discontinuation. Gartner's 2022 prediction that 25% of people would spend one hour
              daily in the metaverse by 2026 did not materialize for leisure use; enterprise productivity applications
              captured the growth. For iR, this failure narrative creates reputational overhang when marketing to
              enterprise buyers who conflate consumer metaverse collapse with the broader immersive platform
              opportunity.

              Four structural barriers remain specific to enterprise XR adoption. First, content creation is still
              expensive and slow: Obsess requires 2–3 months per virtual store project, and 3D content development is
              the largest single cost in enterprise deployments. Second, platform fragmentation—across Meta Quest, Apple
              Vision Pro, WebXR, and emerging Android XR implementations—requires multi-environment deployment that
              multiplies development cost and QA burden. The immersive entertainment market cites fragmentation as its
              primary restraint on scalability. Third, standalone VR headset shipments declined 15% to 4.7M units in
              2026 (Omdia, June 2026), constraining the installed base for high-fidelity headset-dependent experiences.
              Fourth, switching costs are high: custom 3D brand experiences require near-complete redesign if an
              enterprise client moves between immersive platform vendors, creating both a retention moat and a barrier
              to initial procurement.
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
      - number: '2.6'
        title: Sizing Diligence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              Three material gaps limit the precision of any market analysis for iR. First, analyst definitions of 'XR
              market' span a 30× range in 2026—from $10.64B (Mordor Intelligence, narrow platform software) to $346B
              (Fortune Business Insights, broad immersive ecosystem including hardware and infrastructure)—driven by
              inconsistent inclusion of hardware, content, infrastructure, and adjacent enabling-technology layers. A
              TAM cited without a precise scope definition is analytically unreliable for iR valuation purposes.

              Second, iR does not disclose revenue, ARR, or pricing data, making it impossible to validate market
              penetration or reverse-engineer a bottom-up SAM from customer economics. The 150M consumer interaction
              milestone, while notable, is an engagement metric rather than a revenue figure, and the company's
              all-stock acquisition strategy means portfolio pricing is further obscured.

              Third, the addressable market categories iR straddles (immersive entertainment, virtual commerce,
              enterprise spatial computing, and sports fan engagement) are each tracked by different analysts under
              different methodologies. Combining them requires assumptions about iR's revenue share within each
              segment—assumptions that cannot be validated without financial disclosure. The $0.7B immersive sports
              viewing market is a useful bound for one vertical but significantly understates the full fan-experience
              opportunity when sponsorship revenue, brand activations, and gamification monetization are included.
            claimRefs:
              - CM044
              - CM045
              - CM046
              - CM047
              - CM048
              - CM049
              - CM050
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Consumer Metaverse Collapse Creates Enterprise Narrative Overhang
            body: >
              Meta's $73B+ Reality Labs losses and the failure of Horizon Worlds to attract consumer traction has
              branded 'metaverse' as a cautionary narrative in enterprise boardrooms. iR must continuously distinguish
              its enterprise-focused platform from the consumer metaverse experiments that failed. Without clear,
              brand-safe ROI case studies and a positioning that avoids the metaverse label, iR risks longer sales
              cycles and budget skepticism even among buyers who would otherwise be natural prospects for immersive
              commerce and training solutions.
            calloutType: risk
