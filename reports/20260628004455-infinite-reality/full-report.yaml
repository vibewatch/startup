  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Operating Structure
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's commercial product suite is organized into four functional tiers. The first tier covers
              self-service tools: iR Studio, a no-code and low-code SaaS browser platform for building 3D interactive
              storefronts, and the iR Engine spatial web framework (rebranded from Ethereal Engine, acquired February
              2024 for $75 million) that powers the rendering layer. iR Studio's drag-and-drop interface supports
              customizable templates, props, avatars, Shopify product catalog import, multiplayer video/audio chat, and
              an analytics dashboard. The second tier is iR Enterprise, the managed-services agency that has reportedly
              delivered more than 500 custom immersive experiences for clients including Crate & Barrel, e.l.f.
              Cosmetics, J.Crew, and Swarovski; it also absorbed LandVault's enterprise metaverse infrastructure
              (acquired July 2024 for $450 million), adding over 200 enterprise clients such as Mastercard, L'Oreal, and
              UAE government entities. The third tier is the AI-agent product family derived from the Touchcast
              acquisition (announced April 2025 for $500 million): Napster Spaces (agentic AI video chat for website
              conversion, beta May 2025), Napster 26 (holographic AI companion platform, Mac app October 2025), Napster
              Station (AI kiosk for B2B venues, CES January 2026), the Omniagent API (May 2026, $0.01 per minute), and
              NV2—a real-time conversational video model at Full HD 30 FPS launched June 2026. The fourth tier is media:
              Thunder Studios (150,000 sq ft production facility, Emmy-award-winning), the Drone Racing League
              sports/media property, and TalentX influencer management. The Obsess acquisition (announced January 2025)
              added 400+ branded 3D virtual stores and proprietary CMS technology for brands including Ralph Lauren,
              L'Oreal, and Disney Music Group, integrating directly into iR Studio. Each product tier serves distinct
              buyer segments—self-service SMBs, Fortune 500 enterprise, developer/API integrators, and media rights
              buyers—but the portfolio was assembled primarily through all-stock acquisitions rather than organic
              development, introducing significant integration risk.
