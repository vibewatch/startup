  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's revenue model consolidates income from four primary streams across its portfolio of
              acquired entities: enterprise professional services (branded as iR Enterprise), software licensing (iR
              Studio SaaS subscriptions), content and media monetization (principally from Drone Racing League and the
              Napster brand), and digital asset or NFT sales within virtual environments. Enterprise services—custom
              design, deployment, and management of immersive 3D web experiences for corporate clients—have generated
              the majority of disclosed revenue. As of April 2025, the company's iR Enterprise arm disclosed over 500
              bespoke experiences delivered to clients including Crate & Barrel, e.l.f. Cosmetics, J.Crew, and
              Swarovski, plus government entities across the Middle East through the LandVault subsidiary.

              iR Studio, the company's self-service no-code platform, offers a subscription path that theoretically
              generates recurring software licensing revenue. However, no ARR, subscription tier, or user-count
              disclosures have been made. Enterprise contracts are custom-quoted and not publicly listed. Google Cloud
              Marketplace listing (April 2025) expanded distribution access to Google's enterprise partner ecosystem,
              though Google itself characterized iR as an ordinary customer rather than a strategic partner. The Drone
              Racing League subsidiary was acquired for $250 million in 2024 but had not staged a competitive event in
              over two years as of the Forbes April 2025 investigation, raising questions about the revenue contribution
              of the content arm. Napster, acquired in March 2025 for $207 million, was relaunched as an AI-first
              generative audio platform in January 2026 after its licensed streaming service was shut down; the
              associated revenue transition is ongoing and undisclosed.

              Nearly all of Infinite Reality's consolidated revenue derives from its acquisition activity since 2022.
              Forbes reported in April 2025 that "nearly all of Infinite Reality's revenue can be attributed to the
              dozen or so startups it has acquired since 2022." This means organic revenue—from iR's own products absent
              acquisitions—has not been separately disclosed and may be immaterial as a standalone figure. The company
              completed 10 acquisitions through April 2025, eight of them since April 2024, making revenue comparison
              across periods structurally unreliable without segment disclosure.
