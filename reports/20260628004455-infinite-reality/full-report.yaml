          - type: callout
            title: Serial Nonpayment and Music Royalty Litigation
            body: >-
              Sony Music's $9.2 million back-royalty / $37.5 million copyright infringement suit, SoundExchange's $3.4
              million action, and the default judgment entered in October 2025 represent a structural cash-flow
              dysfunction predating the fraud collapse. This pattern — documented across more than a dozen lawsuits in
              six states over a decade — is not a one-time incident. The streaming service was shut down not as a
              strategic pivot but in the context of unlicensed operation post-license termination. Investors should
              treat the rights-holder litigation stack as a leading indicator of hidden balance-sheet liabilities, not a
              legacy issue.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR033
          - type: callout
            title: Victim Posture Is Asserted but Not Fully Established
            body: >-
              Infinite Reality claims victim status in the Cole fraud. However, in March 2025 a company spokesperson
              told Forbes the funds were "in an Infinite Reality account and available to us" and that the company was
              "actively leveraging" them — statements made when, per the DOJ indictment, no money was ever transferred.
              Whether this represents innocent belief in Cole's fabrications or a material misrepresentation to third
              parties (including acquisition targets paid in stock backed by the phantom valuation) is the critical open
              question. Until the DOJ investigation closes without charging the company, this uncertainty creates a
              non-trivial tail risk on top of the already severe operational and litigation risks.
            calloutType: assumption
            claimRefs:
              - CR029
