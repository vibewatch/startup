      - number: '7.4'
        title: Financial, Capital Structure, and Fraud Risks
        blocks:
          - type: paragraph
            body: >-
              The complete failure of the $3.36 billion fundraise is the single most consequential financial event in
              Infinite Reality's history. Between January and November 2025, the company represented to shareholders,
              acquisition targets, and counterparties that this capital was either committed or actively available. In
              March 2025, the company's CMO told Forbes the funds were "in an Infinite Reality account and available to
              us" and that the company was "actively leveraging" them. No money ever transferred. The DOJ indictment
              characterizes Cole as the perpetrator; the question of what Infinite Reality knew and when it knew it
              remains central to understanding whether the fraud exposure is solely third-party or reaches into the
              company's own representations.

              Against this backdrop, the company's publicly asserted $15.5 billion valuation implies a revenue multiple
              of approximately 207x on $75 million in self-reported 2024 revenue — compared to roughly 44x for Anthropic
              and 24x for OpenAI at their recent raises. No independent audit of Infinite Reality's revenue, acquisition
              valuations, or balance sheet has been disclosed at any point in its operating history. All acquisitions —
              collectively exceeding $2 billion in face value — were executed entirely in company stock whose value
              derives from this unverifiable valuation. This creates a compounding risk: any impairment to the equity
              price unwinds counterparty trust in past and future transactions simultaneously.

              Pre-existing cash flow deficits are well-documented. Lawsuits from creditors alleging nonpayment span at
              least six states and date back to 2022. A $3.25 million TD Cowen judgment was entered in December 2024.
              The canceled shareholder tender offer — the fourth such cancellation since 2022 — eliminates any remaining
              liquidity pathway for existing investors. Sacra estimates Infinite Reality has raised approximately $3.4
              billion in total including contested rounds; the actual usable cash position remains undisclosed. With a
              200+ person workforce, no audited revenue, and a $46.7 million litigation liability overhang, the runway
              position is effectively opaque to external investors.
