      - number: '5.3'
        title: Customer Workflow and Deployment Model
        blocks:
          - type: paragraph
            body: >-
              iR Studio targets brand marketers and e-commerce operators who want immersive 3D experiences without
              engineering resources. The deployment workflow begins with account creation and template selection,
              followed by drag-and-drop scene assembly, Shopify product catalog import, avatar and interaction
              customization, and one-click publish to a custom URL. The experience is accessible directly in a web
              browser—no app install required—and supports multiplayer, video chat, and AI assistant interactions. Three
              deployment formats are available: a full-page branded URL for campaigns, an embed snippet for integration
              into existing pages, and an agent-only floating widget. Brands on the Starter Plan pay $49 per month for
              up to 50 hours of AI video chat; the Enterprise plan (reportedly $3,000 per month) targets Shopify
              retailers needing immersive 3D storefronts with AI personal shoppers.

              iR Enterprise operates as a professional services agency model: brands brief iR's team, which designs,
              builds, and deploys custom immersive environments. Products include digital twins of real-world
              environments, virtual showrooms integrated with Shopify and Salesforce, AI-powered assistants, 3D product
              digitization from 2D photos, and XR applications for Meta Quest and Apple Vision Pro. LandVault
              contributed enterprise-grade managed services for government and corporate use cases across the Middle
              East, Europe, and North America.

              For the Napster AI product line, the Napster 26 Mac application and web browser version allow users to
              interact with over 15,000 AI companion personas via video conversation. Digital twin creation involves a
              selfie, LinkedIn profile upload, voice sample, and consent recording. The Omniagent API enables developer
              integrations at $0.01 per minute, with Solgari partnership enabling deployment inside Microsoft Teams and
              Dynamics 365. The Napster Station B2B kiosk targets physical enterprise locations and uses Azure OpenAI
              with a proprietary VoiceField microphone array for noise isolation in public venues.
