      - number: '4.5'
        title: Adverse Financial Evidence and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's financial story has accumulated a constellation of adverse signals that go well beyond
              ordinary startup opacity. At the most fundamental level, the company's headline valuation is structurally
              detached from its revenue. Forbes reported in April 2025 that at $15.5 billion valuation and $75 million
              revenue, Infinite Reality implied a 207x revenue multiple—far exceeding Anthropic (~44x) and OpenAI
              (~24x), the most richly valued private technology companies of the period. A Yale finance professor
              described the $3 billion investment as one of the largest single-investor venture rounds of the year, if
              real; it was not real.

              The company's valuation methodology is entirely self-referential: each acquisition was priced in Infinite
              Reality stock at a company-determined valuation, incrementing the stated figure without any independent
              appraisal or investment-bank fairness opinion on record. Former executives at acquired companies described
              the valuation as "fake imaginary numbers" and expressed that many employees felt operations resembled "a
              scam." Co-founder Rodric David filed suit in December 2024 seeking financial documents to understand the
              company's valuation and corporate governance, including details on two bonds of $1 billion and $2.5
              billion that Acunto had presented to shareholders.

              The SEC filed a pre-existing lawsuit in February 2025 to enforce compliance with a subpoena related to the
              2022 SPAC valuation, demonstrating that regulatory scrutiny predated the Cole fraud. The June 11, 2026 SEC
              civil and DOJ criminal actions against Cole represent the most direct financial-fraud action in the
              company's history. Cole's use of forged bank statements, fabricated websites mimicking legitimate
              financial institutions, and pledging 45 million shares as collateral for a $1 million loan—while Infinite
              Reality received nothing—leaves a severe reputational and governance scar that will complicate future
              fundraising regardless of legal outcome.
