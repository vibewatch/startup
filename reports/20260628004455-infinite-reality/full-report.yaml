      - number: '5.5'
        title: Trust, Safety, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              The Napster platform's security posture is documented on the napster.com/security page and in the
              Touchcast acquisition announcement. The company holds SOC 2 Type II certification, audited annually in
              April/May by independent auditors. Infrastructure runs on Microsoft Azure with AES-256 encryption at rest
              and TLS 1.2+ in transit. Multi-tenant logical separation isolates customer data, with role-based access
              control and audit logs maintained for six months. Enterprise customers can request annual SOC 2 reports,
              penetration test reports, and security questionnaire responses. The company explicitly states it will
              never train AI models on customer data, with contractual requirements imposed on third-party AI partners.

              Privacy compliance covers GDPR, CCPA, and—explicitly—California's AI agent chatbot regulation that took
              effect January 1, 2026, which requires disclosure that users are interacting with AI. Napster builds
              contextual AI disclosure into all agent prompts, mandates "Verified Agent" badges on digital twins, and
              maintains a crisis referral protocol (988 Suicide and Crisis Lifeline, Crisis Text Line) for at-risk
              users. Digital twin creation is restricted to users aged 18 and older, with identity verification
              requirements and face-database screening against known public figures to prevent unauthorized likenesses.
              Regional data residency is available for enterprise customers as a premium capability. The Napster View
              hardware device lacks publicly disclosed FCC certification documentation, and there is no independent
              audit of the device's privacy or safety compliance, representing a gap.
            claimRefs:
