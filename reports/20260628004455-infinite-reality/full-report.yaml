      - number: '1.3'
        title: Funding History, Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality has pursued an unconventional funding strategy centered on individual investors and
              family offices rather than institutional venture capital. Its disclosed capital raises are: $44 million
              claimed in SEC filings for Display Social by 2021 (not independently verified); a $350 million round in
              July 2024 from an undisclosed family office that valued the company at $5.1 billion; and a claimed $3
              billion raise in January 2025 from an anonymous private investor that allegedly pushed the valuation to
              $12.25 billion. The company raised its self-reported valuation to $15.5 billion in April 2025 coincident
              with the Touchcast acquisition announcement.

              The $3 billion raise announced in January 2025 unraveled publicly in November 2025 when CEO John Acunto
              acknowledged at a shareholder meeting that the investment would not materialize. The company issued
              written communications describing itself as a "victim of misconduct" and announced it was cooperating with
              law enforcement. The SEC had already filed a lawsuit in February 2025 to enforce compliance with a
              subpoena related to an earlier $1.85 billion valuation as part of a scrapped 2022 SPAC, and the DOJ
              separately opened an investigation into what happened to the purported $3 billion. Multiple vendor
              lawsuits allege cash flow problems: TD Cowen won a $3.3 million judgment (December 2024), Summit Partners
              sought return of $27 million in shares, and Sony obtained a certificate of default for $9.2 million in
              unpaid royalties.

              Almost all investors listed on the company's former investor-relations page (RSE Ventures, Lux Capital,
              Liberty Media, T-Mobile Ventures, Lerer Hippeau, Exor) became Infinite Reality shareholders via their
              pre-existing stakes in the Drone Racing League, not through direct investment in iR. The investor page was
              removed from the company's website after Forbes began inquiring about this fact.
