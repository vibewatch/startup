      - number: '7.5'
        title: People, Execution Risks, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Key-person concentration in CEO John Acunto is a structural governance risk of the highest order. Forbes's
              April 2025 investigation found that Acunto's claimed doctorate from the University of Florida and master's
              degree from Harvard are not confirmed by either institution, and that he declined to specify where — or
              whether — he attended college. His operational history includes lawsuits in at least six states and two
              large personal judgments settled in 2024 totaling $1.18 million. No independent directors have been
              publicly confirmed on Infinite Reality's board. In September 2025, CFO Brian Effrain and CLO Jennifer
              Pepin both departed — removing two executives critical for financial governance and legal compliance at
              precisely the moment SEC and DOJ investigations were intensifying.

              Co-founder Rodric David sued for access to corporate financial documents in December 2024, stating he was
              trying to "understand the valuation" and "evaluate the Company's adherence to proper corporate governance
              standards." The case was dismissed in March 2025. Former employees and acquisition counterparties have
              publicly characterized the company's product announcements as "ChatGPT word salad" and described "very
              serious cash flow issues" in contracting practices. These adverse insider accounts constitute a material
              signal about execution culture.

              Kill criteria for this investment are actionable and time-bound. Any escalation of DOJ or SEC proceedings
              to name Infinite Reality or Acunto as defendants constitutes an immediate thesis-break. Failure to close a
              clean institutional financing round (non-broker-facilitated, from a verified institutional source) within
              12 months of this runDate would indicate permanent capital-access impairment. Enforcement of the Sony
              Music default judgment — or filing of additional major-label copyright suits — would impair any residual
              Napster brand value. Tables TR004 and TR005 lay out these triggers with measurable thresholds.
