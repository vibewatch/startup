      - number: '7.2'
        title: Operational and Security Risks
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's operational risk profile reflects the consequences of rapid all-stock acquisition of
              more than a dozen subsidiaries without a publicly disclosed integration roadmap or unified technology
              architecture. In July 2025, approximately one-third of the combined workforce — an estimated 100
              developers — was laid off, described by management as redundancy elimination from acquisitions. This
              simultaneous rationalization of engineering headcount while executing a major AI platform pivot amplifies
              execution risk materially.

              In early January 2026, Napster abruptly shut down its music streaming service mid-session for active
              subscribers, displaying a splash screen announcing that "Napster is no longer a music streaming service."
              The migration tool directed affected users to export playlists via TuneMyMusic; multiple users reported
              abandoning the platform entirely, with one citing 14+ years of history now broken. This operational event
              caused measurable brand damage and illustrated the fragility of business model transitions without
              customer migration planning.

              The company's new AI product, Napster View, runs currently only on Mac hardware and requires either a $99
              proprietary hardware unit or a monthly subscription of at least $20 for the software-only version.
              Independent reviews described conversation lag, sycophantic AI responses, and uncanny-valley animation
              synchronization failures indicating early-stage product maturity. On the security side, Napster claims SOC
              2 Type II certification (annual independent audit), GDPR and CCPA compliance, AES-256 encryption at rest,
              TLS 1.2+ in transit, annual penetration testing, and an explicit policy against training AI models on user
              data. These certifications are company-asserted; independent audit reports are available only under NDA to
              enterprise customers. Enterprise-scale data privacy liability from the agentic AI product expansion —
              which processes webcam feeds, LinkedIn profiles, and voice samples for digital-twin creation — has not
              been quantified.
