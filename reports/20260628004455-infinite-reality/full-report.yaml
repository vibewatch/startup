      - number: '1.4'
        title: Cover Metrics and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality has disclosed very limited audited financial data. The company self-reported revenues of
              $50 million in 2023 and $75 million in 2024, attributing most revenue to the dozen-plus acquisitions made
              since 2022. No independent auditor reports or SEC filings with substantive financial statements have been
              made publicly available. A Forbes investigation noted that at a free product demo session in early 2025,
              only two attendees participated. The self-reported $15.5 billion valuation implies a multiple of
              approximately 200x trailing revenue—far higher than even the most richly valued AI startups of the period.

              Employee count estimates range from 250 to 276 across ZoomInfo and RocketReach as of late 2024
              pre-layoffs. Following a July 2025 workforce reduction that eliminated approximately 100 positions
              (described by the company as resulting from acquisition redundancies), estimated headcount is between 150
              and 200. Known operating locations include Connecticut (original HQ, Norwalk), Boca Raton and Fort
              Lauderdale Florida (operational base and planned global HQ campus), Los Angeles (Thunder Studios), and the
              MENA region (LandVault enterprise arm). The company has announced a 60-acre flagship campus at Fort
              Lauderdale with developer Sterling Bay, with groundbreaking targeted for early 2026 and projected to add
              1,000+ jobs, though no construction update has been confirmed as of the run date.
