      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Lenses'
        blocks:
          - type: paragraph
            body: >
              No single analyst estimate reliably sizes iR's addressable market because the company spans multiple
              categories that are tracked separately. The narrowest relevant layer—XR platform software—is sized at
              $10.64B in 2026 by Mordor Intelligence, growing to $59.18B by 2031 at a 40.95% CAGR. At the opposite
              extreme, Fortune Business Insights estimates the broader 'extended reality' market at $346B in 2026,
              growing at 25.5% CAGR to $2.13T by 2034; this figure includes hardware, infrastructure, and adjacent
              enabling technology that iR does not sell.

              The immersive entertainment market—encompassing branded experiences, live-event venues, and digital fan
              engagement—sits at $146.92B (Mordor, 12.16% CAGR) to $185.7B (Fortune Business Insights, 26.7% CAGR) in
              2026. The 3D e-commerce segment, where Obsess and iR Studio compete, is valued at $10.54B in 2026 at a
              23.6% CAGR. The AR/VR market on a hardware-plus-software basis is estimated at $41.8B in 2026 at a 29.1%
              CAGR (Coherent Market Insights). Combining the XR platform layer, the brand/immersive-commerce slice of
              immersive entertainment, and the 3D e-commerce market yields an evidence-constrained SAM estimate in the
              $50–60B range for the software and services layers where iR has active deployments. This remains a rough
              proxy: iR does not disclose revenue or ARR, and no analyst report specifically isolates the multi-vertical
              immersive platform-as-a-service segment that iR occupies.
