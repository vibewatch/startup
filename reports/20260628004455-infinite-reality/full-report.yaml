          - type: callout
            title: Acquisition Counterparties Carry Silent Risk
            body: >-
              Every acquisition Infinite Reality executed used all-stock consideration priced at an unaudited valuation.
              Counterparties who received shares — LandVault ($450M), Touchcast ($500M), Drone Racing League ($250M),
              Obsess ($22M), and others — hold equity in a company whose stated value rests on a phantom $3.36 billion
              fundraise and an unverified revenue base. At least one counterparty (Obsess) has already sued over unpaid
              consideration, and the ongoing SEC investigation could create retroactive disclosure obligations. The tail
              risk is that several acquisition counterparties simultaneously seek rescission or cash compensation when
              the phantom valuation can no longer be sustained.
