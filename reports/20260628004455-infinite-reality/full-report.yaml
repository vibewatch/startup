      - number: '8.3'
        title: Cole Fraud, Legal Overhang, and Governance Failures
        blocks:
          - type: paragraph
            body: >-
              On June 11, 2026, the SEC filed civil complaint LR-26563 against Charles J. Cole (57, Mooresville, NC) and
              his attorney Torben M. Welch, alleging a scheme to fraudulently obtain 239 million shares — approximately
              25% of iR's outstanding equity — by falsely claiming control of at least $55 billion in assets and
              promising a $3.36 billion investment that was never made. The DOJ's Southern District of New York
              simultaneously charged Cole with wire fraud and conspiracy, carrying maximum sentences of 20 years each.

              The scheme was elaborate: Cole established offshore servers hosting a fake website that mirrored the
              website of a foreign bank, enabling iR executives to log into an account showing a fabricated funded
              balance. Cole's attorney Welch provided forged bank documents to a third-party lender to whom Cole pledged
              approximately 45 million of the iR shares as loan collateral, defaulting on the loan. Infinite Reality
              rescinded all shares issued to Cole and his entities in March 2026 after the fraud was uncovered. US
              Attorney Jay Clayton stated: "As alleged, Charles Cole built a fiction of wealth using fake bank records,
              sham correspondence, and a fraudulent bank website, then used that fiction to obtain hundreds of millions
              of shares with no intention of paying for them."

              iR has consistently described itself as a victim of misconduct and is cooperating with law enforcement.
              Federal authorities have not named iR leadership as criminal targets as of June 2026. However, the
              governance failures that enabled the fraud — issuing 25% of the company's equity to an unknown private
              investor based on fabricated documents without independent verification — independently disqualify iR from
              institutional diligence at the claimed valuation.

              Additional legal overhang: the SEC has an active subpoena (originally filed February 2025 to compel
              compliance related to a 2022 SPAC), and the DOJ's investigation into the $3 billion collapse continues.
              Sony Music obtained a default certificate for $9.2 million in unpaid royalties with additional claims up
              to $37.5 million. CFO Brian Effrain and CLO Jennifer Pepin both departed in September 2025, eliminating
              the senior financial and legal oversight during the most critical governance period.

              The SEC's FY2025 enforcement results report (March 2026) cited 583 enforcement actions, emphasizing
              continued scrutiny of private company disclosures and investor fraud. The regulatory climate for
              unregistered private placements citing inflated valuations has materially tightened.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV005
            claimRefs:
              - CV001
              - CV007
              - CV041
              - CV043
      - number: '8.4'
        title: Scenario Analysis and Valuation Ranges
        blocks:
          - type: paragraph
            body: >-
              Absent audited financials, a defensible valuation must be scenario-anchored with explicit assumptions
              about the resolution of legal overhang, revenue quality, and management credibility.

              Bear scenario ($25–75 million): SEC investigation expands to iR leadership, creditors accelerate
              additional default actions, or the company is unable to raise fresh capital. In this scenario equity is
              consumed by litigation reserves, creditor claims, and operating cash burn, leaving negligible residual
              value. The $350 million preferred liquidation preference from the July 2024 round would extinguish common
              equity at any realistic exit price.

              Base scenario ($100–250 million): the SEC/DOJ investigations conclude with Cole as the sole defendant, iR
              restructures management and governance, and achieves a strategic sale of specific portfolio assets. At $75
              million unaudited revenue and a sector-appropriate 1.5–3x revenue multiple (discounted for unaudited
              financials, legal overhang, and market compression), the enterprise value would fall in this range. All
              proceeds would first satisfy the $350 million preferred liquidation preference, leaving common
              shareholders with zero in almost any exit scenario.

              Bull scenario ($300–600 million): a strategic acquirer values the Drone Racing League media rights and
              Thunder Studios production capability, a reconstituted management team achieves a validated $100–150
              million ARR run-rate within 24 months, and legal issues are fully resolved. At 3–4x revenue this yields
              $300–600 million enterprise value — still an 89–97% discount to the $15.5 billion self-reported peak, and
              still below the $350 million preferred overhang in most structures.

              No scenario supports the $12.25 billion–$15.5 billion self-reported range. Even in a generous bull case
              with fully resolved legal issues and a validated revenue base, the comparable set (Matterport at 9–10x,
              Unity at 2.7x, XR sector at 7–12x) offers no pathway to a >$1 billion exit absent proven enterprise ARR at
              scale, audited financials, and institutional backing — none of which iR currently has.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
