            body: >
              The $50–60B SAM range in this chapter is an author-constructed cross-segment estimate, not a direct
              analyst figure. It is derived by summing relevant sub-segments of three separately tracked markets and
              then adjusting for iR's scope. Because iR does not disclose revenue or ARR, and because no analyst tracks
