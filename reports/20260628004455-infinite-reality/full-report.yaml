      - number: '3.5'
        title: Differentiation, Switching Costs, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's stated differentiation centers on three pillars: (1) data ownership— brands retain all
              first-party engagement data rather than ceding it to a platform; (2) device agnosticism—iR Studio
              experiences render in mainstream browsers without app downloads or headsets; and (3) full-stack
              integration—combining no-code authoring (iR Studio), enterprise services (iR Enterprise), 3D engine (iR
              Engine), and acquired vertical capabilities (Obsess virtual stores, LandVault digital twins, Touchcast AI
              agents). The full-stack claim is also the principal integration risk: unifying five or more separately
              built systems on a common platform is an unvalidated execution assumption that the company has not
              substantiated with independent customer proof across products.

              Switching costs for enterprise immersive web are moderate at best. Virtual store experiences built on one
              platform's proprietary toolchain require rebuilding on any alternative, creating some asset-level lock-in.
              However, the absence of standardized 3D content interchange formats means most custom assets are
              non-portable, which cuts both ways: brands are modestly locked in but so is iR when retaining clients, as
              competitive displacement requires full asset recreation. iR's distribution moat is thin compared with
              Roblox and Fortnite: it relies entirely on brands driving their own traffic to hosted experiences.
              Multi-homing is easy—a brand can simultaneously run an Emperia store for one region and an iR Studio
              deployment for another—limiting exclusive capture. The LandVault MENA network (UAE and Saudi government
              tourism boards, real estate), Google Cloud partnership for enterprise RFPs, and the Obsess client roster
              of over 400 global brands represent the company's primary distribution advantages. All three are
              relationship-dependent and subject to disruption by the ongoing legal proceedings.
            claimRefs:
              - CP019
              - CP030
              - CP031
              - CP038
              - CP039
