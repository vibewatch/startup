      - number: '8.2'
        title: Financing Context, Multiples, and Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's financing history is unusual in its reliance on anonymous and unverified investors. The
              only independently corroborated raise is the July 2024 $350 million round from an undisclosed family
              office at a $5.1 billion post-money valuation. That round, at approximately 102x the then-reported $50
              million 2023 revenue, is itself far above sector norms. The January 2025 $3.36 billion raise from Cole was
              never received; iR rescinded all 239 million issued shares in March 2026 after the fraud was uncovered.

              Comparable valuation benchmarks for 2025–2026 across the spatial/XR/AI ecosystem:

              Public spatial and XR companies trade at compressed multiples relative to peak-cycle valuations. Unity
              Technologies reported FY2025 revenue of approximately $1.1 billion with a market capitalization near $3
              billion in early 2026, implying roughly 2.7x revenue — reflecting structural challenges from its pricing
              controversy and developer exodus. Roblox carries a platform-premium valuation of approximately 27x
              revenue, justified by a network-effect gaming ecosystem with clear monetization, 90 million daily active
              users, and audited financials.

              Private M&A comps: CoStar Group acquired Matterport, a leading 3D immersive digital twin SaaS company, at
              approximately $1.6 billion for $158–170 million in annual revenue — roughly 9–10x, a reasonable enterprise
              multiple for proven immersive SaaS with documented enterprise adoption. Magic Leap, despite raising over
              $4.5 billion from investors including Google, Saudi PIF, and Alibaba, faced a looming 2026 cash gap with
              ongoing dependence on PIF funding, suggesting the XR hardware premium has collapsed since 2018.

              Private market XR/spatial computing VC data for 2025–2026 shows 7–12x revenue multiples for mid-tier
              platforms and 10–20x for category leaders with strong enterprise ARR. AI foundation model companies
              (Anthropic, OpenAI) commanded 20–35x ARR multiples in 2025–2026, justified by verified revenues of $14–47
              billion annually and extraordinary growth. These premiums are not applicable to iR, which lacks audited
              financials, verified enterprise ARR, and independent investor backing.

              The broader VC market context: down rounds represented 18–22% of all venture financings in 2025–2026 (the
              highest sustained level since 2008), and VC funding for metaverse-focused companies collapsed from $5.6
              billion in 2022 to $1.4 billion in 2024. Any fresh institutional round for iR at a premium to the July
              2024 valuation would require extraordinary justification that current evidence does not support.
