      - number: '5.2'
        title: Core Technology Stack and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The iR Engine is the foundational rendering layer. Originally developed as Ethereal Engine (founded 2020
              by Liam Broza, Kyle Baran, and team), it is built on JavaScript frameworks and runs entirely
              browser-native without requiring a downloaded client. It supports scalable multiplayer experiences with
              voice, video, expressive avatars, and a visual editor, accessible across desktop, mobile, and wearables
              including Apple Vision Pro and Meta Quest 2. The open-core model means the codebase is publicly available
              on GitHub (ir-engine/etherealengine-archive), though the developer community signal from the repository is
              limited relative to established game-engine ecosystems. Ethereal's prior client roster (T-Mobile, Johnson
              & Johnson, Ripple, LAX) provided an enterprise reference base that transferred to iR post-acquisition.

              Touchcast's AI agent layer is built on Microsoft Azure via a reported $50 million strategic partnership
              and uses OpenAI models. Touchcast's cognitive caching technology reportedly reduces AI energy consumption
              by up to 50% and accelerates response times by up to 100 times by rendering AI video on the end-user
              device rather than a cloud GPU. Touchcast holds 27 patents covering coordinated AI group presentations,
              video conferencing enhancements, and intelligent virtual assistant systems. These patents represent the
              most defensible element of the IP portfolio and were recognized with a ClimaTech Great Global Innovation
              Challenge award and an Accenture V360 Customer Award. Touchcast has been trusted by Microsoft, HSBC,
              Pfizer, and Imperial Business School.

              At the infrastructure layer, iR has a five-year Google Cloud partnership (signed September 2024) providing
              Gemini AI model access and cloud infrastructure for 3D web experiences. iR Studio is distributed via
              Google Cloud Marketplace since April 2025. The combination of Azure (AI agents) and Google Cloud
              (3D/spatial experiences) creates a multi-cloud dependency that adds operational complexity and
              vendor-concentration risk.
