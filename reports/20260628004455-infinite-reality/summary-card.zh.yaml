  topStrengths:
    - 通过 LandVault 和 Obsess 拿到具名企业客户，手里有一组覆盖沉浸式商务、媒体和创作者的资产。
    - 2024 年 7 月确认完成 $350M 现金融资，相对公司历史规模是一笔有分量的资本。
    - 在 3D 品牌激活、消费者互动和战略媒体 IP 上已有部分真实商业证明。
  topRisks:
