    - 当前非限制性现金余额和 2025 年后的运营现金跑道仍未验证。
    - 核心平台没有独立的客户留存、流失或队列数据。
    - SEC/DOJ 后续影响的最终范围，以及公司领导层可能承担的风险，仍未落定。
