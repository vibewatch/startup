    - 增长大多靠并购拉动，自然需求、整合质量、利润率轮廓和真实烧钱速度都不清楚。
    - Napster 诉讼、供应商判决、要约收购失败、裁员和高管离职，把偿付能力和治理风险推到很紧的位置。
  unresolvedGaps:
