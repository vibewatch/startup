  - id: recommendation-diligence
    title: Recommendation, Diligence Asks, and Exit Readiness
    body: >-
      Recommendation: AVOID. No published price point based on iR's self-reported $12.25–$15.5 billion
      valuation is supportable given the current evidence base. Entry discipline requires: (1) independently
      audited financials confirming revenue quality and segment breakdown; (2) full resolution of SEC and DOJ
      investigations; (3) independent governance structure with named board members; (4) re-priced valuation
      at market-appropriate multiples (1.5–10x verified revenue); and (5) credible institutional co-investors
      with disclosed identities and verified committed capital.

      Exit readiness is low. The company has failed four separate tender-offer or SPAC exits since 2022. No
      IPO path is viable under current regulatory conditions. The most plausible exit remains a distressed-asset
      strategic acquisition targeting specific portfolio items — DRL media rights, Thunder Studios production,
      or LandVault enterprise IP — at prices well below the preferred liquidation preference.

      If a future diligence process is initiated, the minimum asks before any engagement should be as listed
      in the Final Diligence Asks table. Thesis-break triggers that would immediately invalidate the investment
      case regardless of other conditions are captured in the Thesis-Break Triggers table.
