  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: investor-identity
      missingEvidence: "The identity, AUM, and due diligence process of the July 2024 $350M investor have not been publicly disclosed by iR or any third-party publication as of June 2026."
      whyItMatters: "Without investor identity verification, it is impossible to confirm whether the $5.1B valuation reflected an arm's-length transaction or another circular/non-arm's-length deal; the entire capital structure and preferred liquidation preference analysis depends on this round being legitimate."
      diligencePath: "Request capitalization table and investor identity from management; verify through fund AUM databases (PitchBook, Crunchbase); require investor entity registration and AUM documentation as a pre-condition for engagement."
      relatedQuestionRefs:
        - QV012

    - type: private-evidence-only
      severity: blocking
      topic: preferred-terms
      missingEvidence: "The exact liquidation preference, participation rights, anti-dilution provisions, and conversion terms of the July 2024 $350M preferred round are undisclosed; iR has not filed any SEC instrument reporting these terms."
      whyItMatters: "Without knowing preferred terms, it is impossible to determine what exit price would return any value to common shareholders; strong anti-dilution or participation rights could mean the common equity is worthless at any realistic exit price."
      diligencePath: "Request investor rights agreement, certificate of incorporation, and capitalization table from management; if any side letters or board observer rights exist, request those as well."
      relatedQuestionRefs:
        - QV014

    - type: missing-source
      severity: material
      topic: enterprise-revenue
      missingEvidence: "No independent verification of iR's reported $75M 2024 revenue or $50M 2023 revenue exists; no Big-4 or equivalent audit firm has been named; no SEC filing requiring financial disclosure has been identified."
      whyItMatters: "All three valuation scenarios depend on a verified revenue figure; the self-reported $75M drives the 207x multiple calculation; if true revenue is substantially lower or negative EBITDA is larger, even the bear case EV is optimistic."
      diligencePath: "Request audited or reviewed financial statements; request any investor rights to audit; seek out court-filed financial evidence from the SEC subpoena or creditor proceedings."
      relatedQuestionRefs:
        - QV020

    - type: regulatory-pending
      severity: material
      topic: SEC-subpoena-scope
      missingEvidence: "The full scope of the SEC subpoena (first filed February 2025) and whether it has been resolved or expanded has not been publicly disclosed; it is unknown whether the subpoena covers officers beyond the Cole transaction."
      whyItMatters: "If the subpoena scope extends to management misconduct or revenue disclosures, the legal overhang could be significantly worse than what is visible from public Cole-related filings alone."
      diligencePath: "Monitor SEC EDGAR enforcement releases and PACER docket for the Nevada and SDNY cases; engage securities counsel to assess whether any Freedom of Information Act request could narrow the scope uncertainty."
      relatedQuestionRefs:
        - QV011

    - type: missing-source
      severity: material
      topic: enterprise-ARR
      missingEvidence: "iR has not disclosed any segment-level revenue breakdown, enterprise customer names, or ARR figure; independent sources found no corroboration for the claimed pipeline or customer base in any published research as of June 2026. The comparable valuation table is therefore partial: it cannot include an iR-verified enterprise ARR row against which to benchmark peers."
      whyItMatters: "Without verified enterprise ARR, any bull-case scenario is unbounded speculation; the Matterport comp ($1.6B for $158M enterprise SaaS) requires documented enterprise adoption that iR has not demonstrated."
      diligencePath: "Request customer list, revenue-by-segment breakdown, and representative enterprise contracts as part of any formal diligence process; verify through customer reference calls independently."
      relatedQuestionRefs:
        - QV020
      relatedTableRefs:
