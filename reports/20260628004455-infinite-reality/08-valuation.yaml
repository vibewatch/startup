  - id: scenario-analysis
    title: Scenario Analysis and Valuation Ranges
    body: >-
      Absent audited financials, a defensible valuation must be scenario-anchored with explicit assumptions
      about the resolution of legal overhang, revenue quality, and management credibility.

      Bear scenario ($25–75 million): SEC investigation expands to iR leadership, creditors accelerate
      additional default actions, or the company is unable to raise fresh capital. In this scenario equity is
      consumed by litigation reserves, creditor claims, and operating cash burn, leaving negligible residual
      value. The $350 million preferred liquidation preference from the July 2024 round would extinguish
      common equity at any realistic exit price.

      Base scenario ($100–250 million): the SEC/DOJ investigations conclude with Cole as the sole defendant,
      iR restructures management and governance, and achieves a strategic sale of specific portfolio assets.
      At $75 million unaudited revenue and a sector-appropriate 1.5–3x revenue multiple (discounted for
      unaudited financials, legal overhang, and market compression), the enterprise value would fall in this
      range. All proceeds would first satisfy the $350 million preferred liquidation preference, leaving
      common shareholders with zero in almost any exit scenario.

      Bull scenario ($300–600 million): a strategic acquirer values the Drone Racing League media rights and
      Thunder Studios production capability, a reconstituted management team achieves a validated $100–150
      million ARR run-rate within 24 months, and legal issues are fully resolved. At 3–4x revenue this
      yields $300–600 million enterprise value — still an 89–97% discount to the $15.5 billion self-reported
      peak, and still below the $350 million preferred overhang in most structures.

      No scenario supports the $12.25 billion–$15.5 billion self-reported range. Even in a generous bull
      case with fully resolved legal issues and a validated revenue base, the comparable set (Matterport at
      9–10x, Unity at 2.7x, XR sector at 7–12x) offers no pathway to a >$1 billion exit absent proven
      enterprise ARR at scale, audited financials, and institutional backing — none of which iR currently
      has.
