  claims:
    - id: CV001
      statement: "On June 11, 2026, the SEC filed civil complaint LR-26563 against Charles J. Cole and his attorney Torben M. Welch, alleging a scheme to fraudulently obtain 239 million shares of Infinite Reality through a fabricated $3.36 billion investment promise and false claims of controlling $55 billion in assets."
      type: third-party-reported
      topic: legal-fraud
      sourceRefs:
        - SV001
        - SV003
        - SV009
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QV025

    - id: CV002
      statement: "On June 11, 2026, the DOJ's Southern District of New York charged Cole with one count of wire fraud, one count of conspiracy to commit wire fraud, and one count of conspiracy to commit securities fraud, with maximum sentences of 20, 20, and 5 years respectively."
      type: third-party-reported
      topic: legal-fraud
      sourceRefs:
        - SV002
        - SV003
        - SV007
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QV025
        - QV027

    - id: CV003
      statement: "Cole falsely represented to Infinite Reality that he or his entity Avranoc controlled at least $55 billion in assets and promised a $3.36 billion investment; iR issued over 239 million shares to Cole and his entities but received zero cash consideration."
      type: third-party-reported
      topic: legal-fraud
      sourceRefs:
        - SV001
        - SV010
        - SV012
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QV003
        - QV018

    - id: CV004
      statement: "Cole established offshore servers hosting a fake website that mirrored the site of a foreign bank, enabling iR executives to log in and view a fabricated funded account, which iR relied on in issuing the 239 million shares."
      type: third-party-reported
      topic: legal-fraud
      sourceRefs:
        - SV001
        - SV003
        - SV010
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QV030

    - id: CV005
      statement: "Infinite Reality rescinded all 239 million shares issued to Cole and his entities in March 2026 after the fraudulent scheme was uncovered; the company has not identified any other fraudulent capital raises as of June 2026."
