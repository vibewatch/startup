  - id: incumbents-platform-giants
    title: Platform Incumbents and Consumer Metaverse Rivals
    body: >-
      The largest potential competitive threat to iR's immersive web vision came from platform
      incumbents with distribution scale: Meta (Horizon Worlds), Epic Games (Fortnite UEFN),
      and Roblox. By mid-2026 the incumbent threat profile has shifted significantly. Meta
      confirmed the shutdown of Horizon Worlds' VR version on June 15, 2026, following an
      estimated $70–80 billion in Reality Labs operating losses since 2020, years of disappointing
      user numbers (monthly users in the low hundreds of thousands), and a $17.7 billion Reality
      Labs loss in 2024. Meta simultaneously discontinued Horizon Workrooms, its enterprise VR
      collaboration tool, in February 2026. The company has pivoted entirely to mobile, AI, and
      AR smart glasses, exiting the enterprise immersive-commerce segment. This is a
      double-edged development for iR: it removes the best-resourced incumbent but also
      validates the structural difficulty of the market at scale.

      Epic Games' Unreal Editor for Fortnite (UEFN) targets branded virtual experience
      deployments and events at scale, drawing on hundreds of millions of Fortnite users.
      Roblox similarly offers brands persistent virtual worlds and serves hundreds of millions
      of monthly active users with an estimated $3 billion-plus in annual revenue. Both platforms
      provide discovery distribution that iR lacks entirely: brand experiences on Roblox or
      Fortnite reach massive existing audiences without requiring the brand to drive traffic.
      iR's counter-positioning is data ownership and brand sovereignty: experiences on Roblox
      or Fortnite are subject to platform rules, revenue sharing estimated at 30–50%, and
      algorithmic discovery. Unity and Unreal Engine as underlying creation tools are not
      direct competitors but set the capability baseline against which iR's proprietary iR
      Engine is measured. In the agentic-AI segment, Salesforce Agentforce, Microsoft Copilot
      Studio, and Google Vertex AI Agent Builder—all expanded significantly in 2025–2026—
      represent the enterprise agentic AI set for iR's Touchcast layer.
