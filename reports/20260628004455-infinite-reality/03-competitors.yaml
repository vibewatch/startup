  - calloutType: insight
    title: Competitor Attrition Has Reduced Near-Term Product Parity Risk
    body: >-
      The two most technically capable direct competitors in immersive 3D commerce—Obsess and
      LandVault—have been absorbed into iR's portfolio, Meta has exited the enterprise VR segment,
      and ByondXR has failed. The surviving independent tier (Emperia, VNTANA) is collectively
      sub-$30 million in total capital raised. This competitive attrition reduces near-term
      product parity risk and leaves iR without a well-funded challenger in the 3D commerce SaaS
      space. However, it also removes the competitive benchmark signal that helps enterprise buyers
      justify procurement decisions: without live competitors demonstrating the category value,
      buyer urgency for the whole category may decline.
    claimRefs:
      - CP004
      - CP015
      - CP028
      - CP029

