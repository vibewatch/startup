  - id: substitutes-status-quo
    title: Substitutes, Status Quo, and Adjacent Entrants
    body: >-
      The status quo—conventional 2D e-commerce built on Shopify, Salesforce Commerce Cloud,
      Magento, or custom stacks—remains the default buyer choice for brands evaluating iR
      Studio. These carry zero platform migration risk, broad third-party integrations, proven
      conversion benchmarks, and large service ecosystems. For enterprise brands evaluating
      3D immersive storefronts, the build-it-yourself path using open tools is now cheaper than
      it was before 8th Wall's open-source release in February 2026. Three.js, Babylon.js
      (referenced in Amazon Sumerian's open-source successor), and WebGPU-native frameworks
      are freely available; a brand with developer resources can construct a capable
      web-based 3D experience without purchasing iR Studio, raising the commodity ceiling.

      Amazon Sumerian (AWS), while in maintenance mode, represents a managed-cloud alternative
      for brands already within the AWS ecosystem. For the Napster/AI-companion layer iR has
      pivoted toward, it faces commoditization from HeyGen, ElevenLabs, and Synthesia, all
      of which offer AI digital-persona and avatar capabilities at lower price points, with
      broader enterprise integrations and established track records. Decentraland and The
      Sandbox (web3 metaverse platforms) remain active but have not achieved material
      enterprise adoption, and their blockchain-native architecture limits broad brand
      deployment. Independent XR agencies and custom shops using Unreal or Unity compete
      for bespoke enterprise deployments in the higher-value tier of iR's addressable market.
      None of these substitutes individually match iR's stated full-stack breadth; together
      they cover every layer of iR's offering without requiring a single vendor relationship.
    claimRefs:
      - CP036
      - CP037
      - CP042
    figureRefs:
      - FP003

  - id: differentiation-switching-costs
    title: Differentiation, Switching Costs, and Distribution Power
    body: >-
      Infinite Reality's stated differentiation centers on three pillars: (1) data ownership—
      brands retain all first-party engagement data rather than ceding it to a platform;
      (2) device agnosticism—iR Studio experiences render in mainstream browsers without
      app downloads or headsets; and (3) full-stack integration—combining no-code authoring
      (iR Studio), enterprise services (iR Enterprise), 3D engine (iR Engine), and acquired
      vertical capabilities (Obsess virtual stores, LandVault digital twins, Touchcast AI
      agents). The full-stack claim is also the principal integration risk: unifying five or
      more separately built systems on a common platform is an unvalidated execution assumption
      that the company has not substantiated with independent customer proof across products.

      Switching costs for enterprise immersive web are moderate at best. Virtual store
      experiences built on one platform's proprietary toolchain require rebuilding on any
      alternative, creating some asset-level lock-in. However, the absence of standardized
      3D content interchange formats means most custom assets are non-portable, which cuts
      both ways: brands are modestly locked in but so is iR when retaining clients, as
      competitive displacement requires full asset recreation. iR's distribution moat is
      thin compared with Roblox and Fortnite: it relies entirely on brands driving their
      own traffic to hosted experiences. Multi-homing is easy—a brand can simultaneously
      run an Emperia store for one region and an iR Studio deployment for another—limiting
      exclusive capture. The LandVault MENA network (UAE and Saudi government tourism boards,
      real estate), Google Cloud partnership for enterprise RFPs, and the Obsess client roster
      of over 400 global brands represent the company's primary distribution advantages.
      All three are relationship-dependent and subject to disruption by the ongoing legal
      proceedings.
    claimRefs:
      - CP019
      - CP030
      - CP031
      - CP038
      - CP039
