  - id: direct-competitors
    title: Direct Immersive Commerce and 3D Web Platform Competitors
    body: >-
      In the direct 3D commerce and immersive web platform tier, the most credible independent
      competitor remaining as of mid-2026 is Emperia (London, founded 2019), which targets
      luxury and fashion brands with a virtual retail SaaS platform. Emperia raised approximately
      $10.9 million total, including a January 2023 Series A led by Base10 Partners and Sony
      Innovation Fund, with Daphni, Background Capital, and Stanford Capital Partners also
      participating. Clients include Bloomingdale's, Dior, Burberry, Lacoste, Tommy Hilfiger,
      Harrods, and Giorgio Armani. Estimated annual revenue is approximately $5.5 million with
      a valuation of around $16.5 million as of 2025 and roughly 50 employees. Emperia reported
      a 73% average conversion-rate improvement and 750% average ROI for brand partners relative
      to conventional 2D e-commerce, providing a documented ROI narrative that iR has not matched
      with independently verified metrics. This is a direct challenge to iR's positioning with
      the same luxury and fashion buyer segment.

      VNTANA (Los Angeles) focuses on 3D product visualization and digital asset management for
      enterprise retail, fashion, and manufacturing. With approximately $18.1 million in total
      funding, roughly $5 million in estimated annual revenue, and 28–37 employees as of 2026,
      VNTANA occupies an adjacent layer—3D asset optimization and AR/VR delivery—rather than
      full store creation. ByondXR (Tel Aviv, founded 2015) raised $7 million in seed funding
      and had powered immersive commerce experiences for P&G, LEGO, Lancôme, and Kraft Heinz
      before ceasing operations in September 2025. The combined exits of ByondXR and the iR
      acquisitions of Obsess and LandVault represent a notable consolidation of the vendor
      landscape, leaving fewer credible independent alternatives for brands evaluating 3D
      commerce platforms. Emperia and VNTANA together hold roughly $29 million in cumulative
      funding against iR's self-reported $15.5 billion valuation—illustrating the scale gap
      even if iR's actual capital position is severely impaired.
    claimRefs:
