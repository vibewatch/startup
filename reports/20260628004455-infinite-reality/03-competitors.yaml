company:
  name: Infinite Reality
chapter:
  number: 3
  title: Competitors
  summary: >-
    Infinite Reality's two most capable direct rivals in immersive 3D commerce (Obsess and
    LandVault) have been absorbed into its portfolio; Meta has shut down Horizon Worlds VR;
    and 8th Wall has gone open source, collapsing the paid WebAR tier. Surviving independent
    challengers (Emperia, VNTANA) are sub-$20M companies. The company's deepest competitive
    exposure is structural: ongoing SEC and DOJ proceedings arising from the $3.36 billion
    Cole fraud confirmed on June 11, 2026 undermine its ability to close enterprise deals,
    retain acquisitions, and out-invest well-capitalized incumbents such as Salesforce and
    Epic Games in the adjacent agentic-AI and platform-experience segments it has entered.

sections:
  - id: landscape-overview
    title: Competitive Landscape Overview
    body: >-
      Infinite Reality (iR) competes across three loosely coupled market segments, each with
      a distinct competitive set. The primary segment—immersive web and 3D commerce platforms—
      was a nascent, fragmented market in 2024 with no dominant incumbent. The largest
      alternative buyers can choose instead of iR Studio is the status quo: conventional 2D
      e-commerce websites (Shopify, Salesforce Commerce Cloud, custom builds), which carry
      zero platform-migration risk, broad third-party integrations, and large SaaS ecosystems.
      A secondary segment—enterprise agentic AI—entered iR's portfolio via the April 2025
      Touchcast acquisition and is dominated by well-capitalized incumbents: Salesforce
      Agentforce, Microsoft Copilot Studio, Google Vertex AI Agent Builder, and AWS Bedrock.
      The third segment—sports and entertainment media—is represented by the Drone Racing
      League, where MultiGP and established motorsport broadcasters are the competitive
      alternatives.

      The competitive dynamics in immersive 3D commerce shifted materially between 2024 and
      mid-2026. The two most capable direct competitors—Obsess (400-plus virtual stores for
      Ralph Lauren, L'Oréal, J.Crew, Disney Music Group) and LandVault (1.2 million sq ft
      of virtual experiences for Fortune 500 clients)—were absorbed into the iR portfolio
      via all-stock acquisitions. Meta's Horizon Worlds, the most visible platform-level
      threat, shut down its VR version on June 15, 2026, following an estimated $70–80 billion
      in Reality Labs losses since 2020. Niantic's 8th Wall, a paid WebAR tool priced at
      $700–$3,000 per project per month, was open-sourced in February 2026, eliminating its
      commercial offering entirely. ByondXR, a seed-funded immersive commerce platform that
      served P&G, LEGO, and Lancôme, went out of business in September 2025. Net effect:
      iR's most capable rivals have either been acquired, retreated, or failed, leaving a
      fragmented independent tier that is collectively sub-scale.
    claimRefs:
