  - id: moat-durability
    title: Moat Durability and Competitive Risk Assessment
    body: >-
      Infinite Reality's competitive durability faces four structural threats beyond direct
      product competition. First, the collapse of the $3 billion Cole investment destroyed
      the capital-deployment thesis at the core of iR's competitive strategy. The SEC civil
      case (LR-26563) and DOJ criminal indictment, both unsealed June 11, 2026, confirm iR
      issued 239 million shares with zero consideration received. Enterprise procurement teams
      at public or regulated companies routinely screen vendors for pending litigation and
      regulatory exposure; iR's status as the named issuer in an active SEC enforcement action
      and DOJ prosecution will appear in routine vendor due-diligence reviews, creating a
      material headwind in competitive evaluations against any counterpart that does not
      carry such exposure.

      Second, the Napster brand pivot generated reputational damage in the content-creator
      and rights-holder community. Performance-rights organizations alleged non-payment by
      the former streaming service, and the abrupt shutdown of the platform in January 2026
      while users were actively listening damaged brand trust among the digital-native audience
      iR aims to capture with AI products. Third, commoditization is accelerating: 8th Wall's
      open-source release and availability of WebGPU-native 3D frameworks raise the quality
      ceiling of what a brand's internal developer team can build without a vendor, directly
      compressing iR's pricing power. Fourth, in the agentic AI segment acquired via Touchcast,
      iR competes against Salesforce ($270-plus billion market cap), Microsoft, Google, and
      AWS—incumbents with orders-of-magnitude larger distribution, R&D budgets, and
      customer trust. No independent evidence has been published of Touchcast being selected
      over these alternatives in competitive enterprise evaluations.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP024
      - CP025
      - CP040

