  - id: partner-dependency-risk
    title: Partner and Platform Dependency Risks
    body: >-
      Infinite Reality's product infrastructure rests on two hyperscaler dependencies whose commercial terms
      differ materially from the company's public representations. A five-year Google Cloud partnership
      (2024–2029) provides infrastructure and access to Gemini AI models; Napster View additionally runs on
      Microsoft Azure OpenAI, as noted in a November 2025 partner announcement. Despite CEO Acunto's February
      2025 investor-event claim that the company was "supercharging Gemini," Google described its relationship
      with Infinite Reality to Forbes as that of an ordinary cloud customer. A technology partner with
      hyperscaler pricing leverage and contractual rights to change API terms at will represents a high-severity
      dependency for a cash-constrained company.

      The most catastrophic dependency breakdown occurred in the music rights domain. Sony Music, which had the
      contractual right to terminate its four licensing agreements upon the change of ownership to Infinite
      Reality, agreed instead to waive that right in exchange for a structured four-installment payment plan.
      Napster made no payments. Sony terminated all licenses in June–July 2025 and sued in August 2025. Napster
      continued streaming Sony content without authorization post-termination, compounding the breach-of-contract
      claim with willful copyright infringement liability. SoundExchange's parallel suit followed weeks later.
      The combined financial exposure from these two rights-holder lawsuits is $46.7 million in claimed damages
      before interest. Napster's response to the Sony suit was to file nothing; a default judgment was entered
      in October 2025.

      On the capital dependency side, Infinite Reality's funding pipeline ran through a broker-dealer network
      that included Cova Capital, which has a documented FINRA sanction history for recommending private share
      sales to retail investors without adequate due diligence and failing to verify issuer share legitimacy.
      The absence of institutional VC or PE backing and reliance on opaque intermediary networks creates extreme
      concentration risk in capital access.
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
