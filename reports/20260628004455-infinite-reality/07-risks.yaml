callouts:
  - calloutType: risk
    title: Active Federal Enforcement — SEC and DOJ Actions
    body: >-
      On June 11, 2026, both the SEC and DOJ filed formal proceedings against the perpetrator of Infinite
      Reality's fraudulent $3.36 billion fundraise. Infinite Reality is currently positioned as a victim, not
      a defendant; however, an SEC investigation into the company's own 2022 valuation and reverse-merger
      claims remains ongoing. Any escalation naming the company or its executives as defendants would be an
      immediate thesis-break event and would likely trigger change-of-control clauses in acquisition agreements
      and cloud partner contracts.
    claimRefs:
      - CR001
      - CR002
      - CR006

  - calloutType: risk
    title: Serial Nonpayment and Music Royalty Litigation
    body: >-
      Sony Music's $9.2 million back-royalty / $37.5 million copyright infringement suit, SoundExchange's
      $3.4 million action, and the default judgment entered in October 2025 represent a structural cash-flow
      dysfunction predating the fraud collapse. This pattern — documented across more than a dozen lawsuits
      in six states over a decade — is not a one-time incident. The streaming service was shut down not as
      a strategic pivot but in the context of unlicensed operation post-license termination. Investors should
      treat the rights-holder litigation stack as a leading indicator of hidden balance-sheet liabilities, not
      a legacy issue.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR033

  - calloutType: assumption
    title: Victim Posture Is Asserted but Not Fully Established
    body: >-
      Infinite Reality claims victim status in the Cole fraud. However, in March 2025 a company spokesperson
      told Forbes the funds were "in an Infinite Reality account and available to us" and that the company
      was "actively leveraging" them — statements made when, per the DOJ indictment, no money was ever
      transferred. Whether this represents innocent belief in Cole's fabrications or a material misrepresentation
      to third parties (including acquisition targets paid in stock backed by the phantom valuation) is
      the critical open question. Until the DOJ investigation closes without charging the company, this
      uncertainty creates a non-trivial tail risk on top of the already severe operational and litigation risks.
    claimRefs:
      - CR029
      - CR042

  - calloutType: insight
    title: Acquisition Counterparties Carry Silent Risk
    body: >-
      Every acquisition Infinite Reality executed used all-stock consideration priced at an unaudited
      valuation. Counterparties who received shares — LandVault ($450M), Touchcast ($500M), Drone Racing
      League ($250M), Obsess ($22M), and others — hold equity in a company whose stated value rests on
      a phantom $3.36 billion fundraise and an unverified revenue base. At least one counterparty (Obsess)
      has already sued over unpaid consideration, and the ongoing SEC investigation could create retroactive
      disclosure obligations. The tail risk is that several acquisition counterparties simultaneously seek
      rescission or cash compensation when the phantom valuation can no longer be sustained.
    claimRefs:
      - CR031
      - CR036
      - CR043

