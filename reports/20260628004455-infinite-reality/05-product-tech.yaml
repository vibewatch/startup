  evidenceGaps:
    - type: missing-source
      severity: material
      topic: touchcast-acquisition-close
      missingEvidence: >-
        Independent confirmation (SEC filing, press release with explicit close date, or authorized
        third-party reporting) that the Touchcast $500M acquisition formally closed and IP/team
        transfer is complete.
      whyItMatters: >-
        All Touchcast AI patents, codebase, and team are central to the agentic AI product narrative.
        If the deal has not closed, the IP is not owned by iR/Napster and the competitive moat is
        materially overstated.
      diligencePath: >-
        Request closing documentation, amended asset purchase agreement, or press release confirming
        close; cross-reference SEC enforcement database for any delay-related filings.
      relatedQuestionRefs:
        - QE022
        - QE004

    - type: missing-source
      severity: material
      topic: ir-engine-developer-community-health
      missingEvidence: >-
        Current GitHub repository metrics for the ir-engine/etherealengine-archive including star
        count, fork count, active contributor count, and issue/PR velocity as evidence of open-source
        community health.
      whyItMatters: >-
        An open-core strategy with a weak developer community limits the long-term defensibility of
