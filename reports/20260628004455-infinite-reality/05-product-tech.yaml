callouts:
  - calloutType: strength
    title: SOC 2 Type II Compliance and Documented Security Architecture
    body: >-
      Napster Corporation has the strongest documented security posture of any comparable immersive-tech
      startup: SOC 2 Type II annually audited, AES-256 + TLS 1.2+, Azure-hosted multi-tenant isolation,
      no data used for AI training, and explicit compliance with the new California AI agent law. This
      provides a credible enterprise trust baseline for iR Enterprise and B2B AI agent deployments.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030

  - calloutType: risk
    title: Mac-Only Constraint and UX Quality Gap in AI Companion Products
    body: >-
      Napster 26, Napster View, and Napster Station are the core differentiation narrative for 2026, yet
      Napster 26 remains Mac-only with PC support deferred. Digital Music News and Midnight Rebels documented
      real-time conversation lags, sycophantic AI responses, and Uncanny Valley animation issues. Until
      cross-platform availability is delivered and UX quality gaps are resolved, the AI companion product
      line cannot scale to its claimed TAM.
    claimRefs:
      - CE019
      - CE036
      - CE037

  - calloutType: risk
    title: Multi-Acquisition Integration Risk Across Incompatible Codebases
    body: >-
      The product portfolio spans at least eight acquired technology codebases (Ethereal Engine, Obsess,
      LandVault, Touchcast, Stakes, TalentX, Drone Racing League, Napster streaming). All-stock acquisition
      structures prioritized speed over integration planning. The Touchcast acquisition ($500M) was
      announced in April 2025 but formal close has not been independently confirmed as of June 2026.
      Integration completeness across the stack remains a material diligence gap.
    claimRefs:
      - CE010
      - CE019
      - CE039
      - CE040

  - calloutType: insight
    title: Touchcast Patent Portfolio Is the Most Defensible Technical Asset
    body: >-
      Among all acquired technology assets, Touchcast's 27 AI interaction patents represent the only
      documented IP protection directly relevant to the AI agent product direction. Combined with cognitive
      caching technology reducing AI inference cost and being purpose-built for enterprise compliance
      (Azure/OpenAI/SOC2), Touchcast provides the clearest defensibility narrative. However, the acquisition
      close remains unconfirmed, and full IP transfer is contingent on deal completion.
    claimRefs:
      - CE011
      - CE012
      - CE022
      - CE023

