  - id: roadmap-maturity
    title: Product Roadmap and Development Stage
    body: >-
      The 2025–2026 product release cadence reflects a rapid pivot from immersive 3D web to agentic AI.
      The iR Engine soft launch at SXSW (March 2024) was the last major 3D-first announcement; subsequent
      milestones have been AI-agent-centric. Napster Spaces beta (May 2025), the corporate rebrand to
      Napster Corporation (May 2025), Napster 26 for Mac (October 2025), and the mobile app redesign
      (January 2026) represent the AI companion product arc. The Omniagent API (May 2026) and NV2 video
      model (June 2026) confirm the enterprise API monetization direction.

      The Thunder Studios Originals division (formed May 2026) signals a renewed push into content
      production leveraging AI tooling. Partnership-driven deployments—the Formula 1 Spa Grand Prix
      AI concierge (June 2026), ITB Berlin AI visitor experience (March 2026), and EuroShop 2026 retail
      showcase (February 2026)—demonstrate the go-to-market pattern of event-tied B2B pilots. The Solgari
      integration with Microsoft Teams/Dynamics 365 (February 2026) represents the deepest enterprise
      workflow integration to date. PC support for Napster 26 and broader Android and iOS availability
      were announced as forthcoming in 2026 but remain undelivered as of the runDate. The status of the
      Touchcast acquisition closing has not been independently confirmed in public reporting as of June
      2026, leaving product integration timelines uncertain.
