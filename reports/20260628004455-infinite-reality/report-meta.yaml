  topStrengths:
    - "Owns a broad portfolio of immersive-commerce, media, and creator assets with named enterprise customers via LandVault and Obsess."
    - "Confirmed $350M July 2024 cash round provided meaningful capital relative to historical company size."
    - "Has some authentic commercial proof points in 3D brand activations, consumer interactions, and strategic media IP."
  topRisks:
    - "The company's headline valuation relies on unaudited revenue, self-marked stock, and a later financing narrative that collapsed under SEC/DOJ scrutiny."
    - "Most growth has been acquisition-driven, leaving unclear organic demand, integration quality, margin profile, and true cash burn."
    - "Napster litigation, vendor judgments, failed tender offers, layoffs, and executive departures raise acute solvency and governance concerns."
  unresolvedGaps:
    - "No audited financial statements, ARR disclosure, or segment-level revenue breakdown are publicly available."
    - "Current unrestricted cash balance and post-2025 operating runway remain unverified."
    - "No independent customer-retention, churn, or cohort data is available for the core platform."
    - "The ultimate scope of SEC/DOJ fallout and any exposure for company leadership remain unresolved."
