companyProfile:
  summary: >-
    Infinite Reality is a private immersive-technology and digital-media platform that began in
    2019 in Connecticut and expanded through a rapid series of stock-funded acquisitions,
    including Ethereal Engine, Stakes, the Drone Racing League, LandVault, Napster, and
    Touchcast. The company sells enterprise 3D experiences, virtual commerce and brand spaces,
    media/IP assets, and newer AI persona products under the Napster banner, but most public
    scale claims remain unaudited and heavily acquisition-derived.
  foundedDate: "2019-01-01"
  founders:
    - name: "John Acunto"
      role: "Co-founder and CEO"
      background: "Former Display Social leader who built Infinite Reality through acquisitions and remains the primary strategic decision-maker."
      claimRefs: [CO001, CO002]
  foundingLocation: "Connecticut, USA"
  headquarters: "Boca Raton, Florida, USA"
  productSummary: >-
    Platform for creating and monetizing immersive 3D experiences, virtual stores, branded
    environments, digital twins, creator tools, and AI-powered digital personas, supported by a
    portfolio that includes LandVault, Obsess, Napster, Thunder Studios, and the Drone Racing
    League.
  customerFocus: >-
    Large consumer brands, retailers, entertainment companies, media owners, sports leagues, and
    selected enterprise/government buyers seeking immersive commerce, fan engagement, or training
    experiences.
  businessModel: >-
    Mixed model spanning enterprise services, software subscriptions, media/IP monetization, and
    adjacent AI products, with disclosed revenue largely consolidated from acquired subsidiaries
    rather than transparently segmented organic platform sales.
  stage: "Private growth stage"
  fundingStatus: >-
    The only clearly corroborated external cash round is the July 2024 $350 million family-office
    investment at a $5.1 billion valuation; the later announced $3.36 billion financing was
    fraudulent and never funded.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO016, CO017, CU001, CI031, CV010, CV012]
summary:
  headline: >-
    Infinite Reality has assembled real immersive-commerce and media assets, but the gap between
    its confirmed fundamentals and its self-reported valuation remains so extreme that the equity
    case is currently dominated by governance, legal, and financing downside rather than platform
    upside.
