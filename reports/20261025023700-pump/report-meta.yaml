companyProfile:
  summary: >-
    Pump is a founder-led private FinOps platform that helps companies optimize cloud commitments, inspect
    infrastructure spend, and monitor security posture across major cloud providers. Its customer-facing proposition is
    free, with Pump stating that cloud providers compensate it for helping customers stay optimized; the public record
    does not disclose the resulting take rate, margin, retention, or insurance economics.
