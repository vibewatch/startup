callouts:
  - calloutType: risk
    title: Commitment exposure is the central financial-control risk
    body: Pump says every recommended cloud commitment is fully insured, but the assigned evidence does not show the policy, exclusions, reserves, insurer, or claims history. Until those documents are reviewed, the promise should be treated as an unverified mitigation rather than a cleared risk.
    claimRefs: [CR005, CR006]
  - calloutType: risk
    title: Customer-control allegations need direct verification
    body: A G2 reviewer alleged difficulty leaving Pump's billing organization and another said AWS negotiations went through Pump. These are unverified individual accounts, but they justify a documented offboarding test and contract review before relying on flexible-exit claims.
    claimRefs: [CR009, CR010]
  - calloutType: insight
    title: Public metrics need a single denominator
    body: The May 2026 release reports approximately 19% average monthly savings and more than $600 million in annual cloud spend, while Pump's website displays 30% average savings and more than $1.057 billion managed. Period, population, and metric definitions should be reconciled before using either set in a model.
    claimRefs: [CR002, CR003, CR015, CR016]
  - calloutType: recommendation
    title: Monitorable diligence gates
    body: Require a reconciled savings bridge, current security and insurance documents, a tested customer-exit workflow, recommendation false-positive metrics, and Pump-specific uptime and incident records. Failure on any of these should pause expansion rather than be offset by headline savings claims.
    claimRefs: [CR004, CR005, CR008, CR009, CR015, CR016, CR017]
