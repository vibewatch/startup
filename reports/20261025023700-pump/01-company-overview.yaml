callouts:
  - calloutType: strength
    title: Clear product wedge with low adoption friction
    body: Pump combines a free-to-customer model, automated savings, visibility, and security in one platform. The product proposition is concrete and differentiated, although provider economics and realized savings remain company-controlled disclosures.
    claimRefs: [CO001, CO003, CO004]
  - calloutType: risk
    title: Private-company disclosure limits underwriting confidence
    body: The assigned evidence does not independently verify the reported valuation, revenue, headcount, or provider compensation model. Formal role concentration around the founder and a competitor-reported dashboard weakness add governance, product-validation, and key-person diligence requirements; the competitor comparison is directional evidence only.
    claimRefs: [CO002, CO007, CO009, CO011, CO012, CO014]
  - calloutType: recommendation
    title: Verify economics before relying on scale claims
    body: Request capitalization documents, provider agreements, audited or management revenue bridges, customer retention and concentration schedules, and a current officer and board list before treating public scale indicators as investment-grade underwriting inputs.
    claimRefs: [CO008, CO011, CO012, CO014, CO016]
