company:
  name: Pump
chapter:
  number: 1
  title: Company Overview
  summary: Pump is a San Francisco cloud-cost platform that combines savings automation, spend visibility, and cloud security, with a free-to-customer model funded by cloud-provider economics. Public evidence supports a founder-led private company with meaningful reported scale, but its founding chronology conflicts across sources and its financial, governance, and headline operating metrics remain company-reported or third-party compiled.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: Pump Billing, Inc. is an active California stock corporation filed on May 3, 2023, with San Francisco addresses and a software-as-a-service business classification. Pump's own website positions the company as a free cloud platform spanning savings, visibility, security, and incident-response capabilities, while its June 2026 release says the platform covers AWS, GCP, and Azure. The company says cloud providers compensate it for helping customers remain optimized, so the customer-facing product has no platform fee, savings percentage, contract, cancellation fee, or minimum commitment. This is a differentiated distribution and monetization proposition, but the public sources do not disclose provider economics, gross margin, or contract-level durability.
    claimRefs: [CO001, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-scale-and-governance
    title: Leadership, scale, and governance
    body: Spandana Nakka is identified as Pump's CEO and founder, and a California business-record compilation lists her as director, CEO, and secretary; Michael Buckwald is listed as CFO and registered agent. The available evidence therefore supports a founder-led operating structure with substantial concentration of formal roles in Nakka, but it does not establish a full executive team, board composition, independent oversight, or succession plan. Pump reported thousands of customers in 22 countries and more than $600 million of annual cloud spend in June 2026; the homepage displayed more than $1.057 billion of managed spend when accessed in October. These differently dated company claims are useful scale indicators, not audited customer or spend disclosures. G2's fetched profile displayed 33 reviews and a 4.7/5 aggregate score, while Taloflow's competitor-authored matrix rated Pump poorly for customizable dashboards; the latter is an adverse signal, not an independent benchmark.
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO009, CO010, CO013]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, milestones, and diligence posture
    body: The strongest public financing record in the assigned pool is a GetLatka profile that reports a March 2023 seed round of $4 million at a $1.5 billion valuation, alongside a company-submitted April 2025 revenue figure of $15.2 million. Those figures are not corroborated by a filing or a named financing announcement in the current pool, so they are reported data points rather than verified capitalization facts or evidence of cash available. GetLatka gives a 2022 founding year, while a Pump-issued release says the company marked its three-year anniversary in April 2026, implying an April 2023 operating milestone; the legal entity was filed in May 2023. The chronology is unresolved. The core diligence gaps are financing terms, preference structure, revenue quality, provider take-rate economics, and reconciliation of founding and scale metrics.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
