      - [Confidence, "Medium-low", "Product and customer signals are current enough for a directional view, but financial disclosure is incomplete."]
      - [Risk rating, "High", "Insurance, customer control, recommendation accuracy, and provider dependence can affect trust and margins."]
      - [Valuation stance, "Unknown", "No current valuation or comparable transaction is disclosed in the assigned evidence."]
      - [Decision implication, "Conditional diligence", "Advance only after cap-table, cohort economics, and financing-term review."]
    notes: "Directional synthesis from current assigned sources; no current valuation, ARR, revenue, margin, or return target was disclosed."
    claimRefs: [CV003, CV004, CV008, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Free, low-friction adoption", "Pump states that customers pay no platform fee, percentage of savings, contract, cancellation fee, or minimum commitment.", "Verify provider compensation, gross margin, and whether free access converts into durable paid-equivalent economics."]
      - ["Differentiated savings workflow", "Pump combines commitment purchasing, spend visibility, security monitoring, and claimed insurance.", "Test realized savings, recommendation precision, and unused-commitment losses by cohort."]
      - ["Commercial traction signal", "Pump reports over $600 million in annual cloud spend represented across thousands of customers in 22 countries.", "Reconcile managed spend to active customers, revenue, retention, and concentration."]
      - ["Customer proof is mixed", "G2 shows positive ratings but also complaints about inaccurate flags, exit controls, and unfulfilled credits.", "Obtain support records, offboarding tests, and verified incident/complaint resolution rates."]
      - ["Category is strategic, not automatically high-margin", "FinOps is defined as cross-functional technology-value management, not only cloud bill reduction.", "Show durable budget ownership, expansion, and contribution margin across the broader platform."]
    notes: "Rows combine company claims, independent category context, and customer-review evidence; they are not a market-size or transaction-comparable set."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risk]
    rows:
      - [Bull, "Provider-funded revenue scales with represented spend; savings remain credible; AI-cost and multi-cloud products expand adoption.", "Premium outcome may be justified only if verified revenue growth, gross margin, retention, and insurance reserves support it.", "Possible but unverified", "Provider dependence and insurance losses."]
      - [Base, "Product remains useful and free; adoption grows, but monetization, concentration, and financing terms remain opaque.", "No point estimate; require a price that compensates for disclosure and execution risk.", "Most supportable on current evidence", "Unknown revenue quality and customer concentration."]
      - [Bear, "Recommendation errors, difficult offboarding, or failed credit promises reduce trust; provider economics compress.", "Downside case is loss of premium multiple and possible down-round risk; protect with entry discipline.", "Material downside is evidenced as a risk, not a forecast", "Customer-control and margin failure."]
    notes: "Scenario logic is qualitative because the assigned pool lacks current valuation, revenue, cash-burn, retention, and comparable-transaction data; null or undisclosed inputs are not treated as zero."
    claimRefs: [CV008, CV009, CV011, CV012, CV013, CV015]
