  name: Pump
chapter:
  number: 5
  title: Product & Technology
  summary: Pump presents a billing-layer platform spanning automated cloud savings, spend visibility, security posture, and a planned incident-response product. The disclosed workflow is coherent and low-friction, but the evidence remains weighted toward company-issued descriptions, while recommendation precision, commitment insurance, offboarding controls, and current security coverage still require direct technical diligence.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Pump's current public surface is a four-part suite. Pump Save is positioned
      as automated commitment and pricing optimization; Pump View as spend
      breakdown and forecasting; Pump Secure as compliance-oriented scanning and
      remediation guidance; and Pump Intelligence as an incident-response layer
      that is still marked coming soon. The entry workflow is deliberately
      lightweight: connect AWS, GCP, or Azure with read-only billing access or a
      CSV, inspect an estimate, and then decide whether to activate savings.
      Company examples also describe provider and service breakdowns,
      cost-per-customer views, cluster and pipeline analysis, and continuous
      commitment adjustment. These examples clarify the intended user job, but
      they are demonstrations and marketing claims, not independently measured
      production outcomes.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE013]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and dependencies
    body: >-
      The supportable architecture is an operating model rather than a verified
      software diagram. Billing and usage data enter through cloud connections
      or uploaded files; Pump View normalizes and presents spend; Pump Save
      recommends or executes commitment actions; Pump Secure evaluates
      configurations; and Pump Intelligence is intended to join operational
      context later. A company release says View spans more than 20 integrations
      and that recommended commitments are insured. An external guide describes
      the initial AWS connection as read-only but says commitment execution needs
      additional limited permissions. Datadog and Slack also illustrate that
      observability and collaboration integrations have materially different
      technical roles, so a raw integration count does not establish equivalent
      depth. Public evidence does not disclose model design, training data,
      decision thresholds, rollback mechanics, integration test coverage, or
      service-level objectives, so those implementation details remain diligence
      items rather than established facts.
    claimRefs: [CE006, CE007, CE008, CE009, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: security-and-control
    title: Security, privacy, reliability, and customer control
    body: >-
      Pump says it operates at the billing layer and cannot access customer code,
      infrastructure, network traffic, or user data. It also describes flexible
      onboarding that need not place a customer inside Pump's AWS organization or
      expose the management account. Those boundaries are favorable if contract
      language and a least-privilege test confirm them. Product scope is less
      settled: the May 2026 company release describes monitoring across more than
      30 compliance frameworks but does not provide a cloud-by-cloud control
      matrix or independent effectiveness evidence. Framework count is not proof
      of control effectiveness. Buyers should obtain current permission
      manifests, control reports, penetration-test evidence, support terms, and a
      cloud-by-cloud coverage matrix.
    claimRefs: [CE003, CE008, CE009, CE011]
  - id: maturity-and-diligence
    title: Maturity signals and technical diligence verdict
    body: >-
      The strongest independent evidence is directional rather than conclusive.
      Skywork and PromptLoop describe a group-buying and automated commitment
      model, while Taloflow's comparison rubric highlights the control questions
      relevant to this category, including limited IAM roles, agentless
      operation, self-service installation, and cost-data APIs. The assigned
      Datadog and Slack pages clarify two very different integration dependency
      classes without independently verifying Pump's implementation of either.
      Historical G2 reviews support ease of setup, but one reviewer reported that Pump
      sometimes flagged needed resources as unnecessary, and another alleged
      difficulty leaving a billing organization. These are individual reports,
      not incident rates, yet they identify exactly what a controlled trial must
      test: recommendation precision, approval and rollback paths, exit mechanics,
      insurance enforceability, and the separation between read-only analysis and
      write-capable commitment management.
    claimRefs: [CE010, CE011, CE012, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Coherent low-friction product loop
    body: The disclosed flow joins billing ingestion, savings automation, visibility, and security without requiring application re-platforming.
    claimRefs: [CE001, CE002, CE003, CE013]
  - calloutType: risk
    title: Control-plane proof is incomplete
    body: Public evidence does not quantify false positives, rollback performance, offboarding reliability, insurance claims, or production service levels.
    claimRefs: [CE007, CE011, CE015, CE016]
  - calloutType: recommendation
    title: Validate before enabling automated actions
    body: Run a least-privilege pilot with shadow recommendations before granting commitment-management permissions, and test exit and rollback procedures contractually.
    claimRefs: [CE008, CE009, CE011, CE015, CE016]
