      - ["Normalization and allocation", "Unify provider, service, customer, cluster, and pipeline costs", "AWS, GCP, Azure, and third-party schemas", "Public evidence does not disclose mapping quality, latency, or reconciliation"]
      - ["Savings decisioning", "Identify pricing and commitment opportunities", "Usage history, forecasts, and provider discount instruments", "False positives can create unused commitments or operational review burden"]
      - ["Commitment execution and insurance", "Apply approved commitments and absorb disclosed downside", "Write-capable permissions, contracts, and Pump's financial capacity", "Exclusions, limits, claims process, and capital backing are not public"]
      - ["Security posture", "Map configurations to frameworks and recommended fixes", "Cloud configuration access and control definitions", "Framework coverage does not prove detection accuracy or remediation efficacy"]
      - ["Operations roadmap", "Combine incident context across integrated tools", "Telemetry integrations and production support", "Pump Intelligence remains marked coming soon"]
    notes: This is an evidence-bounded operating model, not a verified implementation diagram; technical internals and service levels remain private.
    claimRefs: [CE004, CE006, CE007, CE008, CE009, CE010, CE011, CE012, CE014]
