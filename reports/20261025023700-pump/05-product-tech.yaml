  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: recommendation-accuracy
      missingEvidence: Out-of-sample precision, false-positive, rollback, and realized-savings statistics for automated recommendations.
      whyItMatters: A historical review reports an incorrect critical-resource flag, while commitment actions can create direct financial exposure.
      diligencePath: Run shadow recommendations against representative historical bills and inspect approval logs, reversals, and realized outcomes.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: commitment-insurance
      missingEvidence: Insurance terms, exclusions, limits, claims history, and capital backing for recommended commitments.
      whyItMatters: The insurance promise is a central differentiator but is supported only by company-issued material.
      diligencePath: Obtain policy and contract language, loss history, and evidence of funding capacity under NDA.
      relatedQuestionRefs: [QE007, QE008]
    - type: private-evidence-only
      severity: material
      topic: customer-control
      missingEvidence: Current organization-membership, offboarding, permission-revocation, and data-deletion procedures.
      whyItMatters: Flexible onboarding claims coexist with a historical reviewer allegation about difficulty leaving a billing organization.
