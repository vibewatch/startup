        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Pump presents Save, View, and Secure as one platform spanning automated savings, spend visibility, and
              security. Company-issued material says the platform covers AWS, GCP, and Azure and more than 20
              integrations. Competing evidence points to different depth: Zesty emphasizes real-time Kubernetes
              rightsizing, while Taloflow's comparison taxonomy highlights APIs, infrastructure-as-code, forecasting,
              role-based access, and detailed cost allocation as buying criteria. Those capabilities are not
              interchangeable, and the assigned evidence does not support feature parity across vendors. Unsupported
              cells are therefore marked unknown rather than treated as losses or wins.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
