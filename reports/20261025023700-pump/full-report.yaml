  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand
        blocks:
          - type: paragraph
            body: >-
              The relevant market is cloud and adjacent technology financial-management software and services:
              visibility, allocation, forecasting, governance, workload optimization, and commitment purchasing for
              public-cloud, software-as-a-service, and AI spend. It excludes the underlying cloud infrastructure,
              generic accounting systems, and broad observability products unless they directly control technology
              spend. This boundary is supported by the FinOps Foundation's survey of organizations responsible for more
              than $69 billion in public-cloud spend, which says practices are expanding into SaaS, licensing, private
              cloud, and AI. Flexera reports that 84% of surveyed organizations view cloud-spend management as their top
              cloud challenge and that cloud budgets already exceed limits by 17%. That combination creates a real
              control problem, but it also means the market includes incumbent cloud-native tooling, managed-service
              providers, internal FinOps teams, and manual procurement as substitutes. Pump's stated free model and
              cross-cloud positioning are therefore a wedge into a budget-control workflow, not proof that every cloud
              dollar is monetizable software revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing lenses and adoption economics
        blocks:
          - type: paragraph
            body: >-
              A defensible sizing view needs multiple lenses. The broadest observable pool is the technology spend
              managed by FinOps teams: the 2025 State of FinOps survey covers approximately $69 billion of public-cloud
              spend, while 63% of respondents now manage AI spending and 65% manage SaaS spending. A second lens is the
              operational pain pool: Flexera reports 84% cloud-spend management difficulty, 60% use of managed service
              providers, and 59% expansion of FinOps teams. A third lens is the immediately serviceable segment: Pump
              describes customers across AWS, GCP, and Azure, while a third-party directory positions it toward
              early-stage companies and small businesses. These are not additive TAM, SAM, and SOM figures. They measure
              different populations, periods, and definitions. Pump's reported coverage of more than $600 million in
              annual customer cloud spend is evidence of traction within the pool, not a verified market share or
              revenue denominator. The missing bridge is customer count by spend band, take rate, retention, and the
              share of spend addressable by Pump's commitment and visibility products.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is usually the CFO, finance leader, or FinOps owner accountable for cloud
              efficiency; engineering and platform teams are the users because they control workload architecture,
              labels, and commitment decisions. A startup can begin with read-only visibility, move to savings
              recommendations, and then authorize automated commitments, while a regulated or enterprise buyer may
              require IAM, security, compliance, and customer-control review first. This adoption path matters because
              the core substitute is not only another vendor: AWS, GCP, and Azure expose native billing reports,
              budgets, calculators, commitment discounts, and optimization recommendations. FinOps survey respondents
              also report time, skills, resource capacity, and vendor adoption hurdles. Commitment under-utilization,
              workload volatility, limited allocation data, and trust in permissions can delay conversion. Pump's
              insurance and no-fee positioning may reduce financial and budget friction, but the public evidence does
              not establish the economics of insurance, the durable provider incentive, or realized savings across
              customer cohorts. Those unknowns constrain valuation relevance even when the demand signal is strong.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits preserve the distinctions between market scale, buyer workflow, and company-reported reach.
              Values are shown with their source populations and limitations rather than combined into a synthetic
              market share. The sizing table places the FinOps survey, Flexera's challenge indicators, and Pump's own
              managed-spend statement side by side because they answer different questions. The buyer map separates
              budget owners from technical users and payers, which prevents a cloud invoice from being mistaken for
              software revenue. The pyramid is intentionally not a proportional market-share graphic: it preserves
              units, denominators, periods, and source posture for each lens. This is important in a market where
              public-cloud spend, AI spend, SaaS spend, and optimization software budgets overlap. The open sizing gap
              is therefore a request for cohort and unit-economics evidence, not an invitation to interpolate an
              unsupported SAM or SOM.
            claimRefs:
              - CM005
              - CM008
              - CM010
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is broadening beyond infrastructure
            body: >-
              FinOps survey evidence points to AI, SaaS, licensing, and private-cloud scope expansion, increasing the
              potential workflow surface while also increasing data and governance complexity.
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
          - type: callout
            title: Market size is not the same as monetizable revenue
            body: >-
              Public evidence measures managed spend, respondent shares, and company-reported coverage, but does not
              establish Pump's take rate, retention, margin, or serviceable market share.
            calloutType: risk
            claimRefs:
