  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Pump's current public surface is a four-part suite. Pump Save is positioned as automated commitment and
              pricing optimization; Pump View as spend breakdown and forecasting; Pump Secure as compliance-oriented
              scanning and remediation guidance; and Pump Intelligence as an incident-response layer that is still
              marked coming soon. The entry workflow is deliberately lightweight: connect AWS, GCP, or Azure with
              read-only billing access or a CSV, inspect an estimate, and then decide whether to activate savings.
              Company examples also describe provider and service breakdowns, cost-per-customer views, cluster and
              pipeline analysis, and continuous commitment adjustment. These examples clarify the intended user job, but
              they are demonstrations and marketing claims, not independently measured production outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE010
          - type: table
            tableRef: TE002
