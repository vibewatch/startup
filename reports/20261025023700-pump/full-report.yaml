    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Pump Billing, Inc. is an active California stock corporation filed on May 3, 2023, with San Francisco
              addresses and a software-as-a-service business classification. Pump's own website positions the company as
              a free cloud platform spanning savings, visibility, security, and incident-response capabilities, while
              its June 2026 release says the platform covers AWS, GCP, and Azure. The company says cloud providers
              compensate it for helping customers remain optimized, so the customer-facing product has no platform fee,
              savings percentage, contract, cancellation fee, or minimum commitment. This is a differentiated
              distribution and monetization proposition, but the public sources do not disclose provider economics,
              gross margin, or contract-level durability.
