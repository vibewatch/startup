              - CP010
              - CP014
      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Pump says customers pay no platform fee, percentage of savings, contract, cancellation fee, or minimum
              commitment because cloud providers compensate the company. That structure can make adoption easier than
              purchasing another software license, but it also makes provider compensation a strategic dependency.
              Pump's insurance promise transfers some commitment risk, although the reviewed description says coverage
              is measured against cumulative lifetime savings. Read-only onboarding and a free entry point may keep
              initial switching costs low; durability must instead come from measurable savings, provider relationships,
              accumulated workflow data, and integration into finance and engineering processes.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Displacement risk and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Native automation is the clearest adverse competitive path because cloud providers already own billing
              data and distribution. BriefGlance reports that AWS introduced an AI-powered FinOps Agent, while Zesty
              demonstrates that specialists can compete through workload-level automation rather than billing
              aggregation. Pump's multi-cloud and AI-spend scope may remain differentiated, but the evidence does not
              quantify retention, insurance losses, net savings after all costs, forecast accuracy, or enterprise win
              rates. A matched-account bakeoff is needed before treating the free model, insurance, or platform breadth
              as a durable moat rather than a strong acquisition wedge.
            claimRefs:
              - CP007
              - CP009
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Low-friction acquisition wedge
            body: >-
              Pump's free packaging and commitment-insurance promise directly address buyer resistance to another
              software fee and fear of unused commitments.
            calloutType: strength
            claimRefs:
              - CP010
              - CP012
              - CP013
          - type: callout
            title: Native response risk
            body: >-
              Cloud providers own billing data and distribution, and reported native AI automation could narrow Pump's
              feature differentiation.
            calloutType: risk
            claimRefs:
              - CP001
              - CP014
          - type: callout
            title: Underwrite through a matched-account bakeoff
            body: >-
              Compare net savings, unused commitments, forecast error, implementation effort, support burden, and
              offboarding using identical accounts and time periods.
            calloutType: recommendation
            claimRefs:
              - CP009
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Pump’s public pricing proposition is no customer platform fee: its website says the product is free, with
              no contracts, cancellation fees, or minimum commitments, while cloud providers compensate Pump for helping
              customers stay optimized. This is a two-sided monetization model, not evidence of recurring software
              revenue from the customer. The company site describes Pump Save, Pump View, and Pump Secure as the product
              surface, while PromptLoop describes group buying and automation as the operating mechanism. The economic
              diligence question is whether provider reimbursement, commitment economics, and any savings or partner
              payments produce durable gross profit after insurance, support, and infrastructure costs.
            claimRefs:
