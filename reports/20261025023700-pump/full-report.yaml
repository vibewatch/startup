      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not establish current cash on hand, monthly burn, runway, debt, credit
              facilities, insurance reserves, or the timing and use of a next financing. GetLatka reports a $4 million
              seed round and a $1.5 billion March 2023 valuation, but that historical third-party profile is not a
              current capitalization table and does not reveal preference terms or cash remaining. California
              registry-derived information confirms Pump Billing, Inc. is active and organized as a
              software-as-a-service corporation, but it is not a financial statement. The model also has execution and
              control risk: one verified G2 review alleges difficulty leaving the billing organization, while another
              says Pump can flag needed resources as unnecessary. Those reports require company response and
              customer-control diligence before treating the free model as low risk.
