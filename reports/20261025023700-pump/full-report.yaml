      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              The supportable architecture is an operating model rather than a verified software diagram. Billing and
              usage data enter through cloud connections or uploaded files; Pump View normalizes and presents spend;
              Pump Save recommends or executes commitment actions; Pump Secure evaluates configurations; and Pump
              Intelligence is intended to join operational context later. A company release says View spans more than 20
              integrations and that recommended commitments are insured. An external guide describes the initial AWS
              connection as read-only but says commitment execution needs additional limited permissions. Datadog and
              Slack also illustrate that observability and collaboration integrations have materially different
              technical roles, so a raw integration count does not establish equivalent depth. Public evidence does not
              disclose model design, training data, decision thresholds, rollback mechanics, integration test coverage,
              or service-level objectives, so those implementation details remain diligence items rather than
              established facts.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
