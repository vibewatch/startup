  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Pump's competitive set extends beyond named FinOps vendors. Buyers can use cloud-provider guidance and
              native billing tools, select a specialist such as Zesty or Usage AI, adopt a broader platform, hire
              consultants, or keep cost management inside engineering and finance. AWS describes cost optimization as an
              organizational capability spanning workload design, delivery, and maintenance, while the FinOps Foundation
              says practices are extending into SaaS, licensing, and AI spend. This breadth means the relevant
              substitute is often an operating model rather than one product, and it gives cloud providers and internal
              teams structural distribution advantages.
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
