      - number: '4.2'
        title: Traction, pricing, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public traction is substantial in managed-spend terms but uneven in financial quality. Pump’s website
              reports more than $1.057 billion of cloud spend managed and an average cloud-savings figure of 30%, while
              a June 2026 company announcement reports more than $600 million of annual cloud spend across thousands of
              customers and approximately 19% average monthly savings. These figures use different dates, denominators,
              and descriptions, so they should not be combined into a single growth rate. GetLatka displays $15.2
              million of April 2025 revenue as a company submission. No public source in this pool establishes CAC,
              payback, gross margin, net retention, churn, or customer concentration, and neither managed spend nor
              customer savings is a substitute for recognized revenue.
            claimRefs:
