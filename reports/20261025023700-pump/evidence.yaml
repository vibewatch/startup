evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      A primary financing announcement, cap table, or filing that verifies the reported $4M seed amount, $1.5B
      valuation, instrument, and investor ownership.
    whyItMatters: >-
      The reported valuation is central to underwriting but currently rests on a compiled profile and lacks terms,
      dilution, and preference information.
    diligencePath: >-
      Request executed financing documents, investor schedule, capitalization table, and the company-to-investor
      reconciliation of the March 2023 round.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: >-
      Primary formation and operating records that reconcile the reported 2022 founding year with the April 2023
      anniversary implied by the company release.
    whyItMatters: >-
      Company age affects milestone sequencing and operating-history assessment, and the assigned public sources do not
      use a consistent starting point.
    diligencePath: >-
      Request the certificate of incorporation, founder chronology, first customer and product-launch records, and an
      explanation of which event Pump treats as founding.
    relatedQuestionRefs:
      - QO001
      - QO006
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: >-
      Current management accounts or audited financial statements reconciling revenue, provider compensation, take rate,
      gross margin, and cash collections.
    whyItMatters: >-
      A company-submitted historical revenue datapoint cannot establish recurring revenue quality or the economics of a
      free-to-customer model.
    diligencePath: >-
      Obtain monthly revenue bridges, contracts, provider invoices, deferred revenue schedules, and gross-margin
      calculations through the current period.
    relatedQuestionRefs:
      - QO004
      - QO008
      - QO009
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board, officer, ownership, and key-person continuity schedule.
    whyItMatters: >-
      Public evidence shows multiple formal roles concentrated around the founder but does not establish oversight,
      succession, or control rights.
    diligencePath: >-
      Request the current board roster, committee structure, cap table, delegation matrix, and succession or key-person
      insurance documentation.
    relatedQuestionRefs:
      - QO003
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: leadership table TO002
    missingEvidence: A complete public officer, executive, and board roster for Pump.
    whyItMatters: >-
      The current leadership table is limited to names surfaced by the assigned sources and does not establish full
      governance coverage.
    diligencePath: Request the current officer list, board roster, committee assignments, and governance documents from the company.
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A current employee count and location split as of the 2026-10-25 report date.
    whyItMatters: The available 76-person figure is from November 2025 and may not describe current execution capacity.
    diligencePath: Request a current employee census, contractor count, hiring plan, and department-level staffing bridge.
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map TO003
    missingEvidence: A complete cap table, provider-partner schedule, and active-customer concentration schedule.
    whyItMatters: >-
      The stakeholder map identifies economically important groups but cannot establish ownership, control, or
      concentration from public evidence.
    diligencePath: Request the cap table, provider contracts, investor rights schedule, and customer concentration report.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      A customer schedule showing active accounts, gross/net retention, concentration, managed spend, and realized
      savings.
    whyItMatters: >-
      Thousands of customers and $600M+ represented spend are broad company-reported scale indicators without retention
      or concentration context.
    diligencePath: >-
      Request a cohort schedule, top-customer concentration report, churn/offboarding data, and savings methodology with
      denominator definitions.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Customer count by cloud-spend band, contract type, take rate, retention, and share of managed spend addressable by
      each Pump product.
    whyItMatters: >-
      Reported managed spend cannot be converted into revenue opportunity, market share, or valuation relevance without
      denominators and unit economics.
    diligencePath: >-
      Request cohort-level ARR, take rate, gross margin, retention, managed-spend distribution, and customer
      concentration under NDA.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: savings-claims
    missingEvidence: >-
      A reconciled cohort analysis of realized savings by provider, workload type, commitment tenure, and customer
      segment.
    whyItMatters: >-
      Public sources report different average-savings and coverage figures, while commitment savings depend on workload
      fit and utilization.
    diligencePath: Obtain anonymized pre/post billing cohorts and definitions for gross savings, net savings, and insurance cost.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: minor
    topic: buyer-map
    missingEvidence: Observed conversion rates and approval-stage timing from read-only assessment to automated commitment purchasing.
    whyItMatters: The adoption path is analytically plausible but its commercial friction and sales efficiency are not public.
    diligencePath: >-
      Review funnel metrics by customer segment, implementation path, permissions level, and time to first realized
      saving.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: competitive-benchmark
    missingEvidence: >-
      A matched-account benchmark comparing Pump, native tools, and at least two FinOps alternatives on net savings,
      forecast accuracy, implementation time, and support burden.
    whyItMatters: Issuer claims and comparison criteria do not establish durable performance or total cost of ownership.
    diligencePath: >-
      Run a controlled bakeoff using identical cloud accounts, workload periods, commitment assumptions, and success
      metrics.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP008
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Customer retention, multi-homing, offboarding, and time-to-replace evidence by segment.
    whyItMatters: A free entry model can accelerate adoption without proving durable customer dependence.
    diligencePath: Request cohort retention, churn reasons, concurrent-tool usage, offboarding logs, and reference calls.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: >-
      Provider compensation terms, insurance claims history, realized customer pricing, and net savings after unused
      commitments.
    whyItMatters: List packaging is not realized economics, and insurance obligations may affect durability.
    diligencePath: >-
      Review provider agreements, customer contracts, claims history, and account-level savings reconciliations under
      NDA.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP008
  - type: missing-source
    severity: minor
    topic: native-response
    missingEvidence: Current product and adoption evidence for AWS FinOps Agent and comparable native features from GCP and Azure.
    whyItMatters: Native tooling can erode a multi-cloud optimizer's feature wedge and distribution advantage.
    diligencePath: Track provider releases and run quarterly overlap analysis against Pump's shipped capabilities.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited or management-prepared revenue bridge, provider reimbursement rates, take rate, gross margin, insurance
      losses, and support costs.
    whyItMatters: The free customer proposition can look attractive while still producing weak or volatile contribution economics.
    diligencePath: >-
      Request monthly cohort economics, provider contracts, revenue recognition policy, reserves, claims history, and a
      product-level gross-margin bridge.
    relatedQuestionRefs:
      - QI001
      - QI005
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, burn, runway, debt, credit facilities, financing terms, preference stack, and insurance liquidity.
    whyItMatters: Pump may need capital to fund growth and absorb commitment shortfalls even if customer pricing is free.
    diligencePath: >-
      Obtain the latest balance sheet, 13-week cash forecast, cap table, debt schedule, financing documents, and reserve
      policy.
    relatedQuestionRefs:
      - QI007
      - QI009
  - type: conflicting-data
    severity: material
    topic: managed-spend
    missingEvidence: >-
      A reconciled definition and date for the $1.057 billion website figure versus the $600 million annual-spend
      announcement.
    whyItMatters: >-
      Different denominators may represent cumulative, annual, or cohort-specific managed spend and should not be
      treated as growth.
    diligencePath: >-
      Request source-system exports showing active customers, annualized spend, historical period, and gross versus net
      measurement.
    relatedQuestionRefs:
      - QI003
  - type: missing-source
    severity: material
    topic: customer-control
    missingEvidence: Company response and contract language addressing billing-organization exit controls and the G2 credit allegation.
    whyItMatters: >-
      Customer-control friction could increase switching costs and create reputational, operational, or contractual
      exposure.
    diligencePath: >-
      Interview affected and current customers, review AWS organization controls, and inspect cancellation, migration,
      and credit terms.
    relatedQuestionRefs:
      - QI008
