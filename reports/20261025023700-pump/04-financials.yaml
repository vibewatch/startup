schemaVersion: "report-v2"
artifact: financials
slug: pump
runDate: 2026-10-25
company:
  name: Pump
chapter:
  number: 4
  title: Financials
  summary: Pump presents a free cloud-cost optimization model funded by cloud-provider economics rather than customer subscription fees. Public evidence supports meaningful managed-spend traction and reported savings, but does not disclose enough realized revenue, margin, cash, burn, retention, or take-rate data for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Pump’s public pricing proposition is no customer platform fee: its website says the
      product is free, with no contracts, cancellation fees, or minimum commitments, while
      cloud providers compensate Pump for helping customers stay optimized. This is a
      two-sided monetization model, not evidence of recurring software revenue from the
      customer. The company site describes Pump Save, Pump View, and Pump Secure as the
      product surface, while PromptLoop describes group buying and automation as the
      operating mechanism. The economic diligence question is whether provider
      reimbursement, commitment economics, and any savings or partner payments produce
      durable gross profit after insurance, support, and infrastructure costs.
    claimRefs: [CI001, CI002, CI003, CI004, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Traction, pricing, and unit economics
    body: >-
      Public traction is substantial in managed-spend terms but uneven in financial quality.
      Pump’s website reports more than $1.057 billion of cloud spend managed and an average
      cloud-savings figure of 30%, while a June 2026 company announcement reports more than
      $600 million of annual cloud spend across thousands of customers and approximately
      19% average monthly savings. These figures use different dates, denominators, and
      descriptions, so they should not be combined into a single growth rate. GetLatka
      displays $15.2 million of April 2025 revenue as a company submission. No public source
      in this pool establishes CAC, payback, gross margin, net retention, churn, or customer
      concentration, and neither managed spend nor customer savings is a substitute for
      recognized revenue.
    claimRefs: [CI005, CI006, CI007, CI008, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-blockers
    title: Capital adequacy and underwriting blockers
    body: >-
      The available evidence does not establish current cash on hand, monthly burn, runway,
      debt, credit facilities, insurance reserves, or the timing and use of a next financing.
      GetLatka reports a $4 million seed round and a $1.5 billion March 2023 valuation, but
      that historical third-party profile is not a current capitalization table and does not
      reveal preference terms or cash remaining. California registry-derived information
      confirms Pump Billing, Inc. is active and organized as a software-as-a-service
      corporation, but it is not a financial statement. The model also has execution and
      control risk: one verified G2 review alleges difficulty leaving the billing organization,
      while another says Pump can flag needed resources as unnecessary. Those reports require
      company response and customer-control diligence before treating the free model as low
      risk.
    claimRefs: [CI010, CI011, CI012, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit or basis, Current public value/status, Quality and diligence ask]
    rows:
      - [Cloud-provider reimbursement, "Cloud providers compensate Pump for helping customers stay optimized", "Provider payment; terms undisclosed", "Reported mechanism; no rate disclosed", "Company-issued claim; obtain contracts, payment formula, renewal terms, and concentration"]
      - [Pump Save, "Automated cloud commitment purchasing with insured recommendations", "Savings-plan or reserved-commitment activity", "Product described publicly; realized revenue not disclosed", "Separate customer savings from Pump gross profit and quantify insurance losses"]
      - [Pump View, "Unified cloud and AI spend visibility", "Cloud and AI spend monitored", "Product described publicly; standalone monetization unknown", "Confirm whether reimbursement is attributable to usage, provider, or customer cohort"]
      - [Pump Secure, "Compliance monitoring and remediation guidance", "Framework monitoring", "Product described publicly; standalone monetization unknown", "Test attach rate, support cost, and whether security claims create liability"]
      - [AI cost optimization, "Token-level visibility and savings across AI providers", "AI inference and token spend", "Expansion described in 2026 announcement", "Obtain AI take-rate, provider economics, and realized savings by cohort"]
    notes: "Public descriptions mix product functions with the company’s reported business model; no row is a recognized-revenue schedule."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization
    columns: [Offer, List price or contract, Realized pricing, Evidence status, Diligence ask]
    rows:
      - [Pump platform, "Free; no platform fees, percentage of savings, contracts, cancellation fees, or minimum commitments", null, "Company-reported list proposition", "Reconcile customer terms with provider reimbursement and any exceptions"]
      - [Pump Save, "Included in free platform according to public materials", null, "Company-reported; insurance economics undisclosed", "Obtain commitment-level fee flows, loss sharing, and reserve policy"]
      - [Pump View, "Included in free platform according to public materials", null, "Company-reported", "Measure usage, provider reimbursement, and support cost per account"]
      - [Pump Secure, "Included in free platform according to public materials", null, "Company-reported", "Confirm paid tiers, compliance scope, and remediation liability"]
      - [AI cost tools, "No public customer price identified", null, "Current product expansion; realized pricing unknown", "Request AI-provider contracts and unit economics by token volume"]
    notes: "Free list pricing is not realized revenue, gross margin, or evidence that provider payments persist across all products."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit-economics evidence and gaps
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Managed cloud spend, "$1.057B+ on company website", "Medium; company claim", "Scale can support bargaining power and provider economics", "Reconcile date, active cohort, and gross versus net managed spend"]
      - [Managed annual cloud spend, "$600M+ across thousands of customers in 22 countries", "Medium; company announcement", "Provides a different traction denominator than the website", "Reconcile this figure with the website total and define active customers"]
      - [Average savings, "30% on company website; approximately 19% in June 2026 announcement", "Medium; company claims", "Savings drive adoption and may affect provider economics", "Validate realized savings against customer bills and methodology"]
      - [Revenue, "$15.2M in April 2025", "Low-to-medium; company submission reported by GetLatka", "Only public revenue datapoint in this pool", "Obtain financial statements, revenue recognition policy, and current run rate"]
      - [Gross margin, null, "Unavailable", "Insurance, support, and provider payments may materially shape contribution margin", "Request gross margin bridge and insurance-loss history"]
      - [CAC and payback, null, "Unavailable", "Free acquisition can still be expensive to support and onboard", "Request cohort CAC, sales cycle, onboarding labor, and payback"]
      - [Retention and concentration, null, "Unavailable", "Provider reimbursement and managed spend may be concentrated", "Request GRR, NRR, churn, top-customer share, and managed-spend concentration"]
      - ["Cash, burn, runway, and debt", null, "Unavailable", "Determines financing dependency and ability to absorb commitment losses", "Request latest balance sheet, burn, runway, debt, and reserve schedule"]
    notes: "Null values are evidence gaps, not zero values; reported and estimated figures retain their source and denominator distinctions."
    claimRefs: [CI005, CI006, CI007, CI008, CI010, CI011, CI013, CI014, CI015, CI016]
figures:
