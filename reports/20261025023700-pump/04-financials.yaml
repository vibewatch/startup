          detail: Pump identifies savings opportunities and commitment actions
        - id: commitments
          label: Commitment purchasing
          detail: Pump Save is described as automating insured commitment purchases
        - id: provider-economics
          label: Provider compensation
          detail: Public materials say cloud providers compensate Pump for optimization
        - id: pump-revenue
          label: Pump revenue and gross profit
          detail: Amount, take-rate, reserves, and margin are not publicly disclosed
    claimRefs: [CI001, CI002, CI009]
callouts:
  - calloutType: risk
    title: Underwriting gap
    body: Revenue, gross margin, cash runway, insurance exposure, retention, and customer concentration remain unverified; the financial case should be treated as research-more rather than fully underwritten.
    claimRefs: [CI008, CI010, CI011, CI012]
  - calloutType: insight
    title: Monetization sensitivity
    body: The absence of customer fees lowers adoption friction, but it shifts diligence toward provider reimbursement rates, commitment-loss reserves, and the durability of cloud-provider incentives.
    claimRefs: [CI001, CI002, CI004]
