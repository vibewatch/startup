    title: Market definition and substitutes
    columns: [Segment/category, Included spend or workflow, Excluded or substitute, Buyer/payer relevance]
    rows:
      - [Cloud FinOps software, "Visibility, allocation, forecasting, governance, and optimization of public-cloud spend", "Underlying AWS, GCP, or Azure infrastructure charges", "Finance/FinOps budget owner; engineering user"]
      - [AI spend management, "Tracking, allocation, forecasting, and optimization of model and AI infrastructure spend", "AI model revenue or generic application software", "CFO, product, and platform teams"]
      - [Cloud commitment optimization, "Reserved-instance, savings-plan, and committed-use-discount recommendations or purchasing", "Unmanaged on-demand usage and provider capacity itself", "Finance approves; platform team validates workload fit"]
      - [Adjacent technology financial management, "SaaS, licensing, private-cloud, and data-center spend where FinOps capabilities extend", "General ledger and non-technology corporate expenses", "IT finance and procurement"]
    notes: "Boundary is analytical; categories overlap in buyer workflow and are not additive market totals."
    claimRefs: [CM001, CM003, CM010, CM011]
  - id: TM002
    title: Sizing lenses and evidence limits
    columns: [Publisher, Year, Geography or population, Value, CAGR, Methodology, Confidence, Limitation]
    rows:
      - ["FinOps Foundation", "2025", "861 respondents representing public-cloud spend", "$69bn represented", null, "Annual community survey", "medium", "Large-spender sample; not total market revenue"]
      - ["FinOps Foundation", "2025", "Survey respondents", "63% manage AI spend", null, "Survey response share", "medium", "Adoption metric, not spend or software budget"]
      - ["FinOps Foundation", "2025", "Survey respondents", "65% manage SaaS spend", null, "Survey response share", "medium", "Scope indicator, not addressable revenue"]
      - ["Flexera", "2025", "750+ technical and executive respondents worldwide", "84% cite cloud-spend management as top challenge", null, "State of the Cloud survey", "medium", "Perception survey; does not isolate Pump's segment"]
      - ["Pump.co / PRNewswire", "2026", "Customers in 22 countries", ">$600m annual cloud spend represented", null, "Company-reported customer coverage", "low", "Company claim; no customer-count or market-share denominator"]
    notes: "Values use each publisher's own denominator and period; no TAM/SAM/SOM total is calculated because the populations are not comparable."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Buyer and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Early-stage startup, Founder/CFO, Platform engineer, Company operating budget, "Read-only visibility to savings recommendation", Founder or finance, "Unexpected cloud bill or limited engineering capacity"]
      - [Growth-stage software company, CFO/FinOps lead, Platform and data teams, Cloud operating budget, "Forecast, allocate, and optimize multi-account spend", Finance and engineering jointly, "Budget variance or expanding AI workload"]
      - [Enterprise or regulated team, IT finance/procurement, Cloud center of excellence, Departmental technology budget, "Security, IAM, compliance, and commitment review before automation", Procurement and risk, "Need for governance across cloud and SaaS"]
      - [Multi-cloud or AI-heavy team, CFO plus platform lead, FinOps and product teams, Shared infrastructure budget, "Unify provider and AI usage, then route or commit spend", Finance/product, "Fragmented provider invoices and token-cost uncertainty"]
    notes: "Roles are an evidence-constrained operating model inferred from the cited workflow and FinOps sources; customer-specific buying committees remain unverified."
    claimRefs: [CM010, CM011, CM012, CM013]
