    claimRefs: [CM005, CM006, CM007, CM008, CM009]
callouts:
  - calloutType: insight
    title: Demand is broadening beyond infrastructure
    body: "FinOps survey evidence points to AI, SaaS, licensing, and private-cloud scope expansion, increasing the potential workflow surface while also increasing data and governance complexity."
    claimRefs: [CM003, CM006, CM007]
  - calloutType: risk
    title: Market size is not the same as monetizable revenue
    body: "Public evidence measures managed spend, respondent shares, and company-reported coverage, but does not establish Pump's take rate, retention, margin, or serviceable market share."
    claimRefs: [CM008, CM009, CM013]
