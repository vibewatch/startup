    title: Customer journey from low-friction entry to expansion
    type: journey-map
    summary: Pump's public evidence supports an acquisition-to-value path, while the renewal and expansion steps remain diligence gaps.
    data:
      nodes:
        - label: Discover
          detail: "Startup or technical team seeks cloud savings without adding a paid FinOps tool."
          touchpoints: ["YC and startup channels", "Savings-led messaging"]
        - label: Connect
          detail: "Customer grants read-only billing access or selects an onboarding path."
          touchpoints: ["Low implementation effort", "Customer-control review"]
        - label: Estimate
          detail: "Pump presents savings opportunities and normalizes cloud-spend visibility."
          touchpoints: ["Savings estimate", "Pump View"]
        - label: Automate
          detail: "Customer may authorize commitment optimization and operational investigation."
          touchpoints: ["Pump Save", "Solutions-architect support"]
        - label: Validate
          detail: "Teams review realized savings, recommendations, and operational findings."
          touchpoints: ["Resource-level checks", "Customer outcome evidence"]
        - label: Expand
          detail: "Potential move into multi-cloud visibility, security, or AI-cost workflows."
          touchpoints: ["Pump Secure", "AI-cost visibility", "Renewal and cross-sell data not disclosed"]
    claimRefs: [CU004, CU007, CU011, CU012, CU013]
