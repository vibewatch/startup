    columns: [Customer / evidence unit, Segment, Deployment or use case, Production vs pilot, Reported outcome, Limitation]
    rows:
      - [Butlr Technologies, "Cloud-intensive company", "Pump cloud savings platform", "Not stated", "Company release reports monthly AWS-bill reduction of more than $100,000", "No baseline, period, or independent verification"]
      - [ForUsAll, "Technical company using AWS", "Solutions-architect investigation of Backup, OpenSearch, RDS, and staging workflow", "Operational account investigation described", "Orphaned snapshots and an unused Aurora cluster were identified; architecture changes were recommended", "Pump-hosted case study; savings amount and renewal not disclosed"]
      - [Anonymous G2 small-business reviewer, "Small business, 50 or fewer employees", "AWS cost tracking and recommendations", "User review; production use implied", "Review praised actionable savings and ease of use", "Anonymous reviewer; review sampling and duration are unknown"]
    enumerationScope:
      coverage: partial
      basis: "Publicly named or attributable customer proof retained from Pump case-study, company-release, and archived third-party review sources available for this 2026-10-25 refresh."
    notes: "This is a partial public-proof sample, not an exhaustive customer list; production status is recorded only where the source supports it, and reported outcomes remain unverified unless independently corroborated."
    claimRefs: [CU003, CU010, CU011, CU012]
figures:
