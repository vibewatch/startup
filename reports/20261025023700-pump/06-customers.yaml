  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: "Customer-level cohort data showing logo retention, gross and net revenue retention, renewal dates, churn reasons, and expansion by segment."
      whyItMatters: "Customer acquisition and savings claims cannot establish durable recurring economics or distinguish active production users from low-engagement accounts."
      diligencePath: "Request a cohort export for the last eight quarters with customer start date, managed spend, realized savings, renewal status, churn reason, and expansion-product adoption."
      relatedQuestionRefs: [QU005, QU009]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-10 and top-25 customer shares by revenue, managed cloud spend, and gross profit, plus the distribution of account sizes."
      whyItMatters: "Aggregate spend and customer counts may conceal dependence on a small number of large cloud accounts."
      diligencePath: "Reconcile the customer master to billing and revenue ledgers and provide concentration percentages for the current and prior four quarters."
      relatedQuestionRefs: [QU009]
    - type: missing-source
      severity: minor
      topic: customer-outcomes
      missingEvidence: "Independent verification of named customer savings, baseline spend, measurement period, and realized versus modeled savings."
      whyItMatters: "Company case studies establish use cases but do not show whether reported outcomes are representative or repeatable."
      diligencePath: "Obtain permission to contact a stratified sample of customers and reconcile Pump estimates to cloud-provider bills."
      relatedQuestionRefs: [QU002, QU004]
      relatedTableRefs: [TU003]
