      - ["AWS/GCP/Azure native approaches", "Incumbent and substitute", "Global cloud-provider scale; funding not applicable", "Provider-specific billing, architecture, governance, and commitments", "Direct data and distribution; weaker cross-provider neutrality"]
      - ["Zesty", "Direct specialist", "Scale and funding unknown in assigned evidence", "Kubernetes compute, GPU, and commitment optimization", "Real-time workload automation; broader FinOps coverage unknown"]
      - ["Usage AI", "Direct specialist", "Scale and funding unknown in assigned evidence", "Cloud-cost management and optimization", "Taloflow comparison exists; matched outcomes and scope are not established"]
      - ["nOps, DoiT, Qovery, Control Plane", "Named peers and adjacencies", "Scale and funding unknown in assigned evidence", "Cloud analytics, deployment, and resource optimization", "PromptLoop names these alternatives but does not provide a comparable benchmark"]
      - ["Internal FinOps team", "Status quo and internal build", "Organization-specific", "Allocation, forecasting, governance, and optimization", "Retains institutional context but consumes engineering and finance capacity"]
      - ["Consultants and managed services", "Service substitute", "Provider-specific", "Architecture review, investigation, and ongoing cost operations", "Supplies human expertise but can be episodic and labor intensive"]
    notes: >-
      Partial public-evidence profile as of 2026-10-25. Unknown means the assigned
      source pool did not establish a comparable value; company and competitor
      surfaces are issuer evidence rather than independent benchmarks.
    claimRefs: [CP001, CP002, CP004, CP005, CP006, CP007]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Pump, Native or internal alternative, Specialist or suite evidence, Limitation]
    rows:
      - ["Multi-cloud visibility", "AWS, GCP, Azure and 20+ integrations claimed", "Provider-native tools are usually provider-centered", "Varies by vendor", "No independent parity test in assigned evidence"]
      - ["Commitment optimization", "Automated purchasing and insurance claimed", "Buyer can manage commitments directly", "Zesty claims automated AWS and Azure commitment alignment", "No matched savings or loss-rate benchmark"]
      - ["AI-spend visibility", "OpenAI and Anthropic integrations claimed", "Provider coverage varies", "63% of FinOps survey respondents managed AI spend", "Market adoption does not prove Pump product depth"]
      - ["Kubernetes optimization", "Unknown in assigned Pump evidence", "Internal teams can tune workloads", "Zesty claims real-time CPU and memory rightsizing", "No like-for-like performance test"]
      - ["Forecasting and allocation", "Pump View claims forecasting and cost visibility", "Internal FinOps can build organization-specific processes", "Taloflow identifies forecasting, API, and allocation criteria", "Comparable accuracy and workflow depth unknown"]
      - ["Security and governance", "Pump Secure and 30+ frameworks claimed", "AWS documents cost optimization within broader architecture governance", "Vendor controls vary", "No independent control audit was reviewed"]
    notes: >-
      Cells preserve issuer attribution and explicitly mark unsupported comparisons.
      Taloflow is competitor comparison content, not an independent product benchmark.
    claimRefs: [CP001, CP003, CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Public economic model, Included scope, Buyer implication, Evidence limit]
    rows:
      - ["Pump", "No customer platform fee, savings percentage, contract, cancellation fee, or minimum commitment claimed", "Save, View, and Secure", "Low adoption friction and reduced commitment downside", "Realized provider economics and insurance losses are private"]
      - ["Native cloud or internal process", "No comparable incremental software price established in this pool", "Provider tools plus staff workflow", "Avoids a new vendor but retains commitment and labor burden", "Total internal cost is unquantified"]
      - ["Cloud-cost specialists and suites", "Taloflow notes that many vendors charge a percentage of cloud spend", "Capabilities vary across visibility, workflow, and optimization", "Fees may buy depth, controls, or support", "No normalized vendor price sheet was retained"]
      - ["Consultants and managed services", "Labor or project economics; amount unknown", "Human investigation and architecture support", "Flexible expertise but potentially recurring service dependence", "No comparable rate card was retained"]
    notes: >-
      Public packaging is not realized pricing, revenue, gross margin, or total cost
      of ownership. The assigned sources do not support an apples-to-apples price
      comparison across alternatives.
    claimRefs: [CP004, CP006, CP010, CP011, CP012, CP013]

figures:
  - id: FP001
    title: Competitive positioning by adoption friction and evidenced breadth
    type: quadrant
    summary: Pump appears easier to adopt than labor-heavy alternatives, while native and established approaches retain distribution or independently documented operating breadth.
    data:
      xAxis: "Buyer adoption friction (1 = lower, 5 = higher)"
      yAxis: "Evidenced workflow breadth (1 = narrower, 5 = broader)"
      points:
        - label: Pump
          x: 1
          y: 3
          note: "Free, read-only onboarding and multi-cloud bundle; comparative depth remains partly unverified."
        - label: Native cloud approaches
          x: 2
          y: 4
          note: "Strong billing-data access and distribution; cross-cloud neutrality is limited."
        - label: Broader FinOps suites
          x: 4
          y: 4
          note: "Buying criteria span APIs, forecasting, allocation, access control, and workflow."
        - label: Internal FinOps
          x: 4
          y: 4
          note: "Broad organization-specific control, with meaningful staffing and coordination cost."
        - label: Consultants
          x: 5
          y: 3
          note: "Human expertise can cover complex estates but is service intensive."
        - label: Zesty
          x: 3
          y: 2
          note: "Specialist Kubernetes and commitment automation; wider FinOps scope is not established."
    approximationNotes: >-
      Ordinal 1-5 scores are analyst assessments derived from the cited product,
      operating-model, and packaging evidence. They are not market share,
      performance measurements, or independent product scores.
    claimRefs: [CP001, CP004, CP006, CP007, CP010, CP014]

callouts:
  - calloutType: strength
    title: Low-friction acquisition wedge
    body: Pump's free packaging and commitment-insurance promise directly address buyer resistance to another software fee and fear of unused commitments.
    claimRefs: [CP010, CP012, CP013]
  - calloutType: risk
    title: Native response risk
    body: Cloud providers own billing data and distribution, and reported native AI automation could narrow Pump's feature differentiation.
    claimRefs: [CP001, CP014]
  - calloutType: recommendation
    title: Underwrite through a matched-account bakeoff
    body: Compare net savings, unused commitments, forecast error, implementation effort, support burden, and offboarding using identical accounts and time periods.
    claimRefs: [CP009, CP012, CP014]

