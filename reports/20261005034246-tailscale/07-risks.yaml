callouts:
  - calloutType: "risk"
    title: "Dual-Use Vulnerability: Weaponization of Legitimate Networking Tools"
    body: "The primary operational security hazard facing Tailscale is not cryptographic compromise of the WireGuard protocol, but the weaponization of its legitimate software by threat actors. Attackers exploit Tailscale's seamless NAT traversal, signed executables, and headless utilities like tailcat to bypass enterprise perimeter firewalls without triggering traditional anti-malware alerts [CR002, CR003]."
    claimRefs:
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Control Plane Metadata vs. Data Plane Cryptography"
    body: "Tailscale maintains strict cryptographic separation: private keys never leave local devices, and peer-to-peer data packets remain end-to-end encrypted [CR007]. However, enterprise risk evaluators must distinguish data confidentiality from metadata jurisdiction: tailnet coordination policies, node maps, and user directory linkages hosted in AWS remain subject to US CLOUD Act subpoena powers [CR008]."
    claimRefs:
      - "CR007"
      - "CR008"
