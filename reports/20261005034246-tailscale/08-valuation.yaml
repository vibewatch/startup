  - id: "TV002"
    title: "Thesis and Anti-Thesis"
    columns:
      - "Lens"
      - "Argument"
      - "Evidence limitation"
      - "What would change the view"
    rows:
      - - "Thesis: paid adoption"
        - "Nearly 40,000 paid business clients, roughly twice the November level, indicate substantial product pull."
        - "Average contract value, customer concentration, and cohort retention are not disclosed."
        - "A customer-level ARR bridge and retained-revenue cohorts would strengthen the thesis."
      - - "Thesis: usage and product"
        - "Two million monthly active users, official AI-connectivity positioning, and detailed developer testimony support broad utility."
        - "Usage does not establish paid revenue quality or durable enterprise expansion."
        - "Paid conversion, expansion revenue, and workload-level retention would connect usage to value."
      - - "Anti-thesis: pricing"
        - "A reported 78.9x multiple uses an ambiguously defined revenue-or-ARR denominator."
        - "The source does not provide audited statements or a consistent comparable-company period."
        - "Audited current ARR, revenue recognition, and gross margin would permit a defensible multiple."
      - - "Anti-thesis: regulated buyers"
        - "A competing provider claims Tailscale's AWS control plane creates indirect CLOUD Act exposure."
        - "The source is commercially interested and is not an independent legal opinion."
        - "Independent counsel and enterprise win-loss data for regulated EU customers would resolve the issue."
    notes: "The compliance concern is explicitly attributed to a competitor-authored source and is presented as a diligence hypothesis, not a settled legal conclusion."
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV012"
      - "CV013"
      - "CV014"
  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation and return logic"
      - "Probability signal"
      - "Downside trigger"
    rows:
      - - "Bull"
        - "Paid-client growth persists; the sales-doubling claim converts into durable recurring revenue, retention, and margin."
        - "The April 2025 mark becomes more defensible only if verified economics materially reduce the reported multiple."
        - "Current ARR bridge, strong cohorts, and credible profitability conversion."
        - "Growth is usage-led but does not convert into paid expansion or cash generation."
      - - "Base"
        - "Customer and usage growth continue, but revenue quality and capital terms remain private."
        - "No public-evidence basis exists for a mark-up above the last reported valuation."
        - "Management supplies consistent economics but not enough history for an exit model."
        - "Diligence cannot reconcile ARR definitions, financing amounts, or preference terms."
      - - "Bear"
        - "Sales decelerate, AI-related demand is transient, regulated-buyer friction rises, or preferences increase effective entry cost."
        - "Value may fall below the last financing mark; the retained evidence cannot quantify the floor."
        - "Weak cohorts, concentrated revenue, persistent burn, or adverse regulated-customer win-loss data."
        - "Any material variance between management records and signed financing or billing data."
    notes: "No numerical probabilities, forward ARR, valuation ranges, or return targets are estimated because retained public evidence does not support them."
    claimRefs:
