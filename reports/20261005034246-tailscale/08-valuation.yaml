company:
  name: "Tailscale"
chapter:
  number: 8
  title: "Valuation"
  summary: "Tailscale shows unusually strong paid-customer and usage momentum, but the retained public record does not disclose a clean ARR, revenue, margin, retention, cash-burn, or preference data set. The recommendation is research-more with medium confidence, high risk, and a stretched valuation stance until private diligence can reconcile the April 2025 financing mark with current economics."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >-
      The evidence supports a research-more recommendation rather than a buy decision. Clay reports a
      $1.5 billion April 2025 Series C valuation, while Multiples.vc reports a 78.9x multiple using a
      $19 million figure that its own methodology may describe as revenue or ARR and as either run-rate
      or last-twelve-month revenue. That denominator ambiguity is material: it prevents a clean comparison
      between the private financing mark and operating performance. At the same time, BetaKit reports
      nearly 40,000 paid business customers and management's expectation that 2026 sales will double.
      The resulting stance is medium-confidence, high-risk, and stretched: operating momentum is credible,
      but the price cannot be underwritten from public evidence alone. No numerical target return, holding
      period, or exit value is supportable without current ARR, margin, retention, and capitalization data.
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-and-comparable-context"
    title: "Financing Record and Comparable Context"
    body: >-
      The financing record is directionally clear but numerically inconsistent across retained databases.
      Clay and Tracxn each report a $160 million Series C and $275 million of total funding; Startup
      Fundraising reports $160 million and $272 million; Multiples.vc's summary reports a $165 million
      Series C and $280 million total, even though its longer deal description uses $160 million and
      $275 million. These differences are small relative to the round but important for diligence because
      they demonstrate that aggregator fields are not a substitute for closing documents. Multiples.vc
      also lists revenue multiples of 2.6x for Progress Software, 5.1x for DPtech, 5.9x for A10 Networks,
      and 16.0x for Cato Networks, compared with its 78.9x Tailscale figure. The source does not establish
      a common measurement period or business-model comparability, so this set is a valuation warning,
      not a defensible peer-derived price.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV015"
  - id: "thesis-and-antithesis"
    title: "Operating Thesis and Anti-Thesis"
    body: >-
      The thesis rests on product pull, expanding paid adoption, and a credible route from developer use
      to enterprise infrastructure. BetaKit reports that paid business clients were approaching 40,000,
      roughly twice the November level, and that Tailscale had two million monthly active users. The
      official site now markets secure AI-agent connectivity and Aperture as unified AI governance,
      while a detailed self-hosted-community account illustrates the product's practical value across
      remote file access, administration, DNS, and exit-node use. The anti-thesis is that public scale
      signals do not reveal contract value, cohort retention, margins, or cash conversion. A competitor
      vendor, birdhost, also argues that Tailscale's AWS-hosted control plane creates indirect CLOUD Act
      exposure for European buyers. That is a self-interested competitive claim rather than an independent
      legal benchmark, but it identifies a diligence question that could affect regulated-customer growth.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-diligence"
    title: "Scenarios, Exit Readiness, and Diligence Triggers"
    body: >-
      The scenario framework is deliberately qualitative because the retained sources do not support
      precise forward revenue, ARR, probability, or exit-value ranges. In the bull case, paid-customer
      growth and management's sales-doubling claim translate into disclosed, durable recurring revenue
      with strong retention and margins, making the last financing mark easier to defend. In the base
      case, adoption remains strong but economics stay private, leaving the April 2025 mark as a ceiling
      rather than proof of current value. In the bear case, growth decelerates, AI-driven demand proves
      transient, European compliance friction rises, or private terms amplify downside below the last
      mark. Before investment, diligence should obtain the signed financing documents, fully diluted cap
      table, liquidation waterfall, monthly ARR bridge, cohort retention, gross margin, cash burn, customer
      concentration, and board-approved forecast. Failure to reconcile those records is itself a thesis-break
      trigger and prevents a supportable target return or exit-readiness conclusion.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
