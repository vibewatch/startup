callouts:
  - calloutType: "risk"
    title: "Sovereignty Compliance Headwinds in Regulated Jurisdictions"
    body: "While Tailscale's data plane is end-to-end encrypted via WireGuard, its centralized coordination control plane operates on AWS infrastructure. Under EU GDPR and NIS2 regulations, European legal analysts note that US CLOUD Act exposure creates structural compliance barriers for European public sector, healthcare, and financial enterprises compared to self-hosted or sovereign European alternatives."
    claimRefs:
      - "CU013"
  - calloutType: "insight"
    title: "AI Agent Workloads as an Emerging Customer Acquisition Engine"
    body: "The rapid emergence of autonomous AI agents like OpenClaw represents an unexpected and powerful top-of-funnel driver. Rather than facing immediate churn, Tailscale has observed durable retention among AI infrastructure users, positioning products like Aperture to capture high-value enterprise AI governance spend."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU012"
