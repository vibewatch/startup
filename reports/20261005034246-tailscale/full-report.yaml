chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Governance, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Tailscale Inc. was founded in 2019 by Avery Pennarun, David Carney, David Crawshaw, and Brad Fitzpatrick
              to eliminate traditional VPN complexity and make secure point-to-point networking virtually invisible.
              Headquartered in Toronto, Ontario, Canada, Tailscale operates as a fully remote organization with
              additional primary office hubs in Toronto and Berkeley, California, augmented by an engineering footprint
              in Vancouver following its March 2026 acquisition of Border0. Tailscale's platform implements a
              zero-trust, identity-based overlay network (tailnet) built on the open-source WireGuard protocol
              (wireguard-go), enabling peer-to-peer encrypted communication without exposing inbound router ports,
              maintaining certificate authorities, or forcing lateral network exposure. Governance is anchored by
              co-founder and Chief Executive Officer Avery Pennarun alongside Chief Strategy Officer David Carney and
              Accel Partner Amit Kumar on the Board of Directors, supported by an investor partner group including CRV,
              Insight Partners, Heavybit, and Uncork Capital, as well as a technical advisory board featuring WireGuard
              creator Jason Donenfeld and Kubernetes co-creator Joe Beda. In mid-2026, Tailscale appointed Mike Shaver,
              formerly of Facebook, Mozilla, and Shopify, as Vice President of Engineering following the departure of
              Andrew Mitchell, directing engineering scalability amid surging AI-driven customer growth.
