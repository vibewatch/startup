      - number: '3.2'
        title: 'Architectural Differentiation: Control Planes, Identity, and Sovereign Data Compliance'
        blocks:
          - type: paragraph
            body: >-
              Evaluating mesh VPN and zero-trust alternatives reveals sharp divergence across coordination architecture,
              identity integration, and regulatory risk. While raw WireGuard offers maximum cryptographic purity and
              zero licensing costs, it requires manual key distribution and static endpoint configuration that becomes
              unmanageable beyond a handful of nodes. Tailscale abstracts this operational complexity via central
              coordination on AWS, automated key rotation, and identity provider integration. However, hosting control
              plane metadata on US hyperscaler infrastructure creates structural compliance friction under European
              privacy frameworks. Following the Court of Justice of the European Union's Schrems II decision and the
              extraterritorial scope of the US CLOUD Act, European organizations face regulatory scrutiny when routing
              corporate network metadata through US cloud providers, even when payload traffic is end-to-end encrypted.
              Competitors like NetBird hosted via sovereign EU providers offer zero CLOUD Act exposure by maintaining
              German data center residency under ISO 27001 and BSI C5 standards. In contrast, edge-native platforms like
              Cloudflare Zero Trust terminate TLS traffic at edge points of presence, gaining global latency advantages
              at the expense of end-to-end peer privacy.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
