figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Key chronological milestones in Tailscale's corporate, funding, product, and architectural development from 2019
      to 2026.
    data:
      items:
        - label: '2019-01: Company Founding'
          date: 2019-01
          detail: >-
            Tailscale founded in Toronto by Avery Pennarun, David Carney, David Crawshaw, and Brad Fitzpatrick to build
            human-scale, zero-trust mesh networking on WireGuard.
          tone: positive
        - label: '2020-04: Seed Round & GA'
          date: 2020-04
          detail: >-
            Secured $3M in Seed funding led by Heavybit with Uncork Capital and announced initial General Availability
            of the mesh VPN.
          tone: positive
        - label: '2020-11: Series A Financing'
          date: 2020-11
          detail: >-
            Raised $12M Series A led by Accel (Amit Kumar) to scale wireguard-go engineering and early enterprise
            features.
          tone: positive
        - label: '2022-05: Series B & $1B Valuation'
          date: 2022-05
          detail: >-
            Closed $100M Series B co-led by CRV and Insight Partners, achieving $1B unicorn valuation status and
            expanding team past 70 employees.
          tone: positive
        - label: '2024-03: 5,000 Paying Customers'
          date: 2024-03
          detail: >-
            Surpassed 5,000 paid business customers on fifth anniversary, establishing robust bottom-up developer growth
            engine.
          tone: positive
        - label: '2025-01: 10,000 Enterprise Customers'
          date: 2025-01
          detail: >-
            Crossed 10,000 business accounts and 500,000 weekly active users across remote, CI/CD, and hybrid
            infrastructure workloads.
          tone: positive
        - label: '2025-04: Series C at $1.5B Valuation'
          date: 2025-04
          detail: Raised $160M USD ($230M CAD) Series C led by Accel Growth at a $1.5B USD ($2.0B CAD) post-money valuation.
          tone: positive
        - label: '2026-03: Border0 Acquisition'
          date: 2026-03
          detail: >-
            Acquired Vancouver-based zero-trust access startup Border0 to integrate identity-aware edge proxies and
            expand engineering presence in British Columbia.
          tone: positive
        - label: '2026-05: Sovereign GDPR Scrutiny'
          date: 2026-05
          detail: >-
            Third-party compliance assessments identify indirect US CLOUD Act exposure due to AWS control plane
            dependency, creating friction for EU buyers.
          tone: warning
        - label: '2026-07: AI Agent Surge & 40,000 Customers'
          date: 2026-07
          detail: >-
            Nears 40,000 paid clients and 2M MAUs following rapid adoption by autonomous AI agents (OpenClaw) and
            enterprise AI labs; Mike Shaver appointed VP of Engineering.
          tone: positive
        - label: '2026-09: Version 1.102.5 & Engine Upgrades'
          date: 2026-09
          detail: >-
            Shipped Tailscale 1.102.5 with buffer memory reduction, netmap caching for offline resilience, multi-queue
            routing, and new seat-based billing tier.
          tone: neutral
    approximationNotes: >-
