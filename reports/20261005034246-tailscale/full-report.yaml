      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Motion
        blocks:
          - type: paragraph
            body: >
              Tailscale's go-to-market motion relies on product-led growth (PLG) that transitions smoothly from
              individual practitioners into centralized departmental purchase orders. The initial adoption trigger
              almost universally originates with end-user developers, DevOps specialists, and site reliability engineers
              seeking to eliminate 3 to 5 hours of weekly friction spent wrestling with legacy VPN disconnects, NAT
              traversal, and manual firewall configurations. By offering a generous free Personal tier supporting up to
              3 users and 100 devices, Tailscale allows individual engineers and homelab hobbyists to validate the mesh
              technology in personal workflows before introducing it into team environments. Mid-market organizations
              (100 to 1,000 employees) represent the core paying concentration, where buyers such as Directors of IT,
              VPs of Engineering, and CTOs initiate contracts funded from annual infrastructure or security tooling
              budgets ($15,000 to $30,000). Commercial adoption expands rapidly when teams outgrow device limits or
              trigger enterprise compliance mandates requiring Single Sign-On (SSO) integration with Google Workspace,
              Microsoft 365, or Okta, as well as centralized audit logging. In large global enterprises (1,000+
              employees), such as Airbus and Instacart, adoption expands from initial developer-led pilots into
              enterprise-wide deployments governed by Chief Information Security Officers (CISOs) and corporate IT
              councils, where custom enterprise pricing, priority support SLAs, and subnet routing into legacy VPCs
              become mandatory requirements.
