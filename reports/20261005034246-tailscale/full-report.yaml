            body: >-
              Because Tailscale operates its central coordination control plane on AWS infrastructure, European
              enterprise deployments face structural compliance challenges under the GDPR and CJEU Schrems II
              precedents. Even though user payload packets remain encrypted via WireGuard, network metadata including
              user identities, device keys, and tailnet topology are subject to potential US lawful access mandates,
              driving regulated European buyers toward sovereign self-hosted solutions like NetBird and Headscale.
