              Tailscale has raised $275M in cumulative equity financing across four institutional funding rounds,
              beginning with a $3M Seed round in April 2020 led by Heavybit, a $12M Series A in November 2020 led by
              Accel, and a $100M Series B in May 2022 co-led by CRV at a $1.0B post-money valuation. In April 2025,
