  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitution
        blocks:
          - type: paragraph
            body: >
              The enterprise secure connectivity market encompasses three adjacent segments: legacy virtual private
              network (VPN) replacement, identity-based Zero Trust Network Access (ZTNA), and secure AI workload and
              agent infrastructure access. Historically, enterprises relied on centralized hardware appliances or
              software gateways running protocols such as IPsec or OpenVPN, which require manual certificate
              distribution, static IP routing, and perimeter firewall maintenance. Tailscale redefines this perimeter by
              delivering a zero-configuration overlay mesh built directly on the WireGuard protocol, creating encrypted
              point-to-point connections where access is determined by authenticated identity rather than network
              physical location. Included enterprise spend captures remote access software, cloud infrastructure access
              gateways, privileged access management (PAM), and developer private connectivity licenses. Excluded from
              this immediate boundary are commodity public consumer privacy proxies, heavy on-premises unified threat
              management (UTM) hardware appliances, and wide-area multi-protocol label switching (MPLS) physical
              transport contracts. In practice, Tailscale directly substitutes for corporate VPN solutions like Cisco
              AnyConnect, OpenVPN Access Server, and Palo Alto Networks GlobalProtect, while simultaneously competing
              with modern mesh alternatives like NetBird and cloud-scale zero-trust suites including Cloudflare Zero
              Trust and Zscaler Private Access. Furthermore, developer teams frequently employ no formal VPN at all,
              relying on insecure SSH port forwarding and obscurity blocklists, which Tailscale displaces by providing
              friction-free authenticated access.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
