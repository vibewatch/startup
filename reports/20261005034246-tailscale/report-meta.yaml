  topStrengths:
    - Strong developer-led product pull and word-of-mouth adoption
    - Expanding enterprise and AI workload use cases
    - Well-capitalized post-Series C balance sheet
  topRisks:
    - Public evidence still lacks ARR, margin, retention, and cash-burn visibility
    - US-hosted control-plane and data-sovereignty concerns may impede regulated EU sales
    - Valuation remains hard to underwrite against opaque private-market economics
  unresolvedGaps:
    - >-
      Current ARR, revenue growth, gross margin, free cash flow, and net retention are not publicly disclosed and remain
      the biggest blockers to clean valuation work.
    - >-
      Exact 2026 headcount, customer mix, and conversion from free or hobbyist usage into durable enterprise spend
      remain only partially visible.
    - >-
      The full cap table, board rights, liquidation preferences, and any insider or secondary pricing after the Series C
      are not public.
    - >-
      Customer concentration and cohort durability—especially the share tied to AI startups versus broader enterprise
      buyers—remain unquantified in retained public evidence.
