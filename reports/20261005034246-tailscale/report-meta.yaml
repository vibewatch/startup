companyProfile:
  summary: >-
    Tailscale is a Toronto-based cybersecurity company founded in 2019 that sells identity-first mesh networking and
    secure access software built on WireGuard. It combines a self-serve freemium motion with enterprise contracts,
    increasingly serves AI workloads and governance use cases, and has expanded to roughly 40,000 paid business
    customers by mid-2026.
