  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、治理与核心架构
        blocks:
          - type: paragraph
            body: >-
              Tailscale Inc. 由 Avery Pennarun、David Carney、David Crawshaw 和 Brad Fitzpatrick 于 2019 年创立，目标是消除传统 VPN
              的复杂性，让点对点安全网络连接几乎隐形。公司总部位于加拿大安大略省多伦多，采用完全远程办公模式，并在多伦多和加利福尼亚州伯克利设有主要办公据点；2026 年 3 月收购 Border0
              后，又增加了温哥华的工程团队。Tailscale 平台基于开源 WireGuard
              协议（wireguard-go）搭建零信任、基于身份的覆盖网络（tailnet），既能实现点对点加密通信，又不必暴露路由器入站端口、维护证书颁发机构或强行扩大横向网络暴露面。公司治理由联合创始人兼 CEO
              Avery Pennarun、首席战略官 David Carney，以及董事会成员、Accel 合伙人 Amit Kumar 负责；投资方合作伙伴包括 CRV、Insight Partners、Heavybit
              和 Uncork Capital，技术顾问委员会则包括 WireGuard 创始人 Jason Donenfeld 和 Kubernetes 联合创始人 Joe Beda。2026 年中，Tailscale
              任命曾任职于 Facebook、Mozilla 和 Shopify 的 Mike Shaver 为工程副总裁，接替离任的 Andrew Mitchell，在 AI 驱动客户激增之际负责工程扩展能力。
