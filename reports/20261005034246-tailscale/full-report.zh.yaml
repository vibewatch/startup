  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接网状对手、开源分支与企业级 ZTNA
        blocks:
          - type: paragraph
            body: >-
              2026 年安全私有网络市场分为四种主要架构范式：托管 WireGuard 网状 VPN、自托管开源控制平面、边缘原生身份感知代理，以及嵌入应用的零信任覆盖网络。Tailscale 通过把内核级加密隧道与专有
              SaaS 协调平面、MagicDNS 及依托全球分布式 DERP 中继的自动 NAT 穿透结合起来，开创了托管 WireGuard 网状模式。但企业采用壁垒催生了直接的开源替代方案。NetBird
              已成为最突出的端到端开源网状竞争者，提供托管云和完整自托管，并采用混合 BSD-3 与 AGPLv3 许可模式，原生集成身份提供商。与此同时，Headscale
              是一个干净室式开源协调服务器实现，允许未经修改的官方 Tailscale 客户端应用向用户自有基础设施认证，直接化解 Tailscale 专有控制平面对主权部署造成的锁定。向上看，Cloudflare Zero
              Trust 和 Twingate 等企业既有厂商完全绕开点对点网状机制，转而采用边缘代理网络和资源侧连接器拓扑，以集中管理企业策略。
