      - number: '3.2'
        title: 架构差异化：控制平面、身份与主权数据合规
        blocks:
          - type: paragraph
            body: >-
              评估网状 VPN 和零信任替代方案，可以看到协调架构、身份集成和监管风险之间存在明显分化。原始 WireGuard
              具有最高的加密纯粹性且许可成本为零，但需要手动分发密钥和配置静态端点，节点超过少数几个后便难以管理。Tailscale 通过 AWS
              中心协调、自动密钥轮换和身份提供商集成，抽象掉这层运营复杂性。但把控制平面元数据托管在美国超大规模云基础设施上，也带来欧洲隐私框架下的结构性合规摩擦。欧盟法院作出 Schrems II 判决、美国 CLOUD
              Act 具有域外适用范围后，即便有效载荷流量端到端加密，欧洲组织在把企业网络元数据经由美国云提供商传输时仍会受到监管审查。通过主权欧盟提供商托管的 NetBird，可依托符合 ISO 27001 和 BSI C5
              标准的德国数据中心驻留，避免 CLOUD Act 暴露。相比之下，Cloudflare Zero Trust 等边缘原生平台在边缘存在点终止 TLS 流量，以牺牲端到端点对点隐私换取全球延迟优势。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
