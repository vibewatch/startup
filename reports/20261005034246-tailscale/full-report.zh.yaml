            body: >-
              Tailscale 通过四轮已披露融资累计获得 $275 million 风险资本 [CI011]。公司于 2025 年 4 月完成 $160 million C 轮融资，估计投后估值约为 $1.5
              billion，由 Accel 领投，既有机构投资者跟投 [CI012]。独立私有公司追踪机构和二级平台挂牌反映出不同的历史及二级估值标记，说明私募股权估值没有锚定活跃的公开市场 [CI013]。2026
