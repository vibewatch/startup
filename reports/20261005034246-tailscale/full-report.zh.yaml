  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代
        blocks:
          - type: paragraph
            body: >-
              企业安全连接市场包含三个相邻领域：替代传统虚拟专用网络（VPN）、基于身份的零信任网络访问（ZTNA），以及安全的 AI 工作负载和智能体基础设施访问。过去，企业依赖集中式硬件设备或运行
              IPsec、OpenVPN 等协议的软件网关，这些方案需要手动分发证书、静态 IP 路由和维护边界防火墙。Tailscale 直接基于 WireGuard
              协议提供零配置覆盖网状网络，重新定义这一边界：连接以加密点对点方式建立，访问权限由经过认证的身份而非网络物理位置决定。纳入的企业支出包括远程访问软件、云基础设施访问网关、特权访问管理（PAM）和开发者私有连接许可；不纳入当前边界的则是面向普通消费者的隐私代理、重型本地统一威胁管理（UTM）硬件，以及广域多协议标签交换（MPLS）物理传输合同。实际竞争中，Tailscale
              直接替代 Cisco AnyConnect、OpenVPN Access Server 和 Palo Alto Networks GlobalProtect 等企业 VPN，同时也与 NetBird
              等现代网状替代方案及 Cloudflare Zero Trust、Zscaler Private Access 等云端零信任套件竞争。更进一步，开发团队经常完全不使用正式 VPN，而是依赖不安全的 SSH
              端口转发和基于隐藏性的拦截清单；Tailscale 以无摩擦的身份认证访问取代了这种做法。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
