  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从产品拉力和规模证据出发，经过经济性不确定性与下行风险核查，最终得出“继续研究”的定性判断。
    data:
      nodes:
        - id: product-pull
          label: 产品拉力
          description: 官方关于 AI 连接的定位，以及详实的开发者实用性证据
        - id: paid-scale
          label: 付费规模
          description: 近 40,000 家付费企业客户，以及 200 万月活用户
        - id: growth-claim
          label: 增长口径
          description: 管理层预计 2026 年销售额翻倍，并称公司有望实现盈利
        - id: economic-gap
          label: 经济性缺口
          description: 未清晰披露当前 ARR、利润率、留存率、现金消耗或客户集中度
        - id: downside-check
          label: 下行风险核查
          description: 估值倍数含糊、融资记录不一致，还需核查受监管买方
        - id: decision
          label: 继续研究
          description: 价格与条款仍需私下财务和资本结构证据
      edges:
        - from: product-pull
          to: paid-scale
        - from: paid-scale
          to: growth-claim
        - from: growth-claim
          to: economic-gap
        - from: economic-gap
          to: downside-check
        - from: downside-check
          to: decision
    approximationNotes: 这只是定性的判断逻辑；流程不估算概率、收入、ARR、估值或回报。
    claimRefs:
      - CV005
      - CV007
      - CV008
