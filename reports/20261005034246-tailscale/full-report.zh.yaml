      - number: '2.2'
        title: 可寻址市场规模与渗透视角
        blocks:
          - type: paragraph
            body: >-
              评估 Tailscale 的市场机会，需要同时观察从网络安全行业自上而下的需求，以及自下而上的账户变现基准。自上而下看，行业指标显示企业安全需求强劲：Momentum Cyber 数据显示，2021
              年网络安全领域风险投资接近 $30 billion，反映企业快速转向远程办公和身份验证。行业调查也揭示了显著的实施障碍：Optiv Security 调查显示，只有 21%
              的企业采用零信任作为基础架构模型；Fortinet 研究则称，超过 80% 的公司认为在全企业部署零信任具有挑战性。这些摩擦正是 Tailscale
              的核心价值主张：通过渐进式、低风险部署降低采用零信任的门槛。自下而上看，Tailscale 展现出爆发式客户增长，从 2025 年 4 月 C 轮融资时的 10,000 家付费企业客户，增长到 2026
              年中即将超过 40,000 家，同时月活用户超过 2,000,000。Vendr 汇总的商业合同基准显示，付费层级从 Starter 的每用户每月 $6 到 Premium 的每用户每月
              $18，Enterprise 则采用定制协商合同。在 50 至 500 个席位的中端市场部署中，典型年度软件支出为 $15,000 至
              $30,000，说明仅开发者导向和中端企业就带来数亿美元以上的即时可服务市场（SAM）；覆盖全球企业远程访问和 ZTNA 支出的更广义总可寻址市场（TAM）则达到数百亿美元。
