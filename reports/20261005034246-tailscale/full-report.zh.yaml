  - id: FM001
    title: Tailscale 企业市场机会规模分层
    type: pyramid
    summary: 展示 Tailscale 从开发者网状网络向企业零信任拓展的规模框架。
    data:
      items:
        - label: 全球远程访问与 ZTNA 企业支出
          value: Top-Down Market Horizon
          note: 取代传统硬件和软件 VPN 的数十亿美元全球市场
        - label: 企业混合与多云基础设施访问
          value: Large Enterprise Expansion Layer
          note: 需要 VPC 互联、子网路由和定制 SLA 的大型企业
        - label: 云原生与混合工作负载连接
          value: Mid-Market & Enterprise Target
          note: 分布式企业将云 VPC 访问迁移到基于身份的控制
        - label: 开发者主导的网状网络与微分段
          value: Core Serviceable Opportunity
          note: 快速采用、年度连接预算为 $15K-$30K 的中型软件团队
        - label: 自主 AI 代理连接基础设施
          value: Emerging Expansion Frontier
          note: 为自主 AI 代理提供私有身份和模型上下文协议路由
        - label: Tailscale 商业渗透基础
          value: 40,000 Paid Business Accounts
          note: 2026 年 2M 月活用户和近 40,000 个付费企业组织
    approximationNotes: 规模层级代表概念性市场分层；账户数量反映 BetaKit 报道的公司披露。
    claimRefs:
      - CM001
      - CM008
      - CM010
      - CM012
