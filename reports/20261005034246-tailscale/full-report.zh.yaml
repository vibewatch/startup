      - number: '5.2'
        title: 架构、依赖与可靠性模型
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的架构差异在运营层而非密码学层：保留的独立解释资料称，Tailscale 在 WireGuard 数据平面周围增加了密钥分发、对等发现、NAT
              穿透、身份和策略。系统优先使用直接对等路径；当网络拓扑无法建立直连时，则由中继基础设施处理。公司发布的工程招聘材料还把全球 Funnel 和 DERP 基础设施、开源客户端数据平面、基于 Go
              的系统、可观测性、事故响应和扩展能力列为当前工程职责。这些披露显示技术投入集中在哪里，但无法证明正常运行时间、直连率、中继吞吐量、恢复时间或事故历史。即使有效载荷流量仍由端点加密，封闭的托管协调层也会构成重要依赖。
