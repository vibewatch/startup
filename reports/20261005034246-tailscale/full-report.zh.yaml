      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Tailscale 依靠产品驱动增长（PLG），从个人实践者顺畅过渡到部门集中采购。最初的采用几乎总是来自终端开发者、DevOps 专员和站点可靠性工程师，他们希望摆脱传统 VPN 断连、NAT
              穿透和手动配置防火墙造成的每周 3 至 5 小时摩擦。Tailscale 提供支持最多 3 名用户和 100 台设备的慷慨免费 Personal
              层，让个人工程师和家庭实验室爱好者先在个人工作流中验证网状技术，再引入团队环境。中端组织（100 至 1,000 名员工）是核心付费集中区，IT 总监、工程副总裁和 CTO
              等买家会从年度基础设施或安全工具预算中拨出 $15,000 至 $30,000 签订合同。当团队超出设备限制，或企业合规要求与 Google Workspace、Microsoft 365 或 Okta
              集成单点登录（SSO）并集中记录审计日志时，商业采用会迅速扩大。在 Airbus、Instacart 等大型全球企业（1,000+
              名员工）中，采用会从开发者主导的初步试点扩展到全企业部署，由首席信息安全官（CISO）和企业 IT 委员会管理；定制企业定价、优先支持 SLA，以及进入传统 VPC 的子网路由会成为硬性要求。
