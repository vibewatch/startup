      - number: '5.4'
        title: 差异化与信任边界
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的优势在于托管控制层：它移除了手动对等配置，同时保留 WireGuard 作为连接底座。这种便利也带来取舍：保留的对比资料称，Tailscale
              采用开源客户端搭配专有协调服务器，中继回退相较直连可能降低路径效率。另一家托管网络厂商进一步主张，经 AWS 处理的元数据会带来 CLOUD Act
              和欧洲数据主权暴露，同时承认用户流量端到端加密。由于该来源销售替代方案，其法律结论属于对立的竞争者分析，而非独立的合规判断。因此，投资判断应要求架构文档、数据流和驻留证据、最新保障报告及针对客户的法律审查，而不应把任一公司的营销说法或竞争者论断视为决定性依据。
            claimRefs:
              - CE003
              - CE005
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 控制平面保障仍是关键技术尽调缺口
            body: 端点加密并不能消除对托管协调、身份、元数据处理和中继运营的依赖。保留的证据没有量化可用性，也没有独立解决竞争者提出的数据主权担忧，因此应直接审阅安全架构、服务指标、保障报告和按司法辖区划分的法律分析。
            calloutType: risk
            claimRefs:
