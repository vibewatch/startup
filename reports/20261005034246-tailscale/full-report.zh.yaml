        title: 展示项
        blocks:
          - type: callout
            title: 欧洲部署面临的美国 CLOUD Act 管辖风险
            body: >-
              Tailscale 将中央协调控制平面运行在 AWS 基础设施上，因此欧洲企业部署在 GDPR 和欧盟法院 Schrems II 判例下会面临结构性合规挑战。即使用户有效载荷数据包通过 WireGuard
              保持加密，包含用户身份、设备密钥和 tailnet 拓扑在内的网络元数据仍可能受到美国合法访问授权，促使受监管的欧洲买家转向 NetBird 和 Headscale 等主权自托管方案。
