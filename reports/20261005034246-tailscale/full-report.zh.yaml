figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示 Tailscale 2019 至 2026 年公司、融资、产品和架构发展的关键时间节点。
    data:
      items:
        - label: 2019-01：公司成立
          date: 2019-01
          detail: >-
            Tailscale 由 Avery Pennarun、David Carney、David Crawshaw 和 Brad Fitzpatrick 在多伦多创立，旨在基于 WireGuard
            打造适合人类规模使用的零信任网状网络。
          tone: positive
        - label: 2020-04：种子轮与 GA
          date: 2020-04
          detail: 获得由 Heavybit 领投、Uncork Capital 参与的 $3M 种子轮融资，并宣布网状 VPN 首次正式可用。
          tone: positive
        - label: 2020-11：A 轮融资
          date: 2020-11
          detail: 完成由 Accel（Amit Kumar）领投的 $12M A 轮融资，用于扩大 wireguard-go 工程团队并开发早期企业功能。
          tone: positive
        - label: 2022-05：B 轮与 $1B 估值
          date: 2022-05
          detail: 完成由 CRV 和 Insight Partners 共同领投的 $100M B 轮融资，估值达到 $1B 独角兽水平，团队扩大至 70 人以上。
          tone: positive
        - label: 2024-03：5,000 个付费客户
          date: 2024-03
          detail: 在成立五周年时付费企业客户超过 5,000 个，建立了强劲的自下而上开发者增长引擎。
          tone: positive
        - label: 2025-01：10,000 个企业客户
          date: 2025-01
          detail: 企业账户超过 10,000 个，远程、CI/CD 和混合基础设施工作负载的周活用户达到 500,000。
          tone: positive
        - label: 2025-04：C 轮，估值 $1.5B
          date: 2025-04
          detail: 完成由 Accel Growth 领投的 $160M USD（$230M CAD）C 轮融资，投后估值为 $1.5B USD（$2.0B CAD）。
          tone: positive
        - label: 2026-03：收购 Border0
          date: 2026-03
          detail: 收购总部位于温哥华的零信任访问初创公司 Border0，以整合身份感知边缘代理，并扩大在不列颠哥伦比亚省的工程团队。
          tone: positive
        - label: 2026-05：主权与 GDPR 审查
          date: 2026-05
          detail: 第三方合规评估指出，由于依赖 AWS 控制平面，存在间接的美国 CLOUD Act 暴露，使欧盟买家产生顾虑。
          tone: warning
        - label: 2026-07：AI 代理激增与 40,000 个客户
          date: 2026-07
          detail: 随着自主 AI 代理（OpenClaw）和企业 AI 实验室快速采用，付费客户接近 40,000 个、月活用户达到 2M；Mike Shaver 被任命为工程副总裁。
          tone: positive
        - label: 2026-09：版本 1.102.5 与引擎升级
          date: 2026-09
          detail: 发布 Tailscale 1.102.5，包含缓冲区内存削减、提升离线韧性的 netmap 缓存、多队列路由和新的按席位计费层级。
          tone: neutral
    approximationNotes: 时间线事件直接取自公司官方披露、投资者公告、版本说明和行业媒体。
    claimRefs:
      - CO001
      - CO004
