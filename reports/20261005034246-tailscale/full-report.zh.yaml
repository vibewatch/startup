        title: 产品覆盖面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Tailscale 提供的是单一安全连接平台，而非独立的隧道客户端。当前产品覆盖企业 VPN、特权访问、CI/CD 与工作负载连接、Edge 与 IoT，以及通过 Aperture 提供的 AI
              导向访问。文档展示了这些方案背后的操作原语：面向无法运行客户端的资源的子网路由器、用于路由互联网流量的出口节点、日志、集成、自动化、访问控制、CLI 和
              API。这种广度让运营人员可以从设备注册开始，再把同一身份和策略模型延伸到传统子网和应用工作流。但产品页面的广度并不能证明每个模块拥有相同的采用率、成熟度或经济性；因此模块矩阵会把营销中的可用性与独立验证的部署证据区分开来。
            claimRefs:
              - CE001
              - CE002
              - CE006
