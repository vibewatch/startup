  - id: FE001
    title: Tailscale 产品架构图
    type: stack
    summary: 该产品在身份与协调服务、WireGuard 直连路径和托管中继基础设施之上，叠加了广泛的解决方案层。
    data:
      layers:
        - label: 用户与工作负载解决方案
          detail: 面向读者的产品类别
          modules:
            - 企业 VPN 与远程访问
            - PAM 与管理访问
            - AI、CI/CD、工作负载、边缘和 IoT 连接
        - label: 策略与身份
          detail: 应用于 tailnet 资源的治理
          modules:
            - 身份提供商集成
            - 访问控制策略
            - 设备和资源管理
        - label: 协调服务
          detail: 围绕数据平面的托管服务层
          modules:
            - 对等节点发现与公钥协调
            - DNS 与对等节点管理
        - label: 管理与集成
          detail: 已记录的管理和运营界面
          modules:
            - CLI 与 API
            - 集成与自动化
            - 日志与支持
        - label: 连接数据平面
          detail: 端点到端点的加密传输
          modules:
            - WireGuard 直连路径
            - 子网路由器与出口节点扩展
        - label: 托管网络运营
          detail: 备用和公共连接服务
          modules:
            - DERP 中继基础设施
            - Funnel 基础设施
            - 可观测性、事件和支持升级
    approximationNotes: 概念架构栈由保留文档、独立技术说明和公司发布的工程岗位描述整理而成；并非供应商提供的系统图。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示客户采用的连续阶段，从个人家庭实验室评估走向企业零信任治理。
    data:
      items:
        - label: 草根家庭实验室发现
          stage: 草根家庭实验室发现
          persona: Software Developer / Enthusiast
          action: Deploys free WireGuard mesh across personal machines, NAS, and home servers
          touchpoints: CLI client, open-source repos, community forums, MagicDNS
          kpi: End-user satisfaction and personal tailnet creation
        - label: 团队与工作负载互联
          stage: 团队与工作负载互联
          persona: DevOps Engineer / Tech Lead
          action: Introduces Tailscale to connect VPCs, staging clusters, and distributed developer devices
          touchpoints: Self-serve credit card checkout, ACL editor, Docker/K8s integrations
          kpi: Subnet router setup and multi-cloud connectivity
        - label: 部门级生产规模化
          stage: 部门级生产规模化
          persona: Engineering Manager / Infrastructure Lead
          action: Expands across multiple engineering pods, establishing subnet routers and exit nodes
          touchpoints: Team billing plan, admin console, Terraform provider, GitHub Actions
          kpi: Multi-cluster node growth and active developer tailnets
        - label: 企业身份与安全采购
          stage: 企业身份与安全采购
          persona: CISO / IT Security Director
          action: Transitions team deployments into enterprise-wide zero-trust mandate with SSO
          touchpoints: SAML/Okta integration, SCIM provisioning, audit log streaming, Solutions Engineering
          kpi: Contract value expansion and centralized policy compliance
        - label: 特权访问管理扩展
          stage: 特权访问管理扩展
          persona: SecOps Lead / Infrastructure Architect
          action: Deploys Tailscale PAM for protocol-aware access controls, session recording, and JIT access
          touchpoints: Tailscale PAM, SSH session recorder, ephemeral access approval
          kpi: Reduction in static bastion host credentials and audit compliance
        - label: AI 治理与代理工作负载路由
          stage: AI 治理与代理工作负载路由
          persona: AI Platform Engineer / Security Architect
          action: Expands into Aperture AI gateway for automated agent governance and private LLM routing
          touchpoints: Aperture AI gateway, agent token inspection, private inference endpoints
          kpi: Cross-module adoption and net revenue retention expansion
    approximationNotes: 旅程阶段综合自自助服务条款、代理商案例研究和解决方案工程销售扩展文档。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU011
      - CU012
