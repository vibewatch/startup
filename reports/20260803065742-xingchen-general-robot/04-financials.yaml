- id: cost-structure-and-unit-economics
  title: Cost structure and unit economics
  body: 'Xingchen discloses almost none of the metrics needed for true unit-economics analysis, so the best public approach is to triangulate from industry structure and better-disclosed peers. Humanoid-cost research reviewed in this run converges on the same core point: actuators, motion systems, dexterous hands, sensing, and control electronics dominate bill of materials, while software and data costs sit on top rather than replacing hardware intensity. The Chinese market has also become much less forgiving in 2026. Price-compression reporting shows faster domestic component substitution, falling rental prices, and aggressive competition from scaled players. That matters because Xingchen has not published the list price of SR-1, target gross margin, or the service economics attached to deployments. Without those disclosures, there is no public evidence that Xingchen can sell a wheeled dual-arm robot at positive contribution margin if domestic price competition intensifies. Peer benchmarking
    sharpens the point. Figure’s 2026 materials discuss major tooling, supply-chain, and manufacturing redesign for cost-down, while UBTECH’s listed-company filings show that even a much larger robot company can generate meaningful revenue and still remain loss-making. The safest reading is therefore that Xingchen’s early gross margins are unproven and likely fragile until the company demonstrates priced deployments, volume purchasing, and a repeatable services attach.'
