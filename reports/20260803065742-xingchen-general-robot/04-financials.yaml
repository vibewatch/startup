- id: capital-history-and-adequacy
  title: Capital history and adequacy
  body: 'The clean capital story remains much earlier than the user seed suggested. Across CNR, Phoenix, and registry-style aggregators, the best-supported round is a RMB30 million angel financing completed in September 2025 and announced in late October 2025, backed by Xiangjiang state capital and Hunan Haichuang. Those sources say the money would fund upgrades to Xingchen Brain and Xingchen Control, push wheeled dual-arm robot mass production, and deepen commercialization. Registry and encyclopedia-style sources also point to corporate restructuring around Changsha: the Shenzhen entity was founded with only RMB500,000 of registered capital, QCC shows it had zero insured employees in its 2024 annual report, and the same filing shows it became wholly owned by a Hunan Xingchen entity in September 2025. Baidu Baike and a July 2026 RobotToday article go further by describing a Changsha headquarters move, an IPO ambition, and joint-stock restructuring, but those claims are materially weaker
    than a filing or prospectus and should not be treated as settled financing proof. Most importantly, reviewed sources still do not provide a directly reviewable June 2026 Series B, cash balance, debt schedule, or runway disclosure. So capital adequacy cannot be underwritten from public materials alone: the company may have policy support and partner access, but it still appears dependent on undisclosed follow-on capital to finance scale-up.'
