- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing failure
    - No credible follow-on capital despite ongoing commercialization burn
    - Undercuts survival and bargaining power
    - Rebase valuation toward bear case or step away
  - - Proof fails to widen
    - No additional meaningful paying deployments beyond current proof set
    - Thesis remains too concentrated and fragile
    - Keep at TRACK or downgrade
  - - Visible field failure
    - Public safety or reliability issue at a flagship site
    - Damages customer trust and raises diligence burden
    - Pause underwriting until root cause is understood
  - - Cap-table downside worse than expected
    - Aggressive preferences or liquidation stack surface
    - Common-equity upside compresses even if enterprise value is fair
    - Demand price discount or protections
  - - Geopolitical hardening
    - Material new tariff, procurement, or security barrier in target export market
    - Reduces TAM and multiple support
    - Cut international upside assumptions
  - - Unit economics disappoint
    - Hardware-plus-service economics prove weak or subsidy-dependent
    - Breaks path to attractive scale
    - Re-rate to option value only
  notes: These triggers are monitorable between rounds and connect directly to scenario downgrades.
