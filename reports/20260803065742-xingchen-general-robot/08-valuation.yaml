  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Cap table and dilution structure
    missingEvidence: Preference stack, warrants, option pool, liquidation waterfall, and any side letters from post-angel financing.
    whyItMatters: Enterprise-value reasoning is incomplete until equity downside structure is known.
    diligencePath: Request latest cap table and financing documents.
    relatedQuestionRefs:
    - QV022
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: Current cash and runway
    missingEvidence: Cash balance, burn, receivables/payables, and bridge to next financing.
    whyItMatters: Hardware valuation can collapse quickly if capital runway is short.
    diligencePath: Request monthly cash bridge and fundraising plan.
    relatedQuestionRefs:
    - QV018
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: Customer economics
    missingEvidence: Contract values, paid versus pilot status, robot counts, expansion behavior, and renewal terms.
    whyItMatters: Commercial proof without economics cannot support strong valuation.
    diligencePath: Request customer-by-customer contract abstracts and revenue schedule.
    relatedQuestionRefs:
    - QV017
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: Unit economics
    missingEvidence: BOM, ASP, gross margin, support cost, and warranty burden for SR-1 and future variants.
    whyItMatters: This determines whether scenario bands are realistic or too generous.
    diligencePath: Request product-level P&L and unit-economics assumptions.
