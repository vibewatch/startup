- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: 'The valuation problem starts with the financing record itself. Across the retained open-source set, the best-supported Xingchen financing fact remains the 2025 angel round. That is meaningful, but it is not enough to anchor a mature private valuation on its own. The public set used in this run still does not directly verify a later 2026 Series B or a definitive >RMB10B valuation. That absence does not prove the company is weak; it proves that public investors and diligence teams should not treat unreviewed narrative marks as established fact. In this context, entry discipline matters more than sector excitement. Traditional multiple work is not useful because revenue, margin, and retention are undisclosed. A scenario method is more appropriate: ask what proof exists now, what additional milestones would justify a higher band, and what evidence would force a discount. Without that discipline, investors risk importing late-stage unicorn logic into an early commercialization story
    whose key economics remain largely private.'
  claimRefs:
