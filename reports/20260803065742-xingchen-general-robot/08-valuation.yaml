  title: Recommendation summary table
  columns:
  - Parameter
  - Assessment
  - Evidence-backed note
  - Decision implication
  rows:
  - - Overall recommendation
    - TRACK / research-more
    - Real product and customer proof exist, but economics and later-stage financing remain under-disclosed
    - Keep in diligence funnel; do not underwrite later-stage pricing without direct company data
  - - Confidence
    - Medium
    - Public evidence is directionally useful but incomplete on finance, contracts, and cap table
    - Upgrade only after data-room level evidence arrives
  - - Risk rating
    - High
    - Concentrated proof base, high capital intensity, and policy friction remain material
    - Position sizing should assume high uncertainty
  - - Valuation stance
    - Unsupported at aggressive narrative marks
    - Retained open sources do not directly verify a de-risked unicorn anchor
    - Use scenario bands and negotiate hard on price
  - - What supports interest
    - Real field proof and coherent wedge
    - Qianhai, Wantian, and service/public-sector fit make this more than a demo story
    - Do deeper diligence rather than passing reflexively
  - - What blocks buy
    - No audited economics or verified later-stage mark
    - Public record does not show revenue quality, margin quality, or dilution structure
    - Do not pay for hidden proof
  notes: 'The table is intentionally price-sensitive: it separates company potential from what the public evidence can currently support for valuation.'
