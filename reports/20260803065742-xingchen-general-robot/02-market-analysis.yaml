- id: drivers-and-constraints
  title: 'Drivers and constraints: policy and supply-chain tailwinds are real, but ROI and geopolitics still bind'
  body: 'China’s 2026 environment is unusually favorable for embodied-robot startups. The HEIS 2026 standards system, the MIIT/SASAC real-scene plan, dense manufacturing supply chains, and aggressive investor interest all support faster iteration and more scenarios for testing. Market commentary also points to scale advantages in components, EV-adjacent manufacturing, and domestic deployment appetite. But the same sources show why the market is not frictionless. Talent is expensive and scarce in control, sim-to-real, and embodied-AI engineering. WAIC and industry reports increasingly emphasize sustained operation and workflow value rather than locomotion demos, meaning weak products will be filtered by real deployments rather than by conference attention. Western procurement scrutiny and supply-chain restrictions may compress overseas TAM for Chinese vendors. And hype risk remains meaningful: several 2026 articles explicitly ask whether IPO and valuation narratives are running ahead of operating
    reality. For Xingchen, the practical implication is that policy tailwinds can open doors, but only repeatable scenario economics and supportable reliability can turn those openings into a durable market position.'
