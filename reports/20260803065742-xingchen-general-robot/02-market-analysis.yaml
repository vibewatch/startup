callouts:
- calloutType: insight
  title: Big China market does not equal big current Xingchen SOM
  body: The same source set can support a very large national market and a very narrow currently evidenced beachhead. For Xingchen, product surface and deployment proof still point first to service, city, and partner-led pilots rather than to the full factory-automation stack.
  claimRefs:
  - CM005
  - CM026
  - CM027
  - CM035
- calloutType: risk
  title: Policy tailwinds now come with standards and uptime filters
  body: 2026 market commentary repeatedly shifts the industry conversation from “can the robot move?” to “can the robot operate reliably in a real workflow?” That raises the bar for smaller vendors even as it expands the opportunity set.
  claimRefs:
  - CM011
  - CM023
  - CM032
  - CM033
