- id: sizing-lenses
  title: Sizing the market with multiple lenses, not one headline TAM
  body: 'Public market data supports two truths at once: China’s embodied-AI and humanoid market is scaling extremely quickly, and the current monetized slice is still much smaller than the headline future narrative. Sourcebotics describes a roughly $1.3B China humanoid market in 2026 with more than 80% of global installations concentrated in China. Robotics Center of Silicon Valley places the broader Chinese robotics market at $14.2B in 2026, up 47% year over year, while Faxiangongchang frames 2026 as the first true humanoid mass-production year after roughly 17,000 global shipments by end-2025. TrendForce adds a production lens: China humanoid output could rise 94% in 2026, led by larger players such as Unitree and AgiBot. For Xingchen, the investable takeaway is not that every one of those dollars is addressable; it is that the sector tailwind is real, but the company’s likely near-term SAM sits in a narrower subset of public-service, enterprise-service, and pilot-deployment budgets rather
    than in the entire national robotics spend figure.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM021
