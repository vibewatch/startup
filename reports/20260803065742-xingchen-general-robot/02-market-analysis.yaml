    - Generic smart-city software without robots
    - City authorities, parks, public-service operators
    - Qianhai and Wantian make this the clearest directly evidenced category.
  - - Commercial service venues
    - Robot hardware, interaction software, support, content / workflow integration
    - Traditional kiosk software or staffing-only budgets
    - Hotels, museums, showrooms, office operators
    - Official site scenarios skew heavily toward these indoor interaction settings.
  - - Enterprise pilot deployments
    - Hardware, software integration, support, data collection, workflow redesign
    - Enterprise AI spend not tied to a robot workflow
    - Corporate innovation, digital, retail, and partner budgets
    - Names like CR Digital, Haier, and DragonPass suggest this budget line exists.
  - - Industrial / logistics embodied pilots
    - Robot hardware, manipulation, control, integration, safety, maintenance
    - Conveyor upgrades, industrial arms, AMRs, pure software AI
    - Factories, warehouses, integrators
    - Relevant in macro sources, but weakly evidenced for Xingchen itself today.
  - - R&D / education / demonstration
    - Developer kits, sensors, data collection, research integration
    - Entertainment-only content spend with no robotics element
    - Labs, universities, innovation centers
    - A practical early-adoption layer in the sector, though not Xingchen’s main public pitch.
  - - Excluded adjacent automation
    - None — this row marks exclusions
    - Fixed industrial robots, cobots, drones, software-only AI
    - Existing automation buyers
    - These markets are too broad to count as Xingchen addressable without workflow-level proof.
