- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - MIIT / SASAC real-scene training push
    - positive
    - near term
    - Creates more testbeds and procurement attention for embodied robots
    - Map which sanctioned scenarios Xingchen actually participates in.
  - - HEIS 2026 standard system
    - positive / filtering
    - near to medium term
    - Raises trust and interoperability bar while favoring teams that can operationalize standards
    - Request Xingchen compliance roadmap and standards participation.
  - - China supply-chain density
    - positive
    - current
    - Can compress cost and iteration cycle for domestic hardware firms
    - Quantify supplier concentration and cost-down path.
  - - Talent inflation in sim-to-real and controls
    - negative
    - current
    - Raises burn and slows scaling for smaller teams
    - Request hiring plan, attrition, and compensation burden.
  - - Hype vs reality gap
    - negative
    - current
    - May inflate funding and valuation faster than reliable deployment economics
    - Test whether pilots convert into paid renewals.
  - - Western procurement / export scrutiny
    - negative
    - near to medium term
    - Can restrict overseas public-sector TAM and complicate component access
    - Map customer mix and import dependencies.
  - - Need for sustained operation and ROI
    - negative / gating
    - current
    - Conference visibility no longer substitutes for uptime and support performance
    - Request uptime, MTBF, and service-cost data from deployments.
  notes: 'Several items can be both tailwind and filter: policy and standards expand the market while also increasing the execution bar for undercapitalized startups.'
