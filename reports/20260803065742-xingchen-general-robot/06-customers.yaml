figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Xingchen’s apparent customer journey runs from scenario discovery and showcase pilots toward framework cooperation and potential scaled public-service rollouts.
  data:
    nodes:
    - label: Discovery
      detail: Government bodies, venue operators, and strategic partners encounter Xingchen through scenario fit, local policy networks, or public demonstrations.
    - label: Evaluation
      detail: Buyer assesses whether embodied-AI service robots can handle guidance, patrol, reception, or city-service jobs in real indoor environments.
    - label: Pilot / showcase deployment
      detail: Qianhai-style public-service station or project-level trial produces visible reference proof and operating data.
    - label: Framework / commercial design
      detail: Counterparty explores supply, technical support, scenario implementation, and business-model structure as in the Wantian filing.
    - label: Expansion / repeat use
      detail: Potential rollout into more parks, city-service nodes, or adjacent venue-service scenarios; public proof still thin here.
