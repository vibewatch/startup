- id: customer-verdict
  title: Customer verdict
  body: 'The best customer verdict is that Xingchen has crossed the threshold from hypothetical demand to referenceable adoption, but not yet to public proof of durable scale. Qianhai and the Wantian filing are meaningful because they show real scenes, real counterparties, and a route into public-service and government-adjacent budgets. The partner list from 2025 adds commercial optionality, but not enough direct proof to count those names as mature production customers. As a result, Xingchen’s customer story should currently be underwritten as an early portfolio of pilots, framework agreements, and scenario partners rather than as a broadly diversified installed base. The next diligence step is straightforward: request customer-by-customer detail on contract value, robot count, go-live status, renewal behavior, and revenue contribution. Until that package exists, the company’s customer quality looks credible, strategically useful, and still too thin for a strong durability claim.'
  claimRefs:
  - CU021
  - CU022
  - CU027
  - CU031
  - CU034
  - CU035
