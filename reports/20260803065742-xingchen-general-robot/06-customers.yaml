chapter:
  number: 6
  title: Customers
summary: Xingchen’s customer proof is real but narrow. The strongest directly reviewable evidence is a 2026 Qianhai public-service deployment and a July 2026 HKEX-filed framework agreement with China Wantian’s AI subsidiary covering product supply, scenario implementation, and operations-support concepts for government and public-service use cases. By contrast, the oft-cited strategic partners China Resources Digital, Haier, and DragonPass still appear in financing coverage rather than in fresh direct deployment announcements. That leaves Xingchen with credible early customer traction in public-service and partner-led channels, but weak public evidence on repeat revenue, retention, conversion from pilot to production, or concentration risk. The customer story is therefore promising, referenceable, and still early-stage.
sections:
- id: customer-segmentation-and-proof-base
  title: Customer segmentation and proof base
  body: The reviewed source set supports a customer story built around a small number of identifiable segments rather than a broad, clearly disclosed commercial base. First are public-service or government-adjacent operators, where the clearest evidence comes from Qianhai and the Wantian framework. Second are strategic partners named in financing coverage—China Resources Digital, Haier Smart Home, and DragonPass—which may represent commercial channels, solution collaborators, or future customers, but are not yet publicly documented as scaled live deployments. Third are venue-service users implied by official scenario copy such as exhibition halls, hotels, museums, offices, and showrooms. Fourth are local-government and city-governance projects, which matter because embodied-AI deployments often begin where policy, visibility, and experimentation align. This segmentation matters for diligence because the payer, user, and strategic value are not the same across these groups. A public pilot
    may be extremely valuable as proof and data, but still weak as recurring revenue evidence. Today, the strongest public proof sits in that high-visibility, early-commercialization segment rather than in a large diversified enterprise customer base.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU010
  - CU020
  - CU023
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: public-service-and-government-proof
  title: Public-service and government proof
  body: 'The chapter’s best customer-proof evidence comes from two 2026 public-service tracks. First, multiple sources describe the launch of China’s first robot-run volunteer service station at Qianhaishi Park in Shenzhen. Euronews, eWeek, Shenzhen Daily, Abit, and IndexBox all converge on the same operational pattern: robots give directions, hand out supplies, patrol, provide reminders, and interact with visitors in a real public environment. Several sources specifically note that the Xingchen robot handles patrol, safety reminders, and visitor questions while moving through the park. Second, the Wantian relationship is materially stronger than a generic press mention because the July 28, 2026 HKEX filing states that Wantian AI Technology and Hunan Xingchen General Robotics signed a strategic cooperation framework agreement covering embodied-AI products, public services, city governance, smart government, marketing, scenario implementation, and even operations-and-maintenance value-added
    services. Neither track proves large recurring revenue, but together they do establish that Xingchen has progressed beyond logos into directly reviewable field proof.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU018
  - CU019
  - CU022
  - CU032
