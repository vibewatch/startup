              下的额外客户，公开记录又低估了多元化。无论哪种情况，缺失的分母都具有决定性。公共服务部署仍可能格外重要，因为它们同时充当参考客户和测试床；但这种双重角色也有双面性：可见失败会伤害声誉，成功则可能推动相邻地方政府或场馆服务渠道先落地再扩张。今天，扩张逻辑比扩张数据更容易讲。
