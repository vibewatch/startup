      - number: '2.3'
        title: 买方地图：公共服务、服务场馆、企业试点和长周期工业用户
        blocks:
          - type: paragraph
            body: >-
              审阅来源显示至少有四个有意义的买方群。第一类是公共部门和城市关联买方：Qianhai 站点与 Wantian
              框架显示，咨询、巡逻、政策讲解和智慧政务场景存在需求。第二类是酒店、博物馆、品牌空间和办公室等商业服务场馆，这些都被官网明确点名。第三类是由企业和伙伴牵头的试点，经由 Haier、DragonPass、China
              Resources Digital 等名称连接智能家居、零售、旅行服务或数字服务渠道。第四类是更长周期的工业和物流买方，它们在 2026 年更广泛市场评论和 WAIC 部署话语中频繁出现，但对 Xingchen
              自身的证据要弱得多。四类买方的采用路径相似：先在边界清晰的场景里证明导航和交互，再接入工作流软件和安全规则；只有在线率、支持和 ROI 经得住真实使用，才扩大到更大部署。这套结构说明，亮眼的宏观 TAM
              应折扣成小得多的公司层面 SOM。
