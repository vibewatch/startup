  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Xingchen 看起来的客户旅程，是从场景发现和展示型试点，走向框架合作，并可能扩大到公共服务规模化落地。
    data:
      nodes:
        - label: 发现
          detail: 政府机构、场馆运营方和战略伙伴，通常通过场景适配、地方政策网络或公开演示接触 Xingchen。
        - label: 评估
          detail: 买方评估具身 AI 服务机器人能否在真实室内环境里承担引导、巡逻、接待或城市服务任务。
        - label: 试点 / 展示部署
          detail: Qianhai 式公共服务站或项目级试运行，产出可见标杆证明和运营数据。
        - label: 框架 / 商业设计
          detail: 交易对手探讨供应、技术支持、场景落地和商业模式结构，类似 Wantian 文件披露的框架。
        - label: 扩张 / 复用
          detail: 潜在扩展到更多园区、城市服务节点或相邻场馆服务场景；这里的公开证明仍薄弱。
