companyProfile:
  summary: >-
    Xingchen General Robot 是一家年轻的中国具身 AI 机器人公司，官方材料把它定位在“一脑多体”架构上，覆盖工业、商业和家庭场景。当前最清晰的公开产品是 SR-1，一款轮式双臂机器人；HR-1 和 BOT-1
    在公司官网上仍处于待发布状态。公开证据显示，公司通过前海机器人志愿者部署以及覆盖城市治理和公共服务场景的 Wantian 框架，已经有早期但真实的商业化尝试。财务披露仍然稀疏：最有力的已核验融资事实是 2025 年底宣布的
    RMB30 million 天使轮；审计收入、现金、毛利率以及后续阶段的公开估值锚点，在保留的开源材料中都未被直接核验。
