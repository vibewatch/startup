      - number: '5.3'
        title: 工作流与用例匹配
        blocks:
          - type: paragraph
            body: >-
              Xingchen 的公开用例故事比泛泛的具身 AI 品牌更具体，但也比“万能机器人”承诺更窄。官网包强调展览导览、酒店接待、博物馆讲解、办公室协助，以及展厅或接待场景。Qianhai
              报道补充了公共咨询、巡逻提醒、应急支持和轻量公共服务交互任务。合在一起，这些用途暗示，机器人首先针对面向人的工作流支持做优化，而不是复杂工业装配。这让当前轮式双臂形态在策略上说得通：轮式降低全双足运动的难度和成本，双臂又保留足够的轻服务任务与展示操作能力。这不意味着工厂和仓库不可能成为未来目标。它意味着，今天最强的审阅证据仍适配引导式交互、在人类空间中移动，以及中等强度移动操作负载。对尽调来说，关键区别在于“能覆盖许多场景”和“每个场景都有公开验证”，Xingchen
