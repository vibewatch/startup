              年年报参保员工为零；同一份申报显示，它在 2025 年 9 月成为一家 Hunan Xingchen 实体的全资子公司。Baidu Baike 和 2026 年 7 月 RobotToday 文章更进一步，描述
              Changsha 总部迁移、IPO 目标和股份制改造，但这些说法明显弱于备案或招股书，不应被当作已定融资证据。最重要的是，审阅来源仍未提供可直接审阅的 2026 年 6 月 Series B、现金余额、债务表或
