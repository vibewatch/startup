      - 重要性
      - 什么会改变判断
    rows:
      - - 存在真实商业化证明
        - 避免一票否决，并支撑期权价值
        - 多个新增付费部署或更强案例研究会提高确信度
      - - 公共服务切入口可能是真正滩头堡
        - 相比工厂优先的同行，可能提供差异化路径
        - 需要证明旗舰站点之外也能复制
      - - 财务不透明仍然严重
        - 没有收入和毛利清晰度，当前定价很难自圆其说
        - 管理账和客户经济性会显著提高支撑力度
      - - 后期估值叙事没有直接验证
        - 投资人不应把传闻当锚点
        - 董事会批准的直接融资材料会改变判断框架
      - - 可比公司显示别人已有多少规模和资本
        - 帮助围绕 Xingchen 尚未证明的内容设定纪律
        - 部署广度或融资深度出现阶跃提升，会缩小差距
      - - 中国折价真实存在
        - 出口和采购摩擦可能压住中国以外的可实现上行
        - 清晰的国内扩张或更安全的出口渠道会降低折价
    notes: 在当前证据深度下，反方论点强于正方论点，所以建议停在跟踪。
