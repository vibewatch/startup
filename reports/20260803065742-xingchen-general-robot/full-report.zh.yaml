      - 核心假设
      - 示意性估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 证明仍集中；没有经审计经济性；后续资本持续困难
        - US$250M–US$500M 期权价值区间
        - 资本压力、证明停滞、可见现场受挫
        - 如果当前证明不尽快扩宽，这一情景就有意义
      - - 基准
        - Wantian 式框架选择性转化；更多付费部署出现；披露小幅改善
        - US$600M–US$1.0B 区间
        - 仍容易受毛利不透明和地缘政治折价影响
        - 如果执行改善，最符合当前公开证据
      - - 乐观
        - 重复付费铺开、更广客户地图、更强经济性资料包和融资清晰度出现
        - US$1.2B–US$1.8B 区间
        - 需要比今天公开记录大幅更多的去风险
        - 有可能，但留存来源还没有证明这一点
      - - 所有情景的破局点
        - 严重安全、融资或客户转化失败
        - 估值会重置到当前模型区间下方
        - 狭窄证据基础会放大坏事件
        - 高监测优先级
    notes: 这些情景区间只是示意，相比行业最激进叙事刻意保守，因为 Xingchen 自身公开证据仍处早期。
