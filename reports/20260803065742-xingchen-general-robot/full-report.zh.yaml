        - 跟踪 / 继续研究
        - 真实产品和客户证明存在，但经济性和后期融资披露仍不足
        - 留在尽调漏斗；没有公司直接数据，不要为后期定价背书
      - - 信心
        - 中
        - 公开证据方向上有用，但财务、合同和股权结构仍不完整
        - 只有拿到数据室级证据后才上调
      - - 风险评级
        - 高
        - 证据基础集中、资本强度高、政策摩擦仍然重要
        - 仓位大小应按高不确定性处理
      - - 估值立场
        - 激进叙事估值缺乏支撑
        - 留存公开来源没有直接验证去风险后的独角兽估值锚点
        - 使用情景区间，并在价格上强硬谈判
      - - 支持继续关注的因素
        - 真实现场证明和清晰切入口
        - Qianhai、Wantian 以及服务业 / 公共部门契合度，让它不只是一个演示故事
        - 应做更深尽调，而不是本能放弃
      - - 阻碍买入的因素
        - 没有经审计经济性，也没有经验证的后期估值
        - 公开记录没有显示收入质量、毛利质量或稀释结构
        - 不为隐藏证据付费
    notes: 这张表刻意保持价格敏感：它把公司潜力和当前公开证据能支撑的估值拆开。
