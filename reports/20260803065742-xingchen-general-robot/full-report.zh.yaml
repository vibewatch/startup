  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险结论与优先级
        blocks:
          - type: paragraph
            body: >-
              Xingchen 的风险画像应排为高残余执行风险，而不是非黑即白的红旗。公司已经从纯概念跨到真实世界证明：Qianhai 是真实的，Wantian
              是真实的，官方产品表面也足够连贯，能证明商业化尝试确实在推进。但在此之外，投资人想看到的几乎每一层去风险证据，在公开材料里都还很薄：经审计财务、单位经济模型、客户持续性、制造产能、安全文档和国际合规准备基本没有披露。结果是一组很不对称的风险栈。公司如果专注在中国境内的服务和公共部门场景，仍然可能跑通；但证明基础太小，每一次可见成败都会放大传导到融资、声誉和后续客户转化。尽调里最重要的判断是，这些风险可监控，不是不可知的谜。投资逻辑会断裂，不是因为市场小，而是因为当前公开证据还不够深，承受不了运营挫折。
