    summary: Xingchen 当前最强场景可能如何从场馆需求走到机器人服务执行。
    approximationNotes: 流程综合官网场景标签和公共服务报道，有证据支撑，但不是已披露 SOP。
    data:
      nodes:
        - id: w1
          label: 场地识别重复性访客服务需求
          detail: 场馆、酒店、博物馆、办公或公共服务运营方需要交互和导览能力。
          tone: neutral
        - id: w2
          label: 机器人进入面向人的环境
          detail: SR-1 或类似本体部署在室内场景，轮子和手臂能安全运行。
          tone: neutral
        - id: w3
          label: 感知 + 对话 + 导航协同运行
          detail: 机器人必须感知人群、理解请求、在空间中移动，并维持交互流程。
          tone: positive
        - id: w4
          label: 人工监督或场地集成处理边缘情况
          detail: 公开来源未披露自主能力边界，因此兜底流程仍是待尽调问题。
          tone: warning
        - id: w5
          label: 现场数据反哺迭代或更大范围铺开
          detail: 成功用例可沉淀为标杆部署和未来训练数据。
          tone: positive
      edges:
        - from: w1
          to: w2
          label: 形成部署决策
        - from: w2
          to: w3
          label: 支撑服务任务
        - from: w3
          to: w4
          label: 边界场景需要护栏
        - from: w4
          to: w5
          label: 运营经验反哺迭代
    claimRefs:
      - CE003
      - CE008
      - CE017
      - CE028
  - id: FE003
    title: 关键依赖地图
    type: dag
    layout: wide
    summary: Xingchen 的产品承诺靠硬件、算力、数据、集成和人才几层撑住；公开披露只覆盖其中一部分。
    data:
      nodes:
        - label: Xingchen 具身 AI 平台
          detail: 机器人本体与大脑 / 控制一体化的商业化栈。
        - label: 传感器 + 感知硬件
          detail: 导航、交互、操作都需要摄像头与融合栈支撑。
        - label: 算力 + 模型基础设施
          detail: 具身 AI 要跑模型训练、推理和迭代资源。
        - label: 执行器 + 运动硬件
          detail: 双臂操作和移动作业靠耐用的机械执行落地。
        - label: 集成伙伴 / 部署场地
          detail: 真实场景和交易对手同时提供用例与数据。
        - label: 工程人才管线
          detail: 招聘和领导层厚度仍是关键运营依赖。
        - label: 评测 / 安全机制
          detail: 延迟、在线率和人工介入证据决定信任。
      edges:
        - from: Xingchen embodied-AI platform
          to: Sensors + perception hardware
          label: 需要校准感知栈
        - from: Xingchen embodied-AI platform
          to: Compute + model infrastructure
          label: 需要训练 + 推理资源
        - from: Xingchen embodied-AI platform
          to: Actuators + motion hardware
          label: 需要可靠物理执行
        - from: Xingchen embodied-AI platform
          to: Integration partners / deployment sites
          label: 需要真实场景与场景入口
        - from: Xingchen embodied-AI platform
          to: Engineering talent pipeline
          label: 需要稀缺机器人技术人才
        - from: Xingchen embodied-AI platform
          to: Evaluation / safety discipline
          label: 需要信任与安全证据
    claimRefs:
