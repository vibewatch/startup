      - number: '5.2'
        title: 架构与控制栈
        blocks:
          - type: paragraph
            body: >-
              解读 Xingchen 架构，最可防守的方式是把它看作分层具身 AI 栈，而不是单体“智能机器人”主张。官方和融资材料反复提到 Xingchen Brain、Xingchen
              Control、多传感器融合、导航、感知和运动控制。这个模式与 EETimes、QubitTool、Google DeepMind 和 NVIDIA 总结的 2026 年具身 AI
              架构常态相符：感知和状态估计喂给更高层的推理或任务层，后者再协调低延迟控制和执行回路。公开证据不能证明 Xingchen 实现了与 Figure、Agility 或 DeepMind
              支持系统完全相同的栈，但强烈暗示高层认知与底层执行之间有类似拆分。公司自己关于多模态大模型、世界模型和精密运动控制的措辞，也支持这个解读。局限不只是营销层面，而是方法论层面。Xingchen
              没有公布模型尺寸、推理延迟、遥操作边界、sim-to-real 管线细节或基准结果。因此，架构图景可以理解，但技术优势程度仍未核验。
