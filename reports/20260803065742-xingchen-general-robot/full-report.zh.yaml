      - number: '7.2'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              2026
              年，监管风险栈明显加厚。中国新的产业和供应链安全规则给跨国公司带来直接的法律冲突风险，因为常规去风险、信息收集或贸易合规动作，都可能被放进中国反制措施的视角来解释。同时，外部环境变得更硬，而不是更容易。美国关税层仍然显著抬高中国产机器人的落地成本；拟议的
              GUARD Act 及相邻采购安全审查也显示，中国具身 AI 硬件的市场准入窗口可能收窄得很快。欧洲不是干净的替代出口。如果具身 AI 系统在欧洲进入受监管或近人场景，AI Act
              会提高文档、监督和网络安全预期，即便供应商来自第三国。最后，中国自身的 HEIS 2026 标准化工作对国内产业有战略正面意义，但也抬高了小公司合规负担。落到
              Xingchen，实际信号很简单：监管不再是遥远的规模化问题。它已经是市场进入和合作伙伴风险的一部分。
