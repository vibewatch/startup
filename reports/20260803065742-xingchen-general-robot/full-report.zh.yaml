      - number: '8.3'
        title: 可比公司组与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比公司组主要适合作边界地图。Figure 官方 $39B 投后估值最好理解为由极端资本形成和雄心推动的行业离群点，而不是具身 AI 创业公司的通用成交价。Apptronik 2026 年融资和据报道 $5B
              估值说明，即便有战略客户、Google 关系和更成熟的生产叙事，估值仍可显著低于 Figure。Unitree 的 IPO 背景对中国尤其重要，因为它把高公众价值与出货规模和盈利能力绑在一起。UBTECH
              的上市公司披露又给出关键教训：即便收入很大，机器人经济性仍可能亏损。Agility
              的公开市场测试有价值，因为它暗示，公开资本给已部署人形机器人证明的定价，可能比最亢奋的私募轮更保守。合起来看，这些可比样本指向一个简单结论：Xingchen
              明显早于每一个参考点。因此，本章情景区间只是说明性和有条件的，不是说公司今天就配得上同业式估值。
