  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先权栈
        - 最新股权结构表、优先权、认股权证和清算分配顺序
        - 需要用它把企业价值转换成股权回报
        - 索取 CFO / 董事会批准的融资资料包
      - - 当前现金和跑道
        - 现金余额、月度烧钱、融资计划和营运资金桥接
        - 决定下一轮融资紧迫度和议价能力
        - 索取月度现金桥表和 12 个月计划
      - - 客户经济性
        - 合同金额、机器人数量、付款条款、上线状态和续约行为
        - 把验证样本转成收入质量判断
        - 索取逐客户合同摘要
      - - 部署规模
        - 装机基数、活跃站点、正常运行时间和支持人员配置
        - 用来判断公开样本是代表性案例还是特殊案例
        - 索取机队看板和运营 KPI
      - - 单机经济性
        - 按产品拆分 BOM、ASP、服务附加率、毛利率和保修负担
        - 估值质量的核心变量
        - 索取产品级 P&L 或单机经济性备忘录
      - - 天使轮后融资背景
        - 具体条款、投资方和后续轮次文件
        - 判断后续高估值叙事是否真实
        - 索取董事会纪要或已签署融资文件
    notes: 前四项索取材料能基本补上“可跟踪选项”与“可投资估值判断”之间的主要缺口。
    claimRefs:
      - CV030
      - CV031
      - CV038
      - CV039
