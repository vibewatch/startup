      - number: '1.3'
        title: 资本与商业化
        blocks:
          - type: paragraph
            body: >-
              本轮审阅的公开来源中，最干净的融资证据不是 2026 年独角兽式成长轮，而是 2025 年天使融资。CNR、Sina、AI云资讯、Cnfol 等多家中文媒体转载称，Xingchen 于 2025 年 9
              月完成数千万元人民币天使轮，并在 10 月 28 日宣布，投资方为 Xiangjiang New District 国资和 Hunan Haichuang。这组报道也指向资金用途：迭代 Xingchen
              Brain 和 Xingchen Control，推进轮式双臂人形机器人量产，并在新服务、新零售和数据采集场景中加深商业化。同一组文章称公司与 China Resources Digital、Haier
              Smart Home 和 DragonPass 开展战略合作；这能帮助勾勒伙伴地图，但这些文章没有把合作关系转化为审计收入。最重要的是负面判断：尽管用户种子背景提到后期融资，本轮审阅的公开页面没有浮现可直接核验的
              2026 年 6 月 Series B 公告，也没有可防守的 >RMB10B 估值披露，因此后续章节应把这条标题当作未核验信息，而不是可复用的事实基础。
