  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              今天，Xingchen 最有支撑的建议是观察 / 继续研究，而不是买入。正向逻辑确实存在：公司有连贯的具身 AI 产品叙事，有可直接复核的 Qianhai 现场证明，有具名 Wantian 框架，还有一条服务 /
              公共部门切入口，看起来比纯概念视频机器人更具体。这些都是实质正面因素，足以避免直接否定。但反向逻辑对估值更关键。公开材料仍未显示经审计收入、毛利率、现金、烧钱速度、复购经济性，或可直接复核的后期融资锚点。这意味着投资人真正面对的选择，不是公司质量好坏，而是可见战略期权价值和不可见经济质量之间的取舍。因此，正确的承保姿态必须对证据和价格都敏感。如果商业证明扩宽，Xingchen
              可能很快变得更有意思；但今天的公开记录仍只支持把它作为观察期权，而不是高确信多头。
