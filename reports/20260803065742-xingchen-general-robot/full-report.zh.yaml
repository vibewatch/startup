      - number: '2.4'
        title: 驱动与约束：政策和供应链顺风真实存在，但 ROI 和地缘政治仍会卡住市场
        blocks:
          - type: paragraph
            body: >-
              2026 年的中国环境对具身机器人创业公司异常友好。HEIS 2026 标准体系、MIIT/SASAC 真实场景计划、密集制造供应链和激进投资兴趣，都支持更快迭代和更多测试场景。市场评论还指向零部件、EV
              邻近制造和国内部署意愿上的规模优势。但同一组来源也说明，市场并非无摩擦。控制、sim-to-real 和具身 AI 工程人才昂贵且稀缺。WAIC
              与行业报告越来越强调持续运行和工作流价值，而不是运动演示；弱产品会被真实部署筛掉，而不是被大会关注度筛掉。西方采购审查和供应链限制可能压缩中国供应商的海外 TAM。炒作风险也仍然显著：多篇 2026
              年文章明确追问 IPO 和估值叙事是否跑在经营现实前面。对 Xingchen 来说，实际含义是政策顺风能打开门，但只有可重复的场景经济性和可支撑的可靠性，才能把机会变成持久市场位置。
