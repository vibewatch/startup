              DragonPass——它们可能代表商业渠道、解决方案协作者或未来客户，但还没有被公开记录为规模化上线部署。第三类是官网场景文案暗示的场馆服务用户，例如展馆、酒店、博物馆、办公室和展厅。第四类是地方政府和城市治理项目；具身
              AI
              部署往往从政策、可见度和试验意愿交汇处开始，这类项目因此重要。这种分层对尽调重要，因为付款方、使用方和战略价值在各组之间并不相同。公共试点作为验证和数据可能极具价值，但作为经常性收入证据仍可能偏弱。今天，最强公开证据落在高可见、早期商业化分层，而不是庞大、多元化的企业客户群。
