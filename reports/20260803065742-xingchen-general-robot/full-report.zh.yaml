      - number: '8.4'
        title: 下行触发、稀释与退出背景
        blocks:
          - type: paragraph
            body: >-
              这里的下行分析比上行叙事更重要，因为公开证据基础仍然薄。主要负面触发点很直接：无法融到后续资金、不能把狭窄证明基础转化为更多付费部署，或旗舰环境里出现可见安全 /
              可靠性问题。任何一项都会实质削弱故事，因为当前客户证明集中，财务不透明度高。地缘政治折价又加一层。若关税、采购规则或安全叙事收紧，中国具身 AI 公司可能很快失去海外 TAM
              或合作伙伴可选项。稀释和优先权风险也被低估。公开来源没有披露优先股堆叠或清算保护，因此即使表面企业价值看起来合理，也未必能转化为有吸引力的普通股回报。退出方面，从当前证据集看，最可能路径更偏国内、更偏后期，而不是全球化、近期高溢价退出。因此，投资人应少把
              Xingchen 看作即将高溢价退出的候选公司，而应把它看作一家仍需跨过多个证明里程碑、退出质量才会明显改善的公司。
