      - number: '1.2'
        title: 领导层与组织
        blocks:
          - type: paragraph
            body: >-
              领导层证据异常创始人中心化，正式治理披露仍不完整。2025 年融资文章一致把 Zhang Chengwen 称为 CEO 和商业化侧负责人，同时将 USTC 博士 Liu Jinsu
              列为创始技术核心之一。2026 年 3 月 Tencent 文章给出更重要的组织拐点：时任 SUSTech Robotics Institute 副院长的 Kong He 加入，担任联合创始人兼联席
              CTO，聚焦感知和控制。官网与招聘文案还突出 USTC 和 SUSTech 博士团队，以及“全球技术领军者 + 产品工程团队 + 商业化
              CEO”的三角结构；合在一起，画面是一家试图把学术深度、产品化和渠道执行拼起来的创业公司。缺失的部分同样重要：已审阅公开来源没有提供公开董事会名单、优先权堆栈，或清晰披露的 CFO / COO
              层。因此，关键人依赖仍高，公司正式控制结构还是尽调缺口，而不是已验证的优势。
