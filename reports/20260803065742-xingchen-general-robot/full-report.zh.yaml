      - number: '1.5'
        title: 负面背景与身份风险
        blocks:
          - type: paragraph
            body: >-
              本章主要负面结论不是已证实丑闻，而是炒作式叙事与已审阅一手、二手来源实际披露之间的错位。IEEE、FDD 和 ETC Journal
              的行业政策与安全报道显示，中国轮式和人形机器人在美国面临上升的出口管制和采购审查，在西方也卷入更广泛的国家安全讨论。任何希望进入敏感海外环境的中国具身 AI
              公司都要面对这些真实外部风险。对尽调更关键的是，Xingchen 自己的公开足迹仍像一家年轻创业公司：Shenzhen / Hunan 实体信号混杂，披露组合集中在 2025 年天使轮、招聘页定位，以及试点 /
              合作证据，而不是审计经济性。这不等于公司质量低；它意味着，在可直接审阅的融资公告、正式客户披露或监管文件补上缺口之前，投资人不应把传闻或种子背景里的后期假设带入后续分析。
