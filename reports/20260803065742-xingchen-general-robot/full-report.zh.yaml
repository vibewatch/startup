      - number: '7.5'
        title: 监测、终止标准与下一步尽调路径
        blocks:
          - type: paragraph
            body: >-
              Xingchen 这组风险的优点是，少数具体尽调问题就能降低它们，不需要抽象的行业乐观。投资人不需要每个变量都完全确定；他们需要证据证明当前狭窄的证明基础能经受压力。最高优先级问题包括 Wantian
              和其他具名交易对手的合同摘要、车队级部署数据、当前现金和现金跑道、供应商集中度与芯片依赖，以及一份安全 /
              事故包，说明机器人在现场失效时会发生什么。这些问题直接连到终止标准。安全事故、小规模客户证明集明显丢失、无法融到后续资金，或持续无法走出展示式部署，都会实质削弱投资逻辑。反过来，即便只是复购、更深产品文档或多站点铺开的适度证据，也会快速降低残余风险，因为当前公开记录起点很低。因此，今天正确的姿态是高频监测、证据驱动的尽调，而不是一概乐观或反射性否定。
