      - number: '5.4'
        title: 差异化与依赖
        blocks:
          - type: paragraph
            body: >-
              公司最清晰的差异化主张是架构复用：一个大脑，多种本体。如果属实，这可能降低模型训练重复、加快场景适配，并帮助公司把工程投入摊到多种硬件形态上。但差异化技术只有在依赖链可管理时才有价值。本章主要发现是，Xingchen
              看起来依赖塑造整个行业的同一批硬件环节：传感器、算力、执行器、数据采集、仿真或边缘部署工具、集成伙伴，以及稀缺机器人技术人才。2026 年基准环境强化了这一点。NVIDIA 的 GR00T
              把数据、模型、仿真、中间件和部署硬件定位为一套开发栈；DeepMind 的 Gemini Robotics 把泛化、交互和灵巧性明确列为基准轴；Unitree 发布异常透明的规格和开放接口；Agility
              则显示，工作流软件和支持也是产品的一部分，不只是机器人本体。在这个背景下，Xingchen 的差异化主张可信，但依赖真实存在，而且仍只披露了一部分。
