      - number: '1.4'
        title: 部署信号与待解缺口
        blocks:
          - type: paragraph
            body: >-
              商业信号存在，但更接近早期部署验证，而不是成熟规模披露。2026 年 7 月，NewTimeSpace 和 FilingReader 报道 China Wantian 旗下深圳 AI 子公司与 Hunan
              Xingchen General Robot 签署战略合作框架协议，覆盖具身 AI 产品、城市治理、公共服务、智慧政务和开放场景中心。2026 年 3 月 eWeek 和 Shenzhen Daily
              的公共服务报道给出另一个可见验证点：本地公司开发的机器人在 Qianhai Stone Park
              机器人志愿者站运营，公开服务清单远不止迎宾，还包括日常咨询、政策讲解、巡逻提醒、应急支持和娱乐。更广泛的市场来源强化了背景，但不能证明 Xingchen 的相对领先：WAIC 2026
              报道、Sourcebotics、TrendForce 和政策评论都显示，中国具身 AI 市场正快速扩张，Unitree、AgiBot 等更大同行领先。于是 Xingchen
              有一个可信的早期故事——产品、伙伴、试点和政策契合——但仍缺少公开收入、客户数量、融资总额或员工规模证据，无法按后期品类赢家来承保。
