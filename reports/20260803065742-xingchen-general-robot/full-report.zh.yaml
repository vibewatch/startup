      - number: '8.5'
        title: 最终尽调问题与估值结论
        blocks:
          - type: paragraph
            body: >-
              最终尽调问题并不复杂。投资人需要股权结构表、当前现金和现金跑道、逐客户合同明细、付费与试点部署数量，以及产品级单位经济模型。这些材料能快速回答本章最大的多数不确定性。同样重要的是，它们会判断公司可见的公共服务证明，到底是在复利成一个可持续商业系统，还是只是在生成有战略价值的参考案例。这个区别决定结论。Xingchen
              看起来像一个可信的早期商业化期权，有一些真实场景牵引；它不像纯纸面创业公司。但同一份公开记录仍不支持按广泛去风险已经完成来付价。正确姿态是把公司留在漏斗里，压力测试隐藏经济性，并坚持价格和尽调纪律。如果这些问题反馈强，投资逻辑可以上调。在此之前，观察仍是公开证据能支撑的最高置信判断。
