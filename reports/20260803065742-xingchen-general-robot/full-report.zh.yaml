  - id: TV005
    title: 论点破裂和否决触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 融资失败
        - 商业化持续烧钱，但没有可信后续资本
        - 削弱生存能力和谈判筹码
        - 按悲观情景重定估值，或退出
      - - 证明无法扩宽
        - 当前证明范围之外没有新增有意义付费部署
        - 论点仍过于集中且脆弱
        - 保持跟踪或下调
      - - 可见现场失败
        - 旗舰站点出现公开安全或可靠性问题
        - 损害客户信任，并提高尽调负担
        - 暂停承销，直到根因厘清
      - - 股权结构下行比预期更差
        - 激进优先权或清算栈浮出水面
        - 即便企业价值公允，普通股上行也会被压缩
        - 要求价格折扣或保护条款
      - - 地缘政治收紧
        - 目标出口市场出现重大新关税、采购或安全壁垒
        - 削弱 TAM 和倍数支撑
        - 削减国际上行假设
      - - 单位经济性令人失望
        - 硬件加服务经济性被证明偏弱或依赖补贴
        - 打断通向有吸引力规模的路径
        - 仅按期权价值重估
    notes: 这些触发项可在两轮之间监测，并直接连到情景下调。
