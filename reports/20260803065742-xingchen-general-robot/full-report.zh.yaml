  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              可取得的公开记录把 Xingchen General Robot 呈现为一家很年轻的具身 AI 机器人公司；公司自己的材料强调务实商业化，而不是研究实验室式表演。官网包显示公司成立于 2024 年 7
              月，把具身智能全栈技术和机器人硬件平台研发列为核心，并围绕服务工业、商业和家庭场景的“一脑多体”生态来定义业务。招聘页进一步强化这个定位：公司强调快速商业化、多传感器融合、导航、运动控制能力，以及商业化优先的运营模型。官方产品呈现也窄但具体：SR-1
              已上线，HR-1 和 BOT-1 标注为待发布，首页文案把 SR-1 描述为轮式双臂机器人，定位为商业化专家。这组信息重要，因为它比泛泛的“具身
              AI”品牌更具体，但距离投资人期待的、清晰后期机器人龙头披露画像仍明显更早。
