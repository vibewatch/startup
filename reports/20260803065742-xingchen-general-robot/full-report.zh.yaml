  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：具身服务与通用机器人工作流，而不是全部自动化
        blocks:
          - type: paragraph
            body: >-
              应把 Xingchen
              放在具身智能和通用机器人市场里分析，但相关支出边界比“全部机器人”或“全部自动化”更窄。公司自己的公开呈现聚焦轮式双臂机器人、“一脑多体”栈，以及展览导览、酒店接待、博物馆、办公室和展厅等室内服务 /
              商业场景。融资报道把图景扩展到新服务、新零售、数据采集以及一些工业 / 家庭表述，Wantian 协议则推向城市治理和公共服务。因此，应纳入的支出包括面向这些服务和半通用场景的机器人硬件、机载感知与控制、具身
              AI 软件、部署集成、维护和工作流适配。应排除的是整个固定自动化宇宙：经典工业机械臂、AMR、纯软件 AI，以及 Xingchen
              尚未公开证明能够拿下的工厂自动化预算。这个边界重要，因为一家只有一个公开上线产品、客户证据披露薄弱的创业公司，不应默认继承中国机器人全口径 TAM。
