      - number: '8.2'
        title: 融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              估值问题先从融资记录本身开始。在保留下来的开源资料里，支撑最强的 Xingchen 融资事实仍是 2025 年天使轮。这有意义，但单靠它不足以锚定成熟私有公司估值。本轮使用的公开资料仍没有直接验证后续 2026
              年 Series B，或确定性的 >RMB10B
              估值。这个缺口不证明公司弱；它证明公开市场投资人和尽调团队不应把未经复核的叙事估值当成既定事实。在这种背景下，进入纪律比行业兴奋更重要。传统倍数分析没有用，因为收入、利润率和留存都未披露。更合适的是情景法：问现在有哪些证明，哪些新增里程碑足以支撑更高估值带，哪些证据会迫使折价。没有这套纪律，投资人就可能把后期独角兽逻辑套到一个仍在早期商业化、关键经济指标大多不公开的故事上。
