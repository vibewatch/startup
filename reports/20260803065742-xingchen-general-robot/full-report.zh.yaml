      - number: '7.3'
        title: 运营、商业与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Xingchen 仍像一家年轻机器人公司，正在从演示走向可重复。产品表面显示一个已上线标签和多个待上线界面，这是正常创业公司状态；但在具身 AI
              里风险更高，因为硬件、软件和现场支持必须一起成熟。客户证明仍然狭窄，同一组 Qianhai / Wantian
              证据既证明公司真实存在，也证明公司还很早。公开来源没有展示制造产能、车队可靠性、故障率、召回流程或广泛现场运营，也没有给出判断早期部署到底有商业吸引力还是战略性补贴所需的财务数据。这一点重要，因为周边市场竞争只会加剧。Unitree
              和 UBTECH 正在用规模、披露或成本设定节奏；NVIDIA、DeepMind 等平台玩家也在抬高市场对软件栈成熟度的预期。在这种背景下，Xingchen
              的主要运营风险不是缺少想法，而是资本密集迭代、现场支持和价格压力，可能跑在公司可见的可重复性证明前面。
