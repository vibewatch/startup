      - number: '2.2'
        title: 用多重口径看市场规模，而不是只看一个 TAM 标题
        blocks:
          - type: paragraph
            body: >-
              公开市场数据同时支持两个事实：中国具身 AI 和人形机器人市场扩张极快，而当前已经变现的切片仍远小于未来叙事标题。Sourcebotics 估计 2026 年中国人形机器人市场约为 $1.3B，全球装机量逾
              80% 集中在中国。Robotics Center of Silicon Valley 将 2026 年更广义中国机器人市场规模放在 $14.2B，同比增长 47%；Faxiangongchang 则把 2026
              年定义为真正的人形机器人量产元年，此前到 2025 年底全球出货约 17,000 台。TrendForce 增加了产出口径：中国人形机器人产量 2026 年可能增长 94%，由 Unitree、AgiBot
              等更大玩家带动。对 Xingchen 来说，可投资结论不是每一美元都可触达；而是行业顺风真实存在，但公司近期 SAM 很可能落在公共服务、企业服务和试点部署预算的较窄子集里，而不是全国机器人总支出。
