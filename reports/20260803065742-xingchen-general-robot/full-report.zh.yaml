            body: >-
              Xingchen 的公开呈现描述的是一个产品家族，而不是单一机器人 demo。官网包露出三个品牌节点——SR-1 已上线、HR-1 待发布、BOT-1
              待发布——并反复围绕“一脑多体”架构定义业务。这很重要，因为公司不只是声称要做一台轮式服务机器人；它声称有一层可复用智能，能迁移到多个本体和场景。当前最具体的本体是
              SR-1，官网称其为轮式双臂机器人和商业化导向产品。融资和领导层报道补充了更多背景，把 Xingchen Brain 描述为多模态、类似世界模型的推理核心，把 Xingchen Control
              描述为运动控制层。由此浮现的实际产品定义，是一个服务导向的具身 AI 系统，结合移动操作、交互和场景部署服务。不过，这仍是一个披露不完整的产品家族。HR-1 和 BOT-1
              只以占位符形式可见；审阅来源仍没有为任何产品提供干净的公开规格表或运行边界。因此，模块故事方向上很强，但产品线成熟度不均。
