            body: >-
              更广泛的商业化路径看起来由伙伴牵头、由场景驱动。2025 年融资文章族反复点名 China Resources Digital、Haier Smart Home 和 DragonPass
              为战略伙伴，Wantian 框架则指向更结构化的政府和城市服务项目入口。对年轻机器人公司来说，这种模式在经济上说得通：Xingchen
              不必为每个垂直行业建立昂贵直销组织，而是可以借助国资关联资本、地方渠道或既有企业伙伴进入真实环境。但伙伴牵头模型也让尽调更复杂。公开材料没有说明这些关系是试点、渠道协议、研发合作，还是产生收入的部署。HKEX
              文件尤其重要，因为它明确列出产品供应、技术合作、应用场景落地和政府项目合作等未来路径；但文件也说，该框架本身不产生实质性权利或义务。换句话说，伙伴宽度可见，但合同深度和转化仍未解决。
