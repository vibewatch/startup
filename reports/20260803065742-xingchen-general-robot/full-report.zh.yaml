      - number: '7.4'
        title: 合作伙伴、依赖与人员风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险对 Xingchen 异常重要，因为公司当前公开叙事靠合作伙伴、平台生态和一组很小的可见领导班子搭起来。Wantian
              框架有战略价值，但也凸显渠道风险：场景入口经过少数把门人时，商业上行和商业脆弱性会一起上升。同样的逻辑也适用于国资关联渠道、关键客户、上游零部件供应商以及软件 /
              算力技术栈。政策情绪、合作伙伴激励、采购流程或平台访问一旦变化，影响的可能不只是一张订单，还会影响外界对 Xingchen
              是否在走向规模的整体判断。人员风险进一步放大这种敞口。公开材料强调创始人故事、若干领导层补强和招聘动能，但尚未披露深厚运营梯队或成熟制造 /
              治理体系。这不意味着团队弱，而是关键人和组织扩张风险仍然缺少文档。在耗资本的市场里，这一点重要，因为部署数量开始上升后，执行深度往往比产品叙事更关键。
