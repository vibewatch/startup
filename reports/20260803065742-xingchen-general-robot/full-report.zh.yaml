        title: 收入模型与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              审阅公开来源指向的变现模型，更接近硬件加解决方案交付，而不是纯软件。官网包、招聘文案和融资报道都强调具身智能全栈研发、“一脑多体”架构、轮式双臂机器人，以及在新服务、新零售、数据采集和公共服务场景里的商业化。2025
              年 10 月融资文章尤其有信息量，因为管理层把业务描述成不止卖一个机器人本体：Zhang Chengwen 明确称 Xingchen
              提供可复制的智能服务解决方案，覆盖场景发现、产品定义、渠道建设和服务交付。这暗示三层可能收入：初始机器人销售，与特定场景绑定的集成或部署收入，以及如果 Xingchen Brain 和 Xingchen
              Control 栈能跨形态复用，长期形成的软件 / 控制层收入。缺失的是实际商业机制。没有审阅来源发布 SR-1 标价、租赁条款、维护合同、附着率，或一次性硬件收入与经常性软件 /
              服务收入之间的区别。在这些细节披露前，应把公司建模为早期硬件中心的解决方案供应商，带有未来软件杠杆选项，而不是已证明的经常性收入平台。
