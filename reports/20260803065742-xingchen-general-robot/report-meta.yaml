companyProfile:
  summary: 'Xingchen General Robot is a young Chinese embodied-AI robotics company whose official materials position it around a one-brain-multi-body architecture spanning industrial, commercial, and household scenarios. The clearest public product surface today is SR-1, a wheeled dual-arm robot, while HR-1 and BOT-1 remain pending on the company''s official site. Public evidence shows early but real commercialization effort through the Qianhai robot volunteer deployment and a Wantian framework covering city-governance and public-service scenarios. Financial disclosure remains sparse: the strongest verified financing fact is a RMB30 million angel round announced in late 2025, while audited revenue, cash, gross margin, and a later-stage public valuation anchor were not directly verified in the retained open-source set.'
