chapter:
  number: 3
  title: Competitors
  summary: Xingchen competes in a crowded embodied-AI field where larger peers already disclose more on pricing, industrial workflow proof, or capital depth. Public evidence suggests Xingchen is earlier and narrower than Unitree, UBTECH, Figure, or Agility on product and deployment disclosure, while Fourier and other Chinese peers raise the bar on dexterity and technical narrative.
sections:
- id: competitive-set
  title: 'Competitive set: direct humanoid peers, industrial incumbents, and status-quo substitutes'
  body: 'Xingchen is not competing in a blank market. The relevant peer group includes Chinese humanoid and embodied-AI players such as Unitree, UBTECH, and Fourier, plus Western industrial humanoid platforms such as Agility and Figure. Public sources make clear that these companies are not solving exactly the same problem, but they do compete for investor attention, partner mindshare, technical talent, and a growing pool of embodied-robot budgets. Unitree sets the low-cost and price-transparency benchmark, UBTECH emphasizes industrial humanoids with high-profile factory training and a deep corporate history, Figure pairs a general-purpose AI narrative with outsized capital and BMW proof, and Agility emphasizes workflow automation and cloud controls rather than broad consumer mystique. Xingchen’s current public surface, by contrast, remains narrower: one live public robot label, a service/public-sector scenario bias, and far thinner disclosure on deployments, workflow software, and scaling
    economics. That does not make the company irrelevant; it means the competitive bar is already set by peers with more public proof.'
  claimRefs:
