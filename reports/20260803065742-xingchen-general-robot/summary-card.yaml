  topStrengths:
    - >-
      Official materials and third-party reporting support a coherent embodied-AI product thesis rather than a pure
      concept narrative.
    - >-
      Qianhai and Wantian provide directly reviewable early commercialization proof in public-service and
      city-governance scenarios.
    - The company appears aligned with policy-favored Chinese robotics themes and state-linked local capital networks.
    - >-
      A service and public-sector wedge may offer a more realistic entry path than competing head-on in heavy industrial
      humanoids immediately.
    - >-
      The company is still early enough that incremental proof could re-rate the story quickly if customer economics
      improve.
  topRisks:
    - >-
      Public commercialization proof is narrow and concentrated in a very small number of visible deployments or
      framework relationships.
    - >-
      Audited revenue, gross margin, cash, burn, and cap-table details are not publicly disclosed in the retained source
      set.
    - >-
      Larger peers such as Unitree, UBTECH, Figure, Apptronik, and Agility already set a much higher bar on capital
      depth, scale, or disclosure.
    - >-
      China-specific policy, export, tariff, and procurement scrutiny can narrow foreign TAM and complicate
      partnerships.
    - >-
      Any investor underwriting a high implied valuation without direct company materials is relying on hidden evidence
      rather than retained public proof.
  unresolvedGaps:
    - Direct proof of any later 2026 financing round, valuation, and full investor roster.
    - Current cash runway, burn, working-capital posture, and dilution / liquidation structure.
    - Customer-by-customer contract economics, paid-versus-pilot classification, and renewal behavior.
    - Product-level unit economics, reliability, support burden, and manufacturing readiness metrics.
    - Formal safety, compliance, and incident-response documentation for real-world deployments.
