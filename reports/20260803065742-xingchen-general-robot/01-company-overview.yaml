  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters and legal-entity status
    missingEvidence: A single directly reviewable official page that clearly states the current headquarters city, operating base, and relationship between Shenzhen and Hunan entities.
    whyItMatters: Location affects subsidy attribution, hiring, tax, and which local government or investor relationships matter most.
    diligencePath: Request the latest legal-entity chart, registered addresses, and management explanation of any Shenzhen-to-Hunan migration.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue headcount customer-count disclosure
    missingEvidence: Audited revenue, current employee count, customer count, and shipment-to-revenue bridge.
    whyItMatters: Later financial and valuation chapters cannot be responsibly underwritten from pilot headlines alone.
    diligencePath: Request management accounts, payroll counts, active-customer lists, and cohort-level deployment metrics.
    relatedQuestionRefs:
    - QO014
    - QO016
    - QO025
  - type: conflicting-data
    severity: blocking
    topic: 2026 financing stage and valuation
    missingEvidence: A directly reviewable financing announcement, term sheet, or investor page confirming whether a June 2026 Series B and >RMB10B valuation actually occurred.
    whyItMatters: The user seed context implies a late-stage company, but the reviewed open source set in this run mainly supports a 2025 angel-round narrative.
    diligencePath: Request signed financing materials, investor confirmation, or an official company / investor announcement with round size, date, and post-money valuation.
