- id: leadership-and-organization
  title: Leadership and organization
  body: 'Leadership evidence is unusually founder-centric and still incomplete on formal governance. The 2025 financing articles consistently identify Zhang Chengwen as CEO and as the commercialization-side leader, while also naming USTC PhD Liu Jinsu as part of the founding technical core. The March 2026 Tencent article adds a more important organizational inflection: Kong He, then vice dean of the SUSTech Robotics Institute, joined as co-founder and co-CTO focused on perception and control. Taken together with official-site and recruitment copy that highlights USTC and SUSTech doctoral teams plus a “global technical leader + product-engineering team + commercialization CEO” triangle, the picture is of a startup trying to combine academic depth with productization and channel execution. What remains absent is equally important: reviewed open sources did not provide a public board roster, preference stack, or a clearly disclosed CFO / COO layer. That means key-person dependence remains high
    and the company’s formal control structure is still a diligence gap rather than a verified strength.'
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  - CO030
  - CO033
  tableRefs:
  - TO002
  figureRefs: []
- id: capital-and-commercialization
  title: Capital and commercialization
  body: 'The cleanest financing evidence available in reviewed open sources is not a 2026 unicorn-style growth round but a 2025 angel financing. Multiple Chinese media reprints — including CNR, Sina, AI云资讯, and Cnfol — report that Xingchen completed a multi-ten-million-RMB angel round in September 2025 and announced it on October 28, with investors Xiangjiang New District state-owned capital and Hunan Haichuang. Those stories also converge on how the money was meant to be used: iterate Xingchen Brain and Xingchen Control, push wheeled dual-arm humanoid mass production, and deepen commercialization in new service, new retail, and data-collection scenarios. The same article family claims strategic cooperation with China Resources Digital, Haier Smart Home, and DragonPass, which is useful as a partner map even though those articles do not translate partnerships into audited revenue. The most important judgment is negative: despite the user seed context, reviewed open pages in this run did not
    surface a direct public June 2026 Series B announcement or a defensible >RMB10B valuation disclosure, so later chapters should treat that headline as unverified rather than as reusable ground truth.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO016
  - CO017
  - CO031
  - CO032
  - CO040
  tableRefs:
  - TO003
  figureRefs:
  - FO001
- id: deployment-signals-and-open-gaps
  title: Deployment signals and open gaps
  body: 'Commercial signal exists, but it is still closer to early deployment proof than to mature scale disclosure. In July 2026, NewTimeSpace and FilingReader reported a strategic cooperation framework agreement between China Wantian’s Shenzhen AI subsidiary and Hunan Xingchen General Robot covering embodied-AI products, urban governance, public services, smart government affairs, and open-scene centers. March 2026 public-service reporting from eWeek and Shenzhen Daily adds another visible proof point: robots developed by local companies were operating at Qianhai Stone Park’s robot volunteer station, where the published service list extended well beyond greetings into daily consultation, policy explanation, patrol reminders, emergency support, and entertainment. Broader market sources reinforce the context but not Xingchen’s relative leadership: WAIC 2026 reporting, Sourcebotics, TrendForce, and policy commentary all show a fast-scaling Chinese embodied-AI market led by larger peers such
    as Unitree and AgiBot. That leaves Xingchen with a credible early story — product, partner, pilot, and policy fit — but still without the public revenue, customer count, total raised, or headcount evidence needed to underwrite it like a late-stage category winner.'
