company:
  name: Xingchen General Robot
chapter:
  number: 1
  title: Company Overview
  summary: Public evidence from the company website, 2025 financing coverage, 2026 leadership coverage, and 2026 deployment news paints Xingchen General Robot as a young embodied-AI startup rather than a fully disclosed late-stage unicorn. The strongest verified facts are a July 2024 founding, a one-brain-multi-body product strategy, a 2025 angel round backed by Hunan state-linked capital, a 2026 co-CTO hire from SUSTech, and early public-service / strategic-partner deployment signals; the biggest unresolved issue is that reviewed open sources did not corroborate a public June 2026 Series B or a >RMB10B valuation.
sections:
- id: identity-and-positioning
  title: Identity and positioning
  body: 'The accessible public record presents Xingchen General Robot as a very young embodied-AI robotics company whose own materials emphasize practical commercialization rather than research-lab theater. The official site bundle says the company was established in July 2024, describes embodied-intelligence full-stack technology plus robot hardware-platform R&D as the core, and frames the business around a one-brain-multi-body ecosystem serving industrial, commercial, and household scenarios. That positioning is reinforced by the company recruitment page, which describes rapid commercialization, multi-sensor fusion, navigation, motion-control capabilities, and a commercialization-first operating model. The official product surface is also narrow but concrete: SR-1 is live, HR-1 and BOT-1 are marked pending, and the hero copy describes SR-1 as a wheeled dual-arm robot positioned as a commercialization expert. This combination matters because it is more specific than generic “embodied AI”
    branding yet still materially earlier than the disclosure profile investors would expect from a clearly late-stage robotics leader.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO034
  - CO035
