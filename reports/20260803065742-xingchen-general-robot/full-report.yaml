      - number: '5.3'
        title: Workflow and use-case fit
        blocks:
          - type: paragraph
            body: >-
              Xingchen’s public use-case story is more specific than generic embodied-AI branding, but it is also
              narrower than a universal robot promise. The official bundle emphasizes exhibition guidance, hotel
              reception, museum explanation, office assistance, and showroom or reception scenarios. Qianhai reporting
              adds public consultation, patrol reminders, emergency support, and lightweight public-service interaction
              tasks. Taken together, these uses imply a robot optimized first for human-facing workflow support rather
              than for complex industrial assembly. That makes the current wheeled dual-arm form factor strategically
              logical: wheels reduce the difficulty and cost of full biped locomotion, while dual arms preserve enough
              manipulation capability for light service tasks and demonstrations. This does not mean factories and
              warehouses are impossible future targets. It means the strongest reviewed evidence today still fits guided
              interaction, movement through human spaces, and moderate mobile-manipulation workloads. For diligence, the
              key distinction is between “capable of many scenarios” and “publicly proven in each scenario,” and
              Xingchen still sits closer to the first than the second.
