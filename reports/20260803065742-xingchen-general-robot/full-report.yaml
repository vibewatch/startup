      - number: '8.4'
        title: Downside triggers, dilution, and exit context
        blocks:
          - type: paragraph
            body: >-
              Downside analysis matters more here than upside narration because the public evidence base is still thin.
              The main negative triggers are straightforward: failure to raise follow-on capital, inability to convert
              the narrow proof base into additional paying deployments, and a visible safety or reliability problem in a
              flagship environment. Any of those would materially weaken the story because current customer proof is
              concentrated and financial opacity is high. Geopolitical discounting adds another layer. A Chinese
              embodied-AI company can lose foreign TAM or partnership optionality quickly if tariffs, procurement rules,
              or security narratives harden. Dilution and preference risk are also underappreciated. Public sources do
              not disclose preference stack or liquidation protections, so even a superficially reasonable enterprise
              value may not translate into attractive common-equity returns. On exit, the most plausible pathway from
              the current evidence set looks more domestic and later-stage than global and near-term. Investors should
              therefore frame Xingchen less as an imminent premium-exit candidate and more as a company that still needs
              several proof milestones before exit quality improves materially.
            claimRefs:
              - CV028
              - CV029
              - CV030
