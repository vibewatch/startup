              Xingchen’s public surface describes a product family, not a single robot demo. The official site bundle
              exposes three branded nodes—SR-1 live, HR-1 pending, and BOT-1 pending—and repeatedly frames the business
              around a one-brain-multi-body architecture. That matters because the company is not merely claiming to
              build a single wheeled service robot; it is claiming a reusable intelligence layer that can migrate across
              multiple bodies and scenarios. The currently most concrete body is SR-1, which the site labels a wheeled
              dual-arm robot and a commercialization-oriented product. Financing and leadership coverage add more
              context by describing Xingchen Brain as the multimodal and world-model-like reasoning core and Xingchen
              Control as the motion-control layer. The practical product definition that emerges is a service-oriented
              embodied-AI system combining mobile manipulation, interaction, and scenario deployment services. However,
              this remains a partially disclosed family. HR-1 and BOT-1 are visible only as placeholders, and reviewed
              sources still do not provide clean public spec sheets or operating envelopes for any of the products. So
