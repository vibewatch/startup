      - number: '8.5'
        title: Final diligence asks and valuation verdict
        blocks:
          - type: paragraph
            body: >-
              The final diligence asks are not exotic. Investors need the cap table, current cash and runway,
              customer-by-customer contract detail, paid-versus-pilot deployment counts, and product-level unit
              economics. Those items would answer most of the chapter’s biggest uncertainties quickly. Just as
              important, they would determine whether the company’s visible public-service proof is actually compounding
              into a durable commercial system or simply generating strategically useful references. That distinction
              drives the verdict. Xingchen looks like a credible early commercialization option with some real scenario
              traction, not like a pure paper startup. But the same public record still does not justify paying as if
              broad de-risking has already occurred. The right stance is to keep the company in the funnel,
              pressure-test the hidden economics, and insist on price and diligence discipline. If those asks come back
              strong, the case can upgrade. Until then, TRACK remains the highest-confidence call the public evidence
              can support.
            claimRefs:
