  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Financing failure
        - No credible follow-on capital despite ongoing commercialization burn
        - Undercuts survival and bargaining power
        - Rebase valuation toward bear case or step away
      - - Proof fails to widen
        - No additional meaningful paying deployments beyond current proof set
        - Thesis remains too concentrated and fragile
        - Keep at TRACK or downgrade
      - - Visible field failure
        - Public safety or reliability issue at a flagship site
        - Damages customer trust and raises diligence burden
        - Pause underwriting until root cause is understood
      - - Cap-table downside worse than expected
        - Aggressive preferences or liquidation stack surface
        - Common-equity upside compresses even if enterprise value is fair
        - Demand price discount or protections
      - - Geopolitical hardening
        - Material new tariff, procurement, or security barrier in target export market
        - Reduces TAM and multiple support
        - Cut international upside assumptions
      - - Unit economics disappoint
        - Hardware-plus-service economics prove weak or subsidy-dependent
        - Breaks path to attractive scale
        - Re-rate to option value only
    notes: These triggers are monitorable between rounds and connect directly to scenario downgrades.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV036
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and preference stack
        - Latest cap table, preferences, warrants, and liquidation waterfall
        - Needed to translate enterprise value into equity returns
        - Request CFO / board-approved financing pack
      - - Current cash and runway
        - Cash balance, monthly burn, financing plan, and working-capital bridge
        - Determines urgency of next round and bargaining power
        - Request monthly cash bridge and 12-month plan
      - - Customer economics
        - Contract value, robot count, payment terms, go-live status, and renewal behavior
        - Converts proof into revenue-quality judgment
        - Request customer-by-customer contract abstracts
      - - Deployment scale
        - Installed base, active sites, uptime, and support staffing
        - Needed to test whether public proof is representative or exceptional
        - Request fleet dashboard and operations KPIs
      - - Unit economics
        - BOM, ASP, service attach, gross margin, and warranty burden by product
        - Core determinant of valuation quality
        - Request product-level P&L or unit-economics memo
      - - Post-angel financing context
        - Exact terms, investors, and any later round documentation
        - Clarifies whether later-stage valuation narratives are real
        - Request board minutes or executed financing documents
    notes: The first four asks would resolve most of the gap between a tracked option and an investable valuation view.
    claimRefs:
      - CV030
      - CV031
      - CV038
      - CV039
