      - number: '8.3'
        title: Comparable set and scenario ranges
        blocks:
          - type: paragraph
            body: >-
              The comparable set is useful mainly as a boundary map. Figure’s official $39B post-money valuation is best
              read as a sector outlier powered by extreme capital formation and ambition, not as the clearing price for
              embodied-AI startups generally. Apptronik’s 2026 funding and reported $5B valuation show how strategic
              customers, Google ties, and a more mature production narrative can still sit well below Figure. Unitree’s
              IPO context matters for China specifically because it ties high public value to shipment scale and
              profitability. UBTECH’s listed-company disclosures add another crucial lesson: even with large revenue,
              robotics economics can remain loss-making. Agility’s public-market test is valuable because it suggests
              that public capital can price deployed humanoid proof more conservatively than the most exuberant private
              rounds. Taken together, these comps point to a simple conclusion: Xingchen is clearly earlier than every
              one of these reference points. That is why the scenario ranges in this chapter are illustrative and
              conditional, not a claim that the company deserves peer-like marks today.
