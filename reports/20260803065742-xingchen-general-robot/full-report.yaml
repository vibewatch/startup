  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk verdict and prioritization
        blocks:
          - type: paragraph
            body: >-
              Xingchen’s risk profile should be ranked as high residual execution risk rather than as a binary red flag.
              The company has crossed the threshold from pure concept to real-world proof: Qianhai is real, Wantian is
              real, and the official product surface is coherent enough to establish that there is an actual
              commercialization attempt underway. But almost every de-risking layer an investor would want beyond that
              remains thin in public: audited financials, unit economics, customer durability, manufacturing throughput,
              safety documentation, and international compliance readiness are all largely undisclosed. The result is a
              very asymmetric risk stack. The company may still work if it stays focused on service and public-sector
              scenarios inside China, yet its small proof base means each visible success or failure carries outsized
              transmission into fundraising, reputation, and future customer conversion. For diligence, the most
              important distinction is that these are monitorable risks rather than unknowable mysteries. The investment
              case breaks not because the market is small, but because the current public evidence is not yet deep
              enough to absorb operational setbacks.
            claimRefs:
              - CR001
              - CR002
              - CR006
