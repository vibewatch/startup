      - number: '5.2'
        title: Architecture and control stack
        blocks:
          - type: paragraph
            body: >-
              The most defensible way to read Xingchen’s architecture is as a layered embodied-AI stack rather than a
              monolithic “smart robot” claim. Official and financing materials repeatedly reference Xingchen Brain,
              Xingchen Control, multi-sensor fusion, navigation, perception, and motion control. That pattern aligns
              with broader 2026 embodied-AI architecture norms summarized by EETimes, QubitTool, Google DeepMind, and
              NVIDIA: perception and state estimation feed a higher-level reasoning or task layer, which in turn must
              coordinate lower-latency control and actuation loops. Public evidence does not prove that Xingchen
              implements the exact same stack as peers such as Figure, Agility, or DeepMind-backed systems, but it
              strongly suggests a similar split between high-level cognition and lower-level execution. The company’s
              own wording about multimodal large models, world models, and precision motion control supports that
              interpretation. The limitation is methodological, not just marketing. Xingchen has not published model
              sizes, inference latency, teleoperation boundaries, sim-to-real pipeline detail, or benchmark results. So
              the architectural picture is intelligible, but the degree of technical advantage remains unverified.
