      - number: '2.5'
        title: Implications for Xingchen’s own addressable market
        blocks:
          - type: paragraph
            body: >-
              Taken together, the sources suggest Xingchen is pointed at a legitimate market, but one whose accessible
              slice remains modest relative to the biggest China robotics narratives. The company’s strongest currently
              visible fit is in public-service and interactive service environments, plus partner-led commercial
              scenarios, because those are the places where its actual public product surface and deployment proof line
              up. The broader industrial, warehouse, factory, and hospital market may become relevant, but reviewed open
              sources in this run did not show enough named Xingchen deployments to treat that as today’s core SOM. That
              matters for both diligence and valuation. A company can operate inside a huge policy-favored market and
              still have a narrow near-term revenue pool if its product maturity, support model, and customer proof are
              still early. For Xingchen, the right market view is therefore “big sector, narrow proven beachhead, real
              tailwinds, and still-material execution risk.”
            claimRefs:
              - CM005
              - CM017
              - CM026
