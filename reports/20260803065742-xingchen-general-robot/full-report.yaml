      - number: '7.5'
        title: Monitoring, kill criteria, and the next diligence path
        blocks:
          - type: paragraph
            body: >-
              The advantage of Xingchen’s risk set is that it can be reduced by a small number of specific diligence
              asks rather than by abstract sector optimism. Investors do not need perfect certainty on every variable;
              they need evidence that the current narrow proof base can survive stress. The highest-priority asks are
              contract abstracts for Wantian and other named counterparties, fleet-level deployment data, current cash
              and runway, supplier concentration and chip dependency, and a safety/incident packet showing what happens
              when robots fail in the field. Those asks connect directly to kill criteria. A safety incident, a visible
              loss of the small customer proof set, an inability to raise follow-on capital, or continued failure to
              progress beyond showcase-style deployments would each materially weaken the thesis. On the other hand,
              even modest evidence of repeat orders, deeper product documentation, or multi-site rollouts would reduce
              residual risk quickly because the current public record is starting from a low base. That is why the right
              posture today is high-monitoring, evidence-driven diligence rather than blanket optimism or reflexive
              rejection.
