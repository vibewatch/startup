    columns:
      - Scenario
      - Core assumptions
      - Illustrative valuation logic
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - Proof remains concentrated; no audited economics; follow-on capital stays difficult
        - US$250M–US$500M option-value band
        - Capital stress, proof stagnation, visible field setback
        - Meaningful if current proof does not widen soon
      - - Base
        - Wantian-style frameworks convert selectively; more paid deployments appear; disclosure improves modestly
        - US$600M–US$1.0B band
        - Still vulnerable to margin opacity and geopolitical discount
        - Most consistent with current public evidence if execution improves
      - - Bull
        - Repeat paid rollouts, broader customer map, stronger economics packet, and financing clarity emerge
        - US$1.2B–US$1.8B band
        - Requires de-risking well beyond public record today
        - Possible, but not yet what retained sources prove
      - - What breaks all cases
        - Severe safety, financing, or customer-conversion failure
        - Valuation would reset below current modeled bands
        - Narrow proof base magnifies bad events
        - High monitoring priority
    notes: >-
      These scenario bands are illustrative and intentionally conservative relative to the richest sector narratives
      because Xingchen’s own public evidence is still early.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Current anchor from retained sources
      - Why relevant
      - Why it does not transfer cleanly
    rows:
      - - Figure
        - Official 2025 Series C at US$39B post-money
        - Sets the upper bound of sector enthusiasm and capital access
        - Far more capitalized and broader in ambition than Xingchen
      - - Apptronik
        - 2026 funding context at roughly US$5B per CNBC
        - Useful strategic-capital and commercialization benchmark
        - Deeper partner set and production narrative than Xingchen
      - - Unitree
        - 2026 IPO context around RMB42B / US$5.83B
        - China-specific benchmark tying valuation to scale and profitability
        - Shipment scale and profitability are not public for Xingchen
      - - UBTECH
        - Listed-company revenue and continuing losses in 2025 results
        - Shows that revenue scale alone does not mean attractive economics
        - Public listed company with far more disclosure than Xingchen
      - - Agility Robotics
        - 2026 public-market transaction around US$2.5B pre-money
        - Useful public-market check on deployed humanoid proof
        - Different geography, channel mix, and disclosure context
      - - Xingchen
        - No directly verified later-stage public valuation anchor in retained sources
        - Forces a discipline-first, evidence-first approach
        - Public record is too thin to defend peer-like pricing by analogy
    notes: >-
      The table is exhaustive for the six valuation anchors retained in this chapter: five external benchmarks plus
      Xingchen’s own unresolved public anchor.
