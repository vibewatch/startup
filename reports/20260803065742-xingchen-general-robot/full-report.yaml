      - number: '2.3'
        title: 'Buyer map: public service, service venues, enterprise pilots, and longer-cycle industrial users'
        blocks:
          - type: paragraph
            body: >-
              The reviewed source set suggests at least four meaningful buyer clusters. First are public-sector and
              city-linked buyers: the Qianhai station and Wantian framework show demand for consultation, patrol, policy
              explanation, and smart-government scenarios. Second are commercial service venues such as hotels, museums,
              brand spaces, and offices, all explicitly named on the official site. Third are enterprise and partner-led
              pilots tied to smart-home, retail, travel-service, or digital-service channels through names like Haier,
              DragonPass, and China Resources Digital. Fourth are longer-cycle industrial and logistics buyers that
              appear heavily in broader 2026 market commentary and WAIC deployment language, but are much less
              concretely evidenced for Xingchen itself. The adoption path across all four clusters is similar: prove
              navigation and interaction in a bounded scenario, integrate with workflow software and safety rules, then
              expand into larger deployments only if uptime, support, and ROI survive real use. That structure is why
              flashy macro TAMs should be discounted into a far smaller company-level SOM.
