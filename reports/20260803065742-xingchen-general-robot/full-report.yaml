              rather than a broad, clearly disclosed commercial base. First are public-service or government-adjacent
              operators, where the clearest evidence comes from Qianhai and the Wantian framework. Second are strategic
              partners named in financing coverage—China Resources Digital, Haier Smart Home, and DragonPass—which may
              represent commercial channels, solution collaborators, or future customers, but are not yet publicly
              documented as scaled live deployments. Third are venue-service users implied by official scenario copy
              such as exhibition halls, hotels, museums, offices, and showrooms. Fourth are local-government and
              city-governance projects, which matter because embodied-AI deployments often begin where policy,
              visibility, and experimentation align. This segmentation matters for diligence because the payer, user,
              and strategic value are not the same across these groups. A public pilot may be extremely valuable as
              proof and data, but still weak as recurring revenue evidence. Today, the strongest public proof sits in
