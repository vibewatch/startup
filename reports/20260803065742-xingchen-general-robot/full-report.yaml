        title: Trust, safety, and maturity
        blocks:
          - type: paragraph
            body: >-
              Xingchen’s main trust problem is not evidence of technical failure; it is the absence of detailed public
              trust evidence. Industrial and commercial robot buyers increasingly expect clear statements on uptime,
              intervention protocols, safety envelopes, workflow controls, auditability, and compliance. Agility’s
              public discussion of NRTL testing and specific standards shows what that bar looks like in a more mature
              deployment context. QubitTool’s 2026 embodied-AI review makes the same point from a systems perspective:
              claims around autonomy and deployment need latency, calibration, failure, safety, and uptime evidence.
              Xingchen’s public materials do not yet provide comparable disclosures. Reviewed sources did not surface
              public MTBF, battery-life, payload, force limits, privacy or telemetry policies, SDKs, incident logs, or
              certifications. That does not negate the underlying product. It does mean product maturity is still partly
              inferred from branding, recruitment, financing copy, and pilot visibility rather than directly documented
              operating proof. The prudent reading is therefore a credible early stack with meaningful maturity and
