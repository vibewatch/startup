  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Reviewed public sources point to a monetization model that is much closer to hardware-plus-solution
              delivery than to pure software. The official site bundle, recruitment copy, and financing coverage all
              emphasize embodied-intelligence full-stack R&D, a one-brain-multi-body architecture, wheeled dual-arm
              robots, and commercialization across new service, new retail, data collection, and public-service
              scenarios. The October 2025 financing article is especially revealing because management frames the
              business as more than selling a robot body: Zhang Chengwen explicitly described Xingchen as providing a
              replicable intelligent-service solution covering scenario discovery, product definition, channel building,
              and service delivery. That suggests three plausible revenue layers: initial robot sales, integration or
              deployment revenue tied to specific scenarios, and a longer-term software/control layer if the Xingchen
              Brain and Xingchen Control stack becomes reusable across form factors. What is missing is the actual
              commercial mechanism. No reviewed source publishes SR-1 list pricing, lease terms, maintenance contracts,
              attach rates, or any distinction between one-time hardware revenue and recurring software or service
              revenue. Until those details are disclosed, the company should be modeled as an early hardware-centric
              solution vendor with optional future software leverage, not as a proven recurring-revenue platform.
