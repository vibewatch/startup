              than “China embodied-AI startup with one-brain-multi-body positioning.” The public evidence suggests three
              possible wedges. First is service and public-service localization, where the Qianhai and Wantian signals
              are more relevant than factory glamour. Second is multi-form-factor reuse, if the one-brain-multi-body
              architecture really lowers deployment cost across service and city scenarios. Third is local state-backed
