      - number: '7.2'
        title: Regulatory, legal, and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk stack has expanded materially in 2026. China’s new industrial and supply-chain
              security rules create direct conflict-of-laws risk for multinationals, because routine de-risking,
              information gathering, or trade-compliance behavior can now be interpreted through a China countermeasures
              lens. At the same time, the external environment is getting harsher rather than easier. U.S. tariff layers
              still materially increase landed cost for Chinese robots, while the proposed GUARD Act and adjacent
              procurement-security scrutiny show how quickly the market-access window can narrow for Chinese embodied-AI
              hardware. Europe is not a clean offset. If embodied-AI systems are placed into regulated or human-adjacent
              contexts there, the AI Act raises documentation, oversight, and cybersecurity expectations even for
              third-country providers. Finally, China’s own HEIS 2026 standardization effort is strategically positive
              for the domestic industry but also raises the compliance burden for smaller companies. For Xingchen, the
              practical message is simple: regulation is no longer a distant scaling problem. It is already part of the
              go-to-market and partnership risk.
            claimRefs:
              - CR011
              - CR012
