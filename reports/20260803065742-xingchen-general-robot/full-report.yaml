      - number: '1.2'
        title: Leadership and organization
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is unusually founder-centric and still incomplete on formal governance. The 2025
              financing articles consistently identify Zhang Chengwen as CEO and as the commercialization-side leader,
              while also naming USTC PhD Liu Jinsu as part of the founding technical core. The March 2026 Tencent
              article adds a more important organizational inflection: Kong He, then vice dean of the SUSTech Robotics
              Institute, joined as co-founder and co-CTO focused on perception and control. Taken together with
              official-site and recruitment copy that highlights USTC and SUSTech doctoral teams plus a “global
              technical leader + product-engineering team + commercialization CEO” triangle, the picture is of a startup
              trying to combine academic depth with productization and channel execution. What remains absent is equally
              important: reviewed open sources did not provide a public board roster, preference stack, or a clearly
              disclosed CFO / COO layer. That means key-person dependence remains high and the company’s formal control
              structure is still a diligence gap rather than a verified strength.
