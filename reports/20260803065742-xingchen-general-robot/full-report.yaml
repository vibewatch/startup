  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The most supportable recommendation for Xingchen today is TRACK / research-more, not BUY. There is a real
              thesis: the company has a coherent embodied-AI product narrative, directly reviewable field proof in
              Qianhai, a named Wantian framework, and a service/public-sector wedge that looks more concrete than pure
              concept-video robotics. Those are real positives, and they are enough to prevent an outright dismissive
              view. But the anti-thesis is more important for valuation. Public materials still do not show audited
              revenue, gross margin, cash, burn, repeat-order economics, or a directly reviewable later-stage financing
              anchor. That means an investor is not choosing between good and bad company quality so much as between
              visible strategic option value and invisible economic quality. The right underwriting stance is therefore
              evidence-sensitive and price-sensitive. Xingchen may become much more interesting quickly if commercial
              proof broadens, but the public record today still supports a tracked option rather than a conviction long.
            claimRefs:
