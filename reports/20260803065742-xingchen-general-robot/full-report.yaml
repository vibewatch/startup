  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: embodied-service and general-robot workflows, not all automation'
        blocks:
          - type: paragraph
            body: >-
              Xingchen should be analyzed inside the embodied-intelligence and general-robot market, but the relevant
              spend boundary is narrower than “all robotics” or “all automation.” The company’s own public surface
              centers on a wheeled dual-arm robot, a one-brain-multi-body stack, and indoor service / commercial
              scenarios such as exhibition guidance, hotel reception, museums, offices, and showrooms. Financing
              coverage widens that picture to new service, new retail, data collection, and some industrial / family
              language, while the Wantian agreement pushes into urban governance and public services. What should be
              included, then, is spend on robot hardware, onboard perception and control, embodied-AI software,
              deployment integration, maintenance, and workflow adaptation for these service and semi-general scenarios.
              What should be excluded is the entire fixed-automation universe: classic industrial arms, AMRs,
              software-only AI, and factory automation budgets that Xingchen has not yet publicly shown it can win. That
              boundary matters because a startup with one public live product and thin disclosed customer evidence
              should not inherit the full China robotics TAM by default.
