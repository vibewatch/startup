    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              The accessible public record presents Xingchen General Robot as a very young embodied-AI robotics company
              whose own materials emphasize practical commercialization rather than research-lab theater. The official
              site bundle says the company was established in July 2024, describes embodied-intelligence full-stack
              technology plus robot hardware-platform R&D as the core, and frames the business around a
              one-brain-multi-body ecosystem serving industrial, commercial, and household scenarios. That positioning
              is reinforced by the company recruitment page, which describes rapid commercialization, multi-sensor
              fusion, navigation, motion-control capabilities, and a commercialization-first operating model. The
              official product surface is also narrow but concrete: SR-1 is live, HR-1 and BOT-1 are marked pending, and
              the hero copy describes SR-1 as a wheeled dual-arm robot positioned as a commercialization expert. This
              combination matters because it is more specific than generic “embodied AI” branding yet still materially
              earlier than the disclosure profile investors would expect from a clearly late-stage robotics leader.
