              Reviewed public sources do not disclose NRR, GRR, churn, contract length, renewal behavior, customer
              satisfaction, or cohort-level repeat usage. They also do not provide a denominator for customer count,
              active deployments, or installed base. That makes concentration risk impossible to quantify cleanly. If
              the public proof base is only a handful of government-facing pilots and framework partners, concentration
