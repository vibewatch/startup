      - number: '1.4'
        title: Deployment signals and open gaps
        blocks:
          - type: paragraph
            body: >-
              Commercial signal exists, but it is still closer to early deployment proof than to mature scale
              disclosure. In July 2026, NewTimeSpace and FilingReader reported a strategic cooperation framework
              agreement between China Wantian’s Shenzhen AI subsidiary and Hunan Xingchen General Robot covering
              embodied-AI products, urban governance, public services, smart government affairs, and open-scene centers.
              March 2026 public-service reporting from eWeek and Shenzhen Daily adds another visible proof point: robots
              developed by local companies were operating at Qianhai Stone Park’s robot volunteer station, where the
              published service list extended well beyond greetings into daily consultation, policy explanation, patrol
              reminders, emergency support, and entertainment. Broader market sources reinforce the context but not
              Xingchen’s relative leadership: WAIC 2026 reporting, Sourcebotics, TrendForce, and policy commentary all
              show a fast-scaling Chinese embodied-AI market led by larger peers such as Unitree and AgiBot. That leaves
              Xingchen with a credible early story — product, partner, pilot, and policy fit — but still without the
              public revenue, customer count, total raised, or headcount evidence needed to underwrite it like a
              late-stage category winner.
