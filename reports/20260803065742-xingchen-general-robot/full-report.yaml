        title: Price, product breadth, and capability disclosure
        blocks:
          - type: paragraph
            body: >-
              Public price and capability disclosure favor peers over Xingchen. Unitree’s G1 page exposes concrete
              dimensions, weight, degrees of freedom, and positioning, and the broader Unitree product family spans
              quadrupeds plus multiple humanoids. UBTECH’s Walker S page is explicit about industrial assembly-line use,
              multimodal large-model decision making, U-SLAM semantic navigation, and ROSA 2.0. Figure’s company and
              news pages show a visible F.01–F.03 progression and tie Figure 02 to a named BMW deployment. Agility
              likewise presents Digit not as a concept video but as a commercially deployed automation tool tied to Arc
              cloud controls and measurable throughput. Xingchen’s official surface is still much lighter: SR-1, HR-1
              pending, BOT-1 pending, and scenario / interaction features. That lighter disclosure does not prove weak
              capability, but it does make it harder for buyers and investors to compare Xingchen directly with peers
