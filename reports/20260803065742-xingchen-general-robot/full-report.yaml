      - number: '3.3'
        title: Distribution, deployment readiness, and trust
        blocks:
          - type: paragraph
            body: >-
              The strongest public competitors are not necessarily the smartest technically; they are the ones that
              reduce buyer uncertainty. Figure reduces uncertainty with scale capital and named BMW production
              contribution. Agility reduces it with a workflow-and-controls story built around Digit plus Arc. UBTECH
              reduces it with industrial training claims and a long corporate history. Unitree reduces it with radical
              product accessibility, open price points, and breadth across robots. Xingchen’s currently visible proof is
              more fragmented: partnership claims with China Resources Digital, Haier, and DragonPass; a Qianhai
              public-service station; and a city-services framework with Wantian. Those are useful, but they do not yet
              add up to the same depth of public enterprise deployment evidence. Trust also includes geopolitical and
              compliance trust. Some peers face similar China-origin scrutiny, but Western vendors such as Agility and
              Figure likely enjoy an easier path in U.S. or allied procurement channels. As a result, Xingchen currently
              competes better on scenario flexibility and localization potential than on public trust or industrial
              workflow maturity.
