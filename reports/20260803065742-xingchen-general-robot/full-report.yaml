      - number: '7.4'
        title: Partner, dependency, and people risk
        blocks:
          - type: paragraph
            body: >-
              Dependency risk is unusually important for Xingchen because the company’s current public narrative is
              built through partners, platform ecosystems, and a small visible leadership bench. The Wantian framework
              is strategically useful, but it also underscores the channel risk: when scenario access runs through a
              small number of gatekeepers, commercial upside and commercial fragility rise together. The same logic
              extends to state-linked channels, key customers, upstream component providers, and software/computing
              stacks. A change in policy sentiment, partner incentives, procurement workflow, or platform access can
              affect not just one order but the broader perception that Xingchen is progressing toward scale. People
              risk compounds that exposure. Public materials highlight founder story, select leadership additions, and
              hiring momentum, but they do not yet disclose a deep operating bench or a mature manufacturing/governance
              stack. That does not mean the team is weak; it means key-person and organizational scaling risk remain
              under-documented. In a capital-hungry market, that is material because execution depth often matters more
              than product narrative once deployment count begins to rise.
