      - number: '1.3'
        title: Capital and commercialization
        blocks:
          - type: paragraph
            body: >-
              The cleanest financing evidence available in reviewed open sources is not a 2026 unicorn-style growth
              round but a 2025 angel financing. Multiple Chinese media reprints — including CNR, Sina, AI云资讯, and Cnfol
              — report that Xingchen completed a multi-ten-million-RMB angel round in September 2025 and announced it on
              October 28, with investors Xiangjiang New District state-owned capital and Hunan Haichuang. Those stories
              also converge on how the money was meant to be used: iterate Xingchen Brain and Xingchen Control, push
              wheeled dual-arm humanoid mass production, and deepen commercialization in new service, new retail, and
              data-collection scenarios. The same article family claims strategic cooperation with China Resources
              Digital, Haier Smart Home, and DragonPass, which is useful as a partner map even though those articles do
              not translate partnerships into audited revenue. The most important judgment is negative: despite the user
              seed context, reviewed open pages in this run did not surface a direct public June 2026 Series B
              announcement or a defensible >RMB10B valuation disclosure, so later chapters should treat that headline as
              unverified rather than as reusable ground truth.
