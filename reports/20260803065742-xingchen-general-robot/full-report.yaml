      - number: '5.4'
        title: Differentiation and dependencies
        blocks:
          - type: paragraph
            body: >-
              The company’s clearest differentiation claim is architectural reuse: one brain, many bodies. If real, that
              could lower model-training duplication, speed scenario adaptation, and help the company spread engineering
              investment across multiple hardware forms. Yet differentiated technology is only valuable if the
              dependency chain is manageable. Here the chapter’s main finding is that Xingchen appears to depend on the
              same hard pieces that shape the wider sector: sensors, compute, actuators, data collection, simulation or
              edge deployment tooling, integration partners, and scarce robotics talent. The 2026 benchmark environment
              reinforces the point. NVIDIA’s GR00T positions data, models, simulation, middleware, and deployment
              hardware as a single development stack; DeepMind’s Gemini Robotics makes generality, interactivity, and
              dexterity explicit benchmark axes; Unitree publishes unusually transparent specs and open interfaces; and
              Agility shows that workflow software and support are part of the product, not just the robot body. Against
              that backdrop, Xingchen’s differentiation claim is plausible, but its dependencies are real and still only
              partially disclosed.
