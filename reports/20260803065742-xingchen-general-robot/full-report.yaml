  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Xingchen’s product promise depends on hardware, compute, data, integration, and talent layers that are only partly
      disclosed.
    data:
      nodes:
        - label: Xingchen embodied-AI platform
          detail: Integrated robot-body plus brain/control commercialization stack.
        - label: Sensors + perception hardware
          detail: Camera and fusion stack needed for navigation, interaction, and manipulation.
        - label: Compute + model infrastructure
          detail: Embodied AI requires model training, inference, and iteration resources.
        - label: Actuators + motion hardware
          detail: Dual-arm manipulation and mobile operation depend on durable mechanical execution.
        - label: Integration partners / deployment sites
          detail: Real scenes and counterparties provide both use cases and data.
        - label: Engineering talent pipeline
          detail: Recruitment and leadership depth remain crucial operating dependencies.
        - label: Evaluation / safety discipline
          detail: Latency, uptime, and intervention evidence determine trust.
