  topRisks:
    - 公开商业化证明仍窄，集中在极少数可见部署或框架关系。
    - 本次保留的来源集没有公开披露经审计收入、毛利率、现金、烧钱速度和股权结构细节。
    - Unitree、UBTECH、Figure、Apptronik 和 Agility 等更大同行，已经把资本深度、规模或披露门槛拉得很高。
    - 中国特有的政策、出口、关税和采购审查，可能压缩海外 TAM，也会让合作更复杂。
    - 如果没有公司一手材料就按高隐含估值承销，投资人其实在依赖公开资料没有保留的隐藏证据。
