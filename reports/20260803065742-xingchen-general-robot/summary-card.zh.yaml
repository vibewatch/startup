  topStrengths:
    - 官方材料和第三方报道支撑了连贯的具身 AI 产品逻辑，不只是概念故事。
    - Qianhai 和 Wantian 在公共服务和城市治理场景中给出可直接复核的早期商业化证明。
    - 公司看起来贴合中国政策偏好的机器人主题，也接入了地方国资相关资本网络。
    - 服务和公共部门切口，可能比立刻在重工业人形机器人里正面硬拼更现实。
