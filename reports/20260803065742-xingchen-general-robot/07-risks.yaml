  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Safety and incident packet
    missingEvidence: Robot safety case, incident-response SOPs, field failure rates, and any third-party testing or certification evidence.
    whyItMatters: A visible embodied-AI deployment can damage the entire customer story if safety governance is weak.
    diligencePath: Request safety dossier, test reports, and incident-management procedures.
    relatedQuestionRefs:
    - QR010
    - QR023
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: material
    topic: Manufacturing readiness
    missingEvidence: Current production capacity, supplier concentration, yield, QA metrics, and field-support staffing.
    whyItMatters: Scale and reliability risk cannot be underwritten without operations data.
    diligencePath: Request plant walkthrough materials, supplier map, and monthly operations KPI pack.
    relatedQuestionRefs:
    - QR011
    - QR023
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: Customer durability
    missingEvidence: Renewals, repeat orders, contract length, account concentration, and paid-vs-pilot classification.
    whyItMatters: Commercial proof without durability can mislead valuation and financing assumptions.
    diligencePath: Request customer-by-customer contract abstracts and revenue concentration table.
    relatedQuestionRefs:
    - QR015
    - QR023
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
