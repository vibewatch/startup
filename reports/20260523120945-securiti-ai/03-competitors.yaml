"chapter":
  "number": 3
  "title": "Competitor Landscape"
  "summary": "Securiti competes on a broader canvas than a typical DSPM vendor: direct DSPM specialists, privacy incumbents, AI-governance point solutions, native-cloud substitutes, incumbent data-security suites, open-source stacks, and internal-build workflows all overlap with part of its value proposition. The strongest positive differentiator in the retrieved evidence is breadth — Securiti publicly combines DSPM, privacy, governance, and AI security / AI governance in one platform and now carries Veeam-backed distribution. The strongest negative evidence is that incumbents are converging on the same story from different starting points: OneTrust from privacy, Microsoft from platform gravity, Varonis and Palo Alto Networks from security suites, and Credo AI / Holistic AI from standalone AI governance. The resulting moat is real but conditional. It depends on whether customers value unified cross-domain workflow enough to overcome embedded incumbent relationships and partial native-cloud\
    \ substitutes."
"sections":
- "id": "landscape"
  "title": "Landscape — Direct Peers, Incumbents, Adjacent Suites, and Status Quo"
  "body": |-
    Securiti competes in an unusually wide battlefield because it does not sell a single narrow product. Its public pages present a combined platform spanning data security posture management, privacy automation, data governance, and AI security / AI governance. That creates direct competition with DSPM specialists such as Cyera, Varonis, BigID, Sentra, and Privacera; privacy incumbents such as OneTrust, TrustArc, DataGrail, and Osano; emerging AI-governance specialists such as Credo AI and Holistic AI; and large incumbent suites such as Microsoft Purview, Amazon Macie, Google Sensitive Data Protection, IBM data security, and Palo Alto Networks Cloud Data Security. In practice, Securiti is often asking buyers to consolidate several adjacent control surfaces rather than replace one clean point product.

    The direct-peer set is therefore only one slice of the problem. Cyera, Sentra, BigID, and Privacera all market variants of data discovery, classification, risk reduction, access governance, or AI-era data controls. Varonis comes from a much larger installed base and now markets a combined data-and-AI security platform across cloud, SaaS, and on-prem. Privacy leaders remain important because many enterprises start the budget conversation from privacy operations and governance rather than from cloud security. OneTrust, TrustArc, DataGrail, and Osano all anchor those motions, with OneTrust and TrustArc explicitly pushing farther into AI governance and preventive data controls.

    The substitute set is broader still. Hyperscaler-native offerings let many accounts cover a subset of discovery, classification, or governance needs inside Microsoft, AWS, or Google estates without adopting another standalone platform. Open-source and build-your-own stacks also remain credible for some data-office teams: OpenMetadata provides open-source metadata and governance, and Apache Ranger provides policy administration and fine-grained data security. Those options do not replicate Securiti's full control-plane thesis, but they matter because they can absorb parts of the workflow. The 2025 Veeam acquisition adds a final landscape twist: Securiti now competes not just as a startup platform, but as a security-and-governance layer attached to a much larger data resilience distribution engine.
