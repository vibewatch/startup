  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dspm-market-size
    missingEvidence: Accessible independent 2026 standalone DSPM market refresh from Gartner, Forrester, IDC, or Statista with transparent methodology.
    whyItMatters: The retrieved DSPM estimates span a very wide range, and higher-confidence underwriting would benefit from a current tier-1 benchmark rather than vendor and report-summary triangulation alone.
    diligencePath: Request paid analyst extracts or management deck materials that cite Gartner/Forrester/IDC; validate whether those figures use narrow standalone DSPM or broader adjacent-category definitions.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: ai-governance-market-size
    missingEvidence: Accessible tier-1 2026 AI-governance market refresh with public methodology and a clean enterprise-software boundary.
    whyItMatters: AI governance is a fast-growing but still immature category; without a higher-tier public refresh, the report relies on mid-tier analyst forecasts and official regulatory demand signals.
    diligencePath: Obtain Forrester or IDC extracts, or request management materials showing which external market studies customers and investors cite most often.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-mix
    missingEvidence: Module-level pipeline share, win rates, and budget ownership split across security, privacy, data, and AI-led deals.
    whyItMatters: This determines whether Securiti is truly a diversified platform with multiple repeatable entry wedges or a company still dependent on one dominant buying motion.
    diligencePath: Request pipeline segmentation, win/loss data, and expansion cohorts from management; reconcile with partner-sourced deal mix and module attach rates.
    relatedQuestionRefs:
    - QM027
