    - Core expansion engine for security-led deals
  - - Privacy management / PrivacyOps
    - DSARs, ROPA, notices, PIAs, incident workflows, data mapping for privacy use cases
    - Manual legal workflows, outside counsel, ticketing systems, point DSAR tools
    - Chief Privacy Officer / DPO; privacy or compliance budget
    - Historical entry wedge and still the clearest workflow ROI
  - - Data governance control plane
    - Data mapping, lineage context, stewardship, policy orchestration, classification consistency
    - Pure data-catalog subscriptions without active controls, consulting-only governance programs
    - Chief Data Officer / governance office; data budget
    - Important cross-sell and shared context layer
  - - AI governance / AI security
    - Shadow-AI discovery, agent/model inventory, runtime guardrails, AI compliance, data-use controls for copilots and agents
    - Policy-only review committees, generic MLOps without governance, manual model inventories
    - AI governance team / security / data office; emerging AI budget
    - Newest category and likely 2026 growth wedge
  - - Adjacent cloud data-security suites
    - Broader CNAPP, data-security, and native cloud controls that partially overlap with DSPM
    - Infrastructure-only posture management without data context
    - Security platform owner; platform budget
    - Acts as both substitute and acquisition-driven consolidation threat
