- id: sizing-lens-and-estimate-range
  title: Sizing Lens, Contradictory Estimates, and Overlap-Adjusted SAM
  body: |-
    The most reliable published anchors are adjacent rather than perfectly on-point. MarketsandMarkets
    estimates privacy management software reaches $15.2B by 2028 at 41.9% CAGR, while Grand View
    Research estimates the data-governance market grows from $3.35B in 2023 to $12.66B by 2030 at
    21.7% CAGR. For AI governance, MarketsandMarkets projects $0.89B in 2024 to $5.78B in 2029 and
    NextMSC projects $0.94B in 2025 to $7.38B in 2030. DSPM is the noisiest lens: Palo Alto's 2026
    market guide cites estimates ranging from a $415M 2024 base to roughly $1.5-2.0B in 2025, while
    Virtue Market Research puts 2025 at $2.05B and $10.38B by 2030. The spread is not an error; it
    reflects definitional disagreement over whether DSPM is counted narrowly as a standalone data-risk
    platform or broadly as a data-centric layer inside CNAPP, data-security, or identity-security
    suites.

    For diligence purposes, raw addition of these published categories would overstate Securiti's true
    opportunity because the same enterprise may fund privacy automation, data governance, DSPM, and AI
    governance from overlapping transformation budgets. A better lens is to apply enterprise relevance
    and overlap discounts. Using a large-enterprise slice of the privacy market, a control-plane slice
    of the governance market, and a cautious view of the early DSPM / AI-governance overlays yields an
    overlap-adjusted 2026 SAM of roughly $5.8-8.2B. This is directionally consistent with the user-
    supplied thesis that Securiti's real addressable wedge is mid-single-digit billions today rather
    than the raw end-decade TAM implied by adjacent category summation.

    The upside case is still meaningful. If one simply sums end-decade adjacent market forecasts,
    the raw adjacency TAM reaches roughly $30-44B before overlap adjustment. But the underwriting
    lesson is to anchor on a conservative SAM and preserve contradictory estimates rather than hiding
    them in a single midpoint. The size of the disagreement is itself a market fact: Securiti sells
    into categories that are still consolidating around their eventual definitions.
