- id: growth-drivers-constraints-and-open-gaps
  title: Growth Drivers, Adoption Constraints, and Diligence Gaps
  body: |-
    The structural demand drivers are strong. DSPM growth is propelled by multicloud data sprawl,
    unstructured-data growth, and the operational impossibility of manually discovering where sensitive
    data sits or who can access it. Privacy automation continues to benefit from regulatory proliferation
    and the need to operationalize DSARs, mapping, incident response, and notice management without
    linear headcount growth. Data-governance demand grows with the volume and complexity of enterprise
    data estates. AI governance is being pulled forward by the combination of new regulation, model-risk
    scrutiny, and the practical need to govern shadow AI and enterprise agents.

    The AI driver is especially important to Securiti's 2026 narrative. NIST's AI RMF, the EU AI Act,
    and analyst forecasts all point to governance becoming a funded software category rather than a
    loose policy exercise. IBM's 2025 breach research sharpens the ROI case by showing that ungoverned
    AI systems are disproportionately associated with incidents and higher breach costs. Securiti's
    Agent Commander positioning — shadow-AI discovery, data-context mapping, runtime guardrails, and
    AI-compliance automation — is therefore a logical extension of the existing data-control-plane
    thesis rather than a wholly separate market bet.

    The constraints are equally real. First, DSPM and AI governance remain category-immature, and the
    valuation spread across public sources shows that the market has not settled on a stable definition.
    Second, incumbents already own adjacent budget lines: OneTrust in privacy, data-governance and
    catalog platforms in stewardship, and data-security / native cloud suites in monitoring and access
    control. Third, deployment is integration-heavy because the product must connect to structured,
    unstructured, SaaS, cloud, and now AI systems. Fourth, the platform is enterprise-first; the same
    complexity that supports high-value deployments makes SMB self-serve adoption less natural. The most
    important unresolved diligence asks are therefore not abstract market-size debates alone, but module-
    level win rates, budget ownership by function, and whether Securiti most efficiently lands through
    privacy, security, or AI governance in 2026.
