  - id: TV005
    title: 投资逻辑破坏与放弃触发因素表
    enumeration: true
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Lists the full set of thesis-break signals used in this chapter to judge whether the realized strategic price
        eventually proves too high or well-earned.
    columns:
      - 触发因素
      - 阈值 / 信号
      - 重要性
      - 行动含义
      - 监测路径
    rows:
      - - 未披露 ARR 过低
        - 交割后披露或尽调显示，出售日 ARR 明显低于高端安全倍数所需水平
        - 如果收入基数很薄，$1.725B 的公允性论证会迅速塌掉。
        - 把交易视为战略性买贵，而非价格公平。
        - 索取签约与交割时的收购模型和 ARR 桥。
      - - 交叉销售没有落地
        - 整合产品未能打入 Veeam 存量客户，或仍停留在小众试点
        - 战略上行很大一部分靠分销杠杆，而不只是 Securiti 的独立足迹。
        - 将估值重置到更窄的独立公司倍数组合。
        - 跟踪附加销售率、捆绑胜率和整合产品预订额。
      - - 捆绑压力加速
        - Macie、Purview 或更广泛套件靠价格和便利性取胜
        - 即便产品很强，如果捆绑替代品主导采购，终局倍数也会被压缩。
        - 下调利润率和倍数假设。
        - 复盘竞争性折扣和赢单 / 输单数据。
      - - 整合拖慢路线图执行
        - 管理层流失、发布延迟，或 Agent Commander 等整合产品采用疲软
        - 只有 Veeam 放大而不是压低产品叙事，这个价格才说得通。
        - 把投资逻辑从战略协同改成战略拖累。
        - 监测发布节奏、关键领导者留任和客户背书。
      - - 集中度被证明很高
        - 少数客户、合作伙伴或产品模块解释了大部分业务
        - 如果收入质量狭窄，品类领导者叙事很脆弱。
        - 大幅上调下行概率。
        - 索取按客户、模块和合作伙伴拆分的集中度表。
      - - 分配瀑布条款令人失望
        - 优先股堆叠或交易机制显著稀释普通股结果
        - 名义企业价值可能夸大投资人的实际到手收益。
        - 在把这次退出当作基准之前，重新计算投资人回报说法。
        - 获取股权结构表、优先权安排和分配瀑布。
    notes: 阈值是尽调触发条件，不是已披露管理层指引。它们把本章的公开证据缺口转成可监测的是 / 否条件。
    claimRefs:
      - CV014
      - CV021
      - CV022
      - CV031
      - CV032
      - CV036
      - CV040
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 可能责任方
      - 决策用途
    rows:
      - - 收购日 ARR 和收入结构
        - 签约与交割时的 ARR、订阅与服务收入结构，以及净新增 ARR 桥
        - 这是任何公允价值评估里最大的缺失输入。
        - 财务 / 公司发展
        - 围绕真实收入重建可比公司和情景区间。
      - - 留存和集中度
        - NRR、GRR、logo 流失、前 10 大客户，以及按细分市场拆分的模块附加
        - 判断所支付溢价买到的是持久质量，还是集中增长。
        - 财务 / 收入运营
        - 收紧乐观 / 基准 / 悲观概率。
      - - 毛利率和烧钱质量
        - 毛利率、现金消耗，以及收购日盈利能力桥
        - 区分战略稀缺性和真正高端的软件资产。
        - 财务
        - 判断独立公司是否曾有资格拿到类似上市公司的倍数。
      - - 股权结构表和分配瀑布
        - 优先股堆叠、期权池、清算权和实际退出分配
        - 名义退出价值不等于投资人到手收益。
        - 财务 / 法务
        - 按股份类别验证已实现回报说法。
      - - 整合记分卡
        - 预订额附加、Veeam 导入的销售管线、整合产品采用，以及管理层留任
        - 这是检验 Veeam 买到平台楔子还是单点资产的最清晰方式。
        - 公司发展 / GTM / 产品
        - 判断这个价格随时间变得更好还是更差。
      - - 竞争定价数据
        - 相比 Macie、Purview 和其他大型套件的赢单 / 输单、折扣和捆绑替代
        - 需要用它量化反向逻辑：DSPM 功能会在更广泛平台内部商品化。
        - 销售 / 产品营销
        - 细化终局倍数和下行假设。
    notes: 这些是最低限度索取项，拿到之后才能把本章从可信的回溯备忘录，转成精确的承销模型。
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV032
      - CV036
      - CV044
      - CV045
