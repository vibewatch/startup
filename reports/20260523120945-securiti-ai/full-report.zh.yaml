  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the chapter's selected public-company, private, M&A, and milestone references: Rubrik, Varonis,
        Commvault-like public guardrails, Cohesity-style private scale, early DSPM tuck-ins, Securiti's own 2022
        financing anchor, and the realized Veeam exit.
    columns:
      - 参考对象
      - 状态 / 阶段
      - 已观察或指示性估值口径
      - 为何有用
      - 关键限制
      - 对 Securiti 的读法
    rows:
      - - Rubrik
        - 上市数据安全 / 韧性公司
        - 本报告的公开市场语境采用大约高个位数 EV/ARR 区间
        - 它有用，是因为它把数据保护、安全和公开披露放在相邻品类里。
        - 上市公司，财务披露更完整，平台成熟度也高于 Securiti 退出时。
        - 可作为偏上中位的公开市场护栏，但不是可直接套用的精确倍数。
      - - Varonis
        - 上市数据和 AI 安全厂商
        - 本报告的公开市场语境采用大约中到高个位数 EV/ARR 区间
        - 它有用，是因为它是以数据为中心、且带 AI 安全定位的上市安全资产。
        - 业务更广、历史更长，披露也远多于 Securiti。
        - 支撑有纪律的公开可比下限，也凸显 Securiti 披露缺口有多大。
      - - Commvault 式上市数据韧性下限
        - 上市存量厂商参照
        - 低于高端安全公司的公开 EV/ARR 估值护栏
        - 提醒我们，增长较慢的数据基础设施公司，交易倍数可能远低于战略买家给出的私有市场价格。
        - 不是 DSPM 原生对标，结构上也更成熟。
        - 说明 $1.725B 需要战略稀缺性和增长预期支撑，而不是套一个普通备份公司倍数。
      - - Cohesity / Veritas 规模参照
        - 私有战略规模数据韧性参照
        - 数十亿美元级私有估值语境
        - 它标出相邻品类中，大型私有数据基础设施平台可能值多少钱。
        - 产品组合和商业模式不同于 Securiti。
        - 帮助解释 Veeam 为什么能为一项战略数据层资产支付数十亿美元。
      - - 早期 DSPM 补强收购（Dig / Laminar / Normalyze）
        - 较早期品类 M&A 集群
        - 报告语境下，多为小规模、通常低于 $500M 或未披露的参照组
        - 它有用，是因为这些交易代表更早或更窄的 DSPM 退出。
        - 公开网络佐证不均，因为本次研究中若干 URL 已失效或无法访问。
        - 暗示 Securiti 相比小型补强式退出拿到了品类领导者溢价。
      - - Lacework / Fortinet 困境网络安全下限
        - 困境网络安全 M&A 参照
        - 报告语境中的区间大致在数亿美元低段
        - 提醒下行风险：后期网络安全资产的成交价可能远低于私募预期。
        - 品类、困境背景都不同，也不是干净的 DSPM 类比。
        - 更像悲观情景警示，而非核心可比。
      - - Securiti Series C 轮隐含锚点
        - 私募融资里程碑
        - 若 2022 ARR 约为 $20M-$40M，且安全 SaaS 按约 8x-15x ARR 交易，隐含投后估值可能约为 $200M-$600M
        - 它有用，是因为它框定了从上一次已知大型融资到退出期间可能创造了多少价值。
        - 这个锚点由假设驱动，因为公开证据没有披露实际 Series C 轮投后估值或 ARR。
        - 支撑 2025 退出前出现大幅增值的判断，但不假装知道 2022 年精确账面估值。
      - - Securiti → Veeam 实际退出
        - 已实现战略交易
        - $1.725B 现金加股票收购
        - 这是已观察到的出清价格，因此是本章最强的单一估值锚点。
        - 战略价格可能高于纯财务买家愿意支付的水平。
        - 最佳回溯锚点；其他可比项只是围绕它做交叉校验。
    notes: 可比组有意混合，因为不存在单一、干净的独立同业。公开可比公司用作护栏，早期 DSPM 交易提供品类方向， Securiti 自身融资和退出才是最影响决策的锚点。
