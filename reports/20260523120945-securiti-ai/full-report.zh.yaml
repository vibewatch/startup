  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 工作流 / 用例
      - 主要用户
      - 触发条件
      - 核心步骤
      - 完成信号
      - 关键依赖
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Enumerates the main public workflows marketed across DSPM, privacy automation, governance, and AI control
        surfaces rather than every sub-feature microflow.
    rows:
      - - 多云敏感数据发现
        - 安全 / 数据治理
        - 接入新的云或数据平台
        - 连接数据源 -> 发现资产 -> 分类敏感数据 -> 排定风险优先级 -> 路由控制动作
        - 已创建敏感数据地图和态势基线
        - 连接器健康度和元数据覆盖
      - - 隐私权利履行
        - 隐私运营
        - DSAR / 删除 / 访问请求
        - 定位个人数据 -> 汇总上下文 -> 执行工作流审批 -> 履行请求 -> 记录证据
        - 请求已履行并留下审计轨迹
        - 已连接系统间的身份解析
      - - 访问治理整改
        - 安全 / 数据所有者
        - 识别出权限过高访问或敏感暴露
        - 映射权限 -> 检查访问模式 -> 定义最小权限策略 -> 掩码 / 过滤或整改
        - 访问权限已收缩或策略已执行
        - 准确的权限元数据
      - - Snowflake 大规模控制管理
        - 数据平台 / 安全
        - 大型多账户 Snowflake 部署
        - 发现敏感数据 -> 应用策略 -> 从中央指挥中心管理控制 -> 监控一致性
        - 跨账户数据策略已应用
        - Snowflake 原生控制 + Securiti 连接器
      - - Databricks AI 数据管道整理
        - AI / 数据工程
        - 模型训练、调优或 RAG 需要企业数据
        - 选择数据集 -> 净化敏感内容 -> 将整理后的数据同步到 Delta 表 -> 应用治理控制 -> 追踪来源
        - 可用的受治理训练 / 调优数据集
        - Databricks Mosaic AI / Delta / Unity Catalog 集成
      - - ServiceNow 工作流化和升级处理
        - IT / 风险 / 合规运营
        - 风险、隐私或治理问题需要行动
        - 创建工单 / 工作项 -> 路由给负责人 -> 跟踪整改 -> 带证据关闭
        - 运营问题已在工作流系统中关闭
        - ServiceNow 连接器和流程归属
      - - 智能体式 AI 风险响应
        - 安全 / AI 运营
        - 检测到不安全智能体行为或 AI 错误
        - 检测风险 -> 检查受影响数据 / 智能体上下文 -> 保护系统 -> 启动回滚 / 撤销流程
        - 风险已遏制或损害已逆转
        - Agent Commander 可用性和遥测
    notes: 工作流表覆盖外部文档记录的主要运营流程，但单个客户落地时会加入内部审批、自定义策略和服务工单。
