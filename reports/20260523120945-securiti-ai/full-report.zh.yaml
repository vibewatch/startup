      - number: '5.3'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开证据指向云原生 SaaS 架构，依赖连接器和 API，而不是本地设备部署。平台运营模型从云平台、数据仓库、湖仓、SaaS 系统和工作流工具摄取元数据与数据上下文信号开始。随后，Securiti
              的上下文智能层——在不同材料中被称为 Data Command Graph、知识图谱或图谱支撑的控制模型——把数据对象与用户、权限、血缘、法规和 AI
              系统连接起来。这张图谱再被策略引擎用来驱动发现、分类、脱敏、访问审查、血缘分析、合规检查、隐私工作流和 AI 控制。分类能力被描述为基于 AI 和
              NLP，而不只是规则；合作伙伴材料反复强调来源、上下文标记和跨环境策略可移植性。Databricks 材料增加了具体架构细节：Unity Catalog 集成、行列控制、动态脱敏、训练数据清洗，以及治理向
              Mosaic AI 供给的 Delta 表流水线。Snowflake 材料同样强调从中央控制中心管理多账户策略。架构边缘的 ServiceNow
              等工作流集成和更宽的连接器框架，让产品更像策略编排层，而不是被动可见性仪表盘。
