      - number: '8.2'
        title: 融资背景支持升值判断，但入场纪律仍取决于未披露经济性
        blocks:
          - type: paragraph
            body: >-
              融资路径说明了为什么退出看起来亮眼。公开来源支持 January 2020 的 $50 million Series B，使累计融资达到 $81 million；随后 October 2022 的 $75
              million Series C，把披露融资推到 $155 million 以上。同一篇 2022 TechCrunch 报道还提到七位数和八位数合同、环比三位数增长，以及员工数从 Series B 阶段的
              185 人扩到 Series C 时约 370 人。到 December 2025 交割时，Veeam 称会新增 600 名 Securiti 员工。这些里程碑支持一个真实规模扩张故事，也让 2022 融资到
              2025 退出之间创造了大量价值这一判断变得可信。但它们没有回答 2022 年确切投后估值、出售时 ARR 或清算瀑布。因此，本章可以合理地把 Series C
              到退出的升值框定为显著，但如果没有额外私有证据，无法计算逐投资人的干净账面总倍数。
