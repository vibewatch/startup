      - number: '8.3'
        title: 战略逻辑可信，但公开可比公司仍只是护栏，不是可直接套用的公式
        blocks:
          - type: paragraph
            body: >-
              证明 Veeam 没有严重多付的最佳论据偏战略，而不是纯倍数。Veeam 刚完成一笔 $2 billion 老股交易，母公司估值 $15 billion，披露 $1.7 billion ARR 和 30%
              EBITDA 利润率，并称交易提高了未来收购的灵活性。Securiti 很贴合这条收购议程：把面向 DSPM、隐私、治理和 AI 信任的统一控制平面，与 Veeam
              的韧性和恢复栈配在一起。Rubrik、Varonis 以及更广泛 DSPM 市场报告等公开参照仍有用，但主要是划定区间。它们比 Securiti
              更成熟、披露更多，或结构不同。市场数据集本身也很乱：留存证据中的多条分析师、数据库和可比公司 URL
              被付费墙、封锁或过期。由此得到的纪律很简单：公开可比公司可以提示战略叙事何时偏离公开市场现实太远，但它们无法单独给出 Securiti 交割时的精确独立估值。
