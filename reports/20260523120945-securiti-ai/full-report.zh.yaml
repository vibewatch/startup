      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的公开 GTM 证据显示，Securiti 卖进大型企业预算，并有明显渠道杠杆，但没有公开销售效率披露。TechCrunch 报道 Series C 阶段公司环比三位数增长，并称 Securiti
              已经拿下七位数和八位数合同。随后，合作伙伴计划新闻稿展示了公司如何放大这套动作：渠道优先、合作伙伴参与 75% 的机会，并计划把 100%
              企业业务导向合作伙伴、转售商或云市场相邻采购路径。由此可判断，相比纯创始人主导销售，公司直接销售负担更低；但公司不披露 CAC、回本周期、胜率、销售周期长度或人均配额产出。


              运营规模代理指标可见。员工数从 Series B 时的 185 人增至 2022 年 10 月约 370 人；LinkedIn 和收购交割信息则显示，出售前公司已是 500-1,000+
              人区间的后期组织。尽管如此，承销者应把渠道参与视为方向性的效率利好，而不是已测量事实。公开来源显示需求来自哪里、交易可能如何通过合作伙伴路由，但没有披露佣金、折扣或销售生产率经济性。
