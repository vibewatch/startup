  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局 —— 直接同行、既有厂商、相邻套件与现状方案
        blocks:
          - type: paragraph
            body: >-
              Securiti 的战场异常宽，因为它不卖单一窄产品。公开页面展示的是一个组合平台，覆盖数据安全态势管理、隐私自动化、数据治理和 AI 安全 / AI 治理。这让它直接面对
              Cyera、Varonis、BigID、Sentra、Privacera 等 DSPM 专家；OneTrust、TrustArc、DataGrail、Osano 等隐私既有厂商；Credo AI、Holistic
              AI 等新兴 AI 治理专家；以及 Microsoft Purview、Amazon Macie、Google Sensitive Data Protection、IBM data security、Palo
              Alto Networks Cloud Data Security 等大型既有套件。实践中，Securiti 往往要求买家整合几个相邻控制面，而不是替换一个干净的点产品。


              因此，直接同行只覆盖问题的一部分。Cyera、Sentra、BigID 和 Privacera 都在营销数据发现、分类、风险降低、访问治理或 AI 时代数据控制的不同版本。Varonis
              拥有大得多的装机基础，如今也在云、SaaS 和本地环境中营销数据与 AI
              安全组合平台。隐私领导者仍然重要，因为许多企业从隐私运营和治理出发启动预算对话，而不是从云安全出发。OneTrust、TrustArc、DataGrail 和 Osano 都锚定这些动作，其中 OneTrust
              和 TrustArc 明确向 AI 治理和预防性数据控制推进。


              替代品集合更宽。超大规模云厂商原生产品允许许多客户在 Microsoft、AWS 或 Google
              资产内覆盖部分发现、分类或治理需求，而无需再采用一个独立平台。开源和自建栈对部分数据办公室团队仍有可信度：OpenMetadata 提供开源元数据和治理，Apache Ranger
              提供策略管理和细粒度数据安全。这些选项无法复制 Securiti 的完整控制平面逻辑，但它们重要，因为可以吸收工作流的部分环节。2025 年 Veeam 收购给竞争格局增加了最后一个变量：Securiti
              现在不只是以创业公司平台身份竞争，而是成为附着在更大数据韧性分发引擎上的安全与治理层。
