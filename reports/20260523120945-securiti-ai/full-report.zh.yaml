    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Securiti AI（法律实体为 Securiti, Inc.）是一家网络安全与数据治理软件公司，总部位于 300 Santana Row, Suite 450, San Jose,
              California。公司成立于 2019 年，最初使命是为企业自动化隐私运营（「PrivacyOps」），帮助其应对 GDPR、CCPA 和不断变化的全球数据法规。之后，平台扩展成更宽的 Data
              Command Center：在混合多云、SaaS 和本地环境中，为数据安全态势管理（DSPM）、隐私自动化、AI 治理和合规提供统一智能与控制层。

              核心产品由 Data Command Graph 驱动。这是一套自研知识图谱引擎，可自动捕捉云服务商（AWS、Microsoft Azure、Google
              Cloud）、数据平台（Snowflake、Databricks）和 SaaS 应用（Salesforce、Box）中的数据与 AI 对象上下文元数据。Veeam 完成收购后，公司于 2026 年 3 月推出
              Agent Commander，用于企业 AI 智能体部署的安全与治理。Securiti 主要面向拥有复杂混合云足迹、需要统一数据控制的大型企业，并采用渠道优先模式，至少 75% 的企业机会有合作伙伴参与。
