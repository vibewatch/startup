      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Securiti 由 Rehan Jalil 创立。Jalil 是巴基斯坦裔美国企业家，毕业于 Karachi 的 NED University of Engineering and
              Technology，之后移民 Silicon Valley。创办 Securiti 前，他曾任 Elastica CEO；Elastica 于 2015 年被 Blue Coat Systems
              收购，这让他在创办 Securiti 前已积累直接的企业云安全经验。在 Securiti，Jalil 一直担任总裁兼 CEO，直至 Veeam 收购完成；随后他转任 Veeam Security and AI
              总裁。

              Series C 阶段（2022 年 10 月）的创始和高管团队包括 CTO Chaks Chigurupati、Artificial Intelligence 副总裁 Michael Rinehart，以及
              Engineering 副总裁 Tanveer Zamir。Michelle Graff 担任 Channels and Alliances 副总裁，并是 2023 年 Unify Partner Program
              的公开代表。公司在云安全和数据工程上的领导层厚度通常被视为竞争优势；本研究周期未发现重大公开领导层离职或争议，不过董事会构成等治理细节对一家私营公司而言仍不透明。
