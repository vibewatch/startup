  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 按影响程度和发生概率展示 Veeam 收购后 Securiti 的主要风险簇；安全事件带来的可信度损失、诉讼以及合作伙伴集中度落在剩余严重度最高的格子。
    data:
      columns:
        - label: 中等影响
        - label: 高影响
        - label: 关键影响
      rows:
        - label: 高概率
          values:
            - 套件捆绑带来的价格压缩
            - 合作伙伴集中度与 Accenture 式 GTM 依赖
            - ''
        - label: 中等概率
          values:
            - 联邦 / 出口准备度缺口
            - EU AI Act 合规负担；整合期流失
            - 自有平台被攻破导致可信度受损；OneTrust 法律升级
        - label: 低概率
          values:
            - 巴基斯坦地点集中风险意外暴露
            - 云中断造成客户可见后果
            - ''
    approximationNotes: 发生概率和影响评级是基于已获取公开证据的定性分析判断。高概率指风险可能在投资判断周期内暴露；关键影响指足以打穿投资逻辑的事件。
    claimRefs:
      - CR029
      - CR030
      - CR033
      - CR038
      - CR042
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向图展示法律、安全与整合风险如何传导到信任、定价权、客户留存和 Veeam 的安全 AI 逻辑。
    data:
      nodes:
        - id: litigation
          label: 法律 / IP 升级
          detail: 专利纠纷或监管压力加剧。
        - id: trust-event
          label: 自有平台安全或可靠性事件
          detail: 安全事件或持续宕机打击产品可信度。
        - id: trust-erosion
          label: 客户信任侵蚀
          detail: 安全与合规叙事可信度下降。
        - id: discounting
          label: 折扣加大、赢单放慢
          detail: 面对捆绑替代方案，销售团队必须抵消客户对风险的感知。
        - id: retention
          label: 扩张 / 留存信心下降
          detail: 大客户推迟更广泛上线或扩张。
        - id: parent-thesis
          label: Veeam 安全 AI 逻辑被削弱
          detail: 母公司收购叙事失去力度。
        - id: valuation
          label: 战略价值兑现下降
          detail: 整合 ROI 与长期利润率假设被压缩。
      edges:
        - from: litigation
          to: trust-erosion
        - from: trust-event
          to: trust-erosion
        - from: trust-erosion
          to: discounting
        - from: discounting
          to: retention
        - from: retention
          to: valuation
        - from: trust-erosion
          to: parent-thesis
        - from: parent-thesis
          to: valuation
    approximationNotes: 箭头表示定性因果关系，不是计量经济估计。为保留 DAG 结构，反馈回路已简化。
    claimRefs:
      - CR032
      - CR038
      - CR043
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 有向图梳理 Securiti 在母公司所有权、渠道、云和生态合作伙伴上的关键依赖，标出单点中断最可能快速级联的位置。
    data:
      nodes:
        - id: securiti-core
          label: Securiti 核心平台
          detail: DSPM、数据治理、AI 安全与合规工作流。
        - id: veeam
          label: Veeam 母公司
          detail: 掌握路线图控制权、整合节奏和资本配置。
        - id: insight
          label: Insight Partners
          detail: 通过 Veeam 施加关键股东层面影响。
        - id: channel
          label: 渠道 / SI 生态
          detail: 多数企业机会都有合作伙伴介入。
        - id: accenture
          label: Accenture
          detail: 战略集成商，且拿到 Partner of the Year 背书。
        - id: cloud
          label: AWS 和 GCP
          detail: 核心基础设施提供方，也在相邻领域竞争。
        - id: data-platforms
          label: Databricks / Snowflake / HPE 技术栈
          detail: 企业 AI 与数据治理部署的生态路径。
        - id: customers
          label: 企业客户
          detail: 从组合技术栈购买信任、稳定在线和治理结果。
      edges:
        - from: insight
          to: veeam
        - from: veeam
          to: securiti-core
        - from: channel
          to: customers
        - from: accenture
          to: channel
        - from: cloud
          to: securiti-core
        - from: data-platforms
          to: securiti-core
        - from: securiti-core
          to: customers
        - from: veeam
          to: channel
    approximationNotes: 本图强调依赖结构，而不是收入权重。公开证据能支撑依赖关系存在，但难以支撑精确集中度比例。
    claimRefs:
      - CR023
      - CR025
      - CR026
      - CR028
      - CR031
      - CR041
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从已兑现的强退出结果出发，但结论停在不可执行的独立投资判断：公司已经被收购，核心经济指标仍未公开。
    data:
      nodes:
        - id: n1
          label: 已兑现 $1.725B 退出
          description: 事实层面已有强结果。
        - id: n2
          label: 融资约 $156M
          description: 退出相对已披露投入资本表现强。
        - id: n3
          label: 与 Veeam 战略契合
          description: DSPM、隐私、治理和 AI 信任契合 Veeam 的韧性平台。
        - id: n4
          label: 经济指标不透明
          description: 公开证据仍缺 ARR、留存、利润率和收益分配瀑布。
        - id: n5
          label: 无独立证券可买
          description: 新投资者已无法购买独立 Securiti 股权。
        - id: n6
          label: 回看为正
          description: 对既有投资者是好退出；对 Veeam 来说价格有战略合理性，但高度依赖执行。
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n3
        - from: n3
          to: n6
          label: 支撑战略逻辑
        - from: n4
          to: n6
          label: 限制估值精度
        - from: n5
          to: n6
          label: 结束独立入场机会
        - from: n2
          to: n6
          label: 支撑强退出结果
    approximationNotes: 该图是决策路径，而非统计模型。
    claimRefs:
      - CV001
      - CV004
      - CV015
      - CV020
      - CV032
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值争议主要由隐性的收入质量和收购后执行牵动，而不是品类是否存在。
    data:
      items:
        - label: 收购时 ARR
          value: 5
          detail: 未披露 ARR 是判断价格是否合理时最大的单一摆动因素。
        - label: 整合执行
          value: 5
          detail: 只有 Veeam 放大这项资产，价格才会随着时间显得划算。
        - label: 向 Veeam 客户基盘交叉销售
          value: 4
          detail: 分销杠杆是成交价之外上行空间最清晰的路径。
        - label: 公开市场倍数环境
          value: 4
          detail: 资产缺少独立披露，公开可比公司的估值护栏就重要。
        - label: 股权结构表 / 瀑布条款
          value: 4
          detail: 这些条款决定投资者实际回报与头条企业价值之间的差距。
        - label: 捆绑压力
          value: 3
          detail: Macie、Purview 和更大型套件可能压缩长期定价权。
    approximationNotes: 条形图按 1–5 分衡量相对敏感性，并非实测弹性。
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV032
      - CV036
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准、乐观区间框定了已兑现的战略价格在成交时究竟偏低、基本合理还是昂贵。
    data:
      items:
        - label: 悲观情景
          low: 0.9
          mid: 1.05
          high: 1.2
        - label: 基准情景
          low: 1.5
          mid: 1.725
          high: 1.8
        - label: 乐观情景
          low: 2
          mid: 2.2
          high: 2.4
    approximationNotes: 数值为以十亿美元计的估计值，反映交易时点的回看公允价值护栏，而不是当前账面标记。
    claimRefs:
      - CV001
      - CV018
      - CV033
      - CV034
      - CV040
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 计分卡在已兑现投资者回报和战略契合上很强，但披露质量和新投资者的独立安全边际偏弱。
    data:
      items:
        - label: 已兑现投资者回报
          value: 5/5
          detail: 约 $156M 融资对应 $1.725B 出售，是强结果。
          tone: positive
        - label: 与 Veeam 战略契合
          value: 5/5
          detail: 资产天然贴合韧性、恢复和 AI 信任叙事。
          tone: positive
        - label: 市场顺风
          value: 4/5
          detail: 安全 AI 与数据控制需求支撑该品类。
          tone: positive
        - label: 产品广度
          value: 4/5
          detail: Securiti 在同一个控制平面里带来 DSPM、隐私、治理和 AI 信任。
          tone: positive
        - label: 披露质量
          value: 2/5
          detail: ARR、留存、利润率和收益分配瀑布仍未公开。
          tone: warning
        - label: 新投资者安全边际
          value: 1/5
          detail: 已经没有可买的独立 Securiti 证券，价格也已按战略逻辑成交。
          tone: risk
    approximationNotes: 这些 KPI 是综合投资判断，并非经审计的运营指标。
    claimRefs:
      - CV001
      - CV004
      - CV014
      - CV020
      - CV032
      - CV045
