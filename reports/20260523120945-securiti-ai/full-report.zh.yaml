      - number: '8.4'
        title: 乐观、基准、悲观情景框定 $1.725 billion 是公平、偏高还是机会价
        blocks:
          - type: paragraph
            body: >-
              已实现退出价已知，但内部经济性未知，因此情景分析必须问一个更窄的问题：交割时，什么样的独立等价价值或战略价值区间站得住？乐观情景下，Securiti 已接近高端安全公司的规模，Veeam
              能向庞大装机基础大力交叉销售，AI 控制平面需求支撑超过 $2 billion 的价值。基准情景下，实际 $1.725 billion 清算价大致公平，因为 Securiti
              已成为品类领导者，但仍需要战略买方支付区间高端。悲观情景下，公开 ARR、利润率和集中度披露缺失，可能遮住更薄的底层业务；大平台打包压力压缩独立倍数，公允价值更接近 $1
              billion。因此，已实现结果最适合理解为战略清算价：现有投资者应该满意，但新的财务投资者仅靠公开证据无法有信心承销。
