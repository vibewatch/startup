      - number: '3.4'
        title: 切换成本、多栖采用、分发能力与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Securiti 最可信的护城河不是某个孤立功能，而是统一数据上下文被替换时产生的累积成本：发现规则、分类、治理逻辑、隐私工作流和 AI
              护栏已经连在一起。客户一旦把这些工作流嵌入多朵云和多个工具，切换成本来自重新映射政策和运营流程，而不只是换一个仪表盘。这比单模块护城河更强；Veeam 所有权又增加了分发和相邻数据韧性故事。


              但护城河并非绝对。多栖采用很可能是常态，而非例外。Microsoft 占主导的客户可以继续保留 Purview，同时使用 Securiti；AWS 占主导的客户仍可用 Macie 做 S3
              发现；隐私牵头组织可能继续使用 OneTrust 或 TrustArc，同时为安全牵头场景采用 Securiti。因此，Securiti
              可能会与既有厂商长期共存；但如果客户认为覆盖重叠，共存也会限制定价权。最清晰的商品化风险在发现、分类和合规报告层，因为原生云或更宽套件方案对许多场景已经足够好。


              公开信息中可见反向证据。OneTrust 和 TrustArc 都在从传统隐私工作流扩张到 AI 治理和数据使用控制，直接从隐私侧攻击 Securiti 的统一化叙事。Credo AI 和 Holistic AI
              显示，AI 治理可以继续作为独立预算线存在，而不一定自然折叠进组合平台。OpenMetadata 加 Apache Ranger
              等开源栈，对重视灵活性且能承受更多工程人力的团队仍有可信度。尽调含义是，Securiti 护城河的耐久性取决于可衡量的跨模块采用，也取决于 Veeam
              渠道能否比既有厂商补齐缺口更快地把宽叙事变成更容易的企业采购。
