  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个企业级客户占主导的客户群，而不是自助式长尾。Securiti 自己的合作伙伴和客户参考材料反复围绕大型全球企业来讲平台；基于 Gartner 的 June 2024
              公告则称，被评审客户覆盖全球大小组织，收入从 $50 million 到超过 $10 billion。同一公告还显示行业分布横跨金融、零售、科技、制造和旅游，这是本轮能看到的最清晰公开分层图。


              公开具名客户标识最强的部分来自数据平台和云相邻买方：CB Insights 把 Snowflake 和 Amazon Web Services 列为客户。Securiti 的 2026 资源页和博客索引又给出
              Dye & Durham、Walker & Dunlop、Sanofi 的企业客户故事信号；HPE 生态文章则明确把医疗、金融服务、制造和公共部门部署，放进 HPE-NVIDIA-Veeam Securiti
              组合栈的相关用例里。合在一起看，买方通常是安全、隐私、数据治理或 AI 治理负责人；日常用户是数据、安全、隐私和平台团队；经济买方则是企业 IT 或数据控制预算负责人。


              仍然缺少的是按地区、ACV 档位或客户数占比划分的真实客群拆分。公开语料能说明 Securiti 想要谁，也能说明它赢下了一部分谁，但给不出量化的分层组合。
