      - number: '7.4'
        title: 合作伙伴、依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              Securiti 的 GTM 和产品架构都高度依赖外部方。2023 合作伙伴项目公告称，合作伙伴已经参与 75%
              的机会，管理层希望随着时间推移所有企业业务都通过合作伙伴交易。这可以加速分销，但也让公司更暴露在联盟集中度和联合销售摩擦之下。Accenture 是最清楚的具名战略例子：它出现在合作伙伴项目 材料中，也在公司
              2026 新闻索引里成为 Partner of the Year，这说明它有真实 GTM 重要性，不只是礼仪性标识。产品依赖也同样多层，横跨 Databricks、Snowflake、HPE、NVIDIA、AWS
              和 GCP。


              所有权又加了一层。Veeam 现在控制路线图、整合节奏，以及 Securiti 能保留多少独立自主权；Insight Partners 仍是母公司层面的关键所有者影响。Rehan Jalil 转入 Veeam
              全局领导角色有助于连续性，但也意味着公司创始人现在要在更大的投资组合议程里运作。主要人员风险不是 Securiti
              完全缺少领导层，而是相对于这次执行转型的重要性，公开证据对交易后组织设计、技术领导留任和地点集中度仍然太薄。
