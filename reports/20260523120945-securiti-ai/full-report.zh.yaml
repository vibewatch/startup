      - number: '5.2'
        title: 产品模块与资产地图
        blocks:
          - type: paragraph
            body: >-
              公开产品地图显示的是模块化但收敛的平台架构。DSPM
              是跨多云和数据平台处理结构化、半结构化、非结构化数据的发现与控制层。数据治理增加目录、血缘、质量和访问治理功能，尤其服务那些希望在不失去政策控制的前提下，让企业数据可用于分析和 GenAI 的客户。更早的
              PrivacyOps 基础仍有战略重要性，因为它把平台锚定在隐私运营、监管工作流和个人权利履行，而不只是安全态势管理。AI 安全与治理能力把同一数据上下文延伸到模型、智能体、流水线和提示词级控制；Agent
              Commander 是收购后面向智能体 AI 的这一逻辑表达。围绕这些模块的是大型集成织网：Securiti 宣传数千个连接器，并为 ServiceNow、Databricks
              等系统发布专门页面；合作伙伴材料则强调大客户 Snowflake 策略管理，以及面向 Databricks Mosaic AI 和 Delta tables 的 AI 流水线整理。因此，实际产品资产不像单一
              SKU，更像一组控制面——连接器、上下文图谱、策略引擎、工作流 / 编排和合作伙伴集成——可为不同客户任务重新组合。
