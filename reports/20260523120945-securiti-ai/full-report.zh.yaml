      - number: '3.2'
        title: 竞争对手画像 —— 范围、规模信号、定价姿态与战略方向
        blocks:
          - type: paragraph
            body: >-
              在直接 DSPM 群体中，Cyera 和 Sentra 把自己定位为适配 AI 时代的安全优先平台；BigID 和 Privacera 则把安全、治理和访问控制混合进更宽的数据平台。Varonis
              与纯创业公司在战略上不同，因为它从既有企业安全足迹切入，并同时营销数据安全和 AI 安全。商业意义很直接：Securiti 不只是在与创业公司专家竞争，也在与能从相邻预算或既有企业关系落地的厂商竞争。


              隐私阵营同样重要。OneTrust 仍是隐私牵头采购中最清晰的既有厂商，但其公开信息现在把隐私、数据使用治理和面向 AI 的治理连接到一个平台上。TrustArc 也沿同一方向扩张，在隐私解决方案中营销 AI
              治理和负责任 AI 模块。DataGrail 更偏向需要工作流自动化的精简隐私团队，Osano 则保持更简单、更合规优先。对 Securiti 而言，这些厂商重要，因为即使 Securiti
              在别处赢得安全牵头楔子，它们也可能阻止其扩张进隐私工作流。


              AI 治理增加了第三组画像。Credo AI 和 Holistic AI 并不是完整 DSPM 替代品，但它们证明 AI 治理可以作为独立控制层被购买，而不一定打包进更宽的数据平台。它们的存在削弱了 AI
              治理会自动并入 Securiti 的假设。与此同时，Securiti 自身的 Agent Commander 定位试图把这一威胁转化为优势：把影子 AI 发现、SaaS 智能体安全、云智能体保护，以及回滚 /
              修复表述重新接回既有数据控制平面叙事。


              私营厂商的定价大多不透明。Securiti、Cyera、BigID、Sentra、Privacera、OneTrust、TrustArc 和 DataGrail
              的公开页面都把买家引向企业销售，而非透明标价。这种不透明本身就是竞争事实：Securiti 的相对胜率高度取决于打包纪律、实施负担和相对既有厂商的套装经济性，而不只是功能清单。
