        - 索取漏斗转化、CAC、回本周期、周期长度和配额达成率
      - - 现金 / 烧钱速度 / 现金跑道 / 债务
        - 融资轮次、退出价值和收购方估值
        - 融资额不等于剩余现金
        - 无法检验收购前的下行情景韧性
        - 索取现金余额、债务明细，以及 13 周和 12 个月现金预测
      - - 收入确认和递延收入
        - 基于报价的定价页和企业许可评价表述
        - 缺少从预订额到已确认收入的桥接
        - 订阅质量和服务占比仍不透明
        - 索取收入确认备忘录、递延收入，以及服务与订阅拆分
      - - 渠道经济性和服务占比
        - 75% 合作伙伴参与，以及合作伙伴主导交付的表述
        - 没有经销商折扣、佣金或合作伙伴利润率数据
        - 间接渠道可能显著压缩净经济性
        - 索取直营与渠道占比、合作伙伴费用和实施费用转嫁率
    notes: 这些是最低限度的缺失输入；没有它们，本章只能给出方向性信心，无法形成完成投资测算后的财务确信。
