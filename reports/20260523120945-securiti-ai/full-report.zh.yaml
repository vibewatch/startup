              则呈现可见评论语料。合在一起，这些信号说明 Securiti 在出售给 Veeam 前已达到有意义的企业规模。


              但缺失的恰恰是财务承销者真正需要的指标。检索到的公开来源没有披露收入、ARR、NRR、递延收入、客户数、毛利率、现金或烧钱速度。Craft 资料页仍只显示 $81M
              累计融资，凸显公开网页资料对私营公司可能多么陈旧；Crunchbase、PitchBook、Gartner、Forrester 和 IDC
              在本轮中部分被封锁、设门禁或只剩空壳。因此，本章的状态是：员工数、合同规模轶事和评论数量是公开的，但收入质量和流动性仍是私有信息。
