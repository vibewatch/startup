        - 回溯正面 / 无独立入场点
        - 公司已以 $1.725B 退出，因此问题是退出质量和收购方逻辑，而不是今天是否买入一家私有安全公司。
        - 不要把它表述成对独立 Securiti 股权的当前买入 / 持有 / 卖出判断。
