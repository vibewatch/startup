      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Securiti 是典型企业控制平面产品：连接器覆盖广，重度依赖第三方基础设施，并承诺敏感数据控制能跨复杂环境运转。这种设计同时带来两个相反事实。正面看，公司披露了多可用区部署、pilot-light
              灾难恢复、哈希后的已编目个人数据、备份、SSO、RBAC 和负责任披露流程。负面看，同一个安全页面也显示，可靠性和安全栈有相当一部分依赖 AWS、GCP 以及 Securiti 必须持续维护的大型集成面。


              这就是为什么自有平台事故风险值得单独加权。一次安全事件或长期宕机，不只是制造直接运营痛点，还会削弱“信任、安全 AI、自动化治理”的销售叙事。本轮审阅的公开来源没有提供客户 SLA
              或详细宕机档案，外部很难量化残余敞口。平台延伸到 AI 安全和智能体 AI 之后，也多了一层新的质量风险：AI 和数据分类里的漏报、误报或策略错误，即使底层基础设施仍可用，也会给客户带来合规敞口。
