      - number: '4.3'
        title: 成本结构、利润率驱动与服务交付负担
        blocks:
          - type: paragraph
            body: >-
              公开证据指向软件为主的成本结构，但没有披露利润率。Securiti
              销售的是混合多云数据控制平台，负责在云、SaaS、本地和数据平台环境中扫描、分类、治理并编排行动。这一架构意味着成本集中在产品工程、云扫描与存储、连接器、AI
              驱动自动化、客户成功和企业支持，而不是硬件库存或制造。公司材料也强调自动化泄露响应、隐私权利履行、同意和治理工作流；原则上，部署稳定后应支持软件式毛利率。


              评论让简单 SaaS 故事更复杂。PeerSpot 总结的反复抱怨包括部署复杂度、基础设施规格估算、支持需求和文档；G2 与 PeerSpot 也都浮现学习曲线、性能和可用性反馈。PeerSpot 还记录了一个
              ROI 数据点：扫描 50 terabytes 的成本较竞争对手低近一半；另一个数据点显示手工作业减少 30-40%，长期目标为 70-80%。这些都是鼓励性的效率代理指标，但不是公开毛利率桥接。Securiti
              不披露分部毛利率、opex 结构、EBITDA、自由现金流或营运资本指标，因此利润率路径仍是推断，而非观察事实。
