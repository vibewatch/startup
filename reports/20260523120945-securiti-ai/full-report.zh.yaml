      - number: '4.6'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Securiti 的公开财务解读方向正面，但运营信息不完整。公司看起来是一项严肃的企业软件资产：广泛的控制平面产品、协商式大型企业交易、合作伙伴辅助 GTM、可信员工规模、累计融资超过 $156M，并以
              $1.725B 完成溢价战略退出。这些事实支持有意义的需求和资本可得性。


              但它们并不能证明收入质量、毛利率形态或现金效率。公开证据仍无法回答核心承销问题：收入中经常性订阅与实施 / 支持各占多少、收入如何确认、计入云扫描和支持成本后的毛利率如何、CAC /
              回本周期和续约动态如何、收购前还剩多少现金。因此，正确的财务结论是：战略价值具建设性，独立经济性则应谨慎。在把 Securiti 作为独立业务承销前，投资者需要管理层级别披露收入、利润率、渠道经济性和流动性。
