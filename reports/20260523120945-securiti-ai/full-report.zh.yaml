      - number: '6.5'
        title: 扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              Securiti 公开的先落地再扩张故事，由渠道和生态驱动。2023 Unify Partner Program 公告称，合作伙伴已经参与 75% 的机会，管理层希望企业业务最终 100%
              通过合作伙伴交易，包括经销商和云市场。Accenture、HCL、Guidepoint、Optiv、Trace3 被列为关键盟友；项目还明确奖励系统集成商把 Securiti 嵌入现有
              Snowflake、Databricks 和 Confluent 资产。由此可见一个典型企业控制平台扩张动作：先落进杂乱的现有数据栈，随着接入系统变多，再扩到安全、隐私、治理和 AI 工作流。


              HPE 生态文章进一步强化了这一解读：Securiti 被描述成策略和治理层，帮助客户在受监管环境中把 AI 从试点推向生产。这在战略上有吸引力，因为它制造了多条扩张向量——更多 存储库、更多治理用例、更多 AI
              工作流，以及更多合作伙伴主导的部署机会。


              反向压力是集中度不透明。本轮抓取的公开来源没有披露最大客户敞口、前 10 大收入占比，或任何干净的集中度指标。再叠加一方客户库页面失效，买方能理解渠道逻辑和扩张投资逻辑，却还不能量化客户集中度或真实续约质量。
