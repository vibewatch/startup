      - - 估值立场
        - 战略上合理，财务上充分定价
        - 对具备规模的战略买家来说，价格看起来合理；但对缺少内部收入和协同数据的外部人来说偏满。
        - 锚定已实现退出，不靠缺乏支撑的上行外推。
        - 证明出售时披露或推断的 ARR 足以支撑高端安全公司倍数，无需英雄式假设。
      - - 回报 / 持有 / 退出视角
        - 已以约 $1.725B 实现退出
        - 相对于约 $156M 已披露融资，这次退出对风投投资人看起来强劲；未来上行已归 Veeam 持有人。
