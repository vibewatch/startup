      - number: '2.3'
        title: 买方 / 用户 / 付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Securiti 的买方地图并不常见，因为同一平台可以从不同高管切入。安全牵头的交易通常由 CISO 或数据安全负责人主导，理由是发现影子数据、权限风险、有毒组合、降低泄露，以及安全使用
              AI。隐私牵头的交易由首席隐私官、DPO 或隐私运营团队主导，理由是 DSAR 响应、ROPA、通知、风险评估和泄露通知。数据办公室或 CDO 牵头的交易锚定数据映射、血缘、分类一致性和治理工作流。最新入口是
              AI 治理：AI 平台团队、模型风险团队或新兴首席 AI 官组织，需要清点、监控并在运行时控制影子 AI、copilot 和智能体。


              这种宽表面在战略上有吸引力，因为 Securiti
              可以从一个预算落地，再扩展到相邻预算。实践中，采用路径通常从已经让高管着急的痛点工作流开始——隐私运营、数据映射或安全发现——当组织希望共享一套数据与政策上下文时，再扩展到 DSPM 和 AI
              治理。公司的包装也强化了这种路径：数据发现与映射和隐私、治理、访问智能、泄露、AI 安全并排。这套架构让控制平面叙事更容易销售，但也意味着采购会变成多线并行，安全、隐私、数据和 AI 利益相关方都会影响交易。


              因此，预算归属是碎片化的，而不是干净分配。大型企业交易可能来自安全、隐私、数据或数字化转型预算，取决于模块组合；系统集成商和渠道伙伴则帮助穿过跨职能采购委员会。Securiti 公开称合作伙伴参与 75%
              的机会，这是一个实务信号：企业采用更像顾问式、重集成的销售，而非纯产品驱动。投资者应评估的不只是客户 logo 数，还要看哪个职能楔子最常打开大门，以及公司在初始落地后交叉销售的效率。
