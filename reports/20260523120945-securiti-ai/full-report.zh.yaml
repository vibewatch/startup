      - number: '6.2'
        title: 采用轨迹与部署深度
        blocks:
          - type: paragraph
            body: >-
              Securiti 没有公开披露客户总数、活跃账户数或站点数，因此采用情况只能借助代理指标来读。最好的时间序列代理指标是组织规模：TechCrunch 报道，2020 Series B 参考点有 185 名员工，到
              October 2022 Series C 时约 370 名；Veeam 的 December 2025 收购材料称，Securiti 将带来 600 名员工。这不能直接证明客户数，但确实说明交付、支持和 GTM
              覆盖面随时间明显扩大。


              公开评价和参考密度提供了第二个采用视角。到 2024 年，Securiti 的评价量已经足够满足 Gartner Peer Insights Customers’ Choice 方法论门槛，并报告 95%
              的推荐意愿。到 2026 抓取日，G2 显示 76 条评价，平均实施周期大约三个月。FeaturedCustomers 又列出 584 条参考评分、59 个客户视频、5 条推荐语和 2
              个案例研究。一条推荐语提到在不到 12 周内集成超过 250 个存储库，这是本轮最强的公开证据：至少一部分客户不是在做窄试点，而是在相当大的生产级环境里运行 Securiti。


              缺失的桥梁是一条干净的客户标识或部署漏斗：没有公开序列展示这些里程碑之间有多少企业完成转化、扩张、续约或流失。
