      - number: '6.4'
        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >-
              公开满意度信号方向上较强。Securiti 基于 Gartner 的 June 2024 公告报告 95% 的推荐意愿，并在产品能力、销售、部署和支持体验上拿到 4.7/5。G2 抓取页显示 76 条评价、评分
              4.7，平均实施周期约三个月。FeaturedCustomers 基于 584 条参考评分显示 4.8/5 的参考评分，并有相当规模的推荐语和客户视频库。这些不是留存指标，但确实表明客户总体愿意为平台背书。


              也有具体的重复使用证据。Dock 的 G2 评价描述了隐私治理工作流的日常使用；那条 12 周、250 个存储库的推荐语则说明至少一个部署已经宽到接入大量系统。与此同时，PeerSpot
              评价并非一边倒正面，而是好坏参半：用户认可发现、映射、仪表板和隐私控制深度，也抱怨部署难、成本估算、技术支持和文档。


              最大尽调缺口在于，本轮审阅的公开来源都没有披露 NRR、GRR、客户流失、续约率、合同期限或队列曲线。公开证据能说明客户喜欢产品，却还不能说明商业关系有多耐久。
