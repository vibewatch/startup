      - number: '2.2'
        title: 规模测算视角、相互矛盾的估计与重叠调整后 SAM
        blocks:
          - type: paragraph
            body: >-
              最可靠的公开锚点来自相邻市场，而不是完全对口市场。MarketsandMarkets 估计隐私管理软件到 2028 年达到 $15.2B，CAGR 为 41.9%；Grand View Research
              估计数据治理市场从 2023 年的 $3.35B 增至 2030 年的 $12.66B，CAGR 为 21.7%。AI 治理方面，MarketsandMarkets 预计从 2024 年的 $0.89B 增至
              2029 年的 $5.78B，NextMSC 预计从 2025 年的 $0.94B 增至 2030 年的 $7.38B。DSPM 是噪音最大的视角：Palo Alto 2026 年市场指南引用的估计，从 2024
              年 $415M 基数到 2025 年约 $1.5-2.0B 不等；Virtue Market Research 则给出 2025 年 $2.05B、2030 年
              $10.38B。差距不是错误，而是定义分歧：DSPM 到底是狭义的独立数据风险平台，还是 CNAPP、数据安全或身份安全套件内的以数据为中心的层。


              尽调中，直接把这些公开品类相加会高估 Securiti 的真实机会，因为同一家企业可能用重叠的转型预算购买隐私自动化、数据治理、DSPM 和 AI
              治理。更好的视角是加入企业相关性和重叠折扣：取隐私市场的大企业切片、治理市场的控制平面切片，并谨慎看待早期 DSPM / AI 治理叠加，可得到约 $5.8-8.2B 的重叠调整后 2026 年
              SAM。这个结果与用户提供的判断方向一致：Securiti 今天真实可触达的楔子是中个位数十亿美元，而不是把相邻品类相加得出的十年末原始 TAM。


              上行情景仍有意义。若简单相加十年末相邻市场预测，未经重叠调整的邻近 TAM 约为 $30-44B。但承销要点应是锚定保守
              SAM，并保留相互矛盾的估计，而不是把它们揉成一个中点。分歧本身就是市场事实：Securiti 所卖的品类仍在围绕最终定义整合。
