      - number: '8.5'
        title: 剩余估值工作主要在回答公开证据仍无法回答的问题
        blocks:
          - type: paragraph
            body: >-
              主要未完成工作不是判断 Securiti 是否重要；退出已经回答了这个问题。真正未解的是，$1.725 billion
              价格中有多少由耐久的独立经济性支撑，又有多少来自战略稀缺性、买方特定协同和时点。若出售时未披露 ARR 显著低于高端安全公司倍数所需水平，若面向 Veeam
              客户基础的交叉销售没能兑现，若大平台替代方案比预期更快压缩定价，或若整合拖慢产品速度、足以削弱 AI
              控制平面逻辑，投资逻辑就会破裂。因此，最终尽调问题集中在隐藏收入基数、客户集中度、续约质量、确切股权结构表和清算瀑布，以及交易后整合记分卡。知道这些之前，审慎估值姿态仍是：已实现结果很强，收购在战略上说得通，但精确度不完整。
