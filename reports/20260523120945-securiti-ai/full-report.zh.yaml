  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Securiti 并不在单一成熟软件品类里竞争。它的商业切入点横跨四类相互关联的采购动作：DSPM，用于发现、分类、访问风险、错误配置和泄露响应；隐私自动化，用于
              DSAR、ROPA、通知、事件工作流和政策执行；数据治理控制平面能力，如映射、血缘和数据管护；以及 AI 治理 / AI 安全，用于影子 AI 发现、运行时护栏和监管合规。官方产品页明确显示，公司卖的是数据与
              AI 控制层，而不是单一点产品。


              这种广度既带来上行空间，也让分析更难。应纳入的支出包括自动化数据发现、数据映射、政策执行、权限可见性、隐私工作流编排、AI 模型 / 智能体清单、运行时数据控制和合规报告的软件预算。应排除的支出包括宽泛的
              IAM/SSO、通用 SIEM、端点安全、备份、不带主动控制的通用数据目录订阅，以及纯咨询支出。这些被排除类别仍可能是替代或互补方案，但无法干净映射到 Securiti 的直接软件楔子。


              现状替代品很杂。隐私项目里，实际替代品往往是 OneTrust，或内部工作流叠加法务 / 合规人力。DSPM 和以数据为中心的安全里，替代品包括 Varonis、超大规模云厂商原生控制、CNAPP/CSPM
              模块和人工数据清单流程。AI 治理里，许多企业仍依赖政策文件、临时审查委员会或分散的 MLOps 工具，而非专门治理平台。因此，Securiti 往往不是替换一个既有
              SKU，而是试图把几条碎片化工作流合并进一个统一控制平面。尽调含义是，市场规模必须用重叠视角来框定，而不是套一个干净的分析师数字。
