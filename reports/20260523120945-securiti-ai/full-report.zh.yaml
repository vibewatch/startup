  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Securiti 的产品最适合理解为一层企业操作层，位于公司碎片化数据资产与负责安全使用这些数据的团队之间。典型客户工作流从把云平台、SaaS 系统、湖仓、数据仓库和工作流工具接入 Data Command
              Center 开始。平台随后发现数据、分类敏感对象，映射血缘、权限、法规和 AI 使用等上下文，并把这些上下文路由到运营动作中，例如脱敏、权利履行、风险优先级排序、合规评估或 AI
              控制执行。按工作流看，Securiti 不只是隐私门户或 DSPM 扫描器：它试图成为控制平面，让安全、隐私、治理、数据和 AI 团队协调企业数据如何被访问、转换、共享并用于 AI 系统。DSPM
              工作流聚焦发现、分类、态势监控和修复；隐私工作流聚焦数据主体请求、同意和监管义务；治理工作流聚焦目录、血缘、质量和访问；AI 工作流聚焦发现模型和智能体、评估风险、清洗数据并追踪来源。Agent
              Commander 把同一套工作流逻辑延伸到智能体 AI 运营，承诺检测、防护并回滚 AI 驱动的错误。
