            body: >-
              Securiti 的公开牵引图像真实但选择性很强。WebWire 称，截至 2020 年 1 月，平台已处理超过 1 亿个身份。TechCrunch 后来称公司正在赢得七位数和八位数合同，且到 2022 年 10
