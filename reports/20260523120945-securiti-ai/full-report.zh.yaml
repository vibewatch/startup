    rows:
      - - DSPM / 以数据为中心的安全
        - 自动发现、分类、访问智能、错误配置优先级排序、泄露影响分析
        - 通用 SIEM、终端安全、备份、纯 IAM、手工数据清单
        - CISO / 数据安全团队；安全预算
        - 安全驱动交易的核心扩张引擎
      - - 隐私管理 / PrivacyOps
        - DSAR、ROPA、通知、PIA、事件工作流、面向隐私用例的数据映射
        - 手工法律工作流、外部律师、工单系统、单点 DSAR 工具
        - 首席隐私官 / DPO；隐私或合规预算
        - 历史切入楔子，仍是最清晰的工作流 ROI
      - - 数据治理控制平面
        - 数据映射、血缘上下文、数据管护、策略编排、分类一致性
        - 没有主动控制的纯数据目录订阅、仅咨询的治理项目
        - 首席数据官 / 治理办公室；数据预算
        - 重要交叉销售和共享上下文层
      - - AI 治理 / AI 安全
