      - number: '5.4'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              部署画像更偏企业级，而不是自助式。G2 评价数据显示，平均实施周期大约三个月；评论一边认可集成能力和覆盖面，一边要求映射自动化更容易、定制更简单。这和 Securiti 的买方画像一致：大型企业，多云、SaaS
              和数据平台摊子都很大。Securiti 似乎是在数据和 AI 控制最痛的地方切入——大规模 Snowflake、Databricks 治理、ServiceNow 工作流、私有 AI
              构建栈——再横向扩到相邻的合规和治理用例。公开资料里的路线图有三个清晰阶段：PrivacyOps 打底，2022 年扩到 DataControls/Data Security Cloud，2023-2026
              年转向 AI 构建栈集成、私有云 AI 和智能体 AI 治理。HPE Private Cloud AI 合作显示公司在推基础设施层 AI 部署；Databricks 合作则显示它从目录 / 治理走向 AI
              管线赋能。Agent Commander 是最明确的路线图延伸，但 February 2026 公告说未来才会在 Data Command Center 内提供，因此一部分智能体 AI
              控制叙事仍在形成，尚未完全成熟。
