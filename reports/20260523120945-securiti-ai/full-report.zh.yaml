      - number: '6.3'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >-
              具名客户证明存在，但很碎。本轮直接抓取到的最强具名客户标识证据来自 CB Insights 和 FeaturedCustomers，而不是 Securiti 自己的一方客户库。CB Insights 把
              Snowflake 和 Amazon Web Services 列为客户。FeaturedCustomers 把 McClatchy 和 Constellation 列为客户案例；Securiti
              自己的资源页和博客索引则露出 Dye & Durham、Walker & Dunlop、Sanofi 的专题访谈。Dock 的一条具名 G2 评价也给出了少见的具体上线证据，覆盖
              RoPA、隐私报告、供应商评估、DSAR、发现、日常使用和平顺实施体验。


              参考质量差异很大。Snowflake 和 AWS 行只是客户标识级数据库条目，部署细节很少。McClatchy 和 Constellation 更强，因为它们被明确列为案例研究，但抓取页面没有展开完整结果。Dye
              & Durham、Walker & Dunlop、Sanofi 是更新的一方官方参考，不过博客和资源索引只给出标题级客户故事证据。Dock 是最详细的运营证明，但来源是一条评价叙事，而不是正式案例研究。


              主要反向事实是，Securiti 当前官方客户页、通用案例研究页和 LexisNexis 案例 URL 全部返回 404。这明显削弱了一方参考的新鲜度，也让公开证明集比买方通常希望的更依赖第三方聚合器。
