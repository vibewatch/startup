        - 整合产品采用强劲，明显打入 Veeam 账户，且守住高端安全经济性。
      - - 基准
        - Securiti 是真实的品类领导者，但 ARR、利润率和集中度没有公开，市场仍需要战略买家才会支付顶端价格。
        - $1.5B-$1.8B
        - 最符合已实现结果和当前证据质量。
