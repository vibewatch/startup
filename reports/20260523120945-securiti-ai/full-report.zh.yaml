      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              结构性需求驱动很强。DSPM 增长来自多云数据蔓延、非结构化数据增长，以及企业无法靠手工持续发现敏感数据位置和访问者。隐私自动化继续受益于监管扩散，以及在不线性增加人手的前提下落地
              DSAR、映射、事件响应和通知管理的需求。企业数据资产规模和复杂度上升，带动数据治理需求。AI 治理则被新监管、模型风险审查，以及治理影子 AI 和企业智能体的实际需求提前拉动。


              AI 驱动对 Securiti 的 2026 年叙事尤其重要。NIST 的 AI RMF、EU AI Act 和分析师预测都指向同一方向：治理会从松散政策练习，变成有预算的软件品类。IBM 2025
              年泄露研究进一步强化 ROI 逻辑：未治理的 AI 系统与事件和更高泄露成本的关联更不成比例。因此，Securiti 的 Agent Commander 定位——影子 AI 发现、数据上下文映射、运行时护栏和
              AI 合规自动化——是现有数据控制平面逻辑的自然延伸，而不是完全独立的市场赌注。


              约束同样真实。第一，DSPM 和 AI 治理仍是未成熟品类，公开来源中的市场规模估计差距显示市场尚未形成稳定定义。第二，既有厂商已经占住相邻预算线：OneTrust 占隐私，数据治理和目录平台占数据管护，数据安全
              / 原生云套件占监控和访问控制。第三，部署重集成，因为产品必须连接结构化、非结构化、SaaS、云以及现在的 AI 系统。第四，平台优先服务企业；支撑高价值部署的复杂度，也让 SMB
              自助采用不那么自然。因此，最重要的未解尽调问题不只是抽象市场规模争论，而是模块级胜率、按职能划分的预算归属，以及 2026 年 Securiti 究竟通过隐私、安全还是 AI 治理落地最有效。
