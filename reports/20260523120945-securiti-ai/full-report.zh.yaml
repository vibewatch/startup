companyProfile:
  summary: >
    Securiti AI 是一家位于 San Jose 的企业软件公司，由 Rehan Jalil 于 2019 年创立；Jalil 此前担任 Elastica CEO，该公司于 2015 年被 Blue Coat/Symantec
    收购。Securiti 搭建了统一的「Data Command Center」平台，覆盖数据安全态势管理（DSPM）、隐私运营自动化、AI 治理和数据治理。相比更窄的 DSPM 或单一隐私工具，这种广度构成了差异化。公司完成
    Series B（$50M，2020 年 1 月）和 Series C（$75M，2022 年 10 月）后，累计从 General Catalyst、Mayfield、Owl Rock/Blue Owl Capital、Cisco
