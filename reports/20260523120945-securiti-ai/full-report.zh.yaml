        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              被收购前，Securiti 累计融资约 $156M。公司启动时有一轮 Series A（金额未公开），随后在 2020 年 1 月宣布 $50M Series B，由 General Catalyst
              领投，Mayfield 参与；该轮后，已披露资本约 $81M。Series B 新闻稿提到客户采用快速增长、处理超过 1 亿个消费者身份、向 South America、Canada 和 APAC
              国际扩张，以及员工数达到 185 人。

              2022 年 10 月，Securiti 宣布 $75M Series C，由 Owl Rock Capital（Blue Owl Capital 旗下部门）领投，原有投资方 Mayfield 和 General
              Catalyst 跟投。Blue Owl Capital 的 Pravin Vazirani 因该交易加入 Securiti 董事会；公司当时披露约 370 名员工和环比三位数收入增长。TechCrunch 称
              Cisco Investments 也参与过 Securiti 融资。TechCrunch 引用的累计 VC 融资为「超过 $156 million」。未发现 Veeam 交易前存在 Series D 或独立
              $1B+ 估值的公开证据；公司一直保持私有，且未披露收入数据。
