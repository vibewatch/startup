      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Securiti 直接卖进企业数据基础设施里监管最敏感的部分：隐私、数据治理、AI 治理和 AI 安全。它自己的产品页仍以 GDPR、CCPA、数据治理和 EU AI Act
              自动化为锚，这意味着公司既要追踪隐私执法体系，也要追踪欧洲正在落地的新 AI
              治理义务。原则上这可以管理，但会制造一个不断移动的合规负担，因为公司不只是帮助客户应对监管，而是把自己包装成让这些监管可运营化的自动化层。


              更尖锐的法律尾部是 IP 和信任。PatentPC 的法律概览把 OneTrust v. Securiti 列入值得关注的 AI 专利诉讼；即使本章抓取材料没有公开确认当前案卷状态，这也足以把 IP
              诉讼视为仍在场的反向因素。另一个问题是，Securiti 的信任和安全材料强调 SOC 2、ISO、GDPR、CCPA，却没有披露 FedRAMP 授权，这限制了对联邦市场准备度的信心。如果 Securiti
              用在政府或受控数据环境周边，出口管制尽调也更重要；当公司被作为更大 AI 基础设施栈的一部分来营销时尤其如此。
