  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价姿态
        blocks:
          - type: paragraph
            body: >-
              Securiti 的公开变现故事由企业软件驱动，但刻意不透明。公司主页和定价页把 Data Command Center 呈现为统一平台，覆盖 DSPM、AI
              安全、隐私、治理、合规、泄露响应、数据目录、血缘和相关工作流；定价页则明确提供个性化定价和定制报价，而不是公开价目表。TechCrunch 2022 年 Series C
              报道给出最清晰的变现代理指标：管理层称公司已经赢得七位数和八位数合同。这是很强的企业价值信号，但无法揭示 ACV 分布、计费节奏、模块挂载，或这些交易里嵌入了多少专业服务和支持。


              2023 年合作伙伴计划的推出在财务上也重要，因为它显示 Securiti 越来越通过渠道辅助采购变现。管理层称合作伙伴参与 75% 的机会，并将 100%
              企业业务通过合作伙伴交易作为目标，包括转售商和云服务商市场。PeerSpot
              评论摘要也通过灵活许可和企业许可协议，强化了协商式企业模式。公开证据因此支持基于报价的软件订阅、合作伙伴影响，以及可能的跨模块交叉销售，但不足以支撑可辩护的收入结构或收入确认分析。
