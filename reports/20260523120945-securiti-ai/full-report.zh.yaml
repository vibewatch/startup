  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 回溯性建议：已实现退出很强，但不再有新的独立买入入口
        blocks:
          - type: paragraph
            body: >-
              Securiti 应该作为一个已经完成的结果来评估，而不是作为一笔新的私营公司买入决策来评估。尽管底层经济性仍有一部分不透明，已实现事实却异常清楚：Veeam 同意通过现金加股票交易以 $1.725
              billion 收购 Securiti，October 2025 公告，December 2025 交割。相对于退出前披露的约 $156 million
              融资，这是非常强的创投规模结果。但从公开披露质量看，它并不能证明 May 2026 的外部投资者仍能识别独立错价：一是已经没有可买的独立 Securiti 证券，二是公开证据从未披露通常支撑后期 SaaS 承销的
              ARR、NRR、毛利率或集中度画像。因此，合适建议是：对已退出持有人回溯性正面；对判断 Veeam 是否支付了公平战略价格的人，给中等置信度、中高风险；对新的独立投资者则不可操作。
