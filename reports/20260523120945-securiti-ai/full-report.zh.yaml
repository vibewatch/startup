        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              融资历史本身有充分支撑。WebWire 和 IAPP 均报道了 2020 年 1 月 Series B：$50M，由 General Catalyst 领投，Mayfield 参与，使累计融资达到
              $81M。TechCrunch 报道了 2022 年 10 月 Series C：$75M，由 Owl Rock/Blue Owl 领投，Mayfield 和 General Catalyst
              参与，使累计披露资本超过 $155M。到 2025 年 10 月收购公告时，TechCrunch 称 Securiti 累计融资超过 $156M，并将 Cisco Investments
              列为投资者之一。时间线很重要，因为 Series C 资本似乎支撑公司从 2022 年末约 370 人增长到约三年后 600 人规模并完成收购，说明退出前企业并未显得资本饥渴。


              但流动性桥接不公开。检索到的来源没有披露账上现金、债务、月度烧钱速度、现金跑道或下一轮触发条件。收购实质性改变了风险画像：TechCrunch 称 Veeam 自身在 2024 年末完成 $2B 老股交易，估值
              $15B；BusinessWire 和 Help Net Security 则把合并描述为更大数据韧性平台战略的一部分。换句话说，回头看资本充足性可以接受，因为 Securiti 从 Series C
              走到了战略出售，且没有公开 Series D。但这证明的是资本可得性和退出选择权，而非独立现金效率。
