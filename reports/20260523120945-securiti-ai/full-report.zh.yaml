      - - 隐私控制
        - PrivacyOps 基因加治理材料
        - 权利履行、监管工作流自动化、隐私主导的运营模型
        - 核心传统强项
        - 帮助 Securiti 把销售面打开，不局限于纯 DSPM
      - - 访问和掩码控制
        - DSPM 和 Databricks 材料
        - 动态掩码、行 / 列控制、权限评审、最小权限治理
        - 商业化
        - 对受监管数据共享和 AI 训练用例很重要
