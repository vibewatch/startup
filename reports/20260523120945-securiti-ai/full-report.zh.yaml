      - number: '1.5'
        title: Veeam 收购与收购后状态
        blocks:
          - type: paragraph
            body: >
              2025 年 10 月 21 日，Veeam Software（总部位于 Kirkland, Washington，由 Insight Partners 持有）宣布达成最终协议，将以 $1.725 billion
              的现金加股票交易收购 Securiti AI。交易于 2025 年 12 月 11 日交割。Veeam 曾在 2024 年 12 月完成 $2 billion 老股交易，公司估值 $15 billion；收购
              Securiti 的目的，是把数据韧性（备份和恢复）与 DSPM、隐私、治理和 AI 信任能力结合，形成两家公司所称的「首个 Trusted Data Platform」。

              收购让 600 名 Securiti 员工加入 Veeam。Veeam CEO Anand Eswaran 称，交易瞄准的是一个缺口：企业 AI 项目「近 90% 失败，因为驱动 AI
              的数据不可信」。收购后，Securiti 的 Data Command Center 继续作为 Veeam 产品组合中的独立产品存在。Rehan Jalil 加入 Veeam，担任 Security and AI
              总裁。截至 2026 年 5 月，Securiti 作为 Veeam 子公司运营；新产品发布（2026 年 3 月 Agent Commander、2026 年 4 月 HPE Private Cloud AI
              合作）仍使用 Securiti 品牌。收购价格为 Securiti 风险投资方提供了强劲退出，但也消除了独立 IPO 路径的可能性。
