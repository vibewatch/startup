  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: A public rate card, billing cadence, discount ladder, and revenue-recognition bridge for subscriptions, marketplaces, and any services component.
    whyItMatters: Without pricing and recognition detail, investors cannot test revenue quality, ACV distribution, or whether partner- and services-heavy deals distort recurring revenue optics.
    diligencePath: Request SKU-level pricing rules, standard order forms, discount approval policy, deferred-revenue schedule, and a subscription-versus-services revenue split.
    relatedQuestionRefs:
    - QI002
    - QI006
    - QI023
    - QI028
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, GRR, sales-cycle length, and contribution margin after cloud-scanning and support costs.
    whyItMatters: Large contract anecdotes and review snippets are useful, but they do not show whether Securiti scales like premium software or like a heavier-touch implementation business.
    diligencePath: Request full unit-economics model by segment, including CAC, payback, retention, cloud cost of goods sold, support burden, and implementation headcount.
    relatedQuestionRefs:
    - QI005
    - QI008
    - QI009
    - QI014
    - QI024
    relatedTableRefs:
    - TI003
    relatedFigureRefs:
    - FI002
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Current cash balance, debt facilities, monthly burn, covenant constraints, and runway both immediately before and after the Veeam transaction.
    whyItMatters: Funding history and exit value do not prove that Securiti had ample standalone runway or that no hidden financing pressure existed before the sale.
    diligencePath: Request treasury reports, balance-sheet snapshots, debt schedule, monthly cash-flow bridge, and board materials covering financing scenarios.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI026
    - QI028
    relatedTableRefs:
    - TI004
    relatedFigureRefs:
    - FI004
  - type: missing-source
    severity: material
    topic: traction-quality
    missingEvidence: Revenue, ARR, customer-count, renewal, and cohort-level operating metrics that connect visible scale signals to actual financial performance.
    whyItMatters: Headcount, reviews, and contract anecdotes show adoption, but they cannot substitute for recurring-revenue disclosure when setting valuation or downside cases.
    diligencePath: Request revenue by period, ARR bridge, logo count, NRR/GRR, cohort retention, and top-customer concentration.
    relatedQuestionRefs:
    - QI011
    - QI013
    - QI014
    - QI015
    - QI025
    relatedTableRefs:
    - TI005
    relatedFigureRefs:
    - FI003
  - type: missing-source
    severity: material
    topic: channel-economics
    missingEvidence: Direct versus channel mix, marketplace share, partner commissions, reseller discounts, and the extent of services pass-through inside enterprise contracts.
    whyItMatters: With partners involved in most opportunities, channel mechanics could materially affect net revenue realization, margin, and CAC interpretation.
    diligencePath: Request bookings and revenue by direct/channel route, partner fee schedules, marketplace commissions, and implementation responsibility split by deal type.
    relatedQuestionRefs:
    - QI004
    - QI006
    - QI029
    relatedTableRefs:
    - TI002
