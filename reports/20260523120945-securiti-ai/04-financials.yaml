company:
  name: Securiti AI
chapter:
  number: 4
  title: Financials
  summary: 'Securiti AI presents like a large-enterprise, quote-based SaaS platform with strong capital access but thin public operating disclosure. Public sources support a $50M Series B, a $75M Series C, more than $156M raised pre-exit, seven- and eight-figure contract anecdotes, 75% partner involvement in opportunities, and headcount growth from 185 to 370 to 600 employees before the $1.725B Veeam acquisition. What public sources do not support is equally important: no disclosed revenue, ARR, gross margin, CAC, payback, cash, burn, runway, or revenue-recognition bridge. The result is a credible scale story with insufficient transparency to underwrite revenue quality or standalone unit economics from public evidence alone.'
sections:
- id: revenue-model-pricing
  title: Revenue model and pricing posture
  body: 'Securiti''s public monetization story is enterprise-software-led but intentionally nontransparent. The company''s homepage and pricing page present the Data Command Center as a unified platform spanning DSPM, AI security, privacy, governance, compliance, breach response, data catalog, lineage, and related workflows, while the pricing page explicitly offers personalized pricing and custom quotes instead of a public rate card. TechCrunch''s 2022 Series C coverage adds the clearest monetization proxy: management said the company was already winning seven- and eight-figure contracts. That is a strong enterprise-value signal, but it does not reveal ACV distribution, billing cadence, module attach, or how much professional services or support are embedded in those deals.


    The 2023 partner-program launch also matters financially because it shows Securiti increasingly monetizes through channel-assisted procurement. Management said partners were involved in 75% of opportunities and targeted 100% of enterprise business transacting with partners, including resellers and cloud-service-provider marketplaces. PeerSpot review summaries reinforce a negotiated-enterprise model by describing flexible licensing and enterprise license agreements. Public evidence therefore supports quote-based software subscriptions with partner influence and likely cross-sell across modules, but not a defensible revenue-mix or recognition analysis.'
  claimRefs:
