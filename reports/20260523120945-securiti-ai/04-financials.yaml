- id: cost-structure-margin
  title: Cost structure, margin drivers, and service-delivery burden
  body: 'Public evidence points to a software-heavy cost structure, but not to disclosed margins. Securiti sells a hybrid-multicloud data-control platform that scans, classifies, governs, and orchestrates actions across cloud, SaaS, on-prem, and data-platform environments. That architecture implies costs in product engineering, cloud scanning and storage, connectors, AI-driven automation, customer success, and enterprise support—not hardware inventory or manufacturing. The company''s own materials also emphasize automation of breach response, privacy-rights fulfillment, consent, and governance workflows, which in principle should support software-like gross margins once deployment is stable.


    Reviews complicate the simple SaaS story. PeerSpot summarizes recurring complaints around deployment complexity, infrastructure sizing, support needs, and documentation, while G2 and PeerSpot both surface learning-curve, performance, and uptime commentary. PeerSpot also records one ROI data point that scanning 50 terabytes cost nearly half compared with competitors and another that manual effort fell 30-40% with a 70-80% aspiration over time. Those are encouraging efficiency proxies, but they are not a public gross-margin bridge. Securiti discloses no segment gross margin, opex mix, EBITDA, free cash flow, or working-capital metrics, so the margin path remains inferred rather than observed.'
