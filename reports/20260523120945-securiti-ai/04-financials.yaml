- id: capital-adequacy-financing
  title: Capital adequacy and financing dependency
  body: 'The financing history itself is well supported. WebWire and IAPP both reported the January 2020 Series B: $50M led by General Catalyst with Mayfield participating, bringing total funding to $81M. TechCrunch reported the October 2022 Series C: $75M led by Owl Rock/Blue Owl with Mayfield and General Catalyst participating, taking total disclosed capital above $155M. By the October 2025 acquisition announcement, TechCrunch described Securiti as having raised more than $156M overall and named Cisco Investments among investors. The timeline matters because Series C capital appears to have carried the company from roughly 370 employees in late 2022 to a 600-person acquisition close about three years later, suggesting the business was not visibly capital-starved before exit.


    What is not public is the liquidity bridge. No retrieved source discloses cash on hand, debt, monthly burn, runway, or next-round triggers. The acquisition changes that risk profile materially: TechCrunch said Veeam itself had closed a $2B secondary sale at a $15B valuation in late 2024, and BusinessWire plus Help Net Security frame the combination as part of a larger data-resilience platform strategy. In other words, capital adequacy looks acceptable in retrospect because Securiti reached a strategic sale from Series C without a public Series D. But that is evidence of access to capital and exit optionality, not evidence of standalone cash efficiency.'
