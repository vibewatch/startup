- id: public-traction-gaps
  title: Public traction metrics versus private-metric gaps
  body: 'Securiti''s public traction picture is real but oddly selective. WebWire said the platform had processed more than 100 million identities by January 2020. TechCrunch later said the company was winning seven- and eight-figure contracts and had grown to about 370 employees by October 2022. The acquisition close added a 600-employee figure, while review ecosystems provide directional customer-proof: FeaturedCustomers shows 584 reference ratings and a 4.8/5.0 score, and G2 exposes a visible review corpus. Together these are useful signals that Securiti had reached meaningful enterprise scale before the Veeam sale.


    But the missing metrics are the ones a financial underwriter actually needs. No retrieved public source discloses revenue, ARR, NRR, deferred revenue, customer count, gross margin, cash, or burn. Craft''s profile still shows only $81M of total funding, highlighting how stale open-web profiles can be for private companies, while Crunchbase, PitchBook, Gartner, Forrester, and IDC were partially blocked, gated, or reduced to shells in this run. The result is a chapter where headcount, contract-size anecdotes, and review volume are public, but revenue quality and liquidity remain private.'
