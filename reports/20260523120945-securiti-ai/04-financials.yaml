- id: TI005
  title: Public Financial Gaps Table
  enumeration: true
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates the core missing financial disclosures that still block a clean underwriting model after reviewing the retrieved public company, news, review, and database sources.
  columns:
  - Missing metric
  - What public sources show instead
  - Why insufficient
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue / ARR / cohort growth
    - Headcount growth, large-contract anecdotes, reviews, and identity-processing scale
    - Operating scale is not the same as recognized recurring revenue
    - Cannot set valuation or growth assumptions confidently
    - Request monthly revenue, ARR, bookings, and retention cohorts
  - - Gross margin and opex mix
    - Software-heavy architecture plus review commentary about deployment and support burden
    - Architecture and anecdotes do not reveal actual margin shape
    - Cannot assess operating leverage or terminal profile
    - Request gross margin by module plus R&D, S&M, and G&A breakdown
  - - CAC / payback / sales cycle
    - Partners in 75% of opportunities and seven/eight-figure deals
    - Directional GTM strength without economics
    - Cannot determine sales efficiency or capital intensity
    - Request funnel conversion, CAC, payback, cycle length, and quota attainment
  - - Cash / burn / runway / debt
    - Funding rounds, exit value, and acquirer valuation
    - Capital raised is not cash remaining
    - Cannot test downside resilience pre-acquisition
    - Request cash balances, debt schedule, and 13-week plus 12-month cash forecasts
  - - Revenue recognition and deferred revenue
    - Quote-based pricing page and enterprise-license review language
    - No bridge from bookings to recognized revenue
    - Subscription quality and services mix remain opaque
    - Request revenue-recognition memo, deferred revenue, and services vs subscription split
  - - Channel economics and services mix
    - 75% partner involvement and partner-led delivery language
    - No reseller discounts, commissions, or partner-margin data
    - Indirect channel could compress net economics materially
    - Request direct vs channel mix, partner fees, and implementation pass-through rates
  notes: These are the minimum missing inputs that prevent this chapter from moving from directional confidence to fully underwritten financial conviction.
