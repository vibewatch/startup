- id: TI001
  title: Revenue Streams Table
  enumeration: true
  enumerationScope:
    coverage: exhaustive
    basis: Covers the monetization surfaces explicitly visible in retrieved public sources as of 2026-05-23, including official pricing pages, product pages, partner disclosures, and review-derived implementation signals.
  columns:
  - Revenue stream
  - Public evidence
  - Pricing posture
  - Revenue-recognition read
  - Diligence ask
  rows:
  - - Platform subscription / enterprise license
    - Pricing page offers personalized pricing for the Data Command Center rather than SKU-level list prices.
    - Custom quote / enterprise negotiation
    - Likely recurring software revenue, but billing cadence is not disclosed.
    - Provide ARR by module, ACV bands, and annual vs multi-year billing mix.
  - - Module and use-case cross-sell
    - Official pages market DSPM, AI security, privacy, compliance, breach response, catalog, and lineage under one platform.
    - Bundle or module attach likely negotiated case by case
    - Public sources do not disclose module-level revenue mix.
    - Break out revenue by module family and attach rates.
  - - Partner-assisted enterprise transactions
    - Partner release says Securiti involves partners in 75% of opportunities and is shifting to channel-first.
    - Channel-assisted enterprise pricing with potential reseller discounts
    - Direct versus indirect net revenue treatment is not disclosed.
    - Disclose direct/channel split and partner discount structure.
  - - Marketplace-related procurement
    - Partner release targets 100% of enterprise business transacting with partners including cloud service provider marketplaces.
    - Marketplace procurement likely available in some deals
    - Marketplace fees or commissions are not disclosed.
    - Quantify marketplace GMV, net revenue, and commission burden.
  - - Implementation / support influence
    - PeerSpot and G2 summarize deployment complexity, support needs, and documentation gaps.
    - May be bundled into enterprise licenses or sold through partner services
    - No public split between subscription and services/support revenue.
    - Provide professional-services revenue share and services margin.
  notes: Public evidence supports a software-led, quote-based enterprise model with channel influence, but not a clean subscription-versus-services revenue bridge.
