    "title": "Customers",
    "summary": "Public evidence supports an enterprise-heavy Securiti customer base concentrated in large, regulated, and data-intensive organizations reached both directly and through system-integrator ecosystems. The visible proof set is good on satisfaction and named references, but weak on official first-party customer-page freshness, true customer-count disclosure, retention cohorts, and concentration metrics."
