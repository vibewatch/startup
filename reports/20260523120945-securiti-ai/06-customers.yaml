    {
      "id": "named-customer-proof",
      "title": "Named Customer Proof and Reference Quality",
      "body": "Named customer proof exists, but it is fragmented. The strongest directly fetched named-logo evidence in this run comes from CB Insights and FeaturedCustomers rather than from Securiti’s own first-party customer library. CB Insights lists Snowflake and Amazon Web Services as customers. FeaturedCustomers lists McClatchy and Constellation as customer case studies, while Securiti’s own resources and blog indexes surface spotlight talks with Dye & Durham, Walker & Dunlop, and Sanofi. A named G2 review from Dock also provides unusually concrete proof of live usage, covering RoPA, privacy reports, vendor assessments, DSARs, discovery, daily usage, and a smooth implementation experience.\n\nReference quality varies widely. The Snowflake and AWS rows are logo-level database listings with little deployment detail. McClatchy and Constellation are stronger because they are explicitly listed as case studies, but the fetched page does not expose full outcomes. Dye & Durham, Walker & Dunlop, and Sanofi are fresher official references, yet the blog and resources indexes only show headline-level customer-story evidence. Dock is the most detailed operational proof, but it comes from a single review-source narrative rather than a formal case study.\n\nThe main adverse fact is that Securiti’s current official customers page, generic case-studies page, and LexisNexis case-study URL all returned 404. That materially weakens first-party reference freshness and makes the public proof set more dependent on third-party aggregators than buyers would usually prefer.",
