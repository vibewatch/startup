    {
      "id": "retention-repeat-usage-and-satisfaction",
      "title": "Retention, Repeat Usage, and Satisfaction",
      "body": "Public satisfaction signals are directionally strong. Securiti’s June 2024 Gartner-based announcement reported 95% willingness to recommend and 4.7 out of 5 ratings across product capabilities, sales, deployment, and support experiences. G2’s fetched page showed a 4.7 rating across 76 reviews and an average implementation time of about three months. FeaturedCustomers displayed a 4.8 out of 5 reference rating based on 584 reference ratings, plus a meaningful library of testimonials and customer videos. These are not retention metrics, but they do suggest customers are generally willing to advocate for the platform.\n\nThere is also concrete repeat-usage evidence. The Dock G2 review describes everyday usage for privacy-governance workflows, while the 12-week, 250-repository testimonial suggests at least one deployment became broad enough to connect a very large number of systems. At the same time, PeerSpot reviews are mixed rather than uniformly positive: users praise discovery, mapping, dashboards, and privacy-control depth, but they also complain about deployment difficulty, cost estimation, technical support, and documentation.\n\nThe biggest diligence gap is that none of the public sources reviewed here disclose NRR, GRR, customer churn, renewal rates, contract lengths, or cohort curves. Public evidence can show that customers like the product; it cannot yet show how durable the commercial relationships are.",
