    {
      "id": "expansion-and-concentration",
      "title": "Expansion and Concentration",
      "body": "Securiti’s public land-and-expand story is channel- and ecosystem-driven. The 2023 Unify Partner Program release said partners were already involved in 75% of opportunities and that management wanted 100% of enterprise business transacting through partners, including resellers and cloud marketplaces. Accenture, HCL, Guidepoint, Optiv, and Trace3 were named as key allies, and the program explicitly rewards system integrators for embedding Securiti into existing Snowflake, Databricks, and Confluent estates. That implies a classic enterprise-control-platform expansion motion: land into a messy existing data stack, then broaden across security, privacy, governance, and AI workflows as more systems are connected.\n\nThe HPE ecosystem article reinforces that interpretation by framing Securiti as the policy and governance layer that helps customers move from AI pilots to production in regulated environments. This is strategically attractive because it creates multiple expansion vectors — more repositories, more governance use cases, more AI workflows, and more partner-led deployment opportunities.\n\nThe counterweight is concentration opacity. No public source fetched in this run disclosed largest-account exposure, top-10 revenue share, or any clean concentration metric. Combined with broken first-party customer-library pages, that means buyers can understand the channel logic and expansion thesis, but not yet quantify customer concentration or true renewal quality.",
