  "sections": [
    {
      "id": "customer-base-segmentation",
      "title": "Customer Base Segmentation",
      "body": "Public evidence points to an enterprise-heavy customer base rather than a self-serve long tail. Securiti’s own partner and customer-reference materials repeatedly frame the platform around large global enterprises, while the June 2024 Gartner-based announcement says reviewed customers span small and large organizations globally with revenue from $50 million to more than $10 billion. The same release also shows vertical diversity across finance, retail, technology, manufacturing, and travel, which is the clearest public segment map available in this run.\n\nNamed public logos are strongest in data-platform and cloud-adjacent buyers: CB Insights lists Snowflake and Amazon Web Services as customers. Securiti’s 2026 resources and blog indexes add enterprise customer-story signals for Dye & Durham, Walker & Dunlop, and Sanofi, while the HPE ecosystem article explicitly frames healthcare, financial services, manufacturing, and public sector deployments as relevant use cases for the combined HPE-NVIDIA-Veeam Securiti stack. Taken together, the buyer is usually a security, privacy, data-governance, or AI-governance leader; the day-to-day users are data, security, privacy, and platform teams; and the economic buyer is an enterprise IT or data-control budget owner.\n\nWhat remains missing is a true population split by geography, ACV band, or customer-count share by segment. The public corpus shows who Securiti wants and some of who it wins, but not a quantified segment mix.",
