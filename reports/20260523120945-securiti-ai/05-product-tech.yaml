- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Dimension
  - Public evidence
  - Mechanism / control
  - Status
  - Implication
  rows:
  - - Certification posture
    - SOC 2 Type II press release; ISO/SOC 2 whitepaper; trust center
    - Formal assurance and standards mapping used in enterprise procurement
    - Directionally strong, but some detail gated
    - Positive for enterprise trust, but diligence still needs attestation packets
  - - AI security controls
    - AI Security and Databricks/HPE materials
    - OWASP Top 10 for LLMs alignment, data sanitization, LLM firewalling, entitlement and provenance controls
    - Commercial and actively marketed
    - Supports safe-AI narrative better than generic governance-only vendors
  - - Privacy controls
    - PrivacyOps heritage plus governance materials
    - Rights fulfillment, regulatory workflow automation, privacy-led operating model
    - Core legacy strength
    - Helps Securiti sell beyond pure DSPM
  - - Access and masking controls
    - DSPM and Databricks materials
    - Dynamic masking, row/column control, entitlement reviews, least-privilege governance
    - Commercial
    - Important for regulated data sharing and AI training use cases
  - - Customer quality signal
    - G2 4.7/5 on 76 archived reviews; Gartner review presence
    - Review platforms show real deployment evidence and buyer feedback
    - Positive overall
    - Suggests product-market resonance in enterprise accounts
  - - Implementation burden
    - G2 average time to implement = 3 months; reviewer requests for easier mapping/customization
    - Enterprise deployment requires setup, integration, and tuning
    - Meaningful friction
    - Can slow sales cycles or expand services load
  - - Public trust transparency
    - Trust center exists but scraped public detail is thin
    - Trust/procurement surface exists, but deeper artifacts appear gated
    - Incomplete public evidence
    - Customers likely need direct diligence access for final approval
