  evidenceGaps:
  - type: private-evidence-only
    severity: minor
    topic: internal-roadmap-granularity
    missingEvidence: Public sources show milestone launches and partnerships, but not detailed internal release sequencing, GA dates for every AI control, or private feature-flag maturity.
    whyItMatters: Roadmap quality matters because Securiti's moat increasingly depends on execution in AI governance and agentic-AI controls rather than only today's DSPM breadth.
    diligencePath: Request detailed product roadmap, shipped-vs-preview feature matrix, and customer-by-customer adoption data for Agent Commander and adjacent AI controls.
    relatedQuestionRefs:
    - QE014
    - QE022
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: trust-attestation-depth
    missingEvidence: The public trust surface confirms procurement intent, but detailed certification packets, audit scopes, penetration-testing history, and customer security questionnaires are not publicly exposed.
    whyItMatters: Large-enterprise buyers will still need direct attestation evidence before treating Securiti's trust posture as fully verified, especially for highly regulated deployments.
    diligencePath: Request SOC 2 report, ISO certificate set, penetration-test summary, security questionnaire responses, and any roadmap for additional certifications such as sector-specific attestations.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE004
