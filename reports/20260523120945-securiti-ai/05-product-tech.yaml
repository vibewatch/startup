- id: TE005
  title: Roadmap / Release / Development-Stage Table
  columns:
  - Date / period
  - Initiative
  - What changed
  - Stage
  - Why it matters
  - Evidence status
  enumerationScope:
    coverage: partial
    basis: Covers the public roadmap and release markers visible in press releases, review evidence, and partner pages; internal sequencing and GA dates remain undisclosed.
  rows:
  - - 2019-2020
    - PrivacyOps foundation
    - Company and product positioned around automating compliance with privacy regulations
    - Historical / commercial
    - Created initial workflow and buyer wedge
    - Public evidence
  - - 2022-10
    - DataControls / Data Security Cloud
    - Platform expands into broad data security, governance, and compliance across major clouds and data systems
    - Commercial
    - Marks move from privacy point-solution toward control plane
    - Public evidence
  - - 2023-12
    - Databricks strategic integration (Unity Catalog phase)
    - Partnership emphasizes data intelligence, discovery, masking, and governance around Data Lakehouse / Unity Catalog
    - Commercial integration
    - Signals deeper platform relevance inside modern data stacks
    - Public evidence
  - - 2024-11
    - HPE Private Cloud AI / Gencore AI integration
    - Adds private-cloud AI build-stack story with knowledge-graph-driven controls and NVIDIA-backed infrastructure context
    - Commercial partnership / expansion
    - Pushes product toward enterprise AI infrastructure and agent workflows
    - Public evidence
  - - 2025-02
    - Databricks Mosaic AI + Delta tables integration
    - Extends from governance into curated AI pipelines and GenAI application development
    - Commercial expansion
    - Shows move into model-building path, not just guardrails
    - Public evidence
  - - 2025-12 snapshot
    - High customer proof and enterprise rollout pattern
    - G2 archive shows 76 reviews and average 3-month implementation time
    - Scaling adoption
    - Implies product maturity with non-trivial deployment effort
    - Public evidence
  - - 2026-02
    - Agent Commander announced
    - Unified AI risk, protection, and rollback product announced after Veeam acquisition
    - Emerging / future release
    - Most explicit agentic-AI roadmap step
    - Public evidence
  - - 2026 onward
    - Agentic-AI operating controls inside Data Command Center
    - Rollback/undo logic, AI mistake handling, and deeper agent telemetry expected to become integrated platform capability
    - Roadmap / not fully proven
    - Potentially expands moat if executed, but current maturity remains emerging
    - Public evidence + still open
  notes: Roadmap table is intentionally partial and anchored on public launches/partnerships rather than internal sprint plans, release trains, or customer-specific feature flags.
