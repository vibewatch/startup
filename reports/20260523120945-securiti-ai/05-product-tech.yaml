- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - Workflow / use case
  - Primary user
  - Trigger
  - Core steps
  - Completion signal
  - Key dependency
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates the main public workflows marketed across DSPM, privacy automation, governance, and AI control surfaces rather than every sub-feature microflow.
  rows:
  - - Multicloud sensitive-data discovery
    - Security / data governance
    - New cloud or data platform connected
    - Connect source -> discover assets -> classify sensitive data -> prioritize risks -> route control actions
    - Sensitive-data map and posture baseline created
    - Connector health and metadata coverage
  - - Privacy rights fulfillment
    - Privacy operations
    - DSAR / deletion / access request
    - Locate person-related data -> assemble context -> run workflow approvals -> fulfill request -> log evidence
    - Request fulfilled with audit trail
    - Identity resolution across connected systems
  - - Access-governance remediation
    - Security / data owner
    - Over-privileged access or sensitive exposure identified
    - Map entitlements -> inspect access patterns -> define least-privilege policy -> mask/filter or remediate
    - Access reduced or policy enforced
    - Accurate entitlement metadata
  - - Snowflake scaled control management
    - Data platform / security
    - Large multi-account Snowflake deployment
    - Find sensitive data -> apply policies -> manage controls from central command center -> monitor consistency
    - Cross-account data policy applied
    - Snowflake native controls plus Securiti connector
  - - Databricks AI data pipeline curation
    - AI / data engineering
    - Need enterprise data for model training, tuning, or RAG
    - Select datasets -> sanitize sensitive content -> sync curated data to Delta tables -> apply governance controls -> trace provenance
    - Governed training/tuning dataset available
    - Databricks Mosaic AI / Delta / Unity Catalog integration
  - - ServiceNow workflowing and escalation
    - IT / risk / compliance operations
    - Risk, privacy, or governance issue requires action
    - Open ticket/work item -> route to owner -> track remediation -> close with evidence
    - Operational issue closed in workflow system
    - ServiceNow connector and process ownership
  - - Agentic-AI risk response
    - Security / AI operations
    - Unsafe agent behavior or AI mistake detected
    - Detect risk -> inspect impacted data/agent context -> protect system -> initiate rollback / undo flow
    - Risk contained or damage reversed
    - Agent Commander availability and telemetry
  notes: Workflow table is exhaustive for the major externally documented operating flows, but individual customer implementations will add internal approvals, custom policies, and service tickets.
