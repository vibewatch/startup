callouts:
  - calloutType: strength
    title: Large and Clean Exit Validates Platform Thesis
    body: >
      The $1.725B Veeam acquisition—closing in under six years from founding—validates Securiti's
      positioning at the intersection of DSPM, privacy, and AI governance. The deal is one of the
      largest data-security exits of 2025 and demonstrates strong strategic demand for unified data
      control platforms.
    claimRefs: [CO033, CO034, CO035]

  - calloutType: risk
    title: Loss of Independent Company Status
    body: >
      The Veeam acquisition eliminates any independent IPO path and places Securiti's product roadmap,
      go-to-market, and pricing under Veeam/Insight Partners control. Enterprise buyers evaluating
      Securiti should assess Veeam integration risk and the potential for product bundling or
      rationalization under the new parent company.
    claimRefs: [CO038, CO039, CO040]

  - calloutType: insight
    title: No Series D Evidence; Screening Note of $1B Standalone Valuation Is Unsubstantiated
    body: >
      Research found no public evidence of a Series D financing round or a standalone venture valuation
      at or above $1 billion prior to the Veeam acquisition. The company was last financed at Series C
      in October 2022. The $1.725B acquisition price does not imply a prior $1B standalone valuation
      was ever confirmed publicly.
    claimRefs: [CO044, CO045]

