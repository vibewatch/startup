company:
  name: Securiti AI

chapter:
  number: 1
  title: Company Overview
  summary: >
    Securiti AI, founded in 2019 in San Jose by CEO Rehan Jalil, built the Data Command Center platform
    for unified data security, privacy, governance, and compliance across hybrid multicloud environments.
    After raising $156M+ across Series A through C, the company was acquired by Veeam Software for $1.725B
    in December 2025, marking one of the largest data-security exits of the year. As of May 2026, Securiti
    operates as a Veeam subsidiary with Jalil serving as President of Security and AI at Veeam.

sections:
  - id: identity-and-business-model
    title: Company Identity and Business Model
    body: >
      Securiti AI (legally Securiti, Inc.) is a cybersecurity and data governance software company
      headquartered at 300 Santana Row, Suite 450, San Jose, California. The company was founded in 2019
      with the original mission of automating privacy operations ("PrivacyOps") for enterprises navigating
      GDPR, CCPA, and evolving global data regulations. Over time, the platform expanded into a broader
      Data Command Center offering: a unified intelligence and control layer for data security posture
      management (DSPM), privacy automation, AI governance, and compliance across hybrid multicloud,
      SaaS, and on-premises environments.

      The core product is powered by the Data Command Graph, a proprietary knowledge-graph engine that
      automatically captures contextual metadata about data and AI objects across cloud providers (AWS,
      Microsoft Azure, Google Cloud), data platforms (Snowflake, Databricks), and SaaS applications
      (Salesforce, Box). As of March 2026—following Veeam's completed acquisition—the company launched
      Agent Commander, an AI security and governance product for enterprise AI agent deployments.
      Securiti primarily targets large enterprises with complex hybrid cloud footprints requiring unified
      data controls, selling through a channel-first model that involves partners in at least 75% of
      enterprise opportunities.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founders-and-leadership
    title: Founders and Leadership Team
    body: >
      Securiti was founded by Rehan Jalil, a Pakistani-American entrepreneur educated at NED University
      of Engineering and Technology in Karachi before immigrating to Silicon Valley. Jalil previously served
      as CEO of Elastica (acquired by Blue Coat Systems in 2015), giving him direct enterprise cloud security
      experience before founding Securiti. At Securiti, Jalil served as President and CEO until the Veeam
      acquisition, at which point he transitioned to President of Security and AI at Veeam.

      The founding and executive team at Series C (October 2022) included Chaks Chigurupati as Chief
      Technology Officer, Michael Rinehart as Vice President of Artificial Intelligence, and Tanveer Zamir
      as Vice President of Engineering. Michelle Graff served as VP of Channels and Alliances and was
      the public face of the 2023 Unify Partner Program. The company's leadership depth in cloud security
      and data engineering is generally viewed as a competitive strength; no significant publicly reported
      leadership exits or controversies were identified during this research cycle, though governance
      details such as board composition remain opaque for a private company.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002]

  - id: funding-history-and-investors
    title: Funding History and Capital Structure
    body: >
      Securiti raised approximately $156M in venture capital across multiple rounds before its acquisition.
      The company launched with a Series A (amount not publicly disclosed) and announced a $50M Series B in
      January 2020 led by General Catalyst with participation from Mayfield; that round brought total
      disclosed capital to approximately $81M. The Series B press release cited rapid customer adoption,
      processing of over 100 million consumer identities, international expansion into South America,
      Canada, and APAC, and headcount of 185 employees.

      In October 2022, Securiti announced a $75M Series C led by Owl Rock Capital (a division of Blue Owl
      Capital), with existing investors Mayfield and General Catalyst participating. Blue Owl Capital's
      Pravin Vazirani joined Securiti's board as part of the deal, and the company reported approximately
      370 employees and triple-digit quarter-over-quarter revenue growth at the time. Cisco Investments
      also participated in Securiti's funding history according to TechCrunch. Total VC raised is cited
      by TechCrunch as "more than $156 million." No public evidence was found for a Series D or a
      standalone $1B+ valuation prior to the Veeam transaction; the company remained private and
      disclosed no revenue figures.
    claimRefs: [CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: scale-and-market-position
    title: Operational Scale and Market Position
    body: >
      At the time of the Veeam acquisition (December 2025), Securiti had approximately 600 employees,
      all of whom joined Veeam as part of the transaction. The company's product covered 1,000+ pre-built
      integrations across hybrid multicloud and SaaS environments. FeaturedCustomers reported 584 aggregate
      customer reference ratings for Securiti with a 4.8/5.0 score. PeerSpot highlighted Securiti's
      automated data discovery and classification, AI-enabled privacy automation, and real-time compliance
      tracking as top-rated features, while noting complexity in large unstructured data environments and
      challenges in automated assessment workflows as areas for improvement.

      Industry analysts recognized Securiti as a leader in DSPM: the company cited GigaOm Radar rankings
      (top DSPM rating), a Forrester Wave Leader designation (Highest Score in Strategy for Data Resilience),
      and G2 Winter 2026 ranking as the #1 AI-SPM (AI Security Posture Management) platform. Prior to the
      acquisition, the company targeted seven- and eight-figure enterprise contracts and operated a
      channel-first go-to-market model through its 2023 Unify Partner Program. Accenture was named
      Securiti's 2025 Partner of the Year in March 2026.
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032]

  - id: veeam-acquisition-and-post-acquisition
    title: Veeam Acquisition and Post-Acquisition Status
    body: >
      On October 21, "2025", Veeam Software (headquartered in Kirkland, Washington, owned by Insight
      Partners) announced a definitive agreement to acquire Securiti AI for $1.725 billion in a cash-and-stock
      transaction. The deal closed on December 11, 2025. Veeam, which had closed a $2 billion secondary sale
      in December 2024 valuing itself at $15 billion, acquired Securiti to combine data resilience (backup
      and recovery) with DSPM, privacy, governance, and AI trust capabilities into what both companies
      described as "the first Trusted Data Platform."

      The acquisition brought 600 Securiti employees to Veeam and was described by Veeam CEO Anand Eswaran
      as targeting the gap where "nearly 90% of enterprise [AI] initiatives fail because the data powering
      AI cannot be trusted." Post-acquisition, Securiti's Data Command Center continues as a standalone
      product within Veeam's portfolio. Rehan Jalil joined Veeam as President of Security and AI.
      As of May 2026, Securiti operates as a Veeam subsidiary; new product launches (Agent Commander,
      March 2026; HPE Private Cloud AI partnership, April 2026) continue under the Securiti brand.
      The acquisition price represents a strong exit for Securiti's venture investors but eliminates
      any prospect of an independent IPO path.
    claimRefs: [CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040]
    tableRefs: [TO004]
    figureRefs: [FO001]

