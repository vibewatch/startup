        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Securiti raised approximately $156M in venture capital across multiple rounds before its acquisition. The
              company launched with a Series A (amount not publicly disclosed) and announced a $50M Series B in January
