      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >
              Securiti was founded by Rehan Jalil, a Pakistani-American entrepreneur educated at NED University of
              Engineering and Technology in Karachi before immigrating to Silicon Valley. Jalil previously served as CEO
              of Elastica (acquired by Blue Coat Systems in 2015), giving him direct enterprise cloud security
              experience before founding Securiti. At Securiti, Jalil served as President and CEO until the Veeam
              acquisition, at which point he transitioned to President of Security and AI at Veeam.

              The founding and executive team at Series C (October 2022) included Chaks Chigurupati as Chief Technology
              Officer, Michael Rinehart as Vice President of Artificial Intelligence, and Tanveer Zamir as Vice
              President of Engineering. Michelle Graff served as VP of Channels and Alliances and was the public face of
              the 2023 Unify Partner Program. The company's leadership depth in cloud security and data engineering is
              generally viewed as a competitive strength; no significant publicly reported leadership exits or
              controversies were identified during this research cycle, though governance details such as board
              composition remain opaque for a private company.
