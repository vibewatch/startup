      - number: '8.5'
        title: The remaining valuation work is mostly about what public evidence still cannot answer
        blocks:
          - type: paragraph
            body: >-
              The main unresolved work is not deciding whether Securiti mattered; the exit already answered that. The
              unresolved work is deciding how much of the $1.725 billion price was supported by durable standalone
              economics versus strategic scarcity, buyer-specific synergies, and timing. The thesis breaks if
              undisclosed ARR at sale was materially below what premium-security multiples would require, if cross-sell
              into the Veeam base fails to materialize, if large-platform alternatives compress pricing faster than
              expected, or if integration slows product velocity enough to undercut the AI-control-plane thesis. The
              final diligence asks therefore center on the hidden revenue base, customer concentration, renewal quality,
              the exact cap table and waterfall, and a post-close integration scorecard. Until those are known, the
              prudent valuation posture remains: strong realized outcome, strategically plausible acquisition,
              incomplete precision.
            claimRefs:
              - CV014
              - CV021
