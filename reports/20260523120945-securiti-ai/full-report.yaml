  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Legal / IP escalation
        - OneTrust case status or any new IP complaint
        - Any injunction motion, adverse ruling, or settlement that limits product behavior
        - Pause the thesis until counsel quantifies roadmap and gross-margin impact.
      - - Own-platform trust failure
        - Security incident or public customer-notification event
        - Confirmed breach, sustained outage, or repeated Sev-1 reliability regression
        - Treat as a thesis break because product credibility is the moat.
      - - Partner concentration
        - Partner-led pipeline share and co-sell conversion
        - Meaningful pipeline drop from top SI relationships or evidence that hyperscaler bundles displace Securiti
        - Re-cut growth assumptions and channel strategy before underwriting expansion.
      - - Integration execution
        - Leadership continuity and release cadence
        - Loss of key leaders, delayed roadmap, or visible product re-platforming slippage
        - Assume higher retention cost and lower delivery velocity in the model.
      - - Federal / export readiness
        - FedRAMP and export-control diligence outcomes
        - No credible federal-readiness path and no export-control operating model for sensitive accounts
        - Exclude federal upside from the case and narrow regulated-market assumptions.
      - - Commercial price pressure
        - Win rates and discounting versus Macie / Purview / broader suites
        - Persistent discounting or lower win rates against bundled competitors
        - Lower long-term margin and NRR expectations; demand higher execution proof.
