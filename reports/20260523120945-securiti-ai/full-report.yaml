        title: Exhibits
        blocks:
          - type: callout
            title: Securiti's real market is the data-and-AI control plane, not one narrow SKU
            body: >-
              The strongest reading of the market is cross-category convergence: privacy, governance, DSPM, and AI
              guardrails increasingly share the same underlying data map and policy context. That is why a unified
              platform can earn several budget conversations even when no single category is fully mature.
            calloutType: insight
