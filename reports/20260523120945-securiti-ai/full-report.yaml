  - id: TV004
    title: Comparable Valuation Table
    enumeration: true
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the chapter's selected public-company, private, M&A, and milestone references: Rubrik, Varonis,
        Commvault-like public guardrails, Cohesity-style private scale, early DSPM tuck-ins, Securiti's own 2022
        financing anchor, and the realized Veeam exit.
    columns:
      - Reference
      - Status / stage
      - Observed or indicative valuation lens
      - Why relevant
      - Key caveat
      - Read-through for Securiti
    rows:
      - - Rubrik
        - Public data-security / resilience company
        - Public-market context in this report uses a roughly high-single-digit EV/ARR band
        - Relevant because it combines data protection, security, and public disclosure in an adjacent category.
        - Public company with fuller financial disclosure and broader platform maturity than Securiti had at exit.
        - Useful upper-mid public guardrail, not a precise plug-in multiple.
      - - Varonis
        - Public data and AI security vendor
        - Public-market context in this report uses a roughly mid- to high-single-digit EV/ARR band
        - Relevant because it is a public data-centric security asset with AI-security positioning.
        - Broader, older, and much more disclosed than Securiti.
        - Supports a disciplined public-comp floor and highlights how much disclosure Securiti lacked.
      - - Commvault-style public data-resilience floor
        - Public incumbent reference
        - Lower public EV/ARR guardrail than premium security names
        - >-
          Useful as a reminder that slower-growth data infrastructure names can trade far below strategic private
          prices.
        - Not a DSPM-native comparison and structurally more mature.
        - Shows why $1.725B needed strategic scarcity and growth expectations, not just a generic backup multiple.
      - - Cohesity / Veritas scale reference
        - Private strategic-scale data-resilience reference
        - Multi-billion-dollar private valuation context
        - >-
          Relevant because it marks what large private data-infrastructure platforms can be worth in adjacent
          categories.
        - Different product mix and business model than Securiti.
        - Helps frame why Veeam could justify paying billions for a strategic data-layer asset.
      - - Early DSPM tuck-ins (Dig / Laminar / Normalyze)
        - Earlier-category M&A cluster
        - Smaller, often sub-$500M or undisclosed reference set in report context
        - Relevant because these deals represent earlier or narrower DSPM exits.
        - Open-web corroboration is uneven because several URLs in this run were stale or inaccessible.
        - Suggests Securiti realized a category-leader premium above smaller tuck-in outcomes.
      - - Lacework / Fortinet distressed-cyber floor
        - Distressed cybersecurity M&A reference
        - Report-context range roughly in the low hundreds of millions
        - Useful downside reminder that late-stage cyber assets can clear far below private expectations.
        - Different category, different distress context, and not a clean DSPM analogue.
        - Acts as a bear-case warning rather than as a central comp.
      - - Securiti Series C implied anchor
        - Private financing milestone
        - >-
          If 2022 ARR was roughly $20M-$40M and security SaaS traded around 8x-15x ARR, implied post-money could have
          been roughly $200M-$600M
        - Relevant because it brackets how much value may have been created from the last known major financing to exit.
        - This row is assumption-driven because public evidence does not disclose the actual Series C post-money or ARR.
        - Supports substantial appreciation into the 2025 exit without pretending to know the exact 2022 mark.
      - - Securiti → Veeam actual exit
        - Realized strategic transaction
        - $1.725B cash-and-stock acquisition
        - This is the observed clearing price and therefore the single strongest valuation anchor in the chapter.
        - Strategic price can exceed what a purely financial buyer would pay.
        - Best retrospective anchor; all other comps are only cross-checks around it.
    notes: >-
      The comparable set is intentionally mixed because no single clean standalone peer exists. Public comps are used as
      guardrails, earlier DSPM deals as directional category context, and Securiti's own financing plus exit as the most
