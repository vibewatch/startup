      - Current read
      - Why
      - Decision implication
      - What would change the view
    rows:
      - - Recommendation
        - retrospective-positive / no standalone entry
        - >-
          The company already exited at $1.725B, so the question is outcome quality and acquirer logic rather than
          whether to buy a private security today.
        - Do not frame this as a current buy/hold/sell call on independent Securiti equity.
        - A new standalone spinout, carve-out, or separately priced tracking security.
      - - Confidence
        - medium
        - Outcome facts are strong, but exact ARR, margin, retention, and cap-table terms remain private.
        - Use broad ranges and strategic logic instead of point-estimate precision.
        - Management-grade disclosure on revenue quality and exit-waterfall terms.
      - - Risk rating
        - medium-high
        - >-
          The realized outcome is de-risked, but the fairness of the price remains sensitive to hidden economics and
          integration execution.
        - Treat valuation as execution-sensitive rather than obviously cheap.
        - Clean evidence that post-close cross-sell and product integration are outperforming plan.
      - - Valuation stance
        - strategically justified, financially full
        - >-
          The price looks sensible for a strategic buyer with scale, but rich for outsiders lacking internal revenue and
          synergy data.
        - Anchor on the realized exit, not on unsupported upside extrapolation.
        - Proof that disclosed or inferred ARR at sale supported premium-security multiples without heroic assumptions.
      - - Return / hold / exit lens
        - exit realized at ~$1.725B
        - >-
          Against roughly $156M of disclosed capital raised, the exit appears strong for venture investors; future
          upside now belongs to Veeam holders.
        - Retrospective analysis favors existing investors, not new standalone capital.
        - Exact waterfall and investor-by-investor proceeds schedule.
      - - Portfolio implication
        - evaluate via Veeam integration
        - The remaining value-creation question is whether Veeam turns Securiti into a larger safe-AI control plane.
        - Track integration milestones and product attach inside Veeam, not independent fundraising.
        - Visible post-close ARR attach, retention, and platform adoption evidence.
