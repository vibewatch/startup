      - number: '3.2'
        title: Competitor Profiles — Scope, Scale Signal, Pricing Posture, and Strategic Direction
        blocks:
          - type: paragraph
            body: >-
              Among the direct DSPM set, Cyera and Sentra present themselves as security-first platforms adapted to the
              AI era, while BigID and Privacera blend security, governance, and access control into broader data
              platforms. Varonis is strategically different from the pure-play startups because it enters from an
              already-established enterprise security footprint and now markets both data security and AI security. This
              matters commercially: Securiti is not only competing against startup specialists, but also against vendors
              that can land from adjacent budgets or pre-existing enterprise relationships.


              The privacy cohort is equally consequential. OneTrust remains the clearest incumbent for privacy-led
              buying motions, but its public messaging now connects privacy, data use governance, and AI-ready
              governance on one platform. TrustArc has expanded the same way by marketing AI governance and responsible
              AI modules inside its privacy solutions. DataGrail is positioned more toward lean privacy teams seeking
              workflow automation, while Osano stays simpler and more compliance-first. For Securiti, those vendors are
              important because they can stop expansion into privacy workflows even if Securiti wins a security-led
              wedge elsewhere.


              AI governance adds a third profile set. Credo AI and Holistic AI are not full DSPM alternatives, but they
              demonstrate that AI governance can be bought as a standalone control layer rather than bundled into a
              broader data platform. Their existence weakens any assumption that AI governance will automatically
              consolidate to Securiti. At the same time, Securiti's own Agent Commander positioning attempts to turn
              that threat into an advantage by linking shadow AI discovery, SaaS agent security, cloud agent protection,
              and undo / remediation language back to the existing data-control-plane narrative.


              Pricing is mostly opaque across the private-vendor set. Public pages for Securiti, Cyera, BigID, Sentra,
              Privacera, OneTrust, TrustArc, and DataGrail all point buyers into enterprise sales rather than
              transparent list pricing. That opacity is itself a competitive fact: Securiti's relative win rate depends
              heavily on packaging discipline, implementation burden, and bundle economics versus incumbents, not just
              on feature checklists.
