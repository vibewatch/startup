  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Retrospective recommendation: strong realized exit, but no new standalone entry remains'
        blocks:
          - type: paragraph
            body: >-
              Securiti should be evaluated as an already-completed outcome, not as a fresh private-company buy decision.
              The realized fact pattern is unusually clear even though the underlying economics remain partly opaque:
              Veeam agreed to buy Securiti for $1.725 billion in a cash-and-stock transaction, announced the deal in
              October 2025, and closed it in December 2025. Relative to the roughly $156 million of disclosed pre-exit
              funding, that is a very strong venture-scale outcome. Relative to public disclosure quality, however, it
              does not prove that outside investors in May 2026 can still identify an independent mispricing, because
              there is no longer a standalone Securiti security to buy and because public evidence never disclosed the
              ARR, NRR, gross margin, or concentration profile that would normally anchor a late-stage SaaS underwriting
              case. The right recommendation is therefore retrospective-positive for exited holders, medium-confidence
              and medium-high-risk for anyone judging whether Veeam paid a fair strategic price, and non-actionable for
              new standalone investors.
