      - number: '1.5'
        title: Veeam Acquisition and Post-Acquisition Status
        blocks:
          - type: paragraph
            body: >
              On October 21, "2025", Veeam Software (headquartered in Kirkland, Washington, owned by Insight Partners)
              announced a definitive agreement to acquire Securiti AI for $1.725 billion in a cash-and-stock
              transaction. The deal closed on December 11, 2025. Veeam, which had closed a $2 billion secondary sale in
              December 2024 valuing itself at $15 billion, acquired Securiti to combine data resilience (backup and
              recovery) with DSPM, privacy, governance, and AI trust capabilities into what both companies described as
              "the first Trusted Data Platform."

              The acquisition brought 600 Securiti employees to Veeam and was described by Veeam CEO Anand Eswaran as
              targeting the gap where "nearly 90% of enterprise [AI] initiatives fail because the data powering AI
              cannot be trusted." Post-acquisition, Securiti's Data Command Center continues as a standalone product
              within Veeam's portfolio. Rehan Jalil joined Veeam as President of Security and AI. As of May 2026,
              Securiti operates as a Veeam subsidiary; new product launches (Agent Commander, March 2026; HPE Private
              Cloud AI partnership, April 2026) continue under the Securiti brand. The acquisition price represents a
              strong exit for Securiti's venture investors but eliminates any prospect of an independent IPO path.
