  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: |-
              Securiti does not compete in a single mature software category. Its commercial wedge sits across
              four linked buying motions: DSPM for discovery, classification, access risk, misconfiguration,
              and breach response; privacy automation for DSARs, ROPA, notices, incident workflows, and policy
              execution; data-governance control-plane capabilities such as mapping, lineage, and stewardship;
              and AI governance / AI security for shadow-AI discovery, runtime guardrails, and regulatory
              compliance. The official product pages are explicit that the company is selling a data-and-AI
              control layer rather than a single point product.

              That breadth creates both upside and analytical difficulty. Included spend should encompass the
              software budgets that pay for automated data discovery, data mapping, policy enforcement,
              entitlement visibility, privacy workflow orchestration, AI model/agent inventory, runtime data
              controls, and compliance reporting. Excluded spend should include broad IAM/SSO, generic SIEM,
              endpoint security, backup, generic data-catalog subscriptions without active controls, and pure
              consulting spend. Those excluded categories remain substitutes or complements, but they do not
              map cleanly into Securiti's direct software wedge.

              Status-quo substitutes are heterogeneous. In privacy programs, the practical substitute is often
              OneTrust or internal workflow plus legal/compliance labor. In DSPM and data-centric security,
              substitutes include Varonis, native hyperscaler controls, CNAPP/CSPM modules, and manual data
              inventory processes. In AI governance, many enterprises still rely on policy documents, ad hoc
              review committees, or scattered MLOps tooling rather than a dedicated governance platform. This
              means Securiti is often not displacing one incumbent SKU; it is trying to consolidate several
              fragmented workflows into a unified control plane. The diligence implication is that market size
              must be framed as overlapping lenses rather than a single clean analyst number.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM021
              - CM026
