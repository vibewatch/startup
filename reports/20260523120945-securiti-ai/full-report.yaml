      - number: '8.4'
        title: Bull, base, and bear cases bracket whether $1.725 billion was fair, rich, or opportunistic
        blocks:
          - type: paragraph
            body: >-
              Because the realized exit price is known but the internal economics are not, scenario work has to ask a
              narrower question: what standalone-equivalent or strategic value range would have been supportable at
              closing? In the bull case, Securiti was already approaching premium-security scale, Veeam could cross-sell
              aggressively into its massive installed base, and AI-control-plane demand justified a value above $2
              billion. In the base case, the actual $1.725 billion clearing price was roughly fair because Securiti had
              become a category leader but still required a strategic buyer to pay the top end of the range. In the bear
              case, the absence of public ARR, margin, and concentration disclosure masks a thinner underlying business,
              bundle pressure from larger platforms compresses the stand-alone multiple, and fair value falls closer to
              $1 billion. The realized outcome therefore looks best understood as a strategic-clearing price that
              existing investors should like, but that new financial investors could not confidently underwrite from
              public evidence alone.
            claimRefs:
