      - number: '5.3'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a cloud-native SaaS architecture that relies on connectors and APIs rather than
              in-place appliance deployment. The platform's operating model starts with ingestion of metadata and
              data-context signals from cloud platforms, warehouses, lakehouses, SaaS systems, and workflow tools. From
              there, Securiti's contextual-intelligence layer — described in different materials as Data Command Graph,
              knowledge graph, or a graph-backed control model — links data objects to users, entitlements, lineage,
              regulations, and AI systems. That graph is then used by the policy engine to drive discovery,
              classification, masking, access reviews, lineage analysis, compliance checks, privacy workflows, and AI
              controls. Classification is presented as AI- and NLP-based, not just rule-based, and partner materials
              repeatedly emphasize provenance, contextual tagging, and policy portability across environments. The
              Databricks materials add concrete architecture detail: Unity Catalog integration, row and column controls,
              dynamic masking, training-data sanitization, and governance of Delta-table pipelines feeding Mosaic AI.
              Snowflake materials similarly emphasize multi-account policy administration from a central command center.
              At the edge of the architecture, workflow integrations such as ServiceNow and broader connector frameworks
              make the product more like a policy orchestration layer than a passive visibility dashboard.
