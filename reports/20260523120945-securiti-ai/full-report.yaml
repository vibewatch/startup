  - id: TV003
    title: Bull / Base / Bear Scenario Table
    enumeration: true
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Provides the full bull, base, and bear scenario set used in this chapter to bracket whether the realized $1.725B
        price was low, fair, or rich at closing.
    columns:
      - Scenario
      - Core assumptions
      - Estimated valuation range (USD)
      - Probability signal
      - Return logic
      - Key triggers
    rows:
      - - Bull
        - >-
          Securiti had already reached premium-security scale, Veeam cross-sells into a large installed base, and Agent
          Commander-style integration turns the asset into a broader AI-control-plane wedge.
        - $2.0B-$2.4B
        - >-
          Requires evidence that the hidden ARR and retention profile were meaningfully better than public disclosure
          suggested.
        - Makes the realized $1.725B deal look opportunistic for Veeam and excellent for prior investors.
        - Strong integrated-product adoption, visible attach into Veeam accounts, and premium-security economics.
      - - Base
        - >-
          Securiti was a real category leader, but the market still required a strategic buyer to pay the top end
          because ARR, margins, and concentration were not public.
        - $1.5B-$1.8B
        - Most consistent with the realized outcome and current evidence quality.
        - Supports the view that $1.725B was roughly fair for a strategic buyer and a strong exit for investors.
        - Steady roadmap execution plus no sign of post-close commercial disappointment.
      - - Bear
        - >-
          Hidden economics were thinner than the story, bundle pressure from larger platforms proved severe, or
          integration diluted the product advantage.
        - $0.9B-$1.2B
        - Becomes more likely if cross-sell fails or if public-comp discipline dominates strategic scarcity.
        - >-
          Would mean Veeam paid up for potential that never fully monetizes, though existing investors still exited
          well.
        - Weak integrated-product traction, slower releases, pricing pressure, or concentration surprises.
    notes: >-
      These ranges are retrospective fair-value guardrails at the time of the transaction, not current market marks.
      They intentionally combine strategic and standalone logic because the exit itself was strategic.
