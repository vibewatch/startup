chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Securiti AI (legally Securiti, Inc.) is a cybersecurity and data governance software company headquartered
              at 300 Santana Row, Suite 450, San Jose, California. The company was founded in 2019 with the original
              mission of automating privacy operations ("PrivacyOps") for enterprises navigating GDPR, CCPA, and
              evolving global data regulations. Over time, the platform expanded into a broader Data Command Center
              offering: a unified intelligence and control layer for data security posture management (DSPM), privacy
              automation, AI governance, and compliance across hybrid multicloud, SaaS, and on-premises environments.

              The core product is powered by the Data Command Graph, a proprietary knowledge-graph engine that
              automatically captures contextual metadata about data and AI objects across cloud providers (AWS,
              Microsoft Azure, Google Cloud), data platforms (Snowflake, Databricks), and SaaS applications (Salesforce,
              Box). As of March 2026—following Veeam's completed acquisition—the company launched Agent Commander, an AI
              security and governance product for enterprise AI agent deployments. Securiti primarily targets large
              enterprises with complex hybrid cloud footprints requiring unified data controls, selling through a
              channel-first model that involves partners in at least 75% of enterprise opportunities.
