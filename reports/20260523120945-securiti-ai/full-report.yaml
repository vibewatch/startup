      - number: '4.6'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Securiti's public financial read is directionally positive and operationally incomplete. The company looks
              like a serious enterprise-software asset: broad control-plane product, negotiated large-enterprise deals,
              partner-assisted GTM, credible headcount scale, more than $156M raised, and a premium strategic exit at
              $1.725B. Those facts argue for meaningful demand and capital access.


              They do not, however, prove revenue quality, gross-margin shape, or cash efficiency. Public evidence still
              cannot answer the core underwriting questions: what proportion of revenue is recurring subscription versus
              implementation/support, how revenue is recognized, what gross margin looks like after cloud scanning and
              support costs, what CAC/payback and renewal dynamics are, and how much cash remained pre-acquisition. The
              correct financial verdict is therefore constructive on strategic value but cautious on standalone
              economics. Before underwriting Securiti as an independent business, investors would need management-grade
              disclosure on revenue, margin, channel economics, and liquidity.
