  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Securiti's product is best understood as an enterprise operating layer that sits between a company's
              fragmented data estate and the teams responsible for using that data safely. A typical customer workflow
              starts by connecting cloud platforms, SaaS systems, lakehouses, warehouses, and workflow tools into the
              Data Command Center. The platform then discovers data, classifies sensitive objects, maps context such as
              lineage, entitlements, regulations, and AI usage, and routes that context into operational actions such as
              masking, rights fulfillment, risk prioritization, compliance assessment, or AI control enforcement. In
              workflow terms, Securiti is not just a privacy portal or a DSPM scanner: it is trying to become the
              control plane through which security, privacy, governance, data, and AI teams coordinate how enterprise
              data can be accessed, transformed, shared, and used in AI systems. DSPM workflows focus on discovery,
              classification, posture monitoring, and remediation; privacy workflows focus on data-subject requests,
              consent, and regulatory duties; governance workflows focus on catalog, lineage, quality, and access; AI
              workflows focus on discovering models and agents, assessing risk, sanitizing data, and tracing provenance.
              Agent Commander extends the same workflow logic into agentic-AI operations by promising detection,
              protection, and rollback of AI-driven mistakes.
            claimRefs:
