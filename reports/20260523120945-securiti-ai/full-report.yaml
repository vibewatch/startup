      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The best public GTM evidence says Securiti sells into large-enterprise budgets with meaningful channel
              leverage, but not with public sales-efficiency disclosure. TechCrunch reported triple-digit
              quarter-over-quarter growth at the Series C stage and said Securiti was already landing seven- and
              eight-figure contracts. The partner-program release then showed how the company was scaling that motion:
              channel-first, partners in 75% of opportunities, and a goal of routing 100% of enterprise business through
              partners, resellers, or marketplace-adjacent procurement paths. That supports a thesis of lower
              direct-selling burden than a purely founder-led motion, yet the company does not disclose CAC, payback,
              win rates, sales-cycle length, or quota productivity.


              Operational scale proxies are visible. Headcount moved from 185 employees at Series B to around 370 by
              October 2022, while LinkedIn and the acquisition close suggest a late-stage organization in the 500-1,000+
              employee band before sale. Still, underwriters should treat channel involvement as a directional
              efficiency positive rather than a measured fact. Public sources show where demand comes from and how deals
              may route through partners, but not the economics of commissions, discounts, or sales productivity.
