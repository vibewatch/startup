            body: >-
              Securiti does not publicly disclose total customer count, active accounts, or site count, so adoption has
              to be read through proxies. The best time-series proxy is organizational scale: TechCrunch reported 185
              employees at the 2020 Series B reference point and around 370 employees by the October 2022 Series C,
              while Veeam’s December 2025 acquisition materials said Securiti would bring 600 employees. That does not
              prove customer count directly, but it does suggest a materially larger delivery, support, and go-to-market
              footprint over time.


              Public review and reference density provides a second adoption lens. By 2024, Securiti had enough review
              volume to qualify for Gartner Peer Insights Customers’ Choice methodology thresholds and reported 95%
              willingness to recommend. By the 2026 fetch date, G2 showed 76 reviews and an average implementation time
              of roughly three months. FeaturedCustomers added 584 reference ratings, 59 customer videos, five
              testimonials, and two case studies. One testimonial described integrating more than 250 repositories in
              less than 12 weeks, which is the strongest public evidence in this run that at least some customers are
              operating Securiti in sizable, production-grade environments rather than narrow pilots.


              The missing bridge is a clean logo or deployment funnel: there is no public series showing how many
              enterprises converted, expanded, renewed, or churned across these milestones.
