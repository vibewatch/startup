  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape — Direct Peers, Incumbents, Adjacent Suites, and Status Quo
        blocks:
          - type: paragraph
            body: >-
              Securiti competes in an unusually wide battlefield because it does not sell a single narrow product. Its
              public pages present a combined platform spanning data security posture management, privacy automation,
              data governance, and AI security / AI governance. That creates direct competition with DSPM specialists
              such as Cyera, Varonis, BigID, Sentra, and Privacera; privacy incumbents such as OneTrust, TrustArc,
              DataGrail, and Osano; emerging AI-governance specialists such as Credo AI and Holistic AI; and large
              incumbent suites such as Microsoft Purview, Amazon Macie, Google Sensitive Data Protection, IBM data
              security, and Palo Alto Networks Cloud Data Security. In practice, Securiti is often asking buyers to
              consolidate several adjacent control surfaces rather than replace one clean point product.


              The direct-peer set is therefore only one slice of the problem. Cyera, Sentra, BigID, and Privacera all
              market variants of data discovery, classification, risk reduction, access governance, or AI-era data
              controls. Varonis comes from a much larger installed base and now markets a combined data-and-AI security
              platform across cloud, SaaS, and on-prem. Privacy leaders remain important because many enterprises start
              the budget conversation from privacy operations and governance rather than from cloud security. OneTrust,
              TrustArc, DataGrail, and Osano all anchor those motions, with OneTrust and TrustArc explicitly pushing
              farther into AI governance and preventive data controls.


              The substitute set is broader still. Hyperscaler-native offerings let many accounts cover a subset of
              discovery, classification, or governance needs inside Microsoft, AWS, or Google estates without adopting
              another standalone platform. Open-source and build-your-own stacks also remain credible for some
              data-office teams: OpenMetadata provides open-source metadata and governance, and Apache Ranger provides
              policy administration and fine-grained data security. Those options do not replicate Securiti's full
