      - number: '5.2'
        title: Product Module and Asset Map
        blocks:
          - type: paragraph
            body: >-
              The public product map shows a modular but converged platform architecture. DSPM is the
              discovery-and-control layer for structured, semi-structured, and unstructured data across multicloud and
              data platforms. Data governance adds catalog, lineage, quality, and access-governance functions,
              especially for customers trying to make enterprise data usable for analytics and GenAI without losing
              policy control. The older PrivacyOps foundation remains strategically important because it anchors the
              platform in privacy operations, regulatory workflows, and individual-rights fulfillment rather than only
              security posture management. AI security and governance capabilities extend the same data context into
              model, agent, pipeline, and prompt-level controls; Agent Commander is the post-acquisition expression of
              that thesis for agentic AI. Around those modules sits a large integration fabric: Securiti advertises
              thousands of connectors and publishes dedicated pages for systems such as ServiceNow and Databricks, while
              partner material highlights large-account Snowflake policy management and AI-pipeline curation for
              Databricks Mosaic AI and Delta tables. The practical product asset is therefore less a single SKU than a
              set of control surfaces — connectors, the contextual graph, the policy engine, workflow/orchestration, and
              partner integrations — that can be recombined for different customer jobs.
