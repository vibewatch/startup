  - id: FR001
    title: Risk Heatmap
    type: matrix
    layout: wide
    summary: >-
      Heatmap showing Securiti's main risk clusters by impact and likelihood after the Veeam acquisition, with breach
      credibility loss, litigation, and partner concentration occupying the highest residual-severity cells.
    data:
      columns:
        - label: Medium Impact
        - label: High Impact
        - label: Critical Impact
      rows:
        - label: High Likelihood
          values:
            - Pricing compression from bundled suites
            - Partner concentration and Accenture-style GTM reliance
            - ''
        - label: Medium Likelihood
          values:
            - Federal / export readiness gap
            - EU AI Act compliance burden; integration attrition
            - Own-platform breach credibility loss; OneTrust legal escalation
        - label: Low Likelihood
          values:
            - Pakistan-location concentration surprise
            - Cloud outage with customer-visible consequences
            - ''
    approximationNotes: >-
      Likelihood and impact ratings are qualitative analyst judgments based on the fetched public evidence. High
      likelihood denotes a risk likely to surface inside the underwriting horizon; critical impact denotes a
      thesis-break event.
    claimRefs:
      - CR029
      - CR030
      - CR033
      - CR038
      - CR042
      - CR046
  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      Directed graph showing how legal, security, and integration risks propagate into trust, pricing power, customer
      retention, and Veeam's safe-AI thesis.
    data:
      nodes:
        - id: litigation
          label: Legal / IP escalation
          detail: Patent dispute or regulatory pressure intensifies.
        - id: trust-event
          label: Own-platform security or reliability event
          detail: Breach or sustained outage hits product credibility.
        - id: trust-erosion
          label: Customer trust erosion
          detail: Security and compliance narrative becomes less credible.
        - id: discounting
          label: Higher discounting and slower wins
          detail: Sales teams must offset risk perception against bundled alternatives.
        - id: retention
          label: Lower expansion / retention confidence
          detail: Large customers delay broader rollout or expansion.
        - id: parent-thesis
          label: Veeam safe-AI thesis weakened
          detail: The parent acquisition narrative loses force.
        - id: valuation
          label: Lower strategic value realization
          detail: Integration ROI and long-term margin assumptions compress.
      edges:
        - from: litigation
          to: trust-erosion
        - from: trust-event
          to: trust-erosion
        - from: trust-erosion
          to: discounting
        - from: discounting
          to: retention
        - from: retention
          to: valuation
        - from: trust-erosion
          to: parent-thesis
        - from: parent-thesis
          to: valuation
    approximationNotes: >-
      The arrows are qualitative cause-effect relationships rather than econometric estimates. Feedback loops are
      simplified to preserve DAG structure.
    claimRefs:
      - CR032
      - CR038
      - CR043
      - CR046
  - id: FR003
    title: Dependency Map
    type: dag
    layout: wide
    summary: >-
      Directed graph of Securiti's critical dependencies across parent ownership, channel, cloud, and ecosystem
      partners, highlighting where a single disruption could cascade fastest.
    data:
      nodes:
        - id: securiti-core
          label: Securiti core platform
          detail: DSPM, data governance, AI security, and compliance workflows.
        - id: veeam
          label: Veeam parent
          detail: Owns roadmap control, integration cadence, and capital allocation.
        - id: insight
          label: Insight Partners
          detail: Key owner-level influence through Veeam.
        - id: channel
          label: Channel / SI ecosystem
          detail: Partners involved in most enterprise opportunities.
        - id: accenture
          label: Accenture
          detail: Strategic integrator and Partner of the Year signal.
        - id: cloud
          label: AWS and GCP
          detail: Core infrastructure providers and adjacent competitors.
        - id: data-platforms
          label: Databricks / Snowflake / HPE stack
          detail: Ecosystem routes for enterprise AI and data-governance deployments.
        - id: customers
          label: Enterprise customers
          detail: Buy trust, uptime, and governance outcomes from the combined stack.
      edges:
        - from: insight
          to: veeam
        - from: veeam
          to: securiti-core
        - from: channel
          to: customers
        - from: accenture
          to: channel
        - from: cloud
          to: securiti-core
        - from: data-platforms
          to: securiti-core
        - from: securiti-core
          to: customers
        - from: veeam
          to: channel
    approximationNotes: >-
      The map emphasizes dependency structure, not revenue weights. Public evidence is strong on the existence of the
      dependencies but weak on exact concentration percentages.
    claimRefs:
      - CR023
      - CR025
      - CR026
      - CR028
      - CR031
      - CR041
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation starts from a strong realized exit but ends at a non-actionable standalone investment view
      because the company has already been acquired and core economics stayed private.
    data:
      nodes:
        - id: n1
          label: Realized $1.725B exit
          description: A strong factual outcome exists.
        - id: n2
          label: ~$156M raised
          description: The exit compares well with disclosed capital invested.
        - id: n3
          label: Strategic Veeam fit
          description: DSPM, privacy, governance, and AI trust fit Veeam's resilience platform.
        - id: n4
          label: Hidden economics
          description: Public evidence still lacks ARR, retention, margins, and the waterfall.
        - id: n5
          label: No standalone security
          description: New investors cannot buy independent Securiti equity anymore.
        - id: n6
          label: Retrospective-positive
          description: Good exit for prior investors; strategic but execution-sensitive price for Veeam.
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n3
        - from: n3
          to: n6
          label: supports strategic logic
        - from: n4
          to: n6
          label: limits valuation precision
        - from: n5
          to: n6
          label: ends live standalone entry
        - from: n2
          to: n6
          label: supports strong realized outcome
    approximationNotes: This figure is a decision path rather than a statistical model.
    claimRefs:
      - CV001
      - CV004
      - CV015
      - CV020
      - CV032
      - CV045
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: wide
    summary: >-
      The valuation debate is driven most by hidden revenue quality and post-close execution, not by whether the
      category exists.
    data:
      items:
        - label: ARR at acquisition
          value: 5
          detail: Undisclosed ARR is the single biggest swing factor in the fairness call.
        - label: Integration execution
          value: 5
          detail: The price only looks smart over time if Veeam amplifies the asset.
        - label: Cross-sell into Veeam base
          value: 4
          detail: Distribution leverage is the clearest route to upside beyond the close price.
        - label: Public multiple climate
          value: 4
          detail: Public comp guardrails matter because the asset lacks standalone disclosure.
        - label: Cap-table / waterfall terms
          value: 4
          detail: These determine realized investor returns versus headline enterprise value.
        - label: Bundle pressure
          value: 3
          detail: Macie, Purview, and larger suites can compress long-term pricing power.
    approximationNotes: Bars score relative sensitivity on a 1-5 scale rather than measured elasticity.
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV032
      - CV036
      - CV044
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: >-
      The bear, base, and bull ranges bracket whether the realized strategic price was too low, roughly fair, or
      expensive at close.
    data:
      items:
        - label: Bear case
          low: 0.9
          mid: 1.05
          high: 1.2
        - label: Base case
          low: 1.5
          mid: 1.725
          high: 1.8
        - label: Bull case
          low: 2
          mid: 2.2
          high: 2.4
    approximationNotes: >-
      Values are estimated USD billions and reflect retrospective fair-value guardrails at the time of the transaction,
      not current marks.
    claimRefs:
      - CV001
      - CV018
      - CV033
      - CV034
      - CV040
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The scorecard is excellent on realized investor outcome and strategic fit, but weak on disclosure quality and
      standalone margin of safety.
    data:
      items:
        - label: Realized investor outcome
          value: 5/5
          detail: A $1.725B sale against roughly $156M raised is a strong outcome.
          tone: positive
        - label: Strategic fit for Veeam
          value: 5/5
          detail: The asset pairs naturally with resilience, recovery, and AI-trust narratives.
          tone: positive
        - label: Market tailwind
          value: 4/5
          detail: Safe-AI and data-control demand support the category.
          tone: positive
        - label: Product breadth
          value: 4/5
          detail: Securiti brought DSPM, privacy, governance, and AI trust in one control plane.
          tone: positive
        - label: Disclosure quality
          value: 2/5
          detail: ARR, retention, margins, and the waterfall stayed private.
          tone: warning
        - label: Margin of safety for new investors
          value: 1/5
          detail: There is no longer an independent Securiti security to buy, and the price already cleared strategically.
          tone: risk
    approximationNotes: These KPIs are synthesized investment judgments rather than audited operating metrics.
    claimRefs:
      - CV001
      - CV004
      - CV014
      - CV020
      - CV032
      - CV045
