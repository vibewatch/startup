  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing posture
        blocks:
          - type: paragraph
            body: >-
              Securiti's public monetization story is enterprise-software-led but intentionally nontransparent. The
              company's homepage and pricing page present the Data Command Center as a unified platform spanning DSPM,
              AI security, privacy, governance, compliance, breach response, data catalog, lineage, and related
              workflows, while the pricing page explicitly offers personalized pricing and custom quotes instead of a
              public rate card. TechCrunch's 2022 Series C coverage adds the clearest monetization proxy: management
              said the company was already winning seven- and eight-figure contracts. That is a strong enterprise-value
              signal, but it does not reveal ACV distribution, billing cadence, module attach, or how much professional
              services or support are embedded in those deals.


              The 2023 partner-program launch also matters financially because it shows Securiti increasingly monetizes
              through channel-assisted procurement. Management said partners were involved in 75% of opportunities and
              targeted 100% of enterprise business transacting with partners, including resellers and
              cloud-service-provider marketplaces. PeerSpot review summaries reinforce a negotiated-enterprise model by
              describing flexible licensing and enterprise license agreements. Public evidence therefore supports
              quote-based software subscriptions with partner influence and likely cross-sell across modules, but not a
              defensible revenue-mix or recognition analysis.
