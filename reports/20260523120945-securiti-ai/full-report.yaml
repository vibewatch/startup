            title: Standalone DSPM TAMs are too noisy to underwrite on their own
            body: >-
              Public DSPM estimates span roughly 5x depending on whether the analyst counts a narrow standalone market
              or a broader data-security layer inside adjacent platforms. Investors should preserve that contradiction,
              not average it away, and should instead underwrite Securiti against overlap-adjusted SAM and module-level
              land-and-expand evidence.
