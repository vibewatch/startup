              In October 2022, Securiti announced a $75M Series C led by Owl Rock Capital (a division of Blue Owl
              Capital), with existing investors Mayfield and General Catalyst participating. Blue Owl Capital's Pravin
              Vazirani joined Securiti's board as part of the deal, and the company reported approximately 370 employees
              and triple-digit quarter-over-quarter revenue growth at the time. Cisco Investments also participated in
              Securiti's funding history according to TechCrunch. Total VC raised is cited by TechCrunch as "more than
              $156 million." No public evidence was found for a Series D or a standalone $1B+ valuation prior to the
              Veeam transaction; the company remained private and disclosed no revenue figures.
