      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Securiti sells directly into the most regulation-sensitive parts of enterprise data infrastructure:
              privacy, data governance, AI governance, and AI security. Its own product pages still anchor on GDPR,
              CCPA, data governance, and EU AI Act automation, which means the company must track both
              privacy-enforcement regimes and the new AI-governance obligations landing in Europe. That is manageable in
              principle, but it creates a moving-target compliance burden because the company is not merely helping
              customers react to regulation; it is packaging itself as the automation layer that makes those regulations
              operational.


              The sharper legal tail is IP and trust. PatentPC's legal overview identifies OneTrust v. Securiti among
              notable AI patent lawsuits, which is enough to treat IP litigation as a live adverse factor even though
              the current docket status was not publicly confirmed in the materials fetched for this chapter.
              Separately, Securiti's trust and security materials emphasize SOC 2, ISO, GDPR, and CCPA; they do not
              disclose a FedRAMP authorization, which limits confidence on federal-market readiness. Export-control
              diligence also becomes more important if Securiti is used around government or controlled-data
              environments, especially once the company is marketed as part of broader AI infrastructure stacks.
