  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Securiti's risk stack changed meaningfully once the company became part of Veeam. As an independent
              startup, the core question was whether the platform could keep funding growth fast enough to capture the
              DSPM and AI-governance market. After the December 2025 sale, the highest residual risks are different:
              regulatory fragmentation still matters, but the more immediate downside now comes from how legal,
              platform, partner, and people risks transmit through a larger parent-owned integration story. The heatmap
              places patent and regulatory drift, own-platform breach credibility loss, partner concentration, and
              integration attrition at the top because each can damage customer trust and Veeam's safe-AI thesis
              simultaneously.


              The key investment implication is that Securiti no longer needs fresh equity to survive, but it does need
              to preserve product credibility while being absorbed into a bigger organization. A point-solution vendor
              can survive some roadmap wobble; a platform marketed as the trusted data layer for safe AI cannot. The
              most important monitorable signals are legal escalation in the OneTrust matter, any security incident or
              sustained reliability regression, evidence that partner-led pipeline is weakening, and signs that Veeam
              integration is slowing shipping cadence or leadership continuity.
            claimRefs:
