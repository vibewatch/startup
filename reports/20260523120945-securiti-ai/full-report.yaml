            body: >-
              The best argument that Veeam did not wildly overpay is strategic rather than purely multiple-based. Veeam
              had just completed a $2 billion secondary that valued the parent at $15 billion, disclosed $1.7 billion of
              ARR and 30% EBITDA margins, and said the transaction increased flexibility for future acquisitions.
              Securiti fit that acquisition agenda neatly: a unified control plane for DSPM, privacy, governance, and AI
              trust paired with Veeam's resilience and recovery stack. Public references such as Rubrik, Varonis, and
              broader DSPM market reports are still useful, but mostly as range-setting devices. They are more mature,
              more disclosed, or structurally different than Securiti. The market-data set itself is also messy: several
              analyst, database, and comp URLs in the retained evidence were paywalled, blocked, or stale. The resulting
              discipline is simple. Public comps can tell us when the strategic narrative is drifting too far from
