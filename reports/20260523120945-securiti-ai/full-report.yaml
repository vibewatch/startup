  - id: TV002
    title: Thesis / Anti-Thesis Table
    enumeration: true
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the six valuation lenses explicitly required for this chapter: market, product, customers, financials,
        competition, and risk/integration, using the retained public evidence set available on 2026-05-23.
    columns:
      - Lens
      - Why the thesis works
      - Why the anti-thesis still matters
      - What would change the read
    rows:
      - - Market
        - >-
          DSPM, privacy, governance, and AI trust all strengthened as enterprises tried to make fragmented data usable
          for AI safely.
        - Category definitions remain messy, and overlapping TAM narratives can overstate what is truly monetizable.
        - A cleaner post-close revenue map by module and budget owner.
      - - Product
        - >-
          Securiti brought a unified control plane across DSPM, privacy, governance, and AI trust that Veeam could pair
          with resilience and rollback.
        - >-
          Platform breadth can also mean integration complexity and a harder burden of proof than a narrower point
          solution.
        - Evidence that the combined roadmap is shipping and winning, not just being announced.
      - - Customers
        - Veeam's scale plus Securiti's enterprise traction create credible cross-sell potential into large accounts.
        - >-
          Public sources still do not disclose concentration, NRR, or the portion of customers using multiple Securiti
          modules.
        - Top-account concentration and attach-rate disclosure.
      - - Financials
        - >-
          A $1.725B exit on ~$156M disclosed funding and seven- to eight-figure contract anecdotes suggests real value
          creation.
        - >-
          No public ARR, gross margin, burn, or retention data prove that the economics deserved a premium standalone
          multiple.
        - ARR, NRR, gross-margin, and burn-quality disclosure at or near sale.
      - - Competition
        - >-
          A strategic buyer can pay more than financial investors if the asset improves a broader platform against
          AI-era data problems.
        - Hyperscalers and larger suites can bundle adjacent controls and compress standalone pricing power.
        - Win-rate and discounting data versus bundled alternatives like Macie and Purview.
      - - Risk / integration
        - >-
          Veeam's balance sheet capacity and product adjacency reduce standalone funding risk and give the asset a
          natural parent.
        - The acquisition only works if product integration, leadership continuity, and go-to-market execution hold.
        - Evidence of customer adoption for integrated products such as Agent Commander and related modules.
    notes: >-
      The table is intentionally balanced. Each bull point is paired with the specific public-evidence gap most likely
      to turn a good strategic story into an overpayment narrative.
