      - number: '7.3'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Securiti is a classic enterprise control-plane product: broad connector coverage, heavy
              dependence on third-party infrastructure, and a promise that sensitive-data controls will work across
              complex environments. That design creates two opposing truths at once. On the positive side, the company
              discloses multi-availability-zone deployment, pilot-light disaster recovery, hashed cataloged personal
              data, backups, SSO, RBAC, and a responsible-disclosure process. On the negative side, the same security
              page shows how much of the reliability and security stack depends on AWS, GCP, and a large integration
              surface that Securiti must continuously maintain.


              This is why own-platform incident risk deserves special weight. A breach or prolonged outage would not
              just create direct operational pain; it would undercut the sales narrative of trust, safe AI, and
              automated governance. Public sources reviewed here do not provide a customer SLA or a detailed outage
              archive, which makes residual exposure hard to size from outside the company. The platform's extension
              into AI security and agentic AI also raises a newer quality-risk layer: false negatives, false positives,
              or policy errors in AI and data classification can create customer compliance exposure even when the
              underlying infrastructure stays available.
