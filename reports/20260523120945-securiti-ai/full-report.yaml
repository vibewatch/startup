  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    enumeration: true
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Lists the full set of thesis-break signals used in this chapter to judge whether the realized strategic price
        eventually proves too high or well-earned.
    columns:
      - Trigger
      - Threshold / signal
      - Why it matters
      - Action implication
      - Monitoring path
    rows:
      - - Hidden ARR was too low
        - >-
          Post-close disclosure or diligence implies sale-date ARR materially below what premium-security multiples
          would require
        - The fairness case for $1.725B collapses quickly if the revenue base was thin.
        - Treat the deal as strategically expensive rather than fair.
        - Request the acquisition model and ARR bridge at signing and close.
      - - Cross-sell does not materialize
        - Integrated products fail to win attach into the Veeam base or remain niche pilots
        - >-
          A large part of strategic upside depends on distribution leverage, not just on Securiti's standalone
          footprint.
        - Reset value toward a narrower standalone multiple set.
        - Track attach rates, bundled win rates, and integrated bookings.
      - - Bundle pressure accelerates
        - Macie, Purview, or broader suites win on pricing and convenience
        - Even a strong product can see its terminal multiple compress if bundled alternatives dominate procurement.
        - Lower margin and multiple assumptions.
        - Review competitive discounting and win-loss data.
      - - Integration slows roadmap execution
        - Leadership churn, delayed releases, or weak adoption of integrated products such as Agent Commander
        - The price only works if Veeam amplifies rather than muffles the product story.
        - Move the thesis from strategic synergy to strategic drag.
        - Monitor release cadence, retention of key leaders, and customer references.
      - - Concentration proves high
        - A small number of accounts, partners, or product modules explain most of the business
        - Category-leader narratives are fragile if revenue quality is narrow.
        - Increase downside probability materially.
        - Request concentration tables by customer, module, and partner.
      - - Waterfall terms disappoint
        - Preference stack or deal mechanics materially dilute common-equity outcomes
        - Headline enterprise value can overstate real investor proceeds.
        - Recalculate investor return claims before using the exit as a benchmark.
        - Obtain the cap table, preference schedule, and distribution waterfall.
    notes: >-
      Thresholds are diligence triggers, not reported management guidance. They translate the chapter's public-evidence
      gaps into monitorable yes/no conditions.
    claimRefs:
      - CV014
      - CV021
      - CV022
      - CV031
      - CV032
      - CV036
      - CV040
      - CV044
      - CV045
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Likely owner
      - Decision use
    rows:
      - - Acquisition-date ARR and revenue mix
        - ARR, subscription vs. services mix, and net-new ARR bridge at signing and close
        - This is the single biggest missing input to any fair-value assessment.
        - Finance / corp dev
        - Rebuild the comp and scenario ranges around real revenue.
      - - Retention and concentration
        - NRR, GRR, logo churn, top-10 customers, and module attach by segment
        - Determines whether the premium paid was buying durable quality or concentrated growth.
        - Finance / revenue operations
        - Tighten the bull/base/bear probabilities.
      - - Gross margin and burn quality
        - Gross margin, cash burn, and any acquisition-date profitability bridge
        - Separates strategic scarcity from a genuinely premium software asset.
        - Finance
        - Judge whether a public-like multiple could ever have been deserved standalone.
      - - Cap table and waterfall
        - Preference stack, option pool, liquidation rights, and actual exit distributions
        - Headline exit value is not the same thing as investor proceeds.
        - Finance / legal
        - Validate realized return claims by share class.
      - - Integration scorecard
        - Bookings attach, pipeline sourced through Veeam, integrated product adoption, and leadership retention
        - This is the clearest way to test whether Veeam bought a platform wedge or just a point asset.
        - Corp dev / GTM / product
        - Judge whether the price looks better or worse with time.
      - - Competitive pricing data
        - Win-loss, discounting, and bundle displacement versus Macie, Purview, and other large suites
        - Needed to size the anti-thesis that DSPM features commoditize inside broader platforms.
        - Sales / product marketing
        - Refine terminal-multiple and downside assumptions.
    notes: >-
      These are the minimum asks required to convert this chapter from a credible retrospective memo into a precise
      underwriting model.
    claimRefs:
      - CV014
      - CV029
      - CV031
