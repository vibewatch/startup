    {
      "id": "financing-context-and-entry-discipline",
      "title": "Financing context supports appreciation, but entry discipline still hinges on hidden economics",
      "body": "The financing path shows why the exit looks impressive. Public sources support a $50 million Series B in January 2020 that brought total funding to $81 million, then a $75 million Series C in October 2022 that took disclosed funding above $155 million. The same 2022 TechCrunch coverage also reported seven- and eight-figure contracts, triple-digit quarter-over-quarter growth, and headcount expansion from 185 employees at the Series B stage to roughly 370 by Series C. By the December 2025 close, Veeam said it was adding 600 Securiti employees. Those milestones support a real scale-up story and make it plausible that substantial value was created between the 2022 financing and the 2025 exit. What they do not answer is the exact 2022 post-money valuation, the ARR at sale, or the liquidation waterfall. That means the chapter can reasonably frame Series C-to-exit appreciation as substantial, but not calculate a clean investor-by-investor gross multiple without additional private evidence.",
