tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Core claims-platform modules
    - Carrier licenses recurring workflows such as FNOL, messaging, fraud, CAT, and AI-assisted follow-up
    - Likely annual contract plus usage or claim volume
    - Officially clear as the primary monetization layer; exact contract form is undisclosed
    - 'Medium: clearly software-led, but pricing realization is private'
    - Provide actual master-service-agreement templates, billing unit definitions, and renewal terms
  - - Pilot / prove-first deployments
    - Initial live-environment pilots validate ROI before scaled commitment
    - Pilot fee, discounted annual contract, or structured trial
    - Publicly emphasized by the company; economics are undisclosed
    - 'Medium: supports efficient land motion but not enough to infer ACV'
    - Disclose pilot duration, paid vs unpaid structure, conversion rate, and time to production
  - - Messaging and communications workflows
    - Expanded claims conversations, notices, translations, and enterprise messaging
    - Module fee, seat fee, usage volume, or bundled contract
    - Capabilities are public, pricing is not
    - 'Low-medium: likely sticky, but unit economics depend on message volume and support burden'
    - Provide module-level attach rate, realized pricing, and gross-margin contribution
  - - Service Assignment and vendor coordination
    - Scheduling repairs, rentals, tows, inspections, and contractor workflows
    - Per assignment, platform fee, or bundled workflow fee
    - Operationally important and publicly visible; monetization basis unknown
    - 'Low-medium: strong workflow value, but vendor orchestration can carry service-like costs'
    - Break out revenue retained versus pass-through or partner-funded economics
  - - Compliance / AI-assisted workflow extensions
    - Digital signatures, notices, audit trails, translation, and agentic follow-up deepen wallet share
    - Add-on module or enterprise bundle
    - Public features are visible, direct monetization is not
    - 'Low-medium: can raise ACV if sold as premium capabilities'
    - Provide price uplifts for compliance, translation, and AI-assistant features
  - - Implementation and customer success
    - Configuration, rollout support, white-glove implementation, and carrier enablement
    - One-time service fee, bundled onboarding, or included support
    - Official material implies some implementation support; service revenue is undisclosed
    - 'Low: can aid adoption but may dilute gross margin if underpriced'
    - Separate software revenue from implementation or managed-service revenue
  notes: Rows summarize the monetization lanes visible in official materials and third-party company profiles; they do not represent a management-confirmed revenue waterfall or realized contract mix.
  enumerationScope:
    coverage: partial
    basis: Covers the public revenue mechanisms inferable from official product, pilot, and workflow materials as of the 2026-06-11 run date rather than every internal SKU or contract archetype.
