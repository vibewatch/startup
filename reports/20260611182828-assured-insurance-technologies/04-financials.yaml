company:
  name: Assured Insurance Technologies
chapter:
  number: 4
  title: Financials
  summary: Assured's public financial file is strongest on revenue mechanism, deployment economics, and ROI language, not on disclosed operating results. Official materials support a modular, pilot-led SaaS overlay sold to carriers with cycle-time, LAE, and customer-experience claims, while third-party databases and Bloomberg anchor a March 2025 Series B around $23.4M at roughly a $1B valuation and an unofficial 2025 revenue estimate around $22M. Underwriting confidence remains capped because audited revenue, gross margin, CAC/payback, customer concentration, cash balance, and debt disclosure are still unavailable, so capital adequacy is necessarily scenario-based rather than confirmed.
sections:
- id: revenue-model-and-pricing-visibility
  title: Revenue model and pricing visibility
  body: 'Assured clearly sells workflow software, but it does not publicly disclose the contract math investors would need to underwrite revenue quality. The official site consistently describes an AI-driven SaaS platform for carriers, not a carrier balance-sheet product, and the suite is visibly modular: FNOL, Messaging, Service Assignment, Fraud, CAT, Emma, and adjacent intake or follow-up tools can be deployed independently or together. The monetization logic that is visible in public is therefore module-led and workflow-led, not premium-linked. The strongest GTM/pricing clue is not a rate card but the company''s own ''prove-first, scale-later'' language: Assured markets pilots, fast deployment, and value validation before scaled commitments. That suggests enterprise contracts likely land on one workflow, then expand as carriers adopt more modules or higher claims volume. At the same time, nearly every official page routes buyers into demos, downloads, or contact forms rather than self-serve
    checkout, and none of the reviewed pages publish per-claim pricing, seat pricing, minimum annual contract values, or discount ladders. The right conclusion is that Assured has a software-like recurring revenue mechanism with modular upsell paths, but realized pricing, services mix, and revenue-recognition details remain private.'
