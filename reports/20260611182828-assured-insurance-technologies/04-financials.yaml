  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue
    missingEvidence: Audited revenue, ARR, and bookings bridge by quarter, product, and insurer segment.
    whyItMatters: Without audited scale data, the chapter cannot validate whether the unicorn valuation is supported by durable top-line growth or by a narrower workflow revenue base.
    diligencePath: Request audited financial statements, monthly ARR bridge, bookings-to-revenue waterfall, and customer-count definitions from management.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI008
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-cogs
    missingEvidence: Actual gross margin and COGS split across cloud, support, implementation, compliance, and any vendor pass-through.
    whyItMatters: The core underwriting question is whether Assured behaves like high-margin software or like a more operationally intensive claims workflow provider.
    diligencePath: Request GAAP and non-GAAP gross margin, direct hosting cost, personnel cost by function, and service-revenue mix for the last eight quarters.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI013
    - QI022
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, debt schedule, quarterly operating cash flow, and management runway model.
    whyItMatters: Public round size alone cannot establish present liquidity or next-round timing, so financing dependency remains scenario-based.
    diligencePath: Request board materials on cash planning, debt documents, covenant schedules, and monthly burn by major function since the Series B close.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI020
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: customer-concentration-acv
    missingEvidence: Top-customer concentration, ACV distribution, logo retention, and renewal behavior.
    whyItMatters: A company can look efficient in public narratives yet still be overly dependent on a handful of carrier relationships.
    diligencePath: Request top-10 customer revenue mix, cohort renewals, segment ACV, and pipeline-to-bookings conversion by insurer size.
    relatedQuestionRefs:
    - QI021
    - QI022
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-services-mix
    missingEvidence: Executed pricing schedules, pilot-to-production economics, implementation fees, discount ladders, and services attachment rates.
    whyItMatters: Mechanism-level visibility is not enough to judge revenue quality or whether pilots scale into attractive, repeatable subscription economics.
    diligencePath: Request representative contracts, redlined order forms, pilot conversion data, and module-level realized pricing by carrier cohort.
    relatedQuestionRefs:
    - QI002
    - QI009
    - QI020
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cac-payback-retention
    missingEvidence: Fully loaded CAC, payback, gross retention, NRR, and pipeline conversion metrics.
    whyItMatters: The chapter can describe a plausible land-and-expand motion, but it cannot prove capital efficiency or renewal durability without core SaaS metrics.
    diligencePath: Request sales and marketing spend by quarter, new ARR added, payback calculations, churn analysis, and cohort retention by module.
    relatedQuestionRefs:
    - QI010
    - QI022
    - QI023
    - QI025
    relatedTableRefs:
