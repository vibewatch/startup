- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Impact on verdict
  - Exact diligence path
  rows:
  - - Audited revenue / ARR by year and module
    - Needed to test growth durability and valuation support
    - Unavailable officially; third-party estimate only
    - Blocking for underwriting-grade scale assessment
    - Request audited monthly revenue bridge, bookings, ARR, and renewals by product line
  - - Gross margin and COGS split
    - Determines whether Assured behaves like high-margin software or workflow-heavy operations
    - Unavailable
    - Blocking for margin-path analysis
    - Request GAAP and non-GAAP gross margin with cloud, support, compliance, implementation, and partner pass-through split
  - - CAC, payback, and retention
    - Core test of capital efficiency for a pilot-led enterprise motion
    - Unavailable publicly
    - 'Material: limits confidence in sales-efficiency judgment'
    - Request fully loaded CAC, payback, gross retention, NRR, and expansion by cohort
  - - Cash balance, burn, and debt
    - Required to size runway and financing dependency
    - Unavailable publicly
    - Blocking for capital-adequacy conclusion
    - Request current cash, quarterly cash flow statement, debt schedule, and 18-24 month runway model
  - - Customer concentration and ACV distribution
    - Determines insurer dependence and renewal risk
    - Unavailable publicly
    - 'Material: valuation can be overstated if revenue is concentrated'
    - Request top-10 customer mix, segment ACV, renewal history, and logo concentration
  - - Realized pricing and services mix
    - Separates software economics from discounted pilots or bundled service work
    - Unavailable publicly
    - 'Material: prevents clean revenue-quality assessment'
    - Request executed pricing schedules, pilot-to-production conversions, and services attach-rate data
  notes: The chapter can support a directional verdict from mechanism and ROI evidence, but these six missing data sets keep the analysis below a full underwriting bar.
