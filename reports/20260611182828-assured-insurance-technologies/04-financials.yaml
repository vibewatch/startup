- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is directionally constructive but not underwriteable from public evidence alone. Assured looks like a growth-stage claims software vendor with a credible modular overlay product, a pilot-first sales motion that can shorten initial deployment friction, and strong carrier pain points behind the value proposition. Those are meaningful positives. The negative is that almost every metric that determines valuation durability is still missing or third-party-estimated: audited revenue, GAAP growth, gross margin, contract mix, CAC, payback, NRR, customer concentration, cash balance, debt, and covenant structure. Even the best public revenue figure is a third-party database estimate rather than management disclosure. That leaves two simultaneous truths. First, the company probably deserves to be evaluated as software with defensible workflow value rather than as a labor-arbitrage service business. Second, the margin path could still disappoint if compliance, implementation,
    vendor-orchestration, and customer-support costs scale less favorably than management marketing implies. The practical diligence stance is therefore medium confidence: revenue mechanism looks real, margin upside is plausible, and the March 2025 financing reduces immediate distress risk, but no investor should underwrite burn, runway, or a $1B valuation on public materials alone. The key blockers are exact revenue quality, actual gross margin after delivery costs, carrier concentration, CAC/payback, and current cash.'
