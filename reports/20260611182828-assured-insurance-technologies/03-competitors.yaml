- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Modular overlay reduces replace-the-core friction
    - Incumbents are adding AI and automation into existing suites
    - High
    - Guidewire, Duck Creek, CCC, Mitchell, and Verisk all market intelligent workflow upgrades today
    - Demand proof of deployment speed and measurable leakage or cycle-time gains versus incumbent add-ons
  - - Structured-data-first intake creates a differentiated wedge
    - Snapsheet and incumbents also market unified intake, assignment, communications, and automation
    - High
    - Snapsheet and both core-suite vendors present modern claims-core stories
    - Request workflow-by-workflow win rates against Snapsheet and incumbent expansion deals
  - - Fraud plus CAT plus communications can cross-sell into a broader platform
    - Buyers can still buy FRISS, Verisk, One Inc, or Tractable as slices and keep the rest unchanged
    - High
    - Point-solution substitutes remain credible on fraud, payments, and appraisal
    - Test how often Assured expands beyond its first purchased module in production accounts
  - - Integration-light deployment is a sales advantage
    - Public reference density and customer-count proof lag incumbent trust signals
    - High
    - Assured lacks the public customer and network metrics exposed by incumbents and Snapsheet
    - Request named references by module, line, and implementation vintage
  - - Automation can lower cost and improve experience
    - Poor communication, wrong digital design, or governance failures can hurt satisfaction and create regulatory risk
    - Medium
    - J.D. Power and AIG both show digital design and AI governance are not free wins
    - Audit claimant communications, escalation logic, model governance, and compliance controls
  - - Auto repair and data incumbents can be bypassed by better UX
    - CCC, Verisk, and Mitchell still own entrenched networks and data assets in auto workflows
    - Medium
    - Network/data leverage compounds over time and supports multi-homing rather than replacement
    - Underwrite Assured as a coexistence vendor unless it proves category-leading auto workflow outcomes
  notes: Severity reflects analytical underwriting judgment rather than company-disclosed risk labels. The table emphasizes where Assured's moat is real but still vulnerable to incumbent response, point-solution unbundling, and trust deficits.
