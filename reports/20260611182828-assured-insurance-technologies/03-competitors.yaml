  rows:
  - - Assured
    - Modern modular claims overlay
    - Private startup; March 2025 financing around $1B valuation from prior report context, but customer count undisclosed here
    - P&C carriers seeking modular claims modernization
    - Structured intake, messaging, fraud, CAT, downstream automation
    - Fits around existing systems and attacks high-friction workflows without core replacement
    - Public reference density, pricing, and installed-base depth remain thin versus incumbents
  - - Guidewire
    - Incumbent core suite
    - Public incumbent; 450+ insurers on Guidewire and 270+ ClaimCenter customers disclosed publicly
    - Multiline P&C carriers globally
    - Full claims core plus digital, analytics, AI, marketplace
    - Deep installed base, broad partner ecosystem, and high switching costs
    - Harder to buy as a narrow overlay and likely heavier migration / program effort
  - - Duck Creek
    - Incumbent core suite
    - Private incumbent; 30M+ claims processed and CAT-scale throughput disclosed publicly
    - P&C carriers wanting cloud core modernization
    - Claims plus policy, rating, billing, embedded payments, partner ecosystem
    - Intelligent Core story joins system of record with system of intelligence
    - Broader suite orientation may be more than a buyer wants for a modular wedge
  - - CCC Intelligent Solutions
    - Network / auto claims incumbent
    - Public network incumbent; 300+ auto insurers and 18M+ annual claims processed disclosed publicly
    - Auto insurers and repair ecosystem participants
    - Auto claims orchestration, casualty, repair, parts, payments, ecosystem connectivity
    - Deep repair and partner network with event-driven workflow and AI data platform
    - More auto-centric and network-centric than a broad multiline claims operating layer
  - - Verisk
    - Data / estimation / fraud incumbent
    - Public data incumbent; investor materials frame global insurance analytics and claims outcomes role
    - Carriers needing fraud, data sharing, and property estimation depth
    - ClaimSearch, Xactimate, property estimation and analytics
    - Long-tenured data assets and compliance-oriented trust signals
    - Usually a data and estimation layer rather than full claimant-journey orchestration
  - - Snapsheet
    - Modern claims platform
    - Private modern platform; 170+ customers and 16 of top 20 P&C carriers claimed publicly
    - Carriers, MGAs, TPAs, fleet operators
    - Complete claims system with no-code workflows, integrated payments, and direct integrations
    - Modern core alternative with fast implementation and strong non-disruptive positioning
    - Public proof is still company-authored and narrower than incumbent multinational references
  - - Mitchell / Enlyte
    - Auto APD and auto-casualty specialist
    - Private incumbent specialist; 95M+ collision claims and 100+ APD carriers at Mitchell plus millions of auto-casualty bills at Enlyte
    - Auto insurers and casualty teams
    - Loss profiling, estimating, total loss, review, bill review, compliance, analytics
    - Workflow depth and data assets in auto physical damage and casualty
    - Segment depth does not equal a broad multiline claims operating layer
  - - One Inc
    - Payments adjacency
    - Private adjacency; no public customer count reviewed here
    - Carriers modernizing premium and claim disbursements
    - Claims payments, vendor payments, premium payments, reconciliation
    - Owns a painful payments wedge and reduces paper-based processes
    - Not a substitute for intake, fraud, CAT, or broader claim orchestration
  - - FRISS / CLARA / Tractable
    - Point-solution adjacencies
    - Private point-solution set; public scale detail is limited or slice-specific
    - Carriers buying fraud, casualty intelligence, or image-assessment layers
    - Fraud verification, casualty intelligence, or image-based damage assessment
    - Can be bought surgically and multi-homed with existing suites
    - Narrower slice coverage makes them complements more often than end-to-end substitutes
  notes: Rows compare public positioning and scale signals only. Where funding, customer count, or pricing is not disclosed on reviewed pages, the table preserves that uncertainty instead of backfilling from low-quality aggregators.
