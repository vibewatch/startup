  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Signed order forms or at least redacted pricing exhibits showing minimum contract values, transaction fees, and implementation charges across Assured and key peers.
    whyItMatters: Website pages consistently route buyers to demos or contact forms, so price-based displacement risk cannot be underwritten from public materials alone.
    diligencePath: Request three recent customer proposals or MSAs from Assured plus benchmark quotes from a core-suite incumbent and one point-solution rival.
    relatedQuestionRefs:
    - QP012
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: reference-density
    missingEvidence: Named production customers, deployment count by line, and retention or expansion metrics for Assured and private modern-platform peers.
    whyItMatters: Public scale proxies exist for incumbents and some modern vendors, but Assured's true installed-base depth remains hard to compare without direct references.
    diligencePath: Request a customer reference list split by line of business, deployment module, and contract vintage, then compare against incumbent renewal and expansion patterns.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP004
