  - - CCC
    - No public list pricing found
    - Claims and repair platform tied to ecosystem connectivity and auto workflows
    - Auto-insurer and repair-network expansion motion
    - Pricing likely rides networked workflow value more than seat-style software pricing
  - - Snapsheet
    - No public list pricing found
    - Complete claims system with no-code workflows and integrated payments
    - Fast implementation and centralized-platform pitch
    - Closest modern-platform comparison for Assured when buyers want a new claims core
  - - One Inc
    - No public list pricing found
    - Payments and disbursement products sold as workflow slices
    - Transaction and reconciliation efficiency story
    - Substitute only for the payment layer, not the whole claims-intelligence stack
