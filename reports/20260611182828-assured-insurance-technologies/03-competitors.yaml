- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public pricing signal
  - Commercial packaging visible on reviewed pages
  - Deployment / GTM signal
  - Implication for Assured comparison
  rows:
  - - Assured
    - No public list pricing found
    - Demo-led modular platform spanning intake, fraud, CAT, and messaging
    - Fit-around deployment and integration-light ROI story
    - Assured can compete on wedge economics but public price transparency is low
  - - Guidewire
    - No public list pricing found
    - Enterprise suite / ClaimCenter plus marketplace ecosystem
    - Large transformation or expansion programs with incumbent estate leverage
    - Comparison hinges on migration scope and total program ROI, not list price
  - - Duck Creek
    - No public list pricing found
    - Claims sold within an Intelligent Core that also covers policy, rating, billing, and embedded payments
    - Cloud-core modernization and low-code adaptation story
