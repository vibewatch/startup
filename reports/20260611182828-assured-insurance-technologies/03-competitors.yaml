- id: incumbent-power-and-installed-base
  title: Incumbent power and installed-base response
  body: Guidewire and Duck Creek remain the hardest alternatives for Assured to outrun because they sell more than claims features. Both wrap claims in a broader core estate tied to policy, billing, analytics, partner ecosystems, and long-lived process design. Guidewire's public materials combine product depth, 270-plus ClaimCenter customers, a larger 450-plus insurer corporate base, heavy R&D spend, and a marketplace argument that lets carriers extend rather than replace the incumbent. Duck Creek mirrors that playbook with an “Intelligent Core” pitch, 30 million-plus claims processed, CAT-scale throughput, rapid rule changes, and explicit low-code plus embedded-payments expansion. The case-study evidence matters even more than the feature lists. California Casualty, Zurich, FCCI, and Markel all show carriers still modernizing or deepening Guidewire footprints, not exiting them. That is adverse evidence for an easy displacement thesis. Assured can still win as an overlay, but when a carrier
    is already paying for a core-suite roadmap, the startup has to prove faster deployment and better loss-cost outcomes, not just newer AI language. In other words, incumbent response is active and capitalized, not stagnant.
