chapter:
  number: 1
  title: Company Overview
  summary: Assured Insurance Technologies is a Palo Alto-founded private software company focused on AI-driven P&C claims workflows, with public materials emphasizing structured data, modular claims products, and a March 2025 financing reported around a $1 billion valuation. The company discloses its founders and broad product footprint clearly, but public evidence on board composition, customer count, revenue, total capital raised, and headcount remains inconsistent or incomplete.
sections:
- id: identity-and-leadership
  title: Identity and leadership base case
  body: 'Assured Insurance Technologies presents itself as a claims-intelligence software vendor for property and casualty insurers rather than a carrier, MGA, or consumer-facing insurer. The homepage and platform materials consistently frame the product as AI-driven SaaS that helps carriers ingest, service, and process claims through structured data, automation, and agentic AI. Public third-party profiles converge on a 2019 founding date and a Palo Alto, California base, but address-level details vary between a 650 Page Mill Road headquarters listing from CB Insights and a 3 Peter Coutts Circle registered address from Tracxn, so the safest chapter ground truth is Palo Alto rather than one canonical street address. Leadership disclosure is stronger than governance disclosure: official materials clearly identify Justin Lewis-Weber as CEO and Theo Patt as CTO, while also naming Richard Palmer and Jesse Cravens in commercial and engineering roles. Justin’s official bio and earlier press coverage
    make the founder-market-fit thesis legible: he frames insurance claims as an overlooked systems problem, brings prior startup experience in autonomous aircraft and wireless energy beaming, and ties that background to Assured’s structured-data-first design choices. Theo’s official bio adds technical credibility through Stanford computer science training and a prior startup, Eventive, but public materials reviewed here do not provide a board roster or broader governance map.'
