- id: capitalization-and-scale
  title: Capitalization, scale signals, and what is still uncertain
  body: 'Capital formation is the cleanest externally corroborated milestone in the chapter, while scale metrics remain the messiest. Bloomberg reported in March 2025 that Assured raised equity at about a $1 billion valuation with ICONIQ Capital and Kleiner Perkins participating, and Tracxn independently shows a March 5, 2025 round at a $1 billion post-money valuation. After that point, the public data stack diverges. Tracxn labels the financing a Seed round and says the company has 18 institutional investors, whereas CB Insights and a Costanoa portfolio page refer to the latest round as Series B. Total capital raised is also inconsistent: CB Insights shows $23.04 million, PitchBook excerpt text shows $26.5 million, and GetLatka estimates $32.5 million across three rounds. Headcount is similarly non-convergent, with GetLatka around 92 employees, PitchBook excerpt text at 98, Tracxn at 114 as of May 2026, and recruiting-oriented sites describing a fully remote organization with active hiring.
    Those differences are large enough that they should be preserved, not averaged away. The appropriate company-overview posture is therefore: valuation around $1 billion is reasonably supported, investor participation from marquee firms is corroborated, but total raised, headcount, and revenue remain diligence items rather than reusable report-wide facts.'
