  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A company-confirmed capitalization summary or investor document reconciling lifetime primary capital raised and whether any secondary was included.
    whyItMatters: Latest-round framing is important for stage, dilution, and valuation-context analysis, but public databases disagree materially.
    diligencePath: Request management confirmation of each round amount, date, and whether reported totals include converted notes or secondary liquidity.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO006
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-confirmed employee count with a clear date and whether contractors are included.
    whyItMatters: Headcount is a key maturity signal for execution capacity, but public estimates currently span roughly 92 to 114 people.
    diligencePath: Ask for current full-time employee count, engineering share, and open requisition count as of run date 2026-06-11.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO006
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Management-confirmed ARR or revenue run-rate, plus whether the cited $22M figure is GAAP revenue, ARR, bookings, or an estimate.
    whyItMatters: Revenue quality and definition directly affect stage assessment and later valuation work, but the only numeric datapoint reviewed is a low-confidence estimate.
    diligencePath: Request finance KPI disclosure with period, metric definition, and any concentration notes before reusing revenue in later chapters.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
    - TO006
  - type: missing-source
    severity: material
    topic: governance-and-customers
    missingEvidence: A current board roster, governance structure, and disclosed customer-count or reference-customer set.
    whyItMatters: Leadership concentration is visible, but governance depth and customer-scale proof remain too thin for later diligence chapters to treat as settled facts.
    diligencePath: Request board composition, lead independent director if any, top customer references, and a current paid-customer or carrier-count metric.
    relatedQuestionRefs:
    - QO009
    - QO021
    relatedTableRefs:
    - TO002
    - TO005
  - type: missing-source
    severity: minor
    topic: milestone chronology TO007
    missingEvidence: Dated partnership, governance, and regulatory milestones that would make the chronology more complete beyond the supportable product and financing entries already captured.
    whyItMatters: TO007 is intentionally partial because public evidence is stronger on product and financing milestones than on board, partnership, or regulatory events.
    diligencePath: Ask management for a dated corporate timeline covering board formation, major launches, notable partnerships, and any material adverse events.
    relatedTableRefs:
    - TO007
