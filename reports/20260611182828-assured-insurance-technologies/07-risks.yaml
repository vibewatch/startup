  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Customer concentration, ARR, burn, gross retention, net retention, and pilot-to-production conversion data.
    whyItMatters: These metrics determine whether the business is diversified and durable enough to survive insurer procurement delays or integration churn.
    diligencePath: Request a customer cohort table showing top-account revenue mix, logo count, renewal history, pilot conversion rates, and current ARR by module.
    relatedQuestionRefs:
    - QR025
    - QR026
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: model-validation
    missingEvidence: Independent model-evaluation pack covering hallucination controls, escalation rates, false-positive/negative rates, and quality by workflow.
    whyItMatters: Public marketing claims about autonomy and guardrails do not show whether the models perform safely across edge cases or catastrophe surges.
    diligencePath: Request recent internal QA dashboards, adverse-test results, red-team summaries, and any third-party model-risk or fairness assessments.
    relatedQuestionRefs:
    - QR009
    - QR031
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: vendor-dependency
    missingEvidence: Named cloud, model, telecom, email, and vendor-network counterparties plus contract terms on redundancy, SLA credits, and audit rights.
    whyItMatters: Assured’s products are integration-heavy and communications-heavy, so hidden single points of failure or weak contractual protections could amplify outages or compliance misses.
    diligencePath: Request the current subprocessor list, major third-party contracts, uptime or incident history by dependency, and carrier security-questionnaire responses.
    relatedQuestionRefs:
    - QR014
    - QR016
    - QR017
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: people-bench-depth
    missingEvidence: Current org chart for compliance, security, implementation, and finance leadership plus escalation ownership for model-risk events.
    whyItMatters: Execution risk rises if senior ownership of regulated messaging, security incidents, and carrier audit responses is concentrated or under-resourced.
    diligencePath: Request an org chart, named accountable owners, incident-response RACI, and hiring plan for implementation and compliance functions.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
