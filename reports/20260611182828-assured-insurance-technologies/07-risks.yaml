- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Claims-conduct / regulatory exposure
    - Regulator complaints, market-conduct requests, or carrier legal escalations tied to automated communications or claim steps
    - Any named regulator inquiry, repeat claimant-communication defect, or carrier rollout freeze tied to compliance concerns
    - Pause conviction until management provides root-cause analysis, remediation plan, and evidence of carrier sign-off
  - - Privacy / cybersecurity
    - Incident frequency and control evidence
    - Any material data incident, inability to produce incident log, or failure to provide third-party risk pack
    - Treat as thesis break unless management can show containment, scope, and credible control maturity
  - - AI explainability / quality
    - Model testing and override evidence
    - No recent QA pack, no escalation-rate data, or inability to show human-review path for sensitive decisions
    - Downgrade confidence and require third-party validation before underwriting scale claims
  - - Partner / integration dependency
    - Production conversion and uptime by integration-heavy modules
    - Pilot wins without production conversion, repeated connector failures, or undisclosed key dependency concentration
    - Discount expansion assumptions and require module-level retention data
  - - Disclosure / concentration opacity
    - Customer and financial transparency
    - Management refuses to provide top-account mix, renewal history, ARR bridge, or cash runway in diligence
    - Treat opacity itself as a major negative and avoid extrapolating marketing claims into valuation
  - - Incumbent or carrier build-vs-buy pressure
    - Win-loss trend against suites or internal builds
    - Meaningful rise in losses to incumbent suite consolidation or insurer internal AI programs
    - Cut assumed TAM capture and require evidence of durable workflow advantage
  notes: Triggers are designed to be monitorable within normal diligence and post-investment reporting, not aspirational management goals.
