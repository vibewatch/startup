evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A company-confirmed capitalization summary or investor document reconciling lifetime primary capital raised and
      whether any secondary was included.
    whyItMatters: >-
      Latest-round framing is important for stage, dilution, and valuation-context analysis, but public databases
      disagree materially.
    diligencePath: >-
      Request management confirmation of each round amount, date, and whether reported totals include converted notes or
      secondary liquidity.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO006
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-confirmed employee count with a clear date and whether contractors are included.
    whyItMatters: >-
      Headcount is a key maturity signal for execution capacity, but public estimates currently span roughly 92 to 114
      people.
    diligencePath: Ask for current full-time employee count, engineering share, and open requisition count as of run date 2026-06-11.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO006
  - type: private-evidence-only
    severity: material
    topic: revenue
