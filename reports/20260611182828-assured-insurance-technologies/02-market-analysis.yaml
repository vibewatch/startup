- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to Assured
  rows:
  - - FNOL and intake automation
    - Digital FNOL, dynamic questioning, voice intake, document capture, structured data creation
    - Indemnity paid to claimants, repair labor, appraisals outside software scope
    - Claims ops leader / digital claims budget
    - Core wedge for Assured's structured-data-first platform
  - - Claimant communications
    - SMS, email, updates, reminders, e-signature, translation, follow-up orchestration
    - General CRM or marketing automation unrelated to active claims
    - Claims service leader / claims ops
    - Matches Assured messaging and agentic follow-up modules
  - - Fraud and risk scoring
    - Behavioral signals, risk flags, SIU routing, corroboration workflows
    - Recoveries already lost, criminal prosecution costs, broad enterprise anti-fraud outside claims
    - SIU leadership / claims transformation
    - Directly aligned with Assured fraud positioning
  - - CAT triage and surge handling
    - Mass-intake, triage, routing, claimant communications, field coordination workflows
    - Physical catastrophe losses, reinsurance, emergency response spend
    - CAT claims leadership / claims ops
    - Important spike-driven use case for modular deployment
  - - Incumbent core claims suites
    - Lifecycle workflow, assignment, reserves, payments, knowledge, ecosystem connectors
    - Whole-policy admin stack, billing, underwriting, non-claims workflows
    - CIO + claims leadership
    - Primary incumbent substitute and integration counterparty
  - - Excluded insurer spend
    - None for direct software capture
    - Premiums, reserves, indemnity, repair networks, most litigation, reinsurance
    - Enterprise finance / actuarial / legal
    - Useful backdrop, but not valid software TAM
  notes: This table separates monetizable claims-software spend from much larger insurer balance-sheet and service-cost pools that should not be counted as Assured TAM.
