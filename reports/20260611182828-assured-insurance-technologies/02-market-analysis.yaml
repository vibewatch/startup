  evidenceGaps:
  - type: missing-source
    severity: material
    topic: point-solution-sam
    missingEvidence: A direct U.S. P&C claims-automation spend breakout for FNOL, messaging, fraud, and CAT point solutions by line of business and carrier tier.
    whyItMatters: Without a clean SAM, any market-size estimate for Assured must rely on broader workload and operating-pressure proxies that overstate or blur the company's direct revenue opportunity.
    diligencePath: Request carrier budget benchmarks from specialist analysts or survey current customers and prospects on annual spend for claims-intelligence modules versus core claims systems.
    relatedQuestionRefs:
    - QM003
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: assured-commercial-proof
    missingEvidence: Assured's pricing model by module, average contract value, implementation cost, referenceable carrier case studies, and measured ROI after deployment.
    whyItMatters: Those inputs are required to translate the market backdrop into Assured's realistic revenue capture and to judge whether the company can expand from one workflow wedge into a broader platform position.
    diligencePath: Ask management for cohort-level customer data, win-loss notes against incumbents, module attach rates, and at least three anonymized deployment scorecards covering cycle time, leakage, and claimant outcomes.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: material
    topic: carrier-budget-breakout
    missingEvidence: A public annual-report or filing disclosure that isolates claims-automation software budget as a standalone line item for large U.S. P&C carriers.
    whyItMatters: Buyer and payer mapping is directionally clear, but lack of direct budget disclosures limits confidence in bottom-up budget sizing and makes contract-value triangulation difficult.
    diligencePath: Supplement public filings with carrier procurement records, RFPs, consultant channel checks, or management interviews that reveal which operating or IT budgets actually fund these purchases.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: regulator-specific-assured-view
    missingEvidence: Any regulator, litigation, or enforcement record specifically naming Assured's claims AI, model governance, or consumer-harm issues.
    whyItMatters: The chapter can document general AI-governance risk, but company-specific adverse evidence would materially sharpen the underwriting view on whether market constraints are merely theoretical or already affecting Assured.
    diligencePath: Search state insurance departments, litigation dockets, and consumer-complaint databases for Assured-specific references and ask management whether any regulator has reviewed its claims-decision tooling.
    relatedQuestionRefs:
    - QM021
    - QM024
    relatedTableRefs:
    - TM004
