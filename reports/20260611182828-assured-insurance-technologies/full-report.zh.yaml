companyProfile:
  summary: >-
    Assured Insurance Technologies 成立于 2019 年，是一家私营理赔自动化软件公司，聚焦美国财产与意外险保险公司。它的 Claims Intelligence Platform
    被定位为围绕既有承保商系统的模块化覆盖层，而不是核心系统替代品：从结构化 FNOL 报案切入，延伸到消息、服务指派、欺诈、灾害处理和智能体工作流支持。公开证据支持真实的产品广度、部分无需集成的部署路径，以及 2025 年 3
    月的独角兽融资，但公司在收入质量、客户证明、治理深度和资本结构上披露仍薄。
  foundedDate: '2019-01-01'
  founders:
    - name: Justin Lewis-Weber
      role: CEO 兼联合创始人
      background: Stanford 航空航天专业毕业；创办 Assured 之前，曾创办自主飞行器和无线能量传输领域的创业公司。
