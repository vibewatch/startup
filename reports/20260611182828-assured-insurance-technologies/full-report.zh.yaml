      - 尽调路径
    rows:
      - - 收入质量
        - 2024-2025 年经审计收入、ARR、预订额和服务收入占比
        - 决定估值真正的分母
        - 获取审计报表和月度收入桥接表
      - - 利润率
        - 按产品、云、支持和服务拆分的毛利率
        - 检验 Assured 更像软件，还是工作流重运营
        - 索取产品级 COGS 和利润率瀑布图
      - - 留存
        - GRR、NRR、队列扩张和续约节奏
        - 判断产品楔子是否持久
        - 审阅队列表和头部客户续约情况
      - - 客户集中度
        - 前 10 大账户、ACV 组合和业务线暴露
        - 如果收入集中，少数保险公司就能扭曲质量判断
        - 索取集中度明细和具名客户访谈
      - - 资本结构
        - 股权结构表、清算优先权、董事会条款和按比例认购权
        - 即便企业价值不变，也会改变回报数学
        - 审阅最新股权结构表和已签署融资文件
      - - AI 治理
