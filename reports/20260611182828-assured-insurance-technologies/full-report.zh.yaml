      - - 消息与沟通工作流
        - 扩展理赔对话、通知、翻译和企业消息
        - 模块费、席位费、用量或打包合同
        - 能力公开，定价不公开
        - 低至中：可能有粘性，但单位经济性取决于消息量和支持负担
        - 提供模块级附加率、实际定价和毛利贡献
      - - Service Assignment 与供应商协调
        - 安排维修、租车、拖车、查勘和承包商工作流
        - 按分派、平台费或打包工作流费
        - 运营上重要且公开可见；变现基础未知
        - 低至中：工作流价值强，但供应商编排可能带有服务型成本
        - 拆分留存收入与代收转付或合作伙伴资助的经济性
      - - 合规 / AI 辅助工作流扩展
        - 数字签名、通知、审计轨迹、翻译和智能体跟进扩大钱包份额
        - 附加模块或企业打包
        - 公开功能可见，直接变现不可见
        - 低至中：若作为高级能力销售，可抬高 ACV
        - 提供合规、翻译和 AI 助手功能的价格上浮幅度
      - - 实施与客户成功
