      - - 隐私 / 网络安全
        - 事件频率和控制证据
        - 任何重大数据事件、无法提供事件日志，或未能提供第三方风险包
        - 除非管理层能证明已控制事件、厘清范围且控制成熟度可信，否则视为投资逻辑破裂
      - - AI 可解释性 / 质量
        - 模型测试和人工覆写证据
        - 没有近期 QA 包、没有升级率数据，或无法展示敏感决策的人审路径
        - 下调信心，并在承保规模化说法前要求第三方验证
      - - 合作伙伴 / 集成依赖
        - 集成重模块的生产转化和正常运行时间
        - 试点赢单但未转入生产、连接器反复故障，或未披露关键依赖集中度
        - 下调扩张假设，并要求模块级留存数据
      - - 披露 / 集中度不透明
        - 客户和财务透明度
        - 管理层在尽调中拒绝提供头部账户组合、续约历史、ARR 桥或现金跑道
        - 把不透明本身视为重大负面，避免把营销说法外推进估值
      - - 既有厂商或保险公司自建压力
        - 相对套件或内部自建的赢单 / 输单趋势
        - 输给既有套件整合或保险公司内部 AI 项目的情况显著增加
        - 下调假设 TAM 获取，并要求证明工作流优势可持续
    notes: 这些触发项设计成可在常规尽调和投后报告中监控，而不是管理层的愿景目标。
