      - number: '6.3'
        title: 耐久性、采购摩擦与留存可见度
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录明显变弱的地方。Assured 自己的材料清楚显示，采购常由试点驱动：2026 年「Test before you
              invest」白皮书主张真实环境试点、一次处理一件理赔的方式，以及在更大范围推出前用低负担方式验证 ROI。Service Assignment Lite
              也用数天上线、无需承保商设置或集成来强化这一信息。这可以帮助采用，但也意味着投资者需要从试点转生产的转化证明，而不只是试点话术。公开保留来源没有披露客户数、部署数、NRR、GRR、流失、续约、合同期限或满意度指标。即便同行评论入口，在公开抓取中也太薄，无法补上缺口。更宽的保险公司市场语境支持谨慎：BCG
              称只有 7% 的保险公司成功规模化 AI，约三分之二仍停留在试点模式；Everest 称理赔是规模最大的实时生产 AI 用例，但强调企业就绪度仍取决于执行能力和生态适配。含义不是 Assured
              缺乏耐久性；而是公开证据尚未证明它。投资者因此应把耐久性作为信息请求，而不是从官网语言外推。
