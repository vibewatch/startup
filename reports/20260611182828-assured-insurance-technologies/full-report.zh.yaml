            body: >-
              本章中最强的公开交叉验证事实，是 2025 年 3 月的估值锚，而不是支撑估值的经营分母。Bloomberg、PitchBook、CB Insights、GetLatka 和 Tracxn 都指向约 $1
              billion 的水平，Bloomberg 还点名 Iconiq 和 Kleiner Perkins
              参与该轮。这足以说明市场接受了独角兽价格；但还不足以说明该价格仍提供有吸引力的风险调整后入场点。最好的公开收入数字，是第三方 GetLatka 对 2025 年 $22 million
              的估计；与此同时，市场数据提供商在轮次阶段、累计融资甚至当前员工数上都不一致。Assured
              官方材料清楚支持其在理赔智能软件中有真实产品楔子，但没有披露定价、留存、毛利率或现金。因此结论必须对价格敏感：公司在战略上看起来有意思，但当前公开记录还不足以让人有把握地承保这个价格。
