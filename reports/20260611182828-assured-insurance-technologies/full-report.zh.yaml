      - number: '8.3'
        title: 在收入质量被证明前，牛基熊区间应保持很宽
        blocks:
          - type: paragraph
            body: >-
              这里做情景分析，比假装公开记录能给出单一公允价值更诚实。以当前第三方收入代理计算，$1 billion 标记意味着约 45.5x 的过去收入倍数。即便实际收入更接近 $30 million 或 $35
              million，隐含倍数仍约为 33x 到 29x。只有在 Assured 处于陡峭增长曲线早期、$22 million
              代理低估当前规模，并且公司能把自动化证明转化成耐久的多模块扩张和软件式利润率时，这个倍数才说得通。因此，基准情景应折价上一轮，而不是简单确认上一轮。悲观情景承认，服务强度、弱留存或收入夸大都会迅速压缩价值。乐观情景给管理层的强产品证据和投资人质量以信用，但仍要求公开记录尚未提供的经营证明。
