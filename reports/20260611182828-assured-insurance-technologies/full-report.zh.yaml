      - number: '1.3'
        title: 资本化、规模信号与仍不确定之处
        blocks:
          - type: paragraph
            body: >-
              本章里，资本形成是最干净、外部佐证最强的里程碑；规模指标则最乱。Bloomberg 2025 年 3 月报道称 Assured 以约 $1 billion 估值完成股权融资，ICONIQ Capital 和
              Kleiner Perkins 参投；Tracxn 也独立显示 2025 年 3 月 5 日有一轮投后估值 $1 billion 的融资。此后，公开数据栈开始分叉。Tracxn 把该融资标为 Seed
              轮，并称公司有 18 家机构投资者；CB Insights 和 Costanoa 作品集页面则把最近一轮称为 Series B。累计募资也不一致：CB Insights 显示 $23.04
              million，PitchBook 摘录文本显示 $26.5 million，GetLatka 估计三轮合计 $32.5 million。员工数同样无法收敛：GetLatka 约 92 人，PitchBook
              摘录为 98 人，Tracxn 截至 2026 年 5 月为 114 人，招聘导向网站则描述为完全远程且仍在招聘。这些差异足够大，应该保留而不是平均掉。因此，公司概览的恰当姿态是：约 $1 billion
              估值得到较合理支撑，头部机构参投得到印证，但累计融资、员工数和收入仍是尽调事项，不能直接当作全报告通用事实。
