  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开架构更适合理解为分层的受理、增强、编排、系统接口和人工治理界面，而不是一个单体理赔核心。
    data:
      layers:
        - label: 索赔人和客服渠道
          modules:
            - 自助式 FNOL 网页应用
            - Sidekick 电话受理
            - Voice AI 前端
            - 覆盖 SMS、电子邮件和应用内渠道的消息触达
        - label: 结构化受理和增强
          modules:
            - 动态问题流
            - 机器可读理赔数据
            - 50+ 个外部数据源
            - 录音文本、文件和签名
        - label: 工作流自动化层
          modules:
            - First Contact
            - Emma 下一最佳动作自动化
            - Fraud / Prophecy 信号插入
            - CAT 和 Service Assignment 工作流
        - label: 保险公司和生态接口
          modules:
            - 低改造量 API 写入保险公司系统
            - 核心理赔和保单系统
            - 服务商和排期集成
            - 可选的相邻支付或供应商工具
        - label: 人工治理和信任
          modules:
            - 理赔员交接和异常处理
            - 合规通知和审计导出
            - 隐私 / 安全控制
            - 披露和升级路径
    approximationNotes: 这套栈有意只抽象公开证据能够支撑的层级；隐藏基础设施、模型服务和供应商细节因公开证据不足而省略。
