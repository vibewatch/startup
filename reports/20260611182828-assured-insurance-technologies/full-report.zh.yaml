      - number: '2.2'
        title: 规模测算视角：最好的公开数字是工作量、摩擦和漏损代理指标
        blocks:
          - type: paragraph
            body: >-
              公开来源没有给出干净的美国美元 SAM，专门对应服务 FNOL、消息、欺诈和 CAT 工作流的单点理赔智能供应商。证据反而支持几组不可相加的规模视角。NAIC 2025 年行业报告显示，美国 P&C
              直接承保保费为 $1.1 trillion，净承保保费为 $976.8 billion，行业综合成本率为
              92.9%。这些数字不是软件收入池，但展示了承保商理赔预算下方的运营底座。同一报告估计，强对流风暴造成的投保损失连续第三年约 $50 billion；Triple-I/Milliman 则显示 2024
              年险种经济性仍承压，包括房主险预计净综合成本率 104.8、一般责任险 103.7。


              第二个视角是漏损和可避免成本。NAIC 和 Coalition Against Insurance Fraud 继续引用每年约 $45 billion 的 P&C 欺诈损失；NICB 2024
              年报告则强调灾害欺诈应对活动加剧。第三个视角是周期时间和服务压力。J.D. Power
              显示，维修和赔付周期长、沟通渠道非首选，以及简单理赔推进慢时满意度会受到明显惩罚。合在一起，这些视角解释了为什么理赔自动化预算存在，但仍不能直接换算成 Assured 收入。正确结论是，需求环境大且持续，但可变现
              SAM 仍受证据约束，必须通过承保商预算、理赔量、模块定价和胜率数据来承保；本章没有这些公开数据。
