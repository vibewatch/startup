        title: 信任控制与工程信号
        blocks:
          - type: paragraph
            body: >-
              信任和控制证据真实但不完整。Assured 公开声称具备 SOC 2 Type II 和 HIPAA，运行负责任披露政策，并展示消息控制能力，如可审计导出、PII
              检测与脱敏、符合州要求的通知，以及退订管理。Voice AI 和 Emma 也明确在敏感情境保留人工环路：Voice AI 称会把法律和责任问题转给理赔员，Emma
              称在需要同理心或人工判断时升级。这些信号对一个处理受监管且情绪敏感交互的理赔工作流产品有意义。不过，隐私姿态更混合。Assured
              隐私政策披露了广泛的理赔数据采集、设备和使用数据、分析工具、广告伙伴，以及来自伙伴的数据流入；这意味着尽调需要把营销网站埋点和生产理赔处理控制分开，再给信任叙事充分信用。工程信号同样是方向性的，而非决定性的。招聘页面显示平台、云基础设施、SRE、安全、数据科学和测试职能都在招聘，支持公司仍在持续搭建产品；但招聘本身不能替代公开
