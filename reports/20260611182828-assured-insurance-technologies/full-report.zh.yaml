        - 更偏宽套件，可能超过模块化切入点买方想买的范围
      - - CCC Intelligent Solutions
        - 网络 / 车险理赔既有厂商
        - 公开上市网络既有厂商；公开披露 300+ 家车险公司，每年处理 18M+ 件理赔
        - 车险公司和维修生态参与者
        - 车险理赔编排、伤害赔偿、维修、零部件、付款、生态连接
        - 维修和伙伴网络深，配合事件驱动工作流和 AI 数据平台
        - 相比广义多险种理赔运营层，更偏车险中心和网络中心
      - - Verisk
        - 数据 / 估损 / 欺诈既有厂商
        - 公开上市数据既有厂商；投资者材料强调其在全球保险分析和理赔结果中的角色
