        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 图像更像企业直销，由思想领导内容、试点项目和快速初始部署支撑，而不是纯自上而下的 RFP 替换销售。Assured 的白皮书和博客文章服务于理赔领导的需求生成；多个页面强调 IT
              负担低、兼容既有核心系统，以及 Service Assignment Lite 等较轻产品可数天上线。财务上，这意味着落地动作的摩擦低于完整核心套件迁移。公开牵引力证据质量仍混杂。官方口径称 Assured
              每年处理数千万件理赔，并展示量化结果主张，如周期时间缩短 4–6 天、每件理赔节省约 $119、每件理赔减少 3–5 通电话，以及某些部署下客户满意度 4.8/5。第三方数据库补充了 2025 年 3
              月独角兽估值，以及 2025 年收入 $22M、员工约 92 人的估计，但这些数字未经公司审计，只能当方向性参考。可以中等置信度说的是，Assured 的销售故事由 ROI
              驱动：承保商在理赔成本压力下买一个工作流，证明运营节省，再逐模块扩张。公开不能说明的是，这套动作是否转化为高效 CAC、健康回本期或集中在少数保险公司层面的收入。
