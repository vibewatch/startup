      - CV032
      - CV033
      - CV041
      - CV042
      - CV043
  - id: FV002
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公开文件在产品可信度上得分较高，但在价格支撑、分母质量和尽调完整性上得分较低。
    approximationNotes: 数值是基于所引声明合成的序数判断，不是管理层披露的指标。
    data:
      items:
        - label: 价格支撑
          value: Weak
          detail: 融资轮锚点清晰，但当前入场逻辑还缺少完整尽调支撑
          tone: risk
        - label: 产品证明
          value: Strong
          detail: 结构化数据平台、Emma 自主能力和工作流覆盖面叙述一致
          tone: positive
        - label: 收入分母
          value: Weak
          detail: 公开收入来自第三方估算，不是公司披露
          tone: risk
        - label: 利润率证明
          value: Weak
          detail: 未见 Assured 公开披露毛利率或 CAC / 回本周期
          tone: risk
        - label: 可比成熟度
          value: Moderate
          detail: 同业验证了品类，但规模更大，披露也充分得多
          tone: warning
        - label: 尽调就绪度
          value: Incomplete
          detail: 提升确信度前，需要核验经审计收入、留存、客户集中度和股权结构经济账
          tone: risk
    claimRefs:
      - CV016
      - CV022
      - CV028
      - CV030
      - CV034
      - CV035
      - CV044
