      - number: '7.3'
        title: 合作伙伴、集成与现有厂商依赖风险
        blocks:
          - type: paragraph
            body: >-
              Assured 的产品价值主张，依赖于编排公司无法完全控制的系统和交易对手。Voice AI 承诺可通过 API 直接提交进承保方核心系统。Messaging
              依赖通信渠道、退出处理，以及跨通信界面的可审计交付。Service Assignment 依赖 DRP、MSO、租车、拖车、承包商及相关服务网络，同时套用承保方业务规则和州合规逻辑。服务条款还提到
              SMS、iMessage 和其他第三方平台。公开材料没有说明这些体验底层使用的云、模型、电信或交付交易对手，也没有描述冗余、故障切换设计或 SLA
              保护。这种不透明很关键，因为重集成的理赔工具常常坏在接缝处：上游数据漂移、下游承保方核心系统变化、渠道中断或供应商网络故障，都可能在软件公司报告传统意义的宕机之前，就先拉低索赔人体验。


              可比上市公司披露支持把这视为一阶风险，而不是实施脚注。Guidewire 的 10-K 称，理赔平台供应商仍暴露在数据安全事件、AI
              监管不确定性、隐私法演进，以及对相对少数客户和系统集成商伙伴的依赖之下。承保方采用研究又加了一层：即便保险公司想用 AI，遗留系统集成、采购摩擦和数据孤岛也会拖慢规模化。Assured 的轻集成 Service
              Assignment Lite 路线，靠降低初始部署摩擦部分缓释这一点，但也把尽调重点转向试点能否转成受治理、黏性强的生产使用。与此同时，承保方和既有厂商并没有原地等待。AIG
              年报显示，一家大型承保方正在理赔中规模化智能体 AI；Guidewire 也继续把 AI 嵌入核心套件。Assured
              因此面临双重依赖风险：既需要承保方配合完成落地和扩张，也需要保险公司不要认定核心套件供应商或内部自建已经「够好」。
