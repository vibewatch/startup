  - id: FV001
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 给出宽区间比给单点目标更诚实，因为公开融资轮次可见，但运营分母仍是私有信息。
    approximationNotes: 情景区间是分析估计，不是市场报价；隐含倍数仅用公开 $22M 收入代理做敏感性分析。
    data:
      items:
        - label: 悲观情景估值
          low: 350
          mid: 475
          high: 600
          unit: $M
          description: 如果收入质量或利润率结构不及预期，下行空间会打开。
        - label: 基准情景估值
          low: 650
          mid: 775
          high: 900
          unit: $M
          description: 因留存、利润率和集中度风险未解决，相对上一轮打折。
        - label: 乐观情景估值
          low: 1000
          mid: 1150
          high: 1300
          unit: $M
          description: 需要强有力的私有证据证明，公开收入低估了当前经常性规模。
        - label: 基于 $22M 收入的隐含倍数
          low: 45.5
          mid: 45.5
          high: 45.5
          unit: x
          description: $1B 除以公开 2025 年收入代理。
        - label: 基于 $30M 收入的隐含倍数
          low: 33.3
          mid: 33.3
          high: 33.3
          unit: x
          description: 若当前规模显著高于公开代理，用于敏感性分析。
        - label: 基于 $35M 收入的隐含倍数
          low: 28.6
          mid: 28.6
          high: 28.6
          unit: x
          description: 即便分母更强，估值仍属溢价。
    claimRefs:
