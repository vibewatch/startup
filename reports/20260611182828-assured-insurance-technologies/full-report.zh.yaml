        - 中：明显由软件主导，但实际定价不公开
        - 提供实际主服务协议模板、计费单位定义和续约条款
      - - 试点 / 先验证部署
        - 初始真实环境试点在规模化承诺前验证 ROI
        - 试点费、折扣年度合同或结构化试用
        - 公司公开强调这一点；经济性未披露
