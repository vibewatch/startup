  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与理赔行为风险
        blocks:
          - type: paragraph
            body: >-
              Assured
              最大的风险不是公司已知遭遇公开执法，而是产品嵌入了保险公司本就受到严格监管的理赔活动。公司公开营销直接报案、全渠道通知、智能体跟进，以及可按州配置的服务分配话术。也就是说，适用的法律框架不是泛泛的企业软件法，而是既有理赔行为监管体系。NAIC
              的 AI 公报讲得很直白：AI 支持的理赔管理仍必须遵守不公平交易和不公平理赔和解标准，监管方也可在调查或市场行为检查中要求提交治理和模型文档。Model 900 和 Washington
              的不公平理赔规则把运营义务落到实处：及时沟通、合理调查、公平和解行为、准确解释，不会因为引入自动化就变成可选项。


              Assured 对工作流的描述放大了这一监管体系的重要性。Voice AI 称可把理赔直接提交进承保方系统；Messaging 称可自动化通知和下游动作；Emma 称可自主处理接近 70% 的互动；Service
              Assignment 称可优化服务网络获取，同时维持反引导合规。这些功能有价值，但也正是偏见、幻觉、延迟或解释不充分的输出最容易变成理赔处理问题的界面。Colorado
              的算法歧视法规进一步说明，理赔场景并不免于算法审查；法律评论现在也把黑箱理赔 AI 视为透明度和复核失灵时可能触发的恶意理赔或合同风险。已审查的公开执法库中没有发现针对 Assured
              的公开个案，因此投资者应把它界定为制度暴露，而不是编造公司丑闻。但这一制度本身真实、活跃，而且对文档的要求越来越重。
