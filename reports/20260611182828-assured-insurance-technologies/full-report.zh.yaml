  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群覆盖与买方图谱
        blocks:
          - type: paragraph
            body: >-
              可支撑的客户故事从分群开始，而不是从 logo 开始。Assured 的公开页面始终瞄准美国 P&C
              承保商内部的理赔组织，承保商理赔领导很可能是买方和付款方，理赔员和呼叫中心团队是日常用户，保单持有人或理赔人则是外部工作流参与者。最强证据不是客户名单，而是覆盖图：当前页面明确声称可为个人车险、商业车险、房主险、商业财产险和工伤赔偿险提供
              turnkey 部署，并为其他险种提供白手套实施。公开工作流例子也把具体模块绑定到具体角色。Sidekick 面向 CSR 和电话 FNOL；Voice AI 处理面向理赔人的报案；First Contact
              以数字方式收集理赔人和证人信息；Service Assignment 协调维修厂、租车供应商、拖车运营商和承包商等供应商。这给了 Assured
              一个可信的按用例分群故事，尽管没有给出命名账户名单。尽调上，务实读法是 Assured
              正向承保商理赔组织销售一个跨险种理赔运营层，而不是狭窄的单功能点工具。仍缺失的是公开证据：到底有多少承保商在生产中实际使用每个细分动作。
