      - number: '2.4'
        title: 驱动与约束：预算紧迫性真实，但信任、监管和既有厂商锁定拖慢转化
        blocks:
          - type: paragraph
            body: >-
              Assured 的驱动因素可信。FIO 称 AI 已在现代化理赔处理和欺诈检测；其引用的调查也显示，多数私家车险和房主险保险公司至少正在使用、计划使用或探索 AI 与机器学习。Accenture 的承保商研究和
              Crawford
              市场评论都指向同一方向：理赔现代化已经从可选转型话术，转向带有可衡量高管关注的成本、服务和韧性项目。灾害压力、欺诈损失、理赔人对长周期的不满，以及碎片化遗留系统的负担，都支持理赔智能工具的持续支出。


              但约束同样关键。FIO 指出，AI 支持的保险公司决策仍受现有保险法和 NAIC 治理预期约束。AIG 自己的年报说得更直接：承保和理赔中的生成式 AI 会带来安全、法律、监管、偏见和声誉风险。Guidewire
              把僵硬核心系统和碎片化数据描述为结构性阻碍；J.D. Power 显示，即便承保商数字化，许多理赔人仍会跨渠道切换或偏好人工支持。对 Assured
              来说，含义是混合的。公司很好地贴合了一个想在难以替换的核心理赔环境周围加模块化覆盖层的市场。但要从有前景的模块扩展成耐久的平台供应商，取决于可供引用的承保商部署、可衡量
              ROI、可审计性，以及与既有生态共存的能力；这些生态已经控制了承保商工作流和预算权的大块份额。
