    data:
      items:
        - label: Guidewire 公开规模代理指标
          value: 450+ insurers
          note: 大型装机基础抬高切换成本，也支持加购扩张，而不是被替换
        - label: Duck Creek CAT 代理指标
          value: 60K+ claims/day
          note: 公开 CAT 规模吞吐说明既有厂商也能主张激增准备度
        - label: CCC 网络代理指标
          value: 35K+ businesses; 18M+ annual claims
          note: 即使 CCC 不是完整理赔核心，网络广度也给它分销力量
        - label: Mitchell APD 代理指标
          value: 95M+ collision claims; 100+ carriers
          note: 聚焦车险的既有厂商，在核心套件决策之外仍保有可观工作流份额
        - label: Snapsheet 现代平台代理指标
          value: 170+ customers; 16 of top 20 P&C carriers
          note: 现代独立竞争对手已有公开规模主张，不只是既有厂商在竞争
        - label: Assured 公开信任缺口
          value: Customer count undisclosed
          note: 现阶段，Assured 的护城河更取决于可证明的结果和客户证明，而不是公开规模信号
        - label: 护城河结论
          value: Moderate, wedge-led
          note: 最适合的路径是模块化落地再扩张；最大风险是 Assured 证明持久结果优势之前，既有厂商和点解决方案先作出回应
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Assured 似乎靠模块化试点、生产部署，以及跨理赔工作流的钱包份额扩张，把保险公司痛点转成经常性软件收入。
