          detail: Assured 面向真实保险公司环境，营销「先证明、后规模化」的试点路径
        - id: r3
          label: 初始模块部署
          detail: FNOL、消息触达或服务分派等单个工作流可以很快上线
        - id: r4
          label: 运营 ROI 验证
          detail: 周期缩短、来电减少、单案节省等证据支撑后续扩张
        - id: r5
          label: 经常性合同扩张
          detail: 保险公司采用更多模块、更多业务线或导入更多理赔量
        - id: r6
          label: 交付后毛利
          detail: 收入仍需覆盖云、支持、合规和编排成本
