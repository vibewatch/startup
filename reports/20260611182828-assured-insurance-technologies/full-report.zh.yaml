      - - Duck Creek
        - 既有核心套件
        - 私营既有厂商；公开披露已处理 30M+ 件理赔，并具备 CAT 级吞吐能力
        - 希望云端核心现代化的 P&C 承运商
        - 理赔加保单、费率、计费、嵌入式支付、伙伴生态
