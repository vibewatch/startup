      - number: '3.2'
        title: 既有厂商权力与装机基础反应
        blocks:
          - type: paragraph
            body: >-
              Guidewire 和 Duck Creek 仍是 Assured 最难跑赢的替代方案，因为它们卖的不只是理赔功能。两者都把理赔包进更宽的核心资产：保单、计费、分析、伙伴生态和长期流程设计。Guidewire
              的公开材料结合了产品深度、270 多家 ClaimCenter 客户、更大的 450 多家保险公司企业客户基础、重 R&D 支出，以及一个让承保商扩展而非替换既有系统的 marketplace 论点。Duck
              Creek 用「Intelligent Core」话术、3000 万以上已处理理赔、CAT 级吞吐、快速规则变更，以及低代码加嵌入式支付扩展来复刻这套打法。案例研究证据比功能清单更重要。California
              Casualty、Zurich、FCCI 和 Markel 都显示，承保商仍在 Guidewire 体系内现代化或加深足迹，而不是退出。这是对轻松替代论的反向证据。Assured
              仍可以作为覆盖层取胜，但当承保商已经为核心套件路线图付费时，创业公司必须证明更快部署和更好的损失成本结果，而不只是更新的 AI 语言。换句话说，既有厂商反应是活跃且有资本支持的，不是停滞的。
