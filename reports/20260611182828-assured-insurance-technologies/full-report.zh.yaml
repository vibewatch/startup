      - number: '2.3'
        title: 买方、用户和付款方：理赔领导买结果，但 IT 和核心架构仍重要
        blocks:
          - type: paragraph
            body: >-
              证据指向一个多利益相关方的购买动作。日常用户是理赔处理员、理赔员、SIU
              团队和灾害运营人员，他们需要更干净的报案、更快分诊、更少交接和更好的理赔人沟通。经济买方通常更高层：首席理赔官、理赔运营负责人，或跨职能转型发起人，他们负责服务水平、漏损和理赔调整费用。短期付款方常在理赔运营预算里；一旦集成、云迁移或更宽的工作流重设计成为必要，付款方就会转向
              CIO 或核心现代化预算。Markel 的 Guidewire 迁移说明了这种模式：承保商为理赔平台投资找理由时，不会把它当作孤立实验，而会把它绑定到客户体验、分析和 IT 简化的运营现代化。


              这种结构为 Assured 这样的模块化供应商创造了有利但仍难规模化的分阶段采用路径。狭窄模块可以借某个具体工作流痛点落地——数字报案、消息、欺诈或 CAT
              高峰处理——但扩张取决于数据标准化、治理审批，以及与既有理赔核心和服务商网络的集成。J.D. Power
              也提醒，不要把「数字化等于更好」简单化。直通处理和主动更新可以显著提升满意度，但部分客户仍偏好人工接触；即使有数字前端，沟通差也会摧毁满意度。这意味着 ROI
              必须同时围绕周期时间、理赔人沟通质量、欺诈漏损和理赔员生产率来表述，而不能只谈自动化。
