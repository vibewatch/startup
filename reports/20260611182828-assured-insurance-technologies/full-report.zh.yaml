            - label: 不清楚
              tone: warning
              detail: 没有保留 Assured 专属部署细节
            - label: 无可见
              tone: risk
              detail: 没有保留公开量化结果细节
            - label: 无可见
              tone: risk
              detail: 没有保留公开留存信号
        - label: 合作伙伴 / 活动证明
