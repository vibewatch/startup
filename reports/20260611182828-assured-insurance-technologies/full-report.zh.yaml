  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开证据在宽泛运营说法上最强，在具名生产证明上更弱，在留存可见性上最弱。
    data:
      columns:
        - 具名客户
        - 生产成熟度
        - 量化结果
        - 留存可见性
      rows:
