      - CE041
      - CE046
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开工作流从结构化受理开始，随后分流到澄清、路由、沟通、服务编排，以及人工或自动化结案路径。
    data:
      nodes:
        - id: n1
          label: 通过网页、电话客服或 Voice AI 报案
          detail: 渠道选择决定 FNOL、Sidekick 或 Voice AI 谁来充当前门。
        - id: n2
          label: 结构化受理验证并增强事实
          detail: 动态问题和外部数据旨在入口处补齐明显缺口。
        - id: n3
          label: First Contact / Emma 收集缺失文件和澄清信息
          detail: 自动化在受理后继续推进，而不是等待理赔员电话往返。
        - id: n4
          label: 反欺诈和分诊逻辑路由案件
          detail: 风险信号和复杂度决定下一条路径。
        - id: n5
          label: 消息触达和服务分派协调下一步
          detail: 索赔人接收更新，并可自助安排租车、维修、查勘或其他服务。
        - id: n6
          label: 保险公司系统接收结构化输出
          detail: Assured 称，数据通过 API 落入既有理赔或保单环境。
        - id: n7
          label: 人工理赔员或自动化路径完成结案
          detail: 常规工作由自动化处理，异常或敏感案件回到人工。
      edges:
        - from: n1
          to: n2
          label: 创建
        - from: n2
          to: n3
          label: 输入
        - from: n3
          to: n4
          label: 支撑
        - from: n4
          to: n5
          label: 触发
        - from: n5
          to: n6
          label: 同步到
        - from: n6
          to: n7
          label: 促成
    claimRefs:
      - CE005
      - CE011
      - CE014
      - CE015
      - CE021
      - CE026
      - CE030
      - CE035
      - CE037
      - CE056
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Assured 的公开工作流更多依赖保险公司系统、外部数据、服务商网络、通信渠道和治理控制，而不是一个已公开披露的独立核心栈。
    data:
      nodes:
        - id: carrier
          label: 保险公司核心系统
          detail: 接收结构化输出的理赔和保单系统
        - id: data
          label: 外部数据源
          detail: 用于塑造受理和决策支持的增强数据流
        - id: channels
          label: 索赔人渠道
          detail: 网页、电话、SMS、电子邮件及相关索赔人交互界面
        - id: providers
          label: 服务商网络
          detail: DRP、MSO、租车、拖车、承包商及相关供应商产能
        - id: governance
          label: 安全、隐私和监管控制
          detail: SOC 2、HIPAA、隐私披露和保险公司治理预期
        - id: assured
          label: Assured 编排层
          detail: 结构化受理加工作流自动化、智能体 AI 和路由逻辑
        - id: humans
          label: 理赔员和保险公司客服
          detail: 处理共情、判断、合规和复杂理赔的异常处理者
      edges:
        - from: channels
