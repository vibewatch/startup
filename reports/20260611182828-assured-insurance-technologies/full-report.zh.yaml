  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Assured
              并不在一条整齐的创业公司赛道里竞争。买方至少可以用五条路径解决同一个理赔智能任务：完整既有理赔套件、车险网络和数据既有厂商、现代独立理赔平台、狭窄单点方案，以及把内部工具和手工工作缝在一起的现状。直接重叠最强的是
              Snapsheet 的现代化理赔核心定位；当承保商评估扩展或刷新既有栈、而不是再加一个供应商时，Guidewire 或 Duck Creek 也会形成强重叠。CCC、Verisk 和 Mitchell
              重要，是因为它们已经嵌在高频车险工作流里，并拥有数据或网络位置，即便不是最好的多险种核心类比，也能阻断分销。One Inc、FRISS、CLARA、Enlyte 和 Tractable
              更窄，但买方仍可以组合它们，在不采购 Assured 的情况下处理支付、欺诈、伤害或定损。Assured 的楔子在承保商想要结构化数据报案、理赔人沟通、CAT
              和欺诈覆盖层，同时不重做整个平台时最清楚。这很有吸引力，但也意味着公司卖进的市场里，「什么都不做」「只买一片」「扩展既有厂商」都是真实替代。
