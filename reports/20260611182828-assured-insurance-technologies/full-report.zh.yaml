  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重程度
      - 证据
      - 缓释 / 尽调问题
    rows:
      - - 模块化叠加层降低替换核心系统的摩擦
        - 既有厂商正把 AI 和自动化加进现有套件
        - 高
        - Guidewire、Duck Creek、CCC、Mitchell 和 Verisk 如今都在营销智能工作流升级
        - 要求证明部署速度，以及相对既有厂商附加模块可量化的漏损或周期时间改善
      - - 数据结构化优先的受理形成差异化楔入点
        - Snapsheet 和既有厂商也在营销统一受理、分派、沟通和自动化
        - 高
        - Snapsheet 和两家核心套件厂商都在讲现代理赔核心故事
        - 要求按工作流拆分，提供相对 Snapsheet 和既有厂商扩展交易的胜率
      - - 欺诈、CAT 与沟通组合后，可以交叉销售成更广的平台
        - 买方仍可按切片购买 FRISS、Verisk、One Inc 或 Tractable，并保持其余系统不变
        - 高
        - 点状替代方案在欺诈、支付和估损上仍有可信度
        - 验证 Assured 在生产账户中有多频繁能从首购模块扩展到更多模块
      - - 轻集成部署是销售优势
        - 公开案例密度和客户数证明落后于既有厂商的信任信号
        - 高
        - Assured 缺少既有厂商和 Snapsheet 披露的公开客户与网络指标
        - 按模块、险种和实施时间批次索取实名客户推荐
      - - 自动化可以降本并改善体验
        - 沟通差、数字化设计跑偏或治理失灵，都会伤害满意度并带来监管风险
        - 中
        - J.D. Power 和 AIG 都显示，数字化设计和 AI 治理不是天然胜利
        - 审计理赔人沟通、升级逻辑、模型治理和合规控制
      - - 更好的 UX 可以绕开汽车维修和数据既有厂商
        - CCC、Verisk 和 Mitchell 仍掌握汽车工作流里根深蒂固的网络和数据资产
        - 中
        - 网络 / 数据杠杆会随时间复利，更支持多归属而非替代
        - 除非 Assured 证明自己在汽车工作流结果上达到品类领先，否则应按共存型供应商承保
    notes: 严重程度反映分析性承保判断，而非公司披露的风险标签。本表强调：Assured 的护城河确实存在，但仍会受到既有厂商反击、点状方案拆分以及信任缺口的冲击。
