    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与领导层基准判断
        blocks:
          - type: paragraph
            body: >-
              Assured Insurance Technologies 对外呈现为面向财产与意外险保险公司的理赔智能软件供应商，而不是承保商、MGA 或面向消费者的保险公司。官网和平台材料始终把产品表述为 AI 驱动的
              SaaS，帮助承保商用结构化数据、自动化和智能体 AI 吞吐、服务并处理理赔。公开第三方资料都指向 2019 年成立、总部位于 California 州 Palo Alto，但具体地址有出入：CB
              Insights 列出 650 Page Mill Road 总部，Tracxn 列出 3 Peter Coutts Circle 注册地址，因此本章最稳妥的事实底座是 Palo
              Alto，而不是某一个标准街道地址。领导层披露强于治理披露：官方材料明确标出 Justin Lewis-Weber 为 CEO、Theo Patt 为 CTO，同时也提到 Richard Palmer 和
              Jesse Cravens 分别承担商业和工程角色。Justin 的官方简介和早期媒体报道让创始人-市场匹配逻辑可读：他把保险理赔定义为被忽视的系统问题，带着自主飞行器和无线能量传输的创业经验，并把这段背景连接到
              Assured 结构化数据优先的设计选择。Theo 的官方简介则用 Stanford 计算机科学训练和此前创业项目 Eventive 补强技术可信度，但本次审阅的公开材料没有给出董事会名单或更完整的治理图谱。
