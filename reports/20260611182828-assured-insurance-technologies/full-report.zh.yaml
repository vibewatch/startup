      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论方向上建设性，但仅靠公开证据还无法承保。Assured
              看起来像一家成长阶段理赔软件供应商：有可信的模块化覆盖层产品，试点优先的销售动作可以降低初始部署摩擦，价值主张背后也有强烈的承保商痛点。这些都是有意义的正面因素。负面在于，几乎所有决定估值耐久性的指标仍缺失或由第三方估算：经审计收入、GAAP
              增长、毛利率、合同组合、CAC、回本期、NRR、客户集中度、现金余额、债务和契约结构。即便最好的公开收入数字，也来自第三方数据库估计，而不是管理层披露。于是同时存在两个事实。第一，公司大概率应按具有防御性工作流价值的软件来评估，而不是按劳动套利服务业务来评估。第二，如果合规、实施、供应商编排和客户支持成本扩张得不如管理层营销暗示那样有利，利润率路径仍可能令人失望。因此，务实尽调姿态是中等置信度：收入机制看起来真实，利润率上行有可能，2025
              年 3 月融资降低了短期困境风险；但任何投资者都不应只靠公开材料承保 burn、runway 或 $1B 估值。关键阻塞项是准确收入质量、扣除交付成本后的实际毛利率、承保商集中度、CAC/回本期和当前现金。
