        - 提供经审计的 2024 年和 2025 年收入、ARR，以及按模块和保险公司细分的增长
      - - 第三方 2025 年收入估计
        - 约 $22M 收入（GetLatka）
        - 低
        - 最好的公开收入信号，但不是管理层披露
        - 将数据库估计与管理层月度经常性收入和 GAAP 收入对账
      - - 估计人均收入
        - 按 $22M / 92 名员工计算约 $239k
        - 低
        - 可作为烧钱和规模效率的方向性生产率代理指标
        - 确认当前员工数、全成本薪酬，以及按职能拆分的人均收入
      - - 运营节省代理指标
        - Assured 引用部署中，周期时间缩短 4-6 天，每笔理赔节省约 $119
        - 中
        - 最接近买方 ROI 和回本逻辑的公开代理指标
        - 按部署队列和保险公司展示从基线到实际的 ROI
      - - 客户体验代理指标
        - Assured 引用部署中，客户满意度 4.8/5，每笔理赔减少 3-5 通电话
        - 中
        - 暗示接触成本更低、留存潜力更好
        - 提供现有客户的 NPS、理赔人满意度和来电减少情况
      - - 公开可比公司的毛利率代理区间
        - 使用 Guidewire 和 Verisk 披露的订阅规模基准，约 63%-70%
        - 中
        - 在服务和合规拖累前，限定可能的软件毛利率上限
        - 提供实际毛利率，以及云、支持、合作伙伴代收转付和实施之间的 COGS 拆分
      - - CAC 回本 / NRR / 客户集中度
        - null
