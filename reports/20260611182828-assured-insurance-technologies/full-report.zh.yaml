  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Assured 瞄准理赔智能软件，而不是全部理赔支出
        blocks:
          - type: paragraph
            body: >-
              Assured 自己的平台材料把市场边界划得比抽象的「保险 AI」甚至「理赔管理」窄得多。公司称 Claims Intelligence Platform
              从结构化报案开始，再延伸到消息、智能体工作流支持、欺诈检测和下游自动化，同时围绕既有承保商系统适配，而不是一次性替换每个核心应用。Guidewire 和 CCC
              的产品材料也用相似方式描述相邻的既有品类：理赔软件覆盖理赔生命周期中的报案、工作流、指派、知识和互联生态动作。这意味着，相关可纳入支出是与 FNOL、理赔人沟通、欺诈评分、CAT
              分诊、服务指派和理赔工作流编排绑定的软件与服务，客户是 P&C 承保商和相邻理赔运营方。


              同样重要的是市场排除什么。NAIC 和 Treasury 描述了一个保费、损失、灾害、准备金和理赔支付流量巨大的 P&C 行业，但这些美元不是软件
              TAM。赔偿金、维修人工和零件、再保险、大多数诉讼费用，以及非理赔保险工作流，都在 Assured
              可直接变现的楔子之外。因此，实际替代集合不是「所有保险公司支出」，而是传统理赔中心、单点解决方案、手工理赔员工作流，以及承保商可以逐步自动化的服务商协调流程。这个框架很重要，因为它支持一个可信的软件品类，同时避免把
              Assured 永远无法变成收入的保险公司资产负债表项目塞进可服务市场。
