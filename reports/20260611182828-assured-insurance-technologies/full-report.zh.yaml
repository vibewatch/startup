      - number: '8.4'
        title: 最终立场：继续研究，并明确上调或下调触发器
        blocks:
          - type: paragraph
            body: >-
              本章结论更接近继续研究而不是观察，因为上一轮私募融资很近、产品楔子真实；如果私有数据强于公开记录，公司仍可能证明其估值合理。但仅靠公开证据，仍留下太多承保问题。反向情景并不是 Assured
              没有产品或市场，而是投资者仍可能把战略质量误当成可投资价格。AI
              理赔自动化还带有治理和公平性风险，本次研究中源头层面的摩擦也说明公开尽调链条仍不完整。提升信心的唯一有纪律的方法，是把下一次会议强行落到经审计收入、利润率结构、留存、集中度和优先股经济条款上。如果这些数据很强，建议可以上调；如果不强，即便产品演示仍然亮眼，投资逻辑也应破裂。在这些材料交出之前，正确默认动作是保留选择权，把公司放在主动尽调名单上，并拒绝在估值讨论中制造虚假精确。
