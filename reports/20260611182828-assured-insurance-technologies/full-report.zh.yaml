        - 在汽车物损和伤害赔偿上的工作流深度和数据资产
        - 细分深度不等于广义多险种理赔运营层
      - - One Inc
        - 支付邻接
        - 私营邻接厂商；此处未审阅到公开客户数
        - 推进保费和理赔付款现代化的承运商
        - 理赔付款、供应商付款、保费付款、对账
        - 掌握痛点明显的支付切入点，减少纸质流程
