      - number: '1.2'
        title: 产品架构与运营覆盖
        blocks:
          - type: paragraph
            body: >-
              最一致的官方叙事是，Assured 不再只卖一个狭窄的 FNOL 小组件；它在拼一套模块化理赔栈，以结构化报案为锚，再向下游自动化延伸。平台页称，无接触、直通式理赔处理由四层支撑——生成式 AI、高级
              AI、增强数据和结构化数据；官网和 About 导航则列出一组更宽的套件，已经覆盖 FNOL、Voice AI、First Contact、Service
              Assignment、Messaging、Emma、Sidekick、Fraud、CAT 和 Plugins。多个产品页展示这些模块如何互相咬合。FNOL 和 Voice AI
              收集结构化报案数据；Sidekick 和 First Contact 把流程延伸到电话和跟进场景；Service Assignment 把工作推给维修厂、租车、拖车、承包商等服务商；Messaging 和
              Emma 自动化理赔人沟通；Fraud/CAT 产品则架在同一条工作流主干之上。业务线覆盖也比许多理赔创业供应商更宽：Assured 称已为个人车险、商业车险、房主险、商业财产险和工伤赔偿险提供 turnkey
              部署，并为其他险种提供白手套实施。这种广度很重要，因为它表明平台被定位为跨多个 P&C 工作流复用的理赔运营层，而不是单点解决方案。
