      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Assured 明确销售工作流软件，但没有公开披露投资者承保收入质量所需的合同数学。官网始终把它描述为面向承保商的 AI 驱动 SaaS
              平台，而不是承保商资产负债表产品；套件也明显是模块化的：FNOL、Messaging、Service Assignment、Fraud、CAT、Emma
              以及相邻的报案或跟进工具，可以独立部署，也可以组合部署。因此，公开可见的变现逻辑是模块驱动和工作流驱动，而不是与保费挂钩。最强的 GTM/定价线索不是价目表，而是公司自己的「先证明、后放大」语言：Assured
              营销试点、快速部署，以及在规模化承诺之前验证价值。这意味着企业合同很可能先落在一个工作流上，再随着承保商采用更多模块或更高理赔量而扩张。同时，几乎每个官方页面都把买方引向演示、下载或联系表单，而不是自助结账；审阅页面没有一个公布按理赔计价、按席位计价、最低年度合同额或折扣阶梯。正确结论是，Assured
              有类似软件的经常性收入机制和模块化追加销售路径，但实际定价、服务占比和收入确认细节仍是私有信息。
