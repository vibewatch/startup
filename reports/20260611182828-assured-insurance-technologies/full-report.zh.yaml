        - 一次性服务费、打包入驻或包含式支持
        - 官方材料暗示有一定实施支持；服务收入未披露
        - 低：可帮助采用，但若定价不足会稀释毛利率
        - 将软件收入与实施或托管服务收入分开
    notes: 各行概括官方材料和第三方公司资料中可见的变现通道；它们不代表管理层确认的收入瀑布或实际合同组合。
