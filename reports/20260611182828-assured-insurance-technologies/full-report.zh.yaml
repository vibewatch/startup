  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              Assured 的公开材料支持一个具体的产品读法：这是结构化数据优先的理赔工作流软件，不是单体核心理赔系统。最强的官方页面反复说，平台围绕承保商系统适配，从 FNOL
              捕获机器可读数据开始，再把自动化铺到跟进、沟通、指派、欺诈、CAT 和智能体辅助。这个区分很重要，因为如果不仔细锚定模块图，公司的品类看起来会比证据支持的范围更宽。Assured
              的确暴露了一套很宽的命名模块和插件产品，但这些模块大多围绕报案、增强、路由、沟通和下游编排运转。公开证据对每个模块要处理什么工作最强；对 Assured
              在客户环境中拥有端到端核心理赔生命周期的多少部分，则更弱。可支撑的结论是，Assured 销售一个模块化理赔运营层，设计目标是坐在既有承保商系统旁边，用结构化、可进入工作流的数据让这些系统更容易驱动。
