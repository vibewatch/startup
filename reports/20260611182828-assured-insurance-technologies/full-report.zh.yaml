        - 承运商、MGA、TPA、车队运营商
        - 完整理赔系统，含无代码工作流、集成支付和直接集成
        - 现代核心替代方案，实施快，且强调非颠覆式定位
        - 公开证据仍来自公司自身，且范围窄于既有跨国厂商的参考案例
      - - Mitchell / Enlyte
        - 车险 APD 和车险伤害赔偿专家
        - 私营既有专业厂商；Mitchell 有 95M+ 件碰撞理赔和 100+ 家 APD 承运商， Enlyte 有数百万张车险伤害赔偿账单
        - 车险公司和伤害赔偿团队
