              至少提供了一些评论市场存在感。但可访问的公开抓取没有显示可见评分、实名评论者或部署方引语，无法把这些入口转化为硬客户证明。结果是证据图像分裂：广泛生产叙事是公开的，但命名客户证明仍稀疏，投资者应把规模主张视为公司主张，直到客户核查或案例包补上缺口。
