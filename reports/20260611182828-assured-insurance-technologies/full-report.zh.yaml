      - number: '4.3'
        title: 成本结构、利润率路径与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Assured 的成本结构可能介于纯软件和工作流较重的理赔运营之间。官方页面指向真实的软件核心——结构化报案、消息、AI
              路由和可审计工作流——但也透露了影响毛利率的交付层：云和支持运营、多语言沟通、通知合规、服务供应商编排、电子签名、欺诈工作流，以及把试点推入规模化生产所需的客户成功工作。公开可比公司有助于框定利润率讨论。Guidewire
              2024 年年报显示，订阅与支持毛利率为 63%，服务毛利率为负，说明实施和云运营会稀释表面软件经济性。Verisk 2026 年 Q1 业绩暗示，在大得多的经常性分析规模上毛利率约
              70%；而保险公司自身仍高度关注成本：NAIC 2025 年行业分析显示损失和费用负担高企，AIG 和行业预测仍把现代化定义为利润率杠杆。资本充足性是公开记录变薄的地方。Bloomberg 和 GetLatka
              支撑 2025 年 3 月融资和独角兽估值锚点，但当前现金、债务、递延收入和 burn 均未披露。唯一站得住的 runway 观点只能按情景给出：如果 Series B 预计支持传统的 12–24 个月独立
              runway，则意味着每月 burn 大致在低七位数美元区间；但实际 burn 可能显著更低或更高，取决于既有现金、合同回款和服务强度。
