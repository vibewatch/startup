    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 哪些证据会改变判断
    rows:
      - - 乐观：真实的工作流切口
        - 官方材料显示，公司提供数据结构化优先的理赔软件，并有模块化扩张路径
        - 展示经审计的模块增长、附加率提升和续约质量
      - - 乐观：自动化证明并不简单
        - Emma 自主性和 STP 理赔意味着如果能跨账户复用，运营杠杆真实存在
        - 提供独立客户案例和部署队列
      - - 乐观：投资人质量强
        - Bloomberg 加 Costanoa 支撑一线投资人参与和近期独角兽轮次
        - 披露本轮经济条款和资金用途
      - - 反向：分母偏薄
        - 未公开经审计收入、毛利率、NRR 或现金数字
        - 提供经审计财务和 KPI 包
      - - 反向：市场数据冲突不可忽视
        - Tracxn、PitchBook、CB Insights 和 GetLatka 对阶段和融资总额说法不一致
        - 提供管理层认证的融资历史
      - - 反向：AI 风险会削弱估值耐久性
        - 理赔 AI 监督仍是真实的法律和声誉约束
        - 提供治理控制、升级日志和客户审计材料
    notes: 这张表把产品质量正面因素和价格支撑负面因素拆开；任何一边单独看都不足以支持投资决策。
