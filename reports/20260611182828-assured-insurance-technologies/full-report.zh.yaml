  - id: FP003
    title: 护城河 / 准备度 KPI
    type: kpi
    layout: standard
    summary: 用紧凑的公开代理指标呈现竞争准备度，以及 Assured 护城河面临的约束。
    approximationNotes: 各项结合了直接披露的规模代理指标和分析性总结。它们是方向性信号，不是经审计的市场份额或胜率数据。
