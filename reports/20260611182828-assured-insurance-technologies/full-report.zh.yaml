      - - 毛利率远低于成熟软件区间
        - 软件经济性逻辑
        - 会说明工作流或服务负担比营销口径重得多
        - 按悲观区间重新定价
      - - 留存低或客户集中度高
        - 持久性逻辑
        - 会显示收入质量弱于产品故事
