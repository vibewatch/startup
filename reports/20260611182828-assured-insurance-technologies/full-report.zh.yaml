      - number: '5.2'
        title: 工作流与运营模型
        blocks:
          - type: paragraph
            body: >-
              运营模型从报案开始，再分叉到专门的自动化界面。FNOL 用自适应提问、增强数据和面向承保商的 API 输出捕获并验证理赔事实；Sidekick 把同一套结构化逻辑用于电话报案；Voice AI
              增加一个全天候语音前端，可以直接报案或交给 Sidekick。报案之后，First Contact、Messaging 和 Emma 把工作流延伸到文件收集、澄清、理赔人更新和常规
              next-best-action 执行。Service Assignment 再把理赔推入供应商排期和维修相邻工作流；Fraud 和 CAT
              则作为风险与高峰管理层并行运行。这是公开证据里最清晰的架构主线：Assured 正把结构化报案、编排、沟通和路由缝成一条理赔工作流主干。公开证据没有提供的是深入实施蓝图。Assured 称系统
              API-first、低负担，某些情况下无需集成，但保留来源没有展示命名连接器、公开 schema 或客户参考架构，无法证明客户侧到底要承担多少工作。
