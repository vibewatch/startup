      - number: '3.4'
        title: 切换成本、多归属与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              本章最重要的承保结论是，Assured 的护城河看起来真实但不硬。耐久部分是公司的接入轻覆盖层叙事：结构化报案、欺诈、CAT
              和沟通，正是承保商常想改善、又不想重启完整核心迁移的工作流。这创造了先落地再扩张的路径，也解释了为什么模块化部署可能比套件推倒重来更有吸引力。脆弱部分是，几乎每个认真做事的既有厂商现在都在营销
              AI、自动化、编排或嵌入式智能。CCC 和 Mitchell 表明，网络与维修连接性可以和多归属共存。Guidewire 和 Duck Creek 表明，套件可以随时间吸收相邻能力。One
              Inc、FRISS、CLARA 和 Tractable 表明，买方可以把问题切成几片。公开定价大多不透明，所以 Assured
              不能靠网站比价取胜；真正的竞争会落在信任、可引用客户密度、部署速度，以及可衡量的理赔调整或漏损结果上。来自 AIG 和 J.D. Power
              的反向证据把这一点磨得更尖：理赔自动化仍必须满足治理、沟通、同理心和可审计性要求。Assured 可以赢，但前提是在一个狭窄楔子里显著更好，然后既有厂商和相邻玩家才来得及补上差距。
