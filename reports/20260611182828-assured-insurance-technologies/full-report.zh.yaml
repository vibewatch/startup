  - id: FI002
    title: 单位经济模型桥
    type: flow
    layout: wide
    summary: 公开资料里最好的单位经济模型叙事不是财务口径，而是运营口径：结构化数据减少接触次数和处理周期，进而创造客户 ROI、支撑扩张，但利润率桥仍未公开。
    data:
      nodes:
        - id: u1
          label: 结构化受理
          detail: FNOL 和数据采集把理赔输入变成机器可读数据
        - id: u2
          label: 更少人工接触
          detail: 已引用部署案例中，电话减少 3-5 通，理赔员协调负担降低
        - id: u3
          label: 周期节省
          detail: 处理周期缩短 4-6 天，索赔人更快拿到结果
        - id: u4
          label: 单案 ROI
          detail: 理赔管理博客称每案大约节省 $119
        - id: u5
          label: 扩张潜力
          detail: ROI 证据可以支撑更多模块、更多业务线和更高经常性支出
        - id: u6
          label: 利润率披露缺口
          detail: CAC 回本、NRR、毛利率和客户集中度仍不可得
      edges:
        - from: u1
          to: u2
        - from: u2
          to: u3
        - from: u3
          to: u4
        - from: u4
          to: u5
        - from: u5
          to: u6
