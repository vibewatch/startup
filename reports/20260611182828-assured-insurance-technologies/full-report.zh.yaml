      - number: '7.4'
        title: 财务不透明、集中度与执行风险
        blocks:
          - type: paragraph
            body: >-
              从公开证据最难承保的风险，不是 Assured 是否有产品市场匹配，而是这种匹配到底有多集中、多耐久、经济性多好。已保留公开材料没有披露 ARR、烧钱速度、总留存或净留存、客户 logo
              数、客户集中度或经审计财务报表。材料也没有披露独立模型质量遥测、事件历史，或负责合规、财务和安全的具名领导覆盖。这种有限披露在私营软件公司中常见，但在这里尤其重要，因为公司卖进受监管承保方工作流，实施投入、采购审查和续约耐久性都可能压过一个强演示。Guidewire
              的申报文件显示，一家理赔平台供应商即便达到公开市场规模，也可能高度依赖少数客户和续约。Assured 的集中度可能低于这份可比披露暗示的水平，也可能更高；但公开记录无法让投资者判断。


              市场数据源进一步支持执行层面的谨慎。BCG 称只有少数保险公司真正规模化 AI；Claims Journal 对 Sedgwick 的总结显示，工具碎片化且市场普遍要求人工监督；Roots 称受访保险公司中不到
              22% 已从测试转入完整生产。对 Assured
              而言，这意味着即便没有正式监管事件，收入故事也可能从多个方向断裂：试点可能停滞，承保方买家可能缩小范围，实施服务可能成为瓶颈，或者集成难度可能高于营销层的表述。公开证据也让管理梯队深度看不清。已审查的
              Assured 页面没有列出负责理赔治理风险的公开财务、合规或安全高管。这不能证明能力薄弱，但确实意味着投资者正在承保一个尚不可见的执行系统。实际判断中，披露不透明本身应被视为重大剩余风险，而不是
              housekeeping 注释。
