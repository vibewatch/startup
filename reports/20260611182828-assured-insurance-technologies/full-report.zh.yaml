      - number: '1.4'
        title: 里程碑与尽调关注点
        blocks:
          - type: paragraph
            body: >-
              可支撑的时间线从 2019 年成立开始，早期命题是修复理赔报案中手工、叙事过重的问题。到 2020 年末和 2021 年初，Forbes 和 Insurance Business 已经围绕结构化数字
              FNOL、动态问题流和 AI 辅助理赔自动化来描述该产品。这个早期楔子后来扩展成更宽的理赔智能平台，并在 2025 年融资中达到多个来源所称的独角兽估值区间。Digital Authority
              的案例研究补充了一个较软但仍有用的商业化数据点：Assured
              在投入事件驱动的需求生成和理赔行业可见度，而不是隐身运营。主要关注点不是公司没有故事；而是一些核心尽调问题上，公开叙事目前跑在公开证据前面。官方材料给出很大的定性主张——P&C 领域部署最广的
              AI、数千万件理赔、全球最大保险公司——但没有披露客户数、董事会构成或一个可核对的规模仪表盘。隐私和合规尽调也需要跟进。隐私政策明确提到分析、广告伙伴、cookie 和 pixel
              tags，抓取到的官方页面显示第三方营销工具埋点；行业评论也指出，面向数据敏感理赔运营的诉讼和合规环境正在收紧。这不能证明 Assured 有问题，但足以形成明确的尽调提问。
