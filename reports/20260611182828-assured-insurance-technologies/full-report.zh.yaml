          to: assured
          label: 增强
        - from: providers
          to: assured
          label: 支持分派
        - from: carrier
          to: assured
          label: 约束集成
        - from: governance
          to: assured
          label: 设定控制边界
        - from: assured
          to: carrier
          label: 写入结构化输出
        - from: assured
          to: humans
          label: 将异常升级给
