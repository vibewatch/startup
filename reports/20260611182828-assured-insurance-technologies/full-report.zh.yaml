          detail: 2025 年美国 P&C 直接承保保费达到 $1.1T；这是行业背景，不是软件 TAM。
        - id: claims-pressure
          label: 理赔成本与工作量压力
          detail: 综合成本率承压、约 $50B 强对流风暴损失，以及漫长的财产理赔周期，都会催生预算紧迫感。
        - id: software-sam
          label: 可触达理赔智能软件
          detail: FNOL、消息沟通、欺诈评分、CAT 分诊、工作流编排，以及相邻集成服务。
        - id: assured-fit
          label: 适合 Assured 的楔子
          detail: 围绕既有保险公司系统，叠加结构化受理、模块化沟通、欺诈和下游自动化。
    approximationNotes: 这个金字塔是概念性且不可相加的。它展示的是范围收窄，而非精确市场份额模型，因为公开来源没有披露 Assured 具体模块组合在美国的清晰 SAM。
