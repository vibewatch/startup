      - number: '7.2'
        title: 隐私、网络安全与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              Assured
              的公开隐私披露把数据风险面摆得很清楚。公司称可接收姓名、地址、电话号码、驾照、车牌、证人信息、精确事故地点、照片和其他理赔信息，也可能与保险公司、供应商、服务提供商、分析合作伙伴和广告合作伙伴共享数据。对理赔工作流供应商而言，即便先不考虑工伤、伤害或健康相邻信息，这已经是一组高度敏感的数据。安全页面方向上有帮助——SOC
              2 Type II、HIPAA 和负责任披露政策都是实际缓释项——但公开细节远远达不到机构投资者想看的运营证据。公开材料没有子处理方清单、没有公开事件表、没有公开模型评估包，也没有讨论例外率、误报或护栏表现。


              外部监管压力进一步叠加了剩余暴露。FTC Safeguards Rule 把受覆盖企业与服务提供商安全实践绑定在一起。NYDFS
              持续收紧受监管保险实体的网络安全预期，并发布事件响应和治理资源，因为它已调查数百起网络事件。California 的隐私制度加入了数据权利、通知、更正、退出和敏感信息约束；如果索赔人是 California
              居民，这些约束就可能重要。Deloitte 的行业研究又加上了 AI 特有的拧巴：幻觉、偏见、黑箱输出和多州法律模糊性，使理赔 AI 即便核心网络安全稳住也很难治理。落到实际，最高风险场景不是单一抽象的「AI
              问题」，而是一家公开透明度有限的敏感数据平台，生成或支持了某个索赔人沟通或工作流步骤，事后被证明错误、不公平或解释薄弱。因此，隐私、网络安全和模型治理风险应合并排序，而不是拆成独立筒仓。
