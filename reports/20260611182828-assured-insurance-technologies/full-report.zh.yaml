      - number: '5.4'
        title: 差异化、成熟度与开放风险
        blocks:
          - type: paragraph
            body: >-
              Assured 的主要差异化主张连贯且反复出现：先拿到结构化数据，再让 AI 和工作流自动化在理赔其他环节复利。这与 Guidewire 或 Duck Creek
              等既有厂商的公开姿态不同，后者销售更宽的端到端理赔套件；也不同于 CCC 或 Snapsheet 等生态玩家，后者强调统一理赔平台和更大的周边网络。Assured
              更窄的公开承诺可以是优势，因为它降低推倒重来的风险，并把公司框定为改善既有理赔系统的覆盖层。如果买方需要证明这个覆盖层确实能快速集成并在生产规模稳定运行，它也可能成为弱点。公开成熟度证据在命名模块、工作流广度和
              2026 年当前产品定位上最强；在客户特定部署证明、模型质量测量、正常运行时间和硬架构披露上更弱。因此，本章应把模块广度和结构化数据设计视为有充分支撑，把性能指标视为公司主张，并保留缺失的
              benchmark、SLA 和实施证据，作为关键尽调议程。
