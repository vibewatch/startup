  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sla-reliability
    missingEvidence: Public uptime, availability, status-page, or SLA commitments for core Assured workflows.
    whyItMatters: Carrier buyers need operational reliability evidence before trusting FNOL, communication, or service-assignment automation on live claims.
    diligencePath: Request customer-facing SLA terms, historical uptime data, incident summaries, and any external status page or service review pack.
    relatedQuestionRefs:
    - QE021
  - type: missing-source
    severity: material
    topic: model-evaluation
    missingEvidence: Benchmark methods, precision/recall or accuracy disclosures, red-team methodology, and failure-rate reporting for Emma and Voice AI.
    whyItMatters: Guardrail claims are not enough for regulated claims workflows without evidence of how models are evaluated and what error modes remain.
    diligencePath: Request model-risk documentation, benchmark scorecards, false-positive and false-negative rates, and human-escalation thresholds by workflow.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: implementation-proof
    missingEvidence: Named carrier implementations, connector inventory, median deployment time, and customer architecture references for “integration-free” or low-lift rollouts.
    whyItMatters: Public marketing supports a rapid-deployment narrative, but diligence still needs proof that the deployment burden is low in production environments.
    diligencePath: Request anonymized implementation plans, connector catalogs, median go-live times, and references from live carrier rollouts for each major module.
    relatedQuestionRefs:
    - QE014
    - QE024
  - type: private-evidence-only
    severity: material
    topic: security-scope
    missingEvidence: Control-scope detail behind SOC 2 Type II and HIPAA claims, including environments covered, subprocessors, retention, and audit exceptions.
    whyItMatters: Claims workflows touch sensitive customer and sometimes health information, so scope and operational controls matter more than logo-level compliance claims.
    diligencePath: Request trust-center materials, SOC 2 bridge letter, HIPAA program scope, subprocessor list, and data-retention/deletion procedures.
    relatedQuestionRefs:
    - QE019
    - QE027
  - type: missing-source
    severity: minor
    topic: infra-disclosure
    missingEvidence: Public architecture detail covering cloud stack, data stores, queues, observability tooling, and disaster-recovery design.
    whyItMatters: Engineering hiring implies ongoing platform investment, but buyers cannot underwrite resilience or cost profile from role listings alone.
    diligencePath: Ask for architecture diagrams, reliability reviews, observability standards, RTO/RPO targets, and a summary of production-change controls.
    relatedQuestionRefs:
    - QE023
    - QE024
