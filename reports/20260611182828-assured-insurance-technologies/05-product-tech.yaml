  - - Protect IQ
    - Property claimant
    - Loss-mitigation instructions during FNOL
    - Named on plugins and property page
    - Dynamic prevention guidance inside intake flow
    - No public completion-rate proof
  notes: Rows mix first-class modules and named plugin products because both are part of the current public product surface; maturity is inferred from current dedicated pages, not from customer deployment counts.
