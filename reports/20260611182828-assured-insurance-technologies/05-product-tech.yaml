callouts:
- calloutType: insight
  title: The supportable product reading is “overlay + workflow spine”
  body: Assured’s strongest public evidence is around structured intake, orchestration, and downstream coordination layered around incumbent systems. The company may do more inside customer environments, but the public record does not support calling it a monolithic replacement core.
  claimRefs:
  - CE001
  - CE008
  - CE034
  - CE049
  - CE056
- calloutType: risk
  title: Guardrail language is stronger than public model proof
  body: Voice AI and Emma both advertise safety, escalation, and sensitive-topic handling, but the retained sources do not publish benchmark methodology, error rates, or exception statistics. That gap matters because these tools operate inside regulated claims workflows.
  claimRefs:
  - CE013
  - CE028
  - CE029
  - CE051
  - CE053
- calloutType: recommendation
  title: Ask for implementation, SLA, and benchmark packs before underwiring the rapid-deployment story
  body: The public product case is compelling, but diligence still needs named connectors, deployment references, uptime commitments, control-scope detail, and model-evaluation evidence before treating Assured as a fully proven claims-automation layer at enterprise scale.
  claimRefs:
  - CE020
  - CE034
  - CE041
  - CE048
  - CE059
