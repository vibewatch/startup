- id: TE006
  title: Public technical gaps table
  columns:
  - Gap
  - Why it matters
  - Current public evidence
  - Risk if missing
  - Diligence ask
  rows:
  - - Named connector inventory
    - Determines real deployment burden
    - Generic API-first and fits-around-your-systems language only
    - Integration effort may be higher than marketing suggests
    - Request connector catalog and customer architecture examples
  - - Uptime / SLA / incident history
    - Critical for claimant-facing intake and messaging
    - No retained public SLA or status-page evidence
    - Operational-risk underwriting stays weak
    - Request SLA, uptime history, and incident reviews
  - - Model evaluation and benchmark data
    - Needed for trust in agentic and voice workflows
    - Guardrail language exists, metrics do not
    - Safety claims stay mostly qualitative
    - Request benchmark methodology, QA scorecards, and escalation stats
  - - Security-control scope
    - Needed to interpret SOC 2 and HIPAA claims
    - Logo-level claim pages only
    - Buyers cannot verify control boundaries
    - Request trust-center package and scope detail
  - - Independent implementation proof
    - Needed to validate rapid deployment claims
    - Database summary plus vendor marketing only
    - Time-to-value may be overstated
    - Request anonymized deployment plans and reference calls
  - - Public infrastructure detail
    - Relevant for resilience and cost profile
    - Hiring signals exist, architecture does not
    - No public basis for stack or DR assumptions
    - Request cloud architecture, RTO/RPO, and observability standards
