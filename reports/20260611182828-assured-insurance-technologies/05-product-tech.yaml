  - - Sidekick
    - CSR / call-center rep
    - Telephonic FNOL with guided prompts
    - Dedicated product page with embedded ecosystem callouts
    - Cross-channel handoff and keyboard-first UX
    - No named telephony/core partners
  - - Voice AI
    - Claimant + call center
    - Always-on voice intake and triage
    - Dedicated product page with API and transcript claims
    - 24/7 voice front end plus human handoff to Sidekick
    - No public benchmark or error-rate pack
  - - First Contact
    - Claimant + adjuster
    - Post-FNOL outreach, clarification, and document collection
    - Dedicated page with three-step handoff model
    - Digital follow-up to all involved parties
    - No public workflow-volume disclosure
  - - Messaging
    - Adjuster + claimant
    - Omnichannel communication and notices
    - Dedicated page with control-level features
    - State notices, translation, signatures, audit exports
    - No published deliverability or uptime metrics
  - - Emma
    - Adjuster + claimant
    - Agentic follow-up and next-best-action execution
    - Dedicated page with autonomy and safeguard claims
    - Real-time context plus human escalation
    - No public model-evaluation methodology
  - - Service Assignment
    - Adjuster + claimant + vendor
    - Vendor routing and self-scheduling
    - Dedicated page plus Lite variant
    - Integration-free Lite option for rapid start
    - No independent proof of average go-live time
  - - Fraud / Prophecy
    - Carrier fraud or SIU workflow
    - Pre-claim behavior monitoring and in-flow fraud prompts
    - Dedicated fraud page
    - Fraud signal insertion before and during FNOL
    - No public precision/recall disclosure
  - - CAT
    - Carrier CAT team + policyholder
    - Surge monitoring and proactive outreach
    - Dedicated CAT page
    - Nationwide catastrophe watch and autopilot framing
    - No public service-level metrics during CAT events
