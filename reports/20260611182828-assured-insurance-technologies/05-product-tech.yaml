- id: trust-controls-and-engineering-signals
  title: Trust controls and engineering signals
  body: 'Trust and control evidence is real but incomplete. Assured publicly claims SOC 2 Type II and HIPAA, runs a responsible disclosure policy, and exposes messaging controls such as audit-ready exports, PII detection and redaction, state-compliant notices, and opt-out management. Voice AI and Emma also explicitly preserve a human loop in sensitive situations: Voice AI says it deflects legal and liability questions to adjusters, while Emma says it escalates when empathy or human judgment is needed. Those are meaningful signals for a claims workflow product handling regulated and emotionally sensitive interactions. The privacy posture, however, is more mixed. Assured’s privacy policy discloses broad claim-data intake, device and usage data, analytics tooling, advertising partners, and data inflows from partners, which means diligence should separate marketing-site instrumentation from production claim-processing controls before giving the trust story full credit. Engineering signals are
    similarly directional rather than dispositive. The careers page shows active hiring across platform, cloud infrastructure, SRE, security, data science, and test functions, which supports ongoing product buildout, but hiring alone is not a substitute for public SLOs, benchmark packs, or architecture detail.'
