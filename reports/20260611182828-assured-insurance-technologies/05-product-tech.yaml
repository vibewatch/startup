- id: workflow-and-operating-model
  title: Workflow and operating model
  body: 'The operating model starts with intake and then branches into specialized automation surfaces. FNOL captures and validates claim facts with adaptive questioning, augmented data, and carrier-facing API output; Sidekick applies the same structured logic to telephonic intake; Voice AI adds an always-on voice front end that can file directly or hand off to Sidekick. After intake, First Contact, Messaging, and Emma extend the workflow into document gathering, clarification, claimant updates, and routine next-best-action execution. Service Assignment then pushes the claim into vendor scheduling and repair-adjacent workflows, while Fraud and CAT run in parallel as risk and surge-management layers. This is the clearest architectural through-line in the public evidence: Assured is stitching structured intake, orchestration, communication, and routing into one claims workflow spine. What the public evidence does not provide is a deep implementation blueprint. Assured says the system is API-first,
    low-lift, and in some cases integration-free, but the retained sources do not show named connectors, published schemas, or customer reference architectures that would prove exactly how much work sits on the customer side.'
