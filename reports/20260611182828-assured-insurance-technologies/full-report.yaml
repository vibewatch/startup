      - number: '2.3'
        title: 'Buyer, User, and Payer: Claims Leaders Buy the Outcome, but IT and Core Architecture Still Matter'
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a multi-stakeholder buying motion. Daily users are claims handlers, adjusters, SIU
              teams, and catastrophe operations staff who need cleaner intake, faster triage, fewer handoffs, and better
              claimant communications. Economic buyers usually sit higher: chief claims officers, claims-operations
              leaders, or cross-functional transformation sponsors who own service levels, leakage, and loss-adjustment
              expense. Payers often sit with claims operations budgets in the short term but with CIO or
              core-modernization budgets once integrations, cloud migration, or broader workflow redesign become
              necessary. Markel's Guidewire migration illustrates the pattern: carriers justify claims-platform
              investments not as isolated experiments, but as operational modernization tied to customer experience,
              analytics, and IT simplification.


              This structure creates a staged adoption path that is favorable to modular vendors like Assured but still
              hard to scale. A narrow module can land through a specific workflow pain point—digital intake, messaging,
              fraud, or CAT surge handling—yet expansion depends on data normalization, governance approval, and
              integration with incumbent claims cores and provider networks. J.D. Power also warns against a simplistic
              “digital equals better” thesis. Straight-through processing and proactive updates can raise satisfaction
              materially, but some customers still prefer human contact and poor communication can destroy satisfaction
              even when a digital front end exists. That means ROI must be framed around cycle time, claimant
              communication quality, fraud leakage, and adjuster productivity together, not automation alone.
