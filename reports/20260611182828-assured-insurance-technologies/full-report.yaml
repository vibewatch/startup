  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Public architecture is best understood as layered intake, enrichment, orchestration, system-interface, and
      human-governance surfaces rather than as a monolithic claims core.
    data:
      layers:
        - label: Claimant and rep channels
          modules:
            - Self-service FNOL web app
            - Sidekick telephonic intake
            - Voice AI front end
            - Messaging across SMS, email, and in-app channels
        - label: Structured intake and enrichment
          modules:
            - Dynamic question flows
            - Machine-readable claim data
            - 50+ external data sources
            - Transcripts, documents, and signatures
        - label: Workflow automation layer
          modules:
            - First Contact
            - Emma next-best-action automation
            - Fraud / Prophecy signal insertion
            - CAT and Service Assignment workflows
        - label: Carrier and ecosystem interface
          modules:
            - Low-lift API writes into carrier systems
            - Core claims and policy systems
            - Service-provider and scheduling integrations
            - Optional adjacent payment or vendor tools
        - label: Human governance and trust
          modules:
            - Adjuster handoff and exception handling
            - Compliant notices and audit exports
            - Privacy/security controls
            - Disclosure and escalation paths
    approximationNotes: >-
      This stack intentionally abstracts only publicly supportable layers; hidden infrastructure, model-serving, and
      vendor details are omitted because public evidence is insufficient.
