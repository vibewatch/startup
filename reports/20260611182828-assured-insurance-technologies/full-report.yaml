companyProfile:
  summary: >-
    Assured Insurance Technologies is a 2019-founded, privately held claims-automation software company focused on U.S.
    property-and-casualty insurers. Its Claims Intelligence Platform is positioned as a modular overlay around incumbent
    carrier systems rather than a core replacement, starting with structured FNOL intake and extending into messaging,
    service assignment, fraud, catastrophe handling, and agentic workflow support. Public evidence supports real product
    breadth, selected integration-free deployment paths, and a March 2025 unicorn financing, but the company remains
    thinly disclosed on revenue quality, customer proof, governance depth, and capital structure.
