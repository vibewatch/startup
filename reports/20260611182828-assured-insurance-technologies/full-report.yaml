        - Scale credibility
        - Would make the round multiple much harder to defend
        - Step away or demand materially lower entry price
      - - Gross margin far below mature software bands
        - Software-economics thesis
        - Would suggest workflow or services burden is much heavier than marketed
        - Re-rate toward the bear range
      - - Low retention or high customer concentration
        - Durability thesis
        - Would show revenue quality is weaker than product story implies
        - Pause until cohort data and references improve
      - - Preference stack or downside protections are aggressive
        - Return thesis
        - Would reduce common-equity upside even if company quality is real
        - Rework return model or decline
      - - AI-governance packet is weak
        - Trust thesis
        - Would raise legal, reputational, and customer-adoption risk
        - Treat as material diligence failure
      - - Management cannot reconcile conflicting public funding history
        - Disclosure credibility
        - Would increase concern that basic round facts are still murky
        - Lower confidence and widen discount rate
