  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Assured clearly sells workflow software, but it does not publicly disclose the contract math investors
              would need to underwrite revenue quality. The official site consistently describes an AI-driven SaaS
              platform for carriers, not a carrier balance-sheet product, and the suite is visibly modular: FNOL,
              Messaging, Service Assignment, Fraud, CAT, Emma, and adjacent intake or follow-up tools can be deployed
              independently or together. The monetization logic that is visible in public is therefore module-led and
              workflow-led, not premium-linked. The strongest GTM/pricing clue is not a rate card but the company's own
              'prove-first, scale-later' language: Assured markets pilots, fast deployment, and value validation before
              scaled commitments. That suggests enterprise contracts likely land on one workflow, then expand as
              carriers adopt more modules or higher claims volume. At the same time, nearly every official page routes
              buyers into demos, downloads, or contact forms rather than self-serve checkout, and none of the reviewed
              pages publish per-claim pricing, seat pricing, minimum annual contract values, or discount ladders. The
              right conclusion is that Assured has a software-like recurring revenue mechanism with modular upsell
              paths, but realized pricing, services mix, and revenue-recognition details remain private.
