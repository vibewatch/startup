  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Assured is not competing in one neat startup lane. Buyers can solve the same claims-intelligence job
              through at least five routes: full incumbent claims suites, auto-network and data incumbents, modern
              standalone claims platforms, narrow point solutions, and the status quo of stitching together internal
              tools with manual work. The direct overlap is strongest with Snapsheet on modern claims-core positioning
              and with Guidewire or Duck Creek when carriers evaluate whether to expand or refresh an incumbent stack
              instead of adding another vendor. CCC, Verisk, and Mitchell matter because they already sit in
              high-frequency auto workflows and own data or network positions that can block distribution even if they
              are not the best multiline core analog. One Inc, FRISS, CLARA, Enlyte, and Tractable are narrower, but
              buyers can still combine them to address payments, fraud, casualty, or appraisal without buying Assured.
              Assured's wedge is clearest where a carrier wants structured-data intake, claimant communications, CAT,
              and fraud overlays without a full re-platform. That is attractive, but it also means the company is
              selling into a market where “do nothing,” “buy one slice,” and “expand an incumbent” are all real
              alternatives.
