  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation is price-sensitive, and the public denominator is still too thin
        blocks:
          - type: paragraph
            body: >-
              The strongest publicly corroborated fact in this chapter is the March 2025 valuation anchor, not the
              operating denominator underneath it. Bloomberg, PitchBook, CB Insights, GetLatka, and Tracxn all converge
              on a roughly $1 billion mark, and Bloomberg additionally names Iconiq and Kleiner Perkins in the round.
              That is enough to say the market cleared a unicorn price. It is not enough to say that price still offers
              attractive risk-adjusted entry. The best public revenue number is a third-party GetLatka estimate of $22
              million for 2025, while market-data providers disagree on round stage, total funding, and even current
              headcount. Official Assured materials clearly support a real product wedge in claims-intelligence
              software, but they do not disclose pricing, retention, gross margin, or cash. That combination leads to a
              price-sensitive conclusion: the company looks strategically interesting, yet the current public record is
              not strong enough to underwrite the price with conviction.
