      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The chapter's most important underwriting conclusion is that Assured's moat looks real but not hard. The
              durable part is the company's integration-light overlay story: structured intake, fraud, CAT, and
              communications are exactly the workflows carriers often want to improve without reopening a full core
              migration. That creates a land-and-expand path and explains why modular deployment can be more attractive
              than a suite rip-and-replace. The fragile part is that nearly every serious incumbent now markets AI,
              automation, orchestration, or embedded intelligence. CCC and Mitchell show that network and repair
              connectivity can coexist with multi-homing. Guidewire and Duck Creek show that suites can absorb adjacent
              capabilities over time. One Inc, FRISS, CLARA, and Tractable show that buyers can carve the problem into
              slices. Public pricing is mostly opaque, so Assured cannot win a website bake-off; the real contest will
              be trust, reference density, deployment speed, and measurable loss-adjustment or leakage outcomes. Adverse
              evidence from AIG and J.D. Power sharpens that point: claims automation still has to satisfy governance,
              communication, empathy, and auditability requirements. Assured can win, but only if it is demonstrably
              better in a narrow wedge before incumbents and adjacencies close the gap.
