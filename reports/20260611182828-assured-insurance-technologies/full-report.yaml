        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Assured’s public materials support a specific product reading: this is structured-data-first claims
              workflow software, not a monolithic core claims system. The strongest official pages repeatedly say the
              platform fits around carrier systems, starts by capturing machine-readable data at FNOL, and then layers
              automation across follow-up, communication, assignment, fraud, CAT, and agentic assistance. That matters
              because the company’s category can look broader than the evidence supports if the module map is not
              anchored carefully. Assured clearly exposes a wide suite of named modules and plugin products, but those
              modules mostly orbit intake, enrichment, routing, communication, and downstream orchestration. Public
              evidence is strongest on what jobs each module is meant to handle, weaker on how much of the end-to-end
              core claim lifecycle Assured owns inside a customer environment. The supportable conclusion is that
              Assured sells a modular claims operating layer designed to sit beside incumbent carrier systems and make
