      - number: '3.3'
        title: Adjacent vendors and slice substitutes
        blocks:
          - type: paragraph
            body: >-
              Assured also competes against vendors that do not look like classical claims cores but can still capture
              budget. CCC dominates the auto claims and repair conversation through ecosystem reach, event-driven
              workflows, and carrier connectivity; that is powerful distribution even if the company is more
              auto-centric than Assured. Verisk and Mitchell bring durable data moats in claims data sharing,
              estimation, and appraisal workflows, while Enlyte and CLARA go deeper on casualty, bill review, and
              claims-intelligence use cases. Tractable narrows the job further to image-based damage assessment, and
              FRISS narrows it to claims trust and fraud verification. One Inc owns a payments wedge that can remove one
              of the most painful parts of claims without replacing the broader workflow. These vendors are often
              complementary, but that does not make them irrelevant substitutes. A buyer that already has CCC plus One
              Inc plus Mitchell may feel no urgency to add Assured. Likewise, a carrier using CLARA or FRISS for
              high-value decision support may decide to keep intake and communication inside the incumbent core. The
              practical lesson is that budget competition happens at the workflow level, not just at the “claims
              platform” label level.
