      - number: '2.2'
        title: 'Sizing Lenses: The Best Public Numbers Are Workload, Friction, and Leakage Proxies'
        blocks:
          - type: paragraph
            body: >-
              Public sources do not provide a clean U.S. dollar SAM for point-solution claims-intelligence vendors
              serving FNOL, messaging, fraud, and CAT workflows. Instead, the evidence supports several non-additive
              sizing lenses. NAIC's 2025 industry report shows U.S. P&C direct premiums written at $1.1 trillion and net
              premiums written at $976.8 billion, with an industry combined ratio of 92.9%. Those figures are not
              software revenue pools, but they show the operating base underneath carrier claims budgets. The same
              report estimates roughly $50 billion of insured losses from severe convective storms for the third
              consecutive year, while Triple-I/Milliman shows 2024 line economics still under strain, including
              homeowners at a projected 104.8 net combined ratio and general liability at 103.7.


              A second lens is leakage and avoidable cost. NAIC and the Coalition Against Insurance Fraud continue to
              cite roughly $45 billion of annual P&C fraud losses, while NICB's 2024 report highlights intensified
              catastrophe-fraud response activity. A third lens is cycle-time and service pressure. J.D. Power shows
              long repair and payment cycles, non-preferred communication channels, and meaningful satisfaction
              penalties when simple claims do not move quickly. Together these lenses explain why claims automation
              budgets exist, but they still do not translate directly into Assured revenue. The correct conclusion is
              that the demand environment is large and persistent, while the monetizable SAM remains
              evidence-constrained and must be underwritten through carrier budgets, claim volumes, module pricing, and
              win-rate data that are not public in this chapter.
