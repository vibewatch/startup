              diligence also deserves follow-up. The privacy policy openly contemplates analytics, advertising partners,
              cookies, and pixel tags, and fetched official pages show third-party marketing instrumentation, while
              industry commentary highlights a tightening litigation and compliance environment for data-sensitive
              claims operations. That does not prove a problem at Assured, but it is enough to warrant explicit
              diligence asks.
