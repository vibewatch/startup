      - number: '6.3'
        title: Durability, procurement friction, and retention visibility
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public record gets materially weaker. Assured’s own materials make clear that
              procurement is often pilot-led: the 2026 “Test before you invest” whitepaper advocates real-world pilots,
              a one-claim-at-a-time approach, and minimal-lift ROI validation before broader rollout. Service Assignment
              Lite reinforces that message by promising go-live in days and no carrier setup or integrations. That can
              help adoption, but it also means investors need conversion proof from pilot to production, not just pilot
              rhetoric. Publicly retained sources do not disclose customer count, deployment count, NRR, GRR, churn,
              renewal, contract length, or satisfaction metrics. Even peer-review surfaces are too thin in public
              captures to fill that gap. The broader insurer market context supports caution: BCG says only 7% of
              insurers have scaled AI successfully and about two-thirds remain in pilot mode, while Everest says claims
              is the single largest live-production AI use case but emphasizes that enterprise readiness still depends
              on execution capability and ecosystem fit. The implication is not that Assured lacks durability; it is
              that public evidence does not yet prove it. Investors should therefore treat durability as an information
              request, not an extrapolation from homepage language.
