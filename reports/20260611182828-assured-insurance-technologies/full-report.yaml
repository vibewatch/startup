        - id: u1
          label: Structured intake
          detail: FNOL and data capture create machine-readable claims inputs
        - id: u2
          label: Fewer manual touches
          detail: 3-5 fewer phone calls and lower adjuster coordination burden on cited deployments
        - id: u3
          label: Cycle-time savings
          detail: 4-6 day reduction and faster claimant resolution
        - id: u4
          label: Per-claim ROI
          detail: Claims-management blog cites roughly $119 savings per claim
        - id: u5
          label: Expansion potential
          detail: ROI proof can support more modules, more lines, and higher recurring spend
        - id: u6
          label: Missing margin disclosure
          detail: CAC payback, NRR, gross margin, and customer concentration are still unavailable
