      - number: '2.4'
        title: 'Drivers and Constraints: Real Budget Urgency, but Trust, Regulation, and Incumbent Lock-In Slow Capture'
        blocks:
          - type: paragraph
            body: >-
              The driver set for Assured is credible. FIO says AI is already modernizing claims processing and fraud
              detection, and its cited survey work shows most private-passenger-auto and homeowners insurers are at
              least using, planning to use, or exploring AI and machine learning. Accenture's carrier research and the
              Crawford market commentary both point in the same direction: claims modernization has moved from optional
              transformation rhetoric toward cost, service, and resilience programs with measurable executive attention.
              Catastrophe pressure, fraud losses, claimant dissatisfaction with long cycle times, and the burden of
              fragmented legacy systems all support continued spend on claims-intelligence tooling.


              But the constraint set is just as important. FIO notes that AI-supported insurer decisions remain subject
              to existing insurance laws and NAIC governance expectations. AIG's own annual report is even more explicit
              that generative AI in underwriting and claims can create security, legal, regulatory, bias, and
              reputational risk. Guidewire describes rigid core systems and fragmented data as structural blockers, and
              J.D. Power shows that even when carriers digitize, many claimants still channel-hop or prefer human
              support. For Assured, the implication is mixed. The company is well aligned to a market that wants modular
              overlays around hard-to-replace core claims environments. But scaling from promising module to durable
              platform vendor will depend on referenceable carrier deployments, measurable ROI, auditability, and the
              ability to coexist with incumbent ecosystems that already control a large share of carrier workflow and
              budget authority.
