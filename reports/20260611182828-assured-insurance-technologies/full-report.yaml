  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Assured Targets Claims-Intelligence Software, Not Total Claims Spend'
        blocks:
          - type: paragraph
            body: >-
              Assured's own platform materials make the market boundary much narrower than “insurance AI” or even
              “claims management” in the abstract. The company says its Claims Intelligence Platform starts with
              structured intake, then extends into messaging, agentic workflow support, fraud detection, and downstream
              automation, all while fitting around incumbent carrier systems rather than replacing every core
              application at once. Guidewire and CCC product materials describe the adjacent incumbent category
              similarly: claims software covers intake, workflow, assignment, knowledge, and connected ecosystem actions
              across the claim lifecycle. That means the relevant included spend is software and services tied to FNOL,
              claimant communications, fraud scoring, CAT triage, service assignment, and claims workflow orchestration
              for P&C carriers and adjacent claims operators.


              Just as important is what the market excludes. NAIC and Treasury describe a P&C sector with enormous
              premium, loss, catastrophe, reserve, and claims-payment flows, but those dollars are not software TAM.
              Indemnity payments, repair labor and parts, reinsurance, most litigation expense, and non-claims insurance
              workflows sit outside Assured's direct monetizable wedge. The practical substitute set is therefore not
              “all insurer spend.” It is legacy claim centers, point solutions, manual adjuster workflows, and
              service-provider coordination processes that carriers may automate incrementally. That framing matters
              because it supports a plausible software category while preventing the analysis from inflating Assured's
              addressable market with insurer balance-sheet items it can never capture as revenue.
            claimRefs:
              - CM001
