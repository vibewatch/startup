      - number: '1.2'
        title: Product architecture and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The most consistent official story is that Assured is not selling one narrow FNOL widget anymore; it is
              assembling a modular claims stack anchored on structured intake and then extending into downstream
              automation. The platform page says touchless, straight-through claims processing is enabled by four
              layers—generative AI, advanced AI, augmented data, and structured data—while the homepage and About
              navigation enumerate a broad suite that now spans FNOL, Voice AI, First Contact, Service Assignment,
              Messaging, Emma, Sidekick, Fraud, CAT, and Plugins. Several product pages show how those modules
              interlock. FNOL and Voice AI gather structured intake data; Sidekick and First Contact extend that flow
              into telephonic and follow-up contexts; Service Assignment pushes work to body shops, rentals, tows,
              contractors, and other providers; Messaging and Emma automate claimant communication; and Fraud/CAT
              products sit on top of the same workflow spine. Lines-of-business coverage is also broader than many
              startup claims vendors: Assured says it has turnkey deployments for personal auto, commercial auto,
              homeowners, commercial property, and workers’ compensation, with white-glove implementation for other
              lines. That breadth matters because it suggests the platform is being positioned as a reusable claims
              operating layer across multiple P&C workflows rather than a single-point solution.
