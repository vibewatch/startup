      - number: '7.2'
        title: Privacy, cybersecurity, and AI governance risk
        blocks:
          - type: paragraph
            body: >-
              Assured’s public privacy disclosures make the data-risk surface plain. The company says it can receive
              names, addresses, phone numbers, driver’s licenses, license plates, witness details, precise incident
              locations, photos, and other claim information, and that it may share data with insurers, vendors, service
              providers, analytics partners, and advertising partners. For a claims-workflow vendor, that is a
              high-sensitivity mix even before workers’ compensation, injury, or health-adjacent information enters the
              record. The security page is directionally helpful — SOC 2 Type II, HIPAA, and a responsible disclosure
              policy are real mitigants — but public detail stops well short of the operational evidence an
              institutional investor would want. There is no public subprocessor inventory, no public incident table, no
              public model-evaluation pack, and no public discussion of exception rates, false positives, or guardrail
              performance.


              External regulatory pressure compounds that residual exposure. The FTC Safeguards Rule ties covered firms
              to service-provider security practices. NYDFS continues to tighten cybersecurity expectations for
              regulated insurance entities and publishes incident-response and governance resources because it has
              investigated hundreds of cyber incidents. California’s privacy regime adds data-rights, notice,
              correction, opt-out, and sensitive-information constraints that can matter if claimants are California
              residents. Deloitte’s sector work adds the AI-specific twist: hallucinations, bias, black-box outputs, and
              multi-state legal ambiguity make claims AI hard to govern even when core cybersecurity is sound. In
              practical terms, the highest-risk scenario is not a single abstract “AI issue”; it is a combined failure
              in which a sensitive-data platform with partial public transparency makes or supports a claimant
              communication or workflow step that later proves wrong, unfair, or weakly explainable. That is why
              privacy, cyber, and model-governance risk should be ranked together, not in separate silos.
