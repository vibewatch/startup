      - number: '4.3'
        title: Cost structure, margin path, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Assured's cost structure likely sits between pure software and workflow-heavy claims operations. Official
              pages point to a real software core—structured intake, messaging, AI routing, and audit-ready
              workflows—but they also reveal delivery layers that matter for gross margin: cloud and support operations,
              multilingual communication, notice compliance, service-vendor orchestration, digital signatures, fraud
              workflows, and customer-success work needed to drive pilots into scaled production. Public comparables
              help bound the margin debate. Guidewire's 2024 annual report shows subscription-and-support gross margin
              of 63% and negative services margin, illustrating how implementation and cloud operations can dilute
              headline software economics. Verisk's Q1 2026 results imply roughly 70% gross margin at a much larger
              recurring-analytics scale, while insurers themselves remain intensely cost-sensitive: NAIC's 2025 industry
              analysis shows elevated loss and expense burdens, and AIG and industry projections still frame
              modernization as a margin lever. Capital adequacy is where the public record thins out. Bloomberg and
              GetLatka support the March 2025 round and unicorn valuation anchor, but current cash, debt, deferred
              revenue, and burn are not disclosed. The only defensible runway view is scenario-based: if the Series B
              were expected to fund a conventional 12-24 month standalone runway, it implies a low-seven-figure monthly
              burn envelope, but actual burn could be materially lower or higher depending on pre-existing cash,
              contract collections, and services intensity.
