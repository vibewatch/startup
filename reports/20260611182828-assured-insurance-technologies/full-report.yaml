            body: >-
              The supportable chronology begins with a 2019 founding and an early thesis around fixing the manual,
              narrative-heavy nature of claims intake. By late 2020 and early 2021, Forbes and Insurance Business were
              already describing the product around structured digital FNOL, dynamic question flows, and AI-assisted
