              adjusters, while Emma says it escalates when empathy or human judgment is needed. Those are meaningful
              signals for a claims workflow product handling regulated and emotionally sensitive interactions. The
              privacy posture, however, is more mixed. Assured’s privacy policy discloses broad claim-data intake,
