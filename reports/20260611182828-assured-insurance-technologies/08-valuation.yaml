- id: diligence-triggers-and-final-stance
  title: 'Final stance: research more, with explicit triggers for moving up or down'
  body: The chapter ends closer to research-more than track because the last private round is recent, the product wedge is real, and the company could still justify its mark if private numbers are stronger than the public record. But public evidence alone leaves too many underwriting questions open. The adverse case is not that Assured lacks a product or market; it is that investors can still mistake strategic quality for investable price. AI claims automation also carries governance and fairness risk, and source-level frictions in this run illustrate how incomplete the public diligence trail remains. The only disciplined way to improve conviction is to force the next meeting onto audited revenue, margin structure, retention, concentration, and preference economics. If those data come in strong, the recommendation can move up. If they do not, the thesis should break even if the product demo remains impressive. Until those materials are produced, the right default is to preserve optionality,
    keep the company on the active diligence list, and refuse false precision in valuation conversations.
