- id: scenario-ranges-and-entry-discipline
  title: Bull, base, and bear ranges should stay wide until revenue quality is proven
  body: Scenario analysis is more honest here than pretending the public record can deliver a single fair value. On the current third-party revenue proxy, a $1 billion mark implies about 45.5x trailing revenue. Even if actual revenue is closer to $30 million or $35 million, the implied multiple still sits around 33x to 29x. That can be defended only if Assured is early in a steep growth curve, if the $22 million proxy understates current scale, and if the company converts automation proof into durable multi-module expansion with software-like margins. The base case therefore discounts the last round rather than simply reaffirming it. The bear case recognizes that services intensity, weak retention, or overstated revenue would compress value sharply. The bull case gives management credit for strong product evidence and investor quality but still requires operating proof that the public record does not yet provide.
