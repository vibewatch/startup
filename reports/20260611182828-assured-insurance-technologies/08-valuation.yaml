  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-stage-conflict
    missingEvidence: Management-confirmed financing history with signed round date, security type, amount raised, and post-money valuation.
    whyItMatters: Round stage and amount disagreement changes how much weight investors should put on the $1 billion anchor and whether dilution was minimal or meaningful.
    diligencePath: Request the executed Series B closing memo, board deck, and cap-table history showing every primary round since founding.
    relatedQuestionRefs:
    - QV003
    - QV005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-proxy
    missingEvidence: Audited 2024 and 2025 revenue, ARR, growth, and bookings by product or workflow.
    whyItMatters: The valuation call depends on whether the public $22 million revenue proxy is directionally right and recurring rather than services-heavy or stale.
    diligencePath: Obtain audited financial statements plus a monthly revenue bridge and recurring-versus-services mix.
    relatedQuestionRefs:
    - QV004
    - QV020
  - type: private-evidence-only
    severity: material
    topic: headcount-proxy
    missingEvidence: A current employee count by function plus hiring plan tied to product, support, and go-to-market budgets.
    whyItMatters: Headcount is being used as a crude efficiency and complexity proxy, but public snapshots disagree materially and may mix entity-level and company-level counts.
    diligencePath: Request the current org chart, headcount by department, and monthly headcount history since the March 2025 financing.
    relatedQuestionRefs:
    - QV006
  - type: private-evidence-only
    severity: blocking
    topic: missing-denominator
    missingEvidence: Gross margin, NRR, logo retention, customer concentration, cash, burn, debt, and liquidation preference terms.
    whyItMatters: These are the variables that determine whether a $1 billion entry point is merely ambitious or actually unsupported by economics and downside protection.
    diligencePath: Request full KPI pack, cohort retention tables, top-customer concentration, quarterly cash flow, debt schedule, and the latest cap table with preference stack.
    relatedQuestionRefs:
    - QV020
    - QV030
    relatedTableRefs:
    - TV004
