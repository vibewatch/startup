- id: TV008
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Revenue quality
    - Audited 2024-2025 revenue, ARR, bookings, and services mix
    - Sets the real denominator for valuation
    - Obtain audited statements and monthly revenue bridge
  - - Margins
    - Gross margin by product, cloud, support, and services
    - Tests whether Assured behaves like software or workflow-heavy operations
    - Request product-level COGS and margin waterfall
  - - Retention
    - GRR, NRR, cohort expansion, and renewal timing
    - Determines whether the product wedge is durable
    - Review cohort tables and top-customer renewals
  - - Customer concentration
    - Top-10 accounts, ACV mix, and line-of-business exposure
    - A few carriers can distort quality if revenue is concentrated
    - Request concentration schedule and named references
  - - Capital structure
    - Cap table, liquidation preferences, board terms, and pro-rata rights
    - Changes return math even if enterprise value is unchanged
    - Review latest cap table and signed financing docs
  - - AI governance
    - Escalation thresholds, audit logs, model controls, and complaint history
    - Needed to assess downside from regulated claims automation
    - Review governance packet and insurer compliance artifacts
  notes: These asks are ordered by what would most directly move the recommendation from research-more toward either track or avoid.
