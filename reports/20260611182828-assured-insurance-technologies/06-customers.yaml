  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: Named carrier references, customer-quoted case studies, or reference-call-ready deployments that identify line of business, module scope, and production date.
    whyItMatters: The public adoption story is otherwise driven by broad company claims and proof surfaces without logos, so diligence cannot separate marquee customers from generic pipeline.
    diligencePath: Request three reference customers spanning auto, property, and workers’ compensation, plus redacted deployment timelines and outcome scorecards.
    relatedQuestionRefs:
    - QU011
    - QU014
    - QU015
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: NRR, GRR, renewal rates, churn, contract length, and customer satisfaction data by cohort or module.
    whyItMatters: Without durability metrics, it is impossible to tell whether Assured’s product breadth translates into sticky recurring revenue or just compelling pilots.
    diligencePath: Request cohort retention tables, customer-health dashboards, and renewal by module/line-of-business over the last 24 months.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, top-10 concentration, contract value concentration, and channel-sourced revenue mix.
    whyItMatters: Customer concentration and partner dependence can dominate downside risk for a private workflow vendor selling into a concentrated insurer market.
    diligencePath: Request ARR concentration tables, sourced-bookings mix by channel, and concentration trends across the last three fiscal years.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: pilot-motion
    missingEvidence: Pilot-to-production conversion rates, named production dates, and evidence that one-claim or narrow-module pilots expanded into enterprise programs.
    whyItMatters: Assured’s own procurement story emphasizes pilots, which means conversion proof is essential to underwriting real customer durability.
    diligencePath: Request pilot funnel conversion data, time-to-production by module, and at least one anonymized before/after deployment case pack.
    relatedQuestionRefs:
    - QU012
    - QU015
    - QU023
  - type: access-blocked
    severity: minor
    topic: customer-proof-surface
    missingEvidence: Publicly visible review counts, review text, and rating distributions for Assured across peer-review platforms.
    whyItMatters: Accessible review depth could strengthen or weaken the marketing narrative around customer experience, but current public captures are blocked or generic.
    diligencePath: Request vendor-provided review exports or ask investor relations to supply live screenshots with review counts and representative comments.
    relatedQuestionRefs:
    - QU013
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: adverse-proof
    missingEvidence: Specific public complaints, failed pilots, or churn events tied to Assured rather than to insurer AI adoption generally.
    whyItMatters: The absence of specific adverse evidence is directionally better than finding litigation, but it also limits stress-testing of the customer story.
    diligencePath: Run diligence on customer references, win-loss notes, legal letter requests, and procurement postmortems rather than relying on public web coverage alone.
    relatedQuestionRefs:
    - QU024
    - QU025
