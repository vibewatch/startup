chapter:
  number: 6
  title: Customers
  summary: Assured’s public customer story is strongest on segmentation and workflow breadth for U.S. P&C carriers, not on named logos. Official pages claim scale across tens of millions of claims, major lines of business, and quantified module-level outcomes such as Emma’s nearly 70% autonomous interactions, but public proof of named carrier deployments, renewals, and concentration remains sparse enough that evidence gaps are a central finding rather than a footnote.
sections:
- id: segment-coverage-and-buyer-map
  title: Segment coverage and buyer map
  body: 'The supportable customer story starts with segmentation, not logos. Assured’s public pages consistently target claims organizations inside U.S. P&C carriers, with carrier claims leadership as the likely buyer and payer, adjusters and call-center teams as the daily users, and policyholders or claimants as the external workflow participants. The strongest evidence is not a customer list but a coverage map: current pages explicitly claim turnkey deployment for personal auto, commercial auto, homeowners, commercial property, and workers’ compensation, with white-glove implementation for other lines. Public workflow examples also tie specific modules to specific roles. Sidekick is built for CSRs and telephonic FNOL, Voice AI handles claimant-facing intake, First Contact gathers claimant and witness information digitally, and Service Assignment coordinates vendors such as body shops, rental providers, tow operators, and contractors. That gives Assured a credible segmentation-by-use-case
    story even though it does not give a named-account roster. For diligence purposes, the practical reading is that Assured is selling a cross-line claims operating layer to carrier claims organizations, not a narrow single-function point tool. What remains missing is public evidence of how many carriers actually use each segment-specific motion in production.'
