    - Specialty / workers’ comp claims leadership
    - Injury adjusters, claimants, employers, witnesses
    - Lines-of-business page describes injury detail capture, ICD-code generation, and three-point contacts
    - Supports expansion into a different data-rich claims segment
    - No public workers’ comp case study
