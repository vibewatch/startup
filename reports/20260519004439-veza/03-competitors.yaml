  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: List-price ranges, discounting behavior, ACVs, and commercial terms across Veza and the main competitors in live deals.
    whyItMatters: Without pricing evidence, packaging and ROI claims cannot be translated into hard commercial advantage or margin pressure.
    diligencePath: Collect redacted quotes, pricing decks, and procurement summaries from recent live deals.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Win-loss records showing how often Veza replaces, augments, or loses to SailPoint, Saviynt, Microsoft, CyberArk, or Opal.
    whyItMatters: Competitive moat can only be validated by actual conversion patterns, not by homepage narratives or vendor comparison pages.
    diligencePath: Review CRM opportunity data, loss codes, customer interviews, and proof-of-concept outcomes by competitor.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: private-vendor-scale
    missingEvidence: Reliable public scale disclosures for private competitors such as Saviynt, Omada, Opal, and Lumos that are directly comparable with Veza.
    whyItMatters: The lack of consistent scale disclosure makes it hard to distinguish category leaders from narrative-heavy challengers in the private peer set.
    diligencePath: Use investor materials, secondary databases, or management interviews to normalize private-peer size and growth.
    relatedQuestionRefs:
    - QP004
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: minor
    topic: deployment-proof
    missingEvidence: Independent deployment-time and services-burden evidence across Veza and incumbent suites.
