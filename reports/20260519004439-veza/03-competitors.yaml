chapter:
  number: 3
  title: Competitors
  summary: Veza competes in a crowded identity-security landscape where most serious alternatives already claim some combination of IGA, machine identity, AI, least privilege, and automation. The most important direct pressure comes from SailPoint, Saviynt, Microsoft Entra, CyberArk, Omada, One Identity, and newer workflow-native players such as Opal; the status quo also includes internal build and legacy approval processes. Veza’s clearest differentiation remains authorization-centric visibility across cloud, SaaS, data, and custom applications via the Access Graph and Open Authorization API, but that advantage is vulnerable if incumbents close their integration gaps or if buyers prefer bundled platforms with larger ecosystems. Competitive durability therefore depends less on owning a unique category label than on proving faster deployment, better custom-system coverage, and a cleaner path from visibility to governance automation.
sections:
- id: landscape-and-alternatives
  title: 'Landscape: Direct Peers, Incumbents, Adjacent Platforms, and Status Quo'
  body: 'The relevant competitive set for Veza extends beyond one-for-one “identity governance” vendors. Legacy and scaled incumbents such as SailPoint, Saviynt, Omada, One Identity, Microsoft Entra, and CyberArk all address parts of the same buyer problem, even when they enter from different directions. SailPoint and Saviynt represent the most direct governance-platform peers; Omada and One Identity represent established enterprise IGA alternatives; Microsoft Entra adds bundling and installed-base power; CyberArk attacks the machine, privileged, and broader identity-security layers; and Opal represents a more modern just-in-time and workflow-centric alternative. The status quo is still powerful: many enterprises continue to rely on spreadsheets, static roles, cloud-native point tools, or internal approval workflows rather than replacing them with a single platform. Veza’s own comparison pages explicitly target SailPoint, Saviynt, and Lumos, which is useful directional evidence about where
    it sees pressure, but those pages are self-interested and cannot be treated as independent proof. The practical conclusion is that Veza must win against both heavyweight suites and fragmented do-it-yourself baselines.'
