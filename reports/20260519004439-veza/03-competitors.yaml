- id: moat-durability-and-displacement-risk
  title: Moat Durability, Commoditization Risk, and What Could Break the Thesis
  body: Veza’s moat claims are real but conditional. The strongest evidence-backed moat is extensibility into custom or unsupported systems through the Open Authorization API and associated community tooling, combined with a platform story that spans data, SaaS, cloud, and non-human identities. That is a better answer to modern entitlement sprawl than a purely workflow-centric governance story. But there are three obvious thesis breakers. First, incumbents are converging fast around the same “human, machine, and AI identity” platform language. Second, bundled vendors can trade off margin for distribution, especially where identity governance is already part of a broader suite. Third, if customers mainly want approval workflows or JIT access, lighter-weight tools such as Opal or incumbent access-request modules may be good enough. Veza’s competitive durability therefore depends on whether enterprise buyers truly need a cross-system authorization graph and whether that graph materially shortens
    deployment time, increases coverage, or improves remediation outcomes compared with incumbent alternatives. Without those live win-loss proofs, the moat is promising but not unassailable.
  claimRefs:
  - CP037
  - CP038
  - CP039
  - CP040
