callouts:
- calloutType: strength
  title: Veza’s strongest public differentiation is not “IGA” but cross-system authorization truth
  body: Veza looks most differentiated when the buyer cares about custom systems, entitlement visibility, non-human identities, and a graph of who can do what across many environments. That is a more distinct wedge than generic governance automation alone.
  claimRefs:
  - CP018
  - CP020
  - CP030
  - CP037
- calloutType: risk
  title: Bundled and incumbent platforms can neutralize the wedge in many accounts
  body: Microsoft, SailPoint, CyberArk, and other scaled vendors now sell broad identity-security stories that overlap with Veza’s narrative. Buyers may choose incumbents or coexistence if Veza cannot prove material deployment or coverage advantages.
  claimRefs:
  - CP011
  - CP015
  - CP017
  - CP025
  - CP032
  - CP038
