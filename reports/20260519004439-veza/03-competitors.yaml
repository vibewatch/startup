- id: switching-costs-lock-in-and-multi-homing
  title: Switching Cost, Lock-in, Multi-homing, and Channel Power
  body: 'Identity-security buying is rarely clean replacement. In many accounts, Veza is more likely to coexist with identity stores, PAM tools, cloud-native controls, or incumbent IGA than to rip them out immediately. That creates both opportunity and risk. Opportunity comes from augmenting what buyers already own, especially where legacy suites cannot see custom apps or modern entitlement sprawl. Risk comes from channel power and bundling: Microsoft can leverage existing suite contracts, SailPoint and CyberArk can rely on deep SI ecosystems, and buyers may multi-home rather than standardize. Veza’s own “supercharge SailPoint” language implicitly admits this coexistence strategy, framing itself as the “last mile” for visibility and unguided systems rather than as an always-full replacement. That can reduce near-term switching friction, but it can also cap wallet share if customers continue to anchor governance around a larger incumbent. The durability question is therefore whether Veza
    becomes the system of record for permissions truth, or remains an augmentation layer that a bigger platform can eventually absorb or imitate.'
