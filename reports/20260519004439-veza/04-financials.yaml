- id: gtm-motion-and-sales-efficiency-proxies
  title: GTM Motion and Sales-Efficiency Proxies
  body: 'Public GTM evidence points to a field-led enterprise motion that is increasingly partner-assisted, not a low-touch product-led funnel. The 2023 strategic round and the 2025 Series D both explicitly said new capital would go to GTM expansion as well as product development. The December 2024 COO hire consolidated sales, marketing, customer success, and alliances under one operator, and the 2025 partner program plus GuidePoint relationship added joint GTM activity, incentives, and reseller reach. Customer proofs imply large, complex deployments: Blackstone cited 700-plus reviewers and 60-plus onboarded applications; Deluxe said deployment connected AWS, GitHub, and Azure AD in weeks; Choice Hotels embedded Veza into audit and remediation workflows; and Veza''s customer page claims meaningful time and cost savings. Those are healthy efficiency proxies, especially when paired with company claims that ARR more than doubled and NRR approached 150%. But the public record still omits CAC,
    payback, sales-cycle length, ACV distribution, quota productivity, and partner-sourced pipeline share, so the GTM story is persuasive without being fully measurable.'
  claimRefs:
