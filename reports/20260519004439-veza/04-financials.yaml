company:
  name: Veza
chapter:
  number: 4
  title: Financials
  summary: Veza's public record supports an enterprise SaaS model priced through order forms around active identities, integrations, and product modules, with annual upfront billing and likely attach from implementation and support. Public traction signals are strong—ARR more than doubled year over year, enterprise NRR approached 150%, and ServiceNow cited nearly 150 customers and 230 employees at signing—but absolute ARR, revenue, gross margin, cash, burn, and acquisition economics remain undisclosed. The chapter verdict is therefore positive on revenue quality signals and strategic capital access, but negative on standalone underwriting transparency.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Architecture
  body: 'Veza''s public contract and product materials show a recurring enterprise-software model rather than a consumer seat model or usage fee based on transactions. The SaaS agreement defines Active Identities and says Veza prices products and integrations on a per Active Identity per month basis under order forms. The same agreement says fees are calculated from identities, integrations, and products, billed annually in advance, and subject to expansion if usage rises above the contracted level. Product pages show that monetization can expand across modules—Access Reviews, Lifecycle Management, NHI Security, and, by late 2025, Access AuthZ—while the contract separately references professional services and support. What public sources do not show is equally important: pricing is confidential, public list rates are absent, and no source here discloses realized discounts, ACV, or the software-versus-services revenue split. The right read is therefore an enterprise subscription engine with
    module and services attach potential, but with realized pricing and revenue mix still hidden behind negotiated order forms.'
  claimRefs:
