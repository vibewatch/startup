- id: cost-structure-margin-drivers-and-service-delivery
  title: Cost Structure, Margin Drivers, and Service Delivery
  body: 'Veza looks like a software business with low physical capex and no visible inventory burden, but the service-delivery layer is still material. The contract commits Veza to hosted service, weekday technical support, uptime credits, and professional-services remedies. Product and launch materials show constant connector work, provisioning across SCIM and custom systems, audit logging, and lifecycle automation that reaches cloud, SaaS, on-prem, and homegrown applications. Customer case studies reinforce that implementation spans multiple systems and stakeholders, which can pressure support and deployment effort even when the product is marketed as lighter-weight than legacy IGA. Adverse review evidence is directionally consistent: reviewers praise visibility, auditability, and ROI, but still call the product expensive and complex to stand up. Public identity-security comps show the likely economic shape: SailPoint''s S-1 paired high subscription gross margins with heavy sales and marketing
    spend and negative reported operating margins, while CyberArk''s 2025 results showed strong recurring mix plus meaningful maintenance and professional services revenue. Veza may enjoy a healthy software-margin ceiling, but its actual gross margin and services share remain undisclosed.'
