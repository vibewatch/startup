  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: absolute-arr
    missingEvidence: Booked ARR, GAAP revenue, and deferred revenue by quarter through the ServiceNow signing date.
    whyItMatters: Without absolute top-line data, valuation, sales efficiency, and revenue-quality conclusions remain narrative rather than underwritten.
    diligencePath: Request board or investor reporting packs with quarterly ARR, revenue, billings, and deferred-revenue bridges.
    relatedQuestionRefs:
    - QI014
    - QI018
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-profile
    missingEvidence: Audited gross margin, cost of revenue split, hosting expense, and professional-services revenue / gross margin.
    whyItMatters: Margin quality is the core missing input for judging whether Veza was a scalable software model or a services-heavy one.
    diligencePath: Request audited financial statements or management P&L with COGS broken into hosting, support, and professional services.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Cash on hand, monthly burn, and runway after the April 2025 Series D.
    whyItMatters: Capital adequacy and financing dependency cannot be tested without a cash bridge.
    diligencePath: Request monthly cash, burn, and hiring plan from the Series D close through acquisition close.
    relatedQuestionRefs:
    - QI019
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback period, ACV distribution, win rates, and partner-sourced pipeline mix.
    whyItMatters: Narrative GTM strength cannot substitute for capital-efficiency metrics when underwriting a late-stage software company.
    diligencePath: Request sales-ops dashboards by segment, including cycle length, ACV, quota attainment, and partner contribution.
    relatedQuestionRefs:
    - QI011
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, logo churn, gross retention, and renewal cohorts.
    whyItMatters: High NRR can mask concentration or churn risk unless the renewal base is visible.
    diligencePath: Request top-customer ARR, top-10 ARR share, gross retention, and renewal cohort analyses.
    relatedQuestionRefs:
    - QI017
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: acquisition-economics
    missingEvidence: Purchase price, consideration mix, escrow, retention packages, and any deal-related debt or tax effects.
    whyItMatters: The final investor outcome and whether the sale validated or merely rescued the standalone thesis remain unresolved without transaction economics.
    diligencePath: Request signed merger summary, cap-table waterfall, and board materials covering consideration and closing adjustments.
    relatedQuestionRefs:
    - QI021
    - QI022
    - QI025
    relatedTableRefs:
    - TI004
