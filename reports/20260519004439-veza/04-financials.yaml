- id: public-traction-private-gaps-and-capital-adequacy
  title: Public Traction, Private Gaps, and Capital Adequacy
  body: 'Public traction is real, but the actual model remains only partly illuminated. Veza''s 2025 Series D release said ARR more than doubled year over year, NRR was nearing 150%, headcount exceeded 190, permissions under management exceeded 20 billion, and integrations exceeded 250. ServiceNow later said Veza had nearly 150 enterprise customers and 230 employees at signing. Those are strong late-stage software signals. Capital access also looked credible: Veza had raised $125 million by the 2023 strategic round, TechCrunch reported three years of runway at that point, and the 2025 Series D added another $108 million for worldwide GTM and product work, bringing lifetime equity to $235 million. Yet the underwriting essentials never became public—absolute ARR, revenue, gross margin, cash on hand, monthly burn, deferred revenue, debt, and customer concentration. The acquisition therefore creates a mixed read on adequacy: Veza did not look capital-starved, but the sale to ServiceNow arrived
    before the public record could prove standalone durability or financing dependence with confidence.'
  claimRefs:
  - CI013
  - CI024
  - CI035
  - CI036
  - CI037
  - CI038
  - CI039
