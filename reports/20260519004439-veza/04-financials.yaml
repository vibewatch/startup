- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - What public evidence does exist
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Absolute ARR / revenue
    - Growth multiples and valuation are public, but absolute revenue is not
    - Cannot calculate revenue multiple or scale-adjusted efficiency
    - Request booked ARR, GAAP revenue, and quarterly bridge through sale signing
  - - Gross margin / COGS split
    - Only peer proxies and support obligations are public
    - Cannot judge software margin quality or services drag
    - Request audited COGS split across hosting, support, and professional services
  - - Cash on hand and runway after Series D
    - TechCrunch reported three years of runway in 2023; nothing later
    - Cannot test standalone solvency or round dependency
    - Request monthly cash balance, burn, and runway bridge from Apr-2025 onward
  - - CAC / payback / sales cycle
    - Narrative GTM evidence is strong, but no numeric efficiency metrics are public
    - Cannot assess capital efficiency of growth motion
    - Request segment CAC, payback, pipeline conversion, and sales-cycle distribution
  - - ACV / pricing realization
    - Agreement shows pricing mechanics, but no public dollars
    - Cannot model customer economics or discounting risk
    - Request median ACV, price realization, and overage incidence
  - - Professional-services mix
    - Contract and case studies imply delivery work, but no revenue mix exists
    - Cannot separate high-margin software from lower-margin services
    - Request PS bookings, revenue, attach rate, and gross margin
  - - Customer concentration
    - Named logos are public, concentration statistics are not
    - Revenue durability could be overstated if a few logos dominate
    - Request top-10 ARR share and top-customer contribution
  - - Logo / gross churn
    - NRR is public, churn components are not
    - Cannot tell whether expansion is masking churn risk
    - Request gross retention, logo churn, and renewal cohorts
  - - Deferred revenue / billings
    - Annual prepay billing suggests billings quality, but no balance-sheet data is public
    - Cannot verify working-capital strength
    - Request deferred revenue, billings, and cash-collection trends
  - - Acquisition consideration / terms
    - Announcement and close are public; economics are not
    - Final investor outcome and capital adequacy signal remain incomplete
    - Request purchase price, cash/stock mix, escrow, and retention-package summary
  notes: Every row names a missing metric that materially affects underwriting. The table is intentionally gap-heavy because private-company disclosure is the dominant financial limitation here.
