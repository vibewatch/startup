      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Market Timing
        blocks:
          - type: paragraph
            body: >-
              The demand side of Veza’s market is supported by several durable forces. CISA and NIST zero-trust guidance
              both push enterprises toward least-privilege and more granular, context-aware access decisions. Veza’s own
              statistics and adjacent market research argue that complexity is exploding: enterprises use hundreds of
              SaaS and cloud services, machine identities outnumber humans many times over, and identity-based attacks
              are increasingly central to breaches. Public competitor pages also confirm that the whole sector is
              converging toward platforms for humans, machines, and AI, which validates the problem but also sharpens
              competition. That convergence is the main constraint. Buyers can already hear similar stories from
              SailPoint, CyberArk, Microsoft Entra, Saviynt, Omada, One Identity, and newer just-in-time specialists
              such as Opal. Help Net Security’s reporting on Veza’s Access AuthZ launch cites Gartner’s claim that 50%
              of IGA deployments are in distress, which is both a driver and a warning: customers want modernization,
              but implementations can still become expensive, slow, and politically difficult. The market is therefore
              attractive, but adoption timing depends on proving faster ROI and lower implementation friction than both
              legacy and bundled alternatives.
            claimRefs:
              - CM020
