chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Veza presents itself as an identity security platform built around authorization and permissions
              visibility rather than legacy directory-centric identity tooling. Its company and product pages frame the
              core question as who can take what action on what data or resource, with the Access Graph unifying
              identities, permissions, and resources across cloud, SaaS, data, and custom applications. The founding
              story on Veza's company and culture pages places the origin in 2020, when Tarun Thakur, Maohua Lu, and Rob
              Whitcher identified authorization as the missing layer in securing cloud data. Official acquirer materials
              later described Veza as headquartered in Los Gatos, California, while Veza's own press releases use Palo
              Alto and Redwood Shores datelines, so the sourced record supports a Bay Area headquarters with some
              location ambiguity. As a standalone company, Veza monetized enterprise identity security software for
              visibility, governance, access reviews, lifecycle control, and non-human identity security; by March 2026,
              however, Veza was no longer an independent private company because ServiceNow disclosed that the
              acquisition had closed.
