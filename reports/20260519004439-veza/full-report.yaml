      - number: '8.3'
        title: Public-market reference points and comparable set
        blocks:
          - type: paragraph
            body: >-
              The public comp set is useful directionally, not mechanically. SailPoint, CyberArk, and Okta are all
              credible identity-security reference points because each publicly markets security for combinations of
              human, machine, and AI identities. Rubrik is less direct, but it is still useful as a broader
              security-platform reference because it now frames identity resilience inside a larger cyber-resilience
              stack. Those public names show how wide the market is willing to price security and identity assets in May
              2026: roughly 5.2x revenue for Okta, about 9.2x ARR for Rubrik, about 10.2x ARR for SailPoint, and about
              17.6x ARR for CyberArk.


              That wide spread is exactly why Veza cannot be marked precisely from public comps alone. Veza spans ISPM,
              next-gen IGA, NHI security, and AI-agent control rather than one narrow category, so no single comp is
              perfect. More importantly, Veza never disclosed the absolute ARR or revenue denominator needed to map the
              $808 million round onto any of those public bands. The comp table therefore helps bracket what
              identity-security assets can trade like in public markets, but it does not justify claiming that Veza was
              definitely cheap, fair, or expensive on an exact multiple basis.
            claimRefs:
              - CV018
