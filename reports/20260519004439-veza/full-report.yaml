            body: >-
              The public architecture story centers on three linked components: broad agentless read-only ingestion, a
              graph-based permissions model, and OAA for unsupported systems. Veza repeatedly says native integrations
              reveal effective permissions without risking service interruption, while the Access Graph traverses users,
              groups, roles, policies, apps, systems, and data into a normalized permissions view. The integration
              catalog, the 2023 100-integrations milestone, and specific pages for GitHub, Workday, and OpenAI all
              reinforce that the platform is designed to pull identity and authorization context from many different
              source systems rather than from one directory alone. The strongest technical differentiator remains OAA:
              marketing pages, developer docs, GitHub repositories, and a PyPI package all show a self-service path for
              custom, homegrown, or otherwise unsupported applications. That is stronger evidence of platform
              extensibility than a generic “API-first” claim. At the same time, Veza does not publicly disclose deeper
              internals such as its underlying graph database choice, query engine design, scan cadence, or performance
              characteristics at the largest entitlement graphs, so the high-level architecture is public but the hard
              systems engineering details are not.
