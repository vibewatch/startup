      - number: '3.2'
        title: 'Competitor Profiles: Scale, Target Customer, Scope, and Direction'
        blocks:
          - type: paragraph
            body: >-
              Among the peer set, SailPoint and CyberArk stand out for scale and public-market evidence. SailPoint’s
              2025 S-1 disclosed $813 million of ARR and 2,895 customers while positioning the company as a security
              platform for human, machine, and AI identities. CyberArk’s 2024 20-F reported more than $1.0 billion of
              revenue and $1.169 billion of ARR while emphasizing unified security for human, machine, and AI identities
              and dedicated machine-identity products. Those disclosures matter because they show how broad and
              well-capitalized the incumbent response has become. By contrast, Saviynt, Omada, One Identity, and Opal
              position themselves aggressively but disclose less public scale on the fetched pages. Microsoft Entra is
              different again: it is not a startup-like competitor but a bundled platform inside a much larger suite,
              which can make its economic pressure disproportionate to any one feature comparison. Veza’s comparison
              pages argue that older suites remain slower to integrate cloud, SaaS, custom, and non-human identities;
              that claim is plausible, but diligence should verify it in live customer migrations rather than on
              vendor-authored landing pages.
