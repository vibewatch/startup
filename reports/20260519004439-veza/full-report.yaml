            body: >-
              Publicly available leadership evidence is strongest around Veza's founders and a handful of senior
              executives added as the company scaled. Tarun Thakur is consistently identified as co-founder and CEO,
              with prior leadership at Datos IO and earlier product and research work at Data Domain and IBM Research.
              Maohua Lu is identified as co-founder and CTO, while Rob Whitcher is listed as co-founder and chief
              architect. Veza's later leadership additions signal a shift from founder-led product buildout toward
              scaled go-to-market and trust functions: Mike Towers became chief security and trust officer in 2024, Kane
              Lightowler became president and COO in December 2024, and Veza announced EMEA expansion under Ismet Geri
