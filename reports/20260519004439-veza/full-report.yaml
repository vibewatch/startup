  productSummary: >-
    Veza's Access Platform is built around the Access Graph and broad agentless, read-only connectors that map users,
    groups, roles, policies, applications, systems, and data into effective permissions. The platform spans ISPM-style
    visibility and intelligence, access reviews, lifecycle management, access requests, Access AuthZ, NHI security,
    Access AI, and AI-agent security, with OAA as the clearest technical differentiator for custom or otherwise
    unsupported systems.
  customerFocus: >-
    Large, heterogeneous enterprises with complex entitlement sprawl across cloud, SaaS, data, and custom applications.
    Public proof is strongest in regulated or operationally complex buyers across banking, hospitality, FMCG, financial
    services, healthcare, pharma, life sciences, retail, and large technology environments; typical executive sponsors
    are CISOs, IAM leaders, CIO/SVP IT, and platform-security leaders.
