  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Veza is best analyzed as an authorization-centric identity security platform spanning multiple adjacent
              markets rather than as a pure-play legacy IGA vendor. Its own language combines identity security posture
              management, access visibility, access intelligence, lifecycle control, non-human identity governance, and
              custom-app authorization through the Open Authorization API. That means the broadest relevant market
              boundary includes spend on IGA, identity-security posture management, non-human identity governance,
              PAM-adjacent access assurance, and portions of data-access governance where permissions visibility is the
              primary control problem. It excludes pure directory services, basic SSO, endpoint identity, and horizontal
              ITSM workflows except where those systems become embedded in the access-governance process. The status quo
              Veza tries to replace is not one single competing tool. It is a layered bundle of manual access reviews,
              static role models, legacy IGA suites, cloud-native point controls, homegrown approval workflows, and
              fragmented visibility spread across IAM, security, data, and platform teams. That fragmented baseline
              matters because Veza’s sales motion depends less on creating a new compliance obligation than on
              consolidating access truth across many existing systems.
            claimRefs:
