      - number: '1.4'
        title: Scale Metrics, Customer Proof, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Although Veza never publicly disclosed absolute ARR or revenue, the company published enough operating
              signals to anchor a credible growth narrative. By the Series D announcement it claimed ARR had more than
              doubled year over year, enterprise net revenue retention was nearing 150%, headcount exceeded 190,
              permissions under management exceeded 20 billion, and native integrations exceeded 250. The customer
              roster cited in financing and customer materials includes Blackstone, Workday, Sallie Mae, Snowflake, Wynn
              Resorts, Deluxe, Choice Hotels, Expedia, and Zoom. Several references are unusually concrete for a private
              security company: Blackstone described 700-plus reviewers and 60-plus onboarded applications; Snowflake
              credited Veza's Access Graph with making RBAC visibility actionable; Choice Hotels tied the platform to
              audit readiness and fine-grained AWS governance; Deluxe highlighted cross-system visibility spanning AWS,
              GitHub, Azure, Slack, and Jira. Milestones show a steady broadening of scope: stealth launch in 2022, 100
              integrations and Phil Venables' board appointment in 2023, Access AI and additional strategic capital in
              2024, then Series D, EMEA expansion, non-human identity product expansion, and finally ServiceNow's
              acquisition announcement and close across 2025 and early 2026.
