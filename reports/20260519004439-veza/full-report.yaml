        - Last hard anchor stays $808M, but premium disappears
        - $0.65B-$0.80B
        - 25%
        - The 2025 round already captured peak optimism, while heavy implementation and quote-led pricing cap appetite.
        - Weak private ARR disclosure, low premium in deal documents, or clear services burden.
      - - Base
