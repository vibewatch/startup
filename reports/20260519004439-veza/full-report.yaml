            body: >-
              Public traction is real, but the actual model remains only partly illuminated. Veza's 2025 Series D
              release said ARR more than doubled year over year, NRR was nearing 150%, headcount exceeded 190,
              permissions under management exceeded 20 billion, and integrations exceeded 250. ServiceNow later said
              Veza had nearly 150 enterprise customers and 230 employees at signing. Those are strong late-stage
              software signals. Capital access also looked credible: Veza had raised $125 million by the 2023 strategic
