  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Incumbents, Adjacent Platforms, and Status Quo'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set for Veza extends beyond one-for-one “identity governance” vendors. Legacy and
              scaled incumbents such as SailPoint, Saviynt, Omada, One Identity, Microsoft Entra, and CyberArk all
              address parts of the same buyer problem, even when they enter from different directions. SailPoint and
              Saviynt represent the most direct governance-platform peers; Omada and One Identity represent established
              enterprise IGA alternatives; Microsoft Entra adds bundling and installed-base power; CyberArk attacks the
              machine, privileged, and broader identity-security layers; and Opal represents a more modern just-in-time
              and workflow-centric alternative. The status quo is still powerful: many enterprises continue to rely on
              spreadsheets, static roles, cloud-native point tools, or internal approval workflows rather than replacing
              them with a single platform. Veza’s own comparison pages explicitly target SailPoint, Saviynt, and Lumos,
