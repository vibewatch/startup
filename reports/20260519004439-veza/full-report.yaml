companyProfile:
  summary: >-
    Veza was founded in 2020 by Tarun Thakur, Maohua Lu, and Rob Whitcher to build an authorization-centric identity
    security platform for hybrid and multi-cloud environments. The public funding chronology supports more than $110M
    raised at stealth in 2022, a 2023 strategic financing that TechCrunch reported at a $415M valuation, and a $108M
    Series D led by NEA on 2025-04-28 at an $808M valuation, bringing total disclosed equity funding to $235M. By
    signing, ServiceNow said Veza served nearly 150 global enterprise customers and had 230 employees, then updated its
    newsroom release to state the acquisition closed on 2026-03-02. Public purchase price remains undisclosed, so Veza
    should be framed as an acquired strategic asset, not a current standalone unicorn.
