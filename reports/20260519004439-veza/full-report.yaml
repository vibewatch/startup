            body: >-
              From 2024 through early 2026, Veza expanded quickly beyond classic access visibility. Access AI introduced
              natural-language querying, risk prioritization, role recommendations, and remediation/ticketing
              assistance. NHI Security extended the platform into service accounts, keys, secrets, workloads, and
              ownership hygiene. Access AuthZ then pushed the platform from governance into last-mile provisioning and
              deprovisioning across cloud, SaaS, on-prem, and custom apps through SCIM, native connectors, and OAA
              Write. By late 2025 and early 2026, AI Agent Security and Access Agents extended the same model into
              agentic AI, MCP servers, tool permissions, blast-radius mapping, and conversational/automated identity
              operations. This release cadence supports a genuine “platform broadening” story rather than a static point
              product. Still, the evidence quality is mixed. The chronology is real and directly sourced, but
              independent proof for newer AI and automation claims is thin. There are no public accuracy metrics,
              false-positive rates, or customer-scale benchmarks showing that Access AI, AI Agent Security, or Access
              Agents outperform peers in production. Public maturity therefore looks strong on direction and feature
              breadth, but only moderate on third-party validation.
