        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Veza is easier to like strategically than to price precisely. The public evidence says the company raised
              a $108 million Series D at an $808 million valuation in April 2025, more than doubled ARR year over year,
              and later attracted ServiceNow as an acquirer. That is meaningful proof of relevance. But it is not enough
              to support a clean standalone underwriting call at any exact multiple because Veza never publicly
              disclosed absolute ARR, revenue, gross margin, burn, or cap-table economics. ServiceNow's own announcement
              also omits purchase price and consideration mix, so even the eventual exit does not solve the pricing
              problem.


              The recommendation is therefore track / research-more rather than a confident buy-style stance. The
              company clearly built something strategic, but the user's key valuation question has to be answered with
              discipline: the last hard public number is $808 million, the October 2024 $2.1 billion premise is not
              supported by fetched sources, and the acquisition headline does not give a usable clearing price. Entry
              discipline should center on the disclosed chronology and on what additional evidence would move the call,
              not on a rumored or inferred multiple.
