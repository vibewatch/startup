  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Publicly described Veza stack from source systems and custom connectors up through graph analytics, governance
      workflows, and external action surfaces.
    data:
      layers:
        - id: l1
          label: Identity / app / cloud / data / AI source systems
          detail: >-
            Okta, Entra, Workday, GitHub, SaaS, databases, cloud platforms, OpenAI, and other upstream systems that emit
            authorization metadata.
        - id: l2
          label: Native read-only connectors
          detail: >-
            Agentless integrations ingest effective permissions and activity context without service-interrupting agents
            on the target system.
        - id: l3
          label: OAA / OAA Write custom connector layer
          detail: >-
            Customer-built extensions normalize unsupported or homegrown apps into Veza’s universal model and can also
            drive write-path automation.
        - id: l4
          label: Access Graph / universal authorization schema
          detail: >-
            Graph-based permissions layer that connects identities, groups, roles, policies, resources, and effective
            permissions.
        - id: l5
          label: Analytics + search layer
          detail: >-
            Access Search, Access Intelligence, Activity Monitoring, and Access AI surface risky, dormant, or excessive
            access.
        - id: l6
          label: Governance workflow layer
          detail: >-
            Access Reviews, Lifecycle Management, Access Requests, and Access AuthZ move from visibility into review,
            request, provision, and revoke actions.
        - id: l7
          label: NHI / AI control overlay
          detail: >-
            NHI Security, AI Agent Security, and Access Agents apply the same model to machine identities, AI agents,
            and tool permissions.
        - id: l8
          label: External action / audit plane
          detail: >-
            REST APIs, ServiceNow, Jira, Slack, Teams, and audit logs connect Veza outputs into surrounding enterprise
            workflows.
