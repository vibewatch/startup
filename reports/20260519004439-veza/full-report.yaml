            body: >-
              Veza's trust story is stronger than its public reliability telemetry. The product and access-governance
              pages say the platform uses encryption at rest and in flight, strict RBAC, tenant isolation, zero external
              access by design, independent penetration testing, and holds SOC 2 Type I, SOC 2 Type II, and ISO 27001
              certifications. The security whitepaper adds that the platform is cloud native and built for highly
              scalable and available services, while the 2026 Access Agents release says AI capabilities are built on
              AWS Bedrock and work across both standard SaaS and a dedicated-tenant “Veza Secure SaaS” deployment.
              Public write-side safety controls are also meaningful: lifecycle and Access AuthZ materials disclose dry
              runs, safety limits, versioning, rollback controls, predictive safeguards, and continuous audit logging.
              Those are credible reliability signals for governance automation. But the public record still stops short
              of true infrastructure transparency. No fetched source disclosed uptime commitments, region footprint, DR
              architecture, incident history, or connector-level success/failure metrics. The result is a solid
              enterprise trust posture, paired with limited public evidence about day-two SRE quality.
