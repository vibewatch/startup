      - number: '4.5'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The key distinction is between revenue quality and disclosure quality. Revenue quality appears
              directionally good: the contract supports annual prepaid enterprise subscriptions, the product portfolio
              enables upsell across identities, integrations, and modules, blue-chip customers validate willingness to
              deploy at scale, and management's expansion metrics point to land-and-expand rather than one-off services
              dependence. Disclosure quality is the weak point. Public sources never reveal absolute revenue, gross
              margin, post-Series-D cash, or acquisition consideration, so Veza cannot be underwritten from public
              evidence the way a transparent late-stage software issuer could be. The company instead reads as a
              strategically important identity-security asset with credible demand and credible access to capital, but
              with a standalone margin path and capital-efficiency profile that were never proven publicly before
              ServiceNow ended the independent story. That makes the correct financial recommendation conditional:
              respect the recurring-revenue signals, but treat every hard underwriting conclusion as provisional until
