      - number: '7.5'
        title: Final Risk Verdict
        blocks:
          - type: paragraph
            body: >-
              Veza is best understood as a strategically validated but partially proven asset. The positive case is
              real: the company built a differentiated authorization-centric platform, won credible enterprise adoption,
              and became valuable enough for ServiceNow to buy before the standalone story matured. The caution is
              equally real. Public evidence still points to a company selling into a crowded market with bundled giants,
              integration-heavy deployments, opaque pricing, incomplete concentration data, and aggressive AI/NHI
              messaging whose newest claims are supported mainly by company-authored materials. That mix produces a
              medium-high residual risk rating. It is too positive to call the business broken, because customers,
              funding, and acquisition interest all point the other way. It is also too under-disclosed to call the risk
              low, because acquisition economics, post-close roadmap, incident history, and true standalone unit
              economics are still missing from the public record. The most important kill criteria are therefore
              post-close: evidence that ServiceNow is de-emphasizing open-platform support, slow-walking integration,
              changing packaging in ways that reduce adoption, or failing to retain the Veza product and engineering
              core. If those indicators emerge, the strategic premium implied by the sale may prove less durable than
              the acquisition headline suggests.
