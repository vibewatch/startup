company:
  name: Veza
chapter:
  number: 8
  title: Valuation
  summary: >-
    The last clean public valuation anchor for Veza is the officially disclosed $108 million Series D at an $808 million
    valuation on 2025-04-28, not the prompt's unsupported October 2024 $2.1 billion claim. ServiceNow's December 2025
    acquisition validates strategic relevance, but official consideration remains undisclosed and Veza never published
    absolute ARR or revenue, so exact ARR or M&A multiples cannot be calculated from public evidence. The right stance is
    therefore track / research-more with the standalone base case anchored near the last disclosed mark and only a modest
    premium supportable without private financials or deal terms.
sections:
- id: recommendation-and-valuation-stance
  title: Recommendation and valuation stance
  body: |-
    Veza is easier to like strategically than to price precisely. The public evidence says the company raised a $108 million Series D at an $808 million valuation in April 2025, more than doubled ARR year over year, and later attracted ServiceNow as an acquirer. That is meaningful proof of relevance. But it is not enough to support a clean standalone underwriting call at any exact multiple because Veza never publicly disclosed absolute ARR, revenue, gross margin, burn, or cap-table economics. ServiceNow's own announcement also omits purchase price and consideration mix, so even the eventual exit does not solve the pricing problem.

    The recommendation is therefore track / research-more rather than a confident buy-style stance. The company clearly built something strategic, but the user's key valuation question has to be answered with discipline: the last hard public number is $808 million, the October 2024 $2.1 billion premise is not supported by fetched sources, and the acquisition headline does not give a usable clearing price. Entry discipline should center on the disclosed chronology and on what additional evidence would move the call, not on a rumored or inferred multiple.
