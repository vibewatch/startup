- id: final-verdict-kill-triggers-and-diligence
  title: Final verdict, kill triggers, and diligence asks
  body: |-
    The final stance is straightforward: Veza's strategic value is proven, but its standalone valuation precision is not. The company clearly improved its disclosed valuation between the 2023 TechCrunch-reported $415 million mark and the 2025 officially disclosed $808 million Series D, and the ServiceNow transaction is strong qualitative validation. But official transaction economics remain undisclosed, so investors cannot tell from public evidence whether the sale represented a modest premium, a major premium, or simply a strategic outcome near the last round. That gap alone prevents a high-confidence price conclusion.

    The practical implication is that diligence has to focus on the missing denominators and the missing deal terms. The main thesis-break triggers are also valuation triggers: if private ARR proves much smaller than assumed, if the consideration paid was close to or below the last round, if services-heavy deployment burden compresses quality, or if ServiceNow integration weakens Veza's distinct product identity, then the premium case collapses. Until those issues are resolved, the correct recommendation is not to force a number, but to anchor on the last disclosed valuation, use public comps as directional context, and require private evidence before paying for upside.
