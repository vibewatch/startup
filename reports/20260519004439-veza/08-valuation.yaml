- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR scale disappoints
    - Private ARR or revenue at signing is materially below what the market would need to justify a premium to $808M
    - Breaks the comp-based upside case and implies the last round may already have been full.
    - Move the valuation view toward or below the bear range.
  - - Acquisition premium is minimal
    - Deal documents show consideration near, at, or below the last disclosed round
    - Turns strategic validation into weak numeric validation.
    - Stop treating the acquisition headline as evidence of a strong premium outcome.
  - - Services / deployment drag is heavy
    - Implementation burden, services dependence, or support intensity is higher than implied by the narrative
    - Compresses software-quality multiples and weakens margin confidence.
    - Lower target range and require clearer unit-economics support.
  - - Integration risk rises post-close
    - ServiceNow integration delays, employee attrition, or liability disclosures become material
    - Reduces confidence that the sale validated durable standalone scarcity.
    - Treat the deal as strategic tuck-in evidence rather than proof of premium market power.
  - - Public comp multiple compression
    - Identity/security public comps derate materially from current bands
    - Narrows the set of defensible premium outcomes for any private identity asset.
    - Tighten scenario ranges and reset entry discipline.
  notes: These are valuation triggers, not generic operating risks. Each one transmits directly into a lower supportable multiple or a weaker premium case.
