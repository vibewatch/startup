- id: valuation-chronology-and-disclosure-limits
  title: Valuation chronology and disclosure limits
  body: |-
    The public chronology is coherent and important. Veza officially emerged from stealth in 2022 with more than $110 million in funding, then announced strategic investments from Capital One Ventures and ServiceNow Ventures in August 2023 that brought total financing to $125 million. TechCrunch added the missing valuation context for that 2023 event, reporting a $15 million round at a $415 million valuation. The next and last disclosed priced anchor is the April 2025 Series D: Veza, Business Wire, and SecurityWeek all support $108 million raised at an $808 million valuation, with total equity funding reaching $235 million.

    That sequence matters because it is the best available ground truth against the prompt's claimed October 2024 $2.1 billion round. None of the fetched official or independent sources cited here support that event. The chronology also shows why false precision is dangerous. Veza disclosed strong growth markers such as ARR more than doubling and enterprise NRR nearing 150%, but it did not publish absolute ARR or revenue. Then ServiceNow announced the acquisition in December 2025 and later updated the release to say the transaction closed on March 2, 2026, while still not disclosing consideration. The result is a well-sourced chronology with incomplete valuation math.
