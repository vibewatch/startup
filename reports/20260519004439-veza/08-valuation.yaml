- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Valuation chronology
    - Public sources cleanly support a move from a 2023 $415M reported mark to a 2025 $808M disclosed round.
    - The chronology still lacks a disclosed 2024-2026 absolute ARR bridge and does not prove a public $2.1B event.
    - Provide board-approved financing chronology and KPI bridge across the final standalone period.
  - - Strategic relevance
    - ServiceNow buying Veza signals real strategic value in identity security and AI-era access control.
    - Strategic buyer interest does not reveal the clearing price or the premium paid.
    - Disclose transaction consideration and any material closing adjustments.
  - - Public comp framing
    - Identity and security comps show live public bands from about 5x to about 18x.
    - Veza's denominator is missing, so the band cannot be translated into an exact Veza multiple.
    - Disclose absolute ARR or revenue at or near the Series D and signing dates.
  - - Downside discipline
    - The April 2025 round is a hard anchor and prevents valuation drift into rumor.
    - Peer reviews and pricing opacity suggest execution and monetization friction that can cap premium multiples.
    - Show deployment efficiency, services burden, renewal quality, and realized pricing power.
  - - Exit validation
    - Acquisition plus close date confirm the company reached a real strategic outcome.
    - Official terms remain undisclosed, so the exit cannot be treated as a numeric proof point.
    - Provide merger summary, payment mix, and waterfall analysis.
  notes: Thesis and anti-thesis are intentionally price-sensitive. Each row identifies what missing evidence would actually move the valuation call rather than repeating general product strengths.
