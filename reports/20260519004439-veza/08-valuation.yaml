- id: scenario-framing-and-upside-downside-balance
  title: Scenario framing and upside / downside balance
  body: |-
    Because exact ARR and acquisition consideration are undisclosed, the scenario exercise has to be framed as disciplined bracketing rather than model-grade valuation. The bear case assumes the April 2025 round already captured much of Veza's peak standalone optimism, and that implementation friction, opaque pricing, and bundle-heavy competition would have limited any premium without private proof of scale. That pushes fair value toward roughly $650 million to $800 million. The base case keeps the last disclosed $808 million mark as the central anchor and allows only a modest premium for strategic interest, landing around $800 million to $1.0 billion.

    The bull case requires more than narrative. To defend something like $1.0 billion to $1.3 billion on a standalone basis, an investor would need private evidence that Veza's undisclosed absolute ARR had become large enough to support a premium identity-security multiple and that ServiceNow's interest reflected more than just strategic fit. Public evidence does support the ingredients for upside: very strong growth signals, nearly 150 customers at signing, and strategic acquisition interest. But because the missing denominators never became public, the upside should remain conditional and the probability-weighted view should stay close to the last hard disclosed mark.
  claimRefs:
