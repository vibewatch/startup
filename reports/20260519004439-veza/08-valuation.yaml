  - CV037
  - CV042
  - CV048
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Absolute scale
    - ARR, revenue, billings, and cohort retention at Series D and signing dates
    - Without the denominator, no exact ARR or revenue multiple is possible.
    - CFO / board reporting pack and audited management accounts.
  - - Acquisition economics
    - Purchase price, cash / stock mix, earn-outs, escrows, and closing adjustments
    - This determines whether the sale was a modest or material premium to the last round.
    - Merger summary, board deck, and legal diligence on transaction documents.
  - - Capital structure
    - Fully diluted cap table, preferences, seniority, and any unusual investor protections
    - Enterprise value and common-equity value can diverge sharply in late-stage private companies.
    - Finance + counsel review of financing docs and waterfall model.
  - - Margin quality
    - Gross margin, support burden, services mix, and implementation economics
    - Peer reviews suggest potential deployment friction that can compress software multiples.
    - Audited P&L and customer-implementation cost analysis.
  - - Post-close roadmap
    - How ServiceNow will package, price, and retain Veza capabilities and talent
    - Determines whether strategic relevance translates into durable product value or becomes bundle filler.
    - Product roadmap review, retention package summary, and customer communication materials.
  notes: These asks are the minimum package required before claiming confidence above the last disclosed valuation anchor. Missing items are economically determinative, not cosmetic.
