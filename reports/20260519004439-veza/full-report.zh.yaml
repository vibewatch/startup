      - number: '2.4'
        title: 增长驱动因素、采用约束与市场时点
        blocks:
          - type: paragraph
            body: >-
              Veza 所在市场的需求侧由几股持久力量支撑。CISA 和 NIST 的零信任指南都推动企业转向最小权限，以及更细粒度、感知上下文的访问决策。Veza 自己的统计和相邻市场研究都说明复杂度正在爆炸：企业使用数百个
              SaaS 和云服务，机器身份数量远超人类，基于身份的攻击越来越成为入侵核心。公开竞争对手页面也确认，整个行业正在向覆盖人类、机器和 AI 的平台收敛；这验证了问题，也加剧了竞争。收敛本身就是主要约束。买方已经能从
              SailPoint、CyberArk、Microsoft Entra、Saviynt、Omada、One Identity，以及 Opal 等更新的即时访问专家那里听到类似叙事。Help Net Security
              对 Veza Access AuthZ 发布的报道引用了 Gartner 的说法：50% 的 IGA
              部署处于困境。这既是驱动因素，也是警告：客户想要现代化，但实施仍可能昂贵、缓慢且带有政治阻力。因此市场有吸引力，但采用时点取决于 Veza 能否证明相较传统和捆绑替代方案，它能带来更快 ROI 和更低实施摩擦。
