      - number: '2.5'
        title: 矛盾、预算模糊，以及公开数据仍无法证明什么
        blocks:
          - type: paragraph
            body: >-
              本章主要分析风险，是把宽口径市场报告过度解读为直接测算了 Veza。事实并非如此。本次抓取到的分析师估计定义了范围不同、彼此重叠的品类，容易重复计算身份支出，或把增长最快的相邻细分误认为 Veza
              实际可触达机会。公开证据对精确付费行为也很弱。产品页面和案例研究强烈暗示安全、IAM 和治理部门拥有采购权，但没有披露标准预算线、ACV
              区间，或交易主要是竞争性替换还是新增控制层。公开来源也很少说明，ServiceNow 交易前 Veza 的需求有多少来自人类身份治理，又有多少来自非人类身份或 AI 智能体安全。这些缺口很关键，因为它们决定
              Veza 是在销售一个庞大、可复制的品类，还是在服务一个更窄但痛点很强的复杂企业细分。尽调上，应把市场视为庞大、真实且增长中；但作为 Veza 自身干净的独立 TAM/SAM/SOM 栈，目前只得到部分证明。
