              Veza 一直在权限可见性和授权建模上做差异化，而不只是经典目录、角色或工作流管理。Access Graph 和 Open Authorization API
              让公司有一条可信路径去治理自定义应用、数据系统和机器身份；许多老一代 IGA 叙事对这些场景处理得没那么直接。
