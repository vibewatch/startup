      claimRefs:
        - CO003
  foundingLocation: Bay Area, California, USA
  headquarters: Los Gatos, CA, USA (ServiceNow disclosure; earlier Veza releases used Palo Alto and Redwood Shores datelines)
  productSummary: >-
    Veza 的 Access Platform 围绕 Access Graph 以及广泛的无代理、只读连接器搭建，可把用户、群组、角色、策略、应用、系统和数据映射为有效权限。平台覆盖 ISPM
    式可见性与情报、访问审查、生命周期管理、访问请求、Access AuthZ、NHI 安全、Access AI 和 AI 智能体安全；其中 OAA 是面向自定义或其他不受支持系统最清晰的技术差异点。
  customerFocus: >-
    大型、异构企业，云、SaaS、数据和自定义应用中的权限蔓延复杂。公开证据在监管要求高或运营复杂的买方中最强，包括银行、酒店、FMCG、金融服务、医疗保健、制药、生命科学、零售和大型科技环境；典型高管发起人为 CISO、IAM
    负责人、CIO/SVP IT 和平台安全负责人。
  businessModel: >-
    报价驱动的企业 B2B SaaS，通过订单表销售，价格围绕活跃身份、集成、产品和扩展模块设定，默认按年预付。收入可通过生命周期、审查、NHI、Access AuthZ 以及专业服务 / 支持附加扩张，但实际价格、ACV
    和收入结构从未公开披露。
  stage: Acquired (ServiceNow announced 2025-12-02; close disclosed as 2026-03-02)
  fundingStatus: >-
