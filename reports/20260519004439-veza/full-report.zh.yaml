        title: 留存、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开持续性信号偏正面，但并不完整。Veza 2024 年 12 月的 COO 任命公告称，企业净留存率（NRR）超过 120%；2025 年 4 月 Series D 公告称，企业 NRR 接近 150%，ARR
              同比增长超过一倍。对一家企业软件公司来说，这些都是很强的先落地再扩张代理信号，尤其是客户故事还显示应用覆盖更广、跨职能工作流集成更多、整改使用更深。Choice Hotels 明确表示计划把 Veza
              扩展到更多团队和更多应用；Deluxe 和 InComm 把产品嵌入相邻系统和流程；Blackstone
              从早期客户演进为投资方和公开参考。但公开客户透明度远未达到投资人做集中度分析所需的水平。已获取来源没有披露流失、总留存率（GRR）、续约率、平均合同期限、ACV
              分布、头部客户收入占比，也没有给出高层级行业标签之外的垂直和地域组合。ServiceNow 的签约披露只把当前客户行业写到银行、酒店和快消（FMCG），Veza 2024 年 GTM
              公告又补充金融服务、医疗、制药、生命科学、零售和大型科技公司，但两个来源都没有给分母。因此，扩张逻辑支撑较好，集中度逻辑仍主要是尽调缺口。
