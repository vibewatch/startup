      - number: '8.3'
        title: 公开市场参照点与可比公司组
        blocks:
          - type: paragraph
            body: >-
              公开可比公司组有方向性价值，但不能机械套用。SailPoint、CyberArk 和 Okta 都是可信的身份安全参照，因为它们都公开营销面向人、机器和 AI 身份组合的安全能力。Rubrik
              不那么直接，但作为更广安全平台参照仍有用，因为它现在把身份韧性放进更大的网络韧性栈里。这些公开公司显示，截至 2026 年 5 月，市场给安全和身份资产的定价带很宽：Okta 约 5.2x 收入，Rubrik 约
              9.2x ARR，SailPoint 约 10.2x ARR，CyberArk 约 17.6x ARR。


              这个宽区间恰好说明，不能只靠公开可比公司就精确标记 Veza。Veza 横跨 ISPM、下一代 IGA、NHI 安全和 AI 智能体控制，而不是单一窄品类，所以没有任何一个可比公司完美。更重要的是，Veza
              从未披露把 $808 million 融资映射到这些公开区间所需的绝对 ARR 或收入分母。因此，可比表可以帮助框定身份安全资产在公开市场可能如何交易，但不能支持断言 Veza
              在精确倍数意义上一定便宜、合理或昂贵。
