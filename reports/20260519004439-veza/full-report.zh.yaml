              家全球企业客户，覆盖银行、酒店和快消，并在全球有 230 名员工。更早的信号也同向：TechCrunch 报道，截至 2023 年 8 月，客户数已超过 100 家，客户组合较隐身期增长三倍以上；Veza
              2024 年 12 月任命 COO 的公告称，获客覆盖金融服务、医疗、制药、生命科学、零售和大型科技公司。具名案例也强化同一模式：Blackstone、Sallie
              Mae、CopperPoint、Barracuda、InComm Payments、Choice Hotels、Deluxe、Wynn Resorts、Snowflake 和 City of Las Vegas
              都有受监管数据、多系统资产或运营复杂度。买方证据同样异常清晰。执行赞助人通常是 CISO、CSO、网络安全副总裁、SVP IT / CIO、平台工程负责人或 IAM
              负责人；日常用户包括安全、审计、合规、基础设施、应用负责人和工程团队。公开资料没有写明预算科目，但买方头衔、合规用例和企业级实施范围叠在一起，强烈指向付款来自安全、IAM 或更广的 IT
