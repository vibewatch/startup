      - number: '7.2'
        title: 执行、实施、客户与定价风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持真实客户价值，但不支持低摩擦部署叙事。Veza 自己发布 Access AuthZ 时，把平台定位为轻量、易实施，没有服务密集型部署负担。独立评论平台给出相反信号。AWS Marketplace
              评论称 Veza 价格高、设置复杂，需要跨多个系统做更多集成，而且仍缺少执行工具；PeerSpot 重复了同样主题，并补充说支持还可以更好。GetApp 和 Software Advice
              则强化另一个相关警示：买方拿不到公开价格，只能进入报价驱动或顾问驱动的联系流程；SaaS
              协议还写明，定价取决于身份、集成和产品，采用年度预付，价格条款保密，并且在合同用量超出时可以涨价。组合起来，就是熟悉的企业软件风险模式：在大型异构环境中价值很强，但实施和采购负担重，可能限制细分市场广度、拉长销售周期，并让外部更难对标
              ROI。客户质量披露又加重了这个问题。ServiceNow 披露近 150 家客户，但公开记录仍没有拆出集中度、ACV
              组合、续约画像或服务附加。结果是一套可信的企业级销售动作，但执行风险中高，尤其是在平台变得黏性之前，客户还需要做定制集成工作。
