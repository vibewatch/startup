      - number: '1.3'
        title: 融资历史、估值与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Veza 的资本故事格外重要，因为有来源支撑的记录直接推翻了用户给出的资格前提。公司于 2022-04-27 走出隐身期，获得 Accel、Bain Capital、Ballistic
              Ventures、GV、Norwest、True Ventures 以及安全行业天使投资人超过 $110 million 支持。2022 年 6 月，Blackstone 同时成为客户和战略 Series C
              投资者，但本次抓取的公开材料没有披露该轮确切规模。2023 年 8 月，Veza 宣布获得 Capital One Ventures 和 ServiceNow Ventures 战略投资，使累计融资达到 $125
              million；TechCrunch 另行报道该交易为一轮 $15 million 融资，估值 $415 million。决定性的独立融资事件发生在 2025-04-28，Veza 官方宣布获 NEA 领投
              $108 million Series D，估值 $808 million；Atlassian Ventures、Workday Ventures 和 Snowflake Ventures
              新加入，Accel、GV、True Ventures、Norwest、Ballistic Ventures、J.P. Morgan 和 Blackstone 继续支持。官方和独立来源共同支持 Veza
              累计股权融资 $235 million，但不支持 2024 年 10 月 $2.1 billion 投后估值事件。
