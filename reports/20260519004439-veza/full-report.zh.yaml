      - number: '7.4'
        title: 收购与整合风险
        blocks:
          - type: paragraph
            body: >-
              截至报告日，Veza 的风险画像已无法和 ServiceNow 切开。收购于 2025 年 12 月宣布，ServiceNow 官方新闻稿后来更新称，交易已于 2026 年 3 月 2
              日交割。投资问题因此从独立公司的持续性，转为交割后的吸收风险。ServiceNow 自己的前瞻性表述异常明确：风险包括 Veza
              技术整合延迟、无法留住员工、意外负债和管理层分心。独立分析从不同角度强化同一担忧。KuppingerCole 认为，把身份治理更深地嵌入 ServiceNow，会增加客户的平台引力和切换复杂度；Forbes 则称
              ServiceNow 尚未披露具体整合时间表，并且未来可能把 Veza 核心能力打包进 AI Control
              Tower，再把高级功能单独定价。组合起来有三类重要风险。第一，客户可能等待路线图清晰后再扩张。第二，Veza 差异化的图谱和治理表面可能被重新打包，或从属于更广的 ServiceNow
              优先级。第三，如果身份治理变得离不开 ServiceNow 工作流，最佳单品买方可能担心锁定效应。收购显然验证了战略相关性，但也截断了判断独立经济性的公开证据，把关键执行负担转移到并购后整合。
