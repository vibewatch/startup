  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块广度与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Veza 在产品、访问治理以及后来的 ServiceNow 材料中的公开定位一致：这是一个以授权为核心的访问平台，不只是狭窄认证工具。产品页面把平台分成三大平面——ISPM 式可见性与情报、IGA 工作流、非人类
              / AI 身份安全——随后加入 Access Graph、Access AI、Access Hub、API
              和集成等平台能力。这很重要，因为买方工作流从理解许多系统中谁能访问什么开始，但商业故事会延伸到审查、生命周期动作、请求，并在 2025 年底通过 Access AuthZ 进入最后一英里执行。Access
              Reviews、Lifecycle Management、Access Requests、NHI Security、Access AI、AI Agent Security 和 Access Agents
              都有直接公开模块证据；Access AuthZ 较新，但也被清楚纳入同一平台。广度令人印象深刻，但模块深度不均：可见性和审查功能在多个页面反复出现，而部分更新的 AI
              和自动化界面仍更多依赖发布文案，缺少独立运营证据。
