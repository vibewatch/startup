      - number: '5.4'
        title: AI、NHI 与自动化扩张
        blocks:
          - type: paragraph
            body: >-
              2024 年至 2026 年初，Veza 快速越过经典访问可见性。Access AI 引入自然语言查询、风险优先级、角色建议和修复 / 工单辅助。NHI Security
              把平台延伸到服务账户、密钥、机密凭据、工作负载和归属治理。随后 Access AuthZ 通过 SCIM、原生连接器和 OAA
              Write，把平台从治理推向跨云、SaaS、本地部署和自定义应用的最后一英里配置与取消配置。到 2025 年底和 2026 年初，AI Agent Security 和 Access Agents
              又把同一模型延伸到智能体 AI、MCP 服务器、工具权限、爆炸半径映射，以及对话式 /
              自动化身份运营。这样的发布节奏支持一个真实的“平台拓宽”故事，而不是静态点产品。不过，证据质量有混合性。时间线真实且有直接来源，但更新 AI
              和自动化主张缺少独立证明。公开资料没有准确率、误报率或客户规模基准，能显示 Access AI、AI Agent Security 或 Access Agents
              在生产环境胜过同业。因此，公开成熟度在方向和功能广度上很强，在第三方验证上只是中等。
