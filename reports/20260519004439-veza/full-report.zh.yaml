        title: 能力对比、包装模糊性与分发力量
        blocks:
          - type: paragraph
            body: >-
              能力重叠很广，但深度不均。Veza 的公开案例在以下场景最强：买方需要统一不受支持或自定义系统的可见性，需要把非人类身份与人类一起治理，并希望缩短集成见效时间。Open Authorization
              API、低代码连接器叙事和 Access Graph，正是在这些场景下把产品故事与经典工作流中心式 IGA 区分开来。SailPoint、Saviynt、Omada 和 One Identity
              在企业熟悉度、合作伙伴生态和传统治理工作流上仍更强。Microsoft Entra 受益于云分发和捆绑。CyberArk 在特权和机器身份安全上尤其有分量。Opal 的工作流原生 JIT
              叙事对主要需要限时访问和审批自动化，而不是完整跨系统授权图谱的客户有吸引力。整个集合的公开价格透明度都很差。多数抓取来源没有披露具体标价，因此比较必须聚焦包装形态、部署模式和可能成本驱动，而不是精确价格点。价格不透明本身也是一种竞争特征：既有厂商可以在更广关系中打折，Veza
              则可能需要证明一条独特 ROI 路径，而不是依赖低标价。
