      - number: '8.2'
        title: 估值时间线与披露边界
        blocks:
          - type: paragraph
            body: >-
              公开时间线连贯且重要。Veza 于 2022 年正式走出隐身状态，已融资超过 $110 million；随后在 2023 年 8 月宣布 Capital One Ventures 和 ServiceNow
              Ventures 的战略投资，使累计融资达到 $125 million。TechCrunch 补上了该 2023 年事件缺失的估值背景：报道一轮 $15 million 融资，对应 $415 million
              估值。下一个、也是最后一个披露定价锚，是 2025 年 4 月 Series D：Veza、Business Wire 和 SecurityWeek 都支持公司融资 $108 million、估值 $808
              million，累计股权融资达到 $235 million。


              这条序列很重要，因为它是对照题设所称 2024 年 10 月 $2.1 billion 融资的最佳可得事实基础。这里引用的官方或独立来源，没有任何一个支持该事件。时间线也说明为什么虚假精确很危险。Veza 披露了
              ARR 增长超过一倍、企业 NRR 接近 150% 等强增长标记，但没有公布绝对 ARR 或收入。随后 ServiceNow 于 2025 年 12 月宣布收购，并在后续更新中称交易于 2026 年 3 月 2
              日交割，但仍未披露对价。结果是一条来源扎实的时间线，配上一套不完整的估值数学。
