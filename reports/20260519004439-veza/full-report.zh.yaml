  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Veza 时，更合适的框架是一个以授权为核心、横跨多个相邻市场的身份安全平台，而不是纯粹的传统 IGA 厂商。Veza
              自己的表述把身份安全态势管理、访问可见性、访问情报、生命周期控制、非人类身份治理，以及通过 Open Authorization API 实现的自定义应用授权结合在一起。因此，最宽的相关市场边界包括
              IGA、身份安全态势管理、非人类身份治理、PAM 相邻访问保障，以及把权限可见性作为主要控制问题的一部分数据访问治理支出。纯目录服务、基础 SSO、终端身份和横向 ITSM
              工作流不应纳入，除非这些系统嵌入访问治理流程。Veza 想替换的现状不是某一个竞争工具，而是一整套层叠组合：手工访问审查、静态角色模型、传统 IGA 套件、云原生点工具、自建审批工作流，以及散落在
              IAM、安全、数据和平台团队中的碎片化可见性。这个碎片化基线很重要，因为 Veza 的销售动作更少依赖创造新的合规义务，更依赖把多个既有系统中的访问真相整合起来。
            claimRefs:
