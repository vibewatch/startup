  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              从战略上喜欢 Veza 很容易，精确定价却很难。公开证据显示，公司在 2025 年 4 月以 $808 million 估值完成 $108 million Series D，ARR 同比增长超过一倍，后来又吸引
              ServiceNow 成为收购方。这是有意义的相关性证明。但这些证据不足以支撑任何精确倍数下的干净独立承销判断，因为 Veza 从未公开披露绝对
              ARR、收入、毛利率、烧钱速度或股权结构经济性。ServiceNow 自己的公告也没有披露收购价格和对价组合，所以即便最终退出也没有解决定价问题。


              因此，建议是观察 / 继续研究，而不是有信心的买入式立场。公司显然做出了有战略价值的东西，但用户的关键估值问题必须用纪律来回答：最后一个硬公开数字是 $808 million，2024 年 10 月 $2.1
              billion 的前提没有已获取来源支持，收购标题也不给可用的出清价格。入场纪律应围绕已披露时间线和能改变判断的额外证据，而不是围绕传闻或推断倍数。
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV012
              - CV015
