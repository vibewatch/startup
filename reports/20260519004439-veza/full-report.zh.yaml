      - number: '2.2'
        title: 市场规模口径，以及它们对 Veza 真正意味着什么
        blocks:
          - type: paragraph
            body: >-
              公开市场规模来源支持一个庞大且增长中的机会，但不能一比一描述 Veza 的可服务市场。Grand View Research 估计全球 IGA 市场 2024 年为 $7.95 billion，并预计到 2033
              年达到 $27.11 billion，CAGR 为 14.9%。Fortune Business Insights 将同一品类 2025 年规模置于 $9.29 billion，并预计到 2034 年增至
              $33.1 billion，CAGR 为 15.16%。相邻品类根据方法不同可能更大或增长更快：MarketsandMarkets 预计 ISPM 市场从 2024 年 $13.7 billion 增至 2029
              年 $33.1 billion，CAGR 为 19.3%；并预计非人类身份访问管理从 2024 年约 $9.45 billion 增至 2030 年 $18.71 billion，CAGR 为
              11.9%。这些估计适合作为边界标记，而不是直接 TAM 答案。Veza
              的真实可服务市场更窄，因为产品最适合拥有复杂权限图谱、混合云和多云资产、自定义应用，或机器身份快速蔓延的企业。因此，正确的估值口径是多个相邻市场内部受约束的企业安全楔子，而不是所有身份支出品类的简单加总。
