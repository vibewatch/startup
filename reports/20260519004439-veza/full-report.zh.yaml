companyProfile:
  summary: >-
    Veza 由 Tarun Thakur、Maohua Lu 和 Rob Whitcher 于 2020 年创立，目标是在混合云和多云环境里搭建以授权为核心的身份安全平台。公开融资时间线显示：2022 年隐身期融资超过
    $110M；2023 年战略融资被 TechCrunch 报道为估值 $415M；2025-04-28 获 NEA 领投的 $108M Series D，估值 $808M，累计披露股权融资达到
    $235M。签约时，ServiceNow 称 Veza 服务近 150 家全球企业客户、拥有 230 名员工；随后又在新闻稿中更新称收购已于 2026-03-02 完成。公开收购价仍未披露，因此 Veza
    应被定性为已被收购的战略资产，而不是当前独立运营的独角兽。
  foundedDate: '2020-01-01'
  founders:
    - name: Tarun Thakur
      role: 联合创始人兼 CEO
      background: Datos IO 前联合创始人兼 CEO；此前在 Data Domain 和 IBM Research 负责产品与研究。
