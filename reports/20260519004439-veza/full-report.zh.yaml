      - number: '1.4'
        title: 规模指标、客户证据与里程碑
        blocks:
          - type: paragraph
            body: >-
              Veza 从未公开披露绝对 ARR 或收入，但公司发布的运营信号足以支撑一个可信的增长叙事。到 Series D 公告时，公司称 ARR 同比增长超过一倍，企业净留存率接近 150%，员工数超过
              190，管理中的权限超过 20 billion，原生集成超过 250。融资和客户材料提到的客户名单包括 Blackstone、Workday、Sallie Mae、Snowflake、Wynn
              Resorts、Deluxe、Choice Hotels、Expedia 和 Zoom。几个案例对一家私营安全公司而言尤其具体：Blackstone 描述了 700 多名审查人和 60
              多个已接入应用；Snowflake 认为 Veza 的 Access Graph 让 RBAC 可见性可执行；Choice Hotels 把平台与审计准备和细粒度 AWS 治理挂钩；Deluxe 强调跨
              AWS、GitHub、Azure、Slack 和 Jira 的跨系统可见性。里程碑显示范围持续拓宽：2022 年隐身发布，2023 年达到 100 个集成并任命 Phil Venables 为董事，2024
              年推出 Access AI 并获得更多战略资本，随后是 Series D、EMEA 扩张、非人类身份产品扩张，最后是 ServiceNow 在 2025 年至 2026 年初宣布并完成收购。
