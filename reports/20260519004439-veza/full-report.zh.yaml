  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头、相邻平台与现状
        blocks:
          - type: paragraph
            body: >-
              Veza 的相关竞争集合，不止于一对一的“身份治理”厂商。SailPoint、Saviynt、Omada、One Identity、Microsoft Entra 和 CyberArk
              等传统或规模化既有厂商，即便切入方向不同，也都在解决同一买方问题的一部分。SailPoint 和 Saviynt 是最直接的治理平台同业；Omada 和 One Identity 代表成熟企业 IGA
              替代方案；Microsoft Entra 带来捆绑和装机基础力量；CyberArk 切入机器、特权和更宽的身份安全层；Opal
              则代表更现代、以即时访问和工作流为中心的替代方案。现状仍然强大：许多企业继续依赖电子表格、静态角色、云原生点工具或内部审批工作流，而不是用单一平台替换。Veza 自己的对比页面明确瞄准
              SailPoint、Saviynt 和 Lumos，这对理解其感受到的压力方向有帮助，但这些页面有厂商自利性，不能当作独立证据。实际结论是，Veza 必须同时打赢重量级套件和碎片化自建基线。
