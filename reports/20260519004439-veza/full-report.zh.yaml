        - 从云、SaaS、数据、本地和 AI 系统读取身份与授权元数据
        - 提供商 API 和权限模型
        - API 变更、速率限制或源数据缺失都可能削弱覆盖
      - - Open Authorization API（OAA，开放授权 API）
        - 把不受支持或自定义系统规范化进 Veza 的通用 schema
        - 客户工程 + 自定义应用 API
        - 扩展能力很强，但可能把实施工作转给客户
      - - OAA Write / 原生写入连接器
        - 把配置和取消配置动作推入目标系统
        - SCIM、OAuth2、原生 API 和自定义 REST 端点
        - 写入路径质量比只读发现更难公开证明
      - - Access Graph / 通用授权模型
        - 遍历身份、群组、角色、策略、资源和有效权限
        - Veza 内部图谱实现
        - 底层图存储、性能边界和容错能力未公开描述
      - - 分析和编排层
        - 支撑搜索、智能分析、评审、请求、生命周期和 Access AuthZ
        - 规则、查询、工作流引擎、外部工单 / 通信集成
        - 没有关于查询延迟、工作流吞吐量或对账成功率的公开遥测
      - - AI 层（Access AI / AI Agent Security / Access Agents）
        - 汇总风险、解释访问、发现智能体 / 工具，并自动化分析师任务
        - AWS Bedrock 加 Veza 的身份 / 权限语料
        - 模型质量、幻觉控制和人工覆盖指标没有公开基准
      - - 外部动作平面
        - 创建工单、路由通知，并为周边工作流开放 API
        - ServiceNow、Jira、Slack、Microsoft Teams、客户系统
        - 企业价值取决于周边工作流栈是否真正集成
    notes: 这张表只保留公开资料明确描述的组件。图数据库选择、控制平面布局、DR 设计等更深层内部信息仍未披露。
