      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              抓取证据指向身份和安全领导层，而不是业务线负责人，作为 Veza 的自然买方群。Veza 自己的产品和市场页面面向身份、安全和治理团队；这些团队需要看清应用、数据和云系统中的访问。客户案例则把 CISO、IAM
              负责人和云平台负责人放在采用故事中心。这意味着主要买方图谱是：CISO、IAM 主管或云安全负责人发起平台采购；应用负责人、审查人和平台团队成为运营用户；企业审计、合规或 IT
              领导层经常影响预算批准。采用很可能从可见性和证据收集开始，因为买方首先需要理解谁能访问什么。随后平台扩展到访问审查、策略情报、监控、生命周期工作流，并最终进入机器身份或 AI
              智能体治理。预算路径因此是跨职能的，也可能较慢：它常常不是面对一张空白白板，而是与既有 IGA 套件、捆绑云控制或内部流程自动化竞争。
