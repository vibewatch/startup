      - number: '5.2'
        title: 架构、集成与可扩展性
        blocks:
          - type: paragraph
            body: >-
              公开架构故事围绕三个相连组件展开：广泛的无代理只读摄取、基于图的权限模型，以及面向不受支持系统的 OAA。Veza 反复称原生集成可以在不冒服务中断风险的情况下揭示有效权限；Access Graph
              则穿透用户、群组、角色、策略、应用、系统和数据，形成标准化权限视图。集成目录、2023 年 100 个集成里程碑，以及面向 GitHub、Workday 和 OpenAI
              的具体页面，都强化了一个判断：平台设计目标是从许多不同源系统拉取身份和授权上下文，而不是只从一个目录拉取。最强技术差异点仍是 OAA：营销页面、开发者文档、GitHub 代码库和 PyPI
              包都显示，它为自定义、自建或其他不受支持应用提供自助路径。这比泛泛的“API 优先”主张更能证明平台可扩展性。与此同时，Veza
              没有公开披露更深内部细节，例如底层图数据库选择、查询引擎设计、扫描节奏，或在最大权限图谱上的性能特征。因此，高层架构是公开的，硬系统工程细节则不是。
