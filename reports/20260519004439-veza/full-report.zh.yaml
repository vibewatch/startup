chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Veza 把自己定位为围绕授权和权限可见性搭建的身份安全平台，而不是传统以目录为中心的身份工具。公司和产品页面把核心问题界定为：谁可以对哪些数据或资源执行什么动作；Access Graph
              则把云、SaaS、数据和自定义应用中的身份、权限和资源统一起来。Veza 的公司与文化页面把起点放在 2020 年，当时 Tarun Thakur、Maohua Lu 和 Rob Whitcher
              认为，云数据安全缺失的那一层就是授权。收购方官方材料后来称 Veza 总部位于加州 Los Gatos，而 Veza 自己的新闻稿以 Palo Alto 和 Redwood Shores
              为发稿地，因此有来源支撑的是湾区总部，但具体地点仍有模糊。作为独立公司，Veza 通过企业身份安全软件变现，覆盖可见性、治理、访问审查、生命周期控制和非人类身份安全；但到 2026 年 3
              月，ServiceNow 已披露收购完成，Veza 不再是一家独立私营公司。
