  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 绝对规模
        - Series D 轮和签约日对应的 ARR、收入、订阅账单额和队列留存
        - 没有分母，就无法精确计算 ARR 或收入倍数。
        - CFO / 董事会报告包和经审计的管理账。
      - - 收购经济性
        - 购买价格、现金 / 股票组合、业绩对赌、托管安排和交割调整
        - 这决定出售价格相对上一轮是小幅溢价还是实质溢价。
        - 合并摘要、董事会材料，以及交易文件的法律尽调。
      - - 资本结构
        - 完全稀释股权结构表、优先权、清偿顺位，以及任何非常规投资人保护条款
        - 在后期私营公司里，企业价值和普通股权益价值可能差得很大。
        - 财务团队 + 法律顾问审阅融资文件和分配瀑布模型。
      - - 利润率质量
        - 毛利率、支持负担、服务收入占比和实施经济性
        - 同行评价显示部署可能存在摩擦，会压缩软件估值倍数。
        - 经审计损益表和客户实施成本分析。
      - - 交割后路线图
        - ServiceNow 将如何打包、定价并留住 Veza 能力和人才
        - 决定战略相关性会转化为持久产品价值，还是变成套件填充物。
        - 产品路线图审阅、留任方案摘要和客户沟通材料。
    notes: 这些材料是把置信度提高到上次披露估值锚点之上前所需的最低包。 缺失项会决定经济结果，不是表面瑕疵。
    claimRefs:
      - CV012
      - CV015
      - CV016
      - CV017
      - CV041
      - CV046
