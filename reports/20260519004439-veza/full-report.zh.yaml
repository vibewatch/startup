            body: >-
              Veza 的公开合同和产品材料显示，它是经常性企业软件模式，而不是消费者席位模式，也不是按交易计费。SaaS 协议定义了 Active Identities，并称 Veza 按订单表，以每个 Active
              Identity 每月为基础为产品和集成定价。同一协议还称，费用根据身份、集成和产品计算，按年预先开票；如果使用量超过合同水平，费用会随之扩张。产品页面显示，变现可跨模块扩张——Access
              Reviews、Lifecycle Management、NHI Security，以及到 2025 年底的 Access
              AuthZ；合同还单独提到专业服务和支持。公开来源没有展示的内容同样重要：定价保密，没有公开标价，本次没有任何来源披露实际折扣、ACV 或软件与服务收入拆分。因此，正确读法是：Veza
              有一台企业订阅引擎，具备模块和服务附加潜力，但实际价格和收入结构仍藏在协商订单表背后。
