  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流 / 痛点
      - Veza 方案
      - 可衡量收益 / 证据
      - 限制
    rows:
      - - 理解谁能访问什么
        - 权限分散在 SaaS、云、数据和本地系统中
        - Access Graph + Search / Intelligence 统一有效权限
        - 官方页面和用户评价持续显示，Veza 改善了可见性和最小权限分析
        - 收益方向明确，但公开基准数据稀少
      - - 运行访问认证
        - 手工或走过场的评审缺少上下文和优先级
        - Access Reviews 加入基于风险的活动、评审人上下文和自动化
        - Veza 公开强调更快创建活动和风险优先的评审流程
        - 独立的吞吐量和审批质量指标未公开
      - - 安全地配置 / 取消配置用户
        - 传统 IGA 工作流慢、脆弱，也难扩展
        - Lifecycle Management 加 Access AuthZ 通过 SCIM、原生连接器和 OAA Write 自动执行写入动作
        - 官方资料强调预演、回滚和更短的平均配置时间
        - 需要在大型异构环境中的独立证明
      - - 处理 JIT 和自助访问请求
        - 用户和经理很难快速识别最小权限授权
        - Access Requests + Access Hub 编排请求、审批和 JIT 访问
        - Veza 声称，带权限上下文的请求能提升效率并减少权限蔓延
