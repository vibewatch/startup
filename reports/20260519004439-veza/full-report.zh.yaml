            body: >-
              在同业集合中，SailPoint 和 CyberArk 因规模和公开市场证据突出。SailPoint 的 2025 年 S-1 披露 $813 million ARR 和 2,895
              名客户，并把公司定位为覆盖人类、机器和 AI 身份的安全平台。CyberArk 的 2024 年 20-F 报告超过 $1.0 billion 收入和 $1.169 billion
              ARR，同时强调面向人类、机器和 AI 身份的统一安全，以及专门的机器身份产品。这些披露很重要，因为它们显示既有厂商反击已经多么宽、多么资本充足。相比之下，Saviynt、Omada、One Identity 和
              Opal 的定位很激进，但在抓取页面上披露的公开规模更少。Microsoft Entra 又不同：它不是一家类似初创公司的竞争者，而是更大套件内部的捆绑平台，因此任何单项功能对比都可能低估它的经济压力。Veza
              的对比页面主张，老一代套件在集成云、SaaS、自定义和非人类身份上仍较慢；这个主张有合理性，但尽调应在真实客户迁移中验证，而不是只看厂商撰写的落地页。
