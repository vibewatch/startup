  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 规模低于预期
        - 签约时私有 ARR 或收入显著低于市场为 $808M 溢价所需的水平
        - 打破基于可比公司的上行逻辑，并意味着上一轮可能已经打满。
        - 将估值判断下调至悲观区间或更低。
      - - 收购溢价很低
        - 交易文件显示对价接近、等于或低于最后披露轮次
        - 将战略验证变成薄弱的数字验证。
        - 不再把收购标题视为强溢价结果的证据。
      - - 服务 / 部署拖累沉重
        - 实施负担、服务依赖或支持强度高于叙事暗示
        - 压缩软件质量倍数，并削弱利润率信心。
        - 下调目标区间，并要求更清晰的单位经济支撑。
      - - 交割后整合风险上升
        - ServiceNow 集成延迟、员工流失或责任披露变得重大
        - 降低“出售验证了持久独立稀缺性”的信心。
        - 将这笔交易视为战略补强证据，而非溢价市场力量证明。
      - - 公开可比倍数压缩
        - 身份 / 安全公开可比公司较当前区间明显降级
        - 缩小任何私有身份资产可辩护的溢价结果集合。
        - 收紧情景区间，并重置入场纪律。
    notes: 这些是估值触发项，不是泛泛的运营风险。每一项都会直接传导到更低的可支撑倍数或更弱的溢价逻辑。
