      - number: '7.5'
        title: 最终风险结论
        blocks:
          - type: paragraph
            body: >-
              Veza 最适合被理解为战略已验证、但证据仍不完整的资产。正面逻辑是真实的：公司搭出差异化的授权中心平台，赢得可信企业采用，并在独立故事成熟之前，就足够有价值到让 ServiceNow
              出手收购。警示同样真实。公开证据仍指向一家在拥挤市场销售的公司，旁边有捆绑巨头，部署依赖集成，定价不透明，集中度数据不完整，而激进的 AI/NHI
              叙事里，最新主张主要由公司自撰材料支撑。这样的组合给出中高残余风险评级。它太正面，不能说业务已经坏掉，因为客户、融资和收购兴趣都指向相反方向。它又披露太少，不能说风险低，因为收购经济性、交割后路线图、事件历史和真实独立单位经济性仍从公开记录中缺失。因此，最重要的否决标准都在交割后：如果证据显示
              ServiceNow 在弱化开放平台支持、拖慢整合、改变包装并压低采用，或未能留住 Veza 产品和工程核心，那么出售隐含的战略溢价可能不如收购标题显示的那样耐久。
