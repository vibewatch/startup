      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据指向现场销售主导、合作伙伴参与度上升的企业销售动作，而不是低触达产品驱动漏斗。2023 年战略轮和 2025 年 Series D 都明确称，新资本将用于 GTM 扩张以及产品开发。2024 年
              12 月 COO 任命把销售、市场、客户成功和联盟整合到一名运营负责人之下；2025 年合作伙伴计划加上 GuidePoint 关系，增加了联合 GTM
              活动、激励和经销触达。客户证据意味着部署规模大且复杂：Blackstone 提到 700 多名审查人和 60 多个已接入应用；Deluxe 称几周内连接 AWS、GitHub 和 Azure AD；Choice
              Hotels 把 Veza 嵌入审计和修复工作流；Veza 客户页面声称节省了可观时间和成本。若与公司关于 ARR 增长超过一倍、NRR 接近 150% 的说法放在一起，这些都是健康的效率代理指标。但公开记录仍缺
