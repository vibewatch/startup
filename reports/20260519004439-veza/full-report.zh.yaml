        title: 切换成本、锁定效应、多平台并用与渠道力量
        blocks:
          - type: paragraph
            body: >-
              身份安全采购很少是干净替换。在许多账户里，Veza 更可能与身份存储、PAM 工具、云原生控制或既有 IGA
              共存，而不是立即把它们全部替掉。这同时带来机会和风险。机会来自增强买方已有资产，尤其是传统套件看不到自定义应用或现代权限蔓延时。风险来自渠道力量和捆绑：Microsoft 可以利用既有套件合同，SailPoint
              和 CyberArk 可以依赖深厚 SI 生态，买方也可能选择多平台并用而不是标准化。Veza 自己“强化
              SailPoint”的说法，隐含承认了这种共存策略：公司把自己框定为可见性和未治理系统的“最后一英里”，而不是永远的完全替代品。这样能降低近期切换摩擦，但如果客户继续围绕更大的既有厂商锚定治理，也可能限制钱包份额。耐久性问题因此变成：Veza
              会成为权限真相的记录系统，还是保持为一个增强层，最终被更大平台吸收或模仿。
