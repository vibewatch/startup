        title: 部署模式、信任姿态与可靠性信号
        blocks:
          - type: paragraph
            body: >-
              Veza 的信任故事强于公开可靠性遥测。产品和访问治理页面称，平台使用静态和传输中加密、严格 RBAC、租户隔离、设计上零外部访问、独立渗透测试，并持有 SOC 2 Type I、SOC 2 Type II 和
              ISO 27001 认证。安全白皮书补充称，平台是云原生，并为高可扩展、高可用服务而建；2026 年 Access Agents 发布则称，AI 能力基于 AWS Bedrock，既适用于标准
              SaaS，也适用于专属租户的“Veza Secure SaaS”部署。公开写侧安全控制也有意义：生命周期和 Access AuthZ
              材料披露了试运行、安全限制、版本控制、回滚控制、预测性保护和持续审计日志。这些是治理自动化可信的可靠性信号。但公开记录仍未达到真正基础设施透明。抓取来源没有披露可用性承诺、区域覆盖、灾备架构、事故历史，或连接器级成功
              / 失败指标。结果是，Veza 具备扎实企业信任姿态，但上线后 SRE 质量的公开证据有限。
