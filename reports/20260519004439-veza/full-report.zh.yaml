      - number: '7.3'
        title: 披露、法律、监管与安全透明度风险
        blocks:
          - type: paragraph
            body: >-
              Veza 的公开法律和信任材料显示，公司认真处理隐私、漏洞响应和企业合同问题，但也暴露了真实风险图谱仍有大量未披露。隐私声明称，Veza 按多项美国州隐私制度、GDPR 相关框架以及
              EU-U.S./UK/Swiss Data Privacy Frameworks
              处理个人数据；客户协议则设定漏洞通知义务、成文事件响应计划、保密义务、纽约法律适用、年度预付定价和责任限制。这些是真实控制和真实法律义务，不是空泛的信任中心文案。但这些都不能替代对实际事件历史、诉讼敞口、审计发现或安全事件频率的公开透明度。已获取记录没有浮现公开漏洞复盘、公开诉讼，或对
              Veza 安全声明的详细披露例外；这种缺席应被视为尽调缺口，而不是零事件证明。财务上也有同样的透明度问题。Veza 披露了增长率，而非绝对 ARR 或收入；ServiceNow
              也没有披露收购价格或最终交易经济性。Veza 卖给的买方面临更高的网络治理和披露压力，例如 SEC 2023
              年事件披露框架；因此，公开透明度弱本身就是风险信号：公司可能具有战略价值，但仅凭公开信息，不能像承销一家透明的后期软件发行人那样承销它。
