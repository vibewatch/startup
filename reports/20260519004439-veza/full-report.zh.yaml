      - number: '3.5'
        title: 护城河耐久性、商品化风险与可能击穿逻辑的因素
        blocks:
          - type: paragraph
            body: >-
              Veza 的护城河主张真实存在，但有条件。证据支撑最强的护城河，是通过 Open Authorization API
              及相关社区工具扩展到自定义或不受支持系统，同时讲出一个横跨数据、SaaS、云和非人类身份的平台故事。相比纯工作流中心式治理叙事，这更能回应现代权限蔓延。但有三个明显的逻辑击穿点。第一，既有厂商正迅速围绕同样的“人类、机器和
              AI 身份”平台语言收敛。第二，捆绑厂商可以牺牲利润率换分发，尤其当身份治理已经属于更大套件的一部分。第三，如果客户主要想要审批工作流或 JIT 访问，Opal
              这类更轻工具或既有访问请求模块可能已经足够。Veza 的竞争耐久性因此取决于：企业买方是否真的需要跨系统授权图谱，以及该图谱相较既有替代方案，能否实质缩短部署时间、扩大覆盖或改善修复结果。没有这些真实赢单 /
              输单证据，护城河有吸引力，但并非不可攻破。
