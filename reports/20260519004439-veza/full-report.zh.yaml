      - number: '8.5'
        title: 最终结论、否决触发项与尽调追问
        blocks:
          - type: paragraph
            body: >-
              最终立场很直接：Veza 的战略价值已被证明，但独立估值精度没有。公司显然把估值从 TechCrunch 报道的 2023 年 $415 million 提升到 2025 年官方披露的 $808 million
              Series D；ServiceNow 交易也是强定性验证。但官方交易经济性仍未披露，投资人无法从公开证据判断，这次出售代表的是小幅溢价、大幅溢价，还是接近最后一轮的战略结果。仅这一缺口就足以阻止高信心定价结论。


              实操含义是，尽调必须盯住缺失分母和缺失交易条款。主要投资逻辑破坏项同时也是估值触发项：如果私有 ARR 明显小于假设，如果支付对价接近或低于最后一轮，如果服务密集型部署负担压缩业务质量，或者 ServiceNow
              整合削弱 Veza 独特产品身份，溢价情景就会坍塌。在这些问题解决前，正确建议不是强行给数字，而是锚定最后披露估值，把公开可比公司作为方向性背景，并在为上行付费前要求私有证据。
