      - number: '4.3'
        title: 成本结构、利润率驱动与服务交付
        blocks:
          - type: paragraph
            body: >-
              Veza 看起来像一家低实体资本开支、没有可见库存负担的软件公司，但服务交付层仍然重要。合同要求 Veza 提供托管服务、工作日技术支持、可用性抵扣和专业服务补救。产品与发布材料显示，公司需要持续做连接器、跨
              SCIM 和自定义系统的配置、审计日志，以及触达云、SaaS、本地部署和自建应用的生命周期自动化。客户案例研究进一步说明，实施跨越多个系统和利益相关方；即便产品被营销为比传统 IGA
              更轻，这也会压迫支持和部署投入。反向评论证据方向一致：评论者认可可见性、可审计性和 ROI，但仍称产品昂贵且部署复杂。公开身份安全可比公司显示了可能的经济形态：SailPoint 的 S-1
              同时呈现高订阅毛利率、重销售和市场投入，以及报告口径下的负经营利润率；CyberArk 2025 年业绩则显示强经常性收入结构，加上有意义的维护和专业服务收入。Veza
              或许拥有健康的软件毛利率上限，但实际毛利率和服务占比仍未披露。
