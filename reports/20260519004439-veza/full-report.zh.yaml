              Veza 的客户证明明显不止 logo 墙，尽管多数仍由供应商筛选和呈现。Blackstone 是最具体的头部部署：Veza 客户页称，该公司用 Veza 做访问审查和认证，审查人超过 700 名，已接入应用超过
              60 个；Blackstone 相关新闻材料还显示，该客户后来也成为战略投资方，并在 2025 年继续公开背书 Veza。其他具名参考同样有内容。Snowflake 的 CISO 将 Veza 的 Access
              Graph 描述为优化 RBAC、降低身份风险所需的可见性和行动层。Choice Hotels 将平台用于细粒度 AWS 控制、孤儿用户和孤儿策略清理、审计就绪以及基于 ServiceNow 的整改。Deluxe
              称部署在数周内连上 AWS、GitHub 和 Azure AD，随后扩展到 Slack 和 Jira 工作流以及软件许可清理。Sallie Mae 提到休眠非人类身份减少 96%。Genesys
              披露审查推进速度提升 3 倍、审批速度提升 6 倍。CopperPoint、Barracuda、InComm Payments、Wynn Resorts 和 City of Las Vegas
              则把广度扩展到保险、网络安全、金融科技、酒店和公共部门环境。因此，对一家未上市公司来说，客户背书质量很强：许多来源都有具名高管、运营场景和具体结果。局限在于，几乎所有证明仍来自 Veza
              发布的案例研究，而不是中立采购记录或分析师记录。
