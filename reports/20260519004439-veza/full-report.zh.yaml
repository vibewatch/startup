      - number: '1.5'
        title: 反向信号、任务矛盾与剩余尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              本章最重要的反向信号不是经营困境，而是数据完整性：抓取证据与任务中声称可确认独角兽身份的事件相矛盾。Veza 官方 Series D 公告、Business Wire 新闻稿、SecurityWeek
              报道以及其他独立报道，都支持 2025-04-28 以 $808 million 估值完成融资，而不是 2024 年 10 月以 $2.1 billion
              估值融资。因此，公司最后的独立状态更像是低于独角兽估值的后期公司，随后被收购，而不是报告日仍为私营独角兽。公开评论证据也暴露执行风险：PeerSpot
              评论者认可最小权限和审计收益，但指出成本高、部署复杂和支持不足。尽管增长口径强劲，财务披露仍然薄，抓取到的公开来源没有绝对 ARR、收入、烧钱速度、毛利率或现金跑道。收购披露也只提供部分帮助：ServiceNow
              确认了完成日期和战略理由，但没有披露收购价或交易条款。尽调关键阻塞点是完整股权结构表、董事会构成、精确收购经济性，以及 Veza 最后独立运营期可独立审计的财务报表。
