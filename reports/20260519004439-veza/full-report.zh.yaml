        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据最集中在 Veza 的创始人，以及公司扩张时加入的少数高管。Tarun Thakur 一直被标注为联合创始人兼 CEO，此前曾领导 Datos IO，并更早在 Data Domain 和 IBM
              Research 做产品与研究。Maohua Lu 被标注为联合创始人兼 CTO，Rob Whitcher 则列为联合创始人兼首席架构师。Veza 后续高管任命显示，公司从创始人主导的产品搭建，转向规模化 GTM
              和信任职能：Mike Towers 于 2024 年出任首席安全与信任官，Kane Lightowler 于 2024 年 12 月出任总裁兼 COO，Veza 于 2025 年 3 月宣布由 Ismet
              Geri 负责 EMEA 扩张。治理可见度仍不完整，但两名有来源支撑的董事很关键：Phil Venables 于 2023 年 7 月加入 Veza 董事会；NEA 投资组合页面在 NEA 领投 Series D
              后列出 Aaron Jacobson 为董事。这足以确认投资人参与治理，但不足以还原完整董事会或委员会结构，仍是尽调缺口。
