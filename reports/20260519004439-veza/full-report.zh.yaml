      - number: '8.4'
        title: 情景框架与上行 / 下行平衡
        blocks:
          - type: paragraph
            body: >-
              由于精确 ARR 和收购对价未披露，情景练习只能做有纪律的区间框定，而不是模型级估值。悲观情景假设，2025 年 4 月这一轮已经捕捉了 Veza
              独立高点乐观预期的大部分；如果没有关于规模的私有证明，实施摩擦、不透明定价和捆绑型竞争本会限制任何溢价。这把公允价值推向约 $650 million 到 $800 million。基准情景把最后披露的 $808
              million 估值作为中心锚点，只为战略兴趣给少量溢价，落在约 $800 million 到 $1.0 billion。


              乐观情景需要的不只是叙事。若要在独立基础上支撑类似 $1.0 billion 到 $1.3 billion 的估值，投资人需要私有证据证明，Veza 未披露的绝对 ARR 已经大到足以支撑高溢价身份安全倍数，并且
              ServiceNow 的兴趣不只是战略契合。公开证据确实支持上行的要素：极强增长信号、签约时近 150 家客户，以及战略收购兴趣。但由于缺失分母从未公开，上行应保持有条件，概率加权观点也应贴近最后一个硬披露估值。
