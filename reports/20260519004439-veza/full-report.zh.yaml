  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开描述的 Veza 技术栈：从源系统和定制连接器，到图分析、治理工作流和外部动作平面。
    data:
      layers:
        - id: l1
          label: 身份 / 应用 / 云 / 数据 / AI 源系统
          detail: Okta、Entra、Workday、GitHub、SaaS、数据库、云平台、OpenAI 等上游系统输出授权元数据。
        - id: l2
          label: 原生只读连接器
          detail: 无代理集成摄取有效权限和活动上下文，不需要在目标系统上安装会中断服务的代理。
        - id: l3
          label: OAA / OAA Write 定制连接器层
          detail: 客户自建扩展把未支持或自研应用规范化进 Veza 的通用模型，也能驱动写入路径自动化。
        - id: l4
          label: Access Graph / 通用授权模式
          detail: 基于图的权限层连接身份、组、角色、策略、资源和有效权限。
        - id: l5
          label: 分析 + 搜索层
          detail: Access Search、Access Intelligence、Activity Monitoring 和 Access AI 浮现高风险、休眠或过度访问。
        - id: l6
          label: 治理工作流层
          detail: Access Reviews、Lifecycle Management、Access Requests 和 Access AuthZ 从可见性推进到审查、请求、预配和撤销动作。
        - id: l7
          label: NHI / AI 控制叠加层
          detail: NHI Security、AI Agent Security 和 Access Agents 把同一模型用于机器身份、AI 智能体和工具权限。
        - id: l8
          label: 外部动作 / 审计平面
          detail: REST API、ServiceNow、Jira、Slack、Teams 和审计日志把 Veza 输出接入周边企业工作流。
