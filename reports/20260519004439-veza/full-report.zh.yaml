  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 品类、定位与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Veza 最大的战略风险是：它显然在解决真实问题，却没有占住一个买方必须作为独立控制平面采购的清晰市场品类。公司横跨身份安全、ISPM、下一代 IGA、非人类身份安全、AI
              智能体安全和访问自动化来描述自己。这样的广度有商业吸引力，但也带来定位模糊：有些客户可能把 Veza 看作差异化的授权图谱层，另一些客户可能把它看作可被更大套件吸收的增强模块。竞争背景只会更紧。SailPoint
              现在以更大规模营销面向人、机器和 AI 的自适应身份；CyberArk 用 $1.44 billion ARR 来讲覆盖人、机器和智能体 AI 身份的身份安全；Microsoft 把身份治理打包进 Entra
              Suite；One Identity 仍覆盖经典治理、自助访问和生命周期工作流。因此，Veza
              的品类风险不是问题太小，而是相邻巨头越来越会讲类似故事，并拥有更广分发、更强定价杠杆，以及更有力的长期记录系统主张。尽调真正要问的是，Veza
              以授权为中心的图谱，是否能在部署速度、自定义系统覆盖或整改结果上带来足够实质性的改变，从而避免被当成一个功能，而不是平台。
