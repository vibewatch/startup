      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 估值时间线
        - 公开来源清楚支持估值从 2023 年据报 $415M 上行到 2025 年披露的 $808M 轮次。
        - 这条时间线仍缺少 2024-2026 年绝对 ARR 桥接，也不能证明公开发生过 $2.1B 事件。
        - 提供董事会批准的融资时间线，以及最后独立运营阶段的 KPI 桥接。
      - - 战略重要性
        - ServiceNow 收购 Veza，说明身份安全和 AI 时代访问控制具备真实战略价值。
        - 战略买方兴趣并不披露成交价或支付的溢价。
        - 披露交易对价和任何重大交割调整。
      - - 公开可比公司框架
        - 身份和安全可比公司当前公开区间约为 5x 到 18x。
        - Veza 缺少分母，因此无法把区间换算成精确的 Veza 倍数。
        - 披露 Series D 和签约日附近的绝对 ARR 或收入。
      - - 下行纪律
        - 2025 年 4 月轮次是硬锚，能防止估值滑向传闻。
        - 同行评论和定价不透明提示执行与变现摩擦，可能压住溢价倍数。
        - 展示部署效率、服务负担、续约质量和已实现定价权。
      - - 退出验证
        - 收购和交割日期确认公司达成了真实战略结果。
        - 官方条款仍未披露，因此不能把退出视为数字证明点。
        - 提供合并摘要、支付组合和瀑布分析。
    notes: 投资逻辑和反向逻辑刻意保持价格敏感。每行都指出哪些缺失证据真正会改变估值判断，而不是重复一般产品优势。
