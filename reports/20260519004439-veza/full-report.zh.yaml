      - number: '6.3'
        title: 成果、ROI 信号与落地现实
        blocks:
          - type: paragraph
            body: >-
              客户证据最强的地方在合规、最小权限和运营可见性。客户总览页强调，5K+ 项权限的活动启动不到 30 分钟，孤儿云资源清理带来每年 $1 million 节省，访问认证速度提升
              86%。这些总括说法也被单个案例用更具体的运营细节呼应。Genesys 称，现在一名工程师可在五天内搭好访问审查，过去需要三名工程师花三到四周；审批人可在 30
              分钟内完成，过去最长需要八小时。CopperPoint 称，以前耗时数周的季度电子表格审查已实现自动化，AWS 在不到一周内接入，Guidewire 也通过 OAA 在数周内完成集成。Deluxe 把 Veza
              同时连到安全和成本结果：识别闲置许可，并把告警接入 Jira 和 Slack。InComm 强调跨 SharePoint 和 AWS
              的影响半径分析和角色映射。公共部门和酒店业参考也更偏合规，而不是靠席位扩张驱动。与此同时，独立来源让本章不能只看公司叙事。AWS Marketplace 和 PeerSpot
              评论者都认可最小权限、审计和映射收益，但也指出价格高、设置复杂、支持可能不稳定，且某次部署缺少执行工具。正确解读是，Veza 可在异构环境中交付真实 ROI，但实施负担本身就是产品故事的一部分，不是例外。
