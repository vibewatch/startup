      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              关键区别在于收入质量和披露质量。收入质量方向上不错：合同支持按年预付的企业订阅，产品组合允许围绕身份、集成和模块增购，蓝筹客户验证了大规模部署意愿，管理层的扩张指标指向先落地再扩张，而不是一次性服务依赖。弱点在披露质量。公开来源从未揭示绝对收入、毛利率、Series
              D 后现金或收购对价，因此无法像承销透明后期软件发行人那样，仅凭公开证据承销 Veza。公司更像一个具备可信需求和可信融资渠道、战略上重要的身份安全资产，但独立利润率路径和资本效率画像在 ServiceNow
              终结独立故事前从未被公开证明。因此，正确的财务建议是有条件的：尊重经常性收入信号，但在管理层开放账本之前，把每一个硬承销结论都视为暂定。
