summary:
  headline: >-
    Veza 做出了一套差异化的授权中心型身份安全资产，也拿到了可信的企业采用证据；但公开记录只停在 2025 年 4 月 $808M 的独立估值，以及交易条款未披露的被收购状态。应把 Veza
    视作已经完成战略退出的案例，而不是仍可投资的独立独角兽；若要给高于最后公开标记的溢价，必须先看到私下 ARR 和交易条款披露。
