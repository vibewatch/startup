companyProfile:
  summary: >-
    Veza was founded in 2020 by Tarun Thakur, Maohua Lu, and Rob Whitcher to build an
    authorization-centric identity security platform for hybrid and multi-cloud
    environments. The public funding chronology supports more than $110M raised at
    stealth in 2022, a 2023 strategic financing that TechCrunch reported at a $415M
    valuation, and a $108M Series D led by NEA on 2025-04-28 at an $808M valuation,
    bringing total disclosed equity funding to $235M. By signing, ServiceNow said Veza
    served nearly 150 global enterprise customers and had 230 employees, then updated
    its newsroom release to state the acquisition closed on 2026-03-02. Public purchase
    price remains undisclosed, so Veza should be framed as an acquired strategic asset,
    not a current standalone unicorn.
  foundedDate: "2020-01-01"
  founders:
    - name: Tarun Thakur
      role: Co-founder and CEO
      background: Former Datos IO co-founder and CEO; previously held product and research roles at Data Domain and IBM Research.
      claimRefs: [CO002, CO044]
    - name: Maohua Lu
      role: Co-founder and CTO
      background: Technical co-founder and architecture leader for Veza's authorization-centric platform.
      claimRefs: [CO003]
    - name: Rob Whitcher
      role: Co-founder and Chief Architect
      background: Founding architect behind Veza's authorization-centric platform positioning.
      claimRefs: [CO003]
  foundingLocation: Bay Area, California, USA
  headquarters: Los Gatos, CA, USA (ServiceNow disclosure; earlier Veza releases used Palo Alto and Redwood Shores datelines)
  productSummary: >-
    Veza's Access Platform is built around the Access Graph and broad agentless,
    read-only connectors that map users, groups, roles, policies, applications,
    systems, and data into effective permissions. The platform spans ISPM-style
    visibility and intelligence, access reviews, lifecycle management, access
    requests, Access AuthZ, NHI security, Access AI, and AI-agent security, with OAA
    as the clearest technical differentiator for custom or otherwise unsupported
    systems.
  customerFocus: >-
    Large, heterogeneous enterprises with complex entitlement sprawl across cloud,
    SaaS, data, and custom applications. Public proof is strongest in regulated or
    operationally complex buyers across banking, hospitality, FMCG, financial
    services, healthcare, pharma, life sciences, retail, and large technology
    environments; typical executive sponsors are CISOs, IAM leaders, CIO/SVP IT, and
    platform-security leaders.
  businessModel: >-
    Quote-led enterprise B2B SaaS sold through order forms priced around active
    identities, integrations, products, and expansion modules, with annual upfront
    billing as the default. Revenue can expand through lifecycle, reviews, NHI,
    Access AuthZ, and professional-services / support attach, but realized pricing,
    ACV, and revenue mix were never publicly disclosed.
  stage: Acquired (ServiceNow announced 2025-12-02; close disclosed as 2026-03-02)
  fundingStatus: >-
    Public financing history supports more than $110M raised at stealth in 2022, a
    2023 strategic round that brought total financing to $125M and was reported by
    TechCrunch at a $415M valuation, and a $108M Series D led by NEA on 2025-04-28 at
    an $808M valuation. Total disclosed equity funding reached $235M before ServiceNow
    announced the acquisition on 2025-12-02 and later stated the transaction closed on
    2026-03-02. Official purchase price and consideration mix have not been disclosed.
