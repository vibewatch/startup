company:
  name: Veza
chapter:
  number: 1
  title: Company Overview
  summary: Veza was founded in 2020 by Tarun Thakur, Maohua Lu, and Rob Whitcher to build an authorization-centric identity security platform for hybrid and multi-cloud environments. Public evidence supports more than $110 million raised at stealth in 2022, a $15 million strategic round in 2023, and a $108 million Series D led by NEA on 2025-04-28 at an $808 million valuation—contradicting the prompt's claimed $2.1 billion October 2024 event. By late 2025 Veza disclosed 190+ employees, 20B+ permissions managed, 250+ integrations, and nearly 150 enterprise customers before ServiceNow announced, and later closed, an acquisition of the company.
sections:
- id: identity-stage-and-business-model
  title: Identity, Stage, Headquarters, and Business Model
  body: Veza presents itself as an identity security platform built around authorization and permissions visibility rather than legacy directory-centric identity tooling. Its company and product pages frame the core question as who can take what action on what data or resource, with the Access Graph unifying identities, permissions, and resources across cloud, SaaS, data, and custom applications. The founding story on Veza's company and culture pages places the origin in 2020, when Tarun Thakur, Maohua Lu, and Rob Whitcher identified authorization as the missing layer in securing cloud data. Official acquirer materials later described Veza as headquartered in Los Gatos, California, while Veza's own press releases use Palo Alto and Redwood Shores datelines, so the sourced record supports a Bay Area headquarters with some location ambiguity. As a standalone company, Veza monetized enterprise identity security software for visibility, governance, access reviews, lifecycle control, and non-human
    identity security; by March 2026, however, Veza was no longer an independent private company because ServiceNow disclosed that the acquisition had closed.
  claimRefs:
