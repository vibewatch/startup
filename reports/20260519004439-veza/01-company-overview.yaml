- id: adverse-signals-and-diligence-blockers
  title: Adverse Signals, Prompt Contradictions, and Remaining Diligence Blockers
  body: 'The most important adverse signal in this chapter is not operational distress, but data integrity: the fetched evidence contradicts the prompt''s asserted unicorn-confirming event. Veza''s official Series D announcement, Business Wire release, SecurityWeek coverage, and other independent reporting all support a 2025-04-28 round at an $808 million valuation, not an October 2024 round at $2.1 billion. The company''s final standalone status therefore looks sub-unicorn, late-stage, and then acquired rather than a private unicorn at report date. Public review evidence also surfaces execution risk: PeerSpot reviewers praise least-privilege and auditing benefits but flag high cost, complex setup, and support shortcomings. Financial disclosure remains thin despite strong growth messaging, with no absolute ARR, revenue, burn, gross margin, or cash runway in fetched public sources. Acquisition disclosure is only partly helpful: ServiceNow confirmed the close date and strategic rationale but
    did not disclose purchase price or transaction terms. For diligence, the key blockers are the full cap table, board composition, exact acquisition economics, and independently auditable financial statements for Veza''s final standalone period.'
  claimRefs:
