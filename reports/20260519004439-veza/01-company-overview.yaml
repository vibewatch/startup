callouts:
- calloutType: strength
  title: Authorization-first positioning remained distinct through the standalone period
  body: Veza consistently differentiated on permissions visibility and authorization modeling rather than only classic directory, role, or workflow management. The Access Graph and Open Authorization API gave the company a credible way to govern custom apps, data systems, and machine identities that many older IGA narratives handled less directly.
  claimRefs:
  - CO031
  - CO032
  - CO042
  - CO048
- calloutType: strength
  title: Customer proof was unusually concrete for a private security vendor
  body: Named references such as Blackstone, Snowflake, Choice Hotels, Wynn Resorts, and Deluxe provided better public proof than many private cybersecurity peers. The Blackstone 700-reviewer and 60-application disclosure is especially useful because it moves beyond logo marketing into deployment scale.
  claimRefs:
  - CO025
  - CO033
  - CO034
  - CO035
  - CO036
  - CO037
- calloutType: risk
  title: The unicorn-qualification premise is not supported by fetched direct evidence
  body: The official Series D materials and corroborating independent sources support an April 2025 $108M round at an $808M valuation. They do not support the prompt’s stated October 2024 $2.1B post-money event, so any investment framing must start from a sub-unicorn standalone valuation and a subsequent M&A outcome.
  claimRefs:
  - CO017
  - CO020
  - CO030
- calloutType: risk
  title: Financial transparency remained limited even after rapid growth claims
  body: Veza disclosed strong momentum signals—ARR more than doubled, NRR near 150%, and hundreds of integrations—but never disclosed absolute ARR, revenue, burn, or gross margin in the fetched public record. That limits any attempt to underwrite standalone financial quality from public information alone.
