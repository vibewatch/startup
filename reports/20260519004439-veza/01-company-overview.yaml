- id: funding-history-and-investor-base
  title: Funding History, Valuation, and Investor Base
  body: Veza's capital story is unusually important because the sourced record directly contradicts the user's qualification premise. The company emerged from stealth on 2022-04-27 with more than $110 million in backing from Accel, Bain Capital, Ballistic Ventures, GV, Norwest, True Ventures, and security-industry angels. In June 2022 Blackstone became both a customer and a strategic Series C investor, but the public materials fetched here do not disclose the round's exact size. In August 2023 Veza announced strategic investments from Capital One Ventures and ServiceNow Ventures, taking total financing to $125 million; TechCrunch separately reported that transaction as a $15 million round at a $415 million valuation. The decisive standalone financing event came on 2025-04-28, when Veza officially announced a $108 million Series D led by NEA at an $808 million valuation, with new participation from Atlassian Ventures, Workday Ventures, and Snowflake Ventures and continued backing from Accel,
    GV, True Ventures, Norwest, Ballistic Ventures, J.P. Morgan, and Blackstone. Those official and independent sources support total equity raised of $235 million and do not support an October 2024 $2.1 billion post-money event.
  claimRefs:
