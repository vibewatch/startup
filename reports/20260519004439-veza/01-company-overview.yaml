  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: acquisition-terms
    missingEvidence: Official purchase price, payment mix, rollover equity, and post-close retention terms for the ServiceNow transaction.
    whyItMatters: Without transaction economics, investors cannot compare the final M&A outcome with Veza’s last disclosed standalone valuation or assess proceeds allocation across preferred and common holders.
    diligencePath: Request the merger agreement, board consent package, and transaction waterfall from the seller or acquirer.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Absolute ARR, revenue, gross margin, burn, runway, and audited historical financial statements for Veza’s final standalone period.
    whyItMatters: Public growth claims are directionally strong but insufficient for underwriting revenue quality, capital efficiency, or whether the sale occurred from strength or financing necessity.
    diligencePath: Obtain standalone management accounts, audited statements, and board materials covering 2024 through close.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: A complete public board roster, committee structure, and governance map beyond Phil Venables and Aaron Jacobson.
    whyItMatters: Board composition affects oversight quality, investor rights, and how much strategic influence late investors or acquirer-linked investors had before exit.
    diligencePath: Request cap-table governance schedules, board observer lists, and corporate governance materials.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: A single authoritative headquarters record that reconciles Los Gatos wording with Palo Alto and Redwood Shores datelines.
    whyItMatters: Headquarters ambiguity is not thesis-breaking, but it complicates exact legal-entity, office-footprint, and talent-location analysis for operating due diligence.
    diligencePath: Confirm the registered principal office and major operating offices from legal-entity records or company counsel.
    relatedQuestionRefs:
    - QO003
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: milestone-coverage
    missingEvidence: A complete internally validated chronology of product releases, customer deployments, and board-level decisions beyond the public press record.
    whyItMatters: The public milestone table captures only externally announced events, which is sufficient for narrative grounding but not for a full operational reconstruction of Veza’s standalone history.
    diligencePath: Request a board-approved company timeline or internal launch and financing chronology from management.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO004
