- id: customer-verdict
  title: Customer Verdict
  body: 'Veza''s customer chapter is a net positive. The company has unusually credible production proof for a private identity-security vendor: not just big logos, but named executives, deployment descriptions, workflow details, and multiple quantified outcomes across financial services, hospitality, media, insurance, fintech, cybersecurity, enterprise software, and public sector accounts. Buyer fit is clear, and the available NRR signals are exactly what a strong enterprise land-and-expand motion should look like. The reservations are equally clear. Most references are still authored or hosted by Veza, independent review surfaces warn that the platform is costly and complex to stand up, and core underwriting questions around churn, contract structure, and concentration remain unanswered publicly. The correct verdict is therefore strong customer proof with moderate disclosure risk: enough evidence to believe Veza had real enterprise adoption and expansion potential, but not enough to rule
    out concentration or renewal fragility without access to cohort, contract, and top-account data.'
