- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Evidence
  - Concentration / retention risk
  - Impact
  - Diligence path
  rows:
  - - Visibility into access becomes review automation
    - Blackstone, Barracuda, Genesys, and CopperPoint all use Veza in access-review workflows
    - Review-heavy accounts can still churn if attestation ROI is not durable
    - Strong expansion wedge from first visibility use case into governance workflows
    - Request module attach and multi-year expansion by customer cohort
  - - Broader app and custom-system coverage
    - CopperPoint used OAA for Guidewire; Barracuda used OAA for homegrown apps; Deluxe connected multiple enterprise systems
    - Custom integrations can increase services burden and customer-specific dependency
    - Higher wallet share but potentially higher cost to serve
    - Request connector mix, custom-integration effort, and deployment margin by account
  - - Workflow / remediation integration
    - Choice Hotels used ServiceNow alerts; Deluxe used Jira and Slack; InComm uses incident-response workflows
    - Dependence on surrounding workflow stack may slow or complicate rollouts
    - Deeper embedding can improve stickiness once installed
    - Request attach rates for ServiceNow, Jira, Slack, and other downstream actions
  - - Expansion to more teams and more apps
    - Choice Hotels explicitly said it planned to extend Veza to additional teams and applications
    - Public sources do not show whether these expansions converted into upsell ARR
    - Good qualitative land-and-expand signal
    - Request account expansion history for top 20 customers
  - - Marquee references as strategic multipliers
    - Blackstone and Workday were cited as both customers and investors / strategic supporters
    - Strategic accounts may mask concentration if a few logos account for disproportionate ARR
    - Strong sales credibility but possible reference-account dependence
    - Request revenue concentration, board influence, and reference-account economics
  - - Vertical mix
    - ServiceNow disclosed banking, hospitality, and FMCG; Veza also cited healthcare, pharma, life sciences, retail, and big-tech
    - Mix is still too broad and high-level to measure concentration
    - Suggests broad relevance but weak concentration transparency
    - Request customer count and ARR by vertical, geography, and segment
  - - Churn and renewal transparency
    - No public GRR, churn, contract term, or renewal cohort data
    - Concentration risk cannot be stress-tested from public evidence
    - Biggest diligence blocker in the customer chapter
    - Request churn bridge, renewal calendar, and top-account contract schedules
  notes: Expansion evidence is good and concentration disclosure is weak. The chapter therefore supports a positive adoption thesis but only a provisional durability thesis.
