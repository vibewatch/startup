chapter:
  number: 6
  title: Customers
  summary: 'Veza has stronger public customer proof than many private security vendors: ServiceNow said the company served nearly 150 global enterprise customers and had 230 employees at signing, while official case studies and customer pages name deployments at Blackstone, Snowflake, Sallie Mae, Choice Hotels, Deluxe, Genesys, CopperPoint, InComm Payments, Wynn Resorts, the City of Las Vegas, and Barracuda. The evidence points to a large-enterprise, security-led buying motion centered on CISO, IAM, platform, and compliance teams, with credible land-and-expand signals from access visibility into reviews, remediation, and broader app coverage. The main caveat is that retention, churn, and customer concentration remain only partly disclosed, and independent reviews still describe the product as expensive and integration-heavy.'
sections:
- id: customer-base-segmentation-and-buyer-map
  title: Customer Base Segmentation, Buyer, User, and Payer Map
  body: 'Public customer evidence puts Veza squarely in a complex-enterprise, security-led market rather than a broad self-serve or SMB segment. The most current hard count comes from ServiceNow''s December 2025 acquisition announcement, which said Veza served nearly 150 global enterprise customers across banking, hospitality, and fast-moving consumer goods and had 230 employees globally at signing. Earlier signals are directionally consistent: TechCrunch reported more than 100 customers by August 2023 and said the client portfolio had more than tripled since stealth, while Veza''s December 2024 COO announcement said customer acquisition spanned financial services, healthcare, pharma, life sciences, retail, and big-tech. The named case studies reinforce the same pattern: Blackstone, Sallie Mae, CopperPoint, Barracuda, InComm Payments, Choice Hotels, Deluxe, Wynn Resorts, Snowflake, and the City of Las Vegas are all organizations with regulated data, multi-system estates, or operational complexity.
    Buyer evidence is also unusually clear. Executive sponsors are typically CISOs, CSOs, vice presidents of cybersecurity, SVP IT / CIO, platform-engineering leads, or IAM leaders; day-to-day users include security, audit, compliance, infrastructure, app owners, and engineering teams. Public sources do not spell out budget lines, but the combination of buyer titles, compliance use cases, and enterprise implementation scope strongly suggests payment comes from security, IAM, or broader IT transformation budgets rather than line-of-business spend.'
