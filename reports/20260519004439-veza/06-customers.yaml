- id: named-deployment-proof-and-reference-quality
  title: Named Deployment Proof, Production Evidence, and Reference Quality
  body: 'Veza''s customer proof goes materially beyond a logo wall, although it is still mostly vendor-curated. Blackstone is the most concrete marquee deployment: Veza''s customer page says the firm used Veza for access reviews and certifications with more than 700 reviewers and more than 60 onboarded applications, while Blackstone-related press materials show the account also became a strategic investor and continued to endorse Veza publicly in 2025. Other named references are also substantive. Snowflake''s CISO described Veza''s Access Graph as the visibility and actionability layer needed to optimize RBAC and reduce identity-based risk. Choice Hotels tied the platform to fine-grained AWS controls, orphaned-user and orphaned-policy cleanup, audit readiness, and ServiceNow-based remediation. Deluxe said deployment connected AWS, GitHub, and Azure AD in weeks, then expanded into Slack and Jira workflows and software-license cleanup. Sallie Mae cited a 96% reduction in dormant non-human
    identities. Genesys published 3x faster review facilitation and 6x faster approvals. CopperPoint, Barracuda, InComm Payments, Wynn Resorts, and the City of Las Vegas add breadth across insurance, cybersecurity, fintech, hospitality, and public sector environments. The reference-quality read is therefore strong for a private company: many sources include named executives, operational context, and concrete outcomes. The limitation is that almost all of that proof still comes from Veza-published case studies rather than neutral procurement or analyst records.'
