  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 customer ARR, customer count by ACV band, and revenue mix by vertical or geography.
    whyItMatters: The public customer story is strong enough to support adoption, but not strong enough to rule out concentration risk or dependence on a small number of marquee accounts.
    diligencePath: Request ARR concentration by customer, customer counts by ACV bucket, and signed revenue by vertical / geography for the last three fiscal years.
    relatedQuestionRefs:
    - QU021
    - QU025
    - QU026
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Gross revenue retention, logo churn, renewal rates, contract length, and customer cohort schedules by segment.
    whyItMatters: NRR alone does not reveal whether expansion is masking meaningful churn or whether renewals are broadly healthy across the installed base.
    diligencePath: Request churn bridge, GRR / NRR by cohort, renewal calendar, and contract-term distribution for top cohorts and for the overall base.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU026
    relatedTableRefs:
    - TU004
  - type: independence-gap
    severity: moderate
    topic: reference-quality
    missingEvidence: Independent deployment evidence such as procurement records, neutral implementation studies, or third-party customer talks for more of the named references.
    whyItMatters: Most of the strongest customer proofs are published by Veza itself, which is directionally useful but not the same as independent verification.
    diligencePath: Request live reference calls across at least one new logo, one expansion account, and one difficult implementation; supplement with partner or analyst validation where available.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: moderate
    topic: implementation-economics
    missingEvidence: Median deployment time, services attach, implementation cost, and post-sale support load by customer segment.
    whyItMatters: Public case studies show both fast time-to-value and real integration burden, so margin quality and customer satisfaction depend on the unseen implementation economics.
    diligencePath: Request implementation scorecards, professional-services bookings, support ticket volume, and time-to-value by segment and product module.
    relatedQuestionRefs:
    - QU017
    - QU022
    - QU023
    relatedTableRefs:
    - TU003
    - TU005
