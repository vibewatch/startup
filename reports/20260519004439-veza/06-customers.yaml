      detail: Audit pressure, least-privilege gaps, orphaned users, or poor cloud/data visibility create the buying event.
      tone: risk
    - label: Connect core systems
      detail: Customers start with AWS, Azure AD, GitHub, SharePoint, Guidewire, Snowflake, or other critical identity and data systems.
      tone: neutral
    - label: Visualize effective permissions
      detail: Access Graph and related analytics establish who can do what across humans, machines, and resources.
      tone: positive
    - label: Run reviews and cleanup
      detail: Access reviews, orphan cleanup, role rationalization, and audit evidence become the first operational win.
      tone: positive
    - label: Wire remediation workflows
      detail: ServiceNow, Jira, Slack, and other downstream systems turn findings into action and evidence.
      tone: positive
    - label: Expand to more apps and teams
      detail: Accounts then broaden into more systems, more reviewers, and more business units if the first rollout proves ROI.
      tone: positive
