- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration
  body: Public durability signals are positive but incomplete. Veza's December 2024 COO announcement said enterprise net revenue retention exceeded 120%, and the April 2025 Series D announcement said enterprise NRR was nearing 150% while ARR had more than doubled year over year. Those are strong land-and-expand proxies for an enterprise software company, especially when combined with customer stories that show broader app coverage, cross-functional workflow integration, and deeper remediation use. Choice Hotels explicitly said it planned to extend Veza to more teams and more applications; Deluxe and InComm embedded the product into adjacent systems and processes; Blackstone evolved from early customer into investor and public reference. But public customer transparency stops well short of what an investor would want for concentration analysis. No fetched source discloses churn, gross revenue retention, renewal rates, average contract length, ACV distribution, top-customer revenue share,
    or vertical and geographic mix beyond high-level category labels. ServiceNow's signing disclosure narrows current exposure to banking, hospitality, and FMCG, and Veza's 2024 GTM announcement adds financial services, healthcare, pharma, life sciences, retail, and big-tech, but neither source provides a denominator. That means the expansion thesis is well supported, while the concentration thesis remains mostly a diligence gap.
