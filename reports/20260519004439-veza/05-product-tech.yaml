- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain
  - Veza solution
  - Measurable benefit / evidence
  - Limitation
  rows:
  - - Understand who can access what
    - Permissions are fragmented across SaaS, cloud, data, and on-prem systems
    - Access Graph + Search / Intelligence unify effective permissions
    - Official pages and reviews consistently say Veza improves visibility and least-privilege analysis
    - Benefit is directionally clear, but public benchmark data is sparse
  - - Run access certifications
    - Manual or rubber-stamped reviews lack context and prioritization
    - Access Reviews adds risk-based campaigns, reviewer context, and automation
    - Veza publicly emphasizes faster campaign creation and risk-first review flows
    - Independent throughput and approval-quality metrics are not public
  - - Provision / deprovision users safely
    - Legacy IGA workflows are slow, brittle, and hard to extend
    - Lifecycle Management plus Access AuthZ automate write actions through SCIM, native connectors, and OAA Write
    - Official materials emphasize dry run, rollback, and lower mean time to provision
    - Need independent proof across large heterogeneous environments
  - - Handle JIT and self-service access requests
    - Users and managers struggle to identify the least-privileged entitlement quickly
    - Access Requests + Access Hub curate requests, approvals, and JIT access
    - Veza claims better productivity and less privilege creep from permissions-aware requests
    - Public sources do not disclose request-cycle times or catalog coverage
  - - Govern custom and homegrown apps
    - Unsupported systems fall outside native connector catalogs
    - OAA / OAA Write let customers model custom apps for read and write workflows
    - Developer docs, GitHub repos, and a PyPI SDK show a real self-service extension path
    - Still depends on customer engineering effort and source-system API quality
  - - Secure machine and AI identities
    - NHIs and AI agents create new blind spots and ownership gaps
    - NHI Security, AI Agent Security, and Access Agents extend the same governance model to machines and agents
    - Official materials show a coherent product direction from discovery to blast-radius mapping
    - Independent validation for these newer surfaces remains thin
  notes: Benefits are evidence-backed but often directional. Public sources are strongest on workflow shape, not on quantified ROI across every
    module.
