- id: deployment-trust-and-operating-model
  title: Deployment Model, Trust Posture, and Reliability Signals
  body: 'Veza''s trust story is stronger than its public reliability telemetry. The product and access-governance pages say the platform uses
    encryption at rest and in flight, strict RBAC, tenant isolation, zero external access by design, independent penetration testing, and holds
    SOC 2 Type I, SOC 2 Type II, and ISO 27001 certifications. The security whitepaper adds that the platform is cloud native and built for highly
    scalable and available services, while the 2026 Access Agents release says AI capabilities are built on AWS Bedrock and work across both standard
    SaaS and a dedicated-tenant “Veza Secure SaaS” deployment. Public write-side safety controls are also meaningful: lifecycle and Access AuthZ
    materials disclose dry runs, safety limits, versioning, rollback controls, predictive safeguards, and continuous audit logging. Those are
    credible reliability signals for governance automation. But the public record still stops short of true infrastructure transparency. No fetched
    source disclosed uptime commitments, region footprint, DR architecture, incident history, or connector-level success/failure metrics. The
    result is a solid enterprise trust posture, paired with limited public evidence about day-two SRE quality.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  tableRefs:
  - TE004
- id: ai-nhi-and-automation-expansion
  title: AI, NHI, and Automation Expansion
  body: From 2024 through early 2026, Veza expanded quickly beyond classic access visibility. Access AI introduced natural-language querying,
    risk prioritization, role recommendations, and remediation/ticketing assistance. NHI Security extended the platform into service accounts,
    keys, secrets, workloads, and ownership hygiene. Access AuthZ then pushed the platform from governance into last-mile provisioning and deprovisioning
    across cloud, SaaS, on-prem, and custom apps through SCIM, native connectors, and OAA Write. By late 2025 and early 2026, AI Agent Security
    and Access Agents extended the same model into agentic AI, MCP servers, tool permissions, blast-radius mapping, and conversational/automated
    identity operations. This release cadence supports a genuine “platform broadening” story rather than a static point product. Still, the evidence
    quality is mixed. The chronology is real and directly sourced, but independent proof for newer AI and automation claims is thin. There are
    no public accuracy metrics, false-positive rates, or customer-scale benchmarks showing that Access AI, AI Agent Security, or Access Agents
    outperform peers in production. Public maturity therefore looks strong on direction and feature breadth, but only moderate on third-party
    validation.
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE036
  - CE038
