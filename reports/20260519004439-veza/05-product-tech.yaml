  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture-internals
    missingEvidence: Detailed public architecture for the Access Graph implementation, regional deployment topology, disaster recovery design,
      and connector execution model.
    whyItMatters: Without deeper systems detail, it is hard to judge scalability, failure domains, and operational resilience beyond high-level
      marketing language.
    diligencePath: Request architecture review materials, SRE runbooks, region maps, and reliability design docs from product/security engineering.
    relatedQuestionRefs:
    - QE003
    - QE021
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: scale-benchmarks
    missingEvidence: Benchmark data on entitlement-graph size, query latency, scan duration, API failure handling, and reconciliation success
      across the largest customer deployments.
    whyItMatters: The core product promise depends on operating at very large enterprise scale; public sources do not show where performance or
      connector quality starts to degrade.
    diligencePath: Request customer-scale benchmark decks, production telemetry snapshots, and reference calls focused on very large environments.
    relatedQuestionRefs:
    - QE005
    - QE021
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: implementation-proof
    missingEvidence: Independent data on median time-to-value, services effort, migration burden from incumbent IGA, and the share of deployments
      that require customer-built OAA connectors.
    whyItMatters: The public evidence supports strategic fit but not the real implementation cost curve, which is central to product maturity
      and buyer ROI.
    diligencePath: Collect implementation scorecards, services statements of work, migration case studies, and win-loss notes from recent enterprise
      deployments.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Module-level adoption, customer count, and attach-rate data for newer surfaces such as NHI Security, Access AuthZ, AI Agent
      Security, and Access Agents.
    whyItMatters: Feature launches alone do not prove that the newer platform layers are mature, commercially relevant, or deeply used in production.
    diligencePath: Request product telemetry, module adoption dashboards, and reference customers using the newer AI and automation products in
      production.
    relatedQuestionRefs:
    - QE022
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: ai-evaluation
    missingEvidence: Independent precision, recall, reviewer-override, or hallucination-control data for Access AI and Access Agents.
    whyItMatters: AI features can sound compelling in launch materials while still creating analyst noise or risky automation behavior in practice.
    diligencePath: Request customer outcome studies, model evaluation summaries, and human-in-the-loop governance metrics for Veza’s AI-assisted
      products.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE001
