- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Access Graph + Access Search / Intelligence / Monitoring
    - IAM, security, governance teams
    - Core / mature
    - Authorization-first graph across humans, machines, data, and apps with 500+ pre-built queries
    - No public benchmark on graph scale, scan cadence, or query latency
  - - Access Reviews
    - Review owners, IAM admins, auditors
    - Core / mature
    - Risk-prioritized campaigns and reviewer context built on permissions data
    - Need reviewer productivity metrics and false-positive rates beyond launch copy
  - - Lifecycle Management
    - IAM operations, platform engineering
    - Core / mature
    - Joiner-mover-leaver automation plus dry runs, safety limits, OAA Write, and custom REST actions
    - Need independent proof of deployment time and failure/retry rates
  - - Access Requests + Access Hub
    - Managers, employees, IAM teams
    - Growth / established
    - Least-privilege request catalog, JIT access, and manager-facing visibility
    - Need adoption data, request-fulfillment times, and end-user satisfaction evidence
  - - Access AuthZ
    - IAM operations, ITSM, SOAR, app owners
    - Newer / expanding
    - Last-mile automation engine unifying reviews, requests, lifecycle, and custom-app provisioning
    - Need production customer count and proof that “lightweight” holds in complex estates
  - - NHI Security
    - Security engineering, cloud/platform teams
    - Newer / expanding
    - Purpose-built visibility, ownership, and hygiene controls for machine identities, keys, and secrets
    - Need evidence on depth versus dedicated machine-identity competitors
  - - Access AI
    - Security analysts, reviewers, IAM teams
    - Newer / expanding
    - Natural-language exploration and remediation guidance across permissions data
    - Need accuracy, recall, and reviewer-assist quality metrics
  - - AI Agent Security + Access Agents
    - Security, AI platform, identity teams
    - Emerging / early access to GA path
    - Brings identity governance to agents, MCP tools, and AI blast-radius mapping on top of the Access Graph
    - Need broader customer proof, benchmarked outcomes, and clear boundaries between analytics and autonomous action
  notes: Rows reflect publicly named modules and platform features. “Mature” means repeatedly documented across official pages; it does not imply
    independently audited feature depth.
