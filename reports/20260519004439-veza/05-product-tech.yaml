callouts:
- calloutType: strength
  title: OAA + Access Graph is Veza’s strongest public technical wedge
  body: The clearest evidence-backed differentiation is not generic IGA workflowing but the ability to extend Veza into unsupported or homegrown
    systems through OAA, then pull those systems into the same graph, search, review, and lifecycle framework as native integrations.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE038
- calloutType: risk
  title: Implementation burden is real even if the platform is modern
  body: Read-only agentless ingestion lowers some deployment friction, but the product still becomes most valuable only after many systems are
    connected and workflows are wired into surrounding tools. Independent reviews consistently describe setup as complex and costly.
  claimRefs:
  - CE023
  - CE033
  - CE037
  - CE041
- calloutType: recommendation
  title: Best fit is a complex enterprise that needs custom-system governance, not a lightweight SMB tool
  body: Veza looks strongest where buyers need broad visibility, custom-app coverage, and coordinated governance across humans, machines, and
    AI. Buyers seeking a quick, low-integration, low-cost deployment should treat the public evidence more cautiously.
  claimRefs:
  - CE032
  - CE033
  - CE038
  - CE040
  - CE041
