chapter:
  number: 5
  title: Product & Technology
  summary: Veza's public product record supports a broad, authorization-centric identity security platform built around the Access Graph, with
    mature visibility/governance modules and an unusually explicit extensibility layer in the Open Authorization API. Official sources show strong
    breadth across access reviews, lifecycle, requests, NHI, AI-agent security, and later Access AuthZ, plus a real developer surface through
    docs, SDKs, and GitHub examples; third-party reviews, however, still point to high cost, integration-heavy setup, and only partial independent
    proof for newer AI and automation claims.
sections:
- id: product-definition-and-module-map
  title: Product Definition, Module Breadth, and Workflow Coverage
  body: 'Veza''s public positioning is consistent across its product, access-governance, and later ServiceNow materials: this is an authorization-centric
    access platform, not just a narrow certification tool. The product page groups the platform into three big planes — ISPM-style visibility
    and intelligence, IGA workflows, and non-human / AI identity security — then adds platform features such as the Access Graph, Access AI, Access
    Hub, APIs, and integrations. That matters because it means the buyer workflow starts with understanding who has access to what across many
    systems, but the commercial story extends into reviews, lifecycle actions, requests, and, by late 2025, Access AuthZ for last-mile enforcement.
    Public module evidence is direct for Access Reviews, Lifecycle Management, Access Requests, NHI Security, Access AI, AI Agent Security, and
    Access Agents; Access AuthZ is newer but clearly framed as part of the same platform. The breadth is impressive, but module depth is uneven:
    visibility and review functions are repeatedly described across multiple pages, while some newer AI and automation surfaces still rely more
    on launch copy than on independent operational proof.'
