- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Native agentless connectors
    - Read identity and authorization metadata from cloud, SaaS, data, on-prem, and AI systems
    - Provider APIs and permissions models
    - API changes, rate limits, or missing source data can degrade coverage
  - - Open Authorization API (OAA)
    - Normalize unsupported or custom systems into Veza’s universal schema
    - Customer engineering + custom-app APIs
    - Extensibility is powerful but can shift implementation work to the customer
  - - OAA Write / native write connectors
    - Push provisioning and deprovisioning actions into target systems
    - SCIM, OAuth2, native APIs, and custom REST endpoints
    - Write-path quality is harder to prove publicly than read-only discovery
  - - Access Graph / universal authorization model
    - Traverse identities, groups, roles, policies, resources, and effective permissions
    - Veza internal graph implementation
    - Underlying graph store, performance envelope, and fault tolerance are not publicly described
  - - Analytics and orchestration layer
    - Power search, intelligence, reviews, requests, lifecycle, and Access AuthZ
    - Rules, queries, workflow engine, external ticketing/comms integrations
    - No public telemetry on query latency, workflow throughput, or reconciliation success rates
  - - AI layer (Access AI / AI Agent Security / Access Agents)
    - Summarize risk, explain access, discover agents/tools, and automate analyst tasks
    - AWS Bedrock plus Veza’s identity/permissions corpus
    - Model quality, hallucination controls, and human-override metrics are not publicly benchmarked
  - - External action plane
    - Create tickets, route notifications, and expose APIs for surrounding workflows
    - ServiceNow, Jira, Slack, Microsoft Teams, customer systems
    - Enterprise value depends on the surrounding workflow stack actually being integrated
  notes: This table sticks to components explicitly described in public materials. Deeper internals such as graph database choice, control-plane
    layout, and DR design remain undisclosed.
