company:
  name: Veza
chapter:
  number: 2
  title: Market Analysis
  summary: 'Veza operates at the intersection of several overlapping identity-security markets rather than inside one clean legacy category. Public analyst estimates place the core IGA market around $8–10.7 billion in 2024–2026 with mid-teens growth, while adjacent ISPM and non-human identity markets are forecast even faster from smaller bases. The practical market for Veza is narrower than these topline numbers suggest: its strongest fit is large, heterogeneous enterprises that need permissions visibility, cross-system access governance, and machine-identity or AI-agent control across custom, cloud, and SaaS environments. Demand drivers are strong—least privilege, zero-trust, audit pressure, cloud complexity, and AI-agent proliferation—but adoption constraints remain material because buyers often already own SailPoint, Microsoft, CyberArk, Saviynt, or internal workflows, and budget ownership cuts across security, IAM, cloud, and compliance teams.'
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary, Included Spend, and Status-Quo Alternatives
  body: Veza is best analyzed as an authorization-centric identity security platform spanning multiple adjacent markets rather than as a pure-play legacy IGA vendor. Its own language combines identity security posture management, access visibility, access intelligence, lifecycle control, non-human identity governance, and custom-app authorization through the Open Authorization API. That means the broadest relevant market boundary includes spend on IGA, identity-security posture management, non-human identity governance, PAM-adjacent access assurance, and portions of data-access governance where permissions visibility is the primary control problem. It excludes pure directory services, basic SSO, endpoint identity, and horizontal ITSM workflows except where those systems become embedded in the access-governance process. The status quo Veza tries to replace is not one single competing tool. It is a layered bundle of manual access reviews, static role models, legacy IGA suites, cloud-native
    point controls, homegrown approval workflows, and fragmented visibility spread across IAM, security, data, and platform teams. That fragmented baseline matters because Veza’s sales motion depends less on creating a new compliance obligation than on consolidating access truth across many existing systems.
  claimRefs:
