- id: contradictions-and-diligence-gaps
  title: Contradictions, Budget Ambiguity, and What Public Data Still Cannot Prove
  body: The main analytical risk in this chapter is over-reading broad market reports as if they directly sized Veza. They do not. The analyst estimates fetched here define overlapping categories with different scopes, making it easy to double-count identity spend or confuse the fastest-growing adjacent niche with Veza’s actual reachable opportunity. Public evidence is also weak on exact payer behavior. The product pages and case studies strongly imply security, IAM, and governance ownership, but they do not disclose standard budget lines, ACV bands, or whether deals are primarily competitive replacements versus net-new control layers. Public sources also say little about how much of Veza’s demand came from human-identity governance versus non-human identity or AI-agent security before the ServiceNow transaction. Those gaps matter because they determine whether Veza was selling into a large repeatable category, or into a narrower but highly painful segment of complex enterprises. For diligence,
    the market should be treated as large, real, and growing—but only partially proven as a clean standalone TAM/SAM/SOM stack for Veza itself.
