  - - Cloud and SaaS sprawl
    - Positive
    - Current / durable
    - More systems and permissions increase Veza’s visibility advantage
    - Quantify system-count threshold where Veza becomes compelling
  - - Machine-identity / NHI growth
    - Positive
    - Current / accelerating
    - Creates new spend wedge beyond human governance
    - Separate human versus NHI revenue contribution
  - - AI-agent adoption
    - Positive
    - Emerging / fast
    - Supports Veza’s AI-agent security narrative and post-acquisition roadmap
    - Validate production deployments versus marketing signal
  - - Audit and regulatory pressure
    - Positive
    - Current / durable
    - Access evidence and least privilege become board-level security issues
    - Test how compliance-led deals differ from breach-led deals
  - - Incumbent platform convergence
    - Negative
    - Current / durable
    - SailPoint, Microsoft, CyberArk and others are broadening toward the same story
    - Run win/loss analysis by competitor class
  - - Budget ambiguity across IAM/security/cloud
    - Negative
    - Current
    - Cross-functional ownership can elongate sales cycles and procurement
    - Map actual buyer/payer by top accounts
  - - Implementation distress / ROI burden
    - Negative
    - Current
    - Customers want modernization but fear another heavy IGA program
    - Validate deployment time, services burden, and payback by cohort
  notes: The same market dynamics can operate as both growth catalysts and friction. Identity complexity expands the problem, but overlapping categories and cross-functional ownership make budget capture harder than topline TAM figures imply.
