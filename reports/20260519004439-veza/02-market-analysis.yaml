callouts:
- calloutType: insight
  title: Veza’s real market is a constrained enterprise wedge inside overlapping identity categories
  body: The headline identity-security TAM is large, but Veza’s actual opportunity is not “all identity spend.” The public product record points to large enterprises with cross-system permissions complexity, not to the full universe of IGA or SSO buyers.
  claimRefs:
  - CM001
  - CM006
  - CM008
  - CM038
  - CM039
- calloutType: risk
  title: Category convergence validates the problem and intensifies competition
  body: Nearly every major identity vendor now markets some combination of humans, machines, AI, least privilege, and governance. That validates Veza’s thesis, but it also means the company must win on integration breadth, deployment speed, and custom-system coverage rather than on category novelty alone.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM032
- calloutType: assumption
  title: Public evidence implies security and IAM budget ownership, not business-unit ownership
  body: Customer proof and product language consistently place CISOs, IAM leaders, cloud-security teams, and reviewers at the center of the buying motion. Exact payer lines remain undisclosed, so budget assumptions should be validated directly in diligence.
