  - - Status quo / internal build
    - Manual reviews, spreadsheets, scripts, native cloud controls, homegrown approval flows
    - Standalone budgeted platforms
    - Cross-functional
    - Most common incumbent alternative in fragmented environments
  - - Pure SSO / directory / MFA
    - Authentication, federation, login, basic identity store
    - Downstream authorization graphing and fine-grained entitlement analysis
    - IT / IAM
    - Mostly adjacent, not the main Veza buying job
