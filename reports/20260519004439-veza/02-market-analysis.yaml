- id: market-sizing-lenses
  title: Market Sizing Lenses and What They Actually Mean for Veza
  body: 'Public market sizing sources support a large and growing opportunity, but they do not describe Veza’s serviceable market one-to-one. Grand View Research estimated the global IGA market at $7.95 billion in 2024 and projected it to $27.11 billion by 2033 at a 14.9% CAGR. Fortune Business Insights placed the same category at $9.29 billion in 2025, growing to $33.1 billion by 2034 at a 15.16% CAGR. Adjacent categories are larger or faster-growing depending on methodology: MarketsandMarkets projected the ISPM market from $13.7 billion in 2024 to $33.1 billion by 2029 at 19.3% CAGR, and projected non-human identity access management from about $9.45 billion in 2024 to $18.71 billion by 2030 at 11.9% CAGR. Those estimates are useful as boundary markers, not as direct TAM answers. Veza’s true serviceable market is narrower because the product is best suited to enterprises with complex entitlement graphs, hybrid and multi-cloud estates, custom applications, or escalating machine-identity
    sprawl. The right valuation lens is therefore a constrained enterprise-security wedge inside several adjacent markets, not the full sum of all identity spend categories.'
  claimRefs:
