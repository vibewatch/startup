  - - Identity Security Posture Management (ISPM)
    - Permissions visibility, risky access detection, monitoring, posture analytics
    - Pure ticketing or ITSM workflows
    - Security engineering / cloud security / CISO
    - Strong fit for Veza’s access visibility and intelligence motion
  - - Non-human identity governance
    - Service accounts, workloads, secrets, keys, machine identities, AI agents
    - Pure secrets vaulting without broader access graph context
