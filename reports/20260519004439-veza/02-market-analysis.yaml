  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Veza
  - Diligence ask
  rows:
  - - Zero-trust least-privilege mandates
    - Positive
    - Current / durable
    - Supports permissions visibility and fine-grained governance value
