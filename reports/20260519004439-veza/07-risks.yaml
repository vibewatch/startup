  - id: execution-implementation-and-customer-risk
    title: Execution, Implementation, Customer, and Pricing Risk
    body: >-
      Public evidence supports real customer value, but it does not support a low-friction deployment story. Veza’s own
      Access AuthZ launch positioned the platform as lightweight and simple to implement, with no services-heavy
      deployment burden. Independent review surfaces point the other way. The AWS Marketplace review says Veza is
      expensive, complex to set up, requires more integration across multiple systems, and still lacks enforcement
      tooling; PeerSpot repeats the same themes and adds that support could be better. GetApp and Software Advice
      reinforce a different but related caution: buyers do not get public pricing, only quote-led or advisor-led contact
      flows, while the SaaS agreement says pricing depends on identities, integrations, and products, with annual
      prepay, confidential pricing terms, and the ability to raise fees when contracted usage is exceeded. That
      combination creates a familiar enterprise-software risk pattern: strong value in large heterogeneous environments,
      but a heavy implementation and procurement burden that may limit segment breadth, elongate cycles, and make ROI
      harder to benchmark externally. Customer-quality disclosure compounds the issue. ServiceNow disclosed nearly 150
      customers, but the public record still does not break out concentration, ACV mix, renewal profile, or services
      attach. The result is a credible enterprise motion with medium-high execution risk, especially if customers need
      custom integration work before the platform becomes sticky.
    claimRefs:
      - CR017
