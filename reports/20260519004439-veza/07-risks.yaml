chapter:
  number: 7
  title: Risks
  summary: >-
    Veza’s core risk has shifted from “can it become a unicorn?” to “what value and durability remain after an early
    strategic sale?” The public record supports a strong authorization-centric product wedge, but it also shows category
    ambiguity, heavyweight bundled competition, implementation friction, thin standalone disclosure, and meaningful
    post-acquisition integration uncertainty. As of report date the company is acquired, not independently financeable
    from public evidence, so the top residual risks are positioning erosion inside larger suites, customer and pricing
    opacity, AI/NHI claim overreach versus proof, and ServiceNow execution risk.
sections:
  - id: category-positioning-and-competition-risk
    title: Category, Positioning, and Competition Risk
    body: >-
      Veza’s biggest strategic risk is that it is clearly solving a real problem without owning a clean market category
      that buyers must purchase as a standalone control plane. The company describes itself across identity security,
      ISPM, next-generation IGA, non-human identity security, AI-agent security, and access automation. That breadth is
      commercially attractive, but it also creates positioning ambiguity: some customers may view Veza as a
      differentiated authorization graph layer, while others may see it as an augmentation module that can be absorbed
      by a larger suite. The competitive context has only tightened. SailPoint now markets adaptive identity for humans,
      machines, and AI at far larger scale, CyberArk frames identity security across human, machine, and agentic AI
      identities with $1.44 billion of ARR, Microsoft bundles identity governance into the Entra Suite, and One Identity
      still covers classic governance, self-service access, and lifecycle workflows. Veza’s category risk is therefore
      not that the problem is too small; it is that adjacent incumbents increasingly tell a similar story with broader
      distribution, more pricing leverage, and a stronger claim to be the long-term system of record. For diligence, the
      real question is whether Veza’s authorization-centric graph materially changes deployment speed, coverage of
      custom systems, or remediation outcomes enough to resist being treated as a feature rather than a platform.
    claimRefs:
