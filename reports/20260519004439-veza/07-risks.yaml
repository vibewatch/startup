  - id: acquisition-and-integration-risk
    title: Acquisition and Integration Risk
    body: >-
      As of report date, Veza’s risk profile is inseparable from ServiceNow. The acquisition was announced in December
      2025 and the official ServiceNow release was later updated to say the transaction closed on March 2, 2026. That
      changes the investment question from standalone durability to post-close absorption risk. ServiceNow’s own
      forward-looking language is unusually explicit: risks include delays integrating Veza’s technology, inability to
      retain employees, unanticipated liabilities, and management distraction. Independent analysis sharpens the same
      concern from different angles. KuppingerCole argues that embedding identity governance deeper into ServiceNow
      increases platform gravity and switching complexity for customers, while Forbes says ServiceNow had not disclosed
      a specific integration timeline and may eventually package core Veza capabilities inside AI Control Tower with
      advanced features priced separately. That combination creates three meaningful risks. First, customers may wait
      for roadmap clarity before expanding. Second, Veza’s differentiated graph and governance surfaces may be
      repackaged or subordinated to broader ServiceNow priorities. Third, best-of-breed buyers may worry about lock-in
      if identity governance becomes inseparable from ServiceNow workflows. The acquisition clearly validates strategic
      relevance, but it also truncates the public proof needed to judge standalone economics and shifts the key
      execution burden to post-merger integration.
    claimRefs:
      - CR003
      - CR004
      - CR005
