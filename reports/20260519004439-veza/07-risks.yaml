    title: The prompt’s unicorn premise is false and materially changes the risk frame
    body: >-
      The last confirmed standalone round was the April 2025 Series D at an $808 million valuation, and Veza was
      acquired by ServiceNow before any public evidence supported a private-unicorn-at-report-date thesis.
    claimRefs:
      - CR001
      - CR002
      - CR003
  - calloutType: risk
    title: Implementation friction is the strongest independent caution signal
    body: >-
      The most credible non-company evidence is not about product failure; it is about cost, setup complexity, support
      quality, and the work required to integrate many systems before Veza delivers full value.
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
