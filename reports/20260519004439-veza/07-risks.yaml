  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: acquisition-economics
      missingEvidence: >-
        Purchase price, employee retention packages, earn-outs, customer contract novations, and any post-close product
        deprecation commitments.
      whyItMatters: >-
        Without transaction economics and retention structure, the strategic value of the acquisition cannot be
        separated from headline optics.
      diligencePath: >-
        Request merger term summary, retention schedule for founders and key leads, and customer change-of-control
        communications.
      relatedQuestionRefs:
        - QR017
        - QR024
        - QR026
        - QR031
      relatedTableRefs:
        - TR003
        - TR005
        - TR006
    - type: missing-source
      severity: material
      topic: incident-and-litigation-history
      missingEvidence: >-
        Court docket review, insurer claims history, incident register, and any material security-event or
        privacy-complaint history.
      whyItMatters: >-
        The public record shows policies and contractual obligations, but not whether those controls have been
        stress-tested by real incidents or disputes.
      diligencePath: >-
        Run outside-counsel litigation search, review cyber insurance claims, and request security incident summaries
        and any customer notices.
      relatedQuestionRefs:
        - QR019
        - QR021
        - QR030
      relatedTableRefs:
        - TR001
        - TR002
    - type: private-evidence-only
      severity: material
      topic: customer-concentration-and-pricing
      missingEvidence: >-
        Top-account ARR concentration, ACV mix, services attach, gross retention, renewal schedule, and actual price
        book or realized discount ranges.
      whyItMatters: Public pricing opacity and customer-count disclosure are not enough to judge durability or margin quality.
      diligencePath: Request top-20 customer cohort file, pricing matrix, services margin data, and churn / expansion bridges.
      relatedQuestionRefs:
        - QR013
        - QR014
        - QR015
        - QR016
        - QR017
      relatedTableRefs:
        - TR003
        - TR006
    - type: missing-source
      severity: material
      topic: ai-and-nhi-production-proof
      missingEvidence: >-
        Independent customer references, benchmarked outcome data, and production-adoption counts for Access AI, NHI
        Security, AI Agent Security, Access Agents, and Access AuthZ.
      whyItMatters: >-
        The newest modules are strategically important to the acquisition thesis but are still supported mainly by
        company-authored materials in the fetched record.
      diligencePath: >-
        Request named references, KPI dashboards, false-positive / false-action metrics, and post-deployment case
        studies for AI/NHI modules.
      relatedQuestionRefs:
        - QR027
        - QR028
        - QR029
      relatedTableRefs:
        - TR002
        - TR004
        - TR005
    - type: private-evidence-only
      severity: material
      topic: post-close-roadmap-and-packaging
      missingEvidence: >-
        Specific integration timeline, packaging policy, support policy for non-ServiceNow environments, and any
        commitment to preserve open-platform integration breadth.
      whyItMatters: >-
        The acquisition shifts the main risk to how ServiceNow packages and prioritizes Veza rather than whether Veza
        can raise another standalone round.
      diligencePath: >-
        Request 12-month product roadmap, SKU map, and customer communication plan for existing Veza accounts and joint
