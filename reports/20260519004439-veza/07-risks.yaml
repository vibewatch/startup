  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Bundling / displacement by larger suites
        - Win-loss and pricing outcomes against Microsoft, SailPoint, CyberArk
        - Repeated losses where Veza is treated as overlapping add-on rather than differentiated platform
        - Downgrade category durability and assume lower standalone pricing power
      - - Integration burden
        - Time-to-value and services attach
        - Median deployment remains services-heavy or slips materially after Access AuthZ messaging
        - Treat implementation friction as structural, not transitional
      - - Customer / pricing opacity
        - Availability of top-account, ACV, and cohort data
        - Management declines to disclose concentration, contract, and expansion detail
        - Keep risk rating high and avoid underwriting renewal quality
      - - Post-close roadmap uncertainty
        - ServiceNow integration roadmap and packaging disclosures
        - No clear timeline, native support policy, or packaging map after close
        - Assume delayed upsell and increased customer hesitation
      - - AI / NHI claim substantiation
        - Independent customer metrics
        - No production references or measured outcomes for AI Agent Security / Access Agents / NHI beyond vendor copy
        - Discount AI upside and treat newer modules as option value only
      - - Legal / incident transparency
        - Audit, litigation, and breach disclosure review
        - Material incidents, lawsuits, or unresolved compliance exceptions surface in diligence
        - Escalate risk rating and revisit customer durability assumptions
      - - Key talent retention
        - Founder and core product-team continuity
        - Meaningful departures before integration is stabilized
        - Assume slower product absorption and weaker differentiation retention
    notes: >-
      Kill criteria are intentionally post-close because the acquisition shifted the main risk from private-market
      financing to strategic integration and packaging execution.
