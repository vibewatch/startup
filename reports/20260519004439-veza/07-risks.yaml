  - id: disclosure-legal-and-security-risk
    title: Disclosure, Legal, Regulatory, and Security Transparency Risk
    body: >-
      Veza’s public legal and trust materials show a company that has thought seriously about privacy, breach response,
      and enterprise contracting, but they also expose how much of the true risk picture remains undisclosed. The
      privacy statement says Veza processes personal data under multiple U.S. state privacy regimes, GDPR-related
      frameworks, and the EU-U.S./UK/Swiss Data Privacy Frameworks, while the customer agreement sets
      breach-notification obligations, a documented incident response plan, confidentiality obligations, choice of New
      York law, annual prepaid pricing, and liability limitations. Those are real controls and real legal obligations,
      not hand-wavy trust-center copy. But none of that replaces public transparency into actual incident history,
      litigation exposure, audit findings, or security-event frequency. The fetched record did not surface public breach
      postmortems, public lawsuits, or detailed disclosed exceptions to Veza’s security claims; that absence should be
      treated as a diligence gap, not as proof of zero incidents. The same transparency problem applies to finance. Veza
      disclosed growth rates, not absolute ARR or revenue, and ServiceNow did not disclose purchase price or final
      transaction economics. Because Veza sells into buyers facing more cyber-governance and disclosure pressure under
      rules such as the SEC’s 2023 incident-disclosure framework, weak public transparency is itself a risk signal: the
      company may be strategically valuable, but it cannot be underwritten like a transparent late-stage software issuer
      from public information alone.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR044
