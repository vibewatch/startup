  topStrengths:
    - >-
      Authorization-centric Access Graph plus OAA gives Veza a real wedge across cloud, SaaS, data, and
      custom-application permissions.
    - >-
      Product breadth spans reviews, lifecycle, requests, Access AuthZ, NHI security, and AI / agent security rather
      than a single narrow IGA workflow.
    - >-
      Customer proof is unusually concrete for a private security company, with nearly 150 enterprise customers at
      signing and named deployments at Blackstone, Snowflake, Choice Hotels, Deluxe, and others.
    - >-
      Last-round operating signals were strong: ARR more than doubled year over year, enterprise NRR was nearing 150%,
      and the platform reached 20B+ permissions and 250+ integrations.
    - >-
      ServiceNow's acquisition validates strategic relevance, while NEA, Accel, GV, Blackstone, and other blue-chip
      investors validate institutional interest.
  topRisks:
    - >-
      Official ServiceNow purchase price and consideration mix remain undisclosed, so public sources cannot verify the
      exit premium or the clearing valuation.
    - >-
      The latest clean standalone valuation was $808M, not the user's $2.1B premise, so the standalone unicorn thesis is
      not supported by fetched evidence.
    - >-
      Veza competes against larger bundled identity and security suites such as SailPoint, CyberArk, Microsoft Entra,
      and other incumbents with deeper distribution.
    - >-
      Independent reviews repeatedly describe the product as expensive and complex to implement, implying real
      deployment friction and services burden.
    - >-
      Public disclosure never reached investable late-stage quality: ARR, revenue, gross margin, burn, churn,
      concentration, and cap-table detail remain hidden.
    - >-
      Post-close ServiceNow integration, packaging, and talent-retention risk could reduce Veza's product
      distinctiveness or slow roadmap execution.
  unresolvedGaps:
    - Official ServiceNow purchase price, payment mix, rollover terms, and transaction waterfall remain undisclosed.
    - >-
      Absolute ARR, revenue, gross margin, burn, deferred revenue, and cash for Veza's final standalone period are still
      private.
    - >-
      Customer concentration, renewal profile, gross retention, ACV mix, and top-account exposure are not publicly
      disclosed.
    - >-
      Full cap table, liquidation preferences, option dilution, and final board composition at exit are not publicly
      available.
    - >-
      Independent production evidence for newer Access AuthZ, Access AI, AI-agent, and Access Agents claims is still
      limited.
    - >-
      Post-close roadmap, packaging, and retention of key Veza product and engineering leaders inside ServiceNow remain
      unclear.
