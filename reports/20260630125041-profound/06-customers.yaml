company:
  name: Profound
chapter:
  number: 6
  title: Customers
  summary: 'Profound has strong public customer proof: 700+ enterprises, 10%+ of the Fortune 500, and a case-study set that spans Ramp, OpusClip, Arizona College of Nursing, Alchemy, Hone, Zapier, Airbyte, Kiteworks, and Statsig with measured outcome claims. The weakness is not demand proof but durability proof, because no public source discloses NRR, churn, concentration, contract length, or paid-status depth for the full logo wall. The resulting view is favorable on adoption quality but cautious on retention transparency.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Profound’s public customer story starts with enterprise credibility. Official and news sources say the company supports more than 700 enterprises and more than 10% of the Fortune 500, while the customer page and financing coverage highlight a logo set that spans retail, fintech, consumer brands, and B2B software. At the same time, the reference set is not purely Fortune 500. Growth-stage software names like OpusClip, Alchemy, Airbyte, and Statsig show that the product also resonates with digitally native teams that care about content velocity and AI-attributed demand. That mix suggests a buyer base anchored in enterprise budgets but broad enough to travel across multiple marketing maturities and company sizes. The one major caveat is definitional drift: a December 2025 company post cited 1,000 customers, while the February 2026 financing narrative cited 700+ enterprises. That discrepancy does not erase the adoption signal, but it does weaken confidence in exact trajectory reporting
    and reinforces the need for management-grade customer definitions.'
  claimRefs:
