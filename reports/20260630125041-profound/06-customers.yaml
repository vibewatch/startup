- id: retention-expansion-and-concentration-risk
  title: Retention, Expansion, and Concentration Risk
  body: The durability picture is much thinner than the acquisition picture. No public source discloses NRR, GRR, churn, contract length, customer concentration, or ACV distribution. The best public hints come indirectly. Several customer stories show an initial measurement workflow expanding into agents, more prompts, or additional markets, which supports a land-and-expand hypothesis. The pricing page also hints at a broader funnel, potentially widening the top of funnel without changing the enterprise economic core. But these are still hypotheses. Without retention cohorts or top-account exposure, investors cannot tell whether the business is broadly sticky or simply showcases a handful of standout wins. This matters because the published case studies are heavily weighted toward sophisticated, marketing-forward teams. That bias could make the product appear more universally adoptable than it really is. The outcome is a chapter where expansion looks plausible, concentration is unknowable,
    and retention remains the central blind spot.
  claimRefs:
  - CU017
  - CU018
  - CU021
  - CU023
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU034
  - CU038
