  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer Verdict
  body: On balance, Profound’s customer evidence is stronger than its retention evidence. The company has credible enterprise-scale logos, multiple fresh case studies with quantified outcomes, and a reference set that spans both large enterprises and growth-stage software companies. That is enough to support the claim that real customers are deriving value and operationalizing the platform. What it does not support is a confident view on durability, monetization depth, or concentration. Public logos do not prove current spend, and public case studies do not prove renewal health. Adverse reviews add a reminder that premium pricing and product complexity may narrow the addressable base outside the enterprise core. The practical takeaway is that customer proof is good enough to keep diligence moving forward, but a serious underwriting still needs cohort retention, module attach, top-account concentration, and exact customer-count definitions from management. Management should also explain logo
    eligibility rules, referenceability standards, and whether expansion depends on a narrow group of unusually sophisticated design partners.
  claimRefs:
  - CU015
  - CU025
  - CU029
  - CU030
