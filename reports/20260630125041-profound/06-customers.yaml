- id: named-proof-and-adoption-quality
  title: Named Proof and Adoption Quality
  body: 'The strongest part of Profound’s customer story is the quality of public proof. Multiple case studies go beyond logos to show workflows, baselines, and measurable outcomes: Ramp’s 7x visibility increase, OpusClip’s 45%+ visibility and answer-engine conversion gains, Arizona College of Nursing’s 51% lift in AI-referred inquiries, Alchemy’s 7x higher signup rate from AI referrals, Hone’s 800% visibility increase, and Airbyte’s tripled visibility in one week. Those are not generic testimonials. They suggest real operational use and, in several cases, a measurable connection between AI visibility and business outcomes. Case-study roles also cut across growth, SEO, and web operations, implying cross-functional adoption. The limitation is equally clear: public case studies are inherently selected. They show what success can look like, not what median outcomes look like. Public proof therefore supports adoption quality and production use more than it supports portfolio-wide expectations.'
  claimRefs:
