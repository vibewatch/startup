      - number: '2.5'
        title: 规模缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: |
              市场证据中存在几处矛盾和缺口：
              1. Dimension 的 AEO 估计（$161M，43% CAGR）与 Dimension 的 GEO 估计（$848M，
                 50.5% CAGR）在相近年份相差 5 倍，原因是边界定义不同。
                 截至研究日期，两者都未由第三方独立验证。

              2. ChatGPT 用户数因来源不同而变化：「每日 810 million」（Superlines/Writesonic CEO
                 引用）、「每周 900 million」（Superlines），以及「每周 1 billion」（Profound 自有
                 营销材料）。这些差异可能来自不同计量周期或四舍五入。

              3. AI 商业影响预测——到 2027 年达到 $2.5 trillion（Profound Series B 博客），以及
                 「Google $2.4 trillion 中的 $1 trillion 将在 5 年内转向 ChatGPT」
                 （Rankability 评测）——都是公司声称的前瞻预测，没有披露方法论，应视为愿景叙事，而不是可投资的市场规模。

              4. 目前没有可靠公开数据说明企业营销预算中有多少专门分配给 AI 可见性工具，因此 SAM 推导高度依赖假设。

              5. AEO/GEO 市场报告几乎全部来自小型研究机构（Dimension、ConvertMate、Superlines），
                 品牌认知有限且未披露方法论。截至研究日期，没有 Gartner、IDC 或 Forrester 报告专门估算
                 AEO/GEO 软件市场规模。
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
