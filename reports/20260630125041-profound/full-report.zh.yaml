companyProfile:
  summary: >
    Profound（法定名称 Cooper Square Technologies Inc.）总部位于纽约市，是一家面向答案引擎优化（AEO）和 AI 品牌可见性的企业 SaaS 平台，由 James
    Cadwallader（CEO）和 Dylan Babbs（CTO）于 2024 年 8 月创立。公司帮助 Fortune 500 企业的营销团队追踪、分析并影响品牌在 ChatGPT、Perplexity、Google AI
    Overviews、Gemini、Copilot、Claude、Grok 及其他 AI 助手生成答案中的呈现方式。Profound 在 18 个月内完成四轮融资，累计募资 $155M+，并于 2026 年 2 月以 $1B
    估值跻身独角兽。关键差异化包括 Prompt Volumes（基于独特面板的 AI 搜索需求数据，并带有人口统计维度）、Profound Agents（自主 AI 营销智能体），以及品类内最广的引擎覆盖（10+
    平台）。Profound 服务 700+ 企业客户，其中包括 Fortune 500 中 10%+ 的公司，覆盖 CPG、金融科技、零售、医药、消费科技和 B2B 科技等垂直领域。
