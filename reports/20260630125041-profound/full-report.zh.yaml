        - label: 续约指标披露
          value: 0
        - label: NRR / 流失率披露
          value: 0
    approximationNotes: 柱状值统计公开证据对象数量，不代表内部客户指标。
    claimRefs:
      - CU017
      - CU018
      - CU026
      - CU034
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最重的风险集中在平台依赖、定价压力和披露质量，而不是现有法律困境。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
      rows:
        - label: 平台依赖
          values:
            - 高
            - 高
            - 中
        - label: 定价 / 复杂度
          values:
            - 中
            - 中到高
            - 低到中
        - label: 财务不透明
          values:
            - 高
            - 高
            - 低
        - label: 领导层厚度
          values:
            - 中
            - 高
            - 低到中
        - label: 法律 / 监管冲击
          values:
            - 低
            - 中
            - 中
        - label: 品类定义风险
          values:
            - 中
            - 高
            - 中
    approximationNotes: 定性单元格是基于公开证据和证据缺口给出的分析评级。
    claimRefs:
      - CR007
      - CR010
      - CR013
      - CR015
      - CR021
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多数重大风险先传导到产品有效性或销售效率，再影响收入质量和估值。
    data:
      nodes:
        - id: platform
          label: 平台依赖
        - id: pricing
          label: 定价 / 复杂度
        - id: leadership
          label: 领导层厚度
        - id: utility
          label: 产品有效性
        - id: sales
          label: 销售效率
        - id: revenue
          label: 收入质量
        - id: valuation
          label: 估值信心
      edges:
        - from: platform
          to: utility
          label: 可观测性下降
        - from: pricing
          to: sales
          label: 采用更难
        - from: leadership
          to: sales
          label: 执行承压
        - from: utility
          to: revenue
          label: 留存走弱
        - from: sales
          to: revenue
          label: 转化降低
        - from: revenue
          to: valuation
          label: 信心降低
    approximationNotes: 该图是概念图，展示因果通道，而不是测量出的弹性。
    claimRefs:
      - CR008
      - CR013
      - CR020
      - CR028
      - CR029
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 产品依赖外部 AI 平台、客户基础设施和合作伙伴渠道，Profound 不能完全控制这些环节。
    data:
      nodes:
        - id: engines
          label: AI 平台
        - id: infra
          label: 客户基础设施 / 日志
        - id: partners
          label: 合作伙伴渠道
        - id: analytics
          label: Profound 分析层
        - id: customers
          label: 客户结果
      edges:
        - from: engines
          to: analytics
          label: 答案行为
        - from: infra
          to: analytics
          label: 流量证据
        - from: partners
          to: customers
          label: 部署触达
        - from: analytics
          to: customers
          label: 产品价值
    approximationNotes: 图中突出依赖集中度，而不是覆盖生态系统里的全部关系。
    claimRefs:
      - CR007
      - CR023
      - CR027
      - CR028
      - CR036
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论先看到强需求和客户证明，再核查缺失的经济性和估值拉伸。
    data:
      nodes:
        - id: demand
          label: 大市场 + 企业证明
        - id: product
          label: 宽工作流产品
        - id: gaps
          label: ARR / 留存缺失
        - id: price
          label: 当前 $1B 价格
        - id: decision
          label: 继续研究 / 跟踪
      edges:
        - from: demand
          to: product
          label: 支撑兴趣
        - from: product
          to: gaps
          label: 需要经济性
        - from: gaps
          to: price
          label: 倍数仍不确定
        - from: price
          to: decision
          label: 阻止买入
    approximationNotes: 流程概括决策逻辑，而不是量化评分模型。
    claimRefs:
      - CV009
      - CV011
      - CV014
      - CV021
      - CV022
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 当前价格固定、公开经济性缺失，ARR 假设一变，隐含估值支撑就会大幅摆动。
    data:
      items:
        - label: ARR $10M
          value: 100
        - label: ARR $20M
          value: 50
        - label: ARR $30M
          value: 33
    approximationNotes: 柱状值表示 $1B 估值下的隐含 ARR 倍数，四舍五入到整数。
    claimRefs:
      - CV006
      - CV007
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据的合理区间包括三种情形：ARR 偏低则有下行，经济性尚可则维持当前价格，平台论证跑通则有上行。
    data:
      items:
        - label: 悲观估值（USDm）
          low: 300
          mid: 400
          high: 500
        - label: 基准估值（USDm）
          low: 700
          mid: 1000
          high: 1200
        - label: 乐观估值（USDm）
          low: 1200
          mid: 1600
          high: 2200
    approximationNotes: 区间是绑定定性假设的情景输出，不是市场报价或管理层指引。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投资评分卡在市场和客户证明上强，在估值纪律和证据质量上弱。
    data:
      items:
        - label: 市场顺风
          value: High
        - label: 客户证明
          value: High
        - label: 产品广度
          value: High
        - label: 收入可见度
          value: Low
        - label: 估值支撑
          value: Low-Medium
        - label: 推荐置信度
          value: Medium
    approximationNotes: KPI 评级来自章节证据集中的分析判断。
    claimRefs:
      - CV005
      - CV008
      - CV013
      - CV021
      - CV031
      - CV038
      - CV040
