  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >
              Profound 参与的是其所称的答案引擎优化（AEO）市场，也叫生成式引擎优化（GEO）——一个专门衡量、管理并优化品牌在 ChatGPT、Perplexity、Google AI
              Overviews、Gemini、Microsoft Copilot、Claude、Grok 等平台 AI 生成答案中呈现方式的软件品类。

              市场边界包括：（1）AI 可见性分析软件，追踪跨 AI 答案引擎的品牌提及、引用、情绪和声量份额；（2）AI 内容优化工具，生成或调校内容以提升 AI 引用率；（3）AI 爬虫 / 智能体分析，监测 AI
              机器人如何解读网页资产；（4）自主营销智能体平台，基于 AI 可见性洞察执行动作。

              不纳入的支出包括：传统 SEO 平台（Ahrefs、Semrush、Moz），除非它们捆绑 GEO 功能；通用营销分析（GA4、Adobe
              Analytics）；社交聆听；以及付费搜索管理。这些产品服务的是不同购买意图，也对应不同答案界面。

              与 SEO 相邻既是机会，也是竞争风险：拥有大规模装机基础的成熟 SEO 厂商开始加入 GEO 功能，可能压缩独立 AEO 市场。Rankability 评测（2026 年 6 月）认为 Profound 在
              AEO 中定位为「企业级黄金标准」，但也指出 Ahrefs、SEMrush 和 BrightEdge 正从 SEO 侧向 AI 可见性扩张。

              现状替代方案是临时手工监测——营销人员手动查询 ChatGPT 和 Perplexity
              来检查品牌提及——它不需要预算，但一旦跨过少数品牌或提示词就很难扩展，也不提供趋势数据。替代方案的成本是营销分析师人力，而不是软件支出。
