      - CU006
      - CU007
      - CU008
      - CU012
      - CU013
      - CU015
      - CU025
  - id: FU004
    title: 留存 / 复购证据深度
    type: bar
    layout: standard
    summary: 客户证据栈重在获客和证明，缺少可支撑续约判断的指标。
    data:
      items:
        - label: 客户数量披露
          value: 2
        - label: 具名案例研究
          value: 9
        - label: 关联转化的证明
