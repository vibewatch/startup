            body: >-
              Profound 的公开客户故事首先建立在企业可信度上。官方和新闻来源称，公司支持超过 700 家企业和 Fortune 500 中超过 10%
              的公司；客户页面和融资报道展示的客户标识组合覆盖零售、金融科技、消费品牌和 B2B 软件。与此同时，参考客户并非纯 Fortune 500。OpusClip、Alchemy、Airbyte、Statsig
              等成长阶段软件公司说明，产品也能打动重视内容速度和 AI 归因需求的数字原生团队。这种组合说明，买方基础以企业预算为锚，但足够宽，可以跨越多种营销成熟度和公司规模。唯一主要保留项是定义漂移：2025 年 12
              月公司文章称 1,000 名客户，而 2026 年 2 月融资叙事称 700+ 家企业。这个差异不抹去采用信号，但削弱了对精确轨迹报告的信心，也强化了获取管理层级客户定义的必要性。
