      - number: '2.2'
        title: 市场规模——TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >
              AEO/GEO 市场已有多个独立规模估计，但方法不同，应视为方向性参考，而不是确定结论。

              Dimension Market Research（2026）估计，全球 AEO 市场 2026 年为 $160.9M，并以 43.4% CAGR 增长到 2035 年 $4.1B。美国子市场 2026 年为
              $54.0M（CAGR 40.6%）。欧洲为 $40.3M（CAGR 41.4%）。北美以估计 38.6% 的全球份额领先。

              Superlines 引用的另一份 Dimension 估计把 GEO 市场列为 2025 年 $848M，并以 50.5% CAGR 增长到 2034 年
              $33.7B——明显更大的估计，可能采用了更宽边界，纳入完整 AI 内容和分析邻接市场。

              Superlines/Dimension 的更宽 GEO 估计（2025 年 $848M → 2034 年 $33.7B）与较窄 AEO 估计（2026 年 $161M → 2035 年
              $4.1B）冲突，因为前者很可能纳入 AI 内容生成支出（邻接项），而后者仅限纯 AEO 测量工具。两个估计都予以保留。

              按 Profound 自身框架：Profound Series B 博客称，截至约 2025 年，ChatGPT 带来「约 10% 的推荐流量」，并预测到 2027 年线上商业的 50% 将由 AI 驱动，年规模
              $2.5T——这意味着总可触达管理支出是企业 CMO 掌控的全球营销分析预算，估计为营销技术栈中的 $25-30B。若变现率为 1-2%，未来 3-5 年内与 Profound 相关的 SAM 可能达到每年
              $250M-$600M。

              这些估计存在显著不确定性。AEO/GEO 作为明确定义的品类还不到 3 年；Profound 本身创造了大量术语，这给了它先发定义权，也让独立验证更稀疏。
            claimRefs:
              - CM006
              - CM007
              - CM008
