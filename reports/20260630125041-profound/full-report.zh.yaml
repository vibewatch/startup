    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Profound 以 Cooper Square Technologies Inc. 为法定名称、以 Profound 为经营名运营，官网为
              tryprofound.com。公司将自身定义为「面向未来营销人的全栈营销平台」，重点帮助企业理解并控制品牌在 ChatGPT、Perplexity、Google AI
              Overviews、Gemini、Microsoft Copilot、Claude、Grok 等平台生成答案中的呈现方式。

              商业模式是 SaaS 订阅。公开定价从 $99/月起（Starter：50 个提示词，仅追踪 ChatGPT），Growth 为 $399/月（3 个引擎、100 个 提示词），Enterprise
              针对大型部署定制定价，包含 SSO、SOC2 合规、专属 Slack 支持，以及最多 10 个答案引擎。收入主要来自年度订阅；考虑到其 Fortune 500 客户基础，企业定制合同是核心收入驱动。

              Profound 定义了一个新营销品类，称为答案引擎优化（AEO）或生成式引擎优化（GEO）——衡量、管理并提升品牌在 AI 生成答案中的呈现方式。公司把自己定位为面向 AI 的首个「读 /
              写」营销平台：读侧追踪品牌提及、引用、情绪、爬虫活动和提示词需求；写侧借助自主 Profound Agents 生成针对 AI 优化的内容和建议。Profound 已宣布举办 Zero Click 2026
              大会，并把 Profound University 认证和代理商市场纳入生态扩张。
