      - number: '8.4'
        title: 建议与投资论点破裂点
        blocks:
          - type: paragraph
            body: >-
              因此，基于公开证据的建议是继续研究；如果投资人只是想观察执行，而不是现在推进，最接近的备选是继续跟踪。业务看起来有意思，
              市场真实，产品也似乎比许多单点方案更宽。缺口在于财务透明度不足，无法判断当前价格是否还留下有吸引力的回报空间。 如果 ARR
              继续不披露、留存数据不及预期、客户数不一致持续存在，或平台变化削弱支撑产品差异化的测量闭环，投资论点会很快破裂。
              只有管理层证明收入基数、留存画像和竞争胜率显著强于公开记录显示，建议才会改善。在此之前，正确姿态是估值偏紧、置信度中等、 保持克制好奇，而不是形成确信。投入资本前，必须直接接触管理层。
