            body: >-
              多头逻辑并不难讲。Profound 所在的 AI 发现品类增长很快，公司有企业客户标识、较深的工作流产品，也明显在靠研究、
              活动和方案打包投资品类控制权。如果留存强、模块附加销售真实存在，今天的估值最终可能显得早，而不是贵。反向论点同样完整。 负面评论指出价格和复杂度，老牌厂商可以把类似功能捆进现有 SEO
              技术栈，公司也仍未披露能证明溢价估值合理的财务指标。 基准情景落在两端之间：客户证明真实，市场有吸引力，但当前价格已经预支了大量未来成功。上述组合要求用情景法看待：
              上行空间存在，但如果实际收入基数远小于叙事暗示，下行也很可观。
