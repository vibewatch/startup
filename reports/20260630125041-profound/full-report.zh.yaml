              Profound 的护城河真实存在，但有条件。Prompt Volumes 看起来是最强的差异化资产，因为多篇评测都指出其需求数据不同寻常；这种信号比仪表盘或爬虫更难复制。Agent Analytics
              和工作流层也增加深度，尤其当客户为网站技术栈埋点，并借助智能体把输出运营化时。与此同时，公开证据并未显示 Profound
              对模型输出拥有独家访问，或形成硬平台锁定。该品类很大一部分仍像覆盖层软件，这意味着多平台并用仍然可行，切换成本最多只是中等。分发合作改善了局面：Vercel marketplace、合作伙伴计划和
