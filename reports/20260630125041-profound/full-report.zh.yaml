      - number: '8.3'
        title: 可比公司、置信度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              可比分析是公开论据中最弱的一环，因为本次没有抓取直接可比公司的倍数数据。正确视角其实足够清楚：营销分析 SaaS、
              搜索相邻体验软件，以及数字智能平台。但缺少直接公开市场倍数数据，可比框架仍停留在概念层面，不能进入模型。可比数据缺口 进一步压低整体置信度。没有 ARR、留存、烧钱速度、股权结构条款，以及对捆绑型对手的赢单 /
              输单证据，即便谨慎的分析师 也只能做按品类加权的判断，而不是真正的投资判断。正确反应不是放弃公司，而是把下一轮尽调收窄到最能迅速改变判断的少数输入： 实际收入、分群持久性、资本结构细节、竞争赢单 /
              输单。在上述信息到来之前，估值纪律应比叙事热度更紧。纪律严明的投资人 还应追问：当前轮次中，有多少来自竞争性融资动能、战略信号或未来可选性，而不是已经被证明的现金生成能力。
