  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与当前价格
        blocks:
          - type: paragraph
            body: >-
              核心估值事实很清楚：Profound 在 2026 年 2 月以 $1B 估值完成 $96M Series C 轮，累计融资超过 $155M。这轮融资验证了
              投资人兴趣，但不能单独验证当下的回报潜力。核心难点在于，公司没有公开 ARR、收入年化运行率或留存。公开定价存在， 客户证明也有意义，但这些信号不足以把 $1B
              投后估值转化为高置信度的内在价值判断。仅凭公开证据，最多只能建区间模型， 再把区间与当前价格对比。结果不舒服但有用：考虑到品类热度和产品野心，当前估值在战略上可以理解；但锚点仍太弱，
              不足以支撑一个有把握的正面建议。换句话说，轮次价格是事实，背后的支撑仍主要靠推断。
            claimRefs:
