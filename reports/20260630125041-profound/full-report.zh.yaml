  - id: TV004
    title: 可比估值表
    columns:
      - 可比视角
      - 状态 / 倍数
      - 相关性
      - 局限
    rows:
      - - 营销分析 SaaS（例如 Sprinklr 视角）
        - 仅作公开可比视角；本轮未拉取直接倍数
        - 帮助框定面向企业营销团队销售的软件工作流
        - 缺少直接公开市场倍数抓取
      - - 数字智能 / 流量分析（例如 Similarweb 视角）
        - 仅作公开可比视角；本轮未拉取直接倍数
        - 与洞察和测量定位相关
        - 业务结构差异明显
      - - 搜索体验 / 发现软件（如 Yext 视角）
        - 仅作公开可比公司视角；本轮未拉取直接倍数
        - 映射可见度及搜索相邻预算负责人
        - AI 可见度赛道更早期、波动更大
      - - 私营 SEO / GEO 相邻视角
        - 方向上有参考价值，但本轮没有透明估值数据集
        - 覆盖捆绑式或相邻竞争集合
        - 私募市场不透明，精度受限
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable framework limited to publicly inferable category lenses because this run did not fetch direct
        valuation multiple sources for each named comparable.
    notes: 本表是框架表，不是完整交易可比输出。缺少直接可比倍数本身就是一个尽调缺口。
    claimRefs:
      - CV023
      - CV024
      - CV039
  - id: TV005
    title: 破坏投资论点与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 论点传导
      - 行动含义
    rows:
      - - ARR 仍未披露
        - 下轮尽调前仍没有可信收入披露
        - 估值仍锚在猜测上
        - 维持或下调
      - - 留存偏弱或未知
        - NRR / 流失率披露不及预期或继续缺席
        - 削弱平台耐久性论点
        - 下调上行情景假设
      - - 平台可观测性减弱
        - 主要答案引擎显著更难测量
        - 伤害产品实用性和差异化
        - 重估护城河
      - - 捆绑式对手拿下核心交易
        - 胜负数据反复显示输给套件
        - 挤压定价权
        - 收紧 TAM 和倍数
      - - 客户数量口径噪音持续
        - 定义仍不一致
        - 损害可信度
        - 抬高尽调门槛
    notes: 叫停触发项聚焦会改变建议的可观察事件，而不是泛泛的下行情景评论。
    claimRefs:
      - CV014
      - CV020
      - CV035
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR / 收入运行率
        - 实际 ARR 与收入桥接
        - 核心倍数锚
        - 索取 CFO 或董事会 KPI 材料
      - - 留存 / 分组
        - NRR、GRR、流失率、附加率
        - 耐久性与扩张证明
        - 索取分组分析
      - - 股权结构 / 优先权
        - 稀释、清算顺位、持股比例
        - 决定入场经济性
        - 索取融资文件
      - - 相对既有厂商的胜负
        - 近期交易相对捆绑式对手的结果
        - 检验真实市场中的护城河
        - 索取销售运营摘要
      - - 现金消耗 / 跑道
        - 在手现金与消耗
        - 把估值与融资风险连起来
        - 索取资金状况快照
      - - 可比倍数
        - 直接公开市场和私募可比数据
        - 给下行 / 上行判断设边界
        - 专门拉取可比数据
    notes: 这些问题按最快改变估值立场的顺序排列。
    claimRefs:
      - CV014
      - CV024
      - CV028
      - CV035
      - CV038
