      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              最主要的增长驱动是从传统搜索向 AI 中介发现的长期迁移。Gartner 在 2024 年 2 月预测，传统搜索引擎量到 2026 年将下降 25%；第三方统计也确认结构性加速：AI Overviews 出现在
              25.11% 的 Google 搜索中（Conductor 2026）；Google AI Overviews 推出后，零点击搜索一年内从 56% 增至 69%（Similarweb 2025 年 7
              月）；美国消费者中，35% 现在在产品发现阶段使用 AI，而使用传统搜索的为 13.6%（Similarweb 2026 Generative AI Brand Visibility Index）；ChatGPT
              全球每周活跃用户超过 900 million。

              Princeton/Georgia Tech/Allen Institute/IIT Delhi 的研究（KDD 2024）表明，GEO 技术最多可将内容在 AI 回答中的可见性提升 40%，为企业团队投资
              AEO 提供了可量化的 ROI 论据。

              关键采用约束包括：（1）成本高——Profound 估计比品类平均价格高 48%；（2）市场成熟度早期——计划部署 GEO 的营销人员中，只有 40.6% 目前真正行动（ConvertMate GEO
              Benchmark 2026）；（3）AI 平台不稳定——AI 答案引擎频繁改变引用模式和架构，为 AEO 厂商带来产品维护风险；（4）切换成本当前较低，因为品类新，客户还未深度集成；（5）ROI
              衡量仍在成熟——AI 归因流量仍只是总推荐流量的小部分，要证明 AEO 支出对收入的因果关系，需要定制归因工作。
