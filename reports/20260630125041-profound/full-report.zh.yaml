      - number: '7.3'
        title: 人员、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              公开记录还指向另一类执行风险：披露质量和管理梯队深度。Profound 融了大量资本，短期生存风险因此下降；但资本充裕也可能 遮住收入质量、财务纪律或 GTM 效率上的未解问题。未公开
              ARR、客户数口径冲突，都不是表面瑕疵；它们是可信度风险， 让外界更难判断增长是否高效且持久。领导层集中进一步加重问题。两位创始人曝光度很高，但本次审阅的资料没有显示同等
              可见的财务或运营梯队。与此同时，这个产品品类需要工程、市场、客户教育和安全协同，也需要可能稀缺的 营销工程师式运营人才。上述风险并不证明公司会失败，却说明公司仍需证明流程成熟度正在追上品类野心。
