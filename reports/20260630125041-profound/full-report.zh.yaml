      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >
              Profound 由 James Cadwallader（CEO）和 Dylan Babbs（CTO）联合创立，两人在纽约的 South Park Commons
              相识。两位创始人都认为答案引擎的主流化是营销技术的重大拐点，并因纽约聚集营销和代理商人才而把总部设在纽约市。

              James Cadwallader 担任 CEO，是公司对外沟通的公开面孔，代表 Profound 出现在投资人公告和外部演讲中。Dylan Babbs 担任
              CTO，负责工程；他此前强调，公司希望在「曼哈顿中心打造一支世界级工程团队」。

              按 Series A 公告，Series A 投资人 Ilya Fushman（Kleiner Perkins）加入董事会，带来 SaaS 机构治理经验。Sequoia Capital（Alfred Lin
              等）在 Series B 加入；Lightspeed（Sachin Patel）领投 Series C。研究期间，OfficialBoard 组织架构页面返回 403 状态，导致 VP 以下完整高管名单存在缺口。

              Profound 以线下团队形式运营，每周五天到岗，覆盖四个办公室。SF 办公室博客（2025 年 12 月）称当时有 82
              名员工。招聘页面显示，客户成功、工程和商业化岗位在纽约、伦敦、旧金山、布宜诺斯艾利斯均有开放岗位。公司累计融资 $155M、增长迅速，但关键人依赖风险集中在两位联合创始人身上。
