  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              对一个新兴品类来说，Profound 的产品叙事异常具体。公司描述的不是单一仪表盘，而是一个闭环。Answer Engine Insights 和 Prompt Volumes 识别哪些提示词重要；Agent
              Analytics 诊断 AI 系统如何到达并解读网站；Agents 和模板把信号转化为内容或优化工作；Shopping 把同一逻辑延伸到商业发现。这种结构很重要，因为它把抽象的「AI
              可见性」问题变成营销团队可以重复运行的运营工作流。官方材料反复强调，价值来自从洞察到行动，再回到测量。落到实践，产品更像 AI
              搜索实验的操作系统，而不是被动分析层。最强证明不是某个单一功能，而是已上线模块的宽度。弱点是，宽产品也会增加小团队的培训和治理负担，尤其当它们只需要闭环中的一部分时。
