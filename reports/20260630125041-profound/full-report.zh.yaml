      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              Profound 的买方是企业营销团队，所在公司规模足以配备专门 SEO/内容/数字营销资源，通常收入在 $100M+ 或拥有显著面向消费者的数字触点。付款方是 CMO 或营销 VP
              预算，软件采购决策常由数字营销总监或 SEO/内容负责人做出。

              按垂直领域拆分（来自 Series C 新闻稿）：CPG、金融服务（Fintech）、零售、医药、消费科技、B2B 科技。具名案例包括 Target 和
              Walmart（Retail/CPG）、Ramp、Chime 和 US Bank（金融服务）、Figma 和 MongoDB（B2B Tech），以及 Charlotte Tilbury（CPG/Beauty）。

              主要用户是运行可见性追踪报告和内容工作流的营销人员或 SEO 专家。次级用户是需要向董事会汇报 AI 品牌资产的相关高管。

              采用触发点：决策者发现自家公司 AI 搜索声量份额未知或下降，或竞争对手被 ChatGPT 引用频率高得多。AI 搜索推荐流量已开始在分析仪表盘中可测量地出现，制造了紧迫感；Kleiner Perkins
              提到，部分 Profound 客户有 15% 的推荐流量来自 AI 助手。

              预算归属通常在 SEO/数字营销预算线内，而不是新的技术预算。Profound 的企业合同定制定价；分析师估计企业计划「远高于 $1,500/月」。代理商和营销顾问是正在增长的转售渠道，Profound
              Ecosystem/代理商市场正面向这个渠道。
