      - number: '7.2'
        title: 平台、竞争与品类风险
        blocks:
          - type: paragraph
            body: >-
              Profound 最重要的风险来自依赖和趋同。产品价值取决于能否观察答案引擎如何检索、引用和分配流量；一旦这些行为更难观察 或发生实质变化，即便 AI
              搜索需求继续增长，产品价值也可能下滑。与此同时，公司所在品类正在争夺同一类买方预算： SEO 老牌厂商、专门 GEO 工具、代理机构和工作流专家都在靠近。双重暴露由此出现：外部平台可以改规则，竞争对手也能
              围绕这些变化，以更低成本打包「够用」功能。品类定义风险进一步放大问题，因为 Profound 仍在教育买方理解问题本身。 如果市场标准最终比 Profound
              预期更捆绑、更偏服务，定价权和差异化会很快被压缩。因此，平台依赖和捆绑风险位于本章中心， 不是边缘问题。
