          detail: Agents、模板和优化建议把洞察转成简报和可执行改动。
        - label: 输出层
          detail: 团队发布内容、技术修复和商户更新，再在 Profound 里复测结果。
    approximationNotes: 分层来自功能页面和文档推断；不是公司发布的内部系统图。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE008
      - CE027
      - CE035
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 客户从 Prompt 发现走到诊断、执行，再回到测量。
    data:
      nodes:
        - id: discover
          label: 发现 Prompt 和叙事
        - id: diagnose
          label: 测量引用、情绪和可抓取性
        - id: decide
          label: 选择内容或技术修复
        - id: execute
          label: 运行智能体或手工改动
        - id: remeasure
          label: 跟踪日度变化
      edges:
        - from: discover
          to: diagnose
          label: 分析
        - from: diagnose
          to: decide
          label: 排序
        - from: decide
          to: execute
          label: 简报 / 构建
        - from: execute
          to: remeasure
          label: 发布 / 部署
        - from: remeasure
          to: discover
          label: 反馈回路
    approximationNotes: 流程综合了官方工作流声明和合作伙伴案例语言。
    claimRefs:
      - CE005
      - CE016
      - CE030
      - CE032
      - CE035
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 产品依赖答案引擎可观测性、客户日志可用性和合作伙伴部署界面。
    data:
      nodes:
        - id: engines
          label: 答案引擎
        - id: logs
          label: 客户日志 / 基础设施
        - id: partners
          label: 合作伙伴部署界面
        - id: insights
          label: 可见度洞察
        - id: actions
          label: Agents + 优化工作流
        - id: outcomes
          label: 客户结果
      edges:
        - from: engines
          to: insights
          label: 响应 / 检索行为
        - from: logs
          to: insights
          label: 流量 + 爬虫证据
        - from: partners
          to: actions
          label: 落地渠道
        - from: insights
          to: actions
          label: 工作流输入
        - from: actions
          to: outcomes
          label: 内容 / 技术改动
    approximationNotes: 依赖图突出外部依赖，不是完整供应商物料清单。
    claimRefs:
      - CE010
      - CE012
      - CE015
      - CE028
      - CE036
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 成熟度在监测和工作流界面最高，架构披露仍落后于功能披露。
    data:
      columns:
        - 监测深度
        - 行动深度
        - 技术集成
        - 信任披露
        - 公开成熟度
      rows:
        - label: Answer Engine Insights
          values:
            - 强
            - 中
            - 低
            - 中
            - 强
        - label: Prompt Volumes
          values:
            - 强
            - 低
            - 低
            - 低
            - 中
        - label: Agent 分析
          values:
            - 强
            - 低
            - 强
            - 强
            - 强
        - label: 智能体
          values:
            - 中
            - 强
            - 中
            - 中
            - 中到强
        - label: 购物
          values:
            - 中
            - 中
            - 中
            - 低
            - 中
        - label: 开发者 / 智能体触点
          values:
            - 低
            - 中
            - 低
            - 低
            - 新兴
    approximationNotes: 评级是有证据支撑的定性区间；公开成熟度强于公开披露的后端信息。
    claimRefs:
      - CE002
      - CE008
      - CE013
      - CE018
      - CE025
      - CE031
      - CE038
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，客户先诊断可见性，再做内容或技术动作，随后扩展到更广的工作流。
    data:
      items:
        - label: 发现
          detail: 团队识别 AI 可见性问题或增长机会
        - label: 配置
          detail: 配置提示词、仪表盘，有时也接入日志
        - label: 诊断
          detail: Profound 找出引用、竞争对手和薄弱点
        - label: 行动
          detail: 部署内容、技术或智能体工作流
        - label: 扩展
          detail: 跑通的团队加智能体、更多提示词或更多市场
    approximationNotes: 旅程来自公开案例研究中反复出现的模式，而不是公司发布的生命周期图。
    claimRefs:
      - CU016
      - CU022
      - CU023
      - CU027
      - CU037
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开漏斗从广泛 logo 证明，收敛到少量有详细可衡量结果的案例研究。
    data:
      items:
        - label: 公开 logo
          value: 700
        - label: 具名企业证明
          value: 70
        - label: 详细客户故事
          value: 9
        - label: 带转化指标的案例
          value: 4
    approximationNotes: 只有顶层的 700 个客户来自公司披露。其余阶段是公开证据计数，用来说明证据密度逐层收缩，并非公司指标。
    claimRefs:
      - CU001
      - CU004
      - CU015
      - CU033
      - CU035
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开客户证明在结果和生产深度上最强，在付费状态和续约透明度上最弱。
    data:
      columns:
        - 结果具体度
        - 生产环境证据
        - 留存可见度
        - 付费状态确定性
      rows:
        - label: Ramp
          values:
            - 高
            - 高
            - 低
            - 中
        - label: OpusClip
          values:
            - 高
            - 高
            - 低
            - 中
        - label: 客户：Arizona College of Nursing
          values:
            - 高
            - 高
            - 低
