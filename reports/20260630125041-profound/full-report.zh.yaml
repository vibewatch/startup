  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与信任风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管图景比商业和平台图景更干净。Profound 发布了隐私政策、主订阅协议和漏洞报告渠道，说明基础信任和采购材料
              是可见的，而不是黑箱。本次审阅的公开记录也没有发现公司面临诉讼、执法行动或重大制裁。上述事实都是真正的正面信号。
              但不能解读过头。隐私和合同文件描述的是义务，并不能证明运营卓越，也不能证明未来法律风险低。公开材料仍没有披露
              完整灾备计划、详细的分处理方控制，或足以让投资人放心排除企业风险的隐私事件记录。换句话说，公司没有明显法律火情， 也没有公开监管护城河。关键结论是，信任风险当前更像尽调缺口，而不是困境信号。
