            body: >-
              对企业买方而言，Profound 公开的信任姿态强于公开的后端细节。公司明确声称 SOC 2 Type II 合规、通过 SAML 或 OIDC 的 SSO、RBAC、静态和传输加密、GDPR
              合规，以及保留一周的每日备份。公司还公开漏洞报告页面，这是安全响应已运营化、而非隐藏起来的有用信号。这些都是有意义的正面因素，因为产品会接触网页日志、提示词、客户内容和潜在敏感的内部工作流。即便如此，公开记录仍停留在摘要层面。没有公开
              SOC 报告范围，没有详细灾备图，已审阅的产品页面中看不到正常运行时间承诺，也没有披露每日提示词运行如何计费或隔离。这足以支持企业就绪度的正面初筛，但不足以免除对可靠性、备份恢复和事件响应严谨度的尽调。
