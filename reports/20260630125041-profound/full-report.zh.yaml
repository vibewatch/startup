              Series C（$96M，Lightspeed Venture Partners 领投，2026 年 2 月 24 日）。

              Series C 新闻稿确认，现有投资人包括 Sequoia Capital、Kleiner Perkins、Evantic、Saga Ventures 和 South Park Commons。NVIDIA
