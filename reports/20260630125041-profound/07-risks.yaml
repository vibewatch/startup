  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: A full legal diligence file covering litigation searches, privacy controls, data-processing contracts, and incident history.
    whyItMatters: Public website materials cannot substitute for counsel-grade legal diligence.
    diligencePath: Run legal diligence with counsel and request a complete compliance packet.
    relatedQuestionRefs:
    - QR001
    - QR002
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: leadership-depth
    missingEvidence: A current executive org chart with finance, operations, security, and customer-success ownership.
    whyItMatters: Bench depth is central to scaling a complex and still-forming category.
    diligencePath: Request full management roster and role descriptions.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: reliability-evidence
    missingEvidence: Uptime, DR, RTO/RPO, and incident-response metrics.
    whyItMatters: Security claims are not enough to clear enterprise operating risk.
    diligencePath: Request SLA history, restoration tests, and postmortem samples.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: blocking
    topic: open-diligence-asks
    missingEvidence: Revenue disclosure, retention metrics, and observed win-loss data under platform changes.
    whyItMatters: These are the key facts needed to connect the risk register to financial outcomes.
    diligencePath: Request KPI deck, retention cohorts, and recent competitive loss analysis.
    relatedQuestionRefs:
    - QR030
acknowledgedWarnings:
- dimension: tableNotes
  reason: Each table already includes a note, but the chapter acknowledges tableNotes because several risk scores are analytic judgments built from public evidence and evidence gaps rather than audited risk logs.
