company:
  name: Profound
chapter:
  number: 7
  title: Risks
  summary: Profound’s public risk profile is shaped less by active legal distress and more by platform dependency, premium pricing, disclosure gaps, and leadership-depth questions. The company shows visible trust hygiene through published privacy, contract, and vulnerability documents, and no major public legal event surfaced in the reviewed materials. The more material risks are that answer-engine observability could degrade, bundled rivals could compress differentiation, and private-company opacity could hide whether the business is scaling efficiently enough to support its valuation.
sections:
- id: legal-and-trust-risk
  title: Legal, Regulatory, and Trust Risk
  body: The legal and regulatory picture is cleaner than the commercial and platform picture. Profound publishes a privacy policy, a master subscription agreement, and a vulnerability-reporting channel, which means baseline trust and procurement materials are visible rather than opaque. The public record reviewed here also did not surface a lawsuit, enforcement action, or major sanction against the company. Those are genuine positives. But they should not be over-read. The privacy and contract documents describe obligations; they do not prove operational excellence or low future legal risk. Public materials still do not reveal a full disaster-recovery plan, detailed subprocessor controls, or the kind of privacy-incident history that would let an investor clear enterprise risk with confidence. In other words, there is no obvious legal fire, but there is also no public regulatory moat. The key takeaway is that trust risk is currently a diligence gap problem more than a distress problem.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR018
  - CR019
  - CR024
  - CR034
  - CR035
