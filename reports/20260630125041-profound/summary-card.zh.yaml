  topStrengths:
    - Profound 是定义 AEO/GEO 品类的平台，拥有先发优势；这是一个真实市场，2026 年可服务支出 >$160M，CAGR 超过 43%
    - 独特数据护城河：截至 June 2026，Prompt Volumes 这类带人口统计维度、基于面板的 AI 搜索需求数据还没有直接对标竞品
    - Martech 独角兽路径最快 — 18 个月到 $1B，背后有 Lightspeed、Sequoia、Kleiner Perkins、NVIDIA、Khosla
    - '700+ 家企业客户，其中包括 10%+ Fortune 500，并有 Target、Walmart、Ramp、MongoDB、Figma 等强具名 logo；G2 2026 B2B Software 第 #34'
    - 读写一体平台优势：Profound Agents 区别于只做监测的竞争者，并形成工作流锁定
  topRisks:
    - ARR 或收入均未披露 — 若 ARR 估计为 $10–30M，$1B 估值意味着 30–100x ARR，即便对超高速增长 SaaS 也偏高
    - 客户数差异仍未解释（Dec 2025：1,000；Feb 2026 official：700+）— 可能意味着流失、统计口径变化或宣传夸大
    - SEO 既有厂商正在追上：Ahrefs Brand Radar 每 2 周增加 $1M ARR；Scrunch 被 Sitecore 收购；大安装基数还带来捆绑威胁
    - 关键人集中 — 愿景和执行都压在 2 位联合创始人身上；没有公开 COO、CFO 或 VP 继任计划
    - AI 平台依赖风险 — OpenAI、Google、Anthropic 的架构变化可能瞬间改变引用模式，让 AEO 产品输出失效
  unresolvedGaps:
    - ARR 和收入运行率 — 最关键估值输入仍未公开披露
    - 净收入留存率（NRR）— 支撑 SaaS 估值倍数的关键指标；未披露
    - December 2025（1,000 customers）与 February 2026（700+）客户数差异的对账
    - 完整董事会构成，以及联合创始人之下的 C-suite 梯队
    - 当前规模下的毛利率和单位经济模型
    - 定价权证据 — 按套餐层级披露流失率，用来验证溢价定价策略
