- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR / revenue run rate
    - Actual ARR and revenue bridge
    - Core multiple anchor
    - Request CFO or board KPI deck
  - - Retention / cohorts
    - NRR, GRR, churn, attach rates
    - Durability and expansion proof
    - Request cohort analysis
  - - Cap table / preferences
    - Dilution, liquidation stack, ownership
    - Determines entry economics
    - Request financing documents
  - - Win-loss vs incumbents
    - Recent deal outcomes versus bundled rivals
    - Tests moat in real market
    - Request sales ops summary
  - - Cash burn / runway
    - Cash on hand and burn
    - Links valuation to financing risk
    - Request treasury snapshot
  - - Comparable multiples
    - Direct public-market and private comp data
    - Frames downside / upside discipline
    - Run dedicated comp pull
  notes: These asks are ordered by what would change the valuation stance fastest.
