company:
  name: Profound
chapter:
  number: 8
  title: Valuation
  summary: Profound’s $1B February 2026 valuation is real, but its supportability remains under-disclosed because the company has not publicly shared ARR, retention, burn, or cap-table detail. Public evidence supports a strong market narrative, enterprise customer proof, and a product broad enough to justify serious interest, yet it also points to a stretched implied multiple if current ARR is only in the low tens of millions. The resulting recommendation is Research-more with a stretched valuation stance and medium confidence.
sections:
- id: valuation-context-and-current-price
  title: Valuation Context and Current Price
  body: 'The headline valuation fact is clear: Profound raised a $96M Series C at a $1B valuation in February 2026 after accumulating more than $155M in total funding. That round validates investor appetite, but it does not by itself validate present-day return potential. The core difficulty is that the company has not publicly disclosed ARR, revenue run rate, or retention. Public pricing exists, and customer proof is meaningful, yet those signals are not enough to convert a $1B post-money valuation into a high-confidence intrinsic view. On public evidence alone, the best that can be done is to model ranges and compare those ranges against the current price. That leads to an uncomfortable but useful result: the current valuation may be strategically understandable given category excitement and product ambition, but it is still too under-anchored to justify a confident positive recommendation. In other words, the round price is a fact, while the support behind it is still mostly inference.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV021
  tableRefs:
  - TV001
  figureRefs:
  - FV002
- id: thesis-anti-thesis-and-scenarios
  title: Thesis, Anti-Thesis, and Scenario Logic
  body: 'The bull case is not hard to articulate. Profound is operating in a fast-growing AI-discovery category, has enterprise logos, broad workflow product depth, and is clearly investing in category control through research, events, and solution packaging. If retention is strong and module attach is real, today’s valuation could eventually look early rather than aggressive. The anti-thesis is just as coherent. Adverse reviews highlight price and complexity, incumbents can bundle similar features into existing SEO stacks, and the company still withholds the financial metrics needed to prove that premium valuation is earned. The base case sits between those poles: customer proof is real, the market is attractive, but the current price already assumes a lot of future success. That mix argues for a scenario-based view in which upside exists, but downside is meaningful if the actual revenue base is much smaller than the narrative implies.'
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV019
  - CV020
  - CV026
  - CV030
  - CV032
  - CV033
  tableRefs:
  - TV002
  - TV003
  figureRefs:
