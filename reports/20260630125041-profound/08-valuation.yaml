- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR still undisclosed
    - No credible revenue disclosure by next diligence cycle
    - Keeps valuation anchored to guesses
    - Maintain or downgrade
  - - Retention weak or unknown
    - NRR / churn disclosure disappoints or remains absent
    - Undercuts durable-platform thesis
    - Cut upside assumptions
  - - Platform observability weakens
    - Major answer engines become materially harder to measure
    - Hurts product usefulness and differentiation
    - Re-rate moat
  - - Bundled rivals win core deals
    - Win-loss data shows repeated losses to suites
    - Compresses pricing power
    - Tighten TAM and multiple
  - - Customer-count noise persists
    - Definitions remain inconsistent
    - Damages credibility
    - Raise diligence hurdle
  notes: Kill triggers focus on observable events that would change the recommendation, not on generic downside commentary.
