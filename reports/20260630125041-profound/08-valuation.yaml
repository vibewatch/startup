  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table
    missingEvidence: Direct public-market and private-market valuation multiple sources for each named comparable lens.
    whyItMatters: Without actual comp pulls, the comparable framework remains conceptual and cannot tightly bound downside or upside.
    diligencePath: Run a dedicated comparables pull for Sprinklr, Similarweb, Yext, and relevant private analogs.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: ARR, revenue run rate, NRR, churn, burn, and cash on hand.
    whyItMatters: These are the decisive inputs for moving from narrative valuation to investable underwriting.
    diligencePath: Request the latest KPI deck and operating plan from management.
    relatedQuestionRefs:
    - QV027
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cap table, liquidation preferences, dilution assumptions, and ownership after the Series C.
    whyItMatters: Returns depend on entry economics, not just headline enterprise value.
    diligencePath: Request financing documents or a cap-table summary.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: recommendation-upgrade
    missingEvidence: Private evidence showing revenue base and retention are materially stronger than the low-confidence public estimate.
    whyItMatters: A recommendation stronger than Research-more would require proof that current valuation support is underwritten, not inferred.
    diligencePath: Request revenue bridge, retention cohorts, and competitive win-loss data.
    relatedQuestionRefs:
    - QV029
acknowledgedWarnings:
- dimension: tableNotes
  reason: Every table includes note text, but the chapter acknowledges tableNotes because scenario values and comparable lenses necessarily synthesize public evidence instead of audited valuation models.
