companyProfile:
  summary: >
    Profound (legal name Cooper Square Technologies Inc.) is a New York City-based enterprise
    SaaS platform for Answer Engine Optimization (AEO) and AI brand visibility, founded in
    August 2024 by James Cadwallader (CEO) and Dylan Babbs (CTO). The company enables marketing
    teams at Fortune 500 enterprises to track, analyze, and influence how their brands appear
    in AI-generated answers from ChatGPT, Perplexity, Google AI Overviews, Gemini, Copilot,
    Claude, Grok, and other AI assistants. Profound raised $155M+ across four rounds in 18
    months, reaching unicorn status ($1B valuation) in February 2026. Its key differentiators
    include Prompt Volumes (unique panel-based AI search demand data with demographics),
    Profound Agents (autonomous AI marketing agents), and the broadest engine coverage in the
    category (10+ platforms). Profound serves 700+ enterprise customers including 10%+ of the
    Fortune 500 in CPG, Fintech, Retail, Pharma, Consumer Tech, and B2B Tech verticals.
  foundedDate: "2024-08-01"
  founders:
    - name: James Cadwallader
      role: Co-Founder & CEO
      background: "Co-founded Profound at South Park Commons NYC; external face of fundraising and company vision"
      claimRefs: [CO008]
    - name: Dylan Babbs
      role: Co-Founder & CTO
      background: "Technical co-founder; Sequoia Capital founder profile; emphasized world-class NYC engineering team"
      claimRefs: [CO009]
  foundingLocation: "New York City, NY"
  headquarters: "New York City, NY (1 Union Square West, 2nd floor)"
  productSummary: >
    Profound is a SaaS platform with five product modules: Answer Engine Insights (brand mention
    tracking, citation analysis, sentiment, share of voice across AI platforms), Prompt Volumes
    (panel-sourced real AI search demand data with demographics), Agent Analytics (AI crawler
    activity monitoring), Shopping (AI shopping journey visibility), and Profound Agents
    (autonomous marketing agents for content creation, optimization, and publishing). SOC2 Type
    II certified with SSO/RBAC for enterprise compliance.
  customerFocus: >
    Enterprise marketing teams at Fortune 500 and high-growth companies seeking to measure and
    improve their brand's AI search visibility, primarily in CPG, Retail, Fintech, Pharma,
    Consumer Tech, and B2B Tech verticals.
  businessModel: >
    SaaS subscription with tiered pricing: Starter ($99/month, 50 prompts, ChatGPT only),
    Growth ($399/month, 3 engines, 100 prompts), Enterprise (custom pricing, up to 10 engines,
    SSO/SOC2). Primary revenue from annual enterprise contracts.
  stage: "Series C"
  fundingStatus: "$96M Series C at $1B valuation (Feb 24, 2026); $155M+ total raised"
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO016, CO026]

summary:
  headline: >
    Profound is the best-funded and most-recognized platform in a real and rapidly growing
    category, but the $1B valuation looks stretched without ARR disclosure, and incumbent
    SEO vendors are closing the product gap quickly.
  overallScore: 7.2
  recommendation: research-more
  confidence: medium
  riskRating: medium
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 155
    customerCount: 700
    headcount: 82
  topStrengths:
    - "Category-defining platform with first-mover advantage in AEO/GEO — a real market with >$160M addressable spend in 2026 growing at 43%+ CAGR"
    - "Unique data moat: Prompt Volumes (panel-based AI search demand with demographics) has no direct competitor equivalent as of June 2026"
    - "Fastest martech unicorn trajectory — $1B in 18 months backed by Lightspeed, Sequoia, Kleiner Perkins, NVIDIA, Khosla"
    - "700+ enterprise customers including 10%+ Fortune 500 with strong named logos (Target, Walmart, Ramp, MongoDB, Figma); G2 #34 B2B Software 2026"
    - "Read/write platform advantage: Profound Agents differentiates from monitoring-only competitors and creates workflow lock-in"
  topRisks:
    - "No ARR or revenue disclosed — $1B valuation implies 30–100x ARR at estimated $10–30M range, which is stretched even for hypergrowth SaaS"
    - "Customer count discrepancy (Dec 2025: 1,000 vs Feb 2026 official: 700+) unresolved — could indicate churn, methodology change, or promotional inflation"
    - "SEO incumbents closing the gap: Ahrefs Brand Radar growing at $1M ARR every 2 weeks; Scrunch acquired by Sitecore; bundling threat from large install bases"
    - "Key-person concentration — all vision and execution concentrated in 2 co-founders; no public COO, CFO, or VP succession plan"
    - "AI platform dependency risk — OpenAI, Google, Anthropic architecture changes can instantly alter citation patterns and invalidate AEO product outputs"
  unresolvedGaps:
    - "ARR and revenue run rate — most critical valuation input not publicly disclosed"
    - "Net Revenue Retention (NRR) — critical for justifying SaaS valuation multiple; not disclosed"
    - "Reconciliation of December 2025 (1,000 customers) vs February 2026 (700+) customer count discrepancy"
    - "Full board composition and C-suite bench below co-founders"
    - "Gross margin and unit economics at current scale"
    - "Pricing power evidence — churn rate by plan tier to validate premium pricing strategy"

