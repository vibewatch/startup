- id: moat-switching-costs-and-distribution
  title: Moat, Switching Costs, and Distribution
  body: 'Profound’s moat is real but conditional. Prompt Volumes looks like the strongest differentiated asset because multiple reviews call out its demand data as unusual, and that kind of signal is harder to reproduce than a dashboard or crawler. Agent Analytics and the workflow layer also add depth, especially when customers instrument their web stack and operationalize output through agents. At the same time, none of the public evidence suggests exclusive access to model outputs or hard platform lock-in. Much of the category still looks like overlay software, which means multi-homing remains plausible and switching costs remain moderate at best. Distribution partnerships improve the picture: the Vercel marketplace, partner program, and Parallel case study all imply that Profound can meet customers inside adjacent workflows rather than only through direct sales. But those partnerships are non-exclusive, so they strengthen readiness more than they create defensibility. The moat works best
    when product breadth, partner deployment, and enterprise trust reinforce each other in the same account.'
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP020
