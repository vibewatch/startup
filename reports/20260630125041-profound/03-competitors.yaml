  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Win-loss data showing how often customers run Profound alongside another AEO tool and what triggers consolidation.
    whyItMatters: Competitive durability depends on whether the platform becomes embedded or remains easy to swap.
    diligencePath: Ask management for competitive displacement data, module attach rates, and renewal reasons by segment.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: premium-pricing-proof
    missingEvidence: Cohort-level outcome data proving that premium pricing produces materially higher ROI than cheaper competitors.
    whyItMatters: The willingness of customers to pay enterprise pricing is central to moat durability and long-term margin structure.
    diligencePath: Request customer ROI case studies with before/after baselines, deployment time, and realized usage by module.
    relatedQuestionRefs:
    - QP028
    - QP027
  - type: missing-source
    severity: minor
    topic: competitive-win-rate
    missingEvidence: Independent win-rate evidence against Ahrefs Brand Radar, Scrunch, and AthenaHQ in current enterprise deals.
    whyItMatters: Public marketing pages do not reveal whether Profound consistently wins against the most credible rivals.
    diligencePath: Ask for anonymized top-20 enterprise competitive bake-offs from 2026.
  - type: stale
    severity: minor
    topic: scrunch-acquisition
    missingEvidence: A primary source confirming how Sitecore ownership changes Scrunch product investment and channel reach.
    whyItMatters: The acquisition could materially alter the threat level of a direct competitor.
    diligencePath: Refresh competitor research once Sitecore publishes an integrated product roadmap or pricing update.
    relatedQuestionRefs:
    - QP008
