evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: ARR, revenue run rate, gross margin, and net revenue retention (NRR) for Profound
    whyItMatters: >-
      Private financials are unavailable; without ARR the $1B valuation multiple cannot be computed and investment case
      relies on growth narrative rather than metrics
    diligencePath: Request audited financials or ARR confirmation from Profound investor relations or directly from the lead investor
    relatedQuestionRefs:
      - QO015
      - QO017
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board composition, C-suite structure below co-founders, and voting rights
    whyItMatters: Governance structure and key-person succession are unverifiable from public sources
    diligencePath: Request board observer rights, articles of incorporation, and full org chart during due diligence
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: milestone-table-precision
    missingEvidence: Precise dates for Series A and Series B rounds; only Series C (Feb 24, 2026) and Seed (Aug 2024) are confirmed
    whyItMatters: Milestone timeline completeness affects analysis of financing velocity and product launch cadence
    diligencePath: Request exact round close dates from Profound or lead investors; check SEC EDGAR for any 506(b)/506(c) filings
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: customers
    missingEvidence: >-
      Reconciliation of December 2025 (1,000 enterprise customers) vs February 2026 (700+ enterprises) customer count
      discrepancy
    whyItMatters: >-
      Unresolved count conflict may indicate customer churn, methodology change, or promotional inflation; affects
      retention rate estimation
    diligencePath: Request definition of 'enterprise customer,' monthly active customer count, and ARR customer split from Profound
    relatedQuestionRefs:
      - QO005
      - QO014
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: headcount-current
    missingEvidence: >-
      Current headcount as of June 2026; SF blog reported 82 employees in December 2025 but June 2026 figure is
      unconfirmed
    whyItMatters: Headcount validates burn rate, organizational scale, and hiring pace; stale figure is 6+ months old
    diligencePath: Check LinkedIn employee count for Cooper Square Technologies or request current headcount from Profound
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: leadership-below-cofounders
    missingEvidence: >-
      Full exec roster below co-founders (VP Engineering, VP Product, VP Sales, Head of Finance) and complete board
      composition
    whyItMatters: Leadership depth below co-founders affects key-person risk assessment and succession planning
    diligencePath: Request org chart and board composition from Profound during due diligence; check LinkedIn
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-size-validated
    missingEvidence: Gartner, IDC, or Forrester market sizing report for AEO/GEO software platforms
    whyItMatters: >-
      All current sizing estimates are from low-reputation research firms with no disclosed methodology; credible
      third-party sizing is needed for investor-grade market analysis
    diligencePath: >-
      Search Gartner Research portal, IDC MarketScape, and Forrester Wave for 'AI marketing analytics' or 'generative
      search optimization' categories
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: profound-sam-revenue-allocation
    missingEvidence: Enterprise marketing budget allocation to AI visibility tools specifically vs. total marketing technology spend
    whyItMatters: >-
      SAM derivation requires understanding what share of enterprise marketing budget is allocated to AI visibility;
      without this Profound's SAM is highly speculative
    diligencePath: Request Gartner CMO survey data on AI marketing budget allocation; survey Profound's customer procurement teams
    relatedQuestionRefs:
      - QM021
  - type: conflicting-data
    severity: material
    topic: chatgpt-user-counts
    missingEvidence: Verified ChatGPT weekly/daily active user count from OpenAI or SEC filing
    whyItMatters: >-
      Market size rationale depends on AI platform scale; conflicting estimates (810M daily vs 900M weekly) from
      different sources create uncertainty
    diligencePath: Track OpenAI quarterly earnings calls or SEC filings for official user count disclosures
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: minor
    topic: regulatory-ai-search
    missingEvidence: EU AI Act, FTC guidance, or other regulatory framework implications for AI content optimization practices
    whyItMatters: Regulatory constraints on AI content optimization could affect GEO adoption rates and compliance requirements
    diligencePath: Monitor EU AI Act implementation timeline; track FTC AI transparency guidance for marketing applications
    relatedQuestionRefs:
      - QM019
  - type: private-evidence-only
