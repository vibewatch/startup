  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr-disclosure
    missingEvidence: Actual ARR, revenue run rate, and monthly recurring revenue by segment.
    whyItMatters: These numbers are the core anchors for valuation, revenue quality, and financing need.
    diligencePath: Request the latest board KPI pack or audited management accounts.
    relatedQuestionRefs:
    - QI025
    - QI030
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, conversion funnel, and average sales cycle.
    whyItMatters: Without these metrics it is impossible to judge whether growth is efficient or venture-subsidized.
    diligencePath: Request a cohort-based GTM efficiency model from management.
    relatedQuestionRefs:
    - QI027
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand, burn rate, and internal runway plan.
    whyItMatters: Capital adequacy cannot be validated from fundraising headlines alone.
    diligencePath: Request treasury dashboard or monthly cash-flow reporting.
    relatedQuestionRefs:
    - QI029
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, ACV distribution, and module attach by cohort.
    whyItMatters: Revenue quality and expansion potential remain untestable without retention data.
    diligencePath: Request cohort retention tables by customer segment and product.
    relatedQuestionRefs:
    - QI012
acknowledgedWarnings:
- dimension: tableNotes
  reason: Every table includes note text, but the chapter acknowledges tableNotes because several rows carry directional estimates and management-only gaps rather than audited figures.
