company:
  name: Profound
chapter:
  number: 4
  title: Financials
  summary: Profound shows strong financing access and a clearly enterprise-oriented monetization model, but almost every metric needed for a clean financial verdict remains private. Public evidence supports subscription pricing at $99 and $399 for entry tiers, custom enterprise contracting for the core business, and $155M+ of total funding including a $96M Series C at a $1B valuation. The chapter’s core conclusion is that the business looks commercially promising but financially under-disclosed, with ARR, retention, and burn remaining the decisive blockers.
sections:
- id: pricing-and-revenue-model
  title: Pricing and Revenue Model
  body: 'Profound’s public monetization surface is narrow but revealing. The pricing page exposes a $99 Starter tier and a $399 Growth tier, yet the enterprise page and contact-sales flow make clear that the core business is designed around custom contracts. The Master Subscription Agreement adds another signal: actual service delivery depends on order-specific limits, supplemental terms, support obligations, and data-processing commitments. That structure looks much more like an enterprise SaaS vendor than a pure self-serve software subscription. The likely conclusion is that the posted plans exist to widen funnel coverage and create proof-of-value, while economic weight sits in larger annual contracts and add-on modules such as Agent Analytics or workflow layers. That is directionally positive for ACV and expansion potential, but it also means the public list price is a weak proxy for realized revenue mix. Investors can see how Profound intends to charge, yet they still cannot see what
    customers actually pay, how contracts renew, or whether self-serve converts into enterprise-scale revenue.'
  claimRefs:
  - CI003
  - CI004
  - CI007
  - CI008
  - CI016
  - CI017
  - CI025
  - CI026
  - CI030
  - CI033
  - CI039
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-estimates-and-unit-economics
  title: Traction, Estimates, and Unit Economics
  body: 'The public record offers strong commercial signals and weak financial disclosure. Profound and multiple news sources say the company serves more than 700 enterprises and more than 10% of the Fortune 500, which is meaningful customer proof for a young company. But those traction signals never resolve into ARR, GAAP revenue, billings, or profitability. Any current financial view therefore has to be estimated. A reasonable public-evidence ARR range is roughly $10M to $30M, while a software-like gross-margin range of 70% to 80% appears plausible given the company’s model, offset by log ingestion, agent workloads, support, and data processing costs. Those estimates are useful for framing the business, but they are not enough to underwrite entry valuation with confidence. Unit economics are even thinner: CAC, payback, NRR, churn, and services mix all remain private. The core financial puzzle is not whether demand exists, but whether that demand converts into efficient and durable recurring
    revenue.'
  claimRefs:
  - CI006
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
