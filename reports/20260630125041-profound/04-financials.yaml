- id: capital-adequacy-and-financing-risk
  title: Capital Adequacy and Financing Risk
  body: 'Profound’s funding record is strong enough to reduce immediate survival risk. The company has raised more than $155M in a compressed timeline from seed through a $96M Series C at a $1B valuation, which strongly suggests investor demand and provides room to keep building product, data assets, and enterprise go-to-market capacity. At the same time, the same public evidence leaves critical blanks: cash on hand, monthly burn, runway, debt, and next-round trigger are all missing. That gap matters because a well-funded company can still be financing-dependent if it is scaling category creation faster than cash generation. Official materials repeatedly emphasize expansion, category leadership, and product acceleration rather than margin discipline. In other words, capital adequacy is credible only in the narrow sense that Profound has raised a lot, not in the stronger sense that its current operating model is self-sustaining. The company looks financeable; it does not yet look financially
    transparent.'
  claimRefs:
  - CI001
  - CI002
  - CI020
  - CI021
  - CI022
  - CI027
  - CI031
  - CI032
  - CI038
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: financial-verdict-and-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial verdict is therefore mixed. On the positive side, Profound has enterprise pricing, large-customer proof, strong venture support, and a contract structure that could support high ACVs and multi-module expansion. On the negative side, virtually every metric needed to confirm revenue quality is absent from the public record. There is no disclosed ARR, no retention data, no cash-flow statement, no services mix, and no evidence that public pricing bears any resemblance to realized contract economics. Adverse reviews add a further warning that premium pricing may cap adoption outside the enterprise core. Taken together, the public record supports the view that Profound is commercially promising but financially under-disclosed. That is enough to justify continued diligence, not enough to justify a confident underwriting of revenue quality or margin durability. The central blocker is straightforward: management must provide revenue, retention, and burn data before the financial
    story can move from plausible to investable.'
  claimRefs:
  - CI023
  - CI024
  - CI029
  - CI035
  - CI036
  - CI038
  - CI039
  - CI040
