- id: trust-security-and-operating-readiness
  title: Trust, Security, and Operating Readiness
  body: For enterprise buyers, Profound’s public trust posture is stronger than its public backend detail. The company explicitly claims SOC 2 Type II compliance, SSO through SAML or OIDC, RBAC, encryption at rest and in transit, GDPR compliance, and daily backups retained for one week. It also exposes a vulnerability-reporting page, which is a useful signal that security response is operationalized rather than hidden. These are meaningful positives because the product touches web logs, prompts, customer content, and potentially sensitive internal workflows. Even so, the public record remains summary-level. There is no public SOC report scope, no detailed disaster-recovery diagram, no uptime commitment visible in the product pages reviewed here, and no disclosure of how daily prompt runs are costed or isolated operationally. That is enough for a positive enterprise-readiness first pass, but not enough to remove diligence on reliability, backup restoration, or incident-response rigor.
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE021
  - CE033
  - CE034
  - CE038
  tableRefs:
  - TE004
  figureRefs: []
- id: roadmap-and-technology-verdict
  title: Roadmap, Differentiation, and Technology Verdict
  body: 'The direction of travel is clear: Profound is broadening from AI visibility into a wider agent-experience and AI-discovery operating layer. Query fan-out, sentiment, Shopping, agent templates, Profound Index, and the agent-experience thought pieces all point in that direction. The product’s best technical differentiation appears to be the closed loop from detection to action to re-measurement, supported by a proprietary prompt-demand dataset and a workflow system that can operationalize it. That is a stronger story than a simple monitor-only category claim. The main caution is that public feature disclosure still outruns public architecture disclosure. Investors can see what the product does more clearly than how it scales, recovers, or protects margins under heavy usage. On balance, the product appears mature enough for enterprise deployment and category leadership, but technology diligence should still focus on resilience, cost structure, and external dependency concentration.
    today.'
