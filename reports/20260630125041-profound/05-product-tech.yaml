  summary: The public architecture stacks data capture, analysis, workflow automation, and partner outputs.
  data:
    layers:
    - label: External AI and web platforms
      detail: Answer engines, customer sites, log sources, and retail surfaces create the raw observability inputs.
    - label: Data capture + diagnostics
      detail: Prompt tracking, browser-captured answers, crawler verification, and log forwarding collect evidence.
    - label: Analysis layer
      detail: Visibility scoring, citation analysis, sentiment, and benchmarking turn raw evidence into interpretable metrics.
    - label: Action layer
      detail: Agents, templates, and optimization guidance convert insights into briefs and executable changes.
    - label: Output layer
      detail: Teams ship content, technical fixes, and merchant updates, then remeasure the result in Profound.
  approximationNotes: Layering is inferred from feature pages and docs; it is not a published internal systems diagram.
