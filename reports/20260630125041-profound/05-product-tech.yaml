  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-disclosure
    missingEvidence: Public or management-provided uptime, RTO/RPO, and restoration-testing evidence.
    whyItMatters: Enterprise deployment risk cannot be judged from backup and security bullet points alone.
    diligencePath: Request SLA, DR architecture, and restoration test logs.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: architecture-detail
    missingEvidence: Backend topology, storage design, multi-tenant isolation, and cost-control details for daily prompt execution.
    whyItMatters: Feature breadth is visible, but scale and margin durability depend on the hidden technical architecture.
    diligencePath: Request architecture review with engineering leadership.
    relatedQuestionRefs:
    - QE026
    - QE028
  - type: private-evidence-only
    severity: minor
    topic: engine-coverage
