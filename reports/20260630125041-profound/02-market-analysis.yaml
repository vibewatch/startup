callouts:
  - calloutType: strength
    title: Accelerating AI-to-Commerce Shift Creates Massive Urgency
    body: >
      With 35% of US consumers now using AI at the product discovery stage and zero-click search
      growing from 56% to 69% in one year, the marketing-to-AI problem is no longer hypothetical.
      Enterprise CMOs face measurable brand equity risk, creating high-urgency purchasing. Profound
      is positioned as the category-defining solution.
    claimRefs:
      - CM021
      - CM022
      - CM026

  - calloutType: risk
    title: Market Size Estimates Are Unreliable and Methodologically Weak
    body: >
      The two Dimension Market Research estimates conflict 5x ($161M vs $848M) due to definitional
      differences. No Gartner, IDC, or Forrester report independently sizes the AEO/GEO software
      market. Profound's own market projections ($2.5T AI commerce by 2027) are aspirational
      framing without disclosed methodology. Investors should treat all market sizing as
      directional compass, not investable precision.
    claimRefs:
      - CM031
      - CM032
      - CM033

  - calloutType: risk
    title: SEO Incumbents Pose a Real Bundling Threat
    body: >
      Established SEO platforms (Ahrefs, SEMrush, BrightEdge) have large enterprise install
      bases and distribution channels. If they ship credible GEO features at no incremental cost,
      Profound's enterprise pricing premium could face structural compression. The window for
      differentiated data moat (Prompt Volumes) may be 12-24 months before incumbents catch up.
    claimRefs:
      - CM004
      - CM028
      - CM029

