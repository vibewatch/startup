  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The primary growth driver is the secular shift from traditional search to AI-mediated
      discovery. Gartner predicted in February 2024 that traditional search engine volume would
      drop 25% by 2026, and third-party statistics confirm structural acceleration:
      AI Overviews appear in 25.11% of Google searches (Conductor 2026); zero-click searches grew
      from 56% to 69% following Google AI Overviews' rollout (Similarweb July 2025); 35% of US
      consumers now use AI at the product discovery stage vs. 13.6% using traditional search
      (Similarweb 2026 Generative AI Brand Visibility Index); ChatGPT has over 900 million weekly
      active users globally.

      A Princeton/Georgia Tech/Allen Institute/IIT Delhi study (KDD 2024) demonstrated that GEO
      techniques boost content visibility in AI responses by up to 40%, giving enterprise teams
      a quantifiable ROI argument for AEO investment.

      Key adoption constraints include: (1) high cost — Profound is estimated at 48% above
      category average pricing; (2) nascent market maturity — only 40.6% of marketers who plan
      to implement GEO are actually doing so currently (ConvertMate GEO Benchmark 2026); (3) AI
      platform instability — AI answer engines change citation patterns and architectures
      frequently, creating product maintenance risk for AEO vendors; (4) switching costs are
      currently low since the category is new and customers haven't deeply integrated; (5) ROI
      measurement is still maturing — AI-attributed traffic is a small fraction of total referrals
      and proving causality from AEO spend to revenue requires custom attribution work.
    claimRefs:
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
    tableRefs:
      - TM004
    figureRefs:
      - FM004

  - id: market-gaps-contradictions
    title: Sizing Gaps and Contradictory Estimates
    body: >
      Several contradictions and gaps exist in the market evidence:

      1. The Dimension AEO estimate ($161M, 43% CAGR) vs. the Dimension GEO estimate ($848M,
         50.5% CAGR) differ by 5x at similar vintages due to boundary definitional differences.
         Neither is independently verified by a third party as of the research date.

      2. ChatGPT user count varies by source: "810 million daily" (Superlines/Writesonic CEO
         cited), "900 million weekly" (Superlines), and "1 billion weekly" (Profound's own
         marketing materials). These may reflect different measurement periods or rounding.

      3. The AI commerce impact projection — $2.5 trillion by 2027 (Profound Series B blog) and
         "$1 trillion of Google's $2.4 trillion shifting to ChatGPT within 5 years"
         (Rankability review) — are company-claimed forward projections without disclosed
         methodology, treated as aspirational framing, not investable market sizing.

      4. There is no reliable public data on the share of enterprise marketing budgets currently
         allocated to AI visibility tools specifically, making SAM derivation highly speculative.

      5. AEO/GEO market reports are almost exclusively from small research shops (Dimension,
         ConvertMate, Superlines) with limited brand recognition and no disclosed methodology.
         No Gartner, IDC, or Forrester report specifically sizes the AEO/GEO software market
         as of the research date.
    claimRefs:
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035

