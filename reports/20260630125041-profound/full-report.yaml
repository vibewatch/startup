        blocks:
          - type: paragraph
            body: >-
              Profound’s funding record is strong enough to reduce immediate survival risk. The company has raised more
              than $155M in a compressed timeline from seed through a $96M Series C at a $1B valuation, which strongly
              suggests investor demand and provides room to keep building product, data assets, and enterprise
              go-to-market capacity. At the same time, the same public evidence leaves critical blanks: cash on hand,
              monthly burn, runway, debt, and next-round trigger are all missing. That gap matters because a well-funded
              company can still be financing-dependent if it is scaling category creation faster than cash generation.
              Official materials repeatedly emphasize expansion, category leadership, and product acceleration rather
              than margin discipline. In other words, capital adequacy is credible only in the narrow sense that
              Profound has raised a lot, not in the stronger sense that its current operating model is self-sustaining.
              The company looks financeable; it does not yet look financially transparent.
