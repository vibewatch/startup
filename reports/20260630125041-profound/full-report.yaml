        title: Funding History and Investor Profile
        blocks:
          - type: paragraph
            body: >
              Profound raised more than $155M in total funding across four rounds in approximately 18 months, reaching
              unicorn status ($1B valuation) in February 2026 with its Series C. The round sequence was: Seed ($3.5M,
              August 2024), Series A ($20M, led by Kleiner Perkins, ~May 2025), Series B ($35M, led by Sequoia Capital,
              ~September/October 2025), and Series C ($96M, led by Lightspeed Venture Partners, February 24, 2026).

              The Series C press release confirmed investors include Sequoia Capital, Kleiner Perkins, Evantic, Saga
              Ventures, and South Park Commons as existing participants. NVIDIA NVentures and Khosla Ventures
              participated in the Series A. Angel investors include Guillermo Rauch (Vercel CEO), Karim Atiyeh (Ramp
              CEO), and others. The Series A announcement confirmed Ilya Fushman of Kleiner Perkins joining the board.
              The Kleiner Perkins perspective article cited Anas Biad, Brian Halligan, and Alfred Lin as Series B leads
              from Sequoia.

              The $1B valuation was achieved one day before Profound's 18-month anniversary (August 2024 founding + 18
              months = ~February 2026). Revenue run rate and ARR are not publicly disclosed. There is no disclosed debt,
              credit facility, or secondary transaction on record. Independent analyst Rankability noted Profound's
              funding trajectory makes it "the most-funded platform in AI visibility."
