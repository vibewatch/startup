              - CR036
      - number: '7.3'
        title: People, Financial, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The public record also points to execution risk concentrated in disclosure quality and bench depth.
              Profound has raised abundant capital, which lowers immediate survival risk, but that same capital
              abundance can hide unresolved issues around revenue quality, finance discipline, or go-to-market
              efficiency. The absence of public ARR disclosure and the conflict in customer counts are not cosmetic
              misses; they are credibility risks that make it harder to assess whether growth is efficient and durable.
              Leadership concentration compounds the issue. The founders are highly visible, but the reviewed sources do
              not surface a comparably visible finance or operating bench. Meanwhile, the product category requires
              coordination across engineering, marketing, customer education, and security, as well as “marketing
              engineer” style operators who may be scarce. None of this proves failure. It does mean the company still
              needs to demonstrate that process maturity is catching up with category ambition.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR025
              - CR026
              - CR031
              - CR037
              - CR039
          - type: table
            tableRef: TR004
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR021
              - CR037
      - number: '7.4'
        title: Mitigations and Risk Verdict
        blocks:
          - type: paragraph
            body: >-
              Profound is not a distressed business; it is a high-velocity, high-dependence business. Public mitigants
              are real: legal documents are visible, security controls are described, financing is abundant, and the
              company is actively shaping category education. But the open risks are equally real: platform
              observability could shift, bundling could compress value, customer and revenue disclosure remain thin, and
              leadership depth is not fully visible. The right way to read the public record is therefore not “safe” or
              “unsafe,” but “manageable with diligence.” The company can plausibly mitigate many of these issues if it
              proves retention, expands the executive bench, and demonstrates resilience under platform change. Until
              then, the risk profile should be treated as elevated but monitorable, with specific kill triggers around
              unresolved financial opacity, deteriorating observability, and repeated competitive losses to cheaper
              bundled alternatives. The next refresh should specifically test whether management can show bench
              expansion, retention durability, and stable measurement quality under real platform change.
            claimRefs:
              - CR032
              - CR033
              - CR038
              - CR040
          - type: table
            tableRef: TR005
