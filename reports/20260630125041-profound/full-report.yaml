      - number: '5.2'
        title: Architecture, Integrations, and Dependencies
        blocks:
          - type: paragraph
            body: >-
              Public materials imply a modular architecture with clear layers. Prompt capture, browser-observed answers,
              and log ingestion sit underneath analytics such as visibility scoring, citation analysis, query fan-out,
              and sentiment monitoring. Those insights then feed agents, templates, and partner-connected workflows. The
              technical advantage is not that Profound owns a proprietary consumer endpoint; it is that it organizes
              multiple external data surfaces into a usable operating model. Integrations across CDNs, web platforms,
              and partner surfaces like Vercel strengthen that model by reducing implementation friction and expanding
              deployment options. But this architecture is dependency-heavy by design. If answer engines reduce
              observability, if customer log pipelines are weak, or if partner channels change, the fidelity of the
              product can weaken. That does not mean the architecture is fragile today, but it does mean the most
              important diligence questions sit around dependence, implementation effort, and the resilience of the
              measurement loop rather than around UI polish.
