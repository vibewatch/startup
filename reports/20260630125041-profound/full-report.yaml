companyProfile:
  summary: >
    Profound (legal name Cooper Square Technologies Inc.) is a New York City-based enterprise SaaS platform for Answer
    Engine Optimization (AEO) and AI brand visibility, founded in August 2024 by James Cadwallader (CEO) and Dylan Babbs
    (CTO). The company enables marketing teams at Fortune 500 enterprises to track, analyze, and influence how their
    brands appear in AI-generated answers from ChatGPT, Perplexity, Google AI Overviews, Gemini, Copilot, Claude, Grok,
    and other AI assistants. Profound raised $155M+ across four rounds in 18 months, reaching unicorn status ($1B
    valuation) in February 2026. Its key differentiators include Prompt Volumes (unique panel-based AI search demand
    data with demographics), Profound Agents (autonomous AI marketing agents), and the broadest engine coverage in the
    category (10+ platforms). Profound serves 700+ enterprise customers including 10%+ of the Fortune 500 in CPG,
    Fintech, Retail, Pharma, Consumer Tech, and B2B Tech verticals.
