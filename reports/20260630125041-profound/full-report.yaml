        title: Founding Team and Leadership
        blocks:
          - type: paragraph
            body: >
              Profound was co-founded by James Cadwallader (CEO) and Dylan Babbs (CTO), who met at South Park Commons in
              New York City. Both founders identified the mainstream adoption of Answer Engines as a major inflection
              point for marketing technology and chose NYC as headquarters given its concentration of marketing and
              agency talent.

              James Cadwallader serves as CEO and is the public face of company communications, representing Profound at
              investor announcements and external speaking engagements. Dylan Babbs serves as CTO with responsibility
              for engineering; he previously emphasized the company's ambition to build a "world-class engineering team
              in the heart of Manhattan."

              The Series A investor Ilya Fushman (Kleiner Perkins) joined the board of directors per the Series A
              announcement, bringing SaaS institutional governance experience. Sequoia Capital (Alfred Lin and others)
              joined for the Series B; Lightspeed (Sachin Patel) led the Series C. The OfficialBoard org-chart page
              returned a 403 status during research, leaving a gap in the complete executive roster below VP level.

              Profound operates as an in-person team five days per week across its four offices. The SF office blog
              (December 2025) reported 82 employees at that time. The careers page lists open roles across Customer
              Success, Engineering, and GTM in New York, London, San Francisco, and Buenos Aires. With its $155M in
              total funding and rapid growth, the company represents a key-person dependency risk concentrated in the
              two co-founders.
