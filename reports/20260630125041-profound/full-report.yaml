        title: Trust, Security, and Operating Readiness
        blocks:
          - type: paragraph
            body: >-
              For enterprise buyers, Profound’s public trust posture is stronger than its public backend detail. The
              company explicitly claims SOC 2 Type II compliance, SSO through SAML or OIDC, RBAC, encryption at rest and
              in transit, GDPR compliance, and daily backups retained for one week. It also exposes a
              vulnerability-reporting page, which is a useful signal that security response is operationalized rather
              than hidden. These are meaningful positives because the product touches web logs, prompts, customer
              content, and potentially sensitive internal workflows. Even so, the public record remains summary-level.
              There is no public SOC report scope, no detailed disaster-recovery diagram, no uptime commitment visible
              in the product pages reviewed here, and no disclosure of how daily prompt runs are costed or isolated
              operationally. That is enough for a positive enterprise-readiness first pass, but not enough to remove
              diligence on reliability, backup restoration, or incident-response rigor.
