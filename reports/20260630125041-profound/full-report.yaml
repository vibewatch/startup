              - CU026
              - CU034
              - CU040
      - number: '6.4'
        title: Customer Verdict
        blocks:
          - type: paragraph
            body: >-
              On balance, Profound’s customer evidence is stronger than its retention evidence. The company has credible
              enterprise-scale logos, multiple fresh case studies with quantified outcomes, and a reference set that
              spans both large enterprises and growth-stage software companies. That is enough to support the claim that
              real customers are deriving value and operationalizing the platform. What it does not support is a
              confident view on durability, monetization depth, or concentration. Public logos do not prove current
              spend, and public case studies do not prove renewal health. Adverse reviews add a reminder that premium
              pricing and product complexity may narrow the addressable base outside the enterprise core. The practical
              takeaway is that customer proof is good enough to keep diligence moving forward, but a serious
              underwriting still needs cohort retention, module attach, top-account concentration, and exact
              customer-count definitions from management. Management should also explain logo eligibility rules,
              referenceability standards, and whether expansion depends on a narrow group of unusually sophisticated
              design partners.
            claimRefs:
              - CU015
              - CU025
              - CU029
              - CU030
              - CU035
              - CU038
              - CU040
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public Customer Proof Is Unusually Specific For An Early Category
            body: >-
              Profound’s strongest customer signal is not just the logo wall; it is the number of case studies that
              publish concrete before/after metrics and explain the workflow used to achieve them.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU033
          - type: callout
            title: Customer Count Conflict Is A Real Credibility Issue
            body: >-
              The shift from 1,000 customers in late 2025 to 700+ enterprises in early 2026 may reflect definitional
              changes, but without explanation it weakens confidence in the adoption trajectory.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU019
          - type: callout
            title: Durability Is Still Mostly Unproven In Public
            body: >-
              There is no public NRR, churn, ACV, or concentration disclosure, so the customer story remains much
              stronger on acquisition and outcomes than on retention.
            calloutType: risk
            claimRefs:
              - CU017
              - CU018
              - CU034
              - CU040
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Trust Risk
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory picture is cleaner than the commercial and platform picture. Profound publishes a
              privacy policy, a master subscription agreement, and a vulnerability-reporting channel, which means
              baseline trust and procurement materials are visible rather than opaque. The public record reviewed here
              also did not surface a lawsuit, enforcement action, or major sanction against the company. Those are
              genuine positives. But they should not be over-read. The privacy and contract documents describe
              obligations; they do not prove operational excellence or low future legal risk. Public materials still do
              not reveal a full disaster-recovery plan, detailed subprocessor controls, or the kind of privacy-incident
              history that would let an investor clear enterprise risk with confidence. In other words, there is no
              obvious legal fire, but there is also no public regulatory moat. The key takeaway is that trust risk is
              currently a diligence gap problem more than a distress problem.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR018
              - CR019
              - CR024
