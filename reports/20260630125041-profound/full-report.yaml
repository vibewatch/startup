            body: >-
              The financial verdict is therefore mixed. On the positive side, Profound has enterprise pricing,
              large-customer proof, strong venture support, and a contract structure that could support high ACVs and
              multi-module expansion. On the negative side, virtually every metric needed to confirm revenue quality is
              absent from the public record. There is no disclosed ARR, no retention data, no cash-flow statement, no
              services mix, and no evidence that public pricing bears any resemblance to realized contract economics.
              Adverse reviews add a further warning that premium pricing may cap adoption outside the enterprise core.
              Taken together, the public record supports the view that Profound is commercially promising but
              financially under-disclosed. That is enough to justify continued diligence, not enough to justify a
              confident underwriting of revenue quality or margin durability. The central blocker is straightforward:
