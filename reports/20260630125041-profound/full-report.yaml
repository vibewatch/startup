              - CV032
              - CV033
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV032
              - CV033
      - number: '8.3'
        title: Comparables, Confidence, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is the weakest part of the public case because direct comp multiple pulls were not
              fetched in this run. The right lenses are clear enough: marketing analytics SaaS, search-adjacent
              experience software, and digital-intelligence platforms. But the absence of direct public-market multiple
              data means the comp framework remains conceptual rather than model-grade. That weakness reinforces a
              broader confidence limit. Without ARR, retention, burn, cap-table terms, and win-loss evidence against
              bundled rivals, even a careful analyst is still making category-weighted judgments rather than true
              underwriting decisions. The right response is not to abandon the company, but to narrow the next diligence
              cycle around the handful of inputs that would most rapidly change the view: actual revenue, cohort
              durability, capital-structure specifics, and competitive win-loss. Until those arrive, valuation
              discipline should stay tighter than narrative enthusiasm. A disciplined investor should also ask how much
              of the current round reflected competitive fundraising momentum, strategic signaling, or future
              optionality rather than presently demonstrated cash-generation power.
            claimRefs:
              - CV014
              - CV023
              - CV024
              - CV028
              - CV035
              - CV038
              - CV039
