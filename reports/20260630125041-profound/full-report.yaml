      - number: '2.5'
        title: Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: |
              Several contradictions and gaps exist in the market evidence:
              1. The Dimension AEO estimate ($161M, 43% CAGR) vs. the Dimension GEO estimate ($848M,
                 50.5% CAGR) differ by 5x at similar vintages due to boundary definitional differences.
                 Neither is independently verified by a third party as of the research date.

              2. ChatGPT user count varies by source: "810 million daily" (Superlines/Writesonic CEO
                 cited), "900 million weekly" (Superlines), and "1 billion weekly" (Profound's own
                 marketing materials). These may reflect different measurement periods or rounding.

              3. The AI commerce impact projection — $2.5 trillion by 2027 (Profound Series B blog) and
                 "$1 trillion of Google's $2.4 trillion shifting to ChatGPT within 5 years"
                 (Rankability review) — are company-claimed forward projections without disclosed
                 methodology, treated as aspirational framing, not investable market sizing.

              4. There is no reliable public data on the share of enterprise marketing budgets currently
                 allocated to AI visibility tools specifically, making SAM derivation highly speculative.

              5. AEO/GEO market reports are almost exclusively from small research shops (Dimension,
                 ConvertMate, Superlines) with limited brand recognition and no disclosed methodology.
                 No Gartner, IDC, or Forrester report specifically sizes the AEO/GEO software market
                 as of the research date.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Accelerating AI-to-Commerce Shift Creates Massive Urgency
            body: >
              With 35% of US consumers now using AI at the product discovery stage and zero-click search growing from
              56% to 69% in one year, the marketing-to-AI problem is no longer hypothetical. Enterprise CMOs face
              measurable brand equity risk, creating high-urgency purchasing. Profound is positioned as the
              category-defining solution.
            calloutType: strength
            claimRefs:
              - CM021
              - CM022
              - CM026
          - type: callout
            title: Market Size Estimates Are Unreliable and Methodologically Weak
            body: >
              The two Dimension Market Research estimates conflict 5x ($161M vs $848M) due to definitional differences.
              No Gartner, IDC, or Forrester report independently sizes the AEO/GEO software market. Profound's own
              market projections ($2.5T AI commerce by 2027) are aspirational framing without disclosed methodology.
              Investors should treat all market sizing as directional compass, not investable precision.
            calloutType: risk
            claimRefs:
              - CM031
              - CM032
              - CM033
          - type: callout
            title: SEO Incumbents Pose a Real Bundling Threat
            body: >
              Established SEO platforms (Ahrefs, SEMrush, BrightEdge) have large enterprise install bases and
              distribution channels. If they ship credible GEO features at no incremental cost, Profound's enterprise
              pricing premium could face structural compression. The window for differentiated data moat (Prompt
              Volumes) may be 12-24 months before incumbents catch up.
            calloutType: risk
            claimRefs:
              - CM004
              - CM028
              - CM029
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Peer Set
        blocks:
          - type: paragraph
            body: >-
              Profound competes in an unusually fluid market where the direct peer set includes dedicated AEO vendors,
              SEO incumbents adding GEO features, agency-led service layers, and internal build substitutes. Public
              comparisons place AthenaHQ and Scrunch closest to Profound on direct answer-engine visibility use cases,
              while BrandRadar.ai, Ahrefs Brand Radar, and SE Ranking represent different substitution paths: dedicated
              GEO specialization, suite bundling, and lower-cost SEO adjacency. That fragmentation matters because it
              keeps buyer evaluation criteria unsettled. Profound benefits from having a broad public suite and enough
              enterprise proof to appear in first-tier roundups, but it also means the company cannot rely on a single
