  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Current Price
        blocks:
          - type: paragraph
            body: >-
              The headline valuation fact is clear: Profound raised a $96M Series C at a $1B valuation in February 2026
              after accumulating more than $155M in total funding. That round validates investor appetite, but it does
              not by itself validate present-day return potential. The core difficulty is that the company has not
              publicly disclosed ARR, revenue run rate, or retention. Public pricing exists, and customer proof is
              meaningful, yet those signals are not enough to convert a $1B post-money valuation into a high-confidence
              intrinsic view. On public evidence alone, the best that can be done is to model ranges and compare those
              ranges against the current price. That leads to an uncomfortable but useful result: the current valuation
              may be strategically understandable given category excitement and product ambition, but it is still too
              under-anchored to justify a confident positive recommendation. In other words, the round price is a fact,
              while the support behind it is still mostly inference.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV021
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV021
              - CV022
              - CV034
              - CV040
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV006
              - CV007
              - CV032
      - number: '8.2'
        title: Thesis, Anti-Thesis, and Scenario Logic
        blocks:
          - type: paragraph
            body: >-
              The bull case is not hard to articulate. Profound is operating in a fast-growing AI-discovery category,
              has enterprise logos, broad workflow product depth, and is clearly investing in category control through
              research, events, and solution packaging. If retention is strong and module attach is real, today’s
              valuation could eventually look early rather than aggressive. The anti-thesis is just as coherent. Adverse
              reviews highlight price and complexity, incumbents can bundle similar features into existing SEO stacks,
              and the company still withholds the financial metrics needed to prove that premium valuation is earned.
              The base case sits between those poles: customer proof is real, the market is attractive, but the current
              price already assumes a lot of future success. That mix argues for a scenario-based view in which upside
              exists, but downside is meaningful if the actual revenue base is much smaller than the narrative implies.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV019
              - CV020
              - CV026
              - CV030
              - CV032
              - CV033
          - type: table
            tableRef: TV002
            claimRefs:
