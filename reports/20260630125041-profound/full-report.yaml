      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >
              Profound's buyer is the enterprise marketing team at companies large enough to have dedicated
              SEO/content/digital marketing resources, typically at companies with $100M+ revenue or significant
              consumer-facing digital presence. The payer is the CMO or VP Marketing budget, with software procurement
              decisions often made by the Director of Digital Marketing or Head of SEO/Content.

              Segment breakdown by vertical (from Series C PR): CPG, Financial Services (Fintech), Retail, Pharma,
              Consumer Tech, B2B Tech. Named examples include Target and Walmart (Retail/CPG), Ramp and Chime and US
              Bank (Finserve), Figma and MongoDB (B2B Tech), and Charlotte Tilbury (CPG/Beauty).

              The primary user is the marketer or SEO specialist who runs visibility tracking reports and content
              workflows. The secondary user is the executive stakeholder who wants board-level reporting on AI brand
              equity.

              Adoption trigger: a decision-maker observes that their company's AI search share-of-voice is unknown or
              declining, or that a competitor is cited far more frequently by ChatGPT. This creates urgency because AI
              search referral traffic has begun to appear measurably in analytics dashboards, with Kleiner Perkins
              citing some Profound customers seeing 15% of referral traffic from AI assistants.

              Budget ownership: typically within the SEO/digital marketing budget line, not a new technology budget.
              Enterprise contracts on Profound are custom-priced; analyst estimates suggest enterprise plans are "well
              over $1,500/month." Agencies and marketing consultants represent a growing reseller channel, addressed
              through the Profound Ecosystem/agency marketplace.
            claimRefs:
              - CM014
              - CM015
