  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              Profound’s product story is unusually concrete for an emerging category. The company does not describe a
              single dashboard; it describes a loop. Answer Engine Insights and Prompt Volumes identify what prompts
              matter, Agent Analytics diagnoses how AI systems reach and interpret the site, Agents and templates turn
              those signals into content or optimization work, and Shopping extends the same logic into commerce
              discovery. That structure matters because it turns an abstract “AI visibility” problem into a repeatable
              operating workflow for marketing teams. The official materials repeatedly emphasize that value comes from
              moving from insight to action and then back into measurement. In practice, that means the product is less
              like a passive analytics layer and more like an operating system for AI-search experimentation. The
              strongest proof of this is the breadth of live modules rather than any one feature. The weakness is that
              such breadth can also raise the training and governance burden for smaller teams that only need a subset
              of the loop.
