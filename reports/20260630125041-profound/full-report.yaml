    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Profound operates under the legal name Cooper Square Technologies Inc. (dba Profound) and is accessible at
              tryprofound.com. The company describes itself as "the full stack marketing platform for the marketer of
              the future," focused on helping enterprises understand and control how they appear in AI-generated answers
              across platforms such as ChatGPT, Perplexity, Google AI Overviews, Gemini, Microsoft Copilot, Claude, and
              Grok.

              The business model is SaaS subscription. Public pricing starts at $99/month (Starter: 50 prompts, ChatGPT
              tracking only), $399/month (Growth: 3 engines, 100 prompts), and custom Enterprise pricing for large
              deployments with SSO, SOC2 compliance, dedicated Slack support, and up to 10 answer engines. Revenue is
              primarily generated from annual subscriptions, with enterprise custom contracts being the primary revenue
              driver given the Fortune 500 customer base.

              Profound defines a new marketing category it calls Answer Engine Optimization (AEO) or Generative Engine
              Optimization (GEO)—the practice of measuring, managing, and improving how brands are represented in
              AI-generated answers. The company positions itself as the first "read/write" marketing platform for AI:
              the read side tracks brand mentions, citations, sentiment, crawler activity, and prompt demand; the write
              side generates AI-optimized content and recommendations through autonomous Profound Agents. Profound has
              announced a Zero Click 2026 conference, Profound University certification, and an agency marketplace as
              part of its ecosystem expansion.
