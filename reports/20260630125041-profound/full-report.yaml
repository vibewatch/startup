          - type: callout
            title: Disclosure Gaps Matter As Much As Technical Risk
            body: >-
              Missing ARR, customer-definition noise, and thin bench visibility all create execution uncertainty that
              funding headlines can temporarily obscure.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR025
          - type: callout
            title: The Public Record Shows More Trust Hygiene Than Regulatory Moat
            body: >-
              Legal documents and security signals are visible, but there is no obvious license, approval, or hard
              regulatory barrier protecting the business from rivals.
            calloutType: insight
            claimRefs:
              - CR001
              - CR004
