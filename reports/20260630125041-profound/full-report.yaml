  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Definition
        blocks:
          - type: paragraph
            body: >
              Profound competes in what it calls the Answer Engine Optimization (AEO) market, also known as Generative
              Engine Optimization (GEO) — the software category dedicated to measuring, managing, and optimizing how
              brands appear in AI-generated answers from platforms such as ChatGPT, Perplexity, Google AI Overviews,
              Gemini, Microsoft Copilot, Claude, and Grok.

              The market boundary includes: (1) AI visibility analytics software (tracking brand mentions, citations,
              sentiment, and share of voice across AI answer engines); (2) AI content optimization tools that generate
              or tune content to improve AI citation rates; (3) AI crawler/agent analytics that monitor how AI bots
              interpret web assets; and (4) autonomous marketing agent platforms that execute on AI-visibility insights.

              Excluded spend includes: traditional SEO platforms (Ahrefs, Semrush, Moz) unless they bundle GEO features;
              generic marketing analytics (GA4, Adobe Analytics); social listening; and paid-search management, all of
              which address different buying intent and different answer surfaces.

              The adjacency to SEO is both an opportunity and a competitive risk: established SEO vendors with large
              installed bases are beginning to add GEO features, which could compress the standalone AEO market. The
              Rankability review (June 2026) notes that Profound is positioned as "the enterprise gold standard" in AEO,
              but also calls out that Ahrefs, SEMrush, and BrightEdge are broadening toward AI visibility from the SEO
              side.

              Status-quo substitute is ad hoc manual monitoring — marketers manually querying ChatGPT and Perplexity to
              check brand mentions — which requires no budget but scales poorly past a few brands or prompts and
              provides no trend data. The cost of the substitute is marketing analyst labor, not software spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing — TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >
              Multiple independent sizing estimates exist for the AEO/GEO market, though methodologies differ and should
              be treated as indicative rather than definitive.

              Dimension Market Research (2026) estimates the global AEO market at $160.9M in 2026 growing at a 43.4%
              CAGR to $4.1B by 2035. The US sub-market is $54.0M in 2026 (CAGR 40.6%). Europe is $40.3M (CAGR 41.4%).
              North America leads with an estimated 38.6% global share.

              A separate Dimension estimate cited by Superlines puts the GEO market at $848M in 2025 growing at a 50.5%
              CAGR to $33.7B by 2034 — a significantly larger estimate, likely using a broader boundary that includes
              the full AI content and analytics adjacency.

              The Superlines/Dimension broader GEO estimate ($848M 2025 → $33.7B 2034) conflicts with the narrower AEO
              estimate ($161M 2026 → $4.1B 2035) because the former likely includes AI content generation spend (an
              adjacency) while the latter restricts to pure-play AEO measurement tools. Both estimates are preserved.

              From Profound's own framing: Profound's Series B blog cited ChatGPT driving "roughly 10% of referral
              traffic" as of ~2025 and projected 50% of online commerce by 2027 at $2.5T annually — implying the total
              addressable spend-under-management is the global marketing analytics budget that enterprise CMOs control,
              estimated at $25-30B across the marketing technology stack. At a 1-2% monetization rate, the
              Profound-relevant SAM may be $250M-$600M annually within 3-5 years.

              These estimates carry significant uncertainty. The AEO/GEO market is less than 3 years old as a defined
              category; Profound itself coined much of the terminology, giving it first-mover power but also making
              independent validation sparse.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
