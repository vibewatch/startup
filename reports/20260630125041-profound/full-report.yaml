      - number: '4.2'
        title: Traction, Estimates, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The public record offers strong commercial signals and weak financial disclosure. Profound and multiple
              news sources say the company serves more than 700 enterprises and more than 10% of the Fortune 500, which
              is meaningful customer proof for a young company. But those traction signals never resolve into ARR, GAAP
              revenue, billings, or profitability. Any current financial view therefore has to be estimated. A
              reasonable public-evidence ARR range is roughly $10M to $30M, while a software-like gross-margin range of
              70% to 80% appears plausible given the company’s model, offset by log ingestion, agent workloads, support,
              and data processing costs. Those estimates are useful for framing the business, but they are not enough to
              underwrite entry valuation with confidence. Unit economics are even thinner: CAC, payback, NRR, churn, and
              services mix all remain private. The core financial puzzle is not whether demand exists, but whether that
              demand converts into efficient and durable recurring revenue.
