  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing and Revenue Model
        blocks:
          - type: paragraph
            body: >-
              Profound’s public monetization surface is narrow but revealing. The pricing page exposes a $99 Starter
              tier and a $399 Growth tier, yet the enterprise page and contact-sales flow make clear that the core
              business is designed around custom contracts. The Master Subscription Agreement adds another signal:
              actual service delivery depends on order-specific limits, supplemental terms, support obligations, and
              data-processing commitments. That structure looks much more like an enterprise SaaS vendor than a pure
              self-serve software subscription. The likely conclusion is that the posted plans exist to widen funnel
              coverage and create proof-of-value, while economic weight sits in larger annual contracts and add-on
              modules such as Agent Analytics or workflow layers. That is directionally positive for ACV and expansion
              potential, but it also means the public list price is a weak proxy for realized revenue mix. Investors can
              see how Profound intends to charge, yet they still cannot see what customers actually pay, how contracts
              renew, or whether self-serve converts into enterprise-scale revenue.
