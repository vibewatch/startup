            claimRefs:
              - CV014
              - CV024
              - CV028
              - CV035
              - CV038
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV005
              - CV008
              - CV013
              - CV021
              - CV031
              - CV038
              - CV040
      - number: '8.4'
        title: Recommendation and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              The public-evidence recommendation is therefore research-more, with track as the closest alternative if
              the investor simply wants to watch execution instead of moving now. The business looks interesting, the
              market is real, and the product appears broader than many point solutions. What is missing is enough
              financial transparency to know whether the current price leaves room for attractive returns. The thesis
              breaks quickly if ARR remains undisclosed, if retention data disappoints, if customer-count inconsistency
              persists, or if platform changes weaken the measurement loop that underpins product differentiation. The
              recommendation would improve only if management can show that the revenue base, retention profile, and
              competitive win rates are materially stronger than the public record suggests. Until then, the right
              stance is stretched valuation, medium confidence, and disciplined curiosity rather than conviction. Direct
              management access is essential before committing capital.
            claimRefs:
              - CV022
              - CV027
              - CV034
              - CV036
              - CV037
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV014
              - CV020
              - CV035
              - CV036
              - CV040
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV011
              - CV014
              - CV021
              - CV022
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-More Is The Defensible IC Posture
            body: >-
              Strong market and product signals are not enough to clear the valuation when ARR, retention, and
              capital-structure details remain private.
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV022
              - CV035
              - CV040
          - type: callout
            title: The $1B Round Can Be True And Still Too Expensive
            body: >-
              A priced round proves market appetite at a moment in time; it does not prove future return attractiveness
              from the same entry point.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV027
              - CV032
          - type: callout
            title: Profound’s Platform Ambition Matters More To Upside Than To Underwriting
            body: >-
              Community, research, and cross-functional solution pages support the upside narrative, but they do not
              replace private financial evidence.
            calloutType: insight
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV031
              - CV037
