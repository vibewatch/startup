      - number: '7.2'
        title: Platform, Competitive, and Category Risk
        blocks:
          - type: paragraph
            body: >-
              Profound’s most important risks come from dependence and convergence. The product depends on observing how
              answer engines retrieve, cite, and route traffic; if those behaviors become harder to observe or
              materially change, product value can fall even if AI-search demand continues to grow. At the same time,
              the company is competing in a category where SEO incumbents, dedicated GEO tools, agencies, and workflow
              specialists are all converging on similar buyer budgets. That creates a double exposure: external
              platforms can change the rules, and competitors can package “good enough” features around those changes
              more cheaply. Category-definition risk amplifies the issue because Profound is still helping educate
              buyers on what the problem even is. If the market standard settles somewhere more bundled or more
              service-led than Profound expects, pricing power and differentiation can compress quickly. This is why
              platform dependency and bundling risk sit at the center of the chapter rather than on the periphery.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
