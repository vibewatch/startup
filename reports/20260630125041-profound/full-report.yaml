      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary growth driver is the secular shift from traditional search to AI-mediated discovery. Gartner
              predicted in February 2024 that traditional search engine volume would drop 25% by 2026, and third-party
              statistics confirm structural acceleration: AI Overviews appear in 25.11% of Google searches (Conductor
              2026); zero-click searches grew from 56% to 69% following Google AI Overviews' rollout (Similarweb July
              2025); 35% of US consumers now use AI at the product discovery stage vs. 13.6% using traditional search
              (Similarweb 2026 Generative AI Brand Visibility Index); ChatGPT has over 900 million weekly active users
              globally.

              A Princeton/Georgia Tech/Allen Institute/IIT Delhi study (KDD 2024) demonstrated that GEO techniques boost
              content visibility in AI responses by up to 40%, giving enterprise teams a quantifiable ROI argument for
              AEO investment.

              Key adoption constraints include: (1) high cost — Profound is estimated at 48% above category average
              pricing; (2) nascent market maturity — only 40.6% of marketers who plan to implement GEO are actually
              doing so currently (ConvertMate GEO Benchmark 2026); (3) AI platform instability — AI answer engines
              change citation patterns and architectures frequently, creating product maintenance risk for AEO vendors;
              (4) switching costs are currently low since the category is new and customers haven't deeply integrated;
              (5) ROI measurement is still maturing — AI-attributed traffic is a small fraction of total referrals and
              proving causality from AEO spend to revenue requires custom attribution work.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
          - type: table
            tableRef: TM004
