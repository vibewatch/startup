company:
  name: Profound

chapter:
  number: 1
  title: Company Overview
  summary: >
    Profound (legal name Cooper Square Technologies Inc.) is a New York City-headquartered
    AI marketing visibility and answer engine optimization platform founded in August 2024 by
    James Cadwallader (CEO) and Dylan Babbs (CTO). The company has raised more than $155M
    across seed through Series C at a $1B valuation, reached unicorn status in February 2026
    after 18 months, and serves 700+ enterprise customers including 10%+ of the Fortune 500.

sections:
  - id: identity-business-model
    title: Identity and Business Model
    body: >
      Profound operates under the legal name Cooper Square Technologies Inc. (dba Profound) and is
      accessible at tryprofound.com. The company describes itself as "the full stack marketing
      platform for the marketer of the future," focused on helping enterprises understand and
      control how they appear in AI-generated answers across platforms such as ChatGPT, Perplexity,
      Google AI Overviews, Gemini, Microsoft Copilot, Claude, and Grok.

      The business model is SaaS subscription. Public pricing starts at $99/month (Starter: 50
      prompts, ChatGPT tracking only), $399/month (Growth: 3 engines, 100 prompts), and
      custom Enterprise pricing for large deployments with SSO, SOC2 compliance, dedicated
      Slack support, and up to 10 answer engines. Revenue is primarily generated from annual
      subscriptions, with enterprise custom contracts being the primary revenue driver given the
      Fortune 500 customer base.

      Profound defines a new marketing category it calls Answer Engine Optimization (AEO) or
      Generative Engine Optimization (GEO)—the practice of measuring, managing, and improving
      how brands are represented in AI-generated answers. The company positions itself as the
      first "read/write" marketing platform for AI: the read side tracks brand mentions,
      citations, sentiment, crawler activity, and prompt demand; the write side generates
      AI-optimized content and recommendations through autonomous Profound Agents. Profound
      has announced a Zero Click 2026 conference, Profound University certification, and an
      agency marketplace as part of its ecosystem expansion.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO001
    figureRefs:
      - FO003

  - id: founding-team-leadership
    title: Founding Team and Leadership
    body: >
      Profound was co-founded by James Cadwallader (CEO) and Dylan Babbs (CTO), who met at
      South Park Commons in New York City. Both founders identified the mainstream adoption of
      Answer Engines as a major inflection point for marketing technology and chose NYC as
      headquarters given its concentration of marketing and agency talent.

      James Cadwallader serves as CEO and is the public face of company communications,
      representing Profound at investor announcements and external speaking engagements. Dylan
      Babbs serves as CTO with responsibility for engineering; he previously emphasized the
      company's ambition to build a "world-class engineering team in the heart of Manhattan."

      The Series A investor Ilya Fushman (Kleiner Perkins) joined the board of directors per the
      Series A announcement, bringing SaaS institutional governance experience. Sequoia Capital
      (Alfred Lin and others) joined for the Series B; Lightspeed (Sachin Patel) led the Series C.
      The OfficialBoard org-chart page returned a 403 status during research, leaving a gap in
      the complete executive roster below VP level.

      Profound operates as an in-person team five days per week across its four offices. The SF
      office blog (December 2025) reported 82 employees at that time. The careers page lists open
      roles across Customer Success, Engineering, and GTM in New York, London, San Francisco, and
      Buenos Aires. With its $155M in total funding and rapid growth, the company represents a
      key-person dependency risk concentrated in the two co-founders.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO002
    figureRefs:
      - FO002

  - id: funding-history-investors
    title: Funding History and Investor Profile
    body: >
      Profound raised more than $155M in total funding across four rounds in approximately
      18 months, reaching unicorn status ($1B valuation) in February 2026 with its Series C.
      The round sequence was: Seed ($3.5M, August 2024), Series A ($20M, led by Kleiner Perkins,
      ~May 2025), Series B ($35M, led by Sequoia Capital, ~September/October 2025), and Series C
      ($96M, led by Lightspeed Venture Partners, February 24, 2026).

      The Series C press release confirmed investors include Sequoia Capital, Kleiner Perkins,
      Evantic, Saga Ventures, and South Park Commons as existing participants. NVIDIA NVentures
      and Khosla Ventures participated in the Series A. Angel investors include Guillermo Rauch
      (Vercel CEO), Karim Atiyeh (Ramp CEO), and others. The Series A announcement confirmed
      Ilya Fushman of Kleiner Perkins joining the board. The Kleiner Perkins perspective article
      cited Anas Biad, Brian Halligan, and Alfred Lin as Series B leads from Sequoia.

      The $1B valuation was achieved one day before Profound's 18-month anniversary (August 2024
      founding + 18 months = ~February 2026). Revenue run rate and ARR are not publicly disclosed.
      There is no disclosed debt, credit facility, or secondary transaction on record. Independent
      analyst Rankability noted Profound's funding trajectory makes it "the most-funded platform
      in AI visibility."
    claimRefs:
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
