  - id: milestones-timeline
    title: Milestones and Corporate Timeline
    body: >
      Profound's corporate timeline spans 22 months from founding (August 2024) to the
      report date (June 2026), encompassing four financing rounds, multiple product launches,
      geographic expansion, and category-definition events. The company has moved faster
      than nearly any comparable martech unicorn from founding to unicorn status.

      Key adverse events and gaps: the OfficialBoard org chart returned 403 (access blocked),
      leaving the full executive bench partially opaque. There are no publicly documented
      lawsuits, regulatory enforcement, data breaches, or layoffs as of the research date.
      The Series A blog URL on tryprofound.com returned 404 (broken link), though the PR
      Newswire and third-party coverage preserved the announcement content. The conflict
      between the December 2025 customer count (1,000) and the February 2026 official count
      (700+) is an unresolved data inconsistency documented elsewhere in this chapter.

      The Profound MSA was last updated June 5, 2026, indicating active legal maintenance.
      The Sequoia partnership blog (Alfred Lin, Brian Halligan, Anas Biad) and the Lightspeed
      company page both independently corroborate the Series B and Series C details. Profound
      hosted a Zero Click 2026 conference and is expanding the Profound Ecosystem including
      Profound University, certification programs, and an agency marketplace.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO039
