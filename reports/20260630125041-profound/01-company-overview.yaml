    title: Fastest-Ever Martech Unicorn Trajectory
    body: >
      Profound reached $1B valuation in approximately 18 months from founding, backed by
      top-tier investors including Lightspeed, Sequoia, and Kleiner Perkins—a trajectory
      that validates both the market timing and founder execution velocity.
    claimRefs:
      - CO016
      - CO023

  - calloutType: risk
    title: Customer Count Discrepancy Is Unresolved
    body: >
      The December 2025 SF office blog claimed 1,000 enterprise customers while the February
      2026 Series C official press release says 700+ enterprises. This conflict has not been
      publicly clarified and may reflect churn, different counting thresholds, or a measurement
      methodology change. Investors should request the reconciled definition and audited ARR.
    claimRefs:
      - CO026
      - CO034
      - CO035

  - calloutType: risk
    title: Key-Person Concentration Risk
    body: >
      All public communication, investor relations, and technical vision are concentrated in
      two co-founders. No COO or CFO has been publicly named, and the full exec bench is
      opaque. Departure of either founder would be a material operating risk.
    claimRefs:
