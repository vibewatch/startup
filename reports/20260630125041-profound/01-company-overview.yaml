  - id: scale-traction
    title: Scale, Customer Traction, and Geographic Footprint
    body: >
      The Series C press release (February 2026) states Profound serves "more than 700 enterprises"
      and "more than 10 percent of the Fortune 500." Named customer logos include Target, Walmart,
      Figma, MongoDB, Ramp, Chime, U.S. Bank, Charlotte Tilbury, and Indeed. A December 2025 SF
      office blog post claimed "1,000 enterprise customers," creating a factual conflict with the
      February 2026 official announcement. The discrepancy may reflect different counting
      methodologies (all-time vs. active, enterprise-threshold definitions) or a timing gap.

      Platform scale metrics from the careers page and enterprise page: 1B+ citations analyzed
      daily, 30B+ crawler visits analyzed daily, 10M+ prompts analyzed daily. The Kleiner Perkins
      Series A piece noted 100 million AI search queries processed per month (approximately 3.3M
      per day) at Series A time, consistent with subsequent scale-up claims. The company supports
      users across 18 countries and 6 languages (per Series A investor note).

      The G2 2026 Best Software Products list ranked Profound #34 across all B2B software
      (alongside ChatGPT, ElevenLabs, Gemini, Notion, and Lovable), with a 4.6 G2 rating across
      322 reviews—a credible third-party quality signal. Profound was also named to the Series C
      press release as serving customers in CPG, Fintech, Retail, Pharma, Consumer Tech, and
      B2B Tech verticals.

      Headcount was reported as 82 in the December 2025 SF blog; current headcount as of
      June 2026 is unconfirmed but likely higher given continued hiring across 4 offices.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
