company:
  name: Hopper
chapter:
  number: 4
  title: Financials
  summary: >-
    Hopper reported approximately $686.9M in ARR and $850M in total revenue for 2024, growing
    nearly 19-fold from $45M in 2019, driven predominantly by the HTS (Hopper Technology Solutions)
    B2B platform that now accounts for roughly 90% of revenues. The company completed a pivotal
    restructuring in early 2026 when Capital One acquired Hopper's managed travel-portal technology,
    staff, and supplier relationships for approximately $96M, converting from managed-platform client
    to API-only client. Positive EBITDA was claimed for the first time in the six months preceding
    March 2026, but no public P&L, burn rate, or cash-on-hand data has been disclosed, leaving
    capital adequacy, margin structure, and IPO readiness substantially opaque.
sections:
  - id: revenue-stack
    title: Revenue Stack and Aggregate Metrics
    body: >-
      Hopper operates a dual revenue stack: a consumer-facing travel marketplace (B2C) and a
      white-label B2B enterprise platform called HTS (Hopper Technology Solutions). Total reported
      revenue reached $850M in 2024, up from $700M in 2023 and $500M in 2022, reflecting compound
      annual growth of roughly 19-fold since 2019's $45M base. Latka independently reported an ARR
      figure of $686.9M for 2024, a narrower measure likely capturing run-rate contractual revenue
      while excluding transactional or one-time items. Gross bookings reached $7.5B in 2024 (from
      $5.9B in 2023), implying a blended revenue take rate of roughly 11–12% across the platform,
      which is above the typical 2–4% of legacy OTAs and reflects Hopper's fintech-heavy mix.
      HTS B2B revenue grew from zero in mid-2021 to 66% of total revenues by 2024 (as reported
      by co-founder Dakota Smith at an industry conference) and to approximately 90% by March 2026
      following the Capital One transition. Revenue quality is mixed: the HTS B2B segment carries
      recurring API and fintech revenue with partner contracts and high attach rates, while the
      consumer app generates transaction commissions plus fintech upsell. Neither segment discloses
      gross margin or operating income separately.
    claimRefs:
      - CI001
      - CI002
