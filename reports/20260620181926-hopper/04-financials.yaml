  - id: FI002
    title: HTS Fintech Unit Economics Flow
    type: flow
    layout: wide
    summary: >-
      Traces how a traveler or partner-channel booking converts into HTS fintech revenue
      and margin through the Hopper risk-management model.
    data:
      nodes:
        - id: traveler
          label: Traveler Demand Signal
          detail: Consumer or partner-app user triggers a flight, hotel, or rental search; Hopper's 7-trillion itinerary/year dataset prices the risk.
        - id: booking
          label: Booking + Fintech Upsell
          detail: At checkout, traveler opts into CFAR, Price Freeze, DAFAR, or Car Rental Shield; attach rate >60% in consumer app per management data.
        - id: ml-pricing
          label: Dynamic ML Pricing Engine
          detail: Hopper's ML models dynamically price fintech fee using fare volatility, route data, and historical claim rates; produces high-confidence expected-value spreads.
        - id: risk-pool
          label: Hopper Risk Pool
          detail: Fintech fees aggregate into a risk pool; Hopper absorbs claim costs (refunds, rebookings); unearned premium minus claims equals gross profit.
        - id: partner-margin
          label: Partner Revenue Share
          detail: For HTS B2B, Hopper shares a portion of fintech premium with the airline or bank; 60% profit margin reported through partner channels.
        - id: ebitda-contribution
          label: EBITDA Contribution
          detail: High-margin fintech revenue flows toward EBITDA; management claims positive EBITDA over H2 2025 through Q1 2026 on a consolidated basis.
      edges:
        - from: traveler
          to: booking
          label: Search → Intent → Checkout
        - from: booking
          to: ml-pricing
          label: Risk priced in real time
        - from: ml-pricing
          to: risk-pool
          label: Fee collected; policy issued
        - from: risk-pool
          to: partner-margin
          label: Revenue share to partner (B2B model)
        - from: risk-pool
          to: ebitda-contribution
          label: Hopper net margin after claims
    approximationNotes: >-
      Exact claim rates, loss ratios, and per-product profit splits are not publicly disclosed.
      The 60% partner-channel profit margin is from management/Forbes sourcing and is unaudited.
      The flow is a qualitative representation of the monetization mechanism; numeric values
      are not available for precise calibration.
    claimRefs:
      - CI017
      - CI018
      - CI021
      - CI022
      - CI034
      - CI041

  - id: FI003
    title: Financial Estimate Ranges — Hopper 2024–2026
    type: range
    layout: wide
    summary: >-
      Source-backed ranges for Hopper's key financial parameters, distinguishing confirmed
      data points from estimates and evidence gaps.
    data:
      items:
        - label: 2024 Total Revenue
          low: 687
          high: 850
          unit: $M
          detail: Low = Latka ARR ($686.9M, October 2024); high = Business of Apps / Electroiq total revenue figure ($850M, 2024 full year). Methodological basis of difference unconfirmed.
        - label: 2024 Gross Bookings
          low: 7400
          high: 7600
          unit: $M
          detail: Business of Apps and Electroiq both cite $7.5B in 2024 gross bookings; range reflects rounding.
        - label: Private Market Valuation (last mark, Nov 2022)
          low: 5000
          high: 5500
          unit: $M
          detail: Capital One follow-on confirmed valuation at "more than $5 billion"; upper bound reflects typical slight premium on strategic rounds.
        - label: HTS Revenue (% of total, 2026)
          low: 85
          high: 95
          unit: "%"
          detail: Management cited 90% in March 2026 BetaKit interview; range reflects potential rounding and timing.
        - label: HTS Fintech Profit Margin (partner channel)
          low: 55
          high: 65
          unit: "%"
          detail: Forbes/HTS data cites ~60% profit margin through partner channels; range reflects uncertainty around unaudited nature.
        - label: Total Equity Raised
          low: 733
          high: 745
          unit: $M
          detail: TechCrunch cited $740M at the time of the November 2022 round; range reflects possible earlier-round rounding.
    approximationNotes: >-
      All values are estimated or company-reported; no audited financial statements are publicly
      available. Valuation has not been updated since November 2022. Revenue range conflict between
      Latka and Business of Apps is unresolved. HTS margin is based on unaudited management
      reporting cited in Forbes.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI007
      - CI008
      - CI017

  - id: FI004
    title: Capital Intensity and Cash-Flow Map
    type: flow
    layout: wide
    summary: >-
      Maps Hopper's principal cash inflows, outflows, and structural cost levers as understood
      from public evidence, highlighting the transition from capital-intensive consumer growth
      to margin-focused B2B infrastructure.
    data:
      nodes:
        - id: equity-capital
          label: Equity Capital Raised ($740M+)
          detail: Funded consumer app scaling, HTS build-out, and working capital from 2012 through November 2022; no new equity raise since then.
        - id: asset-sale
          label: Capital One Asset Sale (~$96M)
          detail: Capital One paid ~$96M in March 2026 to acquire Hopper's managed-platform technology, 150 staff, licenses, and supplier relationships; one-time inflow partially offsetting revenue loss.
        - id: fintech-revenue
          label: HTS Fintech Revenue Pool
          detail: High-margin, recurring fintech fees collected at booking; 60% partner-channel profit margin; primary EBITDA contributor.
        - id: b2c-marketing
          label: Consumer App Marketing Spend
          detail: High CAC environment ($48 per paid user); partially offset by referral program ($12 per referral user); headcount cuts reduced marketing infrastructure costs.
        - id: hts-platform-costs
          label: HTS Platform and Engineering Costs
          detail: API infrastructure, data-center costs, ML model maintenance; scaled with 400 core staff; capital-efficient at current headcount vs. peak 1,300+ employees.
        - id: claim-payouts
          label: Fintech Claim Payouts
          detail: CFAR, DAFAR, and Price Freeze refund costs; managed through ML-priced risk pool; claim rates not publicly disclosed.
        - id: ebitda-positive
          label: Positive EBITDA Claimed (H2 2025 – Q1 2026)
          detail: Management stated positive EBITDA for the six months before March 2026; structural improvement driven by headcount reduction and B2B margin mix shift; not independently verified.
      edges:
        - from: equity-capital
          to: b2c-marketing
          label: Consumer growth investment (2019–2023)
        - from: equity-capital
          to: hts-platform-costs
          label: HTS infrastructure build
        - from: asset-sale
          to: ebitda-positive
          label: One-time cash inflow supports transition
        - from: fintech-revenue
          to: claim-payouts
          label: Risk pool covers claim costs
        - from: fintech-revenue
          to: ebitda-positive
          label: Net margin after claims flows to EBITDA
        - from: hts-platform-costs
          to: ebitda-positive
          label: Cost reduction via B2B-only headcount model
    approximationNotes: >-
      Cash flows and cost allocations are qualitative; no audited cash-flow statement is publicly
      available. EBITDA claim is from management commentary only. Capital One asset sale value
      (~$96M) is from press reporting; terms not fully disclosed. Monthly burn rate and current
      cash position are unknown.
    claimRefs:
      - CI007
      - CI009
      - CI013
