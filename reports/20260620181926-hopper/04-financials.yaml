  - id: capital-adequacy
    title: Funding History and Capital Adequacy
    body: >-
      Hopper has raised approximately $740M in equity and strategic capital across multiple rounds
      from 2012 through November 2022 (the most recent closed financing). The funding history
      proceeded from a $12M Series B (2012), a $62M round (2016), a $100M round (2018), to a $170M
      Series F led by Capital One in March 2021 (which made Hopper a unicorn at ~$3.5B valuation),
      a $175M Series G led by GPI Capital in August 2021 (also at ~$3.5B), a $35M secondary
      transaction in February 2022 (marking the $5B valuation), and a $96M follow-on from Capital
      One in November 2022 (confirming a $5B+ valuation). No subsequent equity round has been
      disclosed. Management stated in November 2024 that Hopper is not seeking outside funding and
      has no near-term IPO plans, although an eventual IPO at a $10B target valuation has been
      cited in media. In March 2026, Capital One acquired Hopper's managed-platform technology,
      150 staff, licenses, servicing contracts, and supplier relationships for approximately $96M,
      converting to an API-only partner while remaining a major shareholder. Hopper claimed to
      have reached positive EBITDA over the six months preceding that transition. Current cash
      position, monthly burn rate, and runway are not publicly disclosed. The company reduced
      headcount from ~1,300 (late 2023) to ~400 core staff (March 2026) through two structured
      layoff rounds in October 2023 (250 employees, 30%) and November 2024 (60–65 employees, 10%).
