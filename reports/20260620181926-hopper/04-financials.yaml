  - id: hts-b2b-platform
    title: HTS B2B Platform and Partner Economics
    body: >-
      HTS powers travel booking, loyalty, and fintech ancillaries for over 50 product partnerships
      as of early 2026, up from fewer than 20 a year prior. Partners span global banks, airlines,
      and lifestyle brands: Air Canada, WestJet, Porter Airlines, Wizz Air, Frontier, AirAsia Move,
      Flair, RBC Avion Rewards, Commonwealth Bank Australia, Nubank Brazil, Lotte Card South Korea,
      SMCC Japan, Lloyds Bank UK, Uber, Tripadvisor, and Marriott Vacation Clubs. HTS collectively
      serves more than 400 million credit card customers across bank partners, representing over
      $1.6 trillion in total annual card spend. Revenue from the B2B platform is approximately 50%
      year-over-year, per Forbes reporting citing Dakota Smith. The commercial model is transaction
      and profit-share based: "We make nothing when they make nothing," Smith stated. NuBank's
      NuViagens, powered end-to-end by HTS, achieved 550% year-over-year growth since its 2024
      launch. Marriott Vacation Clubs doubled hotel usage after deploying HTS. RBC Avion Rewards
      shifted from Expedia to HTS in March 2026, signaling growing displacement of legacy OTA
      providers. HTS has identified up to 30 global markets for bank-travel partnerships. HTS Assist,
      a generative AI servicing layer, is now live with multiple clients and creates an additional
      revenue line beyond content and fintech.
    claimRefs:
