  - id: adverse-signals
    title: Adverse Financial Signals and Revenue Risk
    body: >-
      Several adverse financial signals are material to underwriting. First, Capital One—Hopper's
      largest managed-platform client—brought Capital One Travel in-house in March 2026, and Hopper
      lost "most of its revenue stream from Capital One" per Skift reporting. While Hopper disputes
      the revenue impact characterization and Dakota Smith emphasized the transition to an API-only
      relationship, the structural dependency on a single partner is evident: B2B accounted for 90%
      of revenue and Capital One was the largest client. Second, Hopper's consumer app user base
      declined 22% year-on-year to 35M in 2024, with app downloads collapsing from 18.7M in 2023
      to 4.5M in 2024, signaling meaningful deterioration in organic consumer acquisition. Third,
      the company executed two significant layoff rounds in 13 months, reducing core headcount from
      ~1,300 to ~400, which implies sustained cash burn pressure even as management frames the
      restructuring as a deliberate pivot to B2B efficiency. Fourth, Hopper has not disclosed its
      gross margin, EBITDA margin, monthly burn, or cash on hand, making it impossible to
      independently validate the EBITDA profitability claim or assess capital adequacy. Fifth,
      revenue figures from two credible sources conflict: $686.9M ARR (Latka) versus $850M total
      revenue (Business of Apps, Electroiq), suggesting either different reporting scopes or
      methodologies that have not been reconciled publicly.
    claimRefs:
      - CI012
      - CI015
      - CI016
      - CI026
      - CI027
      - CI001
      - CI002
    tableRefs:
      - TI005
    figureRefs: []

  - id: financial-verdict
    title: Financial Verdict and Evidence Gaps
    body: >-
      The public financial record supports a high-growth revenue trajectory and a credible B2B
      infrastructure thesis — HTS is demonstrably winning enterprise partnerships at global banks
      and airlines — but the capital adequacy picture is opaque and the Capital One transition
      introduces material near-term revenue risk. Positive EBITDA was claimed for the first time,
      which is a significant milestone, but no independent verification exists. The consumer app
      is a declining funnel that now functions primarily as a product sandbox rather than a
      meaningful growth driver. Key diligence blockers include: (1) No disclosed gross margin,
      EBITDA, or cash-on-hand data; (2) Revenue composition conflict between $686.9M and $850M
      figures; (3) Unknown quantitative impact of Capital One's transition from managed platform
      to API; (4) No public disclosures of forward revenue under signed HTS contracts. Investors
      must obtain unaudited management accounts, the Capital One API revenue run rate, a partner
      revenue concentration analysis, and the forward contracted bookings pipeline before making
      a capital decision.
    claimRefs:
      - CI001
      - CI002
      - CI013
      - CI038
    tableRefs: []
    figureRefs: []

