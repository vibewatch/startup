  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Reconciliation of the $686.9M ARR (Latka) versus the $850M total revenue figure
        (Business of Apps, Electroiq), including the scope, timing, and methodology difference
        between the two measures.
      whyItMatters: >-
        The $163M discrepancy between the two figures represents over 20% of the lower figure
        and could reflect deferred revenue, B2B contract value treatment, or different measurement
        windows — each of which has material underwriting implications.
      diligencePath: >-
        Request management-prepared P&L or revenue recognition policy document that defines
        ARR, total revenue, and gross bookings consistently; obtain trailing 12-month actuals
        reconciling each figure.
      relatedQuestionRefs:
        - QI001

    - type: private-evidence-only
      severity: blocking
      topic: Capital One
      missingEvidence: >-
        The quantitative revenue impact of Capital One's March 2026 transition from managed
        platform to API-only client, including pre- and post-transition run-rate revenue from
        Capital One and the revenue replacement timeline.
      whyItMatters: >-
        Capital One was Hopper's largest client within a B2B segment comprising 90% of revenues.
        The magnitude of this gap determines whether claimed positive EBITDA is sustainable or
        reflects a pre-departure baseline.
      diligencePath: >-
        Request Capital One revenue line for 2024 and projected 2026 API revenue; obtain full
        customer concentration table showing top 5 partners as % of revenue before and after
        March 2026.
      relatedQuestionRefs:
        - QI006
        - QI028

    - type: private-evidence-only
      severity: blocking
      topic: profitability
      missingEvidence: >-
        Audited or management-prepared income statement showing gross margin, operating expenses,
        EBITDA, and net income/loss for the trailing 12 months through March 2026.
      whyItMatters: >-
        Positive EBITDA was claimed by management but no independent verification exists. Without
        a P&L, investors cannot assess whether profitability is structural or the result of one-
        time cost cuts, and cannot model forward margin trajectory.
      diligencePath: >-
        Request trailing 12-month GAAP P&L with segment detail, stock-based compensation addback
        schedule, and definition of "EBITDA" used by management; obtain quarterly cadence for
        the past 8 quarters.
      relatedQuestionRefs:
        - QI007
        - QI009
        - QI020

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Current cash on hand, monthly operating burn rate, and projected runway given the last
        disclosed financing (November 2022) and the Capital One asset sale proceeds (~$96M).
      whyItMatters: >-
        A 3.5-year gap since the last equity raise is unusual for a growth company at this scale.
        Without burn and runway data, the urgency of the next capital event (IPO or new round)
        cannot be assessed.
      diligencePath: >-
        Request most recent balance sheet and trailing 6-month cash-flow statement; confirm
        whether the Capital One ~$96M asset sale proceeds have been received and their impact
        on cash position.
      relatedQuestionRefs:
        - QI015
        - QI023

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        First-party CAC data by acquisition channel (paid search, social, referral, B2B-sourced),
        consumer LTV by cohort, and HTS per-partner contracted minimum commitments.
      whyItMatters: >-
        CAC estimates from third parties ($48 paid, $12 referral) are low-confidence. Without
        LTV/CAC by channel, the economics of the consumer app cannot be assessed against the
        B2B-only alternative. Partner minimum commitments drive revenue floor predictability.
      diligencePath: >-
        Request first-party CAC and LTV data from Hopper's marketing and finance teams; request
        sample HTS partner agreement showing transaction minimums, revenue-share tiers, and
        contract terms.
      relatedQuestionRefs:
        - QI014
        - QI027

    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: >-
        Product-line and geography revenue breakdown for both B2C and HTS segments, including
        revenue by fintech product type (CFAR vs. DAFAR vs. Price Freeze vs. Car Rental Shield)
        and by partner category (banks vs. airlines vs. OTAs).
      whyItMatters: >-
        Without segment detail, the margin quality and concentration risk of individual revenue
        lines cannot be assessed. Fintech product mix drives blended margin profile.
      diligencePath: >-
        Request segment management accounts with revenue and gross profit by product line and
        geography; request HTS fintech product-level P&L contribution for the trailing year.
      relatedQuestionRefs:
        - QI021
        - QI017

    - type: private-evidence-only
      severity: material
      topic: IPO
      missingEvidence: >-
        Board-approved IPO roadmap, including exchange selection, auditor engagement status,
        regulatory filing preparation, and target float timeline.
      whyItMatters: >-
        Investors need to know whether Hopper is 12, 24, or 36+ months from IPO to calibrate
        liquidity risk and returns horizon. The $10B target valuation implies a 2× uplift from
        the $5B mark set in 2022 and requires a credible path.
      diligencePath: >-
        Request management and board presentations on IPO readiness, including audited financial
        statements status, S-1 preparation timeline, and any regulatory feedback received.
      relatedQuestionRefs:
        - QI010
        - QI019
        - QI019
