companyProfile:
  summary: Hopper is a Montreal-based travel technology company founded in 2007 that combines a consumer mobile app for flights, hotels, cars, and vacation homes with a higher-growth B2B platform, Hopper Cloud/HTS, that sells pricing intelligence and fintech ancillaries to banks, airlines, and travel brands. Its core differentiators are AI-driven price prediction, embedded protections such as Cancel For Any Reason and Price Freeze, and a partner network that reaches hundreds of millions of cardholders. The diligence question is not whether Hopper has real product-market fit, but whether its current private-market valuation remains justified after Capital One internalized much of the managed-platform relationship in March 2026 and public financial disclosure remains thin.
