  customerFocus: Consumers booking travel directly, plus banks, airlines, hotels, and travel brands embedding travel-booking and fintech modules.
  businessModel: Transaction commissions and ancillary fintech revenue in the consumer app, plus API, white-label, and profit-share economics through the HTS B2B platform.
