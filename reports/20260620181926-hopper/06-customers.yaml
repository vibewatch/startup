  - id: section-retention-loyalty
    title: Retention, Repeat Usage, and Fintech Loyalty Dynamics
    body: >
      Hopper does not publicly disclose formal B2B retention metrics such as Net Revenue Retention (NRR), Gross
      Revenue Retention (GRR), or logo churn rates for HTS enterprise partners. For the consumer app, no NPS,
      cohort survival curve, or formal churn statistic has been disclosed. Diligence must request this data directly
      from management.

      The most concrete retention signal available for B2B fintech products comes from HTS's own conference
      presentations: CFAR buyers who exercise the product are 5.8× more likely to repurchase on future bookings than
      non-exercisers, and the broader fintech product repeat purchase rate is stated at 84%. HTS has sold "millions"
      of fintech products across 180+ countries and paid $33 million in CFAR refunds to exercising customers in
      2025. These metrics suggest genuine consumer attachment to the fintech layer — but all three data points
      originate from HTS's own marketing materials and conference presentations, not from independent audits or
      partner disclosures, limiting their confidence rating.

      For B2B enterprise retention, the best available proxy is partner tenure. Capital One was the founding managed-
      platform partner from December 2020 through March 2026 — a 4.5-year relationship — before insourcing the
      technology. Other long-tenured bank partners (SMCC Japan, Lotte Card, Commonwealth Bank) have been live for
      1–2 years without publicized renewals or terminations. Air Canada has been an HTS fintech partner for
      approximately four years. These tenures suggest that enterprise B2B clients do not churn rapidly once
      integrated, but the Capital One insourcing event introduces a new pattern: large clients may "graduate" from
      managed platform to API-only and then further insource even API capabilities as their in-house engineering
      teams mature. This "partner graduation" risk is unique to HTS's business model and should be stress-tested
      in diligence.

      Consumer app loyalty is partially supported by the Carrot Cash program. Users earn 1–5% cashback on bookings
      redeemable on future bookings through the Hopper Wallet. The closed-loop structure incentivizes repeat
      booking on the Hopper platform, but no cohort survival data has been published. Given the 22% decline in
      active users and the 76% download decline in 2024, consumer-side retention appears to be weakening, even if
      average revenue per retained user is increasing through higher fintech attach rates. The combination of
      declining user counts and increasing per-user monetization is consistent with a platform that is consolidating
      toward a more valuable but smaller core of high-intent, fintech-using travelers.
