  - id: section-b2b-partners
    title: B2B Enterprise Customer Roster — HTS Partner Evidence
    body: >
      HTS (Hopper Technology Solutions), the B2B arm of Hopper, operates as a travel fintech infrastructure
      provider for banks, airlines, and consumer-tech platforms. As of June 2026, HTS has publicly confirmed
      product integrations with more than 50 partners globally, grouped into three categories: bank and credit-card
      loyalty portals, airline fintech ancillaries (Cancel for Any Reason and Disruption Assistance), and
      consumer-tech platform embeddings (Tripadvisor, Uber).

      The most consequential bank-portal clients are Capital One (the founding "keynote" partner, now API-only after
      March 2026 insourcing), Royal Bank of Canada (new long-term agreement signed March 2026, replacing the prior
      Expedia arrangement for Avion Rewards Travel), Nubank (Brazil's largest digital bank with 100+ million
      customers, live since 2024 via the NuViagens marketplace portal), and Commonwealth Bank of Australia (live
      since 2024 via the CommBank app for 6+ million eligible customers). Phocuswire reporting in 2024 confirmed
      additional bank partnerships in Japan (Sumitomo Mitsui Card Co. / SMCC) and South Korea (Lotte Card), giving
      HTS confirmed presence across North America, Latin America, Asia-Pacific, and Europe. Dakota Smith stated that
      HTS has identified up to 30 global markets for bank-travel partnerships, with a pipeline of deals "cooking
      since last summer" (i.e., mid-2024) at the time of reporting.

      On the airline side, Air Canada has been an HTS fintech partner since approximately 2022, offering CFAR on
      all fare types. WestJet launched HTS CFAR on WestJet.com and the WestJet app in June 2026 with 80% and 100%
      refund-tier options. Porter Airlines went live with HTS Disruption Assistance (branded as Delay and
      Cancellation Assistance) in 2026. Wizz Air became the first European airline to deploy HTS Disruption
      Assistance. The airline roster demonstrates that HTS is expanding beyond North American carriers into
      Europe and low-cost carriers. Tripadvisor launched in-app hotel bookings powered by HTS in August 2024, and
      Uber Flights (UK) has been powered by HTS since 2023.

      All named deployments are in production, with the partial exception of the RBC Avion Rewards portal, which
      was announced in March 2026 but was described as launching "later this year." The Capital One relationship
      has been restructured from a fully managed platform to an API-only arrangement, reducing HTS's operational
      role while retaining data and fintech API connections. HTS claims that more than 400 million credit card
      customers are reachable through its bank partner network, and that total annual card spend across those
      partners exceeds $1.6 trillion.
