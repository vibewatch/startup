  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-one-revenue-impact
      missingEvidence: >-
        Confirmed post-March 2026 revenue run rate from Capital One API arrangement versus prior managed-platform
        revenue; absolute revenue step-down or continuity figure.
      whyItMatters: >-
        Capital One was Hopper's largest B2B client and B2B was ~90% of revenue; the magnitude of the revenue
        step-down is the primary underwriting variable for the business's financial trajectory.
      diligencePath: >-
        Request management confirmation of pre- and post-transition Capital One revenue (Q4 2025 vs Q2 2026);
        review any contractual minimum volumes in the API arrangement; compare Skift's characterization to
        audited financials.
      relatedQuestionRefs:
        - QU022

    - type: private-evidence-only
      severity: material
      topic: b2b-enterprise-retention
      missingEvidence: >-
        HTS enterprise partner NRR, GRR, logo retention, and contract renewal rate data across all bank,
        airline, and consumer-tech partner categories.
      whyItMatters: >-
        Without retention metrics, it is impossible to distinguish a growing B2B business from one that is
        churning partners and replacing them with new logos at similar scale.
      diligencePath: >-
        Request NRR/GRR, logo churn, contract term lengths, and renewal rates for all HTS partner categories
        in management diligence; ask for historical partner churn disclosures.
      relatedQuestionRefs:
        - QU019

    - type: private-evidence-only
      severity: material
      topic: consumer-nps-retention
      missingEvidence: >-
        Independent or company-disclosed Net Promoter Score, cohort survival curve, or formal churn/retention
        statistic for the Hopper consumer B2C app.
      whyItMatters: >-
        The consumer app's value as a product-development sandbox for HTS depends on retaining an engaged
        user base capable of validating innovations; deteriorating retention undermines this strategic function.
      diligencePath: >-
        Request consumer app NPS, D30/D90 retention cohorts, and booking frequency per user from management;
        cross-check against app store reviews and downloads.
      relatedQuestionRefs:
        - QU027

    - type: enumeration-incomplete
      severity: minor
      topic: hts-partner-roster
      missingEvidence: >-
        Full enumeration of all 50+ HTS product partnerships; names, deployment status, and scale metrics for
        unlisted partners in the bank, airline, and consumer-tech segments.
      whyItMatters: >-
        Concentration in a small number of named, high-revenue partners may not be visible without the full
        partner roster; true diversification can only be assessed with the complete list.
      diligencePath: >-
        Request full partner list, deployment status, revenue contribution by segment, and contact references
        for at least three partners not already covered in public announcements.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: hts-fintech-attach-rates
      missingEvidence: >-
        Per-partner CFAR and Disruption Assistance attach rates, claim rates, loss ratios, and per-policy
        revenue contribution for both airline and bank-portal channels.
      whyItMatters: >-
        Fintech ancillary economics drive a significant share of HTS profitability; without attach and loss
        data, it is impossible to assess whether the 84% repeat purchase rate and $33M refund figure represent
        attractive unit economics or a loss-generating product cross-subsidised by commission revenue.
      diligencePath: >-
        Request per-product P&L, attach rates, claim rates, and loss ratios for CFAR and Disruption Assistance
        for both airline and bank channels; compare to industry benchmarks.
      relatedQuestionRefs:
        - QU013
