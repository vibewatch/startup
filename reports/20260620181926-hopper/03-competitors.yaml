    - Medium — Consumer-side trust issues create recruitment friction for new HTS bank partners
    - Require Hopper to share NPS, Trustpilot trend, and refund resolution rate before next diligence stage
  notes: Severity ratings (Low / Medium / High) are qualitative assessments based on evidence of actual threat materialization
