  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hts-revenue
    missingEvidence: Audited HTS revenue figures, gross margin by product line, and breakdown of B2B contract values by partner
      tier are not publicly disclosed.
    whyItMatters: HTS is now >90% of Hopper's revenue; without audited financials the 60% partner margin and 50% YoY growth
      claims cannot be independently verified, affecting confidence in the B2B moat thesis.
    diligencePath: Request Hopper management accounts or audited financials; obtain HTS partner contract structures including
      minimum revenue guarantees and revenue-share rates.
    relatedQuestionRefs:
    - QP009
    - QP023
  - type: private-evidence-only
    severity: material
    topic: capital-one-revenue-impact
    missingEvidence: The exact revenue contribution of the Capital One HTS partnership to Hopper's total revenue is not publicly
      disclosed, making it impossible to quantify the March 2026 acquisition's revenue impact.
