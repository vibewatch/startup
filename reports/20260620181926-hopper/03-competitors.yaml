- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat Claim
  - Primary Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - AI price prediction data moat (proprietary fare history + ML models)
    - Google Flights added booking-timing prediction in 2025 for free; Kayak has similar alerts
    - Medium — Google's model is aggregate not per-route; Hopper's remains more granular
    - Verify whether Hopper's ML retains a durable accuracy advantage at the route level vs Google's
  - - Carrot Cash closed-loop loyalty lock-in
    - Users can abandon Carrot Cash credit if a competitor offers a lower total price
    - Low-Medium — switching cost is real but modest (1–5% cashback value at stake)
    - Assess Carrot Cash balance distribution and redemption rate; quantify churn after credit exhaustion
  - - HTS white-label platform stickiness (multi-year enterprise contracts)
    - Partners with sufficient scale can internalize technology (Capital One precedent, March 2026)
    - High — Capital One tech acquisition ($96M) showed largest partners can exit once capable
    - Confirm contract exclusivity clauses, minimum revenue guarantees, and data-portability restrictions
  - - HTS fintech ancillary margin advantage (60% partner channel margin; 84% repeat purchase)
    - Incumbent OTAs (Expedia, Booking) building their own fintech products; insurance market alternatives
    - Medium — No OTA has yet matched HTS fintech at global scale; risk is 2–4 year horizon
    - Track Expedia Partner Solutions and Booking B2B for fintech product launches; request HTS margin trend
  - - Mobile-first UX and Gen Z / millennial acquisition advantage
    - Google Flights' mobile parity improving; Booking and Expedia investing in mobile UX
    - Low-Medium — Hopper's native-app experience still leads but advantage is narrowing
    - Review app store ratings quarterly; benchmark against Google Flights mobile UX via A/B test data
  - - HTS network effects (partner data flywheel → better fintech pricing → more partners)
    - Data portability if partners move in-house; regulation limiting data sharing with partners
    - Medium — Flywheel depends on partner data contributions; large partner exits reduce signal quality
    - Request HTS data-sharing terms with partners and evaluate resilience to single-partner data loss
  - - Google as free-traffic gatekeeper (controls meta-search funnel)
    - Google can deepen fintech tie-ins or launch booking directly, further bypassing OTAs
    - High — Google's zero-fee model structurally undercuts Hopper's consumer monetization
    - Monitor Google Flights for direct booking tests; evaluate Hopper consumer CAC and LTV trend
  - - Consumer trust deficit (Trustpilot 1.6/5; refund delays; hidden-fee complaints)
