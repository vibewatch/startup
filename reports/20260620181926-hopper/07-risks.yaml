  - id: supplier-inventory
    title: Supplier and Inventory Concentration Risk
    body: >-
      Hopper's consumer marketplace and HTS B2B platform depend on continuous access to flight and hotel
      inventory sourced through a combination of GDS networks, direct airline connects, NDC feeds, and
      third-party API aggregators. Three GDS providers—Amadeus, Sabre, and Travelport—collectively control
      approximately 65% of the global GDS market, giving them substantial pricing and contract leverage
      over OTAs including Hopper. GDS vendor lock-in creates vulnerability: fee increases, technical
      outages, or contract renegotiations can directly affect inventory depth and pricing competitiveness
      with limited lead time to switch.

      This exposure is amplified by IATA's NDC (New Distribution Capability) initiative, under which
      airlines increasingly route their best fares and ancillary products through direct or NDC APIs
      rather than legacy GDS channels. OTAs that are slow to build NDC integrations risk losing access to
      competitive inventory, undermining the price-prediction value proposition that is Hopper's core
      consumer differentiator. Hopper's hotel inventory was substantially built through Expedia's Rapid
      API—providing access to 700,000+ properties at the time of the 2023 termination—and through
      direct partnerships including SiteMinder and Evolve. The 2023 Expedia termination temporarily
      removed a major supply source, though Hopper stated its multi-sourced strategy would prevent
      consumer impact. The eventual resumption demonstrates the dependency's persistence. For HTS B2B
      partners, Hopper's content breadth and pricing accuracy are core product promises; any deterioration
      in inventory access directly affects partner satisfaction and contract retention.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
    tableRefs:
