callouts:
  - calloutType: risk
    title: Capital One Transition Creates an Unquantified Revenue Cliff
    body: >-
      Capital One was Hopper's largest B2B partner across the managed-platform era, and analysts
      estimated it represented the majority of HTS B2B managed earnings. The March 2026 insourcing
      converted Capital One from managed-platform client to API-only client for $96M. The
      post-transition API revenue run-rate from Capital One has not been publicly disclosed. Until
      management provides a pre- and post-transition revenue bridge, the profitability claim—and by
      extension the $10B IPO valuation target—cannot be independently evaluated by an investor.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR037

  - calloutType: risk
    title: Documented Consumer Complaint Pattern Creates Regulatory and Litigation Exposure
    body: >-
      A consistent, documented pattern of unresolved CFAR refund disputes—confirmed across Trustpilot
      (1.6/5 from thousands of reviews), PissedConsumer (7,500+ reviews citing 60–90-day refund delays),
      and ComplaintsBoard (0% resolution rate)—provides the evidentiary record required to support
      regulatory referrals, class action standing, or FTC inquiry. The California AG's June 2026
      Affordability Response Team and New York's One Fair Price Act both explicitly target the type
      of algorithm-driven travel and technology pricing that Hopper employs.
    claimRefs:
      - CR040
      - CR041
      - CR042
      - CR043
      - CR022
      - CR024

