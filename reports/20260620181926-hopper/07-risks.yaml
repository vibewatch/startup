        managed-platform earnings. Without a revenue bridge, the profitability claim and $10B IPO
        target valuation cannot be evaluated.
      diligencePath: >-
        Request management-prepared revenue bridge showing Capital One contribution in 2024 vs.
        projected 2026 API-only run-rate; obtain top-5 partner revenue concentration table.
      relatedQuestionRefs:
