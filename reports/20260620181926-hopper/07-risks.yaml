    - type: private-evidence-only
      severity: blocking
      topic: regulatory
      missingEvidence: >-
        Hopper's state-by-state insurance producer license register confirming CFAR, DAFAR, and
        Price Freeze product compliance across all 38 states that have enacted the NAIC Travel
        Insurance Model Act and other jurisdictions where Hopper operates.
      whyItMatters: >-
        Operating without a state insurance license is an illegal activity; a gap in any major
        state would expose Hopper to product withdrawal orders, fines, and premium tax
        back-assessments, directly affecting partner deployments.
