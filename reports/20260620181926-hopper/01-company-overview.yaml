  - id: section-5
    title: Milestones, Adverse Events, and Diligence Flags
    body: >
      Hopper's public milestone record runs from its 2007 founding through a slow data-science build phase, the
      January 2015 consumer app launch (which won Apple's App of the Year that year), a multi-round financing arc
      from 2016 through 2022, and an increasingly turbulent 2020-to-2026 period marked by workforce reductions and
      partner volatility.


      The COVID-19 period is the first inflection: the global travel collapse in 2020 forced approximately a 40%
      workforce reduction (estimated 250 staff). The company shifted its strategic emphasis toward B2B through
      Hopper Cloud during this period, positioning the consumer app as a product testing ground rather than the
      primary revenue engine. This pivot is the strategic context for everything that followed.


      The Expedia dispute is the second and more consequential inflection. In July 2023, Expedia terminated its
      Hopper Cloud partnership, removing a major source of B2B revenue and directly precipitating the October 2023
      30% workforce reduction (approximately 200 staff). Expedia later renewed its contract in November 2024, but
      the renewal was accompanied by a concurrent 10% workforce reduction that Hopper described as a restructuring
      to improve unit economics. The near-simultaneous renewal and layoff is a notable governance signal.


      The Capital One March 2026 event is the third and current inflection. Capital One announced it would bring
      the Capital One Travel technology in-house, acquiring approximately 150 Hopper staff and the underlying
      technology stack. Skift and Business Travel News reported this as a shift in Hopper's Capital One
      relationship from a managed-platform model to an API-only arrangement. The milestone table and timeline below
      record these events in sequence as the canonical chronology for the rest of the report. The BBB complaint
      record and the pattern of customer service criticism are captured as a fourth diligence dimension; details
      are in the evidence gap section because the public record does not provide enough resolution to draw
      conclusions about the aggregate complaint rate or resolution efficacy.
    claimRefs:
