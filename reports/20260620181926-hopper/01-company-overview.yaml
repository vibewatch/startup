  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: profitability-and-audited-financials
      missingEvidence: Audited income statement, EBITDA, and unit economics (revenue per booking, fintech attach rate, B2B contract margins).
      whyItMatters: Without audited financials, the revenue and margin profile cannot be verified; the company's path to profitability is unknown from public sources alone.
      diligencePath: Request audited or management-account financials, unit economics by segment, and confirmation of current-year revenue trajectory from the data room.
      relatedQuestionRefs:
        - QO021
    - type: stale
      severity: material
      topic: current-valuation
      missingEvidence: A current fair-market valuation or independent appraisal as of or near the run date, replacing the stale $5B November 2022 reference.
      whyItMatters: The last disclosed valuation is approximately 3.5 years old. Capital One's insourcing, three layoff rounds, and the absence of a new primary round all affect the implied valuation materially.
      diligencePath: Obtain a recent independent valuation, review Stack Capital NAV filings for implied per-share pricing, and request any management-prepared 409A or board-approved valuation materials.
      relatedQuestionRefs:
        - QO027
    - type: missing-source
      severity: material
      topic: post-insourcing-new-funding
      missingEvidence: Any new primary investment round, debt facility, or convertible note issued after November 2022; confirmation of current capital structure.
      whyItMatters: If no new capital has been raised since November 2022, the company has been funding operations from existing cash and B2B revenue for more than 3.5 years through a period of significant restructuring.
      diligencePath: Request current capitalization table and any post-November 2022 financing instruments from management; review Stack Capital disclosures for implied valuation changes.
      relatedQuestionRefs:
        - QO028
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: leadership-org-chart
      missingEvidence: Full executive team beyond CEO and CTO — CFO, COO, CPO, VP Engineering, VP Sales, and board of directors composition with seat holders.
      whyItMatters: Key-person risk assessment is incomplete without visibility into the bench depth below founders; board composition affects governance diligence.
      diligencePath: Request org chart, executive bios, and board composition from management; review any filings from Stack Capital for investor board seat disclosures.
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: milestone-table-completeness
      missingEvidence: Pre-2015 internal milestone dates (product iterations, early partnership experiments), post-November 2024 operational updates, and the exact terms and timing of each Hopper Cloud partner contract.
      whyItMatters: The public milestone record has gaps in the 2007-to-2015 period and is unlikely to capture all material events in the 2024-to-2026 period given the pace of change.
      diligencePath: Request a complete company timeline from management including unannounced product iterations, early partner contracts, and the Capital One post-insourcing operating plan.
      relatedTableRefs:
        - TO004
