callouts:
  - calloutType: strength
    title: Proprietary AI price prediction and fintech IP
    body: >-
      Hopper's core asset is a decade-old AI price prediction engine backed by billions of historical price data
      points. This proprietary capability underlies both the consumer app and Hopper Cloud, and its fintech
      products (price freeze, cancel-for-any-reason) have proven commercially viable at scale with multiple airline
      and OTA partners. The IP is sufficiently valuable that Capital One chose to acquire Hopper's technology stack
      in March 2026 rather than rebuild it internally.
    claimRefs:
      - CO003
      - CO004
      - CO007
      - CO028
      - CO034
  - calloutType: risk
    title: Capital One concentration and post-insourcing revenue uncertainty
    body: >-
      Capital One was Hopper's largest B2B partner and most recent primary investor. Its March 2026 decision to
      insource Hopper's technology and approximately 150 staff restructured the company's largest revenue
      relationship from a managed-platform arrangement to an API-only contract. The revenue impact of this shift
      is not publicly quantified and represents the single most material open question for any current diligence.
      The post-insourcing B2B revenue run rate and the terms of the new API agreement must be confirmed directly
      from management.
    claimRefs:
      - CO018
      - CO022
      - CO030
      - CO034
      - CO039
  - calloutType: risk
    title: Stale valuation and opaque financials
    body: >-
      The last confirmed primary round was $96 million at a $5 billion valuation in November 2022 — now
      approximately 3.5 years stale at the run date. No audited revenue, margin, or profitability figures are
      publicly available. The Capital One insourcing, three rounds of layoffs (2020, 2023, 2024), and the
      absence of a new primary round all complicate any current valuation estimate. Stack Capital Group's NAV
      disclosures provide the only external implied-price signal but are not a substitute for a full financial
      diligence package.
    claimRefs:
      - CO017
      - CO018
      - CO022
      - CO025
      - CO039
      - CO045
  - calloutType: assumption
    title: Revenue and GBV estimates are analyst-derived, not company-confirmed
    body: >-
      The $850 million revenue and $7.5 billion GBV figures cited in this chapter are drawn from businessofapps.com
      and electroiq.com analyst aggregation sources. Neither figure is confirmed by Hopper. Later chapters should
      replace these estimates with data-room financials and clearly flag any residual gap if internal figures are
      not made available.
    claimRefs:
      - CO026
      - CO027
      - CO045

