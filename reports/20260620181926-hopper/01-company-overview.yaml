runDate: '2026-06-20'
company:
  name: Hopper
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Hopper is a Montreal-based AI-powered travel app and B2B fintech platform founded in 2007 by Fred Lalonde and
    Joost Ouwerkerk; it has raised approximately $740 million and was last valued at $5 billion in November 2022. The
    company's commercial model has pivoted sharply toward B2B through Hopper Cloud, but Capital One's March 2026
    insourcing of Hopper's travel technology and ~150 staff is the most consequential recent development, creating
    material concentration risk and diligence questions about Hopper's post-insourcing revenue base and strategic
    direction.

sections:
  - id: section-1
    title: Identity and Business Model
    body: >
      Hopper is a Canadian travel technology company headquartered in Montreal, Quebec, with additional offices in
      Boston and other cities. It was founded in 2007 — not 2008 as sometimes cited — and went through a multi-year
      research and development phase before launching a consumer mobile app publicly in January 2015. The company's
      foundational innovation is an AI-driven price prediction engine that analyzes billions of flight and hotel price
      data points to advise travelers on the optimal time to buy. That prediction capability, combined with in-app
      fintech products such as price freeze and cancel-for-any-reason insurance, has been the engine of both consumer
      adoption and the subsequent B2B business.


      Hopper operates a dual-track business model. The consumer-facing Hopper app (B2C) serves as a direct booking
      channel for flights, hotels, car rentals, and vacation homes, while also acting as a product sandbox where new
      fintech features are tested before being offered to business partners. The B2B channel, branded Hopper Cloud and
      operated under the HTS (Hopper Technology Solutions) entity, licenses Hopper's AI pricing engine and fintech
      modules to airlines, hotels, banks, and online travel agencies via an API and white-label platform. As of 2025,
      analyst estimates suggest that B2B revenue accounts for approximately 90% of Hopper's total revenue, a shift
      that accelerated following COVID-19 and the 2023 Expedia contract dispute.


      The business model should be understood as fundamentally dependent on a small number of large B2B partners.
      Capital One Travel has been the largest single B2B relationship, and the March 2026 decision by Capital One to
      insource Hopper's technology stack and acquire approximately 150 Hopper staff changes the nature of that
      dependency from a managed platform arrangement to an API-only relationship. Diligence should treat the
      post-insourcing B2B revenue base as an open question requiring direct confirmation from management.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO001
    figureRefs:
      - FO002

  - id: section-2
    title: Founders, Leadership, and Key-Person Risk
    body: >
      Hopper was co-founded by Fred Lalonde and Joost Ouwerkerk. Lalonde serves as CEO and is the public face and
      primary strategic voice of the company. His prior entrepreneurial record includes co-founding IgoUgo, a
      travel review and community site that was acquired by Rand McNally in 2007, and an earlier career at Cossette
      Communications. Ouwerkerk serves as CTO and has been with the company since founding. The two co-founders are
      the only named executives consistently referenced in public materials; the identities of Hopper's CFO, COO,
      and other C-suite members have not been publicly disclosed, creating a meaningful gap for any governance or
      succession diligence.


      The leadership structure creates a pronounced key-person dependency. Both Lalonde and Ouwerkerk appear to
      control the company's strategic direction, partner relationships, and technical roadmap. The absence of public
      information about a broader executive team means that the bench depth, succession planning, and organizational
      resilience cannot be assessed from external sources alone. Diligence should include an org-chart request and
      interviews with senior leadership beyond the founders. Note that the leadership table below covers only the
      most publicly documented figures; it is explicitly partial and should be supplemented with data-room
      materials.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
    tableRefs:
      - TO002

  - id: section-3
    title: Funding, Valuation, and Investors
    body: >
      Hopper has raised an estimated $740 million across all disclosed and inferred venture rounds, though no
      company-published cumulative total is available. The funding history runs from early-stage rounds in
      approximately 2013 to 2016 through a Series D of approximately $98 million in May 2018, a Series E of
      approximately $100 million in 2019, and a Series G of $175 million in August 2021 led by Capital One Ventures,
      Citi Ventures, WestCap Group, and Temasek Holdings at a reported $3.5 billion valuation. The most recent
      disclosed primary round was $96 million from Capital One in November 2022 at a $5 billion post-money
      valuation.


      The $5 billion valuation is now materially stale. No new primary round has been publicly reported since
      November 2022, which means the reference valuation is approximately 3.5 years old at the current run date.
      Capital One's decision to insource Hopper's technology in March 2026 further complicates a valuation
      assessment: the insourcing removes a captive revenue stream and restructures what was Hopper's largest partner
      relationship. Any current valuation estimate would require fresh internal financial data and a reassessment of
      the B2B revenue run rate under the post-insourcing model.


      Stack Capital Group, a publicly listed Canadian investment company (TSX: STCK), holds a disclosed stake in
      Hopper and has referenced it in its net asset value statements, providing one of the only public windows into
      the private company's cap table. CDPQ (Caisse de dépôt et placement du Québec), Quebec's largest pension fund,
      has invested across multiple rounds since at least 2018, making it a long-tenured institutional holder. The
      full cap table, preference stack, anti-dilution terms, and board seat assignments are not public.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
