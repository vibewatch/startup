  - id: section-4
    title: Scale, Products, and Metrics
    body: >
      Hopper's consumer app has been downloaded more than 100 million times as of 2024, making it one of the
      larger travel apps by cumulative installs. The app offers flight search and booking (the original product),
      hotel search and booking (added ~2018), vacation home rental via Hopper Homes (added 2021), and car rental
      (added 2022). A suite of fintech products — price freeze, cancel-for-any-reason, flexible date change — can
      be purchased as add-ons. These same fintech products are the core of the Hopper Cloud B2B offering sold to
      airline, hotel, and OTA partners.


      The scale metrics available from public sources are either company-claimed, analyst-estimated, or both, and
      none carry audited status. Analyst sources estimate 2024 gross bookings value at approximately $7.5 billion
      and total revenue at approximately $850 million, though neither figure is confirmed by the company. Employee
      count has declined materially: from a reported peak of approximately 700 staff to an estimated 400 core
      employees following the 2020, 2023, and 2024 workforce reductions and the March 2026 Capital One insourcing
      of approximately 150 additional staff. The B2B revenue share is estimated at roughly 90% of total as of 2025,
      though this figure is derived from analyst analysis rather than company disclosure.


      Given the absence of audited financials and the consequential nature of the Capital One insourcing, all
      revenue, bookings, and headcount figures should be treated as directional estimates. Later chapters should
      reuse these as public reference points subject to data-room confirmation.
    claimRefs:
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
