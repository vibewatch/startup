      - number: '4.5'
        title: Adverse Financial Signals and Revenue Risk
        blocks:
          - type: paragraph
            body: >-
              Several adverse financial signals are material to underwriting. First, Capital One—Hopper's largest
              managed-platform client—brought Capital One Travel in-house in March 2026, and Hopper lost "most of its
              revenue stream from Capital One" per Skift reporting. While Hopper disputes the revenue impact
              characterization and Dakota Smith emphasized the transition to an API-only relationship, the structural
              dependency on a single partner is evident: B2B accounted for 90% of revenue and Capital One was the
              largest client. Second, Hopper's consumer app user base declined 22% year-on-year to 35M in 2024, with app
              downloads collapsing from 18.7M in 2023 to 4.5M in 2024, signaling meaningful deterioration in organic
              consumer acquisition. Third, the company executed two significant layoff rounds in 13 months, reducing
              core headcount from ~1,300 to ~400, which implies sustained cash burn pressure even as management frames
              the restructuring as a deliberate pivot to B2B efficiency. Fourth, Hopper has not disclosed its gross
              margin, EBITDA margin, monthly burn, or cash on hand, making it impossible to independently validate the
              EBITDA profitability claim or assess capital adequacy. Fifth, revenue figures from two credible sources
              conflict: $686.9M ARR (Latka) versus $850M total revenue (Business of Apps, Electroiq), suggesting either
