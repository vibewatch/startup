  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: AI Price Prediction Engine
        blocks:
          - type: paragraph
            body: >-
              Hopper's foundational technology is a machine-learning price-prediction engine that ingests over one
              billion real-time flight, hotel, and car-rental prices each day. The system was the primary innovation
              behind the 2015 consumer app launch and remains the commercial justification for the broader fintech
              product layer. Hopper officially describes the engine as analyzing historical pricing trends, seasonal
              patterns, advance-booking windows, market-supply signals, and special-event demand spikes to produce
              buy-now or wait recommendations. Third-party analyses cite a company-claimed accuracy of approximately 95%
              for flight price predictions up to one year in advance, with accuracy declining for longer horizons and
              complex multi-leg itineraries. The engine surfaces results in a color-coded calendar interface showing
              cheapest (green) to most expensive (red) travel dates, giving users an intuitive data visualization that
              no major OTA competitor replicated at launch.

              The prediction system is not based on any publicly disclosed ML framework, cloud provider, or model
              architecture — Hopper treats these as proprietary. The consumer-facing output is a buy/wait recommendation
              and price-trend chart, with push-notification alerts triggered when prices reach the model's predicted
              low. This notification layer is also the entry point for the Price Freeze product, which monetizes user
              hesitation by letting them lock in the predicted price for a fee. On the B2B side, the same prediction
              engine underpins HTS fintech APIs sold to airlines and banks, creating an internal flywheel where consumer
              app volume improves model accuracy that in turn supports the B2B product value proposition.
            claimRefs:
              - CE001
              - CE002
