      - number: '5.5'
        title: Mobile-First Architecture and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Hopper is structured as a mobile-first platform: its consumer booking product is delivered exclusively
              through native iOS and Android applications, with the hopper.com website providing a secondary browser
              interface. DNS records for hopper.com resolve to Google Cloud infrastructure (nameservers ns-cloud-e1
              through ns-cloud-e4.googledomains.com) and a Twilio domain-verification TXT record, indicating Google
              Cloud and Twilio as two publicly observable infrastructure dependencies. The underlying compute, ML
              training stack, database layer, and CI/CD tooling are not publicly disclosed.

              On the B2B developer side, Hopper maintains a public GitHub repository (hopperteam/hopper-developer)
              containing 18 commits, a RESTful API specification, and developer documentation. The API uses
              RSA-key-signed authentication and supports notification, app, and subscription object types for
              white-label partner integrations. The repository is small in scope relative to the full HTS platform — it
              appears to cover the notification and subscription layer of the legacy consumer API rather than the full
              HTS commerce and fintech API surface, which is partner-gated.

              The app store presence signals healthy mobile consumer engagement: 4.8 stars on iOS from 1.2M+ ratings and
              4.6 stars on Android from ~149K reviews, with 10M+ installs on Google Play. Hopper has also planted more
              than 31 million trees through a carbon-offset commitment tied to every booking. The combination of a
              mobile-first consumer UX, opaque internal architecture, and a partner-gated B2B API surface creates a
              meaningful diligence gap for any technical infrastructure assessment.
