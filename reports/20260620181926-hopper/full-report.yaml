      - number: '2.4'
        title: Growth drivers and tailwinds through 2026
        blocks:
          - type: paragraph
            body: >-
              Five structural tailwinds underpin the market opportunity through 2026. First, mobile channel shift: as of
              2024, mobile devices generated 70.5% of global online travel traffic, and app-based bookings held 44–45%
              of OTA booking volume—up from a minority position five years ago. SensorTower reported global travel app
              downloads reached 4.2 billion in 2024 (+3% YoY) and time spent surpassed 20 billion hours for the first
              time (+7.3% YoY). Second, fintech attach-rate expansion: the willingness to pay for travel flexibility has
              widened materially since the pandemic. HTS's own consumer research shows 84% of travelers rate flexibility
              as important when booking flights, and 60% say they would pay for Cancel for Any Reason, rising to 90%
              among frequent travelers. Once a traveler experiences a fintech protection, HTS reports an 84% repeat
              purchase rate. Third, AI-powered personalization: generative AI is entering trip-planning and support
              workflows. Market Research Future projects the GenAI in travel market to grow from $2.22 billion in 2024
              to $18.39 billion by 2035 at 21% CAGR. Trip.com's TripGenie and Expedia's Romie are early mass-market
              examples. Hopper's data advantage in predictive pricing extends naturally to AI-driven recommendations.
              Fourth, APAC and emerging market demand growth: DataHorizzon and GM Insights both cite Asia Pacific as the
              fastest-growing OTA region, with Chinese outbound travel recovering strongly—Trip.com reported 60% growth
              in international bookings in some APAC segments in 2025. Fifth, B2B infrastructure demand: the Carlsquare
              TravelTech report characterizes the $9T travel market as highly fragmented with centralization
              opportunity; B2B SaaS is becoming dominant as airlines seek third-party fintech rather than in-house
              builds, with Deloitte noting AI personalization requirements driving platform investment.
            claimRefs:
