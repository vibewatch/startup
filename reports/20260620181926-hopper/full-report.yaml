  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Hopper competes within three overlapping competitive arenas. First, in consumer travel booking, it faces
              established meta-search engines (Google Flights, Kayak, Skyscanner), deal-alert subscription services
              (Going), and full-service OTAs (Booking.com, Expedia, Airbnb, TripAdvisor). Second, in fintech-wrapped
              travel ancillaries, Hopper's Price Freeze, Cancel for Any Reason (CFAR), and Disruption Assistance
              products differentiate it from all pure OTAs, none of which offer comparable fintech-risk products at
              scale as of June 2026. Third, in the B2B white-label travel-technology market, Hopper's HTS platform
              competes against Expedia Partner Solutions, legacy loyalty platform providers, and financial institutions
              building in-house platforms—as Capital One did in March 2026 by acquiring Hopper's own technology stack.


              The global OTA market is estimated at ~$761.5B in 2026, growing at ~7.4% CAGR toward $1.4T by 2035. The
              top five OTA players (Booking Holdings, Expedia, Airbnb, Trip.com, TripAdvisor) together hold roughly 14%
              of the broader online travel market by revenue, with Booking Holdings and Expedia dominating. Hopper, as a
              private company, is too small by revenue to appear in public market-share tables, but its HTS B2B platform
              serves 400M+ credit card customers across bank partners representing over $1.6T in annual card spend.


              Competitive pressure on Hopper is asymmetric: Google's free meta-search erodes consumer monetization,
              while incumbent OTAs (Booking, Expedia) build parallel B2B arms that directly compete with HTS. The
              Capital One tech acquisition in March 2026 underscores a new risk—large enterprise partners can
              internalize Hopper's technology once they have sufficient scale—but new bank partnerships (RBC Avion,
              Lloyds, Nubank, SMBC) suggest demand for HTS services remains strong.
