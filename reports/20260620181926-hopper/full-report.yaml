      - number: '6.3'
        title: Consumer Satisfaction, Review Evidence, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              Consumer satisfaction for the Hopper app is sharply bifurcated depending on the review platform. On the
              Apple App Store, the app holds a 4.8-out-of-5 rating from more than 1.2 million reviews as of 2026 —
              reflecting strong in-app experiences around price prediction, booking flow, and add-on clarity. However,
              Trustpilot, which disproportionately captures post-booking issues rather than booking-flow satisfaction,
              rates Hopper "Bad" at 1.6 out of 5. The divergence is consistent with a platform where the booking and
              price-prediction UX is strong but post-booking support and refund execution are problematic.

              The Better Business Bureau has recorded 577 complaints against Hopper USA Inc. over the prior three years,
              with 120 complaints in the most recent 12 months (as of mid-2026). Recurring complaint themes include: (1)
              refund processing failures — particularly for CFAR policies where the consumer cancelled within what they
              believed was an eligible window but found the policy terms more restrictive than advertised; (2) hidden
              carrier charges appearing at checkout that were not disclosed in the initial displayed fare; (3)
              car-rental fee discrepancies where the Hopper-displayed price excluded state taxes or cross-state-travel
              surcharges that were collected at the rental counter; and (4) customer support inaccessibility — many
              reviewers report difficulty reaching live agents, with chatbot loops and long hold times as the most
              common friction point.

              Trustpilot reviews from 2025–2026 include multiple accounts of refunds that were promised verbally but
              never processed, hotel refunds misdirected to Hopper's own payment channel rather than the booking card,
              and seat reservations confirmed by Hopper but not registered in the airline's system (attributed to the
              travel aggregation partner TravelFusion in one documented case). Hopper's responses to most negative
              reviews are templated and limited to directing customers to a phone number. Several reviewers report being
              unable to obtain any resolution and escalating to consumer protection bodies.

              The HTS B2B fintech product satisfaction picture is significantly more positive. The official HTS CFAR
              page claims a 98% customer satisfaction rating for CFAR transactions, and the FTE conference presentation
              in June 2026 cited an 84% repeat purchase rate for travelers who had used CFAR or a similar flexibility
              product. HTS also reported delivering $33 million in CFAR refunds to customers in 2025 — evidence that the
              product is being exercised, not just purchased. The divergence between B2C consumer experience and B2B
              fintech-product satisfaction is material for diligence: HTS's self-reported satisfaction metrics are high
              but unaudited, while independent review platforms consistently cite support and refund friction as the
              dominant B2C complaint category.

              Adverse signal: Skift, citing its own independent reporting in March 2026, stated that Hopper "lost most
              of its revenue stream from Capital One" as a result of the insourcing transaction. Hopper's spokesperson
              disputed the characterization, and Dakota Smith emphasized that Capital One remains Hopper's largest API
              client. This conflict between Skift's reporting and Hopper's characterization is unresolved and requires
              direct management confirmation of the post-transition revenue run rate.
