            - Payment processing — PayPal/Braintree/Hyperwallet
            - GDS / NDC airline data feeds
            - PMS partner feeds (Guesty, Rentals United)
        - label: AI Prediction & Intelligence Engine
          modules:
            - Flight price forecasting (95% accuracy claim, 1-year horizon)
            - Hotel and rental-car price prediction
            - Buy/wait/freeze recommendation generation
            - Push-notification trigger engine
        - label: Fintech Products Layer
          modules:
            - Price Freeze (locks current fare for a fee)
            - Cancel for Any Reason — CFAR (airlines & hotels)
            - Disruption Assistance for Any Reason
            - Seat Upgrades
            - Carrot Cash closed-loop loyalty currency
        - label: B2B / HTS API Platform
          modules:
            - HTS Fintech Ancillary APIs (CFAR, Disruption, Upgrades)
            - HTS Stays (hotel commerce)
            - HTS Cars (rental commerce)
            - Travel Loyalty Portals (bank-branded)
            - HTS Assist — AI servicing agent (30+ languages)
        - label: Consumer Mobile Surface (B2C)
          modules:
            - iOS app (4.8/5, 1.2M+ ratings)
            - Android app (4.6/5, 149K reviews)
            - Color-coded deals calendar
            - Watch & alert notifications
            - Flights, Hotels, Homes, Cars booking flows
