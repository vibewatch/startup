  - id: FI002
    title: HTS Fintech Unit Economics Flow
    type: flow
    layout: wide
    summary: >-
      Traces how a traveler or partner-channel booking converts into HTS fintech revenue and margin through the Hopper
      risk-management model.
    data:
      nodes:
        - id: traveler
          label: Traveler Demand Signal
          detail: >-
            Consumer or partner-app user triggers a flight, hotel, or rental search; Hopper's 7-trillion itinerary/year
            dataset prices the risk.
        - id: booking
          label: Booking + Fintech Upsell
          detail: >-
            At checkout, traveler opts into CFAR, Price Freeze, DAFAR, or Car Rental Shield; attach rate >60% in
            consumer app per management data.
        - id: ml-pricing
          label: Dynamic ML Pricing Engine
          detail: >-
            Hopper's ML models dynamically price fintech fee using fare volatility, route data, and historical claim
            rates; produces high-confidence expected-value spreads.
        - id: risk-pool
          label: Hopper Risk Pool
          detail: >-
            Fintech fees aggregate into a risk pool; Hopper absorbs claim costs (refunds, rebookings); unearned premium
            minus claims equals gross profit.
        - id: partner-margin
          label: Partner Revenue Share
          detail: >-
            For HTS B2B, Hopper shares a portion of fintech premium with the airline or bank; 60% profit margin reported
            through partner channels.
        - id: ebitda-contribution
          label: EBITDA Contribution
          detail: >-
            High-margin fintech revenue flows toward EBITDA; management claims positive EBITDA over H2 2025 through Q1
            2026 on a consolidated basis.
      edges:
        - from: traveler
          to: booking
          label: Search → Intent → Checkout
        - from: booking
          to: ml-pricing
          label: Risk priced in real time
        - from: ml-pricing
          to: risk-pool
          label: Fee collected; policy issued
        - from: risk-pool
          to: partner-margin
          label: Revenue share to partner (B2B model)
        - from: risk-pool
          to: ebitda-contribution
          label: Hopper net margin after claims
    approximationNotes: >-
      Exact claim rates, loss ratios, and per-product profit splits are not publicly disclosed. The 60% partner-channel
      profit margin is from management/Forbes sourcing and is unaudited. The flow is a qualitative representation of the
      monetization mechanism; numeric values are not available for precise calibration.
    claimRefs:
      - CI017
      - CI018
      - CI021
      - CI022
      - CI034
      - CI041
