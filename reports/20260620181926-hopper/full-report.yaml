  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included and excluded spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Hopper's addressable market sits at the intersection of four related but analytically distinct pools.
              First, the conventional online travel agency (OTA) market—digital platforms enabling consumers to search,
              compare, and book flights, accommodations, car rentals, and packages—is the broadest tent. Included OTA
              spend covers gross booking value transacted through intermediaries such as Booking.com, Expedia, and
              Hopper itself; it excludes direct bookings through airline or hotel dot-coms, offline agency commissions,
              and ancillary in-trip spend not flowing through a booking platform. Second, the mobile travel booking
              sub-market carves out the portion of OTA spend initiated and completed on smartphones and dedicated apps;
              this boundary matters because Hopper launched as a mobile-only app in 2015 and built its data advantage on
              mobile-native behavior. Third, travel fintech—a newer category comprising financial products layered on
              top of travel transactions (price freeze, cancel for any reason, disruption protection, dynamic insurance,
              and instant rebooking)—represents the highest-margin revenue pool for Hopper. This spend is excluded from
              traditional OTA sizing unless the analyst explicitly counts ancillary gross revenue. Fourth, B2B travel
              infrastructure (white-label booking engines, API licensing, fintech-as-a-service for airlines and banks)
              is served by Hopper Technology Solutions and carries a structurally different buyer (enterprise
              procurement vs. consumer checkout). Status-quo substitutes include airline and hotel direct booking
              channels, traditional travel agencies, credit card travel portals (e.g., Chase Sapphire, Capital One
              Travel—where Hopper is both a substitute and a partner), and generic search engines that increasingly
              surface direct booking links. The key insight for underwriting is that the relevant market is not the full
              OTA TAM but the sub-segment where fintech attach rates are high, mobile is the primary channel, and brand
              loyalty is still being won—characteristics that favor a mobile-first, fintech-native player like Hopper
              over legacy desktop incumbents.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
