            body: >-
              Hopper's B2C surface spans four verticals — Flights, Hotels, Homes (vacation rentals), and Car Rentals —
              all delivered through a mobile-first app with no meaningful desktop booking capability for cars. The app
              has recorded over 100 million lifetime downloads per company claims across iOS and Android, and carries a
              4.8-out-of-5-star rating from more than 1.2 million iOS reviewers and a 4.6 rating from approximately
              149,000 Android reviewers. Gen Z and Millennial travelers are cited by partners as comprising 70% of the
              user base.

              Hopper Homes is a vacation-rental category introduced to compete with Airbnb and Vrbo. It accepts
              entire-home listings only (no shared spaces), requires kitchen and private bathroom amenities, and charges
              hosts a 14% commission when listing through property management systems such as Guesty or Rentals United
              (split as 3% host / up to 12% guest when a PMS is not used). Property management platforms confirm
              automatic calendar, pricing, and availability synchronization across Hopper Homes and other OTA channels.
              Hopper Cars functions as a pure marketplace aggregator: the company holds no fleet, aggregates offers from
              major and independent rental brands, applies the price-prediction model to rental windows, and provides a
              Price Freeze option for a small fee.

              A notable limitation: independent 2026 reviews document that multi-city flight booking through the Hopper
              app is non-functional, routing users to external sites. This indicates a material product-depth gap on
              complex itineraries.
