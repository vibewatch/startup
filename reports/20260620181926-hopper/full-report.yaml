              (Lotte Card), giving HTS confirmed presence across North America, Latin America, Asia-Pacific, and Europe.
              Dakota Smith stated that HTS has identified up to 30 global markets for bank-travel partnerships, with a
              pipeline of deals "cooking since last summer" (i.e., mid-2024) at the time of reporting.

              On the airline side, Air Canada has been an HTS fintech partner since approximately 2022, offering CFAR on
              all fare types. WestJet launched HTS CFAR on WestJet.com and the WestJet app in June 2026 with 80% and
              100% refund-tier options. Porter Airlines went live with HTS Disruption Assistance (branded as Delay and
              Cancellation Assistance) in 2026. Wizz Air became the first European airline to deploy HTS Disruption
              Assistance. The airline roster demonstrates that HTS is expanding beyond North American carriers into
              Europe and low-cost carriers. Tripadvisor launched in-app hotel bookings powered by HTS in August 2024,
              and Uber Flights (UK) has been powered by HTS since 2023.

              All named deployments are in production, with the partial exception of the RBC Avion Rewards portal, which
              was announced in March 2026 but was described as launching "later this year." The Capital One relationship
