      - number: '1.2'
        title: Founders, Leadership, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              Hopper was co-founded by Fred Lalonde and Joost Ouwerkerk. Lalonde serves as CEO and is the public face
              and primary strategic voice of the company. His prior entrepreneurial record includes co-founding IgoUgo,
              a travel review and community site that was acquired by Rand McNally in 2007, and an earlier career at
              Cossette Communications. Ouwerkerk serves as CTO and has been with the company since founding. The two
              co-founders are the only named executives consistently referenced in public materials; the identities of
              Hopper's CFO, COO, and other C-suite members have not been publicly disclosed, creating a meaningful gap
              for any governance or succession diligence.


              The leadership structure creates a pronounced key-person dependency. Both Lalonde and Ouwerkerk appear to
              control the company's strategic direction, partner relationships, and technical roadmap. The absence of
              public information about a broader executive team means that the bench depth, succession planning, and
              organizational resilience cannot be assessed from external sources alone. Diligence should include an
              org-chart request and interviews with senior leadership beyond the founders. Note that the leadership
              table below covers only the most publicly documented figures; it is explicitly partial and should be
              supplemented with data-room materials.
