      - number: '7.4'
        title: Regulatory, Legal, and Consumer-Protection Risk
        blocks:
          - type: paragraph
            body: >-
              Hopper's CFAR (Cancel For Any Reason), DAFAR, and Price Freeze products sit at the intersection of travel
              services and insurance regulation. The NAIC adopted a Travel Insurance Model Act in December 2018 that has
              been enacted by 38 US states as of April 2026, establishing state-level licensing, market conduct
              standards, premium tax obligations, and consumer disclosure requirements for any entity selling travel
              protection plans. Any company selling, soliciting, or negotiating travel insurance in a regulated state
              must hold an insurance producer license in that jurisdiction. Americans spent $5.56 billion on travel
              insurance in the 2022–2024 period, a 46% increase since 2019, reflecting growing regulatory attention on
              the sector. Hopper's compliance status across all 50 states has not been publicly confirmed, and the
              multi-state licensing burden grows with each new B2B distribution partner and geographic market entry.

              Consumer protection enforcement risk is escalating at the state level. The FTC remains active in
              deceptive-practice enforcement, including in travel and fintech. The California AG launched an
              Affordability Response Team in June 2026 explicitly targeting travel and technology pricing practices. New
              York passed the One Fair Price Act in June 2026, restricting algorithm-based personalized pricing—a model
              that Hopper's dynamic fintech product pricing employs. Goodwin Law's 2026 fintech regulatory analysis
              identifies increasing state-level scrutiny as the primary compliance risk for non-bank fintech firms
              offering insurance-adjacent products. CFPB enforcement scope was reduced in 2025–2026, providing
              short-term relief at the federal level, but state AGs and the FTC represent active channels for consumer
              protection action. No litigation against Hopper has been confirmed from public sources, but the volume and
              consistency of documented consumer complaints provides the standing record required to support regulatory
              referrals or class action filings. The regulatory risk register (TR001) and risk transmission map (FR002)
              detail the specific risk pathways.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
