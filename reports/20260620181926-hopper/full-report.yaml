      - number: '1.3'
        title: Funding, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              Hopper has raised an estimated $740 million across all disclosed and inferred venture rounds, though no
              company-published cumulative total is available. The funding history runs from early-stage rounds in
              approximately 2013 to 2016 through a Series D of approximately $98 million in May 2018, a Series E of
              approximately $100 million in 2019, and a Series G of $175 million in August 2021 led by Capital One
              Ventures, Citi Ventures, WestCap Group, and Temasek Holdings at a reported $3.5 billion valuation. The
              most recent disclosed primary round was $96 million from Capital One in November 2022 at a $5 billion
              post-money valuation.


              The $5 billion valuation is now materially stale. No new primary round has been publicly reported since
              November 2022, which means the reference valuation is approximately 3.5 years old at the current run date.
              Capital One's decision to insource Hopper's technology in March 2026 further complicates a valuation
              assessment: the insourcing removes a captive revenue stream and restructures what was Hopper's largest
              partner relationship. Any current valuation estimate would require fresh internal financial data and a
              reassessment of the B2B revenue run rate under the post-insourcing model.


              Stack Capital Group, a publicly listed Canadian investment company (TSX: STCK), holds a disclosed stake in
              Hopper and has referenced it in its net asset value statements, providing one of the only public windows
              into the private company's cap table. CDPQ (Caisse de dépôt et placement du Québec), Quebec's largest
              pension fund, has invested across multiple rounds since at least 2018, making it a long-tenured
              institutional holder. The full cap table, preference stack, anti-dilution terms, and board seat
              assignments are not public.
