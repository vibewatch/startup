  - id: FE001
    title: Hopper Product Architecture Stack
    type: stack
    layout: wide
    summary: >-
      Hopper's architecture runs from a data infrastructure base through the AI prediction engine, consumer fintech
      layer, and B2B API platform, with the consumer mobile app surfacing the full stack to end users and the HTS API
      layer exposing the same capabilities to airline, bank, and hotel partners.
    data:
      layers:
        - label: Data Infrastructure
          modules:
