              2.7-out-of-5 rating from 2,943 reviews, with approximately 90% of responses unfavorable. Trustpilot
              reviews consistently flag poor customer service responsiveness, refund denials, booking mismatches, and
              hidden fees.

              A documented platform outage occurred on April 21, 2026, lasting approximately one hour (05:01–06:01 PM
              UTC) per outage monitoring services. The outage monitoring page noted a dual-signal detection combining
              automated HTTPS probes with crowd-sourced reports. Hopper does not maintain a public status page — its
              status is tracked by third-party services rather than a company-operated incident-management page, which
              is an operational transparency gap.

              Hopper's customer support model relies on in-app messaging, with toll-free numbers (+1-833-933-4671 for
              US/Canada) available per the App Store listing, but live agent access for standard issues appears to
              require VIP-tier subscription per 2026 reviewer documentation. Security and privacy certifications (SOC 2
              Type II, PCI-DSS, GDPR compliance, ISO 27001) are not publicly disclosed, constituting a significant
              diligence gap for any enterprise B2B partner conducting vendor due diligence. Carbon offset commitment (2
