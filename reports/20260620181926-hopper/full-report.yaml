            body: >
              HTS (Hopper Technology Solutions), the B2B arm of Hopper, operates as a travel fintech infrastructure
              provider for banks, airlines, and consumer-tech platforms. As of June 2026, HTS has publicly confirmed
              product integrations with more than 50 partners globally, grouped into three categories: bank and
              credit-card loyalty portals, airline fintech ancillaries (Cancel for Any Reason and Disruption
              Assistance), and consumer-tech platform embeddings (Tripadvisor, Uber).

              The most consequential bank-portal clients are Capital One (the founding "keynote" partner, now API-only
              after March 2026 insourcing), Royal Bank of Canada (new long-term agreement signed March 2026, replacing
              the prior Expedia arrangement for Avion Rewards Travel), Nubank (Brazil's largest digital bank with 100+
