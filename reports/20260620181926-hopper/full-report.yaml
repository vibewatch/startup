      - number: '7.2'
        title: Partner and Customer Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Hopper's B2B revenue mix—now approximately 90% of total revenue following the Capital One
              transition—concentrates the investment thesis in a small number of large enterprise relationships. Capital
              One was the single largest B2B partner: it led Hopper's Series F at approximately $3.5 billion valuation,
              contributed $96 million via the November 2022 follow-on at $5 billion, and was described by analysts as
              representing the majority of HTS managed-platform earnings. The March 2026 decision by Capital One to
              insource Hopper's managed travel platform—acquiring approximately 150 staff, supplier relationships, and
              the technology stack for $96 million—converted Capital One from Hopper's largest managed-platform revenue
              source to an API-only client. The revenue impact of this transition has not been publicly quantified by
              management, creating the most significant diligence gap in the report.

              Beyond Capital One, partner risk extends to inventory supply. In July 2023, Expedia terminated its hotel
              and vacation-rental content supply to Hopper via its Rapid API, citing features that "exploit consumer
              anxiety and confuse customers." Hopper countered that the move was anti-competitive and that its inventory
              is multi-sourced; Expedia and Hopper reportedly resumed the supply relationship by late 2024. The cycle of
              termination and resumption illustrates that large inventory partners can withdraw with short notice, that
              Hopper's fintech product design may generate adversarial responses from content partners who also compete
              in B2B travel, and that dependency persists even after a public fallout. HTS now serves 50+ product
              partnerships across banks, airlines, and OTAs, but revenue concentration in a few top partners remains the
              primary thesis risk. The dependency map (FR003) visualizes Hopper's critical upstream and downstream
              relationships.
