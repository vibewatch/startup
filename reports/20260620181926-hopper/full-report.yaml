  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact Severity
    type: matrix
    layout: wide
    summary: >-
      Maps Hopper's primary risk categories by likelihood (rows) and impact severity (columns); cells name the dominant
      risk driver in each quadrant.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood (>50%)
          values:
            - Hidden-fee disclosure gaps
            - App reputation / consumer churn
            - Profitability / EBITDA uncertainty
            - Capital One revenue cliff
        - label: Medium Likelihood (20–50%)
          values:
            - Platform outage / SLA breach
            - Regulatory enforcement (FTC / state AG)
            - Travel cyclicality / macro recession
            - Partner insourcing replication
        - label: Low Likelihood (<20%)
          values:
            - Security / data breach
            - GDS content fragmentation
            - Expedia re-termination
            - IPO window closure / down-round
    approximationNotes: >-
      Likelihood and impact ratings are the author's qualitative assessment based on publicly available evidence as of
      June 2026; they are not statistical probability estimates.
