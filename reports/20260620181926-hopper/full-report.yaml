  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Hopper's public record runs from its 2007 founding through three major inflection points: the 2015 consumer app
      launch, the 2021 B2B pivot and Series G, and the 2023-to-2026 period of partner volatility and workforce
      reductions culminating in Capital One's technology insourcing.
    data:
      items:
        - date: '2007'
          label: Company founded
          detail: Fred Lalonde and Joost Ouwerkerk incorporate Hopper in Montreal; multi-year data-science build begins.
          tone: positive
        - date: 2015-01
          label: iOS app launch
          detail: Consumer flight price prediction app goes public; wins Apple App of the Year.
          tone: positive
        - date: 2018-05
          label: Series D — $98M; hotel search added
          detail: GV and CDPQ lead; product expands from flights to hotels.
          tone: positive
        - date: '2019'
          label: Hopper Cloud B2B launched
          detail: First airline partner signs on; begins the shift to partner-driven revenue.
          tone: positive
        - date: '2020'
          label: COVID — 40% workforce reduction
          detail: Global travel collapse forces ~250 layoffs; B2B pivot accelerated as survival strategy.
          tone: negative
        - date: 2021-08
          label: Series G — $175M at $3.5B
          detail: Capital One Ventures, Citi Ventures, WestCap, and Temasek invest; Hopper Homes launched.
          tone: positive
        - date: 2022-11
          label: Capital One $96M at $5B
          detail: Deepest strategic relationship; last confirmed primary round; peak disclosed valuation.
          tone: positive
        - date: 2023-07
          label: Expedia terminates Hopper Cloud contract
          detail: Major B2B revenue loss; triggers October 2023 30% layoff cycle.
          tone: negative
        - date: 2023-10
          label: 30% layoff — ~200 staff
          detail: Cost restructuring following Expedia termination; headcount drops to ~500.
          tone: adverse
        - date: 2024-11
          label: Expedia renews; concurrent 10% layoff
          detail: Revenue recovery paired with ongoing cost pressure; demonstrates contract fragility.
          tone: warning
        - date: 2026-03
          label: Capital One insources Hopper technology
          detail: >-
            ~150 Hopper staff and tech stack acquired; Capital One Travel shifts to in-house operation; Hopper becomes
            API-only partner.
          tone: adverse
        - date: 2026-06
          label: Run-date snapshot
          detail: Hopper operates with ~400 core staff; B2B run rate and valuation are open diligence questions.
          tone: neutral
    approximationNotes: >-
      Financing amounts pre-2021 are analyst-estimated and not company-confirmed. Headcount figures are approximate
      based on media reporting.
