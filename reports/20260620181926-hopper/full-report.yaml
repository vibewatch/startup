      - number: '3.5'
        title: 'Hopper Technology Solutions (HTS): B2B White-Label Competitive Position'
        blocks:
          - type: paragraph
            body: >-
              Hopper rebranded its B2B platform as HTS (Hopper Technology Solutions) and it now represents the company's
              dominant revenue stream. HTS is a white-label commerce platform and API suite powering travel booking,
              rewards and loyalty, and fintech ancillaries for banks, card issuers, airlines, and lifestyle brands
              worldwide. As of early 2026, B2B revenue accounts for more than 90% of Hopper's total, having grown from a
              consumer-first model to an enterprise-first infrastructure provider in approximately 18 months.


              The HTS partnership roster spans Air Canada, Virgin Australia, Frontier, Uber, TripAdvisor, AirAsia Move,
              Nubank (Brazil), Capital One, Commbank (Australia), SMBC (Japan), Lloyds Bank, Porter Airlines, and Wizz
              Air. HTS grew from fewer than 20 product partnerships to more than 50 by early 2026—approximately 50%
              revenue growth YoY. The platform serves 400M+ credit card customers through bank partners representing
              over $1.6T in annual card spend. Fintech products (CFAR, Disruption Assistance) have been sold across 180+
              countries with an 84% repeat-purchase rate and a 60% profit margin in partner channels, making fintech
              HTS's highest-margin and fastest-growing product line. HTS Assist, a generative AI service layer now live
              with SMBC and Lotte Card, reduces servicing costs while enabling concierge-quality automation.


              The March 2026 RBC Avion Rewards deal—displacing Expedia as the previous provider—demonstrates HTS's
              ability to win large-scale financial institution contracts. However, March 2026 also brought a
              countervailing signal: Capital One acquired Hopper's travel technology, talent (~150 employees), and
              supplier relationships for ~$96M to bring its platform fully in-house. Capital One was Hopper's first and
              largest HTS client (invested 2021); losing it removes Hopper's flagship reference account and a
              substantial revenue stream, while creating a new B2B competitor in Capital One Travel (now with an
              independent mobile app).


              Expedia's B2B arm (17+ consecutive quarters of double-digit growth) and Booking Holdings' consolidated B2B
              division (rolling Booking.com, Priceline, and Agoda partner teams into one unit) represent the OTA
              incumbents' direct challenge to HTS for bank and airline white-label mandates.
