  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Priority Ranking
        blocks:
          - type: paragraph
            body: >-
              This chapter ranks Hopper's material risks across six dimensions: partner concentration, supplier and
              inventory concentration, regulatory and legal exposure, competitive displacement by Google and incumbent
              OTAs, travel cyclicality and macroeconomic sensitivity, and execution risk around profitability and IPO
              delivery. Each risk is assessed by likelihood, impact on the investment thesis, mitigation maturity, and
              residual exposure. The risk heatmap (FR001) maps each risk to a likelihood-impact quadrant; the
              probability and impact ranking table (TR006) provides the ordinal priority ordering with associated
              investment implications. The highest-priority risks are partner concentration and profitability
              uncertainty, both diligence-blocking because management has not publicly quantified the Capital One
              revenue impact or provided audited financials for the post-transition period. Regulatory and
              app-reputation risks are structurally persistent with moderate probability of escalating to enforcement or
              litigation. Competitive and cyclicality risks are inherent to the business model and partially mitigated
              by B2B revenue diversification, though no external shock stress-test has been disclosed since COVID-19.
              Kill criteria and monitoring triggers for each risk are documented in the mitigation table (TR005).
