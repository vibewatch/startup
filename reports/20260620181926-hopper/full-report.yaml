  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer App (B2C) — Traction, Adoption, and Engagement
        blocks:
          - type: paragraph
            body: >
              Hopper's consumer-facing mobile app, available on iOS and Android, is a price-prediction and
              travel-booking platform covering flights, hotels, car rentals, and vacation homes. As of 2024, the app had
              approximately 35 million active users globally, representing a 22% year-on-year decline from 2023 — a
              contraction the company attributes to a deliberate pullback of B2C marketing investment outside North
              America in favour of B2B growth through HTS. Lifetime global downloads have surpassed 120 million since
              the app's 2015 public launch, with the peak annual download cohort of 18.7 million recorded in 2023 before
              declining sharply to 4.5 million in 2024 — a 76% single-year drop. This suggests that Hopper is no longer
              actively growing its consumer user base and is treating the app primarily as a product-development sandbox
              for features later commercialized via the HTS enterprise platform.

              Despite the download decline, the consumer app retains strong nominal satisfaction: it holds a
              4.8-out-of-5 rating on the Apple App Store with over 1.2 million reviews as of 2026. Approximately 70% of
              its user base is Gen-Z and Millennial travelers, making it one of the most mobile-native travel platforms
              in North America. More than 60% of users who complete a booking through the consumer app purchase at least
              one fintech protection product (Price Freeze, Cancel for Any Reason, or Disruption Assistance), which is
              the primary monetization lever above the base commission on flight and hotel bookings. The Hopper Carrot
              Cash loyalty program, offering 1–5% cashback on reservations, creates a closed-loop incentive that drives
              repeat bookings and increases lifetime value. Gross booking value across all channels (B2C and B2B)
              reached $7.5 billion in 2024, up from $5.9 billion in 2023, confirming that total platform volume
              continued to grow even as the consumer app's download base contracted.

              The consumer app's strategic significance is now primarily as a product-testing and brand credibility
              vehicle rather than a direct revenue driver. Dakota Smith, Hopper's president, has publicly described the
              consumer app as "the sandbox" that produces innovations which HTS then deploys at scale to enterprise
              partners. Diligence should confirm whether B2C revenue is still growing in absolute terms or whether the
              app is structurally declining, and whether the brand credibility function can survive sustained download
              deterioration.
