chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Hopper is a Canadian travel technology company headquartered in Montreal, Quebec, with additional offices
              in Boston and other cities. It was founded in 2007 — not 2008 as sometimes cited — and went through a
              multi-year research and development phase before launching a consumer mobile app publicly in January 2015.
              The company's foundational innovation is an AI-driven price prediction engine that analyzes billions of
              flight and hotel price data points to advise travelers on the optimal time to buy. That prediction
              capability, combined with in-app fintech products such as price freeze and cancel-for-any-reason
              insurance, has been the engine of both consumer adoption and the subsequent B2B business.


              Hopper operates a dual-track business model. The consumer-facing Hopper app (B2C) serves as a direct
              booking channel for flights, hotels, car rentals, and vacation homes, while also acting as a product
              sandbox where new fintech features are tested before being offered to business partners. The B2B channel,
              branded Hopper Cloud and operated under the HTS (Hopper Technology Solutions) entity, licenses Hopper's AI
              pricing engine and fintech modules to airlines, hotels, banks, and online travel agencies via an API and
              white-label platform. As of 2025, analyst estimates suggest that B2B revenue accounts for approximately
              90% of Hopper's total revenue, a shift that accelerated following COVID-19 and the 2023 Expedia contract
              dispute.


              The business model should be understood as fundamentally dependent on a small number of large B2B
              partners. Capital One Travel has been the largest single B2B relationship, and the March 2026 decision by
              Capital One to insource Hopper's technology stack and acquire approximately 150 Hopper staff changes the
              nature of that dependency from a managed platform arrangement to an API-only relationship. Diligence
              should treat the post-insourcing B2B revenue base as an open question requiring direct confirmation from
              management.
