            body: >-
              Hopper operates a dual revenue stack: a consumer-facing travel marketplace (B2C) and a white-label B2B
              enterprise platform called HTS (Hopper Technology Solutions). Total reported revenue reached $850M in
              2024, up from $700M in 2023 and $500M in 2022, reflecting compound annual growth of roughly 19-fold since
