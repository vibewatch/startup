  - id: FU004
    title: Estimated Retention and Repeat Usage Cohort — Hopper Customer Segments
    type: cohort
    layout: standard
    summary: >-
      Three-segment estimated retention cohort comparing consumer B2C app users, HTS fintech product buyers, and HTS B2B
      enterprise partners across booking repeat rate and estimated 6-month and 12-month retention. All consumer and
      fintech estimates are derived from partial public signals; B2B enterprise retention is inferred from partner
      tenure.
    approximationNotes: >-
      Consumer app estimates (45% repeat booking, 30% 6-month, 20% 12-month) are inferred from 22% annual user decline
      and 76% download decline; not company-disclosed. HTS fintech product estimates derived from the 84% repeat
      purchase rate (company-claimed) with extrapolation. B2B enterprise estimates inferred from Capital One (4.5-year
      tenure) and other partner tenures; no formal churn rate disclosed. All values are indicative ranges for diligence
      framing, not audited figures.
    data:
      columns:
