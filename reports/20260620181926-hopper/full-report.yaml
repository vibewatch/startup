      - number: '5.3'
        title: Fintech Products and Carrot Cash Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Fintech ancillaries are Hopper's highest-margin product tier and, by the company's own disclosures via
              PayPal's newsroom, accounted for approximately 40% of annual revenue at the time of publication. In a
              separate statement, Hopper's General Manager of Fintech reported that over 50% of bookings now attach at
              least one ancillary product, with users averaging 1.5 products per booking that includes any add-on. The
              core fintech SKUs are Price Freeze, Cancel for Any Reason (CFAR), Disruption Assistance for Any Reason,
              Seat Upgrades, and the Carrot Cash closed-loop loyalty currency.

              CFAR, Hopper's flagship fintech product, allows travelers to cancel any booking for any stated reason
              within specified time windows. HTS's own product page claims a 98% customer satisfaction rating for CFAR
              and reports that users who exercise the product are 5.8 times more likely to repurchase on a future
              booking. Disruption Assistance for Any Reason provides real-time rebooking across airlines and a 100%
              original-ticket refund option when triggered within 24 hours of a departure disruption. The Porter
              Airlines integration (May 2026) is the most recently documented live deployment of this product.

              Carrot Cash is Hopper's in-app loyalty currency earned through bookings, referrals, and promotions.
              Critically, all fintech product refunds — including Price Freeze payouts and CFAR returns — are issued as
              Carrot Cash rather than cash, locking refund value inside the Hopper ecosystem. This design increases
              repeat booking metrics but has generated widespread adverse consumer feedback around transparency and
              refund utility.

              WestJet now offers CFAR powered by HTS, and Capital One Travel integrated CFAR and disruption protection
              into its travel portal before the March 2026 technology insourcing. The fintech product suite is thus
              simultaneously Hopper's core consumer differentiator and its primary B2B licensing asset.
