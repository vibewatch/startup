  - id: TV006
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue concentration
        - Capital One + any one partner >50% of total 2025 revenue pre-insourcing
        - Revenue cliff risk invalidates current mark; IRR analysis collapses to bear case
        - Demand cap table preferred terms; write down mark to $2–2.5B; halt new investment at $5B
      - - Down-round or IPO below $3B
        - New primary round or public IPO priced below $3B
        - Public-market confirmation that private mark is 40%+ over fair value
        - Impair mark; re-underwrite at new market price; exit secondary if available
      - - Major HTS partner defection
        - Any top-3 HTS bank partner fails to renew or exits within 12 months
        - Revenue contraction + signal that Capital One internalization was not an isolated event
        - Move to AVOID; reduce position; re-evaluate HTS competitive moat
      - - EBITDA loss confirmed in S-1
        - Audited EBITDA negative for two or more consecutive quarters
        - Eliminates profitability narrative supporting high-multiple valuation
        - Adjust to 2–3x revenue multiple; base case falls to $1.3–1.7B
      - - OTA multiple compression
        - Public OTA sector median falls below 1.5x EV/revenue in macro downturn
        - Hopper's base-case multiple compresses below 3x; implies $1.5–2.5B fair value
        - Accelerate IPO or secondary exit; do not increase exposure at $5B
    notes: >-
      Thresholds are trigger levels, not current measurements. All triggers are external or disclosure events, not model
