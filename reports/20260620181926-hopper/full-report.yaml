      - number: '2.2'
        title: Market sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              OTA market size estimates diverge dramatically depending on scope and methodology, and the contradictions
              must be preserved rather than averaged. GM Insights sizes the global OTA market at $253.2 billion in 2024,
              with a 7.9% CAGR to $533.7 billion by 2034—a definition anchored to gross booking value flowing through
              intermediary platforms. DataHorizzon Research applies a broader definition (including meta-search, package
              tours, and adjacent digital travel commerce) and reports $550 billion in 2024 with a 9.6% CAGR to $1.25
              trillion by 2033. ResearchAndMarkets uses yet a third scope and cited approximately $943 billion in 2025,
              implying a wider gross transaction value lens. The data-horizon and methodology inconsistency is material:
              an investor comparing these numbers without scope-adjusting could be misled by 4x differences in the
              headline. Phocuswright—widely regarded as the highest-credibility independent travel market research
              firm—offers the only US-specific primary estimate retained here: US OTA sales reached $108.5 billion in
              2024, with "only modest year-over-year growth" and signs of plateau as supplier-direct booking share edges
              up. Hopper's implied SAM, derived from its $7.5 billion in 2024 bookings, represents roughly 3–6% of
              global OTA volume depending on which TAM estimate is used—a modest share with significant runway if
              fintech attach rates hold and B2B licensing scales. Travel fintech sub-markets show similarly wide ranges:
              GrowthMarketReports sizes global fintech in travel at $13.2 billion in 2024, while Marketintelo estimates
              $21.4 billion in 2025—a discrepancy likely driven by definition (the narrower cut counts protection
              products only; the broader cut includes digital payments, FX, and expense management). The generative AI
              in travel segment is measured by Market Research Future at $2.22 billion in 2024, growing at 21.17% CAGR
              to $18.39 billion by 2035.
            claimRefs:
