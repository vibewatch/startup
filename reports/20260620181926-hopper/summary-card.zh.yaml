  topStrengths:
    - Hopper 把 AI 价格预测和高毛利金融科技附加产品结合起来，直面消费者和 B2B 渠道都能使用。
    - HTS 已在银行、航司和旅行品牌中证明企业端牵引力，把 Hopper 的触达范围从消费应用扩到更广渠道。
