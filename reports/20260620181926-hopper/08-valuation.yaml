callouts:
  - calloutType: risk
    title: Stale $5B Mark — Structurally Unsupported at Base Case
    body: >-
      The $5B valuation mark is approximately 3.5 years old, was set by Hopper's largest commercial partner
      at a strategically motivated round, and is not supported by public comparable analysis at base-case
      assumptions. Fundamental analysis implies a $3.0–3.8B range in the base case. Any new investment
      at $5B embeds a 30–65% premium to base case that requires execution on every pillar of the bull thesis.
    claimRefs:
      - CV001
      - CV014
      - CV015
      - CV037
      - CV042

  - calloutType: recommendation
    title: Recommendation — TRACK with HIGH Risk Rating
    body: >-
      Track with high-conviction monitoring: the product and market case is strong, but the entry price is
      stretched relative to the comparable set and the Capital One insourcing introduces a structural revenue
      question that requires management disclosure to resolve. Initiate a BUY recommendation only when audited
      financials confirming EBITDA, a concrete IPO timeline, and post-insourcing revenue run rate are available.
    claimRefs:
      - CV043
      - CV044

  - calloutType: insight
    title: Navan's IPO Experience is a Direct Adverse Comp
    body: >-
      Navan's October 2025 IPO — priced at 13.8x trailing revenue, falling 20% on day one — illustrates
      that public markets will not sustain high multiples for travel-tech companies without demonstrated
      profitability and sustained growth. Hopper's $10B IPO target implies a multiple that Navan's public
      investors refused to pay even on day one. This is the single most important adverse signal for
      Hopper's IPO valuation assumptions.
    claimRefs:
      - CV024
      - CV025
      - CV039
      - CV040

