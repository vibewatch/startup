  - id: comp-set
    title: Comparable Set and Market Multiples
    body: >-
      Hopper occupies an unusual position in the comparable landscape: it is simultaneously an OTA (consumer travel
      booking), a B2B fintech-SaaS platform (HTS), and a marketplace. No single public comp maps cleanly. The most
      relevant peer set spans public OTAs (Booking Holdings, Expedia, Airbnb, MakeMyTrip, Trip.com), a comparable
      B2B travel-tech IPO (Navan, October 2025), and the general OTA sector median.

      As of June 18, 2026, Booking Holdings (BKNG) traded at a P/S ratio of 4.81x and EV/EBITDA of 13.10x —
      the premium-quality, large-cap OTA baseline. Expedia (EXPE) traded at a much lower P/S of 1.91x and
      EV/EBITDA of ~6.82x, reflecting lower growth and margin pressure. Airbnb (ABNB) commanded a P/S of 6.68x
      reflecting superior margins (~34% net) and above-average growth. MakeMyTrip (MMYT) traded at approximately
      4.47x P/S with a much richer EV/EBITDA of 26.5x, reflecting high-growth emerging-market premium. Trip.com
      Group (TCOM) traded at ~1.77x EV/revenue and ~5.99x EV/EBITDA, consistent with a mature China-centric OTA.
      The OTA sector median EV/revenue is approximately 2.4x across these peers.

      Navan (formerly TripActions) provides the most structurally relevant travel-tech IPO benchmark. It priced
      at $24-26/share in October 2025 at a $6.45B valuation, implying approximately 13.8x trailing 12-month
      revenue of $613M. However, Navan's shares fell approximately 20% on their first trading day — demonstrating
      that public markets were unwilling to sustain the 13.8x revenue multiple attributed in the offering. This
      experience is directly adverse for Hopper: even a high-growth B2B travel-tech company at 32% YoY revenue
      growth faced immediate public-market re-rating. Hopper's 5.9x implied revenue multiple at $5B is below
      Navan's IPO price, but Navan's post-IPO multiple was nearer to 10-11x; if Hopper faces a similar re-rating,
      its IPO could price below $5B. Navan's IPO also disclosed that at $6.45B, the company priced approximately
      30% below its last private round valuation of $9.2B from 2022, confirming that travel-tech private marks
      routinely reset downward at IPO when set under peak conditions.
