  - id: scenarios
    title: Bull/Base/Bear Scenario Analysis and Valuation Bridge
    body: >-
      The valuation bridge from Hopper's November 2022 mark to a current fundamental estimate involves four
      material adjustments: (1) revenue growth from approximately $500M in 2022 to $850M in 2024 (positive),
      (2) tech multiple compression since the November 2022 peak (negative), (3) Capital One insourcing reducing
      the high-value managed-platform revenue stream (negative), and (4) Hopper's unverified profitability
      improvement claim (modestly positive if confirmed).

      The bull case assumes: $1B+ 2026 ARR driven by HTS expansion with RBC Avion, Lloyds, Nubank, and SMBC
      fully activating at scale; confirmed EBITDA positivity in audited financials; and an IPO window opening in
      2027 at a 6x ARR multiple. At $1B ARR × 6x = $6B implied value. This case requires no revenue cliff from
      Capital One and full ramp of replacement partners.

      The base case applies a 4x multiple — consistent with Booking Holdings as a mid-tier public comp — to 2024
      total revenues of approximately $850M, implying approximately $3.4B. This is a material discount to the $5B
      mark, reflecting stale pricing, concentration risk, and the absence of audited financials.

      The bear case assumes Capital One revenue loss exceeds estimates (>35% of managed-platform revenue
      impaired), no new flagship partnership at equivalent scale, and multiple compression to 2x consistent with
      Expedia/TripAdvisor at lower-growth profiles. At $650M 2026e revenue × 2x = $1.3B. This case would
      represent a severe down-round and near-total impairment of investors who entered at $5B. The bear case
      requires a Hopper management disclosure of revenue concentration that reveals Capital One contributed more
      than estimated, or a public-market listing that forces mark-to-market below the private mark.

      For the $10B IPO target to be achievable, Hopper would need approximately $2B in revenue at a 5x multiple
      or approximately $1B in revenue at a 10x multiple. At a 19% 2023-2024 revenue CAGR sustained, Hopper could
      reach $1B revenue by approximately late 2025, making a 10x multiple the needed lever — which would require
      Airbnb-quality margins and growth, neither of which is currently confirmed.
