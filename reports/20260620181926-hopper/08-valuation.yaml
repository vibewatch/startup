chapter:
  number: 8
  title: Valuation
  summary: >-
    Hopper's last priced primary round established a $5B+ valuation in November 2022 — now approximately 3.5 years
    stale — while management targets a $10B IPO with no confirmed timeline, underwriter, or S-1 filing as of June
    2026. Against a public OTA sector median EV/revenue of ~2.4x, Hopper's implied 5.9x revenue multiple sits
    meaningfully above peers except Airbnb and high-growth MakeMyTrip; Capital One's March 2026 insourcing of
    Hopper's managed platform materially erodes the revenue base that underpinned the $5B mark, and the absence of
    audited financials leaves profitability claims unverified. The overall recommendation is TRACK: the product and
    market are strong but the current $5B mark is not independently supportable without audited financials, IPO
    clarity, and a confirmed post-Capital One revenue run rate.

sections:
  - id: valuation-context
    title: Valuation Context and Financing History
    body: >-
      Hopper's most recent priced primary equity round was a $96M investment from Capital One in November 2022
      at a post-money valuation of more than $5 billion USD. This followed a February 2022 secondary transaction
      of approximately $35M that first publicly established the $5B mark. In total, Hopper has raised approximately
      $740M across all disclosed rounds from 2012 through November 2022. No subsequent primary equity round has been
      publicly announced, leaving the $5B mark approximately 3.5 years stale as of the June 2026 run date.

      The November 2022 round was led entirely by Capital One — Hopper's largest B2B partner and strategic investor
      — creating a structural question about whether the round price reflected arm's-length market clearing or a
      strategic premium to extend the commercial relationship. Both BetaKit and TechCrunch reported Dakota Smith's
      statement that Hopper "wasn't in a position where it needed to raise capital" and described the round as
      "opportunistic," with Capital One expressing interest in a longer-term partnership. This context materially
      complicates reliance on the $5B mark as a market-validated fair value.

      By March 2026, Capital One acquired Hopper's managed travel-portal technology, approximately 150 employees,
      supplier relationships, and licenses for approximately $96M — converting from managed-platform client to
      API-only partner while retaining its equity stake. Hopper management claimed positive EBITDA in the six months
      preceding the transaction, but no audited P&L or balance sheet has been published. Forge Global listed
      Hopper's last known valuation at $5B as of April 2025 with limited secondary market activity and no matched
      price, and Caplight classified market activity as limited. As of June 2026, CEO Frederic Lalonde has discussed
      a $10B IPO valuation target with Bloomberg, and the company is considering a dual TSX/Nasdaq listing or
      alternatively seeking private equity, but no timeline, S-1, or underwriter has been announced.
