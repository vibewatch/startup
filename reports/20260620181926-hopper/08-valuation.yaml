  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: governance
      missingEvidence: >-
        Audited P&L, balance sheet, EBITDA margin, and cash position for Hopper for fiscal years 2023–2025.
      whyItMatters: >-
        Without audited financials, the EBITDA-positive claim cannot be validated, revenue quality is unknown,
        and no fair-value analysis can be completed with confidence. This is the single most critical gap.
      diligencePath: >-
        Request data room access; engage audit firm for limited-scope review; review eventual S-1 filing.
      relatedQuestionRefs:
        - QV002

    - type: private-evidence-only
      severity: blocking
      topic: revenue-concentration
      missingEvidence: >-
        Hopper's revenue breakdown by partner showing Capital One's historical share and the post-March
        2026 forward revenue run rate from API-only relationship.
      whyItMatters: >-
        Determines the magnitude of the revenue cliff from insourcing; is the primary driver of the
        bear-vs-base case spread. Without this, the $5B base-case cannot be justified.
      diligencePath: >-
        Management disclosure; contract-terms review; direct CFO or Dakota Smith briefing.
      relatedQuestionRefs:
        - QV004
        - QV014

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >-
        Full cap table with liquidation preferences, anti-dilution provisions, and investor rights showing
        preference overhang and return profiles at different exit prices.
      whyItMatters: >-
        Preference overhang at $5B+ could materially impair common-equity returns even at a successful
        IPO; this determines investor economics across all scenarios.
      diligencePath: >-
        Data room legal documents; shareholder agreements; waterfall model.
      relatedQuestionRefs:
        - QV014

    - type: missing-source
      severity: material
      topic: ipo
      missingEvidence: >-
        A public S-1 registration statement or formal IPO prospectus filed by Hopper with the SEC
        or TSX as of June 2026 confirming registration status and offer terms.
      whyItMatters: >-
        Without a formal S-1 filing, the "IPO Announced" event logged by CB Insights in January 2025
        cannot be confirmed as a formal registration, leaving IPO readiness unverifiable.
      diligencePath: >-
        Monitor SEC EDGAR for any Hopper filing; monitor TSX listing announcements; confirm with
        Hopper management whether the confidential filing has been formally submitted.
      relatedQuestionRefs:
        - QV012

    - type: stale
      severity: material
      topic: valuation
      missingEvidence: >-
        A new priced primary equity round or public-market secondary clearing price from Forge Global
        or Caplight that reflects June 2026 fundamentals and market conditions.
      whyItMatters: >-
        The $5B mark is 3.5 years old and set under peak-2022 conditions; without a current market price,
        investors cannot determine the mark-to-market value of their position.
      diligencePath: >-
        Monitor Forge Global and Caplight for matched-trade activity; track any IPO filing announcements.
      relatedTableRefs:
