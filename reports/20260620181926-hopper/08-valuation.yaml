  - id: diligence
    title: Diligence Asks and Thesis-Break Triggers
    body: >-
      The five most critical diligence asks are: (1) audited P&L and balance sheet for 2023-2025 confirming the
      EBITDA-positive claim and revealing cash adequacy; (2) revenue concentration disclosure showing Capital One's
      historical share and the post-March 2026 forward run rate; (3) a full cap table with liquidation preferences,
      anti-dilution terms, and investor rights; (4) the HTS client pipeline with contract status for RBC Avion,
      Lloyds, Nubank, SMBC, and any tier-1 bank or airline prospects; and (5) a board-approved IPO timeline with
      underwriter confirmation and PCAOB audit status. Secondary asks include segment-level gross margins, CAC/LTV
      per B2B and B2C channel, and any legal or regulatory proceedings not visible in public filings.

      Thesis-break triggers that would move the recommendation from TRACK to AVOID include: (a) disclosure that
      Capital One plus any one other partner exceeded 50% of total revenue, revealing catastrophic concentration
      risk; (b) a new priced primary round or IPO pricing below $3B; (c) defection of any top-three HTS bank
      partner within 12 months; (d) EBITDA loss for two or more consecutive quarters as reported in an S-1; or
      (e) a macro-driven OTA multiple compression to below 1.5x EV/revenue, which would cap Hopper's base-case
      value at approximately $1.3-2B regardless of growth.

      Triggers that would move the recommendation toward BUY include: confirmed EBITDA margin ≥10% in audited
      financials; a new tier-1 bank partnership (equivalent in scale to Capital One Travel's 80M+ cardholders);
      an announced IPO with a concrete timeline and underwriter; or a secondary-market clearing price significantly
      above $5B that validates broad investor appetite at that level.
