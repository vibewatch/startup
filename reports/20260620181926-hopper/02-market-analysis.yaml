callouts:
  - calloutType: insight
    title: Fintech Attach Rate Is the Structural Differentiator
    body: >-
      The OTA market is commoditizing around price parity, but Hopper's fintech attach rate of ~50% with an
      average of 1.5 products per booking creates a revenue-per-transaction premium that legacy OTAs cannot easily
      replicate without Hopper's pricing data and actuarial history. McKinsey's CEO interview notes that Hopper
      Cloud's growth rate was "in the high triple digits" at the time of the interview and now accounts for half
      of total revenue—suggesting the B2B channel may be growing faster than the B2C consumer channel.
    claimRefs:
      - CM025
      - CM026
      - CM040
      - CM041

  - calloutType: risk
    title: US Demand Plateau and Declining Downloads
    body: >-
      Hopper's 2024 user metrics show a notable divergence: revenue grew 21.4% to $850M, but downloads fell to
      4.5 million (from 18.7 million in 2023) and total users declined 22% to 35 million. This suggests Hopper is
      monetizing existing users more effectively but is not growing its North America user base at scale, which
      aligns with the Phocuswright US OTA plateau narrative. International expansion via HTS partnerships is a
      plausible offset, but this needs confirmation from private revenue data.
    claimRefs:
      - CM010
      - CM030
      - CM035
      - CM036

  - calloutType: assumption
    title: Contradictory Revenue Estimates Require Diligence Confirmation
    body: >-
      BusinessofApps cites Hopper 2024 revenue at $850 million while Latka reports $686.9 million ARR for the same
      period. The discrepancy may reflect gross revenue vs net revenue, or differences in timing of recognition.
      Neither figure is independently audited. Investors should request unaudited management accounts to reconcile.
    claimRefs:
      - CM010
      - CM043

