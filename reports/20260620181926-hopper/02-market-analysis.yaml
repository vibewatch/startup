  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Hopper revenue and bookings (verified)
      missingEvidence: "Independently audited or management-confirmed Hopper revenue, ARR, bookings, and gross margin for 2024–2025; reconciliation of BusinessofApps ($850M) vs Latka ($686.9M ARR) discrepancy."
      whyItMatters: "Without verified financials, the fintech attach-rate and margin thesis cannot be tested; the revenue divergence may indicate definitional differences that affect how the B2B vs B2C split is calculated."
      diligencePath: "Request unaudited management accounts or CFO confirmation of 2024 revenue, ARR, and net margin by segment (consumer vs HTS)."
      relatedQuestionRefs:
        - QM007
        - QM016

    - type: missing-source
      severity: material
      topic: HTS B2B revenue and growth rate (current)
      missingEvidence: "HTS-specific revenue, customer count (number of airline/bank partners), and current growth rate as of 2025–2026; HTS was 50% of revenue at an unknown 2023 baseline—2025 figure not confirmed."
      whyItMatters: "B2B licensing is Hopper's second structural growth vector; if HTS growth has slowed from 'high triple digit' to normalized rates, the revenue projection changes materially."
      diligencePath: "Request HTS-specific revenue breakdown, partner count, and 2024–2025 ARR from management or partner press releases."
      relatedQuestionRefs:
        - QM007
        - QM013
        - QM015

    - type: missing-source
      severity: material
      topic: Hopper fintech profitability (unit economics)
      missingEvidence: "Net margin on fintech products after guarantee payouts, actuarial losses, and operational cost; price freeze and CFAR profitability depends on whether Hopper's pricing models are actuarially sound."
      whyItMatters: "Fintech attach rate is the bull thesis; if guarantee payout rates are rising (e.g., during fare volatility spikes), the margin thesis may be overstated."
      diligencePath: "Request actuarial loss ratio data for CFAR and price freeze products; compare payout rates across fare-volatile periods."
      relatedQuestionRefs:
        - QM020
        - QM019

    - type: conflicting-data
      severity: material
      topic: OTA market size definition and methodology
      missingEvidence: "Reconciliation of why GM Insights ($253B), DataHorizzon ($550B), and ResearchAndMarkets (~$943B) produce 4x different OTA market size estimates for the same 2024 period."
      whyItMatters: "The correct TAM affects valuation multiple derivation and competitive market share analysis; an investor using the wrong TAM frame could significantly misestimate Hopper's penetration rate."
      diligencePath: "Commission or obtain primary analyst interviews from GM Insights and Phocuswright to align on scope definitions; use Phocuswright as the primary US reference."
      relatedQuestionRefs:
        - QM001
        - QM011

