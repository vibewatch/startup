  - id: constraints-headwinds
    title: Constraints, headwinds, and adverse evidence
    body: >-
      Several forces cap addressable demand and compress margins in ways that directly affect Hopper's trajectory.
      First, US OTA plateau: Phocuswright's 2025 report describes US OTA sales as experiencing only modest growth,
      with domestic demand softening and Expedia's largest market seeing a 7% decline in some segments in 2025.
      This matters because Hopper is heavily North America–concentrated. Second, supplier-direct booking shift:
      airlines and hotels continue to invest in direct channel loyalty programs (Expedia noted a shift toward
      non-refundable rates as consumers tighten budgets, alongside growth in insurance add-ons—a mixed signal for
      OTAs). Third, political and macroeconomic volatility: Protect Group's 2025 review documents US cross-border
      arrivals from Canada and Europe declining double-digits, with political uncertainty shortening booking windows
      and reducing willingness to commit without flexible options. Deloitte's 2026 outlook flags new US visa
      restrictions (a $250 integrity fee, bond requirements, expanded social media checks) as potential inbound
      tourism suppressants. Fourth, regulatory and data-privacy compliance: Deloitte notes that GDPR and US
      state-level privacy regulations constrain how travel platforms can use traveler data for personalization and
      dynamic pricing, raising compliance cost and limiting how far AI-driven offers can go. Fifth, currency
      headwinds: Barclays flagged FX fluctuations in early 2025 as a margin compressor for OTAs with international
      exposure, limiting the profitability of non-US growth even as volume rises. Sixth, alternative fintech
      competition: airlines and hotels are themselves developing in-house cancel/change flexibility—McKinsey CEO
      interview notes competitors "have dabbled in this"—though Hopper's data advantage and multi-product breadth
      create a durable moat claim.
    claimRefs:
