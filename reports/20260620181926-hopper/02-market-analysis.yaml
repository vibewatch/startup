  - id: buyer-segment-map
    title: Buyer and segment map
    body: >-
      Hopper serves two structurally different buyer tiers—B2C consumers and B2B enterprise partners—with
      overlapping but distinct economics. On the B2C side, the core segment is price-sensitive leisure travelers,
      predominantly Gen Z and younger millennials: Hopper reports that approximately 70% of its customers fall in
      this demographic cohort, which McKinsey's CEO interview confirmed. These buyers use the app for fare timing
      intelligence, price freeze, and flexible cancellation—and they monetize at a higher rate than conventional OTA
      users because fintech attach is embedded in the checkout flow. Small-business and frequent travelers represent
      a secondary B2C segment: they value reliability and disruption protection over pure price and are more likely
      to attach Disruption Assistance products. International and cross-border travelers—booking long-haul on routes
      subject to high fare volatility—are the third B2C segment, where price prediction and price freeze carry the
      highest perceived value and highest willingness-to-pay. On the B2B side, Hopper Technology Solutions (HTS)
      targets airlines, hotels, banks, and loyalty programs that want to embed fintech ancillaries and travel booking
      in their own channels without building the technology stack in-house. Capital One Travel is the cited flagship
      partner. The budget owner in B2B is typically the head of ancillary revenue, VP of digital product, or Chief
      Commercial Officer at an airline; the procurement trigger is either declining ancillary yield, a new app/loyalty
      redesign, or competitive pressure from other carriers adopting fintech products. The B2B segment currently
      provides approximately 50% of Hopper's global revenue per the McKinsey CEO interview, up from zero in 2019.
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM019
