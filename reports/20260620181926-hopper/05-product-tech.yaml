  - id: mobile-architecture
    title: Mobile-First Architecture and Developer Ecosystem
    body: >-
      Hopper is structured as a mobile-first platform: its consumer booking product is delivered
      exclusively through native iOS and Android applications, with the hopper.com website providing
      a secondary browser interface. DNS records for hopper.com resolve to Google Cloud infrastructure
      (nameservers ns-cloud-e1 through ns-cloud-e4.googledomains.com) and a Twilio domain-verification
      TXT record, indicating Google Cloud and Twilio as two publicly observable infrastructure dependencies.
      The underlying compute, ML training stack, database layer, and CI/CD tooling are not publicly
      disclosed.

      On the B2B developer side, Hopper maintains a public GitHub repository (hopperteam/hopper-developer)
      containing 18 commits, a RESTful API specification, and developer documentation. The API uses
      RSA-key-signed authentication and supports notification, app, and subscription object types for
      white-label partner integrations. The repository is small in scope relative to the full HTS platform
      — it appears to cover the notification and subscription layer of the legacy consumer API rather than
      the full HTS commerce and fintech API surface, which is partner-gated.

      The app store presence signals healthy mobile consumer engagement: 4.8 stars on iOS from 1.2M+ ratings
      and 4.6 stars on Android from ~149K reviews, with 10M+ installs on Google Play. Hopper has also
      planted more than 31 million trees through a carbon-offset commitment tied to every booking.
      The combination of a mobile-first consumer UX, opaque internal architecture, and a partner-gated
      B2B API surface creates a meaningful diligence gap for any technical infrastructure assessment.
    claimRefs:
      - CE026
      - CE033
      - CE036
      - CE043
      - CE028
      - CE029
    figureRefs:
      - FE004

  - id: trust-safety-reliability
    title: Trust, Safety, Reliability and Customer-Service Quality
    body: >-
      Hopper's consumer trust profile is bifurcated: in-app pre-booking experience is rated highly
      (4.8/5 iOS), while post-booking support and reliability have generated severe and systematic
      adverse reviews. As of 2026, ComplaintsBoard records 18 Hopper complaints with 0 resolved,
      including documented refund delays of 60–90 days despite 7–20 calendar-day regulatory
      requirements in some markets. PissedConsumer shows a 2.7-out-of-5 rating from 2,943 reviews,
      with approximately 90% of responses unfavorable. Trustpilot reviews consistently flag poor
      customer service responsiveness, refund denials, booking mismatches, and hidden fees.

      A documented platform outage occurred on April 21, 2026, lasting approximately one hour (05:01–06:01 PM
      UTC) per outage monitoring services. The outage monitoring page noted a dual-signal detection
      combining automated HTTPS probes with crowd-sourced reports. Hopper does not maintain a public
      status page — its status is tracked by third-party services rather than a company-operated
      incident-management page, which is an operational transparency gap.

      Hopper's customer support model relies on in-app messaging, with toll-free numbers (+1-833-933-4671
      for US/Canada) available per the App Store listing, but live agent access for standard issues
      appears to require VIP-tier subscription per 2026 reviewer documentation. Security and privacy
      certifications (SOC 2 Type II, PCI-DSS, GDPR compliance, ISO 27001) are not publicly disclosed,
      constituting a significant diligence gap for any enterprise B2B partner conducting vendor due
      diligence. Carbon offset commitment (2 trees per booking, 31M+ planted) is the only publicly
      verified ESG program.
    claimRefs:
      - CE030
      - CE031
      - CE032
      - CE044
      - CE045
      - CE046
    tableRefs:
      - TE004

