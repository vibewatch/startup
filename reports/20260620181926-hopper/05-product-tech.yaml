            - "HTS Stays (hotel commerce)"
            - "HTS Cars (rental commerce)"
            - "Travel Loyalty Portals (bank-branded)"
            - "HTS Assist — AI servicing agent (30+ languages)"
        - label: "Consumer Mobile Surface (B2C)"
