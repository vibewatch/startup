  - id: hts-b2b-platform
    title: B2B Platform — HTS Cloud, Commerce and AI Servicing
    body: >-
      Hopper Technology Solutions (HTS) is Hopper's B2B division, launched in 2021, and now accounts for
      approximately 90% of Hopper's total revenue according to reporting by VentureBeat and Skift quotes
      from Hopper's president. The HTS product suite comprises three pillars: Fintech Ancillaries
      (CFAR for airlines and hotels, Disruption Assistance, Seat Upgrades); E-commerce (HTS Stays hotel
      commerce, HTS Cars rental commerce, Travel Loyalty Portals); and AI Solutions (HTS Assist).

      HTS Assist is the newest and most strategically significant HTS product. Launched in 2025, it is
      a fully autonomous AI travel-service agent that handles bookings, cancellations, rebookings, refunds,
      and fintech exercises end-to-end without human intervention. VentureBeat reported that HTS Assist
      was trained on 16 million real-world travel conversations and is integrated directly into airline
      reservation systems and hotel platforms. It operates in 30+ languages across 200+ markets, requires
      six to eight weeks for partner implementation, and has processed approximately 3 million conversations
      in live deployment. Reported performance metrics from HTS (company-claimed via VentureBeat):
      88% CSAT parity with human agents, 65% reduction in servicing costs, $1.12 average cost per
      AI-resolved interaction, and 15% conversion of service conversations into additional purchases.
      Approximately 70% of users in one partner deployment actively chose the AI agent over human support
      when offered on equal footing.

      Documented B2B partners include Air Canada, Porter Airlines, Virgin Australia, Frontier Airlines,
      AirAsia Move, HSBC, SMBC (Japan's largest credit card issuer), Lotte Card, Nubank, Commonwealth
      Bank of Australia, Uber, and Tripadvisor. HTS's B2B APIs use RESTful architecture with RSA-key
      authentication. A developer endpoint at api-dev.hoppercloud.net and a public GitHub repository
      (hopperteam/hopper-developer) exist, although partner-grade API access requires HTS approval and
      NDA, and the lodging distribution developer portal (developer.lodging-distribution-api.hopper.com)
      returned no extractable content, suggesting it is behind an authentication gate.
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
