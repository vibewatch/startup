  - id: FE003
    title: Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
      Hopper's platform depends on a set of external data, infrastructure, payment, and partner
      integrations that create concentration risks at multiple layers. The most material single-point
      dependencies are the GDS/NDC airline feeds (price data), PayPal/Braintree (payments), and
      airline reservation systems (execution via HTS).
    data:
      nodes:
        - id: "hopper"
          label: "Hopper Platform (Core)"
        - id: "gds-ndc"
          label: "GDS / NDC Airline Feeds"
          detail: "Raw flight pricing and availability data feeds; critical for prediction engine"
        - id: "gcp"
          label: "Google Cloud Infrastructure"
          detail: "Confirmed at DNS layer (ns-cloud-e1-4.googledomains.com); full compute footprint opaque"
        - id: "paypal"
          label: "PayPal / Braintree / Hyperwallet"
          detail: "Consumer and B2B payment processing; refund payouts via Hyperwallet"
        - id: "pms"
          label: "PMS Partners (Guesty, Rentals United)"
          detail: "Automated calendar/pricing sync for Hopper Homes vacation rental supply"
        - id: "b2b-partners"
          label: "Airline / Bank API Partners"
          detail: "Air Canada, Porter, Frontier, HSBC, SMBC, Lotte Card, Nubank, CommBank, Uber, Tripadvisor"
        - id: "airline-pss"
          label: "Airline PSS / Reservation Systems"
          detail: "Direct back-end integrations enabling HTS Assist rebooking; built over 10 years"
        - id: "ml-pipeline"
          label: "ML Prediction Pipeline"
          detail: "Proprietary; undisclosed framework; trained on historical + real-time price data"
      edges:
        - from: "gds-ndc"
          to: "hopper"
          label: "price & availability data"
        - from: "gds-ndc"
          to: "ml-pipeline"
          label: "raw historical pricing"
        - from: "ml-pipeline"
          to: "hopper"
