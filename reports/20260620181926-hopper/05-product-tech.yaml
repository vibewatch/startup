    title: Hopper Product Architecture Stack
    type: stack
    layout: wide
    summary: >-
      Hopper's architecture runs from a data infrastructure base through the AI prediction engine,
      consumer fintech layer, and B2B API platform, with the consumer mobile app surfacing the full
      stack to end users and the HTS API layer exposing the same capabilities to airline, bank, and
      hotel partners.
    data:
      layers:
        - label: "Data Infrastructure"
          modules:
            - "Real-time price aggregation (1B+ data points/day)"
            - "Payment processing — PayPal/Braintree/Hyperwallet"
            - "GDS / NDC airline data feeds"
            - "PMS partner feeds (Guesty, Rentals United)"
        - label: "AI Prediction & Intelligence Engine"
          modules:
            - "Flight price forecasting (95% accuracy claim, 1-year horizon)"
            - "Hotel and rental-car price prediction"
            - "Buy/wait/freeze recommendation generation"
            - "Push-notification trigger engine"
        - label: "Fintech Products Layer"
          modules:
