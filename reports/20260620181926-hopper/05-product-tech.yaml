callouts:
  - calloutType: strength
    title: Fintech Ancillary Moat Validated Across B2B Partners
    body: >-
      HTS fintech products (CFAR, Disruption Assistance) carry documented high repurchase rates and
      98% CSAT, are live across multiple airlines and banks in regulated markets, and have driven HTS
      to 90% of total Hopper revenue within five years of B2B launch. This is a substantial technical
      and commercial moat that would take competitors years to replicate given the required airline
      PSS integrations and risk-pricing experience.
    claimRefs:
      - CE008
      - CE009
      - CE021
      - CE040

  - calloutType: risk
    title: Customer-Service Quality and Refund Execution Are Systemic Risks
    body: >-
      Zero of 18 ComplaintsBoard complaints resolved; 2.7/5 PissedConsumer rating; 60–90 day refund
      delays documented despite regulatory requirements of 7–20 days in some jurisdictions. These
      patterns indicate a structural, not transient, failure in post-booking support operations that
      could trigger regulatory scrutiny and undermine consumer trust in the core fintech products.
    claimRefs:
      - CE030
      - CE031
      - CE045

  - calloutType: risk
    title: Architecture and Security Certification Opacity Block B2B Due Diligence
    body: >-
      Hopper does not publicly disclose its cloud compute stack, ML framework, CI/CD tooling, or any
      security certifications (SOC 2, PCI-DSS, ISO 27001, GDPR). For enterprise airline and bank
      partners processing payments and personal data at scale, this absence of publicly verifiable
      compliance documentation is a vendor-risk gap that must be resolved through the data room.
    claimRefs:
      - CE037
      - CE046

