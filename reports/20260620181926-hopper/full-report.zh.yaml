            title: HTS B2B 飞轮：多元全球合作伙伴基础已证明企业耐久性
            body: >-
              HTS 已搭建跨洲、跨垂直的 B2B 客户基础，覆盖银行忠诚度门户（美国、加拿大、巴西、澳大利亚、日本、韩国）、航空 fintech（5+ 家承运人）和消费科技平台。Capital One
              作为托管平台合作伙伴持续 4.5 年，并在此期间成为 Hopper 主要股东，证明了企业合作伙伴耐久性。84% fintech 复购率和 98% CFAR 满意度（均为 HTS
              声称）说明底层产品创造了真实消费者价值，并推动合作伙伴留存。Capital One 内包期间，RBC 交易仍在 2026 年 3 月落地，说明企业储备项目仍活跃。
