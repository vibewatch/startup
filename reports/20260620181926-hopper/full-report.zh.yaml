          detail: 2012 年至 2022 年 11 月期间支撑消费者 app 扩张、HTS 搭建和营运资金；此后未再进行新的股权融资。
        - id: asset-sale
          label: Capital One 资产出售（约 $96M）
          detail: 2026 年 3 月，Capital One 支付约 $96M，收购 Hopper 的托管平台技术、150 名员工、牌照和供应商关系；一次性流入部分抵消收入损失。
