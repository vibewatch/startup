  - id: FU004
    title: 估算留存与重复使用队列 — Hopper 客户细分
    type: cohort
    layout: standard
    summary: >-
      三类估算留存队列，对比消费者 B2C App 用户、HTS fintech 产品买家和 HTS B2B 企业合作伙伴的重复预订率，以及估算 6 个月、12 个月留存率。消费者和 fintech 估算均来自部分公开信号；B2B
      企业留存根据合作年限推断。
    approximationNotes: >-
      消费者 App 估算（45% 重复预订、30% 6 个月留存、20% 12 个月留存）由用户年降幅 22% 和下载量下降 76% 推断，并非公司披露。HTS fintech 产品估算从 84% 复购率（公司声称）外推。B2B
      企业估算根据 Capital One（4.5 年合作期）和其他合作伙伴年限推断；未披露正式流失率。所有数值都是尽调框架下的指示性区间，不是审计数字。
    data:
      columns:
        - 重复预订 / 复购（%）
        - 估算 6 个月留存（%）
        - 估算 12 个月留存（%）
      rows:
        - label: 消费者 B2C App 用户（估算；由用户数下降推断）
          values:
            - 45
            - 30
            - 20
        - label: HTS Fintech 产品用户（公司声称的代理指标；未经审计）
          values:
            - 84
            - 65
            - 50
        - label: HTS B2B 企业合作伙伴（由合作年限推断）
          values:
            - 95
            - 90
            - 85
    claimRefs:
      - CU001
      - CU029
      - CU037
      - CU038
      - CU039
  - id: FR001
    title: 风险热力图 — 可能性 vs. 影响严重度
    type: matrix
    layout: wide
    summary: 按可能性（行）和影响严重度（列）映射 Hopper 的主要风险类别；单元格标出每个象限的主导风险驱动因素。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性（>50%）
          values:
            - 隐藏费用披露缺口
            - App 声誉 / 消费者流失
            - 盈利能力 / EBITDA 不确定
            - Capital One 收入断崖
        - label: 中等可能性（20–50%）
          values:
            - 平台宕机 / SLA 违约
            - 监管执法（FTC / 州检察长）
            - 旅行周期性 / 宏观衰退
            - 合作伙伴复制内包
        - label: 低可能性（<20%）
          values:
            - 安全 / 数据泄露
            - GDS 内容碎片化
            - Expedia 再次终止合作
            - IPO 窗口关闭 / 降价轮
    approximationNotes: 可能性和影响评级是作者基于截至 2026 年 6 月公开证据作出的定性判断，不是统计概率估算。
    claimRefs:
      - CR001
      - CR017
      - CR025
      - CR030
      - CR034
      - CR040
      - CR041
