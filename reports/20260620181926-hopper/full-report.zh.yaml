  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: AI 价格预测引擎
        blocks:
          - type: paragraph
            body: >-
              Hopper 的底层技术是一套机器学习价格预测引擎，每天吸收超过 10 亿个实时机票、酒店和租车价格。该系统是 2015 年消费者 app 上线背后的核心创新，至今仍支撑更广泛 fintech
              产品层的商业逻辑。按 Hopper
              官方说法，该引擎分析历史价格趋势、季节性模式、提前预订窗口、市场供给信号和特殊事件需求峰值，生成「现在买」或「等待」建议。第三方分析引用公司说法称，最长提前一年预测机票价格的准确率约为
              95%；预测周期更长、行程更复杂的多段航线，准确率会下降。引擎用彩色日历界面展示结果，从最便宜（绿色）到最贵（红色）标注出行日期，让用户获得直观的数据可视化；上线时，没有主要 OTA 竞争对手复制这一体验。

              这套预测系统没有公开披露所用 ML 框架、云服务商或模型架构，Hopper 将其视为专有资产。面向消费者的输出是买 / 等建议和价格趋势图；当价格触达模型预测低点时，系统会推送通知。通知层也是 Price
              Freeze 产品的入口，用户犹豫时可以付费锁定预测价格，Hopper 由此变现。B2B 侧，同一预测引擎支撑销售给航空公司和银行的 HTS fintech API，形成内部飞轮：消费者 app
              规模提升模型准确率，模型准确率再支撑 B2B 产品价值主张。
