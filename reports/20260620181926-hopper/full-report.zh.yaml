    type: flow
    layout: standard
    summary: 六阶段流程从累计 App 安装量延伸到活跃用户、fintech 购买者、Carrot Cash 忠诚会员，再到 HTS B2B 终端消费者，展示 Hopper 在消费者端和 B2B 端的双线触达。
    approximationNotes: Fintech 买家数按 35M 活跃用户基数、超过 60% 预订者购买来估算。Carrot Cash 忠诚会员数未披露。HTS B2B 触达 400M+ 信用卡客户为 HTS 声称，未经审计。
    data:
      nodes:
        - id: installs
          label: 累计 App 安装量（2015–2024）
          detail: 全球累计安装 120M+；仅 2024 年为 4.5M，较 2023 年的 18.7M 同比下降 76%
        - id: active
          label: 活跃用户（2024）
          detail: 2024 年活跃用户 35M；同比下降 22%；偏北美；Gen-Z / 千禧一代占 70%
        - id: fintech
          label: Fintech 附加产品购买者（估算）
          detail: 估计 >21M；60%+ 预订者至少购买一种 fintech 产品（公司声称）
        - id: carrot
          label: Carrot Cash 忠诚会员
          detail: 活跃用户中的一部分；预订返现 1–5%；封闭忠诚循环；人数未披露
        - id: b2b-reach
          label: HTS B2B 触达的终端消费者
          detail: 通过 5+ 个已确认银行门户，覆盖美国、加拿大、巴西、澳大利亚、日本、韩国的 400M+ 信用卡客户（HTS 声称）
        - id: policies
          label: HTS Fintech 保单销量（累计）
          detail: 在 180+ 个国家售出数百万份 CFAR、Disruption Assistance、Seat Upgrade 保单；2025 年支付 $33M CFAR 退款
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU013
      - CU028
  - id: FU002
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 七阶段 B2C 消费者旅程从发现一直到忠诚循环，标注关键体验阶段，以及负面评价证据中记录的摩擦点。
    approximationNotes: 阶段描述综合 FinanceBuzz 评测、Trustpilot 和 Trustindex.io 评价，以及 Hopper App 官方文档。支持阶段的留存估计来自投诉量推断，不是问卷数据。
    data:
      nodes:
        - id: discovery
          label: 发现与认知
          detail: App Store 搜索、社交媒体和口碑；品牌建立在价格预测准确度上
        - id: onboard
          label: App 下载与引导
          detail: 安装；创建账户；搜索目的地和日期；选择开启推送通知
        - id: monitor
          label: 价格监控与观察
          detail: “Watch Trip”功能；价格变化时推送提醒；AI 给出买入还是等待建议
        - id: book
          label: 预订与结账
          detail: 选择票价；提供 fintech 附加产品（Price Freeze、CFAR、Disruption Assistance）；通过 Hopper Wallet 付款
        - id: postbook
          label: 预订后体验
          detail: 行程追踪；中断和降价提醒；CFAR 赎回窗口开启；摩擦点：承运商费用在结账时出现
        - id: support
          label: 问题处理与支持
          detail: 通过聊天或电话提供客服；BBB / Trustpilot / Trustindex 投诉的主要触发点；据 Trustindex 2026 年评价，退款处理常需 60–90 天
        - id: loyalty
          label: 重复预订与忠诚循环
          detail: 完成预订后赚取 Carrot Cash；钱包抵扣用于下一次预订；fintech 复购率 84%（HTS 声称）
    claimRefs:
      - CU010
      - CU025
      - CU026
      - CU027
      - CU033
      - CU034
  - id: FU003
    title: HTS 具名合作伙伴证明矩阵 — 证据质量与结果深度
    type: matrix
    layout: wide
    summary: 该矩阵从五个维度评估七家具名 HTS B2B 合作伙伴：细分类型、部署阶段、证据质量、结果深度和是否存在负面信号。银行门户部署证据更强，但内包风险也更高；航空公司集成风险更低，收入贡献却更窄。
    approximationNotes: 证据质量评级是基于来源层级的定性判断（联合新闻稿 = 高；仅行业媒体 = 中）。结果深度反映披露 KPI 的深度。负面信号仅基于公开报道信息判断。
    data:
      columns:
        - 细分类型
        - 部署阶段
        - 证据质量
        - 结果深度
        - 负面信号
      rows:
        - label: Capital One Travel
          values:
            - 银行门户
            - 生产环境 → 仅 API（2026 年 3 月）
            - 高
            - 强：预订增长 10×；USA Today 最佳门户
            - 高：托管收入大体流失；已有内包先例
        - label: RBC Avion Rewards
          values:
            - 银行忠诚计划
            - 已宣布；门户 2026 年下半年上线
            - 高
            - 薄弱：无上线 KPI；仅已宣布
            - 低：爬坡未经验证；替代 Expedia 尚未证实
        - label: Nubank NuViagens
          values:
            - Fintech 银行
            - 生产环境（2024+）
            - 中
            - 中等：LatAm 扩张得到验证；无交易量
            - 低：无负面信号；无独立数据
        - label: Commonwealth Bank
          values:
            - 银行门户
            - 生产环境（2024+）
            - 中
            - 薄弱：6M+ 合格客户；无转化率
            - 低：无负面信号；无独立数据
        - label: Air Canada
          values:
            - 航空公司 CFAR
            - 生产环境（~2022+）
            - 中
            - 薄弱：具名锚定合作伙伴；无附加率数据
            - 低：无负面信号；长期合作可作为成功代理指标
        - label: WestJet
          values:
            - 航空公司 CFAR
            - 生产环境（2026 年 6 月）
            - 高
            - 薄弱：仅产品已上线；无上线后数据
            - 低：上线很近；尚无负面信号
        - label: Porter Airlines
          values:
            - 航空公司中断保障
            - 生产环境（2026）
            - 中
            - 薄弱：仅产品已上线；小型航司
            - 低：无负面信号；规模有限
    claimRefs:
      - CU015
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU035
