  - id: FI004
    title: 资本强度与现金流图
    type: flow
    layout: wide
    summary: 根据公开证据梳理 Hopper 的主要现金流入、流出和结构性成本杠杆，突出其从资本密集型消费者增长转向以利润率为核心的 B2B 基础设施。
