  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 消费者 App（B2C）——牵引力、采用与互动
        blocks:
          - type: paragraph
            body: >
              Hopper 面向消费者的移动 app 覆盖 iOS 和 Android，是一个价格预测和旅行预订平台，覆盖机票、酒店、租车和度假屋。截至 2024 年，该 app 全球活跃用户约 3,500 万，较 2023
              年同比下降 22%；公司将收缩归因于有意减少北美以外 B2C 营销投入，转而通过 HTS 推动 B2B 增长。自 2015 年公开上线以来，全球累计下载量已超过 1.2 亿；年度下载量在 2023 年达到
              1,870 万峰值，随后在 2024 年急降至 450 万，单年下降 76%。这说明 Hopper 不再主动扩大消费者用户基础，而是主要把 app 当作产品开发沙盒，后续通过 HTS 企业平台商业化这些功能。

              尽管下载量下滑，消费者 app 仍保持强劲的名义满意度：截至 2026 年，它在 Apple App Store 拥有 120 多万条评价，评分为 4.8/5。约 70% 的用户基础是 Gen-Z
              和千禧一代旅客，使其成为北美最移动原生的旅行平台之一。通过消费者 app 完成预订的用户中，超过 60% 会购买至少一项 fintech 保障产品（Price Freeze、Cancel for Any
              Reason 或 Disruption Assistance）；这是机票和酒店预订基础佣金之外的主要变现杠杆。Hopper Carrot Cash 忠诚度计划为预订提供 1–5%
              cashback，形成封闭循环激励，推动复购并提升生命周期价值。2024 年，所有渠道（B2C 和 B2B）的总预订价值达到 $7.5B，高于 2023 年的 $5.9B，说明即便消费者 app
              下载基础收缩，平台总量仍在增长。

              消费者 app 目前的战略意义主要是产品测试和品牌可信度载体，而不是直接收入驱动因素。Hopper 总裁 Dakota Smith 公开称消费者 app 是「沙盒」，由此产出的创新再由 HTS
              大规模部署给企业合作伙伴。尽调应确认 B2C 收入绝对值是否仍在增长，还是 app 已结构性下滑；同时要确认品牌可信度功能能否在下载量持续恶化时继续成立。
