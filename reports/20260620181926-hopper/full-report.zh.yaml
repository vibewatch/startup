      - number: '2.4'
        title: 2026 年前的增长驱动和顺风
        blocks:
          - type: paragraph
            body: >-
              五个结构性顺风支撑到 2026 年的市场机会。第一，移动渠道迁移：截至 2024 年，移动设备贡献全球在线旅行流量的 70.5%，基于应用的预订占 OTA 预订量
              44–45%，高于五年前的少数地位。SensorTower 报告 2024 年全球旅行应用下载量达 4.2B（同比 +3%），使用时长首次超过 20B 小时（同比
              +7.3%）。第二，金融科技附加率扩张：疫情后，用户为旅行灵活性付费的意愿明显扩大。HTS 自有消费者研究显示，84% 旅客认为预订机票时灵活性重要，60% 表示愿意为 Cancel for Any Reason
              付费，在高频旅客中升至 90%。旅客一旦体验过金融科技保障，HTS 报告复购率为 84%。第三，AI 驱动个性化：生成式 AI 正进入行程规划和支持工作流。Market Research Future 预计旅行
              GenAI 市场将从 2024 年 $2.22B 增长到 2035 年 $18.39B，CAGR 为 21%。Trip.com 的 TripGenie 和 Expedia 的 Romie
              是早期大众市场案例。Hopper 在预测定价上的数据优势自然延伸到 AI 驱动推荐。第四，APAC 和新兴市场需求增长：DataHorizzon 与 GM Insights 都把亚太列为增长最快的 OTA
              区域，中国出境游强劲复苏——Trip.com 报告 2025 年部分 APAC 细分的国际预订增长 60%。第五，B2B 基础设施需求：Carlsquare TravelTech 报告把 $9T
              旅行市场描述为高度碎片化、存在集中化机会；航空公司寻求第三方金融科技而非内部自建，B2B SaaS 正成为主导，Deloitte 也指出 AI 个性化要求正在推动平台投资。
