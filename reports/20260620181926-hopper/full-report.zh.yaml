      - number: '6.3'
        title: 消费者满意度、评价证据与负面信号
        blocks:
          - type: paragraph
            body: >
              Hopper app 的消费者满意度因评价平台不同而明显分裂。在 Apple App Store，截至 2026 年，该 app 获得 120 多万条评价，评分为
              4.8/5，反映价格预测、预订流程和附加产品清晰度带来的强 app 内体验。但 Trustpilot 更多捕捉预订后问题，而非预订流程满意度，因此给 Hopper 的评级是
              1.6/5、「Bad」。这种差异符合一个平台画像：预订和价格预测 UX 很强，但预订后支持和退款执行存在问题。

              Better Business Bureau 记录显示，过去三年 Hopper USA Inc. 收到 577 起投诉，最近 12 个月有 120 起（截至 2026
              年中）。反复出现的投诉主题包括：（1）退款处理失败——尤其是 CFAR
              政策，消费者以为自己在合格窗口内取消，却发现条款比广告宣传更严格；（2）结账时出现隐藏承运商收费，初始展示票价中没有披露；（3）租车费用差异，Hopper
              展示价格不含州税或跨州旅行附加费，柜台才收取；（4）客服难以触达——许多评价者称很难联系人工坐席，聊天机器人循环和长时间等待是最常见摩擦点。

              2025–2026 年 Trustpilot 评价包括多起案例：口头承诺的退款从未处理；酒店退款被错误退至 Hopper 自有支付渠道，而非预订卡；Hopper
              确认的座位预订未登记在航空公司系统中（一个记录案例归因于旅行聚合合作伙伴 TravelFusion）。Hopper
              对多数负面评价的回复是模板化的，只是引导客户拨打电话。多名评价者称无法获得任何解决，并升级至消费者保护机构。

              HTS B2B fintech 产品的满意度画像明显更积极。HTS 官方 CFAR 页面称，CFAR 交易客户满意度为 98%；2026 年 6 月 FTE 会议演示称，使用过 CFAR
              或类似灵活性产品的旅客复购率为 84%。HTS 还报告 2025 年向客户支付了 $33M CFAR 退款——说明该产品不只是被购买，也确实被使用。B2C 消费者体验与 B2B fintech
              产品满意度之间的分裂，对尽调很关键：HTS 自报满意度指标很高但未经审计，而独立评价平台持续把支持和退款摩擦列为 B2C 主要投诉类别。

              负面信号：Skift 引用其 2026 年 3 月独立报道称，由于内包交易，Hopper「失去了来自 Capital One 的大部分收入流」。Hopper 发言人反驳这一表述，Dakota Smith 强调
              Capital One 仍是 Hopper 最大的 API 客户。Skift 报道与 Hopper 表述之间的冲突尚未解决，需要管理层直接确认转型后的收入年化基准。
