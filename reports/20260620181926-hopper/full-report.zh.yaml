      - number: '8.5'
        title: 建议、风险评级与退出准备度
        blocks:
          - type: paragraph
            body: >-
              总体建议为 TRACK，置信度中等，风险评级 HIGH。产品和市场机会确实有差异化，B2B fintech 利润率也给出了可信的盈利路径。但若没有以下条件，$5B 入场价格无法支撑：（a）经审计财务确认
              EBITDA 改善说法；（b）披露内化后 HTS 收入 run rate 和 Capital One 集中度；（c）确认 cap table 和 preference stack；（d）现实的 IPO
              或新一轮价格发现路径。建议不是 AVOID，因为论点有实质价值；但也不是 BUY，因为 $5B 价格缺少独立确认，且嵌入的集中度风险没有得到足够补偿。

              截至 2026 年 6 月，退出准备度低。Hopper 已释放 IPO 意向（Caplight 和 CB Insights 记录了 2025 年 1 月「IPO 已宣布」事件），正考虑 TSX/Nasdaq
              双重上市，管理层也提出 $10B 目标。但尚未公开确认 S-1、PCAOB 审计或承销商聘用。Forge Global
              报告二级市场活动有限，且没有撮合价格。投资者今天唯一的流动性路径，是成交量极低的私募二级市场，或等待管理层称为「长期」的 IPO。Capital One 持续持股虽是战略背书，也引入了董事会层面的治理动态，可能使
              IPO 准备度决策和流通股时间安排复杂化。

              估值立场为 STRETCHED。按 $5B 对 $850M 2024 收入，倍数为 5.9x——是 OTA 行业 2.4x 中位数的两倍。若要让该标记变为 FAIR 或 ATTRACTIVE，Hopper
              需要：确认盈利能力（EBITDA margin ≥10%）、证明 Capital One 替代收入达到相近规模，并承诺 2026–2027 年 IPO 时间表，且招股书能独立验证收入基础。
