        title: 移动优先架构与开发者生态
        blocks:
          - type: paragraph
            body: >-
              Hopper 按移动优先平台搭建：消费者预订产品只通过原生 iOS 和 Android app 交付，hopper.com 网站提供次级浏览器界面。hopper.com 的 DNS 记录解析到 Google
              Cloud 基础设施（域名服务器为 ns-cloud-e1 至 ns-cloud-e4.googledomains.com），并包含一条 Twilio 域名验证 TXT 记录，显示 Google Cloud 和
              Twilio 是两个公开可见的基础设施依赖。底层计算、ML 训练栈、数据库层和 CI/CD 工具均未公开披露。

              B2B 开发者侧，Hopper 维护一个公开 GitHub 仓库（hopperteam/hopper-developer），包含 18 次提交、一份 RESTful API 规范和开发者文档。API 使用
              RSA-key 签名认证，支持 notification、app 和 subscription 对象类型，用于白标合作伙伴集成。相对完整 HTS 平台，该仓库范围很小——它看起来覆盖的是旧消费者 API
              的通知和订阅层，而不是完整 HTS commerce 与 fintech API 表面；后者由合作伙伴门控。

              应用商店表现显示移动端消费者互动健康：iOS 端 1.2M+ 条评分给出 4.8 星，Android 端约 149K 条评价给出 4.6 星，Google Play 安装量 10M+。Hopper
              还通过与每次预订绑定的碳抵消承诺种下超过 3,100 万棵树。移动优先的消费者 UX、不透明的内部架构、以及合作伙伴门控的 B2B API 表面叠加，为任何技术基础设施评估留下了实质性尽调缺口。
