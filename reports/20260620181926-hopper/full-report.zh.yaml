        title: 附录
        blocks:
          - type: callout
            title: HTS 金融科技利润率是薄利旅行市场里的稀缺结构优势
            body: >-
              旅行是结构性薄利品类：OTA 佣金通常为 15–20%，沉重的 Google Ads 支出进一步侵蚀利润率。HTS 的金融科技附加产品（CFAR、Disruption Assistance）在合作伙伴渠道实现
              60% 利润率，并在 180+ 个国家达到 84% 复购率，代表真正的利润质量优势；截至 2026 年 6 月，既有 OTA 还未在可比规模复制。
