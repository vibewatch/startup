      - number: '4.5'
        title: 负面财务信号与收入风险
        blocks:
          - type: paragraph
            body: >-
              几个负面财务信号对承销判断至关重要。第一，Capital One——Hopper 最大的托管平台客户——于 2026 年 3 月将 Capital One Travel 收回自营；Skift 报道称，Hopper
              失去了「来自 Capital One 的大部分收入流」。Hopper 反驳了这一收入影响表述，Dakota Smith 也强调双方转为 API-only 关系，但对单一合作伙伴的结构性依赖很明显：B2B 占收入
              90%，Capital One 是最大客户。第二，Hopper 消费者 app 用户数 2024 年同比下降 22% 至 35M，app下载量从 2023 年的 18.7M 暴跌至 2024 年的
              4.5M，说明自然消费者获客明显恶化。第三，公司在 13 个月内执行两轮重大裁员，将核心员工从约 1,300 人降至约 400 人；即便管理层将重组描述为有意转向更高效的
              B2B，持续现金消耗压力仍然可见。第四，Hopper 未披露毛利率、EBITDA 利润率、月度 burn 或账上现金，外部无法独立验证 EBITDA
              盈利说法，也无法评估资本充足性。第五，两个可信来源给出的收入数字冲突：Latka 为 $686.9M ARR，Business of Apps 和 Electroiq 为 $850M
              总收入，说明报告口径或方法不同，且公开层面尚未调和。
