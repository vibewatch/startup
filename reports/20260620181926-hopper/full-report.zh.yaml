      - - 按分部拆分的单位经济
        - B2B（HTS）与 B2C（消费者应用）的毛利率、CAC、LTV 和贡献利润率拆分
        - 支持正确分配倍数：SaaS 式（更高）vs. OTA 交易式（更低）；解决混合倍数不确定性
        - 财务数据室；分部报告；CFO 访谈
    notes: 六项目前均未解决或只在私下可得。第 1–3 项会阻断任何按 $5B 作出的投资决策；第 4–6 项也很重要。截至 2026 年 6 月，公开来源均无法提供这些信息。
    claimRefs:
      - CV036
      - CV038
      - CV041
      - CV042
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      Hopper 的公开记录从 2007 年创立延伸至三个主要拐点：2015 年消费者应用上线、2021 年 B2B 转向和 Series G，以及 2023 至 2026 年合作伙伴波动和人员缩减，最终以 Capital One
      将技术内部化收束。
    data:
      items:
        - date: '2007'
          label: 公司创立
          detail: Fred Lalonde 与 Joost Ouwerkerk 在 Montreal 注册 Hopper；多年数据科学建设启动。
          tone: positive
        - date: 2015-01
          label: iOS 应用上线
          detail: 面向消费者的机票价格预测应用公开发布；获得 Apple App of the Year。
          tone: positive
        - date: 2018-05
          label: Series D — $98M；新增酒店搜索
          detail: GV 和 CDPQ 领投；产品从机票扩展到酒店。
          tone: positive
        - date: '2019'
          label: Hopper Cloud B2B 上线
          detail: 首家航空公司合作伙伴签约；开始转向合作伙伴驱动收入。
          tone: positive
        - date: '2020'
          label: COVID — 裁员 40%
          detail: 全球旅游崩塌迫使约 250 人离职；B2B 转向加速，成为生存策略。
          tone: negative
        - date: 2021-08
          label: Series G — $175M，估值 $3.5B
          detail: Capital One Ventures、Citi Ventures、WestCap 和 Temasek 投资；Hopper Homes 上线。
          tone: positive
        - date: 2022-11
          label: Capital One 投资 $96M，估值 $5B
          detail: 最深的战略关系；最后确认的一级轮；披露估值峰值。
          tone: positive
        - date: 2023-07
          label: Expedia 终止 Hopper Cloud 合同
          detail: 重大 B2B 收入损失；触发 2023 年 10 月 30% 裁员周期。
          tone: negative
        - date: 2023-10
          label: 裁员 30% — 约 200 人
          detail: Expedia 终止合作后重组成本；员工数降至约 500 人。
          tone: adverse
        - date: 2024-11
          label: Expedia 续约；同步裁员 10%
          detail: 收入恢复与持续成本压力并存；显示合同脆弱。
          tone: warning
        - date: 2026-03
          label: Capital One 将 Hopper 技术内部化
          detail: 约 150 名 Hopper 员工和技术栈被收购；Capital One Travel 转为自营；Hopper 成为纯 API 合作伙伴。
          tone: adverse
        - date: 2026-06
          label: 运行日快照
          detail: Hopper 以约 400 名核心员工运营；B2B run rate 和估值仍是待尽调问题。
          tone: neutral
    approximationNotes: 2021 年前融资金额为分析师估计，未获公司确认。员工数基于媒体报道，均为近似值。
