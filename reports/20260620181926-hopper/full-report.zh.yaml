      - number: '4.4'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              2012 年至 2022 年 11 月（最近一轮已完成融资），Hopper 通过多轮股权和战略资本合计融资约 $740M。融资路径包括：2012 年 $12M Series B、2016 年 $62M
              融资、2018 年 $100M 融资、2021 年 3 月由 Capital One 领投的 $170M Series F（使 Hopper 以约 $3.5B 估值成为独角兽）、2021 年 8 月由 GPI
              Capital 领投的 $175M Series G（同样约 $3.5B 估值）、2022 年 2 月 $35M 老股交易（标志 $5B 估值），以及 2022 年 11 月 Capital One 追加的
              $96M（确认 $5B+ 估值）。此后未披露新的股权融资。管理层在 2024 年 11 月称，Hopper 不寻求外部融资，近期也没有 IPO 计划，不过媒体曾提到最终 IPO 的目标估值为 $10B。2026
              年 3 月，Capital One 以约 $96M 收购 Hopper 的托管平台技术、150 名员工、牌照、服务合同和供应商关系，转为 API-only 合作伙伴，同时仍是主要股东。Hopper
              称，在这次转型前的六个月已实现正 EBITDA。当前现金余额、月度 burn rate 和 runway 均未公开披露。公司通过 2023 年 10 月（250 人，30%）和 2024 年 11 月（60–65
              人，10%）两轮结构化裁员，将员工从约 1,300 人（2023 年末）降至约 400 名核心员工（2026 年 3 月）。
