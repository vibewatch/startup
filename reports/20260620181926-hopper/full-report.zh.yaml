  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >-
              Hopper 最近一次有定价的一级股权融资，是 Capital One 于 2022 年 11 月投资 $96M，投后估值超过 $5 billion USD。此前 2022 年 2 月的一笔约 $35M
              二级交易，首次公开确立了 $5B 标记。总体来看，2012 年至 2022 年 11 月期间，Hopper 在所有已披露轮次中累计融资约 $740M。此后没有公开宣布新的一级股权融资；截至 2026 年 6
              月报告日期，$5B 标记已陈旧约 3.5 年。

              2022 年 11 月轮次完全由 Capital One 领投——它既是 Hopper 最大的 B2B
              伙伴，也是战略投资者——因此产生一个结构性问题：该轮价格究竟反映了公平市场出清，还是为了延续商业关系而支付的战略溢价。BetaKit 和 TechCrunch 均报道了 Dakota Smith
              的说法：Hopper「wasn't in a position where it needed to raise capital」，并将该轮描述为「opportunistic」；Capital One
              则表达了更长期合作的兴趣。这一背景显著削弱了把 $5B 标记视为市场验证公允价值的可靠性。

              到 2026 年 3 月，Capital One 以约 $96M 收购了 Hopper 的托管旅行门户技术、约 150 名员工、供应商关系和牌照——从托管平台客户转为 API-only
              伙伴，同时保留其股权。Hopper 管理层称交易前六个月 EBITDA 为正，但未发布经审计 P&L 或资产负债表。Forge Global 截至 2025 年 4 月把 Hopper 的最近已知估值列为
              $5B，二级市场活动有限且没有撮合价格；Caplight 也将市场活动归类为有限。截至 2026 年 6 月，CEO Frederic Lalonde 已与 Bloomberg 讨论 $10B IPO
              估值目标，公司正考虑 TSX/Nasdaq 双重上市，或转而寻求私募股权；但尚未宣布时间表、S-1 或承销商。
