        - 任意两项出现：全球座位容量下降 15%，美国 CCI 低于 80，HTS 合作伙伴预订量环比下降 20%
        - 按预订量下降 30% 的情景压力测试收入模型；下一个决策点前核验现金头寸和 runway
      - - IPO / 盈利执行
