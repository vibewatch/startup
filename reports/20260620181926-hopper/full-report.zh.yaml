      - number: '2.7'
        title: 附录
        blocks:
          - type: callout
            title: 金融科技附加率是结构性差异化
            body: >-
              OTA 市场正围绕价格一致性商品化，但 Hopper 约 50% 的金融科技附加率、每笔预订平均 1.5 个产品，创造了 legacy OTA 难以复制的单笔交易收入溢价；没有 Hopper
              的定价数据和精算历史，传统 OTA 很难做到。McKinsey CEO 访谈提到，当时 Hopper Cloud 增速“in the high triple digits”，如今贡献总收入一半，说明 B2B
              渠道可能比 B2C 消费者渠道增长更快。
