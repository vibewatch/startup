  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入栈与汇总指标
        blocks:
          - type: paragraph
            body: >-
              Hopper 运营双重收入栈：面向消费者的旅行市场（B2C）和名为 HTS（Hopper Technology Solutions）的白标 B2B 企业平台。报告口径总收入在 2024 年达到 $850M，高于
              2023 年 $700M 和 2022 年 $500M，相比 2019 年 $45M 基数约实现 19 倍复合增长。Latka 独立报告 2024 年 ARR 为
              $686.9M，这是更窄指标，可能捕捉运行率合同收入，同时排除交易性或一次性项目。2024 年总预订额达到 $7.5B（2023 年为 $5.9B），意味着全平台混合收入抽成率约 11–12%，高于传统 OTA
              通常的 2–4%，反映 Hopper 偏金融科技的收入组合。HTS B2B 收入从 2021 年中为零，增长到 2024 年总收入的 66%（联合创始人 Dakota Smith 在行业会议上的说法），并在
              Capital One 转换后到 2026 年 3 月约达到 90%。收入质量混合：HTS B2B 板块靠合作伙伴合同和高附加率承载 recurring API 与金融科技收入，消费者应用则产生交易佣金加金融科技
              upsell。两个板块都没有分别披露毛利率或营业利润。
