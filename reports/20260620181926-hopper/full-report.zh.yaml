          to: prediction
        - from: prediction
          to: watch
        - from: watch
          to: notification
        - from: notification
          to: freeze
        - from: notification
          to: fintech
        - from: freeze
          to: book
        - from: fintech
          to: book
        - from: book
          to: post
    approximationNotes: Watch 到通知的转化率和平均通知延迟未公开披露。金融科技附加率（>50%）为公司经 PayPal newsroom 声称。预订后理赔流行为来自 App Store 列表和评论平台账号描述。
