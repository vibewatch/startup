      - number: '8.6'
        title: 尽调问题与论点破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              五个最关键的尽调问题是：（1）2023–2025 年经审计 P&L 和资产负债表，确认 EBITDA 为正并揭示现金充足性；（2）收入集中度披露，显示 Capital One 历史占比和 2026 年 3
              月之后的 forward run rate；（3）完整 cap table，包括清算优先权、反稀释条款和投资者权利；（4）HTS 客户 pipeline，以及 RBC
              Avion、Lloyds、Nubank、SMBC 和任何 tier-1 银行或航空公司潜在客户的合同状态；（5）董事会批准的 IPO 时间表、承销商确认和 PCAOB
              审计状态。次级问题包括分部层面的毛利率、B2B 和 B2C 渠道各自的 CAC/LTV，以及公开文件中不可见的任何法律或监管程序。

              会把建议从 TRACK 推向 AVOID 的论点破裂触发条件包括：（a）披露 Capital One 加任何另一名伙伴合计超过总收入 50%，暴露灾难性集中度风险；（b）新一轮有定价一级融资或 IPO 定价低于
              $3B；（c）任一前三大 HTS 银行伙伴在 12 个月内流失；（d）S-1 披露连续两个或更多季度 EBITDA 亏损；或（e）宏观驱动 OTA 倍数压缩至低于 1.5x
              EV/revenue，无论增长如何，都会把 Hopper 基准情景价值限制在约 $1.3-2B。

              会把建议推向 BUY 的触发条件包括：经审计财务确认 EBITDA margin ≥10%；新增一家 tier-1 银行伙伴（规模相当于 Capital One Travel 的 80M+
              持卡人）；宣布有具体时间表和承销商的 IPO；或二级市场出清价格显著高于 $5B，验证该水平上广泛投资者需求。
            claimRefs:
