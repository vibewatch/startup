chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Hopper 是一家加拿大旅行技术公司，总部位于魁北克省蒙特利尔，并在波士顿等城市设有办公室。公司成立于 2007 年——不是有时被引用的 2008 年——此后经历多年研发阶段，直到 2015 年 1
              月才公开推出消费者移动应用。公司的基础创新是一套 AI 驱动的价格预测引擎，分析数十亿个机票和酒店价格数据点，建议旅客何时买最合适。该预测能力叠加应用内金融科技产品，比如 price freeze 和
              cancel-for-any-reason 保险，既拉动了消费者采用，也支撑了后来的 B2B 业务。


              Hopper 采用双轨商业模式。面向消费者的 Hopper app（B2C）是机票、酒店、租车和度假屋的直接预订渠道，同时也是产品沙盒：新金融科技功能先在这里测试，再提供给企业合作伙伴。B2B 渠道以
              Hopper Cloud 为品牌、由 HTS（Hopper Technology Solutions）实体运营，通过 API 和白标平台，把 Hopper 的 AI
              定价引擎和金融科技模块授权给航空公司、酒店、银行和在线旅行社。到 2025 年，分析师估算 B2B 收入约占 Hopper 总收入的 90%；COVID-19 和 2023 年 Expedia
              合同纠纷之后，这一迁移明显加速。


              这门生意本质上依赖少数大型 B2B 合作伙伴。Capital One Travel 一直是最大的单一 B2B 关系；Capital One 于 2026 年 3 月决定把 Hopper 的技术栈内化，并接收约
              150 名 Hopper 员工，把这种依赖从托管平台安排改造成仅 API 关系。尽调应把内化之后的 B2B 收入基数视为开放问题，要求管理层直接确认。
