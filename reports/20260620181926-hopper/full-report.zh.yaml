      - number: '4.2'
        title: 金融科技产品套件与变现机制
        blocks:
          - type: paragraph
            body: >-
              Hopper 的 fintech 产品套件是主要利润引擎，也是竞争护城河。四个核心产品——Cancel For Any Reason（CFAR）、Price Freeze、Disruption
              Assistance for Any Reason（DAFAR）和 Car Rental Shield——通过消费者 app 和 HTS 的 B2B API，在预订环节作为附加产品销售。第五个产品 Seat
              Upgrades 于 2025 年加入。CFAR 允许旅客在出发前最多 24 小时取消，并获得 80% 或 100% 退款。DAFAR 在航班取消或符合条件的延误发生时，提供任意承运人的实时改签或 100%
              退款，全流程自助完成。Price Freeze 让用户在还没决定时，最多锁定票价 7 天。这些产品靠 Hopper 自有机器学习模型和历史行程数据集（每天 200 亿条已定价行程）动态定价。HTS
              数据显示，合作伙伴渠道利润率为 60%，复购率为 84%，说明单位经济性和客户满意度都较强。Fintech 附加产品贡献了 HTS 总利润的 45%，管理层称其为「领先的利润驱动因素」。WestJet 将
              CFAR 直接接入预订流程，并报告该产品提升了预订转化、带动附加收入。Tripadvisor 采用 HTS fintech 后，奖励用户转化率达到此前的 3 倍，15% 的酒店预订用户购买了 HTS
              fintech 产品。
