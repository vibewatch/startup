      - number: '5.6'
        title: 信任、安全、可靠性与客户服务质量
        blocks:
          - type: paragraph
            body: >-
              Hopper 的消费者信任画像分裂：app 内预订前体验评分很高（iOS 4.8/5），但预订后支持和可靠性收到了严重且系统性的负面评价。截至 2026 年，ComplaintsBoard 记录了 18 起
              Hopper 投诉，0 起解决；其中包括已记录的 60–90 天退款延迟，尽管部分市场监管要求为 7–20 个日历日。PissedConsumer 上 2,943 条评价给出 2.7/5 分，约 90%
              回复为负面。Trustpilot 评价持续指向客服响应差、拒绝退款、预订不匹配和隐藏费用。

              2026 年 4 月 21 日发生过一次有记录的平台宕机，宕机监测服务显示持续约一小时（UTC 05:01–06:01 PM）。宕机监测页面注明，检测结合了自动 HTTPS 探测和众包报告两类信号。Hopper
              不维护公开状态页——其状态由第三方服务追踪，而非公司运营的事件管理页面，这是运营透明度缺口。

              Hopper 的客服模式依赖 app 内消息；App Store 列表显示美国 / 加拿大可拨打免费电话（+1-833-933-4671），但 2026 年评测文档显示，标准问题要接入人工坐席似乎需要 VIP
              档订阅。安全与隐私认证（SOC 2 Type II、PCI-DSS、GDPR 合规、ISO 27001）均未公开披露；任何企业 B2B 合作伙伴做供应商尽调时，这都是重大缺口。碳抵消承诺（每笔预订 2
              棵树，已种植 31M+）是唯一公开验证的 ESG 项目。
