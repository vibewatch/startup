  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Hopper 在三个相互重叠的竞争场域中竞争。第一，消费者旅行预订领域，它面对成熟元搜索引擎（Google Flights、Kayak、Skyscanner）、机票优惠提醒订阅服务（Going）和全服务
              OTA（Booking.com、Expedia、Airbnb、TripAdvisor）。第二，带金融科技包装的旅行附加产品领域，Hopper 的 Price Freeze、Cancel for Any
              Reason（CFAR）和 Disruption Assistance 产品让它区别于所有纯 OTA；截至 2026 年 6 月，后者没有任何一家能规模化提供类似金融科技风险产品。第三，B2B
              白标旅行技术市场，Hopper 的 HTS 平台与 Expedia Partner Solutions、传统忠诚度平台提供商，以及自建内部平台的金融机构竞争——Capital One 于 2026 年 3 月收购
              Hopper 自身技术栈就是一例。


              2026 年全球 OTA 市场估算约为 $761.5B，并以约 7.4% CAGR 向 2035 年 $1.4T 增长。前五大 OTA 玩家（Booking
              Holdings、Expedia、Airbnb、Trip.com、TripAdvisor）合计按收入约占更广义在线旅行市场的 14%，其中 Booking Holdings 和 Expedia
              占主导。Hopper 是私营公司，收入规模小到不会出现在公开市场份额表中，但其 HTS B2B 平台服务银行合作伙伴覆盖的 400M+ 信用卡客户，这些合作伙伴代表每年超过 $1.6T 的卡消费。


              Hopper 面临的竞争压力是不对称的：Google 免费元搜索侵蚀消费者变现，而既有 OTA（Booking、Expedia）建设平行 B2B 部门，直接与 HTS 竞争。Capital One 于 2026
              年 3 月收购技术，凸显新风险——大型企业合作伙伴一旦规模足够，就能内化 Hopper 技术——但新的银行合作（RBC Avion、Lloyds、Nubank、SMBC）说明 HTS 服务需求仍强。
