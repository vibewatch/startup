      - number: '1.3'
        title: 融资、估值与投资人
        blocks:
          - type: paragraph
            body: >
              Hopper 在已披露和可推断的风险融资轮次中合计估算融资 $740M，但公司没有发布累计融资总额。融资历史从约 2013 至 2016 年的早期轮开始，随后包括 2018 年 5 月约 $98M 的
              Series D、2019 年约 $100M 的 Series E，以及 2021 年 8 月由 Capital One Ventures、Citi Ventures、WestCap Group 和
              Temasek Holdings 领投的 $175M Series G，报道称估值 $3.5B。最近披露的一级轮是 2022 年 11 月 Capital One 投资 $96M，投后估值 $5B。


              $5B 估值现在明显过旧。自 2022 年 11 月以来没有公开报道新的一级轮，因此参考估值截至本次报告日期约已过去 3.5 年。Capital One 于 2026 年 3 月决定把 Hopper
              技术内化，也让估值判断更复杂：内化移走了一条 captive revenue stream，并重构了 Hopper 最大的合作伙伴关系。任何当前估值估算都需要新的内部财务数据，并重新评估内化后模式下的 B2B
              收入运行率。


              Stack Capital Group 是一家加拿大上市投资公司（TSX: STCK），披露持有 Hopper
              股权，并在净资产价值声明中提及该投资，成为观察这家私营公司股权结构的少数公开窗口之一。CDPQ（Caisse de dépôt et placement du Québec）是魁北克最大养老基金，至少自 2018
              年起参与多轮投资，是长期机构持有人。完整 cap table、清算优先权结构、反稀释条款和董事席位安排均未公开。
