      - number: '1.4'
        title: 规模、产品与指标
        blocks:
          - type: paragraph
            body: >
              截至 2024 年，Hopper 消费者应用下载量已超过 1 亿次，按累计安装量看属于较大的旅行应用之一。应用提供机票搜索和预订（最初产品）、酒店搜索和预订（约 2018 年加入）、通过 Hopper Homes
              提供度假屋租赁（2021 年加入）以及租车（2022 年加入）。用户可以加购一组金融科技产品——price freeze、cancel-for-any-reason、flexible date
              change。这些金融科技产品同样是 Hopper Cloud B2B 方案的核心，出售给航空公司、酒店和 OTA 合作伙伴。


              公开来源里的规模指标要么来自公司口径，要么来自分析师估算，或两者兼有，均未经审计。分析师来源估算 2024 年总预订额约 $7.5B、总收入约 $850M，但两项均未获公司确认。员工数已大幅下降：从报道峰值约
              700 人，降至 2020、2023、2024 年裁员以及 2026 年 3 月 Capital One 接收约 150 名额外员工之后估算的 400 名核心员工。B2B 收入占比截至 2025
              年估算约为总收入的 90%，但该数字来自分析师分析，而非公司披露。


              鉴于缺少经审计财务，以及 Capital One 内化事件影响重大，所有收入、预订额和员工数都应被视为方向性估算。后续章节应把这些指标作为公开参考点使用，并以数据室确认为准。
