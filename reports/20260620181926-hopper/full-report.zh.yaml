      - number: '6.4'
        title: 留存、重复使用与 Fintech 忠诚度动态
        blocks:
          - type: paragraph
            body: >
              Hopper 没有公开披露 HTS 企业合作伙伴的正式 B2B 留存指标，例如 Net Revenue Retention（NRR）、Gross Revenue Retention（GRR）或客户流失率。消费者
              app 侧，也没有披露 NPS、群组留存曲线或正式流失统计。尽调必须直接向管理层索取这些数据。

              B2B fintech 产品目前最具体的留存信号来自 HTS 自己的会议演示：使用过 CFAR 的买家，未来预订复购概率比未使用者高 5.8×；更广泛的 fintech 产品复购率为 84%。HTS 已在
              180+ 个国家销售「数百万」个 fintech 产品，并在 2025 年向使用 CFAR 的客户支付 $33M 退款。这些指标说明消费者对 fintech 层有真实粘性——但三项数据都来自 HTS
              自有营销材料和会议演示，而非独立审计或合作伙伴披露，置信度因此受限。

              B2B 企业留存最好的可用代理指标是合作伙伴年限。Capital One 从 2020 年 12 月到 2026 年 3 月是创始托管平台合作伙伴，关系持续 4.5
              年，之后将技术内包。其他长期银行合作伙伴（SMCC Japan、Lotte Card、Commonwealth Bank）已上线 1–2 年，没有公开续约或终止消息。Air Canada 作为 HTS
              fintech 合作伙伴已有约四年。这些年限说明，企业 B2B 客户一旦集成后不会快速流失；但 Capital One 内包事件引入了新模式：大型客户可能先从托管平台「毕业」到
              API-only，随后随着内部工程团队成熟，甚至进一步内包 API 能力。这种「合作伙伴毕业」风险是 HTS 商业模式独有的，应在尽调中做压力测试。

              消费者 app 忠诚度部分由 Carrot Cash 计划支撑。用户预订可获得 1–5% cashback，并可通过 Hopper Wallet 在未来预订中兑换。封闭循环结构激励用户在 Hopper
              平台复购，但公司没有发布群组留存数据。鉴于 2024 年活跃用户下降 22%、下载量下降 76%，即使留存用户平均收入因更高 fintech 附加购买率
              而上升，消费者端留存看起来仍在走弱。用户数下降和单用户变现提升同时出现，符合一个平台正收缩到更小但价值更高、意图更强、使用 fintech 的旅客核心。
