      - number: '1.5'
        title: 里程碑、负面事件与尽调信号
        blocks:
          - type: paragraph
            body: >
              Hopper 的公开里程碑从 2007 年创立开始，经历缓慢的数据科学建设阶段、2015 年 1 月消费者应用上线（当年获得 Apple App of the Year）、2016 至 2022
              年多轮融资弧线，以及 2020 至 2026 年越来越动荡的时期，其间有裁员和合作伙伴波动。


              COVID-19 时期是第一个拐点：2020 年全球旅行崩塌迫使公司裁员约 40%（估算 250 人）。这一阶段公司把战略重心转向通过 Hopper Cloud 做
              B2B，把消费者应用定位为产品测试场，而非主要收入引擎。后续所有变化都要放在这个战略转向语境中理解。


              Expedia 纠纷是第二个、也更关键的拐点。2023 年 7 月，Expedia 终止 Hopper Cloud 合作，拿走了一项重要 B2B 收入来源，并直接引发 2023 年 10 月 30% 裁员（约
              200 人）。Expedia 后来在 2024 年 11 月续约，但续约同时伴随 Hopper 称为改善单位经济性的 10% 裁员。续约与裁员几乎同步，是值得注意的治理信号。


              2026 年 3 月 Capital One 事件是第三个、也是当前拐点。Capital One 宣布将 Capital One Travel 技术收归内部，接收约 150 名 Hopper
              员工和底层技术栈。Skift 和 Business Travel News 报道称，Hopper 与 Capital One 的关系从托管平台模式转向仅 API
              安排。下方里程碑表和时间线按顺序记录这些事件，作为报告其余部分的规范年表。BBB 投诉记录和客户服务批评模式构成第四个尽调维度；细节放在证据缺口章节，因为公开记录的颗粒度不足，无法对总体投诉率或解决效率下结论。
