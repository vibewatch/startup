      - number: '2.5'
        title: 约束、逆风与负面证据
        blocks:
          - type: paragraph
            body: >-
              多股力量限制可服务需求并压缩利润率，直接影响 Hopper 轨迹。第一，美国 OTA 平台期：Phocuswright 2025 年报告称美国 OTA 销售只有温和增长，国内需求走软，Expedia 最大市场在
              2025 年部分细分下滑 7%。Hopper 高度集中在北美，这一点很关键。第二，供应商直订迁移：航空公司和酒店继续投资直销渠道忠诚度计划（Expedia
              提到消费者收紧预算时转向不可退款价格，同时保险附加产品增长——对 OTA 是混合信号）。第三，政治和宏观波动：Protect Group 2025
              年回顾记录美国来自加拿大和欧洲的跨境到达量双位数下滑，政治不确定性缩短预订窗口，并降低用户在没有灵活选项时作出承诺的意愿。Deloitte 2026 年展望提示新的美国签证限制（$250 integrity
              fee、保证金要求、扩大社交媒体审查）可能压制入境旅游。第四，监管和数据隐私合规：Deloitte 指出 GDPR 和美国州级隐私法规限制旅行平台用旅客数据做个性化和动态定价，抬高合规成本，也限制 AI
              驱动报价能走多远。第五，货币逆风：Barclays 在 2025 年初提示 FX 波动会压缩有国际敞口 OTA
              的利润率，即便交易量上升，也会限制非美国增长的盈利能力。第六，替代金融科技竞争：航空公司和酒店也在内部开发取消 / 改签灵活性——McKinsey CEO 访谈提到竞争者“have dabbled in
              this”——但 Hopper 的数据优势和多产品广度支撑了更持久的 moat 主张。
            claimRefs:
