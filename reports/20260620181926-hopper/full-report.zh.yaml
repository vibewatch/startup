              的大部分收入」；（2）2024 年消费者 app 下载量同比下降 76%，活跃用户下降 22%，削弱 B2C 收入基础，也削弱作为 HTS 概念验证的消费者品牌可信度。两者叠加形成近期收入敞口，必须由 RBC
