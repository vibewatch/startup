      - number: '3.3'
        title: OTA 既有玩家：Booking Holdings、Expedia、Airbnb 和 TripAdvisor
        blocks:
          - type: paragraph
            body: >-
              Booking Holdings（BKNG）截至 2026 年 Q1 的过去 12 个月收入约 $27.7B，占公开交易 OTA 市场约 35.9%。其旗舰 Booking.com 主导欧洲酒店预订（2025
              年约 71% 份额），但自 2024 年 11 月起受到欧盟 Digital Markets Act 守门人约束，宽泛价格平价条款被禁止。Booking 拥有 Kayak、Priceline 和
              OpenTable，因此控制多种发现和预订入口。Expedia Group（EXPE）同期收入约 $15.2B（约 19.7% OTA 市场份额），2026 年 Q1 收入同比增长 15%，全年 2026 指引为
              $15.6B–$16.0B。Expedia 的 B2B 部门（原 Private Label Solutions）2025 年 Q3 总预订额同比增长 26%，连续第 17 个季度实现双位数 B2B 扩张，直接与
              HTS 争夺银行和航空公司白标合同。


              Airbnb 截至 2026 年 Q1 的过去 12 个月收入约 $11.2B（约 14.5% OTA 市场份额），并积极从短租扩展到酒店库存、体验和生活方式服务。Airbnb
              不提供金融科技附加产品或机票预订，因此与 Hopper 的竞争重叠仅限酒店和度假租赁类别。TripAdvisor 虽按市场存在感是前五大 OTA，但主要是点评和导购平台，交易收入增长缓慢；TripAdvisor
              于 2025 年与 HTS 合作，意味着它现在是 Hopper B2B 平台客户，而非纯粹竞争者。


              OTA 既有玩家相对 Hopper 共同拥有结构优势：全球品牌认知、大型忠诚度计划（Booking 的 Genius、Expedia 的 One
              Key），以及数十年积累的直接供应商关系。不过，它们在金融科技附加产品深度、面向淘优惠千禧一代的 mobile-first UX，以及 individual-route 层面的 AI 驱动价格预测上落后于
              Hopper。
