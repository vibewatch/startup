  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入和排除的支出，以及替代方案
        blocks:
          - type: paragraph
            body: >-
              Hopper 的可服务市场落在四个相互关联但分析上不同的池子交汇处。第一，传统在线旅行社（OTA）市场——让消费者搜索、比较并预订机票、住宿、租车和套餐的数字平台——是最宽的口径。纳入的 OTA 支出覆盖通过
              Booking.com、Expedia、Hopper
              等中介平台成交的总预订额；排除航空公司或酒店官网直订、线下旅行社佣金，以及不流经预订平台的旅途中附加支出。第二，移动旅行预订子市场切出在智能手机和专用应用上发起并完成的 OTA 支出；这条边界重要，因为
              Hopper 2015 年以仅移动应用起步，并在移动原生行为上建立数据优势。第三，旅行金融科技是更新的类别，由叠加在旅行交易上的金融产品组成（price freeze、cancel for any
              reason、disruption protection、dynamic insurance 和 instant rebooking），代表 Hopper 最高利润率的收入池。传统 OTA
              市场规模通常不纳入这类支出，除非分析师明确计入附加总收入。第四，B2B 旅行基础设施（白标预订引擎、API 授权、面向航空公司和银行的 fintech-as-a-service）由 Hopper
              Technology Solutions 服务，买方结构也不同（企业采购，而非消费者结账）。现状替代方案包括航空公司和酒店直订渠道、传统旅行社、信用卡旅行门户（例如 Chase Sapphire、Capital
              One Travel——Hopper 在其中既是替代者也是合作伙伴），以及越来越多展示直订链接的通用搜索引擎。承销的关键洞察是，相关市场不是完整 OTA
              TAM，而是金融科技附加率高、移动为主渠道、品牌忠诚仍在争夺的子板块；这些特征相比传统桌面端 incumbents，更有利于 Hopper 这样的 mobile-first、fintech-native 玩家。
