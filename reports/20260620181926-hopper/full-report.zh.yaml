      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 陈旧的 $5B 标记——基准情景下结构上无法支撑
            body: >-
              $5B 估值标记已有约 3.5 年历史，由 Hopper 最大商业伙伴在具有战略动机的轮次中设定，在基准情景假设下得不到上市可比分析支撑。基本面分析在基准情景下隐含 $3.0–3.8B 区间。任何按 $5B
              进行的新投资，都嵌入较基准情景 30–65% 的溢价，要求牛市论点的每一根支柱都执行到位。
            calloutType: risk
            claimRefs:
              - CV001
              - CV014
              - CV015
              - CV037
              - CV042
          - type: callout
            title: 建议——TRACK，风险评级 HIGH
            body: >-
              以高确信度监测：产品和市场论点强，但入场价格相对可比公司集合偏紧，Capital One 内化又引入结构性收入问题，必须由管理层披露来解决。只有在经审计财务确认 EBITDA、明确 IPO 时间表以及内化后收入
              run rate 均可获得时，才启动 BUY 建议。
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
          - type: callout
            title: Navan 的 IPO 经历是直接不利可比
            body: >-
              Navan 2025 年 10 月 IPO 以过去收入 13.8x 定价，首日下跌 20%，说明没有已证明盈利能力和持续增长，公开市场不会支撑 travel-tech 公司的高倍数。Hopper 的 $10B
              IPO 目标隐含的倍数，是 Navan 公开市场投资者即便在首日也拒绝支付的水平。这是 Hopper IPO 估值假设中最重要的单一不利信号。
            calloutType: insight
            claimRefs:
              - CV024
              - CV025
              - CV039
              - CV040
