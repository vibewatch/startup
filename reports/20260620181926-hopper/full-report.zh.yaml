      - number: '8.2'
        title: 可比公司集合与市场倍数
        blocks:
          - type: paragraph
            body: >-
              Hopper 在可比公司图谱中位置特殊：它同时是 OTA（消费端旅行预订）、B2B fintech-SaaS 平台（HTS）和市场平台。没有单一上市可比公司能完全映射。最相关的可比集合覆盖上市
              OTA（Booking Holdings、Expedia、Airbnb、MakeMyTrip、Trip.com）、一家可比 B2B travel-tech IPO（Navan，2025 年 10 月），以及整体
              OTA 行业中位数。

              截至 2026 年 6 月 18 日，Booking Holdings（BKNG）交易 P/S 为 4.81x，EV/EBITDA 为 13.10x，是优质大型 OTA 基准。Expedia（EXPE）的 P/S
              低得多，为 1.91x，EV/EBITDA 约 6.82x，反映增长较低和利润率压力。Airbnb（ABNB）P/S 为 6.68x，背后是更高利润率（净利润率约
              34%）和高于平均的增长。MakeMyTrip（MMYT）P/S 约 4.47x，EV/EBITDA 更高达 26.5x，反映高增长新兴市场溢价。Trip.com Group（TCOM）EV/revenue 约
              1.77x，EV/EBITDA 约 5.99x，符合成熟中国中心 OTA 的特征。这些同行的 OTA 行业 EV/revenue 中位数约为 2.4x。

              Navan（前 TripActions）提供了结构上最相关的 travel-tech IPO 基准。它于 2025 年 10 月以 $24-26/share 定价，估值 $6.45B，隐含约 13.8x 的过去
              12 个月收入（$613M）。但 Navan 股价首日下跌约 20%，说明公开市场不愿支撑发行中给出的 13.8x 收入倍数。该案例对 Hopper 直接不利：即便是一家收入同比增长 32% 的高增长 B2B
              travel-tech 公司，也立刻遭遇公开市场重估。Hopper 在 $5B 下隐含的 5.9x 收入倍数低于 Navan IPO 价格；但 Navan IPO 后倍数接近 10-11x。如果 Hopper
              面临类似重估，其 IPO 定价可能低于 $5B。Navan IPO 还披露，在 $6.45B 估值下，公司较 2022 年最后一轮私募估值 $9.2B 低约 30%，证明在高峰条件下设定的 travel-tech
              私募标记，IPO 时经常向下重置。
