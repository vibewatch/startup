    rows:
      - - OTA – 航班预订
        - 通过数字中介成交的机票总预订额
        - 航空公司官网直订；仅 GDS 的企业托管旅行
        - 休闲和商务旅客；航空公司（作为供应商）
        - 核心产品；价格预测形成差异化
      - - OTA – 住宿
        - 通过 OTA 完成的酒店、度假租赁和民宿共享总预订额
        - 酒店官网和 Airbnb 直订；线下旅行团套餐
        - 休闲旅客；酒店 / 房东供应商
        - 增长中的产品线（Hopper Homes）；超过 2M 套托管租赁
      - - 移动旅行预订
        - 在移动 App 上发起并完成的 OTA 预订
        - 移动网页和桌面 OTA 预订；App 辅助的桌面转化
        - 移动原生消费者、Gen Z 和 millennials
        - Hopper 的创始渠道；在线旅行流量 70.5% 来自移动端
      - - 旅行 Fintech 附加产品
        - 价格冻结、CFAR、行程中断保护、座位升级的消费者费用
        - 机票基础票价；酒店客房收入；通过受监管承保方销售的标准旅行保险保费
        - 结账时的个人旅客；愿付费细分人群
        - 利润率最高的收入流；约 50% Hopper 客户至少附加一个产品
      - - B2B 旅行基础设施（HTS）
        - API 授权费、白标平台费、来自航空 / 银行 / 酒店伙伴的 fintech 即服务收入
        - 航空公司内部 IT 自建；GDS 费用；伙伴的面向消费者平台收入
        - 航空公司、银行、忠诚度项目；企业采购
        - 约占 Hopper 全球收入 50%；B2B 平台市场 $2.2B，CAGR 8.2%
      - - 生成式 AI 行程规划
        - 面向旅行公司或消费者销售的 AI 驱动行程、推荐和支持工具
        - 传统搜索广告；元搜索点击费
        - 旅行公司作为 B2B 买方；懂技术的消费者作为 B2C
        - 早期但快速增长；2024 年市场 $2.2B，CAGR 21%
    notes: 支出定义因分析师而异；OTA 总预订额与 OTA 净收入的差别在于平台抽成率（通常 10–20%）。除非分析师明确计入附加总收入，否则旅行 fintech 通常不包含在 OTA 规模测算中。
