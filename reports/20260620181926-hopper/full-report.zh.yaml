      - number: '2.6'
        title: 旅行金融科技融合与 AI 变现机会
        blocks:
          - type: paragraph
            body: >-
              金融科技与旅行的融合，是市场中增长最高、利润率最高的机会。GrowthMarketReports 估算 2024 年全球旅行金融科技为 $13.2B，并在数字支付采用、保险产品、货币兑换和嵌入式借贷推动下，以
              16.7% CAGR 增长到 2033 年 $45.8B。HTS 自有产品套件——CFAR、Disruption Assistance、Price Freeze、Seat Upgrades 和 Cabin
              Upgrades——证明这一产品类别远超机票可退款性，已经延伸到出行当日服务。HTS 报告已在 180+ 个国家销售金融科技产品，并确认 2026 年与 Porter Airlines 和 Wizz Air
              合作。附加收入管理细分本身——航空公司用来优化非票务收入的定价引擎、附加商品销售和动态收益工具——由 Virtue Market Research 估算 2023 年价值 $919M，到 2030 年增长至
              $1.41B。Hopper 在 McKinsey CEO 访谈中描述了一个与全生态金融科技采用相关的 $400–600B “currently unrealized travel
              spend”估算；这是激进的公司来源预测，应视为方向性愿景，而非已验证市场规模。生成式 AI 正通过个性化行程策划、主动 disruption rebooking 和 upsell recommendation
              进入变现；Hopper 拥有每日 300 亿个价格点的数据集，有条件利用这些场景。Carlsquare TravelTech PDF 指出，整合 AI
              个性化的旅行公司已在行业中成为增长领导者，软件资产也获得更高估值。
