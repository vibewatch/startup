      - number: '6.5'
        title: 扩张驱动因素与集中度风险
        blocks:
          - type: paragraph
            body: >
              Hopper 对 HTS 的客户扩张策略同时沿地理和垂直方向推进。地理上，公司公开瞄准最多 30 个银行旅行合作全球市场；截至 2026 年，已确认布局美国、加拿大、巴西、澳大利亚、日本和韩国，RBC Avion
              Rewards 交易又把覆盖扩展到加拿大最大的忠诚度生态。垂直上，HTS 正从银行门户扩展到航空 fintech（CFAR、Disruption Assistance、Seat
              Upgrades）和消费科技平台嵌入（Tripadvisor、Uber），摆脱最初单一银行门户产品原型。

              截至 2026 年 6 月，主导性集中度风险是 Capital One 内包后的关系。2026 年 3 月前，Capital One 既是 Hopper 最大的托管平台客户，也是重要股东。转为 API-only
              后，收入流从价值更高的托管服务模式，重组为利润率更低的 API 调用量模式；Skift 报道称 Hopper 在这次转变中「失去了来自 Capital One 的大部分收入」。Hopper
              反驳了损失幅度，但没有公开确认绝对收入金额。由于 B2B 约占 Hopper 总收入 90%，且 Capital One 是最大 B2B 客户，即使收入只是部分下台阶，也足够重大。RBC 交易（2026 年 3
              月宣布）虽具战略意义，但它是从零爬坡的新关系，而非现有收入流。

              次级集中度风险是 Capital One 开创的「合作伙伴毕业」模式：从托管平台安排起步的企业合作伙伴，最终可能内包到 API-only；API 客户也可能最终把 API 能力完全内包。如果
              Nubank、Commonwealth Bank 或 RBC 在 2–4 年内走上类似路径，HTS 的托管平台收入可能结构性压缩，转向更纯粹、利润率更低的 API
              收入模式。航空公司合作伙伴带来更分散、集中度更低的风险，因为没有单一航空合作伙伴主导 HTS 收入，但航空 fintech 的 attach rate 和交易量比银行门户交易量更波动。

              扩张信号是正面的：RBC 交易取代 Expedia，成为加拿大最大忠诚度计划的技术底座；Nubank 门户触达 100M+ 巴西数字银行客户；2026 年航空合作伙伴名册扩展到 5+ 个已确认集成；HTS 以
              Gold Sponsor 身份参加 2026 年 6 月 APEX FTE EMEA，并宣布多个新合作伙伴。但大型银行合作销售周期很长（6–12+ 个月），业务必须先补上 Capital One
              托管收入流失，才能在新合作伙伴基础上证明稳定增长。
