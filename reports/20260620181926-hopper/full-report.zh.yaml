  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与优先级排序
        blocks:
          - type: paragraph
            body: >-
              本章按六个维度对 Hopper 重大风险排序：合作伙伴集中度、供应商与库存集中度、监管与法律敞口、Google 和既有 OTA 的竞争替代、旅行周期性与宏观敏感性，以及围绕盈利和 IPO
              交付的执行风险。每项风险按发生可能性、对投资论点的影响、缓释成熟度和剩余敞口评估。风险热力图（FR001）将每项风险映射到可能性-影响象限；概率与影响排序表（TR006）给出序位优先级及投资含义。最高优先级风险是合作伙伴集中度和盈利不确定性，两者都阻塞尽调，因为管理层没有公开量化
              Capital One 收入影响，也没有提供转型后期间的经审计财务。监管和 app 声誉风险具有结构性持续性，升级为执法或诉讼的概率中等。竞争和周期性风险内生于商业模式，B2B 收入多元化可部分缓释，但自
              COVID-19 以来没有披露外部冲击压力测试。每项风险的终止标准和监控触发器记录在缓释表（TR005）中。
