  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Hopper 的运营系统连接 AI 价格数据、消费者应用分发和 B2B 金融科技平台；Capital One 2026 年 3 月自建重组了该系统中最大的节点，如今成为核心尽调变量。
    data:
      nodes:
        - id: ai-engine
          label: AI 价格预测引擎
          detail: 核心 IP；分析数十亿个机票和酒店价格数据点，建议最佳购买时机。
          tone: positive
        - id: consumer-app
          label: 消费者旅游应用（B2C）
          detail: 100M+ 下载；机票、酒店、租车、民宿的直接预订渠道；也是产品测试沙盒。
          tone: positive
        - id: hopper-cloud
          label: Hopper Cloud B2B 平台
          detail: 白标 API 和金融科技模块（price freeze、CFAR、date flex）授权给航空公司、酒店和银行。
          tone: positive
        - id: b2b-partners
          label: B2B 合作伙伴网络
          detail: Air Canada、Expedia（2024 年 11 月续约）等；Capital One 自建后如今仅保留 API 合作。
          tone: warning
        - id: capital-one-api
          label: Capital One（仅 API，2026 年后）
          detail: 曾是最大的托管平台合作伙伴；2026 年 3 月将技术和约 150 名员工内化；现在只是纯 API 客户。
          tone: adverse
        - id: risks
          label: 集中度与反向风险
          detail: 单一合作伙伴收入集中；估值过期；裁员模式；BBB 消费者投诉。
          tone: adverse
      edges:
        - from: ai-engine
          to: consumer-app
        - from: ai-engine
          to: hopper-cloud
        - from: consumer-app
          to: hopper-cloud
        - from: hopper-cloud
          to: b2b-partners
        - from: b2b-partners
          to: capital-one-api
        - from: risks
          to: hopper-cloud
        - from: risks
          to: b2b-partners
