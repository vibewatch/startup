      - number: '7.2'
        title: 合作伙伴与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Capital One 转型后，Hopper 的 B2B 收入组合已约占总收入 90%，投资论点因此集中在少数大型企业关系上。Capital One 曾是单一最大的 B2B 合作伙伴：它以约 $3.5B 估值领投
              Hopper Series F，又在 2022 年 11 月以 $5B 估值追加 $96M；分析师称其代表了 HTS 托管平台收益的大部分。2026 年 3 月，Capital One 决定将 Hopper
              托管旅行平台内包，以 $96M 收购约 150 名员工、供应商关系和技术栈，Capital One 因此从 Hopper 最大托管平台收入来源转为 API-only
              客户。管理层尚未公开量化这一转型的收入影响，形成报告中最重大的尽调缺口。

              Capital One 之外，合作伙伴风险还延伸到库存供应。2023 年 7 月，Expedia 终止通过 Rapid API 向 Hopper
              提供酒店和度假租赁内容，理由是相关功能「利用消费者焦虑并混淆客户」。Hopper 反驳称这一举动反竞争，并表示其库存来自多源；据报道，Expedia 与 Hopper 到 2024
              年末恢复供应关系。终止与恢复的循环说明：大型库存合作伙伴可以短时间通知后撤出；Hopper 的 fintech 产品设计可能引发内容合作伙伴的对抗性回应，而这些合作伙伴也在 B2B
              旅行领域竞争；即便公开冲突结束，依赖关系仍然存在。HTS 目前服务银行、航空公司和 OTA 的 50+ 产品合作，但少数头部合作伙伴的收入集中度仍是主要论点风险。依赖图（FR003）可视化 Hopper
              的关键上下游关系。
