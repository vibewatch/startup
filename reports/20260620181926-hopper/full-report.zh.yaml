      - number: '3.2'
        title: 直接消费者挑战者：元搜索引擎和优惠提醒服务
        blocks:
          - type: paragraph
            body: >-
              Google Flights 是 Hopper 结构上最具颠覆性的竞争对手。作为嵌入全球最大发现入口的免费元搜索工具，Google Flights 不收预订费，把用户导向航空公司或 OTA，因此以零边际成本竞争
              Hopper 通过服务费（每笔 $5–$15）变现的同一意图时刻。Google Flights 在 2025 年加入“best time to book”预测，缩小了 Hopper 历史 USP
              之一。它的日历和灵活日期网格、支持最多七个出发机场的多城市搜索、经济舱筛选，都是 Hopper app 在网页端不具备的能力。没有电话支持、网页界面有限，是消费者经常针对 Hopper 提出的投诉，却不是针对
              Google Flights 的投诉。


              Kayak 属于 Booking Holdings，年收入估算 $234M–$600M，是强大的元搜索引擎，会扫描广泛 OTA，常常浮现更深折扣或特殊代码。Skyscanner 属于 Trip.com
              Group，是全球前五大旅行预订网站，产品 mobile-first 且经过 AI 增强。两项服务与 Google Flights 位置相近：它们把用户导向其他地方完成预订并收取 referral
              fees，金融科技附加产品（price freeze、CFAR、disruption products）在其供给中完全缺席。


              Going（原 Scott's Cheap Flights）采用订阅制优惠提醒模式，Premium 为 $49/年、Elite 为
              $199/年，筛选错误票价和折扣航线，并向订阅者发送提醒，随后用户直接向航空公司预订。Going 与 Hopper 的竞争重叠有限：Going
              不运营预订平台，不提供金融科技产品，目标是愿意让目的地来找自己的灵活淘便宜客群。报道的用户平均每张国际机票节省超过 $550，使 Going
              成为预算敏感旅客的有意义替代；但对于想锁定已知路线、担心时机的旅客，它不是替代。
