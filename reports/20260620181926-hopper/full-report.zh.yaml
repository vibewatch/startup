      - number: '2.3'
        title: 买方与细分市场图谱
        blocks:
          - type: paragraph
            body: >-
              Hopper 服务两个结构不同的买方层级——B2C 消费者和 B2B 企业合作伙伴——经济模型有重叠但不相同。B2C 侧的核心客群是价格敏感的休闲旅客，主要是 Gen Z 和更年轻的千禧一代：Hopper 报告约
              70% 客户落在这一人群，McKinsey 的 CEO 访谈也确认了这一点。这些买方用应用获取票价时机智能、price freeze 和灵活取消；由于金融科技附加嵌入结账流程，他们的变现率高于传统 OTA
              用户。小企业和高频旅客是第二个 B2C 细分：他们更看重可靠性和 disruption protection，而非纯价格，也更可能加购 Disruption Assistance
              产品。国际和跨境旅客——在票价波动大的航线上预订长途行程——是第三个 B2C 细分，价格预测和 price freeze 在这里感知价值最高，付费意愿也最高。B2B 侧，Hopper Technology
              Solutions（HTS）面向航空公司、酒店、银行和忠诚度计划，这些客户想在自有渠道嵌入金融科技附加产品和旅行预订，又不想自建技术栈。Capital One Travel 是被引用的旗舰合作伙伴。B2B
              预算负责人通常是航空公司的附加收入负责人、数字产品 VP 或 Chief Commercial Officer；采购触发因素要么是附加收入收益下降，要么是新的 app/loyalty
              改版，或其他航司采用金融科技产品带来的竞争压力。根据 McKinsey CEO 访谈，B2B 细分目前贡献 Hopper 全球收入约 50%，2019 年为零。
