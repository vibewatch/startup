  - id: FE001
    title: Hopper 产品架构栈
    type: stack
    layout: wide
    summary: Hopper 的架构从数据基础设施底座一路延伸到 AI 预测引擎、消费者金融科技层和 B2B API 平台；消费者移动 app 将完整栈呈现给终端用户，HTS API 层则把同样能力开放给航空公司、银行和酒店伙伴。
    data:
      layers:
        - label: 数据基础设施
          modules:
            - 实时价格聚合（每天 1B+ 数据点）
            - 支付处理——PayPal/Braintree/Hyperwallet
            - GDS / NDC 航空数据馈送
            - PMS 合作伙伴馈送（Guesty、Rentals United）
        - label: AI 预测与智能引擎
          modules:
            - 机票价格预测（95% 准确率主张，1 年 horizon）
            - 酒店和租车价格预测
            - 买入 / 等待 / 锁价推荐生成
            - 推送通知触发引擎
        - label: 金融科技产品层
          modules:
            - Price Freeze（付费锁定当前票价）
            - Cancel for Any Reason——CFAR（航空与酒店）
            - 任意原因中断援助（DAFAR）
            - 座位升级
            - Carrot Cash 闭环会员货币
        - label: B2B / HTS API 平台
          modules:
            - HTS 金融科技附加 API（CFAR、Disruption、Upgrades）
            - HTS Stays（酒店交易）
            - HTS Cars（租车交易）
            - Travel Loyalty Portals（银行品牌）
            - HTS Assist——AI 服务代理（30+ 种语言）
        - label: 消费者移动端界面（B2C）
          modules:
            - iOS app（4.8/5，1.2M+ 评分）
            - Android app（4.6/5，149K 评论）
            - 彩色优惠日历
            - 关注与提醒通知
            - 机票、酒店、民宿、租车预订流程
    approximationNotes: 云计算提供商只能在 DNS 层确认为 Google Cloud；内部 ML 框架、数据库层和 CI/CD 工具未公开披露。架构层根据产品文档、API 参考和第三方报道推断。
    claimRefs:
      - CE001
      - CE003
      - CE014
      - CE026
  - id: FE002
    title: 消费者从关注到预订工作流
    type: flow
    layout: standard
    summary: Hopper 的消费者预订旅程把被动价格发现转化成可变现的决策漏斗：Watch 提醒和彩色日历推动考虑；Price Freeze、CFAR 和 Disruption Assistance 在转化和转化后阶段贡献增量收入。
    data:
      nodes:
        - id: search
          label: 搜索目的地和日期
          detail: 用户在移动 app 输入出发地、目的地和日期
        - id: calendar
          label: 查看彩色价格日历
          detail: 以绿色（便宜）到红色（昂贵）展示日期价格；突出最便宜日期
        - id: prediction
          label: 接收买入 / 等待建议
          detail: AI 引擎输出立即购买或等待 X 天建议，并附置信度信号
        - id: watch
          label: 点击 Watch（设置价格提醒）
          detail: 用户同意在价格达到预测低点时接收推送通知
        - id: notification
          label: 接收优惠通知
          detail: 模型检测到最佳购买窗口时触发推送提醒
        - id: freeze
          label: 可选：Price Freeze（收费）
          detail: 在指定期间锁定当前价格；任何涨价由 Hopper 承担
        - id: fintech
          label: 可选：添加 CFAR / Disruption
          detail: 结账时一键添加金融科技产品；Hopper 披露附加率 >50%
        - id: book
          label: 完成预订（app 内）
          detail: 通过 PayPal/Braintree/已保存银行卡付款；app 内确认
        - id: post
          label: 预订后：管理 / 理赔
          detail: app 内行程管理；CFAR 或 Disruption 理赔从这里发起
      edges:
        - from: search
