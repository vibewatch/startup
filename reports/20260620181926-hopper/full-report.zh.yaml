      - number: '7.3'
        title: 供应商与库存集中度风险
        blocks:
          - type: paragraph
            body: >-
              Hopper 的消费端市场平台和 HTS B2B 平台，离不开持续稳定的航班和酒店库存。库存来源混合了 GDS 网络、航空公司直连、NDC feeds 和第三方 API 聚合商。三家 GDS
              供应商——Amadeus、Sabre 和 Travelport——合计控制全球 GDS 市场约 65%，因此对 Hopper 等 OTA 拥有很强的定价和合同议价权。GDS
              供应商锁定会带来脆弱性：费用上涨、技术中断或合同重谈，都可能在切换准备时间很短的情况下，直接影响库存深度和价格竞争力。

              IATA 的 NDC（New Distribution Capability）计划进一步放大了这项暴露。航空公司越来越多把最优票价和附加产品放到直连或 NDC API，而不是传统 GDS 渠道。OTA 如果
              NDC 集成推进太慢，就可能拿不到有竞争力的库存，进而削弱 Hopper 最核心的消费端差异化——价格预测价值主张。Hopper 的酒店库存很大程度上靠 Expedia 的 Rapid API 搭建；2023
              年合作终止时，该 API 提供超过 700,000 家住宿资源，另有 SiteMinder、Evolve 等直连合作。2023 年 Expedia 终止合作，一度抽走一项主要供给来源；虽然 Hopper
              称多源策略会避免影响消费者，但后续恢复合作说明这项依赖并未消失。对 HTS B2B 伙伴而言，Hopper 的内容广度和定价准确性就是核心产品承诺；库存获取能力一旦下滑，伙伴满意度和续约留存都会直接受影响。
