  - id: TP004
    title: 护城河耐久性与竞争风险登记表
    columns:
      - 护城河主张
      - 主要威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - AI 价格预测数据护城河（专有票价历史 + ML 模型）
        - Google Flights 2025 年免费加入预订时机预测；Kayak 有类似提醒
        - 中 — Google 的模型是聚合模型，不到航线粒度；Hopper 仍更细
        - 验证 Hopper 的 ML 在航线层面对比 Google 是否仍有可持续的准确率优势
      - - Carrot Cash 闭环忠诚度锁定
        - 如果竞争对手给出更低总价，用户可以放弃 Carrot Cash 余额
        - 低-中 — 转换成本存在但不高（风险敞口为 1–5% 返现价值）
        - 评估 Carrot Cash 余额分布和兑换率；量化余额用尽后的流失
      - - HTS 白标平台粘性（多年期企业合同）
        - 足够大体量的合作伙伴可以把技术内化（Capital One 先例，2026 年 3 月）
        - 高 — Capital One 技术收购（$96M）证明最大合作伙伴有能力后可以退出
        - 确认合同排他条款、最低收入保证和数据可携带限制
      - - HTS 金融科技附加利润率优势（合作伙伴渠道利润率 60%；复购率 84%）
        - 在位 OTA（Expedia、Booking）自建金融科技产品；保险市场也有替代方案
        - 中 — 尚无 OTA 在全球规模上追平 HTS 金融科技；风险窗口在 2–4 年
        - 跟踪 Expedia Partner Solutions 与 Booking B2B 的金融科技产品发布；索取 HTS 利润率趋势
      - - 移动优先 UX 与 Gen Z / 千禧一代获客优势
        - Google Flights 移动端体验差距缩小；Booking 和 Expedia 加码移动 UX
        - 低-中 — Hopper 原生应用体验仍领先，但优势在收窄
        - 按季度复盘应用商店评分；用 A/B 测试数据对标 Google Flights 移动 UX
      - - HTS 网络效应（合作伙伴数据飞轮 → 更好的金融科技定价 → 更多合作伙伴）
        - 合作伙伴转向自建后带来的数据可携带；监管限制与合作伙伴共享数据
        - 中 — 飞轮依赖合作伙伴贡献数据；大型合作伙伴退出会削弱信号质量
        - 索取 HTS 与合作伙伴的数据共享条款，并评估单一合作伙伴数据流失下的韧性
      - - Google 作为免费流量守门人（控制元搜索漏斗）
        - Google 可以加深金融科技绑定，或直接推出预订功能，进一步绕开 OTA
        - 高 — Google 零费用模式在结构上压低 Hopper 消费者端变现
        - 监测 Google Flights 的直接预订测试；评估 Hopper 消费者 CAC 和 LTV 趋势
      - - 消费者信任缺口（Trustpilot 1.6/5；退款延迟；隐藏费用投诉）
        - 声誉受损限制消费者 DAU 增长，也削弱 HTS 对合作伙伴的品牌杠杆
        - 中 — 消费端信任问题会给新 HTS 银行合作伙伴招募带来摩擦
        - 要求 Hopper 在下一阶段尽调前披露 NPS、Trustpilot 趋势和退款解决率
    notes: 严重性评级（低 / 中 / 高）是基于实际威胁落地证据和竞争同质化程度作出的定性判断。Capital One 先例被列为高严重性，因为它已经发生，而不只是理论风险。
