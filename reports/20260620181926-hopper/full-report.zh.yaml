      - number: '3.5'
        title: Hopper Technology Solutions（HTS）：B2B 白标竞争位置
        blocks:
          - type: paragraph
            body: >-
              Hopper 将其 B2B 平台更名为 HTS（Hopper Technology Solutions），如今它已是公司主导收入流。HTS 是一套白标商业平台和 API
              套件，为全球银行、发卡机构、航空公司和生活方式品牌提供旅行预订、奖励与忠诚度、金融科技附加产品能力。截至 2026 年初，B2B 收入占 Hopper 总收入超过 90%，公司约 18 个月内从
              consumer-first 模式转为 enterprise-first 基础设施提供商。


              HTS 合作伙伴名单包括 Air Canada、Virgin Australia、Frontier、Uber、TripAdvisor、AirAsia Move、Nubank（Brazil）、Capital
              One、Commbank（Australia）、SMBC（Japan）、Lloyds Bank、Porter Airlines 和 Wizz Air。HTS 从不到 20 个产品合作增长到 2026 年初超过
              50 个，收入同比约增长 50%。平台通过银行合作伙伴服务 400M+ 信用卡客户，这些合作伙伴代表每年超过 $1.6T 的卡消费。金融科技产品（CFAR、Disruption Assistance）已在
              180+ 个国家销售，复购率 84%，合作伙伴渠道利润率 60%，成为 HTS 利润率最高、增长最快的产品线。HTS Assist 是生成式 AI 服务层，已在 SMBC 和 Lotte Card 上线，在实现
              concierge-quality 自动化的同时降低服务成本。


              2026 年 3 月 RBC Avion Rewards 交易——取代此前供应商 Expedia——证明 HTS 有能力赢下大型金融机构合同。不过，2026 年 3 月也带来反向信号：Capital One 以约
              $96M 收购 Hopper 的旅行技术、人才（约 150 名员工）和供应商关系，将其平台完全收归内部。Capital One 是 Hopper 第一个也是最大的 HTS 客户（2021 年投资）；失去它移除了
              Hopper 的旗舰 reference account 和一条可观收入流，同时制造出一个新的 B2B 竞争者 Capital One Travel（现在拥有独立移动应用）。


              Expedia 的 B2B 部门（连续 17+ 个季度双位数增长）和 Booking Holdings 整合后的 B2B 部门（把 Booking.com、Priceline 和 Agoda
              合作伙伴团队并入一个单元），构成 OTA 既有玩家对 HTS 银行和航空公司白标 mandate 的直接挑战。
