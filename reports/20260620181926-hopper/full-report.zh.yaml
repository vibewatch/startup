  - id: FV001
    title: 建议逻辑 — 指向 TRACK 的证据链
    type: flow
    layout: standard
    summary: 将 Hopper 的市场、产品、财务、风险和估值映射到 TRACK 建议的证据链。
    data:
      nodes:
        - id: market
          label: 市场：$761B OTA，7.4% CAGR — 规模大、在增长、韧性强
        - id: product
          label: 产品：AI 预测 + fintech 护城河 — 差异化，B2B 利润率 60%
        - id: financials
          label: 财务：收入 $850M，~90% 来自 B2B，EBITDA 声称未经审计 — 不透明
        - id: risks
          label: 风险：Capital One 内包、$5B 估值标记陈旧、两轮裁员 — 实质性
        - id: valuation
          label: 估值：收入倍数 5.9x — 高于 OTA 中位数 146%；无 IPO 时间表
        - id: rec
          label: 建议：TRACK — 论点强、价格紧、仍需尽调
    approximationNotes: 流程节点代表逻辑证据链，不是定量模型。箭头顺序表示从证据到判断的分析链条。
