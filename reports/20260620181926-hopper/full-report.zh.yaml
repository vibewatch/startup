            body: >-
              公开财务记录支持一条高增长收入曲线，也支持可信的 B2B 基础设施论点——HTS 确实在全球银行和航空公司中赢得企业合作——但资本充足性仍不透明，Capital One
              转型带来重大的近期收入风险。公司首次声称实现正 EBITDA，这是重要里程碑，但没有独立验证。消费者 app
              已是下滑中的漏斗，如今主要作为产品沙盒，而不是有意义的增长引擎。关键尽调阻塞项包括：（1）未披露毛利率、EBITDA 或账上现金数据；（2）$686.9M 与 $850M
              两个收入数字的构成冲突；（3）Capital One 从托管平台转为 API 的量化影响未知；（4）已签 HTS 合同的远期收入没有公开披露。投资者在作出资本决策前，必须拿到未经审计的管理账、Capital
              One API 收入年化基准、合作伙伴收入集中度分析，以及远期已签约预订储备。
