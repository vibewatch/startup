      - number: '5.2'
        title: 消费者产品组合
        blocks:
          - type: paragraph
            body: >-
              Hopper 的 B2C 界面覆盖四个垂类——Flights、Hotels、Homes（度假租赁）和 Car Rentals——全部通过移动优先 app 交付；租车几乎没有有效的桌面端预订能力。公司称，该 app
              在 iOS 和 Android 上累计下载超过 1 亿次；iOS 端 120 多万条评价给出 4.8/5 星，Android 端约 149,000 条评价给出 4.6 分。合作伙伴称，Gen Z
              和千禧一代旅客占用户基础的 70%。

              Hopper Homes 是为竞争 Airbnb 和 Vrbo 推出的度假租赁品类。它只接受整套房源（不接受共享空间），要求配备厨房和私人浴室；通过 Guesty 或 Rentals United
              等物业管理系统上架时，向房东收取 14% 佣金（未使用 PMS 时拆分为房东 3% / 住客最高 12%）。物业管理平台确认，Hopper Homes 与其他 OTA
              渠道之间可自动同步日历、价格和可订状态。Hopper Cars 则是纯市场聚合器：公司不持有车队，聚合大型和独立租车品牌报价，把价格预测模型用于租车窗口，并以小额费用提供 Price Freeze 选项。

              一个显著限制是：2026 年独立评测记录显示，Hopper app 内多城市机票预订无法正常使用，会把用户导向外部网站。这说明复杂行程上存在实质性的产品深度缺口。
