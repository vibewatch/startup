              Australia、Nubank Brazil、Lotte Card South Korea、SMCC Japan、Lloyds Bank UK、Uber、Tripadvisor 和 Marriott
              Vacation Clubs。通过银行合作伙伴，HTS 合计触达 4 亿多信用卡客户，对应年刷卡总额超过 $1.6T。Forbes 引述 Dakota Smith 的报道显示，B2B 平台收入同比约增长
              50%。商业模式基于交易和利润分成：Smith 称，「他们不赚钱，我们也不赚钱。」NuBank 的 NuViagens 由 HTS 端到端驱动，自 2024 年上线以来同比增长 550%。Marriott
              Vacation Clubs 部署 HTS 后，酒店使用量翻倍。RBC Avion Rewards 于 2026 年 3 月从 Expedia 转向 HTS，显示传统 OTA 供应商正被进一步替代。HTS
              已识别最多 30 个适合银行旅行合作的全球市场。HTS Assist 作为生成式 AI 服务层，已在多个客户处上线，并在内容和 fintech 之外带来新的收入线。
