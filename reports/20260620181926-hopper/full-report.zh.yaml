      - number: '2.2'
        title: 市场规模口径与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              OTA 市场规模估算会随范围和方法大幅分化，这些矛盾应被保留，而不是平均。GM Insights 按流经中介平台的总预订额定义，测算 2024 年全球 OTA 市场为 $253.2B，并以 7.9% CAGR 到
              2034 年增长至 $533.7B。DataHorizzon Research 使用更宽口径（包括元搜索、套餐游和相邻数字旅行商业），报告 2024 年为 $550B，并以 9.6% CAGR 到 2033
              年增长至 $1.25T。ResearchAndMarkets 又使用第三种范围，引用 2025 年约 $943B，暗示更宽的总交易额口径。数据期限和方法不一致很重要：投资人若不调范围直接比较这些数字，可能被 4x
              的 headline 差异误导。Phocuswright——普遍被视为可信度最高的独立旅行市场研究机构——提供了此处保留的唯一美国特定一级估算：2024 年美国 OTA 销售额达
              $108.5B，只有“温和同比增长”，并随着供应商直订份额上升出现平台期迹象。以 Hopper 2024 年 $7.5B 预订额推导的隐含 SAM，根据采用哪一种 TAM 估算，约占全球 OTA 量的
              3–6%；份额不大，但若金融科技附加率守住、B2B 授权放量，跑道仍然可观。旅行金融科技子市场同样区间很宽：GrowthMarketReports 测算 2024 年全球旅行金融科技为 $13.2B，而
              Marketintelo 估算 2025 年为 $21.4B；差异很可能来自定义（窄口径只计保障产品，宽口径包括数字支付、FX 和费用管理）。Market Research Future 测算旅行生成式 AI
              细分市场 2024 年为 $2.22B，并以 21.17% CAGR 增长到 2035 年 $18.39B。
