      - number: '7.4'
        title: 监管、法律与消费者保护风险
        blocks:
          - type: paragraph
            body: >-
              Hopper 的 CFAR（Cancel For Any Reason）、DAFAR 和 Price Freeze 产品，卡在旅行服务与保险监管的交叉地带。NAIC 于 2018 年 12 月通过 Travel
              Insurance Model Act；截至 2026 年 4 月，美国 38
              个州已立法采纳，确立了州级牌照、市场行为标准、保费税义务和消费者披露要求，适用于任何销售旅行保障计划的主体。任何公司在受监管州销售、招揽或谈判旅行保险，都必须在该辖区持有保险生产者牌照。2022–2024
              年，美国人在旅行保险上花费 $5.56 billion，较 2019 年增长 46%，说明该领域正受到更多监管关注。Hopper 在美国 50 个州的合规状态尚未公开确认；每新增一个 B2B
              分销伙伴、每进入一个地理市场，多州牌照负担都会加重。

              消费者保护执法风险正在州层面升温。FTC 仍在积极打击欺骗性做法，旅行和 fintech 均在范围内。California AG 于 2026 年 6 月成立 Affordability Response
              Team，明确盯住旅行和技术定价做法。New York 于 2026 年 6 月通过 One Fair Price Act，限制基于算法的个性化定价；Hopper 的动态 fintech
              产品定价正采用这类模式。Goodwin Law 的 2026 年 fintech 监管分析指出，州层面审查趋严，是提供类保险产品的非银行 fintech 公司面临的首要合规风险。2025–2026 年 CFPB
              执法范围缩小，短期内减轻了联邦压力；但州 AG 和 FTC 仍是消费者保护行动的活跃渠道。公开来源尚未确认针对 Hopper
              的诉讼，但有记录消费者投诉的数量和一致性，已经形成可支撑监管转介或集体诉讼提交的案底。监管风险登记表（TR001）和风险传导图（FR002）列出了具体风险路径。
