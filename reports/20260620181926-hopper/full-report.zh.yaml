      - number: '3.6'
        title: 护城河耐久性与竞争风险清单
        blocks:
          - type: paragraph
            body: >-
              Hopper 的竞争耐久性建立在三层相互复利的能力上：专有 AI 价格预测和行为数据、高利润率且高复购的金融科技附加产品，以及嵌入银行和航空公司忠诚度生态的 B2B 平台。这些层互相作用——金融科技收入资助 ML
              投资，ML 数据改善金融科技定价，B2B 规模又把数据摄取扩展到 400M+ 持卡人。


              最耐久的护城河是 HTS 的金融科技附加产品套件。CFAR 和 Disruption Assistance 在合作伙伴渠道实现 84% 复购率和 60% 利润率；截至 2026 年 6 月，没有既有 OTA
              能在全球规模提供类似产品。HTS 金融科技数据显示，84% 旅客认为预订时灵活性重要，60% 愿意为 CFAR 付费——确认需求是结构性的，不是可有可无。63% 旅客表示，如果品牌提供 premium
              disruption assistance，他们更可能预订。


              护城河耐久性的关键威胁包括：（1）大型 B2B 合作伙伴规模足够后把技术内化（Capital One 于 2026 年 3 月已经这样做）；（2）Google 免费元搜索侵蚀消费者变现经济性，降低 Hopper
              交叉销售金融科技的杠杆；（3）Expedia 的 B2B 部门积极争夺同一批银行和航空公司白标 mandate；（4）消费者应用的信任赤字限制喂养 ML 模型质量的数据飞轮。消费者 Trustpilot 评分
              1.6/5，是新消费市场品牌杠杆的实质负面信号。
