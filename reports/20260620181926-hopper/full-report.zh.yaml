            title: Capital One 退出证明 B2B 合作伙伴可以内化平台
            body: >-
              Capital One 于 2026 年 3 月以约 $96M 收购 Hopper 技术栈，不只是收入事件；它证明 HTS 能力最强、合作时间最长的伙伴一旦规模足够，就可以而且会把平台内化。从合作伙伴视角看，这为
              HTS 关系的价值设置了自然天花板，即便高价值合同也难以假设几十年留存。
