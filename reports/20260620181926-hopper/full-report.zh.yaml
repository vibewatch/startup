      - number: '6.2'
        title: B2B 企业客户名册——HTS 合作伙伴证据
        blocks:
          - type: paragraph
            body: >
              HTS（Hopper Technology Solutions）是 Hopper 的 B2B 部门，为银行、航空公司和消费科技平台提供旅行 fintech 基础设施。截至 2026 年 6 月，HTS
              公开确认已与全球 50 多个合作伙伴完成产品集成，分为三类：银行和信用卡忠诚度门户、航空公司 fintech 附加产品（Cancel for Any Reason 和 Disruption
              Assistance），以及消费科技平台嵌入（Tripadvisor、Uber）。

              最关键的银行门户客户包括 Capital One（创始标志性合作伙伴，2026 年 3 月内包后转为 API-only）、Royal Bank of Canada（2026 年 3 月签署新的长期协议，替代此前
              Avion Rewards Travel 的 Expedia 安排）、Nubank（巴西最大数字银行，拥有 100M+ 客户，2024 年起通过 NuViagens 市场门户上线），以及 Commonwealth
              Bank of Australia（2024 年起通过 CommBank app 面向 6M+ 符合条件客户上线）。Phocuswire 2024 年报道确认，日本（Sumitomo Mitsui Card
              Co. / SMCC）和韩国（Lotte Card）也有新增银行合作，使 HTS 在北美、拉美、亚太和欧洲均有确认布局。Dakota Smith 称，HTS 已识别最多 30
              个适合银行旅行合作的全球市场；报道当时，交易储备自「去年夏天以来一直在推进」（即 2024 年中）。

              航空公司侧，Air Canada 约自 2022 年以来一直是 HTS fintech 合作伙伴，在所有票价类型上提供 CFAR。WestJet 于 2026 年 6 月在 WestJet.com 和
              WestJet app 上线 HTS CFAR，提供 80% 和 100% 两档退款选项。Porter Airlines 于 2026 年上线 HTS Disruption Assistance（品牌名为
              Delay and Cancellation Assistance）。Wizz Air 成为首家部署 HTS Disruption Assistance 的欧洲航空公司。航空公司名册显示，HTS
              正从北美航司扩展到欧洲和低成本航司。Tripadvisor 于 2024 年 8 月上线由 HTS 驱动的 app 内酒店预订；Uber Flights（UK）自 2023 年以来由 HTS 驱动。

              上述具名部署均已投产，RBC Avion Rewards 门户是部分例外：它于 2026 年 3 月宣布，但描述为「今年晚些时候」上线。Capital One 关系已从全托管平台重组为 API-only
              安排，HTS 的运营角色下降，但保留数据和 fintech API 连接。HTS 称，通过其银行合作伙伴网络可触达超过 4 亿信用卡客户，且这些合作伙伴年刷卡总额超过 $1.6T。
