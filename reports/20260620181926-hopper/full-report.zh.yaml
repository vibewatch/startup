      - number: '5.4'
        title: B2B 平台——HTS Cloud、Commerce 与 AI 服务
        blocks:
          - type: paragraph
            body: >-
              Hopper Technology Solutions（HTS）是 Hopper 的 B2B 部门，2021 年推出。VentureBeat 报道及 Skift 引述 Hopper 总裁的说法显示，HTS
              目前约占 Hopper 总收入的 90%。HTS 产品套件由三大支柱组成：Fintech Ancillaries（面向航空公司和酒店的 CFAR、Disruption Assistance、Seat
              Upgrades）；E-commerce（HTS Stays 酒店商务、HTS Cars 租车商务、Travel Loyalty Portals）；以及 AI Solutions（HTS Assist）。

              HTS Assist 是最新、也最具战略意义的 HTS 产品。它于 2025 年推出，是一个全自动 AI 旅行服务代理，可以端到端处理预订、取消、改签、退款和 fintech
              产品使用，无需人工介入。VentureBeat 报道称，HTS Assist 用 1,600 万段真实旅行对话训练，并直接接入航空预订系统和酒店平台。它覆盖 200 多个市场、支持 30
              多种语言，合作伙伴实施需要六到八周，线上部署中已处理约 300 万次对话。HTS 报告的绩效指标（公司通过 VentureBeat 声称）包括：CSAT 达到人工坐席的 88% 水平、服务成本降低 65%、AI
              解决每次互动的平均成本为 $1.12、15% 的服务对话转化为追加购买。在一个合作伙伴部署中，当 AI 代理与人工支持处于同等入口时，约 70% 用户主动选择 AI 代理。

              已记录的 B2B 合作伙伴包括 Air Canada、Porter Airlines、Virgin Australia、Frontier Airlines、AirAsia
              Move、HSBC、SMBC（日本最大信用卡发行方）、Lotte Card、Nubank、Commonwealth Bank of Australia、Uber 和 Tripadvisor。HTS 的 B2B
              API 使用 RESTful 架构和 RSA-key 认证。api-dev.hoppercloud.net 开发者端点和公开 GitHub
              仓库（hopperteam/hopper-developer）均存在；但合作伙伴级 API 访问需要 HTS 批准和
              NDA，住宿分销开发者门户（developer.lodging-distribution-api.hopper.com）没有返回可提取内容，说明它可能位于认证门后。
