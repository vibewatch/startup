        title: HTS B2B 平台与合作伙伴经济性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年初，HTS 已为 50 多个产品合作提供旅行预订、忠诚度和 fintech 附加产品能力，一年前还不到 20 个。合作伙伴覆盖全球银行、航空公司和生活方式品牌：Air
