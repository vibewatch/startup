      - number: '1.2'
        title: 创始人、领导层与关键人风险
        blocks:
          - type: paragraph
            body: >
              Hopper 由 Fred Lalonde 和 Joost Ouwerkerk 联合创立。Lalonde 担任 CEO，是公司的公开门面和主要战略声音。他此前曾联合创办旅行点评和社区网站 IgoUgo，该网站于
              2007 年被 Rand McNally 收购；更早职业经历包括 Cossette Communications。Ouwerkerk 担任
              CTO，自公司创立以来一直在任。两位联合创始人是公开材料中持续出现的唯二具名高管；Hopper 的 CFO、COO 和其他 C-suite 成员身份未公开披露，这给任何治理或继任尽调留下了实质缺口。


              领导结构带来明显的关键人依赖。Lalonde 和 Ouwerkerk
              看起来同时把控公司战略方向、合作伙伴关系和技术路线图。外部资料缺少更广泛高管团队信息，意味着管理梯队厚度、继任规划和组织韧性仅靠公开来源无法评估。尽调应要求组织架构图，并访谈创始人之外的高级领导。注意，下方领导层表只覆盖公开记录最充分的人物；它明确是不完整的，需要用数据室材料补齐。
