evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-history-conflict
    missingEvidence: >-
      Official post-2022 financing chronology and a current cap-table summary that reconcile total raised, merger
      economics, and investor ownership.
    whyItMatters: >-
      Public profiles disagree on lifetime capital raised and on whether the 2022 round sits inside or outside the
      currently displayed totals.
    diligencePath: >-
      Request the latest board deck or investor summary showing all primary financings, secondary activity, and merger
      consideration mechanics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: >-
      Current executive roster, board composition, and any disclosed governance or sponsor-rights structure for the
      combined company.
    whyItMatters: >-
      Leadership concentration and governance rights determine whether integration execution depends on a narrow set of
      people and whether investors can force strategic outcomes.
    diligencePath: Request the org chart, board observer list, and governance documents used in current board meetings.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Current ownership percentages, liquidation preferences, debt facilities, and any PE sponsor control rights after
      the Salesloft combination.
    whyItMatters: >-
      Named investors alone do not show who controls the merged entity or how economics translate into common-equity
      value.
    diligencePath: >-
      Obtain the current capitalization table, merger closing memo, and any credit agreement or preferred-security
      schedule.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: snapshot kpi table comparability
    missingEvidence: >-
      Current merged-company ARR, revenue mix, margin, headcount split, customer overlap, and office footprint on a
      single comparable basis.
    whyItMatters: >-
      The public record mixes old standalone Clari metrics with merged-company commentary, which can overstate or
      understate true scale and efficiency.
    diligencePath: >-
      Request current operating metrics, an integration KPI pack, and customer or employee overlap analyses from
      management.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current third-party TAM or SAM split for revenue orchestration or forecasting software by buyer segment,
      geography, and deployment size.
    whyItMatters: >-
      Without an external segmentation baseline, the chapter can bound Clari's market with adoption and budget proxies
      but cannot convert them into a defendable serviceable-market estimate.
    diligencePath: >-
      Obtain current analyst-market-data or procurement benchmarks that isolate revenue forecasting or revenue
      orchestration spend by enterprise cohort.
    relatedQuestionRefs:
      - QM009
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-packaging
    missingEvidence: >-
      Recent post-merger quote data showing module bundles, seat minimums, and attach rates across Forecast, engagement,
      and retention workflows.
    whyItMatters: >-
      Packaging determines whether the broader product story expands monetizable SAM or simply increases the narrative
      scope around the same forecast buyer.
    diligencePath: >-
      Collect recent customer quotes, channel checks, or procurement records for merged-entity packaging and renewal
      behavior.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: post-sale-adoption
    missingEvidence: >-
      Current customer counts or usage mix for retain and post-sale workflows relative to core forecasting and
      engagement modules.
    whyItMatters: >-
      Public evidence suggests Clari wants to expand into retain and growth workflows, but without attach-rate evidence
      the chapter cannot tell whether that story meaningfully enlarges SOM today.
    diligencePath: >-
      Request module-level customer counts, product attach rates, or customer references that isolate renewal and
      expansion workflow adoption.
    relatedQuestionRefs:
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: post-merger-pricing
    missingEvidence: >-
      Current module-level net pricing, discounting, and attach-rate data across Clari Forecast, Copilot, and inherited
      Salesloft entitlements.
    whyItMatters: >-
      Public review ranges show that Clari is expensive, but they do not prove whether the merged bundle expands gross
      retention or simply raises seat cost.
    diligencePath: >-
      Request recent order forms, renewal quotes, and module attach-rate snapshots split between net-new and legacy
      customers.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
