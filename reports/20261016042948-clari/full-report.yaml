chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              The strongest current identity signal is company-issued rather than financial: Clari's official surfaces
              now frame the business as the combined Clari+Salesloft "Predictive Revenue System," with official copy
              emphasizing thousands of customers, trillions in managed revenue, and a workflow span that runs from
              pipeline and prospecting through sales engagement, forecasting, and customer retention. That makes the
              present reader-facing brand broader than the founder-era forecasting story. A third-party profile still
              anchors the legacy company to Sunnyvale and a 2013 founding year, but the same profile also shows how
              messy the public baseline has become after the merger: identity, scale, and website fields are no longer
              cleanly separated between old Clari and the combined entity.
            claimRefs:
              - CO001
              - CO002
              - CO003
