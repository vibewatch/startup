              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: Suite breadth increases switching cost, but the integration story still needs proof
        blocks:
          - type: paragraph
            body: >-
              Clari's moat argument is strongest when customers standardize on the merged suite: reviews and official
              materials together show coverage from forecasting and deal inspection through cadence execution and AI
              agents, which naturally raises process-switching cost once a revenue team adopts the full operating model.
              But the same evidence also shows why durability should not be overstated. Clari does not publish pricing,
              implementations are lengthy and RevOps-heavy, and adverse comparison sources say the product roadmap is
              still integrating overlapping acquisitions rather than already delivering one clean platform. The pool
              also does not provide direct win/loss, migration-churn, or post-merger attach-rate evidence, so the
              underwriting question is not whether Clari looks feature-rich, but whether breadth is translating into
              durable retention and rationalized bundle economics against Gong, Salesforce, HubSpot, and data-first
              adjacencies.
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-homing weakens simple one-vendor framing
            body: >-
              The clearest signal in the assigned pool is that many enterprise buyers do not replace Gong with Clari or
              vice versa. Docket's 40% overlap data point suggests Clari often wins the forecast-system-of-record layer
              while Gong keeps the conversation-intelligence budget.
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP016
          - type: callout
            title: Post-merger breadth is real, but product rationalization is still unproven
            body: >-
              The merged suite expands the moat narrative, yet adverse comparison sources still describe an in-progress
              roadmap, incomplete prior integrations, and unresolved questions about what a unified bundle actually
              looks like in production.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed monetization
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broad enterprise software monetization model rather than a simple point
              product. Clari's official surfaces describe one revenue orchestration platform spanning revenue data,
              forecasting, workflow automation, retention, and AI agents, while the Forecast page explicitly says the
              product is built for subscription and consumption revenue models. That supports a recurring-software
              thesis with module expansion, but not revenue recognition detail. Public pricing remains notably thin:
              ZoomInfo describes Clari as quote-based with no public pricing, and Docket's procurement synthesis
              estimates module pricing ranges rather than citing vendor list cards. The implication is that
              list-to-realized pricing, discounting, seat minimums, services attach, and module attach rates remain
              diligence asks instead of disclosed facts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
