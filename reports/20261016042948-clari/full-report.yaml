      - number: '1.2'
        title: Leadership transition and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a real leadership change even if governance detail is still thin. SiliconANGLE's
              2022 financing coverage quotes founder and then-CEO Andy Byrne, while merger-era comparison and commentary
              sources say Steve Cox became CEO of the combined Clari-Salesloft company. The higher-confidence takeaway
              is not that outside observers know the exact org chart, but that the business moved from founder-led
              standalone Clari toward sponsor-backed integration under a new chief executive. That raises classic
              key-person dependency around product consolidation, commercial packaging, and retention of the executive
              bench. The current board roster, sponsor governance rights, and any debt or credit layer are not visible
              in the assigned public pool.
            claimRefs:
