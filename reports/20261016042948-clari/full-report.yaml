      - number: '3.2'
        title: Buyers are paying for board-grade forecasting, not generic sales tooling
        blocks:
          - type: paragraph
            body: >-
              The consistent divide in the assigned evidence is buyer maturity. Several reviews say Clari pays off when
              the organization has at least roughly 50 reps and dedicated RevOps, and Docket narrows the best-fit
              profile further to CRO-led teams above roughly $100 million ARR that face board-level forecast scrutiny.
              In that context, Clari's edge versus Gong is not call intelligence breadth but forecast-system-of-record
              depth, while its edge versus Salesforce Einstein or HubSpot is deeper predictive modeling and board
              reporting at the cost of more integration and operating overhead. The multi-homing data point matters:
              Docket says 40% of Gong customers also buy Clari, which suggests many enterprise buyers do not view the
              products as interchangeable and are willing to pay for both when each solves a different layer of the
              revenue workflow.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP016
