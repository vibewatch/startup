        - Valuation can look full if the tracker-based 2026 step-up is real while economics stay opaque.
        - 'Best fits the current evidence mix: strong product proof, weak current transaction transparency.'
      - - Bear
        - >-
          Merger complexity, high total cost of ownership, and incomplete financial disclosure limit new investor
          appetite.
        - >-
          Returns compress if the next clean financing benchmark is flat to only modestly above the 2022 level or if
          preferences absorb upside that headline valuations suggest.
        - >-
          Down-round risk, churn from integration friction, and expensive deployments that narrow the addressable buyer
          set.
        - >-
          More likely if diligence uncovers weak retention, margin pressure, or cap-table terms unfavorable to common
          shareholders.
    notes: >-
      Scenarios are intentionally qualitative because the retained sources do not disclose enough current revenue,
      margin, cap-table, or transaction-term detail to justify a numerical fair-value range.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
