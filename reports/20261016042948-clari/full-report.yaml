      - number: '1.3'
        title: Capital history, scale signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Funding and scale are directionally positive but not publication-clean in the current public record.
              SiliconANGLE reported a $225 million January 2022 financing at a $2.6 billion valuation led by Blackstone
              with Silver Lake participating, which clearly establishes late-stage private backing. But newer profile
              pages conflict on both lifetime capital and current operating scale: StartupHub lists $271 million total
              funding and 646 employees, while NexChron says Clari has raised over $500 million. Merger commentary then
              shifts the denominator again by citing more than 5,000 customers and roughly $450 million ARR for the
              combined Clari-Salesloft entity. Those signals are useful for orientation, but they are not yet a reliable
              standalone or fully reconciled merged-company baseline.
