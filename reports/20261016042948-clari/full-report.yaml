  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Clari's public category claim is now broader than standalone forecasting. Official product pages describe
              a revenue orchestration platform that runs workflows across create, close, and retain, and the post-merger
              narrative adds sales engagement and AI-guided execution to that boundary. The credible market, however, is
              still narrower than "all GTM software." Independent reviews say Clari helps teams analyze and act on CRM,
              email, calendar, call, and engagement data, but it does not originate B2B contact data, buyer intent, or
              marketing demand. Included spend is therefore enterprise forecasting, pipeline inspection, cadence
              execution, and some retention/growth orchestration attached to RevOps; excluded adjacency includes
              prospect databases, ABM tooling, and CRM system-of-record replacement.
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The strongest public fit signal is a CRO-led enterprise sales organization with meaningful forecast
              complexity and a dedicated RevOps function. External reviews consistently describe long deal cycles,
              multi-quarter pipeline management, and the need for specialized operators who can own hierarchy design,
              data capture, and cadence governance. Docket's threshold of 100-plus reps, $100 million-plus ARR, and one
              to three full-time admins should be treated as a third-party heuristic rather than company guidance, but
              it aligns with Clari's own enterprise positioning and with the implementation effort reviewers describe.
              In practice, budget ownership appears to sit with the CRO or head of revenue operations, with sales
              productivity buyers joining when engagement modules are bundled into the motion.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.3'
        title: Public sizing lenses are adoption proxies, not a clean TAM stack
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports several adoption and budget lenses but not a clean, third-party TAM-SAM-SOM
              cut. The broadest comparable spend pool is Aviso's $149 billion CRM and ERP modernization framing, which
              is directionally useful but materially wider than Clari's real scope. The narrower lenses are stronger.
              Clari Forecast's 75,000-plus team footprint, ZoomInfo's 1,500-plus customer and $5 trillion
              revenue-managed claim for Clari, Docket's 5,000-organization and $10 trillion revenue-under-management
              claim for the merged entity, and the TEI study's large ROI and retained-growth outcomes when deployment
              works all support a sizable enterprise category. They still do not isolate serviceable share by geography,
              segment, or module mix, so they should be used as boundaries and penetration proxies rather than
              definitive market size.
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers exist, but timing and operating friction constrain near-term SAM
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are clear. Board-grade forecast accuracy, better revenue visibility, standardized execution
              cadences, and a post-merger promise to connect pre-close and post-sale workflows all make the category
              strategically relevant for enterprise buyers. The TEI study is supportive because it ties adoption to
              meaningful economics in retention and expansion, which is the kind of outcome that can justify enterprise
              software budgets. The limiting factors are equally important. Review sources repeatedly cite multi-week
              implementation, ongoing RevOps administration, and full-stack cost that only makes sense for larger
              organizations. They also describe a platform-unification story that is still unfolding, with "one company,
              one platform" positioned as a roadmap rather than a fully delivered state. That means Clari's narrative
              SAM is broadening faster than its publicly proven serviceable market depth.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real budget pool is RevOps and forecast accuracy, not data origination
            body: >-
              Clari can expand along the revenue-workflow stack, but the assigned evidence still places prospect data,
              intent, and top-of-funnel intelligence outside its native market boundary.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: callout
            title: Post-merger scope expansion is ahead of publicly proven unification
            body: >-
              The merger increases category breadth on paper, but public sources still describe the roadmap as
              in-progress, which limits how aggressively market expansion should be capitalized into near-term adoption
              assumptions.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans direct peers, incumbents, adjacencies, and status quo
        blocks:
          - type: paragraph
            body: >-
              Clari is not competing in one clean category. Official positioning says it is a revenue orchestration
              platform that unifies revenue data, insights, cadences, and AI agents, while multiple 2026 reviews
              describe the merged Clari-Salesloft offer as combining forecasting, pipeline inspection, conversation
              intelligence, and sales engagement in one stack. That makes Gong the clearest direct peer for buyers
              prioritizing conversation intelligence, Salesforce Einstein the most important incumbent substitute for
              Salesforce-native teams, HubSpot Sales Hub and Avoma the lighter-weight substitutes for smaller teams, and
              spreadsheets plus CRM-native workflow the status quo fallback. The adjacent threat is data-first GTM
              software: ZoomInfo argues that neither Clari nor Salesloft originates verified contact or intent data, so
              some buyers may keep Clari out of the core stack and instead pair other workflow tools with an upstream
              data vendor.
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP010
              - CP011
              - CP014
