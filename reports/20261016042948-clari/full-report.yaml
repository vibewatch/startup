  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Enterprise adoption flows from board-level forecast pain into wider revenue workflow usage.
    data:
      items:
        - label: Forecast credibility problem emerges
          detail: >-
            Enterprise revenue leaders look for a system that can replace fragmented spreadsheet forecasting and reveal
            pipeline risk early.
          actor: 'Primary buyers: CRO, RevOps, finance'
          channel: Direct enterprise sale
          touchpoints:
            - Board pressure for forecast accuracy
            - Multi-team revenue data fragmentation
        - label: RevOps-led evaluation
          detail: >-
            The practical buying motion assumes dedicated RevOps ownership, Salesforce readiness, and appetite for a
            significant implementation project.
          actor: 'Evaluation users: RevOps admins, revenue leadership'
          channel: Structured enterprise evaluation
          touchpoints:
            - Forecast hierarchy design
            - Integration and CRM hygiene review
        - label: Core forecast deployment
          detail: >-
            Forecast and pipeline inspection land first because they are the modules most consistently cited in customer
            proof and independent reviews.
          actor: 'Primary users: CRO, managers, reps'
          channel: Platform rollout
          touchpoints:
            - Forecast call workflow
            - Deal-risk inspection
        - label: Cross-functional revenue data spine
          detail: >-
            Official materials widen the user set to Sales, Marketing, Customer Success, RevOps, and Finance working
            from the same revenue context.
          actor: 'Expanded users: GTM and finance teams'
          channel: Unified platform adoption
          touchpoints:
            - Shared revenue context
            - Cross-team workflow governance
        - label: Retention and growth motion
          detail: >-
            Clari markets customer retention and growth as a later-stage workflow, but public evidence is thinner than
            for forecasting.
          actor: 'Later users: account teams and customer success'
          channel: Land-and-expand
          touchpoints:
            - Churn-risk monitoring
            - Expansion prioritization
        - label: Renewal decision and expansion ceiling
          detail: >-
            Durability depends on whether the customer can sustain admin overhead and prove value, which is where
            mid-market fit weakens most.
          actor: 'Renewal owner: revenue leadership'
          channel: Renewal / upsell
          touchpoints:
