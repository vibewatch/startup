              - CI004
              - CI008
              - CI013
      - number: '4.2'
        title: Public value and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence is much stronger on customer value messaging than on booked revenue. The SoftwareReviews
              profile shows solid renewal and cost-to-value sentiment, suggesting that users who complete implementation
              can see durable utility. Company-issued Forrester/Clari materials go much further, citing 398% ROI,
              sub-six-month payback, stronger renewal rates, and lower admin time in a composite enterprise study. Those
              figures are useful as commercial proof points, but they are not equivalent to Clari's own realized
              revenue, margins, or customer-retention disclosures. Financially, they support the idea that Clari sells
              into expensive enterprise pain points where forecast accuracy and retention lift can justify budget, while
              still leaving the current merged company's actual revenue scale and efficiency unverified.
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI013
      - number: '4.3'
        title: Cost structure and delivery-burden signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public warnings in the assigned pool concern implementation and operating burden.
              SoftwareReviews feedback says initial data integration requires effort and that Clari struggles when
              revenue moves through service-heavy amendments rather than classic deals. Default and Docket, both
              competitor-authored reviews, are directionally consistent that rollouts can take 8-16 weeks, require extra
              services or admin resources, and fit organizations with dedicated RevOps ownership. That points to a cost
              structure in which professional services, admin time, and change-management effort matter to realized
              gross margin and payback. Because Clari does not publish services mix, support ratios, CAC, payback, or
              gross margin in the assigned public record, those burden signals are best treated as underwriting risks
              rather than solved economics.
            claimRefs:
              - CI006
              - CI007
              - CI012
              - CI014
      - number: '4.4'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Historical financing is observable, current liquidity is not. SiliconANGLE reported Clari's January 2022
              $225 million round at a $2.6 billion valuation and said the company planned to add 300 employees, which
              demonstrates prior access to growth capital but says little about the merged Clari-Salesloft balance sheet
              in late 2026. Post-merger sources in this pool emphasize platform integration, AI positioning, and
              market-survey findings, not cash on hand, debt obligations, burn, or runway. As a result, the current
              capital-adequacy question is unresolved: the evidence supports strategic relevance and enterprise
              willingness to pay, but it does not establish whether the merged entity can self-fund integration, sustain
              services intensity, or avoid depending on future financing to reach a cleaner margin profile.
            claimRefs:
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong value messaging, weak financial disclosure
            body: >-
              The public record is rich in enterprise-value claims and poor in merged-company financial disclosure, so
              commercial relevance is easier to support than underwriting quality.
            calloutType: insight
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI013
          - type: callout
            title: Underwriting still turns on undisclosed merger economics
            body: >-
              Without current ARR, gross margin, retention by legacy customer base, and cash/runway data, the main risk
              is paying for integration ambition before seeing evidence of durable merged economics.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the platform actually delivers
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently describes Clari as a revenue-orchestration system, not a single forecast
              widget. The current product surface combines forecasting, pipeline inspection, conversation intelligence,
              and sales-engagement workflows in a shared operating layer for RevOps, sellers, and revenue leaders. The
              best-substantiated wedge remains Forecast plus pipeline visibility: official pages stress support for
              subscription and consumption models, while independent reviews still frame forecast quality and
              board-grade visibility as the reason enterprises buy. The post-merger broadened surface is real enough to
              map as modules, but buyers should still distinguish mature categories (forecasting and inspection) from
              newer orchestration narratives such as MCP-enabled external AI access and revenue agents.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE009
              - CE010
