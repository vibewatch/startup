  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public 2025-2026 evidence points to merger integration, data dependency, and enterprise-only operating load as the
      highest residual risks.
    data:
      columns:
        - label: Likelihood
          note: Assessed from the assigned public evidence rather than internal incident data.
        - label: Impact
          note: Impact on buyer value realization or investor downside if the risk crystallizes.
        - label: Mitigation maturity
          note: How explicit and evidence-backed current mitigations appear in the pool.
        - label: Residual exposure
          note: Residual severity after visible mitigations.
      rows:
        - label: Salesloft integration and roadmap overlap
          note: Forrester and 2026 review coverage identify unresolved integration questions.
          values:
            - label: High
              tone: high
              note: Multiple current sources still frame roadmap consolidation as incomplete.
            - label: High
              tone: high
              note: A bifurcated stack would affect product clarity, renewal confidence, and adoption.
            - label: Low-Med
              tone: warning
              note: No complete entitlement or migration map appears in the assigned evidence.
            - label: High
              tone: high
              note: Residual risk stays high until roadmap and contract boundary are verified.
        - label: CRM/data-quality dependency
          note: Independent and official sources both tie output quality to source-system discipline.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Medium
              tone: warning
              note: Mitigations exist, but they rely on buyer process discipline.
            - label: High
              tone: high
        - label: AI-output accuracy and human-review burden
          note: Public materials add AI-assisted workflows but stop short of autonomous trust.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: warning
              note: Human review remains part of the documented control model.
            - label: Med-High
              tone: risk
              note: Residual risk is elevated where buyers want automation to write back into systems.
        - label: Implementation and RevOps ownership load
          note: Current reviews frame sustained admin ownership as a prerequisite rather than an option.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Low-Med
              tone: warning
              note: The pool shows no evidence that the vendor absorbs this burden for lean teams.
            - label: High
              tone: high
        - label: Financial opacity of the merged entity
          note: Assigned evidence contains stale pre-merger financing but no current merged-company economics.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low
              tone: low
              note: Current mitigation is weak because the key numbers are absent.
            - label: High
              tone: high
        - label: Privacy, consent, and legal-control visibility gap
          note: The assigned pool lacks direct regulator, court, trust-center, or certification evidence.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low
              tone: low
              note: Visible mitigation cannot be validated from the assigned source set.
            - label: Med-High
              tone: risk
              note: Residual exposure stays elevated until primary compliance materials are reviewed.
