        title: Milestones and diligence-critical open issues
        blocks:
          - type: paragraph
            body: >-
              The milestone path is visible enough to anchor later chapters. Clari appears in public profiles as a
              2013-founded Sunnyvale company, raised multiple venture rounds through 2019, added a large financing in
              2022, acquired Groove in 2023 to deepen engagement coverage, announced a merger with Salesloft in August
              2025, and was described by 2026 comparison content as operating as one entity under Steve Cox after
              closing in December 2025. The harder diligence questions start after that milestone arc: public sources do
              not reconcile current funding totals, do not show the new control structure, and do not provide a
              supportable current view of merged-company revenue quality, margins, or headcount composition.
