              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: 买方购买的是董事会级预测，而非通用销售工具
        blocks:
          - type: paragraph
            body: >-
              指定证据中最一致的分界线是买方成熟度。多份评测称，组织至少拥有约 50 名销售和专职 RevOps 时，Clari 才更容易产生回报；Docket 又把最佳匹配画像进一步收窄为 ARR 约 $100
              million 以上、面临董事会级预测审查的 CRO 主导团队。Clari 相比 Gong 的优势不是对话智能更广，而是更深的预测系统记录能力；相比 Salesforce Einstein 或
              HubSpot，其优势是更深的预测建模和董事会报告，但代价是更多集成和运营负担。多头使用的数据点很关键：Docket 称 40% 的 Gong 客户也购买
              Clari，说明许多企业买方并不认为两者可以互换，而是愿意为收入工作流的不同环节同时付费。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP009
              - CP010
              - CP012
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: 套件覆盖面提高切换成本，但集成故事仍待证明
        blocks:
          - type: paragraph
            body: >-
              当客户采用合并套件并实现标准化时，Clari 的护城河论点最强：评测和官方材料合起来显示，其覆盖从预测和交易检查到节奏执行和 AI
              代理；收入团队一旦采用完整运营模式，流程切换成本自然会上升。但同一批证据也说明不应夸大持久性。Clari 不公布价格，实施周期长且高度依赖
              RevOps；不利的对比来源称，产品路线图仍在整合相互重叠的收购资产，而不是已经交付一套干净的平台。资料池也没有直接的胜负单、迁移流失或合并后附加率证据，因此投资判断不该只问 Clari
              功能是否丰富，而应问这种广度是否已经转化为对 Gong、Salesforce、HubSpot 和数据优先相邻产品的持久留存与合理套件经济性。
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 多头使用削弱了简单的单一供应商叙事
            body: 指定资料池中最清晰的信号是，许多企业买方并不会用 Clari 替代 Gong，反之亦然。Docket 的 40% 重叠数据表明，Clari 往往赢得预测系统记录这一层，而 Gong 保留对话智能预算。
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP016
          - type: callout
            title: 合并后的覆盖面是真实的，但产品收敛仍未验证
            body: 合并套件扩大了护城河叙事，但不利的对比来源仍称路线图在推进中，既有集成尚不完整，统一套件在生产环境中究竟如何呈现也仍未解决。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与已披露的变现方式
        blocks:
          - type: paragraph
            body: >-
              指定证据支持的是广泛的企业软件变现模式，而非简单的单点产品。Clari 官方页面将其描述为覆盖收入数据、预测、工作流自动化、留存和 AI 代理的一体化收入编排平台；Forecast
              页面明确称产品面向订阅和消费型收入模式。这支持经常性软件的判断并允许模块扩展，但不能说明收入确认细节。公开价格尤其有限：ZoomInfo 称 Clari 采用报价制且没有公开价格，Docket
              的采购汇总则估算模块价格区间，而不是引用供应商价目表。因此，牌价到实际成交价、折扣、席位最低数、服务附加率和模块附加率，都仍是尽调问题，而不是已披露事实。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
