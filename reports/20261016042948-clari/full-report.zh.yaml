      - CP014
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据显示，Clari 通过多模块企业软件平台变现，其现金回收取决于实施负担和实际定价。
    data:
      nodes:
        - id: data
          label: 收入数据采集
          detail: CRM、活动和收入背景数据被汇总进平台。
          claimRefs:
            - CI001
        - id: forecast
          label: 预测与检查
          detail: 预测和检查将这些信号转化为董事会级可见性和交易评分。
          claimRefs:
            - CI002
        - id: workflows
          label: 引导式工作流与 AI
          detail: 节奏、工作流和 AI 智能代理被定位为附加执行层。
          claimRefs:
            - CI001
            - CI012
        - id: buyer-value
          label: 客户价值证明
          detail: 续约意向、ROI 和预测准确度主张，是主要的公开价值代理。
          claimRefs:
            - CI005
            - CI008
            - CI009
        - id: contract
          label: 协商式企业合同
          detail: 公开来源显示采用报价销售，模块和实施情况存在差异。
          claimRefs:
            - CI003
            - CI004
        - id: margin
          label: 利润率与现金跑道不确定性
          detail: 实际定价、服务组合和现金消耗缺乏披露，因此毛利和现金跑道的投资判断仍无法确定。
          claimRefs:
            - CI007
            - CI013
            - CI014
      edges:
        - from: data
          to: forecast
          label: 背景信息改善预测
          claimRefs:
            - CI001
            - CI002
        - from: forecast
          to: workflows
          label: 洞察引导行动
          claimRefs:
            - CI001
            - CI012
        - from: workflows
          to: buyer-value
          label: 声称的 ROI 与续约提升
          claimRefs:
            - CI005
            - CI008
            - CI009
        - from: buyer-value
          to: contract
          label: 价值论证支撑企业预算
          claimRefs:
            - CI003
            - CI008
        - from: contract
          to: margin
          label: 实际经营数据取决于定价和服务负担
          claimRefs:
            - CI004
            - CI007
            - CI013
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI008
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据将 Clari 描绘为分层的收入控制平面：从源系统采集开始，集中背景信息，再把指导反馈到预测和执行工作流。
    data:
      layers:
        - label: 收入管理层成果
          items:
            - 预测会议
            - 管道检查
            - 续约 / 扩张可见性
          outputs:
            - 董事会级报告
            - 优先级风险管理
        - label: 一线与管理者工作流
          items:
            - 预测
            - 检查
            - Copilot
            - Salesloft / Groove
          outputs:
            - 任务与跟进
            - 引导式执行
        - label: 买方与客户协作
          items:
            - 共同行动计划
            - 续约 / 扩张工作流
            - 客户团队协调
          outputs:
            - 共享交易进展
            - 跨职能交接
        - label: AI 助手与编排
          items:
            - 收入智能代理
            - AI 助手
            - MCP Server
          outputs:
            - 下一步最佳行动指导
            - 外部 AI 工具访问
        - label: 共享收入背景
          items:
            - Revenue Context
            - RevDB / 时间序列模型
            - 统一信号解读
          outputs:
            - 预测与风险模型
            - 跨工作流背景
        - label: 源系统与信号
          items:
            - CRM
            - 电子邮件 / 日历
            - 通话 / 对话
            - 互动系统
          outputs:
            - 结构化与非结构化收入信号
    approximationNotes: 这是根据公开描述综合出的概念性运营技术栈，并非公开发布的内部技术图。
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业采用从董事会层面的预测痛点开始，逐步扩展到更广泛的收入工作流使用。
    data:
      items:
        - label: 预测可信度问题出现
          detail: 企业收入负责人寻找能够替代零散电子表格预测、及早揭示管道风险的系统。
          actor: 主要买方：CRO、RevOps、财务
          channel: 直接企业销售
          touchpoints:
            - 董事会对预测准确度施压
            - 多团队收入数据碎片化
        - label: RevOps 主导评估
          detail: 实际采购动作以专职 RevOps 负责、Salesforce 准备就绪，以及愿意投入大型实施项目为前提。
          actor: 评估用户：RevOps 管理员、收入管理层
          channel: 结构化企业评估
          touchpoints:
            - 预测层级设计
            - 整合与 CRM 数据卫生检查
        - label: 核心预测部署
          detail: 预测和管道检查最先落地，因为客户证明和独立评测最一致地提到这两个模块。
          actor: 主要用户：CRO、管理者、销售代表
          channel: 平台部署
          touchpoints:
            - 预测会议工作流
            - 交易风险检查
        - label: 跨职能收入数据主干
          detail: 官方材料将用户范围扩展到销售、市场、客户成功、RevOps 和财务，共享同一收入背景。
          actor: 扩展用户：GTM 与财务团队
          channel: 统一平台采用
          touchpoints:
            - 共享收入背景
            - 跨团队工作流治理
        - label: 留存与增长动作
          detail: Clari 将客户留存和增长作为后期工作流营销，但公开证据比预测方面更薄弱。
          actor: 后续用户：客户团队与客户成功
          channel: 落地并扩张
          touchpoints:
            - 流失风险监控
            - 扩张优先级排序
        - label: 续约决策与扩张上限
          detail: 能否持续取决于客户是否能承担管理开销并证明价值；中端市场匹配度在这里最弱。
          actor: 续约负责人：收入管理层
          channel: 续约 / 加售
          touchpoints:
            - 年度平台预算审查
            - RevOps 能力与实施回报
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 2025-2026 年公开证据指向合并整合、数据依赖和仅适用于企业的运营负担是最高的剩余风险。
    data:
      columns:
        - label: 可能性
          note: 根据指定公开证据评估，而非内部事故数据。
        - label: 影响
          note: 风险兑现后对买方价值实现或投资者下行空间的影响。
        - label: 缓释成熟度
          note: 证据池中的当前缓释措施有多明确、证据有多充分。
        - label: 剩余风险敞口
          note: 可见缓释措施后的剩余严重程度。
      rows:
        - label: Salesloft 整合与路线图重叠
          note: Forrester 和 2026 年评测都指出整合问题尚未解决。
          values:
            - label: 高
              tone: high
              note: 多个当前来源仍认为路线图整合尚未完成。
            - label: 高
              tone: high
              note: 分裂的技术栈会影响产品清晰度、续约信心和采用度。
            - label: 低-中
              tone: warning
              note: 指定证据中没有完整的权益或迁移图。
            - label: 高
              tone: high
              note: 在路线图和合同边界得到验证前，剩余风险仍然较高。
        - label: CRM / 数据质量依赖
          note: 独立来源和官方来源都将输出质量与源系统纪律联系起来。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: warning
              note: 存在缓释措施，但依赖买方流程纪律。
            - label: 高
              tone: high
        - label: AI 输出准确度与人工审核负担
          note: 公开材料增加了 AI 辅助工作流，但没有达到可自主信任的程度。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: warning
              note: 人工审核仍是已记录控制模型的一部分。
            - label: 中-高
              tone: risk
              note: 在买方希望自动化回写系统的场景，剩余风险更高。
        - label: 实施与 RevOps 负责负担
          note: 当前评测将持续的管理责任视为前提，而非可选项。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低-中
              tone: warning
              note: 证据池没有显示厂商会替精简团队承担这项负担。
            - label: 高
              tone: high
        - label: 合并实体的财务不透明
          note: 指定证据包含过时的合并前融资信息，但没有当前合并后公司的经营数据。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
              note: 关键数字缺失，因此当前缓释措施很弱。
            - label: 高
              tone: high
        - label: 隐私、同意与法律控制可见性缺口
          note: 指定证据池缺乏监管机构、法院、信任中心或认证的直接证据。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
              note: 无法用指定来源集验证可见缓释措施。
            - label: 中-高
              tone: risk
              note: 在审阅一手合规材料前，剩余风险敞口仍然偏高。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR006
      - CR008
      - CR009
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 价格支撑落后于产品证明，因此建议仍为继续研究。
    data:
      nodes:
        - label: 市场需求存在
          summary: Revenue-data fragmentation and missed targets make the problem category durable.
        - label: 产品证明真实
          summary: Forecast accuracy and pipeline inspection remain the most repeated proof points.
        - label: 企业匹配度窄
          summary: The value case is strongest for large organizations with dedicated RevOps capacity.
        - label: 成本负担高
          summary: Implementation, services, and per-seat spend can erase returns outside the core ICP.
        - label: 价格发现弱
          summary: The last hard benchmark is 2022, while the visible 2026 step-up is tracker-based.
        - label: 建议仍为继续研究
          summary: Need fresh financing terms and combined operating-quality disclosure before a buy call.
      edges:
        - from: Market need exists
          to: Product proof is real
          label: 支持采用
        - from: Product proof is real
          to: Enterprise fit is narrow
          label: 但集中于 ICP
        - from: Enterprise fit is narrow
          to: Cost burden is high
          label: 缩小买方池
        - from: Cost burden is high
          to: Price discovery is weak
          label: 提高投资判断门槛
        - from: Price discovery is weak
          to: Recommendation stays research-more
          label: 阻止正面判断
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV012
