      - number: '4.2'
        title: 公开价值与销售效率代理
        blocks:
          - type: paragraph
            body: >-
              公开证据对客户价值叙事的支持远强于对已入账收入的支持。SoftwareReviews 资料显示续约和成本价值感受良好，说明完成实施的用户能够获得持久效用。Forrester/Clari
              发布的公司材料走得更远，在一项综合企业研究中引用了 398% ROI、不到六个月的回本期、更高续约率和更低管理员工时。这些数字可作为商业证明点，但不等于 Clari
              自身实现的收入、利润率或客户留存披露。从财务角度看，它们支持这样的判断：Clari 销售的是昂贵的企业痛点解决方案，预测准确度和留存提升可以支撑预算；但合并公司当前的实际收入规模和效率仍未得到验证。
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI015
