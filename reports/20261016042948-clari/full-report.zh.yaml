      - number: '8.4'
        title: 最终尽调问题与投资论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              积极建议需要的是资料池中缺失的新证据，而不是对同一批事实作另一种解释。关键问题包括当前融资文件或清晰的二级市场价格标记、合并实体的留存和利润率披露，以及证明 Clari-Salesloft
              整合正在减少而非增加产品重叠和运营复杂度的材料。在此之前，如果新一轮融资只比过时的 2022 年基准略高定价，如果实施拖累使 ROI
              仅限于狭窄的大型企业群体，或如果合并后执行在对话智能和工作流深度上仍落后于专业竞争者，投资论点就会失效。
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: >-
              Clari 对大型企业收入团队具有战略相关性，也可能很有价值，但资料池中的公开证据不足以支持在未明确的 2026
              年入场价格下买入。除非尽调发现最新融资条款、更干净的合并财务质量，以及合并执行正在改善而非侵蚀客户经济性，否则应将其列为继续研究。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV009
              - CV010
