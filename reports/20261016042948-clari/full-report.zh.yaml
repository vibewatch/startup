            body: >
              法律和治理图景的显著之处，与其说是已被公开证明的故障，不如说是清晰可见的控制依赖。Clari 自身的价值主张依靠跨系统捕获收入数据和信号，而独立评测反复警告，脏 CRM
              数据、阶段不一致或系统变更失去协调都会降低输出质量。AI 工作流也有同样问题：公开材料描述了 AI 引导的 CRM 建议、Smart Deal Summaries
              和预测性推荐，同时警告输出可能不准确，通话捕获还取决于同意、会议和管理员设置。实际上，买方不能把平台当作自主收入基础设施；尽调门槛应包括录音同意控制、数据治理责任、模型例外处理，以及 AI
              或集成层误判管道风险时的错误责任分配。
