  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的支出
        blocks:
          - type: paragraph
            body: >-
              Clari 公开宣称的品类如今已不止独立预测。官方产品页面将其描述为贯穿创建、成交和留存的收入编排平台，合并后的叙事又把销售互动和 AI 引导的执行纳入边界。不过，可信市场仍窄于“全部 GTM 软件”。独立评测称
              Clari 帮助团队分析并使用 CRM、邮件、日历、通话和互动数据，但不生成 B2B 联系人数据、买方意向或营销需求。因此，纳入的支出是服务 RevOps
              的企业预测、管道检查、节奏执行以及部分留存和增长编排；相邻但排除的领域包括潜客数据库、ABM 工具和 CRM 系统记录替代品。
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最强的公开匹配信号是由 CRO 主导、预测复杂度高且设有专职 RevOps
              团队的企业销售组织。外部评测一致提到较长的成交周期、跨多个季度的管道管理，以及需要专门运营人员负责层级设计、数据采集和节奏治理。Docket 提出的 100+ 名销售、$100 million+ ARR 和
              1–3 名全职管理员，应视为第三方经验法则而非公司指引，但它与 Clari 的企业定位以及评测者描述的实施投入相吻合。实际上，预算似乎由 CRO
              或收入运营负责人掌握；当销售互动模块被打包进来时，销售生产力负责人也会参与采购。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.3'
        title: 公开规模视角是采用代理，而不是干净的 TAM 分层
        blocks:
          - type: paragraph
            body: >-
              指定证据支持多个采用和预算视角，但不足以形成干净的第三方 TAM-SAM-SOM 切分。最宽泛的可比支出池是 Aviso 对 $149 billion CRM 和 ERP
              现代化市场的定义，方向上有参考价值，却明显宽于 Clari 的真实范围。较窄的视角更有用：Clari Forecast 覆盖 75,000+ 团队，ZoomInfo 声称 Clari 拥有 1,500+
              客户并管理 $5 trillion 收入，Docket 声称合并实体覆盖 5,000 个组织和 $10 trillion 的受管理收入，TEI 研究则显示部署顺利时可带来显著 ROI
              和留存增长。这些数字仍没有按地区、客户细分或模块组合拆出可服务份额，因此应作为边界和渗透率代理，而非确定的市场规模。
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动因素存在，但时点和运营摩擦限制近期 SAM
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素很明确：董事会级预测准确度、更好的收入可见性、标准化执行节奏，以及合并后连接售前和售后工作流的承诺，都让这一品类对企业买方具有战略意义。TEI
              研究之所以有支持作用，是因为它把采用与留存和扩张带来的实际经济收益联系起来，这类结果足以支撑企业软件预算。限制因素同样重要。评测来源反复提到数周级实施、持续的 RevOps
              管理，以及只有大型组织才承受得起的全栈成本。它们还描述了仍在展开的平台统一故事，“一家公司、一个平台”目前更像路线图，而非已经交付的状态。由此可见，Clari 的叙事 SAM
              扩张速度快于公开证据所证明的可服务市场深度。
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 真正的预算池是 RevOps 和预测准确度，而非数据生成
            body: Clari 可以沿收入工作流栈扩张，但指定证据仍把潜客数据、意向信号和漏斗顶部智能排除在其原生市场边界之外。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: callout
            title: 合并后的范围扩张领先于公开验证的统一程度
            body: 合并在纸面上扩大了品类边界，但公开资料仍把路线图描述为进行中，因此不宜把市场扩张过度计入近期采用假设。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境横跨直接同业、既有厂商、相邻产品和现状方案
        blocks:
          - type: paragraph
            body: >-
              Clari 并不只在一个清晰品类中竞争。官方定位称其为统一收入数据、洞察、节奏和 AI 代理的收入编排平台；多份 2026 年评测则把合并后的 Clari-Salesloft
              描述为在一套技术栈中结合预测、管道检查、对话智能和销售互动。由此，Gong 是最清晰的直接同业，适合重视对话智能的买方；Salesforce Einstein 是 Salesforce
              原生团队最重要的既有替代方案；HubSpot Sales Hub 和 Avoma 是小团队的轻量替代品；电子表格加 CRM 原生工作流则是维持现状的后备方案。相邻威胁来自数据优先的 GTM 软件：ZoomInfo
              认为 Clari 和 Salesloft 都不生成经过验证的联系人或意向数据，因此部分买方可能把 Clari 排除在核心技术栈之外，转而用其他工作流工具搭配上游数据供应商。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
