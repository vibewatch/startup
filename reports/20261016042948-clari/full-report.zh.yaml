        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              当前最强的身份信号来自公司自身，而非财务资料：Clari 官方页面如今把业务描述为合并后的 Clari+Salesloft “Predictive Revenue
              System”，并强调数千家客户、数万亿美元管理收入，以及从管道和获客到销售互动、预测和客户留存的工作流覆盖。这说明面向读者的当前品牌已经比创始人时期的预测故事更宽。某第三方资料仍将旧 Clari 定位为总部位于
              Sunnyvale、2013 年成立的公司，但同一资料也暴露出合并后的公开基线有多混乱：旧 Clari 与合并实体的身份、规模和网站字段已无法干净区分。
