              - CV008
              - CV009
              - CV011
      - number: '8.3'
        title: 看多、基准与看空纪律
        blocks:
          - type: paragraph
            body: >-
              当前资料集缺少经审计的合并收入质量、股权结构细节和独立验证的 2026 年交易条款，因此情景分析只能保持方向性，不能假装精确。乐观情景要求证明合并后的规模和工作流整合足以让估值较 2022 年基准上升，并且
              Clari 的企业 ROI
              主张经得起独立尽调。基准情景假定公司具有战略相关性，但在新条款、利润率和留存数据披露前，估值处于合理到充分水平。悲观情景是成本、整合摩擦和价格发现不足导致下轮融资风险，或普通股回报达不到风险投资的承销门槛。
            claimRefs:
              - CV001
