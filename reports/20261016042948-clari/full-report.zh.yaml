  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Clari-Salesloft 的整合改善交叉销售，预测准确度继续保持差异化，新的财务披露验证当前规模。
        - 只有披露的 2026 年条款和合并利润率证明产品价值能规模化为持久现金经济，才有理由相对 2022 年基准溢价。
        - 执行仍需跑赢对话智能专业厂商，同时把实施负担控制在可承受范围内。
        - 需要独立披露的融资条款，以及本证据池中尚不存在的客户留存和利润率证据。
      - - 基准
        - Clari 对大型企业仍具战略重要性，但公开证据对价格和经营质量的判断仍不一致。
        - 最可能的结果是保持观察并继续尽调：公司具备战略相关性，但价格支撑不足以给出正面的投资判断。
        - 如果追踪器显示的 2026 年上调属实、但经营数据仍不透明，估值可能显得偏贵。
        - 最符合当前证据组合：产品证明强，但当前交易透明度弱。
      - - 悲观
        - 合并复杂度、较高的总拥有成本和不完整的财务披露，都会限制新投资者的兴趣。
        - 如果下一轮清晰的融资基准持平于 2022 年水平、仅略高于该水平，或优先权条款吞噬表面估值暗示的上行空间，回报会被压缩。
        - 下轮融资风险、整合摩擦导致的流失，以及昂贵部署带来的可触达买方范围收窄。
        - 如果尽调发现留存疲弱、利润率承压，或资本结构条款不利于普通股股东，这一情景更可能发生。
    notes: 情景刻意保持定性，因为保留来源未披露足够的当前收入、利润率、资本结构或交易条款细节，无法支撑数值化的公允价值区间。
