  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >
              指定证据确立的最高严重性风险是合并后执行；资料池缺少监管机构、法院和事故记录，无法判断是否存在独立的法律或执法问题。Forrester 明确把 Clari-Salesloft
              组合描述为高风险、高回报，并指出产品重叠、用户体验取舍和未解决的 AI 差异化问题。这很重要，因为 Clari 同时在扩大平台覆盖面：统一预测、互动、对话智能、工作流自动化和 AI
              引导的执行，都增加了必须保持一致的系统、团队和合同边界数量，产品承诺才能成立。编排顺利时公司可能很有价值，但投资判断必须把整合、治理和采用当作一等尽调事项，而不能假设合并技术栈已经稳定。
            claimRefs:
              - CR001
