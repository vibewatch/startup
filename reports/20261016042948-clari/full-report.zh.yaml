      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资的正面论点很直接：Clari
              似乎仍是最强的企业预测和管道检查平台之一，公司控制的材料与独立评测都持续把预测准确度、续约提升和董事会级工作流价值列为大型收入团队付费的原因。反论点同样清楚：这些收益似乎集中在拥有专职 RevOps
              能力的大型组织，而实施投入、六位数年度承诺以及合并后的产品整合问题，限制了在证据不完整时为溢价倍数进行投资判断的空间。换句话说，这可能是一家优质公司，但仅凭公开记录还不是一个优质入场点。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
