              如果尽调显示预测质量依赖大量人工清理，Salesloft 合并后重要的销售互动或对话智能功能在合同或技术上仍然割裂，或者买方没有足够带宽、能够负责运营平台的 RevOps
              负责人，那么投资论点就应失效。第二个退出标准是财务不透明：指定资料池仍未披露合并实体的烧钱、毛利率、优先股堆叠或普通股经济性，因此投资者不应仅凭过时的合并前融资来判断价格或下行韧性。在继续保持“继续研究”姿态前，应取得当前安全/合规材料、产品权限清单、实施人员假设、客户集中度和续约证据，以及能把平台故事与持久经济性连起来的合并公司董事会级财务披露。
