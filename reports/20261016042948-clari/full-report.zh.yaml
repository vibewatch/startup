      - number: '4.3'
        title: 成本结构与交付负担信号
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最强的公开警示集中在实施和运营负担。SoftwareReviews 反馈称初始数据集成需要投入；当收入通过服务密集型变更而非经典交易流动时，Clari 也更容易遇到困难。Default 和
              Docket 的评测都由竞争方撰写，但方向一致地认为部署可能耗时 8–16 周，需要额外服务或管理员资源，并适合拥有专职 RevOps
              的组织。这说明专业服务、管理员时间和变更管理投入会影响实际毛利率和回本期。由于指定公开记录没有披露服务收入占比、支持人员比、CAC、回本期或毛利率，这些负担信号应视为投资判断风险，而不是已经解决的经济性问题。
            claimRefs:
              - CI006
              - CI007
              - CI012
              - CI014
      - number: '4.4'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              历史融资可见，但当前流动性不可见。SiliconANGLE 报道 Clari 于 2022 年 1 月以 $2.6 billion 估值完成 $225 million 融资，并称公司计划增加 300
              名员工；这证明公司过去能够获得成长资本，却几乎不能说明 2026 年末合并后的 Clari-Salesloft 资产负债表。资料池中的合并后来源强调平台整合、AI
              定位和市场调查结果，而不是现金余额、债务义务、烧钱或现金跑道。因此，当前资本充足性仍未解决：证据支持其战略相关性和企业付费意愿，但不能证明合并实体能否自行承担整合、维持高服务强度，或避免依赖未来融资才能达到更干净的利润率画像。
            claimRefs:
              - CI010
              - CI011
              - CI013
              - CI014
