            title: 投资判断仍取决于未披露的合并经济性
            body: 在缺少当前 ARR、毛利率、按历史客户群划分的留存以及现金和跑道数据时，主要风险是还没看到持久的合并经济性，就先为整合野心付出价格。
            calloutType: risk
            claimRefs:
