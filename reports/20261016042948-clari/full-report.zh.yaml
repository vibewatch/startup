              Forecast
              加管道可见性：官方页面强调支持订阅和消费型模式，独立评测也仍把预测质量和董事会级可见性视为企业购买的原因。合并后扩大的产品面已经足以按模块绘制，但买方仍应区分成熟品类（预测和检查）与较新的编排叙事，例如支持
              MCP 的外部 AI 访问和收入代理。
