      - number: '5.4'
        title: 产品与技术风险
        blocks:
          - type: paragraph
            body: >-
              主要产品风险不在于 Clari 是否拥有有用模块，而在于合并平台是否已经统一到足以持续交付，而不会产生过度打包、集成和管理拖累。竞争方批评以及 Docket 对 Forrester
              的总结都认为，合并后的收敛仍是现实问题，尤其涉及前端一致性以及原生工作流与拼接式工作流的区别。指定资料池也缺少直接的开发者信号、当前一手 API 文档、公开状态/SLA
              披露和具名认证材料，因此可扩展性和信任的重要证明点在此仍未验证。投资判断应因此倾向于：“可信的企业控制平面，但执行细节仍需大量尽调。”
