      - number: '1.2'
        title: 领导层变更与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示领导层确实发生了变化，尽管治理细节仍很少。SiliconANGLE 的 2022 年融资报道引用了创始人兼时任 CEO Andy Byrne；合并时期的比较和评论资料则称 Steve Cox
              成为合并后的 Clari-Salesloft 公司 CEO。更可靠的结论不是外部观察者掌握了精确组织架构，而是公司已从创始人主导的独立 Clari，转向新 CEO
              领导下、由赞助方支持的整合阶段。这使产品整合、商业打包和高管团队留任面临典型的关键人物依赖。指定公开资料池中看不到当前董事会名单、赞助方治理权或任何债务、授信层安排。
