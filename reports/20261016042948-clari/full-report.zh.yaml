          'y': 2
          note: 对话智能深度的直接同类产品，但评测来源仍将其与 Clari 的董事会级预测区分开。
          claimRefs:
            - CP006
            - CP007
        - label: ZoomInfo 主导的技术栈
          x: 2
          'y': 5
          note: 上游数据和意向背景更广，但不是直接等同于 Clari 的预测层。
          claimRefs:
            - CP014
        - label: Clari
          x: 5
          'y': 5
          note: 覆盖预测、检查、互动和 AI 智能代理的范围最广，但整合风险仍未解决。
          claimRefs:
            - CP001
            - CP012
            - CP013
    approximationNotes: 序数坐标综合指定来源，而非第三方基准研究。它比较产品角色广度和预测深度，不比较客户满意度或市场份额。
    claimRefs:
      - CP001
      - CP006
      - CP010
      - CP012
