        title: 资本历史、规模信号与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              就当前公开记录而言，融资和规模方向积极，但还不够干净到可以直接发表。SiliconANGLE 报道 Clari 于 2022 年 1 月完成 $225 million 融资，估值 $2.6 billion，由
              Blackstone 领投、Silver Lake 参与，这清楚确立了后期私募资本背景。但较新的资料页面对累计资本和当前经营规模都有冲突：StartupHub 列出累计融资 $271 million、员工 646
              人，NexChron 则称 Clari 已融资超过 $500 million。合并评论又换了分母，称合并后的 Clari-Salesloft 拥有超过 5,000 家客户、约 $450 million
              ARR。这些信号适合用来定位，但尚不能构成可靠的独立公司或完全对账的合并公司基线。
