        title: 建议与估值证据
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”而非买入建议，因为 Clari 的经营相关性比当前入场价格更容易验证。独立来源仍把最近一轮明确定价融资锚定在 2022 年 1 月，当时 Clari 融资 $225 million、估值超过
              $2.6 billion；保留的 2026 年更新则来自一个报告 $3.0 billion
              估值和新增资本的追踪器，却没有披露每股价格、清算优先权或稀释条款。因此，公开证据可以帮助约束积极判断需要满足的条件，但不足以自信地断言当前私募市场价格对普通股买方有吸引力。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
