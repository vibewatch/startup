figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: Public evidence narrows from a broad enterprise-systems budget pool toward a much smaller high-fit cohort defined by forecast complexity, RevOps capacity, and budget tolerance.
    data:
      items:
        - label: Adjacent enterprise systems budget
          value: $149B
          unit: annual spend
          note: Aviso frames this as CRM and ERP modernization, so it is a broad adjacency rather than a Clari-specific TAM.
          claimRefs: [CM013]
        - label: Revenue orchestration workflow scope
          value: Create -> close -> retain
          note: Official scope boundary for the merged platform's market story.
          claimRefs: [CM001]
        - label: Forecast installed-base proxy
          value: 75,000+ teams
          note: Company-reported product footprint, not unique customers.
          claimRefs: [CM002]
        - label: Clari pre-merger scale proxy
          value: 1,500+ customers / $5T managed
          note: Third-party review repeating company claims.
          claimRefs: [CM014]
        - label: Combined-entity scale thesis
          value: 5,000 orgs / $10T managed
          note: Post-merger scale claim is useful as an upper-bound adoption lens only.
          claimRefs: [CM015]
        - label: High-fit operating threshold
          value: 100+ reps / $100M+ ARR / $200K+ spend
          note: Review-based fit heuristic for large teams with dedicated RevOps.
          claimRefs: [CM004, CM016]
    approximationNotes: The figure stacks public adoption and budget proxies from different issuers; it is a boundary-setting lens, not a mathematically reconciled TAM-SAM-SOM model.
    claimRefs: [CM001, CM002, CM004, CM013, CM014, CM015, CM016]
