artifact: company-overview
slug: clari
runDate: 2026-10-16
company:
  name: Clari
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Clari now presents itself primarily as the combined Clari+Salesloft revenue
    AI platform rather than as a standalone forecasting vendor, and the merger
    plus broad workflow scope are well supported by the assigned evidence pool.
    What remains much less clear is the hard operating baseline a later chapter
    would want for diligence: current board composition, cap-table economics,
    debt, and comparable post-merger scale metrics are still opaque or
    contradictory in public sources.
sections:
  - id: identity-and-scope
    title: Identity and product scope
    body: >-
      The strongest current identity signal is company-issued rather than
      financial: Clari's official surfaces now frame the business as the
      combined Clari+Salesloft "Predictive Revenue System," with official copy
      emphasizing thousands of customers, trillions in managed revenue, and a
      workflow span that runs from pipeline and prospecting through sales
      engagement, forecasting, and customer retention. That makes the present
      reader-facing brand broader than the founder-era forecasting story. A
      third-party profile still anchors the legacy company to Sunnyvale and a
      2013 founding year, but the same profile also shows how messy the public
      baseline has become after the merger: identity, scale, and website fields
      are no longer cleanly separated between old Clari and the combined entity.
    claimRefs:
      - CO001
      - CO002
      - CO003
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership transition and governance visibility
    body: >-
      Public evidence shows a real leadership change even if governance detail
      is still thin. SiliconANGLE's 2022 financing coverage quotes founder and
      then-CEO Andy Byrne, while merger-era comparison and commentary sources
      say Steve Cox became CEO of the combined Clari-Salesloft company. The
      higher-confidence takeaway is not that outside observers know the exact
      org chart, but that the business moved from founder-led standalone Clari
      toward sponsor-backed integration under a new chief executive. That raises
      classic key-person dependency around product consolidation, commercial
      packaging, and retention of the executive bench. The current board roster,
      sponsor governance rights, and any debt or credit layer are not visible
      in the assigned public pool.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO013
      - CO014
    tableRefs:
      - TO002
  - id: capital-scale-and-stakeholders
    title: Capital history, scale signals, and stakeholder map
    body: >-
      Funding and scale are directionally positive but not publication-clean in
      the current public record. SiliconANGLE reported a $225 million January
      2022 financing at a $2.6 billion valuation led by Blackstone with Silver
      Lake participating, which clearly establishes late-stage private backing.
      But newer profile pages conflict on both lifetime capital and current
      operating scale: StartupHub lists $271 million total funding and 646
      employees, while NexChron says Clari has raised over $500 million. Merger
      commentary then shifts the denominator again by citing more than 5,000
      customers and roughly $450 million ARR for the combined Clari-Salesloft
      entity. Those signals are useful for orientation, but they are not yet a
      reliable standalone or fully reconciled merged-company baseline.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO003
  - id: milestones-and-open-issues
    title: Milestones and diligence-critical open issues
    body: >-
      The milestone path is visible enough to anchor later chapters. Clari
      appears in public profiles as a 2013-founded Sunnyvale company, raised
      multiple venture rounds through 2019, added a large financing in 2022,
      acquired Groove in 2023 to deepen engagement coverage, announced a merger
      with Salesloft in August 2025, and was described by 2026 comparison
      content as operating as one entity under Steve Cox after closing in
      December 2025. The harder diligence questions start after that milestone
      arc: public sources do not reconcile current funding totals, do not show
      the new control structure, and do not provide a supportable current view
      of merged-company revenue quality, margins, or headcount composition.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO010
      - CO013
    figureRefs:
      - FO001
