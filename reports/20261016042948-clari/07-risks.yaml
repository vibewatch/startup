chapter:
  number: 7
  title: "Risks"
  summary: "Clari's main underwriteable risks are merger integration, CRM/data dependency, and enterprise-only cost and admin burden; the assigned pool establishes neither a major legal incident nor the absence of one. The evidence supports a cautious view that the combined Clari-Salesloft platform can be strategically powerful for large RevOps-heavy buyers, but current public evidence still leaves material gaps on merged-company financial quality, contract boundary clarity, and security/compliance specifics."
sections:
  - id: "ranked-risk-stack"
    title: "Ranked risk stack"
    body: |
      The highest-severity risk established by the assigned evidence is post-merger execution; the pool lacks the regulator, court, and incident records needed to determine whether a separate legal or enforcement issue exists. Forrester explicitly frames the Clari-Salesloft combination as high-risk and high-reward, with product overlap, UX trade-offs, and unresolved AI differentiation questions. That matters because Clari is simultaneously broadening the platform surface area: unified forecasting, engagement, conversation intelligence, workflow automation, and AI-guided execution all increase the number of systems, teams, and contract boundaries that must stay aligned for the product promise to hold. The company can be valuable when that orchestration works, but underwriting the story requires treating integration, governance, and adoption as first-order diligence items rather than assuming the merged stack is already settled.
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR009, CR010, CR012]
    figureRefs: [FR001]
  - id: "governance-and-control-risks"
    title: "Governance, privacy, and model-control risks"
    body: |
      The legal and governance picture is notable less for proven public breakage than for visible control dependencies. Clari's own marketed value proposition depends on capturing revenue data and signals across systems, while independent reviews repeatedly warn that dirty CRM data, inconsistent stages, or uncoordinated system changes reduce output quality. The same pattern shows up in AI-specific workflows: public materials describe AI-guided CRM suggestions, Smart Deal Summaries, and predictive recommendations, but also warn that outputs can be inaccurate and that call capture depends on consent, meeting, and administrator settings. In practice, that means a buyer cannot treat the platform as autonomous revenue infrastructure; the diligence threshold should include explicit review of recording consent controls, data governance responsibilities, model exception handling, and contractual allocation of errors when AI or integration layers misclassify pipeline risk.
    claimRefs: [CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR001]
  - id: "operating-and-dependency-risks"
    title: "Operating and dependency risks"
    body: |
      Clari's operational downside is concentrated in implementation and dependency load. The combined product is positioned for complex enterprise deployments, not self-serve adoption; independent reviews describe recurring RevOps administration and a weaker fit for smaller teams, while competitor Docket AI supplies directional, not independent, implementation-time and pricing estimates. That burden compounds with merger integration risk: if the roadmap, entitlement boundary, or workflow handoff between Clari, legacy Groove/Salesloft capabilities, and external systems remains blurry, the buyer is paying an enterprise platform tax before proving durable organizational adoption. For underwriting purposes, the most important question is not whether Clari can demo strong forecast accuracy, but whether the customer can sustain the data hygiene, admin ownership, and post-merger change management needed for those results to persist.
    claimRefs: [CR001, CR002, CR003, CR008, CR009, CR010, CR012]
    tableRefs: [TR002, TR003]
  - id: "kill-criteria-and-diligence-path"
    title: "Kill criteria and diligence path"
    body: |
      The thesis should break if diligence shows that forecast quality depends on heroic manual cleanup, that material sales-engagement or conversation-intelligence functions remain contractually or technically fragmented after the Salesloft merger, or that the buyer lacks an accountable RevOps owner with enough bandwidth to operate the platform. A second kill criterion is financial opacity: the assigned pool still does not disclose merged-entity burn, gross margin, preference stack, or common-equity economics, so an investor should not underwrite price or downside resilience from stale pre-merger fundraising alone. Before moving past a research-more posture, diligence should obtain current security/compliance materials, product-entitlement schedules, implementation staffing assumptions, customer concentration and renewal evidence, and board-level merged-company financial disclosures that tie the platform story to durable economics.
    claimRefs: [CR008, CR009, CR011, CR012, CR013]
callouts:
  - calloutType: "risk"
    title: "Primary underwriteable risk"
    body: "The clearest evidence-backed downside is that Clari's post-merger platform breadth raises execution and adoption risk faster than current public evidence proves simplification or durable integration."
    claimRefs: [CR001, CR002, CR006, CR008, CR012]
  - calloutType: "recommendation"
    title: "Diligence before price judgment"
    body: "Do not treat current public material as sufficient to underwrite valuation, because the assigned evidence does not disclose merged-company burn, margin, cap-table terms, or a complete post-merger entitlement map."
    claimRefs: [CR009, CR011, CR013]
