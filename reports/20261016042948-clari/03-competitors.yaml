schemaVersion: report-v2
artifact: competitors
slug: clari
runDate: 2026-10-16
company:
  name: Clari
chapter:
  number: 3
  title: Competitors
  summary: >-
    Clari competes as an enterprise revenue orchestration suite rather than a
    narrow point tool: the official product stack now spans forecasting, deal
    inspection, cadence/execution, and AI agents, while third-party reviews say
    the merged Clari-Salesloft entity serves more than 5,000 customers and
    roughly $450 million of combined ARR. The buyer choice is therefore less a
    simple Clari-versus-Gong decision than a tradeoff among forecast depth,
    native workflow breadth, data-origination dependency, and willingness to
    absorb opaque enterprise pricing plus an 8-16 week implementation.
sections:
  - id: competitive-landscape
    title: Competitive landscape spans direct peers, incumbents, adjacencies, and status quo
    body: >-
      Clari is not competing in one clean category. Official positioning says it
      is a revenue orchestration platform that unifies revenue data, insights,
      cadences, and AI agents, while multiple 2026 reviews describe the merged
      Clari-Salesloft offer as combining forecasting, pipeline inspection,
      conversation intelligence, and sales engagement in one stack. That makes
      Gong the clearest direct peer for buyers prioritizing conversation
      intelligence, Salesforce Einstein the most important incumbent substitute
      for Salesforce-native teams, HubSpot Sales Hub and Avoma the lighter-weight
      substitutes for smaller teams, and spreadsheets plus CRM-native workflow
      the status quo fallback. The adjacent threat is data-first GTM software:
      ZoomInfo argues that neither Clari nor Salesloft originates verified
      contact or intent data, so some buyers may keep Clari out of the core
      stack and instead pair other workflow tools with an upstream data vendor.
    claimRefs: [CP001, CP003, CP006, CP010, CP011, CP014]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buying-criteria
    title: Buyers are paying for board-grade forecasting, not generic sales tooling
    body: >-
      The consistent divide in the assigned evidence is buyer maturity. Several
      reviews say Clari pays off when the organization has at least roughly 50
      reps and dedicated RevOps, and Docket narrows the best-fit profile further
      to CRO-led teams above roughly $100 million ARR that face board-level
      forecast scrutiny. In that context, Clari's edge versus Gong is not call
      intelligence breadth but forecast-system-of-record depth, while its edge
      versus Salesforce Einstein or HubSpot is deeper predictive modeling and
      board reporting at the cost of more integration and operating overhead.
      The multi-homing data point matters: Docket says 40% of Gong customers
      also buy Clari, which suggests many enterprise buyers do not view the
      products as interchangeable and are willing to pay for both when each
      solves a different layer of the revenue workflow.
    claimRefs: [CP002, CP004, CP005, CP006, CP007, CP010, CP016]
    tableRefs: [TP002, TP003]
  - id: durability-and-risks
    title: Suite breadth increases switching cost, but the integration story still needs proof
    body: >-
      Clari's moat argument is strongest when customers standardize on the
      merged suite: reviews and official materials together show coverage from
      forecasting and deal inspection through cadence execution and AI agents,
      which naturally raises process-switching cost once a revenue team adopts
      the full operating model. But the same evidence also shows why durability
      should not be overstated. Clari does not publish pricing, implementations
      are lengthy and RevOps-heavy, and adverse comparison sources say the
      product roadmap is still integrating overlapping acquisitions rather than
      already delivering one clean platform. The pool also does not provide
      direct win/loss, migration-churn, or post-merger attach-rate evidence, so
      the underwriting question is not whether Clari looks feature-rich, but
      whether breadth is translating into durable retention and rationalized
      bundle economics against Gong, Salesforce, HubSpot, and data-first
      adjacencies.
    claimRefs: [CP008, CP009, CP012, CP013, CP014, CP015]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / approach
      - Category
      - Scale or funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - ["Clari", "Direct platform", "2022: $225M round at $2.6B valuation; 2026 reviews cite 5,000+ customers and ~$450M combined ARR post-merger", "Enterprise CRO / RevOps teams", "Board-grade forecasting, pipeline inspection, now broader execution coverage", "Opaque pricing and heavy implementation burden"]
      - ["Gong", "Direct peer", "Assigned pool cites 6,100+ G2 reviews; no fresh funding data in this pool", "Teams prioritizing conversation intelligence and coaching", "Conversation-intelligence depth and large call dataset", "Review sources say CRO-level forecasting is weaker than Clari's"]
      - ["Salesforce Einstein Forecasting", "Incumbent substitute", "Bundled inside Salesforce Enterprise / Unlimited in assigned review evidence", "Salesforce-native teams needing lower-friction forecasting", "Native CRM fit and faster time to value", "Less depth for enterprise predictive forecasting and board reporting"]
      - ["HubSpot Sales Hub", "Mid-market substitute", "Assigned pool cites public $100-$150/user/month pricing but no like-for-like scale metric", "HubSpot-centric SMB and mid-market teams", "Lower-cost forecasting and sales workflow layer", "Forecasting depth is lighter for complex enterprise motions"]
      - ["ZoomInfo-led stack", "Adjacent / data-first route", "500M contacts, 100M companies, 135M+ verified phone numbers on ZoomInfo-authored comparison page", "Teams whose core problem is account selection and data origination", "Verified data, intent, and GTM context before execution", "Not a direct forecast system of record equivalent to Clari"]
      - ["Internal CRM + spreadsheets", "Status quo / internal build", "Existing stack; no vendor funding signal", "Smaller teams or low-maturity RevOps environments", "Low incremental cash spend and familiar workflow", "Manual rollups and weaker forecasting rigor"]
    notes: >-
      Partial competitive set drawn only from the assigned pool. Scale/funding
      mixes time periods where necessary and keeps unknown fields explicit
      rather than inferring fresh competitor metrics that were not in the
      prefetched evidence.
    claimRefs: [CP003, CP006, CP010, CP011, CP014, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Clari
      - Gong
      - Salesforce Einstein
      - HubSpot Sales Hub
      - ZoomInfo-led stack
    rows:
      - ["Forecast system-of-record depth", "Strong — official forecast page markets 98% accuracy by week two and 75,000+ teams", "Medium — Docket says Gong Forecast exists but buyers still pair Clari for board-grade forecasting", "Medium — CRM-native and often 'enough' for Salesforce-centered teams", "Basic to mid-market — lighter forecasting depth", "Low — not presented as a forecast system of record"]
      - ["Conversation intelligence depth", "Good but secondary to forecasting", "Strong — review sources position Gong as the CI leader", "Unknown in assigned pool", "Unknown in assigned pool", "Moderate via Chorus context, but not the primary evaluation lens here"]
      - ["Native execution / cadence breadth", "Post-merger suite now covers engagement, cadence, and AI follow-up loops", "Requires additional workflow tooling beyond CI", "CRM-native workflow and reporting inside Salesforce", "Broad SMB workflow inside HubSpot stack", "Execution plus data context, but with a different starting point than Clari"]
      - ["Upstream data origination", "Depends on CRM and third-party data", "Unknown in assigned pool", "Depends on Salesforce data quality", "Depends on HubSpot data quality", "Core strength — verified contact, company, and intent data"]
      - ["Admin / implementation burden", "High — 8-16 week rollout and RevOps ownership", "Unknown in assigned pool", "Lower integration friction for Salesforce shops", "Lower burden for smaller teams", "Adds vendor complexity if paired with separate forecast tooling"]
    notes: >-
      Ordinal matrix synthesized from the assigned evidence. 'Unknown in
      assigned pool' means the prefetched chapter sources did not provide enough
      support to rate the cell more precisely.
    claimRefs: [CP002, CP006, CP009, CP010, CP012, CP014, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Publicly cited price / contract model
      - Included scope
      - Unknowns or caveats
      - Implication
    rows:
      - ["Clari Forecast", "$100-$125/user/month in review evidence; quote-based annual or multi-year contracts", "Forecasting and pipeline core", "Not an official list price; realized discounts unknown", "Supports enterprise forecast use cases but forces sales process before buyers can underwrite"]
      - ["Clari full stack", "$200-$310+ to $400+/user/month in review evidence; 5-10% renewal uplift also cited", "Forecast, Copilot CI, and engagement layer", "Ranges vary by reviewer; attach-rate and module entitlements remain opaque", "Broad suite can raise switching cost, but bundle economics are hard to verify publicly"]
      - ["Implementation for Clari", "$15,000-$75,000 plus 10-15 hours/week of RevOps time during rollout", "Professional services and internal admin effort", "Varies by deployment size and scope", "Raises total cost of ownership well above seat-price comparisons"]
      - ["HubSpot Sales Hub", "$100-$150/user/month with published pricing per Docket", "Lighter forecasting and sales workflow", "Assigned pool does not include HubSpot's own pricing page", "Viable lower-cost substitute for smaller HubSpot-centric teams"]
      - ["Avoma / CI-first lightweight option", "$59-$149/user/month per Docket", "Conversation intelligence and lighter workflow", "Not a board-grade forecasting replacement", "Best understood as a lower-cost substitute for narrower use cases"]
      - ["Salesforce Einstein Forecasting", "Included in Salesforce Enterprise and Unlimited editions", "CRM-native forecasting layer", "Standalone incremental cost not broken out in assigned pool", "Strong substitute when minimizing integration friction matters more than forecast depth"]
    notes: >-
      All non-Clari competitor prices above come from review/comparison sources
      in the assigned pool, not from retained first-party pricing pages. Use
      them as directional buyer-cost signals rather than executable quotes.
    claimRefs: [CP008, CP009, CP010, CP011, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal view of how the main alternatives trade forecast
      depth against workflow breadth.
    xAxis:
      label: Forecast system-of-record depth
      min: 1
      max: 5
      lowLabel: Light / manual
      highLabel: Board-grade
      description: 1=manual or basic forecasting, 5=board-grade forecasting depth
    yAxis:
      label: Workflow and data breadth
      min: 1
      max: 5
      lowLabel: Narrow point tool
      highLabel: Broad operating stack
      description: 1=narrow point tool, 5=broad workflow or data platform coverage
    data:
      points:
        - label: Internal CRM + spreadsheets
          x: 1
          y: 1
          note: Manual status quo with low incremental cash cost but weak rigor.
          claimRefs: [CP011]
        - label: HubSpot Sales Hub
          x: 2
          y: 2
          note: Lighter mid-market forecasting and workflow at a lower price tier.
          claimRefs: [CP011]
        - label: Salesforce Einstein
          x: 3
          y: 2
          note: Lower-friction CRM-native substitute for Salesforce shops.
          claimRefs: [CP010]
        - label: Gong
          x: 3
          y: 2
          note: Direct peer for CI depth, but review sources still separate it from Clari for board-level forecasting.
          claimRefs: [CP006, CP007]
        - label: ZoomInfo-led stack
          x: 2
          y: 5
          note: Broad upstream data and intent context, but not a direct Clari-equivalent forecast layer.
          claimRefs: [CP014]
        - label: Clari
          x: 5
          y: 5
          note: Broadest retained coverage across forecasting, inspection, engagement, and AI agents, with integration risk still unresolved.
          claimRefs: [CP001, CP012, CP013]
    approximationNotes: >-
      Ordinal coordinates synthesize the assigned source set rather than a
      third-party benchmark study. They compare product-role breadth and
      forecast depth, not customer satisfaction or market share.
    claimRefs: [CP001, CP006, CP010, CP012, CP013, CP014]
callouts:
  - calloutType: insight
    title: Multi-homing weakens simple one-vendor framing
    body: >-
      The clearest signal in the assigned pool is that many enterprise buyers do
      not replace Gong with Clari or vice versa. Docket's 40% overlap data point
      suggests Clari often wins the forecast-system-of-record layer while Gong
      keeps the conversation-intelligence budget.
    claimRefs: [CP006, CP007, CP016]
  - calloutType: risk
    title: Post-merger breadth is real, but product rationalization is still unproven
    body: >-
      The merged suite expands the moat narrative, yet adverse comparison
      sources still describe an in-progress roadmap, incomplete prior
      integrations, and unresolved questions about what a unified bundle
      actually looks like in production.
    claimRefs: [CP012, CP013]
