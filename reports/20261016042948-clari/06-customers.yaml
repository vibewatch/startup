      - [Finance and board stakeholders, "Buyer sponsor: CRO / finance; users: finance and executive staff; payer: enterprise GTM / ops", Board-ready revenue visibility and forecast confidence, "Global enterprise motions with multiple products or segments", "Strategic because Clari becomes the forecast number senior leadership uses", "No published seat counts or adoption depth for finance users"]
      - [Frontline sales leadership and reps, "Buyer: revenue leadership; users: frontline managers and reps; payer: GTM ops", "Deal risk visibility, pipeline management, and guided actions", "Works best when CRM hygiene and RevOps support already exist", "Operational leverage across large field teams", "No disclosed active-user or weekly-engagement metrics"]
      - [Customer success and retention teams, "Buyer: revenue leadership; users: customer success / account teams; payer: broader revenue platform budget", Retention and growth workflows layered onto the same revenue data spine, "Claimed cross-functional reach, but module penetration is undisclosed", "Supports expansion story if installed beyond forecasting", "No independent disclosure of CS penetration, renewal uplift by cohort, or post-merger module attach rates"]
    notes: >-
      Mix is synthesized from official workflow claims and independent ideal-customer reviews;
      Clari does not publish customer segmentation by logo count, ARR, geography, or module mix.
    claimRefs: [CU001, CU002, CU008, CU010, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Organizations using Clari, "450+", "2022-01", SiliconANGLE, medium, "Shows meaningful pre-merger enterprise footprint before later expansion", "No cohort retention, revenue mix, or current overlap with merged customer base"]
      - [Organizations running revenue on Clari, "1,500+", "2025-09", "Clari / Business Wire", medium, "Supports a materially larger named enterprise base by late 2025", "No disclosure of active accounts, paid-seat depth, or overlap with Salesloft customers"]
      - [Teams trusting Clari Forecast, "75,000+", "2026 current page", "Clari Forecast page", medium, "Suggests broad module reach beyond a small logo count", "Teams is undefined and may not equal paying customer organizations"]
      - ["Composite enterprise ROI / benefits", "398% ROI; $96.2M benefits; payback <6 months", "2025 study promoted in 2025-09", "Clari / Business Wire", medium, "Strong outcome proof for enterprise buyers evaluating business case", "Commissioned composite study, not disclosed customer-level cohort economics"]
      - ["Composite enterprise retention / expansion lift", "+20-point renewal rates; +20% cross-sell / upsell opportunity growth", "2025 study promoted in 2025-09", "Clari / Business Wire", medium, "Supports land-and-expand narrative if study assumptions hold", "No named customer, sample size, or post-merger cohort detail"]
    notes: >-
      Rows mix company-wide organizations, module teams, and commissioned-study outcomes; the
      numbers are not a common denominator and should not be read as a single funnel.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [Adobe, Enterprise software, "Listed in an official customer roster and repeated in 2026 competitor-authored review coverage", "Customer relationship claimed; production scope not disclosed", "Named customer proof only", "No deployment scope, module mix, or quantified outcome disclosed"]
      - [Zoom, Enterprise collaboration software, "Listed in an official customer roster and repeated in 2026 competitor-authored review coverage", "Customer relationship claimed; production scope not disclosed", "Named customer proof only", "No retention, seat count, or expansion detail disclosed"]
      - [Carbon Black, Cybersecurity, "Official page identifies a three-time Clari customer; competitor review describes a forecasting deployment", "Production use implied; exact scope not disclosed", "Docket AI reports 95% forecast accuracy during a pre-IPO ramp", "Competitor-authored benchmark; no economics, renewal history, or comparables disclosed"]
    notes: >-
      Enumeration is intentionally partial and limited to named references with at least two
      retained supporting sources; logos alone are weaker proof than disclosed production outcomes.
    enumerationScope:
      coverage: partial
      basis: >-
        Representative subset of named references that appear in at least two retained sources and
        have enough context to distinguish live deployment from generic logo display.
    claimRefs: [CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Enterprise adoption flows from board-level forecast pain into wider revenue workflow usage.
    data:
      items:
        - label: Forecast credibility problem emerges
          detail: Enterprise revenue leaders look for a system that can replace fragmented spreadsheet forecasting and reveal pipeline risk early.
          actor: "Primary buyers: CRO, RevOps, finance"
          channel: Direct enterprise sale
          touchpoints:
            - Board pressure for forecast accuracy
            - Multi-team revenue data fragmentation
        - label: RevOps-led evaluation
          detail: The practical buying motion assumes dedicated RevOps ownership, Salesforce readiness, and appetite for a significant implementation project.
          actor: "Evaluation users: RevOps admins, revenue leadership"
          channel: Structured enterprise evaluation
          touchpoints:
            - Forecast hierarchy design
            - Integration and CRM hygiene review
        - label: Core forecast deployment
          detail: Forecast and pipeline inspection land first because they are the modules most consistently cited in customer proof and independent reviews.
          actor: "Primary users: CRO, managers, reps"
          channel: Platform rollout
          touchpoints:
            - Forecast call workflow
            - Deal-risk inspection
        - label: Cross-functional revenue data spine
          detail: Official materials widen the user set to Sales, Marketing, Customer Success, RevOps, and Finance working from the same revenue context.
          actor: "Expanded users: GTM and finance teams"
          channel: Unified platform adoption
          touchpoints:
            - Shared revenue context
            - Cross-team workflow governance
        - label: Retention and growth motion
          detail: Clari markets customer retention and growth as a later-stage workflow, but public evidence is thinner than for forecasting.
          actor: "Later users: account teams and customer success"
          channel: Land-and-expand
          touchpoints:
            - Churn-risk monitoring
            - Expansion prioritization
        - label: Renewal decision and expansion ceiling
          detail: Durability depends on whether the customer can sustain admin overhead and prove value, which is where mid-market fit weakens most.
          actor: "Renewal owner: revenue leadership"
          channel: Renewal / upsell
          touchpoints:
            - Annual platform budget scrutiny
            - RevOps capacity and implementation payback
    claimRefs: [CU001, CU002, CU008, CU009, CU014]
callouts:
  - calloutType: strength
    title: Strongest proof is named enterprise usage
    body: >-
      The public record is good enough to confirm live enterprise deployments and meaningful
      forecast outcomes, especially around Adobe, Zoom, Carbon Black, and the broader 1,500+
      organization claim disclosed by Clari in late 2025.
    claimRefs: [CU004, CU011, CU012, CU013]
  - calloutType: risk
    title: Durability evidence still lags adoption evidence
    body: >-
      Clari's customer story is materially weaker on retention, concentration, and contract
      durability than on logos or forecast-accuracy examples, so underwriting renewals still
      requires private diligence.
    claimRefs: [CU007, CU009, CU014]
