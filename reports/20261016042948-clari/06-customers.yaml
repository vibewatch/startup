schemaVersion: "report-v2"
artifact: customers
slug: clari
runDate: 2026-10-16
company:
  name: Clari
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports Clari as an enterprise-focused revenue platform with real production
    use inside large sales organizations, but the proof set is still curated toward logos,
    forecast outcomes, and commissioned ROI studies rather than disclosed retention cohorts or
    concentration data. The strongest named proof clusters around enterprise software and
    board-level forecasting use cases, while external comparison sources repeatedly warn that value
    deteriorates for smaller teams without dedicated RevOps ownership.
sections:
  - id: customer-fit-and-segmentation
    title: Customer fit and segment shape
    body: >-
      The retained evidence consistently points to Clari's core customer as a large B2B revenue
      organization rather than an SMB or self-serve buyer. Official product pages frame the
      platform as a shared operating layer for Sales, Marketing, Customer Success, RevOps, and
      Finance, while external reviews narrow the practical ideal customer to CRO-led teams that
      already run structured forecasting and can support dedicated revenue operations ownership.
      That combination implies a buyer base where the economic buyer is usually a CRO or RevOps
      leader, the user set spans managers and frontline reps, and the value case rests on
      board-grade forecast credibility rather than lightweight productivity alone.
    claimRefs: [CU001, CU002, CU008, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-reference-quality
    title: Adoption proof and reference quality
    body: >-
      Clari's public adoption proof is meaningful but uneven in quality. Named enterprise logos
      and benchmarked case studies show real production deployments, and the disclosed customer
      list has expanded from more than 450 organizations in early 2022 to more than 1,500 by
      September 2025, with Adobe and Zoom still cited in 2026 competitor-authored review coverage.
      At the same time, the freshest performance proof comes from company-selected examples or a
      commissioned composite study, so readers should separate evidence of live enterprise usage
      from stronger but still curated claims about ROI, forecast accuracy, or renewal lift.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU011, CU012, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The expansion narrative is plausible because Clari now markets a workflow that runs from
      pipeline creation through retention and growth, but public durability evidence remains thin.
      The retained sources do not disclose post-merger NRR, GRR, churn, contract duration, or
      top-customer concentration, and independent reviews describe implementation, admin burden,
      and pricing as real constraints that may weaken renewals outside the enterprise core. The
      missing denominator is not whether enterprises buy Clari at all, but whether those logos
      renew cleanly after deployment and broaden into the full post-merger stack. In practice, the
      customer story is strongest on strategic fit and live deployment, weaker on durable
      retention proof, and weakest on concentration transparency.
    claimRefs: [CU007, CU008, CU009, CU014]
