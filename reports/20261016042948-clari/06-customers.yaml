  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: durability-gaps
      missingEvidence: Post-merger NRR, GRR, churn, contract duration, and renewal-cohort disclosures by legacy Clari versus legacy Salesloft accounts.
      whyItMatters: Without durability metrics, public customer proof can confirm adoption but not whether the installed base is expanding or deteriorating after the merger.
      diligencePath: Request cohort retention decks, renewal waterfall data, and product-migration churn analysis from management.
      relatedQuestionRefs: [QU004, QU008]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Customer concentration by revenue, top-account exposure, and any channel or partner dependency inside the revenue base.
      whyItMatters: A logo-rich enterprise customer list can still mask material exposure to a small number of accounts or bundled distribution relationships.
      diligencePath: Obtain top-10 customer concentration, top vertical contribution, and channel-sourced ARR splits from finance or RevOps.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: minor
      topic: active-usage
      missingEvidence: Active-seat counts, module penetration by function, and usage depth for customer-success workflows versus core forecasting workflows.
      whyItMatters: Customer count and named logos do not show whether Clari's broader land-and-expand narrative is converting into deep multi-module adoption.
      diligencePath: Ask for module attach rates, active-user metrics, and retention/growth workflow adoption by cohort.
      relatedQuestionRefs: [QU002, QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A larger named customer set with deployment scope, module mix, and measurable outcomes beyond the small public subset captured in TU003.
      whyItMatters: The current public proof confirms live enterprise usage, but it is too selective to judge how representative those references are across the broader customer base.
      diligencePath: Request the top referenceable accounts by vertical, implementation stage, module footprint, and quantified customer outcome.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
