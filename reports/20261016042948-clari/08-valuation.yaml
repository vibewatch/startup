  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-terms
      missingEvidence: Current price per share, dilution, liquidation preferences, and any seniority created by the reported 2026 financing or secondaries.
      whyItMatters: Without current security terms, headline valuation cannot be translated into common-equity return potential.
      diligencePath: Request the latest cap table, financing documents, and any material secondary transaction summary from the company or lead investors.
      relatedQuestionRefs:
        - QV008
    - type: missing-source
      severity: material
      topic: combined-financial-quality
      missingEvidence: Audited or management-certified combined ARR, revenue, gross margin, burn, NRR, customer concentration, and churn for the merged Clari-Salesloft entity.
      whyItMatters: Valuation support depends on the quality of scale, not just headline ARR or customer-count claims.
      diligencePath: Obtain the latest board package or lender-quality operating metrics pack and reconcile it to any 2026 financing materials.
    - type: missing-source
      severity: material
      topic: comparable-valuation-basis
      missingEvidence: A directly comparable public or private valuation set tied to disclosed revenue or ARR denominators for Clari's current post-merger product mix.
      whyItMatters: Without denominator clarity, even a plausible headline valuation step-up cannot be tested against peers or milestones.
      diligencePath: Build a comp set only after obtaining current combined revenue, margin, and retention definitions from management.
    - type: private-evidence-only
      severity: material
      topic: integration-outcomes
      missingEvidence: Post-merger migration, renewal, overlap-retirement, and product-rationalization metrics across legacy Clari, Groove, and Salesloft modules.
      whyItMatters: Integration success determines whether scale improves monetization or simply raises implementation and churn risk.
      diligencePath: Ask for cohort renewals, attach rates, module-retirement roadmap, and customer references that adopted the combined stack after the merger.
