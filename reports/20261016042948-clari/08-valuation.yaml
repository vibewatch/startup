  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence-backed read
      - What would change the view
    rows:
      - ["Enterprise forecasting moat", "Independent reviews and Clari's own product page converge on forecast accuracy and pipeline inspection as the platform's core differentiators.", "Independent customer evidence showing forecast gains are durable outside carefully selected enterprise case studies."]
      - ["Merged-company scale", "One retained independent review frames the combined company at about $450M ARR, 5,000+ customers, and $10T under management after the Salesloft merger.", "Fresh independent evidence that this scale is translating into retention, margin, and cross-sell quality rather than only headline breadth."]
      - ["ROI upside", "Salesloft-controlled studies claim 398% ROI, $96.2M in benefits, and material renewal/forecast gains for a composite enterprise.", "Third-party or customer-level disclosures that replicate those outcomes without company-controlled sampling or composite construction."]
      - ["Cost and execution burden", "Independent review evidence describes six-figure annual spend, meaningful implementation fees, and ongoing RevOps overhead.", "Reference calls or commercial terms proving the current buyer can absorb implementation load and still hit target returns."]
    notes: >-
      This table mixes company-controlled and independent evidence; the distinction matters
      because upside proof is stronger on product utility than on monetization efficiency or
      current valuation fairness.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Merged Clari-Salesloft integration improves cross-sell, forecast accuracy remains differentiated, and fresh financial disclosure validates current scale.", "A premium to the 2022 benchmark becomes supportable only if disclosed 2026 terms and combined margins show that product proof scales into durable cash economics.", "Execution still has to outrun conversation-intelligence specialists and keep implementation burden manageable.", "Would require independently disclosed round terms plus customer retention and margin evidence not present in this pool."]
      - ["Base", "Clari remains strategically important for large enterprises, but public evidence stays mixed on price and operating quality.", "Most likely outcome is watchful diligence: strategically relevant company, but price support is not strong enough for an affirmative underwriting call.", "Valuation can look full if the tracker-based 2026 step-up is real while economics stay opaque.", "Best fits the current evidence mix: strong product proof, weak current transaction transparency."]
      - ["Bear", "Merger complexity, high total cost of ownership, and incomplete financial disclosure limit new investor appetite.", "Returns compress if the next clean financing benchmark is flat to only modestly above the 2022 level or if preferences absorb upside that headline valuations suggest.", "Down-round risk, churn from integration friction, and expensive deployments that narrow the addressable buyer set.", "More likely if diligence uncovers weak retention, margin pressure, or cap-table terms unfavorable to common shareholders."]
    notes: >-
      Scenarios are intentionally qualitative because the retained sources do not disclose
      enough current revenue, margin, cap-table, or transaction-term detail to justify a
      numerical fair-value range.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
