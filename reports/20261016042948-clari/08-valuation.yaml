    title: Recommendation
    body: >-
      Clari looks strategically relevant and potentially valuable to large enterprise revenue
      teams, but the public evidence in this pool is not strong enough to justify a buy call at
      an unspecified 2026 entry price. Treat the name as research-more unless diligence surfaces
      fresh financing terms, cleaner combined financial quality, and proof that merger execution
      is improving rather than eroding customer economics.
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV012
