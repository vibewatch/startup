schemaVersion: "report-v2"
artifact: valuation
slug: clari
runDate: 2026-10-16
company:
  name: Clari
chapter:
  number: 8
  title: Valuation
  summary: >-
    Clari has credible enterprise product proof and merger-driven scale, but the retained
    public evidence does not justify a buy call because current pricing, cap-table terms, and
    combined post-merger financial quality remain too opaque. The last independently
    corroborated priced round in this pool is the January 2022 Series F at more than $2.6
    billion, while the only 2026 valuation update is a low-confidence tracker showing $3.0
    billion and an October 2026 round without disclosed economics.
sections:
  - id: recommendation-and-valuation-evidence
    title: Recommendation and valuation evidence
    body: >-
      The evidence supports a research-more recommendation rather than a buy because Clari's
      operating relevance is easier to verify than today's entry price. Independent sources
      still anchor the last clearly priced round to January 2022, when Clari raised $225
      million at a valuation above $2.6 billion, and the retained 2026 update is a tracker
      that reports a $3.0 billion valuation and fresh capital without showing share price,
      liquidation preferences, or dilution terms. That combination means public evidence can
      support discipline around what would need to be true for a positive call, but not a
      confident claim that the current private-market price is attractive for common-equity
      buyers.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV012
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The investable thesis is straightforward: Clari appears to remain one of the strongest
      enterprise forecasting and pipeline-inspection platforms, and both company-controlled
      materials and independent reviews keep pointing to forecast accuracy, renewal lift, and
      board-level workflow value as the reasons large revenue teams pay for it. The anti-thesis
      is equally clear: those benefits seem concentrated in large organizations with dedicated
      RevOps capacity, while implementation effort, six-figure annual commitments, and
      post-merger product-integration questions limit the margin for underwriting a premium
      multiple on incomplete evidence. In other words, this is plausibly a quality company but
      not yet a quality entry point on the public record alone.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
    tableRefs:
      - TV002
  - id: scenario-discipline
    title: Bull, base, and bear discipline
    body: >-
      Because the current source set lacks audited combined revenue quality, cap-table detail,
      and independently verified 2026 transaction terms, scenario work has to stay directional
      rather than pretend to precision. The bull case requires proof that post-merger scale and
      workflow integration justify a valuation step-up from the 2022 benchmark and that Clari's
      enterprise ROI claims survive independent diligence. The base case assumes the company is
      strategically relevant but fairly to fully valued until fresh terms, margins, and
      retention data are disclosed. The bear case is that cost, integration friction, and weak
      price discovery drive either a down-round risk or common-equity returns that do not clear
      venture underwriting thresholds.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
    tableRefs:
      - TV003
  - id: final-diligence-asks-and-kill-criteria
    title: Final diligence asks and thesis-break triggers
    body: >-
      A positive recommendation would require evidence that is missing from this pool rather
      than a different interpretation of the same facts. The key asks are current financing
      documents or a clean secondary-market marker, combined-entity retention and margin
      disclosure, and proof that the Clari-Salesloft integration is reducing rather than
      increasing product overlap and operating complexity. Absent that, the thesis breaks if a
      new round prices only modestly above the stale 2022 benchmark, if implementation drag
      keeps ROI confined to a narrow large-enterprise cohort, or if post-merger execution still
      trails specialist competitors in conversation intelligence and workflow depth.
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV012
