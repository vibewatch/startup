          label: Value case supports enterprise budget
          claimRefs: [CI003, CI008]
        - from: contract
          to: margin
          label: Realized economics depend on pricing and services burden
          claimRefs: [CI004, CI007, CI013]
    claimRefs: [CI001, CI003, CI004, CI008, CI013]
callouts:
  - calloutType: insight
    title: Strong value messaging, weak financial disclosure
    body: >-
      The public record is rich in enterprise-value claims and poor in merged-company financial
      disclosure, so commercial relevance is easier to support than underwriting quality.
    claimRefs: [CI005, CI008, CI009, CI013]
  - calloutType: risk
    title: Underwriting still turns on undisclosed merger economics
    body: >-
      Without current ARR, gross margin, retention by legacy customer base, and cash/runway data, the
      main risk is paying for integration ambition before seeing evidence of durable merged economics.
    claimRefs: [CI010, CI011, CI013, CI014]
