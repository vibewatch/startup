schemaVersion: report-v2
artifact: financials
slug: clari
runDate: 2026-10-16
company:
  name: Clari
chapter:
  number: 4
  title: Financials
  summary: >-
    Clari's public materials support an enterprise, multi-module revenue-operations software model,
    but they do not disclose the merged company's current ARR, revenue, gross margin, cash balance,
    burn, or runway. The best public commercial signals are company-issued ROI case-making and
    third-party adoption and implementation proxies, so the financial verdict is that Clari may have
    strong enterprise value capture but still lacks the disclosed unit economics needed for clean
    underwriting.
sections:
  - id: revenue-model
    title: Revenue model and disclosed monetization
    body: >-
      The assigned evidence supports a broad enterprise software monetization model rather than a
      simple point product. Clari's official surfaces describe one revenue orchestration platform
      spanning revenue data, forecasting, workflow automation, retention, and AI agents, while the
      Forecast page explicitly says the product is built for subscription and consumption revenue
      models. That supports a recurring-software thesis with module expansion, but not revenue
      recognition detail. Public pricing remains notably thin: ZoomInfo describes Clari as quote-based
      with no public pricing, and Docket's procurement synthesis estimates module pricing ranges
      rather than citing vendor list cards. The implication is that list-to-realized pricing,
      discounting, seat minimums, services attach, and module attach rates remain diligence asks
      instead of disclosed facts.
    claimRefs: [CI001, CI002, CI003, CI004, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: customer-value-proxies
    title: Public value and sales-efficiency proxies
    body: >-
      Public evidence is much stronger on customer value messaging than on booked revenue. The
      SoftwareReviews profile shows solid renewal and cost-to-value sentiment, suggesting that users
      who complete implementation can see durable utility. Company-issued Forrester/Clari materials
      go much further, citing 398% ROI, sub-six-month payback, stronger renewal rates, and lower
      admin time in a composite enterprise study. Those figures are useful as commercial proof points,
      but they are not equivalent to Clari's own realized revenue, margins, or customer-retention
      disclosures. Financially, they support the idea that Clari sells into expensive enterprise pain
      points where forecast accuracy and retention lift can justify budget, while still leaving the
      current merged company's actual revenue scale and efficiency unverified.
    claimRefs: [CI005, CI008, CI009, CI015]
    tableRefs: [TI003]
  - id: delivery-costs
    title: Cost structure and delivery-burden signals
    body: >-
      The strongest public warnings in the assigned pool concern implementation and operating burden.
      SoftwareReviews feedback says initial data integration requires effort and that Clari struggles
      when revenue moves through service-heavy amendments rather than classic deals. Default and
      Docket, both competitor-authored reviews, are directionally consistent that rollouts can take
      8-16 weeks, require extra services or admin resources, and fit organizations with dedicated
      RevOps ownership. That points to a cost structure in which professional services, admin time,
      and change-management effort matter to realized gross margin and payback. Because Clari does
      not publish services mix, support ratios, CAC, payback, or gross margin in the assigned public
      record, those burden signals are best treated as underwriting risks rather than solved economics.
    claimRefs: [CI006, CI007, CI012, CI014]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      Historical financing is observable, current liquidity is not. SiliconANGLE reported Clari's
      January 2022 $225 million round at a $2.6 billion valuation and said the company planned to
      add 300 employees, which demonstrates prior access to growth capital but says little about the
      merged Clari-Salesloft balance sheet in late 2026. Post-merger sources in this pool emphasize
      platform integration, AI positioning, and market-survey findings, not cash on hand, debt
      obligations, burn, or runway. As a result, the current capital-adequacy question is unresolved:
      the evidence supports strategic relevance and enterprise willingness to pay, but it does not
      establish whether the merged entity can self-fund integration, sustain services intensity, or
      avoid depending on future financing to reach a cleaner margin profile.
    claimRefs: [CI010, CI011, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Platform subscription, "Enterprise platform spanning forecasting, insights, workflows, and AI agents", "Seat / platform contract", "Core official offering; no public list card", "High confidence on scope, low confidence on realized ASP", "Provide current contract archetypes, minimum commits, and realized net-dollar retention by module"]
      - [Forecast module, "Forecasting and revenue-inspection software for subscription and consumption models", "Per-user / enterprise agreement", "Quote-based publicly; third-party range only", "Medium confidence", "Provide current price book, seat minimums, and attach rate versus broader platform"]
      - [Sales engagement / workflow layer, "Cadences and execution workflows folded into merged platform story", "Module / add-on", "Commercially relevant but integration still in progress", "Medium confidence", "Disclose bundle composition, implementation scope, and share of ARR from engagement products"]
      - [AI / conversation intelligence add-ons, "Copilot, AI agents, and conversation intelligence layered onto core workflow data", "Add-on module", "Marketed heavily; public monetization detail limited", "Low-to-medium confidence", "Disclose standalone pricing, attach rate, and incremental gross-margin profile"]
    notes: >-
      Combines official product descriptions with third-party pricing/procurement proxies. "Current
      value/status" distinguishes disclosed platform scope from undisclosed realized commercial terms.
    claimRefs: [CI001, CI002, CI003, CI004, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price / unit / contract
      - List vs realized pricing
      - Source
      - Implication
    rows:
      - [Clari overall commercial model, "Quote-based; no public pricing", "List pricing unavailable, realized pricing unknown", "ZoomInfo comparison", "Public evidence supports enterprise negotiated selling, not self-serve monetization"]
      - [Clari Forecast, "$100-$120 per user per month proxy", "Third-party estimate rather than vendor-published list price", "Docket procurement synthesis", "Useful for scenario work only; needs vendor quote and discount waterfall"]
      - [Clari Copilot / CI, "$60-$110 per user per month proxy", "Third-party estimate rather than vendor-published list price", "Docket procurement synthesis", "Economic contribution depends on attach and overlap with other tools"]
      - [Full stack, "$200-$310+ per user per month proxy; implementation $15k-$75k", "Estimated stack cost, not realized customer spend", "Docket procurement synthesis", "Implementation and admin burden can materially widen cash payback versus headline ROI claims"]
    notes: >-
      Official sources do not publish price cards in the assigned pool. Third-party ranges are
      scenario inputs, not audited price realization.
    claimRefs: [CI003, CI004, CI007, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["SoftwareReviews plan to renew", 92, medium, "Public renewal intent is the cleanest independent demand-retention proxy in the assigned pool", "Provide actual gross and net revenue retention by cohort and legacy Clari versus legacy Salesloft customer base"]
      - ["SoftwareReviews satisfaction of cost relative to value", 85, medium, "Suggests customers can justify spend after adoption, but not the price realization behind that sentiment", "Provide realized ASP, discounting bands, and expansion rates by segment"]
      - ["Composite-enterprise ROI claim", "398% ROI; payback under 6 months", medium, "Supports value proposition if study assumptions transfer, but it is company-issued marketing evidence", "Share study assumptions, customer mix, and audited before/after economics for named customers"]
      - ["Implementation timeline proxy", "8-16 weeks", low, "Services and admin intensity directly affect cash payback and gross margin", "Provide average implementation length, partner share, and time-to-value by segment"]
      - ["Ongoing admin load proxy", "10-15 hours per week during rollout", low, "High admin burden can slow adoption and increase true customer acquisition/support cost", "Provide post go-live admin time, customer success staffing ratios, and services margin"]
      - ["Current ARR / revenue / gross margin / cash / burn / runway", null, medium, "These are the core underwriting metrics and are not disclosed in the assigned public pool", "Provide current merged financial package with ARR, GAAP revenue, gross margin, opex, cash, burn, runway, and debt covenants"]
    notes: >-
      Numeric proxies combine independent review data, competitor-authored pricing/implementation
      commentary, and company-issued TEI claims. Null means unavailable in the assigned public record,
      not zero.
    claimRefs: [CI005, CI007, CI008, CI009, CI013]
