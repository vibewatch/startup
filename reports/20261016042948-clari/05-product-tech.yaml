  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-surface
      missingEvidence: Current first-party API documentation, SDK references, release cadence, or public developer-community signal for MCP or integration usage.
      whyItMatters: Extensibility is now part of Clari's AI story, but this pool does not prove how open, stable, or adopted that surface is in production.
      diligencePath: Request current API docs, sandbox access notes, changelog history, and customer examples of external AI or workflow integrations.
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Direct trust-center artifacts such as named certifications, DPA or privacy docs, incident history, and uptime or SLA disclosures.
      whyItMatters: Enterprise trust positioning is central to adoption, but public evidence here stops at vendor claims about controls and private AI behavior.
      diligencePath: Pull current trust-center pages, certification letters, subprocessor lists, and any public reliability or incident reporting surface.
    - type: private-evidence-only
      severity: material
      topic: post-merger-risk
      missingEvidence: A current SKU map, roadmap commitments, migration references, and customer proof that Forecast, Inspect, Copilot, and Salesloft workflows operate as one platform.
      whyItMatters: Product breadth is valuable only if packaging and workflow convergence are native enough to avoid admin sprawl and user-friction.
      diligencePath: Request post-merger packaging decks, implementation references, and architecture walkthroughs that show entitlement, identity, and workflow boundaries.
