  topStrengths:
    - Broad enterprise revenue-orchestration platform with clear workflow breadth and AI/data signal coverage.
    - Strong customer-value proof points from company-controlled ROI materials and independent forecasting reviews.
    - Large merged scale around 5,000+ customers and roughly $450M of combined ARR.
  topRisks:
