  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-gap
      missingEvidence: NRR, GRR, and customer churn data by cohort and vintage year
      whyItMatters: Without retention metrics it is impossible to assess whether JusPay's enterprise relationships are durable or whether high customer-count claims mask elevated churn
      diligencePath: Request cohort-level NRR/GRR from management; obtain reference calls with IndiGo, Agoda, and one India e-commerce customer
      relatedQuestionRefs:
        - QU016
      relatedTableRefs:
        - TU004

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: >-
        Full enumeration of all 500+ enterprise customers; the 12 named case study customers represent
        approximately 2% of the claimed customer base
      whyItMatters: >-
        Without broader customer enumeration it is impossible to assess whether named reference customers
        are representative or cherry-picked; the unnamed 488+ enterprises could include lower-quality or
        churned accounts
      diligencePath: >-
        Request a full customer list (anonymized by vertical and size if needed) from JusPay management;
        confirm top-20 by revenue or volume for concentration analysis
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: onboarding-mechanism
      missingEvidence: Typical enterprise onboarding duration and process documentation for JusPay
      whyItMatters: Onboarding friction affects customer acquisition rate and competitive differentiation; longer onboarding extends sales cycles
      diligencePath: Request customer onboarding playbook or average time-to-production metrics from JusPay's sales team
      relatedQuestionRefs:
        - QU020

    - type: missing-source
      severity: minor
      topic: developer-adverse-signals
      missingEvidence: Independent developer forum complaints or GitHub issue analysis for JusPay integration quality
      whyItMatters: Developer experience problems can slow enterprise adoption and increase support costs; adverse signals in developer community can predict churn
      diligencePath: Search GitHub issues for juspay/hyperswitch and developer forums for unresolved integration complaints
      relatedQuestionRefs:
        - QU023

disclaimer: >-
  This chapter is based on publicly available sources fetched during the June 2026 research run. JusPay is a
  private company; financial and customer concentration data is not publicly disclosed. All transaction volume,
  TPV, and enterprise-count figures are company-claimed and have not been independently audited. Case study
  outcomes are reported by JusPay/Hyperswitch and have not been independently verified with the named customers.
  The 2020 data breach information is sourced from news articles published January 2021; JusPay's official
  remediation steps are also company-reported. Retention cohort values in FU004 are analyst estimates only.
