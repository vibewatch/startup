company:
  name: Juspay
chapter:
  number: 6
  title: Customers
  summary: >-
    JusPay serves 500+ global enterprises processing 300M+ daily transactions at $1T+ annualized TPV. Named
    production customers span India e-commerce (Amazon India, Flipkart, Swiggy), airlines (IndiGo, Air India,
    Singapore Airlines), fintech (CRED, PhonePe, HDFC Bank), and APAC/MENA travel (Agoda, Tiket.com, Wego).
    Twelve Hyperswitch case studies provide quantitative outcome evidence. Key gaps include undisclosed NRR/GRR,
    unquantified Amazon India concentration, and unconfirmed post-2020-breach customer retention.

sections:
  - id: SU001
    title: Customer Base Scale and Enterprise Profile
    body: >
      JusPay operates as the payment infrastructure layer for some of India's most prominent digital commerce
      platforms and is rapidly expanding internationally. As of 2026, the company claims more than 500 enterprises
      globally on its payment-orchestration product page, up from earlier disclosures of 200+ enterprises circa
      2020–2022. Its Hyperswitch open-source platform page on GitHub states "400+ leading enterprises worldwide,"
      indicating the two product lines serve overlapping but distinct enterprise segments. The platform processes
      more than 300 million transactions per day and has surpassed one trillion dollars in annualized total payment
      volume, with 2.5 billion SDK installs across merchant apps. These headline metrics position JusPay among the
      largest payment-infrastructure players in Asia by volume. Customers span Indian e-commerce, food delivery,
      travel, financial services, and telecom verticals, with meaningful penetration into Southeast Asia and the
      Middle East. The vast majority of named customer relationships involve multi-product deployments (checkout
      SDK, orchestration, tokenization, offers engine), suggesting deep integration rather than point-tool adoption.
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU002
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005

  - id: SU002
    title: Named Customer Proof by Segment
    body: >
      JusPay has published a substantial corpus of named customer evidence across its official and open-source
      product surfaces. On hyperswitch.io, case studies are live for Agoda, IndiGo, Flipkart, Swiggy, Wego,
      Tiket.com, HDFC Bank, CRED, PhonePe, Air India, MakeMyTrip, and Jio—twelve distinct enterprises with
      specific deployment and outcome details. On juspay.io's blog, additional named customers appear in editorial
      posts: Amazon, Google, HSBC, Swiggy, Ola, Singapore Airlines, SpiceJet, and Etraveli Group are referenced
      as orchestration clients. News coverage from 2021, sourced from BusinessToday, FirstPost, and CNBC TV18,
      independently corroborates that Amazon India, Swiggy, MakeMyTrip, BookMyShow, Snapdeal, Yatra, and Freecharge
      were production clients as of 2020–2021. The breadth of named proof—covering e-commerce, food delivery,
      airlines, banking, fintech, travel, and telecom—demonstrates segment diversity. However, the depth of public
      evidence varies markedly: IndiGo and Agoda have quantitative outcome data while many others are referenced
      only in logo carousels or editorial context without independent corroboration.
    tableRefs:
      - TU003
    figureRefs:
      - FU003
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013

  - id: SU003
    title: Use Cases, Deployments, and Outcome Evidence
    body: >
      The most detailed publicly available case studies come from the Hyperswitch platform's case study library.
      IndiGo, India's largest airline by passenger volume, deployed JusPay's Express Checkout, Tokenization,
      Offers Engine, and Price Lock, added eight new payment gateways, and reported approximately 10% reduction
      in overall processing costs alongside a measurable decline in fraud rates. Agoda, the Singapore-based online
      travel agency, integrated JusPay across five Asian markets—Vietnam, Japan, Taiwan, Saudi Arabia, and
      Singapore—enabling local payment methods including VNPay, PayPay, LinePay, Apple Pay, and UPI, with improved
      conversion rates and faster reconciliation. Swiggy (food delivery, 700 Indian cities) reduced its UPI
      checkout flow from six steps to two using HyperUPI and Express Checkout, addressing cart abandonment at the
      payment step. Flipkart implemented SAFE 3DS SDK with Native OTP to eliminate missed or delayed OTP entries,
      boosting card success rates. Wego, the Middle East travel marketplace, deployed smart routing and unified
      reconciliation across Saudi Arabia and the UAE. Tiket.com (Indonesia) expanded from domestic to 10+ countries,
      processing 40 simultaneous local payment methods with a 99% reconciliation rate. These outcomes confirm that
      JusPay's core value proposition—improved authorization rates, reduced friction, multi-gateway redundancy, and
      local-method coverage—delivers measurable results across geographies and verticals.
    tableRefs: []
    figureRefs:
      - FU001
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021

  - id: SU004
    title: Retention Signals, Satisfaction, and Evidence Gaps
    body: >
      JusPay has not published Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or customer churn
      data. No investor filings, analyst notes, or press releases disclose cohort-level retention statistics.
      Indirect retention signals are available: relationships with Amazon India and Swiggy appear to span at
      least five to seven years based on cross-referencing news coverage from 2017–2024; Flipkart, CRED, and
      PhonePe are recurring reference customers across multiple years; IndiGo's case study describes ongoing
      product expansion (not a one-time integration), implying active and growing use. The GetApp listing for
      JusPay (2026) highlights "200 million transactions daily" and PCI DSS, ISO, and SOC2 compliance, suggesting
      the platform is positioned as a sticky infrastructure layer rather than a commodity service provider. The
      structural stickiness argument is credible: deep SDK integration, multi-gateway routing logic, tokenization
      vaults, and custom checkout flows are expensive to replicate and re-integrate with a competitor. However,
      without disclosed NRR or cohort data, retention durability cannot be independently verified. The diligence
      path is a direct reference check with IndiGo, Agoda, or Amazon India, and a request for cohort data in the
      management presentation.
    tableRefs:
      - TU004
    figureRefs:
      - FU004
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU034
      - CU035

  - id: SU005
    title: International Expansion, Concentration Risk, and Adverse Signals
    body: >
      JusPay's international expansion is increasingly evidenced in public sources. As of 2026, the company
      serves customers in APAC (Japan, Taiwan, Vietnam, Singapore, Indonesia, Australia), MENA (Saudi Arabia,
      UAE), Europe (through Hyperswitch), and North America (Hyperswitch US launch). The APAC-focused blog post
      from 2026 names Amazon, Google, and Microsoft as enterprise clients in the region. The unnamed global
      airline case study describes a deployment spanning 20+ countries with 8 new acquirer integrations.
      Concentration risk is material but evolving: Amazon India was historically the most prominent named customer
      and likely the largest by transaction volume, though no revenue concentration data is public. If Amazon
      India represents a large share of revenue, any migration or renegotiation event could significantly affect
      reported metrics. Offsetting factors include the breadth of the named customer list across diverse verticals
      (e-commerce, banking, airlines, food delivery, telecom) and the growing international revenue mix. The most
      significant adverse signal in the customer record is the August 2020 data breach: an unauthorized actor
      exploited an unrecycled AWS access key to access a storage system containing 35 million customer records
      (masked card data, card fingerprints) and metadata for up to 100 million users. Cybersecurity experts quoted
      in CNBC TV18 called the company's response "highly irresponsible" for not disclosing to end-users promptly,
      and CSO Online reported the potential for card data to be cracked via hash-collision attacks. JusPay
      confirmed the breach and detailed its remediation steps, but the incident raises due-diligence questions
      about enterprise client trust and any resulting contract renegotiations or customer churn post-2020.
    tableRefs:
      - TU005
    figureRefs: []
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033

