callouts:
  - calloutType: strength
    title: Exceptional Named Customer Depth for a Private Company
    body: >-
      JusPay has twelve live Hyperswitch case studies across diverse verticals and geographies, with four
      featuring quantitative outcomes. This density of public customer evidence is rare for a private
      infrastructure company and materially de-risks the customer validation question.
    claimRefs:
      - CU006
      - CU014
  - calloutType: risk
    title: Amazon India Concentration Risk is Unquantified
    body: >-
      Amazon India is the most prominently referenced customer historically and likely represents a
      disproportionate share of transaction volume. No revenue or volume concentration data is public.
      Loss or renegotiation of this relationship would be material and is a mandatory diligence ask.
    claimRefs:
      - CU028
      - CU029
  - calloutType: risk
    title: 2020 Data Breach Requires Adverse Customer Reference Check
    body: >-
      The August 2020 breach exposed 35 million masked-card records and metadata for up to 100 million
      users. Cybersecurity experts called the response "highly irresponsible." Post-breach customer
      retention is unconfirmed independently. Diligence must include enterprise customers active in
      2020 to 2021.
    claimRefs:
      - CU031
      - CU032
      - CU033
  - calloutType: insight
    title: International Expansion Validates the Global ICP
    body: >-
      Deployments in Japan, Vietnam, Taiwan, Saudi Arabia, UAE, and Indonesia confirm that JusPay's
      product works outside India at scale. Agoda and Tiket.com are credible international validators,
      reducing India-concentration risk over time.
    claimRefs:
      - CU027
      - CU019

