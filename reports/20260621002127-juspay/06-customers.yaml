figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Enterprise merchant journey from initial discovery through production deployment and product expansion
      on JusPay's platform, synthesized from published case studies.
    data:
      nodes:
        - id: discovery
          label: Discovery
          description: Enterprise identifies payment need; JusPay found via Hyperswitch OSS on GitHub, analyst referral, or peer reference from existing customer
        - id: evaluation
          label: Evaluation
          description: Technical review of SDK, API docs (docs.juspay.io), sandbox testing; procurement and security assessment
        - id: pilot
          label: Pilot
          description: Single-country or single-payment-method integration; typically Express Checkout or basic orchestration
        - id: production
          label: Production Launch
          description: Full checkout SDK or orchestration go-live; PCI DSS, tokenization, 3DS compliance validated
        - id: expansion-product
          label: Product Expansion
          description: Add modules including Offers Engine, Recurring Payments, HyperUPI, Airborne SDK updates
        - id: expansion-geo
          label: Geographic Expansion
          description: New market entry with local payment methods; additional acquirer integrations across borders
        - id: strategic-reference
          label: Strategic Reference
          description: Joint case study publication; airline or bank-tier reference; co-marketing or equity relationship
        - id: adverse-exit
          label: Churned or At Risk
          description: Competitor migration or renegotiation; data breach trust impact; pricing pressure from alternatives
    approximationNotes: >-
      Journey stages synthesized from published case studies and JusPay blog content; not based on
      company-disclosed funnel data.
    claimRefs:
      - CU014
      - CU015
      - CU016
