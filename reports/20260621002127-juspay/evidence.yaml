    severity: material
    topic: customers
    missingEvidence: >-
      Full named customer roster with contract values, transaction share per customer, and renewal dates; Juspay's
      complete enterprise client list is not publicly disclosed beyond approximately 15 named accounts.
    whyItMatters: Customer concentration risk and churn risk cannot be assessed from public data alone.
    diligencePath: Request customer list with revenue attribution and top-10 customer concentration from Juspay data room.
    relatedQuestionRefs:
