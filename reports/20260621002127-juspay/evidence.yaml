  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: >-
      Full board composition, investor director seats, and complete executive org chart for Juspay; the company has not
      publicly disclosed its board of directors, governance committee structure, or investor governance rights.
    whyItMatters: >-
      Key-person and governance risk cannot be fully assessed without board structure; at a $1.2B valuation the
      governance profile of directors and investor control rights is a material diligence item.
    diligencePath: >-
      Request board structure, director backgrounds, and investor governance rights from Juspay investor relations team;
      review Series D term sheet for board seat provisions.
