  - id: execution-governance
    title: "Execution, Governance, and Disclosure Risks"
    body: >
      Juspay's leadership team is founder-led: CEO Vimal Kumar and COO/Co-founder Sheetal
      Lalwani drive strategy, with a third co-founder Ramanathan RV having exited in 2019.
      Founder concentration in a small team running a now-unicorn with $1 trillion TPV
      creates succession and key-person risk. The company employs 1,500+ payment experts
      across Bengaluru, San Francisco, Dublin, São Paulo, Singapore, and Dubai, but
      international scaling of regulated fintech operations demands executive depth in
      compliance, legal, and banking partnerships that is difficult to maintain at pace.

      On governance, Juspay is a private company with voluntary corporate disclosures on
      its website but no audited IFRS/GAAP international financial statements in the public
      domain. FY25 audited financials (PAT ₹62 crore on revenue ₹514 crore) were reported
      via the Registrar of Companies and reviewed by MediaNama, but the full income
      statement, balance sheet, and notes are not freely accessible. Investor-level
      disclosures are shared only with WestBridge, Kedaara, SoftBank, and Accel, creating
      an information asymmetry that limits third-party diligence on burn rate, working
      capital, and contingent liabilities. The January 2026 $50M Series D at $1.2B
      valuation included a meaningful secondary component for liquidity, which, while
      investor-friendly, reduces net primary capital available for the international
      expansion stated as the use of proceeds. Key-person and thin-bench risk is unrated
      in public disclosures.
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR028
