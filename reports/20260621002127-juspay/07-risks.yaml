  - id: competitive-dependency
    title: "Competitive and Partner/Dependency Risks"
    body: >
      The most acute near-term structural risk is the orchestration-layer exit by major
      Indian payment aggregators. PhonePe severed its Juspay integration in December 2024,
      followed by Razorpay and Cashfree in January 2025. The stated reason was a desire for
      direct merchant integration to control data, compliance, and feature velocity, but the
      underlying driver is Juspay's PA-licence conversion from neutral orchestration layer
      into a competing aggregator. Approximately 15% of PhonePe's payment gateway volume
      was reportedly routed through Juspay, and the combined departure of three major PAs
      represents a material routing-revenue and volume risk. Juspay disputes the impact,
      arguing it is a TSP to merchants, not to PAs, and that merchants will simply
      integrate directly with Juspay's own PA service, but this logic requires merchants to
      re-integrate—creating switching friction and competitive vulnerability to embedded
      offers from Razorpay (Optimizer) and Cashfree (FlowWise).

      Customer concentration is a secondary risk: Amazon, Swiggy, Flipkart, Google, IndiGo,
      and HSBC account for a disproportionate share of 300 million daily transactions.
      Juspay claims 500+ enterprise clients, but the revenue contribution distribution is
      not publicly disclosed. A single large-client churn or in-house build—common for
      hyperscalers—would be material. Cloud/infrastructure dependency on AWS with no
      disclosed multi-cloud failover architecture is an additional single-point-of-failure
      concern. International expansion into the GCC, APAC, Latin America, Europe, and North
      America multiplies currency, licensing, and banking partner dependencies.
    claimRefs:
