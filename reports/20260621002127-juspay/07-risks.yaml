company:
  name: Juspay

chapter:
  number: 7
  title: Risks
  summary: >
    Juspay faces a layered risk profile anchored in India's evolving payment-aggregator
    regulatory regime, the 2020 data breach legacy and ongoing AWS-era credential hygiene
    questions, and a structural competitive disruption caused by PhonePe, Razorpay, and
    Cashfree severing orchestration integrations in late 2024–early 2025. Customer
    concentration in a handful of large-platform clients (Amazon, Swiggy, Flipkart) and
    single-geography revenue dependence amplify financial exposure. International expansion
    into the Middle East and Latin America adds multi-regulatory complexity with limited
    governance visibility. Mitigations are partially in place—RBI PA licences obtained,
    99.999% uptime claimed, first-year profitability achieved—but several kill-criteria
    thresholds remain unmonitored in public disclosures.

sections:
  - id: regulatory-legal
    title: "Regulatory and Legal Risks"
    body: >
      Juspay operates under India's tightened payment-aggregator (PA) framework issued by
      the Reserve Bank of India (RBI) as the Master Direction on Regulation of Payment
      Aggregators, effective September 15, 2025. This consolidated directive supersedes all
      prior guidelines and for the first time brings physical-point-of-sale aggregators
      (PA-P) under the same licensing and capital umbrella as online (PA-O) and cross-border
      (PA-CB) aggregators. Juspay holds its online PA licence (February 2024) and PA-CB
      licence (November 2025), making it among the earliest non-banks to hold all three
      categories. However, the licence expansion is a double-edged risk: it directly
      triggered the orchestration-layer exit by competing PAs who perceive Juspay as a
      conflict-of-interest competitor rather than a neutral technology layer.

      The RBI framework imposes minimum net worth of ₹15 crore at authorisation rising to
      ₹25 crore by year three, continuous escrow maintenance at a scheduled commercial bank,
      mandatory FIU-IND registration, quarterly escrow audits, annual CERT-In cyber
      audits, monthly transaction reporting, and T+1 settlement obligations. Non-compliance
      risks monetary penalties under the Payment and Settlement Systems Act 2007, licence
      suspension, and public naming. The Digital Personal Data Protection Act (DPDPA) 2025
      adds a layered obligation around cross-border data transfers and consent, whose
      interaction with the RBI's existing data-localisation circular (all payment data
      stored in India, foreign copies deleted within 24 hours) remains ambiguous and could
      create compliance costs or operational restrictions for Juspay's international
      expansion strategy. No known enforcement action against Juspay was on record as of
      June 2026, and independent legal analysis characterises the company's compliance
      posture as strong, but the regulatory cost burden is rising significantly.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
    tableRefs:
      - TR001
