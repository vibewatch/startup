callouts:
  - calloutType: risk
    title: "PA Exit Wave: Structural Threat to Orchestration Revenue"
    body: >
      The simultaneous exit of PhonePe (Dec 2024), Razorpay, and Cashfree (Jan 2025) from
      Juspay's orchestration layer is not a temporary dispute—it reflects a structural shift
      in the Indian payments stack driven by Juspay's own PA licence conversion. Each
      departing PA is now a competitor, and each has or is building its own orchestration
      product (Razorpay Optimizer, Cashfree FlowWise, PhonePe in-house). If Juspay cannot
      re-anchor merchant relationships directly under its PA umbrella, the orchestration
      revenue line faces multi-year erosion with no structural floor other than enterprise
      stickiness.
    claimRefs:
      - CR017
      - CR018

  - calloutType: risk
    title: "2020 Data Breach Legacy: Governance and Disclosure Gap"
    body: >
      The August 2020 data breach—involving up to 100 million user records—was not publicly
      disclosed until a researcher surfaced the data for sale on the darknet in January 2021,
      five months after the incident. Security researchers criticised Juspay as "highly
      irresponsible" for the delay and the potential to reverse-engineer card fingerprints.
      While remediation steps were taken, no independent post-incident audit has been
      publicly released, and DPDPA 2025 would now require prompt breach disclosure. A
      recurrence under the new law would carry DPDPA penalties plus reputational damage
      to the enterprise clients who are the company's lifeblood.
    claimRefs:
      - CR009
      - CR010
      - CR011

