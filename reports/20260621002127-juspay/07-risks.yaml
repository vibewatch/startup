  - id: operational-security
    title: "Operational, Technology, and Security Risks"
    body: >
      The August 2020 data breach—where an unrecycled AWS access key allowed unauthorised
      access to a datastore holding masked card data and user metadata for an estimated
      35–100 million records—remains the most material adverse event in Juspay's history.
      The breach was not disclosed publicly until a cybersecurity researcher discovered the
      data for sale on darknet forums in January 2021, raising transparency and governance
      concerns that persisted into subsequent funding discussions. Juspay remediated by
      rotating AWS credentials, adopting IAM-role-based access, enforcing 2FA on all
      internal tools, and engaging threat-intelligence monitoring. The company asserts no
      full card numbers, CVVs, PINs, or transaction data were accessed, and the PCI-DSS
      card vault was not compromised. Independent researchers, however, flagged that the
      card fingerprints could be reverse-engineered and that plain-text email and phone
      numbers increase phishing risk.

      On the uptime front, Juspay self-reports 99.999% reliability and the status page
      shows API, payment page, and SDK all operational as of June 2026. A May 26, 2026
      incident caused temporary 5xx errors from an automated AWS KV-store failover, but
      resolved without manual intervention. The most recent sustained sandbox unavailability
      ran 25 days in August–September 2025. Operational reliance on AWS is a concentration
      risk: a major AWS outage in India regions would directly impair services. PCI DSS
      v4.0.1 compliance is required by March 2025 globally; Juspay claims Level-1 PCI DSS
      certification, which reduces card-fraud liability. Fraud risk is managed through
      tokenisation, 3DS authentication, and AI-based routing, though detailed fraud-rate
      disclosures are absent from public filings.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
