      - number: '4.3'
        title: Capital Adequacy, Funding History, and Forward Liquidity
        blocks:
          - type: paragraph
            body: >
              Juspay has raised over $170M in disclosed equity across its funding history. Accel provided early
              institutional backing from around 2016; VEF led the 2020 Series B; SoftBank Vision Fund 2 led a $60M
              Series C in December 2021 at approximately $460M valuation alongside Wellington Management and VEF. In
              April 2025 Kedaara Capital led a $60M Series D (with ~$10M primary and ~$50M secondary) at ~$900M
              valuation, with SoftBank and Accel participating; VEF sold part of its 10.2% stake for $14.8M in the
              secondary component. In January 2026 WestBridge Capital invested $50M (primary plus secondary) at a $1.2B
              valuation — making Juspay India's first unicorn of 2026 — with Avendus Capital as financial advisor.

              The consecutive near-term liquidity events (both the April 2025 and January 2026 rounds included secondary
              components) suggest investors are monetizing early positions in the absence of an IPO path, while the
              primary proceeds fund global expansion. FY24 disclosed cash and bank balances totaled approximately ₹220
              crore (~$26M); FY25 management stated cash burn was near zero with positive operating cash flow, implying
              the balance was largely preserved. With $50M primary capital raised in January 2026 and operating cash
              generation positive, the short-to-medium-term liquidity position appears adequate for the disclosed FY26
              investment plan.

              The company carries one disclosed loan per MCA records, and RBI payment aggregator requirements mandate a
              minimum net worth of ₹25 crore, which Juspay's current capital base and retained earnings should satisfy,
              though the exact net-worth composition (paid-up capital ₹13.3 crore plus reserves) requires direct
