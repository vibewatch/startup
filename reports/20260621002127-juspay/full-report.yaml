      - number: '7.5'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Several mitigations are structurally in place: dual RBI licences (PA-O + PA-CB) provide a lawful and
              defensible regulatory foundation; first-year profitability (FY25) reduces burn risk; 99.999% claimed
              uptime and automatic AWS failover provide operational resilience; Level-1 PCI DSS certification caps
              card-fraud liability; and open-source HyperSwitch positions Juspay as a neutral infrastructure play beyond
              India's contested orchestration market. International geographic diversification (Middle East DIFC hub,
              APAC, Latin America, Europe, North America) reduces single-market regulatory concentration risk over time.

              Critical unresolved risks include the absence of a published multi-cloud redundancy architecture, lack of
              disclosed revenue concentration metrics, no public DPDPA compliance assessment, no disclosed fraud-rate or
              chargeback-rate benchmarks, and limited independent board oversight for a company of this valuation. Kill
              criteria for diligence purposes include: loss of any top-3 client representing >20% of TPV without
              replacement; any new RBI enforcement action or licence suspension; a second material data breach
              triggering DPDPA penalties; and the orchestration revenue line declining by more than 25% year-over-year
              as a result of the PA exit wave.
            claimRefs:
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
          - type: table
            tableRef: TR005
