      - number: '3.4'
        title: Moats, Lock-In, and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              Juspay's primary competitive moats are fourfold. First, open-source trust: HyperSwitch's Apache 2.0
              codebase with 42,000+ GitHub stars enables procurement-team code audits and creates a developer-community
              flywheel effect that proprietary competitors cannot replicate; the repository had 4,800+ forks and 246+
              contributors as of mid-2026. Second, scale credibility: the same Rust-based engine that powers 300 million
              daily transactions and over $1 trillion annualized TPV provides an enterprise-grade reference that startup
              orchestrators cannot claim without a decade of production scale. Third, the Tartarus sovereign card vault,
              which gives enterprises full data sovereignty over tokenized card credentials—eliminating the proprietary
              vault lock-in mechanism used by Stripe and Adyen, where merchants who store card tokens in the vendor's
              vault face prohibitive migration costs at contract renewal. Fourth, Indian regulatory posture: Juspay
              received RBI payment aggregator authorization in 2024, creating an access barrier for smaller
              orchestrators entering the India market. The key displacement risks are vertical integration and
              commoditization. On vertical integration, the departure of PhonePe (approximately 15% of prior gateway
              volume), Razorpay, and Cashfree from Juspay's orchestration pipeline in 2024–2025 demonstrates that large
              aggregators prefer direct merchant relationships over paying an orchestration fee to a third-party routing
              layer. On commoditization, Primer and Spreedly now offer comparable multi-PSP routing with no-code
              workflow builders, potentially eroding HyperSwitch's differentiation unless its open-source community size
              and contributor velocity are sustained. Juspay's response to the India PA departure narrative has been
              that it is a TSP to merchants, not a payments intermediary, and that any PA unwilling to work through an
              orchestration layer will ultimately lose merchants to competitors. This positions global HyperSwitch
              enterprise wins as the primary growth vector and materially reduces revenue concentration risk from India
              PA integration partners.
