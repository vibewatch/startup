      - number: '8.2'
        title: Investment Thesis, Scenarios, and Comparable Set
        blocks:
          - type: paragraph
            body: >
              The investment bull thesis rests on three pillars: (1) JusPay has cemented a position as critical digital
              payments infrastructure for India's largest enterprises and a growing base of global banks, giving it very
              high switching costs and near-zero churn; (2) the Hyperswitch open-source platform (43,000+ GitHub stars
              as of mid-2026) is a credible moat-widener that lowers global enterprise acquisition cost and creates
              developer-community lock-in; and (3) the company achieved GAAP profitability in FY25 on modest lifetime
              primary capital (~$130M), implying strong unit economics that are scalable if the global mix improves. The
              anti-thesis centres on the disruption risk from payment gateways bypassing JusPay's orchestration
              layer—Razorpay, PhonePe, and Cashfree together instructed merchants to stop using third-party
              orchestrators beginning December 2024/January 2025—and on the geographic concentration that makes FY26
              revenue a single-country bet until global contracts mature.


              Bull case (20–25% probability): JusPay executes its global banking infrastructure build-out, India
              revenues hold at 50%+ growth driven by new bank contracts, and gateway dispute resolves or proves
              non-material; FY27 revenue reaches $120–140M, supporting a $2.0–2.8B valuation at 15–20x on
              growth-adjusted multiples. Base case (45%): India revenue growth moderates to 25–35% amid gateway
              headwinds, global revenues ramp slowly (5–8% of revenue by FY27), profitability holds; FY27 revenue
              ~$90–100M, fair value ~$1.3–1.8B at 13–18x. Bear case (35%): Gateway disintermediation accelerates and
              JusPay loses 20–30% of its India POP revenues, global contracts under-deliver, IPO window narrows; FY27
              revenue ~$55–65M, valuation pressure to $500–800M (8–12x multiples) representing a down-round risk from
              the current mark.


              The comparable set spans four tiers: (a) public high-growth payment infrastructure—Adyen (~$43B market
              cap, 20x revenue, 47%+ EBITDA margin, 20–22% constant-currency growth in 2026); (b) private global-scale
              orchestrators—Stripe ($159B, ~23x revenue, ~$1.9T 2025 TPV); (c) Indian fintech comparables—Razorpay
              (targeting $5–6B IPO at ~10–13x FY25 revenue ₹3,783 crore, following a 33% haircut from its 2021 peak of
              $7.5B); and (d) regional payments infrastructure—Checkout.com (~$11B private, ~10–14x estimated). JusPay's
              18–20x multiple sits between tiers (a)/(b) and (c)/(d), justified in part by its profitability and TPV
              scale, but stretched relative to Indian-market comps given the India concentration.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
