  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Juspay's addressable market is not the full digital-payment system; it is the enterprise software layer
              that sits on top of payment rails. The company operates on the global homepage (juspay.io) as a "Global
              Payments Operating System" targeting 500+ enterprises across e-commerce, travel, hospitality, and banking,
              while the India-facing product surface (juspay.in) addresses a different set of buyers — merchants needing
              HyperCheckout, HyperUPI, Express Checkout, Payouts, and affordability products including HyperCredit.
              Three distinct market perimeters are visible from the evidence. First, Indian payment aggregation and
              orchestration: Juspay received its RBI Payment Aggregator licence in February 2024, entering a licensed
              segment where Razorpay, Cashfree, PayU, Paytm, PhonePe, CCAvenue, and Pine Labs are active participants.
              Second, global payment orchestration software: via Hyperswitch (hyperswitch.io), an open-source,
              composable platform connecting 300+ PSPs and acquirers across 50+ countries, Juspay competes with Adyen,
              Stripe, Checkout.com, Spreedly, and Primer for enterprise merchants wanting multi-PSP independence. Third,
              bank and card-scheme infrastructure: Juspay's UPI Issuing, Acquiring, and TPAP stacks target banks and
              financial institutions wanting to operate or extend payment infrastructure. Each perimeter has different
              buyers, substitutes, and economics. Status-quo substitutes differ sharply by segment. In India, large
              enterprise merchants historically used Razorpay or Cashfree as direct PGs and built their own routing
              logic in-house; mid-market merchants relied on hosted checkout pages from individual aggregators.
              Globally, Stripe and Adyen function as the dominant single-vendor default; merchants building multi-PSP
              strategies typically use internal engineering resources to integrate PSPs individually rather than an
              independent orchestration layer. Banks building UPI infrastructure could partner with an IT integrator
              (TCS, Infosys, Wipro) or work directly with NPCI frameworks. The decision to use Juspay versus these
              substitutes hinges primarily on how many PSPs a merchant wants to connect, how much internal engineering
              capacity they are willing to deploy, and whether they want a vendor-neutral orchestration layer that lets
              them change PSPs without code rewrites.
