      - number: '4.2'
        title: Financial Performance Trajectory FY22–FY25
        blocks:
          - type: paragraph
            body: >
              Juspay's revenue grew at a compound annual rate of approximately 66% from ₹112.7 crore in FY22 to ₹514
              crore in FY25 — one of the stronger sustained growth rates among Indian B2B fintech infrastructure
              companies. Losses were roughly flat through FY22 and FY23 at ~₹105 crore each year, then narrowed to ₹97.5
              crore in FY24 as revenue scaled past the fixed-cost base. In FY25 the company swung to a profit after tax
              of ₹62.28 crore — driven primarily by a 22% decline in employee costs (from ₹303 crore to ₹237 crore)
              combined with a 61% revenue increase, creating strong operating leverage.

              FY25 EBITDA (before exceptional items and tax) reached ₹115 crore, confirming genuine operating
              profitability rather than a deferred-tax accounting artifact, though the PAT also benefited from a ₹35
              crore deferred tax exceptional item that pushed the reported PAT above the profit-before-tax of ₹27 crore.
              Total income including non-operational items is reported by some sources at ₹540 crore versus the
              operating revenue figure of ₹514 crore; the ₹26 crore difference appears to be interest and financial
              instrument gains, consistent with the ₹28.3 crore non-operating income seen in FY24.

              Daily transaction volume nearly doubled from 175M to over 300M during FY25, and annualized TPV surged 150%
              from $400B to $1T — operational metrics consistent with the revenue growth rate. Management guided for
              sustained profitability in FY26 while investing in AI capabilities, Hyperswitch (open-source
