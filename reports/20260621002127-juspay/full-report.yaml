              - CR037
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'PA Exit Wave: Structural Threat to Orchestration Revenue'
            body: >
              The simultaneous exit of PhonePe (Dec 2024), Razorpay, and Cashfree (Jan 2025) from Juspay's orchestration
              layer is not a temporary dispute—it reflects a structural shift in the Indian payments stack driven by
              Juspay's own PA licence conversion. Each departing PA is now a competitor, and each has or is building its
              own orchestration product (Razorpay Optimizer, Cashfree FlowWise, PhonePe in-house). If Juspay cannot
              re-anchor merchant relationships directly under its PA umbrella, the orchestration revenue line faces
              multi-year erosion with no structural floor other than enterprise stickiness.
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
          - type: callout
            title: '2020 Data Breach Legacy: Governance and Disclosure Gap'
            body: >
              The August 2020 data breach—involving up to 100 million user records—was not publicly disclosed until a
              researcher surfaced the data for sale on the darknet in January 2021, five months after the incident.
              Security researchers criticised Juspay as "highly irresponsible" for the delay and the potential to
              reverse-engineer card fingerprints. While remediation steps were taken, no independent post-incident audit
              has been publicly released, and DPDPA 2025 would now require prompt breach disclosure. A recurrence under
              the new law would carry DPDPA penalties plus reputational damage to the enterprise clients who are the
              company's lifeblood.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >
              JusPay reached unicorn status in January 2026 when WestBridge Capital led a $50 million Series D follow-on
              that pegged the company's valuation at $1.2 billion—a 33% step-up from the $900 million mark set in the
              Kedaara-led $60 million round of April 2025 and more than a 2.5x uplift from the $460–478 million Series C
              valuation of December 2021. The January 2026 transaction was a mix of primary and secondary components;
              the secondary portion provided the second ESOP and early-investor liquidity event within twelve months,
              signalling that the cap table is being managed toward a medium-term exit. Avendus Capital served as
              financial advisor to both the April 2025 and January 2026 rounds, consistent with an eventual IPO
              preparation process. Total primary capital raised over the company's life is approximately $120–130
              million against $197 million in disclosed round sizes (the rest being secondary transfer); lifetime
              dilution remains modest by unicorn standards.


              On a last-twelve-months revenue basis using FY25 operating revenue of ₹514–540 crore (~$62–65M at
              ₹83/USD), the implied EV/Revenue multiple is approximately 18–20x. This sits below Adyen's ~20x public
              market multiple and broadly in line with the 15–23x range for high-growth private payment infrastructure
              peers such as Stripe ($159B, ~23x) and Checkout.com ($11B, ~10–14x estimated). The multiple premium over
              legacy acquirers (2–6x) and Razorpay's IPO-target multiple (~10–13x on FY25 revenue) reflects JusPay's
              profitable-infrastructure positioning, $1T+ TPV scale, and stickiness with marquee enterprise and banking
              clients.


              Key valuation risk factors that can compress the multiple include: India revenue concentration (98–99% of
              revenues), the unresolved gateway disintermediation dispute with Razorpay, PhonePe, and Cashfree, the lack
              of a confirmed IPO timeline, and the illiquidity premium inherent in a private company that has not yet
              filed for a public offering.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
