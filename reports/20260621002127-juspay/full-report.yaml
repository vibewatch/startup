          value: 7
          unit: /10
          context: FY25 revenue ₹514–540 crore confirmed; 61% YoY; FY26 trajectory unconfirmed
        - label: Technology moat
          value: 8
          unit: /10
          context: Hyperswitch 43K+ GitHub stars; open-source lock-in; 90+ PSP integrations; first-principles infra
        - label: Customer proof
          value: 8
          unit: /10
          context: Amazon, Flipkart, Google, HSBC, IndiGo; near-zero churn stated; 500+ enterprises
        - label: Unit economics
          value: 7
          unit: /10
          context: FY25 PAT ₹62 crore; PBT before exceptionals ₹115 crore; modest burn on ~$130M primary capital
        - label: Risk profile
          value: 4
          unit: /10
          context: India 98-99% concentration; gateway disintermediation ~50% POP revenue; PA licence conflict
        - label: Valuation discipline
          value: 4
          unit: /10
          context: 18–20x LTM revenue stretched; illiquidity discount warranted; no confirmed FY26 guidance
        - label: Evidence quality
          value: 5
          unit: /10
          context: FY25 MCA/press confirmed; FY26 data missing; cap table undisclosed; no DRHP
    approximationNotes: >-
      Scores are analyst assessments on a 0–10 scale based on evidence gathered as of 2026-06-21. Not a quantitative
      model output.
