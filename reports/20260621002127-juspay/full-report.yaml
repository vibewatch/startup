      - number: '3.3'
        title: Global Payment Orchestration Competitors
        blocks:
          - type: paragraph
            body: >
              At the global orchestration layer, Stripe is the dominant proprietary incumbent with $1.9 trillion in
              payment volume processed in 2025, 135+ currencies, and 99.999% historical uptime. For Indian merchants,
              Stripe charges 2% for domestically issued Mastercard and Visa cards and 3% for internationally issued
              cards, with domestic debit MDR capped at Rs 200. Stripe operates in India on a restricted-invite basis as
              of 2026. Adyen, a public company listed on Euronext Amsterdam, operates a unified end-to-end platform
              covering processing, acquiring, and issuing with banking licenses in the US, UK, and EU, and 99.999%
              historical uptime; its direct-acquiring model differentiates it structurally from pure orchestration
              layers. Checkout.com positions itself as a performance-first payments network, with its Flow product (a
              low-code checkout builder) and enterprise clients including Microsoft. Primer, which raised a $100 million
              Series C, offers no-code payment workflow automation, a centralized vault, network tokenization, and
              AI-powered routing—directly competing with HyperSwitch's managed SaaS tier for mid-market global
              merchants. Spreedly provides API-first orchestration with a PSP-agnostic vault, positioned for SaaS,
              travel, and marketplace operators requiring maximum PSP flexibility. A 2026 market analysis by Solidgate
              identified eight leading payment orchestration platforms (Solidgate, BlueSnap, PayU, ProcessOut, Spreedly,
              Primer, Norbr, Yuno) without listing Juspay, signaling a possible coverage gap or distinct positioning in
              analyst databases. The global orchestration market has bifurcated between unified platforms (orchestration
              plus direct financial infrastructure, e.g. Adyen, Stripe) and pure orchestration layers (Primer, Spreedly,
              HyperSwitch), with HyperSwitch's open-source model as its primary differentiator in the latter segment.
