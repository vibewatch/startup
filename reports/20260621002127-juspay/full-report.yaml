      - number: '4.4'
        title: Unit Economics, Cost Structure, and Margin Analysis
        blocks:
          - type: paragraph
            body: >
              The most visible unit-economics signal is the implied take rate: FY25 operating revenue of ~$62M divided
              by $1T annualized TPV gives ~0.006%, which is comparable to payment-infrastructure companies that charge
              per-transaction technology fees rather than a spread on the transaction value itself. This is structurally
              lower than payment aggregators (typically 1.5–2.5% gross take before pass-through costs) and reflects
              Juspay's positioning as a software-infrastructure layer rather than a capital-at-risk participant.

              On the cost side, employee benefits are the largest expense line (historically 60–70% of revenue,
              normalized in FY25 to approximately 46% of expenses after headcount optimization). The 22% YoY reduction
              in FY25 employee costs was achieved through both headcount rationalization and a shift of cost toward
              software infrastructure optimization — suggesting a transition from a services-led to a more productized
              operating model. Other expenses grew 29% YoY to ₹160 crore in FY25, likely reflecting cloud and platform
              costs scaling with transaction volume. Depreciation and amortization grew 43% to ₹20 crore, consistent
              with significant capitalized software development.

              Key unit economics that remain unavailable publicly: gross margin, net revenue retention (NRR), customer
              acquisition cost (CAC), and payback period. Without these metrics the revenue quality and durability of
              the FY25 profitability improvement cannot be fully underwritten. Juspay's revenue concentration is also
              not publicly disclosed, though the platform serves Amazon, Flipkart, Swiggy, and Zepto among others — if a
              small number of hyperscalers represent the majority of volume, pricing pressure from renegotiations or
              in-house buildout is a real exposure.
