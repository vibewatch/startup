      - number: '2.2'
        title: Market Size and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Market sizing for Juspay depends heavily on which lens is applied. India digital-payment volume is
              enormous but only a fraction of it translates into software revenue for orchestration intermediaries.
              India's total digital-payment transaction value is estimated to reach approximately $10 trillion by 2026
              according to a GlobeNewsWire-reported market projection, reflecting the enormous underlying payment flow.
              At the narrower orchestration-software level, multiple analyst estimates converge on the global payment
              orchestration platform market being in the range of $2–3 billion in 2024 and growing to $6–7 billion by
              2031 at a CAGR of 20–24%. Juspay's own disclosed metrics help calibrate the SOM: $1 trillion in annual TPV
              (company-claimed as of FY25–FY26) and 300 million+ daily transactions processed. If average effective
              revenue yield is assumed in the range of 3–6 basis points of TPV (consistent with software-oriented
              orchestration models), the resulting annualised revenue estimate of $300–600 million gross sits plausibly
              near Juspay's disclosed Rs. 514 crore (~$61 million) operating revenue, implying the yield rate is
              substantially below that range or the full TPV is not all billed through Juspay's revenue line. India
              contributes 98–99% of Juspay's revenues despite serving 500+ global enterprises, confirming that the
              Indian domestic opportunity remains the core economic pool. The global orchestration market opportunity is
              structural but largely pre-revenue for Juspay. Mordor Intelligence tracks the India payment gateway market
              as a high-growth segment driven by UPI adoption, smartphone penetration, and government digital-payment
              initiatives, noting competitive density among licensed PA players. At a conservative estimate, India's
              merchant-facing payment-software TAM (gateway + orchestration + compliance tooling) may reach Rs.
              4,000–6,000 crore ($500–700 million) annually by FY27, but no credible public source isolates this figure
              precisely.
