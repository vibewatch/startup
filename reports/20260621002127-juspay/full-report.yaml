      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Juspay's buyer landscape is heterogeneous across its three market perimeters. For Indian enterprise
              merchants (Amazon, Flipkart, Swiggy, IndiGo, Zepto, BigBasket, Google Pay), the economic buyer is
              typically a Head of Payments, CTO, or VP of Engineering who owns checkout conversion, transaction success
              rates, and payment-infrastructure costs. The user is the engineering team integrating APIs; the payer is
              the merchant's finance function absorbing transaction costs. For global enterprises using Hyperswitch
              (airlines, hospitality, international SaaS merchants), the buyer profile shifts toward Chief Technology
              Officers and payments engineering leaders who want modular, open-source infrastructure with vendor-neutral
              multi-PSP connectivity. For banks and card schemes using Juspay's UPI stack, the buyer is the Head of
              Technology or Digital Banking, and the trigger is either a regulatory requirement to enable UPI or a
              competitive need to build a richer checkout experience for account holders. The adoption path in practice
              usually starts with a single checkout or UPI integration, then expands into adjacent products —
              authentication, tokenisation, payouts — as the merchant's confidence in Juspay's SLAs grows. Juspay's
              About page quotes IndiGo's CIO, Swiggy's Director of Finance, and BigBasket's Product Lead on payment
              experience, confirming that enterprise accounts with multi-product relationships are the core buyer
              cohort. The HyperSwitch checkout 2026 article documents a recurring buyer pain: 70% of consumers say
              payment method availability influences which merchant they complete a purchase with, and 57% who encounter
              a missing preferred payment method abandon entirely — giving enterprise payment infrastructure buyers a
              clear ROI frame to justify orchestration spend. For banks, the economics of the UPI stack decisions are
              driven by NPCI participation requirements and a need to process high volumes at sub-second latency without
              building full in-house infrastructure.
