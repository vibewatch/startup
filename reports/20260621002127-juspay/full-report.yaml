  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Business Structure
        blocks:
          - type: paragraph
            body: >
              Juspay operates a B2B payments-infrastructure model with two approximately equal revenue streams: merchant
              payment orchestration and bank infrastructure services. The merchant orchestration side charges
              enterprises a technology access fee for routing, authentication, and checkout optimization — functionally
              SaaS-style software sold to platforms like Amazon, Flipkart, Swiggy, and Zepto. The bank infrastructure
              side provides UPI and card-acquiring stacks to banks that want to onboard merchants and process
              transactions.

              Revenue from the core "payment platform integration" fee line was ₹286.5 crore in FY24 (~90% of that
              year's operating revenue), with the remainder coming from ancillary technology and data services. The
              company's FY25 operating revenue of ₹514 crore at an annualized $1 trillion TPV implies an implied take
              rate of roughly 0.006%, consistent with pure-play infrastructure software pricing rather than a
              payment-aggregator spread. Juspay received its RBI payment aggregator license in February 2024, broadening
              its permitted commercial scope, but management has consistently positioned the company as a technology
              service provider to merchants rather than a direct payment intermediary.

              Pricing is bespoke and enterprise-negotiated; no public rate card or tiered pricing is available. Revenue
              recognition is straightforward for the orchestration side (technology service delivery), but the
              bank-infrastructure contribution complicates comparisons to pure SaaS revenue-quality benchmarks — UPI and
              card-acquiring volumes are subject to regulatory pricing caps and network fee changes outside Juspay's
              control.
            claimRefs:
              - CI001
