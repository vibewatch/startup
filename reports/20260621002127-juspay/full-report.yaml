      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: PSP Defection Compresses India Orchestration TAM
            body: >-
              Razorpay, Cashfree, and PhonePe suspended integrations with Juspay in early 2025, directly restricting
              Juspay's ability to route transactions through India's three largest PSPs via the orchestration layer.
              This structural challenge forces Juspay to rely on its own PA licence and alternative PSP relationships
              for domestic merchant routing, and could compress Juspay's orchestration market share in India unless
              merchants prioritise vendor-neutral infrastructure over PSP-specific optimisation.
            calloutType: risk
            claimRefs:
              - CM040
              - CM041
              - CM042
          - type: callout
            title: Open-Source Hyperswitch Creates Developer-Led TAM Expansion
            body: >-
              Hyperswitch has accumulated 43,000+ GitHub stars, becoming the largest open-source payment orchestration
