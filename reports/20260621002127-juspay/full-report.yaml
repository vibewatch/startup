      - number: '4.5'
        title: Adverse Signals, Regulatory Context, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              The most material recent adverse signal is the termination by PhonePe (December 2024), Razorpay, and
              Cashfree (January 2025) of their integration partnerships with Juspay's orchestration platform. All three
              cited a preference for direct merchant integration and expressed concerns about Juspay's RBI payment
              aggregator license positioning it as a potential competitor. Juspay's COO publicly stated "zero revenue
              impact" because the company's commercial relationships are with merchants, not with gateways — and
              third-party data suggested ~15% of PhonePe's volume ran through Juspay before departure. While the FY25
              financials covering the full fiscal year (through March 2025) showed 61% revenue growth with no visible
              deterioration, the departures occurred mid-FY25 and their full-run-rate revenue impact (if any) will only
              be measurable in FY26 disclosures.

              A secondary adverse data point is the December 2020 data breach that exposed approximately 35 million
              masked card records, phone numbers, and email addresses. No major regulatory fine was publicly levied, but
              the breach triggered RBI scrutiny of payment intermediaries and contributed to subsequent regulatory
              tightening. Juspay's subsequent Series C fundraise (December 2021) proceeded without apparent investor
              setback, suggesting the market regarded the breach as managed. However, data security obligations —
              particularly under RBI payment aggregator guidelines and India's DPDP Act — remain ongoing compliance
              risks.

              Evidence gaps that materially limit financial judgment include: gross margin (not disclosed), NRR or
              customer revenue retention (not disclosed), customer-level concentration (not published), and the actual
              composition of "bank infrastructure" revenue (whether it is contract-SaaS, per-transaction, or a mix).
              Without gross margin, EBITDA margin trends cannot be translated into unit-contribution economics, and the
              sustainability of the FY25 profitability shift at growing TPV scales is unverifiable.
