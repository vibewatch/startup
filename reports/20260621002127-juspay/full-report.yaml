  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Segmentation
        blocks:
          - type: paragraph
            body: >
              Juspay operates in a multi-layered competitive environment spanning India-centric payment gateways, global
              payment orchestration platforms, and structural substitutes such as internal-build programs and bank-led
              gateways. At the first layer, Juspay's core India business competes with direct payment gateway and
              aggregator rivals—Razorpay, Cashfree, PayU, and CCAvenue—all of which offer end-to-end payment acceptance,
              settlements, and developer SDKs for Indian merchants. At the second layer, Juspay's HyperSwitch product
              competes with global payment orchestration platforms (Primer, Spreedly, Checkout.com, Adyen, Stripe) that
              provide multi-PSP routing and unified APIs. A third structural threat comes from large merchants and
              payment aggregators building orchestration in-house, as PhonePe, Razorpay, and Cashfree suspended direct
              integrations with Juspay in 2024–2025, preferring to go directly to merchants. Substitutes include
              bank-issued gateway solutions (SBI PG, HDFC PayZapp, ICICI Eazypay), NPCI-direct integrations, and pure
              orchestration bypasses via Spreedly or Primer. The Indian payment gateway market was valued at USD 2.07
              billion in 2025 and is projected to reach USD 4.01 billion by 2031 at a CAGR of 11.66%, with dozens of
              PA/PG providers competing for enterprise deals. Juspay's strategic thesis—that open-source orchestration
              backed by 300 million daily transactions and $1 trillion+ annualized TPV is a credible alternative to
              proprietary black-box stacks—distinguishes it from India-centric rivals that lack global orchestration
              ambitions and from global orchestrators that lack India's depth and regulatory posture.
