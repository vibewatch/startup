      - number: '1.4'
        title: Traction, Scale, and Cover Metrics
        blocks:
          - type: paragraph
            body: >-
              Juspay's disclosed operating metrics show rapid scale. Daily transaction volume reached 300M+ in FY25, up
              71% from 175M in FY24, and annualized total payment volume (TPV) crossed $1 trillion in FY25—up 150% from
              $400B—underpinning a plausible path to significant fee-based revenue as take rates on this TPV compound.
              The company serves 500+ global enterprises and banks as of 2026, spanning e-commerce (Amazon India,
              Flipkart, Swiggy, Zomato), travel (IndiGo, Agoda, Amadeus), fintech (Google Pay, PhonePe historically),
              banks (HDFC Bank, HSBC), and others (Urban Company, Zepto, Starbucks, McDonald's).


              On financials, FY25 was a step-function year. Operating revenue rose 61% to ₹540 crore (~$64M) and the
              company achieved its first full year of profitability at ₹62 crore (~$7.6M) net profit, reversing a ₹97.54
              crore net loss in FY24 and demonstrating operating leverage. Revenue split is approximately 50% merchant
              orchestration and 50% bank infrastructure. Headcount reached 1,500+ payment experts across eight global
              offices including Bengaluru (HQ), San Francisco, Dublin, São Paulo, Singapore, and Dubai. ARR for FY26 is
              not formally disclosed; external analysts cite ₹500–700 crore as a plausible run-rate but this has not
              been confirmed by the company.
