        title: Security, Compliance, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Juspay holds three independently audited certifications: PCI DSS 4.0.1 for payment data security, ISO
              27001:2022 for information security management systems, and SOC 2 Type 2 for security and availability.
              These are listed publicly on both juspay.in and juspay.io alongside a Payment Aggregation license from the
              Reserve Bank of India (RBI) and a public vulnerability disclosure program. The Hyperswitch card vault is
              PCI-compliant by design, with hardware security modules (HSM) for card data at rest and support for
              external vault integrations via VGS and TokenEx without re-tokenization. The 3DS authentication module is
              PSP-agnostic and configurable to regional regulatory requirements, supporting liability shift workflows
              across all connected PSPs. The status page at status.hyperswitch.io provides public uptime transparency
