chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Juspay is a multinational payments technology company founded in 2012 in Bengaluru, India by Vimal Kumar
              and Ramanathan RV. The company describes itself as a B2B infrastructure provider operating behind the
              checkout and payment flows of large enterprises and banks rather than competing for consumer market share.
              Its commercial identity has three interlocking layers: merchant payment orchestration (smart routing of
              transactions across 300+ payment gateways to maximize success rates), bank infrastructure (end-to-end UPI
              and card acquiring stacks for financial institutions), and an open-source platform (Hyperswitch, its
              Apache-licensed Rust-based orchestration engine) that extends commercial influence into the developer
              community.


              The revenue model mirrors this split: approximately half of income comes from merchant orchestration fees
              and the remaining half from bank infrastructure licensing and services. Juspay competes with Razorpay and
              Cashfree in orchestration but differentiates on deep integration depth, UPI expertise, and its open-source
              footprint. The company claims 99.999% uptime and 300+ no-code gateway integrations including PCI-DSS
              compliance out of the box. Core product offerings include HyperCheckout (full-stack checkout UI and
              orchestration), HyperSDK (mobile payment SDK for Android, iOS, React Native, and Flutter), PURE (payment
              unification and routing capabilities embedded in HyperCheckout), and Hyperswitch (the open-source
              orchestration platform with 43,000+ GitHub stars). The business model prioritizes mission-critical
              enterprise stickiness over consumer acquisition, making Juspay's positioning closer to infrastructure
              middleware than a payment app.
