      - number: '3.2'
        title: Indian Payment Gateway and Aggregator Rivals
        blocks:
          - type: paragraph
            body: >
              Razorpay is the market-leading Indian fintech with approximately $740 million raised through Series E
              (2021) at a peak private valuation of $7.5 billion. In June 2026, Razorpay confidentially filed IPO papers
              with SEBI, targeting $600–700 million at a $5–6 billion valuation. Razorpay's product suite spans payment
              gateways, Magic Checkout (frictionless 1-click flow), subscriptions and recurring billing, RazorpayX
              business banking, and payroll, positioning it as a full-stack financial operating system for Indian SMBs
              and SaaS businesses. Razorpay charges a flat 2% platform fee (plus 18% GST) on standard transactions and
              paused all integrations via third-party routing platforms including Juspay in early 2025. Cashfree, the
              second-largest player, raised $53 million in February 2025 led by Krafton at a $700 million valuation,
              serving 800,000 businesses and processing $80 billion annually at a peak throughput of 12,000 transactions
              per second. Cashfree's key advantages include T+0 instant settlement, the first RBI PA-CB (cross-border)
              license in India (July 2024), and a dominant payout infrastructure for marketplaces. PayU India, backed by
              Prosus, is strongest in enterprise billing, EMI collections, and recurring payments, with genuine global
              reach across 50+ markets; its acquisition of BillDesk created dominant market share in Indian utility bill
              payments. CCAvenue, the oldest major Indian gateway with 20+ years of operation, targets established
              merchants needing POS, subscriptions, and multi-network tokenization (TokenPay), with international
              presence in the UAE, Saudi Arabia, and the USA. Both Razorpay and Cashfree explicitly cited the
              elimination of orchestration layer fees and faster direct-feature delivery as their rationale for
              departing Juspay's platform—an adverse structural signal for Juspay's India TSP revenue concentration.
