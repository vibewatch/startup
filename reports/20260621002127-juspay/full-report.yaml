      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              Several structural forces drive demand for Juspay's category. In India, UPI transaction volume growth has
              been extraordinary: NPCI-reported UPI data shows monthly transaction counts compounding rapidly, and the
              digital-wallet and A2A rail adoption trend is accelerating enterprise appetite for checkout platforms
              capable of handling UPI's real-time confirmation expectations. The government's Digital India programme
              and RBI's active licensing expansion for payment aggregators signal policy-level commitment to continued
              digital payments infrastructure investment. At the global level, the adoption of digital wallets is
              structurally favourable for orchestration vendors: Juspay's own Hyperswitch blog cites FIS and Worldpay
              data showing digital wallets now account for more than 50% of global e-commerce transaction value, while
              BNPL is expected by 45–55% of purchase-intent consumers in fashion, electronics, and travel categories for
              mid-to-high ticket items. Both trends require merchants to maintain multi-method, multi-PSP checkout
              configurations — exactly the workflow Juspay's orchestration layer is built for. Open-source
              infrastructure has also emerged as a distinct driver: Hyperswitch's GitHub repository has accumulated
              43,000+ stars, the largest open-source payment orchestration project by GitHub signal. This creates a
              developer-led adoption channel that is structurally different from traditional enterprise sales. Finally,
              the 2025 RBI Consolidated PA Directions tightened compliance requirements for payment aggregators,
              increasing the cost and complexity of operating as a licensed entity and inadvertently creating demand for
              platform providers like Juspay that already hold a licence and offer compliance infrastructure as part of
              the stack. Juspay's annualised TPV growing 150% from $400 billion to $1 trillion YoY confirms that
              underlying market growth is materialising at pace.
            claimRefs:
