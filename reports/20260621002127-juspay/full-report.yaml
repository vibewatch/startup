              which Juspay lists explicitly in its tenets for reliability. Compliance gaps exist around independent
              third-party audit reports for the uptime claim and the company's own internal ledger architecture, which
              remains undisclosed publicly. The 2021 security incident, in which masked card data for approximately 35
              million users was exposed, is a historical risk marker that predates the current PCI DSS 4.0.1
