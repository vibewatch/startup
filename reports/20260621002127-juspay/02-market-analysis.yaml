  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: india-market-share
    missingEvidence: Juspay's share of total India digital-payment software revenue versus Razorpay, Cashfree, PhonePe, and PayU — no public data exists on relative market share within Indian PA/PG market.
    whyItMatters: Without market share data, it is not possible to assess whether Juspay's India position is defensible or whether PSP defection is already eroding its installed base.
    diligencePath: Request monthly TPV by PSP route, merchant retention cohorts, and revenue by product line (orchestration vs. PA vs. UPI stack) for FY25 and FY26.
    relatedQuestionRefs:
    - QM004
    - QM026
    - QM028
    - QM029
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: global-revenue-breakdown
    missingEvidence: Country-level revenue breakdown for Juspay's 500+ global enterprise clients; India is stated as 98–99% of revenues but international revenue by geography and product is undisclosed.
    whyItMatters: The global market opportunity is the primary narrative in investor communications, but it is not yet monetised at scale; without geographic breakdown, the international TAM is speculative.
    diligencePath: Request international revenue by region (APAC, LATAM, Europe, North America) and by product (Hyperswitch managed service, UPI stack for banks) for FY25 and projected FY26.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: moderate
    topic: orchestration-tam-primary-source
    missingEvidence: A primary analyst report with methodology and data tables isolating the global payment orchestration software market (not general payment processing) with verifiable underlying data.
    whyItMatters: All orchestration TAM estimates in the evidence base are secondary summaries of analyst reports; the underlying primary research is behind paywalls and not independently verifiable from public evidence.
    diligencePath: Obtain paid analyst report from Mordor Intelligence, Grand View Research, or similar covering payment orchestration specifically (not general payments processing).
    relatedQuestionRefs:
    - QM003
    - QM021
    relatedTableRefs:
    - TM002
