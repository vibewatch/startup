- id: adoption-constraints-and-adverse-evidence
  title: Adoption Constraints and Adverse Evidence
  body: "The market for Juspay is not uniformly favourable. The most material adverse signal in the evidence base is structural: in January 2025, Razorpay and Cashfree announced they would suspend direct integrations with third-party payment orchestration platforms including Juspay, following PhonePe's earlier exit from the partnership. This move directly affects Juspay's ability to route transactions through India's largest PSPs — which by volume include Razorpay and Cashfree — and compresses the domestic market opportunity for Juspay's orchestration layer unless merchants either switch to direct PA integrations or use Juspay's own PA licence. The Morning Context framed this as a structural economic battle: 'In Juspay vs. Fintechs, Economics Will Decide the Winner,' noting that the PSP defection fundamentally threatens the multi-PSP routing model in India unless Juspay can replace those payment rails with its own PA infrastructure or alternative PSP partners. A second constraint is revenue concentration: Juspay's co-founder publicly noted India contributes 98–99% of revenues, meaning the global expansion narrative remains early-stage and the India domestic market economics govern the near-term growth trajectory. Third, the 2020 data breach (35 crore card records compromised from Juspay's servers, affecting Amazon and Swiggy users) created a lasting reputational question about security infrastructure that the company has since addressed through PCI DSS 4.0.1, ISO 27001:2022, and SOC 2 Type 2 certifications, but that still surfaces in due-diligence reviews. Fourth, margins in payment orchestration and aggregation are under structural pressure: India's payment interchange economics have historically been thin, and direct-integration competition from large PSPs building their own routing products (Razorpay Optimizer, Cashfree FlowWise) constrains Juspay's domestic take-rate expansion. Fifth, global expansion is capital-intensive: operating in 50+ countries with 300+ PSP integrations requires ongoing compliance maintenance in each jurisdiction, and Juspay has raised only about $90 million total to date — modest relative to the global ambition."
