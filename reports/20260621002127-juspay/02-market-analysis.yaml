tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend or Workflow
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Juspay
  rows:
  - - Indian payment orchestration
    - Multi-PSP routing, transaction success optimisation, checkout configuration, A/B testing
    - Pure bank-to-bank direct transfers outside merchant commerce
    - CTO / Head of Payments at Indian enterprise merchants
    - Core India revenue driver; now contested by PSPs building own routing
  - - Indian payment aggregation (PA licence)
    - Merchant onboarding, KYC, fund collection and settlement, escrow, compliance
    - Unregulated payment channels outside RBI licensing framework
    - Finance lead / CFO at merchants needing compliant settlement
    - New capability post-February 2024 PA licence; direct competitor to Razorpay, Cashfree
  - - Global payment orchestration (Hyperswitch)
    - Multi-PSP checkout, intelligent routing, vault, reconciliation, fraud orchestration across 50+ countries
    - Hardware-led POS terminals with no software orchestration layer
    - CTO / Engineering lead at global enterprise merchants and platforms
    - International growth lever; open-source model creates developer-led adoption
  - - UPI 1-click checkout (HyperUPI)
    - UPI authentication, mandate, 1-click flow with 90%+ claimed success rate
    - Non-UPI payment methods
    - Product / Payments lead at Indian merchants wanting UPI conversion uplift
    - High-volume India-specific product; benefits from UPI secular growth
  - - Bank and card-scheme infrastructure (UPI Issuing/Acquiring/TPAP stacks)
    - UPI issuing PSP, acquiring PSP, and TPAP stack for banks wanting to operate UPI infrastructure
    - Consumer-facing app layer; retail banking products
    - Head of Technology / Digital Banking at Indian and international banks
    - Differentiated bank-facing product expanding total addressable buyer set beyond merchants
  - - Enterprise payouts
    - Bulk vendor payments, employee disbursements, refunds across IMPS, UPI, cards, and bank transfers
    - Consumer remittance products
    - Treasury / Finance at enterprises requiring automated disbursement workflows
    - Adds cross-sell and revenue stickiness after acceptance products are deployed
  - - Affordability and credit (HyperCredit)
    - Embedded credit, BNPL integration, lender co-origination, pre-qualified lead flow
    - Standalone consumer lending unrelated to checkout workflow
    - Product / Growth at merchants; risk / partnerships at lending partners
    - Emerging revenue layer as BNPL penetration rises in India
  - - 3DS authentication and tokenisation
    - PSP-agnostic 3DS SDK, intelligent threshold rules, network token vault, PCI-compliant card storage
    - Standalone identity verification outside the payment flow
    - Security / Payments engineering at enterprise merchants and banks
    - Compliance-driven demand from RBI tokenisation mandates and 3DS 2.x adoption
  notes: Market boundary drawn from product pages at juspay.io/in and juspay.io/us; excludes non-merchant flows, pure consumer wallets, and hardware POS without orchestration software.
