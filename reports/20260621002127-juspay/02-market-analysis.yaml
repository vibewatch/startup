- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for Juspay
  - Diligence Ask
  rows:
  - - UPI transaction volume growth in India
    - Tailwind
    - Current / ongoing
    - Increases enterprise demand for UPI-native checkout infrastructure and 1-click UPI flows
    - What share of Juspay's India revenue is UPI-specific versus card/wallet?
  - - Digital wallet adoption (50%+ of global e-commerce value)
    - Tailwind
    - Current / ongoing
    - Validates multi-payment-method orchestration as a merchant requirement globally
    - How many of Juspay's 500+ global enterprises use Hyperswitch for non-India flows?
  - - BNPL penetration in electronics, fashion, travel (45–55% consumer expectation)
    - Tailwind
    - Near-term
    - Creates demand for embedded credit integration (HyperCredit) and multi-BNPL routing
    - What is HyperCredit's current revenue contribution and lender partner count?
  - - Open-source adoption signal (43k+ Hyperswitch GitHub stars)
    - Tailwind
    - Current / building
    - Developer-led community creates low-CAC pipeline for Hyperswitch enterprise conversions
    - What is the conversion rate from open-source self-hosting to paid managed service?
  - - 'RBI 2025 Consolidated PA Directions (tighter KYC, escrow, compliance requirements)'
    - 'Mixed: increases compliance cost but also drives demand for compliant infrastructure vendors'
    - Current
    - Juspay's PA licence and certifications (PCI DSS 4.0.1, ISO 27001, SOC 2) position it as compliant infrastructure; raises barrier to entry for non-licensed competitors
    - Does RBI's compliance framework create pricing power or just cost parity?
  - - 'PSP defection: Razorpay, Cashfree, PhonePe suspend Juspay integrations (Jan 2025)'
    - Headwind
    - Near-term (ongoing)
    - Reduces Juspay's ability to route via India's largest PSPs; forces reliance on own PA licence and alternative PSPs
    - How much of Juspay's India TPV was routed through Razorpay/Cashfree before the defection? Current alternative PSP coverage?
  - - In-house build competition from PSPs (Razorpay Optimizer, Cashfree FlowWise)
    - Headwind
    - Near-term
    - PSPs building proprietary orchestration layers compete directly for merchants wanting optimization without an independent orchestrator
    - How are enterprise merchants evaluating build vs. buy for routing logic in 2026?
  - - India revenue concentration risk (98–99% India)
    - Headwind
    - Structural
    - International revenues underdeveloped despite global TPV; market risk concentrated in India
    - Global revenue breakdown by geography and product line to verify progress on diversification
  notes: Drivers and constraints compiled from company disclosures, news reporting on PSP defection, Juspay blog content, and Hyperswitch market analysis.
