callouts:
- calloutType: risk
  title: PSP Defection Compresses India Orchestration TAM
  body: Razorpay, Cashfree, and PhonePe suspended integrations with Juspay in early 2025, directly restricting Juspay's ability to route transactions through India's three largest PSPs via the orchestration layer. This structural challenge forces Juspay to rely on its own PA licence and alternative PSP relationships for domestic merchant routing, and could compress Juspay's orchestration market share in India unless merchants prioritise vendor-neutral infrastructure over PSP-specific optimisation.
  claimRefs:
  - CM040
  - CM041
  - CM042

- calloutType: strength
  title: Open-Source Hyperswitch Creates Developer-Led TAM Expansion
  body: Hyperswitch has accumulated 43,000+ GitHub stars, becoming the largest open-source payment orchestration project. This creates a developer-led adoption channel that is structurally distinct from traditional enterprise sales and has lower CAC characteristics. The 300+ PSP connectors and self-hosting option address a global buyer segment (CTOs and engineering leaders wanting vendor independence) that is underserved by closed-source alternatives such as Adyen and Stripe.
  claimRefs:
  - CM004
  - CM007
  - CM033
  - CM034
  - CM036

- calloutType: assumption
  title: India Revenue Concentration Means Global Opportunity is Not Yet Monetised
  body: Juspay's co-founder stated India contributes 98–99% of revenues despite 500+ global enterprises and $1 trillion in annualised TPV. This implies the global TPV is either processed for very large Indian-origin enterprises with international operations, or at minimal take rates. The global market sizing narrative should be treated as a future opportunity rather than current addressable market until international revenue diversification is independently verified.
  claimRefs:
  - CM012
  - CM015
  - CM044
  - CM047

