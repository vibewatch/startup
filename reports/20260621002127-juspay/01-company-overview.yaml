callouts:
  - calloutType: strength
    title: Profitable infrastructure at unicorn scale
    body: >-
      Juspay achieved first full-year profitability in FY25 (₹62 crore net profit on ₹540 crore revenue) while
      simultaneously scaling to 300M+ daily transactions and $1T+ TPV — a rare combination of scale and
      financial discipline for an Indian B2B fintech at this stage.
    claimRefs:
      - CO008
      - CO009
      - CO011
      - CO012
  - calloutType: risk
    title: PA license conflict of interest is an unresolved competitive risk
    body: >-
      PhonePe, Razorpay, and Cashfree severed merchant routing partnerships after Juspay received its RBI PA
      license, alleging conflict of interest. While Juspay claims zero revenue impact, the structural tension
      between operating an orchestration platform and competing as a payment aggregator may limit gateway
      partnerships and enterprise trust in neutrality.
    claimRefs:
      - CO016
      - CO018
      - CO019
      - CO027
  - calloutType: insight
    title: Hyperswitch open-source strategy creates global developer leverage
    body: >-
      With 43,000+ GitHub stars and Apache 2.0 licensing, Hyperswitch is among the most prominent open-source
      fintech infrastructure projects globally. This creates developer mindshare that commercial-only competitors
      cannot replicate, and positions Juspay as a community-owned infrastructure standard beyond India.
    claimRefs:
      - CO025
      - CO028
      - CO031

