  - id: regulatory-milestones-risk
    title: Regulatory Status, Milestones, and Adverse Context
    body: >-
      Juspay holds two RBI payment processing authorizations: a domestic Payment Aggregator (PA) license
      received in February 2024 and a Payment Aggregator – Cross-Border (PA-CB) license received in November
      2025, placing it among 19 entities authorized for cross-border operations under the RBI's October 2023
      PA-CB framework. These licenses significantly expand Juspay's regulated addressable market but also
      introduced competitive tension.


      The PA license acquisition in 2024 triggered an industry reaction: PhonePe demanded that its merchant
      clients stop using Juspay's services in December 2024, and Razorpay and Cashfree followed in January
      2025, severing merchant-routing connections. Major payment aggregators alleged a conflict of interest,
      arguing that Juspay directing transactions through its own PA service gave it an unfair advantage over
      competing gateways on its orchestration platform. Juspay co-founders disputed this, stating the company
      had zero revenue impact and that merchant routing decisions remain entirely merchant-controlled. Analysts
      note this dispute reflects broader competitive consolidation in Indian fintech where full-stack ambition
      by one platform may disadvantage complementary players.


      A historical adverse event also warrants mention: in August 2020, unauthorized actors exploited an
      unrecycled AWS access key to access Juspay's servers and downloaded records on 35–100 million customers,
      including masked card numbers and card fingerprints, which later appeared for sale on the dark web. The
      breach was criticized as being disclosed to the public only after a security researcher found the data
      publicly, not proactively. The RBI engaged the payments industry in the aftermath to mandate stronger
      cybersecurity standards. Juspay has since implemented role-based access controls and enhanced threat
      monitoring, and the 2024 RBI PA license approval signals regulatory confidence has been restored.
    claimRefs:
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO027
