  - id: leadership-governance
    title: Leadership, Founders, and Governance
    body: >-
      Juspay was co-founded by Vimal Kumar (CEO), Ramanathan RV (technical co-founder), and Sheetal Lalwani
      (COO). Vimal Kumar holds the primary public-facing leadership role and is credited with the company's
      strategic direction including the open-source Hyperswitch bet and global expansion ambitions. Sheetal
      Lalwani, co-founder and COO, leads operations, global expansion, and external partnerships; her public
      statements represent the company in funding announcements and financial disclosures. Ramanathan RV is
      credited with the foundational engineering architecture.


      Key-person dependence on the founding trio is high: all three founders remain operationally active, and
      Juspay has not disclosed any major C-suite hires or leadership changes in 2026, suggesting the company
      retains a founder-led structure. Nishant Sameer has been identified as VP for Juspay's US operations,
      adding a senior leader for the North America expansion. Board composition and governance specifics are not
      publicly disclosed, which is a material diligence gap for a company at $1.2B valuation. The investor
      directors (WestBridge, Kedaara, SoftBank) likely hold board observer or director seats but these have not
      been confirmed in public filings. Avendus Capital served as exclusive financial advisor for the Jan 2026
      round, indicating professional governance around capital events.
    claimRefs:
      - CO002
      - CO014
      - CO029
      - CO034
    tableRefs:
      - TO002

  - id: funding-investors
    title: Funding History and Investor Map
    body: >-
      Juspay has raised approximately $197M in disclosed primary capital since its 2012 founding. The company
      built through five rounds: a $6.41M Series A from Accel in October 2015, a $21.6M Series B led by VEF in
      March 2020, a $60M Series C led by SoftBank Vision Fund 2 in December 2021 at ~$460–478M valuation, a
      $60M Series D led by Kedaara Capital in April 2025 at ~$900M valuation (with SoftBank and Accel
      participating), and a $50M Series D follow-on from WestBridge Capital in January 2026 at a $1.2B
      post-money valuation. The January 2026 round included both primary and secondary components, with the
      secondary portion providing partial liquidity to early investors and employees holding ESOPs—this marks
      the second liquidity event in about a year.


      Wellington Management participated in Series B and C rounds. Avendus Capital acted as exclusive financial
      advisor for the January 2026 transaction. The total disclosed equity raised does not include any debt
      instruments; no public references to venture debt or credit facilities appear in available reporting.
      Investor governance rights are not publicly disclosed, leaving board composition, pro-rata rights, and
      information covenants as outstanding diligence items. WestBridge Capital, with ~$7B AUM, becomes the most
      recently active investor and publicly positioned itself as a long-term infrastructure-conviction bet.
    claimRefs:
