  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: leadership
      missingEvidence: >-
        Full board composition, investor director seats, and complete executive org chart for Juspay; the company
        has not publicly disclosed its board of directors, governance committee structure, or investor governance rights.
      whyItMatters: >-
        Key-person and governance risk cannot be fully assessed without board structure; at a $1.2B valuation
        the governance profile of directors and investor control rights is a material diligence item.
      diligencePath: >-
        Request board structure, director backgrounds, and investor governance rights from Juspay investor
        relations team; review Series D term sheet for board seat provisions.
      relatedQuestionRefs:
        - QO002
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: >-
        Full named customer roster with contract values, transaction share per customer, and renewal dates;
        Juspay's complete enterprise client list is not publicly disclosed beyond approximately 15 named accounts.
      whyItMatters: Customer concentration risk and churn risk cannot be assessed from public data alone.
      diligencePath: Request customer list with revenue attribution and top-10 customer concentration from Juspay data room.
      relatedQuestionRefs:
        - QO004

    - type: private-evidence-only
      severity: minor
      topic: milestones
      missingEvidence: >-
        Confirmed exact dates for founding-era milestones and for any product launches or partnerships between
        2016 and 2019; the public record has gaps in the chronology between Series A (2015) and Series B (2020).
      whyItMatters: >-
        Incomplete milestone chronology makes it harder to assess pace of product development and whether
        the company bootstrapped or had undisclosed early backing between 2015-2019.
      diligencePath: >-
        Request a board-approved company chronology or founder presentation covering 2012-2020 from Juspay;
        cross-reference with NPCI and UPI ecosystem announcements from that period.
      relatedTableRefs:
        - TO004

    - type: private-evidence-only
      severity: material
      topic: adverse
      missingEvidence: >-
        Independent third-party assessment of whether Juspay's orchestration platform routes transactions
        preferentially to its own PA service; no regulatory finding or audit report has been published.
      whyItMatters: >-
        If the conflict-of-interest allegation is valid, it could trigger regulatory scrutiny, limit enterprise
        adoption by competitors, or require operational separation of the orchestration and PA businesses.
      diligencePath: >-
        Request RBI correspondence, audit reports, and any formal complaint responses; interview affected
        payment aggregators; analyze routing logs if accessible.
      relatedQuestionRefs:
        - QO019

    - type: private-evidence-only
      severity: material
      topic: investors
      missingEvidence: >-
        Full cap table including angel investors, ESOP pool size, secondary sellers in 2025-2026 rounds, and
        governance rights (board seats, information rights, anti-dilution provisions) for each institutional investor.
      whyItMatters: >-
        Without cap table visibility the economic and control stake of each institutional investor cannot be
        assessed; governance rights are material at $1.2B unicorn valuation.
      diligencePath: >-
        Request shareholder register and investor side letters from Juspay data room; confirm board composition
        via Series D term sheet.
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: revenue
      missingEvidence: >-
        Formal FY26 ARR run-rate disclosure; the company has not published an ARR figure for the fiscal year
        ending March 2026; analyst estimates range ₹500–700 crore but are unconfirmed.
      whyItMatters: ARR trajectory is critical for valuation multiples at the $1.2B unicorn round price.
      diligencePath: >-
        Request FY26 management accounts or investor update; check for updated public disclosures post
        June 2026.
      relatedQuestionRefs:
        - QO021

    - type: private-evidence-only
      severity: minor
      topic: competitive-position
      missingEvidence: >-
        Independent market share data comparing Juspay's transaction volume and enterprise penetration to
        Razorpay and Cashfree in the orchestration segment.
      whyItMatters: Competitive differentiation claims cannot be verified without third-party market sizing data.
      diligencePath: >-
        Obtain analyst reports from Bernstein, CLSA, or KPMG on Indian payment orchestration market share;
        review Razorpay and Cashfree investor materials for comparative metrics.
      relatedQuestionRefs:
        - QO023

