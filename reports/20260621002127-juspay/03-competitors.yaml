company:
  name: Juspay

chapter:
  number: 3
  title: Competitors
  summary: >
    Juspay competes on two distinct axes: as a payment technology service provider (TSP) for Indian
    enterprises and banks, and globally via HyperSwitch as the world's first open-source payment
    orchestration platform. In India, Razorpay, Cashfree, PayU, and CCAvenue are direct rivals, while
    globally Stripe, Adyen, Checkout.com, Primer, and Spreedly contest the orchestration layer. The
    gravest near-term displacement risk is the departure of Razorpay, Cashfree, and PhonePe from
    Juspay's integration ecosystem, shifting the company's center of gravity toward HyperSwitch's
    international enterprise expansion where open-source trust and $1T+ TPV proof points are the
    primary differentiators.

sections:
  - id: competitive-landscape
    title: Competitive Landscape and Segmentation
    body: >
      Juspay operates in a multi-layered competitive environment spanning India-centric payment
      gateways, global payment orchestration platforms, and structural substitutes such as
      internal-build programs and bank-led gateways. At the first layer, Juspay's core India
      business competes with direct payment gateway and aggregator rivals—Razorpay, Cashfree, PayU,
      and CCAvenue—all of which offer end-to-end payment acceptance, settlements, and developer SDKs
      for Indian merchants. At the second layer, Juspay's HyperSwitch product competes with global
      payment orchestration platforms (Primer, Spreedly, Checkout.com, Adyen, Stripe) that provide
      multi-PSP routing and unified APIs. A third structural threat comes from large merchants and
      payment aggregators building orchestration in-house, as PhonePe, Razorpay, and Cashfree
      suspended direct integrations with Juspay in 2024–2025, preferring to go directly to merchants.
      Substitutes include bank-issued gateway solutions (SBI PG, HDFC PayZapp, ICICI Eazypay),
      NPCI-direct integrations, and pure orchestration bypasses via Spreedly or Primer. The Indian
      payment gateway market was valued at USD 2.07 billion in 2025 and is projected to reach USD
      4.01 billion by 2031 at a CAGR of 11.66%, with dozens of PA/PG providers competing for
      enterprise deals. Juspay's strategic thesis—that open-source orchestration backed by 300 million
      daily transactions and $1 trillion+ annualized TPV is a credible alternative to proprietary
      black-box stacks—distinguishes it from India-centric rivals that lack global orchestration
      ambitions and from global orchestrators that lack India's depth and regulatory posture.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP042]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: indian-payment-rivals
    title: Indian Payment Gateway and Aggregator Rivals
    body: >
      Razorpay is the market-leading Indian fintech with approximately $740 million raised through
      Series E (2021) at a peak private valuation of $7.5 billion. In June 2026, Razorpay
      confidentially filed IPO papers with SEBI, targeting $600–700 million at a $5–6 billion
      valuation. Razorpay's product suite spans payment gateways, Magic Checkout (frictionless
      1-click flow), subscriptions and recurring billing, RazorpayX business banking, and payroll,
      positioning it as a full-stack financial operating system for Indian SMBs and SaaS businesses.
      Razorpay charges a flat 2% platform fee (plus 18% GST) on standard transactions and
      paused all integrations via third-party routing platforms including Juspay in early 2025.
      Cashfree, the second-largest player, raised $53 million in February 2025 led by Krafton at a
      $700 million valuation, serving 800,000 businesses and processing $80 billion annually at a
      peak throughput of 12,000 transactions per second. Cashfree's key advantages include T+0
      instant settlement, the first RBI PA-CB (cross-border) license in India (July 2024), and a
      dominant payout infrastructure for marketplaces. PayU India, backed by Prosus, is strongest
      in enterprise billing, EMI collections, and recurring payments, with genuine global reach
      across 50+ markets; its acquisition of BillDesk created dominant market share in Indian utility
      bill payments. CCAvenue, the oldest major Indian gateway with 20+ years of operation, targets
      established merchants needing POS, subscriptions, and multi-network tokenization (TokenPay),
      with international presence in the UAE, Saudi Arabia, and the USA. Both Razorpay and Cashfree
      explicitly cited the elimination of orchestration layer fees and faster direct-feature delivery
      as their rationale for departing Juspay's platform—an adverse structural signal for Juspay's
      India TSP revenue concentration.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP016, CP017, CP018]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]

  - id: global-orchestration-rivals
    title: Global Payment Orchestration Competitors
    body: >
      At the global orchestration layer, Stripe is the dominant proprietary incumbent with $1.9
      trillion in payment volume processed in 2025, 135+ currencies, and 99.999% historical uptime.
      For Indian merchants, Stripe charges 2% for domestically issued Mastercard and Visa cards
      and 3% for internationally issued cards, with domestic debit MDR capped at Rs 200. Stripe
      operates in India on a restricted-invite basis as of 2026. Adyen, a public company listed on
      Euronext Amsterdam, operates a unified end-to-end platform covering processing, acquiring, and
      issuing with banking licenses in the US, UK, and EU, and 99.999% historical uptime; its
      direct-acquiring model differentiates it structurally from pure orchestration layers. Checkout.com
      positions itself as a performance-first payments network, with its Flow product (a low-code
      checkout builder) and enterprise clients including Microsoft. Primer, which raised a $100 million
      Series C, offers no-code payment workflow automation, a centralized vault, network tokenization,
      and AI-powered routing—directly competing with HyperSwitch's managed SaaS tier for mid-market
      global merchants. Spreedly provides API-first orchestration with a PSP-agnostic vault, positioned
      for SaaS, travel, and marketplace operators requiring maximum PSP flexibility. A 2026 market
      analysis by Solidgate identified eight leading payment orchestration platforms (Solidgate,
      BlueSnap, PayU, ProcessOut, Spreedly, Primer, Norbr, Yuno) without listing Juspay, signaling a
      possible coverage gap or distinct positioning in analyst databases. The global orchestration
      market has bifurcated between unified platforms (orchestration plus direct financial
      infrastructure, e.g. Adyen, Stripe) and pure orchestration layers (Primer, Spreedly,
      HyperSwitch), with HyperSwitch's open-source model as its primary differentiator in the latter
      segment.
    claimRefs: [CP019, CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP029]
    tableRefs: [TP004]
    figureRefs: []

  - id: moats-and-displacement
    title: Moats, Lock-In, and Displacement Risk
    body: >
      Juspay's primary competitive moats are fourfold. First, open-source trust: HyperSwitch's
      Apache 2.0 codebase with 42,000+ GitHub stars enables procurement-team code audits and creates
      a developer-community flywheel effect that proprietary competitors cannot replicate; the
      repository had 4,800+ forks and 246+ contributors as of mid-2026. Second, scale credibility:
      the same Rust-based engine that powers 300 million daily transactions and over $1 trillion
      annualized TPV provides an enterprise-grade reference that startup orchestrators cannot claim
      without a decade of production scale. Third, the Tartarus sovereign card vault, which gives
      enterprises full data sovereignty over tokenized card credentials—eliminating the proprietary
      vault lock-in mechanism used by Stripe and Adyen, where merchants who store card tokens in
      the vendor's vault face prohibitive migration costs at contract renewal. Fourth, Indian
      regulatory posture: Juspay received RBI payment aggregator authorization in 2024, creating
      an access barrier for smaller orchestrators entering the India market. The key displacement
      risks are vertical integration and commoditization. On vertical integration, the departure of
      PhonePe (approximately 15% of prior gateway volume), Razorpay, and Cashfree from Juspay's
      orchestration pipeline in 2024–2025 demonstrates that large aggregators prefer direct merchant
      relationships over paying an orchestration fee to a third-party routing layer. On
      commoditization, Primer and Spreedly now offer comparable multi-PSP routing with no-code
      workflow builders, potentially eroding HyperSwitch's differentiation unless its open-source
      community size and contributor velocity are sustained. Juspay's response to the India PA
      departure narrative has been that it is a TSP to merchants, not a payments intermediary, and
      that any PA unwilling to work through an orchestration layer will ultimately lose merchants to
      competitors. This positions global HyperSwitch enterprise wins as the primary growth vector
      and materially reduces revenue concentration risk from India PA integration partners.
    claimRefs: [CP030, CP031, CP032, CP033, CP034, CP035, CP036, CP037, CP038, CP039, CP040, CP041, CP042]
    tableRefs: []
    figureRefs: [FP003]

