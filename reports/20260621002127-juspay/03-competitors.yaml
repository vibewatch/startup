callouts:
  - calloutType: risk
    title: PA Integration Departures Represent a Structural Revenue Threat
    body: >
      PhonePe, Razorpay, and Cashfree—three of India's largest payment aggregators—each suspended
      or paused direct integrations with Juspay's orchestration layer between December 2024 and
      January 2025. Approximately 15% of PhonePe's gateway volume previously ran through Juspay.
      The stated rationale is eliminating orchestration-layer fees and accelerating feature delivery
      via direct merchant integration. If this direct-integration trend extends to other large PAs,
      Juspay's India TSP revenue pipeline could narrow materially, reinforcing the strategic pivot
      to HyperSwitch international enterprise sales as the primary growth vector.
    claimRefs: [CP036, CP037, CP038]

  - calloutType: strength
    title: Open-Source Moat Creates Unique Trust and Community Distribution
    body: >
      With 42,000+ GitHub stars, 4,800+ forks, and 246+ contributors, HyperSwitch is one of the
      most-starred fintech open-source projects globally. The Apache 2.0 license means no viral
      copyleft risk for enterprise integrations. This developer community provides a distribution
      channel—word-of-mouth adoption, public security audits, and community-driven connector
      contributions—that proprietary competitors cannot replicate. The open-source codebase also
      satisfies enterprise procurement teams' code-level visibility requirements.
    claimRefs: [CP002, CP003, CP004, CP030]

