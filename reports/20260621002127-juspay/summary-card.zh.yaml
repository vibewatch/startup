  topStrengths:
    - 企业客户基础已成规模：500+ 客户、每日 300M+ 笔交易、年化 TPV 超 $1T。
    - FY25 已实现盈利，三年收入复合增长强，符合支付基础设施厂商的头部特征。
    - 开源 Hyperswitch 叠加深度银行和商户集成，形成技术优势和切换成本。
  topRisks:
    - 印度收入占比约 98–99%，地理分散度仍极低。
    - Razorpay、PhonePe 和 Cashfree 推动网关去中介化，威胁贡献约一半收入的 POP / 编排层。
    - 股权结构表、FY26 运行率、客户集中度、留存和治理结构披露都偏薄。
  unresolvedGaps:
    - FY26 管理账，包括季度收入轨迹、毛利率和现金生成。
    - 精确股权结构表、新股 / 老股拆分，以及近期轮次中的优先股堆叠或治理条款。
    - 客户集中度、NRR / GRR，以及管理层口径之外的国际收入占比仍待量化。
