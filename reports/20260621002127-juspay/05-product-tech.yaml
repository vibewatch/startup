  - id: architecture-tech
    title: Architecture and Technical Infrastructure
    body: >-
      Juspay's Hyperswitch platform is built in Rust, a systems-level language chosen explicitly for performance
      and memory safety. The production infrastructure handles 2000 transactions per second (TPS) and Juspay
      claims 99.999% uptime across its payment infrastructure. Hyperswitch's modular design allows merchants to
      deploy only the components they need — routing, retries, vaulting, cost observability, or reconciliation —
      without vendor lock-in. The backend is containerized and deployable via Helm charts on AWS, GCP, Azure, or
      any Kubernetes-compatible platform. Juspay also offers a fully-hosted SaaS option with out-of-the-box
      compliance and enterprise-grade SLAs. The intelligent routing engine evaluates transactions in real time
      across rule-based, volume-based, and machine-learning-driven algorithms. The revenue recovery module
      configures retry logic across 30+ parameters including decline code, card bin, region, ticket size, and
      payment method to minimize involuntary churn. The cost observability module provides drill-down visibility
      into scheme, interchange, and acquirer fees. A stateless architecture enables horizontal scaling for peak
      payment loads. The card vault is PCI-compliant and supports bring-your-own-vault (VGS, TokenEx) so
      merchants can connect existing vault providers without re-tokenizing stored cards. As of June 2026, the
      Hyperswitch repository has shipped 156 named releases since launch in October 2022 and maintains
      active commit activity, with the latest push recorded on June 20, 2026, one day before this analysis.
      The main architectural risk is that the multi-cloud, modular design requires significant merchant-side
      engineering investment to exploit fully, which may limit penetration among smaller merchants without
      dedicated payments engineering teams.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
