  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pure-orchestration-architecture
      missingEvidence: >-
        Technical white paper or engineering blog post documenting the internal architecture of PURE
        orchestration and the JUSPE router, including routing algorithm type, ML model provenance,
        inference latency, training data sources, and fallback logic.
      whyItMatters: >-
        PURE and JUSPE are described as core proprietary differentiators but lack any public technical
        documentation. Without understanding the algorithmic design, it is impossible to assess whether
        the claimed 10% authorization rate improvement is durable or easily replicated.
      diligencePath: >-
        Request a technical architecture white paper from Juspay's engineering team during due diligence;
        review internal benchmarking data comparing PURE routing outcomes against rule-based and vanilla
        ML routing baselines.
      relatedQuestionRefs:
        - QE025
        - QE026

    - type: missing-source
      severity: material
      topic: uptime-independent-audit
      missingEvidence: >-
        Independent third-party audit or SRE-level report confirming the 99.999% uptime claim with
        methodology, measurement period, and incident exclusions.
      whyItMatters: >-
        Uptime claims from the company's own marketing pages cannot be treated as verified SLAs. 99.999%
        (less than 5.3 minutes annual downtime) requires active-active multi-region infrastructure and
        rigorous incident tracking that is not publicly verified.
      diligencePath: >-
        Request historical uptime data and incident post-mortems from Juspay's SRE team; cross-reference
        with status.hyperswitch.io incident history and any customer contract SLA language.
      relatedQuestionRefs:
        - QE006

    - type: private-evidence-only
      severity: minor
      topic: ml-routing-mechanism
      missingEvidence: >-
        Public description of the ML routing model type, feature engineering, retraining cadence, and
        A/B test outcomes for authorization rate improvement claims.
      whyItMatters: >-
        The claimed 10% authorization rate improvement from ML routing is a key sales argument but
        has no independently verifiable benchmark or published methodology.
      diligencePath: >-
        Request ML routing model cards, A/B test result summaries, and customer-specific authorization
        lift data segmented by merchant type and geography during due diligence.
      relatedQuestionRefs:
        - QE026

    - type: stale
      severity: minor
      topic: roadmap-2026
      missingEvidence: >-
        Specific 2026 product roadmap commitments beyond the Q2 2026 roadmap page on docs.hyperswitch.io,
        including planned connector additions, mobile SDK features, and monetization changes.
      whyItMatters: >-
        Understanding the near-term product roadmap is essential for assessing competitive positioning
        as PG disintermediation accelerates and global Hyperswitch expansion continues.
      diligencePath: >-
        Review the public Q2 2026 roadmap on docs.hyperswitch.io; request internal roadmap documentation
        from Juspay for H2 2026 and 2027 product priorities.
      relatedQuestionRefs:
        - QE020

    - type: missing-source
      severity: minor
      topic: security-incident-history
      missingEvidence: >-
        Independent reporting on the 2021 Juspay data exposure (approximately 35 million user records)
        and a formal post-incident review or public security advisory from the company.
      whyItMatters: >-
        The 2021 security incident is a historical data point for security culture and incident response
        maturity. Without a public post-mortem or remediation disclosure, the current security posture
        improvement since PCI DSS 4.0.1 certification cannot be fully assessed.
      diligencePath: >-
        Request a formal post-incident review document from Juspay's security team; compare current
        security controls against the publicly known attack vectors from the 2021 incident.
      relatedQuestionRefs:
        - QE011

    - type: missing-source
      severity: minor
      topic: saas-vs-self-hosted-comparison
      missingEvidence: >-
        Public documentation or third-party analysis comparing Juspay's SaaS-hosted Hyperswitch with
        self-hosted deployments in terms of feature parity, pricing differential, merchant adoption
        patterns, and migration pathways.
      whyItMatters: >-
        Understanding how merchants choose between SaaS and self-hosted is essential for modeling
        Juspay's revenue mix and competitive positioning against natively self-hosted orchestration
        alternatives. Without this data, the SaaS conversion thesis for open-source distribution
        cannot be validated.
      diligencePath: >-
        Request internal data on SaaS-vs-self-hosted split from Juspay; seek case studies from
        merchants on each deployment path; compare pricing pages and feature matrices.
      relatedQuestionRefs:
        - QE022

