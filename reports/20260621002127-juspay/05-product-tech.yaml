  - id: developer-ecosystem
    title: Developer Ecosystem and Open-Source Strategy
    body: >-
      Juspay's open-source strategy centers on Hyperswitch, which had 43,037 GitHub stars and 4,821 forks as
      of June 20, 2026, making it one of the most-starred open-source fintech infrastructure repositories
      globally. The GitHub organization at github.com/juspay hosts 343+ public repositories, reflecting a
      broad engineering output spanning payments, AI tooling (Neurolink), NixOS configuration management
      (services-flake), and developer experience tools. Hyperswitch is available as a self-hosted stack or a
      Juspay-managed SaaS, with a hosted sandbox requiring no setup for developer exploration. SDKs are
      published for Android (Kotlin), iOS (Swift), React Native (Dart), and Flutter, with the Flutter package
      on pub.dev at version 1.5.2 as of March 2026 with 130 pub.dev likes. The Hyperswitch web SDK is a
      ReScript-built React library distributed via npm. Developer support surfaces include a Slack community,
      GitHub Discussions, a dedicated Stack Overflow tag, API reference documentation, a Postman collection,
      and a public Academy. The open-source strategy creates a distribution moat: enterprise merchants evaluating
      self-hosting can audit the codebase, reducing diligence friction and driving managed-SaaS conversion.
      The risk is that open-source enables well-resourced competitors to fork and deploy Hyperswitch themselves,
      reducing Juspay's SaaS premium. With 1,823 open issues in the GitHub repository, there is also a
      maintainability signal that the issue backlog is large relative to current contributor capacity.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
    figureRefs:
      - FE003

  - id: security-compliance
    title: Security, Compliance, and Reliability
    body: >-
      Juspay holds three independently audited certifications: PCI DSS 4.0.1 for payment data security, ISO
      27001:2022 for information security management systems, and SOC 2 Type 2 for security and availability.
      These are listed publicly on both juspay.in and juspay.io alongside a Payment Aggregation license from the
      Reserve Bank of India (RBI) and a public vulnerability disclosure program. The Hyperswitch card vault is
      PCI-compliant by design, with hardware security modules (HSM) for card data at rest and support for
      external vault integrations via VGS and TokenEx without re-tokenization. The 3DS authentication module
      is PSP-agnostic and configurable to regional regulatory requirements, supporting liability shift workflows
      across all connected PSPs. The status page at status.hyperswitch.io provides public uptime transparency
      for the hosted Hyperswitch platform. The claimed 99.999% uptime corresponds to less than 5.3 minutes of
      downtime per year — a target consistent with active-active multi-region deployments with instant failover,
      which Juspay lists explicitly in its tenets for reliability. Compliance gaps exist around independent
      third-party audit reports for the uptime claim and the company's own internal ledger architecture, which
      remains undisclosed publicly. The 2021 security incident, in which masked card data for approximately
      35 million users was exposed, is a historical risk marker that predates the current PCI DSS 4.0.1
      certification, but the breach demonstrates that large-scale incidents are possible in this company's
      operating history.
    claimRefs:
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
      - CE033
    tableRefs:
      - TE004

  - id: competitive-moat
    title: Competitive Differentiation and Technology Moat Risks
    body: >-
      Juspay's core technical differentiation rests on three pillars: depth of integration (300+ PSP connectors
      pre-built), developer-native open-source distribution (Hyperswitch with 43k+ stars), and a multi-layer
      enterprise product suite that extends from checkout experience through tokenization, authentication, and
      reconciliation. The PURE orchestration and JUSPE router products position Juspay as an intelligent
      middleware layer between merchants and multiple competing PSPs, creating a network-effect moat as more
      PSP integrations attract more merchants. The machine-learning routing layer, which claims up to 10%
      improvement in authorization rates for routing-optimized merchants, is harder to replicate than basic
      rule-based routing. However, three major Indian payment gateway firms — PhonePe, Razorpay, and Cashfree
      Payments — moved away from Juspay's orchestration in late 2024 and January 2025. Razorpay launched its
      own orchestration tool (Optimizer) and Cashfree launched FlowWise to provide similar multi-PSP routing
      directly to their merchant base, bypassing Juspay's intermediary position. Merchants reported frustration
      as PG firms actively encouraged direct integration over Juspay middleware. Juspay's response framed itself
      as a technology service provider like cloud infrastructure, distinct from payment intermediaries, and
      argued that interoperability must be preserved. The receipt of an RBI payment aggregator license in 2024
      means Juspay now competes with these PGs directly, which deepens the conflict. The long-term moat
      question is whether Juspay's merchant-direct relationships, open-source strategy, and global expansion
      (Hyperswitch) can offset the disintermediation pressure in the India market.
    claimRefs:
      - CE034
      - CE035
      - CE036
      - CE037
      - CE038
      - CE039
      - CE040
    tableRefs:
      - TE005
    figureRefs:
      - FE004

