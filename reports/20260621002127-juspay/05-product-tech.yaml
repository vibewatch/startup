callouts:
  - calloutType: strength
    title: Open-source Hyperswitch creates developer distribution moat
    body: >-
      With 43,037 GitHub stars, 4,821 forks, and Apache 2.0 licensing, Hyperswitch is among the highest-starred
      fintech infrastructure repositories globally. This developer presence lowers merchant evaluation friction,
      drives managed SaaS conversion, and builds ecosystem credibility that proprietary alternatives cannot easily
      replicate. The Rust-based architecture signals engineering quality and long-term performance advantage.
    claimRefs:
      - CE021
      - CE022
      - CE040

  - calloutType: risk
    title: PG disintermediation threatens India orchestration revenue
    body: >-
      PhonePe, Razorpay, and Cashfree — three of India's largest payment gateways — moved away from Juspay
      orchestration in 2024-2025 and launched competing internal tools (Razorpay Optimizer, Cashfree FlowWise).
      Juspay's RBI PA license deepens the competitive conflict. If major Indian PGs continue direct-merchant
      integration policies, Juspay's domestic orchestration TAM contracts even as global Hyperswitch expansion
      is early-stage.
    claimRefs:
      - CE034
      - CE035
      - CE036
      - CE037

  - calloutType: insight
    title: PURE and JUSPE internals remain a significant diligence gap
    body: >-
      Despite being named in investor materials and press coverage, the internal architecture of the PURE
      orchestration engine and JUSPE router has no publicly available technical documentation. Investor due
      diligence should require white-paper disclosure of routing algorithm design, ML model provenance,
      fallback logic, and SLA-backed performance guarantees for these modules.
    claimRefs:
      - CE006
      - CE017

