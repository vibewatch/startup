  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency / technology choice
      - Risk
    rows:
      - - Hyperswitch App Server
        - Core payment routing, retries, and vault operations
        - Rust; stateless; horizontally scalable
        - Rust talent pool smaller than Java/Go; harder to hire for
      - - Checkout SDKs (web + mobile)
        - Client-side checkout rendering and payment initiation
        - ReScript (web), Kotlin (Android), Swift (iOS), Flutter, React Native
        - Multi-language maintenance burden; fragmentation risk across SDKs
      - - PSP Connector Layer
        - Abstraction over 120+ PSP APIs and protocols
        - REST connectors defined per processor; Hyperswitch Prism for direct use
        - PSP API changes require connector updates; regression risk at scale
      - - Card Vault and Encryption Service
        - PCI-compliant storage of raw card data, PSP tokens, and network tokens
        - HSM-backed; bring-your-own-vault option for VGS, TokenEx
        - Vault migration complexity if switching or deprecating providers
      - - ML Routing Engine
        - Dynamic PSP selection optimizing authorization rate
        - In-house ML; trained on transaction outcomes
        - Model drift under market conditions; retraining cadence not disclosed
      - - Reconciliation Engine
        - 3-way match across merchant data, PSP data, and bank statements
        - Automated data fetch; customizable rules; backdated scheduling
        - Exception handling completeness and SLA not publicly benchmarked
    notes: Technology stack detail sourced from Hyperswitch GitHub README, developer documentation, and hyperswitch.io product pages. ML routing internals are company-described; independent algorithmic audit is not available.
