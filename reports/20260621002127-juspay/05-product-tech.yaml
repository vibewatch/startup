company:
  name: Juspay
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Juspay's product surface spans a layered payments operating system — HyperCheckout for checkout experience and
    routing, Hyperswitch as an open-source composable orchestration platform with 43k+ GitHub stars, HyperSDK with
    2.5 billion+ mobile app installs, and a modular suite covering tokenization, 3DS authentication, reconciliation,
    and ML-driven revenue recovery. The company's Rust-based backend handles 2000 TPS at a claimed 99.999% uptime,
    holds PCI DSS 4.0.1, ISO 27001:2022, and SOC 2 Type 2 certifications, and integrates with 300+ global PSPs.
    The principal technology risk is competitive: PhonePe, Razorpay, and Cashfree have moved to direct merchant
    integration, launching their own orchestration tools and bypassing Juspay's intermediary layer.
sections:
  - id: product-surface
    title: Product Surface and Module Map
    body: >-
      Juspay's public product surface divides into three primary delivery mechanisms: a managed checkout experience
      layer (HyperCheckout), a developer-facing open-source orchestration platform (Hyperswitch), and a mobile SDK
      distribution layer (HyperSDK) with 2.5 billion+ app installs. HyperCheckout is explicitly not a payment
      aggregator (PA) or payment gateway (PG); it is an experience and orchestration layer that sits on top of
      300+ PA/PG connections, offering no-code checkout customization with 100+ visual configurations, a design
      studio for Android, iOS, and web, intelligent routing, and an A/B framework. Express Checkout SDK provides
      the raw API and SDK surface for merchants building custom checkout UIs. HyperUPI is a specific product for
      the Indian market enabling 1-click UPI payments with a company-claimed 90%+ success rate. Beyond checkout,
      Juspay offers a full payment module suite: network tokenization with PSP-agnostic vault and third-party
      vault support, a PSP-agnostic 3DS authentication workflow, a NACH/eMandates recurring payment product, an
      ML-driven revenue recovery engine with 30+ configurable retry parameters, automated 3-way reconciliation,
      and an instant payouts product spanning cards, bank transfers, and wallets. The HyperCredit product adds a
      lender orchestration system for embedded credit. The breadth of this module map gives Juspay multiple
      integration touchpoints with enterprise merchants, creating switching costs at multiple layers of the payment
      stack. The diligence question is whether the module depth translates into defensible revenue per module or
      whether individual features are easily replicated by well-resourced PGs and PSPs.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
