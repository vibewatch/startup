summary:
  headline: >
    Juspay is a scaled and now-profitable Indian payments infrastructure leader with real enterprise depth and an
    unusual open-source moat, but the current $1.2B valuation already prices in sustained growth despite India
    concentration and gateway-disintermediation risk.
