  - id: recommendation-diligence
    title: Recommendation, Risk Rating, and Diligence Asks
    body: >
      The base-case recommendation is Track. At $1.2B valuation and ~18–20x LTM revenue, JusPay's price
      is stretched relative to the available public evidence on FY26 revenue trajectory, global revenue
      mix, and cap-table structure. The company has demonstrated genuine value creation—profitable
      operations, exceptional TPV growth, a blue-chip client roster, and a differentiated open-source
      moat—but the near-term thesis-test is whether FY26 revenues can sustain 30%+ growth as the gateway
      dispute matures. Confidence is medium because financial filings are not public (MCA data lags)
      and management guidance is high-level. The risk rating is high, driven primarily by India
      concentration and the gateway disintermediation scenario that threatens ~50% of revenues. The
      valuation stance is stretched: the market is ascribing a peer-group premium that requires either
      successful global revenue diversification or sustained India dominance despite gateway headwinds.
      A buy stance would require (a) FY26 management accounts showing 25%+ revenue growth and no
      material churn, (b) a credible global revenue mix target (10%+ by FY27), (c) confirmed cap-table
      overhang and preference stack, and (d) resolution or documented de-risking of the gateway dispute.


      Key thesis-break triggers include: any PG beyond the three dissenters cutting ties, JusPay losing
      a marquee anchor client (Amazon/Flipkart/Google), a confirmed regulatory action by RBI against
      JusPay's PA model, or a management departure of either Vimal Kumar or Sheetal Lalwani. Positive
      re-rating catalysts include: a Razorpay IPO pricing above $5B (validating Indian fintech multiples),
      material global bank contracts above $5M ARR each, or an announced IPO roadmap by JusPay itself.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
