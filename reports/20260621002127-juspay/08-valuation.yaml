chapter:
  number: 8
  title: Valuation
  summary: >
    JusPay's January 2026 Series D follow-on at $1.2 billion (led by WestBridge Capital) implies an
    ~18–20x LTM revenue multiple on FY25 revenue of ₹514–540 crore (~$62–65M), placing it at the
    high end of global payment-infrastructure private-market comps. The valuation is grounded in
    confirmed profitability (FY25 PAT ₹62 crore), $1 trillion annualised TPV, and a marquee client
    roster, but is stretched relative to evidence given India's 98–99% revenue concentration and
    ongoing gateway disintermediation risk. A base-case recommendation of Track is warranted until
    FY26 revenue trajectory, global revenue mix, and resolution of the gateway dispute clarify.

sections:
  - id: financing-valuation-context
    title: Financing and Valuation Context
    body: >
      JusPay reached unicorn status in January 2026 when WestBridge Capital led a $50 million Series D
      follow-on that pegged the company's valuation at $1.2 billion—a 33% step-up from the $900 million
      mark set in the Kedaara-led $60 million round of April 2025 and more than a 2.5x uplift from the
      $460–478 million Series C valuation of December 2021. The January 2026 transaction was a mix of
      primary and secondary components; the secondary portion provided the second ESOP and early-investor
      liquidity event within twelve months, signalling that the cap table is being managed toward a
      medium-term exit. Avendus Capital served as financial advisor to both the April 2025 and January 2026
      rounds, consistent with an eventual IPO preparation process. Total primary capital raised over the
      company's life is approximately $120–130 million against $197 million in disclosed round sizes (the
      rest being secondary transfer); lifetime dilution remains modest by unicorn standards.


      On a last-twelve-months revenue basis using FY25 operating revenue of ₹514–540 crore (~$62–65M at
      ₹83/USD), the implied EV/Revenue multiple is approximately 18–20x. This sits below Adyen's ~20x
      public market multiple and broadly in line with the 15–23x range for high-growth private payment
      infrastructure peers such as Stripe ($159B, ~23x) and Checkout.com ($11B, ~10–14x estimated). The
      multiple premium over legacy acquirers (2–6x) and Razorpay's IPO-target multiple (~10–13x on FY25
      revenue) reflects JusPay's profitable-infrastructure positioning, $1T+ TPV scale, and stickiness
      with marquee enterprise and banking clients.


      Key valuation risk factors that can compress the multiple include: India revenue concentration
      (98–99% of revenues), the unresolved gateway disintermediation dispute with Razorpay, PhonePe, and
      Cashfree, the lack of a confirmed IPO timeline, and the illiquidity premium inherent in a private
      company that has not yet filed for a public offering.
