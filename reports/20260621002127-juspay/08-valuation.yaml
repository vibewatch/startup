callouts:
  - calloutType: risk
    title: Gateway Disintermediation Is the Primary Valuation Risk
    body: >
      Razorpay, PhonePe, and Cashfree collectively instructed merchants to bypass JusPay's orchestration
      layer starting December 2024–January 2025. JusPay's co-founder stated no merchants were lost, but
      independent merchants reported integration friction and the Moneycontrol investigation found at
      least one major merchant signalling a future move away. Since POP services represent approximately
      50% of revenues, this is a tail-risk that could compress the current $1.2B valuation by 40–60%
      in the bear case.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV029

  - calloutType: strength
    title: Profitability on Minimal Primary Capital Is a Rare Fintech Credential
    body: >
      JusPay achieved its first GAAP-profitable fiscal year (FY25) on approximately $130 million in
      lifetime primary capital, demonstrating capital efficiency that is unusual in payment
      infrastructure globally. With PBT before exceptional items of ₹115 crore and PAT of ₹62 crore,
      the company has a sustainable operating model that de-risks the valuation relative to loss-making
      comps at similar multiples.
    claimRefs:
      - CV003
      - CV004
      - CV005

  - calloutType: recommendation
    title: Track Until FY26 Data and Gateway Dispute Clarity Emerge
    body: >
      The Track recommendation balances confirmed operational strength (profitability, TPV growth,
      blue-chip clients) against an elevated multiple and material unresolved risks (gateway dispute,
      India concentration, private opacity). The upgrade trigger to Buy is a combination of FY26 revenue
      growth above 25%, global revenue mix above 8%, and a confirmed resolution or material de-risking
      of the gateway dispute. Downgrade to Avoid would be triggered by any anchor-client exit,
      RBI enforcement action, or a down-round financing below $1.0B.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV030

