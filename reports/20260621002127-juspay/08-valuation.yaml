  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: FY26 financial performance
      missingEvidence: "JusPay's H1 FY26 revenue, gross margin, operating cash flow, and client count are not publicly available; MCA filing will lag by 12–18 months."
      whyItMatters: "FY26 performance is the primary test of whether the investment thesis holds post-gateway dispute; without it, the ~18–20x multiple cannot be validated."
      diligencePath: "Request management accounts directly from JusPay; engage Avendus Capital as the known financial advisor; cross-reference with MCA annual return once filed."
      relatedQuestionRefs: [QV002, QV003]

    - type: private-evidence-only
      severity: blocking
      topic: cap table and preference stack
      missingEvidence: "Liquidation preferences, anti-dilution provisions, fully-diluted share count, and ESOP pool size for JusPay are not publicly disclosed."
      whyItMatters: "Heavy liquidation preferences (common in India PE/VC rounds) can negate equity value at moderate exit outcomes; the unicorn valuation may not translate to equity returns at below-$2B exit."
      diligencePath: "Request term sheets and cap table from company; VEF annual report may disclose partial terms; Tracxn/Pitchbook may have partial data."
      relatedQuestionRefs: [QV006]

    - type: conflicting-data
      severity: material
      topic: gateway dispute revenue impact
      missingEvidence: "No independent post-dispute merchant survey or JusPay management account confirms the actual POP revenue churn since January 2025."
      whyItMatters: "Lalwani stated near-zero churn; Moneycontrol sources suggest ongoing merchant pressure; the revenue risk from this dispute is the most material uncertainty in the bear case."
      diligencePath: "Direct merchant interviews with Tata1mg, Urban Company, and Zepto finance teams; PG partner call transcripts from Razorpay/PhonePe investor days."
      relatedQuestionRefs: [QV014, QV015]

    - type: private-evidence-only
      severity: material
      topic: global revenue mix FY26
      missingEvidence: "International revenue as a percentage of FY26 total has not been confirmed; FY25 international was 1–2% by implication of the 98–99% India figure."
      whyItMatters: "International revenue is the primary bull-case driver; current India concentration at 98–99% means the global expansion thesis is aspirational, not yet evidenced."
      diligencePath: "Monitor HSBC partnership press releases; check Entrackr/VCCircle for Hyperswitch enterprise deal announcements in US/EU."
      relatedQuestionRefs: [QV011]

    - type: missing-source
      severity: material
      topic: comparable valuation table coverage
      missingEvidence: "Private payment infrastructure comparable set is incomplete; Checkout.com, PayU India, and PhonePe financials are not publicly confirmed and rely on secondary estimates. Additional comparables from APAC or LatAm payment infrastructure are not covered."
      whyItMatters: "An incomplete comparable set increases the risk of anchoring JusPay's ~18–20x multiple on a biased peer group; additional comps may compress or expand the reference range."
      diligencePath: "Source Checkout.com and PayU India primary financials from public filings or data providers; check PhonePe DRHP when filed."
      relatedTableRefs: [TV004]
      relatedQuestionRefs: [QV007]

    - type: missing-source
      severity: material
      topic: regulatory status RBI enforcement
      missingEvidence: "No RBI show-cause notice, order, or public communication about JusPay's PA licence operations or its conflict-of-interest with POP services found in public domain."
      whyItMatters: "Regulatory action against JusPay's PA licence would be a thesis-break trigger; absence of public enforcement record is reassuring but not conclusive."
      diligencePath: "Monitor RBI orders database; review Karnataka AAR tax ruling on JusPay; check MCA compliance status."
      relatedQuestionRefs: [QV028]

    - type: stale
      severity: minor
      topic: Stripe and Adyen NTM revenue multiples
      missingEvidence: "NTM (next-twelve-months) revenue multiples for Adyen and Stripe as of June 2026 are estimated from Q1 2026 data and analyst projections; exact multiples could vary by 1–3x."
