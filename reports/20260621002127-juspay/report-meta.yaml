  topStrengths:
    - Scaled enterprise footprint with 500+ customers, 300M+ daily transactions, and $1T+ annualised TPV.
    - Demonstrated FY25 profitability and strong three-year revenue compounding for a payments-infrastructure vendor.
    - Open-source Hyperswitch plus deep bank and merchant integrations create technical and switching-cost advantages.
  topRisks:
    - India revenue concentration remains extreme at roughly 98–99%, limiting geographic diversification.
    - Gateway disintermediation by Razorpay, PhonePe, and Cashfree threatens the POP/orchestration layer that drives about half of revenue.
    - Public disclosure is thin on cap table, FY26 run-rate, customer concentration, retention, and governance structure.
