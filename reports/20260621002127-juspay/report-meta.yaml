companyProfile:
  summary: >
    Juspay is a Bengaluru-based enterprise payments infrastructure company founded in 2012. It
    sells merchant payment orchestration, checkout software, mobile SDKs, bank-grade UPI and card
    infrastructure, and the open-source Hyperswitch platform. Public evidence supports strong scale
    and improving economics: FY25 revenue of ₹514–540 crore, first full-year profitability,
    300M+ daily transactions, $1T+ annualised TPV, and 500+ enterprises and banks served globally.
    The core underwriting debate is whether that scale can compound internationally fast enough to
    justify a private-market multiple materially above Indian fintech comps while gateway
    disintermediation risk remains unresolved.
