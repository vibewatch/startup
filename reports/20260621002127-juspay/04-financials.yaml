callouts:
  - calloutType: strength
    title: First Unicorn of 2026 on Genuine Profitability
    body: >
      Juspay's $1.2B January 2026 valuation is backed by a real FY25 profit (₹115 Cr EBITDA, ₹62 Cr PAT) rather than a market-multiple re-rating alone. The combination of a 66% three-year revenue CAGR, a 22% absolute decline in employee costs in FY25, and $1T annualized TPV positions the company as a structurally profitable infrastructure business — rare among Indian fintech unicorns.
    claimRefs: [CI001, CI002, CI003, CI036, CI042]

  - calloutType: risk
    title: Aggregator Ecosystem Dependency and Departure Risk
    body: >
      PhonePe, Razorpay, and Cashfree's termination of orchestration integrations in late 2024/early 2025 introduces a revenue-at-risk signal. While Juspay's COO cited "zero revenue impact," ~15% of PhonePe's volume ran through Juspay before departure, and the company's RBI payment aggregator license has structurally repositioned it as a competitor rather than a neutral infrastructure provider. The full-year impact will not be visible until FY26 financials.
    claimRefs: [CI029, CI030, CI031, CI032]

  - calloutType: risk
    title: Ultra-Thin Take Rate Limits Revenue Per Incremental TPV
    body: >
      An implied take rate of ~0.006% means every $1B increase in TPV adds only ~$60,000 in revenue. Revenue growth must therefore come from volume acceleration, new client addition, or product-scope expansion (aggregator services, bank infrastructure) rather than pricing power. The current take rate is structurally lower than any listed payment peer, reflecting pure-software positioning but limiting pricing-leverage upside.
    claimRefs: [CI006, CI007, CI041]

  - calloutType: insight
    title: Deferred Tax Benefit Partially Inflates FY25 PAT
    body: >
      FY25 PAT of ₹62 crore includes a ₹35 crore deferred tax exceptional item that lifted PAT above the profit-before-tax of ₹27 crore. EBITDA of ₹115 crore provides a cleaner view of operating profitability. The PAT figure should be used cautiously in run-rate or forward-earnings projections.
    claimRefs: [CI002, CI003, CI015]

