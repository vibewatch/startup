  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: unit-economics
      missingEvidence: Gross margin or cost-of-revenue schedule by business segment (orchestration vs bank infrastructure).
      whyItMatters: Without gross margin, the ₹115 crore EBITDA improvement cannot be attributed to pricing power, volume leverage, or one-time cost cuts; revenue quality and durability of profitability are unverifiable.
      diligencePath: Request detailed P&L or cost-of-revenue breakdown from management; cross-reference against MCA filed financial statement once FY25 annual report is publicly available on Tofler/Zauba.
      relatedQuestionRefs: [QI006]

    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Net revenue retention (NRR) or gross revenue retention by client segment.
      whyItMatters: NRR is the primary indicator of whether existing clients grow their usage (and revenue) over time; sub-100% NRR would indicate net contraction risk in the enterprise base.
      diligencePath: Request NRR cohort data by segment (orchestration vs bank infra) at next investor meeting; compare to Indian B2B SaaS peers for benchmarking.
      relatedQuestionRefs: [QI014]

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: Published or representative pricing schedule, effective take rate, or rate card for payment platform integration.
      whyItMatters: Juspay's implied take rate of ~0.006% is derived; actual billing terms, volume discounts, and contract structures may materially differ and affect revenue-growth sustainability.
      diligencePath: Request sample contract with pricing redacted; obtain average effective rate per billion transactions from management; compare to Stripe and Adyen disclosed economics.
      relatedQuestionRefs: [QI018]

    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: Top-10 customer revenue concentration and contract renewal dates.
      whyItMatters: If Amazon, Flipkart, or HSBC alone represent more than 30–40% of revenue, contract non-renewal or renegotiation would be material; the PhonePe exit illustrates that platform-level routing decisions can change rapidly.
      diligencePath: Request customer concentration schedule from management; ask for Weighted Average Remaining Contract Life (WARCL) across the top-10 customers.
      relatedQuestionRefs: [QI022]

    - type: stale
      severity: material
      topic: capital
      missingEvidence: FY25 actual cash, bank balance, and borrowings from filed MCA financial statements.
      whyItMatters: FY25 cash position is currently management-guided only; the filed MCA balance sheet will confirm whether operating cash flow was genuinely positive and net debt position.
      diligencePath: File for or purchase FY25 annual financial statements from Tofler or Zauba once they are publicly filed (typically 6–9 months after fiscal year end, i.e., by December 2025); FY25 filing should be available by early 2026.
      relatedQuestionRefs: [QI010]

    - type: missing-source
      severity: material
      topic: adverse
      missingEvidence: Full-year FY26 (through March 2026) revenue and margin data showing whether aggregator departures affected run-rate.
      whyItMatters: FY25 covered through March 2025 — the PhonePe exit (December 2024) and Razorpay/Cashfree exits (January 2025) only affected the last few months of FY25; FY26 will be the first full-year test of Juspay's "zero revenue impact" claim.
      diligencePath: Monitor Juspay newsroom for FY26 interim updates; request FY26 H1 revenue (October 2025 preliminary) at Series D investor relations meeting.
      relatedQuestionRefs: [QI012, QI025]

    - type: missing-source
      severity: moderate
      topic: unit-economics
      missingEvidence: Public peer take-rate data for Stripe, Adyen, or Indian aggregators at comparable TPV scale for direct comparison.
      whyItMatters: Juspay's implied take rate (~0.006%) is structurally lower than aggregator gross take rates, but peer comparison at the infrastructure layer requires public disclosure that Stripe, PayU, and Indian aggregator peers do not provide.
      diligencePath: Use public filing data from Adyen (listed Amsterdam) and FSS (listed NSE) to construct per-transaction revenue metrics; request internal rate card from Juspay management for benchmarking.
      relatedQuestionRefs: [QI011]

    - type: private-evidence-only
      severity: moderate
      topic: capital
      missingEvidence: Juspay's debt/borrowings terms — amount, maturity, interest rate, and any covenants — are not publicly disclosed.
      whyItMatters: MCA records confirm at least one loan facility exists; undisclosed debt terms could affect runway calculations and impose financial covenants that constrain operating decisions.
      diligencePath: Request full capitalization table and term sheet summary from company; cross-reference against audited balance sheet once FY25 MCA filing is available.
      relatedQuestionRefs: [QI021]

