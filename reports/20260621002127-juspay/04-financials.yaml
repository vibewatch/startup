artifact: financials
slug: juspay
runDate: 2026-06-21
company:
  name: Juspay
chapter:
  number: 4
  title: Financials
  summary: >
    Juspay reached profitability in FY25, reporting ₹514 crore (~$62M) in operating revenue (up 61% YoY) and ₹62 crore PAT — its first full-year net profit since founding in 2012. The company's ultra-thin implied take rate (~0.006% of $1T annualized TPV) and equal revenue split between merchant orchestration and bank infrastructure reflect a high-volume, infrastructure-software pricing model. After raising $110M across two rounds (April 2025 Series D at ~$900M and January 2026 follow-on at $1.2B), capital position appears adequate for near-term operations, though gross margin, NRR, and granular unit economics remain undisclosed, leaving underwriting judgment incomplete.

sections:
  - id: revenue-model
    title: Revenue Model and Business Structure
    body: >
      Juspay operates a B2B payments-infrastructure model with two approximately equal revenue streams: merchant payment orchestration and bank infrastructure services. The merchant orchestration side charges enterprises a technology access fee for routing, authentication, and checkout optimization — functionally SaaS-style software sold to platforms like Amazon, Flipkart, Swiggy, and Zepto. The bank infrastructure side provides UPI and card-acquiring stacks to banks that want to onboard merchants and process transactions.

      Revenue from the core "payment platform integration" fee line was ₹286.5 crore in FY24 (~90% of that year's operating revenue), with the remainder coming from ancillary technology and data services. The company's FY25 operating revenue of ₹514 crore at an annualized $1 trillion TPV implies an implied take rate of roughly 0.006%, consistent with pure-play infrastructure software pricing rather than a payment-aggregator spread. Juspay received its RBI payment aggregator license in February 2024, broadening its permitted commercial scope, but management has consistently positioned the company as a technology service provider to merchants rather than a direct payment intermediary.

      Pricing is bespoke and enterprise-negotiated; no public rate card or tiered pricing is available. Revenue recognition is straightforward for the orchestration side (technology service delivery), but the bank-infrastructure contribution complicates comparisons to pure SaaS revenue-quality benchmarks — UPI and card-acquiring volumes are subject to regulatory pricing caps and network fee changes outside Juspay's control.
    claimRefs: [CI001, CI004, CI007, CI008, CI009, CI020]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: financial-trajectory
    title: Financial Performance Trajectory FY22–FY25
    body: >
      Juspay's revenue grew at a compound annual rate of approximately 66% from ₹112.7 crore in FY22 to ₹514 crore in FY25 — one of the stronger sustained growth rates among Indian B2B fintech infrastructure companies. Losses were roughly flat through FY22 and FY23 at ~₹105 crore each year, then narrowed to ₹97.5 crore in FY24 as revenue scaled past the fixed-cost base. In FY25 the company swung to a profit after tax of ₹62.28 crore — driven primarily by a 22% decline in employee costs (from ₹303 crore to ₹237 crore) combined with a 61% revenue increase, creating strong operating leverage.

      FY25 EBITDA (before exceptional items and tax) reached ₹115 crore, confirming genuine operating profitability rather than a deferred-tax accounting artifact, though the PAT also benefited from a ₹35 crore deferred tax exceptional item that pushed the reported PAT above the profit-before-tax of ₹27 crore. Total income including non-operational items is reported by some sources at ₹540 crore versus the operating revenue figure of ₹514 crore; the ₹26 crore difference appears to be interest and financial instrument gains, consistent with the ₹28.3 crore non-operating income seen in FY24.

      Daily transaction volume nearly doubled from 175M to over 300M during FY25, and annualized TPV surged 150% from $400B to $1T — operational metrics consistent with the revenue growth rate. Management guided for sustained profitability in FY26 while investing in AI capabilities, Hyperswitch (open-source orchestration), and global bank infrastructure expansion.
    claimRefs: [CI001, CI002, CI003, CI009, CI010, CI011, CI013, CI014, CI015, CI016, CI017, CI034, CI036, CI041, CI042]
    tableRefs: [TI003]
    figureRefs: [FI002, FI003]

  - id: capital-adequacy
    title: Capital Adequacy, Funding History, and Forward Liquidity
    body: >
      Juspay has raised over $170M in disclosed equity across its funding history. Accel provided early institutional backing from around 2016; VEF led the 2020 Series B; SoftBank Vision Fund 2 led a $60M Series C in December 2021 at approximately $460M valuation alongside Wellington Management and VEF. In April 2025 Kedaara Capital led a $60M Series D (with ~$10M primary and ~$50M secondary) at ~$900M valuation, with SoftBank and Accel participating; VEF sold part of its 10.2% stake for $14.8M in the secondary component. In January 2026 WestBridge Capital invested $50M (primary plus secondary) at a $1.2B valuation — making Juspay India's first unicorn of 2026 — with Avendus Capital as financial advisor.

      The consecutive near-term liquidity events (both the April 2025 and January 2026 rounds included secondary components) suggest investors are monetizing early positions in the absence of an IPO path, while the primary proceeds fund global expansion. FY24 disclosed cash and bank balances totaled approximately ₹220 crore (~$26M); FY25 management stated cash burn was near zero with positive operating cash flow, implying the balance was largely preserved. With $50M primary capital raised in January 2026 and operating cash generation positive, the short-to-medium-term liquidity position appears adequate for the disclosed FY26 investment plan.

      The company carries one disclosed loan per MCA records, and RBI payment aggregator requirements mandate a minimum net worth of ₹25 crore, which Juspay's current capital base and retained earnings should satisfy, though the exact net-worth composition (paid-up capital ₹13.3 crore plus reserves) requires direct verification from the company's filed balance sheet.
    claimRefs: [CI017, CI018, CI021, CI022, CI023, CI024, CI025, CI026, CI027, CI028, CI033, CI035]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: unit-economics
    title: Unit Economics, Cost Structure, and Margin Analysis
    body: >
      The most visible unit-economics signal is the implied take rate: FY25 operating revenue of ~$62M divided by $1T annualized TPV gives ~0.006%, which is comparable to payment-infrastructure companies that charge per-transaction technology fees rather than a spread on the transaction value itself. This is structurally lower than payment aggregators (typically 1.5–2.5% gross take before pass-through costs) and reflects Juspay's positioning as a software-infrastructure layer rather than a capital-at-risk participant.

      On the cost side, employee benefits are the largest expense line (historically 60–70% of revenue, normalized in FY25 to approximately 46% of expenses after headcount optimization). The 22% YoY reduction in FY25 employee costs was achieved through both headcount rationalization and a shift of cost toward software infrastructure optimization — suggesting a transition from a services-led to a more productized operating model. Other expenses grew 29% YoY to ₹160 crore in FY25, likely reflecting cloud and platform costs scaling with transaction volume. Depreciation and amortization grew 43% to ₹20 crore, consistent with significant capitalized software development.

      Key unit economics that remain unavailable publicly: gross margin, net revenue retention (NRR), customer acquisition cost (CAC), and payback period. Without these metrics the revenue quality and durability of the FY25 profitability improvement cannot be fully underwritten. Juspay's revenue concentration is also not publicly disclosed, though the platform serves Amazon, Flipkart, Swiggy, and Zepto among others — if a small number of hyperscalers represent the majority of volume, pricing pressure from renegotiations or in-house buildout is a real exposure.
    claimRefs: [CI004, CI007, CI010, CI011, CI012, CI014, CI019, CI038, CI039]

  - id: adverse-gaps
    title: Adverse Signals, Regulatory Context, and Evidence Gaps
    body: >
      The most material recent adverse signal is the termination by PhonePe (December 2024), Razorpay, and Cashfree (January 2025) of their integration partnerships with Juspay's orchestration platform. All three cited a preference for direct merchant integration and expressed concerns about Juspay's RBI payment aggregator license positioning it as a potential competitor. Juspay's COO publicly stated "zero revenue impact" because the company's commercial relationships are with merchants, not with gateways — and third-party data suggested ~15% of PhonePe's volume ran through Juspay before departure. While the FY25 financials covering the full fiscal year (through March 2025) showed 61% revenue growth with no visible deterioration, the departures occurred mid-FY25 and their full-run-rate revenue impact (if any) will only be measurable in FY26 disclosures.

      A secondary adverse data point is the December 2020 data breach that exposed approximately 35 million masked card records, phone numbers, and email addresses. No major regulatory fine was publicly levied, but the breach triggered RBI scrutiny of payment intermediaries and contributed to subsequent regulatory tightening. Juspay's subsequent Series C fundraise (December 2021) proceeded without apparent investor setback, suggesting the market regarded the breach as managed. However, data security obligations — particularly under RBI payment aggregator guidelines and India's DPDP Act — remain ongoing compliance risks.

      Evidence gaps that materially limit financial judgment include: gross margin (not disclosed), NRR or customer revenue retention (not disclosed), customer-level concentration (not published), and the actual composition of "bank infrastructure" revenue (whether it is contract-SaaS, per-transaction, or a mix). Without gross margin, EBITDA margin trends cannot be translated into unit-contribution economics, and the sustainability of the FY25 profitability shift at growing TPV scales is unverifiable.
    claimRefs: [CI029, CI030, CI031, CI032, CI033, CI034, CI040]
    tableRefs: [TI005]

