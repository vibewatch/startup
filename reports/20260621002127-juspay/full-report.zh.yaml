  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 面向 IC 的评分，覆盖市场、证据、护城河、经济性、风险、估值和证据质量维度。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          context: 印度支付 TPV 超 $3T；UPI 年交易 228B 笔；全球银行基础设施渗透不足
        - label: 收入证据
          value: 7
          unit: /10
          context: FY25 收入 ₹514–540 crore 已确认；同比 61%；FY26 轨迹未确认
        - label: 技术护城河
          value: 8
          unit: /10
          context: Hyperswitch 43K+ GitHub 星标；开源锁定；90+ PSP 集成；第一性原理基础设施
        - label: 客户证据
          value: 8
          unit: /10
          context: Amazon、Flipkart、Google、HSBC、IndiGo；公司称流失率近零；500+ 企业
        - label: 单位经济性
          value: 7
          unit: /10
          context: FY25 PAT ₹62 crore；扣除例外项前 PBT ₹115 crore；约 $130M 一级资本下烧钱温和
        - label: 风险画像
          value: 4
          unit: /10
          context: 印度占比 98-99%；网关去中介化涉及约 50% POP 收入；PA 牌照冲突
        - label: 估值纪律
          value: 4
          unit: /10
          context: LTM 收入 18–20x 偏高；应给非流动性折价；FY26 指引未确认
        - label: 证据质量
          value: 5
          unit: /10
          context: FY25 MCA / 新闻已确认；FY26 数据缺失；股权结构未披露；无 DRHP
    approximationNotes: 评分为分析师基于截至 2026-06-21 所收集证据，在 0–10 分制下做出的判断。并非量化模型输出。
    claimRefs:
      - CV011
      - CV023
      - CV024
      - CV025
