  - id: FE001
    title: Juspay 产品架构栈
    type: stack
    layout: wide
    summary: Juspay 的产品架构从面向客户的结账 SDK，延伸到编排和连接器中间层，再到下层 PSP 轨道；PCI 合规数据和 ML 服务处在核心位置。
    data:
      layers:
        - label: 客户端层
          description: 结账层：HyperCheckout（web）、HyperSDK（Android/iOS）、HyperUPI、Express Checkout SDK
          detail: 面向商户的结账体验和移动支付界面
        - label: 编排和路由层
          description: 编排层：PURE Orchestration Engine、JUSPE Router、智能路由（ML + rules + volume）
          detail: 跨 PSP 运行的支付路由、重试和编排逻辑
        - label: 集成和连接器层
          description: 300+ PSP 连接器、网络令牌化桥、3DS 决策管理器
          detail: 抽象异构 PSP API 和认证协议
        - label: 数据和合规层
          description: 对账引擎、Revenue Recovery ML、Offers engine、PCI 卡金库
          detail: 跑在支付交易流之上的运营数据服务
        - label: 基础设施层
          description: Rust app server、Kubernetes/Helm 多云（AWS、GCP、Azure）、HSM 加密服务
          detail: 系统级基础设施提供 2000 TPS 吞吐量和公司声称的 99.999% 可用性
    approximationNotes: 架构分层由公开文档拼出；内部服务拓扑和服务间通信模式未公开披露。
