      - number: '8.2'
        title: 投资逻辑、情景与可比公司组
        blocks:
          - type: paragraph
            body: >
              多头投资逻辑建立在三根支柱上：（1）JusPay 已在印度最大企业和不断增长的全球银行客户群中，巩固为关键数字支付基础设施，带来极高切换成本和接近零流失；（2）Hyperswitch 开源平台（截至 2026
              年中 GitHub star 超过 43,000）是可信的护城河扩张器，可降低全球企业获客成本，并形成开发者社区锁定；（3）公司在生命周期新增资本适中（约 $130M）的情况下，于 FY25 实现 GAAP
              盈利，说明单位经济模型强，如果全球收入组合改善，具备扩展性。反方逻辑集中在支付网关绕过 JusPay 编排层的破坏风险——Razorpay、PhonePe 和 Cashfree 自 2024 年 12 月 /
              2025 年 1 月起共同指示商户停止使用第三方编排商——以及地理集中度：在全球合同成熟前，FY26 收入仍是单一国家押注。


              牛市情景（20–25% 概率）：JusPay 执行全球银行基础设施建设，印度收入在新银行合同驱动下保持 50%+ 增长，网关争议解决或证明影响不重大；FY27 收入达到 $120–140M，在增长调整后倍数
              15–20x 下支撑 $2.0–2.8B 估值。基准情景（45%）：在网关逆风下，印度收入增速放缓至 25–35%，全球收入缓慢爬坡（FY27 达收入的 5–8%），盈利能力保持；FY27 收入约
              $90–100M，公允价值约 $1.3–1.8B，倍数 13–18x。熊市情景（35%）：网关去中介化加速，JusPay 失去 20–30% 的印度 POP 收入，全球合同交付不足，IPO 窗口收窄；FY27
              收入约 $55–65M，估值承压至 $500–800M（8–12x 倍数），相对当前标记构成 down round 风险。


              可比公司组分为四层：（a）公开市场高增长支付基础设施——Adyen（约 $43B 市值、20x 收入、47%+ EBITDA margin、2026 年 20–22% constant-currency
              growth）；（b）私营全球规模 orchestrator——Stripe（$159B，约 23x 收入，2025 年 TPV 约 $1.9T）；（c）印度 fintech 可比——Razorpay（目标以约
              10–13x FY25 收入 ₹3,783 crore、$5–6B 估值 IPO，较 2021 年 $7.5B 峰值 haircut 33%）；以及（d）区域支付基础设施——Checkout.com（私营估值约
              $11B，估计约 10–14x）。JusPay 的 18–20x 倍数处于（a）/（b）与（c）/（d）之间，部分由盈利能力和 TPV 规模支撑，但考虑印度集中度，相对印度市场可比公司偏高。
