      - number: '1.3'
        title: 融资历史与投资人图谱
        blocks:
          - type: paragraph
            body: >-
              自 2012 年成立以来，Juspay 已披露约 $197M 一级资本融资。公司经历了五轮融资：2015 年 10 月 Accel 投资 $6.41M Series A；2020 年 3 月 VEF 领投
              $21.6M Series B；2021 年 12 月 SoftBank Vision Fund 2 领投 $60M Series C，估值约 $460–478M；2025 年 4 月 Kedaara
              Capital 领投 $60M Series D，估值约 $900M（SoftBank 和 Accel 参投）；2026 年 1 月 WestBridge Capital 以 $1.2B 投后估值投资 $50M
              Series D 追加轮。2026 年 1 月这一轮同时包含一级和二级交易，二级部分为早期投资人和持有 ESOP 的员工提供部分流动性——这也是约一年内第二次流动性事件。


              Wellington Management 参与了 Series B 和 C。Avendus Capital 担任 2026 年 1
              月交易的独家财务顾问。已披露股权融资总额不含任何债务工具；公开报道中没有关于风险债或信贷额度的引用。投资人治理权未公开披露，董事会构成、按比例跟投权和信息权仍是待查事项。WestBridge Capital
              管理资产约 $7B，是最近活跃的投资方，并公开把这笔投资定位为对基础设施的长期高信念押注。
