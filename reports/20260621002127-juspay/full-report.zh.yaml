    rows:
      - - 毛利率 / 收入成本
        - 无法判断收入质量或单位贡献利润；若 pass-through 成本增长，EBITDA 改善可能掩盖毛利率被侵蚀
        - 私营公司；MCA P&L 已提交，但公开摘要中的毛利行不够细
        - 向管理层索取按业务流划分的收入和收入成本明细；与公开 PSP 中的 UPI 基础设施可比公司比较
      - - 净收入留存（NRR）
        - 无法判断既有客户是在扩张、流失还是压价；这是按 SaaS 质量估值的核心指标
        - 未披露；公司从未披露 NRR 或客户级 cohort 数据
        - 按分部索取 NRR（编排 vs 银行基础设施）；对标基础设施 SaaS 的 100-120% 区间
      - - 客户集中度（前 10 大收入占比）
        - Juspay 服务 Amazon、Flipkart —— 如果 2–3 个客户贡献 >40% 收入，续约风险就很实质
        - 未公开披露；印度私营科技公司通常不披露
        - 索取前 10 大客户收入占比和合同续约日期
      - - FY25 费用细分
        - 员工成本已披露；云、销售和研发科目不透明——无法判断盈利能否重复，还是依赖一次性降本
        - 新闻摘要只有汇总费用科目；FY25 完整 MCA P&L 尚未进入公开渠道
        - 从 MCA / Tofler 申报或购买 FY25 财务报表；要求管理层解释
      - - 定价条款和实际 take rate
        - 隐含 take rate（约 0.006%）是推导估算；实际计费模式、折扣和净收入可能显著不同
        - 定制化企业合同；无公开价格表
        - 索取代表性定价表或每笔交易的平均有效费率
      - - FY26 前瞻收入指引
        - 当前财年没有公开数字指引；在聚合商流失背景下，61% 增速能否延续不清楚
        - 私营公司；不发布前瞻指引
        - 在下一次投资人会议索取 FY26 年度计划目标和 pipeline 指标
