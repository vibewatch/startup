      - - 国际扩张监管阻断
        - RBI、GDPR 监管方、DFSA 行动；目标市场外汇牌照被拒
        - 战略市场（GCC、EU、APAC）监管牌照被拒，或任何辖区出现执法行动
        - 重新评估国际收入预测；更新熊市情景假设
      - - 创始人离任
        - 董事会披露；LinkedIn；新闻稿
        - CEO 或 COO 未宣布继任安排即意外离任
        - 立即开展治理复核；评估梯队深度和连续性承诺
