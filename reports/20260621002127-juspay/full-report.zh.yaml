      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              2020 年 8 月数据泄露仍是 Juspay 历史上最重大的负面事件：未回收的 AWS access key 让未授权访问者进入一个 datastore，其中存有估计 3500 万至 1 亿条记录的
              masked card data 和用户元数据。直到 2021 年 1 月，一名网络安全研究员发现这些数据在 darknet forum
              上出售，泄露才公开披露；这引发的透明度和治理担忧一直延续到后续融资讨论。Juspay 的补救措施包括轮换 AWS credential、采用基于 IAM role 的访问、对所有内部工具强制 2FA，并启用
              threat-intelligence monitoring。公司声称完整卡号、CVV、PIN 或交易数据均未被访问，PCI-DSS 卡金库也未受损。不过，独立研究人员指出，card fingerprint
              可能被 reverse-engineer，明文 email 和电话号码会增加 phishing 风险。

              可用性方面，Juspay 自报 99.999% 可靠性，状态页显示截至 2026 年 6 月 API、payment page 和 SDK 均正常运行。2026 年 5 月 26 日的一次事件因 AWS
              KV-store 自动故障转移引发临时 5xx errors，但无需人工干预即解决。最近一次 sandbox 持续不可用发生在 2025 年 8–9 月，持续 25 天。对 AWS
              的运营依赖是一项集中度风险：印度区域若发生重大 AWS outage，将直接削弱服务。全球范围内 PCI DSS v4.0.1 合规要求在 2025 年 3 月前完成；Juspay 声称拥有 Level-1
              PCI DSS certification，这降低了 card-fraud liability。欺诈风险通过 tokenisation、3DS authentication 和 AI-based routing
              管理，但公开文件缺少详细 fraud-rate 披露。
            claimRefs:
              - CR009
