          - type: callout
            title: 开源护城河创造独特信任与社区分发
            body: >
              HyperSwitch 拥有 42,000+ GitHub stars、4,800+ forks 和 246+ contributors，是全球 star 数最高的金融科技开源项目之一。Apache 2.0
              许可意味着企业集成没有病毒式 copyleft 风险。这个开发者社区提供了专有竞争对手难以复制的分发渠道——口碑采用、公开安全审计和社区驱动的连接器贡献。开源代码库也满足企业采购团队对代码级可见性的要求。
            calloutType: strength
            claimRefs:
              - CP002
