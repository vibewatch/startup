  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Juspay 的可服务市场不是整个数字支付系统，而是架在支付轨道之上的企业软件层。公司在全球官网（juspay.io）上以「Global Payments Operating
              System」定位，面向电商、旅行、酒店和银行业的 500+ 企业；印度产品页面（juspay.in）则服务另一类买家——需要 HyperCheckout、HyperUPI、Express
              Checkout、Payouts，以及包括 HyperCredit 在内的分期 / 可负担支付产品的商户。证据显示有三条清晰市场边界。第一，印度支付聚合与编排：Juspay 于 2024 年 2 月获得 RBI
              Payment Aggregator 牌照，进入 Razorpay、Cashfree、PayU、Paytm、PhonePe、CCAvenue 和 Pine Labs
              等玩家参与的持牌市场。第二，全球支付编排软件：通过 Hyperswitch（hyperswitch.io），一个连接 50+ 国家 300+ PSP 和收单方的开源、可组合平台，Juspay 与
              Adyen、Stripe、Checkout.com、Spreedly 和 Primer 竞争，目标客户是希望获得多 PSP 独立性的企业商户。第三，银行和卡组织基础设施：Juspay 的 UPI
              Issuing、Acquiring 和 TPAP 栈面向希望运营或扩展支付基础设施的银行和金融机构。每条边界对应不同买家、替代方案和经济性。现状替代方案也因细分市场而差异很大。在印度，大型企业商户过去常直接使用
              Razorpay 或 Cashfree 作为 PG，并自建路由逻辑；中型商户依赖单个聚合商托管的结账页。全球范围内，Stripe 和 Adyen 是占主导的单一供应商默认选择；采用多 PSP
              策略的商户通常用内部工程资源逐个接入 PSP，而不是采购独立编排层。银行建设 UPI 基础设施时，可以找 IT 集成商（TCS、Infosys、Wipro），也可以直接对接 NPCI 框架。是否选择
              Juspay，主要取决于商户想连接多少 PSP、愿意投入多少内部工程产能，以及是否需要一个供应商中立的编排层，让他们无需改代码就能切换 PSP。
