      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Juspay 由 Vimal Kumar（CEO）、Ramanathan RV（技术联合创始人）和 Sheetal Lalwani（COO）共同创立。Vimal Kumar
              是主要对外领导者，主导公司战略方向，包括押注开源 Hyperswitch 和全球扩张。联合创始人兼 COO Sheetal Lalwani
              负责运营、全球扩张和外部合作；她在融资公告和财务披露中代表公司发声。Ramanathan RV 则被认为奠定了公司的底层工程架构。


              公司对三位创始人的关键人依赖较高：三人仍都深度参与运营，Juspay 也未披露 2026 年任何重大 C-suite 任命或领导层变动，说明公司仍保持创始人主导结构。Nishant Sameer 被确认担任
              Juspay 美国业务 VP，为北美扩张补上一名高级负责人。董事会构成和治理细节未公开披露；对于一家估值 $1.2B
              的公司，这是实质性尽调缺口。投资方董事（WestBridge、Kedaara、SoftBank）很可能拥有董事会观察员或董事席位，但公开文件尚未确认。Avendus Capital 担任 2026 年 1
              月融资的独家财务顾问，说明公司在资本事件上已有专业化治理安排。
