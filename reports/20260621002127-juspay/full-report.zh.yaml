      - number: '7.5'
        title: 缓释因素与否决标准
        blocks:
          - type: paragraph
            body: >
              结构性缓释因素已有若干项：双 RBI 牌照（PA-O + PA-CB）提供合法且可防守的监管基础；首年盈利（FY25）降低 burn 风险；声称 99.999% uptime 和 AWS 自动 failover
              提供运营韧性；Level-1 PCI DSS certification 限制 card-fraud liability；开源 HyperSwitch 将 Juspay
              定位为超越印度争议编排市场的中立基础设施玩家。国际地理多元化（中东 DIFC hub、APAC、拉丁美洲、欧洲、北美）随时间推移降低单一市场监管集中度风险。

              关键未解风险包括：没有公开的多云冗余架构、未披露收入集中度指标、没有公开 DPDPA 合规评估、未披露 fraud-rate 或 chargeback-rate
              benchmark，以及相对公司估值而言独立董事会监督有限。尽调否决标准包括：任何代表 TPV 超过 20% 的 top-3 客户流失且无替代；任何新的 RBI enforcement action
              或牌照暂停；第二次重大数据泄露并触发 DPDPA 处罚；以及 PA 退出潮导致编排收入线同比下降超过 25%。
            claimRefs:
              - CR032
