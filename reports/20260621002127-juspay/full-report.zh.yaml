        title: 国际扩张、集中度风险与负面信号
        blocks:
          - type: paragraph
            body: >
              JusPay 的国际扩张越来越多地得到公开来源验证。截至 2026 年，公司服务 APAC（日本、台湾、越南、新加坡、印度尼西亚、澳大利亚）、MENA（沙特阿拉伯、阿联酋）、欧洲（通过
              Hyperswitch）和北美（Hyperswitch 美国发布）的客户。2026 年面向 APAC 的博客文章点名 Amazon、Google 和 Microsoft
              是该地区企业客户。未具名的全球航空案例研究描述了覆盖 20+ 个国家、集成 8 个新 acquirer 的部署。集中度风险重要但在变化：Amazon India
              历史上是最突出的具名客户，也可能按交易量计是最大客户，尽管没有公开收入集中度数据。如果 Amazon India
              占收入很大比例，任何迁移或重新谈判事件都可能显著影响已披露指标。抵消因素包括具名客户名单覆盖多元垂直领域（电商、银行、航空、外卖、电信），以及国际收入组合增长。客户记录中最重要的负面信号是 2020 年 8
              月数据泄露：未回收的 AWS access key 被未授权行为人利用，访问了一个包含 3500 万条客户记录（masked card data、card fingerprints）以及最高 1
              亿用户元数据的存储系统。CNBC TV18 引述的网络安全专家称公司未及时向终端用户披露的做法「极其不负责任」，CSO Online 报道称卡数据可能通过 hash-collision attacks
              被破解。JusPay 确认了泄露并说明补救措施，但该事件带来尽调问题：企业客户信任是否受损，2020 年后是否出现相关合同重谈或客户流失。
