    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Juspay 是一家跨国支付技术公司，2012 年由 Vimal Kumar 和 Ramanathan RV 在印度 Bengaluru 创立。公司把自己定位为 B2B
              基础设施供应商，藏在大型企业和银行的结账与支付流程背后，不直接争夺消费者市场份额。它的商业身份由三层咬合而成：商户支付编排（把交易智能路由到 300+ 支付网关以提升成功率）、银行基础设施（面向金融机构的端到端
              UPI 与银行卡收单栈），以及开源平台（Hyperswitch，这套采用 Apache 许可、基于 Rust 的编排引擎），把商业影响力延伸到开发者社区。


              收入模型也对应这一拆分：约一半收入来自商户编排费，另一半来自银行基础设施许可和服务。Juspay 在编排上与 Razorpay、Cashfree 竞争，但靠深度集成、UPI
              专长和开源足迹做出差异。公司声称可用性达到 99.999%，并提供 300+ 个无代码网关集成，开箱即含 PCI-DSS 合规。核心产品包括 HyperCheckout（全栈结账 UI
              与编排）、HyperSDK（适用于 Android、iOS、React Native 和 Flutter 的移动支付 SDK）、PURE（嵌入 HyperCheckout 的支付统一与路由能力），以及
              Hyperswitch（拥有 43,000+ GitHub stars 的开源编排平台）。这套商业模式优先锁住关键任务型企业客户，而非获取消费者，因此 Juspay 更像基础设施中间件，不像支付 App。
