      - number: '2.5'
        title: 采用约束与负面证据
        blocks:
          - type: paragraph
            body: >-
              Juspay 面对的市场并非单边利好。证据中最重要的负面信号是结构性的：2025 年 1 月，Razorpay 和 Cashfree 宣布暂停与包括 Juspay 在内的第三方支付编排平台直接集成，此前
              PhonePe 已退出合作。这直接影响 Juspay 通过印度最大 PSP 路由交易的能力——按交易量看，其中包括 Razorpay 和 Cashfree——也会压缩 Juspay
              编排层的本土市场机会，除非商户改用直接 PA 集成，或使用 Juspay 自己的 PA 牌照。The Morning Context 将其定义为一场结构性经济之争：'In Juspay vs. Fintechs,
              Economics Will Decide the Winner,' 并指出，除非 Juspay 能用自有 PA 基础设施或替代 PSP 伙伴补上这些支付轨道，否则 PSP 退出会从根本上威胁其印度多 PSP
              路由模式。第二个约束是收入集中：Juspay 联合创始人公开指出印度贡献 98–99% 收入，意味着全球扩张叙事仍处早期，印度本土市场经济性决定近期增长轨迹。第三，2020 年数据泄露（Juspay 服务器中
              35 crore 条银行卡记录受损，影响 Amazon 和 Swiggy 用户）留下了关于安全基础设施的长期声誉问题。公司此后通过 PCI DSS 4.0.1、ISO 27001:2022 和 SOC 2
              Type 2 认证修补，但这一问题仍会出现在尽调审查中。第四，支付编排和聚合的利润率承受结构性压力：印度支付 interchange 经济性长期偏薄，大型 PSP 自建路由产品（Razorpay
              Optimizer、Cashfree FlowWise）带来的直接集成竞争，也限制了 Juspay 在本土提高 take rate。第五，全球扩张耗资本：在 50+ 国家运营并维护 300+ PSP
              集成，需要持续承担各法域合规维护；而 Juspay 至今总融资仅约 $90M，相对于全球化野心并不算多。
