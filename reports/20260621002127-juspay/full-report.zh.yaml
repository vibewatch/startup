  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户规模与企业画像
        blocks:
          - type: paragraph
            body: >
              JusPay 是印度部分最重要数字商业平台背后的支付基础设施层，并在快速向国际扩张。截至 2026 年，公司在其支付编排产品页声称全球拥有 500 多家企业客户，高于约 2020–2022 年披露的 200+
              家企业。其 GitHub 上的 Hyperswitch 开源平台页面写有「全球 400+ 家领先企业」，说明两条产品线服务的是有所重叠但并不完全相同的企业客群。平台每日处理超过 3 亿笔交易，年化总支付金额已超过
              $1T，商户应用内 SDK 安装量达 25 亿。这些头部指标使 JusPay
              按交易量跻身亚洲最大的支付基础设施玩家之列。客户覆盖印度电商、外卖、旅行、金融服务和电信垂直领域，并在东南亚和中东形成有意义渗透。绝大多数具名客户关系都涉及多产品部署（结账
              SDK、编排、tokenization、offers engine），更像深度集成，而不是单点工具采用。
