      - number: '6.3'
        title: 使用场景、部署与结果证据
        blocks:
          - type: paragraph
            body: >
              最详细的公开案例研究来自 Hyperswitch 平台的案例库。按客运量计的印度最大航空公司 IndiGo 部署了 JusPay 的 Express Checkout、Tokenization、Offers
              Engine 和 Price Lock，新增 8 个支付网关，并报告整体处理成本约下降 10%，欺诈率也可衡量地下滑。总部在新加坡的在线旅行社 Agoda
              在五个亚洲市场——越南、日本、台湾、沙特阿拉伯和新加坡——集成 JusPay，启用 VNPay、PayPay、LinePay、Apple Pay 和 UPI
              等本地支付方式，并提升转化率、加快对账。Swiggy（覆盖 700 个印度城市的外卖平台）用 HyperUPI 和 Express Checkout 将 UPI
              结账流程从六步缩到两步，解决支付环节的购物车放弃问题。Flipkart 实施带 Native OTP 的 SAFE 3DS SDK，消除 OTP 漏填或延迟输入，提升银行卡成功率。中东旅行市场 Wego
              在沙特阿拉伯和阿联酋部署智能路由和统一对账。Tiket.com（印度尼西亚）从国内扩展到 10+ 个国家，同时处理 40 种本地支付方式，对账率达到 99%。这些结果证实，JusPay
