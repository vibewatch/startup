      - - 股权结构和优先权堆栈
        - 清算优先权、反稀释条款和完全摊薄股数未披露
        - 决定退出时的实际股权价值；沉重优先权包袱可能抵消独角兽名义估值
        - 向公司 / 银行家索取；VEF 二级出售先例说明股权表可能可获得
      - - 全球收入拆分
        - 除“印度约 98-99%”外，FY25/FY26 按国家的收入组合未确认
        - 国际收入牵引是主要牛市情景驱动；当前披露不足
        - 索取经审计 MCA 财务；与 Hyperswitch 企业交易公告交叉核对
      - - 网关争议解决
        - JusPay 与 Razorpay、PhonePe、Cashfree 之间未披露正式解决方案或商业协议
        - 若争议升级，约 50% 收入面临风险；2025 年 1 月后当前状态不清楚
        - 商户访谈；PG 投资者电话会议纪要；监控 RBI 互操作性指引
      - - WestBridge 估值方法
        - 未披露 $1.2B 标记的依据——收入倍数、DCF 或先例交易
        - 理解依据可验证该标记在下行周期是否站得住
        - 直接询问 WestBridge；用可比交易分析反推隐含模型
      - - IPO 时间线和 DRHP 准备
        - 未公开宣布 DRHP 递交或上市时间线
        - 决定投资者流动性周期；Razorpay DRHP 先例显示 2026–2028 年时间线可实现。
        - 跟踪 SEBI DRHP 备案；监控 Avendus Capital 顾问活动
    notes: 尽调问题按对“跟踪”建议的重要性排序。第 1–3 项是上调至“买入”的门槛；第 4–6 项用于风险校准。
    claimRefs:
      - CV023
      - CV024
      - CV025
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Juspay 用 14 年从 Bengaluru 的卡片金库创业公司，走到印度 2026 年首个 $1.2B 独角兽；期间的不利事件也塑造了它的监管地位和竞争位置。
    data:
      items:
        - date: '2012'
          label: 创立于 Bengaluru
          detail: Vimal Kumar 和 Ramanathan RV 创立 Juspay，试图简化印度碎片化支付；最初产品为 Card Vault。
          tone: positive
        - date: 2015-10
          label: A 轮 — Accel $6.41M
          detail: 首个机构投资加速企业支付编排产品开发。
          tone: positive
        - date: 2020-08
          label: 数据泄露（不利）
          detail: AWS key 漏洞暴露 35-100M 条记录；数据在暗网出售；RBI 就网络安全规范与行业沟通。
          tone: negative
        - date: 2021-12
          label: C 轮 — SoftBank $60M
          detail: SoftBank Vision Fund 2 领投，估值约 $460-478M；成为首个主要全球机构投资方。
          tone: positive
        - date: 2024-02
          label: RBI PA 牌照
          detail: 获得印度国内支付聚合商牌照；可在监管框架下为商户结算。
          tone: positive
        - date: 2024-12
          label: 竞品生态退出
          detail: PhonePe 随后 Razorpay、Cashfree 以利益冲突为由切断商户连接。
          tone: negative
        - date: 2025-04
          label: Series D — Kedaara $60M
          detail: Kedaara 领投，估值约 $900M；二级交易部分带来首次 ESOP 流动性事件。
          tone: positive
        - date: 2025-11
          label: 首个盈利财年 FY25
          detail: 收入 ₹540 crore（同比 +61%）；净利润 ₹62 crore；获得 RBI 跨境 PA-CB 牌照。
          tone: positive
        - date: 2026-01
          label: WestBridge $50M — 独角兽
          detail: 估值 $1.2B；印度 2026 年首家独角兽；二级交易带来第二次 ESOP 流动性事件。
          tone: positive
    approximationNotes: 创立年份和 UPI 产品里程碑只采用年份；最早期事件的具体月份没有公开记录。
