      - number: '5.3'
        title: 开发者生态与开源策略
        blocks:
          - type: paragraph
            body: >-
              Juspay 的开源策略围绕 Hyperswitch 展开。截至 2026 年 6 月 20 日，Hyperswitch 拥有 43,037 个 GitHub star 和 4,821 个 fork，是全球
              star 数最高的开源金融科技基础设施仓库之一。github.com/juspay 上的 GitHub 组织托管 343+ 个公开仓库，体现出覆盖支付、AI 工具（Neurolink）、NixOS
              配置管理（services-flake）和开发者体验工具的广泛工程产出。Hyperswitch 可作为自托管栈使用，也可采用 Juspay 托管的 SaaS，并提供无需设置即可供开发者探索的托管
              sandbox。SDK 覆盖 Android（Kotlin）、iOS（Swift）、React Native（Dart）和 Flutter；截至 2026 年 3 月，pub.dev 上的 Flutter
              package 版本为 1.5.2，获得 130 个 pub.dev like。Hyperswitch web SDK 是用 ReScript 构建的 React library，通过 npm
              分发。开发者支持界面包括 Slack 社区、GitHub Discussions、专用 Stack Overflow tag、API reference 文档、Postman collection 和公开
              Academy。开源策略制造分发护城河：评估自托管的企业商户可以审计代码库，降低尽调摩擦，并推动向托管 SaaS 转化。风险在于，开源也让资源充足的竞争对手能够自行 fork 并部署 Hyperswitch，削弱
              Juspay 的 SaaS 溢价。GitHub 仓库仍有 1,823 个 open issue，也释放出维护压力信号：相对当前贡献者能力，issue backlog 偏大。
