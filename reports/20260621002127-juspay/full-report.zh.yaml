              FlowWise）。Juspay 的 RBI PA 牌照加深了竞争冲突。如果印度主要 PG 继续推行商户直连政策，哪怕全球 Hyperswitch 扩张仍处早期，Juspay 国内编排 TAM 也会收缩。
