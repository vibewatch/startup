  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Juspay 受印度储备银行（RBI）更严格的支付聚合商（PA）框架约束，该框架以《支付聚合商监管主指引》形式发布，并于 2025 年 9 月 15
              日生效。该综合指引取代所有既有指引，并首次把实体销售点聚合商（PA-P）纳入与线上（PA-O）和跨境（PA-CB）聚合商相同的牌照与资本框架。Juspay 持有线上 PA 牌照（2024 年 2 月）和
              PA-CB 牌照（2025 年 11 月），是最早持有全部三类牌照的非银行机构之一。不过，牌照扩张是一把双刃剑：竞争性 PA 认为 Juspay
              已不再是中立技术层，而是存在利益冲突的竞争聚合商，这直接触发了对其编排层的退出。

              RBI 框架要求授权时最低净资产为 ₹15 crore，并在第三年提升至 ₹25 crore；持续在 scheduled commercial bank 维护 escrow；强制完成 FIU-IND 注册；季度
              escrow 审计；年度 CERT-In 网络审计；月度交易报告；以及 T+1 结算义务。违规风险包括《2007 年支付和结算系统法》下的金钱处罚、牌照暂停和公开点名。《2025
              年数字个人数据保护法》（DPDPA）围绕跨境数据传输和同意增加了分层义务；它与 RBI 既有数据本地化通知（所有支付数据存储在印度，外国副本 24 小时内删除）的互动仍不明确，可能给 Juspay
              国际扩张策略带来合规成本或运营限制。截至 2026 年 6 月，未有针对 Juspay 的已知监管行动记录，独立法律分析也将公司合规姿态描述为强，但监管成本负担正在显著上升。
