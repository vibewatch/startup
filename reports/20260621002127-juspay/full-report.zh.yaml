          - type: callout
            title: 在 FY26 数据与网关争议明朗前保持 Track
            body: >
              Track 建议在已确认的运营强度（盈利能力、TPV 增长、蓝筹客户）与偏高倍数、重大未解风险（网关争议、印度集中度、私营不透明）之间取得平衡。上调至 Buy 的触发条件，是 FY26 收入增长超过
              25%、全球收入组合超过 8%，且网关争议得到确认解决或实质性降低风险。若出现任何锚定客户退出、RBI 监管行动，或低于 $1.0B 的估值下调融资，则下调至 Avoid。
