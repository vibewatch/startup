      - number: '7.3'
        title: 竞争与伙伴 / 依赖风险
        blocks:
          - type: paragraph
            body: >
              近期最尖锐的结构性风险，是印度主要支付聚合商退出编排层。PhonePe 在 2024 年 12 月切断了 Juspay 集成，Razorpay 和 Cashfree 随后在 2025 年 1
              月退出。公开理由是希望直接集成商户，以控制数据、合规和功能迭代速度，但深层驱动因素是 Juspay 从中立编排层转为持 PA 牌照的竞争聚合商。据报道，PhonePe 约 15% 的支付网关交易量通过
              Juspay 路由，三家主要 PA 合并离开，代表了重大的路由收入和交易量风险。Juspay 对影响提出异议，称自己是面向商户而非 PA 的 TSP，商户会直接接入 Juspay 自有 PA
              服务；但这套逻辑要求商户重新集成——由此产生切换摩擦，并暴露于 Razorpay（Optimizer）和 Cashfree（FlowWise）嵌入式 offer 的竞争弱点。

              客户集中度是第二层风险：Amazon、Swiggy、Flipkart、Google、IndiGo 和 HSBC 占 3 亿日交易量的不成比例份额。Juspay 声称拥有 500+
              企业客户，但收入贡献分布未公开披露。单个大客户流失或自建——这在 hyperscaler 中常见——都会产生重大影响。对 AWS 的云 / 基础设施依赖，以及未披露多云 failover
              architecture，也是额外的单点故障担忧。向 GCC、APAC、拉丁美洲、欧洲和北美扩张，会放大货币、牌照和银行合作伙伴依赖。
            claimRefs:
