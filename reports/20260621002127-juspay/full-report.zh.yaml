      - number: '4.4'
        title: 单位经济、成本结构与利润率分析
        blocks:
          - type: paragraph
            body: >
              最可见的单位经济信号是隐含 take rate：FY25 经营收入约 $62M 除以 $1T 年化 TPV，得到约
              0.006%。这与按交易收取技术费、而不是赚取交易金额价差的支付基础设施公司相当。该水平在结构上低于支付聚合商（通常在转付成本前有 1.5–2.5% gross take），也反映 Juspay
              的定位是软件基础设施层，而非承担资本风险的参与方。

              成本端，员工福利是最大支出项（历史上占收入 60–70%，FY25 经员工优化后规范化至约占费用 46%）。FY25 员工成本同比下降
              22%，既来自人员合理化，也来自成本向软件基础设施优化转移——说明公司正从服务驱动转向更产品化的运营模式。其他费用 FY25 同比增长 29% 至 ₹160
              crore，可能反映云和平台成本随交易量扩张。折旧与摊销增长 43% 至 ₹20 crore，与大量资本化软件开发相一致。

              仍未公开的关键单位经济指标包括：毛利率、净收入留存（NRR）、获客成本（CAC）和回本周期。缺少这些指标，FY25 盈利改善的收入质量和可持续性无法被充分承销。Juspay 的收入集中度也未公开，尽管平台服务
              Amazon、Flipkart、Swiggy、Zepto 等客户——如果少数 hyperscaler 占据大部分交易量，重新谈判带来的价格压力或客户自建就是实质风险敞口。
            claimRefs:
              - CI004
              - CI007
              - CI010
              - CI011
              - CI012
              - CI014
              - CI019
              - CI038
              - CI039
      - number: '4.5'
        title: 负面信号、监管背景与证据缺口
        blocks:
          - type: paragraph
            body: >
              最近最重要的负面信号是 PhonePe（2024 年 12 月）、Razorpay 和 Cashfree（2025 年 1 月）终止与 Juspay 编排平台的集成合作。三家公司都表示更偏好直接商户集成，并担心
              Juspay 的 RBI 支付聚合商牌照让其成为潜在竞争者。Juspay COO 公开称「收入影响为零」，因为公司的商业关系在商户端，而不是网关端；第三方数据也显示，退出前约 15% 的 PhonePe
              交易量跑在 Juspay 上。虽然覆盖完整财年的 FY25 财务（截至 2025 年 3 月）显示收入增长 61%，未见明显恶化，但这些退出发生在 FY25 中期，其完整运行率收入影响（如有）要到 FY26
              披露才可衡量。

              第二个负面数据点是 2020 年 12 月数据泄露，约 3,500 万条掩码卡记录、电话号码和邮箱地址暴露。公开信息未显示重大监管罚款，但事件引发 RBI 对支付中介的审查，并推动后续监管收紧。Juspay
              随后的 Series C 融资（2021 年 12 月）未出现明显投资人阻力，说明市场认为泄露事件已被控制。不过，数据安全义务——尤其是 RBI 支付聚合商指南和印度 DPDP Act
              下的义务——仍是持续合规风险。

              实质限制财务判断的证据缺口包括：毛利率（未披露）、NRR 或客户收入留存（未披露）、客户级集中度（未发布），以及「银行基础设施」收入的真实构成（是合同制 SaaS、按交易收费，还是混合）。没有毛利率，就无法把
              EBITDA 利润率趋势转化为单位贡献经济，也无法验证 FY25 盈利跃迁在 TPV 继续增长时是否可持续。
