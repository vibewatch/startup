      - number: '2.3'
        title: 买家细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              Juspay 的买家版图横跨三条市场边界，结构并不均一。对印度企业商户（Amazon、Flipkart、Swiggy、IndiGo、Zepto、BigBasket、Google Pay）来说，经济买家通常是
              Head of Payments、CTO 或 VP of Engineering，负责结账转化、交易成功率和支付基础设施成本；用户是接入 API 的工程团队；付款方则是承担交易成本的商户财务部门。全球企业使用
              Hyperswitch（航空、酒店、国际 SaaS 商户）时，买家画像转向 CTO 和支付工程负责人，他们要的是模块化、开源、供应商中立且支持多 PSP 连接的基础设施。银行和卡组织使用 Juspay UPI
              栈时，买家是技术负责人或数字银行负责人，触发点要么是监管要求必须开通 UPI，要么是竞争压力要求为账户持有人打造更好的结账体验。实际采用路径通常从单一结账或 UPI 集成开始，随着商户对 Juspay SLA
              信心增强，再扩展到认证、tokenisation、payouts 等相邻产品。Juspay About 页面引用了 IndiGo CIO、Swiggy 财务总监和 BigBasket
              产品负责人的付款体验评价，确认多产品关系的企业账户是核心买家群。HyperSwitch checkout 2026 文章记录了一个反复出现的买家痛点：70%
              消费者称支付方式可用性会影响其在哪个商户完成购买，57% 消费者在找不到偏好支付方式时会直接放弃——这为企业支付基础设施买家提供了清晰的 ROI 框架，用来证明编排支出的合理性。对银行而言，UPI
              栈决策的经济性由 NPCI 参与要求和高并发、亚秒级延迟处理需求驱动，而不是自建完整内部基础设施。
