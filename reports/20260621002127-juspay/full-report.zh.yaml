        - $62M 收入已盈利，主要资本约 ~$130M；单位经济性已在规模上验证
        - FY25 PAT ₹62 crore，对比 FY24 净亏损 ₹97.5 crore；特殊项目前 PBT ₹115 crore
        - 全球扩张成本超过收入，导致 FY26 利润率恶化
      - - 熊：网关去中介化
        - Razorpay、PhonePe、Cashfree 与 JusPay 切割，威胁约 50% POP 收入
        - 2025 年 1 月公告；Moneycontrol “merchants fuming” 负面报道；CEO 承认风险
        - 网关公司回到开放 API 模型，或 JusPay 证明商户留存稳定
      - - 熊：印度集中
        - FY25 98-99% 收入来自印度；单一国家支付基础设施公司却享受全球倍数
        - 联合创始人 Lalwani 在 2025 年 11 月简报中确认印度约占收入 98-99%
        - 国际银行合同落地，到 FY27 贡献 15%+ 收入
      - - 熊：PA 牌照冲突
