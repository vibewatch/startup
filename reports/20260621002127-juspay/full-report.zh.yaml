      - number: '1.4'
        title: 牵引力、规模与封面指标
        blocks:
          - type: paragraph
            body: >-
              Juspay 披露的运营指标显示规模增长很快。FY25 日交易量达到 300M+，较 FY24 的 175M 增长 71%；年化总支付额（TPV）在 FY25 突破 $1T，较 $400B 增长
              150%。随着这一 TPV 上的费率复利，公司走向可观的收费型收入具备合理路径。截至 2026 年，公司服务 500+ 全球企业和银行，覆盖电商（Amazon
              India、Flipkart、Swiggy、Zomato）、出行（IndiGo、Agoda、Amadeus）、金融科技（Google Pay、PhonePe 早期）、银行（HDFC Bank、HSBC），以及
              Urban Company、Zepto、Starbucks、McDonald's 等客户。


              财务上，FY25 是跃迁之年。经营收入增长 61% 至 ₹540 crore（约 $64M），公司实现首个全年盈利，净利润 ₹62 crore（约 $7.6M），扭转 FY24 ₹97.54 crore
              净亏损，并展示出经营杠杆。收入约 50% 来自商户编排，50% 来自银行基础设施。员工数达到 1,500+ 名支付专家，分布在八个全球办公室，包括 Bengaluru（总部）、San
              Francisco、Dublin、São Paulo、Singapore 和 Dubai。FY26 ARR 尚未正式披露；外部分析师引用 ₹500–700 crore 作为可能的运行收入，但公司未确认。
