      - number: '5.4'
        title: 安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >-
              Juspay 持有三项独立审计认证：用于支付数据安全的 PCI DSS 4.0.1、用于信息安全管理体系的 ISO 27001:2022，以及覆盖安全性和可用性的 SOC 2 Type 2。juspay.in 和
              juspay.io 均公开列出这些认证，并同时列出印度储备银行（RBI）的 Payment Aggregation 牌照和公开漏洞披露计划。Hyperswitch 银行卡金库按 PCI
              合规设计，静态卡数据使用硬件安全模块（HSM），并支持通过 VGS 和 TokenEx 接入外部金库而无需重新 tokenization。3DS 认证模块不绑定 PSP，可按地区监管要求配置，并在所有已连接
              PSP 上支持责任转移流程。status.hyperswitch.io 状态页为托管 Hyperswitch 平台提供公开可用性透明度。声称的 99.999% 可用性相当于每年停机少于 5.3
              分钟——这一目标与主动-主动多区域部署和即时故障转移一致，Juspay 在其可靠性原则中也明确列出。合规缺口主要在于，99.999% 可用性声明缺少独立第三方审计报告，公司自身内部账本架构也未公开披露。2021
              年安全事件曾暴露约 3500 万用户的 masked card data，是一个早于当前 PCI DSS 4.0.1 认证的历史风险标记；但这次泄露说明，公司经营史中确实可能发生大规模事件。
