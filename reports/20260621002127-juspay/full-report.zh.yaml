  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与业务结构
        blocks:
          - type: paragraph
            body: >
              Juspay 运营 B2B 支付基础设施模式，两条收入流大致相当：商户支付编排和银行基础设施服务。商户编排侧向企业收取技术访问费，用于路由、认证和结账优化——本质上是卖给
              Amazon、Flipkart、Swiggy、Zepto 等平台的 SaaS 式软件。银行基础设施侧则向希望接入商户并处理交易的银行提供 UPI 和银行卡收单栈。

              核心「支付平台集成」费用线在 FY24 贡献 ₹286.5 crore（约占当年经营收入 90%），其余来自附属技术和数据服务。公司 FY25 经营收入 ₹514 crore，对应年化 $1T TPV，隐含
              take rate 约 0.006%，这更符合纯基础设施软件定价，而不是支付聚合商的交易价差。Juspay 于 2024 年 2 月获得 RBI
              支付聚合商牌照，拓宽了获准商业范围，但管理层一直将公司定位为服务商户的技术服务提供商，而非直接支付中介。

              定价高度定制、由企业协商决定；没有公开价目表或分层价格。编排侧收入确认相对直接（交付技术服务），但银行基础设施收入会让它与纯 SaaS 收入质量基准的比较变复杂——UPI
              和银行卡收单量受监管价格上限和网络费用变化影响，而这些不受 Juspay 控制。
