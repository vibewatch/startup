            body: >
              Razorpay 是印度市场领先的金融科技公司，Series E（2021）后累计融资约 $740M，私募峰值估值 $7.5B。2026 年 6 月，Razorpay 已向 SEBI 秘密提交 IPO
              文件，目标融资 $600–700M，估值 $5–6B。Razorpay 产品套件覆盖支付网关、Magic Checkout（低摩擦 1-click 流程）、订阅与循环计费、RazorpayX 商业银行和
              payroll，将自己定位为面向印度 SMB 和 SaaS 企业的全栈金融操作系统。Razorpay 对标准交易收取固定 2% 平台费（另加 18% GST），并在 2025 年初暂停所有通过包括 Juspay
              在内的第三方路由平台进行的集成。第二大玩家 Cashfree 于 2025 年 2 月完成 Krafton 领投的 $53M 融资，估值 $700M，服务 800,000 家企业，年处理额 $80B，峰值吞吐量
              12,000 笔 / 秒。Cashfree 的关键优势包括 T+0 即时结算、印度首张 RBI PA-CB（跨境）牌照（2024 年 7 月），以及面向 marketplace 的强势 payout
              基础设施。Prosus 支持的 PayU India 在企业账单、EMI 收款和循环支付上最强，并在 50+ 市场具备真正全球覆盖；收购 BillDesk
              后，它在印度公用事业账单支付中取得主导份额。CCAvenue 是印度最老牌的大型网关，运营 20+ 年，面向需要 POS、订阅和多网络 tokenization（TokenPay）的成熟商户，并在
              UAE、Saudi Arabia 和 USA 设有国际业务。Razorpay 和 Cashfree 都明确表示，退出 Juspay 平台的理由是取消编排层费用、通过直接商户集成更快交付功能——这对 Juspay
