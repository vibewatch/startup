      - number: '5.5'
        title: 竞争差异化与技术护城河风险
        blocks:
          - type: paragraph
            body: >-
              Juspay 的核心技术差异化建立在三根支柱上：集成深度（预建 300+ PSP connector）、开发者原生的开源分发（Hyperswitch 拥有 43k+ star），以及从结账体验延伸到
              tokenization、认证和对账的多层企业产品套件。PURE 编排和 JUSPE router 产品把 Juspay 定位为商户与多个竞争 PSP 之间的智能中间件；更多 PSP
              集成会吸引更多商户，从而形成网络效应护城河。机器学习路由层声称可让经过路由优化的商户授权率提升最高 10%，比基础规则路由更难复制。不过，三家印度主要支付网关公司——PhonePe、Razorpay 和
              Cashfree Payments——在 2024 年底和 2025 年 1 月离开了 Juspay 编排。Razorpay 推出自有编排工具 Optimizer，Cashfree 推出
              FlowWise，直接向其商户基础提供类似的多 PSP 路由，绕开 Juspay 的中介位置。商户反馈称，PG 公司积极鼓励直接集成，而不是使用 Juspay 中间件，由此带来挫败感。Juspay
              的回应把自己界定为类似云基础设施的技术服务提供商，不同于支付中介，并主张互操作性必须保留。2024 年获得 RBI 支付聚合商牌照，意味着 Juspay 现在与这些 PG
              直接竞争，冲突因此加深。长期护城河问题在于，Juspay 的商户直连关系、开源策略和全球扩张（Hyperswitch）能否抵消印度市场的去中介化压力。
