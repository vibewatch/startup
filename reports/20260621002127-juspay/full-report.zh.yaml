  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分层
        blocks:
          - type: paragraph
            body: >
              Juspay 身处多层竞争环境，横跨印度本土支付网关、全球支付编排平台，以及内部自建项目和银行主导网关等结构性替代方案。第一层，Juspay
              的印度核心业务与直接支付网关和聚合商竞争——Razorpay、Cashfree、PayU、CCAvenue——这些公司都向印度商户提供端到端支付受理、结算和开发者 SDK。第二层，Juspay 的
              HyperSwitch 产品与全球支付编排平台（Primer、Spreedly、Checkout.com、Adyen、Stripe）竞争，后者提供多 PSP 路由和统一
              API。第三个结构性威胁来自大型商户和支付聚合商自建编排；PhonePe、Razorpay 和 Cashfree 在 2024–2025 年暂停与 Juspay
              直接集成，转而希望直接服务商户。替代方案包括银行发行的网关方案（SBI PG、HDFC PayZapp、ICICI Eazypay）、直接接入 NPCI，以及通过 Spreedly 或 Primer
              绕过纯编排层。印度支付网关市场 2025 年规模为 USD 2.07B，预计到 2031 年达到 USD 4.01B，CAGR 为 11.66%，数十家 PA / PG 供应商争夺企业订单。Juspay
              的战略论点是：由日交易量 300M、年化 TPV 超过 $1T 支撑的开源编排，是专有黑箱技术栈的可信替代方案。这一点把它与缺少全球编排野心的印度本土竞争对手，以及缺少印度深度与监管姿态的全球编排商区分开来。
