            body: >
              隐含抽成率约 0.006%，意味着 TPV 每增加 $1B，只带来约 $60,000
              收入。因此，收入增长必须来自交易量加速、新客户增加，或产品范围扩张（聚合商服务、银行基础设施），而不是定价权。当前抽成率结构上低于任何上市支付同业，反映其纯软件定位，但也限制了定价杠杆上行空间。
