  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品边界与模块地图
        blocks:
          - type: paragraph
            body: >-
              Juspay 的公开产品边界分成三种主要交付机制：托管结账体验层 HyperCheckout、面向开发者的开源编排平台 Hyperswitch，以及移动 SDK 分发层 HyperSDK，后者在应用内安装量超过
              25 亿。HyperCheckout 明确不是支付聚合商（PA）或支付网关（PG）；它是位于 300+ PA/PG 连接之上的体验与编排层，提供无代码结账定制、100+ 视觉配置、覆盖 Android、iOS 和
              web 的设计工作室、智能路由，以及 A/B 框架。Express Checkout SDK 为自建结账 UI 的商户提供底层 API 与 SDK 能力。HyperUPI 是面向印度市场的专门产品，支持一键
              UPI 支付，公司声称成功率超过 90%。结账之外，Juspay 还提供完整支付模块套件：网络 tokenization，支持 PSP 无关金库和第三方金库；PSP 无关的 3DS
              认证流程；NACH/eMandates 经常性支付产品；由 ML 驱动、带 30+ 可配置重试参数的收入挽回引擎；自动三方对账；以及覆盖银行卡、银行转账和钱包的即时付款产品。HyperCredit
              产品增加了用于嵌入式信贷的放款方编排系统。这张模块地图的广度让 Juspay
              能在企业商户处形成多个集成触点，并在支付栈多层制造切换成本。尽调问题在于，模块深度能否转化为每个模块的可防守收入，还是单个功能会被资源充足的 PG 和 PSP 轻易复制。
