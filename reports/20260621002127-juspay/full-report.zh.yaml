      - number: '2.2'
        title: 市场规模与基础设施
        blocks:
          - type: paragraph
            body: >-
              Juspay 的市场规模判断高度取决于使用哪种视角。印度数字支付体量巨大，但其中只有一小部分会转化为编排中介的软件收入。据 GlobeNewsWire 报道的一项市场预测，印度数字支付交易总额预计到 2026
              年将达到约 $10T，底层支付流量非常庞大。收窄到编排软件层面，多家分析机构估计全球支付编排平台市场 2024 年约为 $2–3B，到 2031 年增长至 $6–7B，CAGR 为 20–24%。Juspay
              自身披露的指标可帮助校准 SOM：年 TPV $1T（公司称 FY25–FY26 已达到）以及日处理交易量 300M+。若假设平均有效收入率为 TPV 的 3–6
              个基点（与偏软件的编排模型一致），对应年化总收入估算为 $300–600M；这与 Juspay 披露的 Rs. 514 crore（约 $61M）经营收入相比仍偏高，意味着实际收益率显著低于该区间，或并非全部
              TPV 都通过 Juspay 收入线收费。尽管服务 500+ 全球企业，印度仍贡献 Juspay 收入的 98–99%，确认印度本土机会仍是核心经济池。全球编排市场机会具备结构性，但对 Juspay
              来说基本仍处于收入前阶段。Mordor Intelligence 将印度支付网关市场列为高增长赛道，增长由 UPI 普及、智能手机渗透和政府数字支付举措驱动，同时指出持牌 PA 玩家竞争密度高。保守估计，到
              FY27，印度面向商户的支付软件 TAM（网关 + 编排 + 合规工具）可能达到每年 Rs. 4,000–6,000 crore（$500–700M），但尚无可信公开来源精确拆出这一数字。
