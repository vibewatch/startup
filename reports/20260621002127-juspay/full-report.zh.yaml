      - number: '4.3'
        title: 资本充足性、融资历史与前瞻流动性
        blocks:
          - type: paragraph
            body: >
              Juspay 历史上已披露股权融资超过 $170M。Accel 约从 2016 年起提供早期机构支持；VEF 领投 2020 年 Series B；SoftBank Vision Fund 2 于 2021 年
              12 月领投 $60M Series C，估值约 $460M，Wellington Management 和 VEF 参投。2025 年 4 月，Kedaara Capital 领投 $60M Series
              D（约 $10M 一级、约 $50M 二级），估值约 $900M，SoftBank 和 Accel 参投；VEF 在二级交易中出售其 10.2% 持股的一部分，套现 $14.8M。2026 年 1
              月，WestBridge Capital 以 $1.2B 估值投资 $50M（一级加二级），使 Juspay 成为印度 2026 年首家独角兽，Avendus Capital 担任财务顾问。

              连续的近期流动性事件（2025 年 4 月和 2026 年 1 月融资均含二级部分）说明，在 IPO 路径尚未出现时，投资人正变现早期仓位，而一级资金用于全球扩张。FY24 披露的现金及银行余额合计约 ₹220
              crore（约 $26M）；FY25 管理层称现金消耗接近零，且经营现金流为正，意味着余额大体保留。2026 年 1 月获得 $50M 一级资本且经营现金生成转正后，公司短中期流动性看起来足以支撑已披露的
              FY26 投资计划。

              根据 MCA 记录，公司有一笔已披露贷款；RBI 支付聚合商要求最低净资产为 ₹25 crore，Juspay 当前资本基础和留存收益应能满足这一要求，不过精确净资产构成（实收资本 ₹13.3 crore 加
              reserves）仍需从公司已提交资产负债表直接核验。
