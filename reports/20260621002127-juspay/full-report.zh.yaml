      - number: '8.3'
        title: 建议、风险评级与尽调问题
        blocks:
          - type: paragraph
            body: >
              基准建议为 Track。在 $1.2B 估值和约 18–20x LTM revenue 下，相比现有公开证据所能支持的 FY26 收入轨迹、全球收入组合和 cap-table 结构，JusPay
              定价偏紧。公司已经证明了真实价值创造——盈利经营、出色 TPV 增长、蓝筹客户名单和差异化开源护城河——但近期 thesis-test 在于，随着网关争议成熟，FY26 收入能否维持 30%+
              增长。信心为中等，因为财务文件不公开（MCA 数据滞后），管理层 guidance 也较高层。风险评级为高，主要由印度集中度和威胁约 50%
              收入的网关去中介化情景驱动。估值立场是偏高：市场赋予了同业组溢价，需要公司成功完成全球收入多元化，或在网关逆风下继续守住印度主导地位。若要转为买入，需要：（a）FY26 management accounts
              显示收入增长 25%+ 且无重大流失；（b）可信的全球收入组合目标（FY27 达 10%+）；（c）确认 cap-table overhang 和 preference
              stack；以及（d）网关争议解决，或有文件证明风险已实质降低。


              关键 thesis-break 触发因素包括：三家异议方之外的任何 PG 切断关系、JusPay 失去 marquee anchor client（Amazon/Flipkart/Google）、RBI 确认对
              JusPay 的 PA 模型采取监管行动，或 Vimal Kumar、Sheetal Lalwani 任一人离任。正向重估催化因素包括：Razorpay IPO 定价高于 $5B（验证印度 fintech
              倍数）、单个超过 $5M ARR 的重大全球银行合同，或 JusPay 自身公布 IPO roadmap。
