companyProfile:
  summary: >
    Juspay 是一家总部位于 Bengaluru 的企业支付基础设施公司，成立于 2012 年。公司向商户销售支付编排、结账软件、移动 SDK、银行级 UPI 与银行卡基础设施，以及开源 Hyperswitch
    平台。公开证据支持其规模强、经济性改善的判断：FY25 收入 ₹514–540 crore，首次实现全年盈利，日交易量 300M+，年化 TPV 超过 $1T，并服务全球 500+ 企业和银行。核心承销分歧在于：
    在网关去中介化风险仍未解除的情况下，这一规模能否足够快地在国际市场复利，支撑显著高于印度金融科技可比公司的私募市场倍数。
