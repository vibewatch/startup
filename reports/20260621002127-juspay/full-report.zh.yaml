              PhonePe、Razorpay 和 Cashfree——印度最大的三家支付聚合商——在 2024 年 12 月至 2025 年 1 月期间分别暂停或搁置了与 Juspay 编排层的直接集成。此前约 15% 的
              PhonePe 网关交易量跑在 Juspay 上。公开理由是消除编排层费用，并通过直接商户集成加快功能交付。若这种直接集成趋势扩展到其他大型 PA，Juspay 的印度 TSP
              收入管线可能明显收窄，进一步强化其把 HyperSwitch 国际企业销售作为主要增长向量的战略转向。
