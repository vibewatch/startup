      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: PA 退出潮：对编排收入的结构性威胁
            body: >
              PhonePe（2024 年 12 月）、Razorpay 和 Cashfree（2025 年 1 月）同时退出 Juspay 编排层，并非临时争端，而是印度支付栈的结构性转变，驱动因素正是 Juspay
              自身转为 PA 牌照持有者。每一家退出的 PA 现在都是竞争者，并且已经或正在建设自己的编排产品（Razorpay Optimizer、Cashfree FlowWise、PhonePe 自建）。如果
              Juspay 不能在自身 PA 伞下重新锚定商户关系，编排收入线将面临多年侵蚀，除了企业粘性外没有结构性底部。
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
          - type: callout
            title: 2020 年数据泄露遗留问题：治理与披露缺口
            body: >
              2020 年 8 月数据泄露涉及最高 1 亿用户记录；直到 2021 年 1 月，一名研究员发现数据在 darknet 出售，事件发生五个月后才公开披露。安全研究员批评 Juspay 延迟披露以及 card
              fingerprint 可能被 reverse-engineer，称其「极其不负责任」。尽管公司采取了补救措施，但没有公开发布独立的事后审计；DPDPA 2025
              现在会要求迅速披露泄露事件。在新法律下若再次发生，除 DPDPA 处罚外，还会损害作为公司生命线的企业客户声誉。
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >
              2026 年 1 月，WestBridge Capital 领投 $50M Series D 追加融资，将 JusPay 估值定在 $1.2B，公司因此成为独角兽；这一估值比 2025 年 4 月 Kedaara
              领投的 $60M 轮次所定 $900M 高 33%，也较 2021 年 12 月 Series C 的 $460–478M 估值提升超过 2.5x。2026 年 1
              月交易混合了新股和老股转让部分；老股部分在十二个月内为 ESOP 和早期投资人提供了第二次流动性事件，说明股权结构正被管理层推向中期退出。Avendus Capital 同时担任 2025 年 4 月和 2026
              年 1 月两轮的财务顾问，与最终 IPO 准备流程一致。公司生命周期内累计新增资本约 $120–130M，而披露轮次规模为 $197M（其余为老股转让）；按独角兽标准，生命周期稀释仍属温和。


              以 FY25 经营收入 ₹514–540 crore（按 ₹83/USD 约 $62–65M）计算 last-twelve-months revenue，隐含 EV/Revenue 倍数约为 18–20x。这低于
              Adyen 约 20x 的公开市场倍数，并大致处于 Stripe（$159B，约 23x）和 Checkout.com（$11B，估计约 10–14x）等高增长私营支付基础设施同业的 15–23x
              区间。相对传统收单机构（2–6x）和 Razorpay IPO 目标倍数（基于 FY25 收入约 10–13x）的溢价，反映了 JusPay 的盈利型基础设施定位、$1T+ TPV
              规模，以及与头部企业和银行客户的粘性。


              可能压缩倍数的关键估值风险因素包括：印度收入集中度（98–99% 收入）、与 Razorpay、PhonePe 和 Cashfree 之间未解决的网关去中介化争议、缺少确认的 IPO
              时间表，以及尚未递交公开上市申请的私营公司固有流动性折价。
