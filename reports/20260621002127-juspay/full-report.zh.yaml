      - number: '7.4'
        title: 执行、治理与披露风险
        blocks:
          - type: paragraph
            body: >
              Juspay 的领导团队由创始人主导：CEO Vimal Kumar 和 COO/Co-founder Sheetal Lalwani 推动战略，第三位 co-founder Ramanathan RV 已在
              2019 年退出。由小团队运营一家 TPV 达 $1T 的独角兽，创始人集中度带来接班和关键人风险。公司在 Bengaluru、San Francisco、Dublin、São Paulo、Singapore 和
              Dubai 拥有 1,500+ 名支付专家，但受监管 fintech 业务的国际扩张需要合规、法律和银行合作方面的高管纵深，且很难一直按扩张节奏补足。

              治理方面，Juspay 是私营公司，网站上有自愿公司披露，但公开领域没有经审计的 IFRS/GAAP 国际财务报表。FY25 经审计财务（收入 ₹514 crore、PAT ₹62 crore）通过
              Registrar of Companies 报告，并由 MediaNama 审阅，但完整利润表、资产负债表和附注无法免费获取。投资人级披露只向 WestBridge、Kedaara、SoftBank 和
              Accel 分享，造成信息不对称，限制第三方对 burn rate、营运资本和或有负债的尽调。2026 年 1 月 $50M Series D、$1.2B
              估值中包含有意义的老股转让部分用于流动性；这虽对投资人友好，却减少了可用于国际扩张这一募资用途的净新增资本。公开披露中未评级关键人与薄板凳风险。
