      - number: '3.4'
        title: 护城河、锁定与替代风险
        blocks:
          - type: paragraph
            body: >
              Juspay 的主要竞争护城河有四层。第一，开源信任：HyperSwitch 的 Apache 2.0 代码库拥有 42,000+ GitHub
              stars，采购团队可以做代码审计，也能形成专有竞争对手难以复制的开发者社区飞轮；截至 2026 年中，该仓库有 4,800+ forks 和 246+ contributors。第二，规模可信度：同一套基于
              Rust 的引擎支撑日交易量 300M 和年化 TPV 超过 $1T，提供企业级背书；没有十年生产规模的初创编排商很难声称这一点。第三，Tartarus 主权卡 vault 让企业完全掌控 tokenized
              卡凭证的数据主权，消除了 Stripe 和 Adyen 专有 vault 使用的锁定机制；商户若把卡 token 存在供应商 vault 里，续约时迁移成本会高到难以承受。第四，印度监管姿态：Juspay 于
              2024 年获得 RBI 支付聚合商授权，为进入印度市场的小型编排商设置了准入门槛。关键替代风险是垂直整合和商品化。垂直整合方面，PhonePe（约占此前网关量的 15%）、Razorpay 和 Cashfree
              在 2024–2025 年退出 Juspay 编排管线，说明大型聚合商更想直接掌握商户关系，而不是向第三方路由层支付编排费。商品化方面，Primer 和 Spreedly 已提供可比的多 PSP
              路由和无代码工作流构建器；如果 HyperSwitch 无法维持开源社区规模和贡献速度，差异化可能被侵蚀。Juspay 对印度 PA 退出叙事的回应是：公司是商户的 TSP，不是支付中介；任何不愿通过编排层合作的
              PA，最终都会把商户输给竞争对手。这使全球 HyperSwitch 企业客户胜出成为主要增长向量，并显著降低来自印度 PA 集成伙伴的收入集中风险。
