      - number: '4.2'
        title: FY22–FY25 财务表现轨迹
        blocks:
          - type: paragraph
            body: >
              Juspay 收入从 FY22 的 ₹112.7 crore 增至 FY25 的 ₹514 crore，复合年增长率约 66%，是印度 B2B 金融科技基础设施公司中较强的持续增长表现之一。亏损在 FY22 和
              FY23 基本持平，均约 ₹105 crore；FY24 随收入越过固定成本基座，亏损收窄至 ₹97.5 crore。FY25 公司转为税后利润 ₹62.28 crore，主要由员工成本下降 22%（从 ₹303
              crore 降至 ₹237 crore）叠加收入增长 61% 驱动，形成强经营杠杆。

              FY25 EBITDA（扣除特殊项目和税前）达到 ₹115 crore，确认是真实经营盈利，而不是递延税会计处理造成的假象；不过 PAT 也受益于 ₹35 crore 递延税特殊项目，使披露 PAT 高于 ₹27
              crore 的税前利润。部分来源报告的总收入（含非经营项目）为 ₹540 crore，而经营收入为 ₹514 crore；₹26 crore 差额看起来是利息和金融工具收益，与 FY24 的 ₹28.3
              crore 非经营收入一致。

              FY25 期间，日交易量几乎从 175M 翻倍至 300M 以上，年化 TPV 从 $400B 激增 150% 至 $1T——这些运营指标与收入增长速度相匹配。管理层指引 FY26 将在投资 AI
              能力、Hyperswitch（开源编排）和全球银行基础设施扩张的同时保持持续盈利。
