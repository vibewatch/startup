      - number: '5.2'
        title: 架构与技术基础设施
        blocks:
          - type: paragraph
            body: >-
              Juspay 的 Hyperswitch 平台用 Rust 构建，这是一门系统级语言，选择它明确是为了性能和内存安全。生产基础设施可处理 2000 TPS，Juspay 声称其支付基础设施可用性达到
              99.999%。Hyperswitch 的模块化设计允许商户只部署所需组件——路由、重试、金库、成本可观测性或对账——而不被供应商锁定。后端容器化，可通过 Helm charts 部署在
              AWS、GCP、Azure 或任何 Kubernetes 兼容平台上。Juspay 也提供完全托管的 SaaS 选项，内置合规能力和企业级
              SLA。智能路由引擎实时评估交易，算法覆盖规则、交易量和机器学习。收入挽回模块可围绕 30+ 参数配置重试逻辑，包括拒付代码、card bin、地区、客单价和支付方式，以尽量降低非自愿流失。成本可观测模块提供
              scheme、interchange 和 acquirer 费用的下钻视图。无状态架构支持在支付峰值负载下水平扩展。银行卡金库符合
              PCI，并支持自带金库（VGS、TokenEx），商户可接入现有金库提供商，而无需重新 tokenization 存量卡。截至 2026 年 6 月，Hyperswitch 仓库自 2022 年 10
              月发布以来已推出 156 个命名版本，并保持活跃提交；最新 push 记录在 2026 年 6 月 20
              日，即本分析前一天。主要架构风险在于，多云、模块化设计需要商户侧投入大量工程资源才能充分利用；缺少专门支付工程团队的小型商户渗透率可能因此受限。
