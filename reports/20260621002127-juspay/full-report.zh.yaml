            title: 网关去中介化是首要估值风险
            body: >
              Razorpay、PhonePe 和 Cashfree 自 2024 年 12 月至 2025 年 1 月起，共同指示商户绕过 JusPay 编排层。JusPay co-founder
              表示没有商户流失，但独立商户报告了集成摩擦，Moneycontrol 调查也发现至少一家主要商户释放未来迁出的信号。由于 POP services 约占收入 50%，这是尾部风险；在熊市情景下，可能压缩当前
              $1.2B 估值 40–60%。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV029
          - type: callout
            title: 以极少新增资本实现盈利，是少见的金融科技资质
            body: >
              JusPay 在生命周期新增资本约 $130M 的基础上，实现首个 GAAP 盈利财年（FY25），展示出全球支付基础设施中少见的资本效率。特殊项目前 PBT 为 ₹115 crore、PAT 为 ₹62
              crore，公司拥有可持续经营模式；相较同等倍数下的亏损型可比公司，这降低了估值风险。
            calloutType: strength
            claimRefs:
              - CV003
