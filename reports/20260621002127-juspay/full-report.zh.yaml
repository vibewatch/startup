      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              多股结构性力量在拉动 Juspay 所在品类的需求。印度方面，UPI 交易量增长极快：NPCI 披露的 UPI 数据显示月交易笔数快速复利，数字钱包和 A2A
              轨道普及也在加速企业对结账平台的需求，因为这些平台必须处理 UPI 的实时确认预期。政府 Digital India 计划和 RBI
              对支付聚合商的积极发牌扩张，说明政策层面仍承诺继续投资数字支付基础设施。全球层面，数字钱包普及对编排供应商构成结构性利好：Juspay 自有 Hyperswitch 博客引用 FIS 和 Worldpay
              数据称，数字钱包已占全球电商交易额的 50% 以上；在时尚、电子和旅行品类的中高客单价商品中，45–55% 有购买意向的消费者预期可使用 BNPL。两种趋势都要求商户维护多支付方式、多 PSP
              的结账配置——这正是 Juspay 编排层为之构建的工作流。开源基础设施也成为独立驱动因素：Hyperswitch 的 GitHub 仓库已积累 43,000+ stars，是 GitHub
              信号下最大的开源支付编排项目。这形成了由开发者带动的采用渠道，结构上不同于传统企业销售。最后，2025 年 RBI Consolidated PA Directions
              收紧了支付聚合商合规要求，提高持牌经营成本和复杂度，反而为 Juspay 这类已持牌、并把合规基础设施纳入技术栈的平台供应商创造需求。Juspay 年化 TPV 同比从 $400B 增长 150% 至
              $1T，说明底层市场增长正在快速落地。
