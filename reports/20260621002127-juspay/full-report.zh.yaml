        title: 留存信号、满意度与证据缺口
        blocks:
          - type: paragraph
            body: >
              JusPay 未公布 Net Revenue Retention（NRR）、Gross Revenue Retention（GRR）或客户流失数据。没有投资人文件、分析师笔记或新闻稿披露 cohort
              级留存统计。间接留存信号仍然存在：交叉比对 2017–2024 年新闻报道后，Amazon India 和 Swiggy 的关系似乎至少持续了五到七年；Flipkart、CRED 和 PhonePe
              多年来反复作为参考客户出现；IndiGo 案例研究描述的是持续产品扩张（不是一次性集成），意味着用量活跃且在增长。GetApp 上 JusPay 的 listing（2026）强调「每日 2 亿笔交易」以及
              PCI DSS、ISO 和 SOC2 合规，说明平台被定位为粘性基础设施层，而不是商品化服务商。结构性粘性论点可信：深度 SDK 集成、多网关路由逻辑、tokenization
              金库和定制结账流程都很难由竞争对手复制并重新集成。不过，如果缺少披露的 NRR 或 cohort 数据，留存耐久性无法独立验证。尽调路径是直接与 IndiGo、Agoda 或 Amazon India
              做客户访谈核验，并要求管理层展示 cohort 数据。
