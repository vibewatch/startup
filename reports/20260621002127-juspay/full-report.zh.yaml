      - number: '1.5'
        title: 监管状态、里程碑与负面背景
        blocks:
          - type: paragraph
            body: >-
              Juspay 持有两项 RBI 支付处理授权：2024 年 2 月获得的境内 Payment Aggregator（PA）牌照，以及 2025 年 11 月获得的 Payment Aggregator –
              Cross-Border（PA-CB）牌照，使其跻身 RBI 2023 年 10 月 PA-CB 框架下获准开展跨境业务的 19 家实体之一。这些牌照显著拓宽了 Juspay
              的合规可服务市场，但也带来了竞争张力。


              2024 年拿到 PA 牌照后，行业迅速反应：2024 年 12 月，PhonePe 要求其商户客户停止使用 Juspay 服务；2025 年 1 月，Razorpay 和 Cashfree
              跟进，切断商户路由连接。主要支付聚合商声称存在利益冲突，认为 Juspay 通过自有 PA 服务导流交易，会让其在编排平台上相对于竞争网关获得不公平优势。Juspay
              联合创始人反驳称，公司收入影响为零，商户路由决策完全由商户控制。分析师指出，这场争议反映了印度金融科技更广泛的竞争整合：一个平台追求全栈化，可能挤压互补型玩家。


              还需要提及一项历史负面事件：2020 年 8 月，未授权行为者利用一枚未回收的 AWS access key 进入 Juspay 服务器，下载了 3,500 万至 1
              亿名客户记录，包括掩码卡号和银行卡指纹，之后这些数据出现在暗网上售卖。外界批评公司并未主动披露，而是在安全研究员公开发现数据后才向公众说明。事件发生后，RBI 与支付行业沟通，要求更强的网络安全标准。Juspay
              此后实施了基于角色的访问控制并强化威胁监测；2024 年 RBI 批准 PA 牌照，也表明监管信心已经恢复。
