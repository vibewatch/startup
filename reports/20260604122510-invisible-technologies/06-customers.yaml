chapter:
  number: 6
  title: Customers
  summary: 'Invisible shows real multi-vertical customer adoption as of 2026-06-04, with named proof from Cohere, Nasdaq, Headway, Boosted.ai, You.com, and Getro plus quantified anonymous deployments in insurance, retail, delivery, and solar workflows. The strongest public signals are production-style ROI outcomes and within-account expansion into adjacent workflows, while the weakest area is durability disclosure: customer count, concentration, contract terms, NRR, and GRR remain private. The result is a constructive adoption read with a still-unresolved retention and concentration underwriting gap.'
sections:
- id: customer-segmentation-and-breadth
  title: Customer Segmentation and Breadth
  body: 'Invisible''s customer evidence is broad enough to conclude that the company is not a single-niche vendor. The retained proof set spans frontier model builders, search and answer products, financial-data and investment workflows, health and insurance operations, retail catalog work, delivery onboarding, jobs-platform operations, solar and home-services workflows, and early public-sector and sports narratives. The buyer and payer look different in each segment: model providers appear to buy evaluation and expert feedback, while enterprise operations leaders buy throughput, accuracy, and cycle-time improvements in specific workflows.


    That breadth matters because it supports two different growth motions at once. First, Invisible can serve technically demanding AI builders such as Cohere and the broader model-provider cohort referenced by WEF and AWS Marketplace. Second, it can sell workflow automation to enterprise operators who care about onboarding, claims, catalog enrichment, or customer-support throughput rather than benchmark scores. The source mix still leaves gaps: no public customer count exists, the top-customer roster is not disclosed, and segment-level revenue contribution is opaque. But the visible evidence is strong enough to say the company has real multi-vertical adoption rather than a narrow concentration in a single use case.'
