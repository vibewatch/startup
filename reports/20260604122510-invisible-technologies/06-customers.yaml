  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof coverage
    missingEvidence: A full customer list, or at least a management-confirmed top-customer roster, is needed to test whether the named proof table is representative or cherry-picked.
    whyItMatters: The chapter can show real adoption, but not whether public references cover most revenue-bearing accounts or only the most marketable successes.
    diligencePath: Request CRM export or top-20 customer roster with current stage, revenue, contract term, and logo-publicity permissions.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, churn, logo-retention, and renewal-rate metrics by segment remain private.
    whyItMatters: Without retention metrics, it is impossible to separate a sticky recurring business from one that must continuously replace project revenue.
    diligencePath: Ask management for cohort retention by segment, top-20 logo retention over 24 months, and renewal schedules for the ten largest accounts.
    relatedQuestionRefs:
    - QU012
  - type: private-evidence-only
    severity: blocking
    topic: customer concentration and count
    missingEvidence: No public source discloses customer count, top-customer revenue share, or revenue concentration by vertical.
    whyItMatters: Concentration can invert the investment view if a small number of AI labs or flagship enterprises drive most revenue.
    diligencePath: Request current customer count, top-10 customer concentration, and revenue mix by vertical and by AI-lab versus enterprise-ops cohorts.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: contract term and procurement timing
    missingEvidence: Contract length, procurement cycle, renewal timing, and implementation-to-contract conversion data are not publicly disclosed.
    whyItMatters: The absence of term and renewal data limits underwriting of sales efficiency, working capital timing, and durability.
    diligencePath: Review sample MSAs/SOWs and board materials showing sales-cycle length, standard term, renewal mechanics, and implementation payback.
    relatedQuestionRefs:
    - QU019
  - type: missing-source
    severity: material
    topic: top AI provider claim corroboration
    missingEvidence: Independent customer confirmations from Microsoft, AWS, or other top model providers are absent; current proof is mostly repeated profile copy.
    whyItMatters: The top-provider cohort claim is strategically important and concentration-sensitive, so second-party or customer-authored corroboration would materially improve confidence.
    diligencePath: Request customer references or public partner/customer announcements from Microsoft, AWS, or similar named model-provider accounts.
    relatedQuestionRefs:
    - QU023
