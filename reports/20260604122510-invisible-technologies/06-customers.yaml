- id: expansion-and-concentration-risk
  title: Expansion and Concentration Risk
  body: 'Invisible''s public customer stories show a credible land-and-expand pattern. The solar account grew from proposal generation into financing-contract support and monitoring, the delivery-platform deployment moved from process redesign into integrated monthly processing, and Getro appears to run on a recurring daily cadence. Those are all positive signs that successful workflows can broaden once Invisible has proven ROI. The public-sector and sports pages indicate management is also trying to turn proof from existing sectors into adjacent-market entry motions.


    The risk side is just as important. The over-80%-of-top-AI-companies narrative is strategically impressive, but it could also mean a small number of outsized AI-lab or hyperscale buyers matter disproportionately to revenue. Meanwhile, the company provides no public customer count, no top-customer concentration data, and no segment-level revenue mix. That makes it impossible to tell whether the public proof set represents a wide base of paying accounts or a marketing layer on top of a few flagship logos. The safest interpretation is that expansion potential is real, but concentration is a live underwritten risk until management provides customer-count, ACV, and top-10 exposure data.'
