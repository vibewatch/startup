- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Adjacent workflow expansion inside accounts
    - May be limited to a few large logos if only marquee accounts expand
    - Supports ACV growth but can mask concentration
    - Request account-level expansion history and ACV bridge
  - - System integration and recurring cadence
    - Embedded deployments raise switching costs but only for the subset that reach integration
    - Could improve retention if scaled broadly
    - Request installed-base segmentation by pilot versus integrated production
  - - Frontier-model-provider positioning
    - A small number of hyperscale AI labs could dominate revenue
    - Large upside if sticky, large downside if one lab churns
    - Request revenue mix by top AI-lab accounts
  - - Public-sector and sports expansion
    - Long procurement cycles and bespoke workflows can delay conversion
    - Strategic optionality but slower cash realization
    - Request pipeline stage, procurement owner, and conversion timing
  - - Anonymous enterprise case studies
    - Anonymous wins are hard to diligence and may overstate breadth
    - Weakens confidence in concentration analysis
    - Request anonymized revenue concentration table and logo permissions
  - - Directory / review breadth
    - Directories can double-count public stories or stale logos
    - Good breadth signal but weak revenue signal
    - Map directory references to active accounts and recency
  - - Hornets marketing narrative
    - Proof quality is weaker than core case studies and could overstate sports traction
    - Reputational downside if cited too aggressively
    - Request official customer reference or deprioritize the claim
  - - No public customer count
    - Impossible to benchmark account concentration or sales efficiency
    - Keeps diligence squarely in research-more territory
    - Request customer count, top-10 concentration, and cohort counts
