      - number: '4.5'
        title: 财务缺口与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              Invisible 公开财务画像最重要的特征，不是收入存在，而是缺少判断收入质量和耐久性所需的指标。公开证据足以得出结论：
              公司有真实规模、真实客户价值，也有足够融资继续投入。但这些证据不足以验证经常性收入质量、毛利率扩张、CAC 效率或集中度风险。 缺失项不是装饰。它们决定 Invisible
              到底是在成为一个软件牵引的企业平台，把劳动力作为赋能层；还是一家高端技术赋能服务公司， 利润率会被结构性封顶。


              反向案例也真实存在。Sacra 明确指出，模型实验室正在转向合成数据生成，这威胁到历史上的 RLHF 和数据标注收入流。
              这让企业工作流自动化转向更加重要，但公开材料没有披露这次结构迁移已经走到哪一步。合并来看，财务结论是：对标题层面的牵引和近期资本化谨慎正面，
              对尽调完整性明确负面。公司有足够需求证据和近期融资，仍处于可投资范围；但严肃投资判断仍需要合同级定价、收入结构桥、毛利率披露、 集中度数据和当前现金 / 烧钱模型，之后信心才可能越过“继续研究”。
