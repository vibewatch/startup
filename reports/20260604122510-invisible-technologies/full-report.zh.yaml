      - number: '7.3'
        title: 合作伙伴、平台与客户依赖风险
        blocks:
          - type: paragraph
            body: >-
              Invisible 的生态杠杆同时也是一层依赖栈。管理层称，公司为全球领先模型提供商中的 80% 以上训练过基础模型，并点名 Cohere、Microsoft 和 AWS；AWS Marketplace
              也确认了一条可见的伙伴上市渠道。这些关系增强可信度，但也意味着公司的增长叙事部分依赖外部生态，而这些生态可以很快改变定价、平台规则或自研 / 采购取向。同样逻辑也适用于 WeCP：收购扩展了专家验证和
              RL-gym 能力，但产品和团队完全整合前，它既是缓释因素，也是执行依赖。


              客户和渠道依赖同样真实，尽管公开集中度数据缺失。最强的公开证据点集中在金融、医疗、保险和公共部门邻近工作流，这些行业价值高，但推进慢，采购和治理预期也更苛刻。Invisible 自己的 Scale-AI
              对比页承认，受监管买方需要比通用标注平台更强的控制、访问管理和决策文档。与此同时，Appen 仍在营销全球贡献者网络，UiPath 则用公开 ARR 和大客户指标来营销受治理的自动化。结果是，Invisible
              的依赖画像要求它同时稳住多个生态：超大规模云厂商、专家供给、收购来的验证资产，以及对可信度高度敏感的企业客户。
