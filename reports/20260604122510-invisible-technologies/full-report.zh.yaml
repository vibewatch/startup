    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与广度
        blocks:
          - type: paragraph
            body: >-
              Invisible 的客户证据足够宽，可以判断公司不是单一小众厂商。保留的证据集覆盖前沿模型厂商、搜索和问答产品、金融数据与投资工作流、
              健康和保险运营、零售目录工作、配送入驻、招聘平台运营、太阳能和居家服务工作流，以及早期公共部门和体育叙事。各细分里的买方和付款方不同：
              模型提供商似乎购买评测和专家反馈，而企业运营负责人购买特定工作流中的吞吐、准确率和周期时间改善。


              这种广度重要，因为它同时支撑两种不同增长动作。第一，Invisible 可以服务 Cohere 以及 WEF 和 AWS Marketplace 提到的更广模型提供商群体等技术要求高的 AI
              构建者。第二，它可以向企业运营者销售工作流自动化；这些人关心入驻、理赔、 目录丰富或客户支持吞吐，而不是基准分数。来源组合仍有缺口：没有公开客户数量，头部客户名单未披露，分细分市场收入贡献不透明。
              但可见证据足以说明，公司有真实的多垂直采用，而不是集中在单一用例。
