  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Invisible 的法律风险敞口，首先来自公司自己公布的控制边界。2026 年 3 月的隐私政策写明，Invisible
              会把业务流程外包给代理人员，会处理客户和代理人员的个人信息，可能使用自动化决策或画像技术，也可能向服务提供商、商业伙伴、API 或
              SDK、关联方和交易对手共享数据。对工作流自动化平台来说，这并不反常；关键在于，Invisible 的产品页和案例研究把公司放进了理赔审批、W9
              处理、保险验证、财务入职和政府现代化项目，而不是低风险沙盒场景。换句话说，公司卖的不是抽象模型工具；它已经贴近真实工作流运营，隐私、公平性和告知义务都在那里变得重要。


              2026 年的外部法律环境让风险更尖锐。欧盟《AI 法案》要求高风险系统配备人工监督、后市场监测和事件报告，其透明度义务也将在 2026 年 8 月生效。Baker Botts
              描述了美国州法层面的同步碎片化局面，覆盖加州、德州、伊利诺伊州和科罗拉多州；多篇法律评论也提示职场 AI 歧视、隐私和监控风险。Alvarez & Marsal 又补上一条相邻执法线索：AI
              包装和披露审查。Invisible 的年度现代奴隶制和供应商风险披露有缓释价值，但也确认了一个分布式劳动力与供应商模式，需要持续尽调，不能盲目信任。
