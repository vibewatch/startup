      - number: '8.4'
        title: 建议、触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，置信度中等、风险高、估值立场偏高。这个判断刻意对价格敏感。公司已有足够公开证据，值得留在尽调清单：真实收入、真实企业成果、可信的 2025
              年融资，以及超越简单标注的产品故事。但同一批证据也显示，尽调支撑缺口仍大。Invisible 没有公开给出 2025/2026 年收入桥、软件 vs
              服务的毛利率组合、集中度和续约数据，也没有披露名义估值背后的优先股堆叠。公开 AI 和自动化可比公司维持着投资者关系页面和文件披露节奏，Invisible 还没跟上，因此近期 IPO
              视角为时过早。实际含义很简单：只有尽调能验证企业工作流增长具备耐久性、利润率扩张真实、2025 年轮次条款干净，这个名字才值得保持跟踪。如果这些检查失败，当前估值标记应被视为脆弱，而不是鼓舞人心。
