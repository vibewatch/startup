  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 改变判断的条件
    rows:
      - - 正方：企业工作流证据真实
        - Headway、Nasdaq、保险客户和 Boosted.ai 都展示了可衡量的运营或成本结果，而不只是愿景式试点
        - 如果客户集中度实际很高，或已计量部署无法续约，论点会削弱
      - - 正方：平台不只是劳动力市场
        - Invisible 描述五个模块层，并支持模型无关部署；官方产品页展示数据、工作流、评估和编排能力
        - 更强结论需要证明软件模块能不依赖专家劳动力推动毛利率扩张
      - - 正方：当前估值不如头部私有 AI 异常值极端
        - 按保留倍数锚点筛选，Invisible 低于 Mercor，也略低于 Scale AI
        - 只有新的收入披露显示实际当前倍数已低于 2024 年历史口径，判断才会改善
      - - 反方：经济性仍像劳动辅助模式
        - Sacra 的 3,000+ 名代理足迹和约 11% EBITDA 估计，说明交付引擎尚未变成纯软件
        - 如果管理层能按产品线证明软件驱动毛利率和经营杠杆，担忧会缓解
      - - 反方：传统 RLHF 和标注需求可能商品化
        - Sacra 警告模型实验室正转向合成数据，这会削弱纯训练数据楔子的价值
        - 如果企业工作流收入已经明确成为主导增长引擎，担忧会缓解
      - - 反方：公开分母陈旧，融资条款清单隐藏
        - 尽管估值台阶很大，公开信息没有披露 ARR、NRR、集中度或优先权栈
        - 当前董事会材料和干净融资文件会最快推动建议变化
