  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销的影响
      - 公开来源为何不足
      - 精确尽调路径
    rows:
      - - 按产品 / 工作流 / 客户类型拆分的收入结构
        - 无法判断收入中有多少是经常性软件、托管服务或项目制工作
        - 官网页面证明有多条变现路径，但不披露各自占比
        - 要求按 AI 训练、评估、专家市场和企业工作流自动化提供季度收入桥表
      - - 客户集中度和垂直行业结构
        - 无法检验增长是否分散，还是依赖少数旗舰账户
        - 案例研究展示客户标识和用例，不展示收入集中度
        - 要求前十大客户集中度、续约时间表，以及按行业 / 地域拆分的收入
      - - 毛利率和 COGS 构成
        - 无法判断 Invisible 应该套用软件式还是服务式估值逻辑
        - 只有 Sacra 提供 EBITDA 估计；公开渠道没有毛利率披露
        - 要求毛利率桥表、人工成本分摊，以及按工作流类型拆分的自动化节省
      - - CAC、回本周期、NRR 和队列留存
        - 无法验证销售效率说法，也无法判断先落地、再扩张增长的耐久度
        - 公开材料强调 ROI 轶事，而不是漏斗或队列数据
        - 要求季度队列、销售与营销支出、转化率，以及按分部拆分的 NRR / GRR
      - - 现金、烧钱速度和现金跑道
        - 无法建模融资依赖或下行韧性
        - 融资标题没有披露当前流动性或现金消耗
        - 要求最新现金报表、月度烧钱速度、现金跑道模型和债务授信
      - - 实际成交价格和折扣结构
        - 无法把工作流 ROI 转换成收入质量或利润率质量判断
        - 留存来源没有公开价目表或合同条款表
        - 审阅现行价格手册、折扣矩阵和已签 SOW 样本
    notes: 这些缺口，就是有说服力的公开叙事与可投资财务档案之间的差距。毛利率、集中度和现金 / 烧钱速度仍是最重要的阻断项。
