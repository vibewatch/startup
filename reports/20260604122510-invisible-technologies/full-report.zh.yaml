      - number: '1.4'
        title: 时间线与未决风险
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，公司形态变化很快，但尽调信号并非全是正面。时间线从 2015 年创立起点和 2020 年疫情期间的扩张故事开始，后者说明在企业 AI 成为热门概念之前，Invisible
              为什么先以运营执行力出名。2024 年，公司既启动公共部门业务，也凭 Deloitte Fast 500 排名获得外部增长认可。2025 年 1 月，公司更换 CEO； 到 2025 年 9
              月，公司完成大额增长轮、扩大已披露董事会成员，并开始把自己定义为企业 AI 基础设施，而不只是 AI 训练运营。2026 年 3 月收购 WeCP
              进一步强化这条轨迹，因为该交易补上了与高精度验证工作流直接相关的专家评测工具和面试数据。

              最清晰的公开反向事项是 2023 年 11 月在加州提起的集体诉讼，指控公司存在加班、休息、工资单、费用报销和带薪病假违规。
              诉讼本身不能证明责任成立，但意味着劳动力实践尽调不能只依赖公司叙事。风险还被放大：本轮核查中 Indeed 评论页和 BBB 投诉页都被验证墙拦住，Crunchbase/PitchBook
              也没有提供可用的结构化数据。因此，与融资标题、收入或领导层事实相比， 当前员工情绪、确切员工数和细粒度融资条款的验证程度更低。
