      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              围绕 2024-2025 年交接，领导层证据最扎实。Ben Plummer 在 2024 年 1 月公共部门业务发布和 2024 年 11 月 Deloitte 公告中仍以 CEO 身份被引用，但
              2025-01-21 Invisible 宣布 Matthew Fitzpatrick 出任 CEO。Fitzpatrick 此前负责 McKinsey 的 QuantumBlack
              Labs，说明公司想要一位能把模型厂商经验转化为企业部署的运营者。 Francis Pedraza 仍是记录中贯穿始终的基础治理人物：Sacra 认定他是创始人，现代奴役声明显示他以创始人、总裁兼董事长身份签署，
              2025 年融资公告也列其为董事长。

              公开治理披露仍不完整，但 2025 年 9 月融资材料列出了具体董事会阵容——Pedraza、Charlie Songhurst、Doug Clinton、John Lee、Robyn Scott，以及新加入的
              Vanara 合伙人 Hayden Lekacz。Wes Green 被任命为首位全球公共部门 SVP 也值得注意，因为这是最清晰的岗位级信号之一，表明 Invisible 将政府业务视为持久扩张方向。
              因此，主要关键人依赖是：Pedraza 支撑创始人叙事和治理连续性，Fitzpatrick 负责企业软件再定位。
