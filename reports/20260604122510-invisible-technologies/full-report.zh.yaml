  - id: TV005
    title: 投资逻辑破裂触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 前瞻收入桥接不及预期
        - 2025 年实际值或 2026 年收入运行率，相比公开的 2024 年 $134M 基数没有明显台阶
        - 估值会不再像高溢价数据智能标记，而更像过时的后期轮价格
        - 将情景重置到悲观价值区间，不再把最新轮作为可辩护锚点
      - - 毛利率组合仍偏劳动力密集
        - 管理层无法证明软件带动毛利率扩张，或贡献毛利随规模改善
        - 这家公司仍主要是劳动力辅助服务模式的反向逻辑会占上风
        - 将倍数框架下调到上市软件或科技赋能服务区间
      - - 企业转型跑不赢 RLHF 商品化
        - 模型开发方工作仍是主引擎，而合成数据替代侵蚀定价权
        - 支撑乐观情景的核心战略转向就没有得到证明
        - 把公司视为结构性暴露于传统数据标注压缩压力
      - - 治理或供应商控制缺口浮现
        - 尽调发现 AI 治理、供应商监督或文档相对企业买家预期偏弱
        - 公司会失去高溢价企业定位最强的论据之一
        - 暂停承销，直到控制措施被修复并验证
      - - 退出路径仍不透明
        - 管理层无法展示可信的战略出售、财务赞助方或最终上市准备路径，并配有可衡量里程碑
        - 即使业务站得住，以当前价格仍可能交出差回报
        - 将项目保留在继续研究状态，而不是推进到可提交 IC 的承销判断
    notes: 这些触发因素聚焦会快速改变价格纪律的可衡量阈值。设计目的不是用通用风险装饰备忘录，而是阻止自我合理化。
