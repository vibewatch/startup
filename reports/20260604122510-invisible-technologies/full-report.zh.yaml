      - number: '1.3'
        title: 资本、规模与商业验证
        blocks:
          - type: paragraph
            body: >-
              资本和商业验证指向同一结论：Invisible 似乎已经从小众 AI 运营厂商，跨入资本更充足的企业 AI 基础设施玩家。 官方和独立来源一致显示，公司在 2025 年 9 月融资 $100M，使累计融资达到
              $144M，并引入新老投资者组合。 最可信的外部估值读数来自 SiliconANGLE 和 Sacra 的“超过 $2B”，而 2025 年 1 月 CEO 公告锚定的上一台阶， 是 2024 年初
              $500M。运营动能看起来真实，不只是叙事驱动。CEO 交接帖称收入从 2023 年到 2024 年翻倍以上，达到 $134M；后续融资材料重复了同一数字，并称 2020 年至 2023 年增长
              24x。Sacra 还认为公司在这一规模下已经盈利，估计 EBITDA 约 $15M。

              商业验证对一家私人公司来说也异常具体：官方案例研究声称 Headway 理赔处理提速 8x、某配送平台入驻提速 233%、Nasdaq 节省 10,000 开发者工时；WEF、AWS marketplace 和
              FeaturedCustomers 都重复了 Invisible 曾服务 80% 以上领先 AI 模型提供商的说法，其中包括 AWS、Microsoft 和 Cohere。不过，确切客户数量仍未披露。
