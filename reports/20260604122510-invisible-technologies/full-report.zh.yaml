  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、替代品和竞争外溢
        blocks:
          - type: paragraph
            body: >-
              评估 Invisible Technologies 时，应把它看作 invisibletech.ai 这一企业 AI 工作流和训练公司，而不是狭义数据标注单点产品。 证据显示其竞争集确实很宽。Sacra 将
              Scale AI 和 Surge AI 放在直接 AI 训练赛道，同时也点名 Appen 这样的标注专家和 TaskUs、Teleperformance 这样的 BPO 替代者。Invisible
              自己的对比指南进一步拉宽框架， 把市场拆成工具优先平台、托管标注服务、开源栈和端到端合作伙伴。CB Insights 又加入一层外溢，把 Mimica、SuperAnnotate 和 Hypatos
              列为替代方案，意味着买方可以用流程智能、标注或文档自动化产品解决同一问题的相邻部分。实际结论是， Invisible
              不是只要打败一个显而易见的对手就能赢。它必须证明：为什么买方应该选择全栈运营模式，而不是更便宜的工具、 规模化服务商或自建路径。
