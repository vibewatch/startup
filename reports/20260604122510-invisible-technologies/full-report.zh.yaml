  summary: >-
    Invisible Technologies 是一家私有企业 AI 公司，总部位于旧金山，创立于 2015 年，目前由 CEO Matthew Fitzpatrick 领导；他此前负责 McKinsey 的 QuantumBlack
    Labs。公司已从技术赋能的外包运营， 演进为模块化 AI 软件平台，覆盖数据基础设施、工作流映射、专家市场、评测和智能体编排。公开证据支持其规模真实——2024 年收入 $134 million、2025 年 9 月 $100
