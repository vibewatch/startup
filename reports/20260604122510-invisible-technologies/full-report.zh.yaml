  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 真实运营证据、人工辅助经济模型、披露缺口和估值倍数纪律如何合力导向继续研究结论。
    data:
      nodes:
        - id: proof
          label: 证据：$134M 收入、2025 年融资、可量化客户 ROI
          type: input
        - id: platform
          label: 平台宽度：模块化软件加专家工作流
          type: input
        - id: economics
          label: 约束：人工辅助经济模型和有限公开 KPI
          type: input
        - id: market
          label: 市场框架：应用 AI 倍数向软件基准回归
          type: input
        - id: valuation
          label: 当前估值标记：>$2B 估值下为 >14.9x 历史收入
          type: process
        - id: recommendation
          label: 建议：继续研究，中等置信度，高风险
          type: output
        - id: upgrade
          label: 只有尽调证明更强前瞻增长、利润率组合和干净条款，才上调评级
          type: output
      edges:
        - from: proof
          to: valuation
        - from: platform
          to: valuation
        - from: economics
          to: valuation
        - from: market
          to: valuation
        - from: valuation
          to: recommendation
        - from: recommendation
          to: upgrade
    approximationNotes: 这是决策逻辑，不是确定性模型。它显示在当前价格下，哪些证据会推动建议变化。
    claimRefs:
      - CV004
      - CV010
      - CV037
      - CV041
      - CV044
      - CV045
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 基于公开的 2024 年收入 $134 million 锚点，计算不同收入倍数下的企业价值。
    data:
      items:
        - label: 6x 收入
          value: 804
          note: Aventis 给出的公开 SaaS 基准
        - label: 10x 收入
          value: 1340
          note: 应用 AI / 类软件结果的高端情景
        - label: 14.9x 收入
          value: 1997
          note: 以 >$2.0B 估值和 $134M 收入计算的 Invisible 当前下限
        - label: 16.7x 收入
          value: 2238
          note: 类似 Scale 的私有数据引擎基准
        - label: 24.2x 收入
          value: 3243
          note: Aventis 大额 AI 交易倍数中位数
        - label: 30x 收入
          value: 4020
          note: Aventis 融资区间上端
    approximationNotes: 本图刻意把收入保持在最近公开的 2024 年基数不变，让读者看清争议有多少来自分母风险，又有多少来自倍数选择。
    claimRefs:
      - CV008
      - CV010
      - CV029
      - CV030
      - CV033
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以最后公开的收入基数为锚，按明确的收入和倍数假设，拼出悲观、基准、乐观三种估值区间。
    data:
      items:
        - label: 悲观情景
          low: 900
          mid: 1215
          high: 1530
          note: $150M-$170M 收入，对应 6x-9x
        - label: 基准情景
          low: 1800
          mid: 2350
          high: 2940
          note: $180M-$210M 收入，对应 10x-14x
        - label: 乐观情景
          low: 3080
          mid: 3880
          high: 4680
          note: $220M-$260M 收入，对应 14x-18x
    approximationNotes: 区间受证据约束，但假设成分仍然很重；公开来源没有披露 2025 或 2026 年实际收入、产品组合或融资条款。
    claimRefs:
      - CV010
      - CV030
      - CV041
      - CV045
      - CV046
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以投委会视角给 Invisible 当前的市场位置、验证强度、经济性、治理就绪度和估值纪律打分。
    data:
      items:
        - label: 客户验证
          value: 4.5
          note: 案例研究显示，多个企业工作流已经跑出实际运营结果
        - label: 平台广度
          value: 4
          note: 模块化软件叠加专家工作流层，把切入点做宽
        - label: 市场贴合度
          value: 4
          note: 受治理约束的企业 AI 落地仍是真实预算重点
        - label: 护城河耐久性
          value: 3
          note: 合成数据风险和竞争压力，让护城河信心只能维持在中等水平
        - label: 经济性可见度
          value: 1.5
          note: 没有公开的毛利率、留存或客户集中度数据
        - label: 退出就绪度
          value: 2
          note: 战略出售或私有市场退出，比近期具备上市条件更可能
        - label: 估值纪律
          value: 2
          note: 当前价格已经吃进大量乐观预期，但下行细节还不够
    approximationNotes: 分数只是方向性判断工具，不是机械模型；较低分值主要反映证据缺口和价格风险，并不否认业务质量。
    claimRefs:
      - CV015
      - CV029
      - CV031
      - CV035
      - CV036
      - CV037
      - CV043
      - CV047
