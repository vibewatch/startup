      - number: '7.4'
        title: 团队与执行风险
        blocks:
          - type: paragraph
            body: >-
              Invisible 正在同时推进数个艰难转型。短时间内，公司更换 CEO、工程团队翻倍、办公室扩展到 New York、San Francisco、Washington, D.C. 和
              London，启动专门的公共部门打法，还增加了一项必须整合进核心平台的收购。这些动作本身都不负面。事实上，Fitzpatrick 的企业 AI 背景是文件里更清晰的缓释因素之一。风险来自并发推进。一家 350
              人公司叠加分布式代理人员模式，需要扩大的不仅是人才招聘，还有管理系统；当工作流横跨受监管行业和政府买方时，控制负担还会进一步上升。


              公开记录显示 Invisible 明白严谨性的必要，但还没证明稳定的运营节奏。支撑乐观判断的同一批来源，也暗示了执行拉伸：资本正在投向软件模块和领导层扩张，现代奴隶制监督依赖年度审查和供应商入职，WeCP
              整合还需要产品、文化和销售落地对齐。公共部门扩张再次抬高门槛，因为安全审查和采购周期比私人试点更不容错。这不是危机画像，但公司仍需要把快速组织变化转化为可重复的控制证据。
