      - number: '2.2'
        title: 规模测算视角与证据约束下的市场估计
        blocks:
          - type: paragraph
            body: >-
              针对 Invisible 精准细分市场的公开市场规模数据很少，因此本章不用单一 TAM 标题，而是采用多重视角。最干净的公开下限是受治理自动化支出： UiPath 一家公司就在 2026 年报告了 $1.901
              billion ARR，说明大型企业已经为编排后的人加软件工作流投入大规模预算。 第二个视角来自 AI 数据和评测基础设施：Appen 报告 50M+ 平台小时、20K+ AI 项目和 100M LLM
              数据元素，而 Invisible 称其服务超过全球顶尖 AI 公司 80%，并指向前沿实验室评测和 RL 环境需求。第三个视角是工作流层面的
              ROI：金融、医疗和保险案例显示的节省或提速足以支撑经常性预算。合在一起，这些信号支持一个更窄的 2026 年 SAM 估计，大约 $2.0 billion 到 $6.0 billion；基准情景为 $3.8
              billion，覆盖专家人在回路的企业 AI 运营、评测和 RL 环境工作。相对广义生成式 AI 叙事，这一区间刻意保守，因为 Invisible 的产品交付密集、集成重， 并受专家供给约束。
