        - 公司是真实业务，但估值倍数压缩风险、劳动密集度、治理审查和条款缺失叠在一起，容错空间很小
      - - 估值立场
        - 按公开证据看偏高
        - '>14.9x 的历史收入倍数只有在当前收入、利润率组合和企业客户韧性较上一个公开收入锚点大幅改善后才站得住'
      - - 回报 / 持有视角
        - 按当前估值，在公开假设下，基准情形总 MOIC 在 3-5 年持有期内约为 0.9x-1.4x
        - 除非私有尽调证明前瞻经济性强得多，否则低于晚期风险投资式入场通常目标
