      - number: '2.3'
        title: 买方、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              Invisible 的买方图谱异常跨职能。训练、评测和 RL 环境项目通常由 CTO、首席 AI 官、模型或产品负责人发起， 他们关心基准缺口、领域质量和部署准备度。工作流自动化项目则通常由
              COO、共享服务、理赔、入驻、支持或合规负责人证明合理性， 这些人负责吞吐、错误率和劳动力成本 KPI。从 Invisible 材料和案例研究里浮现的采用路径，不是“先买模型，再扩规模”。
              它从一个高摩擦工作流开始，进入与遗留系统的严格限定集成，用历史数据验证，之后才扩展到受监控的生产环境。这也是为什么工具优先平台和通用外包商在简单项目中仍是可行替代品；
              但更高价值的机会在于，买方需要一个能把领域专业能力、工作流设计和可量化运营指标结合起来的供应商。横跨资产管理、医疗、保险、金融入驻、 多语言模型评测和 RAG
              调优的客户证据表明，公司近期最可信市场是受监管、数据密集的企业 AI 切片，而不是广义 SMB 自助需求。
