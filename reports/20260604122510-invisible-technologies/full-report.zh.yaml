      - number: '7.5'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Invisible 的财务风险画像好于多数私有 AI 基础设施故事的中位数，但支撑它的证据还不完整。公司有真实收入规模、意义明确的 2025
              年增长轮，以及第三方盈利信号。这降低了即时融资压力。更难的问题是商业模式耐久性。Sacra 分析称，实验室越来越转向合成数据生成，并明确把 Invisible
              的回应描述为转向企业部署。公开案例研究支持这个转向，但没有告诉投资者，如今收入有多少来自软件模块、有多少来自劳动力支撑的服务，客户群集中度多高，或不同交付模式下毛利率如何。


              这种不确定性重要，因为 Invisible 现在已经按规模化 AI 平台故事定价。SiliconANGLE 报道其估值超过 $2 billion，而 UiPath 等公开自动化可比公司会披露
              ARR、大客户数量和留存背景，Invisible 没有。风险不在于 Invisible
              缺需求；公开证据恰恰相反。风险在于，如果企业端结构迁移放慢，或劳动力强度在经济上比投资者预期更久地占主导，那么偏高估值、不完整披露和潜在合成数据替代压力会一起放大。
