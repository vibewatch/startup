      - number: '6.4'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Invisible 的公开客户故事展示了可信的先落地再扩张模式。太阳能账户从方案生成扩展到融资合同支持和监控； 配送平台部署从流程重设计推进到集成后的月度处理；Getro
              似乎按每日节奏经常性运行。这些都说明，一旦 Invisible 证明 ROI，成功工作流可以拓宽。公共部门和体育页面显示，管理层也在尝试把既有行业证据转化为相邻市场进入动作。


              风险面同样重要。服务 80% 以上顶尖 AI 公司这一叙事具有战略吸引力，但也可能意味着少数超大 AI 实验室或超大规模买方对收入影响过大。
              同时，公司没有公开客户数量、头部客户集中度数据或细分市场收入结构。由此无法判断公开证据集代表的是广泛付费账户基础，
              还是几个旗舰客户标识之上的营销层。最安全的解释是，扩张潜力真实存在；但在管理层提供客户数量、ACV 和 top-10 敞口数据之前， 集中度仍是活跃的投资判断风险。
