      - number: '6.2'
        title: 具名证据与采用质量
        blocks:
          - type: paragraph
            body: >-
              最强的客户证据集中在少数具名案例研究，它们超越客户标识，提供了部署特定结果。Nasdaq、Headway、Cohere、Boosted.ai、 You.com 和 Getro
              都具名出现。其中，Nasdaq、Headway、You.com 和 Boosted.ai 给出了最清晰的量化前后对比结果； Getro 则给出了最清晰的持续服务节奏和引用式满意度代理。Cohere
              的证据更多关于评测质量，而非经济影响，但仍然重要， 因为它把 Invisible 放进了高要求的企业 AI 工作流，而不是通用标注任务。


              不过，证据质量并不均匀。一些最好的数值结果来自保险、零售、配送和太阳能领域的匿名企业案例，意味着运营收益可见，
              但客户身份不可见。第三方目录改善了广度，却大多只是聚合或概述公司叙事，而不是独立证明续约或支出。Hornets 案例最清楚地显示， 一个高知名度客户标识带来的叙事热度高于证据深度：反向文章表明，这一主张是通过
              Invisible 托管的营销语言传播， 而不是官方球队发布。合并来看，本章支持真实采用，但信心水平仍应按证据质量分层，而不是把每个可见客户标识都视为同等。
