  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >-
              Invisible 的公开材料支持的是混合收入模式，而不是干净的 SaaS 或纯服务原型。官方页面营销一个端到端平台，组合数据基础设施、 工作流设计、评测工具和人类专家；Sacra
              则把商业包装描述为围绕明确工作流和结果销售的运营即服务（operations-as-a-service）。
              这种组合对投资判断很重要：平台软件可以随着时间提高交付杠杆，但目前证据仍指向一门业务，其变现绑定具体客户流程、标注量或月度保留费， 而不是公开席位价格。


              因此，最有证据支撑的收入流拆分，是（1）面向模型厂商的 AI 训练、RLHF、评测和专家验证工作；（2）面向希望把 AI
              嵌入遗留流程的大型组织的企业工作流自动化和定制解决方案。官方案例研究覆盖金融研究、医疗理赔、保险运营、零售招聘和企业数据入驻，
              说明公司同时在变现模型改进工作和业务流程转型。缺失的仍是最重要的投资判断层：公开材料没有披露有多少收入来自经常性平台订阅， 多少来自劳动支撑的项目或托管服务；也没有展示客户集中度或续约条款。
