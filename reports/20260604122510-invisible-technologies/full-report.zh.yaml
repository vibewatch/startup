  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies 应放在企业 AI 运营、AI 训练和评测、工作流自动化预算里比较——而不是与 invisible.ai 服务的工厂车间视觉市场，或完整生成式 AI
              基础设施栈比较。公司自有材料始终把产品定义为围绕数据、智能体、人在回路和评测系统的模块化部署， 并绑定真实运营结果；RL
              环境产品也明确围绕会计、银行、法律、合规等企业任务组织。因此，最接近的替代品是一组混合对手： Appen、Labelbox 这类标注优先厂商，UiPath 这样的编排软件，以及 TaskUs
              这类外包数字服务提供商。 这也意味着，通用服务器支出、超大规模云厂商资本开支和无关计算机视觉部署，都应排除在市场边界之外。关键分析结论是： Invisible
              争夺的是工作流预算，在这些场景里，正确性、可审计性和人工升级比直接模型访问或商品化标注吞吐更重要。
