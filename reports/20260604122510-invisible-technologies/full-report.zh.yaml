      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比公司组
        blocks:
          - type: paragraph
            body: >-
              核心乐观逻辑有证据支撑。Invisible 有真实产品宽度，不只是劳动力市场：材料描述了面向数据基础设施、工作流映射、专家工作、评估和编排的模块化软件层，客户案例也显示，在医疗、保险、金融数据入职和 AI
              模型改进中产生了可衡量部署 ROI。WEF 画像和官方发布也支持这样一家企业：已经盈利、广泛部署，并越来越围绕企业工作流所有权展开，而不是只守着狭窄的 RLHF 切口。反向逻辑同样真实。Sacra
              对收入和利润率的框定，仍然更像技术赋能服务，而不是纯软件；同一来源还警告，合成数据采用会挤压传统标注和 RLHF 需求。行业基准让这种张力更尖锐。应用 AI 和数据智能业务仍可获得溢价定价，但 Finro 和
              Aventis 都认为，后期投资者越来越会把前沿模型基础设施，与运营强度更高的应用模型区分开。这意味着，Invisible 需要企业耐久性和软件式利润率扩张，才能继续捍卫远高于公开软件常态的倍数。
