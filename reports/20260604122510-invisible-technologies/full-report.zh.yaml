        - 标注、QA、安全部署、边缘 / 本地部署选项，以及持续再训练闭环
        - 结构化事件流、更好的漂移管理和客户数据控制，是卖点的核心
        - 公开证据最强的是叙事文档，而不是可访问技术规格
