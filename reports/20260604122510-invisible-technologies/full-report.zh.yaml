      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Invisible 已披露资本状况方向上有支撑，但对投资判断仍不完整。公司 2025 年 9 月宣布 $100 million 增长轮， 使已披露累计融资达到 $144
              million。管理层称，募集资金将投向核心 AI 软件平台和同一新闻稿中描述的领导层扩张。 再结合创始人称公司多年来以盈利方式建设，这降低了即时流动性危机的概率。


              话虽如此，公开记录没有给出投资者真正需要用来衡量融资依赖的指标。没有披露账面现金、烧钱速度、月度或季度现金流， 也没有现金跑道指引。保留的公开来源中没有看到债务或项目融资负担，这比发现风险债或契约条款风险要好，
              但“未披露”不等于尽调项已关闭。下一轮融资触发条件同样未披露。实际结论是，标题层面的资本充足性看起来可以接受， 因为公司已有融资且显然没有陷入困境；但如果还有下一次融资窗口，没有管理账就无法建模。
