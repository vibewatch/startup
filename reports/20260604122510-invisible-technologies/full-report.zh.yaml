chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies 现在把自己定位为企业 AI 软件平台，但本次核查记录显示，它更像混合模式，而不是纯 SaaS 厂商。官网首页、关于页面、how-we-work
              页面和隐私政策都描述了同一个系统：整理混乱的企业数据，部署智能体工作流， 并在单靠软件不够时加入领域专家或智能体。运营上，Invisible 称前线部署工程师会把客户系统接入其模型无关平台，
              同时客户数据留在客户环境中。这套架构与其 AI 训练材料相吻合：材料强调多语言评测、强化学习环境、红队测试和专家动员， 而不是打包销售的单点软件。

              独立来源也支持这一点：公司 2015 年起步时是虚拟助理 / 外包服务，之后沿价值链上移到 RLHF、AI 训练和企业 AI
              基础设施。这段演进很重要，因为它同时解释了公司为什么能赢得模型厂商信任，也解释了它为什么仍依赖分布式人力。 它还说明 invisible.ai
              是一个实质性的研究陷阱：该域名属于另一家制造业计算机视觉公司，不是本章的目标公司。
