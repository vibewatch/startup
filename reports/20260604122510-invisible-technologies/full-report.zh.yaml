      - number: '5.4'
        title: 差异化、专家网络与信任 / 合规控制
        blocks:
          - type: paragraph
            body: >-
              Invisible 最清晰的差异化，是把专家劳动力、工作流设计和评测基础设施绑进同一个交付模式。公司自己的 AI 训练和 RL
              环境材料反复主张，领域专家、高质量人类轨迹和对抗性验证，比通用基准分数更重要。WeCP 收购通过把技术测评库和面试记录直接加入 Meridial 层，强化了这一投资逻辑。这让 Invisible
              对单点解决方案厂商拥有一个可信切入口：它不是只卖模型端点， 也不是只卖工作流工具，而是把数据塑形、流程逻辑、专家验证和持续测量打包成企业 AI 采用的一个操作系统。


              信任和治理故事则更混合。正面看，Invisible 称客户数据留在客户系统，发布了宽泛隐私政策，并链接到信任门户。隐私政策还罕见地具体披露了
              代理人员监控、录制、客户访问工作信息和用户隐私权。负面看，本轮保留的信任中心抓取结果没有暴露详细控制映射或可访问认证证据，
              准备好的证据集中也没有公开正常运行时间或事件披露入口。这很重要，因为外部法律和安全来源显示，围绕隐私、透明度、同意、训练数据披露和风险管理的环境正在变严。 相较 Appen 和 Cohere
              的公开可比披露，Invisible 可访问的信任文档比其产品叙事更薄。
