  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Uses retained direct private comps, sector benchmarks, and model-appropriate public disclosure references.
        Direct like-for-like public comps for enterprise AI workflow operators remain limited in the reviewed free
        source set.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 可比意义
      - 局限
    rows:
      - - Invisible 当前估值标记
        - 2024 年收入 $134M；2025 年估值 >$2B
        - 隐含 >14.9x 往绩收入
        - 本次承销判断的直接对象
        - 使用过时的公开分母，优先股堆叠未知
      - - Scale AI
        - Sacra 称 ARR 约 $1.5B，估值 $25B
        - ~16.7x 收入
        - 最接近的存续私有参照，代表高溢价 AI 数据 / 对齐业务
        - 比 Invisible 更暴露于前沿实验室，稀缺性叙事也更强
      - - Mercor
        - Sacra 称收入运行率约 $50M，估值 $2B
        - ~40x 收入
        - 说明市场可以把具备软件型增长和人才网络杠杆的 AI 平台定到多高
        - 运营模型轻得多、规模也更早期，只能作为上限，不是真正同业
      - - 大型交易 AI 中位数
        - Aventis 大型 AI 融资与 M&A 样本
        - 24.2x 收入倍数中位数
        - 可作为后期 AI 融资的上限市场基准
        - 样本偏向更大的赢家和融资估值，不适合直接当作现实新钱入场纪律
      - - 应用 AI / 上市软件基准
        - Aventis + Finro 对 2025 年末基准的看法
        - AI 融资约 25x-30x，但上市 SaaS 约 6x，应用型细分会向软件倍数回归
        - 用来校验 Invisible 在变得难以自圆其说前还能拉伸多远
        - 行业基准，不是直接公司可比
      - - UiPath / Appen 披露基准
        - UiPath 披露 ARR $1.901B、DBNRR 109%；Appen 披露 1M+ 贡献者、10B 单元处理量
        - 上市公司或规模化披露可比对象，KPI 维度比 Invisible 更丰富
        - 有助于判断退出准备度，以及成熟买家已经能拿什么来比
        - 所用来源没有在同一时点给出两家公司干净的 EV/revenue 标记
    notes: 这组可比混合了直接私有参照和适配模型的基准，因为企业 AI 工作流运营商很少披露足够公开数据，无法拼出干净的同口径表格。
