      - number: '8.3'
        title: 情景区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              由于最后一个干净的公开收入锚点是 2024 年，情景测算必须明确哪些是已观察事实、哪些是假设。已观察锚点很直接：2024 年收入 $134 million；按最新一轮计算，隐含历史收入倍数超过
              14.9x；Sacra 给出 11% EBITDA 估计；运营足迹偏劳动力密集；市场证据显示，应用 AI
              现在的定价更接近软件基准，而不是前沿模型的极端水平。这些事实指向当前入场价下不对称的回报测算。悲观情景里，增长停滞、市场倍数压缩到 6x-9x 收入，最新估值会有明确下行。基准情景里，Invisible
              继续切入企业工作流并维持十倍出头的倍数，大致能守住名义估值，但很难明显产生风投式回报。只有乐观情景——2025/2026
              年收入显著跑赢滞后的公开基数，且软件驱动利润率改善——才会创造清晰且有吸引力的上行。换句话说，当前价格也许扛得住，但不宽容。
