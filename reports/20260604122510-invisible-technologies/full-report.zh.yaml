    rows:
      - - 当前财务桥接
        - 董事会批准的 2025 年实际值、2026 年收入运行率，以及从公开 2024 年基数出发的增长桥接
        - 没有当前分母，最新估值就无法换算成真实入场倍数或回报情景
        - CEO、CFO 和月度董事会材料
      - - 利润率架构
        - 按软件模块、专家工作和托管服务交付拆分的毛利率瀑布
        - 核心估值争论是 Invisible 是否在变成软件主导，还是结构上仍靠劳动力辅助
        - FP&A、产品财务和分部盈利能力拆分
      - - 需求质量
        - Top-10 客户集中度、续约、NRR 或队列留存，以及 AI 实验室与企业工作流的组合
        - 如果增长更多元、粘性更强，而不是依赖波动的标注项目或少数大客户，它的价值更高
        - 收入运营和客户成功分析
      - - 股权结构表和下行保护
        - 股权类别、清算优先权、参与权、认股权证，以及 2025 年融资中的任何附函
        - 如果普通股经济性明显差于投后估值暗示，光看名义估值不够
        - 主办律师和财务运营
      - - 治理就绪度
        - AI 治理框架、供应商监督控制，以及面向受监管企业买家的文档
        - 治理越来越像销售护城河的一部分，也是拿到可信高溢价倍数的前提
        - 首席法务官、合规负责人和审计材料包
      - - 退出地图
        - 战略买家地图、财务赞助方兴趣，以及任何最终上市公司就绪的里程碑
        - 入场价偏高仍可能跑通，前提是退出可选性真实且有时间边界
        - CEO、董事会材料和投行参考
    notes: 每项请求都直接绑定会改变建议的变量。没有一项是装饰性要求；这些是最可能改变价格纪律或击穿投资逻辑的缺失文件。
    claimRefs:
      - CV035
      - CV037
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
