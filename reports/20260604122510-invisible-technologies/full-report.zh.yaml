  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies 应被理解为工作流 AI 运营商，而不是狭义标注厂商或通用模型封装器。公司各解决方案页面描述的是一个模块化栈：
              摄取非结构化企业数据，映射业务逻辑，部署智能体，在置信度低时插入人工复核，并围绕运营 KPI 持续评测输出。 公开产品覆盖后台自动化、联络中心质量和路由、预测、计算机视觉、AI
              训练和强化学习环境。这个宽度重要，因为它显示 Invisible 围绕具体客户任务打包可复用工作流模块，而不只是出售定制咨询工时。


              最清晰的模块地图来自 2025 年融资材料和 2026 年 WeCP 收购公告。这些来源描述的核心平台围绕数据基础设施、流程映射、 专家市场或 Meridial
              能力、评测和编排组织。实践中，解决方案页面可以整齐映射回这些层：后台自动化强调摄取、路由、
