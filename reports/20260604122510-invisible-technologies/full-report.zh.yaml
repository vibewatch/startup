        title: 留存与满意度代理指标
        blocks:
          - type: paragraph
            body: >-
              公开留存数据是 Invisible 客户档案中最弱的一部分。没有可见的 NRR、GRR、流失率、续约率、合同期限或队列披露，
              因此本章无法直接验证客户耐久性。这一缺失不是装饰；它是客户章节止步于高信心耐久性结论的主要原因。如果 Invisible
              的收入基底由项目工作主导，或由少数超大型模型实验室客户主导，经济性可能明显弱于案例研究叙事。


              不过，来源集也给出了一些次优耐久性代理。Getro 描述了每日协作、100% QC 记录和双周客户经理电话。配送平台案例称， Invisible 在 90 天内完全接入客户内部系统，之后每月处理 1.5
              million 个唯一数据点。太阳能供应商案例称， 客户在初始工作流之外要求下游支持，这是典型先落地再扩张信号。这些都是账户深度和运营粘性的有意义指标，
              但不能替代队列指标。因此，正确尽调姿态是把耐久性视为可信但文档不足，仍需要正式留存、合同期限和集中度数据。
