      - number: '4.3'
        title: 单位经济代理指标与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开印证最强的收入信号是 2024 年收入达到 $134 million，Sacra 另行估计在这一基数上 EBITDA 为 $15 million。如果这些数字方向正确，Invisible 已经摆脱了重度烧钱
              AI 服务初创公司最早期的画像。核心未决问题不是有没有收入， 而是利润率路径会向软件式经济性收敛，还是继续受劳动密集度限制。


              公开证据两边都有。正面看，公司营销自研软件、连续评测工具和工作流自动化，这些都应随着时间提高吞吐并改善毛利率。限制面是， Sacra 描述的交付引擎覆盖 35+ 个国家的 3,000+ 名代理人员，加上 350
              人内部团队，意味着可变人工成分不小。 案例研究也强调速度和劳动力节省，而不是软件席位扩张，再次指向定制交付模式。用已披露的 2025 年 350 人团队规模计算， 最好的公开运营生产率代理指标是 2024
              年每名当前团队成员约 $383k 收入，但这只是粗略方向性指标。UiPath 和 Appen 等公开可比公司披露的 ARR、留存和吞吐信息要详细得多，凸显 Invisible 的单位经济研究仍有大量内容在私域。
