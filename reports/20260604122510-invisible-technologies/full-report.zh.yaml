      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              对 Invisible 来说，三项结构性驱动最重要。第一，企业和前沿实验室正从预训练转向定制评测、后训练和智能体工作流， 推高对专家数据、评分员和 RL
              环境的需求。第二，真实买方价值越来越多产生在混乱的运营系统内部，而不是孤立演示里， 这有利于能把部署工程和人在回路结合的厂商。第三，监管正在把治理变成商业门槛：EU AI Act 抬高了对日志、文档、
              人类监督和透明度的预期；美国州级规则也继续围绕就业、训练数据披露和高风险用途增多。同样的力量也构成主要逆风。 定制评测和 RL 环境受专家供给限制；定义糟糕的奖励函数和评分员会摧毁
              ROI；买方还要面对不断扩张的合规、供应商监督和 AI 洗白担忧。映射到估值，机会真实且很可能达到数十亿美元级，但收入耐久性取决于 Invisible 能否把定制项目变成可复制、
              受治理的项目，而不是停留在服务密集型单点解决方案厂商。
