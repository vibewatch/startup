  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Invisible 进入估值讨论时，公开证据强于多数后期私有 AI 公司：公司、Business Wire、SiliconANGLE、TechNews180 和 Intelligence360 均印证了 2025
              年 9 月的 $100 million 增长轮，该轮把已披露融资推至 $144 million；官方和分析师来源也把 2024 年收入锚定在 $134
              million。这些证据足以否定随口一句「纸面独角兽」。更难的问题是价格纪律。即便用保守的 $2.0 billion 作为最新标记下限，公司按 2024 年收入计算的历史收入倍数也超过
              14.9x。这个水平低于最激进的前沿模型式私有 AI 可比公司，但这家公司公开证据显示 EBITDA 估计为 11%、交付引擎依赖 3,000
              多名代理人员，且未披露毛利率、烧钱速度或股权结构细节；这样的价格仍然偏贵。因此，正确入场姿态不是不相信业务，而是不要在缺少 2025/2026 年收入、软件 vs
              服务毛利率以及下行保护条款的私下桥接证据时，为名义估值付钱。
