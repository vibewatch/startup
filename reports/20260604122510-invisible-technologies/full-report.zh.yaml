      - number: '7.2'
        title: 运营、安全与质量风险
        blocks:
          - type: paragraph
            body: >-
              Invisible
              确实有运营证据，但这些证据是双刃剑。公司称，前置部署工程师会把客户的遗留系统和运营数据库接入其平台，生产部署会跟踪吞吐量、错误率、资源效率和单笔交易成本，并保留可审计文档。这套表述指向运营责任，而不是轻量软件辅助。案例研究进一步证明这一点：Invisible
              正在触及保险理赔审批、医疗验证、财务入职、专家财务 QA 和企业模型评估。公司离真实运营流这么近，主要风险就不再是 AI
              能否创造价值，而是工作流跨更多行业和交易对手扩张后，质量保证、异常处理和控制证据能否继续撑住。


              公开缓释因素也存在。Invisible 对外强调持续评估、红队测试、专家网络和人工监督，Boosted.ai
              也明确称，没有人工复核，这套工作流跑不起来。这些控制重要。剩余问题在于透明度。留存的公开来源没有点名第三方安全审计机构，没有披露事件日志，也没有确认公共部门工作的授权范围。《International AI
              Safety Report》正好框定了这个问题：智能体和通用系统需要持续监测治理，而不是口头声明治理。因此，投资者看到的运营风险严重程度中高；设计意图不错，但控制有效性的外部证据仍不完整。
