      - number: '5.2'
        title: 架构、运营模式与部署机制
        blocks:
          - type: paragraph
            body: >-
              Invisible 的公开技术叙事对部署方式说得异常具体。how-we-work 页面称，前线部署工程师从客户工作流出发，将遗留系统和运营数据库连接到 Invisible
              平台，让客户数据留在客户自己的环境中，用历史数据验证，然后进入受监控的生产状态。Forward Deployed Engineering
              手册也强化了这一运营模式，把交付定义为嵌入式执行，而不是战略咨询。架构刻意保持模型无关：客户工作流和业务逻辑是稳定层， 模型、专家、智能体和评估器坐在这条集成主干之上。


              技术文档层面也解释了 Invisible 为什么如此倚重评测、验证器和人工监督。其 AI 评测报告认为，标准排行榜不足以支撑企业部署， 定制评测框架应围绕业务特定错误类型、治理模型和多轮互动搭建。RL
              环境和评分员问题材料更进一步：它们描述了可回放运行、奖励函数、 人工标注参考轨迹，以及包含结构测试、对抗性模型攻击和人类专家复核的三阶段验证器流程。对于计算机视觉和多模态系统，Invisible
              自己的文章强调事件流输出、接入 ERP/WMS/CRM 系统的 API 桥、边缘或本地部署、再训练循环，以及按模态设计故障处理。 架构故事是连贯的：先集成，再评测，只有工作流可衡量之后才自动化。
