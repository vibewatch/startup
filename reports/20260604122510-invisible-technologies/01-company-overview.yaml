company:
  name: Invisible Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Invisible Technologies is a 2015-founded, San Francisco-anchored enterprise AI and operations
    platform that combines software, forward-deployed engineering, and a managed expert workforce.
    Official and independent sources align on a 2024-2025 scale step-up—$134M of 2024 revenue,
    $144M total funding, and a valuation above $2B—while a California labor lawsuit and blocked
    worker-review surfaces leave workforce diligence materially less resolved than funding or
    leadership facts.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Invisible Technologies now presents itself as an enterprise AI software platform, but the
      reviewed record shows a hybrid model rather than a pure SaaS vendor. The homepage, about page,
      how-we-work page, and privacy policy all describe a system that organizes messy enterprise
      data, deploys agentic workflows, and adds domain experts or agents where software alone is
      insufficient. Operationally, Invisible says forward-deployed engineers wire customer systems
      into its model-agnostic platform while customer data stays in customer environments. That
      architecture lines up with its AI training materials, which emphasize multilingual evaluation,
      reinforcement-learning environments, red-teaming, and expert mobilization rather than packaged
      point software.

      Independent sources reinforce that the company began in 2015 as a virtual-assistant /
      outsourcing service and then moved up the stack into RLHF, AI training, and enterprise AI
      infrastructure. This evolution matters because it explains both the company’s credibility with
      model builders and its continuing dependence on a distributed human workforce. It also explains
      why invisible.ai is a material research trap: that domain belongs to a separate manufacturing
      computer-vision company, not the target company in this chapter.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO042, CO046]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Leadership evidence is strongest around the 2024-2025 handoff. Ben Plummer was still quoted as
      CEO in the January 2024 public-sector launch and the November 2024 Deloitte announcement, but
      on 2025-01-21 Invisible announced Matthew Fitzpatrick as CEO. Fitzpatrick’s prior role running
      QuantumBlack Labs at McKinsey suggests the company wanted an operator who could translate
      model-builder experience into enterprise deployments. Francis Pedraza remains the foundational
      governance figure across the record: Sacra identifies him as founder, the modern slavery
      statement shows him signing as founder, president, and chair, and the 2025 financing
      announcement lists him as chairman.

      Public governance disclosure remains partial, but the September 2025 fundraising materials
      named a specific board set—Pedraza, Charlie Songhurst, Doug Clinton, John Lee, Robyn Scott,
      and incoming Vanara partner Hayden Lekacz. Wes Green’s appointment as the first SVP for Global
      Public Sector is also notable because it is one of the clearest role-level signals that
      Invisible sees government work as a durable expansion vector. The main key-person dependencies
      are therefore Pedraza for founder narrative and governance continuity, and Fitzpatrick for the
      enterprise-software repositioning.
    claimRefs: [CO007, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO002, TO003]
  - id: capital-scale-and-commercial-proof
    title: Capital, scale, and commercial proof
    body: >-
      Capital and commercial proof point in the same direction: Invisible appears to have crossed
      from niche AI-operations vendor into a better-capitalized enterprise AI infrastructure player.
      Official and independent sources agree that the company raised $100M in September 2025,
      bringing lifetime funding to $144M, and that the round pulled in a mix of new and returning
      investors. The most credible outside read on valuation is “over $2B” from SiliconANGLE and
      Sacra, whereas the January 2025 CEO announcement anchors an earlier step at $500M in early
      2024. Operating momentum looks real rather than purely narrative-driven. The CEO transition post
      states revenue more than doubled from 2023 to 2024 to $134M, and the later fundraise materials
      repeat the same number while also describing a 24x increase between 2020 and 2023. Sacra
      further argues the company was already profitable at that scale, estimating roughly $15M of
      EBITDA.

      Commercial proof is also unusually concrete for a private company: official case studies claim
      8x faster claims processing for Headway, 233% faster onboarding for a delivery platform, and
      10,000 developer hours saved for Nasdaq, while WEF, AWS marketplace, and FeaturedCustomers all
      repeat the claim that Invisible has worked with more than 80% of leading AI model providers
      including AWS, Microsoft, and Cohere. Exact customer count, however, is still undisclosed.
    claimRefs: [CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO027, CO030, CO031, CO032, CO033, CO034, CO036, CO043]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: chronology-and-open-risks
    title: Chronology and open risks
    body: >-
      The public milestone record shows a company changing shape quickly, but not without diligence
      flags. The chronology begins with 2015 founding roots and a 2020 pandemic-era scaling story
      that demonstrates why Invisible became known for operational execution before enterprise AI was
      fashionable. In 2024, the company both launched public-sector operations and gained external
      growth recognition through Deloitte’s Fast 500 ranking. In January 2025, it swapped CEOs, and
      by September 2025 it had raised a large growth round, expanded disclosed board membership, and
      started framing itself as enterprise AI infrastructure rather than only AI training operations.
      The March 2026 WeCP acquisition reinforces that trajectory because it adds expert-evaluation
      tooling and interview data directly relevant to high-precision validation workflows.

      The clearest public adverse item is the California class action complaint filed in November
      2023, which alleges overtime, break, wage-statement, expense, and paid-sick-leave violations.
      That litigation does not by itself prove liability, but it means workforce-practice diligence
      cannot rely on the company narrative alone. Compounding that risk, the Indeed reviews page and
      BBB complaints page were blocked by verification walls in this run, and Crunchbase/PitchBook
      did not provide usable structured data. As a result, current worker sentiment, exact headcount,
      and fine-grained financing terms remain less verified than funding headline, revenue, or
      leadership facts.
    claimRefs: [CO012, CO028, CO029, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO045, CO047]
    tableRefs: [TO004]
    figureRefs: [FO001]
