callouts:
  - calloutType: strength
    title: Commercial proof exceeds a normal private-company signal set
    body: >-
      Invisible’s proof set is stronger than a typical private-company overview because customer
      evidence is not limited to logos: the reviewed sources include quantified case-study outcomes,
      third-party marketplace/profile repetition, and named AI ecosystem references across AWS,
      Microsoft, Cohere, Nasdaq, and Headway.
    claimRefs: [CO027, CO030, CO031, CO032, CO033, CO034]
  - calloutType: risk
    title: Workforce diligence is the main unresolved downside
    body: >-
      The California labor complaint is public and specific, while the most obvious worker-sentiment
      and complaint surfaces were blocked in this run. That combination leaves labor practices less
      verified than revenue, funding, or leadership facts.
    claimRefs: [CO037, CO038, CO039, CO040, CO041]
  - calloutType: insight
    title: This is a transition story, not a static company profile
    body: >-
      The 2024-2026 record reads like a repositioning: Invisible is trying to convert service-heavy
      AI training credibility into a broader enterprise AI infrastructure identity, with new public-
      sector work, a new CEO, and the WeCP acquisition all reinforcing that shift.
    claimRefs: [CO013, CO015, CO020, CO028, CO029, CO046, CO047]
