- id: moat-risk
  title: Moat durability and adverse evidence
  body: 'The positive case is substantial enough to take seriously. Official and third-party sources line up around meaningful scale: $134 million of 2024 revenue, $144 million of total funding, a 2025 valuation above $2 billion, and customer or partner proof spanning Microsoft, AWS, Cohere, Nasdaq, Swiss Gear, SAIC, and the Charlotte Hornets. That is not the footprint of a niche labeling shop. But the adverse case is also strong. Sacra argues that model builders are moving toward synthetic data, which weakens the defensibility of a purely training-data wedge and helps explain Invisible’s enterprise pivot. The same source flags labor-model scrutiny, while Alvarez & Marsal documents a rising bar on AI governance, disclosure discipline, and third-party compliance. Those pressures matter because Invisible’s public pricing is still opaque and some rivals offer easier self-serve or procurement-led entry points. The evidence therefore supports a balanced view: Invisible has a differentiated wedge,
    but its durability still needs proof in renewals, pricing realization, and competitive win rates against simpler alternatives.'
