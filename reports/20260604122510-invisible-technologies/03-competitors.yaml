  rows:
  - - Invisible Technologies
    - End-to-end AI partner
    - $134M 2024 revenue; $144M total funding; >$2B 2025 valuation; team of 350
    - Enterprise AI teams and frontier model builders
    - One stack across data, workflows, experts, evaluation, and agentic automation
    - Public pricing, renewal, and win-loss data remain thin
  - - Scale AI
    - Direct data-engine peer
    - Sacra comparison cites ~$1.5B ARR and ~$25B valuation
    - Enterprise AI labs and teams needing high-volume training data
    - Strong fit for annotation, APIs, RLHF, evaluation, and GenAI workflows
    - Reviewed evidence still frames it primarily around data-engine work, not full workflow ownership
  - - Labelbox
    - Tool-first annotation platform
    - Private; public pricing page exposes free tier plus paid subscription/add-ons
    - Teams building their own data factory or evaluation workflows
    - Low-friction self-serve entry point with multimodal evaluation features
    - Public evidence is strongest on tooling, not end-to-end operational ownership
  - - Appen
    - Managed labeling services incumbent
    - 1M+ contributors; 50M+ people hours; 20K+ AI projects; 10B units processed
    - Large enterprises needing global, multilingual annotation and evaluation
    - Managed workforce plus platform plus enterprise compliance posture
    - Still centered on annotation and evaluation, with pricing undisclosed
  - - TaskUs
    - BPO / CX substitute
    - Scaled public-company outsourced digital-services provider
    - Enterprises already buying outsourced digital operations or CX support
    - Procurement familiarity and service-delivery breadth
    - Not presented as a dedicated AI training or data-infrastructure stack
  - - UiPath
    - Automation-suite substitute
    - $1.901B ARR; 2,624 customers >$100K ARR; 374 customers >$1M ARR
    - Regulated enterprises automating workflows at scale
    - Installed-base credibility, governed orchestration, and enterprise controls
    - Less focused than Invisible on expert data operations, RLHF, or human training loops
  notes: Profiles use public positioning and disclosed scale signals; missing funding or pricing detail is labeled as unknown rather than guessed.
