- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Breadth across data, workflows, experts, evaluation, and agentic automation
    - Tool-first vendors and automation suites can unbundle the stack and let buyers mix cheaper point solutions
    - high
    - Request module attach rates, win-loss reasons, and how often buyers land on only one or two modules
  - - Enterprise delivery credibility
    - Freemium/self-serve tools and BPO substitutes can look easier to try or easier to buy before deep deployment
    - medium-high
    - Request pilot conversion rates, deployment timelines, and reasons pilots expand or stall
  - - Model-agnostic architecture
    - Less model lock-in also means lower proprietary switching cost if workflows are not deeply embedded
    - medium-high
    - Request retention by workload after year one and evidence that historical validation data improves renewal odds
  - - Trust and governance posture
    - Regulatory scrutiny, AI-washing concerns, and vendor-compliance reviews can slow sales or damage credibility
    - high
    - Request audit artifacts, compliance incidents, and customer security-review outcomes
  - - AI-lab heritage
    - Synthetic-data adoption can reduce the stickiness of the historical training-data wedge
    - high
    - Request current revenue mix by enterprise operations vs model-builder work and evidence of durable enterprise diversification
  notes: Severity reflects durability risk, not current product quality; the key unknown is whether breadth converts into retention and pricing power.
