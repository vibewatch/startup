  rows:
  - - Invisible Technologies
    - Custom, outcome-oriented enterprise motion; no public rate card in reviewed sources
    - Modular platform, expert marketplace, workflow automation, evaluation, agentic orchestration
    - Realized pricing, discounting, minimum commitments, and margins are undisclosed
    - Harder to benchmark externally; strong fit for consultative enterprise sales
  - - Labelbox
    - Free tier plus subscription tier and add-ons
    - Annotation platform, Monitor, SSO, custom embeddings, multimodal model-eval tooling, expert services as add-ons
    - LBU economics, enterprise discounting, and services mix are not public
    - Lowest-friction evaluation path among reviewed direct peers
  - - Appen
    - Quote-led / undisclosed in reviewed sources
    - ADAP platform, managed crowd, multi-stage QA, workflow customization, API/AWS/Azure integrations
    - No public list price, minimums, or unit economics in reviewed materials
    - Competes on global scale and managed service rather than price transparency
  - - DataAnnotation
    - Task-based contractor marketplace with premium contributor pay
    - Expert review, prompt work, ranking, labeling, and response checking
    - No enterprise package, governance SLA, or procurement structure is visible on the public page
    - Can replace expert labor for specific tasks but shifts orchestration burden back to the buyer
  - - UiPath / TaskUs
    - Enterprise-sales or contract-led motions
    - Governed automation at scale or outsourced digital-services delivery
    - Direct apples-to-apples price points are unavailable in the reviewed set
    - Incumbents can win by fitting existing budgets, procurement, or automation roadmaps
