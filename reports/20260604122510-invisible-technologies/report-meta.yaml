companyProfile:
  summary: Invisible Technologies is a private, San Francisco-anchored enterprise AI company founded in 2015 and now led by CEO Matthew Fitzpatrick, formerly head of QuantumBlack Labs at McKinsey. The company has evolved from tech-enabled outsourced operations into a modular AI software platform spanning data infrastructure, workflow mapping, expert marketplaces, evaluation, and agentic orchestration. Public evidence supports real scale—$134 million of 2024 revenue, a $100 million September 2025 growth round that brought total disclosed capital to $144 million, and customer proof across Microsoft, AWS, Cohere, Nasdaq, Headway, insurers, and public-sector work—yet the current >$2 billion valuation is being underwritten with limited public visibility into 2025/2026 revenue, margin mix, concentration, and financing terms.
  foundedDate: '2015-01-01'
