- id: partner-platform-and-customer-dependency
  title: Partner, Platform, and Customer Dependency Risk
  body: |-
    Invisible's ecosystem leverage is also a dependency stack. Management says the company has trained foundation models for more than 80% of the world's leading model providers and names Cohere, Microsoft, and AWS, while AWS Marketplace confirms a visible partner route to market. Those relationships strengthen credibility, but they also mean the company's growth narrative depends partly on external ecosystems that can change pricing, platform rules, or build-vs-buy behavior quickly. The same logic applies to WeCP: the acquisition expands expert validation and RL-gym capability, but until the product and team are fully integrated it is both a mitigation and an execution dependency.

    Customer and channel dependency are similarly real even though public concentration data is missing. The strongest public proof points are in finance, healthcare, insurance, and public-sector-adjacent workflows, which are valuable but slow-moving sectors with demanding procurement and governance expectations. Invisible's own Scale-AI comparison page admits that regulated buyers want stronger controls, access management, and decision documentation than generic annotation platforms provide. Meanwhile, Appen still markets global contributor networks, and UiPath markets governed automation with public ARR and large-customer metrics. The result is a dependency profile where Invisible must keep multiple ecosystems satisfied at once: hyperscalers, expert supply, acquired validation assets, and credibility-sensitive enterprise customers.
