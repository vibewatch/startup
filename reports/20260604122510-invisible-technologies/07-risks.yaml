- id: mitigation-framework-and-kill-criteria
  title: Mitigation Framework and Kill Criteria
  body: |-
    Invisible does not read like a careless operator. Across policy, product, and case-study materials, the company repeatedly returns to human expertise, evaluation loops, workflow metrics, audit-ready documentation, and governed implementation inside customer systems. Those are exactly the right themes for a business that is moving AI into regulated operational surfaces. The modern-slavery statement and vendor-risk program also show that management is at least attempting to treat supply-chain and workforce oversight as real governance tasks. That is the positive case.

    The decisive criteria are therefore not generic startup metrics; they are evidence thresholds. Investors should expect proof that privacy and automated-decision controls hold up in live deployments, that security diligence and incident reporting exist beyond marketing language, that public-sector work carries real authorizations rather than only aspiration, and that enterprise software mix is actually rising fast enough to offset any synthetic-data substitution in older AI-training revenue lines. If the company cannot produce those proofs, or if quality metrics and key relationships deteriorate while valuation expectations remain elevated, the thesis should move from risk-managed upside to avoid or reprice.
