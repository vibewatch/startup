  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-coverage
    missingEvidence: Customer-by-customer obligations for sector-specific workflows, public-sector security reviews, and contract-specific automated-decision clauses are not publicly disclosed.
    whyItMatters: The regulatory register can rank the visible risk stack, but final legal severity depends on what data types, approval rights, and regulated decisions Invisible actually touches inside each customer deployment.
    diligencePath: Request template DPAs, automated-decision notices, state-law compliance memos, and any public-sector security or procurement questionnaires tied to active deployments.
    relatedQuestionRefs:
    - QR001
    - QR017
    - QR029
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: security-transparency
    missingEvidence: No retained public source names a third-party security auditor, discloses an incident log, or sets out certification scope covering Invisible's production systems and public-sector work.
    whyItMatters: Without independent control evidence, investors cannot distinguish between a real governance program and narrative-only control claims, especially in regulated workflows.
    diligencePath: Request SOC 2 report details, penetration-test summaries, incident history, uptime metrics, and any public-sector security authorization package.
    relatedQuestionRefs:
    - QR016
    - QR034
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Public sources do not disclose customer concentration, gross margin, revenue mix between enterprise software and labor-backed services, NRR, or renewal quality.
    whyItMatters: These metrics determine whether Invisible is becoming a software-led platform or remaining a higher-touch services business with structurally lower margin potential.
    diligencePath: Request board or financing materials that bridge revenue by product line, gross margin by delivery model, cohort retention, top-customer share, and enterprise-software mix.
    relatedQuestionRefs:
    - QR033
  - type: missing-source
    severity: material
    topic: public-sector-authorizations
    missingEvidence: Retained public sources show public-sector ambition and case-style references but do not confirm named security authorizations, procurement vehicles, or contract durability.
    whyItMatters: Public-sector revenue can be valuable and sticky, but it also introduces compliance and sales-cycle risk that cannot be underwritten from marketing pages alone.
    diligencePath: Request the list of active public-sector programs, procurement vehicles, contract terms, security reviews, and customer references that can be independently verified.
    relatedQuestionRefs:
    - QR014
    - QR029
    - QR034
    relatedTableRefs:
    - TR003
