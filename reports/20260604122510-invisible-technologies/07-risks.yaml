- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy and automated-decision compliance
    - Regulator or customer legal escalation
    - Formal inquiry, failed DPIA, or inability to show automated-decision notices and DPAs for live workflows
    - Pause conviction until legal-control package is reviewed; thesis break if active enforcement names Invisible or its workflow as a root cause
  - - Operational quality in regulated workflows
    - Workflow-quality deterioration
    - Repeat claim or onboarding errors, missing exception dashboards, or inability to provide incident review data
    - Assume lower durability and higher churn risk; avoid if quality metrics cannot be produced
  - - Security and control maturity
    - Independent-control evidence gap
    - No named security auditor or no incident history package despite diligence request
    - Discount management claims and treat control maturity as unproven until evidence arrives
  - - Partner and ecosystem dependence
    - Key relationship or integration stress
    - Loss of meaningful model-provider or marketplace relationship, or missed WeCP integration milestones beyond 12 months
    - Haircut growth and mitigation assumptions; re-underwrite platform leverage
  - - People and execution
    - Leadership or scaling fracture
    - Unexpected senior turnover, sustained slowdown in engineering delivery, or public-sector expansion without compliance staffing
    - Move to watchlist or avoid until operating cadence stabilizes
  - - Financial and model mix
    - Enterprise-mix shift fails to offset synthetic-data pressure
    - Next financing at flat or lower price, no revenue-mix bridge, or evidence that labor-backed delivery remains the dominant margin driver
    - Avoid or materially reprice because valuation support would no longer be evidence-based
