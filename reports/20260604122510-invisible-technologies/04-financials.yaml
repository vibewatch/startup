- id: TI004
  title: Unit Economics Table
  columns:
  - Metric
  - Public Value / Status
  - Confidence
  - Why It Matters
  - Diligence Ask
  rows:
  - - 2024 revenue
    - $134M
    - high
    - Confirms the company has real scale beyond pilot-stage AI vendors
    - Tie the 2024 figure to audited monthly revenue and recognized-revenue policy
  - - 2024 EBITDA
    - ~$15M (Sacra estimate)
    - medium
    - Only public profitability proxy; determines whether growth is being bought with cash burn or funded by operations
    - Request management EBITDA bridge and cash conversion from EBITDA to operating cash flow
  - - EBITDA margin
    - ~11% (Sacra estimate)
    - medium
    - Suggests better economics than a heavily loss-making services business, if directionally correct
    - Request GAAP gross margin plus EBITDA reconciliation
  - - Revenue per current team member
    - ~$383k using $134M / 350 people
    - medium
    - Directional productivity proxy for a hybrid software/services model
    - Recompute with same-period average headcount and split revenue by software versus delivery labor
  - - Delivery base
    - 3,000+ agents in 35+ countries plus 350 FTE
    - medium
    - Shows labor remains economically material even if automation is improving throughput
    - Request share of delivery fulfilled by contractors, employees, and software automation
  - - Public comp disclosure proxy — UiPath
    - $1.901B ARR; 109% DBNRR; 2,624 $100k+ ARR customers; 374 $1M+ ARR customers
    - high
    - Illustrates the disclosure standard public workflow-automation peers provide
    - Ask management to provide equivalent metrics even if the company stays private
  - - Public comp disclosure proxy — Appen
    - 50M+ people-hours; 20K+ AI projects; 100M LLM data elements; 10B units processed
    - medium
    - Shows AI-data peers disclose operating-scale metrics even when margins differ from Invisible
    - Request Invisible's equivalent throughput, project count, and expert-volume metrics
  - - Public comp disclosure proxy — TaskUs/BPO
    - Public outsourced-digital-services proxy exists, but fetched overview does not expose inline margin data
    - medium
    - Useful as a lower-margin services reference point when testing downside margin cases
    - Pull full filings and compare gross margin, EBITDA margin, and labor intensity against Invisible
  - - Gross margin
    - Not publicly disclosed
    - none
    - Core question for whether the business scales like software or managed services
    - Request gross margin by AI training/evaluation versus enterprise workflow automation
  - - CAC / payback / NRR
    - Not publicly disclosed
    - none
    - Needed to judge GTM efficiency and durability of land-and-expand economics
    - Request cohort retention, S&M spend, new ARR, and payback by segment
  notes: Public unit-economics evidence is a mix of corroborated topline, third-party profitability estimates, simple author calculations, and public-comp disclosure standards. Treat all non-disclosed fields as true diligence blockers.
