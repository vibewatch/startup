  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Contract-level realized pricing, discount schedules, term length, and gross-to-net bridge by workflow or product line.
    whyItMatters: List-price proxies cannot support revenue-quality underwriting without seeing what customers actually pay and how long contracts last.
    diligencePath: Request the current rate card, discount approval matrix, and a sample of top-customer statements of work with realized unit prices.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-runway
    missingEvidence: Current cash balance, monthly burn, cash conversion, and a board-ready 12-18 month runway model.
    whyItMatters: Capital adequacy cannot be underwritten from funding headlines alone; runway risk depends on current liquidity and spend cadence.
    diligencePath: Request the latest cash balance, monthly management accounts, budget-vs-actual burn, and debt schedule.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-concentration
    missingEvidence: Revenue mix by AI training/evaluation versus enterprise workflow automation, top-customer concentration, and vertical mix.
    whyItMatters: Revenue quality depends on whether growth is diversified and recurring or concentrated in a handful of project-based customers.
    diligencePath: Request a revenue bridge by product line, top-10 customer concentration, renewal schedule, and vertical/geo mix for the last eight quarters.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: GAAP or management gross margin, labor-cost allocation, automation savings, and contribution margin by major workflow type.
    whyItMatters: The investment case hinges on whether Invisible scales toward software-like economics or remains structurally closer to services margins.
    diligencePath: Request gross-margin bridge, COGS policy, worker-compensation mix, and margin by AI training versus enterprise automation work.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: retention-and-cac
    missingEvidence: NRR, GRR, logo retention, CAC, payback, and cohort conversion from pilot to scaled production engagements.
    whyItMatters: Without retention and acquisition metrics, public ROI anecdotes cannot be converted into durable unit-economics or sales-efficiency conclusions.
    diligencePath: Request cohort retention tables, funnel conversion by segment, and S&M spend by channel for the last six quarters.
    relatedTableRefs:
    - TI004
    - TI006
