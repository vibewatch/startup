- id: TI006
  title: Public Financial Gaps Table
  columns:
  - Missing Private Metric
  - Impact on Underwriting
  - Why Public Sources Fall Short
  - Exact Diligence Path
  rows:
  - - Revenue mix by product / workflow / customer type
    - Cannot judge how much revenue is recurring software, managed service, or project work
    - Official pages prove multiple monetization lanes but not their percentage contribution
    - Request quarterly revenue bridge by AI training, evaluation, expert marketplace, and enterprise workflow automation
  - - Customer concentration and vertical mix
    - Cannot test whether growth is diversified or dependent on a few flagship accounts
    - Case studies show logos and use cases, not revenue concentration
    - Request top-10 customer concentration, renewal schedule, and revenue by industry / geography
  - - Gross margin and COGS composition
    - Cannot decide whether Invisible merits software-like or services-like valuation logic
    - Only Sacra provides an EBITDA estimate; no public gross-margin disclosure exists
    - Request gross-margin bridge, labor-cost allocation, and automation savings by workflow type
  - - CAC, payback, NRR, and cohort retention
    - Cannot validate sales-efficiency claims or durability of land-and-expand growth
    - Public materials emphasize ROI anecdotes instead of funnel or cohort data
    - Request quarterly cohorts, S&M spend, conversion rates, and NRR / GRR by segment
  - - Cash, burn, and runway
    - Cannot model financing dependency or downside resilience
    - Funding headlines do not disclose current liquidity or cash consumption
    - Request latest cash statement, monthly burn, runway model, and debt facilities
  - - Realized pricing and discount structure
    - Cannot translate workflow ROI into revenue quality or margin quality
    - No public rate card or contract term schedule is available on retained sources
    - Review current price book, discount matrix, and a sample of signed statements of work
  notes: These gaps are the difference between a compelling public narrative and an investable financial file. Gross margin, concentration, and cash/burn remain the most important blockers.
