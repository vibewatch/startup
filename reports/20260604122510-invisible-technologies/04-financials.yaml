tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current Value / Status
  - Revenue Quality
  - Diligence Ask
  rows:
  - - AI training, RLHF, and evaluation work
    - Model-builder projects using expert feedback, annotation, validation, and measurement
    - Per workflow, annotation volume, or retained specialist team
    - Clearly active in official AI-training pages and Cohere/Boosted case studies; exact mix undisclosed
    - Medium — demand exists, but mix may be exposed to synthetic-data substitution and project volatility
    - Request revenue split by model-builder work, renewal rate, and share of non-recurring project revenue
  - - Enterprise workflow automation / custom solutions
    - Invisible plugs into customer systems and automates or augments operational workflows
    - Likely monthly retainer or workflow-based pricing
    - Supported by Nasdaq, Headway, insurer, retailer, and Swiss Gear style examples; no public contract values
    - High if sticky into core workflows, but recurring profile is not publicly proven
    - Request ARR or managed-service revenue tied to production deployments, not pilots
  - - Expert marketplace / human-in-the-loop validation
    - Access to domain experts and distributed operators through Invisible's platform
    - Specialist task, project batch, or quality-validated output
    - Embedded in platform narrative and case studies; exact standalone monetization unclear
    - Medium — can be differentiated, but labor intensity can cap margins
    - Request attach rate of expert marketplace to software modules and gross margin by expert-backed work
  - - Public-sector and regulated-industry programs
    - Enterprise accounts in defense, government, insurance, and other regulated workflows
    - Custom enterprise statement of work
    - Official release cites SAIC/U.S. Navy activity and a public-sector enterprise lead
    - Medium — likely longer-lived contracts, but procurement cycle and certification requirements are opaque
    - Request pipeline conversion, contract term, and budget source for public-sector engagements
  - - Legacy executive-support / assistant workflows
    - Historical concierge-style or delegated task support
    - $2,000 per month minimum according to Sacra historical pricing
    - Historic monetization lane; not central to current positioning
    - Low — legacy stream appears strategically de-emphasized
    - Confirm whether this stream still exists and whether any legacy contracts remain material
  notes: Table separates evidenced streams from public unknowns. Official material proves broad workflow categories, but product-line revenue mix and renewal quality remain private.
