company:
  name: Invisible Technologies
chapter:
  number: 4
  title: Financials
  summary: 'Invisible has real commercial traction: official 2025 financing materials and independent Sacra coverage both point to roughly $134M of 2024 revenue, while the company raised $100M to reach $144M of disclosed lifetime funding. Public evidence supports a blended software-plus-service model sold around workflow ROI rather than transparent seat pricing, and third-party estimates suggest about $15M of EBITDA in 2024. The underwriting problem is disclosure depth: ARR, gross margin, CAC, NRR, concentration, cash, burn, and runway all remain private, so the chapter can support a ''research more'' posture but not a fully underwritten financial conviction.'
sections:
- id: revenue-model-and-monetization
  title: Revenue Model and Revenue Streams
  body: 'Invisible''s public materials support a blended revenue model rather than a clean SaaS or clean services archetype. Official pages market an end-to-end platform that combines data infrastructure, workflow design, evaluation tooling, and human experts, while Sacra describes the commercial package as operations-as-a-service sold around defined workflows and outcomes. That mix matters for underwriting: platform software can improve delivery leverage over time, but today the evidence still points to a business where monetization is tied to specific customer processes, annotation volumes, or monthly retainers rather than published seat pricing.


    The best-supported revenue-stream split is therefore between (1) AI training, RLHF, evaluation, and expert-validation work for model builders; and (2) enterprise workflow automation and custom solutions for large organizations that want AI embedded into legacy processes. Official case studies span financial research, healthcare claims, insurance operations, retail recruiting, and enterprise data onboarding, which suggests the company is monetizing both model-improvement work and business-process transformation. What remains missing is the most important underwriting layer: public materials do not disclose how much revenue comes from recurring platform subscriptions versus labor-backed project or managed-service work, nor do they show customer concentration or renewal terms.'
