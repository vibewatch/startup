- id: TI005
  title: Capital Adequacy Table
  columns:
  - Item
  - Value / Status
  - Confidence
  - Implication
  - Diligence Ask
  rows:
  - - Cash on hand
    - Not publicly disclosed
    - none
    - Cannot determine current liquidity from the retained public record
    - Request latest unrestricted cash balance and monthly cash bridge
  - - Monthly burn
    - Not publicly disclosed
    - none
    - Runway and financing dependency cannot be modeled
    - Request budget-vs-actual burn for the last 12 months
  - - Runway months
    - Not publicly disclosed
    - none
    - No defensible public runway estimate exists
    - Request management runway model under base and downside cases
  - - Total capital raised
    - $144M disclosed lifetime total
    - high
    - Shows the company is well-funded versus very early-stage AI services peers
    - Reconcile total capital raised to current cap table and any secondary activity
  - - Latest round
    - $100M growth financing in September 2025
    - high
    - Fresh capital reduces near-term stress but does not replace operating disclosures
    - Request post-money ownership, liquidation stack, and investor rights
  - - Planned use of funds
    - Invest further in core AI software platform and supporting leadership / field expansion
    - high
    - Signals product buildout rather than emergency financing
    - Request board-approved allocation by platform, hiring, GTM, and geography
  - - Next-round trigger
    - Not publicly disclosed
    - none
    - Unknown whether the next raise depends on revenue milestones, product milestones, or broader market timing
    - Ask management for financing plan, target milestones, and downside contingency actions
  - - Debt / project-finance obligations
    - None disclosed in retained public materials
    - low
    - Encouraging on its face, but absence of disclosure is not a substitute for diligence
    - Request debt schedule, bank facilities, minimum-spend commitments, and covenant package
  notes: Capital adequacy can only be judged directionally from fundraising and management commentary. Public sources do not disclose the cash, burn, or runway inputs required for real underwriting.
