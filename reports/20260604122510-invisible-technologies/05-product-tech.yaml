- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process
  - role
  - public dependency
  - risk
  rows:
  - - Legacy-system connectors and data pipes
    - Move structured and unstructured enterprise data into the workflow stack
    - Customer systems, operational databases, warehouses, ERP/WMS/CRM targets
    - Connector breadth and change-management burden are not publicly documented
  - - Workflow mapping and business-logic design
    - Translate messy real work into explicit routes, constraints, and escalation paths
    - Forward-deployed engineers plus Atomic-style process mapping
    - If workflows are poorly specified, agent outputs can optimize the wrong objective
  - - Model layer
    - Select model best suited to the task while remaining model-agnostic
    - Third-party models and customer environment constraints
    - Model drift and provider dependency remain ongoing risks
  - - Human expert layer
    - Provide domain judgment, labels, trajectories, reviews, and exceptions handling
    - Meridial / expert marketplace plus acquired WeCP assessment infrastructure
    - Quality, throughput, and labor-governance metrics are not fully public
  - - Evaluation and grader layer
    - Measure output quality, calibrate rewards, and catch failure modes before production
    - Synapse plus custom eval frameworks, rubrics, adversarial tests, and human review
    - Thin public verifier metrics mean buyers still need diligence on false-positive / false-negative rates
  - - Monitoring and orchestration layer
    - Run live workflows, log actions, compare versions, and track operational KPIs
    - Axon orchestration, replayable RL runs, monitored production state
    - No public uptime page, incident history, or support-SLA surface was retained
  notes: The table treats architecture as an operating model. Risks focus on what public materials do not yet quantify for diligence.
