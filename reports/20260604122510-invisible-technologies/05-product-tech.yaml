- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow problem
  - Invisible solution
  - measurable benefit
  - limitation
  rows:
  - - Back-office document handling
    - Scanned docs, emails, invoices, and exceptions slow compliance-heavy operations
    - Extract, normalize, route by confidence, surface evidence, and escalate uncertain decisions for human review
    - Compliance-ready data and lower manual workload are the core public promises
    - No public list of supported systems or SLA targets
  - - Contact-center quality and triage
    - Sampling misses policy breaches and fragmented channel data hides trends
    - Governed cross-channel view, 100% interaction evaluation, sentiment/risk surfacing, and human-controlled handoffs
    - Policy-level QA coverage and faster routing are explicit public claims
    - No public proof of live customer count or support uptime
  - - Demand forecasting
    - Planning teams struggle with fragmented ERP, POS, labor, and external data
    - Unify data foundation, train custom models, and deliver dashboards plus recommendations
    - Decision-ready forecasting and value-chain visibility are explicit public promises
    - No public accuracy benchmarks or refresh cadence disclosed
  - - Computer-vision operations
    - Raw video is hard to operationalize and models degrade in messy environments
    - Annotation, QA, secure deployment, edge/on-prem options, and continuous retraining loops
    - Structured event streams, better drift management, and customer data control are central to the pitch
    - Public proof is strongest in narrative docs, not in accessible technical specs
  - - AI training and RL environments
    - Generic benchmarks and crowd ratings fail to capture enterprise judgment
    - Expert reviewers, verifiable rewards, replayable runs, and custom evaluation frameworks
    - Public proof includes 20k evaluations at You.com and trusted human evaluation for Cohere
    - No public API or pricing surface for RL environments was retained
  notes: Benefits capture public claims and case-study outputs only. Missing metrics reflect absent public disclosure rather than negative product evidence.
