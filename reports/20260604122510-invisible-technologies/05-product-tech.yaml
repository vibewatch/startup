- id: architecture-operating-model-and-deployment
  title: Architecture, operating model, and deployment mechanics
  body: 'Invisible’s public technical narrative is unusually explicit about how deployments are supposed to work. The how-we-work page says forward-deployed engineers start from the customer workflow, connect legacy systems and operational databases to Invisible’s platform, keep customer data in the customer’s own environment, validate against historical data, and then move into a monitored production state. That operating model is reinforced by the Forward Deployed Engineering playbook, which frames delivery as embedded execution rather than strategy consulting. The architecture is intentionally model-agnostic: the customer workflow and business logic are the stable layer, while models, experts, agents, and evaluators sit on top of that integration spine.


    The technical-doc surface also clarifies why Invisible leans so heavily on evaluation, verifiers, and human oversight. Its AI-evaluation report argues that standard leaderboards are inadequate for enterprise deployment and that custom evaluation frameworks should be built around business-specific error types, governance models, and multi-turn interactions. The RL-environment and grader-problem materials go further: they describe replayable runs, reward functions, human-annotated reference trajectories, and a three-stage verifier process with structural tests, adversarial model attacks, and human expert review. For computer vision and multimodal systems, Invisible’s own writing emphasizes event-stream outputs, API bridges into ERP/WMS/CRM systems, edge or on-prem deployment, retraining loops, and modality-specific failure design. The architecture story is coherent: integration first, evaluation second, automation only after the workflow is measurable.'
