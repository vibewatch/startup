  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: engineering-maturity
    missingEvidence: Public release notes, change logs, versioning policy, and support-process detail for the core product modules.
    whyItMatters: Leadership hiring and engineering-org growth signal product maturity, but buyers still cannot assess how quickly modules ship, change, or roll back.
    diligencePath: Request the 12-month release calendar, change-management policy, and support-escalation handbook for Neuron, Atomic, Synapse, Axon, and Meridial.
    relatedQuestionRefs:
    - QE009
    - QE017
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: material
    topic: trust-center
    missingEvidence: Accessible control mappings, certification documents, penetration-test summaries, and security architecture detail from the public trust portal.
    whyItMatters: Invisible’s privacy policy is detailed, but enterprise buyers still need proof of how controls are implemented and audited before trusting sensitive workflow deployments.
    diligencePath: Obtain trust-portal access or a security packet covering certifications, subprocessor governance, data-segmentation controls, and incident-response commitments.
    relatedQuestionRefs:
    - QE012
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: A public status page, uptime history, support-SLA commitments, or incident-response postmortems for Invisible products.
    whyItMatters: Operational buyers can see workflow outcomes in case studies, but they cannot independently verify runtime reliability, availability commitments, or how incidents are handled.
    diligencePath: Request support tiers, uptime objectives, incident-response playbooks, and any external status/history links used with production customers.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: expert-network-quality
    missingEvidence: Public acceptance rates, calibration scores, reviewer QA metrics, and turnover data for the expert network and WeCP assessment funnel.
    whyItMatters: Human expertise is central to Invisible’s differentiation, so expert-selection quality directly affects model quality, evaluation trustworthiness, and delivery scalability.
    diligencePath: Request reviewer qualification thresholds, benchmark pass rates, calibration reports, and QA defect rates across Meridial / WeCP workflows.
    relatedQuestionRefs:
    - QE013
    - QE025
    relatedTableRefs:
    - TE001
    - TE003
