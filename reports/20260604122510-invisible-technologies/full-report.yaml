      - number: '1.3'
        title: Capital, scale, and commercial proof
        blocks:
          - type: paragraph
            body: >-
              Capital and commercial proof point in the same direction: Invisible appears to have crossed from niche
              AI-operations vendor into a better-capitalized enterprise AI infrastructure player. Official and
              independent sources agree that the company raised $100M in September 2025, bringing lifetime funding to
              $144M, and that the round pulled in a mix of new and returning investors. The most credible outside read
              on valuation is “over $2B” from SiliconANGLE and Sacra, whereas the January 2025 CEO announcement anchors
              an earlier step at $500M in early 2024. Operating momentum looks real rather than purely narrative-driven.
              The CEO transition post states revenue more than doubled from 2023 to 2024 to $134M, and the later
              fundraise materials repeat the same number while also describing a 24x increase between 2020 and 2023.
              Sacra further argues the company was already profitable at that scale, estimating roughly $15M of EBITDA.

              Commercial proof is also unusually concrete for a private company: official case studies claim 8x faster
              claims processing for Headway, 233% faster onboarding for a delivery platform, and 10,000 developer hours
              saved for Nasdaq, while WEF, AWS marketplace, and FeaturedCustomers all repeat the claim that Invisible
              has worked with more than 80% of leading AI model providers including AWS, Microsoft, and Cohere. Exact
              customer count, however, is still undisclosed.
