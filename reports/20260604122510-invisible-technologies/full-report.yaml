      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is strongest around the 2024-2025 handoff. Ben Plummer was still quoted as CEO in the
              January 2024 public-sector launch and the November 2024 Deloitte announcement, but on 2025-01-21 Invisible
              announced Matthew Fitzpatrick as CEO. Fitzpatrick’s prior role running QuantumBlack Labs at McKinsey
              suggests the company wanted an operator who could translate model-builder experience into enterprise
              deployments. Francis Pedraza remains the foundational governance figure across the record: Sacra
              identifies him as founder, the modern slavery statement shows him signing as founder, president, and
              chair, and the 2025 financing announcement lists him as chairman.

              Public governance disclosure remains partial, but the September 2025 fundraising materials named a
              specific board set—Pedraza, Charlie Songhurst, Doug Clinton, John Lee, Robyn Scott, and incoming Vanara
              partner Hayden Lekacz. Wes Green’s appointment as the first SVP for Global Public Sector is also notable
              because it is one of the clearest role-level signals that Invisible sees government work as a durable
              expansion vector. The main key-person dependencies are therefore Pedraza for founder narrative and
              governance continuity, and Fitzpatrick for the enterprise-software repositioning.
