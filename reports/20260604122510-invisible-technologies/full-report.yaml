      - number: '8.2'
        title: Thesis, anti-thesis, and comparable set
        blocks:
          - type: paragraph
            body: >-
              The core bull case is evidence-backed. Invisible has real product breadth, not just a labor marketplace:
              its materials describe modular software layers for data infrastructure, workflow mapping, expert work,
              evaluation, and orchestration, while customer cases show measurable deployment ROI across healthcare,
              insurance, financial-data onboarding, and AI model improvement. The WEF profile and official releases also
              support a business that is already profitable, widely deployed, and increasingly oriented around
              enterprise workflow ownership rather than a narrow RLHF wedge. The anti-thesis is just as real. Sacra's
              revenue and margin framing still looks more tech-enabled services than software-pure, and the same source
              warns that synthetic-data adoption can pressure legacy labeling and RLHF demand. Sector benchmarks sharpen
              that tension. Applied AI and data-intelligence businesses can still command premium pricing, but Finro and
              Aventis both argue that later-stage investors increasingly separate frontier rails from more operationally
              intensive applied models. That means Invisible needs enterprise durability and software-like margin
              expansion to keep defending a multiple far above public software norms.
