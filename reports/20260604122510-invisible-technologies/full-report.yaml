      - number: '3.2'
        title: Capability breadth and packaging differences
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is Invisible’s clearest public differentiator. Official product pages span
              domain-expert AI training, RL environments, multimodal data work, contact-center QA, computer-vision QA,
              and back-office automation. That is wider than the public positioning visible for tool-first or
              managed-labeling competitors. Labelbox clearly exposes an annotation-and-evaluation platform with a free
              tier and paid enterprise features, which makes it the easiest low-friction comparison point for a buyer
              that wants tooling before services. Appen shows the opposite trade-off: a very large contributor base,
              broad modality support, and enterprise compliance posture, but with a sales-led rather than transparent
              package. Invisible’s own Scale-AI comparison guide reinforces the market split between buyers that want
              datasets and buyers that want production workflows plus domain expertise. That distinction matters because
              packaging itself is a competitive weapon here. The easiest vendor to trial is not necessarily the best
              vendor to own a messy, regulated, or high-judgment workflow end to end.
