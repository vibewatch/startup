        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies should be understood as a workflow AI operator, not as a narrow annotation vendor
              or a generic model wrapper. Across its solution pages, the company describes a modular stack that can
              ingest unstructured enterprise data, map business logic, deploy agents, insert human review where
              confidence is low, and continuously evaluate outputs against operational KPIs. The public product surface
              spans back-office automation, contact-center quality and routing, forecasting, computer vision, AI
              training, and reinforcement-learning environments. That breadth matters because it shows Invisible
              packaging repeatable workflow blocks around specific customer jobs rather than only selling bespoke
              consulting hours.


              The clearest module map comes from the 2025 financing materials and the 2026 WeCP acquisition
              announcement. Those sources describe a core platform organized around data infrastructure, process
              mapping, expert-marketplace or Meridial capabilities, evaluation, and orchestration. In practice, the
              solution pages map neatly back to those layers: back-office automation emphasizes ingestion, routing,
              evidence surfacing, and human escalation; contact center emphasizes governed context and policy-level
              evaluation across every interaction; forecasting emphasizes data unification plus custom models; computer
              vision emphasizes secure deployment, annotation, QA, and insight delivery; and AI training plus RL
              environments emphasize expert judgment, graders, rubrics, and replayable task runs. The product story is
              therefore a stack of interoperating modules and workflow templates, not a single SKU.
