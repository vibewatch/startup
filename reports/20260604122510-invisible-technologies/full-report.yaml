  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, substitutes, and competitive spillover'
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies should be evaluated as the invisibletech.ai enterprise AI workflow and training
              company, not as a narrow data-labeling point product. The evidence shows a genuinely broad competitive
              set. Sacra places Scale AI and Surge AI in the direct AI-training lane, while also naming annotation
              specialists such as Appen and BPO substitutes such as TaskUs and Teleperformance. Invisible’s own
              comparison guide widens the frame further by splitting the market into tool-first platforms, managed
              labeling services, open-source stacks, and end-to-end partners. CB Insights adds another layer of
              spillover by listing Mimica, SuperAnnotate, and Hypatos as alternatives, which means buyers can solve
              adjacent parts of the same problem through process intelligence, annotation, or document automation
              products. The practical takeaway is that Invisible does not win merely by beating one obvious rival. It
              has to justify why a buyer should choose a full-stack operating model instead of a cheaper tool, a scaled
              service vendor, or a build-it-yourself path.
