  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies should be framed against enterprise AI operations, AI training and evaluation, and
              workflow automation budgets — not against the factory-floor vision market served by invisible.ai or the
              full generative-AI infrastructure stack. The company’s own materials consistently define the product as
              modular deployment around data, agents, humans-in-the-loop, and evaluation systems tied to real
              operational outcomes, while the RL-environment offer is explicitly organized around enterprise tasks such
              as accounting, banking, legal, and compliance. That makes the closest substitutes a mixed set:
              annotation-first vendors like Appen and Labelbox, orchestration software such as UiPath, and
              outsourced-digital-services providers like TaskUs. It also means large pools of generic server spend,
              hyperscaler capex, and unrelated computer-vision deployments should be excluded from the market boundary.
              The key analytical consequence is that Invisible is competing for workflow budgets where correctness,
              auditability, and human escalation matter more than raw model access or commodity labeling throughput.
            claimRefs:
