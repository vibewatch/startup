          value: 1997
          note: Current Invisible floor using >$2.0B on $134M revenue
        - label: 16.7x revenue
          value: 2238
          note: Scale-like private data-engine benchmark
        - label: 24.2x revenue
          value: 3243
          note: Aventis median AI large-transaction multiple
        - label: 30x revenue
          value: 4020
          note: Upper end of Aventis fundraising band
