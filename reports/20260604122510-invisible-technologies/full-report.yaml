      - number: '4.3'
        title: Unit Economics Proxies and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The strongest publicly corroborated topline signal is that 2024 revenue reached $134 million, with Sacra
              separately estimating $15 million of EBITDA on that base. If those figures are directionally right,
              Invisible has already escaped the earliest-stage profile of a heavily cash-burning AI-services startup.
              The core open question is not whether revenue exists, but whether the margin path is converging toward
              software-like economics or remaining constrained by labor intensity.


              Public evidence cuts both ways. On the positive side, the company markets proprietary software, continuous
              evaluation tooling, and workflow automation, all of which should raise throughput and improve gross margin
              over time. On the limiting side, Sacra describes a delivery engine with 3,000+ agents across 35+ countries
              plus a 350-person internal team, which implies a substantial variable labor component. Case studies also
              emphasize speed and labor savings rather than software seat expansion, again pointing to a bespoke
              delivery model. The best public proxy for operating productivity is roughly $383k of 2024 revenue per
              current team member using the disclosed 350-person 2025 team size, but that is only a rough directional
              metric. Public comparables such as UiPath and Appen disclose much more detailed ARR, retention, and
              throughput information than Invisible does, highlighting how much unit-economics work is still private.
