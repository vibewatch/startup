  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Invisible enters valuation with stronger public proof than most late-stage private AI companies: the
              company, Business Wire, SiliconANGLE, TechNews180, and Intelligence360 all corroborate a $100 million
              September 2025 growth round that lifted disclosed funding to $144 million, while official and analyst
              sources anchor 2024 revenue at $134 million. That evidence is strong enough to reject a casual 'paper
              unicorn' dismissal. The harder question is price discipline. Even using a conservative $2.0 billion floor
              for the latest mark, the company screens at more than 14.9x trailing 2024 revenue. That is below the most
              aggressive frontier-style private AI comparables, but it is still rich for a business whose public
              evidence points to an 11% EBITDA estimate, a 3,000-plus agent delivery engine, and no disclosed
              gross-margin, burn, or cap-table detail. The right entry posture is therefore not disbelief in the
              business; it is skepticism toward paying the headline mark without a private bridge on 2025/2026 revenue,
              software-vs-services margins, and downside-protection terms.
            claimRefs:
              - CV001
