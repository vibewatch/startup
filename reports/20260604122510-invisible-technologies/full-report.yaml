chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies now presents itself as an enterprise AI software platform, but the reviewed record
              shows a hybrid model rather than a pure SaaS vendor. The homepage, about page, how-we-work page, and
              privacy policy all describe a system that organizes messy enterprise data, deploys agentic workflows, and
              adds domain experts or agents where software alone is insufficient. Operationally, Invisible says
              forward-deployed engineers wire customer systems into its model-agnostic platform while customer data
              stays in customer environments. That architecture lines up with its AI training materials, which emphasize
              multilingual evaluation, reinforcement-learning environments, red-teaming, and expert mobilization rather
              than packaged point software.

              Independent sources reinforce that the company began in 2015 as a virtual-assistant / outsourcing service
              and then moved up the stack into RLHF, AI training, and enterprise AI infrastructure. This evolution
              matters because it explains both the company’s credibility with model builders and its continuing
              dependence on a distributed human workforce. It also explains why invisible.ai is a material research
              trap: that domain belongs to a separate manufacturing computer-vision company, not the target company in
              this chapter.
