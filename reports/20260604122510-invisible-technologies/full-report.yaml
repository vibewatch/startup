              user privacy rights. Negatively, the retained trust-center fetch did not expose detailed control mappings
              or accessible certification evidence, and there is no public uptime or incident surface in the prepared
              evidence set. That matters because outside legal and safety sources point toward a tougher environment
              around privacy, transparency, consent, training-data disclosure, and risk management. Relative to public
