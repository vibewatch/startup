      IC-style scoring of market position, proof, economics, governance readiness, and valuation discipline for
      Invisible today.
    data:
      items:
        - label: Customer proof
          value: 4.5
          note: Case studies show real operating outcomes across several enterprise workflows
        - label: Platform breadth
          value: 4
