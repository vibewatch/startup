      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Invisible's disclosed capital position is directionally supportive but still incomplete for underwriting.
              The company announced a $100 million growth round in September 2025, bringing lifetime disclosed funding
              to $144 million. Management said the proceeds would be invested in the core AI software platform and the
              leadership expansion described in the same release. Combined with the founder's statement that the company
              had been built profitably for years, this reduces the probability of an immediate liquidity crisis.


              That said, the public record stops short of the metrics an investor would actually need to size financing
              dependency. There is no disclosed cash-on-hand number, no burn rate, no monthly or quarterly cash flow,
              and no runway guidance. No debt or project-finance burden is apparent in retained public sources, which is
              better than finding venture debt or covenant risk, but 'none disclosed' is not the same as a closed
              diligence item. The next-round trigger is likewise undisclosed. The practical conclusion is that capital
              adequacy looks acceptable at the headline level because the company is financed and apparently not
              distressed, but the next financing window, if any, cannot be modeled without management accounts.
