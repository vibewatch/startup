      - number: '2.2'
        title: Sizing lenses and evidence-constrained market estimate
        blocks:
          - type: paragraph
            body: >-
              Public market-size data for Invisible’s exact niche are sparse, so the chapter uses multiple lenses
              instead of one headline TAM. The cleanest public floor is governed automation spend: UiPath alone reported
              $1.901 billion of ARR in 2026, demonstrating that large enterprises already budget at scale for
              orchestrated human-plus-software workflows. A second lens comes from AI data and evaluation
              infrastructure: Appen reports 50M+ platform hours, 20K+ AI projects, and 100M LLM data elements, while
              Invisible claims work with over 80% of the world’s top AI companies and points to frontier-lab evaluation
              and RL-environment demand. A third lens is workflow-level ROI, where case studies in finance, healthcare,
              and insurance show measurable savings or speed gains large enough to support recurring budgets. Taken
              together, those signals support a narrower 2026 SAM estimate of roughly $2.0 billion to $6.0 billion, with
              a $3.8 billion base case for expert-in-the-loop enterprise AI operations, evaluation, and RL-environment
              work. That range is intentionally conservative relative to broad generative-AI narratives because
              Invisible’s offering is delivery-intensive, integration-heavy, and constrained by expert supply.
