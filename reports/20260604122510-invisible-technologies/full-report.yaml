  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How Invisible's core operational and model risks can flow into customer, margin, financing, and thesis outcomes.
    data:
      nodes:
        - id: workflow_error
          label: Workflow error
          detail: Quality failure in claims, onboarding, or approval workflows
          tone: negative
        - id: privacy_failure
          label: Privacy or governance failure
          detail: Cross-border transfer, API, or service-provider control breakdown
          tone: negative
        - id: reg_action
          label: Regulatory inquiry
          detail: Customer, regulator, or procurement review escalates
          tone: warning
        - id: customer_loss
          label: Customer loss or slowed expansion
          detail: Reference accounts delay or reduce deployment scope
          tone: negative
        - id: margin_pressure
          label: Margin pressure
          detail: More human review and rework reduce leverage
          tone: risk
        - id: synthetic_shift
          label: Synthetic-data shift
          detail: Legacy training demand weakens faster than enterprise mix rises
          tone: warning
        - id: financing_pressure
          label: Financing pressure
          detail: Valuation support weakens and next round becomes harder
          tone: negative
        - id: thesis_break
          label: Investment thesis break
          detail: Control weakness and mix risk overwhelm growth narrative
          tone: negative
