      - number: '2.3'
        title: Buyers, budgets, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Invisible’s buyer map is unusually cross-functional. Training, evaluation, and RL-environment programs are
              typically initiated by CTO, chief AI, model, or product leaders who care about benchmark gaps, domain
              quality, and deployment readiness. Workflow-automation projects, by contrast, are usually justified by
              COO, shared-services, claims, onboarding, support, or compliance leaders who own throughput, error, and
              labor-cost KPIs. The adoption path that emerges from Invisible’s materials and case studies is not “buy
              model, then scale.” It begins with a high-friction workflow, moves into tightly scoped integration with
              legacy systems, validates against historical data, and only then expands into monitored production. That
              is why tool-first platforms and generic outsourcers remain viable substitutes for simple projects, but the
              higher-value opportunity sits where buyers need a vendor that can combine subject-matter expertise,
              workflow design, and measurable operational metrics. Customer proofs across asset management, healthcare,
              insurance, financial onboarding, multilingual model evaluation, and RAG tuning suggest the company’s most
              credible near-term market is the regulated and data-heavy slice of enterprise AI rather than broad SMB
              self-serve demand.
