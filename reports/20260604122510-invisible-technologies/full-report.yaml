              Public retention data are the weakest part of Invisible's customer file. There is no visible NRR, GRR,
              churn, renewal-rate, contract-length, or cohort disclosure, so the chapter cannot underwrite customer
              durability directly. That absence is not cosmetic; it is the main reason the customer chapter stops short
              of a high-conviction durability conclusion. If Invisible's revenue base is dominated by project work or by
              a few very large model-lab customers, the economics could look meaningfully weaker than the case-study
              narrative suggests.


              Still, the source set does offer second-best durability proxies. Getro describes daily work with 100% QC
              logging and biweekly account-manager calls. The delivery-platform case says Invisible became fully
              integrated with the customer's internal systems within 90 days and later processed 1.5 million unique data
              points monthly. The solar-provider case says the customer requested downstream support beyond the initial
              workflow, which is a classic land-and-expand signal. These are meaningful indicators of account depth and
              operating stickiness, but they are not substitutes for cohort metrics. The correct diligence posture is
              therefore to treat durability as plausible but under-documented, with formal retention, contract-term, and
              concentration data still required.
