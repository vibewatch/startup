      - number: '8.4'
        title: Recommendation, triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is RESEARCH-MORE with medium confidence, high risk, and a stretched valuation stance.
              That call is intentionally price-sensitive. The company has enough public proof to stay firmly in
              diligence: real revenue, real enterprise outcomes, a credible 2025 financing, and a product story that
              extends beyond simple annotation. But the same evidence also says the underwriting gap is still large.
              Invisible has not publicly shown the 2025/2026 revenue bridge, the software-vs-services gross-margin mix,
              concentration and renewal data, or the preference stack behind the headline valuation. Public AI and
              automation comps maintain investor-relations surfaces and filing cadences that Invisible does not yet
              match, so a near-term IPO lens is premature. The practical implication is simple: this is a name to keep
              warm only if diligence can verify that enterprise workflow growth is durable, margin expansion is real,
              and the 2025 round terms are clean. If those checks fail, the current mark should be treated as fragile
              rather than inspirational.
