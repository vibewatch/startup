  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Revenue Streams
        blocks:
          - type: paragraph
            body: >-
              Invisible's public materials support a blended revenue model rather than a clean SaaS or clean services
              archetype. Official pages market an end-to-end platform that combines data infrastructure, workflow
              design, evaluation tooling, and human experts, while Sacra describes the commercial package as
              operations-as-a-service sold around defined workflows and outcomes. That mix matters for underwriting:
              platform software can improve delivery leverage over time, but today the evidence still points to a
              business where monetization is tied to specific customer processes, annotation volumes, or monthly
              retainers rather than published seat pricing.


              The best-supported revenue-stream split is therefore between (1) AI training, RLHF, evaluation, and
              expert-validation work for model builders; and (2) enterprise workflow automation and custom solutions for
              large organizations that want AI embedded into legacy processes. Official case studies span financial
              research, healthcare claims, insurance operations, retail recruiting, and enterprise data onboarding,
              which suggests the company is monetizing both model-improvement work and business-process transformation.
              What remains missing is the most important underwriting layer: public materials do not disclose how much
              revenue comes from recurring platform subscriptions versus labor-backed project or managed-service work,
              nor do they show customer concentration or renewal terms.
