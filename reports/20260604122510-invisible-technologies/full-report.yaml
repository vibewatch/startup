      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Three structural drivers matter most for Invisible. First, enterprises and frontier labs are moving beyond
              pre-training toward custom evaluation, post-training, and agent workflows, which raises demand for expert
              data, graders, and RL environments. Second, real buyer value is increasingly created inside messy
              operational systems rather than in isolated demos, favoring vendors that can combine deployment
              engineering with humans-in-the-loop. Third, regulation is making governance a commercial requirement: the
              EU AI Act hardens expectations around logging, documentation, human oversight, and transparency, while
              U.S. state rules continue to multiply around employment, training-data disclosure, and high-risk uses.
              Those same forces create the main headwinds. Custom evaluation and RL environments are expert-supply
              constrained; badly specified reward functions and graders can destroy ROI; and buyers face expanding
              compliance, vendor-oversight, and AI-washing concerns. For valuation, this means the opportunity is real
              and likely multi-billion, but revenue durability depends on Invisible proving that it can turn bespoke
              projects into repeatable, governed programs rather than remaining a services-heavy point-solution vendor.
