      - number: '7.4'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Invisible is executing several difficult transitions at once. In a short window the company changed CEOs,
              doubled engineering, expanded offices across New York, San Francisco, Washington, D.C., and London,
              launched a dedicated public-sector motion, and added an acquisition that has to be integrated into the
              core platform. None of those moves is inherently negative. In fact, Fitzpatrick's enterprise-AI background
              is one of the clearer mitigants in the file. The risk comes from concurrency. A 350-person organization
              with a distributed agent model has to scale management systems, not just hire talent, and the control
              burden rises further when workflows span regulated industries and government buyers.


              The public record suggests Invisible understands the need for rigor, but it does not yet prove durable
              operating cadence. The same sources that support optimism also imply execution stretch: capital is being
              spent on software modules and leadership expansion, modern-slavery oversight relies on annual reviews and
              vendor onboarding, and WeCP integration will require product, culture, and go-to-market alignment.
              Public-sector expansion raises the bar again because security reviews and procurement cycles are less
              forgiving than private pilot work. This is not a crisis profile, but it is a company that still needs to
              convert rapid organizational change into repeatable control evidence.
            claimRefs:
              - CR003
