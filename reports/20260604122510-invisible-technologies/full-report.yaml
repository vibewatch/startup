  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current financial bridge
        - Board-approved 2025 actuals, 2026 run-rate, and growth bridge from the public 2024 base
        - >-
          Without a current denominator the latest valuation cannot be translated into a real entry multiple or return
          case
        - CEO, CFO, and monthly board deck
      - - Margin architecture
        - Gross-margin waterfall split by software modules, expert work, and managed-service delivery
        - >-
          The central valuation debate is whether Invisible is becoming software-led or staying structurally
          labor-assisted
        - FP&A, product finance, and segment profitability cut
      - - Demand quality
        - >-
          Top-10 customer concentration, renewals, NRR or cohort retention, and mix by AI labs versus enterprise
          workflows
        - >-
          Growth is more valuable if it is diversified and sticky rather than dependent on volatile labeling programs or
          a few large accounts
        - Revenue operations and customer success analytics
      - - Cap table and downside protection
        - >-
          Share classes, liquidation preferences, participation rights, warrants, and any side letters from the 2025
          financing
        - >-
          The headline valuation is not enough if common-equity economics are materially worse than the post-money
          implies
        - Lead counsel and finance operations
      - - Governance readiness
        - AI governance framework, vendor-oversight controls, and documentation used for regulated enterprise buyers
        - Governance is increasingly part of the sales moat and a prerequisite for a credible premium multiple
        - Chief legal officer, compliance lead, and audit pack
      - - Exit map
        - Strategic buyer map, sponsor appetite, and milestones for any eventual public-company readiness
        - A stretched entry can still work if exit optionality is real and time-bounded
        - CEO, board materials, and banker references
    notes: >-
      Each ask ties directly to a recommendation-moving variable. None are cosmetic requests; they are the missing files
      most likely to change price discipline or break the thesis.
