      - number: '6.5'
        title: Customer Judgment
        blocks:
          - type: paragraph
            body: >-
              As of 2026-06-04, Invisible clears the most important first customer hurdle: there is enough named and
              quantified public proof to reject the idea that demand is purely notional. The company shows real adoption
              across multiple verticals, can point to at least several named customers, and repeatedly frames customer
              value in operational outcomes rather than vague transformation language. That matters because it suggests
              the product or service is landing inside real workflows with measurable consequences.


              The limiting factor is durability transparency, not adoption visibility. Public sources do not disclose
              customer count, concentration, contract terms, NRR, GRR, or cohort outcomes. The chapter therefore
              supports a positive-but-incomplete customer view: adoption is genuine, expansion inside accounts appears
              plausible, and concentration/retention remain the largest unresolved questions. An investor can lean
              constructive on customer traction, but cannot honestly call the customer base fully underwritten without
