        - label: Market relevance
          value: 4
          note: Governed enterprise AI adoption remains a real spending priority
        - label: Moat durability
          value: 3
          note: Synthetic-data risk and competition keep moat confidence moderate
        - label: Economics visibility
          value: 1.5
          note: No public gross-margin, retention, or concentration data
        - label: Exit readiness
          value: 2
          note: Strategic or private exit is likelier than near-term public readiness
        - label: Valuation discipline
          value: 2
          note: Current price already absorbs a lot of optimism without enough downside detail
    approximationNotes: >-
      Scores are directional judgment aids, not a mechanical model. Lower values mostly reflect evidence gaps and price
      risk rather than denial of business quality.
