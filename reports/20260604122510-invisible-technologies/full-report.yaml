      - number: '3.3'
        title: Switching costs, multi-homing, and buyer fit
        blocks:
          - type: paragraph
            body: >-
              Invisible’s public story suggests that competitive durability will come from embedded operations rather
              than from model lock-in. The company says customer data stays in customer systems and that its stack is
              model-agnostic, which is attractive to cautious enterprises but also means the moat has to be earned
              elsewhere. The likely sources are workflow design, historical validation data, domain experts, and change
              management. There is real evidence that those elements can matter after deployment: the Nasdaq case study
              cites a 63% reduction in onboarding time and more than 10,000 developer hours saved. But pre-deployment
              competition still looks intense. Labelbox can appeal to a team that wants a faster self-serve evaluation.
              Appen can appeal to buyers that prioritize scale and global coverage. TaskUs can fit existing outsourcing
              budgets. UiPath can ride an enterprise automation roadmap and installed-base credibility. Invisible
              therefore looks strongest when the workflow needs expert judgment plus sustained operational ownership,
              and weakest when the buyer mostly wants a familiar procurement lane, a seat-based tool, or a narrow
              annotation factory.
