  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      How real operating proof, labor-assisted economics, disclosure gaps, and multiple discipline combine into a
      RESEARCH-MORE call.
    data:
      nodes:
        - id: proof
          label: 'Proof: $134M revenue, 2025 funding, measurable customer ROI'
          type: input
        - id: platform
          label: 'Platform breadth: modular software plus expert workflows'
          type: input
        - id: economics
          label: 'Constraint: labor-assisted economics and limited public KPIs'
          type: input
        - id: market
          label: 'Market frame: applied AI multiples normalize toward software benchmarks'
          type: input
        - id: valuation
          label: 'Current mark: >14.9x trailing revenue at >$2B valuation'
          type: process
        - id: recommendation
          label: 'Recommendation: RESEARCH-MORE, medium confidence, high risk'
          type: output
        - id: upgrade
          label: Upgrade only if diligence proves stronger forward growth, margin mix, and clean terms
          type: output
      edges:
        - from: proof
          to: valuation
        - from: platform
          to: valuation
        - from: economics
          to: valuation
        - from: market
          to: valuation
        - from: valuation
          to: recommendation
        - from: recommendation
          to: upgrade
    approximationNotes: >-
      This is decision logic, not a deterministic model. It shows which pieces of evidence move the recommendation at
      the current price.
