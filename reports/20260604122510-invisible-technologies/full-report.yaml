      - number: '1.4'
        title: Chronology and open risks
        blocks:
          - type: paragraph
            body: >-
              The public milestone record shows a company changing shape quickly, but not without diligence flags. The
              chronology begins with 2015 founding roots and a 2020 pandemic-era scaling story that demonstrates why
              Invisible became known for operational execution before enterprise AI was fashionable. In 2024, the
              company both launched public-sector operations and gained external growth recognition through Deloitte’s
              Fast 500 ranking. In January 2025, it swapped CEOs, and by September 2025 it had raised a large growth
              round, expanded disclosed board membership, and started framing itself as enterprise AI infrastructure
              rather than only AI training operations. The March 2026 WeCP acquisition reinforces that trajectory
              because it adds expert-evaluation tooling and interview data directly relevant to high-precision
              validation workflows.

              The clearest public adverse item is the California class action complaint filed in November 2023, which
              alleges overtime, break, wage-statement, expense, and paid-sick-leave violations. That litigation does not
              by itself prove liability, but it means workforce-practice diligence cannot rely on the company narrative
              alone. Compounding that risk, the Indeed reviews page and BBB complaints page were blocked by verification
              walls in this run, and Crunchbase/PitchBook did not provide usable structured data. As a result, current
              worker sentiment, exact headcount, and fine-grained financing terms remain less verified than funding
              headline, revenue, or leadership facts.
