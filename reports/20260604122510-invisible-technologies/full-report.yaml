              into adjacent-market entry motions.


              The risk side is just as important. The over-80%-of-top-AI-companies narrative is strategically
              impressive, but it could also mean a small number of outsized AI-lab or hyperscale buyers matter
              disproportionately to revenue. Meanwhile, the company provides no public customer count, no top-customer
              concentration data, and no segment-level revenue mix. That makes it impossible to tell whether the public
              proof set represents a wide base of paying accounts or a marketing layer on top of a few flagship logos.
              The safest interpretation is that expansion potential is real, but concentration is a live underwritten
