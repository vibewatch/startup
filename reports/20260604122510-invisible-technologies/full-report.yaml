      - number: '7.2'
        title: Operational, Security, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              Invisible has real operational proof, but that proof cuts both ways. The company says forward-deployed
              engineers connect customer legacy systems and operational databases to its platform, and that production
              deployments track throughput, error rates, resource efficiency, and cost per transaction with audit-ready
              documentation. That is the language of operational ownership, not lightweight software assistance. The
              case studies reinforce the point: Invisible is touching insurance claim approvals, healthcare validation,
              finance onboarding, expert financial QA, and enterprise model evaluation. When a company works that close
              to live operational flows, the main risk is no longer whether AI can create value at all. It is whether
              quality assurance, exception handling, and control evidence stay strong enough once workflows scale across
              more sectors and more counterparties.


              Public mitigants exist. Invisible markets continuous evaluation, red-teaming, expert networks, and human
              oversight, and Boosted.ai explicitly says the workflow would not work without human review. Those controls
              matter. The residual issue is transparency. No retained public source names a third-party security
              auditor, discloses an incident log, or confirms authorization scope for public-sector work. The
              International AI Safety Report frames exactly this problem: agentic and general-purpose systems need
              governance that is monitored, not merely asserted. For investors, the operational risk case is therefore
              moderate-to-high severity with decent design intent but incomplete external proof of control
              effectiveness.
