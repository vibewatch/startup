  - id: TV005
    title: Thesis-break triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Forward revenue bridge disappoints
        - 2025 actuals or 2026 run rate fail to show a material step-up from the public $134M 2024 base
        - >-
          The valuation would stop looking like a premium data-intelligence mark and start looking like a stale
          late-stage price
        - Reset the case toward bear values and stop treating the latest round as a defensible anchor
      - - Gross-margin mix stays labor-heavy
        - Management cannot show software-led gross-margin expansion or contribution margin improving with scale
        - The anti-thesis that this is still primarily a labor-assisted service model would dominate
        - Downgrade the multiple framework toward public-software or tech-enabled-services bands
      - - Enterprise pivot fails to outrun RLHF commoditization
        - Model-builder work remains the dominant engine while synthetic-data substitution erodes pricing power
        - The core strategic pivot underpinning the bull case would be unproven
        - Treat the name as structurally exposed to legacy data-labeling compression
      - - Governance or vendor-control gaps surface
        - >-
          Diligence reveals weak AI governance, vendor oversight, or documentation relative to enterprise buyer
          expectations
        - The company would lose one of the strongest arguments for premium enterprise positioning
        - Pause underwriting until controls are remediated and validated
      - - Exit path remains opaque
        - >-
          Management cannot show a credible strategic-sale, sponsor, or eventual-public readiness path with measurable
          milestones
        - Even a defendable business could still deliver poor returns at the current price
        - Keep the name in research-more status rather than advancing to IC-ready underwriting
    notes: >-
      These triggers focus on measurable thresholds that would change price discipline quickly. They are designed to
      stop rationalization, not to decorate the memo with generic risks.
