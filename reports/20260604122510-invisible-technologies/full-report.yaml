  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Invisible's legal exposure starts with the company's own published control perimeter. The March 2026
              privacy policy says Invisible outsources business processes to human agents, processes personal
              information from both clients and agents, may use automated decision-making or profiling technology, and
              may share data with service providers, business partners, APIs or SDKs, affiliates, and transaction
              counterparties. That is not unusual for a workflow-automation platform, but it matters because Invisible's
              product pages and case studies place the company inside claim approvals, W9 processing, insurance
              validation, finance onboarding, and government modernization work rather than low-stakes sandbox use
              cases. In other words, the company is not just selling abstract model tooling; it is operating near real
              workflows where privacy, fairness, and notice obligations matter.


              External legal context makes that exposure sharper in 2026. The EU AI Act requires human oversight,
              post-market monitoring, and incident reporting for high-risk systems, while its transparency obligations
              come into force in August 2026. Baker Botts describes a simultaneous US state-law patchwork across
              California, Texas, Illinois, and Colorado, and multiple legal commentaries flag workplace-AI
              discrimination, privacy, and surveillance risk. Alvarez & Marsal adds an adjacent enforcement vector:
              AI-washing and disclosure scrutiny. Invisible's annual modern-slavery and vendor-risk disclosures are
              constructive mitigants, but they also confirm a distributed labor-and-supplier model that needs ongoing
              diligence rather than blind trust.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
