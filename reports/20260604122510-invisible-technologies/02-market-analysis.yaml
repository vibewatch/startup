company:
  name: Invisible Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: 'Invisible Technologies sells into a narrower and more valuable slice of AI than generic generative-AI or factory-floor-vision narratives imply: enterprise AI operations, custom evaluation, and RL-environment / post-training work embedded in regulated workflows. Public comparables show real budget depth in governed automation and AI-data infrastructure, but Invisible’s practical serviceable market is the subset where subject-matter expertise, workflow integration, and auditability matter more than commodity labeling or simple tooling. Demand is strong, yet adoption and valuation depend on turning bespoke projects into repeatable governed programs.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: 'Invisible Technologies should be framed against enterprise AI operations, AI training and evaluation, and workflow automation budgets — not against the factory-floor vision market served by invisible.ai or the full generative-AI infrastructure stack. The company’s own materials consistently define the product as modular deployment around data, agents, humans-in-the-loop, and evaluation systems tied to real operational outcomes, while the RL-environment offer is explicitly organized around enterprise tasks such as accounting, banking, legal, and compliance. That makes the closest substitutes a mixed set: annotation-first vendors like Appen and Labelbox, orchestration software such as UiPath, and outsourced-digital-services providers like TaskUs. It also means large pools of generic server spend, hyperscaler capex, and unrelated computer-vision deployments should be excluded from the market boundary. The key analytical consequence is that Invisible is competing for workflow budgets
    where correctness, auditability, and human escalation matter more than raw model access or commodity labeling throughput.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-lenses-and-estimated-market-range
  title: Sizing lenses and evidence-constrained market estimate
  body: 'Public market-size data for Invisible’s exact niche are sparse, so the chapter uses multiple lenses instead of one headline TAM. The cleanest public floor is governed automation spend: UiPath alone reported $1.901 billion of ARR in 2026, demonstrating that large enterprises already budget at scale for orchestrated human-plus-software workflows. A second lens comes from AI data and evaluation infrastructure: Appen reports 50M+ platform hours, 20K+ AI projects, and 100M LLM data elements, while Invisible claims work with over 80% of the world’s top AI companies and points to frontier-lab evaluation and RL-environment demand. A third lens is workflow-level ROI, where case studies in finance, healthcare, and insurance show measurable savings or speed gains large enough to support recurring budgets. Taken together, those signals support a narrower 2026 SAM estimate of roughly $2.0 billion to $6.0 billion, with a $3.8 billion base case for expert-in-the-loop enterprise AI operations,
    evaluation, and RL-environment work. That range is intentionally conservative relative to broad generative-AI narratives because Invisible’s offering is delivery-intensive, integration-heavy, and constrained by expert supply.'
