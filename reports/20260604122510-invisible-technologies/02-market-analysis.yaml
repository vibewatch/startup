  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Customer pricing bands, statement-of-work examples, and pricing logic by workflow type for automation, evaluation, and RL-environment programs.
    whyItMatters: Without pricing transparency, the chapter can bracket SAM qualitatively but cannot isolate which portions of buyer value accrue to software, managed services, or expert labor.
    diligencePath: Request anonymized order forms or SOW samples by workflow, including seat-based, usage-based, and project-based pricing structures.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: pilot-conversion
    missingEvidence: Cohort data showing how often Invisible converts pilot projects into recurring multi-workflow programs and how expansion behaves after the first use case.
    whyItMatters: SOM depends more on conversion and expansion than on raw TAM because Invisible’s offering is delivery-intensive and multi-stakeholder.
    diligencePath: Ask management for pilot-to-production conversion, net retention, and multi-workflow expansion metrics segmented by buyer archetype.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Current revenue or bookings mix across frontier labs, enterprise operations automation, evaluation projects, and recurring platform usage.
    whyItMatters: The market thesis changes if growth is concentrated in frontier-lab post-training budgets rather than durable enterprise workflow spend.
    diligencePath: Request revenue mix, pipeline composition, and concentration metrics by end-market, customer size, and contract type.
    relatedQuestionRefs:
    - QM026
