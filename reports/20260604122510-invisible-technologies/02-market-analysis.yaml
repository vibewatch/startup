    - Workflow automation, data ingestion, exception handling, human review, and monitored outputs tied to operating KPIs
    - Generic cloud compute, unrelated SaaS modules, and non-workflow AI experimentation
    - COO, shared-services leader, operations VP, business-unit owner
    - Core Invisible wedge for back-office, onboarding, claims, and support workflows
  - - AI training and RLHF services
    - Expert data generation, multilingual training, multimodal labeling, red-teaming, and post-training evaluation
    - Commodity click-work, undifferentiated synthetic data only, or general model hosting
    - CTO, chief AI officer, model/product leader
    - Core Invisible wedge for frontier labs and enterprise model teams
  - - Enterprise RL environments
    - Workflow simulations, verifiable rewards, graders, trajectories, and replayable runs for agent training
    - Consumer chatbots, generic benchmarks, and factory-floor vision pilots unrelated to Invisible’s named workflows
    - Model research lead, applied AI lead, innovation budget owner
    - Emerging but strategically important Invisible category
  - - Tool-first data and evaluation platforms
    - Annotation tooling, evaluation UIs, managed reviewers, model-assist features
    - End-to-end workflow redesign, deep legacy-system integration
    - ML platform team, research operations, procurement
    - Substitute in simpler or earlier-stage programs
  - - Status-quo substitutes
    - BPOs, internal operations teams, conventional automation suites, and manual expert review
    - Net-new AI-specific budgets that do not displace an existing workflow cost center
    - Operations, customer-experience, and IT budget owners
    - Invisible often sells by displacing this incumbent spend rather than by creating wholly new budget lines
  notes: Boundary intentionally excludes invisible.ai’s manufacturing-vision category and broader AI infrastructure capex; the focus is enterprise workflows, post-training, and governed deployment spend relevant to Invisible Technologies.
