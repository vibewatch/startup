- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Shift from pre-training to post-training and custom evals
    - Tailwind
    - Now-2028
    - Increases demand for expert data, graders, RL environments, and evaluation services
    - Ask management what share of new pipeline is eval/post-training versus basic data work
  - - Enterprise demand for measurable workflow ROI
    - Tailwind
    - Now-2028
    - Favors vendors that can connect models to legacy systems and ops KPIs instead of selling generic pilots
    - Request cohort data on first-workflow ROI and expansion into second and third workflows
  - - Regulatory hardening under the EU AI Act and U.S. state laws
    - Tailwind for governed vendors / headwind for buyers
    - 2026-2028
    - Raises buyer need for logging, oversight, disclosures, and vendor governance but also lengthens sales cycles
    - Request evidence of policy, audit, and documentation tooling used in active deployments
  - - Expert-supply bottleneck in RL environments and domain-heavy tasks
    - Headwind
    - Now-2028
    - Limits how fast Invisible or peers can scale high-quality delivery even if demand expands
    - Validate expert-network depth by domain, language, and exclusivity model
  - - Reward hacking, grading failure, and sim-to-real mismatch
    - Headwind
    - Immediate
    - Poor pipeline design can destroy ROI and make pilots fail before production
    - Ask for verifier calibration methods, adversarial testing, and rollback metrics
  - - Market fragmentation across tools, BPOs, automation suites, and custom integrators
    - Mixed
    - Immediate
    - Creates room for Invisible’s hybrid positioning but makes category education and sales narratives harder
    - Request win/loss data against Appen, Labelbox, UiPath, TaskUs, and internal build
  notes: Direction is from Invisible’s perspective. Tailwind means demand should expand; headwind means deployment becomes harder or more expensive; mixed means it creates both demand and friction.
