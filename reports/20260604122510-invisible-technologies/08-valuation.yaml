  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-bridge
    missingEvidence: Board-approved 2025 actuals, 2026 run-rate, and software-vs-services gross-margin waterfall.
    whyItMatters: Base-case returns at the current valuation are highly sensitive to whether Invisible has already grown past the last public 2024 revenue base with better software-led economics.
    diligencePath: Request monthly board deck, FP&A bridge, and gross-margin cut by product family before advancing the recommendation.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Latest cap table, share classes, liquidation preferences, participation rights, and any side letters from the 2025 round.
    whyItMatters: The headline post-money value can diverge sharply from common-equity value if downside protection or participation rights are unusually investor-friendly.
    diligencePath: Obtain counsel-certified financing docs and recut entry pricing from common-equity economics rather than the headline valuation.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-10 customer concentration, renewal data, NRR or cohort retention, and mix by AI labs versus enterprise workflows.
    whyItMatters: Growth is more valuable if it is diversified and sticky rather than dependent on a narrow set of volatile model-builder programs or a few oversized accounts.
    diligencePath: Request customer cohort analysis, concentration tables, and renewal metrics split between enterprise workflow and model-builder revenue.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: thesis-break-monitoring
    missingEvidence: A management KPI pack tying growth, margin mix, governance controls, and exit milestones to concrete thresholds.
    whyItMatters: The recommendation depends on being able to stop underwriting quickly if growth slows, margins fail to expand, or governance readiness lags.
    diligencePath: Ask management for a milestone dashboard with revenue, gross margin, concentration, hiring, and governance KPIs that can be tracked quarterly.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: TV004 comparable-set coverage remains partial because free direct public comps for enterprise AI workflow operators are limited
    missingEvidence: A fuller like-for-like comp set with direct public or transaction-level valuation and margin data for enterprise AI workflow operators.
    whyItMatters: The current comp table mixes direct private references with model-appropriate benchmarks because transparent public peers remain scarce, which limits precision on the acceptable multiple range.
    diligencePath: Use management disclosures, banker comparables, and paid market-data tools to expand the comp set before final price negotiation.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
    - TV006
