- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Uses retained direct private comps, sector benchmarks, and model-appropriate public disclosure references. Direct like-for-like public comps for enterprise AI workflow operators remain limited in the reviewed free source set.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Invisible current mark
    - $134M 2024 revenue; >$2B 2025 valuation
    - '>14.9x trailing revenue implied'
    - Direct object of the underwrite
    - Uses a stale public denominator and unknown preference stack
  - - Scale AI
    - ~$1.5B ARR and $25B valuation per Sacra
    - ~16.7x revenue
    - Closest retained private reference for a premium AI data / alignment business
    - More frontier-lab exposure and stronger scarcity narrative than Invisible
  - - Mercor
    - ~$50M revenue run rate and $2B valuation per Sacra
    - ~40x revenue
    - Shows how high the market can price AI platforms with software-like growth and talent-network leverage
    - Much lighter operating model and much earlier scale make it an upper-bound, not a true peer
  - - Large-transaction AI median
    - Aventis sample of large AI capital raises and M&A
    - 24.2x median revenue multiple
    - Useful upper-bound market benchmark for late-stage AI financing
    - Skewed toward larger winners and fundraising marks rather than realistic new-money entry discipline
  - - Applied AI / public-software benchmark
    - Aventis + Finro view of late-2025 benchmarks
    - AI fundraising ~25x-30x, but public SaaS ~6x and applied niches normalize toward software
    - Useful sanity check for how far Invisible can stretch before it becomes hard to defend
    - Sector benchmark, not a direct company comp
  - - UiPath / Appen disclosure benchmark
    - UiPath discloses $1.901B ARR and 109% DBNRR; Appen discloses 1M+ contributors and 10B units processed
    - Public or scaled disclosure comps with richer KPI surfaces than Invisible
    - Helpful for judging exit readiness and what mature buyers can already compare against
    - Retained sources do not give clean EV/revenue marks for both names in the same snapshot
  notes: The comp set mixes direct private references with model-appropriate benchmarks because enterprise AI workflow operators rarely disclose enough public data to produce a clean like-for-like grid.
