- id: scenario-range-and-return-logic
  title: Scenario range and return logic
  body: 'Because the last clean public revenue anchor is 2024, the scenario work must be explicit about what is observed and what is assumed. The observed anchors are straightforward: 2024 revenue of $134 million, an implied trailing multiple above 14.9x at the latest round, an 11% EBITDA estimate from Sacra, a labor-heavy operating footprint, and market evidence that applied AI is now priced closer to software benchmarks than to frontier-model extremes. Those facts point to asymmetric return math at the current entry. A bear case where growth stalls and the market compresses toward 6x-9x revenue produces clear downside to the latest mark. A base case where Invisible keeps growing into enterprise workflows and sustains a low-teens multiple can roughly defend the headline valuation, but does not obviously generate venture-style returns. Only the bull case—where 2025/2026 revenue meaningfully outruns the stale public base and software-led margins improve—creates clearly attractive upside.
    In other words, the current price may be survivable, but it is not forgiving.'
