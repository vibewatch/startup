- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue assumption
  - Multiple logic
  - Indicative value / gross MOIC
  - Probability signal
  - Main downside / upside trigger
  rows:
  - - Bear
    - $150M-$170M revenue base
    - 6x-9x revenue, closer to applied-software and tech-enabled-services outcomes if growth normalizes and mix stays labor-heavy
    - $0.90B-$1.53B / ~0.4x-0.8x versus a >$2B entry
    - '~30%: plausible if enterprise mix stalls or the market compresses toward software-like multiples'
    - Synthetic-data substitution, weak margin expansion, or a customer-mix surprise
  - - Base
    - $180M-$210M revenue base
    - 10x-14x revenue, assuming enterprise workflows keep compounding and the business holds a premium to public software without proving frontier-like scarcity
    - $1.80B-$2.94B / ~0.9x-1.4x
    - '~50%: best fit with the current public evidence'
    - Needs a clean 2025/2026 bridge, decent software contribution margin, and no ugly preference overhang
  - - Bull
    - $220M-$260M revenue base
    - 14x-18x revenue, assuming stronger software mix, durable enterprise retention, and continued premium pricing for data-intelligence enablers
    - $3.08B-$4.68B / ~1.5x-2.3x
    - '~20%: requires execution that the current public record does not yet prove'
    - Enterprise scale-out, margin inflection, and clean financing terms combine to support a premium exit path
  notes: The ranges are indicative, not precise forecasts. They intentionally show how little new-money upside is visible without a current revenue bridge and a better margin mix than the public record proves today.
