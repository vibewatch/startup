- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Enterprise workflow proof is real'
    - Headway, Nasdaq, the insurer, and Boosted.ai all show measurable operating or cost outcomes, not just aspirational pilots
    - The thesis would weaken if customer concentration turns out to be high or measured deployments fail to renew
  - - 'THESIS: The platform is broader than a labor marketplace'
    - Invisible describes five modular layers plus model-agnostic deployment, and official product pages show data, workflow, evaluation, and orchestration capability
    - A stronger view would require evidence that software modules drive gross-margin expansion independent of expert labor
  - - 'THESIS: The current mark is not as extreme as top private AI outliers'
    - Invisible screens below Mercor and slightly below Scale AI on retained multiple anchors
    - The view improves only if new revenue disclosure shows the actual current multiple is already lower than the trailing 2024 math
  - - 'ANTI-THESIS: Economics still look labor-assisted'
    - Sacra's 3,000+ agent footprint and ~11% EBITDA estimate suggest a delivery engine that has not yet become software-pure
    - This concern eases if management can show software-led gross margins and operating leverage by product line
  - - 'ANTI-THESIS: Legacy RLHF and labeling demand can commoditize'
    - Sacra warns that model labs are moving toward synthetic data, which reduces the value of a pure training-data wedge
    - The concern eases if enterprise workflow revenue is now clearly the dominant growth engine
  - - 'ANTI-THESIS: The public denominator is stale and the term sheet is hidden'
    - No public ARR, NRR, concentration, or preference stack is disclosed, even though the valuation step-up is large
    - A current board pack and clean financing docs would move the recommendation most quickly
  notes: The table separates company-quality arguments from price-quality arguments. The business can be strong while the current entry still fails a new-money return test.
