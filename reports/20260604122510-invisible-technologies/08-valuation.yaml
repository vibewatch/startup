- id: TV005
  title: Thesis-break triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Forward revenue bridge disappoints
    - 2025 actuals or 2026 run rate fail to show a material step-up from the public $134M 2024 base
    - The valuation would stop looking like a premium data-intelligence mark and start looking like a stale late-stage price
    - Reset the case toward bear values and stop treating the latest round as a defensible anchor
  - - Gross-margin mix stays labor-heavy
    - Management cannot show software-led gross-margin expansion or contribution margin improving with scale
    - The anti-thesis that this is still primarily a labor-assisted service model would dominate
    - Downgrade the multiple framework toward public-software or tech-enabled-services bands
  - - Enterprise pivot fails to outrun RLHF commoditization
    - Model-builder work remains the dominant engine while synthetic-data substitution erodes pricing power
    - The core strategic pivot underpinning the bull case would be unproven
    - Treat the name as structurally exposed to legacy data-labeling compression
  - - Governance or vendor-control gaps surface
    - Diligence reveals weak AI governance, vendor oversight, or documentation relative to enterprise buyer expectations
    - The company would lose one of the strongest arguments for premium enterprise positioning
    - Pause underwriting until controls are remediated and validated
  - - Exit path remains opaque
    - Management cannot show a credible strategic-sale, sponsor, or eventual-public readiness path with measurable milestones
    - Even a defendable business could still deliver poor returns at the current price
    - Keep the name in research-more status rather than advancing to IC-ready underwriting
  notes: These triggers focus on measurable thresholds that would change price discipline quickly. They are designed to stop rationalization, not to decorate the memo with generic risks.
  claimRefs:
  - CV035
  - CV036
  - CV037
  - CV040
  - CV043
  - CV044
  - CV045
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current financial bridge
    - Board-approved 2025 actuals, 2026 run-rate, and growth bridge from the public 2024 base
    - Without a current denominator the latest valuation cannot be translated into a real entry multiple or return case
    - CEO, CFO, and monthly board deck
  - - Margin architecture
    - Gross-margin waterfall split by software modules, expert work, and managed-service delivery
    - The central valuation debate is whether Invisible is becoming software-led or staying structurally labor-assisted
    - FP&A, product finance, and segment profitability cut
  - - Demand quality
    - Top-10 customer concentration, renewals, NRR or cohort retention, and mix by AI labs versus enterprise workflows
    - Growth is more valuable if it is diversified and sticky rather than dependent on volatile labeling programs or a few large accounts
    - Revenue operations and customer success analytics
  - - Cap table and downside protection
    - Share classes, liquidation preferences, participation rights, warrants, and any side letters from the 2025 financing
    - The headline valuation is not enough if common-equity economics are materially worse than the post-money implies
    - Lead counsel and finance operations
  - - Governance readiness
    - AI governance framework, vendor-oversight controls, and documentation used for regulated enterprise buyers
    - Governance is increasingly part of the sales moat and a prerequisite for a credible premium multiple
    - Chief legal officer, compliance lead, and audit pack
  - - Exit map
    - Strategic buyer map, sponsor appetite, and milestones for any eventual public-company readiness
    - A stretched entry can still work if exit optionality is real and time-bounded
    - CEO, board materials, and banker references
  notes: Each ask ties directly to a recommendation-moving variable. None are cosmetic requests; they are the missing files most likely to change price discipline or break the thesis.
