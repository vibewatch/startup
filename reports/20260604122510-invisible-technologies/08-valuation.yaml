tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  rows:
  - - Recommendation
    - RESEARCH-MORE — keep engaged only if private diligence can either de-risk the price or reveal a lower effective entry
    - Public evidence proves scale and customer value, but not enough current financial detail to underwrite the latest mark
  - - Confidence
    - Medium
    - Round, revenue, and customer proof are well corroborated, but cap-table, retention, and gross-margin visibility are still missing
  - - Risk rating
    - High
    - The company is real, but the combination of multiple compression risk, labor intensity, governance scrutiny, and missing terms leaves little room for error
  - - Valuation stance
    - Stretched on public evidence
    - A >14.9x trailing multiple is defensible only if current revenue, margin mix, and enterprise durability have improved materially since the last public revenue anchor
  - - Return / hold lens
    - At the current mark, base-case gross MOIC looks roughly 0.9x-1.4x over a 3-5 year hold on public assumptions
    - That is below the usual target for a late-stage venture-style entry unless private diligence proves much stronger forward economics
  - - Decision implication
    - Require a revenue bridge, margin waterfall, concentration data, and round terms before moving beyond watchlist diligence
    - Without those files the headline valuation can be directionally correct for the business yet still unattractive for new money
  notes: The recommendation is intentionally price-sensitive. It evaluates whether the current public evidence supports the latest mark, not whether Invisible is an impressive company in the abstract.
