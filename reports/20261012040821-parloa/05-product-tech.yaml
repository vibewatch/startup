figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-layer architectural stack of Parloa AMP spanning telephony ingestion, speech processing, core orchestration,
      cognitive reasoning, enterprise integration, and governance.
    data:
      layers:
        - label: 'Layer 1: Telephony & Omnichannel Ingestion'
          detail: >-
            Manages SIP trunking, WebRTC streaming, and multi-channel routing across voice, WhatsApp, and Microsoft
            Teams.
        - label: 'Layer 2: Real-Time Audio & Speech Pipeline'
          detail: Streaming STT and neural TTS components supporting over 130 languages with swappable engine modularity.
        - label: 'Layer 3: Agent Management Platform (AMP) Core'
          detail: Stateful dialog engine, Parloa Studio no-code authoring, Agent Composition, and conversational memory.
        - label: 'Layer 4: Cognitive Reasoning & Frontier Models'
          detail: >-
            Context evaluation, prompt orchestration, and inference execution utilizing OpenAI GPT-5.4 and multi-model
            routing.
        - label: 'Layer 5: Enterprise Integration & Data Connectors'
          detail: Pre-built connectors to SAP Service Cloud, Salesforce, Five9, Genesys, Zendesk, and core ERP databases.
        - label: 'Layer 6: Security, Compliance & Observability'
          detail: >-
            Real-time analytics dashboards, conversation simulation suite, SOC 2, HIPAA, and EU AI Act governance
            controls.
    approximationNotes: >-
      Logical architectural layers synthesized from vendor technical disclosures, partner announcements, and third-party
