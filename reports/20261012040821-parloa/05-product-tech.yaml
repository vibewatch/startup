callouts:
  - calloutType: insight
    title: Decoupled Management Layer as an Architectural Moat
    body: >-
      Parloa's core strategic thesis is that large enterprises require an independent agent management layer separate
      from both underlying model providers and contact center telephony vendors. By integrating with Microsoft Azure,
      OpenAI, SAP, and multiple CCaaS systems, Parloa avoids lock-in while providing centralized governance. However,
      this positioning creates profound operational dependencies on third-party cloud infrastructure and LLM
      availability.
    claimRefs:
      - CE004
      - CE009
  - calloutType: risk
    title: Opaque Voice Response Latency and SLA Benchmarks
    body: >-
      Real-time enterprise voice automation demands sub-second roundtrip turn-taking latency to prevent unnatural pauses
      and user frustration. Parloa does not publish formal response-time benchmarks or uptime SLAs, meaning prospective
      buyers must rigorously benchmark audio streaming speeds and failover reliability across their specific telephony
      carriers during pilot testing.
    claimRefs:
      - CE012
      - CE013
