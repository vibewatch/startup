    title: "Thesis-Break Triggers and Monitoring Indicators"
    body: "Key diligence tripwires include any loss of SAP Endorsed App status, gross margin erosion below traditional SaaS standards resulting from unoptimized LLM token costs, or regulatory enforcement actions under the emerging EU AI Act governance regime."
    claimRefs:
      - "CR004"
      - "CR011"
      - "CR013"
