  - calloutType: "risk"
    title: "Hyperscaler and Platform Commoditization Threat"
    body: "While Parloa positions AMP as an independent orchestration layer, major enterprise software incumbents such as SAP, Microsoft, and Salesforce have clear incentives to absorb conversational CX workflows natively into their platforms, creating severe long-term commoditization risk for pure-play middleware."
    claimRefs:
