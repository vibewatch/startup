        - 'Feature absorption: major CRM and CCaaS platforms embed native voice agents'
        - SAP Service Cloud adoption rates vs. native Salesforce Agentforce penetration
      - - Distribution Moat
        - Strategic co-selling with SAP, Microsoft, and global BPOs accelerates enterprise reach
        - Distribution partner concentration and platform fee/margin compression
        - Direct enterprise sales growth vs. partner-originated pipeline mix
      - - Growth Velocity
        - Surpassed $50M ARR with 150% NRR driven by blue-chip enterprise deployments
        - Growth deceleration as easy initial contact-center automation use cases saturate
        - Sub-80% ARR growth in forward fiscal periods or NRR contraction below 130%
      - - Technical Moat
        - Proprietary Agent Management Platform handles full lifecycle simulation and compliance
        - Frontier LLM commoditization reduces switching costs between orchestrators
        - Customer churn toward low-cost open or hyperscaler-native agent frameworks
    notes: Balanced evaluation of bull and bear investment arguments with observable pivot criteria.
