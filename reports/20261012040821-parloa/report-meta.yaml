  topStrengths:
    - Rapid enterprise adoption with more than $50M ARR, 150% NRR, and 150+ customer accounts.
    - Deep distribution and integration through SAP, Microsoft, OpenAI, Five9, and major BPO partners.
    - Strong customer proof across large enterprise brands in insurance, retail, travel, and health benefits.
  topRisks:
    - A $3B valuation on roughly $50M ARR leaves little room for execution missteps or growth deceleration.
    - Gross margin, GRR, and audited unit economics remain undisclosed, limiting underwriting confidence.
    - Suite incumbents and hyperscalers can absorb agent-management functionality into broader platforms.
  unresolvedGaps:
    - Audited gross margins and gross revenue retention are still not publicly disclosed.
    - Independent customer-level cohort data is needed to verify expansion quality beneath reported NRR.
    - US expansion traction and regional ARR mix remain only partially evidenced in public sources.
    - EU AI Act compliance timing and cost burden remain unresolved.
