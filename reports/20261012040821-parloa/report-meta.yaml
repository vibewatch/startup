companyProfile:
  summary: >-
    Parloa is a Berlin-founded enterprise AI Agent Management Platform company that automates customer service across
    voice and digital channels, with a product positioning that spans agent design, simulation, deployment, governance,
    and observability. The company has scaled rapidly through a sales-led model, blue-chip customer references, and deep
    ecosystem ties to SAP, Microsoft, OpenAI, Five9, and major BPO partners, but its public disclosures still leave
    audited gross margins and retention cohorts unresolved.
