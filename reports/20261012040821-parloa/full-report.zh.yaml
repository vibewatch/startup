chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与企业级 AI Agent 平台
        blocks:
          - type: paragraph
            body: >-
              Parloa, Inc. 是一家企业级对话式人工智能提供商，2018 年由 Malte Kosub 和 Stefan Ostwald 在德国柏林创立。公司开发并商业化 AI Agent Management
              Platform（AMP），为全球组织编排、仿真、部署和管理自主语音及聊天客户服务 Agent。Parloa
              并非狭窄的联络中心应用，也不是通用基础模型提供商；它把自身架构定位为中央管理层，统筹多种通信渠道、后台企业工作流和不同地区监管辖区中的客户体验自动化。公司运营总部横跨柏林和纽约，以软件即服务模式为金融服务、电商、保险和电信等高量企业客户提供自动化客户服务交互。
            claimRefs:
              - CO001
              - CO002
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO007
      - number: '1.2'
        title: 创始人、高管领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Parloa 的管理团队由联合创始人兼 CEO Malte Kosub 领导；他自 2016 年起构建语音界面和对话式 Agent 架构。联合创始人兼首席人工智能官 Stefan Ostwald
              负责核心平台栈架构。公司还通过高规格企业软件招聘扩充执行委员会，包括负责系统工程的 CTO Alexander Matthey、在 Series C 融资后推动商业扩张的 CRO Chris
              Silver，以及建立全球品类领导力的 CMO Latané Conant。公司治理由正式监事会承载，并得到领投成长投资方 General Catalyst 支持；CEO Hemant Taneja
              与总裁兼董事总经理 Jeannette zu Fürstenberg 担任活跃董事，负责国际战略和企业扩张。
            claimRefs:
              - CO003
              - CO005
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO008
              - CO013
      - number: '1.3'
        title: 资本化历史、估值与利益相关方动态
        blocks:
          - type: paragraph
            body: >-
              Parloa 在不到四年内累计获得超过 $560 million 股权融资，是欧洲企业科技领域资本积累最快的公司之一。2026 年 1 月，公司完成由 General Catalyst 领投的 $350
              million Series D，投后估值 $3.0 billion；此前仅七个月，公司于 2025 年 5 月以 $1.0 billion 估值完成 $120 million Series C
              独角兽融资。参投机构还包括 EQT Ventures、Altimeter Capital、Durable Capital Partners 和 Mosaic Ventures。企业软件巨头 SAP 另行对
              Parloa 进行战略投资，并通过 SAP Service Cloud 提供直接分销入口。不过，市场分析师指出，以约 $50 million ARR 支撑 $3.0 billion 估值，相当于激进的约 60x
              ARR 倍数，几乎容不得执行偏差。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO010
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO005
              - CO010
      - number: '1.4'
        title: 运营演进、生态伙伴与里程碑
        blocks:
          - type: paragraph
            body: >-
              Parloa 起初专注复杂对话式电话自动化，如今已扩张至 500 多人，在纽约、旧金山、柏林、伦敦、慕尼黑、巴黎、马德里和米兰八个全球办公室运营。平台为
              Allianz、Booking.com、HealthEquity、Swiss Life、TeamViewer、Zalando 和 IKEA
              等跨国企业的关键客户运营提供支持。为抵御原生超大规模云厂商的整合，公司建立深厚的基础设施与商业联盟：核心服务运行在 Microsoft Azure Cognitive Services 和 Azure
              OpenAI Service 上，并与 Five9、Epic 和 SAP 达成集成合作。平台持续演进，新增 Agent Composition，可在不同运营地区模块化部署
              Agent；但企业尽调仍需验证其相对于基础模型提供商的专有模型防御力。
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO012
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
