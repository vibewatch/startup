  - id: FE001
    title: 产品架构图
    type: stack
    summary: Parloa AMP 的六层架构栈，覆盖电话接入、语音处理、核心编排、认知推理、企业集成与治理。
    data:
      layers:
        - label: 第 1 层：电话与全渠道接入
          detail: 管理 SIP 中继、WebRTC 流媒体，以及语音、WhatsApp 和 Microsoft Teams 之间的多渠道路由。
        - label: 第 2 层：实时音频与语音管线
          detail: 流式 STT 与神经 TTS 组件支持超过 130 种语言，且引擎模块可替换。
        - label: 第 3 层：Agent Management Platform（AMP）核心
          detail: 有状态对话引擎、Parloa Studio 无代码编排、Agent Composition 与对话记忆。
        - label: 第 4 层：认知推理与前沿模型
          detail: 利用 OpenAI GPT-5.4 与多模型路由进行上下文评估、提示编排和推理执行。
        - label: 第 5 层：企业集成与数据连接器
          detail: 预置连接器接入 SAP Service Cloud、Salesforce、Five9、Genesys、Zendesk 及核心 ERP 数据库。
        - label: 第 6 层：安全、合规与可观测性
          detail: 实时分析仪表板、对话模拟套件，以及 SOC 2、HIPAA 与 EU AI Act 治理控制。
    approximationNotes: 逻辑架构层综合自供应商技术披露、合作伙伴公告与第三方评测。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE010
      - CE014
  - id: FU001
    title: 企业客户旅程与扩张循环
    type: journey-map
    summary: 企业从初始数字化试点走向核心语音自动化，再经合作伙伴扩张的采用路径。
    data:
      items:
        - label: 发现与暗旅程分析
          stage: 发现与暗旅程分析
          buyer: Head of Customer Experience
          activity: Analyze legacy contact center call transcripts and uncover conversational blind spots.
          touchpoints:
            - 历史转录稿接入
            - 暗旅程模拟
            - 高管 ROI 简报
        - label: 试点部署
          stage: 试点部署
          buyer: Contact Center Operations
          activity: Deploy initial low-code AI agents on digital messaging and routine FAQ chat channels.
          touchpoints:
            - 低代码工作流设计
            - 部署前 LLM 模拟
            - 合成对话评分
        - label: 核心生产上线
          stage: 核心生产上线
          buyer: IT & CX Leadership
          activity: Scale to high-stakes inbound voice support and CRM integration with SAP, Genesys, and Salesforce.
          touchpoints:
            - 语音电话集成
            - 全天候自动理赔与订单受理
            - 零等待覆盖
        - label: 运营优化
          stage: 运营优化
          buyer: Contact Center Quality Teams
          activity: Leverage real-time observability dashboards to track containment rates, AHT, and escalations.
          touchpoints:
            - 实时遥测仪表板
            - A/B 智能体变体测试
            - 自动提示优化
        - label: 生态扩张
          stage: 生态扩张
          buyer: Enterprise Procurement & CIO
