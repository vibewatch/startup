        - label: 持续留存循环
          stage: 持续留存循环
          buyer: Business Unit Executives
          activity: Expand conversation volume and agent seats, driving 150% net revenue retention.
          touchpoints:
            - 消费量分层升级
            - 新增部门智能体群
            - 年度合同续签
