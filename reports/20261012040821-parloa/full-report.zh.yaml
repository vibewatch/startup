  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心工作流
        blocks:
          - type: paragraph
            body: >-
              Parloa 将核心产品定位为企业级 AI Agent
              管理平台（AMP），用于在复杂语音电话和数字消息渠道中自动化客户服务。它不部署静态决策树或脆弱的规则式交互式语音应答（IVR）菜单，而是让企业设计、部署和治理能理解非结构化客户请求并执行后台工作流的自适应 AI
              Agent。主要创建界面 Parloa Studio 让业务分析师和客户体验经理用自然语言向 Agent 下达需求，无需编写过程代码，降低日常对话更新对内部工程团队的依赖。为简化全球发布，Parloa 推出
              Agent Composition 模块化框架，让组织一次构建可复用对话技能，随后部署到不同地区子公司、语言和业务职能。Agent 接触真实客户前，平台仿真套件会针对规则式及 LLM
              驱动的评估标准执行数千个合成和历史对话场景，基准测试安全性、意图准确率和工作流完成度。
