  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、变现架构与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Parloa 主要通过 Agent Management
              Platform（AMP）产生企业软件收入，在电话、网页和数字消息渠道自动化入站及出站客户服务。变现架构由年度基础平台订阅和按消耗计费组成，后者随对话时长、并发量和任务复杂度变化。据第三方市场追踪机构和行业分析师称，Parloa
              企业软件许可的实际入场价约为每年 $300,000 或更高；定制系统集成、专业服务和运营商连接另行收费。Parloa 不公布标准价目，而是根据客户呼叫中心规模和 IT
              基础设施复杂度进行销售驱动的企业谈判。厂商推广按结果计价，按成功解决的客户交互收费；但生产合同通常仍要求较高年度许可底价，以抵消部署开销。为扩大直销之外的商业触达，Parloa 培育战略分销伙伴，尤其获得 SAP
              股权投资并将 Agent 集成进 SAP Service Cloud，让 Fortune 200 企业能够使用既有企业软件预算采购 Parloa。
