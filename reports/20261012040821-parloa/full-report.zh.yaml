      - number: '4.2'
        title: 成本结构、毛利率驱动因素与语音基础设施经济学
        blocks:
          - type: paragraph
            body: >-
              Parloa 的成本结构反映实时对话式语音自动化的高基础设施需求，明显不同于成本较低的异步文本聊天系统。生产规模运行语音
              Agent，需要在自动语音识别（ASR）、大语言模型推理和文本转语音（TTS）之间持续流水线处理，同时保持亚秒级音频响应延迟。平台主要运行在 Microsoft Azure 上，使用 Azure OpenAI
              Service（包括 GPT-5.4 等前沿模型）和 Azure Cognitive Services
              处理语音。按分钟计的推理和电话路由费用构成显著可变成本基线，并随通话量直接增长。除云基础设施外，企业部署还需要大量前置工程，将 Parloa 接入 Genesys、Five9、NICE
              等传统联络中心基础设施（CCaaS）以及 Salesforce、SAP 等 CRM。由于 Parloa 没有公开审计毛利率，投资判断应计入这样的可能性：若 token
              和语音处理成本涨幅超过合同提价，毛利率会压缩至 55% 至 65%。
