company:
  name: Parloa
chapter:
  number: 1
  title: Company Overview
  summary: Parloa is an enterprise AI Agent Management Platform provider founded in Berlin in 2018 by Malte Kosub and Stefan Ostwald, specializing in orchestrating voice and chat automation for global enterprises. In January 2026, the company raised a $350 million Series D led by General Catalyst at a $3 billion valuation, scaling to 500+ employees and surpassing $50 million ARR, though its ~60x ARR multiple faces ongoing execution and platform absorption risks.
sections:
- id: identity-and-business-model
  title: Company Identity and Enterprise AI Agent Platform
  body: Parloa, Inc. is an enterprise conversational artificial intelligence provider founded in Berlin, Germany in 2018 by Malte Kosub and Stefan Ostwald. The company develops and commercializes the AI Agent Management Platform (AMP), a software environment designed to orchestrate, simulate, deploy, and manage autonomous voice and chat customer service agents across global organizations. Rather than acting as a narrow contact center application or a generic foundational model provider, Parloa positions its architecture as the central management layer governing customer experience automation across diverse communications channels, back-office enterprise workflows, and regional regulatory jurisdictions. Headquartered operationally between Berlin and New York, Parloa operates a software-as-a-service business model delivering automated customer service interactions for high-volume enterprise accounts across financial services, e-commerce, insurance, and telecommunications.
  claimRefs:
  - CO001
  - CO002
  - CO007
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Founders, Executive Leadership, and Governance
  body: Parloa's executive management is led by co-founder and Chief Executive Officer Malte Kosub, who began engineering voice interfaces and conversational agent architectures in 2016, alongside co-founder and Chief Artificial Intelligence Officer Stefan Ostwald, who architected the core platform stack. The executive committee has been substantially expanded through high-profile enterprise software recruitments, including Chief Technology Officer Alexander Matthey to lead systems engineering, Chief Revenue Officer Chris Silver to drive commercial expansion following the Series C financing, and Chief Marketing Officer Latané Conant to establish global category leadership. Corporate governance is anchored by a formal Supervisory Board bolstered by lead growth investor General Catalyst, with Chief Executive Officer Hemant Taneja and President and Managing Director Jeannette zu Fürstenberg holding active board seats to oversee international strategy and corporate expansion.
  claimRefs:
  - CO003
  - CO005
  - CO013
  tableRefs:
  - TO002
- id: capitalization-and-stakeholders
  title: Capitalization History, Valuation, and Stakeholder Dynamics
  body: Parloa's balance sheet reflects one of the fastest capital accumulation trajectories in European enterprise technology, having secured more than $560 million in cumulative equity funding across less than four years. In January 2026, the company completed a $350 million Series D financing round led by General Catalyst at a post-money valuation of $3.0 billion, just seven months after its $120 million Series C unicorn financing round at a $1.0 billion valuation in May 2025. Existing institutional investors participating in the syndicate include EQT Ventures, Altimeter Capital, Durable Capital Partners, and Mosaic Ventures. Additionally, enterprise software giant SAP executed a strategic corporate investment in Parloa, coupling capital alignment with direct distribution access through SAP Service Cloud. However, market analysts highlight that pricing the company at $3.0 billion on approximately $50 million ARR represents an aggressive ~60x ARR multiple requiring uninterrupted execution.
  claimRefs:
  - CO001
  - CO004
  - CO005
  - CO006
  - CO010
  - CO012
  tableRefs:
  - TO003
- id: operational-scale-and-milestones
  title: Operational Evolution, Ecosystem Partnerships, and Milestones
  body: From its inception focusing on complex conversational telephony automation, Parloa has scaled into an organization of more than 500 personnel operating across eight global offices in New York, San Francisco, Berlin, London, Munich, Paris, Madrid, and Milan. The platform supports mission-critical customer operations for multinational enterprises including Allianz, Booking.com, HealthEquity, Swiss Life, TeamViewer, Zalando, and IKEA. To defend its platform-layer positioning against native hyperscaler consolidation, Parloa has built deep infrastructure and commercial alliances, running its core services on Microsoft Azure Cognitive Services and Azure OpenAI Service while establishing integration pacts with Five9, Epic, and SAP. Continued platform evolution includes Agent Composition capabilities allowing modular agent deployment across operating regions, though enterprise diligence must verify proprietary model defensibility versus underlying foundation model providers.
  claimRefs:
  - CO008
  - CO009
  - CO011
  - CO012
  - CO014
  figureRefs:
  - FO001
