company:
  name: "Parloa"
chapter:
  number: 3
  title: "Competitors"
  summary: "Parloa is pursuing a neutral agent-management layer between enterprise systems of record, contact-center suites, AI infrastructure, and BPO delivery partners. That position broadens distribution but is not yet proven durable against suites and hyperscalers that can absorb orchestration into products they already control."
sections:
  - id: "decision-set"
    title: "The Competitive Decision Set Is Broader Than AI-Agent Startups"
    body: >-
      The relevant buyer choice is not a single list of like-for-like startups. Parloa is presented as an
      agent-management layer for enterprise customer service, while current coverage names Salesforce
      Agentforce, Zendesk with Forethought, Google's Gemini Enterprise Agent Platform, and Talkdesk as
      products moving into the same agentic workflow. Five9 also appears as a Parloa integration partner,
      showing that a supplier or channel can simultaneously control an alternative route to the buyer.
      Enterprises can additionally extend cloud and model infrastructure internally, procure automation
      through BPOs, or retain human-heavy contact-center operations. Only Parloa's scale is quantified in
      the assigned evidence; competitor scale, funding, and customer counts remain unverified here.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP004"
      - "CP005"
      - "CP006"
    tableRefs:
      - "TP001"
  - id: "capability-and-distribution"
    title: "Differentiation Rests on Lifecycle Breadth and Ecosystem Reach"
    body: >-
      Parloa's stated wedge is lifecycle management: business teams can design, simulate, deploy, observe,
      and improve voice and digital agents while connecting them to CRM, ERP, contact-center, and backend
      environments. The SAP Service Cloud integration, Azure foundation, OpenAI model use, Five9 and Epic
      integrations, and relationships with TP, Concentrix, and Foundever create distribution and implementation
      reach that an independent vendor could not reproduce quickly. They also make the moat relational rather
      than fully controlled by Parloa. The retained sources do not provide a common benchmark of latency,
      resolution quality, implementation time, or governance across named alternatives, so the matrix marks
      unsupported cells instead of treating vendor positioning as comparative proof.
    claimRefs:
      - "CP003"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP013"
    tableRefs:
      - "TP002"
  - id: "procurement-and-switching"
    title: "Pricing Is Opaque and Switching Costs Are Bidirectional"
    body: >-
      None of the eight assigned sources discloses a Parloa list price, contract unit, minimum commitment, or
      directly comparable price for the named alternatives. The defensible procurement view is therefore
      qualitative: Parloa may reduce replacement work by integrating with existing systems, but production
      deployments can accumulate configuration, evaluation, workflow, and partner dependencies that raise
      later switching costs. Suite incumbents have the opposite advantage because buyers may already own
      their data, workflow, and support stack, while an internal build offers control at the cost of engineering
      and governance burden. Parloa's published cost and resolution metrics are vendor claims without a
      disclosed denominator or competitor-matched methodology in the fetched text.
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP014"
      - "CP016"
    tableRefs:
      - "TP003"
  - id: "moat-and-displacement"
    title: "The Moat Test Is Whether the Management Layer Remains Independent"
    body: >-
      The central adverse case is category absorption. Independent coverage explicitly questions whether SAP,
      Microsoft, Salesforce, and other large platforms will incorporate enough agent management to eliminate
      demand for a separate layer. Parloa's partner network can delay that outcome by making it the connective
      tissue across systems, but the same network gives powerful counterparties visibility into demand and
      control over infrastructure or distribution. A durable advantage would require independently demonstrated
      superiority in voice reliability, multilingual operations, evaluation, governance, and cross-platform
      deployment. The assigned evidence establishes product claims and named relationships, not a controlled
      benchmark or customer-level displacement record, so moat confidence remains medium rather than high.
    claimRefs:
      - "CP012"
      - "CP013"
      - "CP015"
    figureRefs:
      - "FP001"
