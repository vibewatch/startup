    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-compute-margins
    missingEvidence: >-
      Detailed gross margin breakdown, LLM API inference token expenses, and infrastructure costs across Azure and
