evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited GAAP income statements, gross margins, and gross revenue retention (GRR) figures.
    whyItMatters: Underwriting a 60x ARR enterprise valuation requires verified gross margin durability and logo churn visibility.
    diligencePath: >-
      Request audited financial statements, GAAP gross margin breakdown, and customer retention cohort schedules under
      NDA.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-cap-table
    missingEvidence: Comprehensive equity cap table breakdown, detailed investor share percentages, and liquidation preference terms.
    whyItMatters: >-
      Full assessment of voting covenants and liquidation preference seniority across Series A through D syndicates
      requires private cap table records.
    diligencePath: >-
      Examine commercial shareholder agreements and detailed capitalization schedules during confirmatory legal
      diligence.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: organizational-roster
    missingEvidence: Complete senior leadership directory and engineering organizational hierarchy below the executive level.
    whyItMatters: >-
      Verifying organizational scaling depth and functional bench strength requires visibility into senior director and
      engineering management layers.
    diligencePath: Conduct comprehensive organizational mapping and management interviews during operational diligence.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Named economic buyer, originating budget, procurement path, contract owner, and partner margin or resale terms by
      customer segment.
    whyItMatters: >-
      User demand does not establish that a durable standalone budget exists or that channel distribution preserves
      attractive software economics.
    diligencePath: >-
      Review recent order forms, procurement memos, partner agreements, budget codes, sales-cycle stages, and
      partner-originated pipeline by segment.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent category definition and bottom-up account, workload, pricing, and adoption inputs for software TAM,
      geographic SAM, and attainable SOM.
    whyItMatters: >-
      Broad support costs and workforce counts cannot establish Parloa's monetizable market or support a valuation
      multiple without conversion assumptions.
    diligencePath: >-
      Obtain an independent market study and reconcile it to Parloa's eligible enterprise accounts, production
      workloads, ACV, win rate, and five-year penetration plan.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: roi-validation
    missingEvidence: >-
      Independent cohort-level evidence for cost per contact, containment, resolution time, customer satisfaction, and
      human escalation before and after deployment.
    whyItMatters: >-
      Adoption timing and budget release depend on realized economics, while the available 70% cost claim lacks a
      disclosed denominator and validation method.
    diligencePath: >-
      Request customer-level pre/post KPI exports, cohort definitions, observation periods, exceptions, and third-party
      references for at least three production deployments.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable order forms, usage schedules, minimum commitments, services fees, discounts, and realized unit
      economics for Parloa and named alternatives.
    whyItMatters: >-
      Without matched commercial terms, the analysis cannot determine whether Parloa's integration breadth offsets suite
      bundling or internal-build costs.
    diligencePath: >-
      Obtain anonymized customer contracts and run a three-year total-cost comparison against suite renewal, hyperscaler
      build, and BPO baselines.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      An independent, competitor-matched benchmark covering latency, reliability, containment, handoff quality,
      implementation time, governance, and total cost.
    whyItMatters: >-
      Vendor claims and partnership announcements do not establish durable technical superiority or quantify
      displacement risk.
    diligencePath: >-
      Commission a controlled proof-of-concept using identical languages, workflows, integrations, volumes, and
      escalation criteria across shortlisted vendors.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited financial statements, disaggregated gross margin figures, and monthly net cash burn schedules.
    whyItMatters: >-
      At a $3 billion valuation on ~$50M ARR (~60x multiple), gross margin and burn rate dictate whether the business
      model has software-like operating leverage or faces margin compression from real-time voice inference and
      forward-deployed services.
    diligencePath: >-
      Request management-prepared historical P&L, COGS schedule disaggregating model inference and speech API costs from
      hosting, and gross revenue retention (GRR) cohorts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: voice-latency-sla
    missingEvidence: >-
      Publicly verified turn-taking latency benchmarks and contractual uptime SLA commitments for enterprise voice
      deployments.
    whyItMatters: >-
      Voice agent usability in high-volume contact centers is acutely sensitive to roundtrip response delays, and lack
      of published benchmarks obscures real-world performance.
    diligencePath: >-
      Request customer pilot telemetry data, p95/p99 turn-taking latency logs across telephony carriers, and standard
      SLA contract exhibits during technical diligence.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: containment-audits
    missingEvidence: Third-party audited containment rates and resolution metrics across production enterprise deployments.
    whyItMatters: >-
      Vendor-reported 70% cost reduction and 3x resolution speed figures represent marketing maximums rather than
      audited cross-customer performance baselines.
    diligencePath: >-
      Review sanitized enterprise production call records and customer satisfaction telemetry to verify automated
      containment versus human agent transfer rates.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Audited gross revenue retention (GRR), logo churn percentages, and multi-year customer cohort retention tables.
    whyItMatters: >-
      While a 150% NRR figure is reported, high expansion from a few large enterprise clients can obscure underlying
      logo attrition or dissatisfaction among smaller accounts.
    diligencePath: >-
      Request customer cohort schedules showing gross dollar retention, logo renewal rates, and expansion ARR broken
      down by enterprise customer tier.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive census of enterprise production deployments, contract values, and live containment metrics across
      Parloa's 150+ client base.
    whyItMatters: >-
      Public evidence highlights reference accounts like Swiss Life and Decathlon, but overall customer deployment
      depth, ACV distribution, and contract terms remain private.
    diligencePath: >-
      Review Parloa's complete anonymized customer master list with annualized contract values, live channel usage
      (voice vs chat), and measured containment rates.
    relatedQuestionRefs:
      - QU001
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Third-party audit certification reports and formal conformity assessment documentation under the EU AI Act for
      conversational AI agents.
    whyItMatters: >-
      Without independent audit records, investors cannot verify the extent of compliance liability or potential fines
      under EU AI Act high-risk classification.
    diligencePath: >-
      Request management's EU AI Act compliance roadmap, conformity assessment documentation, and external legal counsel
