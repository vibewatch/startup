callouts:
  - calloutType: risk
    title: Demanding 60x ARR Multiple Leaves Zero Cushion for Deceleration
    body: Parloa's January 2026 Series D valued the company at $3.0 billion against an un-audited ARR run-rate of approximately $50 million, creating an implied multiple of roughly 60x ARR. While a 150% NRR and blue-chip customer list demonstrate strong product-market fit, sustaining a 60x multiple requires flawless execution across international expansion and defense against native CCaaS vendors.
    claimRefs:
      - CI010
      - CI011
      - CI014
  - calloutType: insight
    title: SAP Distribution Channel Subsidizes GTM Velocity at the Cost of Direct Customer Control
    body: By embedding AI agents directly into SAP Service Cloud, Parloa taps into massive enterprise procurement channels without proportionally scaling its direct sales team. However, channel dependency could compress net realization if distributor rev-share agreements expand or if enterprise software incumbents absorb agent orchestration directly into their core application suites.
    claimRefs:
      - CI004
      - CI005
