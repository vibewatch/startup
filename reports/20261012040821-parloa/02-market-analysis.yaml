callouts:
  - calloutType: "risk"
    title: "Standalone Category Durability Is Unproven"
    body: "Parloa's management-layer thesis can create value in heterogeneous enterprise stacks, but the same integration points expose it to bundling by CRM, CCaaS, cloud, and model providers. The retained evidence does not establish that buyers will preserve a separate long-term budget for this layer."
    claimRefs:
      - "CM003"
      - "CM012"
      - "CM015"
      - "CM016"
  - calloutType: "assumption"
    title: "Do Not Convert Operating Pools into Software TAM"
    body: "The $500B+ support-market estimate, 17 million-agent workforce estimate, 94% spending-growth report, startup funding tally, and Parloa ARR are separate metrics. Any conversion into software TAM, SAM, or SOM requires private assumptions about workflow eligibility, price, adoption, and attainable share."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM016"
