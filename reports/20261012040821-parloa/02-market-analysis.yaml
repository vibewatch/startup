  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "buyer-budget"
      missingEvidence: "Named economic buyer, originating budget, procurement path, contract owner, and partner margin or resale terms by customer segment."
      whyItMatters: "User demand does not establish that a durable standalone budget exists or that channel distribution preserves attractive software economics."
      diligencePath: "Review recent order forms, procurement memos, partner agreements, budget codes, sales-cycle stages, and partner-originated pipeline by segment."
      relatedQuestionRefs:
        - "QM004"
      relatedTableRefs:
        - "TM003"
    - type: "missing-source"
      severity: "material"
      topic: "sizing-gap"
      missingEvidence: "Independent category definition and bottom-up account, workload, pricing, and adoption inputs for software TAM, geographic SAM, and attainable SOM."
      whyItMatters: "Broad support costs and workforce counts cannot establish Parloa's monetizable market or support a valuation multiple without conversion assumptions."
      diligencePath: "Obtain an independent market study and reconcile it to Parloa's eligible enterprise accounts, production workloads, ACV, win rate, and five-year penetration plan."
      relatedQuestionRefs:
        - "QM008"
      relatedTableRefs:
        - "TM002"
    - type: "missing-source"
      severity: "material"
      topic: "roi-validation"
      missingEvidence: "Independent cohort-level evidence for cost per contact, containment, resolution time, customer satisfaction, and human escalation before and after deployment."
      whyItMatters: "Adoption timing and budget release depend on realized economics, while the available 70% cost claim lacks a disclosed denominator and validation method."
      diligencePath: "Request customer-level pre/post KPI exports, cohort definitions, observation periods, exceptions, and third-party references for at least three production deployments."
      relatedQuestionRefs:
        - "QM005"
