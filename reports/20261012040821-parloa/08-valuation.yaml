callouts:
  - calloutType: recommendation
    title: 'Investment Discipline: The Case for Patient Diligence'
    body: At 60x trailing ARR, Parloa's $3 billion valuation prices in exceptional execution and leaves negligible room for market deceleration or gross margin degradation. While enterprise traction and blue-chip backing provide strong momentum, investors should maintain entry discipline and await verified cohort retention and margin profiles before underwriting late-stage equity.
    claimRefs:
      - CV004
      - CV011
      - CV015
