      - - Confidence
        - Medium
        - High confidence on financing history and tier-one partners; medium on unit economics
        - Requires primary confirmatory customer cohort analysis
      - - Risk Rating
        - High
        - Platform absorption risk from CRM giants and high multiple compression exposure
        - Underwrite downside protection and preference structures
      - - Valuation Stance
        - Stretched
        - $3B valuation reflects ~60x ARR multiple on ~$50M ARR benchmark
        - Wait for operating expansion or secondary repricing opportunity
