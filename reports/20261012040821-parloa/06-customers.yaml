callouts:
  - calloutType: "strength"
    title: "Strong Land-and-Expand Validated by 150% Net Revenue Retention"
    body: "Parloa's reported 150% net revenue retention indicates substantial usage expansion within established enterprise accounts. As clients expand agent fleets from initial chat use cases into high-volume voice channels, consumption-based billing accelerates contract value."
    claimRefs:
      - "CU010"
      - "CU011"
  - calloutType: "risk"
    title: "Absence of Gross Retention and Logo Churn Data Creates Underwriting Risk"
    body: "While 150% NRR is exceptional, Parloa has not disclosed its gross revenue retention (GRR) or logo churn rates. In high-growth AI software, strong expansion among top enterprise cohorts can mask underlying churn among smaller or dissatisfied accounts."
    claimRefs:
      - "CU010"
      - "CU014"
