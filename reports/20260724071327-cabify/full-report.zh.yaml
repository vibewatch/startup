  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Cabify 最大的风险是监管，不是需求。西班牙 VTC
              框架让合规供给成为政治和法律变量；马德里和瓦伦西亚近期争议显示，实际准入仍可能逐城变化。一比三十比例不只是象征，它有法律历史，并持续影响增长能转化为多少服务可用性。在拉美，风险不同但同样重要：劳动法变化可能让平台经济性少一些灵活、多一些成本。合在一起，这些因素意味着
              Cabify 的增长天花板至少同样受法律和牌照塑造，而不只是产品质量。更新的官方和准官方材料让这一解读更尖锐。西班牙 2023 年后的框架并非只是保留旧比例；它创造了更宽的公共利益和区域执行背景，Cabify
              必须同时监测多个主管机关。哥伦比亚劳动改革也从成本侧做了类似事情，把平台义务变成活跃的法定议题。合在一起，这些法律进展意味着，Cabify
              的下行同样由政策流程驱动，而不只是消费者行为。一个盈利的经营年度无法抵消这类外部强加的规则变化。法律监测因此是永久运营要求，不是周期性的清理任务，实际经营中尤其如此。
