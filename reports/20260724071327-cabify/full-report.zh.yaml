      - number: '8.3'
        title: 为什么信心仍然有限
        blocks:
          - type: paragraph
            body: >-
              正确建议仍是观察或继续研究，因为缺失项恰好决定估值在实践中是否有吸引力，而不只是理论上好看。公开证据没有披露股数、优先权栈、债务契约余量、二级市场标记或经审计盈利。监管和劳动法也让价值区间脆弱。因此，估值立场应对基本面保持谨慎建设性，但对精确定价保持低信心。Cabify
              值得更深入工作，而不适合给出高确信价格目标。数据库宽度、同行分析和粗略倍数计算能改善交叉验证，但都不能替代资本结构事实。即便企业价值启发式看起来有吸引力，一个隐藏的优先权层、契约包或二级交易，也可能显著改变有效普通股价值。因此，建议仍是观察或继续研究。业务案例看起来可信；股权案例在结构上仍披露不足。对后期私营公司而言，这个区别常常就是好公司和好证券之间的区别。在这些项目私下补齐前，即便表面倍数看似便宜，也应谨慎对待。这就是今天最核心的未解投资问题。
