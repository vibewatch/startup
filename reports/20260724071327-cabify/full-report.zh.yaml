      - number: '7.3'
        title: 执行、技术与披露风险
        blocks:
          - type: paragraph
            body: >-
              Cabify
              还背负执行和披露风险；在它当前阶段，这些风险比种子期公司更重要。电动化需要资本和运营跟进。信任与防欺诈控制必须跟上账号滥用和安全事件。作为后期私营公司，治理透明度弱于理想状态；公开条款细节稀少，债务结构也无法干净评估。如果公司的盈利能力真实，这些风险可管理；但在更弱的宏观或监管情形下，它们会更严重。披露问题会抬高其他每一项风险的严重度，因为外部人无法衡量真实缓冲垫有多厚。如果
              Cabify 披露牌照库存、准备金计划、市场层面集中度和契约余量，外部人就能把可管理风险与生存风险分开。没有这些细节，监管、法律和运营风险会叠加。正确解读不是 Cabify
              格外脆弱，而是以公司成熟度和规模来看，几条重要下行路径仍比应有范围更宽。实践中，即便管理层内部可能把业务处理得不错，薄披露也会拉宽情景区间。投资者因此面对更宽的不确定性锥。
