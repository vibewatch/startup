  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点与区间框架
        blocks:
          - type: paragraph
            body: >-
              Cabify 的估值问题不是缺少运营信号，而是缺少当前价格发现。最干净的公开锚点仍是 2018 年 $1.4 billion
              独角兽轮。这个标记已经陈旧，但仍有用，因为后续资本事件没有披露公开投后估值。按粗略公开计算，用 2024 年收入套 1.5x 到 2.0x 收入框架，会得到约 $1.3 billion 到 $1.7
              billion 的区间，足够接近陈旧独角兽锚点，所以这个标记并不荒唐。挑战在于，2023 和 2024
              年资本事件可能已经在没有公开披露的情况下实质改变有效股权价值。新的私营公司追踪器能让讨论保持活跃，但解决不了核心问题。它们可以提示 Cabify
              仍属于十亿美元级公司，却不揭示当前股数、期权悬挂、优先权结构或债务顺位；这些才决定普通股真正值多少钱。因此，这个区间可以有方向性用途，却达不到决策级。做估值时，陈旧价格锚点不是没有价值；它们只是容易受到隐藏结构变化影响，而公开媒体和数据库无法完全揭示这些变化。正确用法是把区间当作一组有纪律的问题：哪些资本结构事实会让
              Cabify 高于或低于这个陈旧独角兽标记？
