      - number: '2.3'
        title: 约束、监管与市场准入
        blocks:
          - type: paragraph
            body: >-
              西班牙 VTC 制度是 Cabify
              可服务市场最重要的结构性约束。一比三十比例、国家与地方两层牌照，以及法院和监管机构持续介入，意味着需求上升时供给不能自由增加。用经济学语言说，市场可以很大，但仍很难捕捉，因为牌照稀缺会限制运力。这个约束有双刃剑效应。如果
              Cabify 能接触到正确的牌照和运营伙伴，稀缺性可以保护利用率和定价。如果供给不足，市场增长就会变成别人的上行空间。因此，投资问题不是西班牙和拉美是否存在网约车需求，而是 Cabify
              能否把监管准入转化为持久份额，同时不重新点燃补贴很重的竞争。监管还从另一个角度改变市场叙事：它引入稀缺经济学。在自由进入模型里，每增加一名乘客，都可能吸引更多司机供给和新竞争者。在西班牙，增量需求反而可能撞上配额规则、地方行政要求和诉讼风险。因此，Cabify
              的可服务市场应被理解为过滤后的需求，而不是理论总需求。最强的市场机会也就落在这些城市：Cabify 能把足够合规供给，与重视可预测服务和合规、而不只看最低名义车费的企业买方配在一起。
