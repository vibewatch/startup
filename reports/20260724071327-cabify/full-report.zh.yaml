      - number: '2.2'
        title: 买方分群与需求驱动
        blocks:
          - type: paragraph
            body: >-
              Cabify
              面向两类重叠但经济属性不同的买方：购买城市便利的消费者，以及购买托管交通工作流的企业。企业产品引入集中开票、政策控制、费用分摊和集成，这些对企业买方的重要性远高于小额车费差异。城市化、拥堵和公共交通缺口支撑消费者需求；机场接送、访客出行、活动和员工差旅支撑企业需求。这很重要，因为采购驱动的需求往往更有黏性，也没那么受促销影响，不像纯消费者
              app 切换那样容易。Cabify 的可持续叙事在 B2B
              里的战略价值也高于大众消费者获客，因为采购团队可以把排放目标绑定到供应商选择上。这种分野也会改变市场测算方式。消费者出行需求受拥堵、夜生活、机场流量和本地公交缺口影响；企业需求受差旅政策、报销规则、访客物流和照护责任要求影响。两者不是同一组需求驱动。Cabify
              越能持续服务重视报告和政策控制的企业用例，业务就越少依赖不断赢下价格敏感、切换摩擦很低的非必需出行。
