            body: >-
              公开来源中的采用信号很宽，但不完美。Incognia 2026 年 3 月公告引用超过 50 million 注册用户、约 1.5 million 司机伙伴和 1,000 多名员工，支持 Cabify
              已在相当规模上运营这一判断。独立司机 app 强化了供给侧采用，2024 年盈利则说明活跃客户基础并非纯补贴堆出来。缺失的是持久性证明。Cabify
              不公开披露月活、企业集中度、流失或满意度指标，因此公开证据更强地支持规模和可信性，而不是留存质量。总体业务证明对图景略有改善。Mexico Business News 报道称，拉美已有 4,500 多家公司聘用
              Cabify for Businesses；证据较旧，但仍有用，因为它证明企业采用达到有分量的规模。公开 app 商店和司机供给信号也显示，Cabify 不是一个薄弱的双边网络。即便如此，汇总数字并不等于当前活跃
              cohort。没有 MAU、流失、乘车频率或续约数据，本章只能说采用看起来广泛且可信，不能说留存达到同类最佳。公开证据因此支持存在性、宽度和部分企业相关性，但不支持真正的 cohort 持久性。
