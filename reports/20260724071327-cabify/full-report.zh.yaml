  - id: FR001
    title: 风险热力图快照
    type: matrix
    layout: standard
    summary: 监管和劳动法主导风险栈。
    data:
      columns:
        - 低
        - 中
        - 高
      rows:
        - label: 监管 / 法律
          values:
            - 信任与安全
            - 治理 / EV 成本
            - VTC 与劳动法
        - label: 经济 / 客户
          values:
            - 市场退出
            - 宏观 / 集中度
            - 竞争性价格压力
        - label: 披露 / 执行
          values:
            - 关键人物
            - 债务 / 披露不透明
