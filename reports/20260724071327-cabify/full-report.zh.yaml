        title: 身份、版图与运营模式
        blocks:
          - type: paragraph
            body: >-
              Cabify 以受监管的城市出行市场平台运营，产品面比「网约车」这个标签更宽。消费者 app 仍主打专车、出租车、配送，以及部分微出行或租车选项；企业产品则加入集中开票、成本中心、行程政策和 ERP
              连接。当前官方和第三方来源指向同一件事：Cabify 如今的版图比早年高速扩张时宣传的更小、更聚焦。官方英文首页和 2026 年 3 月的 Incognia 合作公告都称，公司活跃于西班牙及拉美的 6
              个国家、40 多个城市。这个版图重要，因为 Cabify 现在卖的是可靠性、质量控制和受监管服务；在 VTC 供给、机场客流和企业采购可防守的市场里，这比单纯大众市场补贴更理性。Cabify
              也得益于同一品牌下同时有消费者和企业需求，降低了被视为单一通勤 app 的风险。对投资者而言，单看版图会低估 Cabify 想在机场、通勤、活动和托管员工出行中捕捉的用例宽度。
