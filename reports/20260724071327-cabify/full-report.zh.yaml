  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模与增长背景
        blocks:
          - type: paragraph
            body: >-
              独立研究机构大体同意，网约车仍是一个规模大、仍在增长的品类。绝对数字会随方法不同而变化，但方向性信息稳定：全球网约车需求已经以数百亿美元或低千亿美元计，未来几年预计保持低双位数到中双位数复合增长。拉美规模更小但仍有分量；西班牙市场相对紧凑，却因密度、收入和监管稀缺性而具备战略重要性。对
              Cabify 而言，TAM 不是卡点。更难的问题是：哪里能拿到合规供给，哪些城市支持高端或企业导向定位，以及在不打补贴价格战的情况下能服务多少品类需求。一个实际含义是，即便公开 TAM
              估算噪声很大，这个品类仍可能有吸引力。更重要的是，公司能否在大型都市走廊捕捉高频需求——乘客反复需要机场接送、通勤替代和非标准时段托管交通。按绝对规模，西班牙也许小于部分拉美市场；但购买力、旅游客流和密集商务活动，仍能让它对利润质量产生不成比例的重要性。这让机会仍有投资价值。
