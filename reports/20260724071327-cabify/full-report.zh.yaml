      - number: '4.3'
        title: 资本栈与融资需求
        blocks:
          - type: paragraph
            body: >-
              Cabify 的资产负债表故事显示，公司已不再完全依赖新的高倍数股权来维持运营。公司累计融资约 $517 million，但最近可见的资产负债表增量，是 2023 年混合融资、2024 年来自 BBVA
              Spark 的风险债额度，以及 2024
              年由内部人支持的注资。这个模式可以正面解读，因为盈利改善后贷款方和现有投资者继续支持公司；但它也意味着股权定价可见度弱。缺少债务契约、到期日和现金流细节，限制了外界判断当前盈利能在多大程度上转化为持久财务灵活性的确定性。更宽的财务解读是，Cabify
              现在看起来像是在为选择性优先事项融资，而不只是填补经营亏损。风险债、内部人支持和 EV
              相关项目融资都显示，公司正在用资产负债表塑造增长和可持续结果。这是建设性的，但不自动意味着便宜。投资者仍需要知道，资金提供方感到舒适，是因为现金生成能力强，还是因为治理和抵押品给了他们普通股持有人在公开信息中看不到的保护。正因为这种不确定性，披露质量仍是最终估值判断的核心。
