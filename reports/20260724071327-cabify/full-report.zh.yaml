      - number: '3.3'
        title: Cabify 仍然暴露在哪里
        blocks:
          - type: paragraph
            body: >-
              任何主要靠补贴定价、资产负债表耐力或全球网络效应决胜的竞争，Cabify 都处于劣势。Uber 拥有最宽的资本基础和最强的产品外延，Bolt 持续压入相邻用例，inDrive
              在乘客和司机更看重价格灵活性而非精细服务的地方吸引力很强。公开信息还留下重要对比缺口，包括城市层面份额、司机流失率和抽成率差异。这意味着竞争分析应按概率框定：Cabify
              不需要统治整个品类才有价值，但它确实需要足够受保护、高质量的需求，避免被拉入一场自己无法融资支撑的竞赛。乘客和司机常常多平台并用，这会放大这种暴露。像 Cabify
              这样的公司可能赢在服务质量或采购适配上，但当另一平台促销，或在某条走廊拥有更好的即时供给时，仍会丢掉边际行程。替代集合也不止其他 app；出租车、公共交通和私家车在很多线路上仍是可行选择。对投资者而言，这意味着
              Cabify 的可防守性必须通过经济性和留存来证明，不能只凭 app 存在就假设成立。这个不确定性让下行情形仍然实质性敞开。
