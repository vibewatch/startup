  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 已报道收入与盈利能力
        blocks:
          - type: paragraph
            body: >-
              公开财务报道支持一个结论：Cabify 已在有分量的规模上运营，2024 年也不是又一个补贴很重的增长年。多家媒体把 2024 年收入指向约 $858 million；2023 年略高，约 $899
              million。更重要的信号是盈利能力：独立报道引用约 $127 million 毛利和约 $34 million
              EBITDA，并称所有运营国家均已盈利。这不等于一套完整经审计盈利材料，但比出行领域常见的泛泛高增长私营公司叙事强得多。2023 年到 2024
              年收入小幅回落，更应解读为反弹增长后的正常化，而不是需求故事破裂。存在多篇独立媒体引用也很重要，因为 Cabify 不发布经审计的投资者材料。这里的信号来自交叉印证，而非管理层直接披露。即便如此，2024
              年收入、利润和 EBITDA
              指标在不同媒体间一致，很难简单把结果斥为叙事膨胀。仍需谨慎的是，收入质量、现金转化和一次性项目对外部人仍不可见；因此，收入和盈利指标对承销正常化盈利有用，但并不完整，放到今天仍是如此。
