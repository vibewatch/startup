    title: 情景与置信区间
    type: range
    layout: standard
    summary: 结构和披露仍不透明，示意性价值区间需要额外打置信度折扣。
    data:
      items:
        - label: 简单收入框架
          low: 1.29
          high: 1.72
          unit: US$B
        - label: 过时公开锚点
          low: 1.4
          high: 1.4
          unit: US$B
        - label: 置信折扣后解读
          low: 1.1
          high: 1.5
          unit: US$B
    claimRefs:
