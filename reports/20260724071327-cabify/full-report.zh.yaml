  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 可见产品界面
        blocks:
          - type: paragraph
            body: >-
              Cabify 的可见产品界面远不止一个乘客 app。公司仍在营销 iOS 和 Android 消费者 app、独立司机
              app、企业出行控制台，以及面向物流或嵌入式工作流的公开开发者界面。产品成熟度在企业栈中最明显：费用控制、用户组、开票和集成都说明，公司卖进的是持续运营软件，而不只是一次性出行需求。这很重要，因为即便核心叫车体验看起来类似同品类同行，产品宽度也能改善留存。产品界面也明显按用户角色有意分层。乘客看到选择、预约和出行选项；司机看到独立运营工具；企业买方看到控制、开票和管理政策；开发者看到物流和入驻材料。这种结构说明，Cabify
              把产品交付视作一套专门界面的系统，而不是一个单一移动 app。尽调时这有意义，因为按角色设计的界面往往对应更好的工作流适配，也降低企业或供给侧用户的切换。它还说明，Cabify
              可以演进某一个用户界面，而不必重写其他每条工作流；对于一个必须同时让产品适应监管、采购和司机运营的多国家业务，这在跨市场运营中很有用。
