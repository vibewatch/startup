      - number: '7.2'
        title: 竞争、宏观与客户风险
        blocks:
          - type: paragraph
            body: >-
              竞争风险仍高，因为 Uber、Bolt 和价格导向平台仍可用规模或激励压低车费、争夺司机供给。Cabify 的聚焦有帮助，但聚焦也意味着集中。公司暴露于拉美宏观和汇率波动，也通过 B2B
              业务暴露于企业差旅预算。公开披露太薄，客户集中度无法精确打分。公开可见的关键缓释因素是盈利能力：盈利的出行运营商比烧钱公司更能顶住压力。这个风险栈也会相互作用。当监管稀缺限制供给时，竞争压力更危险，因为
              Cabify 不能总是靠简单增加司机或降低摩擦来回应。客户集中度披露不足时，宏观和汇率风险更重要；B2B
              质量未被公开量化时，企业差旅敏感性更重要。盈利能力是真实缓释因素，但只是部分缓释。它能买来时间和选择权；却挡不住政策、定价或集中度冲击打到业务模型。另一个含义是，Cabify
              在服务质量上判断正确，仍可能在竞争对手或政策制定者比客户行为更快改写赛场时看到利润率被压缩。这也是为什么集中度、定价和监管不能分开分析，放到更长时间维度更是如此。
