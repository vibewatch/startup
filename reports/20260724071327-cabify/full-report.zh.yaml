              Cabify 的公开资本历史显示，公司很早进入独角兽行列，之后从巨额融资叙事转向更有纪律的资产负债表支持和盈利证明。Tracxn 的 2026 年融资页面仍把独角兽故事锚定在 2018 年 1 月的
              US$160M 轮融资和 US$1.4B 投后估值。更新的资本事件在规模上比定价披露更清楚：2023 年 3 月融资总额为 US$110M，2024 年 1 月新增 €15M BBVA Spark
              风险债额度，2024 年 6 月又由现有股东追加 €18.7M。运营规模的披露比治理披露改善更多。GetLatka 和 El Referente 将 2023 年收入放在约 US$899.1M；多篇 2025
              年新闻报道则称 2024 年收入约 US$858M、毛利约 US$127M、EBITDA 约 US$34M。
