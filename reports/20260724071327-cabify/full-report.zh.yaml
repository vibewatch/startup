      - number: '5.2'
        title: 信任、安全与运营智能
        blocks:
          - type: paragraph
            body: >-
              Cabify 的公开材料显示，运营信任是一级产品议题。应用商店描述强调安全功能；2026 年 3 月 Incognia
              合作则显示，公司仍在围绕账号共享、虚假身份和促销滥用投入防欺诈。对出行平台来说，这些问题不只影响用户信任，也会直接漏掉利润。Cabify
              几乎肯定把动态定价、路线优化和风险控制用作基础算法，但公开证据更多说明它面对的问题集，而不是自有实现。技术故事因此应被解读为可信且成熟，但不完全透明。信任故事也比乘客安全宣传更宽。公开 app
              列表展示安全和行程信心功能；合作伙伴公告展示 Cabify 仍在投入设备智能和反滥用工具。合在一起，这些信号说明 Cabify
              的产品质量包含身份保障、防欺诈和运营完整性。限制在于，没有公开来源量化欺诈损失、算法提升、误报率或正常运行时间。因此运营栈看起来严肃，但外部人仍无法判断 Cabify
              只是达到品类常规，还是搭出了真正更强的风险引擎。这让最强的产品论点仍集中在有纪律的运营，而不是黑箱算法主张。
