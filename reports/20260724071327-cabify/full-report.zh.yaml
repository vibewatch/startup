        - 没有每股估值基础
        - 只能使用企业价值经验法
      - - 优先权结构
        - 普通股分配瀑布未知
        - 可能压缩剩余股权价值
      - - 债务条款和契约
        - 优先债权和压力触发条件未知
        - 限制下行信心
      - - 经审计盈利 / FCF
        - 没有干净的收益率或转化分析
        - 无法高信心选择倍数
      - - 国家级利润结构
        - 情景权重仍模糊
        - 提高集中度不确定性的折价
    notes: 尽管业务信号有吸引力，建议仍是继续研究，主要原因就在这些缺口。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV035
      - CV039
    enumerationScope:
      coverage: partial
      basis: Summarizes the core hidden inputs that keep a private-market valuation from becoming high confidence.
