      - number: '6.3'
        title: 集中度风险与信息缺口
        blocks:
          - type: paragraph
            body: >-
              Cabify 的客户风险更可能集中在地域和分部，而不是少数点名账户；但公开数据不足以量化任何一项。西班牙和几个拉美大首都似乎具有战略中心地位，却没有公开组合显示乘客、司机或收入各有多少来自每个市场。B2B 与
              B2C 的混合也一样。这会限制客户章节的精确度，因为客户集中度是判断利润持久性和监管敏感性最重要的输入之一。当前最佳解读是，Cabify 的企业产品创造了一个潜在有黏性的基础；但在账户、cohort
              和城市层面数据披露之前，承销仍受证据约束。相同限制也影响集中度分析。公开来源暗示，客户质量很可能随市场、垂直行业，以及需求是受政策管理还是纯非必需消费而变化；但这些切分没有被量化。公开证明也更强地说明
              Cabify 服务哪些客户类型，而不是它对某一个 logo、城市或国家依赖多深。因此，承销问题与其说是 Cabify 有没有客户，不如说是它最好的客户是否以某种方式集中，在监管或宏观冲击下让投资者意外。
