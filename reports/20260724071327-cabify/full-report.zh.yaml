        blocks:
          - type: paragraph
            body: >-
              公开可交叉印证的创始人和运营负责人是 Juan de Antonio。他在 Tracxn、GetLatka、当前财务业绩报道和近期融资新闻中都持续以创始人兼 CEO
              身份出现。围绕他，公开披露还呈现出一个更窄但仍有分量的高管组合，包括 CFO Juan Barbolla 和业务负责人 Daniel
              Bedoya。同样重要的是看不见的部分。留存公开来源没有给出完整董事会名单、优先权摘要或治理权利图谱；对于 Cabify 这种成熟度和规模的私营运营商，这是一个明显缺口。公开来源也没有像印证 Juan de
              Antonio
              那样持续印证第二位联合创始人，因此任何更宽的创始人名单都应作为待尽调事项，而不是封面事实。这个披露缺口并不致命，但很重要，因为后期私营公司的价值很大程度上由董事会权利、优先权顺位和高管接班深度塑造。在私下拿到这些细节之前，领导层图景足以支持身份和战略判断，但不足以支撑控制权分析。
