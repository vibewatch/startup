  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁为 Cabify 付费
        blocks:
          - type: paragraph
            body: >-
              Cabify 同时服务乘客和企业出行买方；即便变现 cohort 细节缺失，两个分部的公开证据都很强。公司的多城市版图和持续存在的消费者 app
              支撑乘客宽度。产品深度支撑企业需求：集中账单、政策控制、报告，以及面向酒店、活动、法律、医疗和金融的垂直用例。这一点重要，因为 Cabify 的客户系统不是纯 B2C
              市场平台。业务经济价值很可能部分取决于非必需乘客和政策管理下企业差旅之间的混合。公开客户证明在工作流上也比 logo 更丰富。Cabify
              点名了费用集成、访客差旅用例、保险公司协助、患者转运和酒店工作流，这些都有助于验证 B2B 层真实存在。公司没有披露的是一长串头部终端客户。因此，本章可以有信心地描述买方类型和用例，但不能按 logo
              判断客户集中度。对投资者而言，这个区别重要，因为工作流可信度是良好的采用信号，而点名客户披露才是企业黏性和商业质量更强的证明。公司也仍维持活跃的公开内容，进一步说明品牌沟通同时服务乘客和企业用户。
