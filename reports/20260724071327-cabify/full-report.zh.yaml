      - CV004
      - CV029
      - CV035
      - CV039
  - id: FV002
    title: 估值支撑流
    type: flow
    layout: standard
    summary: 收入和盈利能力支撑价值，但结构与监管限制置信度。
    data:
      nodes:
        - id: rev
          label: 收入规模
          type: input
        - id: profit
          label: 盈利信号
          type: input
        - id: structure
          label: 股权结构和债务不透明
          type: constraint
        - id: reg
          label: 监管风险
          type: constraint
        - id: value
          label: 估值置信度
          type: output
      edges:
        - from: rev
          to: value
          label: 支撑
        - from: profit
          to: value
          label: 支撑
        - from: structure
          to: value
          label: 限制
        - from: reg
          to: value
          label: 限制
    claimRefs:
      - CV008
      - CV014
      - CV018
      - CV025
      - CV026
