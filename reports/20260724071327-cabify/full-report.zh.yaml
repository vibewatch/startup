              Cabify 近期历史的战略主线，是主张可持续性和盈利能力可以同步推进，而不是先后完成。Cabify 自有材料和合作伙伴报道称，公司自 2018 年起实现碳中和，借助 EIB 支持在西班牙融资投放 1,400 辆
