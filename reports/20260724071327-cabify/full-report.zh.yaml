      - number: '8.2'
        title: 为什么业务可能值得支持
        blocks:
          - type: paragraph
            body: >-
              Cabify 的公开盈利能力显著改善了估值讨论。如果披露的 2024 年毛利和 EBITDA 在方向上可持续，Cabify 就不只是另一家追逐规模的出行运营商。盈利能力提高战略选择权，支撑被收购或最终 IPO
              的可能性，也意味着买方或公众市场投资者购买的是一个运转中的业务，而不只是市场份额。相较历史同行叙事，这是一次有意义的升级。问题在于，公开证据还没有从盈利标题通向经审计的股权收益信心。公开同行分析在这里也重要。Uber
              和 Lyft 可以通过申报文件、EBITDA 和现金流讨论来做基准，而 Cabify 不能。这种不对称应降低精确度，而不是抹掉支持。一家拥有 Cabify
              所报道收入和盈利指标的公司，比完全没有盈利证据的投机型市场平台更有意思。实际解读是，Cabify 已经有资格被当作严肃运营资产分析；但还没有资格用狭窄的公开市场置信区间估值。这个组合支持继续跟踪
              IPO、收购或资料充分的融资事件，以重置证据基础。
