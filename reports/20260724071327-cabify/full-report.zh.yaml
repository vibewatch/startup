      - number: '5.3'
        title: 电动化、集成与隐藏依赖
        blocks:
          - type: paragraph
            body: >-
              Cabify 的 EV 转型既是产品承诺，也是运营依赖。可持续页面和 EV
              融资披露显示，西班牙零排放行程并非假设；它是一个由资本承诺和车辆投放支撑的明确产品目标。公开开发者界面也说明，公司已经搭出足够集成深度，可支持合作伙伴和物流用户。不过，几项重要技术依赖仍不透明，包括路径规划、支付、云、身份、数据安全认证和模型治理实践。因此，投资者可以承销产品成熟度，但还不能画出干净的可防守性地图。隐藏依赖问题因此居于核心。Cabify
              的公开材料足以证明真实产品复杂度，但不足以映射完整供应商或架构栈。一些最重要的执行约束并不在纯软件内部：融资来的 EV
              供给、城市特定监管、外部身份工具、本地市场经济性，以及一座城市变得不具吸引力或突然可行时快速本地化运营的能力。这个组合意味着，Cabify
              的技术应被理解为一部分软件平台、一部分运营控制系统。产品真实且多界面，但护城河更多来自执行，而不是纯技术。因此，平台可信，却仍解释不足。
