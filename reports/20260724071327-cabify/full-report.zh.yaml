      - number: '4.2'
        title: 收入模式与单位经济性框架
        blocks:
          - type: paragraph
            body: >-
              Cabify
              以熟悉的市场平台内核变现，但在上面叠加企业工作流价值，可能改善盈利质量。基础模式很可能是对行程抽佣，对照行业抽成率通常落在十几个点到二十几个点中段；公司还可能从企业项目和忠诚度功能中获得额外经济性。企业产品重要，因为集中账单、政策控制和集成能降低促销强度、提高留存，尤其相对于纯消费者非必需需求更是如此。话虽如此，Cabify
              不公开披露分部贡献利润、抽成率或行程层面经济性，因此更优单位经济性能够持久这一论点仍是有迹象、未证明。公开产品界面也暗示，Cabify 的变现深度可能不止单一佣金流。消费者 app
              仍在营销重复使用和多服务行为；开发者与物流文档则显示，公司已经搭出一些接口，未来可支撑嵌入式或企业工作流。这些界面并不能证明今天有实质收入，却提示有选择权。约束在于，Cabify
              不披露这些延伸带来多少收入，因此业务可以被描述为潜在多元化，但分部仍不透明。这让变现故事有吸引力，却仍只得到部分公开证据支撑。
