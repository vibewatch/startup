      - CR008
      - CR010
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FR002
    title: 风险传导流
    type: flow
    layout: standard
    summary: 外部规则和竞争压力会传导为供给、成本和利润率结果。
    data:
      nodes:
        - id: rules
          label: 监管与劳动法
          type: input
        - id: rivals
          label: 竞争对手
          type: input
        - id: supply
          label: 供给可用性
          type: process
        - id: cost
          label: 成本结构
          type: process
        - id: earn
          label: 盈利耐久度
          type: output
      edges:
        - from: rules
          to: supply
          label: 许可与义务
        - from: rules
          to: cost
          label: 劳动负担
        - from: rivals
          to: supply
          label: 司机竞争
        - from: rivals
          to: earn
          label: 定价压力
        - from: supply
          to: earn
          label: 服务容量
        - from: cost
          to: earn
          label: 利润率影响
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR008
      - CR015
      - CR017
      - CR023
  - id: FR003
    title: 风险抵消区间
    type: range
    layout: standard
    summary: 盈利能力可以缓释结构性风险，但无法消除这些风险。
    data:
      items:
        - label: 盈利对监管风险的缓释
