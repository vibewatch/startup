  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争栈与直接可比对象
        blocks:
          - type: paragraph
            body: >-
              Cabify 的直接竞争者横跨全球巨头、区域颠覆者和本地既有交通。Uber 是最相关的全球基准，因为它把消费者出行、相邻物流和企业采购工具放在远大得多的规模上。Bolt
              重要，因为它在欧洲及相邻垂直领域扩张激进。inDrive 重要，因为它用更灵活的市场逻辑争夺价格敏感的乘客和司机。DiDi 和 Lyft 在 Cabify
              所有市场中并不总是日常直接威胁，更多是参照点；出租车则是直接替代品，因为 Cabify 自己也把出租车供给接入 app。实际要点是，Cabify 面对的不是一个单一巨型对手。它同时面对几种模型：Uber
              是完全规模化的全球基准，Bolt 是激进的多垂直私营挑战者，inDrive
              是价值导向市场，出租车或公共交通则在许多城市行程中持续替代。每个竞争者攻击乘客和司机行为的不同部分。因此，即使公开披露一个单一市场份额数字，也不足以完整解释 Cabify 的竞争位置。另一个含义是，比较
              Cabify 必须按分部看，而不能只看总规模，因为企业出行、受监管供给和消费者出行创造的是完全不同的胜出条件。单靠定价解释不了这个品类。
