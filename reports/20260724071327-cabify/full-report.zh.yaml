companyProfile:
  summary: >-
    Cabify 是一家创立于马德里的出行平台，把受监管的城市交通、企业差旅管理和越来越明确的可持续叙事放在一起。公开来源显示，这家公司已有真实规模、覆盖城市广，产品深度也不止于一款消费者叫车
    app；但治理、股权结构和分部经济性仍披露有限。
