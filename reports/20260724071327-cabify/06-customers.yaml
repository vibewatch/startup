chapter:
  number: 6
  title: Customers
  summary: 'Cabify serves two customer systems at once: urban riders and enterprise mobility buyers. Public evidence strongly supports the existence of both, but the public data is much better on breadth than on monetized cohorts, retention, or concentration.'
sections:
- id: customer-map
  title: Who pays Cabify
  body: 'Cabify serves both riders and enterprise mobility buyers, and the public evidence for both segments is strong even if monetized cohort detail is not. Rider breadth is supported by the company’s multi-city footprint and its continued consumer app presence. Enterprise demand is supported by product depth: centralized billing, policy controls, reporting, and verticalized use cases for hospitality, events, legal, healthcare, and finance. That is important because Cabify’s customer system is not a pure B2C marketplace. The economic value of the business likely depends in part on the mix between discretionary riders and policy-managed corporate travel. Public customer proof is also richer on workflows than on logos. Cabify names expense integrations, guest-travel use cases, insurer assistance, patient transfers, and hospitality workflows, all of which help verify that the B2B layer is real. What the company does not reveal is a long list of marquee end customers. That means the chapter
    can confidently describe buyer types and use cases, but not customer concentration by logo. For investors, that distinction matters because workflow credibility is a good adoption signal, while named-account disclosure is stronger proof of enterprise stickiness and commercial quality. The company also still maintains active public-facing content, reinforcing that brand communication serves both riders and business users.'
