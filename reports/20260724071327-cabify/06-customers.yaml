- id: adoption-and-durability
  title: Adoption signals and durability
  body: The adoption signals visible in public sources are broad but imperfect. Incognia’s March 2026 release cites more than 50 million registered users, about 1.5 million driver partners, and more than 1,000 employees, which supports the view that Cabify is operating at substantial scale. The separate driver app reinforces supply-side adoption, while 2024 profitability suggests the active customer base is not purely subsidized. The missing piece is durability proof. Cabify does not publicly disclose monthly actives, enterprise concentration, churn, or satisfaction metrics, so public evidence supports scale and plausibility more strongly than retention quality. Aggregate business proof improves the picture somewhat. Mexico Business News reported that more than 4,500 companies had hired Cabify for Businesses in Latin America, which is older evidence but still useful because it demonstrates enterprise adoption at meaningful scale. Public app-store and driver-supply signals also show that
    Cabify is not a thin two-sided network. Even so, aggregate counts are not the same as current active cohorts. Without MAU, churn, ride frequency, or renewal data, the chapter can only say that adoption appears broad and plausible, not that retention is best-in-class. Public evidence therefore supports existence, breadth, and some enterprise relevance, but not true cohort durability.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU011
  - CU015
  - CU019
