chapter:
  number: 7
  title: Risks
  summary: Cabify’s key risks are not abstract startup risks; they are concrete regulatory, competitive, and disclosure risks attached to a scaled private mobility platform. The biggest issue is Spanish VTC regulation, followed by changing gig-work rules in Latin America, exposure to better-capitalized rivals, and incomplete disclosure on customer concentration and earnings quality.
sections:
- id: regulatory-risk
  title: Regulatory and legal risk
  body: 'Cabify’s top risk is regulation, not demand. Spain’s VTC framework makes licensed supply a political and legal variable, and recent disputes in Madrid and Valencia show that practical access can still change city by city. The one-to-30 ratio is not merely symbolic; it has legal history and continues to influence how much growth can be converted into service availability. In Latin America the risk is different but equally material: labor-law changes could make platform economics less flexible or more expensive. Together these factors mean that Cabify’s growth ceiling is shaped by law and licensing at least as much as by product quality. The newer official and quasi-official materials sharpen that reading. Spain’s post-2023 framework does not simply preserve an old ratio; it creates a broader public-interest and regional-implementation context in which Cabify must keep monitoring multiple authorities at once. Colombia’s labor reform does something similar from the cost side by turning
    platform obligations into a live statutory issue. Together, those legal developments mean that Cabify’s downside is driven by policy process as much as by consumer behavior. A profitable operating year cannot neutralize that kind of externally imposed rule change. That makes legal monitoring a permanent operating requirement, not a periodic clean-up task. in practice.'
