- id: why-confidence-remains-limited
  title: Why confidence remains limited
  body: The right recommendation is still watch or research-more because the missing items are exactly the ones that determine whether a valuation is attractive in practice rather than only in theory. Public evidence does not disclose share count, preference stack, debt covenant headroom, secondary marks, or audited earnings. Regulation and labor law also keep the value range fragile. As a result, the valuation stance should be cautiously constructive on fundamentals but low-confidence on exact pricing. Cabify looks worthy of deeper work, not of a high-conviction price target. Database breadth, peer analysis, and rough multiple math improve triangulation, but none of them substitute for capitalization facts. A single hidden preference layer, covenant package, or secondary transaction could move effective common-equity value materially even if enterprise-value heuristics look attractive. That is why the recommendation remains watch or research-more. The business case appears credible; the
    equity case is still structurally under-disclosed. In late-stage private companies, that distinction is often the difference between a good company and a good security. Until those items are supplied privately, even a seemingly cheap headline multiple should be treated carefully. That is the core unresolved investment question today.
