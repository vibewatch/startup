- id: why-the-business-may-deserve-support
  title: Why the business may deserve support
  body: Cabify’s public profitability materially improves the valuation conversation. If the reported 2024 gross profit and EBITDA are directionally durable, Cabify is not just another scale-chasing mobility operator. Profitability increases strategic optionality, supports the case for acquisition or eventual IPO, and means a buyer or public investor would be paying for a functioning business rather than only market share. Relative to historical peer narratives, that is a meaningful upgrade. The problem is that public evidence does not yet bridge from profitability headline to audited equity-yield confidence. Public peer work also matters here. Uber and Lyft can be benchmarked through filings, EBITDA, and cash-flow discussions, while Cabify cannot. That asymmetry should reduce precision, not erase support. A company with Cabify’s reported revenue and profitability markers is more interesting than a speculative marketplace with no earnings evidence at all. The practical read is that Cabify
    has earned the right to be analyzed as a serious operating asset; it has not yet earned the right to be valued with narrow public-market confidence bands. That combination justifies continued monitoring for an IPO, acquisition, or well-documented financing event that could reset the evidence base.
  claimRefs:
