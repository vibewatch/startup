company:
  name: Cabify
chapter:
  number: 8
  title: Valuation
  summary: 'Cabify looks inexpensive against its last clean public unicorn anchor if 2024 profit and revenue claims are reliable, but public evidence is not sufficient to issue a conviction-style valuation call. The best-supported stance is watch or research-more: the company appears real, scaled, and profitable, yet equity price discovery after 2018 remains opaque.'
sections:
- id: anchor-and-range
  title: Public valuation anchors and range framing
  body: 'Cabify’s valuation problem is not a lack of operating signal; it is a lack of current price discovery. The cleanest public anchor is still the 2018 $1.4 billion unicorn round. That mark is old, but it remains useful because later capital events did not come with a disclosed public post-money. On rough public math, a 1.5x to 2.0x revenue frame around 2024 revenue produces a range from roughly $1.3 billion to $1.7 billion, close enough to the stale unicorn anchor that the mark does not look absurd. The challenge is that the 2023 and 2024 capital events may have changed the effective equity value materially without public disclosure. Fresh private-company trackers help keep the discussion alive, but they do not solve the core problem. They can suggest that Cabify still belongs in the billion-dollar class, yet they do not reveal the current share count, option overhang, preference structure, or debt seniority that determines what common equity is really worth. That is why the range
    can be directionally useful without being decision-grade. For valuation work, stale price anchors are not worthless; they are simply vulnerable to hidden structural changes that public media and databases cannot fully expose. The right way to use the range is therefore as a disciplined question set: what capital-structure facts would move Cabify above or below the stale unicorn mark?'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
