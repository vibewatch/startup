- id: TV006
  title: Private valuation confidence penalties
  columns:
  - Missing input
  - Why it lowers confidence
  - Practical effect
  rows:
  - - Diluted share count
    - No per-share valuation basis
    - Forces enterprise-value heuristics only
  - - Preference stack
    - Unknown common-equity waterfall
    - Could compress residual equity value
  - - Debt terms and covenants
    - Unknown senior claims and stress triggers
    - Limits downside confidence
  - - Audited earnings / FCF
    - No clean yield or conversion analysis
    - Prevents high-conviction multiple selection
  - - Country-level profit mix
    - Scenario weighting stays fuzzy
    - Raises discount for concentration uncertainty
  notes: These are the main reasons the recommendation remains research-more despite attractive business signals.
