  topStrengths:
  - Public 2024 reporting suggests Cabify is both scaled and profitable, a rare combination in ride-hailing.
  - Cabify Business and related workflow tooling create a potentially stickier enterprise wedge than a pure consumer ride app.
  - Cabify still appears well positioned in regulated Spanish and Latin American corridors where local execution can matter more than global sprawl.
  topRisks:
  - Spanish VTC regulation remains the most material supply-side constraint in a core market.
  - Public disclosure on cap table, debt terms, share count, and board rights is thin for a company of this maturity.
  - LATAM labor-law and macro volatility can pressure cost structure and translated earnings.
  unresolvedGaps:
  - Current diluted share count and liquidation preferences.
  - Audited financial statements and cash-flow detail.
  - Country and segment contribution margins, especially Spain versus LATAM and B2B versus consumer.
  - Licensing inventory and permit exposure by city.
