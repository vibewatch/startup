companyProfile:
  summary: Cabify is a Madrid-founded mobility platform that combines regulated urban transport, corporate travel management, and an increasingly explicit sustainability narrative. Public sources show a business with real scale, broad city coverage, and product depth beyond a consumer rider app, but still limited public disclosure on governance, cap-table structure, and segment economics.
