- id: revenue-model-and-unit-economics
  title: Revenue model and unit-economics framing
  body: Cabify monetizes a familiar marketplace core but overlays it with enterprise workflow value that could improve earnings quality. The likely base model is a commission on rides, framed against industry take-rate norms that often sit in the mid-teens to mid-twenties, with additional economics from corporate programs and possibly loyalty features. The corporate product matters because centralized billing, policy controls, and integrations can reduce promo intensity and increase retention, especially relative to purely consumer-discretionary demand. That said, Cabify does not publicly disclose segment contribution margins, take rates, or ride-level economics, so the case for durable superior unit economics remains suggestive rather than proven. Public product surfaces also imply Cabify may have more monetization depth than a single commission stream. The consumer app still markets repeat-use and multi-service behavior, while developer and logistics documentation show the company has
    built interfaces that could support embedded or enterprise workflows over time. Those surfaces do not prove material revenue today, but they do suggest optionality. The constraint is that Cabify does not disclose what portion of revenue comes from those extensions, so the business can be described as potentially diversified but not yet transparently segmented. That keeps the monetization story promising but still only partially evidenced publicly.
