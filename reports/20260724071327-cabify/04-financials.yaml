chapter:
  number: 4
  title: Financials
  summary: 'Cabify’s public financial story is unusual for ride-hailing: revenue is large, growth has been meaningful, and 2024 public reporting points to positive gross profit and EBITDA rather than ongoing heavy losses. The open question is not whether Cabify built a real business, but whether recent profitability is durable and how much of it comes from market mix, corporate accounts, or under-disclosed cost controls.'
sections:
- id: reported-results
  title: Reported revenue and profitability
  body: 'Public financial coverage supports the conclusion that Cabify is operating at meaningful scale and that 2024 was not another subsidy-heavy growth year. Multiple outlets converge on revenue near $858 million in 2024, while 2023 was somewhat higher at about $899 million. The more important signal is profitability: independent coverage cites roughly $127 million of gross profit and about $34 million of EBITDA in 2024, with claims that all operating countries were profitable. This does not equal a full audited earnings pack, but it is materially stronger evidence than the generic high-growth private-company narrative common in mobility. The slight top-line moderation from 2023 to 2024 is better read as normalization after rebound growth than as a broken demand story. The existence of several independent media references matters because Cabify does not publish an audited investor packet. The signal here is therefore one of triangulation rather than direct management disclosure. Even
    so, the consistency of 2024 revenue, profit, and EBITDA markers across separate outlets makes it hard to dismiss the result as narrative inflation. The remaining caution is that revenue quality, cash conversion, and one-time items are still hidden from outsiders, which means the topline and profitability markers are useful but incomplete for underwriting normalized earnings. today.'
