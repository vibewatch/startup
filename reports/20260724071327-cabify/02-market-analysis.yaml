- id: constraints-and-market-access
  title: Constraints, regulation, and market access
  body: 'Spain’s VTC regime is the most important structural constraint on Cabify’s addressable market. The one-to-30 ratio, state and local permit layers, and continued court and regulator involvement mean that supply is not freely added when demand increases. In economic terms, the market can be large and still hard to capture because permit scarcity caps capacity. That constraint cuts both ways. If Cabify has access to the right licenses and operating partners, scarcity can protect utilization and pricing. If it lacks supply, market growth becomes someone else’s upside. The resulting investment question is not whether ride-hailing demand exists in Spain and Latin America, but whether Cabify can translate regulatory access into durable share without reigniting subsidy-heavy competition. Regulation also affects the market narrative in another way: it introduces scarcity economics. In a free-entry model, every incremental rider can attract more driver supply and new competitors. In Spain,
    incremental demand can instead collide with quota rules, local administrative requirements, and litigation risk. That is why Cabify’s addressable market should be thought of as filtered demand rather than total theoretical demand. The strongest market opportunity is therefore in cities where Cabify can pair enough licensed supply with business buyers that care about predictable service and compliance, not only the lowest nominal fare.'
