company:
  name: Cabify
chapter:
  number: 2
  title: Market Analysis
  summary: Cabify operates in markets that are structurally attractive but heavily shaped by regulation. The addressable demand spans consumer urban rides and corporate mobility across Spain and Latin America, with independent market reports pointing to double-digit category growth. The key twist is that Cabify’s most important market, Spain, also carries the most binding VTC constraints, meaning market share is a function of licensed supply and service quality as much as raw app demand.
sections:
- id: market-size
  title: Market size and growth context
  body: 'Independent research firms broadly agree that ride-hailing remains a large, still-growing category. The absolute numbers vary by methodology, but the directional message is stable: global ride-hailing demand is already measured in the tens or low hundreds of billions of dollars and is expected to compound at low- to mid-teens rates for years. Latin America is a smaller but still material region, while Spain is a relatively compact market that can still be strategically important because of density, income, and regulatory scarcity. For Cabify, that means TAM is not the gating variable. The harder questions are where licensed supply can be obtained, which cities support premium or business-focused positioning, and how much of the category can be served without subsidized price wars. A practical implication for Cabify is that the category can remain attractive even if public TAM estimates are noisy. What matters more is whether the company can capture high-frequency demand in large
    metropolitan corridors where riders repeatedly need airport transfers, commuting alternatives, and managed transport during irregular hours. Spain may be a smaller absolute market than some Latin American geographies, yet its purchasing power, tourism flows, and dense business activity can still make it disproportionately important to margin quality. That keeps the opportunity investable.'
