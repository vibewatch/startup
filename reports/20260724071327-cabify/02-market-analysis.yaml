- id: buyers-and-demand-drivers
  title: Buyer segments and demand drivers
  body: 'Cabify sells into two overlapping but economically distinct buyer groups: consumers buying urban convenience and companies buying managed transport workflows. The business product introduces centralized invoicing, policy controls, expense allocation, and integrations that matter far more to corporate buyers than small fare differences. Consumer demand is supported by urbanization, congestion, and public-transport gaps, while business demand is supported by airport transfers, guest mobility, events, and employee travel. This matters because procurement-led demand is often stickier and less promotion-sensitive than pure consumer app switching. Cabify’s sustainability narrative also has more strategic value in B2B than in mass-market consumer acquisition because procurement teams can attach emissions goals to vendor selection. This split also changes how the market should be sized. Consumer trip demand is influenced by congestion, nightlife, airport traffic, and local transit gaps,
    while enterprise demand is influenced by travel policies, reimbursement rules, guest logistics, and duty-of-care requirements. Those are not identical demand drivers. The more Cabify can keep serving enterprise use cases that value reporting and policy control, the less the business depends on constantly winning price-sensitive discretionary trips that can switch between apps with little friction.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
