- id: where-cabify-loses
  title: Where Cabify remains exposed
  body: 'Cabify remains at a disadvantage in any contest that is won mainly by subsidized pricing, balance-sheet endurance, or global network effects. Uber has the broadest capital base and strongest product sprawl, Bolt continues to press into adjacent use cases, and inDrive can appeal strongly where riders and drivers prioritize price flexibility over curated service. Public information also leaves important comparison gaps unresolved, including city-level share, driver churn, and take-rate differences. That means competition analysis should be framed probabilistically: Cabify does not need to dominate the entire category to be valuable, but it does need enough protected, high-quality demand to avoid being pulled into a race it cannot finance. This exposure is amplified by the fact that riders and drivers often multi-home. A company like Cabify may win on service quality or procurement fit and still lose marginal trips when another platform runs promotions or has better instantaneous supply
    in a given corridor. The substitute set is also broader than other apps; taxis, transit, and private cars remain viable alternatives on many routes. For investors, that means Cabify’s defensibility must be demonstrated through economics and retention, not assumed from app presence alone. That uncertainty keeps the downside case materially open.'
