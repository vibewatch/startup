chapter:
  number: 3
  title: Competitors
  summary: 'Cabify competes against better-capitalized global or regional platforms, but its strongest differentiation is not scale. It is the combination of regulated Spanish and Latin American presence, visible profitability, and an enterprise-facing mobility workflow that many rivals emphasize less directly in public materials. Competition is therefore best understood as a stack: global app giants, regional value disruptors, local taxis and fleets, and public transit substitutes.'
sections:
- id: competitive-stack
  title: Competitive stack and direct comparators
  body: 'Cabify’s direct competitor set spans global giants, regional disruptors, and local incumbent transport. Uber is the most relevant global benchmark because it combines consumer mobility, adjacent logistics, and enterprise procurement tools at a vastly larger scale. Bolt matters because it has expanded aggressively across Europe and adjacent verticals. inDrive matters because it competes for price-sensitive riders and drivers through a more flexible marketplace logic. DiDi and Lyft matter more as reference points than as day-to-day direct threats in all of Cabify’s markets, while taxis remain a direct substitute because Cabify itself integrates taxi supply into its app. The practical point is that Cabify does not face one monolithic rival. It faces several models at once: Uber as the fully scaled global benchmark, Bolt as the aggressive multi-vertical private challenger, inDrive as the value-led marketplace, and taxis or transit as constant substitutes on many city trips. Each competitor
    attacks a different part of rider and driver behavior. That is why a single market-share number would not fully explain Cabify’s competitive position even if it were disclosed publicly. Another implication is that Cabify must be compared by segment, not only by total scale, because enterprise mobility, regulated supply, and consumer trips create very different win conditions. Pricing alone cannot explain the category.'
