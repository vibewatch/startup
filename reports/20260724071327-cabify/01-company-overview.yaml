- id: milestones-and-strategic-priority
  title: Milestones, sustainability, and adverse context
  body: The strategic through-line in Cabify’s recent history is the claim that sustainability and profitability can advance together rather than sequentially. Cabify’s own materials and partner coverage say the company has been carbon neutral since 2018, financed 1,400 EVs in Spain with EIB support, and added 200 more electric vehicles in Madrid through Vecttor. The company’s 2026-2029 ESG plan elevates environment, accessibility, and governance to strategic pillars, while the impact-chain page presents 2025 collaboration with more than 100 institutions as evidence that Cabify sees partnerships as part of distribution and legitimacy, not just philanthropy. At the same time, the timeline is not one-directional because regulatory friction and missing post-money disclosure still matter. It also frames Cabify as a company whose next diligence step should focus on capital structure rather than whether there is a real underlying business.
  claimRefs:
