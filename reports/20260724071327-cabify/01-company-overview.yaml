- id: leadership-and-governance
  title: Leadership, governance, and disclosure quality
  body: The publicly corroborated founder and operating leader is Juan de Antonio, who continues to appear as founder and CEO across Tracxn, GetLatka, current financial-result coverage, and recent financing press. Around him, public disclosures surface a narrower but still meaningful executive set, including CFO Juan Barbolla and business leader Daniel Bedoya. What is less visible is just as important. Retained public sources do not provide a fully detailed board roster, preference summary, or governance-rights map, which is a notable gap for a private operator of Cabify’s maturity and scale. Public sources also do not corroborate a second cofounder with the same consistency as Juan de Antonio, so any broader founder roster should be treated as an open diligence item rather than a cover fact. That disclosure gap is not fatal, but it matters because late-stage private-company value is heavily shaped by board rights, preference seniority, and executive succession depth. Until those details
    are supplied privately, the leadership picture remains good enough for identity and strategy, but incomplete for control analysis.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO035
  tableRefs:
  - TO002
  - TO003
  figureRefs: []
- id: capital-and-economics
  title: Funding history, valuation anchor, and economic scale
  body: 'Cabify’s public capital history shows a company that reached unicorn status early, then shifted from mega-round narratives toward disciplined balance-sheet support and profitability proof. Tracxn’s 2026 funding page still anchors the unicorn story in the January 2018 US$160M round at a US$1.4B post-money mark. More recent capital events are better documented in size than in pricing: the March 2023 financing totaled US$110M, January 2024 added a €15M BBVA Spark venture-debt line, and June 2024 added a further €18.7M from existing shareholders. Operating-scale disclosure has improved more than governance disclosure. GetLatka and El Referente place 2023 revenue at about US$899.1M, while multiple 2025 news reports say 2024 revenue held near US$858M with gross profit around US$127M and EBITDA near US$34M.'
