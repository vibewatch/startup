chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Cabify operates as a regulated urban-mobility marketplace with a broader product surface than the label
              ride-hailing suggests. The consumer app still advertises private-car rides, taxis, deliveries, and
              selected micromobility or car-rental options, while the business product adds centralized invoicing, cost
              centers, trip policies, and ERP connectivity. Current official and third-party sources converge on a
              smaller but more focused footprint than Cabify once promoted in earlier growth years: the official English
              homepage and the March 2026 Incognia partnership both describe a company active in 6 countries and more
              than 40 cities across Spain and Latin America. That footprint matters because Cabify is now selling
              reliability, quality control, and regulated service in markets where VTC supply, airport flows, and
              corporate procurement can be defended more rationally than pure mass-market discounting. Cabify also
              benefits from showing both consumer and business demand within a single brand, which reduces the risk that
              it is evaluated as a single-purpose commuter app. For investors, the consequence is that footprint alone
              understates the breadth of use cases Cabify is trying to capture across airports, commuting, events, and
              managed employee travel.
