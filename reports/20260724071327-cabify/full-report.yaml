      - number: '5.3'
        title: Electrification, integrations, and hidden dependencies
        blocks:
          - type: paragraph
            body: >-
              Cabify’s EV transition is both a product promise and an operational dependency. Sustainability pages and
              EV-financing disclosures show that zero-emission rides in Spain are not hypothetical; they are a stated
              product objective backed by capital commitments and vehicle rollout. The public developer surface also
              suggests the company has built enough integration depth to support partners and logistics users. Still,
              several important technical dependencies remain opaque, including routing, payments, cloud, identity,
              data-security certifications, and model-governance practices. Investors can therefore underwrite product
              maturity, but not yet a clean defensibility map. The hidden-dependency question is therefore central.
              Cabify’s public materials reveal enough to show real product complexity, but not enough to map the full
              vendor or architecture stack. Some of the most important execution constraints sit outside software
              purity: financed EV supply, city-specific regulation, external identity tooling, local market economics,
              and the ability to localize operations quickly when a city becomes unattractive or newly viable. That
              combination means Cabify’s technology should be read as part software platform, part operational control
              system. The product looks real and multi-surface, but the moat remains more executional than purely
              technical. The platform is therefore credible but still under-explained. overall.
