      - number: '5.2'
        title: Trust, safety, and operating intelligence
        blocks:
          - type: paragraph
            body: >-
              Cabify’s public materials suggest that operational trust is a first-order product concern. App-store
              descriptions emphasize safety features, while the March 2026 Incognia partnership shows the company still
              invests in fraud prevention around account sharing, fake identities, and promo abuse. For a mobility
              platform, those issues affect not just user trust but direct margin leakage. Cabify almost certainly uses
              dynamic pricing, route optimization, and risk controls as table-stakes algorithms, but public evidence is
              better on the problem set than on the proprietary implementation. That means the technology story should
              be read as credible and mature but not fully transparent. The trust story is broader than passenger safety
              messaging alone. Public app listings show safety and trip-confidence features, while partner announcements
              show Cabify still investing in device intelligence and anti-abuse tooling. Together, those signals imply
              that product quality for Cabify includes identity assurance, fraud prevention, and operational integrity.
              The limitation is that no public source quantifies fraud loss, algorithm lift, false-positive rates, or
              uptime. So the operating stack looks serious, but outsiders still cannot tell whether Cabify merely meets
              category norms or has built a genuinely superior risk engine. That keeps the strongest product argument
              centered on disciplined operations, not black-box algorithm claims.
