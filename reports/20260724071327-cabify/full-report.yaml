        title: Leadership, governance, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The publicly corroborated founder and operating leader is Juan de Antonio, who continues to appear as
              founder and CEO across Tracxn, GetLatka, current financial-result coverage, and recent financing press.
              Around him, public disclosures surface a narrower but still meaningful executive set, including CFO Juan
              Barbolla and business leader Daniel Bedoya. What is less visible is just as important. Retained public
              sources do not provide a fully detailed board roster, preference summary, or governance-rights map, which
              is a notable gap for a private operator of Cabify’s maturity and scale. Public sources also do not
              corroborate a second cofounder with the same consistency as Juan de Antonio, so any broader founder roster
              should be treated as an open diligence item rather than a cover fact. That disclosure gap is not fatal,
              but it matters because late-stage private-company value is heavily shaped by board rights, preference
              seniority, and executive succession depth. Until those details are supplied privately, the leadership
              picture remains good enough for identity and strategy, but incomplete for control analysis.
