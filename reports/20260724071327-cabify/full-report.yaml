        title: Capital stack and funding requirements
        blocks:
          - type: paragraph
            body: >-
              Cabify’s balance-sheet story suggests a company that no longer depends exclusively on fresh high-multiple
              equity to keep operating. The company has raised about $517 million cumulatively, but the most recent
              visible balance-sheet additions were a mixed 2023 financing, a 2024 venture-debt line from BBVA Spark, and
              a 2024 insider-supported capital injection. That pattern can be interpreted positively because lenders and
              existing investors continued to support the company after profitability improved, but it also means equity
              pricing visibility is weak. The absence of debt covenant, maturity, and cash-flow detail limits certainty
              on how much of current profitability converts into durable financial flexibility. The broader financial
              read is that Cabify now looks like a company financing selective priorities rather than simply plugging
              operating losses. Venture debt, insider support, and EV-linked project financing all suggest a balance
              sheet being used to shape growth and sustainability outcomes. That is constructive, but not automatically
              cheap. Investors still need to know whether capital providers are comfortable because cash generation is
              strong or because governance and collateral give them protection that common-equity holders do not see
              publicly. That uncertainty is why disclosure quality remains central to the final valuation view.
