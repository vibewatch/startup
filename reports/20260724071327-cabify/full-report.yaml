      - number: '7.2'
        title: Competitive, macro, and customer risk
        blocks:
          - type: paragraph
            body: >-
              Competition risk remains high because Uber, Bolt, and price-led platforms can still use scale or
              incentives to put pressure on fares and driver supply. Cabify’s focus helps, but focus also means
              concentration. The company is exposed to macro and FX volatility across Latin America and to corporate
              travel budgets through its B2B business. Customer concentration cannot be scored precisely because public
              disclosures are thin. The key mitigation visible publicly is profitability: a profitable mobility operator
              can survive pressure better than a cash-burning one. This risk stack is also interactive. Competitive
              pressure becomes more dangerous when regulatory scarcity limits supply, because Cabify cannot always
              respond by simply adding drivers or lowering frictions. Macro and FX risk matter more when customer
              concentration is under-disclosed, and corporate-travel sensitivity matters more when B2B quality is not
              quantified publicly. Profitability is a real mitigant, but only a partial one. It can buy time and
              optionality; it cannot stop policy, pricing, or concentration shocks from hitting the business model.
              Another implication is that Cabify can be correct on service quality and still see margins compressed if
              rivals or policymakers change the playing field faster than customer behavior changes. This is why
              concentration, pricing, and regulation cannot be analyzed separately. over time.
            claimRefs:
