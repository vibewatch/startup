      - number: '7.3'
        title: Execution, technology, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Cabify also carries execution and disclosure risk that matter more at its stage than they would at seed.
              Electrification requires capital and operational follow-through. Trust and fraud controls need to keep
              pace with account abuse and safety incidents. Governance transparency remains weaker than ideal for a
              late-stage private company, and debt structure cannot be assessed cleanly because public term detail is
              sparse. These are manageable risks if the company’s earnings power is real, but they become more serious
              under a weaker macro or regulatory scenario. The disclosure problem raises the severity of every other
              risk because it prevents investors from measuring how much cushion really exists. If Cabify disclosed
              license inventories, reserve schedules, market-level concentration, and covenant headroom, outsiders could
              separate manageable risks from existential ones. Without that detail, regulatory, legal, and operating
              risks compound. The right read is therefore not that Cabify is uniquely fragile, but that several
              important downside paths remain wider than they should be for a company of this maturity and scale. In
              practice, thin disclosure widens scenario ranges even when management may be handling the business well
              internally. Investors therefore face a wider uncertainty cone.
