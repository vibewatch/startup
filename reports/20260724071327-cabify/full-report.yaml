    title: Product & Technology
    sections:
      - number: '5.1'
        title: Visible product surface
        blocks:
          - type: paragraph
            body: >-
              Cabify’s visible product surface spans much more than a single rider app. The company still markets a
              consumer app on iOS and Android, a distinct driver app, a corporate mobility console, and a public
              developer surface for logistics or embedded workflows. Product maturity is most obvious in the business
              stack, where expense controls, user groups, invoicing, and integrations imply software sold into ongoing
              operations rather than only one-off trip demand. This matters because product breadth can improve
              retention even if the core ride-booking experience looks similar to category peers. The product surface
              also appears intentionally segmented by user role. Riders see choice, scheduling, and mobility options;
              drivers see a separate operational tool; corporate buyers see controls, invoicing, and admin policies; and
              developers see logistics and onboarding materials. That structure suggests Cabify thinks about product
              delivery as a system of specialized interfaces rather than a single mobile app. For diligence purposes,
              this is meaningful because role-specific surfaces often correlate with better workflow fit and lower
              switching for enterprise or supply-side users. It also suggests Cabify can evolve one user surface without
              rewriting every other workflow, which is useful in a multi-country business that must adapt products to
              regulation, procurement, and driver operations at the same time. across markets.
