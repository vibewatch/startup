  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market size and growth context
        blocks:
          - type: paragraph
            body: >-
              Independent research firms broadly agree that ride-hailing remains a large, still-growing category. The
              absolute numbers vary by methodology, but the directional message is stable: global ride-hailing demand is
              already measured in the tens or low hundreds of billions of dollars and is expected to compound at low- to
              mid-teens rates for years. Latin America is a smaller but still material region, while Spain is a
              relatively compact market that can still be strategically important because of density, income, and
              regulatory scarcity. For Cabify, that means TAM is not the gating variable. The harder questions are where
              licensed supply can be obtained, which cities support premium or business-focused positioning, and how
              much of the category can be served without subsidized price wars. A practical implication for Cabify is
              that the category can remain attractive even if public TAM estimates are noisy. What matters more is
              whether the company can capture high-frequency demand in large metropolitan corridors where riders
              repeatedly need airport transfers, commuting alternatives, and managed transport during irregular hours.
              Spain may be a smaller absolute market than some Latin American geographies, yet its purchasing power,
              tourism flows, and dense business activity can still make it disproportionately important to margin
              quality. That keeps the opportunity investable.
