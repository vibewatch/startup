      - number: '6.3'
        title: Concentration risk and information gaps
        blocks:
          - type: paragraph
            body: >-
              Cabify’s customer risk likely concentrates in geography and segment rather than in a small set of named
              accounts, but public data is not sufficient to quantify either. Spain and several large Latin American
              capitals appear strategically central, yet no public mix shows what proportion of riders, drivers, or
              revenue comes from each. The same is true for B2B versus B2C mix. This limits the customer chapter’s
              precision because customer concentration is one of the most important inputs to margin durability and
              regulatory sensitivity. The best current read is that Cabify’s enterprise product creates a potentially
              sticky base, but the underwriting remains evidence-constrained until account, cohort, and city-level data
              is disclosed. The same limitation affects concentration analysis. Public sources imply that customer
              quality probably varies by market, by vertical, and by whether demand is policy-managed or purely
              discretionary, but they do not quantify those splits. Public proof is also stronger on what kinds of
              customers Cabify serves than on how dependent it is on any one logo, one city, or one country. As a
              result, the underwriting question is less whether Cabify has customers and more whether its best customers
              are concentrated in ways that could surprise investors under a regulatory or macro shock.
