  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Full-suite logistics cross-sell
        - Customers may still use Ninja Van only for one module, limiting wallet share
        - Medium upside if parcel users adopt fulfilment, freight, warehousing, and digital tools together
        - Request attach-rate by service line and cohort migration over time
      - - B2B restock
        - Named proof exists, but public customer list is short
        - Medium upside because B2B restock lifts ACV and embeds Ninja Van deeper in store operations
        - Request top B2B-restock accounts, revenue share, and renewal rates
      - - Cold-chain expansion
        - Product pages are ahead of named customer disclosure
        - Medium upside into pharma, grocery, and temperature-sensitive categories, but evidence quality is still thin
        - Request named production cold-chain customers and route-level KPIs
      - - Marketplace / platform dependence
        - Alibaba-Lazada ties are visible, but revenue or parcel dependence is not disclosed
        - Could create concentration on platform-driven volumes or partner economics
        - Request parcel and revenue share tied to Lazada, Shopee, TikTok Shop, and other channels
      - - Platform disintermediation
        - Shopee and Lazada in-house logistics arms can internalize volume
        - High risk for low-value parcel lanes if Ninja Van fails to move accounts into full-suite relationships
        - Request churn and gross-margin data for platform-originated volumes
      - - Geographic pruning
        - Vietnam express exit implies portfolio rationalization and customer-mix reset
        - Could improve profitability but also narrows parcel-market coverage and weakens continuity for regional accounts
        - Request retained-customer migration plan and service-line profitability by country
    notes: >-
      The table emphasizes mechanism rather than disclosed percentages because neither top-customer concentration nor service-line revenue share is public.
