    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Geography
      - Use case
      - Merchant size / scale
      - Strategic value / gap
    rows:
      - - Online sellers / micro-merchants
        - Founder or ecommerce operator / same / merchant
        - SEA-wide; strongest proof in Singapore and MY/PH integrations
        - Last-mile parcel delivery, COD, dashboard shipping, cross-border parcels
        - Self-serve and no-minimum-volume style accounts
        - Broad top-of-funnel base; revenue mix by micro-merchant cohort is not disclosed
      - - SMEs
        - Owner or ops lead / store and warehouse teams / SME
        - Singapore, Malaysia, Philippines, Indonesia
        - Fulfilment, restocking, returns, multichannel parcel operations
        - Small-to-mid-sized brands scaling beyond ad hoc courier use
        - Core migration path into higher-value logistics products; no public cohort retention disclosed
      - - Enterprise shippers
        - Procurement or supply-chain leader / logistics, DC, transport teams / enterprise brand
        - Best surfaced in Singapore, Malaysia, and the Philippines
        - 3PL, warehousing, freight forwarding, distribution, digital tools
        - Higher-ACV but lower-disclosed-count accounts
        - Clear product intent but thin named public customer list
      - - B2B restocking customers
        - Inventory / replenishment manager / warehouse-store network / brand or distributor
        - Singapore, Malaysia, Indonesia, Philippines
        - Scheduled bulk restock, just-in-time store replenishment, bulk distribution
        - Multi-site retailers and distributors
        - Important bridge from SME parcel users to enterprise supply-chain spend
      - - Cold-chain shippers
        - Commercial or QA lead / cold-chain ops and fleet teams / food, pharma, grocery brand
        - Singapore and Malaysia publicly; Indonesia also markets the module
        - Chilled and frozen deliveries for food, medicines, and other temperature-sensitive goods
        - Specialized vertical accounts rather than general parcel sellers
        - Strong product expansion signal, but named production customers are scarce
      - - Platform-integrated merchants
        - Ecommerce merchant / store ops / merchant
        - MY and PH on Shopify; MY on WooCommerce
        - Order creation, COD, automatic tracking updates, dashboard sync
        - 1,000+ MY WooCommerce installs; Shopify app live for MY/PH
        - Good SME adoption proxy, but install counts are not the same as active shipping accounts
    notes: >-
      Segmentation blends explicit official categories with customer-proof and integration evidence. Buyer-user-payer patterns
      are public-role inferences from the marketed workflows; Ninja Van does not disclose revenue share by segment.
