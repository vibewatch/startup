  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / evidence
      - Limitation
    rows:
      - - MGP Label
        - Singapore fashion ecommerce merchant
        - Cross-border parcel delivery from Singapore to Malaysia
        - Production
        - Public testimonial says some Malaysian customers receive orders within three working days
        - No order volume, spend, renewal, or contract details disclosed
      - - Caramel Monster
        - Singapore merchant / online seller
        - Ongoing parcel delivery with urgent exception handling and delivery updates
        - Production
