  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Public or data-room disclosure of NRR, GRR, logo churn, and renewal cohorts by seller, SME, and enterprise segment.
      whyItMatters: Without cohort retention or churn, durability must be inferred from proxies such as parcel growth, integrations, and testimonials, which is weaker than direct retention data.
      diligencePath: Request annual cohort retention tables, top-20 logo churn history, and contract-duration distributions by country and product.
      relatedQuestionRefs: [QU020]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Exact top-customer, top-platform, and top-service-line revenue or parcel-volume concentration.
      whyItMatters: Platform dependence and large-account exposure are visible in strategy and investor ties, but the public record is not precise enough to quantify downside if a major partner or customer leaves.
      diligencePath: Request revenue and parcel concentration tables for the top 10 customers and channels, including Lazada, Shopee, and enterprise accounts.
      relatedQuestionRefs: [QU021]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: material
      topic: named-cold-chain-proof
      missingEvidence: Named production customers for cold-chain, enterprise pharma, or grocery accounts with outcomes and deployment scope.
      whyItMatters: Cold chain is a key expansion narrative, but public evidence mostly proves service availability rather than customer adoption quality.
      diligencePath: Ask for named cold-chain references, route counts, temperature-compliance KPIs, and customer testimonials from food, grocery, or pharma accounts.
      relatedQuestionRefs: [QU024]
      relatedTableRefs: [TU003, TU005]
    - type: conflicting-data
      severity: minor
      topic: review-fragmentation
      missingEvidence: Verified internal complaint-rate, CSAT, NPS, and claims-resolution metrics by market.
      whyItMatters: Public review sites are directionally useful but inconsistent in sample size and quality, making it hard to infer whether adverse signal is isolated or systematic.
      diligencePath: Request internal service-quality dashboards showing complaints per 100,000 parcels, resolution time, and customer satisfaction by country.
      relatedQuestionRefs: [QU020]
      relatedTableRefs: [TU004]
