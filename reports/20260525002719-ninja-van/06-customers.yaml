        - No quantified SLA, volume, or NPS disclosed
      - - Mod Parade
        - Singapore fashion ecommerce merchant
        - Recurring customer shipments
        - Production
        - Public testimonial says customers experience consistent deliveries
        - Outcome is qualitative rather than numerical
      - - Una Brands
        - APAC ecommerce aggregator entering the Philippines
        - Warehousing, fulfilment, and last mile for Philippine market entry
        - Pilot-to-production market entry
