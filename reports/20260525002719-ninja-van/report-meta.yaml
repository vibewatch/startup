  productSummary: Tech-enabled logistics workflow stack spanning domestic last-mile delivery, fulfilment, warehousing, cross-border shipping, B2B restocking, cold chain, and merchant dashboard/API tooling.
  customerFocus: Online sellers, SMEs, enterprise shippers, and newer B2B restocking and cold-chain customers across Southeast Asia.
  businessModel: Transactional parcel and logistics fees plus contract-logistics revenue from fulfilment, warehousing, cross-border shipping, B2B delivery, and cold-chain services.
