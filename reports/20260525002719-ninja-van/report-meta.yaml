companyProfile:
  summary: Ninja Van is a Singapore-founded logistics company that has grown from a last-mile e-commerce courier into a broader regional logistics platform covering fulfilment, warehousing, cross-border shipping, B2B restocking, cold chain, and merchant software workflows across six Southeast Asian markets. The business remains founder-led and strategically backed, but the public record since 2024 increasingly frames the company as a late-stage turnaround and optimization story rather than a pure growth narrative.
