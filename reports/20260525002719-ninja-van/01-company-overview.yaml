      "id": "identity-and-business-model",
      "title": "Identity and business model",
      "body": "Ninja Van presents itself as a home-grown Singapore logistics company built for e-commerce merchants, and the current official materials still anchor that identity in the company's 2014 founding story. The Singapore about page says the business was founded by Lai Chang Wen, Boxian Tan, and Shaun Chong after the team tried to solve delivery pain points for their own fashion venture, and the same page now lists a Singapore address at 30 Jalan Kilang Barat. That origin story still matters because the company remains visibly founder-led: the current page metadata names Lai as CEO, Shaun as CTO, and Tan as COO.\n\nThe operating model has also broadened well beyond parcel pickup and drop-off. Official service pages say Ninja Van sells warehousing, transportation, freight forwarding, distribution, last-mile delivery, cross-border shipping, B2B restocking, and cold-chain delivery. The cross-border page highlights tracking, cash-on-delivery support, and a regional network, while the enterprise page frames the company as supply-chain infrastructure rather than a pure courier. That makes the company's current business model best described as a tech-enabled regional logistics platform serving merchants, retailers, and other business shippers, with consumer parcel delivery as only one layer of the stack.",
