    {
      "id": "milestones-and-adverse-developments",
      "title": "Milestones, partnership deepening, and adverse developments",
      "body": "Ninja Van's visible milestone arc is clear even if some private-company metrics are not. The company moved from a 2014 founding story to six-market regional coverage, then to a major 2021 Series E that brought in Alibaba and deepened the GeoPost partnership. By 2024, partner materials were talking less about blitzscaling and more about automation, productivity, B2B restocking, cold chain, and debt capacity. That progression suggests a maturing operator trying to defend efficiency and service breadth instead of just buying share.\n\nThe 2025 news flow introduces the clearest adverse signal in the chapter. Straits Times, Yahoo Finance, and Business Times reported that Ninja Van was discussing an internal US$80 million round at roughly a US$1 billion valuation, far below the tone implied by the 2021 private-market peak. Around the same time, CNA, AsiaOne, and Business Times reported a 12% Singapore workforce reduction after two 2024 layoff rounds. Those events do not erase the company's regional footprint, but they do shift the chapter baseline from pure growth story to late-stage restructuring under funding pressure.",
