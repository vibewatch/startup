  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Ninja Van is a Singapore-founded, founder-led logistics platform that says it now serves six Southeast Asian markets and has expanded from last-mile parcel delivery into warehousing, freight, cross-border shipping, B2B restocking, and cold chain. The company's last clearly disclosed major equity raise was the US$578 million Series E announced in 2021, while 2024 added a US$50 million HSBC revolving credit facility and a partner-backed automation push. By August 2025, however, reporting had shifted to a possible valuation reset to about US$1 billion and a 12% Singapore workforce reduction, making the chapter-1 baseline one of meaningful regional scale but visible late-stage financing and restructuring pressure."
  },
  "sections": [
