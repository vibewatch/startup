      "id": "scale-metrics-and-disclosure",
      "title": "Scale signals and disclosure gaps",
      "body": "The public record supports only a narrow set of current scale metrics, so later diligence should resist treating missing private-company numbers as zeros. Official pages support three visible scale indicators today: the company says it serves six Southeast Asian markets, the Singapore about page says it grew to more than 5,000 fleet units, and the international shipping page says Singapore customers can access 800-plus Ninja Points. Those are useful footprint signals, but they do not reveal current revenue, current active-customer counts, or exact global employee totals.\n\nThat disclosure asymmetry is important because 2025 reporting highlights pressure without providing the denominator metrics an investor would want. News reports describe valuation-reset talks and Singapore layoffs, but the same source pack still does not expose an updated revenue run-rate, exact global headcount, or current merchant count. The right chapter-1 posture is therefore to anchor on the disclosed facts, keep unsupported operating metrics explicitly null, and treat missing commercial detail as a diligence task rather than an invitation to interpolate.",
