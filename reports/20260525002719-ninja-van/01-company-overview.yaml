      "id": "leadership-and-governance",
      "title": "Founders, leadership, and governance visibility",
      "body": "The most visible leadership facts in the public source pack still revolve around the founding trio rather than a broad executive bench. Ninja Van's current structured data names Lai Chang Wen as co-founder and CEO, Shaun Chong as co-founder and CTO, and Tan Boxian as co-founder and COO. CNBC was still describing Lai as co-founder and CEO in 2020, and 2021 fundraising coverage continued to quote him as the main spokesperson. That continuity supports a practical conclusion for later chapters: founder presence remains central to company identity, financing communication, and strategic narrative.\n\nGovernance disclosure is much thinner than funding disclosure. The reviewed official pages and transaction materials do not surface board composition, independent director names, or explicit control-rights detail, even though investor reporting makes clear that Alibaba, GeoPost, B Capital, Monk's Hill, and Zamrud are meaningful capital providers. Because public leadership evidence is concentrated in the founders and board visibility is limited, key-person dependence remains material and governance diligence should focus on succession planning, board rights, and investor influence over strategic decisions.",
