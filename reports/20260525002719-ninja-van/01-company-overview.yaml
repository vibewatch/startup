      "id": "capital-and-investors",
      "title": "Funding history, investors, and debt",
      "body": "Ninja Van's last clearly disclosed major equity financing remains the US$578 million Series E round announced in September 2021. TechCrunch, TNGlobal, Business Times, Yahoo Singapore, and BusinessToday all describe the same round and name Alibaba, GeoPost/DPDgroup, B Capital Group, Monk's Hill Ventures, and Zamrud as participants. Those reports also place the company firmly in late-stage private-company territory by noting that the round pushed Ninja Van well past the US$1 billion valuation threshold.\n\nStrategic-capital detail is strongest around GeoPost and HSBC. La Poste said GeoPost raised its stake to 40% in 2021, which suggests a far deeper relationship than a passive minority ticket. In October 2024, Sidley and Yahoo Singapore reported a three-year committed US$50 million revolving credit facility from HSBC. Both said the debt was intended to fund regional growth and expansion in e-commerce express logistics, B2B restocking, and cold chain. Taken together, the evidence points to a company that still has institutional backing, but one whose disclosed capital stack since 2021 has shifted from large equity financing toward strategic partner support and bank debt.",
