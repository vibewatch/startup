  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - SME parcel merchants
        - Founder, merchant-ops lead, or store manager
        - Seller-ops team or owner
        - Merchant or end-customer shipping budget
        - Daily parcel dispatch, returns handling, and light fulfillment
        - Owner / ops budget
        - Low-friction pickup, doorstep delivery, and transparent delivery status
      - - Enterprise and omnichannel brands
        - Supply-chain or procurement lead
        - Logistics, warehouse, and customer-ops teams
        - Central logistics or procurement budget
        - Regional fulfillment, warehousing, distribution, and last-mile orchestration
        - Supply-chain P&L
        - Lower logistics overhead, scalable 3PL capacity, and regional network continuity
      - - Social sellers / live-commerce merchants
        - Seller or growth lead
        - Small operations team or individual creator-seller
        - Merchant budget, often partially subsidized through campaigns
        - Spiky micro-shipments tied to video commerce and social channels
        - Seller marketing / operations budget
        - Flexible pickup, low fixed commitment, and fast home delivery
      - - Retail / distributor B2B restock accounts
        - Distribution or retail operations manager
        - Warehouse, route-planning, and outlet staff
        - Trade-distribution or store-operations budget
        - Milk runs, LTL replenishment, warehouse-to-store delivery, and cross-border trucking
        - Distribution budget
        - Reduced stockouts and reliable scheduled replenishment
      - - Cross-border sellers and importers
        - E-commerce lead or international trade manager
        - Customs, warehouse, and customer-service teams
        - Cross-border logistics budget
        - Bonded inventory, customs support, international parcel delivery, and returns
        - Cross-border commerce / logistics budget
        - Faster customs clearance and predictable delivery times
      - - Cold-chain customers
        - Category manager, QA lead, or healthcare logistics manager
        - Warehouse, transport, and compliance teams
        - Supply-chain or regulated-product budget
        - Chilled / frozen storage, monitored transportation, and audit-ready distribution
        - Category or regulated-logistics budget
        - Temperature integrity, compliance, and reduced spoilage or excursion risk
    notes: >-
      The same physical network can serve these segments, but decision-makers and monetization logic
      differ materially. Parcel merchants optimize for convenience and density, enterprises buy overhead
      reduction and reliability, and cold-chain buyers optimize for compliance and product integrity.
