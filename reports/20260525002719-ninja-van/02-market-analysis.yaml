  - id: growth-constraints
    title: Growth drivers and adoption constraints
    body: >-
      The demand drivers are real. E-Conomy SEA 2024 and 2025 show strong digital-commerce growth,
      while video commerce is moving from a niche to a quarter of regional e-commerce GMV by 2025.
      McKinsey's structural work shows why that matters for logistics: Southeast Asian e-commerce sales
      and retail penetration have already stepped up sharply over the last decade. Parcel Perform and
      Mordor add a practical operating angle: consumers across Indonesia, Malaysia, Singapore, and
      Thailand still prefer home delivery, social-commerce micro-shipments are rising, and tier-2 or
      tier-3 orders increasingly push parcel density outside capital-city cores. Cross-border demand is
      also improving as bonded-warehouse models and customs harmonization reduce delivery times and
      lower landed costs for some lanes.

      The constraints are equally important. Roland Berger says margins are already under pressure,
      while ION Analytics describes active price wars and consolidation pressure in regional last-mile
      3PL. McKinsey highlights COD and returns friction, and Maersk stresses that Southeast Asia's
      geography keeps transport and final-mile execution costly and operationally complex. Cold chain is
      an especially visible constraint because compliance, segregation, monitoring, and backup capacity
      push up capex and onboarding costs. Domestic parcels still dominate network utilization, but
      international shipments are growing faster; that combination rewards dense networks while also
      forcing operators to manage customs complexity, variable documentation, and fluctuating cross-
      border economics. Headline GMV can therefore expand while profitability stays contested.
    claimRefs:
      - CM029
      - CM030
