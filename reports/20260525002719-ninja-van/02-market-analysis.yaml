runDate: '2026-05-25'
company:
  name: Ninja Van
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Ninja Van's real market is not all Southeast Asian logistics spend but the narrower parcel,
    fulfillment, cross-border, B2B restock, and cold-chain workflows that share network density
    and service infrastructure. Public lenses point to a large but boundary-sensitive demand pool:
    e-Conomy SEA 2025 puts regional e-commerce GMV at USD 185 billion, Parcel Perform cites a
    USD 211 billion 2025 e-commerce value estimate, Mordor pegs ASEAN CEP at USD 17.85 billion
    in 2026, Mordor values Southeast Asia cross-border e-commerce at USD 50.37 billion in 2026,
    and ASEAN cold chain at USD 19.98 billion in 2026. The core underwriting question is therefore
    density and monetizable service mix, because price wars, fragmented geography, customs friction,
    returns, and cold-chain compliance make monetization harder than headline GMV suggests.
sections:
  - id: market-boundary
    title: Market boundary, included spend, and excluded spend
    body: >-
      Ninja Van should be analyzed against the Southeast Asian logistics workflows it actually sells,
      not against the full region-wide logistics, freight, or 3PL universe. Its Singapore and Malaysia
      solution pages consistently describe a stack that starts with last-mile parcel delivery and then
      extends into fulfillment, warehousing, B2B store replenishment, international deliveries,
      freight-forwarding support, and cold-chain handling. Those offerings all sit close to the order
      flow of e-commerce merchants, retailers, distributors, and selected enterprise shippers. The
      included spend for this chapter is therefore parcel pickup, sortation, line-haul, last-mile
      delivery, cross-border parcel handoff, temperature-controlled handling for relevant products,
      and B2B replenishment or warehousing when it directly feeds store shelves or online orders.

      That boundary explicitly excludes broad ocean freight, heavy industrial trucking, generic
      contract logistics with no parcel linkage, marketplace take rates, and merchandise value itself.
      It also excludes cold-chain and enterprise logistics spend that never touches parcel, store
      replenishment, or rapid regional fulfillment workflows. The practical substitutes are national
      posts, retailer-owned fleets, platform in-house networks, informal couriers, and wholesalers that
      rely on self-pickup or route-based distribution. Defining the market this way matters because the
      strategic issue for Ninja Van is network density and attachment across adjacent services rather
      than whether Southeast Asia has a very large abstract logistics sector.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Multiple sizing lenses and preserved contradictions
    body: >-
      The broadest demand lens is the Southeast Asian digital economy and the e-commerce order flow
      that creates parcel demand. Bain's e-Conomy SEA 2024 work put regional digital-economy GMV at
      USD 263 billion and e-commerce GMV at USD 159 billion in 2024, while the 2025 report says the
      region should exceed USD 300 billion in digital-economy GMV and reach USD 185 billion of
      e-commerce GMV in 2025. Parcel Perform's 2024 Southeast Asia logistics report provides a
      different public lens, saying the region's e-commerce market is expected to reach USD 211
      billion by 2025. Those figures should not be smoothed into one number: they are useful as an
      order-flow range, not a single canonical TAM.

      The operational logistics lens is narrower. Mordor pegs ASEAN CEP at USD 16.68 billion in 2025
      and USD 17.85 billion in 2026, which is a monetized delivery-services pool rather than gross
      merchandise value. J&T's disclosed 2025 Southeast Asia parcel volume and market share imply a
      roughly 22.3 billion parcel regional market, which is the closest public activity proxy for the
      last-mile arena where Ninja Van competes. Adjacent service lenses matter too: Mordor values
      Southeast Asia cross-border e-commerce at USD 50.37 billion in 2026 and ASEAN cold chain at USD
      19.98 billion in 2026. The right read-through is that Ninja Van participates in several linked
      markets, none of which by itself is a clean top-down revenue TAM for the company.
