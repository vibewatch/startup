callouts:
  - calloutType: insight
    title: The relevant market is parcel-density plus adjacent services
    body: >-
      Treat Ninja Van as a regional parcel-density business with monetizable adjacencies, not as a proxy
      for all Southeast Asian logistics spend. The inclusion logic is about shared infrastructure and
      workflow overlap.
    claimRefs:
      - CM002
      - CM003
      - CM026
  - calloutType: risk
    title: Fast GMV growth does not neutralize price-war risk
    body: >-
      Public market data shows strong parcel-demand growth, but industry commentary also shows intense
      price competition and gross-margin pressure. Volume growth alone is not enough to underwrite a
      premium valuation.
    claimRefs:
      - CM040
      - CM041
      - CM038
  - calloutType: assumption
    title: Cold chain and B2B restock widen the buyer base but not yet the disclosed SOM
    body: >-
      Ninja Van clearly markets cold-chain, replenishment, warehousing, and international-delivery
      services, but public materials do not break out their revenue contribution. These adjacencies are
      strategically relevant but still evidence-constrained.
    claimRefs:
      - CM021
      - CM023
      - CM043
  - calloutType: recommendation
