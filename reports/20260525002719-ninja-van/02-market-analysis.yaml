  - id: evidence-gaps
    title: Evidence gaps and valuation read-through
    body: >-
      The public record is sufficient to show that Ninja Van operates inside a large, growing, and
      service-diverse Southeast Asian delivery market, but it is not sufficient to isolate the
      company's real serviceable obtainable market. Public sources confirm that the company spans last-
      mile parcels, warehousing, cross-border delivery, B2B restock, and cold chain, yet they do not
      disclose parcel share, revenue mix, attachment rates, country-by-country density, or the portion
      of demand that comes from enterprise contracts versus long-tail merchants. That missing company-
      specific denominator is the main reason this chapter treats market sizing as evidence-constrained
      instead of pretending to know a single clean TAM/SAM/SOM stack.

      For valuation, the practical implication is to focus on density and monetizable mix rather than
      on abstract GMV. A carrier with strong parcel density but weak enterprise attachment or weak cold-
      chain economics can still be trapped in price wars; a company with modest parcel share but strong
      cross-border, B2B restock, and warehousing attachment can monetize much better than parcel volume
      alone implies. The evidence base supports a constructive demand view, but it preserves material
      uncertainty on service mix, margin quality, and attributable share. That is a convergence issue,
      not a reason to inflate the market boundary.
    claimRefs:
      - CM012
      - CM034
      - CM040
      - CM041
      - CM042
      - CM043
      - CM044
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Ninja Van
    rows:
      - - Last-mile parcel delivery
        - Pickup, sortation, line-haul, doorstep delivery, failed-delivery handling, and returns-linked parcel workflows
        - Ocean freight, pure freight forwarding, heavy industrial trucking
        - SMEs, merchants, marketplaces, enterprises; shipping cost may be paid by merchant, platform, or recipient
        - Core current market and brand entry point
      - - Fulfilment and warehousing tied to order flow
        - Storage, picking, packing, and order processing that feeds parcel dispatch across Southeast Asia
        - Standalone contract warehousing unrelated to parcel or replenishment workflows
        - Enterprise brands, omnichannel retailers, marketplace sellers
        - Included adjacency because it improves parcel density and account stickiness
      - - B2B restock and store replenishment
        - Milk runs, LTL store replenishment, warehouse-to-store distribution, and MY-SG cross-border trucking
        - Heavy full-truckload industrial freight or national primary distribution networks with no parcel overlap
        - Retail chains, distributors, restaurant groups, brand owners
        - Important buyer segment with different budget owner and workflow than parcel merchants
      - - International / cross-border deliveries
        - Customs-supported parcel shipping, bonded inventory handoff, and cross-border seller fulfillment flows
        - Marketplace take rates, cross-border advertising spend, or merchandise value itself
        - Cross-border sellers, importers, SMEs, omnichannel brands
        - Critical adjacency because it shares fulfillment, customs, and last-mile economics
      - - Cold chain logistics
        - Chilled and frozen storage and transportation for food, pharma, and other temperature-sensitive categories
        - Ambient logistics for goods with no temperature-control requirement; broad industrial cold chain unrelated to retail or parcelized distribution
        - Grocers, F&B distributors, healthcare shippers, cosmetics brands
        - High-value adjacency with distinct compliance and capex requirements
      - - Broader logistics and 3PL universe
        - Only the portions that directly feed parcel, warehousing, B2B restock, or cross-border order flow
        - All Southeast Asian logistics spend, ocean shipping, full-scope industrial 3PL, and merchandise GMV itself
        - Enterprise procurement teams
        - Context only; not the chapter's core TAM boundary
    notes: >-
      The chapter defines Ninja Van's market by workflow adjacency and network sharing rather than by
      every logistics category that could exist in Southeast Asia. Included spend must touch parcel,
      replenishment, cross-border fulfillment, or cold-chain distribution that uses similar infrastructure.
