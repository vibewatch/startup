  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: sizing-contradiction
      missingEvidence: "A reconciled methodology appendix showing why USD 185B and USD 211B public 2025 e-commerce estimates differ and which definition best maps to parcel-generating order flow."
      whyItMatters: "The order-flow denominator determines whether market expansion is mostly broad GMV growth or a narrower logistics-relevant subset."
      diligencePath: "Request the underlying methodology notes from Temasek/Bain and Parcel Perform or compare their category and geography definitions line by line."
      relatedQuestionRefs: [QM005]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: ninja-share
      missingEvidence: "Current company-level parcel share, country parcel volumes, and any internal SOM framework for Ninja Van's network."
      whyItMatters: "Without a disclosed company denominator, public market sizes cannot be translated into attributable market share or monetizable SOM."
      diligencePath: "Obtain management KPI packs or lender / investor materials with country-level parcel volumes and service mix by market."
      relatedQuestionRefs: [QM023]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: service-mix
      missingEvidence: "Revenue and gross-profit mix across last-mile parcel, cross-border, warehousing, B2B restock, and cold chain."
      whyItMatters: "Adjacency breadth only improves valuation if the higher-touch services contribute meaningful and durable economics."
      diligencePath: "Request segment revenue, attachment-rate, and gross-margin breakouts by service line for the latest twelve months."
      relatedQuestionRefs: [QM024]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: "Country-level failed-delivery, COD, returns, and contribution-margin data for core Southeast Asian corridors."
      whyItMatters: "Price wars, returns, and fragmented geography can destroy value even when parcel demand is growing quickly."
      diligencePath: "Ask for lane-level unit-economics cohorts and operational KPIs split by domestic, cross-border, and cold-chain flows."
      relatedQuestionRefs: [QM021, QM022]
      relatedTableRefs: [TM004]
    - type: missing-source
      severity: minor
      topic: cold-chain-adjacency
      missingEvidence: "Country-level cold-chain customer count, recurring volume, and mix between food, pharma, and other temperature-sensitive categories."
      whyItMatters: "Cold chain looks strategically valuable, but its actual revenue contribution and stickiness inside Ninja Van remain unverified."
      diligencePath: "Collect pipeline and active-account data for Ninja Cold plus utilization data for chilled and frozen assets by country."
      relatedQuestionRefs: [QM014, QM024]
      relatedTableRefs: [TM003]
