  - id: buyer-segmentation
    title: Buyer, user, payer, and adoption path by segment
    body: >-
      Ninja Van's buyer map is multi-sided rather than homogeneous. SME parcel merchants are the most
      obvious segment: they use last-mile delivery, light fulfillment, and international shipping to
      serve marketplace and direct-to-consumer demand, with the owner or operations lead often acting
      as buyer, user, and payer at once. Enterprise and omnichannel brands sit differently. They buy
      3PL, warehousing, and integrated distribution because they want scale, lower logistics overhead,
      and regional service continuity; their users are supply-chain and operations teams, while the
      payer is usually a centralized logistics or procurement budget. Social sellers and live-commerce
      merchants are another distinct cohort because volume is spiky, shipment sizes are small, and the
      adoption trigger is flexible pickup, fast handoff, and low-friction doorstep delivery.

      B2B restock and cold-chain accounts widen the buyer base further. Retail chains and distributors
      need milk runs, LTL replenishment, and cross-border trucking because stockouts are more costly
      than parcel price alone. Cold-chain customers buy for compliance and product integrity, not just
      speed; temperature control, monitoring, and auditability are more important than the absolute
      cheapest lane. Cross-border sellers and importers care about customs support, bonded inventory,
      and predictable delivery timing to manage conversion and repeat purchase. These segments all use
      overlapping infrastructure, but the decision-maker, budget owner, and adoption trigger differ
      enough that a single generic merchant TAM obscures how Ninja Van can monetize density.
    claimRefs:
