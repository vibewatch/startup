callouts:
  - calloutType: insight
    title: Real scale, weak revenue-quality disclosure
    body: >-
      Ninja Van now publicly discloses 2 million parcels per day and 120 million-plus Southeast Asians served, which is
      enough to establish genuine network scale. The missing piece is the economic layer: merchant count, service-line
      mix, realized yield, and margin are still not public.
    claimRefs: [CI002, CI048, CI052]
  - calloutType: risk
    title: Balance-sheet signals still lean defensive
    body: >-
      A new debt line, a lower-valuation internal round with preferential terms, and repeated layoffs are all consistent
      with a company still financing and restructuring its pivot rather than openly funding growth from disclosed retained cash.
    claimRefs: [CI022, CI027, CI028, CI029, CI031, CI032, CI051]
  - calloutType: recommendation
    title: Underwrite only with a private operating pack
    body: >-
      The minimum private diligence package should include service-line revenue mix, realized parcel yield by country,
      segment gross margin, CAC and payback, unrestricted cash, monthly burn, runway, and full HSBC facility terms.
    claimRefs: [CI048, CI049, CI050]
