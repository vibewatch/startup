schemaVersion: report-v2
artifact: financials
slug: ninja-van
runDate: '2026-05-25'
company:
  name: Ninja Van
chapter:
  number: 4
  title: Financials
  summary: >-
    Ninja Van's public financial picture shows real operating scale but weak underwriting visibility. Official pages now
    claim 120 million+ Southeast Asians served, 2 million parcels delivered per day, and a six-market network, while
    2024-2025 news shows a US$50 million HSBC revolving credit facility, a cold-chain/B2B push aimed at higher-margin
    business, and a 2025 internal round discussion at roughly half the prior valuation. What remains missing are the core
    inputs that decide revenue quality and solvency: merchant count, service-line mix, realized parcel yield, gross
    margin, CAC/payback, unrestricted cash, burn, runway, and covenant detail.
sections:
  - id: revenue-model-pricing-and-public-traction
    title: Revenue model, pricing surfaces, and public traction
    body: >-
      Ninja Van's official surfaces show a broader logistics business than a simple marketplace parcel courier. The
      Singapore homepage markets contract logistics, customs clearance, warehousing, fulfilment, retail restocking,
      last-mile parcel delivery, international parcel delivery to 44 countries, freight forwarding, cold-chain delivery,
      and B2B delivery. Malaysia adds branded offerings such as Ninja B2B Restock, Ninja Fulfilment, and Ninja Cold.
      The Philippines homepage is the clearest public scale marker in the reviewed pack: 120 million-plus Southeast
      Asians served, 2 million parcels delivered every day, and 100% coverage in Southeast Asia. That establishes real
      operating footprint and throughput.

      The monetization detail is still uneven. Public list pricing appears mainly at the packaging layer through Ninja
      Packs in Malaysia, where prepaid polymailers and bundles carry posted RM prices. The consumer-facing C2C portal
      publishes working-day windows by lane, but the reviewed public extract does not expose a simple core-network rate
      card for merchants or enterprise accounts. That means the public record is strong on what Ninja Van can sell and
      where it can deliver, but weak on realized yield, discounting, and service-line mix. Exact merchant counts,
      warehouse counts, and country-by-country revenue contribution remain undisclosed even as parcel volume is now
      disclosed at a headline level.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI048, CI052]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-new-revenue-bets
    title: GTM motion and newer monetization bets
    body: >-
      Ninja Van's GTM motion is increasingly framed as an embedded logistics operating layer for merchants, branches,
      and institutions rather than only a parcel carrier. Philippines materials pitch Ninja Restock with smaller load
      requirements, co-loaded shipments, multi-drop routes, fixed transparent pricing, nationwide reach, and easy
      integration. Ninja Dash is positioned for recurring B2B partner deliveries and bulky items, with nationwide reach
      and parcel liability coverage. The company's own 2025 scaling guide defines scale as growing revenue faster than
      operating costs, which is consistent with a process-efficiency thesis rather than volume-at-all-costs.

      Business Times makes the strategic turn explicit. Ninja Van launched Ninja Cold and Ninja B2B to diversify beyond
      e-commerce and pursue higher-margin business in search of profitability. Cold chain started in Singapore and
      Malaysia with roughly 20 trial customers, while Indonesia, the Philippines, and Vietnam were slated to follow.
      Management's stated ambition is notable: Ninja Cold eventually contributing 10% of revenue but 50% of total
      profit. That is directionally attractive, but it should be read as management target language, not a demonstrated
      revenue mix today. Public evidence shows the strategic logic and early rollout, not a proven earnings bridge.
    claimRefs: [CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI033, CI052]
  - id: cost-structure-and-margin-proxies
    title: Cost structure and margin drivers in last-mile logistics
    body: >-
      Public evidence suggests Ninja Van's cost structure looks like classic last-mile logistics rather than software:
      pickup and last-mile labor, linehaul, sorting, warehousing and fulfilment, route density, customer acquisition,
      and capex for automation or cold-chain equipment. GeoPost's 2022 partner release is the clearest operating signal
      from the company ecosystem, describing a US$50 million automation program across nine hubs with a targeted 50%
      productivity gain. That is helpful for identifying the levers management believes matter, but it does not disclose
      cost per parcel or gross margin.

      Public-company proxies fill the gap only directionally. J&T's FY2024 results show that even at much larger scale,
      gross margin was only about 10.5%, while the SEA unit-economics narrative explicitly depends on flexible pricing,
      salary rationalization, self-owned fleet economics, linehaul optimization, and automated sorting. Sea's 2025
      20-F shows marketplace economics are still burdened by logistics and warehousing costs plus large sales and
      marketing bills as order volume expands. Pos Malaysia's 2025 annual report describes aggressive parcel pricing,
      platform-led in-house logistics, and margin defense through automation and network optimization. The read-through
      for Ninja Van is that route density and automation can help, but the business is still structurally exposed to
      price competition, labor, transport, and fulfillment costs.
    claimRefs: [CI019, CI024, CI025, CI034, CI035, CI036, CI037, CI038, CI039, CI040, CI041, CI042, CI043, CI044, CI045, CI046, CI047]
    tableRefs: [TI003, TI004]
    figureRefs: [FI002]
  - id: capital-adequacy-and-financing-dependence
    title: Capital adequacy and financing dependence
    body: >-
      The clearest capital signal is that Ninja Van is still managing liquidity and restructuring priorities rather than
      presenting a cash-rich, self-funded expansion story. In October 2024 it secured a three-year US$50 million
      revolving credit facility from HSBC, explicitly to support regional growth and the development of e-commerce
      express logistics, B2B restocking, and cold-chain delivery services. That should help working capital and network
      investment, but it does not disclose drawdown status, pricing, covenant package, or unrestricted cash.

      The 2025 financing discussions matter more. The Straits Times and a Yahoo Finance mirror reported an internally led
      US$80 million raise at roughly a US$1 billion valuation, about half the prior mark, with preferential exit terms
      for participating investors. Add the last public P&L anchor from Business Times—FY2023 revenue of S$1.0 billion
      but loss of S$326.8 million—and the picture is of a company that has scale but still needed both debt flexibility
      and new investor support. The August 2025 Singapore layoffs reinforce that interpretation as a cost-reset and
      portfolio-prioritization exercise, not a signal that public cash generation has already solved the funding problem.
    claimRefs: [CI020, CI021, CI022, CI023, CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI049, CI050, CI051]
    tableRefs: [TI005]
    figureRefs: [FI003]
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Ninja Van is publicly visible enough to clear one major hurdle: this is not a niche courier with theoretical
      products. The company discloses meaningful parcel throughput, broad Southeast Asian coverage, and a credible shift
      into B2B restocking, fulfilment, and cold chain. But revenue quality is still difficult to underwrite. Public
      materials do not reveal merchant count, service-line mix, country contribution, realized parcel yields, gross
      margin, CAC or payback, cash, runway, or debt terms. The positive thesis—large network scale plus higher-margin
      adjacencies—therefore remains offset by an equally visible adverse thesis of widening FY2023 losses, layoffs, a
      fresh debt line, and a 2025 internal round at a lower valuation.

      The right financial conclusion is cautious rather than bearish. Public evidence supports medium-confidence belief
      that management is trying to move mix toward better-margin segments and lower unit cost with automation. It does
      not support medium-confidence belief that the pivot has already repaired revenue quality or balance-sheet strength.
      Until management discloses service-line revenue mix, realized yield, gross margin, cash, burn, and covenant data,
      Ninja Van remains a scale story with real logistics relevance but incomplete investment-grade financial disclosure.
    claimRefs: [CI002, CI015, CI017, CI020, CI021, CI027, CI029, CI031, CI048, CI049, CI050, CI051, CI052]
    tableRefs: [TI006]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Core parcel delivery
        - Last-mile parcel and courier delivery for e-commerce, SME, and enterprise shippers
        - Per parcel / shipment
        - Officially marketed across Southeast Asia; PH homepage discloses 2,000,000 parcels/day at network level
        - Strong existence proof, weak segment economics disclosure
        - Provide country-by-country parcel mix, average realized yield, and on-time metrics by service type
      - - International and cross-border parcel delivery
        - Consumer and business shipments across named corridors plus broader international network
        - Per parcel / lane
        - SG site markets 44-country international delivery and C2C lanes to MY, PH, HK, AU, US, UK, NZ and others
        - Mechanism is visible, corridor profitability is not
        - Provide cross-border revenue share, customs-cost pass-through, and lane-level margin
      - - Fulfilment and warehousing
        - Inventory storage, order processing, and fulfilment operations for merchants
        - Storage + pick/pack + order handling
        - Officially marketed in SG, MY, and PH materials; no public revenue split
        - Service is clearly offered, monetization terms undisclosed
        - Provide warehousing footprint, occupancy, pick/pack pricing, and contribution margin
      - - B2B restocking / Dash
        - Multi-drop replenishment, recurring partner deliveries, bulky-item delivery, and co-loaded runs
        - Route / stop / delivery run
        - Publicly marketed through Ninja Restock and Ninja Dash; PH article mentions fixed transparent pricing
        - Good mechanism evidence, limited realized pricing evidence
        - Provide contract templates, average route economics, and branch/store density assumptions
      - - Cold chain
        - Temperature-controlled delivery using reefer trucks and cooler-box-equipped fleet
        - Temperature-controlled shipment / contract
        - Publicly launched in SG and MY with about 20 test customers; target contribution is 10% of revenue and 50% of total profit over time
        - Strategically attractive but still pilot-stage in public record
        - Provide trial-to-paid conversion, cold-chain capex, utilization, spoilage, and gross margin
      - - Freight forwarding and contract logistics
        - Air, sea, truck, and rail freight plus broader contract-logistics scope
        - Freight quote / contract
        - SG site advertises freight-forwarding quotes and contract-logistics scope; no public pricing or mix
        - Broad capability confirmed, revenue attribution opaque
        - Provide freight-forwarding revenue share, customer concentration, and working-capital profile
    notes: >-
      This table separates visible service lines from public economic disclosure. Official pages show what Ninja Van sells,
      but only Malaysia packaging products expose explicit list pricing; most service economics remain negotiated or undisclosed.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI012, CI013, CI016, CI017, CI018]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Pricing element
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Malaysia individual prepaid polymailer
        - RM6.50-RM11.50 depending on XS / S / M Lite / M size
        - Public list pricing
        - Core parcel-network yield still unknown
        - Ninja Packs collection
      - - Malaysia 10-piece prepaid bundles
        - RM59-RM109 depending on size
        - Public list pricing
        - Bundle economics do not reveal enterprise or high-volume discounts
        - Ninja Packs collection
      - - Malaysia 20-piece prepaid bundles
        - RM112-RM210 depending on size
        - Public list pricing
        - Packaging SKU prices are not equivalent to realized end-to-end network revenue per parcel
        - Ninja Packs collection
      - - Singapore last-mile parcel delivery
        - Pay-as-you-go with no account setup or minimum volume required
        - Mechanism is public, price not disclosed in reviewed extract
        - No public standard merchant rate card reviewed
        - Ninja Van SG homepage
      - - Consumer cross-border portal
        - Destination-specific delivery windows are public by lane
        - Mechanism and transit-time cues are public
        - Reviewed portal extract did not expose a simple public rate card for core services
        - C2C portal
      - - Ninja Restock pricing
        - Fixed transparent pricing claimed in PH article
        - Mechanism is public, schedule is not
        - Contract minimums, route assumptions, and discounting are undisclosed
        - Stockouts and Replenishment article
      - - Cold-chain pricing
        - Negotiated / not publicly posted
        - No public rate card reviewed
        - Only pilot-customer count and long-term revenue/profit target are public
        - Business Times cold-chain article
    notes: >-
      Public pricing is strongest at the packaging and service-mechanism layer. The reviewed pack does not provide a country-level rate card or realized yield disclosure for Ninja Van's core parcel, B2B, or cold-chain network.
    claimRefs: [CI009, CI010, CI011, CI012, CI017, CI018, CI048]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Parcel throughput
        - 2,000,000 parcels/day disclosed on PH homepage
        - medium
        - Volume density is the core scale input for route utilization and cost absorption
        - Break parcel/day into domestic, cross-border, B2B, cold-chain, and fulfilment-linked flows by country
      - - Merchant / client count
        - null
        - low
        - Merchant density and concentration are needed to judge revenue durability and pricing power
        - Provide active merchant count, enterprise client count, top-10 customer exposure, and retention trends
      - - Realized parcel yield
        - null
        - low
        - List packaging prices do not reveal actual revenue per parcel after discounts and mix
        - Provide realized revenue per parcel by country and service line, plus surcharge pass-through
      - - Gross margin
        - null; J&T FY2024 scale proxy implies only about 10.5% gross margin at much larger scale
        - medium
        - Gross margin determines whether network scale is creating cash generation or just volume
        - Provide gross margin by segment, route family, and cold-chain versus ambient delivery
      - - Sales and marketing / CAC intensity
        - null; Sea's 2025 e-commerce sales and marketing expense was US$4.5 billion and still grew 29.4%
        - medium
        - Seller acquisition, promotions, and traffic costs can erase operational gains in logistics-heavy commerce
        - Provide CAC, payback, sales productivity, and promo or subsidy intensity by market
      - - Sorting productivity
        - Up to 50% productivity uplift targeted from Ninja Van's 9-hub automation program
        - medium
        - Sorting efficiency is a direct lever on cost per parcel and service reliability
        - Provide realized productivity gains, capex payback, and hub-level throughput before and after automation
      - - Cold-chain unit economics
        - Targeted at 10% of revenue and 50% of profit over time; no realized margin disclosed
        - medium
        - Cold chain may improve mix, but it adds vehicle, equipment, and handling intensity
        - Provide capex per vehicle, utilization, spoilage, pricing premium, and gross margin per cold-chain stop
      - - Cash on hand
        - null
        - low
        - Cash anchors runway and determines whether disclosed debt and restructuring were enough
        - Provide unrestricted cash, restricted cash, and minimum liquidity thresholds
    notes: >-
      Null means the metric is not publicly disclosed in the reviewed pack, not that the metric is zero. Public-company proxies are used only to frame likely logistics economics, not to back-solve Ninja Van's own margins.
    claimRefs: [CI002, CI018, CI024, CI025, CI037, CI038, CI039, CI040, CI047, CI048, CI049]
  - id: TI004
    title: Public-company proxy table
    columns:
      - Proxy source
      - Public metric
      - Public value
      - Why it matters for Ninja Van
      - Precision limit
    rows:
      - - J&T FY2024 results deck
        - Express-delivery revenue
        - US$10.0 billion in 2024 versus US$8.1 billion in 2023
        - Shows how large regional parcel scale can convert into materially higher absolute revenue
        - J&T is larger and more geographically diverse than Ninja Van
      - - J&T FY2024 income statement
        - Gross margin proxy
        - About 10.5% gross margin implied by US$10.259 billion revenue and US$1.078 billion gross profit
        - Suggests mature parcel economics can still be operationally thin even at large scale
        - Group mix differs from Ninja Van's service and market mix
      - - J&T SEA unit-economics commentary
        - Margin drivers
        - Flexible pricing, self-owned fleet, line-haul optimization, salary rationalization, and automated sorting
        - These are the same operational levers most likely to matter for Ninja Van's network economics
        - Commentary is qualitative, not a direct Ninja Van measure
      - - Sea 2025 20-F
        - E-commerce monetization mix
        - Ads, transaction fees, and logistics/fulfillment value-added services
        - Useful proxy for how logistics can complement marketplace monetization rather than stand alone
        - Sea is a marketplace operator, not a pure delivery network
      - - Sea 2025 20-F
        - Logistics cost scaling
        - Shopee cost of revenue +32.6% to US$9.5 billion as orders +27.2% to 13.9 billion; sales and marketing +29.4% to US$4.5 billion
        - Shows that logistics and acquisition costs can keep rising even after scale is achieved
        - Sea's integrated platform economics are not directly comparable to courier-only revenue
      - - Pos Malaysia Annual Report 2025
        - Competitive pressure and margin defense
        - Aggressive pricing, masking, in-house platform logistics, network optimization, automation and AI to lower cost per parcel
        - Closest public read-through for a Southeast Asian parcel operator facing price wars and regulatory obligations
        - Pos Malaysia carries postal-USO complexity that Ninja Van does not
    notes: >-
      This table is intentionally proxy-based. It uses filing-grade disclosures from public logistics and e-commerce operators to bracket the kinds of cost and margin dynamics Ninja Van likely faces, without claiming one-to-one equivalence.
    claimRefs: [CI034, CI035, CI036, CI037, CI038, CI039, CI040, CI041, CI043, CI045, CI047]
  - id: TI005
    title: Capital adequacy table
    columns:
      - Capital item
      - Public figure / status
      - What it says
      - Confidence
      - Diligence ask
    rows:
      - - Unrestricted cash
        - null
        - No reviewed public source discloses unrestricted cash or minimum-liquidity cushion
        - low
        - Provide latest treasury dashboard with unrestricted versus restricted cash
      - - Monthly burn
        - null
        - Public record shows losses and financing actions, but not present cash burn
        - low
        - Provide trailing-12-month burn split between opex, capex, and working capital
      - - Runway months
        - null
        - Cannot be derived without cash, burn, and debt-draw detail
        - low
        - Provide base, downside, and covenant-stress runway calculations
      - - HSBC revolving credit facility
        - Three-year committed US$50 million facility
        - Supports liquidity and expansion into e-commerce express, B2B restocking, and cold chain
        - medium
        - Provide drawdowns, interest cost, maturity schedule, covenants, and security package
      - - 2025 internal round discussions
        - US$80 million at about US$1 billion valuation with preferential exit terms
        - Suggests incremental capital was still needed and bargaining power had weakened
        - medium
        - Provide signed term sheet, close status, liquidation preferences, and investor rights
      - - Latest public P&L anchor
        - FY2023 revenue S$1.0 billion and loss S$326.8 million
        - Confirms scale but also that public profitability remained weak before the 2025 restructuring and funding discussion
        - medium
        - Provide FY2024/FY2025 audited statements and monthly management accounts
      - - Workforce cost reset
        - About 12% of Singapore staff laid off in Aug 2025 after two 2024 rounds
        - Indicates active cost control and reprioritization, not visible self-funded surplus
        - medium
        - Provide restructuring savings, severance cost, and reinvestment plan by business line
    notes: >-
      The table focuses on forward capital adequacy rather than historical equity chronology. What is visible publicly is debt capacity, restructuring, and a fresh internal-round discussion; what is missing is the cash and covenant data needed to turn those signals into runway.
    claimRefs: [CI020, CI021, CI022, CI023, CI027, CI028, CI029, CI031, CI032, CI033, CI049, CI051]
  - id: TI006
    title: Public financial gaps table
    columns:
      - Missing private metric / document
      - Why it matters
      - Current public state
      - Exact diligence path
      - Underwriting consequence
    rows:
      - - Merchant / client count and concentration
        - Needed to assess revenue durability and seller-side bargaining power
        - Public sources mention trusted brands and institutions but no precise merchant or client count
        - Request active merchants, enterprise accounts, revenue by top-10 customers, and churn by cohort
        - Customer-quality risk cannot be underwritten
      - - Service-line revenue mix
        - Needed to test whether higher-margin B2B and cold chain are material or still de minimis
        - Public record shows product breadth and target mix, but not actual contribution by line
        - Request revenue bridge across core parcel, cross-border, fulfilment, B2B, cold chain, and freight
        - Mix-improvement thesis remains aspirational
      - - Realized parcel yield and discounts
        - Needed to connect network scale to revenue quality and margin
        - Packaging list pricing is public; enterprise and route yields are not
        - Request country- and service-level realized revenue per parcel, surcharge mix, and discount ladders
        - Revenue quality remains opaque
      - - Gross margin, cost per parcel, and CAC/payback
        - Needed to judge whether scale and automation create cash economics
        - Only public-company proxies are available; Ninja Van's own unit economics are not disclosed
        - Request segment gross margin, cost-per-stop or per-parcel, seller CAC, payback, and retention data
        - Margin path cannot be underwritten
      - - Cash, burn, and runway
        - Needed to assess whether the HSBC line and restructuring are sufficient
        - No reviewed public source discloses unrestricted cash, burn, or runway
        - Request treasury dashboard, board runway model, and downside liquidity case
        - Capital adequacy remains inferential
      - - Debt terms and covenant package
        - Needed to judge refinancing risk and downside flexibility
        - Only facility size, tenor, and strategic purpose are public
        - Request revolving-credit agreement, covenant package, collateral, and draw conditions
        - Debt can be misread as liquidity if terms are restrictive
      - - Cold-chain capex and margin proof
        - Needed to validate the higher-margin pivot thesis
        - Public sources show pilot customers, fleet preparation, and ambitious contribution targets, not realized economics
        - Request cold-chain fleet capex, utilization, spoilage, staffing, and margin by route archetype
        - Profitability upside remains unverified
    notes: >-
      These are the missing disclosures that most directly affect an underwriting decision. The problem is not a lack of public discussion around strategy; it is the absence of operating and balance-sheet data that translate strategy into investable economics.
    claimRefs: [CI017, CI018, CI048, CI049, CI050, CI051, CI052]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Ninja Van's public monetization path starts with merchant or consumer shipment demand, branches into parcel,
      fulfilment, B2B, and cold-chain services, and only then turns into revenue whose realized yield remains largely undisclosed.
    data:
      nodes:
        - id: merchant-demand
          label: Merchant / consumer shipment demand
          detail: Demand comes from e-commerce sellers, SMEs, enterprises, branches, and institutions across Southeast Asia
        - id: parcel-network
          label: Core parcel and cross-border network
          detail: Pay-as-you-go parcel delivery, C2C lanes, and 44-country international delivery are publicly marketed
        - id: value-added
          label: Fulfilment, warehousing, and freight
          detail: Official pages market contract logistics, fulfilment, warehousing, customs, and freight forwarding
        - id: b2b-restock
          label: B2B restocking / Dash
          detail: Ninja Restock and Ninja Dash support recurring multi-drop and replenishment workflows
        - id: cold-chain
          label: Cold chain
          detail: Ninja Cold is a newer temperature-controlled offering positioned as a higher-margin adjacency
        - id: billing
          label: Shipment / contract billing
          detail: Packaging list prices and transit windows are public, but most enterprise pricing remains negotiated
        - id: revenue-quality
          label: Recognized revenue and cash quality
          detail: Service breadth is visible; service-line mix, discounts, and realized yield are not
      edges:
        - from: merchant-demand
          to: parcel-network
          label: parcel demand
        - from: merchant-demand
          to: value-added
          label: supply-chain outsourcing
        - from: merchant-demand
          to: b2b-restock
          label: replenishment need
        - from: merchant-demand
          to: cold-chain
          label: temperature-sensitive demand
        - from: parcel-network
          to: billing
          label: per-shipment charges
        - from: value-added
          to: billing
          label: contracted fees
        - from: b2b-restock
          to: billing
          label: route and stop economics
        - from: cold-chain
          to: billing
          label: premium service pricing
        - from: billing
          to: revenue-quality
          label: discounts and mix matter
    approximationNotes: >-
      This bridge is mechanistic, not an accounting policy. It shows how activity likely turns into revenue, while explicitly highlighting where public disclosures stop short of realized yield and revenue-recognition detail.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI011, CI012, CI013, CI016, CI018, CI048]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: wide
    summary: >-
      Public signals imply that Ninja Van's margins are driven by route density, automation, and service mix, while labor,
      transport, warehousing, and acquisition costs remain the main drag on cash generation.
    data:
      nodes:
        - id: volume-density
          label: 2 million parcels/day and route density
          detail: Headline volume is public, but country and service-line mix are not
        - id: pricing-yield
          label: Pricing and yield
          detail: Packaging list prices are public; enterprise and network yields remain negotiated
        - id: operating-costs
          label: Pickup, linehaul, sorting, warehousing, and last-mile labor
          detail: J&T, Sea, and Pos proxies all point to logistics-heavy cost stacks
        - id: automation
          label: Automation and network optimization
          detail: Ninja Van disclosed a 9-hub automation program targeting up to 50% productivity improvement
        - id: acquisition
          label: Seller acquisition and commercial spend
          detail: Sea shows that marketing and demand-generation costs can still rise materially at scale
        - id: margin
          label: Gross margin / EBIT per parcel
          detail: Public-company proxies suggest margins can stay thin even at large scale
        - id: liquidity
          label: Cash conversion and runway
          detail: Without Ninja Van cash and covenant data, margin improvement cannot be translated into solvency confidence
      edges:
        - from: volume-density
          to: pricing-yield
          label: mix affects yield
        - from: pricing-yield
          to: margin
          label: revenue per parcel
        - from: operating-costs
          to: margin
          label: cost absorption
        - from: automation
          to: operating-costs
          label: productivity leverage
        - from: acquisition
          to: margin
          label: commercial cost load
        - from: margin
          to: liquidity
          label: cash conversion
        - from: volume-density
          to: operating-costs
          label: route utilization
    approximationNotes: >-
      This figure combines Ninja Van disclosures with public-company proxy evidence from J&T, Sea, and Pos Malaysia. It is directional and should not be read as a reconstructed internal unit-economics model.
    claimRefs: [CI002, CI018, CI024, CI025, CI037, CI038, CI039, CI040, CI041, CI043, CI044, CI045, CI047, CI049]
  - id: FI003
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      Public evidence shows why Ninja Van's newer adjacencies could improve mix, while also showing that the balance sheet still depends on external capital and undisclosed liquidity details.
    data:
      columns:
        - Revenue-quality read
        - Cost / capital read
        - Public visibility
      rows:
        - label: Core e-commerce parcel network
          values:
            - label: High-volume and real, but service-line revenue mix is opaque
              tone: warning
            - label: Exposed to pricing pressure, route density, labor, and transport cost
              tone: warning
            - label: Parcel/day is public; realized yield and gross margin are not
              tone: warning
        - label: B2B restocking
          values:
            - label: Better logic for recurring merchant revenue than one-off parcel traffic
              tone: positive
            - label: Requires route planning, integration, and commercial execution
              tone: neutral
            - label: Mechanism is public, contract economics are not
              tone: warning
        - label: Cold chain
          values:
            - label: Management targets disproportionate profit contribution versus revenue share
              tone: positive
            - label: Reefer vehicles, cooler boxes, handling complexity, and spoilage risk raise capital intensity
              tone: warning
            - label: Pilot customers are public; realized margins are not
              tone: warning
        - label: Automation
          values:
