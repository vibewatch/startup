  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: "Country-level realized parcel yield, enterprise discount schedules, B2B route pricing, and cold-chain tariff sheets."
      whyItMatters: "Without realized pricing and discount detail, list-price evidence cannot be converted into revenue-quality or gross-margin analysis."
      diligencePath: "Request management pricing waterfalls by country and service line, including surcharge pass-through and negotiated discount ladders."
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-runway
      missingEvidence: "Unrestricted cash, monthly burn, revolving-credit drawdown status, covenant package, and downside runway model."
      whyItMatters: "Capital adequacy cannot be underwritten from debt headline size alone; runway depends on cash, burn, and debt constraints."
      diligencePath: "Request treasury dashboard, lender compliance certificate, debt agreement, and board-approved base and downside liquidity models."
      relatedQuestionRefs: [QI012, QI013]
      relatedTableRefs: [TI005]
    - type: private-evidence-only
      severity: material
      topic: service-line-mix
      missingEvidence: "Merchant count, enterprise client count, service-line revenue contribution, and country-level revenue mix."
      whyItMatters: "The bullish case depends on B2B and cold chain becoming meaningfully accretive, but public sources do not reveal whether they are currently material."
      diligencePath: "Request quarterly revenue bridge across parcel, cross-border, fulfilment, B2B, cold chain, and freight for each major market."
      relatedQuestionRefs: [QI004, QI007, QI022, QI023]
      relatedTableRefs: [TI001, TI006]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "Gross margin, cost per parcel, route-density cohorts, CAC, payback, retention, and bad-debt metrics by country and service family."
      whyItMatters: "Public-company proxies show which cost drivers matter, but they cannot prove Ninja Van's own margin path or sales efficiency."
      diligencePath: "Request unit-economics bridge by country and service line, with cohort retention and customer-acquisition analysis for parcel, B2B, and cold chain."
      relatedQuestionRefs: [QI017, QI019, QI020, QI021, QI023]
      relatedTableRefs: [TI003, TI004, TI006]
    - type: missing-source
      severity: material
      topic: restructuring-savings
      missingEvidence: "Quantified savings, severance cost, and reinvestment plan from the 2024-2025 layoffs and restructuring program."
      whyItMatters: "Layoffs are visible, but the financial benefit or disruption cost is not, so the restructuring cannot yet be modeled as margin improvement."
      diligencePath: "Request restructuring memo with headcount reductions by function, expected annualized savings, severance cash cost, and timeline to benefit realization."
      relatedQuestionRefs: [QI016, QI025]
      relatedTableRefs: [TI005, TI006]
