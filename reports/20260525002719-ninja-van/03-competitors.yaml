callouts:
- calloutType: risk
  title: Platform-owned logistics are harder threats than any single neutral courier
  body: SPX and Lazada/LEX do not need to win every parcel in the open market. They already control marketplace traffic, can tune shipping subsidies, and can change courier choice inside their ecosystems faster than neutral carriers can rebuild demand.
  claimRefs:
  - CP011
  - CP012
  - CP031
  - CP036
  - CP048
- calloutType: risk
  title: Public peers show scale does not guarantee wide margins
  body: J&T, SingPost, Viettel Post, and Grab all provide public evidence that large networks can still face thin margins, heavy incentives, or volatile e-commerce volumes. That limits how much pricing power Ninja Van should be assumed to have.
  claimRefs:
  - CP008
  - CP021
  - CP033
  - CP039
  - CP046
  - CP052
- calloutType: strength
  title: Ninja Van's best lane is neutral multi-platform orchestration, not captive orderflow
  body: The reviewed source pack suggests the most defendable position for Ninja Van is where merchants still value cross-border support, standardized integrations, and the ability to route outside a single marketplace's closed logistics stack.
