  rows:
  - - Ninja Van
    - Regional neutral 3P carrier
    - Singapore, Malaysia, Philippines, Indonesia, Vietnam and nearby cross-border lanes
    - Private; public scale not disclosed in this chapter pack
    - Door-to-door parcels, cross-border shipping, pickup/drop-off points, Shopify-linked booking
    - Defend multi-platform neutrality and cross-border workflow quality
    - No public share or margin disclosure comparable to J&T
  - - J&T Express
    - Regional neutral 3P carrier
    - SEA plus China, Middle East and Latin America
    - 7.66B SEA parcels; 34.4% SEA share; US$4.5B SEA revenue in 2025
    - Express delivery and international logistics
    - Consolidate SEA leadership while widening direct-brand and platform mix
    - Still exposed to platform volume shifts and thin global net margin
  - - Shopee Xpress / SPX
    - Platform-owned logistics stack
    - Shopee markets across Southeast Asia
    - Moves majority of Shopee parcels; ~25% logistics share in 2024 per third-party reporting
    - Marketplace fulfillment, first-party last-mile, next-day delivery in dense markets
    - Deepen captive logistics inside Shopee ecosystem
    - Standalone parcel volume, realized pricing, and margins are not transparently disclosed
  - - Lazada Logistics / LEX + Cainiao
    - Platform-owned logistics stack
    - Lazada Southeast Asia plus Alibaba cross-border corridors
    - Alibaba says Lazada runs one of SEA's leading e-commerce logistics networks
    - Marketplace fulfillment, cross-border, Cainiao-enabled technology and logistics nodes
    - Use commerce plus logistics integration to improve merchant and buyer experience
    - Public standalone logistics economics remain opaque
  - - Lalamove
    - On-demand urban substitute
    - Singapore and major Southeast Asian cities
    - Public Singapore rate card; no regional parcel-share disclosure here
    - Instant and same-day courier, multi-stop, bulky-item and furniture delivery
    - Expand same-day and SME workflow relevance
    - Not a full nationwide deferred-parcel network
  - - GrabExpress
    - On-demand urban substitute inside super-app
    - Singapore and wider Grab footprint in Southeast Asia
    - Grab Q1 2026 On-Demand GMV US$6.1B; revenue US$510M
    - Instant, same-day and 4-hour courier with insurance and tracking
    - Leverage super-app demand, incentives, and driver network
    - Economics still rely on significant incentives and urban density
  - - Flash Express
    - Low-cost merchant challenger
    - Thailand with regional merchant comparisons visible in Malaysia and Philippines
    - Public COD/funding data sparse; comparison pages show aggressive price position
    - Parcel delivery, free pickup, COD settlement, branch network
    - Win merchant volume through convenience and price
    - Less transparent on audited scale and profitability
  - - SingPost
    - Incumbent postal and eCommerce logistics provider
    - Singapore plus 220+ destinations
    - FY25/26 revenue S$376.1M; underlying net profit S$10.7M
    - Postal, warehousing, fulfillment, and last-mile delivery
    - Automate and broaden logistics services while using property base for stability
    - International eCommerce volume fell 57.9% YoY in FY25/26
  - - Viettel Post
    - National incumbent with cross-border ambition
    - Vietnam nationwide plus FedEx-linked international lanes
    - VND20.29T trailing revenue; FedEx national-network-provider role
    - Domestic and international express, logistics, warehouses, customs coordination
    - Use domestic density and logistics infrastructure to deepen B2B and cross-border relevance
    - Public margins are thin despite scale
  - - BEST Express
    - Subscale regional challenger
    - Thailand plus selected Southeast Asian cross-border routes
    - ~300K parcels/day and ~1,000 franchisees in Thailand in 2021
    - Express delivery, warehouse management, cross-border, large-item shipping
    - Grow from Thailand base into regional cross-border lanes
    - Current 2026 SEA-wide parcel scale is not richly disclosed
