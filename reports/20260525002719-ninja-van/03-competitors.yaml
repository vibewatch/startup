- id: direct-parcel-peers
  title: Neutral parcel carriers and national incumbents still matter
  body: 'Among open-market parcel carriers, J&T is the strongest public benchmark. Its FY2025 filing shows 7.66 billion Southeast Asia parcels, 34.4% market share, and roughly US$538 million of adjusted EBIT in the region. That combination of density and disclosed profit matters because it shows the minimum scale required to stay relevant against platform-controlled logistics. J&T’s regional-sponsor model also demonstrates how operational decentralization can accelerate rollout without bearing full upfront capex in each market. For Ninja Van, this is the most important direct peer because both companies are regional, parcel-centric, and depend on winning merchant and marketplace volume rather than originating it.


    Flash Express competes differently. Its public homepage foregrounds free pickup, self-registered COD, daily settlements, and rate estimation rather than audited regional market-share disclosures. That suggests a merchant-acquisition playbook built around working-capital convenience and frontline usability. BEST Express is smaller and more opaque today, but Bangkok Post still described its Thailand business as operating roughly 1,000 franchisees, handling about 300,000 parcels a day, and pushing hard into large-item and cross-border lanes amid intense competition. These challengers matter because they can pressure pricing without necessarily becoming the safest or broadest network.


    National incumbents remain important substitutes. SingPost’s FY25/26 release shows a stressed but still relevant incumbent with more than 220 destinations, rising domestic e-commerce volume, and a stated automation agenda. Viettel Post is even more significant in Vietnam: FedEx selected it as national network provider, while public market-data sources show nationwide coverage and very large domestic revenue, yet only thin operating and net margins. That combination suggests incumbents can be hard to dislodge even when economics are unattractive.'
