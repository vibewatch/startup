- id: switching-costs-density-and-trust
  title: Switching costs are moderate; density, trust, and cross-border execution create the real edge
  body: 'Public evidence does not support a strong software-like lock-in thesis for last-mile logistics. Merchants can route parcels through aggregators, retain multiple courier accounts, and shift volume by geography, service level, or promotion period. EasyParcel and Cloud Ecommerce both implicitly reinforce that behavior: their comparison logic assumes sellers actively choose among couriers rather than commit permanently to one network. That means switching costs are operational, not existential. Integrations, COD setup, tracking APIs, warehouse handoff rules, and return-to-sender handling create friction, but they rarely prevent multi-homing.


    Because contractual lock-in is modest, density and workflow trust do more of the defensive work. J&T’s public 34.4% Southeast Asia share, SingPost’s 220-destination reach, and Viettel Post’s nationwide network show how scale can translate into either better cost absorption or more dependable service. Ninja Van’s own disclosed hooks — Shopify integration, drop-off points, customs support, and defined RTS procedures — fit this pattern. The question is not whether merchants can switch; it is whether an alternative can match service consistency without rebuilding operational muscle lane by lane.


    Trust and regulatory posture also separate carriers more than headline price tables suggest. Grab advertises insurance, security frameworks, and proof-of-delivery workflows. SingPost remains a regulated postal incumbent. FedEx’s partnership shows Viettel Post can meet customs and service-standard requirements inside a global network. Lalamove’s public engagement on sustainability and platform-worker policy shows the same reality from another angle: in a commoditized market, confidence in compliance and execution still affects who wins sensitive categories and enterprise accounts.'
