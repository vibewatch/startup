  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: platform-logistics-disclosure
    missingEvidence: Standalone parcel-volume, gross-margin, and realized-yield disclosure for SPX and Lazada/LEX by country.
    whyItMatters: Without clean standalone metrics, platform-owned logistics may look smaller or less profitable than they really are, understating the threat to Ninja Van.
    diligencePath: Request management breakdown of Ninja Van volume overlap with Shopee and Lazada by market, plus internal estimates of SPX and LEX parcel mix.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: material
    topic: service-quality-benchmarking
    missingEvidence: Audited apples-to-apples SLA, damage-rate, claim-rate, and return-rate data across Ninja Van, J&T, Flash, SingPost, and Viettel Post.
    whyItMatters: Operational quality is one of the few plausible defenses in a commoditized market, but public evidence is too fragmented to prove superiority.
    diligencePath: Obtain internal carrier scorecards or large-merchant procurement comparisons covering on-time delivery, RTS, and claim performance by lane.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP002
  - type: enumeration-incomplete
    severity: material
