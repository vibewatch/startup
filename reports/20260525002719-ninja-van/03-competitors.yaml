- id: TP003
  title: Pricing / packaging comparison where public
  columns:
  - Operator / market
  - Public price or package signal
  - Included capability
  - Public caveat
  - Implication
  rows:
  - - Ninja Van via EasyParcel (Malaysia)
    - From RM22 for international shipping
    - International lanes, tracking, integration through EasyParcel
    - Comparison page says EasyParcel only offered Ninja Van internationally there
    - Ninja Van is positioned as cross-border rather than cheapest domestic option in that workflow
  - - J&T via EasyParcel (Malaysia)
    - From RM5.42 for domestic delivery; COD available
    - Domestic delivery, local COD, marketplace integrations
    - Marketplace-comparison rate rather than universal tariff
    - J&T looks better positioned for cheap domestic merchant volume
  - - GrabExpress (Singapore)
    - Fixed fares disclosed in-app / on booking page; default cover up to S$500 and top-up to S$2,000
    - Instant, same-day, and 4-hour services with tracking and proof of delivery
    - Exact fare varies by route and service level
    - Strong for urgent urban shipments and trust-sensitive deliveries
  - - Lalamove (Singapore)
    - S$0.50 platform fee; S$2 waiting-fee blocks; vehicle-specific cancellation and stop charges; late-night surcharge 1.1x-1.25x
    - Courier, car, MPV, van, lorry, multi-stop, helper options
    - Distance base fare still quote-driven by route and vehicle
    - High public price transparency, but complexity reflects task-based dispatch rather than parcel-density economics
  - - Flash Express (Thailand)
    - Free pickup; COD service with daily settlement at 2.5%
    - Merchant-facing COD workflow and branch/service-point access
    - Homepage does not provide audited network economics
    - Aggressive merchant offer can compress pricing floor
  - - J&T (Philippines benchmark)
    - ₱65 standard for up to 1kg in Metro Manila; ₱52 bulk
    - Nationwide coverage and same-day in key metros per comparison
    - Third-party comparison rather than audited tariff sheet
    - Sits in the middle of the benchmark set
  - - Ninja Van (Philippines benchmark)
    - ₱70 standard for up to 1kg in Metro Manila; ₱55 bulk
    - Tech-forward tracking and API framing in comparison
    - Directional comparison only
    - Premium relative to Flash and slightly above J&T in this market view
  - - Flash (Philippines benchmark)
    - ₱60 standard for up to 1kg in Metro Manila; ₱48 bulk
    - Budget-oriented merchant positioning
    - Directional comparison only
    - Cheapest visible benchmark among the three Philippine comparison peers
  notes: Public pricing evidence is fragmented and market-specific. Official package models are most transparent for Singapore on-demand platforms and for marketplace comparison channels, not for regional contract rates or subsidy-adjusted realized yields.
