- id: TP002
  title: Public scale and economics comparison
  columns:
  - Competitor
  - Public scale signal
  - Economics / margin signal
  - Geography or network signal
  - Channel-power implication
  - Evidence note
  rows:
  - - J&T Express
    - 7.66B SEA parcels; 34.4% share in 2025
    - ~US$538M SEA adjusted EBIT; ~1.9% global net margin inferred
    - 13-country network
    - Strong neutral density but no captive marketplace demand
    - Best public like-for-like benchmark for Ninja Van
  - - Shopee Xpress / SPX
    - Majority of Shopee parcels; ~25% logistics share in 2024
    - Logistics-services revenue pressured by shipping-subsidy net-offs
    - Strong next-day performance in Singapore; embedded across Shopee markets
    - Very high because Shopee controls orderflow and subsidy design
    - Power comes from ecosystem control more than clean standalone P&L
  - - Lazada / Cainiao
    - Leading SEA logistics network per Alibaba; no standalone parcel count disclosed
    - No clean parcel margin disclosure
    - Backed by Alibaba international commerce and Cainiao network
    - High because Lazada owns marketplace demand and Cainiao supports the stack
    - Opaque economics but strong strategic backing
  - - GrabExpress
    - US$6.1B On-Demand GMV in Q1 2026; 52M platform MTUs at group level
    - US$650M incentives in quarter; revenue US$510M
    - Urban same-day network across Grab footprint
    - High in dense cities because super-app controls demand and driver supply
    - Substitute economics differ from deferred parcel carriers
  - - Flash Express
    - Public scale mostly visible through comparisons and homepage claims
    - COD 2.5%; no audited regional margin visible here
    - Thailand-focused with visible merchant tooling
    - Wins on frontline merchant convenience rather than captive demand
    - Price-led challenger rather than disclosed scale leader
  - - SingPost
    - S$376.1M FY25/26 revenue; 220+ destinations
    - Underlying net profit only S$10.7M; operating profit down 68.9%
    - Domestic postal backbone plus international destinations
    - Medium because incumbent trust is strong, but growth is weak
    - Incumbent still credible, especially for regulated and domestic flows
  - - Viettel Post
    - VND20.29T trailing revenue; 2M orders/day in 2023; FedEx NNP in 2026
    - 2.26% operating margin; 1.85% net margin
    - Nationwide Vietnam coverage plus customs-capable cross-border role
    - High inside Vietnam because network and state-linked trust are entrenched
    - Shows how even leaders operate on thin margins
  - - BEST Express Thailand
    - ~300K parcels/day; ~8% Thai unit share in 2021
    - No current public SEA margin disclosure in reviewed pack
    - ~1,000 franchisees plus cross-border Thailand corridors
    - Low to medium because demand is not captive and disclosure is thin
    - Material but smaller challenger
  - - Ninja Van
    - Public scale not disclosed here
    - No public margin disclosure in reviewed pack
    - Regional parcel brand with Singapore workflow detail and cross-border support
    - Depends on neutral merchant relationships rather than captive orderflow
    - Opacity itself is a diligence constraint
  - - Flash + Ninja + J&T PH benchmark
    - Cloud Ecommerce comparison across 81 / 75 / 68 provinces
    - Metro Manila benchmark rates cluster tightly around ₱60-₱70 per up-to-1kg parcel
    - Philippines example shows coverage plus pricing compression
    - Low switching friction when merchants compare live alternatives
    - Useful directional evidence, not audited market-wide truth
  notes: Rows mix filings, official releases, and reputable secondary synthesis. Economic metrics are not directly comparable because some are quarterly, some annual, and some are inferred from publicly reported fragments.
