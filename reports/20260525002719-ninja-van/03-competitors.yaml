- id: platform-owned-and-on-demand-substitutes
  title: Platform-owned logistics and same-day delivery are the structurally harder threats
  body: 'The public evidence package points to SPX and Lazada/LEX as the most structurally dangerous competitors for Ninja Van, even if their standalone parcel metrics are less transparent than J&T’s. Sea’s 2025 results show that Shopee served around 400 million active buyers and 20 million sellers, while third-party reporting says SPX now moves the majority of Shopee’s billions of parcels. Sea’s own logistics-services disclosure is also revealing: value-added services revenue tied to logistics fell because of higher net-offs against shipping subsidies. That is exactly the pattern Ninja Van has to fear. A platform that controls both traffic and subsidies can trade off logistics monetization against ecosystem growth in ways a neutral courier cannot.


    Alibaba’s annual report says Lazada operates one of the leading e-commerce logistics networks in Southeast Asia, and Cainiao’s official materials emphasize AI, automation, and end-to-end network control. This points to the same strategic configuration: logistics is not a standalone business first; it is part of a commerce control stack. Public disclosures do not give clean Lazada parcel-volume or margin disclosure, but the absence of detail does not reduce the competitive risk. It instead means outside carriers must react to a powerful black box.


    GrabExpress and Lalamove matter for a different reason. They are not optimized for nationwide deferred parcel density, but they are extremely credible for urgent urban shipments. Grab explicitly sells instant and same-day delivery with insurance, fixed fares, and photo proof, while Lalamove publishes a detailed schedule of platform fees, waiting charges, and stop surcharges. For merchants whose buying criterion is speed and dispatch flexibility rather than nationwide parcel economics, these platforms are viable substitutes that cap how much any parcel carrier can charge in dense urban lanes.'
