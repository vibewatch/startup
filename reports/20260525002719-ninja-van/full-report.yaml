      - number: '6.2'
        title: Named customer proof and production-versus-pilot evidence
        blocks:
          - type: paragraph
            body: >-
              Public named proof is concentrated in merchant-facing and B2B case-study style references rather than
              blue-chip enterprise procurement disclosures. Ninja Van Singapore features three fashion and lifestyle
              shippers—MGP Label, Caramel Monster, and Mod Parade—whose quotes describe active operational use, not mere
              logo placement. MGP Label explicitly ties Ninja Van to three-working-day cross-border delivery from
              Singapore to Malaysia, while Caramel Monster emphasizes instant updates and support-led exception handling
              and Mod Parade frames the service as consistently reliable. The Philippines case-study stream adds a
              different kind of proof: Una Brands used Ninja Fulfillment as a plug-and-play warehousing, fulfilment, and
              last-mile partner while testing entry into the Philippine market, which reads as a pilot-to- production
              style market-entry deployment rather than a long-mature account. Malaysia's Ninja Restock launch adds the
              clearest B2B named account in the public record—Faber-Castell—where the value proposition is inventory
              replenishment, smaller more frequent shipments, and fewer stock-outs. Together these references
              demonstrate real production usage across merchant parcels, cross-border commerce, fulfilment, and B2B
              restock, but they still skew toward SME/mid-market proof. Public evidence for named enterprise,
