  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Debt documents
        - HSBC facility agreement, covenants, collateral, and priority terms
        - Debt seniority can wipe out equity upside faster than headline valuation suggests.
        - Legal and lender diligence; obtain the executed RCF and amendment history.
      - - Cap table / waterfall
        - Fully diluted ownership, liquidation preferences, option pool, and any ratchets
        - The 2025 preferential terms may make the headline mark a poor proxy for common-equity value.
        - Company finance + counsel; build a full liquidation waterfall.
      - - Audited FY2025-2026 financials
        - Revenue by line, gross margin, EBITDA, operating cash flow, and cash balance
        - The comp range depends on whether Ninja Van is becoming a better business or just a tighter one.
        - Finance diligence; request audited statements and management bridge.
      - - Customer concentration / retention
        - Top-20 customers, renewal profile, churn, and platform dependence
        - Scale only deserves a premium if revenue quality is durable and diversified.
        - Commercial diligence; cohort and concentration pack by geography and product.
      - - B2B / cold-chain economics
        - Revenue, gross margin, and contribution profit for restocking, cold chain, and upstream services
        - The bull case only works if diversification is economically meaningful, not just narratively attractive.
        - BU diligence with product and country heads; verify margins and repeat usage.
      - - Restructuring proof
        - Vietnam exit post-mortem, country-level profitability, and management plan for weak lanes
        - Needed to decide whether retrenchment is disciplined pruning or evidence of structural fragility.
        - Country-level operating review and board materials.
    notes: >-
      These asks are ranked around valuation underwriting, not generic company learning. Any one of the first three can
      change the equity outcome materially.
    claimRefs:
      - CV007
      - CV012
