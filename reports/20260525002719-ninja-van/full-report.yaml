            body: >-
              The financing record is the main reason price discipline matters. Ninja Van’s 2021 Series E was a genuine
              scale-financing event: US$578 million, a broad strategic-investor syndicate, and a reported valuation
              above US$1 billion during the region’s e-commerce boom. But the company did not translate that high-water
              mark into a clearly superior 2025 public-evidence case. By 2024 it had added a three-year US$50 million
              HSBC revolving credit facility, which is sensible as liquidity management but still inserts senior capital
              ahead of common equity. By 2025, reporting pointed to an insider-led US$80 million round at roughly the
              same US$1 billion headline valuation, this time with favourable or preferential terms. That combination
              matters more than the headline number itself. A flat headline valuation over four years is not neutral
              when the later round appears more structured and the company is coming off revenue pressure. The likely
              result is that the effective clean-equity price for a new investor is worse than the press headline
              suggests, because debt, preferences, and insider protections absorb value before ordinary upside does.
            claimRefs:
