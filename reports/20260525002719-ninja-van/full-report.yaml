      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Ninja Van does have real mitigants. It publishes delivery terms, privacy rules, restricted-zone lists,
              scam advisories, claims workflows, compliance reporting channels, and a more focused strategy around B2B
              restocking and cold chain. Those are better than opacity, but they are mostly reactive controls: they
              explain how to file a claim, report damage, or identify scams after something has already gone wrong. They
              do not answer the hard underwriting questions on loss rates, country-level profitability, customer
              concentration, or whether service quality and margin improved after retrenchment. The underwriting stance
              should therefore stay adverse until diligence closes those gaps. The key thesis-breakers are public and
              monitorable: another material Singapore retrenchment or core-country exit, another preference-heavy down
              round, repeated peak-period delivery apologies, a formal privacy or consumer-fraud enforcement event, or
              evidence that Ninja Van remains premium-priced while reliability trails peers. If two or more of those
              happen together, the company stops looking like a logistics turnaround and starts looking like a regional
              retrenchment story being financed through temporary investor tolerance.
