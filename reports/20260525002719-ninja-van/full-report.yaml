      - number: '6.3'
        title: Adoption trajectory, repeat usage, and deployment depth
        blocks:
          - type: paragraph
            body: >-
              The adoption story is strongest when read as a stack of broad platform scale, country-level operating
              density, and merchant-software usage rather than a single customer-count KPI. Ninja Van says nearly
              2,000,000 shippers use the service across Southeast Asia, while SCMP and TradingView/GuruFocus both
              reference about 2 million parcels per day and six operating markets. Malaysia provides the best
              country-level repeat-usage proxy: The Edge reports 5,500 retail stores, 200 hubs, and a step-up from 1
              million parcels in 2017 to 10 million in 2019 and 300 million cumulative parcels by September 2023.
              Merchant tooling adds another adoption layer: Shopify support for MY/PH merchants and a WordPress listing
              for a Ninja Van (MY) plugin with 1,000+ active installations suggest recurring digital-merchant use, even
              if those installs are not equivalent to active paying accounts. The Philippines fulfilment product also
              shows operational maturity, with same-day handoff for orders received by 4 pm and simultaneous
              tracking-number generation for integrated accounts. What is missing is a clean current denominator by
              country, service line, or cohort. Public scale is real, but its composition between low-ACV sellers and
              higher-value enterprise contracts remains opaque.
