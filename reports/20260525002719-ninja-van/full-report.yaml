      - number: '7.4'
        title: People, execution, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The people and model risk is not just that Ninja Van cut staff; it is that the company has cut staff
              repeatedly while simultaneously asking the market to believe in a strategic pivot. August 2025 marked a
              third Singapore layoff round since 2024, with about 12% of the local workforce affected after earlier cuts
              to the regional tech team and headquarters workforce. Management says resources are being reallocated
              toward tech-enabled B2B restocking and cold chain, and affected employees reportedly received severance,
              temporary health coverage, mental-health support, and longer option-exercise windows. That reduces
              immediate employee-relations risk, but it does not prove that the company retained the right operators,
              support talent, or compliance leadership to stabilise the network while pivoting away from commoditised
              e-commerce parcel volumes. Financially, the valuation reset to about US$1 billion, the US$80 million
              internal round, and the decision to hold off on IPO until profitability improves all point to a business
              still dependent on investor patience. COD terms add another model friction: remittance is monthly, with a
              3% or S$1 minimum fee plus a platform fee, while Dash terms also show small-shipper surcharges and
              optional liability-cover fees. Those economics may be acceptable for sticky enterprise shippers, but they
              are not the profile of a business that has already escaped margin pressure.
