      - - Bear
        - Further revenue decline, weak B2B adoption, covenant pressure, or another structured round.
        - US$350M-US$630M EV from ~0.5x-0.9x sales; common-equity downside is severe if structure tightens.
        - Down-round risk, more exits from weak geographies, or concentration/churn evidence.
