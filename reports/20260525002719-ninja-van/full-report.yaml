      - number: '4.3'
        title: Cost structure and margin drivers in last-mile logistics
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Ninja Van's cost structure looks like classic last-mile logistics rather than
              software: pickup and last-mile labor, linehaul, sorting, warehousing and fulfilment, route density,
              customer acquisition, and capex for automation or cold-chain equipment. GeoPost's 2022 partner release is
              the clearest operating signal from the company ecosystem, describing a US$50 million automation program
              across nine hubs with a targeted 50% productivity gain. That is helpful for identifying the levers
              management believes matter, but it does not disclose cost per parcel or gross margin.

              Public-company proxies fill the gap only directionally. J&T's FY2024 results show that even at much larger
              scale, gross margin was only about 10.5%, while the SEA unit-economics narrative explicitly depends on
              flexible pricing, salary rationalization, self-owned fleet economics, linehaul optimization, and automated
              sorting. Sea's 2025 20-F shows marketplace economics are still burdened by logistics and warehousing costs
              plus large sales and marketing bills as order volume expands. Pos Malaysia's 2025 annual report describes
              aggressive parcel pricing, platform-led in-house logistics, and margin defense through automation and
              network optimization. The read-through for Ninja Van is that route density and automation can help, but
              the business is still structurally exposed to price competition, labor, transport, and fulfillment costs.
