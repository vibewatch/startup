  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Theme
      - Current evidence
      - Threat vector
      - Severity
      - Why it matters
      - Diligence ask
    rows:
      - - Density and lane utilization
        - J&T's 34.4% SEA share and 7.66B parcels show scale advantage
        - A larger neutral peer can spread cost faster than Ninja Van
        - High
        - Density is one of the few durable cost advantages in this category
        - Need comparable Ninja Van parcel-volume, route-density, and sortation-utilization disclosure
      - - Captive demand inside marketplaces
        - SPX and Lazada control orderflow, subsidies, and courier choice
        - Neutral carriers can lose volume even after scaling third-party networks
        - High
        - Channel power beats courier competence when marketplaces internalize logistics
        - 'Need merchant-mix data: platform-originated volume versus direct-brand volume for Ninja Van'
      - - Cross-border and customs execution
        - Ninja Van, J&T, Cainiao, BEST, and Viettel all market cross-border capability
        - Cross-border becomes table stakes rather than differentiation
        - Medium
        - Cross-border can still help neutral carriers if quality is measurably better
        - Need on-time customs-clearance and damage-rate data by lane
      - - Trust, insurance, and compliance
        - >-
          Grab advertises insured delivery; SingPost and Viettel carry institutional trust; Lalamove engages on
          platform-work policy
        - Sensitive categories may favor operators with stronger perceived compliance
        - Medium
        - Trust can protect pricing in enterprise or regulated verticals
        - Need enterprise-case-study win/loss data for Ninja Van
      - - Merchant multi-homing
        - Comparators and integrators let merchants keep several couriers live
        - Low contractual lock-in increases price pressure and churn risk
        - High
        - If merchants can route around Ninja Van quickly, pricing power stays weak
        - Need merchant retention, API stickiness, and wallet-share data by segment
      - - Sector margin pressure
        - ION, Sea, Grab, SingPost, and Viettel all show subsidy or low-margin pressure
        - Category commoditizes before Ninja Van captures durable economics
        - High
        - Public peers already show that volume does not guarantee margin resilience
        - Need Ninja Van's contribution-margin bridge by parcel, lane, and customer class
    notes: >-
      Severity is a judgment about how directly each vector can impair pricing power or retention over the next two to
      three years. The register mixes direct competitor pressure with substitute and status-quo risks because buyers can
      solve the job in multiple ways.
    enumerationScope:
