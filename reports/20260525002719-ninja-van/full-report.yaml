      - number: '8.4'
        title: Recommendation, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The honest recommendation at the current headline valuation is research-more. This is not an “avoid
              forever” call; it is a statement that the public record does not yet support paying ~US$1 billion as if it
              were clean, pari-passu common equity backed by durable growth and margin proof. The upside case exists:
              scale is real, strategic backers remain relevant, automation capex is tangible, and B2B/cold-chain
              expansion could lift quality over time. But the adverse record is too strong to ignore. Revenue reportedly
              shrank, the parcel market is still structurally competitive, the business exited Vietnam express delivery,
              and the current financing reportedly contains preferential exit rights. That means diligence has to focus
              less on generic company quality and more on the exact waterfall: debt terms, preferences, customer
              concentration, gross margin, and whether B2B economics are large enough to re-rate the model. A lower
              clean entry price or a much better evidence package could move the call up. Another structured round,
              further revenue slippage, or covenant pressure would push it down quickly.
            claimRefs:
              - CV043
