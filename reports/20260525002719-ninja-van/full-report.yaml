      - number: '5.4'
        title: Trust, support, privacy, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Ninja Van’s public trust posture is stronger on operational controls than on third-party assurance. The
              company publishes privacy, legal, and whistleblowing pages; packaging rules; prohibited-item guidance;
              shipper claims instructions; and multiple support paths for tracking, billing, COD, pickup, and delivery
              issues. That shows the company has documented handling for personal data, shipment exceptions, and claims
              investigation. The dashboard guides add practical trust signals such as proof-of-delivery photos,
              recipient signatures, location records, and search filters that make operational disputes easier to
              inspect. Still, there is a clear gap between documented workflows and externally assured reliability or
              security posture. Across the fetched pack, there is no public status page, published uptime SLA, SOC
              report, ISO 27001 certificate, or incident archive for the dashboard or API surfaces. Cold-chain pages
              also describe methods and benefits but not externally verified excursion metrics or compliance
              attestations. For diligence, that means Ninja Van’s trust story is credible at the process level yet
              under-documented at the assurance level.
