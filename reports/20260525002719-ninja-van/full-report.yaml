      - number: '6.4'
        title: Retention, durability, satisfaction, and adverse signal
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is mixed. On the positive side, named shippers describe recurring operational
              use rather than one-off pilots, Malaysia's parcel-growth curve and retail-point density imply repeated
              usage, and Ninja Van publishes a formal complaints and compensation policy in Vietnam that is oriented
              toward ongoing shipper relationships. The company's service architecture—dashboard integrations,
              fulfilment systems, B2B restocking, and broader 3PL modules—also increases switching friction versus a
              pure spot-delivery model. Yet none of the reviewed public sources disclose NRR, GRR, churn, renewal
              cohorts, contract length, or top-20 customer retention. External satisfaction signals are also not cleanly
              positive: ComplaintsBoard shows a 1.0/5 profile with unresolved complaints, and PissedConsumer shows 1.4/5
              with 91% unfavorable feedback centered on missing parcels, false delivery claims, and templated support.
              SayTrack, by contrast, shows only three reviews and a 5.0/5 rating, which is too small to offset the
              larger adverse pools. The right read is not that retention is weak by default, but that public proof of
              durability is still proxy-based and service-quality risk remains meaningful.
