      - CR057
      - CR058
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How operational, legal, and financing risks can cascade into churn, margin pressure, and valuation compression.
    data:
      nodes:
        - id: n1
          label: Delivery delays / mishandling
          detail: Backlogs, missed pickups, damaged parcels
        - id: n2
          label: Merchant trust erosion
          detail: Claims, complaints, and weaker repeat use
        - id: n3
          label: Pricing concessions / churn
          detail: Discounting or lost parcel volume
        - id: n4
          label: Margin pressure
          detail: Lower yield and higher support/remediation cost
        - id: n5
          label: Funding stress
          detail: Need for insider capital or slower investment
        - id: n6
          label: Valuation compression
          detail: Preference-heavy rounds and weaker exit options
        - id: n7
          label: Privacy / scam event
          detail: PDPA, phishing, or COD-fraud escalation
        - id: n8
          label: Regulatory / remediation cost
          detail: Investigation, refund, or redesign burden
        - id: n9
          label: Repeated restructuring
          detail: Layoffs and market exits while pivoting
      edges:
        - from: n1
          to: n2
          label: missed SLA and parcel confidence
        - from: n2
          to: n3
          label: merchants switch or demand concessions
        - from: n3
          to: n4
          label: lower yield per parcel
        - from: n4
          to: n5
          label: profitability slips further out
        - from: n5
          to: n6
          label: new money comes with weaker terms
        - from: n7
          to: n8
          label: fraud/privacy event drives response cost
        - from: n8
          to: n4
          label: legal and support spend rises
        - from: n9
          to: n1
          label: less execution slack during peaks
        - from: n9
          to: n5
          label: signals pivot still needs capital
    approximationNotes: >-
      The DAG compresses the chapter’s causal logic into a monitorable risk-flow map; it is not a company-disclosed
      operating model.
    claimRefs:
      - CR008
      - CR021
      - CR022
      - CR024
      - CR025
      - CR032
      - CR033
      - CR035
      - CR045
      - CR046
