            title: The relevant market is parcel-density plus adjacent services
            body: >-
              Treat Ninja Van as a regional parcel-density business with monetizable adjacencies, not as a proxy for all
              Southeast Asian logistics spend. The inclusion logic is about shared infrastructure and workflow overlap.
            calloutType: insight
