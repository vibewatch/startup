      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - B2B, cold chain, and automation offset parcel price pressure; no new down-round; growth reaccelerates.
        - >-
          US$910M-US$1.26B EV from ~1.3x-1.8x on reported FY2025 revenue; current headline mark only works if terms are
          clean.
        - Requires materially better margins than parcel peers and cleaner capital structure.
        - Possible, but not yet proven in public evidence.
      - - Base
        - >-
          Parcel pressure persists but diversification prevents deeper erosion; public comps remain the valuation
          anchor.
        - US$560M-US$910M EV from ~0.8x-1.3x sales; current ~US$1B headline mark looks full for new money.
        - Preference overhang and debt reduce common-equity upside even if business stabilizes.
