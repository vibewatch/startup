      - number: '4.2'
        title: GTM motion and newer monetization bets
        blocks:
          - type: paragraph
            body: >-
              Ninja Van's GTM motion is increasingly framed as an embedded logistics operating layer for merchants,
              branches, and institutions rather than only a parcel carrier. Philippines materials pitch Ninja Restock
              with smaller load requirements, co-loaded shipments, multi-drop routes, fixed transparent pricing,
              nationwide reach, and easy integration. Ninja Dash is positioned for recurring B2B partner deliveries and
              bulky items, with nationwide reach and parcel liability coverage. The company's own 2025 scaling guide
              defines scale as growing revenue faster than operating costs, which is consistent with a
              process-efficiency thesis rather than volume-at-all-costs.

              Business Times makes the strategic turn explicit. Ninja Van launched Ninja Cold and Ninja B2B to diversify
              beyond e-commerce and pursue higher-margin business in search of profitability. Cold chain started in
              Singapore and Malaysia with roughly 20 trial customers, while Indonesia, the Philippines, and Vietnam were
              slated to follow. Management's stated ambition is notable: Ninja Cold eventually contributing 10% of
              revenue but 50% of total profit. That is directionally attractive, but it should be read as management
              target language, not a demonstrated revenue mix today. Public evidence shows the strategic logic and early
              rollout, not a proven earnings bridge.
