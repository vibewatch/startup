        title: Product workflow and solution surface
        blocks:
          - type: paragraph
            body: >-
              Ninja Van’s public product surface is broader than a parcel-tracking widget or a generic courier label.
              The official Singapore and Indonesia solution pages show a workflow stack that starts with warehouse and
              fulfilment operations, moves through domestic last-mile delivery, and extends into B2B restock, cold-chain
              transport, and cross-border shipping. That matters because the company’s core product appears to be an
              operating system for regional logistics execution rather than a single consumer app. The strongest
              verified evidence here is the solution menu itself: warehousing pages describe storage, picking, packing,
              and handover; B2B pages describe replenishment and cargo-style flows; cross-border pages describe
              international expansion; and cold-chain pages describe temperature-sensitive delivery methods. The weaker
              part of the story is performance proof. Delivery speed, geographic coverage, and temperature integrity are
              mostly described on company-controlled pages, so those claims should be treated as product-surface
              disclosures rather than independently verified service metrics. The practical takeaway is that Ninja Van
              has a real multi-module logistics workflow, but public maturity evidence is uneven across modules.
