      - number: '5.5'
        title: Maturity, differentiation, and roadmap implications
        blocks:
          - type: paragraph
            body: >-
              The main product differentiation appears to be operational breadth plus enough software to make that
              breadth usable by merchants and partners. Public evidence supports a meaningful control plane: bulk
              upload, labels, tracking, proof of delivery, reporting, Shopify installation, API onboarding, and partner
              integration paths are all documented in detail. That level of operational documentation is a strong
              maturity signal for the shipper workflow. By contrast, the more ambitious solution claims—cross-border
              network breadth, cold-chain robustness, and ecosystem scale—remain less verified. The ecosystem pages show
              real integration exposure through Shopify, SHOPLINE, carrier-tracking platforms, EasyParcel pages, and a
              small community GitHub wrapper, but they do not provide public install counts, API volume statistics, or
              conversion data for those integrations. As a result, the product should be viewed as a proven logistics
              workflow platform with visible merchant tooling, not as a transparently benchmarked developer platform.
              The roadmap implication is straightforward: future diligence should focus on measured reliability,
              externally assured security, cold-chain performance data, and adoption metrics for API and app-based
