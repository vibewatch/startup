  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surfaces, and public traction
        blocks:
          - type: paragraph
            body: >-
              Ninja Van's official surfaces show a broader logistics business than a simple marketplace parcel courier.
              The Singapore homepage markets contract logistics, customs clearance, warehousing, fulfilment, retail
              restocking, last-mile parcel delivery, international parcel delivery to 44 countries, freight forwarding,
              cold-chain delivery, and B2B delivery. Malaysia adds branded offerings such as Ninja B2B Restock, Ninja
              Fulfilment, and Ninja Cold. The Philippines homepage is the clearest public scale marker in the reviewed
              pack: 120 million-plus Southeast Asians served, 2 million parcels delivered every day, and 100% coverage
              in Southeast Asia. That establishes real operating footprint and throughput.

              The monetization detail is still uneven. Public list pricing appears mainly at the packaging layer through
              Ninja Packs in Malaysia, where prepaid polymailers and bundles carry posted RM prices. The consumer-facing
              C2C portal publishes working-day windows by lane, but the reviewed public extract does not expose a simple
              core-network rate card for merchants or enterprise accounts. That means the public record is strong on
              what Ninja Van can sell and where it can deliver, but weak on realized yield, discounting, and
              service-line mix. Exact merchant counts, warehouse counts, and country-by-country revenue contribution
              remain undisclosed even as parcel volume is now disclosed at a headline level.
