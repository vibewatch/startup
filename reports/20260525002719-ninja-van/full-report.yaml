      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Ninja Van is publicly visible enough to clear one major hurdle: this is not a niche courier with
              theoretical products. The company discloses meaningful parcel throughput, broad Southeast Asian coverage,
              and a credible shift into B2B restocking, fulfilment, and cold chain. But revenue quality is still
              difficult to underwrite. Public materials do not reveal merchant count, service-line mix, country
              contribution, realized parcel yields, gross margin, CAC or payback, cash, runway, or debt terms. The
              positive thesis—large network scale plus higher-margin adjacencies—therefore remains offset by an equally
              visible adverse thesis of widening FY2023 losses, layoffs, a fresh debt line, and a 2025 internal round at
              a lower valuation.

              The right financial conclusion is cautious rather than bearish. Public evidence supports medium-confidence
              belief that management is trying to move mix toward better-margin segments and lower unit cost with
              automation. It does not support medium-confidence belief that the pivot has already repaired revenue
              quality or balance-sheet strength. Until management discloses service-line revenue mix, realized yield,
              gross margin, cash, burn, and covenant data, Ninja Van remains a scale story with real logistics relevance
              but incomplete investment-grade financial disclosure.
