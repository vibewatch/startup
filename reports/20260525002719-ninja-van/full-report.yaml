      - number: '2.5'
        title: Evidence gaps and valuation read-through
        blocks:
          - type: paragraph
            body: >-
              The public record is sufficient to show that Ninja Van operates inside a large, growing, and
              service-diverse Southeast Asian delivery market, but it is not sufficient to isolate the company's real
              serviceable obtainable market. Public sources confirm that the company spans last- mile parcels,
              warehousing, cross-border delivery, B2B restock, and cold chain, yet they do not disclose parcel share,
              revenue mix, attachment rates, country-by-country density, or the portion of demand that comes from
              enterprise contracts versus long-tail merchants. That missing company- specific denominator is the main
              reason this chapter treats market sizing as evidence-constrained instead of pretending to know a single
              clean TAM/SAM/SOM stack.

              For valuation, the practical implication is to focus on density and monetizable mix rather than on
              abstract GMV. A carrier with strong parcel density but weak enterprise attachment or weak cold- chain
              economics can still be trapped in price wars; a company with modest parcel share but strong cross-border,
              B2B restock, and warehousing attachment can monetize much better than parcel volume alone implies. The
              evidence base supports a constructive demand view, but it preserves material uncertainty on service mix,
              margin quality, and attributable share. That is a convergence issue, not a reason to inflate the market
              boundary.
            claimRefs:
              - CM012
              - CM034
              - CM040
              - CM041
              - CM042
              - CM043
              - CM044
