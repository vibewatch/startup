  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by buyer, user, payer, geography, and use case
        blocks:
          - type: paragraph
            body: >-
              Ninja Van now markets a clearly tiered customer base rather than a one-size-fits-all parcel product. Its
              Singapore homepage explicitly separates online sellers, SMEs, and enterprises, while Singapore, Malaysia,
              the Philippines, and Indonesia all present broader logistics stacks that extend beyond parcel handoff into
              fulfilment, warehousing, freight, B2B restocking, and—at least in Singapore and Malaysia—cold-chain
              delivery. That matters because buyer, user, and payer roles vary by segment: an online seller or
              micro-merchant often self-buys and self-uses the service, SMEs add store and warehouse operators plus
              inventory owners, and larger enterprise accounts shift decision-making to procurement and supply-chain
              teams while keeping operational users in logistics or warehouse functions. Public proof is strongest in
              consumer commerce and seller tooling, but the service map shows a deliberate attempt to move upmarket into
              higher-ACV B2B, 3PL, and supply-chain orchestration. Geography also matters: Singapore surfaces the most
              complete service suite, Malaysia emphasises nationwide retail and B2B scale, the Philippines highlights
              enterprise fulfilment, and Indonesia shows that replenishment and cold-chain modules are being replicated
              outside the core Singapore market.
