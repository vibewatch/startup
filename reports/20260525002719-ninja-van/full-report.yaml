  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct peers, platform-owned stacks, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Ninja Van does not compete in a single clean peer set. The closest neutral third-party parcel peers are
              J&T Express, Flash Express, BEST Express, and the large national incumbents that can still serve
              e-commerce merchants at scale, such as Viettel Post in Vietnam and SingPost in Singapore. J&T is the
              clearest direct scale benchmark because it openly discloses Southeast Asia parcel volume, market share,
              and profit. Flash is the low-cost merchant-oriented challenger with free pickup and COD tooling. BEST
              remains a smaller and less transparent regional factor, but its Thailand business still shows cross-border
              ambition. Viettel Post and SingPost matter because merchants in their home markets can always default to
              incumbent domestic networks instead of switching to a regional specialist.


              The harder threats, however, are not neutral couriers but platform-owned logistics stacks. Sea’s
              disclosures and third-party reporting on SPX show that Shopee is not merely a demand source; it is also a
              courier selector with internal logistics capacity, shipping subsidies, and service-level influence.
              Alibaba’s annual report makes the same point from the Lazada side: Lazada already operates one of
              Southeast Asia’s leading e-commerce logistics networks, while Cainiao provides the technology and
              cross-border backbone. These operators start with captive orderflow, so they do not have to win each
              parcel on open-market price alone.


              Finally, Ninja Van also competes against same-day urban substitutes and merchant self-orchestration.
              GrabExpress and Lalamove are not direct replacements for every deferred parcel route, but for urgent city
              deliveries they are credible substitutes. Aggregators such as EasyParcel, plus direct brand logistics
              contracts, make multi-homing common and reduce any single courier’s lock-in. In practice, the market is
              defined less by feature parity than by who controls demand, density, and merchant workflow.
