        blocks:
          - type: paragraph
            body: >-
              Ninja Van's visible milestone arc is clear even if some private-company metrics are not. The company moved
              from a 2014 founding story to six-market regional coverage, then to a major 2021 Series E that brought in
              Alibaba and deepened the GeoPost partnership. By 2024, partner materials were talking less about
