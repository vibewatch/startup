      - number: '4.4'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              The clearest capital signal is that Ninja Van is still managing liquidity and restructuring priorities
              rather than presenting a cash-rich, self-funded expansion story. In October 2024 it secured a three-year
              US$50 million revolving credit facility from HSBC, explicitly to support regional growth and the
              development of e-commerce express logistics, B2B restocking, and cold-chain delivery services. That should
              help working capital and network investment, but it does not disclose drawdown status, pricing, covenant
              package, or unrestricted cash.

              The 2025 financing discussions matter more. The Straits Times and a Yahoo Finance mirror reported an
              internally led US$80 million raise at roughly a US$1 billion valuation, about half the prior mark, with
              preferential exit terms for participating investors. Add the last public P&L anchor from Business
              Times—FY2023 revenue of S$1.0 billion but loss of S$326.8 million—and the picture is of a company that has
              scale but still needed both debt flexibility and new investor support. The August 2025 Singapore layoffs
              reinforce that interpretation as a cost-reset and portfolio-prioritization exercise, not a signal that
              public cash generation has already solved the funding problem.
