  - id: TR006
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Service quality relapse
        - Another broad public apology, surge in backlog complaints, or repeated missed-pickup wave in Singapore
