  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and excluded spend
        blocks:
          - type: paragraph
            body: >-
              Ninja Van should be analyzed against the Southeast Asian logistics workflows it actually sells, not
              against the full region-wide logistics, freight, or 3PL universe. Its Singapore and Malaysia solution
              pages consistently describe a stack that starts with last-mile parcel delivery and then extends into
              fulfillment, warehousing, B2B store replenishment, international deliveries, freight-forwarding support,
              and cold-chain handling. Those offerings all sit close to the order flow of e-commerce merchants,
              retailers, distributors, and selected enterprise shippers. The included spend for this chapter is
              therefore parcel pickup, sortation, line-haul, last-mile delivery, cross-border parcel handoff,
              temperature-controlled handling for relevant products, and B2B replenishment or warehousing when it
              directly feeds store shelves or online orders.

              That boundary explicitly excludes broad ocean freight, heavy industrial trucking, generic contract
              logistics with no parcel linkage, marketplace take rates, and merchandise value itself. It also excludes
              cold-chain and enterprise logistics spend that never touches parcel, store replenishment, or rapid
              regional fulfillment workflows. The practical substitutes are national posts, retailer-owned fleets,
              platform in-house networks, informal couriers, and wholesalers that rely on self-pickup or route-based
              distribution. Defining the market this way matters because the strategic issue for Ninja Van is network
              density and attachment across adjacent services rather than whether Southeast Asia has a very large
              abstract logistics sector.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
