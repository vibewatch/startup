  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The valuation bull case starts with a business that still has meaningful strategic and operating proof.
              Public and partner sources continue to show a six-market Southeast Asian footprint, roughly two million
              parcels per day, a reported customer base close to two million businesses, and concrete moves beyond pure
              last-mile parcel into Ninja Direct, fulfillment, restocking, and cold chain. GeoPost’s automation program
              and the URC restocking partnership both suggest the company is trying to escape a low-multiple courier box
              by raising productivity and moving into more operationally embedded B2B workflows. The anti-thesis is that
              the public record since 2024 has tilted negative faster than the diversification story has matured.
              Revenue reportedly fell in FY2025, losses only narrowed via cost control, price wars remain intense,
              Shopee and Lazada have in-house logistics leverage, and Vietnam exit news shows the legacy express model
              is not scaling cleanly across every market. In valuation terms, that means the thesis is not “great
              company, therefore premium price,” but rather “interesting asset with optionality, facing a still-unproven
              margin transition.”
