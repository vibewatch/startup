    rows:
      - - J&T Global Express
        - Public parcel peer
        - US$9.82B market cap; Hong Kong listed parcel network
        - Cap/revenue ~0.98x on 2025 and ~0.65x on 2026e
        - Closest listed regional parcel-network benchmark
        - Public-company liquidity and different geography mix reduce perfect comparability.
      - - Sea Ltd
        - Public e-commerce / platform peer
        - US$53.45B market cap; ~US$25.19B trailing revenue
        - EV/revenue ~1.85x; P/S ~2.21x
        - Useful upper-bound benchmark for stronger platform economics
        - Gaming, marketplace, and fintech mix makes it a much cleaner and richer asset than a courier network.
      - - Singapore Post
        - Public lower-growth logistics peer
        - US$0.59B market cap; ~US$0.99B trailing revenue
        - ~0.6x market cap / revenue
        - Brackets the low end for mature logistics equity
        - Legacy mail mix and Singapore focus make it slower growth than Ninja Van.
      - - Ninja Van 2021 Series E
        - Private reference (peak cycle)
        - US$578M raise; broad strategic-investor syndicate
        - Reported valuation above US$1B
        - Shows what the market once paid during the e-commerce boom
        - Occurred before post-pandemic normalization and before today’s financing structure.
      - - Ninja Van 2025 internal round
        - Private reference (current)
        - US$80M reported internal raise
        - Reported valuation about US$1B with preferential terms
        - Most relevant current price anchor for a new investor
