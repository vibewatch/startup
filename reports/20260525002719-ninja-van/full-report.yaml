  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Public evidence shows a journey that starts with seller self-serve shipping, deepens through tracking and
      fulfilment, and expands into B2B restock, 3PL, and cold-chain services for higher-value accounts.
    data:
      items:
        - label: Discovery
          stage: Discovery
          actors:
            - Online seller
            - SME founder
            - Supply-chain buyer
          touchpoints:
            - Ninja Van SG homepage
            - Shopify app listing
            - WordPress plugin listing
          emotion: Evaluating ease of setup, COD support, and service breadth
        - label: Onboarding
          stage: Onboarding
          actors:
            - Merchant ops user
            - Warehouse operator
          touchpoints:
            - Ninja Dashboard
            - Shopify and WooCommerce integration
            - API documentation
          emotion: Looking for low-friction order creation and real-time tracking
        - label: Repeat shipping
          stage: Repeat shipping
          actors:
            - Merchant support team
            - End customer
          touchpoints:
            - Last-mile parcel delivery
            - Support group updates
            - Cross-border parcel service
          emotion: Reliability matters once shipments repeat and exceptions appear
        - label: Scale-up
          stage: Scale-up
          actors:
            - Brand expansion lead
            - Fulfilment manager
          touchpoints:
            - Ninja Fulfillment
            - OMS / WMS workflows
            - Nationwide coverage
          emotion: Shipper wants scale without adding warehouse staff or fixed assets
        - label: Enterprise expansion
          stage: Enterprise expansion
          actors:
            - Procurement or supply-chain lead
            - Retail replenishment manager
            - Cold-chain operator
          touchpoints:
            - B2B restock
            - 3PL and freight
            - Cold chain
          emotion: Value shifts from parcel price to service breadth, visibility, and inventory continuity
    claimRefs:
      - CU001
      - CU005
      - CU016
      - CU018
      - CU019
      - CU025
      - CU034
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Public disclosure narrows sharply from broad regional shipper and parcel counts to a small set of named,
      externally visible customer proofs.
    data:
      items:
        - label: Publicly disclosed SEA shipper base
          value: 2000000
          detail: Nearly 2,000,000 shippers across Southeast Asia on the SG homepage
        - label: Publicly disclosed daily parcel flow
          value: 2000000
          detail: About 2 million parcels or packages a day in SCMP and TradingView/GuruFocus
        - label: Malaysia merchant network touchpoints
          value: 5500
          detail: Retail stores cited by The Edge Malaysia
        - label: WooCommerce merchant installs (MY)
          value: 1000
          detail: WordPress.org lists 1,000+ active installations for the Ninja Van MY plugin
        - label: Named customer proofs in this chapter
          value: 5
          detail: MGP Label, Caramel Monster, Mod Parade, Una Brands, and Faber-Castell
    approximationNotes: >-
      The funnel mixes different disclosure layers rather than measuring a literal conversion path. It shows how public
      visibility narrows from broad platform scale to a small set of named customer references.
    claimRefs:
      - CU002
      - CU022
      - CU030
      - CU032
      - CU033
      - CU038
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: standard
    summary: >-
      Named proof is strongest on production maturity for SME merchants and B2B restocking, but retention visibility and
      quantified outcomes remain weak almost everywhere.
    data:
      columns:
        - Evidence quality
        - Outcome specificity
        - Production maturity
        - Retention visibility
      rows:
        - label: MGP Label
          values:
            - Medium — official testimonial on SG homepage
            - Medium — three-working-day cross-border delivery cited
            - High — described as active merchant shipping
            - Low — no renewal or volume data
        - label: Caramel Monster
          values:
            - Medium — official testimonial on SG homepage
            - Low — mostly qualitative support and update benefits
            - High — described as active parcel user
            - Low — no contract length or repeat-order disclosure
        - label: Mod Parade
          values:
            - Medium — official testimonial on SG homepage
            - Low — consistency claim without metrics
            - High — described as active merchant shipping
            - Low — no retention metrics
        - label: Una Brands
          values:
            - High — full case-study article with named executive quote
            - Medium — plug-and-play and nationwide-coverage benefits described
            - Medium — market-entry deployment, not a mature long-cycle account
            - Low — no renewal or post-launch cohort data
        - label: Faber-Castell
          values:
            - Medium — named case-study example in MY launch article
            - Medium — fewer stock-outs and better storage efficiency described
            - High — described as ongoing restocking relationship
            - Low — no contract value or duration data
    approximationNotes: >-
      Quality scores are qualitative judgments derived from whether the source names the customer, quotes the customer,
      quantifies the outcome, and reveals any renewal or duration evidence.
    claimRefs:
      - CU014
      - CU018
      - CU019
      - CU022
      - CU028
      - CU038
      - CU039
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Likelihood-versus-impact matrix for Ninja Van’s main residual risks after considering current public mitigations.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: High Impact
          values:
            - —
            - |-
              PDPA/privacy enforcement event
              Second core-market exit
              Platform-volume concentration shock
            - |-
              Valuation reset / funding dependence
              Competition-driven margin pressure
              Service-quality relapse after delays
        - label: Medium Impact
          values:
            - —
            - |-
              Labour / execution drag after repeated layoffs
              Cross-border/customs interruption
            - |-
              COD/phishing brand abuse
              Lost or damaged parcel claims pressure
        - label: Low Impact
          values:
            - —
            - Restricted-zone / prohibited-item friction
            - —
    approximationNotes: The heatmap is an analytical synthesis of the cited sources rather than a company-published scoring model.
    claimRefs:
      - CR008
      - CR013
      - CR017
      - CR024
      - CR025
      - CR032
      - CR035
      - CR036
      - CR045
      - CR055
