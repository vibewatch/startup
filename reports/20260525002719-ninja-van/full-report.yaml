  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and contract-risk surface
        blocks:
          - type: paragraph
            body: >-
              Ninja Van's hardest legal underwrite is not a headline lawsuit; it is the combination of shipper-contract
              asymmetry, PDPA accountability, and fraud exposure around COD and parcel impersonation. The standard
              delivery terms let Ninja revise pricing, fees, and discounts by notice, suspend services when
              force-majeure or regulatory events interfere, and exclude liability for delays, software unavailability,
              consequential losses, and—absent purchased liability cover and compliance with its standard process—most
              lost or damaged parcel claims. That means merchant recovery risk can shift back to the shipper exactly
              when service failure occurs. The privacy policy separately confirms that Ninja Van may use and share
              personal data with related companies, service providers, and third-party sellers in order to run
              deliveries and improve services, while Singapore's PDPA and PDPC breach guide keep the company inside a
              formal accountability and breach-notification regime. Fraud risk is not hypothetical either: Ninja Van's
              own scam advisory says COD scams cannot be fully eliminated because foreign syndicates can rotate stores
              and shipping consolidators, and the Singapore Police warn that fake parcel-delivery messages are used to
              capture banking credentials. The group does publish a compliance mailbox, whistleblowing pathway, and
              supplier code, which are genuine mitigants, but they are governance plumbing rather than proof of low
              incident rates or audited control maturity.
            claimRefs:
