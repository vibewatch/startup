        - How much cross-border traffic currently uses bonded or pre-cleared flows?
      - - Price wars and consolidation pressure
        - Negative
        - Current
        - Volume may grow while take rates and contribution margins stay under pressure
        - Where is Ninja Van winning on service rather than price alone?
      - - COD and returns friction
        - Negative
        - Current
        - Failed deliveries and reverse logistics raise cost-to-serve and complicate merchant SLAs
        - What are failed-delivery, RTS, and returns rates by market?
      - - Fragmented geography and corridor complexity
        - Negative
        - Structural
        - Archipelagic routes, islands, and uneven infrastructure keep last-mile costs high
        - Which corridors are margin-accretive versus structurally loss-making?
      - - Cold-chain compliance and capex
        - Negative with premium upside
        - Structural
