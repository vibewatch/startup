      - number: '7.3'
        title: Partner, dependency, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Ninja Van's dependency stack is unusually exposed to external bargaining power. At demand level, Southeast
              Asian parcel networks still ride e-commerce-platform order flows; Rest of World reports that even J&T's
              growth has relied primarily on e-commerce platforms, which is a useful sector analogue for Ninja Van's own
              parcel business. At pricing level, peer evidence still looks like a competitive knife fight rather than a
              rational market. J&T's annual report openly discusses growing competition in overseas markets, J&T's
              FY2025 deck describes sharing cost efficiencies with customers to keep parcel volumes growing, and
              third-party comparisons show Ninja Van often priced above peers on cited Malaysia and Philippines examples
              while trailing J&T on provincial on-time delivery in one 2026 Philippines comparison. At network level,
              Vietnam is now a hard warning, not a hypothetical. Ninja Van is exiting that country's express-delivery
              market under a wider restructuring, showing that management will pull out of geographies where the
              economics do not justify continued investment. At capital level, the current internal round is being led
              by existing investors on preferential terms, underscoring that runway is still linked to shareholder
              tolerance rather than to a proven self-funding engine. If marketplaces internalise logistics, if J&T,
              Flash, or platform-owned networks keep subsidising service, or if investors stop financing the pivot,
              Ninja Van's neutral-carrier positioning weakens fast.
