      - number: '6.5'
        title: Expansion path, concentration risk, and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              Ninja Van's customer expansion logic is increasingly clear: move merchants from parcel-only relationships
              into broader fulfilment, warehousing, freight, B2B restocking, and cold-chain services so that the company
              becomes a larger share of the customer's logistics stack. Management explicitly describes the goal as
              becoming a one-stop shop whose customers use the full suite, while Beamstart shows why the strategy
              matters: Shopee and Lazada have been building in-house logistics capabilities that erode third-party
              parcel volumes, and Ninja Van has responded by leaning harder into B2B logistics and cold chain while
              exiting express delivery in Vietnam and trimming staff. That makes concentration risk twofold. First,
              there is platform/channel dependence risk because Lazada sits inside Alibaba's ecosystem and Alibaba
              joined Ninja Van's 2021 Series E, even though the public record does not disclose what share of revenue or
              parcel volume is platform-linked. Second, there is mix risk: public named proofs are skewed to SME and
              mid-market commerce, while the enterprise, pharma, and cold-chain strategy is still more visible in
              product pages and management commentary than in named production references. Expansion direction is
              credible; concentration transparency is not.
