      - number: '2.2'
        title: Multiple sizing lenses and preserved contradictions
        blocks:
          - type: paragraph
            body: >-
              The broadest demand lens is the Southeast Asian digital economy and the e-commerce order flow that creates
              parcel demand. Bain's e-Conomy SEA 2024 work put regional digital-economy GMV at USD 263 billion and
              e-commerce GMV at USD 159 billion in 2024, while the 2025 report says the region should exceed USD 300
              billion in digital-economy GMV and reach USD 185 billion of e-commerce GMV in 2025. Parcel Perform's 2024
              Southeast Asia logistics report provides a different public lens, saying the region's e-commerce market is
              expected to reach USD 211 billion by 2025. Those figures should not be smoothed into one number: they are
              useful as an order-flow range, not a single canonical TAM.

              The operational logistics lens is narrower. Mordor pegs ASEAN CEP at USD 16.68 billion in 2025 and USD
              17.85 billion in 2026, which is a monetized delivery-services pool rather than gross merchandise value.
              J&T's disclosed 2025 Southeast Asia parcel volume and market share imply a roughly 22.3 billion parcel
              regional market, which is the closest public activity proxy for the last-mile arena where Ninja Van
              competes. Adjacent service lenses matter too: Mordor values Southeast Asia cross-border e-commerce at USD
              50.37 billion in 2026 and ASEAN cold chain at USD 19.98 billion in 2026. The right read-through is that
              Ninja Van participates in several linked markets, none of which by itself is a clean top-down revenue TAM
              for the company.
