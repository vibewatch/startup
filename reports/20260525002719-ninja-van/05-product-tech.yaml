- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Ninja Van surface
  - Publicly described benefit
  - Known limitation
  rows:
  - - Send domestic parcels at scale
    - Merchant creates order, prints label, tracks parcel, and handles exceptions
    - Ninja Dashboard + last-mile network
    - Step-by-step docs for labels, tracking, PoD, and reports reduce operational ambiguity
    - No public uptime SLA or error-rate disclosure for the dashboard
  - - Upload many orders instead of keying them one by one
    - Merchant prepares CSV/Excel file and mapping template
    - Bulk order upload in Ninja Dashboard
    - Supports operational batching and faster order intake
    - Need field-level API or validation-error documentation beyond the user guide
  - - Run international shipments from the same control plane
    - Merchant selects B2C/E2E flow, pickup/drop-off, then keys or uploads orders
    - International order creation in Ninja Dashboard + cross-border service
    - Public docs show one workflow rather than a separate portal
    - Country coverage differs by market page and public customs details are limited
  - - Restock stores or corporate locations
    - Business schedules replenishment or cargo-style movement
    - Ninja B2B / Ninja B2BR
    - Service scope extends beyond parcel drop-offs into FTL, LTL, and resupply
    - Need load planning, cut-off, and branch-service metrics
  - - Ship frozen or chilled goods
    - Business books temperature-sensitive movement across logistics network
    - Ninja Cold / cold-chain services
    - Official pages describe tailored cold logistics methods
    - Public material does not disclose excursion rates or audited compliance outcomes
  - - Connect commerce platforms to shipping operations
    - Merchant installs app or partner integration and links Ninja credentials or API keys
    - Shopify app, SHOPLINE integration, plugin API, standard API
    - One-click fulfillment and app-based order creation are publicly described
    - Need public adoption, support burden, and platform-by-platform feature parity data
  notes: The table emphasizes merchant workflow steps that are explicitly documented in guides, app listings, or partner help pages; operational benefits are public-surface claims, not audited outcome statistics.
