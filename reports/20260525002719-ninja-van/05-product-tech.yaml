  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-sla
    missingEvidence: A public status page, uptime commitment, or incident-history surface for Ninja Dashboard and API services.
    whyItMatters: Enterprise buyers and platform integrators need to understand operational reliability before relying on Ninja Van as a workflow backbone.
    diligencePath: Request dashboard/API SLA documents, incident logs, and service-review metrics by market.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Third-party security assurance such as SOC 2, ISO 27001, penetration-test summaries, or a security whitepaper.
    whyItMatters: Privacy text alone does not establish how robust the software-control environment is for merchant and recipient data.
    diligencePath: Request current certifications, external audit letters, security architecture controls, and incident-response commitments.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: cold-chain-validation
    missingEvidence: Independent temperature-excursion data, validated operating ranges, or compliance attestations for Ninja Cold.
    whyItMatters: Cold-chain differentiation is central to product positioning, but public evidence remains mostly company-authored and method-level.
    diligencePath: Ask for temperature-monitoring dashboards, audit reports, excursion-rate logs, and customer references by product category.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: integration-adoption
    missingEvidence: Public or confidential counts for active API customers, Shopify installs, plugin usage, webhook volume, or partner-generated shipment share.
    whyItMatters: Without usage data, investors cannot tell whether the public integration surface is strategically important or just lightly used.
    diligencePath: Request integration adoption by channel, active credential count, app-store install base, and support-ticket volume by integration type.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
