  - - Legal / whistleblowing hub
    - Published
    - Terms, supplier code of conduct, privacy, whistleblowing
    - Centralizes governance artefacts
    - Need market-by-market service and compliance deltas
  - - Packaging rules
    - Published
    - Labeling and safe-packing requirements
    - Reduces damage and misrouting risk
    - Need quantified repack/reject rates
  - - Prohibited-item screening
    - Published
    - Lists items not accepted for shipment
    - Critical for legal and safety compliance
    - Need market-specific restricted-goods detail in a machine-readable format
  - - Claims investigation workflow
    - Published
    - Shippercare email, tracking IDs, photos, billing disputes
    - Shows exception handling path
    - Need turnaround-time and resolution-rate metrics
  - - API audit gate
    - Published
    - Sandbox review before production access
    - Acts as a quality control on integrations
    - Need failure-rate and remediation statistics for audits
  - - Security / reliability assurance
    - Not publicly evidenced in fetched pack
    - SOC, ISO, uptime SLA, incident archive
    - Matters for enterprise trust and developer onboarding
    - Need third-party assurance artefacts or a status surface
