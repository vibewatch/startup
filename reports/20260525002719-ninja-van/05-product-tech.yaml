- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Public role
  - Key dependency
  - Main risk
  - Implication
  rows:
  - - Merchant control plane
    - Ninja Dashboard covers order creation, tracking, reports, settings, and integrations
    - Web app availability and account permissions
    - No public SLA or incident history
    - Software is part of the product, not a back-office afterthought
  - - Order-ingestion layer
    - Keyboard entry plus CSV/Excel bulk upload and international-order flows
    - File-template correctness and form validation
    - Bad data can cascade into label and pickup errors
    - Operational fit improves for higher-volume merchants
  - - Waybill / label layer
    - PDF and thermal-printer labels are generated after order creation
    - Desktop browser, printer setup, and processed order state
    - Conditional waybill access and print setup create deployment friction
    - Shipping ops still rely on correct device and permissions setup
  - - Tracking and proof-of-delivery layer
    - Search filters, order history, photos, recipient signature, and delivery location are exposed
    - Parcel event capture and dashboard retrieval
    - Public evidence shows visibility, not hard reliability guarantees
    - Dispute resolution is more inspectable than on bare tracking pages
  - - API and auth layer
    - OAuth, sandbox/prod environments, create-order endpoint, webhooks, and PUDO API
    - Commercial agreement, client credentials, tech review, and bearer tokens
    - Production access is gated and not fully self-serve
    - Integration is feasible but more managed than plug-and-play SaaS
  - - Physical execution layer
    - Fulfilment, last-mile, B2BR, cold chain, freight, and cross-border execution
    - Warehouses, linehaul, pickup/drop-off points, and operating partners
    - Service quality depends on both software and field execution
    - The moat is operational and networked, not purely digital
  - - Support and exception layer
    - Claims, billing, COD, pickup, delivery-issue, and tracking support flows are documented
    - Shipper support teams and evidence submission
    - Manual investigation steps can lengthen exception handling
    - Support is structurally part of the operating model
  notes: Architecture is inferred from public product, dashboard, API, and support materials rather than from a formal system-design whitepaper or infrastructure disclosure.
