  rows:
  - - Last-mile parcel delivery
    - Individuals, SMBs, enterprises
    - Live and heavily documented in Singapore and Indonesia
    - Combines doorstep delivery, redelivery policy, and merchant-facing tracking
    - Need independently reported on-time-delivery and first-attempt success rates
  - - Fulfilment & warehousing / 3PL
    - Brands and e-commerce merchants
    - Live official service pages
    - Covers storage, picking, packing, and handover rather than just courier pickup
    - Need warehouse footprint, WMS detail, and SLA terms by market
  - - B2B restock / Ninja B2B / Ninja B2BR
    - Corporate, retail, and replenishment users
    - Live official service pages in SG and Indonesia
    - Extends beyond parcels into restock, cargo, FTL, and LTL workflows
    - Need mix by use case, fleet economics, and retail-service coverage maps
  - - Cold chain / Ninja Cold
    - Temperature-sensitive shippers
    - Live official service pages
    - Publicly describes passive cooling and Eco-Freeze methods for frozen/chilled delivery
    - Need audited temperature-control metrics and compliance evidence
  - - Cross-border logistics
    - Cross-border e-commerce merchants
    - Live official service pages
    - Public pages market wide country reach and regional expansion support
    - Need canonical country matrix, customs-performance KPIs, and partner dependencies
  - - Merchant dashboard + API + partner app layer
    - Shippers, marketplaces, partner platforms
    - Operationally documented
    - Bulk upload, labels, tracking, PoD, reports, Shopify install, OAuth API, and PUDO are all publicly documented
    - Need public rate limits, uptime commitments, and active-integration counts
