- id: merchant-dashboard-and-integrations
  title: Merchant dashboard, self-service tooling, and integrations
  body: The most concrete product-maturity evidence is not on the marketing pages but in the dashboard and integration guides. Ninja Van publishes step-by-step instructions for bulk order upload, international order creation, label printing, parcel tracking, proof of delivery, scheduled reports, and Shopify app installation. That is meaningful because it moves the public story from vague logistics marketing into observable merchant workflows. A seller can infer that Ninja Dashboard acts as the control plane for order entry, label generation, tracking, reporting, and partner-app connectivity. The public API materials reinforce that point. Ninja Van documents a RESTful Order API, PUDO API, webhooks, OAuth tokens, sandbox and production environments, and an audit path before production access is granted. The result is a fairly mature integration surface, but it is not self-serve in the style of a pure SaaS developer platform. Production API access depends on commercial agreement, sandbox testing,
    and technical review, while plugin integrations are segmented between faster credential-based connections and slower standard API activation.
