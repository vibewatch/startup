- id: service-quality-fraud-and-operational-risk
  title: Service quality, fraud, and operational risk
  body: 'Ninja Van''s public operating promise is straightforward: standard Singapore delivery in one to three working days, next-day only for larger Dash shippers, three delivery attempts before return-to-sender, and formal workflows for lost or damaged parcels. The adverse evidence shows that this promise can bend under volume stress. Mothership reported a May 2026 burst of complaints about unfulfilled delivery orders, repeated delays, and missed pickups, with Ninja Van attributing the problem to an unexpected surge in parcel volume and internal issues. Earlier CNA reporting during the circuit-breaker period documented delays stretching to three weeks and parcels lost in transit as order volumes surged. Support pages show that shippers and recipients have only seven days to report missing or damaged parcels, after which Ninja Van targets a three-to-five business day investigation. Those workflows are useful procedurally, but they also signal that operational exceptions are expected and
    can take several days to unwind. A low-confidence but directionally adverse anecdote from The Independent, where a customer alleged that an electronics parcel was thrown over a gate, reinforces a last-mile handling risk: even if liability is contractually limited, mishandled or delayed deliveries still damage merchant trust and brand reputation. Restricted zones, selected-destination international coverage, and prohibited-item exclusions further show that the network is more bounded than a blanket promise of universal next-day convenience.'
