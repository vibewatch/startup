- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Service quality relapse
    - Another broad public apology, surge in backlog complaints, or repeated missed-pickup wave in Singapore
    - Two public delay incidents within 12 months or any repeat of multi-week delays in a non-peak period
    - Thesis break on operational recovery; underwrite only with verified internal SLA improvements
  - - Funding and valuation stress
    - Next financing round terms and runway disclosures
    - Any new round below roughly US$1 billion or with even stronger exit preferences than the current insider round
    - Treat as evidence that the business still needs balance-sheet support rather than being near self-funding
  - - Regulatory / privacy escalation
    - Formal PDPC, data-breach, or scam-enforcement event
    - Any formal privacy investigation, notifiable breach disclosure, or consumer-fraud enforcement linked to Ninja Van channels
    - Pause investment case until root-cause and remediation evidence is reviewed
  - - Pivot execution failure
    - Further layoffs or another core-market withdrawal
    - A fourth broad-based Singapore layoff round or another express-delivery market exit in a core SEA geography
    - Indicates B2B restocking and cold chain are not offsetting legacy parcel pressure
  - - Competitive margin squeeze
    - Relative pricing and reliability versus J&T / Flash / platform-owned logistics
    - Ninja Van still prices at a premium on cited lanes while trailing peers on delivery reliability or losing visible demand partners
    - Assume weaker pricing power and haircut any turnaround multiple
  - - Fraud / brand-abuse amplification
    - COD scam or phishing complaints tied to Ninja Van brand
    - Sustained scam wave requiring frequent goodwill refunds or public advisories
    - Treat fraud as a recurring cost center and trust drag, not a one-off reputational nuisance
  notes: Thresholds are underwriting heuristics built from the cited evidence pack; they are designed to be monitorable in future diligence or refresh runs, not to imitate company KPIs the public pack does not disclose.
