  rows:
  - - 'Standard delivery terms: price-change rights, liability exclusions, and claims waiver mechanics'
    - Singapore contracts
    - Active; Ninja can revise pricing/fees by notice and disclaims many delay and consequential-loss claims
    - High
    - Critical
    - Optional high parcel liability cover, published claims workflow, compliance channel
    - High because merchant remedies remain contractually narrow unless large shippers negotiate bespoke terms
    - Review master service agreements, claims-payout history, and percentage of volume covered by negotiated liability terms
  - - PDPA data-handling and notifiable-breach obligations
    - Singapore
    - Active; Ninja discloses broad data sharing with related companies, service providers, and third-party sellers
    - Medium-High
    - High
    - Privacy policy, stated security standards, PDPA governance, compliance mailbox
    - High because no public incident log, external audit, or DPO-level operating metrics were found
    - Request incident register, DPO ownership, audit reports, retention map, and breach-notification playbooks
  - - COD scams, fake-delivery notifications, and consumer-fraud exposure
    - Singapore / cross-border scam flows
    - Active; Ninja says scams cannot be fully eliminated and police warn parcel scams capture banking credentials
    - High
    - High
    - PayNow entity verification, shipper screening, blacklisting, SPF cooperation, goodwill refunds
    - Medium-High because foreign syndicates can rotate stores and consolidators faster than static controls
    - Request scam-incident volumes, refund policy, chargeback loss rates, and shipper-onboarding fraud controls
  - - Responsible retrenchment and labour-relations execution after repeated layoffs
    - Singapore
    - Active; third layoff round since 2024 with MOM tripartite expectations still relevant
    - Medium
    - Medium-High
    - Severance, health coverage, mental-health support, career transition support
    - Medium because morale, attrition, and execution drag can persist after compliant retrenchment mechanics
    - Request attrition by function, regretted-loss rates, and post-restructure service-level changes
  - - Restricted zones, prohibited items, and regulatory/inspection interruptions
    - Singapore / cross-border lanes
    - Active; some SG areas are non-serviceable, selected destinations only for international shipping, and prohibited items are excluded
    - Medium
    - Medium
    - Published zone list, prohibited-items guidance, customs-support claim, inspection rights in terms
    - Medium because excluded zones and inspection-driven disruptions can still impair merchant SLA performance
    - Request volume share from excluded zones, customs-exception rates, and suspended-shipment statistics
  notes: Rows are severity-ranked using public evidence only. Exposure mixes legal liability, service interruption, and merchant-trust damage rather than statute size alone.
