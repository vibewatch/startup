    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品流程与解决方案界面
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的公开产品界面，比包裹追踪小组件或通用快递面单更宽。官方 Singapore 和 Indonesia 解决方案页面展示了一套流程栈：从仓储和履约运营起步，进入国内末端配送，再延伸到 B2B
              补货、冷链运输和跨境运输。这很重要，因为公司的核心产品看起来更像区域物流执行操作系统，而不是单一消费者应用。这里最强的已验证证据，就是解决方案菜单本身：仓储页面描述入库、拣货、打包和交接；B2B
              页面描述补货和货运式流程；跨境页面描述国际扩张；冷链页面描述温敏配送方法。故事较弱的部分是性能证明。配送速度、地理覆盖和温度完整性大多来自公司控制页面，因此这些主张应被视为产品界面披露，而不是独立验证的服务指标。实际结论是，Ninja
              Van 拥有真实的多模块物流流程，但各模块的公开成熟度证据并不均衡。
