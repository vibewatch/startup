  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除支出
        blocks:
          - type: paragraph
            body: >-
              分析 Ninja Van 时，应看它实际销售的东南亚物流流程，而不是整个区域物流、货运或 3PL 宇宙。新加坡和马来西亚解决方案页面一致描述了一套栈：从末端包裹配送开始，延伸到履约、仓储、B2B
              门店补货、国际配送、货运代理支持和冷链处理。这些产品都贴近电商商家、零售商、分销商和部分企业托运方的订单流。因此，本章纳入的支出包括包裹揽收、分拣、干线运输、末端配送、跨境包裹交接、相关产品的温控处理，以及直接服务门店货架或线上订单的
              B2B 补货或仓储。

              这条边界明确排除广义海运、重型工业卡车运输、没有包裹关联的通用合同物流、平台抽成以及商品价值本身。它也排除从不触及包裹、门店补货或快速区域履约流程的冷链和企业物流支出。实际替代方案包括国家邮政、零售商自有车队、平台内建网络、非正式快递员，以及依赖自提或路线配送的批发商。这样界定市场很重要，因为
              Ninja Van 的战略问题在于网络密度和相邻服务挂载，而不是东南亚是否有一个非常庞大的抽象物流行业。
