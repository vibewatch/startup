        - 报道内部融资 US$80M
        - 报道估值约 US$1B，附带优惠条款
        - 对新投资人最有用的当前价格锚
        - 条款似乎经过结构化设计，名义价格可能高估普通股干净价值。
    notes: 公开行以文件披露或公开市场为锚；私募行仅作参考标记，不证明今天能以同样干净价格投资。
