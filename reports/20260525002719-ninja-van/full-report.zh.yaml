        - 正向，但有成本取舍
        - 当前至中期
        - 更广的地理需求能扩大触达，但也会稀释核心都市圈以外的密度
        - 首都圈走廊以外的单位经济会怎样？
      - - 保税仓与清关简化
        - 正向
        - 中期
        - 跨境交接更快，能改善转化率、复购率和区域卖家采纳
        - 当前有多少跨境流量使用保税或预清关流程？
      - - 价格战与整合压力
        - 负向
        - 当前
        - 货量可能增长，但抽成率和贡献利润率仍承压
        - Ninja Van 在哪些地方靠服务而不只是价格取胜？
      - - COD 与退货摩擦
        - 负向
        - 当前
        - 配送失败和逆向物流推高服务成本，也让商户 SLA 更复杂
        - 各市场的配送失败、RTS 和退货率是多少？
      - - 地理割裂与线路复杂度
        - 负向
        - 结构性
        - 群岛线路、岛屿和基础设施不均衡，让最后一公里成本居高不下
        - 哪些线路增厚利润，哪些结构性亏损？
      - - 冷链合规与资本开支
        - 负向，但有溢价空间
        - 结构性
        - 监控、隔离和备用基础设施抬高上客成本，但能支撑溢价定价
        - 冷链收入中有多少是经常性、由合规驱动？
      - - 国内业务占主导，国际业务增长更快
        - 混合
        - 当前至中期
        - 国内包裹支撑利用率，但跨境业务可选性更高、摩擦也更多
        - 国内与国际线路分别贡献多少收入和毛利？
    notes: 该表把每个市场驱动或约束对应到采纳影响和尽调问题。重点不是说市场大，而是说明区域包裹网络的变现和估值质量到底受什么约束。
