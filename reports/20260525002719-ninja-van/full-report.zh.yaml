        - 包裹压力延续，但多元化阻止更深侵蚀；公开可比公司仍是估值锚。
        - 按销售额约 0.8x-1.3x，对应 US$560M-US$910M EV；对新资金而言，当前约 US$1B 名义估值偏满。
        - 即使业务企稳，优先权包袱和债务也会压低普通股上行空间。
        - 最符合当前证据。
      - - 熊市
        - 收入进一步下滑、B2B 采用疲弱、契约压力，或再次出现结构化融资。
        - 按销售额约 0.5x-0.9x，对应 US$350M-US$630M EV；若结构收紧，普通股下行很重。
        - 估值下调风险、更多退出疲弱地区，或出现集中度 / 流失证据。
        - 如果价格战和重组延续，熊市情景权重不低。
    notes: 情景区间是基于证据的讨论区间，不是管理层指引或点估计。
