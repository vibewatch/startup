      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开资料包里最清晰的领导层事实仍围绕三位创始人，而不是一支完整高管团队。Ninja Van 当前结构化数据将 Lai Chang Wen 列为联合创始人兼 CEO，Shaun Chong 列为联合创始人兼
              CTO，Tan Boxian 列为联合创始人兼 COO。CNBC 在 2020 年仍称 Lai 为联合创始人兼 CEO，2021
              年融资报道也继续引用他作为主要发言人。这种连续性支持后文的一个实际判断：创始人在公司身份、融资沟通和战略叙事中仍居核心位置。


              治理披露远薄于融资披露。已审阅的官方页面和交易材料没有展示董事会构成、独立董事姓名或明确控制权细节，尽管投资者报道清楚表明 Alibaba、GeoPost、B Capital、Monk's Hill 和
              Zamrud 是重要资本提供方。由于公开领导层证据集中在创始人身上，董事会可见度又有限，关键人物依赖仍然重要；治理尽调应重点看接班计划、董事会权利，以及投资者对战略决策的影响。
