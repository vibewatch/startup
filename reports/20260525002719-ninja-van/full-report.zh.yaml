        - J&T 规模大于 Ninja Van，地域也更多元
      - - J&T FY2024 损益表
        - 毛利率代理
        - US$10.259 billion 收入和 US$1.078 billion 毛利润隐含约 10.5% 毛利率
        - 表明成熟包裹经济性即便规模很大，运营层面仍可能很薄
        - 集团结构不同于 Ninja Van 的服务和市场结构
      - - J&T 东南亚单位经济性评论
        - 利润率驱动因素
        - 灵活定价、自有车队、干线优化、薪资合理化和自动化分拣
        - 这些运营杠杆最可能同样影响 Ninja Van 的网络经济性
        - 评论是定性的，不是对 Ninja Van 的直接度量
      - - Sea 2025 20-F
        - 电商变现结构
        - 广告、交易费和物流 / 履约增值服务
        - 可作为代理，说明物流如何补充平台变现，而不是独立存在
        - Sea 是平台运营商，不是纯配送网络
      - - Sea 2025 20-F
        - 物流成本随规模变化
        - Shopee 收入成本 +32.6% 至 US$9.5 billion，订单 +27.2% 至 13.9 billion；销售和营销 +29.4% 至 US$4.5 billion
        - 显示规模成形后，物流和获客成本仍会继续上升
        - Sea 的一体化平台经济性不能直接对比纯快递收入
      - - Pos Malaysia 2025 年报
        - 竞争压力和利润率防守
        - 激进定价、遮蔽（masking）、平台自建物流、网络优化、自动化和 AI，以降低单包裹成本
        - 对一家面临价格战和监管义务的东南亚包裹运营商，这是最接近的公开参照
        - Pos Malaysia 承担邮政 USO 复杂性，Ninja Van 没有
    notes: 这张表刻意采用代理口径。它使用上市物流和电商运营商的监管级披露，框定 Ninja Van 可能面对的成本和利润率动态， 但不声称一一等同。
