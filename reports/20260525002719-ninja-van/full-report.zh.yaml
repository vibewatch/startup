      - number: '6.3'
        title: 采用轨迹、复用和部署深度
        blocks:
          - type: paragraph
            body: >-
              采用故事最有力的读法，不是单一客户数 KPI，而是平台广度、国家级运营密度和商户软件使用叠加。Ninja Van 称东南亚已有近 2,000,000 个托运人使用服务；SCMP 和
              TradingView/GuruFocus 都提到每天约 2 million 个包裹、 6 个运营市场。马来西亚给出最好的国家级复用代理指标：The Edge 报道 5,500 家零售门店、200 个枢纽，
              包裹量从 2017 年 1 million 件升至 2019 年 10 million 件，并在 2023 年 9 月达到累计 300 million 件。 商户工具又加了一层采用证据：面向 MY/PH 商户的
              Shopify 支持，以及 WordPress 上 Ninja Van (MY) 插件 1,000+ 活跃安装量的列表，说明数字商户有反复使用；即便这些安装不等同于活跃付费账户。菲律宾
              履约产品也显示运营成熟度：下午 4 pm 前收到的订单当天交接，集成账户同时生成追踪号。缺口是按国家、服务线 或 cohort 划分的干净当前分母。公开规模真实存在，但低 ACV
              卖家和更高价值企业合同之间的构成仍不透明。
