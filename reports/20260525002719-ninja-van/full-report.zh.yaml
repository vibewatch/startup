          to: b2b-restock
          label: 补货需求
        - from: merchant-demand
          to: cold-chain
          label: 温控需求
        - from: parcel-network
          to: billing
          label: 按票收费
        - from: value-added
          to: billing
          label: 合同费用
        - from: b2b-restock
          to: billing
          label: 路线与停靠点经济性
        - from: cold-chain
