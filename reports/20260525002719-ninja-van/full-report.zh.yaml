chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 把自己定位为面向电商商家的新加坡本土物流公司，当前官方材料仍把这一身份锚定在 2014 年的创立故事上。新加坡关于页面称，公司由 Lai Chang Wen、Boxian Tan 和
              Shaun Chong 创立，起因是团队在自己的时尚创业项目中想解决配送痛点；同一页面现在列出的新加坡地址是 30 Jalan Kilang
              Barat。这段起源仍然重要，因为公司看起来仍由创始人主导：当前页面元数据列出 Lai 为 CEO、Shaun 为 CTO、Tan 为 COO。


              运营模式也早已超出包裹揽收和投递。官方服务页面称，Ninja Van 销售仓储、运输、货运代理、分销、末端配送、跨境运输、B2B
              补货和冷链配送。跨境页面强调追踪、货到付款支持和区域网络，企业页面则把公司写成供应链基础设施，而不是纯快递商。因此，Ninja Van
              当前的商业模式更适合定义为服务商家、零售商和其他商业托运方的技术驱动型区域物流平台，消费者包裹配送只是这套栈中的一层。
