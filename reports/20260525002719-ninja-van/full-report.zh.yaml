      - number: '7.4'
        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              人员和模型风险不只是 Ninja Van 裁员；更关键的是，公司一边反复裁员，一边要求市场相信其战略转型。2025 年 8 月是自 2024 年以来第三轮新加坡裁员，本地员工约 12%
              受影响；此前已削减区域技术团队和总部人员。管理层称， 资源正重新分配到技术驱动的 B2B 补货和冷链；受影响员工据称获得了遣散费、临时医疗保障、心理健康支持和
              更长的期权行权窗口。这降低了即时员工关系风险，但不能证明公司保住了合适的运营人员、支持人才或合规领导层， 能在摆脱商品化电商包裹量的同时稳住网络。财务上，估值重置到约 US$1 billion、US$80
              million 内部轮，以及 等盈利改善后再 IPO 的决定，都指向一家仍依赖投资者耐心的公司。COD 条款又增加一层模型摩擦：回款按月，费用为 3% 或最低 S$1，另加平台费；Dash
              条款也显示小托运人附加费和可选责任保障费。对于粘性企业托运客户，这些经济性 或许可以接受；但这不是一家已经逃离利润率压力的企业画像。
