      - number: '3.4'
        title: 切换成本中等；真正优势来自密度、信任和跨境执行
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持末端物流存在强软件式锁定效应。商家可以通过聚合器分发包裹，保留多个快递账户，并按地理位置、服务等级或促销期切换货量。EasyParcel 和 Cloud Ecommerce
              的对比逻辑都间接强化了这种行为：它们假定卖家会主动在快递商之间选择，而不是永久绑定某一个网络。因此，切换成本是运营性的，不是生死攸关的。集成、COD 设置、追踪
              API、仓库交接规则和退件处理会产生摩擦，但很少能阻止多归属。


              合同锁定有限时，密度和流程信任承担更多防御功能。J&T 公开的 34.4% 东南亚份额、SingPost 覆盖 220 个目的地、Viettel Post
              全国网络，都说明规模可以转化为更强成本吸收能力或更可靠服务。Ninja Van 自己披露的抓手——Shopify 集成、投递点、海关支持和明确 RTS
              流程——也符合这一模式。问题不是商家能不能切换，而是替代方案能否在不逐条线路重建运营肌肉的情况下，匹配服务稳定性。


              信任和监管姿态也比价格表更能区分承运商。Grab 宣传保险、安全框架和签收证明流程。SingPost 仍是受监管的邮政在位者。FedEx 的合作显示 Viettel Post
              能在全球网络内满足海关和服务标准要求。Lalamove 围绕可持续发展和平台劳工政策的公开沟通，也从另一个角度说明同一现实：在商品化市场里，对合规和执行的信心仍会影响敏感品类和企业账户归属。
