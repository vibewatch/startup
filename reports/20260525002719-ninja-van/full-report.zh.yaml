      - number: '3.3'
        title: 平台自有物流和同日达是结构上更难的威胁
        blocks:
          - type: paragraph
            body: >-
              公开证据包指向 SPX 和 Lazada/LEX：即便它们的独立包裹指标不如 J&T 透明，结构上仍是 Ninja Van 最危险的竞争对手。Sea 的 2025 年业绩显示，Shopee 服务约 400
              million 活跃买家和 20 million 卖家；第三方报道称，SPX 现在承运 Shopee 数十亿包裹中的大多数。Sea
              自己的物流服务披露也很说明问题：与物流相关的增值服务收入下降，原因是运费补贴抵扣更高。这正是 Ninja Van
              必须担心的模式。一个同时控制流量和补贴的平台，可以在物流变现和生态增长之间权衡；中立快递商没有这种选择。


              Alibaba 年报称 Lazada 经营东南亚领先电商物流网络之一，Cainiao 官方材料强调
              AI、自动化和端到端网络控制。这指向同一套战略结构：物流首先不是独立业务，而是商业控制栈的一部分。公开披露没有给出干净的 Lazada
              包裹量或利润率数据，但缺失细节并不会降低竞争风险。相反，它意味着外部承运商必须应对一个强大的黑箱。


              GrabExpress 和 Lalamove 因另一个原因重要。它们并非为全国延时包裹密度优化，但在紧急城市发货上极具可信度。Grab 明确销售即时和同日达配送，配套保险、固定运费和照片签收证明；Lalamove
              则发布详细的平台费、等待费和停靠附加费表。对那些采购标准是速度和调度灵活性，而非全国包裹经济性的商家来说，这些平台是可行替代方案，会限制任何包裹承运商在高密度城市线路中的收费上限。
