      - number: '7.2'
        title: 服务质量、欺诈与运营风险
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的公开运营承诺很直接：新加坡标准配送 1 至 3 个工作日；次日达仅面向更大的 Dash 托运人；退回 发件人前配送 3
              次；遗失或损坏包裹有正式流程。负面证据显示，量压上来时，这个承诺会变形。Mothership 报道 2026 年 5 月曾集中出现未完成配送订单、反复延误和漏揽投诉，Ninja Van
              将问题归因于包裹量意外激增和内部 问题。更早的 CNA 报道记录了 circuit-breaker 期间订单量激增后，延误拉长到 3 周、包裹在运输中遗失。支持 页面显示，托运人和收件人只有 7
              天可报告包裹遗失或损坏，之后 Ninja Van 目标用 3 至 5 个工作日完成调查。 这些流程在程序上有用，但也说明运营异常是预期内事件，且可能需要数天才能收尾。The Independent 一条低置信度
              但方向负面的轶事称，有客户指控一件电子产品包裹被扔过大门；这强化了末端处理风险：即便责任被合同限制，处理 不当或延误配送仍会伤害商户信任和品牌声誉。限制区域、选定目的地的国际覆盖和禁运品排除也说明，网络边界比
              “普遍次日便利”的笼统承诺更窄。
