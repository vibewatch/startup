  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、平台自有物流栈与替代方案
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的竞争并不落在一个干净的单一同行集合里。最接近的中立第三方包裹同行是 J&T Express、Flash Express、BEST
              Express，以及仍能规模化服务电商商家的大型国家级在位者，例如 Vietnam 的 Viettel Post 和 Singapore 的 SingPost。J&T
              是最清楚的直接规模标杆，因为它公开披露东南亚包裹量、市场份额和利润。Flash 是面向商家的低成本挑战者，主打免费揽收和 COD 工具。BEST 今天规模更小、透明度更低，但 Thailand
              业务仍显示跨境野心。Viettel Post 和 SingPost 重要，是因为本土市场商家始终可以选择在位国内网络，而不是切换到区域专门玩家。


              更难的威胁不是中立快递商，而是平台自有物流栈。Sea 对 SPX 的披露和第三方报道显示，Shopee 不只是需求来源；它也是有内部物流能力、运费补贴和服务水平影响力的快递选择者。Alibaba 年报从
              Lazada 侧面给出同样结论：Lazada 已经营东南亚领先电商物流网络之一，Cainiao 则提供技术和跨境骨干。这些运营方一开始就有自有订单流，因此不必在开放市场上逐票用价格取胜。


              最后，Ninja Van 还要面对同城即时替代方案和商家自编排。GrabExpress 和 Lalamove 不是每条延时包裹线路的直接替代品，但在紧急城市配送场景里很可信。EasyParcel
              等聚合器，加上品牌直签物流合同，让多归属变得常见，也削弱单一快递商的锁定效应。实践中，市场定义不在于功能是否完全相同，而在于谁控制需求、密度和商家流程。
