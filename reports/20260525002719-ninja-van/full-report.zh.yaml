  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价界面与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的官方界面显示，它已不是简单的电商平台包裹快递商，而是更宽的物流业务。新加坡首页营销合同物流、清关、仓储、履约、零售补货、末端包裹配送、面向 44 个国家的国际包裹配送、货运代理、冷链配送和
              B2B 配送。Malaysia 还增加 Ninja B2B Restock、Ninja Fulfilment 和 Ninja Cold 等品牌产品。Philippines
              首页给出已审阅资料包里最清晰的公开规模标记：服务 120 million-plus 名东南亚用户、每天配送 2 million 个包裹、在东南亚实现 100% 覆盖。这确立了真实运营足迹和吞吐量。

              变现细节仍不均衡。公开标价主要出现在 Malaysia 的 Ninja Packs 包装层，预付塑料快递袋和套装有公布的 RM 价格。面向消费者的 C2C
              门户按线路公布工作日时效，但已审阅的公开摘录没有展示面向商家或企业账户的简单核心网络价目表。因此，公开记录能强力说明 Ninja Van
              能卖什么、能送到哪里，却弱在实际单票收入、折扣和服务线结构。即便包裹量现在已有头部披露，确切商家数量、仓库数量和分国家收入贡献仍未披露。
