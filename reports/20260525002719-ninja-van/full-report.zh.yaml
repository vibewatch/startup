        - 正向
        - 当前至中期
        - 订单流基数扩大，会提高包裹密度和商户履约需求
        - 哪些国家和品类驱动 Ninja Van 的包裹增长组合？
      - - 视频电商和社交电商小批量发货
        - 正向
        - 当前
        - 订单更小但更频繁，推高揽收频次和送货上门强度
        - Ninja Van 有多少货量来自社交电商渠道？
