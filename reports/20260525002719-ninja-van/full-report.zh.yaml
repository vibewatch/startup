      - number: '8.4'
        title: 建议、打破投资逻辑的触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              在当前名义估值下，坦率建议是继续研究。这不是“永远回避”的判断；而是说公开记录尚不足以支持按 ~US$1 billion
              付价，并把它当作由耐久增长和利润率证明支撑、干净且同顺位的普通股。上行案例存在：规模真实，战略支持方仍相关， 自动化资本开支可见，B2B /
              冷链扩张可能随时间提高质量。但负面记录太强，不能忽视。收入据报收缩，包裹市场仍有 结构性竞争，业务退出越南快递配送，当前融资据报还含有优先退出权。这意味着尽调要少谈泛泛的公司质量，多盯精确
              分配瀑布：债务条款、优先权、客户集中度、毛利率，以及 B2B 经济性是否大到足以让模型重估。更低的干净进入价格 或好得多的证据包，可能把建议上调。另一轮结构化融资、进一步收入滑坡或约束条款压力，会很快把建议下调。
