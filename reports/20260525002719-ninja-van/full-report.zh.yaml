      - number: '4.2'
        title: GTM 动作与新的变现押注
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的 GTM 动作越来越被写成商家、分支机构和机构的嵌入式物流运营层，而不只是包裹承运商。Philippines 材料推介 Ninja
              Restock，强调更小装载要求、拼车发货、多点配送、固定透明定价、全国覆盖和易集成。Ninja Dash 被定位为面向经常性 B2B 合作伙伴配送和大件货的产品，配套全国覆盖和包裹责任保障。公司自己的 2025
              年扩张指南把规模定义为收入增长快于运营成本，这与流程效率逻辑一致，而不是不惜代价追量。

              Business Times 把战略转向说得更直接。Ninja Van 推出 Ninja Cold 和 Ninja B2B，是为了摆脱对电商的单一依赖，追逐更高利润率业务并寻找盈利。冷链从 Singapore 和
              Malaysia 启动，约有 20 家试点客户，Indonesia、Philippines 和 Vietnam 随后跟进。管理层目标值得注意：Ninja Cold 最终贡献 10% 收入，却贡献 50%
              总利润。这在方向上有吸引力，但应读作管理层目标语言，而不是今天已经证明的收入结构。公开证据显示的是战略逻辑和早期铺开，不是已跑通的盈利桥。
