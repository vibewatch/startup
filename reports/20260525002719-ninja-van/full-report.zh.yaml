      - number: '8.2'
        title: 融资背景、价格纪律与优先权悬顶
        blocks:
          - type: paragraph
            body: >-
              融资记录是价格纪律重要的主要原因。Ninja Van 2021 年 Series E 是一次真正的规模融资事件：US$578 million、 覆盖广泛的战略投资者财团，以及在区域电商繁荣期据报超过 US$1
              billion 的估值。但公司没有把这个高点转化成 2025 年公开证据上明显更优的案例。到 2024 年，公司新增一笔三年期 US$50 million HSBC 循环信贷额度；作为流动性
              管理这是合理的，但仍把优先资本放在普通股之前。到 2025 年，报道指向一轮内部人牵头的 US$80 million 融资，名义估值大约仍是 US$1
              billion，但这次带有优惠或优先条款。这个组合比名义数字本身更重要。名义估值四年持平 并不中性，因为后一轮看起来结构化程度更高，而公司刚经历收入压力。可能结果是，新投资者拿到的有效干净普通股
              价格，比新闻标题暗示的更差；债务、优先权和内部人保护会先于普通股上行吸收价值。
