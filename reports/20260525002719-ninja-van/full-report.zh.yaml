        - EV / 收入约 1.85x；P/S 约 2.21x
        - 更强平台经济性的有用上限基准
        - 游戏、市场和金融科技组合让它比快递网络更干净、更高质量。
      - - Singapore Post
        - 上市低增长物流同业
        - 市值 US$0.59B；TTM 收入约 US$0.99B
        - 市值 / 收入约 0.6x
        - 为成熟物流股低端估值提供边界
        - 传统邮件组合和新加坡聚焦使其增长慢于 Ninja Van。
      - - Ninja Van 2021 Series E 轮
        - 私募参考（周期高点）
        - 融资 US$578M；战略投资人财团范围较广
        - 报道估值高于 US$1B
        - 显示电商繁荣期市场曾愿意支付的价格
        - 发生在疫情后正常化之前，也早于当前融资结构。
      - - Ninja Van 2025 内部轮
