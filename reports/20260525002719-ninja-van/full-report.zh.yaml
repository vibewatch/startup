        - 揽收、分拣、干线运输、上门派送、投递失败处理，以及与退货关联的包裹工作流
        - 海运、纯货代、重型工业卡车运输
        - SME、商户、平台、企业；运费可由商户、平台或收件人支付
        - 当前核心市场和品牌入口点
      - - 与订单流绑定的履约和仓储
        - 仓储、拣货、包装，以及把订单处理接入东南亚包裹派送
        - 与包裹或补货工作流无关的独立合同仓储
        - 企业品牌、全渠道零售商、平台卖家
        - 纳入相邻业务，因为它提高包裹密度和账户粘性
      - - B2B 补货和门店补货
        - 循环取送、LTL 门店补货、仓到店配送，以及 MY-SG 跨境卡车运输
        - 没有包裹重叠的重型整车工业货运或全国一级配送网络
        - 零售连锁、分销商、餐饮集团、品牌方
        - 重要买方细分，预算负责人和工作流都不同于包裹商户
      - - 国际 / 跨境配送
        - 有清关支持的包裹运输、保税库存交接，以及跨境卖家履约流
        - 平台抽佣率、跨境广告支出或商品价值本身
        - 跨境卖家、进口商、SME、全渠道品牌
        - 关键相邻业务，因为它共享履约、海关和末端经济性
      - - 冷链物流
        - 面向食品、药品和其他温敏品类的冷藏、冷冻仓储和运输
        - 无温控要求商品的常温物流；与零售或包裹化配送无关的广义工业冷链
        - 生鲜杂货商、F&B 分销商、医疗托运人、化妆品品牌
        - 高价值相邻业务，合规和 capex 要求不同
      - - 更广义物流与 3PL 范畴
        - 仅纳入直接接入包裹、仓储、B2B 补货或跨境订单流的部分
        - 所有东南亚物流支出、海运、全范围工业 3PL，以及商品 GMV 本身
        - 企业采购团队
        - 仅作语境；不是本章核心 TAM 边界
    notes: 本章用工作流相邻性和网络共享来定义 Ninja Van 的市场，而不是把东南亚可能存在的每个物流类别都纳入。纳入支出 必须触及包裹、补货、跨境履约或使用类似基础设施的冷链配送。
