      - number: '8.3'
        title: 可比框架与乐观 / 基准 / 悲观估值区间
        blocks:
          - type: paragraph
            body: >-
              可比组支持谨慎，而不是直接否定。公开区域物流公司倍数不高：Singapore Post 的股权价值约为收入的 0.6x，J&T 在 当前市场数据视角下低于 1x 销售额，Pos Malaysia
              的股价表现也强化了一个事实：上市物流股没有被当作高倍数成长品类 奖励。Sea 是清晰的上限基准，但 Sea 能享有这个特权，是因为它规模大得多，且软件、平台和金融科技权重 明显高于快递网络。这让 Ninja
              Van 处在狭窄中间道。如果业务本质上仍是一个受价格挤压、披露不完整的包裹网络， 公允价值更接近 J&T/SingPost 区间下沿。如果自动化、B2B 补货、冷链和上游供应链服务真的改变利润率画像，更高倍数
              有可能出现——但那仍是有条件的未来状态，不是已证明的当下。以据报 FY2025 收入为锚，今天最可辩护的区间集中在 US$1 billion 名义标记以下，除非假设执行异常顺利或投资者保护异常有利。
