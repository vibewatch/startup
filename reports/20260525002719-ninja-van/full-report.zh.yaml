  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 公开数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 包裹吞吐量
        - PH 主页披露 2,000,000 parcels/day
        - 中
        - 货量密度是路线利用率和成本吸收的核心规模输入
        - 按国家拆分每日包裹量，覆盖国内、跨境、B2B、冷链和履约关联流量
      - - 商户 / 客户数量
        - null
        - 低
        - 需要商户密度和集中度来判断收入耐久性和定价权
        - 提供活跃商户数、企业客户数、前 10 大客户敞口和留存趋势
      - - 实际单包裹收益率
        - null
        - 低
        - 包装标价无法揭示折扣和结构影响后的实际单包裹收入
        - 提供按国家和服务线拆分的实际单包裹收入，以及附加费转嫁
      - - 毛利率
        - null；J&T FY2024 规模代理显示，在大得多的规模下毛利率也只有约 10.5%
        - 中
        - 毛利率决定网络规模是在产生现金，还是只是在堆货量
        - 提供按分部、路线族群拆分的毛利率，并区分冷链与常温配送
      - - 销售和营销 / CAC 强度
        - null；Sea 2025 电商销售和营销费用为 US$4.5 billion，且仍增长 29.4%
        - 中
        - 卖家获客、促销和流量成本会吞掉物流重资产商业的运营改善
        - 按市场提供 CAC、回本周期、销售效率和促销或补贴强度
      - - 分拣生产率
        - Ninja Van 9 个枢纽自动化项目目标最高提升 50% 生产率
        - 中
        - 分拣效率直接撬动单包裹成本和服务可靠性
        - 提供已实现的生产率提升、资本开支回本，以及自动化前后的枢纽级吞吐量
      - - 冷链单位经济性
        - 长期目标是收入的 10% 和利润的 50%；未披露实际利润率
        - 中
        - 冷链可能改善业务结构，但会增加车辆、设备和操作强度
        - 提供单车资本开支、利用率、损耗、定价溢价和每个冷链停靠点的毛利率
      - - 在手现金
        - null
        - 低
        - 现金决定跑道，也决定已披露债务和重组是否足够
        - 提供非受限现金、受限现金和最低流动性门槛
    notes: null 表示审阅材料中未公开该指标，并不代表该指标为零。上市公司代理只用于框定 Ninja Van 可能面对的物流经济性， 不用于反推 Ninja Van 自身利润率。
