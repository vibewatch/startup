      - number: '2.3'
        title: 各细分的买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的买方图谱是多边的，不是同质的。中小包裹商家是最明显的细分：他们用末端配送、轻履约和国际运输服务电商平台与 DTC
              需求，老板或运营负责人常常同时是买方、用户和付款方。企业和全渠道品牌不同。它们购买
              3PL、仓储和一体化分销，是为了规模、更低物流开销和区域服务连续性；用户是供应链和运营团队，付款方通常是集中物流或采购预算。社交卖家和直播电商商家又是另一类，因为量有尖峰、单票小，采用触发点是灵活揽收、快速交接和低摩擦上门配送。

              B2B 补货和冷链账户进一步扩大买方基础。零售连锁和分销商需要循环补货配送、LTL
              补货和跨境卡车运输，因为断货成本高于包裹价格本身。冷链客户为合规和产品完整性买单，不只是为速度买单；温控、监测和可审计性比绝对最低价线路更重要。跨境卖家和进口商关心海关支持、保税库存和可预测配送时间，以管理转化和复购。这些细分都使用重叠基础设施，但决策者、预算负责人和采用触发点差异足够大，单一泛商家
              TAM 会掩盖 Ninja Van 如何把密度变现。
