  - id: TP003
    title: 公开价格 / 包装对比
    columns:
      - 运营商 / 市场
      - 公开价格或套餐信号
      - 包含能力
      - 公开限制说明
      - 含义
    rows:
      - - Ninja Van 经 EasyParcel（马来西亚）
        - 国际运输 RM22 起
        - 国际线路、追踪、通过 EasyParcel 集成
        - 对比页称 EasyParcel 当时只提供 Ninja Van 国际服务
        - Ninja Van 在该工作流中定位为跨境，而不是最便宜的国内选项
      - - J&T 经 EasyParcel（马来西亚）
        - 国内配送 RM5.42 起；支持 COD
        - 国内配送、本地 COD、平台集成
        - 平台对比价，而不是通用资费
        - J&T 更适合低价国内商户货量
      - - GrabExpress（新加坡）
        - 固定费用在应用 / 预订页披露；默认保障最高 S$500，可加购至 S$2,000
        - 即时、当日和 4 小时服务，带追踪和签收证明
        - 确切费用按路线和服务层级变化
        - 适合紧急城市发货和对信任敏感的配送
      - - Lalamove（新加坡）
        - S$0.50 平台费；S$2 等待费计费块；不同车型的取消和停靠费用；深夜附加费 1.1x-1.25x
        - 快递、轿车、MPV、厢式货车、货车、多点、搬运助手选项
        - 距离基础运费仍按路线和车型报价
        - 公开价格透明度高，但复杂度反映的是任务型调度，而不是包裹密度经济性
      - - Flash Express（泰国）
        - 免费揽收；COD 服务，按 2.5% 日结
        - 面向商户的 COD 工作流和网点 / 服务点接入
        - 官网未提供经审计网络经济性
        - 激进商户报价会压低价格底线
      - - J&T（菲律宾基准）
        - Metro Manila 不超过 1kg 标准价 ₱65；批量价 ₱52
        - 对比资料称全国覆盖，重点都市区当日达
        - 第三方比较，而非经审计资费表
        - 处在基准组中游
      - - Ninja Van（菲律宾基准）
        - Metro Manila 1kg 以内标准价 ₱70；批量价 ₱55
        - 比较中突出技术化追踪和 API 叙事
        - 仅作方向性比较
        - 在该市场视角下，相比 Flash 有溢价，略高于 J&T
      - - Flash（菲律宾基准）
        - Metro Manila 1kg 以内标准价 ₱60；批量价 ₱48
        - 面向预算敏感商户的定位
        - 仅作方向性比较
        - 三个菲律宾可见对标同行中价格最低
    notes: 公开定价证据碎片化，且因市场而异。官方包裹产品定价最透明的是新加坡按需平台和平台比价渠道； 区域合同价或补贴调整后的实际收益率并不透明。
