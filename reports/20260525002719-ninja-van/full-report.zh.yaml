      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最清楚的资本信号是，Ninja Van 仍在管理流动性和重组优先级，而不是展示一个现金充裕、自筹扩张的故事。2024 年 10 月，公司从 HSBC 获得三年期 US$50 million
              循环信贷额度，明确用于支持区域增长，以及电商快递物流、B2B 补货和冷链配送服务发展。这应有助于营运资金和网络投资，但未披露提款状态、定价、契约包或不受限制现金。

              2025 年融资讨论更重要。Straits Times 和 Yahoo Finance 镜像报道了一轮内部主导的 US$80 million 融资，估值约 US$1
              billion，约为上一轮标记的一半，参与投资者拥有优先退出条款。再加上 Business Times 给出的最后一个公开损益锚点——FY2023 收入 S$1.0 billion、亏损 S$326.8
              million——图景是一家公司有规模，但仍需要债务弹性和新投资者支持。2025 年 8 月新加坡裁员进一步强化这一解读：这是成本重置和组合优先级调整，不是公开现金生成已经解决融资问题的信号。
