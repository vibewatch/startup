  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标 / 文件
      - 重要性
      - 当前公开状态
      - 精确尽调路径
      - 投资判断影响
    rows:
      - - 商户 / 客户数量和集中度
        - 需要用来评估收入耐久性和卖家侧议价权
        - 公开来源提到受信任品牌和机构，但没有精确商户或客户数量
        - 要求披露活跃商户、企业账户、前 10 大客户收入和按队列流失
        - 无法判断客户质量风险
      - - 服务线收入结构
        - 需要检验高利润率 B2B 和冷链是否已经有实质贡献，还是仍可忽略不计
        - 公开记录显示产品宽度和目标结构，但没有各线实际贡献
        - 要求提供覆盖核心包裹、跨境、履约、B2B、冷链和货运的收入桥
        - 业务结构改善逻辑仍停留在愿景层
      - - 实际单包裹收益率和折扣
        - 需要把网络规模同收入质量和利润率接上
        - 包装标价公开；企业和线路收益率不公开
        - 要求提供按国家和服务级别拆分的实际单包裹收入、附加费结构和折扣阶梯
        - 收入质量仍不透明
      - - 毛利率、单包裹成本和 CAC / 回本周期
        - 需要判断规模和自动化能否跑出现金经济性
        - 只有上市公司代理可用；Ninja Van 自身单位经济性未披露
        - 要求提供分部毛利率、单停靠点或单包裹成本、卖家 CAC、回本周期和留存数据
        - 无法判断利润率路径
      - - 现金、烧钱速度和跑道
        - 需要评估 HSBC 额度和重组是否足够
        - 审阅的公开来源未披露非受限现金、烧钱速度或跑道
        - 要求提供资金仪表盘、董事会跑道模型和下行流动性情景
        - 资本充足性仍只能推断
      - - 债务条款和契约包
        - 需要判断再融资风险和下行灵活性
        - 仅额度规模、期限和战略用途公开
        - 要求提供循环信贷协议、契约包、抵押品和提款条件
        - 条款若受限，债务容易被误读为流动性
      - - 冷链资本开支和利润率证明
        - 验证更高利润率转型投资逻辑必须补齐
        - 公开资料只显示试点客户、车队准备和激进贡献目标，没有披露已跑出来的经济性
        - 要求按路线类型披露冷链车队资本开支、利用率、损耗、人员配置和利润率
        - 盈利上行空间仍未验证
    notes: 这些缺失披露最直接影响承销判断。问题不在于外界缺少对战略的讨论，而是缺少把战略转成可投资经济性的运营和资产负债表数据。
