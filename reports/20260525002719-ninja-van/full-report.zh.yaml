        title: 规模信号与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录只能支持一组较窄的当前规模指标，因此后续尽调不应把缺失的私人公司数字当作零。官方页面目前支撑三个可见规模信号：公司称服务六个东南亚市场；新加坡关于页面称车队单元超过
              5,000；国际运输页面称新加坡客户可使用 800 多个 Ninja Points。这些都是有用的足迹信号，但不能说明当前收入、当前活跃客户数或全球员工总数。


              这种披露不对称很关键，因为 2025
              年报道强调压力，却没有给出投资者想要的分母指标。新闻报道提到估值重置谈判和新加坡裁员，但同一资料包仍未披露更新后的收入运行率、准确全球员工数或当前商家数量。因此，第一章应锚定已披露事实，把缺乏支撑的经营指标明确留空，并把缺失的商业细节视为尽调任务，而不是插值空间。
