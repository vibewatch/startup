      - number: '7.3'
        title: 合作伙伴、依赖与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的依赖栈对外部议价力暴露异常高。需求端，东南亚包裹网络仍搭在电商平台订单流上；Rest of World 报道称，即便 J&T 的增长也主要依赖电商平台，这可作为 Ninja Van
              自身包裹业务的有用行业类比。价格端，同业 证据看起来仍像竞争刀战，而不是理性市场。J&T 年报公开讨论海外市场竞争加剧，J&T FY2025 材料描述用成本效率
              与客户分享来维持包裹量增长，第三方对比也显示，在被引用的马来西亚和菲律宾样例中，Ninja Van 定价常高于同业； 同时在一份 2026 年菲律宾对比里，省级准时配送落后于
              J&T。网络端，越南现在是硬警示，不是假设。Ninja Van 正在更大范围重组下退出该国快递配送市场，说明如果经济性不足以支撑继续投入，管理层会撤出某些地理市场。资本端，
              当前内部轮由现有投资者以优惠条款牵头，凸显现金跑道仍取决于股东耐心，而不是已经跑通的自我造血引擎。如果 电商平台内化物流，如果 J&T、Flash 或平台自有网络继续补贴服务，或者投资者停止为转型融资，Ninja
              Van 的 中立承运商定位会迅速削弱。
