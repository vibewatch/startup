  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 主题
      - 当前证据
      - 威胁路径
      - 严重性
      - 重要性
      - 尽调要求
    rows:
      - - 密度和线路利用率
        - J&T 在东南亚市占 34.4%、包裹量 7.66B，显示规模优势
        - 规模更大的中立同行比 Ninja Van 更快摊薄成本
        - 高
        - 密度是这个品类少数可持续的成本优势之一
        - 需要 Ninja Van 披露可比的包裹量、路线密度和分拣利用率
      - - 平台内的锁定需求
        - SPX 和 Lazada 控制订单流、补贴和快递选择
        - 中立承运商即便做大第三方网络，也可能丢量
        - 高
        - 平台把物流内化后，渠道权力压过快递能力
        - 需要商户结构数据：Ninja Van 来自平台的货量与直接品牌货量对比
      - - 跨境和清关执行
        - Ninja Van、J&T、Cainiao、BEST 和 Viettel 都在营销跨境能力
        - 跨境成了入场门槛，而不是差异化
        - 中
        - 如果质量可量化地更好，跨境仍能帮中立承运商加分
        - 需要按线路披露准时清关率和破损率数据
      - - 信任、保险和合规
        - Grab 宣传有保险的配送；SingPost 和 Viettel 具备机构信任；Lalamove 参与平台用工政策讨论
        - 敏感品类可能偏向感知合规更强的运营商
        - 中
        - 在企业或受监管垂直领域，信任能护住定价
        - 需要 Ninja Van 企业案例的赢单 / 输单数据
      - - 商户多承运商并用
        - 比价工具和集成商让商户同时接入多家快递
        - 合同锁定弱，价格压力和流失风险上升
        - 高
        - 商户若能快速绕开 Ninja Van，定价权就会持续偏弱
        - 需要按客群披露商户留存、API 粘性和钱包份额数据
      - - 行业利润率压力
        - ION、Sea、Grab、SingPost 和 Viettel 都显示补贴或低利润率压力
        - 品类在 Ninja Van 捕捉可持续经济性前就可能商品化
        - 高
        - 上市同行已经表明，规模不等于利润率有韧性
        - 需要 Ninja Van 按包裹、线路和客户类别拆解的贡献利润率桥
    notes: 严重性判断的是未来两到三年内，每条路径能多直接地损害定价权或留存。该登记表把直接竞争压力、 替代方案和维持现状的风险放在一起，因为买方可以用多种方式完成同一任务。
    enumerationScope:
      coverage: partial
      basis: >-
        Summarizes the main moat and commoditization vectors visible in the reviewed 2025-2026 source pack for Southeast
        Asia last-mile logistics rather than every possible operational risk.
    claimRefs:
