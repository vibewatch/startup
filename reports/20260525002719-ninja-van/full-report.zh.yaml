      - - 物理履约层
        - 履约、末端配送、B2BR、冷链、货运和跨境执行
        - 仓库、干线运输、揽收 / 自寄点和运营伙伴
        - 服务质量同时取决于软件和一线执行
        - 护城河来自运营和网络，不是纯数字化
      - - 支持和异常处理层
