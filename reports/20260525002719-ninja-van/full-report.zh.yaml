      - 类别
      - 核心地域
      - 公开规模信号
      - 产品范围
      - 战略方向
      - 相比 Ninja Van 的关键局限
    rows:
      - - Ninja Van
        - 区域中立第三方承运商
        - 新加坡、马来西亚、菲律宾、印尼、越南及邻近跨境线路
        - 私营；本章节包未披露公开规模
        - 门到门包裹、跨境运输、揽收 / 自提点、Shopify 关联下单
        - 守住多平台中立性和跨境工作流质量
        - 没有可与 J&T 对比的公开份额或利润率披露
      - - J&T Express
        - 区域中立第三方承运商
        - 东南亚加中国、中东和拉丁美洲
        - 2025 年东南亚 7.66B 件包裹；东南亚份额 34.4%；东南亚收入 US$4.5B
        - 快递配送和国际物流
        - 巩固东南亚领先地位，同时扩大直营品牌和平台组合
        - 仍暴露于平台货量波动和偏薄的全球净利率
      - - Shopee Xpress / SPX
        - 平台自有物流栈
        - Shopee 覆盖的东南亚市场
        - 承运大多数 Shopee 包裹；第三方报告称 2024 年物流份额约 25%
        - 平台履约、自营最后一公里、密集市场次日达
        - 在 Shopee 生态内加深自有物流
        - 独立包裹量、实现价格和利润率披露不透明
      - - Lazada Logistics / LEX + Cainiao
        - 平台自有物流栈
        - Lazada 东南亚加 Alibaba 跨境线路
        - Alibaba 称 Lazada 运营东南亚领先电商物流网络之一
        - 平台履约、跨境、Cainiao 赋能的技术和物流节点
        - 用商业加物流一体化改善商户和买家体验
        - 公开独立物流经济性仍不透明
      - - Lalamove
        - 按需城市替代方案
        - 新加坡和东南亚主要城市
        - 公开的新加坡价格表；此处无区域包裹份额披露
        - 即时和当日快递、多点、大件和家具配送
        - 扩大当日达和 SME 工作流相关性
        - 不是全国性延迟包裹网络
      - - GrabExpress
        - 超级应用内的按需城市替代方案
        - 新加坡和 Grab 在东南亚的更广覆盖
        - Grab 2026 年 Q1 On-Demand GMV US$6.1B；收入 US$510M
        - 即时、当日和 4 小时快递，带保险和追踪
        - 借力超级应用需求、补贴和司机网络
        - 经济性仍依赖大量补贴和城市密度
      - - Flash Express
        - 低成本商户挑战者
        - 泰国；马来西亚和菲律宾可见区域商户对比
        - 公开 COD / 融资数据稀疏；对比页显示价格攻势强
        - 包裹配送、免费揽收、COD 结算、网点网络
        - 靠便利和价格赢得商户货量
        - 经审计规模和盈利能力透明度较低
      - - SingPost
        - 老牌邮政和电商物流服务商
        - 新加坡加 220+ 目的地
        - FY25/26 收入 S$376.1M；基础净利润 S$10.7M
        - 邮政、仓储、履约和最后一公里配送
        - 自动化并拓宽物流服务，同时用物业基础稳定业务
        - FY25/26 国际电商货量同比下降 57.9%
      - - Viettel Post
        - 具备跨境雄心的全国性老牌运营商
        - 越南全国覆盖加 FedEx 关联国际线路
        - VND20.29T 滚动收入；FedEx 全国网络服务商角色
        - 国内和国际快递、物流、仓库、海关协调
        - 利用国内密度和物流基础设施，加深 B2B 与跨境相关性
        - 尽管有规模，公开利润率仍薄
      - - BEST Express
        - 次规模区域挑战者
        - 泰国加部分东南亚跨境线路
        - 2021 年泰国 ~300K 件 / 日、~1,000 家加盟商
        - 快递配送、仓库管理、跨境、大件运输
        - 从泰国基地切入区域跨境线路
        - 目前未充分披露 2026 年东南亚全域包裹规模
    notes: 该表混用运营商披露和第三方对比。规模指标并未在公司之间标准化，私营玩家也往往只披露片段式快照。
