  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户、付款方、地理和用例划分客户
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 现在营销的是分层清晰的客户群，而不是一个通用包裹产品。新加坡首页明确区分线上卖家、SME 和企业客户；新加坡、马来西亚、菲律宾、印度尼西亚也都展示更宽的物流栈，从包裹交接延伸到履约、仓储、
              货运、B2B 补货，并且至少在新加坡和马来西亚覆盖冷链配送。这很重要，因为买方、使用方和付款方会随客群 变化：线上卖家或微型商户往往自己购买、自己使用；SME 会加入门店和仓库操作员以及库存负责人；更大的企业
              账户则把决策推给采购和供应链团队，同时把实际用户留在物流或仓储职能里。公开证据在消费电商和卖家工具上 最强，但服务地图显示，公司有意向上进入更高 ACV 的 B2B、3PL 和供应链编排。地理也关键：新加坡展示最
              完整的服务套件，马来西亚强调全国零售和 B2B 规模，菲律宾突出企业履约，印度尼西亚则说明补货和冷链模块 正在核心新加坡市场之外复制。
