  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合同风险面
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 最难核验的法律问题不是头条诉讼，而是托运人合同不对称、PDPA 问责，以及 COD 和包裹冒充相关的 欺诈暴露叠在一起。标准配送条款允许 Ninja
              通过通知调整价格、费用和折扣；在不可抗力或监管事件干扰时暂停 服务；并排除延误、软件不可用、间接损失，以及——除非购买责任保障并遵守其标准流程——多数包裹遗失或损坏索赔
              的责任。这意味着服务失败发生时，商户追偿风险可能正好被推回托运人。隐私政策另行确认，Ninja Van 可以为了 运营配送和改善服务，使用并与关联公司、服务提供商和第三方卖家共享个人数据；与此同时，新加坡
              PDPA 和 PDPC 数据泄露指南把公司置于正式问责和泄露通知制度之内。欺诈风险也不是假设：Ninja Van 自己的诈骗提醒称，COD
              诈骗无法完全消除，因为境外团伙可以轮换店铺和运输集运商；新加坡警方也警告，虚假包裹配送短信会被用来获取 银行凭据。集团确实发布了合规邮箱、举报路径和供应商准则，这些是真实缓释项，但它们是治理基础设施，不是低
              事故率或经审计控制成熟度的证明。
