      - CP030
      - CP031
      - CP045
      - CP048
      - CP049
      - CP050
      - CP051
      - CP052
      - CP054
  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 单位
      - 当前价值 / 状态
      - 质量
      - 尽调要求
    rows:
      - - 核心包裹配送
        - 为电商、中小企业和企业发货方提供最后一公里包裹与快递配送
        - 按包裹 / 票件
        - 官方在东南亚范围营销；菲律宾主页披露网络层面 2,000,000 parcels/day
        - 存在性证据强，分部经济性披露弱
        - 提供按国家拆分的包裹结构、平均实际收益率，以及按服务类型拆分的准时指标
      - - 国际与跨境包裹配送
        - 覆盖具名线路和更广国际网络的个人与商业寄件
        - 按包裹 / 线路
        - SG 网站营销覆盖 44 个国家的国际配送，以及到 MY、PH、HK、AU、US、UK、NZ 等地的 C2C 线路
        - 机制看得见，线路盈利能力看不见
        - 提供跨境收入占比、清关成本转嫁和线路级利润率
      - - 履约和仓储
        - 为商户提供库存存储、订单处理和履约运营
        - 仓储 + 拣货 / 打包 + 订单处理
        - SG、MY 和 PH 材料中均有官方营销；未公开收入拆分
        - 服务明确存在，变现条款未披露
        - 提供仓储面积、出租 / 使用率、拣货 / 打包价格和贡献利润率
      - - B2B 补货 / Dash
        - 多点补货、经常性合作伙伴配送、大件配送和拼载线路
        - 按路线 / 站点 / 配送趟次
        - 通过 Ninja Restock 和 Ninja Dash 公开营销；PH 文章提到固定、透明定价
        - 机制证据较好，实际定价证据有限
        - 提供合同模板、平均路线经济性和网点 / 门店密度假设
      - - 冷链
        - 使用冷藏车和配备保温箱车队的温控配送
        - 温控票件 / 合同
        - 已在 SG 和 MY 公开推出，约有 20 个测试客户；长期目标是贡献收入的 10% 和总利润的 50%
        - 战略吸引力强，但公开记录中仍处试点阶段
        - 提供试用转付费、冷链资本开支、利用率、损耗和毛利率
      - - 货运代理和合同物流
        - 空运、海运、卡车和铁路货运，以及更广的合同物流范围
        - 按货运报价 / 合同
        - SG 网站展示货运代理报价和合同物流范围；未公开定价或收入结构
        - 能力广度得到确认，收入归属不透明
        - 提供货运代理收入占比、客户集中度和营运资本画像
    notes: 这张表把可见服务线与公开经济性披露分开。官方页面说明 Ninja Van 在卖什么，但只有马来西亚包装产品披露明确标价； 多数服务经济性仍靠谈判或未披露。
