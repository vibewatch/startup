      - number: '3.5'
        title: 护城河判断：中立性有用，但商品化压力真实存在
        blocks:
          - type: paragraph
            body: >-
              反向证据足够强，Ninja Van 应被视为处在一个护城河耐久度仅中等的市场。ION 描述了区域价格战：外资支持玩家压低本地价格，并推动整合。Rest of World 展示平台自有物流如何在 Indonesia
              从 J&T 这样的规模化第三方承运商手中抽走货量。Sea 自己的业绩显示，物流变现被运费补贴抵扣压低。这些都不意味着 Ninja Van 不能赢；它们意味着公司不能只靠“区域规模”作为充分防御。


              公开同行经济性也强化了这一点。J&T 规模远大于 Ninja Van，FY2025 全球净利率仍只有约 1.9%。SingPost 在 FY25/26 仍盈利，但基础盈利很小，国际电商量大幅下滑。Viettel
              Post 的市场数据画像显示，即使国内领先，净利率仍低于 2%。Grab 的配送规模很亮眼，但该业务一个季度仍消耗 US$650 million 激励。这些经济性不允许粗放定价或弱利用率。


              Ninja Van 可投资的上行，来自成为可信的中立承运商：平台、品牌和商家仍需要多平台灵活性、跨境支持和标准化流程工具。下行则是，市场越来越奖励控制需求的一方，而不只是运营一张合格网络的一方。除非 Ninja
              Van 能在价格压力把品类商品化之前，更快复合密度、跨境相关性和企业信任，否则利润率韧性仍会脆弱。
