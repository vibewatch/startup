  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 运营、法律和融资风险如何级联为流失、利润率压力和估值压缩。
    data:
      nodes:
        - id: n1
          label: 派送延误 / 处理不当
          detail: 积压、漏揽、包裹破损
        - id: n2
          label: 商家信任侵蚀
          detail: 理赔、投诉和重复使用减弱
        - id: n3
          label: 价格让步 / 流失
          detail: 折扣或包裹量流失
        - id: n4
          label: 利润率压力
          detail: 单票收益降低，支持 / 补救成本升高
        - id: n5
          label: 融资压力
          detail: 需要内部人资金，或放慢投资
        - id: n6
          label: 估值压缩
          detail: 偏好权重更高的轮次，退出选项变弱
        - id: n7
          label: 隐私 / 诈骗事件
          detail: PDPA、钓鱼或 COD 欺诈升级
        - id: n8
          label: 监管 / 补救成本
          detail: 调查、退款或重新设计负担
        - id: n9
          label: 反复重组
          detail: 一边转向，一边裁员并退出市场
      edges:
        - from: n1
          to: n2
          label: SLA 未达标，包裹信心下降
        - from: n2
          to: n3
          label: 商家转投他处或要求让步
        - from: n3
          to: n4
          label: 单票收益降低
        - from: n4
          to: n5
          label: 盈利时间点进一步后移
        - from: n5
          to: n6
          label: 新资金附带更弱条款
        - from: n7
          to: n8
          label: 欺诈 / 隐私事件推高响应成本
        - from: n8
          to: n4
          label: 法务和支持支出上升
        - from: n9
          to: n1
          label: 高峰期执行余量更少
        - from: n9
          to: n5
          label: 发出信号：转向仍需资金
    approximationNotes: 这张 DAG 把本章因果逻辑压缩成一张可监控的风险流图；它不是公司披露的运营模型。
