  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Ninja Van 公开可见的变现路径从商户或消费者发货需求开始，分流到包裹、履约、B2B 和冷链服务， 之后才转化为收入；实际收益率大多仍未披露。
    data:
      nodes:
        - id: merchant-demand
          label: 商户 / 消费者发货需求
          detail: 需求来自东南亚电商卖家、SME、企业、分支机构和机构客户
        - id: parcel-network
          label: 核心包裹与跨境网络
          detail: 按件付费包裹配送、C2C 线路和覆盖 44 个国家的国际配送都已公开营销
        - id: value-added
          label: 履约、仓储和货运
          detail: 官网页面推广合同物流、履约、仓储、清关和货运代理
        - id: b2b-restock
          label: B2B 补货 / Dash
          detail: Ninja Restock 和 Ninja Dash 支持循环多点投递和补货工作流
        - id: cold-chain
          label: 冷链
          detail: Ninja Cold 是较新的温控服务，定位为更高毛利的邻近业务
        - id: billing
          label: 发货 / 合同计费
          detail: 包装标价和运输时效公开，但多数企业定价仍靠谈判
        - id: revenue-quality
          label: 已确认收入与现金质量
