      - number: '6.5'
        title: 扩张路径、集中度风险与竞争压力
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的客户扩张逻辑越来越清楚：把商户从纯包裹关系推进到更广的履约、仓储、货运、B2B 补货和冷链 服务，让公司在客户物流栈里占更大份额。管理层明确把目标描述为成为一站式服务商，让客户使用全套服务；
              Beamstart 也说明这个策略为何重要：Shopee 和 Lazada 一直在建设自有物流能力，侵蚀第三方包裹量；Ninja Van 的回应是更重押 B2B
              物流和冷链，同时退出越南快递配送并裁员。这让集中度风险分成两层。第一是平台 / 渠道依赖风险，因为 Lazada 位于 Alibaba 生态内，而 Alibaba 参加了 Ninja Van 2021 年
              Series E；即便 公开记录没有披露平台相关收入或包裹量占比。第二是结构风险：公开点名证据偏向 SME 和中端电商，而企业、
              医药和冷链策略在产品页和管理层评论中更可见，在点名生产案例中更少。扩张方向可信；集中度透明度不足。
