      - number: '4.3'
        title: 末端物流的成本结构与利润率驱动
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Ninja Van 的成本结构更像经典末端物流，而不是软件：揽收和末端人力、干线运输、分拣、仓储与履约、路线密度、获客，以及自动化或冷链设备资本开支。GeoPost 的 2022
              年伙伴公告是公司生态里最清楚的运营信号，描述了一个覆盖九个枢纽、目标生产率提升 50% 的 US$50 million 自动化项目。这有助于识别管理层认为重要的杠杆，但没有披露单票成本或毛利率。

              上市公司代理指标只能给方向。J&T FY2024 业绩显示，即便规模大得多，毛利率也只有约 10.5%；其东南亚单位经济性叙事明确依赖灵活定价、薪酬理顺、自有车队经济性、干线优化和自动化分拣。Sea 2025 年
              20-F 显示，订单量扩张时，电商平台经济性仍被物流和仓储成本以及大额销售营销费用拖累。Pos Malaysia 2025 年年报描述了激进包裹定价、平台主导的内部物流，以及靠自动化和网络优化守利润率。对
              Ninja Van 的读穿是，路线密度和自动化可以帮忙，但业务仍在结构上暴露于价格竞争、劳动力、运输和履约成本。
