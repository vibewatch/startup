        - 寄件方支持团队和证据提交
        - 人工调查步骤可能拉长异常处理
        - 支持是运营模式中的结构性一环
    notes: 架构是根据公开产品、仪表盘、API 和支持材料推断，并非来自正式系统设计白皮书或基础设施披露。
