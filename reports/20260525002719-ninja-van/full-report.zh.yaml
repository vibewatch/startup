      - number: '3.2'
        title: 中立包裹承运商和国家级在位者仍然重要
        blocks:
          - type: paragraph
            body: >-
              在开放市场包裹承运商中，J&T 是最强的公开标杆。其 FY2025 文件显示，东南亚包裹量 7.66 billion、市场份额 34.4%，区域调整后 EBIT 约 US$538
              million。密度与披露利润的组合很重要，因为它显示了在平台控制物流面前保持相关性的最低规模。J&T 的区域赞助商模式也说明，运营去中心化可以在每个市场不承担全部前置资本开支的情况下加快铺开。对 Ninja
              Van 而言，这是最重要的直接同行，因为两家公司都是区域型、包裹中心型，并依赖赢得商家和电商平台货量，而不是自己创造订单。


              Flash Express 的竞争方式不同。其公开首页突出免费揽收、自助注册 COD、每日结算和费率估算，而不是经审计的区域市场份额披露。这说明它的商家获客打法围绕营运资金便利和一线易用性。BEST
              Express 今天更小也更不透明，但 Bangkok Post 仍称其 Thailand 业务约有 1,000 家加盟商、每天处理约 300,000
              个包裹，并在激烈竞争中大力推进大件和跨境线路。这些挑战者重要，因为它们可以压低价格，即便未必成为最安全或最广的网络。


              国家级在位者仍是重要替代方案。SingPost 的 FY25/26 公告显示，这是一家承压但仍相关的在位者，覆盖 220 多个目的地，国内电商量增长，并提出自动化议程。Viettel Post 在 Vietnam
              更重要：FedEx 选择它作为全国网络提供方，公开市场数据源也显示其全国覆盖和很大的国内收入，但经营和净利率很薄。这组组合说明，即便经济性不漂亮，在位者也很难被撬走。
