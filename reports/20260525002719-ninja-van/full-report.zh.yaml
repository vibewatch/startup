      - number: '2.5'
        title: 证据缺口与估值读穿
        blocks:
          - type: paragraph
            body: >-
              公开记录足以说明 Ninja Van 身处一个庞大、增长、服务多元的东南亚配送市场，但不足以隔离公司的真实可获取市场。公开来源确认公司覆盖末端包裹、仓储、跨境配送、B2B
              补货和冷链，却没有披露包裹份额、收入结构、挂载率、分国家密度，或来自企业合同与长尾商家的需求占比。这个缺失的公司特定分母，是本章把市场测算视为证据受限，而不是假装知道一套干净 TAM/SAM/SOM 的主因。

              对估值而言，实际含义是看密度和可变现结构，而不是抽象 GMV。一家包裹密度强、但企业挂载弱或冷链经济性弱的承运商，仍可能困在价格战里；一家包裹份额不高、但跨境、B2B
              补货和仓储挂载强的公司，变现能力可能远高于包裹量本身暗示。证据基础支持建设性需求判断，但仍保留服务结构、利润率质量和可归属份额上的重大不确定性。这是收敛问题，不是放大市场边界的理由。
            claimRefs:
              - CM012
              - CM034
              - CM040
