      - - Shopee Xpress / SPX
        - 大多数 Shopee 包裹；2024 年物流份额约 25%
        - 物流服务收入受到运费补贴抵扣挤压
        - 新加坡次日达表现强；嵌入 Shopee 各市场
        - 很高，因为 Shopee 控制订单流和补贴设计
        - 权力来自生态控制，而非干净的独立 P&L
      - - Lazada / Cainiao
        - Alibaba 称其为领先东南亚物流网络；未披露独立包裹量
        - 无干净包裹利润率披露
        - 背靠 Alibaba 国际商业和 Cainiao 网络
        - 高，因为 Lazada 掌握平台需求，Cainiao 支撑物流栈
        - 经济性不透明，但战略支持强
      - - GrabExpress
        - 2026 年 Q1 On-Demand GMV US$6.1B；集团层面 52M 平台 MTU
        - 季度补贴 US$650M；收入 US$510M
        - Grab 覆盖范围内的城市当日达网络
        - 密集城市中高，因为超级应用控制需求和司机供给
        - 替代型经济性不同于延迟包裹承运商
      - - Flash Express
        - 公开规模主要来自对比页和官网主张
        - COD 2.5%；此处未见经审计区域利润率
        - 以泰国为中心，商户工具可见
        - 靠一线商户便利性取胜，而不是自有需求
        - 价格主导的挑战者，而非已披露规模领导者
      - - SingPost
        - FY25/26 收入 S$376.1M；220+ 目的地
        - 基础净利润仅 S$10.7M；营业利润下降 68.9%
        - 国内邮政骨干加国际目的地
        - 中等，因为老牌机构信任度强，但增长疲弱
        - 老牌运营商仍可信，尤其适合受监管和国内流量
      - - Viettel Post
        - VND20.29T 滚动收入；2023 年 2M 单 / 日；2026 年 FedEx NNP
        - 2.26% 营业利润率；1.85% 净利率
        - 越南全国覆盖，加具备清关能力的跨境角色
        - 在越南境内高，因为网络和国资关联信任根深蒂固
        - 说明即便领导者也在薄利率上运营
      - - BEST Express Thailand
        - ~300K 件 / 日；2021 年泰国件量份额 ~8%
        - 已审阅资料包未见当前东南亚公开利润率披露
        - ~1,000 家加盟商加泰国跨境线路
        - 低至中等，因为需求不自有、披露也薄
        - 有体量，但规模较小的挑战者
      - - Ninja Van
        - 此处未披露公开规模
        - 已审阅资料包未披露公开利润率
        - 区域包裹品牌，具备新加坡工作流细节和跨境支持
        - 依赖中立商户关系，而非自有订单流
        - 不透明本身就是尽调约束
      - - Flash + Ninja + J&T 菲律宾基准
        - Cloud Ecommerce 对比覆盖 81 / 75 / 68 个省
        - Metro Manila 不超过 1kg 包裹基准费密集落在 ₱60-₱70
        - 菲律宾样本显示覆盖范围加价格压缩
        - 商户比较实时替代方案时，切换摩擦低
        - 有用的方向性证据，不是经审计的全市场事实
    notes: 这些行混用监管文件、官方发布和可信二级资料。经济性指标不能直接对比，因为有的是季度口径，有的是年度口径，有的则是从公开片段中推算。
