              tokens、沙盒和生产环境，以及授予生产访问前的审计路径。结果是一套相当成熟的集成界面，但它不是纯 SaaS 开发者平台式自助。生产 API
              访问取决于商业协议、沙盒测试和技术审核，插件集成也分为较快的凭证式连接和较慢的标准 API 激活。
