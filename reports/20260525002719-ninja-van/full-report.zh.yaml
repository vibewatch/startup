      - number: '6.2'
        title: 点名客户证据与生产部署对比试点证据
        blocks:
          - type: paragraph
            body: >-
              公开点名证据集中在面向商户和 B2B 的案例材料，而不是蓝筹企业采购披露。Ninja Van Singapore 展示了 三个时尚和生活方式托运客户——MGP Label、Caramel Monster 和
              Mod Parade——其引述描述的是实际运营使用， 不是单纯摆放 logo。MGP Label 明确把 Ninja Van 与新加坡到马来西亚 3 个工作日跨境配送联系起来；Caramel Monster
              强调即时更新和由支持团队推动的异常处理；Mod Parade 则把服务定义为持续可靠。菲律宾案例流又给出 另一类证据：Una Brands 在测试进入菲律宾市场时，把 Ninja Fulfillment
              当作即插即用的仓储、履约和末端 配送伙伴；这更像从试点走向生产的市场进入部署，而不是已经长期成熟的账户。马来西亚 Ninja Restock 发布 带来公开记录里最清晰的 B2B
              点名账户——Faber-Castell——其价值主张是库存补货、更小且更频繁的发货，以及 更少缺货。合起来看，这些引用证明商户包裹、跨境电商、履约和 B2B 补货中确有生产使用，但证据仍偏向 SME
              和中端市场。点名企业、药品或冷链客户的公开证据明显更薄。
