    summary: 运营工具公开文档很完整，但外部保证和量化集成采用仍缺少强证据。
    approximationNotes: 单元格反映抓取材料里的证据质量，而不是内部 KPI 或客户满意度数据。
    data:
      columns:
        - 公开成熟度信号
        - 主要依赖
        - 尽调状态
      rows:
        - label: Dashboard 运营工作流
          values:
            - label: 高：明确的操作文档
              tone: positive
            - label: Dashboard 可用性和权限
              tone: warning
            - label: 需要披露 uptime 和错误率
              tone: warning
        - label: API 入驻
          values:
            - label: 中高：详细审计路径
              tone: positive
            - label: 商业协议和 QA 评审
              tone: warning
            - label: 需要 rate limits 和生产支持 SLA
              tone: warning
        - label: 最后一公里和履约
          values:
            - label: 高：官方解决方案覆盖广
              tone: positive
            - label: 一线执行质量
              tone: warning
            - label: 需要独立服务 KPI
              tone: warning
        - label: B2BR 和跨境
          values:
            - label: 中：服务页面和伙伴界面已上线
              tone: positive
            - label: 网络和海关复杂度
              tone: warning
            - label: 需要权威覆盖地图和结果数据
              tone: warning
        - label: 冷链
          values:
            - label: 中：方法已公开描述
              tone: positive
            - label: 温控执行
              tone: warning
            - label: 需要经审计的表现 / 合规指标
              tone: warning
        - label: 安全和可靠性保证
          values:
            - label: 中低：有政策文档
              tone: warning
            - label: 第三方保证证据
              tone: warning
            - label: 需要公开 SLA、状态页和认证
              tone: warning
    claimRefs:
      - CE032
      - CE042
      - CE043
      - CE044
      - CE045
      - CE046
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: 公开证据显示，旅程从卖家自助发货开始，经追踪和履约加深关系，再向高价值账户扩展到 B2B 补货、3PL 和冷链服务。
    data:
      items:
        - label: 发现
          stage: 发现
          actors:
            - 线上卖家
            - SME 创始人
            - 供应链采购方
          touchpoints:
            - Ninja Van SG 首页
            - Shopify 应用列表
            - WordPress 插件列表
          emotion: 评估设置是否简单、COD 是否支持、服务范围是否够宽
        - label: 入驻
          stage: 入驻
          actors:
