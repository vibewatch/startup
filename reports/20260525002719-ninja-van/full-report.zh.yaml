  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 再次下调估值融资或高度结构化内部融资
        - 名义估值低于约 US$1B，或新一轮优先权显著更强
        - 确认当前估值既不耐久，也不干净。
        - 在此前价格锚下，从继续研究转向回避。
      - - 收入进一步下滑
        - 又一年收入负增长，或包裹量大幅侵蚀
        - 削弱“多元化已稳定基础业务”的论点。
        - 将可比估值区间重切向熊市范围。
      - - 契约或流动性压力
        - HSBC 循环贷款修订、担保包或其他放贷方保护收紧信号
        - 使优先级风险高过股权上行。
        - 暂停尽调，直到债务条款完成重新承保。
      - - B2B / 冷链转型不及预期
        - 无证据显示 B2B 或冷链达到有意义的收入占比或利润率贡献
        - 让 Ninja Van 困在低倍数包裹品类中。
        - 将 Sea 式上行倍数假设视为无效。
      - - 客户集中度或留存冲击
        - 重大流失、续约疲弱，或少数客户 / 平台集中度过高
        - 削弱规模质量，并暴露利润率波动。
        - 要求大幅更低入场价，否则退出。
    notes: 触发项以可监测条件表述；这些条件会推翻估值论点，而不是泛泛列风险。
    claimRefs:
      - CV023
      - CV024
      - CV026
      - CV027
      - CV044
      - CV046
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 债务文件
        - HSBC 授信协议、契约、抵押品和优先级条款
        - 债务优先级可能比名义估值暗示的更快抹去股权上行。
        - 法律和放贷方尽调；获取已签署 RCF 及修订历史。
      - - 股权结构表 / waterfall
        - 完全摊薄持股、清算优先权、期权池和任何 ratchet
        - 2025 年优惠条款可能使名义估值无法代表普通股价值。
        - 公司财务 + 律师；搭建完整清算 waterfall。
      - - 经审计 FY2025-2026 财务数据
        - 按业务线收入、毛利率、EBITDA、经营现金流和现金余额
        - 可比区间取决于 Ninja Van 是变成更好的业务，还是只是收得更紧。
        - 财务尽调；索取经审计报表和管理层桥接表。
      - - 客户集中度 / 留存
        - Top-20 客户、续约情况、流失率和平台依赖
        - 只有收入质量耐久且多元，规模才值得溢价。
        - 商业尽调；按地区和产品整理 cohort 与集中度包。
      - - B2B / 冷链经济性
        - 补货、冷链和上游服务的收入、毛利率和贡献利润
        - 多元化必须在经济性上有意义，而不只是叙事好看，牛市情景才成立。
        - 与产品和国家负责人做 BU 尽调；验证利润率和复购使用。
      - - 重组证据
        - 越南退出复盘、国家层面盈利能力，以及弱线路管理计划
        - 需要判断收缩是有纪律裁剪，还是结构性脆弱的证据。
        - 国家层面经营复盘和董事会材料。
    notes: 这些问题围绕估值承保排序，而不是泛泛了解公司。前三项任意一项都可能实质改变股权结果。
    claimRefs:
      - CV007
      - CV012
      - CV023
      - CV026
      - CV044
      - CV048
      - CV049
      - CV050
