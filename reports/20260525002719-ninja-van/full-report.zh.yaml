      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求驱动是真实的。E-Conomy SEA 2024 和 2025 显示数字商务增长强劲，视频商务到 2025 年从小众形态走到区域电商 GMV 的四分之一。McKinsey
              的结构性研究解释了这为什么会传导到物流：过去十年，东南亚电商销售额和零售渗透率已经明显上台阶。Parcel Perform 和 Mordor 补上运营角度：Indonesia、Malaysia、Singapore
              和 Thailand 消费者仍偏好送货上门，社交电商小票发货在增加，二三线订单越来越把包裹密度推到首都核心区之外。保税仓模式和海关协调压缩部分线路的配送时间和到岸成本，跨境需求也在改善。

              约束同样重要。Roland Berger 称利润率已承压，ION Analytics 描述区域末端 3PL 的价格战和整合压力。McKinsey 强调 COD 和退货摩擦，Maersk
              则指出东南亚地理结构让运输和末端执行成本高、运营复杂。冷链约束尤其明显，因为合规、隔离、监测和备份能力都会推高资本开支和客户上线成本。国内包裹仍主导网络利用率，但国际发货增长更快；这组组合奖励高密度网络，也迫使运营商管理海关复杂性、文件波动和跨境经济性的变化。因此，头部
              GMV 可以增长，盈利能力仍然胶着。
