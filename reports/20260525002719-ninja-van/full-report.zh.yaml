      - number: '1.3'
        title: 融资历史、投资者与债务
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 最后一轮明确披露的大额股权融资，仍是 2021 年 9 月宣布的 US$578 million E 轮。TechCrunch、TNGlobal、Business Times、Yahoo
              Singapore 和 BusinessToday 都描述了同一轮融资，并点名 Alibaba、GeoPost/DPDgroup、B Capital Group、Monk's Hill Ventures 和
              Zamrud 参投。这些报道还指出该轮融资把 Ninja Van 的估值推过 US$1 billion 门槛，使其明确进入后期私人公司区间。


              战略资本细节在 GeoPost 和 HSBC 身上最清楚。La Poste 称 GeoPost 在 2021 年把持股比例提高到 40%，这说明双方关系远深于被动少数股权投资。2024 年 10 月，Sidley
              和 Yahoo Singapore 报道 HSBC 提供了一笔三年期、已承诺的 US$50 million 循环信贷额度。两方都称，这笔债务用于支持区域增长，以及电商快递物流、B2B
              补货和冷链扩张。合在一起看，证据指向一家仍有机构支持的公司，但 2021 年以来已披露的资本结构重心，已从大额股权融资转向战略伙伴支持和银行债务。
