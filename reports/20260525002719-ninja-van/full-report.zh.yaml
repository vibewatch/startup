      - number: '1.5'
        title: 里程碑、伙伴关系加深与反向进展
        blocks:
          - type: paragraph
            body: >-
              即便部分私人公司指标缺失，Ninja Van 的可见里程碑仍然清楚。公司从 2014 年创立故事，走到覆盖六个区域市场，再到 2021 年引入 Alibaba 并加深 GeoPost 伙伴关系的大额 E
              轮融资。到 2024 年，合作伙伴材料谈得更少的是闪电扩张，更多的是自动化、生产率、B2B 补货、冷链和债务能力。这条轨迹说明，一家逐渐成熟的运营商正试图守住效率和服务宽度，而不只是砸钱买份额。


              2025 年新闻流给出本章最清晰的反向信号。Straits Times、Yahoo Finance 和 Business Times 报道称，Ninja Van 正讨论一轮内部 US$80 million
              融资，估值约 US$1 billion，远低于 2021 年私人市场高峰所暗示的调性。几乎同一时期，CNA、AsiaOne 和 Business Times 报道，公司在 2024 年两轮裁员后，又削减新加坡员工
              12%。这些事件没有抹掉公司的区域足迹，但把第一章的基线从纯增长故事，拉回到融资压力下的后期重组。
