      - number: '2.2'
        title: 多重测算视角与保留矛盾
        blocks:
          - type: paragraph
            body: >-
              最宽的需求视角，是东南亚数字经济和由此产生包裹需求的电商订单流。Bain 的 e-Conomy SEA 2024 将区域数字经济 GMV 定为 USD 263 billion，2024 年电商 GMV 为 USD
              159 billion；2025 年报告则称，区域数字经济 GMV 应超过 USD 300 billion，电商 GMV 在 2025 年达到 USD 185 billion。Parcel Perform 的
              2024 年东南亚物流报告给出另一条公开视角，称区域电商市场预计到 2025 年达到 USD 211 billion。这些数字不应被抹平成一个数：它们更适合作为订单流区间，而不是唯一权威 TAM。

              运营物流视角更窄。Mordor 将 ASEAN CEP 市场估为 2025 年 USD 16.68 billion、2026 年 USD 17.85
              billion，这是货币化配送服务池，而不是商品交易总额。J&T 披露的 2025 年东南亚包裹量和市场份额，反推出约 22.3 billion 个包裹的区域市场，这是最接近 Ninja Van
              所处末端战场的公开活动代理指标。相邻服务视角也重要：Mordor 估算东南亚跨境电商 2026 年为 USD 50.37 billion，ASEAN 冷链 2026 年为 USD 19.98
              billion。正确解读是，Ninja Van 参与多个相互连接的市场，但没有任何一个能单独构成干净的公司自上而下收入 TAM。
