      - number: '4.5'
        title: 财务判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 的公开可见度足以跨过一个主要门槛：这不是一家只有理论产品的小众快递商。公司披露了有意义的包裹吞吐量、广泛的东南亚覆盖，以及向 B2B
              补货、履约和冷链转型的可信动作。但收入质量仍难以承销。公开材料没有披露商家数、服务线结构、分国家贡献、实际包裹单票收入、毛利率、CAC
              或回本周期、现金、现金跑道或债务条款。因此，正向逻辑——大网络规模叠加更高利润率相邻业务——仍被同样可见的反向逻辑抵消：FY2023 亏损扩大、裁员、新债务额度，以及 2025 年估值较低的内部轮。

              正确的财务结论应谨慎，而不是看空。公开证据支持中等置信度判断：管理层正在尝试把结构转向更高利润率细分，并用自动化降低单位成本。但它不支持中等置信度判断：转型已经修复收入质量或资产负债表强度。在管理层披露服务线收入结构、实际单票收入、毛利率、现金、烧钱速度和契约数据之前，Ninja
              Van 仍是一个具备真实物流相关性的规模故事，但投资级财务披露不完整。
