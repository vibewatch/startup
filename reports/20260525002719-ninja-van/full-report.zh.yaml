      - number: '7.5'
        title: 缓释项、监控与打破投资逻辑的标准
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 确实有真实缓释项。公司发布配送条款、隐私规则、限制区域清单、诈骗提醒、索赔流程、合规举报渠道， 也围绕 B2B
              补货和冷链形成更聚焦的战略。这些都好过不透明，但大多是反应式控制：它们说明事情出错后如何提交 索赔、报告损坏或识别诈骗。它们没有回答投资核验中最硬的问题：损失率、国家级盈利能力、客户集中度，以及裁撤后服务
              质量和利润率是否改善。因此，投资核验立场应保持负面，直到尽调补上这些缺口。关键打破投资逻辑的触发项公开且可监控： 新加坡再次出现重大裁员或核心国家退出、再次出现偏重优先权的降价轮、旺季配送道歉反复发生、正式隐私或
              消费者欺诈执法事件，或有证据显示 Ninja Van 仍维持高价而可靠性落后同业。如果其中两项或更多同时发生，公司就不再 像物流转型故事，而更像靠投资者暂时耐心融资的区域收缩故事。
