      - number: '6.4'
        title: 留存、耐久性、满意度与负面信号
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据好坏参半。正面看，点名托运客户描述的是反复运营使用，而不是一次性试点；马来西亚包裹增长 曲线和零售点密度暗示复用；Ninja Van 在越南发布了面向持续托运关系的正式投诉和赔偿政策。公司的服务架构
              ——后台集成、履约系统、B2B 补货和更广的 3PL 模块——也比纯即期配送模型提高了切换摩擦。但已审阅公开来源 没有披露 NRR、GRR、流失、续约 cohort、合同期限或前 20
              大客户留存。外部满意度信号也并不干净正面： ComplaintsBoard 显示 1.0/5 档案且有未解决投诉，PissedConsumer 显示 1.4/5，91% 的负面反馈集中在包裹
              遗失、虚假签收和模板化支持。相比之下，SayTrack 只有 3 条评论和 5.0/5 评分，样本太小，无法抵消更大的 负面池。正确读法不是默认留存弱，而是公开耐久性证明仍靠代理指标，服务质量风险仍然重要。
