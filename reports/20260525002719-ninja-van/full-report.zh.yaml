            body: >-
              Ninja Van 的公开信任姿态，运营控制强于第三方背书。公司公开隐私、法律与举报页面、包装规则、禁运品指引、
              托运人索赔说明，以及追踪、账单、COD、揽收和配送问题的多条支持路径。这说明公司已为个人数据、运单异常 和索赔调查写下处理流程。后台指南还给出实用信任信号，比如签收照片、收件人签名、定位记录和搜索筛选，
              让运营争议更容易核查。但成文工作流和经外部验证的可靠性、安全姿态之间，仍有明显缺口。已抓取材料中， 面向后台或 API 的公开状态页、已发布 uptime SLA、SOC 报告、ISO 27001
              证书或事故档案都没有出现。冷链 页面也只描述方法和收益，没有经外部验证的温控偏离指标或合规证明。尽调结论是：Ninja Van 的信任叙事在 流程层面可信，但外部背书层面的材料不足。
