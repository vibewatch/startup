  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              估值乐观逻辑的起点，是这家公司仍有实质战略和运营证明。公开来源和合作伙伴来源继续显示，Ninja Van 在东南亚 6 个市场运营，每天约 2 million 个包裹，据报道客户基础接近 2 million
              家企业，并且正从纯末端包裹走向 Ninja Direct、履约、补货和冷链。GeoPost 的自动化计划和 URC 补货合作都说明，公司试图通过提高生产率、进入 更深嵌入运营的 B2B
              工作流，逃离低倍数快递网络。反向逻辑是，2024 年以来公开记录转负的速度，比多元化故事成熟 更快。据报道 FY2025 收入下滑，亏损只靠成本控制收窄，价格战仍激烈，Shopee 和 Lazada
              拥有自建物流杠杆，越南 退出新闻也显示，传统快递模型并未在所有市场顺利扩张。用估值语言说，投资逻辑不是“好公司，所以高溢价”，而是 “有可选性的有趣资产，但利润率转型仍未证明”。
