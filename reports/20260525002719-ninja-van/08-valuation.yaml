  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: debt-covenants
    missingEvidence: Executed HSBC revolving credit facility documents, including covenant package, collateral, permitted debt baskets, and default triggers.
    whyItMatters: Debt seniority can change common-equity downside dramatically, especially if growth weakens or another round is needed.
    diligencePath: Request the signed facility agreement, side letters, and any amendments from company counsel and lender diligence.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-waterfall
    missingEvidence: Fully diluted cap table and liquidation waterfall covering Series E, employee options, revolver treatment, and the 2025 insider round terms.
    whyItMatters: The current headline valuation could materially overstate the value available to new common-equity investors if preferences or ratchets are heavy.
    diligencePath: Obtain the latest cap table, term sheets, and board-approved waterfall model from finance and legal.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited FY2025 and FY2026-to-date statements with revenue by line, gross margin, EBITDA, operating cash flow, and ending cash.
    whyItMatters: The comp-based range only becomes investable when the committee can tell whether the business is drifting toward a better-margin platform or staying a pressured parcel network.
    diligencePath: Request audited statutory accounts plus management reporting bridge to current trading and board packs.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, renewal behavior, B2B-versus-parcel mix, and country-level revenue quality metrics.
    whyItMatters: Scale deserves a premium only if revenue is durable, diversified, and improving in quality rather than simply large.
    diligencePath: Run a commercial diligence pack with top-account concentration, churn, retention cohorts, and business-line contribution margins.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
