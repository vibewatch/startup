- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Another down-round or highly structured insider raise
    - Headline valuation below ~US$1B or new round with materially stronger preferences
    - Confirms the current mark was not durable or clean.
    - Move from research-more toward avoid at the prior price anchor.
  - - Further revenue decline
    - Another year of negative top-line growth or sharp parcel-volume erosion
    - Undermines the argument that diversification has stabilized the base business.
    - Re-cut the comp bracket toward the bear range.
  - - Covenant or liquidity stress
    - HSBC revolver amendment, security package, or other sign of tightening lender protection
    - Raises seniority risk above equity upside.
    - Pause diligence until debt terms are fully re-underwritten.
  - - B2B / cold-chain pivot disappoints
    - No evidence that B2B or cold chain reaches meaningful mix or margin contribution
    - Leaves Ninja Van trapped in a low-multiple parcel category.
    - Treat Sea-like upside multiple assumptions as invalid.
  - - Customer concentration or retention shock
    - Material churn, renewal weakness, or outsized concentration in a few accounts or platforms
    - Weakens scale quality and exposes margin volatility.
    - Demand a much lower entry or walk away.
  notes: Triggers are framed as monitorable conditions that would invalidate the valuation thesis, not as generic risks.
