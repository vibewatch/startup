- id: comparable-framing-and-scenario-ranges
  title: Comparable framing and bull/base/bear valuation ranges
  body: 'The comp set argues for caution rather than outright rejection. Public regional logistics names sit on modest multiples: Singapore Post is roughly a 0.6x revenue equity, J&T screens below 1x sales on current market-data views, and Pos Malaysia’s share-price behavior reinforces the point that listed logistics equity is not being rewarded as a high-multiple growth category. Sea is the clear upper-bound benchmark, but Sea earns that privilege because it is much larger and visibly more software, marketplace, and fintech weighted than a courier-heavy network. That leaves Ninja Van in a narrow middle lane. If the business is still fundamentally a price-pressured parcel network with incomplete disclosure, fair value is closer to the J&T/SingPost end of the bracket. If automation, B2B restocking, cold chain, and upstream supply-chain services genuinely change the margin profile, a higher multiple is possible—but that is still a conditional future state, not a proven present one. Using the
    reported FY2025 revenue as the anchor, the most defensible range today centers below the US$1 billion headline mark unless one assumes unusually favorable execution or investor protections.'
