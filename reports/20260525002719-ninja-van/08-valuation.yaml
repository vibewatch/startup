company:
  name: Ninja Van
chapter:
  number: 8
  title: Valuation
  summary: Ninja Van’s reported 2025 internal round at roughly US$1 billion is only slightly above what a public-comp-based base case supports once FY2025 revenue pressure, 2024 debt, and preferential insider terms are considered. Automation and B2B/cold-chain diversification preserve upside, but the public record still points to a research-more recommendation, high risk rating, and stretched valuation stance until audited economics and cap-table seniority are disclosed.
sections:
- id: valuation-thesis-versus-antithesis
  title: Valuation thesis versus anti-thesis
  body: The valuation bull case starts with a business that still has meaningful strategic and operating proof. Public and partner sources continue to show a six-market Southeast Asian footprint, roughly two million parcels per day, a reported customer base close to two million businesses, and concrete moves beyond pure last-mile parcel into Ninja Direct, fulfillment, restocking, and cold chain. GeoPost’s automation program and the URC restocking partnership both suggest the company is trying to escape a low-multiple courier box by raising productivity and moving into more operationally embedded B2B workflows. The anti-thesis is that the public record since 2024 has tilted negative faster than the diversification story has matured. Revenue reportedly fell in FY2025, losses only narrowed via cost control, price wars remain intense, Shopee and Lazada have in-house logistics leverage, and Vietnam exit news shows the legacy express model is not scaling cleanly across every market. In valuation
    terms, that means the thesis is not “great company, therefore premium price,” but rather “interesting asset with optionality, facing a still-unproven margin transition.”
