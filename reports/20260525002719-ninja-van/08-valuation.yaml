- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Do not underwrite the current ~US$1B headline mark as a buy without targeted diligence.
  - - Confidence
    - medium
    - The downside drivers are visible, but cap-table and margin opacity cap precision.
  - - Risk rating
    - high
    - Revenue shrink, price wars, debt, and structured insider terms create downside asymmetry.
  - - Valuation stance
    - stretched
    - Current mark sits above the public-comp base midpoint and near low-bull territory.
  - - Clean price support
    - Base EV roughly US$560M-US$910M
    - A clean common-equity entry needs either a lower price or better evidence.
  - - Upgrade trigger
    - Clean entry below ~US$750M or audited proof of resilient margins/growth
    - Could move the call toward track or buy.
  notes: Recommendation is explicitly price-sensitive and assumes the 2025 round headline does not equal clean common-equity economics.
