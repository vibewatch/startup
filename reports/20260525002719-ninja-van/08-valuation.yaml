- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: regional scale plus ~2M parcels/day can support a premium to legacy postal comps.'
    - Sustained evidence of renewed growth and margin stability would strengthen the premium case.
  - - 'Thesis: B2B restocking, upstream services, and cold chain can improve mix beyond commodity parcel delivery.'
    - Disclosure showing material B2B/cold-chain revenue and better unit economics would matter most.
  - - 'Thesis: US$50M automation capex across nine hubs can convert scale into structurally lower cost-to-serve.'
    - Measured productivity gains reaching reported targets without service deterioration would strengthen the thesis.
  - - 'Anti-thesis: FY2025 revenue shrink and price wars imply the base business remains structurally exposed.'
    - A return to durable growth despite Shopee/Lazada/J&T competition would weaken the anti-thesis.
  - - 'Anti-thesis: Vietnam exit and layoffs imply parts of the historic expansion playbook failed economically.'
    - Evidence that the retrenchment was one-off and improved consolidated economics would help.
  - - 'Anti-thesis: debt plus preferential insider terms make the ~US$1B headline mark look richer than clean common equity.'
    - A plain-vanilla round or audited waterfall showing limited preference overhang would materially improve the view.
  notes: Each row translates prior operating evidence into a valuation consequence rather than a generic quality judgment.
