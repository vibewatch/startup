company:
  name: "Alumis Inc."
chapter:
  number: 7
  title: "Risks"
  summary: "Alumis faces critical binary regulatory risks centered on its planned Q4 2026 NDA submission for envudeucitinib in plaque psoriasis, alongside emerging commercial threats from once-daily oral therapies. While $502.3 million in balance sheet cash supports operations into Q4 2027, execution challenges in systemic lupus erythematosus, CMC manufacturing scale-up, and substantial accumulated operating losses represent material investment vulnerabilities."
sections:
  - id: "regulatory-clinical-approval-exposure"
    title: "Regulatory and Clinical Approval Exposure"
    body: "Alumis operates as a clinical-stage biopharmaceutical enterprise whose corporate valuation is overwhelmingly concentrated in the regulatory and clinical success of its lead oral TYK2 inhibitor, envudeucitinib. The company plans to submit its New Drug Application (NDA) for moderate-to-severe plaque psoriasis to the FDA in the fourth quarter of 2026, supported by 48-week Phase 3 ONWARD extension data demonstrating a 54% complete skin clearance (PASI 100) response rate. However, statutory drug evaluation by the FDA remains inherently unpredictable and carries substantial risks of review delays, requirements for supplementary safety analyses, or potential Complete Response Letters (CRLs). Furthermore, pipeline expansion into systemic lupus erythematosus via the ongoing Phase 2b LUMUS trial exposes Alumis to elevated developmental failure risks, as historically observed when the company was forced to terminate its Phase 2a non-infectious uveitis trial due to insufficient interim efficacy."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR001"
  - id: "operational-cmc-trial-execution"
    title: "Operational, CMC, and Clinical Trial Execution Risks"
    body: "Operational execution within late-stage clinical biopharma requires flawless synchronization between chemistry, manufacturing, and controls (CMC) validation and international clinical trial management. Alumis maintains no internal commercial-scale manufacturing facilities and depends entirely on third-party contract manufacturers for drug substance synthesis, formulation, and commercial packaging. Any facility inspection deficiency under FDA current Good Manufacturing Practices (cGMP) or batch contamination could halt clinical distribution or postpone commercial launch. Simultaneously, Alumis relies upon external contract research organizations (CROs) to supervise multi-center trials; protocol deviations, regulatory non-compliance, or heightened participant attrition during extended open-label extensions threaten trial data integrity and regulatory acceptance."
    claimRefs:
      - "CR006"
      - "CR008"
    tableRefs:
      - "TR002"
  - id: "commercial-partner-dependencies"
    title: "Commercial Counterparty, Partner, and Competitive Dependencies"
    body: "Beyond regulatory hurdles, Alumis faces intense competitive and commercialization friction from entrenched and next-generation therapeutics. While Bristol Myers Squibb's Sotyktu established commercial validation for allosteric TYK2 inhibition, newer competitors threaten envudeucitinib's prospective market differentiation. Specifically, Johnson & Johnson's once-daily oral pill Icotyde offers patients a more convenient dosing regimen relative to envudeucitinib's twice-daily schedule, with Wall Street analysts forecasting potential blockbuster adoption. Additionally, Takeda's investigational zasocitinib presents competitive efficacy data in plaque psoriasis that could compress Alumis' pricing power and market share. On the partnership front, Alumis relies on Kaken Pharmaceutical for territorial development and licensing cash flows, making dispute avoidance and collaborative execution critical to sustaining external non-dilutive revenues."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR008"
      - "CR009"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "financial-runway-capital-governance"
    title: "Financial Runway, Capital Intensity, and Risk Governance"
    body: "Alumis exhibits high capital intensity and substantial accumulated operating losses, recording an accumulated deficit of $901.9 million as of year-end 2025 and a net loss of $142.2 million in the second quarter of 2026. While an upsized follow-on public offering generating $345.1 million in gross proceeds bolstered total liquidity to $502.3 million as of June 30, 2026, management estimates this capital will fund operations only into the fourth quarter of 2027. Pipeline restructuring has already triggered tangible write-downs, including a $41.8 million impairment loss on acquired IPR&D assets following the abandonment of lonigutamab. To prevent thesis breaks, risk governance requires strict monitoring of trial readouts, cash burn velocity, and commercial payer contracting."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    figureRefs:
      - "FR001"
