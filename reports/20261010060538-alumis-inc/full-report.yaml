  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Clinical-Stage Pipeline Architecture and Asset Portfolio
        blocks:
          - type: paragraph
            body: >-
              Alumis focuses on developing precision-engineered oral therapies for immune-mediated diseases, anchored by
              its two proprietary allosteric Tyrosine Kinase 2 (TYK2) inhibitors: lead candidate envudeucitinib
              (formerly ESK-001) and central nervous system (CNS) penetrant molecule A-005. Envudeucitinib is designed
              to maximize 24-hour target inhibition while maintaining favorable tolerability without broad
              immunosuppression. Beyond plaque psoriasis and systemic lupus erythematosus, Alumis is evaluating
              additional indications for envudeucitinib in Sjogren's disease and cutaneous lupus erythematosus, while
              progressing A-005 toward a Phase 2 trial in Parkinson's disease. The company further diversified its
              clinical pipeline through the acquisition of lonigutamab, a subcutaneously delivered anti-IGF-1R
              monoclonal antibody for thyroid eye disease, establishing a multi-asset autoimmune franchise.
