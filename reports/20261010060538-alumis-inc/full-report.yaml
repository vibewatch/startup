      - number: '4.3'
        title: Capital Adequacy and Forward Financing Runway
        blocks:
          - type: paragraph
            body: >-
              As of March 31, 2026, Alumis held $569.5 million in total cash, cash equivalents, and marketable
              securities, providing substantial liquidity to finance ongoing clinical operations. This capital position
              was bolstered by an upsized underwritten follow-on public offering completed in January 2026, which issued
              20,297,500 common shares at $17.00 per share to raise $345.1 million in gross proceeds ($323.8 million in
              net proceeds). Based on its current operating plan, management projects that existing cash reserves will
              be sufficient to meet operating and capital requirements for at least 12 months from May 2026. This
              liquidity runway extends across major upcoming clinical catalysts, including the planned Q4 2026 NDA
              submission for plaque psoriasis, but leaves limited cushion for protracted commercial scale-up without
              supplementary financing.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting Verdict and Financial Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Alumis presents a capitalized late-stage development
              profile tempered by near-term revenue contraction and binary clinical dependence. The stock underperformed
              the broader US equity market over the past year, returning 1.88% against a 14.9% market advance,
              reflecting investor caution regarding cash burn and execution hurdles. While existing liquidity secures
              development through 2027, long-term solvency requires substantial commercial cash flow. The primary
              financial diligence blockers center on undisclosed commercial supply agreements, wholesale acquisition
              costs versus realized net pricing waterfalls, and the capital expenditure required to establish an
              independent US commercial field force ahead of potential FDA approval.
            claimRefs:
              - CI009
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Depletion Velocity and Commercial Binary Risk
            body: >-
              Alumis enters the second half of 2026 with a substantial $569.5 million liquid capital reserve, but its
              quarterly operating cash burn of $87.1 million underscores an annualized burn rate exceeding $348 million.
              Because commercial drug revenues remain entirely contingent upon FDA approval following the planned Q4
              2026 NDA submission, any regulatory delays, clinical extension requirements, or adverse PBM formulary
              positioning would rapidly compress forward runway and necessitate further dilutive equity financing.
            calloutType: risk
            claimRefs:
