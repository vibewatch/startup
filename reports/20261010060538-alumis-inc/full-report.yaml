      - number: '1.3'
        title: Capitalization, Balance Sheet Liquidity, and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              Alumis has raised substantial private and public capital to fund the advancement of its clinical pipeline.
              Prior to its initial public offering, Alumis secured a $259 million Series C venture financing round in
              March 2024 co-led by Foresite Capital, Samsara BioCapital, and venBio Partners. In 2025, the company
              completed an upsized follow-on public offering of 20,297,500 shares of common stock at $17.00 per share,
              generating gross proceeds of $345.1 million with Baird serving as lead manager. As of March 31, 2026,
              Alumis held $569.5 million in cash, cash equivalents, and marketable securities, providing an operating
              runway projected into the fourth quarter of 2027. The company's ownership structure is anchored by
              specialized life sciences institutional investors, including AyurMaya Capital Management Fund (affiliated
              with Matrix Capital Management), investment entities affiliated with Foresite Capital Management, and
              Samsara BioCapital, alongside healthcare specialist funds like Baker Brothers Life Sciences.
