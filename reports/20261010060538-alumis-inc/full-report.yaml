              - CU002
              - CU003
              - CU013
      - number: '6.2'
        title: Clinical Adoption Trajectory & Patient Exposure
        blocks:
          - type: paragraph
            body: >-
              Because envudeucitinib remains investigational prior to regulatory approval, adoption trajectory is
              strictly measurable through clinical trial enrollment, protocol completion, and patient retention across
              multicenter studies. In pivotal Phase 3 trials Onward1 and Onward2, envudeucitinib demonstrated
              statistically significant skin clearance, with nearly 60% of patients achieving clear or almost clear skin
              and 74% exhibiting major clinical improvement by Week 16. In the ongoing ONWARD3 long-term extension
              study, 773 patients received continuous oral envudeucitinib treatment through up to 48 weeks,
              demonstrating 75% PASI 90 response and 54% complete skin clearance (PASI 100). This 48-week retention and
              high rate of complete clearance position envudeucitinib favorably against approved oral standards,
              providing preliminary clinical evidence of patient persistence before commercial refill adherence and
              real-world compliance can be evaluated.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
