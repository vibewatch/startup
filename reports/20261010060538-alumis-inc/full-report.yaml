      - number: '4.2'
        title: Operating Cost Structure and R&D Cash Burn
        blocks:
          - type: paragraph
            body: >-
              Operating expenses reflect the capital-intensive nature of late-stage global autoimmune clinical trials.
              Research and development expenses reached $81.54 million in the first quarter of 2026, comprising 81.4% of
              total operating expenditures, driven by ongoing Phase 3 ONWARD trials in plaque psoriasis and the Phase 2b
              LUMUS trial in systemic lupus erythematosus. Net cash used in operating activities stood at $87.08 million
