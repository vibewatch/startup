  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Target Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              As a clinical-stage biopharmaceutical company advancing oral TYK2 inhibitors, Alumis operates without a
              commercial sales organization or product distribution network, generating zero commercial product revenue.
              Commercial adoption of its lead drug candidate envudeucitinib requires segmenting three distinct customer
              constituencies: prescribing dermatologists, moderate-to-severe plaque psoriasis patients, and
              institutional third-party payors including commercial insurers and pharmacy benefit managers. While
              patients prioritize oral convenience and sustained skin clearance over injectable biologics, prescribing
              dermatologists act as the clinical gatekeepers evaluating therapeutic efficacy benchmarks. Institutional
              payors ultimately determine commercial uptake through formulary placement, tiering decisions, and
              restrictive prior authorization protocols. Alumis plans stage-appropriate commercialization infrastructure
              in the United States while evaluating regional partnership arrangements across European and Asia-Pacific
              markets to optimize worldwide commercial access.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
