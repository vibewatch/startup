              Although quarterly net loss narrowed slightly to $93.05 million from $98.96 million in the prior-year
              period, persistent quarterly operating cash outflows above $87 million create continuous financial
              exposure, underscoring the necessity of strict cost discipline and strategic pipeline milestone execution.
            claimRefs:
