      - number: '1.4'
        title: Clinical Pipeline Progress, Regulatory Roadmap, and Risk Profile
        blocks:
          - type: paragraph
            body: >-
              The core clinical asset of Alumis is envudeucitinib (formerly ESK-001), a next-generation oral allosteric
              tyrosine kinase 2 (TYK2) inhibitor precision-engineered for maximal 24-hour target inhibition. In its
              pivotal Phase 3 ONWARD1 and ONWARD2 trials in moderate-to-severe plaque psoriasis, envudeucitinib met
              primary endpoints, demonstrating Week 24 PASI 90 response rates of 68.0% and 62.1%, and PASI 100 response
              rates of 41.0% and 39.5%. In the long-term extension trial ONWARD3, 75% of patients reached PASI 90 and
              54% reached complete skin clearance (PASI 100) at 48 weeks, representing the highest reported oral
              clearance rate in published psoriasis trials. Alumis remains on schedule to submit an NDA to the U.S. FDA
              in the fourth quarter of 2026. Beyond psoriasis, envudeucitinib is being evaluated in systemic lupus
              erythematosus (SLE) in the Phase 2b LUMUS trial, while a central nervous system penetrant TYK2 inhibitor,
              A-005, is progressing toward Phase 2 trials in Parkinson's disease. On the adverse front, Alumis faces
              ongoing class action litigation stemming from its merger with ACELYRIN regarding historical trial
              disclosures, as well as binary clinical and regulatory approval risks.
            claimRefs:
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
