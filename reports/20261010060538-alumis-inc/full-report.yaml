              - CR014
      - number: '7.4'
        title: Financial Runway, Capital Intensity, and Risk Governance
        blocks:
          - type: paragraph
            body: >-
              Alumis exhibits high capital intensity and substantial accumulated operating losses, recording an
              accumulated deficit of $901.9 million as of year-end 2025 and a net loss of $142.2 million in the second
              quarter of 2026. While an upsized follow-on public offering generating $345.1 million in gross proceeds
              bolstered total liquidity to $502.3 million as of June 30, 2026, management estimates this capital will
              fund operations only into the fourth quarter of 2027. Pipeline restructuring has already triggered
              tangible write-downs, including a $41.8 million impairment loss on acquired IPR&D assets following the
              abandonment of lonigutamab. To prevent thesis breaks, risk governance requires strict monitoring of trial
              readouts, cash burn velocity, and commercial payer contracting.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
