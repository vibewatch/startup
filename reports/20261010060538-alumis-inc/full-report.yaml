              - CE001
              - CE005
              - CE009
              - CE010
      - number: '5.4'
        title: Intellectual Property Fortress, Regulatory Roadmap, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The proprietary foundation of Alumis rests on its intellectual property portfolio and clinical trial
              execution. Alumis holds solely owned composition-of-matter and method-of-use patent families covering
              envudeucitinib and A-005 with statutory expirations projected to 2039, complemented by pending PCT and
              foreign applications extending protections to 2045. On the regulatory horizon, Alumis remains on schedule
              to submit its New Drug Application (NDA) for envudeucitinib in plaque psoriasis to the FDA in the fourth
              quarter of 2026. Financial runway to execute these milestones was bolstered by an upsized $345.1 million
              follow-on offering in 2026. Nonetheless, critical diligence questions persist regarding pre-NDA readiness:
              Alumis has not yet disclosed public confirmation of chemistry, manufacturing, and controls (CMC)
              validation batch readiness, formal agreement on pediatric study waivers, or final commercial packaging
              specifications required for immediate post-approval distribution.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High-Threshold Skin Clearance and Selectivity Profile
            body: >-
              Envudeucitinib's 54% PASI 100 complete skin clearance at Week 48 represents an unprecedented benchmark
              among oral psoriasis therapies. By allosterically targeting the TYK2 JH2 domain, Alumis avoids the
              black-box hematologic and cardiovascular toxicities associated with broader catalytic JAK inhibitors,
              establishing a potent clinical profile with low rash rates.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE011
          - type: callout
            title: Manufacturing Reliance on Single-Source CDMOs
            body: >-
              Alumis maintains no internal production facilities and procures active pharmaceutical ingredients and raw
              materials from third-party manufacturers in India and Taiwan on a purchase-order basis. While redundant
              suppliers are being qualified, any disruption prior to commercial launch could delay commercial inventory
              build.
            calloutType: risk
            claimRefs:
