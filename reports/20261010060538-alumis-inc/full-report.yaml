      - number: '5.2'
        title: Biochemical Mechanism of Action and Clinical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Envudeucitinib achieves biological differentiation through allosteric inhibition of the TYK2 regulatory
              pseudokinase (JH2) domain, rather than competing at the highly conserved ATP-binding catalytic site
              utilized by traditional Janus kinase (JAK) inhibitors. This mechanism provides intrinsic selectivity over
              JAK1, JAK2, and JAK3, preventing downstream hematological and cardiovascular toxicities that carry FDA
              black-box warnings for non-selective JAK inhibitors. In the pivotal Phase 3 ONWARD clinical program,
              envudeucitinib achieved a 54% PASI 100 complete skin clearance rate at Week 48 alongside 75% PASI 90
              clearance, setting a high efficacy benchmark among oral psoriasis therapies. Furthermore, clinical trials
              demonstrated over 80% scalp clearance and rapid itch resolution with low incidence of drug-related skin
              rash, demonstrating that cutaneous adverse events are not an unavoidable class effect of sustained TYK2
              pathway shutdown.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE011
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
      - number: '5.3'
        title: Operating Architecture, Chemical Synthesis, and Supply Chain Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Alumis maintains an asset-centric operating architecture that leverages its proprietary precision data
              analytics platform for target validation and clinical biomarker selection while outsourcing physical
              manufacturing entirely to third parties. Envudeucitinib and A-005 are small molecule chemical compounds
              synthesized from standard starting materials via reproducible chemical processes. However, the company
              operates without internal production facilities, purchasing active pharmaceutical ingredients (API) and
              bulk drug product on a purchase-order basis from dedicated contract development and manufacturing
              organizations (CDMOs). Key raw materials and chemical intermediates originate from single-source suppliers
              located in India and Taiwan. While Alumis is actively qualifying redundant suppliers ahead of
              commercialization, the absence of binding long-term commercial supply agreements creates exposure to
              international trade policy shifts, shipping bottlenecks, and facility cGMP inspection delays.
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE003
