      - number: '2.3'
        title: Buyer, Prescriber, and Payer Adoption Mechanics
        blocks:
          - type: paragraph
            body: >-
              Commercial conversion in targeted autoimmune indications is governed by a tripartite stakeholder
              relationship spanning prescribers, patients, and pharmacy benefit managers. In moderate-to-severe plaque
              psoriasis, high-volume dermatologists serve as the primary clinical decision-makers, balancing efficacy
              endpoints against adverse event monitoring. In systemic lupus erythematosus, specialized rheumatologists
              dictate adoption based on organ preservation and reduction in corticosteroid dependence. However, the
              ultimate economic gatekeeper remains third-party commercial payers and pharmacy benefit managers. U.S.
              commercial reimbursement requires navigating formulary tiering, prior authorization protocols, and
              mandatory step edits through generic disease-modifying antirheumatic drugs or older oral options before
              access to novel branded specialty therapies is granted. Furthermore, federal health policy mechanisms
              including Medicare inflation rebates enforce persistent downward pricing discipline across the branded
              specialty immunology sector.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM009
      - number: '2.4'
        title: Commercial Drivers, Adoption Bottlenecks, and Critical Gaps
        blocks:
          - type: paragraph
            body: >-
              The principal growth driver for envudeucitinib is patient and physician preference for a highly effective,
              once-daily oral pill that avoids the logistical friction, injection-site pain, and cold-chain storage of
              subcutaneous biologics. Conversely, commercial adoption faces three critical constraints: incumbent
              commercial resistance from Bristol Myers Squibb's first-generation TYK2 inhibitor Sotyktu
              (deucravacitinib), threat of next-generation oral IL-23 peptides entering late-stage development, and
              unconfirmed commercial payer net pricing. Alumis plans to submit its New Drug Application to the FDA in
              the fourth quarter of 2026, yet key commercial diligence gaps remain unresolved. Crucially, Alumis has not
              publicly disclosed its expected gross-to-net discount strategy, formulary co-pay assistance structure, or
              specific step-therapy positioning relative to Sotyktu, leaving final commercial net revenue realization
              contingent on post-approval payer contract execution.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Efficacy Hurdle Shift in Oral Dermatology
            body: >-
              The commercial ceiling for oral psoriasis drugs is expanding from historical modest-clearance benchmarks
              toward biologic-like PASI 90 and PASI 100 outcomes, making sustained skin clearance the decisive adoption
              trigger for prescribers.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: Payer Step-Edits and Formularies Form the Core Commercial Bottleneck
            body: >-
              Even with best-in-class Phase 3 efficacy, commercial success hinges on PBM formulary positioning; absent
              favorable tier placement and parity access against established oral and biosimilar therapies, prescription
              fulfillment faces steep drop-off.
            calloutType: risk
            claimRefs:
              - CM006
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Emerging Modalities'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape confronting Alumis Inc. spans direct mechanism-level peers developing oral
              tyrosine kinase 2 (TYK2) inhibitors, entrenched multi-billion-dollar injectable biologic franchises, and
              established first-generation oral small molecules. At the mechanism level, Bristol Myers Squibb's Sotyktu
              (deucravacitinib) represents the commercial benchmark as the first FDA-approved oral TYK2 inhibitor, while
              Takeda is advancing zasocitinib (TAK-279, acquired from Nimbus Therapeutics) through Phase 3 clinical
              development. Beyond direct TYK2 competitors, the plaque psoriasis market is heavily dominated by
              entrenched injectable biologics, led by AbbVie's Skyrizi (risankizumab), Johnson & Johnson's Tremfya
              (guselkumab), Eli Lilly's Taltz (ixekizumab), and UCB's Bimzelx (bimekizumab). These commercial incumbents
              possess extensive prescribing relationships across dermatology networks and long-standing payer contracts.
              In the oral segment, Amgen's Otezla (apremilast), an oral phosphodiesterase-4 (PDE4) inhibitor, remains
              the entrenched systemic market benchmark prior to biologic escalation, despite delivering modest
              high-hurdle skin clearance.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Clinical Differentiation, Target Inhibition, and High-Hurdle Skin Clearance
        blocks:
          - type: paragraph
            body: >-
              Clinical differentiation in plaque psoriasis has shifted decisively from modest PASI 75 responses to
              high-hurdle endpoints, specifically PASI 90 and complete PASI 100 clearance. In pivotal Phase 3 ONWARD1
              and ONWARD2 trials, envudeucitinib met all primary and secondary endpoints with statistical significance,
              demonstrating superior clearance over active oral comparator apremilast (p<0.0001) at Week 24. On average
              across both trials, envudeucitinib achieved 74% PASI 75 and 59% sPGA 0/1 at Week 16, deepening to
              approximately 65% PASI 90 and over 40% PASI 100 at Week 24. Furthermore, in the ONWARD3 long-term
              extension study, 75% of patients attained PASI 90 and 54% attained complete skin clearance (PASI 100)
              after 48 weeks of continuous treatment, setting the highest reported oral clearance rate in published
              psoriasis trials. Mechanistically, allosteric TYK2 inhibition avoids ATP-binding active-site kinase
              homology, achieving maximal 24-hour target suppression without triggering classic Janus kinase (JAK)
              toxicities, whereas Sotyktu's label retains warnings regarding potential JAK-related cardiovascular and
              thrombotic events.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP007
      - number: '3.3'
        title: Pricing Models, Formulary Access, and Commercial Channel Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercializing an oral therapy in dermatology requires navigating aggressive pharmacy benefit manager
              (PBM) formulary tier structures, mandatory step-therapy protocols, and substantial gross-to-net rebate
              concessions. Marketed oral comparators establish the pricing environment: BMS lists Sotyktu at
              approximately $75,000 annually, while Amgen lists Otezla near $48,000 per year, with both manufacturers
              conceding estimated 40% to 55% rebates to secure preferred commercial formulary positioning. Injectable
              biologics such as Skyrizi command premium pricing near $79,000 annually and benefit from multi-indication
              portfolio contracting across AbbVie's immunology franchise. As a clinical-stage biopharmaceutical company
              without commercial revenue or established field sales infrastructure, Alumis must either build a dedicated
              U.S. commercial organization or execute co-promotion partnerships to secure formulary placement. Without
              aggressive rebate parity or clear specialist demand driven by superior PASI 100 clearance, envudeucitinib
              risks being relegated to second-line oral status behind genericized topicals and established oral systemic
              agents.
            claimRefs:
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP014
      - number: '3.4'
        title: Moat Durability, Intellectual Property, and Adverse Strategic Risks
        blocks:
          - type: paragraph
            body: >-
              While envudeucitinib possesses composition-of-matter patent protection and potential patent term
              restoration under the Hatch-Waxman Amendments, long-term commercial defensibility remains exposed to
              emerging therapeutic modalities and operational vulnerabilities. Emerging oral candidates, such as Johnson
              & Johnson's oral IL-23 receptor peptide (icotrokinra / JNJ-2113), have demonstrated encouraging Phase 2
              efficacy and could challenge oral TYK2 adoption if Phase 3 data confirm biologic-like clearance.
              Operationally, Alumis relies exclusively on single-source contract manufacturing organizations in India
              and Taiwan for active pharmaceutical ingredients, creating supply chain single-point dependencies ahead of
              commercial scale-up. Financially, independent equity analysis highlights that Alumis generated an
              operating loss of $417 million over the trailing twelve months and missed Q2 2026 earnings estimates with
              an EPS of -$1.11 versus -$0.77 expected. In addition, integration overhang and class action litigation
              related to the ACELYRIN acquisition create ongoing corporate headwinds as the company approaches its
              planned Q4 2026 New Drug Application submission.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical Efficacy Differentiation Over Oral Benchmarks
            body: >-
              Envudeucitinib demonstrated Phase 3 Week 24 PASI 90 clearance of ~65% and 48-week ONWARD3 PASI 100
              clearance of 54%, establishing statistically significant superiority over apremilast (p<0.0001) and
              outperforming the historical 27-36% PASI 90 benchmark of deucravacitinib.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP005
          - type: callout
            title: Formulary Step-Therapy and Commercial Incumbent Dominance
            body: >-
              As a pre-commercial entrant without existing commercial infrastructure or payer rebate contracts, Alumis
              faces entrenched competition from AbbVie, J&J, and BMS, whose heavy formulary discounting and established
              specialist relationships threaten commercial adoption despite clinical differentiation.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Collaboration Accounting
        blocks:
          - type: paragraph
            body: >-
              Alumis is a clinical-stage biopharmaceutical company that has generated zero commercial product revenue
              since inception. Recognized revenue is derived entirely from its March 2025 collaboration and license
              agreement with Kaken Pharmaceutical for the development and commercialization of envudeucitinib in Japan.
              In the first quarter of 2026, Alumis recognized $1.74 million in collaboration revenue under the
              Development Services Obligation, compared to $17.39 million in total revenue in the prior-year period when
              the initial upfront license obligation was satisfied. The company's future revenue potential is
              fundamentally gated by regulatory approval and commercial transition. Transforming clinical validation
              into recurring pharmaceutical sales requires negotiating commercial formulary placement, securing
              favorable PBM reimbursement tiers, and establishing effective distribution networks across target
              autoimmune indications.
