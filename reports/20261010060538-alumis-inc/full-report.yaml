      - number: '6.4'
        title: Commercial Journey, Formulary Access & Concentration Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial durability and market expansion for envudeucitinib face substantial payer friction and
              competitive barriers common to oral autoimmune therapies. Third-party payors increasingly impose stringent
              prior authorizations and mandatory step-therapy protocols requiring patients to fail cheaper generic or
              biosimilar agents before accessing branded oral therapies. Furthermore, commercial launch dynamics will
              compete directly against Bristol Myers Squibb's first-in-class oral TYK2 inhibitor Sotyktu, where
              commercial uptake illustrates significant physician detailing requirements and payer rebate discounting.
              Corporate transaction risk also surfaced when activist investor Trium Capital opposed Acelyrin's proposed
              merger with Alumis, arguing that Alumis's offer carried high clinical risk relative to cash liquidation.
              Meanwhile, peer comparisons with oncology biotech Celcuity highlight Alumis's -5,933.46% net margin,
              reflecting substantial pre-revenue operating losses required to advance late-stage clinical programs
              toward commercial launch.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
