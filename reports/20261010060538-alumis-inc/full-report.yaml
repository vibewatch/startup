      - number: '6.3'
        title: Named Cohort Proof & Investigational Trial Evidence
        blocks:
          - type: paragraph
            body: >-
              Named customer proof in pre-commercial biotechnology centers on formal clinical cohorts, investigational
              clinical sites, and prospective regulatory milestones rather than commercial enterprise purchasing
              agreements. Alumis's clinical proof rests on the randomized double-blind cohorts of Onward1 and Onward2,
              alongside the 773-patient ONWARD3 long-term extension evaluating durability across dermatology clinical
              centers. Supporting pipeline expansion beyond plaque psoriasis, the Phase 2b LUMUS study evaluates oral
              envudeucitinib in systemic lupus erythematosus, with topline clinical data anticipated in the third
              quarter of 2026. Alumis fortified its balance sheet with an upsized $345.1 million follow-on offering in
              2026, securing financial runway to complete these clinical evaluations and prepare its planned New Drug
              Application submission to the FDA in the second half of 2026 without immediate commercial financing
              constraints.
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
