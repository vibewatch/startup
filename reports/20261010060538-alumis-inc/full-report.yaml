        title: Exhibits
        blocks:
          - type: callout
            title: Pre-Commercial Formulary Barrier & Single-Asset Dependency
            body: >-
              Alumis currently has no approved commercial products, zero commercial revenue, and no commercial sales
              organization, leaving commercial adoption entirely dependent on post-approval PBM formulary negotiations
              and step-edit policies against incumbent oral TYK2 deucravacitinib.
            calloutType: risk
