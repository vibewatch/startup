chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Core Platform
        blocks:
          - type: paragraph
            body: >-
              Alumis Inc. is a clinical-stage biopharmaceutical company focused on identifying, acquiring, and
              accelerating the development of transformative targeted medicines for autoimmune disorders. The company
              was incubated by Foresite Labs and originally incorporated in Delaware on January 29, 2021, under the
              legal name FL2021-001, Inc. It subsequently changed its corporate name to Esker Therapeutics, Inc. in
              March 2021 before rebranding to Alumis Inc. in January 2022. Operating from its principal executive
              offices in South San Francisco, California, Alumis applies a proprietary precision data analytics platform
              and immunology expertise to replace broad immunosuppressive treatments with highly selective allosteric
              oral therapies. The company completed its initial public offering on the Nasdaq Global Select Market under
              ticker symbol ALMS in June 2024, followed by an upsized underwritten follow-on offering in 2025. Alumis
              previously acquired lonigutamab via a strategic merger with ACELYRIN, Inc., though management subsequently
              initiated a strategic review to explore alternatives for that asset in order to concentrate resources on
              its core oral TYK2 programs.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
