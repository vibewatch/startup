      - number: '7.2'
        title: Operational, CMC, and Clinical Trial Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Operational execution within late-stage clinical biopharma requires flawless synchronization between
              chemistry, manufacturing, and controls (CMC) validation and international clinical trial management.
              Alumis maintains no internal commercial-scale manufacturing facilities and depends entirely on third-party
              contract manufacturers for drug substance synthesis, formulation, and commercial packaging. Any facility
              inspection deficiency under FDA current Good Manufacturing Practices (cGMP) or batch contamination could
              halt clinical distribution or postpone commercial launch. Simultaneously, Alumis relies upon external
              contract research organizations (CROs) to supervise multi-center trials; protocol deviations, regulatory
              non-compliance, or heightened participant attrition during extended open-label extensions threaten trial
              data integrity and regulatory acceptance.
            claimRefs:
              - CR006
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR008
      - number: '7.3'
        title: Commercial Counterparty, Partner, and Competitive Dependencies
        blocks:
          - type: paragraph
            body: >-
              Beyond regulatory hurdles, Alumis faces intense competitive and commercialization friction from entrenched
              and next-generation therapeutics. While Bristol Myers Squibb's Sotyktu established commercial validation
              for allosteric TYK2 inhibition, newer competitors threaten envudeucitinib's prospective market
              differentiation. Specifically, Johnson & Johnson's once-daily oral pill Icotyde offers patients a more
              convenient dosing regimen relative to envudeucitinib's twice-daily schedule, with Wall Street analysts
              forecasting potential blockbuster adoption. Additionally, Takeda's investigational zasocitinib presents
              competitive efficacy data in plaque psoriasis that could compress Alumis' pricing power and market share.
              On the partnership front, Alumis relies on Kaken Pharmaceutical for territorial development and licensing
              cash flows, making dispute avoidance and collaborative execution critical to sustaining external
              non-dilutive revenues.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR014
          - type: table
