        title: Executive Leadership, Governance Structure, and Human Capital
        blocks:
          - type: paragraph
            body: >-
              Alumis is led by President, Chief Executive Officer, and Chairman of the Board Martin Babler, who brings
              extensive executive leadership experience in commercializing and advancing clinical-stage
              biopharmaceutical assets. The senior management team includes Chief Scientific Officer David M. Goldstein,
              Ph.D., Chief Medical Officer Jörn Drappa, M.D., Ph.D., Chief Development Officer Mark Bradley, Chief
              Business and Strategy Officer Roy Hardiman, Chief Financial Officer John Schroer, and General Counsel
              Sanam Pangali. The company's corporate governance is overseen by a seven-member Board of Directors, with
              six independent members including Dr. James B. Tananbaum, founder and CEO of Foresite Capital, Dr.
              Srinivas Akkaraju of Samsara BioCapital, and Dr. Alan Colowick representing Matrix Capital Management. As
              of December 31, 2025, Alumis employed 221 full-time employees and 3 part-time employees spanning clinical
              development, regulatory affairs, research, and corporate functions. Key-person dependence is concentrated
              in executive scientific and clinical leadership, particularly around ongoing Phase 3 trials and New Drug
              Application (NDA) filing preparations.
