  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Therapeutic Scope and Boundary Definitions
        blocks:
          - type: paragraph
            body: >-
              The core commercial opportunity for Alumis Inc. centers on precision oral therapies for immune-mediated
              inflammatory diseases, with an initial clinical focus on moderate-to-severe plaque psoriasis and systemic
              lupus erythematosus. Within plaque psoriasis, the relevant market boundary encompasses patients qualifying
              for systemic therapy, specifically those with extensive disease involvement who are candidates for oral
              small molecules or biologic injectables. Excluded from this addressable spend are mild psoriasis cases
              managed adequately with topical corticosteroids, generic keratolytic agents, or localized phototherapy.
              Secondary boundary expansions include systemic lupus erythematosus, a severe systemic autoimmune disorder
              with limited approved targeted options, and prioritized pipeline adjacencies in Sjögren's disease and
              cutaneous lupus erythematosus. Long-term optionality extends to central nervous system neuroinflammatory
              disorders through investigational candidate A-005, though commercial boundaries for neurodegenerative
              indications remain exploratory.
            claimRefs:
              - CM001
              - CM005
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM013
              - CM014
      - number: '2.2'
        title: Market Sizing Lenses and Patient Stratification
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial potential of envudeucitinib requires decomposing aggregate disease expenditures
              into realistic adoption lenses. While total global psoriasis therapeutic spend represents a
              multi-billion-dollar category, the contested space for oral TYK2 inhibitors is constrained by entrenched
              biologic therapies, including IL-23, IL-17, and TNF-alpha inhibitors that dominate severe maintenance
              treatment. In Phase 3 ONWARD1 and ONWARD2 trials, envudeucitinib demonstrated an average of 74% PASI 75
              and 59% sPGA 0/1 at Week 16, deepening to approximately 65% PASI 90 and over 40% PASI 100 at Week 24.
              Furthermore, 48-week ONWARD3 extension results confirmed 75% PASI 90 and 54% PASI 100, delivering clinical
              clearance metrics that rival injectable biologics. This high-clearance hurdle allows Alumis to target both
              biologic-naive patients desiring oral administration and needle-hesitant patients failing older orals like
              apremilast. Capitalization of $345.1 million raised in an underwritten offering provides essential
              financial runway to prepare commercial scale-up.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM011
