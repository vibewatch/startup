  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Clinical Approval Exposure
        blocks:
          - type: paragraph
            body: >-
              Alumis operates as a clinical-stage biopharmaceutical enterprise whose corporate valuation is
              overwhelmingly concentrated in the regulatory and clinical success of its lead oral TYK2 inhibitor,
              envudeucitinib. The company plans to submit its New Drug Application (NDA) for moderate-to-severe plaque
              psoriasis to the FDA in the fourth quarter of 2026, supported by 48-week Phase 3 ONWARD extension data
              demonstrating a 54% complete skin clearance (PASI 100) response rate. However, statutory drug evaluation
              by the FDA remains inherently unpredictable and carries substantial risks of review delays, requirements
              for supplementary safety analyses, or potential Complete Response Letters (CRLs). Furthermore, pipeline
              expansion into systemic lupus erythematosus via the ongoing Phase 2b LUMUS trial exposes Alumis to
              elevated developmental failure risks, as historically observed when the company was forced to terminate
              its Phase 2a non-infectious uveitis trial due to insufficient interim efficacy.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
