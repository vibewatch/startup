callouts:
  - calloutType: risk
    title: "Capital Depletion Velocity and Commercial Binary Risk"
    body: "Alumis enters the second half of 2026 with a substantial $569.5 million liquid capital reserve, but its quarterly operating cash burn of $87.1 million underscores an annualized burn rate exceeding $348 million. Because commercial drug revenues remain entirely contingent upon FDA approval following the planned Q4 2026 NDA submission, any regulatory delays, clinical extension requirements, or adverse PBM formulary positioning would rapidly compress forward runway and necessitate further dilutive equity financing."
