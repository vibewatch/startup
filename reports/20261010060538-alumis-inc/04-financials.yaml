company:
  name: "Alumis Inc."
chapter:
  number: 4
  title: "Financials"
  summary: "Alumis maintains a robust liquid capital reserve of $569.5 million following its January 2026 follow-on offering, providing forward runway through upcoming Phase 3 psoriasis NDA submission and Phase 2b SLE readouts. However, top-line revenue contracted sharply to $1.74 million in Q1 2026 as upfront collaboration receipts concluded, while quarterly operating cash burn of $87.08 million highlights sustained clinical development intensity. Financial underwriting hinges on regulatory approval and commercial pricing execution to offset an annualized cash burn exceeding $348 million."
sections:
  - id: "revenue-streams-and-collaboration-accounting"
    title: "Revenue Streams and Collaboration Accounting"
    body: "Alumis is a clinical-stage biopharmaceutical company that has generated zero commercial product revenue since inception. Recognized revenue is derived entirely from its March 2025 collaboration and license agreement with Kaken Pharmaceutical for the development and commercialization of envudeucitinib in Japan. In the first quarter of 2026, Alumis recognized $1.74 million in collaboration revenue under the Development Services Obligation, compared to $17.39 million in total revenue in the prior-year period when the initial upfront license obligation was satisfied. The company's future revenue potential is fundamentally gated by regulatory approval and commercial transition. Transforming clinical validation into recurring pharmaceutical sales requires negotiating commercial formulary placement, securing favorable PBM reimbursement tiers, and establishing effective distribution networks across target autoimmune indications."
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: "operating-cost-structure-and-cash-burn"
    title: "Operating Cost Structure and R&D Cash Burn"
    body: "Operating expenses reflect the capital-intensive nature of late-stage global autoimmune clinical trials. Research and development expenses reached $81.54 million in the first quarter of 2026, comprising 81.4% of total operating expenditures, driven by ongoing Phase 3 ONWARD trials in plaque psoriasis and the Phase 2b LUMUS trial in systemic lupus erythematosus. Net cash used in operating activities stood at $87.08 million for the three months ended March 31, 2026, expanding from $80.36 million in the first quarter of 2025. Although quarterly net loss narrowed slightly to $93.05 million from $98.96 million in the prior-year period, persistent quarterly operating cash outflows above $87 million create continuous financial exposure, underscoring the necessity of strict cost discipline and strategic pipeline milestone execution."
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI013
    tableRefs:
      - TI003
  - id: "capital-adequacy-and-financing-runway"
    title: "Capital Adequacy and Forward Financing Runway"
    body: "As of March 31, 2026, Alumis held $569.5 million in total cash, cash equivalents, and marketable securities, providing substantial liquidity to finance ongoing clinical operations. This capital position was bolstered by an upsized underwritten follow-on public offering completed in January 2026, which issued 20,297,500 common shares at $17.00 per share to raise $345.1 million in gross proceeds ($323.8 million in net proceeds). Based on its current operating plan, management projects that existing cash reserves will be sufficient to meet operating and capital requirements for at least 12 months from May 2026. This liquidity runway extends across major upcoming clinical catalysts, including the planned Q4 2026 NDA submission for plaque psoriasis, but leaves limited cushion for protracted commercial scale-up without supplementary financing."
    claimRefs:
      - CI008
      - CI009
      - CI011
      - CI012
  - id: "underwriting-verdict-and-financial-diligence"
    title: "Underwriting Verdict and Financial Diligence Blockers"
    body: "From an institutional underwriting perspective, Alumis presents a capitalized late-stage development profile tempered by near-term revenue contraction and binary clinical dependence. The stock underperformed the broader US equity market over the past year, returning 1.88% against a 14.9% market advance, reflecting investor caution regarding cash burn and execution hurdles. While existing liquidity secures development through 2027, long-term solvency requires substantial commercial cash flow. The primary financial diligence blockers center on undisclosed commercial supply agreements, wholesale acquisition costs versus realized net pricing waterfalls, and the capital expenditure required to establish an independent US commercial field force ahead of potential FDA approval."
    claimRefs:
      - CI009
      - CI013
      - CI014
