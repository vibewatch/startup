              - CU012
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业化前处方目录壁垒与单一资产依赖
            body: Alumis 目前没有获批商业产品、商业收入为零，也没有商业销售组织，因此商业采用完全取决于获批后的 PBM 处方目录谈判，以及 针对现有口服 TYK2 药物 deucravacitinib 的阶梯治疗政策。
            calloutType: risk
            claimRefs:
              - CU002
              - CU011
          - type: callout
            title: 临床持久性作为商业采用代理指标
            body: ONWARD3 48 周试验在 773 名患者中显示 75% 的 PASI 90 和 54% 的 PASI 100 皮肤清除率，在商业留存指标可以衡量前，为治疗坚持度 提供初步临床证据。
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与临床获批风险暴露
        blocks:
          - type: paragraph
            body: >-
              Alumis 是一家临床阶段生物制药公司，其公司估值高度集中于核心口服 TYK2 抑制剂 envudeucitinib 的监管和临床成功。公司计划于 2026 年第四季度向 FDA
              提交用于中重度斑块型银屑病的新药申请（NDA），并有 48 周 3 期 ONWARD 扩展数据支持，显示 54% 的 完全皮肤清除（PASI 100）响应率。然而，FDA
              对药物的法定评估本身不可预测，存在审查延迟、要求补充安全性分析或可能发出完整 回复函（CRL）等重大风险。此外，通过正在进行的 2b 期 LUMUS 试验扩展至系统性红斑狼疮，使 Alumis
              暴露于更高的开发失败风险； 历史上，公司曾因中期疗效不足而被迫终止 2a 期非感染性葡萄膜炎试验。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
      - number: '7.2'
        title: 运营、CMC 与临床试验执行风险
        blocks:
          - type: paragraph
            body: >-
              后期临床生物制药的运营执行，需要化学、生产和控制（CMC）验证与国际临床试验管理之间无缝衔接。Alumis 没有内部商业规模生产 设施，完全依赖第三方合同生产商合成原料药、制剂生产和商业包装。FDA
              现行药品生产质量管理规范（cGMP）下的设施检查缺陷， 或批次污染，均可能叫停临床供应或推迟商业上市。同时，Alumis 依赖外部合同研究组织（CRO）监督多中心试验；方案偏差、监管
              不合规，或长期开放标签扩展期间参与者流失加剧，都会威胁试验数据完整性和监管接受度。
            claimRefs:
              - CR006
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR008
      - number: '7.3'
        title: 商业交易对手、合作伙伴与竞争依赖
        blocks:
          - type: paragraph
            body: >-
              除监管障碍外，Alumis 还面临来自根深蒂固疗法和下一代疗法的激烈竞争及商业化摩擦。Bristol Myers Squibb 的 Sotyktu 已为 变构 TYK2 抑制建立商业验证，但更新的竞争者正威胁
              envudeucitinib 的潜在市场差异化。具体而言，Johnson & Johnson 每日一次的 口服药 Icotyde 相比 envudeucitinib
              每日两次的方案，为患者提供更便利的给药安排，华尔街分析师预计其可能实现重磅药物级采用。 此外，Takeda 的在研 zasocitinib 在斑块型银屑病中呈现竞争性疗效数据，可能压缩 Alumis
              的定价能力和市场份额。合作层面上， Alumis 依靠 Kaken Pharmaceutical 获取区域开发和许可现金流，因此避免争议并确保合作执行，对维持外部非稀释性收入至关重要。
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR014
      - number: '7.4'
        title: 财务续航、资本密集度与风险治理
        blocks:
          - type: paragraph
            body: >-
              Alumis 资本密集度高且累计运营亏损显著，截至 2025 年年末累计亏损为 $901.9 million，2026 年第二季度净亏损为 $142.2 million。扩大规模的后续公开发行获得 $345.1
              million 毛收入，使 2026 年 6 月 30 日总流动性增至 $502.3 million； 但管理层估计这笔资本只能支持运营至 2027 年第四季度。管线重组已经触发实际减记，包括放弃
              lonigutamab 后对收购的 IPR&D 资产计提 $41.8 million 减值损失。为避免投资逻辑断裂，风险治理需要严格监测试验读出、现金消耗速度和商业支付方签约。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管与竞争差异化的二元门槛
            body: >-
              虽然 Alumis 已在斑块型银屑病中展现出令人印象深刻的 3 期 PASI 100 皮肤清除效果，但在计划于 2026 年第四季度提交 NDA 前， 公司仍面临二元监管风险。Johnson & Johnson
              的每日一次口服疗法 Icotyde 和 Takeda 的 zasocitinib 带来的激烈商业竞争进一步 加剧了这一暴露；即使 envudeucitinib 在口服 TYK2
              类别中领先，也可能因此受到市场渗透限制。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、临床去风险与估值背景
        blocks:
          - type: paragraph
            body: >-
              Alumis 进入 2026 年第四季度这一关键转折点，其核心资产 envudeucitinib 已有明确的 3 期临床数据支持。在针对中重度斑块型银屑病 患者的 ONWARD 3
              期项目中，envudeucitinib 在 ONWARD3 长期扩展研究第 48 周实现了前所未有的 54% 完全皮肤清除率（PASI 100）， 同时头皮清除率超过 80%。这一临床表现使
              envudeucitinib 在已获批和在研口服疗法中都具备同类最佳疗效的潜力，超过第一代口服 TYK2 药物建立的基准。管理层已确认，公司仍坚定按计划于 2026
              年第四季度向美国食品药品监督管理局提交新药申请。尽管临床 去风险程度显著，且私募融资轮累计形成 $529M 股本资本，随后又以每股 $17.00 完成 $345.1M 的扩大规模承销公开发行，Alumis
              的交易市值约为 $934.8M（每股 $8.96）。这一价格较首次公开募股估值大幅折价 32.7%。核心投资逻辑认为，由于二元监管风险 和生物科技市场整体波动，公开股票市场大幅折价反映
              envudeucitinib 的商业特许经营潜力，从而为长期临床医疗投资者创造了具有吸引力的 非对称风险回报画像。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
