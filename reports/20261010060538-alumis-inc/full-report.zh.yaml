      - number: '1.2'
        title: 管理层、治理结构与人力资本
        blocks:
          - type: paragraph
            body: >-
              Alumis 由总裁、首席执行官兼董事会主席 Martin Babler 领导；Martin Babler 曾长期负责临床阶段生物制药资产的商业化和推进。 高级管理团队包括首席科学官 David M.
              Goldstein, Ph.D.、首席医学官 Jörn Drappa, M.D., Ph.D.、首席开发官 Mark Bradley、 首席商务及战略官 Roy Hardiman、首席财务官 John
              Schroer 以及总法律顾问 Sanam Pangali。公司治理由七人董事会监督， 其中六人为独立董事，包括 Foresite Capital 创始人兼 CEO Dr. James B.
              Tananbaum、Samsara BioCapital 的 Dr. Srinivas Akkaraju， 以及代表 Matrix Capital Management 的 Dr. Alan
              Colowick。截至 2025 年 12 月 31 日，Alumis 拥有 221 名全职员工和 3 名 兼职员工，覆盖临床开发、监管事务、研发及公司职能。关键人员依赖集中在科学和临床高管，尤其是正在进行的 3
              期试验和新药申请 （NDA）准备工作。
            claimRefs:
