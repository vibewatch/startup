chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立历程与核心平台
        blocks:
          - type: paragraph
            body: >-
              Alumis Inc. 是一家处于临床阶段的生物制药公司，专注于发现、收购并加速开发针对自身免疫性疾病的变革性靶向药物。公司由 Foresite Labs 孵化，于 2021 年 1 月 29 日在特拉华州以
              FL2021-001, Inc. 的法定名称完成初始注册。随后，公司于 2021 年 3 月更名为 Esker Therapeutics, Inc.，并于 2022 年 1 月重新命名为 Alumis
              Inc.。Alumis 在加利福尼亚州南旧金山的主要 执行办公室运营，依靠专有的精准数据分析平台和免疫学专长，用高度选择性的变构口服疗法取代广谱免疫抑制治疗。公司于 2024 年 6
              月在纳斯达克全球精选市场完成首次公开募股，股票代码为 ALMS，随后于 2025 年完成扩大规模的承销后续发行。 Alumis 此前通过与 ACELYRIN, Inc. 的战略合并收购
              lonigutamab；不过，管理层随后启动战略审查，以探索该资产的替代方案， 从而将资源集中于核心口服 TYK2 项目。
            claimRefs:
