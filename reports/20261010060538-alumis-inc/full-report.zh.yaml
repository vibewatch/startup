        - 明确的治理委员会及基于里程碑的开发义务
        - 区域合作收入和里程碑付款损失
      - - 合同研究组织服务
        - 第三方 CRO 和临床中心
        - 多中心研究管理及数据采集
        - 高
        - CRO 运营失败、方案偏离或报告延迟
        - 高
        - 设有质量监督和审计权的主服务协议
        - 临床延迟及开发支出增加
      - - 临床及商业化 CMO 药品供应
        - 单一 / 有限来源的合同生产商
        - 活性药物成分（API）合成及制片
        - 高
        - 生产设施关闭、污染或监管暂停
        - 严重
        - 评估双来源策略并建立安全库存缓冲
        - 上市推迟或临床试验入组暂停
      - - 商业付款方及 PBM 处方集准入
        - 主要药品福利管理机构和健康计划
        - 报销及处方集分层
        - 高
        - 被排除在全国处方集之外，或因 Otezla 面临限制性阶梯疗法
        - 高
        - 证明相较口服标准治疗，在 PASI 100 皮肤清除率上更优
        - 销售采用率低迷及严重的毛收入到净收入折扣
    notes: 交易对手方依赖根据合作协议、10-K 表披露和制药市场动态推导。
    claimRefs:
      - CR004
      - CR008
      - CR009
      - CR014
  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 评估
      - 证据锚点
      - 决策含义
    rows:
      - - 建议
        - 买入（投机性 / 临床）
        - 3 期 ONWARD 第 48 周 PASI 100 完全清除率 54%
        - 在 2026 年第四季度 NDA 提交和 SLE 2b 期读出前建仓
      - - 信心
        - 中
        - 高临床疗效抵消单一资产的二元监管风险
        - 将监管二元结果和执行风险纳入考量，控制仓位
      - - 风险评级
        - 高
        - 资本消耗高（2025 年运营支出 $477.9M），且管线集中
        - 保持严格的风险限额，并监测商业化支出
      - - 估值立场
        - 合理 / 被低估
        - 市值 $934.8M；后续融资 $345.1M、发行价 $17/股，累计融资 $529M
        - 若 envudeucitinib 获得同类最佳口服药标签，风险回报不对称
    notes: 估值立场和风险评级综合自公开市场市值、3 期 ONWARD 临床数据及 FY2025 经审计财务申报。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 核心论点
      - 证据基础
      - 什么会改变判断（止损触发因素）
    rows:
      - - 看多逻辑
        - 斑块型银屑病疗效同类最佳，ONWARD3 第 48 周 PASI 100 达 54%
        - ONWARD3 3 期试验数据在秋季临床皮肤病学会议上发布
        - FDA 批准延迟、严重的类别毒性或黑框安全警告
      - - 看多扩展
        - 一药多管线选择权覆盖 SLE（LUMUS 2b 期）、Sjögren's 和 CLE
        - 2026 年第二季度公司更新和临床免疫学文献
        - SLE 的 LUMUS 2b 期试验失败或缺乏生物标志物信号
      - - 反向逻辑（烧钱）
        - 极高运营烧钱速度（2025 年运营支出 $477.9M、净亏损 $243.3M）可能导致现金快速耗尽
        - FY2025 10-K 表经审计财务报表已向美国 SEC 申报
        - 商业化前烧钱加速，迫使公司进行惩罚性股权稀释
      - - 反向逻辑（商业化）
        - 面对 BMS 的 Sotyktu 和新兴口服竞争药物，商业化存在障碍
        - Bay Bridge Bio 行业分析和 SEC 10-K 风险披露
        - 付款方将其排除在处方集之外、阶梯疗法障碍，或口服 IL-23 疗法表现更优
    notes: 核心投资逻辑驱动因素反映已报道的 3 期 ONWARD 疗效和资本结构；反向逻辑因素反映运营烧钱和商业竞争。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV011
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值 / 股价逻辑
      - 关键下行触发因素
      - 概率权重
    rows:
      - - 乐观情景
        - Envudeucitinib 获批且无黑框警告；占据口服银屑病市场 >15%；SLE 2b 期成功
        - 市值扩张至 $3.0B-$4.0B（$30-$40/股），反映多适应症特许经营
        - 标签限制、商业付款方排除或商业供应中断
        - 25%
      - - 基准情景
        - 获批用于斑块型银屑病；与 Sotyktu 并行稳步进入处方集；SLE 信号有限
        - 市值回升至 $1.8B-$2.5B（$17-$24/股，锚定在 Baird 后续融资价格附近）
        - 医生采用速度较慢、PBM 阶梯疗法障碍及老股股权稀释
        - 50%
      - - 悲观情景
        - FDA 发出完整回复函；长期延长研究出现安全性信号；LUMUS 2b 期失败
        - 估值压缩至 $300M-$500M 的清算现金价值区间（$3-$5/股）
        - envudeucitinib 项目临床或监管全面失败
        - 25%
    notes: 情景估值根据 FDA 审批时间线、相对 Sotyktu 的市场渗透率和后续稀释，对潜在股价走势建模。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV011
      - CV014
figures:
  - id: FO001
    title: Alumis 公司及临床开发里程碑时间线
    type: timeline
    summary: 按时间梳理公司成立、私人融资、公开募资，以及从 2021 年成立至 2026 年的关键 3 期临床读出。
    data:
      items:
        - label: 2021 年 1 月：公司成立
          date: 2021-01
          detail: 由 Foresite Labs 孵化，并在特拉华州以 FL2021-001, Inc. 名义注册成立。
          tone: neutral
        - label: 2021 年 3 月：更名为 Esker
          date: 2021-03
          detail: 公司名称变更为 Esker Therapeutics, Inc.。
          tone: neutral
        - label: 2022 年 1 月：更名为 Alumis
          date: 2022-01
          detail: 公司身份更新为 Alumis Inc.，以建立临床生物制药品牌。
          tone: neutral
        - label: 2024 年 3 月：$259M C 轮
          date: 2024-03
          detail: 完成由 Foresite、Samsara 和 venBio 共同领投的 $259M 融资，用于资助 3 期试验。
          tone: positive
        - label: 2024 年 6 月：纳斯达克 IPO
          date: 2024-06
          detail: 在纳斯达克全球精选市场完成首次公开募股，股票代码为 ALMS。
          tone: positive
        - label: 2026 年第一季度：3 期顶线结果读出
          date: 2026-03
          detail: 报告关键性 3 期 ONWARD1 和 ONWARD2 的积极结果，显示第 24 周 PASI 90 和 PASI 100 皮肤清除率强劲。
          tone: positive
        - label: 2026 年 8 月：ONWARD3 第 48 周数据
          date: 2026-08
          detail: 报告长期延长研究数据，显示第 48 周完全皮肤清除率（PASI 100）为 54%。
          tone: positive
        - label: 2026 年 10 月：秋季临床皮肤病学数据
          date: 2026-10
          detail: 发布新的 3 期数据，显示头皮清除率 >80% 且瘙痒缓解持久，先于计划在 2026 年第四季度提交 NDA。
          tone: positive
    approximationNotes: 日期反映公开披露和 SEC 文件中的日历月份。
    claimRefs:
      - CO002
      - CO010
      - CO011
      - CO014
      - CO015
  - id: FM001
    title: 受约束的可触达市场规模金字塔
    type: pyramid
    summary: 从全球斑块型银屑病总患病人数逐层收窄至最初可触达的口服 TYK2 目标人群，形成多层可触达市场漏斗。
    data:
      items:
        - label: 全球银屑病总人群
          detail: 覆盖轻度、中度和重度疾病形态的全球广泛患病人群
          value: Total Population
        - label: 中重度斑块型银屑病细分市场
          detail: 体表受累程度足以符合系统治疗条件的患者
          value: Systemic Candidate Pool
        - label: 符合系统治疗条件的人群
          detail: 正在接受临床诊疗并寻求先进口服或生物制剂治疗的患者
          value: Addressable TAM
        - label: 偏好口服或对生物制剂犹豫的细分人群
