              Alumis 的专有基础在于其知识产权组合和临床试验执行。Alumis 独家拥有覆盖 envudeucitinib 和 A-005 的物质组成及使用方法 专利家族，法定有效期预计至 2039 年；此外还有待审
              PCT 和外国申请，将保护期延长至 2045 年。监管进度上，Alumis 仍按计划 于 2026 年第四季度向 FDA 提交用于斑块型银屑病的 envudeucitinib 新药申请（NDA）。2026
              年扩大规模的 $345.1 million 后续发行，为执行这些里程碑提供了更充足的财务续航。不过，NDA 提交前的关键尽调问题仍未解决：Alumis 尚未披露化学、生产和
