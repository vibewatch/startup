      - number: '6.2'
        title: 临床采用轨迹与患者暴露
        blocks:
          - type: paragraph
            body: >-
              由于 envudeucitinib 在监管批准前仍处于研究阶段，采用轨迹只能严格依据多中心研究中的临床试验入组、方案完成和患者留存衡量。 在关键性 3 期 Onward1 和 Onward2
              试验中，envudeucitinib 显示出具有统计学显著性的皮肤清除效果，第 16 周近 60% 的患者达到 皮肤清除或接近清除，74% 的患者实现重大临床改善。在持续进行的 ONWARD3
              长期扩展研究中，773 名患者接受连续口服 envudeucitinib 治疗，最长持续 48 周，显示 75% 的 PASI 90 响应率和 54% 的完全皮肤清除率（PASI 100）。这 48
              周的留存和较高的完全清除率， 使 envudeucitinib 相比已获批口服标准疗法处于有利位置，在商业补药依从性和真实世界合规性尚可评估前，提供初步的患者坚持治疗证据。
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
