      - number: '2.3'
        title: 买方、处方方与支付方的采用机制
        blocks:
          - type: paragraph
            body: >-
              目标自身免疫适应症的商业转化由处方医生、患者和药品福利管理机构三方利益相关者共同决定。在中重度斑块型银屑病中，高处方量
              皮肤科医生是主要临床决策者，需要在疗效终点和不良事件监测之间权衡。在系统性红斑狼疮中，专科风湿病医生根据器官保护和减少
              糖皮质激素依赖来决定采用。不过，最终的经济闸门仍是第三方商业支付方和药品福利管理机构。美国商业报销需要处理处方目录分层、
              事先授权流程，以及在获得新型品牌专科疗法之前必须先用仿制病情改善抗风湿药或较老口服药进行阶梯治疗。除此之外，包括 Medicare 通胀返利在内的联邦卫生政策机制，持续压低品牌专科免疫药物领域的定价。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM009
      - number: '2.4'
        title: 商业驱动因素、采用瓶颈与关键缺口
        blocks:
          - type: paragraph
            body: >-
              envudeucitinib 的主要增长驱动力，是患者和医生偏好高效、每日一次的口服药片，避免皮下注射生物制剂带来的流程摩擦、注射部位 疼痛和冷链储存。反过来，商业采用面临三项关键约束：Bristol Myers
              Squibb 第一代 TYK2 抑制剂 Sotyktu （deucravacitinib）带来的现有商业阻力；下一代口服 IL-23 肽进入后期开发的威胁；以及尚未确认的商业支付方净定价。 Alumis 计划在
              2026 年第四季度向 FDA 提交新药申请，但关键商业尽调缺口仍未解决。尤其是，Alumis 尚未公开披露预期的 毛收入至净收入折扣策略、处方目录共付援助结构，或相对于 Sotyktu
              的具体阶梯治疗定位，因此最终商业净收入实现仍取决于 获批后与支付方执行合同。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 口服皮肤科疗法的疗效门槛上移
            body: 口服银屑病药物的商业上限，正从历史上只能实现有限清除的基准，转向类似生物制剂的 PASI 90 和 PASI 100 结果；持续清除 皮肤成为处方医生决定采用的关键触发点。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 支付方阶梯治疗与处方目录构成核心商业瓶颈
            body: 即使拥有同类最佳的 3 期疗效，商业成功仍取决于 PBM 处方目录定位；若无法在处方目录中获得有利分层，并与既有口服药和 生物类似药平等准入，处方履约仍会大幅流失。
            calloutType: risk
            claimRefs:
              - CM006
              - CM009
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、现有巨头与新兴疗法
        blocks:
          - type: paragraph
            body: >-
              Alumis Inc. 面临的竞争格局涵盖开发口服酪氨酸激酶 2（TYK2）抑制剂的直接机制同业、规模达数十亿美元且根基稳固的注射用 生物制剂品牌，以及成熟的第一代口服小分子药物。从机制看，Bristol
              Myers Squibb 的 Sotyktu（deucravacitinib）作为首款 获 FDA 批准的口服 TYK2 抑制剂，构成商业基准；Takeda 则将从 Nimbus Therapeutics 收购的
              zasocitinib（TAK-279）推进至 3 期临床开发。除直接 TYK2 竞争者外，斑块型银屑病市场由根基深厚的注射用生物制剂主导，包括 AbbVie 的 Skyrizi
              （risankizumab）、Johnson & Johnson 的 Tremfya（guselkumab）、Eli Lilly 的 Taltz（ixekizumab）和 UCB 的 Bimzelx
              （bimekizumab）。这些商业巨头在皮肤科网络中拥有广泛的处方关系和长期支付方合同。在口服药领域，Amgen 的 Otezla
              （apremilast）是一种口服磷酸二酯酶-4（PDE4）抑制剂，在升级至生物制剂之前仍是全身治疗的既有市场基准，尽管其高门槛 皮肤清除效果有限。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 临床差异化、靶点抑制与高门槛皮肤清除
        blocks:
          - type: paragraph
            body: >-
              斑块型银屑病的临床差异化，已从有限的 PASI 75 响应率明确转向高门槛终点，即 PASI 90 和完全 PASI 100 清除。在关键性 3 期 ONWARD1 和 ONWARD2
              试验中，envudeucitinib 以统计学显著性达到所有主要和次要终点，在第 24 周的皮肤清除效果优于 活性口服对照药
              apremilast（p<0.0001）。两项试验平均来看，envudeucitinib 在第 16 周达到 74% 的 PASI 75 和 59% 的 sPGA 0/1，在第 24 周进一步达到约 65% 的
              PASI 90 和超过 40% 的 PASI 100。此外，在 ONWARD3 长期扩展研究中，连续治疗 48 周后，75% 的患者达到 PASI 90，54% 达到完全皮肤清除（PASI
              100），为已发表银屑病试验中报告的口服药最高清除率。 在机制上，变构 TYK2 抑制避开 ATP 结合活性位点的激酶同源性，在不触发经典 Janus 激酶（JAK）毒性的情况下实现最长 24 小时
              的靶点抑制；而 Sotyktu 标签仍保留潜在 JAK 相关心血管和血栓事件的警告。
            claimRefs:
              - CP003
