      - number: '5.2'
        title: 生化作用机制与临床差异化
        blocks:
          - type: paragraph
            body: >-
              Envudeucitinib 通过变构抑制 TYK2 调节性假激酶（JH2）结构域实现生物学差异化，而不是在传统 Janus 激酶（JAK）抑制剂使用 的高度保守 ATP 结合催化位点竞争。这一机制相对于
              JAK1、JAK2 和 JAK3 具有内在选择性，避免非选择性 JAK 抑制剂因血液学和 心血管毒性而触发 FDA 黑框警告。在关键性 ONWARD 3 期临床项目中，envudeucitinib 在第 48
              周实现 54% 的 PASI 100 完全皮肤 清除率及 75% 的 PASI 90 清除率，成为口服银屑病疗法中的高疗效基准。此外，临床试验显示头皮清除率超过 80%，瘙痒迅速缓解，
              且药物相关皮疹发生率低，表明持续关闭 TYK2 通路并不必然带来皮肤不良事件这一类效应。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE011
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
