  - id: FE001
    title: Alumis 产品及技术运营栈
    type: stack
    summary: 以六层架构展示 Alumis 的精准自身免疫药物发现、临床转化和商业供应模式。
    approximationNotes: 表示从靶点生物学到临床供应的功能平台层，而非实体软件基础设施。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE010
      - CE013
    data:
      layers:
        - label: 靶点生物学及结构化学
          detail: 变构抑制 TYK2 JH2 假激酶结构域，在 JAK1/2/3 催化活性位点之外确保结构选择性
        - label: 精准发现平台
          detail: 整合人类遗传学和转化生物标志物的数据分析平台，用于优化候选药物的类药性
        - label: 临床资产管线
          detail: 小分子和生物制剂组合，包括 envudeucitinib（系统性 TYK2）、A-005（中枢神经系统 TYK2）以及 lonigutamab（IGF-1R 单抗）
        - label: 药理学验证
          detail: 通过 RNA-seq 和皮肤活检确认高渗透性、8-12 小时半衰期及 24 小时持续靶点抑制
        - label: 临床及监管开发
          detail: 银屑病关键性 3 期 ONWARD 项目和系统性红斑狼疮 2b 期 LUMUS 试验推动计划于 2026 年第四季度提交 NDA
        - label: 合同生产及 CMC 供应链
          detail: 由合格 CDMO 合作伙伴管理可扩展的小分子化学合成和口服成品制剂
  - id: FU001
    title: 客户旅程图：从临床试验到商业付款方采用
    type: journey-map
    summary: 展示 envudeucitinib 从临床试验入组到商业付款方准入及长期依从性的多阶段客户和付款方采用旅程。
    data:
      items:
        - label: 1. 临床试验入组及留存
          touchpoints:
            - 临床试验中心在 Onward1/2 和 Onward3 LTE 研究中招募患者
            - 给予试验药物，并按方案监测访视
        - label: 2. 监管申报及 PDUFA 审评
          touchpoints:
            - 于 2026 年第四季度向 FDA 提交新药申请
            - 审查临床疗效、安全性数据库及 CMC 生产模块
        - label: 3. PBM 及健康计划处方集谈判
          touchpoints:
            - 与主要商业 PBM 和全国性健康计划接洽
            - 让利返款，并与现有口服 deucravacitinib 竞争定位
        - label: 4. 处方医生互动及学术推广
          touchpoints:
            - 专科皮肤科销售团队向高分位处方医生开展学术推广
            - 介绍 ONWARD3 54% PASI 100 皮肤清除率及安全性特征
        - label: 5. 患者接入及事先授权
          touchpoints:
            - 通过患者服务中心和专科药房导航事先授权
            - 通过患者共付援助项目缓解自付费用阻力
        - label: 6. 商业依从性及多适应症扩张
          touchpoints:
            - 监测处方续配持续性和真实世界停药情况
            - 可能将标签扩展至 SLE 及其他自身免疫适应症
