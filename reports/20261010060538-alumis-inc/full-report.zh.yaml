      - number: '8.2'
        title: 财务消耗、运营费用与稀释分析
        blocks:
          - type: paragraph
            body: >-
              严格评估 Alumis 的公司估值，必须将其强劲的临床疗效与资本密集型消耗画像放在一起权衡。根据公司截至 2025 年 12 月 31 日财年的 经审计合并财务报表，Alumis 发生总运营费用
              $477.9M，主要由 $386.0M 研发费用推动，因为并行 3 期试验和长期扩展研究进入 运营高峰。尽管许可和合作协议带来的商业收入在 FY2025 达到 $24.1M，年度净亏损仍为
              $243.3M，使累计亏损扩大至 $901.9M。 Baird 牵头的后续发行获得 $345.1M 毛收入，强化了公司资产负债表，但短期运营势头仍面临财务阻力。2026 年第二季度，Alumis 每股收益为
              -$1.11，低于共识预期的 -$0.71，不利偏差达到 56.34%，凸显中期管理费用偏高。从临床开发转向商业上市，需要大量
              商业化前库存生产、医学事务人员配置和分销建设。因此，如果上市前支出在产品收入出现拐点前超过资金储备，二次股权稀释仍是持续存在的风险因素。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV011
              - CV013
      - number: '8.3'
        title: 情景估值建模：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              为评估临床、监管和市场走向的各种合理情景，本文用三情景框架推演 Alumis 的企业股权价值。乐观情景（概率 25%）假设 FDA 快速批准，且不附带限制性的黑框安全警告；商业化后，产品相对 Bristol
              Myers Squibb 的 Sotyktu 能拿下口服斑块型银屑病市场超过 15% 的份额。在这一情景下，2b 期 LUMUS 试验对系统性红斑狼疮给出积极的概念验证读数，证明管线扩张可行性，推动企业估值升至
              $3.0B 至 $4.0B（每股 $30.00 至 $40.00）。基准情景（概率 50%）预计 FDA
              成功批准中重度斑块型银屑病适应症，并凭借竞争力进入口服一线用药；与此同时，支付方的阶梯治疗要求中等，且公司通过常规的二级股权融资为商业销售团队提供资金。该情景推演股权价值恢复至 $1.8B 至 $2.5B（每股
              $17.00 至 $24.00），使股价回到此前 $17.00 的发行水平。悲观情景（概率 25%）则假设监管通过完整回复函推迟、后期出现同类药物安全警告，或新一代口服 IL-23
              候选药物激进抢占市场。在这一不利结果下，股权估值将压缩至接近清算现金价值，即 $300M 至 $500M（每股 $3.00 至 $5.00）。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
      - number: '8.4'
        title: 跌破投资逻辑的触发因素、下行催化剂与尽调问题
        blocks:
          - type: paragraph
            body: >-
              要维持建设性的投资立场，必须明确跟踪可量化的逻辑失效标准，并认真补齐剩余运营信息缺口。在公开监管文件中，Alumis
              提醒，即使取得较大市场份额，目标人群过于小众或临床标准过于严格，也可能阻碍公司实现盈利。首要的逻辑失效触发因素，是 FDA
              意外拒绝受理、发出完整回复函，或要求在标签中加入限制性警告措辞，从而削弱口服用药的便利性优势。第二个致命标准是竞争侵蚀：如果 Sotyktu 的商业采用，或口服 IL-23 肽快速推进至 3
              期，压缩了可覆盖患者数量，envudeucitinib 的定价权和峰值销售潜力将遭到结构性损害。此外，2b 期 LUMUS 试验在系统性红斑狼疮上临床失败，将使公司在 Sjögren's
              病和皮肤型红斑狼疮上的“一药多病”管线期权失效。持续尽调应优先审查拟于 2026 年第四季度提交的 NDA
              中化学、生产与质量控制章节是否准备就绪，跟踪药房福利管理机构的目录层级谈判，并评估长期安全性延伸数据中是否出现机会性感染或静脉血栓栓塞信号。
            claimRefs:
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 2026 年第四季度 NDA 申报前的投机性买入
            body: >-
              医疗健康和生物科技投资者会把 Alumis 视为一个有吸引力、高贝塔的投机性买入标的。3 期 ONWARD3 试验显示 PASI 100 完全清除率为 54%，使 envudeucitinib
              在斑块型银屑病口服疗效上具备冲击同类最佳的潜力。公司市值低于 $1.0B，当前买入倍数已反映此前大额股权投资及后续定价，若 FDA 监管执行顺利，潜在上行空间不对称。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
          - type: callout
            title: 经营现金大量消耗与稀释压力
            body: >-
              FY2025 经营费用达到 $477.9M，累计亏损为 $901.9M。Alumis
              一边准备商业化上市，一边推进狼疮和神经退行性疾病管线，资本开支压力仍将持续。如果商业化上市成本超过当前资金储备，投资者必须主动控制仓位，以承受潜在的稀释性融资。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
