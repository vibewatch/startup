            body: >-
              商业化前生物科技公司的客户验证，重点是正式临床队列、研究性临床中心和前瞻性监管里程碑，而不是商业企业采购协议。Alumis 的 临床验证基础是 Onward1 和 Onward2
              的随机双盲队列，以及在皮肤科临床中心评估疗效持久性的 773 人 ONWARD3 长期扩展研究。 为支持斑块型银屑病以外的管线扩张，2b 期 LUMUS 研究正在评估 envudeucitinib
              用于系统性红斑狼疮，预计 2026 年第三季度获得 顶线临床数据。Alumis 通过 2026 年扩大规模的 $345.1 million 后续发行强化资产负债表，取得完成这些临床评估并在 2026 年下半年
              准备向 FDA 提交计划中新药申请的资金续航，无需立即进行商业融资。
            claimRefs:
