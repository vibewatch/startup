  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与目标利益相关者地图
        blocks:
          - type: paragraph
            body: >-
              作为推进口服 TYK2 抑制剂的临床阶段生物制药公司，Alumis 没有商业销售组织或产品分销网络，商业产品收入为零。其核心候选药 envudeucitinib
              的商业采用，需要将三类不同客户群分开：处方皮肤科医生、中重度斑块型银屑病患者，以及包括商业保险公司和药品福利
              管理机构在内的机构第三方支付方。患者相较注射用生物制剂更看重口服便利性和持续皮肤清除；处方皮肤科医生则是评估疗效基准的 临床把关人。机构支付方最终通过处方目录定位、分层决策和限制性事先授权流程决定商业采用。
              Alumis 计划在美国建设与阶段相匹配的商业化基础设施，同时评估欧洲和亚太市场的区域合作安排，以优化全球商业准入。
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
