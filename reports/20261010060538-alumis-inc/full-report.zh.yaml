      - number: '1.4'
        title: 临床管线进展、监管路线图与风险画像
        blocks:
          - type: paragraph
            body: >-
              Alumis 的核心临床资产是 envudeucitinib（前身为 ESK-001），这是一种新一代口服变构酪氨酸激酶 2（TYK2）抑制剂，经过精准设计， 旨在实现最长 24
              小时的靶点抑制。在针对中重度斑块型银屑病的关键性 3 期 ONWARD1 和 ONWARD2 试验中，envudeucitinib 达到 主要终点，显示第 24 周 PASI 90 响应率分别为 68.0% 和
              62.1%，PASI 100 响应率分别为 41.0% 和 39.5%。在长期扩展试验 ONWARD3 中，75% 的患者在第 48 周达到 PASI 90，54% 达到完全皮肤清除（PASI
              100），为已发表银屑病试验中报告的口服药最高 清除率。Alumis 仍按计划于 2026 年第四季度向美国 FDA 提交 NDA。除银屑病外，envudeucitinib 正在 2b 期 LUMUS 试验中接受
              系统性红斑狼疮（SLE）评估；一种可穿过中枢神经系统的 TYK2 抑制剂 A-005 也在推进帕金森病 2 期试验。负面方面，Alumis 因与 ACELYRIN
              的合并而面临围绕历史试验披露的持续集体诉讼，同时承担临床和监管获批的不确定性风险。
            claimRefs:
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO010
              - CO011
              - CO014
              - CO015
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 经验证的同类最佳口服皮肤清除表现
            body: >-
              Envudeucitinib 在 ONWARD1、ONWARD2 和 ONWARD3 中的 3 期临床数据展现出前所未有的口服银屑病药物疗效，在第 48 周达到 54% 的 PASI 100
              响应率，并快速清除头皮皮损，使其成为注射用生物制剂的强劲竞争替代方案。
            calloutType: strength
