  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 临床阶段管线架构与资产组合
        blocks:
          - type: paragraph
            body: >-
              Alumis 专注于开发针对免疫介导性疾病的精准工程化口服疗法，核心是两种专有变构酪氨酸激酶 2（TYK2）抑制剂：核心候选药 envudeucitinib（前身为
              ESK-001）和可穿过中枢神经系统（CNS）的分子 A-005。Envudeucitinib 旨在最大化 24 小时靶点抑制，
              同时保持良好耐受性，避免广泛免疫抑制。除斑块型银屑病和系统性红斑狼疮外，Alumis 还在评估 envudeucitinib 用于干燥综合征 和皮肤型红斑狼疮的其他适应症，同时推动 A-005 进入帕金森病 2
              期试验。公司还通过收购 lonigutamab 进一步分散临床管线， 该药是用于甲状腺眼病、皮下注射给药的抗 IGF-1R 单克隆抗体，构建多资产自身免疫业务组合。
            claimRefs:
              - CE001
