      - number: '1.3'
        title: 资本结构、资产负债表流动性与所有权结构
        blocks:
          - type: paragraph
            body: >-
              Alumis 已筹集大量私募和公开资本，用于推进临床管线。在首次公开募股之前，Alumis 于 2024 年 3 月完成 $259 million 的 C 轮 风险融资，由 Foresite
              Capital、Samsara BioCapital 和 venBio Partners 共同领投。2025 年，公司完成扩大规模的公开后续发行， 以每股 $17.00 发行 20,297,500 股普通股，募得
              $345.1 million 毛收入，Baird 担任主承销商。截至 2026 年 3 月 31 日， Alumis 持有 $569.5 million 现金、现金等价物和有价证券，预计可支撑运营至 2027
              年第四季度。公司的所有权结构由专业生命科学 机构投资者主导，包括 AyurMaya Capital Management Fund（隶属于 Matrix Capital Management）、与
              Foresite Capital Management 关联的投资实体及 Samsara BioCapital，同时还有 Baker Brothers Life Sciences 等医疗保健专业基金。
