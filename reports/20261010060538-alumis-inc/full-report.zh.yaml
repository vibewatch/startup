  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 治疗范围与边界定义
        blocks:
          - type: paragraph
            body: >-
              Alumis Inc. 的核心商业机会在于针对免疫介导性炎症疾病的精准口服疗法，初期临床重点是中重度斑块型银屑病和系统性红斑狼疮。
              在斑块型银屑病中，相关市场边界包括符合全身治疗条件的患者，具体是病变范围广、适合口服小分子药物或注射用生物制剂的患者。
              轻度银屑病若通过外用糖皮质激素、仿制角质溶解剂或局部光疗即可充分管理，则不计入可触达支出。次级边界扩展包括系统性红斑狼疮，
              这是一种获批靶向治疗选择有限的严重全身性自身免疫疾病；优先管线邻近领域还包括干燥综合征和皮肤型红斑狼疮。长期选择权则延伸 至中枢神经系统神经炎症疾病，依靠在研候选药
              A-005；不过，神经退行性疾病的商业边界仍处于探索阶段。
            claimRefs:
              - CM001
              - CM005
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM013
              - CM014
      - number: '2.2'
        title: 市场规模视角与患者分层
        blocks:
          - type: paragraph
            body: >-
              评估 envudeucitinib 的商业潜力，需要将疾病总支出拆解为现实的采用视角。全球银屑病治疗支出虽属于数十亿美元级别，但口服 TYK2
              抑制剂的竞争空间受到根深蒂固的生物制剂限制，包括在重症维持治疗中占主导地位的 IL-23、IL-17 和 TNF-alpha 抑制剂。 在 3 期 ONWARD1 和 ONWARD2
              试验中，envudeucitinib 在第 16 周平均达到 74% 的 PASI 75 和 59% 的 sPGA 0/1，在第 24 周 进一步达到约 65% 的 PASI 90 和超过 40% 的 PASI
              100。此外，ONWARD3 的 48 周扩展结果确认了 75% 的 PASI 90 和 54% 的 PASI 100，皮肤清除指标可与注射用生物制剂相媲美。高水平的清除效果使 Alumis
              能同时瞄准希望口服给药的生物制剂初治患者， 以及对注射犹豫、且既往口服药（如 apremilast）治疗失败的患者。承销发行筹得的 $345.1 million 资本，为准备商业化扩张 提供了必要的资金缓冲。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM011
