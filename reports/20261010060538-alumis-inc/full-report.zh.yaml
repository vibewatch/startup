      - number: '3.3'
        title: 定价模式、处方目录准入与商业渠道动态
        blocks:
          - type: paragraph
            body: >-
              在皮肤科商业化口服疗法，需要应对激进的药品福利管理机构（PBM）处方目录分层、强制阶梯治疗方案以及大幅的毛收入至净收入 返利让步。已上市的口服对照药构成定价环境：BMS 将 Sotyktu 年价格列为约
              $75,000，Amgen 将 Otezla 年价格列为接近 $48,000， 两家生产商均让出估计 40% 至 55% 的返利，以取得商业处方目录的优先定位。Skyrizi 等注射用生物制剂的年价格接近
              $79,000， 并受益于 AbbVie 免疫业务组合的多适应症合同。作为一家没有商业收入或成熟现场销售基础设施的临床阶段生物制药公司，Alumis
              必须建立专门的美国商业组织，或执行共同推广合作，以取得处方目录定位。若没有激进的返利对等条件，或没有由更高 PASI 100 清除率驱动的明确专科医生需求，envudeucitinib
              可能会被排在仿制外用药和成熟口服全身药之后，沦为二线口服药。
            claimRefs:
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP014
      - number: '3.4'
        title: 壁垒持久性、知识产权与不利战略风险
        blocks:
          - type: paragraph
            body: >-
              虽然 envudeucitinib 拥有物质组成专利保护，并可能依据 Hatch-Waxman 修正案获得专利期限恢复，但长期商业防御力仍暴露于 新兴治疗方式和运营脆弱性。Johnson & Johnson
              的口服 IL-23 受体肽 icotrokinra / JNJ-2113 等新兴口服候选药已展现令人鼓舞 的 2 期疗效；若 3 期数据确认类似生物制剂的清除效果，可能挑战口服 TYK2
              的采用。运营上，Alumis 完全依赖印度和台湾的 单一来源合同生产组织生产活性药物成分，在商业扩张前形成供应链单点依赖。财务数据则显示，独立股票分析指出，Alumis 过去 12 个月 产生 $417
              million 的运营亏损，并在 2026 年第二季度错过盈利预期，EPS 为 -$1.11，而预期为 -$0.77。此外，与 ACELYRIN 收购相关的整合拖累和集体诉讼，在公司接近计划于 2026
              年第四季度提交新药申请之际，持续形成公司层面的阻力。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 相对口服基准药的临床疗效差异化
            body: >-
              Envudeucitinib 在 3 期第 24 周实现约 65% 的 PASI 90 清除率，在 ONWARD3 第 48 周实现 54% 的 PASI 100 清除率；相较于 apremilast
              具有统计学显著优势（p<0.0001），并超过 deucravacitinib 历史上 27-36% 的 PASI 90 基准。
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP005
          - type: callout
            title: 商业采用受到现有巨头威胁
            body: >-
              作为没有现成商业基础设施或支付方返利合同的商业化前进入者，Alumis 面临来自 AbbVie、J&J 和 BMS 的根深蒂固竞争；
              这些公司的大幅处方目录折扣和成熟专科关系，即使无法抹去临床差异化，也会威胁商业采用。
            calloutType: risk
            claimRefs:
