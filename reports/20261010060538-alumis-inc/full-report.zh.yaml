            body: >-
              Alumis 采用以资产为中心的运营架构，利用专有精准数据分析平台进行靶点验证和临床生物标志物选择，同时将实体生产全部外包给 第三方。Envudeucitinib 和 A-005
              是从标准起始材料经可复现化学工艺合成的小分子化合物。然而，公司没有内部生产设施，以采购订单
              方式向专门的合同开发与生产组织（CDMO）采购活性药物成分（API）和原料药。关键原材料和化学中间体来自位于印度和台湾的单一来源 供应商。Alumis
              正在商业化前积极认证冗余供应商，但缺少具有约束力的长期商业供应协议，使公司暴露于国际贸易政策变化、运输瓶颈 和设施 cGMP 检查延误。
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE003
