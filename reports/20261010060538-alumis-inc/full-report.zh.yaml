      - number: '6.4'
        title: 商业旅程、处方目录准入与集中度动态
        blocks:
          - type: paragraph
            body: >-
              envudeucitinib 的商业持久性和市场扩张面临口服自身免疫疗法常见的支付方摩擦和竞争壁垒。第三方支付方日益施加严格的事先授权
              和强制阶梯治疗方案，要求患者先用更便宜的仿制药或生物类似药失败后，才能获得品牌口服疗法。此外，商业上市动态将直接与 Bristol Myers Squibb 首款口服 TYK2 抑制剂 Sotyktu
              竞争；其商业采用体现出对医生进行大量产品讲解以及支付方返利折扣的要求。 当激进投资者 Trium Capital 反对 Acelyrin 拟议与 Alumis 合并时，公司交易风险也浮现出来；Trium 认为
              Alumis 的报价相对于现金 清算价值，临床风险过高。与此同时，与肿瘤生物科技公司 Celcuity 的同业比较显示 Alumis 的净利率为 -5,933.46%，反映出推进后期
              临床项目至商业上市所需承担的大量商业化前运营亏损。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU010
