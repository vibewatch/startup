    title: "Speculative Buy Ahead of Q4 2026 NDA Filing"
    body: "Alumis presents an attractive, high-beta speculative buy for healthcare and biotechnology allocators, anchored by Phase 3 ONWARD3 54% PASI 100 complete skin clearance data that positions envudeucitinib with potential best-in-class oral efficacy in plaque psoriasis. At a market capitalization under $1.0B, the current entry multiple discounts substantial prior equity investment and follow-on pricing, providing asymmetric upside subject to binary FDA regulatory execution."
