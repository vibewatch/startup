company:
  name: "Alumis Inc."
chapter:
  number: 8
  title: "Valuation"
  summary: "Alumis presents an attractive speculative buy at a ~$935M market capitalization ahead of its fourth-quarter 2026 NDA submission for envudeucitinib in plaque psoriasis, supported by compelling Phase 3 ONWARD3 complete clearance data (54% PASI 100). The recommendation carries medium confidence and a high risk rating, reflecting single-asset regulatory dependence, aggressive commercial competition from incumbent TYK2 and oral IL-23 agents, and substantial operational cash burn ($477.9M in FY2025) that necessitates disciplined financing execution."
sections:
  - id: "investment-thesis-and-valuation-context"
    title: "Investment Thesis, Clinical De-Risking, and Valuation Context"
    body: "Alumis enters the fourth quarter of 2026 at a pivotal inflection point, supported by definitive Phase 3 clinical data for its lead asset, envudeucitinib. In the ONWARD Phase 3 program evaluating patients with moderate-to-severe plaque psoriasis, envudeucitinib demonstrated an unprecedented 54% complete skin clearance rate (PASI 100) at Week 48 in the ONWARD3 long-term extension study, alongside superior scalp clearance exceeding 80%. This clinical performance positions envudeucitinib with potential best-in-class efficacy among both approved and investigational oral therapies, exceeding benchmarks established by first-generation oral TYK2 agents. Management has confirmed that it remains firmly on track to submit a New Drug Application to the United States Food and Drug Administration in the fourth quarter of 2026. Despite this substantial clinical de-risking and cumulative equity capital formation of $529M across private financing rounds followed by a $345.1M upsized underwritten public offering at $17.00 per share, Alumis trades at a market capitalization of approximately $934.8M ($8.96 per share). This pricing reflects a steep 32.7% discount to its initial public offering valuation. The primary investment thesis asserts that public equity markets are significantly discounting envudeucitinib's commercial franchise potential due to binary regulatory risk and broader biotechnology market volatility, creating a compelling asymmetric risk-reward profile for long-term clinical healthcare allocators."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financial-burn-and-capital-structure"
    title: "Financial Burn, Operating Expenses, and Dilution Analysis"
    body: "A rigorous appraisal of Alumis' corporate valuation must reconcile its strong clinical efficacy against an intensive capital burn profile. According to the company's audited consolidated financial statements for the fiscal year ended December 31, 2025, Alumis incurred total operating expenses of $477.9M, driven primarily by $386.0M in research and development expenses as parallel Phase 3 trials and long-term extension studies reached peak operational activity. While commercial revenues from licensing and collaboration agreements generated $24.1M in FY2025, the annual net loss totaled $243.3M, expanding the company's accumulated deficit to $901.9M. Although gross proceeds of $345.1M from the Baird-led follow-on offering strengthened the corporate balance sheet, near-term operational momentum faces financial headwind. In the second quarter of 2026, Alumis posted an earnings per share miss of -$1.11 compared to the consensus estimate of -$0.71, an adverse variance of 56.34% that underscores elevated interim overhead. Transitioning from clinical development to commercial launch will demand substantial pre-commercial inventory manufacturing, medical affairs staffing, and distribution buildout. Consequently, secondary equity dilution remains an active risk factor if pre-launch expenditures outstrip treasury reserves before product revenue inflection."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV008"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV002"
  - id: "scenario-valuation-modeling"
    title: "Scenario Valuation Modeling: Bull, Base, and Bear Cases"
    body: "To evaluate investment outcomes across plausible clinical, regulatory, and market trajectories, a tripartite scenario framework models Alumis' enterprise equity value. The Bull Case (assigned a 25% probability) assumes prompt FDA approval without restrictive black-box safety warnings, accompanied by commercial market uptake capturing more than 15% of the oral plaque psoriasis market against Bristol Myers Squibb's Sotyktu. Under this scenario, positive proof-of-concept readouts in systemic lupus erythematosus from the Phase 2b LUMUS trial validate franchise pipeline expansion, driving enterprise valuation toward $3.0B to $4.0B ($30.00 to $40.00 per share). The Base Case (assigned a 50% probability) anticipates successful FDA approval in moderate-to-severe plaque psoriasis with competitive first-line oral positioning, balanced by moderate payer step-therapy hurdles and routine secondary equity financing to fund the commercial sales force. This scenario models equity value recovery toward $1.8B to $2.5B ($17.00 to $24.00 per share), realigning the stock with its prior $17.00 offering level. The Bear Case (assigned a 25% probability) models regulatory delay via Complete Response Letter, late emergent class safety warnings, or aggressive competitive preemption from next-generation oral IL-23 candidates. In this adverse outcome, the equity valuation compresses toward liquidation cash value between $300M and $500M ($3.00 to $5.00 per share)."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV011"
      - "CV012"
      - "CV014"
    tableRefs:
      - "TV003"
  - id: "thesis-break-triggers-and-diligence-path"
    title: "Thesis-Break Triggers, Downside Catalysts, and Diligence Asks"
    body: "Sustaining a constructive investment stance requires explicit monitoring of measurable thesis-break kill criteria and diligent resolution of remaining operational information gaps. In public regulatory filings, Alumis cautions that even if significant market share is achieved, niche target populations or stringent clinical criteria may impede corporate profitability. The primary thesis-break trigger would be any unexpected FDA regulatory refusal to file, Complete Response Letter, or labeling mandate that imposes restrictive warning language undermining oral convenience advantages. A secondary kill criterion centers on competitive encroachment: if commercial adoption of Sotyktu or rapid Phase 3 advancement of oral IL-23 peptides compresses addressable patient volume, envudeucitinib's pricing power and peak sales potential would face structural impairment. Furthermore, clinical failure in the Phase 2b LUMUS trial for systemic lupus erythematosus would invalidate pipeline-in-a-pill optionality across Sjögren's disease and cutaneous lupus erythematosus. Ongoing diligence must prioritize auditing Chemistry, Manufacturing, and Controls section readiness for the pending Q4 2026 NDA submission, tracking pharmacy benefit manager formulary tier negotiations, and evaluating long-term safety extension data for unexpected opportunistic infections or venous thromboembolism signals."
    claimRefs:
      - "CV005"
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV013"
