company:
  name: "Alumis Inc."
chapter:
  number: 6
  title: "Customers"
  summary: "Alumis is a pre-commercial clinical-stage biopharmaceutical company with no approved products, commercial sales organization, or commercial revenue, directing envudeucitinib through Phase 3 trials toward a planned Q4 2026 NDA submission. Customer adoption is currently measured via clinical trial cohorts, including 773 patients in the 48-week ONWARD3 extension showing 54% PASI 100 skin clearance, while commercial success remains contingent on post-approval PBM formulary coverage and overcoming step-edit barriers against incumbent oral TYK2 inhibitors."
sections:
  - id: "customer-segmentation-and-stakeholder-map"
    title: "Customer Segmentation & Target Stakeholder Map"
    body: "As a clinical-stage biopharmaceutical company advancing oral TYK2 inhibitors, Alumis operates without a commercial sales organization or product distribution network, generating zero commercial product revenue. Commercial adoption of its lead drug candidate envudeucitinib requires segmenting three distinct customer constituencies: prescribing dermatologists, moderate-to-severe plaque psoriasis patients, and institutional third-party payors including commercial insurers and pharmacy benefit managers. While patients prioritize oral convenience and sustained skin clearance over injectable biologics, prescribing dermatologists act as the clinical gatekeepers evaluating therapeutic efficacy benchmarks. Institutional payors ultimately determine commercial uptake through formulary placement, tiering decisions, and restrictive prior authorization protocols. Alumis plans stage-appropriate commercialization infrastructure in the United States while evaluating regional partnership arrangements across European and Asia-Pacific markets to optimize worldwide commercial access."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "clinical-adoption-trajectory-and-exposure"
    title: "Clinical Adoption Trajectory & Patient Exposure"
    body: "Because envudeucitinib remains investigational prior to regulatory approval, adoption trajectory is strictly measurable through clinical trial enrollment, protocol completion, and patient retention across multicenter studies. In pivotal Phase 3 trials Onward1 and Onward2, envudeucitinib demonstrated statistically significant skin clearance, with nearly 60% of patients achieving clear or almost clear skin and 74% exhibiting major clinical improvement by Week 16. In the ongoing ONWARD3 long-term extension study, 773 patients received continuous oral envudeucitinib treatment through up to 48 weeks, demonstrating 75% PASI 90 response and 54% complete skin clearance (PASI 100). This 48-week retention and high rate of complete clearance position envudeucitinib favorably against approved oral standards, providing preliminary clinical evidence of patient persistence before commercial refill adherence and real-world compliance can be evaluated."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-cohorts-and-clinical-proof"
    title: "Named Cohort Proof & Investigational Trial Evidence"
    body: "Named customer proof in pre-commercial biotechnology centers on formal clinical cohorts, investigational clinical sites, and prospective regulatory milestones rather than commercial enterprise purchasing agreements. Alumis's clinical proof rests on the randomized double-blind cohorts of Onward1 and Onward2, alongside the 773-patient ONWARD3 long-term extension evaluating durability across dermatology clinical centers. Supporting pipeline expansion beyond plaque psoriasis, the Phase 2b LUMUS study evaluates oral envudeucitinib in systemic lupus erythematosus, with topline clinical data anticipated in the third quarter of 2026. Alumis fortified its balance sheet with an upsized $345.1 million follow-on offering in 2026, securing financial runway to complete these clinical evaluations and prepare its planned New Drug Application submission to the FDA in the second half of 2026 without immediate commercial financing constraints."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "commercial-access-retention-and-concentration-risks"
    title: "Commercial Journey, Formulary Access & Concentration Dynamics"
    body: "Commercial durability and market expansion for envudeucitinib face substantial payer friction and competitive barriers common to oral autoimmune therapies. Third-party payors increasingly impose stringent prior authorizations and mandatory step-therapy protocols requiring patients to fail cheaper generic or biosimilar agents before accessing branded oral therapies. Furthermore, commercial launch dynamics will compete directly against Bristol Myers Squibb's first-in-class oral TYK2 inhibitor Sotyktu, where commercial uptake illustrates significant physician detailing requirements and payer rebate discounting. Corporate transaction risk also surfaced when activist investor Trium Capital opposed Acelyrin's proposed merger with Alumis, arguing that Alumis's offer carried high clinical risk relative to cash liquidation. Meanwhile, peer comparisons with oncology biotech Celcuity highlight Alumis's -5,933.46% net margin, reflecting substantial pre-revenue operating losses required to advance late-stage clinical programs toward commercial launch."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
