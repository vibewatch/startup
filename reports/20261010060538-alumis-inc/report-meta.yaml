companyProfile:
  summary: >-
    Alumis Inc. is a public, clinical-stage biopharmaceutical company focused on oral TYK2 inhibition for autoimmune and
    immune-mediated diseases. Its lead program, envudeucitinib, has reported strong Phase 3 plaque psoriasis efficacy
    and is targeted for a Q4 2026 FDA NDA submission, while the company also continues to explore broader pipeline
    optionality in lupus and related indications. The business remains pre-commercial and depends on regulatory
    execution, payer access, and disciplined capital deployment.
  headquarters: South San Francisco, CA
