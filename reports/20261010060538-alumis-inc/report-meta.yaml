  topStrengths:
    - Phase 3 ONWARD efficacy is strong enough to support a differentiated oral psoriasis launch thesis.
    - The company still has substantial cash runway into Q4 2027, reducing near-term financing pressure.
    - Multiple pipeline readouts and regulatory milestones can re-rate the story if execution stays on track.
  topRisks:
    - Envudeucitinib remains a single-asset, binary regulatory story with CMC and labeling risk.
    - Commercial adoption will face payer step edits and entrenched competition from Sotyktu and oral IL-23 programs.
    - Operating burn is still high, so launch timing slippage or slower uptake could force additional dilution.
  unresolvedGaps:
