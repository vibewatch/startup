company:
  name: "Alumis Inc."
chapter:
  number: 3
  title: "Competitors"
  summary: "Alumis Inc. is developing envudeucitinib as a potentially best-in-class oral TYK2 inhibitor to challenge Bristol Myers Squibb's commercial first-in-class Sotyktu (deucravacitinib) and Takeda's late-stage pipeline asset zasocitinib (TAK-279) in plaque psoriasis. Across Phase 3 ONWARD trials, envudeucitinib established statistically significant superiority over oral apremilast (p<0.0001) with 48-week ONWARD3 PASI 100 complete skin clearance reaching 54%, positioning the asset to compete against injectable biologics while avoiding traditional black-box JAK warnings. However, commercial adoption requires overcoming aggressive pharmacy benefit manager step-therapy protocols, entrenched biologic franchises from AbbVie and Johnson & Johnson, and pre-commercial cash burn."
sections:
  - id: "landscape-and-competitor-classes"
    title: "Competitive Landscape: Direct Peers, Incumbents, and Emerging Modalities"
    body: "The competitive landscape confronting Alumis Inc. spans direct mechanism-level peers developing oral tyrosine kinase 2 (TYK2) inhibitors, entrenched multi-billion-dollar injectable biologic franchises, and established first-generation oral small molecules. At the mechanism level, Bristol Myers Squibb's Sotyktu (deucravacitinib) represents the commercial benchmark as the first FDA-approved oral TYK2 inhibitor, while Takeda is advancing zasocitinib (TAK-279, acquired from Nimbus Therapeutics) through Phase 3 clinical development. Beyond direct TYK2 competitors, the plaque psoriasis market is heavily dominated by entrenched injectable biologics, led by AbbVie's Skyrizi (risankizumab), Johnson & Johnson's Tremfya (guselkumab), Eli Lilly's Taltz (ixekizumab), and UCB's Bimzelx (bimekizumab). These commercial incumbents possess extensive prescribing relationships across dermatology networks and long-standing payer contracts. In the oral segment, Amgen's Otezla (apremilast), an oral phosphodiesterase-4 (PDE4) inhibitor, remains the entrenched systemic market benchmark prior to biologic escalation, despite delivering modest high-hurdle skin clearance."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
    tableRefs:
      - "TP001"
  - id: "clinical-differentiation-and-efficacy-hurdles"
    title: "Clinical Differentiation, Target Inhibition, and High-Hurdle Skin Clearance"
    body: "Clinical differentiation in plaque psoriasis has shifted decisively from modest PASI 75 responses to high-hurdle endpoints, specifically PASI 90 and complete PASI 100 clearance. In pivotal Phase 3 ONWARD1 and ONWARD2 trials, envudeucitinib met all primary and secondary endpoints with statistical significance, demonstrating superior clearance over active oral comparator apremilast (p<0.0001) at Week 24. On average across both trials, envudeucitinib achieved 74% PASI 75 and 59% sPGA 0/1 at Week 16, deepening to approximately 65% PASI 90 and over 40% PASI 100 at Week 24. Furthermore, in the ONWARD3 long-term extension study, 75% of patients attained PASI 90 and 54% attained complete skin clearance (PASI 100) after 48 weeks of continuous treatment, setting the highest reported oral clearance rate in published psoriasis trials. Mechanistically, allosteric TYK2 inhibition avoids ATP-binding active-site kinase homology, achieving maximal 24-hour target suppression without triggering classic Janus kinase (JAK) toxicities, whereas Sotyktu's label retains warnings regarding potential JAK-related cardiovascular and thrombotic events."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-market-access-and-payer-dynamics"
    title: "Pricing Models, Formulary Access, and Commercial Channel Dynamics"
    body: "Commercializing an oral therapy in dermatology requires navigating aggressive pharmacy benefit manager (PBM) formulary tier structures, mandatory step-therapy protocols, and substantial gross-to-net rebate concessions. Marketed oral comparators establish the pricing environment: BMS lists Sotyktu at approximately $75,000 annually, while Amgen lists Otezla near $48,000 per year, with both manufacturers conceding estimated 40% to 55% rebates to secure preferred commercial formulary positioning. Injectable biologics such as Skyrizi command premium pricing near $79,000 annually and benefit from multi-indication portfolio contracting across AbbVie's immunology franchise. As a clinical-stage biopharmaceutical company without commercial revenue or established field sales infrastructure, Alumis must either build a dedicated U.S. commercial organization or execute co-promotion partnerships to secure formulary placement. Without aggressive rebate parity or clear specialist demand driven by superior PASI 100 clearance, envudeucitinib risks being relegated to second-line oral status behind genericized topicals and established oral systemic agents."
    claimRefs:
      - "CP008"
      - "CP009"
      - "CP014"
    tableRefs:
      - "TP003"
  - id: "moat-durability-and-displacement-risks"
    title: "Moat Durability, Intellectual Property, and Adverse Strategic Risks"
    body: "While envudeucitinib possesses composition-of-matter patent protection and potential patent term restoration under the Hatch-Waxman Amendments, long-term commercial defensibility remains exposed to emerging therapeutic modalities and operational vulnerabilities. Emerging oral candidates, such as Johnson & Johnson's oral IL-23 receptor peptide (icotrokinra / JNJ-2113), have demonstrated encouraging Phase 2 efficacy and could challenge oral TYK2 adoption if Phase 3 data confirm biologic-like clearance. Operationally, Alumis relies exclusively on single-source contract manufacturing organizations in India and Taiwan for active pharmaceutical ingredients, creating supply chain single-point dependencies ahead of commercial scale-up. Financially, independent equity analysis highlights that Alumis generated an operating loss of $417 million over the trailing twelve months and missed Q2 2026 earnings estimates with an EPS of -$1.11 versus -$0.77 expected. In addition, integration overhang and class action litigation related to the ACELYRIN acquisition create ongoing corporate headwinds as the company approaches its planned Q4 2026 New Drug Application submission."
    claimRefs:
      - "CP008"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
