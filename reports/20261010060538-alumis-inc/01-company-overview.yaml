company:
  name: "Alumis Inc."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Alumis Inc. (NASDAQ: ALMS) is a clinical-stage biopharmaceutical company headquartered in South San Francisco developing targeted oral tyrosine kinase 2 (TYK2) inhibitors, led by envudeucitinib (formerly ESK-001) for plaque psoriasis and systemic lupus erythematosus. Founded in January 2021 as FL2021-001 and incubated by Foresite Labs, Alumis has built a late-stage clinical pipeline backed by $569.5 million in cash, cash equivalents, and marketable securities as of March 31, 2026, alongside an upsized $345.1 million follow-on offering."
sections:
  - id: "corporate-identity-and-founding"
    title: "Corporate Identity, Founding History, and Core Platform"
    body: "Alumis Inc. is a clinical-stage biopharmaceutical company focused on identifying, acquiring, and accelerating the development of transformative targeted medicines for autoimmune disorders. The company was incubated by Foresite Labs and originally incorporated in Delaware on January 29, 2021, under the legal name FL2021-001, Inc. It subsequently changed its corporate name to Esker Therapeutics, Inc. in March 2021 before rebranding to Alumis Inc. in January 2022. Operating from its principal executive offices in South San Francisco, California, Alumis applies a proprietary precision data analytics platform and immunology expertise to replace broad immunosuppressive treatments with highly selective allosteric oral therapies. The company completed its initial public offering on the Nasdaq Global Select Market under ticker symbol ALMS in June 2024, followed by an upsized underwritten follow-on offering in 2025. Alumis previously acquired lonigutamab via a strategic merger with ACELYRIN, Inc., though management subsequently initiated a strategic review to explore alternatives for that asset in order to concentrate resources on its core oral TYK2 programs."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance Structure, and Human Capital"
    body: "Alumis is led by President, Chief Executive Officer, and Chairman of the Board Martin Babler, who brings extensive executive leadership experience in commercializing and advancing clinical-stage biopharmaceutical assets. The senior management team includes Chief Scientific Officer David M. Goldstein, Ph.D., Chief Medical Officer Jörn Drappa, M.D., Ph.D., Chief Development Officer Mark Bradley, Chief Business and Strategy Officer Roy Hardiman, Chief Financial Officer John Schroer, and General Counsel Sanam Pangali. The company's corporate governance is overseen by a seven-member Board of Directors, with six independent members including Dr. James B. Tananbaum, founder and CEO of Foresite Capital, Dr. Srinivas Akkaraju of Samsara BioCapital, and Dr. Alan Colowick representing Matrix Capital Management. As of December 31, 2025, Alumis employed 221 full-time employees and 3 part-time employees spanning clinical development, regulatory affairs, research, and corporate functions. Key-person dependence is concentrated in executive scientific and clinical leadership, particularly around ongoing Phase 3 trials and New Drug Application (NDA) filing preparations."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-shareholder-structure"
    title: "Capitalization, Balance Sheet Liquidity, and Ownership Structure"
    body: "Alumis has raised substantial private and public capital to fund the advancement of its clinical pipeline. Prior to its initial public offering, Alumis secured a $259 million Series C venture financing round in March 2024 co-led by Foresite Capital, Samsara BioCapital, and venBio Partners. In 2025, the company completed an upsized follow-on public offering of 20,297,500 shares of common stock at $17.00 per share, generating gross proceeds of $345.1 million with Baird serving as lead manager. As of March 31, 2026, Alumis held $569.5 million in cash, cash equivalents, and marketable securities, providing an operating runway projected into the fourth quarter of 2027. The company's ownership structure is anchored by specialized life sciences institutional investors, including AyurMaya Capital Management Fund (affiliated with Matrix Capital Management), investment entities affiliated with Foresite Capital Management, and Samsara BioCapital, alongside healthcare specialist funds like Baker Brothers Life Sciences."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "clinical-pipeline-and-milestones"
    title: "Clinical Pipeline Progress, Regulatory Roadmap, and Risk Profile"
    body: "The core clinical asset of Alumis is envudeucitinib (formerly ESK-001), a next-generation oral allosteric tyrosine kinase 2 (TYK2) inhibitor precision-engineered for maximal 24-hour target inhibition. In its pivotal Phase 3 ONWARD1 and ONWARD2 trials in moderate-to-severe plaque psoriasis, envudeucitinib met primary endpoints, demonstrating Week 24 PASI 90 response rates of 68.0% and 62.1%, and PASI 100 response rates of 41.0% and 39.5%. In the long-term extension trial ONWARD3, 75% of patients reached PASI 90 and 54% reached complete skin clearance (PASI 100) at 48 weeks, representing the highest reported oral clearance rate in published psoriasis trials. Alumis remains on schedule to submit an NDA to the U.S. FDA in the fourth quarter of 2026. Beyond psoriasis, envudeucitinib is being evaluated in systemic lupus erythematosus (SLE) in the Phase 2b LUMUS trial, while a central nervous system penetrant TYK2 inhibitor, A-005, is progressing toward Phase 2 trials in Parkinson's disease. On the adverse front, Alumis faces ongoing class action litigation stemming from its merger with ACELYRIN regarding historical trial disclosures, as well as binary clinical and regulatory approval risks."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
