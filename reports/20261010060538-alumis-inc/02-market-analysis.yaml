company:
  name: "Alumis Inc."
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Alumis targets high-value autoimmune markets led by moderate-to-severe plaque psoriasis, where envudeucitinib's Phase 3 skin clearance data establishes a differentiated oral profile against first-generation TYK2 inhibitor deucravacitinib. The commercial addressable market is governed by strict PBM formulary tiering, biologic step edits, and emerging oral competition, making rapid execution toward its H2 2026 FDA New Drug Application submission critical."
sections:
  - id: "market-definition-and-boundaries"
    title: "Therapeutic Scope and Boundary Definitions"
    body: "The core commercial opportunity for Alumis Inc. centers on precision oral therapies for immune-mediated inflammatory diseases, with an initial clinical focus on moderate-to-severe plaque psoriasis and systemic lupus erythematosus. Within plaque psoriasis, the relevant market boundary encompasses patients qualifying for systemic therapy, specifically those with extensive disease involvement who are candidates for oral small molecules or biologic injectables. Excluded from this addressable spend are mild psoriasis cases managed adequately with topical corticosteroids, generic keratolytic agents, or localized phototherapy. Secondary boundary expansions include systemic lupus erythematosus, a severe systemic autoimmune disorder with limited approved targeted options, and prioritized pipeline adjacencies in Sjögren's disease and cutaneous lupus erythematosus. Long-term optionality extends to central nervous system neuroinflammatory disorders through investigational candidate A-005, though commercial boundaries for neurodegenerative indications remain exploratory."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM001"
  - id: "addressable-market-sizing-and-lenses"
    title: "Market Sizing Lenses and Patient Stratification"
    body: "Evaluating the commercial potential of envudeucitinib requires decomposing aggregate disease expenditures into realistic adoption lenses. While total global psoriasis therapeutic spend represents a multi-billion-dollar category, the contested space for oral TYK2 inhibitors is constrained by entrenched biologic therapies, including IL-23, IL-17, and TNF-alpha inhibitors that dominate severe maintenance treatment. In Phase 3 ONWARD1 and ONWARD2 trials, envudeucitinib demonstrated an average of 74% PASI 75 and 59% sPGA 0/1 at Week 16, deepening to approximately 65% PASI 90 and over 40% PASI 100 at Week 24. Furthermore, 48-week ONWARD3 extension results confirmed 75% PASI 90 and 54% PASI 100, delivering clinical clearance metrics that rival injectable biologics. This high-clearance hurdle allows Alumis to target both biologic-naive patients desiring oral administration and needle-hesitant patients failing older orals like apremilast. Capitalization of $345.1 million raised in an underwritten offering provides essential financial runway to prepare commercial scale-up."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM006"
      - "CM007"
      - "CM011"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "stakeholder-dynamics-and-reimbursement"
    title: "Buyer, Prescriber, and Payer Adoption Mechanics"
    body: "Commercial conversion in targeted autoimmune indications is governed by a tripartite stakeholder relationship spanning prescribers, patients, and pharmacy benefit managers. In moderate-to-severe plaque psoriasis, high-volume dermatologists serve as the primary clinical decision-makers, balancing efficacy endpoints against adverse event monitoring. In systemic lupus erythematosus, specialized rheumatologists dictate adoption based on organ preservation and reduction in corticosteroid dependence. However, the ultimate economic gatekeeper remains third-party commercial payers and pharmacy benefit managers. U.S. commercial reimbursement requires navigating formulary tiering, prior authorization protocols, and mandatory step edits through generic disease-modifying antirheumatic drugs or older oral options before access to novel branded specialty therapies is granted. Furthermore, federal health policy mechanisms including Medicare inflation rebates enforce persistent downward pricing discipline across the branded specialty immunology sector."
    claimRefs:
      - "CM001"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM003"
  - id: "adoption-drivers-constraints-and-diligence-gaps"
    title: "Commercial Drivers, Adoption Bottlenecks, and Critical Gaps"
    body: "The principal growth driver for envudeucitinib is patient and physician preference for a highly effective, once-daily oral pill that avoids the logistical friction, injection-site pain, and cold-chain storage of subcutaneous biologics. Conversely, commercial adoption faces three critical constraints: incumbent commercial resistance from Bristol Myers Squibb's first-generation TYK2 inhibitor Sotyktu (deucravacitinib), threat of next-generation oral IL-23 peptides entering late-stage development, and unconfirmed commercial payer net pricing. Alumis plans to submit its New Drug Application to the FDA in the fourth quarter of 2026, yet key commercial diligence gaps remain unresolved. Crucially, Alumis has not publicly disclosed its expected gross-to-net discount strategy, formulary co-pay assistance structure, or specific step-therapy positioning relative to Sotyktu, leaving final commercial net revenue realization contingent on post-approval payer contract execution."
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM007"
      - "CM012"
      - "CM013"
