company:
  name: "Alumis Inc."
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Alumis is advancing a clinical-stage pipeline of oral allosteric TYK2 inhibitors led by envudeucitinib, which demonstrated an industry-leading 54% PASI 100 complete skin clearance rate at Week 48 in the Phase 3 ONWARD program for plaque psoriasis. With an NDA submission planned for Q4 2026, pipeline expansion into systemic lupus erythematosus and neuroinflammatory diseases via A-005, and $345.1 million in fresh follow-on proceeds, Alumis operates an asset-centric discovery model that depends on qualified contract manufacturers across Taiwan and India."
sections:
  - id: "section-pipeline-portfolio"
    title: "Clinical-Stage Pipeline Architecture and Asset Portfolio"
    body: "Alumis focuses on developing precision-engineered oral therapies for immune-mediated diseases, anchored by its two proprietary allosteric Tyrosine Kinase 2 (TYK2) inhibitors: lead candidate envudeucitinib (formerly ESK-001) and central nervous system (CNS) penetrant molecule A-005. Envudeucitinib is designed to maximize 24-hour target inhibition while maintaining favorable tolerability without broad immunosuppression. Beyond plaque psoriasis and systemic lupus erythematosus, Alumis is evaluating additional indications for envudeucitinib in Sjogren's disease and cutaneous lupus erythematosus, while progressing A-005 toward a Phase 2 trial in Parkinson's disease. The company further diversified its clinical pipeline through the acquisition of lonigutamab, a subcutaneously delivered anti-IGF-1R monoclonal antibody for thyroid eye disease, establishing a multi-asset autoimmune franchise."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE008
      - CE013
      - CE014
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: "section-mechanism-and-differentiation"
    title: "Biochemical Mechanism of Action and Clinical Differentiation"
    body: "Envudeucitinib achieves biological differentiation through allosteric inhibition of the TYK2 regulatory pseudokinase (JH2) domain, rather than competing at the highly conserved ATP-binding catalytic site utilized by traditional Janus kinase (JAK) inhibitors. This mechanism provides intrinsic selectivity over JAK1, JAK2, and JAK3, preventing downstream hematological and cardiovascular toxicities that carry FDA black-box warnings for non-selective JAK inhibitors. In the pivotal Phase 3 ONWARD clinical program, envudeucitinib achieved a 54% PASI 100 complete skin clearance rate at Week 48 alongside 75% PASI 90 clearance, setting a high efficacy benchmark among oral psoriasis therapies. Furthermore, clinical trials demonstrated over 80% scalp clearance and rapid itch resolution with low incidence of drug-related skin rash, demonstrating that cutaneous adverse events are not an unavoidable class effect of sustained TYK2 pathway shutdown."
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE011
      - CE013
    tableRefs:
      - TE002
  - id: "section-operating-architecture-and-supply-chain"
    title: "Operating Architecture, Chemical Synthesis, and Supply Chain Vulnerabilities"
    body: "Alumis maintains an asset-centric operating architecture that leverages its proprietary precision data analytics platform for target validation and clinical biomarker selection while outsourcing physical manufacturing entirely to third parties. Envudeucitinib and A-005 are small molecule chemical compounds synthesized from standard starting materials via reproducible chemical processes. However, the company operates without internal production facilities, purchasing active pharmaceutical ingredients (API) and bulk drug product on a purchase-order basis from dedicated contract development and manufacturing organizations (CDMOs). Key raw materials and chemical intermediates originate from single-source suppliers located in India and Taiwan. While Alumis is actively qualifying redundant suppliers ahead of commercialization, the absence of binding long-term commercial supply agreements creates exposure to international trade policy shifts, shipping bottlenecks, and facility cGMP inspection delays."
    claimRefs:
      - CE001
      - CE005
      - CE009
      - CE010
    tableRefs:
      - TE003
  - id: "section-intellectual-property-and-regulatory-milestones"
    title: "Intellectual Property Fortress, Regulatory Roadmap, and Diligence Blockers"
    body: "The proprietary foundation of Alumis rests on its intellectual property portfolio and clinical trial execution. Alumis holds solely owned composition-of-matter and method-of-use patent families covering envudeucitinib and A-005 with statutory expirations projected to 2039, complemented by pending PCT and foreign applications extending protections to 2045. On the regulatory horizon, Alumis remains on schedule to submit its New Drug Application (NDA) for envudeucitinib in plaque psoriasis to the FDA in the fourth quarter of 2026. Financial runway to execute these milestones was bolstered by an upsized $345.1 million follow-on offering in 2026. Nonetheless, critical diligence questions persist regarding pre-NDA readiness: Alumis has not yet disclosed public confirmation of chemistry, manufacturing, and controls (CMC) validation batch readiness, formal agreement on pediatric study waivers, or final commercial packaging specifications required for immediate post-approval distribution."
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE012
