  topStrengths:
    - ONWARD 3 期疗效足以支撑差异化口服银屑病药物的上市逻辑。
    - 公司现金续航仍可覆盖至 2027 年第四季度，缓解了近期融资压力。
    - 只要执行不掉链子，多项管线读出和监管里程碑就可能推动市场重估这家公司。
  topRisks:
    - Envudeucitinib 仍是单一资产、结果高度二元的监管故事，面临 CMC 和标签风险。
    - 商业化采用会受到支付方阶梯治疗要求，以及 Sotyktu 和口服 IL-23 项目的强势竞争影响。
    - 运营消耗仍然很高，上市延期或市场吸收速度放缓都可能迫使公司进一步稀释股权。
  unresolvedGaps:
    - CMC 资料包的完整性：目前仍缺乏公开确认，无法判断 NDA 是否就绪、商业批次收率是否经过验证，以及供应链是否准备妥当。
    - 商业定价和目录准入：净定价、返利策略和 PBM 目录层级仍未披露。
    - 竞争时间表：Takeda 尚未确认 zasocitinib 提交 NDA 的确切日期，因此先发优势仍不确定。
