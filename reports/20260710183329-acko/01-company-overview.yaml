callouts:
- calloutType: strength
  title: Acko has moved beyond a single-line motor story
  body: Public sources support that Acko is no longer only a digital motor insurer. It now spans health, life, travel, and embedded EV-linked distribution, which broadens both revenue opportunity and underwriting complexity.
  claimRefs:
  - CO002
  - CO005
  - CO030
  - CO032
  - CO040
- calloutType: risk
  title: Entity scope and funding math are still not clean enough for blind underwriting
  body: The strongest caution signal in chapter 1 is not a lack of growth but a lack of perfectly reconciled scope. Public sources disagree on total capital raised and on which revenue number belongs to which Acko entity, so diligence should demand a clean bridge before investment.
  claimRefs:
  - CO006
  - CO007
  - CO017
  - CO018
  - CO019
  - CO041
- calloutType: risk
  title: The 2025 IRDAI penalty is a real governance flag, not a trivial footnote
  body: The Rs 1 crore penalty tied to Ola Financial Services did not invalidate policies, but it does show that Acko’s growth model has already collided with regulator expectations on distribution, outsourcing, and remuneration practices.
  claimRefs:
  - CO027
  - CO028
  - CO035
- calloutType: insight
  title: Embedded distribution is becoming more strategic than mere lead generation
  body: 'Mygate and Tesla show two different embedded motions: one uses a household platform to cross-sell everyday insurance, while the other uses the OEM journey to redesign EV insurance economics and claims workflows.'
  claimRefs:
  - CO029
  - CO030
  - CO031
