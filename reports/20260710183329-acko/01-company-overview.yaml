  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current, company-confirmed group headcount and entity-level employee split.
    whyItMatters: IPO readiness, cost discipline, and layoff sensitivity cannot be underwritten cleanly without a verified employee base.
    diligencePath: Request an org chart and monthly headcount bridge from management, then reconcile it to payroll and annual-report disclosures.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: revenue-scope
    missingEvidence: A bridge reconciling group revenue, ACKO General revenue, and any holding-company or service-entity revenue lines.
    whyItMatters: Valuation, profitability, and margin analysis can be materially distorted if entity-scope differences are ignored.
    diligencePath: Obtain FY25 and FY26 consolidated audited financial statements plus legal-entity revenue mapping.
    relatedQuestionRefs:
    - QO015
    - QO025
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: The exact July 2025 round size, terms, investor allocations, and preference stack.
    whyItMatters: The difference between disclosed funding trackers and IPO target valuation leaves dilution and downside-protection risk unclear.
    diligencePath: Request the latest cap table, shareholder agreement summary, and round-closing board minutes.
    relatedQuestionRefs:
    - QO011
    - QO012
    - QO013
    relatedTableRefs:
    - TO003
  - type: stale
    severity: minor
    topic: scale-denominator
    missingEvidence: Methodology for “users”, “unique customers”, and “policies issued” across the company’s public scale claims.
    whyItMatters: Without denominator definitions, growth and retention comparisons across sources can overstate practical customer depth.
    diligencePath: Ask management for metric definitions, de-duplication logic, and a cohort bridge by product line.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO005
