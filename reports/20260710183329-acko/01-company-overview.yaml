company:
  name: Acko
chapter:
  number: 1
  title: Company Overview
  summary: Acko is a Bengaluru-headquartered digital insurer founded by Varun Dua in 2016 that now spans motor, health, life, and travel insurance with an explicitly direct-to-consumer operating model. Public evidence supports strong scale, embedded distribution, and improving insurance-entity economics, but the broader group revenue base, exact cap-table math, and the regulatory overhang from a 2025 IRDAI penalty remain important diligence qualifiers.
sections:
- id: identity-and-scope
  title: Identity, headquarters, and what Acko sells
  body: 'Acko is best understood as a full-stack digital insurer rather than a comparison-led distributor. Official company pages say the business was founded by Varun Dua to remove paperwork, simplify claims, and use technology to make insurance easier to buy and use. By 2026, public company and media descriptions consistently place the product set across motor, two-wheeler, health, travel, and life insurance, with the direct customer relationship positioned as a core differentiator. That direct posture matters because Acko is not describing itself as a marketplace that merely routes leads to legacy insurers; it is underwriting through licensed insurance entities and using its own digital workflow to sell, service, and claims-manage policies. The regulated footprint also expanded over time: ET described the general-insurance licence as a 2017 event and the life-insurance licence as a 2023 event, while Acko Life’s own disclosures identify registration number 164 dated 31 March 2023. Public
    filings and grievance pages anchor the operating base in Bengaluru, especially the HSR Layout address that appears across annual-report and life-service documents.'
  claimRefs:
