- id: milestones-partnerships-and-adverse-items
  title: Milestones, partnerships, and adverse items
  body: 'The milestone record supports a clear pattern: Acko used motor insurance as the beachhead, expanded into health and life, and then pushed deeper into embedded and OEM-linked distribution while preparing for public markets. Moneycontrol ties the health push to March 2023 and the life-insurance move to 2023 after licence approval. Product and channel expansion continued in 2025 and 2026. ET’s Mygate article says the housing-society app integrated Acko products for four million households and planned to extend beyond motor into health and life. Business Standard and Moneycontrol both describe Tesla-linked insurance as an embedded, digital quote-to-claim experience and a launchpad for EV-specific add-ons, telematics trials, and usage-based insurance experiments. Against those positives sit two diligence flags. First, IRDAI imposed a Rs 1 crore penalty on ACKO General Insurance in May 2025 for outsourcing and commission violations tied to Ola Financial Services, with the regulator ordering
    a board review and action-taken report. Second, skeptical IPO commentary continues to frame the expenses-of-management dispute and public-market readiness as unresolved until the eventual DRHP clarifies them. Those issues do not negate Acko’s progress, but they materially shape how the company should be underwritten.'
