- id: leadership-governance-and-ownership
  title: Leadership, governance, and ownership structure
  body: 'Governance at Acko is still founder-centric, but the public record shows a business that has become substantially more institutional. The Acko Technology and Services board page names Varun Dua as managing director and chief executive officer, while the same page lists a mix of investor-linked and independent directors including Binny Bansal, Mridul Arora, Nithya Easwaran, Shantanu Rastogi, Abhinav Chaturvedi, Rajat Mangla, Animesh Das, Chengalath Jayaram, N. V. Sivakumar, and Rohini Srivathsa. The 2024-25 annual report for ACKO General Insurance adds an entity-level governance overlay: it says the insurer is a wholly owned subsidiary of Acko Technology and Services Private Limited, notes a paid-up capital base of Rs 2,796 crore after a large FY25 share allotment, and records independent-director and audit-governance processes required for a licensed insurer. Leadership also broadened ahead of IPO preparation. Moneycontrol reported in June 2026 that Acko appointed Apoorv Kalra,
    Kunal Kapur, Vivek Sharma, and Neha Gupta to integrate product, business, and customer-experience ownership more tightly. Acko Life meanwhile has a separate operating head, with its board page identifying Nitin Kumar Gupta as managing director and chief executive officer. The result is a group that still depends heavily on Varun Dua’s strategic judgment, but no longer looks like a lightly governed venture shell.'
