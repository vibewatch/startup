  topStrengths:
    - >-
      Acko has real operating scale, with public sources supporting multi-thousand-crore premium or revenue anchors,
      tens of millions of customers, and meaningful growth across motor and health.
    - >-
      The product is broader than a motor-insurance app, combining direct underwriting, a large mobile surface,
      group-health workflows, and embedded API distribution.
    - >-
      Financial direction is improving at the regulated insurer level, with materially narrower losses and adequate
      solvency entering the IPO preparation window.
  topRisks:
    - >-
      Governance remains the clearest objective overhang because the 2025 IRDAI order and still-live 2026 SAT process
      raise control and oversight questions.
    - >-
      Public customer evidence is polarized, with strong app-store ratings but visible complaint tails around claims
      handling, onboarding, and support ownership.
    - >-
      The current IPO range already assumes meaningful execution and disclosure improvement, leaving limited room for
      error if unit economics or market conditions disappoint.
  unresolvedGaps:
    - Public sources do not reconcile ACKO General, ACKO Life, and wider group financial scope cleanly.
    - Line-level loss ratios, channel CAC, partner concentration, and renewal economics remain undisclosed.
    - Claims-quality distributions, grievance rates by product, and retention by cohort are not publicly available.
    - Board-level remediation evidence tied to the 2025 regulatory findings is still not public in sufficient detail.
