summary:
  headline: >-
    Acko has built a strategically relevant digital-insurance platform with credible scale, improving financial
    direction, and a real embedded-distribution edge, but public evidence still shows governance overhang, customer-tail
    risk, and incomplete unit-economics disclosure, so the current IPO range belongs on a conditional watchlist rather
    than in the portfolio.
