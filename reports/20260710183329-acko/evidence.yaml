    severity: material
    topic: revenue-scope
    missingEvidence: A bridge reconciling group revenue, ACKO General revenue, and any holding-company or service-entity revenue lines.
    whyItMatters: Valuation, profitability, and margin analysis can be materially distorted if entity-scope differences are ignored.
    diligencePath: Obtain FY25 and FY26 consolidated audited financial statements plus legal-entity revenue mapping.
    relatedQuestionRefs:
      - QO015
      - QO025
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: The exact July 2025 round size, terms, investor allocations, and preference stack.
    whyItMatters: >-
