evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current, company-confirmed group headcount and entity-level employee split.
    whyItMatters: >-
      IPO readiness, cost discipline, and layoff sensitivity cannot be underwritten cleanly without a verified employee
      base.
    diligencePath: >-
      Request an org chart and monthly headcount bridge from management, then reconcile it to payroll and annual-report
      disclosures.
