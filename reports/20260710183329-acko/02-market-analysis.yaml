callouts:
- calloutType: insight
  title: Acko’s real market is the digital-insurance workflow, not the whole Indian insurance sector
  body: The broad sector is enormous, but the actionable opportunity is the portion of motor, health, travel, and protection demand that can be won through direct or embedded digital journeys and then serviced profitably.
  claimRefs:
  - CM001
  - CM004
  - CM005
  - CM017
- calloutType: strength
  title: Health and embedded channels create real room for expansion beyond auto insurance
  body: Health’s rise above motor in non-life, plus channels like Mygate and Tesla, suggests Acko can grow in the market without relying on only one legacy motor-renewal playbook.
  claimRefs:
  - CM009
  - CM011
  - CM012
  - CM023
  - CM027
- calloutType: risk
  title: Large market size does not remove underwriting and trust constraints
