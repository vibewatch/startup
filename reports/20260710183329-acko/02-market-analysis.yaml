  evidenceGaps:
  - type: missing-source
    severity: material
    topic: embedded insurance sam
    missingEvidence: A quantified public estimate for India’s embedded-insurance premium pool segmented by motor, travel, health, and partner type.
    whyItMatters: Acko’s strategy depends heavily on embedded and partner-led acquisition, but public sources only prove examples, not category size.
    diligencePath: Request channel GMV, quote-to-bind conversion, renewal, and partner economics from management or a specialized sector study.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: digital channel share
    missingEvidence: A regulator-grade breakdown of how much non-life premium is originated through direct digital, broker, web-aggregator, OEM, and offline-agent channels.
    whyItMatters: Without channel-share data, SAM sizing and competitive intensity can be overstated or understated.
    diligencePath: Pull IRDAI channel statements or request an internal Acko market map by line and channel.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: channel profitability
    missingEvidence: Contribution margin, CAC, renewal, and loss-ratio data by Acko channel and product line.
    whyItMatters: The market looks large, but value capture depends on profitable underwriting and renewal economics rather than premium volume alone.
    diligencePath: Request cohort and unit-economics data for D2C, embedded, and life channels.
    relatedQuestionRefs:
    - QM020
    - QM025
  - type: stale
