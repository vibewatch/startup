- id: market-size-and-sam-lenses
  title: Market size, SAM lenses, and where the real spend sits
  body: 'Headline Indian insurance numbers are large enough to tempt lazy TAM thinking, so the useful discipline is to break the market into layers. IBEF says the Indian insurance industry is projected to reach about Rs 19,30,290 crore by FY26 and that total premium income reached roughly Rs 7.05 lakh crore in FY25. For Acko, however, non-life is the nearer operating pool. IBEF puts non-life gross direct premiums at Rs 307,611 crore in FY25, while Financial Express says the industry closed FY26 at Rs 3.36 lakh crore, up 9 percent year on year. That pool is also rebalancing internally: IBEF says health became 41 percent of the non-life market in FY25, overtaking motor, and puts health gross premiums at Rs 127,417 crore in FY25. Motor remains strategically important because it is still a large, digitizable retail line and IBEF projects the motor-insurance market to grow from Rs 1,12,867 crore in 2025 to Rs 1,83,204 crore by 2030. Acko’s practical SAM is narrower still: the portion of motor
    and health that can be priced, sold, renewed, and claimed through digital and embedded journeys with acceptable loss ratios. That is substantial, but it is not the whole Indian insurance market, and the investment case should stay anchored to that narrower lens.'
