- id: buyers-users-and-adoption-path
  title: Buyers, users, payers, and the adoption path
  body: 'The buyer journey in Indian insurance is not uniform across Acko’s lines. For personal motor, the buyer, user, and payer are often the same individual or household, but the moment of purchase can be direct, broker-assisted, or embedded inside vehicle purchase and renewal flows. For health insurance, the decision often blends a household protection need with tax planning, medical-cost anxiety, and trust in claims. Embedded distribution creates another segment entirely: partners such as Tesla and Mygate turn insurance into an extension of a broader purchase or platform workflow rather than a standalone research project. That matters because Acko’s model depends on acquiring intent at the right moment. Moneycontrol and ET show that channel logic directly in the Tesla and Mygate cases, while Business Today explains the internal economic rationale of the direct model: no intermediary commissions, tighter product design, and more control over claims experience. The adoption path is also
    shaped by digital comparison norms. Policybazaar, Paytm Insurance, InsuranceDekho, and Turtlemint all sell some variant of easier comparison, advisor assistance, or digitally assisted purchase. In other words, the market has already taught Indian consumers to expect low-friction insurance discovery. Acko’s challenge is not creating digital demand from scratch; it is converting that demand into underwriting economics and retention that are better than what comparison and broker platforms can support.'
