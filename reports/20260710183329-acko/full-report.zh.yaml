      - number: '1.3'
        title: 融资历史、估值信号和规模口径
        blocks:
          - type: paragraph
            body: >-
              Acko 的资本叙事异常嘈杂，因为不同公开来源似乎在描述集团的不同范围。较清楚的一端是近期 IPO 预热。Moneycontrol 和 ET 都称，公司已聘请 ICICI Securities、Morgan
              Stanley 和 Kotak Securities 推进拟议上市，并瞄准约 $2 billion 至 $2.5 billion 估值。ET 的 IPO 报道称，最近已知估值约 $1.4
              billion，投资人累计投入超过 $583 million；Inc42 当前公司档案显示最近融资发生在 29 July 2025，总融资超过 $458 million。Moneycontrol
              的外部估算较低但接近，称 Acko 已融资约 $450 million 至 $460
              million。这些差异不小，可能反映了已披露股权轮、追踪库估算和更宽集团融资之间的界线。规模口径同样宽泛，但方向上很强。Moneycontrol 称 Acko 已向超过 78 million 名唯一客户签发超过
              1 billion 份保单，而 Acko 自己的董事会页面用更宽表述称产品获得超过 100 million 用户信任。这些应被视为覆盖面很大的证据，而不是完全可调节的分母。
