      - number: '8.2'
        title: 融资背景说明，公司想让公开市场投资者为执行成果买单
        blocks:
          - type: paragraph
            body: >-
              公开来源对融资故事的大方向基本一致，但部分跟踪数字并不相同。Moneycontrol、ET、Outlook Business、Times of India、TradeUnlisted 和 KotakNeo
              都指向约 $2.0-$2.5 billion 的 IPO 目标，部分报道提到约 $300-$400 million 的募资额和 2027 年初上市时点。Inc42 的公司页和融资页显示历史融资超过 $458
              million，并标出 2025 年 7 月一轮未披露金额的后期融资。最后一个被广泛引用的私募估值约为 $1.4 billion，这意味着在市场看到完整 DRHP
              级披露之前，当前公开市场目标需要一次明显估值跃升。最有用的可比视角不是假精确的 DCF，而是里程碑参照和上市同业的组合。PB Fintech 在 Moneycontrol 上约 ₹73,124 crore
              的市值，展示了上市数字分销规模可能长什么样；Go Digit 的市值页显示约 $3.02 billion 或 ₹279 billion。这些参照不会自动证明 Acko 便宜或昂贵，但说明目标区间已经把 Acko
              放进严肃的上市同业比较，而它的披露深度还没跟上。
