  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、保费规模，以及公开数字到底衡量什么
        blocks:
          - type: paragraph
            body: >-
              Acko 主要靠保险承保变现，而不是纯线索生成或经纪模式，因此保费增长和赔付质量比表层流量更重要。公开记录至少分成两个口径。在受监管保险公司层面，ACKO General Insurance 的 FY25
              年报显示总承保保费为 Rs 2,064.67 crore，总收入为 Rs 1,737.77 crore。在更宽集团层面，ET 和 Moneycontrol 根据 MCA 备案报道 FY25 收入接近 Rs
              2,836-2,887 crore，净亏损约 Rs 424 crore，这可能覆盖了比单体 GI 实体更宽的 Acko
              范围。最有用的结论不是选一个数字、忽略另一个，而是把口径差异明确保留。产品组合也影响这些总数。Business Today 和 Moneycontrol 都把车险描述为当前组合约 40
              percent，健康险成为第二大消费者险种，EV 专属车险则通过 Tesla 关联分销出现。这意味着 Acko 的收入模式仍由保费驱动、按风险定价，但正变得多险种化，不再依赖单一传统车险续保引擎。
