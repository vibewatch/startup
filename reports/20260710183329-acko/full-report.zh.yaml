      - number: '2.4'
        title: 增长驱动、采用加速器，以及仍可能出错的地方
        blocks:
          - type: paragraph
            body: >-
              几股结构性力量仍支撑 Acko 所在市场增长。IBEF 强调保险意识提升、政策支持有利、私营部门参与度上升、数字分销以及 tier-II/III 扩张。它还指出 FY25 新保费中 62 percent
              来自较小城市，纯数字 保险公司和聚合器正在为此前渗透不足的人群打开新入口。IBEF 和政策报道还指向两个尤其与 Acko 相关的催化剂：健康险成为最大非寿险板块，以及 Bima Sugam
              作为全国数字市场平台启动，可能让在线比价和服务常态化。但同一市场也有真实约束。ICRA 称，定价纪律对 GDPI
              恢复和综合成本率改善至关重要，说明市场增长并不自动等于健康承保。创业阶段数字保险公司仍需要资本缓冲、强理赔控制和监管信心。Moneycontrol
              的寿险战略报道补充了另一项约束：误导销售投诉仍然高企，这意味着消费者信任和监管审视与分销触达同等重要。最后，市占率数据提醒投资人：市场很大但拥挤。October 2025 快报显示，Acko
              在一般保险市场的份额只有 0.72 percent，而资本更厚的存量公司和上市同行仍大出数倍。增长存在，但不会无摩擦。
