      - number: '5.3'
        title: 嵌入式保险和 API 集成是核心产品架构选择
        blocks:
          - type: paragraph
            body: >-
              Acko 的合作伙伴页面相当能说明公司的产品架构。页面称，企业可以用 RESTful APIs 在一天内上线保险，获得定制方案，并提供无纸化理赔体验。页面还描述了具体嵌入式产品，例如面向借贷合作伙伴的
              信用保障保险、面向地面车队的 GIG 保险，以及面向 Goibibo、RedBus、EaseMyTrip、OLA 和 OYO 等消费者平台的旅行险。这些不是普通联合营销关系；它们意味着 Acko
              已构建可配置的保单、理赔和服务基础能力，能够插入合作伙伴流程。ET 和 Moneycontrol 关于 Mygate 和 Tesla 关联分销的报道进一步证明，Acko 用产品设计在交易时点捕捉意图。这种 API
              优先、嵌入式姿态，可能是公司最有防御性的产品技术选择，因为它能同时塑造获客和服务经济性。主要尽调问题是，集成速度和合作伙伴满意度的主张能否在大型合作伙伴和理赔密集队列中持续成立。
