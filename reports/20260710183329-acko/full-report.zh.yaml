    rows:
      - - 数字化承保叠加嵌入式分销，可能跑出结构性更好的经济性
        - 正论点
        - Acko 在同一套栈上控制产品、定价和理赔
        - 需要险种级续保和利润率证据
      - - 健康险扩张在车险之外提供第二个大型增长引擎
        - 正论点
