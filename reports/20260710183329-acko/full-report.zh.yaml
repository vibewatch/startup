      - number: '3.3'
        title: 定价、分销权力、切换成本和多栖风险
        blocks:
          - type: paragraph
            body: >-
              印度保险的竞争压力被报价点的低切换成本放大。聚合器让多栖成为常态：Policybazaar、Paytm、Turtlemint 和 InsuranceDekho
              都教客户比较合作方，而不是承诺给单一承保公司。Acko 的反击是在比价变成商品化动作之前，在自有或嵌入式时刻捕捉需求，例如 OEM 关联 EV 销售或 App
              化合作伙伴生态。逻辑成立，但并不能改变一个事实：多数车险和健康险买家在续保时、甚至在同一次搜索会话中，只要另一家保险公司或经纪商 给出稍好套餐，就能切换。传统公司也在附加险、维修厂和信任标记上激烈竞争：HDFC
              ERGO 宣传 12,200+ 家无现金维修厂，Bajaj 宣传 7,200+ 家，Digit 宣传 10,000+ 家，并强调已售 1.5 crore
              份保单。这些规模信号重要，因为在高价值或理赔后购买决策中，网络深度和理赔熟悉度可能压过边际价格优势。
