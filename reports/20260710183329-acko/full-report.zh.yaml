      - number: '5.2'
        title: App 是产品界面，不只是保单容器
        blocks:
          - type: paragraph
            body: >-
              公开来源中最强的产品信号是，Acko 的 App 被设计成运营界面，而不是静态保单柜。App 列表描述了购买、管理、续保和理赔流程；合作伙伴保单访问；报价生成；即时续保；以及罚单查询、FASTag 充值、PUC
              提醒、二手车估值查询和 EV 充电桩搜索等车辆辅助工具。这种组合显示，公司有意把用户触点从理赔日之外继续拉高。理赔体验是该策略的核心。App
              文案称，小额车险理赔可以即时结算，重大损伤则按保单条款触发取车、维修和三天内返还。合作伙伴页面另称，Acko 提供三步理赔流程、实时跟踪和 3-5 个工作日周转。健康险和团体产品中，Acko
              强调无纸化理赔、无现金医院和快速预授权。公开证据仍主要来自公司自身，但设计意图很清楚：把保险摩擦压缩进 App 原生流程。
