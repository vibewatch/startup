  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和治理风险是最清楚的硬性公开压力
        blocks:
          - type: paragraph
            body: >-
              最具体的公开风险是监管。May 2025 的 IRDAI 命令不是模糊声誉噪音，而是一份正式执法文件，列明与外包、佣金和尽职调查失败有关的违规。该命令明确提到向 Ola Financial Services
              支付款项，质疑该供应商是否具备合法技术或广告能力，并称保险公司未能证明外包委员会有充分监督，也缺少文件支持。公开新闻报道和二级解读把它压缩成 Rs 1 crore 罚款标题，但真正问题是治理成熟度。Indian
              Kanoon 记录进一步显示，Acko 到 March 2026 仍在 Securities Appellate Tribunal 上诉流程中，临时救济仍然延续。这意味着 IPO
              准备期间，该事项仍未结束。对私营成长公司来说，这类问题或许可以承受；但对一家销售信任产品的公开市场候选公司来说，它会更尖锐地追问控制文化、合作伙伴治理，以及快速增长是否跑在合规纪律前面。
