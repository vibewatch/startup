      - number: '2.2'
        title: 市场规模、SAM 镜头，以及真实支出在哪里
        blocks:
          - type: paragraph
            body: >-
              印度保险头部数字足够大，容易诱发懒惰 TAM 思维，因此有用的纪律是把市场拆成层。IBEF 称，印度保险业预计到 FY26 达到约 Rs 19,30,290 crore，FY25 总保费收入约 Rs 7.05
              lakh crore。但对 Acko 来说，非寿险是更近的经营池。IBEF 估算 FY25 非寿险总直接保费为 Rs 307,611 crore，Financial Express 称行业 FY26 收于 Rs
              3.36 lakh crore，同比增长 9 percent。这个池子内部也在再平衡：IBEF 称健康险在 FY25 成为非寿险市场的 41 percent，超过车险，并将 FY25 健康险总保费列为 Rs
              127,417 crore。车险仍具战略重要性，因为它仍是规模大、可数字化的零售险种；IBEF 预计车险市场从 2025 年 Rs 1,12,867 crore 增至 2030 年 Rs 1,83,204
              crore。Acko 的实际 SAM 还要更窄：车险和健康险中，能够通过数字化和嵌入式旅程定价、销售、续保和理赔，且赔付率可接受的部分。这个机会不小，但不是整个印度保险市场，投资论证应锚定这个更窄镜头。
