companyProfile:
  summary: >-
    Acko 是一家与 Bengaluru、Mumbai 均有运营关联的印度数字化保险公司，2016 年由 Varun Dua
    创立并由其领导。公司先在车险做出早期规模，随后扩展到健康险、旅行险、团体健康、重大疾病险和定期寿险，同时在旅行、借贷、社区和出行流程中搭建嵌入式合作伙伴分销层。公开来源支持 Acko 已有可观保费规模、数千万客户、庞大 App
    足迹，GI 实体财务方向也在改善。承保问题不再是 Acko 是否有战略意义；而是治理、客户支持质量和分险种经济性是否足以支撑公开市场的溢价估值。
  foundedDate: '2016-01-01'
  founders:
