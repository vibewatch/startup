      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              印度保险的买方旅程在 Acko 各险种之间并不一致。个人车险中，购买者、使用者和支付者通常是同一个个人或家庭，但购买时点可能是直接购买、经纪商
              协助，或嵌入在车辆购买和续保流程里。健康险决策往往混合了家庭保障需求、税务规划、医疗费用焦虑和对理赔的信任。嵌入式分销又创造出另一类人群：Tesla、Mygate
              等合作伙伴把保险变成更大购买或平台流程的延伸，而不是一个独立研究项目。这一点重要，因为 Acko 的模式依赖在正确时点捕捉意图。Moneycontrol 和 ET 在 Tesla、Mygate
              案例中直接展示了这种渠道逻辑；Business Today 则解释了直接模式的内部经济性：没有中介佣金、产品设计更紧、对理赔体验控制更强。采用路径也受数字比价习惯塑造。Policybazaar、Paytm
              Insurance、InsuranceDekho 和 Turtlemint 都在销售某种形式的更易比价、顾问协助或数字辅助购买。换句话说，市场已经教育印度消费者期待低摩擦的保险发现。Acko
              的挑战不是从零创造数字需求，而是把需求转化为比比价和经纪平台更好的承保经济性和留存。
