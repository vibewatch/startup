        - 需要董事会层面整改和结案证据
      - - 客户支持长尾问题损害信任的速度可能快过收入表现
        - 反论点
        - 可见坏案例容易伤到数字保险公司
        - 需要理赔质量分布和队列留存
      - - IPO 区间可能已经计入过多执行兑现
        - 反论点
        - 溢价定价下容错空间有限
        - 需要更好披露，或更低入场点
