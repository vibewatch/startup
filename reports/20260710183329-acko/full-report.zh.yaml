        title: 分销集中、IPO 时点和估值压力可能相互放大
        blocks:
          - type: paragraph
            body: >-
              Acko 的嵌入式分销策略是优势，也带来依赖风险。公司依靠合作伙伴界面、OEM
              流程、社区应用、旅行集成和借贷关系高效捕捉意图。伙伴关系加深并续约时，这是好事；但如果主要伙伴更强硬谈判、同时接入多家承保方，或带来低质量客群、推高赔付和投诉，模型就脆弱得多。公开 IPO
              报道又增加二阶风险：Acko 正推进上市，但仍在亏损，印度 IPO 环境也不如前几个周期宽松。Times of India 指出市场波动和其他发行暂停。Beinsure 与 Lapaas 都把这次 IPO 描述为
              $300-400 million 或更大的公开市场募资，前提仍是利润率改善和投资者胃口。Precize 的观察名单表述虽然截取文本较薄，但方向上符合投资者担心的点：估值溢价、DRHP
              披露，以及可持续盈利的证据。风险在于治理噪音、亏损状态和偏软 IPO 窗口在错误时点叠在一起。
            claimRefs:
