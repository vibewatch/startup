  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、聚合器、传统公司和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Acko 没有一组干净单一的同行。最接近的直接数字承保对照是 Go Digit，另一家新一代保险公司，同样用技术驱动客户旅程，覆盖车险和相邻险种。第二类是 Policybazaar、Paytm
              Insurance、Turtlemint 和 InsuranceDekho 等轻资产聚合器和经纪商；它们未必保留承保风险，却常常掌握比价时刻，并能把需求导向表现最好的承保方或套餐。第三类是 HDFC
              ERGO、Bajaj Allianz 等传统保险公司，拥有深厚理赔网络、成熟品牌和广泛产品菜单，同时持续改善数字购买界面。真正的现状替代品仍是多保险公司比价流程本身：很多印度买家并不需要某个特定的
              Acko，他们需要快速报价、合法保单和可接受的理赔信心。因此，Acko 的竞争与其说是功能新鲜度，不如说是直接定价、嵌入式分销和理赔执行的组合主张是否足够强，能阻止买家流向聚合器主导的多栖旅程。
