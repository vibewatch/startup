        - 公开市场会放大叙事风险
        - 估值压缩或延期
        - 高
      - - 数字化支持模式 + 边缘案例失灵
        - 即便失败率很小，也会造成可见的声誉伤害
        - 流失率上升，转介绍承压
        - 中
      - - 市场波动 + 盈利仍为负
        - 外部环境会放大内部执行风险
        - 融资或时间窗口压力
        - 高
    notes: 这张表是核心风险镜头：Acko 的危险不在单一弱点，而在风险叠加。
