  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点成立，但价格必须跟着证据走
        blocks:
          - type: paragraph
            body: >-
              Acko
              的多头逻辑很直接。它扩大了保费产出，搭起真正的多险种产品栈，建立嵌入式和应用主导的分销，并改善了受监管非寿险业务的亏损情况。在保险渗透率偏低的市场，这个组合可以相对增长更慢、线下更重的模式享有溢价。空头逻辑同样清晰。Acko
              在更广义集团层面仍亏损，IRDAI 处罚和 SAT 程序带来治理悬而未决，分险种经济性披露也还不足，不能用激进假设去承保公开市场上行空间。因此建议必须跟着价格走，而不是跟着好感走。Acko 并非明显不可投；但以
              $2.0-$2.5 billion 的目标 IPO 区间看，也并非明显便宜。基于公开证据，合理立场是有条件兴趣：披露改善，或价格纪律留出犯错空间，就继续推进；证据仍留下结构性问题时，不要硬凑信心。
