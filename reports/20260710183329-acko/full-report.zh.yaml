      - number: '3.2'
        title: 竞品画像，以及 Acko 真正差异化在哪里
        blocks:
          - type: paragraph
            body: >-
              Acko 最重要的结构差异是它既分销也承保。Policybazaar 明确称自身采用轻资产模式，不承保保险风险；这给了它广度和较低资产负债表强度，但对理赔经济性的直接控制更弱。Turtlemint 和
              InsuranceDekho 同样强调比价、合作伙伴广度和即时出单。传统公司打法不同：HDFC ERGO 和 Bajaj 主打大型无现金维修网络、广泛保障类型和熟悉的品牌信任。Digit 与 Acko
              最接近，因为它把直接数字购买、受监管承保方模式和越来越接近上市公司的披露规范结合起来。产品侧，Acko 现在覆盖汽车、健康、EV
              专属车险、旅行和定期寿险，比单一险种创业公司更宽，但在企业和长尾特种险上仍窄于很多传统公司。真正重要的差异化不是绝对宽度，而是谁能在同一套承保体系上控制承保设计、合作伙伴经济性和理赔体验。
