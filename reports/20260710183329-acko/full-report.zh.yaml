        - 运营设计比 App 文案更重要
      - - 维修 / 结算
        - 快速处理挡风玻璃或住院案例能培养拥护者
        - 车险维修追踪和赔付争议会迅速激怒客户
        - 糟糕尾部案例可能主导口碑
      - - 理赔后支持
        - 问题响应快，会把客户变成推荐者
