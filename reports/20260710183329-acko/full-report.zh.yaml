        title: 理赔一致性和承保执行会放大运营风险
        blocks:
          - type: paragraph
            body: >-
              Acko 的运营模型把风险集中在几个客户能直接感知的节点：开户 / 投保、核保和理赔。公开客户来源显示，这些节点顺畅时，用户会主动为它站台。但反向证据持续出现，分量不轻。App Store
              截图、Trustpilot 和 MouthShut 都指向理赔延迟、材料反复补交、问责薄弱，以及围绕保障范围或理赔解释的争议。Ditto 的 2026
              年评测尤其有用：它一方面给出相对正面的健康险指标，另一方面明确指出 Acko 的运营成熟度仍早，且已经受过监管处罚。健康险扩张又加一层风险。Business Today 把 Acko
              更严格的体检和核保方法视为优势，但同一套设计一旦执行走样，也会制造入门摩擦或逆选择误判。运营风险不只是某一笔理赔被拒；真正的问题是，数字化自助模型一旦在不同产品、城市、修理厂、医院或合作渠道处理边缘案例不一致，声誉损伤会被放大。
