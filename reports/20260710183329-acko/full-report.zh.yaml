        - 有可能，但证据偏薄
        - 上行来自公开市场稀缺性溢价和执行可信度
      - - 基准
        - 收入增长、亏损收窄，披露只部分改善，市场仍挑剔
        - US$1.8B-US$2.2B
        - 当前证据最支持
        - 较上一轮私募估值有适度上行，但拿不到完整溢价
      - - 悲观
