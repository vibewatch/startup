            body: >-
              资本充足是公开图景中较令人安心的一部分，但不等于现金续航透明。ACKO General FY25 年报称，授权资本增至 Rs 3,500 crore，实缴资本为 Rs 2,796
              crore，偿付能力相对监管最低要求为 2.30x。同一报告称，年内配发 35 crore 股权益股，显示公司即便走向 IPO 准备，资本支持仍在继续。公开披露还显示 FY26 经营规模：GI 披露列明截至
              March 2026 已赚保费 Rs 1,917.91 crore、净赔款支出 Rs 1,270.74 crore；ET 的 IPO 报道称 FY26 车险保费达到 Rs 1,186 crore，健康险保费达到
              Rs 1,235 crore。Acko Life 规模小得多，但已不再可以忽略；其 March 2026 公开披露显示，截至 March 2026 保费 Rs 18,832 lakh、佣金 Rs 7,339
              lakh、运营费用 Rs 6,700 lakh。仍缺失的是公开现金余额、月度消耗、债务义务和管理层级别的高质量现金续航桥接。换句话说，偿付能力看起来没问题，但仅靠公开证据还不能完全关闭融资依赖问题。
