      - number: '1.2'
        title: 领导层、治理和所有权结构
        blocks:
          - type: paragraph
            body: >-
              Acko 治理仍以创始人为中心，但公开记录显示，公司已经明显机构化。Acko Technology and Services 董事会页面列 Varun Dua
              为董事总经理兼首席执行官，同时列出一组与投资人相关及独立董事，包括 Binny Bansal、Mridul Arora、Nithya Easwaran、Shantanu Rastogi、Abhinav
              Chaturvedi、Rajat Mangla、Animesh Das、Chengalath Jayaram、N. V. Sivakumar 和 Rohini Srivathsa。ACKO General
              Insurance 的 2024-25 年报又加上一层实体治理：保险公司是 Acko Technology and Services Private Limited 的全资子公司；FY25 大额配股后实缴资本为
              Rs 2,796 crore；并记录了持牌保险公司所需的独立董事和审计治理流程。IPO 准备前，领导层也扩容。Moneycontrol 2026 年 6 月报道称，Acko 任命 Apoorv
              Kalra、Kunal Kapur、Vivek Sharma 和 Neha Gupta，把产品、业务和客户体验权责整合得更紧。Acko Life 另有独立运营负责人，其董事会页面显示 Nitin Kumar
              Gupta 为董事总经理兼首席执行官。结果是：集团仍高度依赖 Varun Dua 的战略判断，但已不像一个治理很轻的创投壳。
