      - number: '8.3'
        title: 乐观、基准、悲观三种情景，都同样取决于披露质量和增长
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Acko 把保费规模、健康险扩张和嵌入式分销转化为可信的承保盈利路径，正好赶上公开市场重新接纳数字金融服务故事。那种情况下，$2.5 billion
              或略高的结果可以自洽。基准情景更保守：收入继续增长，亏损收窄，偿付能力保持稳健，但治理和披露问题仍拖尾，把价格区间压在更接近 $1.8-$2.2 billion。悲观情景不是业务失败，而是估值倍数压缩。如果
              IPO 窗口持续偏软，客户和治理噪音延续，或 DRHP 披露显示单位经济性弱于市场预期，估值可能回落到上一次私募标记，甚至更低。因此建议不是“买入公司”，而是“跟踪，或按价格和披露条件推进”。Acko
              足够强，值得继续做功课；但还不够干净，不能在没有更清晰分险种经济性和治理补救证据前支付区间上沿。
