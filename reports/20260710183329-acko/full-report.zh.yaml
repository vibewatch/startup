      - number: '8.4'
        title: 治理、理赔或公开市场条件一旦不及预期，论点会很快失效
        blocks:
          - type: paragraph
            body: >-
              Acko 的论点失效触发点更多来自运营和资本市场，而不是市场规模。市场足够大；问题是 Acko
              能否足够有纪律地捕捉价值，从而配得上溢价。治理是最明显的止损开关：如果外包整改证据仍薄，或出现新的合规问题，公开市场信任会迅速压缩。理赔质量也是一个开关。数字保险公司若尾部案例处理薄弱，留存和声誉恶化速度可能快过收入数据所显示的情况。第三个开关是资本市场时点。IPO
              若推迟、降价，或过度偏向卖方退出，可能意味着需求更弱，或市场对底层故事信心更薄。最后的尽调要求很简单：不要为选择权付太多钱。必须看到法律实体口径调节、伙伴集中度、分险种利润率、理赔分布和治理收口的证据。若这些改善，Acko
              可获得更深入兴趣；若没有，谨慎做法是观察，而不是追高。
