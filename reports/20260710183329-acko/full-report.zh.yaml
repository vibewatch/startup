        title: 产品组合已是多险种，不再只是车险
        blocks:
          - type: paragraph
            body: >-
              Acko 的产品组合已明显超出最初的车险标签。官方页面显示，一个面向消费者的线上产品栈已覆盖汽车保险、旅行险、个人健康险、团体健康险、重大疾病险和定期寿险。应用商店列表走得更远，把 Acko
              呈现为一个移动入口，覆盖汽车、摩托车、旅行、健康、员工健康和寿险。这一点重要，因为产品宽度改变了战略问题。Acko
              不再只是争取一次性车险报价，而是试图成为反复使用的保险和出行服务界面。各险种的产品模式一致：数字出单、简化计划呈现、无纸化理赔或服务，以及把用户留在 App 内的跨用途功能钩子。团体健康页面也显示，Acko
              正在做 B2B 健康产品，而不只是零售保单目录，这把可服务流程从家庭购买拓宽到雇主管理。
