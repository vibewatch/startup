        title: 成本结构、直接分销经济性和公开单位经济信号
        blocks:
          - type: paragraph
            body: >-
              Acko 经济性的最佳公开证据方向上令人鼓舞，但仍不完整。ACKO General FY25 年报称，该保险公司把税后亏损从 FY24 的 Rs 456.43 crore 降至 Rs 193.38
              crore，将管理费用率改善至 48 percent，并以 2.3x 偿付能力比率收官。ET 的更宽集团报道也指向同一方向：收入上升，员工和营销成本同比下降，使合并净亏损降至约 Rs 424
              crore。Business Today 又给出最强的经营细节。Animesh Das 称，Acko 的直接模式去掉获客佣金成本；车险理赔结案率超过 98 percent，健康险在 95-100 percent
              区间；公司全口径综合成本率仍高于 110，但每年改善 10-12
              percent。这些信号值得重视，因为它们说明直接分销可能转化为结构性更好的佣金经济性。限制也很明显：公开来源没有给出从产品层增长到分险种贡献利润率的干净审计桥，也没有按渠道展示获客成本、续保或分群赔付率数据。
