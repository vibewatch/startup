    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部，以及 Acko 卖什么
        blocks:
          - type: paragraph
            body: >-
              Acko 更应被理解为全栈数字化保险公司，而不是靠比价导流的分销商。官方公司页面称，Varun Dua 创办 Acko，是为去掉纸质流程、简化理赔，并用技术让保险更容易购买和使用。到 2026
              年，公开公司资料和媒体描述一致把产品组合放在车险、两轮车险、健康险、旅行险和寿险上，并把直接客户关系定位为核心差异。这一点重要：Acko 并没有把自己说成只把线索转给传统保险公司的
              市场平台；它通过持牌保险实体承保，并用自有数字流程销售、服务和管理理赔。受监管版图也逐步扩大：ET 将一般保险牌照描述为 2017 年事件，将人寿保险牌照描述为 2023 年事件；Acko Life
              自身披露则列出注册号 164，日期为 31 March 2023。公开备案和客诉页面把运营基地锚定在 Bengaluru，尤其是 HSR Layout 地址，该地址反复出现在年报和寿险服务文件中。
