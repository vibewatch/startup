  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Acko 真正在争什么
        blocks:
          - type: paragraph
            body: >-
              围绕 Acko 最宽的市场镜头是整个印度保险行业，但这个口径太松，不能用来承保公司。Acko
              并不试图覆盖每个保险险种、每种分销形态或每条买方旅程。公开来源显示更具体的实践边界：它在争夺通过数字方式获客、通过数字方式服务的车险、健康险、旅行险和保障型客户，既可以直达，也可以通过 OEM 购车结算、社区
              App 和平台合作伙伴等嵌入式界面。这样 Acko 夹在两类大型存量结构之间。一边是传统保险公司和代理人，优势在于线下触达、理赔网络和品牌熟悉度。另一边是 Policybazaar、Paytm Insurance
              等由比价和经纪商主导的数字平台，它们聚合保险公司，而不是自己承保。官方竞品页面把这种反差写得很清楚：Policybazaar 将自己定位为 IRDA 批准的经纪商，拥有 50-plus 家保险公司关系；Paytm
              Insurance 明确说自己是提供比价和购买基础设施的经纪商。因此，Acko 可服务市场位于消费者保险需求、数字比价行为和嵌入式购买时点的交叉处；全栈保险公司在这里可以替代线下代理和聚合器交接流程。
