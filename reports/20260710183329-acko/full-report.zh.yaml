      - number: '1.4'
        title: 里程碑、合作伙伴和负面事项
        blocks:
          - type: paragraph
            body: >-
              里程碑记录呈现清晰模式：Acko 以车险为滩头，扩展到健康险和寿险，然后在筹备公开市场的同时，更深切入嵌入式和 OEM 关联分销。Moneycontrol 将健康险推进与 March 2023
              相关联，将寿险动作与 2023 年牌照获批后相关联。2025 和 2026 年，产品与渠道继续扩张。ET 的 Mygate 文章称，这款小区 App 为 4 million 户家庭接入 Acko
              产品，并计划从车险延伸到健康险和寿险。Business Standard 和 Moneycontrol 都把 Tesla 关联保险描述为嵌入式、数字化的报价到理赔体验，也是 EV
              专属附加险、车联网试点和按使用量定价保险实验的起点。正面之外有两项尽调标记。第一，IRDAI 于 May 2025 对 ACKO General Insurance 处以 Rs 1 crore 罚款，原因是与
              Ola Financial Services 有关的外包和佣金违规；监管方还要求董事会审查并提交整改报告。第二，质疑 IPO 的评论仍把管理费用争议和公开市场准备度视为悬而未决，直到最终 DRHP
              澄清。这些问题不否定 Acko 的进展，但会实质影响对公司的承保判断。
