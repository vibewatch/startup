            body: >-
              财务结论方向积极，但仍达不到可投资级透明度。Acko 已明确做大保费产出、守住监管资本，并改善主要 GI
              实体的亏损状况。公开评论也显示，直接分销不只是营销故事：零中介佣金、更严格健康险承保、交易点嵌入式获客，如果理赔纪律守得住，应是实际经济优势。但可报告盲区仍然重大。公开信息没有跨集团实体的干净桥接，没有 FY26
              合并现金流审计视角，没有按车险、健康险、嵌入式项目拆分的逐行赔付率披露，也没有按分群展示合作伙伴渠道贡献利润率。因此，即使最乐观的公开指标，也应被视为经营动能证据，而不是完全承保后的盈利基座。投资人应把 Acko
              的财务状态看成正在改善但披露受限：足以值得认真做功课，不足以免除对资本效率、渠道经济性和现金续航的尽调。
