  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 治理整改薄弱
        - 没有明确结案，或出现新的控制失灵
        - 击穿信心溢价，并扩大折价
        - 暂停或退出
      - - 理赔质量恶化
        - 投诉 / 拒赔 / 延迟数据差于预期
        - 击穿数字信任和留存论点
        - 大幅下调定价
      - - 健康险单位经济性薄弱
        - 赔付率或获客成本不及预期
        - 击穿第二增长引擎扩张论点
        - 下调上行情景，要求更低入场价
      - - 合作伙伴集中度高
        - 少数渠道主导经济性或投诉
        - 击穿嵌入式护城河论点
        - 要求纳入合作伙伴调整的下行情景
      - - IPO 市场走弱或发行延迟
        - 时间表明显滑移或定价重设
        - 击穿稀缺性 / 动量对溢价区间的支撑
        - 倾向观望
    notes: 这些是实用的 IC 触发项，目的是推动投资判断变化，而非抽象观察。
