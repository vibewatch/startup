      - number: '7.4'
        title: 风险结论：原则上可控，但多项问题叠加会很危险
        blocks:
          - type: paragraph
            body: >-
              风险底线不是 Acko
              已经坏掉，而是相比增速更慢的私人保险公司，它容错更低。公司卖的是高度依赖信任的金融产品，靠数字渠道获客，依赖合作伙伴渠道，还希望在尚未彻底消除亏损、合规成熟度仍有争议之前拿到公开市场估值上修。这个组合让风险叠加成为核心问题。理赔处理、伙伴监督、投诉回应或资本市场时点上的小裂缝，可能互相强化，把叙事从“高增长保险科技公司”推向“控制不足的数字保险公司”。因此尽调
              Acko 最该看相互作用：伙伴经济性叠加理赔质量，健康险增长叠加核保质量，IPO
              时点叠加披露准备度，监管历史叠加董事会层面的控制证据。公开证据不足以给出红灯结论，但足以形成一个默认判断：多项风险仍在场，估值扩张前必须用一手数据验证。
