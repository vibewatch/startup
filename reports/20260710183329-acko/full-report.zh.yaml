        title: 客户基础：零售保单持有人、App 用户、合作伙伴用户和雇主覆盖成员
        blocks:
          - type: paragraph
            body: >-
              Acko 的客户基础跨越多个分母，必须仔细拆分。Moneycontrol 的 IPO 报道称，公司服务过超过 78 million 名唯一客户，签发超过 1 billion 份保单；App 生态和官方 App
              文案则指向数千万下载、营销话术中的 7.5-8 crore 快乐用户或保单持有人，以及覆盖汽车、摩托车、健康、旅行、员工健康和寿险的广泛产品组合。团体健康又增加了一层由雇主赞助的客户：Acko
              团体健康页面称，其覆盖 200-plus 家企业的 2 lakh-plus
              名员工，这与自助零售用户在运营上不同。嵌入式合作伙伴关系创造出第四层在旅行、借贷、住宅社区和出行流程中获取的“间接”客户。主要尽调含义是，Acko
              的客户故事不能简化为一个干净用户数。它是直接零售买家、合作伙伴流程保单持有人、团体计划员工，以及即使在保单事件之间也可能使用车辆工具的 App 用户的组合。
