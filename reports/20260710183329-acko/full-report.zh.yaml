              发现度，以及许多用户觉得足够方便并愿意推荐的产品流程。它也似乎拥有一批客户：相比线下网点或代理关系，他们更看重价格、无纸化购买和自助理赔。但公开投诉集显示，支持和理赔存在有意义的尾部风险分布。这一点重要，因为数字保险公司可以在平均水平上看起来高效，却因一小部分迅速在线传播的糟糕体验伤害留存。核心尽调问题因此必须按
