        - GI、人寿和集团层面对账
        - 用来估算正确经济边界的价值
        - 管理层 + 审计师
      - - 治理整改
        - 董事会和监管结案证据
        - 用来判断处罚是历史问题还是仍在持续
        - 董事会、法务、合规
      - - 险种级单位经济性
        - 车险、健康险、旅行险和嵌入式利润率
        - 用来区分增长和价值创造
        - 精算和财务团队
      - - 合作伙伴集中度和经济性
        - 头部账户保费占比、理赔、续保
        - 用来判断嵌入式护城河和下行风险
        - 合作伙伴和财务团队
      - - 理赔质量分布
        - 按队列划分的周期、拒赔原因、升级处理
        - 用来评估留存和品牌耐久性
        - 运营和 CX 团队
      - - IPO 压力情景
        - 延期或重定价下的资本计划
        - 需要该项，因为发行窗口风险真实存在
        - CFO 和财务团队
    notes: 如果管理层无法满足这些要求，估值立场就应保持谨慎，而不是乐观。
