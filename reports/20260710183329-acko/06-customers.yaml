- id: TU003
  title: Customer journey and support table
  columns:
  - Journey stage
  - What works when the product behaves well
  - What breaks in negative reports
  - Implication
  rows:
  - - Discovery
    - Low-price, paperless, direct purchase appeals to digital buyers
    - Over-reliance on marketing claims can create expectation gaps
    - Acko wins on simplicity before claims
  - - Onboarding
    - Instant quote and issuance can be fast
    - Medical-test scheduling and app-state errors can derail trust
    - Health onboarding quality matters early
  - - Claims submission
    - App and paperless flows reduce friction for straightforward cases
    - Upload bugs or documentation loops can turn digital into support burden
    - Operational design matters more than app copy
  - - Repair / settlement
    - Quick windshield or hospitalization stories build advocacy
    - Motor repair tracking and payout disputes create anger quickly
    - Bad tails can dominate word of mouth
  - - Post-claim support
    - Responsive resolution can create promoters
    - Customers complain about unclear ownership and repeated follow-up
    - Support structure is a loyalty driver
  - - Renewal / referral
    - Satisfied users may recommend Acko
    - Negative claim experiences can kill renewal intent
    - Retention likely differs sharply by experience cohort
  notes: The same digital design that delights simple cases can magnify frustration when edge cases or coordination failures appear.
