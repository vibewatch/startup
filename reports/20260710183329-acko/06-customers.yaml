  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: renewal-by-cohort
    missingEvidence: Renewal, churn, and referral rates by product line, claim outcome, and acquisition channel.
    whyItMatters: Acko’s public reach is large, but loyalty quality cannot be underwritten without cohort retention.
    diligencePath: Request cohort retention, renewal pricing, and churn reasons across D2C, embedded, and employer channels.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: complaint-normalization
    missingEvidence: Complaint and grievance rates normalized by policy count, claim count, and product line.
    whyItMatters: Portal reviews identify themes, but they do not show whether issues are systemic or concentrated.
    diligencePath: Obtain regulator complaint data, internal grievance dashboards, and product-level complaint rates.
    relatedQuestionRefs:
    - QU021
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: partner-service-ownership
    missingEvidence: Clear delineation of who owns customer support and claims resolution on partner-sold policies.
    whyItMatters: Travel and embedded complaints suggest customers may experience accountability gaps when a partner is in the loop.
    diligencePath: Review partner SLAs, contractual support responsibilities, and escalation paths.
    relatedQuestionRefs:
    - QU013
    - QU021
  - type: private-evidence-only
    severity: material
    topic: app-engagement-to-policy-conversion
    missingEvidence: How many app users or utility users convert into paid insurance customers and how often they return.
    whyItMatters: Download counts can overstate monetizable customer value.
