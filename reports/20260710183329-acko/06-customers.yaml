- id: complaints-and-adverse-customer-evidence
  title: Adverse customer evidence centers on claims ambiguity, coordination, and support ownership
  body: 'The negative evidence is too strong to dismiss as random internet noise. The App Store review capture includes repeated complaints about motor-claim delays, missing ownership between teams and garages, buggy image-upload flows, medical-test scheduling failures, and travel-protection claims blocked by policy interpretation or international-number issues. Trustpilot’s archived review page shows Acko rated 1.7 out of 5, and MouthShut carries a large body of intensely negative complaint text. While raw review portals are not statistically representative, the complaint themes are notable because they recur across product lines: customers say advertising promises simplicity, but when something goes wrong they face repeated follow-ups, documentation friction, unexplained denials, shifting timelines, or unclear responsibility. Ditto’s 2026 review is useful here because it provides a more structured outside lens: it praises health metrics, but also notes Acko’s shorter track record and the
    IRDAI penalty as context for operational maturity. The customer risk is therefore not lack of acquisition; it is whether claim fairness and support consistency match the company’s growth and marketing narrative.'
