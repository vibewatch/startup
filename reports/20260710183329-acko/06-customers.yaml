  rows:
  - - Retail motor policyholder
    - Direct app or web purchase
    - Fast quote, legal cover, easy claim
    - App copy, reviews, claim stories
    - Claim fairness and repair coordination
  - - Retail health buyer
    - Direct digital purchase
    - Affordable coverage and paperless claims
    - Individual-health page, App Store reviews, Ditto review
    - Onboarding, medical-test, and support consistency
  - - Employer-covered member
    - Employer-sponsored group plan
    - Hospital access and fast approvals
    - Group-health page
    - Dependent on provider integration and HR coordination
  - - Partner-flow traveler / trip buyer
    - Embedded inside travel booking or flight protection
    - Delay, baggage, and travel disruption protection
    - Travel page, App Store complaints, partnerships page
    - Policy wording friction during claims
  - - Residential / embedded household
    - Community or partner distribution
    - Convenience and contextual protection
    - Mygate article
    - May have weaker direct brand attachment
  - - App-only utility user
    - Vehicle services and reminders
    - Challan, FASTag, PUC, resale-value utilities
    - App listings, AppBrain
    - May not convert into profitable insurance relationships
  notes: Acko serves multiple customer types with different satisfaction drivers, so one aggregate “customer count” is not decision-useful.
