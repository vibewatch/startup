- id: TU004
  title: Adverse customer evidence table
  columns:
  - Theme
  - Illustrative public evidence
  - Product line
  - Risk to Acko
  rows:
  - - Motor-claim delays / coordination
    - App Store reviews describe lost visibility, delayed repair, and repeated follow-up
    - Motor
    - Undermines renewal and word of mouth
  - - Claim denial / wear-and-tear disputes
    - Reviewers say approved scope was narrower than expected
    - Motor
    - Creates trust gap between marketing and adjudication
  - - Medical-test scheduling failures
    - App Store review cites repeated test-rescheduling and system mistakes
    - Health
    - Raises concerns before coverage even starts
  - - Travel-claim wording friction
    - Reviewers complain of baggage or cancellation claims denied on wording / process grounds
    - Travel
    - Can damage embedded-partner trust
  - - Support accountability gaps
    - Multiple review sources describe no single owner or weak callback discipline
    - Cross-product
    - Digital convenience narrative weakens fast
  - - Portal-wide low ratings
    - Trustpilot shows 1.7/5 archived rating; MouthShut carries heavy complaint volume
    - Cross-product
    - Signals concentrated dissatisfaction pockets
  notes: These are directional complaint themes, not representative complaint rates. They matter because the same themes recur across sources.
