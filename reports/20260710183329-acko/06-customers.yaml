- id: TU005
  title: Customer diligence gaps table
  columns:
  - Missing metric
  - Why it matters
  - What public evidence cannot answer
  rows:
  - - Renewal by channel
    - Needed to see if embedded and D2C cohorts stay
    - Public sources do not show cohort retention
  - - NPS / CSAT by product
    - Needed to separate motor, health, and travel experiences
    - Public reviews mix products together
  - - Complaint rate by claim type
    - Needed to test whether bad tails are concentrated or systemic
    - Portals are anecdotal and not normalized
  - - Support escalation resolution time
    - Needed to understand whether digital support scales
    - Only testimonials and complaints are visible
  - - Customer acquisition versus utility-only usage
    - Needed to know if app utilities deepen insurance economics
    - Downloads do not equal profitable policyholders
  - - Partner-customer service ownership
    - Needed to know who owns resolution when a partner-sold policy breaks
    - Public evidence shows confusion but not contractual roles
  notes: Customer diligence should move from anecdote to cohort analysis before underwriting retention or lifetime value.
