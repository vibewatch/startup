    - Carrier premium plus add-ons
    - Broad cover types and large garage network
    - Large-brand pricing power not quantified here
    - Trust and service footprint can offset small price gaps
  - - Bajaj
    - Carrier premium plus add-ons
    - App-led claims, 7,200+ garages, common motor add-ons
    - Realised discounts vary by vehicle and profile
    - Incumbent breadth narrows Acko’s convenience advantage
  - - Digit
    - Carrier premium plus add-ons like PAYD and EV shield
    - Direct digital purchase with visible claims scale
    - Realised price not public in retained sources
    - Closest substitute for buyers wanting a digital underwriter
