- id: profiles-and-differentiation
  title: Competitor profiles and where Acko is genuinely differentiated
  body: 'Acko’s most important structural distinction is that it both distributes and underwrites. Policybazaar explicitly says it follows an asset-light model and does not underwrite insurance risk; that gives it breadth and low balance-sheet intensity, but less direct control over claims economics. Turtlemint and InsuranceDekho similarly emphasise comparison, partner breadth, and instant issuance. Incumbents compete differently: HDFC ERGO and Bajaj market large cashless-garage footprints, broad cover types, and familiar brand trust. Digit sits closest to Acko because it combines direct digital purchase with a regulated carrier model and increasingly public-company disclosure norms. On the product side, Acko now spans car, health, EV-specific motor, travel, and term-life, which is broader than a mono-line startup but still narrower in enterprise and long-tail specialty lines than many incumbents. The differentiation that matters most is therefore not absolute breadth, but who controls underwriting
    design, partner economics, and claims experience on the same stack.'
