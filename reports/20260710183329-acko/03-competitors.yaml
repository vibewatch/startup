- id: pricing-distribution-and-switching-cost
  title: Pricing, distribution power, switching cost, and multi-homing risk
  body: 'Competitive pressure in Indian insurance is magnified by low switching cost at the point of quote. Aggregators make multi-homing normal: Policybazaar, Paytm, Turtlemint, and InsuranceDekho all teach the customer to compare partners rather than to commit to one carrier. Acko’s counter is to capture demand in owned or embedded moments, such as OEM-linked EV sales or app-based partner ecosystems, before comparison becomes a commodity exercise. The logic is sound, but it does not remove the fact that most car and health buyers can switch carriers at renewal or even within the same search session if another insurer or broker offers a slightly better bundle. Incumbents also compete hard on add-ons, garages, and trust markers: HDFC ERGO advertises 12,200+ cashless garages, Bajaj advertises 7,200+, and Digit advertises 10,000+ while highlighting 1.5 crore policies sold. Those scale signals matter because network depth and claim familiarity can outweigh price in higher-value or post-claim
    purchase decisions.'
