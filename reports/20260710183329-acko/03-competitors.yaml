    - Comparison layer can capture buyers before Acko is considered
  - - InsuranceDekho
    - Marketplace / instant issuance
    - Broad plans, Google reviews, fast issuance
    - Realised take rate not public here
    - High-intent price shoppers may multi-home aggressively
  notes: This table compares packaging logic rather than exact premium quotes, because like-for-like realised pricing is not disclosed consistently across companies.
