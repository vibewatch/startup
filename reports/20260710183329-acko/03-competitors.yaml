chapter:
  number: 3
  title: Competitors
  summary: 'Acko competes on a structurally different model from India’s large insurance aggregators and from incumbent carriers: it underwrites risk on its own balance sheet while still trying to win digitally. That creates a real edge in product control and embedded economics, but it also exposes Acko to faster competitive imitation from listed incumbents and to distribution pressure from asset-light comparison platforms.'
sections:
- id: landscape-and-competitor-classes
  title: 'Landscape: direct peers, aggregators, incumbents, and status-quo alternatives'
  body: 'Acko does not face a single clean peer set. The closest direct digital-underwriting comparison is Go Digit, another new-age insurer using a tech-led customer journey across motor and adjacent lines. A second class is asset-light aggregators and brokers such as Policybazaar, Paytm Insurance, Turtlemint, and InsuranceDekho, which may not retain underwriting risk but often own the comparison moment and can steer demand toward whichever carrier or package performs best. A third class is incumbent insurers such as HDFC ERGO and Bajaj Allianz, which have deep claims networks, established brands, and broad product menus while steadily improving digital buying surfaces. The real status quo competitor remains the multi-insurer comparison workflow itself: many Indian buyers do not need Acko specifically, they need a fast quote, a legal policy, and acceptable claim confidence. That means Acko’s competition is less about feature novelty than about whether its combined proposition of direct
    pricing, embedded distribution, and claims execution is strong enough to keep buyers from multi-homing into aggregator-led journeys.'
