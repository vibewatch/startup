  rows:
  - - Acko
    - Digital underwriter
    - Own insurer, multi-line consumer products, embedded partnerships
    - Retail motor, health, travel, term-life, embedded consumers
    - Controls underwriting and digital journey on same stack
    - Less public disclosure and fewer visible network-scale markers than incumbents
  - - Go Digit
    - Digital underwriter / listed carrier
    - 1.5 crore+ policies sold; Rs 5,100+ crore paid in claims
    - Retail motor and broad non-life users
    - Closest model to Acko with strong digital purchase motion
    - Not uniquely digital anymore; competes on similar simplicity claims
  - - Policybazaar
    - Aggregator / broker ecosystem
    - Rs 299 billion FY26 insurance premium; 67.3 million policies sold
    - Comparison-led insurance buyers across categories
    - Wide choice, transparency, asset-light scale
    - Does not control underwriting on balance sheet
  - - Paytm Insurance
    - Aggregator / comparison channel
    - Quote-comparison and instant issuance flow
    - Mass digital payments users shopping insurance
    - Embedded discovery inside broader consumer app habits
    - Weaker public insurance-specific scale disclosure in retained sources
  - - HDFC ERGO
    - Incumbent carrier
    - 3.1 crore+ happy customers; 12,200+ cashless garages
    - Trust-led retail and incumbent buyers
    - Brand, network depth, broad add-ons
    - May carry more process complexity than pure digital challengers
  - - Bajaj Allianz / Bajaj General
    - Incumbent carrier
    - 7,200+ network garages; instant app-led claims pitch
    - Mass retail motor buyers
    - Large service footprint and familiar brand
    - Not differentiated on digital-first narrative alone
  - - Turtlemint
    - Broker / advisor network plus digital compare
    - 45+ insurance partners; 1 crore+ policies sold
    - Comparison and assisted-distribution buyers
    - Partner breadth and assisted choice
    - No underwriting control
  - - InsuranceDekho
    - Aggregator / marketplace
    - 16 Mn+ customers; 136k+ claims served
    - Price-sensitive retail insurance shoppers
    - Fast issuance and broad insurer access
    - Comparison-led traffic can be price sensitive and low loyalty
  notes: Profiles mix official-company claims and a few independent context sources; “scale” is intentionally presented as each company frames it publicly.
