  topStrengths:
    - Acko 已有真实经营规模：公开来源支撑数千 crore 保费或收入锚点、数千万客户，以及车险和健康险的实质增长。
    - 产品不只是车险 App，而是把直接承保、大体量移动端入口、团体健康险工作流和嵌入式 API 分发拼在一起。
    - 受监管保险主体的财务方向在改善：进入 IPO 准备窗口时，亏损明显收窄，偿付能力也足够。
  topRisks:
    - 治理仍是最清晰的客观包袱：2025 年 IRDAI 命令和仍在推进的 2026 年 SAT 流程，都抛出控制与监督问题。
    - 公开客户证据两极分化：应用商店评分强，但理赔处理、开户引导和支持责任归属仍有可见投诉长尾。
    - 当前 IPO 区间已经假设执行和披露会明显改善；如果单位经济或市场环境不及预期，容错空间有限。
  unresolvedGaps:
    - 公开来源尚未清晰对齐 ACKO General、ACKO Life 和更大集团口径的财务范围。
    - 分险种赔付率、渠道 CAC、合作伙伴集中度和续保经济性仍未披露。
    - 理赔质量分布、分产品申诉率和按 cohort 划分的留存并无公开数据。
    - 与 2025 年监管发现挂钩的董事会层面整改证据，公开细节仍不足。
