  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: governance-remediation
    missingEvidence: Board minutes, remediation plans, closure memos, and post-order regulator correspondence showing that the outsourcing and commission findings are fully remediated.
    whyItMatters: The public order identifies concrete governance failures, but investors still need proof of durable control fixes.
    diligencePath: Request board and audit-committee packs, remediation trackers, and regulator follow-up letters.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR019
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: claims-quality-distribution
    missingEvidence: Claim-cycle-time distributions, denial reasons, escalation rates, and complaint rates by product, severity, and geography.
    whyItMatters: Public complaint evidence is vivid but anecdotal; downside underwriting needs normalized operational data.
    diligencePath: Request raw claim-event logs, grievance dashboards, and claim-quality KPIs across lines.
