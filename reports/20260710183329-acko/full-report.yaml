  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, aggregators, incumbents, and status-quo alternatives'
        blocks:
          - type: paragraph
            body: >-
              Acko does not face a single clean peer set. The closest direct digital-underwriting comparison is Go
              Digit, another new-age insurer using a tech-led customer journey across motor and adjacent lines. A second
              class is asset-light aggregators and brokers such as Policybazaar, Paytm Insurance, Turtlemint, and
              InsuranceDekho, which may not retain underwriting risk but often own the comparison moment and can steer
              demand toward whichever carrier or package performs best. A third class is incumbent insurers such as HDFC
              ERGO and Bajaj Allianz, which have deep claims networks, established brands, and broad product menus while
              steadily improving digital buying surfaces. The real status quo competitor remains the multi-insurer
              comparison workflow itself: many Indian buyers do not need Acko specifically, they need a fast quote, a
              legal policy, and acceptable claim confidence. That means Acko’s competition is less about feature novelty
              than about whether its combined proposition of direct pricing, embedded distribution, and claims execution
              is strong enough to keep buyers from multi-homing into aggregator-led journeys.
