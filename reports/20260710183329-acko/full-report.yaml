  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis is credible, but only if the price remains evidence-sensitive
        blocks:
          - type: paragraph
            body: >-
              The long thesis for Acko is straightforward. It has scaled premium production, built a real multi-line
              product stack, established embedded and app-led distribution, and improved the loss profile of the
              regulated GI business. In a low-penetration insurance market, that combination can merit a premium to
              slower, offline-heavy models. The short thesis is equally clear. Acko is still loss-making at the
              broader-group level, has a live governance overhang from the IRDAI penalty and SAT process, and does not
              yet disclose enough line-level economics to justify a heroic underwriting of public-market upside. Because
              of that, the recommendation has to be price-sensitive rather than admiration-sensitive. Acko is not
              obviously uninvestable. It is also not obviously cheap at a targeted $2.0-$2.5 billion IPO range. The
              right stance from public evidence is conditional interest: proceed if disclosure improves or price
              discipline creates room for error, and avoid forcing conviction where the evidence still leaves structural
              questions open.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
