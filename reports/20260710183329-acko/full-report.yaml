      - number: '2.4'
        title: Growth drivers, adoption accelerants, and what can still go wrong
        blocks:
          - type: paragraph
            body: >-
              Several structural forces still support growth in Acko’s market. IBEF highlights stronger insurance
              awareness, favourable policy support, rising private-sector participation, digital distribution, and
              tier-II/III expansion. It also notes that 62 percent of new premiums in FY25 came from smaller cities and
              that digital-only insurers and aggregators are opening new access routes to previously underpenetrated
              cohorts. IBEF and policy reporting also point to two catalysts especially relevant to Acko: health
              insurance becoming the largest non-life segment, and Bima Sugam’s launch as a national digital marketplace
              that could normalize online comparison and servicing. Yet the same market carries real constraints. ICRA
              says pricing discipline is critical to GDPI recovery and combined-ratio improvement, underscoring that
              market growth does not automatically mean healthy underwriting. Startup-stage digital insurers still need
              capital buffers, strong claims controls, and regulator confidence. Moneycontrol’s life-insurance strategy
              story adds another constraint: mis-selling grievances remain elevated, which means consumer trust and
              regulatory scrutiny matter as much as distribution reach. Finally, market share data reminds investors
              that the market is large but crowded: October 2025 flash figures gave Acko only 0.72 percent of
              general-insurance market share, while better-capitalised incumbents and listed peers remain multiple times
              larger. Growth is available, but not frictionless.
