  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and governance risk is the clearest hard public overhang
        blocks:
          - type: paragraph
            body: >-
              The most concrete public risk is regulatory. The May 2025 IRDAI order is not vague reputational chatter;
              it is a formal enforcement document laying out violations tied to outsourcing, commissions, and
              due-diligence failures. The order explicitly references payments to Ola Financial Services, questions
              whether the vendor had legitimate technology or advertising capability, and says the insurer failed to
              show adequate outsourcing-committee oversight and documentary support. Public news coverage and secondary
              explainers compress this into a one-crore penalty headline, but the real issue is governance maturity. The
              Indian Kanoon record further shows that Acko remained in an appeal process before the Securities Appellate
              Tribunal in March 2026, with interim relief continuing. That means the matter was still alive during IPO
              preparation. For a private growth company, such issues may be survivable. For a public-market candidate
              selling a trust product, they raise sharper questions about control culture, partner governance, and
              whether fast growth outpaced compliance discipline.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
