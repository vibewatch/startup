      - number: '7.3'
        title: Distribution concentration, IPO timing, and valuation pressure can interact badly
        blocks:
          - type: paragraph
            body: >-
              Acko’s embedded-distribution strategy is a strength, but it also creates dependence risk. The company
              relies on partner surfaces, OEM flows, community apps, travel integrations, and lending relationships to
              capture intent efficiently. That is good when partnerships deepen and renew. It is more fragile if major
              partners negotiate harder, multi-home carriers, or produce low-quality cohorts that inflate claims and
              complaints. Public IPO reporting adds a second-order risk: Acko is trying to move toward a listing while
              still loss-making and while Indian IPO conditions are less forgiving than in earlier cycles. Times of
              India points to market volatility and paused offerings elsewhere. Beinsure and Lapaas both frame the IPO
              as a $300-400 million or larger public-market exercise that still depends on margin improvement and
              investor appetite. Precize’s watchlist framing, although thin in captured text, is directionally
              consistent with what investors worry about: valuation premium, DRHP disclosures, and proof of durable
              profitability. The risk is that governance noise, loss-making status, and a softer IPO tape converge at
              the wrong moment.
            claimRefs:
              - CR021
