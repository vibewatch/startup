  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, premium scale, and what public numbers actually measure
        blocks:
          - type: paragraph
            body: >-
              Acko monetises primarily through insurance underwriting rather than through a pure lead-generation or
              broking model, which means premium growth and loss quality matter more than surface traffic. The public
              record splits into at least two scopes. At the regulated-insurer level, ACKO General Insurance’s FY25
              annual report shows gross written premium of Rs 2,064.67 crore and total revenue of Rs 1,737.77 crore. At
              the broader group level, ET and Moneycontrol report FY25 revenue closer to Rs 2,836-2,887 crore and net
              loss around Rs 424 crore from MCA filings, which likely capture a wider Acko perimeter than the standalone
              GI entity. The most useful conclusion is not to pick one number and ignore the other, but to keep the
              scope distinction explicit. Product mix matters inside those totals. Business Today and Moneycontrol both
              frame motor as about 40 percent of the current portfolio, with health becoming the second large consumer
              line and EV-specific motor products emerging through Tesla-linked distribution. That means Acko’s revenue
              model is still premium-led and risk-priced, but it is increasingly multi-line rather than dependent on one
              legacy auto-renewal engine.
