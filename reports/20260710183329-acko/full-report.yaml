              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase
            body: >-
              Acko has enough proof to stay on the diligence list, but not enough disclosure to justify paying
              top-of-range IPO pricing without conditions.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV030
              - CV040
          - type: callout
            title: The price already embeds progress
            body: >-
              At US$2.0B-US$2.5B, investors are being asked to pay for cleaner governance, better unit economics, and
              stronger disclosure than the public record yet fully demonstrates.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV026
              - CV028
          - type: callout
            title: Disclosure quality is the real swing factor
            body: >-
              The main reason to upgrade the call is not a bigger market story; it is better evidence on entity scope,
              margins, partner concentration, and claim quality.
            calloutType: insight
            claimRefs:
              - CV037
              - CV038
              - CV039
