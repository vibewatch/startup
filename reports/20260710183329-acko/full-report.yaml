      - number: '7.4'
        title: 'Risk verdict: manageable in principle, dangerous if several issues stack at once'
        blocks:
          - type: paragraph
            body: >-
              The bottom-line risk verdict is not that Acko is broken; it is that it has less room for execution
              mistakes than a slower-growing private insurer. The company sells a trust-intensive financial product,
              acquires users digitally, depends on partner channels, and wants public-market valuation uplift before it
              has fully eliminated losses or debate about compliance maturity. That combination makes risk compounding
              the main issue. Small cracks in claims handling, partner oversight, complaint response, or capital-market
              timing can reinforce each other and push the narrative from “high-growth insurtech” to “under-controlled
              digital insurer.” The best way to diligence Acko is therefore through interaction effects: partner
              economics plus claims quality, health growth plus underwriting quality, IPO timing plus disclosure
              readiness, and regulatory history plus board-level control evidence. Public evidence does not justify a
              red-light verdict, but it does justify a presumption that several risks remain live and should be tested
              with primary data before underwriting valuation expansion.
