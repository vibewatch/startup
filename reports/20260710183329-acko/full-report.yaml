      - number: '4.2'
        title: Cost structure, direct-distribution economics, and public unit-economics signals
        blocks:
          - type: paragraph
            body: >-
              The best public evidence for Acko’s economics is directionally encouraging but still incomplete. The FY25
              ACKO General annual report says the insurer cut its loss after tax to Rs 193.38 crore from Rs 456.43 crore
              in FY24, improved its expense-of-management ratio to 48 percent, and ended the year with a 2.3x solvency
              ratio. ET’s broader group reporting also points in the same direction: revenue rose while employee and
              marketing costs fell year on year, bringing the consolidated net loss down to roughly Rs 424 crore.
              Business Today adds the strongest operating-color evidence. Animesh Das says Acko’s direct model removes
              acquisition-commission costs, that motor claims settlement is above 98 percent while health is in the
              95-100 percent range, and that the company’s all-in combined ratio is still above 110 but improving by
              10-12 percent per year. Those are encouraging signals because they suggest direct distribution can
              translate into structurally better commission economics. The limitation is obvious: public sources do not
              provide a clean, audited bridge from product-level growth to line-level contribution margins, nor do they
              show acquisition cost, renewal, or loss-ratio cohorts by channel.
