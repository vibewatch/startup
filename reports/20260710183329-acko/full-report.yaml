            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV027
              - CV028
              - CV029
      - number: '8.4'
        title: The thesis can break quickly if governance, claims, or public-market conditions disappoint
        blocks:
          - type: paragraph
            body: >-
              Acko’s thesis-break triggers are more operational and capital-market driven than market-size driven. The
              market is large enough; the question is whether Acko captures value with enough discipline to deserve a
              premium. Governance is the most obvious kill switch: if outsourcing-remediation evidence remains thin or
              fresh compliance issues emerge, public-market trust can compress fast. Claims quality is another. A
              digital insurer with weak tail-case handling can see retention and reputation deteriorate faster than raw
              revenue suggests. A third breaker is capital-market timing. An IPO that slips, reprices, or shifts too
              heavily toward seller exits could signal weaker demand or thinner confidence in the underlying story. The
              final diligence ask is therefore simple: do not overpay for optionality. Require evidence on legal-entity
              reconciliation, partner concentration, line-level margins, claims distributions, and governance closure.
              If those improve, Acko can justify deeper interest. If they do not, the more prudent stance is to watch
              rather than chase.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
