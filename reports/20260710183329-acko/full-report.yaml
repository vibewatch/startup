companyProfile:
  summary: >-
    Acko is a Bengaluru- and Mumbai-linked Indian digital insurer founded in 2016 and led by Varun Dua. The company
    built its initial scale in motor insurance, then expanded into health, travel, group health, critical illness, and
    term life while also building a partner-embedded distribution layer across travel, lending, community, and mobility
    workflows. Public sources support meaningful premium scale, tens of millions of customers, a large app footprint,
    and improving financial direction at the GI entity. The underwriting question is no longer whether Acko matters
    strategically; it is whether governance, customer-support quality, and line-level economics are strong enough to
    justify a premium public-market valuation.
