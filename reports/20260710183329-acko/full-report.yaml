      - number: '1.3'
        title: Funding history, valuation signals, and scale claims
        blocks:
          - type: paragraph
            body: >-
              Acko’s capital narrative is unusually noisy because different public sources appear to describe different
              scopes of the group. The cleaner end of the record is the recent IPO run-up. Moneycontrol and ET both say
              the company hired ICICI Securities, Morgan Stanley, and Kotak Securities for a proposed listing and is
              targeting a roughly $2 billion to $2.5 billion valuation. ET’s IPO report says the last known valuation
              was about $1.4 billion and that investors have collectively deployed more than $583 million, while Inc42’s
              current company profile shows last funding on 29 July 2025 and total funding of $458 million-plus.
              Moneycontrol uses a lower but similar outside-in view, saying Acko has raised roughly $450 million to $460
              million. Those are not trivial differences, and they likely reflect the line between disclosed equity
              rounds, tracker estimates, and broader group funding. Scale claims are similarly broad but directionally
              strong. Moneycontrol says Acko has issued more than 1 billion policies to more than 78 million unique
              customers, while Acko’s own board page uses the even wider framing of products trusted by more than 100
              million users. Those should be treated as evidence of substantial reach, not as perfectly reconciled
              denominators.
