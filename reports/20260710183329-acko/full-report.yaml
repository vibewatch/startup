        title: 'Customer base: retail policyholders, app users, partner users, and employer-covered members'
        blocks:
          - type: paragraph
            body: >-
              Acko’s customer base spans more than one denominator, so it has to be segmented carefully. Moneycontrol’s
              IPO reporting says the company has served more than 78 million unique customers and issued more than 1
              billion policies, while the app ecosystem and official app copy point to tens of millions of downloads,
              7.5-8 crore happy users or policyholders in marketing language, and a wide product mix spanning car, bike,
              health, travel, employee health, and life. Group health adds a distinct employer-sponsored customer layer:
              Acko’s group-health page says it covers 2 lakh-plus employees across 200-plus businesses, which is
              operationally different from self-serve retail users. Embedded partnerships create a fourth layer of
              “indirect” customers acquired inside travel, lending, residential-community, and mobility flows. The main
              diligence implication is that Acko’s customer story cannot be reduced to one clean user count. It is a
              combination of direct retail buyers, partner-flow policyholders, employees on group plans, and app users
              who may use vehicle utilities even between policy events.
