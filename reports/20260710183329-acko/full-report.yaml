  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Acko is actually competing for
        blocks:
          - type: paragraph
            body: >-
              The broadest market lens around Acko is the Indian insurance sector as a whole, but that is too loose to
              underwrite the company. Acko is not trying to serve every insurance line, every distribution format, or
              every buyer journey. Public sources show a more specific practical boundary: it is competing for digitally
              acquired and digitally serviced motor, health, travel, and protection customers, either directly or
              through embedded surfaces such as OEM checkout, community apps, and platform partners. That places Acko
              between two large incumbency structures. On one side are traditional insurers and agents whose strength is
              offline reach, claims networks, and brand familiarity. On the other side are comparison-led and broker-led
              digital platforms such as Policybazaar and Paytm Insurance that aggregate insurers rather than
              underwriting themselves. Official competitor pages make the contrast clear. Policybazaar positions itself
              as an IRDA-approved broker with 50-plus insurer relationships, while Paytm Insurance explicitly says it is
              a broker offering comparison and purchase infrastructure. Acko’s addressable market therefore sits at the
              intersection of consumer insurance demand, digital comparison behaviour, and embedded purchase moments
              where a full-stack insurer can replace both offline agents and aggregator handoff flows.
            claimRefs:
