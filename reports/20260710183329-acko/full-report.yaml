      - number: '7.2'
        title: Claims consistency and underwriting execution are operational risk multipliers
        blocks:
          - type: paragraph
            body: >-
              Acko’s operating model concentrates risk in a few customer-visible moments: onboarding, underwriting, and
              claims. Public customer sources show that when those moments go well, users can become vocal advocates.
              But the adverse evidence is persistent enough to matter. App Store captures, Trustpilot, and MouthShut all
              highlight claim delays, document loops, weak accountability, and disputes about coverage scope or claim
              interpretation. Ditto’s 2026 review is especially useful because it combines relatively positive health
              metrics with an explicit note that Acko remains early in its operating maturity and has already faced a
              regulatory penalty. Health expansion adds another layer. Business Today describes Acko’s stricter
              medical-test and underwriting approach as a strength, but that same design can create onboarding friction
              or adverse-selection mistakes if execution slips. Operationally, the risk is not just one denied claim; it
              is that a digital self-serve model can amplify reputational damage when edge cases are handled
              inconsistently across products, cities, garages, hospitals, or partner channels.
            claimRefs:
              - CR011
