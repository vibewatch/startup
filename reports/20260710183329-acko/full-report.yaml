      - number: '3.4'
        title: 'Moat durability: what could compound and what could commoditize'
        blocks:
          - type: paragraph
            body: >-
              Acko’s moat is credible but not permanent. The strongest compounding assets are underwriting control,
              proprietary claim and risk data, embedded-partner access, and the ability to shape simpler products
              without intermediary conflict. Those are more durable than surface-level UX claims. But the displacement
              vectors are real. Aggregators can pressure pricing and own buyer discovery; incumbents can copy digital
              front-end features while outmuscling Acko on repair networks, distribution relationships, and reserving
              capacity; and Digit proves that tech-led underwriting is not unique to Acko. The durability test is
              therefore whether Acko can keep converting partner access and cleaner underwriting into better renewal,
              lower acquisition leakage, and faster trust formation than balance-sheet-heavy incumbents or
              comparison-led brokers. Public evidence supports serious competitive relevance, but not a winner-take-all
              position. Acko is best framed as a strong contender in a crowded stack, not as an unassailable
              digital-insurance platform.
