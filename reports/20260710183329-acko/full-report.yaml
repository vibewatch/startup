              app discovery, and product flows that many users find easy enough to recommend. It also appears to have
              customer segments that value price, paperless buying, and self-serve claims more than they value branch
              access or agent relationships. But the public complaint set suggests a meaningful tail-risk distribution
              in support and claims. That matters because a digital insurer can look efficient on average while still
              damaging retention through a smaller share of bad experiences that spread quickly online. The core
              diligence questions are therefore cohort-based: which customer segments renew, which channels complain
              most, how often support escalations occur, and whether claim-resolution quality differs sharply by motor
