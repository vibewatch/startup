- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - Why it matters
  - What would change the view
  rows:
  - - Digital underwriting plus embedded distribution can produce structurally better economics
    - Thesis
    - Acko controls product, pricing, and claims on one stack
    - Need line-level renewal and margin proof
  - - Health expansion gives a second large growth engine beyond motor
    - Thesis
    - Supports multi-line compounding
    - Need cohort loss ratios and claims quality
  - - Losses are narrowing and solvency looks adequate
    - Thesis
    - Improving financial posture matters ahead of IPO
    - Need FY26 audited bridge and cash-flow visibility
  - - Governance overhang can compress public valuation
    - Anti-thesis
    - IRDAI order and live appeal remain confidence drags
    - Need board-level remediation and closure evidence
  - - Customer-support tails can damage trust faster than topline shows
    - Anti-thesis
    - Digital insurers are vulnerable to visible bad cases
    - Need claim-quality distributions and cohort retention
  - - IPO range may already discount too much execution
    - Anti-thesis
    - Limited room for error at premium pricing
    - Need either better disclosure or lower entry point
  notes: The investment call changes more on evidence quality and entry price than on market-size arguments.
