- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Governance remediation weak
    - No clear closure or new control failure appears
    - Breaks confidence premium and widens discount
    - Pause or walk away
  - - Claims-quality deterioration
    - Complaint / denial / delay data worse than expected
    - Breaks digital-trust and retention thesis
    - Reprice sharply lower
  - - Health unit economics weak
    - Loss ratios or acquisition costs disappoint
    - Breaks second-engine expansion thesis
    - Reduce upside case and demand lower entry
  - - Partner concentration high
    - Few channels dominate economics or complaints
    - Breaks embedded-moat argument
    - Require partner-adjusted downside case
  - - IPO tape weakens or offer delays
    - Timing slips materially or pricing resets
    - Breaks scarcity / momentum support for premium range
    - Prefer wait-and-see
  notes: These are practical IC triggers designed to move the call, not abstract observations.
  claimRefs:
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Entity-scope financial bridge
    - GI, life, and group-level reconciliation
    - Needed to value the right economic perimeter
    - Management + auditors
  - - Governance remediation
    - Board and regulator closure evidence
    - Needed to test whether the penalty is historical or living
    - Board, legal, compliance
  - - Line-level unit economics
    - Motor, health, travel, and embedded margins
    - Needed to separate growth from value creation
    - Actuarial and finance teams
  - - Partner concentration and economics
    - Top-account premium share, claims, renewal
    - Needed to underwrite embedded moat and downside
    - Partnership and finance teams
  - - Claims-quality distributions
    - Cycle time, denial reasons, escalations by cohort
    - Needed to assess retention and brand durability
    - Operations and CX teams
  - - IPO stress case
    - Capital plan under delay or reprice
    - Needed because tape risk is real
    - CFO and treasury
  notes: If management cannot satisfy these asks, the correct valuation stance is caution rather than optimism.
