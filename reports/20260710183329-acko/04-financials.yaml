  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue-scope
    missingEvidence: A consolidated bridge that reconciles ACKO General, ACKO Life, and the wider group to the higher FY25 revenue numbers cited in media reports.
    whyItMatters: Valuation and runway analysis are unreliable if the investor mixes group and entity scopes.
    diligencePath: Request consolidated audited FY25/FY26 statements and a legal-entity revenue bridge.
    relatedQuestionRefs:
    - QI002
    - QI022
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and management’s internal runway forecast.
    whyItMatters: Solvency does not answer whether the group can fund growth without additional capital before or after IPO timing.
    diligencePath: Request treasury, cash-flow, and financing plans by entity.
    relatedQuestionRefs:
    - QI017
    - QI023
  - type: missing-source
    severity: material
    topic: line-level unit economics
    missingEvidence: Loss ratio, commission, CAC, and renewal data by motor, health, travel, life, and partner channel.
    whyItMatters: Premium growth can destroy value if the incremental business is weakly priced or expensively acquired.
    diligencePath: Request actuarial and channel-cohort packs used by management and the board.
    relatedQuestionRefs:
    - QI020
    - QI021
  - type: stale
    severity: minor
    topic: debt-and-liabilities
    missingEvidence: A current disclosure of any debt, contingent liabilities, or project-finance style obligations across the group.
    whyItMatters: Even low-debt insurers can have hidden obligations in holding or service entities.
    diligencePath: Obtain statutory notes, board packs, and financing schedules for every material entity.
    relatedQuestionRefs:
    - QI019
