- id: financial-verdict-and-gaps
  title: Financial verdict on revenue quality, margin path, and diligence blockers
  body: 'The financial verdict is directionally positive but still short of investable-grade transparency. Acko has clearly scaled premium production, preserved regulatory capital, and improved the loss profile of the main GI entity. Public commentary also suggests that direct distribution is not just a marketing story: zero intermediary commissions, stricter health underwriting, and embedded acquisition at the point of transaction should be real economic advantages if claims discipline holds. Yet the reportable blind spots remain material. There is no clean public bridge across the group entities, no audited view of FY26 consolidated cash flow, no line-by-line loss ratio disclosure by motor versus health versus embedded programs, and no partner-channel contribution margin by cohort. Even the most optimistic public metrics therefore need to be treated as evidence of operating momentum rather than as a fully underwritten earnings base. Investors should view Acko’s financial posture as improving
    but still disclosure-constrained: good enough to merit serious work, not good enough to eliminate diligence on capital efficiency, channel economics, and runway.'
