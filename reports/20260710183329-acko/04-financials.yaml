- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy, financing dependency, and runway questions
  body: 'Capital adequacy is one of the more reassuring parts of the public picture, but it is not the same as runway transparency. The FY25 ACKO General annual report says authorised capital increased to Rs 3,500 crore, paid-up capital stood at Rs 2,796 crore, and solvency sat at 2.30x against the regulatory minimum. The same report says 35 crore equity shares were allotted during the year, showing that capital support has continued even as the business moves toward IPO preparation. Public disclosures also show operating scale in FY26: the GI disclosure lists premiums earned of Rs 1,917.91 crore and net claims incurred of Rs 1,270.74 crore up to March 2026, while ET’s IPO coverage says FY26 motor premiums reached Rs 1,186 crore and health premiums reached Rs 1,235 crore. Acko Life remains materially smaller but is no longer immaterial; its March 2026 public disclosure shows premium of Rs 18,832 lakh, commission of Rs 7,339 lakh, and operating expenses of Rs 6,700 lakh up to March 2026.
    What is still missing is public cash-on-hand, monthly burn, debt obligations, and a management-quality runway bridge. In other words, solvency looks fine, but financing dependency cannot be fully closed from public evidence alone.'
