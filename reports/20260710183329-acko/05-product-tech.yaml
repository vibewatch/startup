  title: Product-tech risk register
  columns:
  - Risk
  - Severity
  - Why it matters
  - Public signal
  - Diligence ask
  rows:
  - - Claims-SLA overstatement
    - High
    - Customer trust collapses quickly if claims speed is marketing-led rather than operationally real
    - Most speed claims are company-authored
    - Request raw claims-timing logs
  - - Partner-integration complexity
    - Medium
    - API launch promises may be easy for pilots but harder for scaled partners
    - Partnerships page emphasises ease of launch
    - Review implementation timelines by partner tier
  - - App sprawl
    - Medium
    - Too many utilities can dilute focus or inflate support burden
    - App listings bundle insurance and vehicle utilities
    - Examine MAU, retention, and feature usage concentration
  - - Health operations intensity
    - High
    - Hospital and OPD workflows require strong provider operations
    - Group health page advertises aggressive SLAs
    - Check approval denial and escalation data
  - - Weak independent tech proof
    - Medium
    - Public proof is architecture-heavy, benchmark-light
    - Limited external technical documentation
    - Request platform reliability and fraud metrics
  - - Cross-sell execution risk
    - Medium
    - Broad catalog does not ensure high attach rates
    - Portfolio breadth is visible, attach economics are not
    - Request cross-sell and renewal funnels by cohort
  notes: The product thesis is coherent, but every major operating claim still needs non-marketing evidence.
