  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: technical-performance
    missingEvidence: API reliability, uptime, latency, deployment velocity, and fraud-automation accuracy metrics.
    whyItMatters: Without operational telemetry, the platform thesis rests on product marketing rather than engineering proof.
    diligencePath: Request SLO dashboards, incident logs, and automation-performance reviews.
    relatedQuestionRefs:
    - QE019
    - QE022
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: claims-sla-audit
    missingEvidence: Raw claims-timing distributions for instant motor claims, 3-5 day turnaround, and group-health pre-authorisation.
    whyItMatters: Claims speed is the center of the user promise and should be tested with actual operational distributions rather than headline SLAs.
    diligencePath: Obtain claims-event logs segmented by product, geography, and severity.
    relatedQuestionRefs:
    - QE005
    - QE006
    - QE020
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: app-retention-and-engagement
