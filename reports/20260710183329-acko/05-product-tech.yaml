    - Group health page says 90% of OPD claims and 85% of reimbursement claims were settled within one day in FY26
    - Strong employee experience proposition
    - Could materially reduce HR escalation burden
    - Validate against raw operational dashboards
  notes: Claims speed is central to the product promise, but almost every SLA in public sources still needs independent operational verification.
