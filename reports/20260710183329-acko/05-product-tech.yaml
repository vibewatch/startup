- id: product-tech-verdict-and-limitations
  title: 'Product-tech verdict: coherent platform logic, limited independent technical proof'
  body: 'The product-tech verdict is positive on architecture and mixed on independent verification. Acko has a coherent product system: digital D2C products feed into a mobile app that also handles renewals and claims, while partner APIs allow the same insurance primitives to be embedded into lending, travel, mobility, and employee-health workflows. That is stronger than a thin brochureware insurer. The limitations are equally clear. Public sources do not provide deep technical documentation, uptime or latency metrics, fraud-loss improvements from automation, or externally benchmarked app-retention data. The YourStory AI article did not yield enough high-quality detail to underwrite the company’s AI claims independently, so the product case should rest on visible workflow design rather than on unverified automation narratives. Investors should therefore treat Acko as product-forward and integration-capable, while still demanding hard operational evidence on claim SLAs, partner performance,
    app retention, and platform reliability. The public product case is therefore promising but still evidentiary-light.'
