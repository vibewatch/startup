- id: app-and-claims-experience
  title: The app is a product surface, not just a policy container
  body: 'The strongest product signal in public sources is that Acko’s app is designed as an operational surface rather than a static policy locker. The app listings describe buy, manage, renew, and claim flows; partner-policy access; quote generation; instant renewals; and ancillary vehicle utilities such as challan checks, FASTag recharge, PUC reminders, resale-value checks, and EV-charger search. That mix suggests a deliberate effort to increase user touchpoints beyond claim day. Claims experience is central to that strategy. The app copy says minor car claims can be settled instantly while major damage triggers pickup, repair, and return within three days as per policy terms. The partnerships page separately says Acko offers a three-step claim procedure, real-time tracking, and 3-5 working day turnaround. For health and group products, Acko emphasizes paperless claims, cashless hospitals, and fast pre-authorisation. Public proof is still company-led, but the design intent is clear: compress
    insurance friction into app-native workflows.'
