artifact: competitors
slug: zankore
runDate: 2026-10-22
company:
  name: Zankore
chapter:
  number: 3
  title: Competitors
  summary: Zankore is entering the Southeast Asian AI-neocloud market with a tightly integrated telecom, networking, GPU, and financing stack, but public evidence does not yet establish customer traction, realized pricing, or a durable cost advantage. Its strongest differentiation is local infrastructure and ecosystem access; its principal competitive risks are incumbent cloud scale, GPU-price compression, and debt-funded capacity arriving before demand is contracted.
sections:
  - id: landscape
    title: Landscape and strategic position
    body: >-
      Zankore is positioned as an AI neocloud rather than a general-purpose
      colocation operator. Ooredoo's release describes a target of 1 GW of
      NVIDIA DSX AI Factory capacity, while the initial deployment is described
      as approximately 200 MW in the first half of 2027; The Next Web separately
      reports a 100 MW starting build. Those figures indicate staged deployment,
      not one settled operating capacity. The public partner set combines
      Ooredoo's capital and regional reach, Indosat's Indonesian market and
      infrastructure position, Nokia networking, and NVIDIA hardware and
      software. The resulting proposition is a locally hosted, high-density
      compute platform for enterprises, developers, hyperscalers, governments,
      and AI companies. That is differentiated from ordinary cloud only if
      Zankore can translate local sovereignty, latency, and regulated-workload
      access into contracted demand. The current sources identify intended
      customer groups, but do not name anchor customers or disclose committed
      workload volumes.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: buying-criteria
    title: Buyer criteria, capability, and pricing
    body: >-
      Buyers comparing Zankore with hyperscalers, incumbent Indonesian data
      centers, or another neocloud will care about usable GPU-hours, latency,
      data location, reliability, networking, support, security, and price
      after discounts. Zankore's disclosed capability case is specific on
      hardware and architecture: GB300 NVL72 systems, NVIDIA DSX, and DSX
      MaxLPS, with Ooredoo claiming that MaxLPS is designed to enable up to 40%
      more compute within the same power budget. That is a vendor-stated
      engineering proposition, not an independently measured customer outcome.
      Public materials do not provide a Zankore price card, utilization,
      service-level agreement, GPU-hour availability, or realized discount.
      The pricing comparison therefore separates observed list-price evidence
      from unknowns rather than inferring parity with global providers. A
      buyer may rationally pay for Indonesian location or sovereign handling,
      but that willingness remains an underwriting question until contracts or
      customer references are disclosed.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: moat
    title: Switching costs, distribution, and moat durability
    body: >-
      Zankore's potential moat is infrastructural and relational, not a
      proprietary model moat demonstrated in the assigned evidence. Indosat
      contributes local execution and connectivity, Ooredoo supplies capital
      and regional scale, Nokia supplies AI-native networking, and NVIDIA
      supplies the accelerated-computing stack. This combination can shorten
      permitting, power, network, and deployment paths relative to a new entrant
      starting without a telecom partner. It can also create distribution into
      Indonesian enterprises and public-sector workloads. However, the same
      stack creates multi-homing and substitution risk: customers can compare
      Zankore with hyperscalers, existing regional facilities, and other
      NVIDIA-backed neoclouds. The Next Web reports that loan economics depend
      on customer demand and that GPU collateral could lose value as the market
      changes. That makes customer contracts, service reliability, and workload
      portability more important than headline capacity. No source establishes
      exclusivity, minimum-volume commitments, or a switching-cost schedule.
    claimRefs: [CP009, CP010, CP011, CP012]
  - id: displacement
    title: Displacement and competitive risks
    body: >-
      The adverse case is that Zankore builds an expensive supply position before
      regional demand is proven. The Next Web notes that the company launched
      only about one month before securing up to $3.1 billion of senior debt and
      says the structure leaves lenders exposed if customers do not sign enough
      contracts. AInvest makes the sharper analytical argument that the debt is
      roughly four times the approximately $800 million founding equity and that
      GPU value is periodically repriced; because it is an opinionated analysis,
      the leverage framing should not be treated as audited balance-sheet data.
      Remio's analysis adds a separate displacement constraint: the 1 GW
      ambition depends on cooling, water, and energy choices that remain
      undisclosed, while phased expansion should be conditioned on measured
      performance and demand. Together these sources imply three diligence
      tests: named anchor demand, financing and collateral terms, and a credible
      resource plan. Until those are available, Zankore's partner advantage may
      improve access to infrastructure without proving a durable economic moat.
    claimRefs: [CP013, CP014, CP015, CP016]
    tableRefs: []
tables:
  - id: TP001
    title: Competitor and substitute profile
    columns: [Alternative, Category, Scale or funding evidence, Target customer, Differentiation, Limitation]
    rows:
      - [Zankore, Direct AI neocloud entrant, "Target 1 GW; approximately 200 MW first phase in 2027; up to $3.1B senior term loan", "Enterprises, developers, hyperscalers, governments, AI companies", "Indonesian location plus telecom, networking, GPU, and capital partners", "No named anchor customers, public price card, or disclosed utilization"]
      - [Hyperscale cloud providers, Incumbent cloud, "No assigned source provides a comparable capacity or funding figure", "Broad enterprise and developer workloads", "Mature service breadth, software ecosystem, and multi-region redundancy", "May be less differentiated on Indonesian sovereignty or local latency"]
      - [Existing Indonesian or regional data centers, Incumbent or adjacent infrastructure, "Assigned evidence does not quantify their AI-GPU capacity", "Enterprises and colocated workloads", "Existing facilities, operating history, and potentially lower execution risk", "AI-specific GPU density, software, and network integration are unknown"]
      - [Other NVIDIA-backed neoclouds, Direct/adjacent AI compute, "The Next Web describes Firmus as another NVIDIA-backed Indonesian project; no comparable Zankore contract data", "AI developers and enterprise workloads", "Purpose-built accelerated compute and access to NVIDIA ecosystem", "Shared GPU supply and financing model can intensify price and collateral risk"]
      - [Internal build, Substitute, "No public Zankore comparison or benchmark", "Large enterprises and governments with predictable workloads", "Control over data, architecture, and schedule", "Requires capital, operations, power, and specialist talent"]
    notes: "Scale and funding fields are limited to assigned public sources; blank comparative metrics are not estimates. Competitor rows are market categories where no named company evidence was retained."
    claimRefs: [CP001, CP003, CP009, CP013]
  - id: TP002
    title: Capability and buying-criteria comparison
    columns: [Buying criterion, Zankore evidence, Hyperscaler or incumbent comparator, Buyer implication]
    rows:
      - [Accelerated compute, "GB300 NVL72 and NVIDIA DSX are named", "Comparator hardware and allocation are not evidenced in this pool", "Verify delivered GPU type, availability, and refresh schedule"]
      - [Power and workload efficiency, "DSX MaxLPS is described as designed for up to 40% more compute in the same power envelope", "No independent benchmark or comparator result", "Treat as company/partner claim until workload-level tests are supplied"]
      - [Network and local access, "Nokia AI-native networking and Indosat/Ooredoo infrastructure are described", "Regional incumbent network performance is not quantified", "Test latency, cross-connects, egress, and failure domains"]
      - [Sovereignty and regulated workloads, "Indonesia-first deployment and government/enterprise target segments are stated", "Hyperscaler jurisdiction and service controls are not covered by assigned sources", "Obtain data-residency, audit, and incident-response terms"]
    notes: "Cells summarize assigned public descriptions, not like-for-like product tests. Missing comparator values remain unknown."
    claimRefs: [CP004, CP005, CP006, CP009]
  - id: TP003
    title: Pricing and packaging evidence
    columns: [Provider or option, Price or contract model, Included capability, Discount or unknowns, Competitive implication]
    rows:
      - [Zankore, null, "GPU capacity for training, fine-tuning, inference, and agentic workloads is reported", "No public list price, realized price, SLA, or minimum commitment", "Pricing power and gross-margin potential cannot yet be assessed"]
      - [Hyperscale cloud providers, null, "Broad cloud services are a category-level comparator", "No comparable quote or GPU price in assigned sources", "Obtain apples-to-apples regional GPU-hour quotes"]
      - [Existing data centers, null, "Colocation or infrastructure substitution is plausible", "AI-GPU packaging and power terms are unknown", "Compare delivered compute, not headline MW"]
      - [Internal build, null, "Customer owns the stack and operating decisions", "Capital, staffing, and utilization requirements are unknown", "Use only where workload volume justifies fixed-cost control"]
    notes: "Null prices mean the assigned evidence contains no public price or contract quote; they do not mean free service or zero cost."
    claimRefs: [CP007, CP008, CP010, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    summary: Ordinal positioning highlights Zankore's local infrastructure access and unresolved commercial proof relative to broad incumbent and substitute categories.
    type: quadrant
    data:
      points:
        - label: Zankore
          x: 4
          y: 3
          detail: "High disclosed integration and local access; low public proof of price and contracted demand"
        - label: Hyperscale cloud
          x: 2
          y: 5
          detail: "Broad ecosystem and operating maturity; local sovereignty fit is not established here"
        - label: Existing regional data center
          x: 3
          y: 4
          detail: "Potential operating history; AI-specific capacity and integrated stack are unknown"
        - label: Internal build
          x: 5
          y: 1
          detail: "Maximum customer control; highest assumed execution burden"
        - label: Other AI neocloud
          x: 3
          y: 2
          detail: "Purpose-built GPU capacity; public evidence of regional contracts and financing varies"
        - label: Regional telecom cloud
          x: 4
          y: 3
          detail: "Potential local network access; AI-specific capacity and software integration are unknown"
      xAxis: "Local infrastructure and sovereignty fit (ordinal, 1 low to 5 high)"
      yAxis: "Publicly evidenced operating and commercial maturity (ordinal, 1 low to 5 high)"
    approximationNotes: "Coordinates are analyst ordinal scores from the cited evidence and are not market-share, performance, or price measurements."
    claimRefs: [CP003, CP007, CP009, CP013]
callouts:
  - calloutType: strength
    title: Integrated local platform
    body: "Zankore's strongest differentiator is the combination of Indonesian telecom execution, regional capital, NVIDIA compute, and Nokia networking rather than a separately evidenced proprietary model."
    claimRefs: [CP003, CP009]
  - calloutType: risk
    title: Capacity can outrun demand
    body: "The debt-funded buildout creates a material displacement risk if customer contracts, utilization, or GPU resale values do not support the planned capacity."
    claimRefs: [CP013, CP014, CP015]
  - calloutType: recommendation
    title: Underwrite contracts before scale
    body: "Before treating the 1 GW ambition as a moat, require named anchor customers, minimum-volume or revenue-support terms, realized price evidence, and disclosed collateral and cooling constraints."
    claimRefs: [CP007, CP012, CP013, CP016]
