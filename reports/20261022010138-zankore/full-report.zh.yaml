  - id: TV001
    title: 建议摘要
    columns:
      - 决策事项
      - 当前判断
      - 对决策的影响
    rows:
      - - 建议
        - 继续研究 / 跟踪
        - 在价格和保护条款披露前，不要对其进入市场进行投资判断。
      - - 信心
        - 中
        - 融资和产能证据较强；估值和商业证据不完整。
      - - 风险评级
        - 高
        - 大规模债务融资部署早于已披露的运营历史和锚定需求。
      - - 估值立场
        - 公开支持不足
        - 将 US$800 million 承诺视为融资背景，而不是公司估值。
      - - 进入纪律
        - 有条件
        - 要求提供股权结构表、债务清偿瀑布、已签约需求、单位经济性和回收情景。
      - - 改变判断的证据
        - 经审计的经济性与具有约束力的承购协议
        - 只有在利用率、利润率、债务偿付和稀释完成建模后，才确定价格。
    notes: 分析师判断基于截至 2026-10-22 审阅的公开证据；在指定来源集合中，没有公开可得的当前股权估值或完整融资清偿瀑布。
