            body: >-
              Ooredoo Group 是创始股东和领投方，披露持股 49%，并承诺约 8 亿美元用于发布和初期开发。Indosat 提供本地基础设施和执行能力，NVIDIA 提供加速计算架构与 GPU，Nokia 提供原生
              AI 网络。公开领导层信息远少于发起方信息。Vikram Sinha 被确认是 Zankore 董事兼主席，领投方则由 Ooredoo Group CEO Aziz Aluthman Fakhroo
