  - id: TV002
    title: 投资论点与反论点
    columns:
      - 立场
      - 论点
      - 当前证据
      - 哪些信息会改变判断
    rows:
      - - 投资论点
        - 战略股东可以提供资本和执行支持。
        - Ooredoo 承诺约 US$800 million，持股 49%。
        - 股东支持不足，或进行大幅稀释的资本重组。
      - - 投资论点
        - 银行融资可以加快区域规模化 AI 算力建设。
        - 五家银行安排或承销了最高 US$3.1 billion 的融资。
        - 融资提款条件或契约严重限制部署。
      - - 投资论点
        - 如果需求已签约，产能可以创造经营杠杆。
        - 已公布路径是初期 100 MW、2027 年上半年约 200 MW，以及三年内达到 1 GW。
        - 已签约需求无法跟上已投产产能。
      - - 反论点
        - 资本形成领先于运营验证。
        - 融资在发布后约四周完成。
        - 经审计的利用率、留存率和现金利润率队列数据可得。
      - - 反论点
        - GPU 剩余价值与客户需求构成相互关联的下行风险。
        - 信用支持和部署都与需求挂钩，而抵押品细节仍不清楚。
        - 长期照付不议合同和保守的抵押品折扣得到记录。
    notes: 股东预测和产能目标不是经审计结果；判断变化需要交易原始文件和运营证据，而不是更多公告。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 具有约束力且多元化的承购需求；2027 年产能按时交付；高利用率；电力优化转化为可销售算力。
        - 按融资后的已签约 EBITDA 估值，只有在可重复的现金收益得到证明后才给予溢价。
        - 执行、集中度、技术更新和杠杆。
        - 已签合同、经审计的利润率和契约余量。
      - - 基准
        - 分阶段交付；利用率落后于产能爬坡；股东支持仍可获得。
        - 使用保守的基础设施倍数，并充分计入 GPU 更新、利息和稀释。
        - 闲置产能和融资成本带来较低回报。
        - 季度利用率队列，以及高于下行情景阈值的债务偿付覆盖率。
      - - 悲观
        - 承购需求令人失望；GPU 价值压缩；建设延迟；契约或再融资压力出现。
        - 以高级债权索偿主张受偿顺序之后的回收价值为锚，而不是已宣布的融资或重置成本。
        - 减值、资本重组、贷款方控制和股权稀释。
        - 客户取消、部署延迟、契约豁免或二手 GPU 价格下跌。
    notes: 这些是定性情景，而非按概率加权的估值区间；收入、现金流、债务经济性、资本表条款和可辩护的可比交易均未披露。
    claimRefs:
      - CV005
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
