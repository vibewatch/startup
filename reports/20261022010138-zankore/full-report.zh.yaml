              - CR012
              - CR013
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 论点失效触发条件
            body: 如果 Zankore 无法证明具有约束力的客户承诺和已投运产能足以支持每个债务融资部署阶段，或 GPU 抵押品和债务契约在利用率或硬件价格出现重大冲击后无法留下可行的下行情景，就应视为投资论点受损。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR016
          - type: callout
            title: 证据边界
            body: 本处审阅的公开来源描述的是公告计划和融资，而不是经审计的 Zankore 结果、已执行客户合同、贷款契约、许可或不存在事故。这些项目仍是明确的尽调要求。
            calloutType: assumption
            claimRefs:
              - CR003
              - CR012
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议的态度是继续研究并跟踪，而不是买入。Ooredoo 以约 US$800 million 换取 49% 股权的承诺，以及最高 US$3.1 billion
              的高级定期贷款额度，证明了发起方和贷款方的资金能力；若利用率按计划形成，计划中的 100 MW→200 MW→1 GW
              扩张也会带来显著经营杠杆。但这些优势不能确定可投资价格。公开记录没有披露当前股权估值、贷款定价、到期日、契约、抵押品包、优先股堆叠或已命名锚定客户。因此，入场纪律应表达为条件，而不是点估值：在评估回报前，要求完全稀释后的股权结构表、融资
              清偿瀑布、签约收入计划、单位经济和下行回收分析。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与融资背景
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在异常强的战略发起方、银行参与和区域产能计划之上，并对应公司引用的东南亚数据中心需求增长。Ooredoo 还估计前五年累计贡献约 6 亿美元 EBITDA，但这是发起方预测，而非经审计的
              Zankore 表现。反论点是，贷款方在仅约四周经营历史后就承诺了大额资本，而部署与客户需求及条款未披露的信用支持挂钩。NVIDIA 既是支持方又是硬件供应商，因此部分生态需求是通过购买 NVIDIA
              设备的载体融资的。这种一致性可以加速部署，但也集中技术、残值和利用率风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: 情景框架与可比限制
        blocks:
          - type: paragraph
            body: >-
              合适的估值模型应在扣除电力、托管、硬件融资和更新成本后，把企业价值与签约毛利或 EBITDA 挂钩，而不是套用通用软件收入倍数。乐观情景要求有签约需求、2027
              年按时交付、高利用率，以及证明电力优化改善可销售算力经济性。基准情景假设分阶段部署和利用率延迟，价值会高度受融资成本和客户爬坡影响。悲观情景则结合承购疲弱、GPU
              过时、契约压力和较低抵押品回收。由于当前估值、预测现金流、可比交易和债务条款均缺失，基于已审阅证据无法发布可辩护的估值区间或概率权重。
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              退出准备度仍早期：Zankore 于 2026 年 8 月发布，公开记录主要是发起方公告和融资报道，而非经营结果。如果平台把计划产能转化为多元且资信可靠的合同，并证明扣除 GPU
              更新义务后的现金收益，战略退出才可能变得可行；基础设施或公开市场路径还需要经审计的分部报告和持久的杠杆指标。在投资前，应取得签署的承购计划、客户集中度、利用率和价格
              按客户队列拆分的利用率和定价、项目层面现金流、债务和担保文件、GPU 更新承诺、资本结构权利及下行回收情景。论点失效触发条件包括 2027
              年产能计划明显延误、利用率低于偿债需要、没有保障的客户集中度、契约承压，或设备价值下降速度快于本金摊还。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 战略支持和融资是必要条件，但还不充分：只有在可支撑的入场价格、高级债权索偿主张的受偿顺序、签约利用率和完全负担后的单位经济得到验证后，建议才可转向投资。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV014
              - CV016
          - type: callout
            title: 论点失效条件
            body: 若产能延期、契约豁免、签约利用率疲弱，或 GPU 抵押品价值下降快于贷款摊还，应将其视为暂停投资论点的触发条件。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV015
