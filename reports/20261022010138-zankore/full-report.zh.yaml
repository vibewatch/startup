    sections:
      - number: '1.1'
        title: 身份、发布与运营模式
        blocks:
          - type: paragraph
            body: >-
              Zankore 于 2026 年 8 月发布，是由 Indosat Ooredoo Hutchison、Ooredoo Group、NVIDIA 和 Nokia 开发的印度尼西亚 AI
              云和新云平台。留存证据支持印度尼西亚是首个部署市场，但没有确认法定总部，也未完整说明注册实体。其运营模式是基础设施即服务：Zankore 计划向企业、开发者、初创公司和机构按需提供 NVIDIA GPU
              集群，用于训练、微调、推理和智能体工作负载。因此，公司披露的状态仍是早期建设，而非成熟运营：首个 100 MW 部署正在融资，2027 年上半年目标约 200 MW，长期目标为 1 GW。
