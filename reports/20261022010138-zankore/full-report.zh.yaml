              贡献，其他公开估计则给出五年累计约 130 亿美元收入和 90 亿美元 EBITDA；这些是公司或分析师估计，不是经审计的 Zankore
              报表，且范围和分母不同，无法直接核对。初始建设因此显得资本密集且依赖融资，需求爬坡和抵押品价值是主要下行变量。投资判断应要求已执行的承购合同、客户集中度、价格和利用率计划、债务文件、提款条件、契约余量、电力和制冷成本、资本支出发票及月度现金流预测。在这些材料交付前，合适的态度是有条件关注，而不是给出量化估值。
