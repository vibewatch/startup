  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              Zankore 所处市场是东南亚云、企业和政府工作负载使用的区域 GPU 即服务及集成 AI 基础设施，首个部署市场为印度尼西亚。纳入范围包括专用加速计算产能、相关 AI
              软件和网络，以及交付这些产能所需的电力、制冷和运营服务；不包括整个电信市场、所有传统数据中心托管业务，也不包括 NVIDIA 芯片销售的全部价值。公开描述将 Zankore
              定位在类似超大规模云的算力服务与运营商管理的基础设施组合之间：平台计划销售训练、微调、推理和智能体工作负载的 GPU
              产能，同时整合电信基础设施、加速计算、网络、电力、制冷和运营（SM007；SM006）。现实中的替代方案是买方从超大规模云、独立新云、数据中心运营商或内部部署中自行拼装这些层。Zankore
              提出的方案是区域供应商打包网络和算力，可能简化采购，但也增加集中度和可迁移性问题。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 规模化视角与证据限制
        blocks:
          - type: paragraph
            body: >-
              公开证据中最强的规模化视角是物理产能，而非收入。Ooredoo 宣布目标是在东南亚建设 1 GW 的 NVIDIA DSX AI Factory 产能，预计 2027 年上半年约 200
              MW（SM005）。独立报道描述了分阶段计划：从印度尼西亚 100 MW 建设开始，2027 年上半年达到约 200
              MW；因此这些数值代表不同部署阶段，并非相互冲突的估计（SM003；SM007）。Ooredoo 还引用行业分析称，东南亚数据中心产能需求到 2030 年可能增长约 3.5 倍，但这只是区域需求指标，不是
              Zankore 收入或可服务市场计算（SM005）。资本视角同样不能替代收入：Ooredoo 称将以约 8 亿美元换取 49% 股权，而独立报道提到最高 31
              亿美元的高级定期贷款额度（SM005；SM003；SM007）。这些数字证明的是雄心和融资强度，而非客户需求、利用率、价格或现金回报。基于留存证据，无法在不臆造利用率、GPU
              小时价格、合同覆盖率或地域分配的情况下拆出定量 SAM/SOM。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
