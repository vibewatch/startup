      - number: '3.3'
        title: 切换成本、分销与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Zankore 潜在的护城河来自基础设施和关系，而不是指定证据中已证明的专有模型。Indosat 提供本地执行和连接，Ooredoo 提供资本和区域规模，Nokia 提供原生 AI 网络，NVIDIA
              提供加速计算栈。这一组合相较于没有电信伙伴的新进入者，可能缩短许可、电力、网络和部署路径，也可能把分销带入印度尼西亚企业和公共部门工作负载。但同一套栈也带来多重托管和替代风险：客户可以将 Zankore
              与超大规模云、现有区域设施及其他 NVIDIA 支持的新云比较。The Next Web 报道称，贷款经济性取决于客户需求，而 GPU 抵押品可能随市场变化贬值。因此，客户合同、服务可靠性和工作负载可迁移性比
              融资标题中的产能更重要。没有来源确认排他性、最低量承诺或切换成本表。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 替代与竞争风险
        blocks:
          - type: paragraph
            body: >-
              逆向情景是，Zankore 在区域需求得到验证前就建成昂贵的供应能力。The Next Web 指出，公司在取得最高 31
              亿美元高级债务前仅成立约一个月，并称若客户没有签署足够合同，贷款方将承担风险。AInvest 给出更尖锐的分析：债务约为约 8 亿美元创始股权的四倍，且 GPU
              价值会周期性重估；由于这是带有观点的分析，杠杆表述不应视为经审计的资产负债表数据。Remio 的分析提出另一项替代约束：1 GW
              雄心取决于仍未披露的制冷、用水和能源选择，分阶段扩张应以实测表现和需求为条件。综合来看，需要做三项尽调测试：已命名的锚定需求、融资和抵押品条款，以及可信的资源计划。在这些材料到位前，Zankore
              的伙伴优势或许能改善基础设施接入，但尚未证明持久的经济护城河。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 集成式本地平台
            body: Zankore 最强的差异化来自印度尼西亚电信执行、区域资本、NVIDIA 算力和 Nokia 网络的组合，而不是已有独立证据的专有模型。
            calloutType: strength
            claimRefs:
              - CP003
              - CP009
          - type: callout
            title: 产能可能跑在需求前面
            body: 债务融资的建设若得不到客户合同、利用率或 GPU 转售价值支持，计划中的产能就会面临实质性替代风险。
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: callout
            title: 先评估合同，再看规模
