      - number: '1.3'
        title: 资本结构与里程碑
        blocks:
          - type: paragraph
            body: >-
              Zankore 披露的最大融资是债务，而不是收入、ARR、已募股权或可用现金。五家银行组成的银团安排了最高 31 亿美元的高级定期贷款额度，用于采购和部署 NVIDIA GPU
              基础设施。报道还提到收入分成和信用支持安排，意在让部署节奏跟随需求。Natixis 进一步披露，其贷款份额以 GPU
              设备、重大合同及与付费客户签订的照付不议承购协议作担保。这些保护措施说明可能存在部分已签约需求，但留存来源没有披露客户名称、数量、利用率、定价、提款状态、到期日、利息成本或契约余量。因此，融资主标题
              只能证明可用债务额度，不能证明企业价值或已验证的经营规模。
