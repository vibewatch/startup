            body: >-
              公开单位经济还不足以支撑传统 SaaS 或平台型市场投资模型。某份股票研究估计假设每 MW 开发资本支出为 US$20-25 million、每 MW 年收入为 US$10-13 million、EBITDA
              利润率为 69%，但这些是基于管理层披露和同行区间的分析师假设，不是 Zankore 已报告的结果。同一分析估计项目 IRR 为
              12-13%，股权回本期少于三年；这些结果应视为取决于利用率、定价、电力成本、GPU 寿命和融资条款的估计。公司和母公司材料披露的是累计收入/EBITDA 或可归属 EBITDA
              估计，没有客户层面的桥接。公开信息中没有实际价格、GPU 利用率、毛利率、电力成本、维护成本、折旧表、CAC、回本期或贡献利润率。因此，财务结论是利润率潜力仍基于情景，验证所需证据掌握在私有材料中。
