  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 可见的股东和贷款方融资能力支持有条件地继续跟踪，因为商业验证、债务保护和有依据的进入估值仍然缺失。
    data:
      nodes:
        - id: sponsor-capital
          label: 股东资本
          detail: 承诺投入约 US$800 million，换取 49% 持股。
        - id: debt-capacity
          label: 债务能力
          detail: 五家银行提供最高 US$3.1 billion 的高级定期贷款融资。
        - id: scale-plan
          label: 规模计划
          detail: 初始建设 100 MW，2027 年上半年约 200 MW，目标达到 1 GW。
        - id: proof-gap
          label: 商业验证缺口
          detail: 没有具名锚定客户或已披露的签约收入时间表。
        - id: downside-gap
          label: 下行保护缺口
          detail: 贷款抵押品、契约、追索权和优先权条款未披露。
        - id: decision
          label: 继续研究 / 跟踪
          detail: 只有在已签约需求、单位经济性和回收保护得到验证后，才确定价格。
    approximationNotes: 该顺序是分析性的，而非按时间排列；它不量化转化率、概率、企业价值或投资回报。
