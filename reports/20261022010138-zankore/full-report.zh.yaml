      - number: '2.3'
        title: 买方、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              已披露买方有三个主要群体。云客户和 AI 开发者需要灵活的 GPU 产能来训练、微调、推理和运行智能体工作负载；企业需要从 AI
              试验走向关键任务部署；政府需要主权或区域可控的基础设施（SM007；SM006）。在这些细分市场中，经济买方只是被映射出来，并非已披露：可能是云或技术组织、企业基础设施或 AI
              预算负责人，或公共部门数字主管；已审阅来源没有确认实际预算负责人。集成电力、制冷、网络和算力，以及公司声称 DSX MaxLPS 可在同一电力预算内实现最高 40%
              更多算力，强化了采用逻辑（SM005；SM006）。主要约束是商业化前建设、需求转化、债务偿付和供应商集中度。报道称，贷款包含收入分成和信用支持安排，旨在把部署速度与客户需求挂钩（SM007）；首批约 200
              MW 预计要到 2027 年上半年才交付（SM001；SM005）。因此，在把产能目标视为已实现市场渗透前，买方应先要求确认工作负载可迁移性、算力专属服务水平、价格和产能承诺，以及已签约利用率证据。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 产能雄心不等于市场占领
            body: >-
              Zankore 已公开披露产能、资本和合作伙伴，但留存证据没有披露客户名称、签约 GPU 数量、价格、利用率或已实现收入。投资判断应把 1 GW 视为建设目标、把 200 MW 视为计划中的第一阶段，而不是
              SAM、SOM 或需求转化的证据。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM016
          - type: callout
            title: 融资提高利用率门槛
            body: 31 亿美元高级定期贷款、约 8 亿美元创始承诺和快速变化的 GPU 抵押品叠加后，锚定客户转化和利用率成为核心市场风险，而不是次要经营细节。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局与战略定位
        blocks:
          - type: paragraph
            body: >-
              Zankore 的定位是 AI 新云，而非通用型托管运营商。Ooredoo 的公告目标是 1 GW NVIDIA DSX AI Factory 产能，初始部署则描述为 2027 年上半年约 200 MW；The
              Next Web 另称起步建设为 100 MW。这些数字说明部署分阶段推进，而不是已有一个确定的运营产能。公开合作方组合了 Ooredoo 的资本和区域覆盖、Indosat
              的印度尼西亚市场及基础设施地位、Nokia 的网络能力，以及 NVIDIA 的硬件和软件。最终方案是面向企业、开发者、超大规模云、政府和 AI 公司的本地托管高密度算力平台。只有当 Zankore
              能把本地主权、低延迟和受监管工作负载接入转化为签约需求时，它才真正区别于普通云。当前来源只确认了目标客户群，没有确认锚定客户或签约工作负载量。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP013
      - number: '3.2'
        title: 买方标准、能力与定价
        blocks:
          - type: paragraph
            body: >-
              买方在 Zankore、超大规模云、印度尼西亚现有数据中心或另一家新云之间比较时，会关注可用 GPU 小时、延迟、数据位置、可靠性、网络、支持、安全，以及折扣后的价格。Zankore
              披露的能力论证具体涉及硬件和架构：GB300 NVL72 系统、NVIDIA DSX 和 DSX MaxLPS；Ooredoo 声称 MaxLPS 的设计目标是在同一电力预算内实现最高 40%
              更多算力。这是供应商声称的工程命题，不是独立测量的客户结果。公开材料没有提供 Zankore 价目表、利用率、服务水平协议、GPU 小时可用量或实际折扣。因此，定价比较应区分已观察到的
              标价证据和未知项，而不能推断与全球供应商价格相当。买方可能愿意为印度尼西亚所在地或主权数据处理付费，但在合同或客户参考资料披露前，这仍是投资判断问题。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
