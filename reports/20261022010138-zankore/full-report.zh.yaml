      - number: '4.2'
        title: 资本结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              对一家从零建设的新云而言，已披露资本结构的债务占比异常高。Ooredoo 称将以约 8 亿美元取得 49% 创始股权，后续报道则称五家银行安排了最高 31 亿美元的高级定期贷款额度，为 GPU
              建设提供资金。这些数字不等于可用现金：股权承诺分布在投资期内，而贷款额度的提款、契约、抵押品条款、定价、摊还和先决条件，在指定证据中都未公开。由此得到的核心比率是最高 31 亿美元债务额度对 8
              亿美元已声明发起方承诺，但这不是已提款债务或总资本的经验证杠杆率。逆向分析将该额度描述为以 GPU
              抵押的贷款，并把利用率、折旧和硬件重定价列为核心风险。现金余额、现金消耗、资金续航、再融资计划或偿债覆盖率均未披露。
