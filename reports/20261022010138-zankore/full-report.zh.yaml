  - id: FU001
    title: 拟议客户旅程与证据检查点
    type: journey-map
    summary: 已披露的商业路径从目标客户群走向与需求挂钩的产能扩张，但部署和续约检查点仍缺少客户验证。
    data:
      items:
        - label: 目标账户
          actor: 企业、初创公司、开发者、AI 原生公司或机构
          touchpoints: Public positioning and partner ecosystem
          detail: 具名潜在客户、买方角色和获客渠道未披露。
        - label: 工作负载筛选
          actor: 技术与基础设施团队
          touchpoints: Training, fine-tuning, inference and agentic AI
          detail: 没有公开可得的工作负载级管线或客户需求数据。
        - label: 商业承诺
          actor: 买方、Zankore 与融资对手方
          touchpoints: Revenue-sharing and credit-support structure
          detail: 定价、合同期限、积压订单和承诺产能未披露。
        - label: 初始部署
          actor: Zankore 运营团队与客户技术团队
          touchpoints: Initial 100 MW infrastructure build
          detail: 没有证据证明投产、客户分配和生产使用。
        - label: 产能扩张
          actor: Zankore 与创始合作伙伴
          touchpoints: Approximately 200 MW planned for the first half of 2027
          detail: 已披露里程碑衡量的是计划供应，而不是客户采用。
        - label: 区域规模化与续约
          actor: 东南亚客户与 Zankore
          touchpoints: Up to 1 GW long-term target
          detail: 利用率、续约、扩张和集中度指标仍未披露。
    approximationNotes: 这是根据目标客户群、工作负载和产能里程碑推断出的尽调旅程，并非已观察到的转化漏斗，也不暗示任何转化率。
