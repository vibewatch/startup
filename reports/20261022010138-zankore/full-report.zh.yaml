            body: >-
              Zankore 披露的收入机制是向云、企业和政府客户销售 AI 算力，首个部署市场为印度尼西亚，扩张范围为东南亚。平台被描述为整合 NVIDIA 算力、Nokia 网络、电力、制冷和运营的全栈 AI
              工厂；这一架构说明了计划提供的服务，却不能证明实际价格或利润率。公开材料给出 2027 年上半年约 200 MW 的目标和长期 1 GW 目标，但没有披露实际收入、ARR、利用率、已签客户名称、合同期限或每
              GPU 小时的实际价格。第三方报道称没有公开锚定客户，部署速度和客户需求相关条款也未披露。因此，当前商业进展记录支持的是产能规划和发起方意图，而不是经得起投资判断的经常性收入。
