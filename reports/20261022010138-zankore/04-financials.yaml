company:
  name: Zankore
chapter:
  number: 4
  title: Financials
  summary: Zankore is an early-stage AI neocloud joint venture whose public economics are dominated by sponsor estimates and a large GPU-backed debt facility rather than reported operating revenue. The investment case depends on filling an initial 100-200MW deployment quickly enough to service debt, while pricing, utilization, customer contracts, cash balances, and realized margins remain undisclosed.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Zankore's disclosed revenue mechanism is AI compute sold to cloud, enterprise,
      and government customers, with Indonesia as the first deployment market and
      Southeast Asia as the expansion footprint. The platform is described as a
      full-stack AI factory combining NVIDIA compute, Nokia networking, power,
      cooling, and operations; that architecture explains the intended service
      rather than proving a realized price or margin. Public materials identify a
      target of approximately 200MW in the first half of 2027 and a longer-term
      1GW target, but they do not disclose live revenue, ARR, utilization, signed
      customer names, contract tenor, or realized price per GPU-hour. A third-party
      account says no anchor customers are named and the terms tied to deployment
      pace and customer demand are not disclosed. Accordingly, the current traction
      record supports capacity planning and sponsor intent, not underwriting of
      recurring revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-structure-and-debt
    title: Capital structure and financing dependency
    body: >-
      The disclosed capital stack is unusually debt-heavy for a greenfield
      neocloud. Ooredoo says it will commit approximately US$800 million for a
      49% founding stake, while later coverage reports a senior term loan facility
      of up to US$3.1 billion arranged by five banks to fund the GPU buildout.
      Those figures are not equivalent to cash available: the equity commitment is
      spread over the investment period, and the loan is a facility whose draw,
      covenants, collateral terms, pricing, amortization, and conditions precedent
      are not public in the assigned evidence. The resulting headline ratio is
      roughly US$3.1 billion of maximum debt facility to US$800 million of stated
      sponsor commitment, but that is not a verified leverage ratio for drawn debt
      or total capitalization. An adverse analysis characterizes the facility as
      collateralized GPU lending and highlights utilization, depreciation, and
      hardware repricing as the central risks. No cash balance, burn, runway,
      refinancing plan, or debt-service coverage is disclosed.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
  - id: margin-and-unit-economics
    title: Margin path and unit-economics evidence
    body: >-
      Public unit economics are not sufficient for a conventional SaaS or
      marketplace underwriting model. An equity-research estimate assumes
      development capex of US$20-25 million per MW, annual revenue of US$10-13
      million per MW, and a 69% EBITDA margin, but these are analyst assumptions
      based on management disclosure and peer ranges, not reported Zankore
      results. The same analysis estimates project IRR at 12-13% and equity
      payback at less than three years; these outputs should be treated as
      estimates contingent on utilization, pricing, power cost, GPU life, and
      financing terms. The company and parent materials instead disclose
      cumulative revenue/EBITDA or attributable EBITDA estimates without a
      customer-level bridge. There is no public realized price, GPU utilization,
      gross margin, power cost, maintenance cost, depreciation schedule, CAC,
      payback, or contribution margin. The key financial conclusion is therefore
      that margin potential is scenario-based and the evidence needed to test it
      is private.
    claimRefs: [CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      Zankore has a credible sponsor and infrastructure-partner base, but the
      financial case is not yet auditable from public information. Ooredoo's
      release describes approximately US$600 million of cumulative contracted
      EBITDA contribution to Ooredoo over the investment period, while other
      public estimates describe roughly US$13 billion of cumulative revenue and
      US$9 billion of EBITDA over five years; these are company or analyst
      estimates, not audited Zankore statements, and their differing scope and
      denominators prevent direct reconciliation. The initial build therefore
      appears capital-intensive and financing-dependent, with demand ramp and
      collateral value as the principal downside variables. Underwriting should
      require executed offtake contracts, customer concentration, pricing and
      utilization schedules, debt documentation, draw conditions, covenant
      headroom, power and cooling costs, capex invoices, and monthly cash-flow
      forecasts. Until those materials are supplied, the appropriate stance is
      conditional interest rather than a quantified valuation.
    claimRefs: [CI014, CI015, CI016]
    callouts:
      - calloutType: risk
        title: Debt-service risk is the gating financial question
        body: The maximum disclosed debt facility is large relative to the stated sponsor commitment, while customer contracts, utilization, pricing, and debt terms are not public.
        claimRefs: [CI006, CI007, CI008]
      - calloutType: recommendation
        title: Require an auditable operating model before underwriting
        body: Request customer-level revenue commitments, GPU utilization, realized pricing, power costs, debt documents, and a cash-flow forecast before assigning value to the capacity targets.
        claimRefs: [CI003, CI009]
