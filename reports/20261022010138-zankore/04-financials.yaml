      - [Customer concentration, "Customer identities unavailable", null, low, "Cannot assess counterparty or renewal risk"]
      - [Discounts and credits, "Unavailable", null, low, "Cannot distinguish list economics from realized economics"]
    notes: "No assigned source publishes Zankore list pricing, realized pricing, utilization, or contract terms. Nulls are evidence gaps, not zero values."
    claimRefs: [CI003, CI004]
  - id: TI003
    title: Unit economics and capital requirements
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Development capex per MW, "US$20m-US$25m/MW", medium, "Drives capital required for the initial build", "Invoices, scope, contingency, and commissioning schedule"]
      - [Annual revenue per MW, "US$10m-US$13m/MW estimate", medium, "Links capacity to revenue under an assumed utilization/pricing case", "Signed offtake and price-volume schedule"]
      - [EBITDA margin, "69% estimate", low, "Determines debt-service capacity and equity returns", "Actual cost stack and margin bridge"]
      - [Project IRR, "12%-13% estimate", low, "Summarizes scenario returns but is assumption-sensitive", "Model with sensitivities and financing terms"]
      - [Equity payback, "<3 years estimate", low, "Tests capital recovery speed", "Cash waterfall and debt amortization"]
      - [Cash on hand, null, low, "Required to assess liquidity and runway", "Latest balance sheet and restricted cash"]
      - [Operating burn, null, low, "Required to assess funding dependency", "Monthly cash-flow statements"]
      - [Debt-service coverage, null, low, "Required to test the US$3.1bn facility", "Debt schedule, covenants, and lender model"]
    notes: "Values marked estimate are analyst assumptions or sponsor estimates, not reported Zankore results. Nulls are material private-evidence gaps."
    claimRefs: [CI005, CI006, CI009, CI010, CI011, CI012, CI013, CI016]
