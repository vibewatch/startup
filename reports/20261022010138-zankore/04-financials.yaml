callouts:
  - calloutType: insight
    title: Capacity is not traction
    body: The public record supports a financed capacity buildout and sponsor estimates, but not realized revenue, utilization, or customer-level economics.
    claimRefs: [CI001, CI003, CI004]
  - calloutType: assumption
    title: Scenario economics require private verification
    body: The published 69% margin, 12-13% IRR, and less-than-three-year payback are estimates whose validity depends on undisclosed pricing, utilization, power, depreciation, and debt assumptions.
    claimRefs: [CI010, CI011, CI012, CI013]
