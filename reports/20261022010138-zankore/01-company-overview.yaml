      severity: material
      topic: governance
      missingEvidence: >-
        Legal headquarters, incorporation records, founder identities, operating CEO, complete
        management team, board roster, shareholder rights, and leadership-change history.
      whyItMatters: >-
        Governance rights and operating accountability cannot be assessed from sponsor
        announcements and named spokespeople alone.
      diligencePath: >-
        Obtain the constitutional documents, shareholder agreement, board minutes, organization
        chart, delegated-authority matrix, and executive employment records.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: material
      topic: operating-metrics
      missingEvidence: >-
        Zankore revenue or run-rate, customer count and concentration, headcount, utilization,
        commissioned megawatts, pricing, and deployed location count.
      whyItMatters: >-
        Announced financing and capacity targets do not demonstrate commercial traction or
        current operating scale.
      diligencePath: >-
        Reconcile audited accounts, signed customer contracts, billing data, payroll, site
        acceptance certificates, and GPU-cluster telemetry.
      relatedQuestionRefs: [QO002, QO007]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Enterprise valuation, complete cap table, debt draw status, interest cost, maturity,
        amortization, covenant headroom, collateral coverage, and cash available.
      whyItMatters: >-
        The disclosed commitment and facility limit cannot be converted into valuation,
        liquidity, or runway without transaction documents and balances.
      diligencePath: >-
        Review executed equity and loan documents, bank statements, borrowing-base reports,
        covenant certificates, and the post-money capitalization table.
      relatedQuestionRefs: [QO005, QO006, QO007]
      relatedTableRefs: [TO001, TO003]
