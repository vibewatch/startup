company:
  name: Zankore
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Zankore is a newly launched Indonesia-focused AI neocloud backed by Ooredoo Group,
    Indosat Ooredoo Hutchison, NVIDIA, and Nokia. Its disclosed capital base is unusually
    leveraged for such a young platform: Ooredoo committed approximately US$800 million
    for 49%, while five banks arranged a senior term loan facility of up to US$3.1 billion;
    valuation, revenue, customer count, headcount, and a complete governance roster remain
    undisclosed in the retained evidence.
sections:
  - id: identity-and-stage
    title: Identity, launch, and operating model
    body: >-
      Zankore was launched in August 2026 as an Indonesian AI cloud and neocloud platform
      developed by Indosat Ooredoo Hutchison, Ooredoo Group, NVIDIA, and Nokia. The retained
      evidence supports Indonesia as the initial deployment market, but it does not identify
      a legal headquarters or fully describe the incorporated entity. The operating model is
      infrastructure-as-a-service: Zankore intends to provide on-demand NVIDIA GPU clusters
      for training, fine-tuning, inference, and agentic workloads to enterprises, developers,
      startups, and institutions. Its disclosed status is therefore early buildout rather
      than mature operation: an initial 100 MW deployment is being financed, approximately
      200 MW is targeted for the first half of 2027, and 1 GW remains a longer-term target.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: ownership-leadership-governance
    title: Ownership, leadership, and governance visibility
    body: >-
      Ooredoo Group is the founding shareholder and lead investor, with a disclosed 49% stake
      and an approximately US$800 million commitment for launch and initial development.
      Indosat contributes local infrastructure and execution, NVIDIA supplies the accelerated
      computing architecture and GPUs, and Nokia supplies AI-native networking. Public
      leadership visibility is much thinner than sponsor visibility. Vikram Sinha is identified
      as Zankore's director and chairman, while Aziz Aluthman Fakhroo speaks for the lead
      investor as Ooredoo Group CEO. The retained sources do not name a Zankore operating CEO,
      founders as individuals, a complete board, independent directors, or leadership changes.
      This leaves decision rights, sponsor reserved matters, and key-person dependence open
      for primary-document diligence.
    claimRefs: [CO002, CO007, CO014, CO015]
    tableRefs: [TO002, TO003]
  - id: capital-and-milestones
    title: Capital structure and milestones
    body: >-
      Zankore's largest disclosed financing is debt, not revenue, ARR, equity raised, or cash
      available. A five-bank consortium arranged a senior term loan facility of up to US$3.1
      billion to acquire and deploy NVIDIA GPU infrastructure. Reporting also describes
      revenue-sharing and credit-support arrangements intended to pace deployment with demand.
      Natixis further disclosed that its tranche is secured by GPU equipment, material
      contracts, and take-or-pay offtake agreements with paying customers. Those protections
      indicate some contracted demand, but no retained source discloses customer names, count,
      utilization, pricing, draw status, maturity, interest cost, or covenant headroom. The
      financing headline therefore establishes available debt capacity, not enterprise value
      or proven operating scale.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    figureRefs: [FO001]
  - id: diligence-interpretation
    title: Diligence interpretation and unresolved cover metrics
    body: >-
      The sponsor set brings telecom infrastructure, capital, networking, and GPU supply, but
      the platform's short operating history makes execution evidence more important than
      announced capacity. Ooredoo estimates approximately US$600 million of cumulative EBITDA
      contribution to itself over the investment's first five years; that is a sponsor forecast,
      not Zankore revenue or current EBITDA. An adverse analysis characterizes the disclosed
      debt as roughly four times founding equity and argues that utilization and rapidly
      repricing GPU collateral are the central risks. The retained pool cannot establish
      valuation, revenue or run-rate, customer count, headcount, deployed location count, or
      current utilization. Investment judgment should remain conditional on the cap table,
      loan documents, contracted backlog, deployment acceptance records, and independently
      reconciled operating metrics.
    claimRefs: [CO008, CO016, CO004, CO005, CO006, CO009, CO013]
