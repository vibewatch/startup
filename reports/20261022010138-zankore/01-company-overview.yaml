      severity: minor
      topic: milestones
      missingEvidence: >-
        Eight distinct dated corporate milestones are not publicly supportable from the assigned
        pool because the company launched only in August 2026 and disclosures cluster around
        launch and financing.
      whyItMatters: >-
        The short record limits assessment of delivery cadence, regulatory progress,
        partnerships, and adverse events across a full operating cycle.
      diligencePath: >-
        Obtain the corporate milestone register, permits, procurement dates, customer
        acceptance records, partnership agreements, and incident log.
      relatedQuestionRefs: [QO008, QO009]
