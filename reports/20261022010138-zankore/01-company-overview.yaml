callouts:
  - calloutType: strength
    title: Sponsor and lender depth
    body: >-
      Zankore combines a telecom operator, a lead financial sponsor, a GPU platform supplier,
      a networking vendor, and five international lenders around an initial Indonesian deployment.
    claimRefs: [CO002, CO007, CO010]
  - calloutType: risk
    title: Financing scale exceeds operating proof
    body: >-
      The US$3.1 billion headline is a senior debt facility for a newly launched platform, while
      utilization, revenue, valuation, and customer concentration remain undisclosed.
    claimRefs: [CO001, CO009, CO016]
