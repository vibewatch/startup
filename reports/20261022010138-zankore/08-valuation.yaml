    title: Recommendation logic
    type: flow
    summary: >-
      Visible sponsor and lender capacity leads to a conditional track decision because commercial
      proof, debt protections, and a supportable entry valuation remain missing.
    data:
      nodes:
        - id: sponsor-capital
          label: "Sponsor capital"
          detail: "Approximately US$800 million committed for a 49% stake."
        - id: debt-capacity
          label: "Debt capacity"
          detail: "Senior term facility of up to US$3.1 billion from five banks."
        - id: scale-plan
          label: "Scale plan"
          detail: "100 MW initial build, about 200 MW in H1 2027, and 1 GW ambition."
        - id: proof-gap
          label: "Commercial proof gap"
          detail: "No named anchor customer or disclosed contracted revenue schedule."
        - id: downside-gap
          label: "Downside protection gap"
          detail: "Loan collateral, covenants, recourse, and preference terms are undisclosed."
        - id: decision
          label: "Research more / track"
          detail: "Price only after contracted demand, unit economics, and recovery protections are verified."
    approximationNotes: >-
      The sequence is analytical rather than chronological and does not quantify conversion,
      probability, enterprise value, or investment return.
    claimRefs: [CV002, CV004, CV011, CV012, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Strategic sponsorship and financing are necessary but not sufficient: the recommendation can
      move toward invest only after a supportable entry price, senior-claim waterfall, contracted
      utilization, and fully burdened unit economics are verified.
    claimRefs: [CV001, CV003, CV008, CV009, CV014, CV016]
  - calloutType: risk
    title: Thesis-break condition
    body: >-
      Treat a capacity delay, covenant waiver, weak contracted utilization, or GPU collateral value
      falling faster than loan amortization as a trigger to suspend the investment thesis.
    claimRefs: [CV007, CV009, CV010, CV015]
