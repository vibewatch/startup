  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence today, What would change the view]
    rows:
      - [Thesis, "Strategic sponsors can supply capital and execution support.", "Ooredoo committed about US$800 million for 49%.", "Weak sponsor follow-through or a materially dilutive recapitalization."]
      - [Thesis, "Bank financing can accelerate a regionally scaled AI-compute build.", "Five banks arranged or underwrote up to US$3.1 billion.", "Facility draw conditions or covenants materially constrain deployment."]
      - [Thesis, "Capacity can create operating leverage if demand is contracted.", "The stated path is 100 MW initially, about 200 MW in H1 2027, and 1 GW within three years.", "Signed demand fails to keep pace with commissioned capacity."]
      - [Anti-thesis, "Capital formation is ahead of operating proof.", "Financing followed roughly four weeks after launch.", "Audited utilization, retention, and cash-margin cohorts become available."]
      - [Anti-thesis, "GPU residual value and customer demand are linked downside risks.", "Credit support and deployment are tied to demand, while collateral details remain unclear.", "Long-term take-or-pay contracts and conservative collateral haircuts are documented."]
    notes: >-
      Sponsor forecasts and capacity targets are not audited results; changes in view require primary
      transaction documents and operating evidence rather than additional announcements.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Binding diversified offtake; 2027 capacity delivered on time; high utilization; power optimization converts to saleable compute.", "Value on contracted post-financing EBITDA with a premium only after repeatable cash yields are demonstrated.", "Execution, concentration, technology refresh, and leverage.", "Signed contracts, audited margins, and covenant headroom."]
      - [Base, "Phased delivery; utilization ramps behind capacity; sponsor support remains available.", "Use conservative infrastructure multiples and fully burden GPU refresh, interest, and dilution.", "Lower returns from idle capacity and financing cost.", "Quarterly utilization cohorts and debt-service coverage above downside thresholds."]
      - [Bear, "Offtake disappoints; GPU values compress; buildout slips; covenant or refinancing pressure emerges.", "Anchor on recovery value after senior claims, not announced funding or replacement cost.", "Impairment, recapitalization, lender control, and equity dilution.", "Customer cancellations, deployment delay, covenant waiver, or falling secondary GPU prices."]
    notes: >-
      These are qualitative scenarios, not probability-weighted valuation ranges; revenue, cash flow,
      debt economics, cap-table terms, and defensible comparable transactions were not disclosed.
    claimRefs: [CV005, CV007, CV009, CV010, CV012, CV013, CV014, CV015]
