artifact: valuation
slug: zankore
runDate: 2026-10-22
company:
  name: Zankore
chapter:
  number: 8
  title: Valuation
  summary: >-
    Zankore has assembled a large financing stack for a newly launched AI-compute platform, but
    public evidence does not disclose a current equity valuation, debt economics, binding customer
    commitments, or comparable exit benchmarks. The investment stance is therefore research-more
    and track, with any entry contingent on price, contracted demand, and downside protections.
sections:
  - id: investment-call
    title: Investment call and price discipline
    body: >-
      The recommended stance is research-more and track rather than buy. Ooredoo's approximately
      US$800 million commitment for a 49% stake and the up-to-US$3.1 billion senior term facility
      demonstrate sponsor and lender capacity, while the planned 100 MW-to-200 MW-to-1 GW expansion
      offers material operating leverage if utilization develops as planned. Those strengths do not
      establish an investable price. The public record does not disclose a current equity valuation,
      loan pricing, maturity, covenants, collateral package, preference stack, or a named anchor
      customer. Entry discipline should therefore be expressed as conditions rather than a point
      valuation: require a fully diluted capitalization table, financing waterfall, contracted
      revenue schedule, unit economics, and downside recovery analysis before underwriting a return.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV014, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-financing
    title: Thesis, anti-thesis, and financing context
    body: >-
      The thesis rests on unusually strong strategic sponsorship, bank participation, and a regional
      capacity plan positioned against company-cited growth in Southeast Asian data-center demand.
      Ooredoo also estimates approximately US$600 million of cumulative EBITDA contribution over
      the first five years, but that is a sponsor forecast rather than audited Zankore performance.
      The anti-thesis is that lenders have committed substantial capital after only about four weeks
      of operating history, with deployment linked to customer demand and credit support whose terms
      remain undisclosed. NVIDIA is both a backer and the hardware supplier, so part of ecosystem
      demand is financed through a vehicle buying NVIDIA equipment. This alignment can accelerate
      deployment, but it also concentrates technology, residual-value, and utilization risk.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV010, CV011, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable limitations
    body: >-
      A model-appropriate valuation should link enterprise value to contracted gross profit or
      EBITDA after power, hosting, hardware financing, and refresh costs, rather than apply a generic
      software revenue multiple. The bull case requires contracted demand, on-time 2027 delivery,
      high utilization, and evidence that power optimization improves saleable compute economics.
      The base case assumes phased deployment and delayed utilization, making value highly sensitive
      to financing cost and customer ramp. The bear case combines weak offtake, GPU obsolescence,
      covenant pressure, and lower collateral recovery. No defensible valuation range or probability
      weighting can be published from the reviewed evidence because current valuation, forecast
      cash flows, comparable transactions, and debt terms are absent.
    claimRefs: [CV005, CV007, CV009, CV010, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is early: Zankore launched in August 2026, and the public record is dominated by
      sponsor announcements and financing coverage rather than operating results. A strategic exit
      could become plausible if the platform converts planned capacity into diversified,
      creditworthy contracts and proves cash yields after GPU refresh obligations; an infrastructure
      or public-market route would additionally require audited segment reporting and durable
      leverage metrics. Before investment, obtain signed offtake schedules, customer concentration,
      utilization and pricing cohorts, project-level cash flows, debt and security documents, GPU
      refresh commitments, cap-table rights, and downside recovery cases. Thesis-break triggers are
      material slippage in the 2027 capacity plan, utilization below debt-service needs, customer
      concentration without guarantees, covenant stress, or evidence that equipment values are
      falling faster than principal amortizes.
    claimRefs: [CV006, CV007, CV009, CV010, CV013, CV014, CV016]
