      - [2, "Facility, power, construction, and environmental approvals", Indonesia, "No permit register in assigned evidence", "Unquantified", "Thesis-critical if approvals delay commissioning", "Indosat execution role described; permit controls not disclosed", "Unknown", "Obtain site-by-site permit matrix, power commitments, environmental approvals, and commissioning certificates"]
      - [3, "Privacy, data residency, and security obligations", "Indonesia and intended Southeast Asian markets", "Compliance package not established in assigned evidence", "Unquantified", "High if noncompliance blocks regulated workloads", "No certification or control package in assigned evidence", "Unknown", "Obtain counsel analysis, data-flow maps, security certifications, incident log, and customer DPA terms"]
      - [4, "Litigation, enforcement, sanctions, and export-control exposure", "Relevant operating and supplier jurisdictions", "No case or enforcement record established; absence is not proof of absence", "Unquantified", "Material if supply or operations are restricted", "No public mitigation identified", "Unknown", "Run jurisdictional court, regulator, sanctions, and export-control searches through counsel"]
    notes: "Partial public-evidence register as of 2026-10-22; likelihood is not scored where the assigned evidence does not establish an incident, permit status, or legal outcome."
    enumerationScope:
      coverage: partial
      basis: "Publicly disclosed financing, partner, and infrastructure risks reviewed for the 2026-10-22 report date"
    claimRefs: [CR001, CR003, CR010, CR012, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Power, cooling, or commissioning delay", "Unquantified", "Thesis-critical if the first 2027 phase slips materially", "Named partners and integrated architecture announced; operating proof unavailable", "Diligence gate", "Site power, cooling, permits, acceptance tests, and commissioned-MW evidence"]
      - [GPU procurement or technology transition, "Unquantified", "High if availability, pricing, or obsolescence impairs economics", "NVIDIA technology and financing disclosed; diversification not established", "Material and unquantified", "Purchase orders, delivery schedule, warranties, upgrade rights, and residual-value stress test"]
      - [Underutilized fleet, "Unquantified", "Thesis-critical because revenue must support debt-funded deployment", "Revenue-sharing and credit support announced; contract detail unavailable", "Diligence gate", "Binding customer pipeline, contracted MW, pricing, credit quality, and monthly utilization"]
      - [Reliability or security failure, "Unquantified", "High if service interruption or control weakness blocks production workloads", "No public SLA, certification, or incident record in assigned evidence", "Unknown", "SOC reports, incident history, uptime SLA, insurance, and response plan"]
    notes: "Impact labels are conditional investment consequences, not incident probabilities; public evidence does not support numeric or categorical likelihood estimates."
    claimRefs: [CR004, CR006, CR007, CR008, CR009, CR010, CR012, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Failure scenario, Severity, Mitigation and residual exposure]
    rows:
      - [Capital and governance, Ooredoo Group, "49% lead investor and approximately US$800m commitment", "Commitment timing or governance support differs from the build plan", "Thesis-critical if funding or control rights interrupt deployment", "Review paid-in schedule and reserved matters; residual exposure remains unknown"]
      - [Indonesian execution, Indosat Ooredoo Hutchison, "Local infrastructure, market access, and execution", "Sites, power, permits, or customer access slip", "Thesis-critical if the initial deployment cannot commission", "Use contractual stage gates, service levels, and contingency operators; terms are not public"]
      - [GPU and AI stack, NVIDIA, "GB300, DSX, DSX MaxLPS, hardware supply, and ecosystem", "Supply, pricing, or technology transition undermines economics", "High because the financed asset and core stack share one vendor", "Test warranties, upgrade rights, multi-vintage procurement, and resale assumptions"]
      - [AI-native networking, Nokia, "Networking layer for the platform", "Network integration or support delay", "High if production readiness slips", "Require acceptance tests, support SLAs, and interoperable fallback design"]
    notes: "Partner roles are based on disclosed launch materials; concentration, exclusivity, and fallback rights require contract review."
    claimRefs: [CR006, CR011, CR012, CR013]
