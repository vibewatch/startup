company:
  name: Zankore
chapter:
  number: 7
  title: Risks
  summary: Zankore's principal risk is execution under substantial infrastructure financing, with demand, GPU economics, power delivery, and multi-party governance all needing to mature before the planned capacity can support the debt structure. Public evidence is strongest on the announced build and financing; customer contracts, collateral terms, operating performance, and formal regulatory posture remain material diligence gaps.
sections:
  - id: leverage-and-demand
    title: Leverage, demand, and hardware economics
    body: >-
      Zankore is attempting a capital-intensive build before it has a demonstrated operating
      history. The announced senior term loan is up to US$3.1 billion, while Ooredoo's
      contemporaneous release describes an approximately US$800 million commitment for a 49%
      founding stake. The sources do not disclose Zankore's cash-flow profile, customer
      contract coverage, interest rate, covenants, amortization, or collateral package. The
      financing therefore creates a timing risk: the platform must bring capacity online and
      convert it into contracted, paying utilization while GPU values and rental prices can
      change. The Next Web report specifically notes that the loan's collateral remains
      unclear and that GPU collateral could lose value if demand disappoints. The practical
      monitoring test is signed, creditworthy offtake and realized utilization against debt
      service, not the headline gigawatt target. The public comparison between the maximum
      facility and Ooredoo's commitment is a warning signal, not a verified debt-to-equity
      ratio, because total paid-in equity and cash available to Zankore are not disclosed.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR014, CR015]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: execution-and-infrastructure
    title: Build, power, and operational execution
    body: >-
      The rollout depends on delivering a technically integrated infrastructure program across
      Indonesia and later Southeast Asia. Public materials describe an initial 100 MW build,
      approximately 200 MW targeted in the first half of 2027, and an eventual 1 GW ambition,
      but these are plans rather than evidence of commissioned capacity. The stack also depends
      on NVIDIA GB300 NVL72 systems, NVIDIA DSX and DSX MaxLPS, network integration from Nokia,
      and local execution by Indosat Ooredoo Hutchison. That combination creates schedule,
      power, cooling, supply, commissioning, reliability, and service-quality dependencies.
      A missed phase could leave debt-funded equipment underutilized while financing exposure
      remains. The announced revenue-sharing and credit-support model is directionally aligned
      with demand, but its contracts and operating effect are not public. A prudent mitigation
      is stage-gated deployment tied to power-ready sites, acceptance testing, uptime and
      utilization thresholds, with an explicit pause trigger before the next capacity tranche.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR016]
    tableRefs: [TR002]
  - id: governance-and-open-diligence
    title: Partner, regulatory, and governance exposure
    body: >-
      Zankore's partner model is a strength and a concentration risk at the same time. Ooredoo
      is described as lead investor with a 49% stake, Indosat contributes Indonesian market
      and infrastructure capabilities, NVIDIA supplies the accelerated-computing stack, and
      Nokia supplies networking. This creates dependency on counterparties that also have
      commercial interests in the build, while the public record reviewed here does not
      establish board controls, related-party protections, customer concentration, permits,
      data-governance approvals, incident history, or insurance. The reviewed adverse material
      raises questions about demand timing, GPU collateral, and the circularity of vendor
      financing, but it does not establish a default or misconduct. Accordingly, regulatory
      and legal risk should remain an evidence gap rather than an invented incident: diligence
      should obtain permits, financing documents, security and privacy controls, litigation
      searches, and a full dependency register before treating the risk as low.
    claimRefs: [CR004, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Treat the thesis as impaired if Zankore cannot evidence binding customer commitments and
      commissioned capacity sufficient to support each debt-funded deployment stage, or if GPU
      collateral and debt covenants leave no workable downside case after a material utilization
      or hardware-price shock.
    claimRefs: [CR004, CR005, CR010, CR016]
  - calloutType: assumption
    title: Evidence boundary
    body: >-
      Public sources reviewed here describe announced plans and financing, not audited Zankore
      results, executed customer contracts, loan covenants, permits, or an absence of incidents.
      Those items remain explicit diligence requirements.
    claimRefs: [CR003, CR012, CR014]
