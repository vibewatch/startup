              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.2'
        title: Capital structure and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The disclosed capital stack is unusually debt-heavy for a greenfield neocloud. Ooredoo says it will commit
              approximately US$800 million for a 49% founding stake, while later coverage reports a senior term loan
              facility of up to US$3.1 billion arranged by five banks to fund the GPU buildout. Those figures are not
              equivalent to cash available: the equity commitment is spread over the investment period, and the loan is
              a facility whose draw, covenants, collateral terms, pricing, amortization, and conditions precedent are
              not public in the assigned evidence. The resulting headline ratio is roughly US$3.1 billion of maximum
              debt facility to US$800 million of stated sponsor commitment, but that is not a verified leverage ratio
              for drawn debt or total capitalization. An adverse analysis characterizes the facility as collateralized
              GPU lending and highlights utilization, depreciation, and hardware repricing as the central risks. No cash
              balance, burn, runway, refinancing plan, or debt-service coverage is disclosed.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Margin path and unit-economics evidence
        blocks:
          - type: paragraph
            body: >-
              Public unit economics are not sufficient for a conventional SaaS or marketplace underwriting model. An
              equity-research estimate assumes development capex of US$20-25 million per MW, annual revenue of US$10-13
              million per MW, and a 69% EBITDA margin, but these are analyst assumptions based on management disclosure
              and peer ranges, not reported Zankore results. The same analysis estimates project IRR at 12-13% and
              equity payback at less than three years; these outputs should be treated as estimates contingent on
              utilization, pricing, power cost, GPU life, and financing terms. The company and parent materials instead
              disclose cumulative revenue/EBITDA or attributable EBITDA estimates without a customer-level bridge. There
              is no public realized price, GPU utilization, gross margin, power cost, maintenance cost, depreciation
              schedule, CAC, payback, or contribution margin. The key financial conclusion is therefore that margin
              potential is scenario-based and the evidence needed to test it is private.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Zankore has a credible sponsor and infrastructure-partner base, but the financial case is not yet
              auditable from public information. Ooredoo's release describes approximately US$600 million of cumulative
              contracted EBITDA contribution to Ooredoo over the investment period, while other public estimates
              describe roughly US$13 billion of cumulative revenue and US$9 billion of EBITDA over five years; these are
              company or analyst estimates, not audited Zankore statements, and their differing scope and denominators
              prevent direct reconciliation. The initial build therefore appears capital-intensive and
              financing-dependent, with demand ramp and collateral value as the principal downside variables.
              Underwriting should require executed offtake contracts, customer concentration, pricing and utilization
              schedules, debt documentation, draw conditions, covenant headroom, power and cooling costs, capex
              invoices, and monthly cash-flow forecasts. Until those materials are supplied, the appropriate stance is
              conditional interest rather than a quantified valuation.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity is not traction
            body: >-
              The public record supports a financed capacity buildout and sponsor estimates, but not realized revenue,
              utilization, or customer-level economics.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: Scenario economics require private verification
            body: >-
              The published 69% margin, 12-13% IRR, and less-than-three-year payback are estimates whose validity
              depends on undisclosed pricing, utilization, power, depreciation, and debt assumptions.
            calloutType: assumption
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Zankore's product is GPU cloud capacity rather than a general-purpose application. The available
              descriptions identify training, fine-tuning, inference, and agentic workloads as intended uses, with
              customers ranging from AI-native companies and developers to enterprises, institutions, hyperscalers, and
              governments. The customer workflow is therefore to obtain dedicated or on-demand NVIDIA compute, run
              models close to regional data and users, and consume an integrated infrastructure service rather than
              assemble every layer independently. This is a coherent product definition, but it remains a launch and
              deployment plan: the public evidence does not disclose live tenants, service-level objectives,
              utilization, pricing, or measured workload outcomes. The commercial proposition should consequently be
              read as intended capacity and target segments, not verified adoption.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
