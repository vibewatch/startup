  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Zankore's relevant market is regional GPU-as-a-Service and integrated AI infrastructure for Southeast
              Asian cloud, enterprise, and government workloads, initially deployed in Indonesia. The included spend is
              dedicated accelerated compute capacity, associated AI software and networking, and the power, cooling, and
              operating services needed to deliver that capacity. It is not the whole telecom market, all conventional
              data-centre colocation, or the full value of NVIDIA chip sales. Public descriptions place Zankore between
              a hyperscaler-like compute service and a carrier-managed infrastructure bundle: the platform is intended
              to sell GPU capacity for training, fine-tuning, inference, and agentic workloads, while combining telecom
              infrastructure with accelerated computing, networking, power, cooling, and operations (SM007; SM006). The
              practical status quo is a buyer assembling those layers from hyperscalers, independent neoclouds,
              data-centre operators, or an internal deployment. Zankore's proposed alternative is a regional provider
              that can bundle network and compute, which may simplify procurement but increases concentration and
              portability questions.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing lens is physical capacity rather than revenue. Ooredoo's announcement targets
              1 GW of NVIDIA DSX AI Factory capacity across Southeast Asia, with approximately 200 MW expected in the
              first half of 2027 (SM005). Independent reports describe a staged plan beginning with a 100 MW Indonesian
              buildout and reaching approximately 200 MW in the first half of 2027, so these values are different
              deployment horizons rather than conflicting estimates (SM003; SM007). Ooredoo also cites industry analysis
              that Southeast Asian data-centre capacity demand could grow approximately 3.5x by 2030, but that is a
              regional demand indicator, not Zankore revenue or a serviceable market calculation (SM005). The capital
              lens is similarly not a revenue proxy: Ooredoo says it will commit approximately $800 million for a 49%
              stake, while independent reporting describes a senior term loan facility of up to $3.1 billion (SM005;
              SM003; SM007). These figures establish ambition and financing intensity, not customer demand, utilization,
              price, or cash returns. A quantitative SAM/SOM cannot therefore be isolated from the retained evidence
              without inventing utilization, GPU-hour pricing, contract coverage, or geographic allocation.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
              - CM016
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The disclosed buyer set has three primary segments. Cloud customers and AI developers need flexible GPU
              capacity for training, fine-tuning, inference, and agentic workloads; enterprises need a path from AI
              experimentation to mission-critical deployment; and governments need sovereign or regionally controlled
              infrastructure (SM007; SM006). In these segments, the economic buyer is mapped, rather than disclosed, as
              a cloud or technology organization, an enterprise infrastructure or AI budget owner, or a public-sector
              digital authority; the reviewed sources do not identify actual budget owners. The adoption case is
              strengthened by integrated power, cooling, networking, and compute, and by the company claim that DSX
              MaxLPS can enable up to 40% more compute within the same power budget (SM005; SM006). The main constraints
              are pre-commercial buildout, demand conversion, debt service, and vendor concentration. Reporting says the
              loan includes revenue-sharing and credit-support arrangements designed to link deployment pace to customer
              demand (SM007), while the first approximately 200 MW is not expected until the first half of 2027 (SM001;
              SM005). Buyers should therefore require workload portability, compute-specific service levels, pricing and
              capacity commitments, and evidence of contracted utilization before treating the capacity target as
              realized market penetration.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity ambition is not market capture
            body: >-
              Zankore has public capacity, capital, and partner disclosures, but the retained evidence does not disclose
              customer names, contracted GPU volumes, prices, utilization, or realized revenue. The investment case
              should treat 1 GW as a buildout target and 200 MW as a planned first phase, not as evidence of SAM, SOM,
              or demand conversion.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM016
          - type: callout
            title: Financing raises the utilization hurdle
            body: >-
              The combination of a reported $3.1 billion senior term loan, a roughly $800 million founding commitment,
              and fast-moving GPU collateral makes anchor-customer conversion and utilization central market risks
              rather than secondary operating details.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Zankore is positioned as an AI neocloud rather than a general-purpose colocation operator. Ooredoo's
              release describes a target of 1 GW of NVIDIA DSX AI Factory capacity, while the initial deployment is
              described as approximately 200 MW in the first half of 2027; The Next Web separately reports a 100 MW
              starting build. Those figures indicate staged deployment, not one settled operating capacity. The public
              partner set combines Ooredoo's capital and regional reach, Indosat's Indonesian market and infrastructure
              position, Nokia networking, and NVIDIA hardware and software. The resulting proposition is a locally
              hosted, high-density compute platform for enterprises, developers, hyperscalers, governments, and AI
              companies. That is differentiated from ordinary cloud only if Zankore can translate local sovereignty,
              latency, and regulated-workload access into contracted demand. The current sources identify intended
              customer groups, but do not name anchor customers or disclose committed workload volumes.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP013
      - number: '3.2'
        title: Buyer criteria, capability, and pricing
        blocks:
          - type: paragraph
            body: >-
              Buyers comparing Zankore with hyperscalers, incumbent Indonesian data centers, or another neocloud will
              care about usable GPU-hours, latency, data location, reliability, networking, support, security, and price
              after discounts. Zankore's disclosed capability case is specific on hardware and architecture: GB300 NVL72
              systems, NVIDIA DSX, and DSX MaxLPS, with Ooredoo claiming that MaxLPS is designed to enable up to 40%
              more compute within the same power budget. That is a vendor-stated engineering proposition, not an
              independently measured customer outcome. Public materials do not provide a Zankore price card,
              utilization, service-level agreement, GPU-hour availability, or realized discount. The pricing comparison
              therefore separates observed list-price evidence from unknowns rather than inferring parity with global
              providers. A buyer may rationally pay for Indonesian location or sovereign handling, but that willingness
              remains an underwriting question until contracts or customer references are disclosed.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP013
      - number: '3.3'
        title: Switching costs, distribution, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Zankore's potential moat is infrastructural and relational, not a proprietary model moat demonstrated in
              the assigned evidence. Indosat contributes local execution and connectivity, Ooredoo supplies capital and
              regional scale, Nokia supplies AI-native networking, and NVIDIA supplies the accelerated-computing stack.
              This combination can shorten permitting, power, network, and deployment paths relative to a new entrant
              starting without a telecom partner. It can also create distribution into Indonesian enterprises and
              public-sector workloads. However, the same stack creates multi-homing and substitution risk: customers can
              compare Zankore with hyperscalers, existing regional facilities, and other NVIDIA-backed neoclouds. The
              Next Web reports that loan economics depend on customer demand and that GPU collateral could lose value as
              the market changes. That makes customer contracts, service reliability, and workload portability more
              important than headline capacity. No source establishes exclusivity, minimum-volume commitments, or a
              switching-cost schedule.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Displacement and competitive risks
        blocks:
          - type: paragraph
            body: >-
              The adverse case is that Zankore builds an expensive supply position before regional demand is proven. The
              Next Web notes that the company launched only about one month before securing up to $3.1 billion of senior
              debt and says the structure leaves lenders exposed if customers do not sign enough contracts. AInvest
              makes the sharper analytical argument that the debt is roughly four times the approximately $800 million
              founding equity and that GPU value is periodically repriced; because it is an opinionated analysis, the
              leverage framing should not be treated as audited balance-sheet data. Remio's analysis adds a separate
              displacement constraint: the 1 GW ambition depends on cooling, water, and energy choices that remain
              undisclosed, while phased expansion should be conditioned on measured performance and demand. Together
              these sources imply three diligence tests: named anchor demand, financing and collateral terms, and a
              credible resource plan. Until those are available, Zankore's partner advantage may improve access to
              infrastructure without proving a durable economic moat.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated local platform
            body: >-
              Zankore's strongest differentiator is the combination of Indonesian telecom execution, regional capital,
              NVIDIA compute, and Nokia networking rather than a separately evidenced proprietary model.
            calloutType: strength
            claimRefs:
              - CP003
              - CP009
          - type: callout
            title: Capacity can outrun demand
            body: >-
              The debt-funded buildout creates a material displacement risk if customer contracts, utilization, or GPU
              resale values do not support the planned capacity.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: callout
            title: Underwrite contracts before scale
            body: >-
              Before treating the 1 GW ambition as a moat, require named anchor customers, minimum-volume or
              revenue-support terms, realized price evidence, and disclosed collateral and cooling constraints.
            calloutType: recommendation
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Zankore's disclosed revenue mechanism is AI compute sold to cloud, enterprise, and government customers,
              with Indonesia as the first deployment market and Southeast Asia as the expansion footprint. The platform
              is described as a full-stack AI factory combining NVIDIA compute, Nokia networking, power, cooling, and
              operations; that architecture explains the intended service rather than proving a realized price or
              margin. Public materials identify a target of approximately 200MW in the first half of 2027 and a
              longer-term 1GW target, but they do not disclose live revenue, ARR, utilization, signed customer names,
              contract tenor, or realized price per GPU-hour. A third-party account says no anchor customers are named
              and the terms tied to deployment pace and customer demand are not disclosed. Accordingly, the current
              traction record supports capacity planning and sponsor intent, not underwriting of recurring revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
