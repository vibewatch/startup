      - - Base
        - Phased delivery; utilization ramps behind capacity; sponsor support remains available.
        - Use conservative infrastructure multiples and fully burden GPU refresh, interest, and dilution.
        - Lower returns from idle capacity and financing cost.
        - Quarterly utilization cohorts and debt-service coverage above downside thresholds.
