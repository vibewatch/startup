        title: Diligence interpretation and unresolved cover metrics
        blocks:
          - type: paragraph
            body: >-
              The sponsor set brings telecom infrastructure, capital, networking, and GPU supply, but the platform's
              short operating history makes execution evidence more important than announced capacity. Ooredoo estimates
              approximately US$600 million of cumulative EBITDA contribution to itself over the investment's first five
              years; that is a sponsor forecast, not Zankore revenue or current EBITDA. An adverse analysis
              characterizes the disclosed debt as roughly four times founding equity and argues that utilization and
              rapidly repricing GPU collateral are the central risks. The retained pool cannot establish valuation,
              revenue or run-rate, customer count, headcount, deployed location count, or current utilization.
              Investment judgment should remain conditional on the cap table, loan documents, contracted backlog,
