      - number: '1.3'
        title: Capital structure and milestones
        blocks:
          - type: paragraph
            body: >-
              Zankore's largest disclosed financing is debt, not revenue, ARR, equity raised, or cash available. A
              five-bank consortium arranged a senior term loan facility of up to US$3.1 billion to acquire and deploy
              NVIDIA GPU infrastructure. Reporting also describes revenue-sharing and credit-support arrangements
              intended to pace deployment with demand. Natixis further disclosed that its tranche is secured by GPU
              equipment, material contracts, and take-or-pay offtake agreements with paying customers. Those protections
              indicate some contracted demand, but no retained source discloses customer names, count, utilization,
              pricing, draw status, maturity, interest cost, or covenant headroom. The financing headline therefore
              establishes available debt capacity, not enterprise value or proven operating scale.
