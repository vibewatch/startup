      - number: '5.3'
        title: Maturity, dependencies, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Zankore's differentiation is primarily ecosystem and infrastructure integration: Ooredoo supplies capital
              and regional scale, Indosat supplies Indonesian infrastructure and execution, NVIDIA supplies GPUs,
              software, and the DSX playbook, and Nokia supplies networking. That combination can reduce integration
              burden for regional buyers and support sovereign or data-resident deployments. It also creates
              concentrated dependencies on NVIDIA hardware and software, telecom-site execution, power availability,
              cooling, network delivery, and partner governance. Public descriptions establish the partners and planned
              milestones, but not proprietary software, patent protection, independent benchmark results, completed
              certifications, or a production roadmap with acceptance criteria. The strongest current moat is therefore
              execution access and partner coordination, not yet independently demonstrated technical superiority.
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, reliability, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The launch materials emphasize secure, scalable, sovereign, and trusted AI infrastructure, and identify
              governance through a board and chief executive. Those statements describe intended positioning rather than
              evidence of controls. No assigned source provides an uptime history, incident record, penetration-test
              result, SOC or ISO certification, data-processing terms, model or tenant isolation design,
              disaster-recovery targets, cooling telemetry, or customer support metrics. A financing report also notes
              that the loan's collateral was not clear and that GPU resale value could depend on the same demand
              expected to repay the loan; that is a capital and asset-risk consideration for the operating platform, not
              proof of a product defect. Before underwriting product maturity, diligence should obtain deployment
              acceptance records, security attestations, capacity reservations, customer contracts, and evidence that
              the first capacity milestone is operational.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated regional infrastructure proposition
            body: >-
              The disclosed partner model combines local telecom execution, NVIDIA accelerated infrastructure, Nokia
              networking, and Ooredoo capital in a single regional platform.
            calloutType: strength
            claimRefs:
              - CE008
              - CE010
          - type: callout
            title: Planned scale is ahead of public operating proof
            body: >-
              Public evidence supports announced targets and partner roles, but not production uptime, customer
              utilization, realized economics, or completed control certification.
            calloutType: risk
            claimRefs:
              - CE004
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer universe and buying surface
        blocks:
          - type: paragraph
            body: >-
              Zankore's stated market spans enterprises, startups, developers, AI-native companies and institutions,
              initially in Indonesia and then across Southeast Asia. The intended workloads include model training,
              fine-tuning, inference and agentic AI, implying a mixed buying surface: infrastructure or technology
              leaders may procure capacity, technical teams use it, and regulated or institutional users may value local
              deployment. Independent descriptions also use broader "cloud and enterprise customers" language and an
              Asia-Pacific frame. These are target segments, not observed cohorts. The sources provide no segment-level
              customer count, pricing, revenue mix, sales channel attribution or evidence that any category is already
              using Zankore in production, so strategic value by segment remains unquantified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
      - number: '6.2'
        title: Adoption trajectory and named-customer proof
        blocks:
          - type: paragraph
            body: >-
              The observable trajectory is infrastructure-led. Reporting describes an initial 100 MW build, an official
              plan for approximately 200 MW in the first half of 2027, and a longer-term target of up to 1 GW. Zankore
              also describes revenue-sharing and credit-support arrangements intended to align the pace of deployment
              with demand. Those milestones may create capacity for customer adoption, but they do not establish active
              users, utilization, contracted backlog or realized revenue. Ooredoo's estimate of approximately US$600
              million in cumulative EBITDA contribution over the first five years is an investor projection, not a
              disclosed customer metric. Across the nine assigned sources, no customer is named and no production
              deployment or pilot is documented at contract level.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU014
              - CU015
      - number: '6.3'
        title: Durability, expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not yet support a retention or expansion thesis. None of the reviewed sources reports
              net or gross revenue retention, churn, renewals, contract length, cohort behavior, satisfaction,
              customer-level utilization, backlog, offtake or revenue concentration. The demand-linked financing
              structure makes those omissions material: TNW notes that inadequate contracting could leave lenders
              exposed to depreciating GPUs, while AInvest argues that anchor customers must arrive quickly enough to
              support the leveraged buildout. These are analytical warnings rather than evidence of actual customer
              loss. Diligence should therefore prioritize executed contracts, named references, utilization by cohort,
              renewal mechanics and top-customer exposure before interpreting planned megawatts as durable commercial
              traction.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity is not customer traction
            body: >-
              Planned megawatts and financing establish potential supply, while named deployments, active usage,
              retention and concentration remain unverified in the assigned evidence.
            calloutType: risk
            claimRefs:
              - CU008
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Leverage, demand, and hardware economics
        blocks:
          - type: paragraph
            body: >-
              Zankore is attempting a capital-intensive build before it has a demonstrated operating history. The
              announced senior term loan is up to US$3.1 billion, while Ooredoo's contemporaneous release describes an
              approximately US$800 million commitment for a 49% founding stake. The sources do not disclose Zankore's
              cash-flow profile, customer contract coverage, interest rate, covenants, amortization, or collateral
              package. The financing therefore creates a timing risk: the platform must bring capacity online and
              convert it into contracted, paying utilization while GPU values and rental prices can change. The Next Web
              report specifically notes that the loan's collateral remains unclear and that GPU collateral could lose
              value if demand disappoints. The practical monitoring test is signed, creditworthy offtake and realized
              utilization against debt service, not the headline gigawatt target. The public comparison between the
              maximum facility and Ooredoo's commitment is a warning signal, not a verified debt-to-equity ratio,
              because total paid-in equity and cash available to Zankore are not disclosed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Build, power, and operational execution
        blocks:
          - type: paragraph
            body: >-
              The rollout depends on delivering a technically integrated infrastructure program across Indonesia and
              later Southeast Asia. Public materials describe an initial 100 MW build, approximately 200 MW targeted in
              the first half of 2027, and an eventual 1 GW ambition, but these are plans rather than evidence of
              commissioned capacity. The stack also depends on NVIDIA GB300 NVL72 systems, NVIDIA DSX and DSX MaxLPS,
              network integration from Nokia, and local execution by Indosat Ooredoo Hutchison. That combination creates
              schedule, power, cooling, supply, commissioning, reliability, and service-quality dependencies. A missed
              phase could leave debt-funded equipment underutilized while financing exposure remains. The announced
              revenue-sharing and credit-support model is directionally aligned with demand, but its contracts and
              operating effect are not public. A prudent mitigation is stage-gated deployment tied to power-ready sites,
              acceptance testing, uptime and utilization thresholds, with an explicit pause trigger before the next
              capacity tranche.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR016
      - number: '7.3'
        title: Partner, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Zankore's partner model is a strength and a concentration risk at the same time. Ooredoo is described as
              lead investor with a 49% stake, Indosat contributes Indonesian market and infrastructure capabilities,
              NVIDIA supplies the accelerated-computing stack, and Nokia supplies networking. This creates dependency on
              counterparties that also have commercial interests in the build, while the public record reviewed here
              does not establish board controls, related-party protections, customer concentration, permits,
              data-governance approvals, incident history, or insurance. The reviewed adverse material raises questions
              about demand timing, GPU collateral, and the circularity of vendor financing, but it does not establish a
              default or misconduct. Accordingly, regulatory and legal risk should remain an evidence gap rather than an
              invented incident: diligence should obtain permits, financing documents, security and privacy controls,
              litigation searches, and a full dependency register before treating the risk as low.
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat the thesis as impaired if Zankore cannot evidence binding customer commitments and commissioned
              capacity sufficient to support each debt-funded deployment stage, or if GPU collateral and debt covenants
              leave no workable downside case after a material utilization or hardware-price shock.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR016
          - type: callout
            title: Evidence boundary
            body: >-
              Public sources reviewed here describe announced plans and financing, not audited Zankore results, executed
              customer contracts, loan covenants, permits, or an absence of incidents. Those items remain explicit
              diligence requirements.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is research-more and track rather than buy. Ooredoo's approximately US$800 million
              commitment for a 49% stake and the up-to-US$3.1 billion senior term facility demonstrate sponsor and
              lender capacity, while the planned 100 MW-to-200 MW-to-1 GW expansion offers material operating leverage
              if utilization develops as planned. Those strengths do not establish an investable price. The public
              record does not disclose a current equity valuation, loan pricing, maturity, covenants, collateral
              package, preference stack, or a named anchor customer. Entry discipline should therefore be expressed as
              conditions rather than a point valuation: require a fully diluted capitalization table, financing
              waterfall, contracted revenue schedule, unit economics, and downside recovery analysis before underwriting
              a return.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on unusually strong strategic sponsorship, bank participation, and a regional capacity
              plan positioned against company-cited growth in Southeast Asian data-center demand. Ooredoo also estimates
              approximately US$600 million of cumulative EBITDA contribution over the first five years, but that is a
              sponsor forecast rather than audited Zankore performance. The anti-thesis is that lenders have committed
              substantial capital after only about four weeks of operating history, with deployment linked to customer
              demand and credit support whose terms remain undisclosed. NVIDIA is both a backer and the hardware
              supplier, so part of ecosystem demand is financed through a vehicle buying NVIDIA equipment. This
              alignment can accelerate deployment, but it also concentrates technology, residual-value, and utilization
              risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario framework and comparable limitations
        blocks:
          - type: paragraph
            body: >-
              A model-appropriate valuation should link enterprise value to contracted gross profit or EBITDA after
              power, hosting, hardware financing, and refresh costs, rather than apply a generic software revenue
              multiple. The bull case requires contracted demand, on-time 2027 delivery, high utilization, and evidence
              that power optimization improves saleable compute economics. The base case assumes phased deployment and
              delayed utilization, making value highly sensitive to financing cost and customer ramp. The bear case
              combines weak offtake, GPU obsolescence, covenant pressure, and lower collateral recovery. No defensible
              valuation range or probability weighting can be published from the reviewed evidence because current
              valuation, forecast cash flows, comparable transactions, and debt terms are absent.
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is early: Zankore launched in August 2026, and the public record is dominated by sponsor
              announcements and financing coverage rather than operating results. A strategic exit could become
              plausible if the platform converts planned capacity into diversified, creditworthy contracts and proves
              cash yields after GPU refresh obligations; an infrastructure or public-market route would additionally
              require audited segment reporting and durable leverage metrics. Before investment, obtain signed offtake
              schedules, customer concentration, utilization and pricing cohorts, project-level cash flows, debt and
              security documents, GPU refresh commitments, cap-table rights, and downside recovery cases. Thesis-break
              triggers are material slippage in the 2027 capacity plan, utilization below debt-service needs, customer
              concentration without guarantees, covenant stress, or evidence that equipment values are falling faster
              than principal amortizes.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Strategic sponsorship and financing are necessary but not sufficient: the recommendation can move toward
              invest only after a supportable entry price, senior-claim waterfall, contracted utilization, and fully
              burdened unit economics are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV014
              - CV016
          - type: callout
            title: Thesis-break condition
            body: >-
              Treat a capacity delay, covenant waiver, weak contracted utilization, or GPU collateral value falling
              faster than loan amortization as a trigger to suspend the investment thesis.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV015
