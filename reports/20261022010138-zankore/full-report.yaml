        title: Ownership, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Ooredoo Group is the founding shareholder and lead investor, with a disclosed 49% stake and an
              approximately US$800 million commitment for launch and initial development. Indosat contributes local
              infrastructure and execution, NVIDIA supplies the accelerated computing architecture and GPUs, and Nokia
              supplies AI-native networking. Public leadership visibility is much thinner than sponsor visibility.
              Vikram Sinha is identified as Zankore's director and chairman, while Aziz Aluthman Fakhroo speaks for the
              lead investor as Ooredoo Group CEO. The retained sources do not name a Zankore operating CEO, founders as
              individuals, a complete board, independent directors, or leadership changes. This leaves decision rights,
              sponsor reserved matters, and key-person dependence open for primary-document diligence.
