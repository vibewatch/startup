      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The proposed operating model combines NVIDIA DSX as the reference architecture with accelerated computing,
              networking, power, cooling, and operations in one AI-factory system. The disclosed hardware milestone is
              approximately 200 MW in the first half of 2027 using NVIDIA GB300 NVL72, within a longer-term target of up
              to 1 GW. NVIDIA DSX MaxLPS is described as dynamically optimizing power across the GPU fleet and as
              designed to enable up to 40% more compute within the same power budget. Nokia contributes AI-native
              networking, while Indosat contributes local infrastructure and execution. These are useful architecture
              and responsibility boundaries, but the sources do not publish rack topology, software interfaces, measured
              power-use effectiveness, redundancy design, or commissioning evidence.
            claimRefs:
