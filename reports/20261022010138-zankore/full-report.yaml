chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, launch, and operating model
        blocks:
          - type: paragraph
            body: >-
              Zankore was launched in August 2026 as an Indonesian AI cloud and neocloud platform developed by Indosat
              Ooredoo Hutchison, Ooredoo Group, NVIDIA, and Nokia. The retained evidence supports Indonesia as the
              initial deployment market, but it does not identify a legal headquarters or fully describe the
              incorporated entity. The operating model is infrastructure-as-a-service: Zankore intends to provide
              on-demand NVIDIA GPU clusters for training, fine-tuning, inference, and agentic workloads to enterprises,
              developers, startups, and institutions. Its disclosed status is therefore early buildout rather than
              mature operation: an initial 100 MW deployment is being financed, approximately 200 MW is targeted for the
              first half of 2027, and 1 GW remains a longer-term target.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
