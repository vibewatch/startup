      severity: minor
      topic: developer-signal
      missingEvidence: A public developer or practitioner signal such as repository activity, package usage, technical forum adoption, or named engineer implementation evidence.
      whyItMatters: The assigned successful pool contains launch, partner, and infrastructure coverage but no direct developer-signal source.
      diligencePath: Review public repositories, package registries, API documentation, developer forums, technical talks, or customer engineering references.
      relatedQuestionRefs: [QE008]
