company:
  name: Zankore
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Zankore is presented as a regional AI infrastructure and neocloud platform,
    initially deploying NVIDIA GPU capacity in Indonesia for enterprise, developer,
    hyperscaler, government, and AI-native workloads. The architecture is specific
    at the reference-design level, but public evidence does not yet establish
    production availability, customer workloads, realized performance, or the
    operational controls needed to validate the proposed scale.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      Zankore's product is GPU cloud capacity rather than a general-purpose
      application. The available descriptions identify training, fine-tuning,
      inference, and agentic workloads as intended uses, with customers ranging
      from AI-native companies and developers to enterprises, institutions,
      hyperscalers, and governments. The customer workflow is therefore to obtain
      dedicated or on-demand NVIDIA compute, run models close to regional data and
      users, and consume an integrated infrastructure service rather than assemble
      every layer independently. This is a coherent product definition, but it
      remains a launch and deployment plan: the public evidence does not disclose
      live tenants, service-level objectives, utilization, pricing, or measured
      workload outcomes. The commercial proposition should consequently be read as
      intended capacity and target segments, not verified adoption.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      The proposed operating model combines NVIDIA DSX as the reference
      architecture with accelerated computing, networking, power, cooling, and
      operations in one AI-factory system. The disclosed hardware milestone is
      approximately 200 MW in the first half of 2027 using NVIDIA GB300 NVL72,
      within a longer-term target of up to 1 GW. NVIDIA DSX MaxLPS is described as
      dynamically optimizing power across the GPU fleet and as designed to enable
      up to 40% more compute within the same power budget. Nokia contributes
      AI-native networking, while Indosat contributes local infrastructure and
      execution. These are useful architecture and responsibility boundaries, but
      the sources do not publish rack topology, software interfaces, measured
      power-use effectiveness, redundancy design, or commissioning evidence.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-dependencies-and-differentiation
    title: Maturity, dependencies, and differentiation
    body: >-
      Zankore's differentiation is primarily ecosystem and infrastructure
      integration: Ooredoo supplies capital and regional scale, Indosat supplies
      Indonesian infrastructure and execution, NVIDIA supplies GPUs, software,
      and the DSX playbook, and Nokia supplies networking. That combination can
      reduce integration burden for regional buyers and support sovereign or
      data-resident deployments. It also creates concentrated dependencies on
      NVIDIA hardware and software, telecom-site execution, power availability,
      cooling, network delivery, and partner governance. Public descriptions
      establish the partners and planned milestones, but not proprietary software,
      patent protection, independent benchmark results, completed certifications,
      or a production roadmap with acceptance criteria. The strongest current
      moat is therefore execution access and partner coordination, not yet
      independently demonstrated technical superiority.
    claimRefs: [CE010, CE011, CE012]
  - id: trust-reliability-and-diligence
    title: Trust, reliability, and diligence blockers
    body: >-
      The launch materials emphasize secure, scalable, sovereign, and trusted AI
      infrastructure, and identify governance through a board and chief executive.
      Those statements describe intended positioning rather than evidence of
      controls. No assigned source provides an uptime history, incident record,
      penetration-test result, SOC or ISO certification, data-processing terms,
      model or tenant isolation design, disaster-recovery targets, cooling
      telemetry, or customer support metrics. A financing report also notes that
      the loan's collateral was not clear and that GPU resale value could depend on
      the same demand expected to repay the loan; that is a capital and asset-risk
      consideration for the operating platform, not proof of a product defect.
      Before underwriting product maturity, diligence should obtain deployment
      acceptance records, security attestations, capacity reservations, customer
      contracts, and evidence that the first capacity milestone is operational.
    claimRefs: [CE013, CE014, CE015]
callouts:
  - calloutType: strength
    title: Integrated regional infrastructure proposition
    body: >-
      The disclosed partner model combines local telecom execution, NVIDIA
      accelerated infrastructure, Nokia networking, and Ooredoo capital in a
      single regional platform.
    claimRefs: [CE008, CE010]
  - calloutType: risk
    title: Planned scale is ahead of public operating proof
    body: >-
      Public evidence supports announced targets and partner roles, but not
      production uptime, customer utilization, realized economics, or completed
      control certification.
    claimRefs: [CE004, CE012, CE013, CE014]
