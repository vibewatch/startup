      severity: material
      topic: differentiation
      missingEvidence: Evidence of proprietary technology, patents, benchmark advantage, or exclusive supply and site access.
      whyItMatters: Partner participation can be replicated or renegotiated and does not by itself prove a durable technical moat.
      diligencePath: Request IP schedules, supply agreements, benchmark reports, site rights, and partner exclusivity terms.
