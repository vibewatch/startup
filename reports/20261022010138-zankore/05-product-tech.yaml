      severity: material
      topic: trust
      missingEvidence: Independent security, privacy, compliance, quality, and reliability attestations.
      whyItMatters: Sovereign and secure positioning is not equivalent to verified operational control.
      diligencePath: Obtain SOC or ISO reports, penetration-test summaries, data-processing terms, incident logs, and disaster-recovery tests.
