      whyItMatters: Announced MW targets do not establish that the platform is commissioned or commercially reliable.
      diligencePath: Request commissioning certificates, capacity reservations, customer contracts, utilization reports, and SLA history.
      relatedQuestionRefs: [QE005, QE009]
