  topStrengths:
    - Strategic backing combines telecom infrastructure, GPU supply, networking, and sponsor capital.
    - Public financing and capacity plans could support regional AI-compute scale if demand converts.
    - The initial Indonesia deployment has a defined near-term capacity target and identifiable buyer segments.
  topRisks:
    - Utilization, contracted demand, pricing, revenue, and customer concentration are not publicly disclosed.
    - A large debt-funded buildout creates debt-service, GPU residual-value, and refinancing exposure.
    - Vendor and sponsor concentration may limit portability, governance visibility, and downside protections.
  unresolvedGaps:
