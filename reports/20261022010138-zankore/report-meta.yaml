companyProfile:
  summary: >-
    Zankore is a newly launched Indonesia-focused AI neocloud backed by Ooredoo
    Group, Indosat Ooredoo Hutchison, NVIDIA, and Nokia. The platform is in early
    buildout, with public disclosures centered on sponsor capital, a large senior
    debt facility, and planned GPU capacity rather than operating performance.
  foundingLocation: Indonesia
  headquarters: null
  productSummary: >-
    On-demand NVIDIA GPU infrastructure and cloud-based AI compute for training,
    fine-tuning, inference, and agentic workloads, with integrated networking,
    power, cooling, and operations.
  customerFocus: >-
    Cloud customers, AI developers, enterprises, startups, and government or
    regulated users across Indonesia and the broader Southeast Asian market.
  businessModel: >-
    Planned infrastructure-as-a-service and AI neocloud capacity provision; public
    sources do not disclose pricing, utilization, or contracted revenue.
  stage: Early buildout
  fundingStatus: >-
    Ooredoo disclosed an approximately US$800 million commitment for a 49% stake;
    reporting also describes a senior term loan facility of up to US$3.1 billion.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO009, CO016]
