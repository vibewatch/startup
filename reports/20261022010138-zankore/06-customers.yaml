    type: journey-map
    summary: >-
      The disclosed commercial path moves from target segments to demand-linked capacity
      expansion, with customer proof still missing at the deployment and renewal checkpoints.
    data:
      items:
        - label: Target account
          actor: Enterprise, startup, developer, AI-native company or institution
          touchpoints: Public positioning and partner ecosystem
          detail: Named prospects, buyer roles and acquisition channels are not disclosed.
        - label: Workload qualification
          actor: Technical and infrastructure teams
          touchpoints: Training, fine-tuning, inference and agentic AI
          detail: No workload-level pipeline or customer requirement data is public.
        - label: Commercial commitment
          actor: Buyer, Zankore and financing counterparties
          touchpoints: Revenue-sharing and credit-support structure
          detail: Pricing, contract term, backlog and committed capacity are not disclosed.
        - label: Initial deployment
          actor: Zankore operations and customer technical teams
          touchpoints: Initial 100 MW infrastructure build
          detail: Commissioning, customer allocation and production use are not evidenced.
        - label: Capacity expansion
          actor: Zankore and founding partners
          touchpoints: Approximately 200 MW planned for the first half of 2027
          detail: The disclosed milestone measures planned supply rather than customer adoption.
        - label: Regional scale and renewal
          actor: Southeast Asian customers and Zankore
          touchpoints: Up to 1 GW long-term target
          detail: Utilization, renewal, expansion and concentration metrics remain undisclosed.
    approximationNotes: >-
      This is an inferred diligence journey assembled from target segments, workloads and
      capacity milestones; it is not an observed conversion funnel and carries no implied
      conversion rates.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007, CU012]
callouts:
