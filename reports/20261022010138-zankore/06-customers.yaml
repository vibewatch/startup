  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer references with deployment status, workload, contract scope and measured outcome.
      whyItMatters: Without named proof, target segments and planned capacity cannot establish production adoption or reference quality.
      diligencePath: Request a customer list and select references, then verify production status and outcomes directly with at least three customers.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: adoption-trajectory
      missingEvidence: Active customer count, commissioned capacity, customer-allocated capacity, utilization, backlog and realized customer revenue by period.
      whyItMatters: Supply milestones cannot be converted into adoption or revenue without customer and utilization denominators.
      diligencePath: Obtain monthly operating dashboards and reconcile contracted, installed, commissioned and utilized capacity to invoiced customer revenue.
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: NRR, GRR, churn, renewal rates, contract duration, cohort expansion and customer satisfaction.
      whyItMatters: These measures determine whether initial workloads persist and expand after the first contract period.
      diligencePath: Review customer-level cohorts and contracts, then calculate retention on consistent logo, revenue and compute-consumption bases.
      relatedQuestionRefs: [QU009]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-customer shares, anchor-customer commitments, backlog concentration, offtake terms and channel-sourced revenue.
      whyItMatters: A debt-funded buildout can be sensitive to delayed or concentrated demand and partner-dependent distribution.
      diligencePath: Inspect the contract register and backlog by customer, channel, capacity commitment, term, termination rights and credit support.
      relatedQuestionRefs: [QU010]
