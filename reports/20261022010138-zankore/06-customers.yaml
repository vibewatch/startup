company:
  name: Zankore
chapter:
  number: 6
  title: Customers
  summary: >-
    Zankore names a broad Southeast Asian customer universe and has tied infrastructure
    deployment to demand, but the reviewed evidence identifies no customer by name and
    discloses no production deployment, pilot, retention metric, utilization, backlog, or
    concentration measure. Planned capacity therefore demonstrates supply readiness rather
    than verified adoption.
sections:
  - id: customer-universe
    title: Customer universe and buying surface
    body: >-
      Zankore's stated market spans enterprises, startups, developers, AI-native companies
      and institutions, initially in Indonesia and then across Southeast Asia. The intended
      workloads include model training, fine-tuning, inference and agentic AI, implying a
      mixed buying surface: infrastructure or technology leaders may procure capacity,
      technical teams use it, and regulated or institutional users may value local
      deployment. Independent descriptions also use broader "cloud and enterprise
      customers" language and an Asia-Pacific frame. These are target segments, not observed
      cohorts. The sources provide no segment-level customer count, pricing, revenue mix,
      sales channel attribution or evidence that any category is already using Zankore in
      production, so strategic value by segment remains unquantified.
    claimRefs: [CU001, CU002, CU003, CU010, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named-customer proof
    body: >-
      The observable trajectory is infrastructure-led. Reporting describes an initial 100 MW
      build, an official plan for approximately 200 MW in the first half of 2027, and a
      longer-term target of up to 1 GW. Zankore also describes revenue-sharing and
      credit-support arrangements intended to align the pace of deployment with demand.
      Those milestones may create capacity for customer adoption, but they do not establish
      active users, utilization, contracted backlog or realized revenue. Ooredoo's estimate
      of approximately US$600 million in cumulative EBITDA contribution over the first five
      years is an investor projection, not a disclosed customer metric. Across the nine
      assigned sources, no customer is named and no production deployment or pilot is
      documented at contract level.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, expansion and concentration risk
    body: >-
      Public evidence does not yet support a retention or expansion thesis. None of the
      reviewed sources reports net or gross revenue retention, churn, renewals, contract
      length, cohort behavior, satisfaction, customer-level utilization, backlog, offtake or
      revenue concentration. The demand-linked financing structure makes those omissions
      material: TNW notes that inadequate contracting could leave lenders exposed to
      depreciating GPUs, while AInvest argues that anchor customers must arrive quickly
      enough to support the leveraged buildout. These are analytical warnings rather than
      evidence of actual customer loss. Diligence should therefore prioritize executed
      contracts, named references, utilization by cohort, renewal mechanics and top-customer
      exposure before interpreting planned megawatts as durable commercial traction.
    claimRefs: [CU012, CU013, CU014, CU015]
