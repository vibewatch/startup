evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Legal headquarters, incorporation records, founder identities, operating CEO, complete management team, board
      roster, shareholder rights, and leadership-change history.
    whyItMatters: >-
      Governance rights and operating accountability cannot be assessed from sponsor announcements and named
      spokespeople alone.
    diligencePath: >-
      Obtain the constitutional documents, shareholder agreement, board minutes, organization chart, delegated-authority
      matrix, and executive employment records.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Zankore revenue or run-rate, customer count and concentration, headcount, utilization, commissioned megawatts,
      pricing, and deployed location count.
    whyItMatters: Announced financing and capacity targets do not demonstrate commercial traction or current operating scale.
    diligencePath: >-
      Reconcile audited accounts, signed customer contracts, billing data, payroll, site acceptance certificates, and
      GPU-cluster telemetry.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Enterprise valuation, complete cap table, debt draw status, interest cost, maturity, amortization, covenant
      headroom, collateral coverage, and cash available.
    whyItMatters: >-
      The disclosed commitment and facility limit cannot be converted into valuation, liquidity, or runway without
      transaction documents and balances.
    diligencePath: >-
      Review executed equity and loan documents, bank statements, borrowing-base reports, covenant certificates, and the
      post-money capitalization table.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Eight distinct dated corporate milestones are not publicly supportable from the assigned pool because the company
      launched only in August 2026 and disclosures cluster around launch and financing.
    whyItMatters: >-
      The short record limits assessment of delivery cadence, regulatory progress, partnerships, and adverse events
      across a full operating cycle.
    diligencePath: >-
      Obtain the corporate milestone register, permits, procurement dates, customer acceptance records, partnership
      agreements, and incident log.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: missing-source
    severity: blocking
    topic: market-size
    missingEvidence: >-
      A public or diligence-grade SAM/SOM model with GPU-hour pricing, utilization, geography, and customer-contract
      coverage.
    whyItMatters: Capacity targets and financing commitments cannot establish addressable revenue or market share.
    diligencePath: >-
      Obtain management's bottom-up capacity, price, utilization, contracted-demand, and country-allocation model and
      reconcile it to independent market data.
    relatedQuestionRefs:
      - QM004
      - QM009
  - type: private-evidence-only
    severity: material
    topic: buyers
    missingEvidence: Named customer contracts, committed GPU volumes, service levels, and budget owners.
    whyItMatters: The buyer map is based on disclosed target segments, not evidence of realized demand or willingness to pay.
    diligencePath: >-
      Request redacted anchor-customer agreements, committed capacity, renewal terms, workload mix, and compute-specific
      SLA schedules.
    relatedQuestionRefs:
      - QM006
      - QM009
  - type: private-evidence-only
    severity: material
    topic: capacity
    missingEvidence: >-
      A dated rollout schedule tying the 100 MW initial build and 200 MW first-half-2027 milestone to specific sites,
      power, GPUs, and customer acceptance.
    whyItMatters: >-
      The public figures describe different rollout stages but do not establish commissioning or revenue-readiness
      dates.
    diligencePath: Reconcile the build plan with a dated site, power, GPU-delivery, commissioning, and customer-acceptance schedule.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Published or diligence-provided GPU-hour pricing, minimum commitments, egress fees, and utilization assumptions.
    whyItMatters: >-
      Without pricing and utilization, the financing burden cannot be translated into market attractiveness or unit
      economics.
    diligencePath: >-
      Request a unit-economics bridge by GPU generation and workload, including power cost, depreciation, financing
      cost, utilization, and realized price.
    relatedQuestionRefs:
      - QM004
      - QM009
  - type: missing-source
    severity: blocking
