- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Global insights industry
    - Market research, research software, and reporting/analytics
    - Pure ERP, CRM, and generic cloud AI spend
    - Chief insights officers, strategy teams, analytics budgets
    - Useful top-of-funnel ceiling for the broad ecosystem around Simile.
  - - Core market research sector
    - Primary and secondary research services
    - Research software and analytics-only subscriptions
    - Research leads, consumer insights, agencies
    - Captures traditional survey, interview, and focus-group budgets that Simile may displace.
  - - Purchased research services
    - Outsourced research contracts and related service revenue
    - Internal research labor and software already owned
    - Brand, product, growth, and innovation leaders
    - Closest public proxy for what buyers already spend externally on decision support.
  - - Synthetic data market
    - Privacy-safe synthetic datasets, digital-twin tooling, simulation infrastructure
    - General-purpose AI applications without data-generation components
    - Data science, AI platform, and governance budgets
    - Relevant because Simile benefits from the same validation and privacy tailwinds.
  - - AI-moderated human research
    - AI-assisted interviews, survey design, and synthesis with real participants
    - Fully synthetic personas without human respondents
    - UX research, product, and brand teams
    - Competes for the speed-to-insight problem even when buyers reject synthetic populations.
  - - Enterprise decision simulation wedge
    - Behavior prediction for pricing, messaging, policy, and launch scenarios
    - Commodity survey software and generic chatbot assistants
    - High-stakes enterprise research and strategy buyers
    - Best fits Simile’s actual current product framing and likely near-term SAM.
  notes: Separates ecosystem-level TAM narratives from the narrower enterprise simulation wedge that looks most relevant to Simile today.
