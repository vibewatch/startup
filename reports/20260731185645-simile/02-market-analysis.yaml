- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Need for faster cycles and cheaper screening
    - positive
    - near-term
    - Supports early adoption in concept, message, and journey pretesting
    - How much time and live-research budget does Simile actually save for buyers?
  - - Privacy and compliance pressure
    - positive
    - near-term
    - Makes privacy-safe simulation more attractive than uncontrolled third-party data use
    - What data-governance commitments and contracts are required for custom populations?
  - - Hard-to-reach or expensive populations
    - positive
    - near-term
    - Improves value proposition where real recruitment is slow, costly, or sensitive
    - Which segments show the largest delta versus traditional recruiting economics?
  - - Buyer skepticism and fear of overtrust
    - negative
    - current
    - Can slow conversion, restrict use cases, and force higher proof burdens
    - What validation materials consistently unblock enterprise procurement?
  - - Bias, shallow outputs, and loss of emotional nuance
    - negative
    - current
    - Limits use in high-stakes decisions that need rich human context
    - How does Simile measure subgroup drift and failure cases over time?
  - - Lack of governance and standards
    - negative
    - medium-term
    - Creates reputational and regulatory risk if synthetic findings are presented as human evidence
    - What internal and customer-side usage guardrails are mandatory?
  notes: Pairs each growth tailwind with a concrete adoption blocker because the category expands only if buyers trust the output enough to act on it.
