  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-definition
    missingEvidence: No public bottom-up segmentation of how much spending sits specifically in behavior-simulation workflows was found.
    whyItMatters: A precise SAM matters for judging whether Simile can grow into its valuation without assuming it captures broad unrelated research spend.
    diligencePath: Request pipeline data by vertical, use case, contract value, and replacement budget from management.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-conversion
    missingEvidence: Public sources show buyer categories and examples, but not win rates, procurement steps, or adoption-time benchmarks by segment.
    whyItMatters: Without conversion data, it is hard to know whether the apparent TAM can convert into repeatable bookings.
    diligencePath: Request funnel conversion by vertical and average time from pilot to paid deployment.
    relatedQuestionRefs:
    - QM009
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: market-validation
    missingEvidence: No independent public source directly sizes the behavior-simulation software category as distinct from synthetic data or general research services.
    whyItMatters: Category ambiguity can inflate TAM rhetoric and make valuation comparisons sloppy.
    diligencePath: Look for analyst notes, procurement datasets, or comparable public-company disclosures that isolate behavior-simulation budgets.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM001
  - type: stale
    severity: minor
    topic: adoption-data
    missingEvidence: Researcher adoption statistics are current for 2026 but still reflect an early market with shifting terminology and vendor mix.
    whyItMatters: Rapid category change can make today’s usage shares poor predictors of enterprise buying two years from now.
    diligencePath: Refresh adoption and buyer-intent surveys before the next report revision.
    relatedQuestionRefs:
    - QM013
    - QM014
    - QM017
