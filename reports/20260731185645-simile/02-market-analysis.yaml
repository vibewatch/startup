chapter:
  number: 2
  title: Market Analysis
  summary: Simile sells into a broad and growing insights ecosystem, but its usable market is narrower than either the full market-research industry or the full synthetic-data market. The strongest near-term demand comes from high-stakes enterprise workflows where companies value faster iteration, hard-to-reach populations, privacy-safe experimentation, and validation layers that can complement — not replace — direct human research.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, adjacencies, and substitutes
  body: 'Simile should not be sized as a generic LLM company. The reviewed evidence places it at the intersection of four adjacent pools of spend: outsourced market-research services, research software, synthetic-data infrastructure, and AI-assisted decision tooling. ESOMAR’s 2024 framing is especially useful because it separates the broader insights industry from the narrower core market-research sector, while Simile’s own materials and Financial Narrative suggest the product is trying to take budget from panels, surveys, focus groups, and some consulting-style market testing. At the same time, the substitute set is broader than traditional research alone. AI-moderated human-interview platforms such as UserTesting, Outset, Listen Labs, YouGov, and Toluna compete for the same speed-to-insight problem without asking buyers to trust fully synthetic populations. That means Simile’s real market boundary is not “all research” but the subset of research and strategy decisions where simulated humans
    can generate enough trustworthy directional value to change budget allocation.'
  claimRefs:
