- id: moat-durability-and-displacement-risk
  title: Moat durability and displacement risk
  body: >
    The adverse evidence is meaningful. Nielsen Norman Group and AIMultiple both frame synthetic users as best suited to hypothesis generation or early-stage testing rather than as full replacements for high-stakes human research. Synthetic Users explicitly markets itself as a discovery copilot, and Gallup says simulated responses will not be used for published population estimates. Those signals imply that part of the category may settle into a workflow-acceleration niche instead of displacing core research budgets. At the same time, startup peers are converging on similar claims around digital twins, validation, and inaccessible audiences, while incumbents can embed synthetic features inside existing platforms and bundle them with trusted human panels. Simile therefore needs its confidence model, validation cadence, customer outcomes, and domain-specific data partnerships to keep compounding faster than the field commoditizes. If buyers conclude that synthetic outputs are interchangeable or only safe for low-regret decisions, incumbent platforms and AI-moderated human tools could compress Simile’s pricing power and narrow its serviceable wedge.
