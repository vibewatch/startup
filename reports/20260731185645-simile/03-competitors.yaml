- id: distribution-data-and-switching-costs
  title: Distribution, data access, and switching costs
  body: >
    Simile’s strongest potential moat is not that competitors lack AI, but that few have both proprietary behavioral grounding and access to enterprise first-party data in workflows consequential enough to matter. UserTesting, Qualtrics, Nielsen, Kantar, Toluna, and YouGov already own procurement relationships, existing budgets, and long histories with research and insights teams. Human-panel platforms such as Respondent and Prolific have supply-side advantages in participant recruitment and verification. Synthetic startups counter by promising that hard-to-reach audiences can be modeled or expanded faster than they can be recruited, with Fairgen, Viewpoints.ai, Evidenza, Brox, and Artificial Societies each making variants of that argument. Simile’s enterprise advantage comes if customers believe custom twins built on consented and domain-specific data outperform generic or lightly targeted synthetic personas. But the switching cost remains two-sided: customers must trust the model outputs, and Simile must preserve access to proprietary data sources, recalibration workflows, and customer references that incumbents or model vendors cannot instantly clone.
  claimRefs:
  - CP021
