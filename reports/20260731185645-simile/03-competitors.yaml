- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Custom behavior twins grounded in first-party data
    - Incumbents can add synthetic layers while keeping panel and survey trust
    - high
    - Prove materially better prediction on customer-specific decisions, not just generic parity studies.
  - - Confidence model and weekly recalibration
    - Peers can make similar validation claims without publishing enough methodology
    - medium
    - Show failure cases, subgroup error bands, and refresh economics customer by customer.
  - - Hard-to-reach audience coverage
    - Recruitment platforms can still win if buyers insist on real participants for critical studies
    - high
    - Demonstrate where synthetic coverage changes economics enough to justify substitution.
  - - Speed and lower research overhead
    - AI-moderated human-research vendors already compress interviews into hours or days
    - high
    - Keep advantage on turnaround while preserving auditability and decision confidence.
  - - Consequential decision support
    - Reviewers and customers may confine synthetic tools to early exploration only
    - high
    - Win documented production use cases where outputs changed shipped products, messaging, or policy.
  notes: The moat is only durable if Simile compounds proprietary data, validation evidence, and enterprise trust faster than peers embed similar capabilities.
