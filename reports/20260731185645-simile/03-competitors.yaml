  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-accuracy-benchmarks
    missingEvidence: Public apples-to-apples accuracy, calibration, and subgroup error comparisons across Simile and synthetic-user peers are not available.
    whyItMatters: Without normalized benchmarks, competitive claims are hard to underwrite beyond marketing narratives.
    diligencePath: Request blinded head-to-head customer pilots, subgroup validation tables, and failure-case disclosure from Simile and direct peers.
    relatedQuestionRefs:
    - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: pricing-comparison
    missingEvidence: Most reviewed enterprise vendors hide realized pricing, discounting, and seat or project structure behind demos.
    whyItMatters: Price opacity makes it hard to estimate switching friction and land-and-expand mechanics.
    diligencePath: Collect customer proposals, procurement screenshots, and sample order forms for direct competitors.
    relatedTableRefs:
    - TP003
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: customer-outcome-proof
    missingEvidence: Public customer case studies quantifying ROI or decision lift for Simile versus named alternatives remain limited.
    whyItMatters: Distribution and trust advantages depend on outcome proof, not category rhetoric alone.
    diligencePath: Obtain win-loss data, deployment retention, and customer references comparing Simile against incumbent and AI-moderated alternatives.
