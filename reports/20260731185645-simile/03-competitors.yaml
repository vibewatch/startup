- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Qualtrics
    - Incumbent experience-management and survey platform
    - Global enterprise platform; used by healthcare systems and governments
    - Enterprise insights, CX, EX, and research teams
    - Synthetic audiences layered onto large survey and experience stack
    - Broader platform scope can make it less focused on behavior-simulation depth.
  - - Nielsen
    - Incumbent measurement and panel provider
    - 750K+ panel participants globally
    - Media, audience, and enterprise measurement buyers
    - Longstanding panel-based measurement and validation trust
    - Primarily oriented to measurement and media workflows, not bespoke synthetic twins.
  - - Kantar
    - Incumbent market-research and brand-intelligence provider
    - 4.3M consumers in BrandZ and billions of consumer data points
    - Brand, innovation, and insights teams
    - Large historical consumer datasets and brand measurement programs
    - Traditional-service model can be slower and more expensive than simulation-first tools.
  - - UserTesting
    - AI-moderated human-research platform
    - 6M+ participants and Forrester-cited ROI study
    - Product, UX, design, and digital teams
    - Real human feedback with AI-assisted setup and synthesis
    - Competes on speed but still depends on recruiting and human participation.
  - - Listen Labs
    - AI-moderated human-research platform
    - 30M+ participant network and $100M raised to date
    - Consumer-insights and product teams
    - AI interviewer plus overnight reporting
    - Trust still anchored in moderated human interviews rather than population simulation.
  - - Synthetic Users
    - Synthetic-user startup
    - Pricing advertised per interview; parity claims from independent comparisons
    - PM, marketing, agency, and innovation teams
    - Discovery copilot with multi-agent synthetic interviews
    - Explicitly not positioned as a replacement for final validation.
  - - Fairgen
    - Synthetic audience and hybrid-boost platform
    - Enterprise and professional-services deployment focus
    - Brand, product, pricing, and customer-discovery teams
    - Private twins and hybrid quant expansion based on prior studies
    - Strong emphasis on augmentation rather than fully autonomous decision simulation.
  - - Evidenza
    - Synthetic market-research startup
    - 100+ validations and enterprise brand references
    - Brand, segmentation, and market-expansion teams
    - Hard-to-reach audience simulation with published validation anecdotes
    - Evidence is vendor-authored and still concentrated in marketing use cases.
  - - Artificial Societies
    - Network-simulation startup
    - 2.5M+ AI personas and strategic-comms focus
    - Public affairs, reputation, investor-relations, and innovation teams
    - Simulates opinion formation in groups rather than isolated respondents
    - Skews toward communications and stakeholder scenarios more than broad enterprise research.
  notes: Profiles the main alternative ways to solve the same decision-support job, mixing incumbents, AI-assisted human research, and synthetic-user specialists.
