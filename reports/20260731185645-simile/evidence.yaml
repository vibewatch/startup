evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board list, independent-director mix, and committee structure were not found in reviewed public sources.
    whyItMatters: Founder concentration and governance quality affect decision-making, oversight, and investor protections.
    diligencePath: Request a current board deck or cap-table governance summary from the company.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, cash balance, burn, gross margin, and any debt or credit facilities were not publicly disclosed.
    whyItMatters: >-
      The company overview can signal momentum but cannot underwrite economics or capital adequacy without these
      figures.
    diligencePath: Request management financials, bank covenant schedules, and a current monthly KPI pack.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: filings
    missingEvidence: >-
      An unambiguous filing that clearly maps the Palo Alto startup's financing to a verified legal entity was not
      identified.
    whyItMatters: >-
      Without a clear filing trail, investors rely mainly on company and press disclosures for round structure and legal
      identity.
    diligencePath: >-
      Request the company's exact legal entity name and verify Form D or related filing history directly against that
      name and CIK.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration
    missingEvidence: >-
      Public sources name several enterprise customers but do not disclose customer count, contract length, or
      concentration by revenue.
    whyItMatters: Named logos show market credibility but do not establish durability or diversification of revenue.
    diligencePath: >-
      Request cohort retention, top-customer concentration, and average contract-value data in the customer diligence
      workstream.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-definition
    missingEvidence: >-
      No public bottom-up segmentation of how much spending sits specifically in behavior-simulation workflows was
      found.
    whyItMatters: >-
      A precise SAM matters for judging whether Simile can grow into its valuation without assuming it captures broad
      unrelated research spend.
    diligencePath: Request pipeline data by vertical, use case, contract value, and replacement budget from management.
    relatedQuestionRefs:
      - QM021
      - QM025
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
