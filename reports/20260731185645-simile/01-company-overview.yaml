  - FO003
- id: founders-and-research-roots
  title: Founders, research pedigree, and governance visibility
  body: 'The founder set is one of Simile’s strongest public assets. Joon Sung Park is both the public face of the company and the lead author behind the generative-agents work that made synthetic human-behavior simulation legible to a mainstream AI audience. Percy Liang and Michael Bernstein add Stanford credibility from foundation-model research and human-computer interaction, which helps explain why investors and early enterprise customers treat Simile as more than a marketing wrapper on top of a generic LLM. At the same time, the public record remains much richer on the research pedigree than on the company’s board structure, broader executive bench, or internal governance controls. There is also little public detail on formal risk oversight, committee structure, or any independent directors. That asymmetry is important: the pedigree is unusually strong, but the governance picture is still founder-heavy and partly opaque from public evidence alone.'
  claimRefs:
  - CO019
  - CO020
  - CO021
  - CO022
