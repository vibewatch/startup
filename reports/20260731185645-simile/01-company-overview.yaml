- id: milestones-validation-and-cautions
  title: Milestones, validation posture, and caution flags
  body: 'The most credible part of Simile’s story is that it does not rely only on generic AI marketing language. Public materials and external coverage repeatedly point to weekly validation, a confidence model, and academic work that measured agent performance against human self-retest consistency rather than claiming perfect prediction. Customer-side evidence from CVS and Gallup also emphasizes simulation as a screening and prioritization layer, not a full replacement for direct human measurement. That nuance matters because some of the strongest outside commentary is also skeptical: TechCrunch called the dream of simulating all eight billion people ''preposterous,'' Gallup explicitly warns that simulated responses should not replace probability-based published measures, and public financing disclosure still depends largely on company and media sources rather than unambiguous filings. Just as importantly, those same sources leave open how quickly accuracy decays in new domains and how much internal governance sits behind the public claims. The overview therefore supports a balanced baseline for the rest of the report: Simile has differentiated
    technical roots and real enterprise traction, but the claims still need to be interpreted through persistent private-company opacity and the inherent uncertainty of modeling human behavior today.'
