company:
  name: Simile
chapter:
  number: 1
  title: Company Overview
  summary: Simile is a Palo Alto-based private AI company that sells behavior simulations built from synthetic populations and agentic twins. By July 2026 it had raised more than $300 million across a $100 million Series A and a $200 million-plus Series B at a $2 billion valuation, while publicly tying its product to Stanford generative-agent research, enterprise deployments, and unusually explicit validation claims.
sections:
- id: identity-and-business-model
  title: Identity, mission, and product framing
  body: Simile presents itself as a company building a foundation model for human behavior rather than another model for text generation. The official site and blog repeatedly frame the product as a way for enterprises to create synthetic populations and query 'agentic twins' before they launch products, messages, prices, or policies in the real world. That positioning matters because it defines Simile as decision infrastructure for research and strategy, not merely as a survey tool or workflow copilot. The company’s own materials also make clear that it is trying to move from one-off customer-response simulation toward broader market and multi-agent simulation over time. For diligence purposes, the core identity is therefore a private enterprise AI software company selling simulation access, custom data grounding, and confidence-scored behavioral forecasts to large organizations.
  claimRefs:
