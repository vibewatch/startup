  - TO002
- id: capital-scale-and-customer-proof
  title: Capital base, scale signals, and early customer proof
  body: 'Publicly disclosed financing moved very quickly. Within roughly five months of public launch, Simile went from a $100 million Series A to a more than $200 million Series B at a $2 billion post-money valuation, taking disclosed funding above $300 million. Management and coverage sources also line up around several unusually ambitious scale claims for such a young company: 5x revenue growth since launch, 50-plus employees, tens of millions of simulations run for Fortune 100 enterprises, and named production or at-scale users including CVS Health, Gallup, Wealthfront, Deloitte, Banco Itaú, Suntory Beverages & Food, and Garnett Station Partners. Those data points do not prove durable economics, but they do show that Simile already has large-enterprise attention, strategic investor overlap, and enough deployment evidence to treat it as a serious commercial company rather than a purely academic spinout.'
