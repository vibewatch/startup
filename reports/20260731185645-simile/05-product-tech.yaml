- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Human-data collection layer
    - Gathers interviews, surveys, and participant submissions
    - Recruitment platforms, participant consent, customer data access
    - Sampling bias or weak consent quality can corrupt downstream simulations.
  - - Behavioral grounding layer
    - Converts self-reports and observed behavior into agent representations
    - Foundation model training, proprietary datasets, feature engineering
    - Grounding quality may vary by domain and subgroup.
  - - Agent architecture layer
    - Preserves context through memory, retrieval, reflection, and planning
    - LLM substrate plus orchestration logic
    - Plausible narratives can mask low factual or behavioral calibration.
  - - Validation and confidence layer
    - Compares outputs with real human distributions and predicts trustworthiness
    - Weekly evaluation loops, TVD or similar metrics, calibration infrastructure
    - Confidence scores can themselves be miscalibrated in novel settings.
  - - Customer deployment layer
    - Lets teams run comparable scenarios and inspect output
    - Enterprise UI, services, workflows, and customer success
    - Human misuse or over-trust can create product and reputational risk.
  notes: Separates the commercial platform into the minimum architecture required to explain how it works end to end.
