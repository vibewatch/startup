  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-architecture
    missingEvidence: Public materials do not disclose detailed security architecture, model isolation, or customer access controls for raw submissions.
    whyItMatters: Enterprise adoption in healthcare and financial services depends on more than marketing-level trust language.
    diligencePath: Request security architecture diagrams, retention schedules, access-control policies, and third-party audit reports.
    relatedQuestionRefs: [QE025]
  - type: missing-source
    severity: material
    topic: validation-methodology
    missingEvidence: Simile states that it runs 7,000+ weekly evaluations and predicts accuracy, but public methodology and error-band detail are limited.
    whyItMatters: The product's main moat is confidence-calibrated simulation, so weak validation disclosure weakens the entire technical case.
    diligencePath: Request subgroup scorecards, calibration curves, and historical drift reports by use case.
  - type: stale
    severity: minor
    topic: developer-surface
    missingEvidence: Available developer signal comes from the 2023 research repository rather than from an up-to-date commercial developer surface.
    whyItMatters: It limits external visibility into current implementation maturity and release velocity.
    diligencePath: Ask for product changelogs, API references, status pages, and customer integration docs.
