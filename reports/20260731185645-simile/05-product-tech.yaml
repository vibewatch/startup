- id: TE001
  title: Product module / asset matrix
  columns:
  - module/asset
  - user
  - status/maturity
  - differentiation
  - diligence gap
  rows:
  - - Population builder
    - Research and insights teams
    - Publicly described and in active customer use
    - Starts with real people and proprietary study design rather than generic prompting
    - Need evidence on dataset composition by vertical and geography.
  - - Custom twin training
    - Enterprise customers with first-party data
    - Publicly described and likely high-touch
    - Customer-governed loyalty, balance, or telemetry data can personalize the model
    - Need contract terms for data rights, retention, and model isolation.
  - - Scenario comparison engine
    - Product, CX, strategy, and policy teams
    - Production-facing based on customer examples
    - Compares pricing, messaging, service, and policy variants on the same simulated population
    - Need reproducibility evidence across repeated runs and scenario perturbations.
  - - Confidence and validation layer
    - Decision makers and researchers
    - Core differentiator claimed publicly
    - Predicted-accuracy score backed by weekly validations and distributional checks
    - Need subgroup error bands and false-confidence rates.
  - - Product-research participation workflow
    - Participants and research operators
    - Newly documented workflow surface
    - Supports text, audio, video, and shipped-product research submissions
    - Need clarity on share of revenue and operational burden versus core simulation software.
  notes: Maps Simile's public product into functional modules rather than treating the company as a single undifferentiated model.
