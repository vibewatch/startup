- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Pre-screen product or message ideas
    - Run surveys, concept tests, or focus groups sequentially
    - Simulate comparable scenarios on the same population first
    - Faster narrowing of options before live fieldwork
    - Still needs human validation before final launch.
  - - Improve patient adherence or care experience
    - Recruit patients slowly and run expensive pilots
    - Model reminders, journeys, and experience drivers before a pilot
    - Can test sensitive or hard-to-reach populations safely
    - Healthcare use still depends on careful privacy and human confirmation.
  - - Enter a new market or segment
    - Commission traditional research and expert judgment
    - Query custom populations built from behavioral and enterprise data
    - Compresses exploration cycle and reveals segment differences quickly
    - Accuracy outside represented populations remains a major diligence point.
  - - Rehearse executive or policy communication
    - Use consultants, panels, and static personas
    - Run simulated reactions to scenarios or arguments
    - May expose second-order effects earlier in planning
    - Public evidence on consistent production outcomes remains limited.
  notes: Focuses on the customer job to be done and how Simile changes the operating workflow.
