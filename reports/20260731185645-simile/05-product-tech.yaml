- id: trust-privacy-and-quality-controls
  title: Trust, privacy, safety, and quality controls
  body: >
    Simile’s trust posture is unusually central to product quality. Its privacy and participant terms show the company collecting personal information, usage data, and in many cases raw text, audio, and video submissions that can be used to generate a text-based “agent” and disclosed to third-party customers. The participant agreement assigns broad rights in those submissions to Simile, prohibits contributors from using bots or AI tools to fabricate responses, and routes many disputes into arbitration. The product-research version of the agreement goes further by disclaiming responsibility for shipped consumer products and placing product-safety and recall monitoring primarily on manufacturers and participants. These controls may be commercially necessary, but they also illustrate why Simile needs strong governance, data handling, and customer-side guardrails. NIST’s AI risk-management guidance and its privacy-and-AI materials reinforce the same point: when an AI system is used to inform consequential decisions, transparency, data governance, and calibrated uncertainty are not optional add-ons. Simile’s own language about confidence scores, weekly recalibration, and human grounding is directionally aligned with that standard, but the public record still leaves meaningful diligence gaps around security architecture, retention controls, and how much raw participant material customers can access.
