- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control/certification/quality metric
  - status
  - scope
  - gap
  rows:
  - - Weekly validations across 7,000+ evaluations
    - Publicly claimed
    - Simulation accuracy across subpopulations and enterprise use cases
    - Need methodology, pass/fail thresholds, and longitudinal drift disclosure.
  - - Privacy notice and participant privacy notice
    - Publicly posted
    - Data collection, sharing, retention logic, and international-transfer disclosures
    - Security architecture and customer-access controls remain only partially disclosed.
  - - Participant anti-bot rule and submission ownership terms
    - Publicly posted
    - Quality control over submitted source material and IP assignment
    - Enforcement mechanics and participant auditing are not described.
  - - Product-research disclaimers and recall allocation
    - Publicly posted
    - Defines risk allocation for shipped consumer products in product studies
    - Creates reputational exposure if a product-related incident implicates the research workflow.
  - - NIST-aligned governance expectations
    - External benchmark, not company certification
    - Calls for trustworthy AI, privacy, calibration, and risk management
    - No public evidence yet of formal certification or third-party audit against this benchmark.
  notes: Public controls are meaningful but still leave large diligence gaps around implementation depth and external assurance.
