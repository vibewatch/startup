- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Revenue base and recognized revenue mix
    - Cannot judge whether 5x growth is meaningful or mostly services-driven
    - Request audited or management-reported revenue bridge and deferred-revenue rollforward.
  - - Gross margin and cost-to-serve
    - Cannot assess software-like scalability versus research-agency economics
    - Request gross margin by workflow and support intensity.
  - - Sales efficiency and contract structure
    - Cannot assess repeatability of enterprise GTM motion
    - Request pipeline conversion, ACV, renewal, and sales-cycle data.
  - - Cash balance, burn, and runway
    - Cannot underwrite financing sufficiency or timing of next raise
    - Request cash-on-hand, monthly burn, and hiring/compute budget.
  - - Legal-entity and filing chronology
    - Filing evidence may be misattributed if the Brooklyn Simile Inc. is not the same company
    - Resolve cap table, incorporation history, and predecessor entities with counsel.
  notes: These blockers matter more than fine-grained modeling because current public metrics are sparse.
