  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: tr001-regulatory-coverage
    missingEvidence: TR001 is a material legal-risk register built from public sources, not a complete inventory of every jurisdiction, contract clause, or potential enforcement vector.
    whyItMatters: Investors could over-read the table as exhaustive even though privacy, consumer-protection, and cross-border AI rules continue to evolve.
    diligencePath: Expand the legal review with jurisdiction-specific privacy counsel, customer contract sampling, and a formal compliance matrix.
    relatedQuestionRefs: [QR001, QR030]
    relatedTableRefs: [TR001]
  - type: private-evidence-only
    severity: blocking
    topic: subgroup-calibration-and-failure-cases
    missingEvidence: Public sources do not show subgroup error curves, confidence-model miss rates, or a catalog of failed use cases.
    whyItMatters: The biggest product risk is believable wrongness in important segments or contexts.
    diligencePath: Request calibration curves, subgroup validation tables, customer red-team exercises, and examples where Simile limited use.
    relatedQuestionRefs: [QR015, QR028, QR030]
  - type: private-evidence-only
    severity: blocking
    topic: security-architecture-and-audits
    missingEvidence: No public evidence was reviewed for architecture diagrams, SOC reports, penetration-test results, or customer-level access controls.
    whyItMatters: Sensitive participant inputs and customer data create material privacy and incident risk.
    diligencePath: Request third-party audits, architecture overviews, incident-response runbooks, and least-privilege access descriptions.
    relatedQuestionRefs: [QR016, QR028, QR030]
  - type: missing-source
    severity: material
    topic: legal-entity-history
    missingEvidence: Public SEC data show a Simile Inc. filing trail, but entity continuity with the current startup is unresolved.
    whyItMatters: Corporate-history uncertainty can affect cap-table, legal, and financing diligence.
    diligencePath: Reconcile filings, formation documents, predecessor entities, and board approvals with counsel.
    relatedQuestionRefs: [QR022, QR023, QR030]
