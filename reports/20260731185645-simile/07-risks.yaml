- id: partner-customer-and-execution-risk
  title: Partner, customer, and execution risk
  body: >
    Simile also depends on a chain of counterparties and internal capabilities that could fail independently of the model. The product relies on recruitment platforms, customer first-party data, validation partnerships, and anchor enterprise customers willing to share enough information to build useful populations. Those dependencies can be advantages while relationships are strong, but they are also concentration points. CVS is simultaneously a marquee customer, a rich data use case, and connected to the cap table via CVS Health Ventures. Gallup provides methodological legitimacy but also a public reminder that simulations should remain bounded. If either kind of relationship weakens, Simile could lose reference value, model-improvement opportunities, or category credibility faster than a typical horizontal SaaS startup. The execution challenge is equally serious. A science-first company led by high-profile researchers still has to build repeatable enterprise GTM, support, governance, and customer-success machinery. The open research repo proves intellectual lineage, but the commercial product itself remains largely closed to outside inspection. That opacity is understandable, yet it increases diligence burden because investors must trust internal processes that public artifacts cannot independently verify.
  claimRefs:
  - CR023
